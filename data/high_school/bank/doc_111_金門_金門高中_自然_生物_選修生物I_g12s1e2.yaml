    content: 5的DNA序列和卵的細胞核相同
  - label: D
    content: 發現調控基因的物質主要位於細胞核中
  - label: E
    content: 此實驗目的是找出調控細胞分化的特定基因
  assets:
  - key: s2_41_f1
