- id: doc_111_金門_金門高中_自然_生物_選修生物I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列何者過程，為呼吸作用最主要產生ATP的過程？
  options:
  - label: A
    content: 糖解作用
  - label: B
    content: 乙醯輔酶的生成
  - label: C
    content: 檸檬酸循環
  - label: D
    content: 電子傳遞鏈
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)一分子葡萄糖，糖解作用產生2ATP；(B)產生2NADH；(C)產生NADH及$FADH_{2}$。故選(D)。
