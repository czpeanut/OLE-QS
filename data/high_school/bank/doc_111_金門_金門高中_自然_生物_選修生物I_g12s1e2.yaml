  stem: 動物的所有細胞皆由受精卵進行有絲分裂產生，故所有細胞內的遺傳物質皆相同，但最終分化成不同的細胞。1962年科學家將完全分化的青蛙小腸上皮細胞的細胞核取出，注射到已去核的卵中，結果發現這個置換過細胞核的卵，可以發育成完整的青娃，而非發育成皮膚。實驗結果顯示，已分化動物細胞的細胞核具有全能性，細胞分化後並未失去任何遺傳物質，只是這些分化細胞內的基因受到不同的調控，有不同程度的表現，造成細胞具有不同的特性。而青蛙小腸上皮細胞的細胞核在卵細胞質內某些物質的刺激下，可讓細胞核恢復全能性，使卵細胞發育成完整的個體。根據此文，試問關於此實驗的敘述下列哪些正確？（2個答案）
