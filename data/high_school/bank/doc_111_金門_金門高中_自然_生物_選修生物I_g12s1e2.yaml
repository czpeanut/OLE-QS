questions:
- id: doc_111_金門_金門高中_自然_生物_選修生物I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 甲：RNA、乙：豬油、丙：不飽和脂肪酸、丁：纖維索、戊：核糖、己：抗體、庚：核糖體。甲～庚為細胞中的各種化學物質，關於甲～庚的相關敘述，下列何者正確？
  options:
  - label: A
    content: 分子大小：丙＞乙
  - label: B
    content: 甲中具有戊成分
  - label: C
    content: 庚戊皆只存在細胞核
  - label: D
    content: 戊為組成庚的小分子單位
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)豬油是由甘油跟脂肪酸合成，所以乙>丙；(C)核糖體存在細胞質；(D)核糖體是由RNA及蛋白質組合而成。故選(B)。
- id: doc_111_金門_金門高中_自然_生物_選修生物I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 脂質的種類和功能配對何者正確？
  options:
  - label: A
    content: 磷質：蜂巢的成分
  - label: B
    content: 中性脂：細胞膜材料
  - label: C
    content: 固醇類：胰島素的材料
  - label: D
    content: 三酸甘油路：儲存能量
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)成分為蜂蠟；(B)磷脂為細胞膜材料；(C)胰島素材料為蛋白質。故選(D)。
