- id: doc_111_金門_金門高中_自然_生物_選修生物I_g12s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 關於細胞衰老的相關敘述，下列何者正確？
  options:
  - label: A
    content: 和基因突變無關
  - label: B
    content: 對生物有保護意義
  - label: C
    content: 和端粒長度為正相關
  - label: D
    content: 自由基可減緩衰老速度
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)有關；(C)負相關，老化程度越高，端粒越短；(D)增加。故選(B)。
