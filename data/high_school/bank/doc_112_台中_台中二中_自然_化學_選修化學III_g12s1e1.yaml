  stem: 反應2 $SO_{2}$＋$O_{2}$ ⇌ 2 $SO_{3}$ 達到平衡後，再向反應容器中充入含氧同位素$^{18}$O的氧氣，經過一段時間後，$^{18}$O原子存在於下列哪些分子中？（原來的氧原子均為$^{16}$O）
  options:
  - label: A
    content: 僅$O_{2}$
  - label: B
    content: 僅$SO_{3}$
  - label: C
    content: 僅$O_{2}$和$SO_{3}$
  - label: D
    content: 含有$O_{2}$、$SO_{2}$及$SO_{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 平衡可左右來回反應，使$^{18}$O的原子隨著反應在三個物質間都出現。故選(D)。
