  stem: 已知平衡系$N_{2}O_{4}$(g) ⇌ $2NO_{2}$(g) 甲：0.08 mol的$NO_{2}$置入1升的密閉容器中 乙：0.04 mol的$N_{2}O_{4}$置入1升的密閉容器中 丙：0.04 mol的$NO_{2}$置入0.5升的密閉容器中 則定溫下達平衡時，下列敘述何者正確？
  options:
  - label: A
    content: 壓力：甲＝乙＝丙
  - label: B
    content: 氣體莫耳數：甲＞乙＝丙
  - label: C
    content: 顏色深淺：甲＞乙
  - label: D
    content: 顏色深淺：甲＞丙
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 甲：$NO_{2}$起始濃度＝0.08 M；乙：$N_{2}O_{4}$起始濃度＝0.04 M；丙：$NO_{2}$起始濃度＝0.08 M。假設乙系統先向右完全反應，則可得0.08 M的$NO_{2}$，故此三系統的平衡狀態、各物質濃度、顏色深淺、壓力都會相同，氣體莫耳數則是甲＝乙＞丙。故選(A)。
