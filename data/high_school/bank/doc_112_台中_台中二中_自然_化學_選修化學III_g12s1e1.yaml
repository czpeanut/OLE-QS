- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '承上題，於常溫下，將含有2 $NO_{2}$(g) ⇌$N_{2}O_{4}$(g) 達到平衡的混合氣體，取出等體積氣體，分別通入附有活塞的兩支注射針筒（A與B），另取一支同樣的注射針筒C抽進等體積的空氣後，三支注射針筒的壓力，一直保持與外界壓力一樣。則下列敘述中，哪些正確？ (甲)將針筒A、C置入<u>熱水</u>中達平衡時：氣體體積A＞C＞B；氣體莫耳數A＞C＝B (乙)此實驗用濃硝酸製備二氧化氮過於危險，改用稀硝酸較好 (丙)當針筒A在熱水中平衡時，顏色深淺A＞B (丁)同溫下，針筒A內$NO_{2}$的莫耳數和針筒C內空氣的莫耳數相同

    | 試管編號 |  |

    | --- | --- |

    | A | 10 mL 混合氣體 |

    | B | 10 mL 混合氣體 |

    | C | 10 mL 空氣 |'
  options:
  - label: A
    content: 乙、丙
  - label: B
    content: 乙、丙、丁
  - label: C
    content: 甲、丙
  - label: D
    content: 甲、乙、丙
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)加熱後A、C管氣體體積本就會膨脹，而混合氣體發生分解反應故氣體莫耳數再度增加，故體積會最大，B則維持不變。故A莫耳數增加，B、C莫耳數則維持不變，此選項正確；(乙)稀硝酸與銅反應產生NO，不適用；(丙)加熱時會導致$N_{2}O_{4}$分解生成$NO_{2}$，故顏色變深，此選項正確；(丁)同溫下兩管氣體體積相同，故分子總數相同，但A管中尚有$N_{2}O_{4}$存在，故$NO_{2}$分子數較C內的空氣少。故選(C)。
