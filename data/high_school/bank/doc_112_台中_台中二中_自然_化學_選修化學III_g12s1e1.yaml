  stem: '<u>敬仁</u>同學進行了目視比色法，求平衡常數的實驗。其實驗步驟如下： ①取5支比色用試管，分別加入5毫升的0.002 M KSCN溶液，並標記為1〜5號試管。 ②取20毫升的0.2 M硝酸鐵水溶液，置於燒杯中，標為甲溶液。 ③以吸量管吸取10mL甲溶液，置於另一錐形瓶中並加入蒸餾水稀釋成25mL，標為乙溶液。 ④重複步驟③，以乙溶液配製丙溶液，以丙溶液配製丁溶液，以丁溶液配製戊溶液。 ⑤以吸量管取甲溶液5mL加至1號試管，此試管為<u>標準液</u>。 ⑥重複步驟⑤，將乙、丙、丁、戊溶液各取5mL分別加至2～5號試管。 ⑦將2～5號試管分別與1號試管進行比色，當4號與1號顏色深淺相同時，其液面高度比為2：1。 1 號試管視為完全反應的結果 (1)寫出此一平衡反應的淨離子反應式。 (2)比色法測出哪個離子的濃度？ 該離子顏色為何？（各1分） (3)丁溶液中，[$Fe^{3＋}$]＝？M (4)請從4號試管的結果計算出該反應的反應常數（四捨五入至小數點以下第一位）

    (5)在實驗過程中，敬仁同學被化學老師碎念了一番：「你這個步驟會造成實驗誤差啊～！」（跺腳）請問，該同學在哪一個步驟出現錯誤？正確的作法為何？（各1分）'
