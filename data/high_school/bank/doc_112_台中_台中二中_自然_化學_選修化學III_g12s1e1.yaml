  stem: '<u>言禎</u>的好朋友喜歡探究沉澱應用，沉澱滴定法是利用滴定劑與待分析物形成難溶的離子性沉澱物，再利用滴定劑的滴定量推算出分析物離子的含量。而氯離子含量分析的沉澱滴定法其中之一為莫爾法（Mohr method）：滴定劑為硝酸銀與待測液中的氯離子形成沉澱物，以鉻酸根作為指示劑，當<u>鉻酸銀</u>產生時表示達到滴定終點。 以下為某生進行的實驗步驟： （實驗過程中所產生誤差假設均以空白試驗修正不計） ①取一錐形瓶放入待測液40 mL，滴入數滴指示劑鉻酸鉀、少量弱鹼維持適當的pH值 ②逐漸滴入0.1 M硝酸銀直到達滴定終點為止 ③紀錄滴入的體積為10 mL (1)進行滴定的過程中，該溶液中所出現的沉澱物顏色順序為？ (2)請計算待測液[$Cl^{－}$]＝？M

    (3)若其待測液的陽離子只含$Mg^{2＋}$，另取40 mL待測液加入0.002mol $Na_{2}CO_{3}$，平衡時[$Mg^{2＋}$]＝？M （$MgCO_{3}$之Ksp＝7.5×$10^{－6}$）'
