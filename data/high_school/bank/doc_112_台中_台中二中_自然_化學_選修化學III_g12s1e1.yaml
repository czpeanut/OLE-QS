  stem: 已知$A_{2}$(g)＋$3B_{2}$(g) ⇌ 2 $AB_{3}$(g)，某溫度下的平衡常數K為3×$10^{8}$，則下列有關該反應的敘述正確的有那些？
  options:
  - label: A
    content: 該溫度下正反應速率很快
  - label: B
    content: 該溫度下正反應速率常數＞＞逆反應速率常數
  - label: C
    content: 達平衡時，[$A_{2}$]：[$B_{2}$]：[$AB_{3}$]＝1：3：2
  - label: D
    content: 該反應一定會發生
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)平衡常數與速率無關；(B)平衡常數K＝$\frac{k_{正}}{k_{逆}}$，故正確；(C)係數為反應過程中的物質變化量比，不為平衡時的物質濃度比；(D)平衡常數用於預測反應達平衡的時刻濃度變化，無法預測反應發生與否。故選(B)。
