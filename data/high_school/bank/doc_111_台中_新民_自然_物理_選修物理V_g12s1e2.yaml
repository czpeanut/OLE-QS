  page: 2
  stem: '原子的概念在古<u>希臘</u>哲學家<u>德謨克利特</u>曾經提出物質分割到某一個狀態就無法再分割，一直到1802年<u>道耳頓</u>發表原子說，這理論特別指出化學物質或元素是由原子組成，原子無法由化學反應再分割。經過幾年後<u>亞佛加厥</u>修正原子說而提出分子說，此時已經可以清楚解釋分子與原子差異。但由於受限於科學儀器的發展，直到1827年<u>布朗</u>觀測到花粉粒子的折線運動，經由<u>愛因斯坦</u>的研究才得到合理的數學模型來說明原子的存在，而<u>佩蘭</u>因沉澱平衡實驗證實了<u>愛因斯坦</u>解釋布朗運動的理論，證明原子真實存在而獲得諾貝爾獎。 1897年<u>湯姆森</u>由陰極射線管發現電子後開啟了次原子粒子的研究，<u>湯姆森</u>曾經提出原子的西瓜模型（或稱葡萄乾布丁模型），認為電子分布在原子中帶正電的物質中，但1909<u>拉塞福</u>修正<u>湯姆森</u>的模型，經由α粒子（氦原子核）撞擊金箔的散射實驗提出行星軌道模型，但<u>拉塞福</u>的行星軌道模型並未給予電子運動結構且存在能量損失與穩定度的解釋，直到<u>波耳</u>提出氫原子模型修正行星模型問題。 1911年<u>波耳</u>利用能量量化、電子繞行原子核的能階不連續建立了氫原子模型，拉塞福行星軌道模型的原子崩潰現象問題因此化解，波耳氫原子模型的光譜預測與1885年<u>巴耳末</u>所提出來的氫原子光譜相吻合。<u>奧地利</u>物理學家<u>薛丁格</u>及<u>德國</u>物理學家<u>海森堡</u>同時奠立了量子力學的基礎後，量子力學成為二十世紀到現在用於建構原子模型的主流理論。量子力學可以清楚描述諸如電子、質子等量子尺寸粒子的特性，量子力學理論說明電子並非以軌道運動方式存在於原子核外，科學家發現原子核外電子的明確位置或運動的軌跡無法精確地描述，只能以機率大小描述電子在核外空間出現的區域。將電子出現機率90％的區域畫成幾何形狀稱為軌域，電子的機率分布圖稱為電子雲。

    ( )(1)由上述短文中的科學家與貢獻，下列何者可能<u>錯誤</u>？'
  options:
  - label: A
    content: <u>德謨克利特</u>：提出物質可以分割到某一個最小單位
  - label: B
    content: <u>波耳</u>：提出氫原子模型，說明電子繞行原子核的能量不連續
  - label: C
    content: <u>布朗</u>：提出花粉運動數學模型，並間接證實原子存在
  - label: D
    content: <u>佩蘭</u>：實驗證實花粉運動的數學模型
  - label: E
    content: <u>湯姆森</u>：陰極射線管發現電子，提出葡萄乾布丁模型
  explanation: (1)(C)愛因斯坦提出花粉運動數學模型，並間接證實原子的存在。故選(C)。 (2)(A)湯姆森葡萄乾布丁模型說明電子均勻散布在電荷之間，但並無提出質子的存在；(B)拉塞福α粒子散射實驗所得之行星模型仍有矛盾之處，故有修正；(D)波耳因拉塞福行星模型違反電磁學而提出氫原子模型修正；(E)電子雲為物質波概念理論基礎由德布羅意提出，薛丁格提出波動方程式。故選(C)。 (3)甲：葡萄乾布丁模型；乙：波耳氫原子模型；丙：行星模型；丁：電子雲軌域。 依年代：甲丙乙丁。故選(C)。
