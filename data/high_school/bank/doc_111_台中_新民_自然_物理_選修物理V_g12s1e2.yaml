  stem: 下列有關電位能的敘述，哪些正確？
  options:
  - label: A
    content: 帶電粒子在電場中運動，靜電力對此物體所作的功等於物體的初電位能與末電位能之差
  - label: B
    content: 帶電粒子若順著電力線的方向運動，則電位能必減少
  - label: C
    content: 電位能屬於力學能
  - label: D
    content: 電位能與兩帶電粒子間的距離有關，距離增加，電位能增加
  - label: E
    content: 電荷在均勻電場中運動時，靜電力不作功，電位能不變
  explanation: (A) $W_{Fe}$＝－ΔU＝－（$U_{f}$－$U_{i}$）＝$U_{i}$－$U_{f}$；(B)正電荷順著電力線方向運動電位能減少；負電荷順著電力線方向運動，電位能增加；(C)力學能包含動能及位能；(D)同性電間距離增加，電位能減小，異性電間距離增加，電位能增加；(E)電荷於均勻電場運動時，靜電力會作功且電位能亦會改變。故選(A)(C)。
