  stem: 有一平行板電容器，內部為真空，正方形電極板的長均為L，兩板間距為d，兩板間的電位差為V。電容器內有均勻電場E＝$\frac{V}{d}$，如圖所示。電子從電容器左端的正中央以初速$v_{0}$水平射入，並打在圖上的D點。電子的電荷以－e表示，質量以m表示，重力不計。下列敘述哪些正確？
  options:
  - label: A
    content: 電子在水平方向作等速運動
  - label: B
    content: 電子在電容器內受力量值為$\frac{eV}{d}$
  - label: C
    content: 電子在電容器內運動時間為$\frac{L}{v_{0}}$
  - label: D
    content: 電子至D點時瞬間動能為$\frac{1}{2}mv_{0}^{2}$＋eV
  - label: E
    content: 電子的初速$v_{0}$至少必須大於L$\sqrt{\frac{2eV}{md^{2}}}$才能避開電極板，飛出電容器外
