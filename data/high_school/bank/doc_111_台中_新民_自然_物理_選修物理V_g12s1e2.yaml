  stem: 下列有關「光電效應」的敘述，何者正確？
  options:
  - label: A
    content: 光電子之最大動能與光的強度成正比
  - label: B
    content: 要使某一金屬表面發射光電子而形成光電流，入射光的頻率必須超過其某特定頻率
  - label: C
    content: 無論光頻率多少，光強度愈強，愈容易產生光電子
