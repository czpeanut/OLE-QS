  answer_status: verified
  answer_source: answer_key
  explanation: (A)光電子最大動能與入射光頻率有關，和光的強度無關；(C)是否能產生光電子與入射光頻率有關，和光強度無關；(D)光子被吸收，其能量一部分克服功函數，剩餘即為光電子動能；(E)不同金屬板，欲產生光電子所需最小能量不相同。 故選(B)。
