  stem: 下列有關電場與電位之敘述，哪些選項正確？
  options:
  - label: A
    content: 電場量值較大處，電位也較高
  - label: B
    content: 等位線上各點的電場量值都相等
  - label: C
    content: 正電荷由P點移到Q點時，若靜電力作正功，則P點為高電位
  - label: D
    content: 等位面上各點電場的方向必與等位面垂直
  - label: E
    content: 帶靜電導體內部的電位必為零
  explanation: (A)電場與電位間並無此必然關係，例如雨等量異性電之中點位置之電場最大，但電位為零，較靠近正電荷之電位為小；(B)等電位線上各點電場未必相等；(E)帶靜電導體球內部為等電位，其值不為零。故選(C)(D)。
