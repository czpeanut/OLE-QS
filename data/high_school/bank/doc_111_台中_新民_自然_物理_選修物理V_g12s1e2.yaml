  explanation: (A)水平方向不受電力作用，電子作等速運動；(B) F＝eE＝e($\frac{V}{d}$)＝$\frac{eV}{d}$；(C)等速度運動：t＝$\frac{L}{v_{0}}$；(D) W＝ΔK，e．$\frac{V}{2}$＝$K_{f}$－$\frac{1}{2}mv_{0}^{2}$，$K_{f}$＝$\frac{1}{2}mv_{0}^{2}$＋$\frac{1}{2}$eV；(E) y＜$\frac{d}{2}$，$\frac{1}{2} (\frac{eE}{m}) (\frac{L}{v_{0}})^{2}<\frac{d}{2}$，$v_{0}>\sqrt{\frac{eE}{md}} \cdot L=\sqrt{\frac{eE}{md^{2}}} \cdot L$。 故選(A)(B)(C)。
