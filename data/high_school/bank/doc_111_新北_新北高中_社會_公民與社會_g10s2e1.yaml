- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 因為新冠肺炎疫情影響，政府曾宣布全國三級警戒，因為人們減少外出消費，實體店家生計受到影響。在解封後，政府為了促進消費，發放 5 倍券，民眾每人都可獲得價值等同 5,000 元的消費券。請問關於 5 倍券對消費而言屬於哪種誘因？
  options:
  - label: A
    content: 金錢的正向誘因
  - label: B
    content: 金錢的負向誘因
  - label: C
    content: 非金錢的正向誘因
  - label: D
    content: 非金錢的負向誘因
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到 5 倍券價值等同於 5,000 元，可知為金錢誘因，且又屬於給予人們好處，屬於正向誘因，故本題選(A)金錢的正向誘因。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 社會規範可能因不再符合社會需求而面臨修改，並非長久不變。請問下列何種原因「無法」促成社會規範修改？
  options:
  - label: A
    content: 違反公平正義
  - label: B
    content: 時間流逝
  - label: C
    content: 新技術或產品的發明
  - label: D
    content: 無法達成原訂目的
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 社會規範的改變可能會因為時間造成價值觀改變、無法達成原先目的，或因為新技術的發明，而需要修改或新增規定，但時間流逝如果沒有造成上述改變，並不會造成社會規範的變遷，故本題選(B)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 自衣索匹亞爆發內戰以來，已經長達 1 年，但在 2021 年 11 月，聯合國安全理事會僅表達「深切擔憂」，並呼籲結束衝突。請問關於此事件最可能的原因為何？
  options:
  - label: A
    content: 安全理事會沒有實質權力
  - label: B
    content: 安全理事會主要以倡議影響國際
  - label: C
    content: 關注人權議題是人權理事會的職責
  - label: D
    content: 各國基於自身利益考量難以達成共識
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)聯合國安理會具有國際重大議題的否決權，並非沒有實權。(B)國際間第三部門組織以倡議為影響的主要方式，安理會則具有實質權力。(C)非此事件的原因。(D)各國基於自身考量，確實難以達成共識。故本題選(D)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某國傳統部落有對少女進行割禮的成年儀式，造成眾多未成年女孩在生殖器切割過程中失血過多或感染致死。有國際公益組織對該國施壓要求禁止此習俗，但也有不同的主張認為這是當地人重要的文化傳統，外人應尊重且不干預。從下列有關人權及多元文化的不同說法中，判斷何者為最有力的「廢除割禮」主張？
  options:
  - label: A
    content: 為維護兒童發展權益，應保障其免受任何制度對身體的侵害
  - label: B
    content: 廢除割禮有助於提升醫療衛生，促進落後傳統習俗的發展權
  - label: C
    content: 伴隨社會變遷，人權發展應重視平衡天賦人權與傳統文化
  - label: D
    content: 在多元文化原則下，應維護部落女性文化發展的基本權益
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)依據題文，割禮容易造成感染的問題，並無助於提升醫療衛生。(C)(D)面對明顯侵害女性健康權的割禮文化，應當予以譴責，兩者非屬最有力的「廢除割禮」主張。故本題選(A)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 聯合國是目前最重要、會員最多的國際組織，也訂有據以運作的《聯合國憲章》，但其運作及維護和平的功能卻屢遭質疑。例如：在敘利亞內戰中，美國、英國、法國和俄羅斯等安理會成員國，曾分別支持政府軍和反政府軍；會員國北韓也在中國暗助之下，多次置聯合國的禁令於不顧，進行核武試驗。關於聯合國上述運作及功能的問題，下列詮釋何者最適當？
  options:
  - label: A
    content: 運作問題根源在於會員國未必認同《聯合國憲章》
  - label: B
    content: 運作的困境在於缺乏合法武力以解決內戰問題
  - label: C
    content: 功能無法發揮係因會員國的國力差距過於懸殊
  - label: D
    content: 功能不彰常與會員國間的利益和資源爭奪有關
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)並非不認同《聯合國憲章》，而是各國的利益考量和資源爭奪問題。(B)聯合國有維和部隊。(C)並非是各國實力差距懸殊，而是各自有自身的利益考量，故本題選(D)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 為了確保女性參與政治的權利，有些國家會在法律上設計「婦女保障制度」，以我國為例，下列敘述何者是此一理念的具體實踐？
  options:
  - label: A
    content: 政府的教育單位，將性別關係與平等尊重放入課綱，以保障女性的平等權益
  - label: B
    content: 《地方制度法》規定各選區選出民代名額達 4 人者，應有婦女當選名額 1 人
  - label: C
    content: 行政院院長宣布新內閣閣員名單，其成員按照性別比例以顯示性別平等
  - label: D
    content: 婦女團體呼籲儘速修法，女性民代名額應達成 40 ％性別比例目標為原則
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文主要是在問「如何確保女性的參政權利」與「婦女保障制度」。(A)屬於性別平等教育。(C)此非婦女保障制度，屬於行政院長的內閣首長任命的理念。(D)目前並無此婦女保障制度的設計。故本題選(B)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 聯合國是在第二次世界大戰之後由各國政府組成的國際組織，希望藉此維護世界和平並保障人權。為能履行職賣，其下設置諸多機構，例如人權理事會、安全理事會等。若此時某國傳出政變，軍政府接管執政，並採行暴政，致許多民眾喪生，聯合國欲出兵干預，此時應由下列何者負責執行？
  options:
  - label: A
    content: 常任理事國
  - label: B
    content: 聯合國大會
  - label: C
    content: 人權理事會
  - label: D
    content: 安全理事會
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 聯合國設有維和部隊，如果要出兵干預必須透過安全理事會同意方可，故本題選(D)。(A)常任理事國具有否決權，但並無直接宣布派兵的權力。(B)聯合國大會主要是討論國際相關事務的機構，並無派兵的權力。(C)人權理事會主要是關心國際人權議題，並無直接派兵干預的權力。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 長期以來，美國政府大致秉持著一項原則：「若有恐怖分子挾持美國人作為人質，要求美國政府支付贖金或談條件，美國政府會一概拒絕。」這看似無情的原則，背後其實有著深遠的考量；美國政府認為，若接受恐怖分子的威脅，則無異於對綁架美國人的行為提供「 」，將使美國人面臨更高的綁架風險。請問引號內最適合填入什麼？
  options:
  - label: A
    content: 正向誘因
  - label: B
    content: 社會控制
  - label: C
    content: 社會規範
  - label: D
    content: 負向誘因
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 提供綁架美國人者贖金，等同於給予正向金錢誘因，故本題選(A)。(B)社會控制分為外部控制與內部控制，屬於社會規範對人的影響，與此處無關。(C)社會規範為習俗、宗教、道德與法律，對於人的內在或外在行為產生社會控制，與此處無關。(D)給予贖金屬於正向誘因，非負向誘因。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 人類基因編輯目前仍為多國法律限制，除了因為技術上的不成熟，更因其可能衍生嚴重的法律及倫理問題。人類基因編輯技術若是被心存不良的野心家用來大範圍改造人類，可能造就永久性的階級分化與資源分配不均，亦可能讓基因失去多樣性而影響世代正義，讓後代承受這個後果，請問上述符合下列何種生命倫理原則？
  options:
  - label: A
    content: 不傷害原則
  - label: B
    content: 正義原則
  - label: C
    content: 尊重自主原則
  - label: D
    content: 行善原則
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到，基因編輯可能造成永久性的階段分化與資源分配不均，影響世代正義，可推論應為(B)正義原則。(A)此處指基因編輯，與不傷害原則無關。(C)此處並無提及自主性的議題，與尊重自主無關。(D)基因編輯與行善原則無關。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 2019 年 5 月我國公布施行《司法院釋字第 748 號解釋施行法》，欲解決我國過去因民風尚保守，未保障同性婚姻的問題。惟現今人民鼓吹自由、平等，追求同性伴侶與《民法》相同的婚姻自由保障，請問上述內容凸顯了社會規範的何種特性？
  options:
  - label: A
    content: 因社會變遷而改變
  - label: B
    content: 傳遞社會群體文化
  - label: C
    content: 解決社會衝突
  - label: D
    content: 形成社會控制
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到，過去因為民風保守，未保障同性婚姻，而現代則因為價值觀的改變，通過專法保障同性婚姻，可知為社會變遷價值觀改變的影響，故本題選(A)。(B)過去並無此群體文化。(C)題文中並無提及社會衝突。(D)題文強調社會變遷，而非形成社會控制。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 因為運輸科技革新，全球化的情況日漸普及，除了貿易生產線的移轉外，勞動力也不例外，也就是移工。不過這些移工，也常常遇到惡劣的勞動環境或是受到詐欺、傷害等問題，甚至難以與外界聯繫。由於也不是當地的國民，所受到的保障相對較少，因此處境更是艱辛。對此聯合國通過《保護所有移徙工人及其家庭成員權利國際公約》。如果我國也要將此公約國內法化，請問應該經過下列哪個程序？
  options:
  - label: A
    content: 由大使簽署公約
  - label: B
    content: 由總統批准公約
  - label: C
    content: 將批准書送到聯合國存放
  - label: D
    content: 在立法院制定國內施行法
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 如果希望將國際公約國內法化，必須透過我國的立法程序，故本題選(D)。(A)(B)(C)皆不是讓國際公約具有國內法效力的方式。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 舊時《民法》規定：「妻以其本姓冠以夫姓，贅夫以其本姓冠以妻姓。」隨著社會性別平等意識的提升，現已修正為：「夫妻各保有其本姓。但得書面約定以其本姓冠以配偶之姓，並向戶政機關登記。」請問依據題文的敘述，下列何種原因最符合修法的理由？
  options:
  - label: A
    content: 目的不正當
  - label: B
    content: 手段可替代
  - label: C
    content: 社會變遷
  - label: D
    content: 手段目的顯失均衡
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到，隨著社會性別平等意識的提升，《民法》也進行了許多修正，可知(C)社會變遷為主要的修法理由。(A)與目的不正當無關。(B)與手段是否可以替代無關。(D)與手段目的是否失衡無關。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 目前在美國發生一起外送事件的糾紛，一位男子使用外送平臺訂餐，並用系統支付 8 元美金給外送員，然而當外送員送餐來時，卻不願意放下手中的餐點，並要求男子要再多給額外的小費，該男子拒絕，外送員竟直接帶著餐點走人，留下傻眼的男子。在臺灣就沒有看過因小費引起爭執的外送事件，請問是以下哪個原因造成美國與臺灣有如此的差異呢？
  options:
  - label: A
    content: 金錢誘因
  - label: B
    content: 社會衝突
  - label: C
    content: 社會規範
  - label: D
    content: 種族歧視
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 給予外送員小費屬於美國的習俗，屬於社會規範的議題，因此本題選(C)。(A)誘因主要是希望誘使某些行為所做的方法，與此處無關。(B)此處主要為習俗，與社會衝突無關。(D)題文中並無提到種族議題，無法得知。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 普遍人權的觀念一直要等到 1948 年聯合國頒布《世界人權宣言》後，才算真正的普及。下列何項敘述符合其理念？
  options:
  - label: A
    content: 延續君權神授的理念，宣稱每個人享有宣言中的一切權利和自由
  - label: B
    content: 該宣言期望國家與國際採行漸進措施，使其獲得普遍承認與遵行
  - label: C
    content: 該宣言明文禁止死刑，規定人人有權享有生命、自由與人身安全
  - label: D
    content: 該宣言乃是由聯合國大會所通過，因此是一個強制性的國際公約
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是天賦人權。(C)公民與政治權利國際公約方才明文提到廢除死刑。(D)非強制性公約，屬於宣言性質。故本題選(B)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 關於第三點所涉及的問題，下列敘述何者正確？
  options:
  - label: A
    content: 法律制定的問題
  - label: B
    content: 宗教倫理的問題
  - label: C
    content: 公平正義的問題
  - label: D
    content: 目的正當的問題
