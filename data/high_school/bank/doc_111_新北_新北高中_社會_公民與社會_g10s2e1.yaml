  stem: 2017 年經濟部通過亞洲水泥公司在花蓮縣新城山礦場地礦權展延，讓許多人開始關注《礦業法》的問題。目前《礦業法》規定原則上申請礦權展延，應該要核准，造成許多不合理的情形，也有侵犯人民財產權而違反《憲法》的疑慮 ，因此許多人民及團體呼籲要盡速修法。請問如果立法院要修正《礦業法》，下列何者「不是」正確的提案程序？
