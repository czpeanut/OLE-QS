  explanation: (A)須先向政府登記，方可成立社團。(B)不一定接受政府補助，就無法維持中立，與該社團之理念有關。(D)社團主要是結合志同道合的人們一起努力，並無此規定。故本題選(C)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 5
  stem: 立法院通過《會計法》修正案時因漏字問題引發巨大爭議，引起各界對立法品質的關注。假設法律生效施行後，如發現法律條文有重大疏漏，該進行何種程序修正？
  options:
  - label: A
    content: 立法院依立法程序將修正案通過後，送請總統公布
