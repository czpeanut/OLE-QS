  stem: 一位出生於阿富汗的思想家，據聞是穆罕默德的後裔，在 19 世紀後期見到當時伊斯蘭世界受到西方列強勢力入侵，伊斯蘭族群四分五裂，且當時最大的伊斯蘭帝國鄂圖曼帝國也無法善盡保護伊斯蘭世界之責。為了讓伊斯蘭世界團結共同抵禦列強，他走訪中東、北非、歐洲各地，倡議「泛伊斯蘭主義」，嘗試建立跨宗派、地域、民族的單一伊斯蘭國度。「泛伊斯蘭主義」不是與西方對抗的軍事行動策略，也非教條儀式與民族主義，而是強調以伊斯蘭的基本信仰為普遍生活倫理規範，以此團結伊斯蘭世界並促進其政治現代化。依據題文資訊，下列有關該思想家主張的敘述，何者最能凸顯「泛伊斯蘭主義」的社會規範功能？
  options:
  - label: A
    content: 對抗西方諸列強入侵的武力團結主義
  - label: B
    content: 避免伊斯蘭世界分裂的國家民族主義
  - label: C
    content: 重建伊斯蘭文化共同價值與集體信念
  - label: D
    content: 教育穆斯林信徒遵守伊斯蘭宗教儀式
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文可知，泛伊斯蘭主義主要是以伊斯蘭信仰為基本生活倫理規範，故本題選(C)。(A)與武力團結無關。(B)與國家民族主義無關。(D)題文提到「跨宗派」可知非強調只有穆斯林們遵守伊斯蘭教的教義。
