  explanation: 若行政機關認為立法院通過之法律案窒礙難行時，可經由總統的核可，移請立法院覆議，故本題選(A)。(B)總統無法直接拒絕簽署法案。(C)黨團協商是在第一讀會後，相關常設委員會審查當中，各政黨歧異大無法達成共識時，由立法院長召集黨團代表為之。(D)只有當行政院長被通過不信任投票後，經行院院長提出，總統方可「被動」解散國會。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_29
  section: 1
  number: 29
  type: single
