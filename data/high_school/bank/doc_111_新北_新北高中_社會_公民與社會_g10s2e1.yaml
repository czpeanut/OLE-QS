  group_stem: 南投縣仁愛鄉南豐村眉溪畔聚居許多賽德克族人，該部落於日治時期被統治者強制遷居於此。因部落常遭風災肆虐，鄉公所乃在易達性較高與安全條件較佳的地點，設置「災害應變中心避難收容處」。近年該部落與政府合作一項計畫，由部落族人參與討論公共資源分配，最後透過投票選出最需要投入經費在族語、弓箭等傳統文化的傳承。此外族人也以集體名義，申請原住民族傳統智慧創作專用權，讓該計畫充分發揮強化族人自治與文化復振的功效。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 民主治理指的是國家與民間共同合力完成公共事務。(A)僅有地方政府，不屬於民主治理。(B)(C)皆忽略了政府也須共同參與，不屬於民主治理。(D)屬於政府與民間共同辦理，故本題選(D)。
