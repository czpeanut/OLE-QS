- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 5
  stem: 根據《香港基本法》，香港的行政長官必須經由「一個有廣泛代表性的提名委員會按民主程序提名」，才能成為候選人，並由選舉委員會投票選出。2017 年林鄭月娥即以 777 票當選香港新一任的行政長官。但這樣的選舉制度被香港人認為是小圈子選舉，無法代表真實民意，發起爭取「真普選」的運動，希望由香港人直接選舉行政長官，並否定提名委員會的「篩選」機制。根據上文，香港人認為行政長官「缺乏」下列何者？
  options:
  - label: A
    content: 民主正當性
  - label: B
    content: 權力分立
  - label: C
    content: 正當程序
  - label: D
    content: 法律保留原則
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，香港人希望特首並非是經過上層篩選，再由一小群人投票選舉，而是希望落實「真普選」，此種要求其實就是針對(A)民主正當性的要求。(B)指的是行政、立法、司法彼此分立制衡的機制，與此處無關。(C)指的是流程必須符合法規，與此處無關。(D)指政府的施政必須有法律的授權，與此處無關。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_35
  section: 1
  number: 35
