  group_stem: 為達成「2050 年淨零排放」的目標，行政院會於 2022 年 4 月通過《溫室氣體減量及管理法》修正案，並將名稱修正為《氣候變遷因應法》送請立法院審議。立法院社福及衛環、經濟、財政、內政、交通、教育及文化委員會，召開會議審查。另外，包括臺灣民眾黨團和朝野多位立委也分別提出修正案，併案審查，相關版本累計多達約 20 案。跨黨派原住民立委表示，行政院版本偏向企業及財團的視角，對原住民族的諮商同意、分享利益或回饋機制鮮少著墨，原住民族地區是全國森林覆蓋率最高的地區，長期以來原住民族也是以環境保護為己任，如果沒有法律做明文規定，原住民權益恐怕會被迫犧牲，應建立屬於原住民族群的碳匯及其驗證機制，例如加拿大政府與海岸第一民族簽署「大氣利益共享協議」，讓當地民族取得一定額度的碳補償。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到，目前在相關常設委員會召開會議審查，處於擬定草案，準備向立法院提出議案進行第二讀會。故本題選(C)。(A)尚未進行到第二讀會。(B)尚未進行到公布階段。(D)此處並無提及透過公聽會採納多元意見。
