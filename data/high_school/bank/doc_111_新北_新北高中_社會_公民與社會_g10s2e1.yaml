  explanation: 法條生效施行之後，如欲修正就必須再次提出修正案，完成三讀程序後經總統公布後施行，故本題選(A)。(B)此為違憲審查後的修法，與此處無關。(C)並無此修法方式。(D)此為法律尚未經總統公布時的可能作法。
