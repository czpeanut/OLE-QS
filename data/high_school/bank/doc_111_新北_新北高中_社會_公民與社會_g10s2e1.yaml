  explanation: 創世基金會，由其名稱「基金會」可知，應為私法人中的財團法人，故本題選(C)。(A)自然人為真正的人。(B)應為私法人。(D)應為財團法人。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_30
  section: 1
  number: 30
  type: single
  page: 5
  stem: 諮商同意權是原住民族對其土地、傳統領域與自然資源權利的延伸，當遠東集團旗下的亞洲水泥在原住民保留地上開採礦業水泥時，應與原住民族協商，請問上述權利可歸類在下列哪一種權利中？
  options:
  - label: A
    content: 土地權
  - label: B
    content: 自治權
  - label: C
    content: 正名權
  - label: D
    content: 傳統智慧創作保護
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 希冀在原住民傳統領域上進行開發的諮商同意權，與(A)土地權息息相關。(B)自治權為原住民族自己管理自己事務的權利。(C)正名權為使用自己族群名稱或姓名的權利。(D)傳統智慧創作為傳統創作的集體權利保障，三者均與此處無關。故本題選(A)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_31
  section: 1
  number: 31
  type: single
  page: 5
  stem: 王老師任教於濱海小鎮，發現常有不肖業者傾倒廢土，破壞生態環境，導致潮間帶紅樹林逐年萎縮，因而集結在地人士組織社團，宣揚保育理念，避免紅樹林進一步流失。關於王老師透過結社參與公共事務的行動，下列敘述何者為正確？
  options:
