  group_stem: 2019 年 12 月兒童福利聯盟文教基金會（下稱兒福聯盟）在臺北市內湖區以 3.7 億元購置辦公室引起爭議。有人質疑兒福聯盟挪用善款來購置房產而引起「退捐潮」，而兒福聯盟則澄清捐款都是專款專用，購屋的錢來自業務所得，並有依法呈報給主管機關、在有會計師認證的財報中公開。
