  explanation: 題文提到，長榮航空在罷工落幕後，僅針對罷工者減少福利，違反《工會法》，此屬於違反(C)誠實信用原則。(A)比例原則指手段與目的不相稱，與此處無關。(B)法治國原則指的是國家依法進行公共事務，與此處無關。(D)禁止權利濫用是指權利之行使，不得違反公共利益，或以損害他人為主要目的。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_36
  section: 1
  number: 36
  type: single
  page: 5
  stem: 《原住民族依生活慣俗採取森林產物規則》實施後，原住民可基於自用，自由使用森林中的野菜、野果、野草。過去原住民常因森林產物採取而觸犯法律，新法重新定位及詮釋原住民使用自然資源行為，從純粹破壞森林、影響森林永續的角度，轉換為認可原住民族自然資源利用的傳統知識，是達到永續發展的方式。此代表原住民族何種權利的落實？
