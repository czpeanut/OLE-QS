- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e1_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 根據上文，《氣候變遷因應法》目前處於哪一個立法院階段？
  options:
