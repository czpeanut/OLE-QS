  stem: 長榮航空公司在罷工結束後，僅針對罷工者實施包含限制優待機票、扣除年度例休假等差別待遇，空服員工會為此申請勞動裁決。勞動部裁決後認為，長榮違背《工會法》，要求立即改善並進行開罰。長榮航空公司的作法最可能違背了以下何種法律原則？
