      rect:
      - 264.45
      - 216.4
      - 419.65
      - 384.0
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由圖中比例尺判斷，水池的邊長為 20 公尺 × 40 公尺＝800 平方公尺，故選(B)。
- id: doc_111_台中_台中二中_社會_地理_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺灣本島 TM2 投影坐標系統以 121°E 為中央經線，其橫坐標值為 250,000 公尺，今有兩個點的 TM2 坐標為甲（280500，2585000）、乙（340000，2767000），以及另外兩個點的球面坐標為丙（121°E，23.6°N）、丁（121.6°E，24.5°N），這四點的位置由西到東排列順序為何？
  options:
  - label: A
    content: 甲丙乙丁
  - label: B
    content: 甲丙丁乙
  - label: C
    content: 丙甲乙丁
  - label: D
    content: 丙甲丁乙
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 甲（280500，2585000）、乙（340000，2767000），由 X 坐標值判斷東西位置關係，甲＜乙，故甲靠西、乙靠東。丙（121°E，23.6°N）121° 的 TM2 坐標為 250000，故丙點最西。丁（121.6°E，24.5°N），北緯 25 度經距為 100 公里，121.6°E 為 121 往東 60 公里，切換成 TM2 坐標＝250000＋60000＝31000，X 坐標由小至大（由西到東）。故選(D)丙甲丁乙。
