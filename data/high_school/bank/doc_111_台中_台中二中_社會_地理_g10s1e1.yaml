  - label: A
    content: 400 平方公尺
  - label: B
    content: 800 平方公尺
  - label: C
    content: 1,600 平方公尺
  - label: D
    content: 2,400 平方公尺
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_111_台中_台中二中_社會_地理_g10s1e1/s1_1_f1.png
    crop:
