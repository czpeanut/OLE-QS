  type: single
  page: 1
  stem: 空氣、河流與海洋等繼續遭受汙染的現象，將造成社會的負擔。針對上文所述的現象，下列說法何者較為合理？
  options:
  - label: A
    content: 外部成本管制的困難可歸因於財產權歸屬不明確，而使得財貨的使用無效率
  - label: B
    content: 政府直接進行管制，鼓勵汙染較高的工廠遷移，是解決問題最有效率的方法
  - label: C
    content: 企業更換低汙染設備，政府即予以減稅優惠，補貼廠商發展綠能企業，均可將外部成本內部化
  - label: D
    content: 政府和企業協力研究環保及綠能產品，再轉嫁消費者負擔成本，應貫徹使用者付費的公平原則
