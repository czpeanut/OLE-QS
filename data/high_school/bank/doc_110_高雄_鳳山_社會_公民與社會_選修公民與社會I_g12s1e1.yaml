  page: 1
  stem: 臺北市的寧夏夜市為小吃攤的主力餐點標示熱量，讓民眾消費時可調節自己攝取的熱量，有利於降低罹患心血管疾病的機率。新作法推動之初，有些業者擔心計算熱量時會外洩獨家配方，不過後來仍同意參與活動。根據上述，下列何者正確？
  options:
  - label: A
    content: 民眾到寧夏夜市用餐時計算熱量，只會增加交易成本，減少消費者剩餘
  - label: B
    content: 寧夏夜市標示食物熱量，讓小吃攤能調整菜色內容，削弱消費者主權
  - label: C
    content: 若某些夜市業者的獨家配方不小心外洩，將對其他廠商產生外部成本
  - label: D
    content: 民眾為減重而少吃高熱量小吃所減少的社會醫療支出，屬於外部效益
