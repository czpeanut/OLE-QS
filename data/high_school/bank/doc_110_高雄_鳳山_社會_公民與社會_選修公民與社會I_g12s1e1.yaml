  stem: 面對低薪資的基層勞工以示威、怠工、罷工方式，要求將「基本工資」調整。美國洛杉磯市議會決議，在2020年之前，將基本工資從目前的9美元／小時，調升至15美元。下列相關敘述何者正確？ ？
  options:
  - label: A
    content: 勞動市場將呈現消費者剩餘減少、生產者剩餘可能增加或減少、社會總剩餘減少
  - label: B
    content: 屬於無效的價格下限管制，無法影響工資市場的均衡現狀
  - label: C
    content: 基本時薪若低於市場均衡，將使勞動市場供不應求，進而帶動薪資水準上漲
  - label: D
