  section: 1
  number: 12
  type: single
  page: 2
  stem: 失業率數字被視為一個反映整體經濟狀況的指標，而它又是每個月最先發表的經濟資料，是市場上最為敏感的月度經濟指標。」上述關於經濟學家對於就業與失業的敘述，下列推論何者正確？
  options:
  - label: A
    content: 約翰因工作表現不佳被裁員後，從此泡在網咖中不願工作，失業率會增加
  - label: B
    content: 國防部為了募兵制大舉徵才，瑪莉在大學一畢業後就馬上報名，也錄取了。此時失業率會減少
  - label: C
    content: 就讀大學經濟系的強森在假日都會去打工賺取生活費，故他應列入勞動力中的就業人口
  - label: D
    content: 克里斯汀原本自營工作室，後來覺得所學不足，決定重回學校深造
