  - label: A
    content: 奧地利產品輸入澳洲必須繳交關稅，但澳洲本土產品卻不用繳交關稅
  - label: B
    content: 奧地利規定本土食品須標示成分，進口食品則還須標示反式脂肪含量
  - label: C
    content: 奧地利對澳洲農產品課徵關稅，澳洲對奧地利農產品卻沒有課徵關稅
