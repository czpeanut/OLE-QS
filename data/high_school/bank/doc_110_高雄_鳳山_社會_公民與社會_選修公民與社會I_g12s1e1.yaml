  stem: 雖然我們生活周遭的產品價格不會時常改變，但臺灣的整體物價水準其實一直起起伏伏。請問：下列四位財經名嘴在政論節目中，針對臺灣消費者物價指數（CPI）變動的辯論敘述內容推論，何者最為正確？
  options:
  - label: A
    content: 黃市蔥：儘管國際原油價格在1973年第一次石油危機中，從每桶不到3美元飆漲至接近12美元，但這様的單一產品漲價不太會影響CPI，因此石油危機未曾推升臺灣的CPI
  - label: B
    content: 汪傑閔：1997年爆發亞洲金融風暴，東南亞多國經濟嚴重衰退，連帶造成臺灣民眾對經濟前景悲觀，使臺灣CPI年增率下跌
  - label: C
    content: 克萊默：2003年爆發SARS疫情，不僅生產活動受到影響，消費需求也大幅減少，造成CPI年增率大幅上升
  - label: D
    content: 李錚好：2009年發生金融海嘯，儘管全球性的不景氣造成臺灣消費需求減少，但臺灣因有存款保險制度，CPI並未受影響
- id: doc_110_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
