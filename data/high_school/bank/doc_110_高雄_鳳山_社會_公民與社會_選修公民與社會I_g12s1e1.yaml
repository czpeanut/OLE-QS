  stem: 「朝廷使用銅錢作為貨幣，隨著經濟發展，民間生產力大幅提升，官府鑄造銅錢的速度卻遠遠跟不上，早晚會產生問題，讓人不免憂國憂心。」上述是盛唐的紀錄，當時的唐朝最可能出現何種景象？
  options:
  - label: A
    content: 百姓一拿到錢幣就會盡快花用，以免貶值
  - label: B
    content: 各色貨物的價格連番下跌，廠商深受其苦
  - label: C
    content: 物價飛騰，人民無力購買生活的各式所需
  - label: D
    content: 對於去錢莊借錢的百姓有利
- id: doc_110_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
