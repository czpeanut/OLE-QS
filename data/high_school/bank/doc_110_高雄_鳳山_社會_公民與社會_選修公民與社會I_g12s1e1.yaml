  stem: 若美國繼續施以新一輪關稅，迫使中國改變貿易政策，再加上中國過去雖是成衣生產樞紐，但隨著國內工資不斷上漲，為此一些企業開始選擇到越南、泰國等東南亞國家設廠生產分散風險，中國國內因此產生一波失業問題。假設此時中國的國策顧問提出幾個解決方案，下列政策何者最能有效解決中國的困境？
  options:
  - label: A
