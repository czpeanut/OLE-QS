  stem: 有一天，金成五與林志霖在討論公民課程中，老師曾講過的勞動市場內容，請問下列說法何者正確？
  options:
  - label: A
    content: 金成五：如果我要開一間茶店的話，有博士來應聘收銀員，有利於減少隱藏性失業
  - label: B
    content: 林志霖：假設我去店裡應徵上的話，我就是勞動市場中的需求者
