- id: doc_113_屏東_屏東高中_社會_歷史_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 附圖是有關希特勒與史達林關係的諷刺性漫畫。圖中新郎結婚的目的為何？
  options:
  - label: A
    content: 化解俄國對德日反共公約的疑慮
  - label: B
    content: 方便德國與東南歐獨裁政權合作
  - label: C
    content: 壯大德國實力以嚇阻美國的干預
  - label: D
    content: 免除德國東顧之憂以便對付英法
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_113_屏東_屏東高中_社會_歷史_g11s1e3/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 430.4
      - 357.05
      - 564.3
      - 472.95
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '德國納粹政權的基本態度是反共，但為避免在歐洲形成兩面作戰的窘境，因此於 1939 年與蘇聯簽訂《德蘇互不侵犯條約》，代表希特勒已有在歐洲發動戰事的準備，因此被視為大戰爆發的信號，(D)為正解。

    4.1917 年俄國十月革命後，布爾什維克政府主張退出戰爭，引發協約國不滿，英法等國因此向俄國發出警告照會，試圖阻止其退出，故選(C)。

    5.從「戰壕」與眾人「以為前線（與法軍作戰）已經沒有戰事」來看，這個時代應是(B)第一次世界大戰，德、法的西線戰場曾經以戰壕隔離兩軍，暫時休兵。

    6.題文中的「某書」為德國雷馬克的《西線無戰事》，1930 年代(C)德國再度試圖發動戰爭，該書因與政府立場不同而遭禁止。

    7.(A)義大利雖是戰勝國，但戰後經濟嚴重衰退。(B)墨索里尼反對共產主義，為激進右派分子。(D)一次大戰後首先破壞世界和平的是日本，於 1931 年侵略中國，爆發九一八事變。

    8.「威瑪共和」為德意志帝國瓦解後，德國新成立的政權，從「馬克」與鉅額賠款亦可判斷此國家為(B)德國。

    9.甲國家中途退出一戰，故為俄國；乙國家兩次都是戰勝國，但都拿不回勝利成果，可能是中國；丙國家於一戰獲勝，二戰時屈服於德國的閃電戰，可能為法國；丁國家內部軍閥氣焰高漲，二戰以慘敗收場，故為日本。因此正確答案為(A)。

    10.從題文可知此一國家於 1960 年代初期揚棄原本親美的政策，改行反美的社會主義，因此可推知為古巴，於 1959 年革命成功建立西半球第一個社會主義國家，自此反美親蘇，甚至釀成飛彈危機。

    11.這位政治家主張以「停止合作，拒絕納稅」等非暴力方式爭取獨立，可推知為甘地的「不合作運動」，因此答案為(A)印度人民抵抗英國統治。(B)(C)(D)皆採取武力對抗殖民政權。

    12.20 世紀後，亞洲、非洲地區的反殖民運動能快速發展，除了「民族自決」風潮的鼓舞外，最重要的是歐洲殖民母國的衰落，尤其在經過兩次世界大戰與經濟蕭條後，歐洲列強實力大不如前，對殖民地的控制因而減弱，給予其獨立自主的機會，故選(B)。

    13.從黑人選民人數明顯占優勢，加上曾實施種族隔離政策，顯示這次大選發生於非洲國家，因此答案為(D)。南非於 1991 年廢止種族隔離政策，1994 年的大選選出民權鬥士曼德拉為總統，同時也是南非第一位黑人總統。

    14.(B)(丙)(丁)於 1947 年提出，使歐洲國家免於遭受共產主義勢力的威脅。(甲) 1823 年提出，針對中南美洲國家獨立運動；(乙) 19 世紀末 20 世紀初提出，針對中國的瓜分危機。

    15.從「對聯合國而言，卻是證明其維持和平能力的第一場試煉石」一句，可推知這場戰爭是聯合國成立以來第一次出兵介入的戰爭，即(B) 1950 ～ 1953 年的韓戰。

    16.披頭四主唱約翰藍儂於 1969 年創作並演唱〈給和平一個機會〉，這首歌成為當時反對越戰運動的重要代表歌曲，當時美國正深陷越戰泥淖，國內外反戰聲浪高漲，藍儂藉由音樂呼籲和平，影響了整個反戰世代。(A) 1950 ～ 1953 年。(B) 1990 ～ 1991 年；(D) 1979 年。

    17.(C) 1970 年代為冷戰的「低盪」時期，情勢趨於緩和。

    18.從公約內容可知此一組織的成立有軍事合作目的，成員國包括歐洲與北美國家，因此可推知為(D)北大西洋公約組織。(A)蘇聯主導的東歐共產國家組織，無北美國家參與。(B)歐洲的區域統合組織，以經濟合作為主，無北美國家參與。(C)美洲的區域統合組織，成員國不包括歐洲國家。

    19.這場戰爭發生於冷戰時期，美國由強勢轉變為弱勢，甚至不惜「聯中制蘇」，加上國內發生的種族問題與民權問題，這些線索足可推知這一場戰役為 1960 年代的(D)越戰。

    20.題文反映的是非洲殖民地在 1960 年代掀起獨立浪潮的歷史背景。當時歐洲列強無法再依靠武力維持殖民統治，轉而順應民族自決潮流，推動政治轉型與民主制度。1960 年被稱為「非洲獨立年」，許多非洲國家陸續獨立，象徵帝國主義的瓦解。

    21.1985 年戈巴契夫上任後推動改革，政治上實行開放，經濟上朝市場化轉型，導致蘇聯與東歐出現劇變。1991 年 8 月，保守派因不滿改革發動政變，將戈巴契夫軟禁，但在葉爾欽干預下失敗。政變後，加速各加盟共和國宣布獨立，成立「獨立國家國協」。同年年底戈巴契夫辭職，蘇聯解體，冷戰正式結束。

    22.立體派係將自然形體分解為幾何切面，強調色塊與結構，呈現多元視角在同一畫中，以表達最真實完整的形象，代表畫家為(A)畢卡索。

    23.(A)現代藝術所要傳達的是畫家個人眼中所見或心中所感之情，因此畫風不強調精細、寫實。(C)順序應為：印象主義→表現主義→達達主義。(D)現代主義藝術畫風愈趨脫離現實，使觀眾不易理解作品所欲傳達的涵義。

    24.1970 年代的兩次石油危機分別發生於 1973 年與 1979 年，正確答案為(D)。(A)(B)第一次石油危機與第四次以阿戰爭有關，第二次石油危機的背景為伊朗發生伊斯蘭革命。(C)第一次石油危機是阿拉伯產油國為報復西方支持以色列，決定聯合減產並對支持以色列的國家禁運石油，引發全球能源價格飆升與經濟衝擊。

    25.英、美兩國於 1948 年 6 月起頻繁的以飛機補給物資給某城市，可推知此城市為被封鎖的「西柏林」，答案為(B)。

    26.電影《驚爆十三天》描述的是古巴飛彈危機，發生在 1962 年 10 月。美國偵察機發現蘇聯在古巴祕密部署飛彈，因距離美國本土極近，引發美蘇之間高度緊張的對峙。美國總統甘迺迪決定對古巴實施海上封鎖，經過十三天的談判，雙方最終達成協議，避免了核戰爆發。

    27.(A)當時的蘇聯領導人是赫魯雪夫。(C)事件雖然促成美蘇之間的「熱線協定」與核武談判，但冷戰對立並未結束，仍持續到 1991 年蘇聯解體。(D)美國未出兵古巴，而是選擇對古巴海上封鎖，並透過外交談判解決危機。

    28.印度甘地採取「不合作運動」向英國抗爭，美國的馬丁．路德亦主張以平和的方式爭取種族平等，兩者的共同之處為(B)秉持非暴力的公民不服從精神。

    29.19 世紀末，隨著工業化與都市化的加劇，社會問題日益嚴重，促使許多知識分子開始質疑啟蒙時代所倡導的理性與科學進步觀，他們批判資產階級社會的虛偽與壓迫，並對自由民主制度的侷限提出質疑，對未來的樂觀想像也逐漸瓦解，轉而強調未來的模糊與不確定，呈現出「現代性危機」的思潮氛圍，故選(A)。

    30.圖中作品為杜象的《噴泉》，是達達主義的代表作。達達主義誕生於第一次世界大戰期間，反對一切傳統及既有的藝術形式，用偶然性、即興性的手法來創作，杜象以現成品顛覆藝術界對美的既定想像，挑戰何為藝術本質，象徵當時對理性、秩序與文明的反叛，故選(D)。

    31.(A)題文顯示法國人對美國文化的傳入有很大的爭議。(B)美式文化仍然傳入法國。(D)美式大眾文化通常透過傳播媒體宣揚、滲透。

    32.印象主義興起於 19 世紀後期，畫家受到都市生活與攝影技術的影響，轉而強調捕捉光影瞬間的變化與視覺印象。他們常描繪日常街景與戶外活動，使用明亮色彩與斷續筆觸，或以小色點堆疊畫面，表現畫面流動與不確定的特質，反映工業化社會中節奏加快與現代生活的特性，故選(C)。

    33.附圖為(B)畢卡索的〈格爾尼卡〉，內容在控訴 1936 ～ 1939 年的西班牙內戰所造成的人員傷亡。

    34.戈巴契夫於 1985 年出任蘇聯總書記，推動改革與開放政策，試圖挽救蘇聯內部經濟與政治危機。他對外放棄擴張政策，尋求與西方和解，與美國進行裁減核武談判，並停止干涉東歐事務，促使冷戰逐漸結束，對 20 世紀末的國際局勢產生重大影響。

    35.2014 年，伊斯蘭國（ISIS）在伊拉克崛起，領導人與宣傳影片中常以「十字軍再臨」來指涉西方軍事介入，號召信徒發動聖戰，報復歷史上的屈辱與現代的侵略。他們將西方軍隊視為十字軍的延續，並透過宗教語言正當化暴力行動，故選(A)。(B)當時剛脫離蘇聯，未見類似宗教激進言論或聖戰動員。(C) 1960 年，印尼以民族主義與反殖民為主，尚未出現將西方比喻為十字軍的激進宗教語言。(D)雖有聖戰號召，但 1916 年時尚無「戰機、戰車」等現代軍事術語出現。

    36.這部小說為卡夫卡的《變形記》，以超乎現實的故事情節，象徵現代人際關係的疏離冷漠，屬於(C)現代主義文學。

    37.第三世界國家不斷強調其經濟困頓及昔日列強殖民侵略的結果，要求外國的資金援助與技術轉移，形成新興開發中國家與已開發國家的對抗態勢，稱為(B)南北對抗。大致而言，世界先進國家多處於北半球，南半球則較多開發中國家，因而形成貧富分歧的「南北對抗」。

    38.從「推翻親西方的國王」與「迎接過去被流放的反西化領袖回國」，可知此為 1979 年伊朗的伊斯蘭革命，之後伊朗建立政教合一的共和國，宣揚回歸傳統文化，因此答案為(A)。(B)支持神權體制。(C)回歸傳統文化後，伊朗婦女的生活大受限制。(D)相對於共和國，之前的伊朗國王給予公民的自由權更高。

    39.(C)以色列並非石油輸出國組織的會員國，相反的，以色列是石油輸出國組織大部分會員國所敵視的對象，因此該組織常在以阿衝突中針對支持以色列的國家採取報復行動。

    40.(D)安迪．沃荷是美國普普藝術的代表人物，他以將大眾文化與藝術結合著稱，強調消費社會中的影像與符號。他曾大量創作如瑪麗蓮夢露、可口可樂罐與金寶湯罐等圖像。他的一句名言是：「賺錢是一種藝術，工作是一種藝術，好的生意就是最好的藝術。」正體現了他對藝術與商業融合的觀點。'
