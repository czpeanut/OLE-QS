  stem: 分析 1880 ～ 1890 年代歐洲的國際局勢，當時以哪兩個國家之間的矛盾最為嚴重？
  options:
  - label: A
    content: 英國與德國
  - label: B
    content: 法國與英國
  - label: C
    content: 奧國與法國
  - label: D
    content: 德國與義大利
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 普法戰爭後，德國與法國成為世仇，因此採取「孤立法國」的外交政策，與歐洲各國交好，使法國因此沉寂許久。但自 1880 年代德皇威廉二世上臺後，採取大海軍主義與世界政策，威脅到英國的海上霸權地位，從此德國與英國之間的矛盾逐漸加深，因此答案為(A)英國與德國。
