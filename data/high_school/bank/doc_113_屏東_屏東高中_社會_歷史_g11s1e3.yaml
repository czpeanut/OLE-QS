  group_stem: 某書描述了一位 19 歲的學生保羅．博伊默爾（Paul Bäumer）在學校教師的激勵下跟同學一起參加國民志願兵，在接受數星期嚴厲的新兵訓練後，便到前線與法軍作戰。戰爭的無情讓他彷彿活在地獄中，戰壕內都是老鼠、蝨子，烈性傳染病威脅著每個士兵的生命。保羅在戰爭過程中因傷放假回到故鄉，發現前線與後方的差距很大，後方的大家都相信政府的宣傳，以為前線已經沒有戰事。
  answer:
