  stem: 1948 年，亡國 2,000 多年的以色列重新復國，關於其經過及影響，下列敘述何者正確？
  options:
  - label: A
    content: 復國之地在巴勒斯坦
  - label: B
    content: 納粹屠殺猶太人使國際間同情猶太人，有助其復國
  - label: C
    content: 因為德國的大力支持而得以復國
  - label: D
    content: 復國時巴勒斯坦地區成為巴勒斯坦與以色列兩個國家
  - label: E
    content: 復國後隨即面臨阿拉伯聯盟的軍事攻擊
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(C)以色列的復國，主要是受到美國等西方國家的支持。(D) 1948 年以色列宣布建國時，當時尚未有巴勒斯坦國。

    44.19 世紀末至 20 世紀中葉，藝術風格多元發展。梵谷以強烈筆觸與色彩代表後期印象派；畢卡索創立立體派，重構視覺空間；莫羅．大衛擅長靜物描繪，是超寫實主義代表；馬爾克以動物為題展現表現主義風格；雷內．馬格利特則以夢境意象呈現超現實主義精神。

    45.(C)亦有亞洲、拉丁美洲國家，並非全是黑人。(D)美、蘇皆極力在聯合國拉攏第三世界勢力。(E)雖然美國成為唯一超級強權，但許多第三世界國家依然強調自主外交，並未普遍「依附美國」。

    46.(A)第一次世界大戰時尚未有電視。(C)古巴飛彈危機並未發生戰事，不可能有人「中彈身亡」。(E)九一一事件發生時，美國總統為小布希。

    47.現代主義文學多強調個人創意與自主思想，關注個人內心的感受與自省，並期許以新的視野看新的時代，作家也常使用隱喻、象徵、情節穿插等新穎的方式寫作，不拘於傳統格律，由於受到戰爭的影響，戰間期的文學作品亦呈現悲觀、空虛、厭世與嫉憤的風格，因此答案為(A)(D)(E)。

    48.(A) 1961 ～ 1975 年。(B) 1914 ～ 1918 年。(C) 1950 ～ 1953 年。(D) 1990 ～ 1991 年。(E) 2001 ～ 2021 年。答案為(A)(B)(C)(D)。'
