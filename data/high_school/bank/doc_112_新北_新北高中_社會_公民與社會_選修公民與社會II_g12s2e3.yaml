  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 契約成立的前提是當事人、意思表示以及標的三成立要件都具備，若當事人未就契約的主要條款未達成合意，像是未作出承諾，或未就法定必須採取書面形式的契約達成書面的協定，那麼契約就不成立。此案例中，小青並無締結買賣契約之意願，無法達成意思表示一致，因此契約不成立，小青應能向小花討回手鍊，答案為(B)。
