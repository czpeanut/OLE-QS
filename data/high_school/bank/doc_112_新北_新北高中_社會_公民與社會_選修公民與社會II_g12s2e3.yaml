- id: doc_112_新北_新北高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某公司老闆聘僱乙教練教全家人打球，但乙教練卻和老闆的妻子發展婚外情，老闆憤而對乙教練提告求償。如果你是老闆請的律師，你會如何保障老闆權利，以下何項主張是正確的？
  options:
  - label: A
    content: 乙教練侵害老闆的配偶權，此權利非屬財產權，與老闆身分密不可分
  - label: B
    content: 老闆可提告是因為身分權涉及人倫秩序，跟財產權比，較不具強制性
  - label: C
    content: 關於外遇案件，法官不會審酌雙方學、經歷，因為外遇與學經歷無關
  - label: D
    content: 老闆自身財力較乙教練雄厚，因此無法請求非財產損害的精神慰撫金
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)無論是財產權或非財產權，都是法律保障的範疇，皆具強制性。(C)侵害配偶權之賠償，判決書裡會寫「精神慰撫金」，而精神慰撫金之金額，法官會審酌配偶權受侵害之程度、雙方之職業、經濟能力等來認定金額之多寡。(D)老闆的財力雖雄厚，但其配偶權受侵害，仍可求償精神慰撫金。
  tags:
