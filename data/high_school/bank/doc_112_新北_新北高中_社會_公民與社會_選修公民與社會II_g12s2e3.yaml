  stem: 由於網路科技發達，資訊流通快速，有愈來愈多的創作者將經典電影海報進行修改，創造出更豐富的作品，然而改作經典電影海報時，應取得著作權人的同意，避免侵害其「甲：改作權」；假若創作者惡搞經典電影海報，以歪曲、竄改的方式，損害了著作權人的名譽時，將會侵害其「乙：禁止不當修改權」。請問下列對於「甲」、「乙」兩項著作權的比較，哪些正確？
