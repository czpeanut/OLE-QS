- id: doc_112_新北_新北高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 甲女在網路上認識一名自稱某國際組織軍人之乙男，在乙男噓寒問暖、甜言蜜語攻勢下，甲女迅速陷入異國戀情。日前乙男表示臨時急需用錢為由，要求甲女至郵局辦理匯款 15 萬元，剛好警方巡邏，發現乙男謊言連篇，甲女這才知道被騙了。根據我國法律，乙男的行為最有可能觸犯何種法律？
  options:
  - label: A
    content: 乙男自稱某國際組織軍人觸犯了《刑法》加重誹謗罪
  - label: B
    content: 乙男要求甲女至郵局辦理匯款，違反《刑法》妨害電腦使用罪
  - label: C
    content: 乙男利用花言巧語，欺騙甲女將其財務匯出，構成《刑法》詐欺罪
  - label: D
    content: 乙男要求甲女至郵局匯款，限制甲女人身自由，觸犯《刑法》妨害自由罪
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是觸犯詐欺罪。(B)甲女主動匯款，不構成妨害電腦使用罪之要件。(D)要求他人匯款是詐欺其財產，但沒有限制甲女之人身自由，因此不算觸犯妨害自由罪。
  tags:
    unit:
