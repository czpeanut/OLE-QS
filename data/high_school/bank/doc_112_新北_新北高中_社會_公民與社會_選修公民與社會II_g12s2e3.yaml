  stem: 桃園航空城如火如荼推動，徵收補償的價格備受爭議，議員指出隨著物價上漲，營建成本增加，恐負債重建，也點出交通用地及水利用地協議價購金額應調漲。公督盟祕書長也率領徵收戶至議會前表示「我要一個家，我不要負債重建」抗議。請問根據上述內容，下列敘述何者較為正確？
  options:
  - label: A
    content: 市政府辦理區段徵收應基於損失補償，給予人民相對應的補償
  - label: B
    content: 桃園航空城徵收戶若不滿徵收價格，可依據《民法》請求政府賠償
  - label: C
    content: 桃園航空城徵收戶若不滿徵收價格，依法可以拒絕政府的徵收
  - label: D
    content: 市政府依法徵收土地的行為，即本身有過失責任才需要補償
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)應依《土地徵收條例》及相關辦法辦理。(C)若依據《土地徵收條例》同意徵收，無法因補償價格而拒絕徵收。(D)土地徵收是基於公益侵害人民權利而給予補償，並非政府具有過失責任。
  tags:
