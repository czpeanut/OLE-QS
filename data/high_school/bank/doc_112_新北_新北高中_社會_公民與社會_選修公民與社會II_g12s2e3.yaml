  explanation: (A)著作完成後，毋需登記即享有著作權。著作權屬於「無體財產權」、「智慧財產權」。指人類運用精神力之創作成果與相關的勞動成果。例如：著作權、商標權、專利權。而著作權採創作保護主義則是著作人於著作創作完成時即取得著作權。(B)題文所述為著作財產權，而姓名表示權屬於著作人格權。(E)應是要求財產上的損害賠償。(C)(D)為著作財產權之特性，為正解。
