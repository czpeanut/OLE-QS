  stem: 北院一審判決中指出「衛福部定義其他不正當方式為宣傳的範圍，是協助下級機關判斷違規與否，屬解釋性行政規則，解釋內容未逾越母法文意可能之範圍，內容明確，也不牴觸法律及立法意旨。」該判決認為衛福部並無違反法律保留原則，請問衛福部的行為為何種層級化的法律保留？
  options:
  - label: A
    content: 憲法保留
  - label: B
    content: 絕對法律保留
  - label: C
    content: 相對法律保留
  - label: D
    content: 不屬於法律保留範圍
  group_stem: 臺北市衛生局 2017 年間查出，某整型外科診所在網站上宣傳治療男性性功能障礙儀器，認為該廣告違反《醫療法》「以其他不正當方式為宣傳」規定，開罰 15 萬元。該診所負責醫師提告救濟，主張衛福部，過度限制商業性言論，侵害《憲法》保障的言論自由，且無任何保護法益，違反比例原則。診所負責醫師為此提行政訴訟救濟，打了 3 年多官司，但臺北高等行政法院認為廣告誇大不實，確實違規，維持更一審見解，判醫師敗訴確定。
