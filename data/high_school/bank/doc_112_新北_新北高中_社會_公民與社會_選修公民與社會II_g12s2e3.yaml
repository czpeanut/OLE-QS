  stem: 丙男邀丁女到郊外涼亭發生性行為，私下通知死黨躲在附近偷窺並拍攝影片，不料事後偷拍影片外流，丁女怒而提告，檢方卻認定不構成妨害祕密罪。以下丁女採取的主張或做法何項「不符合」我國法律規定？
  options:
  - label: A
    content: 尋求民事的途徑提告，請求損害賠償
  - label: B
    content: 要求禁止散布影片的侵害除去請求權
  - label: C
    content: 妨害祕密罪不成立，因此無法要求精神慰撫金
  - label: D
    content: 影片外流導致名譽受損，侵害了「特別人格權」
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)皆符合我國法律規定。(C)丙男偷拍影片並外流之做法，已成立妨害祕密罪，丁女可要求精神慰撫金。
