  type: single
  page: 1
  stem: 小花和巧虎是高中同班好友，某天小花得知巧虎的 e-mail 帳號及密碼。小花在未經巧虎的同意，無故登入巧虎個人 e-mail，窺視並複製巧虎與他人的信。請問下列選項何者正確？
  options:
  - label: A
    content: 小花未成年，故所為雖有違法之疑慮，然尚不構成犯罪
  - label: B
    content: 小花所為已侵害巧虎的著作權，檢調單位可依法起訴小花
  - label: C
    content: 小花所為說明科技發展之下，社會規範尚無法與時俱進
  - label: D
    content: 小花所為已違反《刑法》的「無故入侵他人電腦設備罪」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)未成年違法仍為犯罪，僅是得減刑。(B)此應是涉及《刑法》的妨害電腦使用罪，因此檢調單位可起訴小花。(C)(D)現今已有妨害電腦使用罪，有法律可懲罰此行為，故(D)正確。
