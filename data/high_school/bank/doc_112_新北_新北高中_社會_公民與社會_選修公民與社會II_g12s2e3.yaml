  stem: '月姝國有一對交往六年且論及婚嫁的情侶，女方林小姐要求男方戴先生事先簽訂婚前協議書，才願意答應男方的求婚。戴先生為了愛情孤注一擲簽下婚前協議，以下為該婚前協議書內容（甲方為林小姐、乙方為戴先生）：

    1.甲方婚後不想住婆家。

    2.婚後購置的不動產，必須登記在甲方的名下。

    3.婚後乙方的薪水，除了零用外，都交給甲方統籌運用。

    4.如果因外遇，必須無條件離婚，並將由甲方擔任監護人。

    5.離婚後，乙方必須放棄對甲方的夫妻剩餘財產請求權。

    假定該國的《民法》規定與我國類似，上述條款產生法律效力的敘述，何者最適當？'
  options:
  - label: A
    content: 避免日後住在婆家可能發生的婆媳問題，事先協議婚後居所，具法律效力
  - label: B
    content: 婚後購置的不動產，由夫妻兩人一起購買，應改為共同持有，故不產生法律效力
  - label: C
    content: 基於社會上普遍存在性別不平等的現象，婚後薪水交由甲方管理，對女性來講較有保障，故具法律效力
  - label: D
    content: 因外遇而離婚，將由甲方擔任監護人，牽涉到離婚條件之預立，違背婚姻存續之善良風俗，故不具法律效力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 《民法》第 72 條規定：「法律行為，有背於公共秩序或善良風俗者，無效。」目的在於調和私法自治，雖然民事契約可由當事人自行約定，但也並非漫無限制。外遇離婚牽涉到離婚條件之預立，違背婚姻存續之善良風俗，因此契約無效。《民法》第 1002 條規定，夫妻可約定婚後的居住地，協議與公婆、岳父母同住、或是夫妻兩人自住等，具有法律效力。故(A)(D)皆正確。
