  stem: 同學在課堂上提出疑問：「我的作品不想用本名發表可以嗎？會不會影響我的權利？別人冒用我的名字發表作品有沒有侵犯我的著作權？」請問這位同學提出的疑問屬於《著作權法》中所保護的哪一種權利？
  options:
  - label: A
    content: 著作人格權
  - label: B
    content: 公開傳輸權
  - label: C
    content: 公開展示權
  - label: D
    content: 公開播送權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 此案例所涉及的範疇為「姓名表示權」，指著作人在完成著作以後，對於他的著作，有權決定要以何種方式表示著作人的姓名，故答案為(A)。
