- id: doc_112_新北_新北高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 甲民代在網路直播時，指稱當時擔任某黨發言人的乙某「賺紅錢」被起訴。判決書指出，甲民代涉犯 2 次誹謗罪部分事實明確，且事後未能和解，依 2 個誹謗罪，合併執行拘役 80 天，得易科罰金，全案可上訴。同學討論關於誹謗罪的內容，以下何者說法是正確的？
  options:
  - label: A
    content: 甲：「網路直播不構成讓多數人或是不特定人有可能看見或聽見的場所」
  - label: B
    content: 乙：「甲指稱乙『賺紅錢』屬於不具評論性質的抽象謾罵、侮辱，故有罪」
  - label: C
    content: 丙：「甲被起訴屬於網路內部規範，透過輿論壓力以規範直播主的行為」
  - label: D
    content: 丁：「誹謗罪指針對特定對象發表跟具體事實有關，損毀乙某的名譽」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)網路直播構成讓多數人或是不特定人有可能看見或聽見的場所。(B)屬於具評論性質的抽象、侮辱，因此有罪。(C)起訴屬於違反《刑法》，為國家公權力的行使，並非輿論壓力。
  tags:
