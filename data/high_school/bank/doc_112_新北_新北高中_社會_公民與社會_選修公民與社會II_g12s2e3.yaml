  type: single
  page: 1
  stem: 新聞報導：中國從 2020 年 3 月 1 日起禁止進口臺灣鳳梨，最近在網路上也有一則網購廣告，說「救救臺東鹿野金鑽鳳梨」，希望消費者網購鳳梨乾，並以 5 折優惠價銷售，藉此吸引消費者。消費者訂購後，發現業者送來的不是鳳梨乾是一疊報紙。請問新聞報導中業者之行為與下列何者是相同類型的犯罪？
  options:
  - label: A
    content: 甲留言辱罵乙「整型失敗的臉」、「BMI 超標」等語
  - label: B
    content: 甲趁著女友不注意，偷拍下兩人性愛影片並上傳網路
  - label: C
    content: 甲登入乙的會員帳號及密碼登入，偷走乙的裝備、道具等虛擬寶物
  - label: D
    content: 甲透過交友網站認識異性，遊說其投資金融產品，藉機詐取指導費
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 文中業者犯的是詐欺罪。(A)屬於誹謗罪。(B)侵害隱私權。(C)屬於妨害電腦使用罪。(D)此屬於詐欺罪，與題文相同，為正解。
