  stem: 臺中市一家農地違建工廠加上廢棄原料疏於管理，36 天內發生 5 起火警，造成空氣汙染，臺中市政府限期拆除改善，業者未如期完成，市政府將貫徹公權力依法行政，維護農地合法使用及環境安全維護。根據文中的市政府拆除違建建築與下列何項行政行為的類型相同？
  options:
  - label: A
    content: 政府限制醫護人員出國
  - label: B
    content: 大學發放學生畢業證書
  - label: C
    content: 政府發放敬老津貼措施
  - label: D
    content: 政府發放三倍券活絡經濟
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 市政府拆除違章建築屬於「干預行政」，係指國家為達成下命禁止或確認之效果，干預人民權利，課予人民義務或負擔之行政行為，與(A)相同。(B)(C)(D)皆為給付行政，係指國家提供人民服務或照顧人民生活上需求之行政行為。
  tags:
    unit:
      code: CI-S2-5-1
