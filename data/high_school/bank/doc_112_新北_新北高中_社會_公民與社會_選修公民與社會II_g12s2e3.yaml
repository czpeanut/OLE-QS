  explanation: (A)「公然」的意義，依據司法院院字第 2033 號與第 2179 號解釋：只要是行為當時為「不特定人或多數人得以共見共聞之狀況為已足」。解釋文中所稱的「多數人」，係包括特定之多數人在內。直播平臺屬於公然領域，(B)正解。(C)此為非告訴乃論之罪，檢方可主動偵查案件。(D)依據《個資法》第 2 條第 1 款規定，凡是屬於自然人的姓名、生日等得以直接或間接方式識別該個人之資料，皆屬該法保護之客體。影像當然屬於《個資法》保護之範疇。《刑法》第 235 條：「散佈、播送或販賣猥褻之文字、圖畫、聲音、影像或其他物品，或公然陳列，或以他法工人觀覽、聽聞者，處二年以下有期徒刑、拘役或科或併科三萬元以下罰金。」甲的行為符合該條文定義，故(B)為正解。
