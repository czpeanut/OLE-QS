- id: doc_112_新北_新北高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 被告甲對於社區管理有爭議，甲跟乙發生衝突時對原告乙進行拍攝，乙主張甲侵害了他的肖像權，並請求精神慰撫金。經法院審理後認定，甲拍攝之地點為公眾得出入之場所，拍攝之內容亦與上揭社區事項之公共利益有關，應為可受容忍之事，尚難謂其有侵害乙肖像權且情節重大。下列何者的說法是正確的？
  options:
  - label: A
    content: 只要未經乙同意，甲擅自拍攝乙的肖像，就一定侵害乙的肖像權
  - label: B
    content: 甲拍攝乙肖像是基於公益目的，且手段合理必要，不侵害肖像權
  - label: C
    content: 乙不是公眾人物，肖像本身沒有經濟上的價值，無法主張肖像權
  - label: D
    content: 法院審理後認定，此案件的私益大於公益時，不會構成違法行為
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 肖像權並非牢不可侵，司法實務上惟人格權侵害責任之成立以不法為要件，而不法性之認定，採利益衡量原則，就被侵害之法益、加害人之權利及社會公益等，依比例原則而為判斷；倘衡量之結果對加害人之行為不足正當化，其侵害始具有不法性。法院主要會考量以下 3 項要件：(1)蒐證手段是否逾越必要範圍、(2)有無侵害他人肖像權之意圖、(3)有無擅自使用他人肖像。此案例屬於合理使用的肖像權使用範圍，故選(B)。
