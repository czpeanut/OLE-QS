  stem: 北國一所貴族學校內，學生間有金錢糾紛，起因為家境富裕的小花，看見同班同學小青手上的限量款手鍊相當時髦，想用高於原價 5 倍的價格向小青買手鍊，雖然小青不願意賣出。但小花仍然準備好現金，並且放入小青的錢包中，硬是把小青的手鍊取下拿走，小青感到既錯愕又不甘心。假定北國的民法規定與我國類似，請問小青是否能向小花討回自己的手鍊？
