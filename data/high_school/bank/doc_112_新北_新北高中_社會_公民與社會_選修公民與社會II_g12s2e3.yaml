  explanation: 相對法律保留是指如果牽涉到對人民某些自由權利的限制，或者是涉及重大公共利益的給付行政措施（如補助、津貼），必須由法律規定，或至少要由法律明確的授權給主管，用命令來規定之。依照此案例內容「解釋性行政規則，解釋內容未逾越母法文意可能之範圍，內容明確」符合前述概念，答案(C)。
