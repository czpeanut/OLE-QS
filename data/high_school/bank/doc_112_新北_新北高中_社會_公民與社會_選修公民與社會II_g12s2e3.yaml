  stem: 甲與女友相約汽車旅館約會，期間甲未經女友同意，偷偷以社群平臺直播兩人的性愛過程。事後更將錄製的影片轉傳給數位好友炫耀。女友得知後精神受到極大創傷，向警局報警。警方將甲逮捕歸案，移送法辦。關於甲的行為，下列分析何者正確？
