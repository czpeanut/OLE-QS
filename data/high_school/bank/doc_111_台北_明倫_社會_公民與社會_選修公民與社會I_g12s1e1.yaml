- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 帛琉總統惠恕仁（Surangel S. Whipps Jr.）今年參加我國國慶在臺灣停留期間接受媒體訪問表示：帛琉主要收入靠國際觀光客，近三年的疫情影響，使帛琉的 GDP 減少 30 ％。今年 4 月開始，各國陸續恢復觀光，帛琉 98 ％的人口都已經施打疫苗，達到群體免疫，故而非常期待各國遊客的到來。他特別指出：爭取臺灣人赴帛琉觀光有一大困難是航班太少又機票太貴，從臺灣飛往新加坡的距離與飛往帛琉是相同的，但飛往帛琉的票價卻比往新加坡貴了兩倍。請以所學判斷下列敘述何者最正確？
  options:
  - label: A
    content: 外交部應為鞏固邦交國情誼而長期補貼所有航空公司加開直飛帛琉班次
  - label: B
    content: 飛往帛琉的票價比往新加坡貴了兩倍是因為需求太少造成航空業者飛此航線若比照新加坡航線則會不敷成本
  - label: C
    content: 近三年的疫情影響使帛琉 GDP 減少 30 ％，可見帛琉國民所得計算十分仰賴「進口」項目的觀光客
  - label: D
    content: 帛琉 98 ％的人口都已經施打疫苗，就公共衛生環境的總效益而言，猶如人人創造了傳染病的外部成本
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)長期補貼加開航班並非長久之計。(C)帛琉仰賴觀光客帶來的效益，外國觀光客來到帛琉，帛琉輸出旅遊服務，應是屬於「出口」項目。(D)應是「外部效益」。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
