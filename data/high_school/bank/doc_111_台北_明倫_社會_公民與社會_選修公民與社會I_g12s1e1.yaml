  stem: 「某國政府之執政黨為國會多數黨，新上任領導人推出迷你預算：經濟大減稅且以舉債支應振興經濟所有開銷，消息一出，引發公債殖利率飆升，外匯市場匯率上升；迫使政府很快就幾乎撤銷全盤計畫，原先發布減稅計畫的財相也被炒魷魚。民調顯示民意支持度掉到 9 ％，面對超過 100 位執政黨籍的國會議員連署要求舉行改選黨魁選舉，因而辭任首相與黨魁職務，一個月內執政黨黨魁換成該國史上首位非白人的移民第二代印度裔出任。」依據題文訊息判斷該國的政治體制，下列敘述何者最可能？
  options:
  - label: A
    content: 最高行政首長兼任政黨領導人
  - label: B
    content: 該國選舉制度為比例代表制
  - label: C
    content: 該國係採聯合內閣的模式
  - label: D
    content: 國會議員不可兼任官吏
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 根據題幹可判斷該國為內閣制，由印度裔黨魁推測為英國現任首相蘇納克。(B)由題幹無法判斷。(C)題幹提及該黨為國會多數黨，因此不可能組成聯合內閣。(D)內閣制行政、立法相互融合，國會議員得兼任內閣。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_6
  section: 1
