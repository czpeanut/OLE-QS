- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '下表為安安為姐姐整理內閣制、總統制、我國體制中憲政的比較表，請問何者正確？

    |  | 內閣制 | 總統制 | 我國體制 |

    | --- | --- | --- | --- |

    | (甲)國家元首掌實權否？ | 否 | 是 | 否 |

    | (乙)國會議員能兼官吏否？ | 是 | 否 | 否 |

    | (丙)行政權對立法權的制衡設計 | 能解散國會 | 覆議否決權 | 無 |

    | (丁)內閣首長是否民選 | 是 | 否 | 是 |

    | (戊)倒閣權之有無 | 有 | 無 | 有 |'
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (丙)(丁)
  - label: C
    content: (丁)(戊)
  - label: D
    content: (乙)(戊)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)我國為雙首長制，國家元首握有實權；(丙)我國設有解散國會、覆議等制衡制度；(丁)我國內閣首長並非由人民選出。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '某國舉行國會大選，某選區共有 38 位參選人競爭 8 席，下表是該選區 8 位得票最高當選人的資料。該國某政治學者據此結果撰文評論其選舉制度問題。下列何者最可能是該學者提出的問題？

    | 當選名次 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 所屬政黨 | 甲 | 乙 | 乙 | 丙 | 甲 | 甲 | 甲 | 丁 |

    | 得票率（％） | 19.8 | 9.4 | 6.9 | 4.6 | 3.5 | 3.4 | 2.8 | 2.7 |'
  options:
  - label: A
    content: 席次常有時與得票率不成比例
  - label: B
    content: 選民只能投給政黨不能挑選候選人，有違民主精神
  - label: C
    content: 讓同選區當選者的民意基礎差距過大
  - label: D
    content: 造成贏者全拿，未充分反映民意
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹描述為複數選區制。(A)表格只呈現各當選者的得票率，並無法反映此情形。(B)此處並非投票給政黨，且投票給政黨也是表達支持某一政黨的一種民主方式。(D)複數選區並非贏者全拿。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 4
  stem: 國民參與審判的政策，有助於建立民主課責下的何種效果？
  options:
  - label: A
    content: 委外化節省公帑
  - label: B
    content: 參與成員的多元性視角與代表性
  - label: C
    content: 提高公開審判的透明度
  - label: D
    content: 彌補偵查不公開的缺點
  group_stem: '國民法官制度將於民國 112 年（2023 年）1 月 1 日正式施行，從年滿 23 歲且在地方法院轄區內連續居住滿 4 個月以上的國民中，透過隨機抽選並經選任程序，抽選出 6 位「國民法官」及 1 至 4 位的「備位國民法官」。國民法官法庭是由 3 位法官加上 6 位國民法官，總共 9 人共同組成合議庭，合審合判來作成判決的決定。根據《國民法官法》第 5 條規定，只有發生死亡結果的故意犯罪（如：普通殺人、傷害致死等……）和最輕本刑 10 年以上的重罪，才會開啟國民法官參與審判的程序。

    讓完全沒有審判專業知識、經驗的一般國民加入審判程序，參與聽訟、問案及最後判決的形成。參考國外經驗顯示，來自不同社會階層、出身背景，擁有不同生活經歷的國民，得以直接在法院形成判決過程中，提供他們寶貴的生活經驗、法律感情及不同的價值觀，有助於豐富法院的判斷視角及審判正當性。

    被遴選為國民法官的民眾，就有義務參與審判，無故不出庭將可處新臺幣 6 萬元以下罰鍰，萬一被選上後遇重大事故，無法繼續擔任，由備位的國民法官遞補。「年滿 70 歲以上者」、「公立或已立案私立學校的教師、在校學生」、「因生活上、工作上、家庭上的重大需要致執行國民法官、備位國民法官職務顯有困難」等，有這些情形之一者，得拒絕被選任為國民法官、備位國民法官。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹提及國民參與審判有助於增加法院的判斷視角、審判正當性，因此與(C)「提高公開審判的透明度」具有關聯。
