  stem: 關於此次選舉的敘述，何者是正確的？
  options:
  - label: A
    content: 此次選舉全部採用複數選區相對多數決制
  - label: B
    content: 選出人員包括各地行政首長與中央及地方民意代表
  - label: C
    content: 戶籍設籍於臺中市和平區的小花要領的選票包括市長、市議員、里長 3 張票
  - label: D
    content: 受褫奪公權者仍可參與投票
  group_stem: 2022 年底舉行中華民國史上第三次九合一地方公職人員大選並且另與第八次憲法修正案之複決公投（又稱 18 歲公民權修憲案）同時舉行，此次選舉應選名額共計 1 萬 1023 名，包括 6 名直轄市長、16 名縣市長、910 名直轄市及縣市議員、204 名鄉鎮市長及原住民區長、2139 名鄉鎮市民代表及原住民區民代表、7748 名村里長，當選人於 2022 年 12 月 25 日就職。
  shared_asset: g1_2_4
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)僅有「直轄市及縣市議員、鄉鎮市民代表」採取複數選區。(B)此次選出人員沒有中央民意代表。(C)該區為原住民自治區，會另外有區長及區民代表選票。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
