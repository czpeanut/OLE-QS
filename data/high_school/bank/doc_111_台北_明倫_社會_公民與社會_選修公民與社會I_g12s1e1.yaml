  stem: 關於九合一選舉將選出的各項人員之比較，何人的說法與我國政府體制最為相符？
  options:
  - label: A
    content: 鯨魚姊：各縣市及鄉鎮市民代表的選舉制度與原住民立委的選舉方式較有利小黨的生存
  - label: B
    content: 董格拉米：直轄市原住民區長的選舉制度容易出現走偏鋒激進的極端當選人
  - label: C
    content: 濬皓哥：選出的公職人員任職之處皆為地方自治團體
  - label: D
    content: 明錫學長：直轄市長、縣市長、鄉鎮市長及村里長的選舉制度能夠反映多元的意見
  group_stem: 2022 年底舉行中華民國史上第三次九合一地方公職人員大選並且另與第八次憲法修正案之複決公投（又稱 18 歲公民權修憲案）同時舉行，此次選舉應選名額共計 1 萬 1023 名，包括 6 名直轄市長、16 名縣市長、910 名直轄市及縣市議員、204 名鄉鎮市長及原住民區長、2139 名鄉鎮市民代表及原住民區民代表、7748 名村里長，當選人於 2022 年 12 月 25 日就職。
  shared_asset: g1_2_4
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)持極端意見的候選人若要當選，較容易出現在複數選區，然而原住民區區長為單一選區相對多數制。(C)直轄市、縣、市及鄉、鎮、縣轄市、直轄市山地原住民區均為地方自治團體，依法辦理地方自治。鄉鎮市之下的村、里並非地方自治團體。(D)相關選舉皆是單一選區制，對大黨有利，不利反映多元意見。
