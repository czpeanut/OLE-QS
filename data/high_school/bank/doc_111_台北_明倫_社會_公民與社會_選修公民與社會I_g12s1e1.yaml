  stem: 日本泡沫經濟破滅後，連續多任首相任期都僅能勉強超過一年，澳洲在 12 年內換了 9 任總理，歐洲各國總理任期比英國前首相特拉斯（Liz Truss）短的，也有 4 位。如何以民主理論合理看待此政局更迭的現象？
  options:
  - label: A
    content: 選民的投票行為時常太過政黨取向，含淚投票也要支持鍾愛政黨提名的爭議人選
  - label: B
    content: 政治領袖犯錯就必須負責任下臺，正是內閣制政府的核心價值
  - label: C
    content: 7 年內換了 5 位首相的國家一定無法與領導人不再受任期限制而能長期掌權的國家競爭
  - label: D
    content: 首相是間接選舉產生因此缺乏民主統治正當性
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)內閣制的首相為多數黨黨魁，當其政策不獲多數民意支持時，將下臺由多數黨重新選舉新任黨魁後上任，與選民投票行為無關。(C)仍有機會與長期掌權的國家競爭。(D)直接選舉或間接選舉與統治正當性並沒有關聯。
