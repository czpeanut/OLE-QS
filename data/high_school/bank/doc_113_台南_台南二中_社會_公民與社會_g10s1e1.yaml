  group_stem: '為了紀念諾曼第登陸行動 80 周年，300 多名英國、比利時、美國傘兵重現 1944 年 6 月 6 日從納粹德國手中奪回法國西部的空降行動。然而英國傘兵卻得面對與當年不同的境遇：自英國脫歐後，歐盟成員國提高英國遊客和居民的邊境檢查強度，因此著陸後必須通過法國護照檢查。

