- id: doc_113_台南_台南二中_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 公民與社會課時任課老師請同學比較「國家」與「政府」的差異，請問哪一位同學的分析正確？
  options:
  - label: A
    content: 杰哥：國家的存續會隨著政府的更換而改變；政府的存續會隨選舉的結果而更迭
  - label: B
    content: 阿瑋：國家的權力源自於人民委託的主權；政府的權力則具有排他性與最高性
  - label: C
    content: 彬彬：國家經由人民將主權委託給政府組成；政府由人民在領土內組成行使統治
  - label: D
    content: 小昀：國家須具備主權、領土、政府、人民；政府由一套法律規範及一組人組成
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國家存續並不會隨政府更換而改變。(B)國家中的主權具有排他性及最高性。(C)應是人民透過契約，將主權授權給主權者（即政府）行使。
