    content: 人權條約機構
  - label: C
    content: 國際特赦組織
  - label: D
    content: 地球公民基金會
  group_stem: '安娜瑪麗亞是一位慈愛的母親，她喜歡和女兒一起參加巴西薩爾瓦多的音樂會和文化活動。然而，自從兒子佩德羅死後，瑪麗亞感覺有一部分的自己也被奪走了。

    佩德羅達成很多成就，他是種族正義和人權的社運人士兼倡議者，也曾在巴西巴伊亞州的圖卡努籌辦「和平遊行」，為警方針對黑人社群的暴虐行徑發聲。然而在遊行的時候卻遭受警方的敵意和恐嚇，警察開始監視佩德羅，只因為他的社運工作就開始威脅和暴力攻擊他。2018 年，佩德羅的住家遭到 3 名戴頭套的男子突襲，當時他和女友已經就寢。他的頭部和頸部中彈 8 次而亡，女友認出突襲的 3 名男子就是警察。2019 年，涉嫌殺害佩德羅 3 名警察被起訴，但將近 5 年過去，他們仍在執行勤務，審判也尚未開始。

    儘管不斷受到威脅，還需承受失去孩子的悲痛，瑪麗亞仍勇敢尋求兒子死亡的真相，呼籲當局進行徹底的調查和審判。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)國際特赦組織是一個國際非政府組織，總部位於英國倫敦，致力於推動全球人權事業的發展，在全球擁有大約 7 百萬成員及支持者。該組織的工作方針是對人權狀況進行調研，採取相應行動，尋求終結各種侵犯人權的行為，並且為那些遭受迫害的人們伸張正義。
