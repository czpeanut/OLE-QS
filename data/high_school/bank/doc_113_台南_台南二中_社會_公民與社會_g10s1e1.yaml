  group_stem: '近年來，中共積極在南海島礁填海造陸，引發越南和菲律賓等周圍國家的共同譴責外並引起國際社會的關注。另一方面，美國也多次要求中共在南海島礁停止填海造陸工程及軍事設施的建造，以避免製造該區域之緊張情勢，卻讓中共當局在南海採取軍事部署作為的強硬態度以回應美國。

    南海諸島控制通往印度洋和太平洋之間的海上航線，特別是亞太各國由波斯灣經由麻六甲海峽的油輪航線，也是世界海運最繁忙的海域，因此對亞太各國而言，此航線在國防與經濟上都具有重要的戰略價值。就經濟資源方面，南海諸島蘊藏豐富的自然資源，經調查附近水域海床與底土具有錳、鎳、鈷、鈦等稀有礦藏，也是各國漁業重要的作業漁場。最重要的是本區域蘊藏不少石油與天然氣資源，令周邊國家垂涎。

    由於《聯合國海洋法公約》中規定各國可從所擁有的島礁依規定延伸出 12 浬領海、200 浬專屬經濟區及 350 浬大陸棚，但公約卻未對「島嶼」、「岩礁」與「人工島」做出明確的界定，究竟面積要多大才能稱為島嶼、在自然形成的岩礁上興建人工設施是否應視為自然形成的島嶼，國際法學者對此並無共識，使得中共近期積極興建南海「人工島」，作為宣示主權之依據。

    「中共在南海島礁填海造陸之戰略手段與軍事意涵」〈陸軍學術雙月刊〉第五十三卷第 552 期，蔡志銓 2017.04'
