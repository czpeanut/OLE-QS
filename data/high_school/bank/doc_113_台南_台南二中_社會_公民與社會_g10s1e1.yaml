  - label: D
    content: 我國應遵循《保護所有移徙工人及其家庭成員權利國際公約》
  group_stem: '近日在社群媒體有民眾貼出監視器影片，影片內容為在臺灣的外籍移工於雇主家中，在其照顧的長者旁邊產下嬰兒，影片中還可清晰聽到嬰兒的哭聲。初步調查，該移工僅來臺 5 個月，來臺前於母國有進行妊娠檢驗（懷孕），但移工供稱是拿朋友的檢體掩飾，來臺灣後也未向雇主坦誠，且嬰兒父親同為外籍身分，但未在臺灣，因此直到嬰兒出生才東窗事發。

    對此，勞動部表示依法規目前來臺移工健康檢查並無納入妊娠檢驗，針對此案後續如雇主與移工雙方同意解除契約，雇主才可聘用新的移工，否則依照《性別平等工作法》規定，雇主不能以移工懷孕生產為理由片面解僱，否則將依法開罰。雇主也只能無奈表示，這下不只自己要分心照顧長者，還要協助移工坐月子跟照顧嬰兒，讓家庭日常陷入困境。

    勞動部亦發布新聞稿強調，為協助移工在臺工作期間的懷孕、生產及子女照顧等需求，現正規劃訂定移工婦幼權益保障指引，今年已 2 次邀集衛福部、移民署、移工來源國辦事處、雇主、仲介及移工團體等共同討論。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因為移工在我國工作，應適用我國之相關法律。(C)憲法對於普世人權的基本保障，應適用於所有的人民，不侷限於國民享有。(D)我國並未將《保護所有移徙工人及其家庭成員權利國際公約》國內法化。
