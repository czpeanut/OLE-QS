  type: single
  page: 1
  stem: 有關我國現行落實兩公約的各項措施，何者最為正確？
  options:
  - label: A
    content: 隸屬總統府的人權諮詢委員會，負責推動公約的落實及法制化
  - label: B
    content: 由聯合國人權理事會定期指派人權專家來臺進行審查執行成果
  - label: C
    content: 我國以「施行法」將兩公約國內法化，跟上國際人權保障趨勢
  - label: D
    content: 我國為兩公約的締約國之一，若違背其內容將會受到國際制裁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是隸屬監察院的國家人權委員會。(B)我國並非聯合國成員國，因此聯合國人權理事會不會定期指派人權專家來臺進行審查。(D)我國並非聯合國成員國，因此不會受到國際制裁。
