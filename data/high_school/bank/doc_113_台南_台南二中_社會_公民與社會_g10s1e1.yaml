  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應規定於《憲法增修條文》對於公民權利之保障。(B)社會福利屬於社會權之範疇，為正確敘述。(C)國民就業保障為全國公民所享有，為普遍性權利，為正確敘述。(D)低收入戶需符合條件者才能接受救助，屬於差異性權利，為正確敘述。(E)社會福利基本法之內容皆為積極性權利，為正確敘述。
