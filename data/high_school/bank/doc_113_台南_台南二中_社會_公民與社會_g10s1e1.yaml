  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '我國公民身分者之條件為年滿 20 歲，擁有我國國籍者，(A)尚未滿 20 歲。(C)未取得我國國籍。(B)(D)(E)皆具備我國公民身分。有關受監護宣告者無選舉權之規定，112 年 6 月 9 日《公職人員選舉罷免法》、《總統副總統選舉罷免法》已修法刪除。

    29.1776 年 7 月 4 日，美國國會通過〈獨立宣言〉，當時只有成年白人男性能享有公民權，因此不包括(B)女人、(C)黑人及(E)印第安人。

    30.國際人權法典包括〈世界人權宣言〉（1948 年）、《公民與政治權利國際公約》及其附帶議定書（1966 年）、及《經濟社會與文化權利國際公約》（1966 年），對每一個人應享有的基本人權有很廣泛周詳的規定，對聯合國憲章的人權條款（第 1 條第 3 項，第 55 及 56 條）加以闡明具體化。答案為(B)(D)(E)。

    31.(B)新住民屬於我國的多元族群。(D)原有的教育法規適用對象為我國國民，無法考量新住民之差異及需求。(E)中國配偶也屬於新住民。

    32.文化奧運是以文化軟實力拓展臺灣在國際舞臺的能見度，與(A)(B)(D)的形式雷同。(C)卸任總統仍是以官方身分代表國家出訪。(E)臺灣代表處為官方在非邦交國成立的正式組織。'
