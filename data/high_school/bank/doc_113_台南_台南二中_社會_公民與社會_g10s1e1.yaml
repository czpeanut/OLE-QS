  stem: 2023 年我國正式通過施行《社會福利基本法》，透過專法將原本散落於各法律命令的保障整合，包括社會保險、社會救助、社會津貼、福利服務、醫療保健、國民就業及社會住宅之福利事項。請問下列關於此法的敘述哪些是正確的？
