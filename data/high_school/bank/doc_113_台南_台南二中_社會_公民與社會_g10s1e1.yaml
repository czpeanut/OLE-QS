  stem: 一般而言，公民身分的取得，是指一國民眾因符合法定資格而享有權利與應盡義務。請問，下列選項中長期（1 年以上）合法居留於我國境內的人，符合我國法定資格，具備公民身分的有哪些？
  options:
  - label: A
    content: 剛剛滿 18 歲可以參與全國性公民投票的瑞雯
  - label: B
    content: 已取得我國身分證的 36 歲烏克蘭裔女星瑞莎
  - label: C
    content: 已經在我國工作超過 10 年的印尼籍看護瑞星
  - label: D
    content: 臥病在床但擁有我國國籍與戶籍的 99 歲瑞人
  - label: E
    content: 未曾出國有我國國籍受輔助宣告的 60 歲瑞鳳
  answer:
