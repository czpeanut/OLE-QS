- id: doc_113_台南_台南二中_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 總統賴清德接受專訪時談到：「中國要併吞臺灣，如果真是為領土完整，為什麼不拿回俄羅斯占有的《璦琿條約》所簽的那些土地。」俄羅斯外交部則回應：「俄羅斯一貫堅持一個中國原則，臺灣當局領導人無權代表北京發表任何聲明。」請問根據兩者的對話，最可能是在談論哪一種國家要素的爭議？
  options:
  - label: A
    content: 人民
  - label: B
    content: 領土
  - label: C
    content: 政府
  - label: D
    content: 主權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 中國認為中華民國為其一部分，而題文總統賴清德之發言為中華民國為一獨立國家，此為主權之爭議，答案為(D)。
