  stem: 2025 年，日本將辦大阪世界博覽會，經濟部編 20 億預算參展，設館卻不能用臺灣、中華民國等名義參加，也沒辦法用奧運模式中華臺北名義參加，連用英文 Formosa 名義也沒辦法，只能用企業名義，掛名「玉山數位科技株式會社」參加。我國被限制僅能使用企業名義參與世界博覽會，而無法使用中華民國或臺灣之名，下列哪個選項可以說明這種現象？
