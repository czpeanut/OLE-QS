  stem: 右圖為以0.1 M NaOH(aq)滴定未知濃度HCl(aq) 25 mL所得的滴定曲線，回答下列問題： （log2＝0.3） (1)下圖哪個點是當量點？（2分） (2) A點的pH值為何？（須列出計算過程，2分） (3)當加入NaOH(aq) 15 mL時，[$H^{＋}$]為多少M？（須列出計算過程，2分） (4)當加入NaOH(aq) 55 mL時，[$H^{＋}$]為多少M？（須列出計算過程，2分）
  assets:
  - key: s3_1_f1
    kind: figure
    file: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2/s3_1_f1.png
    crop:
      page: 3
      rect:
      - 572.05
      - 172.85
      - 688.95
      - 280.25
  explanation: '(1)垂直線段的中點為當量點。

    (2)由酸鹼滴定計算公式$aC_{A}V_{A}$＝$bC_{B}V_{B}$可得，1×$C_{A}$×25＝1×0.1×50，得$C_{A}$＝0.2 M。pH＝1－log2＝0.7。

    (3) [$H^{＋}$]＝$\frac{a\times C_{A}\times V_{A}-b\times C_{B}\times V_{B}}{V_{A}+V_{B}}$＝$\frac{1\times 0.2\times 25-1\times 0.1\times 15}{25+15}$＝8.75×$10^{－2}$ M。

    (4) [$OH^{－}$]＝$\frac{b\times C_{A}\times V_{A}-b\times C_{B}\times V_{B}}{V_{A}+V_{B}}$＝$\frac{1\times 0.1\times 55-1\times 0.2\times 25}{55+25}$＝6.25×$10^{－3}$ M，[$H^{＋}$]＝1.6×$10^{－12}$ M。

    (5)以鹼滴定酸，當量點呈粉紅色。

    (6)胃藥為制酸劑，當中的$CO_{3}^{2－}$可與2倍的$H^{＋}$中和。 由$H^{＋}$總莫耳數＝$OH^{－}$總莫耳數可得1×0.100×0.08＝1×0.100×0.044＋（$CaCO_{3}$莫耳數）×2， $CaCO_{3}$＝3.6×$10^{－3}$ mol，相當於0.18 g。

    (7)碳酸鈣中的$CO_{3}^{2－}$可與2倍的$H^{＋}$中和並生成碳酸，碳酸再分解成水與二氧化碳。'
