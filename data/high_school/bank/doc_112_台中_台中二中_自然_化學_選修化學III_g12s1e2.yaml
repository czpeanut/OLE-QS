  section: 1
  number: 2
  type: single
  page: 1
  stem: 取pH＝5的$CH_{3}$COOH 水溶液10 mL，加水至1000 mL時，則水溶液的pH值變為多少？（$CH_{3}$COOH之$K_{a}$＝1.8×$10^{－5}$）
  options:
  - label: A
    content: '3'
  - label: B
    content: '4'
  - label: C
    content: '5'
  - label: D
    content: '6'
  - label: E
    content: '7'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '[$H^{＋}$]＝$\sqrt{C_{0}K_{a}}$，當濃度減為原本的$\frac{1}{100}$，[$H^{＋}$]則變為原本的$\frac{1}{10}$，則[$H^{＋}$]由$10^{－5}$ M變為$10^{－6}$ M，pH值由5上升至6。 故選(D)。'
