- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s2_25
  section: 2
  number: 25
  type: multiple
  page: 3
  stem: 今有同體積的a：0.05 M 鹽酸，b：0.05 M 硫酸，c：0.05 M醋酸，下列敘述哪些正確？
  options:
  - label: A
    content: pH 值大小：b＞a＞c
  - label: B
    content: 各以相同濃度氫氧化鈉完全中和所需氫氧化鈉之體積：a＝b＝c
  - label: C
    content: 各以相同濃度氫氧化鈉完全中和所生鹽之莫耳數：b＞a＝c
  - label: D
    content: 各以相同濃度氫氧化鈉完全中和後，溶液之pH值以c為最高
  - label: E
    content: b溶液中的[$H^{＋}$]＝0.1 M
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)硫酸為二元強酸、鹽酸為一元強酸、醋酸為弱酸，故pH應為c＞a＞b；(B)完全中和所需體積b＞a＝c；(C)陰離子數量＝1：1：1，故鹽類莫耳數都一樣多；(D)a、b為強鹼中和強酸，當量點為中性，但c為弱酸，當量點為鹼性；(E)硫酸的第二個氫離子為不完全解離，故不會剛好是0.05 M的兩倍。故選(D)。
