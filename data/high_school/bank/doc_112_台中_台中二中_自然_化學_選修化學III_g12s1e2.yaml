  - label: C
    content: 1.8×$10^{－5}$
  - label: D
    content: 3.6×$10^{－6}$
  - label: E
    content: 7.2×$10^{－6}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 欲使200毫升0.50 M氨水中的 [$OH^{－}$]＝1.0×$10^{－5}$ M，需加入多莫耳$NH_{4}$Cl？（氨水的$K_{b}$＝1.8×$10^{－5}$）
  options:
  - label: A
    content: '0.18'
  - label: B
    content: '0.20'
  - label: C
    content: '0.50'
  - label: D
    content: '1.00'
  - label: E
    content: '1.60'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依照定義$K_{b}$＝$\frac{[NH_{4}^{+}][OH^{-}]}{[NH_{3}]}$＝1.8×$10^{－5}$。當[$OH^{－}$]＝1.0×$10^{－5}$ M，則$\frac{[NH_{4}^{+}]}{[NH_{3}]}$＝1.8＝$\frac{9}{5}$。 故$NH_{4}$Cl、$NH_{3}$的莫耳數比＝9：5＝x：0.1，可得x＝0.18。故選(A)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 已知 $H_{3}PO_{4}$之$K_{a1}$＝7.1×$10^{－3}$、$K_{a2}$＝6.3×$10^{－8}$、$K_{a3}$＝4.4×$10^{－13}$，若將NaOH溶液逐滴加入$H_{3}PO_{4}$溶液中，當混合溶液之pH值為7.0時，下列何者的濃度最大？
  options:
  - label: A
    content: '[$H_{3}PO_{4}$]'
  - label: B
    content: '[$H_{2}PO_{4}^{－}$]'
  - label: C
    content: '[$HPO_{4}^{2－}$]'
  - label: D
    content: '[$PO_{4}^{3－}$]'
  - label: E
    content: '[$OH^{－}$]'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: pH＝7，代表[$H^{＋}$]＝$10^{－7}$ M。與$K_{a2}$最接近，故$H_{2}PO_{4}^{－}$、$HPO_{4}^{2－}$兩者的濃度最大。又由$K_{a2}$定義：$\frac{[HPO_{4}^{2-}][H^{+}]}{[H_{2}PO_{4}]}$， 代入[$H^{＋}$]＝$10^{－7}$ M可得$\frac{[HPO_{4}^{2-}]}{[H_{2}PO_{4}]}$＝0.63，則濃度最大者為$H_{2}PO_{4}^{－}$。故選(B)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 已知0.01 M $CH_{3}$COOH(aq)中，其解離百分比為4％，若於該溶液500 mL中加入0.02 mol $CH_{3}$COONa，求溶液之pH值為何？（log2＝0.3）
  options:
  - label: A
    content: '3.6'
  - label: B
    content: '4.2'
  - label: C
    content: '5.4'
  - label: D
    content: '6.0'
  - label: E
    content: '6.4'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: α＝$\sqrt{\frac{K_{a}}{C_{0}}}$，可得0.04＝$\sqrt{\frac{\mathrm{K}_{a}}{0.01}}$，得$K_{a}$＝1.6×$10^{－5}$。若取該溶液500 mL，可得0.005 mol的$CH_{3}$COOH， 加入0.02 mol的$CH_{3}$COONa，則$\frac{[CH_{3}COO^{-}]}{[CH_{3}COOH]}$＝4，由$K_{a}$定義可得$K_{a}$＝$\frac{[CH_{3}COO^{-}][H^{+}]}{[CH_{3}COOH]}$＝1.6×$10^{－5}$， [$H^{＋}$]＝4×$10^{－6}$ M，pH＝6－log4＝5.4。故選(C)。
