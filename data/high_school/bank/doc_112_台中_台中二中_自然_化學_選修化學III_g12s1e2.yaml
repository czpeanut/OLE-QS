- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知 25 °C 時，下列酸的濃度均為 0.1 M，解離常數如下，試回答下列問題。 $H_{3}PO_{2}$(aq)：$K_{a}$＝3.0×$10^{－2}$ $H_{2}SO_{4}$(aq)：$K_{a1}$＝極大；$K_{a2}$＝1.3×$10^{－2}$ $H_{2}$S(aq)：$K_{a1}$＝1.0×$10^{－7}$；$K_{a2}$＝1.2×$10^{－13}$ $H_{3}PO_{4}$(aq)：$K_{a1}$＝7.0×$10^{－3}$；$K_{a2}$＝6.0×$10^{－8}$；$K_{a3}$＝4.0×$10^{－13}$ 上述所有酸（$H_{3}PO_{2}$、$H_{2}SO_{4}$、$H_{2}$S、$H_{3}PO_{4}$）的共軛鹼之鹼性強弱何者正確？（由強排到弱）
  options:
  - label: A
    content: $HS^{－}$＞$H_{2}PO_{4}^{－}$＞$H_{2}PO_{2}^{－}$＞$HSO_{4}^{－}$
  - label: B
    content: $HSO_{4}^{－}$＞$H_{2}PO_{2}^{－}$＞$H_{2}PO_{4}^{－}$＞$HS^{－}$
  - label: C
    content: $H_{2}PO_{4}^{－}$＞$HS^{－}$＞$HSO_{4}^{－}$＞$H_{2}PO_{2}^{－}$
  - label: D
    content: $H_{2}PO_{2}^{－}$＞$HS^{－}$＞$H_{2}PO_{4}^{－}$ ＞$HSO_{4}^{－}$
  - label: E
    content: $H_{2}PO_{4}^{－}$＞$HSO_{4}^{－}$＞$H_{2}PO_{2}^{－}$＞$HS^{－}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由數據可知，$H_{2}SO_{4}$的$K_{a2}$＞$H_{3}PO_{2}$的$K_{a}$＞$H_{3}PO_{4}$的$K_{a1}$＞$H_{2}$S的$K_{a1}$，故其共軛鹼的鹼性相反： $HS^{－}$＞$H_{2}PO_{4}^{－}$＞$H_{2}PO_{2}^{－}$＞$HSO_{4}^{－}$。故選(A)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在水中下列何者不起水解反應？(甲) $Al^{3＋}$；(乙) $ClO_{4}^{－}$；(丙) $Ba^{2＋}$；(丁) $F^{－}$；(戊) $K^{＋}$；(己) $SO_{4}^{2－}$。
  options:
  - label: A
    content: 甲己
  - label: B
    content: 丙戊已
  - label: C
    content: 乙丙戊
  - label: D
    content: 甲乙丙戊
  - label: E
    content: 乙丙戊已
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 強鹼的陽離子（$Na^{＋}$、$K^{＋}$、$Rb^{＋}$、$Cs^{＋}$、$Ca^{2＋}$、$Sr^{2＋}$、$Ba^{2＋}$）、強酸的陰離子（$Cl^{－}$、$Br^{－}$、$I^{－}$、$ClO_{4}^{－}$、$NO_{3}^{－}$、$SO_{4}^{2－}$）不發生水解反應。故選(E)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: (甲) $NaH_{2}PO_{4}$；(乙) $Na_{2}HPO_{4}$；(丙) $Na_{3}PO_{4}$；(丁) $NaH_{2}PO_{3}$；(戊) $Na_{2}HPO_{3}$；(己) $NaH_{2}PO_{2}$，哪些鹽類溶於水呈鹼性？
  options:
  - label: A
    content: 甲己
  - label: B
    content: 乙丙戊
  - label: C
    content: 丙戊已
  - label: D
    content: 乙丙戊已
  - label: E
    content: 甲乙丁戊已
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)(丁)酸性酸式鹽、(乙)鹼性酸式鹽、(丙)(戊)(己)正鹽，$Na^{＋}$不水解，$H_{2}PO_{2}^{－}$、$HPO_{3}^{2－}$、$PO_{4}^{3－}$水解呈鹼性。故選(D)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 四種溶液分別為0.1 M之(甲) $CH_{3}$COONa；(乙) $NH_{4}$Cl；(丙) $CH_{3}COONH_{4}$；(丁) $NH_{4}HSO_{4}$，則溶液之pH值大小排列順序，何者正確？（$NH_{4}^{＋}$(aq) 的$K_{a}$＝5.7×$10^{－10}$，$CH_{3}COO^{－}$(aq)的$K_{b}$＝5.7×$10^{－10}$，$HSO_{4}^{－}$(aq)的$K_{a}$＝1.3×$10^{－2}$）
  options:
  - label: A
    content: 丙＞甲＞乙＞丁
  - label: B
    content: 丙＞甲＞丁＞乙
  - label: C
    content: 甲＞丙＞丁＞乙
  - label: D
    content: 甲＞丙＞乙＞丁
  - label: E
    content: 乙＞甲＞丙＞丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲) $Na^{＋}$不水解，$CH_{3}COO^{－}$水解呈鹼性；(乙) $Cl^{－}$不水解，$NH_{4}^{＋}$水解呈酸性；(丙) $CH_{3}COO^{－}$水解呈鹼性、$NH_{4}^{＋}$水解呈酸性，又兩者K相等故呈中性；(丁) $NH_{4}^{＋}$水解、$HSO_{4}^{－}$解離皆呈酸性，故最酸。故選(D)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 為了使$Na_{2}CO_{3}$溶液中$\frac{[Na^{+}]}{[CO_{3}^{2-}]}$的比值接近2，可加入下列何種物質？
  options:
  - label: A
    content: 水
  - label: B
    content: 適量$Na_{2}CO_{3}$粉末
  - label: C
    content: 適量KOH固體
  - label: D
    content: 適量NaOH固體
  - label: E
    content: 適量Ca(OH)$_{2}$固體
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 因$CO_{3}^{2－}$會水解：$CO_{3}^{2－}$(aq)＋$H_{2}$O(l) ⇌ $HCO_{3}^{－}$(aq)＋$OH^{－}$(aq)，若能使平衡向左移動，則[$CO_{3}^{2－}$]會幾乎等於[$Na^{＋}$]的一半。故加入鹼可有此效果，但不能加(D) NaOH，因含有$Na^{＋}$，也不能加(E) Ca(OH)$_{2}$，因為$Ca^{2＋}$會與$CO_{3}^{2－}$沉澱。故選(C)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在0.1 M $CH_{3}$COOH和0.1 M $CH_{3}$COONa 共存的10 mL水溶液中，加入下列何項物質，將使溶液失去緩衝作用？ （NaOH＝40）
  options:
  - label: A
    content: 0.0.1 M Ca(OH)$_{2}$(aq) 30 mL
  - label: B
    content: STP下，加入11.2 mL HCl(g)
  - label: C
    content: 0.50 g NaOH(s)
  - label: D
    content: 0.50 M $H_{2}SO_{4}$(aq) 5 mL
  - label: E
    content: 1 mL水
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此緩衝系統中，$CH_{3}$COOH、$CH_{3}COO^{－}$皆為$10^{－3}$ mol，故加入的酸/鹼之$H^{＋}$／$OH^{－}$莫耳數大於$10^{－3}$ mol時就會使緩衝溶液失效。(A) $OH^{－}$＝0.01×0.03×2＝6×$10^{－4}$ mol；$(B)_{11}$.2 mL HCl＝$\frac{11.2}{22.4}$×$10^{－3}$＝5×$10^{－4}$ mol； (C) 0.05 g NaOH＝$\frac{0.05}{40}$＝1.25×$10^{－3}$ mol；(D) $H^{＋}$＝0.05×0.005×2＝5×$10^{－4}$ mol； (E)加少量水不改變緩衝溶液pH值。故選(C)。
- id: doc_112_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_10
  section: 1
