  type: multiple
  page: 2
  stem: 雙質子弱酸$H_{2}$A，以NaOH(aq)標準液滴定，達當量點時，下列敘述哪些正確？
  options:
  - label: A
    content: 假設在滴定管中原有液面刻度紀錄正確，但到達終點時不慎用俯視紀錄滴定管液面，結果將造成測得的$H_{2}$A之分子量會較小
  - label: B
    content: 置入錐形瓶的待測液，應以滴定管或分度吸量管量取
  - label: C
    content: 滴定前，滴定管以蒸餾水清洗後，必須再以NaOH(aq)潤洗
  - label: D
    content: 配好的NaOH(aq) 隔天才滴定，則測得的$H_{2}$A之分子量會較小
  - label: E
    content: 以KHP標定NaOH(aq)，其KHP為鄰-苯二甲酸氫鉀，屬於單質子強酸
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)原液面刻度紀錄正確，達終點時俯視會導致讀取刻度較實際刻度高，誤以為液面下降幅度較實際小，用了較少的NaOH，故會低估酸的莫耳數，等重量下，算出來的分子量會偏大；(B)正確，以精確測量體積；(C)正確，否則NaOH濃度會受影響；(D)會導致NaOH用量偏多，會高估酸的莫耳數，等重量下，算出來的分子量會偏小；(E)示性式為$C_{6}H_{4}$(COOH)(COOK)，其中COOH可解離為一元酸，但為弱酸。故選(B)(C)(D)。
