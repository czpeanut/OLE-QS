  group_stem: '資料一：焉有辮髮左衽，服馬蹄袖、戴絨帽、為犬羊之服，以據皇極（帝位）之尊哉？不寧惟是（不但如此），且壞堯舜以來上衣下裳之制，使天下泯然皆為臊羯（胡人），莫克自異，天下之變極矣！若是者（如），可謂正統之歸乎？（修改自成海應（朝鮮），〈正統論〉，1800 年）

    資料二：此時韃虜橫行中原，是華變於夷之態也。「外朝」再次被夷狄征服，已失去文明；且「外朝」自春秋時代以來多次因篡位弒君而改朝換代，不守君臣之義，已失去了「禮」，故不配稱「中國」。而日本則不曾受夷狄侵略，且有二百萬年以來萬世一系的皇統，守禮守義，可稱「中華」。（修改自山鹿素行（日本），《中朝事實》，1669 年）

    資料三：天地之間，星野分別；南北分治，北人非我族類，其心則異。自漢以來，北國之人寇我甸畿，魚肉我生民，囊括我財貨。人不堪命，咸思逐之。……今清人復來，謀取我南國，置為郡縣，不以宋、元、明為戒。故我出而驅之。汝等各有知能，當與我戮力同心，使大勳用集。毋徒狃習故態，妄懷二心，事發即行誅戮，一無所赦，毋謂我不先告也。（阮惠（越南），〈伐清軍檄〉，1788 年）'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
