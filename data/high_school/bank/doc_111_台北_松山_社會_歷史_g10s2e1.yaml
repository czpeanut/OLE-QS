    (3) 滕子京被檢舉濫用公款，被貶官巴陵郡，應為是被哪一秦漢以來哪一官職的人員所彈劾？（填官職）滕子京後來重修岳陽樓，改成向民間債主們宣告，只要付一筆錢，由政府向欠錢不還者追債，債主們紛紛委託，於是賺到了一萬緡，用於重修岳陽樓。這顯示地方哪一權力已被中央所掌控？'
