- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 一位君主發表他對宰相制度的看法：「我同意前朝儒家學者們的看法：『天下政務運作好壞與宰相密切相關……。』如果一個君主將天下的好壞全部交給宰相，這樣實在危險。如果當宰相的人，卻還有『先天下之憂而憂，以天下為己任』這樣的想法，根本是目無尊長，忽視君主的表現。」因此，稍後這位君主將採取以下哪一項措施？
  options:
  - label: A
    content: 要求軍機處官員儘速將密摺整理完畢給他過目
  - label: B
    content: 強幹弱枝收回地方財政權力，且不再由宰相統籌分配運用
  - label: C
    content: 頒行「九品中正制」，將地方薦舉人才交由他偏好的中正官考核
  - label: D
    content: 推行「三省制」，大幅削減宰相的權利，變成多相制
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從這位君主的看法，可知其反對將天下政務運作交給宰相，同時重視君主的表現，因此最可能為明清時期的君主，廢除宰相制度，權歸皇帝，(A)為正解。(B)宋代。(C)魏晉南北朝。(D)唐代。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 右圖是中國世家大族的盛衰示意圖。其中可見中國南北朝時期是一個高峰，但旋即就開始沒落。請問造成此圖中轉折的原因，以下敘述何者正確？
  options:
  - label: A
    content: 西漢開始出現是因為實施科舉制度
  - label: B
    content: 東漢到曹魏人數快速增加是因為當時政治穩定
  - label: C
    content: 南北朝士族勢盛促成寒門崛起
  - label: D
    content: 唐代士族的衰退與關隴集團興起有關
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_111_台北_松山_社會_歷史_g10s2e1/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 365.7
      - 285.55
      - 564.0
      - 389.95
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)漢代實施選舉制，科舉制至隋代才開始實施。(B)東漢到曹魏時期的政局混亂，因此豪族勢盛。九品官人法實施後，形成世族門閥政治。(C)為正解。(D)唐代士族的衰退與黃巢之亂有關。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 秦代著作《呂氏春秋》曾記載一則故事：「春秋時代楚國與吳國接境，楚國有個城叫卑梁。城外附近有棵大桑樹，吳楚兩國的少女都會去那採桑。有天兩國少女因故吵架，楚國少女打傷吳國女，因而引起爭端，雙方家屬互相私下討公道結果變成械鬥，械鬥又變成兩國為宣示對桑樹周圍邊境區域主權而開始交戰，兩國都幾乎一度亡國。之後雙方變成世仇，但已經沒人記得桑樹下的故事了。」秦國建國後考量該地位置地緣，在此地設立九江郡。請問此則故事最適合作為以下哪一論述的證據？
  options:
  - label: A
    content: 地方官員的私下處置必定會危害國家，中央集權是必須的
  - label: B
    content: 春秋時代已有郡縣制但地方權力過大，秦代開始削弱地方兵權
  - label: C
    content: 封建制度下的行政區劃不足，開始因實際狀況調整
  - label: D
    content: 種桑養蠶已是重要經濟活動，政府利用設郡縣、行均田，鼓勵民眾投資
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)楚國與吳國少女的吵架故事中，並無提到地方官員的私下處置。(B)楚國與吳國並非地方郡縣，而是封建制度下的封國。(C)為正解。(D)題文中看不出種桑養蠶為秦代的重要經濟活動，同時秦代尚未推行均田制。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 宋代文人滕子京因「公使錢」一事被連續貶官三次，最後謫守巴陵郡。當時皇帝宋仁宗原本並未要如此嚴懲滕子京，但是被中央行政官員聯名抗議，認為滕子京藐視朝廷務必嚴懲，否則將集體請辭抗議，讓宋仁宗屈服。但到了 400 年後的明朝，明世宗時則發生「大禮議」。當時明世宗因親生父親非前任皇帝孝宗、武宗家族，所以想將自己的爸爸以皇帝禮儀祭祀，也引起群臣抗議。但最終世宗靠著當時的「統治架構」獨排眾議，最後得以以皇帝禮儀祭祀生父。請問以下針對此「統治架構」的敘述何者正確？
  options:
  - label: A
    content: 此架構為三省制，皇帝利用宰相權力分散，讓大臣分派系互相爭執，最後只能參考皇帝意見
  - label: B
    content: 明朝開始實施內閣制度，內閣官員可以票擬政策，讓皇帝能充分與官員溝通
  - label: C
    content: 明代科舉制度已經成熟。官員都需要學習「八股文」的思想才能任官，所以價值觀比宋代統一
  - label: D
    content: 明太祖因為廢宰相，將監察權改由錦衣衛掌握，監視控制臣民造成大臣恐慌
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)明初廢除宰相制改推行內閣制度，權力高度集中在皇帝一身，並設有廠衛制度監控臣民，因此明世宗得以獨排眾議，「為所欲為」。(A)三省制為唐代。(B)內閣官員僅有票擬權，決定權在皇帝之手。(C)明代科舉制度已經僵化，國家以八股取士來箝制士人思想，但官員來源並非全來自科舉，花錢捐官者亦不少，此制度也與題文明世宗獨排眾議的現象較無相關。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 2011 年南韓海軍為防備中國與北韓擴張，購買新型潛水艇，依照海軍歷史人物命名為「張保皐」。不過命名計畫公布後被網友批評張保皐曾在中國任官，且開發了前往中國的新航線，又利用在中國的職權設廟宇，與中國政府關係過於密切，應該換名；不過南韓軍方回應因為張保皐協助剿滅中國海盜，維持國家穩定吸收新知的路線，應予以肯定，所以維持原本命名案。請問依照南韓軍方的回應，張保皐應該所處的年代應該是
  options:
  - label: A
    content: 被中國秦漢統治的古朝鮮時代
  - label: B
    content: 統一維新的新羅王朝時代
  - label: C
    content: 力抗蒙古的高麗王朝時代
  - label: D
    content: 倭寇肆虐的朝鮮王朝前期
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 張保皐曾在中國任官，並開發了往中國的新航線，但同時又曾剿滅中國海盜，使中國新知能持續傳入朝鮮，因此可推知張保皐身處時代應為中國、朝鮮關係甚為密切，朝鮮亦積極吸收中國文化的時期，答案為(B)。(A)秦漢時期的中朝交流不深。(C)蒙古多次進逼高麗，此時中朝關係緊張。(D)倭寇為日本海盜，非中國海盜。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 學者討論中國某朝代特色，認為該朝代「不是貴族政府，但仍重視家族，一度實施封建，也不是軍人政府但對游牧民族強硬開戰，也不是商人政府但積極發展專賣事業，企圖將財政權收回中央，且相當崇尚道德、文治。」「分中央權力於三公九卿，但皇帝積極培養自己的親信內朝官員以資對抗。」學者應該在討論以下哪一朝代？
  options:
  - label: A
    content: 周代
  - label: B
    content: 漢代
  - label: C
    content: 唐代
  - label: D
    content: 宋代
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文中的「一度實施封建」、「三公九卿」、「皇帝積極培養自己的親信內朝官員」等線索，即可推知此朝代為(B)漢代。漢朝初建時採行郡國並行制，即郡縣制與封建制並用，積極培養內朝官員的皇帝為漢武帝。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 一位游牧民族皇帝表示：「我們起源於北方，有自己的生活方式，但我們的生活方式真的不適合文治戶籍的社會。所以我先前才會移動首都位置。現在我們的風俗已經有所調整，與漢人相處也較為融洽，是時候有更進一步有更密切的管理措施，以提高對民眾的控制程度，並藉此合理稅賦，提升他們對國家的向心力。」請問稍後這個皇帝施行的政策為
  options:
  - label: A
    content: 均田制度
  - label: B
    content: 三省六部
  - label: C
    content: 科舉取士
  - label: D
    content: 攤丁入地
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 這位與漢人相處融洽並調整風俗而移動首都位置的游牧民族皇帝，最可能為北魏孝文帝，在遷都後，為提高對民眾的控制程度並合理稅賦，他所施行的政策應為(A)均田制度。(B)(C)隋唐以後的政策，與合理稅賦無關。(D)清代的稅賦政策。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某朝代統一中國之後，君主召開一次會議討論稍後的行政制度。會議中有大臣發言：「各國諸侯被我們打敗已徹底臣服於我國。但是燕國、齊國、楚國等地，地處偏遠，不在那些地方設立諸侯王，我們實無法鎮撫這些地區，請封各位皇子為諸侯王。」也有人提到：「當初周文王、周武王分封很多同姓子弟為諸侯王，但後來這些諸侯王彼此之間的關係漸漸疏離，最後互相攻擊視同仇人，周天子對此也無法制止。」「可是前朝完全依賴天子直接控制的郡縣制，結果忽略了中央的權力制衡，最後導致亂政；而各地行政長官又死守法律不願出兵相救，所以還是需要諸侯。」後來該朝代的施政主要還是採取郡縣制，但配合另外一種制度，確保地方官員的高道德水準，以避免「死守法律而忽略中央」這種現象。從討論內容我們可以判斷這應該是哪一政策形成的脈絡？
  options:
  - label: A
    content: 察舉制度
  - label: B
    content: 九品中正
  - label: C
    content: 科舉考試
  - label: D
    content: 八股取士
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 此朝代建國之初，有鑑於前朝實施郡縣制卻速亡，故而朝中有了封建制或郡縣制的廷議，可推知此朝代應為漢朝。為確保地方官員的高道德水準，在任官選才時即特別著重儒家禮教思想，漢代的(A)察舉制度即以孝廉、賢良等儒家道德作為選才標準。(B)魏晉南北朝。(C)隋唐以後。(D)明清。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_9
  section: 1
