  group_stem: '資料一：中行說（一位匈奴官員）說到：「匈奴人生活簡單，在急迫的時候，人人練習騎馬射箭的本領；在寬鬆的時候，人們歡樂無事，受到的約束很少。君臣關係簡單，國家的政事就像一個人的身體一樣隨意自如。至於若父子和兄弟戰死了，活著的娶他們的妻子做自己的妻子，這是懼怕種族的消失。匈奴雖然倫常混亂，但繼承人一定是本族的子孫。」（修改自《漢書》，匈奴列傳）

    資料二：從主將到士兵，都能自我駕馭管理，人人都可享用粟粥及祭祀熟肉，沒有分別。遇到國家大事能席地而坐、討論到白晝，討論完則安靜離開，沒有聲響，行動機密。軍將要領兵之前舉行大會宴飲，人人獻上計謀決策，主帥能聽從並且選擇……軍事活動結束後舉辦大會，舉報有功勞的人，依據功勞高下，給予賞賜，並公開讓眾人知道。（修改自陳準，《北風揚沙錄》）

    資料三：匈奴人十分喜歡漢朝進貢的繒絮和食物，中行說向老上單于指出：匈奴的人口數量不及漢朝的一個郡，之所以強大的原因在於匈奴人的衣食習俗與漢人不同。如今單于喜歡漢朝進貢的衣物食品，他們所進貢的物品不超過國內總數的十分之二，那麼匈奴早晚會完全臣屬於漢朝。希望單于把漢朝贈送的繒絮做成衣褲，讓匈奴人穿上然後在雜草棘叢中騎馬奔馳，讓衣褲破裂損壞，以此顯示漢朝的繒絮不如匈奴的旃衣皮襖堅固完美；把漢朝贈送的食物都丟掉，以此顯示它們不如匈奴的乳製品方便味美……。中行說隨後教授老上單于統計人口、核算牲畜數目的方式。（修改自《漢書》，匈奴列傳）'
