  stem: 東亞文化圈中的地理領域有時曾為中國領土。漢朝惠帝、呂后時代，某地成為漢朝的外藩。漢武帝時曾派水軍部隊包圍該地首都，並於次年消滅當地政權，並在此設立四郡。到東漢昭帝時，因為語言文化仍然有差異，激起當地居民的反抗，漢朝政府改採退守的態度，陸續裁移原先設立的四郡。該地南部亦先後出現數個部落國家，甚至演變成該地進入三國時代的背景。請問此地應該為今日何地？（請填地理地名）
