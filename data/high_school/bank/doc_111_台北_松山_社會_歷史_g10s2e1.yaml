  group_stem: '資料一： 地理環境的變化，有時會因人為因素的作用而變得十分明顯。例如人們開發黃土高原成為農田，造成森林植被破壞，水土嚴重流失。上游大量的泥沙淤高了河床，下游決口改道造成秦漢時期黃河多次泛濫，洪水和泥沙吞沒了大片農田和眾多村落，渤海灣海岸也向外推展。

    西漢一代在鄂爾多斯高原所設的縣多達二十多個。當時的縣址今日已經在今日沙漠之中。過度的開墾導致自然災害逐漸增加。由於大批士兵、農民移入鄂爾多斯地區進行開墾，破壞了原始植被，可以防風防沙的森林被破壞，草原的載畜量過高，也破壞了草原。再加上風蝕的力量下，促成當地沙化自然災害增加。這個時期全內蒙古旱災增加到 27 次，其中鄂爾多斯地區就有 5 次。（王子今，《秦漢史》）

    資料二：西漢初年時，匈奴國力較強，多次南下漢境掠奪物資，漢則採和親、貿易政策以維持和平；但到了漢武帝時期（約 133 年起），漢採取向外擴張策略，四方族群逐漸被納入漢版圖中，造成匈奴開始分裂，部分匈奴族人開始南遷至今日河套及河西走廊；這種狀況一直延續到東漢，此時匈奴正式分裂，有不少族群移徙漢地。（三民版，《高中歷史二》）'
  answer:
