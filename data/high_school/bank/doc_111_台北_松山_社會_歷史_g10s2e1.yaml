  stem: '右表為中國明代稅賦收入的狀況，請問依照表格內容以及明代施政內容，以下說明分析何者正確？

    | 年代 | 金額（萬銀兩） | 人口數（十萬人） |

    | --- | --- | --- |

    | 1536 | 98 | 503 |

    | 1543 | 201 | 526 |

    | 1557 | 203 | 542 |

    | 1565 | 218 | 560 |

    | 1570 | 263 | 583 |

    | 1584 | 410 | 606 |'
  options:
  - label: A
    content: 1530 年代收入極低，顯示當時皇帝好大喜功花費過多
  - label: B
    content: 明代人口數量成長與政府收入無正相關
  - label: C
    content: 明朝後期稅賦改革立即出現明顯成效
  - label: D
    content: 長年災荒與戰爭限制 16 世紀明朝整體的發展
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 表格時間為明代中期以後，(A) 1530 年代為明世宗時期，當時並沒有過於好大喜功的花費。(B)人口數與政府收入皆為正成長，不能說兩者無正相關。(C) 1584 年為明神宗時期，稅賦收入明顯較前大增，可見張居正的改革成效明顯，是為正解。(D)從稅賦收入與人口數皆持續成長來看，此說法並不正確。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 日本的遣唐使，始自 630 年犬上御田鍬。奈良時代，朝廷亦每隔十五至二十年，派遣一次大規模的遣唐使。此後一直延續到 894 年，前後共任命過十九次遣唐使……。遣唐使的組織包括大使、副使、以及留學生、學問僧、各種工匠……到 8 世紀中葉，唐朝發生大動亂，中央集權統治日衰，至 9 世紀，內亂益盛，國力更衰，日漸失去其對近鄰國家的吸引力。奉命為遣唐使的菅原道真以「大唐凋弊」為由，奏請天皇停止遣唐使的派遣。不過據學者考證，天皇原本仍然要派遣唐使，但因為日本本身發生某一狀況，消耗天皇心力因此才終止派遣。請問此「某一狀況」是
  options:
  - label: A
    content: 唐朝佛教傳入破壞日本神道信仰
  - label: B
    content: 與朝鮮半島的新羅關係惡化爆發壬辰之役
  - label: C
    content: 地方寺廟勢力強大並組佛教僧兵干涉政治
  - label: D
    content: 幕府將軍源賴朝排斥天皇家族爭奪政權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)未有此事。(B)壬辰之役發於 16 世紀末。(C)為正解。(D) 12 世紀末。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 契丹與女真兩個游牧民族建國後，都有採取過「二元統治」的政策，兩族實行此一政策的主要基礎概念為
  options:
  - label: A
    content: 種族歧視
  - label: B
    content: 因地制宜
  - label: C
    content: 軍事統治
  - label: D
    content: 以漢制漢
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 實施「二元統治」乃游牧民族政權為避免過度漢化的措施，其作法係以本族之法統治本族，以漢法統治漢族，故其基礎概念為(B)因地制宜。
- id: doc_111_台北_松山_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 自從科舉制度出現以後，逐漸成為東亞文化圈共同的任官方式。其中某國的科舉為確保參加者已受過相關職前訓練，所以在考試內容規定：「為打破階級貴族制度，限兩班文武官員子弟參加，出題內容必須融合朱子學入世思想，不含佛道怪力亂神。」請問此應為何朝代的科舉內容？
  options:
  - label: A
    content: 唐代科舉
  - label: B
    content: 宋代科舉
  - label: C
