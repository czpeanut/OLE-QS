  stem: 有20筆數據 ( $x_{i}$ , $y_{i}$ )，i＝1 , 2 ,…, 20，其變量x與y的平均數分別為μ$_{x}$＝6，μ$_{y}$＝5，相關係數為－0.8，且y對x的迴歸直線通過點 ( 2 , 7 )。若變量p與q滿足p＝x－3，q＝－2y＋1，則下列那些選項是正確的？
