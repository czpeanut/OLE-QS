- id: doc_112_台中_興大附中_數學_數B_g11s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 4
  stem: 袋中有 2 顆白球、1 顆黑球，今自袋中隨機取球，設每顆球被取到的機率都相等，則下列敘述何者正確？
  options:
  - label: A
    content: 一次取兩球，恰為一白球一黑球的機率為$\frac{2}{3}$
  - label: B
    content: 一次取一球，取後放回，共取兩次，恰為一白球一黑球的機率為$\frac{2}{9}$
  - label: C
    content: 一次取一球，取後不放回，共取兩次，恰為一白球一黑球的機率為$\frac{1}{3}$
  - label: D
    content: 一次取一球，取後放回，則第二次取到的是白球的機率為$\frac{2}{3}$
  - label: E
    content: 一次取一球，取後不放回，則第二次取到的是黑球的機率為$\frac{1}{3}$
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\frac{C_{1}^{2}\times C_{1}^{1}}{C_{2}^{3}}$＝$\frac{2}{3}$

    (B)╳：P（1 白 1 黑）＝P（先白再黑）＋P（先黑再白）＝$\frac{2}{3}\times \frac{1}{3}+\frac{1}{3}\times \frac{2}{3}$＝$\frac{4}{9}$

    (C)╳：P（1 白 1 黑）＝P（先白再黑）＋P（先黑再白）＝$\frac{2}{3}\times \frac{1}{2}+\frac{1}{3}\times \frac{2}{2}$＝$\frac{2}{3}$

    (D)○：P（第二次取到白球）＝P（第一次取到白球）＝$\frac{2}{3}$

    (E)○：P（第二次取到黑球）＝P（第一次取到黑球）＝$\frac{1}{3}$

    故選(A)(D)(E)'
