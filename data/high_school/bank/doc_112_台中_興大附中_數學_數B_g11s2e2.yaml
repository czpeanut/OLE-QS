- id: doc_112_台中_興大附中_數學_數B_g11s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 4
  stem: 設 $A, B$ 為兩事件，且 $P(A)=\frac{1}{3}$，$P(B)=\frac{2}{5}$，$P(A\cup B)=\frac{1}{2}$，則下列何者正確？
  options:
  - label: A
    content: $P(A\cap B) = \frac{7}{30}$
  - label: B
    content: $P(B\mid A) = \frac{1}{3}$
  - label: C
    content: $P(A\mid B) = \frac{7}{12}$
  - label: D
    content: $P(B\mid A') = \frac{1}{3}$
  - label: E
    content: $P(B'\mid A') = \frac{3}{4}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$P(A\cap B) = \frac{1}{3}+\frac{2}{5}-\frac{1}{2} = \frac{7}{30}$。

    (B) ×：$P(B\mid A) = \frac{7/30}{1/3} = \frac{7}{10}$。

    (C) ○：$P(A\mid B) = \frac{7/30}{2/5} = \frac{7}{12}$。

    (D) ×：$P(B\mid A'') = \frac{2/5 - 7/30}{2/3} = \frac{1/6}{2/3} = \frac{1}{4}$。

    (E) ○：$P(B''\mid A'') = 1 - \frac{1}{4} = \frac{3}{4}$。選 (A)(C)(E)。'
