    P（只從 C 流通）＝$\left( 1 -\frac{1}{2}\times \frac{2}{3} \right) \times \frac{3}{4}$＝$\frac{1}{2}$

    P（A、B 與 C 都流通）＝$\frac{1}{2}\times \frac{2}{3}\times \frac{3}{4}$＝$\frac{1}{4}$

    故所求為$\frac{\frac{1}{12}}{\frac{1}{12}+\frac{1}{2}+\frac{1}{4}}$＝$\frac{\frac{1}{12}}{\frac{1 + 6 + 3}{12}}$＝$\frac{1}{10}$'
