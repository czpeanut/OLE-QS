  answer_status: verified
  answer_source: answer_key
  explanation: 'P（紅球先取完）＝P（紅球比白球先取完）＋P（紅球比黑球先取完）

    －P（紅球比白球或黑球先取完）

    又 P（紅球比白球先取完）＝$\frac{C_{1}^{4}\times 6!}{7!}$＝$\frac{4}{7}$（不考慮黑球，只看紅、白球中，且球均視為不同，最後一個為白球之機率）

    P（紅球比黑球先取完）＝$\frac{C_{1}^{5}\times 7!}{8!}$＝$\frac{5}{8}$（做法和紅球比白球先取完相似）

