  answer_source: answer_key
  explanation: (A)熔點：甲＝60℃、乙＝40℃、丙＝20℃；(B)甲完全熔化需要300秒、乙完全熔化需要400秒、丙完全熔化需要500秒，所以所需的熱量為3：4：5；(C)由ΔH＝msΔT，等重的固體的比熱的比值＝$\frac{\Delta H}{\Delta T}$，假設加熱功率為W，則甲加熱（0～200）過程中$\frac{\Delta H}{\Delta T}$＝$\frac{200W}{60}$，乙＝$\frac{300W}{40}$、丙＝$\frac{400W}{30}$，故三者比熱的比值＝4：9：16；(E)莫耳熔化熱與熔點不一定有關。故選(D)。
