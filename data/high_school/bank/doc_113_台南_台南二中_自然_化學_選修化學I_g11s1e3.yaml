  stem: 1大氣壓下，取均為5克的甲、乙、丙三種固態純物質，以相同的穩定熱源分別加熱，其溫度與加熱時間關係圖如附圖所示，試回答下列選項何者正確：
  options:
  - label: A
    content: 熔點：丙＞乙＞甲
  - label: B
    content: 求甲、乙、丙三種固體各熔化1克時所需的熱量比為6：4：3
  - label: C
    content: 甲、乙、丙三種固體的比熱比為3：4：5
  - label: D
    content: 丙固體加熱至600秒時，固體與液體質量的比為3：2
  - label: E
    content: 莫耳熔化熱為甲＞乙＞丙
  assets:
