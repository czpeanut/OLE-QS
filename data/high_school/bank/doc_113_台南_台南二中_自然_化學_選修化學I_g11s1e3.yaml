  options:
  - label: A
    content: 9.60×$10^{－3}$
  - label: B
    content: 4.80×$10^{－3}$
  - label: C
    content: 9.60×$10^{－4}$
  - label: D
    content: 1.92×$10^{－3}$
  - label: E
    content: 2.40×$10^{－3}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 每100 mL水可溶解4.80×$10^{－3}$ g的氧氣，則1000 mL的水在1 atm的氧氣下就可溶解4.80×$10^{－2}$ g的氧氣。然而本題中外界為1 atm的空氣，當中氧氣分壓只有大概0.2 atm，故由亨利定律，水中溶解的氧氣為原本的0.2倍，約9.60×$10^{－3}$ g。故選(A)。
