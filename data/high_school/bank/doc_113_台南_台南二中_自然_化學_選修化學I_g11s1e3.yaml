  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)三杯中溶質重量分別為：甲＝180 g葡萄糖、乙＝40 g尿素、丙＝無。轉換成莫耳數：甲＝1 mol葡萄糖、乙＝$\frac{2}{3}$ mol尿素、丙＝無。達平衡時各杯溶液的蒸氣壓相等，即莫耳分率濃度相等，即重量莫耳濃度相等，即各杯水量與各杯溶質莫耳數成正比，因此總水量將會以3：2：0的比例分配至三個杯子中。甲杯中原始水量為420 g、乙杯中原始水量為360 g、丙杯中原始水量為500 g，總水量＝1280 g。以3：2：0的比例分配後可得到甲杯中共有768 g的水、乙杯中共有512 g的水、丙杯中沒有水。 (D)乙杯的重量莫耳濃度＝$\frac{\frac{2}{3}}{0.512}$＝1.30 m；(E)應是重量莫耳濃度相等，但溶質分子量不同故重量百分濃度不相等。故選(A)(D)。
