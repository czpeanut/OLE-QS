  options:
  - label: A
    content: 若二者混合為理想溶液，則溶液蒸氣壓為150 mmHg
  - label: B
    content: 甲與乙混合時放熱
  - label: C
    content: 此混合溶液「甲－乙」分子問的作用力小於「甲－甲」或「乙－乙」分子間的作用力
  - label: D
    content: 此混合溶液的體積小於混合前甲與乙的體積和
  - label: E
    content: 此混合溶液對拉午耳定律呈現正偏差
