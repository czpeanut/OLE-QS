  options:
  - label: A
    content: 甲、乙兩溶液的蒸氣壓相等
  - label: B
    content: 丙杯最終有250克純水
  - label: C
    content: 甲燒杯最終有900克的水
  - label: D
    content: 乙杯重量莫耳濃度約為1.3m
  - label: E
    content: 兩溶液的重量百分率相等
  answer:
