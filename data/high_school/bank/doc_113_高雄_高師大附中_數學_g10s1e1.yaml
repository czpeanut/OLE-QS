  stem: 數線上有 A、B、P 三點，且坐標分別為$-\frac{1}{2}$、3、x，若 P 點滿足「P 到 A 之距離 2 倍與 P 到 B 之距離和大於 5」，則 x 的範圍為＿＿＿＿。
  answer:
  - x＞1 或 x＜－1
  answer_status: verified
  answer_source: answer_key
  explanation: '由題目可知，$2\left| x+\frac{1}{2} \right|$＋｜x－3｜＞5

    (1) 若 x ≥ 3，

    2x＋1＋x－3＞5

    ⇒ 3x＞7 ⇒ x＞$\frac{7}{3}$

    可知 x ≥ 3

    (2) 若$-\frac{1}{2}$≤ x＜3，

    2x＋1＋3－x＞5 ⇒ x＞1

    可知 1＜x＜3

    (3) 若 x＜$-\frac{1}{2}$，

    －2x－1＋3－x＞5 ⇒－3＞3x ⇒ x＜－1

    可知 x＜－1

    由(1) 、(2) 、(3) 得 x＜－1 或 x＞1'
