- id: doc_113_高雄_高師大附中_數學_g10s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 有關有理數與無理數的運算性質，下列哪些敘述是正確的？
  options:
  - label: A
    content: 若 a 是有理數，b 是無理數，則 a＋b 是無理數
  - label: B
    content: 若 a＋b 是有理數，且 a 是無理數，則 b 必為無理數
  - label: C
    content: 若 a、b 都是無理數，則$\frac{a}{b}$是無理數
  - label: D
    content: 設 a、b 是有理數，c、d 是無理數，若 a＋c＝b＋d，則 a＝b 且 c＝d
  - label: E
    content: 若 $a^{4}b^{2}$ 與 $a^{3}$b 是有理數，則 a、b 都是有理數
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：若 a＋b 為有理數，則 b＝（a＋b）－a 為有理數，矛盾

    故 a＋b 為無理數

    (B) ○：若 b 為有理數，則 a＝（a＋b）－b 為有理數，矛盾

    故 b 為無理數

    (C) ╳：反例：若 a＝b＝$\sqrt{2}$，則$\frac{a}{b}$＝1 為有理數

    (D) ╳：反例：若 a＝0，b＝1，c＝$\sqrt{2}$，d＝$\sqrt{2}$－1，

    則 a＋c＝b＋d，但 a≠b 且 c≠d

    (E) ╳：反例：若 a＝b＝$\sqrt{2}$，

    則 $a^{4}b^{2}$＝8 為有理數，$a^{3}$b＝4 為有理數，但 a、b 為無理數

    故選(A)(B)'
