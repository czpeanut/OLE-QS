- id: doc_113_高雄_高師大附中_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列選項中的大小關係，哪些是正確的？
  options:
  - label: A
    content: 3＋$\sqrt{6}$＞$2\sqrt{2}$＋$\sqrt{7}$
  - label: B
    content: $\sqrt{13}$－$\sqrt{3}$＜$\sqrt{10}$
  - label: C
    content: $\frac{1}{\sqrt{15} - \sqrt{5}}$＞0.6
  - label: D
    content: 若 a、b 是有理數，且 a＜b，則$\frac{a+b}{3}$＞$\frac{a+b}{4}$
  - label: E
    content: $10^{3 log2}$＞log10000000$\sqrt{10}$
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$(3+\sqrt{6} )^{2}$＝9＋6＋$6\sqrt{6}$＝15＋$\sqrt{216}$

    $(2\sqrt{2}+\sqrt{7} )^{2}$＝8＋7＋$4\sqrt{14}$＝15＋$\sqrt{224}$

    ⇒$(3+\sqrt{6} )^{2}$＜$(2\sqrt{2}+\sqrt{7} )^{2}$

    ⇒ 3＋$\sqrt{6}$＜$2\sqrt{2}$＋$\sqrt{7}$

    (B) ○：$(\sqrt{13} )^{2}$＝13

    $(\sqrt{10} +\sqrt{3} )^{2}$＝13＋$2\sqrt{30}$

    ⇒$(\sqrt{13} )^{2}$＜$(\sqrt{10} +\sqrt{3} )^{2}$

    ⇒$\sqrt{13}$＜$\sqrt{10}$＋$\sqrt{3}$

    ⇒$\sqrt{13}$－$\sqrt{3}$＜$\sqrt{10}$

    (C) ○：$\frac{1}{\sqrt{15} -\sqrt{5}}$＝$\frac{1}{\sqrt{15} -\sqrt{5}}$×$\frac{\sqrt{15} +\sqrt{5}}{\sqrt{15} +\sqrt{5}}$＝$\frac{\sqrt{15} +\sqrt{5}}{10}$

    ∵$(\sqrt{15} +\sqrt{5})^{2}$＝15＋5＋$2\sqrt{75}$＝20＋$10\sqrt{3}$ ≈ 20＋10×1.732＝37.32

    ∴$(\sqrt{15} +\sqrt{5})^{2}$＞36 ⇒$\sqrt{15}$＋$\sqrt{5}$＞6

    ⇒$\frac{\sqrt{15} +\sqrt{5}}{10}$＞$\frac{6}{10}$＝0.6

    (D) ╳：反例：a＝－11，b＝－1，則$\frac{a+b}{3}$＝－4，$\frac{a+b}{4}$＝－3 ⇒$\frac{a+b}{3}$＜$\frac{a+b}{4}$

    (E) ○：$10^{3 log2}$＝（$10^{log2}$）$^{3}$＝$2^{3}$＝8

    log10000000$\sqrt{10}$＝$log10^{7.5}$＝7.5

    ⇒ $10^{3 log2}$＞log10000000$\sqrt{10}$

    故選(B)(C)(E)'
