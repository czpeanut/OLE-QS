  stem: 已知 n 為正整數且$\frac{2n +3}{n +3}$＞$\sqrt{3}$＞$\frac{2n+1}{n+2}$，則 n＝＿＿＿＿。
  answer:
  - '9'
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{2n+3}{n+3}$＝$\frac{2n+6-3}{n+3}$＝2－$\frac{3}{n+3}$，$\frac{2n+1}{n+2}$＝$\frac{2n+4-3}{n+2}$＝2－$\frac{3}{n+2}$

    故 2－$\frac{3}{n+3}$＞$\sqrt{3}$＞2－$\frac{3}{n+2}$

    ⇒$\frac{3}{n+3}$＜2－$\sqrt{3}$＜$\frac{3}{n+2}$

    ∵2－$\sqrt{3}$＝$\frac{1}{2+\sqrt{3}}$＝$\frac{3}{6+3\sqrt{3}}$

    ∴n＋2＜6＋3$\sqrt{3}$＜n＋3

    ⇒ n＜4＋3$\sqrt{3}$＜n＋1

    ∵4＋3$\sqrt{3}$＝4＋$\sqrt{27}$＝9.196 ……

    ∴n＝9'
