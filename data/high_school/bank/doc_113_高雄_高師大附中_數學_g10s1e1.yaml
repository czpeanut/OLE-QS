  stem: 已知芮氏地震強度 R 級所釋出能量 E 爾格之間的關係式為 logE＝1.5R＋11.4，今有某地震所釋出的能量介於 6 級地震的$\frac{1}{1000000}$倍與$10\sqrt{10}$倍（含）之間，試求這地震強度 R 的範圍為 ＿＿＿＿。
  answer:
  - 2 ≤ R ≤ 7
  answer_status: verified
  answer_source: answer_key
  explanation: '令 6 級地震所釋放出的能量為 E(6)

    若$\frac{1}{1000000}$E(6)≤ E ≤$10\sqrt{10}$E(6)

    ∵$\frac{1}{1000000}$E(6)＝$10^{－6}$．$10^{\log E(6)}$＝$10^{-6+\log E(6)}$

    ∴log$\left( \frac{1}{1000000}E(6) \right)$＝－6＋logE(6)

    ∵$10\sqrt{10}$E(6)＝$10^{\frac{3}{2}}$．$10^{\log E(6)}$＝$10^{\frac{3}{2}+\log E(6)}$

    ∴log（$10\sqrt{10}$E(6)）＝$\frac{3}{2}$＋logE(6)

    則 log$\left( \frac{1}{1000000}E(6) \right)$≤ logE ≤ log（$10\sqrt{10}$E(6)）

    ⇒ logE(6)－6 ≤ logE ≤ logE(6)＋$\frac{3}{2}$

    又 logE(6)＝1.5×6＋11.4＝20.4

    ⇒ 14.4 ≤ logE ≤ 21.9

    ⇒ 3 ≤ logE－11.4 ≤ 10.5

    ⇒ 2 ≤$\frac{\log E-11.4}{1.5}$≤ 7

    故 R＝$\frac{\log E-11.4}{1.5}$的範圍為 2 ≤ R ≤ 7'
