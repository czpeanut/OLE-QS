    content: △AFD～△DEC
  - label: B
    content: 矩形 FBED 周長的最小值是$2\sqrt{15}$
  - label: C
    content: 矩形 FBED 周長有最小值時，$\overline{FD}$＝$\sqrt{15}$
  - label: D
    content: △ABC 面積的最小值是 30
  - label: E
    content: △ABC 面積有最小值時，$\overline{FD}$＝5
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_113_高雄_高師大附中_數學_g10s1e1/s1_5_f1.png
