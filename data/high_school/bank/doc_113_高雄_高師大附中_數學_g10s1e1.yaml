  stem: 山裡大學的校園生態豐富，自由的環境孕育出獨一無二的原生種—黑特猴。為保護此類獨特的珍稀物種，校方對其進行了初步的統計及研究，發現黑特猴的數量可以用數學模式： M（t）＝a（1－$10^{－bt}$）來描述猴群數量的變化，其中 M（t）為猴子數量，t 為經過的時間（以年為單位），a、b 為常數。已知自校方進行調查之始，資料顯示一年後有 60 隻黑特猴，兩年後有 90 隻黑特猴，依此數學模式，試問三年後校園裡黑特猴的數量有＿＿＿＿隻。
  answer:
  - '105'
  answer_status: verified
  answer_source: answer_key
  explanation: '由題目可知$\begin{cases}60=a(1-10^{-b}) \cdots \cdots \cdots \cdots \cdots ① \\ 90=a(1-10^{-2b})\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    $\frac{②}{①}$得$\frac{90}{60}$＝$\frac{3}{2}$＝$\frac{a(1-10^{-2b})}{a(1-10^{-b})}$＝$\frac{(1-10^{-b}) (1+10^{-b})}{1-10^{-b}}$＝1＋$10^{－b}$

    ⇒ $10^{－b}$＝$\frac{1}{2}$，代回得 a＝120

    ∴M（t）＝120$\left( 1-\left( \frac{1}{2} \right) ^{t} \right)$

    則 M(3)＝120$\left( 1-\frac{1}{8} \right)$＝105

    故三年後校園裡的黑特猴有 105 隻'
