      - 196.05
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵∠FAD＝∠EDC，∠AFD＝∠DEC＝90°，∠ADF＝∠DCE

    ∴△AFD～△DEC

    (B) ╳(C) ○：令$\overline{FB}$＝$\overline{DE}$＝x，$\overline{FD}$＝$\overline{BE}$＝y

    則$\overline{AF}$：$\overline{FD}$＝$\overline{DE}$：$\overline{EC}$⇒ 5：y＝x：3 ⇒ xy＝15

    由算幾不等式得$\frac{x+y}{2}$≥$\sqrt{xy}$＝$\sqrt{15}$⇒ x＋y ≥$2\sqrt{15}$⇒ 2x＋2y ≥$4\sqrt{15}$

    故周長的最小值為$4\sqrt{15}$

    等號成立於 x＝y ⇒ x＝y＝$\sqrt{15}$

    (D) ○(E) ╳：承(B)，△ABC 面積＝$\frac{1}{2}$．5y＋xy＋$\frac{1}{2}$．3x＝$\frac{1}{2}$（3x＋5y）＋15

    由算幾不等式得$\frac{3x+5y}{2}$≥$\sqrt{15xy}$＝15

    ∴△ABC 面積≥ 15＋15＝30

    等號成立於 3x＝5y，y＝$\frac{3}{5}$x 代入 xy＝15 得 $x^{2}$＝25 ⇒ x＝5，y＝3

    故$\overline{FD}$＝3

    故選(A)(C)(D)'
