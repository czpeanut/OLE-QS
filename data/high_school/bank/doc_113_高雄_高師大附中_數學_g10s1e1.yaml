  stem: 將$(\sqrt[3]{49} )^{50}$寫成科學記號$(\sqrt[3]{49} )^{50}$＝a×$10^{n}$，其中 1 ≤ a＜10，且 n 為正整數。下列哪些選項正確？（已知 log2 ≈ 0.3010，log3 ≈ 0.4771，log7 ≈ 0.8451）
  options:
  - label: A
    content: $(\sqrt[3]{49} )^{50}$＝$7^{\frac{100}{3}}$
  - label: B
    content: $(\sqrt[3]{49} )^{50}$＝$10^{\frac{50}{3} \log 7}$
  - label: C
    content: n＝28
  - label: D
    content: $10^{0}$＜a ≈ $10^{0.17}$＜$10^{1}$
  - label: E
    content: $(\sqrt[3]{49} )^{50}$其整數部分為 28 位
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$(\sqrt[3]{49} )^{50}$＝$(7^{\frac{2}{3}})^{50}$＝$7^{\frac{100}{3}}$

    (B) ╳：$10^{\frac{50}{3} \log 7}$＝$(10^{\log 7})^{\frac{50}{3}}$＝$7^{\frac{50}{3}}$≠$7^{\frac{100}{3}}$

    (C) ○：$7^{\frac{100}{3}}$＝$(10^{\log 7})^{\frac{100}{3}}$＝$10^{\frac{100}{3} \log 7}$≈$10^{\frac{100}{3}\times 0.8451}$＝$10^{28.17}$＝$10^{0.17}$×$10^{28}$，n＝28

    (D) ○：a＝$10^{0.17}$＞$10^{0}$＝1，且 a＝$10^{0.17}$＜$10^{1}$＝1

    (E) ╳：應為 29 位

    故選(A)(C)(D)'
