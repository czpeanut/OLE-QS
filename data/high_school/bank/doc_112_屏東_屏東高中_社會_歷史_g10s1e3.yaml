- id: doc_112_屏東_屏東高中_社會_歷史_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某物品因為在工業革命中扮演重要角色，是當時重要的動能來源。沈葆楨來臺時，為配合清朝政府自強新政，曾經以官營方式經營，其後在清法戰爭中，下令炸燬官礦，轉以民營產品為外銷主力，後成為第 4 大出口商品。請問文中所述的物品，應該是指什麼？
  options:
  - label: A
    content: 樟腦
  - label: B
    content: 硫磺
  - label: C
    content: 煤礦
  - label: D
    content: 鐵礦
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '這項物品是工業革命中的重要動能來源，因此可推知為(C)煤礦。

    9.1670 年為鄭氏治臺時期，當時與臺灣有通商協議、能在臺設立商館的國家為(B)英國。

    10.李春生替陶德投資(A)茶葉，並將茶葉運往大稻埕精製與包裝，再由淡水出口外銷。

    11.從文獻來看，北郊係與長江以北地區貿易，南郊則與福建地區貿易，港郊的貿易範圍則是臺灣各港，因此三郊的名號應源自(A)進行貿易地區。

    12.(B)在政府消極不作為下，清領前期臺灣的土地開墾與水利建設均為民間人士主導，八堡圳即是其一。(A)(D)政府消極治臺的作為，目的在防範民變。(C)清領後期積極治臺的措施。

    13.(A)題文所述為贌社制度的作法，此制度為荷治時期開始實施，目的在取得鹿皮與鹿製品，後被沿用至清治時期，導致臺灣的野生鹿大量減少。

    14.從兩則資料可以看出，鄭成功的商船貿易地點與貿易商品，與荷蘭人有高度的重疊性，因此可以推論兩者之間有貿易競爭關係，答案為(D)。(A)(B)從資料中無法判斷。(C)兩者應是競爭關係，非合作貿易。

    15.傳教士代表歐洲洋行的勢力進入山區，而山區能獲利的經濟產品應是茶與樟腦，故答案為(D)伐樟結腦。

    16.加工出口區為 1960 年代(B)出口擴張時期，政府改採出口導向政策，鼓勵外銷而設置，以勞力密集產業為主。

    17.1930 年代，總督府為了加速南進腳步，成立(D)臺灣拓殖株式會社，做為向中國大陸及東南亞地區開發的機構，臺灣也因此成為日本的南進基地。

    18.臺灣北部最大的水庫為(C)石門水庫，由美國提供顧問等人力協助，包含農業、工業、交通、水利建設等，中美合作完工。

    19.臺灣不產小麥，但有許多市場價值較低的麵粉，主要是因為「美援」物資，因此政府鼓勵國人「多吃麵，少吃米」，將節省下來的米用以外銷，(B)為正解。

    20.石油危機造成全球經濟衰退，因此政府修改經濟政策，透過重大工程建設的投資，解決失業問題，並強化國家基礎建設和改變產業結構，提升產業的競爭力，最後成功的克服經濟困境，答案為(B)。(A)建造石油化學工廠，降低對國際石油的依賴。(C) 1980 年代後。(D)此時出口困難。

    21.(A)為正解。(B)政府並未強迫改種米。(C)資本家重視糖，農民則傾向種米。(D)只有糖受到原料採收區域限制。

    22.政府推行改革幣制的目的在穩定臺灣的金融秩序與物價，此為(A)經濟重建時期的措施。

    23.題文顯示日本本地亟需足夠的米，為減少米騷動事件發生，必須增加殖民地的米產量，因此最可能的作法為(B)推動綠色革命，增加米糖產量。(A)二戰期間的經濟管制措施。(C)(D)無法解決國內缺米的問題。

    24.1951 ～ 1953 年間的自耕農與佃農變化最大，之後兩者則呈現穩定的消長狀態，這主要是因為政府於 1953 年推行「耕者有其田」政策，許多佃農因此受惠，(A)為正解。

    25.日治時期的 3 大林場為阿里山、八仙山及太平山，因此答案為(B)。

    26.「肥料換穀」是強制農民以稻穀換取作物的肥料及美援物資，實則控制農業的產銷與米價，使農民利潤降低，因此不少農家子弟被迫脫離農村，成為工商業生產的勞動力，(C)為正解。

    27.題文所述為日治時期的(A)指定原料採取區域制，使糖廠會社獨占甘蔗的收購權，控制收購價格，甚至在磅秤上做手腳，進而壓榨蔗農的利益。

    28.為解決臺灣的「一田多主」問題，劉銘傳曾試行減四留六法，結果以失敗告終。日治時期，總督府廢止大租權，支付大租戶補償金，才確立了以小租戶為土地所有權人，解決一田多主的現象，答案為(C)。

    29.臺灣的工業產值能趕上農業，主要是「因動力供給充裕」，因此可推知這項建設為能提供充裕動力的(A)日月潭水力發電廠。

    30.加入 WTO 後，必須逐年降低進口產品的關稅，結果是帶動進口產品的價格降低，也會衝擊到國內相關產品的價格，其中農業首當其衝，故答案應為(B)。(A)對出口產品價格影響不大。(C) 1960 年代政策、(D) 1950 年代政策，兩者今已不適用。

    31.從政府在推廣紡織、水泥、塑膠等工業，可推知此時應為進口替代時期，當時的政策為(A)以農業培養工業，特別是民生輕工業為主。(B) 1960 年代出口擴張政策。(C)日治時期的經濟措施。(D) 1970 年代的政策。

    32.從附圖可以看到，此時期的臺灣生產物品仍以米、糖等農產品為主，工業產品僅占 8 ％左右，應為需要進口大量日用品的(A) 1950 年代。

    33.大量臺商「西進」的結果，造成兩岸轉口貿易快速成長，但(B)「臺灣接單、中國大陸生產」的經濟模式，也使臺灣出口過度依賴中國大陸。

    34.臺灣現代舞的先驅為(A)蔡瑞月，於國民政府遷臺初期遭到政治迫害被囚 3 年，出獄後繼續從事舞蹈教學，仍處處受到國民政府的干預與限制，直到晚年才得以與其子離開臺灣移居澳洲。

    35.這位出身彰化的醫生與文學家為(C)賴和。(A)宜蘭人。(B)(D)兩人並非醫生。

    36.附圖為清真寺，為(A)伊斯蘭教的宗教建築。

    37.題文所述為(D) 1970 年代的鄉土文學論戰，表面上是針對臺灣文學寫作方向的爭論，實則隱含雙方對臺灣主體性的認同差異。

    38.從聖母聖子像穿著魯凱族傳統服飾、天主堂中有百步蛇裝飾、以太魯閣族語翻譯《聖經》等，可見得基督宗教與原住民傳統文化的結合，故(B)為正解。

    39.在(C) 1970 年代外交困頓時期，有一群大學生開始反思自身的定位，並決定要「唱自己的歌」，因此形成「校園民歌」風潮。

    40.附圖所記資訊為臺灣現代文學發展的背景與現象，現代文學盛行的時間為(B) 1950 ～ 1960 年代。

    41.1980 年代(C)解除戒嚴使臺灣文人重新展現創作的熱情，因此寫作的題材也變得更加多元。

    42.《光陰的故事》、《兒子的大玩偶》刻劃市井小民的生活，忠實反映時代變遷與社會寫實面貌，也因此讓臺灣電影開始在國際間受到矚目，答案為(D)。(A)受寫實主義影響，關懷社會底層人物。(B)(C)為日治時期的作法。

    43.選項中僅(C)佛光山為佛教組織，(A)(D)為民間信仰。(B)屬於齋教寺院。

    44.題文所述為道教儀式常見的神職人員，由於作法時頭戴紅巾，故稱為(B)紅頭司公。

    45.「燒王船」與「送王船」為(A)王爺崇拜的重要儀式，目的在送走（防止）瘟疫。'
