  group_stem: '世界 4 大極地超級馬拉松巡迴賽（The 4 Deserts Race Series）以南極沙漠、蒙古戈壁沙漠、南美智利阿他加馬沙漠和南非納米比沙漠 4 個險惡地區為舞臺，進行 7 天 6 夜 250 公里的長跑賽事。2008 年起，主辦單位又增加了第 5 場「終極馬拉松」賽事（Ultramarathon），此賽事每一年地點都不相同。在同一年完成 4 大極地加上第 5 場終極馬拉松賽事的選手，可獲得「4＋1 極地大滿貫」（4 Deserts Grand Slam Plus）的殊榮，目前世界上僅有 8 人完成。下表為 2022 年 5 場賽事競賽地點的相關資訊（第 5 場在北歐芬蘭拉普蘭地區）。請問：

