    12.12 月 22 日太陽直射南回歸線，而「尖塔陰影最長且朝向正北」表示太陽應位於該都市南邊，且該都市離太陽直射點南回歸線最遠。圖中 4 個都市皆位於南半球，但乙、丙均溫低，位於溫帶，太陽在其北邊；甲、丁均溫高，位於熱帶地區，有可能位於太陽直射點的北邊，再由冬溫判斷甲地比丁地低緯，離直射點最遠，因此影子最長，所以符合題意的是(A)甲。

    13.(甲)氣溫最高處應為背風處、受氣流下沉增溫影響的 e 地；(丙) a 地與 e 地海拔相同，但 a 地氣溫較 e 地低，因此 e 地氣壓值較低。

    14.賽事 1、3 位於熱帶沙漠，賽事 2 位於溫帶沙漠。(甲)沙漠地區日夜溫差皆大；(乙)緯度較高的溫帶沙漠年溫差較熱帶沙漠大；(丙)僅新疆戈壁沙漠深居內陸；(丁)阿他加馬沙漠受秘魯涼流影響有明顯霧氣，符合題意的為(B)甲乙丁。

    15.(1)先判斷南北半球：受緯度影響，北半球等溫線的數值由南向北遞減，丙丁為北半球；南半球等溫線的數值由北向南遞減，甲乙為南半球。

    (2)再判斷海陸性質差異：陸地比熱較海洋小，冬季時陸地散熱快，氣溫較海洋低；夏季時陸地吸熱快，氣溫較海洋高。故在 2 張圖上繪製 1 條代表同緯度的水平直線，左圖為南半球夏季：陸地(乙)溫度較海洋(甲)高；右圖為北半球冬季：陸地(丙)溫度較海洋(丁)低。

    (3)符合題意為陸地的為(C)乙丙。

    16.(甲)赤道低壓帶的氣流上升、無風；(乙)副熱帶高壓帶氣流下沉、無風；(丁)西風帶位於中緯度地區、終年盛行西風。

    17.在 2 張圖上的海洋地區繪製 1 條代表同緯度的水平直線，可知洋流流經區域較同緯度其他海洋的溫度低，推測應受涼流影響。(A)因要補充其他海域的海水減少而產生的補償流。(C)左圖位於南半球，洋流的流向為由南往北流。(D)左圖南半球，右圖北半球。

    18.雪線為高山上部積雪終年不消的冰雪下限。在不考慮迎背風的影響下，向陽坡較溫暖，雪線會高於背陽坡，北半球的山地南側為向陽坡、北側為背陽坡，因此(A)(C)較符合，但因為低緯度地區雪線位置較高，因此要選(C)。

    19.由圖可知，夏乾冬雨且冬溫介於 0 ～ 18 ℃之間，應為溫帶地中海型氣候，(A)深根、厚皮、蠟質小葉為地中海灌木林的特色。(B)為熱帶季風林。(C)為疏林莽原。(D)為夏雨型暖溼氣候及副熱帶季風氣候區可見的常綠闊葉林。

    20.(A)由緯度判斷，此區位於南半球的東南信風帶，因此迎風側的甲降水量應最多。'
