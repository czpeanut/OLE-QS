  answer_status: verified
  answer_source: answer_key
  explanation: (B)阿納德爾港位於歐亞大陸東岸，受親潮（寒流）影響僅 8 ～ 9 月通航；博多港位於歐亞大陸西岸，受北大西洋暖流影響成為終年不凍港，全年可通航。
