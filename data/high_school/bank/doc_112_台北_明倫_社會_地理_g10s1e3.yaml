  stem: 阿納德爾港（64.8°N，177.6°E），全年大部分時間浮冰覆蓋，8 ～ 9 月間可通航，近年來因天然氣開發，經濟快速成長；博多港（67.3°N，14.4°E）可全年通航，主要出口貨物為魚、魚粉及青魚油等，進口貨物有煤、鹽及石油等。2 港口緯度相當，但博多港的通航期比阿納德爾港來得長，主要是受到下列哪項因素的影響？
  options:
  - label: A
    content: 進出口貨物類別
  - label: B
    content: 位於陸塊東西岸
  - label: C
