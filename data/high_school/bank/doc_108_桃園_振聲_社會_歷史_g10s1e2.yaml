  stem: （素養）清康熙時，因朱一貴事件，臺灣首任巡台御史黃叔璥，在其著作《臺海使槎錄》：「蓋自紅夷至臺，就中土之遺民，令之耕田輸租，以受種十畝之田為一甲，分別上、中、下則徵粟，其陂塘修築之費，耕牛、農具、種籽，皆紅夷資給，故曰『王田』。亦猶中土之人，受田耕種而納租於田主之義，非民自世其業，而按畝輸稅也。」根據上文記載，下列何者正確？
