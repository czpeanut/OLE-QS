questions:
- id: doc_112_台中_興大附中_數學_數甲_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 討論函數 f（x）＝－$x^{4}$＋$4x^{3}$－$6x^{2}$＋8x 的凹向跟反曲點，下列選項何者正確？
  options:
  - label: A
    content: x＝1 為反曲點，且 f（x）在 x＜1 時凹向下，在 x＞1 時凹向上
  - label: B
    content: x＝1 為反曲點，且 f（x）在 x＞1 時凹向下，在 x＜1 時凹向上
  - label: C
    content: x＝1 為反曲點，且 f（x）在所有實數皆凹向下
  - label: D
    content: x＝1 不為反曲點，且 f（x）在所有實數皆凹向下
  - label: E
    content: x＝1 不為反曲點，且 f（x）在所有實數皆凹向上
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝－$4x^{3}$＋$12x^{2}$－12x＋8

    f''''（x）＝－$12x^{2}$＋24x－12

    ＝－12（x－1）$^{2}$

    $\Rightarrow$f''''(1)＝0，但當 x≠1 時，f''''（x）＜0

    故 x＝1 不為反曲點，且皆凹向下

    故選(D)'
- id: doc_112_台中_興大附中_數學_數甲_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在 f（x）＝（$x^{2}$－5x＋3）$^{10}$ 的圖形上，以點 P（1，1）為切點的切線方程式為何？
  options:
  - label: A
    content: 10x＋y＝11
  - label: B
    content: 10x－y＝9
  - label: C
    content: 30x－y＝29
  - label: D
    content: 30x＋y＝31
  - label: E
    content: y＝1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝10（$x^{2}$－5x＋3）$^{9}$（2x－5）

    f''(1)＝10（1－5＋3）$^{9}$（2－5）＝30

    故切線為 30x－y＝29

    故選(C)'
- id: doc_112_台中_興大附中_數學_數甲_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 設 k 為整數，且 f（x）＝$x^{3}$＋$kx^{2}$＋（k＋6）x＋3，若 f（x）恆為嚴格遞增函數，則滿足條件之 k 值共有幾個？
  options:
  - label: A
    content: '7'
  - label: B
    content: '8'
  - label: C
    content: '9'
  - label: D
    content: '10'
  - label: E
    content: '11'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '若 f（x）恆為嚴格遞增

    則 f''（x）＝$3x^{2}$＋2kx＋k＋6 ≥ 0

    故（2k）$^{2}$－4×3×（k＋6）≤ 0

    $\Rightarrow4k^{2}$－12k－72 ≤ 0

    $\Rightarrowk^{2}$－3k－18 ≤ 0

    $\Rightarrow$（k－6）（k＋3）≤ 0

    $\Rightarrow$－3 ≤ k ≤ 6

    ∵k 為整數

    ∴共有 10 個

    故選(D)'
- id: doc_112_台中_興大附中_數學_數甲_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知 f（x）＝$4x^{3}$＋$x\int_{-2}^{0} f ( t )dt$＋5 為一多項式，試求 f（－1）之值為
  options:
  - label: A
    content: '0'
  - label: B
    content: '3'
  - label: C
    content: '6'
  - label: D
    content: '9'
  - label: E
    content: '12'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '令 a＝$\int_{-2}^{0} f ( t )dt$

    則 f（x）＝$4x^{3}$＋ax＋5

    $\int_{-2}^{0} f ( x )dx$＝$\int_{-2}^{0} ( 4x^{3}+ax + 5 )dx$

    $\Rightarrow$a＝$\left. \left( x^{4}+\frac{a}{2}x^{2}+ 5x \right) \right| _{-2}^{0}$

    ＝－（16＋2a－10）

    $\Rightarrow$a＝－2

    故 f（x）＝$4x^{3}$－2x＋5

    f（－1）＝－4＋2＋5＝3

    故選(B)'
- id: doc_112_台中_興大附中_數學_數甲_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 若方程式 $x^{3}$＋$3x^{2}$－24x＋t＝0 有兩相異負根及一正根，則 t 值的範圍為
  options:
  - label: A
    content: t＞28
  - label: B
    content: 0＜t＜28
  - label: C
    content: －28＜t＜80
  - label: D
    content: －80＜t＜0
  - label: E
    content: 0＜t＜80
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝$x^{3}$＋$3x^{2}$－24x＋t＝0

    $\Rightarrow$f''（x）＝$3x^{2}$＋6x－24

    ＝3（$x^{2}$＋2x－8）

    ＝3（x＋4）（x－2）

    若 y＝f（x）有三相異根，則 f（－4）．f(2)＜0

    $\Rightarrow$（－64＋48＋96＋t）（8＋12－48＋t）＜0

    $\Rightarrow$（t＋80）（t－28）＜0

    $\Rightarrow$－80＜t＜28 …………………………………………①

    又三相異根為兩負一正，故 f(0)＝t＜0 ……………②

    由①、②得－80＜t＜0

    故選(D)'
- id: doc_112_台中_興大附中_數學_數甲_g12s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 右圖為 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d 的圖形，則下列哪些選項是正確的？
  options:
  - label: A
    content: a＞0
  - label: B
    content: b＞0
  - label: C
    content: c＞0
  - label: D
    content: d＞0
  - label: E
    content: $b^{2}$－3ac＞0
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵當 x →∞，f（x）→－∞

    ∴a＜0

    (B)○：對稱中心之 x 坐標為$\frac{-b}{3a} > 0$

    ∴b＞0

    (C)○：f''（x）＝$3ax^{2}$＋2bx＋c

    $\Rightarrow$f''(0)＝c＞0

    (D)╳：f(0)＝d＜0

    (E)○：∵f（x）有 2 條水平切線，即 f''（x）＝0 有兩相異解

    ∴$b^{2}$－3ac＞0

    故選(B)(C)(E)'
