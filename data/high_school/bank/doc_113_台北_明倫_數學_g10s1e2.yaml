- id: doc_113_台北_明倫_數學_g10s1e2_s3_2
  section: 3
  number: 2
  type: multiple
  page: 2
  stem: 設圓 C 的方程式為 $4x^{2}$＋$4y^{2}$－8x＋16y＋k＝0，請選出正確選項。
  options:
  - label: A
    content: （1，－2）在圓 C 上
  - label: B
    content: k＜20
  - label: C
    content: 此圓的半徑為$\frac{20-k}{4}$
  - label: D
    content: 3x＋5y＝－7 為此圓的一條割線
    asset:
      key: s3_2_optD
      file: doc_113_台北_明倫_數學_g10s1e2/s3_2_optD.png
      crop:
        page: 2
        rect:
        - 433.9
        - 622.8
        - 564.3
        - 727.7
  - label: E
    content: 可以找到兩條斜率為－3 的直線均可平分此圓的面積
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'C：（$4x^{2}$－8x）＋（$4y^{2}$＋16y）＝－k

    ⇒ 4〔（x－1）$^{2}$－$1^{2}$〕＋4〔（y＋2）$^{2}$－$2^{2}$〕＝－k

    ⇒ 4（x－1）$^{2}$＋4（y＋2）$^{2}$＝－k＋20

    ⇒（x－1）$^{2}$＋（y＋2）$^{2}$＝$\frac{1}{4}$（－k＋20）

    (A) ╳：（1，－2）為圓心

    (B) ○：$\frac{1}{4}$（－k＋20）＞0 ⇒－k＋20＞0 ⇒ k＜20

    (C) ╳：半徑為$\sqrt{\frac{-k+20}{4}}$

    (D) ○：3x＋5y＝－7 過圓心（1，－2） ∴必為割線

    (E) ╳：僅有一條斜率為 －3 且過圓心的直線

    故選(B)(D)'
