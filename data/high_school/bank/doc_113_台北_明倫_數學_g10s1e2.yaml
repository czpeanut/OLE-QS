  type: fill
  page: 3
  stem: 求通過（0，5）、（－1，6）且圓心在 y 軸上的圓方程式為＿＿＿＿。
  answer:
  - $x^{2}$＋（y－6）$^{2}$＝1
  answer_status: verified
  answer_source: answer_key
  explanation: '設圓心 K（0，k）到 A（0，5），B（－1，6）等距離

    ⇒$\overline{KA}$＝$\overline{KB}$⇒∣k－5∣＝$\sqrt{〔0-(-1)〕^{2}+(k-6)^{2}}$

    ⇒ $k^{2}$－10k＋25＝$k^{2}$－12k＋37 ⇒ k＝6

    ∴圓心 K（0，6），半徑 r＝$\overline{KA}$＝1

    所求為 $x^{2}$＋（y－6）$^{2}$＝1'
