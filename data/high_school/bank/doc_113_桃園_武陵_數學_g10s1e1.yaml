- id: doc_113_桃園_武陵_數學_g10s1e1_s3_1
  section: 3
  number: 1
  type: calc
  page: 1
  stem: '雙十節時小煥去武陵農場玩，去程與回程皆走相同的路線，已知單趟車程距離為150公里，若去程的平均時速為每小時a公里，回程的平均時速為每小時b公里，來回路程的平均時速為每小時k公里。試回答下列各題：

    (1) 試以a、b來表示k。( 3分 )'
  explanation: '(1) 平均速率＝$\frac{總距離}{總時間}$＝$\frac{300}{\frac{150}{a}+\frac{150}{b}}$＝$\frac{2}{\frac{1}{a}+\frac{1}{b}}$＝$\frac{2}{\frac{a+b}{ab}}$＝$\frac{2ab}{a+b}$， 即k＝$\frac{2ab}{a+b}$($\frac{2ab}{a+b}$稱為正數a和b的調和平均數 )。

    (2) ∵ a＞0，b＞0，由算幾不等式知：$\frac{\frac{1}{a}+\frac{1}{b}}{2}\geq \sqrt{\frac{1}{a}\cdot \frac{1}{b}}$ ⇔ $\frac{2}{\frac{1}{a}+\frac{1}{b}}\leq \sqrt{ab}$，即$k\leq \sqrt{ab}$，等號成立時，$\frac{1}{a}$＝$\frac{1}{b}$ ⇔ a＝b。

    (3) ∵ a＞0，b＞0，由算幾不等式知，$\frac{a+b}{2}\geq \sqrt{ab}$，等號成立時，a＝b， 故$\frac{a+b}{2}\geq \sqrt{ab}\geq k$( 算式平均數 ≥ 幾何平均數 ≥ 調和平均數 ) 等號成立時，均為a＝b，故a＋b ≥ 2k＝120 即a＝b＝60時，a＋b有最小值120。'
