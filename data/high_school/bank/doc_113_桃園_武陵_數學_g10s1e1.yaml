- id: doc_113_桃園_武陵_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 令x＝3＋$\sqrt{7}$，y＝3－$\sqrt{7}$，請選出正確的選項。
  options:
  - label: A
    content: xy＝4
  - label: B
    content: $x^{2}$＋$y^{2}$＝34
  - label: C
    content: $x^{3}$＋$y^{3}$＝180
  - label: D
    content: $x^{4}$＋$y^{4}$＝1018
  - label: E
    content: ( 3＋$\sqrt{7}$)$^{4}$的整數部分為1015
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ×：xy＝$( 3+\sqrt{7} )( 3-\sqrt{7} )$＝$3^{2}$－$\sqrt{7}^{2}$＝9－7＝2 (B) ×：$x^{2}$＋$y^{2}$＝( x＋y )$^{2}$－2xy＝(( 3＋$\sqrt{7}$)＋( 3－$\sqrt{7}$))$^{2}$－2×2＝$6^{2}$－4＝32 (C) ○：$x^{3}$＋$y^{3}$＝( x＋y ) ( $x^{2}$－xy＋$y^{2}$ )＝6×( 32－2 )＝180 (D) ×：$x^{4}$＋$y^{4}$＝( $x^{2}$＋$y^{2}$ )$^{2}$－$2x^{2}y^{2}$＝$32^{2}$－2．$2^{2}$＝1024－8＝1016 (E) ○：∵ $x^{4}$＋$y^{4}$＝$( 3+\sqrt{7} )^{4}$＋$( 3-\sqrt{7} )^{4}$＝1016 又0＜3－$\sqrt{7}$＜1 ∴ 0＜$( 3-\sqrt{7} )^{4}$＜1 ∴ 1015＜$( 3+\sqrt{7} )^{4}$＝1016－$( 3-\sqrt{7} )^{4}$＜1016 即$( 3+\sqrt{7} )^{4}$的整數部分為1015。

    故選(C)(E)。'
