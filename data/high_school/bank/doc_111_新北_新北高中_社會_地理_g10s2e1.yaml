  section: 1
  number: 10
  type: single
  page: 3
  stem: '若將各級網球賽事視為中地理論的中地，且在不同等級賽事中奪冠的球員可獲得不一樣的積分（如下表），下列敘述何者正確？

    | 積分／賽事等級 | 賽事舉辦地點 |

    | --- | --- |

    | 250 分級（巡迴賽） | 布里斯本、雪梨、聖彼得堡、成都、伊斯特本、里昂……等，共 39 處 |

    | 500 分級（巡迴賽） | 鹿特丹、杜拜、哈雷、北京、東京、維也納、巴塞爾……等，共 13 處 |

    | 1,000 分級（大師賽） | 印第安泉、邁阿密、蒙地卡羅、辛辛那堤、上海……等，共 9 處 |

    | 2,000 分級（大滿貫） | 墨爾本、巴黎、溫布頓、紐約，共 4 處 |'
  options:
  - label: A
    content: 250 分級的賽事屬於高級中地
  - label: B
    content: 門票費用最貴的賽事為大師賽
  - label: C
    content: 觀眾願意移動距離最遠的為大滿貫
  - label: D
    content: 平均觀眾數量最多的賽事為 250 分級巡迴賽
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中地等級愈高，數量愈少，因此 250 分級應為低級中地。(B)愈高等級的賽事門票應愈貴，故 2,000 分級的大滿貫才是門票費用最高者。(D)最高等級的中地級來客範圍最廣，因此平均觀眾數量最多者應為 2,000 分級的大滿貫。
