  stem: 以中地理論的觀點而言，超市行動攤車的出現，下列何種解釋最佳？
  options:
  - label: A
    content: 需求頻率低的商品可以擴大通路
  - label: B
    content: 為了降低商閾，另闢偏遠市場
  - label: C
    content: 為了擴大商品圈，遊走不同區域
  - label: D
    content: 與公車虧本服務偏遠路線相同
  group_stem: 為服務偏遠地區，常有行動攤車出現沿路叫賣，或固定時間會在固定地點停留一段時間，再到下一個服務點。近年來部分的超市，也採取相同的服務概念，推出行動超市。例如：宜蘭喜互惠生鮮超市，服務對象以宜蘭地區為主。目前在宜蘭市、羅東鎮、頭城鎮、蘇澳鎮四地有批發量販店兼生鮮超市，礁溪鄉、壯圍鄉、五結鄉、冬山鄉四分店為生鮮超市，小貨車行動超市（如右圖）則穿梭大同鄉的崙埤村、玉蘭村及松羅村等地。
  shared_asset: g2_37_38
  explanation: (A)需求頻率低的商品通常售價較高，屬於高級商品，但行動攤車多販售低級商品，故不選。(B)增加行動攤車會使營業成本上升，因此可能會使商閾增加而非降低。(D)行動攤車雖然會使商閾成本上升，但卻能服務到原本超商無法服務的範圍，亦即使商品圈同時擴大，當商品圈大於商閾的情況下，行動攤車便可繼續營運。若虧本，超商基於盈利本質不可能持續推行行動攤車。
