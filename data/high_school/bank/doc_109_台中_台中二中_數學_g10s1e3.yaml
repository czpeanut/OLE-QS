  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知直線 L 的方程式為 2x－3y－5＝0，試求過點 A（1，－2）且與 L 平行的直線方程式為何？
  options:
  - label: A
    content: 2x－3y－7＝0
  - label: B
    content: 2x－3y－8＝0
  - label: C
    content: 2x－3y＝0
  - label: D
    content: 3x＋2y＋1＝0
  - label: E
    content: 3x－2y＝0
  explanation: '平行 L：2x－3y－5＝0

    設所求直線：2x－3y＋k＝0

    A（1，－2）代入得 k＝－8

    $\Rightarrow$所求直線為 2x－3y－8＝0

    故選(B)'
  tags:
    unit:
      code: MA-1-2-1
      book: 數學1（必修）
      chapter: 直線與圓
      title: 直線方程式
