    content: a＞0
  - label: B
    content: b＞0
  - label: C
    content: c＜0
  - label: D
    content: d＜0
  - label: E
    content: c＞a
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_109_台中_台中二中_數學_g10s1e3/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 444.1
      - 525.5
      - 562.05
      - 613.8
  explanation: '(A)╳：$L_{1}$ 的 x 截距＝$-\frac{1}{a}> 0\Rightarrow$a＜0

    (B)╳：$L_{1}$ 的 y 截距＝$-\frac{1}{b}> 0\Rightarrow$b＜0

    (C)╳：$L_{2}$ 的 x 截距＝$-\frac{1}{c}< 0\Rightarrow$c＞0

    (D)╳：$L_{2}$ 的 y 截距＝$-\frac{1}{d}< 0\Rightarrow$d＞0

    (E)○：a＜0，c＞0$\Rightarrow$c＞a

    故選(E)'
