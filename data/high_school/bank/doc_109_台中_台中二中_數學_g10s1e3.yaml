  type: single
  page: 1
  stem: 試判斷下列哪一個聯立方程組無解？
  options:
  - label: A
    content: $\begin{cases}x +2y -1=0 \\ 2x +4y -2=0\end{cases}$
  - label: B
    content: $\begin{cases}3x -y -5=0 \\ 2x -3y +8=0\end{cases}$
  - label: C
    content: $\begin{cases}x -y +5=0 \\ 4x -4y +8=0\end{cases}$
  - label: D
    content: $\begin{cases}3x -4y +5=0 \\ 4x -3y +8=0\end{cases}$
  - label: E
    content: $\begin{cases}7x -17y +5=0 \\ 13x -29y +8=0\end{cases}$
  explanation: '兩直線 x－y＋5＝0 與 4x－4y＋8＝0 平行

    $\Rightarrow\begin{cases}x -y +5=0 \\ 4x -4y +8=0\end{cases}$無解

    故選(C)'
