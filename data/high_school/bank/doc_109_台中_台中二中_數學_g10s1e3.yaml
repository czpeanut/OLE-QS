- id: doc_109_台中_台中二中_數學_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 試求點 P（－2，2）到圓 C：（x－2）$^{2}$＋（y＋1）$^{2}$＝$3^{2}$ 的最長距離為何？
  options:
  - label: A
    content: '2'
  - label: B
    content: '4'
  - label: C
    content: '5'
  - label: D
    content: '8'
  - label: E
    content: '13'
  explanation: '圓 C 的圓心 M（2，－1），半徑 r＝3

    $\overline{PM}$＝$\sqrt{4^{2}+3^{2}}$＝5＞r

    $\Rightarrow$P 在圓 C 外

    $\Rightarrow$P 至圓 C 的最長距離＝$\overline{PM} +r$＝5＋3＝8

    故選(D)'
