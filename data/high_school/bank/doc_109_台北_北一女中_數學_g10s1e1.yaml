- id: doc_109_台北_北一女中_數學_g10s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 已知 a＜b，A（a）、B（b）、$P \left( \frac{11a +4b}{15} \right)$、$Q \left( \frac{9a +6b}{15} \right)$、$R \left( \frac{8a +7b}{14} \right)$為數線上之點且此數線以右方為正向。試問下列哪些選項是正確的？
  options:
  - label: A
    content: 當$\overline{PQ}$長度為 4 時，$\overline{AB}$長度為 30
  - label: B
    content: P 必在 Q 的右邊
  - label: C
    content: P 必在$\overline{AB}$上
  - label: D
    content: R 必在$\overline{AB}$上
  - label: E
    content: R 有可能和 A 重合
  explanation: '(A)○：$\overline{PQ} = \left| \frac{11a +4b}{15}-\frac{9a +6b}{15} \right| = \left| \frac{2a -2b}{15} \right| =\frac{2}{15} (b -a)=4$

    $\Rightarrow$b－a＝30

    ∴$\overline{AB}$＝∣a－b∣＝b－a＝30

    (B)╳：$\frac{11a +4b}{15}-\frac{9a +6b}{15}=\frac{2}{15} (a -b)< 0$ ∴$\frac{11a +4b}{15}<\frac{9a +6b}{15}$

    即 P 在 Q 的左邊

    (C)○：∵$a <\frac{11a +4b}{15}<b$ ∴P 在$\overline{AB}$上

    (D)╳：舉反例：考慮$\frac{8a +7b}{14}-b =\frac{8a -7b}{14}$

    取 a＝7.5，b＝8，則 8a－7b＞0

    即 R 在 B 之右側，則 R 不在$\overline{AB}$上

    (E)○：令$\frac{8a +7b}{14} =a\Rightarrow$8a＋7b＝14a$\Rightarrow$7b＝6a，

    取 b＝－6，a＝－7，則 a＜b，此時 R 和 A 重合

    故選(A)(C)(E)'
