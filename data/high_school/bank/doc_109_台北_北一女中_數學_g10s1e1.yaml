- id: doc_109_台北_北一女中_數學_g10s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些選項是正確的？
  options:
  - label: A
    content: $(-5)^{\frac{1}{3}} =\sqrt[3]{-5}$
  - label: B
    content: （－109.1014）$^{0}$＝1
  - label: C
    content: log2＝0.3010
  - label: D
    content: $\sqrt{x^{2}+\frac{1}{x^{2}}+2} =x+\frac{1}{x}$
  - label: E
    content: ∣2x－3∣可以表示數線上點 P（x）到點$Q \left( \frac{3}{2} \right)$之距的兩倍
  explanation: '(A)╳：$(-5)^{\frac{1}{3}}$是沒有意義的，有理指數的底數要為“大於 0 的實數”

    (B)○：（－109.1014）$^{0}$＝1

    (C)╳：log2＝0.301029995……

    (D)╳：$\sqrt{x^{2}+\frac{1}{x^{2}}+2} =\sqrt{\left( x+\frac{1}{x} \right) ^{2}} = \left| x+\frac{1}{x} \right|$

    (E)○：∣2x－3∣＝$2 \left| x-\frac{3}{2} \right|$

    故選(B)(E)'
