  stem: '1996 年登陸臺灣的賀伯是歷年來襲臺最強勁的颱風，它曾在阿里山地區 428 平方公里的範圍，於 24 小時內自山區高度差 1 公里的地方降下 1748.5 公厘的雨量，而基礎物理學計算重力位能的公式是 U＝mgh，其中 U 的單位為焦耳，m 是雨水質量（單位：公斤），g 是重力加速度值（以 9.8 計算），h 是降雨的高度差（單位：公尺）。為了瞭解這 24 小時內的降雨威力有多大，可以用二次大戰落在廣島的那顆「小男孩原子彈」所產生的能量 5×$10^{14}$ 焦耳作對照，經計算後，阿里山地區這 24 小時降雨所受的能量約為＿＿＿＿顆「小男孩原子彈」的能量總和。（四捨五入取至整數值）

