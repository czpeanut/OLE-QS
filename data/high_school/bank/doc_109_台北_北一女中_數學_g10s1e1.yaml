- id: doc_109_台北_北一女中_數學_g10s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 下列哪些選項是正確的？
  options:
  - label: A
    content: 若 a 為有理數、b 為無理數，則$\frac{109a}{2020b}$必為無理數
  - label: B
    content: 任兩個相異的無理數之間至少有一個無理數
  - label: C
    content: $\frac{399}{1610}$可以化為循環小數
  - label: D
    content: 若$a =\frac{1+\sqrt{3}}{2}$，則$\sqrt{a +\frac{1}{2}}$之值和 a 相同
  - label: E
    content: 由$\frac{(2x+1)^{2}+(x+2)^{2}}{2}\geq \sqrt{(2x+1)^{2} (x+2)^{2}}$可知$\frac{(2x+1)^{2}+(x+2)^{2}}{2}$的最小值產生在（2x＋1）$^{2}$＝（x＋2）$^{2}$ 時
  explanation: '(A)╳：當 a＝0 時，$\frac{109a}{2020b}$＝0 為有理數

    (B)○：無理數具有稠密性

    (C)○：1610＝2×5×7×23

    $\frac{399}{1610}=\frac{57}{2\times 5\times 23}$

    ∵23 不為 57 的因數 ∴可化為循環小數

    (D)○：$\sqrt{a +\frac{1}{2}} =\sqrt{\frac{1+\sqrt{3}}{2}+\frac{1}{2}} =\sqrt{\frac{2+\sqrt{3}}{2}} =\sqrt{\frac{4+2\sqrt{3}}{4}}$＝$\frac{\sqrt{(\sqrt{3} +1)^{2}}}{2}=\frac{\sqrt{3} +1}{2}=a$

    (E)╳：①此選項未說明 x 是否為實數，故不等式不一定成立

    ② x 為實數，則當（2x＋1）$^{2}$＝（x＋2）$^{2}$ 時僅能保證前述不等式中的等號可成立， 但未能求出$\frac{(2x+1)^{2}+(x+2)^{2}}{2}$的最小值

    故選(B)(C)(D)'
