- id: doc_110_台南_台南二中_數學_g10s2e1_s3_1
  section: 3
  number: 1
  type: calc
  page: 2
  stem: '請用數學歸納法證明對任意正整數 n，$3^{4n＋2}$＋$5^{2n＋1}$ 恆為 7 的倍數。（10 分）

    證：'
  answer:
  - 當 n＝1 時
  answer_status: verified
  answer_source: answer_key
  explanation: '令公比為 r

    ∵$a_{4}$＋$a_{5}$＋……＋$a_{12}$＝$a_{1}r^{3}$＋$a_{2}r^{3}$＋……＋$a_{9}r^{3}$

    ＝$r^{3}$（$a_{1}$＋$a_{2}$＋……＋$a_{9}$）

    ∴16＝$r^{3}$（－8）

    ⇒ $r^{3}$＝－2

    又 $a_{1}$＋$a_{2}$＋……＋$a_{9}$＝$\frac{a_{1}(1-r^{9})}{1-r}$＝$\frac{a_{1} 〔1-(-2)^{3}〕}{1-r}$＝$\frac{9a_{1}}{1-r}$＝－8

    ⇒ $\frac{a_{1}}{1-r}$＝－$\frac{8}{9}$

    故前 15 項和為 $a_{1}$＋$a_{2}$＋……＋$a_{15}$＝$\frac{a_{1}(1-r^{15})}{1-r}$＝$\frac{a_{1} 〔1-(-2)^{5}〕}{1-r}$＝－$\frac{8}{9}$×33＝－$\frac{88}{3}$'
- id: doc_110_台南_台南二中_數學_g10s2e1_s3_2
  section: 3
  number: 2
  type: calc
  page: 3
  stem: '所謂的虛擬貨幣是指沒有實體，以虛擬型態存在的貨幣。如各種電子遊戲內的代幣，網購商場提供的紅利代幣（如蝦幣）等，都是虛擬貨幣的一種。

    但這種傳統的虛擬貨幣有可能出現斷線回溯、駭客入侵，甚至貨幣發行者自行改變數字的狀況而影響交易的安全性及穩定度，而新興的加密貨幣即是透過「密碼學」相關技術解決了這些虛擬貨幣所隱含的安全性問題。

    然而受限於電腦演算法的問題，新興的加密貨幣不像傳統貨幣一樣可以無限印製（暫且不討論通膨問題），每款加密貨幣都有其上限存在，如最知名的比特幣至多只會有 2100 萬枚。也因為加密貨幣價格不斐又有其上限存在，就如同稀有礦產一樣，吸引不少人投資，就如同過去的掏金熱一般，因此這些製造加密貨幣的過程又被人暱稱為挖礦。

    加密貨幣製造需要大量的電腦運算，其中又以使用 GPU 演算的效率最高，也因此這幾年電腦顯示卡被大量的投資者搶購而出現了嚴重缺貨的現象（因為顯示卡的核心即是 GPU）。

    為了搶搭這股挖礦熱潮，某 A 牌顯示卡製造商統計了 5 種自家品牌的顯示卡的銷售價格與今年的銷售數量如下表，試求：

    | 銷售金額 x（千元） | 11 | 12 | 10 | 9 | 8 |

    | --- | --- | --- | --- | --- | --- |

    | 銷售數量 y（千臺） | 82 | 92 | 102 | 112 | 122 |

    (1) x 和 y 的相關係數。（6 分）

    (2) y 對 x 的迴歸直線。（3 分）'
  answer:
  - μ$_{x}$＝10，μ$_{y}$＝102
  answer_status: verified
  answer_source: answer_key
  explanation: '$a_{1}$＝$\frac{1}{3}$，$a_{2}$＝3×$\frac{1}{3}$＝1，$a_{3}$＝$\frac{1}{2}$×1＝$\frac{1}{2}$，$a_{4}$＝$\frac{1}{2}$×$\frac{1}{2}$＝$\frac{1}{4}$

    $a_{5}$＝3×$\frac{1}{4}$＝$\frac{3}{4}$，$a_{6}$＝$\frac{1}{2}$×$\frac{3}{4}$＝$\frac{3}{8}$，$a_{7}$＝3×$\frac{3}{8}$＝$\frac{9}{8}$'
