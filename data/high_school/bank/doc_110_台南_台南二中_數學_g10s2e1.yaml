    8.$S_{n}$＝$\frac{1\left[ 1-\left( \frac{1}{3} \right) ^{n} \right]}{1-\frac{1}{3}}$＝$\frac{3}{2}$－$\frac{3}{2}\left( \frac{1}{3} \right) ^{n}$

    $\left| \frac{3}{2}-S_{n} \right|$＝$\left| \frac{3}{2}\left( \frac{1}{3} \right) ^{n} \right|$＝$\frac{3}{2}\left( \frac{1}{3} \right) ^{n}$＞$\frac{1}{1000}$

    ⇒ $\frac{1}{3^{n}}$＞$\frac{1}{1500}$ ⇒ $3^{n}$＜1500 ⇒ n＜6.……

