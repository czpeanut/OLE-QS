    $4.1^{3}$－$2^{3}$＋$3^{3}$－$4^{3}$＋……＋$11^{3}$－$12^{3}$

    ＝（$1^{3}$＋$2^{3}$＋……＋$12^{3}$）－2（$2^{3}$＋$4^{3}$＋……＋$12^{3}$）

    ＝（$1^{3}$＋$2^{3}$＋……＋$12^{3}$）－2×8（$1^{3}$＋$2^{3}$＋……＋$6^{3}$）

    ＝$\left( \frac{12\times 13}{2} \right) ^{2}$－16$\left( \frac{6\times 7}{2} \right) ^{2}$＝6084－7056＝－972

    5.由題意可知$\begin{cases}\frac{-8+b}{2}=a\cdots \cdots \cdots \cdots \cdots ① \\ 64a=b^{2}\cdots \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    ①代入②得 64$\left( \frac{-8+b}{2} \right)$＝$b^{2}$ ⇒ $b^{2}$－32b＋256＝0 ⇒ （b－16）$^{2}$＝0

    故 b＝16，代回①得 a＝4，a＋b＝20

    6.令甲班學生為 $x_{1}$，$x_{2}$，……，$x_{35}$，平均為μ$_{甲}$，標準差為σ$_{甲}$

    乙班學生為 $x_{36}$，$x_{37}$，……，$x_{70}$，平均為μ$_{乙}$，標準差為σ$_{乙}$

    合併後，平均為μ$_{合}$，標準差為σ$_{合}$

    μ$_{合}$＝$\frac{\mu _{甲}\times 35+\mu _{乙}\times 35}{70}$＝$\frac{68\times 35+48\times 35}{70}$＝58

    又 $\frac{x_{1}^{2}+x_{2}^{2}+\cdots \cdots +x_{35}^{2}}{35}$－$68^{2}$＝144 ⇒ $x_{1}^{2}$＋$x_{2}^{2}$＋……＋$x_{35}^{2}$＝166880

