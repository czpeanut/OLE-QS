    9.（1＋r）$^{4}$＝（1＋44 ％）（1－91 ％）（1－50 ％）（1＋100 ％）

    ＝$\frac{144}{100}$×$\frac{9}{100}$×$\frac{50}{100}/$×$\frac{200}{100}/$

    ＝$\left( \frac{6}{10} \right) ^{4}$

    ⇒ 1＋r＝0.6 ⇒ r＝－0.4＝－40 ％

