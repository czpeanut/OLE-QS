- id: doc_110_台南_台南二中_數學_g10s2e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 若有一數列〈$a_{n}$〉的前 n 項和 $S_{n}$＝$n^{2}$－4n＋3，其中 n 為正整數，試問下列何者正確？
  options:
  - label: A
    content: $a_{1}$＝－2
  - label: B
    content: $a_{3}$＞0
  - label: C
    content: 〈$a_{n}$〉為等差數列
  - label: D
    content: 此數列從第 2 項開始大於 0
  - label: E
    content: $a_{6}$＋$a_{7}$＋$a_{8}$＞$a_{4}$＋$a_{5}$＋$a_{6}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '當 n ≥ 2 時

    $a_{n}$＝$S_{n}$－$S_{n－1}$＝（$n^{2}$－4n＋3）－〔（n－1）$^{2}$－4（n－1）＋3〕

    ＝（$n^{2}$－4n＋3）－（$n^{2}$－2n＋1－4n＋4＋3）＝2n－5

    (A) ╳：$a_{1}$＝$S_{1}$＝$1^{2}$－4×1＋3＝0

    (B) ○：$a_{3}$＝2×3－5＝1＞0

    (C) ╳：$a_{1}$＝0，$a_{2}$＝2×2－5＝－1，$a_{3}$＝1

    ∵$a_{2}$－$a_{1}$≠$a_{3}$－$a_{2}$

    ∴〈$a_{n}$〉不為等差數列

    (D) ╳：應從第 3 項開始大於 0

    (E) ○：∵$a_{6}$＋$a_{7}$＋$a_{8}$＝7＋9＋11＝27

    $a_{4}$＋$a_{5}$＋$a_{6}$＝3＋5＋7＝15

    ∴$a_{6}$＋$a_{7}$＋$a_{8}$＞$a_{4}$＋$a_{5}$＋$a_{6}$

    故選(B)(E)'
- id: doc_110_台南_台南二中_數學_g10s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 某班有 35 名學生，已知某次考試成績全班的平均分數為 40 分，最高分為 86 分，最低分為 16 分。欲將全班學生成績做線性調整使得最高分為 90 分及最低分為 30 分。請選出正確的選項。
  options:
  - label: A
    content: 調整後分數的平均值較原始分數的平均值大
  - label: B
    content: 調整後分數的中位數和原始分數的中位數一樣
  - label: C
    content: 調整後分數的中位數較原始分數的中位數大
  - label: D
    content: 調整後分數的標準差和原始分數的標準差一樣
  - label: E
    content: 調整後分數的標準差較原始分數的標準差大
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '令 y＝ax＋b，其中原分數為 x 分，調整後分數為 y 分

    且（x，y）＝（16，30），（86，90）代入得

    $\begin{cases}30=16a+b \\ 90=86a+b\end{cases}$⇒ a＝$\frac{6}{7}$，b＝$\frac{114}{7}$

    故 y＝$\frac{6}{7}$x＋$\frac{114}{7}$

    (A) ○：調整後平均為 y＝$\frac{6}{7}$×40＋$\frac{114}{7}$＝$\frac{354}{7}$＞40

    (B) ╳ (C) ○：計算 $\frac{6}{7}$x＋$\frac{114}{7}$＞x ⇒ x＜114

    即所有人分數調整後都會增加，中位數亦然

    (D)(E) ╳：∵線性調整為 y＝$\frac{6}{7}$x＋$\frac{114}{7}$ ∴σ$_{y}$＝$\frac{6}{7}$σ$_{x}$＜σ$_{x}$

    故選(A)(C)'
