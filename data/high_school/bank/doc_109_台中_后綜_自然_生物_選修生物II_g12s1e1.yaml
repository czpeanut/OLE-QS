  number: 20
  type: multiple
  page: 2
  stem: 有關植物對環境刺激的反應，下列哪些正確？
  options:
  - label: A
    content: 萵苣的種子接受紅光照射後，$P_{fr}$會增加而促進種子萌發
  - label: B
    content: 耐低溫植物細胞膜的飽和脂肪酸量較高
  - label: C
    content: 藤蔓莖接觸木桿面的細胞會生長較慢而造成纏繞現象
  - label: D
    content: 葉會感受水份逆境而合成茉莉酸以促進氣孔關閉
  - label: E
    content: 植物在缺氧時會促進乙烯的合成，造成細胞死亡以形成空氣通道
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
