- id: doc_109_台中_后綜_自然_生物_選修生物II_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 目前已知會受光照直接或間接活化的暗反應酵素共有種？
  options:
  - label: A
    content: 1種
  - label: B
    content: 2種
  - label: C
    content: 4種
  - label: D
    content: 5種
  group_stem: 綠色植物進行光合作用的過程常被區分為「光反應」和「暗反應」二個階段。暗反應中固定二氧化碳的步驟是由簡稱Rubisco的酵素負責催化進行，該酵素的活性會受到多重因子的調控。有研究結果顯示，葉綠體基內氫離子濃度降低與鎂離子濃度提昇，有利於其酵素活性的表現；再者，光照可增進「Rubisco活化酵素」（Rubisco activase）的活性，以提昇Rubisco酵素的活性。此外，也有報導指出，在黑暗中，葉肉細胞持續生成Rubisco的抑制分子，但在光照件下，該抑制分子會分解而失去其作用。除了Rubisco之外，目前已知至少還有其他4種參與暗反應的酵素也需要照光才能被活化。因此，光合作用的暗反應不僅需要利用光反應的產物，同時也需要光照以活化多種參與其反應的酵素，所以，光合作用「暗反應」的進行共不是完全與光照無關。根據上文，回答下列問題：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
