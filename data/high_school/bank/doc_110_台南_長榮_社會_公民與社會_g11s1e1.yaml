  stem: 請依據上述資料推論，下列敘述何者正確？
  options:
  - label: A
    content: 農村社會時的臺灣，創造了臺灣極高的GDP成長
  - label: B
    content: 專業分工後的臺灣社會，每家公司皆可獨立生產完整的最終產品
  - label: C
    content: 只有工業能夠專業分工，服務業的社會若專業分工，會因效率降低而無法生存
  - label: D
    content: 臺灣手機賣不好的原因，可能來自於手機設計與客戶應對的工作，都落在工程師的身上
  group_stem: (一)臺灣的GDP在過去是很高的，尤其是進入工業化社會後GDP提升不少，可近來經濟成長率一度下修到2%，引起了政府的重視。當時人均GDP是22,000～23,000美元，但臺灣卻面臨人均GDP成長停滯。有學者探討停滯的原因，可能是因為專業分工的轉變。過去臺灣從農業到工業，農村的人口進入都市，使分工更精細，讓大家找到了自己擅長的工作，工人的工作效率也隨之提升，創造了許多的經濟奇蹟。但近年來，當我們的社會進入服務業後，卻發現專業分工愈來愈不明顯，例如：去銀行時保全人員會幫你抽號碼牌；本土手機賣不好的原因可能是工程師除了設計手機外，還須考慮到客戶使用介面的問題，但這對專門製造手機的工程師來說，並非他們的專業。
