  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 袋中有3個相同紅球、4個相同白球，今自袋中隨機取球，且每球被取到的機率一樣，則下列敘述何者正確？
  options:
  - label: A
    content: 只取一球，取到的是紅球的機率為$\frac{1}{2}$
  - label: B
    content: 一次取兩球，只取一次，恰為一紅球一白球的機率為$\frac{2}{7}$
  - label: C
    content: 一次取一球，取後放回，共取兩次，恰為一紅球一白球的機率為$\frac{12}{49}$
  - label: D
    content: 一次取一球，取後不放回，共取兩次，恰為一紅球一白球的機率為$\frac{2}{7}$
  - label: E
    content: 一次取一球，取後不放回，直到所有球都取完，則第五次取到的是白球的機率為$\frac{4}{7}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
