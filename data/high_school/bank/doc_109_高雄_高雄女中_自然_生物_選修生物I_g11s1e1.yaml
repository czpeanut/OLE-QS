  - label: A
    content: 核酸可以控制細胞中蛋白質的合成
  - label: B
    content: 蛋白質為一種可同時具有正、負電荷的兩性化合物
  - label: C
    content: 胞器具含有脂質的膜
  - label: D
    content: 水可解離為$H^{＋}$和$OH^{－}$
