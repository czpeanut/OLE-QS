  stem: 真核細胞中染色體為線狀，在染色體的末端有一種特殊的序列稱為端粒。細胞分裂次數愈多，端粒序列會越來越短，藉此限制細胞的分裂次數。細胞中具有端粒酶，可修補逐漸縮短的端粒，癌細胞中端粒酶的活性特別高，試問此現象造成癌細胞的何種特徵？
  options:
