- id: doc_109_高雄_高雄女中_自然_生物_選修生物I_g11s1e1_s4_32
  section: 4
  number: 32
  type: single
  page: 5
  stem: 在細胞生物實驗中，常常會加入Tunicamycin或Thapsigargin等藥物，刺激細胞凋亡的發生。其作用原理為：讓蛋白質的醣基化異常或折疊錯誤不正常，一旦異常結構的蛋白質累積過多，便會引發細胞凋亡。根據其原理，Tunicamycin或Thapsigargin最可能作用於下列何處？
  options:
  - label: A
    content: 細胞骨架
  - label: B
    content: 粗糙內質網
  - label: C
    content: 平滑內質網
  - label: D
    content: 溶體
  group_stem: 【短文一】 細胞凋亡是一種計畫性的細胞死亡，是細胞主動進行的反應。在動植物器官的發育分化過程中，細胞凋亡可以移除一些不必要的細胞，例如：蝌蚪變態成青蛙時，尾巴的消失便與細胞凋亡有關。 在生物體內，細胞凋亡的調控可經由兩種方式來進行調控：外始途徑跟內始途徑。外始途徑是指細胞接受到外來的訊息時，啟動一系列細胞凋亡的過程。最典型的例子是，當胞毒T細胞辨識與目標細胞膜上的抗原結合時，胞毒T細胞會釋放特定的訊息分子，促使目標細胞進行細胞凋亡，以達到清除目標細胞的效果。 另一方面，內始途徑則發生於細胞受到造成其DNA受損的刺激，例如生長因子缺乏、病毒感染、紫外光照射與累積過多的結構異常蛋白質等。DNA受損的訊號會激發p53蛋白的活性，p53蛋白的一系列反應會拭圖修復受損的DNA，若損害程度嚴重到無法恢復，則p53蛋白也會引發細胞凋亡。
