- id: doc_109_高雄_高雄女中_自然_生物_選修生物I_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 細胞內的許多化學反應可以同時進行而互不干擾，尤其是真核細胞有更多的空間。這一情形與下列何者有關？
