  stem: 癌細胞與一般正常細胞的不同之處，除了其快速的生長與分裂能力外，還有無法輕易發生細胞凋亡的特性。根據前述細胞凋亡的特性和你所知，以下哪些選項可能是癌細胞不容易死亡的原因？（多選）
