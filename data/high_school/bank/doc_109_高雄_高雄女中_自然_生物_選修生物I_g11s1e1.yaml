  stem: 根據結果推論，何種藥是最有效的抑制劑？
  options:
  - label: A
    content: 化合物一
  - label: B
    content: 化合物三
  - label: C
    content: 化合物四
  - label: D
    content: 化合物五
  group_stem: '【短文二】 細胞在飢餓、缺氧、化療和氧化壓力等情況下誘導細胞自噬，在這一過程中，自噬體的形成是關鍵步驟。根據自噬體形成的膜的來源，包含物被轉運到溶體內的途徑有所不同，依此將自噬過程大致劃分成三種主要類型：一、Macroautophagy：其膜的來源主要是內質網和高基體內質網的單層膜凹陷，所形成杯狀結構的雙層分隔膜，之後完全將待降解物包覆形成負噬體，進而與溶體膜相互融合形成自噬溶體，自噬體包裹的待降解物被溶體酶所降解。二、Microautophagy：溶體膜直接包裹待降解物，並在溶體內進行消化。三、Chaperone-mediated autophagt (CMA)：chaperone首先結合到待降解蛋白上，引導待降解物運送到溶體，經酵素作用後而被消化分解。此過程可以使細胞質中的某些生物大分子、受損胞器、及某些發生錯誤折疊的蛋白質分解、回收、再利用，因為如此，自噬對細胞的穩定性扮演著重要的腳色，在疾病與老化過程中，自噬作用貢獻了很大的比例。 根據目前研究發現半胱胺酸蛋白酶（ATG4 B）在細胞自噬過程（autophagy）中扮演關鍵角色，其切割一種稱為LC3的蛋白，移去C-端的四個氨基酸後，剩下的蛋白稱為LC3-1，此LC3-1被磷脂醯乙醇胺（phosphatidylethanolamine）修飾後會形成細胞自噬體（autophagosome）外殼的一部分，進而促進細胞自噬。近來實驗證明在癌細胞中抑制ATG4 B的表現會大大減緩癌細胞的發展，但在小鼠中剔除ATG4 B的基因後卻不會造成小鼠有明顯的表型改變（如：體重，活動力及壽命，這讓ATG4 B被認為是相當具有潛力的抗癌標的分子。 在ATG4 B的蛋白結構被科學家解出後，研究員在電腦上透過分子對接及模擬軟體設計出了數種ATG4 B活性位的抑制劑（小分子藥物）後，再進行生化實驗來驗證這些藥是否有效。 在生物科技上。科學家常利用免疫的專一性來進行檢測，原理為將待測物視為抗原，並針對此抗原設計特定的抗體來檢測是否有該待測物存在。故甲研究員先將LC3蛋白質利用分子生物技術的方法在C端接上S-tag抗體的抗原後，形成LC3-chimera，所以當ATG4 B切割LC3-chimera後，會使得S-tag抗體的抗原被切掉（圖一）。接著利用西方墨點法去去分析定量，此墨點可用影像軟體分析密度，墨點越濃則代表該處帶著S-tag的蛋白越多（圖二、圖三）。好的抑制劑將使得ATG4
    B無法好好切割LC3。

    圖一 研究員給定三種實驗條件： 正控制組：反應溶液中有ATG4 B和LC3，但沒有任何抑制劑。 負控制組：反應溶液中僅有LC3。 抑制劑添加組：反應溶液中有ATG4 B-LC3及六種抑制劑（化合物一～六）。

    圖二 圖三'
