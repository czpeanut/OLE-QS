- id: doc_110_台中_台中二中_數學_g10s2e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 數學家發現一種新的可以無縫密舖平面的凸五邊形 ABCDE，其示意圖如右。關於這五邊形，試選出所有正確的選項。
  options:
  - label: A
    content: $\overline{AD} =2\sqrt{2}$
  - label: B
    content: ∠DAB＝45°
  - label: C
    content: $\overline{BD} =2\sqrt{6}$
  - label: D
    content: ∠ABD＝45°
  - label: E
    content: △BCD 的面積為$2\sqrt{2}$
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_110_台中_台中二中_數學_g10s2e3/s2_1_f1.png
    crop:
      page: 1
      rect:
      - 436.4
      - 444.0
      - 564.3
      - 514.4
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：在△ADE 中，$\overline{AD}$＝$\sqrt{\overline{DE}^{2}+\overline{EA}^{2}}=2\sqrt{2}$

    (B) ╳：∠DAB＝105°－∠DAE＝105°－45°＝60°

    (C) ╳：在△DAB 中，由餘弦定理得

    $\overline{BD}$＝$\sqrt{\overline{DA}^{2}+\overline{BA}^{2}-2\times \overline{DA}\times \overline{BA}\times \cos \angle DAB}$

    ＝$\sqrt{(2\sqrt{2} )^{2}+(\sqrt{6} +\sqrt{2} )^{2}-2\times (2\sqrt{2} )\times (\sqrt{6} +\sqrt{2} )\times \cos 60^{^{\circ}}}$

    ＝$\sqrt{8+(8+4\sqrt{3} )-(4\sqrt{3} +4)} =\sqrt{12} =2\sqrt{3}$

    (D) ○：在△DAB 中，由正弦定理得

    $\frac{\overline{AD}}{\sin \angle ABD}=\frac{\overline{BD}}{\sin \angle DAB}\Rightarrow \frac{2\sqrt{2}}{\sin \angle ABD}=\frac{2\sqrt{3}}{\sin 60^{^{\circ}}}\Rightarrow \frac{2\sqrt{2}}{\sin \angle ABD}=\frac{2\sqrt{3}}{\frac{\sqrt{3}}{2}}$

    ⇒ sin∠ABD＝$\frac{\sqrt{2}}{2}$ ⇒ ∠ABD＝45° 或 135°（不合）

    (E) ╳：$\overline{CD}^{2}$＝$\overline{CB}^{2}$＋$\overline{BD}^{2}$ ⇒ ∠DBC＝90°

    ∴△BCD 面積為$\frac{1}{2}\overline{CB}$×$\overline{BD}$＝$\frac{1}{2}\times 2\times 2\sqrt{3} =2\sqrt{3}$

    故選(A)(D)'
  tags:
    unit:
      code: MA-2-4-3
      book: 數學2（必修）
      chapter: 三角比
      title: 三角比的性質
      std: true
    textbook: 數學2（必修） 三角比的性質
    pattern:
      key: MA-2-4-3:T02
