  type: fill
  page: 2
  stem: 袋子內有大小相同的 6 顆白球與 2 顆紅球，從中隨機取 3 球，求取到紅球顆數的期望值為 ＿＿＿＿顆。
  answer:
  - $\frac{3}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: '取到紅球顆數的期望值為

    $0\times \frac{C_{3}^{6}}{C_{3}^{8}}+1\times \frac{C_{1}^{2}C_{2}^{6}}{C_{3}^{8}}+2\times \frac{C_{2}^{2}C_{1}^{6}}{C_{3}^{8}}$

    ＝$0\times \frac{20}{56}+1\times \frac{30}{56}+2\times \frac{6}{56}$

    ＝$\frac{42}{56}=\frac{3}{4}$（顆）'
