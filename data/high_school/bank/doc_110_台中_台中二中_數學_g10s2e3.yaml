  stem: 某電視臺舉辦抽獎遊戲，現場準備的抽獎箱裡放置了三顆分別標有 900、360、0 的球，假設每顆球被抽到的機會均相等。參加者隨機從抽獎箱裡摸取一球（取後即放回），主辦單位即贈送與此球上數字等額的獎金，並規定抽到 0 元的人可再抽一次，但是所得獎金折半 （若再抽到 0 元就沒有第三次機會），試求一個參加者可得獎金的期望值為＿＿＿＿元。
