- id: doc_113_屏東_屏東高中_社會_歷史_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 美國於 1776 年獨立建國時，以十三個殖民地為基礎，建立邦聯制度，但在 1783 年獨立戰爭結束後，美國內部面臨邦聯制度的弊端，如各州擁有高度的自治權、邦聯政府無法對各州課徵稅賦等，因此出現建立新政治體制的聲音。後於 1787 年的制憲會議中，美國成立聯邦政府、確立三權分立的總統制。請問下列敘述何者正確？
  options:
  - label: A
    content: 美國發動獨立戰爭是為脫離法國的統治
  - label: B
    content: 因邦聯政府對各州課予重稅，導致政治體制的改革
  - label: C
    content: 美國的三權分立為行政權、立法權、外交權
  - label: D
    content: 美國的三權分立源自於孟德斯鳩的思想
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)脫離英國。(B)邦聯政府無法對各州課徵稅賦。(C)外交權宜改為司法權。

    4.19 世紀初曾主編法典並將歐洲「踩在腳下」的政治人物為(B)拿破崙。(A)(C)(D)並未頒布以自己名字命名的法典，且未被放逐。

    5.題文指出，英國於 1858 年征服卡里姆的家鄉，並引入一套形式上具備議會制度，實際上卻缺乏監督功能、人民也無參政權的體制，與當時英屬印度的情況相符。當年，在平定傭兵叛變後，英國政府廢除東印度公司，改由英國女王直接統治印度，開啟「英王直轄印度時期」。雖然之後設立了立法機構，但實權仍掌握在殖民當局手中，當地人民的政治參與極為有限，故選(B)。(A)法國的殖民地。(C)葡萄牙的殖民地。(D)荷蘭的殖民地。

    6.此種 19 世紀歐洲運輸革命能進入「未曾開發地區」，並使工業革命成果得以擴大，因此為鐵路的興起，故選(C)。(A) 20 世紀前期汽車才量產。(B)過去已有運河的開通，並非工業革命的成果。(D)輪船亦是交通革命之一，但主要在洲際之間移動的貢獻，無法深入未曾開發地區。

    7.在法國大革命爆發之初，領導革命並發表《人權與公民權宣言》的是(B)國民會議時期。

    8.從「照常守戒，不吃東西」可知是齋戒月，屬於伊斯蘭五功中的(B)齋功。

    9.題文所述為(B)法國大革命前的社會景象，當時法國社會階級分明，教士與貴族享有各種特權，國家稅賦重擔全落在第三階級肩上，成為大革命爆發的重要背景之一。

    10.資料一的阿克拜行宗教寬容政策，資料二的奧蘭澤的宗教政策明顯嚴格，故選(C)。(A)資料一顯示阿克拜行宗教寬容，並非「一手拿《古蘭經》，一手拿劍」。(B)「吉哈德」意指奮鬥，但資料二反映的是宗教政策，非武力聖戰的實踐。(D)融合文化特色為伊斯蘭文明的一面，但與兩則資料的對比主旨無關，無法直接歸納出此一概念。

    11.從泰姬馬哈陵的外觀可以發現波斯文化的建築元素，可見蒙兀兒帝國融合了印度、伊斯蘭與波斯等不同的文化特色，(A)為正解。(B)伊斯蘭文化源於阿拉伯半島，並非本來就包含了波斯文化。(C)文化融合與是否為「虔誠的穆斯林」無關。(D)伊斯蘭教義有嚴謹的規定，但不妨礙不同的文化融合。

    12.吉卜林的《白種人的負擔》鼓勵白種人到世界各地去發展，去「服務」與「伺候」那些奴隸、野蠻的人們，反映出(C)帝國主義的侵略思想。

    13.阿拉伯人的天文學知識豐富，並已發明觀察星象的星盤，此在羅盤發明前是重要的指示方向儀器，主要用於沙漠行走與(D)航海。

    14.(A)中南美洲的獨立運動主要由土生白人所領導，並非當地官員；(B)美國的《門羅宣言》使中南美洲的獨立事實更為確立與鞏固。(D)獨立之後各國長期被土生白人的獨裁政權所控制。

    15.漫畫顯示資本家吸吮著所有勞工、童工的血汗，反映出(A)工業革命後的勞資對立情形。

    16.題文中的「我」為「尋找基督徒和香料」而來到世界的另一邊，加上遇到會使用卡斯提爾語的人，因此可判斷是大航海時代的伊比利半島人士，最可能的答案為(B)。(A)蒙古人經由陸路到東歐。(C) 17 世紀到西非的英國人不會對說卡斯提爾語人的人感到驚訝。(D) 19 世紀美國人到菲律賓是屬於殖民擴張，非以尋找香料或基督徒為主。

    17.11 世紀末教宗號召基督徒加入的「聖戰」，指的是(D)十字軍運動。(A)宗教改革發生於 16 世紀。(B)伊比利半島的「收復失地運動」自 8 世紀起。(C)阿拔斯王朝於 8 世紀建立，未在 11 世紀末入侵耶路撒冷，當時實際控制當地的是塞爾柱土耳其人，選項與題文內容不符。

    18.(A)麥加的當權者與權貴忌恨穆罕默德。(B)西元 622 年離開麥加逃至麥地那，才是伊斯蘭曆的元年。(D)此時伊斯蘭教才剛剛發展，並非亞洲、非洲的主流信仰。

    19.題文所述的歷史文件為 1823 年美國門羅總統所發表的《門羅宣言》，旨在警告歐陸國家勿出兵干預中南美洲國家的獨立運動，答案為(B)。

    20.從「中央直轄地方省區、由中央管理稅收」政策，可知這位君主實施中央集權制度。阿克拜於 16 世紀中葉在位，是蒙兀兒帝國的奠基與改革者之一，他將地方省區納入中央稅收與行政體系，有效削弱地方貴族勢力，並推動宗教寬容政策，因此正確答案為(B)。

    21.圖中蟒蛇象徵比利時對剛果人民的壓迫與控制，橡膠圈代表剛果被迫生產橡膠的沉重枷鎖。人民被纏繞、難以掙脫，象徵他們在殖民暴力與經濟剝削下的無助與苦難，故選(B)。

    22.(A)差異與該地的傳統文化深厚有關。(B)傳統文化較深厚的地區採取間接統治。(C)利用印度貴族治理傳統文化較深厚的地區。

    23.伊斯蘭勢力的武力擴張未及於中國、印尼群島、馬來半島、菲律賓群島等地，當地的伊斯蘭教傳播主要是透過(B)商業貿易。

    24.(A)兩者都贊成政教合一。(B)前者都贊成「吉哈德」。(C)前者主張哈里發由先知家系繼承，後者主張哈里發由選舉方式產生。

    25.「百年翻譯運動」是阿拔斯王朝君王所推行的學術活動，並在首都巴格達設立「智慧宮」作為學術研究中心，因此答案為(C)伊斯蘭帝國。

    26.鄂圖曼帝國曾經擴張為橫跨三洲的大帝國，但於 1683 年的(A)維也納戰役失敗後，結束帝國在歐洲的擴張，從此國力逐漸衰敗。

    27.聖索菲亞大教堂原是 6 世紀查士丁尼所興建，但在 15 世紀拜占庭帝國為鄂圖曼土耳其人滅亡後，教堂改建為清真寺，因此出現四座尖塔，故選(B)。

    28.(A) 1532 年的美洲殖民者為西、葡等國。(B)當時的「大陸」是指中南美洲。(D)「歐洲」宜改為「美洲」。

    29.1492 年，西班牙王國征服伊比利半島最後一個伊斯蘭政權──格拉那達，自 8 世紀以來的「(C)收復失地運動」宣告結束。(A) 11 世紀末。(B) 13 世紀初。(D) 7 世紀。

    30.從資料二阿里家族的追隨者，主張只有阿里及其直系後裔能成為哈里發，可推知影響伊斯蘭政權穩定的問題為(C)繼承人的產生方式。

    31.題文描述的是阿茲特克人將西班牙征服者誤認為是羽蛇神重返。根據傳說，羽蛇神會從東方重返阿茲特克，剛好與西班牙人從東方登陸的方向相符，加上西班牙人騎馬、穿盔甲，與當地文化形象中的神祇有部分相似，這一誤認削弱了阿茲特克的抵抗意志，加速帝國的滅亡，故選(C)。

    32.16 世紀掌握東西方貿易路線的大帝國為(B)鄂圖曼帝國，阻礙西歐往地中海拓展經濟商路，促使歐洲諸國另尋前往東方的新航路。(A)西元前 4 世紀的帝國。(C)統治印度、(D)位於日耳曼地區，兩者並未掌握東西方的貿易路線。

    33.(A)好望角為狄亞斯所發現，甲航線是葡萄牙人達伽馬發現往印度的新航路。(C)甲路線為葡萄牙王室贊助。(D)中南美洲古文明並非哥倫布率軍消滅。

    34.1492 年為哥倫布「發現」新大陸，為歐洲人開啟了殖民美洲的大門，也是美洲原住民受難的開始，故選(A)。

    35.漫畫顯示柏林西非會議實為一場列強對非洲的瓜分會議，拿刀的國家是召開柏林西非會議的(C)德意志帝國首相俾斯麥。'
