- id: doc_113_屏東_屏東高中_社會_歷史_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小說家皮考克在《米運考特》中描述的荒謬現象：「有一個一票城，其中只有一個選民，卻有兩個議員席次，除選民外另一個議員就是他所飼養的猩猩了。這個選民還為猩猩捐了個爵位。」下列關於這個荒謬現象的敘述，何者正確？
  options:
  - label: A
    content: 這是寓言故事，並非事實
  - label: B
    content: 諷刺英國 19 世紀初期工人地位提升的現象
  - label: C
    content: 呈現了 19 世紀中期新興工業城市衰亡的過程
  - label: D
    content: 受工業革命影響，使經濟社會快速變遷，而有題幹所述的情形發生
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 小說中描述的荒謬現象，點出這個一票城為衰廢市鎮。在工業革命前劃定的選區，人口結構變動後仍擁有不成比例的議會代表席次。例如一些原本繁榮但後來沒落的村鎮，因人口遷移或經濟衰退，實際上居民極少，卻仍擁有兩席議員，有的甚至只有「一人選民」。而新興工業城市卻無法獲得應有的政治代表權。這樣的政治不公正，導致廣泛批評與改革呼聲，因此答案為(D)。
