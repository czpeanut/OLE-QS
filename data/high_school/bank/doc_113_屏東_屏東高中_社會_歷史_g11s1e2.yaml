  stem: 美國獨立戰爭期間出現《常識》一書，全書僅有五十頁，卻精闢地分析了北美殖民地應當獨立的理由，重要理念為人民自治是一件再普通不過的「常識」，鼓勵北美人民對抗殖民母國。請問該書為何人書寫？
  options:
  - label: A
    content: 潘恩
  - label: B
    content: 洛克
  - label: C
    content: 亞當斯密
  - label: D
    content: 華盛頓
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 《常識》的作為是(A)潘恩，鼓舞北美殖民地人民脫離英國獨立。
  tags:
