  stem: 經濟史家考察 19 世紀歐洲運輸革命與工業革命的關聯，指出：「這種運輸設施」的推展，使先前未曾開發地區捲入世界經濟活動內，更因其克服運輸量、畜力、季節及移動速度等限制，工業革命成果得以擴大。因此，此一交通革新「不但是運輸革命的完成，而且也是工業革命的完成」。這位史家所說的「這種運輸設施」，最可能是指
