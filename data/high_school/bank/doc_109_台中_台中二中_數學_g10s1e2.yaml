  stem: 下列哪一個函數圖形經過適當的平移後會跟 f（x）＝$3x^{3}$＋$9x^{2}$＋10x＋9 的圖形完全重合？
  options:
  - label: A
    content: y＝$2x^{3}$＋$8x^{2}$＋9x＋8
  - label: B
    content: y＝－$3x^{3}$－$9x^{2}$－10x－9
  - label: C
    content: y＝$3x^{3}$－$18x^{2}$＋37x－10
  - label: D
    content: y＝$3x^{3}$－$9x^{2}$＋11x
  explanation: 'f（x）＝$3x^{3}$＋$9x^{2}$＋10x＋9＝3（$x^{3}$＋$3x^{2}$＋3x＋1）＋x＋6

    ＝3（x＋1）$^{3}$＋（x＋1）＋5

    (A)╳：平移不會改變 $x^{3}$ 項係數

    (B)╳：同上

    (C)○：y＝$3x^{3}$－$18x^{2}$＋37x－10＝3（$x^{3}$－$6x^{2}$＋12x－8）＋x＋14

    ＝3（x－2）$^{3}$＋（x－2）＋16

    可由 y＝f（x）向右平移 3 單位，再向上平移 11 單位而得

    (D)╳：y＝$3x^{3}$－$9x^{2}$＋11x＝3（$x^{3}$－$3x^{2}$＋3x－1）＋2x＋3

    ＝3（x－1）$^{3}$＋2（x－1）＋5

    （x－1）項的係數和 f（x）中的（x＋1）項係數是不同的，平移不會造成係數改變

    故選(C)'
