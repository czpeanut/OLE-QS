  stem: 全球暖化對世界各地的糧食生產產生不同的影響，除氣溫及降水型態改變之外，也對各地農業的發展條件、農作物的生長規律及產出有不同程度的影響。全球暖化之下，下列農業生產地區之糧食生產變化何者正確？
  options:
  - label: A
    content: 美國阿拉斯加玉米種植面積減少
  - label: B
    content: 加拿大小麥種植範圍向南擴展
  - label: C
    content: 日本北海道稻米生產地區縮小
  - label: D
    content: 孟加拉稻米產量減少
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 全球暖化將使高緯區積溫增加，農作物生長期變長，原本寒冷無法耕作的土地也得以耕作，故(A)為面積增加。(B)為向北擴展。(C)為稻米生產面積擴大。(D)熱帶地區則因極端高溫、乾旱、洪患等異常天候，造成農業損失。
