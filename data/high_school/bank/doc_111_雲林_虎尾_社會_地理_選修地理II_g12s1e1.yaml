  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 水庫的壩體、蓄水區、攔沙壩等工程，易使(甲)水庫以上河段堆積增加，因此下游泥沙減少，出海口隨之供沙量減少，造成海岸或三角洲後退；(丁)水庫可調節水量，蓄洪功能，水患發生機率減少。
