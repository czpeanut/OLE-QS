- id: doc_111_雲林_虎尾_社會_地理_選修地理II_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 《京都議定書》的精神為全球減碳，簽約各國依此基準及國情訂定減碳目標，下列推論何者最適當？
  options:
  - label: A
    content: 排放量刪減比例愈多的國家，愈加使用化石燃料
  - label: B
    content: 排放量刪減比例愈少的國家，愈重視生態環境的維護
  - label: C
    content: 排放量與目標排放量相近的國家，經濟發展出現停滯狀態
  - label: D
    content: 排放量較目標排放量低的國家，有多餘的碳排放權可以出售
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 排放量刪減比例高的國家為經濟發達的已開發國家，主要是因工業發展與生活水準高，對化石能源的使用需求大，許多國家（如歐洲各國）也致力發展替代能源，如再生能源等比例逐漸上升，甚至超過化石燃料，經濟發展並未因此出現停滯現象。排放量刪減少的國家主要為開發中國家。故(A)(B)(C)選項推論並不正確。而(D)選項符合碳權交易的概念。
