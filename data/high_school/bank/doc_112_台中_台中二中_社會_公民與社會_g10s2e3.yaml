  stem: 志明與春嬌共同擁有一間店面並經營機車行，由於生意強強滾，以致店面不敷使用，遂將機車停放在騎樓展示。由於此舉影響行人路權，因此被檢舉達人告發後遭開單取締。志明與春嬌不服檢舉，主張店面和騎樓的所有權都是他們兩人的，故可自行決定如何使用。關於上述情況，依據我國《民法》的相關規定及基本原則，下列敘述何者正確？
