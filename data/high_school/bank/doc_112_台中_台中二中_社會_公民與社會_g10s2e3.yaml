        - 182.6
        - 566.05
        - 353.6
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 物權優先於債權是指同一個標的物上，如果有物權與債權並存時，無論物權成立於債權之前還是成立於債權之後，物權均有優先於債權實現的效力，因此所有權已登記移轉給莎莉曼夫人，荒野女巫的債權即無法實現，故答案為(C)。
