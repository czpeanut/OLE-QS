  stem: 兩津員警在嫌犯騎車逃逸的過程中，想要彎道超車以追捕該名現行犯，警用摩托車卻不慎彎道翻車，犯嫌因此被撞到翻車而受傷被捕。嫌犯被捕後委任律師對兩津員警提起「普通傷害罪」及「過失傷害罪」之告訴，但檢察官偵查終結後，做出「不起訴」處分。請問針對此案，下列何者「最可能」是檢察官未提起公訴的理由？
  options:
  - label: A
    content: 檢察官隸屬於法務部，難免承受上級壓力
  - label: B
    content: 兩津的行為不符合犯罪的構成要件該當性
  - label: C
    content: 兩津所為是依法令之行為，可以阻卻違法
  - label: D
    content: 兩津所為非出於故意，不具犯罪責任條件
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)檢察官雖隸屬於法務部，仍依法偵查。(B)兩津的行為符合犯罪的客觀構成要件，具有該當性。(C)兩津為員警，屬於公務員，追捕犯人過程中造成嫌犯受傷，但依法令之行為，符合阻卻違法事由，故最可能是其不起訴的理由。(D)雖非故意但屬於過失，符合犯罪責任條件。
