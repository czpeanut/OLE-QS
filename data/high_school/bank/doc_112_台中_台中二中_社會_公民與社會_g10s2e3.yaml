  type: multiple
  page: 9
  stem: 野蠻公主考慮是否和 Toys 離婚之際，開始研究《民法》的相關規定。請問有關我國《民法》的財產權規範與夫妻的「法定財產制」，以下敘述何者正確？
  options:
  - label: A
    content: Toys 債務纏身，我國採共同財產制，唯有離婚才可以免除連帶責任，避免夫債妻還
  - label: B
    content: 物權具有排他性，兩人離婚後，七期豪宅所有權只能歸屬其中一方，無法共同持有
  - label: C
    content: 兩人若是離婚，婚後財產應進行剩餘財產差額分配，野蠻公主反而要給 Toys 錢並不划算
  - label: D
    content: 兩人若是離婚，因為 Toys 的婚後工作所得較多，進行財產分配時對野蠻公主較有利
  - label: E
    content: 婚姻關係存續時，我國採分別財產制，Toys 無論婚前或婚後的債務，皆與配偶無涉
  group_stem: '職棒明星球員 Toys 結婚之前靠著運動選手的高額簽約金、薪資、獎金及代言活動賺進數千萬元，少年得志的他因此過著揮金如土、紙醉金迷的生活，很快就入不敷出，負債高達 500 萬元，更因生活糜爛而荒廢球技與體能，結束了職業運動生涯。為了養家餬口，Toys 開始在網路上販售大麻並經營地下簽賭網站，雖然是非法收入，但至少清償部分負債，只剩 50 萬債務尚未履行，暫時過著一段歲月靜好的生活。因此，閒暇時間 Toys 藉由過去明星球員的高知名度經營網路直播頻道，成為知名的美食 YouTuber，更因此認識網紅電競實況主「野蠻公主」進而相戀結婚，並生下一子一女、好事成雙。然而，好花不常開、好景不常在，Toys 的販毒勾當終究紙包不住火、難逃法網，判決定讞後即將入監服刑。屋漏偏逢連夜雨，Toys 又在節目直白評論網紅超哥的雞排店難吃不衛生，被惱羞成怒的超哥以超派鐵拳爆打成傷。面對接踵而至的牢獄之災與皮肉之傷，Toys 的愛妻「野蠻公主」應該高唱今宵離別後，何日君再來？還是唱著分手快樂離婚比較好呢？

    下表是 Toys 和野蠻公主夫妻兩人的資產負債表（單位：新臺幣），試回答以下問題：

    |  | Toys | 野蠻公主 |

    | --- | --- | --- |

    | 婚前財產 | 負債 50 萬元 | 存款 500 萬元 |

    | 婚後財產 | a. 工作收入 800 萬元 b. 被超派鐵拳傷害的賠償金 100 萬元 c. 販賣毒品遭法院併科罰金 500 萬元 | a. 工作收入 400 萬元 b. 繼承房地產價值 5,000 萬元 c. 節目道具及服飾市值 100 萬元 |

    |  | 兩人於婚後共同持有臺中七期豪宅一戶，市值 4,000 萬元 |  |'
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)共同財產制並非法定財產制之內容，與提問敘述不符，且共同財產制婚後財產共有，也須一起清償債務。(B)雖然一物只有一個所有權，但仍可以多人共有。(C)(D)因為 Toys 婚後尚有債務和罰金，扣除後，其婚後可分配之財產較野蠻公主少，(C)為正確敘述。(E)此題應將敘述「分別財產制」修正為「法定財產制」，才能與題文相符較無爭議。（備註：本題答案學校給(C)(E)）
