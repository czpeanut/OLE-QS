- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 強尼共和國網路上常出現虐待貓狗的影片，因手段殘忍引發輿論撻伐，並出現應立法以刑罰加以處罰之主張。有學者表示要解決此類問題，仍應以輔導行為人心理為主，刑罰不一定能嚇阻犯罪。下列何者最能說明該學者的立場？
  options:
  - label: A
    content: 刑罰應報理論
  - label: B
    content: 刑法之謙抑性
  - label: C
    content: 一般預防理論
  - label: D
    content: 刑法從輕原則
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 主張刑罰應以輔導行為人心理為主，刑罰不一定能嚇阻犯罪，可知應是主張刑法並非萬能、刑罰具有有限性，此屬於刑法謙抑的概念，故選(B)。刑法謙抑是指刑罰是抵制犯罪的最終手段；對於不法行為，僅民事賠償或行政裁罰不足以維持公平正義時，才需刑罰。
