  stem: 賈九是個 13 歲的國中生，加入白狼幫後不再去學校。某日因白狼幫與老虎堂發生糾紛，賈九為了義氣不管有沒有意義瘋狂暴打老虎堂成員，造成對方生命垂危而被警方逮捕。依據我國司法制度，以下關於本案的評論何者正確？
