  stem: 猶太教與基督教的信仰屬性，及其對「神的選民」的看法有異，以致二者常有紛爭。西元 1 世紀，猶太宗教領袖在耶路撒冷以基督教傳道者保羅褻瀆猶太教，且無法證明自己清白為由，控告保羅並要求對其處刑。當時羅馬法律規定：非經審判，羅馬公民不得被捆綁、監禁或鞭打。保羅因具有羅馬公民身分，故要求交羅馬當局處理，於是當地總督在夏季末期將保羅押送至羅馬審判。時至今日，可看出題文中羅馬法律保障羅馬公民的規定，與下列何種近代法律重要原則的精神最為接近？
