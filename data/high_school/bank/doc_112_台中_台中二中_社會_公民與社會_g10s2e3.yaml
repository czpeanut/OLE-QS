  stem: 烏龍派出所的警察兩津勘吉偕同中川與麗子警官出任務的途中，誤打誤撞的逮捕一名搶劫嫌犯；大原所長在完成相關程序後，依規定將犯嫌移送法辦。請問「移送法辦」是指後續將進行何種程序？
  options:
  - label: A
    content: 由檢察官召開偵查庭，對嫌犯偵訊
  - label: B
    content: 由法官召開羈押庭，裁定是否羈押
  - label: C
    content: 由警察進行筆錄，並告知相關權利
  - label: D
    content: 由警方押解嫌犯至看守所進行偵訊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 大原為警局所長，意味此案已在警局完成筆錄，接下來需移至檢察署由檢察官召開偵查庭，進行偵訊。而本案尚未完成偵查程序，因此無法進到審判程序，應選(A)。
