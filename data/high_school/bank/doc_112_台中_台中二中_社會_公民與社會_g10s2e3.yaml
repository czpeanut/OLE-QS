  stem: 魔法公主想要購買霍爾的一棟城堡，於是向龍貓銀行貸款兩千萬元。龍貓銀行為了確保放貸出去的資金不會變成呆帳，於是將霍爾的這一棟城堡設定「抵押權」，一旦魔法公主無法償還貸款，龍貓銀行即可請求法院強制執行。請問上述「抵押權」是屬於《民法》中的哪一種財產權？
  options:
  - label: A
    content: 物權
  - label: B
    content: 債權
