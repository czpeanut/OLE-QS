  section: 1
  number: 6
  type: single
  page: 2
  stem: 霍爾打算賣掉自己的另一棟城堡，荒野女巫搶先與霍爾締結買賣契約。莎莉曼夫人知情後，以兩倍的價金與霍爾達成交易，並完成房屋所有權移轉登記。此時，依《民法》規定，以下何者正確？
  options:
  - label: A
    content: 基於誠實信用與信賴保護原則，因荒野女巫的買賣契約成立在先，應優先取得城堡的所有權
  - label: B
    content: 所有權具有保護之絕對性，故兩份契約同時有效，荒野女巫與沙利曼夫人皆擁有城堡所有權
  - label: C
    content: 物權具有優先性，所有權既已登記移轉給莎莉曼夫人，荒野女巫已無權要求霍爾交付其城堡
  - label: D
    content: 不動產物權採登記生效主義，荒野女巫雖未取得城堡所有權，仍可向莎莉曼夫人請求違約金
    asset:
