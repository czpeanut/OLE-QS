  stem: 身為土豪哥或土豪哥那超級好野人的父母親，如果不想因為離婚或死亡後自身的龐大家產被配偶「割韭菜」，有什麼方法可以「肥水不落外人田」，避免世代累積的財富因為離婚或死亡而人財兩失？因此，假如你（妳）是土豪哥的法律顧問，你（妳）會建議土豪哥家族怎麼做？依據我國現行的法律規定，下列哪些做法是正確的？
  options:
  - label: A
    content: 把家裡財產全部登記在公婆名下，土豪哥若死掉，即使依照應繼分，媳婦也不能代位繼承
  - label: B
    content: 我國採聯合財產制，可設法積欠鉅額債務，讓配偶因為擔心要平分剩餘債務所以不敢離婚
  - label: C
    content: 預立遺囑，遺產全數指定給其他家族成員，配偶一毛錢也分不到，只能兩手空空淨身出戶
  - label: D
    content: 採取約定財產制，去法院書面登記「分別財產制」，即使離婚，也沒有剩餘財產分配的問題
  - label: E
    content: 什麼都不必做，就算土豪哥百毒不侵來得及繼承父母遺產，東吳妹也得不到土豪哥的應繼分
