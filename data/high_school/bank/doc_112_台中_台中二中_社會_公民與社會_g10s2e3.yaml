  stem: 伯虎被警方依違反《跟蹤騷擾防制法》移送法辦後，檢察官偵查終結後認定：跟蹤騷擾的行為是指以各式方法對特定人反覆或持續為違反其意願且與性或性別有關的行為，由於無法證明伯虎的跟蹤行為是「反覆」或「持續」，因此做出不起訴處分。然而，伯虎的行為仍構成《社會秩序維護法》中的「無正當理由跟追他人」而遭罰鍰處分。請問檢察官不起訴的原因主要是基於下列何項法律原則？
  options:
  - label: A
    content: 自由心證原則
  - label: B
    content: 罪疑唯輕原則
  - label: C
    content: 禁止類推適用
  - label: D
    content: 證據排除法則
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 檢察官認為伯虎之行為不構成《跟蹤騷擾防制法》之違法行為，但其行為仍構成《社會秩序維護法》中的「無正當理由跟追他人」而遭罰鍰處分，此符合(B)罪疑唯輕原則，指法官在審理案件時，一定要有充分的證據，若現有的證據不足以讓法官確信某個犯罪要件成立時，必須做出對被告有利的認定。
