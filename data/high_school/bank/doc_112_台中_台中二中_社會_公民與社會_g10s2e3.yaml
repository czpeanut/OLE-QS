  section: 1
  number: 8
  type: single
  page: 2
  stem: '依據我國《刑法》，一般對強制性交罪採「非告訴乃論」為原則，夫妻間的性侵害則屬例外情況，而以「告訴乃論」為原則。假設下表為我國法務部對於性侵案件以及定罪率（起訴或告訴案件成功定讞的比率）統計資料，據表判斷，下列敘述何者最為正確？

    |  | 全部性侵害事件合計 | 夫妻關係間的性侵事件 | 其他社會關係間的性侵事件 |

    | --- | --- | --- | --- |

    | 案件數∕案件比率 | 600 件∕100 ％ | 180 件∕30 ％ | 420 件∕70 ％ |

    | 最終定罪數∕定罪率 | 390 件∕65 ％ | 72 件∕40 ％ | 318 件∕76 ％ |'
  options:
  - label: A
    content: 全部性侵事件的定罪率不超過七成，顯示我國現行法律規定過於寬鬆
  - label: B
    content: 夫妻關係間性侵事件的定罪率較低，顯示夫妻間較不易發生性侵事件
  - label: C
    content: 其他社會關係間的性侵事件定罪率最高，是因為其犯罪舉證比較容易
  - label: D
    content: 若夫妻關係間性侵事件改為非告訴乃論，則此類性侵案件數可能增多
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)定罪需經過審判程序，講求證據，因此定罪率低，與法律規定寬鬆與否無關。(B)(D)夫妻關係性侵事件的定罪率低，並非因為不易發生性侵，而是因為夫妻間性侵屬於告訴乃論，且基於傳統家庭倫常和諧，容易撤銷告訴，故(D)為正解。(C)其他社會關係間的性侵事件為非告訴乃論之案件，因此定罪率較高。
