  stem: 伯虎在秋香家的庭院鬼鬼祟祟、東張西望，秋香發現之後叫破喉嚨喊捉賊，並聯合鄰人將伯虎制伏送交警察局。以下有關刑事法律程序的敘述，何者正確？
  options:
  - label: A
    content: 警方訊問伯虎時，他必須據實以告並有問必答
  - label: B
    content: 警察為了查明真相，在午夜仍可繼續追問伯虎
  - label: C
    content: 警察訊問伯虎時應全程錄音，以確保程序公正
  - label: D
    content: 伯虎如自認清白，就應負責舉證證明自己無罪
  answer:
