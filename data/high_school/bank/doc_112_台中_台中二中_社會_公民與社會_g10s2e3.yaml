  stem: 'Lisa 研究歐巴國的財產制度，並蒐集歐巴國某年的遺產繼承統計資料如下表。她推論造成男女數據差異的成因，除與該國傳統社會觀念有關外，與其繼承法律的規定亦有關聯。下列該國繼承制度所採取的原理原則，何者與表中數據呈現之性別差異最相關？

    | 所有法定繼承人之性別比 |  | 法定繼承人中實際取得遺產者之性別比 |  |

    | --- | --- | --- | --- |

    | 男 | 女 | 男 | 女 |

    | 64 ％ | 36 ％ | 72 ％ | 28 ％ |'
  options:
  - label: A
    content: 該國的繼承法律在繼承權利方面採取性別平權的原則
  - label: B
    content: 准許被繼承人在生前以遺囑自由處置一定範圍財產
  - label: C
    content: 以特定親屬繼承為原則，並以配偶為當然的繼承人
  - label: D
    content: 繼承人償還被繼承人的債務，以繼承所得遺產為限
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從圖表無法看出性別平權之概念。(B)法定繼承人的性別比與實際取得遺產的性別比有落差，可見被繼承人在生前可以用遺囑自由處分其財產，為正解。(C)此統計數據與配偶是否為當然繼承人無關。(D)從數據無法看出債務和遺產及限定繼承的關係。
