  stem: 上文中，公平會認為「這很明顯就是有問題」，其所指出的問題最主要為下列何者？
  options:
  - label: A
    content: 廠商的漲幅高於自身成本的增加，形同暴利行為
  - label: B
    content: 大廠的漲幅超過小廠的漲幅，令小廠無法生存
  - label: C
