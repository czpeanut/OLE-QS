- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 小麥是世界上最重要的糧食來源之一，多是磨成麵粉再加工製成麵包、麵條、速食麵等食品，然而全球暖化為小麥的生產帶來重大危機。《科學（Science）》期刊2011年的研究指出，自1980年代以來，小麥全球產量因氣候變遷減少了5.5%；《自然氣候變遷（Nature Climate Change）》期刊則在2014年指出，全球氣溫每上升1度C，小麥的產量就會減少6%，因此大眾預期小麥價格將持續上揚。請問這對當前小麥市場所產生的效果為何？
  options:
  - label: A
    content: 使供給減少、需求增加，因此價格上升
  - label: B
    content: 使供給減少、需求增加，因此交易量增加
  - label: C
    content: 使供給量減少、需求量增加，因此價格下降
  - label: D
    content: 使供給量增加、需求量減少，因此交易量減少
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 2015年，美國司法單位對多家航空公司展開調查。官員表示，這些航空公司近期一同限制航線與機位數量，並使票價維持高檔，獲利創下歷史新高，可能涉及違法的聯合行為。若從經濟學的角度來看待政府介入航空公司的「合作行為」，下列何種說法最為合理？
  options:
  - label: A
    content: 航空公司相互合作，政府無須干預，因為市場機能會使經濟福祉最大化
  - label: B
    content: 政府應遵循私法自治原則，維護航空公司的契約自由，不干涉合作行為
  - label: C
    content: 航空公司獲利增加將有害消費者，因此政府應該介人規定機票的價格與數量
  - label: D
    content: 航空公司問的合作恐會妨礙市場競爭，此時政府介入可能有助於提升經濟福祉
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 某大賣場趁著中元普渡促銷，推出衛生紙「限時」特價，1串只要30元。業者原本預計全臺銷量為3萬串，沒想到短時間內就賣了5萬串，只好缺貨不補。結果民眾大排長龍不願離去，抗議業者不補貨的行為是「限時變限量」。請問就該大賣場及消費者而言，下列何者最為正確？
  options:
  - label: A
    content: 衛生紙每串30元時，只有5萬串的需求量
  - label: B
    content: 衛生紙每串30元時，其供給量會是5萬串
  - label: C
    content: 衛生紙每串30元時，會出現2萬串的短缺
  - label: D
    content: 衛生紙每串30元時，會出現供過於求的情形
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 一般市場上瓶裝水的價格均比花生等堅果便宜，但在美國的酒吧中，一瓶500c.c.的瓶裝水售價高達5美元，花生等堅果卻免費任人取用。請問：以經濟學分析此現象最合理的解釋為何？
  options:
  - label: A
    content: 因為酒吧可以向原料廠商以低價大量購買花生等堅果，所以可免費提供堅果
  - label: B
    content: 酒吧中瓶裝水的價格愈高，酒吧的利潤就會戀多，所以將瓶裝水設定為高價
  - label: C
    content: 花生等堅果是消費者比較不喜歡吃的產品，所以酒吧就只好免費提供給顧客
  - label: D
    content: 酒吧將水定高價，是希望顧客可以增加對啤酒的需求，此時水和酒是消費上的替代品
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 小金是臺北某大學的學生，一日趕著上課，機車騎到停車場後懶得找停車位，隨意停放就離開了。下課後回到停車場，看到自己的機車輪胎被學校生輔組的大鎖鎖住。小金知道自己沒有停在格內是不對的，他只希望能趕快解鎖騎車回家。依據法律的規定，小金到生輔組後較適合以下列何種方式來主張其權利？
  options:
  - label: A
    content: 可以請求生輔組將其所有物返還
  - label: B
    content: 可以請求生輔組將妨害去除
  - label: C
    content: 可以請求生輔組防止妨害
  - label: D
    content: 主張生輔組的行為己構成刑法上的毀損罪
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 一名法國老婦人搬家時，原本打算扔掉牆上一幅長26公分、寬20公分的聖像畫，幸好他委託前來鑑定傢俱的拍賣師認為這幅畫具有價值，建議他找專家確認來歷，這才發現畫作是《受嘲弄的基督》，出自文藝復興前期義大利巨匠契馬布埃（Giovanni Cimabue）之手。於是老婦人決定將畫作拿去拍賣，原本預估可以賣到30至40萬歐元，最後在拍賣會上竟以2400萬歐元（超過新臺幣8億元）的天價成交。根據上述，下列何者正確？
  options:
  - label: A
    content: 老婦人對這幅畫作的願售價格是2,400萬歐元
  - label: B
    content: 若有人出更高價，將能增加這幅畫作的供給量
  - label: C
    content: 得標者對這幅畫的願付價格不低於2,400萬歐元
  - label: D
    content: 得標者對這幅畫的願付價格低於老婦人的願售價格
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 先前立委提案修改《學校衛生法》，規定高中以下學校全面禁止販售高鹽、高油、高脂食物及含糖飲料。立委於提案中表示，青少年面臨課業壓力，經常選擇吃東西紓壓，卻也因此造成肥胖問題，甚至提高未來罹患心血管疾病、糖尿病等風險，進而增加對全民健康保險醫療資源的負擔。下列何者最有可能是該立委提案主要的動機？
  options:
  - label: A
    content: 降低學生購買此類食物獲得的消費者剩餘
  - label: B
    content: 降低學生購買此類食物所造成的外部成本
  - label: C
    content: 降低學生購買此類食物所花費的願售價格
  - label: D
    content: 降低學生購買此類食物所花費的機會成本
