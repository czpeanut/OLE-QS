    content: 若阿任未依約將該主機交給小茵，則小茵可以逕自取走該主機
  - label: B
    content: 阿任與小茵兩個人之間只有因買賣契約而產生之債權債務關係
  - label: C
    content: 買賣契約成立後，小茵即可以本於所有權人的地位來處分該主機
  - label: D
    content: 若阿任將該主機轉賣並交付給阿寬後，小茵則無法向阿寬請求交付該主機
  - label: E
    content: 阿任將主機賣給小茵後，立即喪失該主機之所有權，不得如常使用該主機
