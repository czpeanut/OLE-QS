  stem: <u>新冠病毒肺炎疫情期間，因為怕疫情蔓延，加上各國陸續封城，幾乎所有航空公司停飛好幾個月</u>，只有一些航空公司維持零星航班將滯留國外的國民接送回國，也有些航空公司將客運轉為貨運暫時維持生計。儘管航空業者做到防疫滴水不漏，但全球疫情還沒退燒，廉價航空不敵疫情而紛紛退場；<u>而傳統航空也因為航班運載量不足，將成本反映在票價上，我國的華航、長榮航空也開始全面調整票價結構，在2020年9月起取消淡季票價，所有機票都當旺季在賣；成本較高的歐美航線甚至砍光所有的低價票，只賣最貴的票目平均票價是去年的3倍，為近10年來頭一遭。航空業者在疫情發生後，班次大減，各家幾乎維持最低運能</u>，運輪非得出國的旅客，根據交通部觀光局評估可能得等到2024年，才能恢復常態旅遊。請根據上述畫底線處所提及傳統航空機票市場的供需變化，晝出疫情期間傳統航空機票市場新的供需線，並說明由此造成的均衡價格與均衡數量之變化。
