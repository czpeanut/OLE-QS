    content: 國際間的專業分工與交易，通常不利於美國這種國民所得較高的國家
  - label: B
    content: 亞洲在醫療技術上不如美國，故將分析工作外包將有損於美國的利益
  - label: C
    content: 美國醫生在夜晚工作的機會成本，高於將工作外包給印度、澳洲的醫生
  - label: D
    content: 美國醫生將工作外包，證明印度、澳洲在分析斷層掃描上具有絕對利益
  group_stem: '分析核磁共振資料是一件複雜且困難的工作，但美國一位發明家發明了一套新儀器，讓分析變得更快速、更簡單、收費更低廉，使得醫療成本大幅降低。一時之間，各地的核磁共振資料如雪片般飛來，但無論資料有多少，這臺神奇的儀器總是能跑出正確無誤的分析結果。

    但有一天，一位記者跟蹤了這位發明家，發現了驚人的內幕：原來這神奇的儀器，不過只是一臺能夠上網、收發郵件的電腦。發明家把核磁共振資料轉發給收費很低的亞洲放射科專家，讓他們進行分析，然後自己再把這些結果轉交給客戶，所以這位發明家其實只是一位「外包商」而己。

    這讓美國人相當憤慨，當時輿論也紛紛嚴厲地抨擊這位「假」發明家，而今天，美國的許多醫生卻也將電腦斷層掃描的讀片外包給印度或澳洲的醫生，因為美國的夜晚正好是印度、澳洲的白天，這樣美國醫生一早就可以收到來自海外的分析報告，這種工作模式，和過去那位 「假」發明家的發明正好有著異曲同工之妙。請回答下列問題：'
