- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 3M的便利貼家喻戶曉，但很少人知道，發明3M便利貼的人當初本來是想發明一種超強的黏合劑，而結果卻令他大失所望，因為發明出來的黏合劑黏性不佳，貼上的東西總是能被輕易地撕開，不過他靈機一動，將他的失敗作品做成可以隨撕隨黏的便利貼，結果廣受好評，為3M公司獲得了前所未有的巨大商機。請依上文判斷，下列敘述何者正確？
  options:
  - label: A
    content: 3M公司是「產品市場」中的需求者
  - label: B
    content: 3M公司在「生產要素次市場」中販售生產要素
  - label: C
    content: 便利貼屬於3M公司生產出來的「生產要素」
  - label: D
    content: 在故事中，生產要素之一的「企業才能」是3M公司獲利的關鍵
