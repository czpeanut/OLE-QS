  type: single
  page: 1
  stem: 子強想買一支蘋果手機，他上網比價之後詢問到一支手機8,000元，但沒有任何保固，還要外加200元的運費。後來，他又在一家實體店面詢問到同款手機為10,000元，保固期限為1年。子強考慮後，決定在實體店面買下這支手機，下列關於他做選擇的理由，何者正確？
  options:
  - label: A
    content: 他買這支手機的機會成本為8,000元
  - label: B
    content: 他覺得手機保固的價值高於1,800元
  - label: C
    content: 他買到比較貴的手機是非理性的決定
  - label: D
    content: 他在實體店面買是因為機會成本較高
