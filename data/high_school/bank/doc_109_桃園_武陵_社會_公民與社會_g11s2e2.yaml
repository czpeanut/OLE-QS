- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 小華首度前往某家大賣場購物，他發現這家大賣場的附設停車場假日免費，但平日則要收費，只有購物達到一定金額時才可以折抵停車費。從上文資訊，試判斷這間大賣場最可能位於何處？
  options:
  - label: A
    content: 鄰近假日人潮眾多的景點：因停車場假日免費，以利舒緩假日遊客的停車需求
  - label: B
    content: 空曠但住戶不太多的郊區：因假日停車免費有助於提高消費者前來購物的意願 (B)每天都相當熱鬧的市中心：因收費可減少「停車但不購物」的行為並增加收入 (D)以辦公大樓為主的商業區：將平日收費作為負向誘因，以免成為上班族停車場
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 生產可能曲線通常是一條由原點向外凸出（又稱凹向原點)的曲線，而較少是一條負斜率的直線。請問：生產可能曲線由原點向外凸出或是呈一條直線的原因為何？
  options:
  - label: A
    content: 機會成本的變化與生產可能曲線之外在呈現形狀毫無任何關係
  - label: B
    content: 直線表示機會成本固定，而由原點向外凸出表示機會成本遞增
  - label: C
    content: 直線表示變動的機會成本，而由原點向外凸出表示機會成本固定
  - label: D
    content: 直線表示機會成本不存在，而由原點向外凸出表示機會成本存在
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_18
  section: 1
  number: 18
