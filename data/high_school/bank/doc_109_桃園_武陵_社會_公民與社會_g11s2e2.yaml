  stem: 英國己於2020年1月 31日正式退出歐盟，隨後進人脫歐過渡期，許多專家都關注英國在脫歐後對全球經貿的影響，下表為我國與英國主要貿易交流內容： 關於臺、英國際貿易之相關敘述，下列何者正確？
  options:
