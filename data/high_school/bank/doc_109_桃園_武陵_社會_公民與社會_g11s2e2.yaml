  stem: 藍鵲國近年景氣不佳，人民荷包縮水，買東西變得特別謹慎，造成許多產品買氣冷清，手機、自行車等產品的價格都己經出現下滑。若藍鵲國人民荷包縮水，導致自行車需求減少，請問以下何種情況可能也會導致自行車需求減少？
  options:
  - label: A
    content: 自行車安全帽降價
  - label: B
    content: 人口長期負成長
  - label: C
    content: 機車的價格上漲
  - label: D
    content: 明星代言自行車廣告
- id: doc_109_桃園_武陵_社會_公民與社會_g11s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 右圖是農夫小韓的生產可能曲線（PPC），在固定的資源與技術下，他可以同時生產小玉西瓜和白玉苦瓜，請問圖中的A、B、C、D、E五點代表的意義，何者正確？
  options:
  - label: A
    content: A、B、C、E四點皆表示小韓已經充分利用生產要素
  - label: B
    content: D、E兩點因為都不在線上，代表生產過程皆是無效率
  - label: C
    content: 小玉西瓜的灌溉設備故障，可能導致A點移動到E點
  - label: D
    content: 為了要讓E點移動到D點，小韓只能購買更多機器設備
