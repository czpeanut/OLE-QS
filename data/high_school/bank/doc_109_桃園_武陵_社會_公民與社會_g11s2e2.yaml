  group_stem: 五家重要水泥業者在2018年12中旬，因短暫砂石短缺，通知下游客戶隔年要漲價。公平會解釋，這五家業者在台南市、高雄市的預拌混凝土市場佔有率合計均已高達75%以上，由於預拌混凝土的技術單純同質性高，這類產品在市場上都容易以價格來競爭，但公平會發現，業者發給客戶的通知書上，無論是通知日期、漲幅（17%至18%）與調漲時間皆是相近，已經違反價格競爭的常態。而且通常是愈大的廠商對於成本吸收的能力愈好，但這五家業者調漲的幅度是其他小廠近2倍，不符合常理，更重要的是，當時砂石原料成本仍未確定要調漲，業者卻預先公佈調整調漲預拌混凝土價格，「這已不具經濟合理性」，「這很明顯就是有問題」，因此重罰五家業者，罰鍰金額總計6千萬元
