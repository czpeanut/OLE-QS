  - label: B
    content: 為過渡元素
  - label: C
    content: 位於週期表第七週期
  - label: D
    content: 與錳同為7B族
  - label: E
    content: 為錒系元素
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) Rn的原子序為86，故Bh的原子序為86＋14＋5＋2＝107；(B)由電子組態可得知，d軌域未填滿，為過渡元素；(C)使用到7s軌域，故正確；(D)錳的價電子組態也是（n－1）$d^{5}ns^{2}$，故正確；(E)為過渡元素。故選(E)。
