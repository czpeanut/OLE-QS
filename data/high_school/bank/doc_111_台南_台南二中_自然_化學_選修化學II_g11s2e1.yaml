  stem: 下列敘述，何者正確？
  options:
  - label: A
    content: 光是一種電磁波，電磁波包含α射線
  - label: B
    content: 所有的光子具有相同的能量
  - label: C
    content: 紅光的頻率比紫光低，波長亦較短
  - label: D
    content: 紫外線的頻率比紅外線高，所以在真空中紫外線的傳播速率比紅外線快
  - label: E
    content: 電磁波頻率：γ射線＞X射線＞可見光＞微波＞無線電波
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) α射線是He的原子核，不是電磁波；(B)光子波長不同，能量就不同；(C)紫光的能量較紅光高、波長較短；(D)電磁波傳遞速率在同一種介質中皆相同；(E)正確。故選(E)。
