  answer_status: verified
  answer_source: answer_key
  explanation: (A)只能在軌道上；(B)電子存在於固定軌道上，不輻射能量；(C) n＝1時能量最低，但不為零；(D)正確；(E)只能吸收任兩能階差的能量並躍遷。故選(D)。
