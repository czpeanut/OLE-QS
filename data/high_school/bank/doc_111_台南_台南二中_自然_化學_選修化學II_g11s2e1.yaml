- id: doc_111_台南_台南二中_自然_化學_選修化學II_g11s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 當原子的電子由激發態躍遷至基態時，會將多餘的能量以光的形式釋出，這種現象為電子躍遷的一種。氫原子在下列哪一種主量子數n之間的電子躍遷，所產生光譜的波長最短？
  options:
  - label: A
    content: n＝3 → n＝1
  - label: B
    content: n＝∞ → n＝3
  - label: C
    content: n＝4 → n＝2
  - label: D
    content: n＝1 → n＝∞
  - label: E
    content: n＝2 → n＝l
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 波長最短，即能量最大。其中降落至n＝1之光皆為紫外光、降落至n＝2之光皆為可見光、降落至n＝3之光皆為紅外光，故(A)、(E)為紫外光，能量最大，又(A)為由n＝3降落至n＝1，大於(E)，故選(A)。
