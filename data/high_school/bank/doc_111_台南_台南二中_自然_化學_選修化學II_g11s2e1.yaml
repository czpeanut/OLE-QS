  stem: 波耳研究原子結構的貢獻於1922年獲得諾貝爾獎，他去逝35年後的1997年，IUPAC將原子序x的元素命名為Bohriurn（𨨏Bh）以紀念波耳。已知Bh的電子組態為 [Rn]$5f^{14}6d^{5}7s^{2}$，則下列有關Bh的敘述，何者<u>錯誤</u>？
  options:
