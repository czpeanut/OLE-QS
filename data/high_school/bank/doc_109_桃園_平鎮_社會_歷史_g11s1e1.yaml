  number: 47
  type: multiple
  page: 5
  stem: 某生在圖書館中讀到了以下幾種社會主義的學說： 甲學說：「它（國家）確認了某些跟所有的生產關係（權力）與作為法律的財產關係（權利），因此確認了統治階級的所有權獨占與剩餘價值的抽取。」「一切歷史都是階級鬥爭的歷史，壓迫者和壓迫者始終處在對立的地位，進行不斷的鬥爭，每一次鬥爭的結果，必是整個社會得到革命的改造。」 乙學說：「社會主義植根於民主政治，民主必然促使我們承認每一個達到目標的步驟，必須獲得多數人民的支持。即使想立即革除舊事務，仍必須在多數人同意時才能完成。我們面臨原則的實踐時，必須先形成法案，逐條在委員會中辯論，再由適當的機關來執行。」 丙學說：「因為四海一家，人皆兄弟，所以所有的生產設備和資本應該是大眾所共有，每個組織都應該根據個人的天性和專長來分配工作與利潤。」 關於上述三派學說的特色，哪些說明為正確？
  options:
  - label: A
    content: 甲學說為馬克思社會主義；乙學說為費邊社會主義；丙為烏托邦社會主義
  - label: B
    content: 三派主張透過制度的改變重建經濟秩序
  - label: C
    content: 三派皆批判了工業化社會中勞資對立的現象
  - label: D
    content: 三派皆主張透過政黨政治、選舉的方式改革社會問題
  - label: E
    content: 三者皆主張透過經濟上的合作來實現均富的目標
