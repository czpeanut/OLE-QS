  group_stem: ◎閱讀下列資料，回答問題： 資料一：「這是個什麼鬼地方啊！又矮又窄的坑道，根本直不起腰來，礦工們就像夾在兩頁書中的甲蟲差不多！揮鎬刨不了幾下子，就已經是滿身大汗，可是一天得這麼幹上十個小時…到頭來礦主們七剋八扣，工人們的工錢賺不了幾個！」 資料二：英國議會的調查發現「六歲以上的童工竟在礦坑中工作…礦坑設備簡陋，環境危險艱苦，童工們匍伏爬行於坑道之間，推動煤車前進，女工肩負煤籃，同出同入。雖有不少發明防止危險，但坑內爆炸的事件仍不時發生。」 資料三：「一部蒸汽機往往造成1000人失業。……機器的每項改進，都造成一批工人家庭吃不起麵包，每生產出一部機器，就產生一批新的乞丐。這樣發展下去，不需很久，所有的錢都流入幾千工廠主的口袋，人口中的其他部分，只得祈求為工廠主賣命。」
