  stem: 以下是美國《獨立宣言》的內容節錄：「我們認為下述真理是不言而喻的：人人生而平等，造物者賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利。為了保障這些權利，人們才在他們中間建立政府，而政府的正當權力，則是經被統治者同意授予的。任何形式的政府一旦對這些目標的實現起破壞作用時，人民更有權予以更換或廢除，以建立一個新的政府。」，請問：下列分析哪些為正確？
  options:
  - label: A
    content: 此文件體現啟蒙以來對自由理性的追求
  - label: B
    content: 「造物者賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利」體現洛克的天賦人權
  - label: C
    content: 政府權力來自人民，此體現盧梭的社會契約論
  - label: D
    content: 此文件內容描述了孟德斯鳩制衡的思想
  - label: E
    content: 文中強調人民的各項權利，而不是強調政府的公權力
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s2_47
