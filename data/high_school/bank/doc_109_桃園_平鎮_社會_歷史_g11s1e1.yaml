  stem: 某人是個教士。以往，他的唯一保護者和最高效忠者為教宗，但是他的國家在這個時候宣布國王才是該國教會與教士的保護者及統帥者，臣民一律要宣誓效忠國王而反對教宗，這樣的轉變令人措手不及。同時，政府解散某人的修院，而且沒收他們的財產。某人對於這樣的突變非常氣憤，他跟友人說：「國家的用意只是想要擺脫羅馬的干涉而已…。」請問：某人所屬的國家可能是哪一國？
