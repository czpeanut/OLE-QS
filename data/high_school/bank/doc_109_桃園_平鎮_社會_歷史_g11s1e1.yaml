questions:
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 拜占庭帝國屹立千年之久，四周都是虎視眈眈的敵人，十世紀□□□人對拜占庭已經構成嚴重威脅，於是拜占庭認為使其基督教化是個上策，於是派了二位教士前往傳教，為他們創製字母，又將聖經譯成他們的語言。請問：這個民族為何？
  options:
  - label: A
    content: 日耳曼人
  - label: B
    content: 土耳其人
  - label: C
    content: 斯拉夫人
  - label: D
    content: 阿拉伯人
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 二位同學在討論古文明的宗教思想觀時，甲說：「你所謂求的永生是沒有的。眾神在給人類生命的那天起，就已經註定了死亡的時刻。生命就在眾神的掌握之中，人類是不能作主的，這是無法改變的宿命。」乙說：「我們要將人生不可知的部分歸諸神明，必須要相信神論。因為神明是人依自己的經驗所創造的，具有凡人一般的情欲與喜怒哀樂。」請問：甲、乙兩位同學各自代表哪些族群的宗教思想觀？
  options:
  - label: A
    content: 羅馬人、古希臘人
  - label: B
    content: 古希臘人、蘇美人
  - label: C
    content: 蘇美人、羅馬人
  - label: D
    content: 蘇美人、古希臘人
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 他主張好行為是由理性控制的行為，一切道德在基本上就是理性克制情感，而錯誤的行為則源於無知和未能審察人為什麼會有那一種行為。他要求人們為自己的主張和言詞下定義，藉由觀念的澄清以去除矛盾並揭露對方的無知。他也主張不斷的討論和思考以弄清楚真相。她被視為古代思想一大突破的關鍵人物，將人從天上帶回到人間來。請問：這是何人？
  options:
  - label: A
    content: 泰利斯
  - label: B
    content: 普羅達哥拉斯
  - label: C
    content: 蘇格拉底
  - label: D
    content: 亞里斯多德
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某個民族對神的觀念與其他民族很不一樣。他們認為，神明除具有永生與全能的神性外，也和人一樣有七情六欲、戀愛、貪婪及嫉妒等行為。該民族神話講的就是眾神所發生的各種錯綜複雜而美妙動人的故事。這些話也成為日後西方文學藝術的寶庫。此民族是
  options:
  - label: A
    content: 埃及人
  - label: B
    content: 蘇美人
  - label: C
    content: 希臘人
  - label: D
    content: 羅馬人
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 《吉爾伽美什史詩》裡敘述英雄吉靡伽美什（Gilgamesh）的諸多事蹟，以及他為拯救好友恩奇（Enkidu），而使他決定探索永生不死的神奇祕密。這位英雄努力去尋找傳說奇人，那位在洪水來臨時，竟能死裡逃生的神人－烏特，希冀能獲得拯救。我們可以看出此作品透露出何項重要精神思維？
  options:
  - label: A
    content: 國王為神的化身，最終他也必然會得到永生不死的結果
  - label: B
    content: 眾神具備人類最完美的體態，也混雜與人類相同的七情六欲
  - label: C
    content: 反映東西文化交流的結果，相信永生英雄的救贖與透過祕密儀式，神人合一
  - label: D
    content: 此故事背景反映人們對生命發展的不確定性，和對不定期洪水來臨的災難感到誠惶誠恐
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一位歷史人物說：「上帝不僅創造了人和宇宙，而且還讓人處於中間的位置，使人容易觀察到世界的一切。同時，上帝在用其法則去限制其他一切生靈的本性時，卻賦予人自由意志，讓人自由發展並塑造自我。」這位歷史人物應該是：
  options:
  - label: A
    content: 古代希臘城邦的哲學家
  - label: B
    content: 中世紀早期的神學家
  - label: C
    content: 文藝復興時代的思想家
  - label: D
    content: 二十世紀初期的科學家
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 宗教改革的某教派教徒有如下的特色：「他們是具有戰鬥意志，不容易妥協的理想主義者；雖然真正得榮耀的人很少，但他們堅信自己是少數被神揀選的人；他們反對鬆散輕浮的生活方式，在禮拜儀式中，所有訴諸感官的事物──色彩、音樂、香火都被嚴格禁止，他們認為一個人的勞動有宗教性的莊嚴意義，任何誠實的工作形式都是神所喜悅的。」此教派為何？
  options:
  - label: A
    content: 喀爾文教派
  - label: B
    content: 英國國教
  - label: C
    content: 希臘正教
  - label: D
    content: 羅馬公教
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 他在十七世紀初先後發表的《星際使者》和《關於太陽黑子的書信》兩部著作，都震驚當時歐洲天文界，在書中他推翻古埃及學者的「地球是宇宙中心論」，同時也否定亞里斯多德天體是完美無缺的觀念。但他論點卻受到教會及守舊人士的攻擊。教會甚至宣布：「地動說違背聖經教義，不得任意傳授與公開談論。因此他停止公開宣揚他的想法。請問：「他」是指何人？
  options:
  - label: A
    content: 哥白尼
  - label: B
    content: 伽利略
  - label: C
    content: 牛頓
  - label: D
    content: 克卜勒
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「文藝復興」標示著西方揮別中古，走入近代的過渡期。綜觀其精神內涵、發展過程與影響：(甲)羅馬式的建築再度流行；(乙)方言文學的興起，對於日後民族國家形成有所幫助；(丙)米開朗基羅在西斯汀教堂繪製「創世紀」，顯示此時藝術創作，仍以為宗教服務為主要目的；(丁)文藝復興運動整體仍重視群體意識和追求永生；(戊)伊拉斯默斯呼籲回歸原始簡樸的基督教，為宗教改革鋪路。請問：上列敘述哪些為正確？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙丁
  - label: C
    content: 乙丁戊
  - label: D
    content: 甲乙戊
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 某生看到了兩段資料：「社會關係，來自彼此平等的個人與個人的自由同意，也就是說，社會上的所有制度，都應該經由每個人的同意而產生」、「正因為任何人對他人都沒有天然的權力，正因為暴力不能產生權利，所以人類社會的任何合理的權威就都應建於人民之間的相互約定」。請問：這兩段資料內容最可能出現在哪一本書中？
  options:
  - label: A
    content: 《社會契約論》：盧梭
  - label: B
    content: 《法意》：孟德斯鳩
  - label: C
    content: 《方法論》：笛卡兒
  - label: D
    content: 《政府論》兩篇：洛克
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 啟蒙時期的英國歷史學家愛德華．吉朋，在探討羅馬帝國衰亡時，指出奧古斯都摧毀共和貴族，壓抑平民力量，去除了羅馬傳統共和政治中原有的權力制衡力量。如此一來，皇帝大權獨攬，沒有任何機制與組織可加以制衡，使帝國步上衰亡的開始。請問：吉朋的論點，最有可能是受到啟蒙時期哪位政治學家的影響？
  options:
  - label: A
    content: 孟德斯鳩
  - label: B
    content: 洛克
  - label: C
    content: 伏爾泰
  - label: D
    content: 盧梭
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「詞彙」往往因時代需求而被創造出來。例如「工業」（Industry）、「工人階級」（Working class）、「資本主義」（Capitalism）、「社會主義（Socialism）、「鐵路」（Railway）等等，就是在某個時期新創造的辭彙，或為適應這個時期的需要所產生的單詞。請問：這個時期最有可能是哪一時期？
  options:
  - label: A
    content: 1728～1788年
  - label: B
    content: 1789～1848年
  - label: C
    content: 1849～1918年
  - label: D
    content: 1919～1945年
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 十八世紀一位英國學者針對「圈地運動」前後的變化，指出：「過去小土地所有者和小租地農民，靠自己耕種土地的產品和公有地上放養的羊、家禽、豬等維持自己和家庭的生活，幾乎不必向市場購買。如果土地落到少數大租地農場主手中，他們就必須為別人勞動才能維持生活，而且不得不到市場上去購買自己所需的一切。因為將有更多尋找職業的人被趕到城市去，城市和手工業工廠將會擴大。」根據上述，應如何理解「圈地運動」及其影響？
  options:
  - label: A
    content: 圈地運動使農民流離失所，為英國社會帶來動亂，直接導致英國王權的解體
  - label: B
    content: 圈地運動使英國農業支離破碎，延緩了工業革命的發生
  - label: C
    content: 圈地運動迫使人們仰賴市場供應生活物資，不利農業生產效率的提升
  - label: D
    content: 圈地運動使佃農和小自耕農遷移至城市謀生，為工業革命提供勞動力
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 在某一時代裡，城市裡的居民為了保護自己免遭海盜、苛捐雜稅和討厭的法規傷害，他們以武力或金錢向領主爭取成為自治城市。因此，城市的居民可以按照自己決定的方式，組織自治政府、選舉市議會、鐵定各種法律、自設法官，甚至可以自鑄鐵幣，組織軍隊。請問：上文敘述最有可能發生於何時代、何地區？
  options:
  - label: A
    content: 前五世紀，雅典
  - label: B
    content: 一世紀，羅馬
  - label: C
    content: 十三世紀，義大利
  - label: D
    content: 十八世紀，法國
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 某位歷史學者對十六世紀的歐洲下了如下評論：「事實上，十六世紀仍是一個神啟的世紀，一個誠心信奉基督的世紀。大多數近代世界的開創者都滿懷著宗教熱忱。但是，承認每個基督教徒都有自由解釋《聖經》的權利，就等於確定了一項可能直接威脅《聖經》本身的反教會的原則。」請問：文中「承認每個基督教徒都有自由解釋《聖經》的權利」的應是下列何人的主張？
  options:
  - label: A
    content: 伏爾泰
  - label: B
    content: 馬丁路德
  - label: C
    content: 喀爾文
  - label: D
    content: 伊拉斯默斯
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 莉底雅的父親曾是造銀器的富商，房子裡擺設得如同當代詩人味吉爾的詩所描寫的一樣，父親因為信仰而拒絕膜拜皇帝後家道中落，自從新帝再度允許信仰自由後，生活才獲得改善。但想起過去晚餐中來自義大利的紅酒，希臘廚師的好手藝，仍然感嘆不已。請問：莉底雅生活在何時的環境中？
  options:
  - label: A
    content: 一世紀，亞歷山大城
  - label: B
    content: 四世紀，羅馬
  - label: C
    content: 六世紀，君士坦丁堡
  - label: D
    content: 九世紀，巴格達
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 羅馬共和初期，平民在經濟和政治上受到極大壓迫。負債的平民變成實質的農奴，甚至被賣為奴；貴族與平民階級間的通婚，實際上被禁止；法庭的控制權落入貴族手中。而後，平民盡力爭取政治的發言權。請問：下列何者是平民爭取而來的權益？
  options:
  - label: A
    content: 設置兩名執政官互相制衡
  - label: B
    content: 給予元老院擁有立法權
  - label: C
    content: 參加公民大會
  - label: D
    content: 制定《十二表法》
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 羅馬奧里略皇帝在其著作《沉思錄》中，觀察了宇宙與人生的關係、理性與慾望的關係，並提倡過著純潔的生活、重視內心寧靜等，請問：就此著作的內容，可見其受希臘哲學哪一流派思想的影響？
  options:
  - label: A
    content: 斯多噶學派
  - label: B
    content: 辯士學派
  - label: C
    content: 米利都學派
  - label: D
    content: 伊比鳩魯學派
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 理性思維最重要的特點就是把主觀和客觀分離，把握客觀規律，所以西方哲學在古希臘誕生的同時也就是西方科學精神的誕生，可以說哲學是所有學科之始。下列相關的哲學家與學說的配對，何者正確？
  options:
  - label: A
    content: 泰利斯：萬物起源於火
  - label: B
    content: 蘇格拉底：人是衡量一切事物的基準，沒有絕對的真理
  - label: C
    content: 柏拉圖：觀念比實際經驗重要
  - label: D
    content: 亞里斯多德：宇宙由原子所組成，人死後如原子散去不復存在
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 某書描述：「各國的作家和思想家在這裡均可受到熱烈招待。這裡出現了一些由豔光四射博學多才的名媛主持的聚會，作家、學者們可以海闊天空地談論各種問題，參與者常因其口才和機會而聲名大噪。」這種情景最可能出現在何時何地？
  options:
  - label: A
    content: 十五世紀的米蘭
  - label: B
    content: 十七世紀的倫敦
  - label: C
    content: 十八世紀的巴黎
  - label: D
    content: 十九世紀的紐約
- id: doc_109_桃園_平鎮_社會_歷史_g11s1e1_s1_21
  section: 1
  number: 21
