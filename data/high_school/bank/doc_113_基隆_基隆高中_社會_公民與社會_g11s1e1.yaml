  explanation: (A)此工時不符合《勞動基準法》；《勞基法》規定勞工正常工作時間每日不得超過 8 小時，每週不得超過 40 小時。繼續工作 4 小時，至少應有 30 分鐘之休息。每 7 日中應有 2 日之休息，其中 1 日為例假，1 日為休息日。(B)試用期間雇主一樣必須為試用期員工加勞健保。基本上，試用期員工與正職員工享有相同的福利，但詳細內容依入職前勞資雙方簽訂的契約為準。(C)皆符合規定，為正解。(D)無勞健保已違反《勞基法》規定。
