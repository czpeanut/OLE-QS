  stem: 某中古家電廠商貼出一則促銷廣告：「二手家電賤價出售，買得愈多價格愈便宜。」上述這種行銷產品的策略，是運用經濟學中的哪一種原理？
  options:
  - label: A
    content: 機會成本
  - label: B
    content: 比較利益
  - label: C
    content: 需求法則
  - label: D
    content: 供給法則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)依據需求法則，假設其他因素不變，當一件財貨的價格下降時，消費者會增加購買量，代表需求量會上升；相反的，當該財貨價格上漲時，消費者會減少購買量。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 7
  stem: 當甲產品價格下跌時，引起另一產品乙的需求反向變動，此時甲乙兩產品互為下列何種關係？
  options:
  - label: A
    content: 消費上替代品
  - label: B
    content: 生產上替代品
  - label: C
    content: 消費上互補品
  - label: D
    content: 生產上互補品
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 甲產品價格下跌，將使甲產品的需求量增加，其替代品的需求減少，其互補品的需求增加；但乙產品的需求反向變動，意味需求減少，因此甲乙兩者應為(A)消費上替代品。
