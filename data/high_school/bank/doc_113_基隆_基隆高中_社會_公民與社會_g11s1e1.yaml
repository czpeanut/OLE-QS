    content: 生產全電動車會影響油電混合車，兩者是供給互補品
  group_stem: '大約 20 年前，豐田汽車（Toyota Motor）靠著油電車普銳斯（Prius）成為美國環保主義者和環保意識消費者偏愛的車廠，當時普銳斯可說是有史以來最乾淨、最節能的「電氣化」汽車之一。在油價上漲的情況下，市場對普銳斯的需求增加，現在依然在美國最節能的汽油車之列。但隨著汽車產業過渡轉向電動車的未來趨勢，日本車廠豐田不再是過去核心支持者的最愛，原因是豐田對投資全電動車款猶豫不決。美國環保組織認為「現在油電混合車不算是綠色科技。普銳斯油電車使用的內燃機會排放汙染，任何汽油車都有。」因此美國通用（General Motors）、德國福斯（Volkswagen）等車廠近年致力投入數十億美元，開發不需使用普銳斯這種汽油引擎的全電動車款；然而，豐田汽車對全電動車的開發則是偏保守。

    在豐田眼中，全電動車是走向碳中和的選項之一，而不是唯一。豐田創投執行常董阿德（Jim Adler）說：「在遙遠的未來，我不會假設電動車市占率達 100 ％而去做投資。」電動車裡的電池極度昂貴，由於通貨膨脹和鋰、鈷、鎳等原物料需求增加，電池價格持續上漲，在 COVID-19 疫情期間，電動車的原物料成本增加一倍以上。這使得豐田的油電混合車策略顯得相對划算。豐田也主張目前這類原物料不夠滿足所有人的需要。豐田研究所執行長及首席科學家普拉特判斷，未來十餘年，全球鋰供應會有巨大瓶頸，估計電池級的鎳、鈷、硫酸錳會嚴重產能不足。目前，美國電動車品牌特斯拉（Tesla）在電池生產和供應上遙遙領先對手。特斯拉投資人關係負責人維恰（Martin Viecha）表示，電池供應是「這個產業未來能如何成長的最關鍵部分」。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)電動車的電池成本很高，因此豐田車廠不會全面生產全電動車。(B)對車廠而言，全電動車與油電混合車應為生產上的替代品。(C)為正解。(D)兩者應為供給上的替代品。
