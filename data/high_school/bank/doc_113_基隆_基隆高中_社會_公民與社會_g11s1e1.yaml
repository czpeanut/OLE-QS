- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 4
  stem: 現代國家為改善貧富不均、勞工被剝削的問題，就立法對勞工權利加以保障，避免受僱者因為工時過長或勞動條件不佳而成為受害者。近年來在臺灣，為處理群眾陳情抗議活動，站在第一線的警察經常面臨工時長、工作環境具危險性的情況，卻又因為與國家具有特別權力關係，而無法組織工會來保障勞動權益。請問就勞動權益而言，警察爭取組工會是何種權利的展現？
  options:
  - label: A
    content: 團結權
  - label: B
    content: 協商權
  - label: C
    content: 集會權
  - label: D
    content: 爭議權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)團結權是勞動三權之一，指勞工享有組織或加入工會的權利。由於個別勞工與雇主之間有明顯的權力不對等關係，因此，保障勞工透過組織結社的方式形成集體力量，才能維持與雇主對等的地位。
