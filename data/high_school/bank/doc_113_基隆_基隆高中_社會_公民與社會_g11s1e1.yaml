  stem: 桃園市空服員職業工會曾為爭取權益，發動華航空服員工，提出的訴求全獲華航同意且禁止非職業工會成員「搭便車」比照領取。但華航事後卻給予沒罷工的華航企業工會相類似待遇，被勞動部裁決為「不當勞動行為」，華航不滿告上法院。請問依據我國勞動相關法令分析此新聞事件，判斷下列敘述何者正確？
  options:
