- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 現代社會中，人們必須透過勞動來維持日常生活、推動社會發展，下列關於勞動的概念，何者正確？
  options:
  - label: A
    content: 家務勞動因無法創造經濟價值，因此對社會無貢獻
  - label: B
    content: 市場勞動又稱再生產勞動，可促進家庭生活的循環
  - label: C
    content: 市場勞動與家務勞動具備互補性，皆能使社會進步
  - label: D
    content: 只有照顧家庭又不能表達情緒，才會產生情緒勞動
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)家務勞動可以支持生產勞動，對社會有極大的貢獻。(B)應是家務勞動稱為再生產勞動。(D)家務勞動並非情緒勞動；情緒勞動（Emotional Labor）一詞，是由美國學者霍奇查爾德（Arlie Hochschild）在 1983 年所提出，意指：為了讓工作或事情可以順利運作，而調整自身的情緒狀態，以呈現適宜的表達方式。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 翰翰在上課時學到勞動參與率的概念，得知勞動參與率愈高對於經濟永續發展有正面影響，對此他做了上課筆記，請問筆記中的敘述何者正確？
  options:
  - label: A
    content: 就業人口退休不會使勞動參與率產生變化
  - label: B
    content: 學生就學期間打工，畢業後開始正式工作，則勞參率不變
  - label: C
    content: 勞工放棄尋找工作不會影響勞參率
  - label: D
    content: 失業人口找到工作不會影響勞參率
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「勞動力參與率」是指勞動力占 15 歲以上民間人口的比率，也就是在 15 歲以上民間人口中有參與勞動的比率。因勞動力包含就業者與失業者，因此勞動力的增減，會影響勞參率的升降。(A)就業人口退休會成為非勞動力，會使勞動參與率下降。(B)學生成為就業人口，會增加勞動力，提升勞動參與率。(C)勞工放棄找工作會成為非勞動力，會使勞動參與率下降。(D)失業人口找不到工作仍屬於勞動力，不會影響勞動參與率，為正解。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 我國長久受到父權體制的影響，使得許多人認為照顧家庭本來就是女性的職責，家庭主婦的比例明顯比家庭主夫高出許多。為提升女性的社會階層，政府近年來不斷從法律層面著手努力，請問下列有關我國政府的具體法案中，哪一項正是肯定家務勞動的價值？
  options:
  - label: A
    content: 《性別平等教育法》：不得訂定單身條款、禁孕條款
  - label: B
    content: 《性別平等工作法》：不得因性別，而給予升遷、教育、進修之差別待遇
  - label: C
    content: 《性騷擾防治法》：禁止對他人實施違反其意願而與性或性別有關之行為
  - label: D
    content: 《民法》：修訂自由處分金制度
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)為落實在教育或工作場域中的性別平等概念，與家務勞動無關。(C)與性騷擾防治有關，但與家務勞動無關。(D)自由處分金為夫妻於家庭生活費用外，得協議一定數額之金錢，供夫或妻自由處分。目前《民法》可以反映出家務勞動屬於有償性質的規定，主要有三項，分別是「家庭生活費用的分擔」、「自由處分金」以及「剩餘財產分配請求權」，故為正解。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 有關市場勞動與家庭勞務之間的關係，以下四位同學分享其日常生活所觀察到的經驗，何者較符合性別平權的概念？
  options:
  - label: A
    content: 自古以來，照顧小孩本來就是女性的職責，且通常媽媽照顧得比較好
  - label: B
    content: 男生在外面拋頭露面為事業打拚賺錢，回到家比較沒有多餘體力做家事
  - label: C
    content: 雙薪家庭的父母親都必須在外賺錢，家庭勞務則由先生一人負責即可
  - label: D
    content: 對於家庭主婦在家中養育、照顧小孩等再生產勞動應該給予正面的肯定
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)皆有男女之一方應該在家庭中承擔某種性別刻板印象所造成的勞動情形，反而加深性別刻板印象。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 附圖呈現的是某年我國各年齡層男女性的勞動參與率，依附圖，男女兩性在勞動參與率的比較上，有何明顯趨勢？
  options:
  - label: A
    content: 各年齡層中，男性的勞動參與率均高於女性
  - label: B
    content: 兩性勞動參與率於 50 ～ 54 歲年齡層中差異最大
  - label: C
    content: 30 歲後，女性年齡層愈高，勞動參與率愈低
  - label: D
    content: 25 歲後，男性年齡層愈高，勞動參與率愈低
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 211.3
      - 609.25
      - 472.8
      - 766.55
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 20 ～ 24 歲的女性勞動參與率高於男性。(B)應是 55 ～ 59 歲的區段兩性的勞動參與率差異最大，為 33.75 ％。(C)符合圖表內容的趨勢，為正解。(D) 30 ～ 34 歲的男性勞參率高於 25 ～ 29 歲的男性勞參率，故此敘述有誤。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 3
  stem: 針對我國勞動參與率的計算標準來看，下列何者屬於「勞動力」人口？
  options:
  - label: A
    content: 廣告收入費已破百萬的 13 歲偶像明星
  - label: B
    content: 修補衣服賺外快的 29 歲單親媽媽
  - label: C
    content: 重考了三年研究所的 26 歲年輕人
  - label: D
    content: 辦理離職全心在家照顧小孩的母親
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 勞動力係指 15 歲以上可以工作之民間人口，包括就業者及失業者。(A)未滿 15 歲之人不為勞動力人口。(B)有報酬，屬於勞動力，為正解。(C)就學中為非勞動力。(D)家務勞動者沒有求職的行為與意願，為非勞動力。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 3
  stem: 下列關於家戶與廠商，在生產與消費、供給與需求關係的敘述，何者正確？
  options:
  - label: A
    content: 廠商在生產中投入多種生產要素，都需與家戶締結相關契約
  - label: B
    content: 家戶提供人力資源投入於生產行列中，因此獲得銷貨收入
  - label: C
    content: 廠商的生產透過生產要素市場，將產品提供家戶單位消費
  - label: D
    content: 家戶在產品市場是需求關係，在生產要素市場是供給關係
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不一定皆須與家戶締結契約，也可能是與其他的廠商。(B)家戶投入生產，應是獲得薪資。(C)廠商的生產透過產品市場，將產品提供給家戶消費。(D)為正解。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 附圖為臺中市政府於 2019 年 3 月公布違反《勞動基準法》之事業單位統計，裁罰區間為 2018 年 12 月至 2019 年 1 月（含於 2018 年 12 月至 2019 年 1 月訴願駁回或不受理之事業單位），以零售及批發業違法情形最多。依該圖所示，《勞動基準法》關於勞動契約自由的限制，其主要原因為何？
  options:
  - label: A
    content: 保障雇主生產的利潤收入
  - label: B
    content: 維護個別勞動權益與勞動安全
  - label: C
    content: 保障集體勞動權益與救濟方式
  - label: D
    content: 爭取就業者相關福利與津貼
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1/s1_8_f1.png
    crop:
      page: 3
      rect:
      - 154.05
      - 269.4
      - 530.0
      - 427.7
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《勞動基準法》係依據我國《憲法》第 153 條：「國家為改良勞工及農民之生活，增進其生產技能，應制定保護勞工及農民之法律，實施保護勞工及農民之政策。」的規定而制訂，主要是為保障個別勞動者的勞動權益與勞動安全，再依其第 1 條：「為規定勞動條件最低標準，保障勞工權益，加強勞雇關係，促進社會與經濟發展」，故選(B)。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 工會起源可以追溯到 18 世紀的英國，當工業開展呈爆炸性成長，將婦女、兒童、農民和移民人口進入工廠。無技術和低技術勞工自發成立組織，這就是工會的雛形。以下關於工會的描述，何者較為正確？
  options:
  - label: A
    content: 崇里：工會是勞工自發組織的財團法人團體
  - label: B
    content: 真益：目的是保障勞工權益，提升勞動條件
  - label: C
    content: 宏宜：在自由市場的經濟體系下，工會使勞工取得較資方優勢的地位
  - label: D
    content: 仁輔：工會的作用就是要將勞工團結，形成足以與資方進行協商的力量，此即「爭議權」之真諦
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「工會」意指基於共同利益而自發組織的社會團體，這個共同利益團體（諸如為同一雇主工作的員工，在某一產業領域的個人）可以與雇主集體談判工資薪水、工作時限和工作條件等。而工會成立的主要意圖或這些組織和聯合會最常見的共同目標是「保持和改善僱傭待遇」，故選(B)。(A)工會是社團法人。(C)勞資關係中，資方擁有較高的權力，工會僅是儘量使勞方爭取較佳的勞動權益。(D)工會的組成是為落實團結權。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 法律除了保障勞工的協商權外，為了讓勞工能夠跟雇主協商勞動條件，也賦予勞工合法的罷工權益。但是勞工罷工常常引發正反不同爭議，以下關於勞工罷工權益的說法，何者較為正確？
  options:
  - label: A
    content: 若是雇主違反勞動法規，員工即可行使罷工要求改善
  - label: B
    content: 爭議權最後的手段就是罷工
  - label: C
    content: 罷工應注意避免衝擊公司營運和獲利，使雇主同意重新回到協商局面
  - label: D
    content: 雇主若不給付員工加班費，可藉由罷工保障勞工權益
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)合法罷工必須符合相關要件，如：勞資雙方已進行調解，且是調解不成立的情形下；之後罷工由工會發起，並經會員過半數同意；罷工不得違反勞動契約、團體協約或《勞動基準法》等法令規定。(C)罷工不可避免的會衝擊公司營運和獲利，使雇主重視勞工訴求，這也是勞工發動罷工的主要目的。(D)不給員工加班費，應是由《勞動基準法》規範，若遇到雇主積欠加班費的情況，可先與雇主溝通，若有工會，也可以請求工會協助爭取，如果雇主置之不理，勞工可以循調解、仲裁或訴訟方式維護自身權利。
- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 《民法》強調私法自治與契約自由，但為了維護私法秩序，對於交易買賣與訂定契約，《民法》有相關規定與限制，當事人不得違反，否則其行為無效。下列敘述何者正確？
  options:
  - label: A
    content: 不能違反公共秩序與善良風俗，不過須依時代變遷、社會思潮、經濟狀況等差異，做綜合性的判斷
  - label: B
    content: 土地房屋等不動產之轉移，雙方在口頭上意思表示合致契約即成立
  - label: C
    content: 為確保市場公平競爭，設定有《消費者保護法》
  - label: D
    content: 勞動條件若皆符合《勞動基準法》，勞工不得提出異議
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)不動產產權移轉須至地政機關以書面方式辦理登記，即非經登記，不生效力。(C)此為《公平交易法》的規範，其立法目的：為維護交易秩序與消費者利益，確保自由與公平競爭，促進經濟之安定與繁榮，特制定本法。(D)《勞動基準法》僅為最低標準，勞工可與資方協商勞動條件。
