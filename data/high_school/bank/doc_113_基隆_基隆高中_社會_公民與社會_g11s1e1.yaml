  section: 1
  number: 16
  type: single
  page: 4
  stem: 在《消費者保護法》中第 19 條第 1 項：「通訊交易或訪問交易之消費者，得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。」條文規範主要目的為何？
  options:
  - label: A
    content: 賣方進貨成本較低，衡量雙方金錢付出，故保障七日可以解約
  - label: B
    content: 為提升經濟發展、鼓勵人民消費，故以條文多加保障民眾權益
  - label: C
    content: 因賣家與買家間的權力與資源不均，故條文保障消費者權益
  - label: D
    content: 受到疫情的影響，消費者無法觀看物品，因此特立條文可以退貨
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《消費者保護法》的 7 日猶豫期（鑑賞期）立法緣由：科技的進步，讓達成交易的速度變得更迅速，方式變得更多元。為了避免消費者在匆促下無法做出理性消費決定，《消保法》規範讓透過通訊交易或訪問交易獲得商品或服務的消費者，在收到商品或服務後，有 7 天的反悔期限（但排除合理例外情事）。最適切的答案為(C)賣家與買家間的權力與資源不對等，故條文保障消費者權益。
