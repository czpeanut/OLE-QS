questions:
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s1_1
  section: 1
  number: 1
  type: calc
  page: 1
  stem: 設f (x)＝0為實係數三次方程式，已知1＋i為f (x)＝0的一根，試問函數f (x)的圖形與x軸有幾個交點？ (1) 0個 (2) 1個 (3) 2個 (4) 3個 (5) 3個以上
  answer:
  - (2)
  answer_status: verified
  answer_source: answer_key
  explanation: '$\because f(x)=0$為實係數方程式，由虛根成對定理得知，已知$1+i$是一根，則另一根必為 $1-i$

    所以第三根必為實根，則$f(x)$的圖形與$x$軸有一個交點

    故選(2)。'
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s2_2
  section: 2
  number: 2
  type: calc
  page: 1
  stem: 下列各式何者正確？ (1) $\sqrt{-144}=12i$ (2) $(\sqrt{-5})^{2}=-5$ (3) $\sqrt{-4}\times \sqrt{-9}=6$ (4) $\frac{\sqrt{-9}}{\sqrt{-4}}=\frac{3}{2}i$ (5) $\frac{\sqrt{9}}{\sqrt{-4}}=\frac{3}{2}i$
  answer:
  - (1)(2)
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $\sqrt{-144}=\sqrt{144}i=12i$，正確

    (2) $(\sqrt{-5})^{2}=\sqrt{-5}\times \sqrt{-5}=\sqrt{5}i\times \sqrt{5}i=-5$，正確

    (3) $\sqrt{-4}\times \sqrt{-9}=2i\times 3i=-6$，錯誤

    (4) $\frac{\sqrt{-9}}{\sqrt{-4}}=\frac{3i}{2i}=\frac{3}{2}$，錯誤

    (5) $\frac{\sqrt{9}}{\sqrt{-4}}=\frac{3}{2i}=\frac{3i^{3}}{2i^{4}}=\frac{-3i}{2}$，錯誤

    故選(1)(2)。'
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s2_3
  section: 2
  number: 3
  type: calc
  page: 1
  stem: 關於三次方程式f (x)＝$ax^{3}$＋$bx^{2}$＋cx＋d＝0，下列敘述何者是正確的？ (1) f (x)＝0至少有一實根 (2) f (x)＝0至少有一複數根 (3) 若f (x)＝0有一根1＋i，則必有一根1－i (4) 若a，b，c，d ∈ Z且f (x)＝0有一根1＋$\sqrt{ 2 }$，則必有一根1－$\sqrt{ 2 }$ (5) 若a，b，c，d ∈ Z，則f (x)＝0至少有一實根
  answer:
  - (2)(4)(5)
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ×：$\because f(x)=0$是三次方程式，未必是實係數

    $\therefore$係數可能有複數，則三個根可能都是複數根，$\therefore$ 錯誤。 (2)○：根據代數基本定理：$\because f(x)=0$方程式至少有一複數根，$\therefore$此三次方程式 $\because f(x)=0$至少有一複數根，$\therefore$正確。

    (3) ×：$\because f(x)=0$不一定是實係數，$\therefore$錯誤。

    (4) ○：若$a,b,c,d\in Z$，則$\because f(x)=0$為整係數方程式，$\therefore$若有無理根，必成對出現，$\therefore$正確。

    (5) ○：若$a,b,c,d\in Z$，則$\because f(x)=0$為整係數方程式，又$f(x)=0$是三次，$\therefore$必有一實根兩虛根或三實根，$\therefore$正確 故選(2)(4)(5)。'
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s3_1
  section: 3
  number: 1
  type: fill
  page: 1
  stem: 給五個複數：$Z_{1}$＝－3＋2i、$Z_{2}$＝7－4i、$Z_{3}$＝5、$Z_{4}$＝$-\sqrt{15}i$、$Z_{5}$＝$\frac{5}{3-i}$，回答下列問題： (1)五個數中有＿＿＿＿個數虛部為負？ (2)計算$Z_{1}$＋$Z_{2}$並表成a＋bi的形式＿＿＿＿ (3)計算$Z_{3}$．$Z_{4}$並表成a＋bi的形式＿＿＿＿ (4)求$Z_{5}$的共軛複數＿＿＿＿
  answer:
  - (1) 2；(2) 4－2i；(3)$-5\sqrt{15}i$；(3)$\frac{3-i}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)虛部為負：$z_{2},z_{4}$共2個。 (2) $z_{1}+z_{2}=(-3+2i)+(7-4i)=4-2i$。

    (3) $z_{3}\times z_{4}=5\times (-\sqrt{15}i)=-5\sqrt{15}i$。

    (4) $z_{5}=\frac{5}{3-i}=\frac{5(3+i)}{(3-i)(3+i)}=\frac{5(3+i)}{10}=\frac{3}{2}+\frac{1}{2}i$，$\therefore\overline{z_{5}}=\frac{3}{2}-\frac{1}{2}i$。'
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s3_2
  section: 3
  number: 2
  type: fill
  page: 1
  stem: 求下列各式之值：(1) $i^{420}$＋$3i^{41}$＋$i^{1122}$＝？ (2) $i^{60}$＋$i^{61}$＋$i^{62}$＋…＋$i^{100}$＝？ (3)$(\frac{1+i}{\sqrt{2}})^{50}$＋$(\frac{1+i}{\sqrt{2}})^{100}$＝？
  answer:
  - (1) 3i；(2) 1；(3) i－1
  answer_status: verified
  answer_source: answer_key
  explanation: (1) $i^{420}+3i^{41}+i^{1122}=1+3i+i^{2}=3i$ (2) $i^{60}+i^{61}+i^{62}+...+i^{100}=(i^{60}+i^{61}+i^{62}+i^{63}+\cdots +i^{98}+i^{99})+i^{100}=i^{100}=1$ (3) $(\frac{1+i}{\sqrt{2}})^{50}+(\frac{1-i}{\sqrt{2}})^{100}=\frac{(2i)^{25}}{2^{25}}+\frac{(-2i)^{50}}{2^{50}}=i^{25}+i^{50}=i-1$。
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s3_3
  section: 3
  number: 3
  type: fill
  page: 1
  stem: 設複數Z的實部是2，$\frac{1}{z}$的虛部是$\frac{1}{5}$，求Z＝＿＿＿＿
  answer:
  - 2－i或2－4i
  answer_status: verified
  answer_source: answer_key
  explanation: '設 $z=2+bi,b\in$R，$\frac{1}{z}=a+\frac{1}{5}i,a\in$R

    $\therefore\frac{1}{z}=\frac{1}{2+bi}=\frac{2-bi}{(2+bi)(2-bi)}=\frac{2-bi}{4+b^{2}}=\frac{2}{4+b^{2}}-\frac{b}{4+b^{2}}i$

    $\therefore -\frac{b}{4+b^{2}}=\frac{1}{5},-5b=b^{2}+4,b^{2}+5b+4=0,(b+1)(b+4)=0,b=-1or-4$

    又$\frac{2}{4+b^{2}}=a,\therefore a=\frac{2}{4+1}=\frac{2}{5}or\frac{2}{4+16}=\frac{1}{10}$，$\therefore z=2-i or 2-4i$'
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s3_4
  section: 3
  number: 4
  type: fill
  page: 1
  stem: 設x，y ∈ R，若x＋y＝－6，xy＝9，則$(\sqrt{x}+\sqrt{y})^{2}$＝＿＿＿＿。
  answer:
  - －12
  answer_status: verified
  answer_source: answer_key
  explanation: '$\because xy=9,x+y=-6\Rightarrow x<0,y<0\therefore \sqrt{x}\times \sqrt{y}=-\sqrt{xy}$

    $\therefore (\sqrt{x}+\sqrt{y})^{2}=x-2\sqrt{xy}+y=-6-2\sqrt{9}=-12$。'
- id: doc_110_新北_新北高中_數學_數乙_g12s1e2_s3_5
  section: 3
  number: 5
  type: fill
  page: 1
  stem: 設a為實數，且方程式$4x^{2}$－(3a＋i)x＋a－i＝0有一實根，試求方程式的解＿＿＿＿
  answer:
  - －1或$\frac{1+i}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: '設此實根為$\alpha$，代入$4\alpha ^{2}-(3a+i)\alpha +a-i=0$，$4\alpha ^{2}-3a\alpha +a-\alpha i-i=0$

    $(4\alpha ^{2}-3a\alpha +a)+(-\alpha -1)i=0$，$\alpha =-1$代入$4\times (-1)+3a+a=0,a=-1$

    $\therefore 4x^{2}-(-3+i)x-1-i=0$

    令另一根為$\beta$，$\therefore \alpha +\beta =-\frac{3-i}{4}$，$\therefore \beta =\frac{-3+i}{4}-\alpha =\frac{-3+i}{4}+1=\frac{1+i}{4}$

    $\therefore$方程式的解為$-1 , \frac{1+i}{4}$。

    6 $\because$沒有實根 $\therefore$判別式 $D<0\because D=2^{2}-4\times k\times 3<0\Rightarrow 4<12k\Rightarrow k>\frac{1}{3}$

    7. $\because\alpha ,\beta$為二根 $\therefore \alpha +\beta =-1$，$\alpha \beta =\frac{-3}{2}$

    (1) $\alpha ^{2}+\beta ^{2}=(\alpha +\beta )^{2}-2\alpha \beta =(-1)^{2}-2\times \frac{-3}{2}=4$

    (2) $\frac{\beta}{\alpha}+\frac{\alpha}{\beta}=\frac{\beta ^{2}+\alpha ^{2}}{\alpha \beta}=\frac{4}{-\frac{3}{2}}=-\frac{8}{3}$

    (3) $\because\alpha ,\beta$為二根，代入方程式 $\therefore 2\alpha ^{2}+2\alpha -3=0\Rightarrow 2\alpha -3=-2\alpha ^{2} , 2\beta -3=-2\beta ^{2}$

    $\therefore \frac{\alpha ^{2}}{2\alpha -3}+\frac{\beta ^{2}}{2\beta -3}=\frac{\alpha ^{2}}{-2\alpha ^{2}}+\frac{\beta ^{2}}{-2\beta ^{2}}=-1$

    8. 以$a,b$為兩根的二次方程式為$(x-a)(x-b)=0\Rightarrow x^{2}-(a+b)x+ab=0$

    $\because a+b=-7\therefore \frac{1}{a}+\frac{1}{b}=\frac{b+a}{ab}=-1\therefore ab=7$

    $\therefore x^{2}-(-7)x+7=0\Rightarrow x^{2}+7x+7=0$。

    9. $\because$方程式為實係數，由虛根成對定理得知必有另一根為 $2-\sqrt{2}i$

    以此為兩根的二次方程式為 $\left[ x-(2+\sqrt{2}i) \right] \left[ x-(2-\sqrt{2}i) \right] =0\Rightarrow x^{2}-4x+6=0$

    利用長除法得$\therefore ax^{3}-9x^{2}+bx-2=(x^{2}-4x+6)\left[ ax+(4a-9) \right] +(10a+b-36)x+(-24a+52)$

    $\therefore 10a+b-36=0且-24a+52=0$

    解得$\therefore a=\frac{13}{6},b=\frac{43}{3}\Rightarrow a+b=\frac{13}{6}+\frac{43}{3}=\frac{33}{2}$

    10. $\because$方程式為實係數， $\therefore a+2i 和 3+bi$互為共軛複數 $\therefore a=3,b=-2$

    兩根為$3+2i,3-2i$

    設第三根為$\alpha$，三根和為$3+2i+3-2i+\alpha =-\frac{-9}{1}=9,6+\alpha =9,\alpha =3$

    所以三根為$3+2i,3-2i,3$'
