  stem: 試選出下列哪些是奇函數？
  options:
  - label: A
    content: f（x）＝cosx
  - label: B
    content: f（x）＝$2^{x}$
  - label: C
    content: f（x）＝sinx
  - label: D
    content: f（x）＝$x^{3}$－1
  - label: E
    content: f（x）＝$x^{5}$＋$x^{3}$－2x
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵f（－x）＝cos（－x）＝cosx＝f（x）

    ∴f（x）＝cosx 為偶函數

    (B) ╳：f（－x）＝$2^{－x}$≠－f（x）

    (C) ○：∵f（－x）＝sin（－x）＝－sinx＝－f（x）

    ∴f（x）＝sinx 為奇函數

    (D) ╳：f（－x）＝（－x）$^{3}$－1＝－$x^{3}$－1≠－f（x）

    (E) ○：∵f（－x）＝（－x）$^{5}$＋（－x）$^{3}$－2（－x）＝－$x^{5}$－$x^{3}$＋2x＝－f（x）

    ∴f（x）＝$x^{5}$＋$x^{3}$－2x 為奇函數

    故選(C)(E)'
