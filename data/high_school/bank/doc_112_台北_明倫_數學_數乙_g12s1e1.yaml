- id: doc_112_台北_明倫_數學_數乙_g12s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 若 f（x）＝$3x^{4}$－$5x^{3}$－$2x^{2}$－5x－5 於實數上為連續函數，用勘根定理找出 f（x）＝0 在下列哪些區間內，必有實根存在？
  options:
  - label: A
    content: （－2，－1）
  - label: B
    content: （－1，0）
  - label: C
    content: （0，1）
  - label: D
    content: （1，2）
  - label: E
    content: （2，3）
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（－2）＝3×（－2）$^{4}$－5×（－2）$^{3}$－2×（－2）$^{2}$－5×（－2）－5＝85＞0

    f（－1）＝3×（－1）$^{4}$－5×（－1）$^{3}$－2×（－1）$^{2}$－5×（－1）－5＝6＞0

    f(0)＝－5＜0

    f(1)＝3×$1^{4}$－5×$1^{3}$－2×$1^{2}$－5×1－5＝－14＜0

    f(2)＝3×$2^{4}$－5×$2^{3}$－2×$2^{2}$－5×2－5＝－15＜0

    f(3)＝3×$3^{4}$－5×$3^{3}$－2×$3^{2}$－5×3－5＝70＞0

    ∵f（－1）×f(0)＜0 且 f(2)×f(3)＜0

    ∴f（x）＝0 在區間（－1，0）與（2，3）必有實根存在

    故選(B)(E)'
