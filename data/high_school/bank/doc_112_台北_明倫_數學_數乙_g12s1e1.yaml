  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：f(0)＝$0^{2}$＋1＝1

    (B) ○：f（－1）＝2×（－1）＋3＝1

    (C) ○：f(2)＝2－2＝0 ⇒ f（f(2)）＝f(0)＝1

    (D) ○：f（－2）＝2×（－2）＋3＝－1 ⇒ f（f（－2））＝f（－1）＝1

    (E) ╳：f(1)＝$1^{2}$＋1＝2

    故選(B)(C)(D)'
