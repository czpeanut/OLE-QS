  stem: 試選出極限值為 0 的選項。
  options:
  - label: A
    content: $\lim_{n\rightarrow \infty} \left( -\frac{5}{7} \right) ^{n}$
  - label: B
    content: $\lim_{n\rightarrow \infty} \frac{2^{n}+3^{n}}{6^{n}}$
  - label: C
    content: $\sum_{n=1}^{\infty} \left( \frac{3}{7} \right) ^{n}$
  - label: D
    content: $\lim_{n\rightarrow \infty} \left( \frac{1}{3} \right)$
  - label: E
    content: $\lim_{n\rightarrow \infty} \frac{3n^{2}}{n^{2}+101}$
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\lim_{n\rightarrow \infty} \left( -\frac{5}{7} \right) ^{n}$＝0

    (B) ○：$\lim_{n\rightarrow \infty} \frac{2^{n}+3^{n}}{6^{n}}$＝$\lim_{n\rightarrow \infty} \frac{\left( \frac{2}{6} \right) ^{n}+\left( \frac{3}{6} \right) ^{n}}{\left( \frac{6}{6} \right) ^{n}}$＝$\lim_{n\rightarrow \infty} \frac{\left( \frac{1}{3} \right) ^{n}+\left( \frac{1}{2} \right) ^{n}}{1^{n}}$＝0

    (C) ╳：$\sum_{n=1}^{\infty} \left( \frac{3}{7} \right) ^{n}$＝$\frac{3}{7}+\left( \frac{3}{7} \right) ^{2}+\left( \frac{3}{7} \right) ^{3}+\cdots \cdots$＝$\frac{\frac{3}{7}}{1-\frac{3}{7}}$＝$\frac{\frac{3}{7}}{\frac{4}{7}}$＝$\frac{3}{4}$

    (D) ╳：$\lim_{n\rightarrow \infty} \left( \frac{1}{3} \right)$＝$\frac{1}{3}$

    (E) ╳：$\lim_{n\rightarrow \infty} \frac{3n^{2}}{n^{2}+101}$＝$\lim_{n\rightarrow \infty} \frac{3}{1+\frac{101}{n^{2}}}$＝3

    故選(A)(B)'
