  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：循環小數必為有理數

    (B) ○(C) ╳：0.$\overline{34}$＝0.34＋0.0034＋……＝$\frac{\frac{34}{100}}{1-\frac{1}{100}}$＝$\frac{34}{99}$

    (D) ╳：0.3$\overline{2}$＝0.3＋（0.02＋0.002＋……）＝$\frac{3}{10}$＋$\frac{\frac{2}{100}}{1-\frac{1}{10}}$＝$\frac{3}{10}$＋$\frac{2}{90}$＝$\frac{29}{90}$

    (E) ○：0.3$\overline{43}$＝0.3＋（0.043＋0.00043＋……）

    ＝$\frac{3}{10}$＋$\frac{\frac{43}{1000}}{1-\frac{1}{100}}$＝$\frac{3}{10}$＋$\frac{43}{990}$＝$\frac{340}{990}$＝$\frac{34}{99}$＝0.$\overline{34}$

    故選(B)(E)'
