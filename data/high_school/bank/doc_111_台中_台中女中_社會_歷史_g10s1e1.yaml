  answer_status: verified
  answer_source: answer_key
  explanation: 〈東番記〉為 17 世紀初陳第隨軍來臺平剿海盜，記錄在臺灣所經歷的人事物雜記。當時荷蘭人尚未來臺，因此其所遇見的「番人」為粗俗無文的西拉雅族，(D)為正解。(A)(B)(C)皆為清朝時期的情景。
