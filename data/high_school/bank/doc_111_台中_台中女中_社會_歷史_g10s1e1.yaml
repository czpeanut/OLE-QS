  stem: 請問文中的○○所指應為何人？
  options:
  - label: A
    content: 劉銘傳
  - label: B
    content: 沈葆楨
  - label: C
    content: 陳永華
  - label: D
    content: 施琅
  group_stem: '以下四段資料分別為日治時期的日本人、日治時期的臺灣人、當代臺灣學者、當代的大陸學者對某位官員治臺的評價：

    資料一：○○的貢獻是加強臺灣與大陸的政治、經濟、文化聯繫。保衛臺灣，維護祖國統一；建設臺灣，安撫少數民族。

    資料二：○○是清政府時代進步的政治家、臺政之刷新者。其經營實況，應以為借鏡。

    資料三：三百多年來臺灣只有兩個能吏，其中之一就是「管商之流亞」的○○，其功業足與臺灣不朽。

    資料四：○○的施政固然有大環境不利的因素，而無法續行；但改革過程中南北施政的偏差、清丈土地的不徹底、民心不服及吏治不良等方面，的確多有缺失。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料二提到○○是清政府時代進步的政治家，可知(C)(D)不選。另外，由於資料四中提及○○曾有「清丈土地的不徹底」，則可推知此人為實施清賦的(A)劉銘傳。
