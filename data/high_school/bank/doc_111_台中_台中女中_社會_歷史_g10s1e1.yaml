  stem: 「今臺灣新復，僻處海邊。安可一日忘戰？爰師古制，……分赴南北開墾，使野無曠土，而軍有餘糧。三年之後，乃定賦稅，農隙之時，訓以武事，俾無廢馳。有事則執戈以戰，無事則負耜租而耕，然後兵精食足，可以圖長治而謀進取也。」這份資料提出的背景為何？
  options:
  - label: A
    content: 鄭氏到臺灣後，為解決軍民糧食問題所發的文書
