  stem: 老師在上課時以「頂下郊拚」和「金廣福墾號」為例，請同學討論從這兩個例子看到的清領臺灣社會。下列哪一組的發言最適當？
  options:
  - label: A
    content: 反映出不同祖籍間的械鬥非常激烈
  - label: B
    content: 可以發現臺北盆地的開發與繁榮的脈絡
  - label: C
    content: 能了解經濟利益下移民的衝突與合作
  - label: D
    content: 能夠看出士紳階級在臺灣日漸興起
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '「頂下郊拚」為來自泉州府不同縣治的商人集團為搶奪艋舺利益而械鬥，「金廣福墾號」則為官方協調下，由閩、粵籍人士合作開墾新竹東南山區。兩者皆可以反映出清治時期的臺灣社會在經濟利益驅使下，各族群彼此既衝突又能合作的現象，(C)為正解。

    14.1933 年時，中日雙方尚未正式開戰，但自九一八事變後，兩國的關係亦日趨緊張，談不上親密和善的程度，但卻能在臺北舉行雙十國慶酒會並高呼「中華民國萬歲」，因此最有可能為在臺的中國僑民所舉辦，(C)為正解。(A)滿洲國為當時名義上為獨立政權，其官員不可能舉辦雙十國慶活動。(D) 1933 年尚未推行皇民化運動。

    15.沈葆楨為避免列強勢力再以「番地無主」為藉口侵擾臺灣，特於山區增設行政區，其中之一為(A)卑南廳。(B)與原住民無關。(C)劉銘傳時改卑南廳為臺東直隸州。(D)嘉慶年間已設。

    16.(甲)當代的原住民族教育政策，(乙)清治時期，(丙)日治時期，(丁)荷治時期的傳教方式，因此時間依序為(C)(丁)(乙)(丙)(甲)。

    17.(A)贌社制度目的在蒐集原住民的鹿皮以供應對外貿易。(B)原住民多被剝削，甚至激起反抗。(C)贌社制度乃利用漢人經營番社買賣，可見荷蘭採間接統治。

    18.附表顯示，這 40 年來臺灣總人口數介於 300 萬～ 600 多萬，可知此時臺灣應處於日治時期，當時並無(B)外省人、(D)東南亞移工兩種族群。(A)原住民的人數在此期間不可能有如此明顯的成長。因此甲族群應為(C)日本人。

    19.這位學者主張清代臺灣社會的發展，傾向於向中國學習、變成與中國完全相同的社會，此即「內地化」理論，選項中僅(D)符合其主張。(A)(B)(C)三者皆為認同臺灣的「在地化」例證。

    20.資料一談「臺民自主，權攝臺政」，應為臺灣民主國；資料二有「大明慈悲國」，故為 1915 年的噍吧哖事件；資料三提到毒氣、機關槍與飛機，故為 1930 年的霧社事件；資料四的林少貓為乙未抗日時期的抗日三猛之一。四則資料按時間先後順序應為(B)一四二三。

    21.小林躋造為使本島人和內地人沒有差別，於 1936 年底開始推行皇民化運動，其政策措施為(A)。(B)(C)日治初期已實施。(D) 1919 年後的同化政策。

    22.由於當時臺灣已開發地區有限，稅收不足而難免造成清廷的財政負擔，但在消極治臺、為防臺而治臺的情況下，清廷採取的措施為(A)。(B)清治初期實施「渡臺禁令」，未鼓勵移民來臺。(C)清初實施班兵制度，至林爽文事件後才開辦臺勇。(D)光緒年間，沈葆楨的建議。

    23.資料一、二皆可明顯看到通事、社棍、社商剝削番社，資料三則設巡臺御史並規定按年巡歷番黎，可推知當時漢人侵害剝削原住民利益的現象極為嚴重，(C)為正解。

    24.原本清朝官員規定「生子命名必須加上父親之名」，符合原住民的親子連名習俗，但有學識或從事公職者對此感到不悅，於是不少人又改成漢名，可見平埔族受到漢人影響，而使用漢人姓名，(B)為正解。

    25.清廷治臺二百多年期間，多次調整臺灣地方行政區劃，時間點皆在民變或戰亂之後，可知其最主要的考量依據為(A)國防、治安因素。

    26.18 世紀前期發生的(D)大甲西社事件為清治時期規模最大的原住民抗清事件，最後朝廷採取「以番制番」方式才順利平定，同時也使中部的「大肚王國」正式宣告瓦解。(A)發生於日治時期的 1930 年。(B) 1874 年。(C)發生於荷治時期。

    27.乙為《六三法》，使臺灣總督擁有極大的權力；丙為《三一法》，開始限縮總督的立法權；甲為《法三號》，在臺地直接實施日本本土法律，因此先後順序為(C)乙、丙、甲。

    28.甲方帶著物產獻給乙方，兩者形成封貢的從屬關係，應為荷治時期對臺灣原住民族的統治方式，因此甲方與乙方分別為(B)原住民部落長老、荷蘭東印度公司官員。

    29.從「用漢字，說國語」的線索，可推知為國民政府剛開始統治臺灣的階段，(C)為正解。

    30.某人的回憶中有提到「改姓名」的部分，可推知此時應為皇民化運動時期，故選(C)。

    31.從「三藩殄滅」一句，可知此時三藩叛變事件已遭平定，因此康熙皇帝想要招降臺灣的鄭氏政權，此「足下」應為(D)鄭經。

    32.16 世紀中後期，荷蘭尚未統治臺灣，當時僅有少數漢人海商、甚至倭寇以臺灣為據點，因此題幹中的日本聚落最可能為(D)。

    33.從「骨肉隔絕四十年」往前推算為 1940 年代，可推知「想家」的人應是國共內戰後遷來臺灣的老兵，(D)為正解。

    34.「立石禁入番地」表示清廷開始實施劃界封山政策，此在(A)朱一貴事件後，基於國防、軍事考量及避免原漢持續衝突而實施。做法為在接近生番處立石為界及修土牛溝，並禁止漢人越界私墾。

    35.雖然臺灣民風強悍，甚至會「聚眾挾官」，但劉銘傳很清楚許多民變與分類械鬥的發生，實則與吏治不良相關，因此(C)官吏逼迫才是林爽文事件的主要原因。(A)林爽文雖是天地會成員，但從其起事文告來看，與反清復明無關。(B)當時清廷並未清丈土地。(D)當時臺灣屬於福建省，並無語言不通問題。

    36.甲區人口一直最多，應為南部；乙區人口初為第二，後被丁區追上，應為中部；丙區人口一直最少，故為東部；丁區則為北部。因此(B)為正解。

    37.17 世紀大航海時代，荷蘭、西班牙在重商主義的驅使下，皆以東方的中國、日本為重要貿易對象。由於荷蘭占領臺灣，與中國、日本的貿易遠較占領菲律賓的西班牙有地理優勢，因此西班牙在獲悉荷蘭僅占有南臺灣之後，亦決定進駐臺灣與之相抗，故(A)為正解。

    38.早期日本的移民村多設立在東部的(C)花東一帶，如吉野村即是今日花蓮吉安鄉；1930 年代後，才有部分移民村設立於西部內陸平原。

    39.1980 年代要求「恢復姓名」的族群應為(C)原住民族群。多數原住民族原本採取親子連名制來維繫家族血親關係，但因為被迫採用漢人的姓名而導致血親關係紊亂，因此要求恢復族名以重新建立家族血親關係。

    40.1931 年九一八事變後，日本逐漸占領中國東北，並於翌年成立滿洲國，由於需要大量能通中文與日文的通譯與人力協助，臺灣人因此成為日本統治者的最佳助手，所以有大批臺灣人「過滿洲」，故(C)為正解。'
