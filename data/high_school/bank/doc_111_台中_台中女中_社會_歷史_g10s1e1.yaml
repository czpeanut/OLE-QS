  answer_status: verified
  answer_source: answer_key
  explanation: '文中第一段提到《諸羅縣志》、《臺灣縣志》、《鳳山縣志》三本地方志，皆記載早期廣東潮州人進入屏東是以佃耕、傭工為生。另外，20 世紀初的一件土地訴訟中，也有閩籍地主控訴屏東的客家佃戶侵奪土地。兩者皆可說明清初客家移民係以佃戶身分進入屏東平原。

    Ⅱ. 清朝自中國大陸來臺的移民以泉州籍、漳州籍、客家籍三者為主，由於原鄉習慣、先來後到與分類械鬥後的遷徙結果，大抵上泉州人分布在沿海地區，漳州人多在內陸平原從事農耕，客家人則分布在北部桃竹苗山區與南部高屏沿江平原一帶。因此，甲集中在偏內陸山區的族群應為廣東籍的客家人；乙集中在西部沿海區域的族群應為泉州籍人士；丙分布在不靠海的平原地區，故為漳州籍人士。

    Ⅲ.'
