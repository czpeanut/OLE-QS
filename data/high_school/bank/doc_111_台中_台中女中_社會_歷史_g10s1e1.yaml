  stem: 晚明文人陳第曾經來臺，寫下〈東番記〉，記載當時他在臺灣的所見所聞，雖不免帶有主觀立場，但可以作為我們了解當時臺灣社會的樣貌。根據你的歷史知識判斷，下列哪一段文字，會是出自〈東番記〉的記載？
  options:
  - label: A
    content: 生番群聚內山，熟番錯居社地，漢民散處各莊，自應劃清界線，各管各地
  - label: B
    content: 番童拱立背誦，……已有讀「四子書」、習一經者
  - label: C
    content: 居民七十九家，計二百五十七人，……皆丁壯力農，無妻室，無老耆幼童
  - label: D
    content: 族又共屋，一區稍大，曰公廨，少壯未娶者，曹居之，議事必於公廨，調發易也
  answer:
