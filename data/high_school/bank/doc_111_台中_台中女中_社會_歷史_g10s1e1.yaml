- id: doc_111_台中_台中女中_社會_歷史_g10s1e1_s3_1
  section: 3
  number: 1
  type: single
  page: 7
  stem: 根據上文所述，客家移民取得「義民」身分的主要意義是什麼？
  options:
  - label: A
    content: 獲得政府支持，爭取生存空間
  - label: B
    content: 平定社會動亂，恢復政治秩序
  - label: C
    content: 突破閩粵界線，避免分類械鬥
  - label: D
    content: 強化族群凝聚，擴大客家版圖。（以代號作答）
  group_stem: 'Ⅰ. 康熙 50 年代中期，府城地區官紳編輯的《諸羅縣志》、《臺灣縣志》、《鳳山縣志》等三本地方志，都不約而同提到了屏東地區「客」或「客仔」的特色：祖籍廣東潮州，以佃耕、傭工為生；喜聚居，善鬥健訟。根據當代所做的田野調查，當地傳說強調「客家」移民是在獲得官方的土地開發許可證（墾照）後，移墾屏東平原。另外，20 世紀初的一件土地訴訟中，來自臺南地區的閩籍地主提出了清代官方發給的屏東地區墾照，控訴屏東地區的客家佃戶侵奪了他們的土地。綜合來看，清初客家移民應是以佃戶的身分進入屏東平原，並逐漸掌握當地土地開墾，進而引起與閩南地主的緊張關係。 康熙 60 年，朱一貴事件爆發，屏東平原的客家聚落很快整合了七十幾個大小村莊，號召約 12,000 人的武裝部隊，協助政府軍隊平定亂事。事件之後，屏東客家因協助政府平亂而被授予「義民」身分，當地並建立「忠義亭」供奉聖旨牌位，藉以強調自己與政府之間的緊密關係。從此「客仔」成為「義民」，取得合法開墾土地，以及與閩南移民抗爭的地位。

    （資料出處：李文良，〈從「客仔」到「義民」：清初南臺灣的移民開發和社會動亂〉）'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 文中提到朱一貴事件之後，「屏東客家因協助政府平亂而被授予『義民』身分」，同時得以「取得合法開墾土地，以及與閩南移民抗爭的地位」，因此答案選(A)，而不選(B)。
