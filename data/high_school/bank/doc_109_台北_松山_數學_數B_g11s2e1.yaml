  answer:
  - (1) ( 2 , 2 , 2$\sqrt{3}$ ) (2) ( 4 , 1 , 0 ) (3) $-\frac{1}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: (1) 設P在平面OABC的投影點為P'，可知$\overline{BP'}$＝2$\sqrt{2}$，$\overline{BP}$＝2$\sqrt{5}$ ⇒ $\overline{PP'}=\sqrt{\overline{BP}^{2}+\overline{BP'}^{2}}=2\sqrt{3}$，故頂點P的坐標為 ( 2 , 2 , 2$\sqrt{3}$) (2) 設Q ( 4 , t , 0 )，其中0 ≤ t ≤ 4，可知C ( 0 , 4 , 0 ) ⇒ $\overline{CQ}$＝$\sqrt{4^{2}+(t-4)^{2}}$＝5 ⇒ t－4＝±3 ⇒ t＝1 ⇒ Q點坐標為 ( 4 , 1 , 0 ) (3) 設$\overline{CM}$垂直$\overline{PB}$於M點，且$\overline{BM}$＝k，可知$\overline{PM}$＝2$\sqrt{5}$－k ⇒ $\overline{CM}^{2}=\overline{PC}^{2}-\overline{PM}^{2}=\overline{BC}^{2}-\overline{BM}^{2}$ ⇒ 20－( 20－4$\sqrt{5}$k＋$k^{2}$ )＝16－$k^{2}$ ⇒ k＝$\frac{16}{4\sqrt{5}}$＝$\frac{4}{\sqrt{5}}$ ⇒ $\overline{CM}=\sqrt{16^{2}-(\frac{4}{\sqrt{5}})^{2}}=\frac{8}{\sqrt{5}}$ 又$\overline{AM}=\overline{CM}=\frac{8}{\sqrt{5}}$，$\overline{AC}=4\sqrt{2}$，∠AMC＝θ，所以由餘弦定理 可得cosθ＝$\frac{(\frac{8}{\sqrt{5}})^{2}+(\frac{8}{\sqrt{5}})^{2}-(4\sqrt{2})^{2}}{2\times \frac{8}{\sqrt{5}}\times \frac{8}{\sqrt{5}}}$＝$\frac{-1}{4}$
