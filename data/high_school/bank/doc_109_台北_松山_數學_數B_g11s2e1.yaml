  stem: 附圖是空間中的一個四角錐P-OABC，底面為邊長4的正方形，其側面皆為腰長2$\sqrt{5}$的等腰三角形。 (1) 頂點P的坐為＿＿＿＿。 (2) 已知Q為線段AB上的一點，且$\overline{CQ}$＝5，求Q點的坐標為＿＿＿＿。 (3) 若此四角錐相鄰兩側面的二面角為$\theta$，則cosθ＝＿＿＿＿。
  assets:
