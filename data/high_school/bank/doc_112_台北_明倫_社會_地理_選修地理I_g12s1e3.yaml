  - label: B
    content: 龍泉
  - label: C
    content: 豐富
  - label: D
    content: 六塊厝
  group_stem: 照片為臺灣 4 個火車站的舊式站牌。請問：
  shared_asset: g2_39_40
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '火車集集支線位在南投，符合日月潭的地理位置，故答案選(B)龍泉。

    40.4 個車站均與溪流相鄰，河口堆積物質的平均粒徑要最大，代表該河段要位居山區，花蓮太魯閣較高海拔，故答案選(A)新城。

    41.如題圖所示，小明應在山頭的南偏西 45 度的 1 公里處，(B)乙正確。

    42.X 坐標為 250 時，代表正位在東京 121 度投影線上，因此 X 越遠離 250 代表離東經 121 度越遠，(C)丙正確。

    43.「窩」為客家族群形容相對平坦的地形（多見於桃竹苗一帶），與(B)中壢的壢字命名地緣性相同。

    44.(A)廣邀社區民眾參與步道認養與維護，屬於公眾參與的一環。

    45.以步行及單車探索，範圍不宜太大，大比例尺地圖（含括範圍小）最適合，故答案選(A) 1／1,000 街道圖。

    46.(A)記錄步道只需要 GPS 軌跡，但要整合全臺的千里步道資料，需要 GIS 整合所有步道的空間與屬性資料。

    47.基輔方向為 260 度方位角，正北方為 360 度角處，應為(C)。

    48.(A)烏克蘭為溫帶草原氣候，土壤為草原黑土，適合小麥生長。

    49.此圖為極方位投影法，投影圓心往外均為大圓航線，故答案選(A)。

    50.拉布拉多寒流位北美東側，(C)丙丁均會受影響。'
