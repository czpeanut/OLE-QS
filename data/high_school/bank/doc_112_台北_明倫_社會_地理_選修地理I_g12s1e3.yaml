  stem: 人口只有 778 人的奧地利小鎮哈爾施塔特（Hallstatt），被認為是迪士尼皮克斯動畫《冰雪奇緣》系列中艾倫戴爾王國真實版。電影上映後的推波助瀾造成 Instagram 上的「#Hallstatt」標籤，還被評為「全球最值得拍照上傳到 Instagram 的城市。」然而這座小鎮，近年來被觀光客侵擾到苦不堪言，遊客為了拍照取景，拿著自拍棒，冒險攀爬至高處、踩踏房舍，只是為了在社群軟體上炫耀，而不是真正想要體會小鎮靜謐的美好。此外，超級市場和便利商店開始優先考慮進貨的商品是紀念品，而不是新鮮水果和蔬菜，這也導致鎮上的時蔬價格開始變得昂貴。上文的現象說明了何種地理媒體的傳播對日常生活造成的影響？
  options:
  - label: A
    content: 強化人際的連結
  - label: B
    content: 增強即時性的回饋
  - label: C
    content: 改變空間的意涵
  - label: D
    content: 促進公眾事務的參與
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 靜謐小鎮因社群的推波助瀾，成為觀光熱區，造成當地居民的生活空間驟變，屬於(C)改變空間的意涵。
  tags:
    unit:
      code: GE-S1-4-1
      book: 選修地理I 空間資訊科技
