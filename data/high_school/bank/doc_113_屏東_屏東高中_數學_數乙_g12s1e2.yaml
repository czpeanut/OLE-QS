  - label: B
    content: '1'
  - label: C
    content: '2'
  - label: D
    content: －1
  - label: E
    content: －2
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '因為 f（x）在 x＝1 處可微分，所以 f（x）在 x＝1 處連續

    $\lim_{x\rightarrow 1^{+}} \frac{f(x)-f(1)}{x-1}$＝$\lim_{x\rightarrow 1^{-}} \frac{f(x)-f(1)}{x-1}$

    ⇒$\lim_{x\rightarrow 1^{+}} \frac{(ax+b)-(a+b)}{x-1}$＝$\lim_{x\rightarrow 1^{-}} \frac{x^{2}-1}{x-1}$

    ⇒$\lim_{x\rightarrow 1^{+}} \frac{a(x-1)}{x-1}$＝$\lim_{x\rightarrow 1^{-}} \frac{(x+1)(x-1)}{x-1}$

    ⇒$\lim_{x\rightarrow 1^{+}} a$＝$\lim_{x\rightarrow 1^{-}} (x+1)$

    ⇒a＝2

    故選(C)'
