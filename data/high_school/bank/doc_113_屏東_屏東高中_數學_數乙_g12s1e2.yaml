  options:
  - label: A
    content: 2x＋y－4＝0
  - label: B
    content: 2x－y＝0
  - label: C
    content: x＋2y＋6＝0
  - label: D
    content: x－2y－1＝0
  - label: E
    content: y 軸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '直線 L 的法向量$\vec{n}$＝（1，3）

    (A)$\vec{n_{1}}$＝（2，1），cosθ$_{1}$＝$\frac{| 2+3 |}{\sqrt{10} \cdot \sqrt{5}}$＝$\frac{5}{\sqrt{50}}$

    (B)$\vec{n_{2}}$＝（2，－1），cosθ$_{2}$＝$\frac{| 2-3 |}{\sqrt{10} \cdot \sqrt{5}}$＝$\frac{1}{\sqrt{50}}$

    (C)$\vec{n_{3}}$＝（1，2），cosθ$_{3}$＝$\frac{| 1+6 |}{\sqrt{10} \cdot \sqrt{5}}$＝$\frac{7}{\sqrt{50}}$

    (D)$\vec{n_{4}}$＝（1，－2），cosθ$_{4}$＝$\frac{| 1-6 |}{\sqrt{10} \cdot \sqrt{5}}$＝$\frac{5}{\sqrt{50}}$

    (E) y 軸即 x＝0，$\vec{n_{5}}$＝（1，0），cosθ$_{5}$＝$\frac{1}{\sqrt{10} \cdot 1}$＝$\frac{1}{\sqrt{10}}$＝$\frac{\sqrt{5}}{\sqrt{50}}$

    ∵cosθ$_{3}$＞cosθ$_{1}$＝cosθ$_{4}$＞cosθ$_{5}$＞cosθ$_{2}$

    ∴θ$_{3}$＜θ$_{1}$＝θ$_{4}$＜θ$_{5}$＜θ$_{2}$，θ$_{2}$ 最大

    故選(B)'
