- id: doc_113_屏東_屏東高中_數學_數乙_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 當 x＝2 時，f（x）＝$2x^{2}$－x＋3 的導數為
  options:
  - label: A
    content: －7
  - label: B
    content: '7'
  - label: C
    content: －8
  - label: D
    content: '8'
  - label: E
    content: '9'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '所求為 f''(2)＝$\lim_{x\rightarrow 2} \frac{f(x)-f(2)}{x-2}$

    ＝$\lim_{x\rightarrow 2} \frac{(2x^{2}-x+3)-(2\times 2^{2}-2+3)}{x-2}$

    ＝$\lim_{x\rightarrow 2} \frac{2x^{2}-x-6}{x-2}$＝$\lim_{x\rightarrow 2} \frac{(2x+3)(x-2)}{x-2}$

    ＝$\lim_{x\rightarrow 2}$（2x＋3）＝7

    故選(B)

    〔另解〕

    ∵f''（x）＝4x－1 ∴f''(2)＝4×2－1＝7

    故選(B)'
