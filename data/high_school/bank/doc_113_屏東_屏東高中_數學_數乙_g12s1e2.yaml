    content: f（－3）＝2
  - label: B
    content: $\lim_{x\rightarrow -3} f(x)$＝2
  - label: C
    content: $\lim_{x\rightarrow -1} f(x)$不存在
  - label: D
    content: $\lim_{x\rightarrow 1^{-}} f(x)$＝f(1)
  - label: E
    content: f（x）在 x＝2 可微分
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_113_屏東_屏東高中_數學_數乙_g12s1e2/s2_1_f1.png
    crop:
      page: 3
      rect:
      - 251.25
      - 140.6
      - 366.8
      - 239.35
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：由題圖可知 f（－3）＝1

    (B) ○：由題圖可知$\lim_{x\rightarrow -3^{+}} f(x)$＝$\lim_{x\rightarrow -3^{-}} f(x)$＝2

    ∴$\lim_{x\rightarrow -3} f(x)$＝2

    (C) ╳：由題圖可知$\lim_{x\rightarrow -1^{+}} f(x)$＝$\lim_{x\rightarrow -1^{-}} f(x)$＝3

    ∴$\lim_{x\rightarrow -1} f(x)$＝3

    (D) ○：由題圖可知$\lim_{x\rightarrow 1^{-}} f(x)$＝f(1)＝2

    (E) ○：由題圖可知，當 x ≥ 1，函數 f（x）為線型函數

    令 f（x）＝ax＋b，a＞0

    $\lim_{x\rightarrow 2^{+}} \frac{f(x)-f(2)}{x-2}$＝$\lim_{x\rightarrow 2^{+}} \frac{ax+b-(2a+b)}{x-2}$＝$\lim_{x\rightarrow 2^{+}} \frac{a(x-2)}{x-2}$＝a

    $\lim_{x\rightarrow 2^{-}} \frac{f(x)-f(2)}{x-2}$＝$\lim_{x\rightarrow 2^{-}} \frac{ax+b-(2a+b)}{x-2}$＝$\lim_{x\rightarrow 2^{-}} \frac{a(x-2)}{x-2}$＝a

    ⇒$\lim_{x\rightarrow 2} \frac{f(x)-f(2)}{x-2}$＝a

    故函數 f（x）在 x＝2 可微分

    故選(B)(D)(E)'
