  stem: 總統蔡英文上任時最重要的政策之一就是「居住正義」，目標是在 8 年內蓋成 20 萬戶社會住宅，包括 12 萬戶直接興建，與 8 萬戶社會住宅包租代管。2022 年 8 月《社會住宅推動聯盟》公布六都社會住宅成績單（含規劃設計中），臺北市總量為 20,429 戶，達成率為 78.6 ％；臺中市總量為 7,146 戶，達成率為 51 ％；桃園市總量為 7,195 戶，達成率為 48 ％；新北市總量為 8,837 戶，達成率為 26.8 ％；臺南市總量為 1,758 戶，達成率為 25.1 ％；高雄市總量為 2,939 戶，達成率為 24.5 ％。臺北市達成率最高，但房價與租金負擔相對來說也是最嚴重地區。儘管我國的社會住宅起步較多數西方國家晚，在土地價格與建材都已上漲的今日，房價居高不下成為世代沉重負擔，即使在 8 年內衝到 20 萬戶的目標，占比也僅有 2.3 ％。關於中央與地方興建社會住宅的敘述，下列何者正確？
  options:
  - label: A
    content: 興建社會住宅是國家既定政策，不需考慮其成本
  - label: B
