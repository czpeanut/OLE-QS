  - label: C
    content: 興建社會住宅無法回本，內政部不願做賠本生意
  - label: D
    content: 臺北市政府興建社會住宅的成本最低，故效率高
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當同樣需要考量成本。(C)維護居住正義為國家的責任之一。(D)由題幹中無法得知興建社會住宅的成本。故本題選(B)。
