  stem: 國慶連假期間發生多起外送員車禍事件，外送員與外送平臺業者間到底是承攬還是僱傭契約，引起眾人討論。若為承攬契約，代表沒有工時上下限，業者不需負擔外送員勞、健保；若是僱傭契約，則代表有工時規定，業者須替外送員投保勞、健保，並提撥退休金。如果業者增加這些成本，不少外送員表示擔心個人薪資恐會受影響。目前勞動部正積極規劃研擬保障外送員權益相關制度。請問下列對於政府可提供的政策誘因，何者敘述正確？
