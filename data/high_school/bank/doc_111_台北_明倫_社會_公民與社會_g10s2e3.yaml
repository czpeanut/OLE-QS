  stem: 政府推動公共政策之前，都會要求行政執行機關進行「成本效益評估」，若評估結果「效益大於成本」才會推動。一般而言，通常以金額可以衡量的效益大於為此政策編列預算的成本。但是，有些公共政策即使是「血本無歸」的成本大於效益，政府基於社會的公平正義仍必須執行。這些政策應為下列何者？
