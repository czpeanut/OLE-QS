  stem: 過去虞犯制度以預防少年犯罪為本旨，是我國現行少年司法制度特色之一。但是虞犯少年並未觸法，相同行為在成年人是不受處罰的，因此修法後將改稱為曝險少年。而對於曝險少年將採取何種處置作為？
