  section: 1
  number: 39
  type: single
  page: 8
  stem: 小華因被控涉及一件擄人勒贖案件而遭到檢察官起訴，在審判程序中，小華主張警察刑求逼供才自白承認犯行；檢察官則提出警察筆錄製作時錄音錄影內容，無法證明有逼供之事實，因此主張小華自白是有證據能力。但法院認定警察詢問筆錄之過程，錄音錄影雖無刑求逼供事實，但因錄音錄影為全程連續中間有停頓，「不排除停止錄音錄影期間有刑求逼供之可能」，且小華在第二段錄影中有畏懼之表情，且嘴角泛血瘀青，據此，判決小華無罪。且小華除了自白書外，別無其他證據證明其有參與擄人勒贖的事實。請問就我國刑事訴訟制度而言，由檢察官提出公訴，再由法官判決，是在實踐什麼原則？
  options:
  - label: A
    content: 審檢分立
  - label: B
    content: 罪刑法定
  - label: C
    content: 從舊從輕
  - label: D
    content: 無罪推定
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由檢察官提起公訴，再由法官進行判決。屬於檢審分立的概念，故本題選(A)。(B)罪刑法定主義指，行為之處罰，以行為時之法律有明文規定者為限，與此處無關。(C)刑法原則從舊，但新法罰責減輕則適用新法。與此處無關。(D)無罪推定指未經由法官判決有罪之前，皆應推定為無罪。與此無關。故本題選(A)。
