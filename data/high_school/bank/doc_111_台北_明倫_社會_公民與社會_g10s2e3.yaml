  page: 10
  stem: 迪士尼的白雪公主原本與國王一起生活，後來國王娶了新皇后，新皇后與國王約定彼此之間的財產互不隸屬，各自管理處分並向法院登記，後來皇后因為忌妒白雪公主的美貌而將其逐出皇宮。逐出皇宮後的白雪公主昏倒在森林裡，醒來後撥電話給 20 年沒聯絡的王子，兩人通話完決定隔天去戶政機關登記成為夫妻，兩人婚後生下了 7 個小矮人，從此過著幸福快樂的日子。10 年後國王因病過世，留下的遺囑寫著：「本人全數遺產 1,000 萬皆交由白雪公主繼承。」由於白雪公主與國王許久沒連繫，不清楚國王是否有債務，正思考著要採用限定繼承還是拋棄繼承……。假設迪士尼國適用我國《民法》，文中角色的後續發展，何者符合法律規範？
  options:
  - label: A
    content: 若白雪公主聲請拋棄繼承，則由皇后繼承國王全部的遺產
  - label: B
    content: 依據法定財產制，皇后可先向國王請求剩餘財產差額分配
  - label: C
    content: 假設遺囑有效，皇后、小矮人皆可向白雪公主主張特留分
  - label: D
    content: 假設國王未留下債務，白雪公主至少可繼承 750 萬元遺產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)白雪公主屬於血親繼承，因此拋棄繼承後，會將繼承權利留給後面順位，由題文無法得知國王的父母、兄弟姐妹、祖父母是否健在。(B)依據題文，國王與皇后為分別財產制。(C)小矮人非國王遺產的繼承人，無法主張特留分。(D)若無遺囑，國王 1,000 萬遺產將平分給皇后與白雪公主，各分得 500 萬元，但因為國王寫遺囑，把遺產都要留給白雪公主，因此皇后可主張特留分（此情行為 1∕2 應繼分），故皇后可拿到 250 萬元特留分，其餘 750 萬元將由白雪公主繼承。故本題選(D)。
