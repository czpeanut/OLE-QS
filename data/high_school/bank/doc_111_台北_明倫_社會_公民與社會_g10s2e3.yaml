  stem: 物權法定主義在維護法律的穩定、定紛止爭、減少交易成本、保障交易安全等方面意義重大。但在另一方面，法律的穩定性從某種意義上來說就是保守和僵化。物權法定主義的局限性隨著社會情勢的變化而不可避免地顯露出來了。我國於 2009 年將《民法》第 757 條的物權法定主義由「物權，除本法或其他法律有規定外，不得創設」修改為「物權除依法律或習慣外，不得創設」的物權法定主義加習慣主義。以下何者最有可能是《民法》修法的理由？
  options:
  - label: A
    content: 為避免物權法定主義過於僵化，故改以物權習慣主義為主
  - label: B
    content: 所有習慣形成之新物權，法律皆應予承認以促進經濟發展
  - label: C
    content: 本條所稱習慣係指具備慣行事實而非具有法確信之習慣法而言
  - label: D
    content: 為兼顧法秩序與經濟發展，法律未及補充新物權才許習慣填補
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 此修法的主因，是為了避免法律未能及時補充新物權才修法，故本題選(D)。
