  stem: 美國 IC 設計業者支持的《為美國生產半導體創造有益的激勵措施法案》，俗稱「晶片法案」（CHIPS Act），於 2022 年 7 月底在美國眾議院以 243 票對 187 票通過，該案價值 2,800 億美元，主要用以補貼增加美國本土生產半導體量，減少美國依賴其他國家，並抑制中國半導體業威脅。已知 390 億美元補貼半導體業者在美國蓋晶圓廠，112 億美元補貼美國本土的半導體研發。如台積電等海外業者若在美國設廠，可享有 25 ％稅收減免以購買晶圓廠設備。不過補貼也有但書，獲得補貼的業者 10 年內將不得於中國或其他不友善國家建廠或擴產先進製程。編列的 520 億美元預計超過 200 億將給美商英特爾，應是補貼額最大的受益者，該晶片法案被稱獨厚有晶圓廠業者，如英特爾、美光、德州儀器等，因此外包代工的 IC 設計業者如 AMD、輝達、高通等則抱怨法案使競爭不公平。該法案對晶片公司以及相關業者的影響，下列何者最為正確？
  options:
  - label: A
    content: 美國晶片廠商生產成本將下降
  - label: B
    content: 外國晶片廠商利潤將提高
  - label: C
    content: 美國晶片需求者能以更低價獲取晶片
  - label: D
    content: 美國政府此舉符合公平正義
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)美國補助國內晶片生產，可降低國內晶片生產的成本。(B)晶片法案補助美國晶片生產，對美國晶片廠商有利，進而使外國晶片廠商利潤下降。(C)雖然晶片開始美國國產化，但不代表美國晶片需求者可以以更低價取得晶片。(D)晶片生產與公平正義無直接關係，但分配正義也不被其他廠商所認可。故本題選(A)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 《原住民族依生活慣俗採取森林產物規則》在 2019 年 7 月生效，未來森林葉花果這類副產物，基於自用採集免申請；而原住民族基於傳統祭儀、生命禮俗及公共使用的林木需求，也可由部落或社區組織以年度為單位提案，經主管機關核准後自主管理使用。未來原住民部落成為公法人後，根據上文，其意旨為何？
  options:
  - label: A
    content: 部落公法人可向主管機關提案核准後，擁有自主管理公共使用林木的財產權
  - label: B
    content: 原住民採集愛玉子須經部落公法人向主管機關提案申請
  - label: C
    content: 原住民部落採集森林產物可販售牟利
  - label: D
    content: 原住民部落公法人為營利機關，部落頭目為公法人代表
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 成為部落公法人之後，代表具有權利能力，可以享有權利負擔義務。故本題選(A)。(B)題文提到「自用採集免申請」可知無須申請。(C)依據題文可知，只能作為傳統祭儀、生命禮俗等用途。(D)應為非營利機關。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 受國際燃料價格飆漲影響，台電做為公用性質的國營事業，2022 年至 6 月累計虧損已達新臺幣 853 億元，台電希望電價調整「反映國際現實狀況，讓財務發展健全永續」。對此，環保團體到行政院前呼籲，政府應合理調整電價，尤其針對高耗電產業大幅調高電價，才能有效落實節約用電。但工商協進會理事長卻指出，若只漲用電大戶，製造業一定出走。最終經濟部電價費率審議會做出決議，平均電價調高幅度為 8.4 ％，其中高壓、特高壓的產業用電大戶調漲 15 ％，但考量民生物價穩定性，住宅 1,000 度以下、小商家及低壓用電、高壓以上 6 大產業及高中以下學校不調整，新電價調整在 2022 年 7 月 1 日開始實施。請問環保團體的訴求與說詞，反映下列何種資源分配考量？
  options:
  - label: A
    content: 調漲用電大戶的電價，能最快彌補台電損失
  - label: B
    content: 若調漲家庭用電將流失選票，不符政治效益
  - label: C
    content: 讓工業用電大戶多出錢，補貼市民才是正義
  - label: D
    content: 調漲電費會讓用電大戶節省能源，促成節能
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依據題文，環保團體的目的應該是促成節能減碳，因此特別希望調高用電大戶的電價。(B)選票非利益團體之考量。(C)電費調整並非是用電大戶補貼市民。(D)正解。故本題選(D)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 右圖是臺酒公司生產酒精和米酒的生產可能曲線，請問針對生產過程的不同狀況，所導致生產可能線上各點及線內、線外點的變動，何者正確？
  options:
  - label: A
    content: 疫情嚴重時，生產組合會從 A 點到 B 點
  - label: B
    content: 員工日夜趕工時，生產組合會移至 C 點
  - label: C
    content: 工廠缺酒精原料時，生產組合會移至 C 點
  - label: D
    content: B 點表示生產米酒比生產酒精的效率更高
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_111_台北_明倫_社會_公民與社會_g10s2e3/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 424.65
      - 714.85
      - 564.3
      - 813.9
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)疫情嚴重時，員工無法上班，應當是會到 D 點，無法發揮最大產能。(B)日夜趕工，投入勞動力增加，會使得生產可能線向外移動。(C)缺原料生產可能線會向內移動，D 點為可能的生產組合。(D)此與選擇有關，與效率無關。線上面的點都一樣有效率。故本題選(B)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 捷運站內出現無差別條件殺人案，引發社會關注與撻伐。甚至有民眾認為應該以五馬分屍或者電刑、絞刑等極刑處置，才能撫平被害者家屬的情緒，下列關於上述刑罰制度的敘述，何者正確？
  options:
  - label: A
    content: 撫平被害者家屬情緒使得加害者受到報應，符合以牙還牙之應報理論
  - label: B
    content: 治亂世用重典在上述情形應可符合社會需求，極刑也應存在現今刑罰
  - label: C
    content: 在現代法治國家中，刑罰和犯罪能透過社會長久習慣的共識作為規範
  - label: D
    content: 司法機關應該尊重民意以配合人民期待，才不會受到人民反感
  - label: E
    content: 利用電椅、絞刑應該可以有效嚇阻潛在犯罪者，符合刑罰應報理論
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)極刑在我國仍有死刑應當存否的爭議。(C)刑罰與犯罪必須依據《刑法》規範，此屬於罪刑法定主義。(D)司法機關應獨立審判，不依據人民的期待。(E)為一般預防理論。故本題選(A)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 位在新北市某家刺青工作室，淪為車手介紹所，賴姓刺青師背地裡從事非法副業，當起車手頭，涉嫌介紹客戶 21 歲黃嫌當車手，也利誘 17 歲江姓與謝姓少年下水，每介紹 1 人酌收 3、4 千的介紹費。北投分局偵查隊獲報，執行斬手行動，報請檢察官指揮，循線查緝賴嫌等 4 人，並追查出 8 名被害人及人頭帳戶，損失金額高達近 3 百萬元。全案依詐欺罪嫌移送偵辦，賴、黃遭羈押獲准，謝姓少年遭收容在少年觀護所，江姓少年由法官裁定責付。（註：「車手」是「詐騙集團」一詞出現後附隨而來的新名詞，通常指一些不了解行騙內情，只是替詐騙集團從事跑腿領款、提款之人），《少年事件處理法》對少年犯與成人犯做出不同的處置，下列針對兩位少年，何者敘述正確？
  options:
  - label: A
    content: 少年身處在誘使其犯罪的情境之下，故兩人行為可稱為曝險少年
  - label: B
    content: 少年嫌犯皆為未成年人，故兩人的法定代理人需負連帶刑事責任
  - label: C
    content: 謝姓少年遭收容在少年觀護所，顯示其個人的司法判決已經確定
  - label: D
    content: 江姓少年由法官裁定責付，若裁定保護管束則由少年保護官執行
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)兩位少年已犯罪，已非曝險少年。(B)刑事責任並無法定代理人的連帶責任規定。(C)由題文可知，此並非是司法判決，而是裁定。故本題選(D)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 權利主體是法律運作的基礎，下列哪一選項中的「 」不屬於權利主體？
  options:
  - label: A
    content: 「中華航空公司」和工會的幹部針對罷工需求持續斡旋
  - label: B
    content: 某電子商務商家標錯價格，害「某學校班級」蒙受損失
  - label: C
    content: 「臺南市政府」在紐約時代廣場播廣告，宣傳臺南美景
  - label: D
    content: 按《原住民族基本法》規定，經「原住民族委員會核定之部落」
  explanation: (A)私法人。(B)權利主體為自然人或法人，學校班級並非是權利主體。(C)公法人即公法規定為依據所成立的法人，包括：國家、地方自治團體、行政法人。臺南市政府非權利主體，應為「臺南市」。(D)部落為公法人。故本題選(B)(C)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 法人是透過法律創設而具有權利主體的地位，不同的法人乃依照不同的法律依據設置，請問下列法人與其應法律的配對何者正確？
  options:
  - label: A
    content: 台北富邦銀行：《財團法人法》
  - label: B
    content: 臺中市和平區直轄市山地原住民區：《原住民族基本法》
  - label: C
    content: 勵馨基金會：《民法》
  - label: D
    content: 國立中正文化中心：《行政法人法》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為《銀行法》。(B)應為《地方制度法》。(C)應為《財團法人法》。故本題選(D)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 有外電報導：曾經滿身跳蚤、流浪羅馬街頭的 4 歲公黑貓托馬索，如今被認為是全球最富有的貓、第三富有的寵物，因為高齡 94 歲辭世的女飼主留給牠的現金、股票，以及羅馬、米蘭多棟房宅，加上義大利南部卡拉布里亞的土地，總價值高達 1 千萬歐元（約 4 億零 443 萬臺幣）。根據媒體披露，托馬索的女主人名叫瑪莉亞．阿桑塔，她的丈夫是位成功的建商，兩人沒有生育子女。2009 年 11 月 26 日，她立下遺囑，指示律師查驗出得以肩負照顧托馬索的動物福利單位。依照我國《民法》之規定，上述大筆遺產之「權利主體」為何？
  options:
  - label: A
    content: 托馬索
  - label: B
    content: 動物福利單位
  - label: C
    content: 瑪莉亞．阿桑塔
  - label: D
    content: 1 千萬歐元
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 權利主體為享有權利、負擔義務的自然人或法人。依據題文可知捐贈的動物福利單位應為大筆遺產的權利主體。故本題選(B)。
