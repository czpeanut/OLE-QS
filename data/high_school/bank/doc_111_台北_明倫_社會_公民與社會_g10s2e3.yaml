    content: 徵收土地開發工業區以吸引投資設廠
  - label: D
    content: 將偏遠地區兩線道公路拓寬成四線道
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 行經偏鄉或山區的公車路線，通常是賠本的路線，但基於社會公平正義，還是會補助該路線。故本題選(B)。(A)此為供不應求所以興建，應當不至於血本無歸。(C)此為經濟發展政策，非為了維護社會公平正義的政策。(D)此為違反成本效益的政策，非為了公平正義。故本題選(B)。
