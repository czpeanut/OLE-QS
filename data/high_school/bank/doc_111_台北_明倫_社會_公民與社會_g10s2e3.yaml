  stem: '住在臺東縣池上鄉的福伯，有一甲面積的農地，在目前技術水準與資源下，投入相同的資本與勞動，可以生產稻米與甘蔗的各種不同產量之生產組合如下表。依據表中資料，若以甘蔗為橫軸，稻米為縱軸，某年強烈颱風帶來狂風驟雨可能造成福伯「生產可能曲線」如何變動？

    | 生產組合 | A | B | C | D | E | F |

    | --- | --- | --- | --- | --- | --- | --- |

    | 甘蔗（單位） | 30 | 28 | 24 | 18 | 10 | 0 |

    | 稻米（單位） | 0 | 1 | 2 | 3 | 4 | 5 |'
  options:
  - label: A
    content: 整條生產可能曲線往外移動
  - label: B
    content: 整條生產可能曲線往內移動
  - label: C
    content: 生產組合點沿著原來的生產可能曲線往右移動
  - label: D
    content: 生產組合點沿著原來的生產可能曲線往左移動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 颱風帶來的豪雨將破壞農地，因此會導致整條生產可能線向內移動。故本題選(B)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 甲使用公開的網路論壇發表時事評論，某日乙在甲貼文下留言表達強烈不贊同，甲憤而將乙留言刪除，乙向甲抗議：「你侵害我的言論自由，我要去法院打官司」。不過，歷經所有訴訟審級，乙於 2022 年 3 月敗訴確定。從言論自由與權利救濟的觀點，下列敘述何者合乎我國法律規範？
  options:
  - label: A
    content: 言論自由是法律賦予的，乙的留言只在法律容許範圍內受保障
  - label: B
    content: 乙敗訴是因甲非公權力，不可能侵害乙受《憲法》保障的言論自由
  - label: C
    content: 乙得主張傳播媒體主管機關未能保障其言論自由，提起行政訴訟救濟
  - label: D
    content: 乙為維護其言論自由，可在法定期間內向憲法法庭聲請裁判憲法審查
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是憲法所賦予的。(B)個人也可能侵害他人的言論自由。(C)並非是媒體主管機關侵害乙的權利，乙無法作此種主張。故本題選(D)。
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e3_s1_12
  section: 1
