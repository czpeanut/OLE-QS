  stem: 知名賽車手小林與小陳婚後，育有二子，某日小林開著心愛的跑車載著兒子在國道上行駛，卻不知為何車子撞上路肩，導致車中駕駛小林當場死亡，且二兒子身受重傷。小林留下的婚後財產為 3,000 萬的現金，其中有 500 萬為繼承所得，100 萬為保險理賠。若小林已立遺囑，要將所有財產留給妻子。針對上述遺囑情況，下列敘述哪些正確？
