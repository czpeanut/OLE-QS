    content: 政府體制的優劣
  - label: B
    content: 人民福利的多寡
  - label: C
    content: 領土疆域的大小
  - label: D
    content: 國家主權的榮辱
  group_stem: ◎ 有關「國家論述」與「國際關係」的兩大議題，伴隨著美國與中國的衝突，「修昔提底斯陷阱」（Thucydides’ Trap）的概念，再度引起世人的關注。其結果不僅確立未來數十或數百年的世界秩序，同時將再一次驗證「修昔提底斯陷阱」是否正確？ 此一概念是由古希臘時代的歷史學家修昔提底斯提出，其著作〈伯羅奔尼撒戰爭史〉一書描述，公元前5世紀時，以雅典為首的提洛同盟與以斯巴達為首的伯羅奔尼撒聯盟之間歷時27年（431～404B.C）的一場戰爭，最後由斯巴達獲勝並埋葬希臘文化的黃金時代，但是斯巴達元氣大傷，不久遭到底比斯擊敗。 修昔提底斯認為雙方戰爭的主因包含恐懼、利益、榮譽；亦即當新興強權國家威脅或挑戰現有強權國家時，由此產生的結構性壓力將會導致衝突。而雙方均認為戰爭是影響自身最小的選擇，若沒有採取強硬措施壓制競爭對手，不僅有失顏面並可能造成毀滅性的結果。 美國哈佛大學甘迺迪政府學院院長Graham Tillett Allison以史為鑑，曾發表《修昔提底斯陷阱：美國和中國正在走向戰爭嗎？》與《注定一戰？中美能否避免修昔提底斯陷阱》。而《注定一戰：美國和中國能否逃脫修昔提底斯陷阱》一書分析過去的歷史，發現16例陷入修昔提底斯陷阱的事件，其中共有12例事件爆發戰爭，雖然其餘事件以和平收場，但是新興強權國家和現有強權國家均在行動和態度做出巨大、痛苦的調整；16例新興強權國家威脅現有強權國家地位，其中共有10例是新興強權國家成為主導強權，其餘6例則是現有強權國家壓下新興強權國家。而美國與中國如同現代版的現有強權國家與新興強權國家，其認為中美雙方可能已經陷入修昔提底斯陷阱之中，並試著提出未來可能發展的情境。
  tags:
    unit:
