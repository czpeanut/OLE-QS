  stem: 科學家研究發現，當病人服用某種藥物時，如果增加藥物攝取劑量，在一定程度上細胞可以增加藥物的吸收率；但達到某個吸收值後，進一步增加藥物的攝取量，細胞的藥物吸收率將不再提高，而且細胞在吸收藥物時並無ATP被分解，這種藥物最有可能是透過何種方式進入細胞的？
