- id: doc_109_新竹_新竹女中_自然_生物_選修生物I_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於生物體中的脫水合成反應，下列敘述何者正確？
  options:
  - label: A
    content: 十個葡萄糖合成五個麥芽糖，共脫去九個水份子
  - label: B
    content: 十個胺基酸合成兩條多肽鏈，共脫去九個水分子
  - label: C
    content: 十個水聚集成大團水分子共脫去九個水分子
  - label: D
    content: 十個甘油與十個脂肪酸形成三酸甘油酯，共脫去九個水分子
  - label: E
    content: 十個甘油與十個脂肪酸和十個含磷酸的化合物形成磷脂質，共脫去十個水分子
- id: doc_109_新竹_新竹女中_自然_生物_選修生物I_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 水是生物體內含量最多的物質，關於水的特性與對生物影響何者敘述正確？
  options:
  - label: A
    content: 水是最佳溶劑，細胞可以藉由主動運輸吸收水
  - label: B
    content: 水具有相對穩定性，因此能催化新陳代謝進行
  - label: C
    content: 植物細胞內的水所造成的膨壓，是光反應的動力來源之一
  - label: D
    content: 水進出動物細胞的膜必須不造成細胞形變，細胞才能穩定行使功能
  - label: E
    content: 水的溫度維持具有相對穩定性，藉此可以運輸物質
