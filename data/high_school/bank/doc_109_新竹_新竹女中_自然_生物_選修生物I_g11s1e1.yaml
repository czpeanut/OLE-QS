  stem: '下圖是一個水孔蛋白單體的結構，NPA處是僅容水以單一縱列一一通過的狹窄通道。請參考圖與下頁附表回答下列問題：

    (1)圖中的6個跨膜的α螺旋應是蛋白質的幾級結構？ (2)水孔蛋白是由右圖構造所形成的四聚體，請問一個有功能的水孔蛋白應具有蛋白質的幾級結構？ (3)查閱附件表中形成NPA的三個胺基酸的特性，並分別加以說明，推測NPA三肽會位於磷脂雙層膜的哪個相對位置？為何如此推測？'
  group_stem: 【水孔蛋白】 水對於生物體十分重要，儘管水分子極小，可以利用簡單擴散的方式緩慢穿過細胞膜，但對於某些組織來說，水分子必須實現快速跨膜的運移。20世紀後期，彼得．阿格雷（Peter Agre）發現了位在紅血球細胞膜上，分子量為28000的通道蛋白CHIP 28 (channel-forming intergral protein)，後來進一步證實功能為水的通道。因此，阿格雷正式將CHIP 28命名為AQP1 (Aquaporin 1)，即水孔蛋白。直至今日已有超過200種水孔蛋白被發現，從細菌、植物到動物，水孔蛋白廣泛存在所有細胞的細胞膜上，僅哺乳動物細胞膜上就具有十多種水孔蛋白，如AQP 1位於紅血球、腎或肺的細胞膜上；AQP 7位於脂肪組織、腎或睪丸的細胞膜上。水孔蛋白對於細胞的滲透壓及生理調節十分重要，如腎臟形成尿液、唾液與眼淚的形成；植物細胞的水孔蛋白在種子的萌發、氣孔的開閉等過程中也扮演了調節水分快速跨膜的轉運功能。阿格雷因此獲得2003年的諾貝爾化學獎。 AQP l水孔蛋白是由四個單體所組成的四聚體，每個單體都具有6個跨膜的α螺旋組成，各自形成一個供水分子移動的中央孔，孔的直徑稍大於水分子，約0.28 nm，長約2 nm。中央孔具有僅能運輸水的專一性，<u>這種特性與跨膜區的胺基酸序列Asn-Pro-Ala (NPA)有關</u>，容許水以每秒十億個水分子的速率快速進出細胞。值得一提的是，有些水孔蛋白對物質的通透性不僅侷限於水分子，如AQP 7對甘油也具有通透性。請根據所學過的生物學知識，回答下列兩題：
