  stem: 試回答下列有關影響酵素活性因子的問題： (1) pH改變與受質濃度改變皆會導致酵素催化的反應速率降低，這兩個因子對反應速率影響機制的差異為何？ (2)科學家已知，皮膚細胞內的酪胺酸酶接受紫外線照射後，可催化酪胺酸形成黑色素，以隔絕紫外線，這正是形成黑斑的最大原因。市售的美白淡斑劑中含有一種杏仁酸的成分，與酪胺酸具有相似的結構，可以抑制酪胺酸酶的活性，進而阻斷黑色素的形成，以達到美白淡斑的功效。試推測杏仁酸是利用何種機制達到美白淡斑的功效？
