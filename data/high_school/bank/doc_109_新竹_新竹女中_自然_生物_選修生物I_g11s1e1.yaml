- id: doc_109_新竹_新竹女中_自然_生物_選修生物I_g11s1e1_s3_1
  section: 3
  number: 1
  type: calc
  page: 3
  stem: '質離現象又稱原生質分離，是指細胞失水導致原生質膜收縮最後與細胞壁分離的現象。利用原生質分離法可測定細胞的等張溶液濃度，當視野下50％的細胞發生原生質分離時，即可推測溶液為等張溶液。小明在操作「探討紫背萬年青之等張溶液濃度」實驗時，利用紫色的細胞較透明細胞容易被觀察的條件，計算視野下紫色細胞的總數，也計算紫色細胞發生原生質分離的細胞數目。小明將實驗的結果紀錄如下表，圖如甲～丙。但小明忘記標記水埋玻片的編號了，圖也只照了三張，放大倍率皆是10*40，試依實驗結果與所學的生物學知識，幫助小明整理數據並回答下列各題。

    (1)請分別計算出實驗結果中？$_{1}$～？$_{5}$數據（計算至小數點第一位），並推測紫背萬年青等張溶液的濃度介於何者之間。 (2)若三張圖中紫色細胞的總數大約都是15個，請推測實驗時，這三張圖所代表的細胞，其浸泡的溶質濃度分別為何？ (3)請推測實驗結束時，這三張圖所代表的細胞，其膨壓由大至小的順序為何？ (4)小明在此實驗中，使用的溶質是蔗糖，小花欲將溶質改使用葡萄糖，來探討紫背萬年青之等張溶液濃度，你認為這樣操作可以達到實驗目的嗎？說出你的理由。'
