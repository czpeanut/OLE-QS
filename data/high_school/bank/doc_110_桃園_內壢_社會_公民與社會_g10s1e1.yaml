  stem: 因建構群體身分的標準非常多元，為了維持社會的穩定與和諧，避免因不同群體身分而產生的對立，必須由具有公權力的政府依憲法制定各項政策法令，來保障公民多元身分與各項平等權利。下列哪一作法有助於達成此目標？
