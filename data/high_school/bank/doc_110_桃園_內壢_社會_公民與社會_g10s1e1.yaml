  stem: 英國在2016年6月進行脫歐公投，當時有15.9%的選民投下「支持脫歐」。2017年3月，英國根據《里斯本條約》第50條啟動脫離歐盟的程序。而英國與歐盟終於在2020年底談成脫離歐盟的協議。在英國脫離歐盟之後有幾項主要的改變：一方面，英國公民到歐盟或是歐盟公民到英國短期旅遊都有90天免簽證的待遇，但如果要待更長的時間就必須另外申請簽證。英國亦將於2021年開始對移民申請實施「積分制」，此制度將會衡量年齡、英語能力、財力來判斷是否可以移民英國。另一方面，對英國而言，在脫歐之後不用配合歐盟政策接收難民，新的移民政策也可以安撫部分民眾「難民與外來移民在瓜分英國社會資源」的擔憂。依據題文訊息，下列何者最能夠說明脫離歐盟對英國的影響？
  options:
  - label: A
    content: 需更迫切處理難民問題
  - label: B
    content: 強化英國的國家自主權
  - label: C
    content: 移民政策由歐盟所主導
  - label: D
    content: 斷絕與歐盟之間的來往
