  stem: 羅興亞人在以佛教為主的緬甸社會中，屬於穆斯林少數族群。在缅甸眼中，羅興亞人是孟加拉人，孟加拉人則視他們為緬甸人，形同人球的羅興亞人，於是被聯合國認證為「地球上最受迫害的一群人」。然而，曾獲得諾貝爾和平獎的翁山蘇姬受到多數國家譴責對於緬甸若開邦的羅興亞難民不但沒有積極處理，甚至放任緬甸軍隊對羅與亞難民的「種族清洗」。在飽受軍事鎮壓之下，羅興亞人紛纷逃至孟加拉，暫時無法安全返回，但缅甸政府近日宣布，首個難民家庭，已由孟加拉遣返回緬甸，他們站在缅甸國前面，頒予身分證，也接受醫療檢查，並且由身著軍服的官員訊問。事實上，這「穆斯林」家庭取得的是不具公民身份的身分證明，且並非使用「羅興亞」一詞，所以此身分證一直為孟加拉難民營中的羅興亞領袖所拒絕。難民總署稱：「在孟國的難民表示，考慮回到缅甸之前，他們需要看到法律身分、公民資格和人身安全等各方面，有具體進展，並且可以在家鄉若開邦享有基本權利。」依據題文，緬甸與羅興亞人的衝突與下列何者相似？
  options:
  - label: A
    content: 認定精神疾病者具有隨機殺人的傾向
  - label: B
    content: 新聞標題指涉移工為「逃跑外勞」
  - label: C
    content: 電影中以非族語言語揶揄原住民族
