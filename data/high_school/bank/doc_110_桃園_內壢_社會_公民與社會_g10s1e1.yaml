  stem: 聯合國人權理事會在瑞士日內瓦召開會議，何韻詩接受非政府人組織邀請，以香港反送中事件為例，痛陳「一國兩制」接近死亡。以下擷取何韻詩發言的內容及中方提出的臨時動議： ▲何韻詩：「我是何韻詩，來自香港的歌手及民主運動人士，『維也納宣言』保障民主與人權，然而如今這些在香港卻遭受嚴重打擊，上個月有200萬人參加反對修訂《逃犯條例》的和平抗爭活動，這法案的修訂將瓦解保護香港免受中國政府干預的屏障，警察向手無寸鐵的抗議群眾，發射橡皮子彈和152枚催淚彈…」 ▲中國代表戴德茂：「副主席先生，中方行使程序性動議，香港特別行政區是中華人民共和國的組成部分，剛才這所謂的非政府組織代表發言者，發言將香港與中國並列，挑戰了一個中國原則，違反了聯合國憲章，請主席敦促其使用符合聯合國規範的正確表述。」根據中國代表戴德茂先生的發言，判斷以下何者為中國代表立場？
  options:
  - label: A
    content: 主權對內具有獨立性，他國不可干涉中國的內政
  - label: B
    content: 香港屬於中國的一部分，因此香港不可作為政治實體
  - label: C
    content: 依據主權宣示說，香港屬於擁有主權的政治共同體
  - label: D
    content: 中國與香港屬於垂直的上下關係，而非對等的平行關係
  - label: E
    content: 主權對外具有最高性，香港內部各勢力不應反抗中國政權
