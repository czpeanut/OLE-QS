    content: 「臺北法案」是針對臺北市所訂定的法案
  - label: B
    content: 「臺北法案」對美國政府具有執行強制力
  - label: C
    content: 無法加入國際組織雖然不會讓臺灣消失，卻會讓我國與全球公務體系脫節
  - label: D
    content: 如果所有國家都與我國斷交，零邦交國的處境將使我國無法在國際上生存
