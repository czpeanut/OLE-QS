  stem: 2020年美國參眾議院通過「臺北法案」，由總統川普簽署使其成為國內法，這項法案也是繼「臺灣旅行法」後，美國再一個以「臺灣」為名的國内法。此法案的重點包含加強臺美的經貿關係、支持臺灣參與國際組織以及呼籲建立對臺的外交賞罰制度，也就是當有國家採取嚴重行動傷害臺灣安全或繁榮時，應考慮「改變與該國的經濟、安全及外交接觸」。然而，「臺北法案」只是美國國會自主通過的一項友臺法案，對行政部門沒有拘束力，使臺灣成為美國壓制中國大陸的政治籌碼。亦即當美中關係處於順境時，此法當成是象徵性的具文；一旦美中兩國出現衝突，「臺北法案」便成為國會認證的法律，臺灣將成為美中談判的工具之一。對我國來說，「臺北法案」是美國國會對臺灣的友善表示，也是對近期中國一系列欺壓臺灣的一種反制措施，「臺北法案」的通過，意味著臺美關係的提升，但同時也可能使臺灣成為美國對中國施壓的棋子。(資料來源：中央社，2020/06/12)。請問下列有關上述「臺北法案」的描述，何者正確？
