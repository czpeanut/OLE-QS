questions:
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2021年9月底歐盟外交和安全政策高級代表波瑞爾與中國大陸外交部長王毅舉行戰略對話中提及臺灣，歐盟代表表示奉行一中原則，不與臺灣開展官方交往，且並不承認台灣的國家地位，但有興趣與台灣發展合作；我外交部則表示，將持續與歐盟加强關係，但我國為主權獨立國家的事實不容質疑(資料來源：2021-09-30聯合新聞網)。從上述新聞內容請判斷下列敘述何者正確？
  options:
  - label: A
    content: 我主權受頻受打壓表示臺灣政府統治不具有正當性
  - label: B
    content: 歐盟外交和安全政策代表波瑞爾認為臺灣有法理主權但沒有事實主權
  - label: C
    content: 我國存在著在國際法上法理主權與事實主權有不一致的爭議
  - label: D
    content: 主權是指一個國家的最高統治權，對內具有獨立性、對外具有最高性
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 泰國學生於2020年7月30日在曼谷發起「跑吧哈姆太郎！」示威活動，訴求包括解散國會重新改選、終止騷擾異議人士、修正軍方制定的憲法等，並把哈姆太郎之歌的歌詞「最好吃的食物是向日葵種子」改成「最好吃的食物就是人民的納稅錢」；還有「睡吧睡吧，現在是睡覺的時候」，諷刺國會議員沒在做事。上述泰國學生行使了哪些公民權利？(甲)言論自由；(乙)參政權；(丙)集會自由；(丁)結社自由
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲乙
  - label: C
    content: 甲乙丙
  - label: D
    content: 甲丙丁
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 教育部於2021年1月召開十二年國教課程審議會，會議中決定於111學年度起，本土語言（包括閩南語、客語、原住民族語與臺灣手語）於國中一年級與二年級列為必修課程。下列何者最有可能是此決議的目的？
  options:
  - label: A
    content: 以家庭教育達到復振本土語言之效
  - label: B
    content: 強化官方語言的重要性
  - label: C
    content: 促進多元文化與語言之傳承及發展
  - label: D
    content: 培養學生多語專長提升國際競爭力
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 丹麥政府日前通過國內女性禁止於公開場合穿戴面紗的法律，否則將被處以罰鍰並要求離開現場。儘管司法部長強調這是彰顯丹麥的社群價值，且主要針對被迫穿戴的女性，但許多當地穆斯林女性與人權組織仍痛批該法根本是歧視穆斯林女性的穿著。另一名接受採訪的穆斯林也認為，這條法律根本上違憲。請問：根據上文的敘述何者正確？
  options:
  - label: A
    content: 反對者認為此法已違反言論自由
  - label: B
    content: 此法律限制之權利為人身自由權
  - label: C
    content: 此法律已彰顯出多元性別的抬頭
  - label: D
    content: 穆斯林與團體爭取自身民族自決
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 日前某臺灣法律學者因入籍中國，並在南京登記戶籍，隨後我國内政部移民署依法廢止其在臺灣的戶籍。由於兩岸處於分裂分治的狀態，因此根據我國法律規定，臺灣地區人民不得在大陸地區設有戶籍或領用大陸地區護照。然而該學者認為除籍使他喪失公民權、不能請領退休金及無法參加健保，將對移民署提告。上述底線所提及之法律，最可能為下列何者？
  options:
  - label: A
    content: 《臺灣關係法》
  - label: B
    content: 《中國民國憲法》
  - label: C
    content: 《香港澳門關係條例》
  - label: D
    content: 《臺灣區與大陸地區人民關係條例》
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 聯合國的國際人權體制發展主要分成下表的四個階段。我國現階段雖非聯合國成員，亦無遵守公約之義務，但在民間人權團體多年推動下，自2009年陸續通過上述相關的「兩公約施行法」、「消除對婦女一切形式歧視公約施行法」、「兒童權利公約施行法」、「身心障礙者權利公約施行法」，表達我國落實國際人權公約的誠意和決心。從上文可了解到我國立法通過多項國際人權公約施行法，其主要的意義為下列何者？
  options:
  - label: A
    content: 賦予國際條約國內法的效力，致力提升我國各項人權保障
  - label: B
    content: 順利完成公約批准並交存聯合國的程序，實質加入聯合國
  - label: C
    content: 人權應基於國家需要選擇性適用，表彰我國的獨立自主性
  - label: D
    content: 人權非普世價值，但我國將人權法制化有助提高國際形象
