  stem: 追溯最早的民主制度源於雅典城邦，籍由官員制定政策後都須交由所有公民投票來決定。城邦的主權屬於公民，公民可以參與治理城邦的權利。公民享有權利但也須盡義務。下列有關雅典城邦的民主制度下列哪些正確？
