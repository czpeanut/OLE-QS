- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 針對臺灣如何落實人權公约的敘述，下列敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 建立國家報告及進行國際審查
  - label: B
    content: 於行政院設置國家人權委員會
  - label: C
    content: 修改不符人權公約的法令措施
  - label: D
    content: 關於保護所有移徙工人及其家庭成員權利國際公约，臺灣尚未將其國內法化
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 中國內蒙古自治區政府於2020年8月下旬，下令國中、小的課本將蒙古文改成中文，引起家長的反彈，大约有萬餘人上街抗議。示威者舉著直式書寫的傳統蒙文抗議標語，寫著「反對中國的壓迫政策」，表達內蒙古族人反對中國漢語教學的支持。依據題文訊息判斷，下列何者最有可能是內蒙古人抗議的主要原因？
  options:
  - label: A
    content: 中國政府模糊其地域認同
  - label: B
    content: 中國政府限制其宗教自由
  - label: C
    content: 中國政府剝奪其受教育權
  - label: D
    content: 中國政府弱化其民族認同
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 在中世紀時屬於人權的黑暗時期，君王可以隨意支配人民，直到啟蒙時代提出人權思想，人權才逐漸被重視，更在法國大革命、美國獨立運動中成為不可撼動的權利，而當時的「天賦人權」說，主張人權是與生俱來、天賦的自然權利，不可任意被剝奪、轉讓。請問有關於人權演進的相關敘述，何者正確？
  options:
  - label: A
    content: 人權的實踐要考慮文化差異，有些國家仍有奴隸制度，這是文化差異，和人權無關
  - label: B
    content: 文化權是十九世紀公民權利的重要內涵
  - label: C
    content: 當時天賦人權的「人權」的範圍，和當今社會的人權不同，仍有性別、財產的限制
  - label: D
    content: 社會權的興起，起源於二戰之後的重建，為了保障每個人民能夠活得下去並活得有尊嚴
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 憲法是國家的根本大法，我國亦以《中華民國憲法》及其增修條文為立國基礎，關於我國《憲法》規範與變遷，下列敘述何者正確？
  options:
  - label: A
    content: 修憲後人民得定期改選行政首長與民意代表，更能落實主權在民
  - label: B
    content: 為穩固二戰後中華民國在國際上的法理地位及正當性而進行修憲
  - label: C
    content: 為使憲法更符合國家政治現狀，將目前治權不及的領土範圍刪除
  - label: D
    content: 憲法中明定我國是民主的共和國體制，且國家主權屬於中央政府
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 美國政府如果要宣布新的對臺軍售案，下列何者是其最可能提出的政策正當性說明？
  options:
  - label: A
    content: 「一個中國、各自表述」是美國制定臺海政策時的基本原則
  - label: B
    content: 美臺簽訂之「共同防禦條約」明定美國有義務維護臺灣安全
  - label: C
    content: 「臺灣關係法」雖非國際條約，但對於政府政策具有拘束力
  - label: D
    content: 美國自冷戰初期即強力支持民主臺灣，此立場不會輕易改變
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 以色列主要是由尤太裔所組成的國家，占人口總數75%，是全球唯一以尤太人為主的國家，第二多則為阿拉伯裔，約占兩成。以色列向來被認為民族意識非常強烈，也是能夠在流亡兩千多年後重新建國的主因。然而，2018年7月以色列執政黨以國會多數優勢通過了極具爭議的《民族國家法》，將以色列定義為尤太人民族國家，唯有尤太人具備資格行使民族自決的權利。此外，也將阿拉伯語自官方語言降格為特殊語言，使希伯來語（尤太宗教語言）成為以色列國唯一官方語言。由上文可了解到何者是以色列國家認同的主要因素？
  options:
  - label: A
    content: 血緣身分
  - label: B
    content: 政治社會體制
  - label: C
    content: 歷史與文化傳統
  - label: D
    content: 經濟與軍事實力
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 臺灣於2011年實施新勞動三法，其中《工會法》對勞工組織工會之限制放寬，保障我國勞工促進團結，提高與資方進行協商的力道，進而提升勞工地位及改善勞工生活。針對上述政府透過《工會法》之立法，提升勞工地位及改善勞工生活，此一作為與下列何者屬同一權利內涵之展現？
  options:
  - label: A
    content: 三讀修正《公職人員選舉罷免法》，大幅度降低人民罷免公職人員的門檻
  - label: B
    content: 推行全民健康保險，履行我國《憲法》中對全體國民提供健康照護之責任
  - label: C
    content: 頒布課程綱要要求應將各族群母語教育列入中、小學的教學與正式課程中
  - label: D
    content: 制定《司法院釋字第748號解釋施行法》保障同性別二人可辦理結婚登記
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 全球化使得不同的國家或區域的人口、企業以及政府之間的互動與整合趨於頻繁與密切，然而我國卻因兩岸特殊的關係，在國際事務參與或互動上產生障礙。下列關於我國參與國際社會的現況，何者正確？
  options:
  - label: A
    content: 僅得以觀察員的身分受邀世界衛生大會(WHA)
  - label: B
    content: 只能在參與非聯合國體系組織時使用國家身分
  - label: C
    content: 以「中華臺北」名稱加入世界貿易組織(WTO)
  - label: D
    content: 「一中原則」是我國參與國際事務的主要障礙
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 「國家認同」意指個人對於自己所屬國家的心理歸屬感，而影響個人形成國家認同的因素非常複雜，下列關於民主國家的國家認同之敘述，何者正確？
  options:
  - label: A
    content: 通常建立在效忠屬意的國家領導者之上
  - label: B
    content: 具有國籍身分是建立國家認同必要因素
  - label: C
    content: 理論上沒有絕對性，也不侷限單一認同
  - label: D
    content: 美國以多元族群的「血緣」建立其認同
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 呱吉－邱威傑，為我國第一位以youtuber出身的議員。其於2019年首次臺北市開議時，質詢柯文哲市長有關「青年居住」的問題，質疑柯市長所興建的社會住宅價格頗高，其房租訂價相對也高，似乎無法照顧現今臺北的青年人面臨薪水低、房價高、租金高的困境。請問此青年困境主要是其哪些基本人權未能受到政府的重視與保障？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 政治權
  - label: C
    content: 社會權
  - label: D
    content: 司法人權
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: COVID-19疫情爆發至今，臺灣的防疫措施備受世界矚目。請問下列曾有的防疫措施，何者屬於我國主權之行使？(甲)凡入境旅客皆須接受14天之居家隔離(乙)向多間口罩製造商徵用一般醫用口罩(丙)各級學校向廠商購買漂白水消毒環境(丁)全面禁止高级中等以下學校師生出國
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲乙丁
- id: doc_110_桃園_內壢_社會_公民與社會_g10s1e1_s1_20
  section: 1
  number: 20
  type: single
