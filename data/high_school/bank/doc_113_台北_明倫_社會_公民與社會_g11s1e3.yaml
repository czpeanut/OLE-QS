- id: doc_113_台北_明倫_社會_公民與社會_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 我國若成功加入「跨太平洋夥伴全面進步協定」（CPTPP），關稅可能立即降為零或分期降為零，首受衝擊產案將是國產車。早期為保護國內汽車產業，進口車關稅曾高達 60 ％，加入 WTO 後逐年降至 17.5 ％，對比日本 0 關稅、美國 2.5 ％、加拿大 6.1 ％、南韓 8 ％，我國的高關稅造成進口車在國內售價偏高；另外進口車與國產車都必須課徵貨物稅、營業稅、奢侈稅。而我國對國產車的認定標準是：不論其零件、品牌、設計來自哪一國家，最後在國內車廠生產線組裝生產的車輛就是國產車。立委日前提案修正《海關進口稅則》，將進口車關稅從現行 17.5 ％降為零，行政院經濟部評估後指出，取消進口車關稅後，將減少 523 ～ 600 億元稅賦、國產車市占率跌至 20 ％、影響 847 億元相關產業、造成 8 萬人失業，直至 2031 年會沒有國產車；交通部監理所統計，市場汽車總掛牌數，進口車 20 萬輛（48.2 ％），略低於國產車。根據題意研判，下列何者「錯誤」？
  options:
  - label: A
    content: 全面調降進口車關稅，恐造成稅務、國產車廠及相關生產鏈與從業人員之不利發展
  - label: B
    content: 汽機車產業發展具經濟優勢的國家，會透過課徵關稅以保護汽機車及其上下游產業
  - label: C
    content: 立委基於「進口車的高關稅，造成高車價，導致民眾購車成本昂貴」而提案調降關稅
  - label: D
    content: 早期政府透過關稅負誘因，以保護國內汽車產業發展，並促使外商將技術與產業留臺
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)屬於課徵關稅會產生的情形。(B)課徵關稅應是保障國內弱勢的幼稚產業或夕陽產業，並非在保障優勢產業，優勢的產業應是採用鼓勵出口的貿易政策。
