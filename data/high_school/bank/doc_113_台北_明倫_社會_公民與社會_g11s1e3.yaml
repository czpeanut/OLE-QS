- id: doc_113_台北_明倫_社會_公民與社會_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 行政院主計長表示，先前二月預測經濟成長率時，考量出口穩健、防疫措施鬆綁帶動強勁的國內需求，加上基本工資調漲以及軍公教調薪 4 ％等因素，預測 2022 年經濟成長率可達 4.42 ％。然而後續受到俄烏戰爭、通膨等因素影響，四月時將經濟成長率估值下修至 4.02 ％。根據上述內容，以下敘述何者正確？
  options:
  - label: A
    content: 軍公教調薪 4 ％屬於政府的消費支出，計入我國 GDP 之支出面
  - label: B
    content: 出口與進口皆會使我國 GDP 呈正成長，使 GDP 成長率達 4.42 ％
  - label: C
    content: 在 GDP 計算公式中，國內需求若為民間消費支出，屬於移轉性支出
  - label: D
    content: 2022 年預測經濟成長率下修至 4.02 ％，表示 2022 年的經濟為負成長
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)進口會使我國的 GDP 減少。(C)消費支出非移轉性支出，移轉性支出為政府對於經濟個體的無償性支出，包括社會福利、社會保險支出以及財政補貼，例如：社會救濟金、老年津貼、身障津貼、失業救助金、出口補貼等。(D)經濟成長率只要為正值，皆屬於經濟正成長。
