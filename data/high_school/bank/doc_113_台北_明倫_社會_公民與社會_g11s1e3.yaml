- id: doc_113_台北_明倫_社會_公民與社會_g11s1e3_s2_41
  section: 2
  number: 41
  type: single
  page: 9
  stem: 阿梅在報告後，同班同學小吉問到：「請問剛剛的報告，如何看出宋朝當時的小農經濟與國際貿易能共存？」阿梅應如何回答較為合理？
  options:
  - label: A
    content: 宋朝當時因土地被北方各國侵占，可耕地有限無法進行大量生產
  - label: B
    content: 宋朝當時中國北方有許多外在威脅，政府為了軍需而增加糧食採購
  - label: C
    content: 當時因陸路貿易路線受到西夏阻斷，因而小量生產以便於海運輸送
  - label: D
    content: 由國際貿易的出口品項可看出，當時的出口品與小農經濟的生產有關
  group_stem: '以下是阿梅的報告內容，請依據本段報告內容，回答問題：

    不同於西方粗放農業，中國的農業長期都是以小農為主，然而許多人都認為國際貿易開放，特別是農產品的開放，對於小農的生計往往會造成傷害。但歷史上也發現不同的史證，以宋朝為例，南宋早期的陸路和海陸貿易皆發達，但由於西夏的建立，從周秦以來的中原和西域之間的傳統貿易路線被切斷。而海上的貿易則是宋朝貿易的主力。宋朝當時主要的出口產品相當多，包括絲綢、瓷器、糖、紡織品、茶葉等都與小農經濟相關，而進口的產品則有象牙、珊瑚、瑪瑙、珍珠、乳香、胡椒、琉璃、玳瑁等產品。因此，以小農經濟社會作為明清閉關鎖國的理由是不成立的，南宋已經證明小農經濟和對外貿易是可以並存的。

    至於宋朝為何要發展貿易，最主要的原因是錢。在當時西夏、契丹、金國不斷覬覦南宋國土的情況下，只能不斷發展貿易以維護軍力。因此，宋朝國家支出龐大，如果沒有貿易稅收，光靠傳統的土地稅收不夠支付龐大的官員薪水和軍事費用。相對之下，清朝在平定三藩、臺灣與準噶爾後，一度再無強大的外力威脅，唯一的麻煩就是東南沿海那些國外進進出出的商船與海盜，於是選擇了閉關鎖國。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提及「中國的農業長期以小農為主」、「出口產品包括絲綢、瓷器、糖、紡織品、茶葉等都與小農經濟有關」，可推論最適切的答案為(D)。
