  stem: 市場經濟制度下，經濟問題的解決主要仰賴價格機能這隻「看不見的手」的運作，但有時會發生「市場失靈」現象，有關「市場失靈」的概念，下列敘述何項正確？
  options:
  - label: A
    content: 市場失靈時，在市場自由運作下價格機能無法完全發揮其作用
  - label: B
    content: 市場失靈時，生產者剩餘與消費者剩餘加總後的社會福祉最大
  - label: C
    content: 市場失靈時，自由市場均衡點的狀態會等同於社會福利最大點
  - label: D
    content: 市場失靈時，自由市場生產的產量是最適產量，沒有無謂損失
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 市場失靈是指市場價格機能失去功用，導致經濟資源無法有效利用。在運用資源的過程中，市場只處理一部分的權益交換；沒有被處理的部分可以被看成是市場機能力有未逮的地方，故選(A)。(B)市場失靈時，社會福祉會減少。(C)市場失靈時，均衡點的社會福祉並非最大之情形。(D)市場失靈時，會產生無謂損失。
