  stem: 比特幣區塊鏈長久以來實行工作量證明機制（proof of work），要求挖礦者消耗大量能源貢獻算力才能獲得比特幣。劍橋大學替代金融研究中心估計，比特幣區塊鏈一年能源消耗量若超越 134.9 兆瓦時，就會比挪威一年能源消耗量還多。近年環保意識抬頭，虛擬貨幣造成的能源消耗和二氧化碳排放的問題開始受到關注，已有不少挖礦業者改用再生能源挖礦。環保團體也希望號召挖礦公司、投資人及支持者共同修改比特幣程式碼，藉此減少能源消耗。若以市場失靈的角度分析之，以下解讀何項正確？
  options:
  - label: A
    content: 虛擬貨幣生產者之間缺乏競爭，是造成市場失靈的主因
  - label: B
    content: 若提高對虛擬貨幣公司的課稅比例，將提高能源耗損量
  - label: C
    content: 虛擬貨幣挖礦者在目前機制下私人成本會高於社會成本
  - label: D
    content: 能源耗損與碳排問題屬外部成本，區塊鏈產業並未負擔
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是挖礦所造成的能源消耗及碳排放產生大量的汙染，此種外部性造成市場失靈。(B)課稅可使外部成本內部化，而減少能源損耗。(C)應是社會成本會高於私人成本。(D)依文中所述，可知外部成本並非由區塊鏈產業負擔，為正解。
