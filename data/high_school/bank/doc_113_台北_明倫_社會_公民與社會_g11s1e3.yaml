  stem: '中國為豬肉消費大國，對飼養豬隻所需的大豆需求極高。而美國則是世界最大的大豆生產國家。附表是假設全球大豆市場只有美國和中國兩個國家時，美國與中國貿易前後國內大豆供需統計資料，但有些數據不慎沾到墨水看不清楚。請依據下表資訊，推測下列選項何者最可能發生？

    |  | 中國 |  | 美國 |  |

    | --- | --- | --- | --- | --- |

    |  | 貿易前 | 貿易後 | 貿易前 | 貿易後 |

    | 國內價格（美金／斤） | 14 | ■ | 8 | ■ |

    | 市場需求量（萬公噸） | ■ | 8,000 | 5,000 | 4,000 |

