  stem: 有關重工業造成環境汙染與集體村的問題，下列敘述何者正確？
  options:
  - label: A
    content: 政府介入遷村計畫以降低交易成本，是「寇斯定理」的實踐
  - label: B
    content: 若人們具備充足社會資本，也能自行協商改善無主物的悲劇
  - label: C
    content: 對受汙染的居民提供遷村經費之補貼，符合外部效果內部化
  - label: D
    content: 依公共選擇理論，遷村而非遷移工業區是基於公共利益考量
  group_stem: 高雄大林蒲是全臺煙囪密度最高地區，包括中油、台電、中鋼及台船廠區陸續進駐，加上下游業者，總共近六百家石化和鋼鐵廠將大林蒲圈住，成了石化區中的生活孤島。高雄市政府統計，當地共有 880 支煙囪，加上洲際貨櫃中心啟用後，大型車輛進出頻繁，居民飽受噪音及空汙之苦，開始有了遷村的籲求，行政院已同意高雄市政府所提「一坪換一坪」的計畫，遷村正式啟動，寫下國內因環保因素集體遷村的首例。
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)寇斯定理在於界定財產權，而非降低交易成本。寇斯定理是指在交易成本很低的情況下，只要能界定財產權，人們會自動透過市場交易來解決外部效果的問題，不一定要靠政府介入。(B)社會資本充足，可理解為交易成本很低，可以自行協商無主物的財產權界定，為正解。(C)經費補貼是因為遷村的補償，與外部效果內部化無關。(D)公共選擇理論指出，如果允許個人（如政客或官僚）運用國家權威獲得利益，將成本轉嫁至他人身上，無法達到資源最佳配置，因此，國家機關必須受到嚴格控制，避免將資源從有效率的市場被奪走。可知，遷村並非基於公共利益考量。
