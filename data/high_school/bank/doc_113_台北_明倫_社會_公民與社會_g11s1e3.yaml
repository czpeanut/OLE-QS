  stem: 世界貿易組織（World Trade Organization，簡稱 WTO）至 2017 年止共有 164 個成員國，是當前最重要的國際貿易組織，對於國際的經濟貿易秩序影響甚深。下列有關世界貿易組織的敘述，何者正確？
