  stem: 英國《金融時報》報導，隨著歐洲對新能源汽車的需求增加，中國生產的電動車在歐洲銷售量翻倍暴漲，引發歐洲業者抱怨各國政府支持不夠，缺乏產業戰略，讓歐洲成了中國汽車生產業天堂。歐盟執行委員會（European Commission）於 2023 年 10 月針對中國進口電動車疑似受大量政府補貼展開調查。若調查屬實，歐盟將祭出關稅反制，則對歐洲的電動車市場最可能的影響為何？
  options:
  - label: A
    content: 對保護歐洲的電動車產業和就業機會有短期效果
  - label: B
    content: 關稅提高出口產品價格，生產者可增加貿易利得
  - label: C
    content: 對進口品加徵進口關稅，消費者剩餘會顯著增加
  - label: D
    content: 保護貿易政策對於進出口國，其總福祉皆會增加
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)應是生產者會增加成本。(C)進口商品價格提高，消費者剩餘會減少。(D)保護貿易政策會使得貿易國的經濟福祉減少。
