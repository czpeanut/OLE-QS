    label_confidence: high
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某國自甲、乙兩國進口汽車之關稅原本分別為 25 ％、40 ％，當三國均加入世界貿易組織（WTO）後，某國對甲、乙兩國進口汽車之關稅均訂為 25 ％。根據上述，下列敘述何者正確？
  options:
  - label: A
    content: 對不同國家課以相同關稅，符合國民待遇原則
  - label: B
    content: 甲國原本適用較低之關稅，符合最惠國待遇原則
  - label: C
    content: 對於甲國的關稅維持不變，符合國民待遇原則
  - label: D
    content: 對乙國的關稅調降至 25 ％，符合最惠國待遇原則
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 最惠國待遇原則即一般所稱之不歧視、無差別待遇原則，任一會員對任何國家之貿易相關措施，必須立即且無條件適用於所有會員，不得對會員有較不利之歧視性待遇；國民待遇係對本國與外國間之不歧視待遇，即任一會員對來自其他會員之輸入品所設定之內地稅或其他國內規費以及影響此輸入品在國內之販賣、採購、運送、配銷或使用的法律及命令，不得低於本國相同產品所享有之待遇。(A)(D)對不同國家課以相同關稅，屬於最惠國待遇，(D)為正解。(B)與最惠國待遇原則無關。(C)維持原有關稅與國民待遇原則無關。
