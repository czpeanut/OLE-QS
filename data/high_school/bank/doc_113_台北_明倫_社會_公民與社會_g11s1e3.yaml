- id: doc_113_台北_明倫_社會_公民與社會_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '假若國際汽車市場可分成四大區域來看，而四大區域的供給與需求如下表。如果不考慮其他條件，請問在自由貿易下，國際汽車市場的均衡價格與均衡數量分別為何？

    |  | A 區的出口供給 |  |  |  | B 區的出口供給 |  |  |  |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 價格 | 100 | 250 | 400 | 800 | 100 | 250 | 400 | 800 |

    | 數量 | 0 | 20 | 40 | 60 | 15 | 25 | 40 | 60 |

    |  | C 區的進口需求 |  |  |  | D 區的進口需求 |  |  |  |

    | 價格 | 900 | 600 | 400 | 100 | 900 | 600 | 400 | 100 |

    | 數量 | 10 | 25 | 35 | 50 | 0 | 20 | 45 | 60 |'
  options:
  - label: A
    content: 均衡價格：400；均衡數量：40
  - label: B
    content: 均衡價格：600；均衡數量：60
  - label: C
    content: 均衡價格：600；均衡數量：110
  - label: D
    content: 均衡價格：400：均衡數量：80
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: AB 區為出口供給區，CD 區為進口需求區，因此需找到同樣的價格下，AB 區的出口量等於 CD 區的進口量，即為市場均衡時之情形；表中當價格為 400 元時，AB 區的出口數量為 40＋40＝80；而 CD 區的進口數量為 35＋45＝80，故選(D)。
