- id: doc_112_台中_興大附中_數學_數A_g11s2e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設｛$A_{1}$，$A_{2}$，$A_{3}$，$A_{4}$｝為某一試驗的樣本空間 S 的一個分割，且 P（$A_{1}$）＝x， P（$A_{2}$）＝$\frac{1}{4}$，P（$A_{3}$）＝$\frac{1}{4}$，P（$A_{4}$）＝$\frac{1}{6}$。若一事件 D 滿足 P（D∣$A_{1}$）＝y， P（D∣$A_{2}$）＝$\frac{1}{6}$，P（D∣$A_{3}$）＝$\frac{1}{12}$，P（D∣$A_{4}$）＝$\frac{1}{4}$。請選出正確的選項。
  options:
  - label: A
    content: x＝$\frac{1}{3}$
  - label: B
    content: 若 $A_{1}$ 與事件 D 為互斥事件，則 P(D)＝$\frac{2}{3}$
  - label: C
    content: 若 $A_{1}$ 與事件 D 為互斥事件，則 P
  - label: D
    content: ＝$\frac{5}{48}$(D)若 $A_{1}$ 與事件 D 為獨立事件，則 P(D)＝$\frac{5}{24}$
  - label: E
    content: 若 $A_{2}$ 與事件 D 為獨立事件，則 y＝$\frac{3}{16}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：x＋$\frac{1}{4}$＋$\frac{1}{4}$＋$\frac{1}{6}$＝1 ⇒ x＝$\frac{4}{12}$＝$\frac{1}{3}$

    (B) ╳：∵$A_{1}$∩D＝∅，由 P（D∣$A_{1}$）＝$\frac{P (D \cap A_{1})}{P (A_{1})}$＝$\frac{0}{P (A_{1})}$＝0＝y

    ∴P(D)＝P（D∩$A_{1}$）＋P（D∩$A_{2}$）＋P（D∩$A_{3}$）＋P（D∩$A_{4}$）

    ＝P（$A_{1}$）P（D∣$A_{1}$）＋P（$A_{2}$）P（D∣$A_{2}$）＋P（$A_{3}$）P（D∣$A_{3}$）

    ＋P（$A_{4}$）P（D∣$A_{4}$）

    ＝$\frac{1}{3}\times 0+\frac{1}{4}\times \frac{1}{6}+\frac{1}{4}\times \frac{1}{12}+\frac{1}{6}\times \frac{1}{4}$＝$\frac{5}{48}$

    (C) ○：同選項(B)

    (D) ╳：P(D)＝P（$A_{1}$）P（D∣$A_{1}$）＋P（$A_{2}$）P（D∣$A_{2}$）

    ＋P（$A_{3}$）P（D∣$A_{3}$）＋P（$A_{4}$）P（D∣$A_{4}$）

    ⇒ y＝$\frac{1}{3}$y＋$\frac{1}{4}\times \frac{1}{6}+\frac{1}{4}\times \frac{1}{12}+\frac{1}{6}\times \frac{1}{4}=\frac{1}{3}y+\frac{5}{48}$（∵P(D)＝P（D∣$A_{1}$））

    則 y＝$\frac{5}{32}$＝P(D)

    (E) ○：P(D)＝P（$A_{1}$）P（D∣$A_{1}$）＋P（$A_{2}$）P（D∣$A_{2}$）＋P（$A_{3}$）P（D∣$A_{3}$）

    ＋P（$A_{4}$）P（D∣$A_{4}$）

    ⇒$\frac{1}{6}=\frac{1}{3}y+\frac{1}{4}\times \frac{1}{6}+\frac{1}{4}\times \frac{1}{12}+\frac{1}{6}\times \frac{1}{4}=\frac{1}{3}y+\frac{5}{48}$（∵P(D)＝P（D∣$A_{2}$））

    則 y＝$\frac{3}{16}$

    故選(A)(C)(E)'
