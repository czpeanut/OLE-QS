  stem: 甲、乙兩人同時射擊一個靶面，每人射擊兩發子彈，已知兩人每次射擊命中與否為獨立事件，且甲乙兩人射中與否亦為獨立事件。設甲、乙每發子彈的射擊命中率分別為$\frac{1}{3}$、$\frac{3}{5}$，則此靶面恰中兩發子彈的機率為何？
  options:
  - label: A
    content: $\frac{106}{225}$
  - label: B
    content: $\frac{52}{225}$
  - label: C
    content: $\frac{88}{225}$
  - label: D
    content: $\frac{103}{225}$
  - label: E
    content: $\frac{117}{225}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'P（甲中 2 且乙中 0）＋P（甲中 1 且乙中 1）＋P（甲中 0 且乙中 2）

    ＝$\frac{1}{3}\times \frac{1}{3}\times \left( 1-\frac{3}{5} \right) \times \left( 1-\frac{3}{5} \right)$＋$C_{1}^{2}\times \frac{1}{3}\times \left( 1-\frac{1}{3} \right) \times C_{1}^{2}\times \frac{3}{5}\times \left( 1-\frac{3}{5} \right)$＋$\left( 1-\frac{1}{3} \right) \times \left( 1-\frac{1}{3} \right) \times \frac{3}{5}\times \frac{3}{5}$

    ＝$\frac{4}{225}$＋$\frac{48}{225}$＋$\frac{36}{225}$＝$\frac{88}{225}$，故選(C)'
