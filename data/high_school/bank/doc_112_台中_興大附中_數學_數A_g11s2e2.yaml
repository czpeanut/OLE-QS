- id: doc_112_台中_興大附中_數學_數A_g11s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 戴戴與嬌嬌兩人進行 5 戰 3 勝制（先贏得 3 局的人獲勝）的羽球比賽，前 3 局戴戴贏 1 局輸 2 局暫時落後。已知過去兩人的比賽中，每局比賽戴戴獲勝的機率是 0.7，且各局比賽的勝負結果互不影響，試問下列哪些選項是正確的？
  options:
  - label: A
    content: 比賽由戴戴獲勝的機率為 0.7
  - label: B
    content: 比賽由嬌嬌獲勝的機率為 0.51
  - label: C
    content: 若比賽由嬌嬌獲勝，則戴戴的戰績為贏 2 局輸 3 局的機率為$\frac{7}{17}$
  - label: D
    content: 若比賽由嬌嬌獲勝，則戴戴的戰績為贏 1 局輸 3 局的機率為$\frac{1}{2}$
  - label: E
    content: 若比賽由戴戴獲勝，則嬌嬌的戰績為贏 2 局輸 3 局的機率為 1
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '戴戴前三局贏 1 輸 2

    (A) ╳：戴戴獲勝的機率為（0.7）$^{2}$＝0.49

    (B) ○：由選項(A)可知 1－0.49＝0.51

    (C) ○：戴戴贏 2 輸 3 的機率與第四局贏第五局輸的機率相等

    ⇒ 0.7×0.3＝0.21

    ∴$\frac{0.21}{0.51}$＝$\frac{7}{17}$

    (D) ╳：戴戴第四局輸的機率為 0.3

    ∴$\frac{0.3}{0.51}$＝$\frac{10}{17}$

    (E) ○：戴戴要贏只能 2 連勝，此時嬌嬌的戰績必為贏 2 輸 3

    ∴所求機率為 1

    故選(B)(C)(E)'
