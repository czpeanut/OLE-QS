- id: doc_112_台中_興大附中_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 試求通過 A（3，1，2）、B（5，4，3）兩點，且與平面 E：x＋2y－z＝1 垂直的平面方程式為 ax＋by＋cz＝1，則 a＋b＋c 之值為下列哪一個選項？
  options:
  - label: A
    content: $-\frac{1}{10}$
  - label: B
    content: $\frac{1}{10}$
  - label: C
    content: $\frac{3}{10}$
  - label: D
    content: $\frac{5}{10}$
  - label: E
    content: $\frac{7}{10}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 'E：x＋2y－z＝1 與 ax＋by＋cz＝1 的法向量分別為（1，2，－1），（a，b，c）

    ⇒$\begin{cases}(1 , 2 , -1) \cdot (a , b , c)=0 \\ 3a +b + 2c =1 \\ 5a + 4b +3c =1\end{cases}$⇒$\begin{cases}a + 2b -c =0 \cdots \cdots \cdots \cdots \cdots ① \\ 3a +b +2c =1 \cdots \cdots \cdots \cdots \cdots ② \\ 5a + 4b +3c =1\cdots \cdots \cdots \cdots \cdots ③\end{cases}$

    $\begin{matrix}由①\times 2+② 得 5a+5b =1 \\ 由①\times 3+③ 得 8 a +10b=1\end{matrix}$⇒ a＝$\frac{1}{2}$，b＝$-\frac{3}{10}$

    代回①得 c＝a＋2b＝$\frac{1}{2}$＋2×$\left( -\frac{3}{10} \right)$＝$\frac{1}{2}$－$\frac{3}{5}$＝$-\frac{1}{10}$

    ∴a＋b＋c＝$\frac{1}{2}$＋$\left( -\frac{3}{10} \right)$＋$\left( -\frac{1}{10} \right)$＝$\frac{5-3-1}{10}$＝$\frac{1}{10}$

    故選(B)'
