- id: doc_112_台中_興大附中_數學_數A_g11s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 空間中一直線 L：$\frac{x -1}{2}=\frac{y -2}{-1}=\frac{z +3}{3}$，下列的各方程式中，何者的圖形亦為直線 L？
  options:
  - label: A
    content: $\frac{x -3}{2}=\frac{y -1}{-1}=\frac{z}{3}$
  - label: B
    content: $\begin{cases}x =-1+2t \\ y =3-t \\ z =-6+3t\end{cases}$，t 為實數
  - label: C
    content: $\frac{2}{x -1}=\frac{-1}{y -2}=\frac{3}{z +3}$
  - label: D
    content: $\begin{cases}x +2y =5 \\ 3y +z =3\end{cases}$
  - label: E
    content: $\begin{cases}2x +7y +z =13 \\ x -y -z =5\end{cases}$
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'L：$\frac{x -1}{2}=\frac{y -2}{-1}=\frac{z +3}{3}$，方向向量$\vec{v}$＝（2，－1，3），過 P（1，2，－3）

    (A) ○：P（1，2，－3）代入$\frac{x -3}{2}=\frac{y -1}{-1}=\frac{z}{3}$得$\frac{1-3}{2}=\frac{2-1}{-1}=\frac{-3}{3}$滿足，且相同方向向量

    (B) ○：（－1，3，－6）代入$\frac{x -1}{2}=\frac{y -2}{-1}=\frac{z +3}{3}$得$\frac{-1-1}{2}=\frac{3-2}{-1}=\frac{-6+3}{3}$滿足，且相同方向向量

    (C) ╳：B（3，1，0）代入$\frac{2}{x -1}=\frac{-1}{y -2}=\frac{3}{z +3}$滿足方程式，但 P（1，2，－3）不滿足此方程式

    (D) ○：L 的參數式（1＋2t，2－t，－3＋3t）代入$\begin{cases}x +2y =5 \\ 3y +z =3\end{cases}$

    得$\begin{cases}( 1+2t )+2( 2-t )= 5 \\ 3( 2-t )+(-3+3t )= 3\end{cases}$⇒$\begin{cases}5 = 5 \\ 3 = 3\end{cases}$，表示 t 為任意實數

    (E) ╳：承選項(D)，$\begin{cases}2( 1+2t )+7( 2-t )+(-3+3t )= 13 \\ ( 1+2t )-( 2-t )-(-3+3t )= 5\end{cases}$⇒$\begin{cases}13 = 13 \\ 2 =5\end{cases}$

    ⇒ t 無解，無相交

    故選(A)(B)(D)'
