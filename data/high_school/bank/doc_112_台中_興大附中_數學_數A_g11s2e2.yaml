- id: doc_112_台中_興大附中_數學_數A_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 空間中，若直線 L：$\frac{x -2}{1}=\frac{y +1}{-2}=\frac{z +1}{2}$與平面 E：2x＋3y＋z＋4＝0 的交點坐標為 （a，b，c），則 a＋b＋c 之值為下列哪一個選項？
  options:
  - label: A
    content: －4
  - label: B
    content: －2
  - label: C
    content: '0'
  - label: D
    content: '2'
  - label: E
    content: '4'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設 L 上一點（2＋t，－1－2t，－1＋2t），代入 E

    ⇒ 2（2＋t）＋3（－1－2t）＋（－1＋2t）＋4＝0

    ⇒－2t＋4＝0

    ⇒ t＝2

    ∴交點（a，b，c）＝（4，－5，3），則所求為 4＋（－5）＋3＝2

    故選(D)'
