  stem: 對某數N取一次log後，其值為x，再對此數x取一次log後，其值為101，試問N是幾位數？
  options:
  - label: A
    content: 101位
  - label: B
    content: 101＋1位
  - label: C
    content: $10^{101}$位
  - label: D
    content: $10^{101}$＋1位
  - label: E
    content: ( 10 )$^{10101}$位
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題意知x＝log N， log x＝log ( log N )＝101 ⇒ log N＝$10^{101}$ ⇒ N＝$10^{(10^{101})}$， 故N為$10^{101}$＋1位數，故選(D)。
