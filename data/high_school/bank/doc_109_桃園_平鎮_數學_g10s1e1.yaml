- id: doc_109_桃園_平鎮_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 我們都知道維納斯是黃金比例的雕像，黃金比例就是身高與下半身長 ( 肚臍到腳底 ) 的比值等於下半身長 ( 肚臍到腳底 ) 與上半身長 ( 頭頂到肚臍 ) 的比值。<u>小玲</u>的身高為160公分，她的肚臍到腳底的距離為96公分，為了達到黃金比例，<u>小玲</u>應該要穿高多少公分的高跟鞋才能使自己的身材最接近黃金比例？
  options:
  - label: A
    content: 2公分
  - label: B
    content: 4公分
  - label: C
    content: 6公分
  - label: D
    content: 8公分
  - label: E
    content: 10公分
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 設穿x cm， $\frac{160+x}{96+x}$＝$\frac{96+x}{160-96}$， ⇒ ( 96＋x )$^{2}$＝( 160＋x )×64， ⇒ $x^{2}$＋128x－1024＝0， x＝$\frac{-128\pm \sqrt{128^{2}-4\cdot 1\cdot (-1024)}}{2\times 1}$≒7.554 (cm)， 故選(D)。
