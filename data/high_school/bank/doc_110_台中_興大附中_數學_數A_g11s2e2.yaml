  stem: 在空間坐標中，試問下列選項何者正確？
  options:
  - label: A
    content: 方程式 x＝0 的圖形代表落在 y 軸上的一直線
  - label: B
    content: 方程式 x＋y＝2 的圖形代表一直線
  - label: C
    content: 方程式 x＋z＝1 和 y＋z＝1 的圖形恰交於一點
  - label: D
    content: 方程式 x＋y＋z＝1 與 x＝y＝z 的圖形恰交於一點
  - label: E
    content: 原點（0，0，0）與 x＋y＋z＝1 的圖形距離為$\sqrt{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：x＝0 表示為 yz 平面

    (B) ╳：圖形為一平面

    (C) ╳：兩平面不重合也不平行，故交於一線

    (D) ○：x＋y＋z＝1 之法向量為（1，1，1）和直線 x＝y＝z 之方向向量（1，1，1）不垂直，故交於一點

    (E) ╳：距離為$\frac{1}{\sqrt{3}}$

    故選(D)'
