    由$\frac{-10+t}{2}=\frac{-8-2t}{3}$得－30＋3t＝－16－4t ⇒ t＝2 代回

    ⇒$\frac{b-1+8}{1}=\frac{-10+2}{2}=\frac{-8-4}{3}\Rightarrow b=-11$

    故數對（a，b）＝（1，－11）'
