  stem: 在坐標空間中，設 O 為原點，且點 P 為三平面 x－4y－5z＝0、x－4y＋2z＝0、x＋y＝t 的交點，其中 t＞0。若$\overline{OP}$＝17，則 t＝＿＿＿＿。
  answer:
