    content: a＜b＜c
  - label: D
    content: a＜b＝c
  - label: E
    content: a＞b＝c
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵第一次反，恰四次停止表反正正正，同理，c 為反反正正正

    ∴$a =C_{1}^{2}\times \left( \frac{1}{2} \right) ^{3}=\frac{1}{4} , b =\frac{\frac{1}{2}\times \left( \frac{1}{2} \right) ^{3}}{\frac{1}{2}}=\frac{1}{8} , c =\frac{\left( \frac{1}{2} \right) ^{2}\times \left( \frac{1}{2} \right) ^{3}}{\left( \frac{1}{2} \right) ^{2}}=\frac{1}{8}$

    ⇒ a＞b＝c

    故選(E)'
