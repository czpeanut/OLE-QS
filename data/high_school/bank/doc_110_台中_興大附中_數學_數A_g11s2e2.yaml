  stem: 設 P（X）表示事件 X 發生的機率，而 P（X ∣ Y）表示在事件 Y 發生的條件下，事件 X 發生的機率。今有 2 顆黑球、2 顆白球、3 顆紅球共 7 顆大小相同的球排成一列。設事件 A 為 2 顆白球相鄰的事件，事件 B 為 2 顆白球不相鄰的事件，而事件 C 為任 2 顆紅球都不相鄰的事件。試選出正確的選項。
  options:
  - label: A
    content: $P(A) < P(B)$
  - label: B
    content: $P(C) = \frac{3}{7}$
  - label: C
    content: $2P(C\mid A) + 5P(C\mid B) < 2$
  - label: D
    content: $P(C\mid A) > 0.2$
  - label: E
    content: $P(C\mid B) > 0.3$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$P(A) = \frac{6!/(2!3!)}{7!/(2!2!3!)} = \frac{2}{7}$，$P(B) = \frac{5}{7}$，$P(C) = \frac{\frac{4!}{2!2!}\cdot C_3^5}{210} = \frac{60}{210} = \frac{2}{7}$。

    (A) ○：$P(A)=\frac{2}{7} < \frac{5}{7}=P(B)$。

    (B) ×：$P(C)=\frac{2}{7}$。

    (C) ×：$P(C\mid A)=\frac{\frac{3!}{2!}\cdot C_3^4}{60}=\frac{12}{60}=\frac{1}{5}$，$P(C\mid B)=\frac{60-12}{150}=\frac{48}{150}=\frac{8}{25}$，故 $2(\frac{1}{5})+5(\frac{8}{25})=2$。

    (D) ×：$P(C\mid A)=0.2$。

    (E) ○：$P(C\mid B)=0.32 > 0.3$。選 (A)(E)。'
