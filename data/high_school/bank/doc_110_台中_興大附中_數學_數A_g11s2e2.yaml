  answer_status: verified
  answer_source: answer_key
  explanation: '（1，－4，－5）×（1，－4，2）＝（－28，－7，0）//（4，1，0）

    又點（4，1，0）同時在 x－4y－5z＝0 與 x－4y＋2z＝0 上

    故令 P（4＋4s，1＋s，0）

    又$\overline{OP}$＝17 ⇒（4＋4s）$^{2}$＋（1＋s）$^{2}$＝$17^{2}$ ⇒ （1＋s）$^{2}$＝17

    得 s＝$-1\pm \sqrt{17}$⇒ P 可能為$(4\sqrt{17} , \sqrt{17} , 0)$或$(-4\sqrt{17} , -\sqrt{17} , 0)$

    代入得 t＝$5\sqrt{17}$或$-5\sqrt{17}$，又 t＞0

    故 t＝$5\sqrt{17}$'
