  stem: 投擲一枚均勻的硬幣，若連續出現三次同一面就停止。設 a 表示恰好投擲三次就停止的機率；b 表示第一次是反面的情況下，恰好在第四次停止的條件機率；c 表示在第一、二次都是反面的情況下，恰好在第五次停止的條件機率，則下列哪一個選項是正確的？
  options:
