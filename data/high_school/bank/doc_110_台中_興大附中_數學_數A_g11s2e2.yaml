  answer_status: verified
  answer_source: answer_key
  explanation: '∵$L_{1}$⊥$L_{2}$

    ∴（4，a，－2）．（1，2，3）＝0 ⇒ a＝1

    令 P（－1＋4t，－2＋t，3－2t）為 $L_{1}$、$L_{2}$ 之交點

