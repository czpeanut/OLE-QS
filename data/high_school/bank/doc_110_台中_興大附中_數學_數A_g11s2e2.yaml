  stem: 若直線 $L_{1}$：$\frac{x+1}{4}=\frac{y+2}{a}=\frac{z-3}{-2}$與直線 $L_{2}$：$\frac{x+b}{1}=\frac{y-8}{2}=\frac{z-11}{3}$垂直，則數對（a，b） ＝＿＿＿＿。
  answer:
