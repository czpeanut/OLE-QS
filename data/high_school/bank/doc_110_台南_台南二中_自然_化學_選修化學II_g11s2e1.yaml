  page: 1
  stem: 若氫原子中電子各特定軌道的能量為$E_{n}$＝－1312／$n^{2}$ kJ／mol，假設基態氫原子的游離能為a kJ／mol，而電子自n＝2躍遷至n＝1所放出的能量為b kJ／mol，則$\frac{a}{b}$之比值約為下列何者？
  options:
  - label: A
    content: '0.11'
  - label: B
    content: '0.68'
  - label: C
    content: '1.1'
  - label: D
    content: '1.33'
  - label: E
    content: '2.2'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 游離能代表由n＝1 → n＝∞，其能量可表示為k（$\frac{1}{1^{2}}$－$\frac{1}{\infty ^{2}}$）＝a n＝2 → n＝1的能量為k（$\frac{1}{1^{2}}$－$\frac{1}{2^{2}}$）＝b 故a／b＝4／3＝1.33。
