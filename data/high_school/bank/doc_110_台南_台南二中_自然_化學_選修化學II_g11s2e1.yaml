- id: doc_110_台南_台南二中_自然_化學_選修化學II_g11s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 氫原子光譜中，下列何種電子躍遷會放出波長最長的光？
  options:
  - label: A
    content: 電子由4p至2s
  - label: B
    content: 電子由2p至1s
  - label: C
    content: 電子由2s至3s
  - label: D
    content: 電子由3p至1s
  - label: E
    content: 電子由3p至2s
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 放出光的能量與（$\frac{1}{n_{L}^{2}}$－$\frac{1}{n_{H}^{2}}$）成正比（$n_{L}$為低能階、$n_{H}$為高能階），又E＝$\frac{hc}{\lambda}$故波長最長的光即為能量最小的光。氫原子的能階只與主量子數有關，故不須理會軌域的類型。 (A) $\frac{1}{2^{2}}$－$\frac{1}{4^{2}}$＝$\frac{3}{16}$；(B) $\frac{1}{1^{2}}$－$\frac{1}{2^{2}}$＝$\frac{3}{4}$；(C)此躍遷需吸收光，與題意不合；(D)$\frac{1}{1^{2}}$－$\frac{1}{3^{2}}$＝$\frac{8}{9}$；(E)$\frac{1}{2^{2}}$－$\frac{1}{3^{2}}$＝$\frac{5}{36}$。以上能量最小的為(E)，故其波長最大。
