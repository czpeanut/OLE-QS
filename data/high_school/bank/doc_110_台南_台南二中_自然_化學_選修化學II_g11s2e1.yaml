  answer_source: answer_key
  explanation: (A)同一元素的連續游離能會越來越大，即$IE_{1}$＜$IE_{2}$＜$IE_{3}$，故正確；(B) X為Na，Y為Mg，同週期元素2A族游離能會大於1A族，正確；(C) $IE_{2}$的判斷可視為已經失去一個電子的狀況下再失去另一個電子，$X^{+}$電子組態為$1s^{2}2s^{2}2p^{6}$（與He相似），$Y^{+}$電子組態為$1s^{2}2s^{2}2p^{6}3s^{1}$（與Na相似），故$X^{+}$再失去一個電子所需的能量較多，游離能較大；(D) $IE_{3}$的判斷可視為已經失去兩個電子的狀況下再失去另一個電子，$X^{2+}$電子組態為$1s^{2}2s^{2}2p^{5}$（與F相似），$Z^{2+}$電子組態為$1s^{2}2s^{2}2p^{6}3s^{1}$（與Na相似），故$X^{2+}$再失去一個電子所需的能量較多，游離能較大；(E) $IE_{2}$的判斷可視為已經失去一個電子的狀況下再失去另一個電子，$Y^{+}$電子組態為$1s^{2}2s^{2}2p^{6}3s^{1}$（與Na相似），$Z^{+}$電子組態為$1s^{2}2s^{2}2p^{6}3s^{2}$（與Mg相似），故$Z^{+}$再失去一個電子所需的能量較多，游離能較大。
