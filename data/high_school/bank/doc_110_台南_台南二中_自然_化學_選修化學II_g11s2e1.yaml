  stem: 地球上的元素可以以週期表排列的方式，來呈現其規律性。此規律性以電子按順序填入四個量子數，n，l，$m_{1}$，$m_{s}$規範，所形成的軌域來推導。例如n＝2時，則有一個2s（l＝0，$m_{1}$＝0）軌域，三個2p（l＝1，$m_{1}$＝－1, 0, 1）軌域，總共四個軌域。當元素的質子數增加時，電子則順序填入適當軌域，藉此可以得到鋰至氖等第二週期之八個元素。若另一宇宙之元素所形成的週期表，仍可以以四個量子數n，l，$m_{1}$，$m_{s}$來推導，但受另一不同之規律的規範，四個量子數n，l，$m_{1}$，$m_{s}$彼此關係為：n為大於0的正整數（n＞0），l為小於或等於n但大於0的正整數（0＜l ≤ n），$m_{1}$必須是奇數（且0不是奇數），它可以是正整數或負整數，但若是正整數，則l ≤ $m_{1}$ ≤ 2l，或是負整數，或－2l ≤ $m_{1}$ ≤－l。$m_{s}$＝$\frac{1}{2}$或－$\frac{1}{2}$的關係伋然維持。電子會依下列順序填入軌域，(i) n，l，$m_{1}$，$m_{s}$由小而大順序填入，(ii) n＝1填滿後，再填n＝2等，其餘量子數亦同。請依據此新規範回答當n＝4時： (1)試寫出可能存在的所有l值？ (2)試寫出每個l值所對應存在的所有$m_{1}$值？ (3)試算出n＝4的元素總共有幾個？
  explanation: '(1) 因l為大於零、小於等於n的所有正整數，又n＝4，故l可等於1，2，3，4。

    (2) $m_{l}$規律：需為奇數，若為正數則l ≤ $m_{l}$ ≤ 2l、若為負數則－2l ≤ $m_{l}$ ≤－l。由此規律可得，當l＝1，則$m_{l}$可為1、－1；當l＝2，則$m_{l}$可為3、－3；當l＝3，則$m_{l}$可為5、3、－3、－5；當l＝4，則$m_{l}$可為7、5、－5、－7。

    (3) 因n＝4時，$m_{l}$值共有12個，每個$m_{l}$值可對應到兩個$m_{s}$值（＋1／2、－1／2），故共有24個元素。'
