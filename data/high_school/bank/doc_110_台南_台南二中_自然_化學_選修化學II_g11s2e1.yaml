  stem: 下列有關銅（Cu，原子序29）原子或離子之敘述，哪些正確？
  options:
  - label: A
    content: 基態Cu原子的價電子組態為$3d^{9}4s^{2}$
  - label: B
    content: 基態$Cu^{＋}$之電子組態為 [Ar]$3d^{9}4s^{1}$
  - label: C
    content: 基態銅原子中，有10個電子具有角動量子數l＝2
  - label: D
    content: 基態銅原子中，有13個電子具有磁量子數$m_{l}$＝0
  - label: E
    content: 基態$Cu^{＋}$中，有14個電子具有自旋量子數$m_{s}$＝－$\frac{1}{2}$
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: Cu元素的電子組態為[Ar]$3d^{10}4s^{1}$，$Cu^{+}$則為[Ar]$3d^{10}$。 (A)錯誤；(B)錯誤；(C) l＝2為d軌域中的電子，正確；(D)電子組態為$1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{10}4s^{1}$，其中因s軌域l＝0，故所有s軌域中的電子其$m_{l}$值皆為0，共7個，又每殼層的3個p軌域中都有其中一個p軌域$m_{l}$＝0、5個d軌域中也有一個d軌域$m_{l}$＝0，故p、d軌域中共有2＋2＋2個$m_{l}$＝的電子，本選項中總共有13個，正確；(E)任何成對的電子，皆各有一個$m_{s}$＝＋1／2，一個$m_{s}$＝－1／2，而4s軌域中有不成對電子，其$m_{s}$＝＋1／2，故共有14個電子的$m_{s}$＝－1／2。
