  stem: 「無國界醫生組織」是在受戰爭或動亂地區、貧窮國家從事醫療服務與公共衛生的國際組織，這些來自世界各地的志願者，除了醫護與公衛專家，其實也包括一些行政人員從事庶務工作，目的在協助抵抗地方疾病，該組織並於 1999 年獲得諾貝爾和平獎。請問「無國界醫生組織」與下列哪一個組織扮演的角色近似？
  options:
