  stem: 隨著蘇聯解體，美蘇對立降溫，美國政治學者杭廷頓（Samuel Huntington）主張在「後冷戰時期」，「文明衝突」將會取代過去的政治及意識型態的衝突。下列國際事件，何者符合杭廷頓所提出文明衝突的主張？
  options:
  - label: A
    content: 中、日、臺三國之間關於釣魚臺主權的爭議
  - label: B
    content: 美國與南韓大規模軍事演習引發北韓的不滿
  - label: C
    content: 臺籍廣大興號漁船遭菲律賓海巡署射殺事件
