  stem: 多年前國內爆發不肖業者調製起雲劑時摻入有毒塑化劑，再販售給食品業者添加在食品中的黑心事件，隨著有毒起雲劑風暴擴大，且基於食品安全警示，行政院主動通報□□，後來發現毒害範圍已跨越國際，該組織「全球預警暨因應組」表示，「已經通知分銷我國含塑化劑飲料的國家，而這些國家有責任採取國家級的因應措施」。請問□□應為哪一國際組織？
