  answer_status: verified
  answer_source: answer_key
  explanation: '(A)釣魚臺主權為領土及主權糾紛，不為文明或宗教之衝突。(B)南北韓為資本及共產之意識型態衝突。(C)此為領土及主權糾紛。(D)西方國家的自由民主精神，與伊斯蘭國的宗教精神相牴觸，而產生杭廷頓所主張的文明衝突，為正解。

    26.1953 年為第二次世界大戰後，國際上以美國及蘇聯為首而主導的對峙情勢，答案為(B)兩極體系。

    27.(B)伊斯蘭世界的極端主義者通常會牴觸基督教文明，因此唯一神論。(C)若上升為國家衝突或社會秩序混亂，各國政府或國際組織會干涉。(D)主要為宗教及文明之間之衝突。

    28.(A)美國及日本並無主張南海之主權。(B)南海海洋生態複雜性排名世界前三，約有 3,365 種魚類，並提供大約 10 ％至 12 ％的海洋漁業資源。(C)美國有其立場及支持的國家。(D)為正確主張。

    29.(A)(B)(D)為可以聲請釋憲之情形。(C)尚未窮盡救濟程序，非終局判決，因此無法聲請釋憲。

    30.(丙)此為司法院懲戒法院之職權；(丁)此為各級法院法官之職權。(甲)(乙)(戊)為正確敘述，答案為(C)。

    31.(A)任期 8年，不得連任。(B)大法官得同時兼任司法院院長或副院長。(D)由總統提名，立法院同意任命之。

    32.(A)國會議員仍有可能違背憲政精神，依我國法律規定，1∕4 以上立法委員連署，可聲請釋憲。(B)人民聲請釋憲須為法令侵害權利，且為終局判決後才可聲請。(C)大法官也可宣告截至某時間法令失其效力。(D)為正確敘述。

    33.(A)(B)皆為言論自由相關概念。(C)依《憲法》第 11 條：人民有言論、講學、著作及出版之自由。《憲法》明文寫出此四種形式。(D)限制言論自由須以是否符合公益原則、比例原則、法律保留原則等個別檢視之。

    34.(A)由大法官進行違憲審查，才能使法令失效。(B)可藉由不信任案、解散國會等方式解決兩院之爭議。(C)最經濟的方式應該由大法官解釋憲法。(D)為正確敘述。

    35.(A)此為實質利益。(B)藉由釋憲方式將隱私權視為概括性權利，受《憲法》保障，為正解。(C)此與救濟無關。(D)與釋憲聲請人範疇無關。

    36.(A)不為釋字第 791 號解釋之意旨。(B)違反法律原則，與當事人是否應負法律責任為兩件事。(D)通姦仍為道德倫常所不允許。

    37.(A)(B)(D)皆為釋字第 748 號解釋文之意旨。(C)解釋文中並無提及立法院須修改《民法》，保障婚姻平等權。

    38.(A)應為總額 1∕4 以上立委提出。(B)是保障學生之訴訟救濟權，而非不受退學之權利。(C)大法官不受理案件時，應做出不受理裁定，並非皆須做出解釋文。

    39.(A)(B)(C)皆為與國家憲政精神及政府運作相關事件，可由大法官以憲法解釋來處理。(D)此為市政府下行政機關之爭議，由市政府協調解決即可。

    40.從題文「遭戶政事務所駁回且救濟未果」，可知此案為(A)確定終局判決後聲請之釋憲類型。

    41.(A)為概括基本權。(B)從「限制手段與認同目的是否有關聯性，實有疑問」及「顯然不是侵害基本權利的最小手段」，可知此法令違反比例原則中的必要性原則。(C)無提及。

    42.從題文「該電臺報導精神與事實不符而遭民眾投訴，且其大股東直接介入新聞製播」，可知該電臺影響民眾的認知權利。(A)大眾是否有媒體識讀能力，與政府介入媒體為兩件事，反而可能造成誤導民眾之認知。(B)商業媒體由於其營利性及出資者之背景不同，對不同的事件、議題會有不同的立場或意識型態，可以有不同的觀點但不可捏造事實或造假新聞。(C)政府介入有其前提，並非必要之惡。

    43.(A)尚未用盡所有救濟程序，不是最終判決。(B)應是以電臺的名義，為權利受侵害之主體。(D)監察院沒有聲請釋憲的權限。

    44.(A)國務院總理為最高行政首長，全國人民代表大會為最高權力機關。(B)中國沒有考試機關及監察機關。(C)中華人民共和國的政體是人民代表大會制度，國家主席是不掌握實權的虛位元首，職能是代表中華人民共和國進行國事活動。國務院是最高國家權力機關的執行機關，負責執行全國人大及其常委會的法律和決議等，向人大負責，並受其監督。(D)為正解。

    45.(A)應是落實黨的領導。(B)(C)(D)為中國黨國體制政治的運作方式。

    46.(A)無提及臺海關係穩定。(B)國內法化影響本國的法令政策，臺海關係並不受其約束。(C)中國擁核與我國能否重返聯合國並無直接關聯。(D)中國擁核將可能以之威脅臺灣，增添臺海關係變數及穩定，為正解。

    47.(A)文中未提及貧富階級仇視與對立。(B)兒童並沒有普遍失學，而是經濟狀況不佳之家庭特別嚴重。(C)從文中可得知，經濟制裁使貧窮家庭的學齡兒童無法就學，呈現國際衝突會使資源分配的結構性不平等加劇，為正解。(D)學齡兒童就學率，與大國壓迫小國無關聯，且經濟制裁是針對擁核國，並非小國。

    48.從兩份資料中，呈現國際禁止核武進程與權力不均等之現象，最適切的答案為(B)。

    49.因我國並非 G20 及東協之成員國，無法出席相關會議，因此我國外交部之發言，最有可能的地點為(B)我國外交部記者會。

    50.(A)東協為區域性，G20 為全球性。(B)東協係由印尼、越南、寮國、汶萊、泰國、緬甸、菲律賓、柬埔寨、新加坡、馬來西亞等，應是以東南亞為首的國家組成。(D)東南亞國協剛成立的宗旨與防堵共產勢力有關，現多為政治及經濟議題。'
