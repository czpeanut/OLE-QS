    content: 民主集中制強調全黨各組織和黨員服從黨的全國人民代表大會和中央委員會
  - label: B
    content: 民主集中制是中國特色旳民主，強調人民才是實質上國家最高權力的擁有者
  - label: C
    content: 民主集中制是一種讓人民透過選票，匯集民意趨勢進而影響政府施政的制度
  - label: D
    content: 民主集中制在制度上，民選的總書記是權力金字塔核心，掌握最高政治實權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)正確敘述。(B)黨員個人服從黨的組織，少數服從多數，下級組織服從上級組織，全黨各個組織和全體黨員服從黨的全國代表大會和中央委員會。黨的最高領導機關，是黨的全國代表大會和它所產生的中央委員會。(C)選舉不為民主集中制的核心概念。(D)中央總書記不為民選，而由中央委員會全體投票產生。
