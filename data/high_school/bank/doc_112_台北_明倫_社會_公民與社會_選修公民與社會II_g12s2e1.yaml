questions:
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關「審議民主」模式的相關敘述，下列何者「錯誤」？
  options:
  - label: A
    content: 願景工作坊是以分組方式展開輪番對話，集思廣益尋求問題的解方
  - label: B
    content: 審議式民調操作的方式可隨機抽樣產生一定人數的公民來進行討論
  - label: C
    content: 施行代議民主政治的結果產生許多問題，促成了近代審議式民主思潮的興起
  - label: D
    content: 為保證公民會議的討論品質，參與者必須具備一定的教育水準
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)皆為審議民主的特色。(D)審議民主是廣納多元、不同背景及領域的人之意見，所以不會限制參加者需具備一定的教育水準。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 2015 年，我國建立「公共政策網路參與平臺」，開放民眾針對關注的議題提案，只要在時限內達成連署，主管機關就必須要在 2 個月內回應。曾經成案且被政府參採的案子包含「目前臺灣高中生普遍睡眠不足，上學時間應延遲」等。以下針對該平臺的敘述，何者正確？
  options:
  - label: A
    content: 若全然仰賴此平臺蒐集民意，將使數位能力弱勢者邊緣化
  - label: B
    content: 此平臺對政府施政與立法有強制力，展現民意至上的精神
  - label: C
    content: 平臺提供民眾公共參與空間，算是古典民主的一種模式
  - label: D
    content: 屬於單向溝通的管道，政府無法凝聚此平臺達成社會共識
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因為要透過網路參與平臺發聲，須具有網路設備，因此缺少電腦及網路設備者會被邊緣化，為正確敘述。(B)此平臺為政策的參考來源，不具有強制力。(C)此平臺較接近審議民主的模式，參與者可自由提案及參與討論。(D)政府能回應提案，也能凝聚民眾的意見，作為施政的依據。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 民眾常批評官員施政「不知民間疾苦」，認為政策是有權勢者的想像，無法貼近人民生活。因此有公民團體希望政府多徵詢人民的意見，但亦有反對者認為此舉會倒退至希臘雅典城邦的人民參與模式。現今民主及雅典城邦式的民主被認為有缺失之處，與下列何者的敘述最有關聯？
  options:
  - label: A
    content: 直接民主的模式即為現今民主的形式，全面實施代議制追求效率
  - label: B
    content: 雅典城邦式的民主模式之所以會被淘汰，是因其不符合現代國家主張的憲政主義精神
  - label: C
    content: 代議政治最符合民眾所需，只要政府採納多數人的意見即可落實民主
  - label: D
    content: 雅典城邦的直接民主因時間成本等限制，全民參政的方式漸漸被代議民主取代
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)現代民主運作多數採用代議民主，而非直接民主。(B)雅典城邦的直接民主無法適用於現今，並非不符合憲政主義精神，而是須在人數少等基礎下才能實施，現今多數國家不符合此背景條件。(C)採納多數人的意見，有可能會淪為多數暴力，反而無法落實民主。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 以色列國會 2023 年 7 月 25 日在執政黨議員的護航下通過了「限縮最高法院推翻政府決定的權力」法案。不少民眾認為失去司法權制衡後，行政權恐將過度膨脹，此法案是「大開民主倒車」，因此希望規畫一場公民不服從運動，試圖讓政府重視該議題。請問下列何種方式，較符合示威民眾的計畫？
  options:
  - label: A
    content: 在下次國會選舉時，抵制執政黨議員，不投票給此政黨
  - label: B
    content: 肉搜執政黨議員的個人資料，並公布在網路供民眾批判
  - label: C
    content: 民眾封鎖全國各地道路、癱瘓交通，逼迫政府正視民意
  - label: D
    content: 組成利益團體向國會議員進行遊說，迫使議員再次修法
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不符合公民不服從的概念。(B)肉搜會侵犯他人隱私權，不符民主國家的精神。(D)因為要實行公民不服從精神，迫使政府正視其訴求，採用非暴力且違法的手段，才符合其定義，故(C)較屬於相符的作法。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 英國思想家 E. Burke 曾說過：「選舉之日就是人民裁判政府之日。」人民藉由定期選舉，將不合民意的政府汰換掉，這是民主政治哪種特色的實踐？
  options:
  - label: A
    content: 人民主權
  - label: B
    content: 政黨政治
  - label: C
    content: 普遍性公民身分
  - label: D
    content: 正視差異性的存在
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「人民藉由定期選舉，將不合民意的政府汰換掉」，可知此為落實(A)人民主權的做法。此意涵為認為國家主權屬於人民，政府只是受人民委託而行使主權。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 彌爾（John Stuart Mill, 1806 ～ 1873）曾說過：「唯一能夠滿足社會一切要求的政府就是全民參與的政府……但在範圍遠超過一個小鎮的社會中，由於眾人能親自參與的只是極小部分的公共事務，這就意味著完美政府的理想型態，必然是代議制。」請問關於彌爾所言之主要概念下列敘述何者正確？
  options:
  - label: A
    content: 考量人民素質，普遍實施直接民主不可行
  - label: B
    content: 直接民主只有保障少數意見，故不可行
  - label: C
    content: 代議政治才能實踐真民主的理想
  - label: D
    content: 代議民主吸收了共和主義精神
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文可看出，若人數太多時，參與意見者僅為少數人，多數人會冷漠不參與，可能造成僅保障少數人的意見，因此直接民主不可行，應由代議民主取代之，故(B)為正解。(A)題文中並無提及人民素質之觀點。(C)代議民主與直接民主皆能實現民主，僅是做法不同。(D)從題文無法看出。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 臺劇《八尺門的辯護人》播映後，受到大眾的關注，其中以「死刑」議題貫穿整部影集。不同於直接呈現死刑立場的對立，導演透過這個作品與社會對話，<u>希望大眾在資訊充足的情況下，理性溝通，並對死刑存廢的議題形成共識</u>。請問畫線處中的說法，與下列何種觀點較為相似？
  options:
  - label: A
    content: 人民應該遊說政府官員並發動社會運動來影響政府的決策
  - label: B
    content: 透過公民會議來討論死刑議題，建立社會共識後再做決策
  - label: C
    content: 交由理性的公民透過直接民主的方式來表決死刑存廢議題
  - label: D
    content: 多數大眾專業知識不足，故由代議士來決定死刑存廢即可
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 畫線部分展示審議民主之精神。(A)遊說及社會運動為多元參與民主理論之做法。(B)公民會議為審議民主之展現形式。(C)此為直接民主之觀點。(D)此為間接（代議）民主之作為。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 假定我國《集會遊行法》某條文施行後發現有重大瑕疵，被批評為惡法，下列修正惡法的方式何者「不」符合我國現行法制？
  options:
  - label: A
    content: 依《公民投票法》，透過公民投票決定該法律條文的存廢
  - label: B
    content: 法官於審判涉及該法之案件時，宣布該法律條文違憲失效
  - label: C
    content: 經司法院憲法法庭裁判，解釋該法律條文違憲並宣布失效
  - label: D
    content: 人民以請願方式要求立法院修正或廢止該法律條文
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)為符合我過現行法制之做法。(B)法官沒有宣告法律條文違憲失效之權力，此為大法官之權限。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 中國在第十屆全國人民代表大會第五次會議順利通過了《物權法》，對國家、集體和私人的物權實行平等保護原則，這是中共建政以來第一部保護私有財產權益的法律，從人大表決結果看，2,799 票贊成，52 票反對、37 票棄權，一人未按表決器，可說是一面倒多數通過。《物權法》的通過，更確立了中國什麼樣的經濟發展路線？
  options:
  - label: A
    content: 資本主義中國化
  - label: B
    content: 社會主義中國化
  - label: C
    content: 社會主義計畫經濟
  - label: D
    content: 社會主義市場經濟
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 《物權法》承認並保障私人物權，為承認私有財產制之象徵，此為資本主義的概念，可見中國的經濟發展路線為社會主義市場經濟，故答案選(D)。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 據學者估計，中國經濟每增加一個百分點，便要增加 30 萬噸的二氧化硫及 10 萬噸的汙水。請問上述資料所呈現中國經濟發展與自然資本的關係為何？
  options:
  - label: A
    content: 自然資本愈多，經濟發展愈快
  - label: B
    content: 經濟發展是耗用了自然資本所達成的
  - label: C
    content: 自然資本與經濟發展是互補的關係
  - label: D
    content: 自然資本的外部性已計入國民所得，因此經濟數字成長迅速
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文經濟成長率增加，會導致自然資源的損耗，可見經濟成長與自然資本為負相關，答案為(B)。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 中國躍升為世界工廠，對全球經濟或生態環境產生的衝擊可能為何？
  options:
  - label: A
    content: 已開發國家最高科技產業備受威脅
  - label: B
    content: 開發中國家勞力密集產業面臨衝擊
  - label: C
    content: 中國石油出口持續增加，導致國際油價不斷下跌
  - label: D
    content: 從加拿大、北歐等地區進口大量針葉林木材，使全球暖化問題日益嚴重
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中國的高科技產業尚在發展階段，無法對已開發國家構成威脅。(B)為正解。(C)中國並非是主要的石油出口國。(D)中國並無從加拿大及北歐大量進口針葉林木材，多數從俄羅斯進口。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 中國通常於每年 3 月時會召開全國人民代表大會（全國人大），人民大會代表會群聚於北京市召開為期兩週的會議。從會議內容觀察，下列哪一項最可能是「全國人大代表」的職權或其會議討論的重點？
  options:
  - label: A
    content: 選舉中國共產黨中央總書記、國務院總理與各部會部長
  - label: B
    content: 通過香港特別行政區《逃犯條例》（亦稱《送中條例》）
  - label: C
    content: 擬訂中國人民解放軍「解放臺灣軍事特別行動」方案
  - label: D
    content: 「全國人大代表」議決修改憲法，取消國家主席連任次數之限制
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中央委員會之會議選舉產生中央委員會總書記、中央政治局、中央政治局常務委員會、中央書記處、中央軍事委員會等官員。(B)《逃犯條例》是香港特別行政區政府提交香港立法會審議的法案。(C)此方案應由行政機關（國務院）擬定，而非全國人大（立法機關）擬定。(D)議決憲法為全國人大的職權。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 中國近年與我國關係緊張，但另一方面，中國也推出了「惠臺政策」31 條，在文化、就業與商業方面給予臺灣民眾較為便利的政策。以下是我國某雜誌對民眾進行的民意調查。依據民意調查結果，有關我國人民對政府應對中國的「惠臺政策」，應該會有下列哪一項解讀？
  options:
  - label: A
    content: 我國政府對「惠臺政策」持樂觀態度，對中國釋出善意表示歡迎
  - label: B
    content: 臺灣人民認為「惠臺政策」對我國產業發展影響有限，進而減少進出口
  - label: C
    content: 多數人民對「惠臺政策」有所疑慮，不鼓勵前往投資、就學
  - label: D
    content: 在習近平的指示下採取友好親臺的戰略，爭取臺灣民眾對「祖國」的認同
  assets:
  - key: s1_13_f1
    kind: figure
    file: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1/s1_13_f1.png
    crop:
      page: 2
      rect:
      - 366.05
      - 658.35
      - 563.95
      - 780.25
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從統計圖表可知，有信心者（完全有信心及還算有信心）為 37.3 ％，無信心者（不太有信心及完全沒有信心）為 53.2 ％，可見沒信心者多於有信心的人，故選(C)。(A)從數據可知，人民為悲觀態度，但無法得知政府的態度。(B)無法得知進出口之情形。(D)選項敘述為中國政府之心態，而數據提供的資料，為臺灣民眾對此政策之想法，兩者並無關聯。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 2018 年美國總統川普簽署《國防授權法案》，要求美國政府與公司禁止使用中國政府投資生產的華為與中興電信通訊產品，原因在於這些設備可能有侵害美國國家資訊安全的風險。事實上，中國政府長期對於網路訊息進行控管早已不是新聞，不但會審查境內網站與伺服器內容，也會封鎖國外色情、暴力或批評中國政府等爭議網站，甚至 Google、Facebook 等外國社群網站也都無法在中國使用。由以上現象判斷，中國對於下列何種基本人權做出侵害與限制？
