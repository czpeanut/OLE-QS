  group_stem: 2022 年夏天不平靜，除了中國持續對臺灣的文攻武嚇持續性的軍事演習，在東南亞的「G20 領袖高峰會」與「東南亞國協」（ASEAN），也分別在印尼與柬埔寨舉行。G20 領袖高峰會前，依例辦理各國外交部長會議，我國輿論通常簡稱為 G20 外長會議。東南亞國協近年來著重在區域經濟議題之討論；G20 除經濟議題外，也會包括環保議題、區域安全、人權與難民等議題。2022 年 7 月 G20 外長會議在印尼峇里島登場，隨後是東南亞國協於 2022 年 8 月在柬埔寨舉行東協外長會議等一系列活動，美國國務卿布林肯及中國外交部長王毅都有出席，但王毅因抗議美國議員訪臺，在東協外長會議中刻意避開布林肯。請問：
  answer:
  - C
