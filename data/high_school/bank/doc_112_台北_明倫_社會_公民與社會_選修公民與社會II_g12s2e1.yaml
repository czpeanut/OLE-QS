  explanation: 中國政府對網路訊息的監控，侵害人民的(B)資訊自由權。資訊自由指的不只是保護使用網際網路和資訊科技（請參照數位權利）時表達意見的自由，同時也涉及對於資訊技術領域的管理，譬如在不受到審查或是可自由使用網路資料的權利。
