  stem: 義大利為了活絡其國際貿易，多年前與中國協議簽署某項合作計畫，事後檢視合作計畫卻發現與中國的進口貿易遠多於出口貿易，對義大利實質幫助不大，義大利國防部長甚至稱該合作計畫是一項「糟糕的決定」，因此義大利總理梅洛尼決議要廢止該計畫。請問此合作計畫應為下列哪一項？
