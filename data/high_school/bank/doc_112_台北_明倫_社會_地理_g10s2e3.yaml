- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列哪些臺灣鄉鎮市區級地名的變遷，最能反映解嚴後政府及社會對多元族群及其文化的尊重態度？(甲)吉野→吉安(乙)三民→那瑪夏(丙)番社→東山(丁)吳鳳→阿里山(戊)紅毛→新豐。正確的是
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 丁戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (乙)光復後高雄市那瑪夏區被稱為三民鄉，2007 年後更名為那瑪夏鄉，該名稱源於當地卡那卡那富族傳說中的少年英雄之名；(丁)光復後的阿里山鄉被稱為吳鳳鄉，民國 70 年後則改稱為阿里山鄉，相傳為當地鄒族英雄之名，後又有學者指出「阿里」乃平埔族稱鄒族聚落及所在地區統稱的音譯。故選(C)。
