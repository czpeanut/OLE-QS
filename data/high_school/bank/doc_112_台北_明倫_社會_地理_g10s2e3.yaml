  section: 2
  number: 46
  type: single
  page: 12
  stem: 上文敘述中，甲～丙 3 個東亞文化圈國家，位居技術領先、經濟開發程度高，為亞洲最大的工業國的國家為何？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  group_stem: 「躺平族」、「父母扭蛋」這些名詞 2021 年在亞洲青年之間引起熱議，尤其是在文化背景接近的東亞文化圈中盛行，各國形成背景不完全相同，但多與經濟發展背景有關，甲國在歷經 1985 ～ 1989 年的泡沫經濟世代、產業空洞化世代的小孩現今正值 2、30 歲，此世代成長期歷經低薪風暴、還沒畢業身上就揹了一身學貸；乙國則因大集團企業的經濟背景，讓年輕人覺得僅靠自身能力很難出頭；丙國因過去長期經濟高度成長、過去物聯網產業可一夜致富，導致沿海一線城市高房價、高消費水準，但現今物聯網產業沒落，讓年輕人覺得沒有希望，而興起「躺平」一族。請問：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '從「泡沫經濟」推論(A)甲為日本；從「大集團企業」推論(B)乙為韓國；從「物聯網及沿海一線城市」推論(C)丙為中國。其中(A)甲：日本為 3 者中經濟及技術最為發達的國家。

    47.1985 年代，(甲)日本工業產品行銷全球累積大量外匯，後因美迫使(丙)日幣升值（日圓購買力提升）及日本施行低利率政策（日圓貸款容易），使得日本湧入大量熱錢及攀升快速的貸款，造成大量日幣投入投資市場（房市與股市），創造繁榮的經濟假象。此因非實質工業生產帶動的經濟成長，故又稱為泡沫經濟。故選(B)。

    48.韓國政府扶植企業擴大經營規模，使其得以降低單位生產成本而提高獲利，此經濟效益又稱為(B)規模經濟。

    49.影響臺商在廣東設廠加工生產及出口的情形包括：出口不易，如人民幣升值造成出口售價提高(甲)；加工成本增加，如用人成本(丙)(戊)、廢棄物處理成本(丁)。故選(C)。

    50.1980 年代，中國於沿海設立經濟特區旨在發展勞力密集型產業，此產業類型與臺灣 1960 年代於西部沿海都會區設立的(D)加工出口區相同。'
