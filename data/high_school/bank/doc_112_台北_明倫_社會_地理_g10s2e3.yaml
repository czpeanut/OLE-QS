  stem: 臺灣有些地名的命名與當地地形特徵有關。下圖為大漢溪部分河段的經建版地形圖，圖中有許多地名命名為「XX 坪」。試問「坪」這種地名與下列何種地形有關？
  options:
  - label: A
    content: 氾濫平原
  - label: B
    content: 三角洲
  - label: C
    content: 曲流
  - label: D
    content: 河階
