- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 廣達 1,500 公頃的臺灣高美溼地，擁有豐富的生態景觀，市府將耗資 3 億 6 千萬興建一座鑽石級綠建築「體驗館」，遊客來此 1 小時，即可欣賞到高美溼地一年四季、一日晨昏等多種風情之美，民眾抬頭仰望遼闊無邊際的湛藍天空、觀賞溼地特有的鳥類、蟹魚，將會是趟豐富的生態之旅。請問高美溼地屬於哪一種海岸地形？
  options:
  - label: A
    content: 岬灣海岸
  - label: B
    content: 洲潟海岸
  - label: C
    content: 珊瑚礁海岸
  - label: D
    content: 斷層海岸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)高美溼地位於臺灣中部濱臨臺灣海峽的西部沿海地區，因堆積作用旺盛形成平坦沙岸地形，廣闊的潮間帶（又稱溼地）孕育出多元且豐富的沿岸生態。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 下圖為 2021 年世界各國出口的貨物、服務、貨幣價值總和中，用來償還國際債務之比例，比例愈高顏色愈深。請問比例高的國家大多具有下列哪些特色？(甲)出口貨物中以高科技產品為主(乙)持續受到反吸的影響經濟發展相對落後(丙)皆輸出技術到世界各地賺取外匯(丁)多屬於邊陲或半邊陲國家(戊)專門化生產與出口單一農礦產品。正確的是
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丁戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 乙丁戊
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_112_台北_明倫_社會_地理_g10s2e3/s1_6_f1.png
    crop:
      page: 2
      rect:
      - 140.25
      - 251.0
      - 543.8
      - 456.1
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依據圖中顏色判斷非洲、中亞及中南美洲國家大多有此現象。這些國家過去受殖民影響，以出口單一初級農礦業產品為主（(戊)），在全球分工體系中屬於提供便宜勞動力及原料加工的邊陲或半邊陲國家（(丁)），不僅獲利微薄且深受海外市場與全球經濟波動影響。此外，這些國家經常為了開採農礦原料或發展基礎建設而欠下大量外債，反而加劇了與已開發國家（核心國家）的發展差距，此又稱為反吸現象（(乙)）。故選(D)。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '下表為《中國生態農業學報》對中國沙漠化的因素分析，由表中可以推測出，下列何者為造成中國沙漠化的最根本原因？

    | 原因 | 過度伐林 | 過度放牧 | 過度開墾 | 水資源 利用失當 | 沙丘移動 | 都市建設與 工商發展 | 其他 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 比例 | 32 ％ | 29 ％ | 23 ％ | 6 ％ | 6 ％ | 1 ％ | 3 ％ |'
  options:
  - label: A
    content: 氣候異常
  - label: B
    content: 林業發展
  - label: C
    content: 農牧業
  - label: D
    content: 人口增加
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 表中過度伐林及放牧的占比最高，代表拓墾自然環境取得農牧礦資源的需求極高，而開採資源的需求源於大量人口增加及現代化的生活方式，依此推估(D)乃為沙漠化的根本原因。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 臺灣自 17 世紀起開始與世界接軌，先後受到不同文化的洗禮，現今的生活中存在著多元文化的色彩。下列有關臺灣文化景觀的說明：(甲)臺鐵「普悠瑪」列車是以臺東西拉雅族語來命名(乙)新北三峽老街的街屋有巴洛克風格紋飾，為荷西時代所留下的建築(丙)臺中大甲鎮瀾宮媽祖遶境活動是由漢人的宗教祭典發展而來(丁)花蓮瑞穗、池上、關山等地名是日本殖民時所留下的地名(戊)燒餅、油條、牛肉麵等美食是隨戰後中國軍民來臺所帶入。上述正確的是
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丁戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)普悠瑪稱號源於臺東卑南族，原意為部落首領所在地，延伸有集合團結之意涵；(乙)三峽老街街屋建於日治時期，其建築特色屬於閩南建築，如亭仔腳、女兒牆、狹長屋身等。然建築立面的巴洛克式的雕花裝飾則受日治影響，反映當時日本西化運動的時代特色；(丙)媽祖信仰源於中國閩粵移民，大甲鎮瀾宮的媽祖神像於清雍正時期從湄洲天后宮恭請來臺供奉；(丁)日治時期有規模的鼓勵日人移臺開墾，當時在臺灣東部地區建立了許多日人移民聚落並為該地重新命名，包括瑞穗、關山、池上等；(戊)軍民隨著國民黨撤退來臺時，許多習慣北方麵食的軍眷在取得美援麵粉時，便將中國北方的家鄉麵食透過街邊小食或餐館的方式推廣至臺灣社會。故選(D)。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 下圖是臺灣某種氣候現象出現的頻率數值。下列哪一個氣象諺語與此氣候現象有關？
  options:
  - label: A
    content: 五月南風飄飄晴
  - label: B
    content: 紅日當空，傾盆立至
  - label: C
    content: 六月十九，無風水也吼
  - label: D
    content: 西北雨落不過田岸
  assets:
  - key: s1_9_f1
    kind: figure
    file: doc_112_台北_明倫_社會_地理_g10s2e3/s1_9_f1.png
    crop:
      page: 3
      rect:
      - 229.8
      - 48.6
      - 454.3
      - 159.45
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從圖中出現機率較高的時節為夏、秋兩季，判斷此氣候現象應為颱風，故應選夏季，因太平洋海水升溫而孕育出颱風。(C)農曆六月十九約為國曆七月下旬，此時節為節氣大暑過後，正值太平洋颱風生成旺盛時節，即使颱風尚未靠近，也會導致沿海浪大的現象。(A)為冷暖氣團交會所帶來的鋒面雨。(B)(D)為夏季高溫對流旺盛，於午後出現雨時短、雨勢強，但雨區小的對流雨型態。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 雲林外傘頂洲近年已成重要觀光地區，只要天氣好，每天都有觀光漁筏出港登洲，假日更是多達上千人次，不過學者預估這片樂土可能在 2028 年消失在海平面；漁民及觀光漁筏業者更不看好，認為壽命最多只剩 5 年，再不搶救保固，「移動的國土」將變為「消失的國土」。請問文中「消失的國土」的形成原因，最可能與下列何者有關？
  options:
  - label: A
    content: 曾文溪輸沙量持續減少
  - label: B
    content: 氣候變遷黑潮流速加快
  - label: C
    content: 海陸板塊運動造成下沉
  - label: D
    content: 六輕工業區造成突堤效應
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)六輕工業區設於濁水溪以南，阻擋濁水溪口的漂沙隨沿岸流南下，減少更南端外傘頂洲（沙洲）的沙源，故使其沙洲面積逐年縮減。此因興建人工堤防造成堤前堆積、堤後侵蝕的現象，即稱為「突堤效應」。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 右圖為某一族群以當地岩石建造的傳統民宅。請問下列 4 組橫麥卡托（TM）二度分帶投影坐標，何者最接近民宅的所在位置？（緯距 1 度＝111 公里）
  options:
  - label: A
    content: （224838 , 2516953）
  - label: B
    content: （305216 , 2783145）
  - label: C
    content: （163091 , 2543768）
  - label: D
    content: （234746 , 2634355）
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_112_台北_明倫_社會_地理_g10s2e3/s1_11_f1.png
    crop:
      page: 3
      rect:
      - 375.5
      - 270.6
      - 561.95
      - 383.55
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 以穿越臺灣南北的中央經線（東經 121 度）及橫貫臺灣中部的北回歸線（北緯 23.5 度）為基準後，轉換此兩參考經緯線的 TM 二度分帶坐標值為（250000 , 2608500）。依此推估(A)位於臺灣南部的屏東山區，為排灣族及魯凱族主要分布地區，此地原民的傳統建築為圖中石板屋形式。(B)位於臺灣東北部山區，為泰雅族主要分布地。(C)為臺灣西南部沿海地區，為閩粵移民主要居住地。(D)位於臺灣中部南投地區，為邵族主要分布地。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 1980 年代起亞洲四小龍經濟快速起飛，1990 年代後亞洲四小虎也致力工業發展，而 2000 年代後的金磚四國皆企圖脫離邊陲區努力成為半邊陲區，尤其中國的發展經驗和亞洲四小龍類似，但是仍有明顯的差別。請問下列敘述哪 2 項正確？(甲)透過核心區的資金技術擴散，使得原為邊陲區的東亞、東南亞地區得以進入工業化的階段(乙)東亞、東南亞的新興工業化國家與中國皆是透過市場經濟來發展的資本主義國家(丙)亞洲四小龍、四小虎、中國在核心區的跨國企業投資後，從技術密集產業或貨物轉運業開始發展帶動經濟成長(丁)在亞洲四小龍、四小虎、中國陸續脫離邊陲區後，也能透過本地的跨國企業控制其他邊陲區。正確的是
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丁
  - label: D
    content: 丙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 全球分工的模式源於核心國家透過技術與資金，看重邊陲與半邊陲國家豐富的勞動力及資源而進行投資，因而帶動邊陲或半邊陲國家的基礎建設及產業結構轉型。待這些國家工業化及現代化發展程度提升後，因勞力及環保等生產成本隨之提升，將迫使勞力密集或高汙染產業轉移到更邊陲的國家進行加工製造。依此概念選擇(C)(甲)(丁)。
- id: doc_112_台北_明倫_社會_地理_g10s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 下圖為 2014 年中國三級產業就業人口比例及 GDP 產值比例橫條圖。根據圖中資訊，可以得到下列哪 3 項推論？(甲)農業人口有所得偏低的現象(乙)第三級產業從業人口數最多(丙)中國工業已轉型為以生產附加價值高的產品為主(丁)中國經濟發展以工業、服務業為主軸。正確的是
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  assets:
  - key: s1_13_f1
    kind: figure
    file: doc_112_台北_明倫_社會_地理_g10s2e3/s1_13_f1.png
    crop:
      page: 3
      rect:
      - 162.3
      - 637.4
      - 363.55
      - 742.9
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)依據圖中訊息判讀農業就業人口占比遠比其 GDP 所得低許多，故可判定農業就業人口所得偏低(甲)。而第三級（服務業）就業人口占比稍高於其他產業(乙)。工業及服務業的 GDP 占比超過 90 ％，故可推論中國以第二、三級產業為主軸(丁)，但無法推論其所生產的工業產品等級。
