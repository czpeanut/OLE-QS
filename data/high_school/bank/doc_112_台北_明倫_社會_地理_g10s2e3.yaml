  stem: 金門國家公園有許多獅子形象的石雕，居民用以鎮風剋煞，稱為石獅爺。某生欲至該國家公園附近的一個聚落，探究「石獅爺設立位置與盛行風向的關係」，過程中包括田野調查、位置測量、資料蒐集等。請問若該生要獲得較具科學性的成果，除利用 GPS 工具外，還適合透過下列哪 3 項資料作為支持此探究主題的材料？(甲)遊客問卷結果(乙)耆老訪談紀錄(丙)聚落分布圖（比例尺 1／400,000）(丁)聚落內部測繪圖（比例尺 1／1,000）(戊)聚落附近測站的氣候數據(己)田野調查當天的風向風速計測量數據。正確的是
