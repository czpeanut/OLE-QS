  answer_status: verified
  answer_source: answer_key
  explanation: 酯化的過程中，醇上的O原子會接上原先羧基的C＝O之C，並形成共價鍵。故酯類化合物中，接上C＝O的氧原子來自於醇，故應為(C)選項。
