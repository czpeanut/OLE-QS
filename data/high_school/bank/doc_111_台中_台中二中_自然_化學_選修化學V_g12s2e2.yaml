  stem: 將$CH_{3}CH_{2}CH_{2}$Br與NaOH共熱反應，生成的產物中含有機物X以NaBr和$H_{2}$O，則X為下列何者？
  options:
  - label: A
    content: $CH_{3}CH_{2}CH_{2}$OH
  - label: B
    content: $CH_{3}$CH＝$CH_{2}$
  - label: C
    content: $CH_{3}CH_{2}$OH
  - label: D
    content: $CH_{2}$＝$CH_{2}$
  - label: E
    content: $CH_{3}$C≣CH
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 本反應為脫水反應，鹵烷與強鹼在醇溶劑中進行脫去反應可得烯類。或可由原子不滅得知，產物為$C_{3}H_{6}$，丙烯。故選(B)。
