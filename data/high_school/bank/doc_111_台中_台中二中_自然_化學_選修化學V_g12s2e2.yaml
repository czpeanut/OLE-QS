  stem: 以同位素$^{18}$O來標示測定反應$CH_{3}$COOH＋$CH_{3}^{18}$OH的產物，應為何者？
  options:
  - label: A
    content: $CH_{3}C^{18}OOCH_{3}$＋$H_{2}$O
  - label: B
    content: $CH_{3}$CHO＋$CH_{3}^{18}$OOH
  - label: C
    content: $CH_{3}CO^{18}OCH_{3}$＋$H_{2}$O
  - label: D
    content: $CH_{3}CH^{18}$O＋$CH_{3}$OOH
  - label: E
