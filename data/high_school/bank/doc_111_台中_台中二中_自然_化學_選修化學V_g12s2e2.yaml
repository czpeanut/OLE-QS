    content: '7'
  group_stem: '生物體內含有許多不同種類的脂肪酸，其碳鏈中的碳－碳鍵均為單鍵者稱為飽和脂肪酸，具碳－碳雙鍵者稱為不飽和脂肪酸，不飽和脂肪酸中的碳－碳雙鍵可經由氫化反應形成飽和脂肪酸。以下是生活中常見的脂肪酸：

    (甲)棉籽油中的軟脂油酸（$C_{16}H_{30}O_{2}$） (乙)向日葵籽油中的亞麻油酸（$C_{18}H_{32}O_{2}$） (丙)豬油中的油酸（$C_{18}H_{34}O_{2}$） (丁)魚油中的DHA（$C_{22}H_{32}O_{2}$）

    (戊)棕櫚油中的軟脂酸（$C_{16}H_{32}O_{2}$）'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (丁)中不飽和度最高，為7。但須扣除C＝O雙鍵，故需消耗6 mol的氫氣。故選(D)。
- id: doc_111_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 感光色素結構的改變啟動了對大腦的神經脈衝，從而形成視覺。而化合物甲為人體視網膜細胞內之重要感光色素組成的一部分，化合物甲在吸收光後可轉變為化合物乙，其分子結構及其光照的轉換如圖所示。下列關於化合物甲與化合物乙的敘述，哪一項<u>錯誤</u>？
  options:
  - label: A
    content: 化合物甲、乙均可與多侖試劑反應
  - label: B
    content: 化合物甲、乙具有相同分子式為同分異構物
  - label: C
    content: 化合物甲中以$sp^{3}$混成的碳原子數目有8個
  - label: D
    content: 化合物甲中以$sp^{2}$混成的碳原子數目有11個
  - label: E
    content: 化合物甲與化合物乙皆難溶於水，為脂溶性化合物
  assets:
  - key: s1_10_f1
    kind: figure
    file: doc_111_台中_台中二中_自然_化學_選修化學V_g12s2e2/s1_10_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 828.5
      - 459.05
      - 936.45
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)皆具有醛基（CHO單元），故都會與多侖試劑反應；(B)正確，甲乙互為順反異構物；(C)共9個（六員環中4個、5個甲基）；(D)正確，共有五組碳碳雙鍵，另有一個醛基，共11個$sp^{2}$的碳；(E)碳數很多，只有一個親水性官能基－醛基，故應為脂溶性化合物。故選(C)。
