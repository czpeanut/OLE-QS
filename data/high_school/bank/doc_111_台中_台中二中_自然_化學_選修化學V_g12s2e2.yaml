  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  group_stem: '生物體內含有許多不同種類的脂肪酸，其碳鏈中的碳－碳鍵均為單鍵者稱為飽和脂肪酸，具碳－碳雙鍵者稱為不飽和脂肪酸，不飽和脂肪酸中的碳－碳雙鍵可經由氫化反應形成飽和脂肪酸。以下是生活中常見的脂肪酸：

    (甲)棉籽油中的軟脂油酸（$C_{16}H_{30}O_{2}$） (乙)向日葵籽油中的亞麻油酸（$C_{18}H_{32}O_{2}$） (丙)豬油中的油酸（$C_{18}H_{34}O_{2}$） (丁)魚油中的DHA（$C_{22}H_{32}O_{2}$）

    (戊)棕櫚油中的軟脂酸（$C_{16}H_{32}O_{2}$）'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
