    content: 酚類：90
  - label: B
    content: 胺類：35
  - label: C
    content: 有機酯：56
  - label: D
    content: 醯胺：47
  - label: E
    content: 芳香族羧酸：122
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)酚：苯酚，$C_{6}H_{5}$OH，分子量＝94；(B)胺：甲胺，$CH_{3}NH_{2}$，分子量＝31；(C)酯：甲酸甲酯，$HCOOCH_{3}$，分子量＝60；(D)醯胺：甲醯胺，$HCONH_{2}$，分子量＝45；(E)芳香族羧酸：苯甲酸，$C_{6}H_{5}$COOH，分子量＝122。故選(E)。
