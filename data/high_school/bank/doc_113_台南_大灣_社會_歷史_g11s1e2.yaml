  answer_status: verified
  answer_source: answer_key
  explanation: (A)習近平提出「伊斯蘭教中國化」，可見穆斯林難以維持他們的生活習慣。(B)色目人主要擔任財經相關的官職。(D)中國政府的措施是為加強對穆斯林的控制，並非維持宗教初衷。
