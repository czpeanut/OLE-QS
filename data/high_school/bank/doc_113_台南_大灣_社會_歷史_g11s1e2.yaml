  stem: 「新聞龍捲風」為國內一檔知名的政論節目，打著「上知天文，下知地理」的口號。今天節目主持人處魚邀請一群來賓共同討論「資本主義對社會的影響」。第一位來賓友儀：「資本主義是一套經濟思想體系，個人或群體透過努力，以獲取利潤最大化為原則」。第二位來賓青得：「英國經濟學家亞當．斯密提出自由放任的理論，認為經濟活動會循著自然的規律，政府不需干涉」。第三位來賓蚊折：「政府應該要透過立法保障私有財產，並維持市場公平競爭，才能促使資本家願意投入更多資本，刺激社會正向進步」。第四位來賓跆鳴：「在馬克思所著的《資本論》，書中提到透過階級間的互助，才能使得生產效率和意願隨時處在高點，進而不斷累積財富。」上述四位來賓的說法，請你透過課程所學的知識來判斷哪位來賓的論述有誤且應該如何修改？
