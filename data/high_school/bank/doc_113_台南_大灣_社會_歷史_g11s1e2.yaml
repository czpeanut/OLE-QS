  stem: 阿爾罕布拉宮是一座位於西班牙南部城市格拉納達的建築，其結合清真寺、宮殿、城堡三合一的作用。原址建有要塞稱為 Al-Andalus，宮殿為格拉納達摩爾人國王所建，現在則是一處穆斯林建築、文化博物館。1232 年在老城改建的基礎上逐步形成現存規模。宮牆外圍有 30 米高的石砌城牆。有兩組主要建築群：一組為「石榴院」，另一組為「獅子院」。其作為伊斯蘭教世俗建築與造園技藝完美結合的建築名作以及阿拉伯式宮殿庭院建築的優秀代表，1984 年被選入聯合國教科文組織世界文化遺產名錄之中。關於這座建築以及其歷史背景，下列敘述何者正確？
