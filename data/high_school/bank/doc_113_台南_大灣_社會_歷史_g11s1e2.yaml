    ※請閱讀下列資料後回答問題：

    西元 7 世紀中葉起，將近一百年內，阿拉伯人勢力版圖擴張取得驚人的成果，穆斯林征服了大部分的古羅馬世界，甚至整個古波斯帝國。學者嘗試剖析背後的驅策動力以及特殊的環境形勢，發現了幾個重要的事實。首先，伊斯蘭教早期擴張跟宗教聖戰並沒有直接關聯，因為阿拉伯征服者並沒有強迫其他民族改信阿拉，而且由於阿拉伯人所徵收的稅額，相較原來統治的拜占庭人和波斯人低，穆斯林的征服行動其實是大受人民愛戴的，尤其是拜占庭帝國統治下的敘利亞和埃及（異端的基督徒）。但是，信眾聽從哈里發的指示，凝聚了阿拉伯人的士氣和信心，也帶領阿拉伯軍隊跨出原來的半島邊界，產生一種「替天行道」的宗教狂熱感。其次，對戰利品和新財富的企盼，也促使阿拉伯人離開沙漠，且愈走愈遠。比較特別的是，穆斯林向外擴展的時候，剛好兩個主要的競爭對手—拜占庭和波斯，由於彼此間長期的兵戎相見，國力嚴重耗損，根本無法抵禦穆斯林這股新興勢力，伊斯蘭教也因此迅速奠立基礎。

    【資料來源：改寫自 Philip Lee Ralph 等著；文從蘇等譯，《世界文明史（前篇）：從史前時代到前近代》（臺北：五南，2009 年），頁 311】'
  group_stem: 1880 年，法國政府在國族主義的氛圍下，正式將 7 月 14 日訂為國慶日，來紀念一個「舊世界結束，新法國開始」的日子。第三共和成立之後，許多人即開始討論國慶日，7 月 14 日並不是唯一的選擇。國慶日的清單中還包括了 1830、1848、1870 三個年份，但這些年份有的會讓人想起「戰敗」的恥辱，有的則是「共和政體短命而悲劇」的記憶，有的則是因為「資產階級味道太濃」，最後都被放棄了。國慶日最好在大革命的年代搜尋。但是哪一天最適合呢？攻陷巴士底監獄？國民會議宣布廢除封建特權？還是共和國成立？最後多數人都同意「7 月 14 日」這一天。這一天象徵解放的開始，人民從封建、教會、王權中解放，自此獲得自由。這一天社會上的特權被廢除，自此法國人民獲得平等。而且這一天是由資產階級、城市居民、鄉民和軍隊肩並肩站在一起，團結合作而成。自此，「7 月 14 日」成為法國國慶日，每年都會有各種方式的紀念活動。 【資料出處：改寫自克希斯提昂．阿瑪維，〈七月十四日：從震怒之日到節慶日〉，收錄皮耶．諾哈編、戴麗娟譯，《記憶所繫之處》（臺北：行人文化實驗室，2012），頁 42 ～ 48】
