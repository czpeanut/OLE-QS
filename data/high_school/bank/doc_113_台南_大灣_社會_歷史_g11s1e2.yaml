    content: 穆斯林得以在現今中國宗教寬容的態度下，維持他們的生活習慣
  - label: B
    content: 元代的朝廷上可看見許多穆斯林擔任國家軍事相關的官員
  - label: C
    content: 在元代的主要港口泉州可看見許多穆斯林社區以及清真寺
  - label: D
    content: 中國政府阻止伊斯蘭教干預世俗生活是為了維持宗教初衷
  group_stem: '資料一：及至宋代，由於「海上絲路」的昌盛，吸引了許多大食、波斯商人定居廣州、泉州、揚州等地，他們一面經商，一面傳教。13 世紀，蒙古人開拓了一個橫跨歐亞大陸的帝國，掀起穆斯林遷華的熱潮；而蒙古人為牽制漢人、南人，也刻意重用許多信仰伊斯蘭教的色目人為官。在元朝一代，中國的穆斯林增至百萬人，因此有「回回遍天下」之諺。

    資料二：伊斯蘭教於數個世紀前傳入中國。如今，中國的穆斯林人數在 2200 萬至 2300 萬之間，占這個國家 14 億人口的一小部分。其中，回族和維吾爾族是人口最多的少數民族。維族主要生活在新疆，回族則生活在全國各地的聚居點。他們當前面臨的限制措施可追溯至 2015 年，當時習近平首先提出了所謂「伊斯蘭教中國化」的問題，表示所有信仰均應服從中國文化和中共。2018 年，習近平政府曾下達一項祕密文件，命令地方官員阻止伊斯蘭教干預世俗生活和國家職能。'
