  group_stem: '資料一：他提議建立一些小的社區或獨立的社群，命名為「法郎吉」。在其中的工作和社會生活都是井井有條的，從而能最有效的發揮「激情」的作用。為了使工作更有吸引力，工作被設置成輪換的形式，讓每個人都有機會去完成社區裡那些愉快和必要的工作任務。社區裡的所有人都應該去做他們天生最適合做的工作。例如老婦人去當媒人；小男孩和小女孩負責處理垃圾，因為他們喜歡玩泥巴。

    資料二：他相信人性本善，如今善良本性受到損害完全是因為錯誤的環境。如果人們生活在一個合作有序、相互尊重而不是自私自利、相互競爭的社會中，他們的本質就會自然而然地顯現出來。大約從 1800 年開始，他在新拉納克將一個廢棄的工廠城鎮轉變成一個乾淨有序的社區，不僅為孩子提供了完善的教育措施，而且還有著高品質的生活水準。這樣的成就是源於合作原理的運用，也是他本人的善舉，還引起了不小的爭論，但是這一方案被看作早期最為成功的社會主義嘗試之一。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一的敘述可判斷屬於烏托邦社會主義者的主張，因此答案為(C)傅立葉，理想社區。(A)費邊社會主義者。(B)馬克思社會主義者。(D) 16 世紀英國大法官，屬於基督教人文主義學者，提倡理想社會制度，但與「法郎吉」無關。
