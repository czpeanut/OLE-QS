- id: doc_113_台南_大灣_社會_歷史_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 關於資料一中所提到的《大憲章》，下列敘述何者「有誤」？
  options:
  - label: A
    content: 13 世紀在封建貴族的逼迫下，由英王約翰所簽署
  - label: B
    content: 該法限制王權，確立英國貴族享有的政治權利與自由
  - label: C
    content: 該文件簽署後，英國政治正式邁入民主共和制
  - label: D
    content: 影響日後英國議會逐漸朝向上下議院的兩院制演進
  group_stem: '資料一：《大憲章》對國王在封建規範下能做什麼和不能做什麼，做了詳盡的規定，也就是對封臣的權利做了全面的承認。由於作為其精髓的兩條原則：臣民對其財產和人身安全的保障權，以及在臣民與君王的契約關係中臣民對暴君的反抗權，它便具有相當深遠的意義。所以，儘管它作為一份表現封建貴族意志和自由的正式宣言書，在以後幾個世紀的大多數時間中曾被淹沒未聞，但是到了 17 世紀的英國革命時，《大憲章》又被人們發掘出來。

    資料二：詹姆士一世登位後對議會的合法性進行挑戰，並一再使衝突升級；查理一世則對議會的存在加以否定，最終使暴力衝突不可避免。最初戰爭爆發時，議會僅是為生存而戰；但隨著戰爭勝利，議會提出了主權要求，從而標示著專制王權的結束，議會以人民的名義入主國家主權。

    資料三：議會發布了一項《權利法案》，作為新國王登基的條件，所以說國王是由議會創造出來的，沒有議會就沒有國王的王位。這就把近一百年困擾英國不休的主權問題解決了。為了解決這個問題，英國紛爭了近一個世紀，期間有大規模的動盪，有戰爭，有革命；但最終解決問題的卻是不流血的手段，這對後來的歷史產生的巨大的影響。最高權力從國王一個人手裡轉交到貴族（議員）一批人手裡，改變了英國的政體，這就是革命的意義。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)《大憲章》簽署後，英國仍然維持君主政體。
