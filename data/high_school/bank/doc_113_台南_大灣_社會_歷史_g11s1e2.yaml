  stem: 2023 年全球新冠肺炎疫情稍緩解後，停辦兩年的麥加朝聖活動再次開放參加。印尼為全球穆斯林人數最多的國家，但麥加之路相當遙遠，為了讓能力不足的穆斯林也能夠前往麥加，印尼政府歷年來使用稅收補助人民朝聖的費用。2023 年 2 月《雅加達郵報》的社論提到：「政府今年擬降低朝聖補助費用，此舉恐造成國內大批穆斯林無法出國參與朝聖。」請問上述提及的政府補助，與下列穆斯林五功中哪一項關係較密切？
  options:
  - label: A
    content: 念功
  - label: B
    content: 禮功
  - label: C
    content: 齋功
  - label: D
    content: 課功
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文說明補助人民朝聖的費用，主要使用「稅收」，因此答案為(D)課功，許多伊斯蘭政權會將穆斯林的「課功」化為宗教稅，用以救濟貧困者。
