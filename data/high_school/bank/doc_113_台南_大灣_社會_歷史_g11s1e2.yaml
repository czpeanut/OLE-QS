  stem: 西方史家稱都爾戰役（732 年）是改變歐洲命運的戰役，他們說：「倘若阿拉伯人在這一戰役中獲勝，那麼今天我們在巴黎和倫敦看到的都是清真寺，而不是這些大教堂；我們在牛津和其他學術中心聽到的，會是《古蘭經》而不是《聖經》的闡述。」請問此戰功是指法蘭克人成功抵擋下列何者對歐洲的侵略？
  options:
  - label: A
    content: 奧米亞王朝
  - label: B
    content: 阿拔斯王朝
  - label: C
    content: 塞爾柱蘇丹國
  - label: D
    content: 鄂圖曼帝國
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「都爾戰役」發生於 732 年，是法蘭克王國與穆斯林軍隊之間的一場關鍵戰役，當時穆斯林勢力來自奧米亞王朝，該王朝於 8 世紀中期達到鼎盛，版圖遼闊，橫跨中東、北非及伊比利半島，並試圖進一步向歐洲內陸擴張，故選(A)。(B)應改為奧米亞王朝。(C)(D)為土耳其人，分別於 11 世紀、14 世紀崛起。
