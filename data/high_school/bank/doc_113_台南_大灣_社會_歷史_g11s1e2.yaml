- id: doc_113_台南_大灣_社會_歷史_g11s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 5
  stem: '以下是兩位史家描述穆罕默德死後的伊斯蘭世界：

    資料甲：「穆罕默德沒有指定繼任者，內部因繼任者問題出現極大分歧。另外，許多新近接受伊斯蘭教的市鎮和貝都因部族都詆毀這一信仰，並重新宣布獨立，試圖擺脫麥加的控制。」

    資料乙：「先知去世後，穆斯林的領導者必須決定穆斯林共同體應採用何種模式。許多人以為不需建立一個『國家』，因這種政體在阿拉伯史無前例。有些人認為，每個部落團體應選出自己的宗教領袖……。又有些人認為穆罕默德原想要由姪子阿里接任，……但他太年輕，經驗也不足，因此阿布．巴克得到多數支持被選為先知的第一任哈里發。」

    根據上述資料，關於這個新生的伊斯蘭世界情況的論述，何者正確？'
  options:
  - label: A
    content: 阿拉伯半島原是個統一、各族和諧共處的社會
  - label: B
    content: 新生的伊斯蘭世界面臨嚴重的分裂與瓦解危機
  - label: C
    content: 穆罕默德的領導威信與《可蘭經》的權威受到質疑
  - label: D
    content: 伊斯蘭領導者對共同體應採的形式有明確共識
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)穆罕默德死後各地紛起反叛，顯示原非統一和諧的社會。(C)資料未提到穆罕默德的個人威信或《可蘭經》的權威受到質疑，爭議點在政治繼承與領導形式。(D)資料乙明確指出缺乏共識，甚至對是否建立國家都有不同看法。

    23.1848 年革命風潮後，奧地利帝國的國力已衰，在當時歐洲盛行的思潮中，對多元民族組成的帝國打擊最大的是民族主義，境內諸多民族受此影響而要求獨立建國，因此是「危險」、「動搖國家秩序之基礎」，答案為(D)。(A)自由主義重視個人自由與代議政治，雖挑戰舊有秩序，但與「建立新國家」的主張無直接關聯。(B)資本主義影響在經濟，與歷史、國家秩序較無關聯性。(C)保守主義主張維持傳統秩序與君主權威，是該外長自身的立場，而非他所反對的激進理念。

    24.第一次世界大戰後，許多女性投入戰時勞動，展現能力，促使部分國家（如英國）賦予女性投票權；到了第二次世界大戰，再次證明女性可勝任男性工作，戰後女性轉而強調職場上的「同工同酬」，要求經濟上平等對待，是婦女權益從政治平權邁向經濟平權的標誌。

    25.工業革命後，從事農業者會愈來愈少，因此乙為農業。受到工業革命影響，從事工業人數將大幅成長，服務業者受此影響應會相對下滑，但當工業發展至一定程度時，服務業者將再度上升，因此甲為服務業，丙為工業，故選(A)。

    26.《邦聯條例》傾向地方分權，政府組織較鬆散，難以因應全國財政、對外貿易及軍事組建等問題，因此《美國憲法》改採聯邦制，確立中央政府與地方州政府的主從關係，答案為(A)。

    27.從英國國內的輿論來看，批評者認為東印度公司應該以國家利益為主，多輸出本國工業製品，不使國家貴金屬外流，可推知為(B)重商主義的主張。

    28.(D)當蕃人有罪時，由廣州官員審理後，再交由蕃長執行，可見蕃長還是享有部分司法執行權。

    29.從統治區域包括西亞、阿拉伯半島邊緣、巴爾幹半島、北非等地，可判斷為鄂圖曼土耳其帝國，故選(C)。(A)基督教世界的東征行動為 11 ～ 13 世紀，目標為塞爾柱土耳其人。(B) 1683 年前已占領巴爾幹半島，鄂圖曼土耳其帝國在 1683 年後國力開始衰退。(D)凱末爾發起復興運動，並未建立共產政權。

    30.從法案的內容來看，其目的在保護英國本土的產業經濟，因此答案為(C)。(A)此時為重商主義的保護政策。(B) 17 世紀的主要競爭國家為荷蘭。(D)限制殖民地生產與英國本土競爭的產品。

    31.1651 年前，英國才剛經歷過 1642 ～ 1649 年的(A)清教徒革命，改建共和政體。(B) 1688 年。(C)(D)為 19 世紀前期法國的革命。

    32.(A)亞當斯密並未提出全球化貿易。(B)資產階級爭取政治權利較多透過法律、制度、選舉等方式，而「階級鬥爭」是馬克思提出的無產階級奪權方式。(D)英國最早發生工業革命，勞資衝突也是最早產生。

    33.資料一為維也納會議後的日耳曼邦聯，資料二為拿破崙戰爭之前的反法運動，資料三為俾斯麥領導的統一運動，因此按時間先後順序為(B)二一三。

    34.從資料一到資料三，可知德意志建國運動與民族主義的昂揚相關，過程既漫長又曲折，雖然也曾向普魯士俾斯麥的路線妥協，最終仍朝向建立民族國家的目的前進，因此答案為(D)。

    35.當時奧地利作為多民族帝國中的主導力量，極力壓制統一德意志的民族主義運動，因為德意志統一會削弱其在中歐的霸權地位，甚至威脅其本身多民族結構的穩定，故選(A)。

    36.哥多華位於(C)西班牙南端，於 8 世紀時為奧瑪亞王朝所占領，因此成為中古歐洲唯一的伊斯蘭土地。

    37.題文所述為 11 ～ 13 世紀的十字軍運動，以「收復聖地」為號召，但在第四次軍事行動竟受到威尼斯商人煽動，轉而攻擊劫掠君士坦丁堡，即題文中的「屹立近千年的堡壘」，在東羅馬帝國滅亡後已改稱為(A)伊斯坦堡。

    38.路易十六與王后皆於國民公會時期被送上斷頭臺，法國進入「第一共和」時期，故選(B)。

    39.圖(一)為 1871 年建立的德意志帝國；圖(二)有日耳曼邦聯的界線，為 1815 年維也納會議後；圖(三)為 1806 年神聖羅馬帝國被解散後的地圖；圖(四)為 11 世紀後的神聖羅馬帝國。因時間順序為(D)圖四→圖三→圖二→圖一。

    40.(C)圖(三)已無神聖羅馬帝國，在當地出現萊茵邦聯與華沙大公國，故為拿破崙稱霸時期的歐洲地圖。'
