  explanation: '(1) 1830 年爆發七月革命，使中產階級取得參政權，但是隨之建立的「七月王朝」明顯以資產階級利益為主，故而不久又爆發 1848 年二月革命。

    (2) 1848 年的二月革命建立「第二共和」，同時也開始實施成男普選，然而路易拿破崙於四年後以公民投票方式稱帝，建立「法蘭西第二帝國」。

    (3) 1870 年普法戰爭戰敗，皇帝拿破崙三世被俘，法國爆發革命後建立「第三共和」，從此確立共和政體。'
