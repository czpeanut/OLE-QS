    $\frac{1}{3}$＝$\frac{2}{6}$：重複 1 個；$\frac{2}{3}$＝$\frac{4}{6}$：重複 1 個

    共 $6^{2}$－5－2－1－2－1－1－1＝23（個）

    故選(C)'
- id: doc_112_台北_明倫_數學_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 令（1.01）$^{100}$＝M，（1.001）$^{1000}$＝N，根據二項式定理，下列選項何者正確？
  options:
  - label: A
    content: 2＞M＞N
  - label: B
    content: 2＞N＞M
  - label: C
    content: M＞N＞2
  - label: D
    content: N＞M＞2
  - label: E
    content: M＞2＞N
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'M＝（1.01）$^{100}$＝（1＋0.01）$^{100}$

    ＝1＋$C_{1}^{100}$×0.01＋$C_{2}^{100}$（0.01）$^{2}$＋$C_{3}^{100}$（0.01）$^{3}$＋……＋$C_{100}^{100}$（0.01）$^{100}$

    ＝1＋1＋$\frac{100\times 99}{2 ！}$×（0.01）$^{2}$＋$\frac{100\times 99\times 98}{3 ！}$×（0.01）$^{3}$＋……＋$\frac{100
    ！}{100 ！ 0 ！}$×（0.01）$^{100}$＞2

    N＝（1.001）$^{1000}$＝（1＋0.001）$^{1000}$

    ＝1＋$C_{1}^{1000}$×0.001＋$C_{2}^{1000}$（0.001）$^{2}$＋$C_{3}^{1000}$（0.001）$^{3}$＋……＋$C_{1000}^{1000}$（0.001）$^{1000}$

    ＝1＋1＋$\frac{1000\times 999}{2 ！}$×（0.001）$^{2}$＋$\frac{1000\times 999\times 998}{3
    ！}$×（0.001）$^{3}$＋……＋$\frac{1000 ！}{1000 ！ 0 ！}$×（0.001）$^{1000}$＞2

    又 $1.001^{10}$＝（1＋0.001）$^{10}$

    ＝1＋$C_{1}^{10}$×0.001＋……＋$C_{10}^{10} (0.001)^{10}$

    ＝1＋0.01＋……＋（0.001）$^{10}$

    ＞1.01

    ⇒ N＝$1.001^{1000}$＝（（1.001）$^{10}$）$^{100}$＞（1.01）$^{100}$＝M

    ∴N＞M＞2

    故選(D)'
