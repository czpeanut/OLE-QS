- id: doc_112_台北_明倫_數學_g10s2e2_s3_3
  section: 3
  number: 3
  type: multiple
  page: 3
  stem: 已知 f（x）＝$\left( ax^{2}-\frac{1}{x} \right) ^{5}$展開後，$x^{4}$ 項的係數為 80，則下列選項哪些正確？
  options:
  - label: A
    content: a＞2
  - label: B
    content: a＝2
  - label: C
    content: a＜2
  - label: D
    content: $x^{8}$ 項的係數小於 $x^{7}$ 項的係數
  - label: E
    content: x 項的係數小於常數項
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$\left( ax^{2}-\frac{1}{x} \right) ^{5}$的一般項為$C_{k}^{5}$（$ax^{2}$）$^{5－k}\left(
    -\frac{1}{x} \right) ^{k}$

    ＝$C_{k}^{5}a^{5－k}$（－1）$^{k}x^{2（5－k）＋（－k）}$

    ＝$C_{k}^{5}a^{5－k}$（－1）$^{k}x^{10－3k}$

    (A) ╳ (B) ○ (C) ╳：10－3k＝4 ⇒ k＝2

    $x^{4}$ 項係數為$C_{2}^{5}a^{3}$（－1）$^{2}$＝80 ⇒ a＝2

    (D) ╳：10－3k＝8 ⇒ k＝$\frac{2}{3}$（不合），即 $x^{8}$ 項的係數為 0

    10－3k＝7 ⇒ k＝1，$x^{7}$ 項的係數為$C_{1}^{5}2^{4}$（－1）$^{1}$＝5×16×（－1）＝－80

    ∴$x^{8}$ 項的係數大於 $x^{7}$ 項的係數

    (E) ○：10－3k＝1 ⇒ k＝3，x 項的係數為$C_{3}^{5}2^{2}$（－1）$^{3}$＝10×4×（－1）＝－40

    10－3k＝0 ⇒ k＝$\frac{10}{3}$（不合），即常數項為 0

    ∴x 項的係數小於常數項

    故選(B)(E)'
