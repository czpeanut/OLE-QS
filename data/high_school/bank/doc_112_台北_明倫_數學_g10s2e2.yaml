  stem: '考慮有理數$\frac{m}{n}$，其中 m，n 為正整數且 1$\leq$m$\leq$6、1$\leq$n$\leq$6，則這樣的數值共有幾個？$\left(
    註 : \frac{1}{2}與\frac{2}{4}同值 , 視為相同 , 只算一個 \right)$'
  options:
  - label: A
    content: 21 個
  - label: B
    content: 22 個
  - label: C
    content: 23 個
  - label: D
    content: 24 個
  - label: E
    content: 25 個
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{1}{1}$＝$\frac{2}{2}$＝$\frac{3}{3}$＝$\frac{4}{4}$＝$\frac{5}{5}$＝$\frac{6}{6}$：重複
    5 個

    $\frac{2}{1}$＝$\frac{4}{2}$＝$\frac{6}{3}$：重複 2 個；$\frac{3}{1}$＝$\frac{6}{2}$：重複
    1 個

    $\frac{1}{2}$＝$\frac{2}{4}$＝$\frac{3}{6}$：重複 2 個；$\frac{3}{2}$＝$\frac{6}{4}$：重複
