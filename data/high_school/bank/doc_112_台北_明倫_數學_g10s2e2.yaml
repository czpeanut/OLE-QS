  stem: 下列各選項之方法數，哪些選項的方法數是 $3^{4}$？
  options:
  - label: A
    content: 3 本不同的書全部分給 4 個人，每個人所得書本數不限的方法數
  - label: B
    content: 4 顆不同顏色的球全部放進 3 個相異的盒子中，每盒球數不限的方法數
  - label: C
    content: 使用 1，2，3（可重複使用）排出一個四位數字的方法數
  - label: D
    content: 3 輛不同的計程車，每車最多可載 4 人（不含司機）也可不載人，4 人同時搭車方法數
  - label: E
    content: 4 所大學中，選擇 3 所依序參訪，參訪的方法數
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：每本書有 4 種選擇：$4^{3}$

    (B) ○：每顆球有 3 種選擇：$3^{4}$

    (C) ○：每個位置有 3 種選擇：$3^{4}$

    (D) ○：每人有 3 種選擇：$3^{4}$

    (E) ╳：$P_{3}^{4}$＝4×3×2＝24

