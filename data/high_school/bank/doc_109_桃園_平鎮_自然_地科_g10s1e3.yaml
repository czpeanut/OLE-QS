  section: 2
  number: 37
  type: multiple
  page: 6
  stem: 以下短文有不少謬誤，下列以粗體線標示的敘述哪些正確？（應選3項） 人類生活對石油的依賴甚深；然而且
  options:
  - label: A
    content: <u>石油是化石燃籵的一種，屬於非再生資源，終有枯竭的一天</u>，且大量使用石油已對地球環境與其永續發展造成了許多負面的衝擊。 石油常作為燃料，是許多機具運作的能量來源，但是
  - label: B
    content: <u>石油的燃燒會釋放出大量的羊化碳到氣圈中，強化溫室效應</u>，這已被認為是今日全球暖化的主因，且
  - label: C
    content: <u>二氧化碳進入平流層後，會與臭氧產生反應，導致臭氧洞的產生</u>；此外，大氣中二氧化碳氣體驟增的結果，亦使得海洋中溶解、吸收的二氧化碳驟然增加，二氧化碳被海水吸收後會形成碳酸，造成了海洋酸化，
  - label: D
    content: <u>海洋中具矽質殼體的生物，例如：矽藻，將首當其衝受到殼體溶解的威脅</u>，生態系統也將岌岌可危。 石油亦是塑膠製品的原料，而塑膠多難以自然分解，眾多未被妥善回收的廢棄塑膠製品會到達海洋。
  - label: E
    content: <u>在北太平洋環流系統包圍的中央海域中，那裡流速緩慢，也發現有塑膠碎屑聚集的大型區塊</u>，由於這些碎屑在海水中過於富集，已嚴重破壞海洋生態環境。（109學測）
  answer:
  - A
  - B
  - E
