- id: doc_109_桃園_平鎮_自然_地科_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '在全球暖化及溫室效應等議題中，非常具有代表性的一張圖就是基林曲線（Keeling curve）（如圖一），這甲由美國加州斯克里普斯海洋學研究所的已故研究員基林（Charles David Keeling）所創，他從1958年開始在夏威夷茂納羅亞火凹上利用精密儀器觀測大氣中二氧化碳的濃度。根據考古氣候學，人類出現以前的百萬年間，二氧化碳在大氣中的自然變化範圍是190～280ppm，變化的主因為氣候波動變化，這段期間地球海洋與土壤吸收許多大氣中的二氧化碳，欣演緩衝的角色。但是近百年來人為影響已破壤此種平衡，而造成環境的巨大變化。基林首次觀測到的記錄是316ppm，相較於工業革命前的280ppm還不算太多。但自1960年代以來，基林甲線呈現45度角的上升趨勢，並在2013年7月已到達400ppm，假使此一加速上升的趨勢（每年約增加2.5ppm）不減，基林曲線將在本世紀末前超過570ppm，氣候變化將會越過臨界點，帶來毀滅性的災難；而人類文明仍有望逢凶化吉的最後防線－450ppm，亦將會在20年內失守。 二氧化碳的增加，除了會加速地球的暖化現象外，對大氣中其他氣體的濃度也會有影響，其中對氧氣的影響結果，在經過基林的後人拉爾夫。基林多年的努力研究，已經成功建立類似於基林曲線的氧氣曲線圖（如圖二）。從此圖氧氣年度的變化，可以清楚的看出氧氣有逐年減沒的趨勢，此趨勢與二氧化碳的變化相反，則下列何項敘述是造成上一變化最合理的原因？

    圖一 圖二'
  options:
  - label: A
    content: 此種變化趨勢只是巧合，兩者並無直接的關連性
  - label: B
    content: 大氣中每製造一個二氧化碳分子，就相當於減少一個氧分子
  - label: C
    content: 全球暖化現象使地球的均溫變高，造成植物光合作用的速率減緩
  - label: D
    content: 溫室效應使地表的日照增強，使較多的氧分子經光化後形成臭氧
  - label: E
    content: 二氧化碳濃度較高時，金屬元素較易氧化，將較多的氧儲仿地殼中
