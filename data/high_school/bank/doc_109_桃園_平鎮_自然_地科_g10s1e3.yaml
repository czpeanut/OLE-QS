- id: doc_109_桃園_平鎮_自然_地科_g10s1e3_s2_42
  section: 2
  number: 42
  type: multiple
  page: 7
  stem: 永續發展必頁在不超過「環境承載力」之條件下，可持續滿足現在與未來世代之需求，且所採取之措施可為社會接受、符合經合經濟效益及工程技術可行。以水資源為例，「環境承去力」是指可以供給的最大水資源。現代社會為因應乾旱事件或未來水資源短缺，往往採行以下措施：(甲)蓋水庫或攔河堰；(乙)推行節約用水；(丙)推行雨水儲集與廢汙水回收；(丁)蓋海水淡化廠；(戊)抽取地下水；從永續發展的觀點，下列敘述哪些正確？（應選3項）
  options:
  - label: A
    content: 甲有環保疑慮，等缺水發時再做就好
  - label: B
    content: 乙應盡量兼顧生泃品質
  - label: C
    content: 丁的水源取之不盡用之不竭，應無條件大力推行
  - label: D
    content: 戊需考慮地層下陷與水質問題
  - label: E
    content: 上述所有措施中，最符合永續發展精神的是乙與丙（107學測）
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
