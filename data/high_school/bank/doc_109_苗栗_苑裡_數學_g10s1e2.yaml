  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 下列各選項哪些正確？
  options:
  - label: A
    content: 水平直線的斜率為 0
  - label: B
    content: 鉛直線的斜率為 0
  - label: C
    content: x 軸的方程式為 x＝0
  - label: D
    content: 設直線 L：3x＋4y－12＝0，則 x 截距為 4
  - label: E
    content: 兩直線 $L_{1}$：2x＋y＋100＝0 和 $L_{2}$：x－2y＋200＝0 互相垂直
  explanation: '(A)○

    (B)╳：鉛直線沒有斜率

    (C)╳：x 軸$\Rightarrow$y＝0

    (D)○：令 y＝0 得 3x－12＝0$\Rightarrow$x＝4

    ∴x 截距＝4

    (E)○：$L_{1}$：2x＋y＋100＝0$\Rightarrowm_{1}$＝$-\frac{2}{1}$＝－2

    $L_{2}$：x－2y＋200＝0$\Rightarrowm_{2}$＝$-\frac{1}{-2}=\frac{1}{2}$

    $m_{1}$×$m_{2}$＝$(-2) \times \frac{1}{2}$＝－1$\RightarrowL_{1}$⊥$L_{2}$

    故選(A)(D)(E)'
