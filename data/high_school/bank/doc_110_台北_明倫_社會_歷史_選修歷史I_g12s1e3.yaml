  stem: 在中古歐洲的農民茅舍和手藝人的家庭作坊，婦女的管理技能和實際勞動，跟她帶來的其他任何財產一樣，對家庭經濟極為重要。她們也因此比貴族婦女赢得更多得自由，其丈夫普遍更可能直接留給妻子。這些有限度的自由使她們在孀居或規劃孩子的未來時，擁有更多開放的選擇。請問上述的歷史描述可能造成下列哪一種現象的發生？
