  section: 1
  number: 5
  type: single
  page: 1
  stem: 有歐洲學者認為大約8,000年前開始，人口激增造成食物製造方式的改變，漸漸地較繁重、較密集的農業取代了女人的園藝。隨著計劃性耕耘及土地開墾取代隨意的播種，男性的角色益發堅固跟重要。因為爭奪土地與資源引發的遷徙和戰爭中，男性在體力和機動性事都比女性更占優勢。這些衝突製造出支配與被支配團體、赢家與輸家、宰制階級與被宰制階級，女性自此在兩性關係中日益處於劣勢。根據該學者的說法，請問這一兩性關係的變化大約出現於什麼時間？
