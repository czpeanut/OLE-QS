  stem: 根據該學者的說法，中世紀早期嫁妝數額不高的可能原因是？
  options:
  - label: A
    content: 男女比例失衡，女性找不到男人出嫁
  - label: B
    content: 歐洲人民平均收入太低，出不起嫁妝
  - label: C
    content: 戰亂造成人口減損，婦女價值大大提升
  - label: D
    content: 女性遁入修道院，拒絕進入婚姻市場
  group_stem: '題，請根據資料回答下列問題：

    ◎從出生的那一刻起，嫁妝的陰影就壟罩著婦女：她代表著潛在的損失。新娘家送給新郎家的嫁妝直到十二世紀才超過男方家给新娘的彩禮，但隨著後幾個世紀，嫁妝急遽增加，並在文藝復興時期達到頂峰，在整個文藝復興時期，經濟負擔不合比例地轉嫁到新娘一方，而且所需額度也不斷攀升。嫁妝的膨脹或許反映了婦女地位的下降：這與中世紀早期的情形恰恰相反，那時整個歐洲戰爭頻仍，急需待嫁的姑娘彌補人口的減損。然而隨著歐洲經濟的復甦和擴張，有女兒的家庭就需要在殘酷和沉重的婚姻市場上討好不情願的丈夫了。 在歐洲西北部，積攢組織家庭所需要的財富普遍促進了男女雙方的晚婚。為了積攢一筆微薄的資金，姑娘們長年累月地動，女孩從小就被送到保護人家做僕人，後者將全權負責供養她們，並答應在規定工作期限後讓她們帶一筆嫁妝回家。在十五世紀晚期，捐贈嫁妝資金，與其他對窮人的捐贈相形見絀，成為最重要的社會慈善型式。'
