  - label: C
    content: 庚
  - label: D
    content: 己
  group_stem: '【閱讀二】 花蓮的蜜香紅茶與產自北部山區的東方美人茶皆以具有蜂蜜般的氣味而聞名，這種特殊氣味的產生與茶樹的防禦作用有關，一種綠色小昆蟲：小綠葉蟬以刺吸式口器吸食茶葉以獲得養分，啟動茶樹的生物性防禦，產生具有蜜香的揮發性物質吸引獵蛛前來捕食，採收被昆蟲「加工」的茶葉經不同的製程，造就了他們的高知名度。 沖泡東方美人茶，在注入的開水中茶葉搖曳舒展，被形容如同舞動的美人，這是他的名稱由來。百年前新竹地區的茶農發現，被小綠葉蟬吸食過，稱為「著涎」的茶葉（「涎」即口水）萎縮變黃，著涎後手工採摘一心二葉（附圖一），此受損的茶葉竟可製成高價烏龍茶，以為是沾上小蟲的口水所賜，而且著涎的程度愈高，蜜味更顯品質更佳，因此又稱之為「涎仔茶」。

    附圖二為北部某一低海拔產茶山區面積相，若分別施行自然農法（不使用農藥）及慣行農法（使用安全農藥）的兩塊茶園中，以黏蟲盒捕獲小綠葉蟬的數量統計。 X：實線表示施行自然農法，無使用農藥之茶園的各月份捕獲隻數及數量變化。 Y：虛線表示施行慣行農法，使用對小綠葉蟬無害，但可減少他的天敵與競爭者的安全農藥之茶園各月份捕獲隻數及數量變化。

    附圖(一) 附圖(二)'
