  group_stem: 【閱讀一】 1982年，美國科學家闕克及歐特曼研究原生動物四膜蟲，發現某種具有催化能力的RNA：pre-rRNA（先驅rRNA），pre-rRNA在無任何蛋白質類酵素環境中，可以進行自我催化，自行切割成rRNA，因此將此pre-rRNA稱為「RNA酵素」。rRNA與r蛋白質可組合成核糖體（ribosome），簡述如下： pre-rRNA $────→$ pre-rRNA斷裂形成rRNA $──────→$ 形成核糖體 後來又有科學家發現RNA病毒在宿主細胞中繁殖時，帶有遺傳訊息的RNA的複製方式： RNA $───→$ 互補的RNA $────→$ RNA（即RNA有複製能力） 由於以上的發現，科學家吉爾伯特據此提出「RNA世界」假說。
