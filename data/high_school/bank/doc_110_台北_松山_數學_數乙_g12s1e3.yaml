- id: doc_110_台北_松山_數學_數乙_g12s1e3_s4_1
  section: 4
  number: 1
  type: calc
  page: 2
  stem: 請舉例說明下列等式不一定成立：$\int_{a}^{b}$f (x) g (x) dx＝($\int_{a}^{b}$f (x) dx )．($\int_{a}^{b}$g (x) dx )。 即找實數a , b與函數f (x) , g (x)，使得$\int_{a}^{b}$f (x) g (x) dx≠($\int_{a}^{b}$f (x) dx )．($\int_{a}^{b}$g (x) dx )。
  answer:
  - 詳見解析
  answer_status: verified
  answer_source: answer_key
  explanation: 令f (x)＝x，g (x)＝1，a＝0，b＝2， 則$\int_{a}^{b}$f (x) g (x) dx＝$\int_{0}^{2}$x dx＝$\frac{1}{2}x^{2}\left| _{0}^{2} \right.$＝2， 但 ($\int_{a}^{b}$f (x) dx ) ($\int_{a}^{b}$g (x) dx )＝($\int_{0}^{2}$x dx ) ($\int_{0}^{2}$1 dx )＝($\frac{1}{2}x^{2}\left| _{0}^{2} \right.$) ( x$\left| _{0}^{2} \right.$)＝2×2＝4， 故$\int_{a}^{b}$f (x) g (x) dx≠($\int_{a}^{b}$f (x) dx )．($\int_{a}^{b}$g (x) dx )。
- id: doc_110_台北_松山_數學_數乙_g12s1e3_s4_2
  section: 4
  number: 2
  type: calc
  page: 2
  stem: '設某產品的需求函數D (x)＝700－$x^{2}$ ( 元／個 )，供給函數S (x)＝200＋5x ( 元／個 )。試求：

    (1) 均衡量與均衡價。

    (2) 消費者剩餘與生產者剩餘。'
  answer:
  - (1) 20個，300元 ；(2) $\frac{16000}{3}$ 元 ，1000 元
  answer_status: verified
  answer_source: answer_key
  explanation: (1) 令D (x)＝S (x)，則700－$x^{2}$＝200＋5x ⇒ $x^{2}$＋5x－500＝0 ⇒ ( x－20 ) ( x＋25 )＝0，得x＝20或－25 ( 不合 ) 又D (20)＝S (20)＝200＋5×20＝300， 所以均衡量為20個，均衡價為300元。 (2) 消費者剩餘為 $\int_{0}^{20}$( 700－$x^{2}$ ) dx－300×20＝( 700x－$\frac{1}{3}x^{3}$ )$\left| _{0}^{20} \right.$－6000＝$\frac{34000}{3}$－6000＝$\frac{16000}{3}$ ( 元 )。 生產者剩餘為 300×20－$\int_{0}^{20}$( 200＋5x ) dx＝6000－( 200x－$\frac{5}{2}x^{2}$ )$\left| _{0}^{20} \right.$＝6000－5000＝1000 ( 元 )。
