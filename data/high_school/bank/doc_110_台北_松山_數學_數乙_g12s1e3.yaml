- id: doc_110_台北_松山_數學_數乙_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 試問定積分$\int_{0}^{1}$( 1＋$\sqrt{1-x^{2}}$) dx的值為何？
  options:
  - label: A
    content: $\pi$
  - label: B
    content: $\frac{\pi}{2}$
  - label: C
    content: $\frac{\pi}{4}$
  - label: D
    content: $\frac{\pi}{2}$＋1
  - label: E
    content: $\frac{\pi}{4}$＋1
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $\int_{0}^{1}$( 1＋$\sqrt{1-x^{2}}$) dx＝$\int_{0}^{1}$1 dx＋$\int_{0}^{1}\sqrt{1-x^{2}}$dx＝x$\left| _{0}^{1} \right.$＋$\frac{1}{4}$×$1^{2}$×$\pi$＝$\frac{\pi}{4}$＋1。故選(E)。
- id: doc_110_台北_松山_數學_數乙_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 設函數f (x)＝4x－1，且F (a)＝$\int_{0}^{a}$f (x) dx的最小值為何？
  options:
  - label: A
    content: －$\frac{1}{8}$
  - label: B
    content: －$\frac{1}{2}$
  - label: C
    content: '0'
  - label: D
    content: $\frac{1}{2}$
  - label: E
    content: $\frac{1}{8}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: F (a)＝$\int_{0}^{a}$f (x) dx＝$\int_{0}^{a}$( 4x－1 ) dx＝( $2x^{2}$－x )$\left| _{0}^{a} \right.$＝$2a^{2}$－a ＝2 ( $a^{2}$－$\frac{1}{2}$a＋$\frac{1}{16}$)－$\frac{1}{8}$＝2 ( a－$\frac{1}{4}$)$^{2}$－$\frac{1}{8}$≥－$\frac{1}{8}$， 故F (a) 的最小值是－$\frac{1}{8}$。故選(A)。
