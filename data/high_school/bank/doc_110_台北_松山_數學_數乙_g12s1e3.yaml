- id: doc_110_台北_松山_數學_數乙_g12s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 設實數a ≤ b ≤ c，試選出正確的選項。
  options:
  - label: A
    content: $\int_{-a}^{a}$f (x) dx＝0
  - label: B
    content: $\int_{a-1}^{a}$f (x) dx＝$\int_{a}^{a+1}$f (x) dx
  - label: C
    content: $\int_{a}^{b}$(－f (x)) dx＝$\int_{b}^{a}$f (x) dx
  - label: D
    content: $\int_{a}^{c}$f (x) dx－$\int_{a}^{b}$f (x) dx＝$\int_{b}^{c}$f (x) dx
  - label: E
    content: $\int_{a}^{b}$| f (x) | dx ≤ |$\int_{a}^{b}$f (x) dx |
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：舉反例，令f (x)＝$x^{2}$，則$\int_{-a}^{a}$f (x) dx＝$\frac{1}{3}x^{3}\left| _{-a}^{a} \right.$＝$\frac{2}{3}a^{3}$。 (B) ×：舉反例，令f (x)＝x，則$\int_{a-1}^{a}$f (x) dx＝$\frac{1}{2}x^{2}\left| _{a-1}^{a} \right.$＝$\frac{1}{2}$[$a^{2}$－( a－1 )$^{2}$]＝a－$\frac{1}{2}$， $\int_{a}^{a+1}$f (x) dx＝$\frac{1}{2}x^{2}\left| _{a}^{a+1} \right.$＝$\frac{1}{2}$[( a＋1 )$^{2}$－$a^{2}$]＝a＋$\frac{1}{2}$， 故$\int_{a-1}^{a}$f (x) dx≠$\int_{a}^{a+1}$f (x) dx。 (C) ○：$\int_{a}^{b}$(－f (x)) dx＝－$\int_{b}^{a}$(－f (x)) dx＝$\int_{b}^{a}$f (x) dx。 (D) ○：$\int_{a}^{c}$f (x) dx＝$\int_{a}^{b}$f (x) dx＋$\int_{b}^{c}$f (x) dx ⇒ $\int_{a}^{c}$f (x) dx－$\int_{a}^{b}$f (x) dx＝$\int_{b}^{c}$f (x) dx。 (E) ×：舉反例，令f (x)＝x，則$\int_{-1}^{1}$| f (x) | dx＝$\int_{-1}^{1}$| x | dx＝$\int_{-1}^{0}$(－x) dx＋$\int_{0}^{1}$x dx＝－$\frac{1}{2}x^{2}\left| _{-1}^{0} \right.$＋$\frac{1}{2}x^{2}\left| _{0}^{1} \right.$＝$\frac{1}{2}$＋$\frac{1}{2}$＝1， 而 |$\int_{-1}^{1}$f (x) dx |＝|$\frac{1}{2}x^{2}\left| _{-1}^{1} \right.$|＝|$\frac{1}{2}$－$\frac{1}{2}$|＝0，
    故$\int_{-1}^{1}$| f (x) | dx＞|$\int_{-1}^{1}$f (x) dx |。 故選(C)(D)。
- id: doc_110_台北_松山_數學_數乙_g12s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 1
  stem: 設函數f (x) 圖形如右，其中f (x) 的定義域為區間 [0 , 6]，試選出正確的選項。
  options:
  - label: A
    content: 若區間 [0 , 6] 中的兩實數a，b，其中a ≤ b，使得$\int_{a}^{b}$f (x) dx最大，則 ( a , b )＝( 1 , 5 )
  - label: B
    content: 函數f (x) 在區間 [1 , 5] 的平均為$\frac{5}{4}$
  - label: C
    content: 函數f (x) 在區間 [0 , 6] 的平均為$\frac{13}{12}$
  - label: D
    content: 函數2 f (x) 在區間 [1 , 6] 的平均為$\frac{8}{5}$
  - label: E
    content: 函數－f (x) 在區間 [1 , 6] 的平均為$\frac{6}{5}$
  assets:
  - key: s2_3_f1
    kind: figure
    file: doc_110_台北_松山_數學_數乙_g12s1e3/s2_3_f1.png
    crop:
      page: 1
      rect:
      - 538.1
      - 754.15
      - 648.3
      - 830.8
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：由圖形知，$\int_{1}^{5}$f (x) dx之值最大，故 ( a , b )＝( 1 , 5 )。 (B) ○：$\frac{\int_{1}^{5} f(x)dx}{5-1}$＝$\frac{\frac{1}{2}(1+4)\times 2}{4}$＝$\frac{5}{4}$。 (C) ×：$\frac{\int_{0}^{6} f(x)dx}{6-0}$＝$\frac{-\frac{1}{2}\times 1\times 1+\frac{1}{2}\times (1+4)\times 2-\frac{1}{2}\times 1\times 2}{6}$＝$\frac{\frac{7}{2}}{6}$＝$\frac{7}{12}$。 (D) ○：$\frac{2\times 5-2\times 1}{6-1}$＝$\frac{8}{5}$。 (E) ×：$\frac{-5+1}{6-1}$＝－$\frac{4}{5}$。 故選(A)(B)(D)。
