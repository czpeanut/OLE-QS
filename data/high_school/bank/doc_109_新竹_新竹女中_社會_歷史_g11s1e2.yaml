  stem: '資料一：伊斯蘭教信仰裡有禁酒令，但，咖啡倒是沒有在《古蘭經》裡被明文禁止。於是，爪哇咖啡慢慢成為了「伊斯蘭教的酒」。

    資料二：某時，聖城麥加的宗教學者對於喝咖啡這件事情表達不滿。因為他們沒辦法接受：喝咖啡不是為了熬夜禮拜，而是單純享受喝咖啡的樂趣。

    資料三：1511年麥加總督以「咖啡違背《古蘭經》教誨，讓人墮落」為由，頒布「咖啡禁止令」，使得身為咖啡愛好者的國王因此暴怒，收回禁令。

    以上三則資料可以作為下列哪一主題的證據？'
  options:
