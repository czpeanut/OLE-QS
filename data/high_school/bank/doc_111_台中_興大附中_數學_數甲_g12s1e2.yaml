- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 若 f（x）＝$ax^{3}$＋$bx^{2}$＋c 的圖形有反曲點（－1，1），且在 x＝－1 處的切線斜率為 3，則序組（a，b，c）＝＿＿＿＿。
  answer:
  - （－1，－3，3）
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$3ax^{2}$＋2bx，f''''（x）＝6ax＋2b

    f（x）有反曲點（－1，1）$\Rightarrow\begin{cases}f ( -1 )= 1 \\ f '''' ( -1 )= 0\end{cases}\Rightarrow\begin{cases}-a +b +c = 1 \\ -6a + 2b = 0\end{cases}$

    又 f（x）在 x＝－1 處的切線斜率為 3$\Rightarrow$f''（－1）＝3

    $\Rightarrow$3a－2b＝3

    解$\begin{cases}-a +b +c = 1 \\ -3a +b = 0 \\ 3a -2b = 3\end{cases}\Rightarrow\begin{cases}a =-1 \\ b =-3 \\ c = 3\end{cases}$

    故序組（a，b，c）＝（－1，－3，3）'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s3_4
  section: 3
  number: 4
  type: fill
  page: 2
  stem: 設 A（0，1）為一定點，P 為拋物線 y＝$x^{2}$－x 上之動點，則$\overline{PA}$的最小值為＿＿＿＿。
  answer:
  - $\frac{\sqrt{5}}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: '令 P（t，$t^{2}$－t）

    $\Rightarrow\overline{PA}^{2}$＝$t^{2}$＋（$t^{2}$－t－1）$^{2}$＝$t^{2}$＋$t^{4}$＋$t^{2}$＋1－$2t^{3}$－$2t^{2}$＋2t

    ＝$t^{4}$－$2t^{3}$＋2t＋1

    令 f（t）＝$t^{4}$－$2t^{3}$＋2t＋1$\Rightarrow$f''（t）＝$4t^{3}$－$6t^{2}$＋2＝0$\Rightarrow2t^{3}$－$3t^{2}$＋1＝0

    $\Rightarrow$（t－1）（$2t^{2}$－t－1）＝0$\Rightarrow$（t－1）$^{2}$（2t＋1）＝0

    $\Rightarrow$t＝1 或$-\frac{1}{2}$

    又當 t＜$-\frac{1}{2}$時，f''（t）＜0 且 t＞$-\frac{1}{2}$時，f''（t）＞0

    $\Rightarrow$f（t）在 t＝$-\frac{1}{2}$時有最小值為$f \left( -\frac{1}{2} \right)$＝$\frac{1}{16}$－2×$\left( -\frac{1}{8} \right)$＋（－1）＋1＝$\frac{5}{16}$

    故$\overline{PA}$的最小值為$\sqrt{\frac{5}{16}}$＝$\frac{\sqrt{5}}{4}$'
