- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: $\int_{-2}^{1} ( x +│ x │+ 1 )dx$之值為何？
  options:
  - label: A
    content: '4'
  - label: B
    content: '5'
  - label: C
    content: '6'
  - label: D
    content: '7'
  - label: E
    content: '8'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{-2}^{1} ( x +│ x │+ 1 )dx$＝$\int_{-2}^{0} 〔 x +( -x )+ 1 〕dx$＋$\int_{0}^{1} ( x +x + 1 )dx$

    ＝$\left. x \right| _{-2}^{0}$＋$\left. ( x^{2}+x ) \right| _{0}^{1}$＝2＋2＝4

    故選(A)'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 令 f（x）＝x（x＋1）（$x^{3}$＋2），試問有多少個實數 a 滿足$\int_{0}^{a} f ' ( x )dx$＝0？
  options:
  - label: A
    content: 1 個
  - label: B
    content: 2 個
  - label: C
    content: 3 個
  - label: D
    content: 4 個
  - label: E
    content: 5 個
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '由微積分基本定理知，$\int_{0}^{a} f '' ( x )dx$＝f（a）－f(0)

    $\Rightarrow$a（a＋1）（$a^{3}$＋2）＝0$\Rightarrow$a＝0 或－1 或$\sqrt[3]{-2}$，有 3 個實根

    故選(C)'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '設 f（x）為實係數三次多項式函數。已知五個方程式的相異實根個數如下表所述：

    | 方程式 | 相異實根的個數 |

    | --- | --- |

    | f（x）－20＝0 | 1 |

    | f（x）－10＝0 | 1 |

    | f（x）＝0 | 3 |

    | f（x）＋10＝0 | 3 |

    | f（x）＋20＝0 | 1 |

    關於 f（x）的極小值α，試問下列哪一個選項是正確的？（$註$：極小值是指相對極小值，或稱為局部極小值）'
  options:
  - label: A
    content: α不存在
  - label: B
    content: －20＜α＜－10
  - label: C
    content: －10＜α＜0
  - label: D
    content: 0＜α＜10
  - label: E
    content: 10＜α＜20
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 設函數 f（x）＝$x^{2}$ 之圖形與直線 x＝0，x＝1 及 y＝0 所圍成的圖形區域為 R，若在 x 軸上，將 x＝0 至 x＝1 之線段 n 等分，並分別在這些等分點上作上矩形，則這些上矩形的總和（即上和）$U_{n}$ 為下列何者？
  options:
  - label: A
    content: $\frac{1}{3}-\frac{1}{2n}+\frac{1}{6n^{2}}$
  - label: B
    content: $\frac{1}{2}-\frac{1}{3n}+\frac{1}{6n^{2}}$
  - label: C
    content: $\frac{1}{3}+\frac{1}{2n}+\frac{1}{6n^{2}}$
  - label: D
    content: $\frac{1}{2}+\frac{1}{3n}+\frac{1}{6n^{2}}$
  - label: E
    content: $\frac{1}{2}+\frac{1}{3n}-\frac{1}{6n^{2}}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '因 f（x）＝$x^{2}$ 的圖形在 [ 0，1 ] 為遞增

    故第 k 等分區域（k＝1，2，……，n）的上矩形面積為$\left( \frac{k}{n} \right) ^{2}$×$\frac{1}{n}$

    得 $U_{n}$＝$\sum_{k =1}^{n} \left( \frac{k}{n} \right) ^{2}\times \frac{1}{n}$＝$\frac{1}{n^{3}}\sum_{k =1}^{n} k^{2}$＝$\frac{1}{n^{3}}$×$\frac{n ( n + 1 ) ( 2n + 1 )}{6}$＝$\frac{2n^{3}+ 3n^{2}+n}{6n^{3}}$＝$\frac{1}{3}$＋$\frac{1}{2n}$＋$\frac{1}{6n^{2}}$

    故選(C)'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 設三次函數 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d 的圖形如右所示，則下列哪些選項正確？
  options:
  - label: A
    content: a＞0
  - label: B
    content: b＜0
  - label: C
    content: c＜0
  - label: D
    content: d＞0
  - label: E
    content: $b^{2}$－3ac＜0
  group_stem: 說明：錯一個選項得 6 分，錯兩個選項得 2 分，錯 3 個選項以上不得分。
  shared_asset: g2_1_3
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：因函數圖形由左而右一直下降，得 a＜0

    (B)╳：反曲點的 x 坐標為$\frac{-b}{3a}$，又$\frac{-b}{3a}$＞0 且 a＜0，得 b＞0

    (C)○：f''（x）＝$3ax^{2}$＋2bx＋c$\Rightarrow$f''(0)＝c 表 f（x）在 x＝0 之切線斜率

    由題圖知，c＜0

    (D)○：f(0)＝d＞0

    (E)╳：因 f（x）無極值，f''（x）＝$3ax^{2}$＋2bx＋c 之判別式不為正

    $\Rightarrow$（2b）$^{2}$－4×3a×c$\leq$0$\Rightarrowb^{2}$－3ac$\leq$0

    故選(C)(D)'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: '已知一個 n 次實係數多項式 f（x）滿足下列性質：

    當 x＜0 時，f''（x）＜0 且 f''''（x）＞0；

    當 0＜x＜1 時，f''（x）＜0 且 f''''（x）＜0；

    當 1＜x＜4 時，f''（x）＜0 且 f''''（x）＞0；

    當 x＞4 時，f''（x）＞0 且 f''''（x）＞0。

    請選出正確的選項。'
  options:
  - label: A
    content: f'(2)＞f'(3)
  - label: B
    content: f（x）在 x＝4 時有最小值
  - label: C
    content: f（x）的圖形只有一個反曲點
  - label: D
    content: n 可能為 3
  - label: E
    content: f（x）的最高次項係數必為正
  group_stem: 說明：錯一個選項得 6 分，錯兩個選項得 2 分，錯 3 個選項以上不得分。
  shared_asset: g2_1_3
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台中_興大附中_數學_數甲_g12s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 考慮坐標平面上函數 y＝$x^{3}$＋2x＋4 的圖形（x 為任意實數），試問下列哪些選項是正確的？
  options:
  - label: A
    content: 圖形有最高點，也有最低點
  - label: B
    content: 圖形有水平切線
  - label: C
    content: $x^{3}$＋2x＋1000＝0 恰有一個實數解
  - label: D
    content: 若（a，b）在圖形上，則（－a，－b＋8）也在圖形上
  - label: E
    content: 圖形與三直線 x＝0，x＝1，y＝0 所圍成的區域之面積大於 6
  group_stem: 說明：錯一個選項得 6 分，錯兩個選項得 2 分，錯 3 個選項以上不得分。
  shared_asset: g2_1_3
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$x^{3}$＋2x＋4$\Rightarrow$y''＝$3x^{2}$＋2＝0 無實數解$\Rightarrow$y'' 恆正

    $\Rightarrow$y＝$x^{3}$＋2x＋4 為遞增函數

    又 y''''＝6x＝0$\Rightarrow$x＝0 為反曲點的 x 坐標

    (A)╳：y＝$x^{3}$＋2x＋4 為遞增函數

    故無最大值（即最高點）與最小值（即最低點）

    (B)╳：y''＝0 無實數解，故無水平切線

    (C)○：$x^{3}$＋2x＋1000 亦為遞增函數，故 $x^{3}$＋2x＋1000＝0 恰有一個實數解

    (D)○：反曲點為（0，4）

    又（a，b）對（0，4）之對稱點為（－a，－b＋8）

    得（－a，－b＋8）也在圖形上

    (E)╳：∵當 0$\leq$x$\leq$1 時，$x^{3}$＋2x＋4＞0

    ∴面積為$\int_{0}^{1} ( x^{3}+ 2x+4 )dx$＝$\left. \left( \frac{1}{4}x^{4}+x^{2}+ 4x \right) \right| _{0}^{1}$＝$\frac{1}{4}$＋1＋4＝$\frac{21}{4} < 6$

    故選(C)(D)'
