- id: doc_109_高雄_高雄中學_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 考慮函數 f（x）＝$\sqrt{3}$cosx＋sinx＋2，請問下列選項何者正確？
  options:
  - label: A
    content: f（x）是奇函數
  - label: B
    content: f（x）的週期是 2π
  - label: C
    content: 若 x 為任意實數，f（x）有最小值 0
  - label: D
    content: 在$\frac{\pi}{6}\leq x\leq \frac{7\pi}{6}$，f（x）是遞增函數
  - label: E
    content: x＝$\frac{\pi}{6}$是 f（x）的對稱軸
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$\sqrt{3}$cosx＋sinx＋2＝$2\sin \left( x + \frac{\pi}{3} \right) + 2$

    (A)╳：f（－x）≠－f（x）$\Rightarrow$非奇函數

    (B)○：週期為 2π

    (C)○：最小值為 2×（－1）＋2＝0

    (D)╳：x＝$\frac{\pi}{6}$時有最大值，x＝$\frac{7\pi}{6}$時有最小值

    $\Rightarrow$f（x）在$\frac{\pi}{6}\leq x\leq \frac{7\pi}{6}$為遞減

    (E)○：∵$f\left( \frac{\pi}{6} \right)$＝4 為最大值$\Rightarrowx = \frac{\pi}{6}$為 f（x）的對稱軸

    故選(B)(C)(E)'
