- id: doc_109_高雄_高雄中學_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: '已知函數 f（x）的圖形是由函數 g（x）＝cosx 經過以下步驟變換得到。

    ①將 g（x）圖形上所有點的縱坐標伸長為原來的 5 倍，（橫坐標不變），得到 k（x）。

    ②將 k（x）圖形上所有點的橫坐標伸長為原來的 3 倍，（縱坐標不變），得到 q（x）。

    ③將 q（x）圖形上所有點向右平移$\frac{\pi}{3}$單位長，得到 f（x）。

    試求 f（x）＝＿＿＿＿，f（x）的週期為＿＿＿＿。'
  answer:
  - 5 cos$\left( \frac{1}{3}x - \frac{\pi}{9} \right)$；6π
  answer_status: verified
  answer_source: answer_key
