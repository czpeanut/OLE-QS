  group_stem: ◎資料一：1793年，拿破崙大敗英國後，成為全國知名的英雄。1799年，他在政變奪權，逐漸成為軍事獨裁者並推動多項改革。1804年，他登基為法國皇帝，此後又擊潰奧、俄聯軍，成為歐洲的共主。1808年，他對英國實施經濟封鎖。因俄國拒絕配合他而展開征俄之役。戰事拖到寒冬降臨；他被迫撤退，五十萬精銳毀於一旦，他所創立的歐洲政治體系也隨即瓦解。1814年，他在各國聯軍攻陷巴黎後宣佈下野，之後被流放到厄爾巴島（Elba）。次年，他潛回巴黎宣布復辟，卻只維持了一百天。在滑鐵盧之役受挫後，他再次遜位，並被幽禁於大西洋的聖赫倫那島（St. Helena）。曾叱吒歐陸的他卒於該地，當時他才52歲。 資料二：以下是拿破崙向他最親信的近衛隊發表的告別演說：「二十年來，在我們的榮耀之路上，一直都有各位的陪伴。這些年來，即便我們成就非凡，各位的勇氣與忠誠也從未減損半分。有了各位，我們就有持續奮鬥的理由。只是這場戰爭如果持續下去，法國將會陷入更深的不幸。為了國家的福祉，我決定犧牲我的利益。我即將離開，但是你們一定要繼續為法國服務。她的幸福是我唯一的顧慮與最誠摯的期盼。請不要為了我而難過，如果我能逃離劫難，那也是為了彰顯各位的榮耀。我要把我們共同締造的成就寫成歷史。再會了，你們將永遠烙印在我心裡。
