  stem: 基督教早期發展多為信仰者自動的結合，原無固定組織。當它成為合法宗教之後，人數大量增加，固定的教會組織也逐漸形成，以便教義的傳播和信徒活動有常規可循。組織階層化的結果，產生了地區主教、教士等階級。而隨著階層化而來的是宗教權威的建立和集中。從上文可知？
