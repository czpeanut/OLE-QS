  answer:
  - $\frac{2}{3}$
  answer_status: verified
  answer_source: answer_key
  explanation: '令圖 1 中，每一小塊正方形面積為 1

    則 $A_{2}$＝2×1＝2×(1)

    $A_{3}$＝2×1＋2×$\left( \frac{1}{2} \right) ^{2}$＝2×$\left( 1+\frac{1}{4} \right)$

    $A_{4}$＝2×1＋2×$\left( \frac{1}{2} \right) ^{2}$＋2×$\left( \frac{1}{2} \right) ^{4}$＝2×$\left( 1+\frac{1}{4}+\frac{1}{16} \right)$

    …

    $A_{n}$＝2×$\left( 1+\frac{1}{4}+\left( \frac{1}{4} \right) ^{2}+\cdots \cdots +\left( \frac{1}{4} \right) ^{n-2} \right)$

    ＝2×$\frac{1\times \left( 1-\left( \frac{1}{4} \right) ^{n-1} \right)}{1-\frac{1}{4}}$＝$\frac{8}{3}-\frac{8}{3}\times \left( \frac{1}{4} \right) ^{n-1}$

    ∴$\lim_{n\rightarrow \infty} A_{n}$＝$\lim_{n\rightarrow \infty} \left( \frac{8}{3}-\frac{8}{3}\times \left( \frac{1}{4} \right) ^{n-1} \right)$＝$\frac{8}{3}$

    故所求為$\frac{8}{3}$÷4＝$\frac{2}{3}$'
