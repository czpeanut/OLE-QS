  stem: '右圖是<u>小附</u>利用電腦繪圖軟體 GeoGebra 設計的附中畢業戰袍的圖飾。其 V 字型的構圖設計，是先將正方形旋轉 45 度，然後選取對邊中點的連線將正方形 4 等分（圖 1），再移除最上方的小正方形，同時將左、右兩個小正方形塗上黑色（圖 2）。接下來<u>小附</u>改以最下方的小正方形為目標，重複上述圖 1 至圖 2 的所有動作，完成圖 3 的設計。仿此作圖流程，<u>小附</u>可陸續繪得圖 4、圖 5、……的設計稿如下。

    若以 $A_{2}$、$A_{3}$、$A_{4}$、$A_{5}$、……分別代表圖 2、圖 3、圖 4、圖 5、……中黑色塊的面積之和，則當 n 的數量夠大時，圖 n 中黑色塊的面積之和 $A_{n}$ 約為圖 1 大正方形面積的＿＿＿＿倍。'
