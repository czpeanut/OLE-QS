  stem: 已知等比數列〈$a_{n}$〉的首項 $a_{1}$＝0.9，公比 r＝0.1，若以級數 $S_{n}$ 表示為 $S_{n}$＝$\sum_{k=1}^{n} a_{k}$，試挑選出正確的敘述。
  options:
  - label: A
    content: $a_{n}$＜1
  - label: B
    content: $S_{n}$＜1
  - label: C
    content: $\lim_{n\rightarrow \infty} a_{n}$＝0
  - label: D
    content: $\lim_{n\rightarrow \infty} S_{n}$＝1
  - label: E
    content: $S_{n}$＜$0.\overline{9}$
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$a_{n}$＝0.9×（0.1）$^{n－1}$＜1

    (B) ○：$S_{n}$＝$\frac{0.9〔1-(0.1)^{n}〕}{1-0.1}$＝1－（0.1）$^{n}$＜1

    (C) ○：$\lim_{n\rightarrow \infty} a_{n}$＝$\lim_{n\rightarrow \infty}$（0.9×（0.1）$^{n－1}$）＝0

    (D) ○：$\lim_{n\rightarrow \infty} S_{n}$＝$\lim_{n\rightarrow \infty}$（1－（0.1）$^{n}$）＝1

    (E) ○：設 x＝$0.\overline{9}$ ……………①

    10x＝$9.\overline{9}$ ……………②

    ②－①得 9x＝9 ⇒ x＝1

    故 $S_{n}$＜$0.\overline{9}$＝1

    故選(A)(B)(C)(D)(E)'
