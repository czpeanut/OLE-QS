  stem: '■ 2019 年開館的臺南美術館二館，是由 2014 年榮獲普利茲克獎（建築界的諾貝爾獎）的<u>日本</u>建築師<u>坂茂</u>先生設計。其綠能建築的規劃兼顧城市美學、在地元素與低碳生態。美術館外觀的鋼架藉由二十面體的五角錐來象徵臺南市花（鳳凰花），建體的結構以垂直堆疊、錯位的長方體空間，提供自由彈性的參觀動線。屋頂採用「碎形幾何」的設計，以因應<u>臺南</u>炎熱的天候。當太陽以不同角度照射時，碎形屋頂可模擬大樹般的遮蔭效果。

    上述報導所提的「碎形幾何」是指謝爾賓斯基三角形，其演變步驟如下：

    A.取一個實心的正三角形 $a_{0}$。

    B.沿各邊中點挖除中心的小正三角形得 $a_{1}$。

    C.剩餘 3 個小正三角形重複上述動作得 $a_{2}$、$a_{3}$、……。

    若將平面上謝爾賓斯基三角形挖空的概念套用在空間中的正四面體上，可得謝爾賓斯基三角錐，其演變步驟如下：

    A.取一個實心的正四面體 $b_{0}$。

    B.沿各稜邊中點挖除中心的小正八面體得 $b_{1}$。

    C.剩餘 4 個小正四面體重複上述動作得 $b_{2}$、$b_{3}$、……。

    試計算下列各值：

    (1) 若 $a_{0}$ 的邊長為 16，則 $a_{3}$ 的面積＝＿＿＿＿。

    (2) 若 $b_{0}$ 的邊長為 12，則 $b_{2}$ 的體積＝＿＿＿＿。

    參考公式：正三角形的面積＝$\frac{\sqrt{3}}{4}a^{2}$；正四面體的體積＝$\frac{\sqrt{2}}{12}a^{3}$。'
