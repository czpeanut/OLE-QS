  stem: 若函數符合 f（－x）＝－f（x）的條件，則稱 f（x）是一個奇函數。試在下列選項中，挑選出奇函數。
  options:
  - label: A
    content: f（x）＝｜x｜
  - label: B
    content: f（x）＝x－$x^{3}$
  - label: C
    content: f（x）＝$2^{x}$
  - label: D
    content: f（x）＝log x
  - label: E
    content: f（x）＝sin x
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：f（－x）＝｜－x｜＝｜x｜＝f（x），其為偶函數

    (B) ○：f（－x）＝（－x）－（－x）$^{3}$＝－x＋$x^{3}$＝－（x－$x^{3}$）＝－f（x），其為奇函數

    (C) ╳：f（－x）＝$2^{－x}$≠f（x）

    f（－x）＝$2^{－x}$≠－f（x）

    其非奇函數，亦非偶函數

    (D) ╳：f（－x）＝log（－x）≠－f（x）

    f（－x）＝log（－x）≠f（x）

    其非奇函數，亦非偶函數

    (E) ○：f（－x）＝sin（－x）＝－sinx＝－f（x），其為奇函數

    故選(B)(E)'
