  stem: 2014 年「德國之聲中文網」記者蘇雨桐遭開除。蘇雨桐氣憤地批評，新聞臺的新主管上任後，積極改善與中國的關係，除了與中國環球時報互動頻繁，還要求旗下記者「不能只批評中國政府」。蘇雨桐並未接受公司的政策；新聞臺開除蘇雨桐時曾表示：「德國之聲聘任的是記者而非維權人士。」蘇雨桐年輕時在中國民間組織工作，也曾參與中國六四運動，受到中國政府威脅才出走他鄉，後來進入德國之聲擔任記者。若上述說法屬實，下列哪一個選項足以詮釋這個事件始末？
  options:
  - label: A
    content: 新主管上任後的新政策使旗下記者勞動條件惡化，主因是工時不斷增加
  - label: B
    content: 德國之聲放棄媒體的守門人角色，要求記者採用聳動標題來增加點閱率
  - label: C
    content: 記者不願意配合企業的產品置入新聞合作企畫，造成新聞臺年度收益損失
  - label: D
    content: 媒體經營者透過薪資、升遷等聘僱條件影響團隊運作，稱作新聞室社會化
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 新聞室社會化理論指出，記者為求升遷，會從老闆的談話、行為（如開除某位職員或封殺某條新聞）間去揣摩、領會組織政策，進而把組織政策內化為自己的價值觀。題幹提到：德國之聲要求記者「不能只批評中國政府」，由此判斷德國之聲要求記者配合媒體立場，在報導中改善與中國的關係，故選(D)。(A)與工時無關。(B)此非聳動的標題。(C)此非置入性行銷。
