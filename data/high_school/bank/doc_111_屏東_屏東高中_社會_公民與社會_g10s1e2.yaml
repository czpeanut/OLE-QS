  stem: 有關民間社會中的「第四權」，它具備下列哪幾項功能？(甲)對於不適任的候選人，予以罷免；(乙)選賢與能，選出真正為民服務的候選人；(丙)對政府的政策進行追蹤與報導，督促政府避免濫權；(丁)對於適合人民的相關法律，予以通過
  options:
  - label: A
    content: 0 項
  - label: B
    content: 1 項
  - label: C
    content: 2 項
  - label: D
