  stem: 媒體可以生產娛樂與教育的訊息，更可在眾多資訊中為公眾挑選出社會中值得注意的重要資訊，無形中存在的判斷標準將會對資訊進行過濾和控制。請問媒體因此又被稱為下列何者？
