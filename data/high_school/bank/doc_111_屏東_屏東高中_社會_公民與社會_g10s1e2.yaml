- id: doc_111_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 6
  stem: 公民投票除了實踐主權在民精神，同時還能解決民主政治可能產生的衝突。下列何者是我國公民投票能解決的政治問題？
  options:
  - label: A
    content: 為了對抗不公平的稅法，泛紫聯盟推動稅制改革公投
  - label: B
    content: 在野黨認為執政黨的預算編列不公，推動預算公投
  - label: C
    content: 人民生活苦不堪言，要求立委舉行最低工資公投
  - label: D
    content: 近日空氣汙染問題嚴重，民間團體推動反空汙公投
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '《公民投票法》規定，預算、租稅、薪俸及人事事項不得作為公民投票之提案，故選(D)。

    33.1999 專線是政府學習企業的顧客導向服務而進行改革措施，故選(A)。(B)不是單一部門負責，這個專線接獲民眾的反映後，會交由相關單位處理後續。(C)非政策宣導的用途。(D)是屬於「課責」的概念。

    34.政治效能感是一個人認為他自己的參與行為影響政治體系和政府決策的能力；通常相對剝奪感愈高的低收入民眾，政治效能感愈低，故選(B)。(A)民主國家，人民政治參與度高。(C)愈常政黨輪替，表示人民覺得參與有用。(D)優勢群體的參與度較高。

    35.公民社會即是指獨立於國家體制之外，由個人組成的多元且自主的領域。這是獨立於政權控制之外的各種社會團體，為了維護團體會員的利益，對於政治決策發揮持續的影響力，故選(B)。

    36.(A)民意監督不一定是正式監督管道。(C)執政黨與在野黨之間不是透過民意監督來溝通。(D)民意監督的影響力可能高於議會監督。

    37.《公民投票法》第 1 條第 2 項規定「公民投票涉及原住民族權利者，不得違反《原住民族基本法》之規定。」這項立法的用意，某種程度上是有意識到「少數權利不能隨便拿來多數決」，以避免多數暴力來決定少數人的權利，故(C)正確。

    38.依圖判斷，該黨推派的候選人有 4 個，顯示為複數選區相對多數制，此制度下，由於只要擠進應選名額內即可當選，因此同黨自行參選劇烈競爭，為避免同黨自相殘殺，因此會出現政黨配票的操作，故選(B)。(A)原住民立委雖為複數選區，但當選名額只有 3 人，與該黨提名 4 人不符。(C)為比例代表制。(D)為單一選區相對多數制。

    39.罷免是憲法賦予人民的參政權，讓人民監督公職人員的方式，故選(A)。(B)罷免由人民發動，不會定期舉行。(C)罷免是追究政治責任。(D)罷免門檻的正當性，應與選舉制度配合，並不是愈嚴格愈好。

    40.總統選舉採單一選區相對多數制，又稱為「領先者當選制」，故(B)正確。(A)應為單一選區。(C)比例代表制有利小黨，易形成多黨制。(D)複數選區相對多數制下，由於只要擠進應選名額內即可當選，故有利小黨或無黨人士。

    41.區域立委每一選區只能當選一個，為單一選區相對多數制，故(C)正確。(A)婦女保障名額放在不分區之中。(B)不分區及僑選立委共 34 席，另外有 6 席原住民立委。(D)原住民可以投原住民候選人票和政黨票 2 張。

    42.區域立委分為 73 個選區，每一個選區採相對多數制，各選出一位立法委員。選區劃分除了考量各縣市人口外，也考量各縣市之代表性，規定各縣市至少有一席立法委員。題文提到：高雄市減少 1 個席次，人口數與席次數不成比例。由此推論這應是單一選區會發生的現象，每個席次所代表的人口數並不相同，故選(C)。(A)不分區立委是投政黨，不會有選區劃分問題。(B)縣市議員為複數選區，基本上選區較能反映人口比例。(D)鄉鎮市長只選 1 人，不會有選區劃分問題。

    43.若當選人有 2 位以上，則為複數選區相對多數，故(B)正確。(A)比例代表制投政黨，選票不會出現人名。(C)雖無法從表中判斷總投票權人數是多少，但楊過的得票數並未過半，須進入第二輪投票，故無法知道誰是最後當選人。(D)單一選區有利大黨。

    44.依題文判斷，民主的代價應是指公投的缺點，故選(C)。(A)(B)(D)為公投的優點。

    45.傑利蠑螈效應會出現在單一選區的劃分，以不公平的選區邊界劃分方法操控選舉，致使投票結果有利於某方，故選(A)。

    46.甲：80 × 50 ％＝40（席）；乙：80 × 30 ％＝24（席）；丙：80 × 15 ％＝12（席）；丁：80 × 5 ％＝4（席）。故選(D)。

    47.(甲)無黨籍者無法參加不分區選舉，只能選區域代表；(乙)選舉門檻達不到的小黨無法分配不分區的席次，兩項正確，故選(A)。(丙)單一選區對大黨較有利；(丁)以政黨為圈票對象，並以此分配不分區席次。

    48.新黨因得票率是 3.95 ％，未達 5 ％的門檻，因此無法得到不分區的席次，故選(A)。

    49.2019 年選區重劃，因為人口減少，屏東縣選區減為應選 2 席，於 2020 年第 10 屆立法委員選舉起實施，故選(B)。(A)區域立委共 73 人。(C)不分區立委共 34 人。(D)全部立委 113 人。

    50.以聯立制而言，鳥黨總席次＝200 × 10 ％＝20，鳥黨不分區席次＝20－20＝0，故選(A)。'
  tags:
