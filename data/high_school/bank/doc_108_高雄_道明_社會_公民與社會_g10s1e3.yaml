- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: 下列關於上述事件之敘述，何者正確？
  options:
  - label: A
    content: 本案是由被害人向警察提出告訴，以啟動檢警偵查
  - label: B
    content: 法官認為成年犯之犯行較少年嚴重，因此刑期較高
  - label: C
    content: 警察認為少年之犯行重大，因此直接移送少年法院
  - label: D
    content: 少年調查官對本案僅有審前調查與流程建議之權力
  group_stem: 一名16歲少年與數名19到23歲朋友深夜一起到KTV唱歌，遇到情敵而發生衝突，少年與朋友持武器造成數人重傷成殘。警察偵訊後將少年與其成年朋友分別移送地方檢察署與少年法院。警方於記者會中表示，少年因與其中一名被害人為情敵，其中一名友人前往地處召集朋友攜帶武器到KTV毆打被害人等。媒體記者大幅度報導案發過程，還透過KTV員工取得監視錄影畫面並連日報導，除了少年以外，其餘嫌犯之感情史、個人工作經歷、前科紀錄等隱私皆不斷遭公開示眾，影響到檢警辦案，知名律師批判此舉違反偵查不公開原則，而民間團體嚴厲批評媒體失控的亂象。少年輕少年調查官審前調查後，認為少年犯行嚴重，依法建議採刑事程序獲法官同意，最後遭判處4年有期徒刑。少年友人被檢察官認為罪行重大且有逃跑、串證之疑慮，聲請羈押獲准。法院發現一位先行離去者只是身體不適返家休息，與本案無涉而無罪，其餘被告惡性重大且犯後態度不佳，重判12年有期徒刑。但因媒體的報導，無罪者仍被大眾認為是兇手，不幸丟失工作。
