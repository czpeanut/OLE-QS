- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 前《人民團體法》對人民設立團體都是採行「許可制」，也就是主管機關同意核准，申請的團體才能完成；未來人民團體一分為三，「政黨」、「職業團體」仍然採用「許可制」，「社會團體」則採行「登記制」，只要合於規定，一律核准。下列何者是主張社會團體應採行登記制的原因？
  options:
  - label: A
    content: 有志於從事社會服務的民眾不會有非法行為
  - label: B
    content: 社會團體並不涉及募款也不會發生財務糾紛
  - label: C
    content: 鼓勵人民志願組成各類型的社會團體
  - label: D
    content: 社會團體的成立與解散頻繁採登記符合需求
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 政黨是由政治理念相同或類似的人民，自由結合成的一種政治團體，參與政治活動並發揮其影響力。我除了以《憲法》第14條列舉保障人民之結社自由權外，近年更定《政黨法》確立民眾參與政治團體的規範。現階段就我國法規而言，政黨的成立與解散與下列哪些機構相關？
  options:
  - label: A
    content: 司法院：監察院
  - label: B
    content: 內政部：憲法法庭
  - label: C
    content: 法務部：大法官會議
  - label: D
    content: 立法院：最高法院
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_26
  section: 1
  number: 26
  type: single
  page: 3
  stem: 民主國家在制定、修改及廢止法律時，都應經過定期民選的代議士，透過議會討論程序並表決通過，才能彰顯法律的民主正當性。下列針對我國立法程序的相關說明，何者較為正確？
  options:
  - label: A
    content: 執政黨立委所提法律案稱「政府案」、在野立委之提案為「委員案」
  - label: B
    content: 總統直接交付，或經一定比例之人民連署，亦可提出法案送交國會
  - label: C
    content: 提案先送各審查委員會一讀逐條討論，有疑義者應開啟黨團協適機制
  - label: D
    content: 法律之制定與修改須經過三讀程序，廢止法律僅須完成二讀即可表決
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_27
  section: 1
  number: 27
  type: single
  page: 3
  stem: 公民課堂上，高中生亞南與慶東針對自書遺囑的效力有以下對話： 亞南：民法第1190條規定：「自書遺囑者，應自書遺囑全文，記明年、月、日，並親自簽名。」 但現在誰還手寫文字啊？如果我用電腦打字列印，最後再手寫簽名，這樣的遺囑有效嗎？ 震東：我也不確定！不過我查到地方法院曾有判決「法條要求應自書遺囑，最主要目的是希望以筆跡鑑定該遺囑是否實為本人繕寫，故若以電腦列印，最後親筆著名，仍不具有自遺囑的效力。」 下列敘述何者較為正確？
  options:
  - label: A
    content: 法律解釋旨在使法律更具體明確，法院的判決實例也可作為法律解釋的管道
  - label: B
    content: 法院曾有之判決顯難適用於現時社會，只有大法官有權對抽象法條進行解釋
  - label: C
    content: 法律無法符合社會需要時應修法調整，法院判決有違「禁止權利濫用原則」
  - label: D
    content: 法條脫離人民生活經驗已達「信賴保護原則」，判決適用個案不應成為解釋
