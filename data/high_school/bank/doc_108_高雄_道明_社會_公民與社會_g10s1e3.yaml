  group_stem: 男子因兒子買回的肉圓未加辣而出手掌摑，其妻為救兒也被勒頸爆打。妻子在遭受暴力當下，用手機開啟直播，將家暴畫面同步於網路播放；一名網友根據直播內容「肉搜」出錄影位置，並在網路痛罵該名男子「垃圾、社會敗類，還有民眾憤而帶著「辣椒全餐」前往該名男子家樓下，在現場煮起「辣椒全餐」並透過直播邀請大家一起來吃辣，迅速聚集了上百位民眾。民眾聚集引來警察到場關切。警察表示：「讓專業的來，請大家冷靜，不要動用私刑。路見不平、拔刀相助的時代已經過去了，到場嗆聲或動手都不能證明你是時代的英雄。」
