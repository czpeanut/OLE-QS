  group_stem: 債權人甲與債務人乙契約約定，若乙皆能在上午10時前交付分期支票予甲，使甲能於上午11時至銀行兌成現金！則甲願意提供分期利益給乙。乙於第一期、二期皆如期交付，但於第三期時因當付款日銀行業務繁忙，雖其於10點前已到達銀行，但等到銀行叫號至處理完支票，已是上午10點半。期間乙於09：55分致電通知甲會延遲半小時給付，但甲仍拒絕受領支票，並要求乙應償還所餘全部債款。 法官受理案件並於判決中指出，雖甲未允許可延緩半小時給付，但乙延誤給付之歸咎責任屬情有可原，並非自己造成之失誤；再者，即便延緩半小時給付，甲亦能於11點前將所收之支票兌成現金，對於甲之權利並未影響，故甲之行使權利違反法律原則，不能算正當之主張。
