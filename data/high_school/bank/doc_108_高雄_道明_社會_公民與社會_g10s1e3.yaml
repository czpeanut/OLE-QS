- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 基德欲闖入民宅行竊，但過程中遭屋主發現，兩人扭打之下造成基德右手脫臼，屋主便順勢將基德扭送警局，事後基德向屋主提起傷害罪告訴，法官衡量事發經過後，宣判屋主的傷害罪不成立。請就犯罪成立要件判斷，下列四個不成立的犯罪中，欠缺要件與上述最為相似的是？
  options:
  - label: A
    content: 小學三年級生偷錢買明星代言的手機
  - label: B
    content: 火災時將鄰居門窗打破以求盡速逃離現場
  - label: C
    content: 把別人的腳踏車誤認成自己的然後騎回家
  - label: D
    content: 精神病患在無意識的狀態下揮刀砍傷路人
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 《少年事件處理法》針對少年的犯罪或曝險行為，可分為保事件與刑事事件兩種程序與處遇。下列何者屬於保護事件程序？
  options:
  - label: A
    content: 交付觀察
  - label: B
    content: 有期徒刑
  - label: C
    content: 不予審理
  - label: D
    content: 感化教育
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 準大學生阿明為慶祝父親節而預訂餐廳，但突然被餐廳通知取消訂位。他認為店家的態度不佳，於是一氣之下打電話到該餐廳辱罵店家，並且向消保官投訴。餐廳老闆不滿被小明侮辱，聘請律師控告小明公然侮辱罪，聘請律師控告小明公然侮辱罪，最後法院判阿明無罪。請問：何者可能是法院判決無罪之理由？
  options:
  - label: A
    content: 餐廳服務態度不佳導致辱罵，為阻卻違法事由
  - label: B
    content: 阿明行為時心智尚未成熟，不具責任能力
  - label: C
    content: 阿明的行為屬於侮辱未遂，依法不予懲罰
  - label: D
    content: 阿明行為不符合公然侮辱之構成要件
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 有學者建議「單純吸食毒品除罪化」，其認為應視施用毒品者為濫用藥物的病人，著重對其治療而非懲罰，除了毒癮戒治外，還要給予心理與社會的支持，避免其孤立與受歧視而無法脫離對毒品的依賴。但也有人認為當前毒品氾濫，應加強對吸毒者的刑責，避免任何人貿然吸毒。關於上述對吸毒是否除罪化的討論，下列何者較為正確？
  options:
  - label: A
    content: 反對者看法較合乎應報理論，強調對吸毒者的懲罰
  - label: B
    content: 支持者看法屬特別預防理論，重視解決導致違法之成因
  - label: C
    content: 反對者的論點符合特別預防理論，重於防止吸毒者再犯
  - label: D
    content: 支持者觀點接近綜合理論，強調對吸毒者多元處遇
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 無忌和芷若在親友見證下完成訂婚儀式，並依法簽訂婚約書。然而後來無忌另結新歡小敏，並與小敏生下小孩。芷若認為無忌背叛婚約，遂至地檢署怒控無忌和小敏通姦罪（有配偶而與他人合意性交）。但檢察官認為無忌與小敏之行為不構成通姦罪。請問：下列何者最可能是無法成立通姦罪之理由？
  options:
  - label: A
    content: 習慣法禁止
  - label: B
    content: 罪刑明確原則
  - label: C
    content: 禁止溯及既往
  - label: D
    content: 禁止類推適用
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一名男子聽聞政府開放進口石斑魚，以為與漁會有關，在網路上批評，使漁會名譽受損，於是漁會控告男子誹謗罪。審法院採信男子主張以為漁會屬政府機關，其評論是善意言論，且法官認為刑法誹謗罪中「意圖散布於眾，而指摘或傳述足以毀損他人名譽之事者」所指的「他人」依刑法體系與目的解釋應限於自然人，因此判決男子無罪。何種說法較接近法官於裁判書中的見解？
  options:
  - label: A
    content: 對公共議題的善意評論不構成誹謗罪的要件
  - label: B
    content: 漁會屬於法人，並非誹謗罪欲保障之對象
  - label: C
    content: 誹謗法人之行為並無法律上的任何責任
  - label: D
    content: 男子並沒有妨礙漁會名譽的故意行為
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 一男子陪同母親急診，必急下不斷對醫護人員嗆聲辱罵，護理師報警控訴男子公然侮辱，男子於審理中不斷堅持自己沒錯、醫護人員有錯，但一審法院審理認為男子言非屬實，判拘役45日，得易科罰金。下列何者較合乎我國相關法律規定？
  options:
  - label: A
    content: 護理師只能委任律師提告，法院才會接受審理本案
  - label: B
    content: 男子若不服法院判決，只能聘請律師向法院提出上訴
  - label: C
    content: 男子若無委任律師，法院會安排公設辯護人協助論告
  - label: D
    content: 護理師若不服一審法院判決，得請求檢察官提起上訴
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 1997年空軍士兵江國慶因軍營女童命案遭槍斃，事後發現是冤枉。國際特赦組織表示，無辜的人被處決，凸顯一命抵一命之刑罰並無效果，道歉和賠償都無法讓江國慶死而復生。該組織的說法是針對刑罰的目的何種理論予以駁斥？
  options:
  - label: A
    content: 應報理論
  - label: B
    content: 一般預防理論
  - label: C
    content: 特別預防理論
  - label: D
    content: 綜合理論
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 刑罰制定有其目的與出發點，以下刑罰目的之理論，哪一個是不一樣的？
  options:
  - label: A
    content: 殺人處死刑、無期徒刑或10年以上有期徒刑
  - label: B
    content: 日治時期，竊盜者當眾刴手，避免再去竊盜
  - label: C
    content: 對於吸食毒品者，給予送進勒戒所戒毒之機會
  - label: D
    content: 讓性侵犯接受化學治療，避免出獄後再犯
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 假設某位立委因遭水果日報跟蹤，發現有婚外情並將其公開報導，致使該名立委遭到選民指責。該名立委自認報導不實，憤而到臺北地方法院檢察署按鈴申告。請問：按鈴申告是屬於哪種權利救濟的方式？
  options:
  - label: A
    content: 自訴
  - label: B
    content: 告發
  - label: C
    content: 告訴
  - label: D
    content: 公訴
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列哪些案件不是法律所規定之強制辯護的案件？
  options:
  - label: A
    content: 晤空犯了最輕本刑為3年以上有期徒刑之罪，而且沒錢請律師
  - label: B
    content: 晤淨因精神、心智功能缺陷而無法完全陳述自己的意見
  - label: C
    content: 八介為低收入戶，因犯竊盜罪而聲請指定辯護
  - label: D
    content: 施富因公然猥褻罪被檢方求處有期徒刑6個月
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 同為15歲的阿智和小倩，情不自禁發生了性關係。事後小倩的母親發現「自己的女兒被欺負了」，查閱法條發現未滿18歲之人與14歲以上，未滿16歲的男女性交，屬於告訴乃論。下列敘述何者正確？
  options:
  - label: A
    content: 報案後若小情及母親不願追究，檢察官仍可起訴阿智之犯罪行為
  - label: B
    content: 阿智或其法定代理人，亦可針對小情行為提出妨害性自主之告訴
  - label: C
    content: 阿智未滿18歲為限制行為能力人，犯罪得減輕或免除其刑事責任
  - label: D
    content: 因雙方未成年，小倩母親僅能依《民法》將阿智送少年法庭審理
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 有政治人物表示：「母語應回家學習，不要浪費學校資源，學校應加強中文及英文教學，政府僅提供母語學習優良且通過檢定者獎勵。」批評者指出此主張忽視母語及文化教育的重要性。政府推行的語文教育經常排擠到各族群的母語學習，且不是每個家庭都有能力教導母語與傳統文化。從社會規範將產生的影響來看，下列何種分析較為妥適？
  options:
  - label: A
    content: 統治者藉此強推特定語言及文化，強化同化作用
  - label: B
    content: 語文教育資源的分配將影響不同語言的發展機會
  - label: C
    content: 學校實施母語教育有助於各族群培養自我優越感
  - label: D
    content: 家庭教育資源匱乏，不利於母語與傳統文化傳承
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 社會規範是人類社會為維持秩序並解決紛爭所逐步發展出來的社會機制，有學者指出社會規範帶有社會控制之功能。請問：下列何種與其他社會規範的控制形式與其他不同？
  options:
  - label: A
    content: 小明瞞著父母被學校記過之事，心生罪惡感
  - label: B
    content: 小花穿裙跑步不慎跌倒曝光，感到十分羞恥
  - label: C
    content: 阿正違規導致班級秩序被扣分，受到同學排擠
  - label: D
    content: 阿凱偷用同學手機，違反宗教界戒律內心不安
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 民主國家之法律制定、修正與廢止之程序皆應合乎法治國原則，下列何者符合我國立法之法定程序？
  options:
  - label: A
    content: 人民發起法律草案公投，通過後直接進入立法院審查
  - label: B
    content: 監察委員參與立法院院會，提出法律草案之修正動議
  - label: C
    content: 院會進行第二讀會時，其決議可與委員會之決議不同
  - label: D
    content: 第三讀會時發現法條草案牴觸憲法，須提出釋憲聲請
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 曾有公立學校校長於受政府委託辦理考試工作時任用配偶，遭法務部開罰，該校長不服提出訴訟而敗訴。判決書指出(甲)利益衝突迴避法所定之公職人員係指公職人員財產申報法第2條所定之人員；(乙)公職人員關係人之範圍包含其配偶；(丙)其所獲利益包含財產上與非財產上利益，非財產上利益則包含公立學校人事之任用。公職人員依該法知有利益衝突者應自行迴避；(丁)原告即為公職人員財產申報法所列應申報之人，即使任務工作所臨時任用人員亦應遵守利益迴避。上述判決理由何者屬於將法律體現於具體個案之詮釋？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 釋字第748號解釋宣告，民法僅保障異性婚姻違反憲法中對婚姻自由與平等權保障，行政院提出法律草案使同性二人身分結合得適用部分既有民法婚姻章的規定，但有宗教團體堅決反對。依我國立法程序，前述宗教團體可透過何種方式影響立法？
  options:
  - label: A
    content: 派員出席國會第二讀會議，對行政院之草案提出修正動議
  - label: B
    content: 對支持同性婚姻之立委提出罷免案，使立委不得一意孤行
  - label: C
    content: 遊說立委支持，藉某黨團提出較合乎信仰價值之法律草案
  - label: D
    content: 透過公投發動覆議，否決立法院三讀通過之同性婚姻法規
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 我國升學考試有原住民族加分制度，是為了加強對原住民族的同化，而今則有補償作用及希望透過母語檢定加強發展族群文化之目的；原住民族名額為外加名額，並非占有一般生名額。不過有反對者指出，原住民族中也存在著階級差異，現有制度並未衡酌階級的影響。關於上述討論，何種說法較為合理？
  options:
  - label: A
    content: 原住民族可取得額外機會，排擠一般生的升學機會
  - label: B
    content: 加分制度是希望幫助原住民透過教育追求自我實現
  - label: C
    content: 未能衡酌階級影響，易形成教育機會的原住民特權
  - label: D
    content: 加分僅會使原住民族受教育被同化，影響身分認同
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 社會規範的實現有助於增進社會和諧與促使社會進步，但有時社會規範是由社會群體中占有優勢的既得利益者所制定，可能犧牲少數及弱勢者權益。下列哪一項社會規範會影響「公平的資源分配」？
  options:
  - label: A
    content: 女性員工懷孕可申請暫時調職較輕鬆工作
  - label: B
    content: 女兒出嫁後不得要求分配家產
  - label: C
    content: 地方民意代表設立四分之一婦女保障名額
  - label: D
    content: 公民營機構聘用一定比例的身心障礙人士
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 法務部在民法中增訂「掃地出門條款」，若兒女等負有扶養義務人對父母惡意不扶養，經父母以書面、影音舉證後，兒女將不得繼承財產。請問：關於法律與道德的關係，下列敘述何者正確？
  options:
  - label: A
    content: 不扶養父母觸犯道德底線，與法律規範無關
  - label: B
    content: 修法內容對不孝子女道德勸說的意味濃厚
  - label: C
    content: 修法結果將使孝順的觀念融入道德規範
  - label: D
    content: 修法結果將使不孝子女受法律上不利的結果
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 法律內容的制定多數都會配合當時社會的需要，奠基於習俗、道德觀念。這些不符合現在時空的條文，應該修改但不應該嘲諷當時制定者。這就像今日進步的條文，未來也有可能成為不適宜的法條。下列何者是不適宜的法律條文？
  options:
  - label: A
    content: 夫妻得書面約定以其本姓冠以配偶之姓
  - label: B
    content: 父母對於權利之行使意思不一致時，由母行使之
  - label: C
    content: 非婚生子女可以約定從父姓
  - label: D
    content: 太太要出售夫妻共有房屋時，須得到先生的同意
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 下列關於我國立法程序的敘述，何者『錯誤』？
  options:
  - label: A
    content: 法案一旦經立法院三讀通過後將立即生效
  - label: B
    content: 二讀會可以逐條討論法案內容
  - label: C
    content: 黨團協商除了席次較多的政黨可各自組成黨團外，小政黨也能共同合組黨團
  - label: D
    content: 五院皆有法律提案權
- id: doc_108_高雄_道明_社會_公民與社會_g10s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 2018年舉行的九合一選舉，在國民黨與民進黨兩大黨以外的眾多小黨，在本次大選表現亮眼，均有拿下席次，展現出地方選舉呈現多元民意的面貌。下列敘述何者正確？
  options:
  - label: A
    content: 政黨係屬志願結社，且必須藉由選舉得到政權
  - label: B
    content: 人民有結社自由，政府完全不能限制人民結社自由
  - label: C
    content: 政黨的組成法源是人民團體法
  - label: D
