  section: 1
  number: 29
  type: single
  page: 3
  stem: 公民課堂上，老師要求同學們針對最近的社會犯罪新聞進行討論，並提出他們的法律見解如下： 小英：「犯罪被害人發現權利受損，可以向警察局報案，並由檢察官提起公訴。」 小韓：「加害人經媒體報導其犯罪事實，在難以躲藏後出面投案，符合自首的規定。」 小政：「只要被告認罪，就算沒有其他證據，法官也可以判決有罪。」 小宋：「所犯之罪為輕罪且可寬恕，法官基於微罪不舉原則得以緩起訴或緩刑結案。」 請問：哪一位同學的說法符合我國法律相關規定？
  options:
  - label: A
    content: 小英
  - label: B
    content: 小韓
  - label: C
    content: 小政
  - label: D
    content: 小宋
