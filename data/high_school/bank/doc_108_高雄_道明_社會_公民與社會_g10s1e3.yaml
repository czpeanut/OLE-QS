    content: 丁甲丙乙
  - label: C
    content: 丁乙丙甲
  - label: D
    content: 乙甲丁丙
  group_stem: 為防範境外敵對勢力之滲透干預，確保國家安全及社會安定，維護國家主權及自由民主憲政秩序，立法院於2019年12月31日通過反滲透法。國際間有美、加、英、德、澳、紐等國，通過類似的法律。依據反滲透法規定，任何人或團體不得受滲透來源之指示、委託或資助，而從事1.捐贈政治獻金、2.捐贈經費供從事公民投票案之相關活動、3.競選活動、4.遊說、5.以強暴脅迫等方式擾亂社會秩序、妨害集會遊行、6.妨礙選舉、妨礙投票。違者將被處以徒刑及罰金。
