    (C) ╳：∵$-\frac{b}{a}$＜－1 ⇒ $\left| -\frac{b}{a} \right|$＞1，則 y＝$\left( \left| \frac{b}{a} \right| \right) ^{x}$的圖形由左而右逐漸上升

    (D) ○：∵$-\frac{b}{a}$＞1 ⇒ $\left| -\frac{b}{a} \right|$＞1 ∴y＝$\left( \left| \frac{b}{a} \right| \right) ^{x}$的圖形由左而右逐漸上升

    (E) ╳：同(B)

    故選(A)(B)(D)'
