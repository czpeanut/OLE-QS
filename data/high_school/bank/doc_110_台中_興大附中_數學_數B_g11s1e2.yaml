  explanation: '$ax^{2}$＋bx＝0 ⇒ x＝0 或$-\frac{b}{a}$，表示 y＝$ax^{2}$＋bx 的圖形和 x 軸交於（0，0）與$\left( -\frac{b}{a} , 0 \right)$

