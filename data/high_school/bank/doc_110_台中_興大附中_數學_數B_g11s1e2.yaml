  section: 3
  number: 2
  type: multiple
  page: 3
  stem: 若（a，b）是對數函數 y＝$log_{5}$x 圖形上一點，則下列哪個選項中的點也在該對數函數的圖形上？
  options:
  - label: A
    content: （a＋1，b＋1）
  - label: B
    content: （5a，b＋1）
  - label: C
    content: $\left( \frac{1}{a} , -b \right)$
  - label: D
    content: （10a，2b）
  - label: E
    content: （$a^{2}$，2b）
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '依題意得 b＝$log_{5}$a

    (A) ╳：x＝a＋1 代入得 y＝$log_{5}$（a＋1）≠b＋1

    (B) ○：x＝5a 代入得 y＝$log_{5}$5a＝$\frac{\log 5a}{\log 5}$＝$\frac{\log a+\log 5}{\log 5}$＝$log_{5}$a＋1＝b＋1

    (C) ○：x＝$\frac{1}{a}$代入得 y＝$\log _{5}\frac{1}{a}$＝$\frac{\log \frac{1}{a}}{\log 5}$＝$\frac{-\log a}{\log 5}$＝－$log_{5}$a＝－b

    (D) ╳：x＝10a 代入得 y＝$log_{5}$10a＝$\frac{\log 10a}{\log 5}$＝$\frac{\log a+\log 10}{\log 5}$＝$log_{5}$a＋$log_{5}$10≠2b

    (E) ○：x＝$a^{2}$ 代入得 y＝$log_{5}a^{2}$＝$\frac{\log a^{2}}{\log 5}$＝$\frac{2 \log a}{\log 5}$＝2 $log_{5}$a＝2b

    故選(B)(C)(E)'
