  section: 3
  number: 21
  type: calc
  page: 3
  stem: '油滴實驗（Oil-drop experiment），是<u>羅伯特‧密立坎</u>與<u>哈維‧福萊柴爾</u>（Harvey Fletcher） 在1909年所進行的一項物理學實驗，<u>羅伯特‧密立根</u>因而獲得1923年的諾貝爾物理學獎。 此實驗的目的是要測量單一電子的電荷。方法主要是平衡重力與電力，使油滴懸浮於兩片 金屬電極之間。並根據已知的電場強度，計算出整顆油滴的總電荷量。重複對許多油滴進 行實驗之後，<u>密立根</u>發現所有油滴的總電荷值皆為同一數字的倍數，因此認定此數值為單 一電子的負電荷e： 看完這篇文章後，小山靈光一現，想模仿<u>密立坎</u>的實驗來測量經摩擦後的塑膠球所帶的電 量。裝置如圖：在2金屬平行板間利用可調整電壓的電源製造出均勻電場，再將帶電的塑 膠球放置於金屬板間由靜止釋放，並測量其加速度，若藉由調整上下板電位差改變電場大 小，測得塑膠球的向下加速度如下表，請根據實驗結果回答下列問題：

    | 2板電位差(V) | 100 | 200 | 300 | 400 | 500 |

    | --- | --- | --- | --- | --- | --- |

    | 2板間電場大小(V／m) | 200 | 400 | 600 | 800 | 1000 |

    | 塑膠球向下加速度(m／$s^{2}$) | 9.58 | 8.46 | 7.49 | 6.54 | 5.65 |

    (1)塑膠球所帶的電性為正電或負電？（1分） 利用實驗數據簡單說明原因。（1分）

    (2)平行金屬板的間距為何？（2分）

    (3)在作答區的方格紙上畫出加速度（y座標）與電場（x座標）的關係圖，點要標出，直線大致畫出即可。（3分）

    (4)若已知塑膠球質量為m，電場大小為E，重力加速度為g，小球加速度為a，忽略空氣阻力。請說明如何由上題關係圖中，利用加速度與電場關係圖斜率，來求得塑膠球的帶電量q，需以數學式說明（3分）。'
