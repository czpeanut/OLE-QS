- id: doc_111_台中_興大附中_數學_數A_g11s1e3_s2_4
  section: 2
  number: 4
  type: fill
  page: 3
  stem: '如右圖，一個邊長為 3、4、5 的直角三角形 ABC 中，$\overline{AB}$＝3，$\overline{AC}$＝4，$\overline{BC}$＝5，P 是三角形內部一點。若 P 到$\overline{AB}$的距離為 x，P 到$\overline{AC}$的距離 為 y，P 到$\overline{BC}$的距離為 1，則：

    (1) 3x＋4y＝＿＿＿＿。

    (2) $9x^{2}$＋$4y^{2}$ 的最小值為＿＿＿＿。'
  assets:
  - key: s2_4_f1
    kind: figure
    file: doc_111_台中_興大附中_數學_數A_g11s1e3/s2_4_f1.png
    crop:
      page: 3
      rect:
      - 479.5
      - 49.85
      - 564.3
      - 158.85
  explanation: '(1) △ABC 面積＝△ABP 面積＋△BCP 面積＋△CAP 面積

    $\Rightarrow\frac{1}{2} \cdot 3 \cdot 4$＝$\frac{1}{2} \cdot 3x +\frac{1}{2} \cdot 5 \cdot 1 +\frac{1}{2} \cdot 4y$

    $\Rightarrow$3x＋4y＝7

    (2) 承(1) ，又 $9x^{2}$＋$4y^{2}$＝（3x）$^{2}$＋（2y）$^{2}$，再由柯西不等式知

    （（3x）$^{2}$＋（2y）$^{2}$）（$1^{2}$＋$2^{2}$）$\geq$（3x＋4y）$^{2}$

    $\Rightarrow$（$9x^{2}$＋$4y^{2}$）．5$\geq7^{2}$

    $\Rightarrow9x^{2}$＋$4y^{2}\geq\frac{49}{5}$

    故最小值為$\frac{49}{5}$'
