  stem: 如右圖，$\overline{AB}$//$\overline{CD}$，$\overline{AD}$＝$\overline{BC}$＝3，$\overline{CD}$＝2，∠A＝∠B＝60°，M 為$\overline{BC}$的中點，$\vec{AB}=\vec{a}$、$\vec{AD}=\vec{b}$，若$\vec{AM}= x\vec{a}+ y\vec{b}$，x、y 皆為實數，則數對（x，y）＝＿＿＿＿。
