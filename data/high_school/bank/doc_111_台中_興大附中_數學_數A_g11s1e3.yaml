- id: doc_111_台中_興大附中_數學_數A_g11s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 已知聯立方程式$\begin{cases}(2 -k)x + 3y = 2k - 4 \\ 3x +(2 -k)y =- k - 1\end{cases}$有無限多組解，今將聯立方程式的解，描繪在坐標平面上可得直線 L。則下列選項哪些正確？
  options:
  - label: A
    content: k＝－1
  - label: B
    content: k＝5
  - label: C
    content: 點（1，1）在直線 L 上
  - label: D
    content: 點（0，2）在直線 L 上
  - label: E
    content: 向量（1，－1）與直線 L 平行
  explanation: '∵聯立方程式有無限多組解

    ∴Δ＝Δ$_{x}$＝Δ$_{y}$＝0

    $\Rightarrow\left| \begin{matrix}2 -k & 3 \\ 3 & 2 -k\end{matrix} \right|$＝$\left| \begin{matrix}2k - 4 & 3 \\ -k - 1 & 2 -k\end{matrix} \right|$＝$\left| \begin{matrix}2 -k & 2k - 4 \\ 3 & -k - 1\end{matrix} \right|$＝0

    $\Rightarrow\begin{cases}(2 -k)^{2} - 9 = 0 \\ (2k - 4)(2 -k)- 3 (-k - 1)= 0 \\ (2 -k)(-k - 1)- 3 (2k - 4)= 0\end{cases}\Rightarrow\begin{cases}k^{2} - 4k - 5 = 0 \cdots \cdots \cdots \cdots \cdots ① \\ 2k^{2} - 11k + 5 = 0\cdots \cdots \cdots \cdots \cdots ② \\ k^{2} - 7k + 10 = 0 \cdots \cdots \cdots \cdots \cdots ③\end{cases}$

    由①－③得 3k－15＝0

    $\Rightarrow$k＝5 代回方程式 3x＋（2－k）y＝－k－1 得 3x－3y＝－6

    即直線 L 為 x－y＝－2

    在直線 L 上取兩點 A（0，2），B（2，4）

    ∵$\vec{AB}$＝（2，2）//（1，1） ∴向量（1，1）與直線 L 平行

    點（1，1）代入直線 L$\Rightarrow$1－1＝0≠－2，點（1，1）不在直線 L 上

    點（0，2）代入直線 L$\Rightarrow$0－2＝－2，點（0，2）在直線 L 上

    故選(B)(D)'
- id: doc_111_台中_興大附中_數學_數A_g11s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 如右圖所示，P 是△ABC 內部一點，延長$\overline{AP}$交$\overline{BC}$於 D 點。設$\vec{AP}=\frac{3}{10}\vec{AB}+\frac{4}{10}\vec{AC}$，則下列選項哪些正確？
  options:
  - label: A
    content: '$\overline{AP} : \overline{PD} = 7 : 10$'
  - label: B
    content: △ABP 面積：△BPD 面積＝7：3
  - label: C
    content: '$\overline{BD} : \overline{DC} = 4 : 3$'
  - label: D
    content: △ABP 面積：△ACP 面積＝3：4
  - label: E
    content: △ABP 面積是△ABC 面積的$\frac{3}{4}$倍
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_111_台中_興大附中_數學_數A_g11s1e3/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 459.35
      - 307.05
      - 564.3
      - 383.8
  explanation: '令$\vec{AD}=k\vec{AP}$

    $\Rightarrow\vec{AD}=\frac{3}{10}k\vec{AB}+\frac{4}{10}k\vec{AC}$，又 B、D、C 三點共線

    $\Rightarrow\frac{3}{10}k +\frac{4}{10}k = 1$

    $\Rightarrow$k＝$\frac{10}{7}$

    (A)╳：$\vec{AD}=\frac{10}{7}\vec{AP}$

    $\Rightarrow\overline{AP} : \overline{AD}$＝7：10

    $\Rightarrow\overline{AP} : \overline{PD}$＝7：3

    (B)○：承(A)，$\overline{AP} : \overline{PD}$＝7：3

    $\Rightarrow$△ABP 面積：△BPD 面積＝$\overline{AP} : \overline{PD}$＝7：3

    (C)○：∵$\vec{AD}$＝$\frac{10}{7}\vec{AP}$＝$\frac{3}{7}\vec{AB}+\frac{4}{7}\vec{AC}$

    $\Rightarrow\overline{BD} : \overline{DC}$＝4：3

    (D)╳：△ABP 面積：△ACP 面積＝$\overline{BD} : \overline{DC}$＝4：3

    (E)╳：△ABP 面積＝$\frac{7}{10}$△ABD 面積＝$\frac{7}{10}\times \frac{4}{7}$△ABC 面積

    ＝$\frac{2}{5}$△ABC 面積

    故選(B)(C)'
- id: doc_111_台中_興大附中_數學_數A_g11s1e3_s1_4
  section: 1
  number: 4
  type: multiple
  page: 2
  stem: 如右圖，在銳角△ABC 中，$\overline{AB} = 2$、$\overline{BC} = \sqrt{7}$、$\overline{CA} = 3$，且$\overline{AC}$的中垂線與$\overline{AB}$上的高$\overline{CD}$相交於點 P。若$\vec{AP}= x\vec{AB}+ y\vec{AC}$，則下列選項哪些正確？
  options:
  - label: A
    content: $\vec{AB} \cdot \vec{AC}$＝3
  - label: B
    content: $\vec{AB} \cdot \vec{AP}$＝3
  - label: C
    content: $\vec{AP} \cdot \vec{AC}$＝2
  - label: D
    content: x＝$\frac{1}{3}$
  - label: E
    content: y＝$\frac{1}{2}$
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_111_台中_興大附中_數學_數A_g11s1e3/s1_4_f1.png
    crop:
      page: 2
      rect:
      - 446.65
      - 50.45
      - 564.3
      - 141.0
  explanation: '(A)○：$\vec{AB} \cdot \vec{AC}$＝$∣ \vec{AB} ∣∣ \vec{AC} ∣ \cos \angle BAC$＝$2\times 3\times \frac{2^{2}+ 3^{2}-(\sqrt{7})^{2}}{2\times 2\times 3}$＝3

    (B)○：$\vec{AB} \cdot \vec{AP}$＝$∣ \vec{AB} ∣∣ \vec{AP} ∣ \cos \angle PAD$＝$∣ \vec{AB} ∣∣ \vec{AD} ∣$

    又$∣ \vec{AD} ∣$＝$∣ \vec{AC} ∣ \cos \angle BAC$＝$3\times \frac{2^{2}+ 3^{2}-(\sqrt{7})^{2}}{2\times 2\times 3}$＝$\frac{3}{2}$

    得$\vec{AB} \cdot \vec{AP}$＝$2\times \frac{3}{2}$＝3

    (C)╳：$\vec{AP} \cdot \vec{AC}$＝$∣ \vec{AC} ∣∣ \vec{AP} ∣ \cos \angle PAE$＝$∣ \vec{AC} ∣∣ \vec{AE} ∣$

    又$∣ \vec{AE} ∣=\frac{1}{2} ∣ \vec{AC} ∣$

    得$\vec{AP} \cdot \vec{AC}=\frac{1}{2} ∣ \vec{AC} ∣ ^{2} =\frac{9}{2}$

    (D)╳：∵$\vec{AP}= x\vec{AB}+ y\vec{AC}$

    ∴$\vec{AP} \cdot \vec{AB}=x\vec{AB} \cdot \vec{AB}+ y\vec{AC} \cdot \vec{AB}$

    $\Rightarrow$3＝4x＋3y ……………①

    又$\vec{AP} \cdot \vec{AC}=x\vec{AB} \cdot \vec{AC}+ y\vec{AC} \cdot \vec{AC}$

    $\Rightarrow\frac{9}{2}$＝3x＋9y ……………②

    ①×3－②$\Rightarrow\frac{9}{2}$＝9x$\Rightarrow$x＝$\frac{1}{2}$代回①得 y＝$\frac{1}{3}$

    (E)╳：同(D)

    故選(A)(B)'
