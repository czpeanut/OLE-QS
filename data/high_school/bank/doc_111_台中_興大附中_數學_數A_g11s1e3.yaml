  stem: '設四邊形 ABCD 為平行四邊形，P 在$\overline{BC}$上且$\overline{BP} : \overline{PC}$＝1：2，如右圖所示。若$\overline{AP}$交對角線$\overline{BD}$於 Q 點，且$\vec{AQ}=r\vec{AB}+ s\vec{AD}$，則 數對（r，s）＝＿＿＿＿。'
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_111_台中_興大附中_數學_數A_g11s1e3/s2_2_f1.png
    crop:
      page: 2
