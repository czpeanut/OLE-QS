  explanation: '∵$\overline{AD}$＝$\overline{BC}$＝3，且∠DAB＝∠CBA＝60°

    ∴$\overline{AB}$＝$\overline{AD}\cos 60^{^{\circ}}\times 2 + \overline{CD}$＝$3\times \frac{1}{2}\times 2 + 2$＝5

    得$\vec{DC}=\frac{2}{5}\vec{AB}$

    又 M 為$\overline{BC}$中點，由分點公式知，$\vec{AM}=\frac{1}{2}\vec{AB}+\frac{1}{2}\vec{AC}$

    $\Rightarrow\vec{AM}$＝$\frac{1}{2}\vec{AB}+\frac{1}{2} (\vec{AD}+\vec{DC})$

    ＝$\frac{1}{2}\vec{AB}+\frac{1}{2}\vec{AD}+\frac{1}{2}\times \frac{2}{5}\vec{AB}$

    ＝$\frac{7}{10}\vec{AB}+\frac{1}{2}\vec{AD}$

    ＝$\frac{7}{10}\vec{a}+\frac{1}{2}\vec{b}$

    故數對（x，y）＝$\left( \frac{7}{10} , \frac{1}{2} \right)$'
