      - 454.7
      - 638.5
      - 564.3
      - 707.75
  explanation: '$\vec{AP}$＝$\vec{AB}+\vec{BP}$，又$\overline{BP} : \overline{PC}$＝1：2

    $\Rightarrow\vec{BP}$＝$\frac{1}{3}\vec{BC}$＝$\frac{1}{3}\vec{AD}$

    ∴$\vec{AP}$＝$\vec{AB}+\frac{1}{3}\vec{AD}$

    令$\vec{AQ}$＝$k\vec{AP}\Rightarrow\vec{AQ}$＝$k\vec{AB}+\frac{1}{3}k\vec{AD}$

    又 B、Q、D 三點共線

    ∴$k +\frac{1}{3}k = 1\Rightarrowk =\frac{3}{4}$

    得$\vec{AQ}=\frac{3}{4}\vec{AB}+\frac{1}{4}\vec{AD}$

    故數對（r，s）＝$\left( \frac{3}{4} , \frac{1}{4} \right)$'
