  stem: 每逢冬季時臺灣各地空氣品質就會變得較差，民眾可利用環保署每小時公布的空氣品質監測資料，來推估全臺空氣品質狀況及地區差異。請問下列何者最適合用來表現這些資料所呈現的全臺各地空氣品質狀況？
  options:
  - label: A
    content: 點子圖
  - label: B
    content: 面量圖
  - label: C
    content: 等值線圖
  - label: D
    content: 分級符號圖
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)等值線圖常用來表示連續的空間變化現象，例如降水、氣溫、空氣品質。(A)點子圖以呈現某現象的分布、疏密為主，例如人口分布。(B)面量圖與(D)分級符號圖皆為表示區域內的數量，例如稻米產量。
