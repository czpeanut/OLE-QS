  answer_status: verified
  answer_source: answer_key
  explanation: (C)若要觀察某現象在時間上的連續變化，折線圖最為適合。(A)柱狀圖常用來表示不同現象的差異，例如各國的年出口量，或呈現非時間連續變化的單一現象，例如降雨量，故不適合。(B)圓餅圖以呈現百分比為主。(D)等值線圖為統計地圖，呈現空間上的連續變化為主。
