  section: 1
  number: 4
  type: single
  page: 1
  stem: 在 COVID-19 疫情下，自國外入境的臺灣民眾，需配合「電子圍籬智慧監控系統」的列管，進行居家檢疫。疾管署每天會發送列管者的手機號碼給電信業者，業者再將手機定位上傳至電子平臺，當列管者離開系統劃定的基地範圍，系統就會自動發送「告警簡訊」給當事人及第一線監控單位。此種防疫方式主要結合下列哪些地理技術？(甲)遙測（RS）(乙)數值地形模型（DTM）(丙)全球定位系統（GPS）(丁)地理資訊系統（GIS）
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)若要透過電子圍籬監控居家檢疫者，(丙)首先須利用 GPS 定位該檢疫者的位置，(丁)接著使用 GIS 劃定其活動之範圍，當檢疫者超出所劃定之界線，則以簡訊告知。(甲)遙測影像可能受到雲遮、建物遮蔽和解析度的影響，無法精確觀測檢疫者的位置；(乙) DTM 是進行地形分析的重要資料，與電子圍籬較無關係。
