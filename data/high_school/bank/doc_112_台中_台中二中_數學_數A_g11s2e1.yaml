  stem: 下列有關空間中的敘述，哪些選項是正確的？
  options:
  - label: A
    content: 垂直於同一直線的兩相異直線必平行
  - label: B
    content: 任意兩相異直線一定存在有一直線同時垂直此兩直線
  - label: C
    content: 兩歪斜線在一平面上之投影必為相交於一點的兩直線
  - label: D
    content: 若 $L_{1}$ 與 $L_{2}$ 是歪斜線，$L_{2}$ 與 $L_{3}$ 也是歪斜線，則 $L_{1}$ 與 $L_{3}$ 也是歪斜線
  - label: E
    content: 相異兩平面 E 與 F 交於一線 L，若 L 垂直平面 G，則 E、F 均垂直平面 G
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：不一定，亦可能歪斜或交一點

    (B) ○：敘述正確

    (C) ╳：不一定，可能平行或直線與線外一點

    (D) ╳：不一定，可能平行或交一點

    (E) ○：敘述正確

    故選(B)(E)'
