  explanation: '｜$\vec{a}$＋$x\vec{b}$＋$y\vec{c}$｜$^{2}$

    ＝｜（1＋x＋y，2＋x－y，3＋x＋y）｜$^{2}$

    ＝（1＋x＋y）$^{2}$＋（2＋x－y）$^{2}$＋（3＋x＋y）$^{2}$

    若 a（x＋y）＋b（x－y）＋c（x＋y）＝0

    ⇒ x（a＋b＋c）＋y（a－b＋c）＝0

    ⇒$\begin{cases}a +b +c = 0 \\ a -b +c = 0\end{cases}$⇒ b＝0，可取 a＝1，c＝－1

    由柯西不等式可知，

    〔（1＋x＋y）$^{2}$＋（2＋x－y）$^{2}$＋（3＋x＋y）$^{2}$〕×〔$1^{2}$＋$0^{2}$＋（－1）$^{2}$〕≥（1＋x＋y－3－x－y）$^{2}$

    ⇒｜$\vec{a}$＋$x\vec{b}$＋$y\vec{c}$｜$^{2}$．2 ≥ 4

    ⇒｜$\vec{a}$＋$x\vec{b}$＋$y\vec{c}$｜≥$\sqrt{2}$

    故｜$\vec{a}$＋$x\vec{b}$＋$y\vec{c}$｜之最小值為$\sqrt{2}$'
