    最大值為$\sqrt{\left( \frac{a - b}{2} \right) ^{2} + \left( - \frac{a + b}{2} \right) ^{2}} + \frac{a - b}{2}$＝$\sqrt{\frac{2a^{2} + 2b^{2}}{4}} + \frac{a - b}{2}$＝$2 + \sqrt{13}$………（＊）

