  page: 1
  stem: 設 x 為實數，則下列哪個方程式有解？
  options:
  - label: A
    content: sinx－cosx＝2
  - label: B
    content: sinx cosx＝1
  - label: C
    content: sinx＋$\frac{1}{\sin x}$＝1
  - label: D
    content: 2 sinx＋3 cosx＝4
  - label: E
    content: 3 sinx－4 cosx＝5
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)｜sinx－cosx｜$\leq\sqrt{2}$

    (B)｜sinx cosx｜＝$\left| \frac{1}{2}\sin 2x \right| \leq \frac{1}{2}$

    (C)若 sinx＞0$\Rightarrow\sin x + \frac{1}{\sin x}\geq 2\sqrt{\sin x\times \frac{1}{\sin x}}$＝2，若 sinx＜0$\Rightarrow\sin x + \frac{1}{\sin x}\leq - 2$

    (D)｜2 sinx＋3 cosx｜$\leq\sqrt{2^{2} + 3^{2}}$＝$\sqrt{13}$

    (E)｜3 sinx－4 cosx｜$\leq$5，當 sinx＝$\frac{3}{5}$，cosx＝$- \frac{4}{5}$時，3 sinx－4 cosx＝5

    故選(E)'
