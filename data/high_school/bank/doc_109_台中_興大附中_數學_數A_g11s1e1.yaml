  stem: 令 a＝sin（3π$^{2}$），試問下列哪一個選項是對的？
  options:
  - label: A
    content: $- 1 <a\leq - \frac{\sqrt{3}}{2}$
  - label: B
    content: $- \frac{\sqrt{3}}{2}<a\leq - \frac{1}{2}$
  - label: C
    content: $- \frac{1}{2}<a\leq 0$
  - label: D
    content: $\frac{1}{2}<a\leq \frac{\sqrt{3}}{2}$
  - label: E
    content: $\frac{\sqrt{3}}{2}<a\leq 1$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＝sin（3π$^{2}$）＝sin（3π×π）$\approx$sin（9.42π）＝sin（1.42π）

    由$\frac{4\pi}{3}< 1.42\pi <\frac{3\pi}{2}\Rightarrow\sin \frac{4\pi}{3}>\sin 1.42\pi >\sin \frac{3\pi}{2}$

    ∴$- \frac{\sqrt{3}}{2}>a > - 1$，故選(A)'
