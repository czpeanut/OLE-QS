  answer:
  - $( 3 - \sqrt{5} ) \pi$
  answer_status: verified
  answer_source: answer_key
  explanation: '設張開角度為θ

    $\frac{\theta}{2\pi -\theta} = \frac{A_{1}}{A_{2}} = \frac{\sqrt{5} - 1}{2}$

    $\Rightarrow$2θ＝2π（$\sqrt{5}$－1）－（$\sqrt{5}$－1）θ

    $\Rightarrow$（2＋（$\sqrt{5}$－1））θ＝2π（$\sqrt{5}$－1）

    $\Rightarrow$（$\sqrt{5}$＋1）θ＝2π（$\sqrt{5}$－1）

    ∴θ＝$2\pi \times \frac{\sqrt{5} - 1}{\sqrt{5} + 1}$＝$2\pi \times \frac{( \sqrt{5} - 1 ) ^{2}}{4}$＝$2\pi \times \frac{6 - 2\sqrt{5}}{4}$＝$( 3 - \sqrt{5} ) \pi$

    故完全張開時的角度為$( 3 - \sqrt{5} ) \pi$'
