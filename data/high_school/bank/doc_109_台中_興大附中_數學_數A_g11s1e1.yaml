- id: doc_109_台中_興大附中_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 下列有關 y＝sinx＋$\sqrt{3}$cosx 的性質，何者是正確的？
  options:
  - label: A
    content: 圖形對稱於直線 x＝$\frac{\pi}{6}$
  - label: B
    content: y 的最大值為 2
  - label: C
    content: sinx＋$\sqrt{3}$cosx＝－3 沒有實數解
  - label: D
    content: sinx＋$\sqrt{3}$cosx＝－2 沒有實數解
  - label: E
    content: 於$\frac{2\pi}{3}<x<\frac{7\pi}{6}$時，y 呈現遞增
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$\sin x + \sqrt{3}\cos x$

    ＝$2 \left( \frac{1}{2}\sin x + \frac{\sqrt{3}}{2}\cos x \right)$

    ＝2（cos60° sinx＋sin60° cosx）

    ＝2 sin（x＋60°）

    ＝$2 \sin \left( x + \frac{\pi}{3} \right)$

    (A)○：x＝$\frac{\pi}{6}$時，y＝$2\sin \left( \frac{\pi}{6} + \frac{\pi}{3} \right)$＝$2\sin \frac{\pi}{2}$

    產生最大值

    ∴對稱於 x＝$\frac{\pi}{6}$

    (B)○：x＝$\frac{\pi}{6}$＋2kπ（k 為整數）時，y 有最大值為 2

    (C)○：｜y｜$\leq$2

    (D)╳：sinx＝$- \frac{1}{2}$，cosx＝$- \frac{\sqrt{3}}{2}$時，y＝－2

    (E)╳：x＝$\frac{2\pi}{3}$時，y＝$2\sin \left( \frac{2\pi}{3} + \frac{\pi}{3} \right)$＝2 sinπ＝0

    x＝$\frac{7\pi}{6}$時，y＝$2\sin \left( \frac{7\pi}{6} + \frac{\pi}{3} \right)$＝$2\sin \frac{3\pi}{2}$＝－2

    ∴呈現遞減

    故選(A)(B)(C)'
