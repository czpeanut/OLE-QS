  stem: 設$y = \sin \left( x + \frac{\pi}{6} \right) + \cos \left( x - \frac{\pi}{3} \right)$，0$\leq$x$\leq$π，則 y 之最大值與最小值之和為＿＿＿＿。
  answer:
  - '1'
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$\left( \sin x\cos \frac{\pi}{6} + \cos x\sin \frac{\pi}{6} \right)$＋$\left( \cos x\cos \frac{\pi}{3} + \sin x\sin \frac{\pi}{3} \right)$

    ＝sinx×$\frac{\sqrt{3}}{2}$＋cosx×$\frac{1}{2}$＋cosx×$\frac{1}{2}$＋sinx×$\frac{\sqrt{3}}{2}$

    ＝$\sqrt{3}$sinx＋cosx＝$2 \left( \frac{\sqrt{3}}{2}\sin x + \frac{1}{2}\cos x \right)$

    ＝$2 \left( \cos \frac{\pi}{6} \sin x + \sin \frac{\pi}{6}\cos x \right)$＝2 sin$\left( x + \frac{\pi}{6} \right)$

    當 0$\leq$x$\leq$π$\Rightarrow\frac{\pi}{6}\leq x + \frac{\pi}{6}\leq \frac{7\pi}{6}$時

    $\Rightarrow\sin \frac{7\pi}{6}\leq \sin \left( x + \frac{\pi}{6} \right) \leq \sin \frac{\pi}{2}\Rightarrow- \frac{1}{2}\leq \sin \left( x + \frac{\pi}{6} \right) \leq 1$

    $\Rightarrow \times 2$－1$\leq$y$\leq$2

    ∴最大值與最小值的和為 2＋（－1）＝1'
