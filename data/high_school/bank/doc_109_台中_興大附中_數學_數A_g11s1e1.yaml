  stem: '若一圓形中分割出來的扇形面積（$A_{1}$）與剩餘面積（$A_{2}$）

    的比值為$\frac{\sqrt{5} - 1}{2}$，則稱此扇形為符合黃金比例的扇形，

    一把符合黃金比例的摺扇，是指完全張開時符合上述的

