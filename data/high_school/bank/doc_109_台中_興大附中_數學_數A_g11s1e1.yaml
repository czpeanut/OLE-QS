- id: doc_109_台中_興大附中_數學_數A_g11s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 若 tanα、tanβ為方程式 $x^{2}$＋2x－1＝0 的兩根，則下列哪些選項是正確的？
  options:
  - label: A
    content: tanα＋tanβ＝2
  - label: B
    content: tanαtanβ＝－1
  - label: C
    content: tan（α＋β）＝1
  - label: D
    content: cos（α－β）＝0
  - label: E
    content: $sin^{2}$（α＋β）＝$\frac{1}{2}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳(B)○：（x－tanα）（x－tanβ）＝0

    $\Rightarrow\begin{cases}\tan \alpha + \tan \beta = - 2 \\ \tan \alpha \tan \beta = - 1\end{cases}$

    (C)╳：tan（α＋β）＝$\frac{\tan \alpha + \tan \beta}{1 - \tan \alpha \tan \beta}$＝$\frac{- 2}{1 - ( - 1 )}$＝－1

    (D)○：tan（α－β）＝$\frac{\tan \alpha - \tan \beta}{1 + \tan \alpha \tan \beta}$不存在（分母為 0）

    表示 cos（α－β）＝0

    (E)○：由(C)得α＋β＝135°＋360°×k 或 315°＋360°×k（k 為整數）

    ∴$sin^{2}$（α＋β）＝$\left( \pm \frac{\sqrt{2}}{2} \right) ^{2}$＝$\frac{1}{2}$

    故選(B)(D)(E)'
