    sin（α－β）＋cos（α－β）

    ＝（sinαcosβ－cosαsinβ）＋（cosαcosβ＋sinαsinβ）

    ＝$\left( - \frac{4}{5} \right) \left( - \frac{8}{17} \right) - \left( \frac{3}{5} \right) \left( - \frac{15}{17} \right) + \left( \frac{3}{5} \right) \left( - \frac{8}{17} \right) + \left( - \frac{4}{5} \right) \left( - \frac{15}{17} \right)$

    ＝$\left( - \frac{4}{5} \right) \left( - \frac{23}{17} \right) + \left( \frac{3}{5} \right) \left( \frac{7}{17} \right)$＝$\frac{113}{85}$'
