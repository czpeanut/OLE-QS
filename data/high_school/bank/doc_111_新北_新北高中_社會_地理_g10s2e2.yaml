questions:
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 工業生產特徵之一「規模經濟」，其主要特徵為何？
  options:
  - label: A
    content: 投注研發經費來提高產品的價值
  - label: B
    content: 以大量生產的方式來降低生產成本
  - label: C
    content: 世界各國紛設工業區就是為達該經濟效益
  - label: D
    content: 產品若能方便消費者更換則可以提高消費意願
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「規模經濟」指工廠內部擴大生產規模提升產量來降低單位生產成本，故選(B)。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「近一、二十年來原料、能源、勞工等區位要素的重要性已日漸減弱，市場、政策因素對工業區位選擇的影響力愈來愈大。」「跨國企業將生產、管理、研發等部門分開設置於不同地點，整合國內市場和國際市場的優勢與需求。」導致這些轉變的最根本因素是什麼？
  options:
  - label: A
    content: 生產技術提升，機械化、自動化取代人力
  - label: B
    content: 環保意識增強，替代能源多元，對原料依賴度降低
  - label: C
    content: 市場規模擴大，吸引資金投入
  - label: D
    content: 運輸、資訊等技術的革新
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中「跨國企業將生產、管理、研發等部門分開設置於不同地點，整合國內市場和國際市場的優勢與需求」可知，跨國企業的各部門散布在全球各地，彼此間的訊息聯繫、貨物運輸皆需仰賴交通革新的結果，故選(D)。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「端午節肉粽你家預購了沒？」在資訊化的今日似乎事事都要預購，無論歌手新發行的 CD、流行服飾、月餅、年菜……，廠商可以先預抓需求量來出貨，此一特色符合現代工業的哪一特徵？
  options:
  - label: A
    content: 產業群聚
  - label: B
    content: 產業連鎖
  - label: C
    content: 規模經濟
  - label: D
    content: 即時性生產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)「即時性生產」指工廠先接單再生產以減少庫存壓力，因此最符合文中各種產品的預購銷售模式。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 儒鴻是亞洲最大的尼龍布料製造廠，它原本是一家上游的布料廠商，逐漸發展下游的染色、定型、製成成衣的能力（如右圖），成功整合上下游，因此吸引愛迪達、耐吉等品牌廠商的青睞，進而帶動儒鴻營收增長。請問儒鴻的經營策略，最主要的目的為何？
  options:
  - label: A
    content: 穩定原料供應與產品銷售
  - label: B
    content: 利於大量生產
  - label: C
    content: 方便自動化生產
  - label: D
    content: 欲擴大市占率，壟斷市場
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_111_新北_新北高中_社會_地理_g10s2e2/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 365.5
      - 405.3
      - 564.3
      - 586.9
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中可知儒鴻整併兼營成衣業的上、下游，屬於「垂直整合」的組織模式，能使上游子廠確保銷售，下游子廠則可穩定原物料供應及成本，故選(A)。(B)為規模經濟。(C)為自動化。(D)為水平整合。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 多數歐美企業原先多在亞洲、非洲地區之開發中國家設廠，再回銷至歐美等已開發國家，此種模式稱為長鏈供應。而現今企業開始直接在歐美市場設廠，形成短鏈供應並已成趨勢。此舉除了可以縮短運輸成本，且更能夠反應在地市場的需求。例如：將總部設在日本東京的優衣庫（UNIQLO），已與日本自動縫紉機大廠島精機（SHIMA SEIKI）合資，在日本東京共同研發設立「未來工廠」。請問短鏈供應若出現，關於「未來工廠」的生產特徵，下列何者最為正確？(甲)產品樣式多元更能反映市場需求(乙)勞力需求大幅降低(丙)專業分工現象消失(丁)生產過程自動化
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 甲乙丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)由文中可知「未來工廠」採取「短鏈供應」就近於市場生產，使(甲)產品樣式更符合在地市場的需求；文中亦提及優衣庫在日本與當地「自動縫紉機」大廠合作生產，可知其(丁)生產過程自動化，將可(乙)降低勞力需求。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 劉師傅經營一家家庭式裁縫店，店面雖小，客人卻絡繹不絕。劉師傅的手工裁縫店能在現代社會立足，乃因現代成衣業的哪項特徵較無法滿足消費者的人性需求？
  options:
  - label: A
    content: 產品標準化
  - label: B
    content: 垂直連鎖
  - label: C
    content: 產品規格化
  - label: D
    content: 專業分工
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 家庭式裁縫店能依據不同客人的需求客製化產品，此乃與現代成衣業生產流程標準化，產品外觀、功能皆一致所形成的最大差異，故選(A)。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 今日許多高科技電子產品的製造廠商採取先接訂單再製造的「即時生產模式」，避免大量庫存，同時提高企業在研發與行銷上的投資，以追求產品功能或型態樣式的持續創新，藉助媒體與網路管道的大量宣傳，推陳出新以吸引消費者購買產品。上述研發、製造與行銷策略的採用，與下列哪項因素的關係最為密切？
  options:
  - label: A
    content: 海外低廉的勞力降低生產成本
  - label: B
    content: 科技產業因群聚效益日趨聚集
  - label: C
    content: 貿易自由化與區域整合的發展
  - label: D
    content: 市場變動與產品生命週期縮短
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「產品生命週期」指產品上市至退出市場的過程，高科技產業產品具有產品生命週期短的特徵。(A)由文中提及高科技電子產品採取「即時生產模式」避免大量庫存，以及藉助媒體與網路大量宣傳推陳出新產品，可見此即高科技產業因應產品生命週期短而做出的因應。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 矽谷上、中、下游間的發展有著地域性的關連性，並且逐漸演化成具有經濟效率的互動結構，因此企業彼此之間存在著高度競爭卻又相互依賴、互利共享的關係，同時矽谷的產業可藉由內在動力進行自我發展、建構與彈性調整，而大幅提升其整體產業的競爭力。另一方面，史丹佛大學和柏克萊大學為矽谷帶來大批的學術人才以及創新與創業的能手，矽谷與大學彼此之間的良性互動，造成矽谷的人才的交流和流動，為矽谷提供更高素質的研究人員。上述關於矽谷之所以能成功發展的分析，突顯哪項現代工業的特徵？
  options:
  - label: A
    content: 產業連鎖
  - label: B
    content: 聚集經濟
  - label: C
    content: 群聚效應
  - label: D
    content: 空間移轉
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 矽谷為高科技產業聚集的區域，廠商間具有緊密的產業連鎖關係，且極具學習及創新能力，此為(C)群聚效應的特徵。(A)產業連鎖僅指廠商間的關聯性。(B)聚集經濟不一定能達到學習及創新能力。(D)空間移轉是指原本的區位優勢消失而將生產部門移轉至其他國家。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 日前報載「臺灣超商密度世界第一」，各大超商在臺灣四處尋找可展店的地點，並勇於嘗試設立據點，增加分店數量，主要目的在創造何種經營效益？
  options:
  - label: A
    content: 提高企業形象
  - label: B
    content: 降低投資風險
  - label: C
    content: 達到規模經濟
  - label: D
    content: 產品標準化
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣的主要超商業者採取「連鎖加盟」的形式，藉此擴大規模以降低單位生產成本，故選(C)規模經濟。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 某年日本六大電子零件廠因美國蘋果手機的零件需求減少，以致該年的出口訂單縮減；隔年蘋果公司推出新款手機，零件需求增加，以致訂單大增。上述日本六大電子零件廠與蘋果公司的產業合作關係，具有下列哪項特質？
  options:
  - label: A
    content: 聚集經濟
  - label: B
    content: 工業慣性
  - label: C
    content: 區位移轉
  - label: D
    content: 產業連鎖
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中可知日本電子產業與美國蘋果公司間具有「產品─原料」的供應連鎖關係，故選(D)產業連鎖。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 2021 年美國政府針對 Facebook 進行反壟斷調查，指出 Facebook 於 2012 年以 10 億美元併購 Instagram 後，又於 2014 年以 19 億美元併購最大競爭者 WhatsApp，涉嫌壟斷數位社群的市場。未來 Facebook 恐被迫分拆 Instagram 與 WhatsApp 等事業體，以恢復數位市場的公平競爭。請問 Facebook 併購前述兩家公司，此種組織結構調整為何？
  options:
  - label: A
    content: 垂直整合：擴大商品圈
  - label: B
    content: 水平整合：擴大市占率
  - label: C
    content: 水平分工：達到規模經濟
  - label: D
    content: 垂直分工：區隔不同年齡層的社群用戶
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B) Facebook、Instagram、WhatsAPP 皆為社群應用程式，因此 Facebook 併購另外兩家社群應用程式公司屬於「水平整合」，以擴大其市占率，但也造成壟斷市場的疑慮。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 彰化縣社頭鄉是臺灣織襪工業的大本營，自 1980 年代中期之後，因應環境變化，廠商開始調整經營策略，如：(甲)移到國外設廠，採取垂直整合模式，進行紡紗、染織、剪裁、車線、定型等一貫作業(乙)依然留在當地，但不斷推出新款式，如塑身襪、抗紫外線襪、果酸絲襪，朝向顧客化的生產以爭取市場(丙)派公司的技術人員到國外研習新的織襪技術，引進現代化電腦操作機器，促進大量及自動化生產，甚至自創品牌，強調品質與服務(丁)尋找專業代工廠或家庭代工，建立合作關係，並透過開會，讓代工們相互溝通培養良好默契。以上哪些廠商的經營策略，最能呈現知識經濟時代下知識的運用？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「知識經濟」指以知識作為產品或以知識投入生產過程，故選(C)(乙)(丙)。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 小明參加農委會園丁計畫回鄉創立蔬菜經營班，成功栽種出高品質的溫室蔬菜，他將所得收入的絕大部分用來購買種子、有機肥和設備，期望明年能有更大的收穫。請問此一現金的利用過程屬於農業投入產出系統中的哪個部分？
  options:
  - label: A
    content: 投入
  - label: B
    content: 過程
  - label: C
    content: 產出
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)將現金用來購買種子、肥料與設備，屬於農業系統中的「投入」。
