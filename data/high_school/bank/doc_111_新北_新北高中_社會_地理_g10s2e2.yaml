  section: 1
  number: 14
  type: single
  page: 2
  stem: 熱帶栽培業與商業性穀物這兩種商業性農業的經營，皆以種植農作為主，兩者在經營上具有下列哪些共同的特徵？(甲)高度機械化(乙)經營風險高，易受國際因素影響(丙)農場規模大(丁)集約度低，極度粗放
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)(丁)僅商業性穀物農業有此特徵。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 4
  stem: 酪農業最重要的就是要有「奶」，因乳牛不會平白無故分泌乳汁，因此精準掌握母牛的發情期，施以人工授精成了最關鍵的技術。以往酪農須趁半夜涼爽時熬夜觀察母牛的特定動作，如來回踱步、擺耳，因此農夫身心疲累不可言喻。近年農業試驗研究所應用無線感測網路，在母牛前肢上安裝動作偵測晶片，當晶片偵測到訊息後，便會結合雲端技術，透過手機即時通知農夫，並蒐集當時的氣溫、體溫等資訊，以建置牛隻資料庫。請問上述說明了現代酪農業具備哪種經營特色？
  options:
  - label: A
    content: 朝向知識經濟發展
  - label: B
    content: 朝向品牌化經營
  - label: C
    content: 具有契作特色
  - label: D
    content: 朝向精緻農業發展
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中提及「無線感測網路」、「在母牛前肢上安裝動作偵測晶片」、「雲端技術」等，可知將現代科技知識應用在酪農業的生產中，為知識經濟的表現，故選(A)。
- id: doc_111_新北_新北高中_社會_地理_g10s2e2_s1_16
  section: 1
  number: 16
