- id: doc_112_台北_明倫_數學_數甲_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知函數 f（x）＝－$x^{2}$＋4 的圖形與直線 y＝0，x＝0 及 x＝1 所圍成的區域為 R，今將區域 R 中 [ 0，1 ] 等分成 5 段後，得 5 個等寬的長條，設此 5 個長條之上矩形面積和（上和）為 $U_{5}$，下矩形面積和（下和）為 $L_{5}$，則
  options:
  - label: A
    content: $L_{5}$＝$\frac{98}{25}$
  - label: B
    content: $U_{5}$＝$\frac{94}{25}$
  - label: C
    content: $L_{5}$＝$\frac{92}{25}$
  - label: D
    content: $U_{5}$＝$\frac{89}{25}$
  - label: E
    content: $U_{5}$＝$\frac{84}{25}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$U_{5}$＝$\frac{1}{5}f ( 0 )$＋$\frac{1}{5}f\left( \frac{1}{5} \right)$＋$\frac{1}{5}f\left( \frac{2}{5} \right)$＋$\frac{1}{5}f\left( \frac{3}{5} \right)$＋$\frac{1}{5}f\left( \frac{4}{5} \right)$

    ＝$\frac{1}{5}\left[ ( -0^{2}+ 4 ) + \left( -\left( \frac{1}{5} \right) ^{2}+4 \right) \right.$＋……＋$\left. \left( -\left( \frac{4}{5} \right) ^{2}+ 4 \right) \right]$

    ＝$\frac{1}{5}\left[ 20-\frac{1}{25} ( 1^{2}+2^{2}+3^{2}+4^{2} ) \right]$＝$\frac{1}{5}\times \left[ 20 -\frac{6}{5} \right]$＝$\frac{94}{25}$

    $L_{5}$＝$\frac{1}{5}f\left( \frac{1}{5} \right)$＋$\frac{1}{5}f\left( \frac{2}{5} \right)$＋$\frac{1}{5}f\left( \frac{3}{5} \right)$＋$\frac{1}{5}f\left( \frac{4}{5} \right)$＋$\frac{1}{5}f ( 1 )$

    ＝$\frac{1}{5}\left[ \left( -\left( \frac{1}{5} \right) ^{2}+4 \right) \right.$＋……＋$\left( -\left( \frac{4}{5} \right) ^{2}+ 4 \right)$＋$\left. \left( -\left( \frac{5}{5} \right) ^{2}+ 4 \right) \right]$

    ＝$\frac{1}{5}\left[ 20-\frac{1}{25} ( 1^{2}+2^{2}+\ldots \ldots +5^{2} ) \right]$

    ＝$\frac{1}{5} \left[ 20 -\frac{11}{5} \right]$＝$\frac{89}{25}$

    故選(B)'
- id: doc_112_台北_明倫_數學_數甲_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 求$\int_{0}^{4} ( | x - 3 |+ 2x )dx$＝？
  options:
  - label: A
    content: '13'
  - label: B
    content: '15'
  - label: C
    content: '17'
  - label: D
    content: '19'
  - label: E
    content: '21'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{0}^{4} ( | x - 3 |+ 2x )dx$＝$\int_{0}^{3} ( | x - 3 |+ 2x )dx +\int_{3}^{4} ( | x - 3 |+ 2x )dx$

    ＝$\int_{0}^{3} ( x + 3 )dx +\int_{3}^{4} ( 3x - 3 )dx$

    ＝$\left. \left( \frac{1}{2}x^{2}+ 3x \right) \right| _{0}^{3}+ \left. \left( \frac{3}{2}x^{2}- 3x \right) \right| _{3}^{4}$

    ＝$\left( \frac{9}{2}+ 9 \right) - 0 +( 24 - 12 )- \left( \frac{27}{2}- 9 \right)$

    ＝21

    故選(E)'
- id: doc_112_台北_明倫_數學_數甲_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 設 f（x）＝$\begin{cases}x , 當 x < 1 \\ x - 3 , 當 x\geq 1\end{cases}$，則$\int_{0}^{2} x^{2}f ( x )dx$＝？
  options:
  - label: A
    content: －3
  - label: B
    content: －2
  - label: C
    content: '1'
  - label: D
    content: '2'
  - label: E
    content: '3'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{0}^{2} x^{2}f ( x )dx$＝$\int_{0}^{1} x^{2}f ( x )dx+\int_{1}^{2} x^{2}f ( x )dx$

    ＝$\int_{0}^{1} x^{3}dx +\int_{1}^{2} ( x^{3}- 3x^{2} )dx$

    ＝$\left. \left( \frac{1}{4}x^{4} \right) \right| _{0}^{1}+ \left. \left( \frac{1}{4}x^{4}-x^{3} \right) \right| _{1}^{2}$

    ＝$\frac{1}{4}-0+( 4-8 )- \left( \frac{1}{4}- 1 \right)$＝－3

    故選(A)'
- id: doc_112_台北_明倫_數學_數甲_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '已知實數 a，b 滿足$\int_{-3}^{-2} ( ax^{2}+2x+b )dx$＝6，$\int_{-1}^{2} ( ax^{2}+ 2x +b )dx$＝12，則數對

    （a，b）＝？'
  options:
  - label: A
    content: $\left( \frac{9}{2} , -\frac{3}{2} \right)$
  - label: B
    content: $\left( -\frac{1}{2} , \frac{7}{2} \right)$
  - label: C
    content: $\left( \frac{3}{2} , \frac{3}{2} \right)$
  - label: D
    content: $\left( \frac{5}{2} , \frac{1}{2} \right)$
  - label: E
    content: $\left( -\frac{9}{2} , \frac{1}{2} \right)$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{-3}^{-2} ( ax^{2}+ 2x +b )dx$＝$\left. \left( \frac{1}{3}ax^{3}+x^{2}+bx \right) \right| _{-3}^{-2}$

    ＝$\left( -\frac{8}{3}a + 4 - 2b \right) -( -9a + 9 - 3b )$＝$\frac{19}{3}a +b - 5$＝6

    $\int_{-1}^{2} ( ax^{2}+ 2x +b )dx$＝$\left. \left( \frac{1}{3}ax^{3}+x^{2}+bx \right) \right| _{-1}^{2}$

    ＝$\left( \frac{8}{3}a + 4 + 2b \right) - \left( -\frac{1}{3}a + 1 -b \right)$＝3a＋3b＋3＝12

    $\Rightarrow\begin{cases}\frac{19}{3}a +b = 11 \\ a +b = 3\end{cases}\Rightarrow\begin{cases}a =\frac{3}{2} \\ b =\frac{3}{2}\end{cases}$

    ∴數對（a，b）＝$\left( \frac{3}{2} , \frac{3}{2} \right)$

    故選(C)'
