- id: doc_111_桃園_武陵_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列哪些函數圖形的對稱中心與y＝sin 2x圖形的對稱中心<u>完全</u>一樣？
  options:
  - label: A
    content: y＝cos x
  - label: B
    content: y＝tan x
  - label: C
    content: y＝cos 2x
  - label: D
    content: y＝tan 2x
  - label: E
    content: y＝cos ( 2x＋$\frac{\pi}{2}$ )
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: y＝sin 2x的對稱中心滿足2x＝kπ x＝$\frac{k}{2}$π ∴中心為 ( $\frac{k}{2}$π , 0 ) (A) y＝cos x的對稱中心 ( $\frac{2k+1}{2}$π , 0 ) (B) y＝tna x＝$\frac{\sin x}{\cos x}$中心 ( kπ , 0 ) (C) y＝cos 2x對稱中心 ( $\frac{2k+1}{4}$π , 0 ) (D) y＝tan 2x＝$\frac{\sin 2x}{\cos 2x}$中心 ( $\frac{k}{2}$π , 0 ) (E) y＝cos ( 2x＋$\frac{\pi}{2}$ )＝sin 2x 故選(D)(E)。
- id: doc_111_桃園_武陵_數學_數A_g11s1e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設0＜θ＜$\frac{\pi}{2}$，且sin θ＝$\frac{1}{3}$，則下列敘述哪些正確？
  options:
  - label: A
    content: cos 2θ＝$\frac{7}{9}$
  - label: B
    content: sin 2θ＝$\frac{2\sqrt{2}}{9}$
  - label: C
    content: cos 3θ＝$\frac{10\sqrt{2}}{27}$
  - label: D
    content: sin 3θ＝$\frac{26}{27}$
  - label: E
    content: sin $\frac{\theta}{2}$－cos $\frac{\theta}{2}$＝$\frac{\sqrt{6}}{3}$
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: sin θ＝$\frac{1}{3}$，0＜θ＜$\frac{\pi}{2}$ ⇒ cos θ＝$\frac{2\sqrt{2}}{3}$ (A) ○：cos 2θ＝1－2 $sin^{2}$θ＝1－2 ( $\frac{1}{3}$ )$^{2}$＝$\frac{7}{9}$ (B) ×：sin 2θ＝2 sin θ cos θ＝2×$\frac{1}{3}$×$\frac{2\sqrt{2}}{3}$＝$\frac{4}{9}\sqrt{2}$ (C) ○：cos 3θ＝4 cos $^{3}$θ－3 cos θ＝4 ( $\frac{2\sqrt{2}}{3}$ )$^{3}$－3( $\frac{2\sqrt{2}}{3}$ )＝$\frac{10}{27}\sqrt{2}$ (D) ×：sin 3θ＝3 sin θ－4 sin $^{3}$θ＝3 ( $\frac{1}{3}$ )－4 ( $\frac{1}{3}$ )$^{3}$＝$\frac{23}{27}$ (E) ×：sin $\frac{\theta}{2}$－cos $\frac{\theta}{2}$＝$\sqrt{\frac{1-\cos \theta}{2}}-\sqrt{\frac{1+\cos \theta}{2}}$＝$\sqrt{\frac{1-\frac{2\sqrt{2}}{3}}{2}}-\sqrt{\frac{1+\frac{2\sqrt{2}}{3}}{2}}$＝$\sqrt{\frac{3-2\sqrt{2}}{6}}-\sqrt{\frac{3+2\sqrt{2}}{6}}$ ＝$\frac{\sqrt{2}-1}{\sqrt{6}}-\frac{\sqrt{2}+1}{\sqrt{6}}$＝$-\frac{\sqrt{6}}{3}$ 故選(A)(C)。
- id: doc_111_桃園_武陵_數學_數A_g11s1e2_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 設函數y＝f (x)＝sin x＋con x，若$\frac{\pi}{6}$＜x＜π，則下列敘述哪些正確？
  options:
  - label: A
    content: f (x)的最大值為$\sqrt{2}$
  - label: B
    content: f (x)的最小值為－$\sqrt{2}$
  - label: C
    content: 當 f (x)有最大值時，x＝$\frac{\pi}{2}$
  - label: D
    content: 當 f (x)有最小值時，x＝π
  - label: E
    content: y＝f (x) 可由y＝sin x的圖形經過適當的鉛直伸縮與水平平移得到
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: f (x)＝sin x＋cos x＝$\sqrt{2}$sin ($x+\frac{\pi}{4}$) $\frac{\pi}{6}< x <\pi$ ⇒ $\frac{5}{12}\pi < x +\frac{\pi}{4}<\frac{5}{4}\pi$ 當$x +\frac{\pi}{4}$＝$\frac{\pi}{2}$時有最大值$\sqrt{2}$，沒有最小值 ⇒ x＝$\frac{\pi}{4}$ 可由y＝sin x左移$\frac{\pi}{4}$，鉛直伸縮$\sqrt{2}$倍所得。 故選(A)(E)。
