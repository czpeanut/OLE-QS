  section: 3
  number: 2
  type: fill
  page: 2
  stem: 設$\vec{a}$、$\vec{b}$、$\vec{c}$為兩兩不平行的非零向量，滿足$\vec{a}$＋$\vec{b}$＋$\vec{c}$＝$\vec{0}$。若 （x＋1）$\vec{a}$＋（y－2）$\vec{b}$＋（x＋y－3）$\vec{c}$＝$\vec{0}$，則數對（x，y）＝＿＿＿＿。
  answer:
  - （1，4）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{a}$＋$\vec{b}$＋$\vec{c}$＝$\vec{0}$ ⇒ $\vec{a}$＝－$\vec{b}$－$\vec{c}$

    （x＋1）$\vec{a}$＋（y－2）$\vec{b}$＋（x＋y－3）$\vec{c}$＝$\vec{0}$

    ⇒ $\vec{a}$＝$\frac{-(y-2)}{x+1}\vec{b}$＋$\frac{-(x+y-3)}{x+1}\vec{c}$

    又$\vec{b}//＼\vec{c}$ ⇒ －1＝$\frac{-(y-2)}{x+1}$，－1＝$\frac{-(x+y-3)}{x+1}$

    ⇒ $\begin{cases}x+1=y-2 \\ x+1=x+y-3\end{cases}$ ⇒ $\begin{cases}x-y=-3 \\ y=4\end{cases}$ ⇒ x＝1，y＝4

    故數對（x，y）＝（1，4）'
