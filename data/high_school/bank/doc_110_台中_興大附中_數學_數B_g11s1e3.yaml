- id: doc_110_台中_興大附中_數學_數B_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設 A（3，－2）、B（2，r）、C（1，－1）、D（s，4），請選出正確的選項。
  options:
  - label: A
    content: 若$\vec{AP}$＝（1，3），則 P 點坐標為（4，1）
  - label: B
    content: 若$\vec{QC}$＝（1，3），則 Q 點坐標為（2，2）
  - label: C
    content: ∣$\vec{AC}$∣＝5
  - label: D
    content: 若$\vec{AB}$＝$\vec{CD}$，則 r＋s＝3
  - label: E
    content: 承(D)，設 t 為實數，則∣$\vec{AB}$＋t$\vec{AC}$∣的最小值為$\frac{81}{5}$
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：設 P（x，y），則$\vec{AP}$＝（x－3，y＋2）＝（1，3）

    ∴P（4，1）

    (B) ╳：設 Q（x，y），則$\vec{QC}$＝（1－x，－1－y）＝（1，3）

    ∴Q（0，－4）

    (C) ╳：∣$\vec{AC}$∣＝∣（－2，1）∣＝$\sqrt{(-2)^{2}+1^{2}}$＝$\sqrt{5}$

    (D) ○：$\vec{AB}$＝$\vec{CD}$ ⇒ （－1，r＋2）＝（s－1，5） ⇒ s＝0，r＝3，故 r＋s＝3

    (E) ╳：∣$\vec{AB}$＋t$\vec{AC}$∣＝∣（－1，5）＋t（－2，1）∣＝∣（－1－2t，5＋t）∣

    ＝$\sqrt{(-1-2t)^{2}+(5+t)^{2}}$＝$\sqrt{5t^{2}+14t+26}$

    ＝$\sqrt{5 \left( t+\frac{7}{5} \right) ^{2}-\frac{7^{2}}{5}+26}$＝$\sqrt{5 \left( t+\frac{7}{5} \right) ^{2}+\frac{81}{5}}$

    ∴當 t＝$-\frac{7}{5}$時，∣$\vec{AB}$＋t$\vec{AC}$∣有最小值為$\sqrt{\frac{81}{5}}$

    故選(A)(D)'
