  stem: 試問下列哪一個數列的極限值最大？$答$：＿＿＿＿。
  options:
  - label: A
    content: $\left\langle \frac{7n + 1}{n} \right\rangle$
  - label: B
    content: $\left\langle \frac{( 7n + 1 ) ( n + 2 )}{n^{2}+n + 1} \right\rangle$
  - label: C
    content: $\left\langle \left( \frac{2n - 2}{n} \right) \left( \frac{19n + 1}{5n} \right) \right\rangle$
  - label: D
    content: $\left\langle \frac{7^{n +1}+ 7^{n -1}+ 2}{7^{n}+ 1} \right\rangle$
  - label: E
    content: $\left\langle 5 + \left( 1 +\frac{1}{n} \right) ^{n} \right\rangle$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)$\lim_{n \rightarrow \infty} \frac{7n + 1}{n}$＝7

    (B)$\lim_{n \rightarrow \infty} \frac{( 7n + 1 ) ( n + 2 )}{n^{2}+n + 1}$＝7

    (C)$\lim_{n \rightarrow \infty} \left( \left( \frac{2n - 2}{n} \right) \left( \frac{19n + 1}{5n} \right) \right)$＝$\frac{38}{5}$＝7.6

    (D)$\lim_{n \rightarrow \infty} \frac{7^{n +1}+ 7^{n -1}+ 2}{7^{n}+ 1}$＝7＋$\frac{1}{7}\approx$7.14

    (E)$\lim_{n \rightarrow \infty} \left( 5 + \left( 1 +\frac{1}{n} \right) ^{n} \right)$＝5＋e$\approx$5＋2.71828＝7.71828

    故選(E)'
