  stem: '若函數 f（x）＝$x^{3}$－$3x^{2}$＋8x－6，g（x）＝x－1，則

    (1)$\left( \frac{f}{g} \right) ( x )$的定義域為＿＿＿＿。（請用集合表示）

    (2)$\left( \frac{f}{g} \right) ( x )$的值域為＿＿＿＿。（請用集合表示）

