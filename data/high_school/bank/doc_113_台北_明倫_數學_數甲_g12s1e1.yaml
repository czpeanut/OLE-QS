- id: doc_113_台北_明倫_數學_數甲_g12s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列敘述何者為真？（[ ] 為高斯符號）
  options:
  - label: A
    content: '[ 0.999999 ]＝$[ 0.\overline{9} ]$'
  - label: B
    content: $\lim_{x \rightarrow 0} \frac{| x^{2}-x + 1 |-| 2x - 1 |}{x}$＝1
  - label: C
    content: 無窮等比級數之和$0.\overline{7} + 0.4\overline{6} +\ldots \ldots$＝$\frac{35}{18}$
  - label: D
    content: $\lim_{n \rightarrow \infty} \left( \frac{1}{n^{2}}+\frac{2}{n^{2}}+\frac{3}{n^{2}}+\ldots \ldots +\frac{n}{n^{2}}+\frac{n + 1}{n^{2}} \right)$＝0
  - label: E
    content: 若 $a_{n}$＝$\left( 1 +\frac{1}{n} \right) ^{n}$，則$( \lim_{n \rightarrow \infty} [ a_{n} ] )- 2 > 0$
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：[ 0.999999 ]＝0，$[ 0.\overline{9} ]$＝[ 1 ]＝1

    (B)○：$\lim_{x \rightarrow 0} \frac{| x^{2}-x + 1 |-| 2x - 1 |}{x}$＝$\lim_{x \rightarrow 0} \frac{( x^{2}-x + 1 )-( -( 2x - 1 ) )}{x}$＝$\lim_{x \rightarrow 0} \frac{x^{2}+x}{x}$

    ＝$\lim_{x \rightarrow 0} ( x + 1 )$＝1

    (C)○：無窮等比級數$0.\overline{7} + 0.4\overline{6} +\ldots \ldots$＝$\frac{7}{9}+\frac{46 - 4}{90}+\ldots \ldots$＝$\frac{7}{9}+\frac{42}{90}+\ldots \ldots$＝$\frac{\frac{7}{9}}{1-\frac{3}{5}}$＝$\frac{35}{18}$

    (D)╳：$\lim_{n \rightarrow \infty} \left( \frac{1}{n^{2}}+\frac{2}{n^{2}}+\frac{3}{n^{2}}+\ldots \ldots +\frac{n}{n^{2}}+\frac{n + 1}{n^{2}} \right)$

    ＝$\lim_{n \rightarrow \infty} \frac{1 + 2 + 3 +\ldots \ldots +n +( n + 1 )}{n^{2}}$＝$\lim_{n \rightarrow \infty} \frac{\frac{( n + 1 ) ( n + 2 )}{2}}{n^{2}}$＝$\lim_{n \rightarrow \infty} \frac{n^{2}+ 3n + 2}{2n^{2}}$＝$\frac{1}{2}$

    (E)╳：$( \lim_{n \rightarrow \infty} [ a_{n} ] )- 2$＝$\lim_{n \rightarrow \infty} [ 2.\ldots ] - 2$＝2－2＝0

    故選(B)(C)'
- id: doc_113_台北_明倫_數學_數甲_g12s1e1_s1_3
