- id: doc_113_台北_明倫_數學_數甲_g12s1e1_s2_14
  section: 2
  number: 14
  type: fill
  page: 3
  stem: 設一無窮等比級數的和等於－2，此級數之首項為 $a_{1}$，其第二項為$\frac{3}{2}$，令 $S_{n}$＝$a_{1}$＋$a_{2}$＋…＋$a_{n}$ 為此級數之前 n 項部分和，設滿足$| S_{n}-( -2 ) | < \frac{1}{10^{4}}$的 n 至少應為 k，則數對（$a_{1}$，k）＝ ＿＿＿＿。
  answer:
  - （－3，15）
  answer_status: verified
  answer_source: answer_key
  explanation: '設公比為 r，則$\begin{cases}\frac{a_{1}}{1 -r}=-2 \ldots \ldots \ldots \ldots \ldots ① \\ a_{1}r =\frac{3}{2} \ldots \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    $\frac{②}{①}$得 r（1－r）＝$-\frac{3}{4}\Rightarrow4r^{2}$－4r－3＝0$\Rightarrow$（2r＋1）（2r－3）＝0

    $\Rightarrow$r＝$-\frac{1}{2}$或$\frac{3}{2}\left( \frac{3}{2}\geq 1 , 故不合 \right)$

    因此 r＝$-\frac{1}{2}$，代入②得$-\frac{1}{2}a_{1}$＝$\frac{3}{2}\Rightarrowa_{1}$＝－3

    ∵$S_{n}$＝$-3 - 3 \left( -\frac{1}{2} \right) - 3 \left( -\frac{1}{2} \right) ^{2}-\ldots \ldots - 3 \left( -\frac{1}{2} \right) ^{n -1}$

    ＝$\frac{-3 \left( 1 - \left( -\frac{1}{2} \right) ^{n} \right)}{1 - \left( -\frac{1}{2} \right)}$＝$-2 \left( 1 - \left( -\frac{1}{2} \right) ^{n} \right)$＝$-2 + 2 \left( -\frac{1}{2} \right) ^{n}$

    ∴｜$S_{n}$－（－2）｜＝$\left| -2 + 2 \left( -\frac{1}{2} \right) ^{n}+ 2 \right|$＝$2\times \frac{1}{2^{n}}$＝$\frac{1}{2^{n-1}} < \frac{1}{10^{4}}$

    $\Rightarrow2^{n－1}$＞10000

    ∵$2^{13}$＝8192，$2^{14}$＝16384

    ∴n－1 ≥ 14，得 n ≥ 15，即 n 至少應為 15

    故所求數對（$a_{1}$，k）＝（－3，15）'
