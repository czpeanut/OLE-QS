  answer_source: answer_key
  explanation: '(A)○：$\lim_{x \rightarrow 0} f ( x )$＝0＝f(0)

    (B)○：$\lim_{x \rightarrow 1^{-}} f ( x )$＝2

    (C)╳：$\lim_{x \rightarrow 2} f ( x )$＝1≠f(2)＝2

