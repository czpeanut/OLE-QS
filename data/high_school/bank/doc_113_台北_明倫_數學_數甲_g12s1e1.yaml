  answer_source: answer_key
  explanation: '(1)$\left( \frac{f}{g} \right) ( x )$＝$\frac{x^{3}- 3x^{2}+ 8x - 6}{x - 1}$，其定義域為｛x｜x$\in$R，x≠1｝

    (2)$\left( \frac{f}{g} \right) ( x )$＝$\frac{x^{3}- 3x^{2}+ 8x - 6}{x - 1}$＝$x^{2}$－2x＋6＝（x－1）$^{2}$＋5

