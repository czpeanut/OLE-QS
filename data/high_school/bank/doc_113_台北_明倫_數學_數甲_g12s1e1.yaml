- id: doc_113_台北_明倫_數學_數甲_g12s1e1_s2_12
  section: 2
  number: 12
  type: fill
  page: 3
  stem: 設 f（x）為三次多項式，若$\lim_{x \rightarrow 1} \frac{f ( x )}{x^{2}- 3x + 2}$＝2 且$\lim_{x \rightarrow 2} \frac{f ( x )}{x^{2}- 3x + 2}$＝3，則$\lim_{x \rightarrow 3} f ( x )$＝＿＿＿＿。
  answer:
  - '8'
  answer_status: verified
  answer_source: answer_key
  explanation: '由$\lim_{x \rightarrow 1} \frac{f ( x )}{x^{2}- 3x + 2}$＝2 及$\lim_{x \rightarrow 2} \frac{f ( x )}{x^{2}- 3x + 2}$＝3 可知，f（x）有因式 x－1 及 x－2

    因此可設 f（x）＝（x－1）（x－2）（ax＋b）

    則$\lim_{x \rightarrow 1} \frac{f ( x )}{x^{2}- 3x + 2}$＝$\lim_{x \rightarrow 1} \frac{( x - 1 ) ( x - 2 ) ( ax +b )}{( x - 1 ) ( x - 2 )}$＝$\lim_{x \rightarrow 1} ( ax +b )$＝2$\Rightarrow$a＋b＝2 ……………①

    $\lim_{x \rightarrow 2} \frac{f ( x )}{x^{2}- 3x + 2}$＝$\lim_{x \rightarrow 2} \frac{( x - 1 ) ( x - 2 ) ( ax +b )}{( x - 1 ) ( x - 2 )}$＝$\lim_{x \rightarrow 2} ( ax +b )$＝3$\Rightarrow$2a＋b＝3 …………②

    由①、②得 a＝1，b＝1

    故$\lim_{x \rightarrow 3} f ( x )$＝$\lim_{x \rightarrow 3} ( ( x - 1 ) ( x - 2 ) ( x + 1 ) )$＝2×1×4＝8'
