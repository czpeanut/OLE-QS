  page: 1
  stem: 形成地形的重要因素包含構造、營力、時間。請問下列共有幾項敘述正確？(甲)相同侵蝕力下，不同岩性具有不同抗蝕力，造成差異侵蝕(乙)外營力是受熱對流及重力影響，在地球外部形塑地形的作用力(丙)基隆山的形成是由內營力及外營力共同作用而成(丁)新褶曲山脈多分布於板塊接觸帶，如安地斯山脈(戊)土石流發生形成的土石扇相較河流堆積形成的山麓沖積扇，時間尺度更大(己)風化作用可透過風力改變地形如海岸沙丘的形塑
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '5'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)岩石因其性質不同，在同樣的侵蝕力之下，會產生不同的抗蝕能力，稱之為差異侵蝕；(乙)地形作用當中，外營力與太陽加熱地表產生的熱對流，以及重力作用相關；(丙)基隆山為侵入式的火山，由火山活動（內營力）在岩層當中形成火成岩，而因火成岩較為堅硬，差異侵蝕（外營力）造成該岩體被侵蝕的速度較慢，顯露於地表；(丁)板塊交界帶容易產生新褶曲山脈，例如：喜馬拉雅山、玉山、安地斯山脈等；(戊)土石流堆積而成的山麓沖積扇，其時間尺度較河流堆積來的更短；(己)風化作用是使物體在原地崩解的過程，與形塑沙丘的風力作用為兩種不同的外營力作用型態。題幹敘述中，(甲)(乙)(丙)(丁)為正確，故選(C) 4 項。
