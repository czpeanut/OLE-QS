  group_stem: '2016 年 5 月，阿爾塞克河（Alsek Piver）及克盧恩河（Kluane River）的源頭──加拿大的卡斯卡烏希冰川（Kaskawulsh Glacier），產生過多的冰川融水，末端一座 100 英尺（約 30 公尺）高的邊坡因而崩塌，融水改道流入阿爾塞克河，最後進入南邊的阿拉斯加灣，而原先流入白令海的克盧恩河在 4 天內從流量充沛的河流迅速變成一條細小的河道。此現象也讓白大角羊在進入克盧恩河（Kluane River）的合法狩獵區時，缺少了大面積的流水阻礙，因此白大角羊總數經預測，未來將有顯著減少的情形。

    ──改寫自環境資訊中心〈氣候變遷讓整條河消失白大角羊可無障礙進入合法狩獵區〉

