  page: 9
  stem: 文中提及台塑將潮間帶填土，打造石化園區。請問潮間帶為下圖哪一代號所在位置呢？（非選）
  group_stem: '時間回溯至民國 75 年，台塑宣布將在宜蘭利澤投資設立輕油裂解廠，引發民間反六輕運動。爾後，六輕設廠計畫輾轉從嘉義東石，到桃園觀音，1991 年決定落腳雲林麥寮，定於濁水溪口南岸。相較宜蘭縣民極力阻擋六輕，多數雲林人面對它的到來，充滿期望。台塑為了打造石化專區，填掉潮間帶，在當時曾經創下號稱填海造陸最快、預計造地面積最大的世界紀錄，然而，其實是大量抽取濁水溪南岸的海沙所換來的代價。

    換到蚵農的視角，雲林台西一帶蚵苗養殖發達，大約中秋過後，蚵苗開始附著生長，比起臺南早了 2 個月，因此台西所培育的蚵仔苗，會出貨給臺南的業者繼續養殖。民國 103 年，台西的蚵苗養殖面臨兩大難題：第一，氣候異常乾旱，存活下來的蚵苗，到了臺南卻因海水濃度高，並且須與海鞘爭奪生存環境。蚵農林清和說：「這種東西（海鞘）包住以後，蚵仔比較不會長大，牠肥的也比較慢，賣到市場去，生意人比較不喜歡。」第二，<u>六輕工業區的興建，阻礙了濁水溪的漂沙移動，加速沙洲往海岸線靠攏，減少淺灘養殖面積</u>。

    以台西鄉從離島工業區到三條崙漁港一帶而言，民國 70 年代原本有八千多公頃的養殖淺灘地，到民國 100 年後，卻只剩六千公頃的面積。

    ──改寫自〈我們的島──蚵仔去哪裡？台西蚵苗養殖難題〉

    依據上文及右圖的雲林台西一帶衛星影像圖。請問：'
