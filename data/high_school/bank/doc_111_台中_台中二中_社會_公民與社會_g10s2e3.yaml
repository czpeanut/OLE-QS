  type: single
  page: 10
  stem: 小鈴與阿輝結婚十幾年未到法院登記財產制度，而夫妻財產制是用以規範夫妻於婚姻共同生活中的財產關係，應基於男女平等原則及肯定家務勞動的價值，才能順應時代潮流。請問小鈴與阿輝所採用的夫妻財產制之規定，下列何者正確？
  options:
  - label: A
    content: 夫妻就各自的婚後財產，互負報告的義務
  - label: B
    content: 約定財產制又可分為「共同財產制」及「分別財產制」
  - label: C
    content: 婚後所產生之債務，夫妻應該共同清償
  - label: D
    content: 不管是婚前或婚後的財產，夫妻應共同管理
  group_stem: 家庭主婦小鈴與阿輝結婚十幾年，育有 6 歲的平平。最近小鈴發現阿輝與公司的祕書過從甚密，果然事發不到 3 個月阿輝就提出離婚要求。小鈴非常難過，因為長期在家從事家務勞動的她從未外出工作，全部的財產又都登記在阿輝的名下，如今面對阿輝的變心，傷心欲絕的小鈴只能勇敢的面對離婚的事實，忍痛的簽下離婚協議書。請問：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)文中提到「兩人未到法院登記財產制度」，可知為法定財產制。(C)應為法定財產制，而不是約定財產制。(D)法定財產制不論是婚前或婚後財產，都各自管理。故本題選(A)。
