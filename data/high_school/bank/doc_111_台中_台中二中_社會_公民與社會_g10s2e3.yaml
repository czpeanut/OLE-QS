  group_stem: 阿寶在火車站附近逛街時，發現有某店家習慣將商品擺放至騎樓人行道的位置來吸引顧客。她曾向店家反映如此會影響行人行走的權利，但店家卻主張騎樓下的人行道是他購買房屋所有權的一部分，所以騎樓人行道應該屬於他個人使用的區域，並無違法。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 所有權相對原則，又稱為所有權社會化。指的是政府有時會為了增進公共利益而對個人的所有權進行部分限制，(A)即是此例。(B)此為所有權絕對原則的展現。(C)此行為涉及「權利濫用」。(D)此為無權占用的情形。故本題選(A)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_38
