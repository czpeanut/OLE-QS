  stem: 小朱將房子先賣給大明，大明很快就搬進入住；沒想到小朱之後又把房子賣給大智，大智熟悉房產所有權轉移須辦理登記，所以在辦完登記手續後就準備搬家入住，結果發現小朱將房子一屋兩賣，大明說房子是他先買所以應該屬於他；大智也說房子是他的，最後兩人鬧到法庭上法官將房子判給大智，請問法官是依據哪一項原則將房子判給大智？
  options:
