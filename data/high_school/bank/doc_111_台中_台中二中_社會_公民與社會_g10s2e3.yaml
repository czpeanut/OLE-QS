  stem: 娘家父母要取得過世女兒放在婆家的手機，卻不能直接取得，最可能的原因為下列何項規範？
  options:
  - label: A
    content: 手機內容資訊屬於智慧財產權，僅由本人所有，其過世後父母無法取得
  - label: B
    content: 嫁到婆家以後同住在一起，婚後財產為張女婆家所共同擁有，不歸娘家
  - label: C
    content: 張女老公與小孩為繼承人，娘家爸媽、妹妹不是法定繼承的優先順位
  - label: D
    content: 張女過世後財產權消滅，手機放在婆家因地利之便，婆家為當然繼承
  group_stem: 張姓女子疑因不堪婆婆長期言語霸凌後輕生，並在社交平臺留下一篇〈我的婆婆殺了我〉控訴文，直指婆婆是她尋短的原因，該文指出時常遭到婆婆言語霸凌、無視及恐嚇。張女家屬向記者透露，事發後第一時間婆家不但未通知，連想看手機遺物還要寫「借據」切結，更沒有兩個孫子的探視權。
