- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_40
  section: 1
  number: 40
  type: single
  page: 9
  stem: 按照上述事實，關於阿明、阿勇兩人的刑事追訴，下列敘述何者最為正確？
  options:
  - label: A
    content: 地方法院對於檢察官聲請搜索票之請求，一律不得拒絕
  - label: B
    content: 兩人共同開車撞死阿立，因此刑責應該相同否則不公平
  - label: C
    content: 地方法院拒絕檢察官聲請之搜索票，顯然有包庇之事實
  - label: D
    content: 檢察官持搜索票扣押證物不需受搜索人同意得強行進入
  group_stem: 現已 15 歲的阿明和 40 歲的阿勇開車尋仇，兩人共同撞死 30 歲的阿立。事後，警方逮捕阿明、阿勇，移送檢察署。檢察官就兩人犯行分別向少年法院和地方法院聲請搜索票以利偵查。少年法院裁定檢察官得持搜索票到其住處扣押證物；地方法院則認為阿勇所涉及的犯行事證明確，且坦承不諱已無須再搜索證物。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)可視需求情況而拒絕。(B) 15 歲的阿明屬於限制責任能力，刑責有機會減輕。(C)法院有權責視情況與需求核發搜索票，並非是包庇。故本題選(D)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_41
  section: 1
  number: 41
  type: single
  page: 9
  stem: 承上題，依現代《刑法》之觀念，關於被害人阿立及其家屬的保護政策，下列敘述何者正確？
  options:
  - label: A
    content: 因阿立已滿 18 歲，因此加害人不論年齡皆應適用《刑事訴訟法》
  - label: B
    content: 基於嚇阻理論預防犯罪應立即執法，彌補其家屬的心理創傷
  - label: C
    content: 阿立家屬可以向犯罪被害人補償審議委員會申請犯罪被害補償金
  - label: D
    content: 為避免造成二次傷害，應避免讓被害人家屬接觸修復性司法
  group_stem: 現已 15 歲的阿明和 40 歲的阿勇開車尋仇，兩人共同撞死 30 歲的阿立。事後，警方逮捕阿明、阿勇，移送檢察署。檢察官就兩人犯行分別向少年法院和地方法院聲請搜索票以利偵查。少年法院裁定檢察官得持搜索票到其住處扣押證物；地方法院則認為阿勇所涉及的犯行事證明確，且坦承不諱已無須再搜索證物。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)刑事訴訟法的適用，應當是依據犯罪嫌疑人而非被害人的年齡。(B)嚇阻理論指的是刑罰的存在具有嚇阻作用，與是否立即執行無關。(D)修復式正義，為修復犯罪所生傷害而實現司法正義為目標的一切活動。兩造雙方同意下，可以進行修復式正義的活動。故本題選(C)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_42
