  - label: D
    content: 加速修復式司法，立即安排與加害人對話
  group_stem: 現已 15 歲的阿明和 40 歲的阿勇開車尋仇，兩人共同撞死 30 歲的阿立。事後，警方逮捕阿明、阿勇，移送檢察署。檢察官就兩人犯行分別向少年法院和地方法院聲請搜索票以利偵查。少年法院裁定檢察官得持搜索票到其住處扣押證物；地方法院則認為阿勇所涉及的犯行事證明確，且坦承不諱已無須再搜索證物。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)心理創傷應透過心理諮商等方式，而不是加快執行死刑。(C)《刑事妥速審判法》是保障被告人權，而不是被害者人權。(D)修復式司法應當基於雙方的同意為之。故本題選(A)。
