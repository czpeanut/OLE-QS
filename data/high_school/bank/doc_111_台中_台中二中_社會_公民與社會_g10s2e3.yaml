  group_stem: 張姓女子疑因不堪婆婆長期言語霸凌後輕生，並在社交平臺留下一篇〈我的婆婆殺了我〉控訴文，直指婆婆是她尋短的原因，該文指出時常遭到婆婆言語霸凌、無視及恐嚇。張女家屬向記者透露，事發後第一時間婆家不但未通知，連想看手機遺物還要寫「借據」切結，更沒有兩個孫子的探視權。
