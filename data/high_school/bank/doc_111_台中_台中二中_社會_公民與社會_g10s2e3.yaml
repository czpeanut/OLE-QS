- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「刑法強制猥褻罪」屬非告訴乃論罪，而「性騷擾防治法強制觸摸罪」屬告訴乃論罪，兩者之間的刑事訴訟存在差異，請選出正確敘述
  options:
  - label: A
    content: 當檢方受理朱男強制猥褻告發案，檢方展開偵查後如果鍾議員沒有提出告訴，檢方若有足夠證據將提起告訴
  - label: B
    content: 當檢方受理朱男性騷擾告發案，檢方展開偵查後如果鍾議員沒有提出告訴，檢方將不能起訴朱男
  - label: C
    content: 當檢方受理朱男性騷擾告發案，檢方展開偵查後如果鍾議員沒有提出告訴，檢方若有足夠證據將起訴朱男
  - label: D
    content: 當檢方受理朱男強制猥褻告發案，檢方展開偵查後如果鍾議員沒有提出告訴，檢方將不能起訴朱男
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)非告訴乃論罪與被害人有沒有提出告訴無關，檢察官都應該進行偵查，認為罪證確鑿則可提起公訴。(C)性騷擾屬於告訴乃論，須鍾議員提出告訴，方會進入偵查步驟。(D)非告訴乃論罪應當是即使鍾議員沒有提出告訴，檢察官都應該進行偵查，認為罪證確鑿則可提起公訴。故本題選(B)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 為了遏止黃牛問題，讓異鄉遊子可以安心回家，粉絲也可以順利觀賞到心儀的偶像演出，政府決定祭出刑罰，並為了方便法官用法，修法規定「購買運輸、遊樂票券而轉售圖利者，得處以有期徒刑、拘役與罰金」。請問這樣的規定可能有什麼問題？
  options:
  - label: A
    content: 違反類推適用禁止原則
  - label: B
    content: 違反罪刑法定原則
  - label: C
    content: 違反刑法明確性原則
  - label: D
    content: 違反不溯及既往原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文可知，沒有明確訂出有期徒刑、拘役與罰金的範圍，違反明確性原則。(A)類推適用禁止原則指法官不可以自行類推相同情況，來適用類似的刑罰。(B)罪刑法定原則指行為之處罰，以行為時之法律有明文規定者為限。(D)禁止溯及既往原則指原則上以行為當時的刑法規定為行為的處罰。故本題選(C)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 我國知名前 Youtuber 小玉，因使用深度偽造的技術（Deepfake），製作換臉不雅影片，藉由這些影片販賣牟利。檢方偵辦調查後，發現許多受害者，因此依涉犯《個人資料保護法》非法利用個人資料罪、加重誹謗罪等罪嫌起訴。對於此類新型態的數位性暴力犯罪，有關部門已經提出整套修法，針對這類不法行為，制定明確罪責。目前草案已通過行政院審議，正送交立法院審查。面對網路普及，資訊影像傳播快速，要如何遏止數位性暴力，會成為必須面對的課題。根據上述案件，下列敘述何者正確？
  options:
  - label: A
    content: 社會變遷快速，除罪化的可能愈來愈低
  - label: B
    content: 法律對社會控制的強制力可能日趨薄弱
  - label: C
    content: 入罪化手段將落實正義以減少犯罪誘因
  - label: D
    content: 未來社會個人倫理感培養才能減少犯罪
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)社會變遷快速，除罪化的思考將會愈來愈多。(B)社會愈複雜，規範也會增加，法律的控制應當會愈來愈強。(D)應當是社會倫理。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 10 多年前風靡一時的社群網站遊戲，主打特色為到朋友的遊戲菜園裡偷菜，在當時曾有一個法律問題因此產生，究竟遊戲中的偷菜是否觸犯了《刑法》的竊盜罪。依照《刑法》的規定，意圖為自己或第三人不法之所有，而竊取他人之動產者，為竊盜罪，請根據以上資訊判斷下列敘述何者最為正確？
  options:
  - label: A
    content: 《刑法》規定的動產為實體物，雖然遊戲裡的蔬菜是虛擬物品，但科技變化太快立法跟不上，故應類推適用，擴大解釋竊盜罪，將遊戲裡的蔬菜納入竊盜罪的範圍裡
  - label: B
    content: 在某些地方的習慣裡，偷菜是對於他人日常生活的重大侵犯，應處以極刑，即使是虛擬遊戲裡亦是如此，所以無論是否屬於竊盜罪，應依照習慣法處以極刑
  - label: C
    content: 若於虛擬遊戲中偷菜適用竊盜罪，5 年後立法者發現此立法漏洞，並立法處罰此類偷菜行為，《刑法》在適用上會採從新從優的規定，以新法為優先適用
  - label: D
    content: 若於虛擬遊戲中偷菜不適用竊盜罪，5 年後立法者發現此立法漏洞，並立法處罰此類偷菜行為，則於立法前的偷菜行為雖屬犯罪行為，仍不應溯及處罰
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《刑法》禁止類推適用，因此不可能以《刑法》竊盜罪論處。(B)《刑法》禁止習慣法的適用。(C)刑法應當是「從舊從輕」原則，故即使未來處罰虛擬世界的竊盜，也不會溯及既往。故本題選(D)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: X 市的兩名警察於查緝失竊汽車時，遭小偷甲持利刃砍傷，甲見警察傷重倒地無法繼續追緝，便奪槍逃逸，而兩名警察在求救後送醫。檢察官後利用警察身上的密錄器調查，以殺人未遂罪逮捕並起訴甲，請問以下關於刑事訴訟程序的敘述，何者最正確？
  options:
  - label: A
    content: 即使警察身上的密錄器清楚的紀錄了甲確實為傷害他們的人，檢察官亦起訴了甲，但在經過法院尚未審判確定有罪之前，甲都應該被推定為無罪，此即為無罪推定原則
  - label: B
    content: 此案件屬於社會重大案件，且甲在砍傷警察後隨即帶著警槍逃逸，對社會安全有重大危害，故檢察官在偵查案件時，應立刻公開甲的長相及相關資訊，以維護社會安全，亦可以透過媒體的力量加快偵查進度
  - label: C
    content: 檢察官於審判中提出警察身上的密錄器影片、案發現場發現的兇刀指紋與甲的自白作為證據，但甲的律師主張該兇刀指紋是檢察官在訊問甲時強迫甲印上的，不可以作為證據，此時法官應該依自由心證決定該兇刀指紋是否可以為審判時的證據
  - label: D
    content: 若甲為未成年人，其案件會改由少年法庭審理，並優先以少年保護事件程序，因此法庭在人員配置上，會有專業的兒少知識法官、少年調查官及心理輔導員，但原則上還是會採公開審理避免爭議
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)此舉違反偵查不公開的原則。(C)此為重大關鍵應當會輔助其他證據協助判斷，而非直接由法官依照論理法則與經驗法則進行自由心證。(D)少年事件的審理通常以不公開為原則。故本題選(A)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 3
  stem: 少年小海 15 歲喪父後，開始「繼承父業」販毒，並自恃有《少年事件處理法》護身，打定主意「撈一票養家」，但經警方查獲後，承辦員警告知小海雖然《少年事件處理法》對少年犯罪有許多保護優先的措施，但較重的刑事案件，如販毒、運毒等情節均不在此列，打碎小海想逃脫刑責的如意算盤。請問有關於《少年事件處理法》對於少年犯罪的處理，下列敘述何者正確？
  options:
  - label: A
    content: 以公開審理為原則，不公開為例外
  - label: B
    content: 檢察官會出現在協商式審理階段
  - label: C
    content: 基於保護少年會立即塗銷所有個人資料
  - label: D
    content: 少年經檢方起訴後，由少年法庭的法官審理
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)以不公開為原則，公開為例外。(B)檢察官出現在偵查階段。(C)記錄塗銷依據《少年事件處理法》第 83-1 條：「少年有前項或下列情形之一者，少年法院應通知保存少年前案紀錄及有關資料之機關、機構及團體，將少年之前案紀錄及有關資料予以塗銷：一、受緩刑之宣告期滿未經撤銷，或受無罪、免訴、不受理判決確定。二、經檢察機關將緩起訴處分期滿，未經撤銷之事由通知少年法院。三、經檢察機關將不起訴處分確定，毋庸移送少年法院依少年保護事件審理之事由通知少年法院。可知非立即塗銷。」故本題選(D)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 有婦女到牛肉麵攤買麵，聲稱昨天買了 2 碗牛肉麵但回家卻發現沒牛肉，要老闆退錢，老闆基於相信客人的誠信而退款，但事後對帳發現根本沒有賣這兩碗麵的紀錄，認為該婦女詐欺而報警。警方介入調查後發現婦女精神狀況有問題，檢察官也因此做出不起訴處分。請問下列敘述何者正確？
  options:
  - label: A
    content: 婦女欠缺有責性而免罰
  - label: B
    content: 婦女欠缺違法性而免罰
  - label: C
    content: 婦女的行為不符合構成要件而免罰
  - label: D
    content: 婦女因為不溯及既往原則而免罰
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文可知，檢察官不起訴是因為婦女精神狀況有問題，此屬於有責性的討論範圍。故本題選(A)。(B)違法性是在討論是否有阻卻違法的事由。(C)該案件並非討論是否符合詐欺的構成要件。(D)該案件非因法律後來變更而產生的爭議，與禁止溯及既往無關。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 刑事審判影響人民權益甚大，須謹慎為之，避免人民受國家過度侵害，因此刑事訴訟流程進行時，必須謹守無罪推定原則，請問下列關於刑事訴訟流程進行的敘述，何者正確？
  options:
  - label: A
    content: 被告對於犯罪的控訴選擇緘默，法官可能以被告選擇沉默而推定有罪
  - label: B
    content: 為達到發現真實的目的，警方可以任何方法偵訊嫌疑人，獲取最可信的證詞
  - label: C
    content: 檢警可以公開偵查，藉此獲得更多證人及證據
  - label: D
    content: 鑒於民眾對法律不嫻熟，因此刑事案件中法院會強制原告聘請律師
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)法官不可以被告選擇沉默而推定有罪，須以證據來論定。(B)不得以刑求等非法方法進行偵訊。(C)依據偵查不公開原則，不可將偵查公開。故本題選(D)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 我國《刑法》規定：「傷害人之身體或健康者，處五年以下有期徒刑、拘役或五十萬元以下罰金。」也就是傷害罪。請問下列敘述中，何者會觸犯傷害罪？
  options:
  - label: A
    content: 20 歲的上班族大婷為向扒手搶回錢包，用雨傘打到扒手的右手臂瘀青
  - label: B
    content: 20 歲的大民參加籃球比賽，撞傷對方球員
  - label: C
    content: 10 歲的大瑄在公園跟其他小孩搶遊樂器材，造成對方摔倒，左膝挫傷
  - label: D
    content: 25 歲的大凱開車與他人擦撞，情緒不穩與對方互毆，雙分均受到輕傷
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 傷害罪為故意，如果是過失則屬於過失傷害罪。因此(A)此為正當防衛，屬於阻卻違法事由，不具有違法性。(B)(C)均為過失傷害。故本題選(D)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 南投一名簡姓男子和林女分手後，林女改與簡男朋友文姓男子交往，簡男暴怒，預藏刀刃到文男家談判，刺死文男後逃逸。簡男在母親勸說下到警局投案，檢方依殺人罪提起公訴。他投案後一審遭重判無期徒刑，二審在法庭上演悔過大戲，獲判 15 年，更一審時發現他二審認罪目的在於騙取更輕刑度；此外，法院查看看守所接見紀錄，發現他從未關心過死者家屬，又改判無期徒刑。全案再上訴後，最高法院駁回上訴定讞。看完報導，蔚萊與同學討論的敘述，何者正確？（資料來源：小三跟麻吉跑了人夫惱怒殺了他！法庭大演悔過戲遭識破重判，ETtoday 社會新聞）
  options:
  - label: A
    content: 此案為非告訴乃論須由檢方提出告訴
  - label: B
    content: 檢方依殺人罪提起公訴後，再啟動偵查機制調查犯罪事實
  - label: C
    content: 最高法院駁回上訴，此案定讞，代表此案不適用上訴制度
  - label: D
    content: 訴訟階段中，簡男若未聘請律師，法院須為其指定公設辯護人
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)非告訴乃論罪，檢察官得知可直接進行偵查，毋須先由檢察官提出告訴。(B)應當是偵查完，才可能會提起公訴。(C)最高法院為最高審級，駁回上訴並非代表不適用上訴制度，可能是上訴無理由。故本題選(D)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 4
  stem: 阿郎（19 歲）、阿狗（15 歲）、耗子（13 歲）是學長學弟關係，三人臭味相投，時常相約出遊。某日，三人在網咖因遊戲糾紛而與他人發生肢體衝突，兩夥人馬在網咖大打出手，耗子因為害怕，躲在一旁不敢加入亂鬥，豈料混亂中，竟有一路人甲遭掀飛的椅子擊中頭部，當場昏迷，警方到場後，將所有涉案人士帶回警局，請問下列關於三人的後續審理情形，何者「錯誤」？
  options:
  - label: A
