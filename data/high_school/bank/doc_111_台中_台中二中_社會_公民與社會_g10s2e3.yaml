  stem: 假設法院將平平的監護權判給小鈴，阿輝也娶了祕書，3 年後阿輝車禍身亡。請問下列何者正確？
  options:
  - label: A
    content: 阿輝無須負擔平平的扶養費
  - label: B
    content: 小鈴在離婚時無法分配到財產
  - label: C
    content: 只有祕書可以繼承遺產
  - label: D
    content: 祕書分配到的財產會比平平多
  group_stem: 家庭主婦小鈴與阿輝結婚十幾年，育有 6 歲的平平。最近小鈴發現阿輝與公司的祕書過從甚密，果然事發不到 3 個月阿輝就提出離婚要求。小鈴非常難過，因為長期在家從事家務勞動的她從未外出工作，全部的財產又都登記在阿輝的名下，如今面對阿輝的變心，傷心欲絕的小鈴只能勇敢的面對離婚的事實，忍痛的簽下離婚協議書。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)仍須負擔平平的扶養費。(B)小鈴可以主張剩餘財產差額分配請求權。(C)還有平平可以繼承遺產。(D)祕書也可以主張剩餘財產差額分配，可先取得一部分遺產，剩餘部分再進行遺產分配，因此祕書可以分得比較多的財產。故本題選(D)。
