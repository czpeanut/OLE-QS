  answer_status: verified
  answer_source: answer_key
  explanation: (A)手機內容資訊要視內容而定，並非一定是智慧財產權。(B)婚後財產是其與丈夫的財產制，與此無關。(C)(D)張女老公與小孩為繼承人，娘家爸媽、妹妹不是法定繼承的優先順位。故本題選(C)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s2e3_s1_39
