  stem: 在真空中電場與磁場的交互變化得以波動的形式向外傳播，稱為電磁波，則下列何者<u>無法</u>產生電磁波？
  options:
  - label: A
    content: 穩定直流電流
  - label: B
    content: 電子在一直線來回振動
  - label: C
    content: 質子作減速運動
  - label: D
    content: 電子或質子作等速圓周運動
  - label: E
    content: 通以交流電的導線
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 變動電流或加速電荷可產生電磁波。 (A)穩定直流電於周圍形成穩定磁場。 故選(A)。
