  group_stem: '(二)香港反送中運動 爭取自由與法治

    2019年，香港政府推出《逃犯條例》修訂草案，引發香港史上最大規模的「反送中」群眾運動，於6月兩度出現號稱百萬人，甚至兩百萬人的民眾上街頭示威遊行，身著黑衣、手持雨傘，黑壓壓占滿街道的人數之多，震驚了整個世界。

    對中國大量新移民的反感、港人身分流失的恐慌，以及對議會失能的失望，三因素構成「反送中運動」的遠因。而《逃犯條例》允許將嫌犯移送中國的後門，讓香港人擔心未來將因為有反中的言行就遭受政治迫害，被加上罪名後移送中國。這股害怕失去引以為傲的「自由」與「法治」的恐慌情緒，瞬間引爆反送中的浪潮。

    香港民眾受訪時表示，希望臺灣人要好好珍惜自身的民主體制，因為可以直接選舉行政首長，並用選票教訓違背民意的民選首長及民意代表。但對香港人而言，始終沒能體驗到這個民主政治的基本功能，因為特首（香港最高行政首長）並非由全體香港公民直接選出，且要經由中央政府任命；而立法會（香港最高民意機關）由於特殊的選舉制度，始終被親近中國政府的建制派議員主導，並時常被民眾抨擊沒有扮演好監督政府的角色。香港大學一份定期的民意調查研究也顯示，在香港回歸中國22周年之際，香港人的國家認同也有了很大的變化，「香港人」認同升至1997年回歸以來的新高，而「中國人」認同則處於新低點。民調分析師指出，兩次反修訂《逃犯條例》遊行後的調查結果，清楚反映事件對香港民眾在身分認同上的衝擊。

    7月1日，在香港回歸中國22周年之際，香港民間人權陣線再度發起遊行，要求撤回修訂《送中條例》、特首林鄭月娥下臺、徹查警方暴力鎮壓等。當晚，有示威民眾衝進了立法會，他們在牆上噴漆塗鴉，漆上「沒有暴徒只有暴政」，顯現部分港人對於香港未來無力感的宣洩和控訴。

    7月21日晚上，在元朗地鐵站發生疑似黑道分子的白衣人向一般民眾、尤其是身著黑色上衣及手持雨傘的民眾作出無差別攻擊，震驚全港。而憤慨的香港民眾發起「光復元朗」的遊行，遭遇香港警察的強勢鎮壓，甚至引發巷戰衝突。

    接下來，整個7~8月，幾乎每週都有港人上街集會遊行，並且陸續有公務員、醫護人員等串連罷工以抗議香港政府遲未回應港人訴求、並且對群眾暴力鎮壓的行為。反送中運動及其後續的抗爭事件，似乎還看不到結束的一天。'
