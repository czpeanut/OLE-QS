    content: 我國民主自由程度在諸多國際評比中高於中國
  - label: B
    content: 我國要加入任何國際組織常受到中國政治阻礙
  - label: C
    content: 國際社會不願承認我國為主權獨立國家的事實
  - label: D
    content: 中、日兩大強權互相爭奪各國際組織的控制權
  group_stem: (一)臺灣既然無法加入由中國所主導，目前最大型的FTA「區域全面經濟夥伴協定」(RCEP)，若想在東亞甚至國際的貿易上不被邊緣化，加入 CPTPP就是關鍵的一步。經濟部長王美花受訪表示，就臺灣目前所知，沒有任何CPTPP成員國反對臺灣加入，這與年度輪值主席國日本對中國申請加入所表達的不安形成對比，「至少在我們遞交書面申請後，並未聽到任何成員國反對，不像中國申請後，有一些國家提出意見」。中國從網路審查到勞動權益，各種問題讓人質疑其究竟能否達到CPTPP的高標準，而CPTPP這些要求將「挑戰中國最根本制度」。不過，王美花指出，「如果中國先加入，他們阻礙臺灣的風險必然存在。臺灣不論要加入什麼(組織)，他們都反對。」臺灣過去爭取加入WTO談判持續了逾10年，王美花對此表示，加入CPTPP應不至於花上那麼久時間，但很難給出具體時間表，「我認為，若盡可能減少政治阻礙，相信談判不會持續幾十年」。國發會主委、政務委員龔明鑫在9月23日的記者會上表示，若臺灣最終沒有加入CPTPP，原先外銷的石化、塑膠、橡膠、鋼鐵跟建材，會面臨比較高的關稅障礙，未來GDP將受到-056%的衝擊。
