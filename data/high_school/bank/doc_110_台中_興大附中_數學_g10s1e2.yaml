  stem: 如右圖，兩直線 $L_{1}$、$L_{2}$ 之方程式分別為 $L_{1}$：x＋ay＋b＝0， $L_{2}$：x＋cy＋d＝0；試問下列哪個選項是正確的？
  options:
  - label: A
    content: a＞0
  - label: B
    content: b＞0
  - label: C
    content: c＜0
  - label: D
    content: d＜0
  - label: E
    content: a＜c
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_110_台中_興大附中_數學_g10s1e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 462.8
      - 161.3
      - 563.8
      - 255.85
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$L_{1}$ 的斜率為$\frac{-1}{a}$，且過（－b，0），$L_{2}$ 的斜率為$\frac{-1}{c}$，且過（－d，0），則$\begin{cases}\frac{-1}{a}>\frac{-1}{c}> 0 \\ -b > 0 \\ -d < 0\end{cases}$⇒$\begin{cases}c < a < 0 \\ b < 0 \\ d > 0\end{cases}$

    故選(C)'
- id: doc_110_台中_興大附中_數學_g10s1e2_s1_2
  section: 1
