  page: 1
  stem: 平面坐標上有一點 A（－6，7），以及一動點 P（x，y）在圓 C： （x－2）$^{2}$＋（y－1）$^{2}$＝9 上，則滿足$\overline{AP}$為正整數的動點 P 共有幾個？
  options:
  - label: A
    content: '10'
  - label: B
    content: '11'
  - label: C
    content: '12'
  - label: D
    content: '13'
  - label: E
    content: '14'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'A 在圓 C 外，且圓心 O（2，1），半徑 r＝3

    則$\overline{AP}$的最小值為$\overline{AO}$－r＝$\sqrt{(-6 - 2 )^{2}+ ( 7 - 1 )^{2}}$－3＝10－3＝7，最大值為$\overline{AO}$＋r＝10＋3＝13

    ∴$\overline{AP}$為正整數的動點 P 共有 1＋2＋2＋2＋2＋2＋1＝12 個

    故選(C)'
- id: doc_110_台中_興大附中_數學_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 若三直線 $L_{1}$：2x－y－3＝0、$L_{2}$：2x＋ay＋3＝0、$L_{3}$：ax－y－6＝0 可圍成三角形，則何者為可能的 a 值？
  options:
  - label: A
    content: －1
  - label: B
    content: '0'
  - label: C
    content: '2'
  - label: D
    content: '3'
  - label: E
    content: '5'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：a＝－1 時，$\begin{cases}L_{1} : 2x - y - 3 = 0 \\ L_{2} : 2x - y + 3 = 0 \\ L_{3} : -x - y - 6 = 0\end{cases}$，此時 $L_{1}$//$L_{2}$ 不可圍成三角形

    (B)╳：a＝0 時，$\begin{cases}L_{1} : 2x - y - 3 = 0 \\ L_{2} : 2x + 3 = 0 \\ L_{3} : - y - 6 = 0\end{cases}$，此時三線交於一點$\left( -\frac{3}{2} , -6 \right)$

    (C)╳：a＝2 時，$\begin{cases}L_{1} : 2x - y - 3 = 0 \\ L_{2} : 2x + 2y + 3 = 0 \\ L_{3} : 2x - y - 6 = 0\end{cases}$，此時 $L_{1}$//$L_{3}$ 不可圍成三角形

    (D)○：a＝3 時，$\begin{cases}L_{1} : 2x - y - 3 = 0 \\ L_{2} : 2x + 3y + 3 = 0 \\ L_{3} : 3x - y - 6 = 0\end{cases}$，此時三線不平行且不共點

    ∴可圍成三角形

    (E)╳：a＝5 時，$\begin{cases}L_{1} : 2x - y - 3 = 0 \\ L_{2} : 2x + 5y + 3 = 0 \\ L_{3} : 5x - y - 6 = 0\end{cases}$，此時三線交於一點（1，－1）

    故選(D)'
