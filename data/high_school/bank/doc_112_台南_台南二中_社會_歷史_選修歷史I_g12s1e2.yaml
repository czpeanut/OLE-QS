  group_stem: 明治 44 年（1911 年），臺灣發生了轟動全島的食屍案。臺灣製腦合名會社搭建的腦寮遭到原住民的攻擊，雙方經歷激烈的戰鬥，造成三名腦丁、三名原住民戰士身亡，四名腦丁家屬被馘首。死亡的原住民戰士屍體，被就地埋葬。然而在兩天後，四名家屬死亡的腦丁心有不甘，前往腦寮掘出原住民屍體，割其肉烹食，磨其骨入藥。日本警方已經注意臺灣漢人將原住民骨骸入藥的行徑許久，很快地便逮捕了這四名腦丁。由於日本法律規定，「死體」必須進行葬祭，因此檢方以「毀損屍體罪」起訴四人。然而，初審的法官卻認為原住民不具有法律上的人格權，因此不構成「毀損屍體罪」，在法律上，四名腦丁的行為跟食用死去動物的肉是一樣的。此判決在日本法學界引起熱烈討論，著名人類學家伊能嘉矩更發表文章表示，文明的臺灣漢人之所以會有「食人」的野蠻惡習，有可能是受到「平埔蕃」的影響。
