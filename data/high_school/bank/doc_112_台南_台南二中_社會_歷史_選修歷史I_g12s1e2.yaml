    29.2017 年開始的「#Me Too」運動，是鼓勵曾經受到性騷擾、性暴力的受害者，藉由網路連結來發聲，終止性別暴力。(B)是鼓勵被侵害者發聲，並未有確切的要求政府改革。(C)是選美比賽的改革呼應了「#Me Too」運動。(D)資料中無法看出世界各地都受到熱烈的回應及鼓舞。

    30.(B)選美比賽出現改革與「#Me Too」運動開始之前，女性的意識便已覺醒。(C)選美比賽的改革是為了著重參賽者自己的個人特質、才能與熱情。(D)並非反對行動。

    ◎臺灣史

    31.袁保恆指出的問題在於福建巡撫每年只有一半的時間駐臺，時間太少、公文往來交通不便，在臺灣設定的建設往往無法實現，形同具文，因此建議應該在臺灣設置巡撫，由此可知無法推動有規劃的建設與政策是問題點，故選(D)。

    32.1905 年臺灣總督府頒布《糖業取締規則》，設定「原料採取區域制度」，即農民在未經許可的情況下，是不可以把原料運出區域外，跟其他的「會社」做生意的，也就是說會社是獨門獨占生意，農民自然沒有議價的空間，這樣的設計也壓縮了農民議價權利。題文報導內容指的事件是二林事件，起因為蔗農不滿林本源製糖的甘蔗收購價格太低，而引發的衝突事件，故選(A)。

    33.1942 年正逢中日戰爭之時，臺灣在日本推動皇民化運動之下，有許多年輕人受到影響，願意為日本天皇犧牲奉獻，便響應總督府的募兵政策，因此可推知這與皇民化運動的成效相關。(B)只要常用日語便可被升格為國語家庭，並不需要參軍。(C)民族自決風潮下，對臺灣的影響為許多政治社會運動興起。(D)臺灣被日本殖民，並未互相敵視。

    34.從文件中可看出，日本對臺灣人民到中國地區旅遊者，會發放旅券加以管理，且為了防止臺灣人民與清朝人民勾結，假藉臺籍人民的名義，取得通商貿易權力，因此採行措施，加強對前往海外的臺灣人民進行審查，故可推知題文的資料並非鼓勵人民發展貿易或推動南進政策，而是加強人民前往海外的審查，故選(A)。

    35.關鍵為「17 世紀」、「殖民者當作經濟作物招徠勞工鼓勵栽植」，外銷「中、美、澳」，題目四個選項中，蔗糖最符合題文內容。(B)稻米並非經濟作物。(C)中國為茶葉生產大國，因此不會成為外銷對象。(D)棉花成為大量經濟作物，要等到工業革命之後，且主要外銷國家應該會有英國。

    36.臺灣最早的檢疫制度開始於日治時期，總督府在臺灣推行公共衛生的管理，針對傳染病的流傳也採行了檢疫制度，因此應選擇(B) 1896 年。

    37.1980 年（民國 69 年），政府著手規畫新竹科學工業園區，以優惠條件吸引電子、資訊等廠商進駐。之後，臺灣資訊科技產業突飛猛進，成為臺灣重要的產業，也是全球電腦產業分工的重要基地，並完成了臺灣的產業升級。題文中所提到的產業為電動車，而電動車帶動「半導體、面板、電池、晶片」等產業的發展，而臺灣在「半導體、面板、電池、晶片」等高科技的產業發展，開始於產業升級時期，故選(D)。

    38.王光祿之所以觸法，是因為他獵捕了保育類動物，這是對生態保育的傷害，然而原住民族的打獵範圍與規範，有其傳統思維，因此在維持生態保育下，如何尊重原住民傳統文化與傳統領域，可以說是爭議的關鍵，故選(C)。

    39.資料一中可看出朱一貴事件的平定，有一部分來自粵莊人民的支持，因此褒獎其為義民；而資料二則看出漳、泉移民的緊張關係，在林爽文事件中導致泉州人不願意加入，也有助於清朝政府平亂。綜合兩則資料，便可看出族群對立對清廷來說，在民變爆發時不失為一種助益，而支持清廷的族群也可因此而獲得褒獎，得到利益，故選(B)。

    40.題文關鍵在「諸羅與鳳山兩縣的田園大多交付管事掌理，業主則是居於府治之中」，代表大地主將土地的管理都交付於他人，才會出現題文所述的現象。業主與真正管理土地者不是同一人，乃是因為在「一田多主」的土地形態下，大租戶（業主）的田地大多交付給小租戶管理。

    41.這些軍人的經歷包括二戰時期前往南洋作戰的士兵、「接收臺灣」的軍人、成為解放軍的臺灣原住民青年、曾參與日軍陣營卻被判刑的士兵，從上文的描述可看出這本書所提及時代包括了二戰、二戰後、國共內戰等時期，因此在時間上以(D)最為符合。

    42.(A)從行程可看出當時臺灣的西部縱貫鐵路已經完成，應該是等到 1908 年通車後才會有這樣的路線。(B)孔廟是中國儒家文化的代表，因此參訪孔廟不會是為了認同日本精神。(C)是為了在文化上與宗教上推廣日本文化而設置的。

    43.1946 ～ 1947 年，正逢二戰結束後，中國的國民黨與共產黨衝突愈演愈烈，因此會因應衝突而將臺灣的糧食物資支援中國大陸，此局勢導致臺灣的物價日益飆升。(A) 1949 年才發行新臺幣。(B) 1947 年 2 月底到 3 月初才爆發二二八事件。(D)日人離臺時能帶走的物資都有管制，數量不多，大多都被國民黨接收。

    44.題文提及「此國以『新的形式』來從事抗拒日本」，且相當短命，並被質疑可能是受到北京清廷政府所指使，可推測應該是臺灣民主國的成立，故選(A)。(B)一則不短命，也非為了抗拒日本才成立，更不可能是清廷指使的。(C)其成立的原因包含反對清朝，並非抗日。(D)是日本主導下成立的政權，因此其建立目的不符合抗拒日本，且當時清廷也已經滅亡。

    45.這篇文章的內容主要提到將帝國議會設置的法律實施於臺灣，並非適當的做法，因為臺灣人民的歷史、風俗民情、思想文化等和日本民族不一致，因此這樣做將會忽視臺灣的特殊性。由此可推知此人著作文章的目的是對《六三法》撤廢運動提出質疑，故選(D)。

    46.此事件的起因與人民為了反抗不民主的政治，而採行的遊行事件相關，且遊行群眾被審判，並被形塑成暴徒，可推知應為美麗島事件。(A)治警事件是認為臺灣議會期成同盟會至東京請願一事違反《治安警察法》，並非在臺灣遊行，且事後審判過程也沒有公開讓記者、家屬旁聽。(B)中壢事件是民眾抗議選舉不公而發起，並未有審判過程公開之事。(D)乃是雷震欲創立中國民主黨而導致被抓、判刑。

    47.題文中提及「從圖中可以看見政府開設的道路從西部平原穿過山脈到達東部諸社」，可判斷此時應該是在牡丹社事件後，沈葆楨來臺開山撫番政策下的成果，故選(C)。(A)只能知道道路開通，但無法判斷漢人是否大量移居東部。(B)沈葆楨來臺開山撫番時所修築的。(D)牡丹社事件之後。'
