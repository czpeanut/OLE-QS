  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 附圖中伊麗莎白一世「左手持象徵王權的十字架寶球、右手持權杖，桌上立有《聖經》」，可知伊麗莎白一世身為國王的同時也代表著領導國內的基督宗教；而她華美的服飾符合當時社會對女性的期待；附圖的背景是海洋和船隻，她任內因英國擴張海外，與西班牙發生衝突，更在 1588 年與西班牙爆發無敵艦隊之役，因此從圖中不僅表現出伊麗莎白一世身為女性的柔美，卻也深具遠見和功績，故選(D)。
