  stem: 索勃族是德國的少數民族之一，其學者於 19 世紀中葉提出「索勃民族再生計畫」，此計畫出現「索勃母親」的概念，「索勃母親」對於民族存亡極為重要，因為不諳德語，且索勃女性仍有穿著傳統服飾的習慣，而被賦予傳遞索勃文化和護衛索勃語言的任務。根據上述對索勃母親的理解何者正確？
  options:
  - label: A
    content: 索勃母親的出現模糊既有的「男主外女主內」的性別角色
  - label: B
    content: 德意志帝國統一時可能會借索勃母親的形象以激發愛國心
  - label: C
    content: 索勃母親顯示女性在公共事務上也有無法被男性替代的角色
  - label: D
    content: 可知索勃母親為戰時女性群體自發集結，領導抗爭的組織
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 根據題文內容，可知「索勃母親」的形象是根據社會塑造的性別差異強化而成的，女性可藉由教育，培養具民族思維的孩子，故選(C)。(A)由題文可知索勃母親強化「女主內」的性別腳色。(B)由「不諳德語」可知，索勃族因身為少數民族，擔憂被對德意志主流文化同化，因而塑造出「索勃母親」的角色。(D)應是根據女性的性別角色而賦予的任務。
