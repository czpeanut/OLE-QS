  stem: 伊麗莎白一世於 1558 年即位後，面對新舊教衝突以及對女性統治者的質疑，她和她的支持者透過各種方法塑造其公共形象。附圖即是一例，圖中背景是海洋和船隻，她穿著鑲著珠寶的衣飾，左手持象徵王權的十字架寶球、右手持權杖，桌上立有《聖經》，請問我們應如何解讀附圖塑造的女王形象？
  options:
  - label: A
    content: 與受到父權影響的基督宗教決裂，另闢容許女性的宗教空間
  - label: B
    content: 成為國家的母親，處理國政時不拋頭露面以符合社會的期待
  - label: C
    content: 摒棄作為女性的性別經驗，強調侵略外國的野心等陽剛氣質
  - label: D
    content: 展現她的柔美也是具見的拓殖者，兼具陽剛和陰柔的氣質
