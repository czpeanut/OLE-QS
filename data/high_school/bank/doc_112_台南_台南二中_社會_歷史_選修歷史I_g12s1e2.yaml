  stem: '資料一：西漢高祖過世後，皇后呂氏一族以外戚身分專權。《漢書．外戚傳》說：「夫女寵之興，由至微而體尊，窮富貴而不以功，此固道家所畏，禍福之宗也。」指出女性透過皇帝恩寵而獲取富貴與政治地位，將可能成為國家禍殃。

    資料二：朝鮮安東金氏家族內曾有三位女性成為王妃，因此安東金氏家族在朝鮮王朝後期擁有龐大的權力，並有多人曾出任領議政，學者稱為「勢道政治」。

    從這兩則資料來看，下列敘述何者正確？'
  options:
  - label: A
    content: 只要有王室血統，女性就有充分理由掌握政治權力
  - label: B
    content: 討論繼承者時，會先考慮血統正當性，再考慮性別
  - label: C
    content: 女性以血統或妻母身分掌權，通常難得到正面評價
  - label: D
    content: 利用外戚身分掌握政權，容易造成女性仿效的風潮
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一中的內容，可看出《漢書》對女性主導政治權力，抱持負面的評價；而資料二也可看的出來因為安東金氏家族中有女性成為王妃，使得該家族取的統治的權勢，掌管朝政，讓君王的權力旁落。由兩則資料的內容皆可看出，傳統社會普遍認為女性參與政治後會帶來負面的影響，故選(C)。
