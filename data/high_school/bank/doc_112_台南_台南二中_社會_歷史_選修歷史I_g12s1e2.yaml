  stem: 清朝文獻記載，元、明朝以來士大夫至庶民階層的女性皆有裹腳，其腳不會比燕、趙、齊、魯、秦、晉府女性的腳還要小，也不會像蘇、杭、嘉府女性的腳那樣大，因為她們在「兩足已長」時才會纏足。請問裹腳情形因地而異的原因應和下列何者最為相關？
  options:
  - label: A
    content: 政經中心邊陲思想的開放程度
  - label: B
    content: 女性需投入農業生產勞動與否
  - label: C
    content: 儒家思想滲透各地的程度不同
  - label: D
    content: 戰爭頻繁女性需前線作戰與否
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 蘇、杭、嘉等地位於長江以南，元、明時期農業及手工業發達，故當地有許多女性投入經濟生產，但仍受制於傳統女性纏足的觀念，因此調整為「兩足已長」時才會纏足。(A)蘇、杭、嘉等地乃是經濟繁榮的中心地區。(C)江南地區教育興盛，儒家思想也相當盛行。(D)江南地區戰爭頻繁的程度並沒有燕、趙、齊、魯、秦、晉府等北方地區來的高。
