  options:
  - label: A
    content: 客民原耕地有限，為爭取生存空間，因此比閩人更善鬥
  - label: B
    content: 客民在朱一貴事件中號召平亂的表現，使其獲得此特色
  - label: C
    content: 地方志為官方文獻，往往能較客觀如實的呈現客人特色
  - label: D
    content: 地方志多由閩籍官紳編輯，顯現閩人對客人的族群觀點
  group_stem: '資料一：康熙五十年代中期，府城地區官紳編輯的《諸羅縣志》、《臺灣縣志》、《鳳山縣志》等三本地方志，都不約而同提到了屏東地區「客」或「客仔」的特色：祖籍廣東潮州，以佃耕、傭工為生；喜聚居，善鬥健訟。根據當代所做的田野調查，當地傳說強調「客家」移民是在獲得官方的土地開發許可證（墾照）後，移墾屏東平原。另外，20 世紀初的一件土地訴訟中，來自臺南地區的閩籍地主提出了清代官方發給的屏東地區墾照，控訴屏東地區的客家佃戶侵奪了他們的土地。綜合來看，清初客家移民應是以佃戶的身分進入屏東平原，並逐漸掌握當地土地開墾，進而引起與閩南地主的緊張關係。

    資料二：康熙六十年（1721）朱一貴事件爆發，屏東平原的客家聚落很快整合了七十幾個大小村莊，號召約 12,000 人的武裝部隊，協助政府軍隊平定亂事。事件之後，屏東客家因協助政府平亂而被授予「義民」身分，當地並建立「忠義亭」供奉聖旨牌位，藉以強調自己與政府之間的緊密關係。從此「客仔」成為「義民」，取得合法開墾地，以及與閩南移民抗爭的地位。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「喜聚居，善鬥健訟」是較為負面的觀點，而臺灣在清初隸屬於福建省，官吏有可能多為閩籍人士，在閩粵不合的社會氛圍下，必會對客家有負面的評價。
