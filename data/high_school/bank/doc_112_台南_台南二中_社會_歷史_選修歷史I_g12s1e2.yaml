  section: 1
  number: 9
  type: single
  page: 2
  stem: '資料一：1915 年《臺灣日日新報》：「古聖人有云曰，身體髮膚，受之父母，不敢毀傷，孝之始也，女子纏足，乃傷身害體之大者，抑何撤達聖人之遺教歟，我臺灣既備文明世界，女子須早去此纏足之弊」。

    資料二：1930 年代《玲瓏》雜誌指出：「摩登女性的外表既要美，但不能過分打扮變得庸俗妖豔；她要有內在修養，有相當的學問；她的行為舉止大方且不討厭，要懂得一點舞蹈；也要入得廚房出得廳堂，可以管理家政」。

    對以上資料中「纏足」和「摩登女性」的敘述和解讀，下列何者正確？'
  options:
  - label: A
    content: 宋代理學強調婦女服從，因此纏足大為盛行
  - label: B
    content: 摩登女性的形象來自於東方文化
  - label: C
    content: 兩則資料都主張女性應擺脫舊有的審美觀
  - label: D
    content: 清治臺灣曾經成立天然足會鼓勵放足
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一強調臺灣既已成為文明世界，則必須捨棄傳統的纏足才是；而資料二則指出摩登女性的特色與內涵要有相當的學問，多才多藝等跟以往女子無才便是德的觀點已經大不相同。因此可得知兩則資料的共同點都是在塑造現代女性，擺脫舊有的束縛與審美觀，故選(C)。
