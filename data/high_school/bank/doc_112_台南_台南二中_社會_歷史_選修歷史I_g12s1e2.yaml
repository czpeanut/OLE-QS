  section: 1
  number: 1
  type: single
  page: 1
  stem: 《女權辯護》是在啟蒙運動時期出版的刊物，以下是其前言節錄：「我曾經閱讀各種討論教育問題的書籍，觀察父母行為和學校的管理情況，得出的結論是什麼呢？我相信忽視教育是造成現今女性狀況的重要原因。……許多書籍並不將女性看作是人，而是將她們看作婦女。這些書籍渴望婦女教育成迷人的情婦，而不是成為具有理性的妻子和母親。」請根據文章，下列何者正確？
  options:
  - label: A
    content: 作者認為女性不應該成為「婦女」進入家庭，而是應該透過自己的才能在社會上立足
  - label: B
    content: 作者認為當代女性的特質，來自於後天教育的形塑
  - label: C
    content: 啟蒙運動強調理性和平等，故此文章抨擊的對象應早於 18 世紀
  - label: D
    content: 宗教改革後，馬丁．路德提倡女性天生較劣等的說法，使性別不平等的狀況嚴重加劇
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文內容中提到的結論是「我相信忽視教育是造成現今女性狀況的重要原因」，許多書籍並未將女性教育成「具有理性的妻子和母親」，代表他認為後天教育造就現今女性的問題，故選(B)。
