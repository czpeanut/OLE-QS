  stem: 「公婆的心，難道可以失掉嗎？人有使恩自離的，也有使義自破的。丈夫雖然愛自己，但公婆認為媳婦不好，這就是所說的使義自破。那麼，要使公婆的心滿意怎麼辦呢？沒有比委曲順從更好的了。婆婆說不對而實際上是對的，就應該順從她的話；婆婆說對的而實際上不對，還是應該順從她的命令。不應該計較公婆的對與錯，和他們爭辯是非曲直。這就是我所說的委曲順從。」關於上述資料，下列哪一敘述正確？
  options:
  - label: A
    content: 從上述資料可以看出中國傳統家庭的照護功能
  - label: B
    content: 上述資料可以佐證中國傳統家庭講求「孝道」
  - label: C
    content: 「父母之命，媒妁之言」能印證上述資料的說法
  - label: D
    content: 中國傳統家庭期待女子「嫁雞隨雞，嫁狗隨狗」
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從文章內容可看出要求媳婦要順從公婆的意思，就算婆婆實際上不對，也不應該與公婆計較或爭辯，因為公婆的心不可失掉，而公婆是丈夫的父母，故傳統中國家庭要求媳婦嫁人後，便要將公婆視作自身父母般服侍、順從，以盡孝道。
