  group_stem: 20 世紀初宜蘭農村的娛樂活動普遍被認為是臺灣最早的歌仔戲，其參雜古典漢詩、漢文和臺語，融合京劇等元素。1920 年代發展出在室外搭棚演出的「外臺歌仔戲」和在戲院演出的「內臺歌仔戲」，在民間大受歡迎。興盛的同時也遭到部分群體批判，例如 1926 年〈大甲地方遏止歌仔戲聯署陳情書〉便言：「演出的主題不僅大多是足以助長淫風的男女問題，被稱為歌詞的音譜還帶有亡國之調……事實是演出歌仔戲，博取無智民眾的喝采，而且女子夜晚外出觀戲、早上貪睡，會影響當地一大副業帽子的製造……敦請當局深究徹底嚴禁的方法」；1930 年臺灣民眾黨的黨綱也增列「反對演歌仔戲」條文，並推廣「新劇」。1937 年起為因應非常時局，總督府實施「禁鼓樂」措施，許多劇團自發性停止演出，兩個月間演出的劇目數僅有往年的一成。相較內臺歌仔戲，外臺歌仔戲更會被以「破除陋習」之名遭到最嚴格的取締，僅剩少數演出主題為武士的「改良戲」的劇團得以存續。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提及反對歌仔戲的理由包含「助長淫風」、「博取無智民眾的喝采」，加上臺灣民眾黨的黨綱也增列反對歌仔戲的條文，便可推知批判歌仔戲的群體應該以知識分子居多，故選(C)。
