  stem: 1915 年，中國的《女子世界》登出一篇文章，裡面寫著：「為母者開宗明義第一章，必牢記此九字，曰：『為母者須自愛其身體』……良以兒女身體之健全，全胥視乎母之身體健全與否。母而不健全，則兒女斷難望其健全，故為母者對於一己，亦萬萬不可輕忽。」請問下列何者最接近此篇文章作者認為女性身負的責任？
  options:
  - label: A
    content: 成為盡責的公民並關心政治
  - label: B
    content: 保持身體健康以生養強壯的後代
  - label: C
    content: 增強體魄，參與軍隊報效國家
  - label: D
    content: 接受良好教育提升國民素質
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 關鍵為「兒女身體之健全……視乎母之身體健全與否」，代表唯有健康的母親，得以生養孕育強壯的下一代，故選(B)。
