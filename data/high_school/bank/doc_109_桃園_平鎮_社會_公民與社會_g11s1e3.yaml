  stem: '考前提醒：作答前請將電腦卡上的班級、姓名、座號填寫完成，若未完整填寫一律<u>扣總分5分</u>

    1. 時任農委會主委陳吉仲於訪問中表示，自110年元旦開始，只要業者張貼台灣豬標章，該肉品就必須全部都是國產，<u>若不是國產被農委會查到，將會依法開罰</u>。試問：題目中劃線處，符合下列何項原則？'
  options:
