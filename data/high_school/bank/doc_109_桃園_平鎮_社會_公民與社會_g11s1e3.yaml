  stem: 依照犯罪的構成要件，下列何種敘述是正確的
  options:
  - label: A
    content: 明確性：犯罪行為之相關法規範，應明確敘述其犯罪條件與處罰內容
  - label: B
    content: 違法性：為避免不法之侵害，可依避免緊急危難作為阻卻違法事由
  - label: C
    content: 該當性：主觀的意圖，並客觀的行為事實，符合相關法規的犯罪要件
  - label: D
    content: 有責怪：「心神喪失」是因具有精神疾病之就醫證明，以認定其為無責任能力人
