  stem: 據報載，某縣長向縣民鄉親保證：「保障民眾健康及吃的安全」是縣府責無旁貸的大事；縣府將持續嚴格執行「零檢出、要標示、設專區」等三項措施，捍衛民眾健康、嚴懲不肖業者，落實食品安全。惟行政院宣布萊豬政策中央地方統一規範與原則，並表示地方食安自治條例，凡訂有「乙型受體素一律不得檢出」規定者，因違反《憲法》並抵觸中央法規，自110年1月1日起無效。試間，該縣政府「零檢出」的措施，因違反下列何項原則而失效？
  options:
  - label: A
    content: 法律優越原則
  - label: B
    content: 法律保留原則
  - label: C
    content: 適合性原則
  - label: D
    content: 信賴保護原則
