  group_stem: 題 立法院於2019年5月底三讀修正通過《少年事件處理法》條文，司法院原訂於2019年6月19日施行，考量關於少年交付安置的過渡性教育措施以及刪除同法第85條之1有關觸犯刑罰法律兒童準用《少事法》的規定。總結本次修法重點為：廢除觸法兒童準用《少事法》規定、曝險少年去標籤、縮減司法介入事由、<u>建置曝險少年行政輔導先行機制</u>等等。依據上文，請回答下列問題：
