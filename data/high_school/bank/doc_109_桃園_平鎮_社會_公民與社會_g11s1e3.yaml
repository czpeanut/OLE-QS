  stem: 依照《刑事訴訟法》之規定，關於偵查程序之進行，下列何者正確？
  options:
  - label: A
    content: 依照「不告不理」原則，未經告訴之案件，檢察官不可自行敢動偵查程序
  - label: B
    content: 依照「偵查不公開」原則，面對媒體的提間，檢察官得行使「緘默權」
  - label: C
    content: 犯罪偵查階段，被告可以主張選任辯護人，於訊問期間要求辯護人到場
  - label: D
    content: 行為人於偵查啟動前，主動向檢警單位說明犯罪之發生，稱之為「投案」
