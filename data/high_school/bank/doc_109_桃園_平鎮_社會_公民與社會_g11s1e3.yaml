  type: single
  page: 1
  stem: 楊姓歌手以精湛的歌藝參加歌唱大賽，為使自己的年齡看起來符合其於報名時所填寫的就學狀況，製作假身份證謊報年齡，經人爆料後東窗事發主辦單位便依「偽造公文書罪」提告。試間，若檢芳調查後確有此事，但認為楊姓歌手有悔改之心且犯罪情節輕微，下列何種狀況「較不可能」發生？
  options:
  - label: A
    content: 提起公訴後，請求法官從輕量刑
  - label: B
    content: 因犯罪情節輕微，予以不起訴
  - label: C
    content: 予以緩起訴，但要求其勞動服務
  - label: D
    content: 判決緩刑2年，併科罰金2萬元
  group_stem: '2. 配合中央秋冬專案，南投縣衛生局重啟防疫宣導隊，針對8大類場域應佩戴口罩，同時加強取締宣導，將依所屬場所人潮擁擠採重點查核，經勸導不聽者依法處新台幣3000至1萬5000元以下罰鍰。請問下列敘述，何者正確？ (A)南投縣衛生局加強宣傳八六場所戴口罩的政策，是行政行為中的行政指導 (B)如不服勸導的民眾，可依法向行政院衛福部申訴，以救濟自身的權利 (C)依照罪疑唯輕原則，針對初犯的民眾應處最低金額3000元之罰緩 (D)南投縣衛生局針對於未符合規定之民眾開罰，未違反積極的依法行政原則

    3. 萊豬於2021年開放進口，行政院發言人在行政院會會後記者會上表示，自民國110年起每個上班日都會將國產豬屠宰量、進口豬肉量、進口豬查驗結果等資訊公開在衛褔部及農委會的網頁上，讓民眾感受政府把關食安的決心。依上文之敘述，政府此作法符合行政程序中的何項原則與其相關延伸權利？ (A)公正原則：閱覽卷宗權 (B)公開原則：陳述意見權 (C)公正原則：陳述意見權 (D)公開原則：閱覽卷宗權

    4. 《刑法》第353條毀棄損壞罪：「毀壞他人建築物、礦坑、船艦或致令不堪用者，處六個月以上五年以下有期徒刑。」若胖虎因忌妒小夫買了新的腳踏車，以棒球棍砸壞小夫的腳踏車，但是依據「○○」，小夫無法以《刑法》第353條提起告訴。請問對話框中的○○應填人下列何者？ (A)禁止類推適用 (B)禁止溯及既往 (C)禁止習慣法 (D)禁止不定期刑'
