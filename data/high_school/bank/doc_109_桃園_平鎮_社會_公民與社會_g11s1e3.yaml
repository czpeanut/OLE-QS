  stem: 就讀高二（16歲）的<u>阿炫</u>，因為不滿前女友<u>小蓉</u>（16歲）要與之分手，便召集好友<u>小智</u>（18歲）與<u>阿彥</u>（13歲）埋伏在<u>小蓉</u>回家的路上，並且圍毆<u>小蓉</u>以一吐怨氣。依照我國相關規定，下列敘述何者正確？
  options:
  - label: A
    content: <u>阿炫</u>與<u>小智</u>因有前科，會被視為「虞犯少年」，應接受感化輔導
  - label: B
    content: 為保護未成年的<u>阿炫</u>、<u>小蓉</u>與<u>阿彥</u>等人，採隔離訊間，不當面對質
  - label: C
    content: 阿炫的行為屬公訴罪，無論小蓉是否提告，皆由檢方追訴其行為
  - label: D
    content: 於審判期間，阿炫與阿彥的父母或監護人，有在場權與意見陳述權
