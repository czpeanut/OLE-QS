  group_stem: 報導一：中天新聞台執照將在109年12月中到期，NCC首度因換照而依法定程序召開(甲)，預計10月26日登場。(甲)議題關注中天新聞台前次承諾履行情形、內控機制，並討論換照案對國家安全、產業發展等影響。 報導二：國家通訊傳播委員會（NCC）決議對中天新聞台「不予換照」，中天電視聲請假處分遭台北高等行政法院駁回後提起抗告，最高行政法院於109年12月11日下午裁定駁回，中天新聞52台頻道確定在109年12月11日午夜12點走入歷史。
