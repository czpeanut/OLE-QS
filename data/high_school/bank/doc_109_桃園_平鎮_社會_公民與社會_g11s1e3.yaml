  stem: 小潘隨隊出國比賽，機場安檢時，戲稱：「我行李有炸彈」，迅即遭移送法辦。縱使小潘解釋此純屬玩笑，行李也查無炸彈，仍因散布危害飛航安全之不實訊息，已涉嫌犯罪而面臨法律制裁及當日無法隨隊出境之後果。依照我國相關法規，下列敘述何者正確？
  options:
  - label: A
    content: 小潘遭移送法辦後，將由司法院的檢察機關提起公訴
  - label: B
    content: 為了防止妨害他人自由，小潘個人的遷徙自由得受到限制
  - label: C
    content: 為了避免緊急危難，小潘個人的言論自由得受到限制
  - label: D
    content: 小潘的言論危害國家安全，屬於侵害國家法益之行為
  group_stem: '2. 配合中央秋冬專案，南投縣衛生局重啟防疫宣導隊，針對8大類場域應佩戴口罩，同時加強取締宣導，將依所屬場所人潮擁擠採重點查核，經勸導不聽者依法處新台幣3000至1萬5000元以下罰鍰。請問下列敘述，何者正確？ (A)南投縣衛生局加強宣傳八六場所戴口罩的政策，是行政行為中的行政指導 (B)如不服勸導的民眾，可依法向行政院衛福部申訴，以救濟自身的權利 (C)依照罪疑唯輕原則，針對初犯的民眾應處最低金額3000元之罰緩 (D)南投縣衛生局針對於未符合規定之民眾開罰，未違反積極的依法行政原則

