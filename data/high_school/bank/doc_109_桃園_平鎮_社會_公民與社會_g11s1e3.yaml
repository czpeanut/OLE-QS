  stem: 關於《少年事件處理法》之相關規定，下列何者正確？
  options:
  - label: A
    content: 觸法少年受審過程中，除可要求律師陪同，父母或監護人也具有在場權並發表意見
  - label: B
    content: 為避免少年遭到社會標籤化，少年輔導委員會會通知相關機關塗銷前科紀錄和資料
  - label: C
    content: 為求公平審理並且緩解觸法少年於過程中的情緒，少年觸法案件一律採取公開審理
  - label: D
    content: 以少年刑事事件處理的案件，會優先考量觸法背景，注重個別處遇做出不同的判決
