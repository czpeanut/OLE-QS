  stem: 已知 $10^{1.3617}$ ≈ 23，則下列選項哪些正確？
  options:
  - label: A
    content: log23 ≈ 1.3617
  - label: B
    content: log46 ≈ 2.7234
  - label: C
    content: $10^{0.3617}$ ≈ 2.3
  - label: D
    content: $23^{10}$ 為 14 位數
  - label: E
    content: $23^{－10}$ 化成小數後第 13 位開始不為 0
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：log23 ≈ $log10^{1.3617}$＝1.3617

    (B) ╳：∵$10^{1.3617}$ ≈ 23

    ∴（$10^{1.3617}$）$^{2}$ ≈ $23^{2}$ ⇒ $10^{2.7234}$ ≈ 529

    即 log529 ≈ 2.7234≠log46

    (C) ○：$10^{0.3617}$＝$\frac{10^{1.3617}}{10}$≈$\frac{23}{10}$＝2.3

    (D) ○：$23^{10}$ ≈ （$10^{1.3617}$）$^{10}$＝$10^{13.617}$＝$10^{0.617}$×$10^{13}$ ⇒ 14 位數

    (E) ╳：承(D)，$23^{－10}$＝（$23^{10}$）$^{－1}$＝$10^{－13.617}$＝$10^{0.383}$×$10^{－14}$

    ⇒ 小數點後第 14 位開始不為 0

    故選(A)(C)(D)'
