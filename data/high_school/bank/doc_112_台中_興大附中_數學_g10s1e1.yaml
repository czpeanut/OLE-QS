  answer_source: answer_key
  explanation: '(A) ○：∵｜x－1｜＝2 ⇒ x－1＝± 2 ∴x＝3 或－1

    (B) ╳：∵｜x－1｜＋｜x＋1｜≥｜1－（－1）｜＝2 ∴無解

    (C) ╳：當－1 ≤ x ≤ 1 時，｜x－1｜＋｜x＋1｜＝2

    ∴有無限多組解

    (D) ╳：反例：當 a＝－1 時，｜－x－1｜≤ 2 之解為－3 ≤ x ≤ 1

    並非$\frac{-1}{-1}$≤ x ≤$\frac{3}{-1}$

