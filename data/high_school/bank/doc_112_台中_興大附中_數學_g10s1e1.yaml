  stem: 設 x，y 為實數，｜x－7｜＜4，｜y－4｜＜2，使｜xy－40｜＜k 成立之最小 k 值為何？
  options:
  - label: A
    content: '18'
  - label: B
    content: '26'
  - label: C
    content: '34'
  - label: D
    content: '40'
  - label: E
    content: '66'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}| x-7 | < 4 \\ | y-4 | < 2\end{cases}$⇒$\begin{cases}-4<x-7< 4 \\ -2<y-4< 2\end{cases}$⇒$\begin{cases}3 <x < 11 \\ 2 <y < 6\end{cases}$

    ⇒ 6＜xy＜66

    ⇒－34＜xy－40＜26

    得｜xy－40｜＜34 ⇒ 最小 k 值為 34

    故選(C)'
