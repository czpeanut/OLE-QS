    content: ｜x－1｜＝2 恰有 2 個解
  - label: B
    content: ｜x－1｜＋｜x＋1｜＝1 恰有 2 個解
  - label: C
    content: ｜x－1｜＋｜x＋1｜＝2 恰有 2 個解
  - label: D
    content: 若 a 為非零實數，則｜ax－1｜≤ 2 的解為$\frac{-1}{a}$ ≤ x ≤$\frac{3}{a}$
  - label: E
    content: 承(D)，｜ax－1｜≤ 2 和｜－ax＋1｜≤ 2 的解相同
