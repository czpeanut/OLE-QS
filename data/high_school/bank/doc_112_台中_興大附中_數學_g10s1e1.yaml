  - label: B
    content: '61'
  - label: C
    content: '69'
  - label: D
    content: '75'
  - label: E
    content: '78'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '使用長除法如右，得$\frac{166}{495}$＝$0.3\overline{35}$

    ⇒ $a_{1}$＝3，$a_{2}$＋$a_{3}$＝$a_{4}$＋$a_{5}$＝……＝$a_{18}$＋$a_{19}$＝8

    又 $a_{20}$＝3

    故 $a_{1}$＋$a_{2}$＋……＋$a_{20}$＝3＋8×9＋3＝78

    故選(E)'
