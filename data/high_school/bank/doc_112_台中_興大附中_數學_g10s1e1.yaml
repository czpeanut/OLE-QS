- id: doc_112_台中_興大附中_數學_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 一位 Nikola Slavkovic 的科學愛好研究家在 youtube 影片中表示，若一張紙厚度約 0.0001 公尺，紙對折一次，厚度翻倍，以此推論得到，對折 30 次大約 100 公里高的厚度。已知地球距離月球 384400 公里，根據 Nikola Slavkovic 的推論，請問最少對折幾次可以超過地球到月球的距離？
  options:
  - label: A
    content: '40'
  - label: B
    content: '42'
  - label: C
    content: '44'
  - label: D
    content: '46'
  - label: E
    content: '48'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意知 0.0001×$2^{30}$×$\frac{1}{1000}$≈ 100 公里

    且對折 k 次後的厚度為 0.0001×$2^{k}$×$\frac{1}{1000}$公里

    令 0.0001×$2^{k}$×$\frac{1}{1000}$＝384400 公里

    ⇒$\left( 0.0001\times 2^{30}\times \frac{1}{1000} \right) \times 2^{k-30}=384400$⇒ $2^{k－30}$ ≈ 3844

    又 $2^{11}$＝2048＜3844＜4096＝$2^{12}$

    ∴11＜k－30＜12 ⇒ 41＜k＜42

    最少對折 42 次

    故選(B)'
