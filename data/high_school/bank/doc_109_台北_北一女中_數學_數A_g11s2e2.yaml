- id: doc_109_台北_北一女中_數學_數A_g11s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 直線 L：$\frac{x-1}{1}=\frac{y-2}{2}=\frac{z-3}{3}$，請從下列選項中選出其圖形與直線 L 相同者？
  options:
  - label: A
    content: $L_{1}$：$\frac{x-2}{1}=\frac{y-4}{2}=\frac{z-6}{3}$
  - label: B
    content: $L_{2}$：$\frac{x-1}{1}=\frac{y-3}{2}=\frac{z-5}{3}$
  - label: C
    content: $L_{3}$：$\begin{cases}\frac{x}{1}=\frac{y}{2} \\ \frac{y}{2}=\frac{z}{3}\end{cases}$
  - label: D
    content: $L_{4}$：$\begin{cases}x-2y+z=0 \\ 2x-y=0\end{cases}$
  - label: E
    content: $L_{5}$：$\begin{cases}x=t \\ y=2t , t\in R \\ z=3t\end{cases}$
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵L：$\frac{x-1}{1}=\frac{y-2}{2}=\frac{z-3}{3}$，過 P（1，2，3）且$\vec{L}=(1 , 2 , 3)$

    (A) ○：將 P（1，2，3）代入 $L_{1}$：$\frac{1-2}{1}=\frac{2-4}{2}=\frac{3-6}{3}$，成立

    ∴P ∈ $L_{1}$，又$\vec{L_{1}}=(1 , 2 , 3)=\vec{L}$ ∴L＝$L_{1}$

    (B) ╳：將 P（1，2，3）代入 $L_{2}$：$\frac{1-1}{1}\neq \frac{2-3}{2}$，不成立

    ∴P$\notinL_{2}$ ∴L≠$L_{2}$

    (C) ○：$L_{3}$：$\begin{cases}\frac{x}{1}=\frac{y}{2}\cdots \cdots \cdots \cdots \cdots ① \\ \frac{y}{2}=\frac{z}{3}\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①，②得 $L_{3}$：$\frac{x}{1}=\frac{y}{2}=\frac{z}{3}$

    將 P（1，2，3）代入 $L_{3}$：$\frac{1}{1}=\frac{2}{2}=\frac{3}{3}$，成立

    ∴P ∈ $L_{3}$，又$\vec{L_{3}}=(1 , 2 , 3)=\vec{L}$ ∴L＝$L_{3}$

    (D) ○：$L_{4}$：$\begin{cases}E_{1} : x-2y+z=0 \\ E_{2} : 2x-y=0\end{cases}$

    將 P（1，2，3）代入 $E_{1}$：1－2×2＋3＝0 ∴P ∈ $E_{1}$

    將 P（1，2，3）代入 $E_{2}$：2×1－2＝0 ∴P ∈ $E_{2}$

    又$\vec{n_{1}}=(1 , -2 , 1)$，$\vec{n_{2}}=(2 , -1 , 0)$

    ∴$\vec{n_{1}}\times \vec{n_{2}}$＝（1，－2，1）×（2，－1，0）

    ＝$\left( \left| \begin{matrix}-2 & 1 \\ -1 & 0\end{matrix} \right| , \left| \begin{matrix}1 & 1 \\ 0 & 2\end{matrix} \right| , \left| \begin{matrix}1 & -2 \\ 2 & -1\end{matrix} \right| \right)$＝（1，2，3）＝$\vec{L}$

    ∴L＝$L_{4}$

    (E) ○：$L_{5}$：$\begin{cases}x=t \\ y=2t \\ z=3t\end{cases} , t\in R$

    當 t＝1 時，$L_{5}$ 過（x，y，z）＝（1，2，3）

    又$\vec{L_{5}}=(1 , 2 , 3)=\vec{L}$ ∴L＝$L_{5}$

    故選(A)(C)(D)(E)'
