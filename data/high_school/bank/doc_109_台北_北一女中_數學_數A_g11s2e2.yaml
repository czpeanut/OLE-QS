  page: 2
  stem: '(1) 經過點 A（－2，1，2），B（0，1，4），C（1，2，3）之平面方程式為＿＿＿＿。

    (2) 經過點 A（－1，0，0），B（0，1，0），且與平面 E：x－y＝0 夾 45°的平面 F：＿＿＿＿。'
  answer:
  - (1) x－2y－z＋6＝0；(2)$x-y+\sqrt{2}z+1=0$或$x-y-\sqrt{2}z+1=0$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ∵A（－2，1，2），B（0，1，4），C（1，2，3）

    ∴$\vec{AB}=(2 , 0 , 2)$，$\vec{AC}=(3 , 1 , 1)$

    ∴$\vec{AB}\times \vec{AC}$＝（2，0，2）×（3，1，1）＝$\left( \left| \begin{matrix}0 & 2 \\ 1 & 1\end{matrix} \right| , \left| \begin{matrix}2 & 2 \\ 1 & 3\end{matrix} \right| , \left| \begin{matrix}2 & 0 \\ 3 & 1\end{matrix} \right| \right)$＝（－2，4，2）

    ＝－2（1，－2，－1）

    取$\vec{n}$＝（1，－2，－1）

    令平面 ABC：x－2y－z＝k 過 A（－2，1，2） ∴k＝－2－2－2＝－6

    ∴x－2y－z＋6＝0

    (2) ∵A（－1，0，0），B（0，1，0） ∴$\vec{AB}=(1 , 1 , 0)$

    ∴$\overset{\leftarrow \rightarrow}{AB}$：$\frac{x-(-1)}{1}=\frac{y-0}{1}$且 z＝0 ∴x－y＋1＝0 且 z＝0

    因此，通過$\overset{\leftarrow \rightarrow}{AB}$的平面 F：（x－y＋1）＋kz＝0 ∴$\vec{n_{F}}=(1 , -1 , k)$

    又 E：x－y＋0．z＝0 ∴$\vec{n_{E}}=(1 , -1 , 0)$

    ∴cos45°＝$\frac{│ \vec{n_{E}} \cdot \vec{n_{F}} │}{│ \vec{n_{E}} │ \times │ \vec{n_{F}} │}$ ∴$\frac{1}{\sqrt{2}}=\frac{│ (1 , -1 , 0) \cdot (1 , -1 , k) │}{\sqrt{1^{2}+(-1)^{2}+0^{2}}\times \sqrt{1^{2}+(-1)^{2}+k^{2}}}$＝$\frac{2}{\sqrt{2}\times \sqrt{k^{2}+2}}$

    ∴$k^{2}$＋2＝4 ∴$k=\pm \sqrt{2}$

    ∴平面 F：$x-y+\sqrt{2}z+1=0$或$x-y-\sqrt{2}z+1=0$'
