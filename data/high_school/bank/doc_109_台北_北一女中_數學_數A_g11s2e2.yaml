- id: doc_109_台北_北一女中_數學_數A_g11s2e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 2
  stem: 空間坐標中四點 A（1，3，－2），B（2，－2，1），C（3，1，2），D（6，2，k），請選出下列正確的敘述？
  options:
  - label: A
    content: 若 A，B，C，D 四點共面，則 k＝7
  - label: B
    content: 若四面體 D－ABC 的體積為 8 且 k＞10，則 k＝13
  - label: C
    content: 平面 ABC 的方程式為 7x－y－4z－12＝0
  - label: D
    content: △ABC 的面積為$\sqrt{66}$
  - label: E
    content: 若點 D 至平面 ABC 的距離為$\sqrt{66}$且 k＞0，則$k=\frac{47}{2}$
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：先求平面 ABC：A（1，3，－2），B（2，－2，1），C（3，1，2）

    ∴$\vec{AB}=(1 , -5 , 3)$，$\vec{AC}=(2 , -2 , 4)$

    $\vec{AB}\times \vec{AC}$＝（1，－5，3）×（2，－2，4）＝$\left( \left| \begin{matrix}-5 & 3 \\ -2 & 4\end{matrix} \right| , \left| \begin{matrix}3 & 1 \\ 4 & 2\end{matrix} \right| , \left| \begin{matrix}1 & -5 \\ 2 & -2\end{matrix} \right| \right)$

    ＝（－14，2，8）＝－2（7，－1，－4）

    取$\vec{n}=(7 , -1 , -4)$

    令平面 ABC：7x－y－4z＝t 過（1，3，－2）

    ∴t＝7－3＋8＝12 ∴平面 ABC：7x－y－4z－12＝0

    過 D（6，2，k）

    ∴42－2－4k－12＝0 ∴4k＝28 ∴k＝7

    (B) ○：∵四面體 D－ABC 體積＝$\frac{1}{3}\times \triangle ABC 面積\times d(D , 平面 ABC)$

    ∴$8=\frac{1}{3}\times \frac{1}{2} │ \vec{AB} \times \vec{AC} │ \times \frac{│ 42-2-4k-12 │}{\sqrt{7^{2}+(-1)^{2}+(-4)^{2}}}$

    ∴48＝$│ (-14 , 2 , 8) │ \times \frac{│ 28-4k │}{\sqrt{66}}$＝$\sqrt{(-14)^{2}+2^{2}+8^{2}}\times \frac{│ 28-4k │}{\sqrt{66}}$＝8│7－k│

    ∴6＝｜7－k｜ ∴k－7＝6 或－6

    ∵k＞10 ∴k＝13

    (C) ○：由(A)知平面 ABC：7x－y－4z－12＝0

    (D) ○：△ABC 面積＝$\frac{1}{2} │ \vec{AB} \times \vec{AC} │$＝$\frac{1}{2} │ (-14 , 2 , 8) │$＝｜（－7，1，4）｜

    ＝$\sqrt{(-7)^{2}+1^{2}+4^{2}}$＝$\sqrt{66}$

    (E) ○：∵$\sqrt{66}$＝d（D，平面 ABC）＝$\frac{│ 42-2-4k-12 │}{\sqrt{7^{2}+(-1)^{2}+(-4)^{2}}}$ ∴66＝｜28－4k｜

    ∴33＝｜2k－14｜ ∴2k－14＝33 或－33

    ∵k＞0 ∴$k=\frac{47}{2}$

    故選(A)(B)(C)(D)(E)'
