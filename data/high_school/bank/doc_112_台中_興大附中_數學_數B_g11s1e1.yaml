  - C
  answer_status: verified
  answer_source: answer_key
  explanation: ($\frac{1}{3}$)$^{2x}$＝($3^{\frac{3}{2}}$)$^{x＋1}$＝$3^{\frac{3}{2}(x+1)}$ ＝$3^{－2x}$ ⇒－2x＝$\frac{3}{2}$(x＋1) ∴ x＝－$\frac{3}{7}$
