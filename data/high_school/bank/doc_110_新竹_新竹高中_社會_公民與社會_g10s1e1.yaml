  group_stem: ◎根據聯合國的「甲公約」，各國政府已經承諾並且確認法律上保障18歲以上才具備成人行為能力，而女性在18歲以前結婚就是「童婚」，發生率較高的地區是南亞、撒哈拉以南非洲、拉丁美洲和加勒比地區，儘管這些地區「童婚」是不合法的，但仍無法改善這樣的現象。據聯合國調查，全球各地有超過7億起童婚案例，其中不乏8、9歲、甚至年紀更小的女性。由於結婚對象往往比自己年長許多，性經驗較為豐富、通常又不願意使用保險套，童婚小新娘有很高機率被丈夫傳染愛滋與其他性病，尚未發育完全的幼小軀體在性交與生產的過程中，也非常可能因為細菌感染、大量出血而死亡。婚後她們便無法再受教育，也很難經濟獨立，即使遭到家暴也無法逃跑，甚至有些地區禁止寡婦再婚，她們只能一輩子依附夫家，不再是人，而是物品。
