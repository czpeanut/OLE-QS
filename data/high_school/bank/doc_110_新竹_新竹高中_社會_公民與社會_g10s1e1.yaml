  stem: 「資料一」的(甲)畫線處，最主要是國家哪項構成要素的展現？
  options:
  - label: A
    content: 人民
  - label: B
    content: 領土
  - label: C
    content: 政府
  - label: D
    content: 主權
  group_stem: '◎1867年，美籍商船羅妹號（Rover）遭逢海難，遇難船員誤闖位於恆春半島的瑯嶠十八社所在地，因而使得美藉船長等13人先後遭到殺害。當時擔任美國駐廈門領事李仙得（Charles W. Le Gendre）得知消息後，就要求清廷依1858年《中美天津條約》的第十一款與第十三款的規定，負起船難救護與逮捕凶手的責任。

    資料一：1858年《中美天津條約》的第十一款與第十三款規定

    第十一款

    大合眾國民人在中華安分貿易辦事者，當與中國人一體和好友愛，地方官必時加保護，務使身家一切安全，不使受欺辱騷擾等事。倘其屋宇、產業有被內地不法匪徒逞凶恐嚇、焚毀侵害，一經領事官報明，地方官立當派撥兵役彈壓驅逐，並將匪徒查拿，按律重辦。<u>(甲)倘華民與大合眾國人有爭鬥、詞訟等案，華民歸中國官按律治罪；大合眾國人，無論在岸上、海面，與華民欺侮騷擾、毀壞物件、毆傷損害一切非禮不合情事，應歸領事等官按本國例懲辦。</u>至捉拿犯人以備質訊，或由本地方官，或由大合眾國官，均無不可。

    第十三款

    大合眾國船隻在中國洋面遭風觸礁擱淺，遇盜致有損壞等害者，該處地方官一經查知，即應設法拯救保護，並加撫恤，俾得駛至最近港口修理，並準其採買糧食、汲取淡水。倘商船有在中國所轄內洋被盜搶劫者，地方文武員弁一經聞報，即當嚴拿賊盜，照例治罪，起獲原贓，無論多寡，或交本人，或交領事官俱可，但不得冒開失單。至中國地廣人稠，萬一正盜不能緝獲，或起贓不全，不得令中國賠還貨款。倘若地方官通盜沾染，一經證明，行文大憲奏明，嚴行治罪，將該員家產抄抵償。

    但臺灣總兵劉明燈與道員吳大廷收到下屬參將和知縣的調查報告後，告知李仙得：

    資料二：節錄〈同治朝籌辦夷務始末〉卷五十

    （恆春半島）其地盡係生番，並無通事，鳥道羊腸，箐深林密，係在生番界內，其行劫之兇犯又係生番，並非華民，該處既未收入版圖，且為兵力所不及，委難設法辦理。

    李仙得對清廷消極的處理態度又失望又憤怒，決定出兵捉拿瑯嶠十八社的犯人，但戰敗撤退。而後，李仙得採取外交手段，繞過清廷，自行與瑯嶠十八社大股頭卓杞篤談判，雙方達成「諒解備忘錄」，約定將來若有遭遇海難之船隻，將以紅旗為信號，在岸邊求援，不會私自侵擾聚落，卓杞篤則答應給予救援和保護。後人稱此為「南岬之盟」。'
