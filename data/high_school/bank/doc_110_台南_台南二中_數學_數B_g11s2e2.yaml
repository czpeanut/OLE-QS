- id: doc_110_台南_台南二中_數學_數B_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設A、B、C是同階矩陣，r、s是實數，請選出正確的選項？
  options:
  - label: A
    content: $A+B=B+A$
  - label: B
    content: $AB=BA$
  - label: C
    content: $(A+B)+C=A+(B+C)$
  - label: D
    content: $(AB) C=A (BC)$
  - label: E
    content: $r (sA)=(rs)A$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○。

    (B) ×：要考慮是否可乘，交換律也不一定成立。

    (C) ○。

    (D) ×：要考慮是否可乘， 例：$\left[ \begin{matrix}1 & 0 & 3 \\ 0 & 2 & 1\end{matrix} \right]\left[ \begin{matrix}-1 & 1 & 0 \\ 2 & 0 & 0\end{matrix} \right]$。

    (E) ○。

    選(A)(C)(E)。'
- id: doc_110_台南_台南二中_數學_數B_g11s2e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 請選出使矩陣$A=\left[ \begin{matrix}a_{1} & a_{2} \\ a_{3} & a_{4}\end{matrix} \right]$不可逆的選項？
  options:
  - label: A
    content: $a_{1}+a_{4}=a_{2}+a_{3}$
  - label: B
    content: $|a_{1}a_{4}| = |a_{2}a_{3}|$
  - label: C
    content: 數列$\left\langle a_{n} \right\rangle$為等差數列
  - label: D
    content: 數列$\left\langle a_{n} \right\rangle$為等比數列
  - label: E
    content: 數列$\left\langle a_{n} \right\rangle$滿足$\begin{cases}a_{1}=1, a_{2}=2 \\ a_{n+2}=a_{n}\times a_{n+1}\end{cases}$，n為正整數
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$A=\left[ \begin{matrix}a_{1} & a_{2} \\ a_{3} & a_{4}\end{matrix} \right]$不可逆 ⇔ $\mathrm{det}A=\left[ \begin{matrix}a_{1} & a_{2} \\ a_{3} & a_{4}\end{matrix} \right] =a_{1}a_{4}-a_{2}a_{3}=0$，相當於$\frac{a_{1}}{a_{3}}=\frac{a_{2}}{a_{4}}$。

    (B) ×：$|a_{1}a_{4}| = |a_{2}a_{3}|$ ⇔ $a_{1}a_{4}$＝±$a_{2}a_{3}$。

    (D) $\left\langle a_{n} \right\rangle$為等比數列 ⇒ $\frac{a_{2}}{a_{1}}=\frac{a_{4}}{a_{3}}$ (＝公比)。

    (E) ○：$a_{1}$＝1，$a_{2}$＝2 ⇒ $a_{3}$＝1×2＝2，$a_{4}$＝2×2＝4。

    故選(D)(E)。'
- id: doc_110_台南_台南二中_數學_數B_g11s2e2_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 設A、B、C皆為n階方陣，$I_{n}$為n階單位方陣，$O_{n}$為n階零方陣，選出正確的選項？
  options:
  - label: A
    content: 若AB＝$O_{n}$且A≠$O_{n}$，則B＝$O_{n}$
  - label: B
    content: 若A＋B＝C，則AB＋$B^{2}$＝BC
  - label: C
    content: 若AB＝$I_{n}$＝BA且AC＝$I_{n}$＝CA，則B＝C
  - label: D
    content: 若$A^{2}$＝$I_{n}$，則A＝$A^{－1}$
  - label: E
    content: 若AC＝$I_{n}$＝CA，則 ( ABC )$^{n}$＝$AB^{n}$C
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ×：當det A≠0時才能成立。

    (B) ×：(A＋B)B＝CB， AB＋$B^{2}$＝CB不一定等於BC。

    (C) ○：AB＝$I_{n}$＝BA得B＝$A^{－1}$， AC＝$I_{n}$＝CA得C＝$A^{－1}$ ∴B＝C

    (D) ○：$A^{2}$＝$I_{n}$即AA＝$I_{n}$ ∴A＝$A^{－1}$

    (E) ○：n＝1時，成立 設n＝K時，( ABC )$^{K}$＝$AB^{K}$C 於n＝K＋1時， ( ABC )$^{K＋1}$＝( ABC )$^{K}$( ABC )＝( $AB^{K}$C )( ABC )＝$AB^{K}$( CA ) BC＝$AB^{K}$BC＝$AB^{K＋1}$C ∴( ABC )$^{n}$＝$AB^{n}$C

    另解：AC＝$I_{n}$＝CA ⇒ C＝$A^{－1}$ ( ABC )$^{n}$＝( ABC )( ABC )…( ABC ) ＝( $ABA^{－1}$)( $ABA^{－1}$)…( $ABA^{－1}$) ＝( $AB^{2}A^{－1}$)…( $ABA^{－1}$) $⋮$ ＝$AB^{n}A^{－1}$ ＝$AB^{n}$C

    選(C)(D)(E)。'
