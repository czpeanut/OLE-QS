  section: 3
  number: 58
  type: single
  page: 8
  stem: 上述 3 則資料所談論的應是清初在臺實施的何項政策？
  options:
  - label: A
    content: 《渡臺禁令》
  - label: B
    content: 一田二主
  - label: C
    content: 劃界封山
  - label: D
    content: 清丈土地
  group_stem: '請依據以下資料回答：

    資料一：清帝國為盡可能以低稅的方式來治理臺灣，於是選擇減少其文官與軍隊官僚的支出。在強調政治安定的治國政策下，統治初期面對戲劇化人口成長的壓力，實施的隔離政策看似是不近人情的統治手段，實則是寓涵深遠的思考。

    資料二：從官方的角度來說，漢籍移民是侵入者，破壞臺灣自給自足的現狀，故實施限制移民的隔離政策。為了保障熟番的土地，實施漢人承租熟番土地的政策，並雇用熟番來對抗漢人的叛亂與生番獵人頭等入侵行為，好維持現狀。

    資料三：中國為避免臺灣成為反叛者的聚居之地，提出限制移民的隔離政策。博學的清朝官員，有鑑於宋朝政府在急進開墾西南邊境失敗後，隨即頒布禁止漢籍墾民購買當地住民土地的命令，豎立界碑在漢番之間，方能維持邊境長久的安定。'
  answer:
  - C
