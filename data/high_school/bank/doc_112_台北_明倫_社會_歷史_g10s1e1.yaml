  answer_source: answer_key
  explanation: '從圖來看，移民人數增加最多的時段應是(D) 1935 ～ 1940 年間。

    55.1930 年代正值日本政府大力推行南進政策時期，臺灣亦是南進的目標之一，因此有大量移民遷進臺灣，除原本的花東一帶，西部平原亦於此時設置移民村，(B)為正解。(A)太平洋戰爭之前，臺灣尚未正式被捲入戰火裡，無需大量日軍駐防。(C)此時期並沒有大地震造成嚴重損害而需要安置災民。(D) 1906 年，非此時人口增加的原因。

    56.兩則資料皆是從語言學角度切入討論南島語系，因此(B)為正解。

    57.(A)為正解。(B)從題文資料無法判斷。(C)資料二認為臺灣才是南島語系的起源。(D)僅達悟族與菲律賓巴丹島原住民相關。

    58.3 則資料皆提到「隔離政策」，可推知是清初對臺灣原住民實施的(C)劃界封山制度，將漢人與番民隔離。(A)限制來臺移民人數，並非將臺灣隔離。(B)清初西部平原開發造成的結果，非朝廷政策。(D)劉銘傳來臺後的推行的經濟措施。

    59.從資料一「在強調政治安定的治國政策下」一句，即可推知實施隔離政策最主要的目的是(C)維持治安。

    60.3 則資料都是從「清帝國」、「官方」、「中國大陸」的角度思考，故答案為(A)清政府。'
