- id: doc_112_台北_明倫_社會_歷史_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 羅妹號事件後，負責善後的美方外交官李仙得被日本聘為顧問，李仙得的經驗與建議後來成為牡丹事件時日軍侵臺的主要藉口。上述所謂「李仙得的經驗與建議」主要是指什麼？
  options:
  - label: A
    content: 清廷駐臺軍隊裝備不佳，不可能是日軍對手
  - label: B
    content: 中國政教不及臺灣番地，不必考慮主權爭議
  - label: C
    content: 臺灣地理位置重要，許多國家亟思謀取臺灣
  - label: D
    content: 臺灣原住民族天性純樸，與之談判易取得優勢
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '李仙得來臺為羅妹號事件善後，在與臺灣官員交手後得到「番地無主論」的結論，表示臺灣番地並不歸屬清廷管轄，此也成為日後日軍侵臺的遠因，答案為(B)。

    7.1641 年臺灣正值荷西統治時期，甲方帶著山豬與果實，應為臺灣的原住民族，乙方則可能為荷蘭或西班牙的殖民者，(A)為正解。

    8.題文所述為滯緬國軍，於 1954、1961 年兩次撤回臺灣，桃園中壢的(A)忠貞新村即其中一個安置處。

    9.題文指稱這位曾投靠明朝政府，後又投降清軍，終遭清軍殺害的海商，即為鄭成功的父親(B)鄭芝龍。

    10.從不給漢人土地所有權、對漢人課徵重稅、對漢人生活的種種限制，即可推知此為荷蘭人在臺灣的統治手段，因此這場反抗荷蘭統治的亂事為(B)郭懷一事件。(A)荷治時期與原住民的衝突事件。(C)(D)清治前期的民變。

    11.粵籍客家移民的鄉土神明為(C)三山國王。(A)(B)為閩籍移民的鄉土神。(D)為不分族群的共同信仰。

    12.日治時期，桃竹苗地區的客家人口逐漸攀升，但臺北盆地的客家人比例卻比清治時期逐漸下降，由於清廷與日本政府並未刻意遷走臺北的客家人，排除(A)選項，對外戰爭或瘟疫流行，不可能只有客家人口受到影響，(C)(D)亦可刪，因此最可能的原因為(B)閩客械鬥的結果，客家人在械鬥中落敗而離開臺北盆地。

    13.「福佬客」指以福佬話作為主要語言的客家人，(A)(B)(C) 3 地皆為客家族群聚集的地區，當地客家人不可能以福佬話作為主要語言，因此答案為(D)彰化田中。

    14.(C)為正確的敘述。(A)契約移民與自由移民為性質不同，與資產多寡無關。(B)日籍移民主要從事農業。(D)亦有少數的私營移民。

    15.1945 年為中日戰爭結束，此時國府帶著部分軍民來臺接收，人口理應增加卻出現小減狀況，代表有部分人口離開臺灣，此時被迫離開臺灣的人為日本僑民；1949 年前後國共內戰結束，戰敗的國民黨帶著大量軍民遷移到臺灣來，是造成臺灣人口遽增的主因，(D)為正解。

    16.從「利用信仰方式輔助治理」、「定期舉行會議」、「頒予頭目象徵統治權力的權杖」等敘述，即可推知此為(B)荷蘭東印度公司在臺施行的地方會議制度，其中的「信仰」指傳教士藉由傳播基督教懷柔原住民。

    17.從題文來看，這位原住民願意與官府往來，但又不願意完全配合官府的命令，其行為應介於生番與熟番之間，故屬於(A)化番。

    18.Kawas 認同部落主義的理念，因此他不可能鼓勵部落的老年人去學習漢人語文、部落青年移居都市，(A)(B)可刪除。他可能贊成設置「原住民族保留區」，但不應禁止非原住民族進入其中，而是讓更多人去了解部落的文化，故答案應選(D)。

    19.1731 年為清領前期，題文中所指的大規模抗官事件為大甲西社事件，主要原因是原住民遭漢人侵墾土地，又受到通事、官吏剝削欺壓，被迫群起反抗，(A)為正解。

    20.(A)阿美族為東部的高山族，並非分布在臺灣各沿海地區。(B)日本政府並未遷移阿美族人至北部工作。(C)「集團移住」計畫主要是將部落從山區移至附近平原，不至於將阿美族從花蓮移到基隆，因此正確答案為(D)。

    21.高砂義勇隊為 1942 年後日本所徵集的原住民軍隊，題文中的家書可能於 1942 ～ 1945 年間寄出，當時出現在家書裡的內容最可能為(D)，在戰爭期間缺乏勞動力，女性也被徵調取代男性勞動。(A) 1910 年代。(B) 1908 年。(C) 1915 年後。

    22.澎湖於元朝時設立巡檢司，正式納入版圖；明朝鑑於海盜肆虐，實施海禁與墟澎政策，但效果不彰；鄭經時正式在澎湖設立安撫司，因此題文中所指的文書應為真，(D)為正解。

    23.加禮宛事件為(B)撒奇萊雅族與噶瑪蘭族聯合反清的抗官事件，失敗後部落被滅，倖存族人因此寄居於阿美族之下，以火神祭名義偷偷祭祀祖靈，直至 2007 年才正名成功。

    24.從題文敘述來看，乙族群勢力不敵甲族群而選擇離開，但也有部分乙族群選擇與甲族群合作，因此可推知甲族群應為漢人，乙族群則是土地被侵墾的平埔族，(C)為正解。

    25.日治初期，對山地原住民原採取隔離政策，在原住民活動區域設置隘勇線，阻絕原住民族對外交通，直至佐久間左馬太總督上任後，才開始積極「理蕃」，鼓勵日本企業開發蕃地，故答案為(D)。

    26.(C)伊能嘉矩深入部落實地調查，從居住地區、語言及風俗文化劃分「4 群 8 族 21 部」，將臺灣原住民族首次科學分類。

    27.(A)林圯埔地名源自鄭成功的參軍林圯率眾入水沙連拓墾，後因土番不服來襲，林圯寡不敵眾而被圍殺，墾民為紀念林圯開墾之功，故將其命名為林圯埔。(B)(D)與清朝土牛堆有關。(C)荷治時期已有的地名。

    28.林朝棟來自霧峰林家，曾參與的戰事為清法戰爭，(A)為正解。(B)荷治時期的抗荷事件。(C)(D)為林文察的軍功。

    29.資料中建議國君利用臺灣優勢好好培養自身實力，將來定能與中原政權競爭，因此可推知此政權應為以臺灣為反清復明基地的(C)鄭氏政權。

    30.「在地化」即指發展出具有臺灣本土特色，與中國大陸不同，(A)為正解。(B)開臺祖祭祀。(C)相較於移墾社會，在地化社會較為穩定。(D)與中國大陸原鄉疏離，轉而認同本土。

    31.《熱蘭遮城日誌》記載的是荷蘭治臺時期的相關事蹟，(D)為正解。(甲)為荷蘭治臺之前事蹟。

    32.(A)鄭氏政權採「寓兵於農」政策，士兵也需下田開墾。(B)此為荷治時期的現象。(C)鄭氏下令不得侵墾臺灣原有住民的土地。(D)為正解。

    33.日治初期，臺日通婚者甚少，直至一次大戰後，日本政府標榜「內臺融合」與一視同仁原則，臺日通婚才逐漸增多。由於臺灣與日本的戶籍體系不同，因此日本女性與臺灣男性無法擁有實際的婚姻關係，此問題直到 1932 年才解決，故而題文的報紙應發行於 1932 年後，答案為(D)。

    34.(C)為正解。(A)移民多來自日本九州。(B)應是彰化地區。(D)以花蓮、臺東為主要移民地。

    35.張讓與張光明的曾祖父是兄弟，表示兩人的血緣相同，語言與風俗習慣差異應不大，但兩者卻分別被歸類為外省族群與本省閩南族群，主要原因是(A)來臺時間不同。

    36.「灣生」富永勝出生於花蓮(B)吉野村，2007 年來臺訪問時即想回到故鄉尋根，當地今已改名為吉安鄉。

    37.(C)為正解。(A)開墾新竹東南山區。(B)在板橋發跡的林家，並非客家人。(D)開墾臺北盆地。

    38.佐久間左馬太總督上任後，於 1910 年開始「五年理蕃計畫」，以武力鎮壓不願歸順的原住民族，其中(B)太魯閣族抵抗最為頑強，也是最後順服總督府的原住民族，但經過太魯閣戰役後，部落被「集團移住」他地，人數也大為減少。

    39.17 世紀的臺灣北部地區，除了原住民之外，還曾先後受到西班牙與荷蘭人的統治，因此欲更加全面了解題文所述的時代狀況，至少應掌握(甲)(乙)(丙) 3 種語言，答案為(A)。

