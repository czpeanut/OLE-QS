  stem: 「1966 年，前總統夫人蔣宋美齡，身著旗袍與高跟鞋踏上國境邊陲。她見到身穿丁字褲的達悟族人衣不蔽體，立即要求募集衣物給達悟族人穿上。接著，她又見族人住在半穴居地下屋中，她即貫徹某項政府計畫的思維，由省政府拆除蘭嶼的傳統建築，輔導興建兩房一廳的國宅。取而代之的水泥房一到夏日如同烤爐，甚至還存在著海砂屋問題。」從上述內容判斷，蔣宋美齡所貫徹的「某項政府計畫」為何？
  options:
  - label: A
    content: 定耕農業計畫
  - label: B
