  group_stem: '南島語族的研究最近頗為熱門，請根據下列資料回答：

    資料一：歐洲的印歐語系直到近代才開始向海外擴張，在此之前，南島語族是世界上分布範圍最廣的族群。南島語族共有 959 個語言，可以分成 4 個亞群，其中獨大的是「馬玻亞群」，包括 945 個南島語。整個南島語系的地理範圍，幾乎都由馬玻亞群獨領風騷。

    資料二：南島語系其他 3 個亞群的分布大致重疊，整體而言比馬玻亞群小很多。只有距華南海岸 150 公里遠的臺灣島上，還有族群使用這些語言。…… 4 個南島語亞群中有 3 個可以在臺灣找到，可見臺灣是南島語族的故鄉。'
