  stem: 大豹溪一帶（今新北市三峽區）原是泰雅族大豹社居住地。20 世紀初，臺灣總督府派軍隊前往該地，將大豹社迫遷到詩朗、志繼等部落（今桃園市復興區）。最可能的原因是什麼？
  options:
  - label: A
    content: 總督府設立「蕃童教育所」，要大豹社族人接受新式教育
  - label: B
    content: 日本政府讓財團開發樟腦業，將大豹社族人驅離部落領域
  - label: C
    content: 總督府正興建桃園大圳，需要徵調大豹社原住民充當勞力
  - label: D
    content: 日本準備對中國發動戰爭，要訓練大豹社族人擔任後備兵
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 大豹溪附近的山區盛產樟腦，日本政府為取得樟腦的龐大利益，因此將當地原住民驅離，(B)為正解。(A)設立「蕃童教育所」不需遷移居民。(C)興建桃園大圳的勞力主要為漢人，並未徵調原住民。(D) 20 世紀初，日本尚未對中國發動戰爭。
