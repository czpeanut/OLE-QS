  stem: 一份資料提到：17 世紀早期，荷蘭人占領安平作為貿易中心與統治據點，該地區的原住民族開始與世界舞臺接觸。荷蘭人為其創造的一套羅馬拼音文字，成為臺灣南島民族有文字的開始。文中的原住民族應是下列何者？
  options:
  - label: A
    content: 西拉雅族
  - label: B
    content: 排灣族
  - label: C
    content: 阿美族
  - label: D
    content: 凱達格蘭族
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 荷蘭人占領安平作為貿易中心與統治據點，當地的原住民族為(A)西拉雅族。(B)主要分布在屏東的高山族。(C)花蓮一帶的高山族。(D)臺北盆地的平埔族。
