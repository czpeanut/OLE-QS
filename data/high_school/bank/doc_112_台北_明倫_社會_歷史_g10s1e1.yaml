  stem: 一位老人家感動地說：「在過去清朝跟日本統治的時代，法律和政府命令的內容往往是限制或剝奪我們的權益，或意圖改變我們的生活。國民政府剛來臺灣的時候也是如此。直至今日，在眾人的努力下，臺灣的法律才從根本上成為真正肯定原民身分、保障原住民的力量。」這樣的說法最早出現在什麼時代？
