  - label: C
    content: 集團移住計畫
  - label: D
    content: 森林計畫事業中的保留地計畫
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文蔣宋美齡的作為，顯見她認為蘭嶼達悟族人衣不蔽體、居住環境簡陋，因此想要改善當地居民的生活環境，(B)為正解。(A)(D)題文中看不出與農業、森林相關的敘述。(C)此為日治後期的原住民政策。
