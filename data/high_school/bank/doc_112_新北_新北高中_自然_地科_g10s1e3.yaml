  section: 2
  number: 16
  type: single
  page: 2
  stem: 文章中提到「這些重力波歷經超過10億光年後」，根據這描述，下列敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 此重力波形成的時間超過10億年
  - label: B
    content: 此重力波是從距離地球超過10億光年的黑洞傳遞過來的
  - label: C
    content: 我們所接收到的重力波代表黑洞現在的情形
  - label: D
    content: 這個黑洞正在遠離我們
  group_stem: 早於10億年之前，遙遠的宇宙裡有一對黑洞彼此盤繞直到合為一體。這起猛烈的互繞碰撞事件攪動時空結構，產生的重力波以光速向宇宙各角落傳散出去。這些重力波歷經超過10億光年後，於2015年9月在雷射干涉儀重力波觀測站（LIGO）的感測器留下宛如蟲鳴鳥叫的唧啾聲。 這是人類首次直接偵測到重力波，證實了<u>愛因斯坦</u>的預言。那唧啾聲顯示這兩個合併的黑洞質量平均超過30太陽質量，也就是說，比起大質量恆星爆炸的尋常黑洞，它們的質量還要大上2、3倍。由於這些黑洞質量太大，不可能是從恆星演化而來。因此我們合理懷疑，這些黑洞是以完全與恆星無關的奇特方式形成。LIGO除了偵測到重力波外，或許還揭露了某些更不尋常的事：在恆星生成前便已有黑洞存在。 雖然這種「太初黑洞」前所未見，但某些理論模型預測在大霹靂後不到一秒內，它們已於充斥熾熱緻密電漿的宇宙中大量出現。這些潛藏的黑洞可以解答現代宇宙學的好幾個未解之謎，尤其是太初黑洞可能構成了部分或全部的暗物質；這種不可見的物質佔宇宙整體物質的85％，是支撐星系與星系團的重力黏著劑。LIGO與其他觀測設施的後續研究，可能掀起全新的觀念革命，改變我們對宇宙的理解。
  answer:
  - C
