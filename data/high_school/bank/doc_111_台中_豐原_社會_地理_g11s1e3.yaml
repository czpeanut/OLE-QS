  stem: 美國肉牛養殖規模龐大，肉牛的養成也分好幾個階段，穀飼階段稱為肉牛肥育，肥育前的階段會利用牧草地放養小牛補充飼料及養分，養到 12 ～ 14 個月大後再送往飼育場，請問肉牛肥育前的農場是主要分布在圖中的何處？
