  group_stem: '閱讀以下資料。請問：

    資料一：許多國家為了何處是「聖誕老公公的故鄉」而大動肝火，關於聖誕老人的國籍問題也引起國際爭議，但是目前唯一有共識的地方是：他住在一定很冷的地方、有常青樹作為聖誕樹、有馴鹿拉動他的雪橇。北歐各國都聲稱聖誕老人是他們的、美國有留一個郵遞區號當作聖誕老人的家。在 2008 年加拿大的移民部長 Jason Kenney 甚至聲稱聖誕老人是加拿大公民，歡迎他在完成他的聖誕任務後，隨時可以返回加拿大。

    資料二：「當維京水手在 1,200 年前來到這裡時，舉目所見大地彷彿神話一般，有巍峨冰河、皚皚雪峰、氤氳迷離的火山熔岩。」這是某國博物館對當地的解說文字；而這個人口只有 37.23 萬（2021 世界銀行統計資料）的國家的聖誕傳說也很特別，傳說中這裡有 13 位「Yule Lads」，也就是該國版的聖誕老人，他們住在<u>黑色熔岩城堡</u>裡，每年的 12 月 12 日到 24 日間會陸續下山巡視，從 12 月 24 日開始到隔年的 1 月 6 日，聖誕節持續有 13 天，聖誕老公公下山巡視時，若得知小孩子白天表現很好，就會在深夜時間放 1 份小禮物在他們的鞋子裡；但如果小孩白天不乖、頑皮，那就只會拿到 1 顆生馬鈴薯當作警惕。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由資料一：「他住在一定很冷的地方、有常青樹作為聖誕樹，有馴鹿拉他的雪橇」可知，聖誕老人住的地方應為「副極地大陸性氣候」，冬季長而嚴寒，自然景觀帶常見針葉林與馴鹿。(C)愛沙尼亞全境為溫帶大陸性氣候，因此最沒有資格爭奪聖誕老公公的國籍。
