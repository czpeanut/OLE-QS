- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 歐洲某國為世界最大的軟木塞生產地，受此國氣候條件影響造成此地有深根、厚皮、具蠟質小葉的軟木橡樹生長，呈現典型的灌木林景觀。該國將軟木橡樹的樹皮採剝、加工後變成葡萄酒瓶上的軟木塞，雖然費工但卻為該國創造高經濟價值，有「綠金」之稱。請問世界最大的軟木塞生產地最可能為下列何國？
  options:
  - label: A
    content: 芬蘭
  - label: B
    content: 英國
  - label: C
    content: 捷克
  - label: D
    content: 葡萄牙
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中提及「深根、厚皮、具蠟質小葉……典型的灌木林景觀」，可知此地氣候類型為溫帶地中海型氣候。歐洲的溫帶地中海型氣候分布於南歐，故選(D)葡萄牙。(A)芬蘭主要為副極地大陸性氣候及極地苔原氣候。(B)英國主要為溫帶海洋性氣候。(C)捷克主要為溫帶大陸性氣候。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 右圖中甲～戊分別代表不同民族進入北美洲的移動路徑。其中哪兩者來自同個國家？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
    asset:
      key: s1_2_optB
      file: doc_111_台中_豐原_社會_地理_g11s1e3/s1_2_optB.png
      crop:
        page: 1
        rect:
        - 399.35
        - 256.2
        - 564.3
        - 421.7
  - label: C
    content: 乙丁
  - label: D
    content: 丁戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 甲：印第安人；乙、丁：法國人；丙：英國人；戊：西班牙人。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 跨國企業布局全世界，卻也帶來許多問題，如造成「反全球化」，以下哪些是「反全球化」的主因？(甲)環境災難(乙)貧富鴻溝(丙)核心與邊陲的不對等關係(丁)設廠於他國增加企業成本
  options:
  - label: A
    content: 甲乙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (丁)跨國企業往往採取國際分工的方式來降低企業成本，此現象亦成為全球化的助力，故不選(丁)選項。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 以紐約為中心的大西洋五大都會區於 1950 年後沿著南北軸線延伸，而形成世界最大的都會帶，有利於大西洋五大都會區發展的因素有哪些？(甲)原料豐富(乙)運輸革新(丙)動力充足(丁)資訊革新(戊)陽光充足
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 乙戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)大西洋五大都會區連結成一大都會帶為都市擴張的展現，都市擴張的成因為交通革新，交通包含運輸及資訊革新，故選(乙)(丁)。(甲)(丙)為東北部工業帶的區位優勢；(戊)為新興工業帶的區位優勢。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 美國農業就業人口比例低卻成為世界的農業大國，請問此與其農業生產的哪些因素有關？(甲)科技化(乙)規格化(丙)專業化(丁)企業化
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (乙)規格化指不同廠牌的相同類型產品，其零件規格統一，有助於廠商外包各種附加價值較低的零件以及消費者替換零件，因此與美國為農業大國無關。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下圖為美國 1974 年製造業勞工各州每小時收入高低面量圖。請問以圖中觀察當時時薪收入最高的勞工最「不可能」從事哪一種產業？
  options:
  - label: A
    content: 飛機製造
  - label: B
    content: 鋼鐵鎔鑄
  - label: C
    content: 棉花紡織
  - label: D
    content: 汽車生產
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_111_台中_豐原_社會_地理_g11s1e3/s1_6_f1.png
    crop:
      page: 1
      rect:
      - 227.25
      - 621.95
      - 456.8
      - 795.6
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 圖中西北部華盛頓州及北部五大湖區的密西根州的時薪最高，前者重要產業為(A)飛機製造業，後者重要產業為(B)鋼鐵鎔鑄及(D)汽車生產。而(C)棉花紡織主要分布在美國南部，由圖可知，該區每小時收入最低，故選(C)。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 百葉窗的設計是為了因應強烈高溫的日照，以方便調節透入室內的光線。下列哪個地區最容易出現百葉窗？
  options:
  - label: A
    content: 英國倫敦
  - label: B
    content: 烏克蘭基輔
  - label: C
    content: 挪威奧斯陸
  - label: D
    content: 西班牙馬德里
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)西班牙馬德里為溫帶地中海型氣候，夏季受副熱帶高壓帶影響，日照強烈、蒸發旺盛，故最可能出現百葉窗。(A)英國倫敦為溫帶海洋性氣候。(B)烏克蘭基輔為溫帶大陸性氣候。(C)挪威奧斯陸為溫帶大陸性氣候。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 請問催生歐盟的背景，包含以下哪些原因？(甲)兩次世界大戰不僅造成歐洲的分裂與衝突，也使大部分歐洲國家飽受戰火摧殘，國力銳減(乙)冷戰時期美、蘇兩大陣營的對峙，更使位於「鐵幕」旁的西歐國家甚感憂慮，於是積極尋求合作(丙)二次大戰後，美國經濟力日強，歐洲小國倍感威脅(丁)復興羅馬帝國的榮耀
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 歐盟以經濟、軍事、科技、外交、文化的整合及發展為主軸，與(丁)復興羅馬帝國的榮耀最不相關。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 美國擁有許多以「聖」字開頭的地名，如聖安東尼奧（San Antonio）、聖地牙哥（San Diego），其來源與下列何者有關？
  options:
  - label: A
    content: 印第安文明遺下
  - label: B
    content: 非洲地名移殖
  - label: C
    content: 歐洲宗教傳播
  - label: D
    content: 依賴經濟發展
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)美國早期的西班牙移民主要信奉天主教，因此留下許多與宗教有關的「聖（San）」字地名。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 美國南方鄰國有一種名稱源自西班牙語的工業區，名為“maquiladora”，近年來逐漸成為美國大型跨國企業投資的熱門地點之一，其中自美國輸出至此處的工業區的貨物，於 1996 ～ 2005 年間，以每年 3 ～ 5 ％的比率穩定成長，而美國從“maquiladora”輸入的商品年均總值則超過了 400 億美元，其中又以資訊產品占大宗。請問文中美國輸出至“maquiladora”的貨物最可能為以下何者？
  options:
  - label: A
    content: 石油化學原料
  - label: B
    content: 玩具與塑膠製品
  - label: C
    content: 電子零組件
  - label: D
    content: 鋼鐵原料
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 美國南方鄰國為墨西哥，該國受殖民影響使用西班牙語。墨西哥與美國、加拿大簽署《美墨加協定》，為北美的一項自由貿易協定，墨西哥以其豐富的勞力資源及相對低廉的土地成本發展勞力密集產業，尤為電子裝配組裝於近年最為興盛，因此選(D)電子零組件。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 美國哪一個農業帶最容易同時受到颶風與龍捲風侵襲？
  options:
  - label: A
    content: 酪農業
  - label: B
    content: 地中海型農業
  - label: C
    content: 棉花帶
  - label: D
    content: 灌溉農業帶
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 颶風主要侵襲墨西哥灣沿岸及弗羅里達半島地區，龍捲風則盛行於美國中部大平原，而棉花帶主要分布於中部大平原的南部，故選(C)。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下列有關美國農業為因應全球化競爭所採取的策略及其影響敘述，哪些正確？(甲)農場規模縮小以因應全球化市場變動(乙)糧食生產產生垂直整合情形(丙)政府以補貼或貿易談判協助農民行銷農產品(丁) WTO 成立後農民飽受進口農產品的威脅(戊)長期專業化農作大量生產導致環境汙染與生態危機
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 乙丙戊
  - label: D
    content: 丙丁戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 美國農業發展具有「大規模」、「專業化」生產的特徵，以此降低單位生產成品進而產生規模經濟效益，有助於其農產品在國際市場上的競爭力，因此(甲)(丁)不選。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 歐元作為歐盟多數國家共通的貨幣後，對歐元區國家的經濟上帶來什麼效應？(甲)使英國在金融上澈底地整合於歐元區(乙)各國間在金融貿易上減少貨幣收付的成本(丙)使歐元區內各國貨品的訂價有共同的標準(丁)歐元已取代美元成為國際貿易的結算貨幣
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丙
  - label: D
    content: 甲丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)英國為歐盟成員時並未加入歐元區；(丁)美元仍是主要的國際貿易結算貨幣。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 已開發國家在全球化的過程中占盡先機，獲得巨大的利益，然而這些好處也只集中在少數幾個經濟發展程度較高的都市而已，對國內其他發展條件較差的地方而言，全球化卻帶來不同的衝擊，下列何者正確？(甲)勞力密集型產業競爭力下降(乙)非技術性勞工需求減少(丙)失業人口增加(丁)城鄉界線日漸模糊(戊)投資資金比重下降
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙丙丁戊
  - label: C
    content: 甲丙丁戊
  - label: D
    content: 甲乙丙戊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (戊)國際分工及貿易是推動全球化的主因，因此投資資金比重逐年上升。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 下圖是 2009 年的世界主要經濟體人均 GDP（PPP）與 GDP 總值比較圖。請問甲、乙、丙各是代表哪區或國家？
  options:
  - label: A
    content: 中國、臺灣、歐盟
  - label: B
    content: 印尼、智利、中國
  - label: C
    content: 臺灣、歐盟、南非
  - label: D
    content: 中國、歐盟、臺灣
  assets:
  - key: s1_15_f1
    kind: figure
    file: doc_111_台中_豐原_社會_地理_g11s1e3/s1_15_f1.png
    crop:
      page: 3
      rect:
      - 223.3
      - 103.8
      - 460.8
      - 282.25
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由圖可見，甲國人均 GDP 偏低，但 GDP 總值為圖中各國第三高，應為經濟發展快速但人口總數過高的中國，因此(B)(C)不選。(D)選項中乙國為歐盟，但歐盟國家數量多且經濟發展程度高，GDP 總值不應為圖中各國最低，因此不選(D)。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: HDI 主要表現出一個區域或國家的平均情況。若再將國內貧富差距、教育水準落差、預期壽命差異列入計算，可得出 IHDI（不平等調整後的人類發展程度指標）。將兩者做比較後可以發現，印度的 IHDI 指標比 HDI 指標減少 29 ％，挪威則減少 6.6 ％，針對這樣的差異，下列何種解釋最為適宜？
  options:
  - label: A
    content: 挪威的生活水準較高
  - label: B
    content: 印度普遍教育程度較低
  - label: C
    content: 挪威境內區域差異較小
  - label: D
    content: 印度經濟發展速度較快
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: IHDI 計算「國內貧富差距、教育水準落差、預期壽命差異」，因此若一國的貧富差距愈大，將連帶影響教育水準及預期壽命的落差，IHDI 值便會與 HDI 值差距愈大。文中提及印度的 IHDI 值與 HDI 值的差大於挪威，由此可推判印度的貧富差距或區域發展差異大於挪威，故選(C)。
- id: doc_111_台中_豐原_社會_地理_g11s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 在全球化的浪潮下，各國利用本身條件優勢，來因應新國際分工帶來的挑戰，下列不同經濟發展程度的國家中，哪一因應做法最為合理？
  options:
  - label: A
    content: 衣索比亞—抓緊關鍵技術，以在全球市場占有利潤
  - label: B
    content: 荷蘭—先透過代工，穩定國內經濟發展
  - label: C
    content: 臺灣—致力於產業結構的轉型，提升國家影響力
  - label: D
    content: 中國—不斷輸出國內原料，以求穩定外匯成長
  answer:
  - C
  answer_status: verified
