    content: ④
  - label: C
    content: ⑤
  - label: D
    content: ⑦
  group_stem: '下圖為北美洲農牧業的分布圖，請閱讀以下短文：

    牛肉裡的祕密【不只瘦肉精，美牛根本是合成怪物】

    市面上的牛肉，分為穀飼牛和草飼牛兩種，天然放牧的草飼牛在藍天白雲下大量運動，以牧草為主食，肉質精瘦，幾乎沒有脂肪。相對的，口感肥滋滋，油花分布均勻的美國牛，多數屬於圈養型的穀飼牛，以玉米、小麥為主食，輔以大量高濃縮蛋白來餵食……為迅速增胖，用動物屍體當營養劑，把牛變成肉食動物；為使口感吹彈，把牛變油花牛，宰殺前餵瘦肉精。瘦肉精為全球第十大藥廠禮來公司為了抗氣喘而研發出來的藥，它的成分「萊克多巴胺」是一種類似腎上腺素的合成物質，可以加速分解體內脂肪和合成蛋白質，用在動物身上能達到極高的換肉率（摘自 2012 年 3 月《商業周刊》）。

    請問：'
  shared_asset: g1_50_53
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 美國放牧帶（圖中⑦）的牛隻以天然牧草為主，屠宰前會送至玉米帶（圖中③）加肥。
