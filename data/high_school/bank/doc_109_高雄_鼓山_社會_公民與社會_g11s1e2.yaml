  section: 1
  number: 32
  type: single
  page: 3
  stem: 柬埔寨為中南半島的文明古國，昔稱扶南，後名真臘、高棉帝國。真臘和鄰近的占城、暹羅等地，是宋代成形的「南海貿易體系」成員，當時中國和東南亞間的貿易商船往來不絕，許多東南亞的物種隨貿易活動傳入中國。《宋會要》記載：紹興3年進口商品中，以香料、藥材、珍寶為主。《諸蕃志》也列舉中國商人在真臘、占城等15個地區販售的商品有瓷器、絲織品、酒、漆器等。柬埔寨於19世紀淪為法國保護國，1953年才獨立；但獨立後長年動亂，某國際組織乃通過決議，在該國成立柬埔寨臨時權力機構，於1992年至1993年協助該國重建和平政府，舉行自由和公正的選舉並制定新憲法，使該國恢復正常秩序；這也是該國際組織第一次接手管理一個獨立國家。該國政局較為穩定後，臺商也陸續到該國投資紡織成衣、製鞋、農產、木材加工等產業。請問若根據支出面計算GDP，則題文中發生的各項政治經濟活動，理論上何者會對柬埔寨該年度的GDP上升有直接的影響？
  options:
  - label: A
    content: 1992年遭國際組織接手管理
  - label: B
    content: 《諸蕃志》所載的販售活動
  - label: C
    content: 1953年脫離法國的獨立運動
  - label: D
    content: 20世紀末臺商的經濟行為
