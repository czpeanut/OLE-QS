  stem: 塑膠製品為日常生活帶來諸多便利，然而人類不當或過度使用造成生態環境的浩劫。某間生機食品公司省思如何推行減塑與無塑，目標是達到門市蔬果「裸賣」，並將減塑視為公司的核心價值，鼓勵員工一起實踐，同時希望能與其他廠商交流實踐經驗。關於該公司減塑做法與永續發展的關係，下列敘述何者正確？
