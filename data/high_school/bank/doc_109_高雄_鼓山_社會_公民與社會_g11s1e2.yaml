  group_stem: ◎由於棕櫚油的價格低、穩定性高，因此業者大量使用於包裝食品，甚至洗髮精、清潔劑、化妝品等日用品均有包含相關成分。全球最大的棕櫚油生產國──印尼，為了種植棕櫚樹，已經砍伐30萬公頃的林地，相當於11個臺北市的面積。然而天然森林的消失不僅破壞碳平衡，加速全球暖化，同時讓許多野生動物失去棲息地而走向滅絕。
