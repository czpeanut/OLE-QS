- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在外擔任鐘點清掃管家和在家庭裡清潔整理的工作基本上是一樣性質，都是打掃工作。但在外擔任鐘點清掃管家屬於市場性勞動；而在家庭裡清潔整理的工作屬於家務勞動，其主要的差別在於
  options:
  - label: A
    content: 是否間接與家庭生產活動有所關聯
  - label: B
    content: 是否直接與家庭生產活動有所關聯
  - label: C
    content: 是否間接與經濟生產活動有所關聯
  - label: D
    content: 是否直接與經濟生產活動有所關聯
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 全球化是當前重要的議題之一，然而民眾對於全球化的評價褒貶不一。關於全球化的敘述，下列何者「錯誤」？
  options:
  - label: A
    content: 全球化即是西化
  - label: B
    content: 全球化造成文化趨同，不過仍保有各自文化的特色
  - label: C
    content: 全球化與現代運輸、通訊體系的發展有關
  - label: D
    content: 全球化使得各國相互聯結與影響
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 若以國內生產毛額（GDP）衡量經濟福祉，下列何者是其<u>缺點</u>？
  options:
  - label: A
    content: 無法衡量社會支出的水準
  - label: B
    content: 無法衡量社會支出的方式
  - label: C
    content: 無法反映資源數量的變動
  - label: D
    content: 無法反映各種支出的目的
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 英國倫敦曾召開G20領袖高峰會，針對全球振興方案、金融監理改革與防止保護主義進行協商，希望能夠藉由組織的影響力，帶領全球走出此波金融海嘯。下列概念何者最能說明該會議所代表的現象和意義？
  options:
  - label: A
    content: 政治全球化
  - label: B
    content: 經濟全球化
  - label: C
    content: 文化本土化
  - label: D
    content: 另類全球化
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 假設快樂農場以20萬元自國外進口數隻小牛，將牠們飼養長大之後以35萬元賣給農產運銷公司。農產運銷公司將這批牛隻加工製成牛排，以60萬元賣給量販店。量販店再將這批牛排分裝零售，共計賣得90萬元。上述生產流程對於國內生產毛額（GDP）的貢獻為多少元？
  options:
  - label: A
    content: 185萬元
  - label: B
    content: 165萬元
  - label: C
    content: 390萬元
  - label: D
    content: 70萬元
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 國內生產毛額僅計入最終產品或勞務，下列何者是其主要的理由？
  options:
  - label: A
    content: 便於生產價值的最後統計
  - label: B
    content: 避免生產價值的重複計算
  - label: C
    content: 最終產品的總生產價值最大
  - label: D
    content: 無法衡量中間產品的總價值
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於「強永續性」的內涵，下列敘述何者正確？
  options:
  - label: A
    content: 又稱為「廣義永續性」
  - label: B
    content: 是指自然資本存量固定，不能與其他形式的資本相互替代
  - label: C
    content: 自然資本得用相當的人造資本替代
  - label: D
    content: 各種資本之間可以相互轉換，以確保永續發展
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 經濟成長過程中，有很多現象常被認為有害永續發展，因而產生了綠色GDP的概念。有關GDP與綠色GDP的敘述，下列何者正確？
  options:
  - label: A
    content: 碳交易的推動，會使GDP低於綠色GDP
  - label: B
    content: GDP加上汙染防治的成本，便是綠色GDP
  - label: C
    content: 化工廠改變生產流程並減少廢水排放，可以增加綠色GDP
  - label: D
    content: 提高具嚴重汙染產業的年產值，對GDP與綠色GDP的貢獻相同
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 巴黎氣候會議的召開是為了取代2020年到期的《京都議定書》，亦成為《聯合國氣候變化綱要公約》的新核心。關於「巴黎氣候會議」的敘述，下列何者正確？
  options:
  - label: A
    content: 管制氟氯碳化物的排放量
  - label: B
    content: 要求加強行動對抗氣候變遷、減少碳排放
  - label: C
    content: 保護瀕臨絕種的野生動植物
  - label: D
    content: 不損害他國的前提之下使用自然資源，慎用國際貿易手段以達成永續發展
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 受惠於全球半導體市況暢旺與機械需求熱絡，國內就業情勢大幅改善，帶動房市、股市、汽車、3C與餐飲業的活絡，行政院主計總處修正2017年經濟成長率為2.89％，人均GDP為2萬4,318美元，預測2018年經濟成長率為2.69％，人均GDP為2萬5,179美元。關於國內生產毛額（GDP）與經濟成長率的敘述，下列何者正確？
  options:
  - label: A
    content: 2018年我國最終產品與服務的市場總價值較2017年減少0.2％
  - label: B
    content: 因人口總量增加使得2018年的人均GDP高於2017年
  - label: C
    content: 受到國外景氣影響使國內產值增加，此一增加部分不會計入GDP
  - label: D
    content: 國內市場活絡帶動股市交易的金額提高，此一金額不會計入GDP
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「志工旅行」近年來廣受年輕人歡迎，只要籌措部分旅費，即可到國外從事短期志工服務，吃住則由當地的非政府組織安排，省下大筆花費，除了可以助人，亦可以拓展國際視野，提升自己的能力。關於「志工旅行」，下列敘述何者正確？
  options:
  - label: A
    content: 有助於我國人力資本的累積
  - label: B
    content: 有助於當地移民文化的形成
  - label: C
    content: 可彰顯國際貿易的分工特質
  - label: D
    content: 是兩國雙邊外交的具體展現
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 勞動部公布統計數據，因嚴重特殊傳染性肺炎（COVID-19）影響臺灣實施無薪假的企業達588家、影響勞工1萬餘人，增加速度持續加快；無薪假人數續創8年新高，並坦言，觀光、餐飲、零售、百貨、交通等內需型產業受疫情衝擊業績慘淡。根據文中所述，此官方報告可以探究疫情與下列何者的變化最有關連？
  options:
  - label: A
    content: 投資下降與進口減少
  - label: B
    content: 民間消費與出口下降
  - label: C
    content: 民間消費支出下降
  - label: D
    content: 政府投資下降
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 若將經濟循環流程圖的家戶、廠商、政府與國外四個部門的支出加總，即得到支出面的國民所得。針對四個部門的支出內容，下列敘述何者正確？
  options:
  - label: A
    content: 家戶的消費支出僅計算實體商品，並不包含服務性支出
  - label: B
    content: 投資支出為生產性機器設備，並不包含政府的公共建設
  - label: C
    content: 政府消費性支出為政府在消費財與服務方面的支出
  - label: D
    content: 外國從我國進口的半成品不會計入我國的出口產值
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 某位農夫購買100元的進口種子與肥料施用，並利用自己的耕地、農具與勞力生產小麥。之後他將小麥售予麵粉廠得款1,000元。而麵粉廠將小麥製成麵粉並以2,000元賣給麵包店。最後麵包店創造出2,500元的麵包售予消費者。假設麵粉廠與麵包廠在生產過程不再使用其他中間原料，此一生產過程對該國國內生產毛額（GDP）的貢獻為多少元？
  options:
  - label: A
    content: 5,600元
  - label: B
    content: 5,500元
  - label: C
    content: 2,500元
  - label: D
    content: 2,400元
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 國內生產毛額（GDP）是指一國國內在一定期間內，所生產的最終產品與勞務的市場交易總價值。依據上述定義，下列何者可計入GDP之中？
  options:
  - label: A
    content: 我國某位棒球選手在美國職棒大聯盟的收入
  - label: B
    content: 外籍移工在我國工作的薪資
  - label: C
    content: 政府補助的急難救助金
  - label: D
    content: 路邊販賣蔥油餅的攤販收入
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 附圖是席娜國的汽車市場狀況，假如汽車的國際價格等於$P_{1}$，而該國決定參與汽車的國際貿易，當沒有考慮其他因素之下，相較於沒有進出口時，參與國際貿易將對該國國民所得產生哪種直接影響？
  options:
  - label: A
    content: GDP上升
  - label: B
    content: GDP下降
  - label: C
    content: GNI上升
  - label: D
    content: GHI不變
