  stem: 根據上文內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 開放紐西蘭鹿耳進口將會衝擊我國養鹿業者，導致我國的社會福利減少
  - label: B
    content: 紐西蘭生產鹿茸的資金成本較低，因此具有鹿茸的比較利益
  - label: C
    content: 若進口鹿茸用於加工出口，則屬於中間產品，當我國計算GDP不用扣除
  - label: D
    content: WTO其他鹿茸出口國可能根據不歧視原則，要求我國降低鹿茸關稅
  group_stem: ◎鹿草是指雄鹿的嫩角，可做為中藥材。我國的養鹿業者表示，臺灣加入WTO之後，紐西蘭鹿茸進入我國市場，導致國內鹿草價格下跌。由於我國養鹿的工資、飼料比較貴，加上紐西蘭採用大規模養殖，因此其價格相對低廉。我國與紐西蘭簽訂經貿協定之後，鹿草的關稅將逐年降低至零關稅，讓許多本土業者深感憂心
