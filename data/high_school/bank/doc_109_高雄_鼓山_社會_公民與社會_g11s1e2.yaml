- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 「由於長春花含有vincristine和vinblastine兩種成分，因而成為醫藥業炙手可熱的生物遺傳資源原料。不過兩噸乾燥的長春花葉子，僅能生產一公克的有效藥品，導致醫藥業大量採集原料，進而造成環境沉重的負荷，使得馬達加斯加島的野生長春花近乎滅絕。醫藥公司轉往印度和莫三比克蒐集每年一千公噸原料，所以兩處的野生品種岌岌可危。為了確保原料供應不絕，唯一方案僅剩人工培植；至於野生品種因超限使用而難以發現蹤跡。」上文的目的是突顯哪種問題？
  options:
  - label: A
    content: 全球暖化
  - label: B
    content: 生物多樣性滅絕
  - label: C
    content: 能源使用缺乏效率
  - label: D
    content: 環境汙染
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 關於「永續發展」的敘述，下列何者「錯誤」？
  options:
  - label: A
    content: 完整的永續發展，應同時包含經濟、政治與環境三大面向
  - label: B
    content: 永續發展涵蓋經濟發展，可說明經濟發展對未來世代的影響
  - label: C
    content: 為了避免發生「共有財的悲劇」，政府可採行限量與鼓勵研究發展等政策
  - label: D
    content: 政府效能亦會對一國的永續發展產生重大影響
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 因疫情之故，政府組成口罩國家隊全力生產口罩，2020年3月中日產能突破一千萬片，這些口罩將被政府全數徵用。產量穩定後，民眾排隊買口罩的情形將改善，政府也會視狀況將口罩贈送給需要的友邦與疫情嚴重的地區。從GDP的角度分析，請問下列敘述何者正確？［2020／04／05新聞彙整］
  options:
  - label: A
    content: 捐贈友邦口罩會減少我國GDP
  - label: B
    content: 政府徵用口罩屬於GDP當中的投資
  - label: C
    content: 排隊買口罩所花的時間成本並不計入GDP
  - label: D
    content: 捐贈友邦口罩屬於淨出口
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 為了追求生產量的成長，一國用以投入生產的生產要素愈多，預期商品與勞務的產出亦會愈多，然而經濟發展不僅要追求產量的增長，亦要強調資源的存續等。關於經濟生產要素與經濟發展要素之差異，下列敘述何者正確？
  options:
  - label: A
    content: 人造資本為生產要素的資本財，可計入國內生產毛額
  - label: B
    content: 人力資本即與生產要素的勞動要素完全同義
  - label: C
    content: 企業才能為生產的決策力，僅屬於生產要素
  - label: D
    content: 生產要素之土地即為經濟發展要素的自然資本
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 全球化的趨勢銳不可擋，不過亦產生各種問題而受到諸多批判。關於全球化的問題與批判，下列敘述何者正確？
  options:
  - label: A
    content: 不公平的貿易與貧富差距擴大，促使另類全球化者組成世界經濟論壇與工業國家對抗
  - label: B
    content: 為了反對工業強國的做法，反全球化者召開八大工業國家高峰會
  - label: C
    content: 反全球化者提出「另一個世界是可能的」思考方向
  - label: D
    content: 另類全球化者積極協助貧窮國家爭取減輕債務的負擔
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 多數國家追求經濟發展時，均是致力擴大國民所得毛額，但是國民所得毛額「無法」反映哪些經濟資本的增長？(甲)人力資本(乙)人造資本(丙)自然資本(丁)社會資本
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (乙)(丙)(丁)
  - label: C
    content: (甲)(乙)(丁)
  - label: D
    content: (甲)(丙)(丁)
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 美國《科學雜誌》的調查研究提醒人類，若是持續濫捕海洋資源，未來可能會面臨無魚可食的危機。為了達到永續發展，讓每一世代均能享用魚類，下列何者是最佳的做法？
  options:
  - label: A
