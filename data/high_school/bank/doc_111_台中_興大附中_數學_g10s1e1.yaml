  answer_status: verified
  answer_source: answer_key
  explanation: '設第 n 個音的弦長為 64

    則 64＝$16\times ( \sqrt[12]{2} )^{n - 1}$⇒ 4＝$2^{\frac{n - 1}{12}}$⇒$\frac{n - 1}{12}$＝2 ⇒ n＝25

    故選(D)'
