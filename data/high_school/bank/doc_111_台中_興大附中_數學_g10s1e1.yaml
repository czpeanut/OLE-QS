  explanation: '｜x｜＋2｜x－2｜＞5

    ① x ≤ 0 時，原式⇒－x＋2（－x＋2）＞5

    ⇒－3x＞1 ⇒ x＜$-\frac{1}{3}$

    又 x ≤ 0，得 x＜$-\frac{1}{3}$

    ② 0＜x ≤ 2 時，原式⇒ x＋2（－x＋2）＞5

    ⇒－x＞1 ⇒ x＜－1

    又 0＜x ≤ 2，得此範圍無解

    ③ x＞2 時，原式⇒ x＋2（x－2）＞5

    ⇒ 3x＞9 ⇒ x＞3

    又 x＞2，得 x＞3

    由①、②、③知，解的範圍為 x＜$-\frac{1}{3}$或 x＞3'
