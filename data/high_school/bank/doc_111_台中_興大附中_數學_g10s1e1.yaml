- id: doc_111_台中_興大附中_數學_g10s1e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 設 a、b、c、d 為實數，請選出正確的選項。
  options:
  - label: A
    content: 若$a + b\sqrt{2}$＝$c + d\sqrt{2}$，則 a＝c 且 b＝d
  - label: B
    content: $(\sqrt{6} -\sqrt{10} ) a^{2}$≥$( 1 -\sqrt{5} ) a^{2}$
  - label: C
    content: 若 a＜b，則$\frac{5a + b}{5}$＜$\frac{3a + 2b}{6}$
  - label: D
    content: 若 $a^{2}$＞$b^{2}$，則｜a｜＞｜b｜
  - label: E
    content: 若 a＞b＞c＞d＞0，則 a＞$\frac{ac + bd}{c + d}$＞b
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：反例：a＝1，b＝1，c＝$1 -\sqrt{2}$，d＝2

    則$a + b\sqrt{2}$＝$c + d\sqrt{2}$＝$1 +\sqrt{2}$，但 a≠c 且 b≠d

    (B)○：若 a＝0，成立；若 a≠0，則要判斷$(\sqrt{6} -\sqrt{10} ) a^{2}$≥$( 1 -\sqrt{5} ) a^{2}$是否成立

    即判斷$\sqrt{6} -\sqrt{10}$≥$1 -\sqrt{5}$是否成立

    由$\sqrt{6} -\sqrt{10} - ( 1 -\sqrt{5} )$＝$(\sqrt{6} +\sqrt{5} ) - (\sqrt{10} + 1 )$

    ∵$(\sqrt{6} +\sqrt{5} )^{2}$＝$11 + 2\sqrt{30}$

    $(\sqrt{10} + 1 )^{2}$＝$11 + 2\sqrt{20}$

    ∴$\sqrt{6} +\sqrt{5}$＞$\sqrt{10} + 1$

    即 $\sqrt{6} +\sqrt{5} - (\sqrt{10} + 1 )$＞0

    ⇒ $\sqrt{6} -\sqrt{10}$＞$1 -\sqrt{5}$

    ∴所求式子成立

    (C)╳：$\frac{3a + 2b}{6}-\frac{5a + b}{5}$＝$\frac{15a + 10b - 30a - 6b}{30}$＝$\frac{-15a + 4b}{30}$

    當 a＝1，b＝2 時，$\frac{-15a + 4b}{30}$＜0，即$\frac{3a + 2b}{6}$＜$\frac{5a + b}{5}$

    (D)○：$a^{2}$＞$b^{2}$ ⇒$\sqrt{a^{2}}$＞$\sqrt{b^{2}}$⇒｜a｜＞｜b｜

    (E)○：$a -\frac{ac + bd}{c + d}$＝$\frac{ad - bd}{c + d}$＝$\frac{( a - b ) d}{c + d}$＞0

    $\frac{ac + bd}{c + d}-b$＝$\frac{ac - bc}{c + d}$＝$\frac{( a - b ) c}{c + d}$＞0

    ∴成立

    故選(B)(D)(E)'
