- id: doc_111_台中_興大附中_數學_g10s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 若 a、b 都為無理數且 a＋b 為有理數，則下列哪個選項一定是無理數？
  options:
  - label: A
    content: $\frac{2a + b}{3}$
  - label: B
    content: a－b
  - label: C
    content: a．b
  - label: D
    content: ｜a｜＋｜b｜
  - label: E
    content: $a^{2}$＋$b^{2}$
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：反設$\frac{2a + b}{3}$為有理數，則$\frac{2a + b}{3}-\frac{a + b}{3}$亦為有理數

    即$\frac{a}{3}$為有理數⇒ a 為有理數，矛盾

    (B)○：反設 a－b 為有理數，則（a－b）＋（a＋b）亦為有理數

    即 2a 為有理數⇒ a 為有理數，矛盾

    (C)╳：反例：a＝$2 +\sqrt{3}$，b＝$2 -\sqrt{3}$，則 a＋b，ab 均為有理數

    (D)╳：反例：同(C)，則｜a｜＋｜b｜＝$2 +\sqrt{3} + ( 2 -\sqrt{3} )$＝4 為有理數

    (E)╳：反例，同(C)，則 $a^{2}$＋$b^{2}$＝$( 2 +\sqrt{3} )^{2}+ ( 2 -\sqrt{3} )^{2}$＝4＋3＋4＋3＝14

    故選(A)(B)'
