  explanation: '(A)╳：$0. \overline{34}$＝$\frac{34}{99}$，$0. 3\overline{43}$＝$\frac{343 - 3}{990}$＝$\frac{34}{99}$，兩者相等

    (B)○：∵$\frac{2.3\times 10^{9}}{99}$＝$\frac{23}{99}\times 10^{8}$＝$0. \overline{23}\times 10^{8}$

    ∴原式為$0. \overline{23}\times 10^{8}-123. \overline{23}$＝$23232323. \overline{23} - 123. \overline{23}$

    ＝23232200 為整數

    (C)○：$\frac{26}{65}$＝$\frac{2}{5}$＝0.4

