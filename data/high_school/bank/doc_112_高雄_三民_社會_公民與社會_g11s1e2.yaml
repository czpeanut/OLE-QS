- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '熱門影集《魷魚遊戲》掀起熱潮，周邊商品更是賣到缺貨。右表為市場上《魷魚遊戲》面罩的供給與需求資料表，請根據表中判斷下列敘述何者正確？(甲)當產品價格為
    30 元時，市場短缺 10 單位(乙)當產品價格為 60 元時，市場短缺 20 單位(丙)當產品價格為 40 元時，市場達到均衡狀態(丁)當產品價格為 50
    元時，生產者應會降價求售(戊)當產品價格為 20 元時，實際成交量為 20 單位

    | 價格（元） | 20 | 30 | 40 | 50 | 60 | 70 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 需求量 | 20 | 16 | 12 | 8 | 4 | 0 |

    | 供給量 | 0 | 6 | 12 | 18 | 24 | 30 |'
  options:
  - label: A
    content: (甲)(丙)(丁)
  - label: B
    content: (乙)(丙)(丁)
  - label: C
    content: (丙)(丁)(戊)
  - label: D
    content: (乙)(丙)(戊)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)正確，需求量＞供給量 10 單位；(乙)供給量＞需求量 20，應當是過剩 20 單位；(丙)正確，需求量＝供給量＝12；(丁)正確，價格為
    50 元時，供給量＞需求量，代表過剩，會降價求售；(戊)當價格為 20，此時需求量為 20，但供給量為 0，成交量為 0。故本題選(A)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 馬克先生想要購屋置產，他看上中意的房子開價 25 萬美元，但是他心中打算出的價錢不超過 24.5 萬美元，因此他在沒有說出心中價格的情況下，表示 25
    萬這個價格他想要再考慮看看。最後因為賣房子的人急著想換現金購買他物，最後以 23.9 萬美元成交。請問馬克先生購買房子的消費者剩餘為何？
  options:
  - label: A
    content: 0.5 萬美元
  - label: B
    content: 1.1 萬美元
  - label: C
    content: 0.6 萬美元
  - label: D
    content: 無法計算
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，馬克先生的願付價格是 24.5 萬美元，最後成交價格是 23.9 萬美元，可知消費者剩餘為 24.5－23.9＝0.6 萬美元。故本題選(C)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列是有關政府管制市場價量的敘述。在有效管制下，以下何者正確？
  options:
  - label: A
    content: 政府干預市場之目的在更有效的應用生產資源，以提高經濟效率
  - label: B
    content: 數量管制將影響生產者與消費者，並進一步降低該國之經濟福祉
  - label: C
    content: 實施價格上限時，市場交易價格高於均衡價格，造成供過於求的情形
  - label: D
    content: 在價格管制下，經由市場機能的運作，市場交易價格將與均衡價格一致
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府干預市場通常是基於保障生產者或消費者，一般會造成無謂損失，損及經濟效率。(B)數量管制會造成無謂損失，損及經濟效率。(C)實施價格上限，市場交易價格會低於均衡價格，造成供不應求的情形。(D)價格管制即非經由市場機能的運作。故本題選(B)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某建商看中某原住民族傳統領域土地開發成本較低，決定興建渡假村。當地縣政府認為渡假村有助經濟發展與促進原住民就業，故積極提供行政協助，快速核發開發許可，而承辦開發許可的縣府科員恰巧是建商大學同學。此案引發當地原住民強烈抗議。數個公民團體也指控，該案的環境影響評估程序不完備，且一再忽視公民團體訴求，更批評承辦公務員未事先自行迴避。另有學者指出，此開發案爭議根源，在於原住民族傳統領域及其文化未受主流社會肯認，這也是原住民族曾在總統府前長期抗議的原因。此案經媒體披露，也引發民眾不同意見。請問下列關於本開發案外部成本的說明，何者最為正確？
  options:
  - label: A
    content: 由於本案開發成本較低，故外部成本也較低
  - label: B
    content: 本開發案的外部成本是建商開發的重要誘因
  - label: C
    content: 由於政府的積極開發，使得本案的外部成本降低
  - label: D
    content: 原住民族傳統消失與環境破壞都是本案外部成本
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)開發案內部成本低，不代表對第三人產生影響的外部成本也會低。(B)應當是內部成本低才是主要的誘因。(C)從題文中無法判斷。(D)外部成本是對第三人產生影響的負面效果，原住民傳統文化的消失與環境破壞都是本案的外部成本。故本題選(D)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某國政府之執政黨為國會多數黨，因政績不佳，民調持續低迷，引發要求首相下臺的呼聲，該國已有多位執政黨籍的國會議員連署支持更換黨魁，要求舉行黨魁選舉。消息一出，引發國內股票市場震盪，多檔高價股的成交價格與數量均創下一個月新低的紀錄。若從供需關係的變化來解釋該國股市所發生的現象，下列選項何者為最正確？
  options:
  - label: A
    content: 需求大幅左移，供給不變或小幅右移
  - label: B
    content: 供給大幅左移，需求不變或小幅左移
  - label: C
    content: 需求大幅右移，供給不變或小幅右移
  - label: D
    content: 供給大幅右移，需求不變或小幅右移
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，股票成交量與數量都創下新低，(A)正解。此情況會導致價格下跌、數量減少。(B)會導致價格上漲，數量減少。(C)會導致價格上漲、數量增加。(D)會導致價跌、量增。故本題選(A)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 通常在情人節前夕，市面上的花價都會看漲，但若當時剛好遇到玫瑰花產量大增（與往年相較之下），則此時玫瑰花市場將會如何變動？
  options:
  - label: A
    content: 需求與供給線向右移動，均衡價格與均衡數量均會上升
  - label: B
    content: 需求量在線上移動，從右下往左上移動，均衡價格上升
  - label: C
    content: 需求量在線上移動，從左上往右下移動，均衡數量上升
  - label: D
    content: 需求與供給線向右移動，均衡數量上升，均衡價格不一定
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 玫瑰花的需求在情人節前夕會增加，主要是受到消費者偏好的影響，造成需求線右移。若遇到玫瑰花產量大增，代表供給線右移，此時可以確認均衡數量一定會增加，而價格則須視供給與需求變動幅度而定。因此本題選(D)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: H1N1 病毒引發的新型流感快速蔓延，引起各國關注，並建立防範機制。首先我國政府針對受感染之入境旅客檢疫隔離。其後國內口罩因需求增加造成價格上揚，引發社會議論，政府因此協調廠商緊急調度資源，24
    小時生產線不停工，供給增加才使得口罩價格回穩。隨著疫情加溫，政府已針對學校感染情況發布停課標準，並逐步展開全面性的疫苗注射。請問下列何者價格上升而後回跌的供需變動原因與上述口罩的例子一樣？
  options:
  - label: A
    content: 颱風過後，蔥價爆漲；其後產地氣候大致穩定，蔥價因此回跌
  - label: B
    content: 油價飆升，國道客運車票價格調升；但因高鐵的競爭，車票價格隨後調降
  - label: C
    content: 澎湖的地價因離島博奕條例之施行而急揚；但公投沒過使得地價下滑
  - label: D
    content: 研究指出蒜頭有益健康使得蒜價高漲；農民因此搶種蒜頭，價格回跌
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，口罩價格一開始因為「需求增加」，導致價格上漲。後來則因為「供給增加」，而價格回跌。(A)颱風過後產地受到破壞，供給減少，價格上漲，氣候穩定後供給增加，價格回穩。(B)油價飆升導致民眾少開車，多搭國道客運，國道客運票價上漲，後來因為高鐵競爭，導致需求減少，票價回跌。(C)博奕條款導致澎湖土地的需求增加，土地價格上升。後來因為公投沒有過，而導致需求減少，土地價格回跌。(D)蒜頭有益健康，代表需求增加，導致蒜價上漲，而農民搶種，使得供給增加，價格回跌。故本題選(D)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 原油耗盡的能源危機是現代社會的重大問題，但是有經濟學家認為，依據經濟學的法則，原油不會用完，無需過於擔心。請問下列何種理由最適合解釋此一論點？
  options:
  - label: A
    content: 開採技術進步，未來原油供給遠大於需求，供給數量有增無減
  - label: B
    content: 價格愈來愈高，供過於求使原油有所剩餘，而剩餘將持續增加
  - label: C
    content: 替代能源愈來愈多，導致原油價格下跌，需求數量進一步減少
  - label: D
    content: 原油若因數量稀少而變得愈來愈貴，市場需求數量自然會減少
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 經濟學法則主要是「市場機能」，因此(A)技術是否持續進步，並非是經濟學法則所探討。(B)價格愈來愈高，將加快原油的開採，使原油資源加速耗盡。(C)替代能源是否愈來愈多，仍屬於未知數。(D)此屬於價格機能的運作。故本題選(D)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 全糖國每年對汽車的需求量是每年 20 萬輛，國產車產能是 10 萬輛，其他的則需仰賴進口。若現在全糖國決定對進口車輛進行數量管制，限定外國車的進口配額為每年
    5 萬輛。在不考慮其他因素下，在全糖國國內的車價會有何變化？
  options:
  - label: A
    content: 進口車漲價，國產車不變
  - label: B
    content: 進口車和國產車都漲價
  - label: C
    content: 進口車漲價，國產車跌價
  - label: D
    content: 進口車跌價，國產車漲價
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 該國進行數量管制，造成供給量低於需求量，將產生供不應求的情況，進而推升進口車與國產車的車價。故本題選(B)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 小麗長期關注水源區環境保護，她最近在一項公職人員選舉中獲勝。她的政見主要有兩項：一是當選後要修法禁止所有水源區設立工廠，以保護流入水源區的水流；二是水源區之外，也要立法實施廢水排放總量管制；政府可拍賣廢水排放執照，並容許廠商間交易廢水排放權。請問在廠商可以交易廢水排放權的情況下，若交易價格持續下降，其原因最可能為下列何者？
  options:
  - label: A
    content: 由政府首輪拍賣出去的廢水排放權數量過少
  - label: B
    content: 水汙染防治比原先政府估計的成本低且容易
  - label: C
    content: 社會大眾抗議汙染導致排放權交易不夠熱絡
  - label: D
    content: 能夠透過出售排放權而獲利的廠商數量太少
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是廢水排放權數量過多，產生供過於求，導致價格下跌。(C)社會大眾抗議汙染通常會促使政府加強環境管制，進而提高排放權的價格，而不是降低價格。(D)如果透過出售排放權而獲利的廠商數量太少，市場上的需求可能會超過供應，從而推高排放權價格，而非下降。故本題選(B)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某條河流上游有一間造紙廠，下游有一個魚類養殖場。造紙廠生產時會排放廢水，汙染河流並影響養殖場魚類之存活率，而且汙染程度愈高，魚類之存活率愈低。下列的相關敘述，何者正確？
  options:
  - label: A
    content: 若政府可出售汙染排放權並允許廠商轉售，可降低或解決此種外部效果之問題
  - label: B
    content: 若外部成本之問題未獲解決，則造紙廠產品之價格將會比獲得解決時的價格高
  - label: C
    content: 即使造紙廠與魚類養殖場相互持有對方股權，對於解決此外部效果也沒有幫助
  - label: D
    content: 若增加更多的造紙廠，可增加廠商之間的競爭性並進一步解決該廠之外部效果
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)價格應該會比獲得解決時「低」，因為沒有把外部成果考量進去，廠商無須負擔外部成本。(C)若彼此擁有對方股權，將不至於胡亂造成外部成本影響彼此，將有助於解決外部成本。(D)增加更多的造紙廠與解決外部成本無直接關係，因為處理外部成本，會增加工廠營運的成本，反而不會有廠商願意處理。故本題選(A)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 國建署 2017 年宣布對免稅菸品課徵每包 20 元的健康福利捐，主要目的之一是為了進一步降低菸害帶來的外部性。下列各項針對特定族群的政府政策中，哪一項的政策效果與前述政策最相似？
  options:
  - label: A
    content: 設置不分區立委的婦女保障名額
  - label: B
    content: 每週提供國小學童飲用免費牛奶
  - label: C
    content: 免費提供身心障礙人士復康巴士
  - label: D
    content: 免費提供高齡國民施打流感疫苗
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，健康捐的目的是減少外部成本。因此(A)(B)(C)皆與外部成本無關。(D)打流感疫苗，可減少流感流行機會，屬於減少外部成本。故本題選(D)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 智慧財產權原在鼓勵研發創新，但有時會降低經濟效率，例如一些開發中國家授予國際大藥廠抗愛滋病毒藥物專利權之後，一旦國內感染人口日益增加，許多患者將無法負擔高額的藥價。因此，巴西、泰國等政府便曾經採取「強制授權」，強制國際大藥廠在一定期間內無償或以低價授權國內廠商生產特定藥品，導致國際大藥廠蒙受損失。廠商與政府立場不同，若雙方無法調解，得由國際仲裁介入。請問依上所述，有關抗愛滋病毒藥物專利的智慧財產權會降低經濟效率的主要原因為何？
  options:
  - label: A
    content: 政府下令多家廠商加入生產行列，形成生產資源的浪費
  - label: B
    content: 強制授權是一種政府干預，會使國際藥廠蒙受巨大損失
  - label: C
    content: 智慧財產權使許多患者無法負擔藥價，減少市場交易數量
  - label: D
    content: 國際大藥廠與開發中國家的矛盾擴大，消耗國際仲裁資源
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 降低經濟效率主要是政府的干預，產生無謂損失，而減損經濟效率。(A)多家廠商的加入，會強化競爭，並不會造成資源的浪費。(B)正解。(C)藥廠的智慧財產權價格雖高，但仍屬於價格機能運作的結果，不會減損經濟效率。(D)國際仲裁事件增加，與是否減損經濟效率無關。故本題選(B)。
