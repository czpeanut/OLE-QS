  stem: 《原住民身分法》要求原住民與非原住民結婚所生之子女，須跟著具有原住民身分的父親或母親的姓氏，或取原住民傳統名字，才能取得原住民身分。這導致部分有原住民血統的民眾，因為隨著非原住民的漢人父親取了漢姓，而無法取得原住民身分。憲法法庭「111 年憲判字第 4 號判決」認定，此種情形違反《憲法》所保障有關原住民身分認同之人格權，亦牴觸種族平等及性別平等。下列有關性別平等原則的判斷，何者符合本件憲法判決的精神？
