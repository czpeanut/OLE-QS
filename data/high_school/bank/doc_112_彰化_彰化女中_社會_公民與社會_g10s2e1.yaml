  stem: 「三讀會」是世界多數民主國家立法機關通過法案的程序，因法案需要被宣讀及討論三次而得名。下列有關「三讀會」之敘述，何者「錯誤」？
  options:
  - label: A
    content: 第一讀會：由主席將議案宣付朗讀標題後，隨即交付有關委員會審查
  - label: B
    content: 第二讀會：將議案朗讀後，得就委員會審查意見或原案要旨，先做廣泛討論，再針對法案內容逐條提付討論
  - label: C
    content: 第三讀會：除發現法案內容有互相牴觸，或與《憲法》及其他法律相牴觸者外，只得為文字之修正，並將全案交付表決
  - label: D
    content: 在三讀會完成並通過議決後，法律制定程序即告完成，同時產生實質效力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)為正確敘述。(D)法律在三讀會後，須經總統公布施行才產生實質效力。
