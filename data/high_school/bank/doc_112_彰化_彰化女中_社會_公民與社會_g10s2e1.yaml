  stem: 2008 年 11 月中國海協會會長陳雲林來臺，臺大社會系助理教授李明璁與民眾未經申請就在行政院前靜坐抗議。臺北地檢署將李視為聚眾首謀而起訴。此抗議行動因主要參與者為大學生，之後成為「野草莓學運」的開端。臺北地方法院法官陳思帆審理後認為《集會遊行法》部分條文矛盾且違憲。請問依現行規定，陳法官可採行何種做法？
  options:
  - label: A
    content: 直接宣告條文違憲而釋放被告
  - label: B
    content: 請高等法院介入審理
  - label: C
    content: 裁定停止訴訟並聲請憲法法庭判決
  - label: D
    content: 由司法院召集學者專家研商解決
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)僅有大法官可以宣告條文違憲。(B)當時此案尚未在地方法院審判結束，高等法院無法介入審理。(C)依《憲法訴訟法》，各法院就其審理之案件，對裁判上所應適用之法律位階法規範，依其合理確信，認有牴觸《憲法》，且於該案件之裁判結果有直接影響者，得聲請憲法法庭為宣告違憲之判；故審理法官可裁定停止程序並聲請釋憲，為正解。(D)並非此案的解決做法。
