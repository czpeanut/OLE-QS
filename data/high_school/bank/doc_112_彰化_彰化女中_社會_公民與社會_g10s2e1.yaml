  type: single
  page: 2
  stem: 立法院通過《會計法》修正案時因漏字問題引發巨大爭議，導致各界對立法品質的關注。假設法律生效施行後，如發現法律條文有重大疏漏，該進行何種程序修正？
  options:
  - label: A
    content: 立法院依立法程序將修正案通過後，送請總統公布
  - label: B
    content: 由憲法法庭宣告該法律違憲後，立法院做修改
  - label: C
    content: 先由總統召集五院院長會商後，交由立法院修改
  - label: D
    content: 行政院長經總統核可後向立法院提出覆議修改
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)該法已生效施行，應依立法程序，由立法院提修正案，三讀通過後送請總統公布，為正解。(B)憲法法庭無法主動宣告法律違憲。(C)總統無法律提案的修改權，但可由五院（立法院是 15 位立委連署或黨團）提出法律修正案。(D)覆議應是在三讀會後，總統公布前，由行政院院長經總統核可後提出。
