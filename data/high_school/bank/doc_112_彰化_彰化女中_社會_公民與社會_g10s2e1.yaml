  stem: 小潘隨隊出國比賽，機場安檢時他戲稱：「我行李有炸彈」，迅即遭移送法辦。縱使小潘解釋此純屬玩笑，行李也查無炸彈，仍因散布危害飛航安全之不實訊息，已涉嫌犯罪須面臨法律制裁，造成當日無法隨隊出境之後果。請問有關小潘個人基本權利的限制，下列敘述何者正確？
  options:
  - label: A
    content: 為了避免緊急危難，小潘個人的言論自由可以受到法律限制
  - label: B
    content: 雖為增進公共利益，小潘個人的遷徙自由仍不得受法律限制
  - label: C
    content: 為了維護社會秩序，小潘個人的遷徙自由可以受到法律限制
  - label: D
    content: 為防止妨礙他人自由，小潘個人的人身自由仍可受法律限制
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依我國《憲法》第 23 條，具有公益目的情況下可以以法律限制人民的基本權利。公益目的又包含防止妨礙他人自由、避免緊急危難、維持社會秩序、增進公共利益。因此為保障飛航安全，限制小潘的言論自由，屬於(A)為了避免緊急危難，小潘個人的言論自由可以受到法律限制。(B)應是可以受到限制。(C)飛航安全屬於緊急避難。(D)此應屬於言論自由，而非人身自由。
