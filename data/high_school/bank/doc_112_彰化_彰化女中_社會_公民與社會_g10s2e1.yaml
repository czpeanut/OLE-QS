  stem: 已育有子女的臺灣男子汪少祥，想收養中國配偶劉茜與前夫在中國所生子女，受限《兩岸人民關係條例》規定，臺灣人民有子女者，不能收養中國配偶在中國的子女。汪少祥提起行政訴訟獲判敗訴確定，轉而聲請釋憲。司法院大法官作出釋字第 712 號解釋，認為《兩岸人民關係條例》規定牴觸《憲法》第 22 條人權概括保障條款。依我國《憲法》第 22 條規定：「凡人民之其他自由及權利，不妨害□□者，均受《憲法》之保障。」請問□□中指的是下列何者？
  options:
  - label: A
    content: 他人自由與權利
  - label: B
    content: 緊急危難社會救助
  - label: C
    content: 社會秩序公共利益
  - label: D
