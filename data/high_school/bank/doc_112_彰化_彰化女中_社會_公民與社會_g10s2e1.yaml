  stem: 19 世紀婦女運動興起時，便訴求女性參政與就業之平等。200 年後的今天，這兩項平等實現了嗎？學者仍有不同意見。在政治參與方面，人們常主張各國女性元首持續增加，女性的政治參與已趨於平等。但甲學者提醒，各國重要政治職務（如國會議員等）的性別比率仍是男高於女，因為傳統認為女性較不懂政治、欠缺參與技能，這不僅使人們較不支持女性從政，甚至導致女性即便具備能力，仍自我限縮、對政治事務卻步。為改善此問題，許多國家在各種公職選舉訂定女性保障名額。但乙學者批評保障名額雖增加女性出任公職的機會，卻對未受保障者形成另一種歧視；請問有人認為乙的批評是對法律上平等原則的誤解，下列何項論述最能反駁乙學者？
