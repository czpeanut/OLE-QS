  stem: 《入出國及移民法》規定：「外國人、臺灣地區無戶籍國民、大陸地區人民、香港及澳門居民於入出國（境）接受證照查驗或申請居留、永久居留時，移民署得運用生物特徵辨識科技，蒐集個人識別資料後錄存。」此一條文始終存在正反對立的意見，贊成者認為此舉可以有效防堵犯罪及恐怖主義，是維護國家安全的必要措施；反對者則認為指紋等生物特徵屬於個人敏感性資訊，其自主性應受到保障。請問上述兩種正反不同的意見，呈現下列何種衝突？
  options:
  - label: A
    content: 自由的保障與依法行政
  - label: B
    content: 公共利益保障與個人隱私
  - label: C
    content: 社會權的保障與正當程序
  - label: D
    content: 處境不利群體保障與居住遷徙自由
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 贊成者認為此舉可以有效防堵犯罪及恐怖主義，此主張是為了保障公共利益；而反對者認為指紋等生物特徵屬於個人敏感性資訊，應保障個人隱私權不受侵害。故此衝突為(B)公共利益保障與個人隱私。
