  type: single
  page: 2
  stem: 一般飛機的起飛過程包括三個階段：地面滑行、離地升空、加速爬升，如下圖所示。 第一階段飛機在跑道上滑行飛機必須加速到達某一速率才可以離地飛行進到第二階段。而飛機的速率可由飛機內的《慣性導航系統INS（Inetial Navigation System）》得知，INS的原理是利用加速計和陀螺儀來量測物體的加速度與角速度，再使用計算機推算出物體的速度。某架裝設有INS的民航機在小港機場跑道一端，由靜止開始加速後起飛，若INS測得在35秒內飛機的加速度由3 m／$s^{2}$均勻遞減到2 m／$s^{2}$時剛好離地起飛，請依此推算飛機的離地速率為多少m／s？
