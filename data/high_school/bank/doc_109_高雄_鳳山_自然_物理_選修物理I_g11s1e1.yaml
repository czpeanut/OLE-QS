  stem: 在《柯南－通往天國的倒數計時》中，柯南和少年偵探團因大火被困在雙子摩天大樓的頂樓，而且頂樓還被放置炸彈即將引爆。柯南想利用跑車作水平拋射運動飛越街道到隔壁大樓樓頂的露天游泳池。但是，同行的灰原卻持反對的意見，她認為：『大樓之間距離相差60公尺、高度相差20公尺，根據現場跑道的距離，跑車最多只能加速到20 m／s，依照水平拋射運動的計算根本不可能完成。』柯南想利用炸彈爆炸產生的暴風讓跑車順利抵達隔壁大樓樓頂的泳游池，則因炸彈爆炸產生的暴風至少要能使跑車的速度增加多少才能完成此項任務？（不考慮空氣阻力，g＝10 m／$s^{2}$）
