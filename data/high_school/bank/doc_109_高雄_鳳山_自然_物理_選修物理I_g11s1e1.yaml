  stem: 西元1895年，賽車這項速度競賽的運動首度在法國出現。如今，它已經成為全世界最多觀眾觀看的體育賽事之一。近代最負盛名的賽車手是出生於奧地利維也納的尼基．勞達，他曾在1975、1977和1984年三度拿下一級方程式賽車世界冠軍。在某次賽車培訓過程中，測得賽車進行直線行駛的速度－時間關係圖如圖所示，全部歷時60秒，測得全程平均速度為20公尺／秒，則該賽車前半程與全程的平均加速度比為何？
