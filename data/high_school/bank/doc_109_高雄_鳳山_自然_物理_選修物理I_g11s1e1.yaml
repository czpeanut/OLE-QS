  type: single
  page: 1
  stem: 數千年來，科學家對於自然界中變化的現象一直充滿著好奇。在物理學上，最基本的變化就是位置的改變，即運動（Motion）。在東西向直線道路上行駛的甲、乙、丙、丁四輛汽車從同地點出發，以東為正，其x-t圖或v-t圖如圖所示，下列(甲)～(戊)項的敘述中，正確的有幾項？ (甲)如果為x-t圖，丙車為靜止不動 (乙)如果為v-t圖，甲車恆在乙車的東方 (丙)如果為x-t圖，甲車的加速度量值恆大於乙車 (丁)如果為v-t圖，由開始至乙、丙速度相同時，丙車的位移量值為乙車的位移量值的兩倍 (戊)如果為v-t圖，當乙、丙速度相同時，丁車的速度向東，加速度向西
  options:
  - label: A
    content: '5'
  - label: B
    content: '4'
  - label: C
    content: '3'
  - label: D
    content: '2'
  - label: E
    content: '1'
