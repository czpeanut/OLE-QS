  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\lim_{x \rightarrow \infty} \frac{2 - x}{x^{2} ( x - 3 )}$＝$\lim_{x \rightarrow \infty} \frac{\frac{2}{x^{3}}-\frac{1}{x^{2}}}{1 -\frac{3}{x}}$＝0

    (B)╳：$\lim_{x \rightarrow 0} \frac{2 - x}{x^{2} ( x - 3 )}$不存在

    (C)○：$\lim_{x \rightarrow 3} \frac{1}{f ( x )}$＝$\lim_{x \rightarrow 3} \frac{x^{2} ( x - 3 )}{2 -x}$＝$\frac{9\times 0}{2 - 3}$＝0

    (D)╳：$\lim_{x \rightarrow 3} \frac{2 - x}{x^{2} ( x - 3 )}$不存在

    (E)○：$\lim_{x \rightarrow 2} \frac{2 - x}{x^{2} ( x - 3 )}$＝$\frac{0}{4\times ( -1 )}$＝0

    故選(A)(C)(E)'
