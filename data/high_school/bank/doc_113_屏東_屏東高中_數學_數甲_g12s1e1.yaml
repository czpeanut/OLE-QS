  stem: 設 [ x ] 表小於或等於 x 的最大整數，則$\sum_{k =1}^{25} [ \sqrt{k} ]$之值為何？
  options:
  - label: A
    content: '55'
  - label: B
    content: '65'
  - label: C
    content: '75'
  - label: D
    content: '85'
  - label: E
    content: '95'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '當 1 ≤ k ≤ 3 時，$[ \sqrt{k} ]$＝1

    當 4 ≤ k ≤ 8 時，$[ \sqrt{k} ]$＝2

    當 9 ≤ k ≤ 15 時，$[ \sqrt{k} ]$＝3

    當 16 ≤ k ≤ 24 時，$[ \sqrt{k} ]$＝4

    當 k＝25 時，$[ \sqrt{k} ]$＝5

    得$\sum_{k =1}^{25} [ \sqrt{k} ]$＝1×3＋2×5＋3×7＋4×9＋5×1＝75

    故選(C)'
