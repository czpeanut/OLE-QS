  type: single
  page: 1
  stem: 試問下列有關極限$\lim_{x \rightarrow 1} \frac{| 1 -x -x^{2} |- 1}{x - 1}$的敘述何者正確？
  options:
  - label: A
    content: 極限不存在
  - label: B
    content: 極限為 0
  - label: C
    content: 極限為 1
  - label: D
    content: 極限為 3
  - label: E
    content: 極限為－2
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow 1} \frac{| 1 -x -x^{2} |- 1}{x - 1}$＝$\lim_{x \rightarrow 1} \frac{-( 1 -x -x^{2} )- 1}{x - 1}$＝$\lim_{x \rightarrow 1} \frac{x^{2}+x - 2}{x - 1}$

    ＝$\lim_{x \rightarrow 1} \frac{( x - 1 ) ( x + 2 )}{x - 1}$＝$\lim_{x \rightarrow 1} ( x + 2 )$＝3

    故選(D)'
