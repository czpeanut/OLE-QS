- id: doc_113_屏東_屏東高中_數學_數甲_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 下列哪些數列為收斂數列？
  options:
  - label: A
    content: 〈（0.1）$^{n}$〉
  - label: B
    content: 〈（－1）$^{n}$〉
  - label: C
    content: $\left\langle \frac{4^{n -1}+ 3}{4^{n}} \right\rangle$
  - label: D
    content: $\left\langle \frac{5n^{2}+ 3}{4n^{2}} \right\rangle$
  - label: E
    content: $\left\langle \cos \frac{n\pi}{2} \right\rangle$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵$\lim_{n \rightarrow \infty} ( 0.1 )^{n}$＝0

    (B)╳：收斂值不唯一 ∴〈（－1）$^{n}$〉為發散數列

    (C)○：∵$\lim_{n \rightarrow \infty} \frac{4^{n -1}+ 3}{4^{n}}$＝$\lim_{n \rightarrow \infty} \left( \frac{1}{4}+\frac{3}{4^{n}} \right)$＝$\frac{1}{4}$

    (D)○：∵$\lim_{n \rightarrow \infty} \frac{5n^{2}+ 3}{4n^{2}}$＝$\lim_{n \rightarrow \infty} \frac{5 +\frac{3}{n^{2}}}{4}$＝$\frac{5}{4}$

    (E)╳：$\left\langle \cos \frac{n\pi}{2} \right\rangle$：0，－1，0，1，0，－1，0，1，……

    依 0，－1，0，1 四數一循環，故此數列發散

    故選(A)(C)(D)'
