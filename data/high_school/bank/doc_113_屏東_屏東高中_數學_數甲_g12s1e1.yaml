  stem: 已知等比數列〈$a_{n}$〉＝$\left\langle \frac{1}{3^{n}} \right\rangle$，且 log3$\approx$0.4771，試問此數列從第幾項開始，其值會小於 $10^{－12}$？
  options:
  - label: A
    content: '18'
  - label: B
    content: '20'
  - label: C
    content: '22'
  - label: D
    content: '24'
  - label: E
    content: '26'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{1}{3^{n}} < 10^{-12}\Rightarrowlog3^{－n}$＜$log10^{－12}\Rightarrow$n log3＞12

    $\Rightarrown > \frac{12}{\log 3}\approx\frac{12}{0.4771}\approx$25.15，得 n ≥ 26

    故選(E)'
