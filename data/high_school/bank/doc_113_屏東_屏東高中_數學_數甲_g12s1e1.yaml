  page: 2
  stem: 下列哪些選項中的函數互為反函數？
  options:
  - label: A
    content: f（x）＝$2x -\frac{1}{3}$與 g（x）＝$\frac{x}{2}+\frac{1}{6}$
  - label: B
    content: f（x）＝$\sqrt{x - 1}$，x ≥ 1 與 g（x）＝$x^{2}$＋1，x ≥ 0
  - label: C
    content: f（x）＝$2^{x}$ 與 g（x）＝$log_{2}$x，x＞0
  - label: D
    content: f（x）＝$\frac{1}{x + 1}$與 g（x）＝x＋1
  - label: E
    content: f（x）＝sinx 與 g（x）＝cosx
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：f（g（x））＝$2 \left( \frac{x}{2}+\frac{1}{6} \right) -\frac{1}{3}$＝x

    且 g（f（x））＝$\frac{1}{2} \left( 2x -\frac{1}{3} \right) +\frac{1}{6}$＝x

    (B)○：f（g（x））＝$\sqrt{( x^{2}+ 1 )- 1}$＝｜x｜＝x（∵x ≥ 0）

    且 g（f（x））＝$( \sqrt{x - 1} )^{2}+ 1$＝x－1＋1＝x

    (C)○：f（g（x））＝$2^{\log _{2}x}$＝x 且 g（f（x））＝$log_{2}2^{x}$＝x

    (D)╳：f（g（x））＝$\frac{1}{( x + 1 )+ 1}$≠x

    (E)╳：f（g（x））＝sin（cosx）≠x

    故選(A)(B)(C)'
