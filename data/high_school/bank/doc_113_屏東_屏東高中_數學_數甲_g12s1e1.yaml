- id: doc_113_屏東_屏東高中_數學_數甲_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在實數線上，動點 A 從原點開始往正向移動，動點 B 從 6 的位置開始往負向移動。兩個動點每一秒移動一次，已知第一秒 A、B 移動的距離分別為 1、4，且 A、B 每次移動的距離分別為其前一次移動距離的$\frac{1}{2}$倍、$\frac{1}{3}$倍。令 $c_{n}$ 為第 n 秒時 A、B 的中點位置。則$\lim_{n \rightarrow \infty} c_{n}$的值為下列哪一個選項？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $a_{n}$，$b_{n}$ 分別表示 A，B 在第 n 秒的位置

    $\Rightarrowa_{1}$＝1，$a_{2}$＝$1 +\frac{1}{2}$，$a_{3}$＝$1 +\frac{1}{2}+\frac{1}{4}$，……， $a_{n}$＝$1 +\frac{1}{2}+\frac{1}{2^{2}}+\ldots \ldots +\frac{1}{2^{n -1}}$＝$\frac{1\times \left( 1 - \left( \frac{1}{2} \right) ^{n} \right)}{1 -\frac{1}{2}}$＝$2 \left( 1 - \left( \frac{1}{2} \right) ^{n} \right)$

    且 $b_{1}$＝6－4，$b_{2}$＝$6 - \left( 4 + 4\times \frac{1}{3} \right)$，$b_{3}$＝$6 - \left( 4 + 4\times \frac{1}{3}+ 4\times \frac{1}{3^{2}} \right)$，……，

    $b_{n}$＝$6 - \left( 4 + 4\times \frac{1}{3}+ 4\times \frac{1}{3^{2}}+\ldots \ldots + 4\times \frac{1}{3^{n-1}} \right)$＝$6 -\frac{4\times \left( 1 - \left( \frac{1}{3} \right) ^{n} \right)}{1 -\frac{1}{3}}$＝$6 - 6 \left( 1 - \left( \frac{1}{3} \right) ^{n} \right)$ ＝$6\times \left( \frac{1}{3} \right) ^{n}$

    得 $c_{n}$＝$\frac{a_{n}+b_{n}}{2}$＝$1 - \left( \frac{1}{2} \right) ^{n}+ 3\times \left( \frac{1}{3} \right) ^{n}$

    $\lim_{n \rightarrow \infty} c_{n}$＝$\lim_{n \rightarrow \infty} \left( 1 -\left( \frac{1}{2} \right) ^{n}+ 3\times \left( \frac{1}{3} \right) ^{n} \right)$＝1

    故選(A)'
