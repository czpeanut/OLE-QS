  stem: 設 f（x）＝$\frac{2 -x}{x^{2} ( x - 3 )}$，則下列敘述哪些是正確的？
  options:
  - label: A
    content: $\lim_{x \rightarrow \infty} f ( x )$＝0
  - label: B
    content: $\lim_{x \rightarrow 0} f ( x )$＝0
  - label: C
    content: $\lim_{x \rightarrow 3} \frac{1}{f ( x )}$＝0
  - label: D
    content: $\lim_{x \rightarrow 3} f ( x )$＝0
  - label: E
    content: $\lim_{x \rightarrow 2} f ( x )$＝0
  answer:
