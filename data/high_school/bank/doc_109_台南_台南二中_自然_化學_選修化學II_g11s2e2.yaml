  stem: '有關秒錶反應的反應速率測定，相關反應式如下： $IO_{3}^{－}$(aq)＋$3HSO_{3}^{－}$(aq) → $I^{－}$(aq)＋$3SO_{4}^{2－}$(aq)＋$3H^{＋}$(aq) 〈式一〉 $IO_{3}^{－}$(aq)＋$5I^{－}$(aq)＋$6H^{＋}$(aq) → $3I_{2}$(s)＋$3H_{2}$O(l) 〈式二〉 $I_{2}$(s)＋$HSO_{3}^{－}$(aq)＋$H_{2}$O(l) → $2I^{－}$(aq)＋$SO_{4}^{2－}$(aq)＋$3H^{＋}$(aq) 〈式三〉 實驗步驟為：

    步驟一：取0.428克碘酸鉀（$KIO_{3}$＝214）加水配成100.0mL之溶液A。另取0.019克的焦亞硫酸鈉（$Na_{2}S_{2}O_{5}$＝190）、0.5 mL 0.10 M $H2SO_{4}$(aq)及0.400克可溶解澱粉和水配成100.0 mL之溶液B。

    步驟二：在常溫下，以分度吸量及安全吸球分別吸取10.0 mL溶液A和10.0 mL溶液B同時倒入一燒杯，並迅速搖動溶液使瞬間混合均勻，再經過10.0秒後，溶液恰好變成藍色。

    (1) 下列有關秒錶反應的敘述，哪些<u>錯誤</u>？

    (2) 求步驟一之溶液A中$IO_{3}^{－}$的濃度。 (3) 求步驟一之溶液B中$HSO_{3}^{－}$的濃度。 (4) 根據上面之實驗據，計算$HSO_{3}^{－}$在步驟二混合後的消失速率。 (5) 如右圖所示，以分度吸量管及安全吸球取溶液至燒杯中時，安全吸球操作順序為何？

    (6) 在步驟二中，若改變溶液A和溶液B的混合體積，則下列哪些實驗混合後，可以呈藍色？'
  options:
