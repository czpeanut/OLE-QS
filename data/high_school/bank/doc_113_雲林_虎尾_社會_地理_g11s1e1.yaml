    中國製造全球半數的鋼鐵，是世界最大鋼鐵生產國，而澳洲則是世界最大鐵礦砂開採國。中國進口鐵礦砂中，約 6 成來自澳洲；對澳洲而言，中國是最重要的貿易夥伴，其次為日本，2018 ～ 2019 年間，澳洲對中國貿易額是對日本的 2.5 倍，其中對中國出口鐵礦砂約占 20 ％，比重不容小覷。

    澳洲的鐵礦砂屬於赤鐵礦，具有廉價、品質良好等優勢，若中國貿然制裁澳洲鐵礦砂進口，將不像大麥、葡萄酒等產品，容易在國際上尋得適合的替代來源；澳洲國內則有聲音認為，應提高對中國出口鐵礦砂的成本，以彌補澳洲在其他對中國出口產品的損失，但此舉恐引發違反自由貿易爭議，並且存在傷害採礦業此國家經濟命脈的風險，因此懸而未決。鐵礦砂儼然成為中澳貿易戰下，兩國都不願逾越的攻防線。

    名詞解說

    赤鐵礦：赤鐵礦含鐵量約 50 ～ 60 ％，雜質較少，為優良的煉鐵原料。澳洲是世界赤鐵礦開採量最大的國家，使得澳洲在國際鐵礦市場上具有優勢。

    請問：'
