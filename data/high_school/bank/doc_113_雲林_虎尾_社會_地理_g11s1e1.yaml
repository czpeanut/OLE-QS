- id: doc_113_雲林_虎尾_社會_地理_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 印尼首都雅加達，因為人口集中而帶來眾多的環境問題，可以用下列哪一個概念說明？
  options:
  - label: A
    content: 區位租
  - label: B
    content: 推拉理論
  - label: C
    content: 中地理論
  - label: D
    content: 環境負載力
  group_stem: '2022 年 1 月 18 日印尼國會通過法案，於 2024 年起將首都從雅加達遷移至婆羅洲的東加里曼丹省，這一座新的首都將被命名為「努山塔拉（Nusantara）」，在印尼語中具有「群島」之意，可以呈現出印尼「萬島之國」的特點。

    長期以來，印尼遷都的議題頻頻被提出，主要是因為目前首都雅加達人口破千萬，讓當地環境負擔過於沉重：包含嚴重的交通壅塞、空氣汙染，以及超抽地下水帶來的地層下陷問題。此外，人口過度集中於首都亦導致印尼內部區域發展不均，該國有將近 60 ％的人口、超過半數的經濟活動都集中在爪哇島上。為了解決上述問題，印尼總統佐科威（Joko Widodo）早在 2019 年就宣布遷都計畫，但因受到 COVID-19 疫情延宕，直至 2022 年初遷都法案才正式拍板定案。

    印尼預計 2024 年開始實施分階段遷都，努山塔拉的最大優勢是其位居印尼群島的中心，天災風險較低，然而新首都所在的位置原先是由熱帶雨林所覆蓋的區域，也讓環保人士擔心當地的生態系將面臨破壞，甚至批評該法案的環境影響評估過於倉促。站在執政者的立場而言，努山塔拉未來將規劃為低碳城市，讓人們可以透過自行車、步行來移動，此外，也將積極發展製藥、健康和科技產業，期盼能促進印尼產業的永續發展。請問：'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由雅加達人口破千萬、當地環境負擔過重等敘述，討論的是雅加達的(D)環境負載力已無法負擔此地眾多人口。
  tags:
    unit:
      code: GE-3-1-2
      book: 地理3
      chapter: 東西文化的接觸與區域發展－東南亞
