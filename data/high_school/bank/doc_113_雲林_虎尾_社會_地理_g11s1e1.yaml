  - label: D
    content: 4 ～ 6 月
  group_stem: '元代周達觀《真臘風土記》中詳細記載 13 世紀元朝對真臘的交通貿易情形。以下節錄：

    真臘國或稱占臘，其國自稱曰甘孛智。歷閩、廣海外諸州港口，過七洲洋，經交趾洋到占城。又自占城順風可半月到真蒲，乃其境也。又自真蒲行坤申針，過崑崙洋，入港。港凡數十，惟第四港可入，其餘悉以沙淺故不通巨舟。然而彌望皆修藤古木，黃沙白葦，倉卒未易辨認，故舟人以尋港為難事。自港口北行，順水可半月，抵其地查南，乃其屬郡也。又自查南換小舟，順水可十餘日，過半路村、佛村，渡淡洋，可抵其地干，取城五十里。請問：'
  answer:
  - A
  answer_status: verified
