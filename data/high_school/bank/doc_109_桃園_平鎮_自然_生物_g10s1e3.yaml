  stem: 影響鳥蛋形狀差異的原因，最可能與下列有關？
  options:
  - label: A
    content: 一窩鳥蛋目
  - label: B
    content: 鳥巢所在地
  - label: C
    content: 鳥體型的大小
  - label: D
    content: 鳥翼指數
  group_stem: 「為何鳥蛋的形狀多變？」一直是科學家研究的問題。有科學家認為像崖海鴨生長在峭壁岩石上，蛋就演化偏向不對稱型，使蛋不容易因滾動而掉到海中；而偏向橢圓形的蛋則能在巢中充分滾動而受熱均勻。來自普林斯頓大學，個佛大學的科學家與柏克萊脊椎動物博物館合作，分別收集來自世界各地1400品種的鳥巢、洞穴以及鳥群聚集地的鳥蛋共49175顆，利用電腦分析鳥蛋的對稱性與橢圓性如附圖，希望得知鳥蛋形狀的成因。 研究團隊發垷，每種鳥類其鳥蛋形狀多變，似乎形狀和分類無相關性。而且鳥的體型、飲食、一窩蛋的數目、鳥巢的類型、鳥巢所在地以及生活環境只與鳥蛋大小有關，卻與蛋形無直接關係。 但是當鳥類具有較高遷徒飛行能力的鳥翼指數（協寬和協長的差異程度，指數愈大、協膀就愈細長）時，牠們的鳥蛋就有愈明顯呈現橢圓形並且不對稱的傾向。科學家推論當鳥為了飛行使身體成流線型，體腔會變得狹小，輸卵管也會狹小，因此鳥蛋的形狀會變更加接近橢圓形而且蛋的一端特別尖。試根據上文，回答下列問題：
