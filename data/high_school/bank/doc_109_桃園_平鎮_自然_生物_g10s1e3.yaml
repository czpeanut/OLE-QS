- id: doc_109_桃園_平鎮_自然_生物_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2018下半年中國爆發非洲豬瘟，引起周圍國家的緊張。尤其臺灣即將在2019年解除長達21年來的「口蹄疫疫區」標籤，豬肉終於可恢復外銷，自然對疫情更加關注。非洲豬瘟的病原體為非洲豬瘟病毒，遺傳物質為DNA；口蹄疫的病原體則為RNA病毒。若在實驗室中不慎將兩種病毒的檢體搞混，下列何種遺傳物質的檢測方式<u>無法</u>辨別這兩種不同的病毒？
  options:
  - label: A
    content: 檢測含氮鹼基種類
  - label: B
    content: 檢測核苷酸序列
  - label: C
    content: 檢測五碳醣種類
  - label: D
    content: 檢測磷酸基種類
  tags:
    unit:
      code: BI-1-2-2
      book: 生物（全）
      chapter: 遺傳與生物科技
      title: 遺傳物質
      std: true
