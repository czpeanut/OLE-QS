    label_note: 題幹「DNA」誤植為「DAN」
    fixed_by: agent
    fix_note: （人工修正：修正題幹「DAN」錯字為「DNA」並補齊答案與解析）
  difficulty: 2
  explanation: DNA與RNA的含氮鹼基種類（T vs U）、五碳醣種類（去氧核糖 vs 核糖）及核苷酸序列皆不同，唯有磷酸基種類完全相同，故無法以檢測磷酸基來辨別，選(D)。
  answer_status: ai_generated
  answer_source: agent
