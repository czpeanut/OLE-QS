  stem: 已知 A、B 是兩個 2×2 的轉移矩陣，試問下列矩陣哪些是轉移矩陣？
  options:
  - label: A
    content: $A^{2}$
  - label: B
    content: A＋B
  - label: C
    content: AB
  - label: D
    content: $\frac{1}{2}$（$A^{2}$＋$B^{2}$）
  - label: E
    content: 4（$A^{2}$＋$B^{2}$）
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：轉移矩陣乘以轉移矩陣亦為轉移矩陣，故 $A^{2}$＝A．A 為轉移矩陣

    (B) ╳：應為$\frac{A+B}{2}$

    (C) ○：轉移矩陣乘以轉移矩陣亦為轉移矩陣，故 A．B 為轉移矩陣

    (D) ○：∵$A^{2}$，$B^{2}$ 為轉移矩陣

    ∴$\frac{A^{2}+B^{2}}{2}$亦為轉移矩陣

    (E) ╳：應為$\frac{A^{2}+B^{2}}{2}$

    故選(A)(C)(D)'
