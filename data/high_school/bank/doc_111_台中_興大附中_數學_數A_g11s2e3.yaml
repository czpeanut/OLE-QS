  stem: 已知矩陣$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$的反方陣為$\left[ \begin{matrix}3 & \sqrt{5} \\ 2 & \sqrt{7}\end{matrix} \right]$，求聯立方程式$\begin{cases}ax+by=2 \\ cx+dy=0\end{cases}$之解（x，y）＝＿＿＿＿。
  answer:
  - （6，4）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]\left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$

    ⇒$\left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right] ^{-1}\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$

    ＝$\left[ \begin{matrix}3 & \sqrt{5} \\ 2 & \sqrt{7}\end{matrix} \right]\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$＝$\left[ \begin{matrix}6 \\ 4\end{matrix} \right]$

    故（x，y）＝（6，4）'
