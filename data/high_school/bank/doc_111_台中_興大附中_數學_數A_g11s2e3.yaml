  explanation: '由題意可知$\begin{cases}ax + 5y + 12z =4 \\ x +ay +\frac{8}{3}z =7 \\ 3x + 8y +az =1\end{cases}$⇒$\begin{cases}x + 2y +bz =7 \\ by + 5z =-5 \\ bz =0\end{cases}$

    ∵恰有一組解且 bz＝0

    ∴z＝0

    故可改寫為$\begin{cases}ax + 5y = 4 \cdots \cdots \cdots \cdots \cdots ① \\ x +ay =7 \cdots \cdots \cdots \cdots \cdots ② \\ 3x + 8y =1 \cdots \cdots \cdots \cdots \cdots ③\end{cases}$⇒$\begin{cases}x + 2y =7 \cdots \cdots \cdots \cdots \cdots ④ \\ by =-5 \cdots \cdots \cdots \cdots \cdots ⑤ \\ 0 = 0\end{cases}$

    解③、④可得$\begin{cases}3x + 8y = 1 \\ x + 2y = 7\end{cases}$⇒$\begin{cases}x =27 \\ y =-10\end{cases}$

    代入①、⑤可得$\begin{cases}27a = 54 \\ -10b =-5\end{cases}$⇒$\begin{cases}a = 2 \\ b =\frac{1}{2}\end{cases}$

    故數對（a，b）＝$\left( 2 , \frac{1}{2} \right)$'
