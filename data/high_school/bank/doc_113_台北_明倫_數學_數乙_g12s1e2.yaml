  stem: 設 f（x）＝$x^{3}$＋$ax^{2}$＋b，其圖形過 A（1，1）且在 A 之切線斜率為 5，試選出正確的選項。
  options:
  - label: A
    content: a＋b＝6
  - label: B
    content: a＝1
  - label: C
    content: b＝3
  - label: D
    content: a－b＝0
  - label: E
    content: a＝3
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '∵圖形過 A（1，1） ∴f(1)＝1＋a＋b＝1 ⇒ a＋b＝0

    ∵圖形在 A 之切線斜率為 5 且 f''（x）＝$3x^{2}$＋2ax

    ∴f''(1)＝3＋2a＝5 ⇒ 2a＝2 ⇒ a＝1，代入 a＋b＝0 可得 b＝－1

    故選(B)'
