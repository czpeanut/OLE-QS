  stem: 若 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d 的圖形如右圖所示，下列哪些正確？
  options:
  - label: A
    content: a＞0
  - label: B
    content: b＜0
  - label: C
    content: c＞0
  - label: D
    content: d＜0
  - label: E
    content: $b^{2}$－3ac＜0
  assets:
  - key: s3_4_f1
    kind: figure
    file: doc_113_台北_明倫_數學_數乙_g12s1e2/s3_4_f1.png
    crop:
      page: 4
      rect:
      - 459.8
      - 68.35
      - 564.3
      - 139.6
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵圖形右邊的 x 值愈大，則函數值（y 坐標）愈大 ∴a＞0

    (B) ╳：∵反曲點（對稱中心）在 y 軸左方，x 坐標小於 0

    ∴$\frac{-b}{3a}$＜0

    又∵a＞0 ∴b＞0

    (C) ○：f''（x）＝$3ax^{2}$＋2bx＋c

    ∵f''(0)＝c，又 f（x）在 x＝0 之處的切線斜率為正 ∴c＞0

    (D) ╳：f(0)＝d＞0

    (E) ╳：∵f（x）有兩極值，即 f''（x）＝0 有兩相異實根

    ∴（2b）$^{2}$－4×3a×c＞0 ⇒ $b^{2}$－3ac＞0

    故選(A)(C)'
