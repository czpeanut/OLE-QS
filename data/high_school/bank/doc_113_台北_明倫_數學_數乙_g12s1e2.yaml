  section: 3
  number: 2
  type: multiple
  page: 3
  stem: 下列敘述哪些正確？
  options:
  - label: A
    content: 一次函數 f（x）＝3x＋5，則對任何 a ∈ R，導數 f'（a）都是 3
  - label: B
    content: 若函數 f 在 x＝a 之處連續，則導數 f'（a）必存在
  - label: C
    content: 函數 f（x）＝[x] 在 x＝2 時，$\lim_{x\rightarrow 2} f(x)$不存在，但 f'(2)存在
  - label: D
    content: 函數 f（x）＝$\sqrt{4-x^{2}}$在 x＝2 的導數 f'(2)＝0
  - label: E
    content: 設一質點在數線上運動，f（x）表示時刻 x 時的位置，則 f'（a）表示在時刻 a 時的瞬間速度
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：f''（x）＝3 ∴對任何 a ∈ R，f''（a）都是 3

    (B) ╳：反例：f（x）＝∣x∣在 x＝0 之處連續，但 f''(0)不存在

    (C) ╳：∵函數 f（x）＝[x] 在 x＝2 時不連續

    ∴f''(2)不存在

    (D) ╳：f''(2)＝$\lim_{x\rightarrow 2} \frac{\sqrt{4-x^{2}}-f(2)}{x-2}$＝$\lim_{x\rightarrow 2} \frac{\sqrt{4-x^{2}}}{x-2}$不存在

    (E) ○

    故選(A)(E)'
