- id: doc_113_台北_明倫_數學_數乙_g12s1e2_s2_6
  section: 2
  number: 6
  type: single
  page: 2
  stem: 試求方程式 $x^{3}$－12x＋6＝0 的實根有幾個？
  options:
  - label: A
    content: '0'
  - label: B
    content: '1'
  - label: C
    content: '2'
  - label: D
    content: '3'
  - label: E
    content: '4'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝$x^{3}$－12x＋6

    f(4)＝64－48＋6＞0

    f(3)＝27－36＋6＜0

    f(2)＝8－24＋6＜0

    f(1)＝1－12＋6＜0

    f(0)＝6＞0

    f（－1）＝－1＋12＋6＞0

    f（－2）＝－8＋24＋6＞0

    f（－3）＝－27＋36＋6＞0

    f（－4）＝－64＋48＋6＜0

    ∵f(3)×f(4)＜0，f(0)×f(1)＜0，f（－3）×f（－4）＜0

    ∴方程式 $x^{3}$－12x＋6＝0 在區間（3，4），（0，1）與（－3，－4）共有 3 個實根

    故選(D)'
