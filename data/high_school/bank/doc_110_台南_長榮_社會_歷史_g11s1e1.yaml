    資料一：它是一種強調民族國家至上的政治學說，包含非理性主義、極權主義、菁英主義、帝國主義、軍國主義以及種族主義。非理性主義煽動人們情緒，讓人們放棄理性思考，服從領袖(或首領)；極權主義構建獨裁統治的政治制度，大權歸於領袖(或首领)一人；種族主義宣揚民族優越論，以及社會達爾文主義─强者統治弱者等等。

    資料二：第一次世界大戰後，他公開宣稱本國是站在勝利者的一方，但卻未得到「領土讓步(要求奧地利割地)」的滿足。為了擴大黨的影響力，吸收了大量的退伍軍人、勞工和中產階級。1922年，他得到了來自圆王請他組織政府的邀請。'
