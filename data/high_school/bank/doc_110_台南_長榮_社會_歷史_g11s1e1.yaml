  group_stem: ◎他是古羅馬的作家和哲學家，出身於西班牙的顯貴家族，161年繼承帝位，他的大半生都在戎馬軍旅中度過，為「羅馬和平」的最後一位帝王。他從小在修辭學、語法學、哲學方面受到良好的教育，其後他放棄鑽研修辭學，轉向斯多噶哲學探究，成為史上唯一哲學家皇帝，是晚期斯多噶學派的代表人物。他重視道德修養，要求人們通過自我教育達到無私互愛的境界，認為所有人皆為神之子，但也要求人們安於命運給他們安排的地位。他以希臘文若《沉思錄》，用陳述和問答等方式記錄了他的思想，於歴史與哲學上的研究極具參考價值。書中他與自己的心靈對話，成為後世論述修養的經典名篇，其價值與地位等同於中國的《論語》。請問：
