  page: 2
  stem: 三腳渡船頭與<u>保安宮</u>的直線為多少公尺？
  group_stem: <u>明倫高中</u>校本課程於期中安排活動，每班同學分成三組進行任務，第一組至O點<u>明倫高中</u>，第二組至A點三腳渡船頭，第三組至B點<u>保安宮</u>。已知三腳渡船頭位於<u>明倫高中</u>的北6°西距離1500公尺處，<u>保安宮</u>位於<u>明倫高中</u>的西36°南距離900公尺處，試問：
  answer:
  - 2100公尺
  answer_status: verified
  answer_source: answer_key
  explanation: 由餘弦定理可得$\overline{AB}$＝$\sqrt{1500^{2}+900^{2}-2\times 1500\times 900\times \cos 120^{\circ}}$＝$\sqrt{2250000+810000+1350000}$＝2100， 故三腳渡船頭與<u>保安宮</u>的直線距離為2100公尺。
- id: doc_110_台北_明倫_數學_g10s2e3_s4_3
  section: 4
  number: 3
  type: calc
  page: 2
  stem: 校本課程指導老師用對講機和三組同學同時交代任務，為使訊號清晰，老師站在與三組同學距離相等處發號施令，請問老師與三組同學距離為多少公尺？
  group_stem: <u>明倫高中</u>校本課程於期中安排活動，每班同學分成三組進行任務，第一組至O點<u>明倫高中</u>，第二組至A點三腳渡船頭，第三組至B點<u>保安宮</u>。已知三腳渡船頭位於<u>明倫高中</u>的北6°西距離1500公尺處，<u>保安宮</u>位於<u>明倫高中</u>的西36°南距離900公尺處，試問：
  answer:
  - 700$\sqrt{3}$公尺
  answer_status: verified
  answer_source: answer_key
  explanation: 設老師站的位置位於Q點，可知Q為△AOB的外心，且$\overline{QA}$＝$\overline{QB}$＝$\overline{QO}$＝R，其中R為△AOB的外接圓半徑，由正弦定理可得$\frac{\overline{AB}}{\sin 120^{\circ}}$＝2R ⇒ R＝$\frac{2100}{2\times \frac{\sqrt{3}}{2}}$＝700$\sqrt{3}$，故老師與三組同學的距離為700$\sqrt{3}$公尺。
