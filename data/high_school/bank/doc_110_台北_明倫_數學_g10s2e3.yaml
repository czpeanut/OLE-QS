- id: doc_110_台北_明倫_數學_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: △ABC中，已知sin A：sin B：sin C＝2：3：4，則△ABC為下列何種三角形？
  options:
  - label: A
    content: 直角三角形
  - label: B
    content: 鈍角三角形
  - label: C
    content: 銳角三角形
  - label: D
    content: 等腰三角形
  - label: E
    content: 無法判別
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由正弦定理可知$\overline{BC}$：$\overline{AC}$：$\overline{AB}$＝sin A：sin B：sin C＝2：3：4，設$\overline{BC}$＝2k，$\overline{AC}$＝3k，$\overline{AB}$＝4k， 由餘弦定理可知cos C＝$\frac{(2k)^{2}+(3k)^{2}-(4k)^{2}}{2\times 2k\times 3k}$＜0，所以∠C為鈍角，即△ABC為鈍角三角形。故選(B)。
- id: doc_110_台北_明倫_數學_g10s2e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列有關△ABC的敘述何者正確？( 其中$\overline{BC}$＝a，$\overline{AC}$＝b，$\overline{AB}$＝c )
  options:
  - label: A
    content: 若∠A：∠B：∠C＝1：2：3，則a：b：c＝1：2：3
  - label: B
    content: 若$sin^{2 }$A＋$sin^{2 }$B＜$sin^{2 }$C，則△ABC為鈍角三角形
  - label: C
    content: 若cos A＜0，則△ABC為鈍角三角形
  - label: D
    content: tan ( B＋C )＝tan A
  - label: E
    content: cos ($\frac{B+C}{2}$)＝sin$\frac{A}{2}$
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：若∠A：∠B：∠C＝1：2：3，則∠A＝30°，∠B＝60°，∠C＝90° ⇒ a：b：c＝$sin^{ }$A：$sin^{ }$B：$sin^{ }$C＝$\frac{1}{2}$：$\frac{\sqrt{3}}{2}$：1＝1：$\sqrt{3}$：2。 (B) ○：若$sin^{2 }$A＋$sin^{2 }$B＜$sin^{2 }$C，則$a^{2}$＋$b^{2}$＜$c^{2}$ ⇒∠C為鈍角，即△ABC為鈍角三角形。 (C) ○：若cos A＜0，∠A為鈍角，即△ABC為鈍角三角形。 (D) ×：tan ( B＋C )＝tan ( 180°－A )＝－tan A。 (E) ○：cos ($\frac{B+C}{2}$)＝cos ($\frac{180^{\circ}-A}{2}$)＝cos ( 90°－$\frac{A}{2}$)＝sin$\frac{A}{2}$。 故選(B)(C)(E)。
- id: doc_110_台北_明倫_數學_g10s2e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: <u>英國</u>有一項特別的研究，該研究指出身高愈高的人，感染新冠肺炎的機率愈高，<u>小玉</u>覺得研究結果很有趣，且已知免疫力和體溫有很大的關，便著手測量身邊的人的身高 ( X ) 及體溫 ( Y )，測量後得到資料：( 155 , 37.2 ) , ( 160 , 37 ) , ( 165 , 36.6 ) , ( 170 , 36.6 ) , ( 176 , 36.3 )，其中測量的單位分別是公分和攝氏溫度。若這5筆資料的相關係數為r，迴歸直線的斜率為m。現在如果將公分轉換成英吋 ( 1公分＝0.3937英吋 )，攝氏轉換成華氏 ( x℃＝($\frac{9}{5}$x＋32 )℉)，若單位換算後的相關係數為r'，迴歸直線的斜率為m'，則下列選項哪些正確？
  options:
  - label: A
    content: rm＞0
  - label: B
    content: r＞0
  - label: C
    content: r＝r'
  - label: D
    content: m'＞0
  - label: E
    content: m'＞m
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_110_台北_明倫_數學_g10s2e3/s2_2_f1.png
    crop:
      page: 1
      rect:
      - 577.2
      - 722.05
      - 668.75
      - 816.1
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 設轉換後的資料為 ( X' , Y' )，其中X'＝0.3937X，Y'＝$\frac{9}{5}$Y＋32，可知 r'＝r＜0，m＝$\frac{r\sigma _{y}}{\sigma _{x}}$＜0 ⇒ m'＝$\frac{r'\sigma _{y}'}{\sigma _{x}'}$＝$\frac{r\times (\frac{9}{5}\sigma _{y})}{0.3937\sigma _{x}}$＝$\frac{\frac{9}{5}}{0.3937}$m＜m＜0。 故選(A)(C)。
