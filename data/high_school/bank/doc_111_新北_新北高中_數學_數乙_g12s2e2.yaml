  stem: 下列哪一個選項是方程式 $x^{3}$－$x^{2}$＋4x－4＝0 的解？（註：i＝$\sqrt{-1}$）
  options:
  - label: A
    content: －2i
  - label: B
    content: －i
  - label: C
    content: i
  - label: D
    content: '2'
  - label: E
    content: '4'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '設 f（x）＝$x^{3}$－$x^{2}$＋4x－4＝$x^{2}$（x－1）＋4（x－1）＝（x－1）（$x^{2}$＋4）

    解 f（x）＝（x－1）（$x^{2}$＋4）＝0

    方程式的解為 x＝1，x＝2i 或－2i

    故選(A)'
