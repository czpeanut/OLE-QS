- id: doc_111_新北_新北高中_數學_數乙_g12s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在複數平面上，設 z＝x＋yi（x，y 為實數），$\overline{z}$為 z 的共軛複數，選出正確的選項。
  options:
  - label: A
    content: z 與－z 對稱於實軸
  - label: B
    content: z 與$i\overline{z}$對稱於直線 y＝x
  - label: C
    content: ∣z＋$\overline{z}$∣＝2x
  - label: D
    content: ∣z∣$^{2}$＝$z^{2}$
  - label: E
    content: z 與$\overline{z}$對稱於虛軸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：z 與－z 對稱於（0，0）

    (B)○：∵$i\overline{z}$＝i．（x－yi）＝y＋xi

    ∴z 與$i\overline{z}$對稱於 y＝x

    (C)╳：∵z＋$\overline{z}$＝x＋yi＋x－yi＝2x

    ∴∣z＋$\overline{z}$∣＝∣2x∣＝2∣x∣

    (D)╳：∵∣z∣$^{2}$＝$x^{2}$＋$y^{2}$

    $z^{2}$＝$x^{2}$＋2xyi－$y^{2}$

    ＝（$x^{2}$－$y^{2}$）＋（2xy）i

    ∴∣z∣$^{2}$≠$z^{2}$

    (E)╳：z 與$\overline{z}$對稱於實軸

    故選(B)'
