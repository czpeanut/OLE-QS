- id: doc_111_新北_新北高中_數學_數乙_g12s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 設 f（x）是首項係數為 1 的實係數二次多項式。請選出正確的選項。
  options:
  - label: A
    content: 若 f(2)＝0，則 x－2 可整除 f（x）
  - label: B
    content: 若 f(2)＝0，則 f（x）為整係數多項式
  - label: C
    content: 若$f ( \sqrt{2} )$＝0，則$f ( -\sqrt{2} )$＝0
  - label: D
    content: 若 f（2i）＝0，則 f（－2i）＝0
  - label: E
    content: 若 f（2i）＝0，則 f（x）為整係數多項式
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵f(2)＝0，表 x－2 為 f（x）之一次因式

    ∴x－2 可整除 f（x）

    (B)╳：若 f(2)＝0，則 f（x）不一定為整係數多項式

    反例：f（x）＝$x^{2}-\frac{5}{2}x + 1$

    f(2)＝0，但 f（x）非整係數多項式

    (C)╳：反例：若 f（x）＝$x^{2}-x +( \sqrt{2} - 2 )$

    $f ( \sqrt{2} )$＝0，但$f ( -\sqrt{2} )$≠0

    (D)○：若 f（2i）＝0，根據虛根成對定理

    ∴f（－2i）＝0

    (E)○：承(D)，可知 f（x）＝（x－2i）（x＋2i）

    $\Rightarrow$f（x）＝$x^{2}$＋4 為整係數多項式

    故選(A)(D)(E)'
