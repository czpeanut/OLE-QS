  stem: 下列哪一個選項正確？
  options:
  - label: A
    content: $i +\frac{1}{i}$＝0
  - label: B
    content: 3i＞－3i
  - label: C
    content: $i^{2}+\frac{1}{i^{2}}$＝0
  - label: D
    content: 1＋i＋$i^{2}$＋$i^{3}$＋$i^{4}$＝0
  - label: E
    content: $\sqrt{i^{4}}$＝$i^{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$i +\frac{1}{i}$＝$i + \left( \frac{i}{-1} \right)$＝i－i＝0

    (B)╳：虛數無法比較大小

    (C)╳：$i^{2}+\frac{1}{i^{2}}$＝$( -1 )+ \left( \frac{1}{-1} \right)$＝－2

    (D)╳：1＋i＋$i^{2}$＋$i^{3}$＋$i^{4}$＝1＋i－1－i＋1＝1

    (E)╳：$\sqrt{i^{4}}$＝$\sqrt{1}$＝1≠$i^{2}$＝－1

    故選(A)'
