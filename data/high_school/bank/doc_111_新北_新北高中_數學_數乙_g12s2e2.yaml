- id: doc_111_新北_新北高中_數學_數乙_g12s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '設 z 為一複數，且$\frac{z - 2}{z + 2}$＝i（其中 i＝$\sqrt{-1}$為虛數單位）。試問 z 的絕對值∣z∣為

    下列哪一個選項？'
  options:
  - label: A
    content: $\frac{1}{2}$
  - label: B
    content: $\frac{\sqrt{2}}{2}$
  - label: C
    content: '1'
  - label: D
    content: $\sqrt{2}$
  - label: E
    content: '2'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '設 z＝a＋bi，其中 a，b 為實數

    則$\frac{z - 2}{z + 2}$＝$\frac{( a - 2 )+bi}{( a + 2 )+bi}$＝i

    $\Rightarrow$（a－2）＋bi＝－b＋（a＋2）i

    $\begin{cases}a - 2 =-b \\ b =a + 2\end{cases}\Rightarrow\begin{cases}a +b = 2 \\ a -b =-2\end{cases}$，可知 a＝0，b＝2，故 z＝2i

    ∴∣z∣＝2，故選(E)'
