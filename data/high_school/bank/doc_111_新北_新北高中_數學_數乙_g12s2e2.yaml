- id: doc_111_新北_新北高中_數學_數乙_g12s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設 a，b，c 皆為正整數，考慮多項式 f（x）＝$x^{4}$＋$ax^{3}$＋$bx^{2}$＋cx＋2。請選出正確的選項。
  options:
  - label: A
    content: f（x）＝0 無正根
  - label: B
    content: f（x）＝0 一定有實根
  - label: C
    content: f（x）＝0 一定有虛根
  - label: D
    content: f(1)＋f（－1）的值是偶數
  - label: E
    content: 若 a＋c＞b＋3，則 f（x）＝0 至少有一根介於－1 與 0 之間
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵a、b、c 皆為正整數

    若 x＝m＞0，則 f（m）必大於 0

    ∴f（x）＝0 無正根

    (B)╳：有可能是兩實根、兩共軛虛根

    或兩組共軛虛根

    (C)╳：有可能四根皆為實根

    (D)○：∵f(1)＝1＋a＋b＋c＋2

    f（－1）＝1－a＋b－c＋2

    ∴f(1)＋f（－1）＝2＋2b＋4＝2（1＋b＋2）為偶數

    (E)○：f（－1）＝1－a＋b－c＋2＝3－a＋b－c＝（b＋3）－（a＋c）＜0

    f(0)＝2＞0

    ∵f（－1）．f(0)＜0

    ∴f（x）＝0 至少有一根介於－1 與 0 之間

    故選(A)(D)(E)'
