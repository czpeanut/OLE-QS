- id: doc_111_新北_新北高中_數學_數乙_g12s2e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設實係數多項式 f（x）滿足 f（1＋i）＝5 與 f（i）＝10（其中 i＝$\sqrt{-1}$），且 f（x）除以（$x^{2}$－2x＋2）（$x^{2}$＋1）的餘式為 g（x）。請選出正確的選項。
  options:
  - label: A
    content: g（1＋i）＝5
  - label: B
    content: f（－i）＝－10
  - label: C
    content: g（x）除以 $x^{2}$－2x＋2 的餘式是一次多項式
  - label: D
    content: g（x）除以 $x^{2}$－2x＋2 的商式是 2x＋1
  - label: E
    content: g（x）＝$2x^{3}$－$7x^{2}$＋2x＋3
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '依題意，可知 f（x）＝（$x^{2}$－2x＋2）（$x^{2}$＋1）．$Q_{1}$（x）＋g（x）

    (A)○：f（1＋i）＝g（1＋i）＝5

    (B)╳：f（－i）＝f（i）＝10

    (C)╳：g（x）除以 $x^{2}$－2x＋2 的餘式為 g（1＋i）＝5 為零次多項式

    (D)○：∵f（i）＝g（i）＝10，且 g（1＋i）＝5

    ∴設 g（x）＝（$x^{2}$－2x＋2）（ax＋b）＋5

    g（i）＝（－1－2i＋2）（ai＋b）＋5＝10

    $\Rightarrow$（1－2i）（ai＋b）－5＝0

    $\Rightarrow$（2a＋b－5）＋（a－2b）i＝0

    $\begin{cases}2a +b = 5 \\ a -2b = 0\end{cases}$，可解得 a＝2，b＝1 ∴商式為 2x＋1

    (E)╳：g（x）＝（$x^{2}$－2x＋2）（2x＋1）＋5＝$2x^{3}$－$3x^{2}$＋2x＋7

    故選(A)(D)'
