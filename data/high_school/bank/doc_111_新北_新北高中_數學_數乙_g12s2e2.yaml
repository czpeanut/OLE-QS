  answer_status: verified
  answer_source: answer_key
  explanation: '設 8－6i 的平方根為 a＋bi，其中 a，b 為實數

    則（a＋bi）$^{2}$＝8－6i

    $\Rightarrow$（$a^{2}$－$b^{2}$）＋2abi＝8－6i

    $\Rightarrow\begin{cases}a^{2}-b^{2}= 8 \ldots \ldots \ldots \ldots \ldots ① \\ 2ab =-6 \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由②可知 b＝$-\frac{3}{a}$，代入①得$a^{2}- \left( -\frac{3}{a} \right) ^{2}$＝8$\Rightarrowa^{2}-\frac{9}{a^{2}}$＝8

    $\Rightarrowa^{4}$－$8a^{2}$－9＝0$\Rightarrow$（$a^{2}$－9）（$a^{2}$＋1）＝0

    解得 $a^{2}$＝9 或 $a^{2}$＝－1（不合）$\Rightarrow$a＝± 3

    故所求為 3－i 或－3＋i'
