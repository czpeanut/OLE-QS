  answer:
  - (1) $625$；(2) $27$；(3) $\frac{2}{3}$；(4) $0$
  answer_status: disputed
  answer_source: agent_fix
  explanation: '(1) $((-2)^2 - 2(-2) - 3)^4 = 5^4 = 625$。

