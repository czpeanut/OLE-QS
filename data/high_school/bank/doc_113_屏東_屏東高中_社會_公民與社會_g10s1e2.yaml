  stem: 根據資料一及搭配圖(一)，下列分析何者最適當？
  options:
  - label: A
    content: 因總統之選舉制度對大黨較有利，選民可能採取策略性投票，而出現棄保效應
  - label: B
    content: 該公職候選人之選舉制度對於小黨候選人較有利，故柯文哲將成為最大受益者
  - label: C
