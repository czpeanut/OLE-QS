- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 日本眾議院被甫剛上任的新任首相石破茂（自民黨總裁）解散，10 月初剛獲國會指名為新任首相的石破茂將創兩項戰後最短紀錄，分別是「就任 8 天後解散眾議院」及「就任 26 天後舉行眾議院大選投開票」。10 月底，國會舉行首相指名選舉，石破順利連任、獲指名為第 103 任首相。不過，自民黨及聯合執政黨的公明黨在眾議院席次未過半，面臨朝小野大局面，此時起跑的第 2 次石破內閣將面臨許多挑戰。下列有關日本政府體制的敘述，何者正確？
  options:
  - label: A
    content: 天皇簽署並公布法律後，需要對法案負責
  - label: B
    content: 閣揆即為首相，在政治運作上須要向國會負責
  - label: C
    content: 日本國家元首，擁有主動解散國會的權力
  - label: D
    content: 因自民黨未取得國會多數，故須組成分立政府
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 日本的政府體制為內閣制。(A)天皇為虛位元首，無需對法案負責。(B)內閣制中，首相需要向國會負責，為正解。(C)須由首相呈請元首才能解散國會。(D)分立政府是出現在總統制或混合制的國家，行政權跟立法權分屬於不同政黨的手上。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 2024 年 4 月南韓國會改選，路透社報導，最大在野黨共同民主黨（DP）預計將在新一屆國會的 300 席中拿下 170 多席。總統尹錫悅所屬執政黨國民力量（PPP）預計拿下約 100 席，意味著尹錫悅可望逃過國會遭到在野政黨以 2／3 絕對多數掌控的局面。這種局面可能會讓總統否決權失效，並通過憲法修正案。不過部分分析人士表示，尹錫悅在剩餘的 3 年任期很可能會陷入「跛腳鴨」境地。韓國憲法規定總統任期 5 年。以下何者是南韓政府體制的特色？
  options:
  - label: A
    content: 「跛腳鴨」呈現出行政立法分立特色
  - label: B
    content: 此時的韓國政府，屬一致政府的型態
  - label: C
    content: 國會通過的法律，須由總統進行副署
  - label: D
    content: 為尋求最新民意，總統可以解散國會
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 南韓為總統制國家。(B)行政立法分屬不同政黨，為分立政府，不為一致政府。(C)總統制中，沒有副署制度。(D)總統制中，沒有解散國會的制度。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '美國總統大選於 11 月 5 日登場，投票結果值得探究。以下為公民老師在 11 月 17 日於 Google 首頁搜尋到的資料（註：當時票尚未全部開完），請選出正確答案

    |  | 總統 | 參議院（共 100 席） | 眾議院（共 435 席） |

    | --- | --- | --- | --- |

    | 民主黨 | Harris（賀錦麗） | 47 席 | 212 席 |

    |  | 226 票選舉人票 |  |  |

    |  | 73,726,769 票普選票（48.3 ％） |  |  |

    | 共和黨 | Trump（川普） | 53 席 | 218 席 |

    |  | 312 票選舉人票 |  |  |

    |  | 76,422,867 票普選票（50.1 ％） |  |  |'
  options:
  - label: A
    content: 因美國採取間接選舉，故須依普選票數決定下任總統
  - label: B
    content: 從此次選舉結果可以得知，未來美國將出現分立政府
  - label: C
    content: 若川普要履行競選承諾，須至國會中親自提出法律案
  - label: D
    content: 由於行政與立法分立，故國務卿須參議院同意後上任
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)須依選舉人票數，獲得過半即可擔任下任總統。(B)依目前的選舉結果，共和黨在總統、眾議院及參議院中皆為多數，為一致政府。(C)總統制中，總統無法至國會親自提案。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '柚子上完政府體制的課程後，將英國、美國、我國的政府體制加以比較，但由於上課不專心，表格有誤植，下列何者完全正確？

    |  | 比較項目 | 英國 | 美國 | 我國 |

    | --- | --- | --- | --- | --- |

    | (A) | 國家元首與行政首長的關係 | 不同人擔任 | 同一人擔任 | 行政權由行政院長獨享 |

    | (B) | 議員是否可兼任閣員 | 可以 | 不可以 | 可以 |

    | (C) | 誰可以提出覆議權 | 無覆議權 | 總統 | 行政院 |

    | (D) | 是否具有倒閣權 | 有 | 沒有 | 沒有 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)我國行政權為總統跟行政院院長共享。(B)我國的議員無法兼任閣員。(D)我國有倒閣權。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 下圖為我國學者繪製的 3 種政府體制示意圖，下列敘述何者正確？
  options:
  - label: A
    content: 圖（a）為總統制，其內閣的閣員必須要同時兼任國會議員
  - label: B
    content: 圖（b）為內閣制，國會施政的好或壞需要向虛位元首負責
  - label: C
    content: 圖（c）的政府體制，同時出現行政立法分立與融合的特色
  - label: D
    content: 圖（c）為我國政府體制，且總統擁有主動解散國會的權力
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2/s1_5_f1.png
    crop:
      page: 2
      rect:
      - 182.25
      - 314.65
      - 501.8
      - 481.55
  explanation: 圖（a）有否決權，但國會無法對總統提不信任案，可判斷為總統制；圖（b）有虛位元首且可以解散國會及提不信任案，可判斷為內閣制；圖（c）人民可分別選出總統及國會，且國會可對行政部門提不信任案，為混合制。(A)總統制中，閣員無法兼任國會議員。(B)內閣施政向國會負責。(C)應是僅有行政立法分立的特色。(D)我國總統只有被動解散國會的權力。故此題無答案。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 2017 年土耳其通過修憲公投，將憲政體制由議會內閣制改為總統制，總統由普選產生且擁有更大行政權，由總統組成政府並任免各部會首長。俄烏戰爭期間，多國對俄羅斯實施經濟制裁，禁止俄國石油、天然氣等能源的進口。土耳其國內的反對黨，亦提出封鎖俄羅斯交通線的制裁方案，但執政黨基於該國能源高度依賴俄國，表明不會加入制裁俄羅斯的行列。請問若僅依據題文並從民主國家的政府體制特性加以判斷，下列何者最可能符合土耳其修憲後的政治運作？
  options:
  - label: A
    content: 總統執行各項政策的預算，仍須獲得國會審議通過
  - label: B
    content: 總統必須到國會說明外交政策，以表示對國會負責
  - label: C
    content: 總統所屬政黨若未獲國會過半席次，須組聯合政府
  - label: D
    content: 總統施政不佳時，國會可提出不信任案促使其下臺
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)總統無法至國會說明政策，也無須對國會負責。(C)總統可直接任命內閣，無須從國會多數黨中任命。(D)總統制中，無提出不信任案之制度。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 為表達對原住民族傳統的尊重，促進族群主流化發展，總統依據《憲法》及《赦免法》相關規定，批示同意特赦因獵捕野生動物而觸法的布農族原住民王光祿，免除其刑之執行，總統的這項決定，對於政府推動原住民族歷史正義與轉型正義工作，特別具有意義。依右圖〈總統令〉的特赦公告，虛線圈起來之處可用以佐 證我國憲政體制的何種特徵？
  options:
  - label: A
    content: 為內閣制特色，故總統的命令須向法務部長負責
  - label: B
    content: 為內閣制副署制度的展現，但總統仍有部分實權
  - label: C
    content: 屬於總統制的特色，由國家元首簽署並公布命令
  - label: D
    content: 屬於總統制的特色，由相關部會首長對法令副署
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2/s1_7_f1.png
    crop:
      page: 2
      rect:
      - 370.35
      - 736.35
      - 564.3
      - 841.65
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從總統令中，可看出此特赦令須經過行政院院長及相關部會首長之副署。因此可看出此為內閣制的特色，總統仍有部分實權，答案為(B)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 有學者主張：我國現行的中央政府體制設計，具有總統制的特徵。下列哪項制度設計最能支持此項主張？
  options:
  - label: A
    content: 內閣人選由行政院長提請總統任命，無須立法院同意
  - label: B
    content: 總統須向立法院提出國情報告，並接受立法委員質詢
  - label: C
    content: 立法院通過行政院長不信任案後，總統得解散立法院
  - label: D
    content: 某立法委員為了接任政務委員，須先辭去立委的職務
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)為內閣制的特色。(B)我國無此項制度。(D)總統制為行政立法分立，與此特色相符，為正解。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 4
  stem: 2024 年總統大選前夕，藍白兩黨不約而同提出要推動內閣制。一直以來，我國對於內閣制的討論存在著不同的聲音，例如：臺灣安全促進會會長認為，我國容易出現追求特權的情況，因此不適合採用內閣制。根據 2024 年選舉結果（總統由民進黨拿下，國會最大黨為國民黨，但未取得過半席次）判斷，若我國採行內閣制，憲政運作的可能情況何者正確？
  options:
  - label: A
    content: 總統召集內閣閣員定期開會，指揮各部會首長履行其競選時對選民的承諾
  - label: B
    content: 此時國會將形成聯合內閣，由國民黨與其他小黨合作以得到立法院的支持
  - label: C
    content: 由於總統與立法院分屬不同政黨，因此容易產生憲政僵局，影響施政效率
  - label: D
    content: 由於行政與立法具有融合的特色，因此制衡的力道會更加強烈，避免濫權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)對內由行政院院長負責，由其指揮部會首長。(B)符合現況運作，為正解。(C)我國仍設計不信任案與解散國會制度，不似總統制會陷入嚴重的行政僵局。(D)我國的行政與立法偏向分立，才能彼此制衡。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 4
  stem: 2022 年 6 月 24 日美國聯邦最高法院推翻了半世紀前「羅訴韋德案」（Roe v. Wade）墮胎合法化裁決，亦即女性墮胎權不再屬於聯邦憲法賦予的權利，是否允許墮胎的決定權將交給各州自行決定。關於美國中央與地方政府運作，下列敘述哪些正確？
  options:
  - label: A
    content: 州政府權限來自聯邦政府的授權，多受制於聯邦政府
  - label: B
    content: 聯邦成員先於國家存在，因此州政府享有獨立的主權
  - label: C
    content: 推翻羅訴韋德案前，各州可以自行決定是否允許墮胎
  - label: D
    content: 推翻羅訴韋德案後，墮胎權回到各州政府的概括權力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)美國偏向地方分權的聯邦制，地方權限較大。(B)國家仍是最高主權象徵，州政府在某些事物仍需依循聯邦政府的法規。(C)原本是由聯邦政府規範墮胎權。(D)由原本聯邦政府規範墮胎權，因此墮胎權回到州政府的概括權力，為正解。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 4
  stem: 康芮颱風雖已遠離，但颱風來襲的停班停課是否應由中央統一宣布，仍持續引發討論。行政院長卓榮泰表示，《天然災害停止上班上課相關辦法》已行之多年，地方政府已有相關機制因應，他已要求氣象署提供更精確、即時的資訊，提供地方政府做更正確的判斷。根據上述題文判斷，下列何項敘述較符合我國家中央與地方政府的互動關係？
  options:
  - label: A
    content: 若各縣市對於，宣布放颱風假屬中央或地方權限產生爭議，則應由立法院協調
  - label: B
    content: 若各縣市對防颱措施的要求與標準不同，地方自治法規應優先於中央法規適用
  - label: C
    content: 依均權制的精神，若認為放颱風假有全國一致之性質，地方政府可以自行決定
  - label: D
    content: 中央對地方具管轄權，得逕行宣告地方自治條例無效，顯示我國為聯邦制國家
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 我國採用均權制度，將事務性質全國一致性者歸中央，因地制宜者歸地方。即中央與地方權限的畫分原則。《憲法》第 111 條規定：「其事務有全國一致性者屬於中央，有全省一致之性質者屬於省，有一縣之性質者屬於縣，遇有爭議時，由立法院解決之。」答案為(A)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_12
  section: 1
