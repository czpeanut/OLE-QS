  - label: A
    content: 政府內部恐重演政策分歧，導致責任不明
  - label: B
    content: 內閣與國會任期重新起算，運作趨於穩定
  - label: C
    content: 國會議員的政治立場多元，施政較有效率
  - label: D
    content: 國王得依人民之要求，直接宣布解散國會
  group_stem: '歐洲某國採行與英國相同的政府體制，因政府內部對於移民政策出現重大分歧，具己黨黨籍的總理正式宣布內閣總辭、向國王遞交書面辭呈，並將擔任看守內閣直至新政府產生。於是原訂於 2025 年舉行的國會議員選舉，不得不提前至近日改選。該國國會共 150 席，並由 8 個政黨分別獲得席次，得席數右圖所示。

    若組閣原則是由最少政黨組成為目標，且不同政治傾向的政黨不會共事，中間政黨亦不加入任一聯盟。此外，由於己、庚 2 黨即因重大分歧而走向內閣總辭，因此己黨已率先表明不想再次與庚黨合作。'
  shared_asset: g1_21_22
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因為該國組成聯合政府，易使責任不明，為正解。(B)即使任期重新計算，也可以隨時提出倒閣案，仍無法穩定。(C)國會議員立場多元，需花較多時間溝通想法，較不具效率。(D)國王僅能在倒閣的前提或總理總辭的情形下，解散國會；無法依人民要求而解散國會。
