- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 9
  stem: 依據小芃蒐集的公投圖表資訊進行分析，請問 2021 年 4 大公投案的投票結果為何？
  options:
  - label: A
    content: 因為同意票大於全體 1／4，4 大公投案皆通過
  - label: B
    content: 因為不同意票較同意多， 4 大公投案皆不通過
  - label: C
    content: 因為投票率未過半， 4 大公投案皆判定為無效
  - label: D
    content: 因為未顯示投票權人總數，無法分析通過與否
  group_stem: '以下為高中生小芃針對我國在 2021 年 4 大公投案所作專題報告的部分內容：

    「2021 年 12 月 18 日舉行全國性公民投票案，有重啟核四、反萊豬進口、公投綁大選，還有珍愛藻礁等 4 項公投議題登場，只要為年滿 18 歲且未受監護宣告者，並在各直轄市縣市持續居住滿 6 個月以上的民眾皆有投票權；而此次 18 歲以上未滿 20 歲的首投族約有 40 萬人，皆可對攸關我國發展的議題投下重要的一票。其中，此次 4 項公投議題皆是由人民提案後逕自交付公民投票，充分展現主權在民、行使直接民主的精神。

    然而，依據我國《公民投票法》規定，公投結果起 2 年內不得針對同一事項重行提出公投；換言之，政府可在該事項公投 2 年後違反該次公投結果，使得公投結果淪為 2 年的賞味期，民主精神大打折扣。

    綜上所述，不論政府是否履行公投結果、或是否沒收公投結果，仍無法抹滅公民投票的本質，與民主國家中擁有公民投票制度的必要性。下列 2 圖為中央選舉委員會公告該次公民投票結果及其投票率。」'
  shared_asset: g1_27_28
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 現行公民投票案之通過條件：有效同意票達投票權人總額 1／4 以上，且有效同意票超過不同意票，即為通過。(A) 4 個公投案的不同意票皆多於同意票比例。(C)通過與否與投票率無直接關聯。(D) 4 個公投案的不同意票皆多於同意票比例，所以皆未通過。
