  group_stem: '資料一：2024 年 1 月 13 日進行我國第 16 屆總統副總統及第 11 屆立法委員選舉，圖(一)、圖(二)分別為此次選舉結果。選前某民調中心公布此次總統大選之民調結果，但學者提醒，公布民調結果須非常謹慎，因為容易引起選民的策略性投票。

