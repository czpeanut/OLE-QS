  - label: D
    content: 在此次選舉過程當中，會出現同黨候選人競爭之情況，政黨故而啟動配票策略
  group_stem: '資料一：2024 年 1 月 13 日進行我國第 16 屆總統副總統及第 11 屆立法委員選舉，圖(一)、圖(二)分別為此次選舉結果。選前某民調中心公布此次總統大選之民調結果，但學者提醒，公布民調結果須非常謹慎，因為容易引起選民的策略性投票。

    資料二：選前有媒體分析，柯文哲宣示以「聯合政府、團結臺灣」啟動大選環臺活動，獲得部分人的認同；然而若以現實面來看，仍有許多挑戰。首先，其雖規劃出「三足鼎立」的國會政黨版圖，民眾黨能否發揮作用，需依照兩大黨最終選舉結果而定。再者，「藍白合」的區隔投票，民眾黨區域立委提名席次極其有限，因此藍白合一旦破局，可能影響在野政黨的制衡力量。最後，雖然柯陣營想引進內閣制做為改變臺灣政治文化的社會運動，但依照我國現行憲政體制而言，藍白合可能受到許多挑戰。'
  shared_asset: g1_25_26
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)總統選舉為單一選區相對多數決制，有利大黨，會產生棄保效應，為正解。(B)應是對大黨有利。(C)正副總統為聯名登記參選，因此一選區仍僅選出 1 組人馬，為單一選區制度。(D)因為僅有 1 組人馬當選，所以 1 個政黨只會推出 1 組候選人，不會產生同黨競爭之情形。
