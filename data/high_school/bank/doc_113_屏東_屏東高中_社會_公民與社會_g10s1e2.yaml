    content: 降低立法院對於總統彈劾提案權的通過門檻
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)現行制度即有此設計。(B)此為內閣制特色，為正解。(C)覆議為總統制的特色。(D)此為內閣制特色，為正解。(E)此與內閣制的制度設計無關。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s2_30
  section: 2
  number: 30
  type: multiple
  page: 9
  stem: 我國 2022 年稅收超徵約新臺幣 4,500 億元，朝野跨黨派立法委員呼籲應「還稅於民」。社會上各有不同意見，諸如直接發現金、發放消費券，也有學者主張應先償還國債。總統府與行政院最終決議將每人發放新臺幣 6,000 元。因此行政院必須提出特別條例送立法院審議，做為法源依據；進而再編列特別預算送交立法院審查。若我國政府體制屬「總統制」，則總統、行政院院長與立法院的互動，何者正確？
  options:
  - label: A
    content: 總統須透過同黨立法委員向立法院提出特別條例的法案
  - label: B
    content: 行政院院長或部會首長須出席立法院院會並為政策備詢
  - label: C
    content: 總統任命內閣閣員時，需要經過立委的同意才可以上任
  - label: D
    content: 特別條例通過後，經行政院院長副署、總統分布後生效
  - label: E
    content: 總統上任後，須向人民負責，亦需要同時向立法院負責
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因為總統不能至國會提案，所以須透過同黨議員提案，為正解。(B)此為內閣制特色。(C)為總統制特色，為正解。(D)此為內閣制特色。(E)總統無需向立法院負責，僅需向人民負責。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e2_s2_31
  section: 2
  number: 31
  type: multiple
  page: 10
  stem: '甲、乙、丙 3 國的國會議員選舉採行不同選舉制度，這 3 種制度亦存在於我國中央與地方民意代表選舉中。下表是這 3 國最近一次國會選舉的資料，依據該表，關於這 3 國選舉制度的運作，下列哪些推論合理？

    |  | 甲國 | 乙國 | 丙國 |

    | --- | --- | --- | --- |

    | 全國應選名額 | 200 | 250 | 300 |

    | 全國參選人數 | 600 | 500 | 1,500 |

    | 選區數目 | 200 | 100 | 1 |

    | 女性當選人數 | 100 | 125 | 150 |

    | 無黨籍當選人數 | 8 | 35 | 0 |'
  options:
  - label: A
    content: 甲國小黨候選人在選舉中當選的機會低於乙丙兩國
  - label: B
    content: 乙國候選人即使在選區中獲得次高票，亦可以當選
  - label: C
    content: 甲乙丙的選舉制度皆具有女性保障名額的制度設計
  - label: D
    content: 甲乙兩國各政黨之間的選舉競爭程度明顯低於丙國
  - label: E
    content: 丙國各政黨得票與席次率的吻合程度高於甲乙兩國
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 從選區數目與應選名額，可得知甲國為單一選區制度；乙國為複數選區制度；丙國為比例代表制。(A)單一選區制度有利大黨，因此小黨當選機率較低，為正解。(B)複數選區一選區會有多人黨選，因此無需獲得最高票，為正解。(C)從題幹訊息無法得知。(D)選舉制度與各政黨間的競爭程度無必然之關聯。(E)比例代表制相較於單一選區及複數選區，其票數與席次較為相符，為正解。
