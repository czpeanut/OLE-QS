- id: doc_111_屏東_屏東高中_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 日治中期的政治社會運動中，有一團體被左派咒罵為「理該碎屍萬段」的「騙賊」，但此團體卻是日本當局最能容忍的一個，也是唯一令臺灣總督府政策稍作改變的團體，這是指哪個團體？
  options:
  - label: A
    content: 臺灣議會期成同盟會
  - label: B
    content: 臺灣地方自治聯盟
  - label: C
    content: 臺灣民眾黨
  - label: D
    content: 臺灣文化協會
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)於 1923 年治警事件遭取締。(C)(D)皆因立場偏左而於 1931 年遭總督府取締。只有(B)臺灣地方自治聯盟以合法手段推動臺灣的政治自由與地方自治，並促成 1935 年總督府開放有限度的地方選舉，因此才被左派咒罵為「騙賊」。

    7.1992 年政府公布《二二八事件研究報告》，1995 年由李登輝總統代表政府向受難者家屬道歉，並陸續立法回復受難者名譽與補償，1998 年通過《戒嚴時期不當叛亂暨匪諜審判案件補償條例》，針對白色恐怖進行補償，答案選(A)。

    8.1954 年簽訂《中美共同防禦條約》，臺灣正式加入美國在太平洋設立的反共陣線，答案選(C)。(A) 1949 年美國所發表，使臺美關係盪到最低點。(B) 1950 年韓戰爆發後，美國派遣第七艦隊協防臺灣，臺美關係恢復正常。(D) 1979 年臺美斷交，美國國會立法維持美國與臺灣民間的往來。

    9.從臺灣各方面的情形都比內地好，可見此「內地」並非日本，而是中國大陸，因此這段文字的撰寫者應是(C)光復初期來臺工作的中國記者。

    10.連溫卿主張階級鬥爭，支持激烈的農工運動，故而林獻堂、蔡培火、蔣渭水等人才相繼退出臺灣文化協會，因此(A)為正解。

    11.隨著中蘇交惡及越戰陷入困境，使美國急欲「聯中制蘇」，因此有一連串的乒乓外交、讓中華人民共和國取得聯合國的中國代表權、總統訪美等外交舉動，這個中、美要聯手孤立的國家為(C)蘇聯。

    12.(C) 1947 年的二二八事件使菁英階層噤若寒蟬、對公共事務冷漠，也造成嚴重的族群衝突。二二八事件的受害者多為臺籍菁英，加上日後的白色恐怖，使臺灣人從此普遍對參與政治感到恐懼。

    13.「野百合學運」提出四大訴求，獲得李登輝總統的正面回應，1991 年政府宣布終止動員戡亂時期，並廢止《臨時條款》，回歸正常憲政體制，第一屆中央民意代表也終止職權，促成(D)中央民意代表的全面改選。(A) 1987 年已解除戒嚴。(B) 1969 年已有中央民意代表增額補選。(C) 1987 年解嚴後已實施。

    14.這個街頭抗議事件與選舉舞弊有關，可推知為 1977 年的(B)中壢事件。

    15.聲明者痛心自己成立的文化協會，被「二三野心家」所打破，因此「自行引退」，可推知應為蔣渭水、蔡培火、林獻堂等人的聲明，他們在退出臺灣文化協會後另成立(A)臺灣民眾黨。

    16.從「五十一年婢僕垂死重生」一句，可知作者為「日本戰敗，臺灣回歸中華民國」而欣喜，答案選(D)。

    17.《六三法》撤廢運動原本的目標是撤廢《六三法》，讓臺灣能與日本本土處於相同的體制，但有部分留日學生認為同化主義會抹煞臺灣的獨特性，轉而主張殖民地自治，並展開臺灣議會設置請願運動，答案選(D)。

    18.此俗諺有提到「火車」以及準確的到站時間，因此反映的現象為(D)。

    19.王得祿出生於嘉義縣，在林爽文事件之前，當地原名為(B)諸羅縣。

    20.題幹所述的政治抗爭運動，主要由士紳階級所發起，目標在追求臺灣自治，因此答案為(D)臺灣議會設置請願運動。(A)(B)並非士紳階級的政治運動。(D)此非臺人的抗爭，而是總督府的打壓事件。

    21.在國語政策之下，臺灣原有的方言遭到打壓，因此 1988 年發起的「還我母語遊行」，目的即在要求政府(A)重建多元的語言政策，爭取客語可在公開媒體中使用。日後行政院成立客家委員會，並有客家電視臺的成立。

    22.文告內容強調「為保民起見」，所以「改臺灣為民主之國」，因此可推知為割臺之議已成，臺灣民眾不願被日本接收，於是成立「臺灣民主國」以自保，(A)為正解。

    23.1938 年中日戰爭已正式開打，臺灣作為日本的殖民地，自然也被納入戰時總動員的一環，因此推動的各項措施，無一不為戰爭而準備，(A)為正解。

    24.題幹提到臺日生已能共學，但日籍學生占絕大多數，可見日本的殖民教育中，仍然呈現明顯的臺日差別待遇，(B)為正解。(A)臺日共學為 1922 年新《臺灣教育令》實施後。(C)從學生比例可看出臺灣學生無法和日本學生平等。(D)此時總督府實施內地延長主義。

    25.從「希望醇化臺人」，進而「使臺灣與內地無異」，可知這位總督最可能為(C) 1919 年來臺的文官總督田健治郎，開始在臺實施同化政策，推行「內地延長主義」。

    26.由於《舊金山和約》裡僅提出日本必須放棄臺灣、澎湖，但並未明確交代臺灣的歸屬，因此才導致「臺灣地位未定論」的爭議，答案選(D)。

    27.黃信介、施明德、姚嘉文、張俊宏、許信良等人，皆為 1979 年高雄美麗島事件的相關人士，因此題目中的雜誌即(D)《美麗島》雜誌。

    28.題幹所述為日治時期臺灣文化協會啟迪民智，推廣新知的方式，(B)為正解。

    29.文中的「非常時期」被規定「不宜另結『新黨』」，可見得所謂的「非常時期」係指實施黨禁的「戒嚴時期」。由於文中提到「『非常時期』已經過了十幾年」，可推知這篇文章應發表於 1960 年代前後，最可能導致的事件為(A)雷震事件，事後《自由中國》雜誌被迫結束。(B) 1979 年。(C) 1987 年。(D) 1991 年。

    30.1930 年代日本軍國主義氣氛瀰漫，政府當局對人民集會、結社與言論管控更趨嚴格，凡是左傾的社運團體皆嚴加取締，因此 1931 年後許多社運團體逐漸面臨打擊而結束，(D)為正解。

    31.1950 年前期，共軍的進攻一直非常順利，本應該乘勢追擊，但後來卻取消進攻計畫，必是發生更迫切的事件，當時能影響中華人民共和國的事件即 6 月分爆發的韓戰，美國的介入與蘇聯要求中國出兵，都可能影響共軍對臺海的進攻計畫，(C)為正解。

    32.高先生口述的諸多學校中，僅一中、二中、臺北高等學校為普通中學校、高校，其他皆為專門技術學校，可知日治時期總督府的教育政策以(C)發展技職教育為主要目標。

    33.由臺灣的位置地處熱帶，又介於東方太平洋及華南、南洋諸民間之間，能提供多方面的自然人文科學研究，可見得臺北帝國大學成立的目的之一，是為配合南進政策，成為(A)日本往南發展的學術中心。

    34.黃俊雄布袋戲曾經造成臺灣電視史上的收視巔峰，風靡一時，但因(D)與政府推行的國語政策相違背，儘管黃俊雄塑造出一個「中國強」的角色加入，甚至改用國語配音，最後仍遭政府當局下令禁播。

    35.從「專賣局肇事官員」、「被害者家屬已予賠償」、「改革政府本部，以便盡可能納入本省人民」等句，可推知應是二二八事件後的善後措施，因此為(A)陳儀與「二二八事件處理委員會」協調後的結果。

    36.賽沖阿回報的「蛤仔爛地方」為宜蘭，「蔡逆素」為海盜蔡牽，因此(B)為正解。

    37.此文件內容強調維持「美國人民」與「臺灣人之民間」往來的各種關係，同時也要維持與「中國大陸人民」的關係，因此為(C)美國與中華民國斷交後，由美國國會所通過的《臺灣關係法》內容。

    38.1943 年開羅會議決議日本戰後必須歸還臺灣、澎湖等地給中華民國，蔣介石回國後即成立臺灣調查委員會，為日後接收臺灣而準備，(B)為正解。

    39.題幹所述為 1923 年「治警事件」的背景，這些請願人士被總督府以違反《治安警察法》為由遭到逮捕，答案選(D)。(A)國會議員不予理會，請願運動持續到 1934 年。(B)未有此事。(C)臺灣民眾黨係因臺灣文化協會分裂而成立，與請願運動無關。

    40.題幹所述為 1925 年彰化的「二林事件」，隔年簡吉等人成立臺灣農民組合，持續為農民抗爭，(C)為正解。(A)開啟日治時期的農民運動。(B)資本家並未退讓，因此臺灣各地陸續出現農運團體。(D)日本政府直到 1931 年才下令解散臺灣農民組合。

    41.甲為《法三號》，乙為《六三法》，丙是《三一法》，故(D)為正解。

    42.附表為民眾與警察人數的比率，可以看出臺灣的警察密度最高，顯示日本對臺灣的控制最為嚴密，答案選(B)。(A)(C)日本不可能比其他三地區落後。(D)臺灣、朝鮮、關東州（指日本在中國遼東半島南端的一個租借地）尚未工業化，工業用電與民生用電比率不可能如此懸殊。

    43.1924 年後的輸出與輸入皆大幅成長，應與日本統治者在臺灣的交通建設改善有關，讓臺日之間的交流往來頻繁，(D)為正解。(A)(B)皆非日治時期，時間不符合。(C)殖民體制的確立指政治控制的手段，與對外貿易的關聯性不如(D)選項強。

