  type: single
  page: 1
  stem: 某高中二年級的學生朋棋正在規劃今年寒假的行程，爸爸建議利用寒假在叔叔的店鋪打工，可以賺取二萬元，媽媽建議喜愛 NBA 的朋棋，可報名參加一個前往美國加州深度體驗當地籃球文化的冬令營，媽媽願意贊助朋棋機票，但他須自行負擔冬令營費用。因為寒假時間有限，朋棋希望從上述兩種方式中選擇一個來度過他的寒假，下列哪一情況的發生會增加朋棋選擇替叔叔工作的機會成本？
  options:
  - label: A
    content: 朋棋的叔叔因生意不佳，將朋棋的工資調降為一萬八千元
  - label: B
    content: 加州政府宣布補助 NBA 文化籃球冬令營，使參加費用下降
  - label: C
    content: 加州 NBA 冬令營改變行程，取消朋棋喜愛的球星見面餐會
  - label: D
    content: 朋棋的叔叔已同意聘請朋棋的基友君凱，與朋棋一起工作
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 加州政府宣布補助 NBA 文化籃球冬令營，使參加費用下降，表示放棄冬令營的機會成本上升，故選(B)。(A)若叔叔將朋棋的工資調降為一萬八千元，則朋棋替叔叔工作的收入減少，放棄冬令營的機會成本下降。(C)(D)朋棋替叔叔工作的機會成本下降。
