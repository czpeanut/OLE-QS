  stem: '全臺灣最知名的香蕉產地在高雄市旗山，而新北市坪林則以種植包種茶聞名。假設兩地皆可種植香蕉或包種茶，在不考慮其他條件下，每年可生產兩種作物的情形如附表，而兩地生產可能曲線皆為負斜率之直線。由上文之資訊判斷，下列情況何者最「不可能」發生？

    | （單位：公斤） | 旗山 | 坪林 |

    | --- | --- | --- |

    | 香蕉 | 500 | 150 |

    | 包種茶 | 200 | 750 |'
  options:
  - label: A
    content: 旗山專業化種植香蕉，並願以 150 公斤香蕉與坪林換得 60 公斤包種茶
  - label: B
    content: 旗山專業化種植香蕉，並能以 200 公斤香蕉向坪林換得 70 公斤包種茶
  - label: C
    content: 坪林專業化種植包種茶，並在貿易後消費 650 公斤包種茶與 250 公斤香蕉
  - label: D
    content: 坪林專業化種植包種茶，並在貿易後消費 550 公斤包種茶與 350 公斤香蕉
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
