  stem: 到日本留學的千鈺原本就很喜歡喝珍珠奶茶，但因市面上手搖飲店珍珠奶茶價格很高，使她也會選擇去賣場用較少的錢購買紅茶跟鮮奶回家自行調配成紅茶拿鐵來喝。對千鈺而言，下列敘述何者最適當？
  options:
  - label: A
    content: 千鈺對珍珠奶茶的願付價格比對紅茶拿鐵來得高
  - label: B
    content: 當珍珠奶茶的價格提高，千鈺對紅茶及牛奶的需求會增加
  - label: C
    content: 千鈺獲得獎學金後才會買珍奶，對千鈺而言珍奶屬劣等財
  - label: D
    content: 購買珍奶的開銷是消費支出，購買紅茶跟鮮奶是成本支出
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 紅茶拿鐵是珍珠奶茶的替代品，故當珍珠奶茶的價格提高，千鈺會減少珍奶的需求量，轉而多買紅茶及牛奶，故紅茶和牛奶的需求會增加，(B)正確。(A)千鈺對珍珠奶茶的願付價格低於日本珍奶的售價。(C)千鈺獲得獎學金後才會買珍奶，對千鈺而言珍奶屬正常財。(D)購買珍奶及紅茶、鮮奶的開銷都是消費支出。
