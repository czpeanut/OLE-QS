  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 消費者現在紛紛搶購羽絨外套、發熱衣，是屬於需求增加，為線的移動，故選(B)。(A)題幹所述為線的移動。(C)消費者沒有銷貨收入。(D)需求量是受價格影響，屬點的移動。
