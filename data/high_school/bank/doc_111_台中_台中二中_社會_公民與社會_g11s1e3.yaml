  section: 1
  number: 5
  type: single
  page: 1
  stem: 根據中央氣象局資料顯示，周六補班日冷氣團來襲轉乾冷，入夜低溫下探 12 度，中部以北可望下探 10 度。消費者現在紛紛搶購羽絨外套、發熱衣，做好保暖準備。依據內容判斷，下列敘述何者最合理？
  options:
  - label: A
    content: 保暖用品產生需求線上點的移動
  - label: B
    content: 消費者對保暖用品的需求會增加
  - label: C
    content: 消費者買保暖用品的銷貨收入增加
  - label: D
    content: 反映消費者對保暖衣物需求量增加
