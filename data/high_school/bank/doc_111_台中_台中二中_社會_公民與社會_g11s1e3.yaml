  section: 1
  number: 4
  type: single
  page: 1
  stem: 阿恩在紐西蘭開了一間生產綿羊油與羊毛圍巾的工廠，飼養的羊隻讓她能同時產出兩種製品，利潤頗豐。下列何種市場上的變化，不會影響阿恩對羊毛圍巾的供給？
  options:
  - label: A
    content: 其他生產羊毛圍巾的工廠變多
  - label: B
    content: 綿羊油在市場上價格急遽上漲
  - label: C
    content: 羊毛圍巾本身的價格發生變動
  - label: D
    content: 編織羊毛圍巾的人力成本提高
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 羊毛圍巾的價格上漲，只會影響羊毛圍巾的供給量變動，而不是供給變動，故選(C)。(A)產羊毛圍巾的工廠變多，羊毛圍巾供給增加，阿恩面臨激烈競爭。(B)綿羊油與羊毛圍巾是供給上的互補品，故綿羊油在市場上價格急遽上漲，羊毛圍巾供給增加。(D)編織羊毛圍巾的人力成本提高，羊毛圍巾供給減少。
