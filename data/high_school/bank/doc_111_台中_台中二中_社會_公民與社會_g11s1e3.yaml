  stem: 樂桃桃網購平臺的促銷方式採取「限時限量」的低價優惠，讓消費者在指定時間內進入網購平臺搶購商品，刺激出成長 10 ％的銷售額。請問網購平臺採取此促銷方式的原因最可能為何？
  options:
  - label: A
    content: 運用需求法則和限量，刺激消費者購物
  - label: B
    content: 降低消費者對於非熱銷商品的願付價格
  - label: C
    content: 網購平臺抱持回饋消費者心態虧本出售
  - label: D
    content: 低價促銷的價格比廠商願售價格還要低
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 網購平臺的促銷方式採取「限時限量」的低價優惠，屬於價格下降，需求量提高的需求法則，故選(A)。(B)低價優惠未降低消費者的願付價格，而是增加消費者剩餘。(C)網購平臺不會虧本出售。(D)低價促銷的價格仍高於廠商願售價格。
