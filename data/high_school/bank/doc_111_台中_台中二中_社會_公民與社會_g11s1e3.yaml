- id: doc_111_台中_台中二中_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據專家指出，地瓜葉有相當高的營養成分，對人的健康有許多益處，因此民眾開始增加食用，農民也紛紛增加種植地瓜葉。下列供需變動的案例何者與地瓜葉的例子最相似？
  options:
  - label: A
    content: 嘉義市政府觀光行銷成功，大批遊客造訪，同時吸引商家進駐
  - label: B
    content: 因美伊戰爭爆發，使石油產量減少，其後戰事緩和，價格回升
  - label: C
    content: 去年某年貨大街的買氣旺，因此造成今年年貨大街的攤商租金上漲
  - label: D
    content: 套房因距離預定捷運站不遠而買氣升高，但政策預算沒過買氣下降
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 民眾開始增加食用地瓜葉，表示需求增加；農民也紛紛增加種植地瓜葉，表示供給增加，故與(A)相似。(B)供給減少，供給增加。(C)年貨需求增加，攤位需求增加。(D)需求增加，需求減少。
