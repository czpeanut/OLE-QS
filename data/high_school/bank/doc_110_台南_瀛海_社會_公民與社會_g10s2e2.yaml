  type: single
  page: 3
  stem: 根據《司法院釋字第382號解釋》，學生若有資格提起訴訟，第二審法院最可能是以下何者？
  options:
  - label: A
    content: 地方法院普通庭
  - label: B
    content: 地方法院行政訴訟庭
  - label: C
    content: 高等行政法院
  - label: D
    content: 最高行政法院
  group_stem: '(二)以下是有關學生人權的三則釋憲文摘要：

    1. 釋字第382號（1995年）：各級學校依有關學籍規則或懲處規定，對學生所為退學或類此之處分行為，足以改變其學生身分並損及其受教育之機會，自屬對人民憲法上受教育之權利有重大影響，受處分之學生於用盡校內申訴途徑未獲救濟者，自得依法提起訴願及行政訴訟。

    2. 釋字第684號（2011年）：大學為實現研究學術及培育人才之教育目的，並維持學校秩序，對學生所為行政處分或其他公權力措施，<u>如侵害學生受教育權或其他基本權利，即使非屬退學或類此之處分，本於憲法第16條有權利即有救濟之意旨，仍應許權利受侵害之學生提起行政爭訟</u>。

    3. 釋字第784號（2019年）：各級學校學生認其權利因學校之教育或管理措施而受侵害時，即使非屬退學或類此之處分，亦得按相關措施之性質，依法提起相應之行政爭訟程序以為救濟。'
  tags:
