  stem: 2014年3月18日我國發生「太陽花學運」，參與抗議的民眾從立法院轉進行政院，事後爆發驅離濺血的事件。臺北地方法院於2019年10月一審宣判，臺北市政府警察局應賠償原告14個人共新臺幣111萬元。法院判決理由指出：「行政院院區及周邊是《集會遊行法》所定集會遊行之『禁制區』，然於禁制區之非法集會，於強制驅離時，仍應依現場情形决定如何使用警械。原告之傷害因警察執勤過當而施以暴力所致，原告請求賠償應屬有理。」法院認定臺北市政府警察局應賠償原告，其理由最可能與以下何種行為違反的原理原則相同？
  options:
  - label: A
    content: 政府為避免勞保破產，修法調降勞工退休金，卻無漸進過渡措施
