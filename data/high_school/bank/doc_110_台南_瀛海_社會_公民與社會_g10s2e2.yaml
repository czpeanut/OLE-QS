  group_stem: '(一)臺中市有一位計程車司機，在路口禮讓公車先行後左轉，遭執勤警員攔下開單闖紅燈，該司機出示行車記錄器拍攝畫面證明清白，但執勤員警態度惡劣並拒看。計程車司機在臉書「爆料公社」貼出行車畫面，證明自已未闖紅燈，指「警察栽贓」害他損失2,700元。網友一片撻伐後，開單的警員在內部調查時也承認錯誤，他解釋，當時與計程車距離約80公尺，有看「紅燈左轉」，沒再看行車記錄器畫面。

    臺中市警方因此認錯道歉並撤銷罰單，且已主動函請臺中市交通事件裁決處撤銷罰單，並將加強警員法學素養及執勤態度；警員行政缺失部分由交通組調查懲處。根據「警察機關舉發及處理違反道路交通管理事件考核獎懲規定」，警員開單有違失，依情節輕重可處申誡、劣績。'
