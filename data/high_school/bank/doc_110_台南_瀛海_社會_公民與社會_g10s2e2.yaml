    2. 釋字第684號（2011年）：大學為實現研究學術及培育人才之教育目的，並維持學校秩序，對學生所為行政處分或其他公權力措施，如侵害學生受教育權或其他基本權利，即使非屬退學或類此之處分，本於憲法第16條有權利即有救濟之意旨，仍應許權利受侵害之學生提起行政爭訟。

    3. 釋字第784號（2019年）：各級學校學生認其權利因學校之教育或管理措施而受侵害時，即使非屬退學或類此之處分，亦得按相關措施之性質，依法提起相應之行政爭訟程序以為救濟。'
