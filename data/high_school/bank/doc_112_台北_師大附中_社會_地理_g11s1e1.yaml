- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 階梯井是印度常見的一種蓄水設施，這些大型蓄水池的邊緣經常有階梯或迴廊方便取水者走到池底，甚至有許多階梯井和寺廟建築或雕刻融合，兼具藝術價值和實用性。請問這些階梯井是為了配合印度的什麼環境特性？
  options:
  - label: A
    content: 農業仰賴灌溉
  - label: B
    content: 自來水普及率低
  - label: C
    content: 年降水量不足
  - label: D
    content: 降水時間分配不均
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)印度階梯井主要分布在印度西北部，源於當地降水不足，為取得珍貴地下水源而鑿建的古老蓄水設施。後與寺廟建築結合，亦為當地儲存珍貴水資源並供公眾使用。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 1,500B.C.，由中亞侵入印度次大陸的雅利安人擊敗達羅毗荼人，使後者四處流亡或遷居。請問下列哪種語言既屬於達羅毗荼語系，也同時被新加坡列為官方語言？
  options:
  - label: A
    content: 藏語
  - label: B
    content: 印地語
  - label: C
    content: 馬來語
  - label: D
    content: 泰米爾語
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)新加坡的多元移民背景使得其承認 4 種官方語言，包括英語、華語、馬來語及泰米爾語。其中，新加坡的印度移民主要來自印度半島南部的達羅毗荼族群，占新加坡總人口約
    10 ％，故其所流通的泰米爾語便被列入其官方語言之一。(B)印地語為印度目前的官方語言之一，其屬於雅利安語系。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: '下列有關南亞、西亞、澳洲 3 個區域內主要沙漠的相關資料，何者不正確？

    |  | (A) | (B) | (C) | (D) |

    | --- | --- | --- | --- | --- |

    | 南亞塔爾沙漠 | 熱帶沙漠 | 副熱帶高壓籠罩 | 沿岸有涼流流經 | 以旱作為主 |

    | 西亞內夫得沙漠 |  |  |  |  |

    | 澳洲中西部沙漠 |  |  | 沿岸有寒流流經 | 以牧牛為主 |'
  options:
  - label: A
    content: 南亞塔爾沙漠：熱帶沙漠
  - label: B
    content: 南亞塔爾沙漠：副熱帶高壓籠罩
  - label: C
    content: 南亞塔爾沙漠：沿岸有涼流流經；澳洲中西部沙漠：沿岸有寒流流經
  - label: D
    content: 南亞塔爾沙漠：以旱作為主；澳洲中西部沙漠：以牧牛為主
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)南亞塔爾沙漠位於印度半島西北部、西亞內夫得沙漠位於沙烏地阿拉伯北部，因居內陸加上副熱帶高壓籠罩，使此兩地區氣候屬於典型的熱帶乾燥型態；澳洲中西部沙漠氣候乾燥的
    3 個因素為：受副熱帶高壓籠罩、大分水嶺阻擋東南信風水氣、西部沿海有西澳涼流流經。
