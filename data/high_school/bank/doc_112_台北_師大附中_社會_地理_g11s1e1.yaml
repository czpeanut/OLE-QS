questions:
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 東南亞 11 國人口約 6.5 億，存有近 1,200 種語言，造成如此語言多樣性的主要地理因素為何？
  options:
  - label: A
    content: 位處貿易必經路線
  - label: B
    content: 盛行風向隨季節變化
  - label: C
    content: 人口皆聚集於河口三角洲
  - label: D
    content: 海域、河流、山脈造成阻隔
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)東南亞的中南半島屬於中國橫斷山脈向南延伸之區域，南北縱向的高山與河流造成交通阻隔；東南亞的南洋群島，因大量群島散布於太平洋上，彼此間往來交通不易。上述自然因素帶來的交通阻隔，塑造出東南亞自古以來的族群、語言及文化的多樣性。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 潑水節是許多東南亞國家的傳統新年，這些國家經常把這個節日稱為「Songkran」，意為通過舊年分、展開新的一年之涵義。請問舉辦潑水節時，當地通常會有什麼樣的天氣特徵？
  options:
  - label: A
    content: 氣溫介於攝氏 20 ～ 25 度，是一年中最舒適的季節
  - label: B
    content: 盛行東北季風導致天氣乾燥晴朗
  - label: C
    content: 午後對流旺盛，常有強烈雷陣雨
  - label: D
    content: 處於季風轉換期，較為乾燥且氣溫較高
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)潑水節位於每年 4 月初，正值季風轉換時節，溫度升高但降水未至。故透過潑水寓意新年祝福的機會，也能達到消暑之效。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 金門后浦老街有一家創業於 1832 年的「存德藥房」，除了經營藥材買賣之外，過去也提供替海外工作的金門人匯款給家鄉的親屬或代寫書信等服務，是金門游子在家鄉最堅強的支柱。請問這些人早年最不可能前往何處工作？
  options:
  - label: A
    content: 加州
  - label: B
    content: 汶萊
  - label: C
    content: 棉蘭
  - label: D
    content: 新加坡
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 早期金門遊子多前往東南亞尋求創業的機會，便將閩南文化傳往東南亞，與當地文化混成後形成特殊文化景觀，故選(A)。(C)棉蘭為印尼蘇門答臘島上第一大城。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 咖啡店 Kopitiam 是咖啡（Kopi）和閩南語的店（tiàm）結合成的混合詞，不只販售咖啡也供應傳統早餐，是馬來西亞和新加坡飲食文化非常重要的一部分。某個客人點了「Kopi
    O Gau and Char bihun」，請問他點了什麼餐點？
  options:
  - label: A
    content: 濃黑咖啡、炒粿條
  - label: B
    content: 淡咖啡加奶、米粉湯
  - label: C
    content: 濃黑咖啡加糖、炒米粉
  - label: D
    content: 淡黑咖啡、炸米粉
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: Kopi O 係指黑咖啡加糖；Gau 用閩南語發音為「厚」、「濃」的意思；Char bihun 用閩南語發音為「炒米粉」的意思，故選(C)。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 東南亞的自然環境和印太地區交通樞紐的位置造就其豐富的文化樣貌，請問下列哪兩項文化景觀與印度移民有關？(甲)越南咖啡(乙)大寶森節(丙)河內文廟(丁)新加坡蘇丹回教堂(戊)娘惹糕(己)吳哥窟
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙己
  - label: C
    content: 丙丁
  - label: D
    content: 丁戊
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (乙)大寶森節為泰米爾人（印度南部達羅毗荼人分支）慶祝的印度教節日之一；(己)吳哥窟則是建成於 14 世紀，主要供奉印度教的毗濕奴神。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 東南亞與南亞的宗教多樣性高，各種宗教都在此蓬勃發展。請問下列哪一組國家和該國主流宗教的配對為正確？
  options:
  - label: A
    content: 緬甸—上座部佛教
  - label: B
    content: 東帝汶—基督教
  - label: C
    content: 印尼—原始崇拜
  - label: D
    content: 斯里蘭卡—印度教
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)東帝汶信奉天主教為主。(C)印尼信奉伊斯蘭教為主。(D)斯里蘭卡信奉佛教為主。
- id: doc_112_台北_師大附中_社會_地理_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 2020 上映的電影「你是豬」以某國曾發生的校園鬥毆事件為靈感改編而成；描述這場暴力衝突中，校內馬來人、華人、印度人學生之間各說各話的羅生門，雖未在該國上映但也挑起了該國各族群之間的敏感神經和矛盾。請問這部電影的劇情最可能是在影射下列哪個國家？
  options:
  - label: A
    content: 印尼
  - label: B
    content: 汶萊
  - label: C
    content: 新加坡
  - label: D
    content: 馬來西亞
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)馬來西亞的種族多組成多元，馬來人占比約 5 成、當地原住民（土著）占比約 18 ％、華人約 30 ％、印度人則占 10 ％。過去各種族因經濟、文化、宗教不同，各自分治並無過多交流。後來馬來西亞獨立後，各族群間因政治角力及利益衝突，種族間的對立情形日益加劇。
