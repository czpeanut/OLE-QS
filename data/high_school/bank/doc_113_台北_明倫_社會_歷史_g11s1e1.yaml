  explanation: (A)兩者皆不重視奴隸人權與自由。(B)《漢摩拉比法典》顯示刑罰的階級有別，《十二表法》中自由人與奴隸的權利亦不相同。(D)《漢摩拉比法典》強調報復性懲罰，未特別保障審判程序，許多刑罰可直接執行，並不強調禁止私刑或未審先判。《十二表法》有「非經審判，不得處死刑」的規定，但仍允許受害者進行同態復仇，未完全禁止私刑。因此，兩者的共同特點不是「禁止私刑及未審先判」，而是「報復精神」。
