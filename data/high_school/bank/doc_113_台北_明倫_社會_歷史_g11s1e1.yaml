  stem: 17 世紀科學革命期間，培根與笛卡兒分別提出歸納法、演繹法。培根認為，先入為主的觀念是導致許多錯誤的原因，因此提出歸納法，強調一切知識需藉由累積材料並經過審慎、具體的觀察再得出適當結論。笛卡兒則認為思考能力是一切之始，「我思故我在」這句話代表對人類的思考能力具有信心，人類可藉由理性思考來獲取知識。就以上敘述，請問下列何者正確？
  options:
  - label: A
    content: 兩人建構知識的過程不同
  - label: B
    content: 培根較重視理性推演，笛卡兒則強調經驗歸納
  - label: C
    content: 笛卡兒相信人類理性思考能力，經由不斷的懷疑與驗證便能推斷出真相
  - label: D
    content: 培根認為須經由「累積材料」→「觀察」，才能得出結論（知識）
  - label: E
    content: 歸納法與演繹法兩者互斥，無法相容
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (B)培根強調的是經驗歸納法，而笛卡兒則主張理性推演。(E)在科學研究與哲學方法中，歸納法與演繹法可以互補並相容，許多現代科學方法論都結合了這兩種方式。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s4_48
  section: 4
