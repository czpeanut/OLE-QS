- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s2_41
  section: 2
  number: 41
  type: single
  page: 10
  stem: 根據上述資料，請判斷以下何者敘述正確？
  options:
  - label: A
    content: 拜占庭帝國因具希臘文優勢而主導歐洲基督教發展
  - label: B
    content: 中古西歐教會除有宗教功能，還具有實際政治作用
  - label: C
    content: 5 世紀後羅馬帝國西部滅亡，教宗的地位因此下跌
  - label: D
    content: 西歐與拜占庭帝國在第一次十字軍運動時互相敵對
  group_stem: '資料一：基督教一直努力維持統一的普世教會風貌。但是，東歐與西歐始終存在著地理上、政治上和文化上的各種差異。在地理上，東歐和西歐的條件各不相同。在政治上，自從 5 世紀蠻族入侵和羅馬帝國西部覆亡以後，羅馬教宗便享有最高的地位，教會組織也填補了羅馬帝國行政系統解體後的真空；因為拜占庭帝國仍然繼續存在到 15 世紀中葉，又是政教合一體制，西方不願接受拜占庭帝國為「歐洲共主」的地位。在文化上，東歐為希臘語文，西歐為拉丁語文，本來早期教會文獻為希臘文，即使是在羅馬也是希臘文占優勢，但 5 世紀後發生變化。這些因素使東西教會難以密切合作。

    資料二：十字軍運動助長了拜占庭帝國的衰落。第一次十字軍運動雖幫助拜占庭帝國逐退在小亞細亞的土耳其人，但他們在敘利亞等地建立自己的政權，使拜占庭帝國當局不悅，此後不斷有衝突。教宗英諾森三世（Innocent Ⅲ，1198 ～ 1216 年任教宗）所發動的第四次十字軍，竟然受威尼斯商人利用，再加上拜占庭帝國政爭的因素，十字軍從巴勒斯坦轉向君士坦丁堡…… 1453 年 5 月，鄂圖曼人大舉攻城……拜占庭帝國亡。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)西歐主要使用拉丁語文，拜占庭的希臘文優勢無法主導歐洲基督教發展。(C)教宗地位在西羅馬帝國滅亡後大為提升。(D)應是第四次十字軍運動時，十字軍轉向進攻君士坦丁堡。
