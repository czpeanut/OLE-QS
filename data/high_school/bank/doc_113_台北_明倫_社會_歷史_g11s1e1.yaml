  group_stem: '資料一：義大利地區因地利之便，首先開始發展商業。貿易路線向北經由德意志南方、法國、尼德蘭（今比利時一帶）而後擴及全歐洲。從事商業並不需特殊身分或血統。許多商人開始組織商社，建造船隻，沿河川或近海地區往來負販。從事商業必須解決利潤與計算問題……商人之間也逐漸發展出新的記帳及匯兌技術，商業規模得以日漸擴大……伴隨商業發展而來的是市集的擴大，並逐漸演變成人口集中的城鎮。

    資料二：城市為了擴展勢力，團結力量，組成城市同盟。這種以城市為基礎的政治結構，衝擊著執社會牛耳的教會勢力……貴族必須與富商合作，並從事經商活動，才能維持生計。他們變賣土地，使得土地所有權易主，鄉村因商致富者參政比例提高。

    資料三：這些城市在握有資源和實力以後，便希望取得自治乃至獨立的地位……他們用金錢向封建領主或帝王買下原來在封建制度下的領主權益，成為「有自治許可狀（特許狀）的城市」……他們不承認皇帝以外的任何威權……這些城市的統治者多為富有的商人，市政係由基爾特（行會，Guild），包含商人基爾特和工匠基爾特來治理。……農奴只要在城市裡住滿一年而不被逮捕，就可以取得自由身分。因此當時流行一句話「城市的空氣使人自由」。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)資料三說明自治城市的統治者多為富有的商人，並非封建領主。(B)城市居民主要為商人與工匠，少有農奴。(C)農奴需要在城市裡住滿一年而不被逮捕，才能取得自由身分。
