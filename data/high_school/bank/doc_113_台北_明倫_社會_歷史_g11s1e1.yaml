  stem: '資料一：《漢摩拉比法典》條文節錄

    若一個人幫助不論屬於政治或私人的男女奴隸逃亡，應該處死。

    若一個商人將穀物、羊毛、油，或是任何貨物借給一個販子出售，這販子應該立約說明貨物價值，並且償還給商人，同時應取得他付錢給商人的收據。

    若一個人打瞎一個貴族的眼，他的眼也必須被打瞎。

    若他打斷了同等身分人的骨頭，他的骨頭也應被打斷。

    若一個人打瞎一個平民的眼，或打斷了他的骨頭，他應付一米納的銀子。

    若他打瞎了一個奴隸的眼，或打斷了他的骨頭，他應付此奴隸身價的半數。

    資料二：《十二表法》條文節錄

    如果有人毀傷他人肢體，除非雙方協議解決，否則對方可進行相同的報復。

    折斷自由人的骨頭，處三百銅幣罰金；若被害人為奴隸，處一百五十銅幣罰金。

    殺人者處以死刑，過失致死者，則以一隻公羊代替本人祭神。

    執行死刑時由刑事事務官監場，對一切刑事判決不服的，有權上訴。

    任何人非經審判，不得處死刑。

    根據資料一、二，《漢摩拉比法典》和《十二表法》什麼相似的特點？'
  options:
