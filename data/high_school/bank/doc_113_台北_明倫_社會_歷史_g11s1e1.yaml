  stem: '下列二則資料為馬丁路德的言論主張，請閱讀資料後回答問題：

    資料一：既然是皇帝陛下及諸位大公們此刻要求於我者，僅為是與否的簡單答覆，那我將直陳，亦不夾帶任何攻忤之詞。睽諸既往，教宗及宗教會議都曾犯錯，且一再犯錯，實不可信賴，故我現今只依從《聖經》或任何有意明白論理之言。我當依循《聖經》之所記載，因我等良知乃受之於上帝的話語。故如今我不能、亦不願收回前此之主張，因為違抗良知既危險又錯謬。今我於此，誓難遵命。上帝助我。阿門。

    資料二：什麼是羅馬教會認定的好基督徒？除了平日救濟幫忙他人、為生病的人祈禱或為死去的人舉辦特別彌撒外，還有一件事一定不能拒絕──就是奉獻金錢給教會，不管是捐獻十一稅、購買贖罪券，或是幫忙羅馬教宗建造聖彼得大教堂。日常中教徒常遇到的狀況是聖彼得大教堂的獻金吏上門索款之後，不久又有教會修士前來收取十一稅。更可怕的是，教徒眼睜睜地看著，這些奉獻金並未用在需要的教堂裡，而是落入附近有錢的修道院手中，而這些院中修士不曾為協助納捐人靈魂得救這件事上幫過什麼忙。【資料出處：陳思賢，〈「君王似神祇，庶民如撒旦」：馬丁路德宗教改革運動中之政治觀〉，《政治科學論叢》，17（臺北，2002∕12），頁 182 ～ 183；改寫自巴森，《從黎明到衰頹：五百年來的西方文化生活》（臺北：貓頭鷹，2018）】

    (1)資料一的背景為何？（2 分）

    (2)以下選項內容為馬丁路德發表《九十五條論綱》條文摘錄：

    第 2 條：不應將「悔改」一詞理解為懺悔儀式，即教士主持下的告解和補贖。

    第 3 條：「悔改」並非僅意味著內心懺悔，若無各種外部的苦行，亦無效能。'
