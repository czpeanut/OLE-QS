  stem: '請閱讀下列資料並根據資料寫出甲、乙、丙、丁分別為何人（或學派）之主張？（4 分）

    甲：西元前 4 世紀左右，政治上，一位領導者建立跨歐亞非的大帝國，後帝國在國王死後一分為三；思想上，哲學的思考也由從重視外在政治生活轉而關注個人內在生活，其中一學派主張：

    「既然如此，你還會被發生在你身上的事絆住，讓自己無法當一個正直、寬容、節制、謹慎、免於草率言行的人嗎？你會因此無法具備謙遜、自由等各種美德嗎？事實上，人的本性所具備的特質，都必須藉由這些美德彰顯出來。」

    乙：18 世紀啟蒙時代，某位思想家在政治上提出的重要主張：

    「法律是普遍意志的表達，所有公民都有權親身和經由代表參與其制。法律對全體公民必須是相同的，不論是施行保護或懲罰皆然。全體公民在法律之前一律平等。」

    丙：出身蘇格蘭的經濟學家提出下列見解，成為 18 世紀後「自由主義」的代表：

    「每個人既努力將資本盡量投資在國內產業當中，同時也讓該產業創造最大的利潤；因此，每個人的收入也將達到最高程度。如此一來，人們被一隻看不見的手所引導，達到他們原先沒有預期到的目標。各自追求有利於自己的事物，比起那些以促進社會利益為目的的人，往往更能真正為社會帶來利益。」

    丁：西元前 5 世紀後，東地中海地區有人開始思索與現實人生及社會的相關問題，提出下列的想法：

    「生命就像被鎖在洞穴裡，看著石牆上來去匆匆的影子。理想形式是深思熟慮嚴謹結合現實的結果，關注某物的理想形式，是我們所能進行的思維活動中最有價值的種類之一，通過了解某物應該是什麼樣子的，我們可以更清楚的開始定義什麼是錯誤的，而注重於我們所需要做的，使世界稍微變得更好。」'
  answer:
  - 甲：斯多噶學派（芝諾） ；乙：盧梭 ；丙：亞當斯密； 丁：柏拉圖。
  answer_status: verified
  answer_source: answer_key
  explanation: '甲：題文所述為亞歷山大帝國分裂的希臘化時代，重視正直、寬容、節制、謹慎等美德，因此為斯多噶學派（芝諾）的主張。

    乙：此人主張法律是普遍意志的表達，重視全體公民的權利，故為啟蒙運動時期的盧梭。

    丙：主張產業活動「被一隻看不見手所引導」，最早出現於亞當斯密的《國富論》，後成為自由主義經濟學說的代表。

    丁：題文敘述為柏拉圖《理想國》的「洞穴寓言」，認為影子即是人們感官感知所能看到的現實片段，只有通過理性感知的物體真實形態（理想形式）才是永恆不變的真理，而這個理想形式即是「觀念」。'
