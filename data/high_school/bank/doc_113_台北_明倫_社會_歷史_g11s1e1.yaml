  stem: 某一時期開始，人們開始廣泛的搜尋各種古代文獻，並由此開始致力於研究希臘文和希伯來文，原文校勘學和語言學於焉誕生，人們也藉此對亞里斯多德的著作和《聖經》產生新的看法。許多人開始資助藝術工作，同時藝術家自覺地仿效古典理念和形式的作法也蔚為風尚。這種回歸古典的熱潮鼓舞了學者獨立地去探索真和善的問題，他們避開了褊狹的哲學系統、宗教教條和抽象理論，竭力研究人的價值。下列關於此時期的敘述，哪些是正確的？
