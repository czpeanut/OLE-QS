questions:
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「特洛伊國王之子巴里斯在希拉、雅典娜和阿芙羅黛蒂等女神的賽美會上評審阿芙羅黛蒂最美，此因阿芙羅黛蒂允諾將以最美的女人許配巴里斯為妻。……巴里斯奉使斯巴達時，因阿芙羅黛蒂之助而使海倫與他私奔到特洛伊，希臘各城邦乃組成聯軍前往征討特洛伊……。」根據以上內容，請問符合以上資料敘述的文本為何？
  options:
  - label: A
    content: 《奧德賽》
  - label: B
    content: 「荷馬史詩」
  - label: C
    content: 《埃涅阿斯記》
  - label: D
    content: 《吉爾伽美什史詩》
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為特洛伊戰爭爆發的背景，應出自於(B)「荷馬史詩」的《伊里亞德》，另一部《奧德賽》的故事背景則是特洛伊戰爭結束後，因此(A)不選。(C)羅馬詩人味吉爾接續「荷馬史詩」所寫的作品，將羅馬人的祖先上承自特洛伊英雄後裔。(D)兩河流域的文學作品。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有一位皇帝即位時，西方操控於日耳曼人之手，高盧為法蘭克人所有，不列顛由盎格魯薩克遜人占據，汪達爾人稱霸北非。這位皇帝力圖收復失土以恢復羅馬帝國的光榮，並以拉丁文編定羅馬法，但必須翻譯為希臘文才能在東方使用。請問這位皇帝是指下列何者？
  options:
  - label: A
    content: 君士坦丁
  - label: B
    content: 查理曼
  - label: C
    content: 查士丁尼
  - label: D
    content: 鄂圖一世
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從編定羅馬法、翻譯為希臘文等作為，即可推知這位皇帝為東羅馬帝國的君主(C)查士丁尼，其頒行的《查士丁尼法典》對後世歐洲影響甚大。(A)羅馬帝國皇帝。(B)(D)法蘭克王國君主，皆曾接受教宗加冕為「羅馬人的君主」。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某一當代學者在他的論著裡，討論世界史的某一歷史事件時說道：「如果沒有□□□□□，個人閱讀《聖經》的習慣即無法建立，哥倫布可能也看不到《馬可波羅遊記》一書，佩托拉克的作品更不可能傳遞出去。」請問以上的□□□□□最有可能是下列何者？
  options:
  - label: A
    content: 古騰堡革命
  - label: B
    content: 地理大發現
  - label: C
    content: 十字軍東征
  - label: D
    content: 蒙古人西征
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「個人閱讀《聖經》的習慣」代表《聖經》已經普及，加上《馬可波羅遊記》、佩托拉克的作品被傳播，三者皆暗示印刷術的出現使書籍與知識更方便流傳，因此答案為(A)古騰堡革命。(B)地理大發現與書籍的傳播關聯性不高。(C)(D)發生於 14 世紀之前，不可能傳播《馬可波羅遊記》與佩托拉克的作品。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 與別的隱修會遠離世俗、隱居修行不同，□□要求成員深入社會各階層；不穿僧衣，出入宮庭；結交權貴以擴大教會的影響。○○更號召每個會員，為了主的榮耀，要準備到世界任何地方去，在他們所辦的學校裡，除講授神學外，還注重數學、天文學和其他世俗學問，培養出不少學識淵博者，對教會的振興有重大貢獻。□□與○○應填入何者？
  options:
  - label: A
    content: 耶穌會；羅耀拉
  - label: B
    content: 路德會；馬丁路德
  - label: C
    content: 喀爾文派；喀爾文
  - label: D
    content: 清教徒；克倫威爾
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 此教派的成員多學識淵博者，除要深入社會各階層外，還要準備到世界任何地方去傳教，可推知為宗教改革後的耶穌會，故答案為(A)。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有一位宗教人士主張：「我們將命定論稱為上帝的永恆的旨意。上帝透過它決定每一個人將來必定會怎樣。所有人的命運並不一樣；但上帝事前決定有些人會得到永生，另一些人將會得到懲罰……。就上帝的選民而言，我們確信上帝的這種忠告出自於祂無私的仁慈，完全不考慮人類的功過；但對那些要施懲罰的人而言，生命大門已被公正的，無可指責的，但卻是難以理解的判斷所關閉。」請問此人應是指何人？
  options:
  - label: A
    content: 馬丁路德
  - label: B
    content: 茲文利
  - label: C
    content: 喀爾文
  - label: D
    content: 亨利八世
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「上帝事前決定有些人會得到永生」一句，即可推知為(C)喀爾文的「預選說」。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 羅馬教廷宣示：教宗是普世的教宗，只有教宗能任命主教，廢黜皇帝；羅馬教會過去沒有犯過錯誤，今後也不會犯錯。這種說法最可能在何時出現？
  options:
  - label: A
    content: 6 世紀與拜占庭對抗時
  - label: B
    content: 11 世紀末政教衝突時
  - label: C
    content: 16 世紀初宗教改革時
  - label: D
    content: 18 世紀啟蒙運動之時
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從羅馬教廷強硬的宣示「只有教宗能任命主教」、「廢黜皇帝」，即可推知此事為 11 世紀的俗人授職衝突事件，為了主教授職衝突，羅馬教宗廢黜神聖羅馬皇帝亨利四世，(B)為正解。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 中古後期，隨著十字軍東征，東西文化的交流加速進行，藉由阿拉伯人扮演中介角色，大量古典文化回傳歐洲，加以阿拉伯文化的流通，對西方思想界造成重大刺激，使 13 世紀歐洲的思想界有哪一項重大轉變？
  options:
  - label: A
    content: 拋棄以往純宗教的角度，轉以較理性的態度思考問題
  - label: B
    content: 柏拉圖哲學取代亞里斯多德哲學，居於重要地位
  - label: C
    content: 在思想的傳播上，主教座堂學校關閉，大學興起
  - label: D
    content: 在表達思想的工具方面，拉丁文被徹底廢棄，方言文學出現
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B) 13 世紀時，亞里斯多德哲學透過阿拉伯世界傳回歐洲，成為主流，而不是柏拉圖哲學。(C)大學於 11 世紀末興起，但主教座堂學校並未因此關閉。(D)拉丁文依然受到重視，並未廢棄。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 西元 8 世紀中葉，久已混亂的西方政局，先後出現了兩股安定的力量，即□□和○○，它們的出現是彼此互助合作的結果。由於這種合作，又產生了一個新的政治觀念，即所謂「基督教共和國」。文中□□和○○分別是
  options:
  - label: A
    content: 丕平、教宗（皇）國
  - label: B
    content: 查理曼大帝、李奧一世
  - label: C
    content: 克洛維、教宗（皇）國
  - label: D
    content: 鄂圖一世、格列哥里一世
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「共和」即沒有君王，「基督教共和國」意即以基督教信仰建立的沒有君王之國度，最有可能為「教宗國」，8 世紀時法蘭克國王丕平將義大利中部的土地獻給教宗，成為日後教宗國的基礎，因此答案為(A)。(B) 9 世紀初、(C) 5 世紀末、(D) 10 世紀中葉的君王，時間與題文不符。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 某時期世界上曾有多達 70 多個新興建的城市，且許這些新興建的城市名稱都採同一統治者之名，並且出現以下類似的現象：「過去的市鎮廣場是一片人聲嘈雜的景象，有人販售各種商品，有人宣揚各種思想與概念。如今市中心廣場已經被世界舞臺所取代，嘈雜的人聲中夾雜了各種的語言。」請問此現象的形成與哪一事件有密切關聯？
  options:
  - label: A
    content: 希臘城邦展開海外殖民
  - label: B
    content: 亞歷山大建立大帝國
  - label: C
    content: 羅馬征服環地中海世界
  - label: D
    content: 君士坦丁建都拜占庭
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提及「新興建的城市，……城市的名稱都採同一統治者之名」，選項中僅有(B)亞歷山大東征後，在其新征服的大帝國境內興建 70 多個希臘化城市，用以傳播希臘文化。(A)(C)新建立的城市不會用同一統治者名稱命名。(D)君士坦丁將拜占庭改稱「新羅馬」，後人逐漸改稱「君士坦丁堡」，但與題文 70 多個新興建的城市不符。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 西元前 5 世紀，雅典執政伯里克里斯（Pericles）曾說：「我們的制度之所以被稱為民主政治，是因政權全在所有公民手中，而不是在少數人手中。」對於此種雅典式的民主，我們應有的認識是
  options:
  - label: A
    content: 所謂的公民是指所有居住於雅典的自由人
  - label: B
    content: 政權的行使是由公民大會選出賢能之士擔任各種委員會的官吏
  - label: C
    content: 為直接民權，但不是全民民主政治
  - label: D
    content: 此種民主即為柏拉圖推崇的政治
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)並非全部的雅典自由人，公民限男性且有財產限制。(B)政府官員由抽籤產生。(D)柏拉圖反對雅典的政治，故寫《理想國》抒發政治理念。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 小佳來到非洲某地旅遊，發現此城市的港口有號稱古代世界七大奇蹟之一的燈塔遺跡，據說在西元前 2 世紀時，統治者獎掖學術，該城內有博物館與大圖書館，藏書已達五十萬冊，尤以科學研究著稱。試問這座城市的名稱為何？
  options:
  - label: A
    content: 開羅
  - label: B
    content: 孟斐斯
  - label: C
    content: 亞歷山卓
  - label: D
    content: 底比斯
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 北非埃及的(C)亞歷山卓位於尼羅河出海口，為西元前 2 世紀希臘化時期托勒密王國的首都，也是希臘化時代的文化發展重心。(A)(B)(D)三者皆位於內陸，不是臨海的港口。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 「通過對科學的廣泛涉獵，他的視野一天天地開闊，他的目光從無垠的大地投向更廣闊的大海，從大海又轉向更廣闊的天空；當他在無數的夜晚抬頭凝望浩渺的夜空時，一種強烈的衝動時常會超越那些令他困惑的具體問題，混同著一股巨大的力量撞擊他的心靈，冥冥之中，彷彿聽到一個幽遠的聲音在一遍遍向他發問：世界到底是什麼？世界是由一個什麼樣的物質組成……。」於是這位學者的思考就由科學領域進入哲學領域。試問引文是在描述哪一位古希臘羅馬時代的哲學家？
  options:
  - label: A
    content: 泰利斯
  - label: B
    content: 蘇格拉底
  - label: C
    content: 畢達哥拉斯
  - label: D
    content: 托勒密
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 西元前 6 世紀的泰利斯主張「水」是宇宙萬物的根源，擺脫神話與宗教，首先以理性思辨來解釋世界的本質，因此被尊為「哲學之父」。(B)哲學重心已從對自然世界的解釋轉向現實人生與社會的衝突。(C)主張數學可以解釋世界上的一切事物，非物質派學者。(D)西元 2 世紀的科學家，主張地心說。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 14 世紀時，歐洲教宗曾一度離開羅馬，遷居法國隆河下游的亞維儂；14 世紀末至 15 世紀初，歐洲甚至同時出現過兩位教宗。請問這兩個歷史事件，導致哪個強而有力的力量介入宗教改革？
  options:
  - label: A
    content: 教宗
  - label: B
    content: 封建國君
  - label: C
    content: 信徒
  - label: D
    content: 中產階級
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為「亞維儂之囚」與「大分裂」，為 14 ～ 15 世紀的政教衝突，歷經長達百餘年的困頓，羅馬教宗的聲望與教會的權威大受打擊，世俗君王的權力則逐漸上升，因此影響日後的宗教改革，答案為(B)。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 某一時期羅馬有一名護民官（保民官），曾大力抨擊官員的權力過大。其表示：「某官員只是比國王的名字好聽，實際上更加殘酷。因為以前只有一個主人，現在卻有了兩個。他們的權力不受制約，只要他們願意，就可以將殘酷的法律和各種懲罰施於平民。」請問某官員最有可能是下列何者？
  options:
  - label: A
    content: 元老院的貴族
  - label: B
    content: 執政官
  - label: C
    content: 獨裁官
  - label: D
    content: 監察官
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 根據這名護民官的說法，某官員的職位與權力堪比國王，但是有兩個，因此可推知為羅馬共和時期的兩名執政官。(A)由貴族及卸任的執政官組成，不止兩名。(C)為特殊職務，只有一名。(D)地位次於獨裁官，無法與國王相比。
- id: doc_113_台北_明倫_社會_歷史_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 3
