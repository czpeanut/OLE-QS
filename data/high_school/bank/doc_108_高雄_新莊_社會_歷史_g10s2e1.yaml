  stem: '2014年，東京國立博物館展出的「日本國寶展」，展出了很多平常無法見到的寶物。恭逢其盛，趁著在東京的時候，也到東博一覽寶物。其中最引起我興趣的，就是「漢委（倭）奴國王」金印。《後漢書》記載是東漢開國皇帝光武帝所賜的金印，為現存日本最古老的金製品。

    金印的發現

    「漢委（倭）奴國王」不是代代相傳於日本皇室的寶物， 而是不小心發掘到的意外。公元1784年，九州福岡外海的 志賀島百姓甚兵衛上書，說明發現的情況。由於甚兵衛整修 土地上的田溝，在挖掘溝壁時，出現了一塊兩人才能搬起的 石頭。 當搬起石頭的時候，在石縫之中看到金光閃閃的東西，即為 聞名於世的金印，甚兵衛發現後上繳官府。金印發現當時， 即已引起學者與官員的注意，幕府時代的重要儒學者本居宣 長、細井金吾都對金印進行考證。與金印最有關係的文獻為 《後漢書．東夷傳》中的紀載：「建武中元二年，倭奴國奉貢朝賀，使人自稱大夫，倭國之極南界也，光武賜以印綬。」 我們得思考「漢委（倭）奴國王」的意思，是「倭奴國」的王，還是「倭」的「奴國王」呢？ 前者代表「倭奴」是個國名，後者則是在「倭」地或是「倭」族中的「奴國王」。學者們普遍認為「倭」是一個族群或是地名的稱呼，而其中的「奴國」則是一個較大的「豪族」、「部族」或「酋邦」。因為日本此時的文字紀錄並不充分，所以很多學者無法確定「奴國」的位置或是實際的政治體制。 從《後漢書》的紀載還可以看出倭奴國王派出稱為「大夫」的使者渡過大海，到當時東漢帝國的首都洛陽晉見光武帝。光武帝視奴國為帝國的四夷藩屬之一，賜予印綬。 金印的發現，讓我們知道《後漢書》的「印綬」是枚「金印」。書上的記載搭配實物的發現，豐富了歷史的認識。

    金印的真假

    由於金印為日本最老的金製品，而且當時日本缺乏文字記載，因此不少學者認為金印是偽造的，直到不同地方的金印與「漢委（倭）奴國王」印比較之後，才確認其為真跡。 西漢與東漢四百年的歷史之中，東亞出土三顆金印，發現於不同的地點和年代。除了「漢委（倭）奴國王」金印以外，還有雲南昆明石寨山漢墓所出土的「滇王之印」和江蘇揚州邢江縣甘泉二號漢墓出土的「廣陵王璽」。 「廣陵王璽」是在1981年於甘泉二號漢墓附近的田間意外的發現，後來根據漢墓中鋼器上的年號，推測金印是在光武帝永平元年（公元58年）賜予兒子廣陵王劉荊。 「廣陵王璽」與「漢委（倭）奴國王」金印製作的時間相近，而且印的尺寸與文字的雕刻手法部很相似，有的學者認為可能來自同一個工匠或是作坊，由此也間接證實「漢委（倭）奴國王」印的真實性。

    「滇王之印」

    第三顆金印為「滇王之印」，出土於年代較早的西漢。按照《史記》的紀載，滇國為西南夷中較為強大的君長，武帝曾經賜與滇王印。從栗原朋信的研究當中，西漢皇帝有「六璽」，每種的功能不同，附庸國的領導賜與各式各樣造型的金印。 《後漢書》的紀載裡，賜予帝國周邊蠻夷金印的史料共有八則，賜印的原因包括：從遠地而來朝貢的蠻夷、附屬於帝國的蠻夷、具有軍事功績的蠻夷或是率大軍降伏的蠻夷。 漢代賜予帝國內諸王的金印造型為龜鈕，賜予北方遊牧民族的，則是採用羊或是駱駝等形狀。「滇王之印」與「漢委（倭）奴國王」兩者之間的形狀較為類似，考古學家王仲殊曾經做過比較，兩者所採用的形狀都是蛇鈕。方形印兩邊都為2.3公分，文字的風格也相似。 有趣的是，昆明石寨山在漢代據說是一座湖中的孤島，現在南北長約四十公里的滇池在當時還比現在更大。或許漢帝國賜封給周邊民族、而且是海上的島嶼才是蛇紐的造型（純屬我的臆測）。 然而，「滇王之印」與「漢委（倭）奴國王」金印之間還是存在著差別，最主要的是賜與倭奴的為「國王」。目前所出土的印中沒有稱呼「國王」者，為什麼會特別稱呼奴國的領袖為國王呢？

    漢帝國與東亞世界

    西漢時期，武帝除了與匈奴征戰，還擴展北疆的領土、經營周圍的少數民族，將疆域擴展至朝鮮。除此之外，從《漢書．地理志》的紀錄之中，可以知道西漢時，在朝鮮樂浪郡外海有百餘國，這些族群每年還會派遣使團到樂浪郡。 當西漢由於外戚的干政而滅亡，東漢帝國由劉秀承漢之天命。面對重建的漢帝國，劉秀除了建立新的制度之外，也希望以往周邊的四夷能夠繼續對漢帝國朝貢。 公元44年、47年，朝鮮半島北部的廉斯國和高句麗的部落領袖紛紛對漢帝國朝貢。一海之隔的九州，上面百餘國的部落也知道東亞大陸在歷經混亂之後，重新整合為一個帝國。 西漢時，疆域雖然大為擴張，但是倭國的使節並沒有到首都晉見皇帝。當公元57年，倭奴國派遣使節到洛陽朝貢，或許光武帝認為這是西漢都沒有達到的成就，因此特別賜與「國王」的金印。 或許奴國是當時日本眾多小國最強的一個。按照學者西谷正的推測，也許很多倭地的小國也向漢帝國朝貢，但只有奴國得到承認，所以才在正史中得到紀錄。日本在東漢時期並非一統的政治體制，也還沒有進人使用文字的階段，很多論證我們尚且等到更進一步的考古資料出來後才能確認。

    (一)依上述資料判斷，歷史學者如何證明這枚金印為真？(2分)

    (二)從上文可知，日本進入律令時期有了極大的轉變，請依上文判斷大化革新之後，日本前後的改變有哪些？舉出兩例：(4分)

