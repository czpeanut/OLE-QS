  stem: '※請閱讀下列資料後回答問題： 資料一：秦商鞅在公元前356、前350年分別進行兩次變法，變法的內容有：「廢井田、開阡陌；組織保甲行連坐法；提倡軍功，嚴禁私鬥，設二十爵等制；獎勵耕織生產，家有二男者倍其賦；統一度量衡、燔詩書而明法令；允許土地私有及買賣、推行縣制」 資料二：學者從考古遺址的土地開墾遺跡可以看到隨著工具使用而產生的變化：考古人員在長江中游草鞋山馬家濱、城頭山遺址發現了水田遺跡，這些新石器時代的人們利用自然地形所形成的窪地、容易積水的地方進行耕種這些窪地水田到青銅器時代仍普遍存在；一直到鐵器運用普及改變了土地利用的方式，耕田景觀起了大幅度的變化，原因在於鐵礦的開採比青銅礦多、容易，鐵礦原料充足使鐵製工具可大量使用，農民越界開墾森林和旱地、加速本材的砍伐速度、牛犁的使用使耕地不再受限於自然地形，水田和旱田的數量和形狀大幅提升，而農夫的生產效率提升，收成能養活更多的人口，都市的數量也提升了。對當時競爭激烈的各國主政者而言，如何管理這些大量出現的農耕地、在戰爭狀態下確保耕作人力充足和糧食生產穩定，變成不得不面對的問題，推動變法者以國家力量主導、整頓土地劃分遂成為施政的一大重心。 資料出處：改寫自平勢隆郎著、李彥樺譯，《從城市國家到中華：殷商和春秋戰國時代》（新北：臺灣商務印書館，2018），頁368～370

