  stem: '※請閱讀下列資料後回答問題： 宦官權傾內外，壓制宰相，是中國史中常見的現象，漢、唐、明三個朝代，宦官專權擅政，為禍尤烈。由於君權的獨占性極強，親貴、功臣、外戚掌權，都令君主不安，而宦官至多不過貪汙不法而已，不至於威脅皇位，且宦官經常與皇帝接近，自然較易取得皇帝的信任。……明代廢相之後宦宮掌握的相權，實際上就是君權，宦官的權力因君權的擴大而提高。明代宦官干政的範圍，包括行政、監察、司法、軍事、外交、財經各方面，權力所涉之廣，為漢、唐宦官所未有。明代的政治統制是雙軌運用，一方面以內閣為首的官僚系統，一方面是由司禮監領導內官組織，這種雙軌統制的形成，是由於絕對的獨裁專制政治所致。從權力的來源觀之，宦官權傾宰相，是君權不斷高漲的必然結果，宦官不過是秉承皇帝的旨意伺察官僚系統的運行而已。……君權的行使在事實上所遭到最大的阻力來自傳統的官僚制度，因此在中國政治傳統中，君權與官僚制度的關係是一段不斷摩擦，不斷調整的歷史；官僚制度是統治帝國所必不可少的一套行政機器，相權因在這部機器運轉的樞紐地位，因此每一次重大的調整便導致宰相制度的變更。中國宰相制度之所以由秦漢的三公制－變為隋唐的三省制，再變為明清的內閣制，其最後動力皆在皇帝欲維持其至高無上的君權。 資料出處：改寫自鄭欽仁主編，《中國文化新論：制度篇──立國的宏規》（臺北：聯經，1982），頁114～116

