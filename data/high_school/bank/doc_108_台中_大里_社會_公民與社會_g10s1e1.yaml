  stem: 低底盤公車的公共政策是民國100年開始由中央政府與各縣市政府規劃並執行，希望能夠使得身心障礙者的行動更為方便與無障礙，但是現實上對於身心障礙者在使用上仍有許多不便與損害。請問：以上問題的發生是基於社會大部分的人們對於身心障礙者仍抱持者下列何者觀點？
  options:
  - label: A
    content: 認識身心障礙者真正的需要，並給予切合其需求的服務與設備
  - label: B
    content: 透過恩己施捨的觀點給予優惠，以彌補身心障礙者不利處境
  - label: C
    content: 對於身心障礙者採取積極性的差別待遇，使身心障礙者的不便獲得改善
  - label: D
    content: 使身心障礙者因低底盤公車的服務，進而能充分參與社會活動的權利
  group_stem: ◎ 題組五： 近年在身心障礙者與相關團體的推動下，於中央與地方政府都開始注重身心障礙者設施的建立，尤其是低底盤公車的普及，希望能使得身心障礙者的交通能夠更便利。根據臺北市公共運輸處報告，臺北市上路營運的低地板公車截至106年5月底止，計有2,723輛，相較於105年的總數147輛，在數量上整整增加了18倍。其中，大都會客運市區巴士路線更已全數更新為低地板公車。但是身心障礙者乘坐公車遭受的歧視或是因而遭受的意外卻頻仍發生，如2018年12月廣告導演范可欽即在乘坐公車時因緊急剎車而肋骨斷裂而緊急送醫，亦有其他乘客分享被公車司機拒載的經驗，在在顯示出身心障礙者在社會中仍有許多不便利的問題，衛福部社會及家庭副署長祝建芳說明：交通部投入很多資源推廣低底盤公車、無障礙計程車等，除了這些硬體的服務外，亦希望社會可以給予身心障礙者同理心給予適當的協助與關懷。
