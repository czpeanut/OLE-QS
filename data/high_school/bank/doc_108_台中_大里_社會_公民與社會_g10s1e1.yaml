  group_stem: ◎ 題組三： 近年來，常發生臺灣人在國外犯罪卻遭遣送回中國大陸的事件。2016年12月西班牙與中國警方聯手破獲大型跨國電信詐欺案，逮捕的300名嫌犯中，有兩百多名是臺灣人。事件發生後，我國陸委會向中國國臺辦明確表達希望聯繫相關部門儘速將嫌犯遣送回臺；同時也向西報牙政府表示，依照「國籍管轄原則」應將臺籍嫌犯遣送回臺受審。然而：因為西班牙與中國簽有引渡條約與司法互助條約，但臺灣與西班牙並未有任何約定，所以最後西班牙仍將兩百多名臺籍嫌犯引渡至中國審判。肯亞、馬來西亞、東埔寨、亞美尼亞。越南、印尼、菲律賓也同樣將逮捕到的臺籍嫌犯遣送中國大陸而非臺灣，西班牙的事件並非偶發事件。 臺灣民眾對於臺籍嫌犯遭遣送為中國審判，有兩種不同的看法。一部分民眾認為：臺灣對於電信詐欺的罪責過輕，到中國審判可以判得比較重，才能遏止犯罪；但另一部分民眾認為：臺灣較尊重人權，重視被告權益，可以依照正當程序審判，況且若臺灣人犯罪都被遣送回中國，等於讓國際社會認為「臺灣人是中國人」，中國法院審判臺灣人是「國際內部事務」，對於臺灣的國際地位有所影響。隨著全球化的影響，犯罪規模也拓展至國際間，各國該如何合作，隨著國家間關係的不同，影響著遏止犯罪的成效。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
