- id: doc_108_台中_大里_社會_公民與社會_g10s1e1_s2_43
  section: 2
  number: 43
  type: single
  page: 4
  stem: 提案《國家語言發展法》的立委黃國書表示，臺語與臺灣本土文化的傳承息息相關，臺語是可以朗讀詩詞、進行文學創作，非常典雅的語言。但目前以臺語為母語者多數為中高齡民眾，這些中高齡民眾使用臺語學習識字。獲得學問，臺語是他們接收訊息的主要媒介。請問：下列何者理由與黃國書立委提案《國家語言發展法》最為相近？
  options:
  - label: A
    content: 中高齡民羅只能用臺語接收訊息，無法使用其他語言
  - label: B
    content: 臺語過去多為一般俚民所使用，被視為庶民的生活風格
  - label: C
    content: 政府將國語設為官方語言，透過教育來使年輕一代民眾逐漸離臺語
  - label: D
    content: 臺語沒有具體文字，以口語溝通為主，難以透過文本進行傳承
  group_stem: ◎ 題組四： 立法院院會於2018年12月25日三讀通過《國家語言發展法》，公廣集團依法除現有之原民臺語客家臺外，將可再設立臺語電視頻道，政府也需要提出保障措施，避免有傳承危機的語言消逝。三讀條文明定：政府應獎勵出版、製作、播映多元國家語言的出版品、電影、廣播電視節目及各種形式通訊傳播服務。政府捐助從事傳播的財團法人應提供國家語言多元服務，並得設立各國家語言廣播、電視專屬頻道及各種形式通訊傳播服務。而中央教育主管機關應於國民基本教育各階段，將國家語言列為部定課程，教育主管機關也應協助直轄市、縣 ( 市 ) 主管機關以專職方式聘用國家語言師資。希望透過各種保障措施以減少各種語言的斷層、流失或消滅，讓臺灣能維持多元語言的文化存在。請問：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
