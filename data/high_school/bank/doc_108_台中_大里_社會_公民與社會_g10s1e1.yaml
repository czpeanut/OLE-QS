  stem: 釣魚臺列嶼主權問題是就釣魚臺列嶼之主權與歸屬中國(中華民國即臺灣，或中華人民共和國)還是日本國的爭議。中、臺、日三方對釣魚臺列嶼之主權有其主張及實際行動外，美國在此次爭議中，基於戰略上的立場，是支持日本有合法主權。請問：下列關於主權的論述，何者正確？
