  section: 3
  number: 36
  type: multiple
  page: 5
  stem: RuBisCO酵素在哪些情況下活性可提升？（應選2項）
  options:
  - label: A
    content: 基質中pH值降低時
  - label: B
    content: 基質中$Hg^{2＋}$濃度升高時
  - label: C
    content: 光反應酵素活性升高時
  - label: D
    content: 有光照的情況下
  - label: E
    content: RuBisCO抑制分子濃度降低時
  group_stem: (一)綠色植物進行光合作用的過程，常被區分為「光反應」和「固碳反應」兩個階段。而在固碳反應中，固定$CO_{2}$的步驟是由簡稱為RuBisCO的酵素負責催化進行，該酵素的活性會受到多重因子的調控。已有研究結果顯示，葉綠體基質內$H^{＋}$濃度降低與$Mg^{2＋}$濃度提升，有利於其酵素活性的表現；再者，光照可增進「RuBisCO活化酵素」的活性，以提升RuBisCO酵素的活性。此外，也有報導指出，在黑暗中，葉肉細胞會持續生成RuBisCO的抑制分子，但在光照條件下，該抑制分子會分解而失去其作用。而除了RuBisCO之外，目前已知至少還有其他4種參與固碳反應的酵素也需要照光才能被活化。因此，光合作用的固碳反應不僅需要利用光反應的產物，同時也需要光照以活化多種參與其反應的酵素，所以光合作用「固碳反應」的進行並不是完全與光照無關。請根據上文回答下列問題：
