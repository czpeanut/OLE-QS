  group_stem: 漢承秦制，中央置三公。丞相總攬百政，位尊權大，形成君相共治之局。至武帝即位，元老功臣已凋零殆盡，為強化君權專制獨斷，接著更有計畫地削弱相權，重用掌管文書章奏的尚書令，規定臣僚進呈章奏，需先經過尚書臺（尚書令官署）審議。又啟用一批才能之士出入宮廷，與尚書令組成「中朝」或「內朝」，共議軍國大事，原以丞相為首的三公九卿則成為「外朝」。中朝長官為總司戎政的大司馬領尚書事，凡有決策，即交外朝執行。從此，內朝成為皇帝御用工具，外朝權力全遭架空，形成君權獨盛局面。（改寫自：陳豐祥，《歷史二》，臺北：泰宇出版，2013年，頁56）
