  group_stem: '郭解年輕時心狠手辣，殺過不少人。後來亡命天涯，做僱傭打手、藏匿兇犯、私鑄錢、掘墳之類的違法行徑不計其數。成年後，行為有所收斂，重義輕財，喜歡結交官吏和當地豪傑，如果與他習氣相投，縱使是有仇有怨的，也願意以德報怨。不少人都稱讚他的作風，並願意聽他驅使。因此，在地方上的聲望很高。

    元朔二年，漢武帝為了充實京師，下令各郡國資財超過三百萬的富戶需遷往茂陵居住，郭解家裏貧窮並沒有達到標準，但負責此事的官吏想趁此機會將這個令縣吏們頭疼不已的郭解送出境，郭解因而被列入遷移名單，而為他送行的豪客們送給他的禮金就達一千餘萬，遠遠超過了遷移的標準。之後，郭解曾在太原地區行俠仗義走天下，最終還被漢武帝下令滿門抄斬。'
