  type: single
  page: 2
  stem: 這個朝代的政治與社會，雖然有著種種矛盾與衝突，但朝廷與社群乃至個人，也透過制度或非制度的安排，做了許多改善和促進和諧的工作。更多士人在推動全國性變革受挫後，轉而關心鄉里事務，士人群體甚至與地方政府合作，致力於社會福利工作。請問關於社會互助組織方面的敘述，下列何者正確？
