  group_stem: 隋朝建立後，鑑於門閥制度的弊病，廢除九品中正制，改行薦舉。隋文帝置秀才科，隋煬帝置進士科，以試策取士，唐代取士科目，有秀才、明經、進士、明法、明字、明算、一史、三史、開元禮、童子等科，故又稱為科舉。 （改寫自：林瑞翰，《中國通史》，臺北：大中國圖書公司，1996年，頁200） 資料二 科舉名目雖多，而當時士人大都趨向於明經、進士兩科。進士科的錄取率，平均為投試總人數的百分之一二。唐中期以後，錄取額一般在三十人左右。明經科的錄取率平均為投試總人數的十分之一二，每次錄取額一般在一百一二十人左右。 （改寫自：王仲犖，《隋唐五代史》，上海：上海人民出版社，2003年，頁527） 資料三 科舉考試大致有幾個較重大的流弊： (一)講關節，考前往往以私人關係，或親戚，或友誼，托主辦考試的官員幫忙，甚至進行賄賂。 (二)當朝權貴常干預考試。 (三)舉子為了及第而於考前投詩干謁，唐代科舉不糊名，所以進士的及第與否，不是僅靠考場的答卷來決定，平時的名聲 和關係都可以影響是否及第。 （改寫自：王壽南，《隋唐史》，臺北：三民書局，1986年，頁566、567）
