  section: 1
  number: 9
  type: single
  page: 2
  stem: 鐵砧山位於臺中市大甲區與外埔區交界，海拔高約 236 公尺。鐵砧山因西側有大甲斷層通過，使得大安溪沖積扇逐漸抬升，而沖積扇上河流易改道的特性，則又逐漸將各處抬高的舊沖積扇侵蝕夷平，在不斷的河道擺動下，碰巧鐵砧山這一塊沒被侵蝕，仍保留了下來，為絕佳的眺望點，成為民眾挑戰攀登的小百岳之一。根據上文敘述及右圖判斷，鐵砧山的地形系統為何？
