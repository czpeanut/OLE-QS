  group_stem: '臺北 101 跨年煙火表演為臺灣一年一度的盛事，因此某研究欲找出最適宜觀賞臺北 101 跨年煙火的地點。觀賞煙火條件的優劣，主要受該地 3 項條件的影響：

    一、地點的空間條件：包括該地的便利性與腹地條件，前者的指標為該地商圈、廁所等公共設施的充足程度；後者為該地面積的大小及容納人數，以及疏散路線與醫療設施影響的安全性。

    二、交通易達性：區分為大眾運輸與私人運輸兩部分。前者為公共交通的方便程度，如：公車路線數、捷運路線數、火車站點；後者為汽機車停車位的數量。並把當晚交通管制的限制對公共交通與停車位數量影響納入考量。

    三、煙火可見度：考慮煙火施放當下，風向、距離、地勢與建築物遮蔽等 4 項因素對煙火呈現品質的影響。

    根據此 3 指標，該研究選定了 7 個地點，並評選出臺北地區最適宜觀賞臺北 101 跨年煙火的地點，並繪製出臺北 101 跨年煙火最佳觀賞地圖。請問：'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 交通易達性指標為：公車路線數、捷運路線數……等，屬於(A)屬性資料。
