  stem: 媒體報導：一位長住法國<u>戴高樂機場</u> 17年的難民邁爾漢自述，1977年他因為參與示威被逐出伊朗喪失伊朗籍，雖獲得比利時核發的難民簽證，卻在一次旅程中弄丢了所有身分證件，出不了機場、也無法被遣送至任何國家，靠著旅客資助在機場生存著。從國籍與人權的觀點來看此篇報導，請問以下敘述何者正確？
