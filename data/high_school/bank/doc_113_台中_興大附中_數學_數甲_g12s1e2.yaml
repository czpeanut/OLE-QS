  stem: '■ Bao 在練習學測考古題時，寫到類似題如下：「平面上兩點 A、B 之距離為 6，以 A 為圓心作一半徑為 r（0＜r＜6）的圓Γ，過 B 作圓Γ的切線，切點（之一）為 P。當 r 變動時，△PAB 的面積最大可能值為何？」

