- id: doc_113_台中_興大附中_數學_數甲_g12s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 設函數 f（x）＝$\sqrt{1 -x^{2}}$，g（x）＝－$x^{2}$＋1，並設 R 為函數 f（x）與函數 g（x）的圖形與 x＝－1，x＝1 圍成的區域，則下列選項哪些正確？
  options:
  - label: A
    content: 積分$\int_{-1}^{1} f ( x )dx$＝π
  - label: B
    content: 積分$\int_{-1}^{1} g ( x )dx$＝$\frac{4}{3}$
  - label: C
    content: 當－1 ≤ x ≤ 1 時，f（x）≥ g（x）
  - label: D
    content: 區域 R 的面積為$\pi -\frac{4}{3}$
  - label: E
    content: 區域 R 繞 x 軸所得的旋轉體體積為$\frac{4}{15}\pi$
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\int_{-1}^{1} f ( x )dx$＝半徑為 1 的半圓面積＝$\frac{1}{2}\pi$

    (B)○：$\int_{-1}^{1} ( -x^{2}+ 1 )dx$＝$\left. \left( -\frac{1}{3}x^{3}+x \right) \right| _{-1}^{1}$＝$-\frac{1}{3}+ 1 - \left( \frac{1}{3}- 1 \right)$＝$\frac{4}{3}$

    (C)○：由－1 ≤ x ≤ 1，可推得 0 ≤ 1－$x^{2}$ ≤ 1

    ∴$1 -x^{2}\leq \sqrt{1 -x^{2}}$

    (D)╳：由(A)(B)(C)可知，區域 R 的面積為$\frac{1}{2}\pi -\frac{4}{3}$

    (E)○：$\int_{-1}^{1} \pi ( ( f ( x ) )^{2}-( g ( x ) )^{2} )dx$

    ＝$2\pi \int_{0}^{1} ( ( 1 -x^{2} )-( 1 -x^{2} )^{2} )dx$

    ＝$2\pi \int_{0}^{1} ( -x^{4}+x^{2} )dx$

    ＝$2\pi \left. \left( -\frac{1}{5}x^{5}+\frac{1}{3}x^{3} \right) \right| _{0}^{1}$

    ＝$2\pi \left( \frac{1}{3}-\frac{1}{5} \right)$＝$\frac{4}{15}\pi$

    故選(B)(C)(E)'
- id: doc_113_台中_興大附中_數學_數甲_g12s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設 y＝f（x）＝$x^{4}$＋$ax^{3}$＋$bx^{2}$＋cx 為一個四次多項式，其中 a，b，c 為實數，請選出正確的選項。
  options:
  - label: A
    content: f（x）＝0 必有實數解
  - label: B
    content: f'（x）＝0 必有實數解
  - label: C
    content: y＝f（x）圖形至少有一個反曲點
  - label: D
    content: 由 y＝f（x）圖形和 x＝0、x＝1 以及 x 軸所圍出來的區域面積為$\frac{1}{5}+\frac{a}{4}+\frac{b}{3}+\frac{c}{2}$
  - label: E
    content: $\int_{0}^{1} | f ( x ) |dx$＝$\left| \frac{1}{5}+\frac{a}{4}+\frac{b}{3}+\frac{c}{2} \right|$
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵f(0)＝0 ∴f（x）＝0 至少有一解 x＝0

    (B)○：∵f''（x）＝$4x^{3}$＋$3ax^{2}$＋2bx＋c ∴三次多項式函數 f''（x）＝0 至少有一實數解

    (C)╳：反例：若 a＝b＝c＝0，此時 f（x）＝$x^{4}$，圖形無反曲點

    (D)╳：條件不足無法求解，因為無法確定範圍內的 f（x）是正或負

    (E)╳：條件不足無法求解，因為無法確定範圍內的 f（x）是正或負

    故選(A)(B)'
- id: doc_113_台中_興大附中_數學_數甲_g12s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設一個三次多項式 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d＝a（x－h）$^{3}$＋p（x－h）＋k，其中 a， b，c，d，p，h，k 均為實數，且 a≠0，則下列選項哪些正確？
  options:
  - label: A
    content: h＝$\frac{b}{3a}$
  - label: B
    content: p＝$3ah^{2}$＋2bh
  - label: C
    content: y＝f（x）在點（0，d）的切線斜率為 c
  - label: D
    content: 若 ap＞0，則 $b^{2}$－3ac＜0
  - label: E
    content: 若 $b^{2}$－3ac ≤ 0，則 ap＞0
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：h＝$-\frac{b}{3a}$

    (B)╳：f''（x）＝$3ax^{2}$＋2bx＋c＝3a（x－h）$^{2}$＋p

    x＝h 代入$\Rightarrow$p＝$3ah^{2}$＋2bh＋c

    (C)○：切線斜率為 f''(0)＝c

    (D)○：若 ap＞0，則 y＝f（x）恆為遞增函數或恆為遞減函數，且 f''（h）≠0

    $\Rightarrowb^{2}$－3ac＜0

    (E)╳：$b^{2}$－3ac＝0 時，p＝0$\Rightarrow$ap＝0

    故選(C)(D)'
