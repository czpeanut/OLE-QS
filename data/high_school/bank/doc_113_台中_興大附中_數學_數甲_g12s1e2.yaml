- id: doc_113_台中_興大附中_數學_數甲_g12s1e2_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 設三次函數 f（x）＝$ax^{3}$＋$ax^{2}$＋（a－1）x＋7 恆為遞增函數，則實數 a 範圍為 a ≥ ＿＿＿＿。
  answer:
  - $\frac{3}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）恆為遞增函數 ∴f''（x）≥ 0 恆成立

    而 f''（x）＝$3ax^{2}$＋2ax＋（a－1）

    即 $3ax^{2}$＋2ax＋（a－1）≥ 0 恆成立

    $\Rightarrow\begin{cases}3a > 0 \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots ① \\ D = ( 2a )^{2}- 4 \cdot 3a \cdot ( a - 1 )\leq 0 \ldots \ldots \ldots ②\end{cases}$

    $\Rightarrow\begin{cases}a > 0 \\ a^{2}- 3a^{2}+ 3a\leq 0\end{cases}\Rightarrow\begin{cases}a > 0 \\ a ( 2a-3 )\geq 0\end{cases}$

    $\Rightarrow\begin{cases}a > 0 \\ a\geq \frac{3}{2} 或 a\leq 0\end{cases}$

    故$a\geq \frac{3}{2}$'
