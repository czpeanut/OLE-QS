- id: doc_113_台中_興大附中_數學_數甲_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 若 f'（x）＝x（x－3），則下列敘述何者正確？
  options:
  - label: A
    content: f(0)＝0
  - label: B
    content: f(2)＜f(3)
  - label: C
    content: f（x）的圖形沒有反曲點
  - label: D
    content: f（x）的圖形在區間（2，3）為凹口向上
  - label: E
    content: f（x）的圖形在區間（1，2）為凹口向上
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$x^{2}$－3x＝x（x－3）＝0$\Rightarrow$x＝0 或 3

    f''''（x）＝2x－3＝0$\Rightarrow$x＝$\frac{3}{2}$

    依 f''（x）、f''''（x）正負製表可得

    $\frac{3}{2}$

    (A)╳：條件不足無法求得 f(0)

    (B)╳：f(2)＞f(3)

    (C)╳：f（x）的圖形有反曲點$\left( \frac{3}{2} , f\left( \frac{3}{2} \right) \right)$

    (D)○

    (E)╳：f（x）的圖形在區間$\left( 1 , \frac{3}{2} \right)$為凹口向下

    故選(D)'
