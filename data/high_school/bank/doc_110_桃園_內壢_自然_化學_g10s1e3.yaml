questions:
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在硬水中，合成的清潔劑比肥皂更具有洗滌能力，其主要原因為何？
  options:
  - label: A
    content: 合成清潔劑的鈉鹽溶於水，而肥皂的鈉鹽不溶於水
  - label: B
    content: 合成清潔劑會與酸作用，而肥皂不與酸作用
  - label: C
    content: 合成清潔劑的鈣鹽溶於水，而肥皂的鈣鹽不溶於水
  - label: D
    content: 肥皂會在硬水中分解，而合成清潔劑不會分解
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 肥皂中親水端的羧酸根（$COO^{－}$）會與硬水中的$Ca^{2＋}$、$Mg^{2＋}$等離子沉澱，降低去汙效果；合成清潔劑的親水端為硫酸根 （$OSO_{3}^{－}$）、苯磺酸（$C_{6}H_{4}SO_{3}^{－}$）根等，不會發生以上沉澱現象，故選(C)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有一胃病患者，檢查顯示其胃液中含氫氯酸（HCl(aq)）的濃度為0.060莫耳／升，用含氫氧化鋁Al(OH)$_{3}$的胃藥中和，化學反應式如下：Al(OH)$_{3}$＋3HCl → $AlCl_{3}$＋3 $H_{2}$O。 若此病人共分泌出0.3升的胃液，需服用多少克的氫氧化鋁，恰可中和胃酸？（原子量H＝1.0、O＝16.0、Al＝27.0）
  options:
  - label: A
    content: '0.26'
  - label: B
    content: '0.47'
  - label: C
    content: '1.4'
  - label: D
    content: '4.2'
  - label: E
    content: '0.70'
  group_stem: 】
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 體積莫耳濃度＝0.06 M、體積＝0.3 L，則胃酸中氯化氫莫耳數＝0.018 mol。由方程式係數1：3可知，耗去0.006 mol的Al(OH)$_{3}$，相當於0.47 g。故選(B)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 除了氫氧化鋁，下列哪種化合物也適合做胃藥的成分？
  options:
  - label: A
    content: Mg(OH)$_{2}$
  - label: B
    content: KOH
  - label: C
    content: $NH_{4}$Cl
  - label: D
    content: $CH_{3}$COONa
  group_stem: 】
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 常見的胃藥包含Mg(OH)$_{2}$、$NaHCO_{3}$、$CaCO_{3}$等。故選(A)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 一燒杯盛有$10^{－8}$ M的鹽酸水溶液，下列有關此溶液的敘述，何者正確？
  options:
  - label: A
    content: '[$H^{＋}$]為$10^{－8}$ M'
  - label: B
    content: pH＝8
  - label: C
    content: '[$H^{＋}$]略高於$10^{－7}$ M'
  - label: D
    content: pH＝6
  - label: E
    content: pH＝7
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: HCl完全解離成$10^{－8}$ M的$H^{＋}$，另外水也會等量解離成$H^{＋}$、$OH^{－}$；故溶液中的[$H^{＋}$]會略大於[$OH^{－}$]，溶液成酸性，[$H^{＋}$]略大於$10^{－7}$ M、[$OH^{－}$]略小於$10^{－7}$ M；pH略小於7、pOH略大於7。故選(C)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列哪一種化學反應<u>不是</u>氧化還原反應？
  options:
  - label: A
    content: 由水蒸氣及紅熱的焦煤製造水煤氣（主要成分含一氧化碳及氫）
  - label: B
    content: 鋅片溶於稀硫酸放出氫
  - label: C
    content: 碳酸鈣溶於鹽酸放出二氧化碳
  - label: D
    content: 由氮及氫以哈柏法製氨
  - label: E
    content: 維生素C與香腸中添加的亞硝酸鹽反應生成一氧化氮
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) C＋$H_{2}$O → CO＋$H_{2}$；(B) Zn＋2 HCl → $ZnCl_{2}$＋$H_{2}$；(C) $CaCO_{3}$＋2 HCl → $CaCl_{2}$＋$CO_{2}$＋$H_{2}$O；(D) $N_{2}$＋3 $H_{2}$ → 2 $NH_{3}$；(E) $NO_{2}^{－}$ → NO。其中(A)(B)(D)都有元素的生成或反應，必為氧化還原反應；(E)則可發現N得到電子、失去氧還原。故選(C)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列關於酸鹼的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 根據阿瑞尼斯酸鹼學說，酸與鹼僅限水溶液中討論
  - label: B
    content: 酸性溶液的[$OH^{－}$]＞[$H^{＋}$]
  - label: C
    content: 酸可使藍色石蕊試紙變色
  - label: D
    content: 酸與鹼均屬於電解質
  - label: E
    content: 根據阿瑞尼斯酸鹼學說，溶於水可增加$H^{＋}$濃度者為酸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B) [$H^{＋}$]＞[$OH^{－}$]。故選(C)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列敘述何者一定正確？
  options:
  - label: A
    content: 任何情況下，在純水中，[$H^{＋}$]＝[$OH^{－}$]＝$10^{－7}$ M
  - label: B
    content: 25℃下，$10^{－8}$ M 的HCl(aq)，其pH＝8
  - label: C
    content: 在25℃下，[$H^{＋}$][$OH^{－}$]＝$10^{－14}$，此關係式僅適用於中性水溶液
  - label: D
    content: 一杯可樂中，[$H^{＋}$]＝5×$10^{－4}$ M，則其pH值介於3～4之間
  - label: E
    content: 25℃下，pH＝8的NaOH(aq)，其[$OH^{－}$]＝$10^{－8}$ M
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不一定，在25℃下才是如此；(B)水也會解離，pH會略小於7；(C)定溫下，此關係式適用於各種pH值的水溶液； (D) pH＝4－log5＝3.3；(E) pH＝8代表其[$H^{＋}$]＝$10^{－8}$ M，[$OH^{－}$]＝$10^{－6}$ M。故選(D)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列有關能源的敘述，哪些是正確的？ (甲)以現今科技而言，風力在短期內可能無法獲得廣泛應用 (乙)太陽能是未來最值得開發，也是最具潛力的能源 (丙)目前臺灣生質能發電主要以焚化與沼氣發電為主 (丁)臺灣西南海域蘊藏可燃冰的天然氣化合物新能源 (戊)核能發電是利用進行核融合反應
  options:
  - label: A
    content: 甲乙丁戊
  - label: B
    content: 甲丙丁戊
  - label: C
    content: 甲乙丙戊
  - label: D
    content: 甲乙丙丁
  - label: E
    content: 乙丙丁戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 戊：應為核分裂。故選(D)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 欲使50℃、100 g的20%甲溶液達飽和，需加入多少g的甲溶質固體？
  options:
  - label: A
    content: '30'
  - label: B
    content: '45'
  - label: C
    content: '60'
  - label: D
    content: '75'
  - label: E
    content: '80'
  group_stem: '】

    溶質與溶劑均勻混合的過程稱為溶解。在定溫時，將某固體物質加入盛有定量水的燒杯中，攪拌後該物質溶解；若再持續加入該物質，溶液的濃度逐漸加大，直到仍有該物質留在燒杯中。因此，定溫時，一定量的水只能溶解一定量的某固體物質，而在此種狀態下的溶液稱為飽和溶液。飽和溶液中所含溶質的量，稱為該溶質在該溫度時的溶解度，可用100克溶劑所能溶解溶質的克數來表示。溶解度與溫度不一定呈直線關係，現有甲、乙、丙、丁四種固體的溶解度曲線如附圖所示。'
  shared_asset: g1_9_10
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 50℃的甲溶液溶解度為100 g／100 g，20%的100 g甲溶液為20 g溶質＋80 g溶劑，若要甲溶液達飽和，需加入60 g甲溶質固體。故選(C)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 取50℃、200 g的水四瓶，分別溶入甲、乙、丙、丁，製成飽和溶液，當冷卻至20℃時，所析出的固體克數大小順序為何？
  options:
  - label: A
    content: 甲＞乙＞丙＞丁
  - label: B
    content: 乙＞丁＞丙＞甲
  - label: C
    content: 乙＞丙＞丁＞甲
  - label: D
    content: 甲＞丙＞乙＞丁
  - label: E
    content: 甲＞乙＞丁＞丙
  group_stem: '】

    溶質與溶劑均勻混合的過程稱為溶解。在定溫時，將某固體物質加入盛有定量水的燒杯中，攪拌後該物質溶解；若再持續加入該物質，溶液的濃度逐漸加大，直到仍有該物質留在燒杯中。因此，定溫時，一定量的水只能溶解一定量的某固體物質，而在此種狀態下的溶液稱為飽和溶液。飽和溶液中所含溶質的量，稱為該溶質在該溫度時的溶解度，可用100克溶劑所能溶解溶質的克數來表示。溶解度與溫度不一定呈直線關係，現有甲、乙、丙、丁四種固體的溶解度曲線如附圖所示。'
  shared_asset: g1_9_10
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 斜率最大者，降溫時會析出最多固體，故甲＞乙＞丙＞丁。故選(A)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 反應式2 $H_{2}$＋$O_{2}$ → 2 $H_{2}$O中，何者為還原劑？
  options:
  - label: A
    content: $H_{2}$
  - label: B
    content: $O_{2}$
  - label: C
    content: $H_{2}$O
  - label: D
    content: $H_{2}$、$O_{2}$
  - label: E
    content: $H_{2}$、$H_{2}$O
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 得到氧、失去氫、發生氧化反應者為還原劑，故為$H_{2}$。故選(A)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 汽車引擎會排放出$CO_{2}$、CO、$NO_{x}$及碳氫化合物等廢氣，造成空氣汙染。改善排放廢氣毒性，可藉由加裝觸媒轉化器來著手。由引擎排出的廢氣在進入大氣之前，可先通過觸媒轉化器的第一部分，將NO反應成$NH_{3}$；之後再引進空氣與其混合，通過第二部分，觸媒轉化器可使廢氣中的CO及未完全燃燒的碳氫化合物在較低的溫度下，反應成$CO_{2}$及$H_{2}$O，並使氨氣反應成$N_{2}$及$H_{2}$O，使排出的廢氣中的碳氫化合物下降至30 ppm及CO下降至0.1%。試問觸媒轉化器的第一部分，將NO反應成$NH_{3}$，是屬於哪一種化學反應？
  options:
  - label: A
    content: 氧化還原反應
  - label: B
    content: 加成反應
  - label: C
    content: 酸鹼反應
  - label: D
    content: 離子沉澱反應
  - label: E
    content: 電鍍反應
  group_stem: 】
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: NO → $NH_{3}$，失去氧、得到氫、發生還原反應。故選(A)。
- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 承上題，在第二部分中，使$NH_{3}$反應成$N_{2}$及$H_{2}$O的反應中，此時$NH_{3}$中的氮原子發生了什麼變化？
  options:
