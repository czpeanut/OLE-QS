- id: doc_110_桃園_內壢_自然_化學_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列有關生物體內有機物質的敘述，哪一項敘述完全正確？
  options:
  - label: A
    content: 含C＝C雙鍵的脂肪屬於飽和脂肪，含C－C單鍵的脂肪屬於不飽和脂肪
  - label: B
    content: 核苷酸的結構包括五碳醣、含氮鹼基與磷酸根，其中五碳醣屬於單醣
  - label: C
    content: 葡萄糖、果糖和半乳糖均為單醣，此三種單醣皆屬於同素異形體
  - label: D
    content: 蛋白質是由胺基酸聚合而成，所有胺基酸均可由人體自行合成，稱為必需胺基酸
  - label: E
    content: 葡萄糖和麥芽糖屬於同分異構物
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)敘述相反，有雙鍵者為不飽和脂肪、沒有雙鍵者為飽和脂肪；(B)正確；(C)為同分異構物；(D)有些胺基酸人體無法自行合成，需進食補充；(E)葡萄糖為單醣、麥芽糖為雙醣，不為同分異構物。故選(B)。
