  page: 3
  stem: 某班級 50 位學生，段考數學、英文、國文及格的人數分別為 43、37、27 人。現假設數學和英文皆及格的有 x 人。請選出正確的選項。
  options:
  - label: A
    content: 數學及格或英文及格的人數為 80－x 人
  - label: B
    content: 數學和英文皆及格的人數，至少有 30 人
  - label: C
    content: 數學及格但英文不及格的人數為 37－x 人
  - label: D
    content: 數學及格但英文不及格的人數至多有 13 人
  - label: E
    content: 三科都及格的人數至少有 7 人
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：n（數及格或英及格）

    ＝n（數及格）＋n（英及格）－n（數及格且英及格）

    ＝43＋37－x＝80－x

    (B) ○：∵80－x ≤ 50 ∴30 ≤ x

    故數學和英文皆及格的人數至少有 30 人

    (C) ╳：n（數及格且英不及格）＝n（數及格）－n（數及格且英及格）

    ＝43－x

    (D) ○：∵30 ≤ x

    ∴－30 ≥ －x

    ⇒ 43－x ≤ 43－30＝13

    故數學及格但英文不及格的人數至多有 13 人

    (E) ○：三科都及格的最少情況為「數及格且英及格」和「國及格」重疊的最少

    故至少有 30＋27－50＝7（人）

    故選(A)(B)(D)(E)'
