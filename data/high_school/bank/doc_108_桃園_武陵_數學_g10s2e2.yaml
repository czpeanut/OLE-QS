  stem: 將$\left( 17x-\frac{1}{17x} \right) ^{8}$展開之後，常數項應為＿＿＿＿。
  answer:
  - '70'
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left( 17x -\frac{1}{17x} \right) ^{8}$之一般項為

    $C_{k}^{8}(17x)^{k}\left( -\frac{1}{17x} \right) ^{8-k}$＝$C_{k}^{8}17^{k}x^{k}\left( -\frac{1}{17} \right) ^{8-k}x^{k-8}$

    ＝$(-1)^{8-k}C_{k}^{8}17^{k}17^{k-8}x^{2k-8}$

    ＝$(-1)^{8-k}C_{k}^{8}17^{2k-8}x^{2k-8}$

    2k－8＝0 ⇒ k＝4

    k＝4 代入得常數項為$(-1)^{4}C_{4}^{8}17^{0}= 70$'
