    (1) 若以點表示 A、B、C、D、E 五人，兩人互相認識即以兩點之間的連線表示，否則則不畫線，如右圖範例代表：AB 兩人互相認識、BC 兩人互相認識、……、AE 兩人互不相識。問今有 5 人排隊買口罩，此 5 人相識的情形有多少可能？（單選，4 分）'
