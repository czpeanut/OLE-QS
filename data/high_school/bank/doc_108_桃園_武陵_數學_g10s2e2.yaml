  section: 1
  number: 1
  type: calc
  page: 1
  stem: '寒假在家<u>小宇</u>打算看兩部電視劇，〈史內克〉有 5 集，每集 1 個小時，〈鬼不來電〉有 6 集，每集 30 分鐘。他安排在星期一到星期四每天 13：00～15：00 看兩小時，每個電視劇集數都須按順序看且該集必須看完才能看別集，也不能把〈史內克〉一集分兩天看。（下表是其中一種安排方法）

    |  | 星期一 | 星期二 | 星期三 | 星期四 |

    | --- | --- | --- | --- | --- |

    | 13：00～13：30 | 鬼不來電 | 史內克 | 史內克 | 鬼不來電 |

    | 13：30～14：00 | 鬼不來電 |  |  | 史內克 |

    | 14：00～14：30 | 鬼不來電 | 史內克 | 史內克 |  |

    | 14：30～15：00 | 鬼不來電 |  |  | 鬼不來電 |

    (1) 若其中一天看了 4 集〈鬼不來電〉，則整週的安排有多少可能？（5 分）

    (2) 若每天都有看〈史內克〉，則整週的安排有多少可能？（5 分）'
  answer:
  - (1) 若其中一天看了 4 集〈鬼不來電〉
