  - label: B
    content: '1'
  - label: C
    content: $\frac{2}{7}$
  - label: D
    content: $\frac{7}{2}$
  - label: E
    content: 不存在
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow 0} \frac{2x}{\tan 7x}$＝$\lim_{x \rightarrow 0} \frac{2x \cos 7x}{\sin 7x}$＝$\lim_{x \rightarrow 0} \left( \frac{2}{7}\times \frac{7x}{\sin 7x}\times \cos 7x \right)$＝$\frac{2}{7}$×1×1＝$\frac{2}{7}$

    故選(C)'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 試求$\lim_{n \rightarrow \infty} \left( \frac{1}{\sqrt{2n^{2}+1}}+\frac{1}{\sqrt{2n^{2}+2}}+\cdots \cdots +\frac{1}{\sqrt{2n^{2}+n}} \right)$＝？
  options:
  - label: A
    content: '0'
  - label: B
    content: '1'
  - label: C
    content: $\frac{1}{2}$
  - label: D
    content: $\frac{1}{\sqrt{2}}$
  - label: E
    content: 不存在
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{n \rightarrow \infty} \frac{n}{\sqrt{2n^{2}+n}}$＜$\lim_{n \rightarrow \infty} \left( \frac{1}{\sqrt{2n^{2}+1}}+\frac{1}{\sqrt{2n^{2}+2}}+\cdots \cdots +\frac{1}{\sqrt{2n^{2}+n}} \right)$＜$\lim_{n \rightarrow \infty} \frac{n}{\sqrt{2n^{2}+1}}$

    又$\lim_{n \rightarrow \infty} \frac{n}{\sqrt{2n^{2}+n}}$＝$\lim_{n \rightarrow \infty} \frac{1}{\sqrt{2+\frac{1}{n}}}$＝$\frac{1}{\sqrt{2}}$

    $\lim_{n \rightarrow \infty} \frac{n}{\sqrt{2n^{2}+1}}$＝$\lim_{n \rightarrow \infty} \frac{1}{\sqrt{2+\frac{1}{n^{2}}}}$＝$\frac{1}{\sqrt{2}}$

    由夾擠定理得$\lim_{n \rightarrow \infty} \left( \frac{1}{\sqrt{2n^{2}+1}}+\frac{1}{\sqrt{2n^{2}+2}}+\cdots \cdots +\frac{1}{\sqrt{2n^{2}+n}} \right)$＝$\frac{1}{\sqrt{2}}$

    故選(D)'
