  stem: 若 a，b 為實數，欲使函數 f（x）＝$\begin{cases}ax -b , x\leq 1 \\ x^{2}+bx + 4 , x > 1\end{cases}$為一連續且可微分函數，則數對（a，b）＝＿＿＿＿。
  answer:
  - （－1，－3）
  answer_status: verified
  answer_source: answer_key
  explanation: '①連續：$\lim_{x \rightarrow 1^{-}} f ( x )$＝$\lim_{x \rightarrow 1^{+}} f ( x )\Rightarrow\lim_{x \rightarrow 1^{-}} ( ax -b )$＝$\lim_{x \rightarrow 1^{+}} ( x^{2}+bx + 4 )$

    $\Rightarrow$a－b＝1＋b＋4$\Rightarrow$a－2b＝5

    ②可微：$\lim_{x \rightarrow 1^{-}} \frac{f ( x )-f ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{f ( x )-f ( 1 )}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{-}} \frac{( ax -b )-( a -b )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{( x^{2}+bx + 4 )-( 1 +b + 4 )}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{-}} \frac{a ( x - 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{( x^{2}- 1 )+b ( x - 1 )}{x - 1}$

    $\Rightarrow$a＝2＋b$\Rightarrow$a－b＝2

    由①、②得數對（a，b）＝（－1，－3）'
