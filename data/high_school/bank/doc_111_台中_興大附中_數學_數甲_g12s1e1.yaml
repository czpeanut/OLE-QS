  stem: 設 P 點為 f（x）＝$x^{2}$－8 圖形外一點，已知過 P 點的切線有兩條，其斜率分別為 3，－5，試求 P 點的坐標為＿＿＿＿。
  answer:
  - $\left( -\frac{1}{2} , -\frac{47}{4} \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: '設切點為 Q（a，$a^{2}$－8），f''（x）＝2x$\Rightarrow$f''（a）＝2a＝3 或－5

    a＝$\frac{3}{2}$時，切點為$\left( \frac{3}{2} , -\frac{23}{4} \right)\Rightarrow$切線方程式為 y－$\left( -\frac{23}{4} \right)$＝$3 \left( x -\frac{3}{2} \right)\Rightarrow$12x－4y＝41

    a＝$-\frac{5}{2}$時，切點為$\left( -\frac{5}{2} , -\frac{7}{4} \right)\Rightarrow$切線方程式為 y－$\left( -\frac{7}{4} \right)$＝$-5 \left[ x - \left( -\frac{5}{2} \right) \right]\Rightarrow$20x＋4y＝－57

    $\begin{cases}12x - 4y = 41 \\ 20x + 4y =-57\end{cases}\Rightarrow$x＝$-\frac{1}{2}$，y＝$-\frac{47}{4}$

    故 P 點坐標為$\left( -\frac{1}{2} , -\frac{47}{4} \right)$'
