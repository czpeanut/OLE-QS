    ∴$\lim_{x \rightarrow -2} \left( f ( x )+\frac{f ( x )}{x} \right)$＝f（－2）＋$\frac{f ( -2 )}{-2}$＝4＋$\frac{4}{-2}$＝2'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e1_s3_4
  section: 3
  number: 4
  type: fill
  page: 2
  stem: 若$\lim_{x \rightarrow -1} \frac{2x^{2}+ax +b}{x^{2}-x - 2}$＝$\frac{5}{3}$，則數對（a，b）＝＿＿＿＿。
  answer:
  - （－1，－3）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow -1} \frac{2x^{2}+ax +b}{x^{2}-x - 2}$＝$\lim_{x \rightarrow -1} \frac{2x^{2}+ax +b}{( x + 1 ) ( x - 2 )}$＝$\frac{5}{3}\Rightarrow$x＋1 為 $2x^{2}$＋ax＋b 的因式

    $\Rightarrow$2（－1）$^{2}$＋a（－1）＋b＝0$\Rightarrow$b＝a－2 ……（＊）

    （＊）代回原式得

    $\lim_{x \rightarrow -1} \frac{2x^{2}+ax +( a - 2 )}{( x + 1 ) ( x - 2 )}$＝$\lim_{x \rightarrow -1} \frac{2 ( x^{2}- 1 )+a ( x + 1 )}{( x + 1 ) ( x - 2 )}$

    ＝$\lim_{x \rightarrow -1} \frac{2 ( x - 1 )+a}{x - 2}$＝$\frac{2 ( -1 - 1 )+a}{-1 - 2}$＝$\frac{5}{3}$

    $\Rightarrow\frac{-4 +a}{-3}$＝$\frac{5}{3}\Rightarrow$a＝－1

    代回（＊）得 b＝－3

    ∴數對（a，b）＝（－1，－3）'
