    $\lim_{x \rightarrow 0} \frac{\sqrt{ax + 4} - 2}{x}$＝$\lim_{x \rightarrow 0} \frac{( \sqrt{ax + 4} - 2 ) ( \sqrt{ax + 4} + 2 )}{x ( \sqrt{ax + 4} + 2 )}$＝$\lim_{x \rightarrow 0} \frac{ax}{x ( \sqrt{ax + 4} + 2 )}$

