  stem: 試求$\lim_{n \rightarrow \infty} \frac{\left( \frac{10}{11} \right) ^{n}}{\left( \frac{9}{10} \right) ^{n}+ \left( \frac{11}{12} \right) ^{n}}$＝？
  options:
  - label: A
    content: '0'
  - label: B
    content: '1'
  - label: C
    content: $\frac{1}{2}$
  - label: D
    content: '2'
  - label: E
    content: 不存在
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{9}{10}$＜$\frac{10}{11}$＜$\frac{11}{12}$，原式的分子、分母同除以$\left( \frac{11}{12} \right) ^{n}$得

    $\lim_{n \rightarrow \infty} \frac{\left( \frac{10}{11} \right) ^{n}}{\left( \frac{9}{10} \right) ^{n}+ \left( \frac{11}{12} \right) ^{n}}$＝$\lim_{n \rightarrow \infty} \frac{\left( \frac{10\times 12}{11^{2}} \right) ^{n}}{\left( \frac{9\times 12}{10\times 11} \right) ^{n}+ 1}$＝$\frac{0}{0 + 1}$＝0

    故選(A)'
