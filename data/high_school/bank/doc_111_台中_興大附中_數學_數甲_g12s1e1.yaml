  stem: 試求$\lim_{x \rightarrow \infty} ( \sqrt{x + \sqrt{x + \sqrt{x}}} - \sqrt{x} )$＝？
  options:
  - label: A
    content: '0'
  - label: B
    content: '1'
  - label: C
    content: $\frac{1}{2}$
  - label: D
    content: $\frac{1}{4}$
  - label: E
    content: 不存在
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow \infty} ( \sqrt{x + \sqrt{x + \sqrt{x}}} - \sqrt{x} )$＝$\lim_{x \rightarrow \infty} \frac{( \sqrt{x + \sqrt{x + \sqrt{x}}} - \sqrt{x} ) ( \sqrt{x + \sqrt{x + \sqrt{x}}} + \sqrt{x} )}{\sqrt{x + \sqrt{x + \sqrt{x}}} + \sqrt{x}}$ ＝$\lim_{x \rightarrow \infty} \frac{( \sqrt{x + \sqrt{x + \sqrt{x}}} )^{2}-( \sqrt{x} )^{2}}{\sqrt{x + \sqrt{x + \sqrt{x}}} + \sqrt{x}}$＝$\lim_{x \rightarrow \infty} \frac{\sqrt{x + \sqrt{x}}}{\sqrt{x + \sqrt{x + \sqrt{x}}}+ \sqrt{x}}$ ＝$\lim_{x \rightarrow \infty} \frac{\sqrt{1+\frac{\sqrt{x}}{x}}}{\sqrt{1+\frac{\sqrt{x + \sqrt{x}}}{x}} + 1}$＝$\frac{1}{1+1}$＝$\frac{1}{2}$

    故選(C)'
- id: doc_111_台中_興大附中_數學_數甲_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列各極限哪些存在？
  options:
  - label: A
    content: $\lim_{x \rightarrow 1} \frac{x | x |- 1}{x - 1}$
  - label: B
    content: $\lim_{x \rightarrow 0} x \sin \frac{1}{x}$
  - label: C
    content: $\lim_{x \rightarrow 0} \frac{1 - \cos x}{x}$
  - label: D
    content: $\lim_{x \rightarrow 0} f ( x )$，其中 f（x）＝$\begin{cases}1 , x 為有理數 \\ 0 , x 為無理數\end{cases}$
  - label: E
    content: $\sum_{n =1}^{\infty} ( \sqrt{n+1} - \sqrt{n} )$
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\lim_{x \rightarrow 1^{+}} \frac{x | x |- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{x ( x )- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{x^{2}- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} ( x + 1 )$＝2

    $\lim_{x \rightarrow 1^{-}} \frac{x | x |- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{x ( x )- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{x^{2}- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} ( x + 1 )$＝2

    ∴$\lim_{x \rightarrow 1} \frac{x | x |- 1}{x - 1}$＝2

    (B)○：$\lim_{x \rightarrow 0} \left| x \sin \frac{1}{x} \right|\leq\lim_{x \rightarrow 0} | x |$＝0$\left( \because \left| \sin \frac{1}{x} \right| \leq 1 \right)$

    由夾擠定理知，$\lim_{x \rightarrow 0} \left| x \sin \frac{1}{x} \right|$＝0 ∴$\lim_{x \rightarrow 0} x \sin \frac{1}{x}$＝0

    (C)○：$\lim_{x \rightarrow 0} \frac{1-\cos x}{x}$＝$\lim_{x \rightarrow 0} \frac{( 1-\cos x ) ( 1+\cos x )}{x ( 1+\cos x )}$＝$\lim_{x \rightarrow 0} \frac{1-\cos ^{2}x}{x ( 1+\cos x )}$

    ＝$\lim_{x \rightarrow 0} \frac{\sin ^{2}x}{x ( 1+\cos x )}$＝$\lim_{x \rightarrow 0} \left( \frac{\sin x}{x}\times \frac{\sin x}{1+\cos x} \right)$＝1×$\frac{0}{1 + 1}$＝0

    (D)╳：x 為有理數時，$\lim_{x \rightarrow 0} f ( x )$＝$\lim_{x \rightarrow 0} 1$＝1

    x 為無理數時，$\lim_{x \rightarrow 0} f ( x )$＝$\lim_{x \rightarrow 0} 0$＝0

    ∴$\lim_{x \rightarrow 0} f ( x )$不存在

    (E)╳：$\sum_{n =1}^{\infty} ( \sqrt{n + 1} - \sqrt{n} )$＝$\lim_{k \rightarrow \infty} \sum_{n =1}^{k} ( \sqrt{n + 1} - \sqrt{n} )$

    ＝$\lim_{k \rightarrow \infty} 〔 ( \sqrt{2} - \sqrt{1} ) + ( \sqrt{3} - \sqrt{2} ) + ( \sqrt{4} - \sqrt{3} ) + ( \sqrt{5} - \sqrt{4} ) +\cdots \cdots + ( \sqrt{k+1} - \sqrt{k} ) 〕$

    ＝$\lim_{k \rightarrow \infty} ( \sqrt{k+1} - \sqrt{1} )$不存在

    故選(A)(B)(C)'
