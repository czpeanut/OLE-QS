  stem: 某超市粉絲團的成員，紛紛在粉絲團 PO 自製鹹水雞的做法，並可自行添加玉米筍、小黃瓜、花椰菜等喜好之配料；頓時自製鹹水雞成為流行，而街頭的鹹水雞攤為了刺激消費者再度回籠消費，只好祭出買一送一的特價優惠。根據題意研判，下列哪些是正確的？
