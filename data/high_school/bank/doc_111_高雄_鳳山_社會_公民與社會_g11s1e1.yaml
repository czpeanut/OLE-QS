- id: doc_111_高雄_鳳山_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 某國政府為避免米價過低影響農民生計與生產意願，規定米價每公斤不得低於 50 元。在其他情況不變下，請問有關此措施實施後對米市場影響的敘述，何者正確？
  options:
  - label: A
    content: 當米的市價為每公斤 60 元時，此措施將會提高農民的生產者剩餘
  - label: B
    content: 當米的市價低於每公斤 50 元時，市場將出現需求大於供給的現象
  - label: C
    content: 此類價格上限的價格管制，將會降低消費者剩餘、提高生產者剩餘
  - label: D
    content: 米的市價為每公斤 40 元時，農民將增加稻的供給量，使市場出現過剩現象
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 米價每公斤不得低於 50 元，為政府管制的價格下限措施，有效的價格下限應高於市場的均衡價格。(A)當米的市價為每公斤 60 元時，此措施為無效的價格下降。(B)當米的市價低於每公斤 50 元時，價格下限會使市場的供給大於需求。(C)此類價格下限的價格管制，將會降低消費者剩餘，但不一定提高生產者剩餘。(D)若米的市價為每公斤 40 元時，因為價格下限為 60 元，故農民會增加稻的供給量，消費者會減少需求量，使市場出現過剩現象，故正確。
  tags:
    unit:
      code: CI-3-3-3
      book: 公民與社會3 選擇與永續
      chapter: 市場機能與政府管制
      title: 政府管制
      std: true
    textbook: 公民與社會3 選擇與永續 政府管制
