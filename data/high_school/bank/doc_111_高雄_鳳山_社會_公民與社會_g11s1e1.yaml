  stem: '右表為小華對於某市場外部效果分析的作業，其中左半部的供給、需求價量關係未考慮外部效果，右半部的供給、需求價量關係考慮外部效果。根據表中資料判斷，有關此市場的外部效果，以下敘述何者正確？

