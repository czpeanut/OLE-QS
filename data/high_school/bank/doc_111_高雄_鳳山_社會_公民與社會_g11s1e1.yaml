  stem: 屏東種植紅豆的農民，過去為避免鳥害造成農損，會利用毒餌造成小型鳥類死亡，進而導致撿食的老鷹跟著中毒。近來因維護生態環境，在播種期不毒鳥、以新創農業的方式建立「老鷹紅豆」品牌以及產銷履歷。雖然生產紅豆的成本上升，但有效提升消費者對產品的評價，使市場銷售價格與數量都大幅提升。請問以下何者最可以表現屏東紅豆由傳統產銷方式到新創品牌後，其市場供給與需求的變動情形？
  options:
  - label: A
    content: 供給線左移，需求線右移，且前者移動幅度大於後者
  - label: B
    content: 供給線左移，需求線右移，且後者移動幅度大於前者
  - label: C
    content: 供給線左移，需求線左移，且後者移動幅度大於前者
  - label: D
    content: 供給線右移，需求線右移，且前者移動幅度大於後者
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 生產紅豆的成本上升，表示供給線左移；有效提升消費者對產品的評價，表示需求線右移；但結果為市場銷售價格與數量都大幅提升，表示需求右移的幅度大於供給左移的幅度，故選(B)。
  tags:
    unit:
      code: CI-3-3-1
