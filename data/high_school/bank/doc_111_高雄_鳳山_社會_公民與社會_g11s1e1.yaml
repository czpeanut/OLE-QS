  stem: '表格是某國手機市場的供需表。若該國政府認為由於手機的普遍導致人民產生「科技冷漠」，因此試圖推動價格下限，希望民眾減少購買手機，將生活重心放在人與人之間的相處。依據本文及表中的數據，下列哪些選項正確？

    | 價格（元） | 10,000 | 15,000 | 20,000 | 25,000 | 30,000 |

    | --- | --- | --- | --- | --- | --- |

    | 需求量（萬臺） | 7 | 6 | 5 | 4 | 3 |

    | 供給量（萬臺） | 3 | 4 | 5 | 6 | 7 |'
  options:
  - label: A
    content: 若該國政府想達到其目的，可將下限定在 25,000 元
  - label: B
    content: 若該國政府將下限定在 15,000 元，將產生 2 萬臺的供不應求
  - label: C
    content: 該國政府是想要以直接管制的方式，紓緩手機產生的外部成本
  - label: D
    content: 將下限定在 30,000 元所產生的無謂損失將比規定在 25,000 元來得大
  - label: E
    content: 將下限定在 10,000 元所產生的無謂損失將比規定在 15,000 元來得大
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)若該國政府想達到其目的，把價格拉高至均衡價格之上，設定價格下限必須大於 20,000 元，故 25,000 的價格下限是可行的，正確。(B)(E)價格下限應高於均衡價格 20,000 元，才會有效。(C)這是價格管制，不是直接管制。(D)若將價格下限定在 30,000 元，此時供過於求的情況會更嚴重，因此無謂損失更大，故正確。
