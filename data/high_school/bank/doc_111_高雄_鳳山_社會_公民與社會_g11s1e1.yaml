  stem: 統一企業斥資 290 億收購家樂福，將一口氣增加臺灣家樂福全臺 340 間分店的經營權，也將成為臺灣唯一橫跨超商、超市、量販店、藥妝店、百貨公司的零售集團，與全聯差距再度拉開。同學針對這個併購案進行討論，以下誰的發言符合我國法律規範？
  options:
  - label: A
    content: 甲：「統一併購家樂福，屬企業現代化之主要手段與趨勢，我國並無法規規範。」
  - label: B
    content: 乙：「這是家樂福與統一之聯合行為，足以影響商品之市場功能，為《公平交易法》所禁止。」
  - label: C
    content: 丙：「如此一來消費者的超市選擇變少了，侵害消費者權益，消費者保護會應該提出調查。」
  - label: D
    content: 丁：「統一與家樂福合併可能造成市場上的壟斷，應得到公平交易委員會之許可。」
