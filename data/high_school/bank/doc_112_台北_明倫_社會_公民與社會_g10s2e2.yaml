  stem: 《醫療法》第 84 條規定：「非醫療機構，不得為醫療廣告。」其中關於禁止醫師為醫療廣告之部分，112 年憲判字第 17 號判決指出，為保障民眾免於因商業廣告或標示內容而生誤導，或為增進其他重要公共利益目的，例如保護國民健康，立法者自得制定必要的規範。然而，醫師為具備醫療專業知識且依法得執行醫療業務之人，由醫師提供相關適當訊息，不僅是表現自我或傳播訊息的作用，也有助於病患就醫選擇，禁止醫師為醫療廣告，未必有利於國民健康之維護。因此<u>為達到維護國民健康之目的，與所採禁止醫師為醫療廣告之手段間，難認有何實質關聯，違反《憲法》第 23 條</u>(<u>甲)原則</u>，亦與《憲法》保障言論自由之意旨有違，於此範圍內，應自本判決公告之日起，失其效力。根據《憲法》相關規範判斷，文中畫底線處的(甲)最可能是哪一項原則？
  options:
  - label: A
    content: 法律保留原則
  - label: B
    content: 比例原則—適當性原則
  - label: C
    content: 比例原則—必要性原則
  - label: D
    content: 比例原則—衡量性原則
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 比例原則是衡量手段是否過度的標準，手段與目的之間必須適當。此原則包括：適當性原則（採取的手段必須有助於目的之達成）、必要性原則（各種手段中，必須選擇對權利侵害程度最小的手段）及衡量性原則（手段造成的損害，必須小於目的所欲達成的利益）。依據畫線部分，應選(B)比例原則—適當性原則。
