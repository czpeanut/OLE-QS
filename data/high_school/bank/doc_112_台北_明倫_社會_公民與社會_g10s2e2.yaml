  stem: 立法院於 2024 年 4 月 16 日三讀通過《行人交通安全設施條例》，成為第 11 屆立法院首部三讀通過的法案。下列有關《行人交通安全設施條例》的立法程序，何者為正確的順序？(甲)立法院院會審查草案內容、進行議案表決(乙)行政院通過「行人交通安全設施條例草案」函請立法院審議(丙)經行政院院長及內政部部長副署後，由總統公布(丁)立法院程序委員會將法案編入院會議程(戊)立法院院會宣讀標題後交付內政委員會審查
  options:
  - label: A
    content: (乙)→(丁)→(戊)→(甲)→(丙)
  - label: B
    content: (乙)→(戊)→(甲)→(丁)→(丙)
  - label: C
    content: (丁)→(乙)→(甲)→(戊)→(丙)
  - label: D
    content: (丁)→(戊)→(甲)→(丙)→(乙)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 立法院的立法程序如下：(乙)行政院通過草案函請立法院審議→(丁)程序委員會排入議程→(戊)院會宣讀標題後交付內政委員會審查→(甲)院會審查內容、進行議案表決→(丙)經行政院院長及內政部部長副署後，由總統公布。故選(A)。
