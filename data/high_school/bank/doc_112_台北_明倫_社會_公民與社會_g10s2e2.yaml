- id: doc_112_台北_明倫_社會_公民與社會_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 過去《監獄行刑法》第 66 條中規定：「發受書信，由監獄長官檢閱之。」司法院釋字第 756 號解釋認為，所稱「檢閱」一詞，包括檢查及閱讀。其中檢查書信部分，旨在使監獄長官確認有無夾帶違禁品，於所採取之檢查手段與目的之達成間，具有合理關聯之範圍內，與《憲法》第 12 條保障祕密通訊自由之意旨尚無違背。其中閱讀書信部分，未區分書信種類，亦未斟酌個案情形，一概允許監獄長官閱讀書信之內容，顯已對受刑人及其收發書信之相對人之祕密通訊自由，造成過度之限制。綜上所述，下列敘述何者符合大法官解釋意旨？
  options:
  - label: A
    content: 不論檢查或閱讀受刑人之書信，該行為均違反祕密通訊自由
  - label: B
    content: 監獄長官檢查受刑人之書信，欠缺限制基本權利的正當理由
  - label: C
    content: 不分種類一概允許監獄長官閱讀書信內容，已違反比例原則
  - label: D
    content: 監獄行刑只能限制受刑人的人身自由，才符合公平正義精神
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)大法官認為監獄長官檢查書信有無夾帶違禁品，所採取的手段與目的間具有合理關聯性，不違反比例原則。(C)依照題文「未區分書信種類、亦未斟酌個案情形……造成過度之限制」，表示此部分已違反比例原則，為正解。(D)基於公共利益等目的，可依法限制其他權利，但須在合理範圍內，具有正當理由才能予以限制。
