- id: doc_112_台北_明倫_社會_公民與社會_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 大雄開了一間小吃店，因標榜「白飯免費吃」吸引不少顧客上門。某日胖虎到小吃店消費，但當天提供的白飯因顧店眾多來不及供應，心生不滿的胖虎便在網路平臺上對小吃店狂洗 1 星負評、謊稱菜裡有蟲、又貴又難吃等。大雄得知後，認為胖虎所稱並非事實便狀告胖虎，要求胖虎給予金錢賠償並在網路平臺上替店家給予正面留言及 5 星評價。法官審酌後認為胖虎確實應給予金錢賠償，但駁回「在網路平臺上替店家給予正面留言及 5 星評價」的訴求。對於法官駁回訴求所依據的法律原則，與下列哪一事件涉及的法律原則相同？
  options:
  - label: A
    content: 警察用測速照相機偷拍路過的超速車輛並逕行舉發
  - label: B
    content: 雇主因員工無故未到班而依勞動契約扣其一日薪水
  - label: C
    content: 甲在其土地上搭鐵皮圍籬用以阻擋乙住家對外通行
  - label: D
    content: 甲承諾以一百萬出售古董花瓶給乙，卻交付仿製品
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 法官的判決屬於權利濫用禁止原則，《民法》第 148 條第 1 項有規定：「權利之行使，不得違反公共利益，或以損害他人為主要目的。」(A)(D)違反誠實信用原則。(B)符合依法行政原則。(C)此為違反權利濫用之禁止原則，與題文案例相符。
