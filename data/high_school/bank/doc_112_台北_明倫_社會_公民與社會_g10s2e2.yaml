  stem: 近年來「自動駕駛」技術逐漸成熟，AI 可取代傳統駕駛人掌控方向盤、油門和煞車，對需要長途駕車的人來說帶來便利。然而，隨著路上自駕車的增加，自駕車發生車禍的情況也愈發普遍。這種情況下，關於事故賠償責任的歸屬存在爭議：究竟是應由坐在駕駛座的駕駛人負責，還是開發自動駕駛技術的車廠負責。有論者認為，過去《強制汽車責任保險法》只規範了駕駛人，未專門涵蓋車廠，因此政府應制定《強制自動駕駛車輛責任保險法》，要求車主和自駕技術研發的車廠都應投保以應對事故風險。假設立法院通過《強制自動駕駛車輛責任保險法》，關於自駕車投保的法律適用，下列敘述何者正確？
