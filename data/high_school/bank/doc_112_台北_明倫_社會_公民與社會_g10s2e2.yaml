  stem: 隨著環保意識抬頭，不少廟宇響應減香政策，引導信徒們以雙手合十參拜。下列哪一種社會規範的改變因素與廟宇的作為最為相近？
  options:
  - label: A
    content: 婦女團體倡議廢除非洲部落的女性割禮習俗
  - label: B
    content: 《家庭暴力防治法》打破了家醜不可外揚的想法
  - label: C
    content: 蒙哥馬利公車抵制運動促使種族隔離制度的省思
  - label: D
    content: 聯合國透過相關的人權公約禁止童婚的傳統
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 環保意識抬頭，為社會變遷導致價值觀改變。(A)此為人權的提倡。(B)這是受到社會變遷，使家醜不可外揚的觀念改變，讓法律或其他援助可介入保護家庭暴力下的受害者，與題幹案例相符。(C)此為人權觀念的改變。(D)此為國際公約影響國內法規。
