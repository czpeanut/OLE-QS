  stem: 過去我國勞資雙方因勞動關係所發生之民事上紛爭，僅依《民事訴訟法》的一般性規定，難以回應勞資雙方的需求。因此立法院於 2018 年 11 月三讀通過《勞動事件法》，並於 2020 年 1 月起施行。該法施行後，各級法院須成立專責審理勞動事件的勞動法庭，以實現專業、有效處理勞動事件的立法目的。請問在《勞動事件法》施行後，勞動事件優先適用於該法而非《民事訴訟法》的原因為何？
