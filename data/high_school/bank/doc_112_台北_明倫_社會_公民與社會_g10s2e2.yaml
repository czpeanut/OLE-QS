  stem: 憲法法庭 111 年憲判字第 4 號判決中指出，我國就原住民身分之取得，除須登記外，原則上採取血統主義及自我認同原則。但《原住民身分法》因另外附加「從具原住民身分之父或母之姓或原住民傳統名字」等原住民文化認同要件，而造成具有血統、但不符合前述要件的原住民，其《憲法》所保障之身分認同權受到限制。此外，這樣的規定也造成「父母皆為原住民」的子女必定可以取得原住民身分，但「父母僅一方為原住民」的子女卻未必能取得原住民身分，顯然牴觸《憲法》第 7 條平等權之意旨。請問根據判決意旨，實踐平等權時應符合下列哪一概念？
