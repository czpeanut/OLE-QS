  stem: 為探究各國出生率偏低現象與因應措施，某校同學閱讀以下資料：「多位學者發現，中高所得國家年輕人晚婚或終身不婚的現象很普遍，導致各國生育率皆呈現下降趨勢。學者甲指出，同為中高所得國家，北歐國家的出生率較東亞國家高，而北歐國家的新生兒有半數以上出生於無法定婚姻關係的父母，但在東亞國家絕大多數的新生兒都出生在法定婚姻關係之內。」請問學者甲若依據自己的發現來解釋北歐國家出生率比東亞國家高的現象，最可能選擇下列哪個因素來解釋？
