  page: 1
  stem: 在 COVID-19 疫情嚴峻時期，立法院快速通過並由總統公布《嚴重特殊傳染性肺炎防治及紓困振興特別條例》，授權中央流行疫情指揮中心指揮官，為防治疫情需要，得實施必要之應變措施，並溯及在此條例通過前所發布的一些命令，以解決法律爭議。立法院迅速通過該特別條例，其為解決之法律爭議與某個法律原則相關。請問該原則與下列哪一敘述中蘊含的法律原則最相近？
  options:
  - label: A
    content: 政府訂定鐵路沿線拆遷戶拆遷期限，但到期前二日即前往拆除水表與電表
  - label: B
    content: 行政機關僅以自訂之行政規則對健保資料利用予以規定，欠缺法律位階明確規定
  - label: C
    content: 經大法官釋憲，確定相同性別二人可至戶政機關辦理結婚登記
  - label: D
    content: 為擺脫行人地獄惡名，不禮讓行人者應一律以最高額度罰鍰處罰
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹所述為立法權通過防疫相關條例，以使疫情間行政機關發布的命令能符合法律原則，此為法律保留原則之展現。(A)違反誠信原則。(B)違反法律保留原則，與題幹情境所蘊含的法律原則相同。(C)符合法治國原則∕法律優越原則。(D)違反比例原則。
