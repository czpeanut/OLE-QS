  stem: 2023 年 7 月，阿富汗塔利班（Taliban）政府下令全國美容院在一個月內關閉，迫使數以千計由女性經營的美容院必須關門，近 6 萬名女子將因此失業。政令下達後<u>數十名婦女走上喀布爾街頭抗議</u>，卻遭安全人員鳴槍並以高壓水柱驅離。參與示威的婦女事後表示，被迫失業後，不知將何以維生。請問文中畫底線所展現的基本人權類別與下列何者最相似？
  options:
  - label: A
    content: 以實踐社會處處美麗政治為宗旨，經內政部同意備案成立「美麗無限黨」
  - label: B
    content: 《高級中等教育法》明定學生對學校之懲處、其他措施或決議，認為違法或不當致損害其權益時，得依法提起行政爭訟
  - label: C
    content: 為保障國民居住權益，政府興建只租不賣的社會住宅強化社會安全網
  - label: D
    content: 少年輔助院改制為矯正學校，提供感化教育學生健全專業的師資品質
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 上街頭抗議為集會自由及意見表達自由之展現。(A)組成政黨為結社自由，與題幹皆為自由權之範疇。(B)此為訴訟權。(C)此為社會權。(D)此為保護觸犯法律的未成年人之受教權。
