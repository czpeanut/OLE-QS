- id: doc_112_台北_明倫_社會_公民與社會_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 《刑事訴訟法》第 205-2 條規定：「檢察事務官、司法警察官或司法警察因調查犯罪情形及蒐集證據之必要，對於經拘提或逮捕到案之犯罪嫌疑人或被告，得違反犯罪嫌疑人或被告之意思，……有相當理由認為採取……尿液……得作為犯罪之證據時，並得採取之。」2022 年憲法法庭判決認為，司法警察（官）得以非侵入性方式採取尿液，但不分情況是否急迫，事前既未經該管檢察官許可，事後亦無任何陳報該管檢察官之監督查核程序，且對受採尿者亦無提供任何權利救濟機制，不符《憲法》之要求，牴觸《憲法》保障資訊隱私權及免於身心受傷害之身體權之意旨，應自判決公告之日起至遲於屆滿 2 年時失其效力。請問此判決中，大法官主要認為該法條不符國家公權力行使應遵守的何項原則？
  options:
  - label: A
    content: 平等原則
  - label: B
    content: 明確性原則
  - label: C
    content: 法律保留原則
  - label: D
    content: 正當法律程序原則
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
