  stem: 我國自 2009 年起以制定施行法的方式，陸續將重要國際人權公約國內法化，並依公約內涵檢視修正相關法規及措施。關於我國落實國際人權公約的情形，下列敘述何者有「誤」？
  options:
  - label: A
    content: 《民法》修正男女最低結婚年齡皆為 18 歲，以符合《消除對婦女一切形式歧視公約》
  - label: B
    content: 修正《提審法》，無論是否因犯罪嫌疑被逮捕、拘禁均得聲請法院提審，以符合《公民與政治權利國際公約》
  - label: C
    content: 修正《兒童及少年性剝削防制條例》，防制兒少遭受任何形式的性剝削，以符合《兒童權利公約》
  - label: D
    content: 修正《人工生殖法》，開放適用單身女性、女同志配偶及代理孕母，以符合《消除對婦女一切形式歧視公約》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 我國現行《人工生殖法》適用對象仍限於異性婚姻之不孕夫妻，尚未修法開放單身女性、女同志配偶及代理孕母適用，故(D)敘述有誤。(A)(B)(C)均為我國已實際完成國內法化之修法成果。答案選(D)。
