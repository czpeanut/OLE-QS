  type: single
  page: 2
  stem: 為讓運動能輕鬆的進入人們生活當中，成為每天的例行事項。歐洲羅馬尼亞的第二大城市克盧日納波卡（Cluj Napoca）舉辦運動嘉年華，市民只要在特別設計的巴士票務機前於時間限制內做 20 下深蹲，就能獲得「健康車票」（health ticket），7 天內可免費乘坐任何一條巴士路線，吸引不少民眾共襄盛舉。請問此政策使用的方式與下列何項誘因政策最相近？
  options:
  - label: A
    content: 為提升合作的風氣，公開頒發感謝義警義消的付出
  - label: B
    content: 臺電節電獎勵，用戶達成標準可獲得獎勵金
  - label: C
    content: 財政部上網公告欠稅大戶的姓名、欠稅項目與金額
  - label: D
    content: 《菸害防制法》規定購買菸品需繳納菸品健康捐
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹為正向的金錢誘因。(A)為正向的非金錢誘因。(B)為正向的金錢誘因，與題幹內涵相同。(C)為負向的非金錢誘因。(D)為負向的金錢誘因。
