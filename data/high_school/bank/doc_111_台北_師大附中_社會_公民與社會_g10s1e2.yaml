- id: doc_111_台北_師大附中_社會_公民與社會_g10s1e2_s2_39
  section: 2
  number: 39
  type: single
  page: 8
  stem: 有學者認為英國選舉制度有利於大黨，因為選區只有一個當選者，因此民調第三名的政黨支持者通常就會改投給前兩大黨中比較不討厭的那一個。這對全國性的小黨非常不利，但「少數民族聚集的地區性政黨除外」，因為他們可以集中選票在該地區拿下席次，蘇格蘭民族黨就是這種少數地區性政黨，它只在蘇格蘭推出候選人，以全英來看卻只算小黨，請從資料判斷，蘇格蘭民族黨是表一中的哪一個政黨？
  options:
  - label: A
    content: 甲黨
  - label: B
    content: 乙黨
  - label: C
    content: 丙黨
  - label: D
    content: 丁黨
  group_stem: '民主時代的篇章開啟後，選舉權普及到所有的成年人。此時民主國家面臨的是選民進到投票所，選票上印的應是候選人還是政黨呢？行政首長的選舉（例如：郡長或市長這些職位）自然是以候選人為主角沒有問題，但監督行政部門的國會議員該如何選擇，歐洲大體上有兩種處理方式，一種是將全國分成許多小選區，每個選區選出一個議員，得票最高的那一個人當選。表一就是英國下議院的選舉與席次比例的對比：


    | 政黨 | 得票率（%） | 席次率（%） |

    | --- | --- | --- |

    | 甲黨 | 43.6% | 56.2% |

    | 乙黨 | 32.1% | 31.1% |

    | 丙黨 | 3.9% | 7.4% |

    | 丁黨 | 11.5% | 1.7% |


    但民主政治也是政黨政治，理念相同的候選人得聯合起來才可能在國會表決中獲勝。從政黨角度來看，英國的選舉制度讓各政黨的選票與席次不等比例，而且不是所有人都適合站在選舉臺上揮灑、回應民意。因此歐洲許多國家的選舉改為政黨在選舉前公布自己的候選人名單，選民投票選的是政黨，然後政黨就可以把得到的選票轉換為等比例的國會席次。表二的比利時就是典型的歐洲選舉方式。'
