  stem: 2022 年南韓總統大選，在野黨國民力量候選人尹錫悅當選南韓總統，得票率和執政黨候選人李在明相差不到一個百分點。為前總統朴槿惠因閨密案下臺後，時隔五年終於奪回政權。此次大選最終仍是兩黨兩強對決局面，第三大黨的支持率仍無法與兩大黨抗衡。根據上述內容，請問何者可能為南韓的選制特色？
  options:
  - label: A
    content: 多元的政見且有利於小黨
  - label: B
    content: 具有正當性且過半的民意
  - label: C
    content: 支持小黨選民轉投給大黨
  - label: D
    content: 吸引支持極端政見的選民
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 總統只能當選 1 人，為單一選區制，因此容易出現「棄保效應」，也就是選民在得知自己所支持的候選人當選無望時，有可能會把票投給其他比較可能當選的人，以免浪費了自己的一票。故選(C)。(A)(D)單一選區有利於大黨，此種制度下政見會偏中間，討好中間選民。(B)沒有選票一定要過半的規定。
