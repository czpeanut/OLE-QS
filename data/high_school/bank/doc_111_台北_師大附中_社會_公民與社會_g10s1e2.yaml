  stem: 英國前首相特拉斯（Liz Truss）來自國會過半席次的保守黨，其上任僅 45 天，成為英國史上最短命的首相，因當時政策推行不當，故自行請辭下臺，而後由蘇納克（Rishi Sunak）接任英國首相，這也是英國歷年來首位印度裔首相。試問此次英國產生新任首相的方式為下列何者？
  options:
  - label: A
    content: 由保守黨重新推派黨魁擔任
  - label: B
    content: 由所有國會議員選出首相
  - label: C
    content: 兩個以上政黨組閣推派首相
  - label: D
    content: 人民重選議員再推選首相
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 英國為內閣制，首相由多數黨黨魁擔任，故特拉斯請辭下臺，應由多數黨保守黨選出新的黨魁來接任首相，故選(A)。
