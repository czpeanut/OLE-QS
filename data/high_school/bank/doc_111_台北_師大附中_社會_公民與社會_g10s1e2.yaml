  - label: B
    content: 委外化
  - label: C
    content: 法人化
  - label: D
    content: 管制鬆綁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述意指政府將業務委託民間辦理，故選(B)委外化。(A)地方化是中央將權力下放給地方。(C)法人化是成立獨立的法人機關來管理專業的事務。(D)管制鬆綁是指政府逐步減少管制。
