  group_stem: '民主時代的篇章開啟後，選舉權普及到所有的成年人。此時民主國家面臨的是選民進到投票所，選票上印的應是候選人還是政黨呢？行政首長的選舉（例如：郡長或市長這些職位）自然是以候選人為主角沒有問題，但監督行政部門的國會議員該如何選擇，歐洲大體上有兩種處理方式，一種是將全國分成許多小選區，每個選區選出一個議員，得票最高的那一個人當選。表一就是英國下議院的選舉與席次比例的對比。

