- id: doc_111_台北_師大附中_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 民主治理中的「治理」與「統治」最大的差別為何？
  options:
  - label: A
    content: 治理認為政府是制定執行政策的唯一要角
  - label: B
    content: 治理有一個重要的核心概念即是公私協力
  - label: C
    content: 統治主張採用總統制，治理則採用內閣制
  - label: D
    content: 統治重視市場機制並且建立公民參與管道
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '「民主治理」希望用「治理」取代「統治」，認為政府不該是制定政策的唯一要角，應透過提高人民參與公共事務的程度來改善政府效能，讓人民與政府一起解決公共問題。故選(B)。(A)治理強調人民參與。(C)總統制或內閣制可以是統治，也可以是治理。(D)治理重視市場機制並且建立公民參與管道。

    6.10＋50 × 10 ％＝15（席），故選(B)。

    7.若執政黨（民主黨）在此次期中選舉失利，則國會將會由共和黨主導，可能會造成行政和立法間的僵局，此即為分裂政府，故選(D)。(A)(B)總統不可以解散國會。(C)總統不向國會負責，而向選民負責。

    8.比例代表制，可透過政黨得票率反映席次，其政黨的得票率等於席次率；單一選區相對多數制，因為一選區只能當選一人，造成小黨不易集中選票而難以當選，故政黨的得票率與席次率最容易產生「比例性偏差」的問題。故選(A)。

    9.(A)美國總統不得解散國會。(B)(C)美國是總統制，總統與國會分權，拜登無法建議裴洛西不要抵臺，故選(C)。(D)臺灣雖在國際上的主權地位遭打壓，但不能靠選邊站立足。

    10.日本是內閣制，內閣由國會多數黨組閣，故國會席次分配影響國家整體政治生態以及走向，故選(A)。(B)日本首相屬於最高行政首長。(C)參議院具有實權。(D)內閣制不一定要聯合內閣。

    11.單一選區相對多數決制因為只有一個人會當選，容易出現小黨支持者，因為擔心自己的選票形同廢票，而趨向將票投給較可能當選的大黨候選人，有利於大黨，故選(D)。(A)(C)比例代表制、複數選區相對多數決制有利小黨。(B)單一選區兩票制聯立制有利小黨，並立制有利大黨。

    12.由於四案的全國性公投，本身即具高度社會爭議、朝野政黨亦未能有所共識，因此可以透過公投來化解重大政策僵局，故選(C)。(A)避免立法機關怠惰雖是優點，但與題文不符。(B)公投只能投支持或反對，無法提高公投決策品質。(D)簡化人民分歧的意見並非公投的作用。

    13.(A)行政院院長由總統直接任命。(B)行政院認為立法院通過的法案窒礙難行，須經總統核可後，才能提起覆議。(D)我國立法委員不可兼任行政部會首長。

    14.政府利用網路傳輸政府資訊及服務給公民，這是政府資訊公開的表現，故選(A)。

    15.附圖為政黨票與區域立委選票，雖然我國採並立制計算，但無法從選票設計看出，故選(B)。(A)原住民身分選民應領取原住民立委選票，而非區域立委選票。(C)在政黨選票上，選民可以投一個政黨。(D)由於民眾支持度不同，各政黨須提出不分區候選人名單，人選名額只要小於 34 即可。

    16.「國民參與審判」讓來自不同社會階層、出身背景，擁有不同生活經歷的國民參審，符合(B)參與成員的代表性。(A)這是司法審判的公開。(C)題文中未提及回應民眾需求。(D)未提及司法審判的強制性。

    17.附圖顯示為傑利蠑螈現象，會發生在單一選區的選舉制度下，執政黨利用選區重劃時，圖利自己的政黨。而由改選後乙黨獲利的結果判斷，選前的執政黨是乙黨，故選(B)。

    18.由於地方民意代表是複數選區相對多數制，因此當選區當選人數減少時，各政黨提名會更加小心，避免提太多候選人，造成選票分散而落選；但此時，又會造成各候選人在黨提名時競爭激烈的情況，故選(D)。(A)各政黨會減少提名候選人。(B)黨內有知名度的政治人才，全數轉戰中央選舉，會造成中央選舉參選爆炸。(C)選票不可移轉，候選人在黨內的競爭更激烈。

    19.(B)不分區立委共 34 席，34 × 29.7 ％＝10，因此若以支持度推算，安全名單應為 10 人。

    20.(A)(C)以紅黨為例，得票率為 36.9 ％，但席次率卻有 50.9 ％，這種得票率與席次偏差的情形，顯示民意未獲有效反映，其原因係採取單一選區制，所以有利大黨，容易形成兩黨制，故選(C)。(B)以藍黨為例，得票率雖不高，若能在區域代表中取得席次，亦可在國會取得席次。(D)主張獨立的激進政黨，不易在國會取得席次。

    21.行政法人是國家與地方自治團體以外，政府為執行特定公共事務，依法律所設立的公法人，在人事及財務上有自主性，故選(D)。(A)為去任務化。(B)為委外化。(C)為地方化。

    22.我國的單一選區兩票制，採並立制，計算上利於大黨，故選(A)。(B)選制改變不一定可以提高選民的參與。(C)小黨不希望棄保效應。(D)大黨為了席次最大化，不會採取聯合競選的策略。

    23.總統由人民選出，必須向人民負責；行政院長由總統任命，向國會負責，故(C)正確。(A)行政院院長的去留取決總統的意志，與總統制相似。(B)行政院院長有責無權，而總統有權無責，與內閣制和總統制都不像。(D)總統制下，總統任命行政官員，須國會同意。

    24.土耳其修憲，將內閣制改為總統制，顯示總統將不再只有象徵作用，而是掌握政治權力的實權元首，故選(C)。(A)反對者的批評重點是總統擴權。(B)支持者的論點建立在總統制也是民主體制。(D)總統制不一定優於內閣制。

    25.公私協力托嬰中心目的在透過公私協力合作，讓服務貼切人民需求，且減輕政府壓力，故選(B)。(A)做法符合民主治理概念，由第二、三部門共同分擔公共服務。(C)此作為不僅能讓政府達成政策目標，也落實效能政府的運作。(D)縣政府與協會合作，政府主要負責預算，協會負責執行。

    26.比較兩個年度的變化，女性候選人數、女性當選席次、法定保障名額的比率皆有增加，而保障名額當選的席次比率反而降低，表示該國女性並非多以保障名額才當選，故選(D)。(A)(C)女性保障名額當選者只增加 1 人（32－31），故當選席次成長並非在於女性保障名額，應增加女性投入選舉的意願，才可證明積極平權措施的效益。(B)保障名額當選的席次反而降低，兩者不具正向相關。

    27.複數選區相對多數制下，候選人只要擠進應選名額內即可當選，故同黨自行參選劇烈競爭，為避免同黨自相殘殺，因此會出現政黨配票的操作，這種現象會出現在地方民代的選舉，故選(A)。

    28.行政院院長至立法院接受立法委員質詢，為議會代表民意進行監督，故選(D)。(A)總統不接受立法院質詢。(B)此乃立法權制衡行政權的表現。(C)行政院長由總統直接任命，無法藉由定期選舉，撤換行政院院長。

    29.(A)總統制透過賦予總統覆議權，是行政制衡國會的表現。(B)我國總統只能被動解散國會。(C)我國是以賦予行政院長覆議權，來解決行政院與立法院之間的衝突。

    30.保證金制度對經濟弱勢的政黨相對不公平，無疑是對小黨或無黨籍參政增加了障礙，讓小黨不易取得執政機會，故(B)正確。(C)參政是人民的權利，制度上應鼓勵民眾參政。

    31.法律修正案經立法院三讀通過後，還要行政院長與相關部會首長副署後交由總統公布，故選(D)。(A)立法委員無權對總統提出不信任案。(B)總統無權向立法院提出法律修正案。(C)立委不得兼任法務部部長。

    32.「甲」是指覆議。美國總統對於國會通過的法案不贊同時，可在法案送達的十天內，將該案退回國會，要求「覆議」。但國會參眾兩院若以 2∕3 以上多數決通過原決議時，則總統必須接受該法案，故(A)正確。(D)無法由一次的投票結果推斷當時應屬一致政府或分裂政府狀態。

    33.(A)議員不可提案罷免行政首長。(B)市長任期要超過 1 年，人民才能提案來罷免市長。(C)(D)罷免通過須有效同意票大於不同意票，且有效同意票達原選舉區選舉人總數 1∕4 以上，230 萬 × 1∕4＝57.5 萬，(D)為正解。

    34.當行政院認為立法院通過的法律案、預算案、條約案窒礙難行時，得經總統之核可，於該決議案送達行政院十日內，移請立法院覆議。覆議時，如經全體立法委員 1∕2 以上維持原決議，則行政院應即接受該決議。因此，若執政黨的立委過半，就會成為覆議成功與否的關鍵，故選(D)。

    35.美國總統不同意國會通過的法律，則可行使「覆議權」加以否決，故選(B)。(A)美國總統不可自行向國會提案，且軍售案要經由國會同意。(C)美國沒有副署制度。(D)美國沒有不信任案設計和解散國會制度。

