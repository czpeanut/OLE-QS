  stem: '比例代表制又稱「政黨名單比例代表制」，我國在不分區及僑居國外國民立委中採行此制度，另外規定婦女保障名額。附表為某政黨提出的推薦名單，假設該黨應分配席次為 5 席，請問該國不分區立委當選名單，應為下列何者最為正確？

    | 編號 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 候選人 | 甲 | 乙 | 丙 | 丁 | 戊 | 己 | 庚 |

    | 性別 | 男 | 女 | 男 | 男 | 女 | 男 | 女 |'
  options:
  - label: A
    content: 乙丙丁戊庚
  - label: B
    content: 乙丙戊己庚
  - label: C
    content: 甲乙丙戊己
  - label: D
    content: 甲乙丙戊庚
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 該黨應分配席次為 5 席，在婦女保障名額規定下，因前 5 位中，有 3 位男性，故由第 7 位的庚女取代第 4 位丁男，因此當選人為甲乙丙戊庚，答案選(D)。
