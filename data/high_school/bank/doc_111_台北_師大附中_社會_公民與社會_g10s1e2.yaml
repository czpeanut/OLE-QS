  explanation: (A)依我國《憲法增修條文》，立法委員採單一選區兩票制，選民一次將有兩張選票，一票投候選人，一票投政黨。(B)我國在兩票的計算採並立制，有利大黨。(C)(E)並立制有利大黨，故易形成兩黨制。(D)區域立委採單一選區制，小黨因選票分散不易當選，故有利於大黨。
