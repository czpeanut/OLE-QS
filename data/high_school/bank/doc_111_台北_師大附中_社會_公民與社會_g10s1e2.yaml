  stem: '附中國的國會議員共有 200 席，區域代表 120 席，比例代表 80 席。若該國採行與我國立委選舉相同之並立制，現有 4 個政黨，其政黨票得票率及區域代表當選席次分別如下表所示。請問此國會議員選舉制度可能帶來下列哪些影響？

