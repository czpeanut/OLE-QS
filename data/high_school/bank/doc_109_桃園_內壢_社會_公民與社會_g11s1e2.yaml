  stem: 2020年，《溫室氣體減量及管理法》實施邁入第5年，但減碳成效不彰。根據政府資料，製造部門排放的溫室氣體占我國總量的一半以上，住商部門也占20％，能源部門則占12％，但這三大來源卻幾乎沒有減碳。環保署長接受立委質詢時承諾，年底會提出修法草案，藉由開徵碳費、提供減碳補助等手段，引導企業減碳；同時也會強化行政管制及效率、擴大公民參與等。環保署表示，碳費預計專款專用，把收到的錢用於投資碳設備、鼓勵乾淨能源等，以達到減碳目標。至於收費標準，雖然德國的碳定價機制在2021年針對每公噸碳收取25歐元（約新臺幣840元），加拿大則對每公噸碳排放課徵約20加幣（約新臺幣420元）的碳稅，但考量鄰近的亞洲國家費率較低，例如新加坡每公噸只收5新元（約臺幣100元），我國碳費傾向朝這個方向訂定。此外，由於財政部另有課徵碳稅來減碳的規劃，環保署也會進行協調，以免重複收費。除了碳費、碳稅之外，專家學者也提出了其他多種不同減碳的政策建議，請問哪個建議是希望「藉由消費者的購物選擇」來促成減碳？
