  stem: 某條河流上游有一間造紙廠，下游有一個魚類養殖場。造紙廠生產時會排放廢水，污染河流並影響養殖場魚類之存活率，而且污染程度愈高，魚類之存活率愈低。下列的相關敘述，何者正確？
  options:
  - label: A
    content: 若政府可出售污染排放權並允許廠商轉售，可改善此種外部成本之問題
  - label: B
    content: 若外部成本之問題未獲解決，則造紙廠產品之價格將會比獲得解決時的價格高
  - label: C
    content: 政府針對造紙廠排放的廢水課徵古皮稅，可降低造紙廠的願售價格，減少供給
  - label: D
    content: 若增加更多的造紙廠，可增加廠商之間的競爭性並進一步解決該廠之外部成本
  tags:
