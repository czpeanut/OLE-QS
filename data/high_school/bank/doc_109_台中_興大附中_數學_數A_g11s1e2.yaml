- id: doc_109_台中_興大附中_數學_數A_g11s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 已知$a = 10^{1-\frac{\sqrt{2}}{2}}$，$b = a^{\sqrt{2}}$，則下列哪些選項正確？
  options:
  - label: A
    content: a＞1
  - label: B
    content: $a < \sqrt{3}$
  - label: C
    content: $a^{2} < b^{\sqrt{3}}$
  - label: D
    content: $( ab ) ^{\sqrt{2}} < 10$
  - label: E
    content: $10^{0.4}$＜b＜$10^{0.5}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵$10^{1-\frac{\sqrt{2}}{2}}> 10^{0} = 1$ ∴a＞1

    (B)╳：∵$a = 10^{1-\frac{\sqrt{2}}{2}}\approx10^{1－0.707}$＝$10^{0.293}$＞$10^{0.4771\times \frac{1}{2}}\approx10^{\log \sqrt{3}}$＝$\sqrt{3}$

    ∴a＞$\sqrt{3}$

    (C)○：∵a＞1 ∴$b^{\sqrt{3}} = ( a^{\sqrt{2}} ) ^{\sqrt{3}} = a^{\sqrt{6}} > a^{2}$

    (D)╳：∵ab＝$( 10^{1-\frac{\sqrt{2}}{2}} ) ( 10^{1-\frac{\sqrt{2}}{2}} ) ^{\sqrt{2}}$＝$10^{1-\frac{\sqrt{2}}{2}+\sqrt{2}-1} = 10^{\frac{\sqrt{2}}{2}}$

    ∴$( ab ) ^{\sqrt{2}} = ( 10^{\frac{\sqrt{2}}{2}} )^{\sqrt{2}}$＝10

    (E)○：∵b＝$( 10^{1-\frac{\sqrt{2}}{2}} ) ^{\sqrt{2}} = 10^{\sqrt{2}-1}\approx10^{0.414}$ ∴$10^{0.4}$＜b＜$10^{0.5}$

    故選(A)(C)(E)'
