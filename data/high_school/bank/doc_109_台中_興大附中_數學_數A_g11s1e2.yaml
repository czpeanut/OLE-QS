  answer_source: answer_key
  explanation: '（a，b）在 y＝$log_{2}$x 上，即 b＝$log_{2}$a$\Rightarrow$a＝$2^{b}$

    (A)╳：反例：（a，b）＝（8，3）在 y＝$log_{2}$x 的圖形上，

