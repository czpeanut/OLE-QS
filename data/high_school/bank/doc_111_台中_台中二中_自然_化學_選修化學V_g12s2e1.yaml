  - label: D
    content: 電石氣為不飽和烴
  - label: E
    content: 電石氣與空氣或氧混合時具有爆炸性
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為乙炔；(B)為碳化鈣；(C)乙炔難溶於水。故選(D)(E)。
