  explanation: 烯類與HCl加成反應可生成鹵烷，須注意馬可尼可夫法則，H會加成在末端的碳上，形成2-甲基-2-氯丙烯。接著於醇中發生脫去反應可得到烯類─2-甲基丙烯。故選(A)。
