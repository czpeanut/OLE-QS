- id: doc_111_台中_台中二中_自然_化學_選修化學V_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列何者與環己烷互為同分異構物？
  options:
  - label: A
    content: 2,3-二甲基-2-丁烯
  - label: B
    content: 甲基環丁烷
  - label: C
    content: 正己烷
  - label: D
    content: 4-甲基-1,3-戊二烯
  - label: E
    content: 3-甲基-1-戊炔
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 環己烷之分子式為$C_{6}H_{12}$，相對於飽和鏈狀烴類少了2個氫原子。(A)共6個碳（甲基、甲基、丁烯），因為烯類故少2個氫，分子式為$C_{6}H_{12}$；(B)共5個碳（甲基、環丁烷）；(C)共6個碳，但為飽和鏈狀烴，分子式為$C_{6}H_{14}$；(D)共6個碳（甲基、戊二烯），但因為二烯類，相對於飽和鏈狀烴少了4個氫原子，故分子式為$C_{6}H_{10}$；(E)共6個碳（甲基、戊炔），但因為炔類，相對於飽和鏈狀烴少了4個氫原子，故分子式為$C_{6}H_{10}$。故選(A)。
