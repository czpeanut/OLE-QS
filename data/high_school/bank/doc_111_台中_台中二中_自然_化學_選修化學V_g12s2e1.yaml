  stem: 某芳香烴的分子量為106，元素分析結果得知含碳90.6％、氫9.4％，則其共有幾種異構物？
  options:
  - label: A
    content: '6'
  - label: B
    content: '5'
  - label: C
    content: '4'
  - label: D
    content: '3'
  - label: E
    content: '2'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 碳、氫原子的莫耳數比＝$\frac{90.6}{12}$：$\frac{9.4}{1}$＝4：5，又其分子量＝106，可得其分子式為$C_{8}H_{10}$。共有四種異構物：鄰-二甲苯、間-二甲苯、對-二甲苯、乙苯。故選(C)。
- id: doc_111_台中_台中二中_自然_化學_選修化學V_g12s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下列有關有機鹵化物的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 有機鹵化物的沸點較同碳數高
  - label: B
    content: 特夫綸為氯乙烯的聚合物，具有耐熱、耐腐蝕的特性，可用來做不沾鍋的塗膜
  - label: C
    content: 三氯甲烷俗稱為氯仿，曾作為麻醉劑
  - label: D
    content: 鹵烷的熔點大致隨碳數增加而增加
  - label: E
    content: DDT和BHC均為硬性殺蟲劑，故現已禁止使用
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因分子量較大，分散力較大，故沸點較高，正確；(B)為四氟乙烯的聚合物；(C)正確；(D)因分子量越大，分散力越大，故沸點較高，正確；(E)正確。故選(B)。
