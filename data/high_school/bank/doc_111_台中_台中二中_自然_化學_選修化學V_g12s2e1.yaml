  stem: 下列有關烴類的敘述，何者正確？
  options:
  - label: A
    content: 環己烷屬於不飽和烴
  - label: B
    content: $C_{4}H_{10}$、$C_{5}H_{12}$、$C_{7}H_{16}$必為同系物
  - label: C
    content: $C_{5}H_{10}$必為不飽和烴
  - label: D
    content: 環狀烴類不屬於脂肪烴
  - label: E
    content: 含碳碳雙鍵或參鍵者為芳香烴
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)環己烷不具有不飽和的雙鍵、參鍵，屬於飽和烴；(B)皆為烷類；(C)有可能為環烷；(D)只要不是芳香烴就都屬於脂肪烴；(E)芳香烴須包含苯環。故選(B)。
