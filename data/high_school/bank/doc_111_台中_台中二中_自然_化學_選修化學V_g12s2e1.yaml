- id: doc_111_台中_台中二中_自然_化學_選修化學V_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 將2.8克的某有機化合物完全燃燒以後，得到8.8克的二氧化碳及3.6克的水，則此有機化合物最可能為下列何種物質？
  options:
  - label: A
    content: $C_{3}H_{8}$
  - label: B
    content: $C_{6}H_{12}O_{6}$
  - label: C
    content: $C_{4}H_{8}$O
  - label: D
    content: $C_{4}H_{6}$
  - label: E
    content: $C_{5}H_{10}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 二氧化碳中的碳含量＝8.8×$\frac{12}{44}$＝2.4 g；水中的氫含量＝3.6×$\frac{2}{18}$＝0.4 g。故可知化合物中碳、氫原子的莫耳數比＝$\frac{2.4}{12}$：$\frac{0.4}{1}$＝1：2，且不含有氧原子，故選(E)。
