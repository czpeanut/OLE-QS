  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)碳數小於等於4者為氣體；(B) $C_{1}$～$C_{3}$的烷類熔點呈現不規則變化；(C)正確；(D)為低極性分子，難溶於水；(E)與鹵素發生取代反應。故選(C)。
