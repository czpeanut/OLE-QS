- id: doc_113_桃園_武陵_數學_數乙_g12s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 下列各選項中，何者的極限存在？（註：[ x ]為高斯符號）
  options:
  - label: A
    content: $\lim_{x\rightarrow 3} \frac{[ x - 3 ]}{x - 3}$
  - label: B
    content: $\lim_{x\rightarrow \pi} \frac{[ x - 3 ]}{x - 3}$
  - label: C
    content: $\lim_{x\rightarrow 1} \frac{|x - 1|}{x - 1}$
  - label: D
    content: $\lim_{x\rightarrow - 1} \frac{|x - 1|}{x - 1}$
  - label: E
    content: $\lim_{x\rightarrow 2} [\frac{2}{x}]$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)當x∈ [ 2 , 3 )時[ x－3 ]＝－1，當x∈[ 3 , 4 )時[ x－3 ]＝0 ∴$\frac{[ x - 3 ]}{x - 3}$→∞，當x→$3^{－}$，$\frac{[ x - 3 ]}{x - 3}$＝0，當x→$3^{＋}$ ∴$\lim_{x\rightarrow 3} \frac{[x-3]}{x-3}$不存在 (B) $\lim_{x\rightarrow \pi} \frac{[ x - 3 ]}{x - 3} = \frac{0}{\pi - 3} = 0$ (C) $\frac{|x - 1|}{x - 1} = \begin{cases}1 , x > 1 \\ -1 , x < 1\end{cases}$ ∴$\lim_{x\rightarrow 1} \frac{|x - 1|}{x - 1}$不存在 (D) $\lim_{x\rightarrow - 1} \frac{|x - 1|}{x - 1} = \frac{| - 1 - 1|}{- 1 - 1}=\frac{2}{- 2} =- 1$ (E) $\lim_{x\rightarrow 2^{-}} x [ \frac{x}{2} ]$＝2．1＝2，$\lim_{x\rightarrow 2^{+}} x [ \frac{x}{2} ]$＝2．0＝0 ∴$\lim_{x\rightarrow 2} x [ \frac{2}{x} ]$不存在 故選(B)(D)。
