- id: doc_113_桃園_武陵_數學_數乙_g12s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列各選項中，何者的極限存在？
  options:
  - label: A
    content: $\lim_{n\rightarrow \infty} ( - 1 )^{n}$
  - label: B
    content: $\lim_{n\rightarrow \infty} (n + ( \frac{- 1}{3} )^{n})$
  - label: C
    content: $\lim_{n\rightarrow \infty} ( \frac{\sqrt{8}}{\pi} )^{n}$
  - label: D
    content: $\sum_{n=1}^{\infty} ( \frac{100}{99} )^{n}$
  - label: E
    content: $\sum_{n=1}^{\infty} ( \frac{2^{n}-3^{n}}{5^{n}} )$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)〈(－1)$^{n}$〉：－1 , 1 , －1 , 1 , －1 , 1 , …為發散數列 ∴$\lim_{n\rightarrow \infty} ( - 1 )^{n}$不存在 (B)〈n〉為發散數列，$〈 ( \frac{- 1}{3} )^{n} 〉$為收斂數列，若$〈 n + (\frac{- 1}{3})^{n} 〉$收斂，則$n = ( n + ( \frac{- 1}{3} )^{n}) - ( \frac{- 1}{3} )^{n}$為發散，矛盾， 故$\lim_{n\rightarrow \infty} ( n + ( \frac{- 1}{3} )^{n} )$不存在 (C)∵$\sqrt{8}$＜3＜π ∴$\frac{\sqrt{8}}{\pi}$＜1 ∴$〈 ( \frac{\sqrt{8}}{\pi} )^{n} 〉$是公比介於(－1 , 1 )之間的等比數列 故$\lim_{n\rightarrow \infty} ( \frac{\sqrt{8}}{\pi} )^{n} = 0$ (D)$〈 ( \frac{100}{99} )^{n} 〉$是公比大於1的等比數列 ∴$\sum_{n=1}^{\infty} ( \frac{100}{99} )^{n}$不存在 (E) $\sum_{n=1}^{\infty} \frac{2^{n} - 3^{n}}{5^{n}}=\sum_{n=1}^{\infty} ( \frac{2}{5} )^{n} - \sum_{n=1}^{\infty} ( \frac{3}{5} )^{n} =\frac{\frac{2}{5}}{1 - \frac{2}{5}} - \frac{\frac{2}{5}}{1 - \frac{3}{5}} = \frac{2}{3} - \frac{3}{2} = - \frac{5}{6}$ 故選(C)(E)。
