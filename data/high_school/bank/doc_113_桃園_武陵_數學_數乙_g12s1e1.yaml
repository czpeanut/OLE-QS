- id: doc_113_桃園_武陵_數學_數乙_g12s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 已知函數f滿足$\lim_{x\rightarrow 1} \frac{f(x)}{x - 1}$＝6，下列哪些敘述正確？
  options:
  - label: A
    content: $\lim_{x\rightarrow 1} (\frac{f(x)}{x - 1} + \frac{x - 1}{x}) = 6$
  - label: B
    content: $\lim_{x\rightarrow 1} \frac{f(x)}{2(x - 1)} = 3$
  - label: C
    content: $\lim_{x\rightarrow 1} \frac{f(x)}{(x - 1)^{2}} = 6$
  - label: D
    content: $\lim_{x\rightarrow 1} f(x) = 0$
  - label: E
    content: $\lim_{x\rightarrow 1} (x\cdot f(x)) = f(1)$
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $\lim_{x\rightarrow 1} (\frac{f(x)}{x - 1} + \frac{x - 1}{x}) = \lim_{x\rightarrow 1} \frac{f(x)}{x - 1} + \lim_{x\rightarrow 1} \frac{x - 1}{x} = 6 + \frac{1 - 1}{1} = 6 + 0 = 6$ (B) $\lim_{x\rightarrow 1} \frac{f(x)}{2 ( x - 1 )} = \frac{1}{2}\lim_{x\rightarrow 1} \frac{f(x)}{x - 1} = \frac{1}{2}\times 6 = 3$ (C) 若$\lim_{x\rightarrow 1} \frac{f(x)}{( x - 1 )^{2}}$存在，設值為k，則$\lim_{x\rightarrow 1} \frac{f(x)}{x - 1} = \lim_{x\rightarrow 1} ( ( x - 1 )\cdot \frac{f(x)}{(x - 1)^{2}}) = \lim_{x\rightarrow 1} ( x - 1 )\cdot \lim_{x\rightarrow 1} \frac{f(x)}{(x - 1)^{2}} = 0\cdot k = 0$矛盾， 故$\lim_{x\rightarrow 1} \frac{f(x)}{( x - 1 )^{2}}$不存在。 (D) $\lim_{x\rightarrow 1} f(x) = \lim_{x\rightarrow 1} ( ( x - 1 )\cdot \frac{f(x)}{x - 1}) = \lim_{x\rightarrow 1} ( x - 1 )\cdot \lim_{x\rightarrow 1} \frac{f(x)}{x - 1} = 0\cdot 6 = 0$。 (E) 若f (x)在x＝1不連續，則f ( 1 )≠$\lim_{x\rightarrow 1} f(x)$＝0，則$\lim_{x\rightarrow 1} ( xf(x) ) = \lim_{x\rightarrow 1} x\cdot \lim_{x\rightarrow 1} f(x) = 1\cdot 0$≠f( 1 )。 故選(A)(B)(D)。
