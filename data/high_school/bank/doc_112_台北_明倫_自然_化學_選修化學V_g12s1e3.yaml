  - label: C
    content: 步驟1為氧化反應
  - label: D
    content: 步驟3為還原反應
  - label: E
    content: 鉑電極為正極
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (B)電池中的負極稱為陽極；(C)步驟1尚未失去電子，不為氧化反應；(D)步驟3得到電子，為還原反應；(E)由步驟3可得知鉑電極發生還原反應，為陰極、正極。故選(A)(D)(E)。
