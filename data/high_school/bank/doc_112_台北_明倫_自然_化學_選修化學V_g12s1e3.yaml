  stem: 將含有(甲) $CuSO_{4}$；(乙) $AgNO_{3}$及(丙) $NiSO_{4}$的水溶液，分別以鉑電極通相同強度的電流電解，使在陰極析出向重量金屬時，所需時間之長短順序，下列何者正確？（原子量：Ni＝58.7，Cu＝63.5，Ag＝108）
