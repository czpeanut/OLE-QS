  stem: 染料敏化太陽能電池是成本低、易製備的新一代太陽能電池。電池的組成有三大部分：(1)電極（A／$TiO_{2}$）：由二氧化鈦粒子吸附了染料A所構成、(2)電解質溶液（$1_{3}^{－}$／$I^{－}$）、(3)鉑電極。染料敏化太陽能電池發生的反應如下： 步驟1：A／$TiO_{2}$＋太陽光 → A*／$TiO_{2}$ （形成激發態的電極） 步驟2：A*／$TiO_{2}$ → $A^{＋}$／$TiO_{2}$＋$e^{－}$ （電極進行電荷分離） 步驟3：$I_{3}^{－}$＋$2e^{－}$ → $3I^{－}$ （電解質在鉑電極表面反應） 步驟4：2（$A^{＋}$／$TiO_{2}$）＋$3I^{－}$ → 2（A／$TiO_{2}$）＋$I_{3}^{－}$ 下列有關染料敏化太陽能電池的敘述，哪些正確？
  options:
