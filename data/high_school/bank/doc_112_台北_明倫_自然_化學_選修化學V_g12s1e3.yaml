    content: 甲＞乙＞丙
  - label: C
    content: 乙＞丙＞甲
  - label: D
    content: 丙＞甲＞乙
  - label: E
    content: 乙＞甲＞丙
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 1 g金屬莫耳數：(甲) $\frac{1}{63.5}$、(乙) $\frac{1}{108}$、(丙) $\frac{1}{58.7}$，析出每莫耳金屬所需要通電量：(甲) 2 mol、(乙) 1 mol、(丙) 2 mol。故析出1 g金屬所需通電量＝$\frac{2}{63.5}$：$\frac{1}{108}$：$\frac{2}{58.7}$，丙＞甲＞乙。故選(D)。
