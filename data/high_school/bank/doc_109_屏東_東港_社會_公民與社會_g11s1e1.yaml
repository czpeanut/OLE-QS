- id: doc_109_屏東_東港_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某資深水電師傅告訴新進人員，向客戶議價時，要強調自己使用的零件、管線有多好，所以值得那個價錢；他說，客人通常願意為了看得到的東西花錢，卻不太願意為了水電師傅的「工」付費，但其實東西的耐用程度與施工技巧及用心更有關聯。請問從經濟學的角度來看，下列相關敘述何者正確？
  options:
  - label: A
    content: 水電師傅維修管線的行為並不屬於產品
  - label: B
    content: 零件、管線比水電師傅的技術更有價值
  - label: C
    content: 零件、管線是財貨，裝配行為則是服務
  - label: D
    content: 水電師傅的施工服務無法透過產品市場交易
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 新聞報導，桃園市某張姓婦人眼見自家附近一棟房子長期無人居住，遂於2019年6月進入屋內，並自費28萬元整修、裝潢後入住。李姓屋主在2020年4月偶然聽到鄰居稱讚他家的裝潢，才發現這件事情；張婦則表示自己以為是無主之屋，才會住進去。請問該事件的後續發展最可能是下列何者？
  options:
  - label: A
    content: 李姓屋主可根據所有權的排他性，行使返還請求權，要求取回房屋
  - label: B
    content: 張姓婦人已取得房屋，可依所有權的優先性主張其擁有房屋所有權
  - label: C
    content: 張姓婦人可以行使防止妨害請求權，避免李姓屋主移除其自費裝潢
  - label: D
    content: 李姓屋主為房屋債權人，可向無權佔有房屋的張姓婦人主張其債權
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 因應新冠肺炎疫情許多公司行號超前布署，添購遠距上班會議視訊設備，以因應停班的可能性。請問對於這些公司而言，添購遠距會議視訊設備在市場經濟活動流程圖中是屬於哪一項？
  options:
  - label: A
    content: 生產要素供給
  - label: B
    content: 產品供給
  - label: C
    content: 產品需求
  - label: D
    content: 生產要素需求
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 小玉為大學四年級學生，到賣場購買智慧型手機，從眾多不同型號挑選了一款，經過殺價以5千元便宜購得。店員要求小玉在一份內容為「凡在本店購買手機的消費者，3天後不得請求退換貨」的印刷書面下簽名。下列敘述何者正確？
  options:
  - label: A
    content: 購買手機並非學生日常生活所需的行為，小玉購買手機前須得父母之同意
  - label: B
    content: 小玉與店家間的手機買賣契約，一定要以書面為之，契約才算是合法有效
  - label: C
    content: 小玉可選擇購買手機的款式，並以較便宜的價格購買，是私法自治的表現
  - label: D
    content: 店員要求小玉在書面簽名，無論簽與否，此書面皆未限制小玉的契約自由
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 目前合歡山上曾發生因公有停車場的車位不足，有人並併排停菌後即前往登山，導致守規矩停在停車格內的車主無法務車，只能搭計程車下山，並在日後再回來領車。對此蔚萊及同學分別提出以下見解，請問誰的說法較符合我國民法之規範？蔚萊：停車場講求先來後到，依優先性先停車的人可以依優先性取得停車格的所有權。小銘：任意停車造成車主無法正常使用自己的車，依法可以請求除去妨害。亞均：車主搭計程車下山，受有損失，可依所有權返還請求權請求返還金錢。米米：停車場是公有的，私人沒有所有權，因單位不足而並排停車並沒有問題。
  options:
  - label: A
    content: 蔚萊
  - label: B
    content: 小銘
  - label: C
    content: 亞均
  - label: D
    content: 米米
