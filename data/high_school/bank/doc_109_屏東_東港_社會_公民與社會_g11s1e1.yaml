  stem: 圖為經濟活動流程圖，圖中虛線代表產品或生產要素的流動，實線則代表金錢的流動。小米試著為甲、乙、丙、丁四個角落的流程各舉一例，請問哪個例子正確？
  options:
  - label: A
    content: 角落丙：哥哥到巷口的便利超商買飲料
  - label: B
    content: 角落乙：隔壁糕餅店製作芋泥蛋糕販售
  - label: C
    content: 角落甲：車行老闆買油雞便當作為晚餐
  - label: D
    content: 角落丁：老爸為自營的早餐店增聘人手
