  stem: 辛雅自己包1盤水餃給全家吃，需要花100元買材料，並耗時2小時。如果他這2小時不包水餃，可以去打工，他有3個工作機會可供挑選，時薪如表所示。請問市售水餃（份量同樣是1盤）的價格超過多少元時，辛雅會選擇自己包水餃，而低於這個價格時，辛雅又會選擇買水餃？
