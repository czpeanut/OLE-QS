  stem: 東協經濟成長迅速，是加拿大的前幾大貿易夥伴。2013年，加拿大外交部長前往拜訪，討論資助東協發展、建設的計畫，以及如何擴大、加強雙邊在政治、經貿、文化等各面向的關係。根據上蓮，下列何者正確？
