- id: doc_109_屏東_東港_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 契約自由雖可促進自由經濟的發展，但若過度強調，就可能影響社會秩序，所以民法對契約自由還是有一定的限制，並非無限上網。下列情形，何者可能被認定為無效契約？
  options:
  - label: A
    content: 早餐店為招攬生意，持學生證消費一律打八折
  - label: B
    content: 吉他老師為避免溝通困難，因此不收16歲以下的學生
  - label: C
    content: 賣棒球球員紀念卡時限定一次一定要買一組，不可單買
  - label: D
    content: 買貼身衣物時被告知不論理由一日售出就不接受退換貨
