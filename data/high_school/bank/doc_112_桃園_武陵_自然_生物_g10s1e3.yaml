- id: doc_112_桃園_武陵_自然_生物_g10s1e3_s3_47
  section: 3
  number: 47
  type: single
  page: 6
  stem: 帶有突變基因的人是否一定會發病？且此人將突變基因遺傳給予女的機率為多少？（單選）
  options:
  - label: A
    content: 一定會；l00％
  - label: B
    content: 不一定會；50％
  - label: C
    content: 一定會；50％
  - label: D
    content: 不一定會；25％
  group_stem: '杭丁頓氏症（Huntington'' s disease；HD）是一種顯性遺傳疾病，起因於正常的杭丁頓基因發生突變。帶有一對突變基因者出生便會死亡，因此患者都是異型合子，且通常在30～40幾歲的盛年發病，並於發病後的～20年去世。

    HD的症狀是由位於腦部紋狀體的神經元退化所造成。正常情況下，該處的神經元對掌管身體動作的大腦運動皮質所發出的興奮性訊號，具有抑制的作用，如果這些細胞死亡，運動皮質就會變得過度興奮，使患者產生不由自主的動作。

    正常人的杭丁頓基因中含有由CAG連續重復出現的一段核苷酸序列，重復次數在9～35次之間；HD患者的杭丁頓基因中的CAG重複次數會增加，通常為40～60次，某些案例甚至達250次之多。

    CAG這個遺傳密碼相對應的胺基酸是「麩醯胺酸」。正常的杭丁頓蛋白質對大腦的神經元有保護作用。至於突變的杭丁頓蛋白質，因具有一段過長的「多麩醯胺酸」區段，結果造成神經細胞的死亡，進而引起疾病。目前科學家提出兩種疾病假說，分別是「喪失功能假說」及「獲得功能假說」。喪失功能假說認為過長的多麩醯胺酸區段可能會讓杭丁頓蛋白質失去保護功能；獲得功能假設則認為突變後的杭丁頓蛋白質具有黏性，易與正常的杭丁頓蛋白質或其他蛋白質形成對腦細胞有毒性的聚合物。根據上文提供的知識內容，回答47～49題'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 為顯性遺傳，帶有突變基因的人會發病，傳給子女的機率父母雙方各佔50％。故選(C)。
