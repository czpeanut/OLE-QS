- id: doc_112_桃園_武陵_自然_生物_g10s1e3_s3_50
  section: 3
  number: 50
  type: multiple
  page: 7
  stem: 關於紅皇后假說，請選出正確的敘述？（多選）
  options:
  - label: A
    content: 僅出琨在獵物與狩獵者的演化關係中
  - label: B
    content: 是生物和環境互動產生的演化結果
  - label: C
    content: 可用來說明為何會有演化接近停滯的活化石出現
  - label: D
    content: 在此假說中，過度演化反而可能會遭到淘汰
  - label: E
    content: 可用來證閉用進廢退的理論
  group_stem: '紅皇后（Red Queen Hypothesis）假設一詞由Leigh Van Valen於1973年提出，是在演化生物學相當有名的假說，但用假說來稱呼其實不大適當，其較像是演化的一種模式。紅皇后一詞源自於愛莉絲夢遊仙境（Alice'' s adventures in wonderland）的姊妹作－鏡中奇緣：

    詭異的是，不論他們跑的多快，周遭的景物沒有改變，他們仍停留在原來的地方。最後終於停了下來，「為什麼我們跑了這麼久仍在同－個地方？」愛莉絲喘著氣，眉頭皺著露出疑惑的表情。皇后嘴角露出淺淺微笑然後說「在這個國度中，全力奔跑不過是為了維持在原地而已。

    自然界中，獵物與持獵者的互動產生一股將演化過程趨於複雜的力量；演化過程中，狩獵者會不斷提高發現和捕發獵物的效率，發展出更好的攻擊方式。因應強大的演化壓力，獵物也必須有更好的逃脫污式保護自己，使自己有機會生存。一方的演化成功會使另一方有較大機會被淘汰，為了維持存活的現狀，也必須發展出因應的策略。兩者微妙的關係必須保持平衡，過度發展的一方或是停止改變的一方有可能就在漫長的演化旅途中遭到淘汰的命運，由此衍生無止盡的演化軍備競賽。生物學家用紅皇后假說來闡明這個兩物種為了生存而互相施加生存壓力，影響對方演化進程的歷程。

    紅皇后假說不僅表現在獵物與狩獵者的關係上，之後更引用至有性生殖策略的推論，寄生蟲與宿主、甚至病毒與宿主都有此一演化模式的表現。根據上文提供的知識內容，回答50～51題'
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)也可引用至有性生殖策略的推論；(C)內文未說明；(E)無法證明。故選(B)(D)。
