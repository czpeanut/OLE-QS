  type: single
  page: 1
  stem: 有關DNA分子的敘述，何者正確？
  options:
  - label: A
    content: DNA複製時，只需要其中一股作為模版合成新的DNA分子
  - label: B
    content: 同一生物個體中，各種體細脃核內DNA的鹼基序列並不相同
  - label: C
    content: 若一股上的A：T：G：C＝1：2：3：4，則另一股上的A：T：G：C＝2：1：4：3
  - label: D
    content: 胰島β細胞能合成出胰島素，但卻無法產生血紅素，此乃因為β細胞有胰島素基因，但無血紅素基因
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)兩者皆為模版； (B)同一生物體，其鹼基序列皆相同； (D)有血紅素基因，只是基因沒有表現。故選(C)。
