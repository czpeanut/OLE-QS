  section: 1
  number: 6
  type: single
  page: 1
  stem: 細菌DNA分子複製時，培養基中若含有$^{15}$N的鹼基，則$^{15}$N會被合成入DNA中。一科學家將細菌在$^{15}$N的培養基中繁殖很多代後，再接種於含$^{14}$N的新培養基中培養。下列有關細菌的新培養基中進行細胞分裂的敘述，何者正確？
  options:
  - label: A
    content: 經過一次分裂後，1∕4的細菌具有$^{15}$N的DNA
  - label: B
    content: 經過一次分裂後，半數的細菌具有$^{15}$N的DNA
  - label: C
    content: 經過二次分裂後，半數的細菌鱽有$^{15}$N的DNA
  - label: D
    content: 二次分裂後，1∕4的細菌具有$^{15}$N的DNA
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 原本DNA含$N^{15}N^{15}$，經過二次半保留複製，則出現2條$N^{15}N^{14}$、2條$N^{14}N^{14}$。故選(C)。
