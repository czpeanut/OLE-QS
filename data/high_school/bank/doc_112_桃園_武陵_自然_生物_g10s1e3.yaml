- id: doc_112_桃園_武陵_自然_生物_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某動物其肌肉細胞內（A＋T）/（G＋C）之比值為1.26，則其卵細胞內（A＋T）/（G＋C）的比值為何？
  options:
  - label: A
    content: '0.063'
  - label: B
    content: '1.26'
  - label: C
    content: '2.52'
  - label: D
    content: 不能確定
  answer:
  - B
  answer_status: disputed
  answer_source: agent_fix
  explanation: 同一生物體的肌肉細胞（2n）與卵細胞（n）內部的DNA皆為雙股螺旋結構，均嚴格遵守A＝T、G＝C的鹼基互補配對原則，因此(A+T)/(G+C)的比值在配子與體細胞中完全相同，仍為1.26，故選(B)。
  tags:
    unit:
      code: BI-1-2-2
      book: 生物（全）
      chapter: 遺傳與生物科技
      title: 遺傳物質
      std: true
    textbook: 生物（全） 遺傳物質
    pattern:
      key: BI-1-2-2:T03
      name: 鹼基比例與氫鍵數目計算
    labeled_by: agent
    label_confidence: high
    label_note: 原題答案與解析有誤：卵細胞DNA仍為雙股，(A+T)/(G+C)比值應為1.26（解析誤當單股除以2得0.63，且選項A為0.063）。
    fixed_by: agent
    fix_note: （人工修正：更正錯誤答案為B與錯誤解析（卵細胞DNA仍為雙股））
  difficulty: 2
  review_note: 原答案卷答案 ['A']，執行 agent 修正為 ['B']
- id: doc_112_桃園_武陵_自然_生物_g10s1e3_s1_3
  section: 1
