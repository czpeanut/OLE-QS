  stem: 具放射產$^{3}$H的胸腺嘧啶，常被用來標定新合成的核酸。若將細胞培養在含$^{3}$H胸腺嘧啶的培養液中，下列何者不會被偵測到放射性？
  options:
  - label: A
    content: 核糖體
  - label: B
    content: 粒線體
  - label: C
    content: 染色體
  - label: D
    content: 葉綠體
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)核糖體由RNA及蛋白質組成，RNA不具有胸腺嘧啶。故選(A)。
