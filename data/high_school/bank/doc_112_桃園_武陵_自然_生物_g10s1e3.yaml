  stem: 列關於番茄裡PG酵素的敘述，何看正確？（單選）
  options:
  - label: A
    content: PG酵素的基因可以當作農桿茵的載體
  - label: B
    content: 番茄未成熟時，PG酵素可以合成乙烯
  - label: C
    content: 番茄成熟時，製造PG酵素的基因才會表現
  - label: D
    content: 運用DNA重組技術製造大量的PG酵素，可阻止番茄果實變鬆軟
  group_stem: 'FLAVRSAVR™番茄是第一個被美國食品藥物局（FDA）核准上市的基因改造食品。果農大多是在番茄尚未完全成熟時就採收，此時因為質地較堅硬，所以在運送過程中比較不會撞得稀爛，等送到了目的地再噴灑乙幣使番茄看起來較成熟。但由於乙希只造成視覺上的成熟，實際上番茄仍尚未成熟，所以吃起來風味仍不是很好。事實上，造成番茄果實鬆軟的是一種在番茄成熟時表現的PG酵素（polygluconase）水解細胞壁所造成，因此若能抑制PG酵素的活性，我們就可以得到成熟又不是太鬆軟的番茄。

    在生技公司的研究人員的努力下，利用農桿菌（Agrobacterium tumefacien）的Ti質體作為載體，透過農桿茵的感染，將一段DNA送入番茄的基因組中，此段外加的DNA可轉錄出與PG酵素mRNA互補的RNA。這種番茄與其後代在成熟時，由於外加的這段DNA產生的互補RNA會與原本PG基因轉錄的mRNA結合在一起，形成雙股的RNA，故PG酵素的基因便無法轉譯表現。透過這種所謂的反譯RNA技術（antisense RNA）便可產生口感佳又不怕撞爛的番茄了。根據上文提供的知識內容，回答45～46題'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)載體多為病毒或細菌質體； (B)成熟時才會表現； (D)PG酵素可造成番茄果實鬆軟。故選(C)。
