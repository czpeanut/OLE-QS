  type: single
  page: 4
  stem: '資料一：《原住民身分法》第 4 條之規定：1. 原住民與原住民結婚所生子女，取得原住民身分。2. 原住民與非原住民結婚所生子女，從具原住民身分之父或母之姓或原住民傳統名字者，取得原住民身分。

    資料二：吳小妹父親是漢人、母親是太魯閣族原住民，吳小妹出生後，約定從父姓「吳」，105 年她的父母向戶政事務所申請登記為太魯閣族原住民，因為沒有從原住民母親的姓，或使用原住民族傳統姓名，而遭到駁回。在經過窮盡救濟途徑後，聲請憲法解釋。

    資料三：憲法法庭《111 年憲判字第 4 號》：

    不論原原結婚所生子女或原與非原結婚所生子女，兩者均具有一定比例之原住民血統。後者最高為 50 ％，前者則可能高於、等於或低於 50 ％。又前者之原住民血緣比例再低（如原父原母各僅具 25 ％原住民血緣，子女亦僅具 25 ％血緣比例），仍當然取得原住民身分；反之，原與非原結婚所生子女之原住民血緣比例（如 100 ％原住民與 100 ％漢人結婚所生子女應有 50 ％原住民血緣），縱使高於前述原原結婚所生子女，亦不當然取得原住民身分，而須另外符合有關姓名取用之要求。

    此等差別待遇之立法，顯然是假設原原結婚所生子女，必然有足夠之原住民認同，因此不要求另外有認同之表現；而原與非原結婚所生子女則必然欠缺足夠之原住民文化認同，因而為差別之待遇。又如果認為原原結婚所生子女可以透過登記而取得原住民身分，且其登記即足以彰顯其認同，則原與非原結婚所生子女之相同登記，為何就當然不足以彰顯其認同，而須另加姓名之要求。大法官最終宣判《原住民身分法》第 4 條之規定違憲，其宣判違憲的理由應是該法規違反何種基本權的保障？'
