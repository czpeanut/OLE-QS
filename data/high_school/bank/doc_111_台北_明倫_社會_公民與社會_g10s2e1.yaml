  type: single
  page: 8
  stem: 某政府為維護公安，制定《推進都更危老重建條例》，其中某條規定：「凡建物屋齡超過 60 年，經主管機關與土木建築技師認定有危害公共安全之危險，則須進行強制都更重建。」甲世居祖傳百年老宅，強烈反對此一立法。從我國行政法的一般原理原則來判斷，以下敘述哪一敘述「錯誤」？
  options:
  - label: A
    content: 保障公眾安全屬重大公益，且都更後甲仍有更新之住屋可居，但仍會影響甲的權利
  - label: B
    content: 強制都更影響人民財產權，都更之前若未先聽取甲意見，將違反正當行政程序原則
  - label: C
    content: 甲的住宅具有百年歷史，為維護自家百年住宅的存在，甲認為不應立法強制都更，而是採取其他手段保留、以傳承文化，甲的論點較為符合比例原則，認為政府應選擇其他侵害較小的手段為之
  - label: D
    content: 推動都更是為了公共安全，只要建物屋齡超過 60 年便應強制重建，符合比例原則
  - label: E
    content: 如該政府不顧反對意見強制重建，須有法律為依據，否則政府將違反法律保留原則
  answer:
