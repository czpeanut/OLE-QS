  stem: 《釋字第 756 號》是對於受刑人祕密通訊自由之權利做出的解釋，其中涉及的法令：「《監獄行刑法》第 66 條規定：『發受書信，由監獄長官檢閱之。如認為有妨害監獄紀律之虞，受刑人發信者，得述明理由，令其刪除後再行發出……。』其中閱讀書信部分，未區分書信種類，亦未斟酌個案情形，一概許監獄長官閱讀書信之內容，顯已對受刑人及其收發書信之相對人之祕密通訊自由，造成過度之限制。《監獄行刑法施行細則》第 82 條規定：『……妨害監獄紀律之虞，指書信內容有下列各款情形之一者：一、顯為虛偽不實、誘騙、侮辱或恐嚇之不當陳述，使他人有受騙、造成心理壓力或不安之虞。』……逾越母法之授權。」請問上述法令的法律原則哪一選項「錯誤」？
  options:
  - label: A
    content: 《監獄行刑法》第 66 條違反比例原則
  - label: B
    content: 《監獄行刑法》第 66 條違反禁止不當連結原則
  - label: C
    content: 《監獄行刑法施行細則》第 82 條違反法律保留原則
  - label: D
    content: 《監獄行刑法》違反明確性原則
  explanation: (A)題文提到未審酌惡案情形，一概許監獄長官閱讀書信之內容，可知違反比例原則。(B)禁止不當連結，指行政行為的手段對人民造成不利時，必須與行政行為的目的有合理的聯結關係存在。為了監獄的紀律檢查書信，並無違反禁止不當連結。(C)題文中提到「逾越母法之授權」可知違反法律保留原則。(D)明確性原則指行政內容不明確，此處並無此問題。故本題選(B)(D)。
  tags:
    unit:
      code: CI-2-4-1
      book: 公民與社會2 正義與法治
      chapter: 生活中的行政法規
      title: 行政法原則
      std: true
    textbook: 公民與社會2 正義與法治 行政法原則
