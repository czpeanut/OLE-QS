  stem: 憲法法庭做出《111 年憲判字第 1 號》判決指出，強制驗血的規定違反《憲法》所保障的基本人權，相關規定自本判決公告之日起，至遲於屆滿 2 年定期失效。當交通事故發生後，如果交通執法人員有相當理由，認為是因為酒駕而肇事，而且情況急迫，有必要迅速保全酒駕證據，在這個範圍內，多數意見認為強制驗血符合必要性跟相稱性。但除了上述的情況外，肇事的原因很多，並不一定是因為酒駕，不能因為肇事者拒絕配合酒駕或因為神志不清而無法吐氣酒測，就一律強制驗血。《道路交通管理處罰條例》只有規定拒絕或肇事無法吐氣酒測，交通勤務警察或交通稽查人員就應該強制驗血，沒有區分情況是不是急迫，也沒有經過法官或檢察官審查、同意，事後也沒有監督查核程序，沒有提供任何權利救濟機制。依據上文，本案涉及人權的限制，關於《道路交通管理處罰條例》強制驗血的規定，請判斷下列敘述何者正確？
  options:
  - label: A
    content: 雖為維護社會秩序，駕駛人基本權仍不可受政府過度侵害
  - label: B
    content: 基於避免緊急危難，警察可任意行使裁量權，限制駕駛人之基本權
  - label: C
    content: 為維護社會秩序，駕駛人之基本權可以行政命令逕行限制
  - label: D
    content: 基於增進公共利益，警察可於法律授權範圍內限制駕駛人之基本權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依據《111 憲判字第 1 號》內容提到，肇事不代表一定是酒駕，不能因為肇事者拒絕、神智不清、無法吐氣驗是否喝酒，而一律強制驗血。可知該憲法判決強調即使是基於維護社會秩序，基本權利也不應過份受限，故本題選(A)。(B)酒測與避免緊急危難無關。(C)應當以法律或法律授權之法規命令方可限制基本權利。(D)此非本憲法判決之意旨。
