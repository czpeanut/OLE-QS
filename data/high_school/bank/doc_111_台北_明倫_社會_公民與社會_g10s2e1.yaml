  stem: 《釋字第 791 號》解釋文說明《刑法》第 239 條規定：「有配偶而與人通姦者，處 1 年以下有期徒刑。其相姦者亦同。」……應自本解釋公布之日起失其效力；於此範圍內本院《釋字第 554 號》解釋應予變更。《刑事訴訟法》第 239 條但書規定：「但《刑法》第 239 條之罪，對於配偶撤回告訴者，其效力不及於相姦人。」與憲法保障(甲)權之意旨有違，且因《刑法》第 239 條規定業經本解釋宣告違憲失效而失所依附，故亦應自本解釋公布之日起失其效力。《釋字第 791 號》解釋理由書：「……況國家以刑罰制裁手段處罰違反婚姻承諾之通姦配偶，雖不無『懲罰』違反婚姻忠誠義務配偶之作用，然因國家權力介入婚姻關係，反而可能會對婚姻關係產生負面影響。是系爭規定一之限制所致之損害顯然大於其目的所欲維護之利益，而有失均衡……」。依據大法官《釋字第 791 號》解釋理由書，大法官認為《刑法》第 239 條規定有違反下列何種法律原則之虞？
