    labeled_by: agent
    label_confidence: medium
- id: doc_111_台北_明倫_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某地方政府為了端正公務員的風氣，率先全國自行訂定禁止公務員飲酒的行政命令。縣內公務活動，一律禁止提供任何酒類給公務員，公務員亦不得飲用任何單位或個人提供的酒類。此外，公務員不論是正常上班、節假日值班或工作日 8 小時外時間一律禁止飲酒。關於該地方政府的行政行為，下列何者「錯誤」？
  options:
  - label: A
    content: 地方政府擁有自治權，仍須以不違反上位階憲法、法律為前提，是為遵守法律優越原則
  - label: B
    content: 若上位階法律沒有授權規定，該命令恐違反法律保留原則
  - label: C
    content: 該命令對公務員工作時間以外仍禁酒，可能違反平等原則
  - label: D
    content: 該命令規範的對象不是一般人民，仍應遵守一般行政法原理原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)依據題文描述，即使是上班時間以外也禁止公務人員喝酒，與平等原則無關，而是缺乏法律的授權，違反了法律保留原則。
