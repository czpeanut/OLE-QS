  stem: 「警察為了業績衝罰單！」引發網友熱烈討論，有許多民眾都拍下警察躲在橋下人行道口，並架設俗稱「黑箱」的移動式測速照相，請問針對警察執法所開立之罰單，人民對此不滿而申訴可能結果為何？
  options:
  - label: A
    content: 為符公平原則，其他民眾已繳罰鍰，則無法撒銷該罰單
  - label: B
    content: 民眾違規屬於事實，警察取締即為取證，罰單無法撤銷
  - label: C
    content: 因有違反誠信原則之疑，可提申訴以撤銷罰單
  - label: D
    content: 警察應得到民眾同意才能開單，否則人民即可拒收而撤銷
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 行政行為須符合誠信原則，警察躲在某處沒有善盡告知執法，屬於違反誠信原則的展現，故本題選(C)。(A)與公平原則無關。(B)違反誠信原則，可撤銷。(D)警察須依法，與行政法一般原理開單，並無需民眾之同意。
