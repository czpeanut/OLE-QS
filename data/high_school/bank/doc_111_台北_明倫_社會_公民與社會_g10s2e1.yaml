  stem: 國家為調和公共利益，可透過正當程序限制人民的基本權利。下列敘述與限制人民基本權利公益目的的對應關係，何者正確？
  options:
  - label: A
    content: 避免緊急危難：為避免養豬業者汙染河川水源，要求業者改善現有的養豬設備
  - label: B
    content: 防止妨礙他人自由；限制感染 COVID-19 的病患搭乘國際航線航空器及船舶
  - label: C
    content: 防止妨礙他人自由：避免影響左右鄰居安寧，限制於夜間進行房屋施工
  - label: D
    content: 避免緊急危難：為吸引科技業進駐以增加工作機會，徵收私有地作為科學園區
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當為增進公共利益。(B)應當為增進公共利益。(D)應當為增進公共利益。故本題選(C)。
