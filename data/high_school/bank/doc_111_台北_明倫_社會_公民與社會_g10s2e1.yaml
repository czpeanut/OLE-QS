  - label: A
    content: 平等權
  - label: B
    content: 姓名權
  - label: C
    content: 隱私權
  - label: D
    content: 子女獲知血緣來源之權利
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文可知，依據《原住民身分法》的規範，如果是原與非原的通婚，必須從原住民一方的姓氏，方可取的原住民身分。但一般習慣從父姓，如果父親是非原，母親是原住民，就無法取得原住民身分，題文提到，此為「差別待遇」之立法，可知應為平等權的議題。故本題選(A)。與(B)(C)(D)無直接關係。
