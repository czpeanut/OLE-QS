  section: 1
  number: 5
  type: single
  page: 2
  stem: 民眾投訴收到警方開立的違規停車告發單，不滿車停在自家門前騎樓卻被開單，拿出建商使用執照，上頭都寫著有室外停車空間不懂為何還被開單，也有乙網友說明，騎樓屬於所有權私有、使用權公用性質，依照《道路交通管理處罰條例》等同道路或人行道，基本上不能停車。根據上文下列何者敘述最為正確？
  options:
  - label: A
    content: 民眾自己使用自己的土地還須受罰，政府屬於公權力濫用
  - label: B
    content: 基於信賴保護原則，如果以前沒有受罰，現在開單即違法
  - label: C
    content: 自己的車輛不能停騎樓，應該要讓給其他人民共享停車權利
  - label: D
    content: 私人所有權在必要且有公益需要時，仍須讓渡部分使用權限
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府依法開單，不屬於權力濫用。(B)信賴保護原則指的是政府應保護以給予人民的利益，不得任意改變，但騎樓停車本身即是違法行為，非政府所給予的利益。(C)依據法規，騎樓不得停車。(D)屬於對財產權的公益性限制，故本題選(D)。
