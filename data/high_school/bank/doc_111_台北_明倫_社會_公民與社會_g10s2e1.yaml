  stem: 有關立法程序與行政院長行使覆議權時，需要具備之要件及相關敘述，何者「錯誤」？
  options:
  - label: A
    content: 二讀程序為實質審查，逐條討論
  - label: B
    content: 通常三讀僅為文字錯誤或標點符號之修正
  - label: C
