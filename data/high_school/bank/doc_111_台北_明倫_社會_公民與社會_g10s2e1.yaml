  type: single
  page: 2
  stem: 因為家中經濟無法負擔生理用品的費用，在非洲與印度有數以萬計的女孩在月事期間無法上學，而男性並不會受此生理因素影響學習；因此也出現女性生理用品應該免稅的主張，除可減輕女性額外的財務負擔，更可提升稅制在生理男與生理女之間的公平性。上述「月經貧窮」現象是近年來才提出的詞彙，卻是這世界長久以來存在的問題。根據上述，請問受「月經貧窮」困擾，非洲與印度的女性有哪些人權受到侵害？
  options:
  - label: A
    content: 生命權
  - label: B
    content: 人身自由權
  - label: C
    content: 居住自由
  - label: D
    content: 隱私權
  - label: E
    content: 平等權
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到，印度、非洲部分地區的婦女，因為經濟資源不佳，無法負擔衛生棉，導致月事期間無法與男性一樣上學。此屬於教育機會的不平等，故本題選(E)。
