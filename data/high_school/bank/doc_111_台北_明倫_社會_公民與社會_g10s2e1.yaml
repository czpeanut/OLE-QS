  stem: 某電子線上購物網上所販售的手機，標示售價明顯低於市場行情，等同打 1 折，吸引眾多網友瘋狂下單刷卡。不過標錯價的品項隨後就顯示停售。若網路上下單已屬確定，契約也已成立商家是否需要出貨？
  options:
  - label: A
    content: 仍需視實際狀況衝量。若商家能舉證意思表示錯誤，或是消費者有惡意大量下單的狀況，商家可以不出貨
  - label: B
    content: 不須出貨，網路物廠商有 7 天猶豫期間決定是否履約
  - label: C
    content: 應該出貨，因為消費者有 7 天猶豫期間決定是否購買
  - label: D
    content: 須出貨，即使民眾惡意大量採買有權利濫用之虞，仍須履行交易契約
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)網路購物應當是「消費者」有 7 天的猶豫期。(C)消費者 7 天猶豫期主要是郵購買賣消費者並無直接看到購買物品的實體，因此 7 天內可以無條件退貨的規定以保障消費者的權益，並非是決定是否購買。(D)消費者明顯知道標錯價還大量下訂單，違反誠信原則。故本題選(A)。
