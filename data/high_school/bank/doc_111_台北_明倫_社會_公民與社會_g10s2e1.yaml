  stem: 立法院三讀通過《就業保險法》的修正，鼓勵雙親共同撫育子已具成效，2021 年 7 至 12 月請領育嬰留職停薪津貼者約 4.7 萬人，相較 2020 年同期增加約 1.1 萬人、增幅約 30 ％，其中男性申請人數增加約 3,700 人、年增 56 ％。根據上文，請問下列敘述何者正確？
  options:
  - label: A
    content: 根據上文顯示，仍有許多爸爸們不願意共同分擔照顧子女責任
  - label: B
    content: 若僅准許女性育嬰留停，是對男性爸爸之歧視性差別待遇
  - label: C
    content: 對未生兒育女之工作者而言，無法享受此權利，得主張違反平等原則
  - label: D
    content: 育嬰是女性天職，男性申請者可能涉及違法請領相關單位應調查
  - label: E
    content: 雙親共同扶養請領補貼不包括同性配偶伴侶
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)根據題文年增率 56 %，顯示愈來愈多的父親願意共同分擔照顧子女的責任。(B)若僅允許女性留停，為不合理之差別對待，屬於性別歧視。(C)生兒育女為自我人生規劃的選擇，與平等原則無關。(D)育嬰為夫妻雙方共同的責任，而非女性的天職。(E)包含同性伴侶。故本題選(B)。
  tags:
    unit:
      code: CI-2-2-1
      book: 公民與社會2 正義與法治
      chapter: 公平正義的追求
      title: 社會正義
      std: true
