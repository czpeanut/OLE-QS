    | --- | --- |

    | 民進黨 | 61 |

    | 國民黨 | 38 |

    | 台灣民眾黨 | 5 |

    | 時代力量 | 3 |

    | 台灣基進黨 | 1 |

    | 無黨籍 | 5 |'
  options:
  - label: A
    content: 本屆立法院內最多能組成 5 個黨團進行運作
  - label: B
    content: 黨團協商時必須以民進黨的意見為依歸
  - label: C
    content: 法案表決時至少要有 58 人同意才能通過
