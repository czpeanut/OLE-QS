  group_stem: '就讀高三的小王，某日在公民與社會的課堂中，聽到下列幾個同學針對我國釋憲制度的敘述與說明。

    老劉：「只有當『甲』救濟管道已經完全用盡後，認為確定終局裁判所適用的法律有牴觸《憲法》的疑義，或是認為裁判有違憲疑義時，『甲』才可以提出釋憲聲請。」

    小波：「你說的不對，只要進行訴訟程序，『甲』隨時可以聲請釋憲。」

    小蔡：「法院最了解法律，所以在他們審理案件時，發現審理過程中有違憲的疑義時，就可以提出釋憲聲請。」

    大陳：「法院雖然最了解法律，但因為對法律與裁判是否違憲有疑慮，故需要連同案件本身交由大法官審理，讓憲法法庭做出終局判決。」'
