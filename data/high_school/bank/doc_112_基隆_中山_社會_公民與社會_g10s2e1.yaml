  stem: 過去我國《民法》曾規定：「妻以其本姓冠以夫姓，贅夫以其本姓冠以妻姓。」面對質疑違反男女平權時，若以我國是沿襲日本民法而來，且考慮《民法》制定時的民情為由來說明該規定，這種解釋的方式屬於下列何者？
  options:
  - label: A
    content: 文義解釋
  - label: B
    content: 歷史解釋
  - label: C
    content: 體系解釋
  - label: D
    content: 目的解釋
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文「考慮《民法》制定時的民情為由來說明該規定」，可知此種解釋屬於(B)歷史解釋，指藉由研究立法時的歷史背景資料、立法機關審議情況、制定草案的理由書、報告書等相關立法資料，來說明立法當時，立法者準備賦予法律的內容和含義是什麼。(A)指藉由探求條文文字的可能意義，透過文字的意義來解釋法律。(C)指解釋法律時要遵從、維護法律的體系，使同一用語、意義統一，且不同階層的法律規範不得相互牴觸。(D)指解釋法律時，必須要考量法律的規範意義與目的，才能實踐法律的規定意旨。
