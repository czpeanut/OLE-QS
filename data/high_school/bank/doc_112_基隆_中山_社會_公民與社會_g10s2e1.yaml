  stem: 法院須依法審判，但若法院認為審判案件時所適用的法律條文有違憲之虞時，得採取下列哪一項措施？
  options:
  - label: A
    content: 裁定停止訴訟程序，向憲法法庭審理聲請法規範審查
  - label: B
    content: 針對有違憲之虞的法律逕自拒絕適用
  - label: C
    content: 向最高法院報告，由其提出釋憲聲請
  - label: D
    content: 將此案件轉由司法院審判
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依據《憲法訴訟法》，各法院就審理的案件，對於裁判上所應適用的法律，依合理確信，認為牴觸《憲法》，且對於該案件的裁判結果有直接影響，可以暫停審判聲請憲法法庭為宣告違憲的判決，故選(A)。
