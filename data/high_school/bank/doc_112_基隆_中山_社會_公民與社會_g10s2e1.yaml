  answer_status: verified
  answer_source: answer_key
  explanation: 裁判憲法審查聲請要件有 3 個重點；首先，人民依法律規定用盡審級救濟程序，受到不利確定終局裁判；其次，認為確定終局裁判所適用法律或命令違反《憲法》，或裁判本身違憲；最後，在確定終局裁判送達後 6 個月內提出聲請。根據上述，老劉、小蔡的說明正確；小波的說明有誤，人民聲請釋憲，需受到不利確定終局判決才能提出；大陳的說明有誤，大法官只針對法律及裁判是否有違憲疑慮進行判決，不處理案件本身爭議。故選(D)。
