- id: doc_112_基隆_中山_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 《教師法》規定，教師聘任後，行為不檢有損師道，經有關機關查證屬實者，得予解聘、停聘或不續聘，且終身不得聘任為教師。大法官對此作成司法院釋字第 702 號解釋闡述，確保學生良好之受教權及實現《憲法》規定之教育目的，其所欲維護者，確屬重要之公共利益，其目的洵屬正當。對行為不檢而有損師道之教師，予以解聘、停聘、不續聘，其所為主觀條件之限制，並無其他較溫和手段可達成同樣目的，尚未過當。限制教師終身不得再任教職，而未針對行為人有改正可能之情形，訂定再受聘任之合理相隔期間或條件，完全扼殺其改正之機會，對其人格發展之影響至鉅，對人民工作權之限制已逾越必要程度。解讀前述大法官解釋之意旨，下列敘述何者正確？
  options:
  - label: A
    content: 該法中「行為不檢有損師道屬實者得予解聘」的規定不合憲
  - label: B
    content: 該法規的內容可能違反法律保留原則
  - label: C
    content: 該法規定停聘、不續聘違反比例原則、違反平等原則的規範
  - label: D
    content: 該法終身不得聘任為教師的規定不合憲
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文「限制教師終身不得再任教……對人民工作權之限制已逾越必要程度」，可見限制教師終身不得再任教職違反比例原則，此部分違憲，故選(D)。(A)該法中「行為不檢有損師道屬實者得予解聘」的規定合憲。(B)違反比例原則。(C)與平等原則無關。
