  stem: 依據文本所提供的資訊加以分析，《憲法訴訟法》施行後產生哪項重大改變？
  options:
  - label: A
    content: 違憲審查聲請主體由人民轉為大法官
  - label: B
    content: 大法官可以進行裁判是否違憲的審查
  - label: C
    content: 個案必須在獲得終局裁判後聲請釋憲
  - label: D
    content: 大法官與法院法官因而有獨立審判權。（2 分）
  group_stem: '過去大法官以會議審理案件、作成解釋的方式行使職權，例如釋字第 784 號解釋乃基於《憲法》第 16 條保障人民訴訟權之意旨，各級學校學生認其權利因學校之教育或管理等公權力措施而遭受侵害時，即使非屬退學或類此之處分，亦得按相關措施之性質，依法提起相應之行政爭訟程序以為救濟，無特別限制之必要。

    釋字第 813 號解釋成為《憲法訴訟法》施行前的最後一號大法官解釋。該解釋認定《文化資產保存法》部分條文違憲，當建物被認定為歷史建物不能拆除時，主管機關應補償地主。

    2022 年起，我國將由憲法法庭「111 年度憲判字第 1 號判決」接棒大法官解釋。大法官過去只能審查法規是否合憲，無權審理確定判決有無違憲，憲法審查的客體限於法律、命令，即使發現終審法院裁判不符《憲法》保障基本權意旨，僅只能予以駁回。但《憲法訴訟法》建立裁判憲法審查制度，賦予大法官審查裁判違憲的權力。讓憲法審查範圍，除了法規範，還擴及到個案救濟，人民可就個案終局裁判後 6 個月內聲請憲法審查。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文中「《憲法訴訟法》建立裁判憲法審查制度，賦予大法官審查裁判違憲的權力。讓憲法審查範圍，除了法規範，還擴及到個案救濟，人民可就個案終局裁判後 6 個月內聲請憲法審查」，可知應為(B)大法官可以進行裁判是否違憲的審查。
