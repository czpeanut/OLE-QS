- id: doc_112_基隆_中山_社會_公民與社會_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 有學者指出社會規範會形成社會控制。社會控制是約束、調整、限制社會成員思維和行為的重要力量，確保其行為符合社會規範。請問下列哪一個例子與其他例子的社會控制類型「不同」？
  options:
  - label: A
    content: 大明違規考試作弊，處罰記小過一支
  - label: B
    content: 偷用同學手機，內心非常不安
  - label: C
    content: 珍珍穿裙跑步跌倒，走光十分羞恥
  - label: D
    content: 四下無人亂丟垃圾，但覺得不好意思
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)記過為法令的一種，屬於外在控制，指透過具強制力的法規命令，來約束不符合社會規範的行為。(B)(C)(D)皆屬於道德或內心罪惡感等內在控制的社會規範。
