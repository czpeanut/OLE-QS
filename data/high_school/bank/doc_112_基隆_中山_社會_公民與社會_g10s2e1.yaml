  answer_status: verified
  answer_source: answer_key
  explanation: (A)依規定，每屆立法委員選舉，當選席次最多的前 5 個政黨，且席次達 3 席以上，得各自組成黨團，因此本屆共有 4 個黨團。(B)黨團協商時，各黨團擁有相同的發言權。(C)總席次為 113 人，在法案表決時須現有立法委員總額 1∕3 出席，且出席委員過半數同意為基本門檻，故應是 19 人。(D)法律提案須由 15 位以上立委連署，若為黨團提案則無此限制，因此在時代力量人數較國民黨少的情況下會更依賴黨團提案，為正解。
