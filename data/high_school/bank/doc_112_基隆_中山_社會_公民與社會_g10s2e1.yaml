  explanation: 依題文「若車主正在車上睡覺，而執法人員卻予以逕行拖吊」，意味著有侵害人民權益較小的做法，而執法人員卻選擇侵害權益較大的做法，違反(B)必要性原則。必要性原則為由合乎適當性之措施中，選擇對權利侵害程度最小的手段，但其功效必須與較大侵害程度的手段相同。
