  explanation: 地圖顯示從日本前往中國交流的三條路線――北路、南路、南島路，終點為長安，因此可推測為唐朝，故答案為(D)。(A)(B)(C)三者皆發生於 19 世紀中葉，且與中國無關。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 史書記載：「新羅王遣子弟來華，請入國學。其學生或習經史，或學佛法，欽慕華風，接受華化，衣冠正朔皆尊中國。」請問文中所述之現象，出現於何時？
  options:
  - label: A
    content: 秦漢時期
  - label: B
    content: 魏晉時期
  - label: C
    content: 隋唐時期
  - label: D
    content: 宋元時期
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述應是統一新羅時期與唐帝國往來的情形，當時積極唐化的新羅甚至被稱為「君子國」，因此答案為(C)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 日本在江戶時代曾實施一種「參勤交代」的制度，各藩的大名每年需前往江戶替幕府將軍執行政務一段時間，然後返回自己領土執行政務，前往江戶的費用需要由大名自行負擔，而妻兒也被留在江戶長期居住。請問實施這種制度的用意為何？
  options:
  - label: A
    content: 強化天皇權威
  - label: B
    content: 鞏固幕府權力
  - label: C
    content: 模仿中國律令
  - label: D
    content: 促進社會流動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「參勤交代」的做法是限制各藩大名的行動，加上妻兒被留在江戶長期居住形同人質看守，因此可見實施這種制度的用意在(B)鞏固幕府權力，防止大名勢力威脅。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 高麗王朝的《訓要十條》提到：「我們國家的發展是依靠諸神佛的護衛，所以創立寺院、派遣僧侶進駐……新羅末年過度修建佛塔，失去地脈的庇祐，不可不引以為誡……我靠著三韓的山川與西京地脈能量順暢，是個能夠使我國長久存在、成就霸業的福地……。」此段文字的要旨為以下哪一選項？
  options:
  - label: A
    content: 新羅滅亡是因不依賴山川形勢
  - label: B
    content: 高麗王朝首都依三韓山川建立
  - label: C
    content: 高麗大業是受佛教與地脈保佑
  - label: D
    content: 高麗建國將傾全國之力去奉佛
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《訓要十條》提到高麗國家的發展，一是「依靠諸神佛的護衛」，二是「靠著三韓的山川與西京地脈能量順暢」，因此正確答案為(C)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 學者評論安南國《大越史記》的作用如下：「陳朝面臨來自北方國家的巨大壓力，要求安南國王入朝，但陳朝屢辭不赴。史家黎文休《大越史記》就是在陳朝國王拒絕入覲的次年完成的，此時選擇以趙佗──南越國作為國統起源，就別有深意了。……安南國當時距離南越國已有千餘年，但在南越國一隅建國，因此將本國歷史上溯，以『趙紀』稱之，實際上在世系、傳承上並無直接關聯。而對於北方國家要求君長入朝，因南越國入漢導致亡國的前車之鑒，陳朝自然予以拒絕。陳朝此刻完成國史《大越史記》，以趙佗南越國為國統之首，顯示將抗衡北方大國。」依上述引文可知陳朝史官編纂《大越史記》的深意為何？
  options:
  - label: A
    content: 否認曾作為唐朝安南都護府統轄的事實
  - label: B
    content: 誓言對宋朝開戰，拒絕接受中國的冊封
  - label: C
    content: 對抗元朝，並彰顯安南本土政權的正統
  - label: D
    content: 擺脫明朝，另建越南為中心的朝貢體系
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 陳朝（1225 ～ 1400 年）所面臨的北方國家為中國元朝，從題文學者的評論可知，陳朝不願向元朝入覲朝貢，《大越史記》以趙佗南越國為國統之首，目的也是在抗衡元帝國，因此正確答案為(C)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 東亞各國發展有其類似的特性，在傳入的中華文化、國家體制的基礎上，東亞各國發展過程中，漸次有意識地建構各自文化主體性，請問下列何者最適合做為東亞各國強調自身主體性的表現？
  options:
  - label: A
    content: 黎聖宗下令修《大越史記》，以彰顯民族意識
  - label: B
    content: 越南李朝首度實行科舉制度，正式建構文官的階級體系
  - label: C
    content: 朝鮮於中央設立「成均館」，以培育國家人才
  - label: D
    content: 日本頒行班田收授法與大寶律令，以強化中央集權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)黎聖宗下令修《大越史記》，以趙佗南越國為國統之首，有別於中國政權以彰顯自身的主體性。(B)(C)(D)三者皆模仿中國的制度與律令，與題文「強調自身主體性的表現」明顯不符。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 棠哥在某網站計劃拍賣一批古物，聲稱是戰國時期的墓葬所出土之文物，包括：銅鏡、竹簡、毛筆與佛像。我們根據歷史知識可以判斷至少有一件文物必為贗品。這件文物應是：
  options:
  - label: A
    content: 佛像
  - label: B
    content: 毛筆
  - label: C
    content: 銅鏡
  - label: D
    content: 竹簡
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 佛教要等到西漢末年才傳入中國，因此出土的戰國文物不可能有(A)佛像。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某篇論文指出：一位君主因為信佛者甚眾，影響國計民生，所以強迫僧侶還俗，甚至徵調為兵；又沒收寺產，充為國用，因此「租調年增，兵師日盛」。這篇論文最可能的主題應是下列何者？
  options:
  - label: A
    content: 佛教的傳播
  - label: B
    content: 寺院與經濟
  - label: C
    content: 稅制的變革
  - label: D
    content: 兵制與國防
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這篇論文的重點在君主以佛教過盛而影響國計民生，因此強迫僧侶還俗、沒收寺產，雖然題文有提到「徵調為兵」、「兵師日盛」，但主題還是在「國計民生」與「租調年增」，因此最佳的答案為(B)寺院與經濟。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 道教出於中國本土，有學者認為最早可以上溯祭天、祭祖等上古社會的祭儀，至春秋戰國時期再吸收神仙方術，直至漢代中後期才以老子為始祖，形成正式的宗教教派。但對道教的形成發展，各時代都有重要人士加以修正規整，請問下列何人於道教組織系統化後，於漢中成立政教合一的宗教王國，以獎善罰惡教導大眾，且頗得民心，自號「師君」，但最後歸降於曹操？
  options:
  - label: A
    content: 陶弘景
  - label: B
    content: 葛洪
  - label: C
    content: 張魯
  - label: D
    content: 張角
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 張角創立天師道，其孫(C)張魯進一步在漢中建立政教合一的宗教王國，以「鬼道」教民，但最後歸降於曹操，使天師道開始北傳。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 金庸小說《倚天屠龍記》中，提到的「明教」係源出波斯，本名摩尼教。歷史中真實的摩尼教，為公元 3 世紀中葉波斯人摩尼所創立。其教義吸收了基督教、祆教等多種宗教成分。請問關於摩尼教在中國的發展，下列敘述何者較為恰當？
  options:
  - label: A
    content: 摩尼教在中國以手持刀劍、練武強身的方式傳教
  - label: B
    content: 由於屢遭官方取締，最後潛入地下成為祕密宗教
  - label: C
    content: 受其一神信仰的影響，與中國社會始終難以相融
  - label: D
    content: 逐漸與佛、儒家思想混合，成為社會安定的力量
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(D)與史實不符。(B)元末明教即為祕密宗教，為正解。(C)受波斯祆教影響，主張善惡二元對立。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '資料一：「舉中國數千年禮義人倫詩書典則，一旦掃地蕩盡。此豈獨我大清之奇變，乃開闢以來名教之奇變，我孔子、孟子之所痛哭於九原。」

    資料二：「孔丘見高天人人歸咎他，他變私逃下天，欲與妖魔頭偕走。天父皇上帝即差主同眾天使追孔丘，……孔丘跪在天兄基督面前再三討饒，鞭撻甚多……。」

    請問上述資料指涉的事件 ，下列敘述何者正確？'
  options:
  - label: A
    content: 資料一為起事者的立場，目的是要喚醒民族大義
  - label: B
    content: 資料二為朝廷官員的立場，藉虛假故事醜化敵方
  - label: C
    content: 事件從廣西發生，並一路攻破首都北京改名天京
  - label: D
    content: 事件從南方而起，而破壞了帝國仰賴的江南經濟
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從資料二的「天父皇上帝」、「天兄基督」的說法，即可推知兩則資料與太平天國起事有關，因此正確答案為(D)。(A)資料為曾國藩的檄文，以捍衛儒家倫理為職志。(B)資料二為太平天國洪秀全的說法。(C)太平天國軍隊攻至南京定都，並改名為天京。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 《南史．侯景傳》中記載：「又請娶於王、謝，帝曰：『王、謝門高非偶，可於朱、張以下訪之。』」關於此段史料的解讀，下列何者正確？
  options:
  - label: A
    content: 君王無力介入世族婚事，推薦侯景和富裕的平民家族聯姻
  - label: B
    content: 此事件種下侯景與東魏政府和世族間矛盾的開端
  - label: C
    content: 此事件使侯景感到屈辱，故於起事時刻意屠殺世族
  - label: D
    content: 侯景於後續引發的報復行動使郡姓大族轉趨衰微
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)朱、張為較低階的江南世族，非平民家族。(B)應是梁朝政府，非東魏。(C)為正解。(D)應是僑姓大族。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '資料一：為促使甲乙兩集團合作，王導下令，禁止甲集團侵占太湖（吳郡）一帶的土地，以保護乙集團在大湖的經濟特權。

    資料二：甲集團的政治地位較高，政府的重要長官如「僕射」等職，絕少由乙集團擔任。

    資料三：東晉立國之初，乙集團的人以上國自居，常稱甲集團的人為「父」，意味著粗鄙之人。

    上述三段資料中的甲、乙集團應為何者？'
  options:
  - label: A
    content: 世族與寒門
  - label: B
    content: 僑姓與吳姓
  - label: C
    content: 山東世族與朝鮮國姓
  - label: D
    content: 科舉新貴與經學世家
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 東晉建國之初，中原沉淪，吳郡便以上國之居，輕視自北方南下之人；自北方南下的世族，常以中原名族自相標榜，實則並非北方大族，但藉著東晉的政治力量而聲望一度超過北方大族，並壓抑南方的吳姓士族，因此甲、乙集團應各自為(B)僑姓與吳姓。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 一群住在冀州（河北）的人們，為了躲避戰禍，移居到了南方揚州境內。政府特別在揚州境內設置一個也名為「冀州」的地方政府，這群人的戶籍不屬於揚州地方政府管轄，而屬於這個增置的冀州地方政府。請問這種現象最可能出現在哪一個時代？
  options:
  - label: A
    content: 漢魏
  - label: B
    content: 南朝
  - label: C
    content: 隋唐
  - label: D
    content: 宋明
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為永嘉之禍後，東晉、南朝政權為安置來自北方的移民，在南方設置了一些僑州、僑縣，因此答案為(B)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s2e2_s1_15
  section: 1
  number: 15
