  stem: 附圖為某時期的東亞文化交流路線，請問該路線與下列哪一史事最為相關？
  options:
  - label: A
    content: 明治維新
  - label: B
    content: 黑船事件
  - label: C
    content: 尊王攘夷
  - label: D
    content: 大化革新
