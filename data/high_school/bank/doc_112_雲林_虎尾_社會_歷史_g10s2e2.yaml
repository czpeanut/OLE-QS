  stem: 「湖南宗匡氏宗族對於族人不事先告知族內而私自興訟，罰銀五兩，其錢充公。」「廣東南海霍韜宗族，對於族人初犯者，杖責十板，再犯二十，三犯三十。再嚴重一點，就會將其告官與出族（開除宗籍）。最重的處罰，族長甚至可以處死族人。」「安徽桐城姚氏宗族族規規定：各處祖塋，無論公私，不許藉口倚墳再葬，違者處死。」上述三則資料反映宗族已具有司法的仲裁權。下列相關解讀，何者正確？
  options:
  - label: A
    content: 上述現象應該出現在隋唐時期
  - label: B
    content: 宗族族長可以處以族人死刑，與社會上盛行常動用私刑有關
  - label: C
    content: 宗族族規賦予族長司法的權力，與國家力量的介入有關
  - label: D
    content: 意味著地方宗族勢力，已經凌駕在國家之上
  answer:
