  answer_status: verified
  answer_source: answer_key
  explanation: '∵（$a^{2}$＋$b^{2}$＋9）．（$x^{2}$＋$y^{2}$＋1）＝（$a^{2}$＋$b^{2}$＋$3^{2}$）．（$x^{2}$＋$y^{2}$＋$1^{2}$） ≥ （a．x＋b．y＋3．1）$^{2}$

    “＝”成立時，$\frac{x}{a}=\frac{y}{b}=\frac{1}{3}$

    ∵ab≠0$\Leftrightarrow$a≠0 且 b≠0

    ∴$\begin{cases}x=\frac{a}{3} \\ y=\frac{b}{3}\end{cases}$代入$\frac{x^{2}+y^{2}}{a^{2}+b^{2}}$＝$\frac{\left( \frac{a}{3} \right) ^{2}+\left( \frac{b}{3} \right) ^{2}}{a^{2}+b^{2}}$＝$\frac{1}{9}\times \frac{a^{2}+b^{2}}{a^{2}+b^{2}}$＝$\frac{1}{9}$

    故選(A)'
