- id: doc_109_台中_興大附中_數學_數A_g11s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 考慮$\vec{a}$＝（$a_{1}$，$a_{2}$，0），$\vec{b}$＝$(b_{1} , b_{2} , \sqrt{5} )$，$\vec{c}$＝（1，2，0），其中 $a_{1}^{2}$＋$a_{2}^{2}$＝$b_{1}^{2}$＋$b_{2}^{2}$＝4。請問下列哪一個選項是正確的？
  options:
  - label: A
    content: $│ \vec{a} │ =1$
  - label: B
    content: $a_{1}b_{1}$＋$a_{2}b_{2}$ 的值可能為 4
  - label: C
    content: $\vec{a} \cdot \vec{b}$的最大值為 6
  - label: D
    content: $\vec{a}$與$\vec{c}$圍出的平行四邊形面積為（$a_{1}$－$a_{2}$）$^{2}$
  - label: E
    content: 向量$\vec{a}$，$\vec{b}$，$\vec{c}$所決定的平行六面體體積為｜$2a_{1}$－$a_{2}$｜
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：｜$\vec{a}$｜＝｜（$a_{1}$，$a_{2}$，0）｜＝$\sqrt{a_{1}^{2}+a_{2}^{2}+0^{2}}$＝$\sqrt{4}$＝2

    (B) ○：∵（$a_{1}^{2}$＋$a_{2}^{2}$）×（$b_{1}^{2}$＋$b_{2}^{2}$） ≥ （$a_{1}b_{1}$＋$a_{2}b_{2}$）$^{2}$

    ∴4×4 ≥ （$a_{1}b_{1}$＋$a_{2}b_{2}$）$^{2}$ ∴$a_{1}b_{1}$＋$a_{2}b_{2}$ ≤ 4

    等號成立於$\frac{a_{1}}{b_{1}}$＝$\frac{a_{2}}{b_{2}}$，故 $a_{1}b_{1}$＋$a_{2}b_{2}$ 可能為 4

    (C) ╳：∵$\vec{a}$．$\vec{b}$＝（$a_{1}$，$a_{2}$，0）．（$b_{1}$，$b_{2}$，$\sqrt{5}$）＝$a_{1}$×$b_{1}$＋$a_{2}$×$b_{2}$＋0×$\sqrt{5}$ ≤ 4，故不可能

    (D) ╳：$\vec{a}$，$\vec{c}$所圍成的平行四邊形面積

    ＝$│ \vec{a}\times \vec{c} │$＝｜（$a_{1}$，$a_{2}$，0）×（1，2，0）｜＝$\left| \left( \left| \begin{matrix}a_{2} & 0 \\ 2 & 0\end{matrix} \right| , \left| \begin{matrix}0 & a_{1} \\ 0 & 1\end{matrix} \right| , \left| \begin{matrix}a_{1} & a_{2} \\ 1 & 2\end{matrix} \right| \right) \right|$

    ＝｜（0，0，$2a_{1}$－$a_{2}$）｜＝$\sqrt{0^{2}+0^{2}+(2a_{1}-a_{2})^{2}}$＝｜$2a_{1}$－$a_{2}$｜

    (E) ╳：$\vec{a}$，$\vec{b}$，$\vec{c}$所決定的平行六面體體積

    ＝$│ \left| \begin{matrix}\vec{a} \\ \vec{b} \\ \vec{c}\end{matrix} \right| │$＝$│ \left| \begin{matrix}a_{1} & a_{2} & 0 \\ b_{1} & b_{2} & \sqrt{5} \\ 1 & 2 & 0\end{matrix} \right| │$＝$│ 0+0+\sqrt{5}a_{2}-0-0-2\sqrt{5}a_{1} │$＝$\sqrt{5} │ a_{2}-2a_{1} │$

    ＝$\sqrt{5} │ 2a_{1}-a_{2} │$

    故選(B)'
