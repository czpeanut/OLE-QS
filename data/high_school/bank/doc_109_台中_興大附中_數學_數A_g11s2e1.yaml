  stem: 空間中，設 P 點的坐標為（a，b，c），其中 a＞0，b＞0，c＞0。已知 P 點到 x、y、z 軸的距離分別為$\sqrt{130}$、$\sqrt{109}$、$\sqrt{221}$。請選出正確的選項。
  options:
  - label: A
    content: $a^{2}$＝100
  - label: B
    content: $b^{2}$＝81
  - label: C
    content: $c^{2}$＝121
  - label: D
    content: P 點到原點的距離為$\sqrt{302}$
  - label: E
    content: P 點坐標為（10，11，3）
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：P（a，b，c）到 x 軸的投影點為 $P_{1}$（a，0，0）

    P（a，b，c）到 y 軸的投影點為 $P_{2}$（0，b，0）

    P（a，b，c）到 z 軸的投影點為 $P_{3}$（0，0，c）

    ∴$\begin{cases}b^{2}+c^{2}=130 \cdots \cdots \cdots \cdots \cdots \cdots \cdots ① \\ a^{2}+c^{2}=109 \cdots \cdots \cdots \cdots \cdots \cdots \cdots ② \\ a^{2}+b^{2}=221 \cdots \cdots \cdots \cdots \cdots \cdots \cdots ③\end{cases}$

    由①＋②＋③ ∴2（$a^{2}$＋$b^{2}$＋$c^{2}$）＝460

    ∴$a^{2}$＋$b^{2}$＋$c^{2}$＝230 ……………④

    由④－①得 $a^{2}$＝100 ∴a＝10

    由④－②得 $b^{2}$＝121 ∴b＝11

    由④－③得 $c^{2}$＝9 ∴c＝3

    ∴$a^{2}$＝100

    (B)╳：承(A)，修正為 $b^{2}$＝121

    (C)╳：承(A)，修正為 $c^{2}$＝9

    (D)╳：承(A)

    ∵P（10，11，3），O（0，0，0）

    ∴$\overline{PO}$＝$\sqrt{(10-0)^{2}+(11-0)^{2}+(3-0)^{2}}$＝$\sqrt{100+121+9}$＝$\sqrt{230}$

    (E)○：由(A)知 P（10，11，3）

    故選(A)(E)'
