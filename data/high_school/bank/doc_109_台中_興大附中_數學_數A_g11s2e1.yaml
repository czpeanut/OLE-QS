- id: doc_109_台中_興大附中_數學_數A_g11s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設$\vec{a}$，$\vec{b}$為空間中兩個不平行的非零向量，且非零向量$\vec{c}$滿足$\vec{a}\perp \vec{c}$，$\vec{b}\perp \vec{c}$。請選出正確的選項。
  options:
  - label: A
    content: $\vec{a}\perp (\vec{a}\times \vec{b})$
  - label: B
    content: $\vec{c}// (\vec{a}\times \vec{b})$
  - label: C
    content: $\vec{a}\times \vec{b}-\vec{b}\times \vec{a}=\vec{0}$
  - label: D
    content: $(2\vec{a}+\vec{b}) \cdot (\vec{a}\times \vec{b})=0$
  - label: E
    content: 存在實數 t，使得$\vec{a}-2\vec{b}=t (\vec{a}\times \vec{b})$
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：令$\vec{a}$＝（$a_{1}$，$a_{2}$，$a_{3}$），$\vec{b}$＝（$b_{1}$，$b_{2}$，$b_{3}$），$\vec{c}$＝（$c_{1}$，$c_{2}$，$c_{3}$）

    $\vec{a}\times \vec{b}$＝（$a_{2}b_{3}$－$a_{3}b_{2}$，$a_{3}b_{1}$－$a_{1}b_{3}$，$a_{1}b_{2}$－$a_{2}b_{1}$）

    ∴$\vec{a} \cdot (\vec{a}\times \vec{b})$＝（$a_{1}$，$a_{2}$，$a_{3}$）．（$a_{2}b_{3}$－$a_{3}b_{2}$，$a_{3}b_{1}$－$a_{1}b_{3}$，$a_{1}b_{2}$－$a_{2}b_{1}$）

    ＝$a_{1}$（$a_{2}b_{3}$－$a_{3}b_{2}$）＋$a_{2}$（$a_{3}b_{1}$－$a_{1}b_{3}$）＋$a_{3}$（$a_{1}b_{2}$－$a_{2}b_{1}$）＝0

    ∴$\vec{a}\perp (\vec{a}\times \vec{b})$

    (B)○：∵$\vec{a}$⊥$\vec{c}$

    ∴0＝$\vec{a} \cdot \vec{c}$＝（$a_{1}$，$a_{2}$，$a_{3}$）．（$c_{1}$，$c_{2}$，$c_{3}$）＝$a_{1}c_{1}$＋$a_{2}c_{2}$＋$a_{3}c_{3}$ ……………①

    又$\vec{b}$⊥$\vec{c}$

    ∴0＝$\vec{b} \cdot \vec{c}$＝（$b_{1}$，$b_{2}$，$b_{3}$）．（$c_{1}$，$c_{2}$，$c_{3}$）＝$b_{1}c_{1}$＋$b_{2}c_{2}$＋$b_{3}c_{3}$ ……………②

    消去 $c_{3}$：由①×$b_{3}$－②×$a_{3}$ 得

    （$a_{1}b_{3}$－$a_{3}b_{1}$）$c_{1}$＋（$a_{2}b_{3}$－$a_{3}b_{2}$）$c_{2}$＝0

    ⇒（$a_{2}b_{3}$－$a_{3}b_{2}$）$c_{2}$＝（$a_{3}b_{1}$－$a_{1}b_{3}$）$c_{1}$

    ∴$c_{1}$：$c_{2}$＝（$a_{2}b_{3}$－$a_{3}b_{2}$）：（$a_{3}b_{1}$－$a_{1}b_{3}$）…………………………………………③

    消去 $c_{1}$：由①×$b_{1}$－②×$a_{1}$ 得

    （$a_{2}b_{1}$－$a_{1}b_{2}$）$c_{2}$＋（$a_{3}b_{1}$－$a_{1}b_{3}$）$c_{3}$＝0

    ⇒（$a_{3}b_{1}$－$a_{1}b_{3}$）$c_{3}$＝（$a_{1}b_{2}$－$a_{2}b_{1}$）$c_{2}$

    ∴$c_{2}$：$c_{3}$＝（$a_{3}b_{1}$－$a_{1}b_{3}$）：（$a_{1}b_{2}$－$a_{2}b_{1}$）…………………………………………④

    由③、④知： $c_{1}$：$c_{2}$：$c_{3}$＝（$a_{2}b_{3}$－$a_{3}b_{2}$）：（$a_{3}b_{1}$－$a_{1}b_{3}$）：（$a_{1}b_{2}$－$a_{2}b_{1}$）

    ∴$\vec{c}$//$(\vec{a}\times \vec{b})$

    (C)╳：∵$\vec{b}\times \vec{a}$＝（$a_{3}b_{2}$－$a_{2}b_{3}$，$a_{1}b_{3}$－$a_{3}b_{1}$，$a_{2}b_{1}$－$a_{1}b_{2}$）

    又$\vec{a}\times \vec{b}$＝（$a_{2}b_{3}$－$a_{3}b_{2}$，$a_{3}b_{1}$－$a_{1}b_{3}$，$a_{1}b_{2}$－$a_{2}b_{1}$） ∴$\vec{a}\times \vec{b}+\vec{b}\times \vec{a}=\vec{0}$

    (D)○：∵$\vec{a}\perp (\vec{a}\times \vec{b})$且$\vec{b}\perp (\vec{a}\times \vec{b})$

    ∴$\vec{a} \cdot (\vec{a}\times \vec{b})$＝0 且$\vec{b} \cdot (\vec{a}\times \vec{b})$＝0

    ∴$(2\vec{a}+\vec{b}) \cdot (\vec{a}\times \vec{b})$＝$2\vec{a} \cdot (\vec{a}\times \vec{b})+\vec{b} \cdot (\vec{a}\times \vec{b})$＝2×0＋0＝0

    (E)╳：∵$(\vec{a}-2\vec{b}) \cdot (\vec{a}\times \vec{b})=0$ ∴$(\vec{a}-2\vec{b})\perp (\vec{a}\times \vec{b})$

    ∴不存在實數 t，使得$\vec{a}-2\vec{b}$＝$t (\vec{a}\times \vec{b})$

    故選(A)(B)(D)'
