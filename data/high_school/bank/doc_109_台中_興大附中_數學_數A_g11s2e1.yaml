  answer:
  - $\sqrt{35}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$\overline{CD}$垂直平面 ABC ∴$\vec{CD}$垂直平面 ABC 上的所有向量

    ∴$\vec{CD}$⊥$\vec{BC}$且$\vec{CD}$⊥$\vec{AB}$ ∴$\vec{CD}$．$\vec{BC}$＝0 且$\vec{CD}$．$\vec{AB}$＝0

    ∵sin∠ABC＝$\frac{3}{5}$ 且 0°＜∠ABC＜90° ∴cos∠ABC＝$\frac{4}{5}$

    ∴$\overline{AD}^{2}$＝$│ \vec{AD} │ ^{2}$

    ＝$│ \vec{AB}+\vec{BC}+\vec{CD} │ ^{2}$

    ＝$│ \vec{AB} │ ^{2}+ │ \vec{BC} │ ^{2}+ │ \vec{CD} │ ^{2}+2(\vec{AB} \cdot \vec{BC}+\vec{AB} \cdot \vec{CD}+\vec{BC} \cdot \vec{CD})$

    ＝$5^{2}+5^{2}+5^{2}+2\times │ \vec{AB} │ \times │ \vec{BC} │ \times \cos (180^{^{\circ}}-\angle ABC)+0+0$

    ＝75＋2×5×5×（－cos∠ABC）

    ＝75－50×$\frac{4}{5}$

    ＝35

    ∴$\overline{AD}$＝$\sqrt{35}$'
