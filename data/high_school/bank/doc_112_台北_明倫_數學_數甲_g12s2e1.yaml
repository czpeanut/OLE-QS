- id: doc_112_台北_明倫_數學_數甲_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知 z＝$\frac{(- 4 + 3i)}{(2 -i) (1 + 2i)^{2}}$，則∣z∣$^{2}$ 之值為何？
  options:
  - label: A
    content: '5'
  - label: B
    content: '1'
  - label: C
    content: $\frac{1}{\sqrt{5}}$
  - label: D
    content: $\sqrt{5}$
  - label: E
    content: $\frac{1}{5}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∣z∣＝$\left| \frac{(- 4 + 3i)}{(2 -i) (1 + 2i)^{2}} \right|$

    ＝$\frac{∣ - 4 + 3i ∣}{∣ 2 -i ∣ \cdot ∣ 1 + 2i ∣^{2}}$

    ＝$\frac{5}{\sqrt{5}\times (\sqrt{5})^{2}}$＝$\frac{1}{\sqrt{5}}$

    $\Rightarrow$∣z∣$^{2}$＝$\frac{1}{5}$

    故選(E)'
- id: doc_112_台北_明倫_數學_數甲_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 如右圖，一雙曲線兩焦點 $F_{1}$，$F_{2}$，貫軸長為 10，A，B 為雙曲線上兩點，若$\overline{AB}$過 $F_{1}$ 且$\overline{AB}$＝8，試求△$ABF_{2}$ 的周長為下列何者？
  options:
  - label: A
    content: '36'
  - label: B
    content: '28'
  - label: C
    content: '32'
  - label: D
    content: '40'
  - label: E
    content: '45'
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_112_台北_明倫_數學_數甲_g12s2e1/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 432.4
      - 551.15
      - 564.3
      - 642.55
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '設$\overline{AF_{1}}$＝x，$\overline{BF_{1}}$＝8－x，其中$\overline{AF_{2}}$＞$\overline{AF_{1}}$，$\overline{BF_{2}}$＞$\overline{BF_{1}}$

    根據雙曲線的定義，$∣ \overline{AF_{2}} -x ∣$＝10，$∣ \overline{BF_{2}} -(8 -x) ∣$＝10

    $\Rightarrow\begin{cases}\overline{AF_{2}} -x = 10 \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots ① \\ \overline{BF_{2}} -(8 -x)= 10\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    ①＋②得$\overline{AF_{2}} + \overline{BF_{2}} = 28$

    ∴△$ABF_{2}$ 的周長為 28＋8＝36

    故選(A)'
- id: doc_112_台北_明倫_數學_數甲_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 設 a，b 均為實數，若$\frac{1}{4 - 3i}+\frac{3}{a +bi}= 1$，則 a＋b＝？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{1}{4 - 3i}+\frac{3}{a +bi}= 1$

    $\Rightarrow\frac{(a +bi)+ 3 (4 - 3i)}{(4 - 3i) (a +bi)}= 1$

    $\Rightarrow\frac{(a + 12)+(b - 9)i}{(4a + 3b)+(- 3a + 4b)i}= 1$

    $\Rightarrow$（a＋12）＋（b－9）i＝（4a＋3b）＋（－3a＋4b）i

    $\Rightarrow\begin{cases}a + 12 = 4a + 3b \cdots \cdots \cdots \cdots \cdots ① \\ b - 9 =- 3a + 4b\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    整理①式可得 a＋b＝4

    故選(D)'
- id: doc_112_台北_明倫_數學_數甲_g12s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 關於拋物線 $y^{2}$－4y－3x－5＝0，下列何者正確？
  options:
  - label: A
    content: 頂點（2，－3）
  - label: B
    content: 焦點$\left( -\frac{9}{4} , 2 \right)$
  - label: C
    content: 焦點$\left( \frac{11}{4} , - 3 \right)$
  - label: D
    content: 準線 x＝$-\frac{15}{4}$
  - label: E
    content: 準線 x＝$\frac{1}{4}$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '拋物線 $y^{2}$－4y－3x－5＝0

    $\Rightarrow$（y－2）$^{2}$＝3x＋5＋4＝3x＋9＝3（x＋3）＝$4 \cdot \frac{3}{4} (x + 3)$，可得$c =\frac{3}{4}$

    (A)╳：頂點為（－3，2）

    (B)○(C)╳：焦點為$\left( - 3 +\frac{3}{4} , 2 \right)$＝$\left( -\frac{9}{4} , 2 \right)$

    (D)○(E)╳：準線為 x＝$- 3 -\frac{3}{4}$＝$-\frac{15}{4}$

    故選(B)(D)'
- id: doc_112_台北_明倫_數學_數甲_g12s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 已知橢圓方程式為$\sqrt{x^{2} + y^{2}} + \sqrt{(x - 6)^{2} +(y - 8)^{2}}$＝16，則下列何者正確？
  options:
  - label: A
    content: 中心為（4，3）
  - label: B
    content: 長軸長為 16
  - label: C
    content: 長軸所在的直線方程式為 4x－3y＝0
  - label: D
    content: 短軸所在的直線方程式為 3x＋4y＝24
  - label: E
    content: 短軸長為 6
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '橢圓方程式$\sqrt{x^{2} + y^{2}} + \sqrt{(x - 6)^{2} +(y - 8)^{2}}$＝16

    可視為橢圓上一點 P（x，y），焦點為 $F_{1}$（0，0）、$F_{2}$（6，8）使得$\overline{PF_{1}} + \overline{PF_{2}}$＝16

    (A)╳：中心為 $F_{1}$（0，0）與 $F_{2}$（6，8）的中點$\left( \frac{0 + 6}{2} , \frac{0 + 8}{2} \right)$＝（3，4）

    (B)○：長軸長 2a＝16

    (C)○：∵長軸所在之直線斜率為$\frac{8-0}{6-0}=\frac{4}{3}$

    ∴長軸所在之直線方程式為$y =\frac{4}{3}x$

    $\Rightarrow$4x－3y＝0

    (D)╳：承(C) ∵短軸所在之直線斜率為$-\frac{3}{4}$，且其過中心（3，4）

    ∴短軸所在之直線方程式為 y－4＝$-\frac{3}{4} (x - 3)\Rightarrow$3x＋4y＝25

    (E)╳：∵2a＝16$\Rightarrow$a＝8，2c＝$\overline{F_{1}F_{2}}$＝10$\Rightarrow$c＝5 ∴b＝$\sqrt{8^{2} - 5^{2}}$＝$\sqrt{39}$，短軸長 2b＝$2\sqrt{39}$

    故選(B)(C)'
