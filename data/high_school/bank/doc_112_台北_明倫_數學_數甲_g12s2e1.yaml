- id: doc_112_台北_明倫_數學_數甲_g12s2e1_s2_5
  section: 2
  number: 5
  type: multiple
  page: 2
  stem: 關於方程式$\frac{(x - 2)^{2}}{k - 2}+\frac{(y + 1)^{2}}{6 -k}= 1$，選出正確的選項。
  options:
  - label: A
    content: 其圖形可能是一個圓
  - label: B
    content: 若 2＜k＜6，則其圖形必為橢圓
  - label: C
    content: 若 k＞6，則其圖形必為雙曲線
  - label: D
    content: 若 k＞4，則其圖形可能為橢圓
  - label: E
    content: 若其圖形為雙曲線，則中心到焦點的距離必為 2
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：當 k－2＝6－k$\Rightarrow$2k＝8$\Rightarrow$k＝4

    則其圖形為一圓

    (B)╳：當 k＝4 時，其圖形為一圓

    (C)○：當$\begin{cases}k - 2 > 0 \\ 6 -k < 0\end{cases}\Rightarrow\begin{cases}k > 2 \\ k > 6\end{cases}\Rightarrow$k＞6，其圖形為一雙曲線

    (D)○：當$\begin{cases}k - 2 > 0 \\ 6 -k > 0 \\ k - 2 > 6 -k\end{cases}\Rightarrow\begin{cases}k > 2 \\ k < 6 \\ k > 4\end{cases}\Rightarrow$4＜k＜6，其圖形為一橢圓

    ∴k＞4 時，有可能為橢圓

    (E)╳：若 k－2＜0，6－k＞0，此時中心到焦點的距離 c＝$\sqrt{8 - 2k}$

    不一定會等於 2

    故選(A)(C)(D)'
