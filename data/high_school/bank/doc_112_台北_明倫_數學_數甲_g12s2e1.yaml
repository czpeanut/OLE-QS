  answer_status: verified
  answer_source: answer_key
  explanation: '∵z 的虛部為 2 ∴b＝2

    而$\frac{1}{z}$＝$\frac{1}{a + 2i}\times \frac{a - 2i}{a - 2i}$＝$\frac{a - 2i}{a^{2} + 4}$＝$\left( \frac{a}{a^{2} + 4} \right) + \left( \frac{- 2}{a^{2} + 4} \right) i$

    ∵$\frac{1}{z}$的實部為$\frac{1}{4}$

    ∴$\frac{a}{a^{2} + 4}$＝$\frac{1}{4}$

    $\Rightarrowa^{2}$－4a＋4＝0

    $\Rightarrow$（a－2）$^{2}$＝0

    $\Rightarrow$a＝2

    故數對（a，b）＝（2，2）'
