- id: doc_112_台北_明倫_數學_數甲_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在複數平面上，滿足∣z＋i∣＋∣z＋5i∣＝4 的全體複數 z 形成什麼圖形？
  options:
  - label: A
    content: 點
  - label: B
    content: 直線
  - label: C
    content: 線段
  - label: D
    content: 圓
  - label: E
    content: 拋物線
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∣z＋i∣＋∣z＋5i∣＝4

    $\Rightarrow$∣z－（0－i）∣＋∣z－（0－5i）∣＝4

    令複數 z＝a＋bi 表 P（a，b），0－i 表 A（0，－1），0－5i 表 B（0，－5）

    原式可視為在複數平面上，$\overline{PA} + \overline{PB} = 4 = \overline{AB}$

    則 P 點所形成之圖形為一線段

    故選(C)'
