  stem: 滿足不等式$(\pi )^{x^{2} - 3x - 12}$＜$(\pi )^{2x - 6}$的整數解共有 n 個，下列選項何者正確？
  options:
  - label: A
    content: n＝3
  - label: B
    content: n＝4
  - label: C
    content: n＝5
  - label: D
    content: n＝6
  - label: E
    content: n 為無限多
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '∵π＞1

    ∴$\pi ^{x^{2} - 3x - 12}$＜π$^{2x－6}\Rightarrowx^{2}$－3x－12＜2x－6

    $\Rightarrowx^{2}$－5x－6＜0

    $\Rightarrow$（x－6）（x＋1）＜0

    $\Rightarrow$－1＜x＜6

    整數 x 有 0，1，2，3，4，5，共 6 個

    故選(D)'
