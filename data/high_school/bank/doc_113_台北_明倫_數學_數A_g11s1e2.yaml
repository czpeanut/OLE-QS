- id: doc_113_台北_明倫_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 關於對數律的使用，下列選項何者正確？
  options:
  - label: A
    content: log（－10）$^{4}$＝4
  - label: B
    content: （$log_{2}$5）$^{2}$＝2（$log_{2}$5）
  - label: C
    content: log（－2）＋log（－5）＝log〔（－2）×（－5）〕
  - label: D
    content: $\log \frac{3}{5}=\frac{\log 3}{\log 5}$
  - label: E
    content: $log_{27}$4×$log_{2}$9＝$log_{3}$2
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：log（－10）$^{4}$＝$log10^{4}$＝4

    (B)╳：（$log_{2}$5）$^{2}$＝（$log_{2}$5）×（$log_{2}$5）≠2 $log_{2}$5

    (C)╳：log（－2）和 log（－5）無意義

    (D)╳：$\log \frac{3}{5}$＝log3－log5≠$\frac{\log 3}{\log 5}$

    (E)╳：$log_{27}$4×$log_{2}$9＝$\frac{\log 4}{\log 27}\times \frac{\log 9}{\log 2}$＝$\frac{2\log 2}{3\log 3}\times \frac{2\log 3}{\log 2}$＝$\frac{4}{3}$≠$log_{3}$2

    故選(A)'
