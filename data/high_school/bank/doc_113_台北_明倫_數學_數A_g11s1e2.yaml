- id: doc_113_台北_明倫_數學_數A_g11s1e2_s3_4
  section: 3
  number: 4
  type: multiple
  page: 3
  stem: 設函數 f（x）＝b＋$2^{x＋a}$，其中 a，b 為實數且 a×b≠0，g（x）＝$2^{x}$，下列選項哪些正確？
  options:
  - label: A
    content: 若 a＞0 且 b＞0，則 y＝f（x）與 y＝g（x）兩函數圖形有交點
  - label: B
    content: 若 a＞0 且 b＜0，則 y＝f（x）與 y＝g（x）兩函數圖形有交點
  - label: C
    content: 若 a＜0 且 b＞0，則 y＝f（x）與 y＝g（x）兩函數圖形有交點
  - label: D
    content: 若 a＜0 且 b＜0，則 y＝f（x）與 y＝g（x）兩函數圖形有交點
  - label: E
    content: 不存在實數數對（a，b），使得 y＝f（x）與 y＝g（x）兩函數圖形交點個數等於或多於 2 個
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '討論 b＋$2^{x＋a}$＝$2^{x}$ 之解

    $\Rightarrow$b＋$2^{a}$．$2^{x}$＝$2^{x}$

    $\Rightarrow$b＝$2^{x}$（1－$2^{a}$）

    $\Rightarrow2^{x} =\frac{b}{1 - 2^{a}}$

    (A)╳：a＞0，b＞0，則 1－$2^{a}$＜1－$2^{0}$＝0

    $\Rightarrow2^{x} =\frac{b}{1 - 2^{a}}$＜0

    $\Rightarrow$x 無實數解，故兩函數沒有交點

    (B)○：a＞0，b＜0，則 1－$2^{a}$＜1－$2^{0}$＝0

    $\Rightarrow2^{x} =\frac{b}{1 - 2^{a}}$＞0

    $\Rightarrow$x 有實數解，故兩函數有交點

    (C)○：a＜0，b＞0，則 1－$2^{a}$＞1－$2^{0}$＝0

    $\Rightarrow2^{x} =\frac{b}{1 - 2^{a}}$＞0

    $\Rightarrow$x 有實數解，故兩函數有交點

    (D)╳：a＜0，b＜0，則 1－$2^{a}$＞1－$2^{0}$＝0

    $\Rightarrow2^{x} =\frac{b}{1 - 2^{a}}$＜0

    $\Rightarrow$x 無實數解，故兩函數沒有交點

    (E)○：∵$2^{x}$＝k 僅有一解，k 為任意正實數

    即當$\frac{b}{1 - 2^{a}}$＞0 時，$2^{x} =\frac{b}{1 - 2^{a}}$僅有一解

    $\Rightarrow$y＝f（x）與 y＝g（x）有一個交點

    當$\frac{b}{1 - 2^{a}}\leq$0 時，$2^{x} =\frac{b}{1 - 2^{a}}$無解

    $\Rightarrow$y＝f（x）與 y＝g（x）沒有交點

    ∴敘述為真

    故選(B)(C)(E)'
