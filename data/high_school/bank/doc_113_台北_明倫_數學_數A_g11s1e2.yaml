- id: doc_113_台北_明倫_數學_數A_g11s1e2_s2_8
  section: 2
  number: 8
  type: fill
  page: 2
  stem: '資訊熵是資訊理論中的一個核心概念，用來量化一個系統中的不確定性或平均資訊量。熵的計算公式如下：

    E＝－（$P_{1}$ $log_{2}P_{1}$＋$P_{2}$ $log_{2}P_{2}$＋……＋$P_{n}$ $log_{2}P_{n}$）

    其中 E 為該系統的資訊熵，$P_{k}$，1$\leq$k$\leq$n 代表系統中，全部 n 種狀況，所各自對應的機率。

    例如：在丟擲一均勻銅板實驗中，共有正面和反面 2 種狀態，正面機率$P_{1} =\frac{1}{2}$，反面機率$P_{2} =\frac{1}{2}$，則此系統之資訊熵 E＝$- \left( \frac{1}{2}\log _{2}\frac{1}{2}+\frac{1}{2}\log _{2}\frac{1}{2} \right)$＝1。

    現有一編碼問題有 A、B、C、D 共 4 種狀態，其相對應機率分別為

    $P_{A} = \left( \frac{1}{2} \right) ^{7 -k}$、$P_{B} = \left( \frac{1}{2} \right) ^{5 -\frac{k}{2}}$、$P_{C} = \left( \frac{1}{2} \right) ^{6 -\frac{k}{2}}$、$P_{D} = \left( \frac{1}{2} \right) ^{6 -\frac{k}{2}}$，則此編碼的資訊熵 E＝＿＿＿＿。'
  answer:
  - $\frac{7}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$P_{A}$＋$P_{B}$＋$P_{C}$＋$P_{D}$＝1

    ∴$\left( \frac{1}{2} \right) ^{7 -k}+ \left( \frac{1}{2} \right) ^{5 -\frac{k}{2}}+ \left( \frac{1}{2} \right) ^{6 -\frac{k}{2}}\times 2 = 1$

    $\Rightarrow\left( \frac{1}{2} \right) ^{7 -k}+ \left( \frac{1}{2} \right) ^{5 -\frac{k}{2}}+ \left( \frac{1}{2} \right) ^{5 -\frac{k}{2}}= 1\Rightarrow\left( \frac{1}{2} \right) ^{7 -k}+ 2\times \left( \frac{1}{2} \right) ^{5 -\frac{k}{2}}= 1\Rightarrow\left( \frac{1}{2} \right) ^{7 -k}+ \left( \frac{1}{2} \right) ^{4 -\frac{k}{2}}= 1$

    $\Rightarrow\left( \frac{1}{2} \right) ^{7}\times \left( \frac{1}{2} \right) ^{-k}+ \left( \frac{1}{2} \right) ^{4}\times \left( \frac{1}{2} \right) ^{-\frac{k}{2}}- 1 = 0\Rightarrow\left( \frac{1}{2} \right) ^{-k}+ 8\times \left( \frac{1}{2} \right) ^{-\frac{k}{2}}- 128 = 0$

    $\Rightarrow\left( \left( \frac{1}{2} \right) ^{-\frac{k}{2}}+ 16 \right) \left( \left( \frac{1}{2} \right) ^{-\frac{k}{2}}- 8 \right) = 0\Rightarrow\left( \frac{1}{2} \right) ^{-\frac{k}{2}}$＝－16（不合）或 8

    $\Rightarrow-\frac{k}{2}=- 3\Rightarrow$k＝6

    則 $P_{A}$＝$\left( \frac{1}{2} \right) ^{1}$＝$\frac{1}{2}$，$P_{B}$＝$\left( \frac{1}{2} \right) ^{2}$＝$\frac{1}{4}$，$P_{C}$＝$P_{D}$＝$\left( \frac{1}{2} \right) ^{3}$＝$\frac{1}{8}$

    故 E＝$- \left( \frac{1}{2}\log _{2}\frac{1}{2}+\frac{1}{4}\log _{2}\frac{1}{4}+\frac{1}{8}\log _{2}\frac{1}{8}+\frac{1}{8}\log _{2}\frac{1}{8} \right)$

    ＝$- \left( -\frac{1}{2}-\frac{1}{2}-\frac{3}{8}-\frac{3}{8} \right)$＝$\frac{7}{4}$'
