  stem: '將函數$f (x)= \left( \frac{1}{2} \right) ^{x}$的圖形依序做下列操作

    步驟 1：將 y＝f（x）的函數圖形對 y 軸做對稱，得到 y＝g（x）

    步驟 2：將 y＝g（x）的函數圖形對直線 y＝x 做對稱，得到 y＝h（x）

    步驟 3：將 y＝h（x）向上平移 1 單位再向左平移 5 單位，得到 y＝k（x），則：'
  options:
  - label: A
    content: k（x）＝1＋$log_{2}$（x－5）
  - label: B
    content: k（x）＝1＋$log_{2}$（x＋5）
  - label: C
    content: k（x）＝$1 +\log _{\frac{1}{2}} (x + 5)$
  - label: D
    content: k（x）＝1＋$2^{x＋5}$
  - label: E
    content: k（x）＝1－$2^{x＋5}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$f (x)= \left( \frac{1}{2} \right) ^{x}\xrightarrow{對 y 軸做對稱}g (x)= \left( \frac{1}{2} \right) ^{- x}$

    $\xrightarrow{對 y = x 做對稱}h (x)=-\log _{\frac{1}{2}}x$

    $\xrightarrow[向左平移 5 單位]{向上平移 1 單位}k (x)$＝$-\log _{\frac{1}{2}} (x + 5)+ 1$＝$1 +\log _{2} (x + 5)$

    故選(B)'
