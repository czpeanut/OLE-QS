  answer_status: verified
  answer_source: answer_key
  explanation: '$(\log _{3}x + 1)(\log _{\frac{1}{4}}x - 1)$＞0

    $\Rightarrow$（$log_{3}$x＋$log_{3}$3）（$log_{4}$x＋$log_{4}$4）＜0

    $\Rightarrow\left( \log _{3}x -\log _{3}\frac{1}{3} \right) \left( \log _{4}x -\log _{4}\frac{1}{4} \right)$＜0

    ∵$log_{3}$x＞$\log _{3}\frac{1}{3}\Leftrightarrow$x＞$\frac{1}{3}$

    $log_{4}$x＞$\log _{4}\frac{1}{4}\Leftrightarrow$x＞$\frac{1}{4}$

    ∴原不等式相當於考慮$\left( x -\frac{1}{3} \right) \left( x -\frac{1}{4} \right)$＜0

    $\Rightarrow\frac{1}{4}$＜x＜$\frac{1}{3}$'
