  stem: 東山高中舉辦大型的運動會，小楊老師是教師組的選手，參加的項目是丟擲鉛球的比賽，比賽項目有分成擲遠、擲高比賽，身為教授物理學科的小楊老師，利用物理學科斜向拋射的知識，成功打破了大會丟擲鉛球擲遠比賽最遠的紀錄 100 公尺，則此時小楊老師準備參加另外一個項目，丟擲鉛球高度的比賽，假設小楊老師已經恢復 100％ 力量，能使鉛球用與前項擲遠比賽相同的初速度向上拋射，請問小楊老師最高能拋多高呢？（假設小楊老師選擇最適當的仰角進行拋射）
