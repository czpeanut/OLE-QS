  answer_status: verified
  answer_source: answer_key
  explanation: '(A) B 球的水平速度分量為 v cosθ，小於 A 球水平方向速度 v，因此 B 球在水平方向上追不到 A 球。

    (B) B 球一開始有向上的初速，會先上升一段時間再下降，所以它在空中停留的時間會比較長。

    (C)(D) A 球的速度水平分量固定為 v，而鉛直分量因自由落體每秒增加 gt，則 A 球的速率 $v_{A}$＝$\sqrt{v^{2}+(gt)^{2}}$，可知 A 球的速率持續增大。

    B 球的速度水平分量固定為 v cosθ，而鉛直分量一開始是 v sinθ 向上，由於重力作用，鉛直分量逐漸減小，在最高點時鉛直分量為 0，最高點之後，鉛直分量會愈來愈大，因此 B 球會先變慢再變快。

    由此可推斷，A 球的速率始終比 B 球快。

    (E)兩球都只受重力作用，所以加速度量值與方向都相同，都是 g 向下。'
