- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e3_s2_26
  section: 2
  number: 26
  type: multiple
  page: 7
  stem: 某物體以 30 m∕s 的初速度水平拋出，則下列各敘述哪些正確？（重力加速度量值為 10 m∕$s^{2}$）
  options:
  - label: A
    content: 當 t＝5 s 時，物體的水平位移等於鉛直位移
  - label: B
    content: 在水平位移等於鉛直位移時，物體的水平速度量值與鉛直速度量值的比為 1：1
  - label: C
    content: 在水平位移等於鉛直位移時，物體的切向加速度量值為 4$\sqrt{5}$ m∕$s^{2}$
  - label: D
    content: 當 t＝5 s 時，物體的水平速度量值等於鉛直速度量值
  - label: E
    content: 在水平速度量值等於鉛直速度量值時，物體的水平位移量值與鉛直位移量值的比為 2：1
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)水平位移 x＝$v_{0}$×t＝30×5＝150（m）

    鉛直位移 y＝$\frac{1}{2}gt^{2}$＝$\frac{1}{2}$×10×$5^{2}$＝125（m）

    因此，當 t＝5 s 時，水平位移 x＝150 m 與鉛直位移 y＝125 m 不相等。

    (B)設某一時刻水平位移等於鉛直位移，即 x＝y。

    ⇒ $v_{0}$×t＝$\frac{1}{2}gt^{2}$

    ⇒ 30t＝$5t^{2}$

    ⇒ t＝6（s）

    鉛直速度 $v_{y}$＝g×t＝10×6＝60（m∕s）

    因此水平速度量值與鉛直速度量值的比例 $v_{x}$：$v_{y}$＝1：2。

    (C)承(B)解析，速度 v＝$\sqrt{v_{x}^{2}+v_{y}^{2}}$＝$\sqrt{30^{2}+60^{2}}$＝30$\sqrt{5}$（m∕s）

    切向加速度是重力加速度沿速度 v 方向的分量，即 $a_{T}$＝g cosθ，其中θ是重力加速度方向與瞬時速度方向的夾角。

    cosθ＝$\frac{v_{y}}{v}$＝$\frac{60}{30\sqrt{5}}$＝$\frac{2}{\sqrt{5}}$

    切向加速度 $a_{T}$＝10×$\frac{2}{\sqrt{5}}$＝4$\sqrt{5}$（m∕$s^{2}$）

    (D)當 t＝5 s 時，鉛直速度 $v_{y}$＝g×t＝10×5＝50（m∕s）

    所以 5 s 時，鉛直速度＝50 m∕s、水平速度＝30 m∕s，並不相等。

    (E)水平速度固定為 30 m∕s，鉛直速度為 $v_{y}$＝10t

    ⇒ 30＝10t

    ⇒ t＝3（s）

    水平位移 x＝30×3＝90（m）

    鉛直位移 y＝$\frac{1}{2}$×10×$3^{2}$＝45（m）

    ∴水平位移量值與鉛直位移量值的比為 2：1'
