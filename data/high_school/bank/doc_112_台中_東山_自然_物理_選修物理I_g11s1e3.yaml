- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小楊老師在一個高 60 m 的高臺上進行物理實驗，他自高臺上自由落下一石子（初速度為 0 m∕s），同時有一球自此高臺正下方以初速 20 m∕s 鉛直上拋，當兩物體在空中相遇瞬間，請問聰明的你可否計算出上拋球的速度為何？（假設不計空氣阻力，重力加速度 g＝10 m∕$s^{2}$）
  options:
  - label: A
    content: 5 m∕s 上升
  - label: B
    content: 5 m∕s 下降
  - label: C
    content: 10 m∕s 上升
  - label: D
    content: 10 m∕s 下降
  - label: E
    content: 無法在空中相遇
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設兩物體相遇的時刻為 t

    石子的位移 $S_{石}$＝$\frac{1}{2}gt^{2}$

    球的位移 $S_{球}$＝20t－$\frac{1}{2}gt^{2}$

    因為兩物體是在同一條直線上運動，高臺高度為 60 m，所以兩物體在空中相遇瞬間位移的總和為 60 m。

    $S_{石}$＋$S_{球}$＝60

    ⇒ $\frac{1}{2}gt^{2}$＋（20t－$\frac{1}{2}gt^{2}$）＝60

    ⇒ 20t＝60

    ⇒ t＝3（s）

    上拋球的速度 v＝$v_{0}$－gt＝20－10×3＝－10（m∕s），負號表示方向向下'
  tags:
    unit:
      code: PH-S1-2-3
