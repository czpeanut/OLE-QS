  explanation: '在最高點的時候，鉛直方向速度會變成 0，只剩下水平速度，因此小球最小速率就是水平速度 $v_{0x}$＝40 m∕s。

    $v_{0}^{2}$＝$v_{0x}^{2}$＋$v_{0y}^{2}$

    ⇒ $50^{2}$＝$40^{2}$＋$v_{0y}^{2}$

    ⇒ $v_{0y}$＝30（m∕s）

    $t_{上升}$＝$\frac{v_{0y}}{g}$＝$\frac{30}{10}$＝3（s）

    小球在空中飛行的時間 T＝$t_{上升}$×2＝3×2＝6（s）'
