  answer_source: answer_key
  explanation: '$v_{0x}$＝10 cos37°＝8（m∕s）

    $v_{0y}$＝10 sin37°＝6（m∕s）

    因為小球每移動 0.4 m 鉛直距離就上升 0.1 m，所以$\frac{x}{y}$＝4

    ⇒ $\frac{v_{0x}t}{v_{0y}t-\frac{1}{2}gt^{2}}$＝4 ⇒ $\frac{8t}{6t-5t^{2}}$＝4 ⇒ t＝$\frac{4}{5}$（s）

    x＝$v_{0x}$×t＝8×$\frac{4}{5}$＝6.4（m）

    ⇒ $\frac{6.4}{0.4}$＝16（階）

    從題幹說明知初始階梯為第 1 階，因此小球會落在 16＋1＝17（階）'
