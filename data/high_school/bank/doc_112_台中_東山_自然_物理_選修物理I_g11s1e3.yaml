- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e3_s2_24
  section: 2
  number: 24
  type: multiple
  page: 6
  stem: 小楊老師喜歡打電動遊戲，他在遊戲當中駕駛一臺轟炸機，此轟炸機距離水平地面高度為 500 m，並且以水平等速度 v＝125 m∕s 飛行，當 t＝0 s 時自轟炸機上釋放一號炸彈，隔 2 s 之後又讓二號炸彈落下，炸彈一號、炸彈二號脫離轟炸機時皆相對於飛機靜止落下，假設不計算空氣阻力，重力加速度量值為 10 m∕$s^{2}$。請問在下列敘述中，哪些是正確？
  options:
  - label: A
    content: 轟炸機內飛行員所觀測到炸彈一號在落地前，其運動軌跡為一個曲線
  - label: B
    content: 水平地面上靜止的觀察者所觀測到炸彈一號的運動軌跡為一段直線
  - label: C
    content: 在炸彈一號落地前，飛機內飛行員觀測到，炸彈一號在炸彈二號的正下方，兩炸彈距離不會維持固定
  - label: D
    content: 水平地面的觀察者，觀測到炸彈一號、炸彈二號分別在 t＝10 s 與 t＝12 s 時落地
  - label: E
    content: 炸彈一號、炸彈二號在地面上的著地點，兩點水平相距 250 m
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)在轟炸機內，飛行員跟炸彈有相同的水平速度，所以飛行員只會看到炸彈在鉛直方向自由落體，也就是直線往下掉，不是曲線。

    (B)水平地面觀察者觀測到，炸彈有初始水平速度，又受鉛直重力影響，所以運動軌跡是拋物線，不是直線。

    (C)在轟炸機內，飛行員會看到炸彈作自由落體運動，炸彈一號比炸彈二號早釋放，所以炸彈一號會一直在二號的下方，而且因為重力加速度的作用，兩炸彈的間距會隨著時間改變，變得愈來愈大。

    (D)炸彈一號自由落體時間 t

    ⇒ 500＝$v_{0}$t＋$\frac{1}{2}gt^{2}$ ⇒ t＝10（s）

    因此，炸彈一號的落地時間為 10 s，由於炸彈二號比炸彈一號晚 2 s 釋放，可推出炸彈二號在 t＝12 s 時落地。

    (E)兩炸彈釋放時間差是 2 s，飛機水平速度是 125 m∕s，等於炸彈水平速度

    水平相距 Δx＝125×2＝250（m）'
