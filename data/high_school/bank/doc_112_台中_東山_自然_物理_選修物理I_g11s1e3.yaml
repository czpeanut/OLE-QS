  stem: 在東山高中物理旗艦教室，小楊老師在做物體斜向拋射實驗模擬，若是定義起點為坐標原點（0，0），其斜向拋射物體軌跡方程式為以下：$x^{2}$－x＋y＝0（若是以 SI 制計算，重力加速度為 g＝10 m∕$s^{2}$），則請問各位同學，當此物體抵達最高點處時速率大小為多少 m∕s？
  options:
  - label: A
    content: '5'
  - label: B
    content: $\sqrt{10}$
  - label: C
    content: $\sqrt{5}$
  - label: D
    content: $\frac{10}{\sqrt{2}}$
  - label: E
    content: '10'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '斜向拋射的軌跡方程式 y＝（tanθ）x－$\frac{g}{2(v_{0}\cos \theta )^{2}}x^{2}$

    與題目的軌跡方程式 $x^{2}$－x＋y＝0 ⇒ y＝x－$x^{2}$ 比對

    可得

    物體達最高點的速率 $v_{x}$＝$v_{0}$ cosθ＝$\sqrt{10}$×$\frac{\sqrt{2}}{2}$＝$\sqrt{5}$（m∕s）'
