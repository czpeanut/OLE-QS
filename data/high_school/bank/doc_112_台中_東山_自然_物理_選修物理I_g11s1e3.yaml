- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 假設甲、乙、丙三向量同平面，甲向量長度為 10，方向東偏北 53°，乙向量長度為 4，方向正北方，而甲、乙、丙三向量和長度為 10，方向西，則請問丙向量長度、方向為下列何者？
  options:
  - label: A
    content: 長度為 15，方向正南方
  - label: B
    content: 長度為 20，方向西偏南 37°
  - label: C
    content: 長度為 15，方向西偏南 53°
  - label: D
    content: 長度為 16，方向正西方
  - label: E
    content: 長度為 12，方向南偏東 30°
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '甲向量：

    甲$_{x}$＝10 cos53°＝6、甲$_{y}$＝10 sin53°＝8

    乙向量：

    乙$_{x}$＝0、乙$_{y}$＝4

    甲、乙、丙向量和：

    和$_{x}$＝－10、和$_{y}$＝0

    所以丙向量：

    丙$_{x}$＝－16、丙$_{y}$＝－12

    丙向量的長度＝$\sqrt{(-16)^{2}+(-12)^{2}}$＝$\sqrt{400}$＝20

    丙向量的 tanθ＝$\frac{∣-12∣}{∣-16∣}$＝$\frac{3}{4}$ ⇒θ＝37°

    丙向量的 x 與 y 分量皆為負，表示方向位於第三象限，為西偏南 37°。'
  tags:
