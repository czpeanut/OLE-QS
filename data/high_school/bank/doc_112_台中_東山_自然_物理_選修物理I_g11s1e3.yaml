  stem: 將 A、B 兩小球同時從相同的塔頂拋出，A 以速度 v 水平拋出，B 以速度 v 斜向拋出，拋出仰角角度為θ，則
  options:
  - label: A
    content: 拋出後，B 球有段時間會在 A 物體之前（水平方向）
  - label: B
    content: 拋出後，B 物體比 A 物體晚落地
  - label: C
    content: 拋出後，在球落地前，任一時刻，A 球速度都比 B 球快
  - label: D
    content: 落地前瞬間，A 球的速率比 B 球慢
  - label: E
    content: 飛行的過程中，兩物體的加速度相同
