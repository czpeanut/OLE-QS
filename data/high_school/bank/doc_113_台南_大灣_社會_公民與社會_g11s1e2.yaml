  stem: 2023 年農曆年後，臺灣爆發缺蛋危機，行政院指出這主要是由於(甲)<u>禽流感和氣溫急遽下降，導致種雞供應不足</u>。專家還指出其他因素，如(乙)<u>俄烏戰爭導致原物料價格上漲和飼料價格上漲</u>。(丙)<u>部分民眾開始搶購和囤積雞蛋</u>，使臺灣的缺蛋問題更加嚴峻。政府為彌補國內蛋量缺口，在 3 月時(丁)<u>啟動專案進口雞蛋</u>，試圖緩解當前困境。然而，也有人對進口蛋提出質疑，指出由於缺乏冷藏設備，進口蛋品質堪憂。(戊)<u>許多網友也紛紛表示最近購買的進口蛋品質不佳</u>。這一消息使進口蛋成為民眾聞風色變的問題食品。在其他條件不變的情況下，前述劃線處，哪些會造成臺灣雞蛋市場的價格上升？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
