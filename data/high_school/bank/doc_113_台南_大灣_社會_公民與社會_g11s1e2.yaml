  stem: 無論是實體書店或網路書店，許多書籍通常都以折扣價出售，特別是新出版的書籍，經常有 79 折或 89 折的促銷標籤。然而，2023 年 3 月，臺灣多家出版社聯合呼籲文化部推動「圖書折扣秩序制」，要求限制圖書折扣幅度，例如新書在出版半年內最高只能打 9 折。若我國實施圖書折扣秩序制度，關於此制度對圖書市場的影響，下列敘述哪些正確？
  options:
  - label: A
    content: 將出現無謂損失
  - label: B
    content: 生產者剩餘增加
  - label: C
    content: 將出現超額需求
  - label: D
    content: 交易數量將減少
  - label: E
    content: 消費者剩餘減少
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 如果實施「圖書折扣秩序制」，其對圖書市場的影響可以分析如下：(A)價格限制會干預市場的自由運作，導致部分潛在的交易無法進行，從而產生無謂損失，為正解。(B)由於價格限制可能使書籍的售價提高，生產者（出版社和書商）能夠獲得更高的收益，但消費者不一定會去購買，使交易量下降，因此生產者剩餘不一定會增加。(C)折扣限制提高了新書的售價，價格上升通常會抑制需求，因此不會出現超額需求（超額需求通常出現在價格低於市場均衡時）。(D)價格提高會降低部分消費者的購買意願，導致交易數量減少，為正解。(E)由於新書價格提高，消費者需要支付更多金錢購買同樣的商品，消費者剩餘因此減少，為正解。
