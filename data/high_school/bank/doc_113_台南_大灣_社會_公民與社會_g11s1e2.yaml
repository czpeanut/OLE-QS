questions:
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 俄羅斯因攻打烏克蘭紛紛遭到國際經濟制裁與跨國企業的抵制，使得俄羅斯人民生活產生許多不便，能購買的物品與選項都大幅減少；這使得俄羅斯人民紛紛擔憂接下來的生活，反而大量購買基本生活用品，所以物價不斷攀升。對於此國際社會議題，下面何者正確？
  options:
  - label: A
    content: 小鄒：俄羅斯生活用品市場處於超額供給，所以人民需要花更多的錢才能買到東西
  - label: B
    content: 元亨：俄羅斯生活用品市場供給大幅減少，但人民需求減少幅度小於供給減少幅度
  - label: C
    content: 妮妮：這樣衝擊俄羅斯人民的消費，消費者剩餘相比攻打烏克蘭之前大幅增加
  - label: D
    content: 小夢：這樣衝擊俄羅斯人民的消費，以市場機能運作價格的調整達到市場均衡
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此應屬於超額需求的情形。(B)人民需求減少幅度大於供給減少幅度，因此價格大幅上漲。(C)生產者剩餘應是大幅減少。(D)依照市場機能運作將可使市場均衡，為正解。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 為延長嚴重特殊傳染性肺炎（COVID-19）期間，醫療用口罩的使用壽命，許多民眾開始搶購口罩套，湧入大量訂單的布莊業績大幅提升，但隨著投入的業者愈來愈多，口罩套的價格也因為競爭而下跌。請問口罩套的供給變動趨勢與何者相同？
  options:
  - label: A
    content: 篩檢嚴重特殊傳染性肺炎（COVID-19）病毒的快篩試劑研究成功可以迅速得知結果
  - label: B
    content: 連鎖飯店在疫情期間關閉部分樓層以減少人事及維護成本
  - label: C
    content: 蒜農預期蒜頭在疫情期間身價會再攀升故先存於自家倉庫
  - label: D
    content: 連鎖速食店為避免群聚感染暫時休業
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依照題文為需求增加，所引發之供給增加。(A)此為供給增加，與題文相同，為正解。(B)(C)(D)皆為減少供給。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '小珍開了一家冰淇淋店，她推出下列三種口味的商品，依據每項商品的售價、成本和平均每日銷售數量來看，請問何者是正確的說明？

    | 方案 | 售價 | 成本 | 每日銷售數量（球） | 營業額 |

    | --- | --- | --- | --- | --- |

    | 香草冰淇淋 | 35 | 10 | 90 | 3,150 |

    | 巧克力冰淇淋 | 40 | 12 | 80 | 3,200 |

    | 牛奶糖冰淇淋 | 45 | 15 | 70 | 3,150 |'
  options:
  - label: A
    content: 若以營業額來看，銷售牛奶糖冰淇淋所帶來效益最高
  - label: B
    content: 若以賺取利潤來看，銷售香草冰淇淋的機會成本最低
  - label: C
    content: 若以賺取利潤來看，銷售巧克力冰淇林帶來效益最高
  - label: D
    content: 就營業額和利潤來看，銷售香草冰淇淋機會成本最低
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 香草冰淇淋的利潤為 3,150－900＝2,250，機會成本為：3,200；巧克力冰淇淋的利潤為 3,200－960＝2,240，機會成本為：3,150；牛奶糖冰淇淋的利潤為 3,150－1,050＝2,100，機會成本為：3,200。(A)以營業額來看，應是銷售巧克力冰淇淋效益最高。(B)以賺取利潤而言，銷售香草冰淇淋的機會成本最低，為正解。(C)以賺取利潤而言，銷售香草冰淇淋的利潤最高。(D)以營業額來看，應是銷售巧克力冰淇淋效益最高；以賺取利潤而言，銷售香草冰淇淋的利潤最高。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 因新冠肺炎疫情影響，各國陸續採取封城措施，但此項措施引發民眾反彈。有人以堅定口吻說：「政府絕對不能封城，這樣我就會沒工作，很快就沒飯吃，雖然病死和餓死的結果都一樣，但我寧願是上班染疫病死，也不願沒工作餓死。」若以機會成本的觀念來評估，下列哪項政策最可能改變這位民眾的選擇？
  options:
  - label: A
    content: 調漲基本工資
  - label: B
    content: 提高職業災害補助
  - label: C
    content: 增加失業給付
  - label: D
    content: 擴大醫療保險給付
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 對該民眾而言，失業的機會成本太高，因此寧願染疫而不想要失業。換言之，增加失業給付可降低該民眾因封城失業而餓死的風險，減少他選擇上班染疫的機會成本，從而可能改變他的選擇，故選(C)。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 李媽媽在夜市租了一個店面開設小吃店，她由家裡搬來 1 套桌椅，並添購 5 套桌椅。每個週末，她在大學讀企業管理的兒子也會到店裡幫忙。請問下列李媽媽開店過程中相關生產要素的敘述，哪項是正確的？
  options:
  - label: A
    content: 所承租的店面屬於土地
  - label: B
    content: 由家裡搬來的桌椅屬於資本
  - label: C
    content: 李媽媽對小吃口味的更新屬於勞動
  - label: D
    content: 李媽媽的兒子週末付出的時間屬於企業能力
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)店面屬於資本。(B)生產設備為資本，為正解。(C)口味更新為企業才能。(D)兒子並非企業主，因此付出的時間屬於勞動。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 某連鎖蔬食餐廳即將在一個人口不多的小鎮開幕，試營運期間，每天下午 2、3 點餐廳門口的人潮依舊絡繹不絕，小鎮難得的景象引起當地媒體關注。下列取自記者採訪內容的敘述，何者最符合「需求法則」？
  options:
  - label: A
    content: 記者發現，店家試營運期間全部降價 20 元，可見店家的降價優惠吸引許多人光臨
  - label: B
    content: 店長表示，餐館進駐小鎮，希望能帶起小鎮居民食用蔬食的風潮
  - label: C
    content: 民眾李先生說，在這裡難得有連鎖餐廳，想來嚐鮮
  - label: D
    content: 民眾陳小姐提到，最近領到獎金，所以帶著家人到連鎖餐廳用餐
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 在其他條件不變下，當價格下降時，消費者會增加購買量；當價格上漲時，消費者會減少購買量，此即需求法則。僅有選項(A)提及價格變動，吸引需求量。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 安帥欲以 2,000 元的價格購買一個皮包送給女友結衣，一開始老闆堅持開價一個 3,600 元，在安帥不斷殺價之下，老闆最後終於答應以 2,000 元價格成交這個皮包，由此可得知下列敘述何者正確？
  options:
  - label: A
    content: 老闆最初開價 3,600 元是他願意且能夠接受的最高價格
  - label: B
    content: 安帥開價的 2,000 元是他願意支付的最低價格
  - label: C
    content: 在該筆買賣中，安帥並沒有任何消費者剩餘
  - label: D
    content: 安帥最終以 2,000 元成交，所以有 1,600 元的消費者剩餘
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)被消費者殺價成功，可見 3,600 元不是他最高的願售價格。(B)應是指願意支付的最高價格。(C)(D)安帥能接受的價格為 2,000 元，最後也以 2,000 元成交，依消費者剩餘＝消費者願付的最高價格－實際支付價格的差額，因此消費者剩餘為 0，(C)為正解。
