  group_stem: 從 2016 年底到 2018 年秋天，不到兩年，臺灣夾娃娃機從 2,300 臺暴增到逾 7,000 臺，根據學者分析，娃娃機在臺灣掀起風潮的原因，源自開店和營運成本均低，十幾架機臺本身加上監視器、兌換器等硬體設備，只需 60 ～ 70 萬，再加上無需人員看管，每個月的營業收入可達 100 萬，換言之，淨利可高達四成，投資回收速度快，上述理由使許多擁有資金的生產者將娃娃機作為投資標的，而為了分散風險，有許多店主的店鋪裡有數十架機器，但每一架機器都有不同的機主承租。而對於消費者來說，夾娃娃機抓住了臺灣現代人追求「小確幸」的消費傾向，隨著臺灣進入經濟的低增長時代，薪資增長幅度趨緩，消費者更喜歡在日常獲得小小幸福的低價消費，而夾娃娃機正好能滿足消費者此一心態。
