- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 交通部公路總局宣布自 2023 年 6 月 1 日起調整駕訓班小型車班、大客車班、貨車班、聯結車班、小型車附掛拖車班等 5 種訓練班的收費標準，將收費下限從 8,000 元至 9,000 元調整為 10,000 元，收費上限全國統一調整至 13,500 元。在其他條件不變的情況下，若 5 種訓練班的市場均衡價格為 16,000 元，下列敘述何者正確？
  options:
  - label: A
    content: 公路總局訂定的價格下限為無效的價格管制
  - label: B
    content: 公路總局訂定的價格上限為無效的價格管制
  - label: C
    content: 公路總局為保障駕訓班學員權益而訂定價格下限
  - label: D
    content: 公路總局為避免駕訓班過度競爭而訂定價格上限
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府訂定的收費下限低於市場均衡價格，此情形為無效的價格管制，為正解。(B)政府訂定的收費上限低於市場均衡價格為有效的價格管制。(C)保障學員的權益應制定價格上限。(D)避免過度競爭而制定價格下限。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 臺灣每到夏季颱風來臨前，新聞報導許多民眾開始囤貨，要應戰颱風季節！量販店業者表示，颱風前一天囤貨量，都會比平常多出 2 ～ 3 倍，尤其是葉菜類，颱風當天才會有菜可賣！據上述內容，假定其他條件不變，在民眾與廠商的預期心理之下，颱風前葉菜市場的供需均衡變動後，其均衡價格與數量為何？
  options:
  - label: A
    content: 均衡數量上升，均衡價格不一定
  - label: B
    content: 均衡價格上升，均衡數量不一定
  - label: C
    content: 均衡數量與價格均上升
  - label: D
    content: 均衡價格上升，均衡數量下降
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 需求方面：颱風來臨前，民眾的囤貨行為導致需求急劇增加，需求線右移。供給方面：颱風可能對農業生產造成破壞，廠商會預期供應受限，因此可能減少當前供貨量，供給線會左移。颱風前，由於需求增加和可能的供給減少，均衡價格必然上升，但均衡數量不一定，答案選(B)。
- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 4
  stem: 「社會住宅」不同於以往以低於市價賣給符合資格的民眾，而改以「只租不賣」的方式，以低於市場租金行情租給符合資格的民眾。然而某直轄市卻出現許多社會住宅的承租人，將社會住宅再加價出租的情形。請問關於上述情形的說明，以下何者較為正確？
  options:
  - label: A
    content: 租屋者以較高價格承租社會住宅使得消費者剩餘減少，為非理性行為
  - label: B
    content: 社會住宅承租人將社會住宅轉租他人所賺取的價差，即為消費者剩餘
  - label: C
    content: 社會住宅目的在保障居住權，承租人轉租行為將影響政府的政策無法落實
  - label: D
