  stem: 安安因工作原因未住在戶籍地。每逢選舉期間，為了回家投票，他需請一天假並搭乘高鐵回戶籍地。有許多人呼籲政府修法調整投票方式，使民眾能更方便行使投票權，即所謂的「不在籍投票」，例如允許公民在實際居住地附近投票。從經濟學的角度分析，下列敘述哪些正確？
  options:
  - label: A
    content: 投票日當天的薪水為安安投票的隱藏成本
  - label: B
    content: 搭乘高鐵的交通費為安安投票的外顯成本
  - label: C
    content: 採不在籍投票將增加安安投票的機會成本
  - label: D
    content: 投票日當天的薪水為安安投票的外顯成本
  - label: E
    content: 搭乘高鐵的交通費為安安投票的隱藏成本
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 機會成本概念包含外顯成本與隱藏成本。(A)隱藏成本指的是未被實際支付但因選擇某項行為而放棄的收益；安安因投票請假而無法獲得當日薪水，屬於隱藏成本，為正解。(B)外顯成本是需要實際支付的金錢成本，例如安安為了回戶籍地投票而支付的高鐵交通費，為正解。(C)不在籍投票可使投票更加方便，能減少安安投票的時間與金錢成本，因此機會成本應該降低，而非增加。(D)投票日當天的薪水為安安投票的隱藏成本，因為它是安安放棄的收入，而非實際支付的金錢，不能歸為外顯成本。(E)交通費是安安實際支付的金錢成本，應歸為外顯成本，而不是隱藏成本。
