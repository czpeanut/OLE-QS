  stem: 霧濛濛的空氣籠罩蒙古首都烏蘭巴托，為了度過寒冬，沒有暖氣設備的民眾燒煤炭取暖，連煤炭也買不起的民眾甚至燒廢棄輪胎，嚴重的空氣汙染讓幼小的孩童罹患呼吸道疾病，許多家庭將孩子送到空氣好的鄉下，以免空汙影響其健康。請問暖氣、煤炭、廢輪胎對消費者需求之敘述何者正確？
  options:
  - label: A
    content: 相對於暖氣設備，煤炭是正常財
  - label: B
    content: 相對於煤炭，廢棄輪胎是劣等財
  - label: C
    content: 所得影響民眾對暖氣設備的需求
  - label: D
    content: 消費偏好影響選擇暖氣或燒煤炭
  - label: E
    content: 煤炭對於所有人而言都是劣等財
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)煤炭相對於暖氣設備更可能被視為劣等財，因為當收入增加時，人們更傾向於選擇暖氣設備而非煤炭。(B)廢棄輪胎是一種低成本、低品質的取暖選擇，通常只有在收入極低時才會使用，因此相對於煤炭，廢棄輪胎被視為劣等財，為正解。(C)暖氣設備通常被視為正常財，當收入增加時，民眾對暖氣設備的需求也會增加，為正解。(D)除了價格和收入，消費者的偏好（如對清潔能源或舒適性的重視）也會影響選擇暖氣或煤炭，為正解。(E)煤炭是否是劣等財取決於特定群體的收入水準與消費選擇，對某些低收入家庭而言，煤炭可能是正常財，故非所有人都將其視為劣等財。
