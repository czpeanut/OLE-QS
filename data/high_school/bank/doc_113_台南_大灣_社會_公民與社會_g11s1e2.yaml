  - label: B
    content: 讓舉辦演唱會的公司蒙受損失，故違反公平性
  - label: C
    content: 只讓收入較高者獲得機會與資源，有違公平性
  - label: D
    content: 每位黃牛訂出的價格不同，彼此間不具公平性
  group_stem: 每當熱門演唱會或運動賽事開始售票時，總會出現一群人以各種方式取得大量票券，並以高於票面的金額轉售謀利，這些人俗稱「黃牛」。日前知名網紅拍攝紀錄片，報導黃牛票的產業鏈，全臺市場占有率最高的黃牛票業者表示，販售黃牛票不虧錢的祕訣是「能預估市場」，否則很有可能血本無歸，不過業者同時也透露，<u>因立法院先後通過《文化創意產業發展法》及《運動產業發展條例》嚴懲黃牛票買賣，故未來將考慮放棄臺灣市場</u>。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 公平原則強調機會均等，而黃牛票的炒作往往使得原本能以合理價格購票的消費者，因價格過高而無法入場或買不到票，這被視為不公平，答案以(A)最適切。(B)此關注的是主辦方的利益，而不是消費者的公平權益，因此不完全是公平原則的論點。(C)這與公平原則的核心理念相反，因為公平原則通常指的是機會均等，而非讓高收入者優先獲取門票。(D)這涉及價格歧視或市場價格的不一致性，但並不直接與公平原則中的「機會均等」問題相關。
