- id: doc_113_台南_大灣_社會_公民與社會_g11s1e2_s2_35
  section: 2
  number: 35
  type: multiple
  page: 8
  stem: 天童某日在臉書上回憶起自己過去在法國旅遊的經歷：法國當地盛產葡萄酒，許多廠商都從事釀酒業。旅途最後一天，由於住宿的地方離車站很遠，交通不便，他在選擇花費 20 歐元但可以舒適地搭乘計程車，與可以省下一筆錢但須頂著烈陽步行到車站中，選擇了後者。走到了車站後，不巧遇到該班次停駛無法搭乘，導致運輸量不足，許多乘客皆無法上車。他一直等到了深夜，只好到鄰近旅館尋求住宿，原本打算花費 40 歐元的他，最後跟老闆協議下，以 30 歐元住宿一晚。根據以上選文，下列敘述哪些正確？
  options:
  - label: A
    content: 選擇步行到車站的機會成本是舒適地搭計程車，以及花費 20 歐元
  - label: B
    content: 法國當地之所以盛產葡萄酒，應是該地產酒具有比較利益所致
  - label: C
    content: 到了車站卻無法搭乘，故沒花到的票錢為天童的消費者剩餘
  - label: D
    content: 在老闆協議後入住的天童，當晚住宿的消費者剩餘為 10 歐元
  - label: E
    content: 由於車站當日停駛，乘客無法搭乘，故火車班次供給線右移，需求線左移
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)機會成本是因選擇某一行為而放棄的最好選擇的價值。在此情境中，天童選擇步行，機會成本應是他放棄搭乘計程車的舒適體驗，而不是 20 歐元的花費（因步行本身不花費金錢）。(B)比較利益理論解釋了為何某地專門生產特定商品。法國釀酒業發達，說明該地在釀酒方面相對於其他產業更具優勢（如氣候、土地條件、技術），為正解。(C)消費者剩餘是指消費者願意支付的最高價格與實際支付價格之間的差額。天童沒有花到票錢，但這並不構成消費者剩餘，因為他未獲得商品。(D)消費者剩餘是指願意支付的最高價格（40 歐元）與實際支付價格（30 歐元）之間的差額，為 10 歐元，為正解。(E)車站停駛意味供應量減少，供給線應向左移，而非右移；此外，需求線未必左移，因需求未變，只是無法滿足。
