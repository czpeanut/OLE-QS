  stem: 羅馬最大的成就是其法律系統。羅馬的法律概念主要有兩層，最上層是將正義與權利具體化的自然法，為羅馬法學家提出，成為了所有法律的最高原則，第二層則是「民法」與「萬民法」，「民法」主要規範羅馬公民，「萬民法」則規範了其他民族。羅馬法學釐清了不少法律概念，例如契約不履行與侵權差異、占有與所有權的區別，所謂的合意概念亦是從「民法」中提出。有關羅馬的法律系統，下列何者正確？
  options:
  - label: A
    content: 羅馬法中做為最高指導原則的應是「民法」
  - label: B
    content: 「民法」與「萬民法」的差異在於階層不同
  - label: C
    content: 自然法的概念即延續《漢摩拉比法典》的法律條文而來
  - label: D
    content: 羅馬法律中的法學觀念影響了當代法律概念
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)羅馬法的最高指導原則是「自然法」。(B)「民法」規範羅馬公民，「萬民法」規範其他民族，兩者的差異在於民族不同。(C)自然法的概念受到斯多噶學派的影響。
