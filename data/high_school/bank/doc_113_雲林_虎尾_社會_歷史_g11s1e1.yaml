  stem: 亞述國王提格拉特帕拉沙爾一世如此描述自己：「宇宙無與倫比的國王，四個地區的國王，萬王之王，萬主之主，萬民之王的牧民……被沙瑪什（兩河流域的太陽神）給予神聖權杖，對人民有絕對的權威……燦爛的光輝籠罩了整個地區，壯麗的火焰像暴雨一樣籠罩著敵對的土地，我在神恩利爾（造成大洪水的神）的命令下，毫無敵手的擊敗了亞述神的敵人。」根據引文，下列解讀何者正確？
  options:
  - label: A
    content: 亞述國王認為勝利是源自於人民的支持
  - label: B
    content: 題幹可看出亞述國王懼怕神的思想
  - label: C
    content: 從題幹可知亞述國王認為自己受神命而統治
  - label: D
    content: 從題幹可知神懲處亞述國王發動戰爭
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)亞述國王認為勝利是源自於神的命令。(B)亞述國王奉神的命令行事，並非懼怕。(D)神命令亞述國王發動戰爭，並非懲處。
