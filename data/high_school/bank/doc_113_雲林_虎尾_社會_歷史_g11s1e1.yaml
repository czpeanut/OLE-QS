  stem: 「萬歲，尼羅河！你來到這片大地，平安地到來，給埃及以生命。你種植了拉神開墾的花園，永不停息地澆灌著大地……大水來了，快樂隨之到來！所有的心都很高興，他以氾濫滋潤了大地，快樂征服了人們。……尼羅河的洪水啊，我已為你備好了祭品，並磨刀走向公牛，舉行盛筵歡迎你。」請分析上文內容，判斷下列何者正確？
  options:
  - label: A
    content: 面對尼羅河的氾濫，埃及人也只能難過的接受災害
  - label: B
    content: 埃及人期望用祭祀的方式，阻止尼羅河持續氾濫
  - label: C
    content: 定期氾濫的尼羅河，提供埃及人肥沃的土地進行耕作
  - label: D
    content: 文中提及尼羅河「種植了拉神開墾的花園」，顯示古埃及人獨尊太陽神拉的一神信仰
  answer:
