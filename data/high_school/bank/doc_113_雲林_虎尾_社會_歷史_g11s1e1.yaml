  stem: '以下是有關古希臘時代雅典文化的兩則敘述：

    資料甲：人們家中都設有祭壇，城邦中到處可見神龕，衛城上神廟比比皆是。每個節日開始前要祭祀，前兆、凶兆和神諭會影響重大決定。準備遠行或店鋪開張等事務都要事先祈禱。

    資料乙：西元前 5 世紀後期，雅典出現一些稱為「辯士」（sophists）的教師，以教授辯論術為主，多從經驗角度考察宇宙，認為真理與人本身的需要或利益有關，沒有絕對真理。最有名的辯士普羅塔哥拉斯主張：「人是萬物的尺度」。惟辯士在當時社會的名聲不佳。

    對照甲、乙兩則資料，辯士在當時社會「名聲不佳」的原因最可能是'
  options:
  - label: A
    content: 教授雄辯論戰之術，不符合城邦民主的傳統
  - label: B
    content: 主張以人為準繩，牴觸凡事秉承神意之風氣
  - label: C
    content: 善於口舌之利，破壞了教師和思想家的形象
  - label: D
    content: 大多不事生產，無助於平民經濟生活的發展
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料甲敘述雅典的宗教文化，顯見當時人們非常重視神意，資料乙提到辯士強調真理與人本身的需要有關，甚至主張「人是萬物的尺度」，明顯與資料甲的宗教生活牴觸，此可能為辯士名聲不佳的原因，故選(B)。(A)雅典的民主傳統即是在街頭與人雄辯論戰。(C)雖然辯士善辯，但與教師、思想家的形象問題無直接關聯。(D)資料未提及經濟影響，且雅典社會接受各種專業人士。
