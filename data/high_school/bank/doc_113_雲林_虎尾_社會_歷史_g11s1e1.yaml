  stem: 「希臘與羅馬的文化在不少地方相似，例如希臘的宙斯與羅馬的朱彼特形象類似，甚至在羅馬神話中都可以找到希臘神話的影子。在羅馬的開國神話《埃涅阿斯記》中，可以發現它延續《伊里亞德》的故事，埃涅阿斯為愛神阿芙羅黛蒂的孩子，曾參加過特洛伊戰爭，並建立了羅馬城，成為羅馬的祖先。我們可以推知＿＿＿＿，所以兩者才會如此相似。」請問空白處應填入下列何者？
  options:
  - label: A
    content: 羅馬沿襲了希臘的神話與文化
  - label: B
    content: 羅馬人與希臘人系出同源
  - label: C
    content: 羅馬的文化影響了希臘文明
  - label: D
    content: 兩者皆受到基督教信仰影響
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從羅馬神話有希臘神話的影子、羅馬的祖先埃涅阿斯為希臘愛神阿芙羅黛蒂的孩子，可以推知羅馬沿襲了希臘的神話與文化，故選(A)。(B)神話傳說無法證實羅馬人與希臘人系出同源。(C)應是希臘文化影響了羅馬的文化。(D)題文所述與基督教信仰無關。
