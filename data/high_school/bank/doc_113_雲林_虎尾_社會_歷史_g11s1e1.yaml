  stem: 史家比較兩個古代民族的性格：這兩個民族雖屬同一語系，卻演變成迥異的民族。對甲民族而言，美的理想世界就是一切，因其可滿足現實生活缺乏的事物；這個民族的統合，是藉由藝術或遊樂的力量，如競技、祭神、悲劇等。乙民族為維護城邦的自由，寧可壓抑一己激情而服從父親，犧牲個人意志而服從國家。他們是古文明中唯一透過公民參政，完成政治整合者。這兩個民族分別是
  options:
  - label: A
    content: 商朝人與周朝人
  - label: B
    content: 猶太人與阿拉伯人
  - label: C
    content: 印度人與波斯人
  - label: D
    content: 希臘人與羅馬人
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 甲民族追求美的理想世界與藝術生活，應為希臘人；乙民族寧願犧牲個人意志而服從國家，應為羅馬人，其在共和時期曾多次整合貴族與平民的衝突，因此答案為(D)。
