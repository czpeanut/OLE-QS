    第一階段：自最初至西元前 1250 年左右，此時希伯來人在巴勒斯坦過著部落生活，和當地各部落一樣行多神信仰，山石草木皆為信仰對象，但有一主神，即 Yahven，乃火、雷、風、雨之神。

    第二階段：約當西元前 13 世紀至西元前 9 世紀，由信仰一神而不否認他神逐漸發展到僅崇信 Yahven，Yahven 降臨西奈山向摩西宣布〈十誡〉。這個時期 Yahven 是威不可測的上帝，如 Uzza 因不小心用手觸及約櫃（放〈十誡〉的木櫃）就使祂發怒而被擊死。此時希伯來人對 Yahven 究竟有什麼意義並不清楚。

    第三階段：約當西元前 8 世紀至 7 世紀，先知如以利亞、以賽亞等，他們努力講道，結果建立 Yahven 是唯一的神，其他民族的神是偽神的一神信仰。

    第四階段：約西元前 539 ～ 前 300 年，希伯來人吸收了一些瑣羅亞斯德信仰二元思想，有了撒旦觀念，也有了末日審判的思想，以及死後得救永生的信念。

    試從以上猶太教發展四階段，找出上古時代希伯來人思想上有何演變趨勢'
  options:
