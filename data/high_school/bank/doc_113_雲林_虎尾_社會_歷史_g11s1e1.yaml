- id: doc_113_雲林_虎尾_社會_歷史_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 「修昔底德陷阱」說法源自古希臘著名歷史學家修昔底德的觀點，這位歷史學家認為，當一個崛起的大國與既有的統治霸主競爭時，雙方面臨的危險，正如西元前 5 世紀希臘人面臨的情況一樣，這種挑戰多數以戰爭告終。西元前 5 世紀，甲城邦的急遽崛起震驚了乙城邦，雙方之間的威脅和反威脅引發長達 30 年的伯羅奔尼撒戰爭。請根據資料，判斷下列敘述何者正確？
  options:
  - label: A
    content: 乙城邦的崛起與波希戰爭後軍事擴張有關
  - label: B
    content: 乙城邦以民主政體著稱
  - label: C
    content: 甲城邦最後戰敗
  - label: D
    content: 甲城邦組成伯羅奔尼撒同盟
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '伯羅奔尼撒戰爭為希臘內戰，題文中急遽崛起的甲城邦為雅典，感到威脅震驚的乙城邦為斯巴達，因此正確答案為(C)。(A)應是甲城邦。(B)乙城邦以實施軍國主義著稱。(D)甲城邦組成提洛同盟。

    14.4 世紀末，狄奧多西一世正式宣布基督教為羅馬帝國的國教，並將異端視為非法，故選(B)。(A)題文中的「我」是指狄奧多西。(C)使基督教成為帝國的國教。(D)應是基督教開始迫害其他宗教。

    15.亨利四世之所以低頭，是因為教宗格列高里七世擁有開除教籍的權力，使亨利四世在政治上失去正當性，導致貴族反對他，威脅他的王位。因此，他不得不向教宗懺悔認錯，故選(C)。(A)「政教合作」並未成功，反而是衝突的表現。(B)「政教之爭」早在這之前就已經存在，而非「從此展開」。(D)「政教對抗」並未結束，亨利四世後來仍與教宗發生衝突。

    16.題文所述為《聖經》的「彼得磐石說」，耶穌將天國的鑰匙交給彼得，而彼得又是羅馬教會第一任主教，因此後人認為羅馬主教即保管天國鑰匙者，從而奠定了羅馬教宗的神學理論依據，故選(C)。

    17.題文資料表達查理曼願意保護羅馬教廷，並希望教宗為他祈禱與祝福。查理曼於西元 800 年受教宗加冕為「羅馬人的皇帝」，查理曼提供軍事保護與政治支持，教宗則賦予查理曼宗教上的正當性與神聖地位，象徵著法蘭克王國與教宗的互惠關係。(A)查士丁尼是拜占庭帝國皇帝，與教宗的關係不同，且時代不符。(C)這封信表現的是合作關係，而非統治者完全控制教會。(D)中古時期政教關係常有衝突，並非總是和諧。

    18.題文所述，上古希臘哲學家對自然界的見解儘管不同，但共同之處都是擺脫神話與宗教，以理性思辨來解釋世界的本質，故選(B)。(A)經過觀察與理性思辨的結果，並非任意猜測的想像。(C)這些哲學家皆用單一元素來解釋萬物。(D)上古希臘哲學最初源自小亞細亞的經濟富裕地區，並非自然環境艱困。

    19.(A)資料一的羅馬皇帝是尼祿。(B)《米蘭詔令》使基督教合法化，其內容是寬容基督教，而非「積極消滅教會」。(D)兩則資料皆是羅馬政府對基督教的迫害，並未轉為肯定。

    20.題文敘述指的是拜占庭帝國的聖像破壞運動，由皇帝發動，目的是透過廢除聖像來削弱教會內部勢力，特別是修道院的影響力，並進一步強化皇帝對宗教的掌控，故選(A)。(B)聖像破壞運動的主要對象是拜占庭帝國內部的基督教徒，而非境內異民族。(C)廢除帝國的聖像並無法削弱教宗的權威，況且皇帝本就是拜占庭帝國宗教的最高領袖。(D)聖像破壞運動與阿拉伯帝國的戰爭無關，主要是內部的宗教政策，而非為了戰爭而轉移注意力。

    21.教宗的「雙劍論」，指出王權和教權皆是上帝所賦予，但並未說明兩者的高低之別，可見其認為王權與教權應是相互依存，相輔相成。

    22.強調神與人之間為契約關係，因此宗教經典也以「約」字稱呼，可推知是信奉《舊約》的(C)猶太教。

    23.「亞維農之囚」為 14 世紀法王強迫羅馬教宗移駐亞維農的政教衝突事件，答案為(A)。(B)查理曼為 9 世紀的法王，曾被教宗加冕為「羅馬人的皇帝」。(C)教宗被囚期間，教廷也轉移至亞維農。(D)事件結束後，不久即發生羅馬與亞維農各自選出教宗對立的「大分裂」。

    24.(B)馬鈴薯與玉米為 16 世紀後自美洲傳入的新作物。(C)平民附著於莊園土地，幾乎無法離開。(D)莊園裡除了少數自由人，其餘是為領主服務的農奴，不可能向領主購買土地成為農場主人。

    25.(B)「羅馬皇帝」並非查理曼專屬稱呼。(C)(D)鄂圖一世與教會密切合作，應沒有打算將領土拓展至教宗國，或者推翻教會。

    26.資料甲指責基督徒蔑視羅馬傳統的神殿、神像、拜神的儀式等；資料乙希望喚醒基督徒不要拋棄祖宗的宗教與典禮。綜合兩者，可見羅馬人敵視基督徒的主要原因是背棄傳統宗教的態度，故選(B)。

    27.甲：此時的「耶和華」只是希伯來人的神，並非普世的神；丁：「耶和華」是上帝，與摩西位階並不相同。

    28.這幅畫作是義大利文藝復興時期畫家波提且利的名作《維納斯的誕生》（The Birth of Venus），它展現了文藝復興時期的藝術特色，包括對古典神話的再現、人體美學的追求，以及對自然與和諧的關注，故選(A)。

    29.佛羅倫斯為文藝復興的重鎮，麥第奇家族更是文藝復興的重要推手，因此答案為(C)。(A)文藝復興時期。(B)義大利半島。(D)宗教改革源自日耳曼地區，義大利一直是天主教的重鎮，柏拉圖學院不可能成為宗教改革的大本營。

    30.文藝復興強調人的價值、理性與現世生活，改變了過去只關心宗教與來世的觀念，故選(D)。(A)文藝復興確實受商業影響，但核心重點是思想與文化的變革，而非從商業角度來理解世界。(B)文藝復興強調人文主義，重視人的價值，不是單純為了理解神的偉大。(C)文藝復興主要復興的是古希臘、羅馬文化，而非中古時期的文化。

    31.(B)古騰堡於 15 世紀才發明活版印刷術。(C)當時的修士並非全面精通古希臘、羅馬學問，雖然修道院保存部分古典文獻，但深入研究與復興古希臘、羅馬學問的時期主要是文藝復興，而非查理曼時代。(D)題文著重的是教會與修道院在教育與學術上的功能，與日常情感交流無關。

    32.(A)經院哲學的重點在研究神學，並非保存古希臘典籍。(C)從「我們無法知道上帝是什麼」，可知人無法透過自行思辨方式來認識上帝。(D)其目的在更接近上帝，而增進人們對世界的認知，經院哲學並非為了「脫離迷信」。

    33.15 世紀活版印刷術出現之前，修道院和大學的修士、學者主要透過手抄書籍和講授來傳承文化與知識，故選(B)。(A)活版印刷術是在 15 世紀才發明，因此在 15 世紀以前不適用。(C)雖然口述傳承在部分民間故事或傳統文化中存在，但在學術和知識的傳播上，主要依靠書面記錄和講授。(D)文藝復興時期（15 世紀後），富商對藝術與知識的贊助與收藏變得更加盛行，而在此之前，知識的保存與傳播主要依靠修士和學者。

    34.資料一為奧古斯丁的《上帝之城》，資料二為阿奎那的《神學大全》，因此正確答案為(C)。(A)兩本著作的作者不同。(B)資料一完成於 5 世紀。(D)阿奎那為中古後期經院哲學的代表。

    35.從題文可知文藝復興與經濟商貿有關，加上義大利有許多古蹟、透過富商贊助並將羅馬文化發揚光大等，可推知(A)為正解。(B)活版印刷術確實促進文藝復興的擴散，但這僅解釋「文藝復興如何傳播」，而非「為何文藝復興起源於義大利」。(C)文藝復興主要得力於富商的贊助，並非人文學者的重建。(D)「基督教人文主義」更偏向北歐的發展，而非義大利文藝復興的主要特色，且義大利的文藝復興更多側重於古希臘羅馬文化，而非以基督教為主。

    36.(C)線性透視法是一種透視技法，透過使用消失點和收斂線，使畫面呈現出深度感。在《最後的晚餐》中，達文西利用天花板、牆壁、窗戶等結構線條，讓這些線條向畫面中心的耶穌匯聚，成功引導觀者的視線，並營造出立體空間感。

    37.在《十日談》中，薄伽丘批判的「他們」指的是修士，即教會中的神職人員。當時，許多修士貪圖享樂，沉溺於物質慾望，違背他們應有清貧與虔誠的信仰生活。因此，薄伽丘在作品中對教會的腐敗提出強烈批判，揭露修士的虛偽和墮落，反映出文藝復興時期人文主義對宗教權威的挑戰，故選(C)。

    38.(B)文藝復興重視人文主義，強調人的價值，而非單純強調神的偉大。(C)文藝復興恢復的是古希臘、古羅馬文化，而非保存中世紀文化。(D)文藝復興藝術追求理想與完美，並非描繪庸俗的現實生活。

    39.(A)經院哲學為中古後期大學的神學研究方法，並不受文藝復興人的重視。(C)「七藝」是中世紀教育的基礎，包括文法、修辭、邏輯、算術、幾何、音樂和天文，與文藝復興的教育理念不同。(D)依然尊崇上帝，並非無神論。

    40.1453 年，拜占庭帝國滅亡，大批學者逃往西歐，帶來大量希臘古典文獻，促成義大利文藝復興的發展，讓人文學者能接觸並研究古希臘文化，故選(B)。'
