  stem: 上古時某部作品流傳於同一地區不同民族之間。這部作品以主角為名，他企圖改變人終有一死的命運，但在經歷許多冒險與挑戰後，卻因一時疏失而喪失了永生不死的機會。這部作品透露出此文化認為命運無法改變的一面，勳業、名譽與成就均無助於永生。請問下列哪個選項最有可能為此一作品的內文？
  options:
  - label: A
    content: 「我雖然行過死蔭的幽谷，也不怕遭害。因為你與我同在。你的杖，你的竿，都安慰我」
  - label: B
    content: 認為宇宙初期有善惡兩種神，善神為阿胡拉．瑪茲達，意思為智慧之主、光明、生命、創造、善行、美德、秩序、真理的化身。惡神為安格拉曼鈕，是黑暗、死亡、破壞、謊言、惡行的化身。最後善神擊敗惡神，成為世界唯一存在的主宰
  - label: C
    content: 「你永遠不會找到你想要的生命。當神明創造人的時候，祂們給了他死亡，將生命留給自己……這是人所分到的命運」
  - label: D
    content: 「我認識你，我知道你的名字，以及那些與你同在正義的大廳中的四十二位神明的名字。他們以行惡者為食物，並且在奧塞利斯審查品行之時飲他們行惡者的血」
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 這部以主角為名，強調命運無法改變的悲觀想法作品，應為兩河流域的《吉爾伽美什史詩》，故選(C)。(A)出自《新約聖經》。(B)波斯祆教的善惡二元論。(D)出自埃及的《死者之書》。
