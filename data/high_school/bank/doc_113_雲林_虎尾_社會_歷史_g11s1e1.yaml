- id: doc_113_雲林_虎尾_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 古埃及原本屬於多神信仰，後來所有神逐漸被太陽神併吞，使「太陽崇拜」成為埃及信仰的主流。埃及人相信法老是太陽神在人間的代表。至新王國時期，太陽神名稱改變。然而不管名稱如何變化，法老都是太陽神之子，採行政教合一方式統治著全埃及。上述介紹中，欲表達的重點在於下列何者？
  options:
  - label: A
    content: 法老結合王權與神權，鞏固中央集權
  - label: B
    content: 從神祇的名稱變化可以看出王權興衰
  - label: C
    content: 法老順應主流信仰，改變自己的形象
  - label: D
    content: 統治者藉由統一信仰凝聚民族向心力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 法老從「太陽神在人間的代表」變成「太陽神之子」，顯見法老的神權地位上升，此亦有助於鞏固法老的政權，因此答案為(A)。(B)太陽神名稱改變，依然無損法老的地位，無法看出王權的興衰。(C)「太陽崇拜」一直是主流信仰，法老並無順應與改變的問題。(D)題文雖提到信仰統一，但重點在政教合一，而非單純凝聚民族。
