  type: single
  page: 1
  stem: '附表是某個地區的人口估計數字，這樣的人口變化最可能發生在哪個地區？

    |  | 白人 | 黑人＋混血 | 原住民 |

    | --- | --- | --- | --- |

    | 1490 年 | 0 | 0 | 50,000,000 |

    | 1570 年 | 138,000 | 共 260,000 | 9,700,000 |

    | 1650 年 | 725,000 | 815,000＋644,000 | 9,105,000 |

    | 1825 年 | 4,349,000 | 4,188,000＋6,252,000 | 8,211,300 |'
  options:
  - label: A
    content: 拉丁美洲
  - label: B
    content: 澳洲
  - label: C
    content: 南非
  - label: D
    content: 大洋洲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 這個地區在 1490 年的白人、黑人、混血兒的人數皆為 0，可知當地的原住民族並非白人或黑人，故(C)的原住民為黑人，可消去。(B)澳洲在 1570 年尚未被「發現」、(D)大洋洲面積很小，白人與黑人移入的人數不可能如此多，故而這個地區應是(A)拉丁美洲，在地理大發現後被西班牙、葡萄牙人殖民，造成當地印第安人大量死亡，因此殖民者自非洲引進大量黑奴。
