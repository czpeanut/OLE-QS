- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 英國人獲得選舉權是一個緩慢的過程，起先是僅有上層階級的貴族有選舉權，後來隨著工業革命的發展，中產階級崛起，他們因擁有一定的財產，對政府的影響力也較大，因此選舉權逐步擴大到中產階級。隨後，工業革命造成工人數量增加，但待遇卻十分糟糕，工人們相信獲得選舉權，是改善工人地位的最佳方法，因此工會運動時常以擴大選舉權為主軸，而工人們也成功在 19 世紀獲得選舉權。到了 19 世紀末期，因選舉權逐步擴大，成男普選正式實施，然而此時期女性因地位低弱、被認為不具有理性，而無法擁有選舉權。19 世紀到 20 世紀，英國參政權的發展有：(甲)鄉村的成年男子(乙)成年婦女(丙)中產階級(丁)大多數的城市勞工，他們獲得選舉權的先後次序是
  options:
  - label: A
    content: (丙)(乙)(甲)(丁)
  - label: B
    content: (丙)(丁)(甲)(乙)
  - label: C
    content: (丁)(丙)(乙)(甲)
  - label: D
    content: (乙)(丙)(丁)(甲)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 英國選民獲得選舉權的先後次序是(B)(丙) 1832 年→(丁) 1867 年→(甲) 1884 年→(乙) 1918 年後。
