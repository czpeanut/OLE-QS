- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某一位政治家在議會發表演說：「普魯士在德意志的地位，不取決於它的自由主義，而是取決於它的力量……普魯士必須集中力量，而且維持力量以待適當時機，這時機來臨了好幾次，也離開好幾次了。自從維也納諸條約以來，我們的邊界劃分得太差了，不利於健全政治。當代的重大問題不是通過演說和多數派決議所能解決的，而是要用鐵和血來解決！」根據上文，請問下列關於這場演說的解讀何者正確？
  options:
  - label: A
    content: 這名政治家是梅特涅首相
  - label: B
    content: 這名政治家滿意維也納會議的結果
  - label: C
    content: 演說主張用軍事手段建立民族國家
  - label: D
    content: 這名政治家的立場屬於激進主義
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '題文所述為俾斯麥所發表的「鐵血政策」演說，(C)為正解。(B)由「自從維也納諸條約以來，我們的邊界劃分得太差了，不利於健全政治」一段，可知其並不滿意維也納會議的結果。(D)俾斯麥的立場為民族主義，非激進主義。

    4.1848 年被稱為「歐洲革命年」，歐洲許多國家都受二月革命影響而發生革命，但多未成功，因此又稱「近代史上未能轉捩的轉捩點」，(A)為正解。(B)英國發生憲章運動。(C)比利時獨立係受七月革命影響。(D)二月革命並未使歐洲各國有民主化的改變。

    5.巴士底監獄、廢除封建制度、發表〈人權與公民權宣言〉、君主立憲等事，皆是法國大革命(B)國民會議時期的重大成就。

    6.(A)此雖是寓言故事，卻也反映當時英國的政治問題。(B)(C)諷刺並呈現英國的衰廢市鎮問題。

    7.(A)這份評論反對歐文主張，但也看不出其支持資本主義。(B)此份評論批評歐文的主張，因此不可能是歐文本人。(C)從「不會成功的試驗」可知這位學者並不贊成用和平方式解決社會問題。

    8.從「因為投資股票，一夜之間，家財全部化為烏有」，可推知這位美國商人應是受到 1929 年紐約股票崩盤的影響而破產，故而題文中的情景最可能發生在(C) 1932 年經濟蕭條時期的紐約。

    9.蒙兀兒帝國於(B)阿克拜在位時奠定帝國的統治結構，以中央直轄地方省區，並由中央掌控徵稅制度，避免地方勢力抬頭，使帝國進入盛世時期。

    10.阿茲特克有羽蛇神的傳說，當 16 世紀(C)西班牙人來到時，竟視其為羽蛇神降臨，導致政權迅速滅亡。

    11.(C)伊斯蘭帝國因為繼承權問題而導致帝國分裂：什葉派主張哈里發應由具穆罕默德血緣關係者繼承；素尼派強調領導者須能忠實遵守穆罕默德的行誼，並經由社群協商產生。

    12.(B)該地區為伊比利半島。(C)兩大信仰為基督教與伊斯蘭教。(D)最後滅掉格拉納達建立一統政權的是西班牙。

    13.題文建議將所有機械與技工皆集中在一地生產，此地即為「工廠」，(A)為正解。

    14.每年伊斯蘭曆的九月為齋戒月，身體健康的穆斯林必須不吃東西，甚至不喝水，是為(B)齋功。

    15.這份歷史文件的內容，不希望西歐諸國干涉已經宣布獨立的國家，可推知此為 1823 年的〈門羅宣言〉，(B)為正解。

    16.16 世紀，(B)鄂圖曼帝國主導地中海東部的商貿發展，在東西往來的交通要道上課徵稅收，阻礙西歐往地中海拓展經濟商路，促使歐洲諸國另尋前往東方的新航路，間接促成日後的大航海活動。

    17.11 世紀末，羅馬教宗烏爾班二世以「收復聖地、援助東方兄弟」為號召，得到世俗君主與貴族的支持，發起對伊斯蘭世界的「聖戰」，即(D)十字軍運動。(A) 16 世紀。(B) 8 ～ 15 世紀，西班牙戰勝伊斯蘭勢力的復國運動。(C) 9 世紀。

    18.工業革命後，歐、美各國逐漸走向工業資本主義，擴張商品市場及爭奪原料資源成為必然的趨勢，形成(B)新帝國主義，其競爭之激烈遠非過去舊帝國主義時代所能相比。

    19.從圖中可以看出在第一次世界大戰前，甲、乙、丙三國中，甲、丙為同一陣營，乙則為敵對陣營，選項中僅(C)塞爾維亞、奧國、俄國符合此一關係。(A)土耳其、俄國分屬不同陣營。(B)波蘭於一戰後才獨立。(D)德國、美國為不同陣營。

    20.從「保守的頑固分子」、「用暴力驅除自由主義」等線索，可推知此奧國的政治人物應為保守主義代表(D)梅特涅。

    21.鄂圖曼帝國於 16 世紀中葉國勢達到巔峰，但在 1683 年進逼(A)維也納時，被奧地利與波蘭聯軍擊退，結束帝國在歐洲的擴張，從此國力逐漸衰敗。

    22.(C)伊斯蘭教禁止偶像崇拜，因此也嚴禁描繪先知穆罕默德的形象，此漫畫不僅違反伊斯蘭教規，更有醜化、嘲諷之嫌，才會引起伊斯蘭世界的強烈不滿。(A)聖戰的原意即努力、奮鬥之意，此漫畫並無表達此意。(B)漫畫嘲諷伊斯蘭國家對世界發動恐怖攻擊。(D)《古蘭經》以阿拉伯文寫成，非希伯來文。

    23.從「擊退了一次侵略」、割讓土地以「答謝法國的幫助」，可得知義大利在統一的過程中，係採(D)軍事、外交手段並用。

    24.題文所述與圖中呈現的皆為 18 世紀法國的社會景象，階級分明且有種種不公平的現象，終於激起了大革命，(B)為正解。

    25.英國在七年戰爭中擊敗法國，但為解決戰爭造成的財政困難，轉而向北美殖民地立法開徵新稅，更加強管制北美的貿易，因此使殖民地人民不滿而發動抗爭，(A)為正解。

    26.泰姬馬哈陵的外觀融合了伊斯蘭、印度與波斯文化的特徵，可見得(A)蒙兀兒帝國融合了不同的文化特色，兼容並蓄。

    27.吉卜林的〈白種人的負擔〉要白人離開歐洲，擔起責任去「教化」有色人種的「奴隸」，明顯是為歐洲人的(C)帝國主義行為護航。

    28.(A) 16 世紀歐洲尚未工業革命，此時航海的目的是傳教與取得香料。(B)資料二說明新帝國主義的目的在工業原料。(C)從資料一到資料二的轉變與工業革命有關。

    29.阿拉伯人的天文學知識豐富，早期為沙漠商旅辨別方向之用，後來觀星則應用在(D)航海上。

    30.(A)英國治理印度各邦主要的差異在於是否提供英國大量的利益，再決定統治方式。(B)傳統文化較深厚的地區採取間接統治。(C)英國拉攏貴族並積極建設公共工程，以穩定印度政權。

    31.從布爾什維克、蘇維埃等名詞，可推知此政治人物應為主張馬克思主義的列寧，建立的新政權即蘇聯，(C)為正解。(D)退出一戰的是俄國，非法國。

    32.從「按照完全合乎憲法的方式把總理一職的重任委諸希特勒」一句，可知希特勒取得政權的方式是(B)發展政黨和平選舉方式，非依靠武力非法取得。

    33.(A)無限制潛水艇戰略為一次大戰之首見，非模仿任何國家的戰略。(B)「無限制」是指不分任何人民或政府的船隻，一律加以攻擊。(C)題文中無法判知此一訊息。

    34.國際聯盟的概念原是由美國所提出，但美國卻因國內盛行孤立主義而未加入，使得國際聯盟失去最大的支持，(C)為正解。

    35.此國家的人民渴望激進的變革，但又對共產黨式的革命懷有恐懼，最後走向激進的國家主義，即變成法西斯國家，因此為(D)義大利。

    36.(A)中南美洲各地紛紛興起獨立運動，並非反革命運動。(D)英國惟恐西班牙殖民地落入拿破崙之手，因此支持中南美洲的獨立運動。

    37.(A)資料一提到工業加工品使用來自遙遠地區的原料，可知此時已經工業革命，因此為新帝國主義國家的特色。(D)資料二的敘述看不出印度棉布品質較差，倒是英國採用各種手段打擊並進而取代印度的棉紡織業。

    38.(B)基督教內部新舊教彼此爭鬥發生於 16 世紀、(D)蒙古西征發生於 13 世紀，兩者與 7 世紀穆斯林的快速擴張無關。

    39.(B)半島人出生於伊比利半島。(C)半島人被派往拉丁美洲任職，擁有統治權。(D)非裔人士乃因地理大發現後的跨洲奴隸貿易。

    40.、41.圖文顯示將國王拖到斷頭臺當眾處決，群眾並高喊「共和國萬歲」，可推知此為法國大革命時期將國王路易十六處死。

    42.在路易十六一家逃亡失敗後，立法會議改組為國民公會，由雅各賓黨的羅伯斯比主導，通過共和體制的憲法，將路易十六送上斷頭臺。

    43.這個位於底格里斯河與幼發拉底河之間的城市應是巴格達，在此建立首都的政權為阿拔斯王朝。

    44.「哈里發」為伊斯蘭政權的統治者，因此其讚美的「上帝」指阿拉。

    45.甲己丙分別為英、法、俄，屬於協約國陣營；乙丁戊分別為德、奧、義，曾組成「三國同盟」。

    46.第一次大戰期間，俄國(丙)於 1917 年發生兩次革命，最後退出戰場。

    47.甲地提供奴隸，故為非洲；乙地提供武器與日用品給甲地、丙地，故為歐洲；丙地提供咖啡與菸草，故為美洲；丁地提供茶、絲綢與瓷器，故為亞洲。

    48.香料來自亞洲，因此答案為 C。A 為非洲的奴隸；B 為美洲的物產，可能為可可、白銀等；D 為歐洲與亞洲交易的商品，可能為白銀。'
