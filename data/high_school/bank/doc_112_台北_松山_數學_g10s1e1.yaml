  stem: 已知 a、b 為有理數，c 為無理數，且 d＝$\frac{1}{3}$a＋$\frac{2}{3}$b，將這四個相異數標在數線上，即 A（a）、B（b）、C（c）和 D（d）。試選出正確的選項。
  options:
  - label: A
    content: D 必在 A、B 之間
  - label: B
    content: abcd 必為無理數
  - label: C
    content: $\overline{AB}$＝3$\overline{BD}$
  - label: D
    content: $\overline{AC}$可能等於$\overline{AB}$
  - label: E
    content: 若｜d｜＝$\frac{1}{3}$｜a｜＋$\frac{2}{3}$｜b｜，則 a．b．d ≥ 0
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
