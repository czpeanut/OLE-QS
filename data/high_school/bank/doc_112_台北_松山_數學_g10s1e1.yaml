- id: doc_112_台北_松山_數學_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知 a＝$\frac{3+2\sqrt{5}}{5}$、b＝$\frac{3+4\sqrt{5}}{7}$、c＝$\frac{-1+4\sqrt{5}}{3}$，試選出 a，b，c 的大小關係。
  options:
  - label: A
    content: c＞b＞a
  - label: B
    content: a＞b＞c
  - label: C
    content: b＞c＞a
  - label: D
    content: c＞a＞b
  - label: E
    content: a＞c＞b
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_112_台北_松山_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 若 a＝$6^{\frac{1}{2}}$、b＝$9^{\frac{1}{3}}$、c＝$18^{\frac{1}{6}}$，試選出 a，b，c 的大小關係。
  options:
  - label: A
    content: c＞b＞a
  - label: B
    content: a＞b＞c
  - label: C
    content: b＞c＞a
  - label: D
    content: c＞a＞b
  - label: E
    content: a＞c＞b
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＝$6^{\frac{1}{2}}$＝$(6^{3})^{\frac{1}{6}}$＝$216^{\frac{1}{6}}$，b＝$9^{\frac{1}{3}}$＝$(9^{2})^{\frac{1}{6}}$＝$81^{\frac{1}{6}}$，c＝$18^{\frac{1}{6}}$

    由 216＞81＞18 ⇒$216^{\frac{1}{6}}$＞$81^{\frac{1}{6}}$＞$18^{\frac{1}{6}}$ ∴a＞b＞c

    故選(B)'
- id: doc_112_台北_松山_數學_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 若 a，b，c 皆為非零的實數，且已知 $4^{a}$＝$5^{b}$＝$10^{c}$，則$\frac{c}{a}+\frac{2c}{b}$之值為何？
  options:
  - label: A
    content: －1
  - label: B
    content: '0'
  - label: C
    content: '1'
  - label: D
    content: '2'
  - label: E
    content: log20
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}4^{a}= 10^{c} \\ 5^{b}= 10^{c}\end{cases}$⇒$\begin{cases}(2^{2})^{a}= 10^{c} \\ 5^{b}= 10^{c}\end{cases}$⇒$\begin{cases}2= 10^{\frac{c}{2a}}\cdots \cdots \cdots \cdots \cdots ① \\ 5= 10^{\frac{c}{b}} \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    ①×② 得 10＝$1{0^{\frac{c}{2a}}}^{+\frac{c}{b}}$⇒$\frac{c}{2a}+\frac{c}{b}$＝1 ∴$\frac{c}{a}+\frac{2c}{b}$＝2

    故選(D)'
- id: doc_112_台北_松山_數學_g10s1e1_s2_1
  section: 2
