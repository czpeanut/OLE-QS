  page: 1
  stem: '附圖即是地球大氣主要成分的變化，而甲、乙、丙、丁分別代表四種不同的氣體，其中二氧化碳隨時間逐漸減少，氮氣總量42億年來幾乎沒變，氧氣含量越來越多。請試著從圖片及上面文字描述中推測，下列選項說明何者正確？

    題組：附圖為甲、乙、丙、丁四種物種在地球上的分布範圍與生存期限之關係圖，橫軸愈右生存分布愈廣，縱軸愈上面生存地質年代愈新。請回答6～7題。'
  options:
  - label: A
    content: 甲為氫氣，因地球引力無法將之留住故逐漸飄散至太空
  - label: B
    content: 乙為二氧化碳，大部分已溶進海水中
  - label: C
    content: 由丙可判斷出42億年前的大氣濃度應該比現在的大
  - label: D
    content: 丁的出現，讓生物從20億年前大量登陸
  - label: E
    content: 甲、乙兩種氣體現在已完全不存在於大氣中
