- id: doc_111_台北_師大附中_社會_歷史_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 某文獻記載：「殆以昔之番情視番，抑知含濡帝澤，早已易心革面！熟番既與平民無異，且有讀書易漢姓者。生番亦漸化為熟番，以習漢人衣冠禮貌為榮。」請問對此文獻的理解，下列何者正確？
  options:
  - label: A
    content: 可見當時漢文化已完全取代高山族文化
  - label: B
    content: 此文獻敘述客觀，較能還原當時社會樣貌
  - label: C
    content: 為漢人中心觀點，具主觀尊卑意識
  - label: D
    content: 為原住民觀點，強調自身民族認同
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '文獻記載此時「熟番既與平民無異」、「生番亦漸化為熟番」，加上用「易心革面」來形容原住民的漢化情形，可見得此文獻乃以漢人中心的視角，視原住民文化為蠻荒，(C)為正解。

    10.1941 年為第二次世界大戰期間，臺灣屬於日本的殖民地，日本又與英國處於敵對陣營，因此楊樹木才會被馬來半島的殖民政府拘留，甚至在戰後被處死，(B)為正解。(D)楊樹木在獲釋後被要求擔任通譯工作，因此並非臺灣派出的高砂義勇隊身分。

    11.兩則資料為(D)布農族的神話與射耳祭習俗。

    12.題幹所述的社會型態為母系社會，選項中僅東部的(D)撒奇萊雅族相符。

    13.漢人大規模進入今苗栗頭份、南庄一帶，應始於清治時期，題幹提到「客家人被推舉為部落頭目」，顯見漢人並非以武力強勢取得政治權力，最有可能是原漢通婚、合作的結果，因此(C)為正解。

    14.(A)荷蘭人發布實施的制度。(B)盛行於臺灣南部。(D)贌社制度一直沿用到清治時期。

    15.臺灣原住民族在 16 世紀末並未建立統一的國家組織，即使是中部的「大肚王國」也僅是部落聯盟，因此日本使者自然找不到能呈遞文書的對象，(D)為正解。

    16.語言學家認為民族起源地的語言應最為複雜，根據近幾年的研究，(C)臺灣地區原住民族的語言多元而且分歧，因此部分學者認為臺灣應該是南島語族開始擴散的起源地。

    17.日治時期，官方除了鼓勵日本移民來臺開墾外，亦招募漢人至東部開墾，由於地形環境近似，大量來自桃竹苗地區的客家人移居東部的花蓮、臺東，使東部地區客家人口快速成長，答案選(A)。

    18.「莎韻之鐘」的故事發生於 1938 年，原本是一則泰雅族少女溺水的意外事故，1941 年在皇民化政策下，被臺灣總督府刻意渲染以宣傳理蕃政策的成功，成為當時的宣傳樣本，(B)為正解。

    19.清代自牡丹社事件後即對山區原住民改採「開山撫番」政策，在原住民村社建立學堂施以教化，乃「撫番」的重點要務之一，因此選(D)而不選(B)。題幹所述的楠仔腳蔓社學堂據考證為光緒 13 年所設立，雖未及週年即廢置，但因是清廷將教育體制推向後山的先聲，其遺跡仍具保存意義。

    20.荷蘭治臺期間，傳教重點在大員及其附近的村社，表中的村落歸順時間較早，在甘治士等傳教士的經營下，以棉布及衣服獎賞，因此信仰基督教的人數逐漸增多，尤其新港社最可觀，(D)為正解。(A)(C)由於這些村社皆為荷蘭控制區域，除新港社外，其他村社的歸順服從人數與繳納貢賦人數不可能如此少。(B)以新港社為例，就學兒童人數不可能與全村社人口數相同。

    21.臺灣的外籍配偶中，以中國、港澳籍最多，其次是越南，而後是印尼，故而圖中的甲為中國、港澳籍，乙為(B)越南籍。

    22.萬興宮媽祖廟建立在大甲西社亂事平定後；靈山廟於康熙晚期建廟時，亦有「諸番並集」。可見得兩則資料不單是在講漢人移民在臺建立媽祖信仰而已，還與原住民族的宗教漢化有關，(A)為正解。

    23.阿美族的女性擁有「家」的繼承權，但公共事務的「會所」卻是男性的主要活動場所，可見為「男主外，女主內」，但女性的地位顯然偏高一些，因此(A)為正解。

    24.家系和家業不分男女皆可繼承（長嗣繼承）的貴族制度，應為屏東的排灣族社會特徵，其位置為(D)丁。

    25.由軍隊移防臺灣，便可以「確保東南數省之安全」一句，可以推知這是(B)施琅攻臺後所上之〈恭陳臺灣棄留疏〉，其從國防的角度力勸清廷留下臺灣，之後果然成功說服康熙帝將臺灣納入版圖。

    26.從「今年得鹿實無幾」、「哪得盈寧畜妻子」等句，可知竹塹社民無論捕鹿或耕種，皆難以維生，加上鵲巢鳩居、鵲盡無巢的形容，可知漢人的侵墾已嚴重壓迫竹塹社民的生活空間，(D)為正解。

    27.(A)鄭氏時期人口增加，乃因清廷實施「遷界令」，造成沿海居民不得不隨鄭氏來臺求生。(C)「渡臺禁令」至光緒年間才廢止，乾隆時期至嘉慶時期的人口增加主要是因為偷渡來臺者眾。(D)此時依然有「渡臺禁令」，搬眷入臺的許可命令時禁時廢，非此時人口增加的主因。

    28.(A)清廷對原住民的保護政策無法發揮效果，甚至有官吏縱容剝削欺壓情事。(C)平埔族遷徙後山，對當地的開發有所助益。(D)未遷徙的平埔族群與漢人群居，逐漸融入同化於漢人社會，漢人文化亦受其影響。

    29.題幹提到村民幾乎都在從事「種族鬥爭」或作強盜，之後則形成一個個村莊，因此可推知此「種族鬥爭」應為早期的分類械鬥，包括閩粵械鬥、漳泉械鬥等，他們為了搶奪有限的資源，在慘烈的鬥爭後，敗者則離開另覓他處生活。選項中與分類械鬥相關的諺語為(C)。(A)談臺灣的土地信仰。(B)(D)談早期渡臺的艱辛。

    30.從原住民族群中人口最多、母系社會、分布在花東一帶等線索，可推知此原住民族為(B)阿美族。(A)分布在北部山區、(C)分布在中部山區，兩者皆為父系社會。(D)分部在南部山區，屬於偏父系的貴族社會。

    31.(A)兩者主要控制南臺灣，荷蘭政權對漢人賦稅甚重，鄭氏政權亦不輕，且都對原住民族採取剿撫兼施策略。(C)兩者皆未能完全控制臺灣海峽，也未在臺灣開港收稅。(D)漢人社會文化至鄭氏政權後才逐漸形成。

    32.泰雅族大豹社居住地區擁有豐富的樟腦資源，臺灣總督府開放讓大量業者入山開採樟腦，因此與當地原住民爆發衝突，經過多年的軍事鎮壓後，大豹社居民多被逼遷至今桃園復興一帶，(B)為正解。(A)設蕃童教育所不須將居民遷離。(C)未動用到高山族原住民。(D) 20 世紀初日本尚未對中國發動戰爭。

    33.表中連續五年移入臺灣的人口數都呈倍數成長，第五年甚至有高達 30 萬人來臺，因此最可能為國共內戰失利後，造成大批軍民遷移來臺的景象，(D)為正解。(A)鄭氏治臺時期，因為清廷的海禁與遷界令，隨鄭軍來臺的人口不可能逐年增加。(B)鄭氏末期至清治初期，清廷將臺灣有疑慮的人口遷回大陸並頒布「渡臺禁令」，雖然偷渡人口不斷，但不可能達到表中數據這麼多。(C)臺灣割日前後，由於反日情緒與風土病等問題，願移入臺灣的日本人並不多。故此三個時段皆不可能有大批人口移入臺灣。

    34.(A)早期的「理番同知」並未積極改善原住民族的生活環境，甚至還成為壓迫、剝削原住民族的幫凶。(C)第二次遷徙為中部平埔族遷往南投埔里盆地，第三次遷徙為噶瑪蘭族加禮宛社移居花東地區，皆非西部遷往東部。(D)大甲西社事件為中部平埔族原住民的抗官事件，非南部的西拉雅族。

    35.平埔族群因為長期與漢人接觸而逐漸融入漢人文化裡，保留的傳統文化與語言文字不多，考證不易，故而一直無法獲得政府單位的認可，(D)為正解。

    36.資料一提及平埔族群散居在臺灣各處濱海平原地區，易受外力衝擊；資料二說明噶瑪蘭族在 19 世紀前主要分布於蘭陽平原，言下之意，即是 19 世紀後噶瑪蘭族多已遷離蘭陽平原。綜合兩者，以(A)平埔族群尋根運動較為適宜。由於資料一與資料二僅提到臺灣的平埔族群，並未提及其他族群或地區的移動，因此不選(D)。

    37.根據西班牙人的記載，位於今日新北市金山、萬里一帶的(C)馬賽族與其他原住民族的維生方式不太相同。馬賽族擅長貿易，以海為路，是早期臺灣歷史中極具特色的原住民族。

    38.馬賽族的語言天分甚高，因此能很快學會西班牙語，(A)為正解。(B)南部部分西拉雅族的習俗。(C)(D)南部荷蘭統治區域的特徵。

    39.顏思齊被視為最早率眾來臺開墾者，在今日(A)雲林北港尚有一個「顏思齊先生開拓臺灣登陸紀念碑」。

    40.顏思齊為 17 世紀東亞知名的(B)海商領袖，曾率領彰泉貧苦人民先後渡臺，在魍港（今嘉義布袋附近）一帶開墾。'
