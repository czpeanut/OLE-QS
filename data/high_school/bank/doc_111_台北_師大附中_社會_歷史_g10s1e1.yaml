  stem: 「我們進入臺灣的時候，漢人並不歡迎，因此雙方未能建立友誼。漢人鼓動番人反對鹿皮、鹿肉、魚類的貿易統制。當地年產鹿皮二十萬張和許多鹿脯、乾魚，每年約有一百艘帆船從大陸開來，除從事捕魚外，並將鹿脯等物帶回大陸。」引文中的情形，下列敘述何者「不正確」？
  options:
  - label: A
    content: 「我們」進入臺灣不久後，又去占領巴達維亞
  - label: B
    content: 當時鹿是臺灣盛產的動物
  - label: C
    content: 「我們」是指荷蘭人
  - label: D
    content: 「我們」之後對漢人移民存有戒心，控制嚴密
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 文中的「我們」指荷蘭人，先占領巴達維亞作為東印度公司的總部，而後再往東亞各地建立貿易據點，包括臺灣，故(A)不正確。
