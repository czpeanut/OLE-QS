  stem: 《裨海紀遊》中有一段對平埔族群社會的描寫：「村落廬舍，各為向背。無市肆貿易，有金錢，無所用，故不知蓄積。雖有餘力，惟知計日而耕，秋成納稼；計終歲所食，有餘，則盡付麴蘗（釀酒用的發酵劑）；來年新禾既植，又盡以所餘釀酒。番人無男女皆嗜酒，酒熟，各攜所釀，聚男女酣飲，歌呼如沸，累三日夜不輟；餘粟既罄，雖飢不悔。」請問針對本文之說明，下列何者最恰當？
  options:
  - label: A
    content: 經濟活動以貿易為主
  - label: B
    content: 平埔族群喜於以米釀酒
  - label: C
    content: 由於收成豐盛，因此常可將餘糧儲存下來
  - label: D
    content: 釀酒目的是為了祭祖，不能私自飲用，否則會受到饑荒的懲罰
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由「無市肆貿易」、「計日而耕」可知其經濟活動以農耕為主。(C)文中提到「秋成納稼」與「新禾既植」後，有餘盡付釀酒，未將餘糧儲存下來。(D)作者認為「番人男女皆嗜酒」，但未提及釀酒的目的。
