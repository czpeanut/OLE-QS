  stem: 福建巡撫曾上疏言：「其立業在臺灣者，既不能棄其田園，又不能搬移眷屬，另娶番女，恐滋擾害。現在漢民已數十萬，其父母妻子身居內地者，正負不少。十年長養，凡向之孓身（隻身來臺），今已墾闢田園，足供俯仰矣！……若棄之而歸，則失謀生路；若置父母、妻子於不顧，更非人情所安。……故例禁雖嚴，而偷渡接踵。」請問該名福建巡撫上疏的討論議題應為下列何者？
  options:
