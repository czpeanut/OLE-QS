  stem: '資料一： 根據南島語言學者的研究，古南島語系民族是在亞洲大陸和侗傣語系民族分家之後，遷移到臺灣、大約過了一千多年才開始分化，向東南亞、南太平洋逐漸擴散，但後來又有小部分族群北上回到臺灣。更有學者進一步推測，臺灣的南島語族並非同時渡臺，而是至少分五批遷移：最早來的是泰雅族、鄒族，時間大約是距今六千五百年前；最晚的達悟族，在五百年前才從菲律賓的巴丹島移居。

    資料二： 約六、七千年前，有一群人由中國大陸東南沿海帶入了新石器時代文化，學者稱之為大坌坑文化。這個文化廣泛分布在臺灣全島（尤其是沿海）及澎湖，以繩紋陶為主要特色。約四千五百年前，以大坌坑文化為基礎，發展出繩紋紅陶文化，但是與大坌坑文化僅略有差異而已。兩者在文化內容上一直維持很高的同質性。

    根據上述資料，下列敘述何者正確？'
  options:
  - label: A
    content: 大坌坑文化可能是南島語族最早的祖先之一
  - label: B
    content: 可以確認泰雅族即是大坌坑文化的遺存
  - label: C
    content: 達悟族應是從中國大陸東南沿海移入臺灣
  - label: D
    content: 十三行文化應比達悟族更晚移入臺灣
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一提及「古南島語系民族是在亞洲大陸和侗傣語系民族分家之後，遷移到臺灣」，因此自中國大陸東南沿海進入臺灣的大坌坑文化，當然可能為南島語族最早的祖先之一，(A)為正解。(B)無法確定。(C)達悟族係從菲律賓的巴丹島移居。(D)十三行文化約自二千年前已形成，故比達悟族更早移入臺灣。
