  stem: '■ 目前生產的新冠肺炎快篩檢驗試劑，其檢測的準確率有其極限，仍有「偽陽性」與「偽陰性」的可能，已知受試者是否為帶原者與接受試劑檢測後的採檢結果關係如右表：

    | 受試者 採檢結果 | 帶原者 | 非帶原者 |

    | --- | --- | --- |

    | 陽性 | 真陽性 | 偽陽性 |

    | 陰性 | 偽陰性 | 真陰性 |

    (1) 現有一新的快篩試劑，檢驗帶原者時，有 90 ％的機率呈現陽性，檢驗非帶原者時，有 80 ％的機率呈現陰性，已知某地區約有 20 ％比例的人為帶原者，若對於此地區人民進行普篩，則檢測結果為「偽陽性」的比例為多少？

    答：＿＿＿＿。

    (2) 承(1)，若現有一民眾，第一次快篩結果為陰性而第二次快篩結果為陽性，則此人為帶原者的機率為多少？（答案請以最簡分數表示，未書寫計算過程者不給分）'
  options:
  - label: A
    content: '0.02'
  - label: B
    content: '0.16'
  - label: C
    content: '0.18'
  - label: D
    content: '0.64'
  tags:
    unit:
      code: MA-B4-2-2
      book: 數學4B
      chapter: 機率
      title: 貝氏定理
      std: true
    textbook: 數學4B 貝氏定理
    pattern:
      key: MA-B4-2-2:T08
      name: 多重檢驗與重複觀測貝氏更新
    labeled_by: agent
    label_confidence: high
    label_note: 第(2)小題為計算題，選項僅對應第(1)小題
    fixed_by: agent
    fix_note: （人工修正：補齊答案與兩小題之完整解析）
