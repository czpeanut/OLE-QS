    textbook: 數學4B 條件機率
    pattern:
      key: MA-B4-2-1:T11
      name: 獨立事件性質與乘法公式
    labeled_by: agent
    label_confidence: high
    label_note: 題幹與選項中 P(A)、P(B) 括號被誤切為選項標號
    fixed_by: agent
    fix_note: （人工修正：修正題幹與選項排版錯位，補齊答案與被截斷之解析）
  difficulty: 2
  answer_status: ai_generated
  answer_source: agent
  answer:
  - C
