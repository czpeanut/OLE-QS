- id: doc_109_新北_新店_數學_數B_g11s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若 A 與 B 為獨立事件，P
  options:
  - label: A
    content: ＝$\frac{1}{3}$，P（A∪B）＝$\frac{2}{3}$，則下列選項何者正確？(A) P
  - label: B
    content: ＝$\frac{1}{3}$(B) P（A∣B'）＝$\frac{2}{3}$
  - label: C
    content: P（A∩B）＝$\frac{1}{6}$
  - label: D
    content: P（A'∩B'）＝$\frac{4}{9}$
  explanation: '(A)╳：$\frac{2}{3}$＝P（A∪B）＝P(A)＋P(B)－P（A∩B）＝$\frac{1}{3}$＋P(B)－$\frac{1}{3}$×P(B)

    ∴$\frac{1}{3}$＝$\frac{2}{3}$P(B) ∴P(B)＝$\frac{1}{2}$

    (B)╳：P（A∣B''）＝$\frac{P (A\cap B'')}{P (B'')}$＝$\frac{P (A)\times P (B'')}{P (B'')}$＝P(A)＝$\frac{1}{3}$

    (C)○：P（A∩B）＝P(A)×P(B)＝$\frac{1}{3}$×$\frac{1}{2}$＝$\frac{1}{6}$

    (D)╳：P（A''∩B''）＝P（A''）×P（B''）＝（1－P(A)）×（1－P(B)）

    ＝$\left( 1 -\frac{1}{3} \right)$×$\left( 1 -\frac{1}{2} \right)$＝$\frac{2}{3}$×$\frac{1}{2}$＝$\frac{1}{3}$

    故選(C)'
- id: doc_109_新北_新店_數學_數B_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '將班上 40 位學生按照性別及是否戴眼鏡分類，可得如右的列聯表，則下列選項何者正確？

    | 是否戴眼鏡 性別 | 戴眼鏡 | 沒戴眼鏡 | 總和 |

    | --- | --- | --- | --- |

    | 男生 | a | b | 25 |

    | 女生 | c | 6 | e |

    | 總和 | 24 | d | 40 |'
  options:
  - label: A
    content: a＝10
  - label: B
    content: e＋d＝30
  - label: C
    content: 從班上抽出一學生，設 A 表示抽到男生的事件，B 表示抽到戴眼鏡者的事件，則 A 與 B 為獨立事件
  - label: D
    content: 從班上抽出一學生，已知此生有戴眼鏡，則他是男生的機率為$\frac{9}{24}$
- id: doc_109_新北_新店_數學_數B_g11s2e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: '設 A、B 為樣本空間 S 中的兩事件，已知 P(A)＝$\frac{1}{3}$，P(A∩B)＝$\frac{1}{6}$，P(A∪B)＝$\frac{5}{12}$，求下列各機率：

    (1) P(B)＝＿＿＿＿。

    (2) P(A∣B'')＝＿＿＿＿。'
  explanation: '(1) ∵P（A∪B）＝P(A)＋P(B)－P（A∩B）

    ∴$\frac{5}{12}$＝$\frac{1}{3}$＋P(B)－$\frac{1}{6}$

    ∴P(B)＝$\frac{5}{12}$＋$\frac{2}{12}$－$\frac{4}{12}$＝$\frac{3}{12}$＝$\frac{1}{4}$

    (2) P（A∣B''）＝$\frac{P (A\cap B'')}{P (B'')}$＝$\frac{P (A) - P (A\cap B)}{1 - P
    (B)}$＝$\frac{\frac{1}{3}-\frac{1}{6}}{1 -\frac{1}{4}}$＝$\frac{\frac{1}{6}}{\frac{3}{4}}$＝$\frac{4}{18}$＝$\frac{2}{9}$'
- id: doc_109_新北_新店_數學_數B_g11s2e2_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 某人練習罰球線投籃，每次投進的機率為$\frac{3}{4}$，且每次投進與否為獨立事件，今連續投籃 n 次，若欲使 n 次投籃中至少投進一次的機率大於
    0.999，則 n 的最小值為＿＿＿＿。
  explanation: '∵P（至少投進一次）＝1－P（全不中）＝1－$\left( 1 -\frac{3}{4} \right) ^{n}$＝1－$\left(
    \frac{1}{4} \right) ^{n}$＞0.999

    ∴0.001＞$\frac{1}{4^{n}}$ ∴$\frac{1}{1000}$＞$\frac{1}{4^{n}}$ ∴$4^{n}$＞1000

    $4^{4}$＝256，$4^{5}$＝1024＞1000 ∴n 的最小值為 5'
