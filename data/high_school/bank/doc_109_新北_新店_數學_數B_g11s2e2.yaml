  explanation: '(1) 偽陽性比例 $= P(\text{非帶原者})\times P(\text{陽性}\mid\text{非帶原者}) = (1-0.2)\times(1-0.8) = 0.8\times 0.2 = 0.16$，選 (B)。

    (2) 兩次採檢獨立，帶原者先陰後陽機率 $= 0.2\times 0.1\times 0.9 = 0.018$；非帶原者先陰後陽機率 $= 0.8\times 0.8\times 0.2 = 0.128$。由貝氏定理，所求條件機率 $= \frac{0.018}{0.018+0.128} = \frac{18}{146} = \frac{9}{73}$。'
