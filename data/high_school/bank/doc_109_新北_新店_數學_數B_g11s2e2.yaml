- id: doc_109_新北_新店_數學_數B_g11s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若 $A$ 與 $B$ 為獨立事件，$P(A)=\frac{1}{3}$，$P(A\cup B)=\frac{2}{3}$，則下列選項何者正確？
  options:
  - label: A
    content: $P(B) = \frac{1}{3}$
  - label: B
    content: $P(A\mid B') = \frac{2}{3}$
  - label: C
    content: $P(A\cap B) = \frac{1}{6}$
  - label: D
    content: $P(A'\cap B') = \frac{4}{9}$
  explanation: '(A) ×：$\frac{2}{3} = \frac{1}{3} + P(B) - \frac{1}{3}P(B) \Rightarrow P(B) = \frac{1}{2}$。

    (B) ×：$P(A\mid B'') = P(A) = \frac{1}{3}$。

    (C) ○：$P(A\cap B) = \frac{1}{3}\times\frac{1}{2} = \frac{1}{6}$。

    (D) ×：$P(A''\cap B'') = \frac{2}{3}\times\frac{1}{2} = \frac{1}{3}$。故選 (C)。'
  tags:
    unit:
      code: MA-B4-2-1
      book: 數學4B
      chapter: 機率
      title: 條件機率
