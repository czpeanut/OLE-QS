  stem: 日本殖民時期，官方和民間出現不少與臺灣教育議題相關的討論，學者在其中找到下列資料： 資料一：「臺灣教育是……同一國中不同民族的教育……臺灣人因語言、風俗、習慣仍異於日本人，故要求自初等教育起即與日本人共學、接受與日本人相同的教育是不合理的。必須先以數年時間熟諳日語、努力體會日本的國民精神。果能如此，未來必可實現共學。 資料二：「謀求中日親善是臺灣獨特的使命，因此臺灣教育的首要重點宜將地方特殊情況置於第一位，以機會均等的教育致力於新文化建設，實施與日本國內相同的義務教育，公學校特設漢文科，中學教授華語和漢文，以及現代法律和政治教育。」 以下對兩則資料的解讀，何者正確？
  options:
  - label: A
    content: 資料一的理論，是因在日俄戰爭後，日本證明比亞洲其他民族先進
  - label: B
    content: 資料一的主張出現後，開始積極推動日語教學和「國語家庭」政策
  - label: C
    content: 資料二的立場會支持臺灣人必須擁有與日本人相同的義務教育制度
  - label: D
    content: 資料二要對抗的是1940年代總督府以皇民化運動為主的統治方針
