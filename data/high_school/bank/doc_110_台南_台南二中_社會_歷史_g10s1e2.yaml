  stem: 蔣渭水為日本殖民時期重要的臺灣民主運動推進者，他曾在1923年的一次事件中為自己的作為留下答辯書：「我說：『我要感謝神明，使我生為臺灣人，因為臺灣人把握世界和平的鎖鑰，世界和平的第一關門，是東洋的和平，以中華民族做日本國民的臺灣人，應具有做日華親善的橋梁的使命，由臺灣人行使這個使命，東洋和平才能確保，世界人類的幸福才能完成。但是負有極大使命的臺灣人，現在患著可憐的病症，而無力可為。這個病是知識的營養不良症。文化協會為著根治臺灣人的病根而設法』。這樣的人設立的文化協會，那裡有危險的道理呢？」此次事件應為下列何者？
