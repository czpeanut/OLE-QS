  stem: 1950年代社論寫道：「盼望多時的本省地方自治，卒因本月五日行院通過臺灣省縣市地方自治綱要，而即將行了。……今日我們和中共的鬥爭，總結來說，無非就民主和極權的鬥爭。……反對極權，是我們對於中共鬥爭的中心，推而廣之，是世界對於共產主義者鬥爭的中心。拿臺灣來說，它是現在對抗中共的堡壘，如不能實行民主政治，我們便不容易勝利。……故我們必須培養自己光明的和道義的力量，而這個力量便是實行民主政治。」由此社論可知1950年代臺灣實行地方自治，除了落實民主之外還有何目的？
