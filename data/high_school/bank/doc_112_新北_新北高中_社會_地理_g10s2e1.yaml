  answer_status: verified
  answer_source: answer_key
  explanation: (C)圖中曲線從平緩到陡峭向上（斜率變大），代表世界人口總數自 20 世紀以來快速增加，代表人口倍數成長所需時間縮短，且從圖中開發中國家占比較大，得知開發中國家人口成長速度最高。圖中曲線自 2050 年後人口成長曲線雖稍平緩，但世界人口總數仍呈現緩步走揚的趨勢。(乙)圖中曲線僅呈現人口總數隨著時間成長，但並未呈現出生率的變化情形，故無法從此圖推論人口總數變化的原因。
