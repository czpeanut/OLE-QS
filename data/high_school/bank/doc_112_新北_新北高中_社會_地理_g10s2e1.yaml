  explanation: 全球交通技術革新及貿易增長後，各地貨物與人口往來更為便利、頻繁且密切，稱為(D)時空收斂現象，此亦使得傳染疾病隨之快速散播至全球各地。(A)「人口轉型」係指一地人口成長及結構隨著該地經濟、社會等條件的進步而呈現樣態的變遷。(B)「都巿成長」係指都市地區人口數量總額的變化。(C)「都市擴張」係指都市地區範圍隨著人口增加而往外圍拓展。
