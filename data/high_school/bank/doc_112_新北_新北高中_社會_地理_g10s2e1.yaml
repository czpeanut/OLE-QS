  page: 1
  stem: 貴州侗族的古歌謠：「祖公的地盤好比一條船，人太多了要翻船；一棵樹上一窩雀，多了一窩就挨餓。」以上歌詞涵義最接近下列何種概念？
  options:
  - label: A
    content: 人口轉型
  - label: B
    content: 生態平衡
  - label: C
    content: 人口遷移
  - label: D
    content: 環境負載力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)「人口轉型」係指一地人口成長及結構隨著該地經濟、社會等條件的進步而呈現樣態的變遷。(B)「生態平衡」係指一地動植物及環境和諧的互動關係，代表該地各生物體的存活與環境變化的穩定與永續發展。(C)「人口遷移」描述一地人口移入及移出的變化。(D)「環境負載力」係指單位環境系統得以供養生物數量的容納量，包括所提供的資源及可容納的汙染物。一旦超出該地容納量上限，便會造成饑荒或環境破壞的問題，呼應題幹所描述的現象。
