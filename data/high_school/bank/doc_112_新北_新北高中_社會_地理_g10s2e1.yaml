  stem: 右圖為世界人口成長曲線圖，下列哪幾項敘述可由此圖判斷？(甲)二次大戰後人口倍時迅速縮短(乙)出生率大幅增加是造成人口快速成長的主因(丙)二次大戰後開發中國家人口成長速度遠大於已開發國家(丁)世界人口總數仍在增加中
