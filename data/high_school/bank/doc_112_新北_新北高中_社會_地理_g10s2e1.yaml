- id: doc_112_新北_新北高中_社會_地理_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「臺北巿與新北巿雖然在行政分屬於兩個不同行政區，但其實是生活緊密結合的一個都會區（臺北都會區），臺北巿內多百貨公司、商辦大樓，新北巿多工業區及住宅，許多上班族每天通勤由新北巿到臺北巿上班，夜晚再返回新北巿住家，新北巿猶如臺北都會區的臥房。」此種都巿機能的分布及分工現象，適合用下列何種理論的觀點來說明？
  options:
  - label: A
    content: 區位租
  - label: B
    content: 中地理論
  - label: C
    content: 時空輻散
  - label: D
    content: 環境負載力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)區位租係指邱念提出一地選擇特定農作物時的利潤，其利潤會隨著與市場（亦指中心商業區）距離愈遠而下降。不同農作物的區位租不同，一地的農作物選擇，將以該地區位租（利潤）最高的農作物為準，此亦稱為「競租理論」。此理論不僅可以說明各種農作物的空間分布模式，亦可說明愈靠近市場的土地地價愈高的現象。題幹中所描述臺北市與新北市的分區土地利用模式，亦可應用區位租或競租理論來說明愈靠近中心商業區（臺北市）的土地利用為區位租較高的商業活動，該地地價、樓高與人口密度也會隨之較高。(B)中地理論係描述提供不同等級商品或服務的地點之空間分布模式，包括數量、服務範圍及相隔範圍等。(D)「環境負載力」係指單位環境系統得以供養生物數量的容納量，包括所提供的資源及可容納的汙染物。
  tags:
    unit:
      code: GE-2-3-1
      book: 地理2
      chapter: 都市
      title: 都市化與都市內部結構
      std: true
    textbook: 地理2 都市化與都市內部結構
    labeled_by: agent
    label_confidence: high
