  answer_status: verified
  answer_source: answer_key
  explanation: $\left| \begin{matrix}2+x & 2 & 2 \\ -3 & -3+x & -3 \\ 4 & 4 & 4+x\end{matrix} \right|$＞0 $\Rightarrow \left| \begin{matrix}3+x & 3+x & 3+x \\ -3 & -3+x & -3 \\ 4 & 4 & 4+x\end{matrix} \right|$＞0$\Rightarrow (3+x)\left| \begin{matrix}1 & 1 & 1 \\ -3 & -3+x & -3 \\ 4 & 4 & 4+x\end{matrix} \right|$＞0 $\Rightarrow (3+x)\left| \begin{matrix}1 & 0 & 0 \\ -3 & x & 0 \\ 4 & 0 & x\end{matrix} \right|$＞0$\Rightarrow (3+x)\left| \begin{matrix}x & 0 \\ 0 & x\end{matrix} \right|$＞0$\Rightarrowx^{2}$(3＋x)＞0， 得x＞－3，x≠0。
