- id: doc_111_新北_新店_數學_數A_g11s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 空間中，下列哪些方程式的圖形為一直線？
  options:
  - label: A
    content: x＝y＝z
  - label: B
    content: x＋y＝0
  - label: C
    content: $x^{2}$＋$y^{2}$＝0
  - label: D
    content: $\begin{cases}x+2y+z=2 \\ 3x+6y+3z=6\end{cases}$
  - label: E
    content: $\begin{cases}x-y=1 \\ x+y=0\end{cases}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：x＝y＝z表通過原點且方向向量為 ( 1 , 1 , 1 ) 的直線。 (B) ×：x＋y＝0表一平面。 (C) ○：$x^{2}$＋$y^{2}$＝0$\Rightarrow$x＝0，y＝0表z軸。 (D) ×：$\begin{cases}x+2y+z=2 \\ 3x+6y+3z=6\end{cases}$表兩平面重合為一平面。 (E) ○：$\begin{cases}x-y=1 \\ x+y=0\end{cases}\Rightarrowx=\frac{1}{2}$，$y=-\frac{1}{2}$，$z\in ℝ$表過點 ($\frac{1}{2}$,$-\frac{1}{2}$, 0 )，且方向向量為 ( 0 , 0 , 1 ) 的直線。 故選(A)(C)(E)。
  tags:
    unit:
