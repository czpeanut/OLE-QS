  answer_status: verified
  answer_source: answer_key
  explanation: 設A ( 2 , 0 , 0 ) , B ( 0 , 1 , 0 ) , C ( 0 , 0 , t )， 則$\vec{AB}$＝(－2 , 1 , 0 )，$\vec{AC}$＝(－2 , 0 , t )， 故平面之一法向量為$\vec{AB}$×$\vec{AC}$＝( t , 2t , 2 )， 取z軸的方向向量為$\vec{\ell}$＝( 0 , 0 , 1 )。 依題意知$\cos 30^{\circ}=\frac{(\vec{AB} \times \vec{AC}) \cdot \vec{\ell}}{| \vec{AB} \times \vec{AC} | |\vec{\ell}|}=\frac{2}{\sqrt{5t^{2}+4} \cdot 1}\Rightarrow \frac{\sqrt{3}}{2}=\frac{2}{\sqrt{5t^{2}+4}}\Rightarrow \frac{4}{5t^{2}+4}=\frac{3}{4}\Rightarrow$16＝$15t^{2}$＋12$\Rightarrow15t^{2}$＝4$\Rightarrowt^{2}$＝$\frac{4}{15}$， 得t＝$\pm \frac{2}{\sqrt{15}}$＝$\pm \frac{2\sqrt{15}}{15}$。
