- id: doc_112_屏東_屏東高中_社會_歷史_選修歷史II_g12s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: '資料一：「英國藝術家班克西，從 1990 年代初開始，即常於街頭、車站等地塗鴉，其作品往往引起轟動。學者指出，他的塗鴉作品經常以幽默的方式批判政治現實、戰爭迫害及資本主義。更重要的是，由於他不拘一格的創作手法，使原本處於邊緣的街頭塗鴉，開始受到藝術界主流的注意，學界甚至以『班克西效應』稱呼之。」

    資料二：「班克西創作出許多著名的作品，例如〈凝固汽油彈〉，以越戰時期遭美軍燒夷彈火焚的逃難女孩照片為底，左右兩手分別牽著米老鼠與麥當勞叔叔。有些學者認為，這幅作品足以代表班克西的藝術風格。」

    根據以上 2 則資料的討論，請問班克西的藝術風格可以用下列哪一句話形容？'
  options:
  - label: A
    content: 對古典藝術的揶揄
  - label: B
    content: 對全球化的讚揚
  - label: C
    content: 對當代霸權的反思
  - label: D
    content: 對次文化的鄙視
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 班克西的作品主要是批判政治現實、戰爭迫害及資本主義，因此對其藝術風格最適合的評論應是(C)對當代霸權的反思。(A)(B)題文中並未提及。(D)班克西的作品即屬於一種次文化表現。
  tags:
    unit:
      code: HI-S2-6-3
      book: 選修歷史II 科技、環境與藝術的歷史
