  stem: 曾經盛行的等身人像雕像藝術不再盛行，取而代之的是一種半立體的浮雕藝術，題材多是象徵十字架形狀的錨、鋤，或是象徵基督的魚、葡萄、棕櫚等植物，以及羊、鳩、鹿這些鳥獸，同時人物的形象也很少出現在藝術品當中。請問發生如此藝術轉變的主因為何？
