  stem: 中國藝術發展當中有著特有的文字藝術：書法。書法是從中國最古老的文字甲骨文逐漸演變而來，加上中國特有的筆墨紙硯，讓每個字都能成為藝術品，每筆勾勒，或圓滑、或勁疾，都能看出書寫者的心境。除了文字之外，隨著毛筆的使用方式不同，依墨色渲染、濃淡深淺不一而成為一幅幅意境悠遠的山水畫，在黑與白的世界當中，無論是失意、詠嘆、懷古或者意氣風發，千古多少文人皆寄情於此。請問根據題幹下列何者正確？
