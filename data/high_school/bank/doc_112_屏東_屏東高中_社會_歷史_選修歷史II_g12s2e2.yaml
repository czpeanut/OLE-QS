  stem: '資料一：「傳統戲曲的特色是以寫意手法模擬環境、情節，一桌二椅的布置，可以是峻山、高樓、房間，全視演員的身段唱詞決定。但到了電視歌仔戲開播後，開始走向寫實劇場，爬山遊街都要有實體布景，演員僅需唱、念，不需再注意身段表演。」

    資料二：「布袋戲又稱掌中戲，以操偶者能精巧控制劇偶的動作，模擬現實人物生活為特色。但到了民國 50 年代電視節目開播以後，布袋戲也搬上電視節目上映，更加重視聲光特效，乾冰、燈光、音響等設備大量使用，劇偶體積也加大，形成所謂『金光布袋戲』。」

    2 則資料為 2 位學者對於傳統戲曲現代化過程的討論，下列解讀何者正確？'
  options:
  - label: A
    content: 傳統戲曲的演出，完全不重視故事背景的展現
  - label: B
    content: 金光布袋戲的出現，可能與政府推廣傳統地方文化的政策有關
  - label: C
    content: 從傳統戲曲在電視上演出的經驗，可知戲曲演出與現代科技並不相容
  - label: D
    content: 傳統戲曲走向電視演出的過程，代表著傳統文化適應娛樂市場的取捨過程
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)亦重視故事背景的展現。(B)民國 50 年代的國語政策下，政府多打壓傳統地方文化。(C)「金光布袋戲」即傳統戲曲與現代科技相結合的結果。
