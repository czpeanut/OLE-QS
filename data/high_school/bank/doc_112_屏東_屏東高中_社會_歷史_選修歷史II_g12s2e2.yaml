- id: doc_112_屏東_屏東高中_社會_歷史_選修歷史II_g12s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '資料一：「在當代社會，紀念碑存在的價值日漸受到質疑，因為大眾對於紀念何人、如何紀念等問題見仁見智。20 世紀的藝術家歐登柏格對此提出了他的解法：他曾經在荷蘭的桑斯畢克公園，將一個巨型鏟子插入地表，就像是閃電打在地上一樣。所有經過這裡的遊客都不禁思考，這紀念碑究竟為何慶祝？何以其吸引力如此之大？但另一方面，這座紀念碑雖然帶有幽默感，卻完全不會使人感動，因為它就是一座專門為此時此地打造的作品。」

    資料二：「有些學者認為，歐登柏格的作品足以反映普普藝術的特色。普普藝術起源於 1960 年代，利用藝術創作，打破不同藝術品的高低位階之分，藝術家們將其作品大眾化、遊戲化，並且在創作過程中不帶入任何感情；換言之，作家在藝術品裡將自己退化到可有可無的狀態，卻又打破了觀眾對日常生活物品的既有想像。」

    根據以上 2 則資料與你的歷史知識，請問歐登伯格在桑斯畢克公園打造的紀念碑，其設計理念與時代背景為何？'
  options:
  - label: A
    content: 吸引大眾反思，反映二戰後社會階級消除的趨勢
  - label: B
    content: 增加公園特色，反映工業革命後大眾娛樂需求的增加
  - label: C
    content: 彰顯藝術家特色，反映 20 世紀個人本位價值的突出
  - label: D
    content: 顛覆既有藝術，反映當代西方美感教育的全面崩潰
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 歐登柏格為普普藝術的代表，打破藝術品的高低位階之分，其在桑斯畢克公園打造的紀念碑，亦是以嘲諷方式在提醒大眾反省紀念碑該紀念何人，因此(A)的解讀較適宜。(B)此紀念碑與大眾娛樂無關。(C)普普藝術強調大眾化，不追求個人本位價值。(D)當代西方美感教育並未全面崩潰。
