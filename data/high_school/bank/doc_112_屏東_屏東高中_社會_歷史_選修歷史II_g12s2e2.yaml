- id: doc_112_屏東_屏東高中_社會_歷史_選修歷史II_g12s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 希臘羅馬時代，西方主要的畫作題材是神話以及帝王的偉業。而基督宗教興盛之後，《聖經》故事則成為之後 1,000 多年間西洋藝術的重要題材。許多立體浮雕或者人物雕塑漸漸被具有宗教象徵的壁畫、鑲嵌藝術以及各式宗教用品所取代。比起美感，如何讓人們對宗教感到崇敬以及保持虔誠的心才是這個時期藝術作品所關注的課題，發展後來風格也往精緻華麗邁進。請問關於這段敘述下列何者正確？
  options:
  - label: A
    content: 西方藝術發展過程中，比起華麗性更加重視實用性
  - label: B
    content: 基督宗教的興起使西方藝術題材大幅度的轉變
  - label: C
    content: 基督宗教的題材當中，藝術是為了呈現帝國的奢華
  - label: D
    content: 西方主要藝術題材的轉變表示當時政治由宗教主導
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)早期藝術較偏實用性，後來都往精緻華麗邁進。(C)較關注如何使人們對宗教感到崇敬、保持虔誠之心。(D)大部分時間是政治權勢高於宗教。
