  section: 1
  number: 6
  type: single
  page: 1
  stem: BrDU是人工合成的核苷酸，可被細胞吸收並使用為DNA複製原料，過程中與腺嘌呤配對。四位同學甲〜丁依上述提出相關論述： 甲、BrDU是核苷酸，結構包括5碳醣、含氮鹼基與磷酸。
    乙、BrDU在有絲分裂過程中染色體排列於細胞中央時、被嵌入複製中的DNA。 丙、BrDU與腺嘌呤形成配對，故在細胞複製DNA時取代尿嘧啶。 丁、細胞完成某次分裂後給予BrDU，待再完成一次分裂後，則所有DNA只有單股含BrDU。
    何者為論述正確的同學？
  options:
  - label: A
    content: 甲、乙
  - label: B
    content: 乙、丙
  - label: C
    content: 乙、丁
  - label: D
    content: 甲、丁
  - label: E
    content: 甲、丙
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
