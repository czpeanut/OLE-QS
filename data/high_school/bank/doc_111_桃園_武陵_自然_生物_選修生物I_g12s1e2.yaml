- id: doc_111_桃園_武陵_自然_生物_選修生物I_g12s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列何者能將棉花種子內合成棉子酚的遺傳訊息從細胞核帶到細胞質？
  options:
  - label: A
    content: mRNA
  - label: B
    content: tRNA
  - label: C
    content: rRNA
  - label: D
    content: RNAi
  group_stem: ◎ 題組17-20題： 2006年諾貝爾生理醫學獎頒給研究線蟲的<u>美國</u>科學家A.Z.Fire和C.C.Mello，以表彰他們發現RNA干擾現象（RNA
    interference，簡稱RNAi）及技術。其原理是在基因表現的過程中，若某特定基因轉錄產生特定的mRNA時，在細胞質中出現可與此特定mRNA互補的某一小段RNA，並與之形成雙股的RNA，就會誘發酵素分解此雙股RNA，使得這個特定基因無法表現。
    根據這樣的原理，如果用人工方法在細胞質中，加入可和某特定mRNA互補的一小段RNA，就能明確地抑制某特定基因的表現，這種RNAi技術可應用於抑制腫瘤生長和病毒複製的研究上，也可用於「關掉」或「減弱」細胞內產生特定性狀之關鍵基因的表現。例如：棉花種子雖然含有極佳的蛋白質，不過我們不把棉花種子拿來當食物，因為種子中的棉子酚具有毒性。棉花的葉、莖、種子和花等都含有棉子酚，用來保護植株免受病蟲害的侵襲。植物學家曾經利用雜交式，成功地培育出不具棉子酚的品種，但因其極易受到病蟲害的侵襲，故無法大量培植。最近科學家利用RNAi技術，「減弱種子内特定基因的表現，使其棉子酚含量減少98％，但其他器官的含量不受影響，故棉花植株仍具有抵抗病蟲害的能力。依據上文和習得的知識，回答17-20題：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
