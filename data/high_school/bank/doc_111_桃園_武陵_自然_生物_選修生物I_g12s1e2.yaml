    content: 提供血友病患所缺乏的凝血因子蛋白
  - label: B
    content: 研究人類因某個基因缺陷所導致之遺傳疾病的治療方式
  - label: C
    content: 類似複製技術，此小鼠可以成為提供器官複製的工具
  - label: D
    content: 研究基因大量表現對胚胎發育所造成的影響
  group_stem: '<u>美國</u>的<u>卡沛奇</u>、<u>史密西斯</u>與<u>英國</u>的<u>伊凡斯</u>三位科學家因發明稱為「基因標的」（gene
    targeting），又稱「基因剔除」（gen knockout）的技術，獲頒2007年的諾貝爾生物醫學獎。科學家利用基因改造後的「基因剔除小鼠」，以關閉小鼠和人類共有的特定因。諾貝爾委員會指出，基因改造的小鼠提供研究人員一個實驗模型，藉以進一步了解阿兹海默症、癌症等疾病之發生過程，進而研發新的藥物。

    第一隻基因剔除小鼠於一九八九年宣布製成後，迄今已有一萬多組小鼠基因被標定剔除，這將近是小鼠基因總數量的一半。其實驗步驟的第一步是產生基因剔除的小鼠胚胎幹細胞，也就是將培養的小鼠胚胎幹細胞中的某個基因，在同源染色體上移除掉，之後再將基因剔除的胚胎幹細胞送入胚胞時期的胚胞腔，使之與胚胞中的胚胎幹細胞混合，之後再植入代理孕母的子宮中，待其出生後發育形成個體。
    要注意的是兩種胚胎幹細胞須選擇自不同品系的小鼠，以方便在小鼠出生之後觀察小鼠的特徵。若是選擇不同毛色的小鼠，生出來的老鼠就會因為胚胎幹細胞中混合了兩種不同器系小鼠細胞，因而發育後呈現出鑲嵌斑塊的毛色，我們稱此種小鼠為嵌合體（chimera）。嵌合體出現可證明植入的胚胎幹細胞已經成功進入小鼠了。接著將嵌合體互相交配，使其生出下一代的小鼠，就有機會獲得某一段標的基因被剔除的同型合子小鼠。
    在研究遺傳疾病的發生上，此技術是一種相當直接且威力十足的方法。基因剔除後的動物往往出現免疫功能低落、器官發育不全、心臓病、糖尿病等等症狀，更甚者于胚胎發育過程即死亡。他們的生死命運完全取決於被剔除基因在發育過程中的重要性而定，若是可以存活下來，即可成為生理學、病理學、藥理學的研究對象。因此基因剔除小鼠也被視為生物醫學最重要的實驗工具之一。
    委員會在頌詞中說：「對老鼠基因標的技術如今已廣泛應用在生物製藥的各個領域，拓展了人類對胚胎發展、人體生理學、老化和疾病方面許多相關基因的認識。這種技術在增進對基因功能的了解和造福人類方面的貢獻，在未來許多年仍將持續擴大。」。請依照上述內容回答問題：'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
