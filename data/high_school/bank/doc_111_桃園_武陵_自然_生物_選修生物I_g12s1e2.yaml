  stem: 有關CRISPR基因編輯技術的說明，下列敘述哪些正確？（多選）
  options:
  - label: A
    content: CRISPR、引導RNA及Cas9均為大分子，由相同的小分子單元組成
  - label: B
    content: CRISPR由雙股核苷酸鍵組成，引導RNA由單股核苷酸鏈組成
  - label: C
    content: 引導RNA的一部分序列可與任意病毒的部分DNA序列互補，另一部分序列則與Cas9結合
  - label: D
    content: Cas9與進行重組DNA技術時辨識雙股DNA序列並進行切割的酵素功能相似
  - label: E
    content: 應用CRISPR進行基因編輯時，可以較精準的辨識特定基因序列並將其剪斷
  group_stem: '大腸桿菌的基因體中有一段稱為CRISPR（clustered regulary interspaced short palindromic
    repeat）的DNA序列，當病毒入侵大腸桿菌並將其DNA注入大腸桿菌中，在大腸桿菌摧毀病毒DNA後，會將一段病毒的DNA序列插入CRISPR序列中。當病毒再次入侵時，大腸桿菌會透過CRISPR序列辨識病毒DNA，並產生一段稱為引導RNA的序列，接著與一種稱為Cas9的酵素合作將特定的病毒DNA序列剪斷，其作用過程如下圖。

    CRISPR技術將Cas9蛋白及引導RNA（gRNA）之複合體（Cas9-gRNA）送入細胞質，然後此複合體會再進入細胞核，由gRNA引導該複合體，找到可以與gRNA序列相配對的DNA進行配對。Cas9會在所配對的區域進行切割，造成該位置的DNA斷裂。細胞DNA修補機制會對斷裂的DNA進行修復，形成基因的核苷酸缺失或插入，因而導致DNA突變。
    相較於傳統基因改造技術（重组DNA與基因轉殖技術）用來進行農作物的改良，應用CRISPR進行基因編輯具有下列優點：尋找目標基因位置較為容易、Cas9酵素辨識率高，利用RNA和DNA互補的特性能夠精確辨識標的DNA序列、僅需合成特定的DNA或RNA序列更為省時、所需成本較低等。但此技術也可能具有下列問題：Cas9不一定能正確地切割標的位置、將引導RNA-Cas9送入細胞內的傳遞方法影響傳遞的成功率。但整體來說，CRISPR在農作物的育種上提供了一個更佳的選擇性。請依照上述內容回答下列問題：'
  shared_asset: g3_42_45
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
