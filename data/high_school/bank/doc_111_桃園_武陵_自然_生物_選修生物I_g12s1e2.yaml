- id: doc_111_桃園_武陵_自然_生物_選修生物I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某大腸桿菌噬菌體的A基因可分為Al－A6六個小段。一生物學家分離出此噬菌體A基因的四個缺失突變株：J突變株缺失A3、A4、A5三個小段，K突變株缺失A2、A3兩個小段，L突變株缺失A4、A5、A6三個小段，M突變株缺失A1、A2、A3、A4四個小段。將一未知的點突變株與缺失突變株J或L共同感染細菌時，可產生野生型的重組噬菌體；若與缺失突變株K或M共同感染細菌時，則不會產生野生型的重組噬菌體。由此結果判斷，未知突變株的點突變是位於A基因的哪一小段中？
  options:
  - label: A
    content: A2
  - label: B
    content: A3
  - label: C
    content: A4
  - label: D
    content: A5
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
