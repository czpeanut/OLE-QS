- id: doc_111_桃園_武陵_自然_生物_選修生物I_g12s1e2_s4_1
  section: 4
  number: 1
  type: calc
  page: 5
  stem: 在製造mRNA疫苗的過程中，科學家的首要工作是如何製造出能讓人體細胞協助製造病毒蛋白質但卻沒有病毒性的mRNA，目前已知病原體遺傳物質基因組序列為：5'-AUC-AUG-GCA-UAC-ACA-ACU-GAA-UGA-CUG-3'，請同學試利用附表回答問題。
    若依此病原體基因組序列進行轉譯，請試寫出此病原體基因組序列之多肽鏈產物的胺基酸序列為何？
  group_stem: 一、2019年12月，世界爆發不明肺炎疫情，經全基因組序列分析之後，初步判定病原體為新型冠狀病毒（SARS-CoV-2）·2020年3月11日，<u>世界衛生組織</u>（WHO）宣布COVID-19（2019年冠狀病毒疾病，簡稱新冠肺炎）為全球大流行。
    病毒突變後再跨物種的傳播，總是引發致命危機！從2003年的SARS（嚴重急性呼吸道症候群）、2012年的MERS（中東呼吸症候群）再到2019年的COVID-19，這些疾病都跟蝙蝠的冠狀病毒有關。新冠肺炎除在世界各國全境擴散外，更屢屢傳出重大災情，遠遠超出SARS和MERS所帶來的災情。科學家預測，冠狀病毒持續演變並繼續侵襲人類，在人類與病毒週而復始的戰役中，終將愈演愈慘烈。
    在2003年SARS出現之前，人類原本就常遭受4種冠狀病毒的侵襲。患者通常會有發燒、咳嗽。喉嚨痛、打噴嚏以及流鼻水等小感冒症狀，這些症狀無須吃藥，更不會令人產生生命遭受危害的疑慮，身體總是在無意間慢慢地自然康復。在其他動物身上也可以找到冠狀病毒的身影，例如：在牛、豬、貓、蝙蝠和鳥類的身上也經常出現被冠狀病毒感染而生病的情况。目前，豬與雞雖然已有疫苗可以使用，但效果不好，貓則因尚無疫苗可以使用，反而較容易發生死亡。
    冠狀病毒的遺傳物質由1條RNA組成，流感病毒則是由8條RNA組成，兩者同屬RNA病毒，兩者遺傳物質在複製過程中，因為缺乏校對的機制，而容易累積突變。傳統上，科學家常利用被殺死的病毒或毒性減弱後的病毒來製成疫苗，藉此誘發人體產生免疫反應。新的方式則是利用病毒產生蛋白質顆粒以作為抗原而設計的mRNA疫苗，相對於減毒或死毒的傳統疫苗而言，mRNA疫苗相對安全，同時mRNA疫苗最大特色是能快速且大量地製造與生產。
    SARS-CoV-2是RNA病毒，mRNA疫苗的設計概念就是模仿病毒在人體細胞內的感染過程：病毒入侵人體細胞後，會先利用人體細胞內的溶體將病毒蛋白質殺殼體分解掉之後，露出病毒的RNA，便可進入到人體細胞核控制細胞，以製造病毒的蛋白質顆粒，再複製病毒遺傳物質，最後組成病毒顆粒而再次感染其他細胞。在mRNA疫苗中所使用的mRNA僅是片段的基因，它既不是病毒、也不具有病毒的毒性，將它放入人體細胞裡面，讓細胞自己製造沒有毒性的病毒蛋白質，由人體細胞製造的這些病毒蛋白質一旦被免疫系統辨識出來後，免疫系統就會儲存記憶並展開攻擊。日後若再次遭遇到同一病毒的感染，免疫系統就會搜尋相關免疫記憶後迅速反應，讓病毒難以再次侵襲人體。請依照上述內容回答下列問題：
  assets:
  - key: s4_1_f1
    kind: figure
    file: doc_111_桃園_武陵_自然_生物_選修生物I_g12s1e2/s4_1_f1.png
    crop:
      page: 6
      rect:
      - 54.9
      - 41.85
      - 296.8
      - 236.25
  answer:
  - Ile–Met–Ala–Tyr–Thr–Thr–Glu。
  answer_status: verified
  answer_source: answer_key
