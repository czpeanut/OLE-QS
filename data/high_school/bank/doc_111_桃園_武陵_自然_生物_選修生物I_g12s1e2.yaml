  stem: '三、真核細胞基因表現時，有些基因經轉錄後，其指令會被細胞以RNA編輯法（RNA editing）重新編輯。RNA編輯是指在轉譯前將前驅mRNA上的核苷酸序列加以修改，主要的修改形式包括鹽基置換編輯及鹽基插入或移除編輯。人的apoB基因即為鹽基置換編輯的一個例子，在肝臟細胞中apoB基因表現出ApoB-100蛋白質（其中的數字表示組成此蛋白質的胺基酸數目），但在小腸細胞中則表現出ApoB-48蛋白質。在小腸細胞中，apoB
    mRNA上靠近中間位置的某一CAA密碼子上的C被編輯為U，於是新生成一蛋白質合成的終止密碼子，導致轉譯的蛋白質分子量減半。請依照上述內容回答下列問題：

    1. RNA編輯作用，發生在細胞內的哪一部位？'
  answer:
  - 細胞核。
  answer_status: verified
  answer_source: answer_key
