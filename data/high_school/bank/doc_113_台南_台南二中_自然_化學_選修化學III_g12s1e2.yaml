  stem: '下列是在特定溫度下，利用比色法求 $Fe^{3＋}(aq)＋SCN^{－}(aq) \rightleftharpoons FeSCN^{2＋}(aq)$ 平衡常數的實驗，實驗步驟如下：

    步驟1：取2支規格相同的比色用試管，分別加入 0.002 M、5.0 毫升的 KSCN 溶液，並標記為 1、2 號試管。

    步驟2：取 0.25 M、20.0 毫升硝酸鐵溶液，置於錐形瓶中，標為甲溶液。

    步驟3：以吸量管吸取 10.0 毫升甲溶液，置於容器 A 中並加水稀釋成 25.0 毫升，標為乙溶液。

    步驟4：以吸量管吸取甲溶液 5.0 毫升加至 1 號試管，取 5.0 毫升乙溶液加至 2 號試管。

    步驟5：將 2 號試管與 1 號試管比色，由試管的正上方俯視，用滴管從 1 號試管吸出適量溶液，當 2 號試管與 1 號試管顏色深淺相同時，其液面高度比（2號：1號）為 5：4。

    依據上述實驗步驟回答下列問題：

    (1) 容器 A 應選用何種儀器？（單選：A.容量瓶 B.量筒 C.燒杯 D.錐形瓶 E.試管）

    (2) 本實驗應選用何種試管作為比色管？（A.圓底試管 B.平底試管 C.U型管 D.尖底試管 E.燒杯）

    (3) 本實驗在比色過程中須以黑色紙包覆比色管，其作用為何？

    (4) 計算 2 號試管達平衡時 $[Fe^{3+}]_{eq}$、$[SCN^{-}]_{eq}$、$[FeSCN^{2+}]_{eq}$ 及本反應之平衡常數 $K_{c}$。'
