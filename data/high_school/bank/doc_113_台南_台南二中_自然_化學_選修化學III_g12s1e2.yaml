  stem: 某水溶液含有 $Pb^{2+}$、$Cu^{2+}$、$Mg^{2+}$ 三種陽離子，依序進行以下分離流程：(1) 加入足量稀鹽酸過濾，得沉澱 A；(2) 於濾液中通入 $H_{2}S$ 氣體過濾，得沉澱 B；(3) 於濾液中加入足量 $Na_{2}CO_{3}$ 溶液過濾，得沉澱 C。則沉澱 A、B、C 的化學式依序為何？
