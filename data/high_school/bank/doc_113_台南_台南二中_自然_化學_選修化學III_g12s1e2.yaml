  section: 1
  number: 10
  type: single
  page: 2
  stem: 下列平衡系統中，在各物質足量的條件下，何者於加壓或加熱時反應均向右移動？
  options:
  - label: A
    content: $2H_{2}(g)＋O_{2}(g) \rightleftharpoons 2H_{2}O(g)＋$熱
  - label: B
    content: $H_{2}(g)＋F_{2}(g) \rightleftharpoons 2HF(g)＋$熱
  - label: C
    content: $N_{2}(g)＋2O_{2}(g) \rightleftharpoons 2NO_{2}(g) \quad \Delta H＞0$
  - label: D
    content: $N_{2}O_{4}(g)＋$熱 $\rightleftharpoons 2NO_{2}(g)$
  - label: E
    content: $N_{2}(g)＋3H_{2}(g) \rightleftharpoons 2NH_{3}(g)＋$熱
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 加壓時，平衡會往氣體係數和較小方向移動，故選擇「氣體係數和」左＞右的選項；加熱時，平衡會往吸熱反應的方向移動，故選擇正反應為吸熱反應的選項。故選(C)。
  tags:
    unit:
