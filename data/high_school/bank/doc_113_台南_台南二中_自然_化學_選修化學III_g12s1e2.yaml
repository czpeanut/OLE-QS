  stem: 對一可逆反應A(g)＋B(g) ⇌ 2C(g)＋4D(g)，在定温、定容下，使定量A與B反應達到平衡，下列何項性質可以代表已達成平衡狀態？
  options:
  - label: A
    content: 各物質分壓不變
  - label: B
    content: 定容下，系統密度不再改變
  - label: C
    content: 反應一段時間後，系統總質量不變
  - label: D
    content: 平衡混合物中，各物質之濃度比[A]：[B]：[C]：[D]＝1：1：2：4
  - label: E
    content: 反應一段時間後，A和B的莫耳數減少量等於C和D的莫耳數增加量
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)定容系統、質量守恆，故密度永遠為定值，無法判斷是否達平衡；(C)反應過程中質量守恆，故質量永遠為定值，無法判斷是否達平衡；(D)係數不等於平衡時的物質濃度比，此數學關係無意義；(E)係數比＝1：1：2：4，故此敘述不可能發生。故選(A)。
