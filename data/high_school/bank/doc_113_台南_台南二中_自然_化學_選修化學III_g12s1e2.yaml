- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 若$K_{c}$為濃度平衡常數，$K_{P}$為分壓平衡常數，以下哪一反應的$K_{c}$與$K_{p}$相同？
  options:
  - label: A
    content: $N_{4}O_{4}$(g) ⇌ $2NO_{2}$(g)
  - label: B
    content: CO(g)＋$2H_{2}$(g) ⇌ $CH_{3}$OH(l)
  - label: C
    content: $H_{2}$(g)＋$Br_{2}$(g) ⇌ 2HBr(g)
  - label: D
    content: $PCl_{5}$(g) ⇌ $PCl_{3}$(g)＋$Cl_{2}$(g)
  - label: E
    content: $NH_{4}$Cl(s) ⇌ $NH_{3}$(g)＋HCl(g)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: $K_{p}$＝$K_{c}$ (RT)$^{Δn}$，其中Δn為（產物氣體係數和）－（反應物氣體係數和）。故若$K_{p}$＝$K_{c}$，則可知Δn＝0，其中(C)符合敘述。故選(C)。
