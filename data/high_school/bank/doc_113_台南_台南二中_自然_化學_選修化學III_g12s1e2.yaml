- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有關物質導電性的教述，下列何者正確？
  options:
  - label: A
    content: 酸類均為分子化合物，其液態不導電
  - label: B
    content: 鹼類都是離子化合物，其液態具導電性
  - label: C
    content: 離子化合物都是電解質，其固態、熔融態及水溶液皆可導電
  - label: D
    content: 金屬及電解質的導電方式相同，皆為利用可移動的自由電子而導電
  - label: E
    content: 鹽類均屬於電解質，其水溶液的導電度很大
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)氨（$NH_{3}$）屬於分子化合物；(C)離子化合物固態無法導電；(D)電解質是利用陰陽離子移動來導電；(E)有些鹽類難溶於水，其水溶液導電度並不大。故選(A)。
