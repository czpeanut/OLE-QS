  - label: C
    content: $MgCl_{2}$、CuS、$PbCO_{3}$
  - label: D
    content: $CuCl_{2}$、MgS、$PbCO_{3}$
  - label: E
    content: $MgCl_{2}$、PbS、$CuCO_{3}$
