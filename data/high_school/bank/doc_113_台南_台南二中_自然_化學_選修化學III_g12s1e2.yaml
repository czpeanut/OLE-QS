  stem: 難溶性鹽類在水溶液中，關於離子積（Q）與溶度積（$K_{sp}$）的敘述，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: Q＜$K_{sp}$，表示溶液為未飽和溶液，系统未達平衡
  - label: B
    content: Q＝$K_{sp}$，表示溶液為飽和溶液，系統達平衡
  - label: C
    content: Q＝$K_{sp}$，表示固體鹽類不會進行溶解與沉澱
  - label: D
    content: Q＞$K_{sp}$瞬間，溶液為過飽和溶液，系統不是平衡
  - label: E
    content: Q＞$K_{sp}$，溶液會產生沈殿直到Q＝$K_{sp}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)有可能已經有一些離子發生沉澱，剩餘的離子滿足離子積Q＝$K_{sp}$。故選(C)。
