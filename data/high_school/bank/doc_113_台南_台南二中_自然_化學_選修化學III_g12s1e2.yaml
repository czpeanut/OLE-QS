  type: single
  page: 1
  stem: 下列已達平衡的反應，何者在温度固定、反應容器的體積為原來的2倍的瞬間，平衡不移動？
  options:
  - label: A
    content: $4NH_{3}$(g)＋$5O_{2}$(g) ⇌ 4NO(g)＋$6H_{2}$O(g)
  - label: B
    content: $N_{2}H_{4}$(g)＋$O_{2}$(e) ⇌ $N_{2}$(g)＋$2F_{2}$O(g)
  - label: C
    content: $PCl_{3}$(g)＋$Cl_{2}$(g) ⇌ $PCl_{5}$(g)
  - label: D
    content: 3Fe(s)＋$4H_{2}$O(g) ⇌ $Fe_{3}O_{4}$(s)＋$4H_{2}$(g)
  - label: E
    content: $N_{2}O_{4}$(g) ⇌ $2NO_{2}$(g)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 體積加倍、濃度減半，平衡會往氣體係數和較大的方向移動，若平衡不移動，代表反應式左、右兩端氣體係數和相同，其中(D)符合敘述，故選(D)。
