- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 將下列固體溶於純水中達到平衡，則各物質的溶度積表示法，何者<u>錯誤</u>？
  options:
  - label: A
    content: Al(OH)$_{3}$(s) 之$K_{sp}$＝27[$Al^{3＋}$]$^{4}$
  - label: B
    content: $MgCO_{3}$(s) 之$K_{sp}$＝[$CO_{3}^{2－}$]$^{2}$
  - label: C
    content: $MgNH_{4}PO_{4}$(s) 之$K_{sp}$＝[$NH_{4}^{＋}$]$^{3}$
  - label: D
    content: $Hg_{2}Cl_{2}$(s) 之$K_{sp}$＝[$Cl^{－}$]$^{4}$
  - label: E
    content: Mg(OH)$_{2}$(s) 之$K_{sp}$＝$\frac{1}{2}$[$OH^{－}$]$^{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 如下列式： $\begin{matrix}(A) \\ \end{matrix}\begin{matrix}Al(OH)_{3}(s) \\ - S\end{matrix} \begin{matrix}\rightleftharpoons \\ \end{matrix} \begin{matrix}A{l^{3}}^{+}(aq) \\ + S\end{matrix} \begin{matrix}+ \\ \end{matrix} \begin{matrix}3OH^{-}(aq) \\ + 3S\end{matrix}$ $K_{sp}$＝[$Al^{3＋}$][$OH^{－}$]$^{3}$＝(s)(3s)$^{3}$＝$27s^{4}$，又 [$Al^{3＋}$]＝s，故$K_{sp}$＝27 [$Al^{3＋}$]$^{4}$。 $\begin{matrix}(B) \\ \end{matrix}\begin{matrix}MgCO_{3}(s) \\ - S\end{matrix} \begin{matrix}\rightleftharpoons \\ \end{matrix} \begin{matrix}M{g^{2}}^{+}(aq) \\ + S\end{matrix} \begin{matrix}+ \\ \end{matrix} \begin{matrix}C{O_{3}^{2}}^{-}(aq) \\ + S\end{matrix}$ $K_{sp}$＝[$Mg^{2＋}$][$CO_{3}^{2－}$]＝(s)(s)＝$s^{2}$，又 [$CO_{3}^{2－}$]＝s，故$K_{sp}$＝[$CO_{3}^{2－}$]$^{2}$。 $\begin{matrix}(C) \\ \end{matrix}\begin{matrix}MgNH_{4}PO_{4}(s) \\ - S\end{matrix} \begin{matrix}\rightleftharpoons \\ \end{matrix} \begin{matrix}M{g^{2}}^{+}(aq) \\ + S\end{matrix} \begin{matrix}+ \\ \end{matrix} \begin{matrix}NH_{4}^{+}(aq) \\ + S\end{matrix} \begin{matrix}+ \\ \end{matrix} \begin{matrix}P{O_{4}^{3}}^{-}(aq) \\ + S\end{matrix}$ $K_{sp}$＝[$Mg^{2＋}$][$NH_{4}^{＋}$][$PO_{4}^{3－}$]＝(s)(s)(s)＝$s^{3}$，又 [$NH_{4}^{＋}$]＝s，故$K_{sp}$＝[$NH_{4}^{＋}$]$^{3}$。 $\begin{matrix}(D) \\ \end{matrix}\begin{matrix}Hg_{2}Cl_{2}(s) \\ - S\end{matrix} \begin{matrix}\rightleftharpoons \\ \end{matrix} \begin{matrix}H{g_{2}^{2}}^{+}(aq) \\ + S\end{matrix} \begin{matrix}+ \\ \end{matrix} \begin{matrix}2Cl^{-}(aq) \\ +2S\end{matrix}$ $K_{sp}$＝[$Hg_{2}^{2＋}$][$Cl^{－}$]$^{2}$＝(s)(2s)＝$4s^{3}$，又 [$Cl^{－}$]＝2s，故$K_{sp}$＝$\frac{1}{2}$[$Cl^{－}$]$^{3}$。 $\begin{matrix}(E) \\ \end{matrix}\begin{matrix}Mg(OH)_{2}(s) \\ - S\end{matrix} \begin{matrix}\rightleftharpoons \\ \end{matrix} \begin{matrix}M{g^{2}}^{+}(aq) \\ + S\end{matrix} \begin{matrix}+ \\ \end{matrix} \begin{matrix}2OH^{-}(aq) \\ +2S\end{matrix}$ $K_{sp}$＝[$Mg^{2＋}$][$OH^{－}$]$^{2}$＝(s)(2s)＝$4s^{3}$，又[$OH^{－}$]＝2s，故$K_{sp}$＝$\frac{1}{2}$[$OH^{－}$]$^{3}$。故選(D)。
