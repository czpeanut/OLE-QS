  stem: 有關可逆反應達化學平衡時，下列敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 總莫耳數不變
  - label: B
    content: 平衡時仍不斷有產物生成
  - label: C
    content: 正逆反應速率等於零
  - label: D
    content: 反應物及生成物的濃度與反應式係數無關
  - label: E
    content: 達平衡時，反應物與生成物濃度不為零
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)正逆反應速率相等但不等於零。故選(C)。
