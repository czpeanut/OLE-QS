- id: doc_109_高雄_高師大附中_數學_數A_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 坐標平面上，兩向量$\vec{a}$與$\vec{b}$，設$| \vec{a} | = 3$，$| \vec{b} | = 5$，$\vec{a} \cdot \vec{b} = 6$，若$\vec{a} + t\vec{b}$平分$\vec{a}$與$\vec{b}$的夾角，則實數 t 值為下列何者？
  options:
  - label: A
    content: '2'
  - label: B
    content: $\frac{1}{2}$
  - label: C
    content: $\frac{5}{6}$
  - label: D
    content: $\frac{5}{3}$
  - label: E
    content: $\frac{3}{5}$
  explanation: '由角平分線性質可知

    當$| \vec{a} | = | t\vec{b} |$時，$\vec{a} + t\vec{b}$平分$\vec{a}$與$\vec{b}$的夾角

    $\Rightarrow$3＝t×5$\Rightarrow$t＝$\frac{3}{5}$

    故選(E)'
- id: doc_109_高雄_高師大附中_數學_數A_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知$\vec{a}$，$\vec{b}$，$\vec{c}$為平面上三個非零向量，α，β為實數，則下列敘述何者正確？
  options:
