    content: 若$\vec{a} \cdot \vec{b} = \vec{a} \cdot \vec{c}$且$\vec{a}\neq \vec{0}$，則$\vec{b} = \vec{c}$
  - label: B
    content: $( \vec{a} \cdot \vec{b} ) \cdot \vec{c} = \vec{a} \cdot ( \vec{b} \cdot \vec{c} )$
  - label: C
    content: 若$| \vec{a} + \vec{b} | = | \vec{a} - \vec{b} |$，則$\vec{a}\perp \vec{b}$
  - label: D
    content: 若$( \vec{a} + \vec{b} )$//$( \vec{a} - \vec{b} )$，則$\vec{a}$//$\vec{b}$
  - label: E
    content: 若$\vec{c}$表成$\vec{a}$與$\vec{b}$的線性組合且$\vec{c} = \alpha \vec{a} + \beta \vec{b}$，則α，β恰有一組解
- id: doc_109_高雄_高師大附中_數學_數A_g11s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 已知正七邊形 ABCDEFG 的邊長為 2，則下列敘述何者正確？
  options:
  - label: A
    content: $\vec{AB} \cdot \vec{AD} = \vec{AG} \cdot \vec{AE}$
  - label: B
    content: $\vec{GB}$//$\vec{FC}$
  - label: C
    content: $( \vec{AE} + \vec{AD} ) \cdot \vec{ED} = 0$
  - label: D
    content: $\vec{AB} \cdot \vec{AC} < \vec{AB} \cdot \vec{AD}$
  - label: E
    content: $\vec{AB} \cdot \vec{AE} = 2$
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_109_高雄_高師大附中_數學_數A_g11s1e3/s2_2_f1.png
    crop:
      page: 1
      rect:
      - 459.6
      - 652.4
      - 562.2
      - 750.4
  explanation: '(A)○：∵$\overline{AB} = \overline{AG}$，$\overline{AD} = \overline{AE}$且∠BAD＝∠GAE

    ∴$\vec{AB} \cdot \vec{AD}$＝$| \vec{AB} | | \vec{AD} | \cos \angle BAD$

    ＝$| \vec{AG} | | \vec{AE} | \cos \angle GAE = \vec{AG} \cdot \vec{AE}$

    (B)○：由題圖可知$\vec{GB}$//$\vec{FC}$

    (C)○：令$\overline{ED}$中點為 M

    則$( \vec{AE} + \vec{AD} ) \cdot \vec{ED}$＝$\vec{AE} \cdot \vec{ED} + \vec{AD} \cdot \vec{ED}$

    ＝$( - \overline{EM} ) \times \overline{ED} + \overline{EM}\times \overline{ED}$＝0

    (D)╳：∵$\vec{AC}$對$\vec{AB}$之投影量＞$\vec{AD}$對$\vec{AB}$之投影量

    ∴$\vec{AB} \cdot \vec{AC}>\vec{AB} \cdot \vec{AD}$

    (E)○：令$\overline{AB}$中點為 N，

    則$\vec{AB} \cdot \vec{AE} = \overline{AB}\times \overline{AN}$＝2×1＝2

    故選(A)(B)(C)(E)'
- id: doc_109_高雄_高師大附中_數學_數A_g11s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: '設△ABC 內部有一點 P，使得$2\vec{PA} + \vec{PB} + \vec{PC} = \vec{0}$，若$\overline{PA} = 4$，$\overline{PB} = 5$，$\overline{PC} = 7$，

    則下列敘述何者正確？'
  options:
  - label: A
    content: $\vec{PA} \cdot \vec{PB} = 10$
  - label: B
    content: △PAB 的面積為$5\sqrt{3}$
  - label: C
    content: △PAB 面積：△PBC 面積：△PCA 面積＝1：2：1
  - label: D
    content: △ABC 的面積為$20\sqrt{3}$
  - label: E
    content: $| 3\vec{PA} + 2\vec{PB} + \vec{PC} | = 21$
  explanation: '(A)╳：∵$2\vec{PA} + \vec{PB} = - \vec{PC}$

    ∴$| 2\vec{PA} + \vec{PB} | ^{2} = | - \vec{PC} | ^{2}$

    $\Rightarrow4 | \vec{PA} | ^{2} + 4\vec{PA} \cdot \vec{PB} + | \vec{PB} | ^{2} = | \vec{PC} | ^{2}$

    $\Rightarrow64 + 4\vec{PA} \cdot \vec{PB} + 25 = 49$

    $\Rightarrow\vec{PA} \cdot \vec{PB} = - 10$

    (B)○：△PAB 面積為$\frac{1}{2}\sqrt{| \vec{PA} | ^{2} | \vec{PB} | ^{2} - ( \vec{PA} \cdot \vec{PB} ) ^{2}}$＝$\frac{1}{2}\sqrt{16\times 25 - 100}$＝$\frac{1}{2}\sqrt{300}$＝$5\sqrt{3}$

    (C)○：由「若$m\vec{PA} + n\vec{PB} + \ell \vec{PC} = \vec{0}$，

    則△PAB 面積：△PBC 面積：△PAC 面積＝$\ell$：m：n」

    可知△PAB 面積：△PBC 面積：△PAC 面積＝1：2：1

    (D)○：∵△PAB 面積：△ABC 面積＝1：4，且△PAB 面積為$5\sqrt{3}$

    ∴△ABC 面積為$20\sqrt{3}$

    (E)╳：$| 3\vec{PA} + 2\vec{PB} + \vec{PC} | ^{2}$＝$| 3\vec{PA} + 2\vec{PB} + ( - 2\vec{PA} - \vec{PB} ) | ^{2}$

    ＝$| \vec{PA} + \vec{PB} | ^{2}$

    ＝$| \vec{PA} | ^{2} + | \vec{PB} | ^{2} + 2\vec{PA} \cdot \vec{PB}$＝16＋25＋2×（－10）＝21

    $\Rightarrow| 3\vec{PA} + 2\vec{PB} + \vec{PC} | = \sqrt{21}$

    故選(B)(C)(D)'
- id: doc_109_高雄_高師大附中_數學_數A_g11s1e3_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: △ABC 中，$\overline{AB} = 3$，$\overline{AC} = 2$，∠CAB＝60°，$\vec{AP} = x\vec{AB} + y\vec{AC}$，下列敘述何者正確？
  options:
  - label: A
    content: x＝1 時，點 P 所成圖形為一直線
  - label: B
    content: x＋y＝1 時，點 P 所成圖形為一直線
  - label: C
    content: x＋y＝1，x$\geq$0，y$\geq$0 時，點 P 所成圖形為一線段
  - label: D
    content: △ABC 的面積為$3\sqrt{3}$
  - label: E
    content: －1$\leq$x$\leq$2，0$\leq$y$\leq$2 時，點 P 所成圖形的面積為$9\sqrt{3}$
  explanation: '(A)○：x＝1 時，點 P 所成的圖形為過 B 點，且平行$\overline{AC}$的直線

    (B)○：x＋y＝1 時，點 P 所成的圖形為直線 BC

    (C)○：x＋y＝1 且 x，y$\geq$0 時，點 P 所成的圖形為線段 BC

    (D)╳：△ABC 面積為$\frac{1}{2}\times 2\times 3\times \sin 60^{∘} = \frac{3\sqrt{3}}{2}$

    (E)╳：所求面積為〔2－（－1）〕×（2－0）×2△ABC 面積＝$18\sqrt{3}$

    故選(A)(B)(C)'
- id: doc_109_高雄_高師大附中_數學_數A_g11s1e3_s2_5
  section: 2
  number: 5
  type: multiple
  page: 2
  stem: '如右圖，設 P 為△ABC 內部一點，且$\vec{AP} = \frac{1}{5}\vec{AB} + \frac{1}{4}\vec{AC}$，$\vec{BE} = \frac{3}{5}\vec{BA}$，$\overline{AP}$的延長線交$\overline{BC}$於 D，則下列敘述何者正

    確？'
  options:
  - label: A
    content: '$\overline{BD} : \overline{DC} = 5 : 4$'
  - label: B
    content: '$\overline{AP} : \overline{AD} = 9 : 20$'
  - label: C
    content: $\vec{AD} = \frac{4}{9}\vec{AB} + \frac{5}{9}\vec{AC}$
  - label: D
    content: $\frac{\triangle ACP 面積}{\triangle ABC 面積} = \frac{1}{5}$
  - label: E
    content: $\frac{\triangle AEP 面積}{\triangle ABC 面積} = \frac{2}{25}$
  assets:
  - key: s2_5_f1
    kind: figure
    file: doc_109_高雄_高師大附中_數學_數A_g11s1e3/s2_5_f1.png
    crop:
      page: 2
      rect:
      - 447.95
      - 323.9
      - 553.4
      - 414.5
  explanation: '令$\vec{AP} = t\vec{AD}$

    $\Rightarrow\vec{AD} = \frac{1}{5t}\vec{AB} + \frac{1}{4t}\vec{AC}$

    又 B、D、C 共線

    故$\frac{1}{5t} + \frac{1}{4t} = 1\Rightarrow$t＝$\frac{9}{20}$

    (A)○：∵$\vec{AD} = \frac{4}{9}\vec{AB} + \frac{5}{9}\vec{AC}$

    ∴$\overline{BD} : \overline{DC} = 5 : 4$

    (B)○：∵$\vec{AP} = \frac{9}{20}\vec{AD}$

    ∴$\overline{AP} : \overline{AD} = 9 : 20$

    (C)○：由(A)可知為真

    (D)○：∵$\overline{AP} : \overline{AD} = 9 : 20$

    ∴△ACP 面積＝$\frac{9}{20}$△ADC 面積

    ∵△ADC 面積：△ABC 面積＝$\overline{DC} : \overline{BC}$＝4：9

    ∴△ACP 面積＝$\frac{9}{20}$△ADC 面積＝$\frac{9}{20}\times \frac{4}{9}$△ABC 面積＝$\frac{1}{5}$△ABC 面積

    (E)╳：∵$\vec{BE} = \frac{3}{5}\vec{BA}$

    ∴△AEP 面積＝$\frac{2}{5}$△ABP 面積

    ∵△ABP 面積：△ABD 面積＝9：20，且△ABD 面積：△ABC 面積＝5：9

    ∴△AEP 面積＝$\frac{2}{5}$△ABP 面積＝$\frac{2}{5}\times \frac{9}{20}\times \frac{5}{9}$△ABC 面積＝$\frac{1}{10}$△ABC 面積

    故選(A)(B)(C)(D)'
