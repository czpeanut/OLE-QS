  stem: 社會運動可以說是一種抗議、議價的活動，更是由下而上的集體行為。以下哪些活動屬於社會運動？
  options:
  - label: A
    content: 白米炸彈客因不滿政府開放稻米進口及未妥適處理農民生計問題，連續在公共場所放置「爆裂物」
  - label: B
    content: 野百合運動，學生們提出「解散國民大會」、「廢除臨時條款」、「召開國是會議」、以及「民主改革時間表」等四大訴求
  - label: C
    content: 接連幾起法官輕判性侵幼童案例，網友發起「白玫瑰運動」要求司法改革
  - label: D
    content: 兩岸三地為四川大地震舉辦大型的賑災募款活動
  - label: E
    content: 國營事業員工，以罷工行動抗議員工利益在民營化過程中一再被忽略
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)僅為個人行為，非具有集體性，不屬於社會運動。(B)此為政治改革的社會運動。(C)此為司法改革的社會運動。(D)此為賑災募款活動，沒有改變社會的目的，不屬於社會運動。(E)此為爭取勞動權益的社會運動。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s2_38
