  group_stem: 數位經濟時代來臨，近年歐洲各國皆陸續換發數位晶片身分證（下稱 eID）。為減輕民眾卡片爆量的困擾、迎合數位化時代需求、提升生活便利性，我國日前也擬將現有的紙本國民身分證、結合自然人憑證進行換發，只需一張卡片、即可用來證明身分、戶籍甚至報稅，減輕民眾臨櫃的奔波勞苦。然而，水能載舟亦能覆舟。多卡整合的數位身分證、是否有在上路前做好確實的資安防護，以及政府在無法授權、缺乏專責機關管轄的情況下強推該法案，皆引發各界疑慮。臺灣人權促進會因此發起連署，要求政府撤回該法案，甚至因內政部未廢除先前的相關辦法、而可能對人民資訊隱私造成疑慮而對政府提告。
