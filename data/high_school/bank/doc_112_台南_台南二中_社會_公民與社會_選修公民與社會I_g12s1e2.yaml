  stem: 根據題文，這次桃園市空服員職業工會發起長榮空服員罷工的主要原因為何？
  options:
  - label: A
    content: 捍衛勞工自由組織工會、運作工會的權利
  - label: B
    content: 保障長榮空服員與公司協商勞動條件的權利
  - label: C
    content: 爭取更高薪資，與長榮航空爭奪公司治理權
  - label: D
    content: 要求空服員勞動條件比照《勞基法》標準
  group_stem: '桃園市空服員職業工會自 2017 年起與長榮航空經歷約 20 次協商，始終無法達成共識。為改善長榮航空空服員勞動權，工會於 2019 年發動罷工，並提出 8 大訴求：包括「日支費應調高到每小時新臺幣 150 元，非工會會員禁搭便車」、「東京、北京、金邊等 9 條航線改為過夜班」、「開放工會參與會員的人評會等懲處機制，並有發言及表決權」、「開放勞工參與公司治理，增設勞工董事」、「國定假日出勤應給付 2 倍工資」、「各航班派遣外籍組員不得超過 2 人」、「給予工會理監事、會員代表會務公假」、「變更空服員現有勞動條件與工作規則時應事先與工會協商」。

    罷工活動持續 17 天，創下臺灣交通業罷工史上多項紀錄，包括罷工天數最長、參與空服員人數最多、影響航班最多、影響旅客人數最多、航空公司與旅行業者損失最多等。為此，長榮航空估算營收損失已達 27.8 億元，還不包含要賠償給旅客、旅行業者的金額。而與過去華航空服員罷工相比，華航為半國營性質的企業，政府占有一定角色，也做出較大讓步。而長榮為私人民營企業，內部並無工會，此次罷工具有示範效果、意義非凡。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從文章中第一段的 8 大訴求，可知此次工會罷工主要是為了爭取更好的勞動權益及工作條件，故應選(B)。(A)組工會為《工會法》保障的團結權。(C)與爭奪公司治理經營權無關。(D)空服員的勞動條件本就應該等同或高於《勞基法》標準。
