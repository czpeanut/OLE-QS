    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 10 | 游信義 | 你是否同意《民法》婚姻規定應限定在一男一女的結合？ | 677,972 | 83.44 | 16.56 | 3.01 | 通過 |

    | 11 | 曾獻瑩 | 你是否同意在國民教育階段內（國中及國小），教育部及各級學校不應對學生實施《性別平等教育法施行細則》所定之同志教育？ | 670,168 | 83.02 | 16.98 | 2.96 | 通過 |

    | 12 | 曾獻瑩 | 你是否同意以《民法》婚姻規定以外之其他形式來保障同性別二人經營永久共同生活的權益？ | 632,896 | 82.56 | 17.44 | 2.78 | 通過 |

