- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 報導指出英國脫歐後，經濟變數提高，2016 年英國央行公布的最新經濟數據顯示，英國通貨膨脹在短期內暴衝。主要是因為脫歐後英鎊在四個月內貶值了近 20 ％，英國央行估計未來兩年內，英國 CPI 的上漲幅度將比過去 12 年都來的高，甚至有陷入停滯性通貨膨脹（stagflation）的危險。下列哪項敘述最能解釋英國的經濟現況？
  options:
  - label: A
    content: 脫歐使對外貿易大增導致物價上揚
  - label: B
    content: 產生需求拉動的通貨膨脹長期看好
  - label: C
    content: 貧富差距擴大消費將呈 M 型化現象
  - label: D
    content: 物價膨脹率及失業率可能同時增加
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知英國的通膨是因為貨幣貶值，非需求拉動或成本推動的原因。(A)脫歐應該使對外貿易減少，並非導致物價上漲的原因。(B)此並非為需求拉動的通膨。(C)從題文中無法推論。(D)脫歐會導致失業率上漲，因此英國可能有物價上漲率及失業率同時增加的情形，為正解。
