  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 2018 年的 CPI 為 30×40＋40×20＝2,000／實質 GDP 與名目 GDP 為 30×40＋40×20＝2,000。

    (2) 2019 年的 CPI 為 25×40＋60×20＝2,200／實質 GDP 為 30×30＋40×35＝2,300／名目 GDP 為 25×30＋60×35＝2,850。

    (3) 2020 年的 CPI 為 35×40＋45×20＝2,300／實質 GDP 為 30×30＋40×30＝2,100／名目 GDP 為 35×30＋45×30＝2,400。

    (A)應是 2020 年的 CPI 最高。(B) 2019 年的物價上漲率為（2,200－2,000）／2,000×100 ％＝10 ％；2020 年的物價上漲率為（2,300－,2200）／2,200×100 ％＝4.55 ％，故應是 2019 年的物價上漲率高於 2020 年。(C) 2019 年的名目 GDP 為 2,850，為三年中最高，為正解。(D)應是 2019 年的實質 GDP 為 2,300，為三年中最高。'
