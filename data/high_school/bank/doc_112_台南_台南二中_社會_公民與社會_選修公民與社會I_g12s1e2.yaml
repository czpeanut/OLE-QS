- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 近幾年來食品安全事件層出不窮，消費者文教基金會（消基會）捍衛消費者權益不遺餘力，不論是 2020 年底發起連署拒吃含萊克多巴胺的豬肉（簡稱萊豬），要求禁止萊豬進口；或是過去在塑化劑風波、頂新黑心油事件之後，為受害民眾的健康提出訴訟求償，並遊說立法院修正《食品安全衛生管理法》加重罰則。對於消基會的長期努力，請判斷以下各項分析何者正確？
  options:
  - label: A
    content: 消基會的連署與訴訟求償行動並非屬於社會運動
  - label: B
    content: 消基會經常採取體制外的激烈抗爭手段提出訴求
  - label: C
    content: 消基會是倡議公共利益並對政府施壓的壓力團體
  - label: D
    content: 消基會與各政黨聯手反對萊豬進口即屬政黨活動
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此行為有一定的訴求及組織，屬於社會運動的一種方式。(B)較常採用體制內溫和的手段提出訴求。(D)利益團體的活動並非屬於政黨活動。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 1980 年代以後，臺灣的社會運動如雨後春筍般的出現，迄今已有上萬個合法登記的社會團體。其中，廣為人知的消費者文教基金會，簡稱消基會，專門改善臺灣消費環境，伸張消費者權利。也促成了《消費者保護法》的立法施行以及行政院消費者保護處的成立。下列關於消基會和消保處的敘述，何者正確？
  options:
  - label: A
    content: 消基會屬第三部門，消保處屬第一部門
  - label: B
    content: 消基會和消保處兩者皆具有公權力
  - label: C
    content: 消基會和消保處兩者皆屬非營利組織
  - label: D
    content: 消基會屬於社團法人，有享受權利、負擔義務之能力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)僅有消保處有公權力。(C)消基會屬於民間非營利組織，消保處屬於政府單位。(D)消基會屬於財團法人。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 社會運動的產生，除了社會中的不平等結構外，主張弱勢團體得以獲得相應的支持或組織能力，以發動力量、進行抗爭，為何種社會運動理論的概念？
  options:
  - label: A
    content: 相對剝奪感
  - label: B
    content: 資源動員論
  - label: C
    content: 政治機會
  - label: D
    content: 非理性行動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)資源動員論者主張外來資源或外力的挹注，是促使弱勢團體能夠發起社會運動挑戰的最重要因素，符合題文所述。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 2012 年一名美國非裔青年被警方槍殺。次年，開槍的歐洲、拉丁、非洲混血裔社群自衛巡邏員被判無罪，社群網路遂發起「黑人的命也是命」（Black Lives Matter，簡稱 BLM）運動。爾後，陸續發生類似事件，BLM 發展成為國際維權運動，該運動與我國下列何項社會運動的議題最為類似？
  options:
  - label: A
    content: 原住民族青年在嘉義火車站吳鳳銅像前抗議，並合力將銅像推倒
  - label: B
    content: 鄧如雯殺夫案引發反婚姻暴力運動，促成《家庭暴力防治法》的通過
  - label: C
    content: 近年來多起空服員與機師的罷工行動，爭取更好的勞動條件
  - label: D
    content: 彰化鹿港興起反杜邦運動，居民抗爭下，成功阻止美國化工廠的設置
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 美國的 BLM 運動著重於種族的議題，與(A)原住民族爭取族群權利相似。(B)為性別平等議題。(C)為勞動權益議題。(D)為環保議題。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 一夜致富是許多人的夢想。為了造福人民，假設政府決定以直升機到市中心灑下價值新臺幣 10 億元的鈔票，則對其影響的說明，下列何者正確？
  options:
  - label: A
    content: 整個社會將增加 10 億元新臺幣的財富
  - label: B
    content: 若政府灑下的是外匯存底，新臺幣將貶值
  - label: C
    content: 若廠商已預期政府會灑鈔票，則他們不會增加生產
  - label: D
    content: 鈔票飄落的路徑是隨機的，不會造成所得重分配
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是增加 10 億元的貨幣，不一定意味著財富增加。(B)外匯在市場流動增加，會使得外匯貶值，臺幣升值。(D)因為灑在市中心，所以市中心的民眾會獲得較多貨幣，仍可能會產生重分配效果。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 二中國的 GDP 為 100 億美元，消費支出、投資支出、政府消費支出及進口額分別為 35 億、20 億、15 億及 20 億美元，試求其出口額數字為何？
  options:
  - label: A
    content: 10 億美元
  - label: B
    content: 60 億美元
  - label: C
    content: 50 億美元
  - label: D
    content: 30 億美元
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: GDP＝消費支出＋投資支出＋政府消費支出＋（出口額－進口額），即 35 億＋20 億＋15 億＋（出口額 X－進口額 20 億）＝100 億元，因此出口額為 50 億元，故選(C)。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 每當選舉期間，總能聽見候選人以「人民要有錢」、「發大財」、「拚經濟」等類似的口號競選。若是要檢驗當選後國家有沒有比之前有錢，應該看總體經濟指標的何種變化最為恰當？
  options:
  - label: A
    content: 經濟成長率呈現正數
  - label: B
    content: 消費者物價指數超過 100
  - label: C
    content: 失業率較過去增加
  - label: D
    content: 出口總額創歷史新高
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 衡量一個國家整體的經濟發展狀況，最常使用的指標為國內生產毛額，而國內生產毛額的年增率即為經濟成長率，呈現正數意味經濟發展良好，故選(A)。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 當市場機能發揮時可以達成經濟效率，然而，通貨膨脹卻會扭曲市場機能，影響經濟體系的資源配置。關於通貨膨脹的影響，下列哪些敘述正確？(甲)對生產者而言，通貨膨脹使產品價格上漲，誘使廠商投資生產，增加出口賺取利潤(乙)通貨膨脹可能使廠商為了增產而擴廠，但當廠房蓋好時，工資、原料價格也上漲，原本的投資已無利可圖(丙)若通貨膨脹的速度太快，則民眾會擔心貨幣貶值，為賺取利息大舉存錢，造成銀行錢滿為患(丁)對消費者而言，通貨膨脹使民眾為了保值，因而購買更多實質資產，形成這些資產的泡沫
  options:
  - label: A
    content: (甲)(丙)
  - label: B
    content: (甲)(丁)
  - label: C
    content: (乙)(丙)
  - label: D
    content: (乙)(丁)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)通膨會對生產者及消費者皆不利，因為原物料價格會上漲，廠商不一定會增加投資；(丙)因為擔心貨幣貶值，不會選擇把錢存在銀行，反而轉換成更能保值的資產，如投資房地產。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '天龍國在 2020 與 2021 年只生產筆記型電腦與平板電腦，其數量與價格如下表所示。請問若以 2020 年為基期，下列敘述何者正確？

    | 年度 財貨 | 2020 年 |  | 2021 年 |  |

    | --- | --- | --- | --- | --- |

    |  | 價格 | 數量 | 價格 | 數量 |

    | 筆記型電腦（臺） | 20,000 元 | 50 | 22,000 元 | 60 |

    | 平板電腦（臺） | 10,000 元 | 50 | 18,000 元 | 50 |'
  options:
  - label: A
    content: 2021 年的實質 GDP 為 2,000,000
  - label: B
    content: 2021 年的實質 GDP 較 2020 年增加
  - label: C
    content: 2021 年的實質薪資呈現上升的趨勢
  - label: D
    content: 2021 年的經濟成長率約為 10.3 ％
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 實質 GDP 的計算為：今年的生產數量×前一年的價格。(A) 2021 的實質 GDP 為 60×20,000＋50×10,000＝1,700,000。(B) 2020 年的實質 GDP 為 50×20,000＋50×10,000＝1,500,000，所以 2021 年的實質 GDP 較 2020 年的實質 GDP 增加，為正解。(C)從實質 GDP 無法判斷實質薪資是否增加。(D)經濟成長率＝（今年實質 GDP－去年實質 GDP）／去年實質 GDP×100 ％＝（1,700,000－1,500,000）／1,500,000×100 ％＝13.33 ％。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 臺灣同志遊行自 2003 年起已持續舉辦 18 屆，主要由「臺灣同志遊行聯盟」主辦，這個團體依其性質應具備下列哪些特色？(甲)共同的價值信念(乙)目標為取得執政權(丙)依附於政府由上而下運作(丁)具備一定組織性
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (乙)(丙)
  - label: C
    content: (丙)(丁)
  - label: D
    content: (甲)(丁)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)參加的團體或個人是具有共同價值信念來參與活動、(丁)透過組織動員促成活動的進行，皆為此次遊行的特色，故選(D)。(乙)此為政黨的訴求，非利益團體的目標；(丙)利益團體倡議的社會運動是由下而上運作。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 甲、乙、丙、丁在計畫暑假想做的事情，請問從 GDP 來看四人聊天的內容，誰做的事情其產值會直接計入我國 GDP？
  options:
  - label: A
    content: 甲：我要回南部幫忙外公務農
  - label: B
    content: 乙：我想趁暑假時間去綠島打工順便欣賞美景
  - label: C
    content: 丙：我媽媽叫我要好好打掃家裡各角落
  - label: D
    content: 丁：我想到長照機構當志工服務長者
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)幫家裡務農應無支薪，不計入 GDP。(B)打工有收入，會計入 GDP，為正解。(C)為家務勞動，無支薪，不計入 GDP。(D)志工無支薪，不計入產值 GDP。

    14.1981 年的 CPI 為 64，滷肉飯價格為 10 元；換算為 2011 年的價格為 16.7 元，則 2011 年的 CPI 為 64×1.67＝106.88，約 107，故選(C)。

    15.(A)為競選活動，並非使社會改變的社會運動。(B)學生的訴求為反對學費調整，與公共利益有關，屬於社會運動。(C)此為例行活動，沒有達成改變社會的訴求。(D)目的為解決醫療糾紛，並非改變社會或具公共利益性質，不為社會運動。

    16.(A)此為短期活動而推升的物價上漲，因此不會使當地民眾增加消費。(B)此為因應活動而產生的價格短期增加，不屬於通貨膨脹的定義。(C)為短期現象，不需要央行調整貨幣政策或減少貨幣數量。

    17.由「人們開始注意到皮草生產過程的不人道，紛紛響應拒買運動」，可見在動保團體的努力下，民眾的價值觀已有所改變，故選(B)。

    18.經濟成長率＝（今年實質 GDP－去年實質 GDP）／去年實質 GDP×100 ％，若去年的 GDP 假設為 X，則（100－X）／X×100 ％＝－5 ％，X 約等於 10,526,000,000；與今年 GDP100 億元相減，得出數值 526,000,000，故選(B)。

    19.(B)人民團體多代表民眾參與公眾事務的積極性增加，此與政府的統治效率無關。(C)社會團體屬於第三部門，應是第三部門有發揮其作用。(D)由於政黨的成立門檻較高，且以取得政權為目標，不一定符合大眾的需求，且此與民眾對政治的過問程度關聯不大。

    20.從敘述中提及「規劃原住民族傳統領域」，及保障《原住民族傳統智慧創作保護條例》及管理族群的文化資產，可推論此與重視多元文化的自決權較相關，以(B)為正解。而與(A)工作權、(C)性別多元、(D)環境權較無相關。

    21.(甲)體制外的活動並不意味無組織及秩序，為錯誤敘述；(乙)現行《集會遊行法》，仍以事前申請許可為主，為正確敘述；(丙)聚眾抗議與聽證會是不同的參與管道、訴求，且聽證屬於體制內程序，兩者有不同的規範，為錯誤敘述；(丁)示威遊行為體制外社會運動的一種，為正確敘述。故答案應選(A)(甲)(丙)。

    22.(A)屬於倡議節能減碳改變現狀的環保運動。(B)少女藉由罷課展開社會運動，為體制外的手段，為正解。(C)目的是喚起保護環境的觀念與行動，與物質爭奪無關。(D)此與不平等體制無關。

    23.(A)由圖表資訊可顯示 2017 年失業率最高且抗爭次數最多，2020 年次之，與此敘述相符。(B) 2011 年的實質 GDP 最低，但社會抗爭次數也最少，顯示低國民所得並非造成社會抗爭的主因。(C) 2020 年的國民平均受教育年數最長，但社會抗爭事件非最多，故兩者並無直接關聯。(D) 2020 年的實質 GDP 最高，但 2017 年的抗爭次數最多，顯示兩者無正相關。

    24.從題文「但籃球校隊隊員因已有其他眾多學生抗議，決定不參加行動」，可看出社會運動會遇到只享受群體抗爭成果卻搭便車的情形；(C)透過抗爭爭取勞工權益，目的是「擴大團結的力量，抗爭成果集體分享」，但獲得勞工權益後非工會成員也會享有權益，故此符合題文敘述的概念。

    25.社會運動的其中一項特色是由下（人民）影響上（政府）的決策，因此總統、前閣揆參與社會運動，有論者批評此作為違反社會運動的特色，故選(C)。

    26.民進黨為執政黨，政黨在於取得執政權，屬於(B)政治團體。

    27.題文指出貝比魯斯在 1931 年的年薪與王建民於 2011 年的年薪相比，實質購買力相差不遠，故可知是由於 CPI 可以比較不同時期的物價水準，應選(A)。

    28.從題文「當 CPI 上漲累計達 3 ％以上時，免稅額就依上漲程度作調整」，可知此為 CPI 在於(B)調整稅負之應用。

    29.從題文「多卡整合的數位身分證、是否有在上路前做好確實的資安防護，以及政府在無法授權、缺乏專責機關管轄的情況下強推該法案，皆引發各界疑慮」，可知政府本來欲推行此政策，但因為民眾有疑慮而發起連署要求撤回，此屬於(D)改變不當政策的社會運動類型。

    30.具有相同利益，並藉由各種方式、影響政府決策的社會團體，稱為利益團體，且其常用對政府施壓方式，以實現其團體的利益為目的，故又稱為壓力團體，應選(A)。

    31.2018 年的 CPI 為 30×20＋20×20＝100，2019 年的 CPI 為 40×20＋30×20＝140，2020 年的 CPI 為 20×20＋25×20＝90。(A) 2019 年有通貨膨漲之情形，因為 2019 的 CPI 為 140 高於 2018 年的 100。(B) 2020 年有通貨緊縮之情形，因為 2020 的 CPI 為 90 小於 2018 年的 100。(C)不一定，這牽涉民眾對於哪些物品的消費量較多且較頻繁，而會有不同之感受。

    32.對於民眾而言，2019 年有通貨膨脹之情形。(A)因為通膨，如果名目所得不變，實質所得會減少。(C)不一定，因為鳳梨酥並非民生必需品且無法久放。(D)因應通膨，企業應調高起薪，以應對通膨而產生的實質薪資縮水。

    33.(A)此表為經濟成長率的資料，無法推估物價水準之情形。(B)因為 2021 年的 GDP 成長率皆為正值，為合理推論。(C)經濟成長率為國家整體經濟情形，無法推估貧富差距情形。(D)近五年皆為正值，顯示皆為成長趨勢。

    34.(A)僅可得知經濟衰退情形最嚴重，無法得知實質 GDP 原有的數值。(B)僅可得知我國當年較無面臨經濟衰退，但無法得知實質 GDP 原有的數值。(C)從此表無法得知實質 GDP 原有的數值。(D)只要經濟成長率為正值，意味仍是經濟成長狀態，為正確敘述。

    35.(A)因為同志伴侶的訴求為修改《民法》，與異性戀者受同樣法律的保障，但公投結果卻是以專法保障，可能使其產生相對剝奪感，為正確敘述。(B)應是左派的思維，因為左派較重視保障弱勢者的權益。(C)應是民主程度高，參與政治的機會多，社會運動才能蓬勃發展。(D)新社會運動是一個興起於 1960 年代中期後歐洲的社會運動理論，其集體行動多半是發生在公民社會或文化領域的場景，例如：環境運動、性別、平權運動，與反戰運動等，並將過去被忽略、邊緣化的議題浮上檯面，並帶入政治；換言之，新社會運動比較不傾向追求權力或物質、資源的分配，而是強調打造不同的身分認同、生活風格（lifestyle）和文化價值。

    36.(A)公投案通過的門檻如下：投票結果中有效同意票數多於不同意票，且有效同意票達投票權人總額四分之一以上者。(C)政黨人士發起仍屬於公民提案，同樣需經過提案與連署之程序。(D)應是法律優越原則，下級法規不得牴觸上級法規。'
