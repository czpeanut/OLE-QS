  stem: 我國主計總處公布 2020 年第 4 季經濟成長率概估為 4.94 ％，因出口暢旺、民間消費比預期佳，較 11 月預測數大增 1.66 ％；併計前 3 季，2020 年全年經濟成長率概估為 2.98 ％，較預測數增加 0.44 ％，也是近 3 年最高。主計總處概估結果印證外媒預測，2020 年臺灣經濟成長率再次超越中國的 2.3 ％，為 1991 年至今、30 年來首見。根據以上資料，下列敘述何者正確？
  options:
  - label: A
    content: 因出口暢旺、民間消費比預期佳，全年 GDP 一定會增加
  - label: B
    content: 國內生產毛額（GDP）是指「一國國內在一段時間內，所生產的全部商品的市場交易價值總和」
  - label: C
    content: 經濟成長率（economic growth rate）是指「實質總產出」或「實質國內生產毛額（GDP）」的年增率
  - label: D
    content: 由報導可知，我國的經濟成長率超越中國，更傲視所有已開發國家，意指我國的 GDP 比這些國家都高
  - label: E
    content: 因為我國經濟成長率表現亮眼，所以必定不會出現通貨膨脹的情形
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因為民間消費與出口為 GDP 計算中的主要指標，可以推論該年的 GDP 應該會增加，為正確敘述。(B)應為「最終產品」的市場交易總價格，非全部產品。(C)符合經濟成長率的定義，為正確敘述。(D)經濟成長率為實質 GDP 的年增率，但不意味 GDP 總值最大，也無法推論較其他已開發國家高。(E)經濟成長率表現亮眼顯示對景氣看好，但也會引發通貨膨脹。
