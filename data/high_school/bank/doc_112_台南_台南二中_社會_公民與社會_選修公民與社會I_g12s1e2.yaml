  stem: 根據資料一，關於我國同婚相關社會運動的分析，下列何者最為合理？
  options:
  - label: A
    content: 部分跨國同志伴侶在 2019 年專法通過後可能產生相對剝奪感
  - label: B
    content: 支持修改《民法》保障同志婚姻者屬於偏向右派的政治意識型態
  - label: C
    content: 我國民主化程度低落、政治機會多，故社會運動才能蓬勃發展
  - label: D
    content: 新社會運動論強調上凱道與辦大型音樂會所需要的資金與人力
  group_stem: '資料一：自從 2013 年民進黨立委尤美女等人推出多元成家法案後，社會上各團體對「同志是否享有結婚權利」便爭論不休。2016 年 12 月，下一代幸福聯盟號召 10 萬人走上凱道，高喊「婚姻家庭，全民決定，停止審查，交付公投」，參與民眾紛紛穿上白衣以表支持。一週後，臺灣同志諮詢熱線、臺灣同志家庭權益促進會等單位，亦於凱道舉辦「讓生命不再逝去，為婚姻平權站出來」音樂會，希望政府積極推動《民法》修正案。2017 年大法官解釋出爐，認為目前《民法》婚姻章未保障同性二人建立永久共同生活之權利違憲，但未規範立法、修法形式為何。於是 2018 年公投便出現三個與同志婚姻有關的提案，最後立法院在 2019 年三讀通過《司法院釋字第 748 號解釋施行法》，使同志伴侶可以準用大部分《民法》婚姻章之規定。但是目前某些跨國同志伴侶仍不適用專法，對此，臺灣伴侶權益推動聯盟透過倡議、訴訟等方式，持續推動跨國同婚相關立法、修法。

