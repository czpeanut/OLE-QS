  stem: 資料一：族人死亡會擊鼓而哭，將屍體放在地上，用火燻乾，放置在屋內。等到房子毀損後，將屍體直立埋在地基之下，不立墓碑，並將新屋建於其上。 資料二：「尪姨」是女性祭司，所做的宗教儀式為：請神和獻神，並且是被神靈附身的神人溝通者……尪姨不只在族群的宗教上扮演重要角色，個別家庭如果遇到任何困難，他們會請尪姨到家裡作法，每家都有區域可以請神或祭拜，並舉行儀式，尪姨甚至能預測天氣好壞。 上述兩段資料是對臺灣某族群的敘述，請問下列關於該族群的敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 該族群又被稱為拜壺民族
  - label: B
    content: 祭司的工作與該族群生活息息相關
  - label: C
    content: 該族群基本上是屬於男女分工的母系社會
  - label: D
    content: 該族群的分布，主要集中在臺灣北部
