  stem: 某政府公務人員到臺灣後，認為第一個最不方便的事就是語文不通。在他的生活體驗中，臺灣沒有幾個人會說國語，讀漢文。臺灣人在日本文化中長大，只會日文，而閩南語又是中國最難懂的方言之一。「我既不懂閩南語，也看不懂日文，等於是一群文盲和另一群文盲在一個社會裡相遇。」這位公務人員應是何時來到臺灣？
