  stem: 1938年一位叫做莎韻的泰雅族少女為替日本老師搬運行李下山，經過獨木橋時，不慎墜溪失蹤。總督府得知後，宣稱莎韻是為協助老師出征才不幸遇難。總督府除了發動藝文界來宣揚其英勇事跡，例如拍成電影「莎韻之鐘」。總督府還親自頒發紀念鐘給他的家屬，並立碑紀念。到了戰後，他的家屬面對新政府的官員，卻驚恐地否認莎韻是協助老師出征才罹難的事跡，強調這是日本人虛構的。請問對於莎韻的事蹟解釋為何有此轉變？
  options:
  - label: A
    content: 唯恐被戰後的中國政府貼上「皇民家庭」的標籤
  - label: B
    content: 莎韻的家屬認為總督致贈鐘，音同「送終」很不吉利
  - label: C
    content: 家屬想要忘記喪女之痛，因此極力否認
  - label: D
    content: 中國曾與日本在太平洋戰場上作戰，想降低新政府的敵意
