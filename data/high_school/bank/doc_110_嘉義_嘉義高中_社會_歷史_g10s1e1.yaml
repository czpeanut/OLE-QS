  stem: 依據中日馬關條約第五款規定：「本約批准互換之後，限二年之內，日本准中國讓與地方人民願遷居讓與地方之外者，任便變賣所有產業退去界外。但限滿之後尚未遷徙者，酌宜視為日本臣民。」請問上述資料與下列何者有關？
  options:
  - label: A
    content: 規定日本取得臺灣等地的合法性
