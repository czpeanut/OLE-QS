  stem: 泰北地區建起一間間華校，而這些□□的後代，為了「傳承中華文化」，紛紛到華語學校教華語。這些身分在法律層面上屬於泰國人，但心裡卻是留存著對中華民國的認同，是◎◎戰爭時期被遺忘的一群人。政治意識濃厚，幾乎是學校每棟建築不可避免的現象。除了泰國國旗、泰王遺照佈置了所有能看見的天花板空間一半之外，因為歷史問題，另一半掛的則是「中華民國國旗」與孫中山遺像，比例恰好各半，請問根據上文的線索，空白處應填入下列何者？
