  stem: 下列有關甲、乙二文中「故居」的敘述；最適當的是：
  options:
  - label: A
    content: 二文皆是作者離鄉多年後，偶爾回故居暫住的憶往之作
  - label: B
    content: 二文皆透過作者與親人昔日在故居中的對話，表達對親人已逝的傷懷
  - label: C
    content: 甲文的「重返故居」顯示思親之切，乙文的「室壞不修」暗示作者尚未走出喪妻之痛
  - label: D
    content: 甲文直接指出作者與家人曾同住故居62年，乙文則以「五年」、「六年」揭示作者與妻曾同住故居11年
  group_stem: 閱讀甲、乙二文，回答27-28題。 甲、 我一面吸吮咀嚼那金色的甘芳，一面流下淚來。我家，因父親的關係，自民國42年至民國104年擁有一棟宿舍，我們在其間生活成長。然後，父母相繼棄世，我們必須還屋。把這棟曾在狂風驟雨之夜與我們相依為命的房舍繳交回國防部。而這芒果，就是我跑到屏東故宅──那棟不再屬於我的故宅中去摘來的。 這是故宅院子裡西邊那棵樹上的。從前，母親身體安祥時，芒果季節我們若未回家，她常會打包寄來臺北。「臺北沒芒果賣了嗎？你就不能省點心嗎？」父親咕咕嚷嚷，然而母親還是照寄。 今朝晨涼中，趁我齒牙猶健，鼻舌尚敏，我來啖我昔日故園中的果實，來重溫我猶暖的對雙親的感念。（改寫自張曉風〈這些芒果，是偷來的嗎？〉） 乙、 余既為此志，後五年，吾妻來歸，時至軒中，從余問古事，或憑几學書。吾妻歸寧，述諸小妹語曰：「聞姊家有閤子，且何謂閤子也？」其後六年，吾妻死，室壞不修。其後二年，余久臥病無聊，乃使人復葺南閤子，其制稍異於前。然自後余多在外，不常居。 庭有枇杷樹，吾妻死之年所手植也，今已亭亭如蓋矣。（歸有光〈項脊軒志〉）
  answer:
  - C
