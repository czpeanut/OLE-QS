  stem: 徐志摩一生傳奇，連死亡都讓世人震驚。一代才子英年早逝，親人好友齊聚送他最後一程，輓聯中可見每個人不同的哀傷之情： 考史詩所載，沉湘捉月，文人橫死，各有傷心。爾本超然，豈期邂逅罡風，亦遭慘劫！ 自襁褓以來，求學從師，夫婦保持，最憐獨子。母今逝矣，忍使淒涼老父，重賦招魂？ ──徐父 徐申如 多少前塵成噩夢，五載哀歡，匆匆永訣，天道復奚論，欲死未能因母老； 萬千別恨向誰言，一身愁病，渺渺離魂，人間應不久，遺文編就答君心？ ──陸小曼 談話是詩，舉動是詩，畢生行徑都是詩，詩的意味滲透了，隨遇自有樂土。 乘船可死，驅車可死，斗室生臥也可死，死於飛機偶然者，不必視為畏途。 ──蔡元培 有關上述三幅輓聯的敘述，下列何者<u>有誤</u>？
  options:
  - label: A
    content: 徐父將愛子之死與屈原沉江、李白撈月並論，可見徐父認同志摩作為詩人的成就
  - label: B
    content: 老伴已逝，獨子又意外早夭，可憐白髮人送黑髮人，思及徐父晚景，真令人不忍
  - label: C
    content: 小曼的輓聯流露了與志摩五年共處、驟失愛侶的悲痛，別愁也讓她健康狀況不佳
  - label: D
    content: 蔡元培下聯展現「人生百年終歸一死」的豁達，認同對酒當歌，人生宜及時行樂
  answer:
  - D
