  group_stem: 閱讀下文，回答21-22題： 在閱讀〈再別康橋〉後，徽徽對康橋十分嚮往，打算親自走訪徐志摩筆下「性靈的故鄉」，規劃一場「康橋文學之旅」。她蒐集了甲、乙二份資料，並根據資料規劃了一份旅行筆記(丙)。 甲、 這河身的兩岸都是四季常青最蔥翠的草坪。從校友居的樓上望去，對岸草場上，不論早晚，永遠有十數匹黃牛與白馬，脛蹄沒在恣蔓的草叢中，從容的在咬嚼，星星的黃花在風中動盪，應和著它們尾鬃的掃拂。橋的兩端有斜倚的垂柳與椈蔭護住，水是澈底的清澄，深不足四尺，勻勻的長著長條的水草。這岸邊的草坪又是我的愛寵，在清朝，在傍晚，我常去這天然的織錦上坐地，有時讀書，有時看水；有時仰臥著看天空的行雲，有時反仆著摟抱大地的溫軟。 但河上的風流還不只兩岸的秀麗。你得買船去玩。船不只一種：有普通的雙槳划船，有輕快的薄皮舟（cAnoe），有最別緻的長形撐篙船（punt）。最末的一種是別處不常有的：約莫有二丈長，三尺寬，你站直在船梢上用長竿撐著走的。這撐是一種技術。我手腳太蠢，始終不曾學會。 你站在橋上去看人家撐，那多不費勁，多美！尤其在禮拜天有幾個專家的女郎，穿一身縞素衣服，裙裾在風前悠悠的飄著，戴一頂寬邊的薄紗帽，帽影在水草間顫動，你看她們出橋洞時的姿態，撚起一根竟像沒分量的長竿，只輕輕的，不經心的往波心裡一點，身子微微的一蹲，這船身便波的轉出了橋影，翠條魚似的向前滑了去。她們那敏捷，那閒暇，那輕盈，真是值得歌詠的。 在初夏陽光漸暖時你去買一隻小船，划去橋邊蔭下躺著念你的書或是做你的夢，槐花香在水面上飄浮，魚群的唼喋聲在你的耳邊挑逗。或是在初秋的黃昏，近著新月的寒光，望上流僻靜處遠去。愛熱鬧的少年們攜著他們的女友，在船沿上支著雙雙的東洋綵紙燈，帶著話匣子，船心裡用軟墊鋪著，也開向無人跡處去享他們的野福──誰不愛聽那水底翻的音樂在靜定的河上描寫夢境與春光！（徐志摩〈我所知道的康橋〉） 乙、 丙、
