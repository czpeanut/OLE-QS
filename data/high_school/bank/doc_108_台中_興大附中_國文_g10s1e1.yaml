  stem: 閱讀下列引文，並依文意推敲，將□□填入最適當的詞語： 帶一卷書，走十里路，選一塊清靜地，看天，聽鳥，讀書，倦了時，和身在草綿綿處尋夢去──你能想像更適情更適性的消遣嗎？陸放翁有一聯詩句：「□□□□□□□，□□□□□□□。」這是做地方官的風流。我在康橋時雖沒馬騎，沒轎子坐，卻也有我的風流；我常常在夕陽西曬時騎了車迎著天邊扁大的日頭直追。日頭是追不到的，我沒有夸父的荒誕，但晚景的溫存卻被我這樣偷嘗了不少。（徐志摩〈我所知道的康橋〉）
