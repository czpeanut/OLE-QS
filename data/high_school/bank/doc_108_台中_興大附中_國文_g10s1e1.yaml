  stem: 貞元末，五坊小兒張捕鳥雀於閭里，皆為暴橫以取錢物。至有張羅網於門，不許人出入者。或有張井上者，使不得汲水，近之輒曰：「汝驚供奉鳥雀」，痛毆之。出錢物求謝，乃去。或相聚飲食於肆，醉飽而去，賣者或不知，就索其直，多被毆罵。或時留蛇一囊為質，曰：「此蛇所以置鳥雀而捕之者，今留付汝，幸善飼之，勿令飢渴。」賣者愧謝求哀，乃攜而去。上在春宮時則知其弊，常欲奏禁之。至即位，遂推而行之，人情大悅。（韓愈《順宗實錄．五坊小兒》） 【注釋】 五坊小兒，為唐德宗時所設之職位，為獲得鷹犬以供打獵玩樂之用。五坊，指鵰坊、鶻坊、鷂坊、鷹坊、狗坊。 根據上文的敘述，五坊小兒「留蛇一囊為質」，其主要目的是：
  options:
  - label: A
    content: 自己懶得養蛇，故意叫店家幫忙
  - label: B
    content: 耍賴白吃白喝，並威脅恐嚇店家
  - label: C
    content: 知道自己白吃白喝，故留下等值的東西作抵押
  - label: D
    content: 擔心店家不肯放他們走，被迫留下捕雀鳥的蛇
  answer:
  - B
