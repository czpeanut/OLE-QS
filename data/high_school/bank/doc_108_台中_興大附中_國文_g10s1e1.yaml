  stem: 有關古文和駢文的比較，敘述正確的選項是：
  options:
  - label: A
    content: 古文又稱散文，蘊含「文以載道」的教化功能；駢文又稱四六文，具形式的美化價值
  - label: B
    content: 古文指的是先秦兩漢的散文；駢文主要盛於六朝，故又稱六朝文，唐代又稱為八股文
  - label: C
    content: 唐代古文運動韓愈為首先倡導的人物，主張以「古文」取代「駢文」，駢文自此消聲匿跡，古文自唐代以後成為文章正宗
  - label: D
    content: 韓愈、柳宗元為古文大家，歐陽脩、曾鞏、王安石等則為駢文大家
  answer:
  - A
