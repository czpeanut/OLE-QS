  group_stem: 閱讀下列(甲)(乙)二文，回答33-34題。 甲、 得生書，言為師之說，怪樸所作〈師友箴〉與〈答韋中立書〉，欲變僕不為師之志，而屈己為弟子。凡僕所為二文，其卒果不異。僕之所避者名也，所憂者其實也，實不可一日忘。僕聊歌以為箴，行且求中以益己，慄慄不敢暇，又不敢自謂有可師於人者耳。若乃名者，方為薄世笑罵，僕脆怯，尤不足當也。內不足為，外不足當，眾口雖懇懇見迫，其若吾子何？實之要，二文中皆是也，吾子其詳讀之，僕見解不出此。…… 今世固不少章句師，僕幸非其人。吾子欲之，（汝）其有樂而望吾子者矣。言道、講古、窮文辭以為師，則固吾屬事。僕才能勇敢不如韓退之，故又不為人師。（柳宗元〈答嚴厚輿秀才論為師道書〉） 乙、 唐德宗貞元十八年（西元802年），十七歲的少年李蟠不顧當時的社會氣氛，求學古文於韓愈，韓愈「嘉其能行古道」，寫下了〈師說〉這篇文章相贈，文中引經據典，批判了士大夫恥於從師問學的心態。當時韓愈三十五歲，在國子監任四門博士，仕途雖不順遂，但提攜後進不遺餘力，當時學子多投奔在他門下，經過他的指點獎掖，往往知名。隔年李蟠中舉，韓愈轉任監察御史，卻因上書批評宮市而觸怒德宗，貶為陽山縣令，從此宦海浮沉，屢經播遷。 這是前中年期的韓愈，一心以復興儒學為己任。他以為老師的責任在於「傳道、授業、解惑」，是先王之教的仁義道德。他所要對抗的是六朝以來尊崇佛老的風氣，想要恢復的是兩漢以上儒者稱師的傳統，期望能輔佐明主，開創事功。但孜孜矻矻十餘年，終究累了。（吳岱穎〈站在高崗上：讀「師說」〉）
