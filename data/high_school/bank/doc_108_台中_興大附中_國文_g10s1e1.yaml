  group_stem: 閱讀下文，回答23-24題： 法國詩人波特萊爾曾描寫在南京市郊散步卻沒戴手表的傳教士，在路邊問一個小男孩幾點鐘？小男孩遲疑了，然後又改變態度回答：「我立刻告訴你。」一會兒工夫以後，他又出現了，手裡抱著一隻又大又肥的貓。像一般人所說的，他在貓眼睛裡望了一下，一面毫不遲疑地說：「還沒有完全到中午。」 那是真的。我們貓兒的眼睛有演化的能力，陽光強烈反而睜不開眼，瞳孔成一直線，最適應的反而是夜晚較暗的時刻，什麼也逃不過在黑暗中又圓又亮的貓眼。從我們的眼睛，只要你有心，真的可以看見時鐘。不僅於此，我們自己的內心也有一個「貓鐘」。 以我為例，周一到周五，我們早餐的時間都差不多在七點半，而我六點四十五分，便守在貓奴床邊，一秒不差，偶爾她晚醒，我會很克制的體諒，耐心等候，動也不動，超過半小時，她還不醒，實在擔心她遲到，遂伸出前掌，輕輕拍醒她。 一個有暖陽的周末下午，朋友來訪，與貓奴下午荼，聊得興味正濃，都趴在陽光下睡覺的我，終於醒了，伸伸懶腰，轉身對貓奴喵喵叫，在她腿邊撒嬌磨蹭，貓奴對朋友說：「啊，五點了，要不要一起晚餐啊？」朋友十分驚訝：「妳怎麼知道五點？」「哈，我家的貓都五點吃晚餐，準時叫，像鬧鐘一樣。」滿腹疑問的朋友打開手機一看：「17：01」，眼神雖談不上百分百相信，但至少沒懷疑了。 這是真的。老是同樣的時辰，同樣的規律，儘管沒有時鐘的指針，但我的眼睛反映著你們人類的時間，精確如鐘。（歸靜〈貓鐘〉）
  answer:
  - B
