  stem: 請問$\sqrt{3- 2\sqrt{10}}$、$\frac{1}{\sqrt{10}}$、$(-10 )^{\frac{1}{2}}$、$\log \sqrt{10}$、$10^{-\frac{1}{2}}$，在數線上代表多少個相異點？
