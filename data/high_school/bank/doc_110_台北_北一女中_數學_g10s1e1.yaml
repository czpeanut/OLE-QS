  - label: B
    content: 無理數和有理數之間，至少存在一個無理數
  - label: C
    content: 若 3a＋b 為有理數，a－2b 為有理數，則 a，b 皆為有理數
  - label: D
    content: 給定一個單位線段長，可用尺規作圖畫出$\frac{110}{2021}+ 12\sqrt{12}$的線段長
