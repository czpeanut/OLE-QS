  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：反例：a＝0，b＝$\frac{1}{\pi}$，c＝1，d＝0，則 a＋bπ＝c＋dπ，但 a≠c，且 b≠d

    (B)○：令 a 為無理數，b 為有理數，

