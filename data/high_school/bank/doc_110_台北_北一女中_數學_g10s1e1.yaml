- id: doc_110_台北_北一女中_數學_g10s1e1_s4_1
  section: 4
  number: 1
  type: single
  page: 3
  stem: '<u>小綠</u>在健檢時得知自己的血紅素濃度為 16（g∕dL）。當氧合血紅蛋白濃度低於 x（g∕dL）時，就為異常狀態，因此<u>小綠</u>使用血氧計檢測得到 $SpO_{2 }$％的數據再進行換算。

    請問若為異常狀態 93 ％時，x 的範圍符合哪一個不等式？（單選題，4 分）'
  options:
  - label: A
    content: ∣x－0.93∣≤ 0.02
  - label: B
    content: ∣x－93∣≤ 2
  - label: C
    content: ∣x－14.88∣≤ 0.32
  - label: D
    content: ∣x－14.88∣≤ 3.2
  group_stem: '疫情升溫，許多患者看似正常，血氧濃度卻已低到亮紅燈，民眾紛紛搶買血氧計，避免「快樂缺氧」（Happy Hypoxia）上身。正常來說，人體血氧濃度應高於 93％，一旦低於 93％就屬異常，低於 90％就需以氧氣治療，低於 80％恐損害器官功能。

    摘錄自 2021.06.18 中央社報導

    已知血氧飽和濃度 $SpO_{2 }$％的計算公式

    $SpO_{2 }$％＝$\frac{氧合血紅蛋白濃度(g∕dL)}{血紅素濃度(g∕dL)}$×100％，市面上血氧計（含穿戴裝置的血氧計功能）測得之讀數為血氧飽和濃度 $SpO_{2 }$％的數據，其誤差為± 2（％）。

