- id: doc_110_台北_北一女中_數學_g10s1e1_s3_7
  section: 3
  number: 7
  type: fill
  page: 2
  stem: '為了方便表示很大的整數，1976 年<u>美國</u>電腦科學家<u>高德納</u>（Donald Knuth）設計出一種箭號表示法用來表示很大的整數。其記錄方法如下：定義雙箭號↑↑為重複的冪運算： a↑↑b＝$a_{b個}^{a^{a^{⋰^{a}}}}$。

    例如：5↑↑2＝$5^{5}$＝3125，3↑↑3＝$3^{3^{3}}$＝$3^{27}$＝7625597484987

    試求，2↑↑5 是＿＿＿＿位數？'
  explanation: '2 ↑↑ 5＝$2^{2^{2^{2^{2}}}}$＝$2^{2^{2^{4}}}$

    ＝$2^{2^{16}}$＝$2^{65536}$

    ＝$10^{65536 log2}$

    $\approx10^{19728.3……}$

    故為 19729 位數'
