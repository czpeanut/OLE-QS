- id: doc_110_桃園_武陵_數學_數甲_g12s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: '試求以下函數的導數：

    (1) f（x）＝$x^{5}$－$7x^{2}$＋6x－1，f''(1)＝＿＿＿＿。

    (2) f（x）＝（$x^{2}$＋3x－1）（$5x^{3}$－$2x^{2}$＋3），f''(1)＝＿＿＿＿。

    (3) f（x）＝（$2x^{3}$－x）$^{3}$，f''(1)＝＿＿＿＿。

    (4) f（x）＝$\frac{4x^{2}+ 2x - 5}{x^{2}+ 3}$，f''(1)＝＿＿＿＿。'
  answer:
  - (1)－3；(2) 63；(3) 15；(4) $\frac{19}{8}$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) f''（x）＝$5x^{4}$－14x＋6 ∴f''(1)＝5－14＋6＝－3

    (2) f''（x）＝（2x＋3）（$5x^{3}$－$2x^{2}$＋3）＋（$x^{2}$＋3x－1）（$15x^{2}$－4x）

    ∴f''(1)＝5×6＋3×11＝63

    (3) f''（x）＝3（$2x^{3}$－x）$^{2}$（$6x^{2}$－1）

    ∴f''(1)＝3×$1^{2}$×5＝15

    (4) f''（x）＝$\frac{( 8x + 2 ) ( x^{2}+ 3 )-( 4x^{2}+2x - 5 ) ( 2x )}{( x^{2}+3 )^{2}}$

    ∴f''(1)＝$\frac{10\times 4 - 1\times 2}{4^{2}}$＝$\frac{38}{16}$＝$\frac{19}{8}$'
