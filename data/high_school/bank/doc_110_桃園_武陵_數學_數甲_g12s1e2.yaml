- id: doc_110_桃園_武陵_數學_數甲_g12s1e2_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: '若 a、b 為實數，已知 f（x）＝$\begin{cases}x^{2}+ax +b , x\geq 3 \\ bx + 2a , x < 3\end{cases}$為可微分函數，試求數對（a，b）＝

    ＿＿＿＿。'
  answer:
  - （－3，3）
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$\begin{cases}x^{2}+ax +b , x\geq 3 \\ bx + 2a , x < 3\end{cases}\Rightarrow$f''（x）＝$\begin{cases}2x+a , x\geq 3 \\ b , x < 3\end{cases}$

    由 f(3)＝$3^{2}$＋3a＋b＝3b＋2a

    及 f''(3)＝2×3＋a＝b

    $\Rightarrow\begin{cases}a - 2b =-9 \\ a -b =-6\end{cases}\Rightarrow$a＝－3，b＝3

    故數對（a，b）＝（－3，3）'
- id: doc_110_桃園_武陵_數學_數甲_g12s1e2_s2_4
  section: 2
  number: 4
  type: fill
  page: 1
  stem: 假設 k 為實數，且三次函數 f（x）＝（k＋1）$x^{3}$－$2kx^{2}$＋kx－1 有極值，試求可能的 k 的範圍為＿＿＿＿。
  answer:
  - k＜0 或 k＞3，且 k≠－1
  answer_status: verified
  answer_source: answer_key
  explanation: '三次函數 f（x）有極值

    $\Rightarrow$f''（x）＝3（k＋1）$x^{2}$－4kx＋k＝0 有兩相異實根

    $\Rightarrow$（－4k）$^{2}$－4×3（k＋1）×k＞0

    $\Rightarrow$4k〔4k－3（k＋1）〕＞0

    $\Rightarrow$4k（k－3）＞0

    $\Rightarrow$k＜0 或 k＞3

    又 3（k＋1）≠0$\Rightarrow$k≠－1

    故 k 的範圍為 k＜0 或 k＞3，且 k≠－1'
- id: doc_110_桃園_武陵_數學_數甲_g12s1e2_s2_5
  section: 2
  number: 5
  type: fill
  page: 1
  stem: 求過 f（x）＝$\frac{2}{3}\sqrt{9 - x^{2}}$函數圖形上一點$\left( 1 , \frac{4\sqrt{2}}{3} \right)$的切線斜率為＿＿＿＿。
  answer:
  - $-\frac{\sqrt{2}}{6}$
  answer_status: verified
  answer_source: answer_key
  explanation: '切線斜率為

    f''(1)＝$\lim_{x \rightarrow 1} \frac{f ( x )-f ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1} \frac{\frac{2\sqrt{9 - x^{2}}}{3}-\frac{4\sqrt{2}}{3}}{x - 1}$＝$\lim_{x \rightarrow 1} \frac{2\sqrt{9-x^{2}} - 4\sqrt{2}}{3 ( x - 1 )}$

    ＝$\lim_{x \rightarrow 1} \frac{( 2\sqrt{9 -x^{2}} - 4\sqrt{2} ) ( 2\sqrt{9 -x^{2}} + 4\sqrt{2} )}{3 ( x - 1 ) ( 2\sqrt{9 -x^{2}} + 4\sqrt{2} )}$＝$\lim_{x \rightarrow 1} \frac{4 ( 9 -x^{2} )- 32}{3 ( x - 1 ) ( 2\sqrt{9 -x^{2}} + 4\sqrt{2} )}$

    ＝$\lim_{x \rightarrow 1} \frac{-4 ( x^{2}-1 )}{3 ( x - 1 ) ( 2\sqrt{9 -x^{2}} + 4\sqrt{2} )}$＝$\lim_{x \rightarrow 1} \frac{-4 ( x + 1 )}{3 ( 2\sqrt{9 -x^{2}} + 4\sqrt{2} )}$＝$\frac{-4\times 2}{3 ( 2\times 2\sqrt{2} + 4\sqrt{2} )}$

    ＝$\frac{-8}{24\sqrt{2}}$＝$-\frac{\sqrt{2}}{6}$'
- id: doc_110_桃園_武陵_數學_數甲_g12s1e2_s2_6
  section: 2
  number: 6
  type: fill
  page: 1
  stem: 已知 f（x）＝$x^{3}$＋$2x^{2}$－7x＋4。若過（4，0）對 y＝f（x）所做的切線有三條，則其中斜率小於零的切線方程式為＿＿＿＿。
  answer:
  - y＝－3x＋12
  answer_status: verified
  answer_source: answer_key
  explanation: '設切點為（a，$a^{3}$＋$2a^{2}$－7a＋4）

    f''（x）＝$3x^{2}$＋4x－7$\Rightarrow$f''（a）＝$3a^{2}$＋4a－7

    $\Rightarrow$切線方程式為 y－（$a^{3}$＋$2a^{2}$－7a＋4）＝（$3a^{2}$＋4a－7）（x－a）

    過（4，0）$\Rightarrow$0－（$a^{3}$＋$2a^{2}$－7a＋4）＝（$3a^{2}$＋4a－7）（4－a）

    $\Rightarrow$－（a－1）$^{2}$（a＋4）＝（a－1）（3a＋7）（4－a）

    $\Rightarrow$（a－1）〔（a－1）（a＋4）－（3a＋7）（a－4）〕＝0

    $\Rightarrow$（a－1）〔（$a^{2}$＋3a－4）－（$3a^{2}$－5a－28）〕＝0

    $\Rightarrow$（a－1）（－$2a^{2}$＋8a＋24）＝0

    $\Rightarrow$（a－1）（$a^{2}$－4a－12）＝0

    $\Rightarrow$（a－1）（a＋2）（a－6）＝0

    $\Rightarrow$a＝1，－2，6

    斜率分別為 f''(1)＝3×$1^{2}$＋4×1－7＝0

    f''（－2）＝3（－2）$^{2}$＋4（－2）－7＝－3

    f''(6)＝3×$6^{2}$＋4×6－7＝125

    ∴所求為 y－0＝－3（x－4）$\Rightarrow$y＝－3x＋12'
- id: doc_110_桃園_武陵_數學_數甲_g12s1e2_s3_1
  section: 3
  number: 1
  type: multiple
  page: 1
  stem: 已知 f（x）＝$x^{4}$－$2x^{3}$＋$x^{2}$－x＋2，試選出正確的選項。
  options:
  - label: A
    content: f（x）在 x＝0 處的一次近似為 y＝－x＋2
  - label: B
    content: f（x）在 x＝1 處的一次近似為 y＝－x＋2
  - label: C
    content: f（0.001）的近似值取至小數點後第三位的值為 1.999
  - label: D
    content: f（x）函數圖形在區間（0，1）處為凹口向下
  - label: E
    content: f（x）＋x－2 恆不小於零
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$4x^{3}$－$6x^{2}$＋2x－1

    (A)○：一次近似為 y－f(0)＝f''(0)（x－0）$\Rightarrow$y－2＝－x$\Rightarrow$y＝－x＋2

    (B)○：一次近似為 y－f(1)＝f''(1)（x－1）$\Rightarrow$y－1＝（－1）（x－1）$\Rightarrow$y＝－x＋2

    (C)○：f（0.001）＝2－（0.001）＋（0.001）$^{2}$－2（0.001）$^{3}$＋（0.001）$^{4}$

    ＝2－0.001＋0.000001－……$\approx$1.999

    (D)╳：f''''（x）＝$12x^{2}$－12x＋2＝$12 \left( x -\frac{1}{2} \right) ^{2}- 1$

    f''''(0)＝2，f''''(1)＝2，$f '''' \left( \frac{1}{2} \right)$＝－1

    ∴f''''（x）在區間（0，1）之間的值不恆為負

    即不為凹口向下

    (E)○：f（x）＋x－2＝（$x^{4}$－$2x^{3}$＋$x^{2}$－x＋2）＋x－2

    ＝$x^{4}$－$2x^{3}$＋$x^{2}$＝$x^{2}$（$x^{2}$－2x＋1）

    ＝$x^{2}$（x－1）$^{2}\geq$0 恆成立

    故選(A)(B)(C)(E)'
