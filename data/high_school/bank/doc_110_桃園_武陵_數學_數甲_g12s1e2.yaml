  stem: '汽車在行駛的時候，當行駛速度不同時，耗油的情形也會有所不同，一般來說，速度過低或過高都會產生不必要的耗油。已知當某臺汽車以速度 v（單位：公里／小時）均速直線行駛時（v$\geq$10），每小時耗油量 f（v）（單位：公升／小時）為 f（v）＝0.$0025v^{2}$－0.2v＋16。試回答下列問題：

    (1) 若駕駛以時速 40（公里／小時）等速直線行駛於國道上，則此時汽車行駛每公里需要消耗多少公升汽油？（單選，2 分）

    (2) 若駕駛以時速 v（公里／小時）等速直線行駛於國道上，則此時汽車行駛每公里需要消耗多少公升汽油？（請以 v 的函數形式表示）（2 分）

    (3) 若<u>小武</u>想要以經濟時速（使汽車行駛每公里油耗量最少的速度）等速直線行駛於國道上，則<u>小武</u>需要以多少的速度行駛？此時汽車行駛每公里需要消耗多少公升汽油？（4 分）'
  options:
  - label: A
    content: 20 公升
  - label: B
    content: 16 公升
  - label: C
    content: 12 公升
  - label: D
    content: 3 公升
  - label: E
    content: 0.3 公升
