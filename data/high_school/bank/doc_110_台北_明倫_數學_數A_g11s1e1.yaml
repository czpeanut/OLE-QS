  stem: △ABC 中，已知 cosA＝$\frac{3}{5}$，cosB＝$\frac{1}{5\sqrt{2}}$，則∠C＝＿＿＿＿。
  explanation: '∵cosA＝$\frac{3}{5}$ ∴sinA＝$\frac{4}{5}$

    ∵cosB＝$\frac{1}{5\sqrt{2}}$ ∴sinB＝$\sqrt{1 - \cos ^{2}B}$＝$\sqrt{1 - \left( \frac{1}{5\sqrt{2}} \right) ^{2}}$＝$\sqrt{\frac{50 - 1}{50}}$＝$\frac{7}{5\sqrt{2}}$

    ∵cosC＝cos〔180°－（A＋B）〕＝－cos（A＋B）

    ＝－（cosA cosB－sinA sinB）＝sinA sinB－cosA cosB

    ＝$\frac{4}{5} \cdot \frac{7}{5\sqrt{2}} - \frac{3}{5} \cdot \frac{1}{5\sqrt{2}}$

    ＝$\frac{25}{25\sqrt{2}}$＝$\frac{1}{\sqrt{2}}$

    ∴∠C＝45°'
