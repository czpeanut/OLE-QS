- id: doc_110_台北_明倫_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 哪些不等式成立？
  options:
  - label: A
    content: sinπ＞sinπ°
  - label: B
    content: cosπ＞cosπ°
  - label: C
    content: cosπ°＞sinπ°
  - label: D
    content: tanπ＞tanπ°
  - label: E
    content: $\sin \frac{\sqrt{3}}{2}$＜$\frac{\sqrt{3}}{2}$
  explanation: '(A)╳：∵sinπ＝0，又 sinπ°＞0

    ∴sinπ＜sinπ°

    (B)╳：∵cosπ＝－1，又 cosπ°＞0

    ∴cosπ＜cosπ°

    (C)○：cosπ°$\approx$cos3.14°＝sin86.86°＞sin3.14°$\approx$sinπ°

    (D)╳：tanπ＝0，又 tanπ°＞0

    ∴tanπ＜tanπ°

    (E)○：$\sin \frac{\sqrt{3}}{2}\approx\sin \left( \frac{\sqrt{3}}{2} \cdot 57.3^{^{\circ}} \right)$＜sin57.3°＜sin60°＝$\frac{\sqrt{3}}{2}$

    故選(C)(E)'
- id: doc_110_台北_明倫_數學_數A_g11s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 下列各函數的週期，何者是π？
  options:
  - label: A
    content: y＝sinx
  - label: B
    content: y＝2｜cosx｜
  - label: C
    content: y＝tanx
  - label: D
    content: y＝sinπx
  - label: E
    content: y＝3 sin2x＋5
  explanation: '(A)╳：∵y＝sinx 的週期為 2π

    (B)○：令 y＝f（x）＝2｜cosx｜

    ∴f（x＋π）＝2｜cos（x＋π）｜＝2｜－cosx｜＝2｜cosx｜＝f（x）

    又$f\left( x + \frac{\pi}{2} \right)$＝$2 \left| \cos \left( x + \frac{\pi}{2} \right) \right|$＝2｜－sinx｜＝2｜sinx｜≠2｜cosx｜＝f（x）

    ∴y＝2｜cosx｜的週期為π

    (C)○：∵y＝tanx 的週期為π

    (D)╳：∵y＝sinπx 的週期為$\frac{2\pi}{\left| \pi \right|}$＝2

    (E)○：∵y＝3 sin2x＋5 的週期為$\frac{2\pi}{\left| 2 \right|}$＝π

    故選(B)(C)(E)'
- id: doc_110_台北_明倫_數學_數A_g11s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 若函數 f（x）＝$\sqrt{3}\sin 3x - \cos 3x + 2$，則下列哪些選項是正確的？
  options:
  - label: A
    content: －2$\leq$f（x）$\leq$2
  - label: B
    content: f（x）在 x＝$\frac{2\pi}{9}$時有最大值
  - label: C
    content: f（x）的週期為$\frac{\pi}{3}$
  - label: D
    content: f(1)＞2
  - label: E
    content: y＝f（x）的圖形對稱於直線 x＝$\frac{5\pi}{9}$
  explanation: '∵f（x）＝$\sqrt{3}\sin 3x - \cos 3x + 2$

    ＝$\sqrt{(\sqrt{3})^{2} + 1^{2}}\left( \sin 3x \cdot \frac{\sqrt{3}}{2} - \cos 3x \cdot \frac{1}{2} \right) + 2$

    ＝$2\left( \sin 3x\cos \frac{\pi}{6} - \cos 3x\sin \frac{\pi}{6} \right) + 2$

    ＝$2\sin \left( 3x - \frac{\pi}{6} \right) + 2$

    (A)╳：2．（－1）＋2$\leq$f（x）$\leq$2．1＋2

    ∴0$\leq$f（x）$\leq$4

    (B)○：$f\left( \frac{2\pi}{9} \right)$＝$2\sin \left( 3 \cdot \frac{2\pi}{9} - \frac{\pi}{6} \right) + 2$＝$2\sin \frac{\pi}{2} + 2$＝2．1＋2＝4 為最大值

    (C)╳：週期為$\frac{2\pi}{\left| 3 \right|}$＝$\frac{2\pi}{3}$

    (D)○：f(1)＝$2\sin \left( 3 \cdot 1 - \frac{\pi}{6} \right) + 2\approx$2 sin（3．57.3°－30°）＋2

    ＝2 sin141.9°＋2＝2 sin（180°－38.1°）＋2

    ＝2 sin38.1°＋2＞2．0＋2＝2

    (E)○：x＝$\frac{5\pi}{9}$代入$3x - \frac{\pi}{6}$＝$3 \cdot \frac{5\pi}{9} - \frac{\pi}{6}$＝$\frac{5\pi}{3} - \frac{\pi}{6}$＝$\frac{10\pi - \pi}{6}$＝$\frac{9\pi}{6}$＝$\frac{3\pi}{2}$ 此處為波谷所在的位置

    故選(B)(D)(E)'
