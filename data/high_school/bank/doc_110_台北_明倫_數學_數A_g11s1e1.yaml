      - 256.1
      - 564.3
      - 348.0
  explanation: '(1) ∵r＝$\frac{1}{2}\overline{OA}$，又∠ACO＝90°

    ∴∠OAC＝30°$\Rightarrow$∠AOC＝60°

    同理∠BOD＝60°

    ∴∠COD＝180°－（∠AOC＋∠BOD）＝180°－（60°＋60°）＝60°＝$\frac{\pi}{3}$

    (2) ∵$\overline{OA}$＝$4\sqrt{2}$，又$\overline{OC}$＝$\frac{1}{2}\overline{OA}$＝$\frac{1}{2} \times 4\sqrt{2}$＝$2\sqrt{2}$

    ∴$\overline{AC}$＝$\sqrt{(4\sqrt{2})^{2} - (2\sqrt{2})^{2}}$＝$2\sqrt{2} \times \sqrt{2^{2} - 1^{2}}$＝$2\sqrt{6}$

    同理$\overline{DB}$＝$2\sqrt{6}$

    ∵$\overparen{CD}$＝R．θ＝$2\sqrt{2} \cdot \frac{\pi}{3}$＝$\frac{2\sqrt{2}\pi}{3}$

    ∴$\overline{AC}$＋$\overparen{CD}$＋$\overline{DB}$＝$2\sqrt{6} + \frac{2\sqrt{2}\pi}{3} + 2\sqrt{6}$＝$\frac{2\sqrt{2}\pi}{3} + 4\sqrt{6}$'
- id: doc_110_台北_明倫_數學_數A_g11s1e1_s2_7
  section: 2
  number: 7
  type: fill
  page: 2
  stem: 將函數 y＝cosx 的圖形先沿垂直方向伸長為 2 倍，水平方向壓縮為$\frac{1}{3}$倍，再向左平移$\frac{\pi}{3}$單位，向上平移 4 單位可得 y＝a cos（bx＋c）＋d 的圖形，且 0＜c＜2π，則序組（a，b，c，d）＝ ＿＿＿＿。
  explanation: '∵y＝cosx$\xrightarrow[伸長為 2 倍]{垂直方向}$y＝2 cosx$\xrightarrow[壓縮為 \frac{1}{3} 倍]{水平方向}$y＝2 cos3x$\xrightarrow[\frac{\pi}{3} 單位]{向左平移}$y＝$2\cos \left[ 3 \cdot \left( x + \frac{\pi}{3} \right) \right]$

    $\xrightarrow[4 單位]{向上平移}$y＝2 cos（3x＋π）＋4＝a cos（bx＋c）＋d

    故序組（a，b，c，d）＝（2，3，π，4）'
- id: doc_110_台北_明倫_數學_數A_g11s1e1_s2_8
  section: 2
  number: 8
  type: fill
  page: 2
  stem: 比較 a＝cos1，b＝cos2，c＝cos3，d＝cos4 四者的大小關係為＿＿＿＿。
  explanation: '∵1 弳$\approx$57.3°

    a＝cos1$\approx$cos57.3°＞0

    b＝cos2$\approx$cos114.6°＝cos（180°－65.4°）＝－cos65.4°＜0

    c＝cos3$\approx$cos171.9°＝cos（180°－8.1°）＝－cos8.1°＜0

    d＝cos4$\approx$cos229.2°＝cos［180°－（－49.2°）］＝－cos49.2°＜0

    $\Rightarrow$cos8.1°＞cos49.2°＞cos65.4°

    $\Rightarrow$－cos8.1°＜－cos49.2°＜－cos65.4°

    $\Rightarrow$c＜d＜b

    故由大至小關係為 a＞b＞d＞c'
