  stem: '如右圖所示，每個小方格的邊長為 1，圓 O 的圓心為 O，半徑為$\frac{1}{2}\overline{OA}$；$\overset{\leftarrow \rightarrow}{AC}$與$\overset{\leftarrow \rightarrow}{BD}$均為圓 O 的切線，切點分別為 C 點與 D 點。則：

    (1) ∠COD＝＿＿＿＿。

    (2) 求線段$\overline{AC}$，圓弧$\overparen{CD}$及線段$\overline{DB}$的長度之和為＿＿＿＿。'
  assets:
  - key: s2_6_f1
    kind: figure
    file: doc_110_台北_明倫_數學_數A_g11s1e1/s2_6_f1.png
    crop:
