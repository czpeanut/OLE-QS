  stem: 下列敘述何者正確？
  options:
  - label: A
    content: $\sqrt{(x - 1)^{2} +(y + 2)^{2}} =\frac{∣ 4x + 3y + 2 ∣}{5}$的圖形是一拋物線
  - label: B
    content: $\sqrt{(x - 1)^{2} +(y + 2)^{2}} + \sqrt{(x - 1)^{2} +(y - 6)^{2}} = 8$的圖形是一橢圓
  - label: C
    content: $\sqrt{(x - 1)^{2} +(y + 2)^{2}} - \sqrt{(x - 1)^{2} +(y - 6)^{2}} = 6$的圖形是一雙曲線
  - label: D
    content: $\sqrt{(x - 1)^{2} +y^{2}} =\frac{∣ 4x - 3y + 2 ∣}{5}$的圖形是一拋物線
  - label: E
    content: $∣ \sqrt{(x - 1)^{2} +(y + 2)^{2}} - \sqrt{(x - 1)^{2} +y^{2}} ∣= 2$的圖形是一雙曲線
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台中_台中二中_數學_數甲_g12s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 在坐標平面上，下列哪些選項的條件可以決定唯一一個拋物線圖形？
  options:
  - label: A
    content: 以點 F（1，－2）為焦點，直線 y＝1 為準線
  - label: B
    content: 以點 F（1，－2）為焦點，點 V（3，0）為頂點
  - label: C
    content: 對稱軸平行 y 軸，且過（1，0）、（3，1）與（－1，－1）三點
  - label: D
    content: 過點（5，3）且與拋物線 $y^{2}$＝4x 共軸且共焦點
  - label: E
    content: 以 y 軸為準線，且過（4，5）與（9，－7）兩點
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台中_台中二中_數學_數甲_g12s2e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 下列各圖形中，哪些是以（0，4）為其焦點？
  options:
  - label: A
    content: $y^{2}$＝－16x
  - label: B
    content: $\frac{x^{2}}{25}+\frac{y^{2}}{9}= 1$
  - label: C
    content: $\frac{x^{2}}{10}+\frac{y^{2}}{26}= 1$
  - label: D
    content: $\frac{x^{2}}{10}-\frac{y^{2}}{6}= 1$
  - label: E
    content: $-\frac{x^{2}}{4}+\frac{y^{2}}{12}= 1$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵$y^{2}$＝－16x＝4（－4）（x－0） ∴V（0，0），F（－4，0）

    (B)╳：∵$\frac{x^{2}}{25}+\frac{y^{2}}{9}= 1$ ∴$a^{2}$＝25，$b^{2}$＝9

    $\Rightarrowc^{2}$＝$a^{2}$－$b^{2}$＝25－9＝16$\Rightarrow$c＝4 ∴F（± 4，0）

    (C)○：∵$\frac{x^{2}}{10}+\frac{y^{2}}{26}= 1$ ∴$a^{2}$＝26，$b^{2}$＝10

    $\Rightarrowc^{2}$＝$a^{2}$－$b^{2}$＝26－10＝16$\Rightarrow$c＝4 ∴F（0，± 4）

    (D)╳：∵$\frac{x^{2}}{10}-\frac{y^{2}}{6}= 1$ ∴$a^{2}$＝10，$b^{2}$＝6

    $\Rightarrowc^{2}$＝$a^{2}$＋$b^{2}$＝10＋6＝16$\Rightarrow$c＝4 ∴F（± 4，0）

    (E)○：∵$\frac{y^{2}}{12}-\frac{x^{2}}{4}= 1$ ∴$a^{2}$＝12，$b^{2}$＝4

    $\Rightarrowc^{2}$＝$a^{2}$＋$b^{2}$＝12＋4＝16$\Rightarrow$c＝4 ∴F（0，± 4）

    故選(C)(E)'
- id: doc_111_台中_台中二中_數學_數甲_g12s2e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: '試求橢圓$\frac{(x + 2)^{2}}{4}+\frac{(y - 2)^{2}}{9}= 1$

    (1) 焦點坐標為＿＿＿＿。

    (2) 若 P 為橢圓上一點且 $F_{1}$，$F_{2}$ 為兩焦點，則$\overline{PF_{1}} + \overline{PF_{2}}$＝＿＿＿＿。'
  answer:
  - (1)$(-2 , 2\pm \sqrt{5})$；(2) 6
  answer_status: verified
  answer_source: answer_key
  explanation: '∵Γ：$\frac{(x + 2)^{2}}{4}+\frac{(y - 2)^{2}}{9}= 1$

    ∴中心坐標為（－2，2），為上下型橢圓

    (1) ∵$a^{2}$＝9，$b^{2}$＝4

    ∴$c = \sqrt{a^{2} -b^{2}} = \sqrt{9 - 4} = \sqrt{5}$

    ∴焦點坐標為$(-2 , 2\pm \sqrt{5})$

    (2) $\overline{PF_{1}} + \overline{PF_{2}} = 2a = 2\times 3 = 6$'
- id: doc_111_台中_台中二中_數學_數甲_g12s2e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: '試求雙曲線$∣ \sqrt{(x - 3)^{2} +(y - 5)^{2}} - \sqrt{(x - 3)^{2} +(y + 5)^{2}} ∣= 6$

    (1) 焦點坐標為＿＿＿＿。

    (2) 漸近線方程式為＿＿＿＿。'
  answer:
  - (1)（3，± 5）；(2) 3x＋4y－9＝0，3x－4y－9＝0
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) Γ：$∣ \sqrt{(x - 3)^{2} +(y - 5)^{2}} - \sqrt{(x - 3)^{2} +(y + 5)^{2}} ∣= 6$

    ∴焦點坐標為（3，± 5）

    (2) 令 $F_{1}$（3，5），$F_{2}$（3，－5） ∴中心為（3，0）

    又$2c = \overline{F_{1}F_{2}} = 5 -(- 5)= 10$ ∴c＝5

    $∣ \overline{PF_{1}} - \overline{PF_{2}} ∣= 6 = 2a$ ∴a＝3

    ∴$b = \sqrt{c^{2} -a^{2}} = \sqrt{5^{2} -3^{2}} = 4$，且為上下型雙曲線

    ∴Γ：$\frac{y^{2}}{3^{2}}-\frac{(x - 3)^{2}}{4^{2}}= 1$

    令$\left( \frac{y}{3} \right) ^{2}- \left( \frac{x - 3}{4} \right) ^{2}= 0$

    故漸近線為 4y ± 3（x－3）＝0

    $\Rightarrow$3x＋4y－9＝0，3x－4y－9＝0'
