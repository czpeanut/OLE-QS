  answer:
  - －10－10i
  answer_status: verified
  answer_source: answer_key
  explanation: '令 S＝1＋2i＋$3i^{2}$＋……＋$20i^{19}$ ……………………①

    iS＝ i＋$2i^{2}$＋……＋$19i^{19}$＋$20i^{20}$ ……………②

    由①－②得（1－i）S＝（1＋i＋$i^{2}$＋……＋$i^{19}$）－20×$i^{20}$

    ＝$\frac{1\times (1 -i^{20})}{1 -i}- 20\times i^{20}$ （∵$i^{20}$＝（$i^{4}$）$^{5}$＝$1^{5}$＝1）

    ＝$\frac{1 - 1}{1 -i}- 20\times 1$＝－20

    ∴S＝$\frac{- 20}{1 -i}\times \frac{1 +i}{1 +i}$＝$\frac{- 20 (1 +i)}{1^{2} -i^{2}}$＝－10－10i'
