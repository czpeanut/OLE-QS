  stem: 全民健康保險制度採取「大小（病）都保」的醫療給付措施，一旦發生財務危機，須以納稅人的稅金補助。這種型態的健康保險比較偏向哪一類型的社會安全制度？
  options:
  - label: A
    content: 社會保險
  - label: B
    content: 社會救助
  - label: C
    content: 社會津貼
  - label: D
    content: 社會福利服務
  group_stem: 閱讀下文，回答第28題至第30題 我國的全民健康保險制度受到世界各國的讚美，美國印第安納大學醫學院教授Aaron E. Carroll與波士頓保健系統政策資源中心負責人Austin Frakt曾撰文，建議美國學習臺灣的醫療保險政策以造福民眾，不過亦提及我國健康保險制度的隱憂，例如臺灣邁向高齡化且出生率極低，導致繳納保險費用的人口基數變小，然而整體醫療費用卻持續上升等。 事實上，全民健康保險制度開辦之初，曾為了「保大（病）不保小（病）」或「大小（病）都保」之保險給付範圍有所爭執，最後決定採用「大小都保」的醫療給付措施，導致日後健康保險財務逐漸虧損並浮現諸多問題。2013年政府積極推動二代健康保險，增加補充保險費用與政府36％差額負擔，勉強改善健康保險的財黑洞。當時健康保險署長表示，此種做法只能暫時解決財務問題，唯有檢討制度面、減少濫用醫療資源，才能讓保險費用調漲出現轉機。民眾必須了解全民健康保險屬於使用者付費的社會保險，而不是免費的社會福利。善用醫療資源、珍惜保險給付、建立分級醫療的行為，才能讓全民健康保險制度永續經營。
