      - 564.3
      - 624.7
  explanation: '設$\vec{AD}=t\vec{AI}$

    $\vec{AI}=\frac{7}{15}\vec{AB}+\frac{1}{5}\vec{AC}$

    $\Rightarrowt\vec{AI}=\frac{7}{15}t\vec{AB}+\frac{1}{5}t\vec{AC}$

    $\Rightarrow\vec{AD}=\frac{7}{15}t\vec{AB}+\frac{1}{5}t\vec{AC}$

    由 D，B，C 三點共線

    $\Rightarrow\frac{7}{15}t +\frac{1}{5}t = 1$

    $\Rightarrow\frac{10}{15}t = 1\Rightarrowt =\frac{3}{2}$，得$\overline{AI} : \overline{ID} = 2 : 1$

    由內角平分線定理，

    $\overline{BD} : \overline{DC} = \overline{AB} : \overline{AC} = 3 : 7$

    $\Rightarrow$設$\overline{BD}$＝3k，$\overline{DC}$＝7k

    $\overline{BA} : \overline{BD} = \overline{AI} : \overline{ID}$

    $\Rightarrow$3：3k＝2：1

    $\Rightarrowk =\frac{1}{2}$

    所求$\overline{BC} = \overline{BD} + \overline{DC} = 10k = 10\times \frac{1}{2}= 5$'
