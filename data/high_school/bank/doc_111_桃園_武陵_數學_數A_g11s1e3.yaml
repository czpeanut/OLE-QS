  type: fill
  page: 3
  stem: 若$\begin{cases}a_{1}x +b_{1}y =c_{1} \\ a_{2}x +b_{2}y =c_{2}\end{cases}$之解為 x＝2，y＝6，試求$\begin{cases}(2a_{1} -b_{1})x - 3b_{1}y + 2c_{1} = 0 \\ (2a_{2} -b_{2})x - 3b_{2}y + 2c_{2} = 0\end{cases}$之解（x，y）＝ ＿＿＿＿。
  explanation: '$\begin{cases}a_{1}x +b_{1}y =c_{1} \\ a_{2}x +b_{2}y =c_{2}\end{cases}$之解為 x＝2，y＝6

    $\Rightarrow\begin{cases}a_{1} (2)+b_{1} (6)=c_{1} \\ a_{2} (2)+b_{2} (6)=c_{2}\end{cases}$ ……………………①

    則$\begin{cases}(2a_{1} -b_{1})x - 3b_{1}y + 2c_{1} = 0 \\ (2a_{2} -b_{2})x - 3b_{2}y + 2c_{2} = 0\end{cases}$

    $\Rightarrow\begin{cases}a_{1} (2x)+b_{1} (-x - 3y)=- 2c_{1} \\ a_{2} (2x)+b_{2} (-x - 3y)=- 2c_{2}\end{cases}$

    $\Rightarrow\begin{cases}a_{1}\left( \frac{2x}{- 2} \right) +b_{1}\left( \frac{-x - 3y}{- 2} \right) =c_{1} \\ a_{2}\left( \frac{2x}{- 2} \right) +b_{2}\left( \frac{-x - 3y}{- 2} \right) =c_{2}\end{cases}$……………②

    由①、②對照係數$\begin{cases}\frac{2x}{- 2}= 2 \\ \frac{-x - 3y}{- 2}= 6\end{cases}$

    故解（x，y）＝$\left( - 2 , \frac{14}{3} \right)$'
