  explanation: '設$\vec{a}$與$\vec{b}$的夾角為θ

    $\vec{b}$在$\vec{a}$上的正射影長度

    ＝$∣ ∣ \vec{b} ∣\cos \theta ∣$＝$\left| ∣ \vec{b} ∣ \times \frac{\vec{a} \cdot \vec{b}}{∣ \vec{a} ∣∣ \vec{b} ∣} \right|$＝$\left| \frac{\vec{a} \cdot \vec{b}}{∣ \vec{a} ∣} \right|$

    ＝$\left| \frac{(202 , - 101)\cdot (3 , t)}{101\sqrt{5}} \right|$＝$\left| \frac{606 - 101t}{101\sqrt{5}} \right|$

    ＝$\left| \frac{6 -t}{\sqrt{5}} \right|$＜1

    $\Rightarrow$－1＜$\frac{6 -t}{\sqrt{5}}$＜1

    $\Rightarrow- \sqrt{5}$＜6－t＜$\sqrt{5}$

    $\Rightarrow$6－t＝－2，－1，0，1，2

    故整數解 t 有 5 個'
