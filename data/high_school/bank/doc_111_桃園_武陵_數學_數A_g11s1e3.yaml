  explanation: 'P 點落在$BC\leftarrow \rightarrow$上$\Rightarrow$α＋β＝1，P 點落在$AC\leftarrow \rightarrow$上$\Rightarrow$α＝0

    故塗色區域滿足$\begin{cases}\alpha +\beta > 1 \\ \alpha < 0\end{cases}$

    由條件③，

    $∣ \left| \begin{matrix}\alpha \vec{AB} & \beta \vec{AC}\end{matrix} \right| ∣$＝$∣ \alpha \beta ∣∣ \left| \begin{matrix}\vec{AB} & \vec{AC}\end{matrix} \right| ∣$＝$∣ \alpha \beta ∣∣ \left| \begin{matrix}3 & 2 \\ 1 & 3\end{matrix} \right| ∣$＝7｜αβ｜＜110

    $\Rightarrow$｜αβ｜＜$\frac{110}{7}$＝15.……

    ∴P 點滿足$\begin{cases}\alpha +\beta > 1 \\ \alpha < 0 \\ ∣ \alpha \beta ∣<\frac{110}{7}= 15.\cdots \cdots\end{cases}$，且α，β皆為整數

    (1) α＝－1$\Rightarrow$β＝3，……，15

    (2) α＝－2$\Rightarrow$β＝4，……，7

    (3) α＝－3$\Rightarrow$β＝5

    故共有 13＋4＋1＝18（個）'
