  stem: 如右圖，$\overline{AB}$為圓 O 的直徑，P 為圓弧 AB 上一點，M，N 在直徑上且對稱於 O（O 為圓心），設$\overline{AB} =a$，$\overline{MN} =b$，試以 a、b 表示$\vec{PM} \cdot \vec{PN}$＝＿＿＿＿。（請化簡至沒有括號的形式）
  assets:
  - key: s2_10_f1
    kind: figure
    file: doc_111_桃園_武陵_數學_數A_g11s1e3/s2_10_f1.png
    crop:
      page: 3
      rect:
      - 441.25
      - 307.65
      - 564.3
      - 377.5
  explanation: '$\overline{AM} =\frac{a -b}{2}$，$\overline{MB} = \overline{MN} + \overline{NB} =b +\frac{a -b}{2}=\frac{a +b}{2}$

    故$\vec{PM}=\frac{\frac{a +b}{2}}{a}\vec{PA}+\frac{\frac{a -b}{2}}{a}\vec{PB}$

    同理，$\vec{PN}=\frac{\frac{a -b}{2}}{a}\vec{PA}+\frac{\frac{a +b}{2}}{a}\vec{PB}$

    ∴$\vec{PM} \cdot \vec{PN}$＝$\left( \frac{\frac{a +b}{2}}{a}\vec{PA}+\frac{\frac{a -b}{2}}{a}\vec{PB} \right) \cdot \left( \frac{\frac{a -b}{2}}{a}\vec{PA}+\frac{\frac{a +b}{2}}{a}\vec{PB} \right)$

    ＝$\frac{\frac{a^{2} -b^{2}}{4}}{a^{2}} ∣ \vec{PA} ∣^{2} +\frac{\frac{a^{2} -b^{2}}{4}}{a^{2}} ∣ \vec{PB} ∣^{2}$ （∵$\vec{PA} \cdot \vec{PB} = 0$）

    ＝$\frac{\frac{a^{2} -b^{2}}{4}}{a^{2}} (∣ \vec{PA} ∣^{2} +∣ \vec{PB} ∣^{2})$

    ＝$\frac{\frac{a^{2} -b^{2}}{4}}{a^{2}}\times ∣ \vec{AB} ∣^{2}$

    ＝$\frac{\frac{a^{2} -b^{2}}{4}}{a^{2}}\times a^{2}$＝$\frac{a^{2} -b^{2}}{4}$

    故$\vec{PM} \cdot \vec{PN}=\frac{a^{2} -b^{2}}{4}$'
