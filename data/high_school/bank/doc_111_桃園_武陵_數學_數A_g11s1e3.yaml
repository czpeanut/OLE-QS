  stem: 設 x，y ∈ R，且 4x－3y＝8，已知當 x＝s，y＝t 時，$x^{2}$＋$2y^{2}$ 有最小值 m，試求 m－s＋t＝ ＿＿＿＿。
  explanation: '由柯西不等式

    $((x)^{2} +(\sqrt{2}y)^{2}) \left( (4)^{2} +\left( -\frac{3}{\sqrt{2}} \right) ^{2} \right)\geq\left( (x)(4)+(\sqrt{2}y) \left( -\frac{3}{\sqrt{2}} \right) \right) ^{2}$

    $\Rightarrow(x^{2} + 2y^{2}) \left( 16 +\frac{9}{2} \right)\geq$（4x－3y）$^{2}$

    $\Rightarrowx^{2}$＋$2y^{2}\geq\frac{8^{2}}{\frac{41}{2}}$＝$\frac{128}{41}$

    當$\frac{x}{\sqrt{2}y}=\frac{4}{-\frac{3}{\sqrt{2}}}$

    $\Rightarrow4\sqrt{2}y =-\frac{3}{\sqrt{2}}x\Rightarrow$8y＝－3x

    解$\begin{cases}8y =- 3x \\ 4x - 3y = 8\end{cases}$

    $\Rightarrowx =\frac{64}{41}$，$y =-\frac{24}{41}$時，$x^{2}$＋$2y^{2}$ 有最小值$\frac{128}{41}$

    故 m－s＋t＝$\frac{128}{41}-\frac{64}{41}+\left( -\frac{24}{41} \right)$＝$\frac{40}{41}$'
