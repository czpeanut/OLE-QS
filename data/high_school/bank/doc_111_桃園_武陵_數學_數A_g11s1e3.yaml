    ①α，β皆為整數

    ② P 點落在塗色區域（不包含$AC\leftarrow \rightarrow$及$BC\leftarrow \rightarrow$）

    ③$\alpha \vec{AB}$與$\beta \vec{AC}$所形成之平行四邊形面積小於 110

