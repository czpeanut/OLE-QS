  type: fill
  page: 2
  stem: 坐標平面上有一矩形，其一邊所在直線方程式為$\begin{cases}x = 2 + 2t \\ y = 4 -t\end{cases}$，t ∈ R，其中一條對角線 $L_{1}$ 所在直線方程式為 x－2y＋9＝0，已知另一條對角線 $L_{2}$ 過（1，－7），則對角線 $L_{2}$ 所在直線方程式為＿＿＿＿。（請以一般式 ax＋by＋c＝0 表示）
  explanation: 'L：$\begin{cases}x = 2 + 2t \\ y = 4 -t\end{cases}\Rightarrow$L：x＋2y＝10

    $\Rightarrow$斜率＝$\tan \theta =-\frac{1}{2}$

    $L_{1}$ 及 $L_{2}$ 與 L 的夾角相等

    由 $L_{1}$：x－2y＋9＝0$\Rightarrow$斜率＝$\tan \theta _{1} =\frac{1}{2}$

    設 $L_{2}$ 的斜率＝$\tan \theta _{2}$

    則$∣ \tan (\theta _{1}-\theta ) ∣=∣ \tan (\theta -\theta _{2} ) ∣$

    $\Rightarrow\left| \frac{\tan \theta _{1} -\tan \theta}{1 +\tan \theta _{1}\tan \theta} \right|$＝$\left| \frac{\tan \theta -\tan \theta _{2}}{1 +\tan \theta \tan \theta _{2}} \right|\Rightarrow\left| \frac{\frac{1}{2}-\left( -\frac{1}{2} \right)}{1 +\frac{1}{2}\left( -\frac{1}{2} \right)} \right|$＝$\left| \frac{-\frac{1}{2}-\tan \theta _{2}}{1 +\left( -\frac{1}{2} \right) (\tan \theta _{2})} \right|$

    $\Rightarrow\frac{-\frac{1}{2}-\tan \theta _{2}}{1 -\frac{1}{2}\tan \theta _{2}}=\pm \frac{4}{3}$

    ①$\frac{-\frac{1}{2}-\tan \theta _{2}}{1 -\frac{1}{2}\tan \theta _{2}}=\frac{4}{3}\Rightarrow\tan \theta _{2} =-\frac{11}{2}$

    ②$\frac{-\frac{1}{2}-\tan \theta _{2}}{1 -\frac{1}{2}\tan \theta _{2}}=-\frac{4}{3}\Rightarrow\tan \theta _{2} =\frac{1}{2}$（不合）

    ∴$L_{2}$：$y -(- 7)=-\frac{11}{2}(x - 1)\RightarrowL_{2}$：11x＋2y＋3＝0

    所求為 11x＋2y＋3＝0'
