  page: 1
  stem: '<u>小陵</u>想要了解什麼是通貨膨脹，於是上網搜尋找到： 「通貨膨脹是錢越來越沒價值，一樣的錢能買的東西越來越少。如果我們把通貨膨脹的概念數字化，就可以很容易的比較東西到底貴多少。所以經濟學家們定義了一個數字叫做通膨率。通膨率的計算公式為：通膨率＝( 現在價格／原始價格－1 )」 為了瞭解台灣的通膨率，<u>小陵</u>搜尋過去的物價找到一篇新聞：「知名小吃店40年前價格曝光！滷肉飯只要10元。」而現今該店相同的一碗滷肉飯價格為50元。（參考數值：log 5 ≈ 0.6990）

