    | log ( 1＋0.01x ) | 0.0043 | 0.0086 | 0.0128 | 0.0170 | 0.0212 | 0.0253 | 0.0294 | 0.0334 | 0.0374 |

    (1) 依照通膨率的計算公式，該滷肉飯在經過40年的通膨率為k％，試求k之值。（3分）

    (2) 承上題，設過去40年每年的通膨率為定值x％，試求x之值。？（5分）'
