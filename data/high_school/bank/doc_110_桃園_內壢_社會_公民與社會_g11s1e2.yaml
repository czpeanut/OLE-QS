  - label: C
    content: 經濟衰退時期，劣等財的需求曲線會從原$D_{b}$左移到$D_{a}$
  - label: D
    content: 鋼鐵的價格上漲，雞肉需求曲線會從原$D_{a}$右移到$D_{b}$
