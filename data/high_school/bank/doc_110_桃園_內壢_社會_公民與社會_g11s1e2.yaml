  stem: 假設市場需求曲線有 $D_a$ 與 $D_b$ 兩條負斜率直線，其中 $D_b$ 位於 $D_a$ 的右側（代表需求增加時曲線由 $D_a$ 右移至 $D_b$）。請從下列事件中，分析何者是正確的？
  options:
