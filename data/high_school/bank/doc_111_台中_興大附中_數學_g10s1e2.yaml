- id: doc_111_台中_興大附中_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 三條直線 2y＝x＋a，y＝bx＋4，cy＝dx＋1 可圍成一個三角形，且此三角形中有兩個頂點為（2，0）與（0，6），下列哪些選項是正確的？
  options:
  - label: A
    content: a＝－2
  - label: B
    content: b＝－2
  - label: C
    content: c＝$\frac{1}{6}$
  - label: D
    content: d＝$\frac{1}{2}$
  - label: E
    content: 第三個頂點為$\left( \frac{-4}{5} , \frac{28}{5} \right)$
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $L_{1}$：2y＝x＋a，$L_{2}$：y＝bx＋4，$L_{3}$：cy＝dx＋1

    ∵（0，6）不在 $L_{2}$ 上

    ∴必為 $L_{1}$、$L_{3}$ 交點

    （0，6）代入可得$\begin{cases}12 = 0 + a \\ 6c = 1\end{cases}$⇒$\begin{cases}a = 12 \\ c =\frac{1}{6}\end{cases}$

    ∵（2，0）不在 $L_{1}$ 上

    ∴必為 $L_{2}$，$L_{3}$ 交點

    （2，0）代入可得$\begin{cases}0 = 2b + 4 \\ 0 = 2d + 1\end{cases}$⇒$\begin{cases}b =-2 \\ d = -\frac{1}{2}\end{cases}$

    第三個頂點為 $L_{1}$，$L_{2}$ 交點

    即$\begin{cases}2y = x + 12 \\ y = -2x + 4\end{cases}$⇒（x，y）＝$\left( \frac{-4}{5} , \frac{28}{5} \right)$

    故選(B)(C)(E)'
