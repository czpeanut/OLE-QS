  stem: 一篇社論如此評論某人：「從某方面來說，他的確締造一些奇蹟，因為他為這個偉大的民族的血脈注入了生機，為這個國家帶來新的靈感。……俄國的革命在整個國家釀成共產主義洪水般猛烈的騷亂動盪……。他則拯救他的同胞，使現今的義大利成為整個歐洲在各方面最穩定的國家。在這裡，看不到失業狀況，也幾乎完全沒有罷工，……。」請問下列何者為此人的政策？
  options:
  - label: A
    content: 建立新聞審查與祕密警察制度
  - label: B
    content: 撕毀《凡爾賽和約》，發展國家重工業
  - label: C
    content: 實行五年計畫，成為第三大工業國
  - label: D
    content: 系統性打擊猶太人，進行種族迫害
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 某人視共產主義為洪水猛獸，又拯救義大利的經濟問題，成為無失業、無罷工的「最穩定」國家，可見某人應是建立法西斯政權的墨索里尼，他的政策為(A)建立新聞審查與祕密警察制度。(B)(D)為德國希特勒的政策。(C)蘇聯史達林的政策。
