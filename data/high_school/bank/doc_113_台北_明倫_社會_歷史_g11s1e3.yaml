- id: doc_113_台北_明倫_社會_歷史_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 西方一般對他有很高的評價，並於 1990 年獲得諾貝爾和平獎，2011 年他過 80 歲生日時，俄羅斯總統梅德維傑夫宣布頒給他俄羅斯最高榮譽的「聖安德烈勳章」，民間也出現了自發的感謝運動。用各種形式對他結束共產黨一黨專政表示感謝，佛拉迪米爾．雷日科夫說：「人們都知道，民主和言論自由是同他聯繫在一起的。」請問下列何者為這位諾貝爾和平獎的政策？
  options:
  - label: A
    content: 實施戰鬥共產主義，促使蘇聯快速向共產主義的理想邁進
  - label: B
    content: 提出星戰計畫，投注大量資金研發太空設備與核子武器
  - label: C
    content: 進行經濟改革，在社會主義的體制下開放部分市場經濟
  - label: D
    content: 主張推翻柏林圍牆，促使東西德合併
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '此位俄羅斯人獲得諾貝爾和平獎的原因，是「他結束共產黨一黨專政」，因此可推知為戈巴契夫，他在蘇聯推行的政策為(C)。(A)列寧的政策。(B)(D)皆為美國總統雷根的政策與主張。

    5.19 世紀末柏林會議後，德、奧組成同盟以防範俄國，加上新任德皇威廉二世高喊「大日耳曼主義」向外擴張，使得主張「泛斯拉夫主義」的俄國備感威脅，因此與法國締結同盟，故選(B)。

    6.「社會主義」主張廢除私有財產，將所有資源公有共享，因此查維茲推行的改革內容應為(B)。(A)持反美立場。(C)擴大國營企業規模。(D)此為自由主義經濟政策，與社會主義的主張相反。

    7.(A)以色列建國後才爆發第一次以阿戰爭。(B)以阿戰爭指以色列與巴勒斯坦周邊阿拉伯國家的衝突，非阿拉伯半島。(C)阿拉伯人為取回巴勒斯坦的家鄉土地，並非只為擴張領土。

    8.(A)非洲在二戰後殖民地國家雖然紛紛獨立，但國界多沿用殖民時期劃定，並非依民族文化或族群分布重新劃分，導致許多國家內部族群混雜。(B)冷戰期間，美蘇兩國皆積極在非洲爭取勢力範圍，蘇聯也成功支持部分親共政權。(D)「第三世界」對美、蘇採取不結盟政策。

    9.美國總統羅斯福就任後，面對 1929 年以來的經濟大恐慌，推出一系列積極干預經濟的政策，史稱「新政」。此政策核心理念即來自凱因斯主義，主張透過政府投資與公共建設帶動經濟復甦、創造就業，顯著改變了自由放任的傳統資本主義觀點。

    10.題文說明某國以礦業為主要經濟命脈，加上 1990 年仍有「白人壟斷政權」的現象，可推知該國為實施種族隔離政策的南非，因此其可能加入的區域性國際組織為(A)非洲聯盟。(B)南美的經濟組織。(C)東南亞的經濟組織。(D)亞洲與環太平洋的經濟體。

    11.1958 年《羅馬條約》生效後成立的歐洲經濟共同體與歐洲原子能共同體，經過統合成歐洲共同體後，又於 1993 年(B)《馬斯垂克條約》生效後轉變成歐洲聯盟，以整合西歐的經濟力量。

    12.從黑人選民的人數占有絕對優勢、「對抗種族隔離」的選舉來看，這個地方應是南非，於 1994 年的大選中選出曼德拉成為該國第一位黑人總統。

    13.從「身上必須繡一顆黃星星以便辨認身分」、「到處躲藏」、「德國祕密警察」等線索，可推知此為德國納粹對歐洲猶太人的迫害，因此答案為(D)。希特勒於 1933 年後開始掌權，(A)(B)(C)三者時間不符。

    14.(A)一戰亦有通貨膨脹，但二戰的戰場規模更大。(C)所有參戰國皆以全國的物資投入戰爭中，犧牲民生經濟。(D)二戰的參戰國家多為共和國，帝制國家較少。

    15.(A)二戰時，亞洲是主要戰場之一。(B)義大利為一戰的戰勝國。(D)二戰時，美國宣布蔣介石為中國戰區（包含越南、泰國等）的最高統帥，負擔重要的作戰責任。

    16.題目指出「布爾什維克主義征服了俄羅斯」，顯示 1917 年的十月革命已經發生；「匈牙利即剛剛屈服了」對應的是 1919 年匈牙利蘇維埃共和國的短暫成立；再加上歐洲處於一次大戰後不穩定的狀態，革命思想蔓延，故選(C)。(A)第一次世界大戰剛爆發，布爾什維克尚未掌權，不符文意。(B)布爾什維克剛掌權，但匈牙利尚未建立蘇維埃政權。(D)為二戰爆發之年，與題目重點布爾什維克主義擴散不符。

    17.選項中反對種族隔離立場的是馬丁．路德．金恩，領導美國黑人民權運動，爭取黑人與白人享有同等的利權，故選(B)。(A)支持女權運動。(C)反殖民運動。(D)《西線無戰事》一書表達反戰立場。

    18.美國開始取消公共場所的隔離政策，乃在 1960 年代非裔美國人的民權運動之後，(D)為正解。

    19.美國於 1960 年代投入越戰，加重經濟的負擔，(A)為正解。(B)冷戰於 1940 年代開始，並未使美國陷入經濟危機。(C)韓戰發生於 1950 年代，與題文的年代不符。(D)美軍在越戰中挫敗而退出。

    20.從「我們千年來好不容易建立的國家」一句，可推知此國家為猶太人所建立的(A)以色列。

    21.題文所述為「杜魯門主義」，針對共產主義對希臘與土耳其的侵略，美國將提供軍事與經濟的援助，因此答案為(A)。(B)描述的是租借法案，為二戰期間美國支援盟國對抗軸心國的措施，非冷戰背景。(C)(D)希臘與土耳其並非共產黨國家。

    22.題文將蘇聯比喻為「一具持續性的玩具火車頭」，暗示其對外擴張具有持續性、侵略性且不會自我停止，美國因此採取「圍堵政策」，在全球範圍內靈活運用外交、軍事與經濟手段，遏止共產主義勢力的擴張，防止其威脅自由世界，故選(B)。

    23.題文所述的政治家為法國外交部長舒曼，其呼籲德、法兩國共管理煤和鋼鐵的生產，並可邀請其他國家加入，因此於 1951 年成立(A)歐洲煤鋼共同體。

    24.印尼於 17 世紀後淪為荷蘭的殖民地，於 1942 年曾遭日本占領，因此甲、乙兩國分別為(C)荷蘭與日本。

    25.題文描述食物配給、咖啡短缺、紅茶與糖仍可取得，乳製品來源為紐西蘭與加拿大，肉類稀少、天天吃鱈魚，並且政府鼓勵民眾自耕糧食的政策，這些現象皆符合二戰期間英國的戰時生活情境。其他選項在物資供應與生活形態上皆不符題意，故選(B)。

    26.這個爆發大革命的新政府對抗資本主義國家，強調鋼鐵工業，並實施計畫經濟而受到 1930 年代經濟恐慌的影響較小，因此可推知為實施共產主義的蘇聯，答案為(C)。

    27.1850 年代，俄國入侵鄂圖曼帝國的戰爭，英、法等國亦介入其中，可推知為 1853 ～ 1856 年的(A)克里米亞戰爭，俄國在此場戰爭中戰敗，後於 1877 年再度發動俄土戰爭。

    28.這個唯一不用賠款的同盟國為(C)土耳其，一次大戰後曾被要求簽訂超嚴苛的條約，幸由凱末爾領導擊敗希臘的攻擊，重新簽訂平等新約，同時在新的共和國推行西化政策，使土耳其得以復興。

    29.題文提及：「可以在幾天內採取行動並占領平壤」與「如果我們不能在冷戰中保護民主，那我們將在熱戰中獲勝」，明顯與韓戰（1950 ～ 1953）相關。韓戰後，美國與南韓簽訂《美韓共同防禦條約》，並於 1954 年與中華民國簽署《中美共同防禦條約》，建立冷戰時期的反共安全體系。(A)此戰爭發生於冷戰初期，並非二戰期間的同盟國與軸心國對抗。(C)雖然冷戰緊張，但韓戰中並未爆發大規模核戰，核戰危機主要發生於 1962 年古巴飛彈危機。(D)韓戰以「停戰協定」收場，並非美國與各方簽訂正式和平條約，也沒有全面退出朝鮮半島，美軍至今仍駐韓。

    30.由於戈巴契夫在蘇聯推動改革開放，並從東歐撤軍、降低對東歐國家的控制，使東歐民主化終於露出曙光，故選(D)。

    31.這位提倡「非暴力」的思想，以絕食方式表達政治反抗的人物為(C)甘地，提倡「不合作運動」反抗英國的殖民統治。

    32.題文所述小說為卡夫卡的《變形記》，以超乎現實的故事情節，象徵現代人際關係的疏離冷漠，屬於(A)現代主義文學。

    33.尼克森認為未來將變成多極世界，杜魯門的圍堵策略已經跟不上世界變局，因此主張追求和平談判，降低對亞洲國家內政的積極介入，可見其已打算自越南的內戰抽身，因此(D)為正解。(A)放棄對亞洲的介入，不代表將強化對歐洲的控制。(B)越戰的挫敗使美國打算抽離越南。(C)第三世界對蘇聯亦不結盟，並非親共。

    34.某地被殖民長達三百餘年，獨立後仍深受歐美國家的經濟剝削，直到二戰結束後才逐漸發展自己的道路，可推知為中南美洲國家。從「共產政府的出現」一句，可推知此地為(A)古巴，1959 年建立西半球第一個社會主義國家。

    35.題文所述的這個國家為第一次世界大戰的戰勝國，但戰後經濟衰退嚴重影響到政局的發展，最後走向激進的國家主義路線，因此可推知為實施法西斯主義的(C)義大利。'
