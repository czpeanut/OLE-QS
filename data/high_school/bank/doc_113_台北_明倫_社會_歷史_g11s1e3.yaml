- id: doc_113_台北_明倫_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 一位大使向皇帝陳明：「敝國皇帝仰賴貴國的支持，才能解決此次爭端。如果對匈牙利及俄國的戰爭無法避免，我國相信貴國一定會站在我國這一邊。俄國應當沒有戰爭的決心，但是他的盟邦可能會趁機火上加油。」這種說法的背景為何？
  options:
  - label: A
    content: 1861 年起列強討論克里米亞半島問題
  - label: B
    content: 1900 年中英兩國協商結束義和團事變
  - label: C
    content: 1903 年英法兩國討論日俄戰爭的發展
  - label: D
    content: 1914 年德奧兩國討論解決巴爾幹問題
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從大使的談話內容來判斷，這場即將爆發的戰爭將有匈牙利與俄國參戰，加上其他與俄國同盟的國家也會加入，此外，說話的「敝國」與「貴國」也會加入戰局，並在同一陣線對抗俄國，(A)(B)(C)三者匈牙利皆未參與，因此答案為(D)，巴爾幹半島的衝突未能妥善處理，終於釀成第一次世界大戰。
