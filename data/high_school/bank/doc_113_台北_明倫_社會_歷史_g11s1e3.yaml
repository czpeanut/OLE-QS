  stem: '以下是第二次世界大戰後，在南亞某個英國殖民地內的一個抗議場合中，雙方對彼此的攻訐內容。

    鄉民甲：宗教是維持我國長久以來社會階級秩序的基礎，也是我們的傳統文化！為了重現我們 18 世紀英國殖民前的既有疆域，為了顧及最多數人的信仰，我們不能讓少數異教徒代表我們的文化，甚至意圖分裂我國領土！」

    路人乙：「你們才是異教徒！若不是上個王朝的宗教寬容，你們早就被驅逐殆盡了！我們是不會承認你們這些多數異教徒所代表的自治政府！我們要建立一個政教合一的國家！」

