  stem: 德國女總理梅克爾，1954 年出生於漢堡一個牧師家庭，但不久其父親奉命遷居東柏林郊區，她從小即顯露在科學方面的天賦，曾獲得物理學博士學位。她在德國統一的前一年才投入政治，並擔任東德最後一屆政府的副發言人，兩德統一後她仕途更為順利，2005 年獲推舉為德國總理，她是繼柴契爾夫人後，歐洲最有影響力的女性領導人。下列有關其經歷的敘述，何者正確？
  options:
  - label: A
    content: 小學時她經歷東、西德分裂為兩個國家
  - label: B
    content: 小學時看到正在修築「柏林圍牆」
  - label: C
    content: 擔任發言人期間，曾協助總理接待蘇聯領導者史達林
  - label: D
    content: 出任總理後，促成德國加入華沙公約組織
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 柏林圍牆於 1961 年興築，梅克爾當時已上小學，故選(B)。(A)東、西德分別建國於 1949 年，梅克爾尚未出生。(C)史達林於 1953 年已逝世，不可能受到梅克爾接待。(D)華沙公約組織已於 1991 年宣布解散。
