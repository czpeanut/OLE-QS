  explanation: '∵$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right] \left[ \begin{matrix}2 & 3 \\ 3 & 4\end{matrix} \right]$＝$\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$

