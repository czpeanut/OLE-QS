    ⇒$\begin{cases}ax +by = 1 \\ cx +dy =-2\end{cases}$⇒$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right] \left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}1 \\ -2\end{matrix} \right]$⇒$\left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right] ^{-1}\left[ \begin{matrix}1 \\ -2\end{matrix} \right]$＝$\left[ \begin{matrix}2 & 3 \\ 3 & 4\end{matrix} \right] \left[ \begin{matrix}1 \\ -2\end{matrix} \right]$

