  - label: B
    content: 若 Γ 與平面 $E_{2}$ 的截痕是圓，則 $E_{2}$ 與Γ 的每條母線都有交點
  - label: C
    content: 若平面 $E_{3}$⊥E，則Γ 與平面 $E_{3}$ 的截痕是雙曲線
  - label: D
