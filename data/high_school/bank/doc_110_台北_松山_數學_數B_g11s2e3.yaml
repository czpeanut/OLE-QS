    ③ 平時成績占總成績的 20 ％。

    當期末要結算成績時，助教要計算多位學生的總成績，於是他想利用矩陣的乘法來計算，首先他先將學生每個項目的成績列出，列出方式如下：

    | 姓名 | 期中考（Ⅰ） | 期中考（Ⅱ） | 期末考 | 平時成績 |

    | --- | --- | --- | --- | --- |

    | 甲 | 70 | 75 | 75 | 90 |

    | 乙 | 60 | 70 | 70 | 85 |

    | 丙 | 100 | 90 | 95 | 95 |

    | ⋮ | ⋮ | ⋮ | ⋮ | ⋮ |

    再轉換成矩陣的型式呈現：$\left[ \begin{matrix}70 & 75 & 75 & 90 \\ 60 & 70 & 70 & 85 \\ 100 & 90 & 95 & 95 \\ ⋮ & ⋮ & ⋮ & ⋮\end{matrix} \right]$，試問：

    (1)若要計算總成績，需將上面的矩陣乘上下面哪一個矩陣後，才能呈現每位同學的總成績？ （單選題，5 分）

    (2)若<u>小華</u>前兩次期中考分別考了 30 分及 50 分，且<u>小華</u>平時上課認真，教授願意給<u>小華</u>的平時成績打最高分，利用矩陣乘法計算後，若<u>小華</u>希望總成績能及格（總成績≥ 60 分），則期末考至少要考幾分。（四捨五入至整數位）（5 分）'
