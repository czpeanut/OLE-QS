- id: doc_110_台北_松山_數學_數B_g11s2e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設 A、B、C 都是二階方陣，O 是二階零方陣，則下列哪些敘述恆正確？
  options:
  - label: A
    content: AB＝BA
  - label: B
    content: （A＋I）$^{2}$＝$A^{2}$＋2A＋I
  - label: C
    content: 若 AB＝O，則 A＝O 或 B＝O
  - label: D
    content: 若 A＋B＝A＋C，則 B＝C
  - label: E
    content: （AB）$^{－1}$＝$A^{－1}B^{－1}$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：矩陣乘法不具交換性

    (B)○：∵AI＝IA＝A ∴（A＋I）$^{2}$＝（A＋I）（A＋I）＝$A^{2}$＋AI＋IA＋$I^{2}$

    ＝$A^{2}$＋2A＋I

    (C)╳：反例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，B＝$\left[ \begin{matrix}0 & 0 \\ 1 & 0\end{matrix} \right]$⇒ AB＝O

    (D)○：∵A＋（－A）＝O（零矩陣）

    ∴A＋B＝A＋C ⇒（－A）＋A＋B＝（－A）＋A＋C ⇒ B＝C

    (E)╳：∵$ABB^{－1}A^{－1}$＝$AIA^{－1}$＝$AA^{－1}$＝I

    ∴（AB）$^{－1}$＝$B^{－1}A^{－1}$

    故選(B)(D)'
- id: doc_110_台北_松山_數學_數B_g11s2e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 一種密碼編寫技術是使用二階方陣作為密碼傳遞的加密矩陣，將原始訊息的數字明文經過加密矩陣的乘法偽裝成數字亂碼後傳遞，收到數字亂碼的人再利用解密矩陣的乘法轉譯為數字明文。若以下列 5 個二階方陣作為加密矩陣，哪幾個將導致數字亂碼無法轉譯為數字明文？
  options:
  - label: A
    content: $\left[ \begin{matrix}1 & 2 \\ 3 & 1\end{matrix} \right]$
  - label: B
    content: $\left[ \begin{matrix}1 & 2 \\ 4 & 8\end{matrix} \right]$
  - label: C
    content: $\left[ \begin{matrix}9 & 0 \\ 3 & 1\end{matrix} \right]$
  - label: D
    content: $\left[ \begin{matrix}-8 & 6 \\ 12 & -9\end{matrix} \right]$
  - label: E
    content: $\left[ \begin{matrix}96 & 97 \\ 98 & 99\end{matrix} \right]$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '利用矩陣乘法加密，則需要利用乘法反矩陣解密。

    設加密矩陣 A＝$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$，若 ad－bc＝0

    ⇒乘法反矩陣不存在，可能造成不同數字亂碼，

    但得到相同結果，導致無法解密

    例：〔4 －1〕$\left[ \begin{matrix}1 & 2 \\ 4 & 8\end{matrix} \right]$＝〔8 －2〕$\left[ \begin{matrix}1 & 2 \\ 4 & 8\end{matrix} \right]$＝〔0 0〕

    又(B)(D)選項乘法反矩陣不存在

    故選(B)(D)'
- id: doc_110_台北_松山_數學_數B_g11s2e3_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 坐標平面上，關於二階方陣 A 所造成的變換，下列哪些敘述正確？
  options:
  - label: A
    content: 原點經過 A 變換後還是原點
  - label: B
    content: 一直線經過 A 變換後可能是一直線
  - label: C
    content: 一直線經過 A 變換後可能是一點
  - label: D
    content: 一點經過 A 變換後必會換位置
  - label: E
    content: 一非零向量經過 A 變換後必是一非零向量
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$A\left[ \begin{matrix}0 \\ 0\end{matrix} \right]$＝$\left[ \begin{matrix}0 \\ 0\end{matrix} \right]$

    (B)○：若 A＝I，則直線 L 經 A 變換後不變

    (C)○：例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，則$A\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$＝$A\left[ \begin{matrix}2 \\ 1\end{matrix} \right]$＝$\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$

    會將直線 x＝2 變換成一點（2，0）

    (D)╳：若 A＝I，則點變換後均不改變位置

    (E)╳：反例同(C)，其中 P（2，0），Q（2，1）⇒$\vec{PQ}$＝（0，1）

    但變換後為零向量

    故選(A)(B)(C)'
- id: doc_110_台北_松山_數學_數B_g11s2e3_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 已知二階方陣 A＝$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$滿足$A\left[ \begin{matrix}1 \\ 1\end{matrix} \right]$＝$\left[ \begin{matrix}5 \\ 2\end{matrix} \right]$，$A\left[ \begin{matrix}1 \\ 2\end{matrix} \right]$＝$\left[ \begin{matrix}7 \\ 4\end{matrix} \right]$。請選出正確的選項。
  options:
  - label: A
    content: ad－bc＝6
  - label: B
    content: $A^{2}$＝5A－$6I_{2}$
  - label: C
    content: $A\left[ \begin{matrix}1 \\ 3\end{matrix} \right]$＝$\left[ \begin{matrix}9 \\ 6\end{matrix} \right]$
  - label: D
    content: $A^{－1}$＝$\left[ \begin{matrix}2 & -2 \\ 0 & 3\end{matrix} \right]$
  - label: E
    content: $〔\begin{matrix}1 & 1\end{matrix}〕A$＝$〔\begin{matrix}5 & 7\end{matrix}〕$
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$A\left[ \begin{matrix}1 \\ 1\end{matrix} \right]$＝$\left[ \begin{matrix}5 \\ 2\end{matrix} \right]$，$A\left[ \begin{matrix}1 \\ 2\end{matrix} \right]$＝$\left[ \begin{matrix}7 \\ 4\end{matrix} \right]$

    ∴$A\left[ \begin{matrix}1 & 1 \\ 1 & 2\end{matrix} \right]$＝$\left[ \begin{matrix}5 & 7 \\ 2 & 4\end{matrix} \right]$⇒ A＝$\left[ \begin{matrix}5 & 7 \\ 2 & 4\end{matrix} \right] \left[ \begin{matrix}1 & 1 \\ 1 & 2\end{matrix} \right] ^{-1}$

    ⇒ A＝$\left[ \begin{matrix}5 & 7 \\ 2 & 4\end{matrix} \right] \left[ \begin{matrix}2 & -1 \\ -1 & 1\end{matrix} \right]$＝$\left[ \begin{matrix}3 & 2 \\ 0 & 2\end{matrix} \right]$

    (A)○：3×2－2×0＝6

    (B)○：$A^{2}$＝$\left[ \begin{matrix}3 & 2 \\ 0 & 2\end{matrix} \right] \left[ \begin{matrix}3 & 2 \\ 0 & 2\end{matrix} \right]$＝$\left[ \begin{matrix}9 & 10 \\ 0 & 4\end{matrix} \right]$，且 5A－$6I_{2}$＝$\left[ \begin{matrix}15 & 10 \\ 0 & 10\end{matrix} \right]$－$\left[ \begin{matrix}6 & 0 \\ 0 & 6\end{matrix} \right]$＝$\left[ \begin{matrix}9 & 10 \\ 0 & 4\end{matrix} \right]$

    故 $A^{2}$＝5A－$6I_{2}$

    (C)○：$A\left[ \begin{matrix}1 \\ 3\end{matrix} \right]$＝$\left[ \begin{matrix}3 & 2 \\ 0 & 2\end{matrix} \right] \left[ \begin{matrix}1 \\ 3\end{matrix} \right]$＝$\left[ \begin{matrix}9 \\ 6\end{matrix} \right]$

    (D)╳：$A^{－1}$＝$\frac{1}{6}\left[ \begin{matrix}2 & -2 \\ 0 & 3\end{matrix} \right]$

    (E)╳：〔1 1〕$\left[ \begin{matrix}3 & 2 \\ 0 & 2\end{matrix} \right]$＝〔3 4〕

    故選(A)(B)(C)'
