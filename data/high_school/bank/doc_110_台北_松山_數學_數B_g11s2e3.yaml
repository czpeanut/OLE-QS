  - label: E
    content: 若平面 $E_{5}$ 與平面 E 所夾銳角為 75°，則Γ 與平面 $E_{5}$ 的截痕是雙曲線
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：E//$E_{1}$，又 $E_{1}$ 不通過頂點 ∴$E_{1}$ 垂直軸⇒截痕為圓

    (B)○

    (C)○：∵$E_{3}$⊥E，且 $E_{3}$ 不通過頂點 ∴$E_{3}$ 平行軸⇒截痕為雙曲線

    (D)╳：若軸與母線夾 75°角，則為拋物線（也可能為雙曲線）

    (E)╳：若軸與母線夾 15°角，則為拋物線（也可能為橢圓）

