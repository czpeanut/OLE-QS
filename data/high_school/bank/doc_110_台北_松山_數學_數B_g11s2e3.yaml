  stem: 設二階方陣 A＝$\left[ \begin{matrix}0 & 1 \\ 0 & 1\end{matrix} \right]$，I＝$\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$。利用$\left[ \begin{matrix}1 & 1 \\ 0 & 2\end{matrix} \right]$＝I＋A，試將$\left[ \begin{matrix}1 & 1 \\ 0 & 2\end{matrix} \right] ^{10}$表示成 aI＋bA（a，b 為實數）的形式，則數對（a，b）為＿＿＿＿。
  answer:
  - （1，1023）
  answer_status: verified
  answer_source: answer_key
  explanation: 'A＝$\left[ \begin{matrix}0 & 1 \\ 0 & 1\end{matrix} \right]$⇒ $A^{2}$＝$\left[ \begin{matrix}0 & 1 \\ 0 & 1\end{matrix} \right]$＝A，可得 $A^{n}$＝A，其中 n 為自然數

    又$\left[ \begin{matrix}1 & 1 \\ 0 & 2\end{matrix} \right] ^{10}$＝（I＋A）$^{10}$，由二項式定理知

    （I＋A）$^{10}$＝I＋$C_{1}^{10}$A＋$C_{2}^{10}A^{2}$＋……＋$C_{10}^{10}A^{10}$

    ＝I＋（$C_{1}^{10}$＋$C_{2}^{10}$＋……＋$C_{10}^{10}$）A

    又$C_{1}^{10}$＋$C_{2}^{10}$＋……＋$C_{10}^{10}$＝$2^{10}$－$C_{0}^{10}$＝1023

    故數對（a，b）＝（1，1023）'
