    故數對（x，y）＝（－4，－5）'
- id: doc_110_台北_松山_數學_數B_g11s2e3_s2_3
  section: 2
  number: 3
  type: fill
  page: 2
  stem: '設二階方陣 A＝$\left[ \begin{matrix}3 & 1 \\ 5 & 2\end{matrix} \right]$。

    (1)已知 A 將 Q 對應到 Q''（2，1），則 Q 的坐標為＿＿＿＿。

    (2)已知 A 將直線 L：y＝2x 對應到直線 M，則直線 M 的方程式為＿＿＿＿。'
  answer:
  - (1)（3，－7）；(2) y＝$\frac{9}{5}x$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $A^{－1}$＝$\left[ \begin{matrix}3 & 1 \\ 5 & 2\end{matrix} \right] ^{-1}$＝$\frac{1}{6 - 5}\left[ \begin{matrix}2 & -1 \\ -5 & 3\end{matrix} \right]$＝$\left[ \begin{matrix}2 & -1 \\ -5 & 3\end{matrix} \right]$

    令 Q（x，y）⇒$\left[ \begin{matrix}3 & 1 \\ 5 & 2\end{matrix} \right] \left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}2 \\ 1\end{matrix} \right]$⇒$\left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}2 & -1 \\ -5 & 3\end{matrix} \right] \left[ \begin{matrix}2 \\ 1\end{matrix} \right]$＝$\left[ \begin{matrix}3 \\ -7\end{matrix} \right]$

    故 Q 坐標為（3，－7）

    (2)取 L 上兩點 O（0，0）及 P（1，2）

    ⇒$\left[ \begin{matrix}3 & 1 \\ 5 & 2\end{matrix} \right] \left[ \begin{matrix}0 \\ 0\end{matrix} \right]$＝$\left[ \begin{matrix}0 \\ 0\end{matrix} \right]$，$\left[ \begin{matrix}3 & 1 \\ 5 & 2\end{matrix} \right] \left[ \begin{matrix}1 \\ 2\end{matrix} \right]$＝$\left[ \begin{matrix}5 \\ 9\end{matrix} \right]$

    得 O''（0，0），P''（5，9）為 M 上兩點

    故 M 的方程式為 y＝$\frac{9}{5}x$'
