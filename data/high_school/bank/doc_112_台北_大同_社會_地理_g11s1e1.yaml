  stem: 印度的智慧型手機市場快速崛起，然而在印度熱賣的手機品牌前 5 名，只有第 2 名是韓國的 Samsung，其餘全來自中國，包括小米、Vivo、Oppo、Realme。為了成功切入印度市場，中國手機廠無不致力於改良手機設計，來迎合印度消費者的使用習慣，請問下列哪個設計為符合當地限制而發展的特色？
  options:
  - label: A
    content: 不穩定的供電，因此設計新充電器以穩定電流
  - label: B
    content: 行動支付發達，手機內建行動支付設備與軟體
  - label: C
    content: 習慣用左手吃飯，因此設計可用油膩手指解鎖的手機
  - label: D
    content: 加入紅外線遙控，運用手機控制許多家用智慧電器
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)印度基礎建設不足，電力供應並不充足也不穩定，故印度政府要求所有銷售的 3C 產品均需有 BIS 認證，旨在提供產品穩定電壓。
