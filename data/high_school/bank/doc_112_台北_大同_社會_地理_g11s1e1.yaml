  stem: 伊斯坦堡一直以友善動物著稱，市民更以「痴狂愛貓」聞名。其實伊斯蘭教對貓相當友善，甚至宣稱「愛貓也是信仰的一部分」，研究指出，穆斯林推崇貓可能和貓喜歡乾淨、隨時都在清理舔舐自己的腳爪有相當大的關係。請問貓咪的習性和伊斯蘭教五功中的哪一功背後所隱含的意義最為吻合？
