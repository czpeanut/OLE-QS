  stem: 導致「金三角」地區百姓生活困苦的環境因素最有可能是什麼？
  options:
  - label: A
    content: 地勢低窪，洪患頻繁
  - label: B
    content: 地形崎嶇、交通不便
  - label: C
    content: 氣候乾燥，易發生乾旱
  - label: D
    content: 板塊交會處，多海嘯災害
  group_stem: 在泰國、緬甸、寮國的交界地區一帶，由於盛行以黃金交易毒品，因此有「金三角」之稱。昔日此地區因環境限制，導致生活困苦的百姓為了求生存而種植罌粟花，透過將罌粟花提煉成毒品賺取報酬。請問：
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '、39.金三角位於泰國、寮國及緬甸交界處，位處湄公河與右岸支流（洛可河）交匯處，故又稱金三角。(B)此地屬於中國橫斷山脈向南延伸之處，地形崎嶇、交通不便。

    40.此區地景呈現圓型農田，其餘地區則為荒涼沙漠。說明灌溉水源從中心向外覆蓋地區為可耕作區，故呈圓形綠洲。此種水源為開鑿深層地下水，因受壓力影響而向外噴出，又稱噴灌。

    41.該地為乾燥氣候區，降水稀少，但每次降水時強度強且降水變率大。

    42.沙烏地阿拉伯、卡達等國屬於伊斯蘭教的遜尼派；阿薩德政府、伊朗及伊拉克等則屬於什葉派。

    43.從題幹敘述中的控制黑海交通要道判斷此國為土耳其，為兩河流域發源地。其中幼發拉底河從土耳其向南流經敘利亞、伊拉克，故控制了敘利亞的水源命脈。

    44.從歐洲通往亞洲的航線為地中海→蘇伊士運河→紅海→阿拉伯海→麻六甲海峽→太平洋。

    45.乙為西高止山西部沿海海岸，阻擋夏季西南季風，降水豐沛，氣候溫暖溼潤，適合栽種咖啡。

    46.同答案。

    47.甲：旁遮普省位於印度西北方，因位於夏季西南季風末端，降水稀少，但依靠恆河水源灌溉，為印度重要小麥、水稻產區。近代因綠色革命，糧食產量大增，為印度重要糧倉之一。

    48.旁遮普省的錫克教徒占比 60 ％，但在印度人口中占比卻僅占 2 ％。錫克教徒為了在政治上爭取更高的代表權，以保護自身的文化與宗教，故部分錫克教徒爭取能從印度脫離獨立，但卻屢遭印度政府打壓，使得旁遮普省成為因錫克教徒分離主義運動的主要衝突地區。

    49.同答案。'
