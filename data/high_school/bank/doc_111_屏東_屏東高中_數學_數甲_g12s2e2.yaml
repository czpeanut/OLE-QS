- id: doc_111_屏東_屏東高中_數學_數甲_g12s2e2_s2_3
  section: 2
  number: 3
  type: fill
  page: 3
  stem: 設 A（2，－4）、B（4，0）及橢圓 $4x^{2}$＋$9y^{2}$＝36，若點 P 在橢圓上，則△PAB 面積的最大值為＿＿＿＿。
  answer:
  - $8 + 2\sqrt{10}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵點 P 在橢圓Γ：$4x^{2}$＋$9y^{2}$＝36 上

    又$\left( \frac{x}{3} \right) ^{2}+ \left( \frac{y}{2} \right) ^{2}= 1$，令$\begin{cases}\frac{x}{3}=\cos \theta \\ \frac{y}{2}=\sin \theta\end{cases}$

    ∴P（x，y）＝（3 cosθ，2 sinθ）

    又$\vec{AB}$＝（2，4），$\vec{AP}$＝（3 cosθ－2，2 sinθ＋4）

    $\Rightarrow$△PAB 面積為$\frac{1}{2}∣ \left| \begin{matrix}2 & 3\cos \theta - 2 \\ 4 & 2\sin \theta + 4\end{matrix} \right| ∣$＝$∣ \left| \begin{matrix}1 & 3\cos \theta - 2 \\ 2 & 2\sin \theta + 4\end{matrix} \right| ∣$

    ＝∣2 sinθ－6 cosθ＋8∣

    $\leq\sqrt{2^{2} +(- 6)^{2}} + 8$

    ＝$2\times \sqrt{1^{2}+(- 3)^{2}} + 8$＝$8 + 2\sqrt{10}$

    故所求為$8 + 2\sqrt{10}$'
