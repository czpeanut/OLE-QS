  section: 2
  number: 2
  type: fill
  page: 3
  stem: 將橢圓Γ：$\frac{x^{2}}{b^{2}}+\frac{y^{2}}{a^{2}}= 1$（其中 a＞0，b＞0）以原點 O 為中心，沿著 x 軸伸縮為$\frac{4}{3}$倍，沿著 y 軸伸縮為$\frac{1}{2}$倍，得到新圖形橢圓Γ'：$\frac{x^{2}}{16}+\frac{y^{2}}{4}= 1$，求數對（a，b）＝ ＿＿＿＿。
  answer:
  - （4，3）
  answer_status: verified
  answer_source: answer_key
  explanation: 'Γ：$\frac{x^{2}}{b^{2}}+\frac{y^{2}}{a^{2}}= 1\xrightarrow[沿 y 軸伸縮為 \frac{1}{2} 倍]{沿 x 軸伸縮為 \frac{4}{3} 倍}$Γ''：$\frac{x^{2}}{\left( \frac{4}{3}b \right) ^{2}}+\frac{y^{2}}{\left( \frac{1}{2}a \right) ^{2}}= 1\Rightarrow$Γ''：$\frac{x^{2}}{\frac{16b^{2}}{9}}+\frac{y^{2}}{\frac{a^{2}}{4}}= 1$

    ∴$\frac{16b^{2}}{9}= 16$ ∴$b^{2}$＝9 ∵b＞0 ∴b＝3

    又$\frac{a^{2}}{4}= 4$ ∴$a^{2}$＝16 ∵a＞0 ∴a＝4

    ∴數對（a，b）＝（4，3）'
