  stem: 請選出有關「酶」的正確敘述。
  options:
  - label: A
    content: 酶是大分子物質，且成分有多種類型，包括醣類、脂質、蛋白質等
  - label: B
    content: 酶與受質間有專一性
  - label: C
    content: 有酶參與，則反應無需活化能
  - label: D
    content: 酶能直接引發化學反應
