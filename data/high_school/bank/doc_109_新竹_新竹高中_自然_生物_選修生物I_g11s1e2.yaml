  options:
  - label: A
    content: 此酶在10～40℃活性持續增加
  - label: B
    content: 此酶於42℃時具有最佳的催化活性
  - label: C
    content: 在42℃以上，產物的濃度因酶的量有限而不再增加
  - label: D
    content: 在70℃時，若增加酶，則產物濃度會再上升
