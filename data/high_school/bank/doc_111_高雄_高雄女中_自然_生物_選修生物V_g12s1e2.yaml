  section: 2
  number: 43
  type: multiple
  page: 5
  stem: 有關夢幻潮生物與環境因子的描述，下列哪些是合理的推論？
  options:
  - label: A
    content: 空氣汙染造成當地水質變酸
  - label: B
    content: 硫磺噴氣與酸性沉降造成水質pH值降低
  - label: C
    content: 芒草區生長緩慢且不會吸收$NO_{3}^{－}$
  - label: D
    content: 芒草區的硝化作用旺盛
  - label: E
    content: 湖內植物群集分布與季節性的降雨量有關
  group_stem: 題組： 夢幻湖位於<u>陽明山七星山</u>東麓海拔830公尺處，水深約2公尺，水質以酸性為主，經常有雲霧籠罩湖面，朦朦朧朧，故以夢幻湖稱之。湖內植物有沉水性的臺灣水韭、小型挺水的七星山穀精草、大型挺水植物水毛花，以及生長於湖邊乾燥處的五節芒。此區氣候屬重溼型，深受東北季風影響，年平均氣溫為攝氏16.5度，年降雨量可達4800公釐以上，但有明顯乾季、雨季之分。湖面大小受乾、雨季節之不同而有所改變。在不同季節其湖內組成植物群集有相當大的差異：在雨季峙，湖內植物群集以臺灣水韭為優勢種，分布面積也因湖面擴張而擴大；在乾季時，由於湖面面積逐漸減少，七星山穀精草首先擴展進入湖區，隨後水毛花與五節芒也依序往潮中蔓延；當下次雨季來臨時，臺灣水韭又成為湖中優勢種。 夢幻湖集水區內有芒草與喬木群集，於西元2001年戰備道路發生火災時曾延燒至集水區西北側邊緣坡地，火燒後學者調查發現，野火灰燼散布於湖緣喬木區與芒草區中，但兩者土壤之水質$NO_{3}^{－}$的濃度具明顯差異，喬木區的$NO_{3}^{－}$明顯增高；而芒草區的$NO_{3}^{－}$卻明顯下降。根據上列短文，回答43、44題。
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
