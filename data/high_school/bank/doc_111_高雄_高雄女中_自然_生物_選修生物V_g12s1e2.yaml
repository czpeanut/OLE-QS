  group_stem: 科學家近期的研究更加肯定環境汙染與乳癌間的關聯，與乳癌最相關的汙染源，尤其是以殺蟲劑最受重視。根據研究，<u>波羅的海</u>附近有許多海域受到汙染，吃下這地區的魚獲物的婦女在乳癌罹患率上比其它地區高，<u>丹</u>麥的流行病學研究則指出，婦女經常接觸DDT和紅色三號色素者，得乳癌的機會比較高。「這種汙染可能會發生在許多地區，而且潛伏在人體數十年才發病。」世界衛生組織的Dr. Devra Lee Davis如是說。現在的研究發現許多環境的汙染源能夠模仿人類的雌性素，會刺激人體某些器官，因而影響正常雌性素對器官的調控，導致乳癌的發生。根據上列短文，試回答41、42題。
