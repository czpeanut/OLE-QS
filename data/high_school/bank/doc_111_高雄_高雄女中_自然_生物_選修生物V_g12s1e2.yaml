  - label: B
    content: 幼體的存活率高、成體的存活率低
  - label: C
    content: 生殖潛能低
  - label: D
    content: 以育幼行為保障子代存活數
  - label: E
    content: 無育幼行為，以同時大量產卵保障子代存活數
  group_stem: 奧氏後相手蟹是臺灣陸蟹的一種，背甲寬約2～3公分，非常不起眼，在<u>綠島</u>及<u>墾丁</u>都有分布。成蟹在海岸林底部生活，食性種類繁多，包括植物掉落的枝葉、動物屍體甚至糞便，為海岸林生態系中的清除者。奧氏後相手蟹從數年前開始，便陸續有懷卵母蟹要從海岸林前往大海產卵，經過馬路時被大量路殺。 奧氏後相手蟹的繁殖行為受卵成熟度、氣溫、雨量及月亮週期影響。在<u>臺灣</u>，主要是在每年農曆五月到九月的23至29日，清晨及黃昏的五點到七點左右，懷著卵的母蟹會努力從海岸林中跋涉至海邊潮間帶一次釋出大量的卵。卵孵化出小小的蜉蝣型幼蟲，以更小的蜉蝣生物為食，也會面臨被其他珊瑚礁魚類吃掉的危機，經數次變態後成長為具堅硬外殼的小蟹，再努力跋涉至海岸林生活。 保育團體、特生中心及<u>臺東</u>林管處從數年前開始，發起「綠島護蟹」行動，在奧氏後相手蟹會經過的路段設立警告標示，在馬路兩旁以圍籬擋住母蟹，再由志工及參與遊客徒手將母蟹搬遷至另一邊的海岸，期望能減少母蟹被路殺的情形。<u>義守大學</u>研究團隊有試驗製作陸蟹專用的生態廊道。但經過的陸蟹不多，還要繼續改善。在2015年及2016年，活動期間分別有一萬多隻陸蟹成功的被搬運到海岸產卵，被路殺的個體數從數千隻減少至數百隻。 試回答29～31題：
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
