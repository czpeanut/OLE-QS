  stem: 某森林系學生想了解樹幹的結構，因此將生長錐插入樹幹中，抽出一段自樹皮到樹幹中心的樹條，試問這段木條由外到內依序為何種構造？ (甲) 邊材 (乙) 韌皮部 (丙) 木栓形成層 (丁) 維管束形成層 (戊) 木栓層 (己) 心材
