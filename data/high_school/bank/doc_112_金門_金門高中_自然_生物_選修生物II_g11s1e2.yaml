  section: 1
  number: 1
  type: single
  page: 1
  stem: 風災過後，彤彤家所在的山坡地一片狼藉，彤彤的爺爺決定重新種植樹木，考慮到水土保持，請問下列哪種植物應最適合？
  options:
  - label: A
    content: 孟宗竹
  - label: B
    content: 椰子樹
  - label: C
    content: 茶樹
  - label: D
    content: 樟樹
  answer:
