  stem: 下列關於「觀察植物體營養器官的形態與構造」實驗之敘述，何者正確？
  options:
  - label: A
    content: 鬚根系的青蔥屬於單子葉植物，因此只要是鬚根系，就是單子葉植物
  - label: B
    content: 水生植物與陸生植物氣孔的主要分布位置不相同，是因為兩類植物的水分吸收方式不同所導致
  - label: C
    content: 不同染劑對不同組織中的物質具有不同的結合力，木質素會與番紅染劑（safranin）結合，因此木質部和韌皮纖維等 部位會呈現紅色
  - label: D
    content: 在葉的維管束中，木質部應在韌皮部的下方
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)單子葉植物大部分是鬚根系；(B)主要是會影響水分蒸散；(D)韌皮部在木質部下方。故選(C)。
