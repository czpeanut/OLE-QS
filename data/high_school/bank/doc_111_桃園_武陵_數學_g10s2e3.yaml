- id: doc_111_桃園_武陵_數學_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 請問：玩一次遊戲，擲出的結果是「5，5，5」的機率是？（單選題，3 分）
  options:
  - label: A
    content: $\frac{90}{216}$
  - label: B
    content: $\frac{45}{216}$
  - label: C
    content: $\frac{15}{216}$
  - label: D
    content: $\frac{5}{216}$
  - label: E
    content: $\frac{1}{216}$
  group_stem: '薩爾達公主為獎勵冒險者的辛勞，設計了一款骰子遊戲用來決定給予冒險者的獎金金額。此遊戲是投擲三顆公正的骰子一次，觀察點數的狀況，獎金的計算規則如下：

    ．若三顆骰子點數皆相同，則給予該點數×1000 元的獎金。例如擲出「5，5，5」獎金為 5000 元。

    ．若其中兩顆骰子點數相同，第三顆骰子不同點數時，則給予該相異點數×200 元的獎金。例如擲出「5，5，3」獎金為 600 元、擲出「3，4，3」獎金為 800 元。

    ．若是三顆骰子點數皆不同，則一律給予獎金 100 元。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '終邊$\overline{OP}$的標準位置角為 90°＋θ，又 P 在單位圓上

    ⇒ P（cos（90°＋θ），sin（90°＋θ））

    ⇒ P（－sinθ，cosθ）

    故選(B)'
