- id: doc_111_桃園_武陵_數學_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 請問：玩一次遊戲，擲出的結果是「5，5，5」的機率是？（單選題，3 分）
  options:
  - label: A
    content: $\frac{90}{216}$
  - label: B
    content: $\frac{45}{216}$
  - label: C
    content: $\frac{15}{216}$
  - label: D
    content: $\frac{5}{216}$
  - label: E
    content: $\frac{1}{216}$
  group_stem: '薩爾達公主為獎勵冒險者的辛勞，設計了一款骰子遊戲用來決定給予冒險者的獎金金額。此遊戲是投擲三顆公正的骰子一次，觀察點數的狀況，獎金的計算規則如下：

    ．若三顆骰子點數皆相同，則給予該點數×1000 元的獎金。例如擲出「5，5，5」獎金為 5000 元。

    ．若其中兩顆骰子點數相同，第三顆骰子不同點數時，則給予該相異點數×200 元的獎金。例如擲出「5，5，3」獎金為 600 元、擲出「3，4，3」獎金為 800 元。

    ．若是三顆骰子點數皆不同，則一律給予獎金 100 元。'
  answer:
  - E
  answer_status: disputed
  answer_source: agent_fix
  explanation: 三顆公正骰子共有 $6^3 = 216$ 種結果，出現「5, 5, 5」僅有 1 種，故機率為 $\frac{1}{216}$，選 (E)。
  tags:
    unit:
      code: MA-2-2-4
      book: 數學2（必修）
      chapter: 排列組合與機率
      title: 古典機率
      std: true
    textbook: 數學2（必修） 古典機率
    pattern:
      key: MA-2-2-4:T07
      name: 獨立重複試驗與點數條件枚舉
    labeled_by: agent
    label_confidence: high
    label_note: 解析誤植為三角函數題詳解，且答案 B (45/216) 與題意「5,5,5」機率 1/216 不符
    fixed_by: agent
    fix_note: （人工修正：更正錯誤答案為 E 並替換誤植之他題解析）
  difficulty: 1
  review_note: 原答案卷答案 ['B']，執行 agent 修正為 ['E']
