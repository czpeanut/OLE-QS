  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 已知籤筒內的 10 支籤中有 3 支中獎籤，且每支籤被抽到的機會均等。今有甲、乙、丙三人，依甲、乙、丙的順序各抽出一支籤，且抽出的籤不再放回，則下列哪些選項是正確的？
  options:
  - label: A
    content: 甲中獎的機率最大
  - label: B
    content: 丙中獎的機率為$\frac{3}{10}$
  - label: C
    content: 甲、乙兩人恰有一人中獎的機率為$\frac{7}{10}$
  - label: D
    content: 在甲、乙均中獎的條件下，丙中獎的機率為$\frac{1}{8}$
  - label: E
    content: 在甲中獎的條件下，丙中獎的機率為$\frac{2}{9}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：甲、乙、丙三人的中獎機率相等

    (B)○：P（丙中）＝P（甲中）＝$\frac{3}{10}$

    (C)╳：P（甲乙恰有一人中獎）＝P（甲中且乙不中）＋P（甲不中且乙中）

    ＝$\frac{3}{10}\times \frac{7}{9}+\frac{7}{10}\times \frac{3}{9}$＝$\frac{42}{90}$＝$\frac{7}{15}$

    (D)○：∵甲乙均中獎 ∴輪到丙剩一支中獎籤，所求機率為$\frac{1}{8}$

    (E)○：甲中獎後，P（乙中│甲中）＝P（丙中│甲中）＝$\frac{2}{9}$

    （∵9 支中有 2 支中獎籤）

    故選(B)(D)(E)'
