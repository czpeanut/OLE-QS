  stem: 根據<u>美國</u> CIA 所公布的《世界概況》，一般已開發國家的生育率應該達到 2.00，才得以維持死亡率與生育率的平衡，使國家正常運作。而<u>臺灣</u>的生育率卻僅僅 1.08。<u>歐</u> <u>美</u>媒體最近出現「嬰兒荒」（Baby Bust）此單詞，所謂的「嬰兒荒」為因少子化而造成經濟景氣消退。少子化是<u>臺灣</u>社會愈來愈嚴重的趨勢，未來<u>臺灣</u>要出現生兩個小孩的家庭只會越來越少，甚至生三個小孩更是少之又少。若某家庭有 3 個孩子，A 表示至多有一女孩的事件，B 表示至少有兩男孩的事件，C 表示老大、老二都是男孩的事件（假設生男孩與生女孩機率相同），請選出正確的選項。
