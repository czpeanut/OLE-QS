  answer_source: answer_key
  explanation: '(A)○：P(A)＝P（3 男）＋P（2 男 1 女）＝$\left( \frac{1}{2} \right) ^{3}+C_{2}^{3}\times \left( \frac{1}{2} \right) ^{3}$＝$\frac{1}{2}$

    (B)╳：P(B)＝P（2 男 1 女）＋P（3 男）＝P(A)＝$\frac{1}{2}$

    (C)○：P(C)＝$\frac{1}{2}\times \frac{1}{2}$＝$\frac{1}{4}$

    (D)╳：P（A ∩ B ∩ C）＝$\frac{1}{2}\times \frac{1}{2}\times \frac{1}{2}$＋$\frac{1}{2}\times \frac{1}{2}\times \frac{1}{2}$＝$\frac{1}{4}$

