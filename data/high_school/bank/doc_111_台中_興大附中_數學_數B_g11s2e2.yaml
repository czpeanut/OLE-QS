  answer_status: verified
  answer_source: answer_key
  explanation: '∵A、B 為獨立事件

    ∴P（A∩B）＝P(A)P(B)

    (A)╳：P（A∪B）＝P(A)＋P(B)－P（A∩B）

    ⇒$\frac{1}{2}$＝$\frac{1}{4}$＋P(B)－$\frac{1}{4}$P(B)

    ⇒ P(B)＝$\frac{1}{3}$

    (B)○：∵A、B 為獨立事件

    ∴P（A│B）＝P(A)＝$\frac{1}{4}$

    (C)╳：∵A、B 為獨立事件 ∴A''、B 也是獨立事件

    ⇒ P（A''∩ B）＝P（A''）P(B)＝$\left( 1-\frac{1}{4} \right)$×$\frac{1}{3}$＝$\frac{1}{4}$

    (D)○：承(C) ∵A''、B 為獨立事件 ∴P（A''│B）＝P（A''）＝$\frac{3}{4}$

    (E)○：∵A、B 為獨立事件 ∴A、B'' 也是獨立事件

    ⇒ P（B''│A）＝P（B''）＝1－$\frac{1}{3}$＝$\frac{2}{3}$

    故選(B)(D)(E)'
