  - label: B
    content: ＝$\frac{1}{2}$，則下列哪些選項是正確的？(A) P(B)＝$\frac{1}{4}$(B) P（A│B）＝$\frac{1}{4}$
  - label: C
    content: P（A'∩B）＝$\frac{1}{3}$
  - label: D
    content: P（A'│B）＝$\frac{3}{4}$
  - label: E
    content: P（B'│A）＝$\frac{2}{3}$
  answer:
