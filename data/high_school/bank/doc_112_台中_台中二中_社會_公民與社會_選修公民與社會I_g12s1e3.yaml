questions:
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2023 年 1 月，總統蔡英文宣布，由於去年稅收超徵 4,500 億元，政府將於今年 4 月發給每人 6,000 元現金。請問「普發六千」是否屬於「寬鬆貨幣政策」的範疇？
  options:
  - label: A
    content: 是，因為此措施將增加資金市場上流動的貨幣供給數量
  - label: B
    content: 否，因為減稅與增加政府公共支出才能夠提振經濟景氣
  - label: C
    content: 是，因為此措施將增加民眾收入並具有刺激消費的效果
  - label: D
    content: 否，因為此措施所需的經費是由政府編列特別預算支應
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 貨幣政策工具為調整重貼現率、存款準備率與公開市場操作，並無發放現金或消費券、振興券等措施；發放現金或消費券、振興券屬於政府編列預算的寬鬆性財政政策，故選(D)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 受禽流感等因素影響，雞蛋產量減少，臺灣出現缺蛋問題。此外，烏俄戰爭造成飼料成本上漲，也使雞蛋價格上漲。根據統計，雞蛋產地價格從 2022 年 3 月的 36.5 元∕臺斤漲至 2023 年 3 月的 45.5 元∕臺斤。請問我們是否可以用通貨膨脹的概念解釋臺灣蛋價上漲的現象？
  options:
  - label: A
    content: 是，因為雞蛋產地價格並非漲一次即停，而是持續上漲了一段期間
  - label: B
    content: 否，因為雞蛋漲價的原因是生產成本上升，並非貨幣供應過多所致
  - label: C
    content: 否，因為只是單一產品漲價，屬於商品價格的波動，並非通貨膨脹
  - label: D
    content: 是，因為在短短一年之內，雞蛋產地價格的上漲幅度高達二成以上
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 通貨膨脹是指整體價格物價水準持續上漲的經濟現象。但題幹所述僅為單一產品—雞蛋價格上漲，並非屬於通貨膨脹之情形，故選(C)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2022 年 11 月，中國出現近三十年來最大規模的抗議潮，民眾高舉白紙、高喊口號抗議的景象迅速席捲國際新聞版面，故此行動又被稱為「白紙運動」。在短短一週內，超過半數以上的省分接連爆發規模百人以上的抗議活動，而民眾訴求的口號為「不要封控要自由」，藉以表達對中國防疫政策的不滿。有論者認為，中國政府確實針對防疫政策做出一些調整，可見抗爭真的能帶來改變。然而多數評論者對這場運動的未來不太樂觀，因為中國政府權力極大，監控系統無所不在，民眾想要持續抗爭恐怕仍有困難。下列哪一個社會運動的理論，最能夠說明對「白紙運動」的發展感到不樂觀的論點？
  options:
  - label: A
    content: 資源動員論
  - label: B
    content: 政治機會論
  - label: C
    content: 新社會運動論
  - label: D
    content: 相對剝奪論
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 政治機會論是指政府體制的開放程度與其對於集體行動者所帶來的限制與制度。題文提及評論者對於白紙運動不太樂觀，原因在於中國政府的權力極大，監控無所不在，使運動無法持續，符合該理論的觀點，故選(B)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 當在餐廳用餐時，我們可能會看到菜單上標示「霜降牛」、「雪花牛」，有些高檔餐廳甚至提供「A5 和牛」。在一家燒肉吃到飽的店裡，甲對於 A5 和牛的 A 和 5 完全沒有頭緒，也分不清楚雪花和霜降的差別。相反的，乙常常與家人前往高檔牛肉餐廳，對日本的牛肉分級系統有清楚的了解。對於乙來說，品嚐高級牛肉已經內化為生活風格之一。下列何項概念最能夠描述甲與乙兩人在肉類分級制度知識上的差異？
  options:
  - label: A
    content: 數位落差
  - label: B
    content: 社會資本
  - label: C
    content: 文化位階
  - label: D
    content: 文化資本
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 文化資本是指不同社會地位之家庭所擁有的文化資產，不同於商業市場中所使用的經濟資本。而文化資本則是透過家庭和學校教育所獲得的文化資產，它雖然也包括物質性的事物（如繪畫、古董），但它更強調語言習慣、秉賦才能和學位頭銜等非物質的因素。文中所述「對於乙來說，品嚐高級牛肉已經內化為生活風格之一」，可知甲乙兩人有文化資本上的落差，故選(D)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 資料科學家（Data Scientist）是一種新興的職業，其工作內容融合了演算法、統計、數學和商學等學門。主要負責蒐集資料、處理資料，並且透過這些資料建立模型，從中萃取出有價值的資訊。資料科學家的薪水約為 13 萬美元∕年（約為新臺幣 400 萬元∕年），而在科技巨頭公司工作的資料科學家年薪甚至可高達 30 ～ 40 萬美元（約為新臺幣 900 ～ 1,200 萬元∕年）。在此情況下，功能論和衝突論如何解釋資料科學家高薪的現象？
  options:
  - label: A
    content: 衝突論認為大型的科技跨國企業能藉由大量蒐集使用者的資料並從中獲取利益
  - label: B
    content: 功能論認為資料科學家除了需要博士學歷，還需具備程式語言等能力才可勝任
  - label: C
    content: 衝突論認為在大數據時代，有愈來愈多產業需要根據所蒐集的數據來進行決策
  - label: D
    content: 功能論認為高社會經濟地位的家庭較能夠提供其子女出國學習資訊科技的機會
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)為功能論的觀點。(D)此為衝突論的觀點，認為家庭社經程度能提供子女較好的教育資源，使其較易在社會上取得成功。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 「繭居族」在日本稱為「引きこもり」。根據日本官方的定義，繭居族指的是「待在家裡超過六個月，不工作、不上學也不社交的人」。然而，這個現象並非只出現在日本，世界各大城市都有一些繭居族，而且其人數可能愈來愈多。若在其他條件不變的情況下，繭居族的人數增加，將對社會造成什麼影響？
  options:
  - label: A
    content: 薪資水準下降
  - label: B
    content: 失業人口增加
  - label: C
    content: 社福支出增加
  - label: D
    content: 勞動力人口減少
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 繭居族指的是「待在家裡超過六個月，不工作、不上學也不社交的人」，因為其不找工作，也無工作意願，屬於非勞動力，因此繭居族人數增加，會造成勞動力減少，故選(D)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 坤輿掩埋場位於苗栗龍昇村，是一座收受事業廢棄物的處理場。然而，該場所距離主要農業灌溉水源僅有 300 多公尺，引發當地居民對於水源汙染的擔憂，呼籲政府能完全撤銷開發案。因此，許多環保人士和當地民眾組成反坤輿自救會，希望能阻止坤輿的開發案。自救會成員自 2021 年初開始就鎮守在坤輿掩埋場門口，24 小時輪班阻止大型車輛進出，使得坤輿無法順利試運轉。議員與立委也不時到場聲援。然而，坤輿還疑似動用黑衣人驅趕鎮守在門口的自救會成員，引發爭議。由於當地環保人士和民眾的抗爭，臺中高等行政法院判決坤輿必須進行環評，在環評完成前，苗栗縣政府也必須停止開發案。根據前述訊息以及公民知識判斷，「反坤輿自救會」的行動是否為一種社會運動？
  options:
  - label: A
    content: 是，因為當地居民透過由下而上的集體行動向政府表達其訴求
  - label: B
    content: 否，因為反坤輿行動由議員與立委所主導，無法代表居民意見
  - label: C
    content: 否，因為當地居民是基於私人利益才集結抗爭，並非基於公益
  - label: D
    content: 是，因為當地居民以暴力抗爭的方式，喚起社會輿論高度關注
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)是由民眾由下而上的集體行動，試圖向政府表達訴求，屬於社會運動，為正解。(B)民意代表僅到場聲援，支持表達民眾的訴求，仍屬於社會運動。(C)居民認為此開發案會汙染水源，屬於公共利益，並非私益。(D)文中並未提及居民以暴力抗爭方式來引起社會關注。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 協和發電廠更新改建規劃第四座天然氣接收站擬填海造地，民間團體發起「護海公投」，反對接收站以「填海造地」破壞基隆海洋生態。提案書送交基隆市政府時，某基隆市現任市議員亦到場聲援。請問護海公投是否屬於一種社會運動的手段？
  options:
  - label: A
    content: 是，因為公投提案旨在表達重視環境保育的價值觀
  - label: B
    content: 否，因為此公投案為現任基隆市議員所主導而發起
  - label: C
    content: 是，因為此公投案是經由民間團體由下而上所推動
  - label: D
    content: 否，因為公投提案屬於既有體制內的政治參與管道
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 人民為了解決面臨的問題或實現目標，有計畫性的運用群眾力量，透過陳情、請願、示威遊行等方式，引起社會關注，推動或阻止某種改變的過程，達到影響政府公共政策的制定。而公投為一種制度內的政治參與方式，並不屬於社會運動的手段，故應選(D)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 一份美國研究追蹤 43 位名校畢業的「菁英媽媽」，發現這些女性畢業之後都很順利地找到高薪的專業工作，且多數在結婚之後也是跟丈夫平起平坐。但隨著孩子的出生和教育逐漸涉及家長親自參與，菁英媽媽們很難兼顧工作和家庭，而且丈夫薪水往往比自己高，無法要求他們辭去工作，因此育兒工作逐漸落在這些女性的身上，最終只好辭職成為家庭主婦，等到孩子上大學時才能重新以全職工作為目標。下列敘述中，何者最能夠說明前述研究的主要發現？
  options:
  - label: A
    content: 傳統上以女性為主的照護工作，面臨薪資以及社會地位較低的處境
  - label: B
    content: 因教育程度與年齡的雙重歧視，使全職家庭主婦難以重新回到職場
  - label: C
    content: 市場性勞動的薪資性別不平等，影響高社經地位女性的勞動參與率
  - label: D
    content: 高社經背景家庭為鞏固其社會資本，傾向由高學歷母親教育下一代
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)重點並非在於薪資與社會地位低，因為菁英媽媽的自身教育條件及經濟能力佳，僅是囿於社會價值觀而必須在育兒與工作中抉擇，最後選擇辭職當全職的家庭主婦。(B)菁英媽媽的教育程度佳，並非年齡跟教育的歧視所造成此社會現象。(C)從此文可看出，即使是教育程度高、能力佳的婦女，其丈夫所獲薪資較其更高，顯示出勞動市場的薪資性別不平等現象，而使其須放棄職場回到家庭，也造成高社經地位女性的勞動參與率降低。(D)應是鞏固其文化資本。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 某國因國內外資金不斷流入房地產市場，使得房價居高不下甚至不斷攀升，引起無力購屋者的不滿。為了表達對高房價的抗議，人民發起了一場名為「巢運」的運動，號召民眾夜宿在該國地價最高的住宅區。此舉也提出了改革房產稅制、廣建社會住宅等訴求。政府在數日後對巢運的訴求做出回應，表示將研議修法的可行性。在巢運結束後，國內也相繼成立了推動房產稅制改革、社會住宅等議題的團體，他們表示將持續關注相關議題並監督政府施政。關於該國居住正義運動的屬性與發展，下列哪項詮釋最適當？
  options:
  - label: A
    content: 從社會運動轉變為與政府公私協力廣建社會住宅
  - label: B
    content: 從社會運動轉變為競爭國會議席以實現政治主張
  - label: C
    content: 從社會運動轉變為推動以直接民主決定改革方向
  - label: D
    content: 從社會運動轉變為壓力團體以期實現運動的訴求
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)參與巢運的民眾並未與政府一起興建社會住宅。(B)並未組成政黨，爭取參政權。(C)社會團體監督政府並非直接民主的作為。(D)文中指出「相繼成立了推動房產稅制改革、社會住宅等議題的團體，他們表示將持續關注相關議題並監督政府施政」，可見這場巢運運動使得部分民眾轉為監督政府施政的壓力團體，為正解。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 某國研究者進行了一項研究，發現頂尖國立大學的學生家庭年所得中位數約為 150 萬元，排名較前的國立大學的學生約為 110 萬元，而排名較後的私立大學的學生約為 100 萬元。基於這些研究結果，該研究者最可能得出以下何種推論？
  options:
  - label: A
