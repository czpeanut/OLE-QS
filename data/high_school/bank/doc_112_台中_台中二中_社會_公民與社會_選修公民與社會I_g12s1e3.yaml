  stem: 以下哪個敘述最適合用於評估原住民加分制度對改善原住民學生升學弱勢處境的成效？
  options:
  - label: A
    content: 原住民生與一般生大專院校粗在學率差距持續擴大
  - label: B
    content: 原住民學生在高等教育的升學弱勢處境獲大幅改善
  - label: C
    content: 原住民學生容易因經濟狀況或適應困難而中斷學業
  - label: D
    content: 原住民生與一般生大專院校粗在學率差距略為縮減
  group_stem: '「原住民加分制度」是針對原住民學生升學保障的措施，已存在多年，並歷經多次修改。目前此制度主要分成「加分」與「保障名額」兩個部分。以「考試分發」入學的原住民可以獲得 10 ％的加分，而通過族語認證考試者可以獲得 35 ％的加分。各校需提供外加 2 ％的名額給原住民，但原住民之間仍需競爭這 2 ％的名額。此制度的目的有兩個方向：一是「保存原住民文化」，提供誘因讓原住民更願意去學習族語，並打好保存文化的基礎；二是「改善原住民學生升學弱勢的處境」，透過保障一定就學機會的方式提高原住民的教育程度，並縮減跟一般生之間的差距。

    「大專院校粗在學率」是衡量原住民學生升學狀況的重要指標，計算方式為「該級教育學生人數∕該相當學齡人口數×100 ％」。原住民的大專院校粗在學率與一般生的比較如下圖所示：

    除了「成效」，這個制度也有許多其他方面的討論和爭議。以下是幾位民眾對於原住民加分制度的看法：

    甲：儘管原住民學生使用了額外的名額，但是結果是，一般生即使成績比原住民學生更好，也無法考上原住民學生可以考上的系，這對一般生來說不公平。

    乙：原住民加分制度的概念是基於現實中的不平等，因此需要透過「差別待遇」來實現平等。

    丙：就學和就業應該「因材施教、適才適用」，才能培養出最多的人才。尤其像醫學系這種高度專業的科系，應該以實力錄取，對臺灣整體社會來說更好。

    丁：長期以來，原住民族遭受主流社會的打壓，導致他們在教育、文化等方面處於弱勢地位，因此提供原住民升學保障是必要的。

    戊：儘管我認同現行制度的方向，但「族語認證」這個加分條件其實不公平。這個條件忽略了城鄉差距，很多都市原住民擁有的教育資源其實跟一般生差不多，並不能算是弱勢，卻仍能靠著族語加分。這不僅對一般學生不公平，還會讓真正弱勢的偏鄉原住民學生被剝奪更多機會。

    己：我持有不同意見，我認為在都市原住民中仍有弱勢的人，並且族語認證也不是無償加分，因為通過考試仍然需要付出努力。此外，偏鄉原住民多半生活在部落，擁有較好的族語能力，因此，族語認證能夠保障他們的權益。'
  shared_asset: g1_17_19
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)題幹問題為可改善原住民學生弱勢處境的成效，此兩項無法看出成效，且反而是指擴大差距。(B)雖然在高等教育升學的處境獲改善，但也並非大幅改善，因為仍可能有中途輟學或休學的情形。(D)原住民生與一般生大專院校粗在學率差距縮減是較適切的指標。
