  group_stem: '近年來，某國面臨嚴重的勞工短缺問題。除了傳統製造業缺乏勞工之外，該國國內勞工普遍認為薪資不合理，因此不願意從事觀光產業工作。另外，COVID-19 疫情期間，許多年輕人選擇辭去工作，尋求更好的就業機會。由於疫情離職人潮尚未完全回流，該國短期內的勞工短缺問題不會得到改善。

    該國政府召開會議，商討如何解決勞工短缺問題。以下為該國幾位政府部會首長的發言：

    甲部長：我認為應該全面開放服務業引進移工，並鬆綁聘用移工門檻。

    乙部長：但如此一來，可能會衝擊本國勞工權益。我建議提高最低薪資，以吸引人才投入。

    丙部長：儘管提高最低薪資可以解決勞工短缺問題，但一旦最低薪資超過某個水準，可能會產生副作用，因此需要仔細評估。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)皆為提高最低薪資可能產生的負面效果。(C)無法得知實質薪資是否會上升，因為不知道通貨膨脹之情形，而無法得知實質薪資的增減。
