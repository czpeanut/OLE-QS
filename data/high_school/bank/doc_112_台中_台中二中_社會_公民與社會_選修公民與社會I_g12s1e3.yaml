  explanation: 廣告中人物設定為來自越南的媳婦，且以有些負面的形象呈現，顯現某些族群在媒體呈現其特色時，會帶有刻板印象及偏見，故選(A)。媒體再現為經過新聞媒體產製，將描繪過的社會現象呈現給閱聽人的過程，但重現的過程中可能會注入媒體觀點、建構意義，之後才傳播給訊息接收者。
