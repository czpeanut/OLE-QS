    乙：原住民加分制度的概念是基於現實中的不平等，因此需要透過「差別待遇」來實現平等。

    丙：就學和就業應該「因材施教、適才適用」，才能培養出最多的人才。尤其像醫學系這種高度專業的科系，應該以實力錄取，對臺灣整體社會來說更好。

    丁：長期以來，原住民族遭受主流社會的打壓，導致他們在教育、文化等方面處於弱勢地位，因此提供原住民升學保障是必要的。

    戊：儘管我認同現行制度的方向，但「族語認證」這個加分條件其實不公平。這個條件忽略了城鄉差距，很多都市原住民擁有的教育資源其實跟一般生差不多，並不能算是弱勢，卻仍能靠著族語加分。這不僅對一般學生不公平，還會讓真正弱勢的偏鄉原住民學生被剝奪更多機會。

    己：我持有不同意見，我認為在都市原住民中仍有弱勢的人，並且族語認證也不是無償加分，因為通過考試仍然需要付出努力。此外，偏鄉原住民多半生活在部落，擁有較好的族語能力，因此，族語認證能夠保障他們的權益。'
