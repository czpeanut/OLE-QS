  stem: 依據題文的內容判斷，下列哪些是選文提到的導致物價膨脹的原因？(甲)貨幣增加造成的物價膨脹(乙)貨幣減少造成的物價膨脹(丙)需求拉升造成的物價膨脹(丁)成本推動造成的物價膨脹
  options:
  - label: A
    content: (乙)(丙)
  - label: B
    content: (乙)(丁)
  - label: C
    content: (甲)(丁)
  - label: D
    content: (甲)(丙)
  group_stem: '自 2021 年底以來，包括餐飲、生鮮食品、日用品等在內的物價陸續上漲。據主計總處的資料顯示，2022 年我國的物價膨脹率達 2.95 ％，創下近 14 年來的新高。全球各地都出現了物價上漲的現象，美國更是面臨近 40 年來最高的物價膨脹率。

    一些論者認為，全球物價同時飆漲的原因可從以下幾個面向解釋：首先，自 COVID-19 疫情爆發以來，許多國家實行封城措施，導致工廠無法生產，國際物流運輸大亂，因此許多商品的供應鏈被打斷。其次，自 2022 年 2 月烏俄戰爭爆發後，天然氣、石油、糧食等重要原物料的生產與出口均未能正常運作，原物料供應變少，全球商品價格隨之飆升。最後，2020 年 COVID-19 疫情大爆發時，全球經濟一度停滯，許多國家中央銀行推行貨幣政策以刺激經濟，而當時許多央行也預告未來將發生一定程度的通貨膨脹。總結來說，前述的商品供應和貨幣供應兩個因素同時作用，加速了通貨膨脹的速度。

    由於高通膨對許多人來說造成了不小的困難，為了緩解通貨膨脹的問題，許多國家的中央銀行正在採取一系列貨幣政策，如＿＿＿(<u>甲) </u>或＿＿＿(<u>乙) </u>等方式，以降低消費和投資需求，從而打擊通貨膨脹。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「烏俄戰爭爆發後，天然氣、石油、糧食等重要原物料的生產與出口均未能正常運作，原物料供應變少，全球商品價格隨之飆升」，可判斷物價上漲的原因之一為成本推動的通膨；另一個原因為「中央銀行推行貨幣政策以刺激經濟」，此為貨幣增加造成的物價膨脹，故應選(C)(甲)(丁)。
