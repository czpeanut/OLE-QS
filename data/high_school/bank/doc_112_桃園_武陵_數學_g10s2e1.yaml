- id: doc_112_桃園_武陵_數學_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: (1) 「主計總處國勢普查處表示，2022年工業及服務業受僱員工全年總薪資中位數較2021年增加2.4％，為近四年最大 增幅，2019年以來較高水準。其中，2018年總薪資中位數年增幅3.5％、2019年1.3％，2020年、2021年受疫情影 響，年增幅分別只有0.8％、1％。」請問下列哪一個選項最接近2018年到2022年這五年的總薪資中位數平均年增幅 率。
  options:
  - label: A
    content: $(\frac{3.5+1.3+0.8+1+2.4}{5})\%$
  - label: B
    content: $(\sqrt[5]{3.5\times 1.3\times 0.8\times 1\times 2.4})\%$
  - label: C
    content: $(\sqrt[5]{3.5\times 1.3\times 0.8\times 1\times 2.4}-1)\%$
  - label: D
    content: $(\sqrt[5]{1.035\times 1.013\times 1.008\times 1.01\times 1.024}-1)\%$
  - label: E
    content: $(\sqrt[5]{1.035\times 1.013\times 1.008\times 1.01\times 1.024}-1)\times 100\%$
- id: doc_112_桃園_武陵_數學_g10s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設兩變量x與y的n筆數據為 ( $x_{1}$ , $y_{1}$ ) , ( $x_{2}$ , $y_{2}$ ) ,…, ( $x_{n}$ , $y_{n}$ )，且x與y的平均數分別為μ$_{x}$ , μ$_{y}$，標準差分別為σ$_{x}$ , σ$_{y}$，相關係數為$r_{xy}$。另設兩變數$z_{i}$＝a ( $x_{i}$－μ$_{x}$ )，$w_{i}$＝b ( $y_{i}$－μ$_{y}$ )，相關係數為$r_{zw}$，w對z的迴歸直線為w＝mz＋k，請選出正確的選項。
  options:
  - label: A
    content: 若 ( $x_{1}$ , $y_{1}$ ) , ( $x_{2}$ , $y_{2}$ ) ,…, ( $x_{n}$ , $y_{n}$ )皆落在同一條直線上，則 | $r_{xy}$ |＝1
  - label: B
    content: k＝0
  - label: C
    content: $r_{zw}$＝$r_{xy}$
  - label: D
    content: 若a＝σ$_{y}$，b＝σ$_{x}$，則$r_{zw}$＝m
  - label: E
    content: 若σ$_{y}$＝0，則$y_{1}$＝$y_{2}$＝…＝$y_{n}$
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
