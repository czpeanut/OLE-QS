  page: 1
  stem: 已知 a＋i 與 1＋bi（a，b 均為實數）為實係數三次方程式：$x^{3}$－$8x^{2}$＋cx＋d＝0 的兩根，求 a＋b＋c＋d＝＿＿＿＿。
  explanation: '∵實係數方程式的複數根必為共軛複數

    ∴$\overline{a +i}$＝a－i＝1＋bi$\Rightarrow$a＝1，b＝－1

    令 x＝1 ± i $\Rightarrow$（x－1）$^{2}$＝（± i）$^{2}$ $\Rightarrow$ $x^{2}$－2x＋1＝－1$\Rightarrow$ $x^{2}$－2x＋2＝0

    $x^{3}$－$8x^{2}$＋cx＋d＝（$x^{2}$－2x＋2）（x＋k）

    比較係數得

    $x^{2}$ 項：－8＝k－2 ∴k＝－6

    $x^{1}$ 項：c＝2－2k＝2＋12＝14

    常數項：d＝2k＝2×（－6）＝－12

    ∴a＋b＋c＋d＝1＋（－1）＋14＋（－12）＝2'
