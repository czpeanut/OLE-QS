  stem: 已知α、β為方程式：$x^{2}$＋8x＋5＝0 的兩根，求$\frac{\beta}{\alpha}+\frac{\alpha}{\beta}$＝＿＿＿＿。
  explanation: '∵$x^{2}$＋8x＋5＝0 之兩根為α，β

    ∴由根與係數的關係得$\begin{cases}\alpha +\beta =-\frac{8}{1}=- 8 \\ \alpha \beta =\frac{5}{1}= 5\end{cases}$

    ∴$\frac{\beta}{\alpha}+\frac{\alpha}{\beta}$＝$\frac{\beta ^{2}+\alpha ^{2}}{\alpha \beta}$＝$\frac{(\alpha +\beta )^{2} - 2 \alpha \beta}{\alpha \beta}$＝$\frac{(- 8)^{2}- 2\times 5}{5}$＝$\frac{54}{5}$'
