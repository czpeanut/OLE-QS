  section: 1
  number: 1
  type: fill
  page: 1
  stem: '求下列各式的值：

    (1) $i^{2022}$＝＿＿＿＿。

    (2) $i^{50}$＋$i^{51}$＋……＋$i^{100}$＝＿＿＿＿。'
  answer:
  - (1)－1；(2)－i
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $i^{2022}$＝（$i^{4}$）$^{505}$×$i^{2}$＝$1^{505}$×（－1）＝－1

    (2) ∵$i^{50}$＝$i^{2}$＝－1，又 $i^{51}$＝$i^{50}$×i＝－i

    ∴$i^{50}$＋$i^{51}$＋……＋$i^{100}$＝$\frac{i^{50} (1 -i^{51})}{1 -i}$＝$\frac{(- 1) \times 〔1 -(-i)〕}{1 -i}$

    ＝$-\frac{1 +i}{1 -i}\times \frac{1 +i}{1 +i}$＝$-\frac{1 + 2i +i^{2}}{1^{2}-i^{2}}$

    ＝$-\frac{2i}{2}$＝－i'
  tags:
