  stem: 若2.0升的$X_{2}$氣體與1.0升的$Y_{2}$氣體完全反應，兩者均無剩餘，產生2.0升的R氣體，則下列「哪一選項是R的化學式？（假設反應前後均在同溫同壓的條件）
  options:
  - label: A
    content: XY
  - label: B
    content: $XY_{2}$
  - label: C
    content: $X_{2}$Y
  - label: D
    content: $XY_{3}$
  - label: E
    content: $X_{3}$Y
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 反應時氣體的體積比=方程式的係數比由題目可知係數比為2：1：2。方程式可寫為$2X_{2}$+$Y_{2}$ → 2R。 R=$X_{n}Y_{m}$，化學反應前後原子的種類個數相等，2n=4，n=2；2m=2，m=1。∴R=$X_{2}$Y。故選(C)。
