    content: 3：5
  - label: E
    content: 5：3
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: $CH_{4}$和$CO_{2}$含有相同原子，假設皆含有X個原子，甲烷分子數為$\frac{ X }{ 5 }$，二氧化碳分子數為$\frac{ X }{ 3 }$。同溫同壓下氣體分子數比=氣體體積比，∴體積比$CH_{4}$：$CO_{2}$＝$\frac{ X }{ 5 }$：$\frac{ X }{ 3 }$＝3：5。故選(D)。
