  stem: 下列所陳述的關係，何者符合倍比定律？
  options:
  - label: A
    content: $O_{2}$與$O_{3}$中氧原子數的比值
  - label: B
    content: 氕、氘、氚所含質子數
  - label: C
    content: 水與過氧化氫中所含氧的量
  - label: D
    content: 二氧化碳與二氧化硫中所含氧的量
  - label: E
    content: 生石灰(CaO)與熟石灰(Ca(OH)$_{2}$)中所含鈣的量
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 倍比定律：若兩元素形成兩種以上的化合物時，在這二種或多種化合物中，一元素的質量若相等，則另一元素質量恆成簡單整數比。(A)只有一種元素，為同素異形體；(B)氕、氘、氚質子數都為1；(C)水$H_{2}$O、過氧化氫$H_{2}O_{2}$符合為兩元素形成的化合物；(D)$CO_{2}$、$SO_{2}$非兩元素形成的化合物；(E)生石灰CaO、熟石灰Ca(OH)$_{2}$。Ca(OH)$_{2}$有3個元素。故選(C)。
  tags:
