  stem: 小節在實驗室中進行實驗，若10.8克的鋁與45.3克的二氧化錫恰完全反應，可生成錫與20.4克的氧化鋁。若錫與氧完全反應可生成9.06克二氧化錫，則需要約多少克的錫參與反應？
  options:
  - label: A
    content: '3.57'
  - label: B
    content: '5.4'
  - label: C
    content: '7.14'
  - label: D
    content: '10.2'
  - label: E
    content: '17.81'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 質量守恆，20.4克的氧化鋁中，氧重：20.4－10.8＝9.6克，全部來自二氧化錫，所以二氧化錫中錫重＝45.3－9.6＝35.7克。9.06克二氧化錫為45.3克二氧化錫的$\frac{ 1 }{ 5 }$，需要錫$\frac{ 35.7 }{ 5 }$=7.14克。故選(C)。
