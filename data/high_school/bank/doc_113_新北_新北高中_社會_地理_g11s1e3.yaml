- id: doc_113_新北_新北高中_社會_地理_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《世界是平的》一書指出：「只要有寬頻，只要有雄心，不管你在哪裡，都不會被邊緣化，競爭的立足點變平等了。」「小時候爸媽常說：『兒子啊，乖乖把飯吃完，因為中國跟印度的小孩沒飯吃』。現在我則說：『女兒啊，乖乖把書唸完，因為中國跟印度的小孩正等著搶你的飯碗』。」上述最能夠反映下列何種現象？
  options:
  - label: A
    content: 中國 5G 網路技術的發展，仍與歐美已開發國家差距甚遠，處於經濟的邊陲地區
  - label: B
    content: 在全球環境尺度下，陸地起伏相對不明顯，所以可被視為是平坦的
  - label: C
    content: 在全球國際分工下，各地經貿關係的密切，使個人或企業競爭激烈
  - label: D
    content: 在全球暖化影響下，海水上升將淹沒耕地，導致各國面臨糧食危機
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)在全球分工的比較利益原則之下，世界各地都可能成為分工的一部分，也可能成為競爭對手。
