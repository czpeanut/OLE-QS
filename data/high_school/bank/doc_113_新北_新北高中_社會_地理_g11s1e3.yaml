- id: doc_113_新北_新北高中_社會_地理_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 對全球化的敘述：(甲)運輸、通訊方式的革新與國際貿易的進步促進了全球化的發展(乙)全球化是指資金、貨物與資訊等事物在全球快速流通的現象(丙)隨著市場的擴大，開發中國家的農民可從糧食運銷公司獲得更高的收購價格(丁)全球化解除了國家間貿易的藩籬，區域經濟組織的影響力逐漸縮小(戊)金融全球化，各區域除可獲得跨國企業的投資外，還可增加就業機會，縮小貧富差距。上述哪兩項是正確的？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 丁戊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 全球化之後，比較利益原則發揮到最極致，(丙)競價現象更為激烈，不易有更高的收購價格；(丁)區域經濟組織（如歐盟）與全球化並沒有牴觸；(戊)有資源者更有利競爭，貧富差距會擴大。
- id: doc_113_新北_新北高中_社會_地理_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '下表為 2021 年中南美洲部分國家的都市化程度數據，請問中南美洲近百年來的都市化發展，與下列哪些因素關係最為密切？(甲)都市工商業迅速發展的拉力大(乙)鄉村貧困導致推力太強(丙)大地主制壓縮了小佃農的生計(丁)政府政策鼓勵人口往市中心移動

    | 國家 | 阿根廷 | 巴西 | 智利 | 哥倫比亞 | 古巴 | 墨西哥 | 秘魯 | 世界平均 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 都市化程度（％） | 92.2 | 87.3 | 87.8 | 81.7 | 77.3 | 81.0 | 78.5 | 56.6 |'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 乙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)中南美洲的高度都市化，非因都市高度工業化的拉力所造成。而是鄉村因為過去大地主制，佃農無地可耕造成的貧窮推力，使人口大量往都市移動所形成的假性都市化。
