  stem: 《美國國家科學院院刊》（PNAS）對美國沿岸地區提出警告，由於全球海平面不斷上升，估計將影響超過 2,000 萬人。研究認為，「甲」與「乙」兩大城市已失去挽救的時機，必須要有最壞打算。地處佛羅里達州的「甲」市因地勢低，加上所屬地質為石灰岩，容易有滲水問題，即便是興建堤防或防波堤，效果也並不顯著；而位於密西西比河出海口的「乙」市，則因開採石油、天然氣、超抽地下水等問題，不斷地下沉。根據上述，文中的甲、乙市分別為下列何者？
  options:
  - label: A
    content: 洛杉磯、休士頓
  - label: B
    content: 邁阿密、紐奧良
  - label: C
    content: 紐約、底特律
  - label: D
    content: 聖地牙哥、達拉斯
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)甲：邁阿密為佛羅里達最大城；乙：紐奧良位於密西西比河出海口。
- id: doc_113_新北_新北高中_社會_地理_g11s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 4
  stem: 雖然跨國生產鏈已涵蓋全球，但因各國工業化水準不同，全球化在區域上的發展是不平衡的。全球化經濟下，美國、日本與歐盟等國家已成為全球經濟的核心區，而非洲、南亞與中南美洲的許多開發中國家則屬於邊陲地帶，以人均
    GDP 的分布來看，可明顯看出其區域差異，且差異日益擴大，而造成此現象最主要的影響因素為何？
  options:
  - label: A
    content: 人口多寡
  - label: B
    content: 國際產業分工
  - label: C
    content: 國土面積
  - label: D
    content: 國際區域結盟
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)在國際產業分工之下，核心區掌握關鍵技術，獲利豐厚；邊陲區負責加工組裝，利潤微薄。
- id: doc_113_新北_新北高中_社會_地理_g11s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 4
  stem: 美國地質條件多變化，反映在富饒的礦產資源上，請問下列敘述何者正確？
  options:
  - label: A
    content: 煤礦—古老結晶岩，阿帕拉契山區
  - label: B
    content: 水力資源—高山峽谷地形，洛磯山
  - label: C
    content: 石油—廣大珊瑚礁群，巴哈馬群島
  - label: D
    content: 鐵礦—淺海盆地，墨西哥灣
  answer:
  - B
  answer_status: verified
