  page: 1
  stem: 在「世界都市」體系中，臺北市雖然不是全球等級的世界都市，但被認定是重要的國家性或區域性據點都市。請問到目前為止，臺北市最主要是將臺灣下列哪項區域特性與全球接合，而使臺北市能成為「世界都市」網路上的重要節點？
  options:
  - label: A
    content: 全球運籌中心
  - label: B
    content: 華人文化圈創意平臺
  - label: C
    content: 亞太跨國連結的商運紐帶
  - label: D
    content: 高科技量產研發中心
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)臺灣科技製造業、半導體製程的研發能力目前為世界第一，具世界都市重要性。
