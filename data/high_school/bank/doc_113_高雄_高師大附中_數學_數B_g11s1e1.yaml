- id: doc_113_高雄_高師大附中_數學_數B_g11s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 如右圖為函數 y＝a sin（bx＋c）的部分圖形，其中 a＞0，b＞0，$-\frac{\pi}{2}\leq$c$\leq$π，且 A（0，5），B（0，－5），則下列各項敘述何者正確？
  options:
  - label: A
    content: a＝5
  - label: B
    content: b＝3
  - label: C
    content: c＝$\frac{\pi}{2}$
  - label: D
    content: y 的週期為$\frac{2\pi}{3}$
  - label: E
    content: 其圖形可由 y＝5 sin3x 往左平移$\frac{\pi}{6}$單位而得
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_113_高雄_高師大附中_數學_數B_g11s1e1/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 455.4
      - 148.8
      - 564.3
      - 260.2
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：由振幅為 5 且 a＞0，可知 a＝5

    (B) ○ (D) ○：由題圖可知每$\frac{\pi}{3}$走完半個循環，即週期為$\frac{2\pi}{3}$

    ⇒ $\frac{2\pi}{| b |}$＝$\frac{2\pi}{b}$＝$\frac{2\pi}{3}$ ⇒ b＝3

    (C) ╳：將（0，－5）代入 y＝5 sin（3x＋c）可得－5＝5 sinc

    ⇒ sinc＝－1

    ⇒ c＝$\frac{3\pi}{2}$＋2kπ，k$\inℤ$

    ∵$-\frac{\pi}{2}\leq$c$\leq$π

    ∴c＝$-\frac{\pi}{2}$

    (E) ╳：y＝5 sin$\left( 3x -\frac{\pi}{2} \right)$為原函數

    y＝5 sin3x $\xrightarrow{往左平移 \frac{\pi}{6} 單位}$ y＝5 sin$\left( 3 \left( x +\frac{\pi}{6} \right) \right)$＝5 sin$\left( 3x +\frac{\pi}{2} \right)$≠5 sin$\left( 3x -\frac{\pi}{2} \right)$

    故選(A)(B)(D)'
