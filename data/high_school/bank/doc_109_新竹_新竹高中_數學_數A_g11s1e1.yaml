- id: doc_109_新竹_新竹高中_數學_數A_g11s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些選項是正確的？
  options:
  - label: A
    content: cos10＞cos10°
  - label: B
    content: tan3＞tan3°
  - label: C
    content: cos1＞sin1°
  - label: D
    content: sin2＞sin1＞sin3
  - label: E
    content: tan1＞tan3＞tan2
  explanation: '(A)╳：∵10（弳）$\approx$573° ∴cos10$\approx$cos573°＝cos213°＜0＜cos10°

    (B)╳：∵3（弳）$\approx$171.9° ∴tan3$\approx$tan171.9°＜0＜tan3°

    (C)○：∵1（弳）$\approx$57.3° ∴cos1$\approx$cos57.3°＝sin32.7°＞sin1°

    (D)(E)○：∵1（弳）$\approx$57.3°，2（弳）$\approx$114.6°，3（弳）$\approx$171.9°

    ∴sin2$\approx$sin114.6°＝sin65.4°＞sin57.3°$\approx$sin1＞sin8.1°＝sin171.9°$\approx$sin3

    $\Rightarrow$sin2＞sin1＞sin3

    且 tan1＞0＞tan171.9°$\approx$tan3＞tan135°＞tan114.6°$\approx$tan2

    $\Rightarrow$tan1＞tan3＞tan2

    故選(C)(D)(E)'
- id: doc_109_新竹_新竹高中_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 有關函數 f（x）＝3 sin$\left( 2x - \frac{\pi}{2} \right)$（x 為實數），下列哪些敘述是正確的？
  options:
  - label: A
    content: f（x）週期為π
  - label: B
    content: f（x）在 x＝π時有最小值
  - label: C
    content: 其圖形對稱於 x＝π
  - label: D
    content: 其圖形對稱於原點（0，0）
  - label: E
    content: y＝3 sin$\left( 2x - \frac{\pi}{2} \right)$之圖形，可由 y＝3 sin2x 圖形向右平移$\frac{\pi}{2}$單位而得到
  explanation: 'f（x）＝$3 \sin \left( 2x - \frac{\pi}{2} \right)$＝$3 \sin 2 \left( x - \frac{\pi}{4} \right)$

    (A)○：f（x）週期為$\frac{2\pi}{2}$＝π

    (B)○：當 x＝π 時，f（π）＝3 sin$\frac{3\pi}{2}$＝－3 有最小值

    (C)○：f（π＋t）＝3 sin$\left( 2 ( \pi + t ) - \frac{\pi}{2} \right)$＝3 sin$\left( \pi - 2 ( \pi + t ) + \frac{\pi}{2} \right)$＝3 sin$\left( - 2t - \frac{\pi}{2} \right)$

    ＝3 sin$\left( 2\pi - 2t - \frac{\pi}{2} \right)$＝3 sin$\left( 2 ( \pi - t ) - \frac{\pi}{2} \right)$＝f（π－t）

    故 f（x）對稱於 x＝π

    (D)╳：圖形應為線對稱於 x＝0

    (E)╳：應為向右平移$\frac{\pi}{4}$

    故選(A)(B)(C)'
- id: doc_109_新竹_新竹高中_數學_數A_g11s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 右圖可為下列哪些函數的（部分）圖形？
  options:
  - label: A
    content: y＝2 sin3x
  - label: B
    content: y＝－2 sin3x
  - label: C
    content: y＝2 cos$\left( 3x + \frac{\pi}{2} \right)$
  - label: D
    content: y＝2 cos$\left( 3x - \frac{\pi}{2} \right)$
  - label: E
    content: y＝－2 cos3$\left( x - \frac{\pi}{6} \right)$
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_109_新竹_新竹高中_數學_數A_g11s1e1/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 420.4
      - 416.6
      - 564.3
      - 541.45
  explanation: '令題圖函數為 y＝a sin（bx＋c）＋d

    由振幅為 2，週期為$\frac{2\pi}{3}$，高低點中點為 0

    可知 a＝2，b＝3，d＝0，故 y＝2 sin（3x＋c）

    又函數過$\left( \frac{\pi}{6} , - 2 \right)$，則－2＝2 sin$\left( \frac{\pi}{2} + c \right)$，可取 c＝π

    $\Rightarrow$y＝2 sin（3x＋π）

    (A)╳：2 sin3x≠2 sin（3x＋π）

    (B)○：y＝－2 sin3x＝2 sin（3x＋π）

    (C)○：y＝2 cos$\left( 3x + \frac{\pi}{2} \right)$＝－2 sin3x＝2 sin（3x＋π）

    (D)╳：y＝2 cos$\left( 3x - \frac{\pi}{2} \right)$＝2 sin3x≠2 sin（3x＋π）

    (E)○：y＝－2 cos3$\left( x - \frac{\pi}{6} \right)$＝－2 cos$\left( 3x - \frac{\pi}{2} \right)$＝－2 sin3x＝2 sin（3x＋π）

    故選(B)(C)(E)'
- id: doc_109_新竹_新竹高中_數學_數A_g11s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 若θ為第四象限角，且 tanθ＝$- \frac{3}{4}$，則下列哪些選項正確？
  options:
  - label: A
    content: tan2θ＝$- \frac{7}{24}$
  - label: B
    content: sin2θ＝$- \frac{24}{25}$
  - label: C
    content: 2θ為第四象限角
  - label: D
    content: $\frac{\theta}{2}$為第二象限角
  - label: E
    content: $\cos \frac{\theta}{2} = -\frac{1}{\sqrt{5}}$
  explanation: '∵θ為第四象限角且 tanθ＝$- \frac{3}{4}$ ∴sinθ＝$-\frac{3}{5}$且 cosθ＝$\frac{4}{5}$

    (A)╳：tan2θ＝$\frac{2\tan \theta}{1 - \tan ^{2}\theta}$＝$\frac{- \frac{3}{2}}{1 - \frac{9}{16}}$＝$\frac{- \frac{24}{16}}{\frac{7}{16}}$＝$- \frac{24}{7}$

    (B)○：sin2θ＝2 sinθcosθ＝$-\frac{24}{25}$

    (C)○：∵tan2θ＜0 且 sin2θ＜0 ∴2θ為第四象限角

    (D)╳：∵$\frac{3\pi}{2} + 2k\pi <\theta <2\pi + 2k\pi$ ∴$\frac{3\pi}{4} + k\pi <\frac{\theta}{2}<\pi + k\pi$

    當 k 為偶數，$\frac{\theta}{2}$為第二象限角；當 k 為奇數，$\frac{\theta}{2}$為第四象限角

    (E)╳：$\cos \frac{\theta}{2}$＝$\pm \sqrt{\frac{1 + \cos \theta}{2}}$＝$\pm \sqrt{\frac{9}{10}}$＝$\pm \frac{3}{\sqrt{10}}$，故選(B)(C)'
- id: doc_109_新竹_新竹高中_數學_數A_g11s1e1_s1_5
  section: 1
  number: 5
  type: multiple
  page: 2
  stem: 關於函數 f（x）＝2 cos$\left( \frac{\pi}{3} - x \right)$－2 cosx，下列哪些敘述是正確的？
  options:
  - label: A
    content: 若 f（x）＝2 cos$\left( \frac{\pi}{3} - x \right)$－2 cosx＝a cosx＋b sinx，則 a＋b＞0
  - label: B
    content: f（x）的週期為π
  - label: C
    content: f（x）的最大值為$2\sqrt{2}$
  - label: D
    content: 若 f（x）＝2 cos$\left( \frac{\pi}{3} - x \right)$－2 cosx＝2 sin（x＋θ），且 0$\leq$θ＜2π，則θ＝$\frac{11\pi}{6}$
  - label: E
    content: 若 f（x）＝2 cos$\left( \frac{\pi}{3} - x \right)$－2 cosx＝2 cos（x＋θ），且 0$\leq$θ＜2π，則θ＝$\frac{4\pi}{3}$
  explanation: '(A)○：f（x）＝2 cos$\left( \frac{\pi}{3} - x \right)$－2 cosx＝$2 \left( \frac{1}{2}\cos x + \frac{\sqrt{3}}{2}\sin x \right)$－2 cosx

    ＝－cosx＋$\sqrt{3}$sinx

    則 a＋b＝（－1）＋$\sqrt{3}$＞0

    (B)╳：f（x）＝－cosx＋$\sqrt{3}$sinx

    ＝$2 \left( -\frac{1}{2}\cos x + \frac{\sqrt{3}}{2}\sin x \right)$＝2 sin$\left( x - \frac{\pi}{6} \right)$，週期為 2π

    (C)╳：最大值為 2

    (D)○：f（x）＝2 sin$\left( x - \frac{\pi}{6} \right)$＝2 sin$\left( x - \frac{\pi}{6} + 2\pi \right)$＝2 sin$\left( x + \frac{11\pi}{6} \right)$，θ＝$\frac{11\pi}{6}$

    (E)○：f（x）＝2 sin$\left( x - \frac{\pi}{6} \right)$＝2 cos$\left( \frac{\pi}{2} - \left( x - \frac{\pi}{6} \right) \right)$＝2 cos$\left( \frac{2\pi}{3} - x \right)$

    ＝2 cos$\left( x - \frac{2\pi}{3} \right)$＝2 cos$\left( x + \frac{4\pi}{3} \right)$，θ＝$\frac{4\pi}{3}$

    故選(A)(D)(E)'
