- id: doc_109_新竹_新竹高中_數學_數A_g11s1e1_s2_5
  section: 2
  number: 5
  type: fill
  page: 2
  stem: 已知 x 為任意實數，f（x）＝cos2x－5 sinx，若 f（x）之最大值為 M、最小值 m，則數對（M，m）＝＿＿＿＿。
  explanation: 'f（x）＝cos2x－5 sinx＝1－2 $sin^{2}$x－5 sinx

    ＝$- 2 \left( \sin ^{2} x + \frac{5}{2}\sin x + \frac{25}{16} \right) + \frac{25}{8} + 1$＝$- 2 \left( \sin x + \frac{5}{4} \right) ^{2} + \frac{33}{8}$

    當 x＝$\frac{\pi}{2}$時，有最小值為$f\left( \frac{\pi}{2} \right)$＝－6

    當 x＝$\frac{3\pi}{2}$時，有最大值為$f\left( \frac{3\pi}{2} \right)$＝4

    故數對（M，m）＝（4，－6）'
- id: doc_109_新竹_新竹高中_數學_數A_g11s1e1_s2_6
  section: 2
  number: 6
  type: fill
  page: 2
  stem: 已知 f（x）＝$\sqrt{3}$sinx－3 cosx，若在$- \frac{\pi}{2}\leq x\leq \frac{\pi}{2}$之範圍內，f（x）之最大值為 M、最小值為 m，則數對（M，m）＝＿＿＿＿。
  explanation: 'f（x）＝$\sqrt{3}$sinx－3 cosx＝$2\sqrt{3} \left( \frac{1}{2}\sin x - \frac{\sqrt{3}}{2}\cos x \right)$＝$2\sqrt{3} \sin \left( x - \frac{\pi}{3} \right)$

    ∵$- \frac{\pi}{2}\leq x\leq \frac{\pi}{2}$ ∴$- \frac{5\pi}{6}\leq x - \frac{\pi}{3}\leq \frac{\pi}{6}$

    當$x - \frac{\pi}{3} = \frac{\pi}{6}$時，也就是 x＝$\frac{\pi}{2}$時，M＝$f\left( \frac{\pi}{2} \right) = 2\sqrt{3}\times \frac{1}{2} = \sqrt{3}$

    當$x - \frac{\pi}{3} = -\frac{\pi}{2}$時，也就是 x＝$- \frac{\pi}{6}$時，m＝$f\left( -\frac{\pi}{6} \right) = - 2\sqrt{3}$

    故數對（M，m）＝$( \sqrt{3} , - 2\sqrt{3} )$'
