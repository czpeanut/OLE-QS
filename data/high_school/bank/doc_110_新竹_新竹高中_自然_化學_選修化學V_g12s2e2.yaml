  answer_status: verified
  answer_source: answer_key
  explanation: $Na_{2}S_{2}O_{3}$＝0.01×25＝0.25（毫莫耳），由$2S_{2}O_{3}^{2－}$＋$I_{2}$ → $2I^{－}$＋$S_{4}O_{6}^{2－}$ 可知， $I_{2}$有0.125毫莫耳， 又由$ClO^{－}$＋$2I^{－}$＋$2H^{＋}$ → $Cl^{－}$＋$I_{2}$＋$H_{2}$O可知，$ClO^{－}$ 有0.125毫莫耳， 故 [$ClO^{－}$]＝0.125 / 5＝0.025（M）。
