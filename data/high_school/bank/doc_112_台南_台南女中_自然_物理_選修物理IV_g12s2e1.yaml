  stem: 右圖為某靜電場的電力線分布，其中 A、B 兩點的電場量值與電位分別為 $E_{A}$、$E_{B}$ 與 $V_{A}$、$V_{B}$，下列敘述何者正確？
  options:
  - label: A
    content: 將相同正電荷分別置於 A、B，則在 A 處時所受靜電力量值較小
  - label: B
    content: 將相同負電荷分別置於 A、B，則在 B 處時電位能較大
  - label: C
    content: $E_{A}$＜$E_{B}$，$V_{A}$＞$V_{B}$
  - label: D
    content: $E_{A}$＞$E_{B}$，$V_{A}$＞$V_{B}$
  - label: E
    content: $E_{A}$＞$E_{B}$，$V_{A}$＜$V_{B}$
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1/s1_5_f1.png
    crop:
      page: 2
      rect:
      - 445.2
      - 222.45
      - 565.1
      - 342.35
  answer:
