  answer_status: verified
  answer_source: answer_key
  explanation: 從電場線的分布可以推斷出，愈接近電場線密集處，電場強度愈大，根據題圖中的分布，可以得出 $E_{A}$＞$E_{B}$，而電場是由高電位指向低電位，因此
    $V_{A}$＜$V_{B}$，故選(E)。
- id: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 如右圖所示，在一小段電流 IΔ 外側，有五個等距離且共平面的點 A、B、C、D、E，則圖中 C 點磁場量值為 B 點的幾倍？
  options:
  - label: A
    content: $\frac{1}{2}$
  - label: B
    content: '2'
  - label: C
    content: '1'
    asset:
      key: s1_6_optC
      file: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1/s1_6_optC.png
      crop:
        page: 2
        rect:
        - 480.35
        - 527.95
        - 564.75
        - 613.85
  - label: D
    content: $\frac{1}{\sqrt{2}}$
  - label: E
    content: $\sqrt{2}$
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1/s1_6_f1.png
    crop:
      page: 2
      rect:
      - 480.2
      - 367.45
      - 565.1
      - 463.35
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)必歐-沙伐定律用來計算由電流產生的磁場，公式：ΔB＝$\frac{\mu _{0}}{4\pi}\frac{I(\Delta
    \ell )\sin \theta}{r^{2}}$

    其中：ΔB 是磁場量值；μ$_{0}$ 是磁導率常數；I（Δl）是電流的大小；θ是電流與觀測點之間的角度（指電流方向與到觀測點位置向量之間的夾角）；r 是電流元到觀測點的距離。根據必歐-沙伐定律，磁場與距離
    r 的平方成反比，與角度θ有正弦關係。

    (2)圖像分析：

    從題圖中，我們可以看到電流 IΔ 位於圓的中心，五個點 A、B、C、D、E 位於圓周上，C、B 這兩個點分別位於電流的垂直方向（C 點）與 45°方向（B
    點）。

    根據必歐-沙伐定律，可知：

    ①磁場與距離 r 的平方成反比，因此 r 值影響磁場量值。

    ②磁場與角度θ的正弦函數成正比。

    (3)分別計算 B 點與 C 點的磁場量值。

    ①對 B 點：角度θ$_{B}$＝45°；距離 $r_{B}$＝r；磁場量值Δ$B_{B}$＝$\frac{\mu _{0}}{4\pi}\frac{I(\Delta
    \ell )\sin 45^{^{\circ}}}{r^{2}}$

    ∵sin45°＝$\frac{\sqrt{2}}{2}$ ∴Δ$B_{B}$＝$\frac{\mu _{0}}{4\pi}\frac{I(\Delta \ell
    )\frac{\sqrt{2}}{2}}{r^{2}}$

    對 C 點：角度θ$_{C}$＝90°（因為點 C 位於垂直方向）；距離 $r_{C}$＝r；磁場量值

    Δ$B_{C}$＝$\frac{\mu _{0}}{4\pi}\frac{I(\Delta \ell )\sin 90^{^{\circ}}}{r^{2}}$

    ∵sin90°＝1 ∴Δ$B_{C}$＝$\frac{\mu _{0}}{4\pi}\frac{I(\Delta \ell )}{r^{2}}$

    (4)求 C 點磁場量值相對於 B 點磁場量值的比值：

    $\frac{\Delta B_{C}}{\Delta B_{B}}$＝$\frac{\frac{\mu _{0}}{4\pi}\frac{I(\Delta
    \ell )}{r^{2}}}{\frac{\mu _{0}}{4\pi}\frac{I(\Delta \ell )\frac{\sqrt{2}}{2}}{r^{2}}}$＝$\frac{1}{\frac{\sqrt{2}}{2}}$＝$\sqrt{2}$

    因此，C 點的磁場量值是 B 點的$\sqrt{2}$倍。

    故選(E)。'
