- id: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 兩個點電荷＋Q 與－2Q，分別置於坐標（0 , 0）與（1 , 0）處，如右圖所示，則下列哪一個點的電位為零？
  options:
  - label: A
    content: （－1 , 0）
  - label: B
    content: （－$\frac{1}{3}$ , 0）
  - label: C
    content: （$\frac{2}{3}$ , 0）
  - label: D
    content: （2 , 0）
  - label: E
    content: （0 , 2）
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '對於＋Q 電荷，它在距離該點 $r_{1}$ 的地方產生的電位為 $\frac{kQ}{r_{1}}$（V）。

    對於－2Q 電荷，它在距離該點 $r_{2}$ 的地方產生的電位為－$\frac{2kQ}{r_{2}}$（V）。

    該點的總電位為 0 V，因此有$\frac{kQ}{r_{1}}$－$\frac{2kQ}{r_{2}}$＝0（V）

    簡化後得到 $\frac{1}{r_{1}}$＝$\frac{2}{r_{2}}$

    表示該點與＋Q 電荷的距離 $r_{1}$ 是－2Q 電荷距離 $r_{2}$ 的一半

    該點與＋Q〔在（0 , 0）〕的距離是 1，與－2Q〔在（1 , 0）〕的距離是 2

    根據公式：$\frac{kQ}{1}$－$\frac{2kQ}{2}$＝0，故選(A)'
