- id: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 凡德格拉夫起電機因為電壓太大通常無法直接利用三用電表測量其表面電位，需利用電位的定義來間接測量其表面電位，實驗如右示意圖，球體直徑為 20 cm 的凡德格拉夫起電機，測量其距離球心
    50 cm（距離球表面為 40 cm 處）的電壓相較於距離其球心 45 cm（距離球表面為 35 cm 處）的電壓減少 100 V，則此金屬球體的表面電壓為多少
    V？（相對於地面）（k＝9×$10^{9}$ N．$m^{2}$∕$C^{2}$）
  options:
  - label: A
    content: 4.50×$10^{3}$
  - label: B
    content: 4.05×$10^{3}$
  - label: C
    content: 2.70×$10^{3}$
  - label: D
    content: 1.35×$10^{3}$
  - label: E
    content: 1.08×$10^{3}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '利用電位差的公式：ΔV＝kQ（$\frac{1}{r_{1}}$－$\frac{1}{r_{2}}$）

    其中，$r_{1}$＝50 cm、$r_{2}$＝45 cm，電位差 ΔV＝100 V。代入數值計算後，求得 Q，接著計算金屬球體表面的電壓 V，利用 r＝20
    cm 的球體表面距離代入公式。計算結果，表面電壓為 4500 V＝4.50×$10^{3}$ V，故選(A)。'
- id: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 如右圖為一平行電板，兩板間電位差為 V，均勻電場量值為 E，將一個電量為 q、質量為 m 的帶正電粒子置於兩板之間，粒子會受靜電力作用而運動，不考慮重力，下列敘述何者正確？
  options:
  - label: A
    content: 粒子在兩板間的加速度量值為 $\frac{qE}{m}$
  - label: B
    content: 粒子位於 A 處時所受的靜電力大於 B 處
  - label: C
    content: 粒子在 A 處時的電位等於在 B 處時的電位
  - label: D
    content: 粒子在 B 處時的電位能大於在 A 處時的電位能
  - label: E
    content: 粒子自下板面到達上板面時，動能會增加 qV
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1/s1_4_f1.png
    crop:
      page: 2
      rect:
      - 451.2
      - 60.95
      - 565.1
      - 150.85
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)粒子在均勻電場中受的靜電力為 F＝qE，根據牛頓第二運動定律，粒子所受的加速度為 a＝$\frac{F}{m}$＝$\frac{qE}{m}$。

    (B)在均勻電場中，粒子在各位置受的靜電力相同，與位置無關。

    (C)在均勻電場中，電位隨位置不同而變化，A 處與 B 處的電位不同。

    (D)在均勻電場中，電位能會隨著粒子位置變化，帶正電粒子靠近高電位時，電位能增加，靠近低電位時，電位能減少。

    (E)當粒子移動時，其動能增加的大小等於所受的電位差乘以電荷量。'
- id: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1_s1_5
