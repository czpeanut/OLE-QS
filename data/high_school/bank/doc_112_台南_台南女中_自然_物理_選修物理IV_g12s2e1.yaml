- id: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1_s2_16
  section: 2
  number: 16
  type: multiple
  page: 5
  stem: 將氫核與氘核（$_{1}^{2}H$）放在同一平行電板的正電板上由靜止釋放，則達負電板時兩核之比，下列哪些正確？
  options:
  - label: A
    content: 動能比 1：2
  - label: B
    content: 動量量值比 1：$\sqrt{2}$
  - label: C
    content: 受力量值比 1：1
  - label: D
    content: 所需時間比 2：1
  - label: E
    content: 速率比$\sqrt{2}$：1
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)根據電場力作功的情況，動能的增量僅取決於電場力作的功 W＝qEd，與質量無關，由於氫核與氘核的電荷相同，它們在到達負電板時的動能應該相等，所以動能比應為
    1：1。

    (B)動量 p＝mv，由於氘核的質量是氫核的兩倍，而氫核的速度是氘核速度的$\sqrt{2}$倍，動量的比值應為 $p_{氫核}$：$p_{氘核}$＝1：$\sqrt{2}$。

    (C)兩者所受的電場力為 F＝qE，由於氫核與氘核的電荷相等，因此它們在電場中的受力量值相等。

    (D)時間與加速度相關，由於加速度 a＝$\frac{F}{m}$，質量不同導致氘核的加速度是氫核的一半 $a_{氫核}$：$a_{氘核}$＝2：1，根據運動學公式
    d＝$\frac{1}{2}at^{2}$，所需的時間比應為 $t_{氫核}$：$t_{氘核}$＝1：$\sqrt{2}$。

    (E)氫核的質量是氘核的一半，因此根據動能公式 K＝$\frac{1}{2}mv^{2}$，氫核的速度會比氘核快，速率比應為$\sqrt{2}$：1。'
- id: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1_s2_17
  section: 2
  number: 17
  type: multiple
  page: 5
  stem: 兩球形導體 A、B，半徑各為 2R 與 3R，令無窮遠處電位為零，則電位分別為 2V、3V，今以導線相連，則下列敘述哪些正確？
  options:
  - label: A
    content: 未連接兩導體球之前，兩者帶電量比為 9：4
  - label: B
    content: 連接後，兩球帶電量的比為 2：3
  - label: C
    content: 連接後，兩球表面電場量值比為 2：3
    asset:
      key: s2_17_optC
      file: doc_112_台南_台南女中_自然_物理_選修物理IV_g12s2e1/s2_17_optC.png
      crop:
        page: 5
        rect:
        - 453.2
        - 549.65
        - 565.1
        - 647.05
  - label: D
    content: 連接後，兩球電位比為 1：1
  - label: E
    content: 連接後，A 球的電位為$\frac{13}{5}$V
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)對於球形導體，電位 V 與其所帶的電荷量 Q 和半徑 R 的關係為 V＝$\frac{kQ}{R}$，其中 k 是庫侖常數。

    (2)當兩個導體相連後，達到靜電平衡時，它們的電位相等。

    (A)由於兩球的電位與半徑不同，未連接之前，根據公式 V＝$\frac{kQ}{R}$可以計算出電荷量：

    $V_{A}$＝$\frac{kQ_{A}}{2R}$＝2V ⇒ $Q_{A}$＝$\frac{4RV}{k}$

    $V_{B}$＝$\frac{kQ_{B}}{3R}$＝3V ⇒ $Q_{B}$＝$\frac{9RV}{k}$

    因此，兩球未連接前的帶電量比為$\frac{Q_{A}}{Q_{B}}$＝$\frac{\frac{4RV}{k}}{\frac{9RV}{k}}$＝$\frac{4}{9}$
    ⇒ $Q_{A}$：$Q_{B}$＝4：9

    (B)連接後，兩個球的電位將相等，假設電位為 $V_{f}$，根據電位公式：$V_{f}$＝$\frac{kQ_{A}''}{2R}$＝$\frac{kQ_{B}''}{3R}$

    得出兩球的帶電量之比為 $\frac{Q_{A}''}{Q_{B}''}$＝$\frac{2R}{3R}$＝$\frac{2}{3}$ ⇒ $Q_{A}$''：$Q_{B}$''＝2：3

    (C)球形導體表面的電場量值 E 可由此公式計算：E＝$\frac{V}{R}$

    因此，連接後兩球的電場量值比應為 $\frac{E_{A}}{E_{B}}$＝$\frac{\frac{V_{f}}{2R}}{\frac{V_{f}}{3R}}$＝$\frac{3}{2}$
    ⇒ $E_{A}$：$E_{B}$＝3：2

    (D)連接後，兩球的電位相等，因此電位比為 1：1。

    (E)導體相連後的總電荷量為 $Q_{total}$＝$Q_{A}$＋$Q_{B}$＝$\frac{4RV}{k}$＋$\frac{9RV}{k}$＝$\frac{13RV}{k}$

    由於總電荷在兩球之間重新分布，且兩球的電位相等，因此它們的電位為

    $V_{f}$＝$\frac{kQ_{total}}{2R\text{+}3R}$＝$\frac{k\times \frac{13RV}{k}}{5R}$＝$\frac{13}{5}$V
    ∴連接後 A 球的電位為$\frac{13}{5}$V'
