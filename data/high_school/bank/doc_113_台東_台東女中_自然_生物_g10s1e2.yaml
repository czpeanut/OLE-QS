  type: single
  page: 1
  stem: 下列有關細胞週期的敘述，何者正確？
  options:
  - label: A
    content: 生物體的每個細胞都具有細胞週期
  - label: B
    content: 細胞週期不包含細胞的生長期
  - label: C
    content: 細胞分裂期可分為細胞核分裂、細胞質分裂及有絲分裂
  - label: D
    content: 細胞週期可分為間期與細胞分裂期，其中以間期的時間最長
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 有些細胞（如神經元、肌肉細胞、紅血球細胞）一旦分化成熟，便脫離細胞週期，失去分裂的能力。

    (B) 細胞週期包含間期（生長期）與細胞分裂期。

    (C) 細胞分裂期可分為細胞核分裂及細胞質分裂。'
