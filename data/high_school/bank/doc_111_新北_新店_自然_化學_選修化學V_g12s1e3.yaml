  stem: 鋰離子電池正極材料是含鋰的二氧化鈷（$LiCoO_{2}$），充電時，$LiCoO_{2}$中Li被氧化，$Li^{＋}$遷移並以原子形式嵌入電池負極材料碳（$C_{6}$）中，以$LiC_{6}$表示。 電池反應為：$CoO_{2}$＋$LiC_{6}$ $\xrightarrow[充電]{放電}$ $LiCoO_{2}$＋$C_{6}$ 下列敘述何者正確？
  options:
  - label: A
    content: 充電時，電池的陰極反應為$LiC_{6}$ → $Li^{＋}$＋$C_{6}$＋$e^{－}$
  - label: B
    content: 放電峙，電池的正極反應為$CoO_{2}$＋$Li^{＋}$＋$e^{－}$ → $LiCoO_{2}$
  - label: C
    content: 此電池可用含有過氯酸鋰的水溶液為電解質
  - label: D
    content: 放電時，電池內部$Li^{＋}$向陽極移動
  - label: E
    content: 充電時$LiC_{6}$端應接電源的正極
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)陰極發生還原反應，此選項中的反應為氧化反應；(B)正確；(C)鋰遇水會起火燃燒，故鋰電池不以水為溶液；(D)題幹所言：充電時，$Li^{＋}$遷移並嵌入負極（陽極）材料中，故放電時應是離開負極（陽極）才對；(E)由題幹得知，碳材料端為負極，故充電時應接於負極。故選(B)。
  tags:
