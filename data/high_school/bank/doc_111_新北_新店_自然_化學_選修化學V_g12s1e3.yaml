  stem: 未知濃度$K_{2}Cr_{2}O_{7}$(aq) 20.0 mL於酸性液下加入過量KI使$K_{2}Cr_{2}O_{7}$完全還原成$Cr^{3＋}$，再用0.2 M $Na_{2}S_{2}O_{3}$滴定所得之$I_{2}$用去30.0 mL之$Na_{2}S_{2}O_{3}$，此反應式為 2 $S_{2}O_{3}^{2－}$＋$I_{2}$ 一→ $S_{4}O_{6}^{2－}$＋2 $I^{－}$，則原$K_{2}Cr_{2}O_{7}$之濃度為：
  options:
  - label: A
    content: 0.1 M
  - label: B
    content: 0.2 M
  - label: C
    content: 0.05 M
  - label: D
    content: 0.8 M
  - label: E
    content: 0.16 M
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: $Cr_{2}O_{7}^{2－}$得電子數＝$I^{－}$失電子數＝$S_{2}O_{3}^{2－}$失電子數，又每莫耳二鉻酸鉀還原可得到6莫耳電子（$Cr_{2}O_{7}^{2－}$ → 2 $Cr^{3＋}$）；每莫耳硫代硫酸根氧化失去一莫耳電子（$S_{2}O_{3}^{2－}$ → $\frac{1}{2}S_{4}O_{6}^{2－}$）。 故可列式：（$Cr_{2}O_{7}^{2－}$體積）×（$Cr_{2}O_{7}^{2－}$濃度）×6＝（$S_{2}O_{3}^{2－}$體積）×（$S_{2}O_{3}^{2－}$濃度）×1 得20×C×6＝30×0.2×1，可得到C＝0.05。故選(C)。
