  type: single
  page: 1
  stem: 函數 y＝f（x）＝－$x^{2}$＋2x 的圖形沿 x 軸向右平移 p 單位，y 軸向上平移 q 單位，得新圖形的函數為 y＝g（x）＝－$x^{2}$－2x＋2，則（p，q）＝
  options:
  - label: A
    content: （2，－2）
  - label: B
    content: （2，2）
  - label: C
    content: （－4，2）
  - label: D
    content: （－2，2）
  - label: E
    content: （4，2）
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝－$x^{2}$＋2x$\xrightarrow[上移 q]{右移 p}$－（x－p）$^{2}$＋2（x－p）＋q

    又－（x－p）$^{2}$＋2（x－p）＋q＝－$x^{2}$－2x＋2

    ⇒－$x^{2}$＋（2＋2p）x＋（q－$p^{2}$－2p）＝－$x^{2}$－2x＋2

    比較係數得$\begin{cases}2 + 2p =-2 \\ q - p^{2}- 2p =2\end{cases}$⇒$\begin{cases}p =-2 \\ q = 2\end{cases}$

    即（p，q）＝（－2，2）

    故選(D)'
