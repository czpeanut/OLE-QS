    ⇒ $mx^{2}$＋（m－3）＞0，且 m＞0

    則判別式＜0，即

    $0^{2}$－4m（m－3）＜0

    ⇒ m（m－3）＞0

    ⇒ m＞3 或 m＜0（不合）

    故選(E)'
