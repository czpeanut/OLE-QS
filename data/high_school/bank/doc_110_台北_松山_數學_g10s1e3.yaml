  stem: 已知二次函數 y＝f（x）圖形通過下列三點 P（0，1）、Q（1，4）、R（3，4），試求此二次函數圖形的頂點為＿＿＿＿。
  answer:
  - （2，5）
  answer_status: verified
  answer_source: answer_key
  explanation: '由 Q，R 兩點可知對稱軸為 x＝2，

    可設 f（x）＝a（x－2）$^{2}$＋b

    由$\begin{cases}f(1) = a + b = 4 \\ f(0) = 4a + b = 1\end{cases}$⇒$\begin{cases}a =-1 \\ b = 5\end{cases}$

    故 f（x）＝－（x－2）$^{2}$＋5，頂點為（2，5）'
- id: doc_110_台北_松山_數學_g10s1e3_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 設多項式 f（x）除以 $x^{2}$＋5x－6，餘式為 2x－1；除以 $x^{2}$－x－6，餘式為 x＋4，則多項式 f（x）除以 $x^{2}$＋x－2 的餘式為＿＿＿＿。
  answer:
  - $-\frac{1}{3}x +\frac{4}{3}$
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝（$x^{2}$＋5x－6）$Q_{1}$（x）＋2x－1

    ＝（x＋6）（x－1）$Q_{1}$（x）＋2x－1

    可知 f(1)＝1

    又 f（x）＝（$x^{2}$－x－6）$Q_{2}$（x）＋x＋4

    ＝（x－3）（x＋2）$Q_{2}$（x）＋x＋4

    可知 f（－2）＝2

    令 f（x）＝（$x^{2}$＋x－2）$Q_{3}$（x）＋ax＋b

    $\begin{cases}f(1) = 1 \\ f(-2) = 2\end{cases}$⇒$\begin{cases}1 = a + b \\ 2 =-2a + b\end{cases}$⇒$\begin{cases}a =-\frac{1}{3} \\ b =\frac{4}{3}\end{cases}$

    故餘式為$-\frac{1}{3}x +\frac{4}{3}$'
- id: doc_110_台北_松山_數學_g10s1e3_s3_4
  section: 3
  number: 4
  type: fill
  page: 2
  stem: 已知二次函數 f（x）＝$ax^{2}$＋bx－1 在 x＝1 時有最大值$-\frac{2}{a}$，求 f（－1）＝＿＿＿＿。
  answer:
  - －7
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意可知

    $\begin{cases}f(1)=-\frac{2}{a} \\ \frac{-b}{2a}= 1\end{cases}$⇒$\begin{cases}a + b - 1 =-\frac{2}{a}\cdots \cdots \cdots \cdots \cdots ① \\ -b = 2a \cdots \cdots \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    ②代入①得 a－2a－1＝$-\frac{2}{a}$

    ⇒$a -\frac{2}{a}$＝－1

    ⇒ $a^{2}$＋a－2＝0

    ⇒（a＋2）（a－1）＝0

    ⇒ a＝－2 或 1

    ∵y＝f（x）有最大值

    ∴a＝－2，代入②得 b＝4

    故 f（x）＝－$2x^{2}$＋4x－1

    所求 f（－1）＝－2－4－1＝－7'
- id: doc_110_台北_松山_數學_g10s1e3_s3_5
  section: 3
