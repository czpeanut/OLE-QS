  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝$ax^{2}$＋bx＋c

    (A)╳：∵開口向下

    ∴a＜0

    又頂點 x 坐標$\frac{-b}{2a}$＞0

    ⇒ b＞0

    (B)○：a＋2b＋4c＝$4\left( \frac{a}{4}+\frac{b}{2}+c \right)$

    ＝$4f\left( \frac{1}{2} \right)$＞0

    (C)○：∵f(2)＜f(0)

    ∴4a＋2b＋c＜c

    ⇒ 4a＋2b＜0

    又 b＞0，

    故 4a＋b＜4a＋2b＜0

    (D)╳：∵y＝f（x）和 x 軸有兩交點

    ∴$b^{2}$－4ac＞0

    又 a＜0 且 c＞0，故 ac＜0

    ⇒ $b^{2}$－8ac＝（$b^{2}$－4ac）－4（ac）＞0

    (E)○：當 0 ≤ x ≤ 2 時，由題圖可知 x＝2 有最小值，

    即最小值 f(2)＝4a＋2b＋c

    故選(B)(C)(E)'
- id: doc_110_台北_松山_數學_g10s1e3_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 設 f（x）＝（$x^{3}$＋$2x^{2}$＋1）（$x^{2}$＋x－1）＋$2x^{2}$＋1，下列何者正確？
  options:
  - label: A
    content: f（x）除以 x＋1 的餘式為 3
  - label: B
    content: x 是 f（x）的因式
  - label: C
    content: f（x）除以 $x^{3}$＋$2x^{2}$＋1 的餘式為 $2x^{2}$＋1
  - label: D
    content: f（x）除以 $2x^{3}$＋$4x^{2}$＋2 的餘式為$x^{2}+\frac{1}{2}$
  - label: E
    content: f（x）除以 $x^{2}$＋x－1 的商式為 $x^{3}$＋$2x^{2}$＋1
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：所求即為 f（－1）＝（－1＋2＋1）（1－1－1）＋2＋1

    ＝1≠3

    (B)○：f(0)＝1．（－1）＋1＝0

    故 x 為 f（x）的因式

    (C)○：∵f（x）＝（$x^{3}$＋$2x^{2}$＋1）（$x^{2}$＋x－1）＋$2x^{2}$＋1，

    且 deg（$2x^{2}$＋1）＜deg（$x^{3}$＋$2x^{2}$＋1）

    ∴$2x^{2}$＋1 即為餘式

    (D)╳：f（x）＝（$x^{3}$＋$2x^{2}$＋1）（$x^{2}$＋x－1）＋$2x^{2}$＋1

    ＝（$2x^{3}$＋$4x^{2}$＋2）$\left( \frac{1}{2}x^{2}+\frac{1}{2}x -\frac{1}{2} \right)$＋$2x^{2}$＋1

    餘式為 $2x^{2}$＋1

    (E)╳：f（x）＝（$x^{2}$＋x－1）（$x^{3}$＋$2x^{2}$＋1）＋$2x^{2}$＋1

    ＝（$x^{2}$＋x－1）（$x^{3}$＋$2x^{2}$＋1）＋2（$x^{2}$＋x－1）－2x＋3

    ＝（$x^{2}$＋x－1）（$x^{3}$＋$2x^{2}$＋3）－2x＋3

    商式為 $x^{3}$＋$2x^{2}$＋3

    故選(B)(C)'
