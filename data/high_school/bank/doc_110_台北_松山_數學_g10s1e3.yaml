  page: 2
  stem: 若函數 f（x）＝$x^{3}$－$3x^{2}$ 經過水平右移 a 單位，鉛直上移 b 單位，得到一新函數 g（x）的圖形，已知 g（x）的對稱中心為（3，5），求數對（a，b）＝＿＿＿＿。
  answer:
  - （2，7）
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$x^{3}$－$3x^{2}$

    ＝（$x^{3}$－$3x^{2}$＋3x－1）－3x＋1

    ＝（x－1）$^{3}$－3（x－1）－2

    將 y＝f（x）右移 a 單位，上移 b 單位可得

    g（x）＝（x－1－a）$^{3}$－3（x－1－a）－2＋b

    則$\begin{cases}1 + a = 3 \\ -2 + b = 5\end{cases}$⇒$\begin{cases}a = 2 \\ b = 7\end{cases}$

    故數對（a，b）＝（2，7）'
- id: doc_110_台北_松山_數學_g10s1e3_s3_6
  section: 3
  number: 6
  type: fill
  page: 2
  stem: 不等式（$x^{3}$－1）（$x^{2}$－2x－2）（1－x）＞0 的解為＿＿＿＿。（以區間表示）
  answer:
  - $( 1 -\sqrt{3} , 1)\cup ( 1 , 1 +\sqrt{3} )$
  answer_status: verified
  answer_source: answer_key
  explanation: '（$x^{3}$－1）（$x^{2}$－2x－2）（1－x）＞0

    ⇔（x－1）<u>（$x^{2}$＋x＋1）</u>（x－（1＋$\sqrt{3}$））（x－（1－$\sqrt{3}$））（x－1）＜0

    恆正

    ⇔（x－1）$^{2}$（x－（1＋$\sqrt{3}$））（x－（1－$\sqrt{3}$））＜0

    ① 當 x＝1 時，0＜0，不合

    ② 當 x≠1 時，（x－1）$^{2}$ 恆正，

    即（x－（1＋$\sqrt{3}$））（x－（1－$\sqrt{3}$））＜0

    ⇒ 1－$\sqrt{3}$＜x＜1＋$\sqrt{3}$

    由①、②可得 1－$\sqrt{3}$＜x＜1 或 1＜x＜1＋$\sqrt{3}$

    解區間為$( 1 -\sqrt{3} , 1)\cup ( 1 , 1 +\sqrt{3} )$'
- id: doc_110_台北_松山_數學_g10s1e3_s3_7
  section: 3
  number: 7
  type: fill
  page: 2
  stem: 已知不等式 $ax^{2}$＋bx＋c＞0 的解為－3＜x＜$\frac{1}{2}$，求不等式 $cx^{2}$＋bx＋a ≥ 0 的解為＿＿＿＿。（以區間表示）
  answer:
  - $\left( -\infty , -\frac{1}{3} \right] \cup [ 2 , \infty )$
  answer_status: verified
  answer_source: answer_key
  explanation: '－3＜x＜$\frac{1}{2}$為不等式$\left( x -\frac{1}{2} \right) (x + 3 )$＜0 之解

    $\left( x -\frac{1}{2} \right) (x + 3 )$＜0 ⇔ $x^{2}+\frac{5}{2}x -\frac{3}{2}$＜0

    ⇔$-x^{2}-\frac{5}{2}x +\frac{3}{2}$＞0

    可知 a：b：c＝－1：$-\frac{5}{2}$：$\frac{3}{2}$

    可令 a＝－2t，b＝－5t，c＝3t，t＞0

    $cx^{2}$＋bx＋a ≥ 0 ⇔ $3tx^{2}$－5tx－2t ≥ 0

    ⇔ $3x^{2}$－5x－2 ≥ 0

    ⇔（3x＋1）（x－2）≥ 0

    ⇔ x ≥ 2 或 x ≤$-\frac{1}{3}$

    解區間為$\left( -\infty , -\frac{1}{3} \right] \cup [ 2 , \infty )$'
