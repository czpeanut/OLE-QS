  answer:
  - $( 0 , 1 ]\cup [ 3 , 4 )$
  answer_status: verified
  answer_source: answer_key
  explanation: '令 x＝$\overline{AE}$，$\overline{BE}$＝y，

    則 x＋y＝4 且 $x^{2}$＋$y^{2}$＝$\overline{EH}^{2}$≥ 10

    y＝4－x 代入得 $x^{2}$＋（4－x）$^{2}$ ≥ 10

    ⇒ $2x^{2}$－8x＋6 ≥ 0

    ⇒ $x^{2}$－4x＋3 ≥ 0

    ⇒（x－3）（x－1）≥ 0

    ⇒ x ≥ 3 或 x ≤ 1

    ∵0＜x＜4

    ∴0＜x ≤ 1 或 3 ≤ x＜4

    解區間為（0，1]∪[3，4）'
