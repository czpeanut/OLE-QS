  stem: $x^{101}$＋$5x^{6}$－2 除以 33x＋33 的餘式為
  options:
  - label: A
    content: '2'
  - label: B
    content: '0'
  - label: C
    content: －2
  - label: D
    content: '4'
  - label: E
    content: －6
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$x^{101}$＋$5x^{6}$－2＝（33x＋33）Q（x）＋r

    ＝（x＋1）（33Q（x））＋r

    ∴可直接計算除以 x＋1 之餘式

    由餘式定理，r＝（－1）$^{101}$＋5．（－1）$^{6}$－2＝2

    故選(A)'
- id: doc_110_台北_松山_數學_g10s1e3_s1_2
  section: 1
