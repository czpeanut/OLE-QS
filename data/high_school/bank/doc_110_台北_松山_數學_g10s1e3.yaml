- id: doc_110_台北_松山_數學_g10s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 右圖為拋物線 y＝$ax^{2}$＋bx＋c 的圖形，下列何者正確？
  options:
  - label: A
    content: b＜0
  - label: B
    content: a＋2b＋4c＞0
  - label: C
    content: 4a＋b＜0
  - label: D
    content: $b^{2}$－8ac＜0
  - label: E
    content: 當 0 ≤ x ≤ 2 時 y 有最小值 4a＋2b＋c
  assets:
  - key: s2_3_f1
    kind: figure
    file: doc_110_台北_松山_數學_g10s1e3/s2_3_f1.png
    crop:
      page: 2
