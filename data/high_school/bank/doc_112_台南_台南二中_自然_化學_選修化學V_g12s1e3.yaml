  stem: 在方程式$I_{2}$＋$OH^{－}$ → $I^{－}$＋$IO_{3}^{－}$＋$H_{2}$O中（未平衡）$I_{2}$作為氧化劑者占全部參與反應之$I_{2}$的比例為多少？
  options:
  - label: A
    content: $\frac{1}{6}$
  - label: B
    content: $\frac{1}{5}$
  - label: C
    content: $\frac{1}{3}$
  - label: D
    content: $\frac{1}{2}$
  - label: E
    content: $\frac{5}{6}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 反應式：$3I_{2}$＋$6OH^{－}$ → $5I^{－}$＋$IO_{3}^{－}$＋$3H_{2}$O，其中作為氧化劑（被還原）的碘為$I^{－}$，占$\frac{5}{6}$。故選(E)。
