  explanation: 由得電子量＝失電子量。因兩滴定的對象都是同樣的$Fe^{2＋}$溶液，故兩種氧化劑得電子的總mol數相等。又酸性環境下每mol的$KMnO_{4}$作為氧化劑可得5 mol電子、每mol的$K_{2}CrO_{7}$作為氧化劑可得6 mol電子。即可列式0.2×X×5＝0.1×Y×6，可得$\frac{X}{Y}$＝0.6。故選(C)。
