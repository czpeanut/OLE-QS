  stem: 取下列各物質的0.1 M水溶液各5.0 mL，分別加入0.3 M的$KMnO_{4}$酸性溶液0.5 mL時，何者能使$KMnO_{4}$的紫色完全消失？
  options:
  - label: A
    content: $Na_{2}SO_{4}$
  - label: B
    content: $Na_{2}C_{2}O_{4}$
  - label: C
    content: $BaCl_{2}$
  - label: D
    content: Ca(OH)$_{2}$
  - label: E
    content: $FeSO_{4}$
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 氧化還原滴定，若過錳酸鉀得電子數＜還原劑失電子數，則可使過錳酸鉀完全褪色。即：5×0.3×0.5＜n×0.1×5，整理可得n＞1.5，即每個還原劑分子/離子氧化時須轉移至少兩個電子才能滿足此條件。 (A)不為還原劑；(B) $C_{2}O_{4}^{2－}$ → $2CO_{2}$＋$2e^{－}$；(C) $2Cl^{－}$ → $Cl_{2}$＋$2e^{－}$；(D)不為還原劑；(E) $Fe^{2＋}$ → $Fe^{3＋}$＋$e^{－}$。故選(B)(C)。
