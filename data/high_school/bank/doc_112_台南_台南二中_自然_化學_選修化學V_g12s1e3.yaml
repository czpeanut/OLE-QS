- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關氧化數的敘述，下列何者正確？
  options:
  - label: A
    content: 在化合物中每種元素皆具有多種氧化數
  - label: B
    content: $Pb_{3}O_{4}$中之Pb必有兩個以上之氧化數
  - label: C
    content: $C_{2}H_{5}$OH中兩個C的氧化數均為－2
  - label: D
    content: 金屬的氧化數必為正，非金屬的氧化數必為負
  - label: E
    content: 典型元素中除F以外，其他元素的最高氧化數均等於族數
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不一定，例如$H_{2}$O中H就只有＋1一種氧化數；(B)正確，有＋2、＋4兩種；(C)錯誤，由結構式可得知分別為－1、－3；(D)非金屬也可為正，例如硝酸中的N＝＋5；(E)錯誤，氧最高僅能達＋2。故選(B)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列日常應用，何者與氧化還原反應<u>無關</u>？
  options:
  - label: A
    content: 吃維生素C可預防壞血病
  - label: B
    content: 用含次氯酸根的漂白水來殺死病毒
  - label: C
    content: 利用蝶豆花液做漸層飲料
  - label: D
    content: 用水果釀酒
  - label: E
    content: 蘋果的新切面過一段時間後變成褐色
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)維生素C為還原劑；(B)次氯酸根為氧化劑，可將病毒氧化殺死；(C)蝶豆花為酸鹼指示劑；(D)葡萄糖發酵成酒精屬於氧化還原反應；(E)褐色為蘋果中的成分氧化而得。故選(C)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列何種方法無法得到$I_{2}$？
  options:
  - label: A
    content: $Cl_{2}$＋KI →
  - label: B
    content: $KIO_{3}$＋$SO_{4}^{2－}$ →
  - label: C
    content: $H_{2}O_{2}$＋$I^{－}$＋$H^{＋}$ →
  - label: D
    content: $I^{－}$＋$IO_{3}^{－}$＋$H^{＋}$ →
  - label: E
    content: $MnO_{4}^{－}$＋$H^{＋}$＋$I^{－}$ →
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)氯活性大於碘，故可發生氧化還原反應；(B)不反應；(C)過氧化氫在酸性環境下作為氧化劑，可將碘離子氧化成碘分子；(D) $5I^{－}$＋$IO_{3}^{－}$＋$6H^{＋}$ → $3I_{2}$＋$3H_{2}$O；(E)過錳酸根為強氧化劑，可將碘離子氧化成碘分子。故選(B)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列何者是過錳酸鉀（$KMnO_{4}$）在酸性溶液中進行化學反應的半反應式？
  options:
  - label: A
    content: $MnO_{4}^{－}$＋$5e^{－}$＋$8H^{＋}$ → $Mn^{2＋}$＋$4H_{2}$O
  - label: B
    content: $MnO_{4}^{－}$＋$4e^{－}$＋$8H^{＋}$ → $Mn^{3＋}$＋$4H_{2}$O
  - label: C
    content: $MnO_{4}^{－}$＋$4e^{－}$＋$4H_{2}$O → $Mn^{3＋}$＋$8OH^{－}$
  - label: D
    content: $MnO_{4}^{－}$＋$3e^{－}$＋$2H_{2}$O → $MnO_{2}$＋$4OH^{－}$
  - label: E
    content: $MnO_{4}^{－}$＋$3e^{－}$＋$4H^{＋}$ → $MnO_{2}$＋$2H_{2}$O
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 在酸性環境下，過錳酸鉀作為氧化劑，其產物為$Mn^{2＋}$。故選(A)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 人體血紅蛋白中含有$Fe^{2＋}$，如果誤食亞硝酸鹽，會使人中毒，因為亞硝酸鹽會使$Fe^{2＋}$轉變成$Fe^{3＋}$，生成高鐵血紅蛋白而喪失與$O_{2}$結合的能力。服用維生素C就可緩解亞硝酸鹽的中毒，這是因為維生素C具有下列何種性質？
  options:
  - label: A
    content: 酸性
  - label: B
    content: 鹼性
  - label: C
    content: 氧化力
  - label: D
    content: 還原力
  - label: E
    content: 脫水性
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 亞硝酸鹽為氧化劑，維生素C可抵銷之，故為還原劑。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列反應中畫線的物質，何者作為氧化劑？
  options:
  - label: A
    content: $\underline{Cr_{2}O_{7}^{2-}}$＋$3H_{2}O_{2}$＋$8H^{＋}$ → $2Cr^{3＋}$＋$3O_{2}$＋$7H_{2}$O
  - label: B
    content: $H_{2}O_{2}$＋2<u>NaOH</u> → $Na_{2}O_{2}$＋$2H_{2}$O
  - label: C
    content: 2$\underline{Fe^{2+}}$＋$H_{2}O_{2}$＋$2H^{＋}$ → $2Fe^{3＋}$＋$2H_{2}$O
  - label: D
    content: $\underline{SO_{3}^{2-}}$＋$4H_{2}O_{2}$ → $PbSO_{4}$＋$4H_{2}$O
  - label: E
    content: $\underline{SO_{3}^{2-}}$＋$H_{2}O_{2}$ → $SO_{4}^{2－}$＋$H_{2}$O
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) Cr氧化數＋6 → ＋3，被還原，為氧化劑；(B)氧化數無變化；(C) Fe氧化數＋2 → ＋3，被氧化，為還原劑；(D) S氧化數－2 → ＋6，被氧化，為還原劑；(E) S氧化數＋4 → ＋6，被氧化，為還原劑。故選(A)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 碘可以形成很多種氧化物， 且可具有不同的氧化數。有一種很特殊的碘與氧的化合物稱為碘酸碘。已知其中碘的氧化數分別為＋3與＋5，則下列何者是碘酸碘的化學式？
  options:
  - label: A
    content: $I_{2}O_{3}$
  - label: B
    content: $I_{3}O_{5}$
  - label: C
    content: $I_{3}O_{6}$
  - label: D
    content: $I_{4}O_{5}$
  - label: E
    content: $I_{4}O_{9}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 氧的氧化數＝－2，故各選項中可先計算出碘的總氧化數，再計算是否可由＋3、＋5兩種氧化數搭配碘原子的數量組合出。(A)碘總氧化數＝＋6，共2個碘原子，故不可能由＋3、＋5組合出；(B)碘總氧化數＝＋10，共3個碘原子，故不可能由＋3、＋5組合出；(C)碘總氧化數＝＋12，共3個碘原子，故不可能由＋3、＋5組合出；(D)碘總氧化數＝＋10，共4個碘原子，故不可能由＋3、＋5組合出；(E)碘總氧化數＝＋18，共4個碘原子，故可由＋3、＋5、＋5、＋5組合出。故選(E)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有關氯氣通人水中的反應$Cl_{2}$＋$H_{2}$O → HClO＋HCl，下列敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 此反應為自身氧化還原反應
  - label: B
    content: 在反應中還原劑的強弱為$Cl_{2}$＞HCl
  - label: C
    content: 在強鹼中有利於向右反應
  - label: D
    content: 水既非氧化劑也非還原劑
  - label: E
    content: 氯水是利用次氯酸的強還原力進行消毒
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)氯氧化數：$Cl_{2}$(0) → HClO(＋1)、HCl(－1)，為自身氧化還原反應；(B)反應向右，故左方的還原劑較右方的還原劑強；(C)強鹼會將兩個產物的酸中和，使平衡向右移動；(D)只有氯自身氧化還原；(E)氯氣本身就有很強的還原力，比次氯酸還強。故選(E)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 曾盛裝過錳酸鉀（$KMnO_{4}$）溶液的玻璃器血，乾後有時會留下用水洗不掉的棕色汙痕，最好用何者清洗？
  options:
  - label: A
    content: 蒸餾水
  - label: B
    content: 硫酸
  - label: C
    content: 硝酸
  - label: D
    content: 草酸
  - label: E
    content: 醋酸
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 該汙痕為二氧化錳，可被草酸還原成二價亞錳離子。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列何者<u>不是</u>自身氧化還原反應？
  options:
  - label: A
    content: $2H_{2}$O → $2H_{2}$＋$O_{2}$
  - label: B
    content: $Na_{2}S_{2}O_{3}$＋$H_{2}SO_{4}$ → $Na_{2}SO_{4}$＋S＋$SO_{2}$＋$H_{2}$O
  - label: C
    content: $3ClO^{－}$ → $ClO_{3}^{－}$＋$2Cl^{－}$
  - label: D
    content: $P_{4}$＋$3OH^{－}$＋$3H_{2}$O → $3H_{2}PO_{2}^{－}$＋$PH_{3}$
  - label: E
    content: 2CuCl → Cu＋$CuCl_{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) H還原、O氧化，氧化與還原不是發生在同一個元素上，不為自身氧化還原反應；(B) S平均氧化數：＋2 → ＋4、0，為自身氧化還原反應；(C) Cl氧化數：＋1 → ＋5、－1，為自身氧化還原反應；(D) P氧化數：0 → ＋1、－3，為自身氧化還原反應；(E) Cu氧化數：＋1 → 0、＋2，為自身氧化還原反應。故選(A)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 在一定條件下，$RO_{2}^{n－}$和$I^{－}$發生反應的離子反應式如下：（只平衡一部分係數） $2RO_{2}^{n－}$＋$2I^{－}$＋$xH^{＋}$ → $I_{2}$＋2RO＋$yH_{2}$O（假設R為某一未知元素，n、x、y為正整數），試間在$RO_{2}^{n－}$中，R的氧化數及n的數值分為多少？
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  - label: E
    content: (E)
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3/s1_11_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 752.15
      - 469.8
      - 817.35
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 因$I^{－}$被氧化成$I_{2}$，則$RO_{2}^{n－}$為氧化劑，本身被還原。因產物RO中R氧化數＝＋2，故反應物中R的氧化數必須大於＋2，則為＋3。考量O的氧化數＝－2，則n＝1。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 有關過錳酸鉀在酸性條件下滴定鐵（II）離子的反應，下列敘述何者正確？
  options:
  - label: A
    content: 加人澱粉為指示劑
  - label: B
    content: 必須加熱才會反應
  - label: C
    content: 過錳酸鉀溶液即使放置很久滴定，結果也不會改變
  - label: D
    content: 滴定達終點時，溶液呈現淡紫紅色
  - label: E
    content: 反應後的產物為$MnO_{2}$及$Fe_{2}O_{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)過錳酸鉀本身就有顏色變化，不須另外添加指示劑；(B)常溫下即可反應，要加熱的是滴定草酸根的反應；(C)過錳酸鉀照光後會分解成二氧化錳與氧氣，故不可久置；(E)為$Mn^{2＋}$、$Fe^{3＋}$。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: $Cr^{3＋}$在酸性溶液中穩定，不易被氧化，但在鹼性溶液中，$Cr^{3＋}$有較強的還原性，易被氧化成$CrO_{4}^{2－}$離子。今有一漂白水含$ClO^{－}$，放入Cr(OH)$_{3}$固體後產生反應：a $ClO^{－}$＋b Cr(OH)$_{3}$＋c甲 → d $Cl^{－}$＋e $CrO_{4}^{2－}$＋f 乙（未平衡）， 其中a～f為最簡整數比時的係數，而甲、乙為平衡時所需加入的粒子，下列敘述何者正確？
  options:
  - label: A
    content: 甲為$H_{2}$O
  - label: B
    content: 乙為$H^{＋}$
  - label: C
    content: a＋b＋c＝d＋e＋f
  - label: D
    content: c＝f
  - label: E
    content: 係數總和＝19
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: Cl氧化數：＋1 → －1，Cr氧化數：＋3 → ＋6，故此兩物質係數比＝3：2，可先得：$3ClO^{－}$＋2Cr(OH)$_{3}$ → $3Cl^{－}$＋$2CrO_{4}^{2－}$。再補上$OH^{－}$以平衡電荷、補上$H_{2}$O以平衡原子數，可得$3ClO^{－}$＋2Cr(OH)$_{3}$＋$4OH^{－}$ → $3Cl^{－}$＋$2CrO_{4}^{2－}$＋$5H_{2}$O。故選(E)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s1e3_s1_15
  section: 1
  number: 15
  type: single
