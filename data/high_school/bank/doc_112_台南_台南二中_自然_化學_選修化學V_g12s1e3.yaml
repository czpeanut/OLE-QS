  stem: 先將含$Fe^{2＋}$莫耳數相等的兩酸性溶液分別裝人兩個錐形瓶中，再分別以0.2 M的$KMnO_{4}$及0.1 M的$K_{2}Cr_{2}O_{7}$溶液滴定，達當量點時0.2 M的$KMnO_{4}$溶液滴定時用去的體積為X毫升，0.1 M的$K_{2}Cr_{2}O_{7}$溶液滴定時用去的體積為Y毫升，則X與Y的比值（$\frac{X}{Y}$）為何？
