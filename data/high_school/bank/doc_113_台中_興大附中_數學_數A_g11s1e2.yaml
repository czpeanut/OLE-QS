  stem: 指數方程式$2^{10^{x}}= 10^{9}$的解 x 最接近下列哪一個選項？
  options:
  - label: A
    content: '1.2'
  - label: B
    content: '1.3'
  - label: C
    content: '1.4'
  - label: D
    content: '1.5'
  - label: E
    content: '1.6'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$2^{10^{x}}$＝$10^{\log 2^{10^{x}}}$＝$10^{10^{x}\log 2}$＝$10^{9}$

    $\Rightarrow10^{x}$＝$\frac{9}{\log 2}\approx\frac{9}{0.3010}\approx$29.9

    又 29.9$\approx$30＝3×10＝$10^{log3}$×10＝$10^{log3＋1}$

    $\approx10^{0.4771＋1}$＝$10^{1.4771}$

    $\Rightarrow10^{x}\approx10^{1.4771}\Rightarrow$x$\approx$1.4771

    故選(D)'
