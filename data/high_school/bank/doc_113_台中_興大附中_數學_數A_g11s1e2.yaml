  stem: 幸福公司為增進業務的發展，制定了一個激勵銷售人員的獎勵模型：y＝a $log_{4}$（x－1）＋b，x 表銷售金額（萬元），y 表獎勵金額（萬元），a，b 為常數。已知銷售金額為 17 萬元時，獎勵為 1 萬元；銷售金額為 33 萬元時，獎勵為 5 萬元。根據上述資料可得數對 （a，b）＝＿＿＿＿。
  answer:
  - （8，－15）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}1 =a\log _{4} (17 - 1)+b \\ 5 =a\log _{4} (33 - 1)+b\end{cases}$

    $\Rightarrow\begin{cases}1 =a\log _{4}4^{2} +b \\ 5 =a\times \frac{5\log 2}{2\log 2}+b\end{cases}$

    $\Rightarrow\begin{cases}1 = 2a +b \cdots \cdots \cdots \cdots \cdots ① \\ 5 =\frac{5}{2}a +b\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由②－①得$\frac{1}{2}a = 4$

    $\Rightarrow$a＝8$\Rightarrow$b＝－15

    故數對（a，b）＝（8，－15）'
