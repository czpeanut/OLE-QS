  stem: 若－1$\leq$x$\leq$2，$f (x)= \left( \frac{1}{3} \right) ^{x^{2} - 2x + 1}$的最大值為 m，最小值為 n，則 m－n＝＿＿＿＿。
  answer:
  - $\frac{80}{81}$ 5.11 6.48 7.1000 8.$7 + 5\sqrt{2}$ 9.116 10.14
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$\left( \frac{1}{3} \right) ^{x^{2} - 2x + 1}$＝$\left( \frac{1}{3} \right) ^{(x - 1)^{2}}$

    ∴x＝1 時，f（x）有最大值$\left( \frac{1}{3} \right) ^{0}$＝1＝m

    x＝－1 時，f（x）有最小值$\left( \frac{1}{3} \right) ^{(- 2)^{2}}$＝$\frac{1}{81}$＝n

    故 m－n＝$1 -\frac{1}{81}$＝$\frac{80}{81}$

    $5.10^{n－1}$＞$8^{n}$

    $\Rightarrowlog10^{n－1}$＞$log8^{n}\Rightarrow$n－1＞n log8

    $\Rightarrow$n－1＞n（3 log2）$\Rightarrow$n（1－3 log2）＞1

    $\Rightarrow$n＞$\frac{1}{1 - 3\log 2}\approx\frac{1}{1 - 3\times 0.3010}$＝$\frac{1}{0.097}$＝10.3 …

    故 n 至少為 11

    6.a＝$3^{（－1）＋（－3）＋（－5）＋……＋（－19）}$

    ＝$3^{\frac{〔(- 1)+(- 19)〕 \times 10}{2}}$＝$3^{－100}$

    ＝（$10^{log3}$）$^{－100}\approx10^{－100×0.4771}$

    ＝$10^{－47.71}$＝$10^{－48＋0.29}$

    ＝$10^{0.29}$×$10^{－48}$

    故 a 在小數點後第 48 位開始出現不為 0 的數字

    7.設交談強度 $I_{1}$，音響強度 $I_{2}$

    $\begin{cases}60 = 10\log \frac{I_{1}}{10^{- 12}} \\ 90 = 10\log \frac{I_{2}}{10^{- 12}}\end{cases}$

    $\Rightarrow\begin{cases}10^{6} =\frac{I_{1}}{10^{- 12}} \\ 10^{9} =\frac{I_{2}}{10^{- 12}}\end{cases}\Rightarrow\begin{cases}I_{1} = 10^{- 6} \\ I_{2} = 10^{- 3}\end{cases}$

    ∴$\frac{I_{2}}{I_{1}}$＝$\frac{10^{- 3}}{10^{- 6}}$＝$10^{3}$＝1000

    故 1000 人一起日常交談的音量，可以和演唱會音響一樣大聲

    8.$log_{10}$x＝$\frac{3\log x}{3\log 10}$＝$log_{1000}x^{3}$＝$log_{1000}$（x＋2y）

    $log_{100}$y＝$\frac{\log y}{2\log 10}$＝$\frac{\frac{3}{2}\log y}{3\log 10}$＝$\log _{1000}y^{\frac{3}{2}}$＝$log_{1000}$（x＋2y）

    $\Rightarrowx^{3}$＝$y^{\frac{3}{2}}$＝x＋2y

    由$x^{3} = y^{\frac{3}{2}}\Rightarrowx = y^{\frac{1}{2}}$

    代入$y^{\frac{3}{2}} = x + 2y\Rightarrowy^{\frac{3}{2}} = y^{\frac{1}{2}} + 2y$

    設$y^{\frac{1}{2}} =a$

    $\Rightarrowa^{3}$＝a＋$2a^{2}$

    $\Rightarrowa^{3}$－$2a^{2}$－a＝0

    $\Rightarrow$a（$a^{2}$－2a－1）＝0

    $\Rightarrow$a＝0 或$\frac{2\pm \sqrt{8}}{2}$，又$a = y^{\frac{1}{2}}$＞0

    ∴a＝$1 + \sqrt{2}$＝$y^{\frac{1}{2}}\Rightarrow$y＝$(1 + \sqrt{2})^{2}$＝$3 + 2\sqrt{2}$

    x＝$y^{\frac{1}{2}}$＝$1 + \sqrt{2}$

    故 x＋2y＝$(1 + \sqrt{2})+ 2 (3 + 2\sqrt{2})$＝$7 + 5\sqrt{2}$

    9.1×（1＋2 ％）$^{60}$＋1×（1＋2 ％）$^{59}$＋……＋1×（1＋2 ％）$^{1}$

    ＝$\frac{(1 + 2 ％)〔(1 + 2 ％)^{60} - 1〕}{(1 + 2 ％)- 1}\approx\frac{1.02 (3.2810 - 1)}{0.02}$

    ＝116.331$\approx$116

    故 5 年後本利和為 116 萬元

    10.已知$\begin{cases}31 <\log a^{50} < 32 \\ - 36 <\log \left( \frac{1}{b} \right) ^{50}<- 35\end{cases}$

    $\Rightarrow\begin{cases}31 < 50\log a < 32 \\ - 36 < 50\log \frac{1}{b}<- 35\end{cases}$

