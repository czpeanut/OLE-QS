  stem: 下列哪一個數值最大？
  options:
  - label: A
    content: $3^{－2}$
  - label: B
    content: $\left( \frac{1}{3} \right) ^{- \sqrt{5}}$
  - label: C
    content: $\left( \frac{1}{3} \right) ^{- 2}$
  - label: D
    content: $(\sqrt{3})^{3}$
  - label: E
    content: $(\sqrt{3})^{- \sqrt{2}}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left( \frac{1}{3} \right) ^{- \sqrt{5}}$＝$(3^{- 1})^{- \sqrt{5}}$＝$3^{\sqrt{5}}$

    $\left( \frac{1}{3} \right) ^{- 2}$＝（$3^{－1}$）$^{－2}$＝$3^{2}$

    $(\sqrt{3})^{3}$＝$(3^{\frac{1}{2}})^{3}$＝$3^{\frac{3}{2}}$

    $(\sqrt{3})^{- \sqrt{2}}$＝$(3^{\frac{1}{2}})^{- \sqrt{2}}$＝$3^{-\frac{\sqrt{2}}{2}}$

    ∵$\sqrt{5}$＞2＞$\frac{3}{2}$＞$-\frac{\sqrt{2}}{2}$＞－2，且底數 3＞1

    ∴$3^{\sqrt{5}}$＞$3^{2}$＞$3^{\frac{3}{2}}$＞$3^{-\frac{\sqrt{2}}{2}}$＞$3^{－2}$

    故選(B)'
