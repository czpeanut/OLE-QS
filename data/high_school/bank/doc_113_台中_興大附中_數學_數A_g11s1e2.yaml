    $\log _{\frac{1}{2}} (x - 1)$＞$\log _{\frac{1}{4}} (3 - x)\Rightarrow\log _{\frac{1}{4}} (x - 1)^{2}$＞$\log _{\frac{1}{4}} (3 - x)$

