- id: doc_108_嘉義_嘉義高中_數學_g10s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 1
  stem: 數線上，有 $A(a)$、$B(b)$、$C(c)$、$D(d)$、$E(e)$ 相異五點滿足 $c = \frac{2a+3b}{5}$，$d = \frac{4a-b}{3}$，$e = \frac{a+b}{2}$，試選出正確的選項。
  options:
  - label: A
    content: $\overline{AC}$：$\overline{BC}$＝2：3
  - label: B
    content: c＞e
  - label: C
    content: A點在C點與D點之間
  - label: D
    content: A到B的距離是A到D的距離的3倍
  - label: E
    content: 若 | c |＝$\frac{2|a|+3|b|}{5}$，則a×b×c＞0
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: MA-1-1-1
      book: 數學1（必修）
      chapter: 數與式
      title: 實數
      std: true
    textbook: 數學1（必修） 實數
    pattern:
      key: MA-1-1-1:T04
      name: 分點公式與數線區間
    labeled_by: agent
    label_confidence: high
    label_note: 題幹含亂碼且分點公式等式漏失
    fixed_by: agent
    fix_note: （人工修正：補齊分點公式條件並修正相異四點筆誤為五點，補齊解析）
  difficulty: 3
  explanation: 由分點公式知 $C$ 在 $\overline{AB}$ 上且 $\overline{AC}:\overline{BC}=3:2$，(A) 錯；因未定 $a, b$ 大小，(B) 未必成立；$d - a = \frac{a-b}{3}$ 而 $c - a = \frac{3(b-a)}{5}$，兩者異號故 $A$ 在 $C, D$ 之間，(C) 正確；$|d-a| = \frac{1}{3}|b-a|$ 即 $\overline{AB} = 3\overline{AD}$，(D) 正確；若 $a, b$ 皆為負數則 $|c|=\frac{2|a|+3|b|}{5}$ 仍成立但 $abc < 0$，(E) 錯。
