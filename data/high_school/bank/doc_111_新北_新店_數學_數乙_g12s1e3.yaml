- id: doc_111_新北_新店_數學_數乙_g12s1e3_s3_1
  section: 3
  number: 1
  type: fill
  page: 1
  stem: '設函數f (x) 是定義在 [ 0 , 1 ] 上的遞增連續函數，且 f (0)＝0 , f (1)＝1。經濟學家將這類函數的圖形統稱為<u>羅倫茲</u>曲線，並常使用它們來測度「所得分配不均」的程度。例如f (0.2)＝0.05表示20% 最低所得者的總所得占全部總所得的5%。 除此之外，與<u>羅倫茲</u>曲線相關的<u>吉尼</u>係數（Gini coefficient）也可以用來測度所得分配不均程度，其定義如下：

    <u>吉尼</u>係數＝2× ( R的面積 )，

    其中R代表右圖中被<u>羅倫茲</u>曲線y＝f (x) 割出的鋪色區域。<u>吉尼</u>係數愈大表示所得分配不平均；反之，係數愈小則分配平均。 已知某一國家的所得分配符合<u>羅倫茲</u>曲線y＝$\frac{15}{16}x^{2}+\frac{1}{16}x$，回答下列問題： 1. 使用<u>羅倫茲</u>曲線，求這國家40% 最低所得者的總所得占全部總所得的百分比為＿＿＿＿%。 2. 求鋪色區域R的面積為＿＿＿＿。 3. 求此國家的<u>吉尼</u>係數為＿＿＿＿。'
