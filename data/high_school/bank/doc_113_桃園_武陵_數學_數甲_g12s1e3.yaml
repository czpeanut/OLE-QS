  stem: 'C. 已知拋物線Γ：y＝$x^{2}$與直線L：y＝x＋2，由L與Γ所圍區域繞x軸旋轉一周所得之旋轉體的體積為$\frac{ ⑧⑨ }{ ⑩ }$π。（化成最簡分數）

    D. 農場高中儲水塔漏水，小武校長想了解平均每小時的漏水量，早上開始以速度函數v (t)＝－$t^{2}$＋t＋5（公升／小時）補水。已知經過2小時後，水塔裡的水量剛好不增不減（期間水並無向外溢流或見底現象）。請幫忙校長計算，平均每小時的漏水量為$\frac{ ⑪⑫ }{ ⑬ }$（公升／小時）。（化成最簡分數）

    E. 設a為實數，f (x)滿足$\int_{a}^{x} f(t) = dt = (x^{2} - 3x + 5)^{\frac{3}{2}} - 8$，所有可能的a之總和＝A，試求數對( f (3) , A )＝$\frac{ ⑭\sqrt{ ⑮ } }{ ⑯ } , ⑰$。'
