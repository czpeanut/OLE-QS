      - 320.3
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)觀察圖形可知，$\left| \int_{a}^{b} f''(x) dx \right| < \left| \int_{b}^{c} f''(x) dx \right|$且$\int_{a}^{b} f''(x)dx < 0 < \int_{b}^{c} f''(x)dx$ ∴ $\int_{a}^{c} f''(x)dx = \int_{a}^{b} f''(x)dx + \int_{b}^{c} f''(x)dx > 0$

    (B) ∵f ''(x)是f ''''(x)的反導函數 ∴$\int_{a}^{c} f''''(x) dx$＝f ''(c)－f ''(a)＝0－0＝0

    (C)觀察圖形可知，f ''(x)在x＝a處的切線斜率為0 ⇒ f ''''(a)＝0 f ''(x)在x＝c處的切線斜率為負 ⇒ f ''''(c)＜0 ∴ $\int_{a}^{c} f''''''(x) + dx$＝f ''''(c)－f ''''(a)＜0

    (D)∵ f ''(x)在x＝s附近的值均為負 ∴ f (x)在x＝s附近遞減 故f (x)在x＝s處沒有極值

    (E)∵ f ''(b)＝0且x∈ ( a , b )時，f ''(x)＜0 ⇒ f(x)在[a,b]遞減 x∈ ( b , c )時，f ''(x)＞0 ⇒ f (x)在[ b , c ]遞增 ∴ f (x)在x＝b有極小值

    故選(A)(E)。'
