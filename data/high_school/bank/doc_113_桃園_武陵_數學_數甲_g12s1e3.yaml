  difficulty: 4
  explanation: 'H. (1) $A(2, t)$ 在切線 $y=2x$ 上，故 $t=4$。因三次函數對稱於反曲點 $(2,4)$，故 $\int_{-1}^5 f(x)\,dx = 6 \times 4 = 24$。(2) 可設 $f(x) = a(x-2)^3 + 2(x-2) + 4$，與 $y=4$ 交於 $x=2$ 及 $(x-2)^2 = -\frac{2}{a}$（故 $a<0$）。面積為 $2\int_0^{\sqrt{-2/a}} (au^3+2u)\,du = -\frac{2}{a} = 6 \Rightarrow a = -\frac{1}{3}$。

    I. $f(x)$ 在 $[0, 11]$ 上嚴格遞減且凹口向上。由遞減性得 $S(2) > S(4) > S(1) > S(5)$；由梯形法與凹口向上得 $S(2) > S(3) > S(4)$，故 $S(5) < S(1) < S(4) < S(3) < S(2)$。

    J. $V(t) = \pi\int_0^t [(5+\sqrt{9-x^2})^2 - (5-\sqrt{9-x^2})^2]\,dx = \pi\int_0^t 20\sqrt{9-x^2}\,dx$，故 $V''(1) = 20\pi\sqrt{9-1} = 40\sqrt{2}\pi$。'
  answer_status: ai_generated
  answer_source: agent
  answer:
  - H. (1) $(4, 24)$ (2) $-\frac{1}{3}$；I. $S(5) < S(1) < S(4) < S(3) < S(2)$；J. $40\sqrt{2}\pi$
