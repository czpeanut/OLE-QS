- id: doc_113_桃園_武陵_數學_數甲_g12s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 設多項式函數y＝f '(x)的圖形如右圖，與x軸的交點為( a , 0 )、( b , 0 )與( c , 0 )， 試問下列哪些選項是正確的？
  options:
  - label: A
    content: $\int_{a}^{c} f'(x)dx > 0$
  - label: B
    content: $\int_{a}^{c} f''(x)dx < 0$
  - label: C
    content: $\int_{a}^{c} f'''(x)dx > 0$
  - label: D
    content: f (x)在x＝s有極小值
  - label: E
    content: f (x)在x＝b有極小值
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_113_桃園_武陵_數學_數甲_g12s1e3/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 516.5
      - 199.3
