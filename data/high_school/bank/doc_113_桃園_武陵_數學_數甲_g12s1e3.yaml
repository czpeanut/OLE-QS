  page: 1
  stem: 'C. 已知拋物線 $\Gamma: y = x^2$ 與直線 $L: y = x+2$，由 $L$ 與 $\Gamma$ 所圍區域繞 $x$ 軸旋轉一周所得之旋轉體體積為＿＿＿＿。（化成最簡分數乘以 $\pi$）

    D. 農場高中儲水塔漏水，小武校長想了解平均每小時的漏水量，早上開始以速度函數 $v(t) = -t^2 + t + 5$（公升／小時）補水。已知經過 2 小時後，水塔裡的水量剛好不增不減（期間水並無向外溢流或見底現象）。請幫忙校長計算，平均每小時的漏水量為＿＿＿＿（公升／小時）。（化成最簡分數）

    E. 設 $a$ 為實數，$f(x)$ 滿足 $\int_a^x f(t)\,dt = (x^2 - 3x + 5)^{\frac{3}{2}} - 8$，所有可能的 $a$ 之總和 $= A$，試求數對 $(f(3), A) =$＿＿＿＿。'
  tags:
