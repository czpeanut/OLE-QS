    label_note: 本題包含 C、D、E 三小題（旋轉體體積、積分淨變化量、微積分基本定理微分），原卷切題時併為同一題。
    fixed_by: agent
    fix_note: （人工修正：修正 E 小題積分式誤植的等號與空格編號，補齊各小題答案與解析）
  difficulty: 4
  explanation: 'C. 聯立 $x^2 = x+2$ 得交點 $x=-1, 2$。體積 $V = \pi\int_{-1}^2 [(x+2)^2 - x^4]\,dx = \pi\left[\frac{x^3}{3}+2x^2+4x-\frac{x^5}{5}\right]_{-1}^2 = \frac{72}{5}\pi$。

    D. 2 小時總補水量 $= \int_0^2 (-t^2+t+5)\,dt = \left[-\frac{t^3}{3}+\frac{t^2}{2}+5t\right]_0^2 = \frac{28}{3}$ 公升，平均每小時漏水量為 $\frac{28/3}{2} = \frac{14}{3}$ 公升／小時。

    E. 兩邊對 $x$ 微分得 $f(x) = \frac{3}{2}(x^2-3x+5)^{\frac{1}{2}}(2x-3)$，故 $f(3) = \frac{3}{2}\sqrt{5}(3) = \frac{9\sqrt{5}}{2}$。代 $x=a$ 得 $(a^2-3a+5)^{\frac{3}{2}} - 8 = 0 \Rightarrow a^2-3a+5 = 4 \Rightarrow a^2-3a+1=0$（判別式大於 0），故兩根和 $A = 3$。'
  answer_status: ai_generated
  answer_source: agent
  answer:
  - C. $\frac{72}{5}\pi$；D. $\frac{14}{3}$；E. $(\frac{9\sqrt{5}}{2}, 3)$
- id: doc_113_桃園_武陵_數學_數甲_g12s1e3_s4_1
  section: 4
  number: 1
  type: calc
  page: 2
  stem: 'H. 設實係數三次多項式函數 $\Gamma: y = f(x) = ax^3+bx^2+cx+d$，$A(2, t)$ 為其圖形的反曲點，且此圖形在 $A(2, t)$ 的切線為 $y=2x$。

    (1) 求數對 $(t, \int_{-1}^5 f(x)\,dx) =$＿＿＿＿。

    (2) 若 $\Gamma$ 的圖形與 $y=t$ 所圍的封閉區域面積為 6，求 $a =$＿＿＿＿。

    I. 已知 $f(x) = (x-20)^2 + 67$，$S(1) = \sum_{k=1}^{10} f(k)$，$S(2) = \sum_{k=0}^{9} f(k)$，$S(3) = \sum_{k=1}^{10} \frac{f(k-1)+f(k)}{2}$，$S(4) = \int_0^{10} f(x)\,dx$，$S(5) = \int_1^{11} f(x)\,dx$，試比較上列各數之大小：＿＿＿＿。

    J. $V(t)$ 表示 $x^2 + (y-5)^2 = 9$ 與 $y$ 軸及 $x=t$（其中 $0 < t < 3$）圍成的封閉區域繞 $x$ 軸旋轉的旋轉體體積，求 $V''(1) =$＿＿＿＿。（化為最簡根號）'
