  stem: 設y＝f (x)的圖形（正值函數）與x軸及x＝0，x＝2所圍成的區域為R，將閉區間[ 0 , 2 ]等分成n等分，並設R的面積之上和為$U_{n}$，下和為$L_{n}$，則下列何者一定正確？
