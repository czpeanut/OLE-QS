  stem: 法院認定台北市政府警察局應賠償原告，其理由與下列何種違反行政法原則之行為相同？
  options:
  - label: A
    content: 法律規定，酒後駕車處1.5萬至9萬元罰鍰，若裁罰10萬元顯不適宜
  - label: B
    content: 小型車駕駛人肇事逃逸，執法單位卻對情節輕微者一律處以有期徒刑
  - label: C
    content: 飲料旅行社領隊與海關稽查人員關係佳，違規攜帶肉品入境卻未處罰
  - label: D
    content: 法律已規定校園內禁止體罰，教師仍以打手心的方式督促學生學習
  group_stem: '太陽花學運群眾在行政院前靜坐遭暴力驅離案，2019年10月30日台北地方法院一審採信前立委周倪安、民眾周榮宗等10人，當時因員警執勤過當而受傷，求償有理，判台北巿警察局應賠新台幣111萬1570元。

    一審法院指出，警察人員執行職務違法使用警械致人受傷，適用國家賠償法，因故意或過失而不法侵害人民，負有國家賠償責任。

    判決理由指出，「行政院院區及週邊為集會遊行法所定的禁制區，在禁制區內的非法集會，警察攜帶警械至現場執行勤務並無不法，但在制止、命令解散，進而強制驅離時，應依現場實際情形，決定警械是否使用及如何使用。」、「為證明原告所受傷勢為警察執勤過當，就算沒有拍攝到被警察攻擊而受傷過程可以認定，仍可就原告提出證人或以診斷結果顯示受有過重傷勢、受傷部位是人體致命要害部位來證明，使法官得到心證。」

    內政部長徐國勇今天表示，事件發生在國民黨執政時期，但不管藍綠都會尊重司法判決，台北市警察局表示尊重司法判決，將待到判決書後研究提起上訴，執法決心不因個案而受影響。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
