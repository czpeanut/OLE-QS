  stem: 根據上文判斷，Google與歐盟小型新聞出版者所主張的權利各是屬於憲法上的哪些權利？
  options:
  - label: A
    content: 營業自由；財產權
  - label: B
    content: 言論自由；生存權
  - label: C
    content: 秘密通訊自由；財產權
  - label: D
    content: 隱私權；財產權
  group_stem: '歐盟各成員國在2019年4月時表決，最終以19贊成票對4反對票，通過歐盟區域最新數位版權系列法規，其中包含飽受爭議的第11與13條規定，將可能對Google、Facebook等科技公司帶來重大影響。

    法規第11條規定，當搜尋引擎與新聞整合平台刊登新聞文章連結時，得支付這些新聞出版者費用。換句話說，每當Google搜尋版面列出幾條新聞時，就得支付這些新聞網站費用，作為刊登費。Google認為這條新法規對整合平台與搜尋引擎來說，會因為成本考量，先列出不需支付連結張貼費的新聞，而把歐盟新聞出版者順序向後排，進而傷害歐盟新聞業者。但小型新聞出版者卻積極支持這條新法規，認為Google、Facebook目前貼出他們辛苦的工作成果，並透過版面上的廣告賺錢，但他們卻無法獲利。

    法規第13條則規定，大型科技公司得對網路上違反著作權的所有結果負責，只要平台上有違反著作權的影像或文字內容出現，他們就得支付後續罰款等，用戶不必受罰。

    各個歐盟會員國，有24個月的時間，把這系列新法規加入各國當地法律，法律細節將由各國自己調整。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
