  section: 1
  number: 13
  type: single
  page: 2
  stem: 繼先前爆出士林夜市水果一袋賣1089元，又爆出骰子牛2份600元的坑殺遊客事件，臺北市政府針對業者稽查後，對於未依規定設攤的商家，依照《道路交通管理處罰條例》開罰，對於棄置果皮汙染環境的攤商，則依《廢棄物清理法》開罰。但對於漫天喊價的狀況，市政府表示須尊重市場自由機制，目前無法可管。由於市政府增加稽查密度，已有水果攤結束營業。下列敘述何者正確？
  options:
  - label: A
    content: 已結束營業的水果攤可以提出行政救濟，要求國家賠償
  - label: B
    content: 假如政府對違法攤商均依法處以最高額罰鍰，為適法裁量
  - label: C
    content: 基於依法行政，對於攤商漫天喊價，政府無法以行政命令開罰
  - label: D
    content: 已經歇業的水果攤可主張信賴保護原則，向政府要求補償
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 高雄市區監理所近年改採「簡訊通知服務」措施，發送服務性的通知，以提升各項監理通知的「即時性」與送達率。如車籍設在高雄市的民眾，若有交通違規罰單到期的情形，就會發送簡訊提醒民眾即時辦理，不用再擔心罰單逾期而增加額外罰鍰。請問：上述依循的正當行政程序與何者最為相似？
  options:
  - label: A
    content: 捷運局辦理輕軌第二階段公聽會以蒐集沿線民眾的意見
  - label: B
