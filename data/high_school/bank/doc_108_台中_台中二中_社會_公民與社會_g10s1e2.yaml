  - label: C
    content: 環保局考量廠商違規事實及廠商答辯意見後再予以裁罰
  - label: D
    content: 建管局準備駁回建築執照申請前決定給建商說明的機會
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
