- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_37
  section: 1
  number: 37
  type: calc
  page: 7
  stem: '就讀Ｃ大化妝品應用學系的凱文，在準備化妝品廣告的作業報告時，找到一相關法律資料為司法院大法官釋字第744號解釋，宣告《化妝品衛生管理條例》第24條第2項及第30條第1項違憲。請參考下表內容，回答以下問題：(此題為非選題共9分，請在答案卷上作答)

    請問，(1)該化妝品廠商主張該條例違反憲法保障的何種人權？(2分)

    (2)大法官宣告其違憲之法律原則為何？請寫出原則，再說明理由。(7分，字數限制為30~60字)

    | 解釋字號 釋字第744號【化粧品廣告事前審查案】 |

    | --- |

    | 解釋爭點 化粧品衛生管理條例第24條第2項及第30條第1項就違反同條例第24條第2項為處罰之部分，是否違憲？ |

    | 解釋文 化粧品衛生管理條例第24條第2項規定：「化粧品之廠商登載或宣播廣告時，應於事前……申請中央或直轄市衛生主管機關核准……。」同條例第30條第1項規定：「違反第24條……第2項規定者，處新臺幣5萬元以下罰鍰……。」係就化粧品廣告所為之事前審查，限制化粧品廠商之之               ，             ，                           ，                               ，應自本解釋公布之日起失其效力。 |

    | 理由書 依現行法規定，化粧品可分為含藥及一般化粧品兩大類，就算化妝品有含藥成分，例如防曬、染髮、燙髮、止汗制臭、美白等產品的廣告一樣不能事前審查。大法官認為，含藥化妝品對民眾健康的影響雖較一般化妝品為高，但相關廣告對民眾的健康不會造成直接威脅，如果產品違法，只要透過事後懲罰和禁止輸入、製造和抽驗等取締措施，就能達到保護人民健康之公共利益目的。 |

    | 事實摘要 聲請人化妝品大廠DHC台灣公司於99年間，在奇摩購物中心網站刊登「DHC全效淨白防曬乳」化粧品廣告，內容載有：「……能在肌膚表面形成保護膜，預防陽光害肌膚……能淡化暗沉膚色……。質地清爽不黏膩，也不易產生脫粧的情形，不會在肌膚上造成白色殘留，……」等詞句，臺北市政府衛生局以聲請人未經申請核准登載廣告，違反化粧品衛生管理條例第24條第2 項規定，依同條例第30條第1項規定，裁處聲請人罰鍰3 萬元。聲請人認為確定判決所適用的下列化粧品衛生管理條例及其施行細則規定，有違憲疑義，聲請解釋。 |

    ~ ~ 辛苦了!! 記得再檢查一遍喔!! ~~ =^.^=

    <u>答案公佈表</u>

    臺中市立臺中第二高級中等學校'
