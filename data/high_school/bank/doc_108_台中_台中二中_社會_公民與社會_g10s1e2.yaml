  stem: 聯合國人權理事會共有47席，2018年10月改選其中18席，任期自2019～2022年。由於只有18國參選，結果近年來人權狀況備受爭議的菲律賓、喀麥隆、巴林、索馬利亞、孟加拉和厄利垂亞等國，全部順利當選。試問此次改選結果可能造成人權理事會何種功能被質疑？
  options:
  - label: A
    content: 協調與整合聯合國各機關人權工作的成效
  - label: B
    content: 監督並要求侵犯人權之國家改善的公信力
  - label: C
    content: 針對各項人權公約設立專責機構的可能性
  - label: D
    content: 定期審議各締約國的人權報告及個人申訴
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 2019年，蘇丹傳出軍事政變，軍方占領電視台，同時包圍總統府，已執政30年的蘇丹總統巴席爾遭軍方逮捕，並宣布辭去總統職務。回顧巴席爾執政生涯，其於1989年發動軍事政變，推翻原先的民選總統，獨裁統治至今。2009年，巴席爾遭國際刑事法院發出逮捕令，其罪行包括種族滅絕、戰爭罪行、侵犯人權等。蘇丹為聯合國會員國，亦有簽署國際人權公約，聯合國呼籲蘇丹新執政當局配合國際刑事法院的逮捕令引渡巴席爾受審，但遭蘇丹新執政當局拒絕。請問下列敘述何者正確？
  options:
  - label: A
    content: 為遏止巴席爾獨裁及各種違反人權之罪行，聯合國可以將其強制解職
  - label: B
    content: 獨裁政府本身有侵害人權的疑慮，軍方政變推翻獨裁統治，即不用再受到聯合國監督
  - label: C
    content: 蘇丹為聯合國會員國且簽署國際人權公約，故須受到聯合國監督，並配合改進
  - label: D
    content: 巴席爾辭職後不再具元首身分，聯合國可直接將其逮捕至國際刑事法院受審
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 美國的《獨立宣言》列舉英國喬治三世侵害殖民地人民權利的例證，像是「和平時期未經我們的立法機關同意就維持常備軍隊」、「未經人民同意就強行徵稅」、「中止我們的立法機關行使權力，宣稱自己有權就一切事宜替我們制定法律」。由上述例證可看出英國招致反抗的原因最可能是下列何者？
  options:
  - label: A
    content: 殖民地人民並沒有受到同等的對待
  - label: B
    content: 行使統治權力未依循法律保留原則
  - label: C
    content: 限制人權並未採取侵害最小的手段
  - label: D
    content: 未給予殖民地人民合理的差別待遇
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「制度性基本權」為憲法學理的一種分類，我國《憲法》第16、17條列舉的權利可以稱之，而該項權利需要國家提供一套制度後才可能行使。請問下列何項法律便是在落實制度性基本權？
  options:
  - label: A
    content: 制定「國家語言發展法」，促進國家語言之傳承、復振及發展
  - label: B
    content: 制定「行政訴訟法」，確保當人民權利遭行政機關侵害時，能提起救濟
  - label: C
    content: 制定「就業保險法」，確保勞工失業一定期間之基本生活條件
  - label: D
    content: 制定「個人資料保護法」，避免個人資料被濫用，侵害人格權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 首位原住民行政院發言人谷辣斯˙尤達卡表示，使用羅馬拼音Kolas Yotak(阿美語)才能清楚發音並完整表達她的名字，過去用漢字很難完整發音，自己使用拼音有10年以上，雖然生活中產生不少困擾，但希望大家能適應、習慣她的名字。Kolas Yotaka期待得到尊重及保障的權利所依據的憲法條款與下列何者相同？
  options:
  - label: A
    content: 穆斯林希望能配戴或穿著伊斯蘭教服飾表達其對信仰的虔敬
  - label: B
    content: 海外國民主張，對國家有異議者不應被列入拒絕返國黑名單
  - label: C
    content: 失業的民眾走上街頭，要求政府提出政策保障人民充分就業
  - label: D
    content: 藝人呼籲媒體勿報導涉及個人私密情感的社群軟體對話紀錄
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 國家在干涉人民的基本權利不可以超過必要程度，稱為比例原則，其內涵尚有三個子原則。關於比例原則的相關敘述，下列何者正確？
  options:
  - label: A
    content: 桃園國際機場加強手提行李檢查，防範非洲豬瘟入侵，符合適當性
  - label: B
    content: 戶政機關要求領身分證按指紋，符合必要性
  - label: C
    content: 香港警察用布袋彈驅逐抗議人民，符合衡量性
  - label: D
    content: 疾病管制局要求確認為A型流感者應自主健康管理，不符合必要性
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 小麥最近到麥當勞、肯德基、星巴克買可樂或咖啡喝時，發現共同點就是沒有吸管了!!原來這與環保署的限用一次性塑膠吸管政策有關，自2019年7月起，包含公部門、公私立學校、百貨公司及購物中心、連鎖速食店等4大類共8000家業者，不得提供內用者一次性塑膠吸管，若違反規定，可依《廢棄物清理法》處以罰鍰，而初期推動階段，將針對首次違規者予以勸導，不處罰鍰。下列敘述何者正確？
  options:
  - label: A
    content: 政府禁用一次性塑膠吸管的措施，限制業者的營業自由，手段不符合比例原則
  - label: B
    content: 政府禁用一次性塑膠吸管的措施，限制了業者的營業自由，其目的在於避免緊急危難
  - label: C
    content: 禁用一次性塑膠吸管以維護環境，欲保障的權利是憲法上的列舉基本權
  - label: D
    content: 業者於政策施行後違規遭到罰鍰，有提出行政救濟的權利，是憲法保障的列舉基本權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 司法院釋字第748號內容提及現行《民法》親屬編的婚姻規定，未使相同性別二人，得為經營共同生活之目的，成立具有親密性及排他性之永久結合關係，於此範圍內，與《憲法》第22條保障人民婚姻自由及第7條保障人民平等權之意旨有違。上述釋憲內容所涉及的基本權利分析，何者最為正確？
  options:
  - label: A
    content: 保障同志婚姻將違反憲法保障的婚姻自由與平等權
  - label: B
    content: 藉由合理的差別待遇保障同志婚姻才能落實平等權
  - label: C
    content: 民法的婚姻規定使得同性戀者承受不合理的差別對待
  - label: D
    content: 民法的婚姻規定保障所有人民的婚姻自由
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 承上題，關於我國釋憲制度，下列敘述何者正確？
  options:
  - label: A
    content: 大法官除有釋憲權外，也可以召開憲法法庭進行法條上的修正
  - label: B
    content: 我國釋憲制度僅對個案有效，於其他案件仍以民法一夫一妻制為主
  - label: C
    content: 當大法官作出違憲宣告，該法條按慣例立即失效
  - label: D
    content: 此號解釋可能是由人民窮盡訴訟途徑後，權利仍受侵害，才能聲請大法官解釋
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 為了要使大法官釋憲程序更透明、憲法審查制度更趨司法化的「司法院大法官審理案件法」修正案，於2018年年底在立法院三讀通過，並更名為「憲法訴訟法」，2019年1月4日總統公布，公布後3年施行。下列四個選項為此次修法的主要變革，請問哪一個變革最能呼應「大法官審理案件全面司法化、裁判化及法庭化」的目標？
  options:
  - label: A
    content: 公布每位大法官所持立場，以達過程公開透明
  - label: B
    content: 以憲法法庭之裁判取代現行的大法官會議解釋
  - label: C
    content: 憲法審查的範圍擴及法院確定終局裁判之具體個案
  - label: D
    content: 立委聲請釋憲門檻從現行立委總額的1/3降低為1/4
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
