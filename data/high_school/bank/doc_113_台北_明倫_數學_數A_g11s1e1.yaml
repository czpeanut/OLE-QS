- id: doc_113_台北_明倫_數學_數A_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 令 a＝sin（π$^{2}$），試問下列哪一個選項是對的？
  options:
  - label: A
    content: a＝－1
  - label: B
    content: －1＜a＜$-\frac{1}{2}$
  - label: C
    content: $-\frac{1}{2}$＜a＜0
  - label: D
    content: 0＜a＜$\frac{1}{2}$
  - label: E
    content: $\frac{1}{2}$＜a＜1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'π$^{2}\approx$3.14π＝3π＋0.14π

    ∵0.14π＝0.14×180°＝25.2°

    ∴可知 π$^{2}\approx$3×180°＋25.2°，與 205.2°為同界角

    $\Rightarrow$180°＜π$^{2}$＜210°

    $\Rightarrow-\frac{1}{2}$＜sin（π$^{2}$）＜0

    $\Rightarrow-\frac{1}{2}$＜a＜0

    故選(C)'
- id: doc_113_台北_明倫_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些函數的圖形，可由 y＝sinx 的圖形經左右或上下平移而得？
  options:
  - label: A
    content: y＝sin2x
  - label: B
    content: y＝cosx
  - label: C
    content: y＝sinx－2
  - label: D
    content: y＝cosx＋3
  - label: E
    content: y＝－sinx
  answer:
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：y＝sin2x 的週期為 π，與 y＝sinx 的週期為 2π不同，無法平移得到

    (B)○：y＝sinx $\xrightarrow{向左平移 \frac{\pi}{2} 單位}$ y＝$\sin \left( x +\frac{\pi}{2} \right)$＝cosx

    (C)○：y＝sinx $\xrightarrow{向下平移 2 單位}$ y＝sinx－2

    (D)○：y＝sinx $\xrightarrow{向左平移 \frac{\pi}{2} 單位}$ y＝cosx $\xrightarrow{向上平移 3 單位}$ y＝cosx＋3

    (E)○：y＝sinx $\xrightarrow{向左平移 \pi 單位}$ y＝sin（x＋π）＝－sinx

    故選(B)(C)(D)(E)'
- id: doc_113_台北_明倫_數學_數A_g11s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 下列哪些敘述是正確的？
  options:
  - label: A
    content: 1 弳＝57°
  - label: B
    content: sin2＞sin1＞sin3
  - label: C
    content: 坐標平面上，30 弳的最小正同界角是 4.88 弳
  - label: D
    content: sin30＝$\frac{1}{2}$
  - label: E
    content: cosπ＜cosπ°
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：1 弳$\approx$57°

    (B)○：2 弳$\approx$114°，1 弳$\approx$57°，3 弳$\approx$171°

    $\Rightarrow$sin2＞sin1＞sin3

    (C)╳：∵30－8π$\approx$30－8×3.14＝4.88

    30－10π$\approx$30－10×3.14＝－1.4

    ∴30 弳的最小正同界角是 30－8π弳

    (D)╳：應為 sin30°＝$\frac{1}{2}$

    (E)○：cosπ＝－1，cosπ°$\approx$cos3.14°＞0

    $\Rightarrow$cosπ＜cosπ°

    故選(B)(E)'
- id: doc_113_台北_明倫_數學_數A_g11s1e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 已知 x 為實數，下列各選項中的方程式何者會有實數解？
  options:
  - label: A
    content: 2 sinx＋cosx＝－2
  - label: B
    content: $\frac{\sin x}{\cos x}= 100$
  - label: C
    content: 4 cosx－sinx＝－4
  - label: D
    content: cosx－2 sinx＝3
  - label: E
    content: sinx＝tanx
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：2 sinx＋cosx＝－2

    $\Rightarrow$2 sinx＝－2－cosx

    $\Rightarrow$4 $sin^{2}$x＝4＋4 cosx＋$cos^{2}$x

    $\Rightarrow$4（1－$cos^{2}$x）＝4＋4 cosx＋$cos^{2}$x

    $\Rightarrow$5 $cos^{2}$x＋4 cosx＝0

    $\Rightarrow$cosx（5 cosx＋4）＝0

    $\Rightarrow$cosx＝0 或$-\frac{4}{5}$，x 有實數解

    (B)○：$\frac{\sin x}{\cos x}$＝tanx＝100，x 有實數解

    (C)○：4 cosx－sinx＝－4

    $\Rightarrow$4 cosx＝sinx－4

    $\Rightarrow$16 $cos^{2}$x＝$sin^{2}$x－8 sinx＋16

    $\Rightarrow$16（1－$sin^{2}$x）＝$sin^{2}$x－8 sinx＋16

    $\Rightarrow$17 $sin^{2}$x－8 sinx＝0

    $\Rightarrow$sinx（17 sinx－8）＝0

    $\Rightarrow$sinx＝0 或$\frac{8}{17}$，x 有實數解

    (D)╳：cosx－2 sinx＝3

    $\Rightarrow$3＋2 sinx＝cosx

    $\Rightarrow$9＋12 sinx＋4 $sin^{2}$x＝$cos^{2}$x＝1－$sin^{2}$x

    $\Rightarrow$5 $sin^{2}$x＋12 sinx＋8＝0

    ∵D＝$12^{2}$－4×5×8＜0

    ∴sinx 沒有實數解$\Rightarrow$x 沒有實數解

    (E)○：sinx＝tanx＝$\frac{\sin x}{\cos x}$

    當 sinx＝0，即 x＝kπ時有實數解

    故選(A)(B)(C)(E)'
- id: doc_113_台北_明倫_數學_數A_g11s1e1_s2_6
  section: 2
  number: 6
  type: multiple
  page: 2
  stem: 下列哪些敘述是正確的？
  options:
  - label: A
    content: a＝$\cos 66^{^{\circ}} + \sqrt{3}\sin 66^{^{\circ}}$和 b＝$\cos 86^{^{\circ}} + \sqrt{3}\sin 86^{^{\circ}}$，a 比較接近 2
  - label: B
    content: sin17°cos103°＋cos17°sin103°＝$\frac{1}{2}$
  - label: C
    content: $\sin \frac{2\pi}{3}\cos \frac{\pi}{6}+\cos \frac{3\pi}{2}\sin \frac{5\pi}{6}+\tan \frac{5\pi}{4}\sin \frac{7\pi}{6}$＝2
  - label: D
    content: cos120°＝$\sqrt{\frac{1 +\cos 240^{^{\circ}}}{2}}$
  - label: E
    content: 4 $cos^{3}$40°－3 cos40°＋1＝$\frac{1}{2}$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：a＝$\cos 66^{^{\circ}} + \sqrt{3}\sin 66^{^{\circ}}$

    ＝$2 \left( \frac{1}{2}\cos 66^{^{\circ}} +\frac{\sqrt{3}}{2}\sin 66^{^{\circ}} \right)$

    ＝2 sin（66°＋30°）＝2 sin96°

    b＝$\cos 86^{^{\circ}} + \sqrt{3}\sin 86^{^{\circ}}$

    ＝$2 \left( \frac{1}{2}\cos 86^{^{\circ}} +\frac{\sqrt{3}}{2}\sin 86^{^{\circ}} \right)$

    ＝2 sin（86°＋30°）＝2 sin116°

    ∵sin116°＜sin96°＜sin90°＝1

    $\Rightarrow$a 較接近 2

    (B)╳：sin17°cos103°＋cos17°sin103°＝sin（17°＋103°）＝sin120°＝$\frac{\sqrt{3}}{2}$

    (C)╳：$\sin \frac{2\pi}{3}\cos \frac{\pi}{6}+\cos \frac{3\pi}{2}\sin \frac{5\pi}{6}+\tan \frac{5\pi}{4}\sin \frac{7\pi}{6}$

    ＝$\frac{\sqrt{3}}{2}\times \frac{\sqrt{3}}{2}+ 0\times \frac{1}{2}+ 1\times \left( -\frac{1}{2} \right)$＝$\frac{1}{4}$

    (D)╳：cos120°＜0，$\sqrt{\frac{1 +\cos 240^{^{\circ}}}{2}}$＞0，cos120°≠$\sqrt{\frac{1 +\cos 240^{^{\circ}}}{2}}$

    (E)○：4 $cos^{3}$40°－3 cos40°＋1＝cos120°＋1

    ＝$-\frac{1}{2}+ 1$＝$\frac{1}{2}$

    故選(A)(E)'
