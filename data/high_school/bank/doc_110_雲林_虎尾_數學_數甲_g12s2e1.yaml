  explanation: '令 P（x，y）＝（$t^{2}$，4t）在Γ：$y^{2}$＝16x 上，又 L：4x－3y＋24＝0

    ∴d（P，L）＝$\frac{∣ 4t^{2}- 3\times 4t + 24 ∣}{\sqrt{4^{2}+(- 3)^{2}}}$＝$\frac{4}{5}\times ∣t^{2}- 3t + 6 ∣$

    ＝$\frac{4}{5} \left| \left( t -\frac{3}{2} \right) ^{2}+\frac{15}{4} \right| \geq \frac{4}{5}\times \frac{15}{4}= 3$

    ∴最近距離為 3，故選(B)'
