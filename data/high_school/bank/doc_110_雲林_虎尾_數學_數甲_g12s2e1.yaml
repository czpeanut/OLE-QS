- id: doc_110_雲林_虎尾_數學_數甲_g12s2e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 已知雙曲線$\frac{y^{2}}{4}-\frac{x^{2}}{9}= 1$，下列哪些為真？
  options:
  - label: A
    content: 焦點坐標為$(\pm \sqrt{13} , 0)$
  - label: B
    content: 頂點坐標為（0，± 2）
  - label: C
    content: 貫軸長為 2
  - label: D
    content: 共軛軸長為 6
  - label: E
    content: 漸近線方程式為 2x ± 3y＝0
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵Γ：$\frac{y^{2}}{2^{2}}-\frac{x^{2}}{3^{2}}= 1$ ∴$a^{2}$＝$2^{2}$，$b^{2}$＝$3^{2}$

    $\Rightarrow$a＝2，b＝3，$c = \sqrt{a^{2}+b^{2}} = \sqrt{4 + 9} = \sqrt{13}$，為上下型的雙曲線

    (A)╳：焦點為 F$(0 , \pm \sqrt{13})$

    (B)○：頂點為（0，± 2）

    (C)╳：貫軸長為 2a＝2×2＝4

    (D)○：共軛軸長為 2b＝2×3＝6

    (E)○：令$\frac{y^{2}}{2^{2}}-\frac{x^{2}}{3^{2}}= 0\Rightarrow$（3y）$^{2}$－（2x）$^{2}$＝0$\Rightarrow$（2x）$^{2}$－（3y）$^{2}$＝0

    ∴漸近線方程式為 2x ± 3y＝0，故選(B)(D)(E)'
