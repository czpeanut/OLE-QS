- id: doc_110_雲林_虎尾_數學_數甲_g12s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列哪些選項的點落在橢圓$\frac{x^{2}}{4}+\frac{y^{2}}{9}= 1$上？
  options:
  - label: A
    content: （0，－3）
  - label: B
    content: $\left( \frac{6}{\sqrt{13}} , \frac{6}{\sqrt{13}} \right)$
  - label: C
    content: （2，3）
  - label: D
    content: （2 cos10°，3 sin10°）
  - label: E
    content: （2 cos250°，3 sin250°）
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：（0，－3）代入得$\frac{0^{2}}{4}+\frac{(- 3)^{2}}{9}= 1$

    (B)○：$\left( \frac{6}{\sqrt{13}} , \frac{6}{\sqrt{13}} \right)$代入得$\frac{\left( \frac{6}{\sqrt{13}} \right) ^{2}}{4}+\frac{\left( \frac{6}{\sqrt{13}} \right) ^{2}}{9}=\frac{9}{13}+\frac{4}{13}= 1$

    (C)╳：（2，3）代入得$\frac{2^{2}}{4}+\frac{3^{2}}{9}= 1 + 1 = 2 \neq 1$

    (D)○：（2 cos10°，3 sin10°）代入得$\frac{(2\cos 10^{^{\circ}})^{2}}{4}+\frac{(3\sin 10^{^{\circ}})^{2}}{9}=\cos ^{2}10^{^{\circ}}+\sin ^{2}10^{^{\circ}} = 1$

    (E)○：（2 cos250°，3 sin250°）代入得$\frac{(2\cos 250^{^{\circ}})^{2}}{4}+\frac{(3\sin 250^{^{\circ}})^{2}}{9}=\cos ^{2}250^{^{\circ}}+\sin ^{2}250^{^{\circ}} = 1$

    故選(A)(B)(D)(E)'
