- id: doc_110_雲林_虎尾_數學_數甲_g12s2e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 選出正確的選項。
  options:
  - label: A
    content: $\sqrt{-4} = 2i$
  - label: B
    content: －4＋5i 的實部為－4，虛部為 5i
  - label: C
    content: 2＋i＞2－i
  - label: D
    content: $\frac{1}{2 +i}=\frac{2 -i}{3}$
  - label: E
    content: $(2 - \sqrt{3}i)^{2} = 1 - 4\sqrt{3}i$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\sqrt{- 4} = \sqrt{4}\times \sqrt{- 1} = 2i$

    (B)╳：－4＋5i 的實部為－4，虛部為 5

    (C)╳：複數無法比大小

    (D)╳：$\frac{1}{2 +i}=\frac{1}{2 +i}\times \frac{2 -i}{2 -i}=\frac{2 -i}{2^{2}-i^{2}}=\frac{2 -i}{4 -(- 1)}=\frac{2 -i}{5}$

    (E)○：$(2 - \sqrt{3}i)^{2} = 2^{2}- 2\times 2\times \sqrt{3}i +(\sqrt{3}i)^{2}$

    $= 4 - 4\sqrt{3}i + 3\times i^{2} = 1 - 4\sqrt{3}i$

    故選(A)(E)'
