  answer_status: verified
  answer_source: answer_key
  explanation: '∵P 點在$\frac{x^{2}}{3}+\frac{y^{2}}{1}= 1$上，令 P（x，y）＝$(\sqrt{3}\cos \theta , \sin \theta )$，L：x＋y－4＝0

    ∴d（P，L）＝$\frac{∣ \sqrt{3}\cos \theta +\sin \theta - 4 ∣}{\sqrt{1^{2}+ 1^{2}}}\leq \frac{6}{\sqrt{2}}= 3\sqrt{2}$，故選(C)

    $\left( \begin{matrix}\because - \sqrt{(\sqrt{3})^{2}+ 1^{2}}\leq \sqrt{3}\cos \theta +\sin \theta \leq \sqrt{(\sqrt{3})^{2}+ 1^{2}} \\ \Rightarrow - 6\leq \sqrt{3}\cos \theta +\sin \theta - 4\leq - 2 \\ \therefore 2\leq ∣ \sqrt{3}\cos \theta +\sin \theta - 4 ∣\leq 6\end{matrix} \right)$'
