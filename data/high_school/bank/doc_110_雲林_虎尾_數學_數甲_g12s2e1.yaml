    content: $\sqrt{2}$
  - label: B
    content: $2\sqrt{2}$
  - label: C
    content: $3\sqrt{2}$
  - label: D
    content: $4\sqrt{2}$
  - label: E
    content: $6\sqrt{2}$
  answer:
