  stem: 某會議決議內容：「回顧聯合國憲章的原則，考慮到恢復中華人民共和國的合法權利對於維護聯合國憲章和聯合國組織根據憲章所必須從事的事業都是必不可少的，承認中華人民共和國政府的代表是中國在聯合國組織的唯一合法代表，中華人民共和國是安全理事會五個常任理事國之一。決定：恢復中華人民共和國的一切權利，承認其政府的代表為中國在聯合國組織的唯一合法代表，並立即把蔣介石的代表從它在聯合國組織及其所屬一切機構中所非法占據的席位上驅逐出去。」請問根據上述內容及你的歷史知識，下列敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 此會議應為聯合國第2758號決議
  - label: B
    content: 因為這個決議，中華民國陷入外交危機，也同時影響了蔣經國的革新保臺政策
  - label: C
    content: 因為這個決議，1978年中華民國與美國斷交，不再維持任何關係
  - label: D
    content: 此決議後，中華民國外交改為發展實質經貿關係
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
