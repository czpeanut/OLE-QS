  stem: (甲)是指1890年代以後，中國常使用的一個軍事術語。最初，是指清廷以軍事手段解決、消滅鄉村地區的土匪、盜匪等犯罪勢力的通行做法。進入中華民國時期後，成為國民政府和大日本帝國傀儡政權消滅反政府、反抗勢力的通行做法。通常政府派遣軍隊或武裝力量去鄉村清查任何可藏匿之處所，並針對可疑人士實行拘捕、處決。根據上文判斷，中華民國政府曾經在什麼時候以(甲)來對地方進行掃蕩？
