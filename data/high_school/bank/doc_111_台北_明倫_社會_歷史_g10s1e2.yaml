- id: doc_111_台北_明倫_社會_歷史_g10s1e2_s2_5
  section: 2
  number: 5
  type: single
  page: 5
  stem: '請閱讀下列資料後回答問題：這是戰後臺灣歷史上難以磨滅的痛，這時期命令重於法律，法律勝於《憲法》，任何人都可能因為一件無心的小事，而被羅織入獄。有人在雙十節慶祝大會上，當大家喊「蔣總統萬歲」時，他沒跟著喊就被檢舉入獄；有人說了「大陸土地比臺灣大，資源比臺灣多」，結果被以「為匪宣傳」判刑；也有人煮燒酒雞時，只講了一句「來喝紅標」（註：「紅標」指的是公賣局米酒)，沒多久被安全人員找他去問話。縱使這些人出獄後，身分證、戶口謄本上仍然登載「叛亂」，終身受到情治單位的監視與迫害，甚至連其家屬親友，也會受累遭殃。當時所發生的政治案件中，約有2,000人遭處決，8,000人被判重刑，大多是冤案、錯案、假案的犧牲者；一般平民被移送軍法審判者，常見一審定案、量刑過重的情形。這個時期，政府如同黑道、流氓般的跋扈，現今當我們在面對過去這段歲月時，應該特別留意，保持一點警覺心，不要被所謂權威、領導者蒙蔽而不自知。

    資料出處：侯坤宏，<戰後臺灣白色恐怖論析>，《國史館學術集刊》12（2007，臺北），頁179～190

