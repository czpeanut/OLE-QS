  - label: B
    content: 得以大幅度降低外債
  - label: C
    content: 得到歐洲市場與經濟支援
  - label: D
    content: 獲得出海口以發展航運
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)烏克蘭希望與西方國家簽署計畫，主要是希望能夠得到歐洲市場與經濟的支援。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 世界銀行的研究報告指：「為了因應油價升高、能源安全與氣候變化等問題，各國政府投入生質能源的發展。其中，以種植甘蔗、大豆、棕櫚樹來發展生質能源可能帶來的不良後果。」下列哪些影響可能是該研究報告所指的不良後果？(甲)排擠糧食作物的耕作空間(乙)比燃燒化石燃料更易增加大氣中的溫室氣體(丙)造成國際糧價大漲(丁)原始生態的生物多樣性遭到破壞
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙丁
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲乙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)種植甘蔗、大豆、油棕等非糧食作物，會排擠到糧食作物的耕作空間；(乙)植物生長時會吸收二氧化碳，燃燒時釋放，故不會比化石燃料更易增加溫室氣體；(丙)由於生質作物取代糧食作物的種植，故會使國際糧價上漲；(丁)原始林的生物多樣性會降低。故選(B)。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_7
  section: 1
  number: 7
