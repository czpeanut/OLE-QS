- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '下表為德國、加拿大、法國、日本不同能源發電量的構成，甲至丁依序為哪一國家？

    | 發電量構成（％） 國家 | 火力 |  |  | 水力 | 核能 | 其他 |

    | --- | --- | --- | --- | --- | --- | --- |

    |  | 煤炭 | 石油 | 天然氣 |  |  |  |

    | 甲 | 33.1 | 3.9 | 34.1 | 7.6 | 5.4 | 15.9 |

    | 乙 | 5.7 | 0.4 | 11.3 | 61.5 | 12.9 | 8.2 |

    | 丙 | 31.1 | 3.2 | 16.5 | 3 | 6.3 | 39.9 |

    | 丁 | 0.9 | 2 | 8.9 | 9.5 | 61.4 | 17.3 |'
  options:
  - label: A
    content: 法國、加拿大、日本、德國
  - label: B
    content: 德國、日本、加拿大、法國
  - label: C
    content: 加拿大、法國、德國、日本
  - label: D
    content: 日本、加拿大、德國、法國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 表中為不同能源發電量構成的國家，其中水力占比最高的應為高緯度冰河地形落差大的加拿大─乙；核能發電占比最多的應為法國─丁；甲為火力發電和水力發電占比較丙高的日本；丁為德國，因此甲至丁答案依序為(D)日本、加拿大、德國、法國。
