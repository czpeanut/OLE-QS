  page: 1
  stem: 今年 8 月 24 日，日本政府將福島核電廠的廢水排至大海，引起了國際間議論。這些廢水最可能依序順著哪些洋流可能會影響到臺灣東部海域？(甲)黑潮(乙)親潮(丙)北太平洋洋流(丁)赤道洋流(戊)阿拉斯加暖流(己)加利福尼亞涼流
  options:
  - label: A
    content: 甲丙戊乙
  - label: B
    content: 甲乙丙己丁
  - label: C
    content: 乙丙己丁甲
  - label: D
    content: 乙丙己戊甲
  explanation: 日本核廢水「依序順著洋流」影響臺灣東部地區，故應選(甲)黑潮→(丙)北太平洋洋流→(己)加利福尼亞涼流→(丁)赤道洋流→(甲)黑潮。此題沒有答案。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 《 2022 年全球飢餓指數》顯示，印度的飢餓嚴重程度在 121 個國家中排名第 107 位，兒童發育遲緩率高達 31.8 ％。但同時 2021 年印度出口稻米總量達 2,150 萬噸，位居全球第 1。造成印度發生飢餓與糧食出口並存矛盾現象的主要原因，與何者的關係「最小」？
  options:
  - label: A
    content: 印度農民普遍貧困拿糧食換取日常必需品，卻沒有足夠的金額再回購糧食
  - label: B
    content: 印度人皆吃素食的文化對糧食的需求及消費量較低
  - label: C
    content: 國內剩糧過多，政府欲以糧食出口賺取外匯收入
  - label: D
    content: 掌握大多數土地的大地主選擇出口糧產以獲取自身利益
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 印度飢餓指數高，但其出口稻米總量居全球第一，造成此矛盾的主要原因為(A)(C)(D)。與吃素的文化關係最小，故選(B)。
