- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 在 2020 年 9 月，香港大學進行電話訪問，發現有 15 ％的受訪民眾已在為移民做準備。另外，如果有機會的話，約 44 ％受訪者打算移民或移居外地，移居的目的國依次為英國、澳洲、臺灣和加拿大。這些移民來臺的港人可能會對臺灣社會產生何種影響？
  options:
  - label: A
    content: 直接衝擊本地低技術勞工
  - label: B
    content: 提高生產力和勞動參與率
  - label: C
    content: 國外匯款為香港重要歲收來源
  - label: D
    content: 不利臺灣人力資本的累積
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 來臺港人對於臺灣（移入地）的影響為(B)。(A)來臺港人非從事低技術勞工工作，因此不會衝擊到低技術勞工。(C)香港經濟並不低於臺灣，因此來臺港人並不需要將賺的錢匯回移出地。(D)會增加臺灣人力資本的累績。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 在 2005 年，美國《新能源法案》正式生效，要求 2030 年生質燃料的產量需達 600 億加侖，因此美國政府透過政策，鼓勵農場主人紛紛放棄小麥和大豆轉作甲作物，以提供乙醇生產。甲作物應為
  options:
  - label: A
    content: 玉米
  - label: B
    content: 甘蔗
  - label: C
    content: 葡萄
  - label: D
    content: 甘藷
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 美國的生質能源作物為玉米，故選(A)。(B)甘蔗為熱帶地區的生質能源作物，如巴西種植面積較大。(C)葡萄與(D)甘藷並非生質能源作物。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 由於世界的糧食生產與消費不均，因此各國的糧食問題皆不同。以美國來說，該國主要面臨的糧食問題為何？
  options:
  - label: A
    content: 總攝取熱量偏低造成身體機能受礙
  - label: B
    content: 高脂高熱量的飲食易罹患心血管疾病
  - label: C
    content: 攝取過量澱粉類食物，導致體重過重
  - label: D
    content: 利用穀物畜養牲畜造成極度仰賴糧食進口
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)美國為已開發國家，其總攝取熱量高。(C)攝取過量的油脂類食物。(D)美國糧食不需進口，其為主要糧食出口國。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 糧食危機的原因之一是供需的問題，當需求大於供應時，就容易推升價格。請問：糧價上漲的原因，下列哪 2 項符合上述內容？(甲)開發中國家肉品消費量大增(乙)金融期貨市場的交易買賣(丙)生質能源的大量推廣(丁)因石油價格上漲造成農業生產成本增加
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丁
  - label: D
    content: 甲丙
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 糧食需求大於供給時，就會糧價上漲，故選(D)(甲)(丙)。(乙)金融期貨市場的買賣交易會造成糧食價格波動，但此非供需影響；(丁)石油價格上漲，農業生產成本增加，造成糧食價格上漲，非供需影響。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: '農業科技運用於增加全球糧食產量上，主要為綠色革命與基因改造技術的應用，但同時也需承受相當程度的風險。下表有關綠色革命與基因改造的比較，哪些是正確的？

    |  | 甲 | 乙 | 丙 | 丁 |

    | --- | --- | --- | --- | --- |

    | 綠色革命 | 將同科物種雜交培育出新品種 | 需大量化肥、農藥及灌溉系統配合 | 以穀物作物的新品種為主 | 品種種植分布於亞洲與拉丁美洲溼潤地區 |

    | 基因改造 | 跨物種的基因重組 | 種子等研發成本高昂，完全不需要除草劑及殺蟲劑 | 新品種作物用作飼料的比例較高 | 品種種植大多以農產品輸出大國為主 |'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 乙：基因改造的種子還是需要除草劑和殺蟲劑。
- id: doc_112_彰化_彰化女中_社會_地理_選修地理II_g12s1e3_s1_15
