  stem: 臺灣的水力、火力與核能發電皆屬集中式發電系統，風能、太陽能、地熱能、海洋能及生質能大多只能採取分散式發電，產生這種差異的主因為何？
  options:
  - label: A
    content: 水力、火力與核能發電的成本較低廉
  - label: B
    content: 水力、火力與核能發電的接受度較高
  - label: C
    content: 風能、太陽能、地熱能等能源較易取得
  - label: D
    content: 風能、太陽能、地熱能等發電條件較侷限
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)火力與核能的發電成本並不低廉。(B)核能發電由於核廢料存放的問題，接受度不一。(C)地熱能因受環境限制，並不易取得。
