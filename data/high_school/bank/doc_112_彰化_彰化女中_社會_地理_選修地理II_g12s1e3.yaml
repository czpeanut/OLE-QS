  stem: 閱讀以上 2 篇資料，判斷下列關於基因改造作物的敘述，何者正確？
  options:
  - label: A
    content: 可以完全解決全球糧食分配不均的問題
  - label: B
    content: 種植的過程中無須搭配其他藥劑的使用
  - label: C
    content: 種植基因改造作物會排擠雜草及消滅昆蟲
  - label: D
    content: 具有可以耐蟲害、耐寒、或是耐旱的特性
  group_stem: '下列 2 則為基因改造作物的相關報導。請問：

    資料一：生技公司孟山都研發各種新品種作物、基因改造物，先不論是否帶來危害，至少促進了農作物大量增產，但人類有因此免於飢餓的威脅嗎？2019 年聯合國糧食及農業組織（FAO）公布，全球有 10 億人口每天處於飢餓狀態，然而另一方面，丟棄浪費的食物達 13 億噸。新品種作物因可適應更嚴酷的氣候及土壤，抵抗病蟲害，所以產量增加，但反而造成人類社會更多的不幸。

    資料二：海洋生物學家瑞秋．卡森（Rachel Louise Carson）著名的著作《寂靜的春天》（Silent Spring），其內容以專業的角度指出殺蟲劑 DDT 的大量使用固然控制了蟲害，也無差別地傷及無辜，周遭沒了蟲鳴鳥叫，春天寂靜如死。有鑑於生態危害，多數毒性強的殺蟲劑已經被禁用，方法之一就是培育「基因改造」的農作物，玉米、大豆等農作物在種子育成階段就培養了抗蟲性、抗旱性。又因「除草劑」大量使用，現在又培育了具「抗除草性」的基改作物，近年這樣的基改作物愈種愈多，除草劑就更毫無顧忌地使用，因為只除草，不會誤殺農作物。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)從文中可以發現基改種子有抗蟲性、抗旱性、抗除草性。(A)基改作物無法完全解決全球糧食分配不均問題。(B)種植過程中需要使用除草劑。(C)並無法排擠雜草或消滅昆蟲，所以需要配合除草劑與殺蟲劑使用。
