  group_stem: '造成全世界現階段跨國遷移現象的形成有不同的因素，下列幾則為跨國遷移的相關報導。請問：

    報導一：來自吉里巴斯的提歐塔於 2016 年向《公民與政治權利國際公約》（ICCPR）人權委員會提起申訴，控告紐西蘭政府違反 ICCPR 第 6 條第 1 項規定：「人人有固有的生命權。這個權利應受法律保護，不得任意剝奪任何人的生命。」，將其驅逐到吉里巴斯，侵犯了他的生活權，且因目前吉里巴斯生活環境無立即性危險，2020 年 1 月裁定紐西蘭政府並未違反國際法。

    報導二：孟加拉政府在 2020 年 12 月將從緬甸到孟加拉的數百名羅興亞（Rohingya）人移轉到地勢低窪、泥沙淤積而成的巴山查爾島。聯合國與人權團體擔憂移轉地是座低窪島嶼，易受熱帶氣旋與洪患侵擾，此舉將使羅興亞人處境更加艱難。

    報導三：在澳洲龍蝦工廠工作，旺季時最多週薪大概有 1,800 澳幣，換算成當時的新臺幣約 5.4 萬，生活基本上就是龍蝦、吃飯跟睡覺，3 件事一直循環，沒有腦袋去思考其他事情。1 個禮拜工時最少都是 70 小時起跳。

    報導四：2014 年，印尼政府開始禁止家務勞工輸出至特定國家，這些被評判工作環境惡劣的國家有 21 個，大部分集中於中東地區與非洲北部。因為長久以來，中東國家在海外移工的勞動條件、薪資與工作環境上有不良紀錄。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 報導一為氣候難民；報導二為戰爭所產生的難民；報導三為打工度假；報導四為經濟因素的移工。與難民相關議題的報導為(A)報導一及報導二。
