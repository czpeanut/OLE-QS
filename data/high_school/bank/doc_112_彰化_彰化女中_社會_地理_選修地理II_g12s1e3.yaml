  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)東歐的移民冒險徒步在歐洲之星的海底隧道，企圖到英國尋找工作機會為(乙)人口推拉理論，東歐經濟不佳具有推力，英國具有拉力；(丙)核心與邊陲，英國為核心區，工業發展較早、經濟佳，東歐為邊陲區，人口由邊陲區流往核心區。
