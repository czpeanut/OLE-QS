  group_stem: '以下是有關日本國債問題的資料。請問：

    資料一：日本近年面臨嚴重的國債問題，目前債務約為其 GDP 的 2.5 倍，日本債務占 GDP 的比例甚至較先前引發歐債危機的希臘、西班牙來得高。由於國債的債權人多為日本國民、企業，以及政府退休基金，對於國家的償債能力有信心，因此目前還未爆發債務危機。

    資料二：日本國債利率雖低，然而隨著債務增加、老年及退休人口成長，債務利息逐年增加，消耗大量政府稅收，進而排擠其他可能刺激國家經濟成長的相關預算，例如研發及基礎建設。國債的持有人及受益人主要為老年人，其領取先前購買政府債券而配發的利息，或是從投資政府債券的退休基金中領取養老金。當債務利息漸增，表示納稅的年輕人負擔將愈來愈重，逐漸構成世代間的衝突。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從資料一中提及國債問題，資料二中提及老年及退休人口的成長，納稅年輕人負擔越重……，可以判斷日本經濟問題應為(B)人口結構老化。
