- id: doc_110_桃園_武陵_數學_數甲_g12s2e1_s3_15
  section: 3
  number: 15
  type: multiple
  page: 2
  stem: 坐標平面上，方程式$y^{2}$＋4x＋4y＝0之圖形，選出正確的選項。
  options:
  - label: A
    content: 頂點為 ( 1 ,－2 )
  - label: B
    content: 頂點為 ( 1 ,－3 )
  - label: C
    content: 準線方程式為x－1＝0
  - label: D
    content: 對稱軸方程式為y＋2＝0
  explanation: '(A)(D)

    13. (A) ×：P點坐標為 ( $\overline{OP}$×cos45° , $\overline{OP}$×sin45° ) (B) ×：承(A)可知P ( $\frac{1}{\sqrt{2}}\overline{OP}$ , $\frac{1}{\sqrt{2}}\overline{OP}$ )，代入$\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}$＝1可得$\frac{\overline{OP}^{2}}{2a^{2}}+\frac{\overline{OP}^{2}}{2b^{2}}$＝1 $\Rightarrow\overline{OP}^{2}$＝$\frac{1}{\frac{1}{2a^{2}}+\frac{1}{2b^{2}}}$＝$\frac{2a^{2}b^{2}}{a^{2}+b^{2}}\Rightarrow\overline{OP}=\sqrt{\frac{2a^{2}b^{2}}{a^{2}+b^{2}}}$。 (C) ○：承(B)可知正確。 (D) ○：$\left[ \begin{matrix}x'' \\ y''\end{matrix} \right]$＝$\left[ \begin{matrix}3 & 0 \\ 0 & 2\end{matrix} \right] \left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}3x \\ 2y\end{matrix} \right]\Rightarrow\left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}\frac{x''}{3} \\ \frac{y''}{2}\end{matrix} \right]$代入$\frac{x^{2}}{a^{2}}$＋$\frac{y^{2}}{b^{2}}$＝1可得$\frac{(\frac{x''}{3})^{2}}{a^{2}}$＋$\frac{(\frac{y''}{2})^{2}}{b^{2}}$＝1 $\Rightarrow\frac{x''^{2}}{9a^{2}}$＋$\frac{y''^{2}}{4b^{2}}$＝1，所以新橢圓方程式為$\frac{x^{2}}{9a^{2}}$＋$\frac{y^{2}}{4b^{2}}$＝1。
    故選(C)(D)。

    14. 9($y^{2}$＋2y)－4($x^{2}$－4x)＝43 $\Rightarrow$ 9(y＋1)$^{2}$－4(x－2)$^{2}$＝36 $\Rightarrow\frac{(y+1)^{2}}{4}$－$\frac{(x-2)^{2}}{9}$＝1 可知中心為 ( 2 ,－1 )，a＝2，b＝3 $\Rightarrow$ c＝$\sqrt{a^{2}+b^{2}}$＝$\sqrt{13}$ (A) ×：頂點為 ( 2 ,－3 )，( 2 , 1 ) (B) ○：共軛軸長為2b＝6 (C) ○：兩焦點為 ( 2 ,－1＋$\sqrt{13}$ )，( 2 ,－1－$\sqrt{13}$ ) (D) ×：兩漸近線為3(y＋1)＋2(x－2)＝0，3(y＋1)－2(x－2)＝0，所以斜率乘積為$\frac{-2}{3}$×$\frac{2}{3}$＝$\frac{-4}{9}$ 故選(B)(C)。

    15. 配方可得(y＋2)$^{2}$＝－4x＋4 $\Rightarrow$ (y＋2)$^{2}$＝－4(x－1) $\Rightarrow$ 4c＝－4 $\Rightarrow$ c＝－1 (A) ○：頂點為 ( 1 ,－2 ) (B) ×：焦點為 ( 0 ,－2 ) (C) ×：準線為x＝2 (D) ○：對稱軸為y＝－2 故選(A)(D)。'
