- id: doc_110_桃園_武陵_數學_數甲_g12s2e1_s1_1
  section: 1
  number: 1
  type: calc
  page: 1
  stem: 坐標平面上，拋物線Г$_{1}$：( x－1 )$^{2}$＝32( y＋4 )，橢圓Г$_{2}$的兩焦點就是拋物線Г$_{1}$的頂點與焦點，Г$_{2}$的長軸長為10，求橢圓Г$_{2}$的方程式？
  answer:
  - $\frac{(x-1)^{2}}{9}+\frac{y^{2}}{25}$＝1
  answer_status: verified
  answer_source: answer_key
- id: doc_110_桃園_武陵_數學_數甲_g12s2e1_s1_2
  section: 1
  number: 2
  type: calc
  page: 1
  stem: 坐標平面上，雙曲線的漸近線為2x－y＝0與2x＋y＝0，且其中一焦點為F( 5 , 0 )，求此雙曲線方程式？
  answer:
  - $\frac{x^{2}}{5}-\frac{y^{2}}{20}$＝1
  answer_status: verified
  answer_source: answer_key
  explanation: 解$\begin{cases}2x-y=0 \\ 2x+y=0\end{cases}\Rightarrow\begin{cases}x=0 \\ y=0\end{cases}$，所以中心為 ( 0 , 0 )，作圖如右 可知$\frac{b}{a}=m_{L_{1}}=2\Rightarrow$ b＝2a又c＝5 所以$c^{2}$＝$a^{2}$＋$b^{2}$＝$a^{2}$＋$4a^{2}$＝$5a^{2}$＝25 $\Rightarrow$ $a^{2}$＝5 $\Rightarrow$ $b^{2}$＝$c^{2}$－$a^{2}$＝25－5＝20 故所求為$\frac{x^{2}}{5}-\frac{y^{2}}{20}=1$。
- id: doc_110_桃園_武陵_數學_數甲_g12s2e1_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: 橢圓Г$_{1}$：$\frac{(x-1234)^{2}}{99}$＋$\frac{(y-4321)^{2}}{9}$＝1的兩焦點為$F_{1}$、$F_{2}$，有一雙曲線Г$_{2}$與橢圓Г$_{1}$有共同的焦點$F_{1}$、$F_{2}$，且雙曲線Г$_{2}$的貫軸長與橢圓Г$_{1}$的短軸長相等，若P為Г$_{1}$與Г$_{2}$的一個交點，求$\overline{PF_{1}}$×$\overline{PF_{2}}$之值為＿＿＿＿。
  answer:
  - '90'
  answer_status: verified
  answer_source: answer_key
  explanation: Г$_{1}$的半長軸為a＝$\sqrt{99}$，半短軸長為b＝3，所以$c^{2}$＝$a^{2}$－$b^{2}$＝90 Г$_{2}$的貫軸長2a'＝2b $\Rightarrow$ a'＝b＝3 故由定義可得$\overline{PF_{1}}\times \overline{PF_{2}}$＝$\frac{1}{4}[(\overline{PF_{1}}+\overline{PF_{2}})^{2}-(\overline{PF_{1}}-\overline{PF_{2}})^{2}]$＝$\frac{1}{4}[(2a)^{2}-(2a')^{2}]$＝$\frac{1}{4}$($4a^{2}$－$4b^{2}$)＝$a^{2}$－$b^{2}$＝90。
- id: doc_110_桃園_武陵_數學_數甲_g12s2e1_s2_4
  section: 2
  number: 4
  type: fill
  page: 1
  stem: 一星球繞太陽運行的軌道為一個橢圓，而且太陽位在橢圓的一個焦點上，當此星球運行到長軸上的兩個頂點時，距離太陽較近的長軸上的頂點稱為近日點，距離太陽較遠的長軸上的頂點稱為遠日點。若遠日點到太陽之距離恰好為橢圓之短軸長的5倍，求橢圓的短軸長是其近日點到太陽之距離的＿＿＿＿倍。
  answer:
  - '20'
  answer_status: verified
  answer_source: answer_key
  explanation: 設a－c＝k×2b，可知a＋c＝5×2b＝10b $\Rightarrow$ $b^{2}$＝$a^{2}$－$c^{2}$＝(a＋c)(a－c)＝10b×2kb＝$20kb^{2}$ $\Rightarrow$ 20k＝1 $\Rightarrow\frac{1}{k}$=20， 所以2b＝$\frac{1}{k}$(a－c)=20(a－c)，故所求為20倍。
- id: doc_110_桃園_武陵_數學_數甲_g12s2e1_s2_5
  section: 2
  number: 5
  type: fill
  page: 1
  stem: 橢圓：$\frac{x^{2}}{9}$＋$\frac{y^{2}}{4}$＝1與x軸正向交點為A，與y軸正向交點為B，P為橢圓上第一象限的點，使四邊形OAPB面積最大 ( O為原點)，求四邊形OAPB面積的最大值為＿＿＿＿。
  answer:
  - $3\sqrt{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: 設P ( 3cosθ, 2sinθ)，可知A ( 3 , 0 )，B ( 0 , 2 ) 所以四邊形OAPB面積＝$\frac{1}{2}$×3×2sinθ＋$\frac{1}{2}$×2×3cosθ＝3(sinθ＋cosθ)＝$3\sqrt{2}$sin(θ＋45°) ≤ $3\sqrt{2}$ 故最大值為$3\sqrt{2}$。
- id: doc_110_桃園_武陵_數學_數甲_g12s2e1_s2_6
  section: 2
  number: 6
  type: fill
  page: 1
  stem: 將橢圓Г$_{1}$：$\frac{x^{2}}{8}$＋$\frac{y^{2}}{2}$＝1以原點為中心，依逆時針方向旋轉45°後，得到橢圓Г$_{2}$的方程式為$ax^{2}$＋bxy＋$cy^{2}$－16＝0，a , b , c為固定實數，求a＋b＋c＝＿＿＿＿。
  answer:
  - '4'
  answer_status: verified
  answer_source: answer_key
  explanation: 設Г$_{2}$上任意一點P ( x , y ) 可由Г$_{1}$上一點Q ( r , s ) 旋轉而來 可知$\left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}\cos 45^{\circ}-\sin 45^{\circ} \\ \sin 45^{\circ} \cos 45^{\circ}\end{matrix} \right] \left[ \begin{matrix}r \\ s\end{matrix} \right]\Rightarrow\left[ \begin{matrix}r \\ s\end{matrix} \right]$＝$\left[ \begin{matrix}\cos 45^{\circ}-\sin 45^{\circ} \\ \sin 45^{\circ} \cos 45^{\circ}\end{matrix} \right] ^{-1}\left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}\cos (-45^{\circ})-\sin (-45^{\circ}) \\ \sin (-45^{\circ}) \cos (-45^{\circ})\end{matrix} \right] \left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}\frac{\sqrt{2}}{2} \frac{\sqrt{2}}{2} \\ \frac{-\sqrt{2}}{2} \frac{\sqrt{2}}{2}\end{matrix} \right] \left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}\frac{\sqrt{2}}{2}(x+y) \\ \frac{\sqrt{2}}{2}(-x+y)\end{matrix} \right]$ 將Q [$\frac{\sqrt{2}}{2}(x+y)$,$\frac{\sqrt{2}}{2}(-x+y)$] 代入Г$_{1}$可得$\frac{\frac{1}{2}(x+y)^{2}}{8}+\frac{\frac{1}{2}(-x+y)^{2}}{2}$＝1
    $\Rightarrow$ (x＋y)$^{2}$＋4(－x＋y)$^{2}$＝16 $\Rightarrow$ $5x^{2}$－6xy＋$5y^{2}$－16＝0 $\Rightarrow$ a＝5，b＝－6，c＝5，故a＋b＋c＝5＋(－6)＋5＝4。
