  stem: '作為共享經濟的早期實踐者，Zipcar租車公司的創辦人Robin Chase曾在書中提到，共用經濟的出現需要滿足三個條件：供給過剩、共用平臺，以及人人參與。以汽車為例，在美國，汽車的平均閒置時間是95％；這意味著花了100％的錢買下一輛車，卻只利用了它5％左右的價值，透過共用經濟將可以更有效利用資源。但目前為止，除了Uber、Airbnb等少數幾家企業，共用經濟在很多領域並未取得真正的成功。以我國及對岸為例，都有曾紅極一時的「共用單車」，但都出現虧損或成為一堆廢鐵，有專家認為共用經濟大幅「釋放」了供給，等於將一件物品用「時段」而非原先的數量來思考供給數目，但民眾的需求雖有增加，卻遠不及供給，導致價格過低，廠商回收投資倍覺艱辛。


    請根據上文，從市場供需變動的角度說明：

    (1) 為何「共用單車」容易出現虧損甚至成為廢鐵？

    (2) 若以供需曲線分析，上述現象對應於供給線與需求線如何移動？均衡價格如何變動？'
