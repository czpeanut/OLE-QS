  answer:
  - (1) 因共用單車大幅釋放供給（以時段切分供給），使市場供給增加的幅度遠大於民眾需求增加的幅度，導致市場均衡價格過低，廠商無法回收投資成本而虧損。
  - (2) 供給線與需求線皆向右移動，但供給線右移幅度大於需求線右移幅度，導致均衡價格下跌。
