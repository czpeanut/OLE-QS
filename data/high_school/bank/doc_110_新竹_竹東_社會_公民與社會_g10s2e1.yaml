  stem: 慶儀閱讀某國勞工史時，讀到一段女性的個人生命史：「這30年來，社會沒有什麼進步，跟我當年的情況相同，那時我11歲還沒畢業，就跟大家一樣，為了讓兄弟讀大學，去工廠做工。最近兩年景氣不好，公司生意差，雖然我年資已將近30年，公司還是要我們自動辭職，大家都覺得這樣很不合理，但沒辦法只能辭職。我安慰自己說也好，不上班可以把小孩照顧得較周到。只是大家都說沒賺錢的人，沒資格講話，總覺得自己在家裡比較沒地位啦！」依據上述個人生命史，下列對於該國人權發展與現實敘述的推論哪些正確？
