  stem: 2015年爆發紅十字會募款資金運用爭議，其後該會又被民眾爆出將捐贈物資作為尾牙抽獎獎品，以及該年度收到數10億捐款的慈濟基金會財務報表卻只有1頁，引起國人對公益團體財務運用狀況的關注。自此之後，許多公益團體也受到較嚴格財務檢視，資訊也逐漸公開，讓捐款人可以確定自己的善款運用在何處。多數公益團體的財務來源以政府補助，以及募款為主。但依據《公益勸募條例》規定，能夠依法公益勸募的只有公立學校、行政法人、公益性社團法人以及財團法人。東東為了做報告整理幾個適用該條文募款的團體、單位，寫下其性質，但卻有一處「寫錯了」，請協助找出錯誤。
