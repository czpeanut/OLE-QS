    content: 順手牽羊之行為，顯示王姓男子具有意圖竊取皮包的想法
  - label: C
    content: 因「不法」之定義含糊不清，故此案件不得用此法條定罪
  - label: D
    content: 若法官判決王男拘役三天，得易科罰金，此法律效果有效
  group_stem: 新聞報導：王姓男子到臺北市一間速食店用餐，見旁邊沒人坐的椅子上放著一個名牌包便順手牽羊帶走，曾姓女子回到座位上不見愛包，報警調閱監視器才知遭王姓男子拿走、最後士林地檢署依竊盜罪起訴，但士林地院認為當時被害人不在名牌包旁邊、沒有支配力，因此變更起訴法條，改依侵占罪判王男罰金1000元。 相關法條： 《刑法》第320條：竊盜罪 意圖為自己或第三人不法之所有，而竊取他人之動產者，為竊盗罪，處五年以下有期徒刑、拘役或五十萬元以下罰金。 《刑法》第335條：侵占罪 意圖為自己或第三人不法之所有，而自己持有他人之物者，處五年以下有期徒刑、拘役或科或併科三萬元以下罰金。
