- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 嘉邑行善團於1965年由何明德創辦，屬於臺灣嘉義地區一個以造橋鋪路為主的社會公益性團體。在沒有政府預算的支援下，迄今已興建將近600座橋，而嘉邑行善團不會因創辦人的去世而消失。下列何項最符合前述意涵？
  options:
  - label: A
    content: 自然人與法人皆具有自主組織權，得為權利義務之主體
  - label: B
    content: 志願結社為實現特定目標而組織、形成團體，屬私法人
  - label: C
    content: 就法律分類言，個人就是自然人；而群體組織就是法人
  - label: D
    content: 自然人的壽命有限，但法人可超越個人生死限制而續存
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 379-395年的羅馬帝國皇帝狄奥多西一世，在380年頒布「薩洛尼卡敕令」，宣布基督教為國教，393年禁止其他宗教，並認定已經舉辦292屆古代奥林匹克運動會是一項異教徒的活動，有違基督教教旨，宣布廢止：直到1986年才恢復，第1屆現代奥林匹克運動在希臘雅典舉行。依照人權的性質來看，狄奥多西一世所侵犯的人權，與下列哪一案例屬於同一主軸？
  options:
  - label: A
    content: 新加坡政府立法承認英語、馬來語、華語、坦米爾語等四種官方的語言
  - label: B
    content: 南蘇丹通過獨立公投後，脫離蘇丹並獨立建國，隨即成為聯合國的成員
  - label: C
    content: 我國憲法增修條文規定國家應推行全民健康保險，政府採全民強制納保
  - label: D
    content: 武漢肺炎吹哨者李明亮病逝，我國外交部表示中國人民值得有言論自由
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_16
  section: 1
  number: 16
