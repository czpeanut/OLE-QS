  stem: 在武漢肺炎初始台灣確診18例後，行政院陸委會宣布沒有我國國籍的陸配子女，只要符合「未成年」、「大陸親人無能力照顧」、「父母皆在臺灣者」三個條件，即可以專案申請來台；結果引起國人強力反彈，疫情中心隔日隨即宣布撤回陸委會決議，指揮官衛福部長陳時中說：「這些人最初沒有選擇台灣國籍，就要自己做安排、自己承擔。」前總統馬英九則在粉專PO文指出：「我國雖不是《聯合國兒童權利公約》的締約國，但自此該公約在臺灣國内法化後，即具有法律效力，中央與地方各級機關行使職權，依法應符合公約有關兒童及少年權利保障之規定。」「防疫可以兼顧人道與人權，讓孩子回家與父母團聚吧」根據馬前總統的主張推論，其論述應該較貼近《聯合國兒童權利公約》哪一個條文？
