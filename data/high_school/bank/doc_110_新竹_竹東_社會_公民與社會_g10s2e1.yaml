questions:
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2020年12月25日，立法院三讀通過《民法修正案》，將我國《民法》的成年年齡下修至18歲，並訂於2023年1月1日施行，使民法的成年標準《刑法》的完全責任能力年齡標準趨於一致。有關法案修法程序，下列敘述何者正確？
  options:
  - label: A
    content: 修正案提案方式可由總統、五院或人民連署提案
  - label: B
    content: 依法案性質交付相關委員會審查後排入三讀議程
  - label: C
    content: 法案三讀時，除重大瑕疵，否則僅能做文字修正
  - label: D
    content: 三讀後，行政院得經總統核可，移請立法院復議
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 原住民獵人王光祿上山狩獵遭法院判處有期徒利，王光祿進行上訴，最終最高法院合議庭法官聲請釋憲並暫停審理。司法院釋字第803號解釋，宣告《野生動物保育法》第21條之1的事先管制、《槍砲彈藥刀械管制條例》限制獵人僅能使用自製獵槍之規定「全部合憲」，另針對《原住民族基於傳統文化及祭儀需要獵捕宰殺利用野生動物管理辦法》（簡稱《原民獵捕動物辦法》）關於突發狩獵5日的申請期限，及事先載明狩獵動物之種類、數量之規定違反比例原則，宣告立即不再適用。請問有關上述内容及原住民族文化權之相關敘述何者正確？
  options:
  - label: A
    content: 原住民有狩獵權利，屬於其生活文化權利之一部分而不得受到干預
  - label: B
    content: 原住民販賣野生動物也視為其現代生活文化權，因此法律亦須保障
  - label: C
    content: 原住民族狩獵時使用之獵槍仍須以自製武器為限，否則仍違反法律
  - label: D
    content: 《野生動物保育法》與《原民獵捕動物辦法》皆為立法院三讀通過
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 俄羅斯入侵烏克蘭的行動遭到國際社會譴責。聯合國召開緊急大會表決，141個國家贊成要求俄羅斯應立即撤出烏克蘭，該決議並無法律效力，但仍能表現各國孤立俄羅斯的決心。而在不久前的安全理事會譴責俄羅斯入侵烏克蘭的表決中，雖有11國投下贊成票，但中國、阿拉伯聯合大公國與印度棄權，俄羅斯則動用否決權，最終決議並未通過。以下敘述何者正確？
  options:
  - label: A
    content: 安全理事會的成員中只要有任一國動用了否決權，該議案即無法通過
  - label: B
    content: 緊急大會的表決通過後，聯合國即有權對俄羅斯採取經濟或軍事制裁
  - label: C
    content: 大會由全部會員國參與表决，更具民主正當性而有高於安理會的效力
  - label: D
    content: 常任理事國可僅基於自身利益考量，阻止維護人權與國際秩序的行動
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 2021年屏東一名男子愛慕通訊女員工，長期訊息騷擾、跟蹤尾隨，造成被害人畏懼害怕，向警局報案卻「因其行為無法可管」不了了之。一個月後該男子故意製造假車禍並強行擄人上車，載至空屋殺害。此案引發社會大眾對跟蹤騷人案件的正視，朝野立委期盼政府加速訂立《跟蹤騷擾防治法》草案，將跟蹤行為入罪化、犯罪態後明確化。請問：針對《跟蹤騷擾防治法》的法律制定過程，下列推論何者錯誤？
  options:
  - label: A
    content: 該法草案得由3人以上的黨團提出，因此立法委員的連署僅需3位即可
  - label: B
    content: 可能會因程序委員會在編列議程時放於較後順位，而導致法案胎死腹中
  - label: C
    content: 若朝野立委對該法案皆具有共識並無異議，在一讀會後得不付黨團協商
  - label: D
    content: 二、三讀會中若有立委提出異議經連署通過後，皆可提出復議重複審查
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 挪威於2021年7月公布《行銷管制法》修正案，未來網紅與廠商在社群媒體發布照片時，都須揭露所使用的濾鏡或修圖App，否則將會受罰，挪威政府指出，厭食症是青少女死亡的第三大原因，修正案的目的是減緩「廣告塑造纖瘦的身體即理想身材」而造成的社會壓力，有些挪威網紅公開表示贊同此修正案，且認為學校與社會對於審美標準應更為多元、並傳遞健康的身體觀念，更强調應提升閱聽人媒體素養的能力，但也有心理學專家表示，法案通過後，可能有人會為了追求「理想外貌」，而尋求整形或過度運動等，最後反而得不償失。根據上文，請問挪威此次修法的主要原因為何？
  options:
  - label: A
    content: 解決科技發展導致的社會問題
  - label: B
    content: 受到利益團體的倡議與施壓
  - label: C
    content: 因原法規對青少女的過度侵害
  - label: D
    content: 保障網紅與廠商的隱私權利
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 2021年4月臺鐵太魯閣號發生重大交通事故，案發後立法院「交通委員會」安排考察臺鐵邊坡工程，包括宜蘭蘇澳、新北市平溪及貢寮等處，希望了解邊坡工程防護監測系統評估及作業進度。因本起事故造成嚴重傷亡，永瑞慈善事業基金會表示將贈100萬元給「財團法人犯罪被害人保護協會」，由其專款專用協助照顧罹難者家屬、及協助重傷者急難救助。請問下列敘述何者正確？
  options:
  - label: A
    content: 文中「引號」部分皆為權利主體，其中交通委員會、永瑞慈善事業基金會為法人
  - label: B
    content: 文中的犯罪被害人保護協會之法人性質，與永瑞慈善事業基金會的法人性質相同
  - label: C
    content: 交通委員會的法人性質，與「地方自治團體」、「行政法人」皆屬於公法人地位
  - label: D
    content: 權利主體指的是在法律上享有權利並負擔義務的一種資格或地位，不包括自然人
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於社會規範的敘述，下列何者正確？
  options:
  - label: A
    content: 目的是維持社會秩序，提供解決社會衝突和傳遞文化的功能
  - label: B
    content: 影響社會成員的個人行為、人際溝通、互動關係等內在層面
  - label: C
    content: 外在社會控制要長時間才可能產生效果，但其效果較為長久
  - label: D
    content: 藉由社會化影響社會成員的價值觀、情感、信念等外在層面
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 高中生翔平在網路上查詢到《少年事件處理法》的相關立法文書資料(如圖(1))。依據你/妳對相關議題的理解，下列敘述何者最為正確？
  options:
  - label: A
    content: 本提案性質屬於政府案，是機關基於職權而提出法律修正案
  - label: B
    content: 因為有跨黨派與不分區委員連署提案，故此案又稱為「復議」
  - label: C
    content: 簽署公約後，我國已存放在聯合國秘書處，藉此獲得國際認可
  - label: D
    content: 《兒童權利公約施行法》通過後，國内機關必須落實公約精神
