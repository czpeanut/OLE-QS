- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 聯合國是目前最重要、會員國最多的國際組織，也訂有據以運作的聯合國憲章，但其運作及維護和平的功能卻屢遭質疑。例如：在敘利亞內戰中，美國、英國、法國和俄羅斯等安理會成員國，曾分別支持政府軍和反政府軍；會員國北韓也在中國暗助之下，多次置聯合國的禁令於不顧，進行核武試驗。關於聯合國上述運作及功能的問題，下列詮釋何者最適當？
  options:
  - label: A
    content: 運作問題根源在於會員國未必認同聯合國憲章
  - label: B
    content: 運作的困境在於缺乏合法武力以解決內戰問題
  - label: C
    content: 功能無法發揮係因會員國的國力差距過於懸殊
  - label: D
    content: 功能不彰常與會員國間的利益和資源爭奪有關
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 我國《民法》對於子女姓氏應從父姓或母姓的規定，歷經數次修正，由原先「子女應從父姓」，改成可以由父母書面約定子女姓氏；但目前依據内政部調查顯示，絕大多數的子女仍以從父姓為主。下列哪一個論點最能用來說明此一現象？
  options:
  - label: A
    content: 法律未強制子女從父姓，係因社會習慣與法律具有一致性
  - label: B
    content: 因習慣法的效力優先於法律規定，故此現象合乎法律要求
  - label: C
    content: 社會大多數人重視家庭倫理，認為家庭是社會規範的基礎
  - label: D
    content: 社會傳統風俗習慣形塑了人們的行為，其影響比法律更強
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 中國大陸雖然簽署了《聯合國人權公約》，但仍不時出現侵犯人權的事件，例如香港反送中運動、新疆再教育集中營等，各國際性政府組織（IGO）都未能對中國大陸採取實際的制裁行動。請問上述事件顯示聯合國面臨下列何項困境？
  options:
  - label: A
    content: 有時國際性政府組織的規則缺乏約束力和有效的監督，造成違反規則的情况出現
  - label: B
    content: NGO或IGO可能會面臨侵犯國家主權問題，上述人權條約有侵犯國家主權疑慮
  - label: C
    content: 911事件發生後，美國需要中國大陸加入反恐行列，因此默許中國大陸違反公約
  - label: D
    content: 中國大陸進行改革開放政策後，經貿實力大增，在聯合國的影響力已經超越美國
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 德國政府通過新法案禁止「性傾向扭轉治療」（conversion therapy）。這項療法強迫跨性別或同性戀者轉變為異性戀者。德國衛生部長表示：「同性戀不是一種疾病，因而『治療』一詞具誤導性。」而據估計德國一年約有1000起「再教育」同性戀者案例。立法完成後，從事扭轉治療的人將被判處1年以下刑期或3萬歐元以下罰金；提供或宣傳扭轉治療的人也會被處以罰金。根據上文，請問以下敘述何者正確？
  options:
  - label: A
    content: 同性戀為少數群體，故國家限制扭轉治療業者的工作權不具公益性
  - label: B
    content: 性傾向扭轉治療有利於發展自我認同，是一種代價最低的社會控制
  - label: C
    content: 新法案針對提供或宣傳扭轉治療的人處以罰金，屬於正向金錢誘因
  - label: D
    content: 該法案體現國家公權力用社會控制來改變不利部分族群的社會規範
- id: doc_110_新竹_竹東_社會_公民與社會_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 右圖(2)為張三跟李四因借還錢方式而發生爭執的情形，在法律解釋與適用時，請問張三的行為是否符合誠實信用原則？
  options:
  - label: A
    content: 符合，硬幣也是合法通用的貨幣
  - label: B
    content: 符合，借多少還多少合乎明確性
  - label: C
    content: 不符合，因不知袋中裝多少錢幣
  - label: D
    content: 不符合，還款方式造成李四困擾
