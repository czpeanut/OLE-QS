  stem: 環保人士為了反對國光石化的開發案，提出「全民來認股，守護濁水溪」的認股連署活動。邀請人民以每股119元／平方公尺，向國有財產局購買國光石化預定地。他們訴求的內容為：「彰化海岸潮間帶是無可取代的生態系，餵養眾生萬物，包括珍貴的中華白海豚，也包括了你和我。八輕國光石化填海造陸，將對潮間帶生態造成無可挽回的浩劫。日以繼夜排放毒菸的八輕，也將窒息我們的咽喉，甚至奪去性命。為了守護濁水溪口潮間帶生態系的完整，為了全民的健康和安全的生活環境，請您站出來，加入我們的認股行動。」請問：文章中環保人士因環境遭破壞，挺身抗議表達訴求，此為憲法保障的何種基本人權？
