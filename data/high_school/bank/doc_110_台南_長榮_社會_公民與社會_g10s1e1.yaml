questions:
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關國家構成要素「人民」、「領土」、「主權」及「政府」的敘述，何者正確？
  options:
  - label: A
    content: 主權是指對內可獨立運作，不受他國干預：對外擁有最高的權力，没有其他統治權力可與之抗衡
  - label: B
    content: 我國駐外的大使館，不是我國的領土範圍
  - label: C
    content: 居住在我國領土上的人都是屬於我國人民
  - label: D
    content: 政府是指一套法律規範與一群人員的集合體，其目的在保障人民權益
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 2015年2月，臺灣師範大學學生會及學生議會到教育部前抗議校方未依照法定程序即調整延畢生學雜費，違反教育部所定《專科以上學校學雜費收取辦法》。請問：上述學生主要是在抗議何種權利受到影響？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 社會權
  - label: C
    content: 參政權
  - label: D
    content: 文化權
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 國家認同是指個人對於國家的歸屬感，認為自己是這個國家的一分子，並進而以國家為榮的一種心理狀態。而我國民眾對國家認同受到特殊的兩岸關係所影響，請問：下列何者是我國民眾對國家認同分歧之處？
  options:
  - label: A
    content: 統獨問題
  - label: B
    content: 經濟問題
  - label: C
    content: 文化傳統
  - label: D
    content: 宗教衝突
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關國家與人民關係的敘述，何者正確？
  options:
  - label: A
    content: 國家可以統治人民，而且是對內最高的權力，因此是毫無限制的
  - label: B
    content: 國家可以統治人民，但有一定的限制
  - label: C
    content: 法律僅限制國家對人民負有一定的責任，人民無須受法治約束
  - label: D
    content: 國家應積極照顧人民，因此要極力擴張福利政策
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 美國某雜誌曾發表「百大最佳國家排名」，臺灣並未列名其中。該雜誌認為臺灣並非「國家」，故未進行評比。若考量現代國家的構成要件，此次的事件凸顯出我國目前在國際間，由於哪一項國家構成要件上的困境，而產生不被認同為國家的處境？
  options:
  - label: A
    content: 領土
  - label: B
    content: 政府
  - label: C
    content: 人民
  - label: D
    content: 主權
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《美國獨立宣言》指出：「人生而平等，享有造物主賦予的各種不可轉讓的權利，包括生命、自由和追求幸福的權利。」但實際上，其所宣示「人生而平等」的人並不包括哪些人？(甲)男人；(乙)女人；(丙)黑人；(丁)白人。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 黃岩島主權爭議由來已久，繼中菲兩國的艦艇在黃岩島周圍長期對峙，並由中華人民共和國取得島礁控制權後，菲律賓政府近來更要求Google旗下的地圖服務應刪除黃岩島的中國名稱與標示，並將島礁的名稱改為斯卡巴羅礁，使中菲兩國因南海的黃岩島問題再現爭議。請問：中菲兩國在黃岩島的爭議上，主要是針對下列何項因素？
  options:
  - label: A
    content: 領土
  - label: B
    content: 人民
  - label: C
    content: 政府
  - label: D
    content: 航道
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 目前來臺移工人數已經超過60萬，大多數來自東南亞國家，為了避免他們遭受雇主以及仲介剝削，政府加強勞動檢查等等，請問：下列何者不是保護移工的相關法令或政策？
  options:
  - label: A
    content: 《勞動基準法》保障最低薪資
  - label: B
    content: 《全民健康保險法》保障其健康權
  - label: C
    content: 在臺北車站給予伊斯蘭移工舉辦開齋節的空間
  - label: D
    content: 依照《動物保護法》將吃狗肉的移工移送法辦
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 人權理念近年不僅在全球各地宣揚，更在臺灣蓬勃發展，請問：以下有關臺灣近年來重視人權理念的具體表現，何者正確？
  options:
  - label: A
    content: 由於聯合國尚未確認臺灣的國際地位，因此臺灣退出聯合國後單方面簽署的人權條約，皆不具效力
  - label: B
    content: 臺灣於簽署《公民權利與政治權利國際公約》、《經濟、社會與文化權利國際公約》後，立即在立法院進行實質審查，完成所有對內的法定程序
  - label: C
    content: 立法院在批准兩大人權國際公約後，同時通過其施行法，藉以要求建立國家人權報告的制度，並對兩項國際公約進行必要之監控
  - label: D
    content: 1990年前後，臺灣許多企業公司及政府單位開始推動前述兩公約的再次批准運動
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 德國明鏡週刊於紀念終戰60週年的特別報導裡，討論到德國人的價值觀，發現德國人既要自由，也要安全，但是，唯獨把國家意象及自尊埋在心中。探究其因在於：德國人背負了兩次世界大戰的罪責，尤其在納粹政權的陰影下，總是有很大的壓力存在。各個集中營，如奧許維茲（Auschwitz）的猶太人屠殺，是近代世界史上無法消除的汙點。請問：上述報導描述德國人面臨下列哪一種問題？
  options:
  - label: A
    content: 鄉土認同
  - label: B
    content: 文化認同
  - label: C
    content: 民族認同
  - label: D
    content: 國家認同
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 我國生育率處於低迷不振的狀態，各地方政府紛紛祭出高額生育補助，中央也加碼將每個月的育兒津貼延長到4歲，希望藉此減輕新手爸媽負擔及鼓勵生育。請問：上述主要涉及的公民身分權利內涵為何？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 參政權
  - label: C
    content: 社會權
  - label: D
    content: 文化權
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 憲法是國家的根本大法，我國亦以《中華民國憲法》及其增修條文為立國基礎，關於我國《憲法》規範與變遷，下列敘述何者正確？
  options:
  - label: A
    content: 憲法中明定我國是民主的共和國體制，且國家主權屬於中央政府
  - label: B
    content: 為穩固二戰後中華民國在國際上的法理地位及正當性而進行修憲
  - label: C
    content: 為使憲法更符合國家政治現狀，將目前治權不及的領土範圍刪除
  - label: D
    content: 修憲後人民得定期改選行政首長與民意代表，更能落實主權在民
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列何者非我國取得公民身分的條件？
  options:
  - label: A
    content: 年滿18歲
  - label: B
    content: 未被褫奪公權
  - label: C
    content: 未受監護宣告
  - label: D
    content: 居住滿一定期間
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 中華人民共和國擔心臺灣以公民投票的方式來進行臺獨訴求，有違其對「一個中國原則」的認知與主張。請問：「一個中國」的概念主要涉及哪一個國家構成要素的爭議？
  options:
  - label: A
    content: 領土
  - label: B
    content: 政府
  - label: C
    content: 主權
  - label: D
    content: 人民
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 暑假時阿福與家人到歐洲自助旅行，當他們停留在一些大都市，如柏林、巴黎、布魯塞爾等，對迎面走來的行人，有時無法立刻分辨是哪一個國家的國民。此時如果要正確無誤的辨識對方的國籍，下列哪一種方法最正確？
  options:
  - label: A
    content: 對方使用的語言
  - label: B
    content: 對方使用的貨幣
  - label: C
    content: 對方的臉型髮色
  - label: D
    content: 對方使用的護照
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 那美克星上，王子大雄與屬下們討論，該如何建立屬於他們的王國：胖虎將軍說：「應該用武力把鄰近的肥美草原搶奪過來。小夫軍師說：「應組成分工的體系組織，以面對整個王國接踵而來的問題。」請問：胖虎跟小夫針對國家組成要素的說法，何者正確？
  options:
  - label: A
    content: 小夫意指需有人民
  - label: B
    content: 兩者皆指需有政府組織
  - label: C
    content: 胖虎意指擁有領土範圍
  - label: D
    content: 小夫意指需有獨一無二的主權
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 有史以來規模最大的全球暖化高峰會，2009年9月在美國紐約正式揭開序幕，太平洋島國馬爾地夫因為地勢低平，所以馬爾地夫總統在高峰會中呼籲世界各國正視海平面上升的危機，而日本與中國也已做出對抗暖化的承諾。請問：馬爾地夫若要繼續維持國家型態，現今最須解決的問題是什麼？
  options:
  - label: A
    content: 主權
  - label: B
    content: 政府
  - label: C
    content: 人民
  - label: D
    content: 領土
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 中華人民共和國堅持「一個中國」的原則，視我為地方政府，而非獨立的國家。道種說法，主要是涉及國家構成要素中的哪一個要素？
  options:
  - label: A
    content: 人民
  - label: B
    content: 領土
  - label: C
    content: 政府
  - label: D
    content: 主權
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 為落實聯合國「國際人權憲章」中《公民與政治權利國際公約》及《經濟社會文化權利國際公約》相關人權保障之規定，我國於2009年立法通過「兩公約」施行法，要求各級政府行使職權時，應符合相關人權保障規定，並2年內完成法令之制（訂）定、修正或廢止。兩公約及其施行法所具備的意義為何？(甲)個人有權對抗來自於國家的不合理干預及侵害；(乙)人民有權向國家爭取經濟、社會及文化等；(丙)闡明會員國國民權利，並敦促聯合國積極落實；(丁)福利人權需仰賴國家的保障，也來自於國家的賦予；(戊)公民與政治權利國際公約為人權基礎應優先適用。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 丁戊
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 國際法上對國家構成四項要素為標準做為檢視依據，我國完全符合成為一個「主權國家」，但是在國際政治現實中，我國的國家地位卻未能普遍被世界各國所承認。最主要的關鍵點是？
  options:
  - label: A
    content: 主權領土的未明確定義
  - label: B
    content: 經濟貿易的影響力不足
  - label: C
    content: 建立官方外交國數量少
  - label: D
    content: 國際社會的貢獻度太低
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 2018年11月24日舉辦的全國性公民投栗中，第13案題目為：「你是否同意，以臺灣（Taiwan）為全名申請參加所有國際運動賽事及2020年東京奥運？」此案公投凸顯我國當下必須以「中華臺北」作為代表團名稱參加國際運動賽事，而造成這個現象最根本的原因為何？
  options:
  - label: A
    content: 我國不被國際承認為主權國家，各國接受中國的「一中原則」
  - label: B
    content: 我國憲法規定存在形式與實質上落差，產生法理上代表權爭議
  - label: C
    content: 臺灣因統獨與身分認定存在差異，僅得以此名稱作為權衡之計
  - label: D
    content: 我國各政黨間及中國政府對九二共識的解讀及存在與否有爭議
- id: doc_110_台南_長榮_社會_公民與社會_g10s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 若僅依據我國《憲法增修條文》及《臺灣地區與大陸地區人民關係條例》的相關內容，並對應下表來界定「中華民國」的領土及主權，則最合理的推論為？
  options:
  - label: A
    content: 甲乙兩者皆應填入「有」
  - label: B
    content: 丙丁兩者皆應填入「無」
  - label: C
    content: 甲應填「有」，乙應填「無」
  - label: D
    content: 丙應填「有」，丁應填「無」
