  page: 1
  stem: 右圖是某國 1918 年和 2018 年人口的金字塔。觀察其人口金字塔推論其人口特徵的演變，下列哪些是正確的？(甲)人口成長系統由開放轉為封閉(乙)扶養壓力降低(丙)人口轉型進入高穩定階段(丁)性別比逐漸增加(戊)人口成長速度趨緩
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙戊
  - label: D
    content: 丙丁
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_111_台中_惠文_社會_地理_g10s2e1/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 287.3
      - 442.85
      - 564.3
      - 541.4
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C) 1918 年的人口金字塔呈現為低金字塔型，人口特徵為高出生率，約為早期擴張階段；2018 年的人口金字塔則呈現為靜止型，人口特徵為低出生率，約為低穩定階段，故(戊)可選；另外，1918 年的壯年人口比例 57 ％，低於 2018 年的 64.1 ％，可知 2018 年的扶養壓力較低，故(乙)可選。(甲)(丁)無法從此圖中準確判斷。
