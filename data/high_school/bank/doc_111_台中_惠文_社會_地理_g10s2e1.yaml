  page: 3
  stem: 聚落是人類維生的據點和安身立命的場所。鄉村是大多數聚落的最初型態，右列為四種不同自然環境：高緯地區易有暴風雪、終年高溫潮溼、終年乾燥、易有季節性的間歇性大雨。請根據自然環境排列出搭配的建築風格？
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 乙甲丁丙
  - label: C
    content: 丙甲乙丁
  - label: D
    content: 丁甲乙丙
