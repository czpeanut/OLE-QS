- id: doc_111_台中_惠文_社會_地理_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 2022 年，聯合國指出印度的人口將突破 14 億大關，於 2023 年正式超過中國，成為世界人口最多的國家，但緊接而來的便是沉重的人口壓力，學者稱為「人口爆炸」，考驗著政府如何面對人口結構的議題。請問下列哪些敘述能解釋印度的「人口爆炸」？(甲)高於人口替代水準的生育率(乙)逼近臨界值的環境負載力(丙)大於 100 的性別比(丁)大幅延時的人口倍時
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(甲)人口替代水準指人口總數長期維持不增不減的替換水準，一國若出現人口爆炸的現象，生育率會遠大於人口替代水準；(乙)環境負載力指一地提供當地人類糧食與吸收穢物的能力，一國若遇人口爆炸將可能出現糧食資源短缺問題。(丙)性別比與一地的社會文化、經濟型態的關聯較大，故不選；(丁)人口爆炸，人口倍時將縮短，故不選。
  tags:
    unit:
      code: GE-2-1-1
      book: 地理2
      chapter: 人口
      title: 人口成長與人口轉型
      std: true
    textbook: 地理2 人口成長與人口轉型
    labeled_by: agent
    label_confidence: high
