      rect:
      - 297.1
      - 52.95
      - 560.1
      - 218.1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)高緯地區易有暴風雨選→(丙)斜屋頂以利排雪；終年高溫潮溼選→(甲)干欄式建築將房舍架高，以避洪患及蛇蟲侵擾；終年乾燥選→(乙)平頂、後牆、小窗建築以避強烈的風沙及溫差；易有季節性的間歇性大雨選→(丁)騎樓（亭仔腳）可供行人遮陽避雨。
