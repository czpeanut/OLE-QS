  stem: 求$\lim_{n\rightarrow \infty} \frac{(\frac{n+1}{n})+(\frac{n+1}{n})^{2}+\cdots +(\frac{n+1}{n})^{n}}{n}$之值。（非選擇題10％：請詳列計算過程）
  group_stem: 歷史上第一次提到常數e是<u>約翰．納皮爾</u>於1618年出版的對數著作中所附錄的一張表。但是表中並沒有對常數e有任何描述，只是由e為底數計算出的一張對數表而已。後來e在對數相關研究文獻中都有被提及與應用，但一直沒有被正式定義。直到1683年瑞士數學家<u>雅各布．伯努利</u>嘗試計算$\lim_{n\rightarrow \infty} (1+\frac{1}{n})^{n}$的值，發現其極限在2與3之間，儘管當時他沒有發現這個值與常數e之間的關係，但仍被後世公認是真正發現e的數學家。但為什麼常數e會被稱為尤拉數呢？那是為了紀念致力研究常數e，並且是第一個將常數e寫進書裡的作者尤拉，而這本書是1736年所出版的<u>Mechanica</u>。 在瞭解常數e的歷史後，回答下列問題：
  answer:
  - e－1
