- id: doc_110_台北_松山_數學_數甲_g12s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 若函數f (x)，g (x)，h (x)在x＝0附近，滿足g (x) ≤ f (x) ≤ h (x)，下列選項何者正確？
  options:
  - label: A
    content: 若$\lim_{x\rightarrow 0} g(x)=\lim_{x\rightarrow 0} h(x)=4$，則$\lim_{x\rightarrow 0} f(x)=4$。
  - label: B
    content: 若$\lim_{x\rightarrow 0} g(x)=3$，$\lim_{x\rightarrow 0} h(x)=5$則 3＜$\lim_{x\rightarrow 0}$f (x)＜5。
  - label: C
    content: 若f (－1 )＝3，f (1)＝5，則3＜f (0)＜5。
  - label: D
    content: 若f (－1 )＝3，f (1)＝5且f (c)＝4，則－1＜c＜1。
  - label: E
    content: 若f (－1 )＝3，f (1)＝5，則至少有一實數c滿足－1＜c＜1且f (c)＝4。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：若，則由$\lim_{x\rightarrow 0}$g (x)＝$\lim_{x\rightarrow 0}$h (x)＝4，則由夾擠定理知$\lim_{x\rightarrow 0}$f (x)＝4。 (B) ×：舉反例，令g (x)＝$x^{2}$＋3，f (x)＝－$7x^{2}$＋5，h (x)＝－$x^{2}$＋5 在區間 (－$\frac{1}{2}$ , $\frac{1}{2}$ ) 中，g (x) ≤ f (x) ≤ h (x)，且$\lim_{x\rightarrow 0}$g (x)＝3，$\lim_{x\rightarrow 0}$h (x)＝5，但$\lim_{x\rightarrow 0}$f (x)＝5。 (C) ×：舉反例，令f (x)＝－$2x^{2}$＋x＋6，則f (－1 )＝3，f (1)＝5，但f (0)＝6。 (D) ×：舉反例，令f (x)＝－$\frac{2}{3}x^{2}$＋x＋$\frac{14}{3}$，則f (－1)＝3，f (1)＝5，且f (2)＝4，但2不介於－1與1之間。 (E) ×：舉反例，令f (x)＝$\frac{4x+1}{x}$，則f (－1 )＝3，f (1)＝5，但沒有實數c滿足－1＜c＜1且f (c)＝4。 故選(A)。
