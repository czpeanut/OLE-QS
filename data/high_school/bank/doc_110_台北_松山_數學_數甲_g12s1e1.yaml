- id: doc_110_台北_松山_數學_數甲_g12s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設r，x$\in$R，下列選項何者正確？
  options:
  - label: A
    content: 若數列〈$r^{n}$〉為收斂數列，則－1＜r ≤ 1
  - label: B
    content: 若數列〈$r^{n}$〉及〈$x^{n}$〉皆為收斂數列，則〈$r^{n}$．$x^{n}$〉為收斂數列
  - label: C
    content: 若數列〈$r^{n}$〉及〈$x^{n}$〉皆為發散數列，則〈$r^{n}$．$x^{n}$〉為發散數列
  - label: D
    content: 若數列〈x ( x－2 )$^{n}$〉為收斂數列，則1＜x ≤ 3
  - label: E
    content: 若等比數列〈x ( x－2 )$^{n}$〉為收斂數列，則1＜x ≤ 3，x≠2
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：無窮數列〈$r^{n}$〉收斂的充要條件是－1＜r ≤ 1。 (B) ○：若數列〈$r^{n}$〉及〈$x^{n}$〉皆為收斂數列，則－1＜r ≤ 1，－1＜x ≤ 1， 故－1＜rx ≤ 1，於是〈$r^{n}$．$x^{n}$〉（即〈( rx )$^{n}$〉）亦為收斂數列。 (C) ×：舉反例，令$r^{n}$＝(－1 )$^{n}$＝$x^{n}$，則〈$r^{n}$〉及〈$x^{n}$〉皆為發散數列，但$r^{n}$．$x^{n}$＝(－1 )$^{2n}$＝1，於是〈$r^{n}$．$x^{n}$〉為收斂數列。 (D) ×：若數列〈( x ( x－2 )$^{n}$〉為收斂數列，則x＝0或－1＜x－2 ≤ 1，即x＝0或1＜x ≤ 3。 (E) ○：若等比數列〈( x ( x－2 )$^{n}$〉為收斂數列，則$\begin{cases}x\neq 0 \\ -1<x-2\leq 1 , x-2\neq 0\end{cases}$ ⇒ $\begin{cases}x\neq 0 \\ 1<x\leq 3,x\neq 2\end{cases}$ ⇒ 1＜x ≤ 3，x≠2。 故選(A)(B)(E)。
