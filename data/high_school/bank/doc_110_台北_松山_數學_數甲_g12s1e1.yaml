- id: doc_110_台北_松山_數學_數甲_g12s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 已知多項式函數f (x)＝$ax^{n}$，( n ≥ 2 ) 是凹口向下的函數，下列選項何者正確？
  options:
  - label: A
    content: 函數f (x)＝$ax^{n}$ 為偶函數
  - label: B
    content: 函數f (x)＝$ax^{n}$ 的反函數不存在
  - label: C
    content: 函數g (x)＝$ax^{n＋1}$ 的圖形對稱於原點
  - label: D
    content: 函數g (x)＝$ax^{n＋1 }$的圖形在 x＞0 時凹口向上
  - label: E
    content: 函數h (x)＝$log_{n}$ x 的反函數不存在
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 因多項式函數f (x)＝$ax^{n}$ ( n ≥ 2 ) 的圖形凹口向下，故a＜0，n為偶數。 （事實上，f'(x)＝$nax^{n－1}$，f'' (x)＝n ( n－1 ) $ax^{n－2}$， 因f (x)＝$ax^{n}$的圖形凹口向下，故n ( n－1 ) $ax^{n－2}$恆小於0，所以a＜0，且n為偶數。） (A) ○：f (－x )＝a (－x )$^{n}$＝$ax^{n}$＝f (x)，故f (x) 是偶函數。 (B) ○：f (x) 不是一對一函數，故f (x) 的反函數不存在。 (C) ○：g (－x )＝a (－x )$^{n＋1}$＝－$ax^{n＋1}$＝－g (x)，故g (x)的圖形對稱於原點。 (D) ×：因a＜0，故g (x) 的圖形由左往右下降，且原點為對稱中心，當x＜0時，凹口向上；當x＞0時，凹口向下。 （事實上，g' (x)＝( n＋1 ) $ax^{n}$，g'' (x)＝n ( x＋1 ) $ax^{n－1}$。當x＞0時，g''(x)＜0，此時，其圖形凹口向下。） (E) ×：h (x)＝$log_{n}$ x為一對一函數，故其反函數存在，其反函數$h^{－1}$ (x)＝$n^{x}$。 故選(A)(B)(C)。
