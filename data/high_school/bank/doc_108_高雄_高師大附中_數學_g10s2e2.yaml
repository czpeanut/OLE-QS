- id: doc_108_高雄_高師大附中_數學_g10s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: '某肥皂廠商推出一種新產品，在上市前以不同的單價 X（單位：十元）調查市場的需求量 Y（單位：萬盒）。調查結果如右表，下列敘述何者正確？

    | X（十元） | 8 | 9 | 10 | 11 | 12 |

    | --- | --- | --- | --- | --- | --- |

    | Y（萬盒） | 11 | 12 | 10 | 8 | 9 |'
  options:
  - label: A
    content: X 的變異數為 2
  - label: B
    content: X 和 Y 的相關係數為 0.8
  - label: C
    content: Y 對 X 的迴歸直線斜率為 0.8
  - label: D
    content: Y 對 X 的迴歸直線通過點（10，10）
  - label: E
    content: 若單價定為 150 元，預估市場的需求量有 6 萬盒
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：μ$_{X}$＝10 ⇒ X 的變異數為$\sigma _{X}^{2}=\frac{1}{5} 〔 (-2)^{2}+(-1)^{2}+0^{2}+1^{2}+2^{2}〕$＝$\frac{1}{5}\times 10$＝2

    (B) ╳：μ$_{Y}$＝10 ⇒ Y 的變異數為$\sigma _{Y}^{2}=\frac{1}{5} 〔1^{2}+2^{2}+0^{2}+(-2)^{2}+(-1)^{2}〕$＝$\frac{1}{5}\times 10$＝2

    故 X 與 Y 的相關係數為 r＝$\frac{(-2)\times 1+(-1)\times 2+0\times 0+1\times (-2)+2\times (-1)}{\sqrt{10}\times \sqrt{10}}$＝$\frac{-8}{10}$＝－0.8

    (C) ╳：Y 對 X 的迴歸直線斜率為$r\times \frac{\sigma _{Y}}{\sigma _{X}}=-0.8\times \frac{\sqrt{2}}{\sqrt{2}}=-0.8$

    (D) ○：Y 對 X 的迴歸直線必通過（μ$_{X}$，μ$_{Y}$）＝（10，10）

    (E) ○：Y 對 X 的迴歸直線方程式為 Y－10＝－0.8（X－10）

    X＝15 代入得 Y＝－0.8×5＋10＝6

    故單價定為 150 元時，預估市場的需求量有 6 萬盒

    故選(A)(D)(E)'
