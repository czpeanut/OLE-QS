  stem: '西元 1897 年，<u>美國</u>物理學家<u>多貝爾</u>教授提出多貝爾定律，說明環境溫度（在某個範圍內）與某種蟋蟀叫聲頻率的關係。為了驗證這個定律，<u>小明</u>以 X 表示當時的環境溫度（攝氏），以 Y 表示叫聲頻率，記錄一組二維數據，並計算出平均數μ$_{X}$＝20，μ$_{Y}$＝110，標準差σ$_{X}$＝7，σ$_{Y}$＝49，相關係數 r＝0.95。試求：

