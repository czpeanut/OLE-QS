  type: multiple
  page: 1
  stem: 有一種細菌，每隔一個小時死亡 2 隻，剩下的分別分裂成 2 隻，設原有 5 隻細菌，令 n 個小時後的細菌數量為 $a_{n}$，且$b_{n}=a_{n+1}-a_{n}$，n 為正整數。下列敘述何者正確？
  options:
  - label: A
    content: $a_{1}$＝6
  - label: B
    content: $b_{3}$＝8
  - label: C
    content: 數列〈 $a_{n}$ 〉為等差數列
  - label: D
    content: 數列〈 $b_{n}$ 〉為等比數列
  - label: E
    content: $a_{n}$－$b_{n}$＝4，n 為正整數
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '依題意得$\begin{cases}a_{0}=5 \\ a_{n}=2 (a_{n-1}-2) , n\geq 1\end{cases}$

    $b_{n}$＝$a_{n+1}-a_{n}$＝$2a_{n}$－4－$a_{n}$＝$a_{n}$－4，n 為正整數

    (A) ○：$a_{1}$＝2（5－2）＝6

    (B) ○：$a_{2}$＝2（6－2）＝8，$a_{3}$＝2（8－2）＝12

    故 $b_{3}$＝$a_{3}$－4＝8

    (C) ╳：$a_{1}$＝6，$a_{2}$＝8，$a_{3}$＝12，非等差數列

    (D) ○：因$a_{n+1}-4=2 (a_{n}-4)$，n ≥ 1

    得$b_{n+1}=2b_{n}$，n ≥ 1，故〈 $b_{n}$ 〉為等比數列

    (E) ○：$b_{n}$＝$a_{n}$－4 ⇒ $a_{n}$－$b_{n}$＝4，n 為正整數

    故選(A)(B)(D)(E)'
