  stem: 明朝中期之前，朝廷一派人士看待澎湖的視角如下：「夫彭湖遠在海外，去泉二千餘里。其山迂迴，有三十六嶼，羅列如排衙。然內澳可容千艘，又周遭平山為障，止一隘口，進不得方舟。令賊得先據，所謂一人守險，千人不能過者也。矧山水多礁，風信不常，吾之戰艦難久泊矣；而曰可以攻者否也。往民居恃險為不軌，乃徙而虛其地。今不可以民實之，明矣。」據引文可知，反對朝廷治理澎湖乃出於哪一要素？
