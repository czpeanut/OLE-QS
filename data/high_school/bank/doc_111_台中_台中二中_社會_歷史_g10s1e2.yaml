  stem: 1895年，巡撫唐景崧的「臺民布告」如下：「……紳民復乞援於英國……又求唐撫帥電奏，懇由總理各國事務衙門商請俄法德三大國併阻割臺……今已無天可籲，無人肯援。臺民惟有自主，推擁賢者，權攝臺政。事平之後，當再請命中國，作何辦理。……如肯認臺灣自立，公同衛助，所有臺灣金礦、煤礦以及可墾田可建屋之地，一概租與開闢，均沾利益。考公法：讓地為紳士不允，其約遂廢；海邦有案可援。如各國仗義公斷，能以臺灣歸還中國，臺民亦願以臺灣所有利益報之。」根據上文可知臺灣民主國成立的訴求為何？
