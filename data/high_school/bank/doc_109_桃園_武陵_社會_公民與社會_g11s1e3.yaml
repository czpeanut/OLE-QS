  stem: 每年暑假期間都會有許多學生打工賺取生活費用，因此勞動部都會針對飲料店、加油站、便利商店等熱門打工行業，就工資、工時、休息、例休假等規定啟動專案勞檢。而2020年的暑假，又因新冠肺炎疫情的影響，相較全職勞工較為弱勢的部分工時勞工，可能會優先被減班或解僱。有關上文之描述，下列敘述何者正確？
  options:
  - label: A
    content: 工讀生由於打工期間短，不須遵守《勞動基準法》規定
  - label: B
    content: 工讀生每日工時不得超過8小時，薪水僅得領最低薪資
  - label: C
    content: 勞動部的專案勞檢目的為維持契約正義、避免資方剝削
  - label: D
    content: 因疫情導致勞動市場出現供不應求，迫使工讀生被減班
  tags:
    unit:
      code: CI-2-6-2
      book: 公民與社會2 正義與法治
      chapter: 生活中的勞動參與
      title: 勞動法規
      std: true
    textbook: 公民與社會2 正義與法治 勞動法規
    labeled_by: agent
    label_confidence: high
    label_note: 錯字：「敵動專案勞檢」
    fixed_by: agent
    fix_note: （人工修正：修正題幹錯字「敵動」為「啟動」並補齊解答與解析）
  explanation: (A)誤，工讀生亦受《勞基法》保障；(B)誤，工讀生依法得領取高於最低工資之薪資，亦得依法加班；(C)正，專案勞檢旨在督促資方遵守勞動法令、維持契約正義並防止剝削；(D)誤，疫情使勞動市場出現「供過於求」（失業/減班）。故選(C)。
  answer_status: ai_generated
  answer_source: agent
  answer:
  - C
