  stem: 學者指出：「贌社源自荷蘭時代，鄭氏與清朝都有延續推行，對於臺灣統治者的財政穩定頗有助益。未實施贌社之前，收購鹿製品的商人會彼此競爭，原住民便可把鹿製品賣給出價最高者。實施贌社後，獨占權讓商人可以漫天要價，原住民因而生活日趨困苦，造成原住民課稅負擔愈來愈沉重，加上承包商為獲取利潤而進行的剝削，讓原住民面臨雞、犬、牛、豕、布縷、麻菽悉為社商所有的慘況。」這位學者欲說明贌社制度
