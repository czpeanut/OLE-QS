  group_stem: '生活諺語創作，請參考以下範例。 範例： 在日本無以為生的山下志暉一家人來到臺灣，希望定居發大財。起初，鄰居惠婷還因「人插花，伊插草；人抱嬰，伊抱狗」的異文化衝擊產生新鮮感，對他照顧有加。某次，志暉因水土不服向惠婷尋求建議，惠婷告訴他：「田頭田尾土地公」，要在臺灣安居樂業，最好拜個土地公。但因志暉是基督徒，沒有接受建議，於是惠婷惱羞成怒，到處以「日本人有禮無禮」等詞語惡意攻擊他，鄰居關係完全破裂。

    下列是跟臺灣生活緊密相關的諺語，請參考以下諺語，至少挑選其中三項為元素，創作一段100字左右的小故事，書寫時請將諺語「 」註明，內文須語意通暢。不須訂題目。 1.「唐山過臺灣，心肝結歸丸」（唐山：大陸；結歸九：揪在一起）

    2.「唐山出虎，臺灣出番」（出：有）

    3.「紅杮上樹頭，羅漢腳目屎流」（目屎：眼淚）

    4.「少年若無一時憨，路邊那有有應公」（那有：怎麼會有）

    5.「廍若動，阮的吃穿不輸好額人」（阮：我；好額人：有錢人）

    6.「輸人不輸陣，輸陣歹看面」（陣：團體人數；歹看面：沒面子）

    7.「死查甫死一房，死查某死一人」（查甫：男人；查某：女人）

    8.「第一憨，種甘蔗給會社磅」

    9.「有唐山公，無唐山媽」'
