  section: 1
  number: 1
  type: single
  page: 1
  stem: 在林爽文事件後，清朝政府為了加強對丘陵地帶的管控，在丘陵地與高山間劃定一條土牛線，禁止漢人越界，並在沿線的關隘之處設置隘寮，由「屯丁」把守。「屯丁」相當於山地警察，全由平埔族男丁擔任。官方授與「屯丁」火銃為武裝，薪資為官方授與之養膳埔地。因駐屯地遠離祖居地，使得族群離散。另外，因養膳埔地和駐屯地區不常在一起，屯丁無法親自耕種，只得交由土官租與漢人，收取地租，但常因土官中飽私囊而難以實惠，只好將養膳埔地賣斷。請問：下列關於清朝屯丁制度的說明何者正確？
  options:
  - label: A
    content: 顯示清朝對平埔族的信任甚於漢人
  - label: B
    content: 平埔族因屯丁制度使族群永續生存
  - label: C
    content: 養膳埔地使屯丁生活獲得實質改善
  - label: D
    content: 屯丁制度使平埔族避免土地被侵奪
  answer:
  - A
