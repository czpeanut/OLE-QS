  group_stem: ※閱讀下列引文，回答問題： 兩星期前，臺師大戴寶村教授來史博館演講，講題是「馬偕在臺灣的宣教、教育與醫療」。總結時，他提到淡水鎮為感懷馬偕對臺灣的貢獻，現已設置「馬偕街」和「馬營日」，他生前活動的許多地點，都已成為淡水重要文化資産。 每到假日，淡水遊人如織。然而其中有多少是來看古蹟探索歷史？戴教授說，他曾在淡水街上，馬偕雕像前不遠，偶遇一位女學生，她一面吃東西，一面指著雕像，不經意問旁邊同學：「那個黑鬚的雕像是誰？」這位大學生已經在淡水，只差幾步，就可以跟馬偕在淡水的這段歷史聯結在一起了，終究，還是咫尺天涯，歷史感的闌珊或闕如，應該是她和「寧願燒盡，不願銹壞」的馬偕失之交臂的原因之一吧。 歷史感顯現一個人看待時間的態度，以及過去事物對他的意義。有歷史感的人會展現一種渴望與古今存在事物總體相互聯結的精神，因此他必然擁有一個較常人更具力量的內在《羅馬帝國衰亡史》的作者吉朋在自傳裡，描寫他在羅馬旅行，有一天坐在卡庇多神殿山的廢墟上沉思，神殿裡忽然傳來赤腳僧的晚禱聲，他的歷史感油然而生，心中首度浮現探索這座城市衰亡史的想法。 歷史感不存在於文字、文物或建築中，而是存在讀者或觀者的心中。最近，因為教育部召開高中歷史教料書課綱修訂會議，引起許多有關歷史教學內容和比例的討論，這樣的討論固有其意義，但是追根究柢，如何培養學生的歷史感，應該更是歷史教育的核心。
