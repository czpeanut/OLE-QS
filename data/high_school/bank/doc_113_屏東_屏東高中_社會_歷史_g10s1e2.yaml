  answer_status: verified
  answer_source: answer_key
  explanation: '日治時期引進格林威治標準時間，1910 年代初期完成全臺報時系統，公私機構皆依照標準時間作息，養成守時的習慣，因此答案為(A)。(B)(C)與時間觀念無關。(D)當時的機械鐘錶非常昂貴，鐘錶行不可能普遍出現。

    15.1930 年代日本軍國主義氣氛瀰漫，右派軍部掌控政府當局，對人民集會、結社與言論管控更趨嚴格。1931 年起，臺灣總督府開始嚴加取締人民的政治活動，許多偏左團體逐漸面臨打擊而結束，(C)為正解。(A)日臺民眾的差別待遇一直存在。(B)總督府僅於 1935 年舉行過一次街庄協議會員及州、市會議員半數民選，並未真正讓臺灣人地方自治。(D)左派團體受到總督府強行打壓解散，並非自行分裂消散。

    16.林獻堂初發起「《六三法》撤廢運動」時，部分人士認為此舉有響應總督府同化政策之嫌，林呈祿等人則認為同化主義將會抹煞臺灣的獨特性，加以受到梁啟超的啟發，轉而主張殖民地自治，改以設置臺灣議會為訴求，因此答案為(D)。(A)無論《六三法》或《三一法》，皆無法滿足臺灣人民的訴求。(B)日本政府並未對請願學生展開鎮壓，且「《六三法》撤廢運動」亦是溫和的抗議路線。(C)設置議會的目的在約束總督職權，追求臺灣地方自治。

    17.(C) 1915 年噍吧哖事件為日治時期規模最大的民變，總督府以優勢的武力鎮壓後，漢人武裝抗日也至此告終。(A) 1902 年林少貓遭突擊殺害。(B) 1912 ～ 1913 年羅福星領導的抗日事件。(D) 1930 年的原住民抗日。

    18.從聲明可以看出，幾位創立臺灣文化協會的人士因內部分裂而決定脫離，可推知為 1927 年蔣渭水、林獻堂等人所發表，之後成立的組織為(A)臺灣民眾黨。(B)原臺灣文化協會從此被稱為「新文協」。(C) 1926 年簡吉所成立。(D)林獻堂、蔡培火於 1930 年退出臺灣民眾黨後另成立的組織。

    19.(甲) 1949 年；(乙) 1958 年；(丙) 1950 ～ 1953 年；(丁) 1955 年，因此時間順序為(D)(甲)(丙)(丁)(乙)。

    20.由於《六三法》使臺灣被置於特殊法域，不受日本憲法保障，因此林獻堂等人籌組「臺灣同化會」的目的，即是要求日本取消對臺的特殊統治，(C)主張臺灣人民應享有與日本國民相同的待遇。(A)田健治郎於 1919 年任職。(B) 1936 年底的皇民化運動內容。(D)此訴求與史實不符。

    21.從林爽文「黨羽不過漳州一處之人，較之粵東、泉州義勇百姓，僅止三分之一」、「以臺灣之人，攻臺灣之賊」為事半功倍，可知清朝平定林爽文事件的策略為利用族群分化，達到「以臺制臺」效果，(A)為正解。(B)與題文敘述不符。(C)此時臺灣尚未有臺勇、團練，題文所述為「義勇百姓」。(D)林爽文事件起因為官府查緝天地會，並非族群械鬥。

    22.這份國際文件要求日本放棄臺灣及澎湖群島的各項權利，卻未提及臺、澎歸屬，可推知為 1915 年的《舊金山和約》，即《對日和平條約》，由於「未提及臺、澎歸屬」，因此造成臺灣地位未定的爭議，(D)為正解。

    23.(A)(C)(D)三者為偏左或左派團體，於 1931 年即遭總督府強制解散，僅(B)臺灣地方自治聯盟於 1937 年才自行解散。

    24.(A) 1919 ～ 1936 年實施內地延長主義政策，改派文官總督來臺。

    25.資料甲以國防戰略角度建議留下臺灣，為施琅的上疏；資料乙在外患暫平後，強調臺灣地位之重要，應為沈葆楨的上奏；資料丙建議擴充臺灣財源，使「臺地之財，足供臺地之用」，故為清丈減賦的劉銘傳。正確答案為(A)。

    26.此次民變作亂三年，亂事主要區域在臺灣中南部，由於提到「臺勇」鼎力協助，因此可推知為(C)戴潮春事件。(A)(B)林爽文事件後才有臺勇。(D)亂事地點在彰化，數日即遭平定。

    27.圖中的學生被警察以繩子捆綁，並頭戴草籠遊街示眾，從服裝上可判斷此時為日治時期，因此正確答案為(B)。

    28.清初在「為防臺而治臺」的消極治理下，禁止臺地築城以避免城池成為亂黨堡壘，但此禁令在(D)林爽文事件後廢除。

    29.臺灣文化協會分裂是因為 1927 年由主張階級鬥爭的連溫卿取得主導權，臺灣民眾黨分裂則是因為蔣渭水支持農工動而漸趨激進，因此答案為(A)。

    30.自 1971 年臺灣退出聯合國後，臺灣的邦交國家數目即開始下降，正確答案為(B)。(A)石油危機爆發時，正值文革期間的中國無力以經濟援助其他國家。(C)臺灣從未宣布經濟「關稅壁壘」，與史實不符。(D)務實外交為 1988 年李登輝時期，其作法是積極參與各類國際組織，爭取與各國的實質外交往來。

    31.黃呈聰認為稱「臺灣人」比「本島人」好，更容易讓所有人明白「臺灣人」的存在，這種強調「臺灣人」與內地人、沖繩人不同的主體意識，最可能為臺灣議會設置請願運動時期的主張，(D)為正解。(A)臺灣共產黨為非法組織，只能低調發展，無所謂活躍期。(B)臺灣同化會主張臺日同等待遇，不會強調臺灣的特殊性。(C)題文並無激烈抗爭之意。

    32.從標題的「初選舉」與「臺北市會議員當選者」，可推知為(C) 1935 年臺灣歷史上第一次選舉。

    33.資料中的「我們」在離開澎湖後，「預計」到臺灣某地興築一城，從當時的建築只有砂與澎湖的石材來看，這個「我們」最可能為曾短暫占據澎湖的荷蘭人，答案為(B)。(A)濱田彌兵衛於日本鎖國政策前已居住在臺灣。(C)(D)來臺之前，並未以澎湖為據點，來臺後也未興築新城。

    34.詩名有「寄二林的同志」，可推知此新詩乃為 1925 年的二林蔗農事件發聲，(A)為正解。

    35.(A)日治時期臺灣第一大港為基隆港。(C)經濟大恐慌為 1930 年代，且臺灣的西部縱貫公路於 1916 年已建成標準道路。(D)臺灣於劉銘傳時期已開始鋪設海底電纜線，串連臺灣與福建的電報通訊。

    36.從「二州」（天興州、萬年州）與「南北二路」，可得知為(B)鄭經時期的行政區劃。

    37.(A)從「事平之後，當再請命中朝」可知臺灣人仍期待將來能重回清朝統治。(C)檄文中並無與日方政府談判的想法。(D)純為抗拒日本接收，與西方的革命風潮無關。

    38.從年代與臺北地方法院檢察長的批評內容來看，此為 1923 年的「治警事件」，當時讓蔣渭水入獄的政治運動為「臺灣議會設置請願運動」，故答案為(C)。(A)廢除六三法運動被視為認同日本的同化政策，與資料二的批評不符。(B)此舉不致於犯法入獄。(D) 1935 年才有選舉。

    39.(A)臺灣民眾黨並未與臺灣共產黨合併。(B)臺灣民眾黨解散之前，林獻堂等人已脫離另組臺灣地方自治聯盟。(D)「治警事件」發生於 1923 年，與題文敘述無關。

    40.邵友濂時期停止了大部分的建設，最主要的原因是(A)經費不足，難以持續。

    41.辜顯榮為受到臺灣總督府重用的地方士紳，支持與響應總督府的各項政策，因此不可能支持議會設置請願運動及協助各社會運動團體，答案為(C)。

    42.從答辯書中指出「農民赤貧如洗」、勞動者「慘澹的生活」，可見其加入組織抗爭的主要原因為製糖會社對農民與勞動者(D)經濟的剝削。

    43.(B)第二階段的抗日已無臺灣民主國，此時為各地區游擊性的武裝抗日行動。(C)三段警備制於 1897 年實施，但無法有效壓制各地的游擊性行動而宣告失敗。(D)西來庵事件後，總督府才開始在臺灣實施宗教調查。

    44.從鄭經提到臺灣「東連日本，南蹴呂宋，人民輻輳，商賈流通，萬世之基，已立於不拔」，可得知其最大的談判籌碼為臺灣的海外貿易優勢，答案為(D)。(A)與史實不符。(B)(C)此雖是鄭經所說，但並非其談判的優勢。

    45.安南政權與日本於此時並未向清稱臣朝貢，琉球雖已成為清帝國藩屬，但並非鄭經引用的國家。鄭經在與康熙談判時，多次說明願採(B)朝鮮模式，原因是朝鮮王朝雖然向清稱臣，但仍維持明朝的冠服制度，並未薙髮。

    46.(A)屏東車城、(B)澎湖、(E)臺中市，為正確答案。(C)林爽文事件。(D)位於臺南，為沈葆楨在日軍侵臺後所建。

    47.(A)《中美關係白皮書》將國共戰爭的失敗歸咎於國民黨的統治失當，使中美關係降到谷底。(D)應是簽訂《中美共同防禦條約》，《臺灣關係法》係美國與臺灣政權斷交，僅與臺灣保持非官方關係。

    48.1935 年臺灣的首次地方選舉，當時對選舉人的限制條件有(A)(B)兩項。(C)日本婦女於第二次世界大戰後才獲得投票權。(D)住滿六個月即可。(E)繳稅金額達五圓以上，非五萬圓。

    49.(A)鄭經將天興縣、萬年縣，改為天興州、萬年州。(B)從康熙到乾隆，臺灣的行政區域土地面積變化不大，是因此時土地開發限於臺灣西部，並以土牛界線與山區及東部隔絕。'
