  stem: '在鄭氏政權與清帝國對抗的過程中，除了透過武力的強硬手段，也有過多次和談，以下是某次和談中雙方的觀點。

    鄭經：「況今東寧（臺灣）遠在海外，非屬版圖之中，東連日本，南蹴呂宋，人民輻輳，商賈流通，萬世之基，已立於不拔。不佞（指鄭經）亦何慕於爵號，何貪於疆土，而為此削髮之舉哉？」

    康熙：「鄭經乃中國之人，若因居住臺灣不行薙髮，則歸順悃誠。以何為據？……果尊制薙髮歸順，高爵厚祿，朕不惜封賞。即臺灣之地，亦從彼意，允其居住。庶幾恩訖遐方，兵民樂業，干戈不用，海疆安。稱朕奉天愛民，綏懷遠人至意。」

    從鄭經方的主張來看，提出不薙髮的要求，可能是因掌握有何種談判上的優勢？'
  options:
  - label: A
