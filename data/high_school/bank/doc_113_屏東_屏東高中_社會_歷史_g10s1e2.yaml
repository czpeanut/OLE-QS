- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 顧祖禹《讀史方輿紀要》寫到：「彭湖嶼……明洪武五年，湯信國經略海上，以島民叛服難信，議徙之近郭。二十一年，盡徙嶼民，廢巡檢而墟其地」請問此政策施行背後的理由最有可能是
  options:
  - label: A
    content: 島上原住民剽悍難以控制，統治該地負擔甚重
  - label: B
    content: 巡檢司為元朝設置的軍事重鎮，是威脅明帝國的海外反抗組織
  - label: C
    content: 荷蘭人屢次入侵該地，利用此據點發展日本、中國東南沿海的走私貿易
  - label: D
    content: 明帝國建立初期頒行海禁政策，加以該地地處邊陲，國家無法有效控制，而採徙民墟地政策
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「廢巡檢而墟其地」一句，可推斷此地「彭湖嶼」即澎湖，雖然湯信國以「島民叛服難信」為由「墟澎」，但從其「經略海上」的經歷來看，更可能的原因為(D)。(A)澎湖島上並沒有原住民，不致於使國家負擔過重。(B)澎湖設巡檢司即為明帝國領土，並非海外反抗組織。(C)洪武年間，荷蘭人尚未入侵澎湖。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 清代某次臺灣民變，派遣南澳總兵藍廷珍奉命平亂，堂弟藍鼎元以幕僚身分一同前來，亂平後百餘名宗族、兵員留置於屏東里港開墾，今日里港鄉玉田村的藍家古厝便是藍鼎元的後人所建。藍鼎元留下《平臺紀略》、《東征集》與《論臺灣事宜書》等作品，建議清廷積極開發臺灣、開放攜眷渡臺、半線設縣加強北部防禦兵力等。請問這場民變是
  options:
  - label: A
    content: 朱一貴事件
  - label: B
    content: 林爽文事件
  - label: C
    content: 戴潮春事件
  - label: D
    content: 施九緞事件
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從藍鼎元建議「開放攜眷渡臺」，由於雍正時曾一度放寬已在臺定居者可將大陸眷屬接引來臺，因此可推知此時為《渡臺禁令》嚴格執行的康熙年間，這場民變即為(A)朱一貴事件。(B)乾隆年間。(C)同治年間。(D)光緒年間。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「某年政府大舉搜查臺灣全島，被拘留者 41 人，被搜查且被傳訊者 11 人，僅被搜查者 12 人，僅被傳訊者 35 人，共計 99 人。事發後，當局控制臺灣一切對外通訊，街頭巷尾及公共場所皆有特務站崗，未被檢肅的請願運動成員也遭到特務跟蹤，一時全島風聲鶴唳、民心惶惶……大搜捕後，文化協會多名重要成員入獄，在領導人深陷牢獄，消息遭到封鎖，民眾因情勢不明而感到惶恐的氛圍中，第四次、第五次的請願運動連署人數大幅減少。」以上內容最有可能是在描述哪一事件？
  options:
  - label: A
    content: 噍吧哖事件
  - label: B
    content: 治警事件
  - label: C
    content: 二林蔗農事件
  - label: D
    content: 中壢事件
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣議會設置請願運動於 1921 年開始，從文中「第四次、第五次的請願運動連署人數大幅減少」來看，此事件應發生於第三次請願運動之後，即 1923 年左右，因此可推知題文所述事件為(B)治警事件。(A) 1915 年。(C) 1925 年。(D) 1977 年。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '歷史課堂上，老師要求學生以「某一場衝突」為主題作報告，學生根據探究主題找到兩則資料，都是淡水英國領事館周知在臺英國僑民的通告：

    通告一：清朝官員同意重開基隆煤務局，但該官員表示，依目前基隆的情勢，可能無法立即開始採礦作業。

    通告二：本館頃接臺北同知諭令，希望勒束英僑，暫時勿到鄉下旅行，以策安全。

    從兩則資料內容判斷，「某一場衝突」最可能是指'
  options:
  - label: A
    content: 鴉片戰爭
  - label: B
    content: 英法聯軍
  - label: C
    content: 中法戰爭
  - label: D
    content: 甲午戰爭
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從兩則資料內容判斷，此時臺灣已經開港，且此場衝突的地點可能在基隆，因此答案為(C)中法戰爭，基隆為清、法兩軍交戰的戰場。(A)(B)臺灣尚未開港，沒有英國領事館。(D)戰火未波及基隆。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 官吏敷衍、徇私，吏治不良的問題一直是清代臺灣管理上的通病。請問其原因為何？
  options:
  - label: A
    content: 清初消極治臺，行政組織與人力配置嚴重不足
  - label: B
    content: 清帝國視臺灣為邊陲地帶，並未設置監督考核的官吏
  - label: C
    content: 清廷在帝國管理上相當仰賴士紳，移墾社會的臺灣士紳多由地方豪強擔任，不僅不能協調鄰里紛爭，反而成為抗官民變的領袖
  - label: D
    content: 臺灣地處偏遠，官員與駐守部隊多選派本地人擔任
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 清初吏治不良問題嚴重，最主要原因與朝廷消極治臺的心態有關，正確答案為(A)。(B)有設置「巡視臺灣監察御史」監督考核臺灣的官吏。(C)地方豪強頗得人望，在協調鄰里紛爭上並無問題。(D)清治前期，官員與駐守部隊皆由大陸派駐來臺。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 日治時期，臺灣由總督統轄。但部分日本國會議員及學者批評總督府的《六三法》體制，究其原因係由於《六三法》導致何種結果？
  options:
  - label: A
    content: 行政、司法互相傾壓，使總督權力受限
  - label: B
    content: 總督擁有制定律令的權力，侵奪國會立法權
  - label: C
    content: 殖民地採行特殊統治，臺人無法獨立自主
  - label: D
    content: 《六三法》原為過渡性的特殊統治而訂，但直至 1920 年代皆未修正，使臺人難以被同化
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《六三法》使總督擁有行政、立法、司法與軍事大權，使國會不滿立法權被侵奪而加以批評，因此答案為(B)。(A)總督同時擁有諸多權力，不受限制。(C)「臺人無法獨立自主」本是日本殖民的目的，並非國會議員與學者批評的原因。(D) 1907 年已被《三一法》替代。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 臺灣總督府透過何種條文的制訂，以連坐責任的方式，有效掌控臺灣基層社會？
  options:
  - label: A
    content: 《匪徒刑罰令》
  - label: B
    content: 三段警備制
  - label: C
    content: 《保甲條例》
  - label: D
    content: 《六三法》
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 日治時期，總督府沿用清朝的保甲制度來協助治匪，並以「保甲連坐」來監控保甲內的民眾不與匪徒勾結，此舉有效的降低臺灣的起義風潮，答案為(C)《保甲條例》。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 「1914 年，臺中霧峰林家有鑑於臺灣中部地區並無教育臺灣人子弟的中學校，臺灣學生大多需要離鄉背井前往異地求學，因此發起募款，向政府提出成立中學校的請願，並於 1915 年設置以招收臺灣子弟為主的臺中中學校。」關於這段敘述，以下何者正確？
  options:
  - label: A
    content: 日治前期教育政策上實施差別待遇，臺灣的中學校主要招收日本學生，臺人升學不易
  - label: B
    content: 日治時期中學校僅設置於臺北、高雄兩地，造成城鄉差距，因此霧峰林家爭取中部地區亦設置中學校
  - label: C
    content: 日治時期並無在臺灣成立中學校，因此公學校學生畢業後多於日本求學
  - label: D
    content: 日治時期臺灣人主要在私塾及學堂接受漢人儒家教育，無法進入以西式教育為主的中學校，故而希望成立延續漢學傳統的中學校
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為臺中中學校設立的背景，為正解。(B)日治初期官方的中學校原僅有臺北州、臺南州各 1 所，後隨著在臺日人增多，1922 年後中學校已增為 17 所。(C)臺灣的中學校為日本人子弟就讀。(D)臺中中學校以西式教育為主，並非延續漢學傳統的學校。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 史料記載某事件如下：「臺灣巡撫令臺灣一律清丈，但負責判定土地等級的委員標準不一，同時有不少錯漏，更因隨意填寫等級引起許多不滿，因此謠言四起，激成變端……起事者有『公道大王』之稱，在各地鄉民的邀請下，出面主持『公道』，並以神靈託夢為由，率領數百人打著『索焚丈單』的口號，插著『官激民變』的大旗前往縣城。」此一事件是哪場民變？
  options:
  - label: A
    content: 朱一貴事件
  - label: B
    content: 林爽文事件
  - label: C
    content: 戴潮春事件
  - label: D
    content: 施九緞事件
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 劉銘傳來臺後，推動清丈減賦改革，但因清丈不公而引起(D)施九緞事件，此為臺灣建省後最大的民變。(A)吏治不良，官逼民反。(B)(C)與官府查緝會黨有關。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 擔任民政長官的後藤新平曾說：「殖民地行政計畫，在目前科學進步之下，必須根據生物學的原則，發展農業、工業、衛生、教育、交通、警察。如果以上各項都能夠完成，我們就可以在生存競爭中獲得保全與勝利。」請問下列哪一措施符合「生物學原則」？
  options:
  - label: A
    content: 採取「三段警備制」
  - label: B
    content: 頒布《匪徒刑罰令》
  - label: C
    content: 頒布《六三法》
  - label: D
    content: 實施「舊慣調查」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 根據生物學的原則，需要先行了解臺灣人為「何種生物」才能有效管理，因此必須實施各項調查工作，(D)為正解。
