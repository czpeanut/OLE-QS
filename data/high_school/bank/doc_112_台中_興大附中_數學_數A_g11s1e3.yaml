    $\vec{u}$在 L 上的正射影即$\vec{u}$在$\vec{v}$上之正射影＝$\frac{\vec{u} \cdot \vec{v}}{∣ \vec{v} ∣^{2}}\vec{v}$＝$\frac{15\times 1 + 5\times 3}{(\sqrt{1^{2} + 3^{2}})^{2}} (1 , 3)$

    ＝$\frac{30}{10} (1 , 3)$＝（3，9）

    ∴m＝3，n＝9

    故實數 m＋n＝12'
