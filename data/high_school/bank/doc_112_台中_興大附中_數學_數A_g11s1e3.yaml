  stem: 設 a，b 皆為實數，滿足 $a^{2}$＋$b^{2}$＋2a－4b－11＝0，若當數對（a，b）＝（x，y）時，則 3a－4b 會有最大值，試求此時 x 之值＝＿＿＿＿。
  explanation: '$a^{2}$＋$b^{2}$＋2a－4b－11＝0

    $\Rightarrow$（a＋1）$^{2}$＋（b－2）$^{2}$＝16

    由柯西不等式知

    〔（a＋1）$^{2}$＋（b－2）$^{2}$〕（$3^{2}$＋（－4）$^{2}$）$\geq$〔3（a＋1）＋（－4）（b－2）〕$^{2}$

    $\Rightarrow$16×25$\geq$（3a－4b＋11）$^{2}$

    $\Rightarrow$－20$\leq$3a－4b＋11$\leq$20

    $\Rightarrow$－31$\leq$3a－4b$\leq$9

    又 3a－4b＝9 時，$\frac{a + 1}{3}=\frac{b - 2}{- 4}$

    $\Rightarrow$－4a－4＝3b－6

    $\Rightarrow$4a＋3b＝2

    $\begin{cases}3a - 4b = 9 \\ 4a + 3b = 2\end{cases}\Rightarrowa =\frac{7}{5}$，$b =-\frac{6}{5}$

    故$x =\frac{7}{5}$'
