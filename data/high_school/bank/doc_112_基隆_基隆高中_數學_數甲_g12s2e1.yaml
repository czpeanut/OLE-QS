  stem: 奇奇麵包店將前一天未賣完的麵包 4 個（隔夜麵包），與今天現烤出的 20 個麵包混在一起販賣。小態至該店買麵包，隨機在此 24 個麵包中拿了 3 個（假設每個麵包被選取的機會均等），則小態買到的隔夜麵包個數的期望值為何？
