- id: doc_112_基隆_基隆高中_數學_數甲_g12s2e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 2
  stem: '隨機變數 X 機率分布表如右表所示。

    | x | 0 | 1 | 2 | 3 |

    | --- | --- | --- | --- | --- |

    | P（X＝x） | 0.1 | a | 0.3 | b |

    已知 X 的期望值 E（X）＝$\frac{7}{5}$，則 a＋b＝＿＿＿＿。'
  answer:
  - '0.6'
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}E (X)= 0\times 0.1 + 1\times a + 2\times 0.3 + 3\times b =\frac{7}{5}\cdots \cdots \cdots \cdots \cdots ① \\ 0.1 +a + 0.3 +b = 1 \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    整理①、②式可得$\begin{cases}a + 3b = 0.8 \\ a +b = 0.6\end{cases}\Rightarrow\begin{cases}a = 0.5 \\ b = 0.1\end{cases}$

    ∴a＋b＝0.5＋0.1＝0.6'
- id: doc_112_基隆_基隆高中_數學_數甲_g12s2e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: '已知α，β為方程式 $x^{2}$＋3x＋3＝0 的兩根，求下列各式的值。

    (1)α$^{2}$＋β$^{2}$＝＿＿＿＿。

    (2)$\frac{1}{\alpha}+\frac{1}{\beta}$＝＿＿＿＿。'
  answer:
  - (1) 3；(2)－1
  answer_status: verified
  answer_source: answer_key
  explanation: '∵α、β為方程式 $x^{2}$＋3x＋3＝0 的兩根

    ∴$\begin{cases}\alpha +\beta =- 3 \\ \alpha \beta = 3\end{cases}$

    (1)α$^{2}$＋β$^{2}$＝（α＋β）$^{2}$－2αβ＝（－3）$^{2}$－2×3＝3

    (2)$\frac{1}{\alpha}+\frac{1}{\beta}$＝$\frac{\alpha +\beta}{\alpha \beta}$＝$\frac{- 3}{3}$＝－1'
- id: doc_112_基隆_基隆高中_數學_數甲_g12s2e1_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 已知實數 a，b 滿足（3＋2i）a＋（2－2i）b＝17－2i，求（a＋b）的值為＿＿＿＿。
  answer:
  - '7'
  answer_status: verified
  answer_source: answer_key
  explanation: '（3＋2i）a＋（2－2i）b＝17－2i

    $\Rightarrow$3a＋2ai＋2b－2bi＝17－2i

    $\Rightarrow$（3a＋2b）＋（2a－2b）i＝17－2i

    $\Rightarrow\begin{cases}3a + 2b = 17 \\ 2a - 2b =- 2\end{cases}$

    $\Rightarrow\begin{cases}a = 3 \\ b = 4\end{cases}$

    ∴a＋b＝3＋4＝7'
