- id: doc_112_基隆_基隆高中_數學_數甲_g12s2e1_s2_2
  section: 2
  number: 2
  type: single
  page: 1
  stem: 重複操作一個成功機率為 p 的試驗 n 次，且每次試驗結果都是獨立的，若成功次數的期望值為 30 次，標準差為$\sqrt{20}$次，則 p 的值為何？
  options:
  - label: A
    content: $\frac{3}{5}$
  - label: B
    content: $\frac{2}{5}$
  - label: C
    content: $\frac{2}{3}$
  - label: D
    content: $\frac{1}{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '期望值為 np＝30，標準差為$\sqrt{np (1 -p)} = \sqrt{20}$

    將 np＝30 代入$\sqrt{np (1 -p)} = \sqrt{20}$得

    30（1－p）＝20

    $\Rightarrow$1－p＝$\frac{2}{3}\Rightarrow$p＝$\frac{1}{3}$

    故選(D)'
- id: doc_112_基隆_基隆高中_數學_數甲_g12s2e1_s2_3
  section: 2
  number: 3
  type: single
  page: 2
  stem: '定先宣稱他在三分線投籃的命中率至少 80％，為了證實所言不虛，他邀請嘟嘟到籃球場看他表演，在三分線投 10 球並以α＝0.05 檢定。假設隨機變數 X 的取值為定先在三分線投籃 10 次進球的總次數，則定先至少要投進幾球，嘟嘟才會接受定先的宣稱。求正確的選項為下列何者？

    （請參考以下隨機變數 X 是 n＝10，p＝0.8 的二項分布之機率分布表）

    | x | 0 | 1 | 2 | 3 | 4 | 5 |

    | --- | --- | --- | --- | --- | --- | --- |

    | p（x） | 0.000000 | 0.000004 | 0.000074 | 0.000786 | 0.005505 | 0.026424 |

    | x | 6 | 7 | 8 | 9 | 10 |  |

    | p（x） | 0.088080 | 0.201327 | 0.301990 | 0.268435 | 0.107374 |  |'
  options:
  - label: A
    content: 4 球
  - label: B
    content: 5 球
  - label: C
    content: 6 球
  - label: D
    content: 7 球
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∵P（X＜6）＝0.032793＜α＝0.05，P（X＜7）＝0.120873＞α＝0.05

    ∴至少需投進 6 球，才可接受其宣稱

    故選(C)'
- id: doc_112_基隆_基隆高中_數學_數甲_g12s2e1_s2_4
  section: 2
  number: 4
  type: single
  page: 2
  stem: 已知方程式 $x^{3}$－$3x^{2}$＋k＝0，下列哪一個 k 值會使得方程式有三個相異實根？
  options:
  - label: A
    content: －2
  - label: B
    content: '0'
  - label: C
    content: '2'
  - label: D
    content: '4'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '設 f（x）＝$x^{3}$－$3x^{2}$＋k

    令 f''（x）＝$3x^{2}$－6x＝0$\Rightarrow$x＝0 或 2

    ∵此方程式有三個相異實根

    ∴f(0)f(2)＜0$\Rightarrow$k（k－4）＜0$\Rightarrow$0＜k＜4

    故選(C)'
