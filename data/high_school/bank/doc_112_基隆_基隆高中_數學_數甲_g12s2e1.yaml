- id: doc_112_基隆_基隆高中_數學_數甲_g12s2e1_s3_6
  section: 3
  number: 6
  type: fill
  page: 3
  stem: '若以牛頓法求 f（x）＝$x^{2}$－5＝0 方程式的正根：

    步驟 1：因為 f(2)×f(3)＜0，故此正根介於 2 與 3 之間，取 $a_{1}$＝2。

    步驟 2：過 y＝f（x）上點 P（2，f(2)）＝（2，－1）作 y＝f（x）的切線。

    步驟 3：步驟 2 中的切線和 x 軸交點的 x 坐標 $a_{2}$。

    (1) 該切線方程式為 y＝mx＋n，則 m＋n＝＿＿＿＿。

    (2) 求 $a_{2}$＝＿＿＿＿。'
  answer:
  - (1)－5；(2) 2.25
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) f''（x）＝2x

    ∵f''(2)＝2×2＝4 且過點（2，－1）

    ∴切線方程式為 y－（－1）＝4（x－2）

    $\Rightarrow$y＝4x－9

    故 m＋n＝4＋（－9）＝－5

    (2)將 y＝0 代入 y＝4x－9，可得 x＝$\frac{9}{4}$＝2.25

    此時的 x 坐標即 $a_{2}$

    ∴$a_{2}$＝2.25'
