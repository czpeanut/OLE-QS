  stem: '資料一：「文藝復興的擴散，絕非單方面的接受。北方各地對從義大利傳入的新知識與藝術表現會先進行篩選，立足於自身的環境與傳統，挑選可與本地文化傳統融合的義大利文化。」

    資料二：「文藝復興雖然傳播至西班牙但卻無法盛行。可能跟西班牙較為強硬的宗教態度有關。文藝復興相較中古世紀更關注世俗活動，和強調宗教權威的立場有所牴觸。」

    下列關於資料的解讀何者正確？'
  options:
  - label: A
    content: 資料一反對傳統單向的接受觀；資料二肯定文藝復興的影響
  - label: B
    content: 資料一以宗教觀討論傳播問題；資料二以政治觀探討接受度
  - label: C
    content: 兩份資料均同意文藝復興的擴散與接受非單向而是經過篩選
  - label: D
    content: 兩份資料均否定文藝復興曾傳至義大利外，因文化差異過大
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)資料二從西班牙的例子，說明文藝復興的影響有限。(B)資料一並未提到宗教觀，資料二以宗教觀探討接受度。(C)為正解。(D)兩份資料都肯定文藝復興曾傳播至義大利以外的地方。
