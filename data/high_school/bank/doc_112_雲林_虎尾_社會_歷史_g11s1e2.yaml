  page: 11
  stem: '以下兩則資料節錄 18 世紀關於某事件的文件中的史家評論：

    資料一：人類事務的發展過程中，當一個民族必須解除和另一個民族之間的政治聯繫，並在世界各國之間依照自然法則和自然神明，取得獨立和平等的地位時，出於對人類公義的尊重，必須宣布他們不得不獨立的原因。我們認為下面這些真理是不證自明的：人人生而平等，造物主賦予他們若干不可剝奪的權利，包括生命權、自由權和追求幸福的權利。為保障這些權利，人們才在他們之間建立政府，而政府之正當權力，則來自被統治者的同意。任何形式的政府，只要破壞上述目的，人民就有權利改變或廢除它，並建立新政府；新政府賴以奠基的原則，得以組織權力的方式，都要最大可能地增進民眾的安全和幸福。

    資料二：史家認為，這場事件展示社會契約實踐的過程……宣布政府是人民所創造，權力由人民授與。

    關於此事件，下列敘述何者正確？'
  options:
