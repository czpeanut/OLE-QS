  stem: '資料一：「他晚年完成一本神學巨作，書中論述人類分屬兩座城池，一座是世俗之城，一座是上帝之城，他將這兩座城從起源到終結，對比人類的歷史，也建構出基督教的歷史觀，被後世譽為是一部基督教的歷史綱要。」

