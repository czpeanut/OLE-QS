  stem: 佩脫拉克在其詩文《祕密》中說：「我不想變成上帝，或者居住在永恆之中，或者把天地抱在懷裡。屬於人的那種光榮對我就夠了。我自己是凡人，我只要求凡人的幸福。」他的言論思想，反映他個人及時代為何？
  options:
  - label: A
    content: 反映人文主義學者的理想，此時人們追求的不再是以宗教性靈與道德為生活的唯一目標
  - label: B
    content: 反映人文主義學者鼓勵人們拋去古代神學家的作品，改以世俗角度了解基督教生活
  - label: C
    content: 此時社會以現世為主要關心議題，宗教信仰完全被忽略，甚至被拋棄
  - label: D
    content: 此時教育著重醫學、法律等實用的職業教育，呼應其世俗化的一面
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「我不想變成上帝」、「我只要求凡人的幸福」即可反映佩脫拉克的人文主義思想，答案為(A)。(B)並未拋棄古代神學家的作品，反而鼓勵人們閱讀這些作品，以從中了解單純而虔誠的基督教生活。(C)此時宗教仍具一定影響力，只是更關注現世生活。(D)文藝復興時期著重人本主義的教育，反對中古的職業教育。
