  page: 1
  stem: '資料一：「經院哲學以希臘哲學概念來理解信仰，有助於神學研究系統化，使它成為基督教的特色。雖然對古代典籍的理解有其侷限性，但仍然對後世具有參考價值。」

    資料二：「他們使用邏輯和哲學方法講授教義，但往往墨守成規或擅加解釋，他們崇尚理性不是為了求真，也不是為了科學精神。從很多角度來看，經院哲學仍然只是為了神學而服務。」

    請問下列哪一解讀最為正確？'
  options:
  - label: A
    content: 資料一為歷史事實；資料二為歷史解釋
  - label: B
    content: 資料一為歷史評論；資料二為歷史考證
  - label: C
    content: 資料一說明經院哲學的發展；資料二評論經院哲學的缺失
  - label: D
    content: 資料一肯定經院哲學的貢獻；資料二點出經院哲學的侷限
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一指出經院哲學對古代典籍的理解有其侷限性，但仍肯定其貢獻；資料二明白指出經院哲學只為神學服務的侷限性，較符合的解讀應為(D)。(A)(B)兩則資料皆屬於歷史解釋（歷史評論）。(C)資料一並未說明經院哲學的發展，而是提出其對後世的影響。
