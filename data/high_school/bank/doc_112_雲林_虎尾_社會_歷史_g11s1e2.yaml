  stem: 16 世紀時英格蘭的摩爾出版了一本《烏托邦》，描繪了一個大航海時代某個島上的理想社區：「這裡不分男女皆以務農為業，按照計畫經濟和需要來分配，財產公有，一切長官均由選舉產生，實施徹底的民主管理……。」從上述的內容推斷，為何摩爾的《烏托邦》會被教會列為禁書？
  options:
  - label: A
    content: 因為這本書是在新教的英格蘭出版
  - label: B
    content: 因為摩爾主張民主制度
  - label: C
    content: 摩爾否定了教會的價值
  - label: D
    content: 書本內容宣揚共產主義，為統治者所不喜
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)《烏托邦》的論述裡，不再以教會作為理想社區的建造想法，是對當時天主教教會強力的批評與質疑，危及教會的權威，因此才成為禁書。
