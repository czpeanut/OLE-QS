  stem: 有學者認為：「為什麼說文藝復興象徵西方從『中古』」邁向『現代』呢？文藝復興時期的人們認為羅馬滅亡有兩個因素，其一是教會體制和基督教世界觀的僵化，其二則是外族入侵。因此他們重拾古典文化，以羅馬文化為典範，發展重視人現世生活的世界觀，形成了一個不同於中世紀的新時代。」根據該學者的論述為何文藝復興會被視為轉型期？
