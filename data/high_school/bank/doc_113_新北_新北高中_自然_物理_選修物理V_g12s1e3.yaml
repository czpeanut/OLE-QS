- id: doc_113_新北_新北高中_自然_物理_選修物理V_g12s1e3_s3_29
  section: 3
  number: 29
  type: single
  page: 4
  stem: 考慮上層或下層與中間金屬層間的距離為5 mm，且兩電極間的電壓不足以使空氣游離的電蚊拍。依據文中資料，試判斷下列敘述何者正確？（4分）
  options:
  - label: A
    content: 該電蚊拍兩電極間的電壓可升高至30 kV
  - label: B
    content: 由於電蚊拍兩電極間的電壓極高，故按下開關後，馬上會有電流產生
  - label: C
    content: 閃電生成的基本原理與電蚊拍游離空氣放電的原理類似
  - label: D
    content: 當電蚊拍抓到蚊蟲時，所聽到啪啪啪的聲音，是由蚊子拍動翅膀所產生
  - label: E
    content: 電蚊拍中間夾層的金屬網電位高達上千伏特，若人體碰觸金屬網，會因電擊而產生嚴重傷害
  group_stem: '電蚊拍的運作原理，是利用電子電路，先將電池的直流電壓把直流電變成交流電壓，這樣就可以利用變壓器升壓了。變壓器將電壓升高到約 2000 V～3000 V後，再利用整流器將交流電壓變成了直流電壓。

    如附圖所示，市售的電蚊拍通常具有三層金屬導線網，其中構成上、下拍面的兩層空隙較大的金屬網接到同一個電極，處於電路的低電位；夾在中間的一層金屬網接電路中電位較高的另一電極。

    有了高電壓之後，再利用電弧(Arc)，就可以電死蚊子了。所謂電弧是當兩個電極之間存在高電位差時，兩極之間便產生極強的電場，在適當的距離下，原本中性不導電的氣體分子，會被電場解離為帶電的離子，離子化的空氣變成了導體，此時瞬間電流會突然發生，我們便可看到亮光，稱為電弧。在一大氣壓下，當電場超過30 kV／cm 時，空氣通常會被游離而放電。夏天常見的閃電，原理類似，可視為大型的電弧效應。

    電蚊拍的拍面可視為帶電的平行金屬板，若兩極的電位差為ΔV，兩板間的板距為d、電場為E，則三者的數學關係式為：ΔV＝Ed。現今大部份電蚊拍的兩極電壓約為3000 V，兩電極的間距d ≈ 5 mm，此板距太大，不足使氣體游離，因此兩極可以認為是絕緣的，不會發生放電現象。當蚊蠅進入兩層電網之間時，相當於蚊蠅是導電體，如同將電網兩極之間距離縮短，當距離短到一定程度，電場便足以將空氣游離，而產生電弧。電弧產生的高溫瞬間加熱空氣，空氣急速膨脹就發出了啪啪啪的聲音。為了安全起見，電蚊拍兩電極間會串聯著一個電阻值很大的電阻。因此，雖然電蚊拍具有高電壓，卻只能輸出小電流，因此不會對人造成太大傷害。

    根據上述資料，試回答下列問題：'
  shared_asset: g3_29_30
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
