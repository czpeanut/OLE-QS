  stem: 已知 $CaSO_{4}$ 之 $K_{sp}$＝2.0×$10^{－5}$，$SrSO_{4}$ 之 $K_{sp}$＝7.5×$10^{－7}$，在一溶有相同濃度（0.02 M）的 $Ca^{2＋}$ 與 $Sr^{2＋}$ 的溶液中，分別加入等體積而濃度不同的下列各 $Na_{2}SO_{4}$ 溶液，哪些可使溶液中 $Sr^{2＋}$ 產生沉澱，而 $Ca^{2＋}$ <u>不產生</u>沉澱？
  options:
  - label: A
    content: 2×$10^{－5}$ M
  - label: B
    content: 4×$10^{－4}$ M
  - label: C
    content: 1×$10^{－3}$ M
  - label: D
    content: 3×$10^{－3}$ M
  - label: E
    content: 5×$10^{－2}$ M
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 欲使 $SrSO_{4}$ 沉澱，所需加入 $Na_{2}SO_{4}$ 的濃度為 x M，Q＝$\frac{0.02}{2}$×$\frac{x}{2}$＞7.5×$10^{－7}$

    ∴x＞1.5×$10^{－4}$（M）

    (2) 欲使 $CaSO_{4}$ 不沉澱，所需加入 $Na_{2}SO_{4}$ 的濃度為 y M，Q＝$\frac{0.02}{2}$×$\frac{y}{2}$＜2.0×$10^{－5}$

    ∴y＜4×$10^{－3}$（M）

    可使 $SrSO_{4}$ 沉澱，而 $CaSO_{4}$ 不沉澱的濃度範圍為：1.5×$10^{－4}$ M＜[$SO_{4}^{2－}$]＜4×$10^{－3}$ M'
