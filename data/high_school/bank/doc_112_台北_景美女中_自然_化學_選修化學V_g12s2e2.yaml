  page: 5
  stem: '實驗桌上有五支內容物已經混淆的試管，分別裝有 5 mL 各自不同的待測試劑，已知這五種待測試劑可能為甲醇、甲醛水溶液、乙醛水溶液、2-丙醇或丙酮。為了辨識這五支試管中的試劑種類，某生將各試管中的試劑加以編號，並以過錳酸鉀的酸性溶液、斐林試劑加以測試，並將觀察結果記錄如下表：

    | 編 號 操 作 | 1 | 2 | 3 | 4 | 5 |

    | --- | --- | --- | --- | --- | --- |

    | 逐滴加入過錳酸鉀的酸性溶液 | 紫色消褪，且後來有氣體產生 | 紫色消褪，但始終不產生氣體 | 紫色不消褪 | 紫色消褪，且後來有氣體產生 | 紫色消褪，但始終不產生氣體 |

    | 加入斐林試劑 | 紅色沉澱 | 無沉澱 | 無沉澱 | 無沉澱 | 紅色沉澱 |

    關於上述結果，下列敘述哪些正確？'
  options:
  - label: A
    content: 1 號試劑為甲醛
  - label: B
    content: 2 號試劑為丙酮
  - label: C
    content: 3 號試劑為乙醛
  - label: D
    content: 4 號試劑為甲醇
  - label: E
    content: 5 號試劑為 2-丙醇
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 加入過錳酸鉀酸性溶液，僅 3 號紫色不消褪，所以 3 號試劑為丙酮。1 號、4 號試劑後來生成氣體（$CO_{2}$），所以應該是甲醇或甲醛，但 1 號試劑加入斐林試劑（斐林試液）生成沉澱，故可知 1 號試劑是甲醛，而 4 號試劑是甲醇。而 2 號與 5 號應該是乙醛水溶液或 2-丙醇，其中 5 號加入斐林試劑（斐林試液）可生成紅色沉澱，故 5 號試劑為乙醛水溶液，2 號試劑則為 2-丙醇。
