    content: 4 種醇類與 3 種醚類
  - label: D
    content: 4 種醇類與 3 種酯類
  group_stem: '有 5 種化合物 A ～ E，它們的分子式都是 $C_{4}H_{10}$O，此 5 種化合物的製備方式與反應如下：

    ①分別加少量金屬鈉於 A ～ E，A 與 D 不引起變化，B、C、E 產生氣體。

    ②分別加過錳酸鉀酸性溶液於 B、C 與 E。B 與 E 使過錳酸鉀的紫色褪色，C 沒有顯著變化。

    ③分別加二鉻酸鉀的稀硫酸溶液於 B、E，B 的產物為醛類，E 的產物為酮類。

    ④分別加濃熱硫酸於 B、C，產生相同的烯類產物。

    ⑤化合物 A 可由乙醇加入濃硫酸，加熱至 130 ～ 140 ℃進行製備；而化合物 D 則可由丙烯與甲醇在酸性條件下進行加成反應製得。

    請根據上述實驗事實，回答 30.～ 33.題。'
  answer:
  - C
