- id: doc_113_桃園_武陵_數學_數甲_g12s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些選項的極限值或和<u>不存在</u>？
  options:
  - label: A
    content: $\lim_{n \rightarrow \infty} ( \frac{5}{3} )^{n}( \frac{2}{5} )^{n - 1}$
  - label: B
    content: $\lim_{n \rightarrow \infty} \frac{n!}{n^{n}}$
  - label: C
    content: $\lim_{x \rightarrow 0} [x^{2}]$（[ ]為高斯符號）
  - label: D
    content: $\lim_{x \rightarrow 0} \frac{x^{2} - 2x}{|x|}$
  - label: E
    content: $\sum_{n = 1}^{\infty} \frac{1}{\sqrt{n + 1} + \sqrt{n}}$
  explanation: (A) $\lim_{n \rightarrow \infty} ( \frac{5}{3} )^{n}( \frac{2}{5} )^{n - 1} = \lim_{n\rightarrow \infty} \frac{5^{n}\cdot 2^{n - 1}}{3^{n}\cdot 5^{n - 1}} = \lim_{n\rightarrow \infty} \frac{5}{2}( \frac{2}{3} )^{n} = 0$ (B) ∵$0\leq \frac{n!}{n^{n}}=\frac{1}{n}\cdot \frac{2}{n}\cdot \frac{3}{n}\cdot \cdots \cdot \frac{n - 1}{n}\cdot \frac{n}{n}\leq \frac{1}{n}\cdot 1\cdot 1\cdot \cdots \cdot 1 = \frac{1}{n}$ ∵$\lim_{n\rightarrow \infty} \frac{1}{n} = 0$，由夾擠定理知$\lim_{n \rightarrow \infty} \frac{n!}{n^{n}} = 0$ (C) 當－1＜x＜1時，[ $x^{2}$ ]＝0 ∴$\lim_{x \rightarrow 0} [x^{2}] = 0$ (D) $\lim_{x \rightarrow 0^{+}} \frac{x^{2} - 2x}{|x|} = \lim_{x\rightarrow 0^{+}} \frac{x^{2} - 2x}{x} = \lim_{x\rightarrow 0^{+}} (x - 2) = - 2\lim_{x \rightarrow 0^{-}} \frac{x^{2} - 2x}{|x|} = \lim_{x\rightarrow 0^{-}} \frac{x^{2} - 2x}{- x} = \lim_{x\rightarrow 0^{-}} ( - x + 2) = 2$ ∵$\lim_{x \rightarrow 0^{-}} \frac{x^{2} - 2x}{|x|}\neq \lim_{x\rightarrow 0^{+}} \frac{x^{2} - 2x}{|x|}$ ∴$\lim_{x \rightarrow
    0} \frac{x^{2} - 2x}{|x|}$不存在 (E) $\sum_{n=1}^{m} \frac{1}{\sqrt{n + 1}+\sqrt{n}} = \sum_{n=1}^{m} \frac{\sqrt{n + 1} - \sqrt{n}}{(\sqrt{n + 1} + \sqrt{n})(\sqrt{n + 1} - \sqrt{n})} = \sum_{n=1}^{m} ( - \sqrt{n} + \sqrt{n + 1})= ( - \sqrt{1} + \sqrt{2}) + (-\sqrt{2} + \sqrt{3}) + ( - \sqrt{3} + \sqrt{4}) + \cdots + ( - \sqrt{m} + \sqrt{m + 1}) = - 1 + \sqrt{m + 1}$ ∴$\sum_{n = 1}^{\infty} \frac{1}{\sqrt{n + 1} + \sqrt{n}} = \lim_{m\rightarrow \infty}\sum_{n = 1}^{m} \frac{1}{\sqrt{n + 1} + \sqrt{n}} = \lim_{m\rightarrow \infty} ( - 1 + \sqrt{m + 1})$不存在 故選(D)(E)。
- id: doc_113_桃園_武陵_數學_數甲_g12s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 已知函數$f(x) = \begin{cases}\frac{x^{2} - a}{x - 3},當x\neq 3時 \\ m ,當x = 3時\end{cases}$，$g(x) = \begin{cases}\frac{- x^{2} + b}{x + 7},當x\neq - 7時 \\ n ,當x = - 7時\end{cases}$，其中a，b，m，n∈R，試問下列哪些選項是正確的？
  options:
  - label: A
    content: 無論a , m為何值，$\lim_{x \rightarrow 3} f(x) = m$
  - label: B
    content: 無論b , n為何值，$\lim_{x \rightarrow 5} g(x) = g(5)$
  - label: C
    content: 當a＝9，b＝49時，$\lim_{x \rightarrow 2} f(x) + \lim_{x \rightarrow 2} g(x) = 10$
  - label: D
    content: 當a＝9，b＝49時$\lim_{x \rightarrow t} f(x) + \lim_{x \rightarrow t} g(x) = 10$，其中t∈R
  - label: E
    content: 若a＝9，b＝49且f (x)與g (x)皆為連續函數，則m＋n＝20
  explanation: (A) 不一定，例如a＝9，m≠6，則$\lim_{x\rightarrow 3} f(x) = \lim_{x\rightarrow 3} \frac{x^{2} - 9}{x - 3} = \lim_{x\rightarrow 3} (x + 3) = 6\neq m$ (B) $\lim_{x\rightarrow 5} g(x) = \lim_{x\rightarrow 5} \frac{- x^{2} + b}{x + 7} = \frac{- 5^{2} +b}{5 + 7} = g(5)$ (C) $\lim_{x\rightarrow 2} f(x) + \lim_{x\rightarrow 2} g(x) = \lim_{x\rightarrow 2} \frac{x^{2} - 9}{x - 3} + \lim_{x\rightarrow 2} \frac{- x^{2} + 49}{x + 7} = \lim_{x\rightarrow 2} (x + 3) + \lim_{x\rightarrow 2} ( - x + 7) = (2 + 3) + ( - 2 + 7) = 10$ (D) $\lim_{x\rightarrow t} f(x) + \lim_{x\rightarrow t} g(x) = \lim_{x\rightarrow t} \frac{x^{2} - 9}{x - 3} + \lim_{x\rightarrow t} \frac{- x^{2} + 49}{x + 7} = \lim_{x\rightarrow t} (x + 3) + \lim_{x\rightarrow t} ( - x + 7) = (t + 3) + ( - t + 7) = 10$ (E) 若f (x)為連續函數，則$m = \lim_{x\rightarrow 3} f(x) = \lim_{x\rightarrow 3} \frac{x^{2} - 9}{x - 3} = \lim_{x\rightarrow 3} (x + 3) = 6$ 若g (x)為連續函數，則$n = \lim_{x\rightarrow - 7} \frac{- x^{2} + 49}{x + 7}=\lim_{x\rightarrow
    - 7} ( - x + 7) = 14$ ∴ m＋n＝20 故選(B)(C)(D)(E)。
