    content: 謝安命子弟詠雪，謝道韞以一句「未若柳絮因風起」技壓諸人
  group_stem: '閱讀下文，回答(43)-(45)題：

    志摩的最動人的特點，是他那不可信的純淨的天真，對他的理想的愚誠，對藝術欣賞的認真，體會情感的切實，全是雖能可貴到極點。他站在雨中等虹；他甘冒社會的大不韙爭他的戀愛自由；他坐曲折的火車到鄉間去拜哈岱；他拋棄博士一類的引誘捲了書包到英國，只為要拜羅素做老師；他為了一種特異的境遇，一時特異的感動，從此在生命途中冒險，從此拋棄所有的舊業，只是嘗試寫幾行新詩——他常能走幾里路去採幾莖花，費許多周析去看一個朋友說兩句話；這些都不是我們能夠輕易了解的神祕。我說神祕，其實竟許是傻，是痴人事實上他只是比我們認真，虔誠到傻氣，到痴！尋常評價的衡量在他手裡失了效用，利害輕重他自有他的看法，所以往常受友們說到他，總愛帶著嗟嘆的口吻說：「那是志摩，你又有什麼法子！」他真的是個怪人麼？不，一點都不是，他只是比我們近情，比我們熱誠，比我們天真，比我們對萬物都更有信仰。 朋友們，我們失掉的不只是一個朋友，一個詩人，我們丟掉的是個極難得可愛的人格。 至於他的作品全是抒情的麼？他的興趣只限於情感麼？更是不對。志摩的興趣是極廣泛的。他始終極喜歡天文，他對天上星宿的名字和部位就認得很多，最喜暑夜觀星，好幾次他坐火車都是帶著關於宇宙的、科學的書。他曾經譯過愛因期坦的《相對論》，並且在一九二二年更寫過一篇關於《相對論》的東西登在《民鐸》雜誌上。 他對於戲劇繪畫的興趣都極深濃，對於後期印象派的幾個畫家，他都有極精密的愛惡，文藝復興時代那幾位，他也很熟悉，最愛鮑蒂切利和達文騫。他喜歡色彩，雖然他自己不會作畫。暑假裡他曾從杭州給我幾封信，他自己叫它們做「描寫的水彩畫」，他用英文極細緻地寫出西邊田的顏色，每一分嫩綠，每一色鵝黃，他都仔細地觀察到。又有一次他望著我園裡一帶斷牆半晌不語，過後他告訴我說，他只在默默體會，想要描寫那牆上向晚的豔陽和剛剛入秋的藤蘿。 誰相信這樣的一個人，這樣忠實於「生」的一個人，會這樣早地永遠地離開我們另投一個世界，永遠地靜寂下去，不再透些許聲息！（林徽音〈悼志摩〉）'
