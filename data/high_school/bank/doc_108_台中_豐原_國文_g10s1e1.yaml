  group_stem: (甲) 〈項脊軒志〉 家中有老嫗，嘗居於此。嫗，先大母婢也，乳二世，先妣撫之甚厚。室西連於中閨，先妣嘗一至。嫗每謂余曰：「某所，而母立於茲。」嫗又曰：「汝姊在吾懷，呱呱而泣，娘以指扣門扉曰：『兒寒乎？欲食乎？』吾從板外相為應答。」語未畢，余泣，嫗亦泣。 (乙)〈先妣事略〉 先妣周孺人，弘治元年二月十一日生。年十六來歸。踰年，生女淑靜；淑靜者，大姊也。期而生有光。又期而生女、子，殤一人，期而不育者一人。又踰年，生有尚，妊十二月。踰年，生淑順。一歲，又生有功……有光七歲，與從兄有嘉入學。每陰風細雨，從兄輒留，有光意戀戀，不得留也。孺人中夜覺寢，促有光昱誦《孝經》，即熟讀，無一字齟齬，乃喜。
