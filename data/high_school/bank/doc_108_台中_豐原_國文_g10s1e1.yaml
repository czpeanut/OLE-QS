  stem: '甲文作者雖然物質生活困窘，但「我的書齋」獨特性卻讓他引以為榮。請參考下表「別人書齋」的說明，簡述「我的書齋」①、②的特質。（請從原文改寫，①②總字數不超過 20 字）


    | 比較項目 | 別人書齋 | 我的書齋 |

    | --- | --- | --- |

    | 擺設與氛圍 | 雕金飾玉、書畫古梅，顯得華貴俗氣 | ① |

    | 空間與視野 | 局限於斗室之中，與外界隔絕 | ② |'
  group_stem: '閱讀下文，回答(40)～(42)題：

    甲、

    我的書齋是我們的大天地！

    我家有寬廣的水泥埕，是特別拿來晒已熏乾的香蕉乾用的。數年前我沿坎下種了幾株墨西哥種木瓜。兩三年後，木瓜樹長得丈多高，一叢叢地伸張著茂密的掌形大葉。倘在晴天，樹就有幾堆涼陰陰樹影。一年之中由秋分至春分半年間，這樹影便橫橫地斜過庭邊來。

    在某一個冬日，當樹影斜過庭邊來時，那陰涼的黑塊觸動了我的心，於是我搬藤椅及另外一張圓型几凳，以便置放稿紙和鋼筆水等，便在那下邊開始寫東西。我的書桌是一塊長不及尺、寬約七寸的木板，一端手托著，另一端則架在藤椅的扶手下，樹影刻刻移動，因而我也不得不追隨著移動，差不多每隔半小時便要移動一次。

    我極高興自己的發現，它實在太美了，在那裡寫東西既寫意又痛快。那陰暗蔽塞的屋子和那窳破搖擺的桌子是連比都不能比的，就是世上有的建築得最華美最富麗的書齋，都不會比它更好吧！

    你的書齋也許是明窗淨几，雕金飾玉，也許案頭有一盆古梅，壁間懸有名人書畫，但比起我面前壯大的山河，深邃悠遠的藍天，阡陌橫斜的田野，就顯得那麼渺小寒酸，俗不可耐。

    你的書齋也許華貴，而我的則簡樸，但我不愛你的華貴而愛我的簡樸。它因為是在天底下，光線富足；因為在山腰，居高臨下，前邊的山川、田園，村莊的雲煙、竹樹、人物，盡收眼底，眺望絕佳。你的書齋把你局限在斗室中，使你和外界隔絕；而我的書齋既無屋頂又無牆壁，它就在空曠偉大的天地中，與浩然之氣相往來，與自然成一整體。

    有時我寫得倦了，便放下紙筆，抬起眼睛。白雲正悠悠地在舒伸、在變幻。有時它們集團地向西北方靜靜地移動著，雲影在下邊的山頭和田野上馳走奔逐，一忽光，一忽暗，氣象萬千，變化無窮。田野像一片綠色的海洋，如果碰在農忙時期，則儘是繁忙地蠕動著的灰色點子。他們在翻掘大地，給人類找尋生命的養料，那景象緊張，但是和平、勤奮，而且快樂。

    還有嬝嬝的炊煙，遠山如黛。

    大自然給我裝潢了一幅偉大壯觀的圖畫，那是任何人造的書齋裡都不會有的。那是一首宇宙的詩集（鍾理和〈我的書齋〉）

    乙、

    有一句俗語叫「富不過石崇，窮不過范丹」。石崇是西晉知名富豪，窮奢極欲，殘忍好殺，比富行徑於《世說新語》多有紀錄。范丹是東漢末年著名清官，清風兩袖，一介不取。黨錮之禍後，避逃於鄉野間，用小車推著妻子，徒行敝服，賣卜維生。所居單陋，時而絕糧斷炊，雖窮居泰然自若。

    二人所處時代不同，正史上本是毫無交集，但一富一窮的形象卻被民間傳說「湊作對」形成傳奇。巷談街語流傳一則「活寶死寶」的軼聞，頗有意思：

    范丹清貧自守，有賢士之名。石崇欲與之結交，設宴邀請范丹。席間美女如雲，珍饈罕見自不在話下，還特以翠玉為桌面，金磚為桌腳，輝煌奪目，以此向范丹炫示。

    范丹笑而不語，幾日後作東還邀。石崇應邀到了范丹草屋，只見范丹以一木板為桌，牆磚為墊，於樹蔭下設宴。樹影移動，范丹四個兒子就搬磚移桌，逐影設案。

    席間唯有粗食薄酒，但四子招待殷勤，應對有禮。范丹笑曰：「公有金磚，此為『死寶』，吾有四子移案，此為『活寶』，二者比之如何？」

    石崇富可敵國，唯子息薄弱，面對范丹笑語，徒有訥訥而已。

    此雖為民間傳說，思來卻頗有深意。（楊明〈死寶活寶〉）'
