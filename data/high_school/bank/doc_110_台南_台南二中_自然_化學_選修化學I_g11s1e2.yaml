- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 若壓力不變時，一定量氣體其溫度由27℃上升至37℃，則其體積膨脹率為何？
  options:
  - label: A
    content: 1/300
  - label: B
    content: 1/31
  - label: C
    content: 1/310
  - label: D
    content: 1/27
  - label: E
    content: 1/30
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $\frac{ V_{2}－V_{1} }{ V_{1} }$＝$\frac{ T_{2}－T_{1} }{ T_{1} }$＝$\frac{
    (37＋273)－(27＋273) }{ (27＋273) }$＝$\frac{ 10 }{ 300 }$＝$\frac{ 1 }{ 30 }$。故選(E)。
- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在海平面上有一托里切利氣壓計，如附圖所示，請問若將此裝置移至玉山山頂，則Δh的高度會如何變化？為什麼？
  options:
  - label: A
    content: Δh不變，因為管柱頂端為真空
  - label: B
    content: Δh變小，因為山頂的大氣壓力較海平面小
  - label: C
    content: Δh變大，因為山頂的大氣壓力較海平面大
  - label: D
    content: Δh變大，因為山頂的大氣壓力較海平面小
  - label: E
    content: Δh變小，因為山頂的大氣壓力較海平面大
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e2/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 570.35
      - 458.2
      - 669.8
      - 549.4
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: ∵山頂 ∴大氣壓力較小 ∴產生Δh較小。故選(B)。
