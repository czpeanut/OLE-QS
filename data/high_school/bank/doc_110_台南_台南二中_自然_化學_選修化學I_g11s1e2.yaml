  section: 1
  number: 6
  type: single
  page: 1
  stem: 石油氣的主要成分是丙烷（$C_{3}H_{8}$）和丁烷（$C_{4}H_{10}$），今取少量丙烷和丁烷的混合氣體在充足的氧氣下完全燃燒，將所得的產物，先經過含無水過氯酸鎂的吸收管吸收$H_{2}$O增重5.58克，再經過含氫氧化鈉的吸收管吸收$CO_{2}$增重10.56克。試問此混合氣體中，丁烷的莫耳分率應為下列哪一選項？
  options:
  - label: A
    content: 3/7
  - label: B
    content: 3/4
  - label: C
    content: 2/5
  - label: D
    content: 3/5
  - label: E
    content: 4/7
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 於25℃，分別有1克的氫氣、甲烷及二氧化硫三種氣體。下列關於此三種氣體的敘述，哪一項正確？
  options:
  - label: A
    content: 氫氣所含的分子數目最少
  - label: B
    content: 若三種氣體同置於一容器中，則三者的分壓相同
  - label: C
    content: 若三種氣體同置於一容器中，則甲烷的莫耳分率最大
  - label: D
    content: 若三種氣體均為1大氣壓，則二氧化硫的氣體體積最小
  - label: E
    content: 若三種氣體分別置於體積相同的三個容器中，則氫氣的密度最小
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
