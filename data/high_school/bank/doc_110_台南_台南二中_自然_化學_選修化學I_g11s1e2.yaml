- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 真實氣體在下列何種條件下表現最接近理想氣體？
  options:
  - label: A
    content: 高溫、高分子量
  - label: B
    content: 低溫、高壓
  - label: C
    content: 高壓、高溫
  - label: D
    content: 低溫、低壓
  - label: E
    content: 高溫、低壓
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 理想氣體：引力＝0 (i)引力小的分子 ⇒ 一般為分子量小者分子 (ii)高溫：分子運動速率快，受引力影響不明顯 (iii)低壓：分子距離較大，受引力影響不明顯。故選(E)。
