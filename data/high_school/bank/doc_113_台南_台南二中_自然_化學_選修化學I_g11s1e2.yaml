  answer_status: verified
  answer_source: answer_key
  explanation: '(1)兩氣體相互獨立，故氮氣打開後滿足波以耳定律：300×2＝$P_{N2}$×（2＋3），可得$P_{N2}$＝120 mmHg；同理，氧氣打開後也滿足波以耳定律：400×3＝$P_{O2}$×（2＋3），可得$P_{N2}$＝240 mmHg；總壓＝120＋240＝360 mmHg。其中$N_{2}$的莫耳分率＝$\frac{120}{360}$＝$\frac{1}{3}$

    (2)先假設不反應，同(1)的計算可得氨分壓＝120 mmHg、氯化氫分壓＝240 mmHg；發生反應後氨完全用盡，氯化氫剩餘120 mmHg，溫度再由300 K增加至360 K，則最終壓力＝120×$\frac{360}{300}$＝144 mmHg。'
