  stem: '儀器裝置如圖，連接兩容器中的管子體積可以忽略不計；在27°C時，分別進行以下實驗： (1)封閉的甲容器（2升的球瓶）中裝入$N_{2}$(g) 300 mmHg，封閉的乙容器（3升的球瓶）中裝入$O_{2}$(g) 400 mmHg，然後開啟兩容器中間的活栓，靜置一段時間後，則①容器內氣體壓力為若干mmHg？（2分）②容器內$N_{2}$(g)的莫耳分率為何？（2分）

    (2)甲容器中改裝入$NH_{3}$(g) 300mmHg，乙容器中改裝入HCl(g) 400mmHg，然後開啟兩容器中間的活栓，讓兩氣體充分反應，發現容器內生成白色固體。靜置一段時間後，若反應後氣體的溫度由27°C升高至87°C，則容器內氣體壓力為若干mmHg？（2分） 3.小碩同學欲探究實驗室內一瓶陳舊氯酸鉀（$KClO_{3}$）試藥的純度，由上課所學得知：氯酸鉀在高溫下可完全分解產生氯化鉀和氧氣，於是取此氯酸鉀試樣1.225 g，將其加熱分解，以排水集氣法收集氧氣，直到不再有氧氣產生，共收集200 mL的氧氣，此時瓶內水面較瓶外水面低13.6 cm。若實驗時，水的溫度為27°C、大氣壓力為770 mmHg。依上述實驗數據，試回答下列問題：（已知27°C時水的飽和蒸氣壓為30 mmHg，且氧氣的溶解度極小，可忽略不計，$KClO_{3}$＝122.5） (1)此瓶內氧氣之分壓為多少mmHg？（2分）

    (2)此實驗共收集多少mol的氧氣？（2分）

    (3)此氯酸鉀試藥的純度約為多少%？（2分）'
  assets:
