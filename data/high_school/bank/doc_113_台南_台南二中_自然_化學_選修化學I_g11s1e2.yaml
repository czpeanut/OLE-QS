  page: 1
  stem: 在定壓下定量的氦氣，在下列各狀況下，何項增加的體積百分率最小？
  options:
  - label: A
    content: 100K→110K
  - label: B
    content: 200K→210K
  - label: C
    content: 0°C→10°C
  - label: D
    content: 100°C→110°C
  - label: E
    content: 200°C→210°C
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 體積增加百分率（膨脹率）＝$\frac{體積增加量}{一開始的體積}$＝$\frac{V_{2}-V_{1}}{V_{1}}$，又依照查理定律，V、T(K)成正比，故可改寫為$\frac{T_{2}-T_{1}}{T_{1}}$。因本題中所有的選項都是增加10℃（10 K），故分母T(K)越大者，增加率越小。故選(E)。
