  stem: 一容器內裝理想氣體，以一個可自由滑動之活塞構成左右二室。已知在27°C平衡時，左右兩室之體積均為V。今將左室緩慢加熱至127°C，右室保持原來溫度，則左室氣體體積增加了多少體積？
  options:
  - label: A
    content: $\frac{V}{3}$
  - label: B
    content: $\frac{V}{5}$
  - label: C
    content: $\frac{V}{7}$
  - label: D
    content: $\frac{V}{9}$
  - label: E
    content: $\frac{V}{2}$
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_113_台南_台南二中_自然_化學_選修化學I_g11s1e2/s1_7_f1.png
    crop:
      page: 1
      rect:
      - 453.3
      - 530.05
      - 688.9
      - 635.8
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 加熱後，左、右兩室壓力、氣體莫耳數相等，故V正比於T(K)；因此V左：V右＝400：300＝4：3，故左室總體積為2V×$\frac{4}{7}$＝$\frac{8}{7}$V，相較於一開始的體積V共增加了$\frac{1}{7}$V。故選(C)。
