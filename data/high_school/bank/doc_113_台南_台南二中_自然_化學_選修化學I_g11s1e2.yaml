- id: doc_113_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 若定量He(g)在定壓下，於$t_{1}$°C時測其體積為a L；$t_{2}$°C時測其體積為b L，試問絕對零度所對應的攝氏溫度可振示為多少°C？
  options:
  - label: A
    content: $\frac{ab}{t_{2}-t_{1}}$
  - label: B
    content: $\frac{at_{2}-bt_{1}}{a-b}$
  - label: C
    content: $\frac{at_{2}-bt_{1}}{t_{1}-t_{2}}$
  - label: D
    content: $\frac{bt_{2}-at_{1}}{b-a}$
  - label: E
    content: $\frac{at_{1}-bt_{2}}{a^{2}-b^{2}}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 假設絕對零度的攝氏溫度－t℃，則在V(L)－t($^{o}$C)上其座標為(－t，0)，利用斜率相等的性質可得知：$\frac{a-0}{t_{1}-(-t)}$＝$\frac{b-0}{t_{2}-(-t)}$，整理後可得－t＝$\frac{at_{2}-bt_{1}}{a-b}$。故選(B)。
  tags:
    unit:
      code: CH-S1-2-2
      book: 選修化學I 物質與能量
