- id: doc_109_台南_台南二中_數學_數A_g11s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 空間中，設 $L_{1}$、$L_{2 }$是相異兩直線，$E_{1}$、$E_{2 }$是相異兩平面，則下列選項哪些正確？
  options:
  - label: A
    content: 若 $L_{1}$⊥$E_{1}$，$L_{2}$⊥$E_{1}$，則 $L_{1}$//$L_{2}$
  - label: B
    content: 若 $L_{1}$⊥$E_{1}$，$L_{2}$//$E_{1}$，則 $L_{1}$⊥$L_{2}$
  - label: C
    content: 若 $E_{1}$⊥$L_{1}$，$E_{2}$⊥$L_{1}$，則 $E_{1}$//$E_{2}$
  - label: D
    content: 若 $E_{1}$//$L_{1}$，$E_{2}$//$L_{1}$，則 $E_{1}$//$E_{2}$
  - label: E
    content: 若 $L_{1 }$平行 $E_{1}$、$E_{2 }$的交線 L，且 $L_{2}$//L，則 $L_{1}$//$L_{2}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵$L_{1}$⊥$E_{1}$，$L_{2}$⊥$E_{1}$，則$\vec{L_{1}}$，$\vec{L_{2}}$必為 $E_{1 }$的法向量

    ∴$\vec{L_{1}}$//$\vec{L_{2}}$，又 $L_{1}$≠$L_{2}$，則 $L_{1}$//$L_{2}$

    (B) ╳：∵$L_{1}$⊥$E_{1}$，$L_{2}$//$E_{1}$，$L_{1}$，$L_{2 }$的關係可能垂直或歪斜

    (C) ○：∵$E_{1}$⊥$L_{1}$，則$\vec{L_{1}}$為 $E_{1 }$之法向量，又 $E_{2}$⊥$L_{1}$，則$\vec{L_{1}}$為 $E_{2 }$之法向量

    ∴$E_{1}$，$E_{2 }$的關係可能平行或重合

    ∵$E_{1}$≠$E_{2}$，則 $E_{1}$//$E_{2}$

    (D) ╳：∵$E_{1}$//$L_{1}$，$E_{2}$//$L_{1}$，則 $E_{1}$，$E_{2 }$的關係可能平行或相交成一直線

    (E) ○：∵$L_{1}$//L 且 $L_{2}$//L，又 $L_{1}$≠$L_{2}$，則 $L_{1}$//$L_{2}$

    故選(A)(C)(E)'
