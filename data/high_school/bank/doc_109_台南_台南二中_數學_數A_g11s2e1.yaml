- id: doc_109_台南_台南二中_數學_數A_g11s2e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 已知$\vec{a}$，$\vec{b}$，$\vec{c}$為空間中的三個向量，下列哪些選項正確？
  options:
  - label: A
    content: $\vec{a}\times \vec{b}=\vec{b}\times \vec{a}$
  - label: B
    content: $\vec{a} \cdot (\vec{b}+\vec{c})=\vec{a} \cdot \vec{b}+\vec{a} \cdot \vec{c}$
  - label: C
    content: $\vec{a} \cdot (\vec{a}\times \vec{b})=0$
  - label: D
    content: $\vec{a} \cdot (\vec{a}\times \vec{b})=\vec{0}$
  - label: E
    content: $│ \vec{a}\times \vec{b} │ ^{2}+(\vec{a} \cdot \vec{b})^{2}= │ \vec{a} │ ^{2} │ \vec{b} │ ^{2}$
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：令$\vec{a}$＝（$x_{1}$，$y_{1}$，$z_{1}$），$\vec{b}$＝（$x_{2}$，$y_{2}$，$z_{2}$）

    ∴$\vec{a}$×$\vec{b}$＝（$x_{1}$，$y_{1}$，$z_{1}$）×（$x_{2}$，$y_{2}$，$z_{2}$）

    ＝$\left( \left| \begin{matrix}y_{1} & z_{1} \\ y_{2} & z_{2}\end{matrix} \right| , \left| \begin{matrix}z_{1} & x_{1} \\ z_{2} & x_{2}\end{matrix} \right| , \left| \begin{matrix}x_{1} & y_{1} \\ x_{2} & y_{2}\end{matrix} \right| \right)$

    ＝（$y_{1}z_{2}$－$y_{2}z_{1}$，$x_{2}z_{1}$－$x_{1}z_{2}$，$x_{1}y_{2}$－$x_{2}y_{1}$）

    $\vec{b}$×$\vec{a}$＝（$x_{2}$，$y_{2}$，$z_{2}$）×（$x_{1}$，$y_{1}$，$z_{1}$）

    ＝$\left( \left| \begin{matrix}y_{2} & z_{2} \\ y_{1} & z_{1}\end{matrix} \right| , \left| \begin{matrix}z_{2} & x_{2} \\ z_{1} & x_{1}\end{matrix} \right| , \left| \begin{matrix}x_{2} & y_{2} \\ x_{1} & y_{1}\end{matrix} \right| \right)$

    ＝（$y_{2}z_{1}$－$y_{1}z_{2}$，$x_{1}z_{2}$－$x_{2}z_{1}$，$x_{2}y_{1}$－$x_{1}y_{2}$）

    ∴$\vec{a}$×$\vec{b}$＝－$\vec{b}$×$\vec{a}$

    (B) ○：令$\vec{c}$＝（$x_{3}$，$y_{3}$，$z_{3}$）

    $\vec{a} \cdot (\vec{b}+\vec{c})$＝（$x_{1}$，$y_{1}$，$z_{1}$）．（$x_{2}$＋$x_{3}$，$y_{2}$＋$y_{3}$，$z_{2}$＋$z_{3}$）

    ＝$x_{1}$．（$x_{2}$＋$x_{3}$）＋$y_{1}$．（$y_{2}$＋$y_{3}$）＋$z_{1}$．（$z_{2}$＋$z_{3}$）

    ＝（$x_{1}x_{2}$＋$y_{1}y_{2}$＋$z_{1}z_{2}$）＋（$x_{1}x_{3}$＋$y_{1}y_{3}$＋$z_{1}z_{3}$）

    ＝$\vec{a} \cdot \vec{b}+\vec{a} \cdot \vec{c}$

    (C) ○：$\vec{a} \cdot (\vec{a}\times \vec{b})$＝（$x_{1}$，$y_{1}$，$z_{1}$）．（$y_{1}z_{2}$－$y_{2}z_{1}$，$x_{2}z_{1}$－$x_{1}z_{2}$，$x_{1}y_{2}$－$x_{2}y_{1}$）

    ＝$x_{1}$．（$y_{1}z_{2}$－$y_{2}z_{1}$）＋$y_{1}$．（$x_{2}z_{1}$－$x_{1}z_{2}$）＋$z_{1}$．（$x_{1}y_{2}$－$x_{2}y_{1}$）

    ＝0

    (D) ╳：$\vec{a} \cdot (\vec{a}\times \vec{b})$為向量之間的內積，其值為純量

    (E) ○：$│ \vec{a}\times \vec{b} │ ^{2}+(\vec{a} \cdot \vec{b})^{2}$＝$( │ \vec{a} │ │ \vec{b} │ \sin \theta )^{2}$＋$( │ \vec{a} │ │ \vec{b} │ \cos \theta )^{2}$

    ＝$│ \vec{a} │ ^{2} │ \vec{b} │ ^{2} (\sin ^{2}\theta +\cos ^{2}\theta )$

    ＝$│ \vec{a} │ ^{2} │ \vec{b} │ ^{2}$

    故選(B)(C)(E)'
