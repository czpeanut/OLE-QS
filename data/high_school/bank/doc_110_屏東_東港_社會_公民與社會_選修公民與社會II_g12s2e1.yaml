  stem: 水泥業者在花蓮山區的挖礦權，牽涉原住民權利、環境保護等議題，社會因此出現修正《礦業法》的呼籲。該法歷經3年多在立法院的11度審查、4度朝野協商後仍不見共識，有環保團體代表認為：「立法委員怠惰不討論，是修法功虧一簧的主因」民間團體也指出水泥業者花費9,819萬政治獻金在 44名立委身上，使得部分立委有護航水泥業者之嫌。關於上述事件的現象，下列解釋何者較為相近？
