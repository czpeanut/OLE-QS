  type: single
  page: 1
  stem: 在中國，NGO被區分為三種類型：社會團體、基金會和民辦非企業組織。又目前的社會團體都帶有準官方性質，其國內頒布的《社會團體登記管理條例》規定，必須提交業務主管部門的批准文件，且在同一行政區域內不得存在業務範圍相同或者相似的社會團體。其中業務主管部門是指縣級以上各級人民政府有關部門及其授權的組織，故社會團體實際上附屬在業務主管部門之下。根據上述資訊與附表，關於中國社會組織發展狀況，下列分析何者較為正確？
  options:
  - label: A
    content: 社會團體數量持續增加，代表公民社會的發展趨向多元化
  - label: B
    content: 社會團體年增長率持續下降，代表政府有意打壓社會團體
  - label: C
    content: 該國社會團體之自主性與獨立性有限，無法維持有效運作
  - label: D
    content: 黨國體制下認可或授權之社會團體，有足夠獨立運作空間
