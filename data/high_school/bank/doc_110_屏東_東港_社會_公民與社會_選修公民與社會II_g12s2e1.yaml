  stem: 中國媒體曾報導「隨著我國國家利益迅速拓展，海外中國公民的人身及財產安全，國家在境外的政治、經濟及軍事利益等，成為維護國家安全的重要目標。作為一個負責任的大國，我國積極參與地區和全球安全治理，在解決氣候變化、核擴散等地區與全球性問題過程中，發揮著不可替代的作用」，請問何項作為可能是中國在「傳統安全觀」的實踐？
