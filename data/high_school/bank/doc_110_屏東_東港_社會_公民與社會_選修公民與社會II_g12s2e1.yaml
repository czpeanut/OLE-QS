  type: single
  page: 2
  stem: 歐洲因新冠病毒肺炎疫情而面臨史上最嚴峻的經濟蕭條。2020年7月，歐盟領袖通過總額高達7,500億歐元的紓困計畫。這次紓困案的討論歷經四天峰會才達成共識。之所以會耗費這麼久時間，主要是因為會員國之間對於紓困方案的發放金額與運作機制等細節一直僵持不下，荷蘭、奥地利、瑞典、丹麥等國強調財政紀律，認為此次紓困案當中「不用償還的補助金」比例太高，應該要好好控管。其中，奥地利總理庫爾茨甚至堅持所有紓困金都應該用貸款方式處理，但財政比較窘迫的國家如法國、德國則發出抗議。經過激烈討論後，各方才終於達成共識。此次紓困計畫能夠稍微協助各國紓困，短期間內也不會讓各個會員國有額外的財政負擔。關於此次紓困計畫的評析，下列敘述何者最適當？
  options:
  - label: A
    content: 如果歐盟未能通過此次紓困計畫，歐盟可能將會面臨解體的危機
  - label: B
    content: 區域發展程度不均是此次紓困計畫討論過程出現爭議的主要因素
  - label: C
