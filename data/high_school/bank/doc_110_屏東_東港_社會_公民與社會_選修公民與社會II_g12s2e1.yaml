  stem: 自從中國阿里巴巴集團創辦人馬雲大膽批評中國金融監管機構扼殺創新，公然槓上北京中央，並與在同場出聲警告金融系統性風險、強調監管重要性的中國國家副主席王岐山唱反調後，馬雲就親身體會當局的監管力道：螞蟻集團的首次公開募股(IPO)在掛牌前2天臨陣喊卡，無緣締造史上最大IPO交易的歷史，阿里巴巴股價因此應聲下挫，使馬雲痛失中國首富地位。當局更對其提出5大整改要求，要求集團縮減規模，阿里巴巴被官方盯上，針對其「涉嫌壟斷」行為立案調查。關於馬雲的遭遇，何人的評論最接近事實？
