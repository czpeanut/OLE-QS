  stem: 過往的判例認為，販賣毒品罪只要是以營利為目的而購入，犯罪就完成了，不一定要真的賣出，才算販賣既遂。然而，大法官透過《司法院釋字第792號解釋》認定，「販賣」或解釋為出售物品、或解釋為購入物品再轉售，其核心意義都在「出售」，並不是單指「購入」物品的行為。販賣毒品既遂罪，僅限於「銷售賣出」之行為已完成。如果違反這個解釋意旨，擴張或增加法律所沒有的內容，擴增可罰性範圍，就有侵害人權之疑慮。由上述可知販賣毒品既遂的條文違憲，請問其違反哪項原則？
