  stem: 2022年2月24日俄羅斯總統普丁向烏克蘭首都基輔發射導彈，同時派遣部隊全面出兵。俄羅斯總統普丁發表演說提到；「……我再次強調，對我們來說，烏克蘭不僅僅是一個鄰國，它是我們自己的歷史、文化、精神空間不可分割的一部分。……是有血緣聯繫，與我們有親情的人。……俄羅斯締造了烏克蘭…這是歷史事實。」烏克蘭總統澤連斯基透過電視發表：「……烏克蘭人民已經自由了。他們記得自己的過去，並且正在建設自己的未來，他們正在建設它，而不是像電視上每天告訴你們的那樣破壞它。……我們希望建立我們自己的歷史，和平地、平靜地、真實地。」（資料來源：https；//ppt.cc/ftqVix）請問，我們應該如何以導論所提到的「歷史學」，如何理解普丁及澤連斯基的演說？
  options:
  - label: A
    content: 歷史事實價值高於歷史解釋，普丁演說只有歷史事實，未參有任何解釋
  - label: B
    content: 普丁、澤連斯基的結論，主旨皆展現歷史學正擺脫霸權宰制、去中心化
  - label: C
