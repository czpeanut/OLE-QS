  group_stem: '新聞一：行政院院會通過法務部擬具的《民法》部分條文修正草案，將函請司法院會銜送請立法院審議。法務部表示，結合近年來的法學理論及司法實務經驗，將《民法》做全面檢討、修正，不僅完備國家繼承制度，更可促進人民身分法上權益的保障。

    新聞二：立法院三讀通過修正《民事訴訟法》部分條文修正草案，強化調解制度；司法院鑑於當事人利用調解、和解程序解決民事糾紛之比例仍然偏低，調解、和解制度應有之效能未能充分發揮，司法院擬訂《民事訴訟法》部分條文修正草案函請立法院審議，在朝野共識下，順利三讀通過《民事訴訟法》部分條文之修正。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 法律案除了可以由立委提出外，亦可由相關主管的行政、司法、考試、監察院提出，故《民法》與《民事訴訟法》之所以由不同的中央機關提出，主要在於業務的歸屬，故可判斷答案為(B)。(A)《民法》與《民事訴訟法》無法區分重要性。(C)法律不分公法或私法，中央主管機關與立法委員皆可提案。(D)與修正條文的多少無關。
