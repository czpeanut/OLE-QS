  answer_status: verified
  answer_source: answer_key
  explanation: 《原住民身分法》要求原住民與非原住民結婚所生之子女，須跟著具有原住民身分的父親或母親的姓氏，或取原住民傳統名字，才能取得原住民身分，因此在從父姓的傳統下，原母漢父的子女登記為原住民的比例遠低於原父漢母，呈現性別實質不平等，故(A)正確。(B)登記制度非造成性別實質不平等的原因。(C)原住民子女不選擇從原母姓氏，是個人選擇的結果。(D)登記原住民傳統名字，並非唯一可以超越性別且有效保障原住民種族平等與身分認同的方式。
