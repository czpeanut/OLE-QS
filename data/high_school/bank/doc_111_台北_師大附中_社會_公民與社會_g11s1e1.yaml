  group_stem: '面對高房價，我國某立委提出《房屋稅條例》修正草案，主張課徵「囤房稅」來抑制房價，提出：3 戶以下維持原稅率，4 戶以上採取累進稅率，10 戶以上可課徵 6 ～ 10 ％的高稅率，增加房屋持有成本，抑制房市投機炒作。

    依現行《房屋稅條例》規定，自住房屋與非自住房屋採稅率分離，其中，自住戶房屋稅率為 1.2 ％；而非自住戶房屋超過 3 戶以上者，稅率訂為 1.5 ～ 3.6 ％，由地方政府訂定差別稅率。然而，許多地方政府仍從低訂定，跟自住房屋稅率差不了太多。

    針對上述問題，另一立法院黨團則提案改採區間稅率：若房屋所有權人、配偶、未成年子女在全國僅持有 1 戶自住房屋，稅率落在 0.6 ～ 1.2 ％，公益出租人房屋稅率亦同；如果房屋持有人有其他非自住的住家房屋，持有一戶為 1.2 ％，第二～三戶為 1.5 ～ 2.4 ％，第四～五戶為 2.4 ～ 3.6 ％，第六戶以上為 3.6 ～ 4.8 ％。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)為此政策的好處，應屬效益。
