  stem: 原本小剛星期一至五的晚上會在補習班當解題老師 3 小時，時薪 150 元。今天女友小蘭希望小剛陪她去看電影，再去火鍋店吃飯。此時小剛心中的小劇場正在盤算著，電影票一張 250 元，買零食 200 元，火鍋店用餐一個人要 300 元，若不陪女友又怕她生氣，請問下列對小剛該如何做出選擇的敘述，何者正確？
  options:
  - label: A
    content: 小剛若選擇打工，不會有損失，機會成本為 0 元
  - label: B
