- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 我國的《司法院釋字第七四八號解釋施行法》保障同性婚姻，使同性戀者與異性戀者皆擁有結婚的權利。請問該法最能落實以下哪項與人權有關的理念？
  options:
  - label: A
    content: 保障社會處境不利群體的積極平權
  - label: B
    content: 凝聚社會處境不利群體的國家認同
  - label: C
    content: 肯認社會不同群體的多元身分認同
  - label: D
    content: 促進社會不同群體的意見表達自由
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《司法院釋字第七四八號解釋施行法》保障同性婚姻自由，是對同性戀者身分的肯認，故選(C)。(A)這是去除對同性戀者的不公平待遇保障社會處境不利群體的積極平權。(B)(D)這是對同志身分的肯認，而非凝聚社會處境不利群體的國家認同，也不是促進社會不同群體的意見表達自由。
