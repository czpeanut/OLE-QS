  group_stem: '哈佛大學在入學時不只考量申請者學業與考試成績，也包含活動和人格特質。在學業和課外活動評分項目，錄取的亞裔學生皆超過其他族裔，不過在「人格特質」一項卻普遍獲得低分，哈佛此舉被認為是刻意壓抑亞裔學生人數。

    過去哈佛在 1920 年代也曾有過歧視、限制猶太學生錄取人數的歷史，然而美國經過修法和社會運動洗禮，「種族歧視」算是相當嚴重的指控，現在的哈佛或其它同樣限制亞裔人數的名校，不致於因為白人主政者歧視亞裔，而限制亞裔名額。

    這些菁英名校的主政者較可能是為了「確保學生群體的多元化」，決心扶助在歷史上遭受差別待遇而陷於不利處境、學業成就不佳的非裔和拉丁裔，甚至認為若能以哈佛名氣來幫助他們，等到這些受扶助者因高學歷能在社會上立足之時，便可真正彌補幾百年來的不公不義。

    但在這些菁英名校的刻意壓制下，常春藤名校仍有 2 成左右的亞裔學生，遠超過美國人口中僅占 5.6％的亞裔人口比例，哈佛若像加州理工學院將學業成績列為最重要錄取標準，不刻意壓制的話，其大學部將有 4 成以上的亞裔學生。然而粥就這麼多，亞裔吃了，非裔和拉丁裔就沒得吃。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 哈佛為了「確保學生群體的多元化」，決心扶助在歷史上遭受差別待過而陷於不利處境、學業成就不佳的非裔和拉丁裔；加州理工學院將學業成績列為最重要錄取標準，不刻意壓制，但大學部將有 4 成以上的亞裔學生，對於不利處境、學業成就不佳的非裔和拉丁裔未必能做到合乎實質平等。故表示(D)加州理工與哈佛大學的入學制度雖有不同，但都符合機會均等的要求。
