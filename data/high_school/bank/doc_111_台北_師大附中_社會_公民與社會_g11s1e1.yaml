  stem: 某市議員 2019 年 8 月為了支持香港反送中運動，發起「募集防護裝備，臺灣後勤撐香港！」活動，遭外界質疑違反《國家安全法》第 2-1 條，此條規定：「人民不得為外國、大陸地區、香港、澳門、境外敵對勢力或其派遣之人為下列行為：一、發起、資助、主持、操縱、指揮或發展組織……」不過此法條應與該法的第 2-2 條一起解釋：「國家安全之維護，應及於中華民國領域內網際空間及其實體空間。」因此完整的釋義應為：「人民不得為香港敵對勢力或其派遣之人在中華民國領域內網際空間及其實體空間進行第 2-1 條的行為。」所以該議員行為不違反《國家安全法》。請問文中解釋法律的方法，屬下列哪一種？
  options:
  - label: A
    content: 文義解釋
  - label: B
    content: 歷史解釋
  - label: C
    content: 體系解釋
  - label: D
    content: 目的解釋
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依題文所述，是針對《國家安全法》第 2-1、2-2 條條文進行的體系解釋，這是以特定法律條文在整個法律體系上的地位及法條與其他法條之關係，依其章節條款之關聯性或相關法條之意義，藉此闡明規範意旨，故選(C)。(A)文義解釋是直接依據法律條文的文字，來判斷條文的意義。(B)歷史解釋是依據法律制定或修改的背景、歷史，來判定立法者的意旨為何。(D)目的解釋是依據法律條文的立法目的，判斷法律的意旨，使解釋符合立法目的。
