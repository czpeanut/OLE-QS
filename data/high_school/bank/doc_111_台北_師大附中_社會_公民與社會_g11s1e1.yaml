  stem: 2021 年端午節前，因應嚴峻的新冠病毒肺炎疫情，臺南市政府推出防疫政策，其文宣如右圖，此項政策設計的目的是減少返鄉人潮，避免通勤人流眾多及感染鏈擴散，根據政策設計的經濟學原理，如量化返鄉團聚價值，經民眾理性判斷後，下列何者敘述<u>有誤</u>？
  options:
  - label: A
    content: 當民眾覺得疫情對身體健康的損害甚鉅，200 元誘因雖不具吸引力，仍會選擇退票
  - label: B
    content: 若民眾覺得返鄉團聚的價值為 2,000 元，遠高於政府獎金與篩檢費用，誘因不足，民眾會選擇不退票
  - label: C
    content: 若好鄰居的價值小於 1,000 元，則通報未篩檢者返鄉的電話，不會因獎金的鼓勵而增加
  - label: D
    content: 200 元的退票獎金可能會因為申請手續的過程繁複與所需的時間成本而效果有限
