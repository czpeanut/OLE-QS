  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 小剛與女友看電影的隱藏成本＝150 × 3＝450；若小剛支付兩人的所有費用，則外顯成本＝250 × 2＋200＋300 × 2＝1,300，故機會成本＝450＋1,300＝1,750。故(B)正確。(D)若小剛只付自己的電影票和一半的零食費，則外顯成本＝250＋100＝350，機會成本＝450＋350＝1,800。(E)若小剛只支付兩人的電影票和餐費，則外顯成本＝250 × 2＋300 × 2＝1,100，機會成本＝450＋1,100＝1,550。
