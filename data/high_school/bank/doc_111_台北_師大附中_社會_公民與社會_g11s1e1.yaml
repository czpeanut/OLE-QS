  stem: 在一場社會不平等的研討會中，某非裔學者指出：為抵抗白人的汙名化，許多非裔社會運動者喜歡強調非裔與白人一樣強健、具職場生產力，甚至比白人優秀；但這種強調非裔強健意象的說法，卻讓人們忽略非裔群體中身心障礙者的困境。此學者對不平等的主張最可能是下列何者？
  options:
  - label: A
    content: 非裔群體的身心障礙者因白人我族中心主義遭受汙名化
  - label: B
    content: 身心障礙者在職場不被接受會導致任何族群皆受到傷害
  - label: C
    content: 媒體常將非裔群體塑造為體育運動細胞發達之刻板印象
  - label: D
    content: 即使同屬非裔群體也可能因為處境不同而形成內在壓迫
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 因為非裔社會運動者強調非裔與白人一樣強健、具職場生產力，甚至比白人優秀，但同屬非裔群體的身心障礙者並不是身強力壯或具生產力者，因此對非裔群體的身心障礙者而言，會形成內在壓迫，故(D)正確。(A)身心障礙者並不是因為白人我族中心主義遭受汙名化。(B)身心障礙者在職場不被接受，會導致身心障礙者受到傷害，而非任何族群皆受到傷害。(C)此處與媒體塑造非裔群體為體育運動細胞發達之刻板印象無關。
