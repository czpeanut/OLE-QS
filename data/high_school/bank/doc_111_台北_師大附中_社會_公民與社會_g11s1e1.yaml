- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 新德里空氣充滿許多工業廢氣，卻很少有人戴口罩。民眾說：「最便宜的口罩要臺幣 38 元，且戴上口罩與人社交令人感到尷尬，雖然學校因空汙已緊急停課多天了，但我並不覺得空汙有嚴重到需要戴口罩。」為了民眾健康，政府發放 500 萬個免費口罩，企業也送口罩給員工，即便如此戴口罩的人仍很少。根據上述判斷，下列何者正確？
  options:
  - label: A
    content: 政府是以非金錢的負向誘因促使民眾增加戴口罩的行為
  - label: B
    content: 從不戴口罩的原因可知，政府若調降口罩價格將能使民眾戴口罩
  - label: C
    content: 對於不願意戴口罩的民眾而言，戴口罩的機會成本低於不戴口罩
  - label: D
    content: 價格雖降低了戴口罩的機會成本，但仍需提供非價格誘因才足以改變民眾行為
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府發放免費口罩，是希望以正向誘因促使民眾增加戴口罩的行為。(B)民眾覺得戴上口罩與人社交令人感到尷尬，因此即使調降口罩價格，民眾也不一定戴口罩。(C)對於不願意戴口罩的民眾而言，戴口罩的機會成本高於不戴口罩。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 依法律內容規定可將法律分為規範權利義務實體內容的「實體法」與規範政府機關或法院如何行使權力的「程序法」。下列哪一部法律歸類為實體法？
  options:
  - label: A
    content: 規範學生權利及義務的《高級中等教育法》
  - label: B
    content: 規範人民如何進行訴願的《訴願法》
  - label: C
    content: 規範行政程序行政處分效力的《行政程序法》
  - label: D
    content: 規範行政訴訟程序與管轄的《行政訴訟法》
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 實體法是規定權利與義務內容的法規範，如《民法》、《刑法》、《高級中等教育法》等，而程序法則是規定如何實現權利、履行義務相關手續的法規範，如《訴願法》、《行政程序法》、《行政訴訟法》等。故選(A)。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 由於新冠病毒肺炎疫情導致全球經濟重創，使國內產業受到影響。因此政府推出「三倍振興券」專案，企圖活絡國內經濟。對於直接發放現金，還是發放限期紙本票券或數位綁定，各有支持及反對聲浪。普發現金節省許多印製成本，然而根據國外經驗，普發現金反使家庭及個人儲蓄率增加，對於帶動民間消費恐無法發揮最大助益。根據上述說明，下列敘述何者正確？
  options:
  - label: A
    content: 政府選擇發放振興券而非現金，因為活絡經濟為重要政策，可以不計成本代價
  - label: B
    content: 政府選擇發放紙本票券是因為發放票券的成本雖高昂，但淨效益比普發現金高
  - label: C
    content: 政府未採取直接發放現金的方式，是因為該方案為在野黨所支持
  - label: D
    content: 政府分配資源時僅需考慮效率，故振興券發放不應設有排富條款
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府選擇發放振興券仍要考量成本代價。(C)政府未採取直接發放現金的方式，是避免人民將現金儲蓄而無法活絡經濟。(D)政府分配資源時不應只考慮效率。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 巧虎有一筆 200,000 元的現金，假設將錢存在銀行，一年有 5％的利息收人。他的好朋友琪琪最近急需現金周轉，因此向巧虎借錢，若巧虎決定無息將 200,000 元借給琪琪一年，若巧虎一年後收到琪琪的還款，這一年他借錢給琪琪的機會成本為下列何者？
  options:
  - label: A
    content: 0 元
  - label: B
    content: 10,000 元
  - label: C
    content: 200,000 元
  - label: D
    content: 210,000 元
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 巧虎將錢無息借給琪琪，少賺了 200,000 元 × 5％＝10,000 元的利息收人，此即其機會成本，故(B)正確。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在綠色運輸的趨勢下，我國行政院院會於 2017 年通過「運具電動化」政策，鼓勵民眾騎乘電動機車，不但補貼購買電動車，也降低其貨物稅率，燃油機車的銷售量因此受到影響。在機車業者油電平權的訢求下，2020 年起將燃油機車也納入汰舊換新的補助範圍，結果電動車的銷售量大減。請問政府政策的改變因素，是源自何種影響？
  options:
  - label: A
    content: 全面補貼人民會更有感，是公平正義的實踐
  - label: B
    content: 燃油車、電動車皆補助，會更加有經濟效率
  - label: C
    content: 燃油機車業者的訴求，影響政府政策的施行
  - label: D
    content: 燃油車也開放補助，更利於環境永續
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)公平正義應有合理的差別待遇，改善處境不利者。(B)(D)燃油車補助，雖改善舊車排氣問題，但使新的燃油車車輛增加，反而鼓勵多排氣，會製造汙染，不利環境永續。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 請比較以下政府推行的公共政策，在資源分配的考量因素，何者與其他三項<u>不同</u>？
  options:
  - label: A
    content: 免費提供年滿 65 歲民眾與未滿 6 歲幼童 5 劑快篩
  - label: B
    content: 興建社會住宅提供經濟處境不利者以較低費用租賃
  - label: C
    content: 年節期間每日 0 至 5 時取消高速公路的通行費收費
  - label: D
    content: 提供民眾國旅補助協助受疫情波及最嚴重的觀光產業度過難關
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)屬公平原則下的合理差別待遇，改善處境不利者。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 小明晚餐在兩家餐廳猶豫，兩家餐廳的菜色口味都一樣。A 餐廳老闆，態度不佳，排骨便當一個只要 70 元；B 餐廳老闆，態度親切，排骨便當一個要價 90 元，小明選擇了 B 餐廳。下列敘述何者最正確？
  options:
  - label: A
    content: 小明選擇 B 餐廳是因為機會成本較高，需要花 90 元
  - label: B
    content: 對小明而言老闆態度和善的價值大於 20 元故選 B 餐廳
  - label: C
    content: 小明選擇 B 餐廳是一個不理性的行為，因為機會成本較高
  - label: D
    content: 小明選擇了較貴的便當，說明此選擇不是理性自利的抉擇
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 小明選擇 B 餐廳 90 元的便當，多付 20 元，是因為小明不想看 A 餐廳老闆的態度，表示小明願意付 20 元的代價換取老闆的和善態度，故(B)正確。(A)小明選擇 B 餐廳是因為機會成本較低，因為不用看 A 餐廳老闆的態度。(C)(D)小明選擇 B 餐廳是一個理性的行為，因為對他來說機會成本較低。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某國家為了解決雙薪父母擔心保母沒有好好照顧嬰幼兒的問題，對於接受保母訓練課程，且有跟政府申請保母證照的保母給予 5,000 元的補助，希望提高保母的素質，讓父母安心上班。政府該項政策背後的經濟學概念與下列何者相同？
  options:
  - label: A
    content: 政府為了平衡收支，刪除育兒補助
  - label: B
    content: 私立學校因應少子化，資遣超額師資
  - label: C
    content: 幫媽媽做家事，媽媽會給 10 元當零用錢
  - label: D
    content: 為減少闖紅燈行為，提高闖紅燈罰鍰
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 政府給僱用有保母證照的保母 5,000 元補助，屬正向的金錢誘因，故與(C)相符。(A)(D)為負向的金錢誘因。(B)為負向的非金錢誘因。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 新冠疫情產生經濟衝擊，民眾因收人降低而減少消費，市場低迷。我國政府除了發放振興三倍券外，文化部也發行藝放券鼓勵民眾用於藝文消費；農委會推出農遊券鼓勵民眾購買國產的農藝產品；教育部體育署也加碼動滋券，可觀看運動賽事、運動健身或購買運動用品。上述政策所涉及的政府資源分配討論，何者正確？
  options:
  - label: A
    content: 各種券的發放，可使政府產生更多收人而產生剩餘
  - label: B
    content: 各種票券的發放，主要是使用政府的社會福利預算
  - label: C
    content: 政策著眼於公平正義，讓每個人都有機會擴大消費
  - label: D
    content: 政策著眼於整體社會，而非政府是否可以回收費用
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)發放各種券，政府的支出增加。(B)發放各種票券，不一定都是社會福利預算。(C)此政策是為了刺激經濟而非公平正義。
- id: doc_111_台北_師大附中_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 所有經濟問題均與資源稀少性有關。下列有關「稀少性」的敘述，何者正確？
  options:
  - label: A
    content: 若資源不具稀少性，我們就不需要買那麼多衣服
  - label: B
    content: 若資源不具稀少性，我們就可以生產各種想要的商品
  - label: C
    content: 因為資源具稀少性，你在吃到飽的火鍋店會不停地吃
  - label: D
    content: 因為資源具稀少性，世界首富也可能買不到棒球賽門票
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資源具有稀少性，因此必須選擇。即使是富豪也有資源稀少的問題，故(D)正確。(A)(B)若資源不具稀少性，我們不需代出代價得到此資源。(C)因為資源具稀少性，即使是吃到飽的火鍋店，提供的品項也有限制。
