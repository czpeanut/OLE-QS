  stem: 因應新冠肺炎防疫工作之需要，我國在 2020 年 2 月 25 日三讀通過《嚴重特殊傳染性肺炎防治及紓困振興特別條例》，各黨團版本 24 日在立法院召開朝野協商，歷經 11 小時長時間討論後達成共識，並經行政院長蘇貞昌和衛生福利部長陳時中副署，完成條例公布，開啟臺灣防疫紓困與振興的里程碑。法規中明定哄抬或不當囤積防疫物資，最重可處 5 年徒刑及 500 萬元罰金、違反隔離檢疫規定者，最重均可處 100 萬罰鍰等罰則。而經主管機關認定的防疫隔離假、防疫照顧假可申請「防疫補償」，但補償金額與方式並未明定，且僅以減稅「鼓勵」企業給薪。總統在全案三讀不到 4 小時就火速簽署，該條例施行期間，自中華民國 109 年 1 月 15 日起至 110 年 6 月 30 日止，罰則部分從公布日實施
  options:
  - label: A
    content: 該條例從二讀開始到三讀通過花不到兩天
  - label: B
    content: 此案為特別條列，故不需經過程序委員會
  - label: C
    content: 院長及部長的副署代表法案已進入到公布階段
  - label: D
    content: 由上述的進行時程來看，該條例應為逕付二讀
  - label: E
    content: 罰則部分的生效日期為 109 年 1 月 15 日
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)朝野黨團協商（24 日）是二讀中進行，故可知從二讀至三讀（25 日）花不到兩天，故正確。(B)特別條例仍要由程序委員會排定議程。(C)立法院法律案通過後，移送總統及行政院，總統應於收到後十日內公布之。因此院長與部長的副署表示總統要進行公布，正確。(D)由題文中的朝野黨團協商可知，此案應由逕付二讀，故正確。(E)因為法條規定罰則從公布日實施，總統於 109 年 2 月 25 日公布，故應於於 2 月 25 日罰則才生效。
