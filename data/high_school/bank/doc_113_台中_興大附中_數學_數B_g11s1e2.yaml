  stem: 試比較 a＝$log_{8}$54－$log_{8}$2，b＝－$log_{2}\frac{1}{5}$，c＝$log_{4}$7 的大小關係為何？
  options:
  - label: A
    content: a＞b＞c
  - label: B
    content: c＞a＞b
  - label: C
    content: a＞c＞b
  - label: D
    content: b＞c＞a
  - label: E
    content: b＞a＞c
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＝$log_{8}$54－$log_{8}$2＝$log_{8}$27＝$\frac{\log 27}{\log 8}$＝$\frac{3 \log 3}{3 \log 2}$＝$log_{2}$3

    b＝$-\log _{2}\frac{1}{5}$＝－$log_{2}5^{－1}$＝$log_{2}$5

    c＝$log_{4}$7＝$\frac{\log 7}{\log 4}$＝$\frac{\log 7}{2 \log 2}$＝$\frac{1}{2}$ $log_{2}$7＝$\log _{2}\sqrt{7}$

    ∵5＞3＞$\sqrt{7}$且 2＞1 ∴b＞a＞c

    故選(E)'
