  stem: 設 log6＝a，log3＝b，則$\log _{2}\sqrt{30}$＝？
  options:
  - label: A
    content: $\sqrt{\frac{b+1}{a-b}}$
  - label: B
    content: $\frac{1}{2}\left( \frac{b+1}{a-b} \right)$
  - label: C
    content: $\frac{b+1}{a-b}$
  - label: D
    content: $\frac{b+1}{a-b-1}$
  - label: E
    content: $\frac{1}{2}\left( \frac{a+5}{a-b-1} \right)$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$\log _{2}\sqrt{30}$＝$\log _{2}30^{\frac{1}{2}}$＝$\frac{1}{2}$×$\frac{\log 30}{\log 2}=\frac{1}{2} \left( \frac{\log 2+\log 15}{\log 2} \right)$

    ＝$\frac{1}{2} \left( 1+\frac{\log 15}{\log 2} \right)$＝$\frac{1}{2} \left( 1+\frac{\log \frac{30}{2}}{\log \frac{6}{3}} \right)$

    ＝$\frac{1}{2} \left( 1+\frac{\log 3+\log 10-(\log 6-\log 3)}{\log 6-\log 3} \right)$

    ＝$\frac{1}{2} \left( 1+\frac{b+1-a+b}{a-b} \right)$＝$\frac{1}{2} \left( \frac{b+1}{a-b} \right)$

    故選(B)'
