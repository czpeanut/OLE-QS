  stem: 解方程式 $log_{2}$（x＋3）＋$log_{2}$（x－2）＝2＋$log_{2}$（x＋1），則 x＝＿＿＿＿。
  answer:
  - '5'
  answer_status: verified
  answer_source: answer_key
  explanation: '由對數的意義知$\begin{cases}x+3 > 0 \\ x-2 > 0 \\ x+1 > 0\end{cases}$ ⇒ x＞2

    解方程式 $log_{2}$（x＋3）＋$log_{2}$（x－2）＝2＋$log_{2}$（x＋1）

    ⇒ $\frac{\log (x +3)}{\log 2}$＋$\frac{\log (x -2)}{\log 2}$＝$\frac{2 \log 2}{\log 2}$＋$\frac{\log (x +1)}{\log 2}$

    ⇒ log（x＋3）＋log（x－2）＝$log2^{2}$＋log（x＋1）

    ⇒ log〔（x＋3）（x－2）〕＝log〔4（x＋1）〕

    ⇒（x＋3）（x－2）＝4x＋4

    ⇒ $x^{2}$－3x－10＝0

    ⇒（x－5）（x＋2）＝0

    ⇒ x＝5 或－2（不合 ∵x＞2）

    故 x＝5'
