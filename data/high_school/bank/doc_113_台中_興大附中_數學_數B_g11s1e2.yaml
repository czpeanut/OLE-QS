- id: doc_113_台中_興大附中_數學_數B_g11s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 關於指數函數圖形或對數函數圖形的敘述，下列何者正確？
  options:
  - label: A
    content: y＝$2024^{x}$ 的圖形恆在 y＝$113^{x}$ 的上方
  - label: B
    content: y＝$113^{x}$ 和 y＝$log_{113}$ x 的圖形對稱於 y＝x
  - label: C
    content: y＝$\left( \frac{1}{113} \right) ^{x}$和 y＝$\log _{\frac{1}{113}}x$ 的圖形凹口皆向下
  - label: D
    content: y＝$log_{2024}$（$x^{2}$－3x＋5）的圖形與 x 軸不相交
  - label: E
    content: y＝$log_{113}$x 和 y＝$\log _{\frac{1}{113}}x$ 的圖形對稱於 x 軸
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：不一定，x＜0 時不合

    (B) ○：y＝$a^{x}$ 和 y＝$log_{a}$x 對稱於 y＝x

    (C) ╳：y＝$\left( \frac{1}{113} \right) ^{x}$的圖形凹口向上

    ∵y＝$\log _{\frac{1}{113}}x$＝$\frac{\log x}{\log 113^{-1}}$＝$\frac{\log x}{-\log 113}$＝－$log_{113}$x

    ∴y＝$\log _{\frac{1}{113}}x$與 y＝$log_{113}$x 的圖形對稱於 x 軸

    又 y＝$log_{113}$x 的圖形凹口向下，故 y＝$\log _{\frac{1}{113}}x$的圖形凹口向上

    因此，兩圖形凹口皆向上

    (D) ○：解 $log_{2024}$（$x^{2}$－3x＋5）＝0

    ⇒ $x^{2}$－3x＋5＝1

    ⇒ $x^{2}$－3x＋4＝0

    ∵（－3）$^{2}$－4×1×4＜0 ∴$x^{2}$－3x＋4＝0 無實數解

    故 y＝$log_{2024}$（$x^{2}$－3x＋5）與 x 軸不相交

    (E) ○：承(C)

    故選(B)(D)(E)'
