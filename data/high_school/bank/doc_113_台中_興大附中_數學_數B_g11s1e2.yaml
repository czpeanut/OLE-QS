  answer_source: answer_key
  explanation: '(A) ○ (B) ╳：∵圖形為遞減（由左而右逐漸下降）

    ∴0＜a＜1

    (C) ○ (D) ╳：∵漸近線為 y＝k，且由題圖知 0＜k＜1

    ∴0＜b＝k＜1

    (E) ╳：∵x＝0 時，y＝$a^{c}$＋b

