- id: doc_112_台北_明倫_數學_數甲_g12s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若（－1＋2i）（cosθ＋i sinθ）＝$\sqrt{5}$，則θ是第幾象限角？
  options:
  - label: A
    content: 第一象限角
  - label: B
    content: 第二象限角
  - label: C
    content: 第三象限角
  - label: D
    content: 第四象限角
  - label: E
    content: 條件不足，無法判斷
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '（－1＋2i）（cosθ＋i sinθ）＝$\sqrt{5}$

    $\Rightarrow$（－cosθ－2 sinθ）＋（2 cosθ－sinθ）i＝$\sqrt{5}$

    $\Rightarrow\begin{cases}2\sin \theta +\cos \theta =- \sqrt{5} \\ \sin \theta - 2\cos \theta = 0\end{cases}$

    解聯立可得 sinθ＝$-\frac{2\sqrt{5}}{5}$＜0，cosθ＝$-\frac{\sqrt{5}}{5}$＜0

    ∴θ是第三象限角

    故選(C)'
