  stem: 「中國」一詞最早出現在西周何尊銘文中，是指武王所建的洛陽祭祀聖域（武王征服商後曾說：我將定都在「中國」），當時的「中國」或「中域」可能是後代圓丘般的天文臺兼祭天聖所。而「中國」一詞，隨時間演進已漸包含民族、文化、地理、政權範圍等意義，並發展出天下秩序觀，華夏民族是正統，四方是夷狄，故韓愈云：「諸侯用夷禮則夷之，夷而進於中國則中國之。」請問：根據引文資料，下列何者為「中國」天下秩序觀的體現？
  options:
  - label: A
    content: 以魏晉南北朝時期為例，「北朝」為尊、「南朝」為卑的概念是固定的
  - label: B
    content: 以明清朝代轉換為例，朝鮮與越南最初對於誰是華夏正統，態度並無任何差別
  - label: C
    content: 以明初大儒宋濂的標準為例，元朝「用夏變夷」值得鼓勵肯定
  - label: D
    content: 以「中國」正統的空間範疇為例，只有居於黃河中游一帶者方能匹配
