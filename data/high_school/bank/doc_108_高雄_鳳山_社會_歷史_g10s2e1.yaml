  stem: 綜合兩段資料來看，下列哪個選項較符合越南對於中國文化的態度？
  options:
  - label: A
    content: 對中國歷史的憧憬讓史官利用中國史佐證越南歷史
  - label: B
    content: 越南受明帝國影響最大的是火藥與武器的軍事革命
  - label: C
    content: 越南因對儒家價值的喜愛而積極加入東亞儒家社會
  - label: D
    content: 越南統治階級利用中國文化強化權力與統治正當性
  group_stem: 請先閱讀下列資料 明帝國統治越南的短短幾年之間，越南完成一場屬於越南本身的現代軍事革命，進而成功獨立建國。明帝國吸引越南人注目的不只是中國的火藥與武器，也包括伴隨統治而引進的官僚模式與文官系統。中國人不僅在越南建立許多以儒家文化為主的學校，也依據中國的行政管理邏輯建立府、縣。越南的統治者過去一直夢想在這塊土地上建立中央集權，但一直找不到方法。為了建立自己的帝國，他們向中國人借用很多東西，包括：「皇帝」稱號、現代軍事學、火藥科技、官僚模式。越南人也積極參與東亞儒家世界，成為「禮義教化之邦」，進而取得殖民意識與民族文化的階級觀。這些意識使越南人得以視周遭非漢人、缺乏教化的民族為「野蠻人」，也合理化自身征服那些民族的行為。越南人希望自己是優秀和文明的一份子，且往往以漢文明之名進行征服，但這不代表他們想成為「中國人」。
