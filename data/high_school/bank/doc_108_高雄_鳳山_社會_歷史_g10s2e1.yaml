  group_stem: 請先閱讀下列資料 日本學者吉田孝從制度史分析奈良時代到平安時代准許土地私有的「墾田永年私財法」，將它視為擴大律令國家基本盤的重要政策。大寶律令中規定的「班田制」是一個十分僵化的制度，這表現在它僅僅以熟田（已開墾土地）為班田收授的對象。但是當時水田狀態並不穩定，多數是在開墾與荒廢間反覆，然而班田制不存在犒賞農民辛勞墾荒的辦法，總將那些新開墾的土地視為歸公對象，不能保證拓墾者的權益。日本針對此一問題的對策是「墾田永年私財法」，這個新制度實現對未開墾、新開墾土地的管理，增加了政府實際掌控的田地面積，是試圖強化土地支配的積極政策。
