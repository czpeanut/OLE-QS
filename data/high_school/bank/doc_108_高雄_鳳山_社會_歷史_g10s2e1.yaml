  group_stem: 請先閱讀下列資料 春秋時代。周朝的威信衰弱，諸侯變得我行我素，戰禍也多了不少。在這樣的局勢下，周朝以外的大國往往成為霸主，帶領諸侯立下盟誓。因此盟誓可說是亂世的象徵。然而當時只有少數大國都市才使用漢字，一般諸侯無法隨心所欲地閱讀及書寫。沒有漢字，當然也就沒辦法立盟書。因為盟書的意義在於留下雙方能夠確認的證據，倘若只有一方看得懂，就算立了盟書也無濟於事。因此，我們可以說，盟書是漢字普及的象徵。 各國盟誓參加者在盟誓結束後將盟書帶回，並在祭祀的場所進行確認。一旦這個政策趨於成熟，中央與地方就會開始進行文書往來，而這就是文書行政制度的濫觴。換句話說，只要文書行政制度開始運作，原本聯繫中央與地方的盟誓活動就會消失，取而代之的是法令。在文書行政制度的運作過程中，法令能夠解決許多間題。由中央派往地方的官吏，將成為地方祭祀場所的新管理者。
