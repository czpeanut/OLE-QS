  group_stem: 請先閱讀下列資料 日本的古史時期，仿效世界帝國大唐首都長安的平城京，作為先進文化的吸收地，以「文明」的力量壓制著地方大小無數豪族，也完成了律令國家的中央集權政府和「公地公民」制。日本從史前時代開始，其政治形態就接近部族合議制。後來雖然大和朝廷興起，最有力的部族（天皇家）壓制了其他部落而成為共主，但是在決定大事時，共主仍然無法像中國的皇帝般獨裁地決定所有重要事項……公地公民制成功地讓日本成為統一國家，也達成了天皇家中央集權的目的。而律令制另一個靈魂就是官僚的任用。奈良朝廷藉由任用傑出人才和地方豪族子弟進入中央任職，也算完成了律令國家的雛型。
