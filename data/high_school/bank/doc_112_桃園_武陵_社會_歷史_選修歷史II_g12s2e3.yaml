- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_34
  section: 1
  number: 34
  type: single
  page: 3
  stem: 宋人喜愛大自然，山水畫除了承繼唐、五代的精描寫實，兩宋時期亦各有特色，下列敘述哪些正確？
  options:
  - label: A
    content: 北宋以大山大水全景式構圖呈現崇山峻嶺的雄偉風貌
  - label: B
    content: 以寫意的水墨山水為中心，融入來自西方的創作技巧
  - label: C
    content: 邊角山水的大塊留白無意義，僅供畫家題寫詩文落款用
  - label: D
    content: 宋室南渡後，繪畫風格融入透視法，創造出畫面立體視覺效果
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_35
  section: 1
  number: 35
  type: single
  page: 3
  stem: 北宋張擇端的《清明上河圖》，是中國著名的寫實風格長卷畫，描繪宋代汴河風光與市井百態。這幅畫曾被放大成30倍，並讓畫中的人物、景色「動」了起來。請問：這幅會動的《清明上河圖》，應是運用了何種方法而得以讓藝術品呈現新面貌？
  options:
  - label: A
    content: 普普藝術手法
  - label: B
    content: 透視法
  - label: C
    content: 數位投影
  - label: D
    content: 印象寫實手法
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_36
  section: 1
  number: 36
  type: single
  page: 3
  stem: 有環境史家指出，蘇美文明因為人口聚集和過度開發，致使當地環境變得更加惡化，資源不足致使城邦間征戰頻仍，最終導致文明的衰落。請問下列何者符合題文所述？
  options:
  - label: A
    content: 城邦規模擴大快，致使飲用的淡水嚴重不足
  - label: B
    content: 長年蓄水與農業灌溉，導致土地鹽鹼化嚴重
  - label: C
    content: 城邦間因為商業貿易利益的競爭而征戰不斷
  - label: D
    content: 都市人口聚集過多製造大量垃圾，導致缺乏生存空間
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_37
  section: 1
  number: 37
  type: single
  page: 3
  stem: 西洋藝術史上的「中世紀」，通常是指從希臘羅馬時代結束，到文藝復興這一段期間的歐洲歷史，在藝術發展上具有指標性意義。下列關於中世紀藝術的敘述，何者正確？
  options:
  - label: A
    content: 人物作品的呈現表達出強烈的內在情緒
  - label: B
    content: 以神為創作主題，表現奧林匹克運動家精神
  - label: C
    content: 打造宏偉壯麗且實用的大型公共建築和紀念碑
  - label: D
    content: 用色彩鮮明的馬賽克鑲嵌畫強化教堂的神聖感
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_38
  section: 1
  number: 38
  type: single
  page: 4
  stem: 某一時期，官府取消宵禁、坊市也不再有區域限制，各種娛樂紛紛出現，庶民文化興起。有一些人以說書、講唱為業，以文學作品為腳本，搭配淺顯直白的表演型態，讓一些民眾願意掏腰包進入瓦子欣賞他們的表演，豐富了人們的文化生活。下列相關敘述，何者正確？
  options:
  - label: A
    content: 腳本，又稱為話本，是說書人在表演之前準備的「草稿」
  - label: B
    content: 說書人除了娛樂觀眾，最主要的任務是藉機向大眾宣揚佛法
  - label: C
    content: 《三國志平話》和《竇娥冤》都是這時期受大眾喜愛的題材
  - label: D
    content: 每至緊要關頭，說書人會說「欲知詳情，且待下回分解」，受到其後朝戲曲沿用
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_39
  section: 1
  number: 39
  type: single
  page: 4
  stem: 臺灣某企業的簡介如下：壓克力也稱為有機玻璃，因具有優勢的韌性及透光性，故在戰爭時廣泛運用，不論戰鬥機或坦克車，都可透過壓克力鏡而有良好的視野。本公司是臺灣第一家壓克力板生產者，創辦人有「臺灣壓克力之父」之稱，引領壓克力的研究與應用，迄今有65年的歷史。請依據所學與壓克力的歷史發展判讀引文中提到的戰爭，最早可能為何？
  options:
  - label: A
    content: 韓戰
  - label: B
    content: 越戰
  - label: C
    content: 第一次世界大戰
  - label: D
    content: 第二次世界大戰
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_40
  section: 1
  number: 40
  type: single
  page: 4
  stem: 下列關於一九六○年代後藝術發展的敘述，哪些是正確的？(甲)創作者的美感是藝術表現最重要的核心：(乙)出現大量運用陳列式複製技術呈現的藝術風格：(丙)開始強調藝術應與工藝、工業生產結合，貼近貧苦人民的需求：(丁)創作者，觀眾，展場都是藝術創作的一環；(戊)主張藝術應與社會緊密連結，具有強烈的商業性。
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丁戊
  - label: C
    content: 甲丙戊
  - label: D
    content: 乙丙丁
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_41
  section: 1
  number: 41
  type: single
  page: 4
  stem: 右圖為藝術家在海灘上設置的作品，以鯤鯓的形象結合「兒時回憶」與「自然地景」及「樂園想像」三大特點，來探討島嶼的過去、現在及未來。請問這種藝術風格為何？
  options:
