  stem: 中國的書法不僅是記錄的工具，更是人們表達性格、抒發情感的方式。著重令人心領神會的氣韻，書寫者透過運筆，用墨、結構與章法，將其汲取到的感受呈現。下列關於中國書法藝術的敘述，何者正確？
  options:
  - label: A
    content: 秦漢以前的書法，是以草書、楷書為主
  - label: B
    content: 唐代復古，說到書法家顏真卿、柳公權就會想到顏筋柳骨自由奔放的隸書
  - label: C
    content: 元代趙孟頫倡導書法入畫，主張畫山石有如寫草書，畫樹木就像在寫隸書
  - label: D
    content: 明清之際，因為受到傳教士引入西方文化的影響，中國傳統書法藝術沒落
