  stem: 科潘的末代國王圖克登基後不久，城邦就遇到一系列的大災難。戰爭、疾病、洪水、旱災無情地奪走大量馬雅人性命。農民對統治階層的信仰破滅了，人人紛紛棄城而去。描述圖克登基的紀念碑才完成一半，工匠已是人去樓空。王室失去了百姓的支持，從此也不知所終，貴族的祭祀儀式從此失傳。少數留在科潘的百姓，雖然仍在山地上種玉米，但卻遺忘了他們的信仰和神廟。請問：後世最有可能透過下列哪一種方式得知科潘衰微的歷史？
  options:
  - label: A
    content: 科潘人口耳相傳故事
  - label: B
    content: 當時歐洲人的記載
  - label: C
    content: 科潘王室成員的回憶
  - label: D
    content: 學者成功解讀馬雅文字
