  stem: 黃石國家公園是美國著名的國家公園，園內自1920年代起就不見狼的蹤跡，而白楊樹的數量也從這個時期開始減少。1995年園區重新引進狼群之後，麋鹿在狼群獵食下，10年來數量已減少一半，這使得麋鹿開始避免在可能會遭狼群攻擊的危險區域啃咬幼樹枝葉，更多的白楊樹苗得以持續生長茁壯。請問園區此舉的主要用意是為：
