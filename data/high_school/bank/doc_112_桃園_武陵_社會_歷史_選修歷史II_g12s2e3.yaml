- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_47
  section: 1
  number: 47
  type: single
  page: 4
  stem: 「文人畫」是中國傳統繪畫中非常獨特的風格。在創作上，強調創作者的個性表現；手法上，更結合詩詞、書法等。通常創作者必須具有深厚、全面的文化修養，觀賞者也需有一定的學識才懂得欣賞，因此往往只在文人士大夫階層中流行。關於文人畫的敘述，下列何者正確？
  options:
  - label: A
    content: 文人畫主張詩、書、畫渾然一體，相互映照
  - label: B
    content: 強調繪畫的道德教化功能，因此意境淺顯易懂
  - label: C
    content: 講求頓悟與禪意，顯示文人畫畫風受到儒家思想影響
  - label: D
    content: 元代後畫家強調「寫畫家心中之意」，引領文人畫走向寫實
