- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_28
  section: 1
  number: 28
  type: single
  page: 3
  stem: 右圖是一幅明末的人像畫。這派畫家描繪人物的面容，個個躍然紙上，性格突出，儀態逼真。他們對疏朗鬚髮的處理，面痣、雀斑質感的描繪刻畫入微;對老人的龍鍾老態、雞皮鶴髮，更描寫得栩栩如生。這種畫法和傳統文人畫以簡單寫意和勾勒線條為主的特色不同。這種轉變形成的背景為何？
