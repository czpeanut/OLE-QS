  stem: 1983年，藝術家克里斯多夫婦以粉紅色塑膠布圍繞佛羅里達州的11座島嶼，稍加施工並將作品命名為《環繞群島》，該創作在2週後復原並回收材料。請問：這種限時限地的創作，其主要目的為何？
