- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_49
  section: 1
  number: 49
  type: single
  page: 5
  stem: 資料一：12世紀，由於商業復甦、城市興起，各城市競相興建教堂。此時流行的哥德式建築風格包括尖塔、肋狀拱頂與飛拱，整體風格為高聳削瘦，追求高聳藉此接近上帝的同時，也展現凌駕於其他建築的孤高與卓越。資料二：20世紀，戰爭之後又遇上全球經濟大恐慌，歐洲各地商貿經濟衰退，德國年輕的藝術家們充滿理想，提出造型與機能合而為一的設計主張，希望將「美」帶入生活，為一般人及貧苦者建平價房舍，設計好用又好看的生活用品。有關兩則資料中藝術風格發展的背景、特色與比較，何者敘述正確？
  options:
  - label: A
    content: 12世紀歐洲商貿復甦關鍵與十字軍運動有關
  - label: B
    content: 12世紀因商業復興，導致世俗化，使建築為「人」服務
  - label: C
    content: 20世紀面對如此不安定的狀況，藝術家紛紛相信宗教為「神」建築
  - label: D
    content: 20世紀藝術家希望將「美」帶入人民生活，這份「美」來自神賜予的美好
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_50
  section: 1
  number: 50
  type: single
  page: 5
  stem: 文藝復興時期，個人肖像畫成為一種藝術形式而興起。從15世紀初開始，婦女、富商，甚至藝術家都開始大量地出現在肖像畫中。這些作品中可以看到富有的藝術家和他的妻子被描繪得非常精細，如同過去數世紀為教宗、皇帝或貴族所繪製的肖像畫一般。這時期即使是在中古以來傳統菁英分子的肖像畫中，對個人的心理和生理描繪的興趣變得更為明顯……不過，當時的肖像藝術家大多須聽從和依照委託人的意見和喜好，以滿足其要求。例如，提香的畫作《伊莎貝拉·德·伊斯特》(她是一位重要的贊助人和收藏家)，畫中人物在60歲時仍被畫得如同少女一樣年輕。如此作法在當時極普遍，不僅是為了使某個年齡層的婦女看起來年輕自信，同時也是為了展現被畫者的社會、經濟地位。從當時畫中人物擺出的姿勢和表現的氣質上，可以看出他們希望如何被同時代的人或子孫們看待，因為肖像總是具有紀念和世襲的功能。從上述資料的敘述：「婦女、富商，甚至藝術家都開始大量地出現在獨立肖像畫中，……如同過去數世紀為教宗、皇帝或貴族所繪製的肖像畫一般……對個人的心理和生理的描繪也都變得更為明顯」，可推知透過這些肖像畫我們可以觀察到當時的時代意義為何？
  options:
  - label: A
    content: 以寫實的技法大量描繪富商或婦女的肖像畫，象徵社會階級漸趨平等
  - label: B
    content: 肖像畫發展出透視與光線明暗的手法，延續了古典與聖像技法的傳統
  - label: C
    content: 描繪「人」的肖像畫大量出現，顯示世俗力量逐漸與宗教勢力相融合
  - label: D
    content: 「人」的價值得到肯定，描繪世俗的人和現實生活的肖像畫隨之出現
