  stem: 道教的發展從元明清朝以後日益世俗化，並且成為中國、臺灣等地華人社會大眾俗文化重要內涵，其核心理論與實踐方法是什麼？
  options:
  - label: A
    content: 鬼神信仰、儀式風水等社會活動
  - label: B
    content: 自然恬淡，少私寡欲的生活哲學
  - label: C
    content: 清淨心神、無思無慮的修行方法
  - label: D
    content: 調精氣神、健康長壽的醫療養生
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 十六世紀中，西班牙人在某地發現荒廢的古城，其中有金字塔式的祭壇及刻有太陽神像的廟宇，祭壇與廟宇都建有石階，上面有類似象形文字的符號，外圍則有住房的遺址，還有許多看似貴族的人像石雕。請問：此座古城應是位於何處？
  options:
  - label: A
    content: 菲律賓呂宋島
  - label: B
    content: 中美洲猶加敦半島
  - label: C
    content: 埃及尼羅河下游
  - label: D
    content: 南非好望角地區
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某次科舉的畫科考試中，主導命題的皇帝出了一道「深山藏古寺』的考題，考生們覺得這題目不難，迅速提筆作畫。有考生畫出草木蒼翠的深山，山林裡露出古寺的一角，有的則將古寺的一半畫在山腰上，有些則在山中畫上一座完整的寺廟；然而皇帝和閱卷官都認為這些作品不理想。批閱到後來，發現某位考生畫了一條隱藏在山水中的羊腸小徑，有位老和尚在畫面角落的溪邊挑水，然畫面中沒有古寺的痕跡。最後皇帝與閱卷官都認同這幅作品表現出「古寺自在畫中」的意境，堪稱傑作，就拔擢這位考生為第一名。請問：這則故事的出處，最早出現的朝代應是：
  options:
  - label: A
    content: 宋
  - label: B
    content: 元
  - label: C
    content: 明
  - label: D
    content: 清
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 現代人對自然環境已多具有永續經營的觀念，請問哪種說法較符合永續經營的想法？
  options:
  - label: A
    content: 發展出將各種自然資源淋漓盡致使用的觀念
  - label: B
    content: 認為古人不懂得善加運用自然資源，是落後的表現
  - label: C
    content: 認為唯有經濟高度發展，才有更多能力保護自然環境
  - label: D
    content: 反思人類與自然共存的模式且不損及後代子孫滿足其需求
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 相較於西方藝術重視寫實與透視，中國的書畫藝術有何不同的特殊呈現？
  options:
  - label: A
    content: 著重明暗對比的技法，強化觀賞者的感受
  - label: B
    content: 借助光與影的變化來表現畫家在瞬間捕捉到的景象
  - label: C
    content: 強調寫意的傳統，抒發繪畫者面對自然時的內在感受
  - label: D
    content: 注重和諧勻稱，強調畫面黃金比例的配置
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 歐洲某時期的藝術風格融合古西亞、埃及等地的特色，雕塑作品更是強調將人的喜悅、痛苦、哀傷等情緒逼真深刻的表達。請問：某時期是下列何者？
  options:
  - label: A
    content: 古典希臘時期
  - label: B
    content: 希臘化時代
  - label: C
    content: 羅馬帝國時期
  - label: D
    content: 中世紀基督教時期
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 宋代工商發達，城市繁榮，一般民眾的文化生活也更加精采豐富，請問庶民大眾進入瓦子參加說唱活動的主要動機為何？
  options:
  - label: A
    content: 聆聽佛學俗講求安康
  - label: B
    content: 增進身為大宋子民的國族意識以對抗契丹
  - label: C
    content: 符合自身喜好與娛樂
  - label: D
    content: 藉竇娥冤等戲劇反映社會氛圍，抒發對貪官的不滿
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 藝術史家討論近代工業化過程與藝術的關係，談到某個畫派：這是一種都市風格的繪畫，畫家透過城市人的眼睛看世界，捕捉城市事物須臾即逝的瞬時性、改變性和機會性。他們喜愛鮮明的顏色，但常把一片均匀的色彩分解成小點，有如一群無固定形狀的點集合。他們常以日常生活素材入畫，如：星期天的人群或熙攘的街景。這個畫派應是：
  options:
  - label: A
    content: 十九世紀前期，新古典主義
  - label: B
    content: 十九世紀中期，寫實主義
  - label: C
    content: 十九世紀後期，印象主義
  - label: D
    content: 二十世紀前期，表現主義
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 某書出版過程中，遭到殺蟲劑製造商的大力打壓。如Velsicol公司即控告該書的出版社，意圖以法律手段阻止該書的出版。美國氰胺公司的生化學家更表示：「如果跟隨此人論點，我們將回到黑暗時代，而讓昆蟲、疾病和害蟲再次占據這塊土地。」根據上述內容與所學，何者符合史實？
  options:
  - label: A
    content: 此書在20世紀中期出版，作者是奧爾多·李奧波德
  - label: B
    content: 此書是重要的環保運動作品《沙郡年紀》
  - label: C
    content: 此書促成美國成為全球第一個成立國家環保署的國家
  - label: D
    content: 該書被翻譯成多國語言，影響許多國家開始嚴格管制化學農藥的使用
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 家嘉是藝術史專欄作家，這次她選擇古羅馬藝術為專欄主題，請問下列何者適合放入她這次的專題文章中？
  options:
  - label: A
    content: 帕德嫩神廟的浮雕
  - label: B
    content: 勞孔群像的人體雕塑
  - label: C
    content: 卡拉瓦喬畫的聖馬太蒙召圖
  - label: D
    content: 圖拉真紀念柱
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 時代變動常反映在文人的藝術創作上，清末以來的畫家在接觸西方繪畫後，讓中國繪畫藝術有何種發展趨勢？
  options:
  - label: A
    content: 強化了寫實精神，在繪畫中融入道德教化功能
  - label: B
    content: 抽象概念結合詩意融入畫作，使中西繪畫融合
  - label: C
    content: 出現題跋愈來愈多的現象，以書法入畫強化中國元素
  - label: D
    content: 致力探索在地文化特質，融合西方繪畫技巧與傳統東方美學
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「石化產業」是指以石油或天然氣為原料，製造化學品的產業，其製成品稱為石化產品。關於該產業的發展，下列敘述何者正確？
  options:
  - label: A
    content: 石化產業帶動工業革命的發展
  - label: B
    content: 石化產業的發展與石化燃料的高度需求有關
  - label: C
    content: 石化產品是因第一次世界大戰時的需求才出現
  - label: D
    content: 環保意識的抬頭，使現今石化產業只剩燃料用途
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 從文化發展的歷史角度來說，由於前一時期過度講求理性，使得感情受到束縛，因而興起對「理性」的反動、強調個人情感自由的思潮。然而又因過度抒發情感而產生不切實際的流弊、轉而漸被描繪社會真實面目的新思潮取而代之。下列何者符合上述文化發展轉變？
  options:
  - label: A
    content: 啟蒙運動→寫實主義→現代主義
  - label: B
    content: 啟蒙運動→浪漫主義→寫實主義
  - label: C
    content: 寫實主義→浪漫主義→現代主義
  - label: D
    content: 現代主義→浪漫主義→後現代主義
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 石化產業排放的廢氣會對人體健康產生直接或間接的影響，例如臺大公衛系教授曾研究臺灣某地區因鄰近的煉油廠大火，空汙嚴重影響當地居民健康，其癌症發生率高出同縣其他地區居民1.29倍，該地是：
  options:
  - label: A
    content: 臺中沙鹿
  - label: B
    content: 雲林麥寮
  - label: C
    content: 高雄林園
  - label: D
    content: 花蓮玉里
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 學者考察英格蘭生態史的變化：經過羅馬人、薩克森人、丹麥人與諾曼人數波開發，到13世紀下半期，英格蘭野生森林已砍伐殆盡。14世紀後期和15世紀時，森林一度又覆蓋部分英格蘭大地，但15世紀晚期後，隨著人口復甦，林地再遭到清理，變成村落、農地或牧地。請依所學判斷、14世紀後期，森林重返英格蘭大地，最可能與下列何者有關？
  options:
  - label: A
    content: 諾曼人征服，平民遭到殘殺，解除環境的負荷
  - label: B
    content: 十字軍東征，人民大量離鄉，紓解環境的負荷
  - label: C
    content: 黑死病流行，人口大量死亡，降低環境的負荷
  - label: D
    content: 英法百年戰爭爆發，英人傷亡重，減緩環境負荷
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 有學者讚揚15世紀歐洲某項技術的發展，認為此技術推動了西方文藝復興、宗教改革運動等歷史發展，稱得上是重大的「革命」。這位學者讚揚的是：
  options:
  - label: A
    content: 重商主義下的經商技術
  - label: B
    content: 造紙術
  - label: C
    content: 航海技術
  - label: D
    content: 活字印刷術
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 在新北市中和區，有一個民間團體根據其成員的習俗舉辦活動，但因為當時中南部缺水，為避免浪費水資源，而改以紫檀花樹葉灑淨祈福來代替潑水，並請高僧引導儀式。儘管如此，現場還是有民眾自備水桶，讓小朋友玩水槍，享受傳統習俗的歡樂。請問此民間團體最有可能為以下何者？
  options:
  - label: A
    content: 慈濟功德會
  - label: B
    content: 原住民族文化復興會
  - label: C
    content: 緬甸歸僑協會
  - label: D
    content: 基督教長老教會
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 十九世紀初，英國駐君士坦丁堡公使聲稱取得鄂圖曼帝國蘇丹的同意，允許他在衛城繪製翻鑄其中的古物，甚至可將雕像運回英國，他因此蒐羅大批雕塑(主要來自帕德嫩神殿)攜回英國。此事大受非議，更被痛斥為摧殘文化藝術的騙子。最後在1816年，該公使以遠低於相關花費的價格，將文物賣給現在的大英博物館，至今仍在展出。請問這些雕塑作品來自哪個城市？
  options:
  - label: A
    content: 君士坦丁堡
  - label: B
    content: 雅典
  - label: C
    content: 開羅
  - label: D
    content: 羅馬
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 《祭姪文稿》，全名《祭姪贈贊善大夫季明文文稿》，後世譽為「天下行書第二」，真跡現收藏於臺北故宮博物院。書寫時間是乾元元年九月初三(西元758年10月9日)，此祭文是書法家為追思其姪(季明)在□變亂時被俘，不投降而被殺。□變亂應是指以下何事？
  options:
  - label: A
    content: 安史之亂
  - label: B
    content: 永嘉之禍
  - label: C
    content: 靖難之變
  - label: D
    content: 靖康之禍
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「文化改造樹」指的是已被原住民族使用過的樹木，仍可作為其傳統森林永續利用的一部分。它可分為三類：表皮剝除樹、原住民砍伐樹、其他改造樹。請問上述應該是學者對哪個地區原住民族有智慧地利用自然資源的觀察？
  options:
  - label: A
    content: 北美
  - label: B
    content: 西歐
  - label: C
    content: 東亞
  - label: D
    content: 南非
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 科潘城約在5世紀興起，為馬雅文明的代表城邦之一。7世紀中葉後，科潘出現自然資源開發過度的情形，人們為搶奪資源而爆發衝突，但國王仍大量興建宏偉紀念碑與神廟。至13世紀中，科潘城終因環境惡化與人口減少而被遺棄。請問：上文反映科潘城的何種歷史現象？
  options:
  - label: A
    content: 統治者無視國內動亂，仍大興土木工程
  - label: B
    content: 統治者花重金從外地採買巨大石雕藝術品
  - label: C
    content: 若非開發過度，這樣高度發展的文明會被繼續保存至今
  - label: D
    content: 科潘城只有土木工程技術人員，缺乏農人與維持治安的人員
- id: doc_112_桃園_武陵_社會_歷史_選修歷史II_g12s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 耶路撒冷是許多宗教的聖地，每年的12月，以色列會在耶路撒冷舉行為期三週的燈光秀，讓不同的宗教信仰在此交流並增加理解。請問：哪些宗教最有可能在此時此地進行交流？
  options:
