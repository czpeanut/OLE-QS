  page: 2
  stem: 中國傳統繪畫有一特色，就是觀賞者可以從題名探知創作者主題意念。老師在課堂簡報中放了兩幅名畫的圖片：《早春圖》及《鵲華秋色圖》。請問：下列何者是對這兩幅作品較貼近的解讀？
  options:
