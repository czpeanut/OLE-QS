  stem: 請問受《常識》所影響的○國是指哪一個國家？ 答：＿＿＿＿＿
  group_stem: (一) 資料一： 歴史課上同學們正在討論某歷史思潮的發展歷程。阿文在其所著的《常識》(1776)一書中，提醒人們「任何對英國的順從或依賴，將直接造成介入該國在歐洲的戰爭與紛擾，並使我們與鄰邦不睦，招來不必要的憤怒或抱怨」。 資料二： 《常識》的論證可謂情理的結合，達到動之以情，說之以理的境界。一方面以邏輯思維論證英國的罪惡和○國的權利，一方面有用激昂的詞句振奮殖民地人民反抗的決心，《常識》出版三個月內就發行了十多萬冊，徹底改變了保守派的態度，為＿＿＿＿＿打下了理論依據。史學家就曾評論《常識》說：「《常識》把國王與議會的權威撕成了碎片。從那以來，除《湯姆叔叔的小屋》之外，在○國再也沒有一個出版物曾發生那樣巨大的影響。」
