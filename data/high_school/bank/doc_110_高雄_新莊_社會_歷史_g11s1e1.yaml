  group_stem: (一) 資料一： 某人曾在他改革教會的文書上寫道：「赦罪應與真正内心的懺悔同步進行，直到進入天國；教宗沒有免除任何罪孽的意志與權力，他只能赦免憑自己的權力或《教會法》加於人們的懲罰。」、「基督徒如果真誠的悔改，就能從上帝得到恩典的赦免，得救與贖罪券並沒有任何關聯。……上帝透過恩典與憐憫，使我們能因信稱義。」後來，他的改革終止了中世紀天主教教會在歐洲的獨一地位。 資料二： 某一教派認為：神在創世以前，即已揀選祂要拯救的人，也遺棄了其餘的人。所以，一個人會得救，在這個人出生之前就已決定了，跟祈禱與行善都毫無相關。一個人必須被神所預定得救，蒙有效的呼召而得到神賜給他的信心，然後才會願意相信耶穌基督。天選之人想要墮落都不行，是為「不可抗拒的恩典」，且一旦得救永恆得救，永遠不會失去他們得到的救恩。
