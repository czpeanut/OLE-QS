  - label: D
    content: 亞當．斯密認為政府不應干預社會的自由發展
  group_stem: (四) 資料一： 舊世界國家的中產階級認為：工人理應貧窮，階級愈低的人，經濟愈差。如果有人錢多了，買起奢侈品來，雇主會打從心底感到不舒服，他們認為奢侈品只有他們能購買，礦工怎麼能跟鋼琴、香檳扯在一起呢？英、法等國給勞動階級定下的經濟最高標準就是吃得飽，吃得稍好，有間不算過分擁擠的住房，遺憾的是為數眾多的工人離這個「最高標準」仍相距甚遠。對中產階級而言，將工資提高到超過這個標準是不必要、不合適，甚至是危險的事。 在某個意義上來說，工資關係逐漸改革，變成一種純市場關係，一種現金交易關係。平均僱傭期限缩短了，工資發放時間逐漸縮短到一個星期，甚至一天或一個小時，使市場的討價還價變得更敏感。另一方面，中産階級認為自己的生活方式是天經地義的，但工人如果要求和他們過相同的生活，他們會驚得目瞪口呆。而如果工人看來似乎就要享受這種生活，他們會更嚇得惶惶不可終日，生活和期望的不平等，已經灌注在制度之中。 資料二： 工業革命為人類社會帶來物質生活的提升，但相對的，歐洲各工業大城都出現大量的工人群眾。他們居住在擁擠的貧民區，工作環境惡劣，工時既長、工資又微薄，生活困難的情形日益嚴重，許多關心社會問題的人士注意到這些不合理的現象，他們組織社團、提出各種改革主張，社會主義(Socialism)因此在各國發展。
