  - label: B
    content: 宗教改革
  - label: C
    content: 文藝復興
  - label: D
    content: 工業革命
  group_stem: (二) 資料一： 比可(Pico della Minandola)一場題為「論人的尊嚴」的演講中提到上帝對亞當的說法：「我給予你未確定的地位，也未讓你有特定的秉性，更未給你某一特權，其目的即在讓你自己經由決定與選擇，去形成你的地位、你的稟性、你的特權。自然界中的生物，都經由我規律且限制，你將決定本性，不會有所妨礙，因我給你自由的能力，我將你置於世界中央，以便你可對事物看得更仔细些。」「在人的誕生時，神已經將各種的可能性賦予給人了。各種生命形式，都给予了人。人倘若賦予了植物性，那他就成為一植物；倘若賦予了感覺性，那他就會成為一野獸；倘若他具有了理性，那他將顯示出他出自於上天；倘若他賦予了智性，那他將是一位天使而且就像是神的兒子。」 資料二： 貝帝士塔(Battista)「以拉丁文寫詩的能力，是一位受過教育的人的基本特徵。我現在願再加上一種語文，至少對我而言是同等重要的，即對希臘文學及希臘語文的熟悉，我們必須毫不懷疑說希臘語文對學者的要求是無庸置疑的。」 資料三： 史羅烏斯(Aeneas Syloius)：「鼓勵母親與孩子講本國語，學校中使用本國語，鼓勵教師用方言，使教學更加有趣與容易。一切法律條文，僅以本國語文書寫，以本國語文解釋。」「關於自然事實的知識：我要你們慎重地加以注意，因而在海、河、池、小漠、深淵中的魚，你們都能認識到。所有的鳥、樹、灌木、花、果實、地上的草，深穴中的金屬礦物，你們都能夠予以了解。」
