    (三) 18世紀開始，哲士們相信自然界有運行的「自然法則」，宇宙存在一位造物主，造物主創造自然世界後，使其依自然法則運行，不加以干涉。某歷史教科書簡介一位著名的法國政治思想家時，曾寫道：「此人的政治理論影響近代甚鉅，其著作是他一生辛勤研究的成果，也是他政治理論的總結。他著名的政治理論有以下三個方面： ①關於政治分類的學說，他將政治體制劃分為共和、君主、專制三種；他認為這三種政體的原則分別是品德、榮譽和恐懼。 ②分權說和君主立憲，他的分權說並非空洞的政治理論，而是順應時代的步伐所提出具有實際意義的政治綱領，其實質在於「階級分權」，在當時適應了新興資產階級參與政權的需要。 ③「地理」說，這個著名的理論認為地理環境，尤其是氣候、土壤等因素與人民的性格、感情發生直接的關係，法律應考慮這些因素。試問：'
