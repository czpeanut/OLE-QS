questions:
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 哲學家費西諾在致教宗尼古拉五世的信中描述，「人是上帝派遣的牧師，培育世間萬物，人不僅利用世界中的一切，而且所有的動物亦歸他利用，地球上的動物、水、空氣和食物，以至於各種便利、快樂，和更為高尚的宗教知識與奇蹟，都是人類創造的。」米開朗基羅的名畫〈創世紀〉把人類與上帝並列，費西諾與米開朗基羅各隸屬不同的領域，但同時說明了哪一項特點？
  options:
  - label: A
    content: 宗教信仰不違背教會旨意
  - label: B
    content: 宗教信仰固然重要，但人類的價值地位是不容小覷的
  - label: C
    content: 批評教會的腐敗，必須將之推翻
  - label: D
    content: 教會本身並不腐敗，而是教士水準低落
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 法蘭克國王查理曼因為協助羅馬教宗平定亂事，在公元800年的聖誕節，獲得教宗加冕為「羅馬人的皇帝」。此事象徵何種歷史意義？
  options:
  - label: A
    content: 顯示西歐形成政教合一的體制
  - label: B
    content: 反映査理曼與教會的合作關係
  - label: C
    content: 象徵「神聖羅馬帝國」的成立
  - label: D
    content: 代表查理曼兼任教會最高領袖
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 向薇搭著時光機來到14世紀中葉的義大利威尼斯，她可能會看到何種景象？
  options:
  - label: A
    content: 商人政治、社會地位低落，因此經常與無產階級聯合對抗統治者
  - label: B
    content: 城市相當熱鬧，許多商人在銀行兌換貨幣，商人也很鼓勵文藝活動
  - label: C
    content: 聽人閒聊起太陽為宇宙中心的說法，想要深入了解，遂到書店去尋找哥白尼的著作《論天體之運行》
  - label: D
    content: 在觀光時，正逢蒙古大軍來襲，他山上避難的經歷，也是薄伽丘寫《十日談》的寫作背景
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 他是當時有名的作家，曾因支持洛克的理論而入獄三個月。他認為知識不應該過於專門，所以網羅最優秀的專家，共同編纂一部影響當代深遠的典籍，充分展現出啟蒙運動的精神。請問：「他」指的是何人？
  options:
  - label: A
    content: 伏爾泰
  - label: B
    content: 盧梭
  - label: C
    content: 孟德斯鳩
  - label: D
    content: 狄德羅
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1776年英國歷史學家吉朋的著作《羅馬帝國衰亡史》中提到：「過去四千年的經驗應該增加了我們的希望並消除了我們的憂慮，儘管不能確定人類朝向完美境界的發展可以到達何等程度，但我們可以確定，除非自然改變，否則沒有一個民族會倒退為原始野蠻的狀態。…羅馬時代的奧古斯都與圖拉真盛世已經被無知的蠻人世界所取代，日耳曼人已將羅馬的法律推翻，但農民的鐮刀仍在義大利的土地上收割。…我們可以欣慰地结論，歷史上任何一個時代都在增加人類的財富、幸福、知識、乃至道德，過去如此，以後也會如此。」根據上文，可推論出在啟蒙時期的哲學家心目中，世界觀的基礎論調為何？
  options:
  - label: A
    content: 樂觀的進步觀念
  - label: B
    content: 悲觀的末世論調
  - label: C
    content: 回還往復的分合交替
  - label: D
    content: 西方世界優於東方世界
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列何者是英國經濟學家亞當‧斯密的經濟理論？
  options:
  - label: A
    content: 主張政府可以對經濟活動做有限的干預
  - label: B
    content: 激烈的競爭最後會經由市場的供需程度來逐步達到平衡
  - label: C
    content: 在國家出現經濟危機時，政府可以無限制的採取干預行動
  - label: D
    content: 認為政府可以增加稅收和開闢稅源
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 如果我們要討論柏拉圖，以下敘述何者正確？
  options:
  - label: A
    content: 關心人生的意義與目的，認識自己，拓展自己的心智以分辨真正的善
  - label: B
    content: 教育的目的就在找尋真正的理念、注重品格，引導他們具有自己思想的能力
  - label: C
    content: 從感官經驗出發後，再依照嚴格的邏輯推理來探究一切事理
  - label: D
    content: 宇宙萬物的運行都依照神聖的藍圖，人依此藍圖行動，才能達到幸福
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 歴史教科書中描述某場戰爭：此為歐洲第一次大規模的國際戰爭，主要戰場在日耳曼地區，因而使該地的經濟遭到極大破壞，而戰後所簽訂的和約，不但影響到國際關係的發展，也確立國家獨立主權的原則。這場戰爭是
  options:
  - label: A
    content: 三十年戰爭
  - label: B
    content: 七年戰爭
  - label: C
    content: 第一次世界大戰
  - label: D
    content: 第二次世界大戰
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 某人是古希臘時代第一位將哲學獨立為單一學科的學者。他也分別研究邏輯、倫理學、政治學、天文學、生物學與物理學等各門學科，是當時最博學的思想家；請問下列何者可說明此人的影響？
  options:
  - label: A
    content: 是第一位用水來解釋宇宙萬物的本質
  - label: B
    content: 強調用數學和邏輯來論證科學的方法
  - label: C
    content: 建立一種不可見不可知的形上學概念
  - label: D
    content: 擅長雄辯之術，為辯士學派代表人物
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 古埃及的舊王國時期，以孟斐斯為首都，此地區崇拜的「雷(Re)」，不但是眾神之首，也是象徵公平、正義與真理的太陽神；中王國時期，首都搬遷到尼羅河中游的底比斯，此地的「阿蒙(Anon)」神地位逐漸提高；新王國時期，兩者合成「阿蒙一雷(Annon-Re)」，是為新的太陽神。如果我們要總結上文的敘述，下列何者是最適切的結論？
  options:
  - label: A
    content: 古埃及是多族群融合的社會，風氣開放日自由
  - label: B
    content: 古埃及中央政治權力逐漸由地方勢力取而代之
  - label: C
    content: 古埃及太陽神內涵的改變反映現實政治的變化
  - label: D
    content: 古埃及歷史中，太陽神地位不斷受挑戰而下降
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 1851年，英國在首都倫敦舉辦世界上首次的萬國博覽會，當時特別在海德公園興建精緻典雅的水晶宮做為博覽會的主會場。請問世界博覽會的舉辦以及水晶宮建築的興建，對英國來說具有何種重要意義？
  options:
  - label: A
    content: 彰顯英國海外貿易成果
  - label: B
    content: 宣揚英國民主政治成就
  - label: C
    content: 展現英國工業革命成就
  - label: D
    content: 紀念英國科學革命貢獻
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 神聖羅馬帝國皇帝亨利四世寫給教宗格列哥里七世的信：「……至於我，一個多罪而又沒有快樂的人。……由於用人不當，所以得罪天主，也得罪你；我不但侵犯了教會的財産，而且將教堂售與不適當的人──他們因而犯了買賣神職之罪，不從正門進入，而我也沒有盡力保護各地教會……。」上文可以理解為
  options:
  - label: A
    content: 皇帝如此的低姿態，證明「政教」合作是成功的
  - label: B
    content: 教宗格列哥里七世的強勢，從此引爆了「政教」之爭
  - label: C
    content: 教會有開除教籍和停止教務之權，亨利四世不得不低頭
  - label: D
    content: 亨利四世對格列哥里七世屈服，從此結束了「政教」對抗
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 資料一：要向我學知識，你必須先有強烈的求知慾望，就像你有強烈的求生慾望一樣。 資料二：思想應當誕生在學生的心理，教師僅僅應當像助產士那樣辦事。 資料三：最有效的教育方法不是告訴人們答案，而是向他們提問。 三則資料最有可能出自何人之口？
  options:
  - label: A
    content: 泰利斯
  - label: B
    content: 普羅泰哥拉斯
  - label: C
    content: 柏拉圖
  - label: D
    content: 蘇格拉底
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 亞當．斯密時代的英國處於原始資本主義階段，龐大的資本家集團腐蝕了英國的議會而通過了許多壓抑勞工圖利資本家的議案，同時英國的資本家透過大英帝國的擴張掠奪了大量殖民地，甚至使得大英帝國的子民也付出了極其沉重的代價。因此，亞當．斯密在《國富論》中痛斥資本家通過操縱和賄賂政客來剝削工人。亞當．斯密也譴責英國剝削殖民地人民，而且國家內部的工人也遭受了嚴重剝削。請問《國富論》無法在當時實踐，是因為當時盛行哪一思潮？
  options:
  - label: A
    content: 帝國主義
  - label: B
    content: 社會主義
  - label: C
    content: 自由主義
  - label: D
    content: 保守主義
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 某一時期，英國國王下令關閉修道院，沒收教會財產，將其土地出售給富人，不僅獲得巨大利益，也調整政教關係。依據題文資訊，上述事件最可能發生於何時？
  options:
  - label: A
    content: 13世紀約翰王簽署《大憲章》，重新確認國王與貴族的關係
  - label: B
    content: 15世紀百年戰爭後，英王放棄在法國權力轉而注重內政
  - label: C
    content: 16世紀宗教改革時，英王欲排除羅馬公教在英國的勢力
  - label: D
    content: 17世紀時英王迫害清教徒，許多清教徒流亡北美洲地區
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 科學革命時代，有科學家提出機械論解釋整個宇宙自然界的運轉：啟蒙運動時期的知識分子，強調人所擁有的天賦權利。前者以自然為主，後者強調人文，看似風馬牛不相及，但是都有一共通的「啟蒙」特色，請問應是下列何者？
  options:
  - label: A
    content: 論述進步史觀
  - label: B
    content: 重視感官經驗
  - label: C
    content: 強調改變的重要
  - label: D
    content: 尋求自然法則
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 很多人誤以為，英王亨利八世另立英國國教派的原因，僅是單純的婚姻問題，但實際上則有著複雜因素。試問下列分析亨利八世創立英國國教的其他原因何者正確？ 丹尼：「經濟上：他企圖脫離羅馬教會對英國境內教產的掌控。」 索爾：「政治上：亨利八世企圖脫離羅馬教會的控制。」 浩克：「婚姻上：他想離婚，再另娶西班牙公主為妻，以增加英國的政治影響力。」 約翰：「思想上：他反對天主教的教義，因此另創新教。」 請問以上哪些同學的說法是正確的？
  options:
  - label: A
    content: 丹尼、索爾
  - label: B
    content: 丹尼、索爾、約翰
  - label: C
    content: 索爾、浩克、約翰
  - label: D
    content: 以上皆對
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 在政教衝突的理論上，「兩劍論」為教宗派在政教之爭中，發展出來的說法，其大要是：上帝有兩把劍(權力)，一把代表神聖權力(屬靈的)，一把代表世俗權力，這兩者當中，又以掌握神聖權力的劍，高於掌握世俗權力的劍。11世紀後，在教會改革的趨勢下，多位教宗開始積極重振教會領導權。其中格列哥里七世特別強調教宗的某一權力，因而造成當時神聖羅馬帝國皇帝亨利四世與教宗產生對立，此事件即「俗人授職衝突」。請問這位教宗的主張應是
  options:
  - label: A
    content: 教宗有直接任命皇帝的權力
  - label: B
    content: 教宗有任免主教以及罷黜皇帝的權力
  - label: C
    content: 教宗有主持皇帝就任典禮的權力
  - label: D
    content: 教宗有遵從皇帝指示任免主教的義務
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 一位西方哲學家發現幾條規則：「凡是我沒有明確地認識到的東西，我絕不把它當成真的接受。把我所審查的每一個難題按照可能和必要的程度分成若干部分，以便一一妥為解決。按次序進行我的思考，從最簡單、最容易認識的對象開始，一點一點逐步上升，直到認識最複雜的對象。在任何情況之下，都要儘量全面地考察、普遍地複查，做到確信毫無遺漏。」請問這位哲學家是誰？
  options:
  - label: A
    content: 培根
  - label: B
    content: 笛卡兒
  - label: C
    content: 伏爾泰
  - label: D
    content: 洛克
- id: doc_110_高雄_新莊_社會_歷史_g11s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 「巴比倫之囚」原指當年猶太人被兩河流域加爾底亞帝國打敗，被迫由耶路撒冷遷往巴比倫一事。中古西歐基督教史上，也曾發生類似情節而引用此稱呼，請問下列就此事或此事造成的影響之敘述，何者正確？
  options:
  - label: A
    content: 指1077年格列哥里七世革除亨利四世的教權，亨利四世被迫妥協，前往羅馬，在大雪中罰站向教皇「懺悔罪過」
  - label: B
