  stem: 以下說明，是有關近代婦女運動中一般所熟知的四波歷程。請問哪一個選項敘述內容符合實際發展狀況？
  options:
  - label: A
    content: 這四波婦女運動，是在 18 世紀開始的
  - label: B
    content: 婦女參政權應該是在最後一波才開始被提及的
  - label: C
    content: 第二波的婦女運動中，出現抗議物化女性的產業，與爭取婦女生育自主權
  - label: D
    content: 第四波婦女運動中，針對女性生活與壓迫問題，開始對女性個人解放進行著墨
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)第一波婦女權利運動發展於 19 世紀中期，以伊莉莎白．史坦登等人於紐約召開「辛尼卡瀑布會議」，並發表〈情感宣言〉為代表。(B)女性的參政權為第一波婦女運動所爭取的主要權利。(D)女性生活的個人壓迫與解放問題，主要在 1960 年代的第二波婦女運動風潮中被廣泛討論。

    20.1988 年 12 月，由《客家風雲》雜誌創辦者們所主導的「還我母語運動」，在臺北市舉行大遊行。此次運動的目標主要為抗議《廣播電視法》對方言節目的限制，並提倡建立多元化與開放性的新語言政策。他們透過將孫中山戴上口罩，發表「如果國父孫中山還活著的話，他上電視也不能說自己的客家話。」的宣言，藉以諷刺中華民國政府對客語的不平等對待，故答案選(A)。

    21.從該刊物針對憲法、總統權力不當的批判，以及反對國民黨一黨專政、開放黨禁等訴求，可判斷該刊物不可能為日治時期的《臺灣青年》、《臺灣民報》等雜誌，亦非為 1910 年代以建立中國新文化、啟蒙科學民主知識的《新青年》。正確選項為(D) 1950 年代的《自由中國》雜誌。

    22.引文討論唐代女性地位的特殊性，與其相符者為安樂公主，故答案選(B)。安樂公主本名李裹兒，為唐中宗與韋后之女，根據史書記載，她對政治頗具企圖心，並曾欲效法其祖母武則天稱帝，最終在李隆基策劃的唐隆之變中被刺身亡。(A)呂后、(C)鉤戈夫人為漢代人；(D)馬太后則為十六國時期前涼王張駿之妃。

    23.武則天執政時期的政績之一，即為透過培養科舉進士成為新興官僚，來對抗舊有以李氏為效忠對象、仍掌握實權的「關隴集團」，因此正確選項為(C)。(A)(B)「郡姓」為北魏時期掌握經學的漢人地方望族，與鮮卑族的「國姓」相對；後「郡姓」隨著北魏分裂，而分為山東郡姓、關中郡姓。在北周推行關中本位政策的背景下，關中郡姓逐漸與鮮卑貴族結合，成為影響隋唐政局發展的「關隴集團」。(D)江南吳姓則是江南地方世族，與跟隨晉室南遷的世族「僑姓」相對。

    24.19、20 世紀第一波婦女權利運動風潮的形成，就經濟面向分析，學者多認為和工業革命後，歐美女性開始投入經濟生產、獲得工資，使女性可以取得經濟獨立、不必依賴家庭，並提升家庭與社會地位相關。因此正確選項為(D)。

    25.(A)積極爭取教育、婚姻、就業等偏向個體的權益，為第二波婦女運動的特徵。(B)爭取參政權等集體權益，為第一波婦女運動的特徵。(D)抗議「物化女性」與挑戰傳統家庭價值，主要為第二波婦女運動的特徵。

    26.發生於 1853 ～ 1856 年間的「克里米亞戰爭」，被認為是世界史中第一次「現代化」戰爭，這場戰爭投入許多新型態的科技，包括鐵甲船、現代化火炮、壕溝戰、電報與天氣預報系統等，也是首次以電報系統傳送戰爭消息給報社進行「即時」報導，而英國政府還派出攝影師，為人類史上首次使用攝影技術來記錄戰爭。另外，以南丁格爾為首的志願性護理人員，亦投入後勤傷患照護的工作，並改善野戰醫院的衛生條件，故答案選(C)。

    27.伊莎貝拉一世（1451 ～ 1504）為伊比利半島卡斯提爾王國和萊昂王國的女王，其在位期間與丈夫亞拉岡國王斐迪南二世聯合共治，徹底驅逐穆斯林勢力，並在教宗允許下透過宗教裁判所強化王權，為日後的西班牙帝國提供基礎。(A)瑪麗一世為 16 世紀中期英格蘭女王，她雖然在英格蘭恢復舊教，但並未與穆斯林對抗。(B)伊莉莎白一世在位期間，改變瑪莉一世向舊教靠攏的政策，重建英格蘭聖公會。(D)作為俄羅斯皇帝的凱薩琳一世，信仰東正教。

    28.西漢前期所施行的「推恩眾建」政策，是源自於漢文帝時期賈誼《治安策》中「眾建諸侯而少其力」的策略，透過將過去封國由嫡長子繼承的制度，改為諸子均分制，以削弱諸侯國的勢力，並強化朝廷的集權化，故答案選(B)。

    29.中國傳統民間「宗族」的組織化，約成型於宋代。宋代因已不如前代得以長期維持門閥勢力，因此是士大夫階層透過組織親屬族人，倡宗法、建祠堂、興族產等方式，使「宗族」逐漸成形於民間社會。因此正確選項為(B)。

    30.本題測驗學生對中國傳統賦役制度演變的理解。資料一的「客戶」為宋代之「主戶、客戶」制度；資料二提及「量出制入」、夏秋兩季徵稅為唐代後期「兩稅法」的特徵；資料三的「成丁授田」和只問丁身徵稅，為隋至唐代中期實施的均田制、租庸調法特色。因此正確排序為(D)資料三、資料二、資料一。'
