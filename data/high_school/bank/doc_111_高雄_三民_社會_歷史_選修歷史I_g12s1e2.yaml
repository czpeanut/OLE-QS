  stem: '資料一：「清初《使琉球記》記載，宋朝福建湄洲的林默娘 28 歲時，因父兄駕船駛至閩江口海域，突遇巨風大浪，船毀人溺，默娘得知，飛身入海拯救父兄，因而罹難，遺體隨海漂至閩江口附近的竿塘島（今馬祖列島的南竿島），被漁民打撈上岸，並就近將她葬在岸邊。」

    資料二：「從宋徽宗到清咸豐皇帝為止，媽祖受歷代皇帝褒封多次，由『夫人』、『妃』、『天妃』，直至『天后』。」

