    資料二：1949 年之後國民黨政府仍然執行戰爭時期的管制經濟，整體經濟發展因而極為緩慢。不過，這個時期美援的挹注不但解決了臺灣財政赤字的危機和缺乏外匯的困境。透過美援棉花和「代紡代織」的政策。臺灣紡織工業因為聯合壟斷的利潤豐富而快速擴張。臺灣經濟起飛要等到國民黨 1960 年代初期將管制放鬆，以中小企業為主的出口部門在成衣出口的帶動下，整體經濟才能快速成長，並且逆向帶動紡織、染整、人纖和石化等工業的發展。

    關於上述兩則資料的描述，以下哪些敘述是正確的？'
