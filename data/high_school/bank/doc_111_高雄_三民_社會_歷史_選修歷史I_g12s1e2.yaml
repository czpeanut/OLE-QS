  explanation: '「官倒」為 1980 年代於中國出現的詞彙，所指的是具官方背景進行倒買倒賣的投機者。1989 年六四運動期間，抗爭者除了以自由、民主為號召外，「反官倒」亦成為抗爭者特別的訴求之一。而六四運動發生的同年，東歐舊蘇聯國家，也在波蘭開始進行政治改革後，陸續發生民主化革命，並結束共產黨專政體制。(A)(D)六四運動的起因為悼念甫逝世的胡耀邦，事件後中共中央總書記趙紫陽被迫下臺。

