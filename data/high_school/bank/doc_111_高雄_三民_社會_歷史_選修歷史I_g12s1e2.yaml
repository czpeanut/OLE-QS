  stem: 「這種虛報產量的事比比皆是。其中最著名的是河北徐水縣，號稱一年收穫糧食 12 億斤。1958 年 8 月 11 日的《人民日報》上發表了署名康濯的通訊報導，報導中說 1958 年 8 月 4 日毛澤東對當地進行了視察。毛高興地說：『你們全縣 31 萬多人口，怎麼能吃得完那麼多糧食啊？你們糧食多了怎麼辦啊？……要考慮怎麼吃糧食呢！……農業社員們自己多吃嘛！一天吃五頓也行嘛！』實際上，1957 年徐水的糧食畝產才剛剛 138 斤，其中夏糧畝產僅有 70 斤。」請問這種浮誇風是在什麼樣的背景下產生的？
  options:
  - label: A
    content: 雙百運動
  - label: B
    content: 三反五反
  - label: C
    content: 大躍進運動
  - label: D
    content: 農村合作化
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題目敘述中可得知，1958 年的中國社會出現浮報生產量的社會現象，其正反映中國共產黨於 1958 ～ 1961 年發起的「大躍進」，所產生的農、工業盲目追求不切實際產量的現象，「大躍進」亦導致了 1958 ～ 1962 年的大饑荒，故答案選(C)。(A)「雙百運動」指的是 1956 年由中共主導的百花齊放、百家爭鳴運動，隔年則以此發起反右鬥爭。(B)「三反五反」為中共於 1951 ～ 1952 年間發起的政治鬥爭，鬥爭對象為官僚與資本家。(D)「農村合作化」為中共於 1955 年發起的農業生產改造運動，其目標是完成農業的大規模分工、機械化與公有化。
