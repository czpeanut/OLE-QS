    35.本題為測驗學生對女性權利發展的認知。女性獲得接受高等教育的權利、女性投入第二次世界大戰的後勤支援工作等，促使女性各種權利的進步與提升；《第二姓》、《女性迷思》等著作，則為女性運動提供理論與思想層面的支援。(E)中國傳統社會對女性設下的「三從」規範，被視為服膺父權的道德限制。'
