  answer_status: verified
  answer_source: answer_key
  explanation: '(1)附圖中顯示當時的土地關係已剩下政府、小租戶與佃農三者，為日治初期臺灣總督府為掌控土地與稅收，在進行土地調查後，推行廢除大租戶的政策，自此一田二主制才終於消失。

    (2) 1949 年中華民國政府遷臺後，為避免重蹈國共戰爭失利的失敗經驗，並確立在臺軍隊糧食、財政與統治權威無虞，進而陸續推動三期的土地改革政策，分別是 1949 年的「三七五減租」，地租不高於收穫所得的 37.5 ％；1951 年的「公地放領」，公有地出售給農民；1953 年的「耕者有其田」，徵收地主土地轉售給農民，以排除地主勢力並提高農民生產意願。'
