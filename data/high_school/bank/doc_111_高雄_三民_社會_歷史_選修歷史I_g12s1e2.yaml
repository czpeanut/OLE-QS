- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 金日成與胡志明分別為朝鮮與越南共產政權的創建者，關於這兩位領導人物在執政時期的共同經驗，請問下列說明何者符合史實？
  options:
  - label: A
    content: 都曾經領導對日本與美國的作戰
  - label: B
    content: 都曾工作於黃埔軍校且加入中共
  - label: C
    content: 在外交上都曾支持中國抵制蘇聯
  - label: D
    content: 試圖透過改革開放解決經濟問題
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 金日成於 1930 年代曾加入中國共產黨所組織的東北人民革命軍、東北抗日聯軍等組織，進行抗日游擊戰，1950 年在蘇聯的支持下，以北韓政權發起韓戰，隔年與美軍為首的聯合國軍隊交戰。胡志明則是在 1941 年領導越南獨立同盟會，反抗法國殖民政府與日軍；1959 年起派遣北越士兵潛入南越進行反美游擊戰，進而引發越戰。(B)兩位皆曾加入中共，但不曾工作於黃埔軍校。(C)金日成執政期間，持續於中、蘇之間搖擺取利；胡志明則是嘗試扮演中、蘇之間的溝通橋樑。(D)二者皆堅持以共產主義解決經濟問題。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「知有兵事而不知有民政，知有外交而不知有內政，知有朝廷而不知有國家，知有洋務而不知有國務。」這是對中國近代史中哪一運動的評論？
  options:
  - label: A
    content: 清代同光年間的自強運動
  - label: B
    content: 清代光緒年間的戊戌變法
  - label: C
    content: 清末的立憲運動
  - label: D
    content: 清末的國民革命
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 引文為梁啟超對清末自強運動的評論。梁啟超批評自強運動只著重在軍事、外交層面的改革，而未考慮到社會、民生問題以及國家意識、文化與制度的現代化，因此最終導致自強運動的失敗，故答案選(A)。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '附表為 1910 年到 1940 年間臺灣人口的統計資料。表中丙、丁代表的族群分別是：

    | 年分 | 甲族群（萬） | 比率 ％ | 乙族群（萬） | 比率 ％ | 丙族群（萬） | 比率 ％ | 丁族群（萬） | 比率 ％ | 總計 （萬） |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1910 | 306 | 92.9 | 1.48 | 0.4 | 12.2 | 3.7 | 9.8 | 3.0 | 329.9 |

    | 1920 | 343 | 91.4 | 2.48 | 0.7 | 13.0 | 3.5 | 16.6 | 4.4 | 375.7 |

    | 1930 | 425 | 91.0 | 4.66 | 1.0 | 14.0 | 3.0 | 23.2 | 5.0 | 467.9 |

    | 1940 | 552 | 90.9 | 4.61 | 0.8 | 15.8 | 2.6 | 34.6 | 5.7 | 607.7 |'
  options:
  - label: A
    content: 丙為漢人、丁為原住民
  - label: B
    content: 丙為外國人、丁為漢人
  - label: C
    content: 丙為日本人、丁為外國人
  - label: D
    content: 丙為原住民、丁為日本人
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從本題表中可觀察到，甲族群在人口占比上，一直維持於九成左右，因此可推斷甲族群為漢人；乙族群的人口占比均未超過 1 ％，因此可判斷其為外國人（日治時期的外國人大宗為中國籍的「福廣人」）；丙族群占比逐年下降，而丁族群占比逐年上升，由此可推斷丙應為原住民族，丁為日本人。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 清治時期臺灣某地的人口分布如下：「居民七十九家，計二百五十七人，無土著。中有女眷者一人，年六十以上者六人，十六以下者無一人。皆丁壯力農，無妻室，無老耆幼童。」請問是什麼原因造成此現象？
  options:
  - label: A
    content: 清廷頒布「遷臺令」，強迫原住民全部移往中國
  - label: B
    content: 為提升生產力，禁止老幼婦孺留在臺灣
  - label: C
    content: 實施移民限制，僅准許單身男性渡臺
  - label: D
    content: 是一種積極的統治方式，目的為防止臺灣發生變亂
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從本題人口分布的描述，可得知該地呈現「幾乎為單身青壯年男性」的狀況，此為清治前期臺灣漢人社會在《渡臺禁令》的限制下，所形成的「羅漢腳」社會特徵，因此正確選項為(C)。(A)清廷並未實施此政策。(B)《渡臺禁令》是「限制攜家帶眷」，而非禁止老幼婦孺留在臺灣。(D)渡臺禁令限制攜眷的規定乃是希望避免移民在臺落地生根，而產生大規模的叛亂勢力，因而被視為被動消極的統治政策。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有件古文書內容寫道：「仝（同）立典契人新港社番王覽莫、劉東、恩劉等有承祖父竹圍壹所向菓子在內，併帶山園連田……嘉慶柒年拾貳月。日立典契人新港社番王氏覽莫、孫恩劉、劉東。為中人薛錦叔。代書人阿日。」而古文書的另一半卻是一連串的外文拼音文句。請問依照文句內容及歷史知識去判斷，為何這件古文書會有一連串的外文？
  options:
  - label: A
    content: 由於嘉慶年間外國人可到廣州通商，故簽訂的通商條約有外文
  - label: B
    content: 這是荷蘭占臺時期，傳教士在臺灣創建拼音文字，後世延用寫下的土地契約
  - label: C
    content: 這是臺灣開港之後，外國商人與臺灣地區原住民頭目簽訂的貿易條約
  - label: D
    content: 這是在清領前期，走私貿易的外國人與原住民頭目簽訂的土地契約
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從引文中可發現該契約為立約人為新港社人，且時間為清治前期，因此可判斷該文書出現的外文拼音文句，應為使用「新港文書」所書寫，正確選項為(B)。(A)此為臺灣新港社人所簽訂的契約。(C)目前使用「新港文書」所書寫的契約，最晚僅發現至 1813 年的契約，因此開港通商後已不會使用此種文字簽訂契約。(D)清治前期在清廷政策的限制下，並不會有此狀況出現。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 臺灣在各個時期對於原住民族的政策都有其特色及作法，請將下面各項敘述按照其時間排序。(甲)族群共生共和，創造共榮之願景；(乙)將其以漢化與服從程度作為劃分；(丙)藉理蕃為開發山區資源之手段；(丁)透過長老與地方會議來管理掌控
  options:
  - label: A
    content: (乙)(甲)(丁)(丙)
  - label: B
    content: (丁)(乙)(丙)(甲)
  - label: C
    content: (丙)(甲)(乙)(丁)
  - label: D
    content: (甲)(丁)(丙)(乙)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)所指應為當代經歷原住民族復振運動後，透過《原住民族基本法》等法律，確立族群之間的平等共存關係；(乙)反映清代官方對原住民族的政策，以漢化、服從、納稅等層面，將原住民族分為「生番」、「化番」、「熟番」等；(丙)則為日治時期的原住民族政策，總督府在欲開發山林資源的動機下，推行「理蕃」以有效控制原住民；(丁)此為荷蘭聯合東印度公司的原住民族政策，荷蘭人透過任命長老、召開地方會議等方式，來掌控原住民部落。因此正確順序為(B)(丁)(乙)(丙)(甲)。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 明末清初時，中國人口大幅增加，臺灣是當時漢人移民的一個重要目的地。清政府原對閩粵地區移民臺灣抱持禁止的態度，但是大陸渡海來臺的移民源源不斷，於是出現如下的政策與報告：(甲)政府公布：「臺地現在開闢後山，舊例應行弛禁，所有從前不准內地人民渡臺及私入番境各例禁，已一律開除，不復禁止。」(乙)地方官報告：「流移開墾之眾，已漸過斗六門以北矣。」(丙)地方官報告：「流移開墾之眾，漸過半線、大肚溪以北矣。」請問這些事件發生的時間順序應為何？
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (乙)(丙)(甲)
  - label: C
    content: (甲)(丙)(乙)
  - label: D
    content: (丙)(乙)(甲)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)從臺灣已開始開闢後山、渡臺與番地禁令廢止等敘述，可判斷此為清末「開山撫番」的政策；(乙)(丙)皆為說明移墾民眾的勢力發展，清代臺灣漢人移墾的趨勢為由南向北，因此(乙)會早於(丙)。正確時間順序為(B)(乙)(丙)(甲)。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 有一幅畫卷描繪某個城市的景象：街市縱橫，店鋪林立，車馬行人摩肩接踵。河道兩岸有佛寺、戲臺、茶莊、金銀店、中藥店，乃至豬行、羊行、糧油穀行，應有盡有。特別是店鋪高懸「東西兩洋貨物俱全」、「川廣雜貨」、「萬源號銀鋪」等招牌。這個城市最可能是
  options:
  - label: A
    content: 齊國臨淄
  - label: B
    content: 漢代長安
  - label: C
    content: 唐代洛陽
  - label: D
    content: 明代南京
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 本題為測驗學生對於中國古代社會城市生活的理解。題目敘述中出現「茶莊、戲臺」皆為宋代後所盛行；「東西兩洋」的概念為宋、元兩代，與海外頻繁交流後逐漸成形，「貨物俱全」也反映 16 世紀後，東西商貿交流盛行的情形；「銀鋪」則是因明代白銀大量流通而出現，故答案選(D)。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '以下兩段為明初的資料：

    資料一：諸虜（蒙古人）歸附者，不宜處邊；蓋夷狄之情無常，方其勢窮力屈，不得已而來歸，及其安養閒暇，不無觀望於期間，恐一旦反側，邊鎮不能制也。宜遷之內地，庶無後患。

    資料二：凡治胡虜（蒙古人），當順其性，胡人失其本性，反易為亂。不若順而撫之，使其歸就邊地，擇水草孳牧，彼得遂其生，自然安矣。

    請問根據以上兩資料，下列敘述何者正確？'
  options:
  - label: A
    content: 兩段資料意見相同，均反對外族遷徙內地
  - label: B
    content: 資料一反對外族遷徙內地，資料二贊成
  - label: C
    content: 資料一贊成外族遷徙內地，資料二反對
  - label: D
    content: 最後採取資料二的意見，將虜留在邊地
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 本題為測驗學生對於史料的閱讀理解能力。資料一認為蒙古人歸順只是權宜之計，一旦反叛，邊鎮軍隊將無力處理，因此應將蒙古人遷入塞內以便就近管理；資料二則認為蒙古人本來就是草原民族，若將其強制遷入塞內，他們失去本性反而容易作亂，因此管理政策應當順其自然。由此可判斷正確選項為(C)。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 一位在臺任職的官員向長官報告，指出：「為獲得『蕃地』的經濟利益，我們必須使用武力，沒收『蕃人』的槍枝，讓他們放棄狩獵生活，並強制將他們移居接近平地的河川地，從事農耕，以便加強控制。」這種觀點的歷史背景是
  options:
  - label: A
    content: 明鄭時期積極開發山地，以期對抗滿清
  - label: B
    content: 沈葆楨為了取得林業資源，開山「撫番」
  - label: C
    content: 劉銘傳為了樟腦利益，採行「撫番」政策
  - label: D
    content: 日本為掌握山地資源，控制「蕃地秩序」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題目「開發蕃地經濟」、「沒收槍枝」、「強制移居、改變生活模式」等敘述，可判斷此為日治時期「理蕃政策」的特徵，故答案選(D)。(A)鄭氏時期活動範圍主要為平原至近山一帶，並未積極開發山地資源。(B)沈葆楨執政時期推行「開山撫番」政策的目的，主要為避免「番地無主論」持續發酵，這是基於國防目的。(C)劉銘傳「撫番」政策的部分目的雖是為了樟腦等山林資源，但其所採取的作法主要為以武力征服、驅趕反抗的原住民部落，並鼓勵漢人遷入深山開墾，而這樣的作法也並未獲得太大的成效。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 有位學者感嘆：竟然有儒者固守舊說，不了解社會變化，仍將工商業看成末流，並有壓抑工商業的主張，他認為工業原本就受到古代聖王肯定，商業又能幫助生產者流通物品，二者都是根本。他這種思想反映何種時代背景？
  options:
  - label: A
    content: 戰國，戰亂頻仍，經濟倒退，才會提倡工商以改善民生
  - label: B
    content: 魏晉，莊園經濟妨礙商業活動，有識之士提出改善意見
  - label: C
    content: 隋唐，胡商絡繹來華，壟斷市場，激起民間的反商情結
  - label: D
    content: 明清，工商業雖然發達，仍有士人對工商業者懷有成見
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題目敘述中可得知，這位學者主要批判傳統「重農抑商」的思想，並提倡發展工商業，其思想的背景最可能出現在手工業與商業較為發達的明清時期。明末清初的著名學者黃宗羲，在他的著作《明夷待訪錄》中提到：「世儒不察，以工商為末，妄議抑之。夫工固聖王之所欲來，商又使其願出於途者，蓋皆本也。」所反映的就是「工商皆本」並批判「重農抑商」的思想。由此可判斷正確選項為(D)。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e2_s1_12
  section: 1
