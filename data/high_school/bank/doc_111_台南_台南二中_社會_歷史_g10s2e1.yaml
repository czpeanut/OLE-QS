  stem: 〈捕蛇者說〉裡有一段文字寫到：「永州之野產異蛇：黑質而白章，觸草木盡死；以齧人，無御之者。然得而腊之以為餌，可以已大風、攣踠、瘻癘，去死肌，殺三蟲。其始太醫以王命聚之，歲賦其二。募有能捕之者，當其租入。永之人爭奔走焉。」根據此段文句裡「歲賦其二」，應是哪一個時期的稅法？
