- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「異者相敬」、「同者相親」這兩句話，套用在周人生活中的解讀，下列何者「錯誤」？
  options:
  - label: A
    content: 政治上的禮制，著重在有差等的秩序上，所以禮用來「分別身分」
  - label: B
    content: 禮制的規定強化了尊貴者的威儀，有助於維持穩定的統治
  - label: C
    content: 樂主「同」，表示周代君臣於相聚場合可誦詩奏樂
  - label: D
    content: 自天子乃至庶人，都用禮樂在宗廟舉行婚喪儀式
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)宗廟為中國古代君王、貴族祀奉祖先靈位的祠廟，非舉行婚喪儀式之處，也非一般庶人能夠進去的地方。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「關隴胡漢集團」是南北朝到唐初重要的權力基礎，對於這個集團的敘述，何者正確？
  options:
  - label: A
    content: 關隴集團的武力是建立在府兵制的基礎之上
  - label: B
    content: 武則天是因為得到關隴集團的支持才能稱帝
  - label: C
    content: 北齊、隋、唐的建國者皆出身關隴集團
  - label: D
    content: 關隴統治集團的強固勢力，在安史之亂後才有鬆動的跡象
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)出身太原的李淵獲得關隴集團支持才能稱帝，武則天取代李家稱帝，是與關隴集團為敵。(C)隋、唐的建國者皆出身關隴集團，但北齊位於東部，支持者應是山東士族。(D)關隴統治集團勢力基礎主要在府兵制，隨太平盛世的結束而漸難以維持，於唐玄宗廢除府兵制後即退出歷史舞臺，安史之亂則是在府兵制廢除後才爆發。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '資料一：「士子登名朝列，有不知史冊名目、朝代先後、字體偏旁者。」

    資料二：「時文敗壞天下之才，而至士不成士，官不成官，兵不成兵，將不成將，夫然後寇賊奸宄得而乘之，敵國外患得而勝之。」

    上述資料係指哪個朝代的選才制度所造成的影響？'
  options:
  - label: A
    content: 漢代察舉
  - label: B
    content: 魏晉九品中正法
  - label: C
    content: 唐代科舉
  - label: D
    content: 明代八股取士
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一可看出該朝代有功名的士子中，不乏不懂文史者；資料二則抱怨「時文敗壞天下之才」，即當時的選才制度無法拔擢適任的人才，綜合兩者來看，這個選才制度應是明代八股取士，考生為求中舉而一味模仿、背誦制義，除了思想受到箝制外，也有諸多士子不通文史，故答案選(D)。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 李寧擔任越南旅遊的導遊，為了讓旅客有個超值且有深度的旅遊，會預先對團員解說越南的歷史發展。以下是李寧的解說，但是卻發生了一項「錯誤」，請幫他找出來？
  options:
  - label: A
    content: 約在中國秦末，南海尉趙佗乘亂割據一方，建立「南越國」
  - label: B
    content: 南越國被漢朝所滅，越南北部長期受其控制
  - label: C
    content: 越南於 10 世紀時出現三個獨立政權，吳朝、丁朝、前黎朝
  - label: D
    content: 越南脫離中國統治後，各王朝即不再受中國的冊封
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)越南脫離中國統治後，各王朝為獲得統治的合法性，多接受中國的冊封並持續向中國進貢。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 唐代科舉考試時，考生應試之前，常把已所作詩文投獻給可能的閱卷官員、具有影響力之人士等等，不僅以求取榮譽提升知名度，也提醒閱卷者多加關心與注意。請問由此科考時的特殊現象可知
  options:
  - label: A
    content: 此現象是科考的一環，先由社會評價做一次篩選再進行考試
  - label: B
    content: 唐代科考取才制度尚未成熟，以致魏晉以來世家大族依然存在
  - label: C
    content: 此現象反映了科考仍重視家世背景、人脈，而非個人才華
  - label: D
    content: 可知科考是由地方辦理的考試，故考生須尋求有力人士支持
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 唐代科舉考試錄取主要看應試文章，不問考生的家世背景，但考生在應試前想方設法提升自身的知名度，可知此時的科考取才尚未有嚴格的錄取標準與防弊措施，故答案選(B)。(A)這種「干投行卷」的行為並非科考的一環。(C)科考的設計係重視個人才華，不問家世背景、人脈。(D)科考由中央禮部負責，非地方的考試。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 漢代鄒陽對於秦朝無法抵擋各路群雄的逼進提出評論，認為其原因在於「列郡不相親，萬室不相救。」請問此評論點出秦朝什麼問題？
  options:
  - label: A
    content: 分封原六國君王後代，導致帝國內部無法齊心
  - label: B
    content: 秦宗室分封各地日久，彼此疏遠不再互助
  - label: C
    content: 秦雖行郡縣，但官員與地方通婚成反叛勢力
  - label: D
    content: 認為廢封建行郡縣，是導致秦帝國滅亡原因
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)鄒陽認為秦代廢封建改行郡縣制，在沒有宗室血親的藩屏之下，遇到外敵自然就「列郡不相親，萬室不相救」。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「陳強走向五臺山的佛寺，將今天採集到的礦石交給寺中負責經營礦業的僧侶，並領取今天的工資。然而在領薪完後，看著手中少得可憐的銅幣，陳強想起了在家病弱的老母親。不得已下，陳強深深地嘆了口氣，走向寺院的借貸之處，思考如何向這些大和尚們開口借些急用，好讓母親有藥可醫。」關於上述小說內容的歷史解釋，下列何者正確？
  options:
  - label: A
    content: 佛教寺院是以慈善事業為主，不應出現借貸行為，因此小說內容有誤
  - label: B
    content: 小說內容顯示了佛教在魏晉南北朝時期傳入中國，大量擁有寺產的情況
  - label: C
    content: 從小說內容可看出，作者時代背景可能是設定在佛教寺院經濟繁榮發展的隋、唐之際
  - label: D
    content: 僧侶已是脫離世俗的出家人，怕耽誤修行。應該不會有像題幹所述經營生產活動的情形
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中國古代佛教寺院雖有從事慈善事業，但也並非沒有經營其他事業，小說內容不一定錯誤。(B)小說內容並無提及佛教傳入時間，且佛教應為兩漢之際傳入中國，發展至隋唐之後進入全盛時期。(D)題文所述正是隋唐時期的佛教寺院經濟繁盛的景象。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '資料一：宋神宗曾說：「太宗自燕京城下軍潰，北虜追之，僅得脫。凡行在服御寶器盡為所奪，從人宮嬪盡陷沒。股（大腿）上中兩箭，歲歲必發。其棄天下竟以箭瘡發云。蓋北虜乃不共戴天之仇，反捐金繒數十萬以事之為叔父，為人子孫，當如是乎！」

    資料二：大宋皇帝（宋真宗）謹致誓書於契丹皇帝闕下：「共遵誠信，虔守歡盟，以風土之宜，助軍旅之費，每歲以絹二十萬匹，銀一十萬兩，更不差使臣專往北朝，只令三司差人搬送至雄州交割。」

    關於以上兩則北宋時期的相關資料，下列何種解讀正確？'
  options:
  - label: A
    content: 宋真宗使用「契丹皇帝」的稱呼表示宋朝對契丹稱臣
  - label: B
    content: 資料一中的「北虜」為匈奴，曾與北宋發生戰爭
  - label: C
    content: 資料二中，北宋皇帝使用契丹皇帝、北朝等詞彙，表示北宋承認「天有二日」的情形
  - label: D
    content: 資料一中的北虜與資料二中的北朝，指的不是同個政權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)宋真宗以「契丹皇帝」稱呼，係因宋遼兩國以兄弟相約，係對等關係。(B)「北虜」為契丹。(D)資料一的「北虜」與資料二的「北朝」皆指契丹（遼），為同一政權。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 11 世紀時，日本的佛教寺院由於擁有龐大寺產，因此多將僧侶武裝化，藉此保衛寺產。其中勢力龐大者甚至不與政府合作，割據一方。以致當時白河天皇（1053 ～1129 年）曾言：「世界上不能讓我滿意的，莫過於洪水、賭博與僧兵。」試問造成天皇對僧兵如此觀感的主要原因為何？
  options:
  - label: A
    content: 僧兵擁有大量寺院財產，不利國家生計
  - label: B
    content: 因當時僧兵行事橫暴，常有暴動之事，天皇因此無奈不滿
  - label: C
    content: 因日本淨土真宗僧眾得以娶妻食肉，因而被天皇認為不守清規
  - label: D
    content: 天皇信仰神道教，因此對佛教抱持反感態度
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 佛教寺院擁有大量寺產雖可能不利國家生計，但造成天皇忌禪的主要原因還是僧侶武裝化的問題，尤其勢力龐大的寺院還能割據一方，對天皇的統治無疑是一大威脅，因此答案應為(B)。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '以下兩則是春秋時期關於某事的記載：

    資料一：根據《春秋．公羊傳》記載，魯隱公雖然有賢才、又是長子，但由於西周某項繼承原則的關係，在其父魯惠公死後選擇攝政而非繼承國君之位，並且隱公決定等真正符合繼承條件的弟弟長大就要還政於他。

    資料二：《史記．魯周公世家》：「初，惠公適（嫡）夫人無子，公賤妾聲子生子息。息長，為娶於宋。宋女至而好，惠公奪而自妻之。生子允。登宋女為夫人，以允為太子。」

    根據上述兩則資料判斷，資料一提到的「某項繼承原則」應為何？'
  options:
  - label: A
    content: 嫡子繼承制
  - label: B
    content: 兄終弟及制
  - label: C
    content: 庶子繼承制
  - label: D
    content: 部落會議制
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一中的魯隱公雖有賢才，又是長子，卻無法繼承國君之位，可見其並非嫡長子；資料二亦說明公子息雖長卻非嫡子，公子允年幼卻因母親為夫人而得立太子。綜合兩則資料，可知皆在討論宗法制度中的嫡子繼承原則，因此(A)為正解。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 《三國志》對日本有以下記載：「倭人在帶方東南大海之中，依山島為國邑……從郡至倭，循海岸水行……七千餘里，始度一海……到伊都國……世有王，皆統屬女王國，郡使往來常所駐……南至邪馬臺國，女王之所都……自女王國以北，其戶數道里可得略載，其餘旁國遠絕，不可得詳。次有斯馬國，次有已百支國，次有伊邪國，次有都支國，次有彌奴國，次有好古都國……次有奴國，此女王境界所盡。其南有狗奴國，男子為王，其官有狗古智卑狗，不屬女王。」請問從《三國志》的這段記載，我們可以如何理解 3 世紀時的中國與日本？
  options:
  - label: A
    content: 日本已經統一而且建立中央集權的政治體制
  - label: B
    content: 中國與日本沒有交流，對日本了解不夠詳盡
  - label: C
    content: 日本小國林立，各國與中國的交流程度不一
  - label: D
    content: 女王勢力範圍廣闊，在當時已有天皇的頭銜
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從女王國、斯馬國、已百支國……等國名，可知此時的日本尚未統一。(B)邪馬臺國女王曾遣使向曹魏入貢，受封為「親魏倭王」，並非沒有交流。(D)女王統治範圍有限，從此段記載中看不出已有天皇的頭銜。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 有學者評析九品官人法的諸多弊端，其中之一是：「今立中正，定九品，高下任意，榮辱在手，操人主威福，奪天朝權勢，愛惡隨心，情偽由己，上品無寒門，下品無世族。」根據你的判斷，此文凸顯九品官人法哪種弊端？
  options:
  - label: A
    content: 士族透過自己權勢影響評比結果
  - label: B
    content: 評定品級的中正官缺乏客觀性
  - label: C
    content: 選才只看重人才家世不重能力
  - label: D
    content: 品第的決定一次定終身無法更改
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從「高下任意，榮辱在手」、「愛惡隨心，情偽由己」兩句，可知九品官人法最大的弊端是人才的評定品級操控在中正官之手，缺乏客觀性，導致最後只重家世而不重能力，故選(B)。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 《魏書．太祖記》：「徙山東六州民吏及徒何、高麗雜夷三十六萬，百工技巧十餘萬，以充京口。……詔給內徙新民耕牛，計口授田。」請問關於此段敘述合理的推測是
  options:
  - label: A
    content: 《魏書》中的太祖應該是指曹丕
  - label: B
    content: 是描述人口遷徙後的「土斷政策」
  - label: C
    content: 是說明「均田制」形成的歷史背景
  - label: D
    content: 計口授田的政策只影響當時代
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)太祖指北魏道武帝拓跋珪。(B)「土斷制度」為東晉、南朝的戶籍政策，與題文所述的北朝均田制無關。(D)計口授田的均田制從北魏開始實施，沿用至唐中葉。
