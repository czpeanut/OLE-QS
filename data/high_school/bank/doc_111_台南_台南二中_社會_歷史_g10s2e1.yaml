  stem: 今人研究中國古史，多有「傳說時代」的觀念，某學者說：「從現在的歷史來看，只有到殷墟時代，才能算作進入了狹義的歷史時代。」此處所謂「狹義的歷史」是指「信史」。這位學者的意見反映了 20 世紀中國歷史學家的史學方法，請問這位學者以殷墟時代為「傳說時代」與「信史」間之分野的理由何在？
  options:
  - label: A
    content: 因為中國文獻中沒有關於殷墟時代以前的記載，故只有憑藉殷墟甲骨文的出土，我們才能得知商以前的歷史
  - label: B
    content: 雖然中國文獻中有許多關於殷墟時代以前的記載，但學者認為必須配合地下文物的出土，才能被證明為信史
  - label: C
    content: 中國的考古發現中最早文物出自殷墟，且歷史研究的唯一根據是地下出土的文物，故中國的信史始自殷墟
  - label: D
    content: 中國文化淵源於殷商文化，在殷墟時代以前的歷史多非中國文化，故不是中國史的一部分
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「傳說時代」與「信史」的分野在文字的發明與記載，殷墟出土的甲骨文為目前中國已知最早的文字，因此按照 20 世紀中國歷史學家的史學方法來定論，有文字證據的商朝才能被證明為信史，(B)為正解。(A)《尚書》、《史記》等書已有商代以前的相關記載。(C)殷墟並非最早的考古發現，地下出土的文物也非歷史研究的唯一根據。(D)殷商文化之前尚有夏朝，可惜缺乏文字證據而難以被認定為「信史」。
