  stem: 由於移民、移工和全球化潮流等因素，為現代社會帶來多元文化，使得國人與異文化的接觸增加。下列哪一種做法最有助於改善國人對異文化所產生的刻板印象？
  options:
  - label: A
    content: 某電視臺購買並播出外國的綜藝節目
  - label: B
    content: 職棒聯盟邀請國外球隊來臺參與賽事
  - label: C
    content: 臺灣某外商公司邀請國際巨星來臺演出
  - label: D
    content: 國內外各大學締結姊妺校辦理學生交換
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 國內外大學締結姐妹校，有助於實際人際的互動與交流，故可減少對異文化的刻板印象，故選(D)。(A)(C)為商業節目，屬包裝過的，並無法改善刻板印象。(B)比賽沒有實際的人際互動，並無法改善刻板印象。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 人權是普世價值，許多國家都在相關法律中明文保障。以下關於人權的敘述何者正確？
  options:
  - label: A
    content: 人權的實踐要考慮文化差異，有些國家的女性沒有投票權，這是文化差異，和人權無關
  - label: B
    content: 學校規定不可以體罰，但家庭教育有體罰，且通常是為小孩好，故沒有侵犯人權的疑慮
  - label: C
    content: 人權和公民權的範圍不同，來臺的外籍觀光客沒有公民權，但我國法律仍然保障其人權
  - label: D
    content: 罪犯因為違反法律，而且往往對他人的人權造成侵害，因此國家不需要保障罪犯的人權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 外國人雖然不能在臺灣投票，但仍有基本人權，故選(C)。(A)人權是普世價值，先於文化。(B)體罰侵犯人權。(D)罪犯亦有人權。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 甲報社報導：「策劃重大恐怖事件的中東恐怖組織領袖遭美國情報人員擊斃，對美國威望的提升以及未來的全球戰略均有重大意義……」；乙報社報導：「恐怖攻擊事件發生時，美國曾譴責中東國家是暴力分子，現在自己卻以暗殺的恐怖手段結束這位英雄的生命，令人遺憾……」。針對上述報導，下列何者是兩家報社對此事件做出迥異報導的最主要原因？
  options:
  - label: A
    content: 各家報社本就有其不同的立場
  - label: B
    content: 為擴大自家報社的市場占有率
  - label: C
    content: 為追求輿論的平衡而刻意不同
  - label: D
    content: 所有報導向來都無法呈現真相
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 甲報支持美國，乙報批評美國，故顯示兩家報社對此事的立場不同，選(A)。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 公共利益的推動，除了透過國家的公權力之外，也常經由公民團體的倡議。下列哪個例子屬於公民團體的倡議活動範疇？
  options:
  - label: A
    content: 網民串聯集結在總統府前廣場，要求政府肅貪反汙
  - label: B
    content: 有志人士組成妓權團體，遊說政府將性工作除罪化
  - label: C
    content: 教授帶領一群學生，抗爭政府執行都市更新不公平
  - label: D
    content: 學者連署在報紙刊登廣告，呼籲政府重視失業問題
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題目是問「公民團體」的倡議，只有(B)提及「妓權團體」屬於公民團體。(A)網民非「公民團體」。(C)教授與學生非「公民團體」。(D)學者非「公民團體」。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 志願結社的蓬勃發展已經成為當代臺灣多元社會的特徵，透過志願結社，可以形成關心公共事務的社會文化，這正是民主政治蓬勃發展的基礎。下列關於志願結社的敘述何者最為正確？
  options:
  - label: A
    content: 為民間所發起，但並不包含與政治關係密切的政黨
  - label: B
    content: 必須向政府正式立案登記，否則結社行為不具效力
  - label: C
    content: 強調公民直接參與公共事務，對政府採取抗爭立場
  - label: D
    content: 強調非營利的性質，但仍可採取企業性經營或活動
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 志願結社屬非營利的第三部門，但仍可採取企業經營烘焙坊等，以營利收入投入公益，故選(D)。(A)政黨亦為志願結社。(B)結社不一定要向政府立案登記，只是未立案登記不得從事某些行動。(C)志願結社不一定對政府採取抗爭立場。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 選舉制度對於民主國家的政治制度與政府運作具有關鍵性之影響。根據我國現行的選舉制度，下列敘述何者正確？
  options:
  - label: A
    content: 總統選舉採取兩輪投票制，故不會產生支持度未能過半的總統
  - label: B
    content: 縣市升格為直轄市後，市長的選舉改採單一選區絕對多數決制
  - label: C
    content: 縣市議員選舉採取複數選區制，名額較多能兼顧地方多元聲音
  - label: D
    content: 立法委員選舉採取絕對多數決制，故能充分代表地方主流意見
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 縣市議員為地方民代，採複數選區相對多數制，故選(C)。(A)我國總統採單一選區相對多數制。(B)市長選舉採單一選區相對多數制。(D)立委採單一選區兩票制。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '某內閣制國家，有甲乙丙丁戊五個政黨，本次國會大選選舉結果如表 1。依表中資訊判斷，下列有關其聯合內閣組成之敘述何者正確？

    | 表 1 |  |  |  |  |  |

    | --- | --- | --- | --- | --- | --- |

    | 政黨名稱 | 甲 | 乙 | 丙 | 丁 | 戊 |

    | 國會席次 | 8 | 21 | 26 | 12 | 33 |'
  options:
  - label: A
    content: 甲黨所獲得的席次過少，沒有參與組織聯合內閣的機會
  - label: B
    content: 丙黨若不想與過多政黨分享內閣權力，只能與戊黨合作
  - label: C
    content: 甲乙丁三黨過半，組成聯合內閣可以獲得國會穩定多數
  - label: D
    content: 乙丙兩黨若想合作組閣，只能夠尋求丁黨或戊黨的協助
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 內閣制國家，若國會選舉無任何一黨過半，則須組成聯合內閣，因此若想以最少的政黨組合聯合政府，則由丙＋戊組合才行，故選(B)。(A)甲黨雖然席次少，但仍有組閣可能。(C)甲乙丁加起來仍未過半，不能組閣。(D)乙丙兩黨亦可找甲黨合作。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某重大貪瀆弊案遭揭發後，有公務人員接獲指示：「務必積極主動擴大調查、證據蒐集齊全，將貪瀆集團成員一網打盡，並將貪汙之不法所得追回。」下列何者是最可能完成此一要求的公務人員？
  options:
  - label: A
    content: 法官
  - label: B
    content: 法警
  - label: C
    content: 書記官
  - label: D
    content: 檢察官
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 檢察官負責貪瀆案件之調查，故選(D)。(A)法官負責審判。(B)警察聽從檢察官之指揮。(C)書記官在法庭上負責記錄。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 據報載，某雇主因擔心所僱用之勞工不聽指揮或中途離職，於是扣留該受僱人之證件，約定在雇傭關係結束時就會同時歸還。對於上述雇主的行為，下列敘述何者正確？
  options:
  - label: A
    content: 雇主可能已經觸法，該受僱者可尋求法律協助取回證件
  - label: B
    content: 雇主扣留證件雖具有強制性，但並不違背契約自由原則
  - label: C
    content: 雇主行為已侵害工作權，大法官會議可宣告此做法違憲
  - label: D
    content: 雇主扣留證件作為履行契約之保證，屬私法自治的範圍
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 《就業服務法》規定「不得違反求職人或員工之意思，留置其國民身分證、工作憑證或其他證明文件」，故選(A)。(B)雇主無權扣留。(C)雇主行為違法，勞工應先檢舉，不能直接聲請釋憲。(D)扣留證件不屬私法自治的範圍。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 某甲因違反《集會遊行法》遭到檢察官起訴，法官在審理該案件時，認為該法部分條文有違憲疑慮，依據法律規定，下列何項做法較為妥適？
  options:
  - label: A
    content: 法官可告知該案件之當事人，向司法院大法官提出釋憲聲請以解決此問題
  - label: B
    content: 法官可暫停該訴訟審理，備齊理由向司法院大法官提出釋憲聲請以求解決
  - label: C
    content: 該案件當事人可要求法官依惡法非法精神，認定該法條違憲並判決其無罪
  - label: D
    content: 該案件當事人可根據信賴保護原則，對行政機關提出訴願要求撤銷原處分
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 依《憲法訴訟法》規定，各法院就其受理之案件，於裁判上所適用之「法律」位階法規範，合理確信有違憲疑義，且認為對該案件之裁判結果有直接影響者，得裁定停止訴訟，以各受理法院的名義，聲請憲法法庭為宣告違憲之判決，故選(B)。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 父母早逝、沒有妻小的獨子大德與年邁祖母相依為命。某日大德駕車不小心撞傷路人小芬，造成小芬身受重傷，約定賠償 50 萬元。一週後，大德因病身故，只留下存款
    10 萬元，小芬只好轉向大德的祖母求償。關於上述賠償，下列選項何者正確？
  options:
  - label: A
    content: 大德的祖母並非法律所定之繼承人，所以小芬的求償於法無據
  - label: B
    content: 除非大德的祖母依法拋棄繼承，否則小芬可以向她求償 50 萬元
  - label: C
    content: 就算大德的祖母未依法拋棄繼承，也只須對小芬負 10 萬元的清償責任
  - label: D
    content: 肇事的人是大德，只有大德有賠償義務，小芬不可向大德的祖母求償
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由於大德只有祖母，因此祖母是唯一的繼承人，但大德的債務大於遺產，故祖母只須以遺產 10 萬元，還給小芬，此即限定繼承，故選(C)。(A)(D)小芬可向祖母請求還債。(B)祖母即使未拋棄繼承，仍只要還小芬
    10 萬元。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '表 2 為航空公司臺北飛航上海的方式、平均票價以及機位供給、需求狀況。請問以下描述或解釋不同飛行方式供需狀況差異的敘述何者正確？

    | 表 2 |  |  |  |

    | --- | --- | --- | --- |

    | 飛行方式 | 票價 | 機位供給 | 機位需求 |

    | 臺北直飛上海 | 新臺幣 15,000 元 | 3,500 位 | 4,500 位 |

    | 臺北經香港至上海 | 新臺幣 10,000 元 | 2,000 位 | 1,000 位 |'
  options:
  - label: A
    content: 臺北直飛上海航班採以價制量導致需求大於供給
  - label: B
    content: 多數旅客並不認為直飛的票價比轉機貴是合理的
  - label: C
    content: 只有少數航空公司有直飛上海，讓旅客無從選擇
  - label: D
    content: 多數旅客認為轉機額外的時間成本高於減價優惠
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由於直飛的需求也比轉機多，顯示即使直飛價格較高，但因不必轉機，因此直飛旅客會認為省下的時間比較寶貴，即時間成本高於減價優惠，故選(D)。(A)若採「以價制量」，價格會高於市場的均衡價格，使得供給量大於需求量。然而從表中可看出，市場對於直飛機位的需求量大於供給量，代表直飛的票價低於市場價格，故可知航空公司並非採取「以價制量」策略。(B)由於直飛機位的需求大於供給，代表旅客認為直飛的票價是合理的，且願意付更高的價格來取得機位。(C)直飛方式提供的機位比轉機還多，代表許多航空公司都有提供直飛的服務。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 因麵粉價格上漲影響大眾生活，政府要求麵粉業者必須將價格調回到漲價前的價格，且不得上漲。請問有關此凍漲措施的敘述何者正確？
  options:
  - label: A
    content: 雖會造成市場供不應求，但可提高經濟效率
  - label: B
    content: 會降低生產者剩餘，但消費者剩餘則會提高
  - label: C
    content: 此價格管制與政府保證收購農產品措施相同
  - label: D
    content: 會造成經濟效率的損失，非有必要不應施行
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 麵粉凍漲，指政府規定價格上限，並把價格規定在均衡價格之下，此時會造成經濟效率的損失，故選(D)。(A)價格上限會導致市場供不應求，減損效率。(B)降低生產者剩餘，但消費者剩餘也不一定會增加或減少。(C)保證收購農產品是價格下限。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 部分非政府組織，為提供經濟上弱勢的可可農較佳之貿易條件與更多機會，致力推廣公平貿易可可的販售。雖價格較高，但透過消費者多付一些錢，可幫助開發中國家可可農免於被剝削。此概念目前已漸為民眾接受並積極參與，請問有關此現象的敘述何者正確？
  options:
  - label: A
    content: 顯示全球化貿易下利益分配失衡
  - label: B
    content: 此舉會讓可可農失去創新的動機
  - label: C
    content: 不符合絕對利益之資源配置原則
  - label: D
    content: 可可生產成本過高需要外界補貼
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 推廣公平貿易可可是有組織的行動，在貼有公平貿易標籤及其相關產品之中，勞工、環保及社會政策的公平性標準、以生產者的利益為先，而非中間商人的利潤，故此行動在強調全球化貿易下利益分配不均的問題，選(A)。(B)可可農可因此獲得較佳利益，而有創新動機。(C)絕對利益是分工的原則，但公平貿易談利益的分配。(D)公平貿易並未主張生產可可要補貼。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_15
  section: 1
  number: 15
  type: single
