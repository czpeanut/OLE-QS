  stem: 甲涉嫌殺人，由乙負責指揮偵查。甲欲委任丙擔任甲的辯護人。偵查過程中，乙發現甲罪嫌重大，且有與他人串供之嫌。下列關於本案所涉及之刑事審查程序的敘述，何者正確？
