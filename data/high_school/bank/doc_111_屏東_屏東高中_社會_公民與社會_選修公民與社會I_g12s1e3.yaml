  explanation: 依據國際組織的特性分析，由甲乙兩國的糾紛屬於貿易爭端，因此推論由丙 WTO 裁決，故選(C)。(A)聯合國致力於促進各國在國際法、國際安全、經濟發展、社會進步、人權、公民自由、政治自由、民主及實現持久世界和平方面的合作。(B)世界銀行是為開發中國家資本項目提供貸款的聯合國系統國際金融機構。(D)亞太經濟合作會議是亞太區內各地區之間促進經濟成長、合作、貿易、投資的論壇，只有對話功能。
