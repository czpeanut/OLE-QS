  stem: 國內生產毛額（GDP）、每人平均 GDP、綠色 GDP、國家競爭力以及經濟成長率等，皆為衡量一國整體表現的指標。下列有關這些指標的敘述何者正確？
  options:
  - label: A
    content: 一國的經濟成長率愈高，該國的 GDP 以及國家競爭力也愈高
  - label: B
    content: GDP 無法顯示政府效能高低，但綠色 GDP 與國家競爭力則可
  - label: C
    content: 經濟成長率較低國家之每人平均 GDP，不必然會低於經濟成長率較高國家
  - label: D
    content: 相較於 GDP，綠色 GDP 因為包含休閒價值，故後者的水準通常會高於前者
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 已開發國家的經濟成長率通常較開發中國家低，但人均 GDP 卻比開發中國家高，故選(C)。(A)經濟成長率高，不代表一國的 GDP 或競爭力高。(B)
    GDP 和綠色 GDP 無法反應政府效能。(D)綠色 GDP＝GDP－（自然資源折耗＋環境品質折損），綠色 GDP 不包括休閒價值。
