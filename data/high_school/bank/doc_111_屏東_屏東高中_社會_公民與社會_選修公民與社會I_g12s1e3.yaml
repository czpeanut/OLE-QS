  group_stem: '2013 年時，英國女王依據英國法律授權，宣布特赦現代電腦科學先驅者艾倫．圖林（Alan Turing）。圖林在二次大戰時因為成功破解納粹的密碼，對當時的盟方有極大貢獻。但是他後來卻因為被警察發現有同性戀行為，而依英國刑法法律定罪。在該法條被廢止前，估計有
    4 萬 9 千名男同性戀被判有罪。圖林後來接受化學去勢，以避免坐牢，他的工作也被剝奪。小風和小雲二人對此事有以下的討論：

    小風：我不太能認同的是為何要以刑法處置同性戀？為何兩名男子間的愛情行為，與他人無涉，會受到國家的處罰？他們有傷害到其他人嗎？

    小雲：我不太能認同的地方在於，為何面對過去的不正義，但是結果卻只有圖林一人獲得特赦？'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 小風認為：無涉於他人，且不會傷害到其他人的行為不需要受到國家的處罰，是探討該行為是否應「入罪」的思考，故與(B)主張酒駕入罪相近。(A)小風的話與傳統習俗的道德情感無關。(C)是比例原則。(D)禁吃甜食是為了保障個人身體健康，並無侵害他人或社會法益。
