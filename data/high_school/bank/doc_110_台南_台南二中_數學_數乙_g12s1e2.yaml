  stem: 設 f（x）是定義在實數集 R 上的實係數多項式函數，a 為實數，則下列關於 f（x）的敘述哪些選項是正確的？
  options:
  - label: A
    content: 若 f（x）為三次多項式函數，則 f（x）一定有極大值或極小值
  - label: B
    content: 若 f（x）為三次多項式函數，則 f（x）圖形恰有一個反曲點
  - label: C
    content: 若函數 f（x）滿足 f'（a）＝0，則 f（a）必為極值
  - label: D
    content: 若函數 f（x）在 x＝a 處有極值，則 f'（a）＝0
  - label: E
    content: 若函數 f（x）滿足 f''（a）＝0，則（a，f（a））必為 f（x）圖形的反曲點
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：反例：若 f（x）＝$x^{3}$，則 f（x）無極值

    (B) ○

    (C) ╳：反例：若 f（x）＝$x^{3}$，而 f''（x）＝$3x^{2}$

    f''(0)＝0，但 f(0)並非極值

    (D) ○

    (E) ╳：若（a，f（a））為函數 f（x）圖形的一個反曲點，則 f"（a）＝0

    故選(B)(D)'
