- id: doc_110_台南_台南二中_數學_數乙_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設 f（x）＝（x－1）$^{2}$（x－2）$^{3}$（x－3）（4x－13）$^{10}$，則 f'(3)之值為何？
  options:
  - label: A
    content: －4
  - label: B
    content: －1
  - label: C
    content: '0'
  - label: D
    content: '4'
  - label: E
    content: '16'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '由導數的定義

    f''(3)＝$\lim_{x\rightarrow 3} \frac{f(x)-f(3)}{x-3}$＝$\lim_{x\rightarrow 3} \frac{(x-1)^{2}(x-2)^{3}(x-3) (4x-13)^{10}-0}{x-3}$

    ＝$\lim_{x\rightarrow 3} ((x-1)^{2}(x-2)^{3}(4x-13)^{10})$＝$2^{2}$×1×1＝4

    故選(D)'
