- id: doc_109_桃園_武陵_自然_生物_選修生物II_g11s1e2_s3_37
  section: 3
  number: 37
  type: single
  page: 4
  stem: 下列哪一種處理方式的阿拉伯芥的根最短（單選）？
  options:
  - label: A
    content: 完整的gal-3品系，以吉貝素處理
  - label: B
    content: 去除頂芽的一般品系
  - label: C
    content: 去除頂芽的gal-3品系，以吉貝素和植物生長素處理
  - label: D
    content: 去除頂芽的一般品系，以植物生長素處理
  group_stem: '我們已經知道吉貝素具有調節枝條生長的能力，但是有關吉貝素對根部生長的調節作用卻尚未清楚。

    科學家發現具有突變基因的阿拉伯芥（gal-3品系）無法自己合成吉貝素，所以其初生根比起一般正常的阿拉伯芥來得短，但是如果用吉貝素處理，就可以長出正常長度的根。根據研究，吉貝素可以藉由抑制在細胞核中DELLA這一類蛋白質的活性，而使根部開始生長。DELLA是一群會抑制生長的蛋白質，吉貝素會使得DELLA變得不穩定，進而降低DELLA蛋白的濃度與活性，導致DELLA的抑制作用減少而使植物開始生長。

    1958年Brian與Hemming在實驗中進一步發現，如果將矮性植物的頂芽去除後，就算以吉貝素處理，矮性植物莖上的節間也不會有加長的現象。由此實驗可知，如果植物要能吉貝素產生正常的生理反應的話，頂芽的存在是必要的。如果在去除頂芽的植物上加上植物生長素處理的話，可以發現植物體也會對吉貝素產生正常的生理反應，而且也會促進根部的生長，這樣的結果更是佐證了植物生長素可以促進根部生長的這一個生理功能。這些實驗的結果也證實了：植物生長素可以調節細胞對吉貝素的生理反應，進而控制植物根部的生長。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
