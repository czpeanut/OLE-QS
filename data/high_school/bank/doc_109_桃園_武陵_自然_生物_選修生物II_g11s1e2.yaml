- id: doc_109_桃園_武陵_自然_生物_選修生物II_g11s1e2_s3_39
  section: 3
  number: 39
  type: single
  page: 5
  stem: 關於此文章的敘述，下列何者正確（單選）？
  options:
  - label: A
    content: 第三個動作電位應該是確認獵物已被蟲夾捕捉
  - label: B
    content: 茉莉酸使DmHKT1的表現量在第三次動作電位後便開始上升，以加強之後的鈉離子吸收
  - label: C
    content: 捕蠅草會從獵物身上吸收鈣離子，再透過鈣離子濃度的上升，促使腺細胞分泌酵素
  - label: D
    content: 茉莉酸在此過程中的功能是作為一種分解酵素
  group_stem: '若在30秒之內連續碰兩下捕蠅草葉片內側的感覺毛，且這兩下都引發捕蠅草產生動作電位，這時捕蠅草便會在小於一秒的時間內把它的「蟲夾」（葉片）關起來。不過，關起來以後，捕蠅草是否馬上就開始分泌消化液呢？一組研究團隊，進行了以下一連串的實驗。

    在「蟲夾」關閉後，捕蠅草便開始製造茉莉酸；茉莉酸接著與它的受器COl1-JAZ1結合，使JAZ1分解。但JAZ1的分解反而使它的表現量上昇。

    頭兩個動作電位發生時，JAZ1與COl1的表現量維持不變，這時候茉莉酸的分泌也還沒有開始；接下來的動作電位的出現（代表昆蟲持續掙扎），造成茉莉酸（JA）的分泌開始上昇，於是JAZ1與COl1的表現量也開始出現變化：JAZ1表現量上昇而COl1下降。到第五個動作電位出現時，JAZ1的表現量到達最高峰（為一開始的5.5倍），此時腺細胞內的鈣離子濃度開始上昇，接著各種水解酶便會開始分泌了。

    動作電位的產生，需在短時間內把大量的離子運出／運入細胞，於是科學家們用飼料來餵食捕蠅草，同時刺激感覺毛。在餵食6小時，捕蠅草細胞內的鈉離子濃度開始上昇，到12-24小時到達最高峰繼續持2－3天。由於只有葉片的細胞呈現鈉離子濃度上昇的現象，顯示捕蠅草的確會吸收獵物的鈉離子。

    為了進一步證明捕蠅草會吸收鈉離子，研究團隊分析了捕蠅草的鈉離子通道蛋白DmHKT1。發現從零到第三個動作電位發生之間，DmHKT1的表現量都沒有變化；但是在第五個動作電位發生後，DmHKT1的表現量開始上昇，並於四小時候達到最高，可達原來的60倍！研究團隊也發現，DmHKT1的表現受到JA的調節。這顯示捕蠅草雖然是植物，但與吃肉的動物一樣，會吸收獵物的鈉離子來作為產生動作電位使用。研究團隊還發現捕蠅草可能也會吸收獵物的銨離子（$NH_{4}^{＋}$）與鉀離子（$K^{＋}$）喔！'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
