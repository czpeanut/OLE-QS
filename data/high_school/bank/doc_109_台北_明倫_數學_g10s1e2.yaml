  stem: 若 degf（x）＝degg（x）＝3，則下列哪些正確？
  options:
  - label: A
    content: deg（f（x）＋g（x））＝3
  - label: B
    content: deg（f（x）－g（x））$\leq$2
  - label: C
    content: deg（f（x）．g（x））＝6
  - label: D
    content: deg（f（x）．g（x））＝9
  - label: E
    content: degf（$x^{2}$）＝5
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'degf（x）＝degg（x）＝3

    (A)╳：deg（f（x）＋g（x））$\leq$3

    (B)╳：deg（f（x）－g（x））$\leq$3

    (C)○：deg（f（x）．g（x））＝degf（x）＋degg（x）＝3＋3＝6

    (D)╳

    (E)╳：degf（$x^{2}$）＝2．degf（x）＝6

    故選(C)'
