  type: multiple
  page: 1
  stem: 已知二次函數 y＝$ax^{2}$＋bx＋c 的圖形如右圖所示，則下列各式哪些為正數？
  options:
  - label: A
    content: ac
  - label: B
    content: a＋b＋c
  - label: C
    content: a－b＋c
  - label: D
    content: 2a＋b
  - label: E
    content: a－2b＋4c
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_109_台北_明倫_數學_g10s1e2/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 449.0
      - 273.8
      - 563.1
      - 347.1
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝f（x）＝$ax^{2}$＋bx＋c 的圖形開口向下$\Rightarrow$a＜0

    與 y 軸交於（0，c）$\Rightarrow$c＜0

    對稱軸 x＝$-\frac{b}{2a}> 0\Rightarrow$b＞0

    (A)○：a＜0 且 c＜0$\Rightarrow$ac＞0

    (B)○：a＋b＋c＝f(1)＞0

    (C)╳：a－b＋c＝f（－1）＜0

    (D)╳：$0 <-\frac{b}{2a}< 1\Rightarrow$－b＞2a$\Rightarrow$2a＋b＜0

    (E)╳：a－2b＋4c＝$4 \left( \frac{1}{4}a -\frac{1}{2}b +c \right)$＝$4f \left( -\frac{1}{2} \right) < 0$

    故選(A)(B)'
