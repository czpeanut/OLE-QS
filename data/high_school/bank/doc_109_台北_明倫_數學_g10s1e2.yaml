- id: doc_109_台北_明倫_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 設 $2x^{4}$＋$4x^{3}$＋$ax^{2}$＋bx＋1 與 $2x^{4}$＋$3x^{3}$＋$x^{2}$＋x＋1 除以 $x^{2}$＋x＋2 之餘式相同，則數對（a，b）＝＿＿＿＿。
  answer:
  - （2，3）
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $2x^{4}$＋$4x^{3}$＋$ax^{2}$＋bx＋1＝（$x^{2}$＋x＋2）$q_{1}$（x）＋r（x）

    $2x^{4}$＋$3x^{3}$＋$x^{2}$＋x＋1＝（$x^{2}$＋x＋2）$q_{2}$（x）＋r（x）

    兩式相減

    $\Rightarrowx^{3}$＋（a－1）$x^{2}$＋（b－1）x＝（$x^{2}$＋x＋2）（$q_{1}$（x）－$q_{2}$（x））

    $\Rightarrow$〔$x^{2}$＋（a－1）x＋（b－1）〕x＝（$x^{2}$＋x＋2）（$q_{1}$（x）－$q_{2}$（x））

    $\Rightarrow\frac{1}{1}=\frac{a -1}{1}=\frac{b -1}{2}\Rightarrow\begin{cases}a -1 = 1 \\ b -1 =2\end{cases}$

    $\Rightarrow$數對（a，b）＝（2，3）'
