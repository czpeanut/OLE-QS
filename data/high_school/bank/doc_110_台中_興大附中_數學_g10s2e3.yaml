- id: doc_110_台中_興大附中_數學_g10s2e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 右圖為一單位圓，A，D 為圓上兩點且θ為第三象限角，已知$\overline{AB}$、$\overline{CD}$垂直 x 軸，則下列哪些敘述正確？
  options:
  - label: A
    content: $\overline{AB}$＝sinθ
  - label: B
    content: $\overline{OB}$＝－cosθ
  - label: C
    content: $\overline{CD}$＝－tanθ
  - label: D
    content: △OAB 面積＝$\frac{1}{2} \sin \theta \cos \theta$
  - label: E
    content: △OAB 面積＝$cos^{2}$θ×△OCD 面積
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_110_台中_興大附中_數學_g10s2e3/s2_1_f1.png
    crop:
      page: 1
      rect:
      - 448.9
      - 628.0
      - 564.3
      - 750.9
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'A（cosθ，sinθ），其中 cosθ＜0，sinθ＜0（∵θ為第三象限角）

    (A) ╳：$\overline{AB}$＝∣sinθ∣＝－sinθ

    (B) ○：$\overline{OB}$＝∣cosθ∣＝－cosθ

    (C) ╳：$\frac{\overline{CD}}{\overline{OD}}$＝tan∠DOC＝tan（180°＋∠DOC）＝tanθ ⇒ $\overline{CD}$＝tanθ

    (D) ○：△OAB 面積＝$\frac{1}{2} \overline{AB}\times \overline{OB} =\frac{1}{2} (-\sin \theta )(-\cos \theta )$＝$\frac{1}{2}$ sinθcosθ

    (E) ○：△OCD 面積＝$\frac{1}{2} \overline{OD}\times \overline{CD}$＝$\frac{1}{2}$×1×tanθ＝$\frac{1}{2}$ tanθ

    ⇒ $\frac{\triangle OCD 面積}{\triangle OAB 面積}=\frac{\frac{1}{2} \tan \theta}{\frac{1}{2} \sin \theta \cos \theta}=\frac{\frac{\sin \theta}{\cos \theta}}{\sin \theta \cos \theta}=\frac{1}{\cos ^{2}\theta}$

    ⇒ △OAB 面積＝$cos^{2}$θ×△OCD 面積

    故選(B)(D)(E)'
