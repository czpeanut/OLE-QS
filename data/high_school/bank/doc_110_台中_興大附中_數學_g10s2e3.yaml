- id: doc_110_台中_興大附中_數學_g10s2e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 在△ABC 的三邊長為 a、b、c，其對角依次為∠A、∠B、∠C，請問下列哪些敘述正確？
  options:
  - label: A
    content: 若 $sin^{2}$A＞$sin^{2}$B＋$sin^{2}$C，則△ABC 為鈍角三角形
  - label: B
    content: 若∠A 為鈍角，則 sinA＞sinB 且 sinA＞sinC
  - label: C
    content: 存在三角形滿足 sinA＋sinB＜sinC
  - label: D
    content: 若 a：b：c＝2：3：4，則 cosA＝$-\frac{1}{4}$
  - label: E
    content: 若三邊長滿足$b =c\geq 2a$，則 cosA＞cosB＋cosC
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵sinA：sinB：sinC＝a：b：c

    ∴$sin^{2}$A＞$sin^{2}$B＋$sin^{2}$C ⇒ $a^{2}$＞$b^{2}$＋$c^{2}$ ⇒ cosA$=\frac{b^{2}+c^{2}-a^{2}}{2bc}$＜0 ⇒ ∠A＞90°

    (B) ○：由正弦定理知，sin 值與邊長成正比

    又∠A 為最大角，故 sinA 最大

    (C) ╳：若 sinA＋sinB＜sinC ⇒ a＋b＜c，無法形成一個三角形

    (D) ╳：令 a＝2k，b＝3k，c＝4k，k≠0

    ⇒ cosA＝$\frac{b^{2}+c^{2}-a^{2}}{2bc}=\frac{9k^{2}+16k^{2}-4k^{2}}{2\times 12k^{2}}$＝$\frac{21k^{2}}{24k^{2}}=\frac{7}{8}$

    (E) ○：∵cosB＝cosC＝$\frac{a^{2}+b^{2}-c^{2}}{2ab}=\frac{a^{2}}{2ab}=\frac{a}{2b}$

    ∴cosA－cosB－cosC ＝cosA－2 cosB ＝$\frac{b^{2}+c^{2}-a^{2}}{2bc}-\frac{a}{b}=\frac{2b^{2}-a^{2}}{2b^{2}}-\frac{a}{b}$＝1－$\frac{1}{2} \left( \frac{a^{2}}{b^{2}}+2\times \frac{a}{b} \right)$＝$\frac{3}{2}-\frac{1}{2} \left( \frac{a}{b}+1 \right) ^{2}$

    又 b$\geq$2a ⇒ $\frac{a}{b}\leq \frac{1}{2}$ ⇒ $\left( \frac{a}{b}+1 \right) ^{2}\leq \frac{9}{4}$

    代回得 cosA－cosB－cosC $\geq\frac{3}{2}-\frac{1}{2}\times \frac{9}{4}$＞0 ⇒ cosA＞cosB＋cosC

    故選(A)(B)(E)'
