- id: doc_109_台中_台中女中_數學_數A_g11s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 已知數對（x，y）為方程式$y = \sqrt{4 - x^{2}}$之解，則關於 3x＋4y 之敘述哪些是正確的？
  options:
  - label: A
    content: 不等式（$x^{2}$＋$y^{2}$）（$3^{2}$＋$4^{2}$）$\geq$（3x＋4y）$^{2}$ 恆成立
  - label: B
    content: 3x＋4y 有最大值 10
  - label: C
    content: 3x＋4y 有最小值－10
  - label: D
    content: 3x＋4y 最大值成立於$\frac{x}{3} = \frac{y}{4}$
  - label: E
    content: 3x＋4y 最小值成立於$\frac{x}{3} = \frac{y}{4}$
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$y = \sqrt{4 - x^{2}}\Rightarrowy^{2}$＝4－$x^{2}\Rightarrowx^{2}$＋$y^{2}$＝4，其中 0$\leq$y$\leq$2，－2$\leq$x$\leq$2

    由柯西不等式知（$x^{2}$＋$y^{2}$）（$3^{2}$＋$4^{2}$）$\geq$（3x＋4y）$^{2}$

    $\Rightarrow$4×25$\geq$（3x＋4y）$^{2}\Rightarrow$－10$\leq$3x＋4y$\leq$10

    當$\frac{x}{3} = \frac{y}{4}$，且 x，y＞0 時，3x＋4y 有最大值為 10

    當$\frac{x}{3} = \frac{y}{4}$，且 x，y＜0 時，3x＋4y 有最小值為－10（不合）

    故選(A)(B)(D)'
- id: doc_109_台中_台中女中_數學_數A_g11s1e3_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 關於三角不等式之敘述，下列選項中哪些是正確的？
  options:
  - label: A
    content: 對於任意兩實數 a，b，不等式∣a∣＋∣b∣$\geq$∣a＋b∣恆成立，且當 ab$\geq$0 時，等號成立
  - label: B
    content: 對於兩實數 a＝x－1，b＝x－3，存在實數 x，使得∣a∣＋∣b∣＝1
  - label: C
    content: 對於任意兩向量$\vec{a}$，$\vec{b}$，不等式$| \vec{a} | + | \vec{b} | \geq | \vec{a} + \vec{b} |$恆成立，且當$\vec{a}$//$\vec{b}$時，等號成立
  - label: D
    content: 對於兩向量$\vec{a}$＝（x－1，2），$\vec{b}$＝（x－3，4），存在實數 x，使得$| \vec{a} | + | \vec{b} | = 6$
  - label: E
    content: 當$\vec{a}\perp \vec{b}$時，$| \vec{a} | ^{2} + | \vec{b} | ^{2} = | \vec{a} + \vec{b} | ^{2}$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○

    (B)╳：由∣a∣＋∣b∣＝∣a∣＋∣－b∣$\geq$∣a－b∣

    $\Rightarrow$∣x－1∣＋∣x－3∣$\geq$∣（x－1）－（x－3）∣＝2

    ∴不存在實數 x，使得∣a∣＋∣b∣＝1

    (C)╳：$| \vec{a} | + | \vec{b} | \geq | \vec{a} + \vec{b} |$恆成立，當$\vec{a}$//$\vec{b}$ 且$\vec{a}$，$\vec{b}$同向時，等號成立

    (D)╳：$| \vec{a} |$＝∣（x－1，2）∣＝$\sqrt{( x - 1 ) ^{2} + 2^{2}}\geq$2，當 x＝1 時，$| \vec{a} |$有最小值為 2

    $| \vec{b} |$＝∣（x－3，4）∣＝$\sqrt{( x - 3 ) ^{2} + 4^{2}}\geq$4，當 x＝3 時，$| \vec{b} |$有最小值為 4

    ∴不存在實數 x，使得$| \vec{a} | + | \vec{b} | = 6$

    (E)○：當$\vec{a}\perp \vec{b}$時$\Rightarrow\vec{a} \cdot \vec{b} = 0$

    ∴$| \vec{a} + \vec{b} | ^{2}$＝$| \vec{a} | ^{2} + 2\vec{a} \cdot \vec{b} + | \vec{b} | ^{2}$＝$| \vec{a} | ^{2} + | \vec{b} | ^{2}$

    故選(A)(E)'
