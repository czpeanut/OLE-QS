  - label: A
    content: （16，10）
  - label: B
    content: （16，－10）
  - label: C
    content: （－16，－10）
  - label: D
    content: （8，0）
  - label: E
    content: （－8，0）
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '設 P（x，y），由$\vec{PQ} = 3\vec{a} + 2\vec{b}$

    $\Rightarrow$（4－x，5－y）＝3（2，－1）＋2（3，4）＝（6，－3）＋（6，8）＝（12，5）

    ∴x＝－8，y＝0$\Rightarrow$P 點坐標為（－8，0）

    故選(E)'
