  stem: 設 A、B、C 皆為二階方陣，I 是二階單位方陣，O 是二階零方陣，則下列各敘述哪些恆為真？
  options:
  - label: A
    content: 若 AB＝O，則 A＝O 或 B＝O
  - label: B
    content: 若 A＝I 或 A＝－I，則 $A^{2}$＝I
  - label: C
    content: 若 A≠O，且 AB＝AC，則 B＝C
  - label: D
    content: 若$A^{-1}$存在，則$(A+A^{-1})^{2}$＝$A^{2}$＋2I＋$(A^{-1})^{2}$
  - label: E
    content: （A＋B）（A－B）＝$A^{2}$－$B^{2}$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$A=\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，$B=\left[ \begin{matrix}0 & 0 \\ 0 & 1\end{matrix} \right]$，得 AB＝O，但 A≠O 且 B≠O

    (B) ○：注意，反之不然，例如$A=\left[ \begin{matrix}1 & 0 \\ 0 & -1\end{matrix} \right]$，亦滿足 $A^{2}$＝I

    (C) ╳：detA≠0，即$A^{-1}$存在時，才有 AB＝AC ⇒$A^{-1}$（AB）＝$A^{-1}$（AC）⇒ B＝C

    (D) ○：$(A+A^{-1})^{2}$＝$(A+A^{-1})(A+A^{-1})$＝AA＋$AA^{-1}$＋$A^{-1}A$＋$A^{-1}A^{-1}$＝$A^{2}+2I+(A^{-1})^{2}$

    註：$AA^{-1}$＝$A^{-1}A$＝I

    (E) ╳：（A＋B）（A－B）＝AA－AB＋BA－BB＝$A^{2}$－AB＋BA－$B^{2}$

    註：AB＝BA 時，才有（A＋B）（A－B）＝$A^{2}$－$B^{2}$

    故選(B)(D)'
