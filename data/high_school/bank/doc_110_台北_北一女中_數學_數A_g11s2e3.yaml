  explanation: '$\left[ \begin{matrix}1 & 2 & a & b \\ 2 & 3 & c & d\end{matrix} \right]$→$\left[ \begin{matrix}1 & 0 & -2 & 4 \\ 0 & 1 & 2 & -2\end{matrix} \right]$，表示$〔A | B〕$→$〔I | C〕$，即$A^{-1}A=I , A^{-1}B=C$

    設$A=\left[ \begin{matrix}1 & 2 \\ 2 & 3\end{matrix} \right]$，$B=\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$，$C=\left[ \begin{matrix}-2 & 4 \\ 2 & -2\end{matrix} \right]$

    ∴B＝AC＝$\left[ \begin{matrix}1 & 2 \\ 2 & 3\end{matrix} \right] \left[ \begin{matrix}-2 & 4 \\ 2 & -2\end{matrix} \right] =\left[ \begin{matrix}2 & 0 \\ 2 & 2\end{matrix} \right]$

    故序組（a，b，c，d）＝（2，0，2，2）'
