questions:
- id: doc_111_桃園_武陵_數學_數A_g11s2e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設空間坐標系中三點 A（3，2，1），B（5，1，－1），C（2，0，3），向量 $\vec{u}$＝$r\vec{AB}+\vec{AC}$，r 為實數，請選出正確的選項。
  options:
  - label: A
    content: 兩向量$\vec{AB}$與$\vec{AC}$夾角為銳角
  - label: B
    content: △ABC 面積小於 4
  - label: C
    content: 向量$\vec{AB}$在$\vec{AC}$上的正射影長小於 1
  - label: D
    content: 若$| \vec{u} |$最小時，則 r＞0
  - label: E
    content: 若$\vec{u}$平分∠BAC，則 r 為正整數
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$\vec{AB}$＝（2，－1，－2），$| \vec{AB} |$＝$\sqrt{2^{2}+(-1)^{2}+(-2)^{2}}$＝3

    $\vec{AC}$＝（－1，－2，2），$| \vec{AC} |$＝$\sqrt{(-1)^{2}+(-2)^{2}+2^{2}}$＝3

    令兩向量夾角為 θ

    則 cosθ＝$\frac{\vec{AB} \cdot \vec{AC}}{| \vec{AB} | | \vec{AC} |}$＝$\frac{-2+2-4}{3 \cdot 3}$＝$-\frac{4}{9}$＜0

    故 θ 為鈍角

    (B) ╳：sinθ＝$\sqrt{1-\cos ^{2}\theta}$＝$\sqrt{1-\frac{16}{81}}$＝$\frac{\sqrt{65}}{9}$

    △ABC＝$\frac{1}{2} \cdot | \vec{AB} | | \vec{AC} | \sin \theta$＝$\frac{1}{2}$．3．3．$\frac{\sqrt{65}}{9}$＝$\frac{\sqrt{65}}{2}$＞$\frac{8}{2}$＝4

    (C) ╳：$\vec{AB}$在$\vec{AC}$上正射影長＝$| | \vec{AB} | \cos \theta |$＝$\left| 3 \cdot \left( -\frac{4}{9} \right) \right|$＝$\frac{4}{3}$＞1

    (D) ○：$\vec{u}$＝（2r－1，－r－2，－2r＋2）

    $| \vec{u} | ^{2}$＝（2r－1）$^{2}$＋（－r－2）$^{2}$＋（－2r＋2）$^{2}$

    ＝$4r^{2}$－4r＋1＋$r^{2}$＋4r＋4＋$4r^{2}$－8r＋4＝$9r^{2}$－8r＋9

    ＝$9\left( r^{2}-\frac{8}{9}r+\left( \frac{4}{9} \right) ^{2} \right) +9-\frac{16}{9}$＝$9\left( r-\frac{4}{9} \right) ^{2}+\frac{65}{9}$

    當 r＝$\frac{4}{9}$時，$| \vec{u} |$有最小值$\sqrt{\frac{65}{9}}$＝$\frac{\sqrt{65}}{3}$

    (E) ○：若$\vec{u}$平分∠BAC，則$r | \vec{AB} |$＝$| \vec{AC} |$⇒ r＝1

    故選(D)(E)'
