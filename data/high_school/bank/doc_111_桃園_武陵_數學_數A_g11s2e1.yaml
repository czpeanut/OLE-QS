- id: doc_111_桃園_武陵_數學_數A_g11s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 設兩空間向量$\vec{u}$＝（a，b，0），$\vec{v}$＝（c，d，1），滿足 $a^{2}$＋$b^{2}$＝$c^{2}$＋$d^{2}$＝3，請選出正確的選項。
  options:
  - label: A
    content: 向量$\vec{u}$與 z 軸垂直
  - label: B
    content: $\vec{u} \cdot \vec{v}$的最大值為$\sqrt{3}$
  - label: C
    content: $\vec{u}$與$\vec{v}$的夾角最大為 150°
  - label: D
    content: ad－bc 的值可能為$2\sqrt{3}$
  - label: E
    content: $| \vec{u}\times \vec{v} |$的最大值為$2\sqrt{3}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：z 軸方向向量（0，0，1）

    ∵（a，b，0）．（0，0，1）＝0

    ∴$\vec{u}$⊥z 軸

    (B) ╳：$\vec{u} \cdot \vec{v}$＝ac＋bd

    又（$a^{2}$＋$b^{2}$）（$c^{2}$＋$d^{2}$）≥（ac＋bd）$^{2}$

    ⇒－3 ≤ ac＋bd ≤ 3

    最大值為 3

    (C) ○：令夾角為 θ，則

    cosθ＝$\frac{\vec{u} \cdot \vec{v}}{| \vec{u} | | \vec{v} |}$＝$\frac{ac+bd}{\sqrt{3} \cdot 2}$

    ⇒$\frac{-3}{2\sqrt{3}}$≤ cosθ ≤$\frac{3}{2\sqrt{3}}$

    ⇒$\frac{-\sqrt{3}}{2}$≤ cosθ ≤$\frac{\sqrt{3}}{2}$

    當 cosθ＝$\frac{-\sqrt{3}}{2}$時，θ 有最大值 150°

    (D) ╳：∵（$a^{2}$＋$b^{2}$）（$d^{2}$＋（－c）$^{2}$）≥（ad－bc）$^{2}$

    ∴－3 ≤ ad－bc ≤ 3

    ∵$2\sqrt{3}$＞3

    ∴ad－bc 不可能為$2\sqrt{3}$

    (E) ○：$| \vec{u}\times \vec{v} |$＝$\vec{u}$，$\vec{v}$所張開之平行四邊形面積

    最大值發生於$\vec{u}$⊥$\vec{v}$

    即$| \vec{u}\times \vec{v} |$最大值＝$| \vec{u} | \cdot | \vec{v} |$＝$\sqrt{3} \cdot 2$＝$2\sqrt{3}$

    故選(A)(C)(E)'
