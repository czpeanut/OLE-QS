    ⇒$\left[ \begin{matrix}1 & 2 \\ a & 1\end{matrix} \right] \left[ \begin{matrix}2 & 3 \\ -1 & b\end{matrix} \right]$＝$\left[ \begin{matrix}2 & 3 \\ -1 & b\end{matrix} \right] \left[ \begin{matrix}1 & 2 \\ a & 1\end{matrix} \right]$⇒$\left[ \begin{matrix}0 & 2b + 3 \\ 2a - 1 & 3a + b\end{matrix} \right]$＝$\left[ \begin{matrix}3a + 2 & 7 \\ ab - 1 & b - 2\end{matrix} \right]$

