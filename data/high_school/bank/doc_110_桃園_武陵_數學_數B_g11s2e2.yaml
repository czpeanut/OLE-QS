  stem: 設 $A, B, C$ 均為二階方陣，$I$ 為二階單位方陣，$O$ 為二階零矩陣，$\det(A)$ 表矩陣 $A$ 的行列式值，試選出正確的選項。
  options:
  - label: A
    content: $A(B+C) = AB + CA$
  - label: B
    content: $AI = IA$ 必不成立
  - label: C
    content: $(AB)C = A(BC)$
  - label: D
    content: 若 $\det(A)\neq 0$，且 $AB = AC$，則 $B = C$
  - label: E
    content: 若 $AB = O$，則 $A = O$ 或 $B = O$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：A（B＋C）＝AB＋AC≠AB＋CA

    (B)╳：IA＝AI＝A

    (C)○

    (D)○：det(A)≠0 ⇒ $A^{－1}$ 存在

    所以 AB＝AC ⇒ $A^{－1}$AB＝$A^{－1}$AC ⇒ B＝C

    (E)╳：反例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，B＝$\left[ \begin{matrix}0 & 0 \\ 1 & 0\end{matrix} \right]$

    故選(C)(D)'
