  stem: 下列關於磷酸化作用合成ATP的敘述，何者正確？
  options:
  - label: A
    content: 粒線體和葉綠體主要以受質階層磷酸化作用合成ATP
  - label: B
    content: 葉綠體內、外膜間的膜間腔與葉綠體基質間的$H^{＋}$濃度差異促使ATP合成
  - label: C
    content: 粒線體內膜上所進行的氧化還原反應，可降低粒線體基質的$H^{＋}$濃度
  - label: D
    content: 進行有氧呼吸時，多數ATP的合成必須要有高能量物質提供磷酸根才能合成ATP
  answer:
  - C
  answer_status: verified
