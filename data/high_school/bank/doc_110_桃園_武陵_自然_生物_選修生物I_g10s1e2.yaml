  group_stem: (一)酵母菌在有氧情況下，有葡萄糖存在的時候，即使有其他醣類，仍只會利用葡萄糖，這種現象稱為「葡萄糖抑制作用」（glucose repressin）。如果環境中只有葡萄糖，氧氣不足時，酵母菌為了生存，會利用丙酮酸進行酒精發酵，產生乙醇與二氧化碳。但若缺氧環境中存在多種醣類，酵母菌不會受到葡萄糖抑制作用的影響，即使環境中存在葡萄糖，酵母菌仍會轉而利用其他碳源。在這樣的狀況下，雖然酵母菌照常生長，但是並未進行發酵作用，而其他的細菌也跟著一起生長，於是發酵就失敗了。研究發現這種發酵停滯的現象，是因酵母菌內產生了GAR蛋白所引起。GAR即「對葡萄糖抑制作用有抵抗力」（resistant to glucose-associated repression）的意思。 分析發酵停滯的培養液可以發現，其中不只有酵母菌，也含有大量的其他細菌。某些種類的細菌（如葡萄球菌Staphyloccusalliarim）會引酵母菌內的GAR蛋白產生，使酵母菌轉而利用其他碳水化合物，不再利用葡萄糖，發酵作用也因此減緩，培養液內酒精濃度的上升速度也隨之變慢，這使其他細菌在較佳的生長環境中能夠存活，同時酵母菌仍可維持繼續生長。研究發現，表現GAR蛋白的酵母菌較原來的酵母菌更耐乙醇，也更能夠在養分不足（低胺基酸）的環境下生存，所以可以說那些細菌跟酵母菌已經達成互利共生了。根據上文，請依序回答第39.～43.題：
