  stem: 下列哪種因素使得缺氧下，酵母菌必須進行醱酵作用？
  options:
  - label: A
    content: 酵母菌在有氧情況會死亡，所以必須在缺氧狀況進行酒精發酵
  - label: B
    content: 糖解產生的NADH必須形成$NAD^{＋}$才能使醣解繼續，缺氧下只能用以還原丙酮酸
  - label: C
    content: 醱酵產生的ATP比有氧呼吸多，所以進行醱酵作用
  - label: D
    content: 酵母菌無粒線體，就算在有氧情況也不可能進行有氧呼吸
  answer:
  - B
