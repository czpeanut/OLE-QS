  type: single
  page: 7
  stem: '影響光合作用速率的因素很多，其中光強度是影響光合速率的重要因子之一。今將光強度與二氧碳的吸收速度畫成一曲線，可將其視為光合速率曲線。葉肉細胞行光合作用吸收二氧化碳的同時，也會進行呼吸作用，釋放二氧化碳。當吸收二氧化碳和釋出二氣化碳含量相等時，此光強度稱為光補償點；當光合速率隨著光強度而增加，直到一適當光強度為止，光合速率不再增加，此一不再使光合速率增加的光強度，稱為光飽和點。陽性植物具有較高的光飽和點，反之為陰性植物。附圖為甲乙兩種不同植物在不同光度下的作用曲線，試回答下列問題：

    (1) 關於附圖敘述，下列何者正確？（1分）

    (2) 請問甲、乙何者為陽性植物？（1分）

    (3) 承(2)，該植物適合生活於森林底層嗎？（1分）請從光補償點解釋之。（2分）'
  options:
  - label: A
    content: 光強度與光合速率成正比
  - label: B
