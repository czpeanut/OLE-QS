  - label: B
    content: 實名制的管制措施，可確保政府掌握接觸對象及範圍，符合公開原則
  - label: C
    content: 疫情指揮中心顯然偏袒夜店與酒吧，未同樣令其停業，違反公正為原則
  - label: D
    content: 實名制無法確保民眾保持安全距離，無法達成防疫目的，違反了比例原則
  group_stem: 2020 年 4 月因為新冠肺炎疫情趨嚴，加上傳出有酒店、舞廳的公關在接觸客人之後確診的傳言，政府宣布酒店、舞廳停業。據新聞指出，疫情指揮中心認為舞廳、酒店等場所較不容易保持社交距離，因此採取停業的措施，但酒吧、夜店暫不列入，先請業者盡力讓消費者保持安全社交距離，若無法達成，不排除也納入停業範圍。同年 5 月底，因為疫情趨緩，臺灣連日 0 新增確診案例，部分酒店、舞廳將解禁，但基於此類場所出入複雜，若出現確診案例，較不容易確定曾接觸的群眾，因此政府擬採實名制，到此類場所的民眾須登記姓名，以利政府追查。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)此處並無公開相關資訊，與公開原則無關。(C)依據實際影響情況，而有不同的措施與方法，屬於比例原則。(D)此處無法確定實名制的功效。
