  group_stem: 1944 年，美國有一位 14 歲的黑人男童喬治．史丁尼被（George Stinney）指控殺害兩名白人女童，隨後被判處死刑，成為美國史上最年輕的死刑犯。調查過程中，喬治被隔離在上鎖的小房間中，沒有律師、沒有其他證人陪同，單獨接受白人警察的審訊，幾個小時候警察就宣布喬治已認罪。讓喬治定罪的唯一證據，是警方提供的供詞，但這份用於定罪的供詞沒有呈庭的書面紀錄，喬治本人也否認供詞內容屬實。喬治在全白人的陪審團決議下，被判處死刑，直到在 2014 年才被翻案，撤銷有罪判決。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)有犯罪就不屬於曝險少年。(B)殺人罪屬於 5 年以上的重罪，為少年刑事案件。(D) 14 歲屬於限制責任能力人，得減輕其刑。
