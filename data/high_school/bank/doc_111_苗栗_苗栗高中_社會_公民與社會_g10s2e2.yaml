  stem: 近年來，世界各國因毒品問題對社會的危害感到相當棘手，儘管各國不斷重刑化毒品相關罪責，但依然無法根除，我國立委擬提出「施用毒品罪醫療前置化」的修法草案，目的是希望能讓「單純施用毒品（非販賣、製造或運輸）」的藥癮者在進入司法程序之前，先按時到醫療機構接受藥癮治療的計畫。請問這種想法最接近哪個刑罰理論？
