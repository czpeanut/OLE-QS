- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_36
  section: 1
  number: 36
  type: single
  page: 6
  stem: 在我國刑事法規中，若以告訴權人提起告訴為追訴條件的罪名（例如：公然侮辱罪），稱之為「告訴乃論」之罪；反之，不以告訴為追訴條件的罪名（例如：殺人罪），則為「非告訴乃論」之罪。媒體報導時，經常將非告訴乃論之罪誤稱為「公訴罪」。下列關於這三種概念的說明，何者正確？
  options:
  - label: A
    content: 公訴是指由檢察官代表國家，針對犯罪行為向法院提起訴訟
  - label: B
    content: 凡在《刑法》規定中屬告訴乃論之罪者，檢察官即不可提起公訴
  - label: C
    content: 被害人自己提起刑事訴訟，不符合公訴制度，法院不得審判
  - label: D
    content: 凡屬非告訴乃論之罪者，法院可以不待檢察官起訴逕行審判
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)屬於告訴乃論，指的是須由被害人或有告訴權之人提出告訴，方才會進入偵查程序，並非不得提出公訴。(C)被害人可以自己聘請律師，此稱為自訴。(D)法院秉持不告不理原則，仍須由檢察官提起公訴，方可開庭審理。
