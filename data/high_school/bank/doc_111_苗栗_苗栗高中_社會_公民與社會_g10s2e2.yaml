- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s2_45
  section: 2
  number: 45
  type: single
  page: 7
  stem: 「小燈泡」母親認為王無病識感，希望判王極刑（即死刑），讓他沒有機會再犯，使每位小孩有平安長大機會。此一想法較接近哪種刑罰理論？
  options:
  - label: A
    content: 應報理論
  - label: B
    content: 一般預防理論
  - label: C
    content: 特別預防理論
  - label: D
    content: 綜合理論
  group_stem: 男子王景玉涉嫌割喉殺害北市 3 歲女童「小燈泡」，一、二審都依鑑定王罹患思覺失調症，判王無期徒刑，高院更一審審理進行「補充鑑定」，仍認定王犯案時有辨識違法能力，今進行言詞辯論庭，檢方指控王殺女童歷經「等待、尋找和藏匿凶刀」等犯案計畫，具辨識能力，應判死刑，王的律師團則稱王是精神障礙者，殺人動機和罹患思覺失調症有高度關聯，不應判死刑，「小燈泡」母親、時代力量不分區立委候選人王婉諭當庭數度哽咽認為，行政機關仍無法提供高度社會安全防護網，而王無病識感，希望判王極刑（即死刑），讓每位小孩有平安長大機會。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 死刑屬於應報理論，故選(A)。(B)一般預防理論指的是對一般人的預防措施。(C)特別預防理論是透過刑罰過程，教育犯罪行為人改過自新，死刑非此方式。(D)綜合理論指的是綜合了應報理論與預防理論。
