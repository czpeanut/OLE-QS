  stem: 病患或家屬總對醫師有高度的期待，希望在醫師的努力下，能妙手回春，然而若憾事發生，當病患非死即傷，則會對醫師提告，以維權利；但由另一角度思考，也不能讓醫師負擔無限的責任。因此醫界近年來建議，醫療過失行為應除罪化。此一建議，與下列何項觀念最為接近？
