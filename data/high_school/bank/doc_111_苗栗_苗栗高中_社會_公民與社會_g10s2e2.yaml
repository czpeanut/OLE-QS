  stem: 一名少年無照騎車搶奪婦人皮包，婦人被拖行了數公尺，少年遭逮捕後表示，他僅是搶奪皮包，並未對婦人做出攻擊動作，認為只造成對方些許皮肉傷，然而婦人在事件發生後，不敢再上街，甚至聽見機車聲音靠近便感到畏懼。許多案件的加害人其實難以想像，事件的發生對被害人的生命造成巨大改變，此時可以藉由修復式正義彌補刑罰的不足，同時降低加害人的再犯率。若上述案件採取「修復式正義」的做法，對於相關程序的說明，下列何者正確？
  options:
