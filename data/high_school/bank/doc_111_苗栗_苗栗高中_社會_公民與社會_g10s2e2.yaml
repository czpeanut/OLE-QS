questions:
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 為了管理散落在農地上的違章工廠，政府決定修法，針對 2016 年 5 月 20 日後新建的工廠，立即停電、停水、拆除。假設即將被拆的工廠，遊說經濟部修法，提出以擴大投資換取免拆。若經濟部同意，該「擴大投資換取免拆」之作法可能會違反下列何種法律原則的內涵？
  options:
  - label: A
    content: 平等原則
  - label: B
    content: 比例原則
  - label: C
    content: 禁止不當聯結原則
  - label: D
    content: 信賴保護原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 違章工廠違法應當拆除，但是卻可以透過擴大投資免拆，此違反了禁止不當聯結原則，故本題選(C)。(A)平等原則指行政行為不得無正當理由而有差別對待，與此處無關。(B)比例原則主要是規範手段與目的之間的關係，與此處無關。(D)信賴保護原則是指政府不應隨意變更原本的處分，以保護人民對政府的信賴。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某公司從某國進口符合該國食用油標準之食用油，但進口時為逃避繁瑣的進口檢驗，刻意選擇「工業用途」名義以加速通關。相關食安法律規定，申報不實得處新臺幣三百萬元以下罰鍰。某市政府查獲該公司申報不實後，因其行為對消費者造成重大食安疑慮，決定處以最高額度的罰鍰。該公司不服，表示該油品符合輸出國的食用油標準，並無影響人民健康的重大違法情節。依前述，該公司若要提起行政訴訟，訴訟攻防中可以主張的法律原則為何？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 正當程序
  - label: C
    content: 信賴保護
  - label: D
    content: 誠實信用
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文可知，該廠商認為雖然違法申報為工業用油，但實際上仍為食用油，不應該處以最高罰鍰，應當是認為政府手段太過，違反比例原則，故本題選(A)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小高約了同窗好友阿富、阿貴及聖傑開補習班，小高為使執照的申請儘速通過，偽造了相關的證件，之後順利拿到執照，也開始招生。未料鄰居在偶然情況下得知小高欺騙的行為，遂向相關單位舉發，小高的補習班也因此遭撤照，損失數十萬。小高能否要求政府依信賴保護原則予以補償？
  options:
  - label: A
    content: 可以，因為政府違反了信賴基礎
  - label: B
    content: 可以，因為小高的損失和政府的撤照有因果關係
  - label: C
    content: 不可以，因為小高的損失並不慘重
  - label: D
    content: 不可以，因為小高用欺騙的方式，信賴不值得保護
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 小高偽造相關證件而取得補習班執照，此違反誠信在先，因此無法主張信賴保護原則。故本題選(D)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「原平與楓康同時皆因騎機車未戴安全帽，遭員警攔下，但因楓康當場賄賂該員警，而未遭到告發，僅有原平遭到員警告發開立罰單。於是原平心生不滿，決定至相關單位申訴，並舉證該員警之違法行為。」請問下列敘述何者正確？
  options:
  - label: A
    content: 該員警因違反「平等原則」，故原平之申訴有效，其未戴安全帽之告發單依法撤銷
  - label: B
    content: 該員警因涉嫌違法貪汙瀆職，應受刑事及行政懲處。但因原平未戴安全帽仍屬事實，依法該罰單仍有效
  - label: C
    content: 該員警之行為屬於行政裁量自由，其行為完全合法，依法原平之罰單仍有效
  - label: D
    content: 該員警之行為涉嫌違法貪汙瀆職，故其行政行為不生效力，依法原平之罰單依法撤銷
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)雖然員警收受賄賂，未開罰一同違規的楓康，但原平仍不得主張違法的平等。(C)員警收賄賂不開罰楓康的行為，已違反行政裁量權。(D)原平仍然違規，因此罰單仍有效力。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 行政機關作行政處分時須遵守法律規定外，尚須符合比例原則。請問下列何者符合比例原則？
  options:
  - label: A
    content: 亂丟垃圾罰款 10 萬元
  - label: B
    content: 為了維持交通秩序，禁止車速超過 5 公里
  - label: C
    content: 政府為開闢一條巷道，命令附近居民一天之內搬家
  - label: D
    content: 為避免打擾附近居民，要求選舉造勢晚會在 10 點之前結束
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)罰款過高，應當違反比例原則。(B)車速低於 5 公里，過於緩慢，應當違反比例原則。(C)為了開闢一條巷道，要求一天內搬家，此要求違反比例原則。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 國家行政的內容非常多樣，舉凡我國的水電與健保費率、連續假期的高速公路高承載管制等日常生活常見的事項，都是屬於國家行政。國家在執行行政權時，必須符合正當行政程序，「程序正義」與「實體正義」都應該要兼顧，前者是指過程合法且適當，後者則指結果合法且適當。下列何者屬於「程序正義」的範疇？
  options:
  - label: A
    content: 為防範學生吸食毒品，校長個人決定每天隨機對不同學生搜書包
  - label: B
    content: 為挽救全民健保的財務危機，衛福部逕行決定立即提高健保費率
  - label: C
    content: 為解決設立科學園區的爭議，環境資源部依法定程序進行環境影響評估審查
  - label: D
    content: 為落實校園安全，教育部自行規定所有學生都必須強制建立指紋檔案
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)校長此舉將侵犯學生的隱私權，且不符合行政程序，應在有合理懷疑下，由其他老師陪同方可進行檢查。(B)費率的調高須有法律的授權，行政機關不得「逕行」調高健保費率，此舉違反正當行政程序。(D)影響權利義務的部分都需要有法律的授權，教育部此舉違反法律保留原則與正當行政程序。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 有一日小倫騎機車違規右轉，員警見狀一路追趕，追進對方家中的停車場並開單。之後法官認為停車場已屬私人領域，需因阻止犯罪或避免急迫危險時方可進入私人領域，員警明顯過當行使職權，違反「甲」原則，判決撤銷罰單。下列何項情形也是違反「甲」原則？
  options:
  - label: A
    content: 警方深夜進入撞球場臨檢，規定所有人必須查驗身分、全身檢查，並且強制驗尿、驗血
  - label: B
    content: 環保署去函通知焚化廠應於 6 個月之內改善廢氣汙染，然而未經 6 個月就予以罰鍰處分
  - label: C
    content: 《檢肅流氓條例》中對於「流氓」的定義太過模糊，大法官宣告法條已違憲，決定廢除
  - label: D
    content: 政府與建商簽約，約定建商便宜租賃新建案給政府做為辦公室，政府隨即核發建案執照
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 員警為了開罰而過當行使職權，可知違反比例原則，而全面臨檢亦違反比例原則，故選(A)。(B)此違反誠實信用原則。(C)此違反明確性原則。(D)此違反禁止不當聯結的原則。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 良偉在 google 打入「政府資訊公開」關鍵字，出現將近 5 千萬筆資料，有關我國目前政府資訊公開的規定，下列何者正確？
  options:
  - label: A
    content: 規範於《行政程序法》，尚未制定專法規範
  - label: B
    content: 保障政府知的權利，落實法律優越原則
  - label: C
    content: 增進人民對公共事務的了解、信賴及監督
  - label: D
    content: 以不公開為原則，公開為例外，促進民主參與
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)規範於《政府資訊公開法》。(B)應當是保障人民知的權利，落實資訊公開的原則。(D)應當是以公開為原則，不公開為例外。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 行政訴訟堅實第一審新制將於 2023 年 8 月 15 日正式上路，新制中把原本分散在全國 22 個地院行政訴訟庭審理的事件，改由臺北、臺中、高雄 3 所高等行政法院設置的「地方行政訴訟庭」審理，高等行政法院內另設「高等行政訴訟庭」以做區分，以此改制以強化法官專業性，此外，還設立多個配套措施，如巡迴法庭與遠距審理等制度。請問下列有關此次修法的意義何者正確？
  options:
  - label: A
    content: 巡迴法庭與遠距審理主要為保障人民應訴便利
  - label: B
    content: 簡易訴訟制度將以高等行政法院「高等行政訴訟庭」為第一審
  - label: C
    content: 第一審行政法院為法律審，最高行政法院為事實審
  - label: D
    content: 居住地與法院相距過遠的民眾，只能選擇距離較近的高等行政法院進行訴訟
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)簡易訴訟是以高等行政法院「地方行政訴訟庭」為第一審。(C)第一審行政法院為事實審，最高行政法院為法律審。(D)依據題文可知，仍有巡迴法庭與遠距審理的制度。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 當人民權益因行政機關不當或違法行為而受有損害時，行政救濟是保障人民權利的最後一道防線。而行政救濟又可分為「法院救濟」與「法院外救濟」。後者只是輔助性質，真正重要的是「法院救濟」。原因是下列何者？
  options:
  - label: A
    content: 法院審理案件簡單快速，可以保障人民的權益
  - label: B
    content: 司法權獨立行政機關之外，行政救濟效果顯著
  - label: C
    content: 行政機關「官官相護」，無法公正為民爭權益
  - label: D
    content: 法院救濟才可改變行政決定，法院外救濟不能
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)訴訟不會簡單快速，是嚴謹而耗時的。(B)此為權力分立，確實能保障人民權利。(C)行政機關並非皆「官官相護」。(D)法院外救濟也可以保障人民權益，例如：訴願即是。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 小蘇是位高中生，因在課堂上與同學聊天，擾亂上課秩序，對於老師的制止感到不耐，遂對老師惡言相向，老師據以提出記三支大過的退學處分，校方也同意將該生記過退學。若根據現行法令與相關規定，小蘇可主張哪一種救濟管道以保障自己的權益？
  options:
  - label: A
    content: 尋找同學當證人，透過記者會說明
  - label: B
    content: 無校內申訴管道，只能提出行政訴訟
  - label: C
    content: 直接到教育部陳情，並請立法院教育委員會委員介入調解
  - label: D
    content: 必須先向校內提出申訴，不服申訴結果才得提起再申訴及行政訴訟
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 小蘇或其法定代理人，先向學校的學生申訴評議委員會提出申訴，若是不滿評議結果，得向原處分機關（學校）的上級主管機關（例如：教育部）提起「再申訴」程序，故答案選(D)。(A)此非行政救濟的管道。(B)可向校內學生獎懲委員會提出申訴。(C)此非正常行政救濟管道。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 甲男與懷孕之妻返家時，警覺陌生人入宅行竊；竊嫌持利刃攻擊甲男之妻以利脫逃。為保護妻子，甲男奮力奪刃時不慎造成竊嫌手臂扭傷脫臼。依我國《刑法》規定，下列敘述何者正確？
  options:
  - label: A
    content: 甲男可主張正當防衛，但對竊嫌之受傷仍須負完全刑事責任
  - label: B
    content: 甲男可主張正當防衛，若成立則不構成犯罪而無須負擔刑責
  - label: C
    content: 財物損失與致使竊嫌受傷不成比例，甲男不可主張正當防衛
  - label: D
    content: 竊嫌係攻擊甲男之妻，非攻擊甲男，甲男不可主張正當防衛
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)正當防衛屬於阻卻違法事由之一，不具有違法性，當然不構成犯罪。(B)(C)面對當下的危險，為了保護自己與妻子，應當成立正當防衛。(D)甲男仍可主張正當防衛。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 《行政程序法》第 1 條：「為使行政行為遵循公正、公開與民主之程序，確保依法行政之原則，以保障人民權益，提高行政效能，增進人民對行政之信賴，特制定本法。」下列行政行為與行政法原則的連結，何者正確？
  options:
  - label: A
    content: 陳述意見的權利─公正
  - label: B
    content: 行政組織必須依法組成─公正
  - label: C
    content: 禁止不必要的接觸─公開
  - label: D
    content: 民眾有閱覽卷宗權─民主
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)陳述意見為民主原則。(C)禁止不必要的接觸屬於公正原則。(D)閱覽卷宗權屬於公開原則。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 某次颱風來臨前夕，有民眾赫然在網路上看到行政院人事行政局宣布：「全國各縣市停班、停課『一年』」。原來是一名吳姓國中生，因一時好玩下載人事行政局天然災害停止辦公及上課情形查詢網頁的原始檔案，全部改成今日起停班、停課一年的版本，然後上傳到自己架設的網站。經人事行政局向警方報案，這名國生被依偽造公文書罪函送法辦。有 4 位學生在下課時討論吳姓國中生這樣的行為是否應受刑罰，請問依據我國《刑法》規範，誰的分析是正確？
