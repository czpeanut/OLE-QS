  stem: 《國民法官法》的實施，讓未來刑事重案的論罪量刑，不再僅由職業法官論斷，人民的意見也會被納進來，提升司法透明度、反映國民正當法律感情、增進國民對於司法之了解及信賴。該法規定，最輕本刑為有期徒刑 10 年以上之罪，及故意犯罪因而造成死亡結果的公訴案件，第一審地方法院均應行「國民參與審判」。國民參與審判法庭，由職業法官 3 人及國民法官 6 人所組成，共同進行審判。請問《國民法官法》的規定，應包含下列哪一項？
