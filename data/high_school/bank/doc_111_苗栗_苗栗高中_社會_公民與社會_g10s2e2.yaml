  group_stem: 經過緊張又困難的筆試與路考，高中剛畢業的小朱終於順利通過駕照考試；繳交照片後，監理站將汽車駕駛執照發給他。第一天正式開車上路前，爸爸再三叮嚀一定要遵守交通規則。結果，剛出家門沒多久，他就因為闖紅燈被交通警察攔下，根據《道路交通管理處罰條例》規定，駕駛人闖紅燈可處罰鍰 1,800 元以上 5,400 元以下。結果，經他苦苦哀求並解釋他是新手上路太緊張，無法同時注意交通號誌與行車狀況，警察最後開給他 1,800 元的紅單。
