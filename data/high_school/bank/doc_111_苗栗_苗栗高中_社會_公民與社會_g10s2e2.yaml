  stem: 針對「駕駛人闖紅燈可處罰鍰 1,800 元以上 5,400 元以下，警察最後開給他 1,800 元的紅單」的行政行為，下列哪一項解釋最符合行政法的原則？
  options:
  - label: A
    content: 警察只處罰 1,800 元，違反法律優越原則
  - label: B
    content: 闖紅燈者警察不問原由，一律處罰 1,800 元，符合平等原則
  - label: C
    content: 警察若處罰 5,400 元，符合裁量合法原則
  - label: D
    content: 警察若躲在暗處取締闖紅燈者，有可能違反信賴保護原則
  group_stem: 經過緊張又困難的筆試與路考，高中剛畢業的小朱終於順利通過駕照考試；繳交照片後，監理站將汽車駕駛執照發給他。第一天正式開車上路前，爸爸再三叮嚀一定要遵守交通規則。結果，剛出家門沒多久，他就因為闖紅燈被交通警察攔下，根據《道路交通管理處罰條例》規定，駕駛人闖紅燈可處罰鍰 1,800 元以上 5,400 元以下。結果，經他苦苦哀求並解釋他是新手上路太緊張，無法同時注意交通號誌與行車狀況，警察最後開給他 1,800 元的紅單。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)法律優越原則為下位階不得違反上位階的法規範，警察的行政處分並無違反法律規範。(B)裁量範圍可處罰鍰 1,800 ～ 5,400 元以下，若開罰的金額一律為 1,800 元，則可能有違反比例原則。(D)應當是違反誠實信用原則。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e2_s2_49
