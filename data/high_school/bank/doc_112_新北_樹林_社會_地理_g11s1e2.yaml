  stem: 西班牙的加泰隆尼亞自治區為西國的工業重鎮，每年可為西班牙創造 19 ％的經濟產值，為全西班牙最富裕的地區，但此區獨立聲浪不斷，除了因語言與風俗文化與法國較為類似，對西班牙認同感較低外，特別是 2010 年發生<u>甲事件</u>，西國因面臨嚴重財政危機，失業率飆到 26 ％，政府實施撙節政策，導致加泰隆尼亞區每年繳給中央政府多，但獲得統籌款少，促使 2017 年又一波獨立公投行動出現。請問文中<u>甲事件</u>應該為何？
