  stem: 乾燥的西亞地區早期人口多集中於綠洲附近，下列哪一種方式可提高單位面積產量，提高環境負載力，供養眾多人口？
  options:
  - label: A
    content: 作物高低分層種植
  - label: B
    content: 採行輪流耕作制
  - label: C
    content: 種植多樣作物確保全年有收成
  - label: D
    content: 開發沿海的邊際土地
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)使作物提高單位面積產量的方式為集約耕作，同一塊土地上高低分層種植作物即為集約耕作，可提高產量。(B)輪種為確保地力，而非更集約使用。(C)同一土地耕作多樣性也是較為粗放，而非專業化耕作。(D)乾燥區海岸鹽度高，不適合耕作。
