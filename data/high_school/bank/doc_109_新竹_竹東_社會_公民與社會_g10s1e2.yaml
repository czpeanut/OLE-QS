- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s3_1
  section: 3
  number: 1
  type: single
  page: 4
  stem: '臺中市某高中之學生A，因其於2016年叼含香菸被記小名一次；又因無照騎乘機車，再被記大過一次。新竹市某國中之學生B，因為病假而無法參加定期評量，依照當時的成績評量辦法規定，雖然因病准予補考，但補考的分數超過60分的部分，要打7折計算，兩人分別向學校提出申訴未果，嘗試提起行政救濟，但遭行政法院駁回其訴，於是向大法官聲請解釋《憲法》。
    司法院大法官在2019年10月作出釋字第784號解釋，解釋文中提出：「本於《憲法》第16條保障人民訴訟權之意旨，各級學校學生認其權利因學校之教育或管理等公樹力措施而遭受侵害時，目使非屬退學或類此之處分，亦得按相關措施之性質，依法提起相應之行政爭訟程序以為濟，無特別限制之必要。於此範圍內本院釋字第382號解釋應予變更。」
    而在該解釋的理由書中提到：「至學校基於教育目的或維持學校秩序，對學生所為之教育或管理等公權力措施（例如學習評量、其他管理、獎懲措施等），是否侵害學生之權利，則仍須根據《行政訴訟法》或其他相關法律之規定，依個案具體判斷，尤應整體考量學校所採取措施之目的、性質及干預之程度，如屬顯然輕微之干預，即難謂構成權利之侵害。又即使構成權利之侵害，學生得據以提起行政爭訟機關應予以較高之尊重，自不待言。」

    41. 依據題文判斷，對於釋字第784號解釋的內容，下列詮釋何者最為適當？（2分）'
  options:
  - label: A
    content: 學校訂定學生獎懲規定時，基於比例原則考量，不得僅因無照騎車就記學生大過
  - label: B
    content: 學校的學習評量、管理與獎懲措施等，皆須受到司法審查，以免侵害到學生權益
  - label: C
    content: 僅有類似退學這種「足以改變學生身分」的情形，才會被認定為構成權利之侵害
  - label: D
    content: 無論是大學生或中小學生，只要認為自己權利受到學校侵害，都能提起行政爭訟
