questions:
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2020年自由之家調查報告指出，香港因為2019年逃犯條例發生反送中運動，被認為公民權利遭受侵害而扣分。下列何者可能也會造成自由度評分下降？
  options:
  - label: A
    content: 為防堵武漢肺炎，要求境外返國民眾須居家隔離、居家檢疫14日
  - label: B
    content: 中國為強化國家意識，避免恐怖攻擊，設置教育營教化民眾、拆除教堂寺廟
  - label: C
    content: 義大利因積欠債務被歐盟要求樽節，大砍預算以期減少政府支出
  - label: D
    content: 加拿大傳出疫情惡化將可能封城的傳言，引發超市食物及衛生紙的購熱潮
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 李明哲2017年到中國訪友時失蹤，從此下落不明。妻子李淨瑜多方奔走，在國際非政府組織等的協助下，終於得知李明哲被中國以「煽動顛覆國家政權罪」逮捕，後宣判有期徒刑5年。對於此類事件，下列哪一個國際組織最可能提供助？
  options:
  - label: A
    content: 無國界記者
  - label: B
    content: 自由之家
  - label: C
    content: 國際特赦組織
  - label: D
    content: 聯合國安理會
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在聯合國的主導下，各國簽訂了諸多保障人權的國際公約，然而即使這些公約有國際法的約束力，仍是有許多民眾的人權持續受害，可知聯合國雖基於保護人權的理想而成立，但仍有其侷限性。請問下列何者最能說明聯合國的侷限性？
  options:
  - label: A
    content: 敘利亞政府多次以生化武器攻擊反政府組織，安理會欲禁止各國銷售直升機給敘利亞政府，並獲得多數票贊成，卻因中日和俄羅斯行使否決權而未果
  - label: B
    content: 世界衛生組織主席多次強調中國在武漢疫情中的犧牲與奉獻，並大力稱讚中國是防疫的標竿，呼籲各國應仿效中國的防疫措施
  - label: C
    content: 東帝汶脫離印尼獨立，然而受到印尼支持的民兵部隊卻開始對平民發動攻擊，安理會決議派遣部隊至當地維和，並成功弭平暴亂
  - label: D
    content: 針對白化病患者被當作藥材的惡行，國際特赦組織發起一人一信的「寫信馬拉松」行動，串連了22萬人參與寄信給馬拉威政府，最終促使當局修法禁止相關行為
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 因為武漢肺炎疫情蔓延歐美，許多歐美民眾認為是亞裔帶來了病毒，因此屢傳對亞裔的仇恨性言論，暴力行為，甚至有亞裔因此死亡。而這正是何項人權公約所不願意見到的？
  options:
  - label: A
    content: 保護所有人免遭強迫失蹤國際公約
  - label: B
    content: 《消除對婦女一切形式歧視國際公約》
  - label: C
    content: 《消除一切形式種族歧視國際公約》
  - label: D
    content: 《社會文化權利國際公約》
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 德國《基本法》開宗明義地在第一條第一項即揭示：「人性尊嚴不可侵犯。尊重及保護人性尊嚴為所有國家權力之義務，而我國大法官也在解釋中提到：「人性尊嚴不可侵犯，乃是「先於國家」之自然法的固有法理，而普遍為現代文明國家之《憲法》規範所確認。」下列對於人性尊嚴的論述何者正確？
  options:
  - label: A
    content: 大法官認於只有在《憲法》中明文保障人性尊嚴，人權才能受到保障
  - label: B
    content: 維護人性尊嚴與尊重人格自由發展，乃自由民主憲政秩序之核心價值
  - label: C
    content: 我國與德國對人性尊嚴定義不同，顯示人性尊嚴隨文化不同而有差異
  - label: D
    content: 我國《憲法》並未明文保障人性尊嚴，可看出我國對人權保障並不如德國
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《憲法》第16條明定人民有訴訟之權，旨在確保人民權益遭不法侵害時，有權訴請司法機關予以救濟，這種《憲法》保障的權利稱為「救濟權」。下列哪一個選項「不是」救濟權的範圍？
  options:
  - label: A
    content: 八八水災政府補助受災戶財產損失
  - label: B
    content: 債權人向法要求債務人借款
  - label: C
    content: 土地被徵地主請求政府提高地價
  - label: D
    content: 圍牆被政府誤拆的屋主請求賠償金
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 我國《憲法增修條文》第10條當中提到「國家對於身心障礙者之保險與就醫、無障礙環境之建構、教育訓練與就業輔導及生活維護與救助，應予保障，並扶助其自立與發展。」請問此項規定的目的主要在體現何種憲法精神？
  options:
  - label: A
    content: 尊重多元文化
  - label: B
    content: 追求齊頭平等
  - label: C
    content: 落實實質平等
  - label: D
    content: 實現憲政民主
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 我國《憲法》第23條規定：「以上各條列舉之自由權利，除為防止妨礙仙人自由、避免緊急危難、維持社會秩序或增進公共利益所必要者外，不得以法律限制之。」
  options:
  - label: A
    content: 為避免影響交通，限制高速公路上不得集會遊行
  - label: B
    content: 為興建都會公園園區，徵收私人農耕地作為園區
  - label: C
    content: 為避免豬隻排泄物汙染水源，要求業者遷離上遊
  - label: D
    content: 為避免颱風帶來石流災害，要求民眾強制撤離
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 美國為避免再度遭受恐怖攻擊，在機場對入出境旅客攜帶物品進行嚴格的檢查，現有兩種檢查方式，一種是探測儀器檢查，另一種是要求旅客褪去身上衣物，進行搜身檢查。若兩者皆可達同樣效果，美國航警則採行探測儀器檢查方式。請問此行為最符合比例原則中的哪項子原則？
  options:
  - label: A
    content: 適合性原則
  - label: B
    content: 必要性原則
  - label: C
    content: 衡量性原則
  - label: D
    content: 法律優位原則
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 在民國100年以前，法律規定只有視覺障礙者才可以從事按摩業。但是大法官認為，這樣的規定有差別待遇，侵害了非視覺障礙者的工作權，且也無法使視覺障礙者的社會地位有所提升。現在法律已不再限制只有視覺障礙者才可以從事按摩業，不過仍給予從事按摩的視覺障礙者優惠。例如給予稅率的減免、特定地點營業許可等。下列對於題文裡平等權的運用，何者正確？
  options:
  - label: A
    content: 大法官認為，規定只有視覺障礙者才可以事按摩業，是平等權的展現
  - label: B
    content: 限定視覺障礙者才可以從事按摩業，可以消除造成事實上不平等的障礙
  - label: C
    content: 為了實現平等權，給予視覺障礙者差別待遇，不會侵害到其他人的權利
  - label: D
    content: 給予稅率減免等優惠，是針對其障礙者身分的合理差別待遇
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 假新聞是以誤導大眾為目的，所傳播的新聞或宣傳，閱聽人因為觀看假新聞獲得了錯誤資訊，甚至再分享使得假新聞繼續傳播，影響大眾對於事實的認知，對整體社會都有著不可忽視的危害。若政府要對假新聞進行限制，下列何者符合《憲法》規範？
  options:
  - label: A
    content: 立法機關訂定法律，對制作假新聞者制裁
  - label: B
    content: 對製作假新聞者最高處以無期徒刑的處罰
  - label: C
    content: 區分製作假新聞者的性別，男性處以較高罰鍰，女性較低
  - label: D
    content: 對「可能會誤導大眾」的新聞都認定是假新聞，給予制裁
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 某建商向政府機關申請大廈建照，行政機關也發給建築許可，但承辦人員後來發現許可的地方位於航道下方，有高度限制，因此撤銷建築許可。請問該行政機關可能違反何種法律原則？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 明確原則
  - label: C
    content: 誠信原則
  - label: D
    content: 信賴保護原則
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 《空氣污染防制法》規定：「交通工具排放空氣污染物，應符合排放標準。」因此，違反前開規定者，明定其處罰之方式與罰鍰之額度；並授權交通部訂定罰鍰標準。然而，交通部頒訂《交通工具排放空氣污染物罰鍰標準》，僅以當事人接到違規舉發通知書後之「到案時間及到案與否」，為設定裁決罰鍰數額下限之唯一準據，並非根據受處罰之違規事實情節，依位法目的所為之合理標準。因此，交通部頒訂《交通工具排放空氣污染物罰鍰標準》違反哪一個原則？
  options:
  - label: A
    content: 法律保留原則
  - label: B
    content: 法律優位原則
  - label: C
    content: 誠實信用原則
  - label: D
    content: 信賴保護原則
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 有民眾因拒絕警方酒測遭開單，民眾不服，循序提出行政訴訟，法官要求警方出示辦案記錄，但警方以超過保存期限為由表示無法提供，法官最後以警方無法證明在勸導階段有明確告知民眾拒絕酒測會遭罰，因此舉證程序不崈備，銷民眾的罰單。請問法官的理由主要是基於下列何者？
  options:
  - label: A
    content: 信賴保護原則
  - label: B
    content: 誠實信用原則
  - label: C
    content: 正當法律程序
  - label: D
    content: 法律優位原則
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列哪一個關於行政救濟的敘述<u>有誤</u>？
  options:
  - label: A
    content: 嚴格而論，行政救濟除了行政爭訟之外，還包含國家賠償
  - label: B
    content: 人民若因行政機關作為發生財產損害，僅能以民事途徑請求
  - label: C
    content: 依我國行政爭訟程序，在提起行政訴訟前不一定要經過訴願
  - label: D
    content: 人民不服訴願結果，須藉由司法機關之行政訴訟制度救濟
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 訴願是行政救濟程序中獨有的環節，下列關於訴願的敘述何者正確？
  options:
  - label: A
    content: 是可以讓公正獨立的法院，審查人民權利是否受侵害的程序
  - label: B
    content: 是給予行政機關自我補求的機會
  - label: C
    content: 是行政救濟中必經的程序
  - label: D
    content: 是同層級的行政機關互相監督的機制
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 有網友爆料某位媽媽讓小孩在寒風中穿著無袖上衣，被新聞媒體披露，引起民眾議論紛紛。該位媽媽事後接到許多莫名的關心來電，才得知自己上了新聞版面，無奈澄清自己是尊重孩子的身體自主權，並認為網友的爆料侵犯她與家人的隱私權。請問下列何者最能說明上文？
  options:
  - label: A
    content: 言論自由應受到絕對保障
  - label: B
    content: 隱私權未受《憲法》明文保障故不得主張
  - label: C
    content: 網友爆料有其公益目的故不違憲
  - label: D
    content: 言論自由有時會與其他基本權發生衝突
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 2017年，一位女性公務員在受訓期間遭到性騷擾，向研習中心輔導員申訴，但該中心卻未依法通報性平會，反要求女職員勿將事情鬧大，並威嚇若會被調查洩密責任會遭註記，恐影響未來發展，迫使女職員接受男性成員道歉，事後更曲解為達成和解。雖然最後新北市政府調查認為本案不構成性騷擾，但被害人不服向監察院陳情，監察委員調查後認為本案調查違反《性別工作平等法》，糾正新北市政府。關於上述內容，何者推論較為合適？
  options:
  - label: A
    content: 新北市政府的調查結果違反《性別工作平等法》，行為違反平等原則
  - label: B
    content: 監察委員接受被害人的陳情後介入調查，可能違反公正作為原則
  - label: C
    content: 輔導員接獲申訴後，未依法向性平會通報，違反了依法行政原則
  - label: D
    content: 輔導員促成被害人與加害人和解，造成損害最小，符合比例原則
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列關於我國釋憲制度之敘述，哪一項是正確？
  options:
  - label: A
    content: 大法官解釋宣告違憲之法令，僅適用聲請人午，不及於其政府機關
  - label: B
    content: 各級法院法官可於具體訴訟案件審理時進行法律違憲之宣告
  - label: C
    content: 人民若權益受侵害，於任一審級皆可提出大法官釋憲之聲請
  - label: D
    content: 大法官不介入行政立法間的政治紛爭，僅就該法適用《憲法》與否進行解釋
- id: doc_109_新竹_竹東_社會_公民與社會_g10s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
