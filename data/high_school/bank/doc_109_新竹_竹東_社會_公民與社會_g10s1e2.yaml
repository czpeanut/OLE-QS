    content: 大學生若受學校處分侵害不論輕重皆可提行政訴訟
  group_stem: 2.以下是有關學生人權的兩則釋憲文 司法院釋字第382號解釋：各級學校依有關學籍規則或懲處規定，對學生所為退學或類此之處分行為，足以改其學生身分並損及其受教育之機會，自屬對人民《憲法》上受教育之權利有重大影響，此種處分行為應為《訴願法》及《行政訴訟法》上之行政處分。受處分之學生於用盡校內申訴途徑，未獲救濟者，自得依法提起訴願及行政訴訟。
    司法院釋字第684號解釋：大學為實現研究學術及培育人才之教育目的或維持學校秩序，對學生所為行政處分或其他公權力措施，如侵害學生受教育或其他基本權利，即使非屬退學或類此之處分，本於《憲法》第16條有權利即有救濟之意旨，仍應許權桘受侵害之學生提起行政衛訟，無特別限制之必要。在此範圍內，本院釋字第382號解釋應予變更。
