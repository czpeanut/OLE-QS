  page: 5
  stem: '2. 阿翔上完課後，很好奇中國先秦百家思想，為何與儒家並列時代顯學的墨家，終究未能獲得帝王的重用，沉寂於歷史洪流，於是，他試著翻閱學者研究，希望能解惑，也重新思考傳統政治權威的特質，閱讀下列資料後和阿翔思考：

    資料一：（秦）獻公即位後的第四年……獻公與墨者應即開始合作，而且關係如魚得水、異常融洽，所以城防要區集軍政大權於一身的「守」都由墨者甄選……秦制城防最高長官「守」之下，還有由墨者充任的「衛」……此外還有門衛，責任是執行極嚴格的監守城門、防諜杜奸的規令。……當獻公決意興建一系列的縣以為軍事根據地時，必有墨者精英及軍事工程技術專家參與籌畫及領導。

    資料二：「連什伍而同其罪」始於獻公，而且俱深受墨者影響……墨子政治理論的核心是「尚同」……欲使政治及社會上軌道，唯有人民自鄉里而上，層層都服從各級的「政長」，最後所有各級的人民和政長都絕對服從於天子。……筆者相信獻公之所以自始即決心邁向政制一元化的嶄新大道，與墨者一再闡發「尚同」精義是分不開的。

    資料三：秦獻公招募墨者之初，秦是被侵略的弱者，正是篤信兼愛非攻的墨者樂意效忠的對象。但經過獻公晚年與魏「戰於石門，斬首六萬，天子賀以黼黻（衣裳繪繡的花紋，用以比喻華美的衣裳）」大凱旋後，秦迅速變成最強的軍事侵略國。這一基本事實造成所有墨者良心信念的矛盾……墨者的種種技能和專長既經常被政府汲取利用，其地位及功用就愈來愈被「邊緣化」了……仕秦四、五代後以後，業已完全消融於此洪流了。 （資料來源：何炳棣著，《何炳棣思想制度史論》（臺北：聯經，2013），頁361～362、372、377～378、380）

    (1)這三段資料可共同用以探討哪一主題？'
