  page: 5
  stem: '光漢近日迷上古裝韓劇，追劇後發現劇中朝鮮世子成為繼承者前需要接受中國使臣帶來皇帝的詔命才能成立，就任新君更需受中國冊封，並且發現朝鮮王朝的官僚制度與朝儀、統治思想受到中國影響甚深，為了多了解朝鮮王朝與明朝、清朝之間的關係，他找到一些資料後，發現一些問題，同時請你和他一起思考：

    資料一：1369年，一接到明朝洪武帝建國通知，高麗王朝立即派遣使者前往明朝。但此時討伐倭寇有功的將軍李成桂發動政變取而代之。1392年登上王位，翌年派使前往明朝，並提示「和寧」和「朝鮮」兩個國號，因明朝選擇後者，便以朝鮮為國號。重視儒家學說的李朝，自稱是「小中華」，視侍奉明朝是「事大」，積極吸收中華文化，同時也加深對日本等國的優越意識。

    資料二：1644年後，一部流傳甚廣的朝鮮私撰史書《尊周錄》卷首：「惟我神宗皇帝之恤我一方者至矣、盡矣。……發天下之兵糧，拯一方之水火者，實千古所未有者，此我昭敬休盛哉！」通篇感念萬曆皇帝的恩德；因此，燕行歸國的朝鮮士人多視清朝為「夷狄」，甚至紀年也以崇禎、萬曆紀年，即使清朝實施科舉，在朝鮮使者眼裡仍被譏斥為「剃頭舉子」，連隨行奴僕也表示不願生在清國、胡人之地。

    資料三：1776年，李萬運編著科舉教科書《紀年兒覽》，除以「奉天承運皇帝」稱呼乾隆皇帝，將中國歸諸「外國」，一反思明之風，更憂心表示：「學士文人脫略於名數之辨，粗識中朝（中國）年代，而於本國（朝鮮）則顧茫然不識，此何異不祭祖父之年甲者耶？」

    資料出處：吳政緯，《從漢城到燕京：朝鮮使者眼中的東亞世界》（台北：秀威資訊，2017），頁146-207。

    請問：(1)明清時期，朝鮮派使者去中國最可能的任務為何？(1分)'
