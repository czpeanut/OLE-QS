  page: 1
  stem: 相傳<u>印度</u>舍罕王想重賞發明西洋棋的宰相。宰相希望的獎賞是：在棋盤的第 1 格放 1 粒麥子，第 2 格放 2 粒麥子，接下來的每一格麥子數皆為前一格的兩倍，直到放滿 64 格；並以這棋盤上的所有麥子作為獎賞。已知 $2^{128}$ 是 39 位數，那麼宰相共得到的麥子粒數為幾位數？
  options:
