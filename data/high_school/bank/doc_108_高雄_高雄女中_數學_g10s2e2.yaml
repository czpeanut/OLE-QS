- id: doc_108_高雄_高雄女中_數學_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某班共有 36 人，某次月考全班數學的平均成績是 60 分，標準差為 S 分。但成績結算後，才發現有兩位學生成績登錄有誤，有一位是 80 分卻登錄為 50 分；另一位是 65 分卻登錄為 95 分。更正之後重新算得標準差為 S' 分，試問 S' 與 S 之間，有下列哪種大小關係？
  options:
  - label: A
    content: S'＝S
  - label: B
    content: S'＜S－5
  - label: C
    content: S＋5＜S'
  - label: D
    content: S－5 ≤ S'＜S
  - label: E
    content: S＜S' ≤ S＋5
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 M 為原分數平方和，M'' 為更正後分數平方和

    因平均皆為 60 分，得$\begin{cases}M=36\times (60^{2}+S^{2}) \ldots \ldots \ldots \ldots \ldots ① \\ M''=36\times (60^{2}+S''^{2})\ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    又 M''＝M－$50^{2}$＋$80^{2}$－$95^{2}$＋$65^{2}$＝M＋130×30－160×30＝M－900 ⇒ M－M''＝900

    ①－②得 M－M''＝36（S $^{2}$－S'' $^{2}$）

    ⇒ 900＝36（S $^{2}$－S'' $^{2}$）

    ⇒ 25＝S $^{2}$－S'' $^{2}$

    ⇒ S'' $^{2}$＝S $^{2}$－25

    ⇒ $S''=\sqrt{S^{2}-25} < S$且$S''=\sqrt{S^{2}-25} =\sqrt{(S+5) (S-5)}$ ≥ $\sqrt{(S-5)^{2}} =S-5$

    ⇒ S－5 ≤ S''＜S

    故選(D)'
