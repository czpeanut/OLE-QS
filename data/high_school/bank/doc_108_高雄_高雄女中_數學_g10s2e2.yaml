  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '所有麥子數的和為 1＋2＋……＋$2^{63}$＝$\frac{1\times (2^{64}-1)}{2-1}$＝$2^{64}$－1

    又 $2^{128}$＝a×$10^{38}$，其中 1 ≤ a＜10

    ⇒ $2^{64}$＝$\sqrt{2^{128}}$＝$\sqrt{a}\times 10^{19}$，且 $1\leq \sqrt{a} < \sqrt{10} < 10$

    得 $2^{64}$ 為 19＋1 位數 ⇒ $2^{64}$－1 為 20 位數，故選(B)'
