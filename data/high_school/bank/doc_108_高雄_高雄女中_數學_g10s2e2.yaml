- id: doc_108_高雄_高雄女中_數學_g10s2e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: '老師欲瞭解學生使用手機的時數與定期考排名之間的關係，所以抽查 5 位學生每天使用手機的時數 x（單位：小時）與班上定期考排名 y（單位：名次）的情形如上表所示。已知 y 的算術平均數為 10，且兩組數據的相關係數為 0.8，試選出正確的選項。

    | x | 1.2 | 1.4 | 1.6 | 1.8 | 2 |

    | --- | --- | --- | --- | --- | --- |

    | y | 9 | 8 | a | b | 11 |'
  options:
  - label: A
    content: a＞b
  - label: B
    content: σ$_{x}$＜σ$_{y}$
  - label: C
    content: 若每天使用手機的時數單位改為分鐘，則兩組數據的相關係數仍為 0.8
  - label: D
    content: 由相關係數為 0.8＞0 可知：若每天使用手機的時數增加，則班上定期考排名會增加（退步）
  - label: E
    content: 由 y 對 x 的最適直線可推測：若每天使用手機的時數減少 1 小時，則班上定期考排名會進步 4 名
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'μ$_{x}$＝$\frac{1.2+1.4+1.6+1.8+2}{5}$＝1.6，μ$_{y}$＝$\frac{9+8+a+b+11}{5}$＝10 ⇒ 28＋a＋b＝50 ⇒ a＋b＝22

    （$x_{1}$－μ$_{x}$）$^{2}$＋（$x_{2}$－μ$_{x}$）$^{2}$＋……＋（$x_{5}$－μ$_{x}$）$^{2}$

    ＝（1.2－1.6）$^{2}$＋（1.4－1.6）$^{2}$＋（1.6－1.6）$^{2}$＋（1.8－1.6）$^{2}$＋（2－1.6）$^{2}$＝0.4

    （$y_{1}^{2}$＋$y_{2}^{2}$＋……＋$y_{5}^{2}$）－5×μ$_{y}^{2}$

    ＝$9^{2}$＋$8^{2}$＋$a^{2}$＋$b^{2}$＋$11^{2}$－5×$10^{2}$＝$a^{2}$＋$b^{2}$－234

    （$x_{1}y_{1}$＋$x_{2}y_{2}$＋……＋$x_{5}y_{5}$）－5×μ$_{x}$×μ$_{y}$

    ＝10.8＋11.2＋1.6a＋1.8b＋22－5×1.6×10＝1.6a＋1.8b－36

    ∵$\frac{1.6a+1.8b-36}{\sqrt{0.4}\sqrt{a^{2}+b^{2}-234}}=0.8$ ……………①

    又 a＝11，b＝11 代入①不合（r ≈ 0.78）

    a＝12，b＝10 代入①不合（r＝0.6）

    a＝10，b＝12 代入①合

    (A) ╳：a＝10＜b＝12

    (B) ○：$\sigma _{x}=\sqrt{\frac{0.4}{5}} =\frac{\sqrt{2}}{5}$，$\sigma _{y}=\sqrt{\frac{10}{5}} =\sqrt{2}$

    ⇒ σ$_{x}$＜σ$_{y}$

    (C) ○：x''＝60x ⇒ r''＝r＝0.8

    (D) ╳：由題表且 a＝10，b＝12 得知名次未必增加

    (E) ○：m＝$r\times \frac{\sigma _{y}}{\sigma _{x}}$＝$0.8\times \frac{\sqrt{2}}{\frac{\sqrt{2}}{5}}$＝4

    故可推測 x 減 1，y 會減 4，即進步 4 名

    故選(B)(C)(E)'
