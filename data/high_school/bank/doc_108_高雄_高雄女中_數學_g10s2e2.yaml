  stem: '有一次測驗甲、乙、丙、丁、戊 5 個人的數學、物理、化學的成績如右表。已知數學與物理的相關係數為 0.7，那麼數學與化學的相關係數為多少？

    | 學生 成績 | 甲 | 乙 | 丙 | 丁 | 戊 |

    | --- | --- | --- | --- | --- | --- |

    | 數學 | 80 | 90 | 85 | 70 | 75 |

    | 物理 | 80 | 75 | 70 | 60 | 65 |

    | 化學 | 70 | 66 | 62 | 54 | 58 |'
  options:
  - label: A
    content: '0.5'
  - label: B
    content: '0.6'
  - label: C
    content: '0.7'
  - label: D
    content: '0.8'
  - label: E
    content: '0.9'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '令數學為 x，物理為 y，化學為 z

    $z_{i}=\frac{4}{5}y_{i}+6$，其中 i＝1，2，……，5 依序表示甲～戊

    則物理與化學成績之間有線性關係

    ⇒ $r_{xz}$＝$r_{xy}$＝0.7，故選(C)'
