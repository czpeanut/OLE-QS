  stem: 下列有關於尿液形成的敘述，何者正確？
  options:
  - label: A
    content: 再吸收作用與分泌作用皆與腎小管有關
  - label: B
    content: 過濾作用和分泌作用皆與主動運輸有關
  - label: C
    content: 過濾作用和分泌作用皆與壓力差異有關
  - label: D
    content: 腎小球和鮑氏囊皆不含血球和蛋白質
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)過濾作用是靠壓力差，不耗能；(E)腎小球中的絲球體含有血球及蛋白質。故選(A)。
