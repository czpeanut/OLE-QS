  section: 1
  number: 4
  type: single
  page: 1
  stem: '附表為尿液形成過程中，由腎元不同部位抽取獲得之甲、乙、丙三種液體，分別分析其所含尿素、葡萄糖及蛋白質之比例，請問關於甲、乙、丙三部位抽出之液體與部位之配對，何者正確？

    |  | 甲 | 乙 | 丙 |

    | --- | --- | --- | --- |

    | 尿素 | 0.03 | 0.03 | 2.00 |

    | 葡萄糖 | 0.10 | 0.10 | 0.00 |

    | 蛋白質 | 8.00 | 0.00 | 0.00 |'
  options:
  - label: A
    content: 甲：鮑氏囊
  - label: B
    content: 甲：近曲小管
  - label: C
    content: 乙：入球小動脈
  - label: D
    content: 丙：集尿管
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 根據成分表，甲含蛋白質為入球小動脈，乙無蛋白質為鮑氏囊，丙含高濃度尿素為集尿管。故選(D)。
