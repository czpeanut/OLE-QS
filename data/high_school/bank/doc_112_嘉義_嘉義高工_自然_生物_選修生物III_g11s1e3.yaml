  type: single
  page: 1
  stem: 當血液pH值過低時，如何維持酸鹼平衡？
  options:
  - label: A
    content: 刺激抗利尿激素分泌，回收水分，平衡酸鹼
  - label: B
    content: 刺激呼吸中樞，增加呼吸頻率，排出體內過多的$CO_{2}$
  - label: C
    content: 刺激腎小管再吸收$Na^{＋}$，維持血液滲透壓
  - label: D
    content: 血漿蛋白釋放$H^{＋}$，進行緩衝
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 酸鹼與氫離子濃度有關；(A)(C)與血管壓力有關；(D)釋放$H^{＋}$，造成pH值更低。故選(B)。
