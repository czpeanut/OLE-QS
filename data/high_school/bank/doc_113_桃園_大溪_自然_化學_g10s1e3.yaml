  stem: '小右為了了解酸性溶液的 pH 值對豆漿結塊的影響，設計以下實驗後，所得到結果如下表，在與同學分享結果後，請問哪個同學的建議較為合理，可供之後實驗參考？

    | 實驗次數 | 1 |  | 2 |  | 3 |  | 4 |  | 5 |  |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 加入物質（濃度皆為 0.1 M） | HCl | NaOH | HCl | NaOH | HCl | NaOH | HCl | NaOH | HCl | NaOH |

    | 加入體積（mL） | 45 | 15 | 40 | 20 | 30 | 30 | 20 | 40 | 15 | 45 |

    | 是否結塊（g） | 是∕23 mg |  | 是∕78 mg |  | 否 |  | 否 |  | 否 |  |

    [題組 5：厲害的頭毛]（摘錄與改寫自第 63 屆科展作品：「毛」起來吸油！）

    市售吸油棉中主要吸油的成分為聚丙烯或聚乙烯，若將其吸油成分替換為頭髮，可變廢為寶、友善環境；本次研究試圖找出頭髮最佳的吸油表現，成為新的環保吸油物質。

    頭髮表皮鱗片因酸、鹼、溫度等因素而合攏或張開，而毛鱗片之開合程度影響頭髮吸油量；其中一項測試的實驗步驟如下：

    (1)清洗 7 克的頭髮，將 10 克的肥皂磨成粉狀後，和 500 克的自來水調製清洗劑。

    (2)將放有頭髮的篩網放入不鏽鋼鍋中，讓頭髮泡入肥皂水清洗劑中並靜置 10 分鐘。

    (3)啟動「頭髮清洗儀」開關，攪拌清洗 5 分鐘。

    (4)最後使用清水將頭髮沖洗，並用 pH 儀檢測是否有沖洗乾淨。

    (5)分別使用自然乾、涼風吹乾、暖風吹乾等方式將頭髮用乾。

    A.自然乾：將清洗完成的頭髮包裹一層擦手紙，置於室溫 28 ℃，使其自然乾。

    B.涼風吹乾：將清洗完成的頭髮包裹一層擦手紙，用電風扇的強風 26 ℃ 吹乾。

    C.暖風吹乾：將清洗完成的頭髮包裹一層擦手紙，用吹風機的強風 57 ℃ 吹乾。

    (6)將頭髮放置於第三代剪髮器上，並剪成 1 公分長度，放入包裝袋中。

    (7)將放有頭髮的吸油包浸入食用油中，在 10 分鐘時取出，掛在自製晾油架上，待其不再滴油後取下稱重，每組重複三次取其平均。

    (8)測量頭髮吸油量。'
  options:
  - label: A
    content: 小左：實驗次數 1、2、3 結果不一致，為了增加數據的可靠性，可以重覆實驗再檢核一次
  - label: B
    content: 小傑：由實驗次數 1、2、3 結果推測，豆漿沉澱量在某個特定 pH 值最大，可配製不同 pH 值溶液再進行實驗
  - label: C
    content: 小恩：將量取體積器材由量筒改為燒杯，加入豆漿反應後有更完整沉澱
  - label: D
    content: 小美：所配製的氫氧化鈉溶液，含有 $Na^{＋}$ 陽離子會干擾蛋白質，一定是測量誤差，建議更換溶液
  group_stem: '[題組 4：變身的豆漿]（資料來源：泛科學-豆漿加醋為什麼會結塊？化學解密鹹豆漿之謎）

    小右喜歡每天早晨，都來杯溫熱的鹹豆漿，看著液態的豆漿浮出了固體凝塊，如同自然課實驗一般的「加料」，瞬間變出我的早餐！但是到底為什麼豆漿在加了醋後，就會產生塊狀物，而變成好吃（喝）的鹹豆漿呢？是何種原理造成這個現象呢？

    小右查閱網路資訊後，得到以下資訊：

