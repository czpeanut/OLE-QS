  group_stem: '巧克力富含「膳食類黃酮（Dietary Flavonoids）」，這種物質能改善及提升人的感知、注意力、記憶、學習、決策和語言能力等「認知功能」，而降低老年癡呆症的風險。

    梅塞利醫生想知道「食用巧克力是否與整體國民的認知功能相關」，但由於各國未公開國民的認知能力，因此他需要用其他辦法來判斷各國國民認知能力高低的判斷標準。

    以下是他所收集的資料及繪製的數據圖：

    (1)蒐集各國家的巧克力消費量

    (2)蒐集各國家 2011 年 10 月前獲得諾貝爾獎的獲獎數

    (3)分析數據並製作以下圖表：

    各國「年度人均巧克力消費量」與諾貝爾獎數量關係圖'
