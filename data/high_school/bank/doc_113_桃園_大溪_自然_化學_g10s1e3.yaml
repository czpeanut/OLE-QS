  group_stem: '[題組 4：變身的豆漿]（資料來源：泛科學-豆漿加醋為什麼會結塊？化學解密鹹豆漿之謎）

    小右喜歡每天早晨，都來杯溫熱的鹹豆漿，看著液態的豆漿浮出了固體凝塊，如同自然課實驗一般的「加料」，瞬間變出我的早餐！但是到底為什麼豆漿在加了醋後，就會產生塊狀物，而變成好吃（喝）的鹹豆漿呢？是何種原理造成這個現象呢？

    小右查閱網路資訊後，得到以下資訊：

    膠體之所以可以均勻混合，除了微小粒子間不斷碰撞的布朗運動之外，另一個原因就是帶電。膠體粒子外有所謂電雙層（electrical double-layer）的結構，藉由電性相斥，讓其中的膠體粒子不會互相結合凝聚。而豆漿中的膠體粒子主要是蛋白質，帶負電荷。

    於是小右取 1 g 的多種物質分別加入 10 mL 豆漿後，觀察沉澱、結塊的現象，實驗結果如下表：

    | 加入 物質 | 蔗 糖 | 食 鹽 | 小蘇打 | 食 醋 | 碳酸鉀 | 維生素 C （抗壞血酸） | 味 精 | 檸檬酸 | 氫氧化鈣 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 是否 結塊 | 否 | 否 | 否 | 是 | 否 | 是 | 否 | 是 | 是 |'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)實驗並未提供關於其他電解質溶液與蛋白質沉澱的數據，因此這一說法無法得知。

    (C)題表中氫氧化鈣為鹼性溶液會沉澱，與選項敘述不合。

    (D)題表中其他酸性溶液（電解質溶液）都可以使蛋白質產生沉澱，並非蛋白質含量不夠所造成。'
