- id: doc_110_台中_興大附中_數學_數B_g11s2e1_s3_1
  section: 3
  number: 1
  type: single
  page: 3
  stem: '地球以南、北極的連線為軸線，自轉一周需 24 小時。天文學上以東經線、西經線劃分時間，從 0° 經線算起，每隔 15° 取一經線，做為各地方時間的中央經線，向東、向西各 7.5° 的地區，皆為同一地方標準時，共分 24 個時區。因為地球由西向東自轉，所以當經線往東增加 15°，該時區的時間對<u>格林威治天文臺</u>（0° 經線）的時差就增加一小時。

    已知<u>俄羅斯</u>的<u>聖彼得堡</u>約在北緯 60°，東經 30°；而在北緯 60°，東經 120° 的地方有個<u>西伯利亞</u>小鎮 A。有架飛機從<u>聖彼得堡</u>，沿著北緯 60° 的緯線飛往<u>西伯利亞</u>小鎮 A。試回答下列問題。

    (1) <u>聖彼得堡</u>與<u>西伯利亞</u>小鎮 A 兩地的時差是多少小時？（單選，4 分）

    (2) 假設地球的半徑為 1，則北緯 60° 的緯線總長是多少？（單選，4 分）

    (A)$\frac{\pi}{2}$ (B)$\frac{\pi}{4}$ (C) π (D)$\frac{3\pi}{4}$ (E) 2π

    (3) 已知此架飛機以等速飛行繞赤道一圈需花 40 小時，若此飛機以同樣的速度從<u>聖彼得堡</u>當地時間 3 月 23 日 23 時 50 分起飛，則抵達<u>西伯利亞</u>小鎮 A 的當地時間為何？（單選，4 分）

    (A) 3 月 23 日 12 時 50 分

    (B) 3 月 23 日 18 時 50 分

    (C) 3 月 24 日 0 時 50 分

    (D) 3 月 24 日 4 時 50 分

    (E) 3 月 24 日 10 時 50 分

    (4) 假設地球的半徑為 1，若<u>俄羅斯</u>的<u>聖彼得堡</u>是球面上的 P 點，求 P 點的空間坐標。（非選擇題，4 分）'
  options:
  - label: A
    content: '12'
  - label: B
    content: '10'
  - label: C
    content: '8'
  - label: D
    content: '6'
  - label: E
    content: '4'
