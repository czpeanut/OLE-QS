- id: doc_110_台中_興大附中_數學_數B_g11s2e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 空間中三點 A（3，4，5）、B（6，8，0）、C（5，9，3）。下列何者正確？
  options:
  - label: A
    content: △ABC 是鈍角三角形
  - label: B
    content: 點 A 對 yz 平面的投影點坐標為（0，－4，－5）
  - label: C
    content: 點 C 到 y 軸距離為$\sqrt{34}$
  - label: D
    content: 若 ABCD 為平行四邊形，則 D 點坐標為 D（8，13，－2）
  - label: E
    content: 點 E（12，p，q），若 A、B、E 共線，則 p＋q＝6
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\overline{AB}$＝$\sqrt{3^{2}+ 4^{2}+ (-5 )^{2}}$＝$5\sqrt{2}$

    $\overline{AC}$＝$\sqrt{2^{2}+ 5^{2}+ (-2 )^{2}}$＝$\sqrt{33}$

    $\overline{BC}$＝$\sqrt{(-1 )^{2}+ 1^{2}+ 3^{2}}$＝$\sqrt{11}$

    ∵$\overline{AC}^{2}$＋$\overline{BC}^{2}$＜$\overline{AB}^{2}$

    ∴△ABC 為鈍角三角形

    (B)╳：應為（0，4，5）

    (C)○：所求為$\sqrt{5^{2}+ 3^{2}}$＝$\sqrt{34}$

    (D)╳：∵$\overline{AC}$中點＝$\overline{BD}$中點

    令 D（a，b，c），則

    $\left( \frac{3 + 5}{2} , \frac{4 + 9}{2} , \frac{5 + 3}{2} \right)$＝$\left( \frac{6 + a}{2} , \frac{8 + b}{2} , \frac{0 + c}{2} \right)$

    ⇒ a＝2，b＝5，c＝8

    ∴D（2，5，8）

    (E)○：由 x 坐標可知$2\overline{AB}=\overline{BE}$，設$\overline{BE}$中點為$D(a,b,c)$

    則 B 為$\overline{AD}$中點

    $\left( \frac{3+a}{2},\frac{4+b}{2},\frac{5+c}{2} \right)$＝（6，8，0）⇒ a＝9，b＝12，c＝－5

    D 為$\overline{BE}$中點

    $\left( \frac{6+12}{2},\frac{8+p}{2} ,\frac{0+q}{2} \right)$＝（9，12，－5）⇒ p＝16，q＝－10

    故 p＋q＝16－10＝6

    故選(A)(C)(E)'
