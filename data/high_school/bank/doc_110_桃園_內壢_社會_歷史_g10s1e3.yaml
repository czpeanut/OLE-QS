- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 1947年臺灣的報紙標題為：「物價起空前巨浪，店鋪多關門歇業，黃金領導，米價回漲，百物飛奔，商店不賣，老百姓叫苦連天。」請問：標題如此寫與當時的何種情勢有關？
  options:
  - label: A
    content: 捲入國共內戰，臺灣物資大量接濟大陸
  - label: B
    content: 美國發表《中美關係白皮書》，指責國民黨政府貪腐，禁止一切援助
  - label: C
    content: 政府將民生物資運往越南，支援越戰，造成臺灣民生物資嚴重短缺
  - label: D
    content: 中央政府遷臺後厲行統制經濟
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 阿良是一名墾戶，正值劉銘傳在臺推動「減四留六」政策。請問：對阿良而言，此政策實施前後有何變化？
  options:
  - label: A
    content: 實施後，阿良必須將收取的大租分為十分，自己留六分，四分是給官府的正供
  - label: B
    content: 實施後，阿良必須將收取的小租分為十分，自己留六分，四分是給官府的正供
  - label: C
    content: 實施後，阿良僅獲得原大租的六分，因為另外四分要由小租戶完納正供
  - label: D
    content: 此政策是為減輕佃戶的負擔，所以對阿良完全沒有影響
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 戰後臺灣省政府曾推動一系列的土地改革。請問：下列何者屬於當時改革內容？
  options:
  - label: A
    content: 以中央政府運至臺灣的黃金與外匯向地主收購多餘土地，無償授予現耕佃農
  - label: B
    content: 協助各級地主轉型為金融業與工業投資者，將徵收的土地平均分配給小自耕農與佃農
  - label: C
    content: 以實物土地債券與公營事業股票徵購地主土地，再以分期攤還地價的方式轉售佃農
  - label: D
    content: 將沒有確切所有的林野地收歸國有，再以低價轉售予佃農
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 有學者找到一張清道光年間的契約文件，上面寫著十個人共同承租一塊土地耕種。試問此契約反映怎樣的歷史意義?
  options:
  - label: A
    content: 代表此時可自由來臺開墾，不必申請
  - label: B
    content: 意味著開墾辛苦，又需要高額資金，有時採合股經營的方式
  - label: C
    content: 當時為凝聚血緣，宗族皆採合股開墾
  - label: D
    content: 官方不准個人承租，只能合作經營
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 鄭成功曾有以下言論：「大凡治家治國，以食為先。苟家無食，雖親如父子夫婦，亦難以和其家；苟國無食，雖有忠軍愛國之士，亦難以治其國，今上託皇天垂庇，下賴諸君之力，得有此土。然計食之者眾、作之者寡，倘餉一告匱，而師不宿飽，其欲興邦故國，恐亦難矣。故昨日躬身踏勘，揆審情形，細觀土地，甚是膏腴。當做寓兵於農之法，庶可餉無匱，兵多糧足。然後靜觀釁隙而進取。」請問：根據你的歷史知識，下列何者是鄭氏王朝對臺灣的土地經營？
  options:
  - label: A
    content: 均田制
  - label: B
    content: 占田制
  - label: C
    content: 屯田制
  - label: D
    content: 方田均稅法
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列有關臺灣原住民族的敘述何者正確？
  options:
  - label: A
    content: 臺灣原住民族是在相同時間内由海外移入的，故文化上具一致性
  - label: B
    content: 臺灣原住民族的婚姻皆是男方入贅至女方，所以屬於母系社會
  - label: C
    content: 臺灣原住民族皆沒有政治組織，也都没有階級分別，所以也沒有所謂的酋長
  - label: D
    content: 臺灣原住民族為泛靈信仰，他們舉行各種歲時祭儀，表達對祖靈與大自然的崇拜
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 歷史劇上演著臺灣某一個時期的社會情況：「當時，我和青年們抱著忐忑不安的心情準備了紙錢和香，恭恭敬敬地把原委向土地公說明，並且祈求暫時移駕到鎮上的大和宮避難。燃了紙錢後，把土地公的神像奉置在大和宫的神桌上，然後青年們就把土地廟全部毀除。」上述最可能是臺灣何時期的社會情況？
  options:
  - label: A
    content: 1684年，臺灣被納入清朝版圖，消極治臺時期
  - label: B
    content: 1895年，甲午戰後日本治理臺灣初期，殖民地特殊統治時期
  - label: C
    content: 1919年，第一次世界大戰結束之後，内地延長主義同化政策時期
  - label: D
    content: 1937年，中日爆發盧溝橋事件後，皇民化運動時期
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 臺灣宗教發展史上，有個宗教派別特别重視信眾的生活修行，並經常透過醫療與慈善活動廣結善緣營造正向與喜樂的宗教形象。這種積極入世的態度確實也促成該宗教的興盛。請間：此宗教是下列何者？
  options:
  - label: A
    content: 齋教
  - label: B
    content: 神道教
  - label: C
    content: 正一派
  - label: D
    content: 人間佛教
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 陳老師在臺灣宗教史的課程中講到：「1627年，他們就已通過在臺設立教區的計畫，當時傳教的對象，除了原住民族外，也包括當地的漢人與日本人。在治臺十六年間，陸續來臺的傳教士共有三十多人，其中還有日本籍的傳教士……。」請問：上述的内容應為下列哪一國家在臺灣的傳教概況？
  options:
  - label: A
    content: 葡萄牙
  - label: B
    content: 西班牙
  - label: C
    content: 荷蘭
  - label: D
    content: 英國
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
