questions:
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「臺灣經濟面臨一些新問題，諸如工資提高、地價上漲、環保成本提高，加以國際保護主義抬頭、臺幣升值等」請問臺灣如何面對上述困難？
  options:
  - label: A
    content: 增設加工出口區
  - label: B
    content: 提倡家庭即工廠
  - label: C
    content: 科學園區成立
  - label: D
    content: 制定獎勵投資條例
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 1949年5月國民政府成立「臺灣生產委員會」，主要任務在穩定物價。1951年3月在某國的協助下發展成「經濟安定委員會」由上海財團出身的尹仲榮領導。請問某國應該是？
  options:
  - label: A
    content: 美國
  - label: B
    content: 日本
  - label: C
    content: 英國
  - label: D
    content: 中國
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 兩位日本人的對話。甲：到現在始終沒有看到一點成果，乾脆放棄算了，不如把臺灣賣給法國好了。乙：這個建議不錯喔！說不定還可以賣到好價錢。請問上述對話的時空背景是：
  options:
  - label: A
    content: 清末列強在中國劃分勢力範圍時
  - label: B
    content: 日治初期總督府財政狀況不佳
  - label: C
    content: 1930年代經濟大恐慌
  - label: D
    content: 二戰末期日本屢屢戰敗，急於開拓財源
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 珍珍帶著日本友人到日月潭水力發電廠，請問他會如何介紹這座水庫的由來？
  options:
  - label: A
    content: 清朝興建此水庫最主要是使南投農田得到灌溉
  - label: B
    content: 這座水庫是沈葆楨建設中部的成果
  - label: C
    content: 水庫興建於日治時期，提供充沛水電發展臺灣工業
  - label: D
    content: 日人興建水庫主要是發展臺灣農業支援日本工業
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1972年臺灣申請移民的人數較往年增加8倍，資金外流嚴重。1974年臺灣的經濟成長率只有1.1%，與預期的9.5%相差甚遠，而工業成長率4.5%，與預期的14.2%有極大落差，當年通貨膨脹達47.8%，請問造成上述原因的是：
  options:
  - label: A
    content: 全球石油危機
  - label: B
    content: 美國與臺灣斷交
  - label: C
    content: 遭遇亞洲金融風暴
  - label: D
    content: 發生八二三炮戰
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 1976年當時行政院長與美國RCA簽訂合作協定，臺灣便派遣四十多名知識分子赴美進行積體電路製造技術移轉工作，目前業界知名的曹興誠等人都是當時成員。請問下列敘述與解讀哪一項是錯誤的？
  options:
  - label: A
    content: 對於產業升級，政府以國家力量進行推動
  - label: B
    content: 當時臺灣的發展結構是以農業作為主力
  - label: C
    content: 赴美習得技術後，的確為產業轉型帶來實效
  - label: D
    content: 教育的人才養成堪稱經濟發展的隱藏推手
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 《臺海使槎錄‧赤崁筆談》記載：「全臺仰望資生，四方奔走圖息，莫此為甚。」請問：其描述清朝統治初期哪項產品對臺灣的重要性？
  options:
  - label: A
    content: 鹿皮
  - label: B
    content: 茶葉
  - label: C
    content: 蔗糖
  - label: D
    content: 樟腦
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 清治前期，臺灣貿易有「一府二鹿三艋舺」之稱。但艋舺在臺灣開港之後，即因河川淤積而失去其商業地位。請問：艋舺的地位後來被哪個港口取而代之？
  options:
  - label: A
    content: 淡水
  - label: B
    content: 新莊
  - label: C
    content: 大稻埕
  - label: D
    content: 三角湧
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: ○不僅負責一般商貿業務，也為鄭氏從事情報收集工作。郁永河在鄭氏逸事中說道：「……遍布腹心於內地，凡督撫提鎮衙門，事無巨細，莫不報聞，皆得早為之備。故以咫尺地，與大兵拒守三十餘年，終不敗事：其用心固亦深矣。」請問：○為下列何者？
  options:
  - label: A
    content: 五商集團
  - label: B
    content: 贌社制度
  - label: C
    content: 軍屯政策
  - label: D
    content: 專賣制度
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 1670年，某國與臺灣當時的政權簽訂商約，其內容要點為：允許某國船隻自由航海及商人得以自由通商及運輸經營出口；某國必須承諾經常性派遣兩位砲手，並駐留鐵匠一名，為其製造槍砲；提供火藥、火繩槍等軍火，請問：此商約簽訂雙方為何？
  options:
  - label: A
    content: 荷蘭；鄭成功政權
  - label: B
    content: 英國；清廷政府
  - label: C
    content: 英國；鄭經政權
  - label: D
    content: 荷蘭；鄭經政權
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 矢內原忠雄在《日本帝國主義下之臺灣》提及：臺灣受限於自然條件，使西部沿海各港口在清代均單獨與中國大陸對渡，形成各自獨立之經濟圈，臺灣島內市場被切割成若干區塊。日本領臺後積極推動「資本主義的基礎工事」，強化臺灣對外聯繫能力和統一島內市場。在此，「資本主義的基礎工事」應指
  options:
  - label: A
    content: 統一貨幣
  - label: B
    content: 統一度量衡
  - label: C
    content: 興建縱貫鐵路
  - label: D
    content: 興建嘉南大圳
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 資料一：「天下第一憨，種甘蔗給會社磅（稱重量）。」資料二：「1905年六月臺灣總督府規定：為制止各製糖工廠間的原料爭奪，擾亂蔗價，各蔗作區劃定為一定範圍的區域。此區域內的甘蔗未經許可，不得運出區域之外，或供作砂糖以外成品的製作原料。」根據以上資料，下列敘述何者正確？
  options:
  - label: A
    content: 保障臺灣蔗農，使蔗農有固定買主與穩定的銷路
  - label: B
    content: 保障新式糖廠，使其降低收購甘蔗的價格
  - label: C
    content: 日本政府引進製糖業，糖從此成為重要輸出物資
  - label: D
    content: 使臺灣舊糖廠在政府補助下轉型為新式糖廠，奠定臺灣工業的基礎
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 附圖為1896-1943年米糖占臺灣總出口比例，而這種出口比例高低正反映出何種經濟現象？
  options:
  - label: A
    content: 糖業外銷從1901年以後逐漸上升，與臺大改良有關
  - label: B
    content: 糖外銷領先稻米甚多，故彼此並無競爭性問題
  - label: C
    content: 米糖主要外銷至歐美
  - label: D
    content: 稻米外銷從1922年逐年上升，主要是研發蓬萊米成功
