- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_48
  section: 1
  number: 48
  type: single
  page: 4
  stem: 歌仔戲是臺灣民間最興盛的傳統戲曲之一，戲曲中摻雜古典漢詩、文言文及閩南語，不僅是早期農業社會重要娛樂活動，也是臺灣庶民文化的代表。關於歌仔戲在臺灣史上的發展，下列何者正確？
  options:
  - label: A
    content: 起源於宜蘭地區，内容以忠孝節義的教化為主
  - label: B
    content: 日治時期，臺灣民眾黨認為歌仔戲以臺語說唱為主，而大加反對
  - label: C
    content: 皇民化運動時期，傳統戲曲遭禁演，官方另推動文化劇欲取而代之
  - label: D
    content: 中華民國時期，政府積極推廣國劇並壓抑本土文化，歌仔戲從此一蹶不振
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 4
  stem: 有句臺灣諺語：「美國出打馬膠，臺灣出土腳（美國人出柏油，臺灣人出土地）」。臺灣因此建設了東西横貫公路、麥帥公路、西螺大橋。請問這句諺語的時代背景為何？
  options:
  - label: A
    content: 二戰結束後，美國為補償之前空襲轟炸對臺灣所造成的損失，開始提供援助
  - label: B
    content: 韓戰爆發後，美國改變對臺政策，提供援助給臺灣
  - label: C
    content: 十大建設政策開始後，美國和臺灣的經貿合作
  - label: D
    content: 臺美斷交後，根據臺灣關係法，提供臺灣援助
- id: doc_110_桃園_內壢_社會_歷史_g10s1e3_s1_50
  section: 1
  number: 50
  type: single
  page: 4
  stem: 政府在1950年代初進行一系列的土地改革，改變臺灣農村土地分配不均的問題。土改的範圍廣大、手段激烈，卻相對平靜的主要原因何在？
  options:
  - label: A
    content: 臺灣沒有共產黨的潛伏煽動
  - label: B
    content: 政府建立起威權統治的氣氛
  - label: C
    content: 地主願意與眾多佃農同甘苦
  - label: D
    content: 政府和地主的政商關係良好
