    (A)╳：m 沒有最大值

    (B)╳：m 沒有最小值

    (C)○

    (D)╳：m$\leq$－7 或 m$\geq$1$\Rightarrowm^{2}\geq$1$\Rightarrowm^{2}$ 沒有最大值

