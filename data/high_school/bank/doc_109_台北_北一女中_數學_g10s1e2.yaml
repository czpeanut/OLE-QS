  stem: 已知一長方形面積為 60，其中一個頂點 P 坐標為（7，7），且長方形中的一條短邊在直線 3x＋4y＋11＝0 上，則『不通過』P 點的長邊所在的直線方程式為＿＿＿＿。（有兩解，請以直線的一般式 ax＋by＋c＝0 表示）
  explanation: 'P（7，7），L：3x＋4y＋11＝0

    $\Rightarrow$長方形的一邊長＝d（P，L）＝$\frac{| 3\times 7 +4\times 7+11 |}{\sqrt{3^{2}+4^{2}}}=\frac{60}{5}$＝12

    $\Rightarrow$另一邊長＝$\frac{60}{12}$＝5

    設不通過 P 點的長邊所在直線為 $L_{1}$：4x－3y＋c＝0

    $\Rightarrow$d（P，$L_{1}$）＝5

    $\Rightarrow\frac{| 28-21+c |}{5}$＝5

    $\Rightarrow$c＝18 或－32

    所求直線 $L_{1}$：4x－3y＋18＝0 或 4x－3y－32＝0'
