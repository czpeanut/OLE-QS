- id: doc_109_台北_北一女中_數學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設 C：$x^{2}$＋$y^{2}$－10y＋9＝0，L：4x＋3y－15＝0 為坐標平面上的圓與直線。試問下列哪一個選項是對的？
  options:
  - label: A
    content: 圓 C 的半徑為 16
  - label: B
    content: 直線 L 的斜率為正
  - label: C
    content: 直線 $L_{1}$：3x＋4y－15＝0 與直線 L 垂直
  - label: D
    content: 圓 C 上的點與直線 L 的最遠距離等於 4
  - label: E
    content: 圓 C 上恰有兩個點與直線 L 的距離等於 2
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：C：$x^{2}$＋（y－5）$^{2}$＝16，圓心 M（0，5），半徑 r＝4

    (B)╳：L：y＝$-\frac{4}{3}x +5$的斜率為$-\frac{4}{3}< 0$

    (C)╳：$L_{1}$：y＝$-\frac{3}{4}x +\frac{15}{4}$的斜率為$-\frac{3}{4}$

    $\Rightarrow\left( -\frac{4}{3} \right) \times \left( -\frac{3}{4} \right) \neq -1\Rightarrow$L 與 $L_{1}$ 不垂直

    (D)○：直線 L 過圓心 M（0，5）

    $\Rightarrow$所求最遠距離為 r＝4

    (E)╳：直線 L 過圓心 M（0，5）且 r＞2

    $\Rightarrow$圓 C 上有 4 個點與 L 距離等於 2

    故選(D)'
