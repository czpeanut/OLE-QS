  stem: 約翰生於19世紀末的德國，父親因為長期在化學工廠工作導致罹患職業病，卻無法從雇主方獲得賠償，為了改善勞工問題，德國首相俾斯麥決定開辦社會保險，約翰長大後進入工廠工作也因此受惠。請問下列有關社會保險的敘述，何者正確？
