  - label: C
    content: 社會安全制度具有強制性，不得拒絕或予以剝奪
  - label: D
    content: 對公共利益有共識，全民不論所得高低皆負擔相同費用
  - label: E
    content: 國家建立制度，結合民間社福力量，活絡公私夥伴關係
