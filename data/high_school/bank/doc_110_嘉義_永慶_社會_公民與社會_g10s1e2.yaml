  stem: 由於近年全球面臨經濟不景氣，各國政府對於社會福利支出紛紛考慮縮水或增稅，是否修法改變法定退休年齡及年金財政支出更成為焦點。請問下列何者是考慮提高退休門檻的理由？(甲)人民平均餘命增長，提領年金時間增加，若不設法改變退休門檻，財政負擔可能拖垮年金制度(乙)人口老化快速加上少子化的影響，年輕人可能被迫負擔沉重的老年年金給付，有違世代正義(丙)富人一般壽命較窮人長，若不提高退休門檻，等於是讓富人比窮人有更多享受社會福利的時光，有違公平正義(丁)戰後嬰兒潮多屆退休之齡，但許多人身體仍硬朗，其經驗、智慧對社會有貢獻，太早退休是勞動力市場的損失
