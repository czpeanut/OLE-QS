  stem: 英國前首相強森的「硬脫歐派」內閣，於2019年8月發動突襲，奏請女王下令國會休會5周，以防範國會干預或阻擋「脫歐」，屆時若與歐盟無法達成協議，英國仍要在10月31日確定「脫歐」。此舉引發群情激憤，反對者認為這種作法是違憲的，與政變無異，痛斥強森是「對民主政治的極致羞辱」。在野的工黨與執政黨的反強森派，計畫聯手發動倒閣，提出不信任案要求強森下臺。請問：從上述「脫歐」決策過程中，以下論述何者符合英國政府體制？
