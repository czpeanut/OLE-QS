  section: 1
  number: 10
  type: single
  page: 2
  stem: 我國民眾對總統職權常有疑問，某一學者針對此問題提出兩點看法： (甲)法國前總統戴高樂在媒體前所回答的問題，除國防與外交之外，也回答國家的經濟建設問題 (乙)社會上發生的事情常常無法界定那些只歸國防事項，那些只專屬於外交事項。 請問：下列何項敘述，最符合該學者對我國政府體制的主張？
  options:
  - label: A
    content: 容易使得總統有權無責，權力過大，又不須對國會負責
  - label: B
    content: 總統雖由人民直選產生，但應成為虛位元首，內閣才應擁有實權
  - label: C
    content: 總統在不違憲前提下，不只是國防與外交，其他行政事務皆與總統有關
  - label: D
    content: 憲法規定行政院是最高行政機關，故總統須節制對行政權的干涉
