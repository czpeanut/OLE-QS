  stem: '依《憲法》我國採取五權分立，但對於是否應廢除監察院與考試院，一直受到各界的討論，以下為兩學者在修憲公聽會上的看法：

    學者S：台灣應把考試與監察兩院廢除。考試院主導政府運作最核心的人力資源規劃，卻不受任何責任制衡，監察院則是一個沒有民意基礎的《憲法》機關，卻能掌握彈劾、糾舉等與責任政治有關的權力，以影響行政院政策。兩者完全背離《憲法》設計的基本原則。

