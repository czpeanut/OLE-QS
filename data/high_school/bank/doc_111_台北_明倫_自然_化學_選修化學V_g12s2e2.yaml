  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '5'
  - label: E
    content: '6'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 最簡單分子依序為：甲烷、乙烯、甲醇、甲醛、丙酮、甲酸甲酯、甲酸、甲醯胺。其中為一個碳的有甲烷、甲醇、甲醛、甲酸、甲醯胺，共5種。故選(D)。
