- id: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2_s2_28
  section: 2
  number: 28
  type: multiple
  page: 3
  stem: 阿司匹靈為柳酸的衍生物，是一種常見藥物，人體非常容易經由胃壁吸收，通常用作<u>鎮痛藥</u>、<u>解熱藥</u>和<u>消炎藥</u>。阿司匹靈也能防止<u>血小板</u>在血管破損處凝集，有<u>抗凝</u>作用。長期低劑量服用可預防<u>心臟病</u>、<u>中風</u>與<u>血栓</u>。主要副作用是引起<u>消化道潰瘍</u>、<u>胃出血</u>及<u>耳鳴</u>。當服用過量的阿司匹靈而中毒時，可以利用酸鹼中和的原理，立即灌入大量稀釋的小蘇打（碳酸氫納）水急救。下列關於阿司匹靈的問題哪些正確？
  options:
  - label: A
    content: 常溫下易溶於水中
  - label: B
    content: 為弱酸性
  - label: C
    content: 血友病患者可使用阿司匹靈止痛
  - label: D
    content: 柳酸和甲醇反應，以濃硫酸作為催化劑，可製備阿司匹靈
  - label: E
    content: 製備阿司匹靈需在無水環境中
  assets:
  - key: s2_28_f1
    kind: figure
    file: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2/s2_28_f1.png
    crop:
      page: 3
      rect:
      - 604.8
      - 355.1
      - 687.85
      - 426.45
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)阿司匹靈碳數較高，對水溶解度不佳；(B)正確；(C)阿司匹靈會抗凝血，血友病患者不適合使用；(D)此反應產物為柳酸甲酯（冬青油）；(E)正確，因乙酐遇水會水解成乙酸，其反應性會下降。故選(B)(E)。
