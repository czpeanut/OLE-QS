    content: 可與金屬鈉反應產生氫氣
  group_stem: 近期平面媒體報導：雙酚A（結構如附圖）是一種環境賀爾蒙，經由攝食進入人體的主要途徑包括嬰兒的奶瓶、罐頭的內附膜、牙齒的填充劑等。最讓人擔心的是嬰兒正值發育期，使用雙酚A製成的奶瓶會造成深遠的影響。
  shared_asset: g1_16_17
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)正確，有酚之結構，可使$Fe^{3+}$溶液呈紫色；(B)正確，苯環上8個H、甲基6個H、羥基2個H，共16個H原子；(C)正確，兩個苯環各6個為$sp^{2}$混成的碳；(D)酚酸性很弱，不會使石蕊試紙變色；(E)具有羥基，可與鈉反應。故選(D)。
