  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列純物質中，分子間可產生氫鍵者有哪些？ ①乙醇 ②乙醛 ③丙酮 ④三甲胺 ⑤乙醯胺 ⑥乙酸乙酯
  options:
  - label: A
    content: ①②③⑤⑥
  - label: B
    content: ①③⑥
  - label: C
    content: ①④⑤
  - label: D
    content: ①⑥
  - label: E
    content: ①⑤
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 具有接在O或N原子上的氫，即可形成同類分子間的氫鍵。其中醇、醯胺皆可。三甲胺的N原子上全為甲基，不滿足可形成同類分子間氫鍵的條件。故選(E)。
- id: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 等莫耳數的下列有機物，在酸性$KMnO_{4}$溶液中完全被氧化時，何者消耗最多量的$KMnO_{4}$？
  options:
  - label: A
    content: 2-丁醇
  - label: B
    content: 丁醛
  - label: C
    content: 2,2-二甲基-1-丙醇
  - label: D
    content: 甲酸
  - label: E
    content: 2-甲基-2-丁醇
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 1°醇→醛→酸或2°醇→酮，每一步氧化都失去2個電子。(A)二級醇，氧化一次；(B)醛，氧化一次；(C)一級醇，氧化兩次；(D)具有一個醛基，可被氧化一次；(E)三級醇，不氧化。故選(C)。
- id: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列關於蔗糖的敘述，何者正確？
  options:
  - label: A
    content: 分子式為($C_{6}H_{12}O_{6}$)$_{2}$
  - label: B
    content: 可由澱粉水解生成
  - label: C
    content: 可還原斐林試劑
  - label: D
    content: 分子中共有8個羥基
  - label: E
    content: 是所有醣類中甜度最高的
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為$C_{12}H_{22}O_{11}$；(B)蔗糖為葡萄糖與果糖脫水的產物，澱粉為葡萄糖的聚合物，故澱粉水解不可能生成蔗糖，應生成麥芽糖；(C)蔗糖不與斐林試劑反應；(D)正確；(E)果糖更甜。故選(D)。
- id: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: $C_{3}H_{9}$N的異構物中，可與乙醯氯反應形成醯胺類化合物者有幾個？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 形成醯胺的過程中會脫去小分子，其中胺類化合物會脫去N上的氫原子。因此若要形成醯胺，則不得為三級胺。$C_{3}H_{9}$N形成的一級胺有兩種：正丙胺、異丙胺，二級胺有一種：甲乙胺。故選(C)。
- id: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 以$^{18}$O標定$CH_{3}$OH上的氧原子，則$CH_{3}$OH與$CH_{3}$COOH進行酯化反應後，$^{18}$O出現在哪一個化合物中？
  options:
  - label: A
    content: $H_{2}$O
  - label: B
    content: $CH_{3}COOCH_{3}$
  - label: C
    content: $HCOOC_{2}H_{5}$
  - label: D
    content: $CH_{3}$COOH
  - label: E
    content: HCOOH
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 酯化的過程中，醇上的O原子會接上原先羧基的C＝O之C，並形成共價鍵。故酯類化合物中，接上C＝O的氧原子來自於醇。故選(B)。
