  stem: 某一元醇經充分燃燒後，生成之$CO_{2}$與$H_{2}$O的重量比為88：45，分子量為74，此一元醇有若干種異構物可以與 $Cr_{2}O_{7}^{2－}$的酸性溶液反應，且生成物<u>可與</u>多侖試液產生銀鏡反應？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: 5 種
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 產生的$CO_{2}$、$H_{2}$O莫耳數比＝4：5，即化合物中C原子數：H原子數＝2：5。分子量＝74的一元醇，滿足上述條件者應為$C_{4}H_{10}$O。被二鉻酸鉀氧化後可能得到醛類或酮類，但產物可與多侖試劑反應者應為醛類。因此可得知此一元醇為1°醇，可能為正丁醇或2-甲基丙醇。故選(B)。
