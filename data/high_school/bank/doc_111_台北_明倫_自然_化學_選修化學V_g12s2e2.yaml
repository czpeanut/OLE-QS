- id: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 水晶寶寶是一種吸水性高分子聚合物（丙烯醯胺與丙烯酸），簡單的說，就是一種高分子化合物，最大的特性就是吸水性特別強，可以在短短的時間內吸收大量的水，吸了水會膨脹好幾倍，尤其在水溫高的狀況下，吸收力會更好。日常生活中常見的紙尿片、衛生棉等，也是含有丙烯酸成分的產品。關於水晶寶寶何者正確？
  options:
  - label: A
    content: 利用縮合聚合的聚醯胺
  - label: B
    content: 利用加成反應的同元聚合物
  - label: C
    content: 利用加成反應的共聚物
  - label: D
    content: 利用縮合聚合的聚酯
  - label: E
    content: 無法與水分子產生氫鍵
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 水晶寶寶可吸水，代表其保有親水性的官能基（醯胺基、羧基），可與水產生氫鍵。故其聚合的過程中應該不是使用醯胺基、羧基來聚合；因單體為烯類，故可使用單體結構中的碳碳雙鍵來進行加成聚合。又因有兩種單體，故為共聚物。故選(C)。
