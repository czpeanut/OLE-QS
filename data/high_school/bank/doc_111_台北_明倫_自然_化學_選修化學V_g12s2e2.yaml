  section: 2
  number: 26
  type: multiple
  page: 3
  stem: 「綠色化學」是一種對環境友好的化學製程，核心概念為開發對環境友好的化學技術，降低對環境的衝擊。下列哪些是「綠色化學」的基本原則？
  options:
  - label: A
    content: 將廢棄的化學產品回收，轉換成有用的資源
  - label: B
    content: 化學產品使用後應可降解，以避免在環境中累積
  - label: C
    content: 反應條件以高溫、高壓為主，加快反應速率，避兔製程成本增加
  - label: D
    content: 改用無毒或無揮發性的溶劑
  - label: E
    content: 慎選製程中的化學物質，以避兔危險化學物質的處理和大量的存放
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (C)高溫、高壓耗能且危險，不為綠色化學的原則。故選(A)(B)(D)(E)。
