  explanation: 甲基正丙基醚示性式為$CH_{3}OC_{3}H_{7}$，分子式為$C_{4}H_{10}$O。(A)$C_{4}H_{8}$O；(B) $C_{4}H_{10}$O；(C) $C_{4}H_{8}O_{2}$；(D) $C_{5}H_{12}$O；(E) $C_{4}H_{10}$O。故選(B)(E)。
- id: doc_111_台北_明倫_自然_化學_選修化學V_g12s2e2_s2_22
  section: 2
  number: 22
  type: multiple
  page: 2
  stem: 下列各物質性質的比較何者正確？
  options:
  - label: A
    content: 酸性：酚＞乙醇
  - label: B
    content: 鹼性：氨＞二甲胺
  - label: C
    content: 熔點：異戊烷＞新戊烷
  - label: D
    content: 沸點：乙酸＞乙醚
  - label: E
    content: 水溶性：乙醇＞乙醚
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)酚為酸性、醇為中性；(B)推電子基（甲基）越多，鹼性越強；(C)越對稱的物質（新戊烷），排列越整齊，熔點越高；(D)分子量相近的酸與醇，酸可形成較多組氫鍵，故沸點較高；(E)醇類極性較大，易與水形成氫鍵，故水溶性大於醚類。故選(A)(D)(E)。
