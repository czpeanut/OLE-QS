  - label: C
    content: 甲酸乙酯和強酸作用所得產物
  - label: D
    content: 乙醛和二鉻酸鉀的酸性溶液作用所得產物
  - label: E
    content: 丙炔在硫酸汞存在下與稀硫酸作用所得產物
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)產生丁酮；(B)產生乙醛；(C)產生甲酸與乙醇；(D)產生乙酸；(E)產生丙酮。只有醛類、甲酸與甲酸衍生物可與斐林試劑反應。故選(B)(C)。
