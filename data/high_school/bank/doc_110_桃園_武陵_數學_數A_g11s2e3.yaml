- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設 A，B，C 均為 n 階方陣（n ≥ 2），下列敘述何者正確？
  options:
  - label: A
    content: 若 AB＝AC，且 A≠O，則 B＝C
  - label: B
    content: 若 A，B，C 均為轉移矩陣，則$\frac{2}{5}A^{2}+\frac{1}{5}BC+\frac{2}{5}B^{3}$亦為轉移矩陣
  - label: C
    content: 若$A^{-1} , B^{-1}$皆存在，則$A^{-1}B^{-1}$＝$(AB)^{-1}$
  - label: D
    content: 對任意實數 a，$\left[ \begin{matrix}3 & -2 \\ a^{2}+3 & a+2\end{matrix} \right]$必有乘法反矩陣
  - label: E
    content: $A=\left[ \begin{matrix}\sin 60^{^{\circ}} & \cos 60^{^{\circ}} \\ -\cos
      60^{^{\circ}} & \sin 60^{^{\circ}}\end{matrix} \right]$，則 $A^{78}$＝－I
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：反例：$A=\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，$B=\left[
    \begin{matrix}0 & 0 \\ 0 & 1\end{matrix} \right]$，$C=\left[ \begin{matrix}0 &
    0 \\ 0 & 2\end{matrix} \right]$⇒ AB＝AC＝O

    但 B≠C

    (B) ○：$A^{2}$，BC，$B^{3}$ 亦為轉移矩陣，又$\frac{2}{5}$，$\frac{1}{5}$，$\frac{2}{5}$＞0，且$\frac{2}{5}+\frac{1}{5}+\frac{2}{5}=1$

    得$\frac{2}{5}A^{2}+\frac{1}{5}BC+\frac{2}{5}B^{3}$為轉移矩陣

    (C) ╳：$(AB)^{-1}=B^{-1}A^{-1}$

    (D) ○：$\mathrm{det}\left( \left[ \begin{matrix}3 & -2 \\ a^{2}+3 & a+2\end{matrix}
    \right] \right)$＝3a＋6＋$2a^{2}$＋6＝$2a^{2}$＋3a＋12＝$2\left( a+\frac{3}{4} \right)
    ^{2}+\frac{87}{8}$恆正

    (E) ○：$A=\left[ \begin{matrix}\cos 30^{^{\circ}} & \sin 30^{^{\circ}} \\ -\sin
    30^{^{\circ}} & \cos 30^{^{\circ}}\end{matrix} \right]$＝$\left[ \begin{matrix}\cos
    (-30^{^{\circ}}) & -\sin (-30^{^{\circ}}) \\ \sin (-30^{^{\circ}}) & \cos (-30^{^{\circ}})\end{matrix}
    \right]$⇒ $A^{12}$＝I

    ⇒ $A^{78}$＝$(A^{12})^{6}A^{6}$＝$A^{6}$＝$\left[ \begin{matrix}\cos (-180^{^{\circ}})
    & -\sin (-180^{^{\circ}}) \\ \sin (-180^{^{\circ}}) & \cos (-180^{^{\circ}})\end{matrix}
    \right]$＝－I

    故選(B)(D)(E)'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 袋中有 2 顆紅球、3 顆白球與 1 顆藍球，設每顆球被選取的機率均等。今將袋中的球逐次取出，每次隨機取出一顆，取後不放回，直到所有球被取出為止。試選出正確的選項。
  options:
  - label: A
    content: 「取出的第一顆為紅球」的機率大於「取出的第二顆為紅球」的機率
  - label: B
    content: 「取出的第一顆為紅球」與「取出的第二顆為紅球」兩者為獨立事件
  - label: C
    content: 「取出的第一顆為藍球」與「取出的第二顆為藍球」兩者為互斥事件
  - label: D
    content: 「取出的第一、二顆皆為紅球」的機率等於「取出的第一、二顆皆為白球」的機率
  - label: E
    content: 「取出的前三顆皆為白球」的機率小於「取出的前三顆球顏色皆相異」的機率
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：P（第一顆紅）＝$\frac{2}{6}$＝$\frac{1}{3}$

    P（第二顆紅）＝P（第一顆紅且第二顆紅）＋P（第一顆白且第二顆紅）

    ＋P（第一顆藍且第二顆紅）

    ＝$\frac{2}{6}\times \frac{1}{5}+\frac{3}{6}\times \frac{2}{5}+\frac{1}{6}\times
    \frac{2}{5}=\frac{10}{6\times 5}=\frac{1}{3}$

    (B) ╳：P（第一顆紅∩第二顆紅）＝$\frac{2}{6}\times \frac{1}{5}$≠P（第一顆紅）×P（第二顆紅）＝$\frac{1}{3}\times
    \frac{1}{3}$

    (C) ○：因藍球只有一顆，交集為空集合

    (D) ╳：$\frac{2}{6}\times \frac{1}{5}<\frac{3}{6}\times \frac{2}{5}$

    (E) ○：P（前三顆皆為白）＝$\frac{3}{6}\times \frac{2}{5}\times \frac{1}{4}$＝$\frac{1}{20}$＜P（前三顆顏色相異）＝$\frac{2}{6}\times
    \frac{3}{5}\times \frac{1}{4}\times 3！=\frac{3}{10}$

    故選(C)(E)'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_1
