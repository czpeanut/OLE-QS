  stem: 設 A，B 為兩事件，且 P(A)＝$\frac{2}{3}$，P(B)＝$\frac{2}{5}$，若 A，B 為獨立事件，則 P(A∪B')＝＿＿＿＿
  explanation: 'P（A∪B''）＝P(A)＋P（B''）－P（A∩B''）

    又 A，B 為獨立事件 ⇒ A，B'' 亦獨立

    ⇒ P（A∪B''）＝P(A)＋（1－P(B)）－P(A)（1－P(B)）＝$\frac{2}{3}+\frac{3}{5}-\frac{2}{3}\times
    \frac{3}{5}=\frac{13}{15}$

    故 P（A∪B''）＝$\frac{13}{15}$'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: '設$A=\left[ \begin{matrix}3 & -5 \\ 1 & -7\end{matrix} \right]$， (1) 若$A^{-1}$＝xA＋$yI_{2}$，則數對（x，y）＝＿＿＿＿。

    (2) $A^{4}$＋$3A^{3}$－$23A^{2}$＋6A＝＿＿＿＿。'
  explanation: '(1)$A=\left[ \begin{matrix}3 & -5 \\ 1 & -7\end{matrix} \right]$⇒$A^{-1}=\frac{1}{-16}\left[
    \begin{matrix}-7 & 5 \\ -1 & 3\end{matrix} \right]$

    又$A^{-1}$＝xA＋$yI_{2}$ ⇒$\left[ \begin{matrix}\frac{7}{16} & \frac{-5}{16} \\ \frac{1}{16}
    & \frac{-3}{16}\end{matrix} \right] =x\left[ \begin{matrix}3 & -5 \\ 1 & -7\end{matrix}
    \right] +y\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$

    ⇒$\begin{cases}\frac{7}{16}=3x+y \\ \frac{1}{16}=x\end{cases}$⇒ 數對（x，y）＝$\left(
    \frac{1}{16} , \frac{1}{4} \right)$

    (2) 由(1)知，$A^{-1}=\frac{1}{16}A+\frac{1}{4}I_{2} \xrightarrow{\times 16A}A^{2}+4A-16I_{2}$＝O

    又 $A^{4}$＋$3A^{3}$－$23A^{2}$＋6A＝（$A^{2}$＋4A－$16I_{2}$）（$A^{2}$－A－$3I_{2}$）＋2A－$48I_{2}$＝2A－$48I_{2}$

    故所求＝$2\left[ \begin{matrix}3 & -5 \\ 1 & -7\end{matrix} \right] -48\left[ \begin{matrix}1
    & 0 \\ 0 & 1\end{matrix} \right] =\left[ \begin{matrix}-42 & -10 \\ 2 & -62\end{matrix}
    \right]$'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_3
  section: 2
  number: 3
  type: fill
  page: 2
  stem: 先將直線 L 右移 1 單位和上移 1 單位後，再經過矩陣$A=\left[ \begin{matrix}1 & 2 \\ 3 & 4\end{matrix}
    \right]$的線性變換後得直線 L'：2x－3y＝6，則 L 的方程式為＿＿＿＿。
  answer:
  - 7x＋8y＝－21
  answer_status: verified
  answer_source: answer_key
  explanation: '設 $L_{1}$ 為 L 右移 1 和上移 1 後之直線

    則$L''\xrightarrow{A^{-1}}L_{1}$，其中$A^{-1}=\left[ \begin{matrix}1 & 2 \\ 3 & 4\end{matrix}
    \right] ^{-1}$＝$\frac{1}{-2}\left[ \begin{matrix}4 & -2 \\ -3 & 1\end{matrix}
    \right]$

    設 P''（3，0），Q''（0，－2）為 L''上兩點

    ⇒$\frac{-1}{2}\left[ \begin{matrix}4 & -2 \\ -3 & 1\end{matrix} \right] \left[
    \begin{matrix}3 \\ 0\end{matrix} \right] =\left[ \begin{matrix}-6 \\ \frac{9}{2}\end{matrix}
    \right]$，$\frac{-1}{2}\left[ \begin{matrix}4 & -2 \\ -3 & 1\end{matrix} \right]
    \left[ \begin{matrix}0 \\ -2\end{matrix} \right] =\left[ \begin{matrix}-2 \\ 1\end{matrix}
    \right]$

    得$\left( -6 , \frac{9}{2} \right)$和（－2，1）為 $L_{1}$ 上兩點

    ⇒ $L_{1}$ 方程式為 7x＋8y＝－6

    又$L_{1}\xrightarrow{左移1 下移1}L$⇒L 方程式為 7（x＋1）＋8（y＋1）＝－6

    故 L：7x＋8y＝－21'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_4
  section: 2
  number: 4
  type: fill
  page: 2
  stem: 直線 L：x－y＝1 經過鏡射矩陣 M 的線性變換後可得直線 L'：7x＋y＝a，求 M＝＿＿＿＿。
  explanation: '設 L 對直線 y＝（tanθ）x 鏡射，則$M=\left[ \begin{matrix}\cos 2\theta & \sin
    2\theta \\ \sin 2\theta & -\cos 2\theta\end{matrix} \right]$

    令 P（1，0），Q（0，－1）為 L 上兩點

    ⇒$\left[ \begin{matrix}\cos 2\theta & \sin 2\theta \\ \sin 2\theta & -\cos 2\theta\end{matrix}
    \right] \left[ \begin{matrix}1 \\ 0\end{matrix} \right] =\left[ \begin{matrix}\cos
    2\theta \\ \sin 2\theta\end{matrix} \right]$，$\left[ \begin{matrix}\cos 2\theta
    & \sin 2\theta \\ \sin 2\theta & -\cos 2\theta\end{matrix} \right] \left[ \begin{matrix}0
    \\ -1\end{matrix} \right] =\left[ \begin{matrix}-\sin 2\theta \\ \cos 2\theta\end{matrix}
    \right]$

    得 P''$(\cos 2\theta , \sin 2\theta )$及 Q''$(-\sin 2\theta , \cos 2\theta )$為 L''
    上兩點

    ⇒$m_{\overline{P''Q''}}$＝－7＝$\frac{\sin 2\theta -\cos 2\theta}{\cos 2\theta +\sin
    2\theta}$

    ⇒$-7\cos 2\theta -7\sin 2\theta =\sin 2\theta -\cos 2\theta$

    ⇒$-3\cos 2\theta =4\sin 2\theta \Rightarrow \tan 2\theta$＝$-\frac{3}{4}$

    得$(\sin 2\theta , \cos 2\theta )$＝$\left( \frac{3}{5} , -\frac{4}{5} \right)$或$\left(
    -\frac{3}{5} , \frac{4}{5} \right)$

    故$M=\pm \left[ \begin{matrix}-\frac{4}{5} & \frac{3}{5} \\ \frac{3}{5} & \frac{4}{5}\end{matrix}
    \right]$'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_5
  section: 2
  number: 5
  type: fill
  page: 2
  stem: 公司舉辦尾牙抽獎活動，員工依排隊順序抽獎，輪到抽獎的人有一次抽獎的機會，抽獎的方式是丟擲一顆公正的骰子，出現 1 或 2 為中獎，其餘點數沒有中獎。獎品只有
    3 份，活動直到 3 份獎品都被抽中為止。試問：排在第四位的員工可以抽獎的情況之下，第五位員工仍然可以抽獎的機率為＿＿＿＿。
  answer:
  - $\frac{12}{13}$
  answer_status: verified
  answer_source: answer_key
  explanation: '中獎機率為$\frac{1}{3}$，不中獎機率為$\frac{2}{3}$

    令 A 為第 4 位員工可抽獎，B 為第五位員工可抽獎

    ⇒ P(A)＝1－$\left( \frac{1}{3} \right) ^{3}=\frac{26}{27}$

    P（A ∩ B）＝$1-\left( \frac{1}{3} \right) ^{3}-C_{2}^{3}\left( \frac{1}{3} \right)
    ^{2}\times \frac{2}{3}\times \frac{1}{3}=\frac{24}{27}$

    故所求 P（B∣A）＝$\frac{P(A\cap B)}{P(A)}=\frac{24}{26}=\frac{12}{13}$'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_6
  section: 2
  number: 6
  type: fill
  page: 2
  stem: 三整數 a，b，c 為偶數的機率皆為$\frac{1}{4}$，且彼此互不影響，若已知 abc 為偶數，則 ab＋c 為奇數的機率為＿＿＿＿。
  answer:
  - $\frac{30}{37}$
  answer_status: verified
  answer_source: answer_key
  explanation: '令 A 為 abc 為偶數之事件，B 為 ab＋c 為奇數之事件

    ⇒ P(A)＝$1-\left( \frac{3}{4} \right) ^{3}=\frac{37}{64}$

    P（A∩B）＝$\left( 1-\left( \frac{3}{4} \right) ^{2} \right) \times \frac{3}{4}+\frac{3}{4}\times
    \frac{3}{4}\times \frac{1}{4}=\frac{30}{64}$

    故所求$P(B | A)=\frac{P(A\cap B)}{P(A)}=\frac{30}{37}$'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_7
  section: 2
  number: 7
  type: fill
  page: 2
  stem: 甲、乙兩人羽球的實力相當，今兩人約定要打 7 場比賽（沒有和局），約定一方先贏得 4 場比賽可提前結束，若前三場比賽，甲獲得 2 勝 1 敗，且最後比賽提前結束，則是甲獲勝的機率為＿＿＿＿。
  answer:
  - $\frac{4}{5}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵提前結束

    ∴剩下情況為：① 甲 2 勝乙 0 勝

    ② 甲 2 勝乙 1 勝

    （其中排列的順序有：甲乙甲，乙甲甲，甲甲乙（不合），只有兩種）

    ③ 甲 0 勝乙 3 勝

    又 P（甲勝）＝P（乙勝）＝$\frac{1}{2}$

    故所求＝$\frac{\left( \frac{1}{2} \right) ^{2}+C_{1}^{2}\times \left( \frac{1}{2}
    \right) ^{3}}{\left( \frac{1}{2} \right) ^{2}+C_{1}^{2}\times \left( \frac{1}{2}
    \right) ^{3}+\left( \frac{1}{2} \right) ^{3}}=\frac{4}{5}$'
- id: doc_110_桃園_武陵_數學_數A_g11s2e3_s2_8
  section: 2
  number: 8
  type: fill
  page: 2
  stem: 坐標平面中滿足（2x－3y）$^{2}$＋（x＋2y）$^{2}$ ≤ 4 的面積為＿＿＿＿。
  answer:
  - $\frac{4\pi}{7}$
  answer_status: verified
  answer_source: answer_key
  explanation: '令 u＝2x－3y，v＝x＋2y

    則原式變成 $u^{2}$＋$v^{2}$ ≤ 4，新面積為 4π

    又$\left[ \begin{matrix}u \\ v\end{matrix} \right] =\left[ \begin{matrix}2 & -3
    \\ 1 & 2\end{matrix} \right] \left[ \begin{matrix}x \\ y\end{matrix} \right]$

    ⇒ 新面積＝$| \mathrm{det}\left( \left[ \begin{matrix}2 & -3 \\ 1 & 2\end{matrix} \right]
    \right) |$×原面積

    ⇒ 4π＝7×原面積

    故原面積為$\frac{4}{7}$π'
