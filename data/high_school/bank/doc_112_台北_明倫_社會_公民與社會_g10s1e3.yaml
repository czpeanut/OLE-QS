  explanation: (A)並非所有選舉產生的民意代表皆能由選舉人提出罷免，例如：不分區立委由政黨推派，以政黨票得票率獲得席次，選舉人無法罷免。僅能透過政黨開除黨籍來使立委去職。(C)(D)關於罷免的規定，由原選舉區選舉人提議，應為原選舉區選舉人總數 1 ％以上，並徵求原選舉區選舉人總數 10 ％以上連署。但就職未滿一年，不得提出罷免。
