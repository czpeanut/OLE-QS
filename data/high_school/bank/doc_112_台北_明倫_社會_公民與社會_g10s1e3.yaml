- id: doc_112_台北_明倫_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 現代國家的社會安全制度強調保障公民基本生活需求，但國家資源有限，如何分配常引發論辯。有些縣市政府會提供街友公共服務，如洗澡專車、避寒居所、主動訪視街友是否需就醫等。對此福利服務，反對者主張街友未能積極投入生產勞動，形同人力資源浪費，政府應輔導並要求街友就業，而不應提供資源讓其繼續留在街頭。請問在資源的分配上，反對提供街友福利服務者，最可能抱持下列何種立場？
  options:
  - label: A
    content: 社會安全服務的提供應限縮在急難救助的最小範圍
  - label: B
    content: 社會安全資源分配應著眼於協助公民能貢獻社會
  - label: C
    content: 缺乏檢核機制將造成公共服務資源浪費與浮濫使用
  - label: D
    content: 福利服務須存在排富機制才符合公平正義
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文中「政府應輔導並要求街友就業，而不應提供資源讓其繼續留在街頭」，反對者的意見多著重於街友的未來生活適應，而非現階段的救助，故(B)最為貼切。(A)反對者並無對急難救助有相關的描述。(C)反對者並非反對政府提供公共服務資源，而是提供的方向應是協助街友重回社會生活。(D)街友並非排富機制的對象範圍。
