- id: doc_112_台北_明倫_社會_公民與社會_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 承上題，有關政府擴大托育補助的作為，最可能引發何種爭議？
  options:
  - label: A
    content: 鼓勵生育是否造成資源浪費與濫用
  - label: B
    content: 育兒成本是否具風險共同承擔性質
  - label: C
    content: 育兒的福利成本應由誰負擔
  - label: D
    content: 社會福利民營化的效率與公平問題
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 發放托育補助為社會福利項目，由政府規劃經費支應，但國庫收入多為人民納稅，並非所有家庭或人民都有養育幼兒的規劃，故政府擴大托育補助的政策，其成本由全民共同攤提，引發爭議。(A)爭議在於托育補助的擴大發放，而非對於生育的質疑。(B)此敘述應為社會保險項目。(D)此為社會津貼發放的經費爭議，並無提及社會福利民營化議題。
  tags:
    unit:
      code: CI-1-6-2
      book: 公民與社會1 民主與人權
      chapter: 社會安全制度
