  stem: 過去我國關於公職人員罷免的相關規定，被質疑是間接剝奪人民罷免權，因此 2016 年三讀修正《公職人員選舉罷免法》，除了刪除罷免活動不得宣傳之規定外，並下修罷免的提案、連署與通過門檻。2020 與 2021 年接連有直轄市市長、議員及立法委員因怠忽職守、言行脫序或背棄政治誠信等理由，遭罷免成功而去職。以下關於我國罷免權行使的相關敘述，何者正確？
