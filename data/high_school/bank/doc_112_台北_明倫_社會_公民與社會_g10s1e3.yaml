  answer_status: verified
  answer_source: answer_key
  explanation: (A)(D)商業媒體是指媒體所有權是由私人企業或商業集團所擁有並經營，資金來源來自民間，但仍具第四權的角色。(B)公共媒體成立與經營目的在於服務公眾，而非為了商業利益或替國家政策背書；因此公共媒體具有不受商業利益與政治力的介入、操控的特色，也不為政府所有。
