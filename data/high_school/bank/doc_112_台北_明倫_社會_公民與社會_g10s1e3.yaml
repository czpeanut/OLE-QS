  stem: '以下為某國五個政黨在本屆國會議員選舉的選舉結果：

    |  | 甲 | 乙 | 丙 | 丁 | 戊 |

    | --- | --- | --- | --- | --- | --- |

    | 得票率 | 48.12 ％ | 44.45 ％ | 5.44 ％ | 1.12 ％ | 1.08 ％ |

    | 當選席次數 | 44 | 27 | 1 | 0 | 1 |

    | 當選席次比例 | 60.2 ％ | 36.9 ％ | 1.3 ％ | 0 | 1.3 ％ |

    有關其選舉制度的特徵敘述，下列何者最為正確？'
  options:
  - label: A
    content: 得票率愈低的小黨，愈難以在國會取得席次
  - label: B
    content: 得票率與席次間出現落差，民意未獲有效反映
  - label: C
    content: 較不利小黨競爭，小黨會用較偏激方式競選
  - label: D
    content: 有利於社會當中多元意見的表達
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從表格數據中可得知，甲、乙兩黨得票率差不多，但在席次上卻相差十多席，推測某國可能是採取單一選區制，贏者全拿的制度設計，讓票數僅有些微落差的第二高票者也無法取得席次，可能造成和某國相同的狀況：得票率次高的乙政黨，未能反映在席次上。(A)從數據上可得知，乙、丙、丁、戊四個政黨的得票率皆難以反映在席次上，不只有小黨。(C)單一選區制的國家，小黨為了爭取更多的選票，其政見會偏向中立，盼能吸引更多中間選民的支持。(D)選舉結果顯示，僅有甲獲得超過半數以上的支持，社會中難有多元的民意表達。
