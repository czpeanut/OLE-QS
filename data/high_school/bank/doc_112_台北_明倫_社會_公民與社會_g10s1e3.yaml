  stem: 為解決超低生育率帶來的少子女化危機，協助送托家庭減輕經濟負擔，行政院修正我國少子女化對策計畫，2024 年 1 月起調高托育補助，將每名幼兒托育費用由原先控制在家庭可支配所得 10 ％～15 ％降低為 5 ％～10 ％，擴大展現政府對育兒家庭的支持。請問托育補助的性質與下列哪一種社會安全制度最接近？
