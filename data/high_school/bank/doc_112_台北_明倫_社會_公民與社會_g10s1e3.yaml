  stem: 因 2017 年亞冠賽出賽爭議，中華職棒大聯盟與球員職業工會啟動團體協商，歷經多年協商，於 2022 年 2 月針對球員出賽之責任義務問題達成協議，簽訂臺灣職業運動第一份團體協約。工會表示該協約沒有「禁搭便車」條款，非工會成員也能享有同樣權利。請問若協約設有「禁搭便車條款」，可能的原因為何？
