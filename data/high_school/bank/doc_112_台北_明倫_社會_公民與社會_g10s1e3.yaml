  explanation: 所謂同溫層是指一群人融入同質群體，分享相同的觀點、討論單一來源的資訊，選擇性地忽略不同觀點，進而促成一個封閉群體的討論交流，將意見相左的看法拒之於門外，彼此只在類似意見者團體內互相取暖。因此，同溫層效應可能帶來各群體間堅持自身的觀點，而造成群體間的矛盾與對立。
