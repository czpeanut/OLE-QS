  answer_status: verified
  answer_source: answer_key
  explanation: 甲方案增列社會救助經費主要對象為經濟弱勢者、急難救助者，若因失業而陷入經濟困境，則題文中所提到的因社會變遷所造成的衝擊，將使補助對象擴大而增加政府支出。(B)乙方案為提升就業安全的目標增加職業訓練，此為社會福利項目，不屬於教育支出。(C)應為增加甲方案經費。(D)因三個方案為不同面向與針對不同對象，可同時規劃不需擇一。
