  stem: 依我國法律，經營電信、廣播或電視頻道等媒體需領有政府機關核發的經營執照，且年限到期前須申請換照，核准後才能繼續經營。某廣播電臺申請換照，但主管機關因該電臺的報導經常與事實不符而遭民眾投訴，且其大股東直接介入新聞製播，顯示該電臺內控與自律機制失靈，故在其執照到期後，決議不予換照。請問主管機關駁回換照申請的理由與下列哪項主張最接近？
