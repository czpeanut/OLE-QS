  stem: 臺灣交通險象環生，被外媒評為「行人地獄」，社會輿論討論聲量急遽攀升，立法院因此於 2023 年 4 月三讀通過《道路交通管理處罰條例》部分條文修正案，車輛未禮讓行人，汽車駕駛人最重裁罰 6,000 元，若因不禮讓行人導致重傷死亡，可吊銷駕駛執照。某國中學生以〈帝王條款〉為主題，發揮創意畫出行人過馬路的觀感，獲得全國美術比賽漫畫類特優，但遭某網紅質疑該作品疑似歧視、醜化臺灣行人，在網路掀起兩派論戰，校方也迅速將賀文下架。不過後續風向逆轉，許多名人發聲力挺學生的創作自由，校方重新將賀文上架，該網紅也發文道歉。請問此事件最能突顯出下列何種現象？
  options:
  - label: A
    content: 傳播權與自媒體興起，使公共意見更為多元
  - label: B
    content: 「網路民意」取代「第四權」達到監督作用
  - label: C
    content: 媒體近用權的運作，加劇了數位落差的困境
  - label: D
    content: 網路媒體比起公共媒體需承擔更多社會責任
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 針對全國美術競賽的得獎作品，網路上網友不論正方、反方皆可提供個人意見，網紅也在彙整網友們的意見後，調整個人不當言論，顯示透過資訊科技的發展，民眾可運用自媒體表達個人意見。(B)第四權仍為媒體，並未被取代。(C)因使用數位工具的物質、意願、文化和能力條件不同，而將人們劃分為不同群體的概念，就是數位落差，並非受到媒體近用權運作的影響。(D)不論是網路媒體或公共媒體皆具有社會責任，並無多寡之分。
