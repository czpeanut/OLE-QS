  stem: 社會安全制度的起源，從歐洲中世紀封建解體、農作歉收與物價革命，使得失業和貧窮成為政府不得不面對的社會問題，到工業革命後，都市化與機械化促成資本主義的繁榮，擴大了貧富差距，也造成社會問題更加嚴重，因此世界各國政府都希望設計一種保護民眾減少生活風險的機制，社會安全制度於焉產生。請問關於各國社會安全制度的說明，何者正確？
  options:
  - label: A
    content: 英國頒布《濟貧法》，規定濟貧院須救濟所有沒有工作的貧民
  - label: B
    content: 美國推動《社會安全法案》，解決經濟大恐慌造成的失業問題
  - label: C
    content: 英國提出《貝佛里奇報告》，成為歷史上第一個社會保險制度
  - label: D
    content: 德國辦理「勞工疾病保險」，以提供全民基本的生活需求保障
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《濟貧法》是英國經歷政治、經濟與宗教變遷後，政府不得不對貧民提供救濟，法案中增加對祖父母、父母的家庭責任，意即親屬負有基本照顧與支持自家窮人的責任，無能為力時，公眾才有必要伸出援手。(C)(D)德國提出基層勞工的勞工疾病保險，開啟保障制度，但並非針對全民基本生活需求保障。
