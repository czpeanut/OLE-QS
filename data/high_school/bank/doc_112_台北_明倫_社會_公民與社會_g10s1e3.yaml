  stem: 媒體是社會上提供訊息的重要管道，同時扮演促進公共意見討論的公共性角色。民主國家的新聞媒體多數是由民間人士或企業所投資設立的商業媒體為主，以及部分因彌補商業媒體公共性不足的公共媒體。同樣作為媒體，二者仍有各自不同的特徵，下列相關敘述何者正確？
