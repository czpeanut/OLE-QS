  stem: 某國因科技進步與基本工資調升，無人商店的比例持續上升。因該國無人商店趨勢而找不到工作者，多屬經濟處境不利群體，雖然他們想工作，但常到處碰壁，心灰意冷之下放棄找工作。輿論因而主張政府應提撥經費落實社會安全體制，以減少社會變遷帶來的衝擊；各界也提出三種不同方案：(甲)增列社會救助經費(乙)增加職業訓練生活津貼之經費分配(丙)增列就業保險之失業給付。若從不同社會安全制度的屬性或成效來分析甲、乙、丙三項方案，下列評論何者最適切？
  options:
