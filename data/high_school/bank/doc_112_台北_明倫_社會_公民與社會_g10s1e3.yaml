- id: doc_112_台北_明倫_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 近年來，我國多次舉辦中央或地方性的公民投票，希望在推動各種國家政策或公眾事務上得到人民的同意。下列有關我國公民投票之敘述，何者正確？
  options:
  - label: A
    content: 為落實直接民主，任何國內的公共事務皆可成為公民投票的提案
  - label: B
    content: 公投案採簡單多數決，只要有效同意票多於不同意票即為通過
  - label: C
    content: 公投案無論通過與否，1 年內不得就同一事項再提案
  - label: D
    content: 全國性公投的提案須通過中央選舉委員會的形式審查
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 《公民投票法》在 2018 年的修訂後，廢除公民投票審議委員會。依第 3 條第 1 項規定，全國性公民投票之主管機關為中央選舉委員會，中選會對公投案題目僅能形式審查，不能進行實質審查。(A)公民投票有其侷限性，例如預算案、人事案都不能成為公民投票的提案。(B)公投通過需滿足兩個條件，第一：有效同意票多於不同意票、第二：有效同意票多於 1∕4 投票權人總數，因此，並非採取簡單多數決，依然設有門檻。(C)應為兩年內。
