  stem: 隨著社群平臺成為現代人的生活重心之一，「網紅」也隨之崛起，各行各業的網紅相繼出現，不但成為某些閱聽人的意見領袖，也成為一種文化標識。網紅在日常生活的影響力漸增，甚至造成所謂的「同溫層效應」。同溫層效應會帶來何種影響？
