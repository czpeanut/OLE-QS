  stem: 某網紅遭《星星周刊》爆料疑似跟男網友相約一夜情，該網友將自己與此網紅的私密對話截圖並提供給《星星周刊》，該周刊全文照登，讓此名網紅的同志身分曝光。報導上線後，遭大批網友批評，指責該周刊不應將名人你情我願的私生活公開報導。下列何者最能詮釋該周刊報導所涉及的爭議？
  options:
  - label: A
    content: 媒體報導內容形塑了同志容易與網友相約一夜情的刻板印象
  - label: B
    content: 媒體報導內容不僅不屬公益性事務，更有侵害他人隱私之虞
  - label: C
    content: 媒體報導形成輿論過程中，存在著媒體近用權之不平等現象
  - label: D
    content: 媒體以腥羶色內容吸引閱聽人注意，與媒體壟斷的現象有關
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 周刊透過網友的私密對話逕自爆料網紅的個人私生活，但此報導內容與公共利益無關，卻未經當事人同意公開個人性傾向，該報導已經侵害當事人的個人隱私。(A)報導內容並非刻板印象，而是侵害個人隱私權。(C)媒體近用權是指人民得依一定條件，要求媒體提供版面或時間，讓其能行使表達意見之權利，促進媒體報導或評論能確實公正。上述題文中主要為媒體未守媒體自律、守門人的角色，並非媒體近用權議題。(D)媒體壟斷包含限制、干擾對方或人民經營媒體，以及限制刊登對方或大眾想知道的觀點。題文中並無媒體壟斷的現象。
