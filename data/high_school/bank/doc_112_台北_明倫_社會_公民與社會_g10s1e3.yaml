  explanation: 目前現行制度為各政黨不分區立委當選席次中，需有 1∕2 的婦女保障名額。(A)(D)直轄市市長與區域立委皆為單一選區制，若採取婦女保障，則男性無法有當選的機會。(B)縣市議員採取複數選區制，一個選區選出多位市議員，並設有固定數額的婦女保障名額。但縣市議員並非地方自治最基層的民意代表，最小的地方自治單位應為直轄市山地原住民區、鄉鎮市等。
