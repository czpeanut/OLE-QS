  page: 1
  stem: 某份研究報告指出，與過去相較，男性願意承擔家務勞動的比例有明顯上升，但在雙薪家庭中，主要家務勞動者仍是女性。多數女性期待均等的家務分工，然而僅有薪資高的女性得以如願。從關切性別平權的角度來看，下列推論何者最適當？
  options:
  - label: A
    content: 職場的性別平等雖已充分落實，但家庭領域的性別平等仍待加強
  - label: B
    content: 男性的性別平權意識已有顯著提升，但女性卻仍受限於傳統觀念之束縛
  - label: C
    content: 性平觀念雖普及，但雙薪家庭的市場勞動貢獻仍多立基於女性再生產勞動
  - label: D
    content: 人的精力有限，故市場勞動貢獻越多者越無法對家務勞動有貢獻
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到，雙薪家庭中仍以女性為主要的家務勞動者，僅有高薪資的女性例外。從此推測，雙薪家庭中可能是由薪資較低者承擔家務居多，而勞動市場中多是男性衝刺事業、女性則花較多心力照顧家庭，讓男性無後顧之憂。上述女性的作為稱為再生產勞動。(A)在勞動市場中仍存有玻璃天花板或同工不同酬的狀況。(B)雖然男性願意承擔家務比例較以往上升，但整體來說，女性仍為主要擔負家務者。(D)雙薪家庭中，配偶雙方皆有工作、在勞動市場上皆有貢獻，薪資水準或許不同，但難以統一標準衡量貢獻多寡。
