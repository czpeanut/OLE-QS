  answer_status: verified
  answer_source: answer_key
  explanation: '設隨機變數 X 為接種某種疫苗後，出現發燒反應的人數

    則至少 3 人出現發燒反應的機率為

    1－P（X＝0）－P（X＝1）－P（X＝2）

    ＝1－$C_{0}^{5} \left( \frac{1}{5} \right) ^{0} \left( \frac{4}{5} \right) ^{5}$－$C_{1}^{5} \left( \frac{1}{5} \right) ^{1} \left( \frac{4}{5} \right) ^{4}$－$C_{2}^{5} \left( \frac{1}{5} \right) ^{2} \left( \frac{4}{5} \right) ^{3}$

