- id: doc_112_台北_大同_社會_地理_選修地理II_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '新聞一：被視為臺灣沿近海漁業中相當重要的漁獲鯖魚，經研究發現其成熟體長有愈來愈短的趨勢，從過往的平均 40 多公分一路下降至 30 公分不到。

    新聞二：紅棉本來是冬天落葉，春天開花，初夏結果，夏天再長葉，但今年冬天落葉較少，然後開花，出現花葉共存的奇怪現象。

    新聞三：南投埔里 7 月初發生蜜蜂大量死亡事件，蜂箱門口地上一攤死蜂，尚未死亡的則是不斷跳動抽搐。8 月中以後，蜜蜂死亡方式改變，蜂箱門口不見死蜂，蜂群卻不斷減少。

    新聞四：昆蟲中超過 40 ％的物種正在減少，1／3 的昆蟲瀕臨滅絕，滅絕速度比哺乳動物、鳥類和爬行動物還快 8 倍。在 2000 年～ 2009 年期間，英格蘭農地上常見的蝴蝶物種數下降了 58 ％。

    「物候學」為觀測經年植物之生長或榮枯、動物的行動或生育，以了解氣候之變化及其對動植物的影響。上述 4 則新聞資料，何者屬於物候學的研究範疇？'
  options:
  - label: A
    content: 新聞一
  - label: B
    content: 新聞二
  - label: C
    content: 新聞三
  - label: D
    content: 新聞四
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '據題幹敘述，物候學是研究氣候變化對動植物生態的影響，以此看來(B)新聞二明顯因為天候變化導致紅棉生理現象紊亂，屬於物候學的研究範疇。

    新聞一：鯖魚體長縮短可能因競捕，魚體未能完全長成就被捕而造成。

    新聞三：蜜蜂集體死亡最可能是作物農藥濫用。

    新聞四：昆蟲死亡的速度遠高於哺乳動物，此新聞中並無提及氣候影響。'
  tags:
    unit:
      code: GE-S2-1-1
