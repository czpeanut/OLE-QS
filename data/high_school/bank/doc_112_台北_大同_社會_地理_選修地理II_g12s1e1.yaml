  stem: 海平面變化是一項「全球環境變遷」的重大議題。當全球的海平面顯著上升時，對臺灣會造成哪一項最直接的環境衝擊？
  options:
  - label: A
    content: 各河川泥沙搬運量增加
  - label: B
    content: 黑面琵鷺現有棲地面積縮減
  - label: C
    content: 附近海域珊瑚礁種類增加
  - label: D
    content: 南部沿海地區地層下陷量增加
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)當海平面上升時，河流侵蝕基準面上升，流速變慢，搬運作用會變弱。(B)對棲息於水深 20 公尺淺水區的黑面琵鷺而言，棲息地將因海岸線後退而縮減。(C)對造礁珊瑚而言，海域面積增加只會增加珊瑚生長空間，但並不一定會增加其種類數量。(D)南部地層下陷主因超抽地下水，與海平面上升無關。
