- id: doc_110_台北_松山_數學_數甲_g12s1e2_s4_1
  section: 4
  number: 1
  type: fill
  page: 1
  stem: '魔法森林世界中，「魔法Q彈棒」與「Q彈棒」皆由「QQ彈」變形得來。這QQ彈原始狀態是一個底圓半徑為15公分、高為60公分的圓柱體，它在變形時永遠保持為圓柱體。變形時底圓半徑會以每秒1公分的等速率縮短，而高以每秒10公分的等速率增長。已知QQ彈的底圓半徑只能從15公分縮到5公分為止，且QQ彈在開始變形t秒後的體積為V
    (t)。 當QQ彈體積變為<u>最大</u>時為「Q彈棒」，而QQ彈體積變為<u>最小</u>時為「魔法Q彈棒」。 試回答下列問題。

    (1) 若QQ彈在開始變形t秒後的體積為V (t)＝π( 15－at )$^{2}$ ( 60＋bt )，0 ≤ t ≤ 10，則實數a之值為＿＿＿＿，實數b之值為＿＿＿＿。（填充題，每格2分，共4分）'
  answer:
  - (1) 依題意知，V (t)＝π( 15－t )$^{2}$ ( 60＋10t )，其中0 ≤ t ≤ 10，故a＝1，b＝10。
  answer_status: verified
  answer_source: answer_key
