- id: doc_110_台北_松山_數學_數甲_g12s1e2_s1_5
  section: 1
  number: 5
  type: calc
  page: 1
  stem: 若三次函數y＝f (x) 的圖形有極大值點、反曲點與極小值點，則依序此三點的x坐標成等差數列。
  answer:
  - ○
  answer_status: verified
  answer_source: answer_key
  explanation: ○：設f (x) 圖形的極大值點，反曲點，極小值點分別為 ( a , f (a) )，( b , f (b) )，( c , f (c)
    )，則( a , f (a) )，( c , f (c) ) 兩點 對稱於 ( b , f (b) )，故$\frac{a+c}{2}$＝b，所以a，b，c成等差數列。
- id: doc_110_台北_松山_數學_數甲_g12s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 設f (x)＝( x－2 ) | x－2 |，試選出正確的選項。
  options:
  - label: A
    content: f (2)＝0
  - label: B
    content: f '(2) 不存在
  - label: C
    content: f (x) 在x＝2處連續但不可微分
  - label: D
    content: f (x) 在x＝2處連續亦可微分
  - label: E
    content: f (x) 在x＝2處不連續亦不可微分
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: f (2)＝( 2－2 ) | 2－2 |＝0 f '(2)＝$\lim_{x\rightarrow 2} \frac{f(x)-f(2)}{x-2}=\lim_{x\rightarrow
    2} \frac{(x-2)|x-2|-0}{x-1}=\lim_{x\rightarrow 2} |x-2|=0$ 故f '(2)存在，且f '(2)＝f
    (2) 所以f (x)在x＝2處連續亦可微分。 故選(A)(D)。
