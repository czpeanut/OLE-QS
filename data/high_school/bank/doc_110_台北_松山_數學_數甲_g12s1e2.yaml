  answer_status: verified
  answer_source: answer_key
  explanation: ○：$\lim_{x\rightarrow \frac{3}{5}} \frac{f(x)-f(\frac{3}{5})}{x-\frac{3}{5}}=\lim_{x\rightarrow
    \frac{3}{5}} \frac{0-0}{x-\frac{3}{5}}=0$，故f (x)＝[ x ]在x＝$\frac{3}{5}$處可微分。
