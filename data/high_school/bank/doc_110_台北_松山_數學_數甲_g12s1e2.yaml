  section: 3
  number: 2
  type: fill
  page: 1
  stem: 若函數f (x)＝$\frac{3x}{x^{2}+3x+1}$，則f '(0) 之值為＿＿＿＿。
  answer:
  - '3'
  answer_status: verified
  answer_source: answer_key
  explanation: f '(x)＝$\frac{3(x^{2}+3x+1)-3x(2x+3)}{(x^{2}+3x+1)^{2}}$，故f '(0)＝$\frac{3\times
    1-0}{1^{2}}$＝3。
- id: doc_110_台北_松山_數學_數甲_g12s1e2_s3_3
  section: 3
  number: 3
  type: fill
  page: 1
  stem: 設函數f (x)＝$\begin{cases}x^{3}+x , x\geq 1 \\ ax^{2}+b , x<1\end{cases}$，若f
    (x) 在x＝1處可微分，則a×b之值為＿＿＿＿。
  answer:
  - '0'
  answer_status: verified
  answer_source: answer_key
  explanation: $\lim_{x\rightarrow 1^{+}} \frac{f(x)-f(1)}{x-1}=\lim_{x\rightarrow
    1^{+}} \frac{(x^{3}+x)-2}{x-1}=\lim_{x\rightarrow 1^{+}} (x^{2}+x+2)=4$ 又$\lim_{x\rightarrow
    1^{-}} \frac{f(x)-f(1)}{x-1}=\lim_{x\rightarrow 1^{-}} \frac{(ax^{2}+b)-2}{x-1}=\lim_{x\rightarrow
    1^{-}} \frac{ax^{2}+(b-2)}{x-1}$ 因f (x) 在x＝1處可微分，故$\lim_{x\rightarrow 1^{-}} \frac{ax^{2}+(b-2)}{x-1}=4$，所以$\begin{cases}a+b-2=0
    \\ 2a=4\end{cases}$ 得a＝2，b＝0，於是a×b＝0。
