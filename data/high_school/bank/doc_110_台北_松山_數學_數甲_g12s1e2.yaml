    所以f (x) 在x＝－1附近的一次近似為y－6＝－19 ( x＋1 )，而y＝－19x－13。
- id: doc_110_台北_松山_數學_數甲_g12s1e2_s3_5
  section: 3
  number: 5
  type: fill
  page: 1
  stem: '若多項式函數f (x) 除以 ( x－1)$^{2}$的餘式為4x，則

    (A) f (1)＋f ''(1)之值為＿＿＿＿。

    (B) $\lim_{x\rightarrow 1} \frac{f(x^{2})-f(1)}{x^{2}-1}$之值為＿＿＿＿。

    (C) $\lim_{x\rightarrow 1} \frac{x^{2}f(1)-f(x^{2})}{x^{2}-1}$之值為＿＿＿＿。'
  explanation: 設f (x)＝( x－1 )$^{2}$ q (x)＋4x，其中q (x) 為多項式 (A) f (1)＝0＋4×1＝4，f '(x)＝2
    ( x－1 ) q (x)＋( x－1 )$^{2}$ q'(x)＋4，故f '(1)＝4 於是f (1)＋f '(1)＝4＋4＝8。 (B) $\lim_{x\rightarrow
    1} \frac{f(x^{2})-f(1)}{x^{2}-1}=\lim_{x\rightarrow 1} \frac{(x^{2}-1)^{2}q(x)^{2}+4x^{2}-4}{x^{2}-1}$＝$\lim_{x\rightarrow
    1}$[ ( $x^{2}$－1 ) q ( $x^{2}$ )＋4 ]＝0＋4＝4。 (C) $\lim_{x\rightarrow 1} \frac{x^{2}f(1)-f(x^{2})}{x^{2}-1}=\lim_{x\rightarrow
    1} \frac{x^{2}f(1)-x^{2}f(x^{2})+x^{2}f(x^{2})-f(x^{2})}{x^{2}-1}=\lim_{x\rightarrow
    1} \frac{-x^{2}(f(x^{2})-f(1))+f(x^{2})(x^{2}-1)}{x^{2}-1}=\lim_{x\rightarrow
    1} [(-x^{2}\cdot \frac{f(x^{2})-f(1)}{x^{2}-1}+f(x^{2})]=-4+4=0$。
