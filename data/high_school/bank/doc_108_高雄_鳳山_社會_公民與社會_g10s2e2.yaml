  - label: B
    content: 甲單位以特定財產為中心且具有公益性質
  - label: C
    content: 乙單位屬地方自治團體，具法律上的人格
  - label: D
    content: 丙單位執行特定公共任務，財政具自主
  group_stem: 甲：我們單位自2001年依法由內政部核准立案的基金會並成為法律上的權利主體，致力於心智障礙者權益推廣，也設立庇護工場劇團、日夜間照護中心等，照顧心智照顧者，以及協助他們建立身活自理能力，適應社會生活。但最近丙單位委託我們建立小型工作所，讓心智障礙者做一些簡單工作，卻遭乙單位反對，禁止我們施工，看來施工期程不知道會延宕多久。 乙：我們這個組織，跟所有社區的一樣，依據《公寓大廈管理條例》由住戶推選組成並向臺北市政府報備，維護社區安全，環境和住戶的最大利益，是我們的工作。如果讓甲單位進駐，可能會讓出入社區的人員變得複雜且難以控制，或是造成吵鬧等問題影響住戶安寧，以及，如果房價因此下跌怎麼辦？甲單位不適合進駐社區，所以我們拒絕讓他們施工。 丙：我們單位是臺北市政府社會福利主管機關，這個空間是我們向捷運局承租並委託甲單位使用。《身心障礙者權益法》中有規定，身心障礙者的人格和權益應該予以保障和尊重，不可以有歧視性的對待，否則可處以罰鍰。乙單位已經違法，我們可以行使公權力開罰，但仍希望可以持續和乙單位溝通以取得共識，讓事件順利落幕。
