- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_34
  section: 1
  number: 34
  type: single
  page: 5
  stem: 日前，我國大法官作出了784號解釋，打破了過去學生與學校強調紀律與服從的「特別權利關係」。本號解釋一改過去認為僅在行政處分會對高中生身分權益的重大影響，才能依法提起行政救濟的傳統思維，主張未來各級學校學生，凡因學校之教育或管理等公權力措施而遭受不法侵害時，便可依法提起，積極落實「有權利即有救濟」的憲法人權。請問：此是屬於哪一種法律解釋？
  options:
  - label: A
    content: 立法解釋
  - label: B
    content: 行政解釋
  - label: C
    content: 司法解釋
  - label: D
    content: 政治解釋
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_35
  section: 1
  number: 35
  type: single
  page: 6
  stem: 依據文中對月經污名的討論，本文以月經為題作為高中學生閱讀素材，可能產生的對抗月經污名效果為何？
  options:
  - label: A
    content: 讓月經成為討論題材，有助於突破月經的相關社會規範
  - label: B
    content: 指出月經廣告不妥之處，提供大眾與媒體正確月經知識
  - label: C
    content: 突顯台灣衛生棉稅率偏高問題，作為政府政策調整依據
  - label: D
    content: 透過介紹國際組織的行動，提升對抗月經貧窮之行動力
  group_stem: 月經是一種生理現象，但同時也並非只是一種生理現象，更牽涉到文化，法律與經濟。近來國際組織指出「月經貧窮」問題值得重視。<u>『許多低度開發國家的女孩，往往因買不起衛生棉，導致月經期間不敢上學，減損受教育機會。』</u>因此人權組織開始在某些國家教導青春期學生自己縫製衛生棉。 月經貧窮的爭議並非僅發生在低度開發國家，近年韓國也出現抗爭活動，韓國衛生棉是其他國家價格的1.5至2倍。2013年至2016年期間衛生棉漲幅是消費者物價指數漲幅的2.5倍。2016年廠商再次漲價20％，引發群眾抗議，並呼籲政府應該停止對衛生棉課稅，別再將衛生棉當成「奢侈品」，而是「必需品」。於此同時，台灣也有團體呼籲：既然我國稅法規定，未經加工之農林漁牧產品與稻米、麵粉等民生必需品免徵營業稅，那麼，衛生棉作為女性生活必需品也應免稅。 不過，在月經貧窮問題討論中，也有學者指出，「只要能購買衛生棉，把月經處理得乾乾淨淨，就沒問題了」這種思考方式，遮掩了更重要的問題：社會對月經的污名。我們可以看到，各文化幾乎都存在避談月經的規範。如臺灣常以「那個」，德文則以「草莓週」代稱月經。此外，臺、英等國電視衛生棉廣告呈現月經時，也往往以藍色液體代替，而非以月經真實顏色。學者指出，此月經污名會讓女性對自己的身體現象產生負面感受，這種污名力量對女性的自我發展甚至更為不利。
