  stem: 羅姆人（Roma），多數人稱他們為吉卜賽人（Gypsy），是一種散布在世界各地的一種流浪民族。歷史上多從事占卜、歌舞等職業。但羅姆人也因為流浪與貧窮的生活所演化出的特殊生活方式與求生方法而長期遭受歧視和迫害。許多國家中羅姆人因為人們的刻板印象被視為次等公民，不論是求職、就學都受到歧視，被迫隱藏身分，這讓他們在社會中更不容易獲取資源或是藉由教育等方式達到階級流動。請問關於羅姆人的敘述，何者較為合理？
