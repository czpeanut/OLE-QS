  type: single
  page: 1
  stem: 當空姐懷孕時，航空公司就會下令停飛，該空姐只好轉服地勤或留職停薪。請問下列敘述何者正確？
  options:
  - label: A
    content: 大肚子空姐有礙公司形象，停飛是正確的
  - label: B
    content: 孕婦不宜飛行，若公司准許轉任地勤，是合宜作為
  - label: C
    content: 性別歧視的作法，應向公平會檢舉
  - label: D
    content: 是航空公司換新空姐的好時機
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 過去我國民法第1089條關於親權之規定，採「父權優先」之原則，司法院大法官於民國83年9月23日對該條文進行解釋，請閱讀下列解釋文，並回答以下問題： 「釋字第365號解釋民法第1089條，關於父母對於未成年子女權利之行使意思不一致時，由父行使之規定部分，與憲法第7條人民無分男女在法律上一律平等，及憲法增修條文第9條第5項消除性別歧視之意旨不符，應予檢討修正，並應自本解釋公布之即日起，至遲於屆滿二年時，失其效力。」這個條文反映出我國早期普遍存在何種社會現象？
  options:
  - label: A
    content: 性別隔離
  - label: B
    content: 性別主流化
  - label: C
    content: 性別階層化
  - label: D
    content: 性別刻板印象
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 行政院在2014年底前通過「警察服制條例修正法案」，未來不再硬性規定警察、消防，及海關等單位的女性員工穿裙子，並在3年內將全面推行各級公私立學校取消女學生的制服裙。對於政府以上作為，最符合聯合國推展的哪一項概念？
  options:
  - label: A
    content: 性別主流化
  - label: B
    content: 性別階層化
  - label: C
    content: 性別社會化
  - label: D
    content: 性別多元化
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 2020年3月，因為新冠病毒疫情嚴重，多所美國大學宣布停課關閉校園，並要求學生返家。不過此舉也造成許多家境不好的學生困擾，許多學生將大學視為第二個家，因為大學住宿相對便宜，還有打工機會，大學生活可以幫助原生家庭減輕負擔，關閉校園代表機會消失。更糟的是校方給的時間過短，多數人並未預期有這筆返家旅費，很難在短時間籌出錢來支應。這些學生將面臨在學校關閉時被趕出校園或是負擔更多貸款的困境。關於以上內容，下列推論何者「較不合理」？
  options:
  - label: A
    content: 非預期的旅費是金錢的負向誘因，可能導致某些大學生不願配合
  - label: B
    content: 對家境不好的學生而言，不論留在學校或返家，機會成本都很大
  - label: C
    content: 關閉校園增加了學生額外的負擔，可能擴大資源分配不均的問題
  - label: D
    content: 在大學中成家是許多學生自我實現的目標，關閉校園會造成阻礙
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列有關我國法律的制定與修正的敘述，何者正確？
  options:
  - label: A
    content: 依憲法規定，總統府與五院皆可提出法律案或修正案
  - label: B
    content: 立法委員經20名以上連署
  - label: C
    content: 法律案必須經過三讀，在三讀會時，除非發現議案內容有互相抵觸，或與憲法，其他法律相牴觸的瑕疵，否則只能做文字的修正
  - label: D
    content: 完成三讀的法律案應由總統公布，倘若總統覺此法窒礙難行，可以直接向立法院要求覆議
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列何者「不符合」我國對於各國社會不利處境群體權利保護的方式？
  options:
  - label: A
    content: 認為目睹家庭暴力的兒少也是家暴受害者，而提供其協助
  - label: B
    content: 《原住民族基本法》保障原住民族對土地及自然資源的權利
  - label: C
    content: 在制定《消除對婦女一切形式歧視公約施行法》後，才推動性別平權運動
  - label: D
    content: 過去『法不入法門』的觀念，因為《家庭暴力防治法》實施後有所改變
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 琉璃蟻大舉入侵中南部的農園、住家，雖然牠們不會危害農作物，也沒有什麼毒性，但卻會造成農作物採收時間加倍、介殼蟲及蚜蟲等害蟲擴張、居家環境受到騷擾等問題。究其原因，檳榔農噴灑農藥是一大關鍵：沒有固定巢穴的琉璃蟻遇到農藥可快速移居他處，等藥效退了，再迅速占領那些別種螞蟻、昆蟲已經死於農藥的土地，造成蟻群大規模擴張。從上文推斷，下列敘述何者最為正確？
  options:
  - label: A
    content: 檳榔農噴灑農藥的私人成本大於外部成本
  - label: B
    content: 檳榔農噴灑農藥的社會成本大於外部成本
  - label: C
    content: 檳榔農噴灑農藥的私人成本大於社會成本
  - label: D
    content: 檳榔農噴灑農藥的外部成本大於社會成本
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 關於立法院之職權行使，下列敘述何者正確？
  options:
  - label: A
    content: 法律案須經立法委員15人以上連署，才能提出委員案
  - label: B
    content: 只有法律案需要經過讀書會程序
  - label: C
    content: 為使會議慎重其事，避免提案浮濫，議案一經排入議程，即不得撤回
  - label: D
    content: 因第三讀會只得為文字之修正，並應將議案全案付表決，故不得提復議動議
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 《兒童權利公約》中規定：「兒童應有自由表達意見之權利，該權利應包含以言詞、書寫或印刷、藝術型態或是透過兒童自己決定媒介，不受國境限制地尋取、接受、傳達任何訊息與意思，在影響到他人的權利、名譽及國家安全、公共秩序、公共衛生與道德實應受到限制。」揭示了成人應該尊重兒少的意願並且教導兒少尊重他人。我國有將《兒童權利公約》國內法化，因此我國人民也應該遵守該公約的內涵，請問下列何者符合《兒童權利公約》的意旨？
  options:
  - label: A
    content: 女童在媽媽告知會冷之後，表示不願穿外套，媽媽尊重其意見未讓其穿外套
  - label: B
    content: 幼兒園超收學童，並將學童關在密室內上課，若是想要出去會被懲罰或責罵
  - label: C
    content: 國中生在網路上散播關於同學的不實言論，為尊重兒少表意自由，不應制止
  - label: D
    content: 為了小孩的未來著想，在大考成績出爐後，志願排序應該是由家長代為填寫
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 我國法律案由立法院負責制定，法律草案送進立法院必須經過委員會的審查、三讀程序後通過。請問：在哪一個程序將對草案進行深入討論、修正、重付審查、撤銷、撤回，全部作成決議？
  options:
  - label: A
    content: 一讀
  - label: B
    content: 二讀
  - label: C
    content: 三讀
  - label: D
    content: 委員會
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 2020年，墨西哥在一周內發生兩起環保人士身亡事件，兩人均是羅薩里奧帝王蝶生態保留區的工作人員。在當地，農業和林業是讓許多人維繫家計的重要產業，但是近年環保意識抬頭，卻讓不少當地人生計受到嚴重影響。環保人士和當地農、林業者因而產生利益拉鋸，許多環保人士成為犯罪事件的犧牲者。讓當地許多環保人士感到恐懼，害怕自己成為兇手的下一個目標。關於此事，下列敘述何者較為合理？
  options:
  - label: A
    content: 當地農業、林業者的開發行動，對帝王諜的保育工作會造成外部成本
  - label: B
    content: 帝王蝶保育無法帶來任何金錢收穫，相較於農、林業，較不具備效益
  - label: C
    content: 環保人士死亡事件，對於想從事相關工作的人而言，是金錢的負向誘因
  - label: D
    content: 在生態保留區工作多是為了保育帝王諜，因此僅具備非金錢的正向誘因
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 電影《82年生的金智英》描述現一名1982年出生的韓國女子，在成長歷程中遇到的種種不公平待遇，例如：在成長過程中家中獨子的弟弟可以獲得所有最好的資源與疼愛、在公車上遭受性騷擾，婚後明明有著同等學歷薪資卻比配偶低、因為生子被迫離職成為家庭主婦，最終導致其罹患精神疾病而失去自我等。該部電影引起許多女性的共鳴，被認為是一部「女權電影」，指出韓國的「厭女文化」及社會氛圍，但也有人認為那是女性過度反應，男性是受到刻部電影汙名的受害者。請問關於該部電影的推論，何者較「不適當」？
  options:
  - label: A
    content: 厭女文化影響韓國大眾心裡，造成女性受到不公平待遇，進而影響自我實現
  - label: B
    content: 厭女文化根植人心，形成內在的社會控制，認為不公平待遇是理所當然結果
  - label: C
    content: 從在家中的待遇及職場上的薪資不平等可以發現，厭女文化影響了資源分配
  - label: D
    content: 該名女子無法自我實現是因為精神疾病，其他問題則是個人選擇的私人成本
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 黎巴嫩詩人紀伯倫在20世紀初透過詩詞，闡述孩子是獨立的個體，並非附屬於任何人，每個孩子都有自己的思想、性格以及人生，然直至今日，仍有許多父母將自己的理念、夢想加諸於子女，以孝順、教養之名，行情感勒索之實，更甚者以體罰手段迫使子女聽從，不過，隨著人們察覺體罰可能伴隨著其他問題，父母的教養方式也在逐步改變，請問下列關於體罰孩童的敘述，何者「錯誤」？
  options:
  - label: A
    content: 為了管教而傷害孩童的身心健康，有違人人平等精神的可能
  - label: B
    content: 自瑞典立法禁止體罰後，引起多國效法，顯示禁止體罰是全球趨勢
  - label: C
    content: 兒童權利公約明定教育應尊重孩童的人性尊嚴，與上文的主旨相似
  - label: D
    content: 為管教小孩的體罰，是正向誘因，但可能衍生心理創傷，才加以禁止
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 臺灣警察體系中設有「警政績效制度」，最初設置目的是為了提高公務體系的警察機關能夠更有動機、更勤奮的執行勤務，績效好的警察可以獲得獎勵，但績效差的警察可能會受到懲處。雖然最初立意良善，但卻也造成明明無案件，卻要警察達到績效的窘況。更糟的是，有些警察還透過偽造文書等違法的行徑製造假案件「衝業績」，造成反效果。請問關於警政績效制度的推論，何者較為合理？
  options:
  - label: A
    content: 警政績效制度中的獎勵是一種鼓勵警察執行勤務的正向誘因
  - label: B
    content: 績效差的警察會受到懲處，是社會規範造成的資源分配問題
  - label: C
    content: 警察透過犯罪製造假業績是因為績效制度中的負向誘因過強
  - label: D
    content: 警察偽造文書的原因是因為偽造文書罪遏止犯罪的誘因太強
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 近年來，因為多位議員指出中小學課程中，有不具備教師資格的團體以志工名義進入校園教授「生命教育」課程，用隱晦的方式宣傳特定宗教觀點，引發「宗教進入校園」的疑慮。對此有教師指出，因為學校輔導老師編制不足，許多非輔導專業的老師被迫教授學生輔導課程，此時校外團體備妥教材，聲稱可以協助老師上課，便成老師們的重要「資源」。請問關於此事件，下列推論何者較合適？
  options:
  - label: A
    content: 長期的教育課程形成內在的社會控制，也就是社會化，產生特定價值觀
  - label: B
    content: 提供教材與協助老師輔導課程，是對老師接受此類團體的金錢正向誘因
  - label: C
    content: 老師對教授非專業內容感到不知所措，因此是老師自行授課的負向誘因
  - label: D
    content: 校外團體進入校園授課，對學校中的所有成員而言，都會造成外部成本
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 沙烏地阿拉伯政府過往要求餐廳須設「男性」及「女性與家庭」走的兩種入口，而咖啡廳座位分成家庭區和單身區，「單身或男性親屬陪同的女性」必須入座家庭區；「單身男性」則須坐在單身區。有的餐廳還為女性提供單獨入口，讓單身男性無法看見女性。這些規範目前已逐漸放寬，比起過往較不嚴格執行。根據上述判斷，下列何者正確？
  options:
