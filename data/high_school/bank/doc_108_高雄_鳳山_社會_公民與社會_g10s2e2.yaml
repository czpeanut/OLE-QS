  group_stem: 資料一：1973年，亞洲水泥股份有限公司（亞泥）於花蓮縣新城鄉新城村建廠挖礦，並於2016年11月15日向經濟部申請採礦權展延，並由經濟部審查通過。然而亞泥與當地太魯閣族人之間長期存在土地爭權，當地太魯閣族人認為，亞泥侵占傳統領域且採礦破壞當地環境。因此當地居民在向經濟部提起訴願遭駁回後，因其耕作權、居住安全等權利遭損害，向臺北高等行政法院提起行政訴訟。 資料二：監察院也於2017年指出礦業法不妥適之處：(1)霸王條款：2003年《礦業法》修法時，增訂「設定礦業權後的礦區，如被劃設保護區而有被駁回礦業權的情形，劃設機關必須補償礦業者的損失」，此修法導致各行政機關為了避免負擔補償之龐大費用，不願也不敢劃設禁止採礦之區域。(2)忽視原住民族權益：未明訂在進行礦業權設定或展限時，應實踐(甲)第21條，徵得原住民族同意。 資料三：2016年民間團體草擬了《礦業法》的草案，希望能夠推動《礦業法》的修法，不過到2019年年底《礦業法》草案仍在等待黨團協商，並未修正通過。 資料四：臺北高等行政法院於2019年7月11日宣判並發布新聞稿，說明其判決理由要旨，法官認為，雖然經濟部早在《甲》制定前，即依當時法律同意亞泥的申請，且《甲》中僅指出該法通過後申請礦權的程序，而未提及關於舊礦權展延的相關事宜，但立法院制定《甲》是為了貫徹《乙》中對於原住民文化，政治參與權利保障的精神，以及公民與政治權利國際公約中應特別保障少數群體權利的規定，因此應在礦權展延時給予當地原住民族群表達意見的機會。而亞泥與經濟部並未落實正當程序，因此判決亞泥與經濟部敗訴，並撤銷其採礦權展延。
