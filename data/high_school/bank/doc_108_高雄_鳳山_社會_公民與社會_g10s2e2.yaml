  stem: 根據上述資料，關於性傾向的敘述，下列何者正確？
  options:
  - label: A
    content: 異性戀是情慾對象與自己相同生物性別
  - label: B
    content: 同志專指喜歡男扮女裝或女扮男裝的人
  - label: C
    content: 雙性戀是指愛慕或性幻想對象，跨越單一性別的界線
  - label: D
    content: 同性戀是一種心理上、主觀的性別認同
  group_stem: 資料一：第七屆臺灣同志遊行於2009年10月31日在臺北市登場，主題是「同志愛很大」，強調同志存在於各行各業，同樣展現對社會的愛與貢獻，卻始終無法享受跟異性戀者相同的權利。遊行隊伍在凱達格蘭大道集合，沿途氣氛熱鬧，遊行者臉上畫著代表同志的彩虹圖飾，參與人數約計兩萬人，刷新亞洲紀錄，不少來自日本、香港、新加坡等鄰國，也有歐美人士共襄盛舉。資料二：為表達「反對同志遊行愈辦愈大」的立場，同一時間在自由廣場，基督教界發起千人遊行，以「上帝的愛超越同志愛」為主題，強調上帝也愛同志，但不贊成同志愛，也擔心同志有「異」見，行前教育還要求教友遇狀況要「不出言、不回手、不理會」。
