  stem: 表為甲、乙、丙三個國家在各教育階段女性教師所占百分比的調查結果。從性別關係及平等的觀點來分析表中數據，下列何者敘述較為正確？
  options:
  - label: A
    content: 各國學前教育多為女性教師，是因為男性較不擅長照顧幼兒所致
  - label: B
    content: 教育階段愈高則女性教師百分比愈少，反映出性別不平等的現象
  - label: C
    content: 丙國在各階段女性教師百分比皆為最低，顯示該國女性受教育機會偏低
  - label: D
    content: 甲國在各階段女性教師百分比均高50％，顯示該國女性較適合從事教職
