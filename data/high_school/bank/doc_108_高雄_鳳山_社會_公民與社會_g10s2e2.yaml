  group_stem: 綠色和平組織志工，在超市的Oreo商品，貼上「Oreo終止雨林破壞，拒絕毀林棕櫚油」的貼紙，希望Oreo所屬的餅乾製造商立刻停止與棕櫚油貿易商Wilmar的合作，拒絕購買破壞紅毛猩猩棲地的棕櫚油。綠色和平所發表的報告指出，棕櫚油貿易商Wilmar在過去兩年間破壞紅毛猩猩棲息地的面積約是2.5萬公頃。而科學家也提出警告，對雨林的破壞，將會對紅毛猩猩等瀕臨絕種的生物帶來生存威脅。在全球廣大消費者的施壓下，全球有超過百個志工團體聲援「請Oreo停止使用毀林棕櫚油」的行動。
