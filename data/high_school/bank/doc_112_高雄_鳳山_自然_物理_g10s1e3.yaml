  answer_source: answer_key
  explanation: '由 <u>E</u>＝h．<u>f</u> ∴h 的單位為焦耳．秒

    ↓ ↓

    （焦耳）（1∕秒）

    故選(D)。'
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 光波通過下列哪一區域時的速度最快？
  options:
  - label: A
    content: 水
  - label: B
    content: 空氣
  - label: C
    content: 油
  - label: D
    content: 玻璃
  - label: E
    content: 牆壁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '光經過介質時，速度變慢。

    在真空中、空氣（折射率接近 1）的速度量值為 3×$10^{8}$ m∕s，故選(B)。'
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 運動中的粒子具有波動性理論，是哪位科學家提出？
  options:
  - label: A
    content: 牛頓
  - label: B
    content: 愛因斯坦
  - label: C
    content: 波耳
  - label: D
    content: 德布羅意
  - label: E
    content: 密立坎
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)牛頓：萬有引力定律。

    (B)愛因斯坦：相對論、光電效應方程式、光量子論。

    (C)波耳：氫原子假設。

    (D)德布羅意：提出運動中的粒子具波動性。

    (E)密立坎：油滴實驗、光量子實驗（驗證愛因斯坦光電效應方程式）。'
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1868 年法國天文學者，發現來自太陽的光譜有幾道特殊的暗紋，推斷是新元素的特性光譜，這個新元素就以太陽的希臘文命名為氦。已知太陽光譜會出現上述暗紋的原因，是因為氦原子會吸收特定頻率的入射光子所造成，則下列敘述何者正確？
  options:
  - label: A
    content: 某元素光譜的暗紋頻率與氦原子光譜的暗紋頻率相同，則此元素一定是氦
  - label: B
    content: 會出現暗紋是因為氦原子會將特定頻率光子繞射到不同的方向
  - label: C
    content: 氦原子光譜的暗紋頻率與氫原子光譜的暗紋頻率完全相同
  - label: D
    content: 氦原子光譜的暗紋頻率與氖原子光譜的暗紋頻率完全相同
  - label: E
    content: 會出現暗紋其實就是因為氦原子會被入射光游離
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)(E)元素光譜上的暗紋，代表此頻率的光被此元素吸收。

    (C)(D)不同元素有不同的吸收（發射）光譜，不同元素其吸收光譜波長（頻率）不同。'
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 若以電子的運動討論物質波之含意，下列敘述何者正確？
  options:
  - label: A
    content: 電子運動時，可由牛頓運動定律預測出某時刻的位置
  - label: B
    content: 電子運動時，其出現的位置，是一種機率分布
  - label: C
    content: 電子運動時，其位置會作規律性的週期變化
  - label: D
    content: 電子運動時，會製造電磁波輻射
  - label: E
    content: 物質波需要介質傳遞
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)電子運動時，無法準確預測正確位置，此為測不準原理。

    (B)(C)物質波為機率波。

    (D)電子運動呈物質波，在核外形成駐波，不輻射能量。

    (E)電子運動時呈現出波的性質，可以在真空行進，故可不需介質。'
