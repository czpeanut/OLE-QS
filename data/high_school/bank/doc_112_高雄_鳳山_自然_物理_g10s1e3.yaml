- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '以能量為 4.5 eV 的紫外線，分別入射到右表的金屬中，則有哪些金屬可產生光電效應？

    | 元 素 | 鉀 | 鈉 | 鋰 | 鋁 | 鐵 | 金 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 功函數 （eV） | 2.3 | 2.8 | 2.9 | 4.3 | 4.7 | 5.1 |'
  options:
  - label: A
    content: 鉀、鈉
  - label: B
    content: 鉀、鈉、鋰
  - label: C
    content: 鉀、鈉、鋰、鋁
  - label: D
    content: 鉀、鈉、鋰、鋁、鐵
  - label: E
    content: 鉀、鈉、鋰、鋁、鐵、金
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '紫外線能量 ≥ 功函數，可產生光電效應。

    鉀、鈉、鋰、鋁皆可產生光電效應；鐵、金的功函數＞紫外線能量，無法產生光電效應，故選(C)。'
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 恆星表面近似黑體，依據黑體輻射，任何有溫度的物體都會自行放射各種不同波長的電磁波，其輻射強度與波長、表面溫度的關係如右圖所示，波長 400 ～ 700 nm 屬於可見光。根據以上敘述與右圖，判斷以下選項何者<u>錯誤</u>？
  options:
  - label: A
    content: 表面溫度 8000 K 的恆星，只放射波長 400 nm 的電磁波
  - label: B
    content: 如果恆星表面溫度為 3000 K，則強度最強波段的波長比 700 nm 長
  - label: C
    content: 我們看到的月光都是反射自太陽光，但月球本身也會放射其他波段的電磁波
  - label: D
    content: 在完全沒有任何燈源的暗室內，可以透過紅外線攝影機拍攝到裡面的人
  - label: E
    content: 太陽的表面溫度接近 6000 K，及某顆表面溫度高達 16000 K 的恆星，兩者皆可放射可見光
  assets:
  - key: s1_9_f1
    kind: figure
    file: doc_112_高雄_鳳山_自然_物理_g10s1e3/s1_9_f1.png
    crop:
      page: 2
      rect:
      - 349.7
      - 188.0
      - 564.45
      - 308.9
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 8000 K 的恆星，400 nm 為最大輻射強度對應的波長，仍有其他波長的電磁波。

    (B)依據題圖，溫度愈高，輻射強度對應的波長會愈短。

    ∵4000 K 對應 700 nm

    ∴3000 K 對應的波長會大於 700 nm

    (C)月亮不會發光，地球上看到月亮的光來自反射光（太陽）。

    溫度＞絕對溫度，會輻射出電磁波，月亮本身也會放射其他波段的電磁波，但不是可見光（例如：紅外線）。

    (D)人有溫度，會產生熱輻射，所以可被紅外線攝影機拍攝。

    例如：COVID-19 流行期間，全臺灣多所學校門口皆有架設紅外線掃描量測溫度。

    (E)由輻射強度與波長關係圖，可知波長為連續，包含可見光波段。'
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 進行光電效應實驗時，若入射光的頻率小於底限頻率，下列何種方法可產生光電效應？
  options:
  - label: A
    content: 增加照射時間
  - label: B
    content: 增加入射光的強度
  - label: C
    content: 同時增加入射光的強度與照射時間
  - label: D
    content: 不管光的強度多大或照射時間多久，都無法產生光電子
  - label: E
    content: 更換實驗人員
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 若入射光頻率小於底限頻率，不論提高照光強度或拉長照射時間，都無法產生光電子，故選(D)。
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 以不同光束照射某金屬靶而產生光電子，當入射光之波長愈短時，光電子的動能為何？
  options:
  - label: A
    content: 愈大
  - label: B
    content: 愈小
  - label: C
    content: 有時候大，有時候小
  - label: D
    content: 恆為定值
  - label: E
    content: 與波長無關
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '有產生光電子，當入射光波長愈短 ⇒ 入射光頻率愈大 ⇒ 入射光能量愈大

    而金屬靶不變（功函數相同），當入射光能量愈大 ⇒ 光電子的動能愈大

    故選(A)。'
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
