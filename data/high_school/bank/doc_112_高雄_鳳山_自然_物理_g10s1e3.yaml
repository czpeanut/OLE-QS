- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在直線波的觀察中，若 P、Q 兩點落在同一個波前上，則下列敘述何者正確？
  options:
  - label: A
    content: P、Q 兩點必為波谷
  - label: B
    content: P、Q 兩點必為波峰
  - label: C
    content: P、Q 兩點的振動位移不一定相同
  - label: D
    content: P、Q 兩點的振動速度不一定相同
  - label: E
    content: P、Q 兩點振動方向一定相同
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 波前上的 P、Q 兩點，振動方向、振動位移、振動速度皆相同，但不一定是在波谷或波峰，故選(E)。
- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列何者為普朗克常數的單位？
  options:
  - label: A
