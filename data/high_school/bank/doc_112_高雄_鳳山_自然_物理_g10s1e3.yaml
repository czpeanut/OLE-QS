- id: doc_112_高雄_鳳山_自然_物理_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 電子束通過雙狹縫的實驗，實驗結果顯示偵測器測得電子數目分布為干涉條紋狀的圖樣。關於此實驗結果，下列敘述何者正確？
  options:
  - label: A
    content: 落在干涉條紋暗紋的電子，其通過狹縫時的速率均比落在亮帶的電子為小
  - label: B
    content: 電子數目出現干涉條紋狀的分布，是電子之間的靜電力所造成
  - label: C
    content: 本實驗結果闡釋了電子具有粒子性
  - label: D
    content: 電子的速度不同會造成干涉條紋圖樣的改變
  - label: E
    content: 可確定每個電子由哪一個狹縫通過
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)落在干涉條紋暗紋的電子，其通過狹縫時的「機率」比落在亮帶的電子小。

    (B)機率分布，亮帶代表電子出現機會高，暗紋代表電子出現機會低。

    (C)本實驗結果闡釋了電子具有波動性。

    (D)電子的速度愈快（粒子性強）⇒ 波長變短（波動性弱）

    電子的速度愈慢（粒子性弱）⇒ 波長變長（波動性強）

    而亮帶、暗紋間距受波長影響

    波長愈長 ⇒ 亮帶、暗紋間距愈大

    波長愈短 ⇒ 亮帶、暗紋間距愈小

    (E)無法使用任何方式確定電子由哪一個狹縫通過。'
