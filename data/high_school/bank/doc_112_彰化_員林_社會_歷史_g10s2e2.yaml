  stem: 以上三則資料，作為近代以前中國社會發展，說明唐宋時期對<u> 甲 </u>的依賴？
  group_stem: ◎資料一：唐德宗的時候因為藩鎮瓶亂，長安被包圍，缺糧超過十天，當糧食籍貫通南北交通的(甲)抵達的消息傳來時，唐德宗感動的對太子高呼：「米已至陜，吾父子得生矣。」六軍軍士得知這一情况，「皆呼萬歲」 資料二：唐代權德輿<u>論江淮水災上疏</u>：「江東諸州，業在田畝，每一歲善熟，則旁資數道……賦取所資，漕輓所出，軍國大計，仰於江淮。」 資料三：宋太宗淳化二年(991年)，汴渠決堤，太宗親督修理，曰：「東京養兵數十萬，居人百萬家，天下轉漕，仰給在此一渠，朕安得不顧！」
