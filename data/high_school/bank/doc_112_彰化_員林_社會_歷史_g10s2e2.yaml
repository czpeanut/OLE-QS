  stem: 1960年代，學者巴格内(D.J.Bagne)提出「推拉理論」來解釋人口的移動，並認為「移出地」的不利條件就成為「推力」，「移入地」的有利條件就成為「拉力」。人口的移動就是由於兩股力量的拉扯所決定。學者李(E.S.Lee)更在巴格內的理論基礎之上，提出「移出地」和「移入地」實際上都既有拉力也有推力；同時又補充「中間障礙」的因素。居民究竟是否會移動實際上是對於三者的價值判斷；換言之，移動是否成行，就是三者綜合作用的產物。 根據文章內容對於「推拉理論」所做出的說明。請問，關於中國境內漢人的開發，下列敘述何者最為適切？
  options:
  - label: A
    content: 蘇常地區轉作棉花產生推力
  - label: B
    content: 湖廣地區與潮爭地，增加可耕地產生拉力
  - label: C
    content: 流寇攻陷四川產生拉力
  - label: D
    content: 華北地區因較安定產生拉力
  tags:
