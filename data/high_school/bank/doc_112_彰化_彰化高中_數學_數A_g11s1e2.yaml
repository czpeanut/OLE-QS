  explanation: '所求為$2^{2\log 5}\times (2^{- 1})^{- 2\log 2} + 5^{\log _{5}3} +(3^{3})^{\frac{\log 4}{\log 9}} +(3^{- 2})^{- 2\log _{3}2} + 4^{\frac{1}{\frac{\log 4}{\log 5}}}$

    ＝$2^{2 (\log 5 +\log 2)} + 3 +(3^{3})^{\frac{2\log 2}{2\log 3}} + 2^{4} + 4^{\frac{\log 5}{\log 4}}$

    ＝$2^{2} + 3 +(3^{3})^{\log _{3}2} + 2^{4} + 4^{\log _{4}5}$

    ＝$2^{2}$＋3＋$2^{3}$＋$2^{4}$＋5

    ＝36'
