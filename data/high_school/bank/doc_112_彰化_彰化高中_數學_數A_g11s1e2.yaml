- id: doc_112_彰化_彰化高中_數學_數A_g11s1e2_s2_5
  section: 2
  number: 5
  type: fill
  page: 1
  stem: 已知 $log_{3}$（$3^{x}$－243）＝$\frac{x}{2}+ 2 +\log _{3}2$，試求 x＝＿＿＿＿。
  explanation: '∵$log_{3}$（$3^{x}$－243）＝$\frac{x}{2}+ 2 +\log _{3}2$

    ＝$\log _{3}3^{\frac{x}{2}} +\log _{3}9 +\log _{3}2$

    ＝$\log _{3} (18 \cdot 3^{\frac{x}{2}})$

    ∴$3^{x}$－243＝$18 \cdot 3^{\frac{x}{2}}$

    $\Rightarrow3^{x} - 18 \cdot 3^{\frac{x}{2}} - 243$＝0

    $\Rightarrow(3^{\frac{x}{2}} - 27)(3^{\frac{x}{2}} + 9)$＝0

    $\Rightarrow3^{\frac{x}{2}}$＝27 或－9（不合）

    $\Rightarrow3^{\frac{x}{2}}$＝$3^{3}$

    $\Rightarrow\frac{x}{2}$＝3

    $\Rightarrow$x＝6'
- id: doc_112_彰化_彰化高中_數學_數A_g11s1e2_s2_6
  section: 2
  number: 6
  type: fill
  page: 2
  stem: 試求不等式$1 -\log _{\frac{1}{4}} (x - 1)>\log _{2} (x - 9)$的解為＿＿＿＿。
  explanation: '由真數＞0

    $\Rightarrow\begin{cases}x - 1 > 0 \\ x - 9 > 0\end{cases}$可知 x＞9

    又$1 -\log _{\frac{1}{4}} (x - 1)$＞$log_{2}$（x－9）

    $\Rightarrow\log _{2}2 -\frac{\log (x - 1)}{\log \frac{1}{4}}$＞$\frac{\log (x - 9)}{\log 2}$

    $\Rightarrow\frac{\log 2}{\log 2}+\frac{\log (x - 1)}{2\log 2}$＞$\frac{\log (x - 9)}{\log 2}$

    $\Rightarrow\log 2 +\frac{1}{2}\log (x - 1)$＞log（x－9）

    $\Rightarrow\log (2 (x - 1)^{\frac{1}{2}})$＞log（x－9）

    $\Rightarrow2 (x - 1)^{\frac{1}{2}}$＞x－9

    $\Rightarrow$ 4（x－1）＞（x－9）$^{2}$＝$x^{2}$－18x＋81

    $\Rightarrow$ $x^{2}$－22x＋85＜0

    $\Rightarrow$（x－5）（x－17）＜0

    $\Rightarrow$ 5＜x＜17

    又 x＞9

    故 9＜x＜17'
- id: doc_112_彰化_彰化高中_數學_數A_g11s1e2_s2_7
  section: 2
  number: 7
  type: fill
  page: 2
  stem: 已知 f（x）＝$- x +\log \left( \frac{1 - x}{x + 1} \right)$，試求$f \left( -\frac{1}{2023} \right) + f \left( \frac{1}{2023} \right)$＝＿＿＿＿。
  explanation: 'f（t）＋f（－t）＝$\left( -t +\log \frac{1 -t}{t + 1} \right) + \left( t +\log \frac{1 +t}{-t + 1} \right)$

    ＝$\log \left( \frac{1 -t}{t + 1}\times \frac{1 +t}{-t + 1} \right)$

    ＝log1＝0

    故$f \left( -\frac{1}{2023} \right) +f \left( \frac{1}{2023} \right) = 0$'
- id: doc_112_彰化_彰化高中_數學_數A_g11s1e2_s2_8
  section: 2
  number: 8
  type: fill
  page: 2
  stem: 如右圖，已知$\frac{3}{4}\vec{AP}$＝$\vec{AB}$＝$3\vec{AQ}$，則$\vec{OP}$＝$x\vec{OA}+ y\vec{OB}$，試求數對 （x，y）＝＿＿＿＿。
  assets:
  - key: s2_8_f1
    kind: figure
    file: doc_112_彰化_彰化高中_數學_數A_g11s1e2/s2_8_f1.png
    crop:
      page: 2
      rect:
      - 466.8
      - 180.35
      - 564.3
      - 250.2
  explanation: '∵$\frac{3}{4}\vec{AP}$＝$\vec{AB}$＝$3\vec{AQ}$

    ∴$\overline{AQ} : \overline{QB} : \overline{BP}$＝1：2：1

    則$\vec{OB}$＝$\frac{3}{4}\vec{OP}+\frac{1}{4}\vec{OA}$

    $\Rightarrow\vec{OP}$＝$-\frac{1}{3}\vec{OA}+\frac{4}{3}\vec{OB}$

    故數對（x，y）＝$\left( -\frac{1}{3} , \frac{4}{3} \right)$

    9.1024－$2^{y}$＝$2^{y} \cdot \log _{\frac{1}{4}} (x)\Rightarrow$1024＝$2^{y} \left( 1 +\frac{\log x}{\log \frac{1}{4}} \right)$ ……………………①

    $\Rightarrow$1024＝$2^{y} \left( \frac{\log \frac{1}{4}}{\log \frac{1}{4}}+\frac{\log x}{\log \frac{1}{4}} \right)$

    $\Rightarrow$1024＝$2^{y} \left( \frac{\log \left( \frac{1}{4}x \right)}{\log \frac{1}{4}} \right)$ …………………②

    2048－$2^{y}$＝$2^{y} \cdot \log _{\frac{1}{4}} (x - 1)\Rightarrow$2048＝$2^{y} \left( 1 +\frac{\log (x - 1)}{\log \frac{1}{4}} \right)$

    $\Rightarrow$2048＝$2^{y} \left( \frac{\log \frac{1}{4}}{\log \frac{1}{4}}+\frac{\log (x - 1)}{\log \frac{1}{4}} \right)$

    $\Rightarrow$2048＝$2^{y} \left( \frac{\log \left( \frac{1}{4}x -\frac{1}{4} \right)}{\log \frac{1}{4}} \right)$……………③

    由$\frac{③}{②}$得 2＝$\frac{\log \left( \frac{1}{4}x -\frac{1}{4} \right)}{\log \left( \frac{1}{4}x \right)}$

    $\Rightarrow2\log \left( \frac{1}{4}x \right)$＝$\log \left( \frac{1}{4}x -\frac{1}{4} \right)$

    $\Rightarrow\log \left( \frac{1}{4}x \right) ^{2}$＝$\log \left( \frac{1}{4}x -\frac{1}{4} \right)$

    $\Rightarrow\left( \frac{1}{4}x \right) ^{2}$＝$\frac{1}{4}x -\frac{1}{4}$

    $\Rightarrow$ $x^{2}$－4x＋4＝0$\Rightarrow$（x－2）$^{2}$＝0$\Rightarrow$ x＝2

    代回①得

    1024＝$2^{y} \left( 1 +\frac{\log 2}{- 2\log 2} \right)$＝$\frac{1}{2} \cdot 2^{y}$

    $\Rightarrow$ y＝11

    故數對（x，y）＝（2，11）

    10.∵$\vec{AO}$＝$\frac{1}{2}\vec{AB}+\frac{1}{2}\vec{AC}$

    ＝$\frac{1}{2} (m\vec{AM})+\frac{1}{2} (n\vec{AN})$

    ＝$\frac{m}{2}\vec{AM}+\frac{n}{2}\vec{AN}$

    又 O，M，N 三點共線

    ∴$\frac{m}{2}+\frac{n}{2}$＝1

    $\Rightarrow$ m＋n＝2

    11.令$\vec{OA}$和$\vec{OC}$夾角為θ，且 0°$\leq$θ$\leq$120°

    ∵$\vec{OC}$＝$x\vec{OA}+y\vec{OB}$

    $\begin{cases}\vec{OA} \cdot \vec{OC}= x ∣ \vec{OA} ∣^{2} + y\vec{OA} \cdot \vec{OB} \\ \vec{OB} \cdot \vec{OC}=x\vec{OA} \cdot \vec{OB}+y ∣ \vec{OB} ∣^{2}\end{cases}$

    $\Rightarrow\begin{cases}1 \cdot 1 \cdot \cos \theta = x \cdot 1^{2} + y \cdot 1^{2} \cdot \cos 120^{^{\circ}} \\ 1 \cdot 1 \cdot \cos (120^{^{\circ}}-\theta )= x \cdot 1^{2} \cdot \cos 120^{^{\circ}} + y \cdot 1^{2}\end{cases}$

    $\Rightarrow\begin{cases}x -\frac{1}{2}y =\cos \theta \\ -\frac{1}{2}x + y =\cos (120^{^{\circ}}-\theta )\end{cases}$

    $\Rightarrow\begin{cases}2x - y = 2\cos \theta \\ x - 2y =- 2\cos (120^{^{\circ}}-\theta )\end{cases}$

    $\Rightarrow$x＋y＝（2x－y）－（x－2y）

    ＝2 cosθ＋2 cos（120°－θ）

    ＝$2\cos \theta + 2 \left( \frac{- 1}{2}\cos \theta +\frac{\sqrt{3}}{2}\sin \theta \right)$

    ＝$\cos \theta + \sqrt{3}\sin \theta$

    ＝2 sin（30°＋θ）

    當 θ＝60° 時，x＋y 有最大值 2

    12.∵$c^{5}$，$d^{5}$ 皆為正整數

    ∴$log_{a}$b＋$log_{b}$a 亦為正整數

    令 b＝$a^{k}$

    ∵a，b 為正整數

    ∴k 為正整數

    $\Rightarrowlog_{a}$b＋$log_{b}$a＝$k +\frac{1}{k}$為正整數

    則 k 必為 1

    故 a＝b

    又 $log_{a}$b＋$log_{b}$a＝1＋1＝$c^{5}$＋$d^{5}$

    $\Rightarrow$c＝d＝1

    ∵a＋b＋c＋d＝112

    ∴a＝b＝55

    故 $a^{c}$＋$d^{b}$＝$55^{1}$＋$1^{55}$＝56'
