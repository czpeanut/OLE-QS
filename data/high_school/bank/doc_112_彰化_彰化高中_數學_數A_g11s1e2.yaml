- id: doc_112_彰化_彰化高中_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 試問下列敘述何者正確？
  options:
  - label: A
    content: 若 0＜a＜1，0＜b 且 $a^{b}$＝$b^{a}$，則 a＝b
  - label: B
    content: log2023＜log7×2 log17
  - label: C
    content: 若 $log_{a}$2＜$log_{b}$2＜0，則 0＜a＜b＜1
  - label: D
    content: 已知四邊形 ABCD 為平行四邊形且 O 為平面任意一點，則 $\vec{OA}-\vec{OB}+\vec{OC}-\vec{OD}$＝$\vec{0}$
  - label: E
    content: 設 a，b 為非零向量，若α，β為實數且$\alpha \vec{a}+\beta \vec{b}$＝$\vec{0}$，則$\vec{a}$平行$\vec{b}$
  explanation: '(A)○：∵$a^{b}$＝$b^{a}$

    ∴$(a^{b})^{\frac{1}{ab}} =(b^{a})^{\frac{1}{ab}}\Rightarrowa^{\frac{1}{a}} =b^{\frac{1}{b}}$

    若 a≠b，不失一般性設 a＜b$\Rightarrow\frac{1}{a}>\frac{1}{b}$

    若 b＞1，則 $a^{b}$＜1，$b^{a}$＞1$\Rightarrow$與 $a^{b}$＝$b^{a}$ 矛盾

    若 0＜b＜1，則$a^{\frac{1}{a}}<b^{\frac{1}{a}}<b^{\frac{1}{b}}\Rightarrow$與$a^{\frac{1}{a}} =b^{\frac{1}{b}}$矛盾

    故原假設錯誤，即 a＝b

    (B)╳：log2023＝log（7×$17^{2}$）＝log7＋$log17^{2}$

    ∵0＜log7＜1，$log17^{2}$＞1

    log7×$log17^{2}$－log7－$log17^{2}$＋1＝（log7－1）（$log17^{2}$－1）＜0

    $\Rightarrow$log7×$log17^{2}$＋1＜log7＋$log17^{2}$＝log2023

    $\Rightarrow$log7×2 log17＜log2023

    (C)╳：∵$log_{a}$2＝$\frac{\log 2}{\log a}$，$log_{b}$2＝$\frac{\log 2}{\log b}$

    ∴$\frac{\log 2}{\log a}<\frac{\log 2}{\log b}< 0$

    $\Rightarrow\frac{1}{\log a}<\frac{1}{\log b}< 0$

    $\Rightarrow$logb＜loga＜0

    $\Rightarrow$0＜b＜a＜1

    (D)○：$\vec{OA}-\vec{OB}+\vec{OC}-\vec{OD}$＝$\vec{BA}+\vec{DC}$＝$\vec{0}$

    (E)╳：反例：α＝0，β＝0，$\vec{a}$＝（1，2），$\vec{b}$＝（3，4）

    則 $\alpha \vec{a}+\beta \vec{b}$＝$\vec{0}$

    但$\vec{a}$，$\vec{b}$不平行

    故選(A)(D)'
- id: doc_112_彰化_彰化高中_數學_數A_g11s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: '已知 A＝（log125，1），B＝$(- 3 \log 2 , \log _{\frac{1}{2}}8)$，C＝（log4，－1），則：

    (1) $\vec{AB}$＝＿＿＿＿。

    (2)｜$\vec{AB}$｜＝＿＿＿＿。

    (3) 若 D 點滿足$\vec{DA}-\frac{1}{3}\vec{DB}+\vec{DC}$＝$\vec{0}$，則 D 點坐標為＿＿＿＿。'
  explanation: '(1)$\vec{AB}$＝$(- 3 \log 2 -\log 125 , \log _{\frac{1}{2}}8 - 1)$

    ＝$\left( - 3\log 2 - 3\log 5 , \frac{\log 8}{\log \frac{1}{2}}- 1 \right)$

    ＝$\left( -3 (\log 2 +\log 5) , \frac{3\log 2}{-\log 2}- 1 \right)$

    ＝（－3，－4）

    (2)｜$\vec{AB}$｜＝$\sqrt{(- 3)^{2} +(- 4)^{2}}$＝5

    (3)令 D（x，y）

    則$\vec{DA}-\frac{1}{3}\vec{DB}+\vec{DC}$

    ＝$(3\log 5 - x , 1 - y)-\frac{1}{3} (- 3\log 2 - x , - 3 - y)+(2\log 2 - x , - 1 - y)$

    ＝$\left( 3\log 5 + \log 2 + 2\log 2 -\frac{5}{3}x , 1 + 1 - 1 -\frac{5}{3}y \right)$

    ＝$\left( 3 -\frac{5}{3}x , 1 -\frac{5}{3}y \right)$

    ＝（0，0）

    $\Rightarrow$x＝$\frac{9}{5}$，y＝$\frac{3}{5}$

    故 D 點坐標為$\left( \frac{9}{5} , \frac{3}{5} \right)$'
- id: doc_112_彰化_彰化高中_數學_數A_g11s1e2_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 已知 $log_{18}$9＝a，$18^{b}$＝5，試用 a，b 表示 $log_{36}$45＝＿＿＿＿。
  explanation: '∵b＝$log_{18}$5

    ∴$log_{36}$45＝$\frac{\log 45}{\log 36}$

    ＝$\frac{\frac{\log 45}{\log 18}}{\frac{\log 36}{\log 18}}$

    ＝$\frac{\frac{\log (9\times 5)}{\log 18}}{\frac{\log \frac{18^{2}}{9}}{\log 18}}$

    ＝$\frac{\frac{\log 9}{\log 18}+\frac{\log 5}{\log 18}}{\frac{\log 18^{2}}{\log 18}-\frac{\log 9}{\log 18}}$

    ＝$\frac{a +b}{2 -a}$

    故 $log_{36}$45＝$\frac{a +b}{2 -a}$'
