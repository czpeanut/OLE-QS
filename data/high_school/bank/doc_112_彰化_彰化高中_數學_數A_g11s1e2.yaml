  stem: 設 P 為△ABC 所在平面上一點，$\vec{AP}$＝$\frac{2}{3}\vec{AB}+\frac{1}{2}\vec{AC}$且直線 AP 交$\overline{BC}$邊於 Q，試問下列敘述何者正確？
