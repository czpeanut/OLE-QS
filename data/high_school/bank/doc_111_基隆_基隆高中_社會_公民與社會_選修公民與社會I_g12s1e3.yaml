- id: doc_111_基隆_基隆高中_社會_公民與社會_選修公民與社會I_g12s1e3_s2_24
  section: 2
  number: 24
  type: single
  page: 4
  stem: 根據上述內容，下列哪些做法「無法」達到政府預期刺激經濟的效果？（應選四項，全對才給分）
  options:
  - label: A
    content: 網路上有人以高價收購三倍券
  - label: B
    content: 政府直接發放現金到國民的帳戶
  - label: C
    content: 開放使用於百貨娛樂場所
  - label: D
    content: 開放使用三倍券繳納水電費
  - label: E
    content: 直接發放消費券 3,000 元
  group_stem: '2020 年 7 月 15 日，為刺激消費，由政府出錢的「三倍券」，讓民眾「用 1,000 元可以買到一本 3,000 元的現金券」。外界質疑為何不直接發 3,000 元消費券？行政院指出，消費券刺激經濟效果差，調查顯示有 72.07 ％的民眾僅將消費券用於原來的日常支出，不會使用消費券購買較貴或較多商品，加碼消費效果未顯現。

    至於為何不直接發現金 2,000 元，主要是有錢人拿到現金可以存起來，幫助不到商家，讓振興的效益大打折扣，政府的預算也無法用在刀口上。但民眾出 1,000 元，政府加碼變成 3,000 元的三倍券，而且限制年底前一定要花完，店家一定收得到 3,000 元，就可以真正刺激消費，而不是變成存款。'
  explanation: (A)網路上有人以高價收購三倍券，只是轉手交易（二手交易），不列入 GDP，故無助於 GDP 成長。(B)政府直接發放現金到國民的帳戶，若民眾不消費而存起來，則無助於 GDP 成長。(C)開放使用於百貨娛樂場所，可以增加娛樂場所的收入，帶動經濟成長。(D)開放使用三倍券繳納水電費，民眾不會增加消費，故無助於經濟成長。(E)直接發放消費券 3,000 元，民眾用消費券支付原先的日常支出，而較不會用於其他消費，故無助經濟成長。
- id: doc_111_基隆_基隆高中_社會_公民與社會_選修公民與社會I_g12s1e3_s2_25
  section: 2
  number: 25
  type: single
  page: 5
  stem: 因 COVID-19 疫情因素，政府採用寬鬆的貨幣政策，下列何者亦屬於寬鬆的貨幣政策？
  options:
  - label: A
    content: 公開市場買回公債
  - label: B
    content: 提高重貼現率
  - label: C
    content: 提高存款準備率
  - label: D
    content: 提高所得稅稅率
  group_stem: '因 COVID-19 疫情因素，各國消費減緩，使得政府採用寬鬆的貨幣政策，對於物價與我國股市和房地產造成波動。我國金融監督管理委員會為了解民眾的「金融風險抵抗力」進行以下調查，希望分析民眾遭遇財務衝擊的恢復能力、儲蓄借貸、金融素養等現象。本項調查結果如下：

    一、民眾財務呈現低風險承受：近一半民眾家庭收入低於 80 萬，呈現入不敷出的情況，為潛在財務脆弱群體。若發生突發衝擊，將缺乏足夠的緩衝與恢復能力，對家庭與社會安定造成危害。例如：30 歲以下及 60 歲以上者、新住民族群及原住民族群、非典型就業者、家庭收入偏低者、租屋者、婚姻狀態不穩定者都屬優先關懷對象。

    二、儲蓄與借貸呈現雙峰現象：有三成民眾幾乎沒有儲蓄，亦有三成民眾儲蓄非常豐沛，反而預期在多數的「適當儲蓄」僅占不足一成。另外有近四成民眾有餘裕可獲得借款購屋、投資，亦有一成民眾無法獲得任何形式借款。

    三、金融素養與風險抵抗關聯：年齡部分，30 歲後風險抵抗力較為提升，且隨著年紀增加，是否具備金融素養為最關鍵因素，高金融素養在收入、儲蓄與支應生活能力皆有較佳表現。至於區域部分，在都市化程度較低、老化比例較高等地區，較難獲得金融服務，故出現較多金融素養偏低的調查。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 寬鬆性貨幣政策包括降低存款準備率、降低重貼現率、買入債券，故選(A)。
