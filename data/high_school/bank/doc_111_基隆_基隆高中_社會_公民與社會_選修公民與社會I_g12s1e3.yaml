    過去國家針對利率作出上限管制，近代則是因應央行的出現成為貨幣政策的手段。悉尼．霍默在《利率史》一書中更提及「高利貸對歐洲信貸的影響」圍繞高利貸備受爭議的歷史，過去高利貸被定義為「索取超過給予」，即只要收取利息就算高利貸。16 世紀之後，高利貸則被定義為超出正常合理的貸款利率，因此，多數國家則管制利率上限，促使民間商業活動能正常運作，帶來社會的穩定外，政府也能以低廉的利息貸款以利於各式公共建設。

    然而近代經濟學家反而擔憂利率太低所帶來的問題，當經濟不景氣時，政府常常傾向以降低利率來刺激經濟；反之，<u>在經濟過熱、資產價格泡沫大、醞釀潛在風險的時期，政府則透過增加還款利息的手段試圖調整</u>。

    資料二：美國聯邦準備銀行（FED）基金利率和十年期國債利率走勢圖（1970 ～ 2018 年）。'
  shared_asset: g2_30_33
  answer:
  - B
  answer_status: verified
