  explanation: '金管會是我國有關金融事務的最高主管機關，成立於 2004 年 7 月，目標包含維持金融穩定、落實金融改革、協助產業發展、加強消費者與投資人保護與金融教育，但金管會不是中央銀行附屬機構，故(A)錯誤。

    27.30 歲以下及 60 歲以上者、新住民族群及原住民族群、非典型就業者、家庭收入偏低者、租屋者、婚姻狀態不穩定者都屬財務呈現低風險承受，故(A)錯誤。(B)(C)(D)(E)符合調查結果。

    28.發生經濟大蕭條的時候，中央銀行該採取寬鬆的貨幣政策，使市場上的貨幣供給增加，故選(A)。

    29.所得稅率是立法院三讀通過，財政部執行，非央行的貨幣工具，故選(C)。

    30.資料一「研究經濟學的學者可以從利率的潮汐中看見變化，看見政府政策及法律的制定，並透過合適的貨幣及財政政策，更有助於國家的經濟發展。」其意思即是從利率的變動中可以分析國家的政治經濟發展，故選(B)。(A)題文未提及利率的變動中可以推敲戰爭的發動及其災難。(C)合理的利率變動才是文明進展的指標。(D)利率的變動，帶來社會的穩定。

    31.題文寫到：過去高利貸被定義為「索取超過給予」，即只要收取利息就算高利貸。16 世紀之後，高利貸則被定義為超出正常合理的貸款利率，由此判斷(C)正確。(A)現代國家也會對變動利率進行管制。(B)政府必要時會介入管理利率的高低。(D)利率不是愈低愈好，須視資金供需調整。

    32.根據資料二的走勢圖，2008 至 2015 年之間美國的聯邦基金利率持續創新低，目的在刺激經濟，故選(D)。(A)美國至 1970 年至 2018 年聯邦基金利率波動很大。(B) 1981 年美國國債利率最高點顯示該國處於經濟繁榮期。(C) 2008 年金融危機後至今美國聯邦基金利率並未持續下滑。

    33.「在經濟過熱、資產價格泡沫大、醞釀潛在風險的時期，政府則透過增加還款利息的手段試圖調整。」此即表示，政府提高利率，增加貸款者的負擔與成本，減少貸款的意願，故選(B)。

    34.寬鬆性貨幣政策包括降低存款準備率、降低重貼現率、買入債券，若央行決定透過降低重貼現率 1 碼，屬寬鬆的貨幣政策，市場上的貨幣供給增加，故與選項(A)相同。

    35.若央行考量一國的景氣，決定降低該國的存款準備率，則為寬鬆的貨幣政策，會導致商業銀行可以放款的金額增加，市場上的貨幣供給增加，促使一般大眾持有的通貨淨額提高，故選(B)。(A)該國重貼現率進而下降，使得一般的商業銀行貼現給民眾的機會成本降低。(C)題幹為存款準備率下降，不是公開市場操作。(D)存款利率下降，存錢在銀行的機會成本下降，貨幣將流入市場消費或投資。

    36.中央銀行做為「銀行中的銀行」，係因中央銀行集中保管銀行的法定準備金，並當銀行出現資金流動性問題時提供貸款，因此央行也被稱為「最後貸款者」，故其目的在健全銀行業務，進而幫助金融穩定，選(C)。(A)(D)雖為央行的職責，但與題意無關。(B)央行不以營利為目的。'
