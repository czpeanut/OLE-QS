  stem: 為減輕民眾育兒負擔，並搶救臺灣低生育率，臺灣企銀創業界之先，推動「添好孕」優惠貸款，利率 1.46 ％起，想圓生子夢或家有 5 歲以下幼兒者，附證明最高可貸款新臺幣 100 萬元，貸款期限最長 7 年，為計畫生育的夫妻及家有幼兒的父母分憂。小明和他的鄰居正在討論如何申請「添好孕」貸款 100 萬元。請問：下列四位民眾針對「添好孕」貸款的說法，何者正確？
