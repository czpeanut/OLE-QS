  group_stem: '中央銀行調降重貼現利率 1 碼，為反映銀行存款利率調降，中央銀行宣布金融機構存放央行準備金乙戶的利率，活期性存款部分調整為年息 0.068 ％；定期性存款部分調整為年息 0.56 ％。

