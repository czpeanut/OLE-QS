questions:
- id: doc_111_基隆_基隆高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 處理人民借貸款的中介機構主要為商業銀行，下列何者「並非」我國的商業銀行？
  options:
  - label: A
    content: 臺灣銀行
  - label: B
    content: 土地銀行
  - label: C
    content: 農會信用部
  - label: D
    content: 中華郵政
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 商業銀行，謂以收受支票存款、活期存款、定期存款，供給短期、中期信用為主要任務之銀行，故(D)不屬於商業銀行。
- id: doc_111_基隆_基隆高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 今日社會逐步邁向低利率的時代，假設目前銀行的放款利率為 2.5 ％、存款利率為 0.8 ％。若想向銀行借錢來投資，下列何項商品「最不可能」進行投資？
  options:
  - label: A
    content: 商品一：報酬率 4 ％
  - label: B
    content: 商品二：報酬率 3 ％
  - label: C
    content: 商品三：報酬率 2.5 ％
  - label: D
    content: 商品四：報酬率 2 ％
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 廠商要向銀行借錢來進行投資，必須預期報酬率大於銀行放款率，故廠商不可能投資商品四，選(D)。
- id: doc_111_基隆_基隆高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 我國政府於 2020 年底推出一系列健全房市措施，包括行政院通過「健全房地產市場方案」，通過「實價登錄 2.0」等多項修法，立法院法制局報告指出，唯有房貸實際負擔利率提高，才是最重要且有效的工具。下列何者分析最為正確？
  options:
  - label: A
    content: 政府推動的健全房市措施將提高民眾的投資意願
  - label: B
    content: 政府所推動的一系列的房市措施皆無法遏止炒房
  - label: C
    content: 實際負擔利率提高表示民眾所需支付的利息減少
  - label: D
    content: 負擔利率提高將使透過房貸買房者經濟壓力變重
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 房貸實際負擔利率提高，表示民眾所需支付的利息增加，貸款購屋者的成本提高，才能遏止炒房，故選(D)。(A)政府推動的健全房市措施，將抑制民眾的投資意願。(B)政府所推動的一系列的房市措施，並非皆無法遏止炒房。(C)實際負擔利率提高，表示民眾所需支付的利息增加。
- id: doc_111_基隆_基隆高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 中央銀行為控管貨幣的金融機構，對該國經濟具有重大影響。下列何者屬於我國中央銀行扮演的角色？
  options:
  - label: A
    content: 提供私人企業的資金借貸需求
  - label: B
    content: 以營利為目標謀取銀行最大利益
  - label: C
    content: 商業銀行為中央銀行的最終貸款者
  - label: D
    content: 維持匯率穩定及扮演融通資金的任務
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 中央銀行是主導一個國家貨幣政策的組織。負責職能包括發行該國貨幣、維護支付與清算系統、制定國家貨幣利率與匯率政策、管理外匯、並執行金融監理以維護金融穩定，故選(D)。(A)央行不提供私人企業的資金借貸需求。(B)央行不以營利為目標。(C)中央銀行為商業銀行的最終貸款者。
- id: doc_111_基隆_基隆高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 因應農曆春節發紅包、換新鈔的習俗，中央銀行除了印製新鈔外，更協調 8 家公股銀行與郵局備妥年節需求資金，受理民眾兌換新鈔，並監看各金融機構的資金流動狀況。央行亦提醒民眾宜避免過度兌現，以免屆時沒有用到，造成印鈔資源的浪費。下列何種央行的職能「並未」出現於上述題文？
  options:
  - label: A
    content: 持有外匯
  - label: B
    content: 促進金融穩定
  - label: C
    content: 控制貨幣數量
  - label: D
    content: 發行貨幣
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '題文未提及外幣等外匯，故選(A)。(B)(C)協調 8 家公股銀行與郵局備妥年節需求資金，監看各金融機構的資金流動狀況是為了促進金融穩定，與控制貨幣數量。(D)印製新鈔為發行貨幣。

    6.16 萬÷500 萬×100 ％＝3.2 ％，故選(B)。

    7.臺灣出口成長減緩，表示廠商投資生產的貨物，不一定能出口，因此廠商對未來前景持悲觀態度，減少固定投資意願，而導致資金需求減少，故選(D)。

    8.「添好孕」優惠貸款，利率 1.46 ％起，且須家有 5 歲以下幼兒者，故只有提納兒子 3 歲，且願付 1.5 ％利率大於 1.46 ％，符合「添好孕」優惠貸款條件。

    9.莉莉和大偉買房子，根據《民法》規定，不動產交易必須書面登記，才能完成房屋所有權的移轉，故選(C)。(A)莉莉和大偉此時屬於可貸資金市場的資金需求者。(B)銀行此時扮演可貸資金市場中的資金中介者角色。(D)圖中提到的銀行利率，對莉莉和大偉來說是屬於成本。

    10.圖二表示中央銀行貨幣供給增加，故會導致物價上漲，選(A)。(B)由於市場資金充裕，故房地產市場熱絡。(C)由於市場資金充裕，故提高民眾對於商品的需求。(D)央行不會因貨幣供給增加而虧損。

    11.全球「經濟成長疲軟」及「金融情勢惡化」，央行實施寬鬆的貨幣政策，故應選(B)。(A)調降銀行的存款準備率。(C)提高金融機構放款額度。(D)調降對商業銀行的重貼現率。

    12.現在銀行各項貸款的利息，都是用年利率計算，故選(A)。(B)前往消費，是消費者，可增加小胤的銷貨收入。(C)郵局無放款業務。(D)即使創業獲利，但仍須考量放棄其他工作的機會成本。

    13.冰島經濟嚴重衰退，表示 GDP 下降，因此應採取寬鬆的貨幣政策，降低存款準備率來增加市場上的貨幣量，引導利率下降，刺激廠商投資意願，故選(B)。(A)採取寬鬆的貨幣政策。(C)冰島央行降低利率吸引外商投資。(D)寬鬆的貨幣政策是為了刺激國內 GDP 成長。

    14.前央行總裁彭淮南曾提出柳樹理論，「具有彈性的匯率，正如柔軟的柳樹，於颱風來臨時不會折斷」，藉以隱喻央行應在必要時候，介入外匯市場，維持匯率的穩定，故選(C)。(A)為維持對外幣值的購買力穩定，央行將對市場適度干預。(B)高波動的匯率具強機動性，不利國家金融體系穩定發展，因此政府會介入。(D)熱錢大量湧入國內市場時，央行將以匯率政策調降匯率。

    15.可貸資金市場中，當市場利率低於均衡水準時，則資金供給量減少，需求增加，會出現超額需求，故選(C)。(A)就個別家戶的儲蓄行為而言，在可貸資金市場，即資金供給者。(B)就個別廠商的投資行為而言，在可貸資金市場，即資金需求者。(D)當市場利率高於均衡水準時，會出現超額供給。

    16.美國聯準會降息，其他國家也祭出降息政策，此為寬鬆的貨幣政策，目的是以低利率來促進民間的消費和投資，故選(A)。(B)抑制大眾的儲蓄。(C)與關稅和反傾銷無關。(D)鼓勵企業向銀行貸款來增加投資。

    17.若一國的央行持續採取存款負利率政策，此為寬鬆的貨幣政策，目的是以低利率來促進民間的消費和投資，故選(B)。(A)抑制大眾的儲蓄。(C)金融市場會因寬鬆的貨幣政策而有變化。(D)寬鬆的貨幣政策目的是要有微幅通貨膨脹，以刺激經濟成長，但不會使通膨加劇。

    18.為避免國內市場發生通貨膨脹，將採取緊縮的貨幣政策來加以預防，故選(C)。(A)提高存款利息。(B)提高存款準備率。(D)公開市場賣出債券。

    19.通貨膨脹 5 ％高於均衡名目利率 3 ％，則存款不划算，因此打擊存款意願，資金的供給會減少，故(D)有誤。

    20.當民眾失業，導致資金出現缺口，申請貸款人數增加，表示可貸資金市場的需求增加，故選(B)。'
