- id: doc_111_台中_豐原_社會_歷史_選修歷史II_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 煤曾被視為一種精神指引，引導人類從野蠻走向文明。19 世紀中葉美國文學家愛默生曾寫道：「每一個煤筐裡都裝載著動力與文明。」請問人類從野蠻走向文明的事件是指什麼？
  options:
  - label: A
    content: 文藝復興
  - label: B
    content: 宗教改革
  - label: C
    content: 科學革命
  - label: D
    content: 工業革命
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 煤曾是工業革命重要的動力能源，對人類之後的文明發展影響甚鉅，答案為(D)。
- id: doc_111_台中_豐原_社會_歷史_選修歷史II_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「過去生物遺傳資料幾乎是免費的，單向的由南往北，輸入北方富有國家。但自從□□簽訂之後，北方富國需透過某特定法制向南方低度開發國購買生物遺傳資源和相關的傳統知識。此交易牽涉到許多條件，其中最重要的一個條件是使用者（users）和提供者（providers）間的利益共享（sharing of benefits）。」請問□□為何？
  options:
  - label: A
    content: 《京都議定書》
  - label: B
    content: 〈國際人權宣言〉
  - label: C
    content: 〈國際環境人權宣言〉
  - label: D
    content: 《生物多樣性公約》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 選項中僅《生物多樣性公約》旨在保育生物多樣性、永續利用其組成部分，以及公平合理分享由利用遺傳資源而產生的惠益，故答案為(D)。(A)為減緩地球暖化速度而降低排碳量。(B)(C)與保障人權、改善人類環境相關。
- id: doc_111_台中_豐原_社會_歷史_選修歷史II_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '資料一：此時期的政策已不再禁止基督教傳教士到山地傳教，基督教門諾會也開始派遣醫療人員來臺灣組成山地醫療團，在山區的許多聚落提供醫療服務。

    資料二：由於傳教士使用的西醫療法有別於傳統的醫療知識與經驗，曾引起在地醫者和居民的嫉恨與誤解，嚴重者還曾在地方上造成「教案」。

    根據以上資料對傳教士與醫療工作的介紹，我們可以有下列何種理解？'
  options:
  - label: A
    content: 兩則資料都說明清代開港通商後，西醫已深入臺灣民間基層
  - label: B
    content: 資料一反映日治時代政治借重教會對山地部落提供醫療服務
  - label: C
    content: 資料二的情形僅發生於臺灣北部，南部民眾則大多接納西醫
  - label: D
    content: 資料一、二依序為戰後與 1860 年代基督教會投入醫療的情況
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '資料一提及「不再禁止基督教傳教士到山地傳教」，可推知此時期為國民政府時期；資料二提到傳教士的西醫療法曾在地方上造成「教案」，因此可推知此時期為清代臺灣開港後，西醫療法受到臺灣民間的質疑，因此(D)為正解。(C)資料二的情形在臺灣北部、南部皆曾發生。

    4.1911 年中國東北的鼠疫橫行，最後由伍連德採用西式衛生觀念中的消毒、隔離、火化染疫患者屍體等方式，成功圍堵疫情的擴大與蔓延，故答案為(B)。

    5.14 世紀中葉後，工匠的薪資明顯大幅上漲的原因係人力不足，而此時造成人口減少的最主要原因為黑死病的影響，(A)為正解。

    6.1915 年日本向袁世凱祕密提出「二十一條」要求時，中方透過媒體向外界洩漏，引來國際干涉與國內反對聲浪，迫使日方讓步以減少損失，答案為(A)。

    7.(A)「蘭學」指日本鎖國時期由荷蘭輸入的西學。(B)湯藥、針灸與養生為傳統漢醫的醫療文化，非民俗療法。(C)加姆（Jamu）為印尼傳統的草本飲料，非越南。

    8.(B)鳥嘴面具除可與病患保持距離外，面具裡面亦塞有藥草，使醫師能吸收到藥草香氣而隔絕屍臭和病毒，不受瘟疫侵襲。

    9.由於太魯閣族人認為疾病的發生是源自「看不見力量」的作祟，此「看不見力量」可能為祖靈，因此傳統醫療儀式當然以撫慰祖靈為主，(B)為正解。(A)太魯閣族是以竹占詢問祖靈。(C)以藥物治療患部的重要性應次於撫慰祖靈。(D)豐年祭儀式是為了慶祝豐收，非治病儀式。

    10.資料一為清代，資料二為日治時期的情形，(D)為正解。(A)強化檢疫與隔離治療為日治時期的作法。(B)資料二為日治時期的防疫情形。(C)資料一時期官方尚未有強制性的公共衛生政策。

    11.書中敘述指出使用植物與礦物為藥方時，必須辨別其寒溫、滋味、氣感等，並衡量疾病的深淺來加以調劑，才能打通經脈氣血之糾結，此為中國藥物學的基本理論，(D)為正解。

    12.(C)香料被認為可防治黑死病，檳榔則被認為能避瘴氣。

    13.黑死病為 14 世紀中葉的傳染病，義大利首當其衝，之後便頒布一系列檢疫與隔離等公共衛生措施，(B)為正解。(A)查士丁尼為 6 世紀的東羅馬帝國皇帝。(C)西歐海權國家的對外擴張與殖民競爭應於 16 世紀後。(D)黑死病疫情隨著人口移動而蔓延，影響遍及城市與莊園，因此並未出現明顯的城市人口移往鄉村現象。此外，疫情期間確實對商業發展不利，但隨疫情趨緩後，城市商業發展又再度振興，並沒有長久停滯現象。

    14.(B)史前人類最早由非洲擴散到各洲生活。(C)人類遷徙時通常會從原居地帶去經常使用的物種。(D)小麥被視為從西方傳播到中國華北地區的糧食物種。

    15.從赫魯雪夫的說法可知，美國人要得到房屋要有錢才行，係因為美國為資本主義國家；蘇聯公民可免費得到房屋，係因社會主義的共享資源。美蘇兩國最大的差異即是意識型態，故答案為(C)。

    16.兩則資料反映傳統中醫的觀念，並影響到東亞其他國家的醫學觀念，(B)為正解。(A)中醫理論源自中國，非受印度和伊斯蘭的影響。(C)資料內容未能反映此點，此應為現代西醫的觀念。(D)日治時代，官方提倡西醫、壓抑中醫。

    17.(C)廣播原是 1920 年代後最盛行的傳播媒體，在二次大戰期間扮演極重要的宣傳工具。雖在電視普及後迅速衰退，但廣播在冷戰期間再度成為重要的心理戰武器，甚至臺海兩岸也曾使用廣播進行心戰喊話。

    18.(A)(D)愛爾蘭以農業為主，並以馬鈴薯為主食，但在 19 世紀馬鈴薯因得到晚疫病而歉收，造成當地發生大饑荒。(B)愛爾蘭的小麥主要提供英格蘭食用，英格蘭並未面臨大饑荒。

    19.鐵路為 19 世紀前期英國的重大發明，之後隨工業革命再傳入歐陸，因此歐陸興建鐵道熱潮應在 19 世紀後期，(C)為正解。

    20.(A)從一日可行二千餘里、有輪路等線索，可知丁日昌的奏摺應是強調鐵路運輸的重要性。(C)鐵路為劉銘傳時期才開始興建。(D)清法戰爭為 1884 ～ 1885 年，與題文所述時間不符。

    21.(A)臺灣電話引進民間使用的時間點為 20 世紀初期。

    22.(B)此河指運河，非黃河。(C)(D)三則資料均認為修築運河對隋代有害，但對唐代官方與人民都貢獻甚大。

    23.(A)題文中提到的時間，臺灣尚未有火車。(B)清法戰爭期間，法軍攻打臺灣係著眼於基隆的煤礦。(D)題文中無法反映此點。

    24.(A)日治時期，臺灣的米主要銷往日本，並無外銷亞洲其他地區。(B)蓬萊米的培育係為符合日人的口味需求，並非為臺民。(C)蓬萊米推廣成功之後，曾經在臺灣造成「米糖相剋」危機。(D)臺灣人以蓬萊米為米飯主食後，在來米就轉為米食加工製品原料，並非因稻米過剩。

    25.資料一中，五代的梁、晉、漢、周等政權與北宋皆定都於開封，因其地便於漕運；資料二說明唐代後期北方局勢的穩固，需倚賴南方物資的支持。兩則資料皆反映運河航運的重要性，故答案為(A)。

    26.從文中「螢幕無所不在，指導我們、告知我們、娛樂我們、形塑我們」來看，作者很悲觀的認為現代化科技發展，已在不知不覺中主導了我們的生活，答案為(A)。

    27.題文所述的驛傳制度非常發達，「薄海內外」能「如行國中」，可見此朝代國力強盛到能維持驛路暢通，促成東西經濟文化交流頻繁，應為元朝，答案為(D)。(C)唐朝的驛道雖聯通全國，但並未通往西域。

    28.(A)二戰後期，英美等國才以實驗為名研發炭疽桿菌。(B)炭疽病是一種微生物經基因改造後而形成的疾病，曾被作為生化武器使用。(C)伊拉克地區在 20 世紀後期至 21 世紀初，大量運用炭疽病作為戰爭用途。

    29.旱稻為早期臺灣的原生種，近年南投縣八卦山區農民、屏東牡丹鄉排灣族高士部落等積極復耕，除了文化傳承外，最可能是因為氣候變遷，栽種更能適應環境的作物，答案為(A)。

    30.兩則資料描述的是「霧都」英國倫敦的情形，由於工業革命燃燒煤炭，使霧霾情況更加嚴重，尤其在 1952 年更造成重大的傷亡，答案為(B)。

    31.(A)資料一的病毒為天花，造成印第安人大量死亡。(C) 16 世紀的西班牙人尚未發展生化武器，德國傳教士的評論僅是形容西班牙輕而易舉的摧毀印第安族群。(D)兩則資料重點在病毒為主因，但並不能說明與西班牙的大屠殺無關。

    32.題文顯示這項商品由東方伊斯蘭世界傳入，在 1300 年以前已傳到歐洲，算是價格甚高的奢侈品。(A)(B)(C)皆在 16 世紀才傳入歐洲。(D)甘蔗在 16 世紀經由西、葡兩國在中南美洲大量種植後，蔗糖的價格才明顯下降。

    33.(A)馬並非美洲大陸的原生物種，為歐洲人輸入。(B)駱馬主要功能為運送貨物，非騎兵使用。(D)未有此事。

    34.英國自近代以來即以發展毛紡織業為主，直到自印度引進棉布後，大受歡迎，也促使本土紡織業有了重大變革，引發工業革命，答案為(A)。

    35.題文說明李鴻章於 1881 年興建官辦鐵路，從時間來看，當時為自強運動期間，(B)為正解。(A)戊戌變法為 1898 年，(C)孫中山投書時間為 1894 年，(D)甲午戰敗時間為 1895 年。

    36.從樂生療養院「原設有鐵絲網，以防止院民逃跑或路人擅入」來看，日人對漢生病的態度應是採取強制隔離的方式，答案為(C)。

    37.(A)二戰結束後，國民政府慢慢開放樂生療養院院民回家，但因長期汙名化的結果，不少院民已習慣離群索居而不願離去。後為配合都更計畫與捷運工程需要拆遷，曾一度引發社運人士抗爭，最後政府在附近興建新式醫院收容院民，療養院也於 2008 年拆除。

    38.拉斯卡薩斯曾隨哥倫布航行，加上 1522 年的時間點，可推知其書記載的是西班牙的海外殖民情形，答案為(D)。

    39.哥倫布往西航行到達西印度群島，但當時他誤以為來到印度，因此拉斯卡薩斯的書才會以「印度地區」命名，實則應是中南美洲，答案為(A)。

    40.第一次技術革命帶來的交通運輸效能，主要是在輪船與火車兩項交通工具上，答案為(A)。

    41.第二次技術革命的動力能源表現在內燃機與電力的使用，(D)為正解。(A)(B)(C)三者為第一次技術革命已有的成就。'
