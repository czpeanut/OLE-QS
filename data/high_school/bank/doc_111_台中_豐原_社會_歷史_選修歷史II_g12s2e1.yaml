  stem: '資料：董仲舒的天人感應學說指出，人間君臣如果離德逆天，上天就會降天譴，告誡君王歸正，如再不歸正，大難將至，不可挽回。東漢著名經學者何休曰：「民疾疫也，邪亂之氣所生。」所以，古代一旦發生全國性的瘟疫，君王大多會先透過□□方式，或推行改革措施，或減輕賦稅，或赦免罪刑等來改變現況。

