  stem: '有關日本 311 大地震與隨之而來的福島核災……群馬縣的前橋地方法院於 17 日終於做出首次判決，審判長原道子指出，政府在 2002 年的地震調查研究推進本部報告中，已經認定「包括福島近海在內，未來 30 年內發生引起巨大海嘯的強震機率約為 20 ％」，東京電力公司在 2008 年也計算出了福島核電廠可能遭遇 15.7 公尺高海嘯，東電若依此事先將配電盤設置在高處，就不會發生配電盤浸水失效，造成緊急發電機無法運作，最終釀成爐心熔燬的核事故。請問：

    (1)此報導最可能出現在何時？

    (2)群馬縣的前橋地方法院判決東京電力公司的過失責任是什麼？（20 字內）'
  options:
  - label: A
    content: 1986 年
  - label: B
    content: 2002 年
  - label: C
    content: 2011 年
  - label: D
    content: 2017 年
  explanation: '(1)日本 311 大地震發生於 2011 年，因此題文所述的報導應在此時間之後，答案為(D)。

    (2)判決書中指出福島近海在未來 30 年內有發生巨大海嘯的可能性，東京電力公司也早在 2008 年即預知福島核電廠可能遭遇高海嘯，但卻未事先將配電盤設置在高處，最終導致 2011 年 311 大地震引發核災事故。

    (3)核能發電不會產生碳排放汙染空氣。核能發電是由連鎖的核分裂反應進行，發電過程並不會產生碳排放，因此完全不會汙染空氣，所以被視為環保的能源。'
