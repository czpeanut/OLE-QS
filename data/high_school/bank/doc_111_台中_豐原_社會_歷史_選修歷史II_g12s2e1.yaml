  stem: '蘇伊士運河海上環球公司是一家埃及公司，但英國企業和銀行擁有其 41 ％的股份，法國則擁有 52 ％的股份。1956 年 7 月 26 日，埃及納瑟總統宣布將蘇伊士運河收歸國有，通過運河的收入來獨自修建亞斯文水壩。10 月，以色列和埃及的矛盾升級，埃及政府阻止以色列船隻使用蘇伊士運河，以色列不宣而戰。英、法出於運河航運安全要求兩國立即停火，以色列表面接受停火卻繼續入侵，占領了加薩走廊和整個西奈半島，並迅速向運河區挺進。埃及納瑟總統也拒絕英、法的停火提議，英、法兩國因此藉口出兵推翻埃及納瑟總統政權，以及奪回蘇伊士運河。對於此情勢，美國以停止供應原油、拋棄英鎊等方式譴責英、法兩國。蘇聯則撤回駐以色列大使並以核武威脅此次行動。最後英、法接受停火協議，以色列撤出西奈半島。請問：

