- id: doc_110_高雄_鳳山_自然_物理_g10s1e1_s3_36
  section: 3
  number: 36
  type: single
  page: 5
  stem: 根據世界衛生組織公布的BMI公式，單位採用SI下，請問BMI的單位應為何？
  options:
  - label: A
    content: kgw／m²
  - label: B
    content: kg／m²
  - label: C
    content: kgw／m
  - label: D
    content: kg／m
  - label: E
    content: $kg^{2}$／m
  group_stem: '世界衛生組織為了以比較簡單經濟，便於推廣的方法來判定肥胖程度，建議以身體質量指數（Body Mass Index, BMI）来衡量肥胖程度，其計算公式為「身體質量除以身高的平方」。身體質量及身高的單位採用SI下，國民健康署建議我國成人BMI應由維持在18.5及24之間，太瘦、過重或太胖皆有礙健康。研究顯示，體重過重或是肥胖（BMI≧24）為糖尿病、心血管疾病、惡性腫瘤等慢性疾病的主要風險因素：而過僅（BMI＜18.5）的健康問題，則會有營養不良、骨質疏鬆、猝死等健康問題。 另外衛生福利部國民健康署針對不同工作量及體重情況下，對每日飲食建議量如表所示

    經研究發現使用身體質量指數（BMI）來判斷個人胖瘦，容易忽略人體脂肪的多寡。要真正判斷肥胖程度，除了以BMI作為參考指標外，還必需檢測體脂肪率，如此，獲得結果才會比較客觀。體脂肪率是指體內的比率。即「人體脂肪質量」與「身體質量」之百分比。衛生福利部國民健康署建議成年男子的體脂肪率應在17～32%，適量的脂肪對人體是具有保護作用的，可以固定及保護人體的內臟器官。 閱讀上述文章，試回答下列問題：'
  shared_asset: g3_36_37
  answer:
  - B
