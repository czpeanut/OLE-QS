    content: '570'
  group_stem: 現代科技產品是由許多不同功能的電子零件组成，其中不可或缺的主要元件之一為「晶片」，來源是由矽半導體所製作成的矽晶圓片（wafer），在上面布滿晶粒，將晶粒切開後得到晶片，再將晶片經過封裝測試，製成積體電路（IC）。根據最新統計，臺灣晶片廠的產能規模在近年已是全球第一。矽晶片的尺寸是用它的直徑來表示，目前主流大小有6、8、12英吋（分別約150mm、200 mm 及 300mm）、矽晶圓的尺寸愈大愈貴，一片12英吋矽晶圓片成本大約為15萬臺幣。相同大小晶圓片上能夠製作出的晶片數目是由製程技術來決定，目前的成熟製程技術為14奈米科技，未來可能發展到 5奈米製程科技。製程技術的成熟與否，其中關鍵因素是「良率」，良率即指矽晶片上總晶片數與能夠成功切割出可以利用之晶片數目的比值。
