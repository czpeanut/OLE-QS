  explanation: (C)新店的名稱來源與原鄉無關；新莊得名由來，即「新興的街莊」之意，因淡水河帶來的河港之利，是臺灣北部開發最早的地區之一。(E)大甲一帶原為平埔族道卡斯人的聚落，由於當初漢人來到這邊開墾時不知到此地地名，在詢問當地平埔族人後，他們稱此地「道卡斯」，但因為發音類似大甲，故地名便慢慢演變成大甲；而凱達格蘭本來也是原住民形容中「住在沼地的人」之意，便以此名稱呼居住在該地的原住民。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s3_1
