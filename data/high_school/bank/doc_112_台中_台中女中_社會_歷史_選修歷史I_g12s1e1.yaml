  explanation: 從表格數據可以看出該國的華人人口比例很高，將近國家的一半人數，且主要從事礦業、製造業與商業，可以推測應該是馬來西亞。(A)(B)因為排華與白澳政策的關係，長時間禁止華人移入，雖然二戰時與戰後有放寬限制，但華人的比例不可能達到將近一半的程度。(D)新加坡的華人比例雖高，但新加坡僅是個小島，以商業與服務業的發展為主，並無礦業跟採石業，故不選。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 當局發布法令規定：「第 3 條：每一節火車廂的列車員，有權將每一乘客安排到用屏風隔開的座位，或是依據種族使用不同的車廂。第 4 條：在城市內，白人與有色人種如果在同一餐廳內吃飯，是為非法，除非該餐廳從地面上建起一面不低於
    7 尺的屏風，將之完全隔開，並有著從大街上單獨而分開的入口。第 5 條：在任何的撞球室裡，黑人陪伴白人或者一起玩球，是為非法。」此項法案最可能出現於何時何地？
  options:
  - label: A
    content: 1770 年，英國
  - label: B
    content: 1890 年，美國
  - label: C
    content: 1970 年，澳洲
  - label: D
    content: 2000 年，南非
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 該法令的內容明顯在區隔白人跟有色人種，即為種族隔離的政策，歷史上最著名的種族隔離政策，即美國與南非。1964 年，美國國會通過《民權法案》（Civil
    Rights Act of 1964），取消公共場所的隔離政策，規定就業機會不得因種族、膚色、宗教和性別而有歧視，而南非則是在 1994 年才廢除種族隔離政策，故選(B)。
