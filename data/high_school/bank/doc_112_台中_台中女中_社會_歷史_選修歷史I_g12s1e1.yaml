- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 學者研究，1940 年代臺灣省參議會關心的議題，有政治保安、經濟建設、教育文化等，其中經濟建設類的議題約占 50 ％。下列何者會是當時參議員討論的重要議題？
  options:
  - label: A
    content: 糧荒與通貨膨脹問題
  - label: B
    content: 美援貸款的還息問題
  - label: C
    content: 引進外資抑或發展中小企業的爭論
  - label: D
    content: 加工出口區的稅務減免事宜
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題目提及 1940 年代，且當時已經有臺灣省參議會，代表此時應是 1947 年之後的臺灣，而第二次世界大戰結束不久的臺灣，面臨糧食不足與通貨膨脹的問題，也是政府的經濟政策需要解決的首要之務。(B)美援
    1951 ～ 1965 年，1940 年代的臺灣還未有美援。(C)(D)引進外資與設置加工出口區都是 1960 年代的經濟政策。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 18 世紀末，北美殖民地獨立以後，新興政府採取怎樣措施與該地原住民族相處？
  options:
  - label: A
    content: 遵循自由民主的理念，放棄殖民剝削
  - label: B
    content: 支持原住民自治，換取對政權的支持
  - label: C
    content: 與原住民締約，雙方互惠貿易
  - label: D
    content: 侵奪原住民更多的土地，以獲取利益
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 美國獨立後，聯邦政府否認原住民族的土地所有權，更透過主動購買與以地換地，取得原住民族的土地，並逼迫原住民部落搬遷到他處，故選(D)。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '右表為近代中國的人口數量。關於表中人口數變化原因與影響，依據你的歷史知識判斷，下列敘述何者正確？

    | 年代 | 1700 | 1800 | 1850 | 1900 |

    | --- | --- | --- | --- | --- |

    | 人口 | 1.5 億 | 3.0 億 | 4.3 億 | 3.5 億 |'
  options:
  - label: A
    content: 1700 ～ 1800 年人口增長，主要是社會增加的結果
  - label: B
    content: 人口增長影響下，1700 ～ 1800 年清朝積極推動海外移民政策
  - label: C
    content: 1850 ～ 1900 年人口數減少，與內亂外患仍有關
  - label: D
    content: 人口減少影響下，1850 ～ 1900 年清朝陸續發布移民禁令
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 1700 ～ 1800 年為明末清初時期，人口增長應該是因為結束明末戰亂後，清朝迎來康雍盛世，社會穩定、死亡率減少、人口增加，但並未有大量的移入人口。(B)清初時期的中國對於海外移民的態度是視為非法的，故不會鼓勵人民海外移民。(D)
    19 世紀末清朝並未頒布移民禁令，反而因《北京條約》的簽訂，允許華工合法出洋，而有不少的華人往海外移民。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 中國史上某一時期對內輕徭薄賦，儉省刑罰，一意與民休息；對諸侯國大致採取放任政策，儘量不干涉其內政；對外族力求親善，保持和平關係。以上所談情況最可能出現於何時？何種治國思想？
  options:
  - label: A
    content: 西漢初期，無為而治
  - label: B
    content: 東漢初期，偃武修文
  - label: C
    content: 唐朝初期，華夷一家
  - label: D
    content: 北宋初年，重文輕武
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文關鍵為對內「與民休息」，對外「保持和平關係」，可得知應該是指採行黃老之術的西漢初期，結合道家精神，採取無為而治，並與外族採和親政策，故選(A)。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有一位英國商人在其日記裡記載：「在安平鎮內的居民四處逃散，聽說是因為前線澎湖的戰事失利，對岸大清朝軍艦即將進入安平，在這樣的情況下，我國商館能否比照往例，繼續在當地貿易，還必須跟大清朝艦隊司令官談判才行。」這位商人所描述的事情，最可能是
  options:
  - label: A
    content: 鄭荷之役
  - label: B
    content: 施琅攻臺
  - label: C
    content: 清法戰爭
  - label: D
    content: 甲午戰爭
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文關鍵為「對岸大清軍艦即將進入安平」、「我國商館」，代表當時候清朝派遣施琅攻打臺灣，且鄭氏時期，英國與臺灣有商業合作，得以在臺灣設置商館，因此可推知當時應該是施琅攻臺的時期，故選(B)。
