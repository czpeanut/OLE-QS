  stem: '資料一：1880 年代美國國會通過一項法案，內容如下：

    ◎從是年起，停止華工入境 10 年。

    ◎已經到美國的華人不得歸化為美國公民，華人一旦回中國探親，就不能再回美國。

    ◎1880 年 11 月 17 日前既居留美國並獲得海關證明文件之華工，暫時出境後，准予重入美國。

    ◎持有中國政府英文證件，說明依約有權入美之華人（非華工），准予進入美國。

    ◎非經正當途徑進入美國之華人，於此法案通過後，將依美國法院之裁判驅逐出境。

    ◎此後，州法院或聯邦法院均不得准許華人歸化為美國公民。

    資料二：

    1906 年的大地震摧毀了舊金山市大部分的出生紀錄，大批得知此消息的華人男性趁機偽造美國身分證明：他們謊稱在美國出生，而且是美國公民，並將證件賣給家鄉的人，造成「紙孩」（paper
    sons or paper daughters，指非法取得身分證明，與華裔美國公民建立虛構親子關係者）數量激增。如美國官方所言，假設每一份呈遞的申請都是真的話，那麼「舊金山的每一名華人婦女在地震前必須有八百個小孩」。對於這個現象，移民署加強審查，紀錄顯示許多問題過於詳盡，即便是真的子女也未必會知道答案，例如：「誰住在你家老街上的第五間房子？」、「你的村莊有多少隻水牛？」、「那些水牛公的有幾隻？母的有多少隻？」即使順利通過審查，由於擔心身分暴露後面臨驅逐出境的命運，「紙孩」會小心隱藏自己的真實身分，有些人終其一生都以假名生活，只有死後才在墓碑上刻上真實姓名；有些更加謹慎，甚至只願用中文刻上真實姓名，英文刻寫的仍是假名。

    某個時期開始，加州政府推動「自白方案」，允許以非法手段進入美國的華人「紙孩」，藉由坦白他們的非法身分作為換取合法移民身分為交換條件，並要求提供他們非法文件的來源，與洩漏曾幫助他們、或是在美國的親友姓名，並用以進行意識型態的忠誠試驗，以防堵敵對思想滲入。

    請問：

    (1)官方認為「如果每一份呈遞的申請都是真的話，那麼『舊金山的每一名華人婦女在地震前必須有八百個小孩』。」依據文中敘述判斷，「紙孩」數量的激增，與《排華法案》何項條款最密切相關？（2
    分）勾選後並說明理由。（20 字內，2 分）

    | 排華法案條款 | 說明判斷理由 |

    | --- | --- |

    | □禁止華人勞工入境美國 □禁止華人歸化成為公民 □禁止華人出境後再入境 □商人擁有入境的豁免權 |  |'
  answer:
  - (1)
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)紙孩數量遽增，代表當時有許多華人試圖透過與華裔美國公民建立虛構親子關係，以取得美國公民身分，這乃是因為《排華法案》後禁止華人歸化為公民之故。

    (2) 1950 年代，正處於冷戰時期，美國境內盛行麥卡錫主義，加上當時中華人民共和國建立，華人往往會被視為是共產黨的同路人，因此美國政府便會對在美國的華人採行思想管控與監察，故選(B)。

    2.1940 年代前期，正逢第二次世界大戰期間，希特勒向歐洲擴張下，也在其占領區域實施滅絕猶太人的計畫，因此使得猶太人從歐洲向各地遷徙，以逃避遭受屠殺的命運；而
    1945 年戰爭結束後，戰後各國有計畫的強迫日耳曼人從自身國家搬離，遷徙回德國，其中也包括長期居住在德國之外領土的日耳曼人，也被視為是侵略者而被驅逐。'
