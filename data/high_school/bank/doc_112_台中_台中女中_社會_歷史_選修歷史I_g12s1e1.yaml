  stem: 一位作家追溯六代移民的生活，指稱他一生中最感動的時刻為 1967 年 9 月 29 日站立安納波利斯之時。這位作家用文字描述了二百年前他的祖先乘船抵達美洲，之後家族受盡磨難，最終取得自由的過程。今日安納波利斯市中心設有紀念像，是這位作家向兒童講述故事的情景。這位作家的祖先最可能來自何地？
  options:
  - label: A
    content: 東亞
  - label: B
    content: 西非
  - label: C
    content: 南歐
  - label: D
