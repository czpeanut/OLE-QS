  answer_status: verified
  answer_source: answer_key
  explanation: (B) 1967 年的兩百年前為 18 世紀中後期，當時的奴隸貿易盛行，歐洲商人到達西非沿岸收購黑人販售到美洲為奴，且題幹中也提到該作家的祖先到達美洲後「歷經磨難，最終取得自由」，也得以聯想到黑奴到美洲後的悲慘處境，即最後終於廢除奴隸、取得公民權，即法律上獲得平等對待的自由。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 附圖是 1930 年代印度國大黨所使用的黨旗。下列哪一項「不可能」是這幅旗幟代表的意義？
  options:
  - label: A
    content: 其訴求與一戰後的民族自決風潮有關
  - label: B
    content: 國大黨成立於此時，是由菁英階級結合工人階級組成
  - label: C
    content: 實現經濟自主是反抗英國殖民的原因之一
  - label: D
    content: 甘地「回歸紡車」的口號為國大黨所接受
  assets:
  - key: s1_10_f1
    kind: figure
    file: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e1/s1_10_f1.png
    crop:
      page: 2
      rect:
      - 409.35
      - 765.5
      - 564.25
      - 867.49
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '印度國大黨創立於 1885 年，乃是英國殖民政府為爭取印度菁英支持而創設，但後來國大黨成為反對英國殖民的主要力量，1924 年甘地成為國大黨領袖，並積極發起不合作運動，爭取印度獨立。

    11.19 世紀末，世界各國人民抱持著美國夢，想到美國發展並尋找機會，因此有許多人才相繼移民到美國，也促使美國在科技上的發明與成就。(A)英國才是最早工業革命的國家。(C)(D)
    19 世紀的歐洲國家，仍有致力於工業與科技研究上。

    12.1756 ～ 1763 年的七年戰爭結束後，英國獲勝，與法國簽署條約，英國取得法國在北美大部分的殖民地，也結束了法國人在魁北克的控制權。魁北克雖被英國統治，但大多數的居民仍以講法語為主，甚至有人民醞釀要反對英國的統治，以維持法國原有的文化與語言，因此在美國獨立運動期間，英國害怕魁北克的居民會受到獨立風潮的影響，便與魁北克簽訂法案，確保魁北克的文化與語言的地位，故選(A)。

    13.甲機構為中書省，負責草擬詔書決策，乙機構為門下省，負責審駁，而甲、乙兩機構共同協議的地方即為政事堂，最終決議後交由的「另一機構」為尚書省，下轄六部負責執行，故題幹所言者為唐朝的三省制。

    14.演講中可看出加維主張要為非洲與黑人實現自由，但在「其他族群統治的國家」無法實現自由，因此目的應該是要呼籲大家到可以實現自由的非洲地區，而加維是在美國發表這場演講，美國在
    1920 年代國內的種族歧視與隔離政策仍盛行，故可推測加維是想要鼓勵黑人回到非洲，創建一個能夠實現真正自由的國度。

    15.啟蒙時代最重要的特質為「理性」，這與科學革命以來的成就有關，伽利略、牛頓等科學家透過科學觀察與數學驗證，看見了星體的樣貌，並計算出物體運動的定理，使得人們相信透過「理性」將能掌握世界的「真理」，而理性的最佳展現便是「科學」。這股信念延續到啟蒙時代，認為科學與真理就像光一般照亮人們前進的道路，並認為美洲文明尚未受到科學與真理的影響。(A)題幹提及印第安人「寬宏」、「依循宗教施政」，自然不會認為他們缺乏寬容和虔誠。(B)「博愛」是
    19 世紀拿破崙戰爭後才盛行的觀念。(C)民主和平等的觀念，要直到法國大革命之後，才在歐洲普遍流傳。

    16.關鍵為該時期根據「當地居民的種族等級……，也開始依職業將居民分成不同類別」，選項的朝代中僅有元代同時實施種族等級統治與戶計制度，故選(B)。

    17.(A)西班牙、葡萄牙以殖民中南美洲為主。(B)波瓦坦人一開始雖與英國移民發生衝突，但爾後有簽訂合約停止衝突，且直至今日並未完全滅族。(D)移民一開始是因國內的宗教衝突或生存不易而遷徙，在到達北美以後，為了維持生存，應該是以糧食作物的栽種為主。

    18.(A)(D)甘蔗、咖啡主要種植於拉丁美洲，氣候環境較適宜。(B)要等到工業革命後，歐洲需要大量棉花之後，才成為重要作物。

    19.此國從 17 世紀開始積極擴張海外殖民地，包括「西印度群島、北美、臺灣」，「印度、中南半島、日本」也有其貿易商站。17 世紀曾經占領過臺灣的國家僅有荷蘭與西班牙，然而西班牙在美洲經營以拉丁美洲為主，且並未在中南半島與印度設立貿易商站，故選(A)荷蘭。

    20.(D)從題文可看出，北魏皇族改姓元乃是要符合土德，是為了顯示北魏的祖先與黃帝有關連。黃帝乃中國的始祖，北魏為了要顯示皇族與中國始祖相關，且符合五德終始說的土德，方會改姓，主要的目的都是為了要穩固地位，強調其統治天下的正統與正當性。

    21.題文提及「世界秩序觀……出現相當的改變，……具有對等多元特質的國際觀」，指的應是宋朝時期，與契丹、女真等外族簽訂的對等條約，以及輸送歲幣等方式進行的外交活動，跟以往漢、唐時代的以中國為中心的世界秩序觀點有所差異，故選(C)。

    22.華人在移居海外時，由於人生地不熟需要同鄉者互助合作，因此常會在海外移居地組織同鄉會互相照應。題文中提及的「公司」是基於合作關係且以兄弟感情為基礎而形成的組織，會較類似同鄉會的性質，故選(B)。

    23.1598 年法王亨利四世頒布《南特詔令》，給予法國人民宗教信仰的自由，但法國人民的宗教自由卻在 1685 年路易十四發布《楓丹白露詔令》後結束，路易十四為集中王權，規定法國人民的信仰應該統一為天主教，使得許多新教徒大量移民到英國與日耳曼北部地區，故選(C)。

    24.資料一、二的內容互相對照下，可看出北魏太武帝一方面寵信崔浩，且自己皈依道教故排斥佛教外，二方面由於佛教出家人中有許多身體強壯者，故在柔然威脅北魏時，北魏太武帝要求沙門（佛教的出家人）還俗以對抗外敵，便可知排佛的原因與過多壯年人出家，無法為國效力有關，故選(A)。(B)資料中看不出來佛教與外族勾結。(C)僅看得出北魏太武帝一人信仰道教，無法代表全部的北方胡人君主。(D)資料中看不出佛、道有衝突激烈的現象。

    25.日治時期臺灣的人口數量在 1905 年的人口調查中，大約 300 多萬，而等到 1940 年代日治後期，臺灣的人口數量約莫來到了 600 多萬，可知表中的數據來自於日治時期，而日治時期的甲族群人口數量緩慢上升，可推知為隨政府來臺日本人。(A)是臺灣最早居住的住民，人口數與所占比率不會有這種幅度的成長。(B)要等到二戰後才來到臺灣。(D)要等到
    1990 年代前後才來臺灣。

    26.從表的數據可知該國的民族組成，包括 Mestizo（麥士蒂索人，混血）占大宗，其他還有原住民、白人，以及少量的黑人，可推測該國家應該曾經被西班牙或葡萄牙人所統治，因為麥士蒂索人是屬於西班牙或葡萄牙語中的專有名詞，在說明其帝國殖民時，歐洲人與原住民的混血民族，因此(A)(C)可刪除，菲律賓雖也有麥士蒂索人，但該國組成分子仍應以南島民族為主，另外，應該會有少量比例的華人，故(D)也可刪。

    27.這首詩開始在稱讚國家初期的制度，從「傭必算丁口，租必計桑田；不求土所無，不強人所難；量入以為出，上足下亦安。」的內容可知，當時國家制度為租庸調法與均田制，然而後來因戰事興起，政府改變制度後便再也沒有更改，可推知唐朝在安史之亂後，因戶籍散亂、逃亡者眾，故改為兩稅法，之後便一直沿用下去，因此這首詩最後說到更改制度後「使我農桑人，憔悴畎畝間」，道出兩稅法的負面影響。

    28.該文件很明顯是對於人民的戶籍調查內容，而中國歷史上最早開始對人民「編戶」是在戰國時期的秦國，將國民納入紀錄，以戶為單位來掌握人民，有利於向人民徵兵與徭役，故選(B)。

    29.題文可看出，原住民族若居住環境有森林跟湖泊，便進行狩獵、採集楓糖；若是大平原，則獵捕野牛；若河川密布，則以農耕為主，以上便可看出題文所述的內容，其主旨是說明不同的原住民族會依據地理環境的不同，而選擇不同的生活模式，故選(D)。

    30.(A)總督府獎勵糖業發展，扶植日本資本家在臺灣設置新式糖廠，臺灣蔗農飽受壓榨，並未見樂於投入一事。(B)總督府並未陷於兩難，加上後來嘉南大圳的完工與戰爭的爆發，使得米糖相剋的情況結束。(D)臺灣的稻米收益比種甘蔗高，才會出現與糖爭地的現象，且稻米主要以出口為主，因此不須進口稻米來平抑米價。

    31.荷人規定漢人商賈（社商）必須先經過投標中選，並繳納承包稅金（村社貿易稅）半數後，才能與原住民通商貿易。荷人將各村社專有的交易權公開招標，商人得標後即可與原住民交易鹿皮、鹿肉，再進行轉賣以獲取利益。此外，由於貿易權被漢人壟斷，定會引發原住民對漢人的不滿，使得漢、番難以共同合作對抗荷蘭東印度公司。(A)方便徵收鹿皮與分化漢番。(B)造成雙方分化，難以合作。(C)僅有貿易壟斷，並未有統治的權力。

    32.題文提及的「廣府」，指的應為廣州，而當時廣州城內住著許多阿拉伯人、穆斯林、猶太教徒、基督徒、拜火教徒等各種外國人民，顯示在亂事爆發前，廣州城是個國際貿易的中心，加上穆斯林於西元
    7 世紀才開始發展，因此(A)(B)可刪；由於唐朝海上絲路盛行，唐朝於廣州設置市舶司，城內充斥著各國商人，故應選(C)；(D)太平天國之亂並未進攻廣州。

    33.重點在該軍人是「戰敗後」等待遣返回國的軍人，故應選擇戰敗的國家士兵，答案選(A)。(B)美國在越戰也是中途退出，1973 年戰爭尚未結束便已經將美國士兵撤離越南。(C)一戰期間，中國並非為戰場，且蘇聯在
    1917 年便退出戰爭，同時中俄也非敵對國家。(D)英國在日俄戰爭時與日本為同盟國，而日本為戰勝國。

    34.13 世紀的泉州，乃為世界最大港之一，各地的商人與船隻都會前往泉州經商貿易，故選(B)。(A)唐朝末年主要海外貿易的港口為廣州。(C)當時中國處於明朝，國家實施海禁政策，不會出現商貿繁盛的現象。(D)
    18 世紀的中國僅開放廣州一口通商，泉州不會出現如題文所述，外國人到中國旅行所見聞的景象。

    35.(C)該國的傳統文字可看出乃是以漢字為素材，而現今則以羅馬拼音為主，可推知該國為越南，傳統文字是「字喃」，而在 19 世紀被法國殖民後，便改為以羅馬拼音為主的文字。

    36.(B)由該書的書名可推知此人在質疑原住民所屬的地區是否屬於中國的一部分，加上從地圖可看出他所繪的地區為臺灣南端，可推知此人應該是羅妹號事件後來到臺灣處理的李仙德。

    37.(A)李仙德提出的「番地無主論」成為日後牡丹社事件日本出兵攻打臺灣的理論基礎。

    38.從題幹的議題「to alter the Constitution to recognise the First Peoples of Australia」便可看出此國為澳大利亞，且澳大利亞在原住民族權益的重視一直非常缺乏，這場公投被提出後仍未通過，顯示出澳大利亞原住民要爭取權利仍有漫長的道路要走。(A)美國於
    1990 年後陸續立法承認原住民族的權利。(B)日本的原住民族議題不會使用英文。(D)加拿大在 1980 年代開始，便已經在憲法中承認原住民族的身分、自治權，也陸續與各原住民族討論傳統領域範圍和土地資源分配等權利。

    39.臺灣的原住民族從 1980 年代開始，積極投入權利復振運動，提出政府應保障土地權、原住民族自治等各項訴求，並於 1994 年獲政府修法通過正名，之後也陸續有許多權力被重視與實現。

    40.題文關鍵為「道光年間」，林占梅阻絕彰化地區的械鬥蔓延，代表此事件必定是道光年間之後發生的民變。而戴潮春事件發生於 1862 年，為同治元年，距離道光末年（1850
    年）也僅有十多年的光景，加上戴潮春事件為臺灣民變中，唯一一起由臺勇平定的亂事，故符合題幹所述。(A)為康熙年間。(B)發生於乾隆年間。(D)施九緞事件發生於劉銘傳擔任巡撫來臺後推動土地改革之後，是為光緒年間。

    41.(A)林占梅家財雄厚，並非羅漢腳。(C)(D)選項所述的內容，題文並未提及。'
