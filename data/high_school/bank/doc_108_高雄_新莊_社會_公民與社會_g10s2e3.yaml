  stem: 公然侮辱罪處罰之規定，乃指《刑法》第309條：公然侮辱人者，處拘役或300元以下罰金。某網紅於臉書直播中批判國軍大部分志願役軍人是「廢物」，遭到475名志願役士兵控告涉犯公然侮辱等罪。然而地方檢察署卻認為該言論並未針對特定或可得特定對象，犯罪嫌疑不足，處分不起訴，國防部不服提出再議。後高等檢察署亦認為此案已調查完備並無再議理由予以駁回，全案確定。題文劃線處中，地檢署處分「不起訴」之依據可能為下列何者？
  options:
  - label: A
    content: 並未構成要件的該當性
  - label: B
    content: 存在阻卻違法事由事實
  - label: C
    content: 該網紅行為應屬心智缺陷，得減輕其刑責
  - label: D
    content: 網紅基於自身工作而發表相關的言論屬於業務上的正當行為
  tags:
