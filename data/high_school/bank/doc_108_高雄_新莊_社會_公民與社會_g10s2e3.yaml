  explanation: 《刑法》第309條公然侮辱罪須以「特定人或可得特定之人」為侮辱對象。地檢署認定該言論未針對特定或可得特定對象，即不符合該罪之客觀構成要件，欠缺「構成要件該當性」，故選(A)。
