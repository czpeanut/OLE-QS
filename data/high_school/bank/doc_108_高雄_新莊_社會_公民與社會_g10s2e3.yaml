  stem: 衛生福利部疾病管制署於1月公告新增「嚴重特殊傳染性肺炎」為第五類法定傳染病，目前特指2019新型冠狀病毒引起在中國武漢引發之肺炎。公告後，若病人發燒且有呼吸道症狀，或咳嗽合併呼吸急促困難或肺炎，且發病前14日內曾赴中國武漢地區，醫療院所必須於24小時內通報，疑似病例也要依法隔離於醫院，以免傳染給其他人。指揮中心發言人莊人祥表示，新增法定傳染病，一般來說要預告60天，才公告生效，但若情況緊急，衛生福利部可決定不經預告，核准後直接報請行政院核定後公告。這次因農曆春節將到來，防疫工作都在搶時間，從啟動行政程序，從部長核准到行政院公告，只用了5天。關於上文所述，何者正確？
  options:
  - label: A
    content: 隔離措施涉及對病患人身自由的限制，須符合法律保留原則
  - label: B
