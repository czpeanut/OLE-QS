  number: 32
  type: single
  page: 4
  stem: 上述兩人對網路賭博的主張，何人較符合罪刑法定主義的精神？
  options:
  - label: A
    content: 小楊，依《刑法》第266條文義推斷網路賭博未包含在內
  - label: B
    content: 小豪，新興的網路賭博應直接引用《刑法》第266條處罰
  - label: C
    content: 小楊認定賭博的標準太嚴但小豪反之，兩人皆不符
  - label: D
    content: 小楊與小豪依不同情境而有不同標準，兩人皆符合
  group_stem: 隨著網路科技發展，線上下注的新興博奕模式也在國內風行。依現行《刑法》第266條第1項「普通賭博罪」之規定：「在公共場所或公眾得出入之場所賭博財物者，處一千元以罰金。」 小楊認為以往傳統的賭博場所皆是賭客穿梭其中，使用實際賭具進行賭博的實際地，即占有實際空間體積的實體，且可透過人的知覺直接感受其存在的空間，故除非修改現行普通賭博罪中有關「場所」的構成要件，否則行為人利用電腦網路上網賭博，應不成立普通賭博罪。但小豪認為不能因賭博新興管道為網際網路，便因此大開賭博的方便之門，讓在網路上賭博之人，享有不受《刑法》處罰的特權，網際網路縱屬虛擬空間，也仍是不特定的網友們得任意出入之「場所」，故主張應可成立普通賭博罪。
