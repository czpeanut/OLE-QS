  group_stem: 108年，大法官做出釋字第777號解釋，以下擷取自解釋文： 中華民國88年4月21日增訂公布之《刑法》第185條之4規定：「駕駛動力交通工具肇事，致人死傷而逃逸者，處6月以上5年以下有期徒刑。」（102年6月11日修正公布同條規定，提高刑度為1年以上7年以下有期徒刑，構成要件均相同）其中有關「肇事」部分，可能語意所及之範圍，包括「因駕駛人之故意或過失」或「非因駕駛人之故意或過失」（因不可抗力、被害人或第三人之故意或過失）所致之事故，除因駕駛人之故意或過失所致之事故為該條所涵蓋外，其餘非因駕駛人之故意或過失所致事故之情形是否構成「肇事」，尚非一般受規範者所得理解或預見，於此範圍內，其文義有違□□原則，此違反部分，應自本解釋公布之日起失其效力。
