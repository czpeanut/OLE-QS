- id: doc_109_桃園_武陵_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 若兩直線y＝x＋2k與y＝2x＋k＋1的交點P在圓$x^{2}$＋$y^{2}$＝$10k^{2}$＋4的內部，則實數k的範圍是＿＿＿＿。
  answer:
  - k＞$\frac{-1}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: P：$\begin{cases}y=x+2k \\ y=2x+k+1\end{cases}$ ⇒ P：$\begin{cases}x=k-1 \\ y=3k-1\end{cases}$ 由題意， 得( k－1 )$^{2}$＋( 3k－1 )$^{2}$－$10k^{2}$－4＜0， ⇒ －8k－2＜0 ⇒ k＞－$\frac{1}{4}$。
- id: doc_109_桃園_武陵_數學_g10s1e2_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 已知圓C：$x^{2}$＋$y^{2}$＋a＝0與直線L：x＋y＝a不相交，則實數a的範圍為＿＿＿＿。
  answer:
  - a＜－2
  answer_status: verified
  answer_source: answer_key
  explanation: $\begin{cases}C :x^{2}+y^{2}+a=0 \\ L :x+y=a\end{cases}$不相交 ( 無解 )， C為圓 ⇒ a＜0……① 將x＝a－y代入C ( a－y )$^{2}$＋$y^{2}$＋a＝0 ⇒ $2y^{2}$－2ay＋( $a^{2}$＋a )＝0， 判別式D＜0， ⇒ (－2a )$^{2}$－4．2 ( $a^{2}$＋a )＜0 ⇒ $4a^{2}$－8 ( $a^{2}$＋a )＜0 ⇒ $a^{2}$－$2a^{2}$－2a＜0 ⇒ $a^{2}$＋2a＞0 ⇒ a ( a＋2 )＞0 ⇒ a＞0或a＜－2……② ①∩② ⇒ a＜－2。
- id: doc_109_桃園_武陵_數學_g10s1e2_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: 已知多項式f (x) 除以 ( $x^{9}$＋1 ) 得商式為$x^{2}$＋1，餘式為$x^{2}$－x＋1，求 ( x＋1 )×f (x)除以$x^{2}$＋1的商式為＿＿＿＿。
  answer:
  - $x^{10}$＋$x^{9}$＋2x＋1
  answer_status: verified
  answer_source: answer_key
  explanation: 'f (x)＝( $x^{9}$＋1 )．( $x^{2}$＋1 )＋$x^{2}$－x＋1， ⇒ ( x＋1 ) f (x)＝( $x^{2}$＋1 )［( $x^{9}$＋1 )．( x＋1 )］＋( x＋1 ) ( $x^{2}$－x＋1 ) ……① 又 ( x＋1 ) ( $x^{2}$－x＋1 )＝$x^{3}$＋1， $x^{3}$＋1＝( $x^{2}$＋1 )．x＋(－x＋1 ) 代① 故 ( x＋1 ) f (x)＝( $x^{2}$＋1 ) ( $x^{10}$＋$x^{9}$＋x＋1 )+( $x^{2}$＋1 )．x+(－x＋1 )

    ⇒( x＋1 ) f (x)＝( $x^{2}$＋1 ) ( $x^{10}$＋$x^{9}$＋2x＋1 )－x＋1，

    故商式＝$x^{10}$＋$x^{9}$＋2x＋1。'
- id: doc_109_桃園_武陵_數學_g10s1e2_s2_4
