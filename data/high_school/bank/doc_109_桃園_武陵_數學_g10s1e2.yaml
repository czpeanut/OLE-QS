  stem: 求和直線3x－2y＋4＝0垂直且與圓$x^{2}$＋$y^{2}$－2x－3＝0相切的切線方程式為＿＿＿＿。
  answer:
  - 2x＋3y－2±2$\sqrt{13}$＝0
  answer_status: verified
  answer_source: answer_key
  explanation: L：3x－y＋4＝0之斜率＝$\frac{3}{2}$，故垂直L之斜率為－$\frac{2}{3}$， 設Ｍ：2x＋3y＋C＝0，C：( x－1 )$^{2}$＋$y^{2}$＝4， 圓心 ( 1 , 0 )，r＝2，d ( 圓心 , M )＝2， ⇒ $\frac{|2+c|}{\sqrt{2^{2}+3^{2}}}$＝2 ⇒ | C＋2 |＝2$\sqrt{13}$ ⇒ c＝－2±2$\sqrt{13}$ 得M：2x＋3y－2±2$\sqrt{13}$＝0。
