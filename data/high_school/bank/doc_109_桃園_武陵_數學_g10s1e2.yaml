  stem: '▲ 以點A ( 2 , 0 ) 及點B ( 4 , 0 ) 為例，我們知道在坐標平面上所有滿足$\overline{PA} = \overline{PB}$的點所形成的圖形為$\overline{AB}$的中垂線x＝3，此中垂線將平面分成左半平面 ( 以x＜3表示 ) 及右半平面 ( 以x＞3表示 )，如附圖。我們可以從圖上直觀得知在左半平面上的所有點P都離A較近，即點P滿足$\overline{PA} < \overline{PB}$；同理，右半平面上的所有點P都離B較近，即點P滿足$\overline{PA} < \overline{PB}$。請回答下面問題： 設C為坐標平面上的圓，其圓心M在第一象限內，半徑為r ( r＞0 )。已知點O ( 0 , 0 ) 在圓C的內部，點P ( 10 , 0 )及點Q ( 2 , 6 ) 皆在圓C的外部。

    (1) 因O在圓C內，得$\overline{MO}$＜r；又P在圓C外，得$\overline{MP}$＞r。可知$\overline{MO} < \overline{MP}$，請寫出所有滿足$\overline{MO} < \overline{MP}$的點M ( x , y ) 恰好滿足的二元一次不等式為何？

    (2) 因O在圓C內，得$\overline{MO}$＜r；又Q在圓C外，得$\overline{MQ}$＞r。可知$\overline{MO} < \overline{MQ}$，請寫出所有滿足$\overline{MO} < \overline{MQ}$的點M ( x , y ) 恰好滿足的二元一次不等式為何？

    (3) 承(1)(2)，在坐標平面中畫出所有可能的點M所形成的解區域圖形。 ( 請標出所有的頂點，注意邊界是實線還是虛線，別忘記點M在第一象限內 )

    (4) 若點M ( x , y ) 為格子點 ( 即x，y皆為整數 )，這樣的圓心M ( x , y ) 有幾種不同的可能'
