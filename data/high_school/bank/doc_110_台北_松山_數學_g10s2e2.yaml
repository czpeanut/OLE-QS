  stem: FIFA 2018世界盃足球賽中，主辦國<u>俄羅斯</u>在一開始的A組與<u>沙烏地阿拉伯</u>、<u>埃及</u>及<u>烏拉圭</u>打循環賽。循環賽制中，每兩隊皆須互相比賽一場，共比6場，勝者得3分，敗者得0年，平手則各得1分，取前兩隊高分晉級。已知最後A組中<u>烏拉圭</u>得了9分晉級，<u>俄羅斯</u>得了6分也晉級，<u>埃及</u>得0分，下列何者為<u>沙烏地阿拉伯</u>的得分？ (1) 1分 (2) 2分 (3) 3分 (4) 4分 (5) 0分
  answer:
  - (3)
  answer_status: verified
  answer_source: answer_key
  explanation: 可知每隊均須比賽3場，由得分數可推得<u>烏拉圭</u>為3勝，<u>俄羅斯</u>為2勝1敗，<u>埃及</u>為3敗，因此可知<u>沙烏地阿拉伯</u>為1勝2敗，即得分數為3分，故選(3)。
- id: doc_110_台北_松山_數學_g10s2e2_s2_1
  section: 2
  number: 1
  type: calc
  page: 1
  stem: 設數列〈$a_{n}$〉之前n項的和$S_{n}$＝$a_{1}$＋$a_{2}$＋…＋$a_{n}$＝$2n^{2}$＋1，試選出正確的選項。 (1) $a_{1}$＝3 (2) $a_{2}$＝6 (3) $a_{30}$＞100 (4) $a_{n}$＝$S_{n}$－$S_{n-1}$ (5)〈$a_{n}$〉是一個等差數列
  answer:
  - (1)(2)(3)
  answer_status: verified
  answer_source: answer_key
  explanation: (1) ○：$a_{1}$＝$S_{1}$＝2×$1^{2}$＋1＝3。 (2) ○：n ≥ 2時，$a_{n}$＝$S_{n}$－$S_{n－1}$＝($2n^{2}$＋1)－[2 (n－1)$^{2}$＋1]＝4n－2，即$a_{n}$＝$\begin{cases}3, n=1 \\ 4n-2, n\geq 2\end{cases}$， 所以$a_{2}$＝4×2－2＝6。 (3) ○：$a_{30}$＝4×30－2＝120－2＝118＞100。 (4) ×：n必須大於1。 (5) ×：承(2)可知錯誤。 故選(1)(2)(3)。
- id: doc_110_台北_松山_數學_g10s2e2_s2_2
  section: 2
  number: 2
  type: calc
  page: 1
  stem: 設數據X：$x_{1}$, $x_{2}$, …, $x_{n}$ ( n＞1 ) 的平均數和標準差分別為μ和σ，試選出正確的選項。 (1) 若σ＝0，則μ必為0 (2) 若$u_{i}$＝$x_{i}$－μ，i＝1, 2,…, n，可得$u_{1}$, $u_{2}$,…, $u_{n}$的平均數為0 (3) 若$v_{i}$＝10$\sqrt{x_{i}}$，i＝1, 2,…, n，可得$v_{1}$, $v_{2}$,…, $v_{n}$的平均數為10$\sqrt{\mu}$ (4) 若$w_{i}$＝－$2x_{i}$＋1，i＝1, 2,…, n，可得$w_{1}$, $w_{2}$,…, $w_{n}$的平均數為2σ (5) 將X標準化後得數據Z，Z的標準差為1
  answer:
  - (2)(4)(5)
  answer_status: verified
  answer_source: answer_key
  explanation: (1) ×：反例：1, 1, 1, 1的標準差σ＝0，但平均數μ＝1≠0。 (2) ○：因為$x_{1}$, $x_{2}$, …, $x_{n}$的平均數為μ，且μ$_{i}$＝$x_{i}$－μ，i＝1, 2,…, n， $^{ }$ 所以$u_{1}$, $u_{2}$, …, $u_{n}$的平均數μ$_{u}$＝μ－μ＝0。 (3) ×：$v_{1}$, $v_{2}$, …, $v_{n}$的平均數μ$_{v}$＝$\frac{v_{1}+v_{2}+\cdots +v_{n}}{n}$＝$\frac{10\sqrt{x_{1}}+10\sqrt{x_{2}}+\cdots +10\sqrt{x_{n}}}{n}$＝10×$\frac{\sqrt{x_{1}}+\sqrt{x_{2}}+\cdots +\sqrt{x_{n}}}{n}$ ≠10×$\sqrt{\frac{x_{1}+x_{2}+\cdots +x_{n}}{n}}$＝10$\sqrt{\mu}$。 (4) ○：$w_{1}$, $w_{2}$, …, $w_{n}$的標準差σ$_{w}$＝|－2|σ＝2σ。 (5) ○：因為Z＝$\frac{X-\mu}{\sigma}$＝$\frac{1}{\sigma}X$＋$(\frac{-\mu}{\sigma})$，所以Z的標準差σ$_{Z}$＝|$\frac{1}{\sigma}$|×σ＝1。 故選(2)(4)(5)。
