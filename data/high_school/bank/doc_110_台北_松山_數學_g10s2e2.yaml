- id: doc_110_台北_松山_數學_g10s2e2_s2_4
  section: 2
  number: 4
  type: calc
  page: 1
  stem: 已知兩變數X、Y的數據如下： 以最小平方法求出Y對X的迴歸直線方程式為y＝－x＋4，試選出正確的選項。 (1) Y的平均數為2 (2) X、Y的相關係數r＝－1 (3) σ$_{y}$＞σ$_{x}$ (4) a＝2 (5) X對Y的迴歸直線與Y對X的迴歸直線相同
  assets:
  - key: s2_4_f1
    kind: figure
    file: doc_110_台北_松山_數學_g10s2e2/s2_4_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 546.85
      - 213.5
      - 594.55
  answer:
  - (1)(3)(4)
  answer_status: verified
  answer_source: answer_key
  explanation: μ$_{X}$＝$\frac{1+3+1+3}{4}$＝2，μ$_{Y}$＝$\frac{2+a+b+0}{4}$＝$\frac{2+a+b}{4}$，因為y＝－x＋4必過點 (μ$_{X}$, μ$_{Y}$)， 所以μ$_{Y}$＝－μ$_{X}$＋4＝－2＋4＝2 ⇒$\frac{2+a+b}{4}$＝2 ⇒ a＋b＝6， 又y＝－x＋4的斜率為m＝$\frac{S_{XY}}{S_{XX}}$＝$\frac{(-1)\times 0+1\times (a-2)+(-1)\times (b-2)+1\times (-2)}{(-1)^{2}+1^{2}+(-1)^{2}+1^{2}}$＝$\frac{a-b-2}{4}$＝－1 ⇒ a－b＝－2， 因此解$\begin{cases}a+b=6 \\ a-b=-2\end{cases}$⇒$\begin{cases}a=2 \\ b=4\end{cases}$。 (1) ○：μ$_{Y}$＝2。 (2) ×：r＝$\frac{S_{XY}}{\sqrt{S_{XX}}\sqrt{S_{YY}}}$＝$\frac{(-1)\times 0+1\times 0+(-1)\times 2+1\times (-2)}{\sqrt{(-1)^{2}+1^{2}+(-1)^{2}+1^{2}}\times \sqrt{0^{2}+0^{2}+2^{2}+(-2)^{2}}}$＝$\frac{-4}{\sqrt{4}\times \sqrt{8}}$＝$\frac{-1}{\sqrt{2}}$≠－1。 (3) ○：σ$_{x}$＝$\sqrt{\frac{1}{4}S_{XX}}$＝$\sqrt{\frac{1}{4}\times 4}$＝1，σ$_{y}$＝$\sqrt{\frac{1}{4}S_{YY}}$＝$\sqrt{\frac{1}{4}\times 8}$＝$\sqrt{2}$⇒ σ$_{y}$＞σ$_{x}$。 (4) ○：a＝2。 (5) ×：兩者不同。 故選(1)(3)(4)。
