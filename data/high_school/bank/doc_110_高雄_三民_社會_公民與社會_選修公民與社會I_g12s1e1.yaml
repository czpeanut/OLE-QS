  stem: '(二)内蒙古教育廳日前發佈了《全區民族語言授課學校小學一年級和初中一年級使用國家統編語文教材實施方案》。文件規定内蒙古民族語言授課的小學一年級開始使用全國通用的語言教材。兩年逐步從小學一年級的政治課和歷史課也開始改用漢語授課，引發民眾的反彈與批評。
    中國宣稱這項政策目的為推動民族團結，並堅稱仍有空間在其他學科和年級使用蒙古語文授課，但政策仍引發蒙古族人發起抗議和罷課，中國當局則以尋釁滋事罪名逮補抗議人士。
    內蒙古多名地方政府官員、教師和共產黨員因未執行新的雙語教育政策而受到處罰，如果學生未能按時完成入學手續，則將被取消政府補貼和撤銷銀行貸款。 國際特赦组織要求中國政府立即無條件釋放和平抗議人士，除非當局有充分可信且法庭可採納的證據證明他們犯有國際公認的罪行，並根據國際標準對他們進行公正審判，停止進一步拘捕和起訴行使和平集會權的人。

    1. ( )根據上文中國當局所發布的方案，下列敘述何者較為正確？'
  options:
  - label: A
    content: 新語言政策有助於民族的團結及文化傳承延續
  - label: B
    content: 新語言政策有助於民眾與世界接軌及文化融合
  - label: C
    content: 政府逮捕和平抗議人士恐壓迫人民的自由權
  - label: D
    content: 此政策可彰顯出政府重視文化傳承的重要性
