- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 科幻驚悚電影《絕命大平臺》(The Platform)描述一群人被囚禁於塔狀的監獄中，每天會有一座平臺由上面第一層往下載運滿滿的食物到第300層。這些食物經過計算足以餵飽整棟監獄的所有人，但卻往往因為人性貪婪，平臺在到達第40、50層時，便已空無一物。最下面幾層的囚犯只能互相殘殺、吃人肉以求溫飽，體弱者往往就成為遭到殺戮的對象。下列何項對於這部電影情節的推論最可能為真？
  options:
  - label: A
    content: 反映上層為既得利益者、下層則是資源稀缺的處境不利者
  - label: B
    content: 顯現資本主義社會，資源不足的問題比資源不均更難解決
  - label: C
    content: 就社會正義觀點，監獄的食物應優先配給體弱、飢餓的人
  - label: D
    content: 人人有平等資源近用性，合乎羅爾斯提出的機會均等原則
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 我國公立大學學生出身都會地區比例較高，而私立大學中的中低社會階層背景學生和弱勢生比例則較多。然而，多所私立大學表示因為招生不足，導致經費窘迫、辦學困難，希望調漲學費。民間團體批評，公私立大學學費差距擴大，恐怕是嚴重社會問題。推測民間團體指出的社會問題，最可能是下列何者？
  options:
  - label: A
    content: 公、私立大學畢業生的社會聲望差距增大
  - label: B
    content: 公立大學學生獲取愈多資源，加速代間流動
  - label: C
    content: 私立大學學生產生社會結構流動的可能性降低
  - label: D
    content: 公、私立大學學生因負擔差異，強化階級複製
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 「資訊科技本身，只是眾多社會資源之一，而眾多社會資源的分配機制，乃是『社會階層化』，亦即，分配的機制本質上乃是不平等的。簡單的說，資訊科技做為眾多社會資源的形式之一，即便有再多再大的發展潛能，都無法跳脱會依循社會階層化不平等分配機制的羈絆、牽制，而數位落差現象，就是此不平等分配機制的分配結果展現。」上述段落擷取自國內學者的論文，從中判斷何者可能是該學者的論點？
  options:
  - label: A
    content: 資訊科技日益發展，反而致使貧富差距擴大
  - label: B
    content: 資訊能力的培養，將無助於提升社會流動性
  - label: C
    content: 數位落差反映社會階層下，資源分配的不均
  - label: D
    content: 較高階層者會利用科技能力、進行權力鞏固
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 《銀行轉型未來式：Bank 3.0》的作者Breet King點出未來商業銀行的挑戰─在行動科技的普及下，金融服務全面開放，不再是銀行的專利，銀行應該更重視虛實整合和社群經營。隨著網路銀行及行動支付等科技發展，「銀行行員」這個職業也漸漸消失中。以上提及的產業趨勢與挑戰，與何種社會流動的類別最具直接關聯？
  options:
  - label: A
    content: 垂直流動
  - label: B
    content: 水平流動
  - label: C
    content: 結構流動
  - label: D
    content: 代間流動
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 大多數社會的醫生享有較高的社會地位，而遊民則屬於社會的底層，請問：若用功能論、衝突論和符號互動論解釋兩者社會地位差異的現象，何者敘述正確？
  options:
  - label: A
    content: 功能論認為醫生享有較高地位是因為其掌握較多資源，而非因其能力較強
  - label: B
    content: 功能論認為遊民社會地位較低是因擁有較少社會資源，而非因其能力不足
  - label: C
    content: 衝突論認為遊民的存在可以創造出社工人員等工作機會，故有其存在功能
  - label: D
    content: 符號互動論認為遊民群體被社會貼上標籤，對遊民而言要打破階層較不利
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 有位影評人提到電影《衝擊效應》的一幕：「一對白人情侶與兩位黑人朋友走在路上，原本白人情侶因天冷而靠在一起，兩位黑人以為對方誤認他們要搶劫，雙方的誤解到最後竟真演變成一場搶劫案。……」請問若這位影評人對「社會階層化」具有正確的認知的話，會對這幕情節提出哪種最為適切的解讀？
  options:
  - label: A
    content: 犯罪率高的黑人，用自己的行動印證刻板印象的真實性
  - label: B
    content: 犯罪率高的黑人，位處於低社會階層是一種合理的分配
  - label: C
    content: 為了避免不同社會階層之間再度衝突，「隔離」生活是最好的解決方式
  - label: D
    content: 因刻板印象犯罪而被捕入獄的黑人，將使其低社會階層的情況形成惡性循環
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
