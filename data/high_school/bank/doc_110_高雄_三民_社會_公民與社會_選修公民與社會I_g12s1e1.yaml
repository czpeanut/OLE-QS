  type: single
  page: 2
  stem: 大雄與小安發生停車糾纷，大雄以侮辱言詞大聲怒罵小安，小安不甘受辱而毆打大雄，最後雙方鬧上法庭，結果法官依公然侮辱罪判決大雄拘役三十天，另外依傷害罪判決小安拘役十天。判決一出，輿論嘩然有侵害人權之虞，請問下列質疑中何者最為合理？
  options:
  - label: A
    content: 判決違反法律保留原則
  - label: B
    content: 處罰目的不具正當性
  - label: C
    content: 刑罰輕重並不合乎比例
  - label: D
    content: 國家不該干涉人民權利
