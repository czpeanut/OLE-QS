- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 2
  stem: 十八世紀的英國因連年戰爭而國債激增，故先後頒布《糖稅法》、《印花稅法》等法案。將賦稅轉嫁到北美殖民地人民身上，結果激起強烈反彈。北美人民認為自己應該與英國人享有同等的自由權利，但英國國會中沒有北美殖民地的代表，因此訴求「無代表，不納稅」。上述訴求最主要在警醒英國政府何者的重要性？
  options:
  - label: A
    content: 人民財產權神聖不可侵犯
  - label: B
    content: 徵稅目的需要具備正當性
  - label: C
    content: 徵稅手段需要合乎必要性
  - label: D
    content: 法律保留的原則需要落實
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 2
  stem: 新冠肺炎（COVID-19）疫情持續延燒，使得觀光旅遊業生意惨淡，不少業者除了關門放無薪假外，也積極透過先前加入同業公會向政府呼籲應立即發放津貼補助，協助相關從業人員維持生計。請問畫底線處呈現的公民權利內涵及其發展關係應是如何？
  options:
  - label: A
    content: 以自由權爭取社會權的實現
  - label: B
    content: 藉參政權促成文化權的發展
  - label: C
    content: 以自由權影響文化權的實踐
  - label: D
    content: 藉參政權要求社會權的落實
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 某立委與全臺灣數十個自救會共同召開記者會與修法公聽會，針對《土地徵收條例》第十條中特定農業區應舉辦聽證會外，將提出全部土地徵收皆應舉辦聽證會。自救會盼望透過聽證落實論辯式民主制度，對於各類徵收案件的公益性、必要性與最後手段原則做全面辯證，以杜絕不當徵收。上述關於公平正義的思考面向，與下列何種情況最為接近？
  options:
  - label: A
    content: 法官要求肇事駕駛須賠償醫藥費及車體損失
  - label: B
    content: 檢警原則上須經法官同意才能搜索違法事證
  - label: C
    content: 發放獎學金給予成績優異或家境貧困的學生
  - label: D
    content: 追究白色恐怖的真相並使受難者能獲得平反
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 「採取合理的差別待遇，改善族群、性別、身心障礙者等群體因歧視而處於不利處境」為原則而制定政策，亦稱「積極平權措施」。下列何者最符合「積極平權措施」的精神？
  options:
  - label: A
    content: 家庭暴力防制法修法後，將未婚同居的同志情侶納入保護對象
  - label: B
    content: 建築法規要求男女廁所比例至少要一比五，以符合實際使用的需求
  - label: C
    content: 以法律規定非視障者不得從事按摩業，以保障視障者的工作權
  - label: D
    content: 成立原住民族及客家族群專屬的電視台，協助其傳承固有文化
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 我國在軍公教年金改革後，更快面臨破產危機的勞工保險也即將進行改革，大致方向均不離「多繳、少領、延後退」，結果不僅退休者不滿，在職的年輕人更加憤慨。畢竟未來要繳的錢更多，加上退休年齡延後，一旦所繳的錢被先前的退休者領完，自己退休時可能就拿不到退休金，那年輕人為何要替上一代的退休金買單。從上述年輕人的心聲，最能看出現行制度面臨的難題為下列何者？
  options:
  - label: A
    content: 福利服務成本應該由誰承擔
  - label: B
    content: 服務對象是否要有條件限制
  - label: C
    content: 福利服務應該由誰提供執行
  - label: D
    content: 福利資源如何有效杜絕浪費
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 仁榮老師課堂上向學生提問：「各位接受義務教育後，選擇繼續在高中苦讀三年，也不投入職場，假設其他條件不變，你們的選擇當下會讓勞動參與率產生甚麼變化？為什麼？」
  options:
  - label: A
    content: 提高，十五歲以上的民間人口與勞動力同步
  - label: B
    content: 降低，學生滿十五歲卻不工作會使勞動力減少
  - label: C
    content: 不變，十五歲以上民間人口與勞動力完全不變
  - label: D
    content: 降低，十五歲以上的民間人口與勞動力同步減少
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 我國廢除《動員戡亂時期臨時條款》後，為回歸正常的憲政體制運作，呼應民間憲改的訴求，而以增修條文的形式進行修憲，迄今共歷經七次修憲，每次修憲皆對我國政治發展影響甚鉅。下列關於我國歷次修憲成果的敘述，何者最符合當前的憲政制度？
  options:
  - label: A
    content: 國民大會走入歷史，立法院成為唯一的中央民意機關
  - label: B
    content: 立法院提出總統副總統罷免案後，須由憲法法庭審理
  - label: C
    content: 修憲案、領土變更案及總統副總統彈劾案皆須經公民複決
  - label: D
    content: 廢除臺灣省政府與省議會，直轄市政府由二都調整為六都
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 二○一八年地方首長及議員選舉後，台中市新任市長上任，轄下廿九個行政區，<u>(甲)沙鹿區區長(乙)北屯區區長</u>的職位有所異動，而原本連任的<u>(丙)和平區區長</u>因涉及準收賄賂罪及背信罪遭到撤職。針對上述畫底線的職位，下列敘述何者正確？
  options:
  - label: A
    content: 甲乙丙三名區長皆受區民代表會監督
  - label: B
    content: 甲乙丙三名區長皆僅連選得連任一次
  - label: C
    content: 甲乙丙三名區長皆為地方最低層級的行政首長
  - label: D
    content: 甲乙二名區長為市長派任，丙區長為民選產生
- id: doc_110_高雄_三民_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 紅遍全球的韓國團體防彈少年團，歌曲中常以當代年輕世代的困境和想法為素材，也有許多鼓勵人們面對困境的歌詞，如下列兩首歌都訴說激勵年輕人正向的面對社會現狀。請問：上述韓國偶像團體歌詞傳達給年輕世代的想法，與以下哪一種看法最相似？
  options:
  - label: A
    content: 個人的先賦地位較高者擁有較多的實源，社會地位通常也較高
  - label: B
    content: 努力有機會獲得較高的社會地位，適得其所能使社會穩定運作
  - label: C
    content: 事業成功的企業家，社會地位有時反而比起饒舌歌手還來得低
  - label: D
    content: 承認並了解社會不平等的存在，才有可能從政治制度面做改革
