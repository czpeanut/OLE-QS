  page: 6
  stem: 依據題文訊息，下列對於美國1950年代勞動狀況敘述的推論何者最為正確？
  options:
  - label: A
    content: 當時美國的男性勞動參與率增幅較女性高
  - label: B
    content: 當時美國存在著輕忽家務勞動價值之現象
  - label: C
    content: 當時美國的勞動參與受到其性別角色影響
  - label: D
    content: 當時美國女性勞動參與率與教育程度相關
  group_stem: ◎Netflix推出的影集《后翼棄兵》講述一名天才少女貝絲闖蕩以男性居多的職業西洋棋界的故事。《后翼棄兵》的故事設定在1950～1960年代的美國，在當時的社會氣氛下，女性多半被期待要照顧家庭，由男性負擔家庭的經濟，女主角貝絲要進入以男性為主的西洋棋界，成為少數的女性職業西洋棋士，過程中勢必遭受來自不同層面的挑戰。
    貝絲生於1950年代，當時第二次世界大戰剛結束不久。在戰爭時，由於許多男性必須上戰場，因此很多工作開始需要由女性接手。當戰爭結束後，社會風氣普遍認為「男人從戰場回來了，所以女人應該可以再度從職場回歸家庭，女性的任務就是要成為一名好的家庭主婦，扮演賢妻良母的角色。」在當時的美國，只有1.2%的女性就讀大學，然而在戰爭期間，女性開始接替男性的工作，讓女性漸漸體認到自己不但可以賺錢養家，更能在職場上展現自己的價值，於是到了1960年代，各種平權運動相繼興起，整個美國社會開始反思過去既有的一些社會風氣和觀念。
    在影集裡，貝絲小時候一開始接觸西洋棋時，曾被說「女生是不玩棋的」。隨著貝絲愈長愈大，除了看到貝絲拿到愈來愈多冠軍，整個社會風氣和她小時候相比也變得愈來愈不一樣。比如說許多曾經跟貝絲比賽的職業棋士，一開始因為性別而看輕貝絲，但是當他們見到貝絲驚人的天賦和實力之後，不僅非常尊敬她，更發自內心期待貝絲能有更好的發展。
