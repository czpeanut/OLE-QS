  group_stem: (一)受到新型冠狀疫情疫情影響，臺灣推多項防疫措施，包含勤洗手、戴口罩、保持安全社交距離、電梯按鈕勤消毒等。乍看都是養成防疫新生活的小習慣，但卻提高許多障礙者生活難度。有些電梯為了方便消毒，按鈕全用膠膜遮蔽，卻使視障者摸不到點字，若想上下樓，只能原地等人幫忙。因為不了解產生的「無知」，在日常生活中許多習以為常的習慣，卻也可能帶給不同群體不便，同理與設身處地才能照顧到不同需求的人，因此，也仍有社區管委會在電梯按鈕包膜，考慮到有盲人，特地在膠膜外再點上點字。
    衛生福利部則表示，從疫情發展以來，陸續有接到障礙者提醒如購買口罩不順利、直播記者會沒有手語等，也都有陸續解決相關問題。防疫相關指引已規劃易讀版，只要等指揮中心確認，就能上網公告，讓障礙者更方便取得資訊。
