questions:
- id: doc_112_台南_台南二中_社會_歷史_選修歷史I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1960 年代，美國社會出現世代間的互動鴻溝，年輕人指責中年人忽略社會不平等與歧視現象，中年人則普遍認為年輕世代缺乏愛國心，雙方在許多社會議題的立場上出現巨大落差，如反戰、環保、種族與女性議題等。請問這種現象的形成，與下列何者描述最有關連？
  options:
  - label: A
    content: 美國推動計畫經濟失敗，民眾認為重振經濟比社會平等重要
  - label: B
    content: 二戰引發的難民往美國集中，引起保守派對傳統改變的擔憂
  - label: C
    content: 戰後出生世代並未經歷兩次世界大戰，且有較高的教育程度
  - label: D
    content: 美國因戰爭的勝利而崛起，故對追求平等與和平欠缺主動性
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(C)二戰後出現的戰後嬰兒潮，未經歷過前一代面對戰爭與極權統治的威脅，生活在相對和平的時代，也接受更好的教育和社會資源，因此對社會的關注轉向檢討對人權、環境的關注，包括種族、性別的不平等與歧視現象，還有環保議題的重視等。

    2.1943 年正值二戰期間，由題幹中東京玫瑰自稱「孤兒安」及「最親愛的敵人」、用英文播報戰況、講美式笑話、點播爵士樂的敘述，可知該節目播送的對象應為美軍，這乃是日本欲透過廣播節目，引起美國軍人的思鄉情懷，打擊敵方士氣，故選(B)。

    3.從老師解說的內容可得知，戰爭在這位女孩身上除了是身體上的傷害外，還有在戰爭結束之後，仍持續存在的陰影，這些痛苦的回憶並非在戰爭結束後就可以輕易擺脫與遺忘。

    4.(B)並非民族衝突，而是讓德國知道他們的盟國皆已投降，主要是削弱德國參戰的士氣與意願。(C)資料一為第一次世界大戰，德國與奧地利同一陣線，屬於同盟國，資料二為第二次世界大戰。(D)美軍是用空投單進行戰爭宣傳，而非干預日本電臺。

    5.(B)東德的特務機構。(C) 1942 年舉行，德國納粹高層討論「猶太人問題最終解決方案」的會議。(D)為納粹集中營。

    6.(A)德國總理的演說內容可看出，德國對於過往納粹政權的殘暴統治加以批評並進行反省，且「人們有義務協助青年理解」，代表就是要將過往的錯誤糾正，並且教導青年不要重蹈覆轍，符合釐清真相並反思歷史的範疇。

    7.題文敘述是指中國共產黨以教育控制人民思想，並傳達政府政策及意識型態，而在選項中，(C)納粹政權也是以學校課程灌輸青年反猶太的觀點，其政府採行的手段與題文內容相符。

    8.根據題幹所述，可知美國隊長的角色突顯了美國價值，富含正義、自由的精神，必須全力對抗邪惡勢力，而創作時間為 1941 年，正逢二戰期間，因此邪惡勢力應該指的是軸心國家，像德國納粹等法西斯政權，故選(D)。(A)英國較早參與二戰，應該會是英國較需要美國的支援。(B)無法從題文中看出。(C)應是喚起人民犧牲奉獻的愛國精神，以鼓舞人民參戰。

    9.(C)關鍵為國家轉型為民主政體後的新政權，對轉型正義所採取的手段為「選擇性的遺忘」，此種處理方式可推測是西班牙。西班牙政府在 1975 年開始民主化後，當時不處理威權時期的不正義問題是朝野的共識，目的則是以利新政府施政，而《大赦法》便是在這樣的時空背景下頒布的。

    10.關鍵字為「誘騙」、「強迫」的手段，且會在「經濟上拿到微薄的補貼」，但在戰爭當下或結束之後仍受到巨大的痛苦，還會被貼上沉重的標籤，符合這些情況的，應屬(C)最符合。(A)(B)(D)雖然也會遭受巨大的痛苦，但這些人並非有被誘騙、強迫做某事，還會在戰後被負面貼標籤而痛苦一輩子，只有在戰時受到性暴力的女性，不僅非出於自願，還會被世人投以異樣眼光而艱苦生活。

    11.(A)未必如此，現代化的總體戰是否能獲勝，很大的程度要看該國的經濟動員能力，而共產主義的國家在經濟發展上不見得比資本主義來的好。(B)主要是看對於全體人民動員的程度，而非快速擊敗敵人。(C)關鍵為能運用的資源，以及政府動員的程度。

    12.這部電影名為《拆彈少年》，劇情是在描寫戰爭時期遭到德國占領的丹麥，在 1945 年二戰結束後，丹麥將對德國的仇恨轉移到被俘虜的德國男孩身上，要求他們徒手清除地雷，顯示國家的仇恨並沒有隨著戰爭結束而停止，故答案選(D)。(A)題幹敘述與環境生態的汙染無關。(B)丹麥要求清除地雷的為德國戰俘，並非難民。(C)電影圍繞在戰勝國對戰敗國的仇恨延續，並非賠償補救。

    13.(A)並未特別預設為原住民女性，資料二的詹德坤便為男性。(B)根據故事改編，並借用媒體力量宣傳，但目的並非宣傳國語教育成功，而是鼓舞臺灣人民認同和參與戰爭。(D)皆為對內宣傳，鼓勵人民投入總體戰，並提升愛國意識。

    14.(A)防彈少年團為南韓的偶像團體，因此在韓戰時，是與北韓為敵，與美國為友，而中國當時在毛澤東的領導下，發起抗美援朝運動，幫助北韓對抗南韓與美國，因此雙方立場不同，自然會發生爭端。

    15.根據題文所述，在戰事陷入僵局後，人民對戰爭的目的開始產生懷疑，政府便針對「為何而戰」進行宣導，可見宣傳乃是為了強化參戰原因和塑造戰爭的必要性，故答案選(B)。(A)(C)為了化解人民對戰爭的質疑，因此政府決定重視宣傳戰，以強化參戰原因和塑造戰爭的必要性，與是否取得關鍵戰役的勝利，或是為了盡快結束戰爭、降低傷亡並無關連。(D)題文中並未提及維持社會秩序的相關內容。

    16.這位學者說到「遭到驅逐或遣返」、「受到戰爭遺留的破壞與傷害影響」、「成為當地人發洩的對象」、「戰爭帶來的新一輪對立」，可看出該學者是站在戰敗者，即德國人民的立場同理其遭遇，並反思戰爭帶來的傷害與對立。(A)題文敘述中並無出現對德國的譴責，而是在說明同情戰後被驅逐的德國人民。(B)題幹中並無探討戰爭對人口流動的影響。(D)題文中並未提到呼籲大眾消弭種族紛爭的相關內容。

    17.從題文提及「對人權的無知、忽視與輕蔑乃是公眾不幸與政府腐化的唯一原因」、「闡明人權自然的、不可讓渡的及神聖的性質」、「以便公民們……，可以永遠是導向憲法的維護與全人類的幸福」等內容判斷，其理論應該受到盧梭的公共意志理論影響，主張國家需保障人民應有權利，故答案選(B)。

    18.題文關鍵為戰犯「依戰爭罪行不同，分別被處以不同刑責」，可以判斷紐倫堡大審的目的是追究戰爭責任，故選(D)。(A)並非報復，而是訴諸司法審判。(B)被告不能主張依上級命令行事來脫罪。(C)根據法庭的審判而非政治立場。

    19.戰爭前後，各國成立專屬機構負責宣傳戰，並且在生活各方面都有為戰爭宣傳的情況出現，像是新聞與檢查、文化娛樂等領域，可見作為宣傳機構的設立與戰爭活動日常化有關。(A)全方面都涵蓋，並非是先從對內再對外。(B)於今日因為網路、社交平臺氾濫，宣傳戰將會有更多不同的型態。(D)宣傳戰只是現代戰爭的一環，無法消弭戰爭暴力殘酷的一面。

    20.關鍵為人民可藉由調閱與自己有關的史塔西檔案，了解東德時期自己被監控的過往，而還原歷史真相，因此答案應為(A)。

    21.緬甸過去曾受軍政府統治，翁山蘇姬上臺後推動民主改革，但因此次政變，政權重回軍方手上，先前翁山蘇姬的改革遭到中斷，使得人民自由再次受限，可見政局的動盪不利民主政治的發展，故選(C)。

    22.題文提及「一戰」、「海軍使用水雷構築起一條封鎖線」、「打擊德國的力量」，可以推測這本書中的「我國」應為協約國陣營，且曾採取海上封鎖政策與德國抗衡之國家，應該是英國，而當時英國所採行的策略應該為截斷德國物資的貿易運輸，而非持久戰，故答案選(C)。

    23.根據題幹所述，可知像是羅德這種曾經為了開發經濟，而迫害南非人民的爭議人物，是否要設置銅像，或是要拆除紀念銅像，乃是一種對於人權重視與否的象徵，故對轉型正義來說是相當重要的課題。(B)是抨擊新帝國主義對殖民地人權的侵害。(C)題幹中所述「羅德僅是時代的產物」，說明每一時代的價值觀有別，而非一成不變。(D)支持保留銅像者未必是支持白人至上主義。

    24.〈人權和公民權宣言〉的內容中顯示，除了重視人權、自由、平等概念外，也強調人民應服從法律制度，故答案選(D)。(A)題文中無法看出能消除迷信與落後的內涵。(B)應是法律與人權相得益彰而不是互相衝突。(C)無法由宣言的條文看出人民與政府的立場是否相左。

    25.(A)應該是他們在 1930 年代末〜 1950 年代初的戰爭經歷，因為除了二戰，還有國共內戰與韓戰。(C)國共內戰時的目標應是對抗中共的軍隊，國民政府撤退來臺後，目標才改為反攻大陸。(D)韓戰爆發後他們的敵人從中國人轉變為美國人。

    26.題文指出這場革命在「爭取國家民主轉型」、且當時突尼西亞有「警察濫權」、「當地媒體遭到控管」、「政府也控制網站用戶的密碼和反抗言論」等現象，可知突尼西亞原為民主化程度不高的國家，其統治者對人民施展國家暴力，侵害言論自由等情況時有所聞，故答案選(B)。

    27.(A)(B) 1970 年代較關注司法審判的結果與輕重。(B)冷戰後因對立減少，故轉型正義的訴求轉為平反政治犯。(D)先了解真相並以和解為目的。

    28.慕尼黑凱旋門重建後，特別留下了戰爭的痕跡，沒有刻意描述戰爭中的英勇，更沒有華麗的裝飾，只在空白的牆面留下一段話：「獻給勝利，毀於戰爭，警醒和平」，用意在讓人民反思戰爭帶來的危害，並珍惜和平的重要，故答案選(D)。

    29.(A)並非以民生相關設施為主要攻擊對象。(B)戰爭造成大量人口減少雖為事實，但從文中無法看出人口減少與價格之間的關係，而是政府在戰爭期間對於管理經濟的情況。(D)文中主要著重占領地區在軍政管理下造成的傷害，而非物資破壞。

    30.原本八年抗戰的時間起迄為 1937 ～ 1945 年，是指國民政府領導下的中國在盧溝橋事變發生後對日本的全面抗戰。中共將抗戰起始年延伸 14 年，便是從 1931 年算起，主要是配合資料二「中共領導抗日」的歷史解釋，掌握抗戰歷史的主動權，故答案選(B)。(A)資料未提到新史料的研究。(C)日本軍國主義並未再起。(D)主要在宣揚「中共」的抗戰意識，並非「中國」的二戰貢獻。

    31.天寶晚年因正逢政局衰退，甚至爆發安史之亂，而敦煌縣中的田簿均無註記，可能顯示當時唐朝政局已無力管控國家土地的分配，且人民散逸難以實施均田制度，故答案選(D)。(A)只是沒有註記，但仍有田簿，代表應該還是有實行均田制。(B)唐德宗年間才開始實施兩稅法。(C)開元年間有田簿的註記代表有實際實行。

    32.題文關鍵為清代「農者十倍於前，而田不加增」，代表從事農業者比過往多十倍，卻沒有增加耕種的土地，顯示人口不斷增長，導致耕地不足的現象。

    33.題文關鍵為中原地區的發展速度放慢，南方江南地區則是開始逐漸經濟起飛，且「鎮市網絡初步形成、商品經濟繁盛」，「江南地區的經濟實力開始趕上並日趨超過傳統的中原經濟區」，可判斷答案應為(C)。(A)大量人口南移，開始開發江南，但經濟發展仍然是以北方為中心。(B)安史之亂後經濟中心開始往南移動，然而尚未能完全超越過北方，但題文的敘述可看出此時經濟發展已經開始趕上中原地區，中國的經濟重心完成南移要等到靖康之禍後。(D)若是明清之際，就不會有開始趕上，或是鎮市網絡初步形成的情況，因為此時南方的經濟發展早已超越北方，且專業市鎮已經發展得相當成熟。

    34.(A)內朝的出現乃是因為皇帝顧忌丞相的權位，想要爭奪大權而出現的產物，然而等到內朝首領逐漸取代丞相的職權後，又會轉而變成外朝領袖，原本丞相的權力因此而被削弱。

    35.宋元的海外貿易為「鼓勵船隻到海外競爭國際市場」，明朝初期則是採行「免稅」鼓勵「外國」來中國港口與中國人民貿易，代表當時明朝的目的是招徠周邊各國至中國來，貿易不是重點，而是需要展現出中國是天下的中心，各國都想要來到中國與之朝貢貿易，提升中國對外國厚往薄來、懷柔遠人的態度，以「四夷賓服、萬國來朝」作為最高目標，故答案選(D)。

    36.根據資料的描述，此人本來在軍隊當中發展得很好，但因為他的父親從荷蘭回來找他，具有「海外關係」因此不被政府信任，而被迫離開軍隊，可見此時的中國政府具有相當強烈的排外意識，對具有海外關係的華人也是非常的不友善，這種情況只有在毛澤東時期才會出現，因為意識型態的關係，毛澤東的中共政權把歐美等國視為敵人，而與這些國家有關係的中國人，有可能在文革期間被批鬥。

    37.從題文內容可知土地稅（地丁）本來占 61.6 ％，後來卻降為 26.2 ％，而洋稅的比例卻逐漸升高，甚至超過的土地稅，代表國家對外貿易的發展愈發重要。(A)(D)從歲入來源的轉換無法得知此種訊息。(B)開港通商是在 1842 年，距離光緒年間已經相差甚遠，很難驗證開港通商與經濟成長的關聯。

    38.(A)一二八事變發生於 1932 年，日記寫於 1927 年，時間上並不相符。(B)當時發生清黨事件，但共產黨並非轉移到長江下游，而是轉移到江西、福建、或長江流域中游等地展開起事。(C)袁世凱已於 1916 年過世。(D)根據題幹所述可知，租界（由列強管理之地）的發展與華界的差距甚大，而列強可以在上海劃分租界與鴉片戰後列強與中國簽訂條約所致。

    39.根據碑文的內容，「或將貨品存放於此，或暫時借居於此」，便可知會館的作用為暫時存放貨物的中途站。

    40.在幕府時代，因為大權從天皇身上旁落到幕府大將軍之手，因此三大幕府時代的將軍，都不斷強調自己與天皇是具有血緣關係的，此舉乃是為了證明自身獲得政權的合理與正統性。因此德川家康不斷更改譜系，便是為了證明自身為天皇旁支的後代，故答案選(D)。

    41.(A)從三則資料可以看出，華人在美洲「成為囚犯」被拘禁在木屋當中，甚至被通知要遣返回中國，根據這些現象可推知當時應該是 1882 年《排華法案》通過後，發生在美國華人界的現象，華人移民遭美國扣押，最後被驅逐出境。

    42.華人進入美國會被官方拘留主要的原因乃是 1882 年美國因排華風氣盛行，且國會通過《排華法案》，除了限制華人移民外，也規定在美國居住的華人須於一年內向政府註冊以證明其合法居留權，如果沒有此證明便會被捕，然後立即被驅逐出境，這一法案導致華人難以移民進入美國。

    43.資料一從「王田」制度的頒布又不准買賣奴隸可得知此時應為王莽時期，資料三為唐朝安史之亂後因戶籍散佚，均田制難以實行，因此在唐德宗時期推行兩稅法的改革，而資料二的〈河北民〉是北宋王安石的詩作，從詩作的內容可看出河北（黃河以北）地區的人民，「生近二邊」指的是與契丹、西夏接壤之處，生活辛苦、學習耕織，繳納賦稅給政府，卻被拿去「事夷狄」，指的是當時輸送歲幣一事，因此大家都想往南方發展，南方的經濟發展豐衣足食，較北方為好。故根據時間順序分別是(B)資料一→資料三→資料二。

    44.題文關鍵為「先度其數而賦於人，量出以制入」、「人無丁中，以貧富為差」，可看出這個賦稅制度是以資產多寡作為賦稅的標準，且「秋、夏兩徵之」，便是兩稅法的內涵。

    45.(B)只有資料一有提到東晉的僑姓與吳姓，資料二已經是以南朝的世族發展為主要論述，而非東晉。(C)兩則資料都未提到經濟優勢。(D)兩則資料都未提到審美觀。

    46.資料一便已提到「東晉政權的建立，是仰賴南北世族相互合作妥協才出現的」，而屬於南徙北人的王導為了避免與吳人世族衝突，採許了諸多的妥協，故答案選(A)。(B)資料二中說明世家大族不願意與寒門通婚的理由，是會讓他們的門第下滑，難以維持政治前途。(C)主要論述的內容並未提及輕易任官，而是如何在這些時代維持世族的優勢。(D)兩則資料都沒有提到宗教信仰的相關論述。

    47.(A)根據資料一的內容分析，可知租庸調的稅制比漢朝來的更輕。(B)資料一中提到「西晉戶調……比唐多六倍」。(D)展現「為民制產、輕徭薄賦」的特色。

    48.資料一中可看出唐代的租庸調跟漢、西晉、北魏相比較，可證明唐代租庸調的負擔是較輕的，而資料二也是透過與漢朝比較，展現出租庸調的特色。

    49.從東漢開始，便陸續有許多胡族內徙到中國境內與中國人民混雜居住，而敘述中也指出江統論述著重「關中的氐、羌和并州的匈奴，追溯各族遷居內地的經過」，便可得知當時已有許多胡族遷徙至內地的情況。

    50.(B)江統曾經提出「徙戎論」主張把居住在內地的胡族遷徙到塞外去，以防止未來胡人起兵造反，成為中國政府的隱憂。

    51.孝文帝採行的政策，像是「興文教、斷北語、禁胡服、通婚姻、改姓氏等」都是針對胡人向漢人文化模仿學習，因此會造成未漢化的鮮卑人不滿，屬於(B)胡族漢化。

    52.根據資料二，宇文泰創立府兵制，將鮮卑人與漢人豪門武力都納入軍隊當中，形成了關隴集團，可見將胡人與漢人融匯在一起，故應(D)為胡漢融匯。

    53.(A)北魏雖分裂，但不能算是徹底失敗，因為還是造成部分的胡族融入漢族之中，只是說成效有限，無法達成胡漢融匯，反而引發內鬨。(B)宇文泰的關隴集團後來增強西魏的國力，奠定未來統一天下的基礎，因此算是成功。(D)並未形成胡文漢武，胡人與漢人皆有從武者，亦有文人，並未分得這麼絕對。

    54.根據題文所述，南朝皇帝對外族採取派軍出征、強力掃蕩，屬於討伐政策，而打仗的地區在長江、漢水以北，廬江以南，那應該是在南朝的北方。

    55.魏晉南北朝時期的中國，政局分裂，南朝的政權重心位在長江流域一帶，但當時北方也有強大的政權出現，甚至日後南朝宋被北方的政權兼併，因此中國歷史重心仍在黃河流域，但由於南朝政權位於南方，因此江南一帶也開始得到開發，這些政權甚至征討蠻荒，代表南方也開始逐漸發展。

    56.惠能的經典書籍，能夠向傳統佛書經典挑戰，便代表佛教傳入中國後，發展出新創的思想，並對傳統造成了挑戰。(B)應改為釐定新的清規戒律。(C)應改為融合中國固有的思想。(D)應改為門閥式的僧團組織。

    57.(B)無論是禪宗理論的出現、僧團門閥化、制定新的戒律與融合中國思想來闡釋佛教，都顯示了佛教在中國的傳播開始發展出新的內涵，與原始的佛教已經出現的差異，形成佛教中國化的現象。

    58.從題文所述，得知苗民與客家人之間因爭奪資源而發生糾紛，然後造成衝突，因此與經濟衝突與族群問題相關，故應選(D)。

    59.(D)題文資料的結論是苗民常被客民侵奪資源，而地方審判不公故會爆發苗亂，而從苗民的頭目吳半生的敘述，便可以作為佐證，證明結論所述的內容是正確的，因此這段資料可作為歷史事件理解與論述的證據。

    60.(A)根據資料一應該是從陸路到達印度，因為從甘肅出玉門關，然後「孤遊沙漠」在歷經多國才到印度。(B)義淨從廣州「登舶」即登船，經過印尼、馬來半島等國到達印度，故應該是由海路前往。(C)唐代到達印度的僧侶大概有 60 多位，從海路前往的就有 30 多位，所以陸路人數並未遠多於海路，也許各占一半左右或海路占比多一些；但從三則資料來看，陸路或海路都能到達印度，且往來頻繁，代表交通發達，故選(D)。'
