  group_stem: '資料一：以租而言，孟子以什一之稅為王者之政；而漢制則什五稅一，又常收半租，故為三十稅一。若以畝收一石計，唐制只是四十而稅一，較之漢制更輕更寬大。以庸而言，漢制更役一歲一月，唐制則只二十天，只有漢制的三分之二。調輸布帛，與漢口賦驟難相比。惟西晉戶調，丁男之戶，歲輸絹三匹，綿三斤，比唐多六倍。北魏均田，一夫一婦調帛一匹，比唐亦多一倍。

    資料二：租庸調制稅收專案列舉分明。此點漢代的租稅制度或可相比，更重要的是一種「為民制產」的精神。及丁則授畝，年老則還官，此層更為漢制所不及。在這一個低稅制度下，農民自可安居樂業。'
