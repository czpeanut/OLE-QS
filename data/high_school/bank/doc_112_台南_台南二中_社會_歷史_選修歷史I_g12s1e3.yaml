  - label: D
    content: 綜合上述資料，唐代對外海陸交通發達
  group_stem: '資料一：玄奘，貞觀元年（627 年）8 月，潛行經秦州、蘭州、涼州至瓜州（甘肅），過玉門關，孑然一身，孤遊沙漠，上無飛鳥，下無走獸，復無水草。輾轉因循達高昌境，高昌王送至西突厥。可汗甚喜，復遣騎護送至所部諸國。由是經過鐵門，親歷貨羅等十三國，而至北印度。復歷諸國，至中印度。

    資料二：義淨，初至番禺（廣州），得數十人，及將登舶，餘皆退罷。乃於是年 11 月，附波斯舶，未隔兩旬，南行至佛逝，經停 6 月，海行 15 日至蘇門答臘東岸。又海行 15 日至馬來西岸，北行 10 日餘至裸人國。從此更半月餘，望西北行，經孟加拉灣各海岸，迄 673 年 2 月，遂達東印度之南岸登陸。

    資料三：唐代沙門（僧）敘述南海史地最詳者，莫過義淨，其所著《南海寄歸內法傳》及《大唐西域求法高僧傳》，共載 60 餘人，其中取道南海前往印度者，多達 30 餘人，其所著足資參考。'
  answer:
  - D
