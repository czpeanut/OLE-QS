  group_stem: '下列是一段有關清代前期乾嘉年間苗亂的資料：

    苗亂的原因，據苗目吳半生供稱「上年冬天，聽見各寨都出了癲子，發癲的時候，就施刀弄槍要殺客民。又說我們出了苗王，也不知是哪一個。今年正月，苗子石三保糾約貴州的石柳鄧，湖南的吳隴登，說苗子田地都被客民占了，心裡不甘，聲言各寨的苗子都要幫他奪回耕種，所以遠近各寨都想趁此搶奪田地。石三保又邀平隴的吳八月到黃瓜寨替他主謀，到處邀人，小的也就發起癲來。石三保就同蘇麻寨一帶苗子都說小的是吳王轉世，邀小的一同起事，凡有客民房屋一概燒了，搶的糧食就散給打仗的苗子做口糧。」據石三保供稱「苗子們從祖輩止知道有個吳三桂是吳王，所以說是吳三桂轉世，就號為吳王的。」易言之，苗眾倡亂已非一日，苗民被客民盤剝，漸多失業，地方審斷不公，遂敢於聚眾焚搶。'
  answer:
  - D
  answer_status: verified
