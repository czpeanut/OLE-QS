- id: doc_110_桃園_武陵_數學_數乙_g12s1e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 求下列各極限值 ( 若無極限值，答案請寫“不存在”) (1) $\lim_{n\rightarrow \infty}$(($\frac{1}{n}$＋6 ) ($\frac{n+2}{2n+1}$－1 ))＝＿＿＿＿。 (2) $\lim_{x\rightarrow 2}\frac{x^{2}+3x+5}{2x^{2}+x+3}$＝＿＿＿＿。 (3) $\lim_{x\rightarrow 3}\frac{x^{3}-27}{x-3}$＝＿＿＿＿。 (4) $\lim_{x\rightarrow 1}$($\frac{3}{x^{2}+x-2}$－$\frac{x}{x-1}$)＝＿＿＿＿。 (5) $\lim_{n\rightarrow \infty}\frac{1+3+3^{2}+3^{3}+\cdots +3^{n}}{2^{n}+3^{n}}$＝＿＿＿＿。
  answer:
  - (1)－3；(2)$\frac{15}{13}$；(3) 27；(4)－$\frac{4}{3}$；(5)$\frac{3}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: (1) $\lim_{n\rightarrow \infty}$(($\frac{1}{n}$＋6 ) ($\frac{n+2}{2n+1}$－1 ))＝( 0＋6 ) ($\frac{1}{2}$－1 )＝－3。 (2) $\lim_{x\rightarrow 2}\frac{x^{2}+3x+5}{2x^{2}+x+3}$＝$\frac{4+6+5}{8+2+3}$＝$\frac{15}{13}$。 (3) $\lim_{x\rightarrow 3}\frac{x^{3}-27}{x-3}$＝$\lim_{x\rightarrow 3}$( $x^{2}$＋3x＋9 )＝9＋9＋9＝27。 (4) $\lim_{x\rightarrow 1}$($\frac{3}{x^{2}+x-2}$－$\frac{x}{x-1}$)＝$\lim_{x\rightarrow 1}\frac{3-x(x+2)}{(x+2)(x-1)}$＝$\lim_{x\rightarrow 1}\frac{-(x+3)(x-1)}{(x+2)(x-1)}$＝$\lim_{x\rightarrow 1}\frac{-(x+3)}{x+2}$＝$\frac{-(1+3)}{1+2}$＝－$\frac{4}{3}$。 (5) $\lim_{n\rightarrow \infty}\frac{1+3+3^{2}+3^{3}+\cdots +3^{n}}{2^{n}+3^{n}}$＝$\lim_{n\rightarrow \infty}\frac{\frac{3^{n+1}-1}{3-1}}{2^{n}+3^{n}}$＝$\lim_{n\rightarrow \infty}\frac{3\cdot 3^{n}-1}{2(2^{n}+3^{n})}$＝$\lim_{n\rightarrow \infty}\frac{3-(\frac{1}{3})^{n}}{2[(\frac{2}{3})^{n}+1]}$＝$\frac{3}{2}$。
- id: doc_110_桃園_武陵_數學_數乙_g12s1e1_s2_2
