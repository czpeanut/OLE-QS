  stem: 已知f (x)＝( x－16 )$^{2}$ ( x－17 )$^{2}$＋3x，求證：至少有一實數c，使得f (c)＝50。
  answer:
  - 詳見解析
  answer_status: verified
  answer_source: answer_key
  explanation: 設f (x)＝( x－16 )$^{2}$ ( x－17 )$^{2}$＋3x， 則f (x) 為連續函數，因f (16)＝48，f (17)＝51， 故f (16)＜50＜f (17)，根據中間值定理知，存在一個介於16與17之間的實數c，使得f (c)＝50。
