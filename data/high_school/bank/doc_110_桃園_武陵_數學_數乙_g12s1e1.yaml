  stem: '有一個面積為32的正方形，依以下的步驟將其分割著色。 第1步驟：將其等分成4個小正方形，並將左下角的正方形塗上黑色，如第1圖所示 第2步驟：將剩下3個正方形再分別等分成4個更小的正方形，並將左下角的正方形塗上黑色，如第2圖所示 依照這樣的規律繼續分割著色下去，並設$S_{n}$表示在第n步驟後所有黑色正方形的總面積。 第1圖 第2圖 第3圖

    (1) 求$S_{1}$ , $S_{2}$ , $S_{3}$的值。

    (2) 求無窮多個黑色正方形的面積總和 ( 即$\lim_{n\rightarrow \infty}S_{n}$＝？)'
