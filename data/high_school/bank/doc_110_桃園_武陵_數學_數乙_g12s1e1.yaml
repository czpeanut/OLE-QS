- id: doc_110_桃園_武陵_數學_數乙_g12s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些選項是正確的？
  options:
  - label: A
    content: $\lim_{n\rightarrow \infty}$(－$\frac{1}{3}$)$^{n}$＝0
  - label: B
    content: $\lim_{n\rightarrow \infty}$($\frac{1}{3}$(－1 )$^{n}$ )＝0
  - label: C
    content: $\lim_{n\rightarrow \infty}\frac{3^{n}+1}{4^{n}-1}$＝0
  - label: D
    content: $\lim_{n\rightarrow \infty}$( $cos^{2}$ n＋$sin^{2}$ n ) 不存在
  - label: E
    content: $\sum_{i=1}^{5}$t＝15
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：因－1＜－$\frac{1}{3}$＜0，故$\lim_{n\rightarrow \infty}$(－$\frac{1}{3}$)$^{n}$＝0。 (B) ×：$\lim_{n\rightarrow \infty}$($\frac{1}{3}$(－1 )$^{n}$ ) 不存在。 (C) ○：$\lim_{n\rightarrow \infty}\frac{3^{n}+1}{4^{n}-1}$＝$\lim_{n\rightarrow \infty}\frac{(\frac{3}{4})^{n}+(\frac{1}{4})^{n}}{1-(\frac{1}{4})^{n}}$＝0。 (D) ×：$\lim_{n\rightarrow \infty}$( $cos^{2}$ n＋$sin^{2}$ n )＝$\lim_{n\rightarrow \infty}$1＝1。 (E) ×：$\sum_{i=1}^{5}$t＝t＋t＋t＋t＋t＝5t。 故選(A)(C)。
