  stem: 一無窮等比級數的首項$a_{1}$＝0.$\overline{2}$，第二項$a_{2}$＝0.0$\overline{4}$，則此級數的和為＿＿＿＿。
  answer:
  - $\frac{5}{18}$
  answer_status: verified
  answer_source: answer_key
  explanation: $a_{1}$＝0.$\overline{2}$＝$\frac{2}{9}$，$a_{2}$＝0.0$\overline{4}$＝$\frac{4}{90}$＝$\frac{2}{45}$， 公比r＝$\frac{a_{2}}{a_{1}}$＝$\frac{4}{90}$×$\frac{9}{2}$＝$\frac{1}{5}$， 所以此級數和為$\frac{a_{1}}{1-r}$＝$\frac{\frac{2}{9}}{1-\frac{1}{5}}$＝$\frac{5}{18}$。
