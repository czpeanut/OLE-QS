  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列關於國際貿易理論的敘述，何者正確？
  options:
  - label: A
    content: 一國應進口具有比較利益的產品
  - label: B
    content: 劣勢國永遠不具有貿易資格
  - label: C
    content: 兩國必須各自擁有一項具有絕對利益的產品，方可進行貿易
  - label: D
    content: 劣勢國仍可選擇生產劣勢較小的產品，與他國進行貿易
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 比較利益為國際分工的基本理念，何處可降低最多的生產成本、獲取較高的利潤，便將生產線移至當地；故劣勢國仍可選擇生產劣勢較小的產品，即機會成本低的產品。故選(D)。(A)一國應生產具有比較利益的產品出口。(B)劣勢國亦有比較利益，具有貿易資格。(C)兩國必須各自擁有一項具有比較利益的產品，即可進行貿易。
