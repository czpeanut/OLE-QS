  stem: 陳先生是會計系畢業，「對於記帳的相關工作做得又快又好」，他同時也是一位業務高手，獲得許多客戶的稱讚。當他自行創業，開設公司之後，決定請一名會計幫忙記帳，自己則專心跑業務，請問陳先生的決定，符合下列哪一個經濟學的理念？
