- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 澳洲已簽訂或談判中的 FTA，亞洲國家及地區占了七成左右，紐西蘭已生效的 FTA 也是以亞洲為主。上述現象主要是受下列何項因素影響？
  options:
  - label: A
    content: 紐澳在亞太地區國際分工中提供勞力資源
  - label: B
    content: 資源具互補性
  - label: C
    content: 皆為南島語族
  - label: D
    content: 地緣關係接近
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D) 1973 年英國加入歐盟後，澳洲與紐西蘭與其經貿關係重挫，因此近年來，兩國開始與鄰近的東亞國家建立經貿交流、脫歐入亞，除了看中東亞的經濟發展外，也節省運費、減少運輸時程，更有利於產品外銷。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 泰國菜的口味偏重酸、甜、辣，善於搭配各種自然食材和用多種香料調味，最常用的幾種調料有：泰國朝天椒、泰國檸檬、咖哩醬等，泰國菜的特色與哪一環境因素最相關？
  options:
  - label: A
    content: 殖民文化
  - label: B
    content: 氣候溼熱
  - label: C
    content: 宗教信仰
  - label: D
    content: 主要族群來自中國
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 有研究指出，適當的攝取辣椒當中的辣椒素，能夠促進排汗，將體內的溼氣與熱氣排出，泰國位處熱帶，故泰國菜常以辣椒入菜，與(B)氣候環境溼熱相關。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 近年印度資訊科技產業興起，為印度帶來發展契機。請問下列何者為印度發展資訊科技產業的條件？(甲)完整的基礎設施(乙)與美國矽谷時差半天(丙)較低廉的勞工工資(丁)具數理能力的優秀人才(戊)人口年輕且勞力充沛
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁戊
  - label: E
    content: 乙丙丁戊
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (E)印度的科技產業崛起，主要因素為：(乙)與美國的時差半天；(丙)低廉的勞力；(丁)眾多優秀的數理人才；(戊)人口年輕且勞力充沛。(甲)印度基礎設施並不完善。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 十七世紀，一位荷蘭船醫在航海日記上如此描述：「麻六甲，位居麻六甲海峽最窄的戰略位置，能夠注視與控制海上交通。巨大的□島阻隔著風，麻六甲為受到風向擺布的船隻提供一個安全的港，來自西方的我們受西南季風之助，穿越印度洋，船抵麻六甲，並在此處停留數個月，直到風向改變，我們才順利啟航返家。」文中所提及的□島為何？
  options:
  - label: A
    content: 婆羅洲島
  - label: B
    content: 蘇門答臘島
  - label: C
    content: 爪哇島
  - label: D
    content: 峇里島
  - label: E
    content: 新幾內亞島
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹的敘述提到「受西南季風的幫助抵達麻六甲」以及「等待數月後風向改變返航」，可見船員是利用風帶季移的特性來往返歐亞兩地。而當船員抵達麻六甲後，□島阻隔著西南風，使船能夠避風休息，□島應位在麻六甲的西南邊，為(B)蘇門答臘島。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年來，馬來西亞和印尼成為全球棕油主要輸出國。印尼棕油產量目前居世界第二位，但油棕種植面積和產量節節上升，直逼馬來西亞。印尼油棕業有哪些條件較優於馬來西亞？(甲)熱帶雨林降水量較為豐沛(乙)加工技術較高(丙)工資較為低廉(丁)人口眾多勞力充沛(戊)糧食充足
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲戊
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
  - label: E
    content: 丁戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)印尼較馬來西亞發展來的晚，因此近年來，印尼藉著(丙)低廉的工資與(丁)充足的勞力，使經濟與產業蓬勃發展。(甲)馬來西亞與印尼皆為熱帶雨林氣候；(乙)加工技術與經濟發展程度有關，馬來西亞應優於印尼；(戊)糧食充足和油棕產量多寡無關。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 印度及巴基斯坦經常發生武裝衝突，雙方的角力使南亞的區域和平蒙上一層陰影。這兩國衝突的主要原因為何？(甲)主權(乙)宗教(丙)民族(丁)階級
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)印度與巴基斯坦間，有(甲)克什米爾主權的爭議，且兩國的(乙)宗教不同，是導致衝突的主因。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 澳洲有「島洲」之稱，離各大洲均超過 10,000 公里，形勢孤立。下列當地的哪一現象與這種孤立位置關係最密切？
  options:
  - label: A
    content: 許多特有種動植物
  - label: B
    content: 原住民人口占總數 80 ％
  - label: C
    content: 氣候上乾燥性質顯著
  - label: D
    content: 鄰近的海洋對澳洲發展影響甚小
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)澳洲的位置孤立，因而使該地出現許多特有種的動植物，例如：袋鼠、袋熊、無尾熊等。(B)(C)(D)的描述皆與問題無關。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 澳洲將 1 月 26 日這個歐洲人首次登上澳洲大陸的日子定為澳洲國慶日，但對於澳洲的原住民來說，則是白人入侵的日子。示威者在各大城市發起遊行，抗議國慶日活動，要求澳洲人「付房租」。澳洲政府曾經採取哪一政策，強行將原住民兒童帶離原生家庭，甚至有被送回英國接受大學教育者，嚴重傷害原住民族文化社會？
  options:
  - label: A
    content: 多元文化政策
  - label: B
    content: 種族隔離政策
  - label: C
    content: 同化政策
  - label: D
    content: 城鄉分隔政策
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 澳洲曾於 1905 年至 1967 年施行(C)同化政策，將原住民的兒童強行帶離家庭，強迫其接受白人教育，常被稱為「被偷走的一代」。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 在十九世紀時，遠在南半球的澳洲也成為吸引華人移入的地區之一，就推拉理論而言，澳洲主要具備下列何種拉力？
  options:
  - label: A
    content: 開採礦產提供大量工作機會
  - label: B
    content: 地廣人稀而且文化相似性高
  - label: C
    content: 當地自然環境相似
  - label: D
    content: 英國政府提供移民開發資金
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)澳洲在 19 世紀時爆發淘金熱，採礦需要大量的勞力，正好提供了華人大量的工作機會。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 孟加拉是世界上最容易發生水災的地區之一，除了熱帶風暴，尚有哪些自然因素導致當地水患頻仍？(甲)沖積扇範圍廣大(乙)三角洲地勢低平(丙)河流下游匯流後水量大(丁)夏雨集中
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)孟加拉該地(乙)地勢低平、(丙)下游匯聚的水量大、(丁)熱帶季風氣候，降水集中於夏季，是導致水患頻仍的主因。(甲)孟加拉位於恆河三角洲。
