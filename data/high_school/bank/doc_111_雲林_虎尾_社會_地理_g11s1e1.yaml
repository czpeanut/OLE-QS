  answer_status: verified
  answer_source: answer_key
  explanation: 位於熱帶季風氣候的印度，11 月至 2 月為乾爽宜人的涼季，該季受到(B)東北季風吹拂。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 印度的電影工業發展悠久且極具規模，年產電影可達一千餘部，產值近 20 億美元，平均每天能吸引約二千萬人進入戲院。其中最為世人所知的電影生產據點，是位於孟買的寶萊塢（Bollywood），每年出產全國約 40 ％的電影。不論是出產於何地、使用何種語言的電影，內容多能反映南亞社會的面貌，甚至諷刺社會中的「不平等」議題，並且搭配歡樂的歌舞片段以及完美的結局。但電影的內容有時卻也引發了國內的族群或宗教衝突。印度電影極受大眾歡迎，除了票價便宜外（最便宜的票價約新臺幣 10 元），還與電影內容有很大關係，下列何項「非」印度電影內容的特色？
  options:
  - label: A
    content: 突破種姓藩籬
  - label: B
    content: 內容貼近生活
  - label: C
    content: 樂舞振奮人心
  - label: D
    content: 美好的結局
  - label: E
    content: 抒發生活壓力
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)印度民眾多透過看電影來突破日常限制，塑造一個美好的願景，故電影內容並不會貼近其日常生活。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 4
  stem: 關於此國的敘述下列何者正確？
  options:
  - label: A
    content: 經濟發展落後，主要出口品包括橡膠、木材、電器與水產
  - label: B
    content: 屬熱帶莽原氣候，乾季長達 5 年，山地為高地氣候
  - label: C
    content: 多山地和丘陵，若遇暴雨則引發洪患、山洪暴發與崩塌
  - label: D
    content: 受殖民歷史影響，當地最常見的信仰中心為基督教堂
  group_stem: 東帝汶 2002 年獨立建國後，成為聯合國第 191 個會員國，是亞洲最新的國家。請問：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)東帝汶位於印澳板塊與歐亞板塊的交界處，造山運動頻繁，多山地，且暴雨後容易引發洪患。(A)東帝汶以出口石油為大宗，其餘包括觀光業、資訊科技以及農產皆為該國的重要產業。(B)東帝汶屬於熱帶雨林氣候。(D)東帝汶信仰羅馬天主教的比例高達九成，基督教教徒僅占 2.6 ％。
