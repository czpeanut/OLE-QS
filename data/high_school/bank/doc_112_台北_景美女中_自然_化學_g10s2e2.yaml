      - 181.8
      - 480.6
      - 436.3
      - 557.5
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(B)為了避免置於甲處的待測物加熱後氧化不完全，因此在乙處放置氧化銅作為氧化劑，確保所有待測物能完全被氧化。

    (C)(D)因為 $CO_{2}$(g) 與 $H_{2}$O(g) 都會被氫氧化鈉吸收，所以應將用來吸收 $H_{2}$O(g) 的過氯酸鎂放置於丙；氫氧化鈉填充於丁，用來吸收 $CO_{2}$(g)。

    (E)需稱得待測物實驗前的重量，並記錄過氯酸鎂、氫氧化鈉反應前、後的重量變化，才能算出碳、氫、氧三元素的重量。'
