    (C)熟石灰（Ca(OH)$_{2}$）為離子化合物，故為實驗式。

    (D)灰石（$CaCO_{3}$）為離子化合物，故為實驗式。

    (E)由題幹中得知石灰粉遇水產生放熱反應，故 ΔH＜0。'
