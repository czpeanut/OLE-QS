  stem: 家用瓦斯有天然氣（主成分 $CH_{4}$）或液化石油氣（主成分 $C_{3}H_{8}$）。已知同溫、同壓下，氣體體積比與其莫耳數比相等。若在同溫、同壓下，分別使同體積的 $CH_{4}$ 與 $C_{3}H_{8}$ 完全燃燒，則 $C_{3}H_{8}$ 所需空氣的量是 $CH_{4}$ 的幾倍？
