- id: doc_112_台北_景美女中_自然_化學_g10s2e2_s2_29
  section: 2
  number: 29
  type: multiple
  page: 5
  stem: 某生想利用下圖的燃燒分析實驗裝置，推導出某一僅含碳、氫、氧三種元素化合物的實驗式。實驗中利用丙、丁兩支吸收管，其中一支填充過氯酸鎂（吸收水分），另一支填充氫氧化鈉（吸收二氧化碳）。分別稱量兩支吸收管燃燒前、後重量差，即可分別算出生成的水與二氧化碳重量，進而求出各元素之重量百分率，最後求得實驗式。為了使未知化合物燃燒完全，通常需使用氧化銅。下列針對下圖的實驗裝置中，甲、乙、丙及丁處所應放置的物質與其功用的敘述，哪些正確？（應選 2 項）
  options:
  - label: A
    content: 氧化銅應放於乙處
  - label: B
    content: 氧化銅為氧化劑
  - label: C
    content: 過氯酸鎂應放於丁處
  - label: D
    content: 氫氧化鈉應放於丙處
  - label: E
    content: 實驗前、後，需分別稱得氧化銅、過氯酸鎂及氫氧化鈉的重量，才能推算出碳、氫、氧三元素的重量
  assets:
  - key: s2_29_f1
    kind: figure
    file: doc_112_台北_景美女中_自然_化學_g10s2e2/s2_29_f1.png
    crop:
