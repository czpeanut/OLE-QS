  section: 1
  number: 1
  type: single
  page: 1
  stem: 以下為三種物質之特性：(甲)紅色晶體，有延性與展性，固態與熔融態可導電；(乙)白色晶體，可溶於水，其水溶液不導電；(丙)白色晶體，無延性與展性，固態時不導電，熔融態與其水溶液可導電。則下列何者可能為此三種物質？
  options:
  - label: A
    content: (甲)—鎘；(乙)—氯化鈉；(丙)—葡萄糖
  - label: B
    content: (甲)—銅；(乙)—葡萄糖；(丙)—氯化鈉
  - label: C
    content: (甲)—紅糖；(乙)—氯化鈉；(丙)—碘化鉀
  - label: D
    content: (甲)—紅糖；(乙)—二氧化矽；(丙)—碘化鉀
  - label: E
    content: (甲)—銀；(乙)—蔗糖；(丙)—碳酸鈣
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '金屬固態可導電，且具延性與展性，故(甲)為金屬。

    (乙)可溶於水，但水溶液不導電，故可能為蔗糖或葡萄糖。

    (丙)無延性與展性，固態不導電，但熔融態與水溶液可導電，故為離子化合物，可能為氯化鈉或碘化鉀，但不為難溶於水的碳酸鈣，故選(B)。'
