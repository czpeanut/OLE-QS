- id: doc_112_台北_景美女中_自然_化學_g10s2e2_s2_27
  section: 2
  number: 27
  type: multiple
  page: 4
  stem: 石灰粉（CaO）可以防蛇嗎？據說石灰粉遇水產生放熱反應，使皮膚產生灼熱感，因此蛇才會不敢靠近，這是真的嗎？其實蛇鱗的構造與人的指甲類似，都非常乾燥，不太會與石灰作用引發放熱反應；且五金行買到的石灰粉大多是已經加過水的熟石灰（Ca(OH)$_{2}$）了！也就不會對蛇造成嚴重的威脅。下列有關石灰的相關敘述，哪些正確？（應選 3 項）
  options:
  - label: A
    content: 石灰中的粒子利用庫侖靜電吸引力相互結合
  - label: B
    content: 熟石灰的原子間僅具有離子鍵
  - label: C
    content: Ca(OH)$_{2}$ 為熟石灰的實驗式
  - label: D
    content: $CaCO_{3}$ 為灰石的示性式
  - label: E
    content: CaO＋$H_{2}$O → Ca(OH)$_{2}$，ΔH＜0
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)石灰（CaO）為離子化合物，原子間以庫侖靜電吸引力結合。

