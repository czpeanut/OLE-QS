  stem: 全球產業自動化的趨勢即將到來，並且很可能會大量取代原本的工作職位。最近一份研究報告中指出，由於機器人大量取代人力，未來十年美國銀行業將因此減少20萬個工作機會，也可能會使該行業出現史上最大的裁員潮。其中，後勤行政人員、分支機構人員與電話服務人員的職位，將因自動化而減少五分之一至三分之一，電話服務人員更將因自動化而有「戲劇性」的變化，因為現在許多聊天機器人已讓人無法辨識真假。有關上文之敘述，下列何者<u>正確</u>？
