  stem: 設 f（x）＝sin$\left( 3\left( x -\frac{\pi}{6} \right) \right)$＋5，其中$\frac{\pi}{12}\leq$x$\leq\frac{5\pi}{9}$，當 x＝α 時，f（x）有最大值 M；當 x＝β 時，f（x）有最小值 m。則下列哪些選項正確？
  options:
  - label: A
    content: α－β＝$\frac{2\pi}{9}$
  - label: B
    content: β＝$\frac{5\pi}{9}$
  - label: C
    content: M＝5＋$\frac{\sqrt{3}}{2}$
  - label: D
    content: m＝$\frac{9}{2}$
  - label: E
    content: $f\left( \frac{5\pi}{18} \right)$＝$f\left( \frac{7\pi}{18} \right)$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{\pi}{12}\leq$x$\leq\frac{5\pi}{9}$

    ⇒ $3\left( \frac{\pi}{12} -\frac{\pi}{6} \right)\leq3\left( x -\frac{\pi}{6} \right)\leq3\left( \frac{5\pi}{9} -\frac{\pi}{6} \right)$

    ⇒ －$\frac{1}{4}$π$\leq3\left( x -\frac{\pi}{6} \right)\leq\frac{7}{6}\pi$

    當$3\left( x -\frac{\pi}{6} \right)$＝$\frac{\pi}{2}$時，f（x）有最大值＝1＋5＝6＝M

    此時 x＝$\frac{\pi}{6}$＋$\frac{\pi}{6}$＝$\frac{\pi}{3}$＝α

    當$3\left( x -\frac{\pi}{6} \right)$＝－$\frac{\pi}{4}$時，f（x）有最小值＝－$\frac{\sqrt{2}}{2}$＋5＝m

    此時 x＝$\frac{\pi}{6}$－$\frac{\pi}{12}$＝$\frac{\pi}{12}$＝β

    (A) ╳：α－β＝$\frac{\pi}{3}$－$\frac{\pi}{12}$＝$\frac{\pi}{4}$

    (B) ╳：β＝$\frac{\pi}{12}$

    (C) ╳：M＝6

    (D) ╳：m＝5－$\frac{\sqrt{2}}{2}$

    (E) ○：$\frac{5\pi}{18}$＜$\frac{\pi}{3}$＝$\frac{6\pi}{18}$＜$\frac{7\pi}{18}$

    ⇒ $\frac{\pi}{3}$為$\frac{5\pi}{18}$，$\frac{7\pi}{18}$之中點，又$f\left( \frac{\pi}{3} \right)$有最大值

    ∴$f\left( \frac{5\pi}{18} \right)$＝$f\left( \frac{7\pi}{18} \right)$

    故選(E)'
