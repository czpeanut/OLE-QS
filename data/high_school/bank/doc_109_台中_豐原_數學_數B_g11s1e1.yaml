- id: doc_109_台中_豐原_數學_數B_g11s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 關於函數 y＝3 sin$\left( 2x -\frac{\pi}{4} \right)$－1 的敘述，則下列選項哪些正確？
  options:
  - label: A
    content: 週期為π
  - label: B
    content: 振幅為 6
  - label: C
    content: 頻率為$\frac{1}{2}$
  - label: D
    content: 值域為 [－1，2]
  - label: E
    content: y＝3 sin$\left( 2x -\frac{\pi}{4} \right)$－1 的圖形是以 y＝3 sin2x－1 的圖形向右平移$\frac{\pi}{8}$而得
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：週期＝$\frac{2\pi}{2}$＝π

    (B) ╳：振幅＝3

    (C) ╳：頻率＝$\frac{1}{週期}$＝$\frac{1}{\pi}$

    (D) ╳：最大值＝3－1＝2

    最小值＝－3－1＝－4

    ∴值域為 [－4，2]

    (E) ○：y＝3 sin2x－1

    $\xrightarrow{右移 \frac{\pi}{8}}$ y＝3 sin$\left[ 2\left( x -\frac{\pi}{8} \right) \right]$－1

    ＝3 sin$\left( 2x -\frac{\pi}{4} \right)$－1

    故選(A)(E)'
