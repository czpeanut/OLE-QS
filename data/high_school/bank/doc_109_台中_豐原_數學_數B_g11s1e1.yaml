- id: doc_109_台中_豐原_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 時鐘從 3 點 0 分到 3 點 20 分，共經過 20 分鐘，則下列選項哪些正確？
  options:
  - label: A
    content: 分針繞了$\frac{5\pi}{6}$弳
  - label: B
    content: 時針繞了$\frac{\pi}{18}$弳
  - label: C
    content: 3 點 10 分時，時針與分針的夾角為$\frac{7\pi}{36}$弳
  - label: D
    content: 3 點 20 分時，時針與分針的夾角為$\frac{5\pi}{36}$弳
  - label: E
    content: 在 3 點$\frac{180}{13}$分，時針與分針會相重疊
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：2π×$\frac{20}{60}$＝$\frac{2\pi}{3}$（弳）

    (B) ○：$\left( \frac{2\pi}{3} \right)$×$\frac{1}{12}$＝$\frac{\pi}{18}$（弳）

    (C) ○：3 點 0 分→ 3 點 10 分

    分針繞了 2π×$\frac{10}{60}$＝$\frac{\pi}{3}$（弳）

    時針繞了$\left( \frac{\pi}{3} \right)$×$\frac{1}{12}$＝$\frac{\pi}{36}$（弳）

    ∴夾角＝$\frac{\pi}{2}$－$\frac{\pi}{3}$＋$\frac{\pi}{36}$＝$\frac{7}{36}\pi$（弳）

    (D) ╳：由(A)、(B)

    ∴夾角＝$\frac{\pi}{2}$－$\frac{2\pi}{3}$＋$\frac{\pi}{18}$＝$\frac{-2}{18}\pi$＝$-\frac{1}{9}\pi$

    即$\frac{\pi}{9}$（弳）

    (E) ╳：設 3 點 x 分時，時針與分針相重疊

    $\frac{\pi}{2}$－2π．$\frac{x}{60}$＋$\left( 2\pi \cdot \frac{x}{60} \right) \cdot \frac{1}{12}$＝0

    ⇒ $\frac{\pi}{2}$＝$\frac{11}{12}\left( 2\pi \cdot \frac{x}{60} \right)$

    ⇒ 6π＝$11\left( 2\pi \cdot \frac{x}{60} \right)$

    ∴x＝$\frac{6 \cdot 60}{22}$＝$\frac{180}{11}$（分）

    故選(B)(C)'
