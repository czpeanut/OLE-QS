  answer_source: answer_key
  explanation: 中南半島為熱帶季風氣候，降水多集中於每年 5 ～ 10 月。泰國潑水節為迎接雨季的來臨，由氣候圖中研判應落在(B) 4 月。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 2010 年初南歐爆發債信危機，被戲稱為「歐豬四國」（PIGS）的南歐由於經濟不穩定，經濟體質不如西歐國家。此事件讓歐盟各國檢視統一貨幣政策（歐元）的問題，請問歐元單一貨幣制度較可能有以下何種缺失？(甲)未將所有歐盟各國納入歐元區，導致差別待遇(乙)未考慮各國的文化差異(丙)將不同經濟體質的各國套用同一制度，缺乏彈性(丁)各成員國無法掌控匯率及貨幣政策
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)統一貨幣的政策最大缺失是各會員國無法彈性調控國內的貨幣政策，經濟發展落差大的各國使用同一貨幣，缺乏調度的彈性。
