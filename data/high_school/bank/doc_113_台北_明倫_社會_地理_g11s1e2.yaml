- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 右圖為東南亞地區常見的婦女裝扮示意圖。請問下列哪 2 個國家境內，較常見到圖中打扮的婦女？(甲)印尼(乙)泰國(丙)越南(丁)馬來西亞
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲丁
  - label: D
    content: 乙丙
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_113_台北_明倫_社會_地理_g11s1e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 497.9
      - 184.05
      - 564.3
      - 335.1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由婦女頭部包覆頭巾的裝扮，研判此地應為伊斯蘭教信仰，(甲)印尼、(丁)馬來西亞兩國多伊斯蘭教教徒；(乙)泰國、(丙)越南兩國多信仰佛教。故選(C)。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 一位老人敘述自己的家族歷史時，說道：「我的祖先來自唐山，到這開墾幾年後，沒有辦法回唐山娶親，只好就地與『番婆』結婚，可是家裡仍然說唐山話、讀漢文。在英國人統治時，日子過得還好。日本人一來，財產可就受到很多損失。後來日本人走了，我們也建立了一個獨立的國家，可是我總想回唐山去掃墓祭祖。」這位老人應當身處何地？
  options:
  - label: A
    content: 印尼
  - label: B
    content: 越南
  - label: C
    content: 泰國
  - label: D
    content: 馬來西亞
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 來自唐山代表來自中國的移民，先被英國殖民，後被日本人統治的歷史應為(D)馬來西亞。(A)印尼殖民母國為荷蘭。(B)越南殖民母國為法國。(C)泰國為中立國。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 東南亞許多區域因為長期受到歐洲國家殖民，所以呈現「殖民地式經濟」的特色。例如：在該區大多國家的最大都市屬於「首要型港埠城市」，該特色與下列何項因素有關？
  options:
  - label: A
    content: 輸出勞工
  - label: B
    content: 傳教的據點
  - label: C
    content: 輸入黑人勞工
  - label: D
    content: 輸出熱帶經濟作物
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)殖民地式經濟的特點之一為：殖民母國為方便出口殖民地物資，會積極建設沿岸港口，形成港埠型都市發達的特徵。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 1980 ～ 1990 年馬、泰、菲、印 4 國對內進行經濟改革，對外採取開放政策，吸引大量外資進入，成為第二代的新興工業化國家，被稱為「亞洲四小虎」。請問其優勢為何？
  options:
  - label: A
    content: 穩定的社會
  - label: B
    content: 地理位置優越
  - label: C
    content: 完善的制度
  - label: D
    content: 充裕的勞工
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)外資的進入是利用當地充足且廉價的勞力，東南亞資源豐富也是吸引外資的一項利多。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 根據澳洲之氣溫、降雨條件判斷，下圖中哪一個地點的全年日照時數最少？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_113_台北_明倫_社會_地理_g11s1e2/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 253.4
      - 548.35
      - 430.65
      - 715.5
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)丁地緯度最高、迎西風，終年溫暖潮溼（多雨），日照時數較少。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 紐西蘭東岸與西岸的植被景觀明顯不同，西岸森林蓊鬱，但東岸卻常見草類植物。造成這樣景觀差異的主因為何？
  options:
  - label: A
    content: 迎風或背風
  - label: B
    content: 降水類型差異
  - label: C
    content: 降水量變率不同
  - label: D
    content: 地形起伏的差異
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)紐西蘭全境迎西風，西面為迎風坡多雨，森林茂盛。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小杰由臺灣至澳洲雪梨打工度假後發覺有些情形產生，如(甲)在北方的天空看到北極星(乙)在南方天空看到南十字星(丙)北風相比南風溫暖(丁)夏天過聖誕節(戊)近午時，太陽在南方的天空。上列敘述哪些正確？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲乙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)澳洲位在南半球，看不到北極星；(戊)雪梨緯度高於南回歸線，因此太陽終年都在雪梨的北方天空。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 當小倫漫步在紐西蘭的奧克蘭城，她常以為自己身在英倫，因為不管街道的景觀或建築物，都呈現出濃濃的英倫風。路人說的是英語，連國旗上還有米字旗。然而 20 世紀後期紐西蘭與英國的關係卻有了轉變。請問紐西蘭與英國的關係漸行漸遠的起因，主要受到何項因素影響？
  options:
  - label: A
    content: 紐西蘭希望走出自己的路線，主動與英國切斷關係以表示不再依賴英國
  - label: B
    content: 紐西蘭強調多元文化，外交政策改為重亞輕歐，改善與周圍亞太國家關係
  - label: C
    content: 紐西蘭居民中，英國與愛爾蘭移民所占的比重已大幅下降，於是與英國關係漸疏遠
  - label: D
    content: 英國於 1973 年加入歐洲共同體，加強與歐洲會員國關係，致使紐西蘭與英國的貿易量逐漸減少
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)澳紐在獨立之後長期與英國保持緊密的關係，直到 1973 年英國加入歐盟，澳紐才意識到自己終究身處西南太平洋，開始政策轉向成「脫歐入亞」，開始與具地緣性的亞洲緊密合作。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 臺灣與紐西蘭在 2013 年簽署「紐西蘭與臺澎金馬個別關稅領域經濟合作協定」（臺紐經濟合作協定），預計 2025 年將全面開放給紐西蘭部分商品「零關稅」進口，可能衝擊國內產業。請問何種臺灣本土產業可能面臨的衝擊最大，甚至消滅？
  options:
  - label: A
    content: 水果
  - label: B
    content: 牛肉
  - label: C
    content: 乳品
  - label: D
    content: 漁產
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)乳品是紐西蘭農產品出口的大宗項目，2025 年起鮮奶完全免關稅，將嚴重衝擊臺灣的酪農業。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 西亞各國成立「石油輸出國家組織（OPEC）」，協調各國石油的生產與輸出量來控制油價，維護產油國利益並達到能與西方抗衡的目的，請間以下有關 OPEC 的敘述，何者正確？
  options:
  - label: A
    content: 2023 年底爆發的紅海危機，導致 OPEC 主要產油國（沙烏地阿拉伯）輸出原油路線受阻，油價應聲飆漲
  - label: B
    content: OPEC 對市場的控制力，因美國自 2014 年起大量開採頁岩油後開始下降
  - label: C
    content: OPEC 成員國皆為伊斯蘭國家，因此輕易能在生產定額上普遍達成共識，持續減產提高油價
  - label: D
    content: 而 OPEC 協議減產提高售價後，亦讓會員國之一的俄羅斯有多餘的收入進行對外戰爭
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)波斯灣出口的原油不需經過紅海。(C) OPEC 國家成員也有非洲、美洲成員，不全然都是伊斯蘭國家。(D)俄羅斯非 OPEC 成員國。
- id: doc_113_台北_明倫_社會_地理_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 某月的 13 ～ 15 日是泰國傳統新年，泰語稱之為 SONGKRAN，中文譯為「宋干節」，也就是俗稱的「潑水節」。節慶期間以清水互潑除去燥熱，有為對方祈福、展開新的一年的意義。參考曼谷氣候圖，判斷潑水節是在下列哪個月分？
  options:
  - label: A
    content: 1 月
  - label: B
    content: 4 月
  - label: C
    content: 7 月
  - label: D
    content: 9 月
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_113_台北_明倫_社會_地理_g11s1e2/s1_11_f1.png
    crop:
      page: 3
      rect:
      - 474.9
      - 402.6
      - 564.3
      - 522.55
  answer:
