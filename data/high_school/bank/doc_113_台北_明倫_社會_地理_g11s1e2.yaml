  group_stem: 2019 年 12 月 9 日下午，紐西蘭觀光景點白島（White Island）突然火山爆發，從火山口噴出的大量火山碎屑、火山灰與高溫蒸氣，在短短幾十秒內籠罩全島，並竄上了 3,650 多公尺的高空。由於目前正逢紐西蘭的夏天觀光旺季，噴發當下仍有許多登島遊覽的國際觀光客，造成嚴重傷亡的情形。請問：
  answer:
