  group_stem: '「三金」之一的廣播電視金鐘獎是為了肯定影視從業人員的成就而舉辦，至今己舉辦 55 屆。而本屆兒少節目主持人獎由泰雅族的 Buya（陳宇）與達悟族的 Pagnoyod（鍾家駿）以節目《kakudan 時光機》奪得。

    在頒獎典禮上，絕大多數入圍者選擇晚禮服出席盛會，但 Buya 與 Pagnoyod 分別以泰雅族及達悟族的傳統族服上臺領獎，並很感性地說到：「我們非常高興的穿上自己族人的禮服，出席這場盛會……。」然而，當日部分媒體聚焦到兩人的服飾上，並以「全場他最露」、「屁股蛋整顆露出」、「最有勇氣造型」等聳動標題吸引點閱率。對此，許多網友仍肯定兩人對於原生族群的認同，也對媒體涉及不妥的標題內容感到遺憾。總統府發言人 Kolas 認為：「我們要問的不是『為什麼敢？』而是『是什麼讓人不敢？』」換言之，是什麼樣的原因，讓有些人覺得原住民族的禮服無法登大雅之堂？什麼樣的原因，讓原住民族無法「做自己」？

    雖然我國自詡為友善包容的國家，但受到部分公眾人物的言行、媒體的報導影響，使得我國欲走向多元文化的路途上，恐有很多觀念待修正。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)社會階層化是指社會成員被劃分成高低不同階層，形成一種持續且穩定的社會結構之現象。並非自我評價。(C)應尊重個別文化差異。(D)其穿著有其文化背景與特色。
