  stem: 根據日本大學教授的探討，下列敘述何者正確？
  options:
  - label: A
    content: 教授認為肺炎疫情期間與 CRPD 所述的緊急狀況不同
  - label: B
    content: 保障身心障礙者的人權，須將社會所有資源投入其中
  - label: C
    content: 為避免染疫，疫情期間身心障礙者應降低與社區連結
  - label: D
    content: 身心障礙者的退休金，不因肺炎疫情而受到任何影響
  group_stem: '日本大學教授以 COVID-19 疫情與《身心障礙者權利公約》（CRPD）間的關係為主題探討，其認為 COVID-19 疫情對身障人權是個挑戰。根據 CRPD 第 11 條，在緊急狀況時應採取所有必要措施，讓身心障礙者獲得保障及安全。而有四項內涵是必須優先確保的；使身心障礙者能取得疫情與防止病毒傳播的資訊、持續取得支持和社區服務、平等地獲得健康照護、身心障礙者退休金與社會福利在任何時候獲得保障。

    聯合國也曾提出，CRPD 的核心在平等及反歧視，CRPD 在各國推動時，保護身障者權利是最重要的目標，要尊重個別差異，注意障礙是否完全排除。人權沒有終點，需要持續才能達成目標。

    我國伊甸基金會表示，21 世紀的人權推動中，CRPD 是最重要的發展之一。伊甸創立以來，堅信身心障礙者與眾人一樣，享有自由發展生活的權利，並透過政策倡導，積極實踐以人權為基礎的社福政策服務。伊甸基金會也舉辦實踐工作坊，能與實務工作者、學界、政府部門共同討論，使身心障礙者人權與福利全面實踐。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提及在緊急狀況時應採取所有必要措施，讓身心障礙者獲得保障及安全：身心障礙者退休金與社會福利在任何時候獲得保障是必須優先確保之一，故選(D)。(A)教授認為肺炎疫情期間對於身障者的保障應依據 CRPD。(B)社會上還有其他需保障的弱勢群體，保障身心障礙者權益宜投入部分社會資源，並非全部。(C)題文中並未提及。
