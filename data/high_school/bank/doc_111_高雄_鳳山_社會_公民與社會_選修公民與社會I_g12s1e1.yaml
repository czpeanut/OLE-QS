  stem: 社會運動的組成形式、運作方式隨科技發展而有所變化，亦讓公民有機會透過各類管道表達及關心不同社會議題的現況。關於社會運動議題的討論，哪些正確？
  options:
  - label: A
    content: 社會運動常採取體制外的手段表達訴求，故一定是違法的行為，長期而言必對社會產生龐大的社會成本
  - label: B
    content: 社會運動是公民參與的重要形式，透過民眾本身直接或間接表達意志與行動，政府機關須接受各類意見
  - label: C
    content: 社會運動能促進政治民主化及提倡新社會生活理念之外，對社會處境不利群體的權益均能提供完整保障
  - label: D
