    content: 個案二認為，就算出生在高階層家庭，制度也應納入努力與付出
  group_stem: '志齊為完成公民專題「公平還是不公平？」，想了解民眾對政策與公平感受的認知，因此他訪談了兩位對政治關心度不同的民眾，以下為他的訪談資料：

    | 個案一 （50 歲，男） | 時間：20XX 年 X 月 X 日 地點：XX 咖啡廳 ①傾向支持衝突論 |

    | --- | --- |

    | 問題 1： 您覺得什麼是公平？ | 一個人能夠靠著努力，完成自己的願望，造成階級的流動。不論上一代是何種階級，都應不具有決定性的影響。如：一個出身經濟不富裕家庭的學生，認真讀書考上好學校，提升自己能力後，獲得一份良好的工作與收入 |

    | 問題 2： 您認為現在的政策公平嗎？ | 我認為是不公平，我從教育方面說起。現在臺灣國立名校弱勢學生的比例，只占不到 10 ％，比起我就學時期減少太多，這樣表示現在社會更不利階級流動。可能是因為高社會地位的家庭，家中的文化與考試或主流文化較相符，使其子女在就學較順利，這都會加劇階級複製 |

    | 問題 3： 您對於政府政策有什麼建議？ | 個人可以藉由努力而階級流動，這樣的社會才能達到公平，使社會更好，若這樣太抽象的話，希望政府可以幫幫年輕人獲得更多的教育資源，像是多元入學管道、助學貸款或就業扶助，應多考慮經濟或區域差距 |

    | 個案二 （35 歲，男） | 時間：20XX 年 X 月 X 日 地點：XX 咖啡廳 ②傾向支持＿＿＿＿論 |

    | 問題 1： 您覺得什麼是公平？ | 努力且又聰明的人應該得到回報，這是理所當然的。我比較負面一點，若是一個有錢人家的小孩總喜歡耍小聰明又不努力，這樣當然要階級流動，就是指向下的那種，而不是只是靠爸媽就可以一直過舒適的生活，這樣其他的人心裡怎麼會平衡 |

    | 問題 2： 您認為現在的政策公平嗎？ | 有錢人家的稅金太低了啦，還可以用很聰明、一般人看不懂的方法去降低他們的稅金。再說，有聽過政商協調嗎？有錢人就比較容易有機會跟政治人物相處，能分享他們的看法，當然就會制定更多有利他們階級的法律與政策，這是我們這些小人物無法做到的事情 |

    | 問題 3： 您對於政府政策有什麼建議？ | 希望能調高有錢人的稅金，減少我們這些一般民眾的稅金，這樣就能夠調整分配，也能提供更多社會福利或是公共建設。多蓋捷運、圖書館或是給需要的家庭補助，都能夠幫助民眾更願意相信這個社會是公平的 |'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)兩人並未覺得現在的階級複製情況有降低。(C)個案一認為國立名校中弱勢學生的比例不到 10 ％，比他當時就學時期減少太多，表示家庭階級對子女考上名校影響較大。
