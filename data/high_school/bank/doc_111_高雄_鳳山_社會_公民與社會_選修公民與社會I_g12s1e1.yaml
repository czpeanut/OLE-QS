- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 社會階層是指一個社會中，各個族群按照所擁有的社會資源之不同，區分為高低等級的狀態。下列有關敘述何者「錯誤」？
  options:
  - label: A
    content: 社會階層是指社會組織的特質，而非針對個人的特質
  - label: B
    content: 社會階層可能會產生複製性，進而世代相傳
  - label: C
    content: 開放系統的社會仍會產生社會階層複製的現象
  - label: D
    content: 低階級者認為他們擁有較低的地位，天經地義且有利於社會的運作
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '關於社會階層化理論有兩大派學說的論爭，一派為衝突論，另一派為功能論，下表是有關兩種理論之比較，請問何者正確？

    | 選項 | 衝突論 | 功能論 |

    | --- | --- | --- |

    | (A) | 階層可提高社會與個人的功能表現 | 階層阻礙社會與個人的表現 |

    | (B) | 工作與酬勞的分配是合理的 | 工作與酬勞的分配是不合理的 |

    | (C) | 階級普遍存在但並非必須 | 階級普遍且必須存在 |

    | (D) | 個人的社會階層地位取決於個人的能力與努力 | 個人的社會階層地位取決於所屬團體所擁有的資源 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 《國語日報》針對國小五、六年級學生調查其心中理想職業，男生想當運動員、工程師或醫師居多；女生則想當歌星、服裝設計師、糕點師傅等。根據上文所討論的職業角色，依功能論與衝突論的觀點來看社會階層的劃分，以下敘述何者正確？(甲)衝突論認為能當醫生的人，一定是他享有比別人多的資源而非自身努力(乙)功能論認為能當上知名的歌星勢必要花費很多自身的努力，不是人人能當，報酬高是合理的(丙)功能論認為明星級的運動員能夠享有高薪是不公平的，因為還有很多運動員是無名與低薪的(丁)衝突論認為不是所有學烘焙的人都能擁有自己經營的店，學徒、工讀生的職位有其存在必要
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (丙)(丁)
  - label: C
    content: (乙)(丙)
  - label: D
    content: (甲)(丁)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (丙)為衝突論；(丁)為功能論。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 新聞報導：超過三千名勞工走上街頭，用行動表達對政府漠視勞工權益的不滿和憤怒。針對勞工薪資凍漲及軍公教退休人員可以領取年終慰問金的問題，看完新聞的四人發表以下的言論，請問何人的論點是站在「功能論」出發？
  options:
  - label: A
    content: 阿土伯：具備良好家庭背景的人，往往比一般人更容易能從事公務人員的職業
  - label: B
    content: 忍太郎：公務員未必有良好能力，而是其所屬群體比勞工階層擁有較多社會資源
  - label: C
    content: 金貝貝：公務員的高薪與高地位來自個人能力與努力，年終慰問金是他們應得的
  - label: D
    content: 錢夫人：公務員的高薪和高地位，是優勢階層為捍衛自身利益所訂出的遊戲規則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 功能論認為為了社會的整體發展，社會需要各種不同資格和技能的人擔任不同的職位，社會階層是社會分工的結果。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 社會流動是指個人從社會階層的某一位置移到另一位置的現象。請問下列有關「社會流動」的相關敘述，何者正確？
  options:
  - label: A
    content: 在開放社會中，先賦地位對個人社會流動的影響力較封閉社會來的明顯
  - label: B
    content: 先賦地位是指個人出生就被賦予的地位，影響因素像是性別、種族等等
  - label: C
    content: 在封閉社會中，不同社會階層間的界線較為彈性，社會流動頻繁
  - label: D
    content: 「富不過三代」這一句諺語，可以用來形容封閉社會中的社會流動情況
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是在封閉社會中，先賦地位的影響較開放社會來得明顯。(C)開放社會中，不同的社會階層界線較為彈性，才會有頻繁的社會流動。(D)富不過三代，代表有社會流動的現象，應為開放社會。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '過去三十年來，臺灣依據家庭可支配所得分為五等分，包括最低、次低、中間、次高、最高所得組等五組家庭，各組家庭內 18 ～ 23 歲人口接受高等教育比率如下表所示，依據下表提供的數據，請問下列敘述何者「不正確」？

    | （單位：％） |  |  |  |  |  |

    | --- | --- | --- | --- | --- | --- |

    | 民國 | 第一分位組 （最低所得組） | 第二分位組 （次低所得組） | 第三分位組 （中間所得組） | 第四分位組 （次高所得組） | 第五分位組 （最高所得組） |

    | 70 年 | 7 | 13 | 16 | 20 | 25 |

    | 80 年 | 20 | 27 | 29 | 31 | 40 |

    | 90 年 | 40 | 46 | 52 | 56 | 60 |

    | 100 年 | 60 | 69 | 74 | 78 | 80 |'
  options:
  - label: A
    content: 家庭可支配所得等級愈高，子女接受高等教育比率也愈高
  - label: B
    content: 不論所得分組，所有家庭接受高等教育的比率都呈上升的情形
  - label: C
    content: 參考過去三十年變化，最低所得組家庭接受高等教育的比率，成長倍數最多
  - label: D
    content: 最高與最低所得組相比，其子女接受高等教育的比率差距，呈逐年下降趨勢
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由表中數據可以看出所得愈高的組別，子女接受高等教育的比率也愈高。(B)從 70 ～ 100 年每一所得分組的子女受高等教育比率皆提升。(C)最低所得組子女受高等教育的比率成長倍率為 8.5 倍，高於其他組別。(D)最高與最低所得組相比，子女受高等教育的比率差距，依序為 18 ％、20 ％、20 ％、20 ％，並未呈現逐年下降趨勢。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 熱播韓劇《人生勝利組》劇中男主角李承天，是個雖然成績優良，但家徒四壁的窮學生，飽受校內有錢有勢的惡霸欺負，但為了錢、為了生存他無所不忍，他立誓一定要成為有錢人，就算是賞一巴掌拿一萬元這種羞辱，他也甘之如飴，同時<u>也憤恨在財富面前，所有的努力都是徒勞。</u>就在此時他獲得了一支魔法金湯匙，只要到有錢的同齡同學家裡吃飯三次，就能交換身分成為富二代，於是他透過這個方法跟超級有錢富二代同學黃泰勇交換父母與家庭，一夕之間成為富二代，結果發現身為財閥之子的黃泰勇也並不好過，雖然衣食無缺，卻長年在父親的壓迫下，超齡培養各種能力，讓他苦不堪言。根據上文的敘述，請問下列選項何者正確？
  options:
  - label: A
    content: 文中畫線處的敘述與功能論所持的立場相同
  - label: B
    content: 男主角透過金湯匙經歷了一場代間垂直流動
  - label: C
    content: 培養各種能力是父親對孩子經濟資本的投資
  - label: D
    content: 家庭與父母對孩子而言，決定了其先賦地位
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)衝突論。(B)與有錢的其他同儕交換身分，屬於代內流動。(C)培養各種能力屬於文化資本。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '下表是 2015 年內政部所公布「我國 15 歲以上人口教育程度統計」報告，戶籍登記人口年滿 15 歲以上者計 2,030 萬人，教育程度變化如下表所示。在少子化趨勢下，根據表中資料研判，國人的學歷變化，將會產生何種社會現象？

    | 教育程度 | 大學以上者占 42.68 ％、高中高職占 30.92 ％、國初中者占 12.53 ％ |

    | --- | --- |

    | 2005 ～ 2015 年大學學歷變化 | 人數自 282 萬人增至 506 萬人，占 15 歲以上人口比率自 15.26 ％增至 24.92 ％ |

    | 2005 ～ 2015 年研究所學歷變化 | 自 3.11 ％倍增至 6.4 ％，從 57 萬人增至 130 萬人 |

    | 年齡族群 | 大學生比率最高族群是 20 ～ 24 歲族群，占 68.45 ％；研究生則是 25 ～ 29 歲，占 12.87 ％ |

    | 25 ～ 64 歲人口受高等教育比率 | 臺灣 45 ％、加拿大 54 ％、以色列 49 ％、韓國 45 ％、美國 44 ％ |'
  options:
  - label: A
    content: 大學以上的學歷趨多，將出現學歷貶值
  - label: B
    content: 學歷的差距拉大，社會階層化現象明顯
  - label: C
    content: 超過一半以上的國人擁有大學以上學歷
  - label: D
    content: 透過教育，加速社會階層向上流動的速度
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(D)由數據看不出社會階層變化。(C)未超過半數的國人擁有大學以上學歷。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 某政論節目邀請 4 位名嘴討論當代社會流動的現象，請問以下 4 位名嘴的發言內容何者正確？
  options:
  - label: A
    content: 名嘴甲：在民主國家每個人都享有相同的資源與均等的向上流動的機會
  - label: B
    content: 名嘴乙：繁星計畫的目的之一是增加弱勢家庭出身子女水平流動的機會
  - label: C
    content: 名嘴丙：英國仍有世襲皇室的存在，故英國社會尚缺乏垂直流動的機會
  - label: D
    content: 名嘴丁：地方政府提供青年創業貸款可增加其代內垂直向上流動的機會
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)先賦條件不同，未必享有相同的資源。(B)繁星計畫主要是希望資源條件相對不足地區的學生也能取得優質校系的入學門票，應是增加其垂直流動機會。(C)世襲皇室的存在，不代表其社會缺乏垂直流動。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: '小明在書中看到魏晉時代的九品中正制度以及唐代的科舉制度比較表（如下表）後，歸納出一些心得和結論，請問下列敘述何者正確？

    | 制度 | 魏晉時代的九品中正制度 | 唐代的科舉制度 |

    | --- | --- | --- |

    | 挑選人才的方式 | 州郡設中正官，負責選士，中正官品評人物後會定品，中央吏部以中正官所定的品第作為授官的依據 | 生徒（由學館出身的官宦子弟）和鄉貢（寒門子弟懷牒自列）經禮部的科舉考試，合格者再經吏部釋褐試的身言書判後，通過者即授官任職 |

    | 社會現象 | 因為中正官大多出身於世族，故品評人物時多只問其出身，而不問賢能與否，形成「上品無寒門，下品無世族」的現象 | 以科舉考試選擇人才，開放仕途，並經吏部以身言書判做為甄選標準，用人只問賢愚，不計出身，打破社會中門第觀念 |'
  options:
  - label: A
    content: 九品中正制度屬於開放系統的社會階層化現象
  - label: B
    content: 九品中正制度選拔官吏的過程比較中立客觀
  - label: C
    content: 唐代的科舉制度較為重視考生個人的先賦地位
  - label: D
    content: 唐代的科舉制度較屬於開放系統的社會階層化
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)九品中正制度較偏向封閉系統。(B)九品中正制度中負責選士的中正官出身世族，因此選拔官吏時只問其出身，不問賢能與否，應是重視先賦地位，較不客觀。科舉制度較為中立客觀。(C)唐代的科舉制度不計出身，不會重視考生的先賦地位。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
