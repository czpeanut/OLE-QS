    content: 若是此組織的推展，移工回國後可能難以找到更好的工作、陷入貧窮而再度出國，是典型結構流動現象
  - label: C
    content: 文中組織可透過遊說、線上募款、爭取政府補助、推薦人員參與選舉等方式，增加影響體制內改革力道
  - label: D
    content: 由於移工工作性質影響，導致其不易取得文化資本，因此該組織希望透過類似學校的制度協助移工學習
  group_stem: '資料一：One-Forty 是臺灣的非營利組織，2015 年由政治大學及臺灣大學的畢業生共同創立，組成目的是發現在臺灣有許多來自東南亞國家的移工，因為長期從事勞動性質的工作而缺乏學習的機會，以至於回國後，難以找到更好的工作，因此容易再次陷入貧窮而再度出國工作，所以該組織設計學習型課程培力移工，讓移工具有更充足的能力面對未來的生活，並關注他們在臺生活的訴求。他們相信不只研發各種課程讓移工透過假日學習來充實自己，也鼓勵移工建立正確的儲蓄觀念、工作態度，並與他們分享臺灣的文化，藉此創造更多交流、理解與互信。而今更期待能夠打造一座讓全臺灣移工都能利用閒暇時間學習、充實自我的移工學校，讓臺灣協助他們實踐當初飄洋過海所帶來的夢想。

    資料二：移工在臺灣的勞動力市場扮演著很重要的角色，除了是照顧老齡人口的主力，臺灣的工廠、建築工地、漁船甚至飲食店都可以看得到他們的身影。移工填補臺灣勞動力缺口，但他們的工作權益及安全保障卻鮮少被關注，宛如臺灣社會的「隱形人口」。目前將近 23 萬人從事家事類（看護、幫傭）移工，與產業類移工（漁工、工廠、營造、製造業等）屬於重勞力、高危險、甚至骯髒的產業類工作，如漁工、工廠等。部分學者、勞工團體已經一再指出外籍移工問題癥結不在個別案件，而是不合理的政策與制度使然，例如：不合理的仲介費、沒有基本工資保障、沒有明確工時保障等。基於人權保障之角度，加強移工人身安全保障，營造友善環境，藉由形成正向循環，促成勞資雙贏，以減少前述案件繼續肇生。不僅對我國社會秩序與就業市場有利，對國際上之人權評價，亦有助益。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)該組織主要推動有利移工的課程，與組織規模是否能影響政策無關。(B)移工在我國與母國生活條件不同，不一定會產生結構流動。(C)參與選舉為政黨之行動方式。
