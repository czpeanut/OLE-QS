  group_stem: '《鏡週刊》整理下列兩則報導，請依據下列兩則報導回答下列問題：

    資料一：《Bloomberg》提到從 2007 ～ 2016 十年之間，全世界各地區財富分配不平等都出現擴大的情況。其中美國平均收入在五分法中收入最少的 20 ％，十年來所得只增加了 12.1 ％，相對之下，最富有的 5 ％，所得則增加了 30.6 ％。

    資料二：《大西洋期刊》指出，這種貧富差距的擴大的情況，衍生的問題是世代之間的社會流動性降低。也就是說，貧窮的家庭未來會更難翻身。下一世代的經濟情況，更大程度可能是由父母的地位決定。（資料來源：https://www.ettoday.net/news/20180129/1102892.htm）'
