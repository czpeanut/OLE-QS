  stem: 右圖為某國社會階層調查中，1,000 位具有研究所學歷的受訪者及其父親社會階層分布百分比圖。依據圖中資料顯示，該國教育因素、社會階層與社會流動之間的關係，下列解釋何者最正確？
  options:
  - label: A
    content: 受教育有助於該國人民向上流動
  - label: B
    content: 該國水平社會流動情形十分普遍
  - label: C
    content: 該國的中下階層缺乏受教育機會
  - label: D
    content: 個人社會階層深受父親背景影響
