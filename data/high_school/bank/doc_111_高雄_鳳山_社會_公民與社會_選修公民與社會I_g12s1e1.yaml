  - label: E
    content: 社會運動往往倡議特定的理念或目標
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (C)社會運動由民眾或社會組織發起，不一定有政黨的支持。(D)社會運動為由下而上的群眾行動，並非各級政府發起。
