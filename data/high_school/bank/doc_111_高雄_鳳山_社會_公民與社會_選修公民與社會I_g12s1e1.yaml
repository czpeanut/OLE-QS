  stem: 2013 年，苗栗縣苑裡鎮沿海居民抗議德商英華威公司設立大型風力發電機，帶來嚴重噪音，居民成立了苑裡反風車自救會。事件告一段落後，部分居民於 2017 年募資創辦了《掀海風雜誌》，並成立「苑裡掀海風」組織，進行藺草復耕，協助在地小農進行友善農法。請問以下哪些敘述正確？
  options:
  - label: A
    content: 社會運動經常能促成壓力團體的發展
  - label: B
    content: 壓力團體常利用社會運動達成其目的
  - label: C
    content: 政黨總是作為社會運動背後的影武者
  - label: D
