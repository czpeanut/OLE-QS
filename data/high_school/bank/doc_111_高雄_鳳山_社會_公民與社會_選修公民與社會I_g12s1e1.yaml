  stem: 2014 年 3 月 18 日上百名學生突破警方防線，闖進立法院占領議場，要求服貿逐條審查，運動持續了 24 天，稱之為太陽花學運「攻占行政院」案，魏揚等 7 名被告二審時改判有罪，判刑 2 到 4 月不等，此案經上訴，2021 年最高法院於 1 月 18 日撤銷原判決，發回更審，引起網路熱烈討論。年輕世代稱太陽花學運是「一場服貿熱雨下的太陽花」；而反對者則說是「一場暴民行動」，請你推論判斷社會運動在民主政治生活中應是扮演何種角色？
