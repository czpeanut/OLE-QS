  group_stem: '資料一：「凡擁有許多資源的還要給他更多，匱乏的連他僅有的也要奪過來。」馬太效應表現出富人與窮人在處置資源上的差距。現今企業使用大量的派遺遣、外包、時薪制等非典型就業，減少其人事開銷，但這樣的做法表面上減少了企業支出，卻造成勞動者的勞動報酬不足以支應個人或家戶基本支出，而形成了「窮忙」的現象，窮忙以至於窮人工作再多，能承受的生活風險仍低，因為無法隨年資或努力而提升所得，且每月所得只能支應基本開銷，並沒有餘款能累積存款或購入保險等，若不小心遇到事故或失業，便極易會跌入貧窮而無法自救。社會認為「貧窮是個人不努力而導致」，對明顯有利於既得利益者的政策或勞動結構，仍普遍認為只要努力，就能如同富人累積財富，無視窮人因資源有限，只能處理最緊急事物的財產限制。

    資料二：在疫情的影響下，各國的就業都受到影響，依據美國民調機構調查，因疫情失業的成年人，面臨無法支付其帳單、需提取存款生活，甚至向親朋好友借錢等才能維持基本日常。在重新工作方面，中上階級失業者中接近六成已恢復工作，而中下階層失業者約四成。在失業率方面，最高為非裔族群，再者為亞裔及拉丁裔，最低為白人。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(D)的做法對於協助受疫情影響而失業的人，不一定可行。(C)易形成階級再製。
