    crop:
      page: 3
      rect:
      - 337.05
      - 424.45
      - 564.3
      - 588.3
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 社會流動主要係指個人在社會階層變動的現象。(B)圖中無從判斷水平流動的情形。(A)(D)圖中本人社會階層在中階層以上的比例占絕大多數，可見教育有助於個人在社會上的向上流動，反而沒有受到父親背景的影響。(C)該國將近有 70 ％研究生的父親屬於中下階層與下階層，顯見該國原本家中屬於中下、下階層新一代的社會成員仍有相當高的受教機會。
- id: doc_111_高雄_鳳山_社會_公民與社會_選修公民與社會I_g12s1e1_s1_12
  section: 1
  number: 12
