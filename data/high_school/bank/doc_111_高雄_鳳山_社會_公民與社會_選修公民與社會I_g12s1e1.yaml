  stem: 「占有華爾街」（Occupy Wall Street）是於 2011 年 9 月 17 日起開始，主要發生在紐約市的集會活動，由加拿大反消費主義組織 Adbusters 發起。根據 occupywallst.org 網站的解釋，占領華爾街運動是：「一場沒有領導者的抵抗運動，不分膚色、性別與政治信念。我們只有一個共同點：我們是不想再忍受 1 ％的貪婪與腐敗的 99 ％。我們使用阿拉伯世界的革命策略實現我們的目的，鼓勵非暴力，以最大限度地保障所有參與者的安全。」根據上述資料，占領華爾街運動缺少了下列哪一項社會運動的特徵？
  options:
  - label: A
    content: 由人民所發起
  - label: B
    content: 持續性的集體挑戰
  - label: C
    content: 帶有目的性及理想性
  - label: D
    content: 明確的角色分工
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)文中提及「沒有領導者的抵抗運動」，故無明確的角色分工。
