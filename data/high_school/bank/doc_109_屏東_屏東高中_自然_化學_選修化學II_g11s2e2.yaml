  section: 2
  number: 18
  type: multiple
  page: 2
  stem: 下列有關σ鍵及π鍵的敘述，哪些正確？
  options:
  - label: A
    content: σ鍵是由原子軌域以頭對頭的方式，沿著二原子核間軸的方向重疊結合而成
  - label: B
    content: $H_{2}$分子中，兩個H原子分別以1s軌域重疊，形成σ鍵
  - label: C
    content: π鍵可由2個p軌域以側對側的方式重疊而成
  - label: D
    content: σ鍵與π鍵均可沿著核間軸繞軸旋轉
  - label: E
    content: 因為π鍵的重疊程度較大，所以π鍵的強度大於σ鍵
