- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 課堂上公民老師提到經濟學上有所謂的「正常財」、「劣等財」「季芬財」與「炫耀財」關於它們的敘述，下列何者的說法是<u>錯誤的</u>？
  options:
  - label: A
    content: 小東：產品的需求與消費者的所得變動反方向者為劣等財
  - label: B
    content: 阿西：產品的需求與消費者的所得變動同方向者為正常財
  - label: C
    content: 小南：某產品的需求量因價格之上漲而減少，即所謂的季芬財
  - label: D
    content: 阿北：某些產品價格愈高，需求量反而愈大，屬於炫耀財
