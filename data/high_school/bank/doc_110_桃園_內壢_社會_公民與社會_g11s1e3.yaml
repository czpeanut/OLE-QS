- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 段考將至，同學熱烈討論著「供需法則」以下那個同學的說法符合「需求量」的變動？
  options:
  - label: A
    content: 小筒：根據報導，市售的翡翠檸檬汁富含維他命C，多喝可以養顏美容，造成女性消費者一窩蜂的搶購
  - label: B
    content: 小璿：新版的手機功能超強大，引起民眾廣大的迴響，手機業者紛紛投入生產行列
  - label: C
    content: 小婕：星期六補班補課，星巴克推出咖啡飲品買一送一活動
  - label: D
    content: 小琪：市場空心菜價格偏低，農民紛紛減少耕種面積，改種其他蔬菜
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 政府為了保障勞工的權益，訂有最低工資的規定，2022年開始訂定的標準為每月25250元，時薪為168元。請問：關於政府訂定最低工資的敘述何者正確？
  options:
  - label: A
    content: 政府訂定最低工資的政策，為一種價格上限的規定
  - label: B
    content: 最低工資實行的結果造成失業、就業機會減少的問題
  - label: C
    content: 設定最低工資使勞工權益獲保障，使勞動市場供需均衡
  - label: D
    content: 最低工資設定會造成供不應求的結果，造成資源的浪費
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 桃園社會住宅「中路二號」已開放有需求的民眾來申請，但是申請社會住宅是有條件限制的，因此有「僧多粥少」的問題。若是市府為了保障租屋民眾的權益，規定所有的租屋市場租金價格為$P_{1}$。下圖為桃園市租屋市場之供需圖，以下述何者正確？
  options:
  - label: A
    content: 設定$P_{1}$為價格上限後，消費者剩餘為圖中$CP_{0 }$E所夾的面積
  - label: B
    content: 政府設定房租租金格上限，可改善租屋市場供需失衡問題
  - label: C
    content: 將價格訂在$P_{1}$可讓社會總剩餘提升，達到經濟效率最大境界
  - label: D
    content: 設定價格上限後，可能引發黑市、民眾搶租房屋的問題
