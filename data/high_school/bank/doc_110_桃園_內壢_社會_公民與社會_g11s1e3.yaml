  stem: 金田一為了與美雪共度情人節，推掉了一個酬勞3000元的打工機會，晚餐時刻金田一請美雪到法式餐廳用餐，點了一客菲力牛排套餐，要價2000元，美雪點了一客法式春雞套餐，要價2500元，並送了美雪一套保養品，要價3000元。美雪在感動之餘決定在飯後出資與金田一去參加他最喜歡的密室逃脫遊戲，全票一張要價500元。請問金田一歡慶情人節的機會成本是多少？
  options:
  - label: A
    content: 7500元
  - label: B
    content: 10500元
  - label: C
    content: 11000元
  - label: D
    content: 11500元
