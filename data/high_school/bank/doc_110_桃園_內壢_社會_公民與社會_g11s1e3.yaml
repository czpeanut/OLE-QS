  stem: 自由貿易可促使國與國之間的貿易更加便利與順暢。請問：下列關於各國貿易帶給彼此影響之敘述哪些人所言正確？侯正義：使進口國之消費者剩餘增加，生產者剩餘減少；鄭聰明：使進口國的消費者與出口國的生產者得到好處；賴功德：使出口國的生產者剩餘與消費者剩餘都增加；蔡文青：使進口國的生產者與出口國的消費者得到好處；柯大砲：貿易對兩國都有利，但利益的分配會產生變化
