  number: 21
  type: single
  page: 3
  stem: 小蕾和阿宏婚後因價值觀不同，最後在雙方同意之下離婚，但他們不曾就夫妻財產制有過約定，若是按照現行法律的規定，誰可以行使夫妻財產之差額分配請求權？請求金額為多少？下表為雙方的資產配置表：
