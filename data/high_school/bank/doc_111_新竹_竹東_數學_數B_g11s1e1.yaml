- id: doc_111_新竹_竹東_數學_數B_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 在維多利亞的學者將“禮拜二上午兩點至禮拜三上午兩點”的溫度變化配合過往的統計資料，模擬一個溫度函數T(t)＝8－10 sin($\frac{\pi}{2}$＋$\frac{\pi}{12}$t)，此處T為溫度 (單位：℃)，t為禮拜二上午兩點後所經過的小時數，配合以上敘述，試問：下列選項哪些正確？
  options:
  - label: A
    content: 禮拜二上午兩點時，溫度為－2℃
  - label: B
    content: 禮拜二上午四點時，溫度為3℃
  - label: C
    content: 禮拜二晚上十點時，溫度為3℃
  - label: D
    content: 在“禮拜……”這段期間的最高溫度是8℃，最低溫度是－2℃
  - label: E
    content: 此函數的週期為24小時
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: T(t)＝8－10 sin($\frac{\pi}{2}$＋$\frac{\pi}{12}t$)。 (A) ○：t＝0，T(0)＝8－10 sin($\frac{\pi}{2}$)＝8－10＝－2。 (B) ×：t＝2，T(2)＝8－10 sin($\frac{\pi}{2}$＋$\frac{\pi}{6}$)＝8－10×$\frac{\sqrt{3}}{2}$＝8－$5\sqrt{3}$。 (C) ○：t＝20，T(20)＝8－10 sin($\frac{\pi}{2}$＋$\frac{20}{12}\pi$)＝8－10×$\frac{1}{2}$＝3。 (D) ×：8－10 ≤ T(t) ≤ 8－10(－1)，－2 ≤ T(t) ≤ 18。 (E) ○：T＝$\frac{2\pi}{\frac{\pi}{12}}$＝24。 故選(A)(C)(E)。
  tags:
