  stem: 西方有本歷史著作記載了關於瘟疫的紀錄：「伯羅奔尼撒人和他的同盟者們，像過去一樣，用他們全部軍隊的三分之二入侵……醫生們完全無法醫治這種病症，因為他們不知道正確的醫療方法。事實上，醫生的死亡數量最多，因為他們頻繁地與患者接觸。任何醫療技術或科學都毫無辦法，向雅典娜神廟祈禱、詢問神讖也都毫無用處可言……過去所遵守的喪葬儀式現在都不再遵守……他們將死者放在火葬堆上，然後點起火來，或是把抬來的屍體直接放在別人的屍體上。」關於這場瘟疫的敘述，下列何者正確？
  options:
  - label: A
    content: 此著作記載的瘟疫應該發生在斯巴達
  - label: B
    content: 當時的醫生認為這場疫病是因為鬼怪作祟導致
  - label: C
    content: 這場瘟疫因為及時撲滅因此並未造成大量人囗死亡
  - label: D
    content: 這本著作是希臘史學家修昔底的斯所撰寫的《伯羅奔尼撒戰爭史》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從「伯羅奔尼撒人和他的同盟者們……入侵」、「向雅典娜神廟祈禱」的說法，可判斷該城邦應為提洛同盟的雅典。(B)題文資料僅說明醫生對瘟疫束手無策，無法判斷其是否認為鬼怪作祟導致。(C)由於無法應付瘟疫，造成大量人口死亡，故任何的喪葬儀式都不再遵守。
