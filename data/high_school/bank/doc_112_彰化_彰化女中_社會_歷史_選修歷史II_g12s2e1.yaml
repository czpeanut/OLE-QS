  stem: 小絢以臺灣醫療史為研究方向參加了全國高中生小論文比賽，下圖是小絢在蒐集完相關資料之後，根據資料所繪製的長條圖。請問根據這張長條圖的內容，下列敘述何者正確？
  options:
  - label: A
    content: 小絢的論文聚焦在日治時期醫療外科手術對死亡率的影響
  - label: B
    content: 總督府推行衛生制度全面西化政策是造成人數消長的原因
  - label: C
