  stem: 在某一地區曾經有一段時間頒布一系列的防疫法令，規定每年須實施 2 次大掃除，結合街庄、社長、保甲、役員等組織進行，並由警察負責監督。此外，更明令各個住戶都要配置捕鼠器以捕捉老鼠，而捕捉到的老鼠需要繳至派出所，並且要進行消毒。下列有關題幹資料的敘述何者正確？
  options:
  - label: A
    content: 此地區為中國境內的西方勢力租界區域，因此有明確的公共衛生法令頒行
  - label: B
    content: 由於傳染病有礙於總督府對於該地區的管理，故嚴格執行公共衛生的政策
  - label: C
    content: 此法令為北洋政府學習西方的衛生醫學知識後，頒布用以預防相關傳染病
  - label: D
    content: 國民政府入臺之初疏於管理，迫使其實施各項法令以阻止當地疫情的擴散
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從街庄、社長、保甲、役員、警察等全面推行防疫法令，可推知為日治時期，總督府在臺灣推行的公共衛生與防疫政策，答案為(B)。
