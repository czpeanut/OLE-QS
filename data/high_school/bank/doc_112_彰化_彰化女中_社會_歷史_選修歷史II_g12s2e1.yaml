  - label: B
    content: 南非好望角─巽他海峽─印尼雅加達─菲律賓馬尼拉
  - label: C
    content: 南非好望角─印度孟買─馬來亞檳城─麻六甲海峽─新加坡
  - label: D
    content: 法國馬賽─蘇伊士運河─印度孟買─馬來亞檳城─麻六甲海峽
  answer:
