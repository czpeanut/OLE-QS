  - label: D
    content: 本草理論
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 原住民族女巫的「竹占」儀式為其與祖靈溝通的重要管道，屬於傳統的(B)泛靈信仰之一。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_5
  section: 1
  number: 5
