  answer_status: verified
  answer_source: answer_key
  explanation: 從英國東航至中國上海的航路，在考慮殖民地歸屬問題下，最佳的航點路線為(C)。(A)途中未經過任何殖民地，算是最差的路線。(B)印尼、菲律賓並非英國的殖民地。(D)蘇伊士運河於 1869 年才開通。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 中國東北在 1910 年爆發嚴重的鼠疫，當時的醫生伍連德解剖染疫死者，得知鼠疫是藉由飛沫傳播鼠疫桿菌而致病後，立刻關閉所有往東北的鐵路，並設計中間隔有吸水藥棉的雙層紗布囗罩讓當地民眾戴上，成功使死亡率大幅下降。請問下列對伍連德防疫措施的理解何者正確？
  options:
  - label: A
    content: 首次引入西方防疫措施
  - label: B
    content: 中國首次推展公共衛生政策
  - label: C
    content: 藉由禮教常規穩定疫情
  - label: D
    content: 受瘴氣論影響致力環境清潔
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)伍連德的作法為防疫措施，非推行公共衛生政策。(C)採用西式的防疫措施，與禮教常規無關。(D)伍連德已知鼠疫是因鼠疫桿菌而致病，因此是細菌論而非瘴氣論。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '民國時期，西醫界提出所謂「廢止中醫」的主張，引起中醫界的強力反對，形成論戰。以下是當時論戰的相關資料：

    資料一：古人《內經》之五臟非血肉之五臟，乃四時之五臟。

    資料二：所謂陰陽者，猶物之有表裡、動靜，動植物之有男女、雄雌。凡物之相反者皆得而名之，其意不過如此，其用不過止此，非有神妙不測之玄機包於其中。

    資料三：中西文化背景不同，中西醫學的基礎也不同，西方科學不是學術唯一之途徑，東方醫學自有其立足點。

    資料四：所謂「歷著明效」，所謂「成效已著」者，無他，多言幸中也，貪天之功以為己也，以言乎實驗，渺乎遠矣。

    以上何者最可能是中醫界對「廢止中醫」所提出的反駁言論？'
  options:
  - label: A
    content: 資料一、二
  - label: B
    content: 資料一、三
  - label: C
    content: 資料二、四
  - label: D
    content: 資料三、四
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一為傳統中醫以五行與四時解釋生命現象的論點；資料二認為「陰陽」只是套用萬物的表裡，並無任何玄妙的理論，顯示反對的立場；資料三主張中西醫學各有其立足點，不可一概論之，屬於捍衛中醫的說法；資料四提到中醫「貪天之功以為己也，以言乎實驗，渺乎遠矣」，認為中醫治病成效卓著只是運氣好，並歸功於經驗累積，其實兩者根本無關。綜合來說，只有資料一、三是中醫界提出的反駁言論，答案為(B)。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_11
