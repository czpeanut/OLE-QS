  stem: 東漢末年張機撰寫《傷寒雜病論》，為秦漢以來的醫藥理論集大成之作。請問下列何者應為其著作的成就？
  options:
  - label: A
    content: 將藥物根據毒性大小分成 3 個類別
  - label: B
    content: 提出中醫看診時的流程及觀察重點
  - label: C
    content: 將藥物依照自然屬性分為 7 個類別
  - label: D
    content: 首次系統化論述經脈和氣血的人體觀
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《傷寒雜病論》收錄大量藥方，書中並提及辨證論治法則，如望聞問切等診療之術，直到今日仍為中醫看診時所遵循，答案為(B)。(A)(C)與史實不符。(D)應是《黃帝內經》。
