  stem: 非洲西岸的聖赫倫納島附近，打撈到一艘 17 世紀初期的歐洲商船，船上有 100 多件中國青花瓷。學者解釋，當時歐洲多國爭奪亞洲貿易主導權，常發生海戰。這艘船最可能是因哪 2 國海戰而沉沒？
  options:
  - label: A
    content: 西班牙與瑞典
  - label: B
    content: 西班牙與丹麥
  - label: C
    content: 葡萄牙與法國
  - label: D
    content: 葡萄牙與荷蘭
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 16 世紀大航海時代後，葡萄牙與西班牙因教皇子午線的約定，各自掌握向東、向西的航線，其中非洲屬於向東的葡萄牙人航線範圍，至 17 世紀後則有荷蘭加入海權的競逐，因此在非洲西岸海戰的交戰國家最可能為(D)葡萄牙與荷蘭。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_3
