  stem: '以下為一封於 1901 年撰寫並公布的信件，請問下列敘述何者正確？

    聽聞你發明的（＿＿＿）成功升起後，我很高興能夠向你的堅持及費心努力表達感謝。你設計的裝置的優勢，讓你的（＿＿＿）可以高速移動。你率先成功建造（＿＿＿）的成就，為進一步的實驗奠定極具價值的基礎。我會提供軍方的建議與經驗，來支持你未來的實驗。我已命令該部門，當你未來的實驗有需要時，派遣一位軍官參與。'
  options:
  - label: A
    content: 信中提及的發明物品為「飛機」
  - label: B
    content: 該封信件的書寫對象應為齊柏林
  - label: C
    content: 撰寫信件的人為美國總統羅斯福
  - label: D
    content: 20 世紀初的發明全賴軍方支持
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從「於 1901 年撰寫」、「成功升起」、「可以高速移動」等線索，可判斷此為齊柏林發明的飛船，(B)為正解。(A) 1903 年萊特兄弟所發明。(C)齊柏林為德國人，不可能獲美國總統派遣軍官參與。(D)題文顯示齊柏林先發明飛船，再獲得國家軍方的支持。
