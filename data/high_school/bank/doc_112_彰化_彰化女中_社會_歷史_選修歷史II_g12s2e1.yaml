  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 晚明吳有性的《瘟疫論》，主張疫病是因為「異氣」由口鼻侵入身體所導致，可使用清熱解毒的藥物治療，答案為(B)。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_12
  section: 1
  number: 12
  type: single
