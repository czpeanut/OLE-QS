  stem: 泰雅族、賽夏族有「竹占」的儀式，即是女巫一邊以膝蓋夾住平放珠子的細竹管，一邊朝珠子搧風，若珠子停住，則表示疾病可痊癒。請問根據上述，臺灣原住民族的醫療文化應和下列何者息息相關？
  options:
  - label: A
    content: 基督教義
  - label: B
    content: 泛靈信仰
  - label: C
