  stem: 16 世紀阿茲特克帝國的人口突然銳減，多數學者認為和瘟疫蔓延有關。由於當地原住民族對許多疾病缺乏免疫力，有近 9 成的人囗染疫死亡，請問該瘟疫的蔓延應和下列何者有最高的相關性？
  options:
  - label: A
    content: 十字軍運動
  - label: B
    content: 工業革命
  - label: C
    content: 奴隸制與三角貿易
  - label: D
    content: 中南美洲獨立運動
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 地理大發現後，隨著歐洲、美洲及非洲人民的交互接觸，來自各地的疾病也傳染開來，其中天花所致的傷害尤其慘烈，加速摧毀阿茲特克帝國及印加帝國，答案為(C)。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '「探究與實作」課程中，2 位同學分別找到關於「日治時期臺灣醫療」的不同記載。

    資料一：1901 年《臺灣醫生免許規則》條規定：醫生經地方長官之許可，得在其管轄範圍執行醫師職務。

    資料二：日治初期，霍亂在臺灣大流行。在霍亂傳染期間，警察和醫師會到處搜尋患者，只要採取新式療法就要被隔離，但隔離之後又缺乏藥物，10 個病人裡只能救活 1 個；但是如果逃到鄉下，以傳統療法醫治，反而大多數能被救活，因此更不相信西醫。杜聰明（臺灣第一個西醫醫學博士）也發現：「恐怕在霍亂及黑死病的治療方面，醫生的處方是任何人都可以治療的，可是一個堂堂的西醫大國卻只能夠束手旁觀，患者幾乎都是死掉的。」他因此認為，中醫藥在治療臺灣本地許多熱帶流行性傳染病，都相當有效，因此必須要好好研究中醫，去蕪存菁，留下中醫真正有用的部分。

    請問日治時期史料中所提到的「醫師」、「醫生」分別指的是什麼？'
  options:
  - label: A
    content: 西醫、漢醫
  - label: B
    content: 日籍醫、臺籍醫
  - label: C
    content: 合法醫、無照醫
  - label: D
    content: 外科醫、內科醫
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料二提到「醫師……採取新式療法」，可知「醫師」為西醫；從「醫生的處方是任何人都可以治療的，……西醫大國卻只能夠束手旁觀」來看，「醫生」應為漢醫，(A)為正解。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史II_g12s2e1_s1_8
