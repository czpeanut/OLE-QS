  stem: 「OK」一詞能夠追溯至 1830 年代刻意拼錯簡稱的流行，美國波士頓年輕的「知識菁英」喜歡將大家熟知的詞轉換成一些大家聽不懂的簡稱：OK，或稱做「ollkorrect」（allcorrect）。在 1800 年代初期，「allcorrect」是個相當常見的用詞，意指所有的事情步上正軌的意思，直至 1839 年中「OK」首次出現在《波士頓晨報》中，並開始成為主流用法，當時城內其他報刊嘲笑該報拼錯 allcorrect 並被廣為出版，在此之後這個詞在城內變得相當知名。而在 1840 年美國總統大選中，也被廣泛用於競選廣告上，因而成為全國的知名詞彙。OK 成為美國知名詞彙的 5 年後，某項發明問世了。這項發明透過電運作，並以點（.）和劃（-）的組合代表英文字母來傳遞短訊，而 OK（.._._）這兩個字母不僅好輸入，也相當容易辨識，因此立即被作為訊息傳遞的標準用法。直到 1890 年代，大部分人們已經忘記 OK 源自何處，甚至開始爭論起它的起源。但無論如何，OK 已經深植在我們的語言之中，現今我們將它當作一個中性詞彙，用來表達任何有關肯定的事物。以上文章為「OK」詞源的歷史，請問以下選項何者較為正確？
  options:
  - label: A
    content: OK 藉著政治宣傳立即成為全國知名的詞彙是源於收音機的出現
  - label: B
    content: OK 意思的轉換代表媒體宣傳之下人類文化受到影響的案例
  - label: C
    content: 依據前後文推斷，文章中所提到的「某項發明」，應指的是無線電
  - label: D
    content: 本文認為 OK 拼字錯誤，對於科技的發明帶來無法挽回的影響
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A) OK 被用於政治宣傳是在 1840 年的總統大選中，當時收音機尚未出現，以報刊為主。(C)從題文的短訊符號來判斷，這項發明應是電報。(D)應是帶來新科技傳播訊息的便利性。
