- id: doc_108_新北_安康_國文_g10s1e1_s1_31
  section: 1
  number: 31
  type: single
  page: 3
  stem: 下列關於本文的闡述，說明正確的是：
  options:
  - label: A
    content: 作者紀錄的食譜跟配方，往往沒有標準的調味和程序
  - label: B
    content: 作者能分辨食材的價格與特質，仰賴的是對料理的直覺
  - label: C
    content: 真正的廚藝並非取決於食材價值，仰賴的是廚師的味覺
  - label: D
    content: 能依馬鈴薯特性給予不同烹調方式的，是為「藝」
  group_stem: 閱讀下文，回答第31.～32.題： 我在法國學藝的初期，有段時間不斷重複煮馬鈴薯，我因而了解每一種馬鈴薯都有細微的不同之處。即使位在同一產地，但因為儲放的位置不一樣，含水量不同，煮出來的效果也就不同。當你明白這其中的差別，你便知道哪一顆馬鈴薯適合榨成泥，哪一顆馬鈴薯適合佐沙拉，這才能從只用同一種方式水煮馬鈴薯的「匠」，提升到視馬鈴薯特性予以不同烹調方式的「藝」。 當你對食材充分地了解，就能展現出料理的深度。廚藝，就是不厭其煩地探討食材的細節，深入地體會和觀察，並找到它最合適的呈現方式。與一般廚師不同，我從不寫食譜，也不刻意記錄任何配方，我所仰賴的是「料理的直覺」。我覺得料理是沒有標準程序的，食材的狀況不同，作法也不盡相同，調味要增減，時間要調整，仰賴的是廚師對食材的掌握。（節錄自江振誠《初心．匠與藝的認知》，平安文化）
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
