  group_stem: '閱讀下文，回答第33.～35.題： 甲、 石崇廁，常有十餘婢侍例，皆麗服藻飾。置甲煎粉、沉香汁之屬，無不畢備。又與新衣著令出，客多羞不能如廁。王大將軍往，脫故衣，著新衣，神色傲然。群婢相謂曰：「此客必能作賊。」（《世說新語．汰侈》）

    乙、 王敦初尚主，如廁，見漆箱盛乾棗，本以塞鼻，王謂廁上亦下果，食遂至盡。既還，婢擎金澡盤盛水；瑠璃碗盛澡豆，因倒著水中而飲之，謂是乾飯。群婢莫不掩口而笑之。（《世說新語．紕漏》） 丙、 依據長野草風的說法，廁所不管打掃得多乾淨，一定仍會發出一點淡淡的氣味。那氣味混合了除臭劑、糞尿、庭院雜草、泥土、蘚笞等的味道，而且每戶人家都稍有不同，高尚的人家自會發出高尚的氣味。因此只要聞一聞廁所的氣味，就大概可以了解房中人的人品，可以想像他們是如何生活，名古屋上流家庭的廁所，據說大都散發著一股細緻都雅的氣味。……眾所皆知，廁所適於冥思，但近來的沖水式廁所，卻無論如何都不盡如人意。之所以如此，一定仍有其他種種原因，但一改成沖水式，雖說廁所變得乾乾淨淨，卻也喪失了草風氏所說的高尚、都雅的氣味，沖水式廁所之不如人意，與這大有關係。（節錄自谷崎潤一郎〈廁所的種種〉）'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
