  stem: 已知電阻的因次為$\frac{ML^{2}T^{－3}}{ A^{2} }$，磁場的因次為$\frac{TM^{－2}}{ A }$。（L：長度。M：質量。T：時間。A：電流）考慮如圖的線路，右邊是質量為m而長度為l的金屬棒，可以在導線上滑動形成導通的迴路，且滑動時摩擦力可忽略不計。將整個迴路放置於量值為B、方向為射入紙面（以 × 表示）的均勻磁場中，除了電阻R外，假設此迴路其餘部分的電阻皆可忽略。如果金屬棒有一初速v，則經過一段特定時間t＝0.69τ之後，金屬棒的速率就會減半成v／2，而且τ大致上與初速無關。其原理是因為電磁戚應：金屬棒的運動造成迴路的磁通量改變，產生應電流，而此電流讓運動中的金屬棒，在磁場中受到一反向的磁力，因此會減速，且應電流在電阻R上會產生功率消耗。τ由時間的因次求得，下列何者為τ的表示式？
  options:
  - label: A
    content: $\frac{mR}{ l^{2}B^{2} }$
  - label: B
    content: $\frac{m^{2}R}{ lB^{2} }$
  - label: C
    content: $\frac{mB}{ lR^{2} }$
  - label: D
    content: $\frac{mB^{2}}{ l^{2}R }$
  - label: E
    content: $\frac{l^{2}B^{2}}{ mR^{2} }$
