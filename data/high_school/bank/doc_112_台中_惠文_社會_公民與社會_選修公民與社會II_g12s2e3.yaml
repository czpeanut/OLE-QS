  stem: 有 27 名臺灣民眾，因在中國福建廈門擔任「社區主任助理」，遭內政部認定違反《兩岸關係條例》相關規定，各開罰 10 萬元，27 人不服提告救濟，臺北高等行政法院認為，內政部扼殺人民工作權及思想自由，來防堵「不明確」的威脅，不符比例原則，且有違憲之虞，判決全部撤罰，全案可再上訴。若以新制《行政訴訟法》推論，以下何者正確？
