  section: 1
  number: 8
  type: single
  page: 2
  stem: 高三學生阿文某日上課時因偷滑手機被老師當場沒收，阿文辯解自己上課滑手機只是想查詢老師剛才講述的英文單字，並非用來玩遊戲等不當用途，希望老師能歸還手機。但老師不理會阿文的解釋，並認為他犯錯不知悔改、態度不佳，不僅未歸還手機還以大過一支加以處分。阿文深感不服，認為老師侵犯他的權利。下列相關敘述，何者正確？
  options:
  - label: A
    content: 基於《憲法》保障之訴訟權，阿文可展開行政救濟，若被駁回可採取司法救濟
  - label: B
    content: 老師沒收手機的行為侵犯阿文的財產權，此為《憲法》保障的概括基本權之一
  - label: C
    content: 若阿文為初犯且情節輕微，則沒收手機並記大過之處分違反法律保留原則
  - label: D
    content: 老師不理會阿文的解釋雖違反程序正義之要求，但落實了匡正正義的精神
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)學生若認為權益受損，可依程序申請校內申訴、向學校所在地之直轄市、縣（市）主管機關提出再申訴，未果後，得提起行政訴訟，為正解。(B)憲法第 15 條保障人民之財產權，為列舉基本權。(C)應是違反比例原則。(D)沒有讓當事人陳述意見的機會，違反程序正義，也無法達到實質正義，與匡正正義無關。
