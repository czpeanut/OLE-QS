  explanation: 「新聞採訪者於有事實足認特定事 件屬大眾所關切並具一定公益性之事務，而具有新聞價值」此為新聞自由；而「於公共場域中得合理期待不受侵擾之自由與個人資料自主權」可知此案涉及新聞自由與隱私權之爭議，答案選(A)。
