  stem: 甲在小吃店消費後，假裝接手機到店外通話，趁店主忙碌不注意時，未結帳即快速離去，店主調閱店內的監視錄影畫面後記住了甲的容貌，於甲再次至同店用餐時，趁機將甲抓住。依我國法律規範，下列敘述何者正確？
