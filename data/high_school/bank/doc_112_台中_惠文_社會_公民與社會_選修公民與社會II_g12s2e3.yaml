  page: 1
  stem: 國家批准藥物上市，卻無力排除藥物對人體的不良反應，導致用藥人死亡、障礙或重大疾病時，用藥人可依據《藥害救濟法》申請藥害救濟。但因為批准藥物上市是依循療效大於風險的準則，難謂公務員的行為違法或有責；另方面用藥人又不是因追求特定公益目的而遭受特別犧牲。因此學理認為，行政法上的藥害救濟是基於衡平原則、社會共同體連帶的思維。由此可知，藥害救濟制度的國家責任類型應歸屬於下列何者？
  options:
  - label: A
    content: 國家賠償責任
  - label: B
    content: 損失補償責任
  - label: C
    content: 社會補償責任
  - label: D
    content: 公務員過失責任
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 藥害救濟屬於社會補償的一種。社會補償是指國家對於人民的特別犧牲應給予補償，基於社會連帶的理念，立法填補損害，讓當事人免於爭執不休。答案為(C)。
