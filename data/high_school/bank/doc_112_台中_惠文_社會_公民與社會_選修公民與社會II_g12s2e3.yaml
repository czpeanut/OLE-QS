- id: doc_112_台中_惠文_社會_公民與社會_選修公民與社會II_g12s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 關於性別變更登記一事，我國法律並未有明確的規定。目前，戶政機關的執法依據可追溯至內政部於 2008 年所發布之函令。該函令指出，就性別變更登記而言，不論由女性變更為男性，或是由男性變更為女性，都要求取得兩名精神科專科醫師所進行的評估鑑定診斷書，以及由合格醫療機構開具已實施性器官摘除手術的完成證明書。然而，這項規定近年來引發了爭議，訴訟案件陸續進入行政法院，請求做出准許性別變更的行政處分。臺北高等行政法院的一名承審法官認定該規定涉及違憲，故作出停止審理的裁定，並向憲法法庭提出聲請，要求審查其合憲法。然而，在 2023 年 2 月，大法官議決後作出不受理裁定。下列何者最有可能為大法官作出「不受理裁定」的理由？
  options:
  - label: A
    content: 憲法法庭不宜針對爭議議題進行判決
  - label: B
    content: 內政部的函令並非法律位階的法規範
  - label: C
    content: 宜由立法院制定關於性別變更的法律
  - label: D
    content: 應由當事人自行向憲法法庭提出聲請
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 法官可以聲請釋憲的標的在於「法律」，至於行政機關的命令，依照釋字第 216 號解釋，「法官依據法律獨立審判，《憲法》第 80 條載有明文。各機關依其職掌就有關法規為釋示之行政命令，法官於審判案件時，固可予以引用，但仍得依據法律，表示適當之不同見解，並不受其拘束……」因為法官不受命令拘束，所以不在法官可以聲請釋憲的範圍。因此，過去法官如果對判例有意見，聲請釋憲的結果，就會被大法官不受理，因為內政部的函令並不是法律，而是行政規則，大法官因而裁定不受理。答案為(B)。
