  stem: 2023 年新北市某幼兒園爆發教保員疑似餵食幼童不明藥物案。該案經新北市地檢署偵查終結後，對相關人員均予以不起訴處分，證明該幼兒園無不當對待幼生情事。新北市教育局亦主動撤銷先前廢止該幼兒園設立許可的行政行為，使其恢復立案。試問新北市教育局的作為應為下列何種行政行為？
