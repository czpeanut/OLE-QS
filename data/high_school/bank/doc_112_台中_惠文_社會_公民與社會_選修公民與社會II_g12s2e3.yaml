  stem: 法務部公告《民法》第 1085 條修正草案，預計將原條文「父母得於必要範圍內懲戒其子女」修正成「父母保護及教養未成年子女，應考量子女年齡及發展程度，尊重子女人格，不得對子女為身心暴力行為」。請問關於父母對於未成年子女保護及教養之權利，下列敘述何者正確？
  options:
  - label: A
    content: 屬於人格權，可以讓與或繼承
  - label: B
    content: 屬於身分權，不得讓與或繼承
  - label: C
    content: 屬於身分權，可以讓與或繼承
  - label: D
    content: 屬於人格權，不得讓與或繼承
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 身分權（或身分法益），係指基於特定身分關係而發生的權利，主要有父母對未成年子女權利義務之行使與負擔（親權）、配偶權與繼承權等。此屬於專屬權：不可為讓與、繼承之標的。答案為(B)。
