  stem: 布農族人王光祿因持用先進獵槍射殺保育類野生動物長鬃山羊、山羌各 1 隻，經判刑確定。最高法院受理檢察總長提起非常上訴後，經開庭調查及廣泛蒐集資料，於 2017 年聲請釋憲。合議庭認為狩獵是原住民傳統文化之一，《槍砲彈藥刀械管制條例》限制原住民僅能以自製的落後槍枝打獵，致不能使用較安全的現代化制式獵槍；《野生動物保育法》限制原住民只能基於因動物逾量、學術研究、教育目的或傳統文化祭儀必要，進行狩獵，罔顧其生活習慣，違反《憲法增修條文》肯定多元文化、維護原住民傳統及促進其發展的意旨，乃請求大法官就上述法條未考量原住民特殊情形之部分宣告違憲。<u>若當時大法官依現行《憲法訴訟法》進行違憲審查，則下列相關推論何者最有可能</u>？
  options:
  - label: A
    content: 此聲請案應被歸類於裁判憲法審查案件
  - label: B
    content: 憲法法庭於公開法庭進行言詞辯論程序
  - label: C
    content: 以閉門會議方式對王光祿做出無罪判決
  - label: D
    content: 大法官須至少 10 人同意才可宣告違憲
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此案是針對《槍砲彈藥刀械管制條例》及《野生動物保育法》是否侵害原住民族之文化權，屬於法規範憲法審查之案件類型。(B)依據《憲法訴訟法》第四節言詞辯論，原則上裁判應經過法庭之言詞辯論程序，為正解。(C)憲法法庭召開以公開審理為原則。(D)依據《憲法訴訟法》第 30 條：判決，除本法別有規定外，應經大法官現有總額 2∕3 以上參與評議，大法官現有總額過半數同意。大法官總額為 15 人，過半數為 8 人。
