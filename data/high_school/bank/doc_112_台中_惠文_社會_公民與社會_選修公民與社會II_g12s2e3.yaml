  stem: 以下摘錄自《司法院釋字第 603 號解釋》：「《戶籍法》有規定請領國民身分證，應捺指紋並錄存。但未滿 14 歲請領者，不予捺指紋，俟年滿 14 歲時，應補捺指紋並錄存。且請領國民身分證，不依前項規定捺指紋者，不予發給。對於未依規定捺指紋者，拒絕發給國民身分證，形同強制按捺並錄存指紋，以作為核發國民身分證之要件，其目的為何，《戶籍法》未設明文規定，於《憲法》保障人民資訊隱私權之意旨已有未合。縱用以達到國民身分證之防偽、防止冒領、冒用、辨識路倒病人、迷途失智者、無名屍體等目的而言，亦屬損益失衡、手段過當，不符【甲】原則之要求……」關於解釋內容以下何者敘述正確？
  options:
  - label: A
    content: 【甲】原則應為「法律保留原則」
  - label: B
    content: 若為了防止冒領身分證或辨識之目的，《戶籍法》按捺指紋規定是為妥當
  - label: C
    content: 強制民眾按捺指紋的規定雖有法律授權，但該規定顯然所致損害大於利益
  - label: D
    content: 隱私權非《憲法》明文列舉的基本權，個人對其指紋資訊控制權未受《憲法》保障
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從題文「……亦屬損益失衡、手段過當」可知【甲】應為比例原則。(B)按捺指紋的方法有過度侵害人民資訊隱私權之疑慮。(D)經由釋字 603 號解釋，可知個人對其指紋資訊控制權屬於概括基本權之保障類型。
