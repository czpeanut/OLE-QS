  stem: 人民在面對公權力時，可從形式合法性與實質合法性來判斷公權力的行使是否適當。根據上文，請問下列何項組合屬於「形式合法」的分析？(甲)處分的警察機關是否有管轄的權限；(乙)警方的開單是否按照正當行政程序；(丙)交通罰單上的裁量金額是否夠明確；(丁)交通違規的模態是否符合法律依據
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (甲)(丁)
  - label: C
    content: (乙)(丙)
  - label: D
    content: (乙)(丁)
  group_stem: ◎有議員統計近 5 年臺北市的交通違規罰單申訴、撤銷件數。根據統計，民眾在申訴後證實為無效、錯誤的罰單，比率超過 10％。其中有超過 40％撤銷原因為「違規屬實，但舉發有爭議」，高居撤銷原因首位。此種狀況多因民眾檢舉違規時提供的事證不足或有誤，導致警方舉發失敗。例如：有民眾遭檢舉未禮讓行人而收到罰單，但附帶的照片上只有車沒有行人，由此可知，員警接到檢舉之後，並未好好審查照片的內容。除了因民眾檢舉而衍生的罰單爭議，執法的警方也常因認證錯誤、引用法條不當、重複舉發等疏失，開出無效罰單。請問：
  answer:
