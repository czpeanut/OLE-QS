  type: single
  page: 1
  stem: 市政府為興建捷運系統，因高架工程須穿越小華土地的上空，故給予小華一筆錢。該筆金錢的性質應屬於下列何者？
  options:
  - label: A
    content: 國家賠償
  - label: B
    content: 損失補償
  - label: C
    content: 損害賠償
  - label: D
    content: 社會補償
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《行政執行法》第 41 條：「人民因執行機關依法實施即時強制，致其生命、身體或財產遭受特別損失時，得請求補償。但因可歸責於該人民之事由者，不在此限。前項損失補償，應以金錢為之，並以補償實際所受之特別損失為限。」題文之補償情形屬於此類，答案為(B)。
