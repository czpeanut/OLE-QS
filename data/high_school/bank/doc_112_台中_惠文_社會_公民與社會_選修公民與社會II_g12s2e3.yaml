  section: 3
  number: 33
  type: multiple
  page: 7
  stem: 《原住民身分法》要求原住民與非原住民結婚所生之子女，須跟著具有原住民身分的父親或母親的姓氏，或取原住民傳統名字，才能取得原住民身分。這導致部分有原住民血統的民眾，因為隨著非原住民的漢人父親取了漢姓，而無法取得原住民身分。憲法法庭認定，此種情形違反憲法所保障有關原住民身分認同之人格權，亦牴觸種族平等及性別平等。下列有關性別平等原則的判斷，哪些符合本件憲法判決的精神？
  options:
  - label: A
    content: 原母漢父的子女登記為原住民的比例遠低於原父漢母，呈現性別實質不平等
  - label: B
    content: 該法規定原住民之身分須經國家認定登記才能取得，故造成性別實質不平等
  - label: C
    content: 原住民子女不選擇從原母姓氏而選擇從漢父姓氏之行為，牴觸憲法性別平等
  - label: D
    content: 唯有登記原住民傳統名字，才得以超越性別且有效保障原住民種族平等與身分認同
  - label: E
    content: 取得原住民身分須跟從具原住民身分父母的姓氏，使身分認定受主流性別文化影響
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(E)為正解。(B)是要求原住民血統者須經國家認定方能取得原住民身分，與漢人不同，此屬於種族不平等的問題。(C)此為原住民子女之選擇，應與父權社會的思想有關，私人行為與牴觸憲法不平等無關。(D)保障原住民種族平等與身分認同的方式有多種，並非必要登記原住民的傳統姓名。
