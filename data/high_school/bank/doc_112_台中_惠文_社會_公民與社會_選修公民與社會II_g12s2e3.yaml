  stem: 某水果日報社記者，主跑娛樂演藝新聞，跟蹤拍照某電腦集團副總夫婦。遭報警後，根據《社會秩序維護法》第 89 條第 2 款規定「無正當理由跟追他人經勸阻不聽，處 3,000 元以下罰鍰」加以裁罰。當事人提起釋憲後，大法官會議在《司法院釋字第 689 號解釋》中提到：「《社會秩序維護法》第 89 條第 2 款規定，旨在保護個人之行動自由、免於身心傷害之身體權、及於公共場域中得合理期待不受侵擾之自由與個人資料自主權，而處罰無正當理由，且經勸阻後仍繼續跟追之行為，與法律明確性原則尚無牴觸。新聞採訪者於有事實足認特定事件屬大眾所關切並具一定公益性之事務，而具有新聞價值，如須以跟追方式進行採訪，其跟追倘依社會通念認非不能容忍者，即具正當理由，而不在首開規定處罰之列。於此範圍內，首開規定縱有限制新聞採訪行為，其限制並未過當而符合比例原則。」在此釋憲案中，主要涉及下列哪 2 種價值或權利的衝突？
