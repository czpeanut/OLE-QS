questions:
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 受到COVID-19疫情影響，觀光業受挫，政府觀光局推出「悠遊國旅補助方案」，團體旅遊兩天一夜以上，每團可申請補助2萬元；個別旅客於平日入住有參加活動的合法旅宿，一個房間一個晚上最高折抵800元。此外，飯店業者也祭出限時優惠，入住豪華套房只要500元。請問：關於以上的方案對於經濟成長有何影響？
  options:
  - label: A
    content: 政府編列安心旅遊補助的預算能提升GDP的數值
  - label: B
    content: 飯店業者提出的優惠方案會增加移轉性支出比例
  - label: C
    content: 飯店業者非政府機關，其優惠對GDP不產生影響
  - label: D
    content: 政府補助方案吸引觀光客旅遊能增加消費性支出
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '下表是我國主計總處發布的南韓與我國近五年來的經濟成長率，關於此表分析下列何者正確？

    |  | 南韓 | 臺灣 |

    | --- | --- | --- |

    | 2017年 | 3.2% | 3.31% |

    | 2018年 | 2.9% | 2.79% |

    | 2019年 | 2.2% | 3.06% |

    | 2020年 | -0.7% | 3.36% |

    | 2021年 | 4.1% | 6.57% |'
  options:
  - label: A
    content: 2020年我國的實質GDP總值大於南韓
  - label: B
    content: 南韓2019年的實質GDP少於2018年
  - label: C
    content: 我國實質GDP從2017年開始逐年增加
  - label: D
    content: 南韓2020年實質GDP一定少於2018年
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下表為某年我國與其他國家在人均GDP與以美國為基準之人均GDP PPP的相關資料，已知此表共採計39個國家，根據此表下列哪個解讀是正確的？

    |  | 人均GDP（美元） |  | 人均GDP PPP |  |

    | --- | --- | --- | --- | --- |

    |  | 名目GDP | 排名 | PPP | 排名 |

    | 臺灣 | 27,371 | 28 | 54,841 | 10 |

    | 新加坡 | 54,781 | 10 | 93,396 | 2 |

    | 韓國 | 30,830 | 26 | 44,575 | 19 |

    | 日本 | 38,673 | 22 | 42,776 | 23 |

    | 美國 | 61,590 | 5 | 61,590 | 9 |

    | 瑞士 | 79,456 | 2 | 63,079 | 6 |

    | 39國平均 | 42,311 |  | 49,615 |  |'
  options:
  - label: A
    content: 臺灣的人均GDP在他國可購買的一籃子商品，價值約為五萬四
  - label: B
    content: 臺灣該年的GDP大幅增加，經濟成長率高於他國，僅次新加坡
  - label: C
    content: 同樣一籃子商品物價，美國的當期價格高於新加坡的當期價格
  - label: D
    content: 若瑞士想以當期GDP作跨國比較，應以79,456的數據做為參考
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某國政府公布今年8月的CPI年增率為1.74%，媒體報導後引發部分網友批評，認為青菜、雞蛋、牙膏、奶粉等生活所需明明一直漲價，數據與感受實在差太遠。不過，也有專家指出，筆電、記憶卡及家電等產品連年大幅降價，因此整體計算而得的物價漲幅確實未超過2％。上述報導指出CPI可能與民眾的感受不符，請問可能是下列何種原因所致？
  options:
  - label: A
    content: 物價變動時，消費者會改買上漲幅度較低的產品
  - label: B
    content: 物價變動時，消費者會改變消費組合以節省開支
  - label: C
    content: CPI不能看出極端值，但價格變動大的產品觀眾腦受較深刻
  - label: D
    content: CPI衡量整體物價變動，但消費者會以較常購買的產品價格作為比較基準
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 臺灣因新冠疫情影響民眾外出用餐意願，讓名外送平臺業績大幅提升，外送平臺表示，1月相比，2、3月業績約有4成增長。但部分外送員直言，3月份個人薪資並未增加，甚至可能減少，大嘆「外送員忙並不一定多賺錢，失業的都來當外送員！」因為不景氣讓更多人加入外送，結果每件酬勞下降：2020年2月前，每件外送可70元，送160件以上每件85元，但現在每件剩55元，請根據前述内容判斷，下列說明何者最適當？
  options:
  - label: A
    content: 外送員的每件報酬降低，主因是外送員勞動供給量大增
  - label: B
    content: 外送員的薪資沒有增加，是因其勞動供給增加幅度過快
  - label: C
    content: 平臺業者的勞動需求增加，是因外送員的薪資水準降低
  - label: D
    content: 外送平臺業績成長，總產值增加，外送員薪資應會提高
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 近年資訊工程師是一種光環，代表了高薪及先進的AI人工智慧產業，讓年輕學子紛紛投入資工相關系所就讀，因為畢業後找工作的時間平均僅1個月；某週刊調查這個產業後發現，有八成的工程師擔心資訊進步的速度非常快，今天的潮流，可能是明天的落伍，擔心自己的技術跟不上時代而被裁員，「進退兩難」成為許多資訊工程師的寫照。從上述的調查中，可推測資訊工程師過去和現在分別面對的是哪一種失業？
  options:
  - label: A
    content: 過去—循環性失業：現在—結構性失業
  - label: B
    content: 過去—季節性失業；現在—循環性失業
  - label: C
    content: 過去—结構性失業；現在—循環性失業
  - label: D
    content: 過去—摩擦性失業；現在—结構性失業
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 英國2021年五月通膨率為2.1%，來到2019年新冠肺炎疫情爆發以來的最高點，國家統計局表示五月的通膨主要因素來自於原油價格與燃料價格的走高，下列何者與英國此次通多原因類似？
  options:
  - label: A
    content: 中央銀行降低利率增加現金市場流動
  - label: B
    content: 調升基本工資使廠商的生產成本增加
  - label: C
    content: 印度、巴西等開發中新興國家人口成長快速
  - label: D
    content: 戰後臺灣銀行大量發行貨幣使貨幣供給大增
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 小翔擔任清潔公司的派遣人力，工時長短與工作時間皆不固定。小翔的女友小芯在疫情衝擊之下被裁員，目前正積極投履歷尋找新工作，小翔有個弟弟大寶是大四學生，還有一個姊姊失業了一年，歷經這一年來的求職失敗，使得現在姊姊即使有能力，但卻不再繼續尋找工作。請根據題文判斷下列敘述何者正確？
  options:
  - label: A
    content: 小芯的失業類型為循環性失業，大寶則屬於怯志工作者
  - label: B
    content: 小翔因工時長短和時間不固定，故無法列入勞動力計算
  - label: C
    content: 姊姊放棄找工作會讓失業率下降但不利於勞動市場發展
  - label: D
    content: 大寶畢業之後立即開始找工作，會讓就業人口數量上升
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 阿屏是一名高中教師，每月領固定的薪資。政府核定自2022年1月1日起，軍公教薪資調升4%。已知2021年的消費者物價指數（CPI）為104，假設2022年的CPI為106，則阿屏的實質薪資與名目薪資會如何變動？
  options:
  - label: A
    content: 阿屏的實質薪資下降，但名目薪資上升
  - label: B
    content: 阿屏的實質薪資上升，且名目薪資上升
  - label: C
    content: 阿屏的實質薪資下降，且名目薪資下降
  - label: D
    content: 阿屏的實質薪資上升，但名目薪資下降
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 2020年底我國國會通過數項行政命令查案，確立元旦開放萊克多巴胺美豬進口。然而各地方政府趕在立法院同意備查衛福部的行政命令前，修正相關食品安全自治條例，要求萊劑零檢出，造成一塊豬肉，萊克多巴胺殘留兩種認定現象。請問面對此種爭議，下列哪項處理方式較符合我國情況？
  options:
  - label: A
    content: 我國憲法賦予中央政府的權限較大，故地方政府必須按照中央的規定行事
  - label: B
    content: 我國法賦予地方政府的權限較大，故地方政府可無視中央自訂食安法規
  - label: C
    content: 我國憲法針對中央與地方權限遇有爭議時，規定由中央民意機關協助解決
  - label: D
    content: 若遇到中央與地方權限爭議欲聲請釋憲，行政機關須先窮盡所有訴訟救濟
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某國國會大選結束後，因無法取得過半的席次，由席次較多的X黨與國會其他政黨組成聯合內閣，以取得執政的地位，請問：下列何者是此國家政府體制的特徵？
  options:
  - label: A
    content: 人民可直接選舉國家最高行政首長
  - label: B
    content: 國會可以對總理進行不信任案投票
  - label: C
    content: 人民選出總統，再由總統任命首相
  - label: D
    content: 元首可動用覆議權制衡國會的法案
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 日前行政院南部聯合服務中心執行長遭人檢舉，其在疫情期間疑似違反防疫規定與朋友聚餐，該事件立即引發各方檢討聲浪，由於該執行長係由行政院院長任命，院長也立即出面表示將深刻檢討，執行長本人出面表示只有到場致意，並未參與聚餐，過程中完全合乎防疫規定，但為此造成各界誤解已向長官請辭，請問下列關於該事件的敘述，何者正確？
  options:
  - label: A
    content: 依據上述題文判斷，該執行長應該屬於政務官
  - label: B
    content: 依政府課責的精神，應由高雄市議會進行監督
  - label: C
    content: 若執行長請辭獲准，屬於承擔法律責任的展現
  - label: D
    content: 若調查後違規屬實，應移送監察院公懲會懲戒
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 部分國家的食物供應鏈因為嚴重特殊傳染性肺炎疫情的關係，從生產、運輸到銷售都出現問題，因此出現糧食危機。例如：美國關閉邊境，墨西哥的移工無法進入美國，導致美國的糧食生產受阻，而中國黑龍江地區也因為第二波疫情的爆發，封城封路的措施使得耕種與採收都受到影響。此外，許多國家減少貨輪的進出量，或是甚至直接封鎖港口，導致國際貨運的流通速度變慢很多，進而導致糧食或飼料依靠進口的國家受到衝擊。下列何者最能說明疫情造成各地糧食危機的現象？
  options:
  - label: A
    content: 全球化形成高度專業分工體系，經濟互賴程度提高
  - label: B
    content: 各國貧富差距逐漸擴大，成為移工出走的主要推力
  - label: C
    content: 因人口跨國性流動日益頻繁，使疾病傳播更為快速
  - label: D
    content: 因疾病使國際衝突加劇，各地發生戰亂而引發飢荒
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 教育部受託辦立公立高中教師甄選，為使原住民重點學校任用原住民教師比率符合《原住民族教育法》的規定，將原住民重點學校教師缺額獨立列出專區。但媒體報導，國教署辦理109學年公立高級中等學校教師甄選上月公告複試名單，某校教甄另設原住民組並招考化學老師，進入複試者的初試成績僅8分，令外界擔憂此制度公平性。國教署對此表示，該名甄試者因成績未達最低錄取標準，教育部的教師甄選委員會已決議不予錄取。請問下列敘述何者最能說明此事件引發的公平性爭議？
  options:
  - label: A
    content: 普通考生與原住民考生的考試規則不同，檢視標準也不同，不符合實質上的平等
  - label: B
    content: 普通生與原住民考生錄取率不同，原住民考生錄取率較高，不符人人平等的精神
  - label: C
    content: 原住民考生錄取分數遠比普通生低，雖強調積極差別待遇但恐造成錄取品質不同
  - label: D
    content: 原住民初試成績過低卻能進複試應考，成績評斷基準不同，排擠普通生錄取名額
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 某Youtuber網紅遭某周刊爆料疑似跟男網友相約一夜情，該網友將自己與該名網紅的私密對話截圖並提供給該周刊，該周刊全文照登，讓該名網紅的同志身分曝光。報導上網後，遭大批網友批評，指責該周刊不應該將名人你情我願的私生活公開報導。下列何者最能夠詮釋該周刊報導所涉及的爭議？
  options:
  - label: A
    content: 媒體報導形成輿論過程中，存在著媒體近用權之不平等現象
  - label: B
    content: 媒體以腥羶色內容吸引閱聽人注意，與媒體壟斷的現象有關
  - label: C
    content: 媒體報導內容形塑了男同志易與網友相約一夜情的刻板印象
  - label: D
    content: 媒體報導內容不僅不屬公益性事務，更有侵害他人隱私之虞
