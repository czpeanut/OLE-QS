  stem: 請問美國總統拜登提出的紓困與經濟刺激方案，可能會造成何種性質的物價膨脹？
  options:
  - label: A
    content: 需求拉升的物價膨脹
  - label: B
    content: 出口導向的物價膨脹
  - label: C
    content: 成本推動的物價膨脹
  - label: D
    content: 進口導向的物價膨脹
  group_stem: '◎因新冠肺炎疫情經濟大受影響的美國，總統拜登在2021年推出「美國救助計劃」(American Rescue Plan)，為美國有史以來最大的的紓困法案。總計1.9兆美元的經費，將用在防疫、教育、企業、勞工等補助與支出上，這使得股市連續攀高，有人對經濟前景樂觀期待，但也有人提出警告，擔心經濟會陷入新危機。

    兩位著名的經濟學家桑默斯與克魯曼，在2月針對這項方案進行辯論。桑默斯認為拜登方案對經濟帶來的實際產出，會因物價膨脹影響而拉低，最後又可能導致經濟衰退。克魯曼則稱「抗疫如作戰」，且很多人領到錢不會花掉，而是會存起來以備不時之需。

    後來在5月有13個州宣布，將終止發放由聯邦政府撥款的每人每週300美元失業津貼。因為統計指出，美國的就業市場雖然受到疫情衝擊、失業率一度高達14%，但從2021年起的工作機會已持續增長，薪資也緩步回升，不過就業大環境卻意外降溫。各州州長認為可能是因為疫情後，政府持續發放優渥的失業津貼，導致失業勞工在疫情趨緩的此時卻失去了返回職場的動力。'
