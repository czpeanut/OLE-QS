- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s3_33
  section: 3
  number: 33
  type: calc
  page: 5
  stem: '乙報導內容中的該名乘客，可以主張下列何種權利要求媒體訂正不實報導？請先勾選一項，並說明理由(5分)。

    <u>第34-35題</u>

    ◎文化部原先打算以四年58億的預算委託公共電視籌設全英語發聲的「國際影音平臺」，影音平臺預計在2021年上線，內容主打新聞、專題、紀錄片等，成立平臺最主要的目的則是為了向國際社會介紹臺灣的聲音與價值，以提高臺灣的國際能見度與影響力。看似立意良善的計畫，卻引起許多反對與質疑的聲浪。8反對與質疑者認為，公共電視是屬於全體國民的，成立的目的在於為公眾價值服務，而服務的方式。就是要提供大眾具有公共利益的內容與資訊，所以即使是沒什麼人關注的新聞，只要符合公共利益，就是公視應該要做的內容。因此，公視製播節目具獨立自主性，不受干涉，不應該是為國家和政府宣傳的國家機器。然而，公視的資金來源有一部分是來自政府編列的預算，如果公視從民間或觀眾獲得的捐款數目過少，在財務狀況吃緊下可能就必須更加倚重政府提的預算才能繼續運作，進而影響公視製作節目時的考量。

    公視董事會雖於2020年7月臨時會以11票對4票通過該計畫，但為平息外界疑慮，文化部於7月底宣布終止此國際影音平臺的委託案。最後，國際影音平的計畫由財團法人中央通訊社辦理。'
