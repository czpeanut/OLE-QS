  stem: 請根據題幹訊息判斷，原保地使用權流失到非原住民手中，對原住民族造成的衝擊最可能為以下何者？
  options:
  - label: A
    content: 原住民族陷入經濟弱勢，更不利其生存權
  - label: B
    content: 降低原住民族自我認同，更不利文化傳承
  - label: C
    content: 原保地多位於山坡地，破壞當地環境永續
  - label: D
    content: 原住民族因土地流失，壓縮政治參與機會
  group_stem: '我國對於山坡地範圍內的原住民保留地（以下簡稱原保地），有規定除依法不得私有外，應輔導原住民取得承租權或無償取得所有權。不過近年來卻發現，依法只能在原住民之間進行買賣的原保地，已大量透過假人頭等遊走法律邊緣手法，實際移轉給非原住民與財團進行開發，國內多處知名溫泉區、露營區、甚至日月潭邊的觀光熱點，都有許多原保地上冒出來的大型開發案。

    長期關注部落文化保存的人士認為，若要摒除族人因經濟等各種原因賣地，守護祖先土地，應落實《原住民族基本法》的精神，將土地由部落來管理，族人們只有使用權而無擁有權，買賣土地要經過部落會議討論。邵族長老則表示：「我們邵族人要的不多，希望能擁有一塊土地，讓邵族試辦共管，我們七大姓氏的長老們有高度共識，要守住土地才能守住語言與文化。」'
- id: doc_110_桃園_武陵_社會_公民與社會_選修公民與社會I_g12s1e1_s2_27
  section: 2
  number: 27
  type: single
  page: 4
  stem: '針對上述原住民保留地流失的問題，下列處理方式何者較符合原住民部落的需求？

    第28-29題'
  options:
  - label: A
    content: 加強族人對原保地私有財產權觀念的重視，避免被有心人士利用而變賣土地
  - label: B
    content: 建議原住民部落至地方法院登記為私法人，以便享有原住民保留地的所有權
  - label: C
    content: 將原保地視為各部落的集體財產，落實賦予原住民族「部落公法人」的資格
  - label: D
    content: 集結各原住民部落長老向原住民委員會倡議，由政府統籌管理原住民保留地
  group_stem: '我國對於山坡地範圍內的原住民保留地（以下簡稱原保地），有規定除依法不得私有外，應輔導原住民取得承租權或無償取得所有權。不過近年來卻發現，依法只能在原住民之間進行買賣的原保地，已大量透過假人頭等遊走法律邊緣手法，實際移轉給非原住民與財團進行開發，國內多處知名溫泉區、露營區、甚至日月潭邊的觀光熱點，都有許多原保地上冒出來的大型開發案。

    長期關注部落文化保存的人士認為，若要摒除族人因經濟等各種原因賣地，守護祖先土地，應落實《原住民族基本法》的精神，將土地由部落來管理，族人們只有使用權而無擁有權，買賣土地要經過部落會議討論。邵族長老則表示：「我們邵族人要的不多，希望能擁有一塊土地，讓邵族試辦共管，我們七大姓氏的長老們有高度共識，要守住土地才能守住語言與文化。」'
