  stem: '資料一：一位隨荷蘭東印度公司到達臺灣的傳教士回憶：「南部各村被視為非常危險的地方，不只我們，即便是土著，離開此地到南部去住一小段時間，不死也病。所以宗教議會認為不宜派牧師到南部使其面臨死亡的威脅。……牧師們較喜歡住在北部，到南部去傳教只有靠勇氣和決心才能做到，真希望我們趕緊離開這座島嶼。」

    資料二：一位傳教士在新式醫院建成開業紀念典禮時興奮的說道，跟兩百多年前的傳教士相比，他們這次所推行的醫療，是秉著更單純的目的，除了宣達天父的愛，更抱著改善臺灣人民醫療條件的決心，他們想把現代的醫療體制帶進臺灣，讓人們生病受傷時能夠有更科學的治療方法。

    請問根據上述兩則資料，下列選項何者正確？'
  options:
  - label: A
    content: 從資料一可以推測當時的傳教士多抱持冒死行醫的決心
  - label: B
    content: 資料一中，願意前往南部的傳教士其中一員可能是馬雅各
  - label: C
    content: 資料二的背景可能是在 1860 年清廷戰敗臺灣開港通商之後
  - label: D
    content: 從資料二的描述之後，西方醫療即取代臺灣本地的民俗療法
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)資料一中的荷蘭傳教士為東印度公司派遣至臺灣，但其非抱持冒死「行醫」的決心，反而希望趕快離開臺灣。(B)馬雅各為 19 世紀清末來到臺灣，非資料一的 17 世紀。(D)清末西方醫療傳入臺灣，但並未取代臺灣本地的傳統中醫與民俗療法。
