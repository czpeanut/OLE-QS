  answer_status: verified
  answer_source: answer_key
  explanation: 前者說明排灣族的治療方式多為超自然方式，包括以刀切豬骨祭祀等；後者提到傳統中國醫學採用植物、動物、礦物等為藥物，兩則資料的共同特徵為以自然為本，答案為(B)。(A)(D)為排灣族的特徵。(C)兩者皆未看出。
