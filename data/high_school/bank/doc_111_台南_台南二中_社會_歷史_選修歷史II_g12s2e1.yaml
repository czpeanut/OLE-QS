    夏季的首都怎麼會變成悶熱的糞坑及致命細菌的溫床呢？答案是因為個人衛生的改進，這一點和我們的直覺完全相反。當時有太多中產階級家庭在家裡安裝沖水式馬桶，發臭的汙水被輸送到首都的供水系統。史諾醫師早就提出警告，但政府置若罔聞，表示全面檢修衛生系統所耗費的成本是天價。可是當首都出現所謂的「大惡臭」，政治人物被迫用手帕摀著鼻子喘氣時，就不知道哪裡奇蹟似地冒出一筆資金。有趣吧？他們急忙把這筆錢交給著名的工程師巴澤爾傑特興建他著名的交錯式汙水系統，至今仍是首都地下衛生基礎建設的關鍵。'
