  stem: 歷史學者皮國立指出，東漢醫生張機在《傷寒雜病論》中最重要的兩個方子就是藥性辛溫的桂枝湯和麻黃湯，但是溫病學家則認為，溫病本身就是人體內「火」壓過「水」的自我感知，會導致人身體內的津液流失，因此必須絕對禁止用辛溫之藥劑，而應該遵照葉桂（清代名醫）「用藥皆是辛涼輕劑」來思考用藥。請問張機與葉桂對於疾病治療方式的歧異，主要源自於下列何者？
  options:
  - label: A
    content: 醫術高低不同
  - label: B
    content: 輕症重症之別
  - label: C
    content: 致病原因解釋
  - label: D
    content: 醫術巫術之別
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 以張機為代表的傷寒派主張病體過冷，故用辛溫的湯藥；以葉桂為代表的溫病派主張溫病的病體過溫，故用辛涼輕劑加以調理。兩者皆從病體的體徵來調劑藥性，可知其歧異係源自致病原因解釋，答案為(C)。
