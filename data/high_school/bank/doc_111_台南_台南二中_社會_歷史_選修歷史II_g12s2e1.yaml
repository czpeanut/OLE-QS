  stem: 在德國，興建公路之議最早起於 1909 年。當時有一群富有的工業資本家倡議興建讓汽車可以擺脫泥濘、馬車與行人的專用道路。然而，直至 1930 年代中期，這樣的提議在德國並不受歡迎，就連國家社會主義德意志勞工黨（即納粹黨）與德國共產黨都曾聯手反對興建公路。請問當時德國的主流民意為何曾一度反對興建公路？
  options:
