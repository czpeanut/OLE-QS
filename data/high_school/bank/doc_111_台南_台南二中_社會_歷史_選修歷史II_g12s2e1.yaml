- id: doc_111_台南_台南二中_社會_歷史_選修歷史II_g12s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 有關傳統中國疫病觀念的改變，下列何者正確？
  options:
  - label: A
    content: 受到韓國「東醫」的影響
  - label: B
    content: 因為對疫病的知識不夠完整，每當疫病流行時，宗教勢力得以藉此發展傳布
  - label: C
    content: 對抗疾病的方式主要是藉由改善環境衛生避免病灶
  - label: D
    content: 晚明吳有性強調疫病是由於「異氣」進入口鼻引起，使當時的衛生觀念大大改善
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)韓國「東醫」係受到中國醫學影響。(C)此為近代西方醫療的觀念，非傳統中國的疫病觀念。(D)吳有性的主張並未使中國的衛生觀念獲得改善。

    15.19 世紀中葉出現的新傳播媒體為電報，在克里米亞戰爭中首次使用，使軍事情報得以即時傳播，故答案為(D)。(A)亦能即時傳播訊息，但直至 1870 年代後才被發明。

    16.兩則資料皆顯示自 16 世紀至 20 世紀，不同時期的各類疾病皆被歸咎於特定族群或種族，因此可推知其報告的主題應為「疾病與對特定族群之汙名」，答案為(C)。(A)(B)(D)從兩則資料中皆無法看出。

    17.建造公路的目的在方便汽車通行，但 1930 年代正值經濟大恐慌時期，一戰戰敗的德國經濟更是雪上加霜，朝野皆反對興建公路即表示當時有便利汽車需求的人不多，因此答案最可能為(B)。

    18.題文所述為 1910 ～ 1911 年的中國東北鼠疫大流行，後因伍連德採用西式衛生觀念中的消毒、隔離、火化染疫患者屍體等方式，成功圍堵疫情的擴大與蔓延，(D)為正解。(A)此為土撥鼠所帶來的鼠疫，非瘧疾。(B)從題文中無法判斷。(C)疾疫的擴散應與鐵路運輸有關，非航運。

    19.(A)《黃帝內經》認為各個器官功能雖不同，但彼此有相生相剋的影響關聯。(C)《傷寒雜病論》所提出的中醫辨證論治法則，直至今日仍為中醫所依循的醫療流程。(D)《本草經集注》為陶弘景以《神農本草經》為基礎擴大書寫而成。

    20.(A)(B)(C)皆為舊大陸已有的疾疫，因此題文中由新大陸傳入的新疾病應為梅毒，答案為(D)。

    21.(C)明治維新後，日本全盤西化，大力發展西醫，對傳統的漢醫則採取「廢醫存藥」的措施，不少漢醫的文明成果則轉以「漢方」的形式留存。在日本治臺以後，將此醫療政策在臺灣推行，沒有立即廢除漢醫，但由於只開辦西醫的醫學校，並不再核發漢醫許可證，因此西醫的人數逐漸增加，漢醫逐漸減少。

    22.從漢醫要「接受西醫的監督」、「不再核發新的執照」可以推知，總督府雖然沒有直接廢除漢醫，但採取任其自然凋零的消極措施，答案為(D)。

    23.從郵票上面的文字，顯示此應為清帝國辦理新式郵政的產物，答案為(B)。(A)時間應為 19 世紀末。(C)(D)應是仿自西方的新式郵政制度，用以取代傳統的驛傳制度。

    24.中國古代的驛傳制度主要依賴人力與獸力，不重科技發展，因此(甲)(乙)(丙)正確，答案為(A)。

    25.在 19、20 世紀之際，甲媒體掌握在上層階級手中，乙媒體使不識字的底層人民也能夠掌握消息，兩相對照之下，甲媒體應該是報章雜誌之類的傳播媒體，乙媒體則可能為廣播之類的影音媒體，聽眾無需識字，因此(D)為正解。

    26.通訊媒體 A 在 1920 年代前已開始使用，並一直盛行到 20 世紀後期，應為電話；通訊媒體 B 於 1920 年代才開始使用並迅速普及，應為收音機；通訊媒體 C 於 1940 年代後才開始發展並迅速普及，應為電視，(B)為正解。(A)電話早期雖作為軍事用途，但後來普及的是 1970 年代出現的行動電話。(C)通訊媒體 C 為電視。(D)通訊媒體 B、C 的普及，與通訊衛星的出現有關聯性。

    27.(A)此為元朝驛傳制度的特徵。(B)明太祖已有此規定。(D)由於驛傳制度出現許多弊端，如效率不彰、驛夫待遇不佳等，因此漸為西方新式郵政所取代。

    28.學者所述為鐵路建設，自 19 世紀中葉起，鐵路成為陸上客貨運最重要的交通運輸工具，有助於促進一國或一地之經濟發展與社會之進步，因此新帝國主義國家多在殖民地興建鐵路，以便於對該地進行資源掠奪，如印度鐵路密度與總長度為亞洲第一，即為一例，因此答案為(D)。

    29.從「生、老、病、死和不快樂，都可以拿來販賣疾病」與柏林藥廠的行銷宣傳，可知醫藥行為與商業貿易關係之密切，因此(C)為正解。

    30.(B)為吳有性對疫病的見解，與現代的病菌學、病毒學說相近，形成溫病學派。

    31.上古時代的人視人體為小宇宙，認為其與萬物的大宇宙相互呼應，由此可知中國傳統醫學理論係奠基於自然界經驗的觀察與累積，答案為(B)。

    32.(B)多為十幾歲的孩童。(C)法國大革命後，各國政府對言論思想的管控日漸放鬆。(D)《申報》為英國商人創辦的商業報紙，非官方報紙。

    33.(A)題文只提到大運河的功用，未提到各地開發情形。(B)從題文來看，開鑿運河的經濟功能高於軍事。(D)明代開國定都於南京，靖難之變後才遷都北京。

    34.(A)應是 B 型肝炎。(B)日治時期已有疫苗接種。(C)重金屬中毒無法藉由疫苗加以預防。

    35.(A)《意志的勝利》是德國希特勒的宣傳電影。(B)喬治六世應是以廣播宣傳，鼓舞英國的民心。(D)日本總督府在臺製播許多廣播節目宣傳皇民精神。

    36.19 世紀與工業革命相關的交通變革為鐵路與輪船的發明，而輪船發明前使用的為依賴風力的帆船，與「畜力」無關，因此可推知這位史家所說的運輸設施應為鐵路的興起，答案為(C)。

    37.從伊能嘉矩的記載來看，泰雅族人認為疫病為惡魔作祟，處理的方式也以祈求祖靈驅除惡魔為手段，可知其方法並非西方醫學或漢醫陰陽學說，而是源自傳統的自然經驗法則，故答案為(D)。(B)由於泰雅族人會將染疫病患留在家中，其餘舉家遷離，此即隔離的作法，並非無助防疫的迷信手段，因此不選。'
