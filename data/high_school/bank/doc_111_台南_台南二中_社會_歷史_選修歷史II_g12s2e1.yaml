  group_stem: '資料一：在排灣族的醫療觀念中，疾病發生的原因可以分為生理因素、超自然因素與人為因素，如飲食錯誤、觸犯禁忌或受人詛咒等，治療的方式大多以進行治病儀式或以祭祀小刀切豬骨直接向鬼神祭祀等，以去除病痛。

    資料二：中國傳統醫學的藥材包含植物、動物、礦物等，經過長時間的煎煮後所得的湯藥，透過口服湯藥與飲食、運動等作息的搭配，以達到治療疾病的功效。'
