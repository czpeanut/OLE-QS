  stem: 1979 年 12 月 10 日，親身經歷高雄美麗島事件的張美貞打了電話給「臺灣之音」，即時更新事件經過，這讓身在美國的聽眾馬上就收到來自臺灣的消息，也讓美麗島事件獲得美國國務院以及美國名人的關注。「臺灣之音」是由紐約臺灣同鄉會成立的廣播頻道，立意旨在聯絡情感、獲知臺灣消息，以及溝通國內外的功能。然而由於太受歡迎，使政府逐漸害怕統治權受影響，經常派出特務阻撓。請根據題幹，判斷下列關於「廣播」與臺灣政治運動的敘述，何者正確？
  options:
  - label: A
    content: 當時臺灣媒體不受政治干涉，擁有自由
  - label: B
    content: 傳播通訊科技讓社會運動更能獲得關注
  - label: C
    content: 廣播是人民的宣傳工具，政府不會使用
  - label: D
    content: 廣播不能作為探討近代歷史事件的材料
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文顯示美麗島事件發生時，相關人士利用電話與廣播，快速將國內訊息傳遞給美國，迅速引起美國朝野的關注，但同時也受到政府相當的阻力關切，因此(B)為正解。(D)「臺灣之音」當時的相關廣播內容，經過今人重新整理，已成為探討美麗島事件的相關文獻資料。
