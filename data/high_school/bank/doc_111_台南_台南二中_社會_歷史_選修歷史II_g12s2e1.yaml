  stem: '資料一：重要的鐵路由外人管理，重要的航業由外人經營，即全國的郵電亦由外人監督，凡中國經濟與交通上重要的事業，無不掌握於外人之手。其結果不單是中國民生凋敝，而是整個國民經濟都受帝國主義者的操縱。

    資料二：鐵路創於泰西，各國傲行，其精日進，中國取他人功利大著之事而傲之，是為最便。

    請問下列關於這兩則資料的詮釋，何者正確？'
  options:
  - label: A
    content: 這兩則資料可論證技術轉移與帝國主義之間高度結合的複雜特性
  - label: B
    content: 這兩則資料可論證帝國主義國家只帶來經濟上的破壞，毫無建設
  - label: C
    content: 資料一與資料二的觀點相仿，均肯定西方對中國建設的正面影響
  - label: D
    content: 資料一與資料二的觀點不同，但因均屬片面之詞，毫無參考價值
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一說明中國的鐵路、航業、郵電等與經濟、交通相關事業，皆受帝國主義的操控；資料二說明鐵路雖為西方所創，但中國若能擷取西方長處而將之發揮，應是最為便捷之事。綜合兩則資料，(A)的詮釋最佳。(B)資料二說明鐵路建設有其長處。(C)資料一的觀點為負面的，強調西方對中國的侵略。(D)兩則資料觀點不同，與作者立場有關，但並非毫無參考價值。
