  stem: 18 世紀某地常見一種名為「煙囟清掃工人癌」的疾病，1775 年該地醫師對此疾病發表的報告，是目前最早的職業致癌的報告。當時家家戶戶因為燃煤取暖，都有定期清掃煙囟的需求，而這些清潔煙囟的工人光著身子接觸煤煙，除灼傷外也特別容易罹患一種名為「煤煙疣」的皮膚癌，請問上述職業病最早出現於何處？
