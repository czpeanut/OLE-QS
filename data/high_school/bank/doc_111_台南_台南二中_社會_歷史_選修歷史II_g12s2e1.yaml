  - label: C
    content: 投藥重於食療，食療僅是輔助
  - label: D
    content: 食療重於藥療，吃藥能治百病
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「須先洞曉症源，知其所犯，以食治之。食療不癒，然後命藥」一段，可知孫思邈主張先從食療部分下手，病不癒才投藥，(A)為正解。
