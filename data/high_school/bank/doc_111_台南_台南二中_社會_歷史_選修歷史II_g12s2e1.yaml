  stem: 中國古代醫書《黃帝內經》裡面有一段話：「聖人不治已病，治未病；不治已亂，治未亂，此之謂也。夫病已成而後藥之，亂已成而後治之，譬猶渴而穿井，鬭（戰爭）而鑄錐（製造兵器），不亦晚乎！」請問這段話的精神，最接近今日西醫的哪一個概念？
  options:
  - label: A
    content: 預防醫學
  - label: B
    content: 實證醫學
  - label: C
    content: 流行病學
  - label: D
    content: 家庭醫學
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「治未病」、「治未亂」的說法，可知其主張在未生病前先預防染病，此即預防醫學的概念，答案為(A)。
