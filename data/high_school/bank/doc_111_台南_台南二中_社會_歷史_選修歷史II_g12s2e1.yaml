- id: doc_111_台南_台南二中_社會_歷史_選修歷史II_g12s2e1_s3_45
  section: 3
  number: 45
  type: single
  page: 8
  stem: 對於上述資料的推論，下列選項何者正確？
  options:
  - label: A
    content: 馬偕以細菌論來解釋臺灣瘧疾流行病的成因
  - label: B
    content: 坪井反對瘴氣論，以細菌論解釋鼠疫的成因
  - label: C
    content: 科霍證實細菌的存在，並完全取代了瘴氣論
  - label: D
    content: 日治政府兼採瘴氣、細菌各家學說進行防疫
  group_stem: '夏目貴志為了蒐集小論文研究主題相關資料，在圖書館找到下列三則資料：

    a. 清治後期傳教士馬偕指出：「淡水居民因為瘧疾的關係，而大量死亡，有許多個案不過苟延殘喘數個小時而已……關於這個疾病的成因，無疑是來自有機物質混合後所產生的瘴毒，其好發性受到體質、氣候和生活環境的影響。」

    b. 1896 年，鼠疫在臺灣爆發大流行後不久，細菌學者緒方正規隨即來臺進行鼠疫菌的鑑別工作。1898 年 5 月，日本防疫官員志賀潔抵臺，以菌株培養和染色鑑別的方式，希望能分離出鼠疫菌，同時也試行鼠疫患者的血清疫苗療法。同年 6 月，軍醫岡田國泰郎則建議殖民政府以衛生的家屋形式、嚴格執行清潔法為首要預防手段。

    c. 1898 年，日本醫學者坪井次郎考察完臺灣的衛生狀況後，指出：「瘴氣是造成瘧疾的主要病因，只要有適當的家屋居住、適當的穿衣、土地之乾燥法與清潔法，即可全面清除該病的威脅。最近，我聽說德國有名的細菌學者科霍在從非洲歸來的演說中提到，黑死病是一種被開明諸國驅逐至未開化地區的僻隅疾病。我想如果臺灣的衛生改善，則可期待黑死病也會自然消滅。」'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)馬偕認為瘧疾是因「來自有機物質混合後所產生的瘴毒」，此為瘴癘（氣）論。(B)坪井主張瘴氣論。(C)從資料 c 可以得知，科霍證實細菌的存在後，瘴氣論依然存在。
