  section: 2
  number: 39
  type: multiple
  page: 7
  stem: '請閱讀兩段資料，並回答問題。

    資料一：北魏寇謙之因以符章救治百病而有「神驗」。所謂「符章」一是指符水、符籙、符咒，另一說指的是章奏、章醮。寇謙之在進行醫療儀式時，除了傳統天師道的章醮程序外，還會加上燒香與廚會（也就是備宴請客）和眾人祝禱的儀式，讓治療疾病的責任由道團群體共同承擔，進一步強化組織內休戚與共、禍福同享的情愫。

    資料二：「……他們在全臺各地巡迴的方式，首先是在廟宇前的廣場或其他社區中心詠唱聖歌，接著讓傳教士與助手們開始協助排隊的民眾拔牙。接著在一切結束以後，再繼續向聚集的求醫者進行傳教。……起初當地人非常抗拒，後來他們逐漸接受這種新興的醫療方式及宗教。」

    請問有關上述資料，下列何者解讀正確？'
  options:
  - label: A
    content: 資料一以醫療名義包裝宗教儀式，藉此拉攏窮困民眾信教
  - label: B
    content: 資料一展現醫療與宗教方術密不可分的關聯
  - label: C
    content: 資料二提到的傳教士可能來自於長老教會
  - label: D
    content: 資料二的醫療推廣行為最終使全臺接受西方醫學，取代傳統中醫
  - label: E
    content: 資料一與資料二皆展現醫療行為僅是作為傳播宗教的手段
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由於進行醫療儀式時還會加上燒香與廚會，因此主要對象應為上層階級，非窮困民眾。(D)雖然民眾逐漸接受傳教士的西方醫學，但傳統中醫依然是當時臺灣社會的主流醫療。(E)資料二的傳教士明顯將醫療行為作為傳播宗教的手段，資料一提及將治病責任由道團群體共同承擔，成為強化組織的手段，因此非僅單純為傳播宗教。
