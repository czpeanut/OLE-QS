  stem: 唐代醫學家孫思邈曾指出：「安身之本，必資於食。救疾之速，必憑於藥。不知食宜者，不足以存生也。不明藥忌者，不能以除病也。……夫為醫者，當須先洞曉病源，知其所犯，以食治之。食療不癒，然後命藥。藥性剛烈，猶若御兵。兵之猛暴，豈容妄發，發用乖宜，損傷處眾。」上述這段話反映了中國傳統醫療的何種特色？
  options:
  - label: A
