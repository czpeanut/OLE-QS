  stem: 已知0°＜α＜90°，0°＜β＜90°，且sinα＝$\frac{4}{5}$＝cosβ，則sin ( 2α＋β) 之值為
  options:
  - label: A
    content: $\frac{3}{5}$
  - label: B
    content: $\frac{4}{5}$
  - label: C
    content: $\frac{-3}{5}$
  - label: D
    content: $\frac{-4}{5}$
  - label: E
    content: －$\frac{24}{25}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: sin 2α＝2 cosαsinα＝2×$\frac{3}{5}$×$\frac{4}{5}$＝$\frac{24}{25}$，cos 2α＝1－2 $sin^{2}$α＝1－2×($\frac{4}{5}$)$^{2}$＝－$\frac{7}{25}$， ⇒ sin ( 2α＋β)＝sin 2α．cosβ＋cos 2α．sinβ＝$\frac{24}{25}$×$\frac{4}{5}$＋(－$\frac{7}{25}$)×$\frac{3}{5}$＝$\frac{75}{125}$＝$\frac{3}{5}$， 故選(A)。
- id: doc_109_台北_北一女中_數學_數A_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知$\frac{3}{2}$π＜θ＜2π，且cosθ＝$\frac{4}{5}$，則sin$\frac{\theta}{2}$＋cos$\frac{\theta}{2}$之值為
  options:
  - label: A
    content: $\frac{\sqrt{10}}{5}$
  - label: B
    content: $\frac{-\sqrt{10}}{5}$
  - label: C
    content: $\frac{\sqrt{10}}{10}$
  - label: D
    content: $\frac{-\sqrt{10}}{10}$
  - label: E
    content: $\frac{-3\sqrt{10}}{10}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $\frac{3\pi}{2}$＜θ＜2π ⇒ $\frac{3\pi}{4}$＜$\frac{\theta}{2}$＜π ⇒ $\begin{cases}\sin \frac{\theta}{2}=\sqrt{\frac{1-\cos \theta}{2}}=\sqrt{\frac{1-\frac{4}{5}}{2}}=\frac{\sqrt{10}}{10} \\ \cos \frac{\theta}{2}=-\sqrt{\frac{1+\cos \theta}{2}}=-\sqrt{\frac{1+\frac{4}{5}}{2}}=-\frac{3\sqrt{10}}{10}\end{cases}$ ⇒ sin$\frac{\theta}{2}$＋cos$\frac{\theta}{2}$＝$\frac{\sqrt{10}}{10}$＋(－$\frac{3\sqrt{10}}{10}$)＝－$\frac{\sqrt{10}}{5}$， 故選(B)。
