questions:
- id: doc_112_台中_台中二中_社會_歷史_選修歷史I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 傳統中國婦德教育中，要求媳婦要妥善奉養公婆，如儒家經典《禮記》便要求媳婦要和柔溫順，以討得公婆歡心。唐代宋若華姐妹更撰寫《女論語》，指出媳婦應該「阿翁阿姑，夫家之主，供承看養，如同父母」。唐代侯莫陳邈的妻子鄭氏也撰寫《女孝經》說：「女子侍奉公婆，要如母親一般的敬愛」。請問《女論語》、《女孝經》的出現，可以做怎樣的解讀？
  options:
  - label: A
    content: 由於是女性提出的建議，因此不算是父系社會對女性的規範
  - label: B
    content: 早期儒家經典對女性的規範不足，才有更多相關的著作出現
  - label: C
    content: 由女性提出相關規範，是為了避免男性有更多不合理的要求
  - label: D
    content: 社會對女性的性別期待，有時會透過女性所設計的規範展現
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)在父權社會下，女性從小被教導要求要順從的觀念，長大後自然也會以相同的價值觀念教導與規範其他女性。(B)題文中提到「儒家經典《禮記》便要求媳婦要和柔溫順，以討得公婆歡心」，而之後的著作則是以此規範為標準，再透過著作加以宣揚。(C)父權社會下對女性的規範，本身便包含男性對女性的諸多要求。
- id: doc_112_台中_台中二中_社會_歷史_選修歷史I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 阿哲在參觀臺北三級古蹟黃氏節孝坊後覺得十分疑惑，為何節孝坊和貞節牌坊都是褒揚女性，卻沒有守貞夫和孝子牌坊呢？請問阿哲注意到了「守貞」的哪種現象？
  options:
  - label: A
    content: 守貞的丈夫太少無從表揚
  - label: B
    content: 女性天生比男性更加孝順
  - label: C
    content: 守貞的規範只為女性設計
  - label: D
    content: 顯示社會重女輕男的一面
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 守貞主要是針對女性的規範，傳統婦女需要對丈夫忠心、守節，不可改嫁，並且經過時間的考驗下都維持對丈夫貞節者，便會受到政府表揚，而男性可三妻四妾，並未被要求要對妻子守貞，此乃父權體制下，重男輕女的表現，故選(C)。
- id: doc_112_台中_台中二中_社會_歷史_選修歷史I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '資料一：送水者莫利的故事出自美國獨立戰爭時，學者指出，雖然這個故事是由不同參戰女性的形象所構成的，並非單指某一個特定對象，但仍然鼓舞了當時的軍隊士氣。

    資料二：1907 年的《時報》刊登了一篇文章：「秋瑾之死，為社會之影響者，由非淺鮮。……繼秋瑾之後者將聞風接踵而起，女界革命之傳播，必速於置郵而傳命。……殺一秋瑾，而適以生千百秋瑾，一秋瑾易殺，而千百秋瑾難除也。」

    這兩則資料可以做怎樣的解讀？'
  options:
  - label: A
    content: 很多戰爭故事的真實性並不高
  - label: B
    content: 兩者都著重描寫女性形象宣傳的影響
  - label: C
    content: 犧牲的故事較易引人注目
  - label: D
    content: 兩者都指出女性是革命成功的關鍵
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文的兩則資料，都是描寫女性形象的宣傳，對戰爭或社會帶來的影響。資料一提到的送水者莫利的故事，雖非單指某一個特定對象，但「仍鼓勵軍隊士氣」；資料二中秋瑾的烈士形象則帶動革命風潮。因此，可看出在戰爭期間或革命期間，關於女性故事的塑造與宣傳下，會達到一定撼動人心的效果，故選(B)。
- id: doc_112_台中_台中二中_社會_歷史_選修歷史I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '資料一：婆羅洲的人認為，女人天生與種子非常契合，就如同種子的懷孕狀態，女人有時候會在稻穀生長的季節到田裡過夜。

    資料二：盎格魯薩克遜人有個古老的祈禱詞：「大地，人類之母，祈願你在上帝的懷抱中富饒豐足，祈願你果實滿盈，為人之用」。

    上述資料探討的內容可能為下列何者？'
  options:
  - label: A
    content: 宗教如何塑造女性形象
  - label: B
    content: 男尊女卑的思想如何形成
  - label: C
    content: 男主外、女主內的性別分工
  - label: D
    content: 早期社會崇拜女性生殖力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一中可看出婆羅洲的人認為女人「與種子非常契合」、「會在稻穀生長的季節」到田裡過夜；資料二則提到的祈禱詞內容與大地、「富饒豐足」、「果實滿盈」相關。以上的描述應該是過往社會將女性與生殖、生產連結，並予以崇拜，故選(D)。
- id: doc_112_台中_台中二中_社會_歷史_選修歷史I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '以下是有關 1950、1960 年代歐美女性的兩則資料：

    資料甲：1967 年披頭四的搖滾歌曲〈她正離家〉：「星期三早晨五點……∕她輕輕帶上臥室的門……∕走出門外，她自由了。她（我們把大半輩子交給她）∕正在離開（犧牲了自己大半輩子）∕家……，在孤單地生活這許多年之後……。她……∕內在的某些東西這麼多年來都被否定／她正離家。」

    資料乙：學者觀察說：戰後隨著人口成長，女性的傳統角色不斷受到鼓吹。在電視節目、雜誌和廣告中，女性總是待在家內，操作不斷增多的家用機器，好像這些機器可以減輕她們的家務負擔，找回作為母親的愉悅。

    根據上述這兩則資料，資料甲中的「她」追求的是'
  options:
  - label: A
    content: 追求男女平權、同工同酬待遇
  - label: B
    content: 運用家用機器，重拾母性愉悅
  - label: C
    content: 擺脫家庭束縛，迎向自主生活
  - label: D
    content: 倡議管理夫妻共同財產之權利
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一提到「她正離家」；資料二則提到「女性總是待在家內，操作不斷增多的家用機器」，代表女性與家庭的連結緊密，因家庭束縛而被否定「內在」，因此要離家，擺脫束縛，故選(C)。
- id: doc_112_台中_台中二中_社會_歷史_選修歷史I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '資料一：中國古代有「男耕女織」的分工模式，漢代人有「一夫不耕，或受之飢；一女不織，或受之寒」的說法。

    資料二：史料記載，東漢時官員王良的妻子「布裙曳柴，從田中歸」。

    資料三：考古出土的甘肅嘉峪關畫像磚中，出現女子耕作播種的圖樣。

    從以上的資料推論，可以如何解讀男耕女織的現象？'
  options:
  - label: A
    content: 男主外、女主內的性別分工並未真正落實
  - label: B
    content: 男耕女織的分工是絕對而不可違背的
  - label: C
    content: 可推論女性的地位遠大於原本的認知
  - label: D
    content: 在漢代，男耕女織的說法並不完全正確
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '從文字史料和墓葬考古的結果來看，男耕女織的情況並不完全正確，農家男女的勞動形式多樣，有的夫婦一起分擔或是互換工作，而非固定且絕對的性別分工，有的女性也參與了農業耕作。有時候，男耕女織只是作為理想的性別分工想像，或是政府在宣導時所提倡的理想。

    7.1920 年代臺灣新知識分子建立臺灣文化協會，也引進許多新思潮，其中包括西方與中國新文化運動時相當盛行的女權思潮，因此會有題幹所述的「不用聘金、不用賀禮、不注重一切形式」的結婚模式。(A)題幹所述的內容乃是受到西方影響的結婚模式，而非日本習俗。(B)(D)日本雖有參加第一次世界大戰，但其實主要戰場在歐洲，日本及其殖民地未有損耗，故不太會有此種現象。

    8.從題幹可看出，穆斯林的女性要穿戴頭巾的原因包含「適應沙漠氣候」、「避免受到侵犯」，且遮蓋羞體的範圍會因「身分不同有所調整」，代表頭巾的穿戴與生活的環境與社會身分、處境相關，故選(A)。

    9.(A)應該是需要為奇怪疾病的發生找到理由，因而開始獵巫。(B)並非女巫眾多，而是因為爆發奇怪疾病，因此有許多女性被汙衊為女巫，成為替罪羔羊。(D)並未有確切證據，但以往社會在發生奇怪疾病或災禍時，往往會透過獵巫行動來消弭人民的恐懼。

    10.題文解釋家中的天使和家庭的將軍，是「妻子要負責照顧全家，負責養兒育女，並且好好的服從丈夫」，可看出被要求為家庭付出，一切以家庭為重，故選(A)。(B)「家中的天使」指的應該是對待家中的丈夫與子女像天使般服從與照顧。(C)「家中的將軍」指的應該是「有統帥眾僕人的能力，必須分派僕人工作、監管僕人等等」。(D)許多中上階層的女性是有受過教育，並且從事家庭教師、護士等工作，且維多利亞時期已經工業革命，工廠也會聘用許多女工工作。

    11.根據題目提及的故事內容，可知寡婦若要將五斗米送給已經出嫁的女兒，必須經由兒子的同意，顯示傳統中國女性在財產與物品的支配權上，必須服從「夫死從子」的原則，無法自行作主，故選(D)。

    12.從題文內容可看出要求媳婦要順從公婆的意思，就算婆婆實際上不對，也不應該與公婆計較或爭辯，因為公婆的心不可失掉，而公婆是丈夫的父母，故傳統中國家庭要求女子嫁人後，便要將公婆視作自身父母般服侍、順從，以盡孝道。

    13.資料一的女性在戰爭中「傾家蕩產」給予軍隊人力與金錢的支援；資料二的女性則是「為戰士縫補衣服」，都可看出以上兩則資料描述戰爭時期女性在後方所給予的協助，故選(C)。

    14.關鍵是這三位女性都「成為日本第一批公派留學生」，在國外完成學業，而回國後也是「掀起女性教育革命」，可知題文內容是在強調女性受教育後對國家發展的影響與重要性，推論提升女性知識素養乃是協助國家強大的辦法，故選(B)。

    15.資料一的內容，可看出《漢書．外戚傳》對女性主導政治權力，抱持負面的評價；資料二也可看的出來因為安東金氏家族中有女性成為王妃，使得該家族取的統治的權勢，掌管朝政，讓君王的權力旁落。由兩則資料的內容皆可看出，傳統社會普遍認為女性參與政治後會帶來負面的影響，故選(B)。

    16.資料一可看出婦女從事的職業為「家庭幫傭」、「紡織工廠」、「苦力活」可知時間應該為 19 世紀後，通常苦力以往都是以男性勞工居多，但戰爭時期由於男性都到前線作戰，因而一切苦力活便會落到女性身上；資料二則是很明顯在戰爭時期，女性到軍火工廠工作的情形，可推知資料所述為戰爭前後女性就業的情況，故選(D)。(A)從資料中無法判斷這些婦女的種族。(B)《拿破崙法典》並未特別規定婦女的勞動問題。(C)在社會主義制度下，生產活動應由國家統籌規劃，較不可能出現薪水差距如此大的現象。

    17.(A)是為了讓女性不受侵犯。(B)有給予女性財產權，但男性也有，所以不能用「崇高」一詞表示。(C)從三則資料可看出，《古蘭經》的許多經文在保護女性，或主張女性也同男性一樣被平等創造，擁有財產權，因此給予女性一定的地位與權益保障。

    18.過往的社會以父權社會為主，男性擁有政治與經濟、教育等權利，因此在革命、獨立運動等政治活動中，男性擁有一定的主導權，故選(C)。

    19.兩則資料中都不約而同提到順從，在家中順從丈夫如同在教會順從基督一般，因此可看出基督宗教要求女性應以丈夫為尊，故選(B)。(A)題文資料為基督教相關的文字，與穆斯林無關。(C)(D)無法從兩則資料中看出。

    20.(A)林爽文相當依賴金姑的法力，代表女祭司的話語可以影響政局發展。(B)從題幹可推知金娘為西拉雅族中的祭司，所信仰的神明應該為西拉雅族的祖靈而非觀音菩薩。(C)西拉雅族的祭司以女性為主。

    21.當社會逐漸轉以畜牧、農耕為主的定居方式後，期待女性生育繁衍以增加勞動力，加上部落間的競爭激烈，都使得男性逐漸掌握經濟活動、資源與戰功，逐漸取得主導地位，進而建立父權社會，故選(B)。

    22.日本《皇室典範》規定，皇位應由屬於皇統的男系男子繼承，即只有男系男子才有權利繼承皇位。從新聞的內容看來，當愛子公主出生後，掀起皇位傳不傳女性的討論，便代表社會上有許多人是認為女性也可以繼承皇位，故(A)不可選。(B)無法從資料中看出。(D)爭議重點應該是皇位傳不傳女性的問題。

    23.從題文中可看出傳統社會認為未婚女性不得進入祖廟中祭祀，又避免她們成為孤魂野鬼會破壞社會秩序，因此以姑娘廟的方式安撫，代表姑娘廟的出現乃是避免未婚女性對社會可能造成的不安定。

    24.題文的文章反映出當時認為國力貧弱與女性有關的觀念，因此身體健康的女性才能生出優秀強壯的後代。由此可知，文章的重點是在呼籲女性需維持身體強健，以讓兒女健康成長，故選(C)。

    25.(A)雖然殉節是女兒自己提出的，但也是在傳統社會的壓迫下認為女子不可改嫁所造成的悲劇，然而資料一則是新時代的新觀念，對於僅強調女子守貞一事提出的反駁。(B)資料一認為守貞乃是男女都要遵守的待遇，而非僅針對女性，而這種觀念乃是來自於孔老夫子的主張，而並非外國的妖言。(D)乃是因為不希望造成父親的負擔。

    26.(D)題文前段描述 19 世紀女性騎腳踏車的許多限制或社會觀點，但重點是腳踏車同時也「成為女性主義的一項武器，給了女性更大的行動力，並重新定義當時對於『女性特質』的看法」，可見腳踏車也對當時的女性帶來一定程度的解放。

    27.題文的關鍵是胡安那成為修女的原因為「不想結婚，只想繼續深造」，胡安那擁有才華，而修道院是「社會上准許女性保持未婚，並且學習知識的地方」，代表修道院成為胡安那保持自我（深造讀書），躲避社會期待（結婚）的地方，故選(D)。

    28.唐群英為中國女革命家，而她打宋教仁耳光此等激烈的行為，乃是因為「主張男女平權」遭到刪除而採取的手段，雖然最終仍未通過，但可知在眾人漠視女性權益的情況下，為了表達不滿的立場，往往會引發較為激烈的抗議手段。

    29.要符合題文關鍵的三個選項中的特色，只有(C)最適合，因為基督宗教認為女性柔弱、非理性，因此修女無法主持彌撒，只能以輔助者的角色協助神父，隨著宗教傳播，女性有時則以非正式的角色提供某種教化功能。

    30.(A)明代對婦女十分嚴苛，要不是進香活動，婦女不可以隨意外出遊玩。(B)題文內容僅描述趁著進香活動外出奔走的婦女甚多，而未見崇尚奢靡風氣。(C)無法得知進香供奉的神明為何。

    31.資料一中提到婦女在廢奴運動中發現女性權利得不到尊重，才開始發展婦女投票權的爭取活動；而資料二也是同樣指出女性權利長期被男性主導的現象，皆展現出女性的權利長期被忽略漠視的情況，故選(B)。

    32.(D)題文中可看出瑪麗一世通過《女王王權法案》、《推動女王陛下至為尊貴婚姻之法令》來提升其統治權力，代表是用法律來取得統治的正當性。

    33.(B)仍會有現代化的女性選擇維多利亞式的服裝，只是香奈兒的改造帶來了新的解放，開始重視方便性與舒適度。(C)維多利亞式的服裝乃是為了符合社會上期待女性優雅端莊的形象而出現的。(D)香奈兒的才華配合時代的變遷之下，方能造就服飾與審美的革命。

    34.資料一的哈謝普蘇用改名來宣稱自己的阿蒙神的女兒，以強化其統治正當性；資料二的女蘇丹則「試圖以過世丈夫與夭折的兒子來強化自己的統治正當性」，顯示女性統治者在傳統社會往往會遭受到統治正當性的質疑，因而會採取一些手段來杜眾人之口，穩定其統治地位，故選(A)。

    35.題文的關鍵為「歐洲中產階級開始將家庭視為精神上的堡壘」、「妻子也逐漸退出經濟活動，成為消費者的角色」，這些都是工業革命後的現象，中產階級的女性被視為家中的天使，生活的重心皆以家庭為主，照顧丈夫、教養子女。'
