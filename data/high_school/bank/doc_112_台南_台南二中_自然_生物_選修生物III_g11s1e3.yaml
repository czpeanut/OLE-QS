  stem: 下列有關唐菖蒲伯克氏菌相關的內容，哪些正確？
  options:
  - label: A
    content: 此病原體細胞壁含有脂多醣
  - label: B
    content: 經正確完整的革蘭氏染色後，此病原體呈現紅色
  - label: C
    content: 可用死菌製成疫苗來進行食物中毒的預防
  - label: D
    content: 此病原體為植物性病毒，無法感染人體
  - label: E
    content: 此病原體在120℃下尚能存活
  group_stem: ■ 邦克列酸（Bongkrekic Acid , BA）是由唐菖蒲伯克氏菌（Burkholderia gladioli）所產生的一種毒素，與涉及椰子和玉米產品的食源性疾病爆發有關；此菌主要為植物病原菌，亦可與植物和真菌共生，一般易在20～30℃、pH值中性的環境中繁殖，唐菖蒲伯克氏菌為革蘭氏陰性菌，多數人中毒後很快就會有急性腸胃炎、腹瀉嘔吐、發燒等症狀，同時伴隨猛爆性多重器官衰竭、休克，病程發展快速且相當危險；接觸受邦克列酸污染的食品後，潛伏期約1～10小時，毒性極強，1毫克便有可能奪命，致死率高達40％以上，邦克列酸極耐高溫，就算用120℃加熱一小時，毒性依舊存在，現階段醫學尚未有專門治療邦克列酸中毒的特效藥，可能的治療方式為「血漿置換術」，在中毒反應後，幫助病人透過一比一的血液替換，把有害毒物洗出身體，主要則只能給予患者支持性療法。 邦克列酸致死的機轉主要透過干擾線粒體內部的ATP離開粒線體基質的過程，ATP在粒線體基質內產生，藉由ATP／ADP轉位酵素（ADP／ATP translocase , ANT）離開粒線體基質，以供給細胞能量，BA作用在抑制ANT，使ATP無法離開粒線體基質，導致能量需求高的細胞運作受到嚴重影響。上圖為示意圖，依以上資訊及所習得的知識，回答下列問題：
