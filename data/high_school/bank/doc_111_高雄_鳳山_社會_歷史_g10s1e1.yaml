  group_stem: '鄭氏王朝至清初，雖然東部的卑南覓、崇爻等社曾經附屬西部番社輸餉於當時的政權，但是沒有實際設官治理，顯現當局並無積極統治後山的規劃。康熙年間朱一貴事變之後，清廷惟恐漢番勾結危害政權，乃實施封山劃界政策，於沿山地帶劃定番界，禁止漢人私越。後山自此被封禁達百餘年，也延遲了該地的開發。

    嘉慶、道光年間，由於西部開發已達飽和，少數漢人轉移目標私自到東部開墾，卻大部分失敗，最後只能棄地而去。直到「某事件」之後，清廷為了杜絕列強對東部的覬覦，遂解除長達 150 餘年的封山禁令，並積極進行開山撫番政策。有別於西部地區移民先拓墾、官方再隨後設治的現象，東部地區在官方強力推動下，開始對其宣示統治權。'
