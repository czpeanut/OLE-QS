  type: single
  page: 2
  stem: '資料一： 蘭嶼上的「雅美族」（Yami）稱呼來自於日人鳥居龍藏的研究，事實上，蘭嶼原住民則以「Tao」（達悟）人自稱。

    資料二：由於位於南邊卑南村和初鹿村的卑南人稱呼北方為 Amis，因此便將北方的部族叫做「Amis」，後來受到學術界的採用與傳播，成為廣為人知的族群名稱「阿美族」，實際上阿美族人通常自稱為「Pangcah」（邦查），意思是「人」、「同族」。

    資料三： 日治時期伊能嘉矩將生活在臺北平原的平埔族定名為「凱達格蘭族」，不過往後的研究卻對此族群稱謂提出質疑，主張北臺灣的原住民應有巴賽（Basay）、龜崙（Kulon）、雷朗（Luilang）等族群分布其中。

    統合上面三則資料，可以得出下列何種結論？'
  options:
  - label: A
    content: 分類方式只是一種認知，無法道盡全貌
  - label: B
    content: 臺北的平埔族人以「凱達格蘭」人自稱
  - label: C
    content: 邦查（Pangcah）是日本人稱呼東部阿美族的代稱
  - label: D
    content: 不管哪一種分類都是他者對原住民的劃分，因此分類的意義不大
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由三則資料可知，不同時期的研究對原住民的分類看法不同，我族與他者的認知亦不盡相同，因此(A)為正解。(B)從資料三可知，臺北的平埔族尚有其他的族群分布其中。(C)邦查為阿美族人的自稱。(D)有些族名為原住民的自稱，非全部是他者的劃分。
