  section: 1
  number: 17
  type: single
  page: 4
  stem: 漢人移居臺灣經歷長期的調和互動後，逐漸產生了所謂「在地化社會」的情形。請問下列對「在地化社會」的敘述，何者正確？
  options:
  - label: A
    content: 在地化社會多祭祀第一代來臺開墾祖先
  - label: B
    content: 唐山祖祭祀可視為是在地化社會的表現
  - label: C
    content: 在地化社會帶來較為不穩定的社會結構
  - label: D
    content: 在地化社會仍積極保留原鄉社會的內涵
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '「在地化社會」約在 1860 年代臺灣開港後，社會、經濟與文教皆較之前穩定發展，居民也已從認同大陸原鄉轉為認同臺灣本土，宗族祭祀組織也從唐山祖崇拜轉為開臺祖崇拜，故(A)為正解。

    18.1946 年後，中國大陸開始陷入國共內戰的紛擾，不少人開始移往臺灣；1949 年後，更有大批軍民隨著國民政府撤退來臺，使得臺灣人口在短短幾年內快速暴增，答案選(C)。

    19.根據史書記載，鄭成功在臺灣僅一年的時間，且主要在南部地區。不過，即使兩則資料中的草鞋、魚精故事虛構的成分居多，也並非完全毫無價值可言，可能代表鄭成功的部下已到臺灣中、北部點狀拓墾，同時也說明當地人對鄭成功的崇拜，因此(C)的解讀較為合理。

    20.(B)未有此事。(C)葡萄牙不曾殖民臺灣。(D)西班牙殖民臺灣的時間在荷蘭之後。

    21.早期「生番、熟番」的區別是以歸順狀況來認定，後來稱為「平埔族、高砂族」，除了依其分布區域命名外，也為去除歧視而取消「番」字，同時亦尊重各部族不同的文化，(B)為正解。

    22.從「泉漳閩粵分偏合，翁婿舅甥親亦疏」可知，此種動亂乃漢人各族群之間的衝突，與統治官方無關，故屬於分類械鬥的紛爭，(A)為正解。

    23.佐久間左馬太總督的任期為 1906 ～ 1915 年，採取武力「掃蕩生蕃」的強硬手段，1914 年太魯閣之役後，國家力量已完全控制全臺各地，(C)為正解。(A)清治時期的政策。(B)霧社事件發生於 1930 年，非佐久間左馬太總督任內。(D)佐久間左馬太的理蕃政策為武力鎮壓，非溫和同化。

    24.(A)除了開臺祖外，應也有少數唐山祖的祭祀組織。(B)唐山祖成員為來自大陸原鄉的同姓之人，多無血緣關係。(C)開臺祖的祭祀多在清治後期在地化社會時出現，此時臺灣土地開墾已達飽和。

    25.澎湖自 13 世紀起已納入中國版圖，受中國軍事防護，臺灣則為無主之地，故為倭寇和海盜的盤據之地，(C)為正解。(A)未有此事。(B)荷蘭兩度占領澎湖乃為 17 世紀之事，當時臺灣早已有海盜及倭寇盤據。(D) 16 世紀末臺灣尚未開發，各方面條件皆遠遜於澎湖。

    26.(A)原住民族的傳說與歌謠多反映出該部族的起源與部族意識，頗具研究價值。(C)日本學者首先以人類學角度對臺灣原住民族進行研究，其結論與成果彌足珍貴。(D)據記載，17 世紀時中部地區的平埔族群曾建立跨族群的部落聯盟「大肚王國」。

    27.資料一主張「蕃人嗜血的本性」、「馬赫坡社頭目莫那．魯道的反抗心」等，足見是站在官方立場指責原住民的不是，因此是日本帝國的觀點。資料二是唯一不以「蕃人」而用「原住民」來敘述事件者，因此為賽德克族人的觀點。資料三分析殖民政府的統治措施過於殘暴而導致蕃人反抗，因此為漢人的觀點。故(A)為正解。

    28.撒奇萊雅族的巴拉瑪火神祭源自 1878 年的加禮宛抗清事件，在沈葆楨的開山撫番政策下，清廷積極昭示在後山的統治主權，卻也侵犯到原住民族的生活空間，引發噶瑪蘭族與撒奇萊雅族聯合抵禦清軍，結局卻是差點種族滅絕，答案選(B)。

    29.(A)此時漢人生活條件不如原住民，多為覬覦原住民的土地而與之通婚。(B)(D)由題幹資料無法看出。

    30.選項中僅(D)紐西蘭的原住民族毛利人屬於南島語族。

    31.新店溪上游為泰雅族的活動範圍，與漢人移墾者發生多次衝突，郭錫瑠父子在開鑿水圳的過程中遇到地形、氣候與原住民侵擾等重重困難，共歷時 22 年才完工，成為灌溉臺北盆地東側的重要水源，(A)為正解。(B)臺北其他地區已有移民拓墾，可知與來臺漢人人數無關。(C)瑠公圳的開鑿與泰雅族的活動範圍重疊，可見得漢人並未嚴格遵守土牛溝的原漢界線。(D)臺灣土地的開墾方向為「先南後北，由西向東」。

    32.資料一提到統治者要求各村社派代表參加地方會議、牧師教導原住民農耕技巧與洋文小冊子，可知為荷治時期；資料二中有「讓耕讓地漢族遵」，卻又遭漢人欺凌，求助無門的情景，在清治初期已出現；資料三中的馬雅各牧師為清治後期開港後來臺的傳教士。因此三則資料的時間先後排序為(C)資料一→資料二→資料三。

    33.兩段資料描述相反，前者強調大陳島住民堅決反共而想離開大陳島，後者站在中共的立場，主張蔣介石強行「綁架」大陳島居民到臺灣，因此(D)為正解。

    34.某人口中的「我國」曾在臺灣、中國、滿洲、庫頁島及千島群島等地有所建設，卻因戰爭的結果而不得不放棄，可知「我國」應指二戰時戰敗的日本，(D)為正解。

    35.(A)國際移工自 1989 年開始引入臺灣，以彌補低技術產業勞工不足的問題。(B)首批營建移工引自泰國。(D)政府積極網羅高科技人才，開放各國專業人士來臺就業、定居等申請。

    36.題幹所述為中部地區原住民族所組成的「大肚王國」，實則為部落聯盟組織，在清初因大甲西社事件遭朝廷「以番制番」鎮壓而瓦解，其位置應為(B)乙地區。

    37.從顧君所言，此四番社為鄭氏時期的四大社，可知其位於南臺灣且已漸有教化，因此推知當地原住民為西拉雅族，故(B)選項敘述較符合其生活方式。(A)南臺灣排灣族的文化。(C) 19 世紀清廷開山撫番後的情景。(D)蘭嶼達悟族的文化。

    38.(A)士兵亦需從事農耕工作，開墾營盤田。(B)此為荷蘭傳教士的工作，漢人則將漢字傳入臺灣。(D)土牛界線為清治前期的政策，非鄭氏政權。

    39.羅妹號事件中，清廷的消極態度使列強產生「臺灣番地無主」的想法，故而李仙得亦以此經驗「指導」日軍行動，(A)為正解。

    40.題文內容主要在討論清廷對臺灣後山的看法與治理方式，從前期的封禁政策到後期的開山撫番，因此以(A)最為恰當。

    41.羅妹號事件後有「臺灣番地無主論」的說法，日軍更以此侵襲臺灣，因此清廷為宣示臺灣後山的主權，最佳辦法即是在當地設立郡縣並遣官治理，(C)為正解。

    42.從此一族群的分布地區以南臺灣為主以及祭祀方式，可推知為(C)西拉雅族。

    43.(A)西班牙人治理北臺灣，南臺灣為荷蘭人所統治。(C)西拉雅族屬於熟番，故被日本人歸類為平埔族。(D)西拉雅族迄今仍未獲得政府認定通過正名。

    44.(A)來臺的漢人多以農業拓墾為主。(B)在早期有「渡臺禁令」的限制下，多數移民選擇以偷渡方式前來臺灣。(C)清朝初期對臺灣採取消極治理態度，對來臺移民多所限制。

    45.甲仙當地漢人僅占 400 人左右，「其他」則有 1,400 人，可見得當地居民應以原住民為主，(A)為正解。(D)甲仙位於高雄山區，1926 年日人的移民村多分布在臺灣東部地區，因此甲仙不可能有如此多的日本人。

    46.由資料一的「從緬甸撤回臺灣」與資料二的「金三角」（緬甸、泰國、寮國交接處），可推知該老兵應為(A)泰緬孤軍。

    47.「金三角」指緬甸、泰國、寮國三國的邊境，其飲食文化由泰緬孤軍遷臺時所帶來；中國北方人的豆漿、燒餅、油條等美食，亦於戰後由中國各地傳入臺灣，故(D)為正解。

    48.從資料一的敘述可知(B)為正解。(A)資料一提到移民事業是由官方主導，目的以政治因素為主。(C)資料二提及移民事業的目標之一是為日本南向政策作準備。(D)資料二提及移民村以發展熱帶栽培業為主，而非稻米。

    49.「七腳川蕃」指花蓮七腳川社的原住民，故為居於花蓮的(C)阿美族。(A)(B)(D)居於臺灣西部。

    50.(B)以農業移民為主。(C) 1930 年代後在臺灣西部亦有移民村。(D)先是私營移民，失敗後才改為官營移民。'
