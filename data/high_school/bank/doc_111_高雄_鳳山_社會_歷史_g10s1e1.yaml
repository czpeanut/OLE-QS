  explanation: 雖然清治後期已在臺灣東部開山撫番並設置行政區劃，但當時移入東部的漢人並不多，直至日治時期，日本人推行原住民同化政策並實施集團移住政策，許多原住民族的文化才開始大量流失，(C)為正解。
