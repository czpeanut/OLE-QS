- id: doc_111_高雄_鳳山_社會_歷史_g10s1e1_s1_48
  section: 1
  number: 48
  type: single
  page: 9
  stem: 1909 年起，日本在臺灣展開移民事業，關於日本移民臺灣的目的，下列敘述何者正確？
  options:
  - label: A
    content: 鼓勵資本家擴大在臺灣的投資
  - label: B
    content: 同化臺灣人，鞏固日本在臺灣的統治
  - label: C
    content: 希望以臺灣作為跳板，進一步攻打中國
  - label: D
    content: 為提升稻米產量鼓勵日本移民來臺開墾
  group_stem: '資料一：日本對臺灣移民的背景，可從幾個因素觀察：一為日本國內農村問題，佃農增加，農村苦狀更甚；二為人口壓力；三是殖民地統治力的加強，提高母國人在臺灣的人口數，穩固殖民政府的統治；四是國際情勢的影響，美國、加拿大、澳洲出現排日運動，對日本移民限制甚多。移民的目的以政治因素為主，經濟因素為輔，由官方主導整個移民事業，移民的招募須經過篩選，且必須舉家前來，他們最早落腳於花蓮港廳的七腳川，而後擴展至臺東及西部地區。政府本寄望由移民達成同化臺灣人的目的，但移民卻被孤立在移民村中。

    資料二：移民事業的另一個目標，是要發展熱帶作物栽培的技術和經驗，為日本南向政策作準備。熱帶作物是指甘蔗，後期則轉為菸草，這樣的轉變歸因於種甘蔗受製糖會社牽制而利潤低下，由於之前臺灣並未栽種菸葉，在專賣局與移民簽約保證收購的推波助瀾下，燻製菸草的菸樓，成為移民村的特殊景致。熱帶作物栽培技術的培養，有一定的成效。

    資料三：花蓮港廳吉野村的日本移民感嘆：「我們住進以竹為柱，以茅草為頂的房子，睡芒草鋪成的床，九個男女擠在一起，吃的是粗劣的臺灣在來米，不習慣異鄉風土，朋友相繼染上瘧疾、恙蟲病」、「當時是殺氣騰騰強蕃出沒的時代，在花蓮港的日人僅百人，時常聽聞某派出所警員被砍頭，令人毛骨悚然」、「常有七腳川蕃來襲，人人都發給銃器擔任警衛，我是道地的農夫，拿武器戒備真是苦差事，生活上精神上都沒有安全感」。'
  answer:
  - B
