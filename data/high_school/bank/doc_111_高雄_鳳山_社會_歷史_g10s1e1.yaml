  stem: 阿美族是原住民族中人口最多的一族，在臺灣原住民族群中，很早就被納入「國家」統治體系之下，不再向頭目繳稅，空間上也有家屋隔間、公廁及公墓等，現金收入仰賴農業，後來甚至發展出水稻定耕的生活方式。請問從歷史發展來看，造成阿美族社會生活型態改變的關鍵原因在於
  options:
