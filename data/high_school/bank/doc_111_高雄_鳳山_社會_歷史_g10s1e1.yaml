  stem: 一段日記敘述如下：「海口南方一里許有龜山，一小獨立丘也。明治 7 年征臺之役，西鄉侯上陸於茲，先據此山。又東方山麓有琉球難民五十餘名之墓，是亦同役中西鄉侯之所建也。」請問文中敘述的事件有何影響？
  options:
  - label: A
    content: 出現「番地無主論」的說法
  - label: B
    content: 促使清廷「開山撫番」
  - label: C
    content: 引發「大甲西社事件」
  - label: D
    content: 使總督府重新檢討「理蕃政策」
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
