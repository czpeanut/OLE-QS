- id: doc_110_台南_台南二中_自然_化學_選修化學V_g12s2e1_s3_2
  section: 3
  number: 2
  type: single
  page: 3
  stem: '利用燃燒分析法分析某芳香烴A，取該化合物5.30克進行實驗，得到的結果為裝有氫氧化鈉的U型管增重17.60克，裝有過氯酸鎂的U型管增重4.50克，並知A不能使溴的四氯化碳溶液褪色。若已知該化合物的分子量為106，請根據以上的訊息，回答下列問題：

    (1) 芳香烴A之實驗式為何？（3分，需列出計算過程才給分）

    (2) 關於某芳香烴A的敘述，則下列敘述哪些正確？'
  options:
  - label: A
    content: 分子式為$C_{8}H_{10}$
  - label: B
    content: 只含甲基之異構物有3種
  - label: C
    content: 同時含甲基及乙基之異構物有2種
  - label: D
    content: 此芳香烴共有4種異構物
  - label: E
    content: 此芳香烴共有5種同分異構物。（2分，全對才給分）
  explanation: '(1) 此有機物中碳的含量$=17.60\times \frac{12}{44}=4.8(g)$＝17.60、氫含量$=4.50\times \frac{2}{18}=0.5g$，

    莫耳數$C:H=\frac{4.8}{12}:\frac{0.5}{1}=4:5$，故實驗式為$C_{4}H_{5}$。

    (2)(A)分子量為式量的兩倍，故分子式為$C_{8}H_{10}$；(B)為芳香烴，故包含一個苯環 + 兩個碳的取代基(可能為乙基或兩個甲基)，故此選項中包含兩個甲基的異構物共有三種：鄰二甲苯、間二甲苯、對二甲苯；(C)不存在同時含甲基與乙基的異構物；(D)(E)共有四種：鄰二甲苯、間二甲苯、對二甲苯、乙苯。'
