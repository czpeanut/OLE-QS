  answer_status: verified
  answer_source: answer_key
  explanation: 依照馬可尼可夫法則，加成時氫會加成在同一個碳上，故產物的兩個氯原子會加成在同一個碳上，為$(C)_{1}$,1-二氯乙烷。
- id: doc_110_台南_台南二中_自然_化學_選修化學V_g12s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 已知某碳氫化合物取1升燃燒後，得到6升的二氧化碳及3升的水蒸氣，並且於常溫、常壓下，此碳氫化合物為具有特殊氣味的揮發性液體，沸點為80.1℃，試問下列敘述何正確？
  options:
  - label: A
    content: 屬於脂肪烴
  - label: B
    content: 12個原子形成一立體的網狀結構
  - label: C
    content: 兩相鄰的碳與碳間鍵長均相等，視為$1\frac{1}{2}$鍵
  - label: D
    content: 俗稱安息香酸
  - label: E
    content: 不具毒性，所以很常用來作為溶劑
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)脂肪烴類為非芳香烴的烴類；(B)為平面結構；(D)為安息油，安息香酸為苯甲酸；(E)苯很毒，現在已少用。
- id: doc_110_台南_台南二中_自然_化學_選修化學V_g12s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有關苯的化學反應敘述，下列何者正確？
  options:
  - label: A
    content: 苯環有三個雙鍵與烯烴相似，易發生加成反應
  - label: B
    content: 苯與濃硫酸、濃硝酸混合加熱反應產生苯磺酸
  - label: C
    content: 苯與酸性過錳酸鉀水溶液反應產生苯甲酸
  - label: D
    content: 苯與氯氣經紫外線照射可產生六氯化苯，此反應屬於取代反應
  - label: E
    content: 苯和氯氣在鐵粉或氯化鐵的催化下生成氯苯
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)苯中有共振結構，不易加成；(B)產物為硝基苯；(C)不反應；(D)屬於加成反應。
- id: doc_110_台南_台南二中_自然_化學_選修化學V_g12s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 下列方法中，何者可分辨苯與環己烯？
  options:
  - label: A
    content: 各加入少量溴的四氯化碳溶液，環己烯可使溴褪色，而苯不會使溴褪色
  - label: B
    content: 以甲苯為溶劑，苯可溶於其中，而環己烯不可
  - label: C
    content: 以水為溶劑，環己烯可溶於其中，而苯不可
  - label: D
    content: 僅通入氣氣，環己烯可與之作用，而若不與之作用
  - label: E
    content: 以氫氧化鈉的稀水溶液為溶劑，環己烯可溶於其中，而苯不可
  answer:
  - A
