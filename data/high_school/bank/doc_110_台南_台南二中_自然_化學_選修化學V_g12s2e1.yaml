- id: doc_110_台南_台南二中_自然_化學_選修化學V_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列何組物質均為有機化合物？
  options:
  - label: A
    content: HCHO、NaCN
  - label: B
    content: KSCN、$NaHCO_{3}$
  - label: C
    content: $C_{2}H_{5}$OH、($NH_{2}$)$_{2}$CO
  - label: D
    content: $C_{6}H_{6}$、$NH_{4}$OCN
  - label: E
    content: $C_{60}$、$CaCO_{3}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)含碳物質稱為有機化合物，但不包含：(1)碳氧化物(CO、$CO_{2}$)、(2)碳酸鹽與碳酸氫鹽類、(3)氰化物、氰酸化物、硫氰化物。(A)NaCN、(B)KSCN、$NaHCO_{3}$、(D)$NH_{4}$OCN皆屬於以上的例子；(E)的$C_{60}$則為元素不為化合物。
- id: doc_110_台南_台南二中_自然_化學_選修化學V_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關烷類化學反應的敘述，何者正確？
  options:
  - label: A
    content: 烷類化性十分穩定，但在常溫下，甲烷與氯反應，最多可得四種氯化程度不同的鹵化物及放出酸性氣體
  - label: B
    content: 金屬鈉可與烷類起反應生成$H_{2}$
  - label: C
    content: 在高溫下烷類易與$H_{2}SO_{4}$進行化學反應
  - label: D
    content: 烷類進行高溫裂解後，可能產生烯類或氫氣
  - label: E
    content: 甲烷在高溫下與硝酸反應可以產生 $CH_{3}NO_{3}$ (A)當 (B) (C)當(D)色 (E)溶
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)需加熱或照光；(B)不反應；(C)不反應；(E)$CH_{3}NO_{2}$。
