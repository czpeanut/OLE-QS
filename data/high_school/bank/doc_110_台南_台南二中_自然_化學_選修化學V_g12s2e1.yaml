  section: 1
  number: 17
  type: single
  page: 2
  stem: 乙炔與過量$HC_{1}$反應，主要產物為
  options:
  - label: A
    content: 1,1-二氯乙烯
  - label: B
    content: 1,2-二氯乙烷
  - label: C
    content: 1,1-二氯乙烷
