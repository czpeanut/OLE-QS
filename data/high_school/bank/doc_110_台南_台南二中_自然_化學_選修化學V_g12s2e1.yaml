  stem: 下列有關烯類的敘述，何者正確？
  options:
  - label: A
    content: 常溫下，烯類的碳-碳雙鍵不能轉動，因此1-溴丙烯具有幾何異構物
  - label: B
    content: 烯類具有雙鍵，常發生取代反應
  - label: C
    content: 烯類可與過錳酸鉀溶液反應使紫色褪色，產物為烷類
  - label: D
    content: 烯類在金屬催化劑的存在下，經氫化而得炔類
  - label: E
