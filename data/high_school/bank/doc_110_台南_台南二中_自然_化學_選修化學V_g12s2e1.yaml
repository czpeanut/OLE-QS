- id: doc_110_台南_台南二中_自然_化學_選修化學V_g12s2e1_s2_23
  section: 2
  number: 23
  type: multiple
  page: 2
  stem: 在25°C、1 atm，取某烴 10 mL與過量的氧100 mL之混合氣體，點火使完全燃燒後，冷卻到 25°C時，混合氣體之體積在同壓下變為80 mL，再通過NaOH（吸收$CO_{2}$）後，剩下40 mL不可燃的氣體，關於該烴可能結構的敘述，哪些正確？
  options:
  - label: A
    content: 該烴之分子式為$C_{5}H_{8}$
  - label: B
    content: 該烴之分子式為$C_{4}H_{8}$
  - label: C
    content: 烯烴異構物中有一對是幾何異構物
  - label: D
    content: 屬於環烷烴的異構物共有三種
  - label: E
    content: 共有6種異構物
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '因燃燒後回到常溫，故水蒸氣幾乎都已凝結成液態水，因此80 mL的氣體為過量氧氣 + 二氧化碳，通過NaOH後剩下40 mL氣體，可得知過量氧氣、二氧化碳各為40 mL。進一步可得知消耗氧氣100 - 40 = 60 Ml 可列式：$C_{x}H_{2y}$(g) + $O_{2}$(g) → $xCO_{2}$(g) + $yH_{2}$O(l)

    10 mL 60 mL 40 mL 由亞佛加厥定律，可得知氣體體積比 = 分子數比 = 莫耳數比 = 反應方程式係數比。因此可得知x = 4，又由原子不滅可得知y = 4，故此烴類為$C_{4}H_{8}$。 (A)錯誤；(B)正確；(C)正確，為順2-丁烯、反2-丁烯；(D)錯誤，只有環丁烷、甲基環丙烷兩種；(E)正確：1-丁烯、甲基丙烯、順2-丁烯、反2-丁烯、環丁烷、甲基環丙烷，共六種。'
