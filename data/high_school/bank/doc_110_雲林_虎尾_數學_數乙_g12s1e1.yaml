- id: doc_110_雲林_虎尾_數學_數乙_g12s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列何者為收斂數列？
  options:
  - label: A
    content: $\left\langle \frac{6}{n^{2}} \right\rangle$
  - label: B
    content: $\left\langle \frac{{2^{n}}^{+1}}{3^{n}} \right\rangle$
  - label: C
    content: $\left\langle \frac{5^{n}+4^{n}}{2^{n}+3^{n}} \right\rangle$
  - label: D
    content: $\left\langle \cos \frac{n\pi}{2} \right\rangle$
  - label: E
    content: 〈sin（nπ）〉
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：收斂到 0

    (B) ○：$\left\langle \frac{{2^{n}}^{+1}}{3^{n}} \right\rangle$＝$\left\langle 2\times \left( \frac{2}{3} \right) ^{n} \right\rangle$，此等比數列的公比 r＝$\frac{2}{3}$

    ∵－1＜r＜1 ∴此數列收斂

    (C) ╳：$\left\langle \frac{5^{n}+4^{n}}{2^{n}+3^{n}} \right\rangle$＝$\left\langle \frac{1+\left( \frac{4}{5} \right) ^{n}}{\left( \frac{2}{5} \right) ^{n}+\left( \frac{3}{5} \right) ^{n}} \right\rangle$

    ∵$\lim_{n\rightarrow \infty} \left( 1+\left( \frac{4}{5} \right) ^{n} \right) =1$，但$\lim_{n\rightarrow \infty} \left( \left( \frac{2}{5} \right) ^{n}+\left( \frac{3}{5} \right) ^{n} \right) =0$

    ∴此數列發散

    (D) ╳：$\left\langle \cos \frac{n\pi}{2} \right\rangle$：0，－1，0，1，0，－1，0，1，……

    依 0，－1，0，1 四數一循環，故此數列發散

    (E) ○：〈sin（nπ）〉：0，0，0，0，……，此數列收斂到 0

    故選(A)(B)(E)'
