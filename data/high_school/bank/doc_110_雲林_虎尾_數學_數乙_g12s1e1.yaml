- id: doc_110_雲林_虎尾_數學_數乙_g12s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 右圖為函數 f（x）的圖形，選出正確的選項。
  options:
  - label: A
    content: $\lim_{x\rightarrow 2} f(x)$不存在
  - label: B
    content: $\lim_{x\rightarrow 3} f(x)$不存在
  - label: C
    content: $\lim_{x\rightarrow 3} f(x)$＝f(3)
  - label: D
    content: $\lim_{x\rightarrow 5} f(x)$＝f(5)
  - label: E
    content: $\lim_{x\rightarrow 7} f(x)$＝f(7)
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_110_雲林_虎尾_數學_數乙_g12s1e1/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 454.9
      - 708.65
      - 564.3
      - 799.6
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\lim_{x\rightarrow 2^{-}} f(x)$＝5，$\lim_{x\rightarrow 2^{+}} f(x)$＝4

    ∵左極限≠右極限 ∴$\lim_{x\rightarrow 2} f(x)$不存在

    (B) ╳：∵$\lim_{x\rightarrow 3^{-}} f(x)$＝3，$\lim_{x\rightarrow 3^{+}} f(x)$＝3

    ∴$\lim_{x\rightarrow 3} f(x)$＝3

    (C) ╳：$\lim_{x\rightarrow 3} f(x)$＝3，但 f(3)＝5 ∴$\lim_{x\rightarrow 3} f(x)$≠f(3)

    (D) ○：∵$\lim_{x\rightarrow 5^{-}} f(x)$＝1，$\lim_{x\rightarrow 5^{+}} f(x)$＝1

    ∴$\lim_{x\rightarrow 5} f(x)$＝1

    又 f(5)＝1 ∴$\lim_{x\rightarrow 5} f(x)$＝f(5)

    (E) ○：由題圖可知，$\lim_{x\rightarrow 7^{-}} f(x)$＝$\lim_{x\rightarrow 7^{+}} f(x)$＝f(7)

    故選(A)(D)(E)'
