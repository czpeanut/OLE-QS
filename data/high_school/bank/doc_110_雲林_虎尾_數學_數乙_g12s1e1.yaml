- id: doc_110_雲林_虎尾_數學_數乙_g12s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設 f（x）為一函數。若 f（－x）＝f（x），則 f（x）為偶函數； 若 f（－x）＝－f（x），則 f（x）為奇函數，選出偶函數的選項。
  options:
  - label: A
    content: f（x）＝$3x^{2}$
  - label: B
    content: f（x）＝3x＋1
  - label: C
    content: f（x）＝cosx
  - label: D
    content: f（x）＝sinx
  - label: E
    content: f（x）＝$2^{x}$
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：f（－x）＝3（－x）$^{2}$＝$3x^{2}$＝f（x）為偶函數

    (B) ╳：f（－x）＝3（－x）＋1＝－3x＋1≠f（x）

    (C) ○：f（－x）＝cos（－x）＝cosx＝f（x）為偶函數

    (D) ╳：f（－x）＝sin（－x）＝－sinx＝－f（x）為奇函數

    (E) ╳：f（－x）＝$2^{－x}$＝$\left( \frac{1}{2} \right) ^{x}$≠f（x）

    故選(A)(C)'
