  answer_source: answer_key
  explanation: '$3n^{2}$＋2n＋1＜$n^{2}a_{n}$＜$3n^{2}$＋5n＋7

    ⇒$\frac{3n^{2}+2n+1}{n^{2}}$＜$a_{n}$＜$\frac{3n^{2}+5n+7}{n^{2}}$

