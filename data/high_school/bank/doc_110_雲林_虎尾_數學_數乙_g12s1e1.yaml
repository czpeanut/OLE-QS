  stem: 一無窮等比級數之首項為$0.\overline{2}$，第二項為$0.0\overline{4}$，則此級數之和＝＿＿＿＿。（以循環小數表示，例如：$0.\overline{3}$）
  answer:
  - $0.2\overline{7}$
  answer_status: verified
  answer_source: answer_key
  explanation: '設 x＝$0.\overline{2}$ ……………①

    10x＝$2.\overline{2}$ ……………②

    ②－①得 9x＝2 ⇒ x＝$\frac{2}{9}$

    設 y＝$0.0\overline{4}$

    100y＝$4.\overline{4}$……………③

    10y＝$0.\overline{4}$ ……………④

    ③－④得 90y＝4 ⇒ y＝$\frac{2}{45}$

    ∵首項＝$\frac{2}{9}$，第 2 項＝$\frac{2}{45}$

    ∴公比 r＝$\frac{\frac{2}{45}}{\frac{2}{9}}$＝$\frac{1}{5}$

    故此級數之和為$\frac{\frac{2}{9}}{1-\frac{1}{5}}$＝$\frac{5}{18}$＝$0.2\overline{7}$'
