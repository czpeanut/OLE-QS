  options:
  - label: A
    content: $\sum_{n=1}^{\infty} (-1.01)^{n}$
  - label: B
    content: $\sum_{n=1}^{\infty} \left( \frac{\pi}{3} \right) ^{n}$
  - label: C
    content: $\sum_{n=1}^{\infty} (0.99)^{n}$
  - label: D
    content: $\sum_{n=1}^{\infty} 1$
  - label: E
    content: $\sum_{n=1}^{\infty} \left( \frac{3}{2} \right) ^{n}$
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：公比 r＝－1.01

    ∵｜r｜≥ 1 ∴此為發散級數

    (B) ○：公比 r＝$\frac{\pi}{3}$ ∵｜r｜≥ 1 ∴此為發散級數

    (C) ╳：公比 r＝0.99 ∵－1＜r＜1 ∴此級數收斂

    (D) ○：公比 r＝1 ∵｜r｜≥ 1 ∴此為發散級數

    (E) ○：公比 r＝$\frac{3}{2}$ ∵｜r｜≥ 1 ∴此為發散級數

    故選(A)(B)(D)(E)'
