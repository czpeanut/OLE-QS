  section: 1
  number: 4
  type: single
  page: 1
  stem: 「我們都是大日本帝國的臣氏，我們一心向天皇陛下盡忠盡義，我們要不斷自我鍛鍊而成為堅強的國民。」上述為某地政府發布的「皇國臣民誓詞」，要求學生與一般市民在各種場合之中記誦。請問某地是指下列何者？
  options:
  - label: A
    content: 朝鮮
  - label: B
    content: 臺灣
  - label: C
    content: 滿洲國
  - label: D
    content: 南京國民政府
