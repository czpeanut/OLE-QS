  stem: 19世紀初，阮福映與法國傳教士合作建立阮朝，自號嘉隆帝，在位期間採取宗教寬容；其子明命帝即位初期，推行多項改革，使阮朝邁向鼎盛期，但明命帝鐵腕統治的作風，也引發越南的社會矛盾。請問下列哪些事件與明命帝有關？
  options:
