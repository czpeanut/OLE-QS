questions:
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有位傳教士向羅馬教廷報告在中國的傳教情況，提到當地信徒有祭拜祖先、參加拜孔子的祭典，因此希望教廷制止這種亂象。此事件最終導致中國與教廷的決裂，皇帝諭令不尊重中國傳統文化的傳教士應立即離去。請問上述與下列何者有關？
  options:
  - label: A
    content: 明初，太祖頒布海禁
  - label: B
    content: 明末，利瑪竇以排佛趨儒手段傳教
  - label: C
    content: 清初，天主教在中國傳教
  - label: D
    content: 清末，義和團策動多起教案
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某一運動中，出現了「易卜生專號」、「馬克思專號」的文章，這些文章最有可能刊載在哪一本月刊？
  options:
  - label: A
    content: 《新青年》
  - label: B
    content: 《時務報》
  - label: C
    content: 《民報》
  - label: D
    content: 《新民叢報》
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 明治維新第一個重點工作即為「廢藩置縣」。請問明治政府此舉有何意義？
  options:
  - label: A
    content: 提倡地方政府應該因地制宜行政
  - label: B
    content: 準備推動中央集權的君主立憲政治
  - label: C
    content: 鞏固封建體制一致對外
  - label: D
    content: 為殖產興業政策鋪路
