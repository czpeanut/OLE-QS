- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 學者指出：1936年西安事變前，蔣中正聲望已高，是公認的領袖，無人能與之競爭。西安事變發生後，舉國惶惶，待脫險消息傳出，歡聲雷動，可知蔣氏受到全國擁戴。當時，他大可繼續對中共用兵，但他並未如此，最主要原因，在深知對日戰爭不能避免，必須團結內部，以獲得外援。於是他與中共和解，以聯好某國。某國是指：
  options:
  - label: A
    content: 英國
  - label: B
    content: 美國
  - label: C
    content: 蘇聯
  - label: D
    content: 德國
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 明清之際，外人在中國傳教與通商的情況，下列何者為是？
  options:
  - label: A
    content: 康熙年間，外人只能在廣州通商
  - label: B
    content: 乾隆取消一口通商的限制，使中西交流蓬勃發展
  - label: C
    content: 利瑪竇禁止中國教徒祭祖、拜孔
  - label: D
    content: 傳教士涉入政爭是雍正禁教的原因之一
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 國立首爾顯忠院是韓國國防部所屬機關，為韓國軍人的墓地。有一位加拿大人弗朗西斯．斯科菲爾德也埋葬於該地，他曾參與反對日本帝國殖民統治的獨立抗爭運動，並批判日本對獨立運動者的非人道行為，對朝鮮走向獨立自主有莫大的貢獻。請問斯科菲爾德參與的歷史事件應為？
  options:
  - label: A
    content: 東學黨之亂
  - label: B
    content: 甲午戰爭
  - label: C
    content: 日俄戰爭
  - label: D
    content: 三一運動
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 1955年，亞、非新興國家舉行了一場會議，目的在爭取民族獨立，討論區域和平、經濟發展等問題。請問這場會議對國際局勢產生什麼影響？
  options:
  - label: A
    content: 在「和平共處五原則」下，與中共建立友好關係
  - label: B
    content: 形成孤立於聯合國之外的第三世界
  - label: C
    content: 達成與美國合作，以保全自身的共識
  - label: D
    content: 譴責西方霸權的殖民主義，會議參與國投入越戰抵抗美軍
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 潘周楨是越南重要的歷史人物，越南中部有一所以醫務人員培育及醫學研究著稱的潘周楨大學，即是為了紀念他而設立。請問下列何者是潘周楨的主張？
  options:
  - label: A
    content: 爭取日本的軍事援助
  - label: B
    content: 以共和取代君主政體
  - label: C
    content: 重建儒家式行政系統
  - label: D
    content: 創立新式的書寫系統
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 1919年，這個國家的人士曾發表一段宣言：「吾等茲宣言：我□□之為獨立國，□□人之為自主民，以此告於世界萬邦，而克明人類平等之大義；以此誥於子孫萬代，而永有民族自存之政權」請問這個國家應為？
  options:
  - label: A
    content: 日本
  - label: B
    content: 越南
  - label: C
    content: 朝鮮
  - label: D
    content: 中國
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 史家認為：「國民政府建國多年，實際上號令所及不過是沿海城市及其近郊腹地，並未真正統一。直至□時有機會開發內地，民族才真正融鑄成一體。」請問文中的□是指哪一個時期？
  options:
  - label: A
    content: 北伐時期
  - label: B
    content: 中原大戰時期
  - label: C
    content: 五次剿共期間
  - label: D
    content: 對日抗戰期間
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 某一城市在1910年被日本殖民之後，其地位由中央直隸府降低到地方的二級單位，原有的歷史建築受到大規模破壞，大量富有歷史意義的古代建築遭拆除，在其原址上興建了總督府及其附屬建築群。請問文中所述的城市，是今日哪一城市？
  options:
  - label: A
    content: 臺灣的臺北
  - label: B
    content: 朝鮮的首爾
  - label: C
    content: 中國的長春
