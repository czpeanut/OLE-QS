  section: 1
  number: 6
  type: single
  page: 1
  stem: 日本本土在二戰後期，曾受到非常嚴重的打擊，造成死傷慘重。請問其原因為何？
  options:
  - label: A
    content: 空襲炸彈轟炸
  - label: B
    content: 美軍登陸作戰
  - label: C
    content: 中國登陸作戰
  - label: D
    content: 日軍撤守臺灣
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 以下是19世紀初一位中國官員的上奏：「蘇州之南潯，湖廣之漢口……近來各種貨物銷路皆疲。凡二、三十年前，某貨物越萬金交易者，而今只得半之數。問其一半售於何物，則一言以蔽之，『甲』而已。」其中的『甲』最有可能是：
  options:
  - label: A
    content: 白銀
  - label: B
    content: 絲貨
  - label: C
    content: 菸草
  - label: D
    content: 鴉片
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 蘇聯可以在二戰後，於中國取得種種特權，是因為哪一場會議中的決議？
  options:
  - label: A
    content: 雅爾達會議
  - label: B
    content: 開羅會議
  - label: C
    content: 波茨坦會議
  - label: D
    content: 巴黎和會
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「當中國終於成為一個真正獨立自主的國家，不久後美國派遣馬歇爾來華。」下列選項中何者為上文的時代背景？
  options:
  - label: A
    content: 經過辛亥革命，中國成為東亞第一個民主共和國，美國派員前來道賀
  - label: B
    content: 孫中山宣布聯俄容共，引起美國注意
  - label: C
    content: 國共第二次合作，美國派遣特使馬歇爾來華督導
  - label: D
    content: 八年抗戰結束，但中國又陷入內戰邊緣，美國派特使來華調解
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 蔣中正曾在日記中記載：「……加之戰後朝鮮獨立之聲明以後，我國次殖民地之地位與百年來所受國恥，已掃除盡淨……」請問文中所述是指下列哪一件事？
  options:
  - label: A
    content: 聯合國成立，中國為安理會之常任理事國
  - label: B
    content: 抗戰勝利，中國收回東北、臺灣、澎湖
  - label: C
    content: 中國收回香港、澳門
  - label: D
    content: 與英美訂定平等新約
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 有學者認為本次改革運動的失敗，來自於改革者急進的傾向，修改考試制度將威脅文人進身的機會，裁減組織則讓官員無進階之路，軍事改革也將削弱現有的軍事力量。這些改革都顯示了主導者試圖推翻朝中高級官員之權力地位，這促使保守派進行反撲，中斷了這次改革。請問此次改革運動應該是下列何者？
  options:
  - label: A
    content: 自強運動
  - label: B
    content: 戊戌變法
  - label: C
    content: 新政
  - label: D
    content: 立憲運動
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 某人公開宣示自己為馬克思主義的信徒，批評普選與議會都無法有效解決社會問題，只有依靠工人組織罷工行動，才能促進社會革命，成為自由民權運動轉入社會主義運動的典型人物。請問此人為下列何者？
  options:
  - label: A
    content: 幸德秋水
  - label: B
    content: 矢內原忠雄
  - label: C
    content: 福澤諭吉
  - label: D
    content: 板垣退助
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 毛澤東在1976年9月死去後，誰決定聯合元老派來對抗四人幫，得以成功地一舉「粉碎四人幫」，為文革正式畫下句點？
  options:
  - label: A
    content: 葉劍英
  - label: B
    content: 鄧小平
  - label: C
    content: 李先念
  - label: D
    content: 華國鋒
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 一群學生接到政府命令，前往草原上放牧牛羊，名為「學習」。不巧，這年冬天風大雪大，牛、羊損失甚多，有些學生受不了草原生活的艱苦，潛逃回城市，但又被遣送回草原。若干年後，政府政策改變，他們才獲准回到都市，繼續求學就業。這種情景最可能發生在何時何地？
  options:
  - label: A
    content: 1871年，法國
  - label: B
    content: 1910年，俄國
  - label: C
    content: 1941年，德國
  - label: D
    content: 1970年，中國
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 一名工人回憶道：「在礦坑採礦時，頭上礦燈的電池硫酸經常滲漏，皮膚因而多次被灼傷，日本監工每日只發兩個黑饅頭，無菜無肉，在暗無天日下被奴役兩年，最終患上夜盲症。」請問上述情形的發生與下列何事有關？
  options:
  - label: A
    content: 二戰期間，日本在朝鮮實施的戰時體制
  - label: B
    content: 高砂義勇隊在南洋服役時遭遇的困境
  - label: C
    content: 國府為了抵禦外敵，動員勞工採礦
  - label: D
    content: 日軍在華北執行「燒光、殺光、搶光」的三光政策
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 大院君的失勢與閔氏政權的腐敗，使農民生活日益困苦；宗教團體趁勢吸收不滿農民，快速累積數萬教徒，高喊「斥倭洋」口號，反對傳入朝鮮的西方文化，並提出改革弊政的方案，因不受政府重視，最終引發民亂。請問這是哪一場事件？
  options:
  - label: A
    content: 江華島事件
  - label: B
    content: 開化黨政變
  - label: C
    content: 東學黨起事
  - label: D
    content: 甲午改革
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 這場戰爭透過民族意識的凝聚，穩固了中共政權；在國際社會上對抗西方盟國，使其一舉奠定大國地位。但中國除了慘重的戰爭傷亡之外，甚至被美國當作冷戰的對象，而遭實施經濟封鎖。請問這是下列哪一場戰爭？
  options:
  - label: A
    content: 韓戰
  - label: B
    content: 越戰
  - label: C
    content: 中越戰爭
  - label: D
    content: 珍寶島事件
- id: doc_108_台南_北門_社會_歷史_g10s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 附圖是中國某一時期出現的宣傳海報，請問它可能會出現在下列何時何地？
