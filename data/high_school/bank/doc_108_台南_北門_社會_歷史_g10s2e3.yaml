  section: 1
  number: 5
  type: single
  page: 1
  stem: 哪兩場戰爭的勝利被視為是日本獨霸亞洲地區的指標？
  options:
  - label: A
    content: 第一次世界大戰、第二次世界大戰
  - label: B
    content: 甲午戰爭、八國聯軍
  - label: C
    content: 英法聯軍、鴉片戰爭
  - label: D
