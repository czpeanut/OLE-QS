  stem: '有甲、乙、丙三種合金，各自金、銀、鉛含量的百分比如下表：

    | 種類 | 金 | 銀 | 鉛 |

    | --- | --- | --- | --- |

    | 甲 | 50 ％ | 20 ％ | 10 ％ |

    | 乙 | 20 ％ | 50 ％ | 10 ％ |

    | 丙 | 30 ％ | 10 ％ | 40 ％ |

    現在要用這三種合金冶煉金、銀、鉛含量相同的新合金 216 克，則甲、乙、丙合金分別應各取＿＿＿＿克、＿＿＿＿克、＿＿＿＿克。（假設冶煉過程未發生含量增減等變化）'
  answer:
  - 8；88；120
  answer_status: verified
  answer_source: answer_key
  explanation: '設甲、乙、丙合金分別應各取 x 克、y 克、z 克，且 x＋y＋z＝216

    又$\left( \frac{50}{100} \right) x+\left( \frac{20}{100} \right) y+\left( \frac{30}{100} \right) z$＝$\left( \frac{20}{100} \right) x+\left( \frac{50}{100} \right) y+\left( \frac{10}{100} \right) z$＝$\left( \frac{10}{100} \right) x+\left( \frac{10}{100} \right) y+\left( \frac{40}{100} \right) z$

    ⇒ 5x＋2y＋3z＝2x＋5y＋z＝x＋y＋4z

    ⇒$\begin{cases}5x+2y+3z=x+y+4z \\ 2x+5y+z=x+y+4z\end{cases}$ ⇒$\begin{cases}4x+y-z=0 \\ x+4y-3z=0\end{cases}$

    解$\begin{cases}x+y+z=216 \\ 4x+y-z=0 \\ x+4y-3z=0\end{cases}$

    ∴x＝8，y＝88，z＝120

    故甲、乙、丙合金分別應各取 8 克、88 克、120 克'
