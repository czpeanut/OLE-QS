    $\left[ \begin{matrix}a_{2} \\ b_{2}\end{matrix} \right] =\left[ \begin{matrix}\frac{2}{3} & \frac{1}{3} \\ \frac{1}{3} & \frac{2}{3}\end{matrix} \right] \left[ \begin{matrix}a_{1} \\ b_{1}\end{matrix} \right] =\left[ \begin{matrix}\frac{2}{3} & \frac{1}{3} \\ \frac{1}{3} & \frac{2}{3}\end{matrix} \right] \left[ \begin{matrix}\frac{2}{3}a+\frac{1}{3}b \\ \frac{1}{3}a+\frac{2}{3}b\end{matrix} \right] =\left[ \begin{matrix}\frac{5}{9}a+\frac{4}{9}b \\ \frac{4}{9}a+\frac{5}{9}b\end{matrix} \right]$

