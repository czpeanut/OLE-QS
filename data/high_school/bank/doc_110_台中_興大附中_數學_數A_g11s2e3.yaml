  stem: '「沉默螺旋」是由德國政治學家<u>伊莉莎白．諾爾－諾伊曼</u>（Elisabeth Noelle－Neumann）於 1974 年提出的一個政治學領域的概念，內容是：「如果人們覺得自己的觀點是公眾中的少數，將不願意說出自己的看法；反之，如果覺得自己與多數人的意見一致，則更會大聲的說出來。形成少數的聲量愈來愈小，多數的聲量愈來愈大的趨勢。」

    在做民調時，往往因為個人隱私、涉及非法行為或與一般傳統觀念有所衝突，造成受訪者會拒絕回答或隱瞞事實，造成調查結果有所偏差。為了避免發生上述的問題，在做調查時可採用隨機作答（Randomized Response Technique）的方法來蒐集資料，其做法如下：

    某高中要調查所有同學對於畢業旅行遊玩路線的意願，但不想讓大家知道彼此間做的選擇，所以請同學依照下表回答 A、B 即可，最後依調查結果，利用聯立方程式可求得各路線的支持人數。

    | 路線 生日月份 | 甲 | 乙 |

    | --- | --- | --- |

    | 1～8 月 | A | B |

    | 9～12 月 | B | A |

    比如調查結果顯示回答 A 的人數共有 900 人、回答 B 的人數共有 600 人，可假設選擇甲路線共有 x 人、乙路線共有 y 人，則若按照生日月份的占比（即無論選擇甲路線或乙路線，1～8 月與 9～12 月的人數比皆視為 2：1），列出方程組後，解得 x 之值為＿＿＿＿。'
