- id: doc_110_台中_興大附中_數學_數A_g11s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設 A 為 3×3 矩陣，且對任意實數 a，b，c，$A\left[ \begin{matrix}a \\ b \\ c\end{matrix} \right] =\left[ \begin{matrix}c \\ a \\ b\end{matrix} \right]$均成立，試問$A^{2}\left[ \begin{matrix}1 \\ 0 \\ -1\end{matrix} \right]$為何？
  options:
  - label: A
    content: $\left[ \begin{matrix}0 \\ -1 \\ 1\end{matrix} \right]$
  - label: B
    content: $\left[ \begin{matrix}-1 \\ 1 \\ 0\end{matrix} \right]$
  - label: C
    content: $\left[ \begin{matrix}1 \\ 0 \\ -1\end{matrix} \right]$
  - label: D
    content: $\left[ \begin{matrix}0 \\ 1 \\ -1\end{matrix} \right]$
  - label: E
    content: $\left[ \begin{matrix}-1 \\ 0 \\ 1\end{matrix} \right]$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$A\left[ \begin{matrix}a \\ b \\ c\end{matrix} \right] =\left[ \begin{matrix}c \\ a \\ b\end{matrix} \right]$⇒$A=\left[ \begin{matrix}0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0\end{matrix} \right]$

    ∴$A^{2}\left[ \begin{matrix}1 \\ 0 \\ -1\end{matrix} \right] =\left[ \begin{matrix}0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0\end{matrix} \right] ^{2}\left[ \begin{matrix}1 \\ 0 \\ -1\end{matrix} \right]$

    ＝$\left[ \begin{matrix}0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0\end{matrix} \right] \left[ \begin{matrix}0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0\end{matrix} \right] \left[ \begin{matrix}1 \\ 0 \\ -1\end{matrix} \right]$ ＝$\left[ \begin{matrix}0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0\end{matrix} \right] \left[ \begin{matrix}-1 \\ 1 \\ 0\end{matrix} \right]$＝$\left[ \begin{matrix}0 \\ -1 \\ 1\end{matrix} \right]$

    故選(A)'
- id: doc_110_台中_興大附中_數學_數A_g11s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某國情報員會用矩陣來交換密碼，首先用 2×1 階矩陣進行編碼：a 以$\left[ \begin{matrix}0 \\ 1\end{matrix} \right]$表示，b 以$\left[ \begin{matrix}0 \\ 2\end{matrix} \right]$表示，c 以$\left[ \begin{matrix}0 \\ 3\end{matrix} \right]$表示，……，z 以$\left[ \begin{matrix}2 \\ 6\end{matrix} \right]$表示，例如：單字“ cat ”就會以$\left[ \begin{matrix}0 & 0 & 2 \\ 3 & 1 & 0\end{matrix} \right]$表示。今天情報員要約定一個地點見面，為了保密，將地點名稱的前四個字母以矩陣 X 表示，透過計算 AX 的加密動作後，傳出矩陣$\left[ \begin{matrix}9 & 3 & 18 & 15 \\ 6 & 2 & 12 & 10\end{matrix} \right]$，該情報員拿出加密矩陣$A=\left[ \begin{matrix}1 & 3 \\ 1 & 2\end{matrix} \right]$，則下列哪一個選項為情報員約定見面的地點？
  options:
  - label: A
    content: 公園（<u>gard</u>en）
  - label: B
    content: 花店（<u>Flow</u>er）
  - label: C
    content: 咖啡廳（<u>cafe</u>）
  - label: D
    content: 速食店（<u>fast</u>food）
  - label: E
    content: 圖書館（<u>libr</u>ary）
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$AX=\left[ \begin{matrix}9 & 3 & 18 & 15 \\ 6 & 2 & 12 & 10\end{matrix} \right]$

    ⇒ X＝$A^{-1}\left[ \begin{matrix}9 & 3 & 18 & 15 \\ 6 & 2 & 12 & 10\end{matrix} \right]$

    ＝$\left[ \begin{matrix}1 & 3 \\ 1 & 2\end{matrix} \right] ^{-1}\left[ \begin{matrix}9 & 3 & 18 & 15 \\ 6 & 2 & 12 & 10\end{matrix} \right]$

    ＝$\frac{1}{-1}\left[ \begin{matrix}2 & -3 \\ -1 & 1\end{matrix} \right] \left[ \begin{matrix}9 & 3 & 18 & 15 \\ 6 & 2 & 12 & 10\end{matrix} \right]$

    ＝$\left[ \begin{matrix}-2 & 3 \\ 1 & -1\end{matrix} \right] \left[ \begin{matrix}9 & 3 & 18 & 15 \\ 6 & 2 & 12 & 10\end{matrix} \right] =\left[ \begin{matrix}0 & 0 & 0 & 0 \\ 3 & 1 & 6 & 5\end{matrix} \right]$，表示 cafe

    故選(C)'
- id: doc_110_台中_興大附中_數學_數A_g11s2e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設二階實係數方陣 A 代表坐標平面的一個鏡射變換且滿足$A^{3}=\left[ \begin{matrix}0 & -1 \\ -1 & 0\end{matrix} \right]$；另設二階實係數方陣 B 代表坐標平面的一個（以原點為中心的）旋轉變換且滿足$B^{4}=\left[ \begin{matrix}0 & -1 \\ 1 & 0\end{matrix} \right]$，試選出正確的選項。
  options:
  - label: A
    content: A 恰有三種可能
  - label: B
    content: B 恰有四種可能
  - label: C
    content: AB＝BA
  - label: D
    content: 二階方陣 AB 代表坐標平面的一個鏡射變換
  - label: E
    content: ABAB＝$BABA=\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：A 代表坐標平面的一個鏡射變換且滿足$A^{3}=\left[ \begin{matrix}0 & -1 \\ -1 & 0\end{matrix} \right]$

    由$A^{2}=\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$

    ∴$A^{3}$＝$AA^{2}$＝AI＝$A=\left[ \begin{matrix}0 & -1 \\ -1 & 0\end{matrix} \right]$

    (B) ○：B 代表坐標平面的一個（以原點為中心的）旋轉變換且滿足$B^{4}=\left[ \begin{matrix}0 & -1 \\ 1 & 0\end{matrix} \right]$

    設$B=\left[ \begin{matrix}\cos \theta & -\sin \theta \\ \sin \theta & \cos \theta\end{matrix} \right]$

    ⇒$B^{4}=\left[ \begin{matrix}\cos \theta & -\sin \theta \\ \sin \theta & \cos \theta\end{matrix} \right] ^{4}=\left[ \begin{matrix}\cos 4\theta & -\sin 4\theta \\ \sin 4\theta & \cos 4\theta\end{matrix} \right] =\left[ \begin{matrix}0 & -1 \\ 1 & 0\end{matrix} \right]$

    ∴4θ＝90°＋360°．k ⇒ θ＝22.5°＋90°．k，k＝0，1，2，3

    (C) ╳：AB＝$\left[ \begin{matrix}0 & -1 \\ -1 & 0\end{matrix} \right] \left[ \begin{matrix}\cos \theta & -\sin \theta \\ \sin \theta & \cos \theta\end{matrix} \right] =\left[ \begin{matrix}-\sin \theta & -\cos \theta \\ -\cos \theta & \sin \theta\end{matrix} \right]$

    BA＝$\left[ \begin{matrix}\cos \theta & -\sin \theta \\ \sin \theta & \cos \theta\end{matrix} \right] \left[ \begin{matrix}0 & -1 \\ -1 & 0\end{matrix} \right] =\left[ \begin{matrix}\sin \theta & -\cos \theta \\ -\cos \theta & -\sin \theta\end{matrix} \right]$

    ∴AB≠BA

    (D) ○：由(C)，AB＝$\left[ \begin{matrix}-\sin \theta & -\cos \theta \\ -\cos \theta & \sin \theta\end{matrix} \right] =\left[ \begin{matrix}\cos (270^{^{\circ}}-\theta ) & \sin (270^{^{\circ}}-\theta ) \\ \sin (270^{^{\circ}}-\theta ) & -\cos (270^{^{\circ}}-\theta )\end{matrix} \right]$

    ∴代表坐標平面的一個鏡射變換

    (E) ○：ABAB＝（AB）（AB）＝$\left[ \begin{matrix}-\sin \theta & -\cos \theta \\ -\cos \theta & \sin \theta\end{matrix} \right] \left[ \begin{matrix}-\sin \theta & -\cos \theta \\ -\cos \theta & \sin \theta\end{matrix} \right] =\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$

    BABA＝（BA）（BA）＝$\left[ \begin{matrix}\sin \theta & -\cos \theta \\ -\cos \theta & -\sin \theta\end{matrix} \right] \left[ \begin{matrix}\sin \theta & -\cos \theta \\ -\cos \theta & -\sin \theta\end{matrix} \right] =\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$

    故選(B)(D)(E)'
