  stem: <u>小興</u>先寫出方程組$\begin{cases}ax-y+4z=3 \\ x-by+3z=1 \\ 2x+y+cz=3\end{cases}$的增廣矩陣，再化簡到$\left[ \begin{matrix}1 & -3 & 5 & 5 \\ 0 & 1 & 2 & 5 \\ 0 & 0 & 1 & 2\end{matrix} \right]$，計算過程均無錯誤，試求序組（a，b，c）＝＿＿＿＿。
  answer:
  - （2，3，3）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left[ \begin{matrix}1 & -3 & 5 & 5 \\ 0 & 1 & 2 & 5 \\ 0 & 0 & 1 & 2\end{matrix} \right]$表示$\begin{cases}x-3y+5z=5 \\ y+2z=5 \\ z=2\end{cases}$的增廣矩陣

    ⇒$\begin{cases}x=-2 \\ y=1 \\ z=2\end{cases}$

    代回$\begin{cases}ax-y+4z=3 \\ x-by+3z=1 \\ 2x+y+cz=3\end{cases}$，得$\begin{cases}a(-2)-(1)+4(2)=3 \\ (-2)-b(1)+3(2)=1 \\ 2(-2)+(1)+c(2)=3\end{cases}$

    ∴$\begin{cases}a=2 \\ b=3 \\ c=3\end{cases}$

    故序組（a，b，c）＝（2，3，3）'
- id: doc_110_台中_興大附中_數學_數A_g11s2e3_s3_2
  section: 3
