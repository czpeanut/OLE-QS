  stem: 下列關於歐洲消費者物價指數（CPI）與物價膨脹率的敘述，何者正確？
  options:
  - label: A
    content: 法國 5 月的物價膨脹率為 5.1 ％，表示當地的雞蛋價格比上個月上漲 5.1 ％
  - label: B
    content: 德國的物價膨脹率連三個月下跌，代表德國所有產品價格連三個月逐漸下跌
  - label: C
    content: 從題文中可得知，以 2022 年為基期，義大利 2023 年的物價指數約為 107.5
  - label: D
    content: 若法、德、義民眾近一年的名目薪資未調升，代表三國的消費力不變
  group_stem: '歐洲近一年來面臨嚴重的通貨膨脹問題，直到 2023 年 5 月才稍有趨緩。法國 5 月的物價膨脹率為 5.1 ％，低於 4 月（近乎 6 ％），這是一年多來的最低數值。德國也從 4 月的超過 7 ％下降至 6.1 ％。這是德國連續第三個月下降。義大利的物價膨脹率下降速度沒有期望中的快，價格仍然居高，比一年前仍然增長了 7.5 ％左右。

    物價膨脹率下降的原因主要是與能源價格趨緩有關，以天然氣為例，2022 年 8 月受到烏俄戰爭影響，價格達到頂峰，一兆瓦時的天然氣價格高達 300 多歐元，2023 年 5 月已下降到 25 歐元，低於烏俄戰爭開始時的水準。其次是國際運費、即海上運輸價格的下降。一個集裝箱從上海到阿姆斯特丹的價格已經從 15,000 美元變成了目前的不到 2,000 美元。

    雖然能源和運輸價格下降，但食品價格卻不斷上升，主要原因是法國 2023 年前幾個月乾旱缺水，西班牙也經歷了類似乾旱天氣，影響到蔬果價格。雖然漲幅沒有過去幾個月高，但以法國為例，5 月分的蔬果價格漲幅仍有 14 ％，這使得歐盟年底物價膨脹率降至 3 ％的目標可能出現更多變數。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) CPI 為一籃子產品加權後的價格，非單一產品。(B) CPI 為一籃子商品加權後的價格下跌，非全部商品皆下跌。(C)因為文中提及 2023 年較 2022 年 CPI 漲了 7.5 ％，若以 2022 年為基期 100，則 2023 年為 107.5，為正解。(D)因為三國的 CPI 皆上升，代表物價上漲，若名目薪資未調升，則三國的消費力下降。
