  explanation: 物價膨脹是指整體價格或物價水準持續上漲的經濟現象，(A)(B)(C)為符合定義的敘述。(D)若整體物價加權後上漲，僅是漲一點點，都算是物價膨脹，且須視是否有持續上漲，但此與漲幅無關。
