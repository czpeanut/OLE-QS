  stem: 對於主計總處 2016 至 2020 年數據的推論，下列敘述何者正確？
  options:
  - label: A
    content: 這 5 年失業率持續穩定減少，表示就業人數亦穩定增加
  - label: B
    content: 2020 年因為 COVID-19 疫情關係，為這 5 年失業人數最多者
  - label: C
