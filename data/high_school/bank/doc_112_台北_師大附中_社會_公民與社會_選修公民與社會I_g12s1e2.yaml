  stem: 颱風天過後，彌豆子去市場買菜，發現青江菜漲了 2.8 倍；空心菜漲了 1.5 倍；地瓜葉漲了 1.6 倍；高麗菜漲了 1.4 倍，老趙心裡嘀咕這菜價簡直漲得不像話。關於「菜價上漲是否為物價膨脹呢？」的說法，何者敘述有「誤」？
  options:
