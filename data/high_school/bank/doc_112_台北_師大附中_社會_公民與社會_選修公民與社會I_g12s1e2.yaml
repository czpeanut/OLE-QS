- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '下表為美國、臺灣、日本雞蛋的價格數量及匯率，若以購買力平價指數（PPP）和匯率比較各國雞蛋價格，下列關於比較後的敘述何者正確？

    | 國家 | 2023 年 1 月各國雞蛋價格與銷售數量 |  | 匯率 （美國：各國） |

    | --- | --- | --- | --- |

    |  | 價格（元／公斤） | 數量（萬公斤） |  |

    | 美國 | 3 USD | 4 | ─ |

    | 臺灣 | 60 TWD | 1.5 | 1：30 |

    | 日本 | 300 JPY | 2 | 1：100 |'
  options:
  - label: A
    content: 以 PPP 進行比較，臺灣雞蛋價格比美國便宜
  - label: B
    content: 從匯率比較，可發現日本雞蛋價格比美國高
  - label: C
    content: 臺灣雞蛋銷售量低，代表臺灣人購買力較低
  - label: D
    content: 考量銷售數量後，日本的平均薪資較美國高
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 以 PPP 進行比較，美國一公斤為 3 美元，臺灣為 2 美元，日本為 3 美元。(A)臺灣雞蛋比美國便宜，為正解。(B)日本雞蛋價格與美國一樣。(C)購買力是指相同貨幣可以買到的商品數量，非以銷售量做比較。(D)從表中數據，無法得知日本的平均薪資為何。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 由於通貨膨脹的疑慮未解，為恢復物價穩定，美國聯邦準備理事會（Fed）負責利率決策的聯邦公開市場委員會（FOMC）2023 年 3 月 23 日宣布升息 1 碼（0.25 ％），連 9 度決議升息，達到 2007 年 9 月以來最高的 4.75 ％至 5 ％。但因多家銀行倒閉，使得聯準會也暗示升息將可能止步。根據上文，請問下列敘述何者較為正確？
  options:
  - label: A
    content: 調升利率的目的主要是要使資金流到市場上，以解決不景氣的問題
  - label: B
    content: 調升利率可減少市場上的熱錢，減緩通貨膨脹，但也可能衝擊股市
  - label: C
    content: 調升利率是一種寬鬆的貨幣政策，可避免經濟不景氣導致的倒閉潮
  - label: D
    content: 調升利率是一種緊縮性的財政政策，若在臺灣是屬於財政部的權責
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)調升利率是要減少資金到市場，抑制景氣過熱。(C)此為緊縮性的貨幣政策。(D)緊縮性的貨幣政策，在臺灣則為中央銀行的權責。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 主計總處發布 2023 年二月受僱員工薪資狀況，累計前兩個月工業及服務業全體受僱員工每人經常性薪資平均 45,206 元，年增率 2.39 ％，但是一、二月物價年增率 2.74 ％，平減物價後，年減 0.34 ％。依據題文，社會上最有可能出現下列何種現象？
  options:
  - label: A
    content: 實質生活支出下降
  - label: B
    content: 產品市場供過於求
  - label: C
    content: 政府大幅增加支出
  - label: D
    content: 實質工資不增反減
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文得知，薪資年增率 2.39 ％小於物價年增率 2.74 ％，顯示薪水漲幅趕不上物價，此意味著實質薪資縮減，故選(D)。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 阿雪獲得父親留下的遺產現金 300 萬元，她選擇把錢存入臺灣銀行一年到期的定期存款，利率 2 ％，一年後阿雪將本金及利息全部領回，假設到期那年消費者物價指數為 105，請問阿雪的實質報酬為何？
  options:
  - label: A
    content: 收益 6 萬
  - label: B
    content: 收益 9 萬
  - label: C
    content: 虧損約 8.6 萬
  - label: D
    content: 虧損約 14.3 萬
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 實質報酬＝本金 300 萬元×（1＋2 ％）∕CPI 年增率 1.05＝291.42 萬，與本金相減之下，約虧損 8.6 萬，故選(C)。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 由於出口不振、民間投資縮手、民間消費也轉弱，主計總處下修 2023 年全年經濟成長率至 2.12 ％，為近八年新低、上修今年 CPI 年增率到 2.16 ％。依據上文，下列有關我國經濟成長率、平均每人 GDP 以及 CPI 年增率敘述，何者正確？
  options:
  - label: A
    content: 主計總處下修經濟成長率，故今年實質 GDP 將會較去年低
  - label: B
    content: 政府若想要提高今年的經濟成長率，可以大幅增加移轉性支出
  - label: C
    content: CPI 年增率上修到 2.16 ％，表示消費者的生活成本較去年提高
  - label: D
    content: 平均每人 GDP 與 CPI 年增率，可比較出各國的生活成本變動情形
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)雖下修經濟成長率，但仍為正值，意味今年的實質 GDP 較去年高。(B)移轉性支出不計入 GDP。(C)由於該年度通貨膨脹率（CPI 年增率）為正值，意味生活成本較去年高，為正解。(D)要比較各國的生活成本變動之情形，應採用購買力平價指數（PPP）才能做跨國比較。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小威於寒假期間參加某大學的金融營，其中有一個活動是根據劇本來做角色扮演，使學員們能更加熟悉資金借貸市場的運作。以下劇本人物的敘述中，何者可能有「誤」？
  options:
  - label: A
    content: 廣志：我們家最近打算買房，要辦 30 年的房屋貸款，每個月須承擔還款利息，屬於可貸資金市場中的資金需求者
  - label: B
    content: 風間：我家家境富裕，有一部分的錢放在銀行做避險動作，並得到利息報酬，我們屬於可貸資金市場的資金供給者
  - label: C
    content: 中央銀行總裁：我們作為國家的銀行、銀行的銀行，有權維持金融市場的穩定並監督商業銀行的運作
  - label: D
    content: 小新：我在玉山銀行工作，我們其中一個業務就是將吸收的資金以較高的放款利息再借給有需求者，故屬於資金借貸市場的供給者
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)商業銀行僅為資金市場的中介機構，並非借貸市場的供給者。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 當景氣過熱，通貨膨脹較嚴重時，為抑制景氣，央行會減少貨幣供給量，原因在於央行認為社會上的資金太多可能引發通貨膨脹，而通貨牽涉到貨幣購買力高低與貨幣數量多寡；物價則與產品數量多寡及產品價格高低有關，此四者影響社會經濟發展甚鉅。下列對四者間的互動描述，何者正確？
  options:
  - label: A
    content: 貨幣數量增幅大於產品數量，貨幣購買力會上升、產品價格會降低
  - label: B
    content: 貨幣數量增幅小於產品數量，貨幣購買力會降低、產品價格會上升
  - label: C
    content: 產品數量不變，貨幣數量減少，產品價格會降低、貨幣購買力會上升
  - label: D
    content: 產品數量不變，貨幣數量增加，產品價格會上升、貨幣購買力會上升
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)過多的貨幣會使貨幣購買力下降，產品價格會上升。(B)貨幣數量增幅小於產品數量，貨幣購買力會上升，產品價格會下降。(D)貨幣購買力會下降。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 炭治郎正在修習本學期的「公民科探究與實作」課程，現在正在進行「觀察與蒐集資料」的階段，他閱讀的資料如右圖所示，以此回推他目前的研究問題最有可能是以下何者？
  options:
  - label: A
    content: 中美貿易戰後，美國部分廠商將訂單轉移到臺灣生產，廠商對市場發展前景看好，對可貸資金市場產生的影響
  - label: B
    content: COVID-19 影響，部分廠商對未來市場前景感到悲觀，決定減少向銀行借貸來投資
  - label: C
    content: 政府實施減稅政策，使家庭可支配所得增多，對可貸資金市場間接造成的影響
  - label: D
    content: 金融海嘯發生，造成嚴重失業題對家庭所得及市場利率的影響
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2/s1_8_f1.png
    crop:
      page: 2
      rect:
      - 417.15
      - 349.4
      - 564.3
      - 481.9
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 圖中為可貸資金的供給增加。(A)訂單增加應該是增加可貸資金市場的需求。(B)此為減少資金市場的需求。(C)民眾可支配所得增加，可能增加儲蓄，使可貸資金市場的供給增加，為正解。(D)失業嚴重，民眾無所得可儲蓄，使可貸資金市場的供給減少。
- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 某劇中的女主角擁有高學歷且曾具豐富的廣告行銷獲獎資歷，卻因家庭而辭去工作長達 7 年，近期想重返職場、二度就業，但時代與科技變遷快速，行銷策略、科技媒體、社群操作等方式已不同以往，不到 10 年已經換了新的世代。女主角發現她幾乎是因為無法熟悉運用新軟體而無法錄取。請問上述情景中的女主角屬於何種失業類型？
  options:
  - label: A
    content: 因社群媒體轉型快速，有關產業及公司宣告破產而導致景氣低迷的循環性失業
  - label: B
    content: 因行銷軟體策略與產業技術已有所改變，無法滿足廠商業務需求的結構性失業
  - label: C
    content: 因畢業與年後轉職潮所產生的勞動力激增，導致無法完全媒合產業的自然失業
  - label: D
    content: 因社交軟體日益更新及發明，導致產業結構變化而不斷進修學習的摩擦性失業
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 結構性失業為經濟結構改變使勞工原有的技術及專業無法因應新工作的需求，而形成的失業人口，符合文中所提及「時代與科技變遷快速，行銷策略、科技媒體、社群操作方式已不同以往」，故選(B)。
