  stem: 若小查想為兩方的論點做個總結，下列何者最可能是其說明？
  options:
  - label: A
    content: 政府伸手介入市場後，就能達到社會最佳利益與福祉
  - label: B
    content: 薪資與所得愈高，勞資雙方都能達到獲利、共創雙贏
  - label: C
    content: 提升薪資可以維護民眾生活開銷，但也可能造成失業
  - label: D
    content: 政府提升所有工作的平均薪資，就能夠解決失業問題
  group_stem: '以下為小查在公民課的觀察筆記：

    這次公民課老師採用分兩組辯論的方式，探討「我國是否應設置基本工資」，正方為支持設置基本工資，並認為設置基本工資能夠帶來好處；反方為反對政府介入市場調整工資，因為設置工資限制造成的弊害大於利益，以下為雙方申論稿的摘要。

    立場 A：以社會正義的立場來看，設置基本工資能讓薪資與勞動付出更相等，因參考物價浮動設置資本工資，而以此更能保障人民的日常生活所需，減少貧富差距。若是勞動僅能獲得與付出不成相比，或無法維持生活的薪水，容易使人民對自己的工作與生命價值感到斷裂，產生自我懷疑，故設置基本工資以符合日常生活或工作價值是必需的。

    立場 B：以經濟學理論來看，設置基本薪資後，勞動價格提升會產生更多願意工作的人，卻有更多的人無法取得工作，造成失業增加，且原先較不利、沒有競爭力的族群，也會因基本工資設置而失去工作，但人民還是需要尋求溫飽，因此轉向更沒有保障的黑市打工，領取更少的薪資與更高的風險，這些都是因為設置基本薪資所帶來的弊害。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府管制反而會造成社會福祉減損。(B)薪資與所得愈高，代表對資方成本提高、對其不利，對勞方相對有利，但仍有無謂損失。(D)提升平均薪資，會提升資方的成本，反而減少勞動需求，使得失業率增加。
