    | 2018 年 | 20,096 | 11,839 | x | 11,409 | ─ | 3.63 |

    | 2019 年 | 20,169 | 11,919 | ─ | 11,485 | ─ | 3.64 |

    | 2020 年 | 20,221 | 11,972 | ─ | 11,536 | z | 3.64 |

    （備註：資料來源為行政院主計總處；時間為該年一月；人數單位為千人。 ）'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)找不到工作的原因很多，並非皆因不夠努力。(B)因為沒有辭職，所以不屬於失業者，應屬於隱藏性失業的範疇。(C)依政府定義：就業人口指在資料標準週內年滿 15 歲從事有酬工作者，或從事 15 小時以上之無酬家屬工作者。因此須看其所得及工作是否有列入就業人口的調查。
