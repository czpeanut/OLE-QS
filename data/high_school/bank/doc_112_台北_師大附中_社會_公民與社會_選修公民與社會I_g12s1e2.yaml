- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 利率是由可貸資金市場的供需雙方共同決定，下列何項因素會使均衡實質利率上升？
  options:
  - label: A
    content: 中央銀行在市場上面售出政府公債
  - label: B
    content: 中央銀行調降對銀行的法定存款準備率
  - label: C
    content: 中央銀行調降商業銀行的重貼現率
  - label: D
    content: 景氣變差，廠商預期收益可能減少
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '要使均衡利率上升須減少貨幣供給量，因此應採用緊縮性的貨幣政策。(A)當政府售出公債，市面上的貨幣供給會減少，而使得均衡實質利率上升，為正解。(B)(C)為寬鬆性的貨幣政策，會使貨幣供給增加，而降低均衡利率。(D)廠商預期收益減少，會減少資金需求，使得均衡利率下降。

    18.2022 的 CPI 為（31×100＋50×50＋230×5）／（30×100＋50×50＋200×5）×100＝6,750／6,500×100＝103.84，故選(B)。

    19.由於自動化設備是勞工的替代品，當勞工薪資上漲，勞工的需求量會減少，而生產者對自動化設備的需求會增加，需求線向右移，故選(B)。

    20.(A)在這段期間，2021 年 2 月的 CPI 最高，因此欲購買等量的商品須花費最多金錢，為正解。(B) 2020 年 8 月、2020 年 9 月及 2021 年 1 月的 CPI 為負值，意味物價下跌，故非持續上漲。(C) CPI 上漲與我國實質 GDP 的變化沒有正向相關。(D)沒有相關背景資訊無法得知是否與景氣波動有關聯。

    21.(A)新加坡的 PPP 較美國高，因此物價應較美國高。(B)沒有前一年的 GDP 數值，無法比較各國之經濟成長率。(C)臺灣以 PPP 計算的人均 GDP 為 54,841，意味可買到 54,841 的商品，為正確敘述。(D)以 PPP 計算的 GDP 考量物價波動之情形會較準確，因此應以 63,079 的數據做為參考。

    22.降息為寬鬆性貨幣政策的做法，目的是增加貨幣數量，以刺激景氣，增加民間消費與廠商投資，故選(A)。(B)應是減少廠商投資成本。(C)減少存款者利息收益。(D)增加銀行可貸放資金。

    23.(A)升息應該會抑制通貨膨脹。(B)能源價格漲價，不一定會使廠商的利潤增加，因為成本也增加。(C)民眾增加消費，確實會產生需求拉動的通貨膨脹，為正解。(D)政府擴大公共建設支出為寬鬆性財政政策，與通貨膨脹並無直接關聯。

    24.貨幣政策為央行藉由控制貨幣供給量或利率水準，來達到影響經濟活動的手段，其具體做法為調整重貼現率、調整存款準備率及公開市場政策，因此普發現金六千不為寬鬆性貨幣政策，此措施是由政府編列預算支應，故選(B)。

    25.有關資金的融通方式，若非直接由資金供給者將資金轉移至資金需求者，而係透過金融中介機構間接進行之方式稱為間接金融，唯有(D)青年貸款須透過銀行進行，此屬於間接金融之做法。

    26.購買力平價是指兩種或多種貨幣在不同國家或地區，購買相同數量和質量的商品及服務時的價格比率，因此無法考量代表性與品質的差距，故選(A)。(B)(C)(D)皆為 PPP 之相關概念。

    27.(A)沒有總人口的數據，無法得知義大利失業人數是否高於法國。(B)從失業率無法推論勞動參與率。(C)因為下崗計畫非直接裁員，而可稍微降低失業率或使其增幅較小，為正解。(D)文中應指景氣造成的循環性失業，但該敘述的做法適合摩擦性失業。

    28.「黃藍燈」意味景氣仍然有點冷，央行可透過寬鬆的貨幣政策，增加貨幣供給以刺激景氣。(A)應是調高放款額度，才能增加貨幣供給。(B)為寬鬆性貨幣政策，為正解。(C)應要調降重貼現率。(D)應是買回公債，才能增加貨幣供給。

    29.(A)是否會一路長紅仍須看接下來國內外的經濟情勢。(B)應是增加資金需求，會使利率上升且借貸總額增加，而推升物價膨脹。(C)資金需求左移，會使均衡利率下降，借貸總額下降。

    30.(A)利率上升會使固定投資成本增加，因而減緩投資，為正確敘述。(B)賣出公債將吸引民眾購買以減少貨幣流通量，可減緩物價膨脹。(C)緊縮的貨幣政策將使利率上升並抑制物價，人民會減少固定投資意願。(D)利率上升會使投資者增加存款，減少將資金投入股票或基金市場。

    31.(A)以物價水準考量的人均 GDP，臺灣排名高於英國與法國，意味臺灣的貨幣購買力高於此兩國，為正確敘述。(B)物價高與兌美元的匯率無正相關。(C)依文中可知日本、韓國的所得比臺灣高。(D)依照文述，臺灣以美元匯率計算的 GDP 會低於日本。

    32.(A)因為臺灣的物價水準最低，故此敘述正確。(B)日韓的大麥克指數應該高於臺灣，因其物價較臺灣高。(C)大麥克指數為物價指數，富有程度要看人均 GDP，無法直接做比較。(D)臺灣的大麥克指數應低於日韓，因我國的物價水準較此兩國為低，物價膨脹較為嚴重的說法有誤。

    33.(D)臺灣的貨幣購買力高，是由於臺灣的物價低於日韓兩國，而非貨幣所得低於日韓兩國。'
