  options:
  - label: A
    content: 怯志工作者是因為不夠努力，所以才會找不到工作
  - label: B
    content: 不滿工作卻不辭職者，屬於摩擦性失業的短期現象
  - label: C
    content: 低工時勞動者有工作與所得，列為就業者無庸置疑
  - label: D
    content: 怯志工作者容易會有低落或排斥與他人互動等情況
  group_stem: '資料一：部分學者認為勞動部統計的失業率與現實不符，因為有兩種比較特殊的存在：第一種，是有工作卻只有少許的工時，因為只有少許的薪資與不穩定的未來，或對工作不滿，卻無法轉換工作；另外，也有一些人努力找工作，卻因屢屢失敗受挫而成為「想工作而未找工作者」的人，這些人被稱為「怯志工作者」。在這種情況下，數字的美麗卻可能讓人低估社會實際勞動的狀況。而後者在近年受到較多的關注，因為其通常被不斷的失敗，造成強烈的無助感，也可能因長期不在社會交流，與社會產生脫節與較低的生活滿意度。

    資料二：主計總處 2016 至 2020 年勞動相關數據。

    |  | 15 歲以上 民間人口 | 勞動力 | 非勞動力 | 就業人數 | 失業人數 | 失業率（％） |

    | --- | --- | --- | --- | --- | --- | --- |

    | 2016 年 | 19,927 | 11,697 | ─ | 11,244 | ─ | 3.87 |

