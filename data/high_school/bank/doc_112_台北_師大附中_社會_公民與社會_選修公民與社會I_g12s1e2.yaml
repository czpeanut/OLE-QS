- id: doc_112_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 法新社報導：2020 年 7 月疫情衝擊下，幾十萬名學生 9 月畢業時恐將面臨失業；而在觀光、出口皆停擺下，泰國今年經濟預料將重跌 10 ％，重傷中產和勞工階級。當地經濟如自由落體般惡化，而泰國現在有 300 萬人口，其中未滿 15 歲的人口占全國的 1∕5，現役軍人共 40 萬人，經過本年度普查後，2∕5 的 15 歲以上民間人口表示現在無工作意願。已知現在有 6 萬人處於失業狀態，在這樣的情況失業率達＿＿＿＿，使得民眾不滿掌權者盡是年邁的前軍事將領以及君主制度的擁護者。約 2,500 名泰國抗議人士不顧 COVID-19 疫情群聚禁令，昨晚要求政府下臺、解散國會，為 2014 年軍事政變以來規模最大的街頭示威活動之一。上述報導提到的失業率空白處為多少？
  options:
  - label: A
    content: 4.17 ％
  - label: B
    content: 5 ％
  - label: C
    content: 28.67 ％
  - label: D
    content: 50 ％
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 失業率＝失業人口／勞動人口×100 ％，該國的 15 歲以上民間人口為 300 萬人×4／5－40 萬人＝200 萬人，勞動人口為 200 萬人×3∕5＝120 萬人，因此失業率為 6 萬人∕120 萬人×100 ％＝5 ％，故選(B)。
