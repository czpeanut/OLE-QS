    | 2016 年 | 19,927 | 11,697 | ─ | 11,244 | ─ | 3.87 |

    | 2017 年 | 20,011 | 11,765 | ─ | 11,320 | y | 3.78 |

    | 2018 年 | 20,096 | 11,839 | x | 11,409 | ─ | 3.63 |

    | 2019 年 | 20,169 | 11,919 | ─ | 11,485 | ─ | 3.64 |

    | 2020 年 | 20,221 | 11,972 | ─ | 11,536 | z | 3.64 |

    （備註：資料來源為行政院主計總處；時間為該年一月；人數單位為千人。 ）'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)失業率減少，可能與勞動力及失業人口有關，不代表就業人數增加。(B)失業率＝失業人口∕勞動力，由於 2016 年失業率最高，且其勞動力最少，因此 2016 年的失業人口應為此 5 年中最多者。(C) 2017 年的勞動力 11,765（千人）＝就業人口 11,320（千人）＋失業人口 y，因此 y＝445（千人），為正確敘述。(D)非勞動力 x＝15 歲以上民間人口 20,096（千人）－勞動力 11,839（千人），x＝8,257（千人）。
