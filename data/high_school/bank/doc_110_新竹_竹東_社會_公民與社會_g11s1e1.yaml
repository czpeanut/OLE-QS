  group_stem: ◎阿文很好奇，為什麼平時沒有出門工作的媽媽，常常跟朋友逛街購物，好像有花不完的錢。一天，他從司法院的網站看到關於夫妻間「自由處分金」的敘述： 民法第1018-1條：「夫妻於家庭生活費用外，得協議一定數額之金錢，供夫或妻自由處分。」其立法目的在於保障夫妻經濟自主及婚姻和諧，明定夫妻於家庭生活費用外，得協議一定數額之金錢，供夫或妻自由處分。 不論夫妻係一方工作，他方為家庭主婦或家庭主夫；或夫妻雙方均有工作之雙薪家庭，均可由夫妻雙方協議自由處分金。對於自由處分金之協議方式並未加以限制，以口頭約定或書面約定均可，故夫妻雙方可自行協議，亦可至律師事務所請求律師協助協議。
