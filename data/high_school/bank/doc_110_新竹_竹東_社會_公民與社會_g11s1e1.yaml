  stem: 娜美到一家美式賣場購物，並從女裝區購買了一件花式襯衫，結帳時，娜美在櫃檯看見了一張海報，內容寫著：「親愛的消費者，當你購買本產品時，代表已接受本賣場有關貨物之規定，貨物售出，概不退換」，娜美認為此海報對於消費者而言是顯失公平的，建議商家撤下，否則檢舉該店家。請問娜美此行為該如何解釋最適當？
  options:
  - label: A
    content: 合理。依據消費者保護法規定，賣場不得以「貨物既出，概不退換」為理由，而強制取消雙方合理訂約的權利
  - label: B
    content: 合理。此海報內容為定型化契約，賣場未考量貨物有無瑕疵損壞，一律不准換貨，顯失公平
  - label: C
    content: 不合理。美式賣場為實體店面無猶豫期適用，娜美必須遵守海報內容規定
  - label: D
    content: 不合理。海報內容並非定型化契約，無顯失公平的問題，娜美不滿意可以不買
  tags:
    unit:
      code: CI-3-1-1
      book: 公民與社會3 選擇與永續
      chapter: 契約自由與財產權保障
      title: 契約自由
