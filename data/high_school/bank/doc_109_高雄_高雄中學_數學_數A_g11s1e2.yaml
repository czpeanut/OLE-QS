- id: doc_109_高雄_高雄中學_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 如右圖，正六邊形 ABCDEF 的邊長為 2，若 $\vec{OB}$＝2（cos（θ＋60°），sin（θ＋60°））， 請選出正確的選項。
  options:
  - label: A
    content: $\vec{OD}$＝2（－cosθ，sinθ）
  - label: B
    content: $\vec{OE}$＝2（cos（θ－120°），sin（θ－120°））
  - label: C
    content: $\vec{OA}$．$\vec{OD}$＝4
  - label: D
    content: $\vec{AC}$．$\vec{OE}$＝0
  - label: E
    content: $\vec{CE}$＝$2\sqrt{3}$（sinθ，－cosθ）
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_109_高雄_高雄中學_數學_數A_g11s1e2/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 470.5
      - 367.05
      - 561.9
      - 461.1
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵∠BOD＝120°

    ∴$\vec{OD}$＝2（cos（θ＋180°），sin（θ＋180°））＝2（－cosθ，－sinθ）

    (B)○：∵∠BOE＝180°

    ∴$\vec{OE}$＝$-\vec{OB}$＝－2（cos（θ＋60°），sin（θ＋60°））

    ＝2（cos（θ－120°），sin（θ－120°））

    (C)╳：∵$| \vec{OA} | = | \vec{OD} |$＝2 且∠AOD＝180° ∴$\vec{OA} \cdot \vec{OD}$＝－4

    (D)○：∵$\vec{AC} \cdot \vec{OE}$＝$( \vec{OC} - \vec{OA} ) \cdot \vec{OE}$＝$\vec{OC} \cdot \vec{OE} - \vec{OA} \cdot \vec{OE}$

    ＝$| \vec{OC} | | \vec{OE} |$cos120°－$| \vec{OA} | | \vec{OE} |$cos120°＝0

    (E)○：∵$\vec{CE}$＝$\vec{OE} - \vec{OC}$

    ＝2（cos（θ－120°），sin（θ－120°）） －2（cos（θ＋120°），sin（θ＋120°））

    ＝2（cosθcos120°＋sinθsin120°－cosθcos120°＋sinθsin120°， sinθcos120°－cosθsin120°－sinθcos120°－cosθsin120°）

    ＝2（$\sqrt{3}$sinθ，－$\sqrt{3}$cosθ）＝$2\sqrt{3}$（sinθ，－cosθ）

    故選(B)(D)(E)'
- id: doc_109_高雄_高雄中學_數學_數A_g11s1e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 下列參數方程式何者圖形為一線段？
  options:
  - label: A
    content: $\begin{cases}x = 1 + 2^{t} \\ y = - 1 - 2^{t}\end{cases}$，－3$\leq$t$\leq$3
  - label: B
    content: $\begin{cases}x = 1 + 3\log | t | \\ y = - 1 + \log | t |\end{cases}$，－3$\leq$t$\leq$3 且 t≠0
  - label: C
    content: $\begin{cases}x = 1 + 5\sin \theta \\ y = 3\sin \theta\end{cases}$，θ$\in$R
  - label: D
    content: $\begin{cases}x = 1 + 5\sin \theta \\ y = - 1 + 3\cos \theta\end{cases}$，θ$\in$R
  - label: E
    content: $\begin{cases}x = 1 + \sec ^{2}\theta \\ y = - 1 + \tan ^{2}\theta\end{cases}$，θ$\in$R
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\begin{cases}x = 1 + 2^{t} \\ y = - 1 - 2^{t}\end{cases}$，－3$\leq$t$\leq$3

    $\Rightarrow$x＋y＝0，$\frac{9}{8}\leq$x$\leq$9，為一線段

    (B)╳：$\begin{cases}x = 1 + 3\log | t | \\ y = - 1 + \log | t |\end{cases}$，－3$\leq$t$\leq$3，且 t≠0

    $\Rightarrow$x－3y＝4，x$\leq$1＋3 log3，為一射線

    (C)○：$\begin{cases}x = 1 + 5\sin \theta \\ y = 3\sin \theta\end{cases}$，θ$\in$R

    $\Rightarrow$3x－5y＝3，－4$\leq$x$\leq$6，為一線段

    (D)╳：$\begin{cases}x = 1 + 5\sin \theta \\ y = - 1 + 3\cos \theta\end{cases}\Rightarrow\begin{cases}( x - 1 ) ^{2} = ( 5\sin \theta ) ^{2} = 25\sin ^{2}\theta \\ ( y + 1 ) ^{2} = ( 3\cos \theta ) ^{2} = 9\cos ^{2}\theta\end{cases}$

    $\Rightarrow$9（x－1）$^{2}$＋25（y＋1）$^{2}$＝225（$sin^{2}$θ＋$cos^{2}$θ）＝225

    不為一線段

    (E)╳：$\begin{cases}x = 1 + \sec ^{2}\theta \\ y = - 1 + \tan ^{2}\theta\end{cases}\Rightarrow$x－1＝（y＋1）＋1$\Rightarrow$x－y＝3，2$\leq$x，為一射線

    故選(A)(C)'
