  stem: '所謂<u>對蹠點</u>是指球面上任一點舆球心的連線，在球面的另一端與球面的交點。例如，從地表上某一點P與地心連線，這條線穿過地心後，會與地表在另一端交於一點Q，這個交點Q就是P的<u>對蹠點</u>。因此，我們可以說，球體直徑兩端的點，互為<u>對蹠點</u>。 請根據以上說明，回答下列問題：

    (1)已知甲地位於東經75度，北緯30度，選出甲地在地球面上的<u>對蹠點</u>為'
