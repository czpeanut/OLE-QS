- id: doc_108_桃園_武陵_數學_g10s2e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 已知 A、B 為樣本空間中的兩事件，設$P (A' \cap B')=\frac{1}{4}$，$P (A)=\frac{2}{3}$，$P (A \cap B)=\frac{1}{6}$，則下列選項哪些是正確的？
  options:
  - label: A
    content: $P (A')=\frac{1}{3}$
  - label: B
    content: $P (A \cup B)=\frac{5}{6}$
  - label: C
    content: $P (A \cup B)=\frac{3}{4}$
  - label: D
    content: $P (B)=\frac{5}{12}$
  - label: E
    content: $P (A'-B')=\frac{1}{12}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：P（A''）＝1－P(A)＝$1-\frac{2}{3}=\frac{1}{3}$

    (B) ╳ (C) ○：P（A∪B）＝1－P（A''∩B''）＝$1-\frac{1}{4}=\frac{3}{4}$

    (D) ╳：P（A∪B）＝P(A)＋P(B)－P（A ∩ B）

    ⇒ $\frac{3}{4}=\frac{2}{3}+P (B)-\frac{1}{6}$ ⇒ $P (B)=\frac{1}{4}$

    (E) ○：P（A''－B''）＝P（A''）－P（A''∩B''）＝$\frac{1}{3}-\frac{1}{4}=\frac{1}{12}$

    故選(A)(C)(E)'
- id: doc_108_桃園_武陵_數學_g10s2e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設坐標平面上有 O，P，Q 三點，O 為原點；P 點的極坐標為$P [2\sqrt{5} , \theta ]$，其中 tanθ＝2 且 180°＜θ＜270°，試問下列哪些選項恆正確？
  options:
  - label: A
    content: P 點的直角坐標為$P (-2\sqrt{5} \cos \theta , -2\sqrt{5} \sin \theta )$
  - label: B
    content: P 點的直角坐標為 P（－2，－4）
  - label: C
    content: P 點對 x 軸的對稱點，其極坐標為$[2\sqrt{5} , \theta -90^{^{\circ}}]$
  - label: D
    content: P 點對 y 軸的對稱點，其極坐標為$[2\sqrt{5} , 180^{^{\circ}}-\theta ]$
  - label: E
    content: 若有一點 Q 其極坐標為 Q[2，90°]，則△OPQ 的面積為 2 平方單位
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$P (2\sqrt{5}\cos \theta , 2\sqrt{5}\sin \theta )$

    (B) ○：180°＜θ＜270°，tanθ＝2 ⇒ $\sin \theta =\frac{-2}{\sqrt{5}}$，$\cos \theta =\frac{-1}{\sqrt{5}}$

    故$P (2\sqrt{5}\cos \theta , 2\sqrt{5}\sin \theta )$＝P（－2，－4）

    (C) ╳：所求極坐標為$[2\sqrt{5} , -\theta ]$

    (D) ○：所求極坐標為$[2\sqrt{5} , 180^{^{\circ}}+(-\theta )]$＝$[2\sqrt{5} , 180^{^{\circ}}-\theta ]$

    (E) ○：△OPQ 面積為$\frac{1}{2}\times 2\sqrt{5}\times 2\times \sin ( \theta -90^{^{\circ}})$＝$2\sqrt{5}\times (-\cos \theta )$＝2

    故選(B)(D)(E)'
- id: doc_108_桃園_武陵_數學_g10s2e3_s3_3
  section: 3
  number: 3
  type: calc
  page: 2
  stem: 設坐標平面上有兩直線 $L_{1}$：$x-\sqrt{3}y =0$，$L_{2}$：x＋y＝0。若兩直線夾角為θ，則 tanθ之值為何？（有兩解，需有計算過程才給分，直接背出答案者不予計分）（5 分）
  group_stem: '如右圖所示，ABCD 是一矩形，$\overline{AB} =1$。設α、β是兩銳角且 0°＜α＋β＜90°，在$\overline{BC}$，$\overline{CD}$上分別取一點 E，F，使得∠BAE＝α，∠EAF＝β且$\overline{AE}\perp \overline{EF}$。試回答下列各題。

    (1) 請問下列哪些選項正確？（多選，5 分）

    (A)$\overline{BE} =\tan \alpha$

    (B)$\overline{AE} =\frac{1}{\sin \alpha}$

    (C)$\overline{EF} =\frac{\tan \beta}{\sin \alpha}$

    (D)$\overline{EC} =\tan \beta$

    (E)$\overline{CF} =\tan \alpha \tan \beta$

    (2) 試利用右上圖及第(1)題結果，證明$\tan (\alpha +\beta )=\frac{\tan \alpha +\tan \beta}{1-\tan \alpha \tan \beta}$。（提示：觀察△ADF）（2 分）'
