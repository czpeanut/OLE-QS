    content: $C_{48}H_{66}O_{6}$
  - label: D
    content: $C_{48}H_{72}O_{8}$
  tags:
    unit:
      code: BI-S1-1-1
      book: 選修生物I 細胞與遺傳
      chapter: 細胞的分子組成與構造
      title: 細胞的分子組成
      std: true
    textbook: 選修生物I 細胞與遺傳 細胞的分子組成
    pattern:
      key: BI-S1-1-1:T09
      name: 脂質結構、飽和度與計量
