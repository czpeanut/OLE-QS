    label_note: 題幹脂肪酸分子式疑誤植為 C_6H_22O_2（應為 C_16H_32O_2）
    fixed_by: agent
    fix_note: （人工修正：修正脂肪酸分子式OCR誤植為C16H22O2並補齊答案與解析）
  difficulty: 3
  explanation: 三個脂肪酸與一個甘油進行脫水縮合反應形成三酸甘油酯（脂肪），過程中脫去3分子水($H_2O$)。碳原子數＝3×16＋3＝51；氫原子數＝3×22＋8－3×2＝68；氧原子數＝3×2＋3－3×1＝6，故分子式為$C_{51}H_{68}O_{6}$，選(A)。
  answer_status: ai_generated
  answer_source: agent
  answer:
  - A
