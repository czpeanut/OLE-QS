  page: 4
  stem: 下列何種狀態發生於人體內時，易罹患心血管疾病？
  options:
  - label: A
    content: HDL-C濃度高，LDL-C濃度高
  - label: B
    content: HDL-C濃度高，LDL-C濃度低
  - label: C
    content: HDL-C濃度低，LDL-C濃度高
  - label: D
    content: HDL-C濃度低，LDL-C濃度低
  group_stem: ◎閱讀二 膽固醇是細胞膜的重要成分，也是膽鹽及許多固醇類激素的前驅物質，人體內的膽固醇約三分之二與長鏈脂肪酸結合，並經由脂蛋白運送，血液中膽固醇濃度的正常範圍約150～250 mg／L。三酸甘油酯是脂肪組織的重要成分，也是儲存能量的方式，在人體內經由脂蛋白運送，血液中的三酸甘油酯濃度正常範圍約120～190 mg／dL。 高密度脂蛋白膽固醇（HDL-C）為脂蛋白的一種，約含50％蛋白質、20％膽固醇、30％磷脂及少量三酸甘油酯，主要作用可將多餘膽固醇帶到肝臟代謝或排出體外。若血中高密度脂蛋白膽固醇濃度低於35 mg／dL，罹患心血管疾病的機率將增高。低密度脂蛋白膽固醇（LDL-C）也為脂蛋白的一種，約含20％蛋白質、52％膽固醇、22％磷脂及6％三酸甘油酯，主要作用為將膽固醇由肝臟帶到周邊組織去利用，如果LDL-C濃度高於160 mg／dL，可能會堆積在血管中引起動脈硬化。近來發現氧化的LDL-C是具傷害性的成分，它可影響血管內皮細胞的功能，並誘發巨噬細胞的生成。巨噬細胞接著產生許多氧化性自由基使LDL-C被氧化，再更一進步吞噬LDL-C，逐漸轉變成充滿膽固醇的細胞，而壞死的巨噬細胞對血管內壁又會再度造成傷害。
