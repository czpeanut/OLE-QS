  group_stem: 2010 年國際足聯宣布 2022 年世界盃足球賽在卡達主辦，為史上第一次在中東地區舉辦的世界盃，2015 年國際足聯宣布卡達世界盃舉辦期間由以往的 6、7 月移至 11、12 月，亦為史上首例。然而卡達人口數僅有約 3 百萬人，場館興建所需的資源多仰賴進口，勞力需求也藉由鄰近區域移工完成。2017 年 6 月「外交危機」中，受沙烏地阿拉伯、阿拉伯聯合大公國、埃及、巴林等 7 個國家以卡達支持恐怖組織為由，宣布與卡達斷交，同時被鄰近阿拉伯國家實施經濟制裁，甚至封鎖其陸路運輸與周邊領空，影響賽事場館興建進度，使卡達於原本物資大量倚賴從沙烏地阿拉伯進口，後期選擇全面仰賴伊朗與土耳其。後續趕工過程中所造成的工安意外，引發國際人權與勞動團體關注。隨近日賽事開幕，許多議題仍持續受到討論，例如：本次世界盃受卡達法律限制，發布飲酒禁令，取消場館內外啤酒攤位的設立，外國人購買酒精性飲品僅能於特定時段、地點購買，並不得於街上恣意飲用，引發入場觀賽球迷不滿；住宿部分則嚴格禁止同性間的性行為，部分飯店因此限制同性伴侶同房入住。請問：
