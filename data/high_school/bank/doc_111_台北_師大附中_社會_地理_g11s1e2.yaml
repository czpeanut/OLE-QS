  stem: 請問長賜號事件排除後，新加坡到荷蘭鹿特丹最短路徑需依序經過哪三個重要的海峽？（2 分，全對給分）
  group_stem: '2021 年 3 月長賜號貨輪擱淺在某運河 7 天，導致讓全球供應鏈大亂、全球貨物貿易損失每小時約達 4 億美元（約新臺幣 114 億），石油和原物料等眾多貨物運輸受阻，也突顯現代商業模式對全球供應鏈的嚴重依賴。許多船隊若不繼續等待，就得考慮 140 年前的老方法：改道南非好望角。以新加坡到荷蘭鹿特丹為例，走此運河的路線全長約 8,288 海里、費時約 34 天，但走需繞經非洲南端好望角的路線，里程暴增且需耗費 49 天。請問：

    47.1870 年啟用至今超過 140 年，此運河在全球供應鏈地位屹立不搖，請問此運河名稱為何？（1 分）其連通哪兩處水域？（各 1 分，共 2 分）'
