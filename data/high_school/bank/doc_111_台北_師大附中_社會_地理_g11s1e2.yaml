    content: 副熱帶高壓北移
  - label: B
    content: 地形雨比例增加
  - label: C
    content: 西風帶提早南移
  - label: D
    content: 沿岸的暖流減弱
  group_stem: '2021 年 7 月的全球平均氣溫，是有紀錄以來第三熱的 7 月，也是歐洲史上第二熱的 7 月。而歐洲又以南歐的平均氣溫最高，西班牙首都馬德里出現攝氏 47 度的高溫，義大利的西西里島甚至以攝氏 48.8 度的溫度創下新高；至於緯度較高的波羅的海國家、北歐、俄羅斯等區域，也受到熱浪影響，部分地區氣溫飆升至攝氏 34 度，相較於往年的 7 月月均溫，高出約莫 10 度。

    此次的熱浪，主因來自於「高溫穹頂」的現象，因為陸地夏季在陽光照射下形成熱氣團，再加上氣壓影響使地表的熱空氣不易逸散，進而導致地面溫度不斷上升。熱浪除了帶來極高溫的天氣，也使得歐洲各地不斷出現野火災害，加上持續乾旱的天氣，增加了火勢控制的難度。芬蘭因而出現近 50 年來最嚴重的森林大火，土耳其、希臘、義大利等國家的野火焚燒面積也紛紛超過 10 萬公頃，鄰近地中海的北非國家阿爾及利亞，更因為野火延燒造成 65 人死亡。

    請問：'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)文中指出，高溫穹頂是因氣壓影響地表的熱空氣不易逸散，為高氣壓性質。
