  stem: 某國是目前非洲經濟成長率最快的國家之一。該國政府為了國內的產業發展，利用該國境內河水具有季節性流量差異，於 2008 年即著手興建 Gilgel Gibe Ⅲ水壩，2016 年完工後，獲得穩定水源並解決了該國長久電力短缺的困境，目前也正著手 Grand Ethiopian Renaissance 水壩工程，施工期長達 20 年，完工後將成為非洲最大的電力出口國，此舉卻引發了水壩下游埃及的抗議。這個國家最可能是下列何者？
