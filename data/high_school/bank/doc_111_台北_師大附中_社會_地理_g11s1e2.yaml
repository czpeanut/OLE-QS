  explanation: 文中提及下游國家為埃及，埃及境內的河流為尼羅河，(C)奈及利亞、(D)阿爾及利亞並非位於尼羅河流域。此外，文中第一行提及此國為「非洲經濟成長率最快的國家之一」，可將(A)南蘇丹刪除，故正確答案為(B)。
