  stem: 伊斯蘭教創始於西元 7 世紀，年代雖較各宗教晚，卻能在短時間內吸引大批信徒，至今人數已超過 21 億。該宗教之所以能吸引大批信徒的原因是：(甲)用阿拉伯文寫成的《古蘭經》，促進伊斯蘭世界的團結和統一(乙)強調階級制度，階級劃分清楚，有利於社會安定(丙)教義簡明，強調在日常生活中的實踐(丁)盛行於乾燥氣候區，環境特徵相似，利於傳教(戊)禁止一切偶像崇拜。請問上述正確的有哪些？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙戊
  - label: C
    content: 乙丙戊
  - label: D
    content: 丙丁戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)《古蘭經》是由阿拉伯文寫成，但並無促成伊斯蘭世界的團結和統一，目前有兩大教派；(乙)並無區分階級；(丙)(丁)(戊)皆與伊斯蘭教義和盛行區域相符。
