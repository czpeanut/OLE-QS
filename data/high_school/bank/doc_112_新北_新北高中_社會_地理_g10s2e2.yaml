  type: single
  page: 1
  stem: 在華勒斯坦的世界體系理論中，按照勞動分工狀況將世界各區域分為核心、半邊陲、邊陲區 3 大類，而這 3 種類型的區域也並非一成不變的發展下去，而會受到某些因素的影響而有了位階變化的狀況。請問邊陲區發展成為半邊陲區或甚至核心區之主要成因應為下列何者？
  options:
  - label: A
    content: 核心國投資邊陲區並引入技術
  - label: B
    content: 邊陲區的國家透過核心區的資金進行政治革命
  - label: C
    content: 核心區持續在邊陲區拓展貿易路線
  - label: D
    content: 邊陲區發展集約農業並增加勞動力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)核心區的主要產業特徵為高階技術及品牌服務。反之，邊陲區的主要產業特徵為低階加工製造。全球產業分工使得跨國企業將部分成熟製程的產線遷移至勞力便宜的區域，此即產生技術及資金從核心地區向外擴散效應，進而帶動邊陲或半邊陲地區的產業轉型及升級。
  tags:
    unit:
      code: GE-2-5-1
      book: 地理2
      chapter: 世界體系
      title: 核心與邊陲
      std: true
    textbook: 地理2 核心與邊陲
    labeled_by: agent
    label_confidence: high
