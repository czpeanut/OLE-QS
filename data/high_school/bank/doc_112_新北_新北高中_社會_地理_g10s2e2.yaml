  stem: 三角貿易體系造成了下列哪 <u>4 項</u>影響？(甲)甲區港埠型都市興起(乙)甲區文化趨向多元(丙)乙區飲食習慣改變(丁)甲區迅速累積資金(戊)乙區勞動人力流失(己)加深對丙區的偏見。
  group_stem: 15 世紀歐洲開啟大航海時代，建立歐、非、美的三角貿易體系，至今仍影響各地的經濟與社會發展。下圖為三角貿易示意圖，A ～ C 代表 3 種航程路線，甲～丙為 3 個不同地區。請問：
  shared_asset: g2_46_50
  answer:
  - (甲)(乙)(丙)(己)
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)拉丁美洲及非洲受殖民影響，因進出口貨品需求而開發港口地區，進而促使港口地區發展成當地現代化開發程度較高、人口密集的都市；(乙)拉丁美洲因此引進非洲勞動力及歐洲殖民，使得印第安原住民文化外，又混雜了非洲及歐洲的種族及文化；(丙)歐洲飲食因引進拉丁美洲農產品，如番茄、馬鈴薯、辣椒、玉米、可可等，進而使得歐洲飲食文化改變，甚至成為當今歐洲飲食的日常元素；(己)非洲勞動力被迫遷移至美洲從事低階勞動力工作，長期累積造成美洲當地黝黑皮膚的種族已然成為貧窮、犯罪的刻板印象。
