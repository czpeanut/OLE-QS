  explanation: (A)題中僅說明電池為電動車最重要的零件，而目前電池類型改為磷酸鐵鋰電池。由此無法推論電池原料為首要設廠區位。(B)題中說明電動車主要銷售市場為歐洲、美國及中國，無法由此推論美國為主要消費市場。(C)題中提及電池成本最高，除了提高電池品質外，更與鋰電池的中國生產製造商簽訂長約，此跨國分工的生產經營策略將降低電動車的電池製造成本。(D)電動汽車產業銷售量僅占全球 4 ％，可見此產品仍屬新創產品。故選(C)。
