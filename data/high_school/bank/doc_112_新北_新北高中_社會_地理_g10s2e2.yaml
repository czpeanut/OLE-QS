      - 410.75
      - 326.8
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '圖中微笑曲線的橫軸左側為研發、中間為製造、右側為品牌行銷。題幹中的「租賃＋服務」屬於品牌經營的行銷策略，故選(D)。

    19.10 公斤的甘蔗約可榨汁熬煮成 1 公斤的蔗糖，蔗糖廠考量甘蔗原料(D)失重率大的因素，多半選擇設廠在甘蔗產地附近，以減少原料的運輸成本。

    20.考量原料區位的產業包括：(甲)將新鮮原料製成得以長期保存的罐頭加工廠，廠址設於原料附近得以確保原料的新鮮，亦可減少冷凍冷藏運輸原料的成本；(丁)將體積龐大及重量沉重的礦石打碎成泥砂後將便利運送，為求減少礦石原料的運送成本，水泥廠多設於礦石產區。故選(A)。

    21.此為立體圖表判讀題：圖的左→右代表單位面積產量低→高；前→後代表經營規模小→大；下→上代表耕作精細程度的集約→粗放。依此判斷：(A)①的單位面積產量高、經營規模大、集約，以熱帶栽培業為代表，如咖啡、橡膠、油棕、可可等，巴西咖啡即屬於此類型農業。

    22.從圖中判斷，(D)④的單位面積產量低、經營規模大、粗放。以商業型穀物農業為代表，如小麥、玉米等。北美小麥帶即屬於此類型農業。

    23.從圖中判斷(B)②單位面積產量高、經營規模小、集約。以精緻農業（又稱園藝業）、綠洲農業、地中海型農業、傳統稻作農業等為代表。其中精緻農業多分布在都市市郊，符合題幹「經濟發達、人口密度高」的地區特徵。

    24.判讀三角圖的方式：穿越該點繪製與 3 邊平行的線段，解讀各線段與 3 邊軸線相交後的較小數值，3 邊軸的數值相加應為 100 ％。以(A)甲為例，第一級產業人口比例為 15 ％、第二級產業人口比例 15 ％、第三級產業人口比例 70 ％。為 4 個國家中第三級產業人口比例最高的國家，推論該地知識經濟發達、現代化發展程度及先進技術開發程度較高，最符合題幹所述歐美市場的特徵。

    25.根據題幹推論生產鏈縮短才能快速回應市場，代表產品的生命週期很短，(丙)廠房需要鄰近市場才能敏銳覺察市場變化，快速回應市場需求；未來工廠設址在歐美等已開發國家，代表該地勞動力成本高，需要透過(己)自動化的生產過程來(丁)降低產線的勞動力投入；而自動化的生產過程及回應市場需求的驅動下，產品生產製造將傾向降低批量生產數量，但(甲)產品樣式多樣化及客製化，以符合已開發國家市場變化快速的需求。故選(A)。

    26.從題目中所述「在草原上吃天然牧草」推論內蒙古的畜牧業為(B)放牧業。

    27.從題目中所述「建構調味品基地、肉業基地、物流配送中心和外銷機構的產業鏈」及「從牧場田間到餐桌」推論，此一企業採取了整合上游（畜牧）到下游（餐飲）的(C)垂直整合策略。

    28.從題目中所述「從毛豆採收→送廠」及「9 成外銷日本」推論，此毛豆採收後的流程為：產出→加工廠→市場。故選(D)丁。

    29.從題目中所述推論：(乙)從毛豆採收到包裝成本僅需要 3 小時，加工後的毛豆品質佳，深受日人青睞；(丁)透過農業科技管理栽種過程、資訊系統管理訂單，以及透過產銷履歷及規模經濟提高企業化經營成效。故選(C)。

    30.(D)圖中甲：新創期的產品，如電訊服務、生物技術，需要高端技術進行研發改進，其設址區位考量的多半是擁有完善資訊服務科技、人民平均教育程度較高的已開發國家都會區。

    31.1990 年代的個人電腦已屬於成熟期的產品，代表其產線製程已相當成熟，得以標準化複製到勞力成本較低的國家進行加工製造。2000 年左右的(C)中國對於外資開放投資已擁有相對完善的基礎建設，大城市的人民教育水準亦已逐步提升，但相對於日韓臺的勞力薪資仍較低，故許多個人電腦跨國企業的生產零件製造及加工組裝廠的區位選址，便開始移轉至中國一線、二線城市。

    32.乙、丙兩階段的產品主要屬於個人消費的非必需品，將以人民消費水準較高的地區為主要銷售市場。表格中(D) Y、Z 的二、三級產業比例最高，推論其人民從事工商業為主，對個人消費非必需產品的需求及潛力也會較高。

    33.香蕉、咖啡、油棕、可可等屬於熱帶栽培業，作物栽種採收後，為求延長保存期限及便利運輸，需要進行初級加工後才能銷售至海外市場。由此推論香蕉產業的生產流程為(C)。

    34.(A)前 4 大跨國企業中有 3 家來自美國，美國對香蕉產業的影響力最大。(B)前 4 大跨國企業皆屬於已開發國家，屬於全球產業分工的核心國家，其合併使得邊陲國家更加受到核心國家的支配，在香蕉產業利潤不平等的架構下，其與核心國家的經濟發展差距將更為巨大。(C)中南美洲為香蕉產地，零售商多位於全球其他市場。(D)企業合併將擴大經濟規模，進而帶來成本下降、獲利提升之效。故選(D)。

    35.題中指出人員、商品、資金「合併 vs.分開」管理的差異，說明現代物流及零售業透過(D)「專業分工」各司其職，提升行銷與物流的成效。

    36.(丁)銷售時點情報系統可將零售業即時的銷售情況記錄並回報各倉儲據點，再透過(丙)自動化的倉儲系統，讓物流依據資訊化訂單的管理或即時銷售的回報狀況進行彈性配送。此將符合現代零售業的需求，也能降低傳統耗時且耗損量高的倉儲成本。故選(D)。

    37.圖中指出創新後的零售業將能集中資金拓展營業據點，此將可能提升銷售額而達到(B)營業規模的經濟效益。

    38.甲：古巴（以出口糖、菸草著稱）；乙：澳大利亞（以出口礦產及畜牧產品著稱）；丙：墨西哥（以出口石油及工業加工製品著稱）；丁：日本（以進口原物料、出口高階工業製品著稱）。其中(D)丁：日本，擁有高階工業技術及享譽國際的跨國企業品牌，符合世界體系中核心國家定義。

    39.丙：墨西哥，受到北美國家的資金及技術移轉投資，逐漸從初級產業轉型至勞力密集型的現代加工業，符合世界體系中(C)半邊陲國家定義。

    40.(乙)日本鄰近的亞洲國家擁有豐沛原物料及便宜的勞動力，日本跨國企業透過區位擴散的產業分工，直接於這些國家設廠投資，以降低成本來提升獲利；(丙)日本在 20 世紀時透過武力殖民鄰近國家以獲取許多原物料，運送回日本進行加工後售出，快速累積其工業製造能力及財力。二戰後又獲美國援助及製造韓戰軍需物資的機會，成為亞洲工業發展最早且實力堅強的已開發國家。故選(B)。'
