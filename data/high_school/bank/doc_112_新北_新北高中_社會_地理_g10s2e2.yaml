  answer_status: verified
  answer_source: answer_key
  explanation: (A)臺北市原為北臺灣的都市核心區，因交通與經濟發展促使聚落及商業活動向臺北市外圍行政區擴張，進而使得北部都會區範圍擴大，成為與臺北市相連的新北、基隆、桃園都會區。
