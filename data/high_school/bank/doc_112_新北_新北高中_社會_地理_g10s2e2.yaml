  - label: D
    content: 混合農業
  group_stem: '小肥羊曾是中國本土餐飲業的老大，構建了擁有調味品基地、肉業基地、物流配送中心和外銷機構的產業鏈，搭建起從牧場田間到餐桌的食品安全保障體系，號稱將內蒙古大草原，在草原上吃天然牧草、喝礦物山泉的小羊送上饕客餐桌。2012 年小肥羊被百勝餐飲集團收購，成為旗下餐飲品牌。

    百勝餐飲集團總部位於美國肯塔基州路易斯維爾，旗下擁有以肯德基、必勝客等為主力的多個餐飲連鎖品牌，在超過 130 個國家和地區擁有近 40,000 間餐廳。但小肥羊原創團隊隨著收購發生後的體系和管理風格的變化，因不適應或其他原因頻頻離去，而百勝餐飲集團管理團隊忙於系統對接、整合、標準化、品牌升級等方面時，中國的火鍋業新形式和新品牌如雨後春筍般冒出來，曾風光無限的「中華火鍋第一股」小肥羊，開始走了下坡路。

    請問：'
