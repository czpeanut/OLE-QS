  stem: 「今日，全球已售出超過 1,200 萬輛電動汽車，但只占全球汽車銷售量的 4 ％，其中有 9 成集中在中國、歐洲與美國 3 個地區。電池是電動車最重要的零件，同時也是成本最高的零件，目前大約占整輛車成本 30 ～ 40 ％不等。2020 年特斯拉首先開發出充滿一次電可續航 640 公里的電動車，因而取得市場銷售的領先地位，占當年全美電動車銷售量近 8 成。2021 年 10 月特斯拉又宣布旗下的所有標準車款，都將改用成本更低、壽命更長的磷酸鐵鋰電池，並且已與全球最大鋰離子電池供應商中國寧德時代簽訂長約。鋰離子電池是目前效能及耐用度最佳的電池，所以現行市售純電車輛搭載的電池仍以鋰離子電池為主。」根據上文選出正確的敘述
  options:
  - label: A
    content: 電動汽車產業首要的設廠區位條件是電池原料
  - label: B
