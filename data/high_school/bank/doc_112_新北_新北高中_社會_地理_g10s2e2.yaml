  stem: 臺北市透過交通捷運系統、大眾通訊傳播媒體、經濟發展建設等，都會區的範圍已擴大到新北市，甚至延伸至桃園市，此現象是地區之間的哪一項交互關係？
  options:
  - label: A
    content: 核心區的擴散作用
  - label: B
    content: 邊陲區的反吸作用
  - label: C
    content: 核心區的反吸作用
  - label: D
    content: 邊陲區的擴散作用
  answer:
