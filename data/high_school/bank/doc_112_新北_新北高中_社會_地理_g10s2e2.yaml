- id: doc_112_新北_新北高中_社會_地理_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 《科技新報》報導：「這 1604 的日期代碼，代表這小晶片剛在 9 星期前才嵌到主機板、離開組裝廠進而變成我們手上的電話。」這代表著 iPhone SE 由處理器到出貨的生產周期僅為 9 星期，其中關鍵在於蘋果公司很早就採用「甲」生產方式來管理庫存，無論是部件和組裝，都是在庫存短缺時才立刻生產。故在「甲」的生產模式下，除非是蘋果公司訂定一個不合現實的銷售計畫，否則該公司很難積壓過多的庫存。請問「甲」生產模式為下列何者？
  options:
  - label: A
    content: 產業升級
  - label: B
    content: 水平分工
  - label: C
    content: 垂直整合
  - label: D
    content: 即時生產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 在交通革新、產線全球專業分工的全球化生產趨勢下，各零件廠商得以設廠在最能減少生產成本或提高獲利的地區，並且在接獲訂單後再同時啟動各零件廠進行生產及組裝，不僅可以提高生產效能（短時間內大量生產），還可以減少各產線因大量生產而延伸的庫存壓力（現金大量投入生產卻無法快速售出產品變現獲利，經常造成企業經營時的現金週轉壓力）。此即為豐田企業所創發的(D)「即時生產」（just in time）生產模式的主要概念，符合題幹中「無論是部件和組裝，都是在庫存短缺時才立刻生產」的說明。
  tags:
    unit:
      code: GE-2-4-1
      book: 地理2
      chapter: 產業
      title: 初級原料與加工製造產業
      std: true
