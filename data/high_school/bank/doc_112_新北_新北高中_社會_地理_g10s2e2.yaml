  - label: D
    content: 乙、行銷部門
  group_stem: 愛普生（EPSON）從 2008 年金融風暴後即開始轉型，其社長碓井稔把重心放在顧客的需求，認為產品開發要因應環境作改變。而近年許多辦公室興起「以租代買」的趨勢，故愛普生也開啟了另外一種商業模式，一方面透過印表機的租賃穩定收入；另一方面則透過額外的服務及維修來增加產品的附加價值。請問：
  assets:
  - key: s1_18_f1
    kind: figure
    file: doc_112_新北_新北高中_社會_地理_g10s2e2/s1_18_f1.png
    crop:
