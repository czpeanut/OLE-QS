  stem: 求出序組（b，c，d）。（6 分）
  group_stem: 已知多項式函數 f（x）＝$x^{3}$＋$bx^{2}$＋cx＋d 滿足 f(1)＝f(2)＝3 且 f（－1）＝－3，請作答下列(1)～(4)題：
  explanation: 由 $f(1)=f(2)=3$ 可設 $f(x) = (x-1)(x-2)(x-k) + 3$。代入 $f(-1) = -3$ 得 $(-2)(-3)(-1-k)+3 = -3 \Rightarrow -6(1+k) = -6 \Rightarrow k=0$。展開得 $f(x) = x(x-1)(x-2)+3 = x^3 - 3x^2 + 2x + 3$，故 $(b, c, d) = (-3, 2, 3)$。
  tags:
