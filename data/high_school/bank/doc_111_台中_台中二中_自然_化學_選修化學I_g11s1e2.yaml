  stem: 亨利定律，是由威廉．亨利所發現的一個氣體的定律。這個式子説明在常溫下且密閉的容器中，溶於某溶劑的某氣體之體積莫耳濃度（S），會正好與此溶液達成平衡的氣體分壓（P）成正比，常以S＝kP來描述。有關於此定律的描述，下列哪些是正確的？
  options:
  - label: A
    content: 在定溫時，混合氣體中每一難溶性氣體的溶解度與該氣體分壓成正比
  - label: B
    content: 亨利定律適用於某一氣體於高壓低溫的外在條件
  - label: C
    content: 亨利定律S＝kP中，k為亨利常數，其值隨溫度升高而降低
  - label: D
    content: S＝kP中的k值與溶劑的量有關，溶劑量愈多k值愈大
  - label: E
    content: S＝kP中的k值和氣體的分壓P無關
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
