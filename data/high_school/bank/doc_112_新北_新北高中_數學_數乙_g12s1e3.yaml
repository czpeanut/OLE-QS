  stem: '下列選項哪些是 f（x）＝$3x^{2}$－1 的反導函數？（多選）

    $答$：＿＿＿＿。'
  options:
  - label: A
    content: 6x
  - label: B
    content: $x^{3}$－x＋5
  - label: C
    content: －$x^{3}$＋x－1
  - label: D
    content: $x^{3}$－x－3
  - label: E
    content: 6x＋2
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int (3x^{2}-1)dx$＝$x^{3}$－x＋C，其中 C 為任意常數

    故選(B)(D)'
- id: doc_112_新北_新北高中_數學_數乙_g12s1e3_s1_2
  section: 1
  number: 2
  type: fill
  page: 1
  stem: '試計算下列不定積分及定積分。

    (1)$\int 3x^{2} dx$＝＿＿＿＿。

    (2)$\int (20x^{3}-16x+3) dx$＝＿＿＿＿。

    (3)$\int_{0}^{2} (6x-1)dx$＝＿＿＿＿。

    (4)$\int_{-2}^{2} 6x dx$＝＿＿＿＿。

    (5)$\int_{-2}^{4} | x-2 | dx$＝＿＿＿＿。'
  explanation: '(1)$\int 3x^{2} dx$＝$x^{3}$＋C，其中 C 為任意常數

    (2)$\int (20x^{3}-16x+3)dx$＝$5x^{4}$－$8x^{2}$＋3x＋C，其中 C 為任意常數

    (3)$\int_{0}^{2} (6x-1)dx$＝$\left. (3x^{2}-x) \right| _{0}^{2}$＝（12－2）－（0－0）＝10

    (4)$\int_{-2}^{2} 6x dx$＝$\left. 3x^{2} \right| _{-2}^{2}$＝12－12＝0

    (5)$\int_{-2}^{4} | x-2 | dx$＝$\int_{-2}^{2} (-x+2)dx$＋$\int_{2}^{4} (x-2)dx$＝$\left. \left( -\frac{1}{2}x^{2}+2x \right) \right| _{-2}^{2}$＋$\left. \left( \frac{1}{2}x^{2}-2x \right) \right| _{2}^{4}$

    ＝（－2＋4）－（－2－4）＋（8－8）－（2－4）

    ＝8＋2＝10'
- id: doc_112_新北_新北高中_數學_數乙_g12s1e3_s1_3
  section: 1
  number: 3
  type: fill
  page: 1
  stem: 已知 f（x）＝$\begin{cases}-x+2 , x \leq 1 \\ 1 , x >1\end{cases}$，且 b＞1，試求定積分$\int_{0}^{b} f(x)dx$＝＿＿＿＿。
  answer:
  - $b+\frac{1}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{0}^{b} f(x)dx$＝$\int_{0}^{1} (-x+2)dx$＋$\int_{1}^{b} 1 dx$

    ＝$\left. \left( -\frac{1}{2}x^{2}+2x \right) \right| _{0}^{1}$＋$\left. x \right| _{1}^{b}$

    ＝$\left( -\frac{1}{2}+2 \right) -0$＋（b－1）＝b＋$\frac{1}{2}$'
