  stem: 設 a＜－2，如右圖為二次函數 y＝（x＋2）（x－a）的圖形，且 A 區域與 B 區域的面積相等，試求 a 值為＿＿＿＿。
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_112_新北_新北高中_數學_數乙_g12s1e3/s1_8_f1.png
    crop:
