- id: doc_112_新北_新北高中_數學_數乙_g12s1e3_s1_5
  section: 1
  number: 5
  type: fill
  page: 1
  stem: 設多項式函數 F（x）為函數 f（x）＝$3x^{2}$－2x＋1 的一個反導函數，且 F(2)＝2，試求 F(0)＝＿＿＿＿。
  answer:
  - －4
  answer_status: verified
  answer_source: answer_key
  explanation: 'F（x）＝$\int (3x^{2}-2x+1)dx$＝$x^{3}$－$x^{2}$＋x＋C，其中 C 為常數

    ∵F(2)＝8－4＋2＋C＝2 ⇒ C＝－4

    ∴F（x）＝$x^{3}$－$x^{2}$＋x－4

    故 F(0)＝－4'
- id: doc_112_新北_新北高中_數學_數乙_g12s1e3_s1_6
  section: 1
  number: 6
  type: fill
  page: 1
  stem: 已知 f（x）是偶函數，且$\int_{0}^{3} f(x)dx$＝5，試求$\int_{-3}^{3} f(x)dx$的值為＿＿＿＿。
  answer:
  - '10'
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）是偶函數 ∴f（x）的圖形對稱於 y 軸

    由此可得$\int_{-3}^{0} f(x)dx$＝$\int_{0}^{3} f(x)dx$

    故$\int_{-3}^{3} f(x)dx$＝$\int_{-3}^{0} f(x)dx$＋$\int_{0}^{3} f(x)dx$＝$\int_{0}^{3} f(x)dx$＋$\int_{0}^{3} f(x)dx$

    ＝5＋5＝10'
- id: doc_112_新北_新北高中_數學_數乙_g12s1e3_s1_7
  section: 1
  number: 7
  type: fill
  page: 1
  stem: 設二次函數 y＝f（x）的圖形在點 P（x，y）處的切線斜率為 3x，且此函數過點（0，1），試求此函數為＿＿＿＿。
  answer:
  - y＝$\frac{3}{2}x^{2}+1$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵y＝f（x）的圖形在 P（x，y）處的切線斜率為 3x

    ∴f''（x）＝3x ⇒ f（x）＝$\int 3x dx$＝$\frac{3}{2}x^{2}+C$，其中 C 為常數

    又∵此函數過點（0，1） ∴f(0)＝C＝1

    故 y＝f（x）＝$\frac{3}{2}x^{2}+1$'
