      - 801.45
  answer:
  - －6
  answer_status: verified
  answer_source: answer_key
  explanation: '令（x＋2）（x－a）＝$x^{2}$＋（2－a）x－2a＝0，得 x＝－2 或 a

    故知此二次函數的圖形與 x 軸交於點（a，0）與（－2，0）

    ∵A 區域與 B 區域的面積相等

    ∴$\int_{a}^{-2} (x^{2}+(2-a)x-2a)dx$＋$\int_{-2}^{0} (x^{2}+(2-a)x-2a)dx$＝0

    ⇒$\left. \left( \frac{1}{3}x^{3}+\frac{2-a}{2}\times x^{2}-2ax \right) \right| _{a}^{-2}$＋$\left. \left( \frac{1}{3}x^{3}+\frac{2-a}{2}\times x^{2}-2ax \right) \right| _{-2}^{0}$＝0

    ⇒$\frac{1}{3}a^{3}$＋$\frac{2-a}{2}$×$a^{2}$－$2a^{2}$＝0

    整理得 $2a^{3}$＋3（2－a）$a^{2}$－$12a^{2}$＝0 ⇒ $a^{3}$＋$6a^{2}$＝0 ⇒ $a^{2}$（a＋6）＝0 ⇒ a＝0 或－6

    但 a＜－2，故 a＝－6'
