  stem: 下列是唐人論及同一事的三段資料，選出<u>正確</u>的敘述： 資料一：盡道隋亡為此河，至今千里賴通波。若無水殿龍舟事，共禹論功不較多。 資料二：公家運漕，私行商旅，舳艫相繼。隋氏作之雖勞，後代實受其利焉。 資料三：在隋之民，不勝其害也；在唐之民，不勝其利也。
  options:
  - label: A
    content: 此河指黃河。黃河時常決口、改道，淹沒田宅，隋文帝整治之後，有利航運
  - label: B
    content: 有人認為此河千里通波，方便統治者搜刮各地貨物，造成人民負擔。這三段資料也可以說明這點
  - label: C
    content: 三段資料含義相同，都指出前代人民的辛勞痛苦，後代人民卻可以享受成果
  - label: D
    content: 資料二、三的含義是「有害於一時，而利於千百載」，但資料一無此含義
