    資料一：青雲亭是馬來西亞最古老的華人廟宇，始建於15世紀，位於該國馬六甲Tokong街25號，數百年來除了負起祭祀和鄉誼作用外，同時是華人社區的法院、仲裁機構，青雲亭的擴充工作多由荷蘭統治下最高華人代表負責任，英國人廢除該制後，青雲亭亭主仍充當同類角色，直到1911年為止。 資料二：這座古廟是五百多年前中國和馬來西亞兩國人來往的見證。1405年，明朝太監奉旨率船隊出使西洋，曾經到過三寶壟（印尼爪哇島北岸的城市），以瓷器、絲綢、金銀和銅鐵器換取當地特產，與印尼人開展貿易。後來，廣大華僑以及當地人民為了紀念此事，在相傳當年他率領船員登岸的地方，建造了一座三寶廟。'
