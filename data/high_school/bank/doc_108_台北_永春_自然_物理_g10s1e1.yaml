  stem: 甲、乙、丙、丁四位學生上過物理課之後，分別對於摩擦後的氣球可以吸引紙片的現象提出各自的論點。 甲生：手持抹布摩擦氣球後，氣球可能從抹布上獲得電子而具有電性。
    乙生：摩擦前的氣球不會吸引紙片，是因為組成氣球的原子或分子沒有電荷。 丙生：摩擦後的氣球一定要接觸到紙片，氣球才會吸引紙片。 丁生：帶電的氣球可使小紙片靠近氣球端感應出正電、遠離氣球端感應出負電，紙片正電端與氣球負電的吸引力較負電端與氣球負電的排斥力大，故氣球能吸引紙片。
    請問哪些學生的論點較為正確？
  options:
  - label: A
