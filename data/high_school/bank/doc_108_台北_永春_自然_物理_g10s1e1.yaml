  stem: 有一估計原子核大小的方式為：將一個α粒子自離金箔甚遠的地方朝著金的原子核前進，如圖所示。在靠近的過程中，將因兩者間的作用力，使得原本一開始α粒子所具有的動能逐漸轉換為位能；當兩者有最接近的距離時，則意味著一開始的動能全部都轉換成位能。之後，也因著兩者間力的作用，使得α粒子沿反方向回去。當回到原起初位置時，又恢復成原有的動能，此方式的原理是根據力學能守恆。
    在以上的敘述中，使得α粒子在接近與遠離原子核時，速率先變慢再變快，這樣的作用力，應為下列何者？
