  stem: 1950 年，一位美國總統在國會報告最新的東亞情勢說：「共產主義者在韓國所作所為，就如希特勒、墨索里尼和日本在 10 年、15 年和 20 年前所做的一樣。我敢肯定，假如讓南韓淪陷，共產黨的領袖便會變本加厲，進而攻擊我們鄰近的國家。」這位總統在演講之後隨即採取了哪一種亞洲政策？
  options:
  - label: A
    content: 視共產中國為大國而採取強硬的圍堵政策
  - label: B
    content: 不待聯合國的安理會表決即斷然出兵南韓
  - label: C
    content: 援助並借重臺灣國民黨軍隊協助南韓反攻
  - label: D
    content: 為避免骨牌效應而開始軍援南越對抗共黨
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 這位美國總統為杜魯門，在韓戰爆發後即建立東亞集體安全體系加以圍堵，派遣第七艦隊協防臺灣海峽以維持「臺海中立化」，(A)為正解。(B)以聯合國名義帶領聯軍出兵南韓。(C)臺灣並未出動軍隊協助韓戰。(D)此時南越仍為法國占領，美國並未派軍參與法越戰爭。
