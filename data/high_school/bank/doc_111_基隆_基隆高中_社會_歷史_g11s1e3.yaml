  stem: 史家分析某一帝國特色：對統治地區採取直接統治，設立帝國行政機構，建立天主教堂，開發農場與礦產，主要的範圍在中美洲到南美洲，控制與歐洲的貿易往來。這個帝國最可能是
  options:
