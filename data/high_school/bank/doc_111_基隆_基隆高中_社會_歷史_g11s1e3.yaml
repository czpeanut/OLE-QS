- id: doc_111_基隆_基隆高中_社會_歷史_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 古巴飛彈危機後，美蘇雙方體驗到核子戰爭一觸即發的危險性，有意尋求溝通與諒解，因此使得 1960 年代國際局勢轉向什麼局面？
  options:
  - label: A
    content: 以合作代替對抗
  - label: B
    content: 以武力對抗的局面
  - label: C
    content: 瘋狂軍備競賽局面
  - label: D
    content: 低盪的緩和局面
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '古巴飛彈危機後，美、蘇雙方建立「熱線」作為談判機制，並展開戰略武器限制談判，使冷戰情勢趨於緩和，故又稱為「低盪」時期，(D)為正解。

    7.1500 年即前往亞洲海域貿易的甲國應為葡萄牙，1600 年後快速稱霸海域的乙國應為荷蘭，於 17 世紀後期快速崛起的丙國應為英國，因此答案為(A)。

    8.四則資料為 17 世紀英國所頒布的《航海法》規定，限制外國船隻進入英國及其殖民地貿易、卸貨，顯見是對英國本土產業的保護，答案為(C)。(A)此時為舊帝國主義的時期。(B)英國直到 19 世紀才建立日不落帝國的地位。(D)此時尚未工業革命，應是商業資本主義。

    9.法國、荷蘭的殖民地採用武裝革命的方式獨立，(A)為正解。(B)(C)英國、美國的殖民地採用和平談判方式獨立。(D)日本為戰敗國，必須無條件放棄殖民地。

    10.(A)馬鈴薯等美洲物種被引進舊大陸地區，並未被消滅。(C)印第安人因為天花而使人數嚴重折損。(D)殖民者無法控制人口數量。

    11.題文所指讓美國精疲力竭的戰爭為越戰，(A)為正解。(B)四位總統為甘迺迪、詹森、尼克森和福特。(C)美國有最精良的武器，但不熟悉叢林戰。(D)美國國內掀起反越戰風潮。

    12.西班牙能輕而易舉打敗印加帝國的原因是武器的差距與馬匹的使用，因此(A)文明的發展是兩者最大的差異。

    13.從題文可以看出此人對歐洲的船堅砲利非常自豪，甚至贊成向非歐洲地區擴張文明，可推知此時應為 19 世紀歐洲新帝國主義盛行時期，故(C)為正解。

    14.飛機空投的不是政治對立的文宣，而是糖果，因此最可能為柏林危機期間，西歐國家對被封鎖的西柏林空投食物來因應，(C)為正解。

    15.非洲西岸能出口到中南美洲的商品，主要是(D)黑奴。(A)為東南亞、中南美洲的出口商品。(B)(C)雖然亦為非洲商品，但主要輸往歐洲，非中南美洲。

    16.(A)韓戰爆發後，美國派遣第七艦隊協防臺灣海峽，同時恢復對中華民國的經濟援助，使國民黨政府可以在臺灣穩定局勢，因此可說是救了國民黨政府的重要事件。

    17.明中葉約為 16 世紀時，正值西方國家(C)地理大發現往東方發展時期，因此海外白銀大量輸入中國，影響中國的貨幣與賦役制度。

    18.從「有人提倡移往巴勒斯坦，希望建立自己的國家」一句，即可推知這個民族應是(A)猶太人，自從公元前 6 世紀亡國後，猶太人即追求能在「應許之地」巴勒斯坦重新復國的機會。

    19.(A)上古時代已有奴隸貿易，非自地理大發現才開始。(B)部分黑奴為與土著酋長或國王合作取得。(D)由於獲利頗豐，後來荷蘭、英國、法國等國也競相投入奴隸貿易。

    20.選項中僅(C)緬甸為英國的殖民地，且與中國相鄰。

    21.(A)汽船為美國人富爾頓發明，並非英國人的工業革命成就。(B)全動式機槍、電報線、汽船等皆與啟蒙運動無直接關係。(C)三項展覽品僅汽船與蒸汽機有關。

    22.此人降低國際間劍拔弩張的態勢，並使許多歐洲國家「重獲自由」，應與東歐民主化有關，故為(A)戈巴契夫，但從該國政治人物感嘆「可惜不是得經濟獎」來看，戈巴契夫所推動的改革開放政策並無法改善蘇聯的經濟。

    23.19 世紀以前，歐洲人對撒哈拉沙漠以南的非洲大陸所知甚少，加上顧忌當地的熱帶氣候和受到地形、疾病的阻隔，無法深入內陸。19 世紀後，治療瘧疾的藥物奎寧問世後，帶動前往非洲探險的風潮，(D)為正解。

    24.為了打擊蘇聯共產主義的擴張，美國利用地緣環境採取(D)圍堵政策，在東亞、東南亞、西亞與歐洲聯合民主國家建立軍事防禦體系。

    25.19 世紀已有倡議非洲民族主義與非洲獨立運動，但效果有限，直到二次大戰後才能快速發展，最主要的原因是歐洲殖民帝國經過兩次大戰的洗禮後，元氣大傷，已無法再有效掌控殖民地，(C)為正解。(A)未有此事。(B)非洲國家獨立後多成為第三世界成員。(D)許多殖民母國無法認同殖民地獨立的理念，因此不少殖民地採取武裝革命方式爭取獨立。

    26.南非於 1961 年建立共和國，白人政權為維護統治地位而實施(D)種族隔離政策，後在曼德拉長期致力反抗該項政策並推動族群平等，以及國際間經濟制裁的壓力下，終於在 1991 年得以廢止。

    27.從「居住於任何一個基督教國家的外國人，都受居住國法律約束」來看，可知此時歐洲國家有國際法觀念；從「基督徒在穆斯林國家居住，……不受當地法律制裁」一段，顯見歐洲國家的優越感，因此應為(C) 19 世紀歐洲列強在各地擴張之際的態度。

    28.(A)世界各國有關歷史的分期並沒有公認的標準。(B)歷史的分期與國家無關，主要是因史家的研究主題而設定。(D) 20 世紀後，大多數國家的曆法皆使用西曆，題文中的歷史分期與曆法實則無關。

    29.(C) 19 世紀後，英國挾工業革命的優勢往海外快速擴張，成為全球殖民地最多的「日不落國」，因此使英語人口大幅增加。

    30.(B)非裔美國人在南北戰爭後不久即獲得公民投票權。(C)禁止公共場所的隔離政策。(D)《聯邦憲法》裡已保障這些基本人權，《民權法案》是規定不得因種族、膚色、宗教和性別等因素而有所歧視。

    31.資料一為吉卜林的〈白種人的負擔〉詩句，資料二則為安置多餘人口與尋找新市場等，建議往外擴張領土，此兩者皆是鼓勵歐洲人向外侵略與擴張，即帝國主義思想，以工業革命發達的英國最為興盛，(C)為正解。

    32.從投票的人數來看，此地最主要的居民為黑人，白人與有色人種的人數遠不如黑人，因此該地不可能為美國，(A)(B)可刪除，(C) 1962 年的古巴為共產政權，不可能辦理選舉，因此答案為(D) 1995 年的南非大選，黑人首次能行使公民投票權。

    33.(D)馬來西亞、印度及巴基斯坦在 20 世紀中葉獨立之前，皆是英國的殖民地，因此交通規則與號誌等自然須遵循英國的管理。

    34.(D)「美洲國家組織」為美洲的區域統合組織，聯合國安全理事會屬於國際性組織，兩者皆不是分屬美、蘇兩大集團的組織。

    35.由於歐洲列強基於自身利益劃分疆界，不顧族群的分布狀況，使得非洲各國在獨立之後，立刻陷入種族與文化的紛爭，(B)族群衝突不斷。

    36.(A)這位作者應該是達爾文。(B)這本生物學著作為《物種起源》。(D)此種生物學的進化論，後來被建構成「社會達爾文主義」，並成為新帝國主義國家的理論基礎。

    37.圖中顯示該國的殖民地包括北美、從埃及到南非縱貫、印度、緬甸、馬來亞、澳大利亞與紐西蘭，因此這個殖民大國為號稱「日不落國」的(A)英國。

    38.從題文可以得知兩條線索：一是該國存在黑、白種族不平等問題；二是該國初建時的立國信條主張「人生而平等」。因此推測此一國家應是 18 世紀建國的美國，在〈獨立宣言〉裡即宣誓「人生而平等」，但黑人一直未獲得公允的對待，答案為(C)。(A)(D)立國時並無「人生而平等」的宣誓。(B)「民族自決」與國內的黑人民權問題無關。

    39.從「兩個民族對同一塊土地提出了排他性的主權要求是根本原因」一句，可知以阿衝突的最根本原因是(D)領土糾葛。

    40.(A)東西德於 1990 年才統一。(B)未有此事。(D)節能省碳活動約在 1997 年《京都議定書》後才大規模展開。'
