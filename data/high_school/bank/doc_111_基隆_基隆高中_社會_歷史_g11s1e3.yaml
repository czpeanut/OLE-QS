  stem: 《動物農莊》一書中，某則故事的描述如下：「一隻老豬在臨終前，召集農莊裡的動物，鼓動牠們革命顛覆農莊主人鍾斯先生，不再讓他繼續剝削牠們的勞力所得。果真一下子牠們合力將鍾斯先生一家及他的員工全部都趕走了。但是這些動物立即又再落入另一個困境裡，因為豬領導還是用類似前農莊主人鍾斯先生之管理方式對待牠們。」請問《動物農莊》的寓意是什麼？
  options:
  - label: A
    content: 瓦解對童話故事的想像
  - label: B
    content: 讚揚自由主義才能帶來的祥和
  - label: C
    content: 揭露共產主義的恐怖，是反共的代名詞
  - label: D
    content: 喚起大眾對於動物的關心
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《動物農莊》係以寓言故事方式來諷刺蘇聯的共產革命，老豬即是列寧，鼓動人民推翻暴君的統治後，實則人民生活依然陷入困境，甚至比之前更糟，(C)為正解。
