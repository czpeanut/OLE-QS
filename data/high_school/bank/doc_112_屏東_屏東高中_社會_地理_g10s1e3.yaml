  section: 1
  number: 29
  type: single
  page: 4
  stem: 研究指出：「相鄰兩河川如有海拔高低差異，較低海拔的低位河因向源侵蝕或側蝕，蝕穿分水嶺至較高海拔的高位河，將其河水引流過來，稱為搶水。高位河的下游因被搶水，流量大減，呈現谷大水小的狀態，又稱為『斷頭河』。」下圖為花蓮陶塞溪與其支流的古代與現代的河流路徑圖，圖中哪處河段現代最可能因搶水作用而沖蝕力大減？
  options:
