  answer_status: verified
  answer_source: answer_key
  explanation: '(1)先理解何謂斷頭河：高位河的下游因被搶水，流量大減，呈現谷大水小的狀態，推論斷頭河會因為流量減少而使沖蝕力大減，堆積作用增強。

    (2)古今地圖比對：甲在古代為西卡拉罕溪的下游河段，但在現代卻沒有與西卡拉罕溪上游相連，顯示其上游水源被搶走，判斷甲為斷頭河，故選(A)甲。

    (3)乙處古代和現代的景觀沒有改變，流量沒有變化。丙處在古代上游河段短，但在現代上游明顯增長，且成為西卡拉罕溪的下游，流量增加，推測應為低位的搶水河。丁在古代流向甲，現代流向丙，流向改變、但流量不變，不是斷頭河。'
