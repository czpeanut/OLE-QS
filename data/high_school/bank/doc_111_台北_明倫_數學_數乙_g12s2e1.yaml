- id: doc_111_台北_明倫_數學_數乙_g12s2e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 在坐標平面上有一直線 L：3x－4y＝5，試選出正確的選項。
  options:
  - label: A
    content: 若點 P（a，b）在 L 右側，則 3a－4b＞5
  - label: B
    content: 若點 P（a，b）在 L 左側，則 3a－4b＞5
  - label: C
    content: 若點 P（a，b）在 L 上方，則 3a－4b＞5
  - label: D
    content: 點（14，10）在 L 右側
  - label: E
    content: 點（14，10）在 L 上方
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○

    (B)╳：若點 P（a，b）在 L 左側，則 3a－4b＜5

    (C)╳：若點 P（a，b）在 L 上方，則 3a－4b＜5

    (D)╳：∵3×14－4×10＜5 ∴點（14，10）在 L 左側

    (E)○：∵3×14－4×10＜5 ∴點（14，10）在 L 上方

    故選(A)(E)'
