  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 平面上一直線 L：2x－y＝3 將平面分成兩側，已知一點 P（－1，4），試問下列哪些點與 P 點在直線 L 的同側？
  options:
  - label: A
    content: （0，0）
  - label: B
    content: （1，－3）
  - label: C
    content: （2，1）
  - label: D
    content: （－2，0）
  - label: E
    content: （0，1）
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵2×（－1）－4＜3 ∴可知點 P（－1，4）在直線 L 的左側

    (A)○：∵2×0－0＜3 ∴點（0，0）在直線 L 的左側

    (B)╳：∵2×1－（－3）＞3 ∴點（1，－3）在直線 L 的右側

    (C)╳：∵2×2－1＝3 ∴點（2，1）在直線 L 上

    (D)○：∵2×（－2）－0＜3 ∴點（－2，0）在直線 L 的左側

    (E)○：∵2×0－1＜3 ∴點（0，1）在直線 L 的左側

    故選(A)(D)(E)'
