  - label: A
    content: 檳榔嶼：華人→馬來半島
  - label: B
    content: 頭城：漳泉漢人→蘭陽平原
  - label: C
    content: 普利茅斯：英國人→北美
  - label: D
    content: 聖保羅：葡萄牙人→南美東岸
