  stem: 武則天是中國歷史上唯一改朝換代並正式稱帝的皇后，她曾受到後代許多的批評，但在位期間仍有一定的治績。請問下列哪一項措施是武則天在位期間曾經實行或推動的？
  options:
  - label: A
    content: 廢除九品官人法、改行科舉，並澄清吏治
  - label: B
