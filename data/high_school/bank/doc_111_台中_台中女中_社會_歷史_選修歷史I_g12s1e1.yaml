  stem: 加拿大的真相和解委員會提出一份報告，針對自 1870 年代以來政府開設的某類型寄宿學校提出說明。當年，政府以融入社會為名，強迫許多原住民兒童與家人分開，住進寄宿學校，接受教會的訓練與教導，這類學校至 1990 年代才完全關閉。一支名為「不坐視不管」的抗議組織呼籲除政府外，教宗必須代表天主教會向受害者致歉。以上事例主要反映
  options:
  - label: A
    content: 殖民統治使原住民接受現代知識
  - label: B
    content: 同化政策使原住民出現文化斷層
  - label: C
    content: 武力鎮壓使原住民數量大幅減少
  - label: D
    content: 經濟掠奪使原住民生活出現困頓
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從本題的敘述中可得知，這份由加拿大真相和解委員會所提出的報告，是針對過去加國政府於 19 世紀同化主義的政策下，對原住民族傳統文化與教育造成的破壞與斷層，進行反思與轉型正義的工作。強制原住民族兒童就讀寄宿學校、接受教會的教育等措施，皆為典型同化主義下對原住民進行的文化改造，也使原住民族出現文化斷層的現象。(A)從題幹敘述可得知此非典型的殖民統治，也並非批判使原住民接受現代知識。(C)(D)題文內容沒有提到「武力鎮壓」與「經濟掠奪」等相關敘述。
