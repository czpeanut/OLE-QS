  answer_status: verified
  answer_source: answer_key
  explanation: 普利茅斯（Plymouth）原為英格蘭西南處的一座城市，1620 年一群清教徒為逃離英國的宗教迫害，搭乘五月花號航行至今美國麻薩諸塞州東南方上岸，並於當地建立新城鎮，即命名為普利茅斯殖民地（Plymouth Colony）。(A)檳榔嶼為現在的檳城，其得名自早期島上有許多檳榔樹。(B)頭城又名頭圍，因該地為漢人移民最早建立的據點而得名。(D)聖保羅得名自耶穌會傳教士於當地建立的聖保羅經院（Colégio de São Paulo de Piratininga）。
