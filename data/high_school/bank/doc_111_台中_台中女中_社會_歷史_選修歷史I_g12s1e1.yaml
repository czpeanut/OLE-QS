  stem: 長期以來，將北美洲的原住民族統稱為「印第安人」成為一種習慣用法，直至 1990 年代美國官方才正式將此名稱改為「原住民族」。根據你對世界歷史的認知，請問西方人將美洲原住民族長期稱為「印第安人」的背景及原因，與下列哪一項說明的關係最為密切？
  options:
  - label: A
    content: 原住民族各部落的社會結構與文化具有高度的共通點
  - label: B
    content: 各族群使用的語言相對較類似，普遍能用於彼此溝通
  - label: C
    content: 歐洲探險家與美國政府多繼續沿用哥倫布使用的統稱
  - label: D
    content: 各地區族群彼此形成認同意識，且未出現本身的族名
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「印第安人」這個名稱是源於哥倫布誤以為自己航行至印度，因此將美洲原住民稱為「印度人」（西語 indios），並為後續的殖民者所沿用。(A)(B)美洲原住民事實上有相當多不同的族群，各部落間於社會結構、文化與語言上也有相當大的差異。(D)各地原住民族群有其自身認同的族名，例如阿帕契、切羅基、夏安等。
