  stem: 關於「第三世界」的敘述，下列何者是正確的？
  options:
  - label: A
    content: 第三世界這一名詞，最初是因為二次大戰後，美、英、法、蘇分區占領德國，導致德國分崩離析，而開始有此說
  - label: B
    content: 第三世界在美蘇冷戰期間，多受兩強操縱而無法行使國家獨立主權，故而被稱為第三世界
  - label: C
    content: 1955 年在印尼萬隆舉行的「亞非會議」，被認為是第三世界團結、成功的會議
  - label: D
    content: 第三世界國家在國際上往往相互合作，並透過參加國際聯盟，迫使已開發國家給予支援
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「第三世界」的概念成形於冷戰時期，在自由與共產陣營對立的世界局勢下，部分亞、非洲國家希望獨立於兩陣營間，而採取不結盟運動的方針。1955 年在印尼召開的萬隆會議（第一次亞非會議），因其帶有去殖民、去帝國與反種族歧視的色彩，並呈現出成員國間的合作精神，因此被視為「第三世界」這條路線得以實現的重要關鍵，故答案選(C)。(D)遵循第三世界路線的國家，主要精神為透過彼此合作，而不受強勢國家的支配與影響，因此並未迫使已開發國家給予支援。
  tags:
    unit:
      code: HI-3-6-1
      book: 歷史3（世界史）
