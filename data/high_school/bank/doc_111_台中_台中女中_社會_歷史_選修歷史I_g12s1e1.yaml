- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 4
  stem: 根據《臺灣林氏族譜》所附的〈天上聖母經〉中記載：「文聖人，有○○；武聖人，有□□；女聖人，△△兒。」請問若依照順序排列則○○、□□、△△應分別為下列何者？
  options:
  - label: A
    content: 關公、孔子、觀音
  - label: B
    content: 孔子、岳飛、默娘
  - label: C
    content: 孔子、關公、默娘
  - label: D
    content: 岳飛、孔子、觀音
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '本題主要測驗學生對於臺灣傳統信仰的理解。〈天上聖母經〉本卷中記載：「文聖人，有孔子；武聖人，有關羽；女聖人，默娘兒。」傳統漢人社會中，認為文聖為創立儒家學說的孔子、武聖則是作為忠孝節義代表者的關羽，而媽祖信仰者將其地位與文武二聖相比，從中也可觀察到媽祖於民間信仰中地位的提升，故答案選(C)。

    22.16 世紀的「日不落國」，所指者為當時快速向海外擴張的西班牙帝國。「日不落國」一詞源於西班牙國王卡洛斯一世（即神聖羅馬帝國皇帝查理五世）的一段論述：「在我的領土上，太陽永不落下。」由此可知題目中的君主，確實同時擁有西班牙國王、神聖羅馬帝國皇帝的頭銜。(A)西班牙帝國的殖民範圍主要為中南美洲、西非與菲律賓。(C)擊退西班牙無敵艦隊者為英國。(D)西班牙帝國當時尚未進入工業化階段，因此被歸類於舊帝國主義。

    23.從題目這份根據 1907 年統計資料所製作的空間分布圖中，可觀察到空白的區域主要為當時原住民所活動的深山地帶至東臺灣。而西部平原、臺北至宜蘭地區則主要以三種不同圖例之色塊標註，由此可判斷此圖所呈現的資訊應為閩粵各族群的分布，故答案選(B)。(A)如若是稻作與甘蔗的分布，應會出現南北差異、中部混合種植的分布樣態。(C)瘧疾發生率的統計則應會包含東臺灣。(D)此圖並無法呈現都市化程度的分布。

    24.從引文中「應自內地大舉移民開發富源」的敘述，可判斷福澤諭吉所提出的見解，主要目的乃是希望透過移民以達到殖產興利的效果。從引文中並未見到關於北海道農業移民經驗、欲解決日本人口膨脹問題，或是想使臺灣成為日本帝國南進基地的論述，因此正確選項為(D)。

    25.1884 年隨著清廷與法軍談判破裂，法軍曾一度希望透過進占基隆煤礦、破壞福州馬尾造船廠等行動，迫使清廷和談。在此背景下，清廷派遣劉銘傳為「巡撫銜督辦臺灣軍務」，赴臺協防法軍進犯。而劉銘傳除了領導駐臺清軍整備岸防、穩定政局外，更與臺籍鄉紳豪族合作，如丘逢甲、板橋林家的林維源、霧峰林家的林朝棟等人，一同協防臺灣北部一帶的法軍攻擊。由此可判斷題目敘述中的外國軍官所參加的戰爭，應為 1884 年的中法戰爭，故答案選(D)。

    26.本題描述的情景，呈現臺灣社會在戰後逐步工業化後，農村勞動力大量轉入工廠，並開始加速都市化的景象。(A)日本殖民政府雖於 1930 年代推動臺灣的工業化，但規模並不大，勞動人口仍多從事於農業，且當時流行文化的傳播媒介以收音機為主，因此不符合題幹描述之景象。(B) 1950 年代推動的第一期經建計畫（1953 ～ 1956），主要目的為土地改革與鼓勵農業生產，尚未正式進入工業化社會。(D) 1990 年代推動的產業升級與經濟轉型，以高科技產業和服務型產業為主，與題幹敘述較不相符。

    27.表格中兩次戶口統計資料之間，已經歷「開港通商」和「開山撫番」兩項關鍵的政策，因此臺灣西部的人口應呈現向北移動的趨勢；而「開山撫番」政策執行後，清廷始於東臺灣設治，因此方會出現戶口統計資料。由此可確定甲為東部；乙由戶口最少地區躍升為戶口第二多的地區，因此可推定乙為北部；丙雖持續維持戶口最多的地區，但戶口呈現逐漸減少的趨勢，可知人口已出現向外流動的現象，因此可判斷丙為南部；丁則為中部。

    28.(甲)所指應為當代經歷原住民族復振運動後，透過《原住民族基本法》等法律，確立族群之間的平等關係；(乙)反映清代官方對原住民族的政策，透過接受治理、教育、納稅等方式，確立與原住民族之間的關係認定；(丙)為日治時期的原住民族政策，總督府在欲開發山林資源的動機下，推行「理蕃」以有效控制原住民；(丁)則為荷蘭聯合東印度公司的原住民族政策，荷蘭人透過任命部落首長、召開地方會議等方式，建立與部落之間的封建關係。因此正確順序為(C)(丁)(乙)(丙)(甲)。

    29.根據 1946 年修訂之《中華民國憲法》，國民大會做為全國最高權力機關，具有選舉正、副總統以及修改憲法之權力。因此當 1960 年欲修訂《動員戡亂時期臨時條款》時，該法做為《中華民國憲法》附屬條款，必須由國民大會負責修訂。

    30.從引文中可得知該份官文書中所頒布之政策，為推行軍隊自力開墾經營，而勿侵擾百姓；另由「本藩」（鄭成功為明朝異姓藩王）、「各鎮」（明朝中後期京外軍制「省鎮營兵制」）等關鍵字，可判斷此文書乃為鄭成功到臺灣後，為了解決軍民糧食問題所發布之文書。(B)清初駐臺官兵糧食由中國本土供給。(C)(D)沈葆楨、劉銘傳推動的新政並未包含軍屯。

    31.本題主要測驗學生對於日治時期與中華民國時期，臺灣民主運動的發展與威權體制特色的理解。此題的判斷關鍵為「主張總統制為真平等」以及「觸犯不敬罪」，若以前者判斷，選項(A)(C)(D)即為錯誤選項，因三個時期政府皆採「總統制」；而從「不敬罪」（日治時期《刑法典》中規範對於天皇不敬之相關罪刑，屬箝制人民自由權利之「政治刑法」）、「不及法定年齡而未被判刑」及題目圖片中警察與犯人的打扮，即可以判斷此題應指涉日治時期，故答案選(B)。

    32.從題目敘述中可判斷，由美國主導成立的「東南亞公約組織」，其主要目的乃為配合冷戰體制下，美國所採取的圍堵共產政策。若從時間點 1954 年、與動機為反共來判斷，當年中華民國被拒絕加入組織後，美國所採取的補救方式，最可能為同年度所簽署的《中美共同防禦條約》，因此正確選項為(A)。(B)(C)當時中華民國仍為聯合國會員，甚至是安理會常任理事國，因此美國沒必要以聯合國的相關承諾進行補救。(D)東南亞國協成立於 1967 年，且美國並無權力介入該組織。

    33.從題目敘述中可判斷，該廟宇自某時期開始多出現來自新莊、板橋的信眾，其反映著該廟宇所在地出身的人向新莊、板橋移居後，再回鄉捐獻的現象。新莊於乾隆、嘉慶年間曾因做為淡水港的內港，而繁榮一時。然自嘉慶中葉後，因河道淤積問題失去航運功能，因此其地位逐漸被艋舺所取代。日治末期，原位於臺北市內的工廠為了因應戰爭，疏散到周圍城鎮，帶動了新莊的工業發展，接續戰後政府陸續劃設工業區，吸引了大量的外地人口移入新莊。而板橋早期為林本源家族之根據地，為鄰近宗教、商業與文化中心。戰後做為臺北縣治所在，也因為工業相關產業的快速發展，而吸引大量中南部居民移入。因此最合理的選項為(D)。

    34.日治初期中國在臺僑民曾在總督府允許下，設立同鄉會組織，然因中華民國並無在臺官方機構，因此許多僑務問題無法解決。1920 年代，在臺華僑陸續向北洋政府、國民政府陳情，要求在臺設立領館，最後由黃朝琴出面協商，國民政府正式在 1930 年任命駐臺北領事，1931 年設立臺北領事館。由此判斷，選項(C)之描述，最符合當時之時空背景。(A)滿洲國為日本帝國發動九一八事變，並控制原中華民國東北地區後，所成立的傀儡政權，因此不可能邀請滿洲國官員來臺慶祝中華民國的國慶活動。(B)如前所述，當時日本與中華民國之間的關係已趨於緊張，因此臺灣總督府並不可能基於「關係親密和善」而辦理慶祝雙十活動。(D)皇民化政策於 1937 年中日戰爭爆發後才正式實施。

    35.從資料乙紀錄中可看到，鄭成功的船隊亦經營對日鹿皮貿易，此與荷蘭人經營的貿易項目相同，由此可證「鄭成功是荷蘭在亞洲貿易的競爭者」之說法成立，故答案選(D)。(A)從資料甲中可發現，鄭成功的船隊在 1655 年曾駛往荷蘭的殖民地巴達維亞進行貿易，由此可知鄭成功並未拒絕與荷蘭人進行貿易活動。(B)從二則資料中，並無法證明鄭成功獨占對日鹿皮貿易。(C)從二則資料中僅可發現鄭成功與荷蘭人進行貿易，並無法證明其與荷蘭合作經營南海貿易。

    36.本題之判斷關鍵為「其中有學識或從事公職者，對此稍覺不悅，因而不少人又再改成漢名」，由此可知，平埔族人使用漢人姓名的原因，主要是接受漢人教育者，受到漢文化的影響而改名，故答案選(B)。

    37.本題關鍵為「積極人民」，移民來臺目的以開墾為主，而水圳又為開發土地所必需，八堡圳是墾首施世榜為灌溉彰化平原籌款而設，並非政府建設，可作為「積極人民」的證據，故答案選(B)。(A)(D)設置土牛溝或是實行班兵制度皆為清代「消極政府」的印證。(C)撫墾局為劉銘傳於 1886 年設立。

    38.日治時期，為了解決清代以來臺灣社會土地與租稅制度的混亂，並強化政府稅收的機制，日本殖民政府自 1898 年起即開始進行全臺的土地調查事業，確認土地所有權後，總督府頒布「律令第六號」（律令可視為總督行政命令）宣告廢除已確認之大租權，並以補償金和公債補償被廢除的大租戶。(A)與本題脈絡無關。(B)減四留六法並未取消大租權。(D)三七五減租的目的為保障佃農權益，規定佃農向地主繳納地租的上限，且耕地租約在耕佃期限未屆滿前，地主不得無故收回耕地。

    39.本題是在測驗學生對於史料類型與運用的理解，其中「旅券」最能反映人的移動情形，而日治時期的戶口名簿、同鄉會名簿、人口與戶口調查等資料，則可顯示人群的籍貫、居地、族群類別等資訊，由此可判斷這些史料最可能用來研究人群的移動與交流，故答案選(A)。

    40.題目四個選項中，僅安平（早期的地名有一鯤鯓、二鯤鯓）、淡水（早期出海口側有地名為沙崙）兩地之早期地貌，符合題目中「海岸多沙丘、叢林散布」的描述。而十八世紀的淡水早已有許多漢人移民入墾，1724 年首任淡水同知王汧亦增建滬尾城，因此不符合題目敘述。十六世紀末至十七世紀初期，在現今的安平一帶，確實常有中國、日本商船前來交易，也因此荷蘭人於臺灣開啟殖民事業後，亦於赤崁一帶建立普羅民遮市街，以安置來臺貿易的漢人及日本人。由此可判斷，這份日記最可能是十七世紀荷蘭人探勘安平時所寫。故答案選(B)。

    41.題幹敘述中學者的主張，較接近近來史學界提倡之社會史、公眾史或是新文化史，此類研究者的研究目標，一改過去學界較著重於國家、政策、制度史上的研究，而以人民的日常生活、文化等為研究重點。因此較符合的選項為清代臺灣沿海的王爺信仰，故答案選(C)。

    42.由本題的統計圖中，可觀察到菱形圖例由 1940 年代接近 70 的數值，至 1990 年衰減至數值 10；而三角形圖例則由 1940 年僅不到 10 的數值，至 1970 年增長至數值 40 左右，便無大幅成長；而兩線的交叉時間點落於 1970 年代左右。由此可推斷本圖為反映臺灣人口職業結構的統計數據，三角形圖例線為工業就業人口、菱形圖例線為農業就業人口。1940 年代日本殖民政府雖已開始推動工業化，但並未對人口就業結構產生太大的影響，臺灣人的職業仍以農業為主；工業就業人口約於 1960 年代快速成長，並於 1970 年代超越農業就業人口，恰好符合臺灣經歷進口替代、出口擴張兩階段快速的工業化；而 1970 年代後工業就業人口成長停滯並維持水平、農業人口持續下探的原因，在於產業轉型後部分人口投入第三級產業。由此可判斷正確選項為(A)。

    43.臺灣史上首次出現具規模的漢人社會的時間點為荷治時期，當時荷蘭聯合東印度公司由於勞動力不足，在擴大經營規模時，必須招募漢人來臺協助開墾，因而在赤崁一帶出現漢人聚落。另外，米、糖經濟與轉口貿易皆為荷治時期之經貿特徵，因此正確選項為(A)。

    44.甲、吉野改成吉安，為日本移民村名稱改為中國式地名；乙、三民改為那瑪夏，為戰後黨國式地名改回原住民族傳統地名；丙、番社改為東山，為漢人移民取名之地名，改為地形意義之地名；丁、吳鳳改為阿里山，為戰後黨國式地名改回原住民族傳統地名；戊、紅毛改為新豐，為漢人移民取名之地名，改為漢式雅稱地名。由此可知，乙、丁的改名脈絡，最能反映尊重多元族群與文化之態度。

    45.1920 年代，臺灣社會因受到世界的民族自決風潮、以及日本大正民主風氣的影響，新知識分子開始透過各種媒介，引入西方知識、思想與文化，展開一系列「文化啟蒙運動」。而當時許多新潮的女性主義思想，亦隨之引入臺灣。從題幹敘述中即可判斷，此女性的作法乃因受到時代思潮的影響，開始追求、實踐解放女性性別框架的行動。正確選項為(C)。'
