  answer_status: verified
  answer_source: answer_key
  explanation: 武則天在位期間最重要的政策，即為透過增開進士名額，試圖削弱世族官僚集團的政治勢力。(A)九品官人法於隋文帝時即已廢除。(C)武則天執政時期主要仰賴前朝修建的運河基礎。(D)突厥問題於唐太宗時期已解決，東突厥於 630 年被唐軍所擊敗。
