  stem: 1848 年發表的辛尼卡瀑布會議（Seneca Falls Convention）的〈情感宣言〉為美國最早、世界第一個婦女運動宣言，由伊莉莎白．史坦登（Elizabeth Cady Stanton）與五位女性廢奴主義者共同發表。該宣言模仿美國〈獨立宣言〉的撰寫格式，指出女性在經濟、宗教、社會地位、婚姻與教育等權利長期被剝奪，且被置於較男性次等的從屬地位；為了匡正此不正義，恢復「神賦予女性與男性身為人的平等權利」。請問上述內容提及的「平等權利」，主要指的是下列何者？
  options:
  - label: A
    content: 參政權
  - label: B
    content: 受教權
  - label: C
    content: 身體自主權
  - label: D
    content: 革命權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 伊莉莎白．史坦登等人於 1848 年舉辦的辛尼卡瀑布會議中，主要針對當時歐美女性在政治、社會權利上處於被支配的地位提出挑戰；會議中起草的〈情感宣言〉，提出包括女性於離婚後應有扶養權、女性應有對家暴的丈夫提出告訴的法律權利，以及女性應有「投票權」等。而這場會議與其宣言，也帶動了 19 世紀中期至 20 世紀中期第一波婦女運動的風潮。
