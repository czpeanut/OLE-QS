  stem: '下表是 1700 ～ 1800 年間某西方國家的人口結構變化（單位：萬人）：

    | 年代 | 土著 | 白人 | 黑人 | 總計 |

    | --- | --- | --- | --- | --- |

    | 1700 | 75.0 | 22.3 | 2.7 | 100.0 |

    | 1820 | 32.5 | 788.4 | 177.2 | 998.1 |

    | 1860 | 16.0 | 2724.0 | 400.0 | 3140.0 |

    請問此為哪一國家的數據？'
  options:
  - label: A
    content: 英國
  - label: B
    content: 法國
  - label: C
    content: 澳洲
  - label: D
    content: 美國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 本題判斷的關鍵為「土著」、「白人」與「黑人」的族群分類，表格中 1700 年土著人數多於白人三倍，因此該地勢必為殖民地的北美十三州，並非為英國或法國；澳洲於 1788 年才有首批白人移民移入。1820 年至 1860 年間表格中「土著」人數迅速下降，起因於美國自 1830 年代起執行的「印第安人遷移政策」；而 19 世紀中期前，正是美國西南方棉花產業蓬勃發展的時期，因應棉花產業產生的高度奴隸勞力需求，也促成表格內黑人人口的快速增加的現象。
