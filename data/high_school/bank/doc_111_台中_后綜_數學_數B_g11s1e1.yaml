  answer_source: answer_key
  explanation: y＝3 sin( 2x－$\frac{\pi}{4}$)－1。 (A) ○：週期$\frac{2\pi}{2}$＝π。 (B) ×：振幅3。 (C) ×：頻率＝$\frac{1}{\pi}$。 (D) ×：－3－1 ≤ y ≤ 3－1 $\Rightarrow$ －4 ≤ y ≤ 2。 (E) ○：y＝3 sin( 2x－$\frac{\pi}{4}$)－1＝3 sin[ 2( x－$\frac{\pi}{8}$) ]－1， 可由y＝3 sin2x－1右移$\frac{\pi}{8}$所得。 故選(A)(E)。
