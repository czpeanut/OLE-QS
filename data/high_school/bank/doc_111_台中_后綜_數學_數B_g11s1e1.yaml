  section: 1
  number: 1
  type: single
  page: 1
  stem: 在9點30分時，時鐘的時針與分針所夾的較小角為多少弳？
  options:
  - label: A
    content: $\frac{\pi}{2}$
  - label: B
    content: $\frac{17\pi}{12}$
  - label: C
    content: $\frac{2\pi}{3}$
  - label: D
    content: $\frac{7\pi}{12}$
  - label: E
    content: $\frac{10\pi}{12}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 時針1分鐘走 ($\frac{1}{2}$)°，分針1分鐘走6°， 9時30分時針從9走15°， - 分針到達6的位置 ∴夾90°＋15°＝105°＝$\frac{105}{180}\pi$＝$\frac{7}{12}\pi$(弳) 故選(D)。
