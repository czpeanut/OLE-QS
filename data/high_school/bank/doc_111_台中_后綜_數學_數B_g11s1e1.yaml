  - label: E
    content: sin$\frac{8\pi}{3}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: sin 30°＝$\frac{1}{2}$，cos$\frac{2\pi}{5}$＝cos 72°＝sin 18°，sin 2 ≈ sin 114.6° ≈ sin 65.4°， cos 4＝cos 229.2°＜0，sin$\frac{8}{3}\pi$＝sin$\frac{2}{3}\pi$＝sin 120°＝sin 60° ∴最大為sin 2，故選(C)
