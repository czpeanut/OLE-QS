- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s3_8
  section: 3
  number: 8
  type: fill
  page: 2
  stem: 試問共有＿＿＿＿個角度θ滿足 0＜θ＜π，且$\cos \left( 2\theta -\frac{\pi}{4} \right)$、sin2θ、$\cos \left( 2\theta +\frac{\pi}{4} \right)$依序成一等比數列。
  explanation: '三數成等比數列

    $\Rightarrowsin^{2}$2θ＝$\cos \left( 2\theta -\frac{\pi}{4} \right) \cos \left( 2\theta +\frac{\pi}{4} \right)$

    $\Rightarrowsin^{2}$2θ＝$\left( \cos 2\theta \cos \frac{\pi}{4}+\sin 2\theta \sin \frac{\pi}{4} \right) \left( \cos 2\theta \cos \frac{\pi}{4}-\sin 2\theta \sin \frac{\pi}{4} \right)$

    $\Rightarrowsin^{2}$2θ＝$\frac{1}{2}\cos ^{2}2\theta -\frac{1}{2}\sin ^{2}2\theta\Rightarrow\frac{3}{2}\sin ^{2}2\theta =\frac{1}{2}\cos ^{2}2\theta$

    $\Rightarrow$3 $sin^{2}$2θ＝$cos^{2}$2θ$\Rightarrow\frac{\sin ^{2}2\theta}{\cos ^{2}2\theta}=\frac{1}{3}\Rightarrowtan^{2}$2θ＝$\frac{1}{3}$

    $\Rightarrow$2θ＝$\frac{\pi}{6}$，$\frac{5\pi}{6}$，$\frac{7\pi}{6}$，$\frac{11\pi}{6}$，……

    $\Rightarrow$θ＝$\frac{\pi}{12}$，$\frac{5\pi}{12}$，$\frac{7\pi}{12}$，$\frac{11\pi}{12}$，……

    又 0＜θ＜π

    故共有 4 個角度'
- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s3_9
  section: 3
  number: 9
  type: fill
  page: 2
  stem: 試求 $cos^{4}$5°＋$cos^{4}$10°＋$cos^{4}$15°＋$cos^{4}$20°＋……＋$cos^{4}$85°＋$cos^{4}$90°之值等於＿＿＿＿。
  explanation: '$cos^{4}$5°＋$cos^{4}$10°＋$cos^{4}$15°＋$cos^{4}$20°＋……＋$cos^{4}$85°＋$cos^{4}$90°

    ＝$\left( \frac{1+\cos 10^{^{\circ}}}{2} \right) ^{2}+ \left( \frac{1+\cos 20^{^{\circ}}}{2} \right) ^{2}+ \left( \frac{1+\cos 30^{^{\circ}}}{2} \right) ^{2}+\cdots \cdots + \left( \frac{1+\cos 170^{^{\circ}}}{2} \right) ^{2}+ \left( \frac{1+\cos 180^{^{\circ}}}{2} \right) ^{2}$

    ＝$\frac{1}{4} (\cos ^{2}10^{^{\circ}} +\cos ^{2}20^{^{\circ}} +\cdots \cdots +\cos ^{2}180^{^{\circ}})+\frac{1}{2} (\cos 10^{^{\circ}} +\cos 20^{^{\circ}} +\cdots \cdots +\cos 180^{^{\circ}})+\frac{1}{4}\times 18$

    又 $cos^{2}$10°＋$cos^{2}$100°＝$cos^{2}$20°＋$cos^{2}$110°＝……＝$cos^{2}$80°＋$cos^{2}$170°＝1

    而 cos90°＝0，cos180°＝－1

    得 $cos^{2}$10°＋$cos^{2}$20°＋……＋$cos^{2}$180°＝8＋1＝9

    又 cos10°＋cos170°＝cos20°＋cos160°＝……＝cos80°＋cos100°＝0

    得 cos10°＋cos20°＋……＋cos180°＝cos90°＋cos180°＝－1

    故所求為$\frac{1}{4}\times 9 +\frac{1}{2}\times (- 1)+\frac{1}{4}\times 18 =\frac{25}{4}$'
- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s4_1
