- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 已知兩個函數 f（x）＝｜sinx｜＋｜cosx｜，g（x）＝｜sinx｜－｜cosx｜，其中 x 為任意實數。設 f（x）的最小正週期為 p，g（x）的最小正週期為 q，則 p＋q 之值為何？
  options:
  - label: A
    content: $\frac{\pi}{2}$
  - label: B
    content: π
  - label: C
    content: $\frac{3\pi}{2}$
  - label: D
    content: 2π
  - label: E
    content: $\frac{5\pi}{2}$
  explanation: '∵$f \left( \frac{\pi}{2}+x \right)$＝$\left| \sin \left( \frac{\pi}{2}+x \right) \right| + \left| \cos \left( \frac{\pi}{2}+x \right) \right|$

    ＝｜cosx｜＋∣－sinx｜

    ＝｜sinx｜＋｜cosx｜＝f（x）

    ∴f（x）之週期為$\frac{\pi}{2}$

    又 g（π＋x）＝｜sin（π＋x）∣－｜cos（π＋x）∣

    ＝∣－sinx｜－∣－cosx｜

    ＝｜sinx｜－｜cosx｜＝g（x）

    但$g \left( \frac{\pi}{2}+x \right)$＝$\left| \sin \left( \frac{\pi}{2}+x \right) \right| - \left| \cos \left( \frac{\pi}{2}+x \right) \right|$

    ＝｜cosx｜－∣－sinx｜

    ＝｜cosx｜－∣sinx｜≠g（x）

    ∴g（x）之週期為 π

    $\Rightarrowp +q =\frac{\pi}{2}+\pi =\frac{3}{2}\pi$

    故選(C)'
- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 令$f (x)=\sin x - \sqrt{3}\cos x$，試選出正確的選項。
  options:
  - label: A
    content: 鉛直線$x =\frac{5\pi}{6}$為 y＝f（x）圖形的對稱軸
  - label: B
    content: 若鉛直線 x＝a 和 x＝b 均為 y＝f（x）圖形的對稱軸，則 f（a）＝f（b）
  - label: C
    content: 在區間 [0，2π）中恰有兩個相異實數滿足$f (x)= \sqrt{3}$
  - label: D
    content: 在區間 [0，2π）中滿足$f (x)=\frac{1}{2}$的所有實數之和不超過 2π
  - label: E
    content: y＝f（x）的圖形可由$y = 4\sin ^{2}\frac{x}{2}$的圖形經適當（左右、上下）平移得到
- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設函數$f (x)=\frac{\sin 2x}{2 +\cos 2x}$，試選出正確的選項。
  options:
  - label: A
    content: y＝f（x）圖形的週期為 2π
  - label: B
    content: f（x）的最小值為－1
  - label: C
    content: $f \left( \frac{\pi}{3} \right)$為 f（x）的最大值
  - label: D
    content: 直線$x =\frac{\pi}{3}$為 y＝f（x）圖形的對稱軸
  - label: E
    content: y＝f（x）的圖形關於原點對稱
  explanation: '(A)╳：f（x＋π）＝$\frac{\sin 2 (x +\pi )}{2 +\cos 2 (x +\pi )}$＝$\frac{\sin (2x + 2\pi )}{2 +\cos (2x + 2\pi )}$

    ＝$\frac{\sin 2x}{2 +\cos 2x}$＝f（x）

    $\Rightarrow$y＝f（x）圖形的週期為π

    (B)╳：令 y＝$\frac{\sin 2x}{2 +\cos 2x}$

    $\Rightarrow$2y＋y cos2x＝sin2x$\Rightarrow$sin2x－y cos2x＝2y

    $\Rightarrow\sqrt{y^{2} + 1} \left( \frac{1}{\sqrt{y^{2} + 1}}\sin 2x -\frac{y}{\sqrt{y^{2} + 1}}\cos 2x \right) = 2y$

    $\Rightarrow\sqrt{y^{2} + 1}\sin (2x-\theta ) = 2y$，其中$\begin{cases}\cos \theta =\frac{1}{\sqrt{y^{2} + 1}} \\ \sin \theta =\frac{y}{\sqrt{y^{2} + 1}}\end{cases}$

    $\Rightarrow\sin (2x-\theta ) =\frac{2y}{\sqrt{y^{2} + 1}}\Rightarrow\left| \frac{2y}{\sqrt{y^{2} + 1}} \right| \leq 1$

    $\Rightarrow4y^{2}\leqy^{2}$＋1$\Rightarrowy^{2}\leq\frac{1}{3}\Rightarrow-\frac{1}{\sqrt{3}}\leq$y$\leq\frac{1}{\sqrt{3}}\Rightarrow-\frac{\sqrt{3}}{3}\leq$y$\leq\frac{\sqrt{3}}{3}$

    ∴最小值為$-\frac{\sqrt{3}}{3}$

    (C)○：$f \left( \frac{\pi}{3} \right)$＝$\frac{\sin \frac{2\pi}{3}}{2 +\cos \frac{2\pi}{3}}$＝$\frac{\frac{\sqrt{3}}{2}}{2 + \left( -\frac{1}{2} \right)}$＝$\frac{\sqrt{3}}{3}$，由(B)知，$f \left( \frac{\pi}{3} \right)$為最大值

    (D)╳：∵$f \left( \frac{\pi}{3}+t \right)$≠$f \left( \frac{\pi}{3}-t \right)$ ∴$x =\frac{\pi}{3}$非對稱軸

    (E)○：∵f（－x）＝$\frac{\sin (- 2x)}{2 +\cos (- 2x)}$＝$\frac{-\sin 2x}{2 +\cos 2x}$＝－f（x）

    ∴y＝f（x）的圖形關於原點對稱

    故選(C)(E)'
