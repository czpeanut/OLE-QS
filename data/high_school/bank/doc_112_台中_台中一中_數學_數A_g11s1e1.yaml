  stem: '如右圖，在扇形 AOB 中，O 為圓心，$\overline{OA}$＝$\overline{OB}$＝r，∠AOB＝60°。若 P 在$\overparen{AB}$上，P 至$\overline{OA}$、$\overline{OB}$之距離各為 a、b，且 P 至$\overline{OA}$、$\overline{OB}$之垂足點各為 M、N，試回答下列問題：

    (1) 關於 a、b 與 r 的關係式，請選出正確的選項。（單選，6 分）

    (2) 設 r＝4，∠MOP＝θ，0°＜θ＜60°，m、n 皆為正實數，若四邊形 OMPN 的面積可以表示成 m．sin2θ＋n．cos2θ，則 m＋n 的值為＿＿＿＿。（6 分）

