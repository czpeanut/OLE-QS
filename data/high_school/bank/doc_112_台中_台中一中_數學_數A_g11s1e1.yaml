- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s3_6
  section: 3
  number: 6
  type: fill
  page: 2
  stem: 已知 k＞0，若將函數$y =\tan \left( kx +\frac{\pi}{4} \right)$的圖形向右平移$\frac{\pi}{3}$個單位長後，與函數$y =\tan \left( kx +\frac{\pi}{6} \right)$的圖形重合，則 k 的最小值為＿＿＿＿。
  explanation: 'y＝$\tan \left( kx +\frac{\pi}{4} \right)$＝$\tan \left( k \left( x +\frac{\pi}{4k} \right) \right)$

    向右平移$\frac{\pi}{3}$單位得 $y =\tan \left( k \left( x +\frac{\pi}{4k}-\frac{\pi}{3} \right) \right)$和$y =\tan \left( kx +\frac{\pi}{6} \right)$重合

    ∴$k \left( x +\frac{\pi}{4k}-\frac{\pi}{3} \right) = kx +\frac{\pi}{6}+m\pi$，其中 m 為整數

    $\Rightarrow\frac{\pi}{4}-\frac{k\pi}{3}=\frac{\pi}{6}+m\pi$

    $\Rightarrow\frac{1}{12}-\frac{k}{3}=m$

    $\Rightarrow\frac{1 - 4k}{12}=m$

    即 1－4k 為 12 的倍數，又 k＞0

    故 k 的最小值為$\frac{1}{4}$'
