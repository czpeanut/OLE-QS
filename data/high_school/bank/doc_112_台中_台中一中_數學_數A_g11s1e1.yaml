  explanation: '∵cos∠ADC＝$\frac{3}{5}\Rightarrow$sin∠ADC＝$\frac{4}{5}$；sin∠CDB＝$\frac{3}{5}\Rightarrow$cos∠CDB＝$\frac{4}{5}$

    ∴sin∠ADB＝sin（∠ADC－∠CDB）＝sin∠ADC×cos∠CDB－cos∠ADC×sin∠CDB

    ＝$\frac{4}{5}\times \frac{4}{5}-\frac{3}{5}\times \frac{3}{5}$＝$\frac{7}{25}$

