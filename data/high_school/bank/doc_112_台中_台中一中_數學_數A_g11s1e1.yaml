  stem: 設 180°＜θ°＜270°，r 為正整數，已知$\sin 112^{^{\circ}} + \sqrt{3}\cos 112^{^{\circ}} - 2\sqrt{3}\sin 82^{^{\circ}} =r\sin \theta ^{^{\circ}}$，則數對 （r，θ）＝＿＿＿＿。
  explanation: '$\sin 112^{^{\circ}} + \sqrt{3}\cos 112^{^{\circ}} - 2\sqrt{3}\sin 82^{^{\circ}}$

    ＝$2 \left( \frac{1}{2}\sin 112^{^{\circ}} +\frac{\sqrt{3}}{2}\cos 112^{^{\circ}} \right) - 2\sqrt{3}\sin 82^{^{\circ}}$

    ＝$2\sin (112^{^{\circ}} + 60^{^{\circ}})- 2\sqrt{3}\sin 82^{^{\circ}}$

    ＝$2\sin 172^{^{\circ}} - 2\sqrt{3}\sin 82^{^{\circ}}$

    ＝$2\sin 8^{^{\circ}} - 2\sqrt{3}\cos 8^{^{\circ}}$

    ＝$4 \left( \frac{1}{2}\sin 8^{^{\circ}} -\frac{\sqrt{3}}{2}\cos 8^{^{\circ}} \right)$

    ＝4 sin（8°－60°）＝4 sin（－52°）

    又 180°＜θ°＜270°$\Rightarrow$θ°＝180°＋52°＝232°

    故數對（r，θ）＝（4，232）'
- id: doc_112_台中_台中一中_數學_數A_g11s1e1_s3_4
  section: 3
  number: 4
  type: fill
  page: 2
  stem: 設 a、b 皆為非零整數且 c 為正整數，已知函數 y＝a sin（cx）＋b cos（cx）的振幅為 25，週期為 2π，則序組（a，b，c）的可能性共有＿＿＿＿種。
  explanation: 'y＝a sin（cx）＋b cos（cx）

    ＝$\sqrt{a^{2} +b^{2}} \left( \frac{a}{\sqrt{a^{2} +b^{2}}}\sin (cx)+\frac{b}{\sqrt{a^{2} +b^{2}}}\cos (cx) \right)$

    ＝$\sqrt{a^{2} +b^{2}}\sin (cx +\theta )$

    其中 cosθ＝$\frac{a}{\sqrt{a^{2} +b^{2}}}$，sinθ＝$\frac{b}{\sqrt{a^{2} +b^{2}}}$

    週期為$\frac{2\pi}{∣ c ∣}= 2\pi$，又 c＞0$\Rightarrow$c＝1

    且振幅為$\sqrt{a^{2} +b^{2}} = 25\Rightarrowa^{2}$＋$b^{2}$＝625

    又 a，b 為非零整數，a，b 的正整數組合如下表

    15.20 20.15 7.24 24.7

    又每一組又有正負合計 4 個組合（例：（15，20），（－15，20），（15，－20）， （－15，－20））

    故序組（a，b，c）共有 4×4×1＝16 種可能'
