- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 對伊斯蘭這種異常的擴張攻擊，歐洲人除了恐懼、驚愕之外，少能回應。……伊斯蘭教的每一件事都象徵著恐怖、破壞，和一群像惡魔般令人痛恨的野蠻人。對歐洲而言，伊斯蘭是一個持續的創傷。直到17世紀末，『□□帝國的危險』仍被歐洲視為一個經常的危險，它潛伏在一旁，隨時威脅著整個基督教文明。」上述的□□是指哪一政權？
  options:
  - label: A
    content: 薩法維
  - label: B
    content: 塞爾柱
  - label: C
    content: 鄂圖曼
  - label: D
    content: 蒙兀兒
