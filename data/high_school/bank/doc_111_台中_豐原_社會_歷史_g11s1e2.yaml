  stem: 資料一：《古蘭經》(4：76)「信道者，為主道而戰；不信道者，為魔道而戰；故你們當對惡魔的黨羽作戰；惡魔的計策，確是脆弱的。」；《古蘭經》(4：74)「以後世生活出賣今世生活的人，教他們為主道而戰吧！誰為主道而戰，以致殺身成仁，或殺敵致果，我將賞賜誰重大的報酬。誰為主道而陣亡，主將賜他以豐厚報酬，其血衣即是進入天堂的憑據。」
    資料二：「歐洲流傳著，穆斯林進行征服行動時，右手拿著《古蘭經》、左手持劍，以『要《古蘭經》或是劍』的姿態逼進。」 資料三：「為保衛『溫瑪』的利益，在麥地那期間，穆罕默德加緊組織軍隊，親自率兵進行防守，封鎖麥加—敘利亞間的商道，在經濟上制裁麥加人。630年穆罕默德組成萬人的穆斯林大軍，進攻麥加，穆斯林軍不戰而勝，進駐麥加城。清除卡巴天房的一切偶像，禁止異教的活動。穆罕默德使收藏在卡巴(天房)中的黑石，成為伊斯蘭教的朝拜聖物。」
    請根據以上三段資料，選出正確的敘述：
