- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 他的父母曾經擔任過法國傀儡國荷蘭王國的國王和王后，他以重建秩序、創建強力政府、建立社會保障、整理整個社會、重建國家榮譽為宣傳焦點，波旁王朝遺老、奧爾良王朝成員和舊貴族等君主主義者都支持他；部分資本家受到他的進步主義經濟主張所吸引，也和前者一樣支持他；農民階層認為他可以重振法國的聲威，穩定動盪不安的局勢，成為他在1848年當選總統的最主要支持者，更因為人民的支持，四年後走向帝制。請問他是誰？
  options:
  - label: A
    content: 拿破崙
  - label: B
    content: 路易拿破崙
  - label: C
    content: 俾斯麥
  - label: D
    content: 路易菲力
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一位學者介紹某地豐富的文化資產時，將該地從古以來的宗教信仰比喻成一座房屋。他說：最下層居住的是法老，上一層是亞伯拉罕，再上面一層是基督，最上面一層則是阿拉。這是何地的情況？
  options:
  - label: A
    content: 開羅
  - label: B
    content: 麥加
  - label: C
    content: 大馬士革
  - label: D
    content: 君士坦丁堡
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 大航海時代以來，上千萬的黑奴從非洲被運送至美洲，造成非洲人口大量流失。然而十八、十九世紀時，黑奴貿易逐漸消失，其原因可能為何？
  options:
  - label: A
    content: 非洲國家逐漸現代化，脫離西方國家的殖民
  - label: B
    content: 社會達爾文主義興起，歐洲人普遍同情黑人
  - label: C
    content: 新帝國主義國家彼此爭戰，導致黑奴來源減少
  - label: D
    content: 工業革命改變生產重心，歐洲人對黑奴需求降低
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 資料一：阿布巴克爾（Abu Bakr）：「曾寫信給麥加、塔伊夫和也門的人民以及納季德和希賈茲的全體阿拉比亞人，號召他們參加『聖戰』，而且鼓舞他們參戰和從希臘人手中奪取戰利品的慾望。」
    資料二：反抗阿拉伯入侵部隊的波斯司令魯斯特木曾對穆斯林的使節說過：「我已經知道了，你們是由於生計困難和窮困，沒有別的辦法，才來幹這種勾當的。」 資料三：阿拉伯詩人阿布泰馬木的《堅貞詩集》寫道：「你拋棄自己的故鄉，不是為了尋找天堂，卻是那麵包和椰棗，把你吸引到了遠方。」根據以上資料，是反映伊斯蘭向外擴張主要因素為：
  options:
  - label: A
    content: 以游牧為生，不得不組商隊四處去經商
  - label: B
    content: 伊斯蘭教對外擴張的目的在於經濟動機
  - label: C
    content: 為了傳播伊斯蘭教而向外發動聖戰擴張
  - label: D
    content: 為解除被統治下的高稅收而採擴張政策
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 比較拿破崙與侄子路易拿破崙在一生的從政之路，可發現有什麼共通之處？
  options:
  - label: A
    content: 均有遠征英國與俄國的雙重失敗
  - label: B
    content: 在取得政權當時即成為皇帝
  - label: C
    content: 二人都曾經歷過共和政治體制
  - label: D
    content: 對當時的中國都曾發動戰爭
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 「西元661年，阿拉伯帝國第四任哈里發被殺，隨後建立的王朝，將哈里發改為世襲，並將首都由麥地那遷至□□。此一王朝穩定後持續向外擴張，形成了一個跨越歐、亞、非三洲的大帝國。」關於上述資料，下列何者正確？
  options:
  - label: A
    content: 由穆阿維雅所建立
  - label: B
    content: □□應填入巴格達
  - label: C
    content: 此應為阿拔斯王朝
  - label: D
    content: 此王朝應為什葉派
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 鄂圖曼、薩法維與蒙兀兒這三個穆斯林軍事強國都嫻熟於火藥武器的使用，並建立一套確保作戰與行政管理都可以有效落實的制度，除此之外，三者彼此競爭之際，也能保持某種程度上的權力平衡，奠定共存與興盛的基礎。依據上述，下列何者非此三國得以強盛的原因？
  options:
  - label: A
    content: 先進的軍事科技
  - label: B
    content: 寬容的宗教政策
  - label: C
    content: 均勢的互動模式
  - label: D
    content: 健全的官僚體系
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「雖然聯邦政府已成立機構，負責安置、救濟黑人自由民與其他難民的工作，並有權監督和處理被遺棄的土地，但劃歸該機構處理的土地只有80萬英畝，無法滿足幾百萬自由民的需要。因此為數眾多的黑人繼續被束縛在種植園地主的土地上，使得剛從奴隸制枷鎖下解放的黑人，很快又淪為種植園地主下的佃農或雇農。」請問上述現象，應是發生於何時？
  options:
  - label: A
    content: 英國領有北美十三殖民地時期
  - label: B
    content: 美國聯邦政府剛成立之時
  - label: C
    content: 19世紀初美國西部拓墾時期
  - label: D
    content: 美國南北戰爭結束後
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 一位19世紀初期的政治人物表示：人民以為談一談社會契約，革命就完成了！事實上，對於所有國家而言，最重要的絕對不是改變，而是保持體制的穩定，以及不中斷地執行既有法律，因此應該讓現存的政府繼續執政。此人的政治觀點最可能屬於：
  options:
  - label: A
    content: 保守主義
  - label: B
    content: 民族主義
  - label: C
    content: 自由主義
  - label: D
    content: 社會主義
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 英國某項法案造成的影響如下：「舊地主及舊有南部城市商人的勢力受打擊；因工業革命興起的中北部城市商人的參政機會增加；郡代表的增加有助平衡不同地方勢力對選舉的影響；群眾對下議院的影響力上升，同時此法案也開創了日後議會改革的先河。」請問該法案為？
  options:
  - label: A
    content: 1689年《權利法案》
  - label: B
    content: 1832年改革法案
  - label: C
    content: 1867年改革法案
  - label: D
    content: 1884年改革法案
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 右圖是某文化圈具代表性的裝飾花紋。該文明因不允許偶像崇拜，是以在藝術表現上不見神像或聖像，而是以花草、文字，以及幾何圖形的重覆運用構成畫面。此種藝術手法常見於其宗教建築或宮殿的牆面。文中所指的最可能是下列哪個宗教的文化圈？
  options:
  - label: A
    content: 印度教
  - label: B
    content: 希臘正教
  - label: C
    content: 伊斯蘭教
  - label: D
    content: 羅馬公教
