  stem: '資料一：17世紀時，葡萄牙人開始感受到荷蘭的競爭壓力。1602年，荷蘭議會授予商人組成的荷蘭東印度公司特許狀，使東印度公司完全壟斷荷蘭的海外貿易，並有權在海外發動戰爭、修築堡壘，總督擁有很大的權力與自由，可與公司遇見的任何統治者從事直接外交。葡萄牙東印度公司方面，則是由國王與貴族壟斷香料貿易。後來，荷蘭在東印度群島的爭戰中漸居上風。
    資料二：16～17世紀以來，在英格蘭國王的特許下，商人組建許多享有海外特權的公司，其中較著名的有莫斯科公司，以及專門經營好望角以東貿易的東印度公司。然而，英格蘭的海外貿易發展，與海盜、走私、販奴和殖民擴張等活動緊密聯結，「公司」之名僅是擴張和劫掠的保護傘，藉此擾亂西班牙的航線。
    資料出處：艾立克‧沃爾夫著，賈士蘅譯，《歐洲與沒有歷史的人》(臺北：麥田，2013)頁321～322。郭豫斌，《圖解世界史─近代卷（上)》(臺中：好讀，2010)，頁88
    (1)關於兩段資料的內容，下列說明何者最適當？

    | 國家 | 策略 |

    | --- | --- |

    |  | (1)外交： |

    |  | (2)暴力： |'
  options:
  - label: A
    content: 各國東印度公司的運作模式大同小異
  - label: B
    content: 英格蘭常以非法掩飾合法進行海外擴張
  - label: C
    content: 荷蘭因政府介入較多而贏得貿易競爭
  - label: D
    content: 荷、英逐漸取代葡、西成為海上霸主 (2)史家包樂史（Leonard Blussé）曾指出某國東印度公司在亞洲的經營策略完全立基於兩件工具上：「外交與暴力」。其所指的「某國」應為上述資料符合兩件工具見的哪一國？並依據資料說明其「外交與暴力」的運用。（答錯國家名稱全題不給分，請填在作答區相應表格內）
