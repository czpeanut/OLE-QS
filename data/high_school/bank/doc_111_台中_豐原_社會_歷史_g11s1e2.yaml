- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 某書描述歷史上某一勢力：「它曾是世界上首屈一指的經濟強權，經由遍布亞洲、歐洲和非洲的廣大商務網及交通網，交易種類繁多的商品：從非洲進口奴隸和黃金，從歐洲進口奴隸和羊毛，並與亞洲文明國家交易糧食、香料和各式各樣的織品。」請問這個勢力最可能是下列何者？
  options:
  - label: A
    content: 2世紀時的羅馬帝國
  - label: B
    content: 9世紀的阿拔斯帝國
  - label: C
    content: 10世紀的神聖羅馬帝國
  - label: D
    content: 14世紀的拜占庭帝國
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 1095年秋，在法國南部的克萊芒郊區召開了宗教大會，烏爾班二世演說：「正為大家所知，一個來自波斯的民族，□□人已經入侵我們東方兄弟的國家，侵占了我們的聖地─耶路撒冷，他們在大肆蹂躪上帝的國度，毀壞基督教堂，擄殺虔誠的上帝子民，汙辱貞潔的婦女，貪婪地飲著受洗兒童的鮮血。……讓我們投入一場神聖的戰爭─為主而重獲聖地的偉大的十字軍東征吧！」以上引文所提及□□人與「邪惡的民族」，應是指哪一民族？
  options:
  - label: A
    content: 阿拉伯人
  - label: B
    content: 鄂圖曼突厥人
  - label: C
    content: 塞爾柱突厥人
  - label: D
    content: 蒙古人
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 小花有天到圖書館借閱一些書籍，其中包含「女權運動」、「婦女解放運動」以及「婦女史」等的相關研究。請問：這些主題之所以被提出來，或者說小花怎麼有機會可以閱讀到這些相關著作，需要溯源到哪一運動所帶來的變化？
  options:
  - label: A
    content: 文藝復興之後，人文主義鼓吹婦女獨立自主
  - label: B
    content: 宗教改革之後，追求財富榮耀，鼓勵婦女就業
  - label: C
    content: 共產革命之後，解放家庭婦女到農地參與生產勞動
  - label: D
    content: 工業革命之後，婦女工作機會增多，其社會、經濟角色逐漸發生變化
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 某位史家稱伊斯蘭世界為「居於中間的文明」，因其地理疆界處各文明中間，並兼納許多文明的元素，如接受印度的阿拉伯數字、中國的造紙術。然而，伊斯蘭社會卻是遲至18世紀才逐漸接受印刷術，且早期印製的都屬辭典、數學類作品。推測其因最可能是：
  options:
  - label: A
    content: 懼怕褻瀆經文
  - label: B
    content: 輕視學術發展
  - label: C
    content: 施行愚民政策
  - label: D
    content: 鄙視異國發明
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 三月初，維也納到處舉行群眾集會，提出修改憲法，廢除書報檢查，改組內閣，實行人民代議制度等要求。可是，皇帝斐迪南一世對這些要求，只作含糊其詞的答覆，群眾不滿，使革命形勢急劇地高漲起來。13日，在帝國議會附近的廣場上集聚著群眾，他們高呼口號：「自由！憲法！打倒政府！」「打倒梅特涅！」並且提出出版自由、信仰自由、陪審制和建立責任內閣等要求。請問：發生上述情形的背景為何？
  options:
  - label: A
    content: 受到法國七月革命的影響
  - label: B
    content: 受到法國二月革命的影響
  - label: C
    content: 受到薩奧戰爭戰敗的刺激
  - label: D
    content: 受到普奧戰爭戰敗的刺激
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 有一本書提到：「1845年，經濟危機席捲歐洲。首先是農業……法國各地受災程度不一……儘管1847年曾出現短暫的好轉，不可否認的是，最為貧困的農民是這次危機的主要受害者。數十萬的農村人口被迫節衣縮食；羊毛與棉麻紡織業瀕臨崩潰。工業生產過剩，各類工廠，特別是易受行情影響的中小型工廠，紛紛倒閉。請問這本書的書名可能是下列何者？
  options:
  - label: A
    content: 《法國大革命》
  - label: B
    content: 《拿破崙傳》
  - label: C
    content: 《七月王朝始末》
  - label: D
    content: 《法蘭西第二帝國始末》
- id: doc_111_台中_豐原_社會_歷史_g11s1e2_s1_22
  section: 1
  number: 22
