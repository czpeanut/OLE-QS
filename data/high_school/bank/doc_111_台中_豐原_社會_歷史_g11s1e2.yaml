  section: 1
  number: 4
  type: single
  page: 1
  stem: 臺灣的穆斯林大部分是1949年前後國共內戰來臺避禍的軍公教人員或其子嗣，大約有5至6萬人。另外，為數最多的則為在臺的某國移工，估計超過20萬人。請問某國應該是：
  options:
  - label: A
    content: 越南
  - label: B
    content: 印尼
  - label: C
    content: 泰國
  - label: D
