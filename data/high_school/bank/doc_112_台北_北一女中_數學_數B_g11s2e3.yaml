  page: 1
  stem: 下列選項中的事件皆非空事件，則哪些關於機率的敘述是正確的？ (1)「以我對EaTing的認識，他會跟團訂飲料的機率是200％」這是主觀機率 (2)有同學發現EaTing這學期20次訂飲料有10次是訂綠茶，由客觀機率可知EaTing訂飲料時訂綠茶的機率是50％
    (3)若EaTing預計下學期要用一枚公正硬幣決定要不要訂飲料：丟出正面就訂；丟出反面就不訂。則按照古典機率EaTing 下學期每一次訂飲料的機率是50％
    (4)已知EaTing會訂飲料，若EaTing訂飲料只會喝綠茶或紅茶，則「EaTing訂綠茶」和「EaTing訂紅茶」這兩個事件會 互相獨立 (5)承上選項，若EaTing訂綠茶只會喝微糖，則「EaTing訂的飲料是綠茶」和「EaTing訂的飲料是微糖」這兩個事件不
    會互相獨立
  answer:
  - (2)(3)(5)
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ×：機率大於1 (2) ○： (3) ○： (4) ×： (5) ○：P ( 喝綠茶∩微糖 )＝P ( 喝綠茶 )，P (
    微糖 )未必等於1 ∴ P ( 喝綠茶∩微糖 )≠P ( 喝綠茶 )．P ( 微糖 ) ∴ 兩者不獨立 P ( 喝綠茶∩喝紅茶 )＝0，但P ( 喝綠茶 )≠0，P
    ( 喝紅茶 )≠0 ∴ P ( 喝綠茶∩喝紅茶 )≠P ( 喝綠茶 )×P ( 喝紅茶 ) 故選(2)(3)(5)。

