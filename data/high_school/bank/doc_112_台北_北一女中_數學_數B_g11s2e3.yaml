  - label: '5'
    content: 若P(A∩B)＝P(A)P(B)≠0，則P(A | B)＝1－P(A' | B')
  explanation: (1) ○：P ( A∪B )＝P (A)＋P (B)－P ( A∩B ) ＝$\frac{1}{2}$＋$\frac{2}{3}$－P
    ( A∩B )＝$\frac{7}{6}$－P ( A∩B ) ≤ 1 ∴P ( A∩B ) ≥ $\frac{1}{6}$ ∴ P ( A∩B )≠0 (2)
    ○：P (A)．P (B)≠0 ⇒ P (A)≠0且P (B)≠0 P ( A | B )＝$\frac{P(A\cap B)}{P(B)}$＞P (A)
    ⇒ P ( A∩B )＞P (A)．P (B) ⇒ $\frac{P(A\cap B)}{P(A)}$＞P (B) ⇒ P ( B | A )＞P (B)
    (3) ×：P (A) P (B)≠0 ⇒ P (A)≠0且P (B)≠0 P ( A | B )＋P ( A' | B )＝$\frac{P(A\cap
    B)+P(A'\cap B)}{P(B)}$＝$\frac{P(B)}{P(B)}$＝1≠P (B) (4) ○：P ( A∩B )＝P (A)．P (B)≠0
    A，B獨立 P ( A | B )＝P (A)＞P ( A' | B )＝P (A') (5) ○：A，B獨立 P ( A | B )＝P (A) 1－P
    ( A' | B' )＝1－P (A')＝P (A) 故選(1)(2)(4)(5)。
- id: doc_112_台北_北一女中_數學_數B_g11s2e3_s1_2
  section: 1
  number: 2
