- id: doc_112_台北_北一女中_數學_數B_g11s2e3_s1_3
  section: 1
  number: 3
  type: calc
  page: 1
  stem: 袋子中有大小相同的2顆紅球、2顆黃球和4顆綠球，若是依序從袋中取球，取後不放回，則下列哪些選項是正確的？ (1)「第3球是紅球」的機率等於「第4球是黃球」機率
    (2)「第3球是紅球」的機率是「第2球是綠球」的機率的一半 (3)「第8球是綠球」的機率和「第8球是紅球或黃球」的機率相同 (4)「第1球是綠球」和「第1球是紅球或黃球」會互相獨立
    (5)「第1球是綠球」和「第2球是綠球」會互相獨立
  answer:
  - (1)(2)(3)
  answer_status: verified
  answer_source: answer_key
  explanation: (1) ○：P ( 第3球是紅球 )＝$\frac{2\cdot 7\times 6}{8\times 7\times 6}$＝$\frac{1}{4}$
    P ( 第4球是黃球 )＝$\frac{2\times 7\times 6\times 5}{8\times 7\times 6\times 5}$＝$\frac{1}{4}$
    ↖第4球放黃球，前3球任放 (2) ○：P ( 第2球是綠球 )＝$\frac{4\times 7}{8\times 7}$＝$\frac{1}{2}$ (3)
    ○：P ( 第8球是綠球 )＝$\frac{4\times 7!}{8!}$＝$\frac{1}{2}$ P ( 第8球是紅或黃 )＝1－P ( 第8球是綠球
    )＝1－$\frac{1}{2}$＝$\frac{1}{2}$ (4) ×：P ( 第1球是綠球 )＝$\frac{4}{8}$＝$\frac{1}{2}$
    P ( 第1球是紅或黃 )＝$\frac{2+2}{8}$＝$\frac{1}{2}$ P ( 第1球是綠球且第1球是紅或黃 )＝0≠$\frac{1}{2}$×$\frac{1}{2}$
    (5) ×：P ( 第1球是綠球 )＝P ( 第2球是綠球 )＝$\frac{4}{8}$＝$\frac{1}{2}$ P ( 第1球是綠球且第2球是綠球
    )＝$\frac{4\times 3}{8\times 7}$＝$\frac{3}{14}$≠$\frac{1}{2}$×$\frac{1}{2}$ 故選(1)(2)(3)。
