  answer:
  - (1)$\frac{81}{40}$；(2)$\frac{9}{10}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$P(X=1)=a(\frac{1}{3})^{1}$,$P(X=2)=a(\frac{1}{3})^{2}$

    (1) $P(X=1)+P(X=2)+P(X=3)+P(X=4)=a(\frac{1}{3})^{1}+a(\frac{1}{3})^{2}+a(\frac{1}{3})^{3}+a(\frac{1}{3})^{4}=a\times \frac{27+9+3+1}{81}=\frac{40}{81}a=1\therefore a=\frac{81}{40}$。

    (2)$P(X<3)=P(X=1)+P(X=2)=\frac{81}{40}\times \frac{1}{3}+\frac{81}{40}\times \frac{1}{9}=\frac{9}{10}$。'
