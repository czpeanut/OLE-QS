  stem: 擲1枚均勻硬幣4次，恰好出現n次正面的機率為$a_{n}$；擲1枚均勻硬幣8次，恰好出現n次正面的機率為$b_{n}$，試問下列哪些選項是正確的？
  options:
  - label: A
    content: $b_{0}$，$b_{1}$，…，$b_{8}$中的最大值為$b_{4}$
  - label: B
    content: $a_{0}$，$a_{1}$，…，$a_{4}$中的最大值為$a_{2}$
  - label: C
    content: $a_{2}$＞$b_{4}$
  - label: D
    content: $b_{2}$＝$b_{6}$
  - label: E
    content: $a_{3}$＞$b_{3}$
  explanation: '1枚硬幣丟4次： $a_{0}=(\frac{1}{2})^{4}=\frac{1}{16}$，$a_{1}=C_{1}^{4}(\frac{1}{2})^{3}(\frac{1}{2})^{1}=\frac{1}{4}$，$a_{2}=C_{2}^{4}(\frac{1}{2})^{2}(\frac{1}{2})^{2}=\frac{3}{8}$

    $a_{3}=C_{3}^{4}(\frac{1}{2})^{1}(\frac{1}{2})^{3}=\frac{1}{4}$，$a_{4}=C_{4}^{4}(\frac{1}{2})^{4}=\frac{1}{16}$

    1枚硬幣丟8次： $b_{0}=(\frac{1}{2})^{8}=\frac{1}{256}$，$b_{1}=C_{1}^{8}(\frac{1}{2})^{7}(\frac{1}{2})=\frac{8}{256}$，$b_{2}=C_{2}^{8}(\frac{1}{2})^{6}(\frac{1}{2})^{2}=\frac{28}{256}$

    $b_{3}=C_{3}^{8}(\frac{1}{2})^{5}(\frac{1}{2})^{3}=\frac{56}{256}$，$b_{4}=C_{4}^{8}(\frac{1}{2})^{4}(\frac{1}{2})^{4}=\frac{70}{256}$

    $b_{5}=C_{5}^{8}(\frac{1}{2})^{3}(\frac{1}{2})^{5}=\frac{56}{256}$，$b_{6}=C_{6}^{8}(\frac{1}{2})^{2}(\frac{1}{2})^{6}=\frac{28}{256}$

    $b_{7}=C_{7}^{8}(\frac{1}{2})^{1}(\frac{1}{2})^{7}=\frac{8}{256}$，$b_{8}=C_{8}^{8}(\frac{1}{2})^{8}=\frac{1}{256}$

    (A) ○：$b_{4}$最大。

    (B) ○：$a_{2}$最大

    (C) ○：$a_{2}=\frac{3}{8}=\frac{96}{256}>\frac{70}{256}=b_{4}$最大

    (D) ○：$b_{2}=b_{6}$

    (E) ○：$a_{3}=\frac{1}{4}=\frac{64}{256}>\frac{56}{256}=b_{3}$

    故選(A)(B)(C)(D)(E)。'
