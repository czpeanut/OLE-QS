  page: 1
  stem: 丟一枚均勻的硬幣4次，令隨機變數X表示出現正面的次數，下列敘述何者正確？(多選)
  options:
  - label: A
    content: 隨機變數X所有可能值共有4種
  - label: B
    content: P (X＝2)＝$\frac{1}{2}$
  - label: C
    content: P (X ≤ 2)＝$\frac{11}{16}$
  - label: D
    content: P (2 ≤ X＜4)＝$\frac{5}{8}$
  - label: E
    content: P (X＜2)＝P (X＞2)
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '丟4次,所以正面次數$X=0,1,2,3,4$

    (A) ×：有5種情形。 (B) ×：$P(X=2)=C_{2}^{4}(\frac{1}{2})^{2}(\frac{1}{2})^{2}=\frac{6}{16}=\frac{3}{8}$。

    (C) ○：$P(X\leq 2)=P(X=0)+P(X=1)+P(X=2)=C_{0}^{4}(\frac{1}{2})^{4}(\frac{1}{2})^{0}+C_{1}^{4}(\frac{1}{2})^{3}(\frac{1}{2})^{1}+C_{2}^{4}(\frac{1}{2})^{2}(\frac{1}{2})^{2}=\frac{1+4+6}{16}=\frac{11}{16}$。

    (D) ○：$P(2\leq X<4)=P(X=2)+P(X=3)=C_{2}^{4}(\frac{1}{2})^{2}(\frac{1}{2})^{2}+C_{3}^{4}(\frac{1}{2})^{1}(\frac{1}{2})^{3}=\frac{6+4}{16}=\frac{5}{8}$。 (E) ○：$P(X<2)=P(X=0)+P(X=1)$，$P(X>2)=P(X=4)+P(X=3)\therefore P(X<2)=P(X>2)$

    故選(C)(D)(E)。'
