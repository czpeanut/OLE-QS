  stem: 狂牛症的醫學名稱為「牛隻海綿樣腦病變」，因牛隻發病時興奮且具攻擊性而命名；於1986年首度爆發於<u>英國</u>，當時重創<u>英國</u>的畜牧業，近年來研究發現，極可能是由一種「普里昂蛋白質」（Prion）變性蛋白質所引起。Prion取意於傳染性蛋白粒子（Protienaceous Infectious Particles），此病原體會導致腦部組織迅速被大量破壞形成空洞引發腦海綿狀病變，主要為侵犯神經系統的一種疾病。其潛伏期可能長達好幾年，但一旦發病，牛隻會在數個星期內死亡。下列何者是狂牛病原體的成分？
