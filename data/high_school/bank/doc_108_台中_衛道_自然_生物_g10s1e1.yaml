  group_stem: 【閱讀一】內共生學說 <u>瑪格麗斯</u>是<u>波士頓大學</u>的微生物學教授，她十四歲時進入<u>芝加哥大學</u>就讀，而碩士時是主修動物及遺傳學，1960年代轉赴<u>柏克萊</u>研究細胞遺傳及微生物。1963年她發現在細胞核外的葉綠體及細胞質內有片段DNA存在，而且也有直接遺傳的現象。同時她指出這核外DNA的來源特性和演化與核內的DNA不同。1967年，她轉赴<u>波士頓大學</u>任教，其間擔入生物的教學和研究。在她長期的觀察和研究中，她認為真核生物的胞器有些特徵與原核細胞構造類似。同時胞吞現象廣泛存在於很多細胞，例如：有不少變形蟲（Amoeba sp.）或草履蟲（Paramaecium sp.）經常可見到藉胞吞作用而攝食細菌、矽藻或藍綠菌。 這些含葉綠素的細胞，可以在變形蟲細胞內可存活一段相當長久的時間，甚至可以行細胞分裂形成共生的現象。另外她在<u>加州</u> <u>巴哈</u>海岸的泥灘地上找到某些螺旋菌（Spirochetes），其外形和構造與人體肺部氣管上的纖毛細胞很類似。因為她找到類似的例子不少，所以才提出真核細胞及複雜多細胞生物是由不同的原核細胞藉著內共生方式（Endosymbiosis）演化而來。在1970年及1981年，她分別出版真核細胞的起源《<u>The origin of Eukaryotic cell</u>》及細胞演化中的內共生現象《<u>Symbiosis in cell Evolution</u>》來說明真核多細胞生物的演化，可能是由一連串原核生物或與真核生物以內共生的方式一成。她提出的主要證據如下： 1. 粒線體及葉綠體也都有DNA，且往往呈環狀；與一般細菌的DNA構造相似，並可複製。 2. 一般有鞭毛、纖毛或有尾部的細胞，在電子顯微鏡下的構造與螺旋菌的構造類似；有微管蛋白質的構造，且其排列方式相似。 3. 在一般的精子尾部與自由生活之螺旋菌類似都含有kinetosomal DNA。 雖然上面的證據可以來說明真核細胞及高等多細胞生物的可能演化步驟，但有不少的學者仍然反對<u>瑪格麗斯</u>的看法，他們認為那些胞器的形成是趨同演化的結果。因為在有氧情況下要行有氧呼吸，所以不少細胞就自行演化出粒線體來。
  answer:
  - D
  answer_status: verified
