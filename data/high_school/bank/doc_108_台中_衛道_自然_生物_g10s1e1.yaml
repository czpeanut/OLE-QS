- id: doc_108_台中_衛道_自然_生物_g10s1e1_s3_48
  section: 3
  number: 48
  type: single
  page: 6
  stem: 請問“自噬溶小體”是一個幾層膜的構造呢？
  options:
  - label: A
    content: '0'
  - label: B
    content: '1'
  - label: C
    content: '2'
  - label: D
    content: '3'
  group_stem: 【閱讀二】細胞大掃除：自噬作用 細胞本身就可以比喻成小型工廠，許多不同的部門（胞器）在分工合作以維持工廠（細胞）的最佳運作，那如果生產線中出現了不良產品時該怎麼辦呢？沒錯！要有回收或銷毀系統，所以細胞內也是可藉由自身內部微小的「吸塵器」，清理老舊的蛋白質、失常的胞器以及入侵的微生物，這個過程稱為「自噬作用，autophagy」。 當細胞接受到養分不足、氧氣不足等訊息時，細胞膜上具有訊號接收站能夠將訊息往細胞內回報，此時細胞內的多種蛋白質和脂質先形成彎月狀的雙層膜構造，稱為吞噬泡，吞噬泡會藉由增加新的膜逐漸增大，並且將受損的胞器或蛋白質包圍，最後凹陷關閉成為囊狀構造的自噬體（auto-phagosome），這個自噬體就類似於細胞內的垃圾車，準備將垃圾載往垃圾處理場，垃圾處理場就是溶體，自噬體的外層膜會與溶體的膜融合形成「自噬溶小體，autolysosome」，藉由溶體內水解酵素分解老舊胞器或蛋白質成小分子物質，其中小分子物質如胺基酸則可以再回收利用成為材料，如此完成自噬作用。溶體又稱為細胞的胃或細胞的自殺袋：由高基氏體的運輸小泡和細胞膜凹陷之內體合併而成的單層膜囊狀構造。有數十種水解酶，須在弱酸下（PH約5.0）才可作用。與細胞內消化、防禦、細胞凋亡、細胞更新甚至組織器官的變態、退化有關。 不過有時候在嚴重受損的細胞中，垃圾多到垃圾處理場無法負荷時，細胞為顧全大局，原本預備被吞入的受損胞器也可能同時釋放訊號引發細胞凋亡（細胞自殺），細胞凋亡本身也是一連串複雜的訊息傳遞過程，最後會啟動胞內多種水解酵素分解所有胞器及蛋白質，進而造成細胞萎縮死亡。細胞凋亡與自噬作用不同，細胞凋亡就是細胞注定要死亡，但是自噬作用可依細胞內垃圾堆積的程度選擇細胞的存亡與否，所以細胞凋亡與細胞自噬彼此密切又謹慎地相互平衡。
  answer:
  - C
