  stem: 同位素標記是一項用於追蹤同位素在某個化學反應、代謝通路、或細胞定位中的路徑和去向的技術。在使用時，通過把特定的反應物分子中的某個原子替換為其同位素來進行「標記」，再讓標記過後的反應物發生反應，產物分子中同位素標記的位置就可以顯示出反應過程中被標記原子的變化。1941年<u>美國</u>的<u>魯賓</u>和<u>卡門</u>利用同位素標記法，將氧的同位素$^{18}$O分別標記於$H_{2}$O和$CO_{2}$，然後在相同條件下，進行下列兩組小球藻的光合作用實驗，最後採集氧氣加以分析：實驗一、提供小球藻$H_{2}^{18}$O以及$CO_{2}$。實驗二、提供小球藻$H_{2}$O以及$C^{18}O_{2}$。請問根據上述實驗以及你所學過的知識，下列敘述哪些正確？
