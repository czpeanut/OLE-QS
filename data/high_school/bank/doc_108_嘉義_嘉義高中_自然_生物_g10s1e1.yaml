  section: 3
  number: 46
  type: single
  page: 4
  stem: 進子通道是由何種物質組成？
  options:
  - label: A
    content: 礦物質
  - label: B
    content: 多醣類
  - label: C
    content: 蛋白質
  - label: D
    content: 脂質
  group_stem: 所有的細胞都是透過離子通道來控制穿越細胞膜的離子，這些通道最窄處的寬度大約為1到2個原子的直徑大小。一個通道通常僅負責一種離子進出，如鈉離子、鉀離子等。某些離子通道擁有一個可以開關的「門」來控制通道的開關，各種門所受控制的來源是不一樣，例如：電信號、化學信號、溫度或者機械力。<u>羅德里克‧麥金農</u>運用X射線晶體學來確定通道的分子結構，並獲頒2003年的諾貝爾化學獎。離子通道在人體的生理活動中扮演著重要角色，當通道失去功能時常會致命。例如：河豚毒素是一種強力的神經毒素，目前並無有效的解毒劑，它會和神經細胞的細胞膜上鈉離子通道結合，令運動神經的訊號傳遞遭阻斷。囊腫性纖維化是最常見且致命的遺傳疾病，是位於7號染色體上的基因發生突變導致，這個基因通常會產生一種稱為囊腫性纖維化的跨膜調節器，其功能就是一種氯離子通道。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
