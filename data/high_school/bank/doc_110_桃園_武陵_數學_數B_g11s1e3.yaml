- id: doc_110_桃園_武陵_數學_數B_g11s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 已知平面上三點 A（1，3），B（－3，6），C（8，4），請問下列何者正確？
  options:
  - label: A
    content: │$\vec{AB}$│＝5
  - label: B
    content: 2$\vec{AB}$－$\vec{AC}$＝（15，－5）
  - label: C
    content: $\vec{AB}$．$\vec{AC}$＝－15
  - label: D
    content: $\vec{AC}$在$\vec{AB}$上的正射影長為 2
  - label: E
    content: △ABC 的重心坐標為（2，3）
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{AB}$＝（－4，3），$\vec{AC}$＝（7，1）

    (A) ○：│$\vec{AB}$│＝$\sqrt{(-4)^{2}+3^{2}}$＝5

    (B) ╳：2$\vec{AB}$－$\vec{AC}$＝2（－4，3）－（7，1）＝（－15，5）

    (C) ╳：$\vec{AB}$．$\vec{AC}$＝（－4）×7＋3×1＝－25

    (D) ╳：$\vec{AC}$在$\vec{AB}$上的正射影長為$\frac{| \vec{AC} \cdot \vec{AB} |}{| \vec{AB} |}$＝$\frac{25}{5}$＝5

    (E) ╳：重心坐標為$\left( \frac{1-3+8}{3} , \frac{3+6+4}{3} \right) = \left( 2 , \frac{13}{3} \right)$

    故選(A)'
- id: doc_110_桃園_武陵_數學_數B_g11s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 如右圖，已知$\vec{OA}$＝$\vec{a}$，$\vec{OB}$＝$\vec{b}$，則下列敘述何者正確？
  options:
  - label: A
    content: $\vec{CD}$＝2$\vec{a}$＋$\vec{b}$
  - label: B
    content: （$\vec{PQ}$－$\vec{RS}$）//$\vec{b}$
  - label: C
    content: 13$\vec{RS}$－9$\vec{CD}$＝7$\vec{PQ}$
  - label: D
    content: 若 13$\vec{PQ}$＝x$\vec{OC}$＋y$\vec{RS}$，則 x＝9
  - label: E
    content: 承(D)，y＝－10
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_110_桃園_武陵_數學_數B_g11s1e3/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 416.2
      - 295.85
      - 564.25
      - 391.05
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：由題圖可知$\vec{CD}$＝2$\vec{a}$－$\vec{b}$

    (B) ○：$\vec{PQ}$＝3$\vec{a}$＋5$\vec{b}$，$\vec{RS}$＝3$\vec{a}$＋2$\vec{b}$，$\vec{PQ}$－$\vec{RS}$＝3$\vec{b}$//$\vec{b}$

    (C) ○：13$\vec{RS}$－9$\vec{CD}$＝13（3$\vec{a}$＋2$\vec{b}$）－9（2$\vec{a}$－$\vec{b}$）

    ＝21$\vec{a}$＋35$\vec{b}$＝7（3$\vec{a}$＋5$\vec{b}$）＝7$\vec{PQ}$

    (D) ○ (E) ╳：$\vec{OC}$＝$\vec{a}$＋5$\vec{b}$

    13（3$\vec{a}$＋5$\vec{b}$）＝x（$\vec{a}$＋5$\vec{b}$）＋y（3$\vec{a}$＋2$\vec{b}$）

    ⇒ 39$\vec{a}$＋65$\vec{b}$＝（x＋3y）$\vec{a}$＋（5x＋2y）$\vec{b}$

    ∵$\vec{a}$，$\vec{b}$不平行

    ∴$\begin{cases}x+3y=39 \\ 5x+2y=65\end{cases}$ ⇒ $\begin{cases}x=9 \\ y=10\end{cases}$

    故選(B)(C)(D)'
- id: doc_110_桃園_武陵_數學_數B_g11s1e3_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: $\vec{a}$、$\vec{b}$、$\vec{c}$為三個非零向量，則下列敘述何者正確？
  options:
  - label: A
    content: │$\vec{a}$＋$\vec{b}$│＞│$\vec{a}$－$\vec{b}$│
  - label: B
    content: 若$\vec{a}$＝$\left( \frac{1}{| \vec{b} |} \right)\vec{b}$，則│$\vec{a}$│＝1
  - label: C
    content: 若$\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$，則$\vec{b}$＝$\vec{c}$
  - label: D
    content: 若$\vec{a}$．$\vec{b}$＝0，則$\vec{a}$＝$\vec{0}$或$\vec{b}$＝$\vec{0}$
  - label: E
    content: 若α、β為實數，且α$\vec{a}$＋β$\vec{b}$＝$\vec{0}$，則α＝β＝0
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：不一定

    例如：$\vec{a}$＝（1，0），$\vec{b}$＝（－1，0），$\vec{a}$＋$\vec{b}$＝$\vec{0}$，$\vec{a}$－$\vec{b}$＝（2，0）

    │$\vec{a}$＋$\vec{b}$│＝0＜│$\vec{a}$－$\vec{b}$│＝2

    (B) ○：│$\vec{a}$│＝$\left| \left( \frac{1}{| \vec{b} |} \right) \vec{b} \right|$＝$\left( \frac{1}{| \vec{b} |} \right)$│$\vec{b}$│＝1

    (C) ╳：不一定

    例如：$\vec{a}$＝（1，0），$\vec{b}$＝（0，1），$\vec{c}$＝（0，2）

    $\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$＝0，但$\vec{b}$≠$\vec{c}$

    (D) ╳：不一定

    例如：$\vec{a}$＝（1，0），$\vec{b}$＝（0，1）

    $\vec{a}$．$\vec{b}$＝0，但$\vec{a}$≠$\vec{0}$且$\vec{b}$≠$\vec{0}$

    (E) ╳：不一定

    例如：$\vec{a}$＝（1，0），$\vec{b}$＝（－1，0），且 1（1，0）＋1（－1，0）＝$\vec{0}$

    但α＝β＝1≠0

    故選(B)'
- id: doc_110_桃園_武陵_數學_數B_g11s1e3_s1_4
