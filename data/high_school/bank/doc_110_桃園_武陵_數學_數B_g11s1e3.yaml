  explanation: 'A1 面積為 A0 的$\frac{1}{2}$，A2 面積為 A0 的$\frac{1}{4}$，……

    可設裁成 $a_{1}$ 張 A1，$a_{2}$ 張 A2，……

    則$\begin{cases}a_{1}+a_{2}+\ldots \ldots +a_{k}=7 \\ \frac{1}{2}a_{1}+\frac{1}{4}a_{2}+\ldots \ldots +\frac{1}{2^{k}}a_{k}=1 \\ a_{1} , a_{2} , \ldots \ldots , a_{k}\in ｛0 , 1 , 2 , 3 , \ldots \ldots ｝\end{cases}$

    ⇒ （$a_{1}$，$a_{2}$，$a_{3}$，$a_{4}$，$a_{5}$，$a_{6}$）

