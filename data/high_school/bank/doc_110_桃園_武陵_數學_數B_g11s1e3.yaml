  - label: B
    content: $\vec{OP}$＝t$\vec{a}$＋2$\vec{b}$，則 P 點的軌跡圖形為一直線
  - label: C
    content: $\vec{OP}$＝t$\vec{a}$＋s$\vec{b}$，t＝s＋2，則 P 點的軌跡圖形為一線段
  - label: D
    content: $\vec{OP}$＝t$\vec{a}$＋s$\vec{b}$，0$\leq$t$\leq$2，則 P 點的軌跡圖形為一線段
  - label: E
    content: $\vec{OP}$＝t$\vec{a}$＋s$\vec{b}$，0$\leq$t$\leq$2，0$\leq$s$\leq$2，則 P 點的軌跡圖形為一平行四邊形及其內部
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
