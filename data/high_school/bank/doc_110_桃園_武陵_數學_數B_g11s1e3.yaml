  stem: 一張 A0 的圖畫紙可裁切成大大小小的 A 類紙張，例如裁成 2 張 A1 大小的紙，4 張 A2 的紙，或是 1 張 A1、1 張 A2、2 張 A3 的紙共 4 張。今欲將一張 A0 的圖畫紙裁切成大大小小的 A 類紙張共 7 張，共有 ＿＿＿＿種裁切方式。
