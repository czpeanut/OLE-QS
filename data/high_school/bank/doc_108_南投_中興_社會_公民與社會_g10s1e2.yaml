- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 結伊的爸爸是位政治人物，因此從小常聽到爸爸在談論他的工作，例如說他工作的選區是「小選區」（也就是該選區只有最高票的候選人會當選），並且選舉制度與總統相同，連選也只能連任1次。請按照上述內容，選出下列最適合的選項。
  options:
  - label: A
    content: 鎮長、直轄市議員也都屬於小選區
  - label: B
    content: 「小選區」是指候選人人數的多寡
  - label: C
    content: 立委、直轄市長的選舉制度也都與總統的相同
  - label: D
    content: 鄉長、縣市長的連任規定與結伊的爸爸相同
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 一個國家的選舉制度，不只會影響政黨的類型，也與大黨、小黨的生存有非常緊密的關係。請問下列哪些敘述正確？(甲)並立制對小黨生存較有利 (乙)複數選區制對小黨生存較有利 (丙)對小黨來說採取比例代表制較並立制有利 (丁)單一選區制：小黨日漸衰微大黨日漸壯大 (戊)比例代表制：小黨一票難求故不利於小黨
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丙丁戊
  - label: D
    content: 甲乙丙丁戊
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 在我國總統由人民直選，對人民負責。但當人民對總統施政不滿時，多等待下屆總統大選時才能改換。真正對國會負責的是行政院長，閣揆由總統任命，因此行政院施政必須遵行總統主張，而質詢的是行政院長而非總統。每當發生重大事件引起人不滿時，「行政院長」也常負責下臺。於是我國行政院長頻繁替換，不僅政策無法延續，也產生了責任歸屬不明確的問題。請問上述所指的主要問題為何者？
  options:
  - label: A
    content: 總統定期改選，閣揆則由總統任命
  - label: B
    content: 總統有權無責，行政院長有責無權
  - label: C
    content: 選舉過於繁複，政策難以長期延續
  - label: D
    content: 職權分別不明，總統閣揆爭功諉過
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 2018年11月的地方選舉大選綁公投，公投結果也為修法帶來新的挑戰。反同團體強調，通過的公投第10案是「《民法》婚姻規定應限定在一男一女」，第12案是「以《民法》婚姻規定以外之其他形式來保障同性別二人經營」，因此專法應以「婚姻」以外的形式訂定，因為公投是國民主權的展現，法律位階高於《憲法》高於大法官解釋。同運團體則表示，司法院已指出公投不能牴觸大法官釋憲，任何的立法形式都不能違反釋字748號所規定需保障同性的婚姻自由，法案應遵守大法官釋憲，希望尊重臺灣的民主程序和憲政體制，讓社會停止動盪、減少傷害。請問關於上述的修法爭議，以下哪些說明符合我國憲政運作？ (甲)依公投結果所訂定的新法，應由立法院的內政委員會提出法案 (乙)對於立法院所通過的新法，行政院可於10日內要求立法院覆議 (丙)若內政部認為新法有執行上有違憲疑慮，可向司法院聲請釋憲 (丁)大法官會議的釋憲，不得違反立法院依公投結果所通過的法案 (戊)若新法制定引發司法院與立法院間的爭議，由行政院負責協調
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丁戊
  - label: D
    content: 乙戊
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 布里布里國經過人民不斷的努力，終於推翻獨裁領導人，並且創立新的政府。然而，革命志士對於新政府應採用何種政府體制卻爭論不休。其中，深受人民愛戴的革命英雄卡加，主張應採用總統制，理由在於＿＿＿＿。請問上述空格處可以填人哪些理由？ (甲)具有民意基礎且權力集中的總統，可迅速帶領國家戰後復甦 (乙)立法與行政在法案上較容易配合，可使國家政策推動較順利 (丙)總統任期固定使政治局勢較穩定，可避免國家政局動盪不安 (丁)權力分立且相互制衡的政府架構，可防止政府濫罐侵害人權 (戊)政治僵局發生時總統可解散國會，可透過選舉瞭解民意方向
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丙丁戊
  - label: D
    content: 甲丙丁
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 宜蘭縣公民監督聯盟自2011年5月成立後，努力建立起宜蘭縣的議會監督制度，該聯盟的努力下，2015年終於使宜蘭縣議會開始有了議事錄影，並且定期公布對議會的觀察結果，例如2017年發現宜蘭縣議會全體議員平均「在場率：僅48％。請問關於該聯盟的說明？以下哪些正確？ (甲)地方議會若能被有效監督，有助於促進地方自治的健全 (乙)擁有權力者應受監督，該團體有助於展現公民社會力量 (丙)公民團體對地方議會的監督，規定在《地方制度法》中 (丁)該公民團體干涉議會，將造成少數人得利，多數人不利 (戊)該公民團體可使民眾對公共事務關注，促進民主參與
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丙丁戊
  - label: D
    content: 甲乙戊
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 過去利益團體與政黨皆規範於《人民團體法》中，而《政黨法》也在解嚴30週年時已經三讀通過，故政黨的相關事項皆由《政黨法》所規範，最新規定包含「曾犯內亂、外患、貪污等等之罪的人不得擔任政黨負責人；政黨財務不透明未依法申報可罰500萬；政黨補助款門檻則由現行得票率3.5％降為3％；如果連4年未推候選人參選，將廢止政黨備案」等。請依照上述內容，判斷下列敘述何者是最正選的選項？
  options:
  - label: A
    content: 要求犯特定罪名之人不得擔任政黨負責人明顯有違公平
  - label: B
    content: 處罰未申報財產之政黨可能侵犯政黨的隱私影響其運作
  - label: C
    content: 連四年未推候選人而廢黨的規定可使政黨運作更加蓬勃
  - label: D
    content: 政黨補助款門檻的降低，將會使得小黨的生存更加困難
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 阿強曾參加學校舉辦的國際教育旅行活動，他在日記裡寫道：「現在已經是5月中旬了，但這裡的氣候非常乾燥又涼爽，一點都沒有臺灣的黏膩感。當地人告訴我，他們的國家元首已經高齡85歲，但仍然每天工作，除審閱及簽署由首相或內閣傳遞而來的各式法律文件外，還必須負責接待來訪的外國元首或主持重要慶典。老師則補充說，現在執政的這個家族，據說是天神後裔，治理該國已長達600年。但和古時候相比，現在的元首不比當年，僅剩下『任命總理』和『作為國家象徵』的職權了。」請問阿強最有可能去參訪圖中的哪個國家？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 為了讓同學更瞭解不同政府體制間行政權與立法權的互動特色，許老師在黑板上整理詳盡的筆記。但粗心的阿霞抄寫時，不慎忘了記下代表國家，請根據下表摘要內容，依序指出(甲)、(乙)、(丙)分別最有可能代表哪些國家？
  options:
  - label: A
    content: 英國、日本、我國
  - label: B
    content: 英國、泰國、我國
  - label: C
    content: 德國、美國、法國
  - label: D
    content: 我國、美國、英國
