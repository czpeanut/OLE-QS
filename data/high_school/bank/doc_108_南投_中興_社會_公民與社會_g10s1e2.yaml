- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 小慈出生在一個重男輕女的家庭，他特別崇拜英國前首相柴契爾、德國總理梅克爾等具有影響力的女性政治人物，希望自己有朝一日也能在政治上發光發熱，為社會服務，並向家族證明女性也有足夠的能力、決心參與公共事務。若小慈今年剛滿19歲，請問他還「無法」運用何種政治參與管道？
  options:
  - label: A
    content: 在公投案中投票
  - label: B
    content: 加入政黨成為黨員
  - label: C
    content: 撰文支持罷免不適任的行政首長
  - label: D
    content: 投票支持與自己立場相近的議員
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_19
  section: 1
  number: 19
