- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 2018年底九合一大選後，六都市長當選者紛紛提出不同的政策來建設其城市，下列哪一位市長的說法已經超出市長的職權範圍？
  options:
  - label: A
    content: 鄭阿燦：本市提高生育津貼，以減輕年輕父母的負擔
  - label: B
    content: 侯阿宜：因應兩岸互動頻繁，主張簽訂兩岸和平協議
  - label: C
    content: 韓瑜瑜：市府規劃河岸摩天輪，帶動河岸觀光發展商機
  - label: D
    content: 盧芳芳：宣布將停止前市長的山手線環市鐵路建設計畫
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2014年的太陽花運動之後，臺灣人民對於公共事務的熱情被重拾，非藍非綠的「第三勢力」也順應崛起。其中包含登記為社團法人的「公民組合」及學運退場後成立的「島國前進」、「民主鬥陣」等。公民組合在學運後積極運作轉型為政黨並欲提出立法委員候選人，但因為內部意見不同決定分開組黨。認為政黨應擴大群眾來參與，具體政策由人民來決定者組成「時代力量」；認為政黨應提出明確政策方針，再說服選民加人比較負責任者組成「社會民主黨」。學運後的豐沛公民力量透過不同之志願結社形成更豐富的樣貌，請根據這一段歷程進行分析，並選出正確的選項。
  options:
  - label: A
    content: 「公民組合」若想轉型為政黨需要依據《人民團體法》向內政部登記
  - label: B
    content: 「公民組合」因為有政治主張故可以採用推出候選人的方式參與政治
  - label: C
    content: 「時代力量」採用審議式民主的方式廣納民意達至政治社會化的功能
  - label: D
    content: 「時代力量」可以依據《遊說法》向相關立法及行政部門等施加壓力
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 針對層出不窮的食安問題，某大學舉辦食安問題研討會，邀請跨院、跨部會的政府官員研擬解決辦法。下表為與會代表的發言內容，依其內容判斷，何者所屬機關具有「提出《憲法》修正案」的職權？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
