  group_stem: ◎ 臺灣燈會屬於交通部觀光局負責的工作，過去都由其主辦，地點在臺北市；2001年起為了平衡縣市發展，轉而交付全國各縣市輪流辦理，成為全國性的國家級活動；2008年又改為評選制，各縣市政府可以提出計畫向中央爭取主辦權，獲選者可藉著舉辦燈會吸引觀光人潮、凸顯地方風土民情及知名度。 2019年，屏東縣政府獲選承辦第30屆臺灣燈會，這次主燈為屏東在地特色黑鮪魚，跳脫以往以生肖為主的設計；而另一款以寺廟的光明燈為發想，由空酒瓶和LED燈組成的「恆春風巢」，則是屏東在地藝術家和丹麥藝術家共同創作的成果。由於花燈形式新穎，富有多元化、國際化的元素，頗受國人及外界好評。 因燈會會場地處海邊，為使民眾能順利抵達燈會會場，屏東縣政府調派400餘臺接駁車，從火車站、高鐵站及周邊停車場等接送民眾往返；同時也與交通部商擬對策，由交通部高速公路局配合進行國道管制，僅供接駁車、客運行駛，以舒緩交通。此外，屏東縣政府也動員6千多位志工每天輪值巡視，協助展場維持秩序及清潔。最終這場燈會共吸引1,300萬人次參觀，可說是相當成功。
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s2_39
  section: 2
  number: 39
  type: single
  page: 5
  stem: 小民是設籍彰化縣在臺北市讀書的大三生，也是2018年公投綁大選的首投族，對於第一次投票感到相當雀躍，卻又不知道自己最多可領取多少票。請根據上述內文中判斷，小民這次公投與大選合併最多可以取得多少票？
  options:
  - label: A
    content: 9張
  - label: B
    content: 13張
  - label: C
    content: 15張
  - label: D
    content: 19張
  group_stem: ◎ 2018年為《公民投票法》修正後首度舉辦公投，10個公投案合併九合一大選投票，且公投案採一案一張票，由於為首次公投綁九合一選舉，因此規模極大，導致投票時間已截止卻仍有投票所繼續排隊投票的情況，公平性遭受外界質疑，同時選票總類繁多也造成超過午夜12時才完成開票。 此次公投共通過7案，但修法後的公投也引發相當多的爭議。九合一大選結果則使藍綠版圖大位移，直轄市長與縣市長的選舉結果，民進黨從現有的13席，銳減到6席，國民黨則從6席增為15席；這次大選有許多是立委轉戰地方縣市首長選舉，因此選舉結束尚需進行立委補選。縣市首長中有7名為女性，是史上最高紀錄，其中雲林縣長張麗善即為不分區立委轉戰成功的例子，臺中市長盧秀燕則是先請辭區域立委，再轉戰市長選舉。 有鑑於2018公投造成諸多爭議，立法院於2019年再次修《公民投票法》，確定公投與大選脫鉤，且未來公民投票日訂於8月第四個星期六，自2021起，每兩年舉行一次，但對於此次修法人民仍有不同意見。
