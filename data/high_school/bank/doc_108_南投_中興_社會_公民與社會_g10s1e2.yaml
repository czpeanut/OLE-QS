- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 出生於1996年3月23日的阿民，在出生日當天便見證了臺灣第一次總統直選，可以說是臺灣民主化的最年輕見證者，因為如此，活潑樂觀的阿民自小便立志想成總統，而今年即將大學畢業的他躍躍欲試的想投入政壇，請問下列何者「不是」阿民可以從事的政治活動？
  options:
  - label: A
    content: 阿民可以在就讀高三那年選擇加入與自己政治主張相同的政黨
  - label: B
    content: 阿民在2018年時，已經具備公民投票的提案、連署與投票資格
  - label: C
    content: 阿民在2020年的時候可以接受政黨的提名成為立法委員候選人
  - label: D
    content: 阿民其實早就可以投人2018年九合一大選中村里長的競選活動
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 為了監督立法委員在國會的表現，學者與數個民間團體成立一個監督國會的聯盟，在立法院開會期間，觀察和記錄立法委員行使職權的狀況，並定期公布觀察記錄，以供民眾檢視與參考。請問下列何者屬於該組織觀察和記錄的項目或內容？
  options:
  - label: A
    content: 同意考試委員之任命
  - label: B
    content: 解決直轄市間的爭議
  - label: C
    content: 解釋行政中立法疑義
  - label: D
    content: 提案彈劾涉弊的官員
- id: doc_108_南投_中興_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 同樣的選舉，在不同的選舉制度下，就有可能產生不同的結果。下表為2010年時，我國第10任的正副總統選舉結果，若是我國總統選舉制度與法國相同，則最有可能出現下列何種選舉結果？
  options:
  - label: A
    content: 由得票率最高的「陳呂」組合直接當選
  - label: B
    content: 由得票率前兩名的組合當選，共同執政
  - label: C
    content: 第二輪投票時連戰可要求原本支持者改投宋楚瑜使其獲勝
  - label: D
    content: 沒有候選人獲得過半選票因此同樣人選再投一次票
