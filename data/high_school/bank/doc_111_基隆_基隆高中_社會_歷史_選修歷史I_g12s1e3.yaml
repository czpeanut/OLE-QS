  stem: 一戰結束後，歐洲各國人民苦於戰爭破壞與經濟衰頹，因此希望政府能夠積極調整應對，提出讓人民有感的政策，下列何者是當時民眾可能會支持的政策？
  options:
  - label: A
    content: 提高關稅門檻，並補助國營事業
  - label: B
    content: 開放貿易邊界，組成自由貿易區
  - label: C
    content: 取消物資配給，且提供多元選擇
  - label: D
    content: 推動企業整合，並增加附加價值
  answer:
