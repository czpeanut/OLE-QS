  stem: 1930 年代末期，日本當局為了強化臺灣人對日本的認同，展開大量的戰爭宣傳，影響臺灣報紙發展甚鉅。下列有關臺灣報紙可能面臨的情形，何者正確？
  options:
  - label: A
    content: 重視報紙漢文版，以便讓臺灣民眾快速知悉戰爭情報
  - label: B
    content: 整併漢文各報社，藉此統一與戰爭有關的報導與評論
  - label: C
    content: 增加大量的國際新聞，提供臺灣人比較各國政策基礎
  - label: D
    content: 在各地成立八卦小報，讓各報競爭戰爭的第一手消息
