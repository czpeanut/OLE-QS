  stem: 創傷後壓力症候群（PTSD），是戰爭中士兵常見的疾病，兩次大戰與越戰有大量美軍士兵深受困擾。電影「美國狙擊手」中，便有「你雖然身體回來美國了，但你的靈魂和心思仍留在那個殘破不堪的戰場」的臺詞。創傷後壓力症候群也常見於重大災難之後，造成性格改變、情感解離（疏離）、易受驚嚇的情形。下列關於創傷後壓力症候群的描述，哪個正確？
  options:
  - label: A
    content: 長時間在壕溝戰鬥的士兵罹病機率大
  - label: B
    content: 平民由於遠離戰場，較不受到衝擊
  - label: C
    content: 電療是主流的治療方式
  - label: D
    content: 由於戰爭技術進步，二戰後已顯著減少
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)戰爭期間，由於戰火亦會波及至城市等居住地，亦有平民被俘虜、關押等問題，另外還有對於戰爭的恐懼心理、親人離世等因素，皆會使平民罹患創傷後壓力症候群。(C)創傷後壓力症候群的主要治療方式為心理治療。(D)戰爭技術的進步、「總體戰」概念的發展，皆增加創傷後壓力症候群發生的機率。
