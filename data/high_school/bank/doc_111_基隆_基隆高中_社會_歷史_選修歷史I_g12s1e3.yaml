  stem: '間諜小說《鍋匠 裁縫 士兵 間諜》中，有以下一段劇情：

    「那時候才是好時光，你你聽見嗎？真正的好時光。那時候英國人可以感到驕傲自豪。現在也應該讓他們感到驕傲自豪。」

    「這不是我可以作主的事。」

    「可憐的人兒。為大英帝國受到的訓練，為統治海洋受到的訓練。可是現在一切都完了，都被奪走了，一去不復返了。你們是最後一代了。」

    請問文中的感傷，主要是源自於二戰後英國面對的何種現象？'
  options:
  - label: A
    content: 共產主義的擴張與蘇俄的威脅
  - label: B
    content: 資本主義的興起與美國的強盛
  - label: C
    content: 帝國主義的式微與英國的沒落
  - label: D
    content: 種族主義的歧視與納粹的屠殺
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 第二次世界大戰後，英國由於受到戰爭的嚴重衝擊，國力逐漸下降；加上當時全球掀起去殖民化浪潮，帝國的海外殖民地開始陸續出現獨立運動，舊時的大英帝國也在 1947 年印度獨立後逐漸瓦解、君主於隔年放棄「皇帝」頭銜。從引文中緬懷過去身為英國人的自豪感，以及感嘆無法再為大英帝國統治海洋的感嘆，可判斷其主因為帝國主義的式微與英國的沒落，故答案選(C)。
