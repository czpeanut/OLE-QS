  stem: 2016 年，安倍首相在靖國神社舉行連續三天的春季例行大祭，引起周邊鄰國的強烈不滿，並透過外交管道抗議。位於東京千代田區的靖國神社內從 1978 年開始供奉包括東條英機在內的十四名二戰甲級戰犯。長期以來，部分日本政客、議員並不介意參拜靖國神社。亦有學者指出，若以私人身分參拜，並不容易引起爭議，但若以官銜或政治人物身分前往，則往往成為鄰國抗議的目標。請問對於日本首相或政治人物參拜靖國神社的行為，哪個國家最有可能提出抗議和不滿？
  options:
  - label: A
    content: 美國
  - label: B
    content: 菲律賓
  - label: C
    content: 南韓
  - label: D
    content: 俄羅斯
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '日本靖國神社為 1869 年由明治天皇主導興建，該神社成立的目的，乃是為了供奉自明治維新以來為國家所犧牲的軍人與軍屬。然而 1978 年後，十四位在東京大審判中被判為「甲級戰犯」者入祀靖國神社，因而使得該神社蒙上過去軍國主義的色彩，而被過去受到日本進犯的東亞國家所質疑。本題答案為(C)。

    13.1998 年頒布的《國際刑事法院羅馬規約》中，將危害人類罪定義為：「在明知的情形下，廣泛或系統性針對任何平民群眾，進行謀殺、滅絕、酷刑……等行為。」而題目中緬甸軍政府對示威民眾的鎮壓行為，即相當接近《羅馬規約》中的危害人類罪定義。

    14.資料一提及政府所欲逮捕者為「汙染血統和民族純粹的人」，與納粹德國對猶太人的批評相符；「飢餓、曝曬與疾病」來除去這些人，則為納粹德國將猶太人關押於集中營的目的。資料二中《美麗人生》的電影背景，亦為猶太人被關押於集中營的故事。由此可判斷該政策應是針對猶太人的最終解決方案。

    15.納粹黨於 1933 年在德國主政後，即成立「希特勒青年團」（Hitler-Jugend），大量吸收德國青少年，並訓練其成為對希特勒與第三帝國效忠的戰士。「希特勒青年團」除了著重於訓練青少年的身體、軍事技能外，更重要的是灌輸其納粹思想，其中也包含排擠、迫害猶太人。並利用青年團成員於社會中執行排猶政策。正確選項為(D)。

    16.從資料一、二中，可得知二則資料皆在討論過去納粹德國時期，中低階層政府官員對於猶太大屠殺的相關責任問題。選項中《歷史記憶法》、《大赦法》皆為西班牙政府對於內戰與獨裁時期發生的政治迫害事件，所制定之相關法律；史塔西則為冷戰時期，東德「國家安全部」的別稱，為東德政府的情報及祕密警察組織，其相關檔案乃記錄東德政府的政治監控、迫害問題。因此與二則資料背景較接近「紐倫堡大審」，故答案選(A)。

    17.從資料二中可得知，漢娜．鄂蘭提出的「平凡的邪惡」，主要是討論人民在執行自己的職責時，成為政府不義行為的幫凶。選項中(B)(C)(D)皆符合「平凡的邪惡」的論述。(A)「小白花海盜幫」是 1930 年代存在於德國社會的青少年次文化，部分德國青少年因不願服從納粹體制，選擇透過與「希特勒青年團」鬥毆、挑戰，來對抗心中的不公義，因此不符合「平凡的邪惡」論述。

    18.(A)(B)目前臺灣的轉型正義工程，尚未有對曾參與白色恐怖的官員進行司法訴訟的相關制度與規範，因此無法對相關人士提出告訴，或以警察身分進行逮捕。(D)轉型正義工作中，對於檔案資料中加害者責任的釐清，是需要透過專業的研究加以考證、討論。若僅依憑檔案紀錄就私自要求當事者進行道歉，或是相關報復行為，不論在法律或是道德層面皆有所疑慮，亦不符合轉型正義所秉持的「和解共生」精神。

    19.《史塔西檔案法》的頒布，象徵德國轉型正義工作已進行到「真相揭露」的階段。公布相關檔案，其最終的目標雖為促進社會的和解與共生，但並不是每個人都能夠接受「真相」、與加害者達成和解。因此其最直接想達成的目標，為追求真相的揭露，故答案選(B)。

    20.(B)〈格爾尼卡〉為畢卡索著名的抽象畫作之一。(C)從題目敘述中可判斷，畢卡索乃藉由抽象的畫作來反映戰爭的殘酷與創傷，而非脫離現實。(D)〈格爾尼卡〉的畫作反映戰爭的殘酷、人民的壓抑心境，並非用以諷刺時局、針砭時政。因此較符合的選項為(A)藉由這件藝術作品感受畫家對戰爭的省思。

    21.(A)從題目敘述中可得知，當時戰爭已陷入長期膠著的狀態，因此政府欲透過宣傳戰來塑造戰爭的必要性和合理性，藉以鼓舞士氣並使人民持續投入戰爭；由題目敘述中可判斷(C)(D)並非為第一次世界大戰期間，政府開始重視宣傳戰的主要原因。

    22.(A)英國並未在戰爭期間出現族群迫害的情形。(B)日本政府一直到 1945 年，才向臺灣人實施全面徵兵。(D)第二次世界大戰期間出現的傀儡政權，包含中國南京國民政府、滿洲國、法國維琪政府等，倫敦、臺北等地應較無共同經歷。

    23.(A)史塔西為東德「國家安全部」的別稱，與阿根廷軍政府無關。(C)《大赦法》是西班牙政府於 1977 年所頒布，釋放內戰與獨裁期間被關押的政治犯，與阿根廷無關。(D)由題目敘述可得知，當時阿根廷為軍政府體制，而非民主體制。

    24.資料一說明猶太人本來已融入德國社會，資料二則進一步解釋排猶主義的盛行，主要是受到納粹政府的宣傳操作。由此可判斷納粹統治時期，猶太人受到厭惡與迫害的主因為政治宣傳與思想控制，故答案選(D)。

    25.1975 年，西班牙長期執政的獨裁者佛朗哥（Francisco Franco）去世，西班牙新政府開始實施民主轉型的工作。由於過去經歷內戰與長期的高壓統治，西班牙社會內部的對立情形相當嚴重，當時的政府為謀求新憲法下的秩序得以獲得穩定，選擇與各方勢力進行協商、謀求最大共識。而對於過去內戰與獨裁時期，西班牙所發生的政治迫害事件，新政府在政治協商的共識下，於 1977 年頒布《大赦法》，僅釋放政治犯而未對政治受害者進行賠償，並限制民眾對過去內戰、獨裁時期所發生政治迫害事件進行真相調查，因而出現「選擇性遺忘」的現象。由此可判斷題目引文所述之背景為西班牙政府頒布《大赦法》，故答案選(C)。

    26.「消滅全世界入侵伊斯蘭世界的西方國家，以建立一個純正的伊斯蘭國家」為塔利班、蓋達等伊斯蘭極端組織成立的宗旨與目標。其中，2001 年 9 月 11 日於美國發生一系列的自殺式恐怖襲擊事件，乃是賓拉登所領導的蓋達組織為實踐其理念並打擊美國，所發動的攻擊行為。阿富汗戰爭則是「九一一事件」後，美國政府針對塔利班、蓋達等組織所發起的戰爭，故答案選(D)。

    27.題目敘述中，麥當勞於印度推出素食產品、並未販售大麥克、豬肉滿福堡等豬肉製品的商業策略，乃為迎合印度文化所做出的「本土化」轉向；而 2001 年的牛油事件，則是顯示出美國文化與印度文化的衝突。因此正確選項為(D)。

    28.(A)第一次世界大戰後，國際貿易中的關稅保護主義盛行，再加上俄國革命成功所帶動的左傾風潮，造成社會、共產主義於世界各地流行。(B)經濟大恐慌後，民主制度因無法有效解決經濟危機，導致社會大眾對民主制度的信任產生動搖，並促成極端主義的興起。(C)冷戰期間以美國為首的自由民主陣營，對抗蘇聯為主的共產陣營，為意識型態鬥爭最白熱化的時期。因此題目中學者的主張最可能出現於冷戰結束後，故答案選(D)。

    29.由題目敘述與時間點，可判斷此應為歐美國家欲協助猶太人重返巴勒斯坦地區，所做出的建議。(A)第一次石油危機發生於 1973 年。(C)在宗教因素的對立下，阿拉伯世界並不會主動建議猶太人移入巴勒斯坦。(D)此聲明事實上引來了阿拉伯世界的反抗與批評。

    30.(A)《西線無戰事》為德國作家雷馬克於 1929 年出版的小說，其內容主要描述第一次世界大戰之景況。(B)〈格爾尼卡〉為畢卡索於 1937 年所創作，其藉由畫作來反映西班牙內戰的殘酷與創傷。(D)「九一一事件」後引發大部分美國人民對於伊斯蘭極端組織的反感，並進而支持美國政府發動「反恐戰爭」。

    31.選項中迪士尼樂園、麥當勞與 NBA（國家籃球協會、美國職籃）皆為當代美國文化全球化的重要指標與媒介。(D) BBC（英國廣播公司）則為英國文化的重要傳播媒介之一。

    32.附圖為西班牙超現實主義畫家達利（Salvador Dali）的代表作品〈記憶的堅持〉。該畫作創作於 1931 年，其反映超現實主義畫派受到心理學家佛洛伊德「精神分析學說」的影響，透過異於寫實的作畫技巧，表達創作者的直覺與潛意識，故答案選(A)。'
