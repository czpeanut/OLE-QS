  stem: 一篇報導形容一群在戰爭中的受難者：「這些人受到誘騙、強迫等不正當的手段所迫，不僅在經濟上只拿到微薄的補貼，身心上也受到難以復原的創傷。然而在戰爭結束之後也無法歸於平靜，社會的排擠與厭惡讓這些人背負沉重的標籤艱苦過活。」請問這篇報導中的「受難者」可能為下列何者？
  options:
  - label: A
    content: 在戰場上倖存的前線士兵
  - label: B
    content: 英國倫敦一戰時的失業者
  - label: C
    content: 受戰爭性暴力侵害的女性
  - label: D
    content: 戰爭空襲轟炸受害的平民
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 第二次世界大戰期間，日本軍方宣稱「為了解決戰爭中的性侵害問題」、「提高軍人的戰鬥力與士氣」，而實施「慰安婦」制度，自日本帝國本地、殖民地與占領區等地，透過召募、委託民間業者聘僱等方式，將女性送入軍中並提供性服務。根據研究，當時許多女性是受到不當的拐騙（例如以女工、護士、清潔隊員為名）而被送入軍中，並被迫成為慰安婦；而經濟剝削與性暴力的問題亦層出不窮。戰爭結束後，倖存者亦因過去的經歷而在回歸社會的過程中遭受不公平與歧視對待，故答案選(C)。
