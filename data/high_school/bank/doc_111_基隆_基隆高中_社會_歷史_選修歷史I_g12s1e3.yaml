  answer_status: verified
  answer_source: answer_key
  explanation: 第一次世界大戰前，國際貿易與產業分工在自由主義的興盛下達到高峰，各國的經濟生產出現相互依存的現象。然而大戰期間對工業生產與貿易帶來的破壞，以及航路受到破壞導致原料供應不足的問題，促使第一次世界大戰後，各國對國際貿易的態度轉趨消極，並開始出現趨向自給自足與關稅保護的風潮。因此當時民眾最可能會支持的政策為提高關稅門檻，並補助國營事業，故答案選(A)。
