  explanation: (A)日本於 1937 年起開始推行皇民化運動，在鼓勵說「國語」的背景下，許多漢文報紙遭到廢止、整併。(C)當時日本帝國內的新聞媒體受到政府嚴格的審查，報導內容亦多為宣揚日本與其盟友的國威，與攻擊英、美帝國主義的相關新聞。(D)戰爭期間新聞媒體與報導內容皆受到政府管制。
