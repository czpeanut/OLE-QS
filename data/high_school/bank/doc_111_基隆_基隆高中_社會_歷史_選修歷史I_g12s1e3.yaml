  explanation: (A)經濟大恐慌發生於 1929 年，當時為「戰間期」。(B)《西線無戰事》為德國作家雷馬克於 1929 年出版的小說，其內容主要描述一次大戰之景況。馬克通膨則為一次大戰後，德國因戰爭賠償而出現的經濟問題。(C)一次大戰期間，「石油」的供給成為左右戰爭勝負的關鍵，再加上當時較先進的機械動力亦開始轉向以「石油」為原料，因此石油為一次大戰之後的重要議題。
