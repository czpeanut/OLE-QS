  section: 1
  number: 13
  type: single
  page: 3
  stem: 根據媒體報導，2021 年緬甸全民不服從運動抗議持續延燒，軍政府武力鎮壓力道加大。軍方操控的官媒電視臺不斷放送警告訊息，恐嚇上街示威的民眾們可能遭到軍方射殺，緬甸政府甚至在 3 月 27 日緬甸軍人節當天大肆屠殺平民，許多人在家中被襲擊。從以上的敘述來看，緬甸軍隊對其人民的作為，最接近國際刑事法院認定的哪一項國際罪刑？
  options:
