  - label: C
    content: 蘇俄
  - label: D
    content: 德國
  group_stem: '二戰時某國的政府將宣傳戰視為維護政權的重要工具，鼓勵大量生產便宜的收音機，讓一般的工人階級也買得起，並大力推銷這臺收音機，到了 1942 年，收聽廣播的觀眾從 450 萬戶，增加到 1,600 多萬戶。其部長更曾說：「謊言重複一千次就成為真理」、「宣傳的基本原則就是不斷重複有效論點，謊言要一再傳播並裝扮得令人相信」。

    後來，政府下達強制集體收聽廣播的命令，當上班時間播出廣播時，所有人必須停止一切工作，一起圍坐在收音機前一起聽廣播。如果有人沒有收音機也沒關係，因為公共場所都有配備廣播設備，能夠及時聽到政府的最新指示。後來政府更延長了戰爭新聞的廣播時間與次數，因為公眾「對新聞的渴望是無論如何要得到滿足的」，否則「會被迫去聽外國甚至是敵國的廣播」。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 德國納粹黨自建黨期間，即相當重視透過各種媒體進行宣傳的工作；希特勒亦在其 1925 年的著作《我的奮鬥》中，大篇幅闡述其對於宣傳的研究與實踐。因此納粹黨於 1933 年開始掌握德國政權後，旋即成立國民教育與宣傳部，並由希特勒的心腹，有「宣傳的天才」稱號的戈培爾（Joseph Goebbels）擔任部長，負責透過媒體對國民宣揚黨的理念。文章中出現的「謊言重複一千次就成為真理」、「宣傳的基本原則就是不斷重複有效論點，謊言要一再傳播並裝扮得令人相信」，即為戈培爾對於宣傳工作的名言。
