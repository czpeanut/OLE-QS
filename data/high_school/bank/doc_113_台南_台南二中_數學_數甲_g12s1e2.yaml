  stem: 設f (x)為一個實係數多項式函數且α,β∈R，則下列哪些選項是正確的？
  options:
  - label: A
    content: 若f ′(α)＝0，則f (x)在x＝α處有極值
  - label: B
    content: 若f ′(α)＝0且f (x)在x＝α處有極小值，則f ′′(α)＞0
  - label: C
    content: 若f (x)為嚴格遞增函數，則f ′(β)＞0
  - label: D
    content: 若f (x)在x＝α處有反曲點，則 f ′′(α)＝0
  - label: E
    content: 若f (x)在x＝β處不可微分，則f (x)在x＝β處必不連續
