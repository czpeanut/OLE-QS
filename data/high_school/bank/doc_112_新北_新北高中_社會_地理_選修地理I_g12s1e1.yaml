  section: 1
  number: 5
  type: single
  page: 2
  stem: 「魯地圖」是由網路社群所發展的臺灣登山地圖，它運用開放街圖（OSM）圖資、山友分享之軌跡檔，以內政部的開放資料所產製，每週四更新發行。部分登山 App 的圖資沒有等高線，對登山的人來說沒有等高線就少了很多資訊，甚至危險。魯地圖的等高線由「內政部地政司」的 Taiwan DTM 20 公尺製作而來，可用來做為一般登山參考，探勘式登山仍建議搭配經建版地形圖第三版。請問下列在「魯地圖」中所呈現的資料，哪些為自願性地理資訊（VGI）？(甲) OSM 圖資(乙)山友分享之軌跡檔(丙)內政部開放的 20 公尺解析度 DTM 資料(丁)山友的問題回報(戊)臺灣通用電子地圖
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁戊
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)自願性地理資訊指的是透過網際網路民眾主動／被動提供位置資料，進一步分析出的地理資訊。(丙)(戊)皆為臺灣官方製作的地圖，不屬於自願性地理資訊。
