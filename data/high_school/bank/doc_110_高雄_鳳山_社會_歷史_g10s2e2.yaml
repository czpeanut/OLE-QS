    資料二：宋朝的統治階層就是由一批一批來自各地，經由科舉進入朝廷的官員所組成。高官子弟一般不參加科舉，可蔭任位低俸薄的小官，不但世家大族難以形成，甚至出現了「富不過三代」的說法。宋後的社會領袖為鄉紳，其成員主要來自科舉，特別在明清，主要指目前在朝為官者或退休官員，以及其他有資格者，如監生、舉人、進士等身分。若跟過去的豪族、世族相比的話，他們主要是因為考取科舉的身分而不具備有鄉里的勢力基礎。但一方面雖然考取了功名具備入任資格，但官員名額有限，並非考上就能進入官場，於是這些人留在地方，成為地方政府的協助者或制衡者。因此，他們成為社會新領袖，在宗族也往往是族長或領導身分，到明清中後期，鄉紳控制地方社會的情況越來越普遍，對於中央而言卻是一種威脅，這些士人常在明倫堂議政，也引發政府的鎮壓，從雍正初年起，便禁止士人在明倫堂集會。'
