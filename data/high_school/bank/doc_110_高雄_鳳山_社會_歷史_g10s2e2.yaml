  section: 1
  number: 37
  type: single
  page: 4
  stem: 從資料一到資料二：從世族到宗族，當中轉變的最大關鍵是？
  options:
  - label: A
    content: 科舉考試讓世族的壟斷局面不再
  - label: B
    content: 九品官人法促成宗族的出現
  - label: C
    content: 文字獄摧毀了宗族的獨大
  - label: D
    content: 靖康之禍後世族才完全消失
  group_stem: '◎資料一：關於世族沒落的背景，學者研究整理墓誌後發現，隋唐以後的世族逐漸脫離原本籍貫而往兩京聚集，因「家族葬地的轉移，通常也代表籍貫的變動」。換言之，可以從地理位置來觀察世族從魏晉到隋唐的權力結構的轉變。魏晉時代的世族由於漢朝察舉、太學等管道累積，加上九品中正制度，形成政治、社會、經濟都有相當濃厚的「士庶天隔」色彩。唐朝後世族往長安、洛陽兩京移動的原因，大體上跟考試舉辦地點、想離皇帝近一點，並且在地方卸任後必須回京覆命，為了方便而在兩京置產，此後也將歸葬處選在京城附近。

    資料二：宋朝的統治階層就是由一批一批來自各地，經由科舉進入朝廷的官員所組成。高官子弟一般不參加科舉，可蔭任位低俸薄的小官，不但世家大族難以形成，甚至出現了「富不過三代」的說法。宋後的社會領袖為鄉紳，其成員主要來自科舉，特別在明清，主要指目前在朝為官者或退休官員，以及其他有資格者，如監生、舉人、進士等身分。若跟過去的豪族、世族相比的話，他們主要是因為考取科舉的身分而不具備有鄉里的勢力基礎。但一方面雖然考取了功名具備入任資格，但官員名額有限，並非考上就能進入官場，於是這些人留在地方，成為地方政府的協助者或制衡者。因此，他們成為社會新領袖，在宗族也往往是族長或領導身分，到明清中後期，鄉紳控制地方社會的情況越來越普遍，對於中央而言卻是一種威脅，這些士人常在明倫堂議政，也引發政府的鎮壓，從雍正初年起，便禁止士人在明倫堂集會。'
