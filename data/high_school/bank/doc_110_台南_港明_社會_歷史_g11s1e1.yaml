  stem: 近代中國某一時期，地方力量左右國家政治發展，各個地方勢力間，常或聯合，或對立，形成一種不穩定的局勢。學者評論這個時期的特色：「很像十九世紀以來的國際政治，以勢力均衡為目標。原則是：一、各成員都力圖擴充自己的勢力；二、在戰爭中儘量不使戰敗者完全瓦解；三、在擴充勢力過程中不許某一成員取得絕對優勢。」這位學者描述的應是：
