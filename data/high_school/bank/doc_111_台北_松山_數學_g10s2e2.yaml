  stem: 設 n 為正整數，若$2000 < C_{0}^{2n+1}+C_{2}^{2n+1}+\ldots \ldots +C_{2n}^{2n+1} < 5000$，則 n＝＿＿＿＿。
  answer:
  - '6'
  answer_status: verified
  answer_source: answer_key
  explanation: '（1＋x）$^{2n＋1}$＝$C_{0}^{2n+1}+C_{1}^{2n+1}x+C_{2}^{2n+1}x^{2}+C_{3}^{2n+1}x^{3}+\ldots \ldots +C_{2n+1}^{2n+1}x^{2n+1}$

    x＝1 代入得

    $2^{2n+1}=C_{0}^{2n+1}+C_{1}^{2n+1}+C_{2}^{2n+1}+C_{3}^{2n+1}+\ldots \ldots +C_{2n+1}^{2n+1}$……………①

    x＝－1 代入得

    0＝$C_{0}^{2n+1}-C_{1}^{2n+1}+C_{2}^{2n+1}-C_{3}^{2n+1}+\ldots \ldots -C_{2n+1}^{2n+1}$ ………………②

    $\frac{①+②}{2}$得 $2^{2n}$＝$C_{0}^{2n+1}+C_{2}^{2n+1}+\ldots \ldots +C_{2n}^{2n+1}$

    2000＜$C_{0}^{2n+1}+C_{2}^{2n+1}+\ldots \ldots +C_{2n}^{2n+1}$＜5000

    ⇒ 2000＜$2^{2n}$＜5000 ⇒ 2n＝11 或 12

    ∴n＝$\frac{11}{2}$（不合）或 6，故 n＝6'
