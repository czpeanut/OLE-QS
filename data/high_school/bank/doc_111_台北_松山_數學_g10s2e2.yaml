  stem: 下列哪個選項的答案<u>不是</u>$C_{3}^{5}$？
  options:
  - label: A
    content: （x－$y^{2}$）$^{5}$ 展開式中 $x^{3}y^{4}$ 項的係數
  - label: B
    content: 從 5 本不同的書，任意挑選 3 本的方法數
  - label: C
    content: 設樣本空間 S＝｛ 1，2，3，4，5 ｝，S 中含有兩個樣本點的事件數
  - label: D
    content: 將 5 本不同的書，任意分給 3 人的方法數（書分完，每人所得不限）
  - label: E
    content: <u>小嵩</u>近日發生「缺蛋危機」，目前<u>小嵩</u>有 3 顆蛋，他計畫在下週一至週日的 7 天中，選擇其中 3 天吃蛋，若一天只能吃一顆蛋，且不能連續兩天吃蛋，求<u>小嵩</u>計畫的方法數
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：（x－$y^{2}$）$^{5}$ 展開後的一般項為$C_{k}^{5} (x)^{5-k}(-y^{2})^{k}$，k＝0，1，……，5

    ∴$x^{3}y^{4}$ 項的係數為$C_{2}^{5}=C_{3}^{5}$

    (B) ○

    (C) ○：$C_{2}^{5}=C_{3}^{5}$

    (D) ╳：每本書有 3 種分法，所求方法數為 $3^{5}$

    (E) ○：以□□□□表示 4 天不吃蛋，由 5 個空隙選 3 天吃蛋

    所求方法數為$C_{3}^{5}$

    故選(D)'
