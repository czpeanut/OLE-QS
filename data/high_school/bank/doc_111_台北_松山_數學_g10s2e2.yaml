- id: doc_111_台北_松山_數學_g10s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列各敘述哪些正確？
  options:
  - label: A
    content: 敘述「2023 是奇數且是質數」為「真」
  - label: B
    content: 若有兩集合 A、B，且 A $\subseteq$ B，則 A－B＝$\emptyset$
  - label: C
    content: 「$x^{2}$＞4」是「x＞2」的充分條件
  - label: D
    content: 設 n、k 為正整數，n$\geq$k$\geq$2 且 n－2$\geq$k，則$\frac{P_{k}^{n}}{k ！}=C_{k}^{n-2}+2C_{k-1}^{n-2}+C_{k-2}^{n-2}$
  - label: E
    content: 設 A、B、C 表三事件，且 P(A)＝P(B)＝P(C)＝$\frac{1}{3}$， P（A∩B）＝P（B∩C）＝$\frac{1}{6}$，A、C 為互斥事件，則 A、B、C 三事件中至少發生一件的機率為$\frac{2}{3}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：2023＝17×119 ⇒ 2023 是奇數，但不是質數

    (B) ○：A－B＝A－（A∩B）＝A－A＝$\emptyset$

    (C) ╳：x＞2 ⇒ $x^{2}$＞4 ∴「$x^{2}$＞4」是「x＞2」的必要條件

    (D) ○：$C_{k}^{n-2}+2C_{k-1}^{n-2}+C_{k-2}^{n-2}$

    ＝$(C_{k}^{n-2}+C_{k-1}^{n-2})+(C_{k-1}^{n-2}+C_{k-2}^{n-2})$

    ＝$C_{k}^{n-1}+C_{k-1}^{n-1}=C_{k}^{n}=\frac{P_{k}^{n}}{k ！}$

    (E) ○：P（A∪B∪C）

    ＝P(A)＋P(B)＋P(C)－P（A∩B）－P（B∩C）－P（A∩C）＋P（A∩B∩C）

    ＝$\frac{1}{3}+\frac{1}{3}+\frac{1}{3}-\frac{1}{6}-\frac{1}{6}-0+0=\frac{2}{3}$

    其中 P（A∩C）＝P（$\emptyset$）＝0

    P（A∩B∩C）＝P（（A∩C）∩B）＝P（$\emptyset$∩B）＝P（$\emptyset$）＝0

    故選(B)(D)(E)'
