- id: doc_111_台北_松山_數學_g10s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 投擲一公正骰子三次，每次出現點數分別為 a、b、c，試問下列哪些選項是正確的？
  options:
  - label: A
    content: a＜b＜c 的機率是$\frac{5}{54}$
  - label: B
    content: a＋b＋c＝7 的機率是$\frac{5}{72}$
  - label: C
    content: a、b、c 中最大者為 4 的機率是$\frac{37}{216}$
  - label: D
    content: （a－1）（b－3）（c－5）＝0 的機率是$\frac{91}{216}$
  - label: E
    content: ∣a－2∣＋$\sqrt{b-2}$＋（c－2）$^{2}$＝1 的機率是$\frac{5}{216}$
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：所求機率為$\frac{C_{3}^{6}\times 1}{6^{3}}=\frac{20}{216}=\frac{5}{54}$

    (B) ○：a＋b＋c＝7，如右表

    5.1 4.2 3.3 3.2

    共$\frac{3 ！}{2 ！}+3 ！ +\frac{3 ！}{2 ！}+\frac{3 ！}{2 ！}$＝3＋6＋3＋3＝15

    所求機率為$\frac{15}{6^{3}}=\frac{5}{72}$

    (C) ○：1 個 4：$C_{1}^{3}$×3×3＝27

    2 個 4：$C_{2}^{3}$×3＝9

    3 個 4：1

    共 27＋9＋1＝37

    所求機率為$\frac{37}{6^{3}}=\frac{37}{216}$

    (D) ○：（a－1）（b－3）（c－5）＝0$\Leftrightarrow$a＝1 或 b＝3 或 c＝5

    P（a≠1 且 b≠3 且 c≠5）＝$\frac{5\times 5\times 5}{6^{3}}=\frac{125}{216}$

    所求機率為 $1-\frac{125}{216}=\frac{91}{216}$

    (E) ○：① a＝b＝2，c＝1 或 3 ⇒ 2 種

    ② a＝c＝2，b＝3 ⇒ 1 種

    ③ b＝c＝2，a＝1 或 3 ⇒ 2 種

    所求機率為$\frac{2+1+2}{6^{3}}=\frac{5}{216}$

    故選(A)(B)(C)(D)(E)'
