  stem: '「他」是蒙兀兒帝國的第三位統治者（1556年-1605年在位），被認為是蒙兀兒帝國的真正奠基人和最偉大的皇帝。「他」最為人稱道之處在於，在其統治時期，「他」能對所有的信仰給予平等和自由的看待。與他之前的君主相比，帝國的文化和藝術在其統治時期達到頂峰。「他」的統治對印度歷史有很大的影響，在「他」統治時期，蒙兒帝國版圖及財富上都擴張到原來的三倍。建立了有力的軍事系統，也有效率的進行政治及社會的改革；「他」廢除了向非穆斯林人民實施的人頭稅，任命非穆斯林為高級的行政及軍事職位，是首位獲得本土人士信任及效忠的蒙兀兒帝王。「他」體認到穩定的帝國和子民的合作及善意有關，因此「他」翻譯梵語文學，參與國內的慶典。在「他」統治後建立了蒙兀兒帝國多元文化的基礎。

    請問：「他」是誰？(2分)'
