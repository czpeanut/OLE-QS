  stem: '閱讀以下資料，回答問題： 資料一：我看見這些情形，正在詫異，韓麥爾先生已經坐上椅子，像剛才對我說話那樣，又柔和又嚴肅地對我們說：「我的孩子們，這是我最後一次給你們上課了。柏林已經來了命令，亞爾薩斯和洛林的學校只許教德語了。新老師明天就到。今天是你們最後一堂法語課，我希望你們多多用心學習。」我聽了這幾句話，心裡萬分難過。啊，那些壞傢伙，他們貼在鎮公所布告牌上的，原來就是這麼一回事！我的最後一堂法語課！ 資料二：這個亞爾薩斯，在西羅馬帝國滅亡後的居民本來就是屬於日耳曼族的阿勒曼人，原屬於哈布斯堡家族的領地。1552年，法國向東進行擴張，佔領了包括亞爾薩斯和洛林在內的德意志的大片領土。在三十年宗教戰爭中，德國被法國和瑞典打敗。1648年，交戰雙方經過長期談判，最終簽訂了西發里亞亞條約。按各約規定，德國正式確認法國在1552年佔領包括亞爾薩斯和洛林地區在內的廣大領土。亞爾薩斯開始接受法國統治。當地居民對法國統治者強力的語言和習俗不斷地予以抵制。當普法戰爭結束，亞爾薩斯成為新成立的德意志帝國的領土後，當地150萬居民中大約有5萬說法語的居民因自由遷移而遷移到法國居住。 資料三：都德對德國強迫阿爾薩斯人學說德語感到非常憤慨，可頗具諷刺意味的是，《大英百科全書》：「一戰後，法國政府企圖同化該地，特別是企圖用國立學校取代當地傳統的教會學校，並禁止德文報紙出版，然而德語是當地75％居民使用的書面語」。後果是：「亞爾薩斯自治運動蓬勃發展尋求法蘭西共和國內自治。」後來法國政府放棄了這些文化同化的措施，自治運動才停歇。二戰後的法國則直接驅逐了1871年後移入亞爾薩斯的德裔居民，學校上課一律用法語，街道和店鋪名字也只准用法語。這不就是最後一課的相反版本嗎？只不過小弗郎士心中的壞傢伙由德國變成了法國。

    (1)對於上面三則資料的描述，何者最適合？(2分)'
