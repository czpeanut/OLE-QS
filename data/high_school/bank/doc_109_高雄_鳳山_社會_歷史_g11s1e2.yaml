  type: calc
  page: 6
  stem: '資料一：南北戰爭後，由國會通過並經各州批准了一系列《憲法》修正案，旨在保障那些在戰爭時期已被林肯總統1863年的《解放宣言》解放的前奴隸享有完全的公民權。1868年批准的《第十四條修正案》的一個關鍵規定是：「任何一州不得制定或實施任何剝奪合眾國公民特權或豁免權的法律；任何一州未經正當法律程式不得剝奪任何人的生命、自由或財產；亦不得拒絕給予在其管轄下的任何人平等的法律保護。」 資料二：重建時期的這些憲法修正案的通過及其早期的施行，只是局部和暫時地在美國結束了對少數族群的歧視。國會根據它所具有的實施修正案的權力，通過了若干重大的民權法規。例如1875年的《民權法》（Civil Rights Act），禁止在公共交通、旅館、影劇院中實行種族隔離或歧視。 資料三；但是，即使是曾經通過了憲法《第十四條修正案》的國會仍然准許在國家首都華盛頓特區的學校中實行種族隔離。最高法院還給一些實行種族隔離的法律予以袒護認可。在審理1896年「普萊西部弗格森案」（Plessy v. Ferguson）時，最高法院支援各州有權要求在火車和其他公共和私人場所實行種族隔離，只要被隔離的設施「相等」即可。最高法院的多數法官的結論是，規定種族隔離的法律對黑人和白人產生同等的影響，沒有給任何一方打上低等的烙印。州還可以有理由確定，這些法律是促進公共安定秩序所必需的。

    美國為了解放黑奴與否，加上南、北各州矛盾，最後釀成內戰，各舉一例南、北雙方不同的主張。(4分)'
