  stem: '花磚博物館上的介紹，這樣寫著：「花磚是臺灣唯一進入聯合國教科文組織實質審查的文化。但每月都有花磚建築拆除，臺灣也逐漸失去重要的文化。但臺灣花磚分布極為分散，需要各位一起共同參與普查臺灣的花磚文化。」

    附圖（兩張臺灣傳統古厝建築照片）顯示：臺灣與金門傳統閩南式古厝的山牆脊墜與窗楣上，鑲嵌著色彩鮮豔、立體浮雕花卉幾何圖案的馬約利卡（Majolica）彩瓷花磚。

    有關花磚的起源與傳播，下列敘述何者是正確的？'
  options:
  - label: A
    content: 花磚的起源來自中華地區，最早與剪黏一樣為寺廟藝術的一環
  - label: B
    content: 西班牙統治臺灣時，傳入了北臺灣，接著在全臺灣開始造成流行
  - label: C
    content: 受到日本影響，所以臺灣民間稱為「tai-ra」（源自日語「タイル」）
  - label: D
    content: 阿拉伯人在唐宋時期，到中國進行貿易時，傳到東方，再從福建閩南地區，傳入臺灣
