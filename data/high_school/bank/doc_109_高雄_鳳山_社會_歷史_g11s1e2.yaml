    世足逢齋戒月考驗穆斯林球員 11:432014/06/28中央社中央社 穆斯林一年一度的齋戒月將在明天展開，儘管身為穆斯林的德國足球員厄齊爾不打算遵守，世界盃足球賽仍有許多遵循震戒月傳統的球員，現場將有醫護人員嚴加戒備。 在齋戒月期間，從天亮直至日落前，信徒都不得進食喝水、吸菸且必須禁絕性行為。齋戒是穆斯林需要奉行的5個義務之一。 隨著穆斯林國家伊朗和波士尼亞雙雙出局，阿爾及利亞首度踢進16強，30日對上德國大軍，齋戒月的考驗馬上來到。 效力英超名門兵工廠（Arsenal）的厄齊爾（Mesutozil）表示，世界盃還在「進行」，「今年不可能參與」。不過當阿爾及利亞國家隊對上德國隊時，幾乎全隊都要禁食。阿爾及利亞國家隊將仰賴國際足球總會（FIFA）禁食足球員專家之一、卡達的艾斯佩塔醫院（Aspetar clinic）運動醫學專家查拉比（Hakim Chalabi）說：「這段期間會提高受傷風險，尤其是下背部、關節與肌肉。」「主因是脫水，而非沒有進食。」「一場比賽打下來，球員流失高達6公升的水分。」查拉比說：「球員必須補充更多水分，我們也建議他們午睡時間拉長來補充睡眠。由於進食限制，穆斯林夜間的睡眠時數較短。」 擔任過迦納、喀麥隆與阿曼國家隊教練的李洛伊（Claude Leroy）表示，禁食的球員在巴西會遇到麻煩，因為大多數比賽都從下午1時或5時才開始。他說：「要嚴格遵守齋戒規定很難。」 阿爾及利亞國家隊隊長包赫拉（Majid Bougherra）證實，攝取充足水分是齋戒月最困難的部分，「但我們還OK，氣候不錯，有些球員可以延後禁食。我則是看看自己的體能狀況，但我想我會遵守齋戒月規定。」 齋戒月期間，在巴西的穆斯林應該至少會相對輕鬆些，大約下午5時30分就天黑了。倫敦奧運期間，齋月晚宴（Iftar）通常要等到晚上8時30分或9時。（譯者：中央社陳怡君）1030628

