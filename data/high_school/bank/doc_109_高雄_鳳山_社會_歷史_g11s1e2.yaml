- id: doc_109_高雄_鳳山_社會_歷史_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 蓋茨堡戰役在這個賓夕法尼亞小鎮的街上及其周圍地區持續了三天之久，此次戰役是內戰的轉捩點。戰後所發表的獻詞雖然很短，但卻是所有闡釋民主信念的最雄辯動人的演詞之一。 「八十七年以前，我們的祖先在這大陸上建立了一個新的國家，它孕育於自由，並且獻身給一種理念，即所有人都是生來平等的。當前，我們正在從事一次偉大的內戰，我們在考驗，究竟這個國家，或任何一個有這種主張和這種信仰的國家，是否能長久存在。我們活著的人應該獻身於那些曾在此作戰的人們所英勇推動而尚未完成的工作。我們應該在此獻身於我們面前所留存的偉大工作──由於他們的光榮犧牲，我們要更堅定地致力於他們曾作最後全部貢獻的那個事業──我們在此立志誓願，不能讓他們白白死去──要使這個國家在上帝庇佑之下，得到新生的自由──要使那民有、民治、民享的政府不致從地球上消失。」 請問：上述的演講詞，應該是哪一場內戰後所發表的？
  options:
  - label: A
    content: 英格蘭薔薇之戰
  - label: B
    content: 法國三亨利之戰
  - label: C
    content: 美國南北戰爭
  - label: D
    content: 中國武昌之役
