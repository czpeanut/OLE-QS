- id: doc_109_高雄_鳳山_社會_歷史_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1963年的那一天，法院面對主張種族隔離的阿拉巴馬州州長喬治．華萊士（George Wallace）的反對，下令取消阿拉巴馬大學的種族隔離。約翰．F．甘乃迪（John F. Kennedy）總統在當天晚上對全國發表的一次講話說：「我希望，每一個美國人，不論他住在哪裡，都會為這一事件和其他相關事件前駐足捫心自問。這個國家由來自許多國家與背景的人所創立。立國的原則是人人生而平等，只要有一個人的權利受到威脅，所有人的權利都被削弱。」隨後，在同一年的夏天，當時最重要的民權運動領袖小馬丁．路德．金恩（Martin Luther King,Jr.），通過他的「我有一個夢」的演說，動人心弦地表達出平等運動中的又一基本原則，把在華盛頓的民權大遊行推向高潮。馬丁．路德．金恩博士在他在簽署《解放宣言》（Emancipation Proclamation）、結束奴隸制的亞伯拉罕．林肯(Abraham Lincoln)總統的紀念堂前20萬人發表的講話中，對將公共政策及私人行為方式基於對的價值的成見的這種社會不公給予公開譴責。馬丁．路德．金恩大聲疾呼，「我有一個夢，夢想有一天我的四個小孩子將生活在一個不是根據膚色而根據內在品格來衡量他們的國度裡。」對於上面的文字敘述，何者正確？
  options:
  - label: A
    content: 1963年，種族隔政策是合憲的
  - label: B
    content: 1860年代，南北戰爭以後，美國各族群間已顯得平等
  - label: C
    content: 2020年的BLM遊行（Black Lives Matter），是爭取黑人法律上的平等地位
  - label: D
    content: 從《解放奴隸宣言》到《我有一個夢》美國黑人終於爭取到自己在法律上的平等地位
