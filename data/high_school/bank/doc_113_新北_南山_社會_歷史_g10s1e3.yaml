  group_stem: '請依據資料回答問題：

    資料一：「在尹仲容先生任內，適值政府實施耕者有其田政策，辦理水泥、紙業、農林、工礦四大公司移轉民營。尹仲容先生當面囑咐說：『政府為貫徹國父遺教，實施土地改革及耕者有其田政策，首先決將臺灣水泥公司轉讓民營，你應從速進行準備工作，促其早日實現。移轉民營後，尤希好自為之，以作示範。』」（辜振甫對尹仲容的追憶）

    資料二：「民國 54 年 1 月我奉命擔任經濟部長時，面對當時經濟情況，美國在當年 7 月起停止經援，同時糖價暴跌，引發證券市場一片混亂。加工出口區的設立是 50 年代出口擴張政策的一環。加工區的投資很低，就業人數高，因此投資報酬率很高。」（李國鼎關於加工出口區的敘述）'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
