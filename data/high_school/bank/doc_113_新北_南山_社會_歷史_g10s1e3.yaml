questions:
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 新竹的「金廣福」墾號及臺北的「陳賴章」墾號都是清領時期有名的大墾戶，也是清領時期特有的大租戶，通常他們取得土地的方法是
  options:
  - label: A
    content: 向政府提出申請，取得執照後開發無主地
  - label: B
    content: 直接向原住民購買非政府管理的生番地
  - label: C
    content: 合資經營自由拓墾民有地，再向政府繳租
  - label: D
    content: 非法取得原住民土地，再設法將其合法
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 早期臺灣的拓墾方式可選擇承墾熟番地，或向官府申請墾照開發無主地，因此答案為(A)。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺灣開墾之初，官方通常會把一大片土地授予墾戶開發，由墾戶擔負此地賦稅上繳的工作；墾戶之首通常稱之為墾首。而墾首會再把土地分租給眾多農民（有時這些農民還會再將所得的土地再分租出去），故而產生了一人負責繳納賦稅，農民繳交租稅的「大租戶」與「小租戶」的關係。另外，再加上熟番番社產權、所有權等問題，遂更複雜。簡而言之，在一塊土地上，官方認定的所有權、賦稅權，和真正實際擁有土地的所有權、處分權是在不同的人身上。導致賦稅不清楚、土地所有權無法確定；經年累月之後自然是賦稅制度上的一大障礙。針對上述土地問題發生後，臺灣歷代政權都試著想解決，有關其解決的敘述，下列何者為對？
  options:
  - label: A
    content: 日本政府頒布減四留六政策，發六成公債券給大租戶以維持其經濟優勢
  - label: B
    content: 1874 年沈葆楨奉命來臺駐防及開發時已提出改善方案，並開始清查隱田
  - label: C
    content: 清代劉銘傳、日治時代後藤新平皆對此問題有所作為，日治時代終解決之
  - label: D
    content: 劉銘傳藉由大租戶整理令，勒令大租戶交出地權，並以減稅之方法補償之
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)「減四留六」為劉銘傳推行的土地改革政策。(B)劉銘傳來臺後才開始清查隱田，推行土地改善方案。(D)此為日治時期的土地改革方式。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '少桐為了完成歷史暑假作業，特地到南部鄉間訪問當地老人的兒時生活，訪問內容如下：

    甲、劉阿媽說他小時候最喜歡跟著哥哥追五分車偷拿甘蔗來吃，那時還會沿著剛通車的縱貫鐵路軌道去城市裡探險

    乙、李婆婆說「三個保正八十斤」事件發生的那年我剛出生，家裡多一位成員，父親才下定決心改種好賣的蓬萊米

    丙、黃阿伯說要不是碰上大圳通水，讓家裡的田增加農產量，不然家中田地可能因為付不出田租而被地主收回

    請就三位老人家敘述的內容選出適合的選項'
  options:
  - label: A
    content: 這三位老人敘述的年代順序很有可能是(丙)→(乙)→(甲)
  - label: B
    content: 「米糖相剋」可能會影響到李婆婆的父親的計畫
  - label: C
    content: 劉阿媽冒險去探索的大城市極有可能是臺北市
  - label: D
    content: 黃阿伯的父親的身分應是小租戶，才會需要繳租給地主
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 甲、西部縱貫鐵路於 1908 年通車。乙、蓬萊米於 1922 年才成功研發出。丙、嘉南大圳於 1930 年完工。(A)年代順序為(甲)→(乙)→(丙)。(C)甘蔗產地在南部，因此劉阿媽冒險去探索的大城市可能為臺南市或高雄市。(D)日治時期的地主為小租戶，黃阿伯的父親應是佃農。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '附表是 1905 ～ 1940 年間，有關臺灣的統計資料，請據此表選出較適當的解釋：

    | 年度 | 1905 | 1910 | 1920 | 1930 | 1940 |

    | --- | --- | --- | --- | --- | --- |

    | P（％） | 74.86 | 55.11 | 47.77 | 47.16 | 44.4 |

    | O（％） | 19.56 | 40.4 | 44.81 | 44.89 | 45.92 |'
  options:
  - label: A
    content: 男女性別人口比例表
  - label: B
    content: 臺籍與日籍高級文官之百分比例表
  - label: C
    content: 閩籍與粵籍在臺人口百分比例表
  - label: D
    content: 農業與工業占全臺生產總額之百分比例表
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 1905 年的男女性別人口比例不可能差異如此大。(B) 1910 年代後的臺籍高級文官比例不可能與日籍如此接近。(C)臺灣閩籍人口百分比一直遠高於粵籍人口。因此答案為(D)日治時期的工業初以農產加工為主，1930 年代後改以軍需工業為主，工業產值於戰時首次超越農業產值。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 清領時期，某位西方傳教士獲准來臺灣傳教後，聽說北部沒有傳教士，故決定前往北部傳教。抵達滬尾後，他開啟北臺灣的福音事業，除設立多所教會外，還引進近代醫療與教育，對臺灣影響至深。請問該位傳教士為何？
  options:
  - label: A
    content: 馬偕
  - label: B
    content: 郭德剛
  - label: C
    content: 馬雅各
  - label: D
    content: 巴克禮
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)(D)三者的傳教足跡皆在南臺灣，僅(A)馬偕在北臺灣傳教。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 某位官員巡臺時，在一埤圳處留下碑文：「得俗吏百，不如得才吏一；得才吏百，不如得賢吏一也。……其區被旱百有餘里，閭閻待哺，……予為勸興水利，教以鑿陂開塘之法……鳳之士民，從大令之教而合力成之，所謂民情大可見者……眾復請予名其圳，以刊諸石。」此埤圳應與下列何者「特性」相同？
  options:
  - label: A
    content: 貓霧捒圳
  - label: B
    content: 嘉南大圳
  - label: C
    content: 八堡圳
  - label: D
    content: 瑠公圳
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從碑文可知這條埤圳乃由地方「賢吏」主導興修，非民間人士主導完成，因此為南部的曹公圳，與此相同特性的為(B)嘉南大圳，由臺灣總督府工程師八田與一設計興建。(A)(C)(D)三者為民間人士主導。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '臺灣歷史上多個政權都曾經想要針對土地制度做出改革，附表為各政權政策與實施目的之比較，下列何者正確？

    |  | 政權 | 政策名稱 | 目的 | 結果 |

    | --- | --- | --- | --- | --- |

    | (甲) | 鄭氏 | 軍屯 | 供給軍民糧食 | 為臺灣農業發展打下基礎 |

    | (乙) | 清朝 | 丈田清賦 | 清查隱田 | 引發中部地主抗官，僅北部較成功 |

    | (丙) | 日本 | 土地調查 | (1) 清查隱田 (2) 確立土地所有權在大租戶 | 留下詳實地圖，並且也根除臺灣多年來一田多主的現象 |

    | (丁) | 中華民國 | 三七五減租 公地放領 耕者有其田 | (1) 減低佃農的壓力 (2) 佃農盡量都能轉型成為自耕農 | 因為 228 事件記憶猶新，地主多半敢怒不敢言，沒有遭遇太多反抗 |'
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (甲)(乙)(丁)
  - label: C
    content: (甲)(丙)(丁)
  - label: D
    content: (乙)(丙)(丁)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(甲)(乙)(丁)的敘述正確。(丙)日治時期土地調查的目的有誤，應是確立土地所有權在小租戶。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 一位學者提到：「歐人東來使東亞商品成為全球市場的暢銷貨，促進東亞商品經濟的發展並創造巨額財富。但東亞各國喪失海權後，商品流通和貿易利潤為西洋人所控，東亞各國不能再『通過海貿而裕國』。財富的減少還迅速降低了本地的工藝和軍事技術發展能力，後者又使防禦能力降低，而進一步使當地的權益喪失，當地財富累積不足是導致社會發展停滯的重要原因」。根據上述，這位學者對大航海時代東亞地區的見解是
  options:
  - label: A
    content: 香料貿易的壟斷促使東亞國家慘遭殖民
  - label: B
    content: 大航海時代促使東亞傳統文明消失
  - label: C
    content: 東亞商品的熱銷促使中國海商集團興起
  - label: D
    content: 商品的暢銷並未帶給東亞國家實質幫助
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 這位學者認為東亞各國在喪失海權後，「不能再通過海貿而裕國」，且「使防禦能力降低」，並造成「社會發展停滯」，因此答案為(D)。(A)(B)(C)題文並未提及香料貿易、東亞傳統文明與中國海商集團。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 《前進福爾摩沙──十七世紀大航海年代中的臺灣》中指出：「16、17 世紀歐洲人東來是人類有史以來第一波全球化的開始，臺灣也從此開始了在東西海權圍繞交戰互動的歷史。」若以當時世界史的角度來檢視臺灣，我們應有的認識是
  options:
  - label: A
    content: 當時中國政府重視海上貿易，連帶牽動了臺灣地位的重要
  - label: B
    content: 西班牙為與葡萄牙競爭東亞霸權，在北臺灣築城進行統治
  - label: C
    content: 日本人欲以臺灣為南進基地，推動其「東亞共榮圈」的野心
  - label: D
    content: 此時期的臺灣成為了歐人、日人和漢人貿易角逐的重要據點
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此時中國明朝實施海禁政策。(B)西班牙的競爭對手為荷蘭。(C)此時日本海商僅將大員作為走私貿易基地。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 臺灣各時期的經濟發展都有令人引以為傲的「臺灣第一」，例如：(甲)製傘、製鞋、拆船、自行車、網球拍等 21 項產品列為「世界冠軍產業」；(乙)鳳梨、洋菇與蘆筍等罐頭，是臺灣外銷的「三罐王」；(丙)小筆電、筆記型電腦、主機板、液晶螢幕等 11 項產品產量名列世界第一。請問依臺灣產業發展史，下列排序何者正確？
  options:
  - label: A
    content: 乙甲丙
  - label: B
    content: 甲乙丙
  - label: C
    content: 丙乙甲
  - label: D
    content: 乙丙甲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)民生工業於 1950 年代開始發展，至 1960 年代後已能外銷。(乙)農產加工品為 1950 年代的主要出口商品。(丙)高科技電子產業為 1980 年代的重點產業，因此正確排序為(A)乙甲丙。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 1950 年代，政府的經濟發展策略是「以農業培養工業」。請問在此政策下，政府的作法「不包括」下列何者？
  options:
  - label: A
    content: 進行土地改革以增加農民的生產意願
  - label: B
    content: 外銷大量的農產品到美國以賺取外匯
  - label: C
    content: 以高關稅壁壘等措施來保護國內市場
  - label: D
    content: 以田賦徵實、肥料換穀獲取更多米糧
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)此時的農產品主要外銷至日本，並非美國。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 1945 年國民政府接收臺灣後，各項不當統治政策引發各種民怨，於是「狗（日本）去豬（國民政府）來」成為了當時人民對政權更迭的一種諷刺，最終也因此引發了「二二八事件」。請問這用語中的「狗」與「豬」在經濟政策上，有下列哪個同樣的作為，進而被臺人唾棄，認為兩者都是殘暴的政權？
  options:
  - label: A
    content: 貨幣改革
  - label: B
    content: 大量企業國營化
  - label: C
    content: 專賣制度
  - label: D
    content: 清查隱田
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 總督府與國民政府的(C)專賣制度皆有與民爭利之嫌，壓縮臺人企業的發展，因此被視為暴政。(A)(B)為一般政權的正常政策，不算暴政。(D)國民政府並未清查隱田。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 附圖為 1958 年 1 月李連春所寫的《肥料淺說》，這張封面照片彷彿在敘述著：「前方的農民手裡抱著一大束剛收割的稻穀，臉上滿是笑容，似乎在宣告只要用對肥料，稻穀就會豐收。」這是為了配合 1950 ～ 1960 年代臺灣實施的「肥料換榖」的政策。關於此政策，下列敘述何者正確？
  options:
  - label: A
    content: 目的為放利於民，以榖換肥料可以使餘糧消化，不致於造成價格崩盤
  - label: B
    content: 目的為供應軍民糧食以及扶植工業發展，結果卻不惜犧牲農民的利益
  - label: C
    content: 目的為充實內需，換到的榖物可以外銷賺取利益以達到進口替代目的
  - label: D
    content: 目的為貿易平衡，肥料為進口物品，透過政府兌換政策平衡貿易逆差
  assets:
  - key: s1_13_f1
    kind: figure
    file: doc_113_新北_南山_社會_歷史_g10s1e3/s1_13_f1.png
    crop:
      page: 3
      rect:
      - 441.45
      - 254.5
      - 564.3
      - 430.3
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 政府實施「肥料換穀」政策，目的在掌握更多的米穀以外銷，將農業所得轉移至政府和工業部門，以支撐軍公教人員的糧食給和工業發展，因此答案為(B)。
- id: doc_113_新北_南山_社會_歷史_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 20 世紀臺灣對外貿易發展史上，重要的貿易夥伴與進出口最大國因時而異。某個時期，美國從最大進口國轉變為最大出口國，日本則剛好相反。請問這樣的轉變發生時，與下列哪一場戰爭的時間重疊？
  options:
  - label: A
    content: 二次世界大戰（1939 ～ 1945）
