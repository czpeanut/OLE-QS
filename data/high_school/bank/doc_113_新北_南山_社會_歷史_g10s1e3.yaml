  stem: 文章提到：「……會社就加「租聲」（方言：提高租穀）向業主爭，業主們若自己有利益，那管到農民的痛苦，田地就多被會社租去了……。」可以看出賴和在描述日治時期哪項農業政策？
  options:
  - label: A
    content: 臺灣公共埤圳規則
  - label: B
    content: 臺灣農會規則
  - label: C
    content: 綠色革命
  - label: D
    content: 原料採取區域制度
  group_stem: '請依據資料回答問題：

    下面節錄賴和《一桿秤子》其中一段敘述：「……得參十六歲的時候，他母親教他辭去了長工，回家裡來，想租幾畝田耕作，可是這時候，租田就不容易了。因為製糖會社，糖的利益大，雖農民們受過會社刻虧、剝奪，不願意種蔗，會社就加『租聲』向業主爭，業主們若自己有利益，那管到農民的痛苦，田地就多被會社租去了。若做會社的勞工呢，有同牛馬一樣，他母親又不肯，只在家裡，等著做些散工。因他的氣力大，做事勤敏，就每天有人喚他工作，比較他做長工的時候，勞力輕省，得錢又多。又得他母親的刻儉，漸積下些錢來。到得參十八歲的時候，他母親為得參娶妻。就在村中，娶了一個種田的女兒。幸得過門以後，和得參還協力，到田裡工作，他一家生計，暫不覺得困難。得參的母親，在他二十一歲那一年，得了一個男孫子，不久後，就過世了。……」'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
