  explanation: 日治初期，臺灣文人為保存傳統中國文化而紛紛成立詩社，櫟社以「不材之木」作為社名，即自認是「無用之人」，因此答案為(C)。(A)新文學於 1920 年代才傳入臺灣。(B)櫟社具反日的批判意識，並非指責清廷。(D)詩社成立目的在保留漢文，並非鼓勵臺人起事抗日。
