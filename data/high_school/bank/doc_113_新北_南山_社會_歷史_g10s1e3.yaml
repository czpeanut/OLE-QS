  group_stem: '以下是民國 60 年代某位著名作家的文章，請依據文章回答問題：

    回國半個月，見到許多來友：大家最驚心的一個話題是：「工農兵的文藝，臺灣已經有人在公然提倡了！」……那些「工農兵文藝工作者」也許會說：「臺灣是開放的社會嘛，什麼東西都可以提倡的。」……北京未聞有「三民主義文學」，臺北街頭卻可見「工農兵文藝」，臺灣的文化界真夠「大方」，說不定，有一天「工農兵文藝」還會在臺北得獎呢，正當我國外遭逆境之際，竟然有人內倡「工農兵文藝」，未免太巧合了……這樣的作風，不能令人無疑。……說真話的時候已經來到，不見狼而叫「狼來了」，是自擾，見狼而不叫「狼來了」，是膽怯，問題不在帽子，在頭，如果帽子合頭，就不叫「戴帽子」，叫「抓頭」，在大嚷「戴帽子」之前，那些「工農兵文藝工作者」，還是先檢查檢查自己的頭吧。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
