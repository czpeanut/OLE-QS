  stem: 清代臺灣雖有很多宮廟的建立，但都只是官方祭祀，不能發展出祭祀圈或信仰圈。彰化南瑤宮不遠處，也有一座「天后宮」，亦祭祀媽祖，歷史也相當悠久，但因是官建，並沒有類似南瑤宮之信仰圈的形成。鹿港也是一樣，官建的新祖宮與民間所建的天后宮，香火簡直不能相比。請問下列有關此資料的詮釋何者較為適當？
