  stem: 傳統中國的農村經濟主要為「男耕女織」的生產型態，並因此發展出繳交穀物與紡織品的賦稅制度，穀物作為國家糧食來源，而織品經變賣後成為國家金錢來源。然而，清領前期的臺灣卻有「男耕，女不織」的現象，請問如何解釋此種現象較為合理？
