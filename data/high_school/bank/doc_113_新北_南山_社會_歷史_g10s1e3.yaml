    臺灣文人陳肇興，字伯康，號陶村，彰化人縣治人，祖籍漳州府平和縣。少年時入縣學，涉獵文史。彰化初建縣，學詩學風氣未興，讀書人進入縣學。後來彰化知縣聘請鹿港廖春波主講白沙書院，才開始以詩古文辭來要求秀才學生，知縣親身教授。致使詩風之風氣大開，彰化吟詠大盛；其中陳肇興與曾惟精、蔡德芳、廖景瀛有「白沙書院四傑」之稱。陳肇興於某年鄉試中舉人。而後自建書房及居處為「古香樓」，每日讀以讀書歌詠，樂在其中。其詩風多元，以采風詩及長篇抒懷詩見長。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
