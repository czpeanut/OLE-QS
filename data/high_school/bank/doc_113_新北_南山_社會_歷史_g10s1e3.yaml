  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(B)(D)發生於荷治時期，因此「某件事」最可能為(C)三藩之亂，鄭經曾響應起事反攻中國大陸失敗後，鄭氏便無法取得中國商品，英國亦結束雙方貿易關係。

    39.1950 年代為進口替代期，臺灣利用美援的進口物資，發展本地的(D)民生工業。

    40.1950 年代，政府鼓勵國人以美援的麵粉為主食，將價值較高的白米外銷賺取外匯，換取工業原料及機器的進口，以發展民生工業，因此答案為(B)。

    41.綜合兩則資料，政府將農業所得轉移至工業部門，因此可推知其政策與經濟目的為(A)以農業培養工業。(B) 1980 年代後。(C) 1970 年代。(D) 1960 年代。

    42.清領前期的臺灣為移墾社會，社會風氣粗俗無文，直至開港通商後，經濟繁榮才帶動文教興起，因此答案為(D) 19 世紀末。

    43.題文所述時代已是清領後期的定居社會，最可能的現象為(C)。(A)(B)(D)為清領前期移墾社會的現象，各族群以原鄉信仰、唐山祖宗族為主，男多女少使得女性社會地位相較中國大陸為高。

    44.由於總督府以國家權力保護日資企業，針對甘蔗推行(D)原料採取區域制度，因此限制農田的使用，使業主與農民皆無法反抗。

    45.(A)為 1970 年代鄉土文學作家，(B)(D)為日治時期的臺灣作家，三人的作品皆以反映臺灣社會實況為主，僅(C)連橫的《臺灣通史》從中國的角度看臺灣歷史，其內容並非關懷臺灣社會生活。

    46.(B)並非所有的作家都加入臺灣文化協會。

    47.(B)(C)(D)皆為 1970 年代臺灣所面臨的外交逆境，僅(A)蔣介石總統雖於 1975 年逝世，但不算是外交逆境。

    48.題文作者為余光中，其所抨擊的對象為 1970 年代盛行的鄉土文學，視之為附和北京政權的「工農兵文藝」，因此答案為(A)。(B)指 1950 ～ 1960 年代的現代主義文學。(C)指戰後初期盛行的反共文學。(D) 1980 年代解嚴後。

    49.「耕者有其田」為政府於 1953 年推行的土地改革，以實物債券及公營事業股票補償地主，因此答案為(B) 1953 ～ 1959 年代。

    50.資料二所述為 1960 年代實施出口擴張的背景，臺灣成立加工出口區吸引外商投資，(D)以加工中繼角色成為美、日國際分工體系的一環。'
