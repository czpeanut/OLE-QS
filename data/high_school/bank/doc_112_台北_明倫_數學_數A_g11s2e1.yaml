- id: doc_112_台北_明倫_數學_數A_g11s2e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: '空間一點 P 在第一卦限，已知 P 至 x 軸距離為$\sqrt{41}$，P 至 y 軸距離為$\sqrt{34}$，P 至 z 軸距離為 5，則：

    (1) P 點坐標為＿＿＿＿。

    (2) P 點對 xz 平面的對稱點坐標為＿＿＿＿。

    (3) P 點在 y 軸的投影點坐標為＿＿＿＿。'
  answer:
  - (1)（3，4，5）；(2)（3，－4，5）；(3)（0，4，0）
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)令 P（a，b，c），且 a，b，c＞0

    ⇒$\begin{cases}\sqrt{b^{2}+c^{2}}=\sqrt{41} \\ \sqrt{a^{2}+c^{2}}=\sqrt{34} \\ \sqrt{a^{2}+b^{2}}= 5\end{cases}$⇒$\begin{cases}b^{2}+c^{2}=41 \ldots \ldots \ldots \ldots \ldots \ldots \ldots ① \\ a^{2}+c^{2}=34 \ldots \ldots \ldots \ldots \ldots \ldots \ldots ② \\ a^{2}+b^{2}=25 \ldots \ldots \ldots \ldots \ldots \ldots \ldots ③\end{cases}$

    由$\frac{①+②+③}{2}$得 $a^{2}$＋$b^{2}$＋$c^{2}$＝50 ………………④

    由④－①得 $a^{2}$＝9 ⇒ a＝3

    由④－②得 $b^{2}$＝16 ⇒ b＝4

    由④－③得 $c^{2}$＝25 ⇒ c＝5

    故 P 點坐標為（3，4，5）

    (2)由(1)可知，P 點對 xz 平面對稱點坐標為（3，－4，5）

    (3)由(1)可知，P 點在 y 軸投影點坐標為（0，4，0）'
