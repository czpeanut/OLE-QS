  stem: 人體血液中的滲透壓值為7.7 atm，若某一飲料內只含葡萄糖和氯化鈉二種成分，已知每100 mL中含葡萄糖4.5克，則飲料內添加的NaCl質量約多少mg？（NaCl式量為58.5）
  options:
  - label: A
    content: '585'
  - label: B
    content: '310'
  - label: C
    content: '155'
  - label: D
    content: '55'
  - label: E
    content: '25'
  group_stem: 在健康意識抬頭下，消費者對於飲料的要求除了美味、解渴外，更要喝得健康！因應消費者需求，市面上有一種標榜「等滲透壓」概念的飲料，能使細胞輕鬆地吸收水分與適量的電解質，而不會造成身體任何負擔！其實市面上的飲料只要是高糖分的，幾乎都是高滲透壓飲料，飲料中除含葡萄糖、蔗糖外，也常含鈉離子和鉀離子等皆會增加飲料的滲透壓。建議不要太常喝這類飲料，不但解不了渴，還會造成細胞負擔，長期下來可能會有身體機能的耗損。試回答5-6題：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: π＝$C_{M}$×R×T×i，可得7.7＝(葡萄糖滲透壓)＋(氯化鈉滲透壓)＝$\frac{\frac{4.5}{180}}{0.1}$×0.082×310×1＋$\frac{\frac{m}{58.5}}{0.1}$×0.082×310×2，解得m＝0.155 g。故選(C)。
