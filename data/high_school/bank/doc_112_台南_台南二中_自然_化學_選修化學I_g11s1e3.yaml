  answer_status: verified
  answer_source: answer_key
  explanation: 根據拉午耳定律，苯的蒸氣中分壓$P_{苯}$＝$P_{苯}^{o}$×$X_{苯}$，其中$X_{苯}$為液相中苯的莫耳分率；二氯乙烷的分壓$P_{烷}$＝$P_{烷}^{o}$×$X_{烷}$，其中$X_{烷}$為液相中二氯乙烷的莫耳分率。故可得知苯的分壓$P_{苯}$＝300×0.4＝120 mmHg；$P_{烷}$＝250×0.6＝150 mmHg，總壓則為120＋150＝270 mmHg。蒸氣中兩物質的莫耳分率即為各自分壓與總壓的比值：苯為$\frac{120}{270}$＝0.44、二氯乙烷為$\frac{150}{270}$＝0.56。故選(A)(C)(D)。
