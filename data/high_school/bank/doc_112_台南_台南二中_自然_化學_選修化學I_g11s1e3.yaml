  stem: 若有重量百分率濃度相等之下列四種溶液：(甲) $C_{2}H_{5}$OH(aq) (乙) $C_{6}H_{12}O_{6}$(aq) (丙) CO($NH_{2}$)$_{5}$(aq) (丁) NaCl(aq)，下列敘述哪些正確？
  options:
  - label: A
    content: 同溫時之蒸氣壓：甲＞乙＞丙＞丁
  - label: B
    content: 沸點：丁＞甲＞丙＞乙
  - label: C
    content: 凝固點：乙＞丙＞甲＞丁
  - label: D
    content: 重量莫耳濃度：甲＝乙＝丙＝丁
  - label: E
    content: 百萬分點濃度：甲＝乙＝丙＝丁
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: ※(丙)應為CO($NH_{2}$)$_{2}$。 此四溶液的重量百分率濃度相同，故可假設其中均有等量的水、等重的溶質；此時可判斷溶質莫耳數比(甲)：(乙)：(丙)：(丁)＝$\frac{1}{46}$：$\frac{1}{180}$：$\frac{1}{60}$：$\frac{1}{58.5}$，同時也是這些溶液的重量莫耳濃度、體積莫耳濃度比。若需考慮依數性質則各乘上其凡特何夫因數i，可得$C_{m}$i比，(甲)：(乙)：(丙)：(丁)＝$\frac{1}{46}$：$\frac{1}{180}$：$\frac{1}{60}$：$\frac{2}{58.5}$。 (A)乙醇為高揮發性物質，故乙醇水溶液蒸氣壓最大，其餘則比較其蒸氣壓下降量，由$C_{m}$i比(丁)＞(丙)＞(乙)可得蒸氣壓(甲)＞(乙)＞(丙)＞(丁)；(B)乙醇為高揮發性物質，故乙醇水溶液沸點最低，其餘則比較$C_{m}$i，可得(丁)＞(丙)＞(乙)可得沸點(丁)＞(丙)＞(乙)＞(甲)；(C) 比較$C_{m}$i得(丁)＞(甲)＞(丙)＞(乙)，故凝固點大小為(乙)＞(丙)＞(甲)＞(丁)；(D)重量莫耳濃度為$\frac{1}{46}$：$\frac{1}{180}$：$\frac{1}{60}$：$\frac{1}{58.5}$，(甲)＞(丁)＞(丙)＞(乙)；(E)重量百分濃度相同，則百萬分濃度相同。故選(A)(C)(E)。
