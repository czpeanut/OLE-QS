  explanation: (A)熔點分別為甲（60℃）＞乙（40℃）＞丙（30℃）；(B)甲固體200秒上升60℃、乙固體300秒上升40℃、丙固體400秒上升30℃，由ΔH＝msΔT，三者的比熱s可表示為$\frac{\Delta H}{m\Delta T}$，又質量、加熱功率均相同，故比熱的比值即為$\frac{秒數}{\Delta T}$的比值＝$\frac{200}{60}$：$\frac{300}{40}$：$\frac{400}{30}$＝400：900：1600＝4：9：16；(C)甲熔化耗時300秒、乙熔化耗時400秒、丙熔化耗時500秒，故熔化所需的熱量不同；(D)因甲自200至500秒發生熔化，故在300秒時，有$\frac{1}{3}$的固體熔化成液體；(E)正確，加熱時熔化曲線為水平線者為純物質，混合物的熔化曲線會是斜直線。故選(A)(D)(E)。
