  options:
  - label: A
    content: 苯的蒸氣分壓120 mmHg
  - label: B
    content: 二氯乙烷的蒸氣分壓180 mmHg
  - label: C
    content: 溶液的蒸氣壓為270 mmHg
  - label: D
    content: 溶液蒸氣中苯的莫耳分率為0.44
  - label: E
    content: 溶液中二氯乙烷的莫耳分率0.56
  answer:
  - A
  - C
