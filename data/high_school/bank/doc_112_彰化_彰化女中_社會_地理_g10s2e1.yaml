- id: doc_112_彰化_彰化女中_社會_地理_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 聚落系統透過運輸網絡要素的連結，建立一套互動模式，有關交通的運輸路網的敘述下列何者正確？
  options:
  - label: A
    content: 彰化火車站：連線
  - label: B
    content: 臺中捷運系統：幹道
  - label: C
    content: 八卦山自行車道：節點
  - label: D
    content: 中部都會生活圈：腹地
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹所述係指不同等級的聚落透過交通幹線（如：道路、軌道）及節點（如：車站、停車場）連結成一個互動系統。此一得讓人、物、財相互流通的網絡系統即可稱為生活圈，亦可被視為系統中最高等級聚落的腹地範圍，故選(D)。
