  explanation: '(1)從圖中判讀 E4 的教堂（黑點）數量最多，代表此區人口密集需要許多中地提供相應的生活機能服務，因此重要的行政據點及商業活動亦可能聚集於此，故推論此地最可能是德倫郡的行政、經濟中心。

    (2)黑點代表教區教堂。教區教堂後演變為地方行政機構，提供並管理該行政地區的公共設施，以滿足當地居民的基本生活機能。'
- id: doc_112_彰化_彰化女中_社會_地理_g10s2e1_s2_4
  section: 2
  number: 4
  type: calc
  page: 12
  stem: '下表是 4 個都市 5 年間的部分人口資料，顯示這 5 年間這些都市經歷了一些變化。請問：

    | 都市 | 甲市 | 乙市 | 丙市 | 丁市 |

    | --- | --- | --- | --- | --- |

    | 出生率（‰） | 22.3 | 19.5 | 17.4 | 20.2 |

    | 死亡率（‰） | 4.9 | 5.8 | 6.6 | 4.7 |

    | 人口成長率（‰） | 16.4 | 13.7 | 14.8 | 16.5 |

    (1) 表中哪些都市有明顯的「都市化」現象？（全對才給分）

    (2) 某市因地價上漲、房價高漲及環境惡化等問題，近年部分人口逐漸外移至郊區，都市擴張的現象愈趨明顯。上述郊區化與都市擴張現象的出現，需要哪一條件的配合？（請用專門名詞回答）'
  answer:
  - (1)丙
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)核心概念為：自然增加率（出生－死亡）＋社會增加率（移入－移出）＝人口成長率。依此表計算得出丙市的社會增加率最高：14.8－（17.4－6.6）＝4。故推論丙市的都市化情形較為明顯。

    (2)當都市問題形成推力時，需要便捷的交通革新，包括多樣化的交通工具、密集交通路線及覆蓋範圍廣大的交通網絡等，才能促使居民得依賴便捷交通通勤往來市區與市郊，以便取得足夠就業機會及都市機能服務而提高移居市郊地區。'
- id: doc_112_彰化_彰化女中_社會_地理_g10s2e1_s2_5
  section: 2
  number: 5
  type: calc
  page: 12
  stem: '全球各地都市人口的成長特徵並不相同，下圖為 1950 ～ 2025 年間亞、非、歐、北美、南美五大洲的都市人口變化概況（2025 年為預估值）。請問：

    (1) 所謂「假性都市化」意指近 50 年來，都市未提供足夠的就業機會，但由於農村人口不斷外流至都市，導致都市化程度顯著上升的現象，而圖中「假性都市化」最為顯著的地區為何者？（請填代號）

    (2) 甲大洲於 2025 年都市化程度仍不及 50 ％，主因為何？（請以產業或經濟或推拉理論的角度擇一回答即可）

    (3) 請舉出一個丁大洲都市內部常見之問題。（多寫有誤仍會扣分）

    (4) 請舉出一個戊大洲在都市中心商業區常見的問題。（多寫有誤仍會扣分）'
  assets:
  - key: s2_4_f1
    kind: figure
    file: doc_112_彰化_彰化女中_社會_地理_g10s2e1/s2_4_f1.png
    crop:
      page: 12
      rect:
      - 220.2
      - 383.3
      - 397.9
      - 541.8
  answer:
  - (1)丁
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)從各州都市化發展程度高低及成長幅度判斷：甲為非洲，都市化程度最低，近代都市化成長幅度增加；乙為亞洲，因戰後產業轉型為勞力密集型等加工產業，近期都市化成長幅度快速，如：臺灣、新加坡、中國等。此亦可從圖中各州不同時期長條柱狀的成長幅度大小推論而得；丙為歐洲，因最早工業化及都市化地區，近期都市化程度已進入高而緩慢時期；丁為南美洲，因殖民影響（莊園式經濟、土地及財富分配不均）、戰亂、政府大量舉債及過度依賴單一產業出口的結果，使得該地經濟及社會發展不穩定。大量鄉村人口因無以維生被迫離開鄉村而遷入都市，都市人口快速成長卻因無足夠的基礎建設及就業機會，使得都市問題層出不窮，此又被稱為假性都市化現象；戊為北美洲，因現代工業發展成熟且吸引全球大量移民人口，都市化程度高且緩慢成長。

    (2)甲為非洲地區，多數國家仍以農礦業原料或初級原料加工出口為主要產業，且因基礎建設落後、各國社會及政治動盪問題，現代化工商業發展速度緩慢，使得多數居民仍居住在鄉村地區依賴農牧業為生。

    (3)南美洲因假性都市化現象，大量鄉村勞動力湧入都市而都市內部卻無法提供充足的就業機會及公共設施，致使都市問題層出不窮，包括貧富差距大、擁擠髒亂、治安不佳等。

    (4)戊為美國或加拿大所在的北美洲地區，其因現代化發展歷史較久且都市化程度亦高，使得都市中心商業區的住房老舊、擁擠吵雜、交通繁忙、地價及生活費昂貴等，促使多數居民遷移至郊區，使得都市中心商業區的長住人口外移嚴重。'
