- id: doc_112_彰化_彰化女中_社會_地理_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 進行地理探究與實作時，成員蒐集到 1960、1980、2000 和 2020 等 4 年彰化市工商消費電話簿，電話簿載有各行業營業場所的地址和電話號碼。該小組探究的主題最可能是下列何者？
  options:
  - label: A
    content: 彰化市都市機能結構變遷
  - label: B
    content: 彰化市都市住宅用地擴張
  - label: C
    content: 彰化市土地競租曲線消長
  - label: D
    content: 彰化巿都市成長的歷程
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 不同年代的電話簿記載有彰化市「各種工商行業」，統計得分析各類行業數量隨著時代的消長變遷。而統計各類行業亦能呼應都市就業人口比重，依此便可推論(A)彰化市都市機能結構變遷。
- id: doc_112_彰化_彰化女中_社會_地理_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '右表為 A、B 2 種商品的商品圈及商閾，若該地吻合中地理論的所有假設，且所有居民均可購得 A、B 2 種商品，則下列哪 2 項說明較合理？(甲)提供
    B 商品的商店數目較多(乙)居民對 A 商品需求頻率較高(丙)提供 A 商品的中地等級較高(丁) A、B 市場區域必相鄰或靠近

    |  | 商品圈 | 商閾 |

    | --- | --- | --- |

    | A | 60 公里 | 40 公里 |

    | B | 15 公里 | 5 公里 |'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從表中商品圈及商閾的大小可判斷 A 商品等級較 B 高，故提供 A 商品的中地等級較高、中地數量較少，居民對 A 商品的需求頻率亦較低。而
    B 商品的市場區域涵蓋在 A 商品的市場範圍內，此將使得該區居民均可在合理範圍內取得 A、B 2 種商品。依此概念判斷僅有(甲)(丙)敘述正確，故選(B)。
- id: doc_112_彰化_彰化女中_社會_地理_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 2019 年政府宣布為「地方創生元年」，其中「地方創生」是指地方結合當地的地理特色與人文風情，發展出適合自身的產業，進而吸引居住都市的青年人口回流鄉村定居就業。若成功推動此政策，將可能造成下列哪些情況？(甲)都市人口老化減緩(乙)都市的推力增加(丙)鄉村的扶養比下降(丁)鄉村的拉力增加(戊)城鄉的中間障礙減弱
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 丁戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '題目中說明此政策旨在吸引都市青年回流鄉村定居就業，故推論此政策所採取策略為(丁)增加就業機會來提高遷移鄉村的拉力。當鄉村地區青壯年人口增加後，(丙)扶養比則會隨之下降。扶養比公式：（幼年人口＋老年人口）÷
    壯年人口 × 100％。故選(C)。

    6.1905 年以來的臺灣人口轉型大致可分 3 階段：(1) 20 世紀初，高穩定階段：出生率高、死亡率高，自然增加率低且人口總數少；(2) 20 世紀中，擴張階段：出生率高、死亡率快速下降，自然增加率高且人口總數快速增加；(3)
    20 世紀後，低穩定階段：出生率低、死亡率低，自然增加率低且人口總數雖高但增加速度慢。依此推論僅(甲)(戊)符合題意，故選(B)。

    7.(C) 2006 年雪山隧道通車，高速公路縮短宜蘭聯外交通的時空距離，刺激宜蘭休閒觀光業的發展，進而帶動農舍興建供作民宿經營的風潮。

    8.依國際定義，65 歲以上人口占總人口比率達 7 ％稱為「高齡化社會」（aging society）；達 14 ％稱為「高齡社會」（aged society）；達
    20 ％稱為「超高齡社會」（super-aged society）。依此標準判定甲乙丁屬於高齡化社會；丙戊己屬於高齡社會。故選(B)。

    9.商品圈係指商品得以販售的範圍，故經銷商可以銷售汽車的範圍即可被視為(D)商品圈。

    10.判讀三角形圖的方式：穿越該點繪製與 3 邊平行的線段，解讀各線段與 3 邊軸線相交後的較小數值，3 邊軸的數值相加應為 100 ％。其中，甲的第三級產業就業人口比例最高，屬於以服務業為主的產業階段，此時期的都市化程度亦達到最高；丙階段的第一級就業人口比例並非最低，代表其後續的經濟發展仍會帶動大量人口遷往都市，都市化程度仍會快速上升。故選(C)。

    11.(甲)乾燥氣候區透過就地取材的泥磚建造屋舍，因降雨稀少，故多不會刻意塑造平頂以外造型的屋頂；(乙)上海因「位置」處在中國東部沿海海岸線中點，加上位於長江出海口，此「位置」優勢促使其後成為中國輪船貨運運輸的最大吞吐港；(丙)坎培拉係以澳洲首都的需求興建發展；(丁)天際線所指稱的是該地區中心商業區密集及高聳大樓所構成的輪廓線圖，並將此視為該都市的獨特印象。故選(B)。

    12.(D)美國湧入大量移民且其背景教育程度較低，婦女生育年齡不僅年輕且生育個數亦較高。此乃使得美國的平均生育率較其他已開發國家高。

    13.(C)愈高都市等級不僅代表該地都市人口規模較大，其工商業發展程度亦較高。如表中被罰款的都市皆為美國各地著名的都市，其在地產業總值高便有機會高薪挖角球員及繳付罰金。

    14.(A)《渡臺禁令》被視為人口移動過程中的阻礙因素。(B)以色列占地與戰爭迫使阿拉伯人移出，此情勢對遷出的阿拉伯人而言即為推力。(C)非洲黑人係被西方殖民母國人販迫使遷出故鄉至拉丁美洲從事危險、辛苦且薪資低廉的勞動工作，並非受吸引而自願遷出，此例不適宜以人口推拉理論解釋。(D)原居地的負面因素被視為人口遷出的推力。故選(B)。

    15.(A)土地使用分區管制係透過土地開發的產業類別、使用方式、建物興建密度與高度等，來確保開發程度不至於超出該地的環境負載力，亦讓該地居民的產業發展及基礎建設需求得以被滿足。

    16.(B)(甲)從圖中可見代表全臺人口成長率的長條逐期縮短，甚至於民國 106 後呈現負數；(丙)比較圖中新竹市的長條在不同時期皆高過於臺灣平均，而當一地人口增加率高過於全國平均時，便可推斷新竹市始終出現都市化現象；(丁)新竹科學園自
    1980 年成立迄今，其資訊通訊科技產業吸引大量青壯年人口移入（拉力），使得鄰近竹科的重劃區，包括竹北、關埔、竹東地區的人口增加快速（自然增加率及社會增加率皆高），其中又以高鐵站所在位置的竹北因擁有便捷交通條件而人口成長幅度顯著。

    17.A 代表出生人口數；B 為死亡人口數；C 為移入人口數；D 為移出人口數。故將自然增加人口總數（A－B）加上社會增加人口總數（C－D），便可計算出該地的人口變化的數額，故選(A)。(D)全球人口增減數額僅考慮自然增加情形，故屬於封閉的人口系統。

    18.同心圓型態的都市結構中，愈靠近中心的區位租愈高，代表僅有附加價值高的產業活動類型得以負擔都市中心高價的土地成本，多為商業活動，其次則為住宅區、農業區。依此概念判斷表格中各土地開發類別在各圈的土地占比，得以判定乙為商業；丙為住宅；甲為農業。故選(A)。

    19.依據題目區位商數的公式判斷區位商數值愈高者，該產業在該都市機能愈顯著。換言之，Ei／E 愈小（偏左側）、ei／e 愈大（偏上側），亦即圖中偏左上角的產業(B)乙區位商數值最高，此都市在此產業的專業化機能亦較為顯著。

    20.日本為已開發國家，已進入超高齡社會且出生率極高，其年齡中位數推估為 4 者最高，故判斷甲為日本。印度為開發中國家，目前正處於人口擴張階段，其年齡中位數推估為
    4 者最低，故判斷丁為印度。中國因實施一胎化政策，雖為開發中國家，但亦已提早進入低穩定人口轉型時期；相較於美國雖為已開發國家，但因其經濟發達、吸引大量海外青壯移民遷入該國。依此推論中國年齡中位數較美國高，故判斷乙為中國、丙為美國。故選(C)。

    21.扶養比計算公式為（幼年＋老年人口）／壯年人口 × 100％。故當壯年人口上升，則扶養比下降，反之則扶養比上升。從圖中壯年人口比例約於民國 100 年前達到最高點，推論臺灣扶養比從下降趨勢逐步改為向上提高，故選(C)。

    22.在建蔽率與容積率最高值的前提下推估各區的最高樓層數量，其計算公式：容積率 ÷ 建蔽率。表中(C)戊區的樓層數為 8 層樓（560 ÷ 70＝8）。

    23.乙區建蔽率為 55 ％，代表該土地 1,000 坪 × 55 ％得興建建築物。換言之 1,000－550＝450 坪則屬於開放空間，故選(B)。

    24.(B)甲區的自然環境為暖溼的季風氣候及平坦沖積平原，自古發展出集約稻作農業，豐沛糧食及水源的條件下得以孕育出廣大且密集的人口聚集。

    25.戊、己為乾燥氣候區；庚為熱帶雨林氣候區；辛為乾燥寒冷氣候區。故選(A)。

    26.(C)第 Ⅲ 階段的出生率高於死亡率，不僅人口大量擴張，且因出生率下降，龐大人口得以獲得良好教育。

    27.圖中第Ⅱ階段為人口早期擴張階段，此階段的國家因引進各方面的現代技術，使得糧食增加（環境負載力提高）、醫療科學使得死亡率下降。在出生率維持高檔的情況下，死亡率下降致使人口數量較前一階段增長快速。當代許多新興但仍處低度的開發中國家，如：漠南非洲區，正值於此一人口轉型階段。故選(B)。

    28.一胎化使得出生率逐漸下降，而此時期的中國死亡率已處於相對低檔。依此概念判斷此時期的中國處於圖中第 Ⅲ 時期的(A)人口晚期擴張階段。

    29.(D)東南亞移民從開發中國家遷徙到已開發國家，如美國，符合題目中移民遷移路線敘述。

    30.(C)已開發中國家多因高齡化及少子化問題，使得勞力不足且勞動薪資高，尤其在基礎勞動力上更為短缺。開發中國家的移民雖能部分補足已開發國家勞動力短缺問題，但
    2008 年後的移民回流潮將使得已開發中國家勞動力短缺問題更加嚴峻。

    31.(C)圖中深色部分皆有隨著時間向外擴散趨勢，亦符合都市發展至一定程度後，隨著交通革新人口向都市郊區擴散的現象。

    32.(B)交通工具革新及交通路線的拓展，將有助於都市與郊區人口通勤的便利，更有利於都市人口遷往更便宜且居住品質更佳的郊區定居。

    33.(D)都市內部結構係描述都市內部各區土地利用類型的分布型態。

    34.鄰近運輸區會有擁擠、噪音及空氣等居住品質不佳等問題。依圖判斷，(C) 6 區鄰近 5 區，多數人不願意選擇此地居住，使得其地價較其他地區低廉。

    35.丙圖屬於多核心都市結構模式，說明該區擁有 1 個以上的中心商業區。都市向外擴張(甲)、郊區化、郊區重劃(丁)，皆可能使得都市人口向外聚集而出現其他商業區。故選(B)。

    36.甲階段的都市化程度極高且產業仍屬於第一級產業為主，故多數人仍居住在鄉村地區。(A)當地南亞、東非等地國家多屬於低度開發國家，其都市化程度仍屬於低且緩慢發展階段。

    37.(C)當都市逐漸發展出工商業活動時，因就業機會多且附加價值高，此吸力將吸引大量鄉村居民遷移到都市定居。

    38.丙階段特色為都市化程度高但增加速度緩慢，多出現在現代化歷史悠久的已開發國家，此類型國家的產業結構第二、三級產業比重最高。表格中第一級產業比重最低的(D)
    d 最符合此特徵。

    39.等級最高的聚落通常具備完整生活機能，包括低、中、高等級的各項服務。表格中聚落(C)具備各項等級的基礎建設，推論此聚落的等級為最高且其市場（商品圈）範圍亦最廣。

