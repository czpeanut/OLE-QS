  stem: 2023 年 3 月，在香港成名的亞洲武打女星楊紫瓊榮獲奧斯卡影后，成為這個獎項首位亞裔獲得者。在她感言中提到的：「各位女性，別讓任何人對妳說妳已經過了巔峰時期」，更是引發中國網友共鳴。中國職場女性因為生育、年齡、家庭問題，長期以來一直受到不平等待遇，但公開爭取女性權益的行動卻很難得到支持，甚至因為中國官方不允許任何可能壯大起來威脅當局的民間組織而受到打壓，楊紫瓊的發言對於長期被抑制的女性是莫大的鼓勵。有關上述的分析，下列哪些正確？
  options:
  - label: A
    content: 中國社會中可能仍存在貶低女性的性別歧視現象
  - label: B
    content: 楊紫瓊的發言展現女性自我認同的我族中心思維
  - label: C
    content: 中國女性的能見度與需求仍然因社會位置而缺乏
  - label: D
    content: 演藝工作因為不符合中國傳統職業期待而遭歧視
  - label: E
    content: 中國女性因參加民間組織而遭政府打壓社會地位
