- id: doc_112_台南_台南二中_社會_公民與社會_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2023 年，中國短影音平臺抖音 TikTok 的用戶突破 10 億。然而，TikTok 除了引起多國資安疑慮，平臺上流行的各種危險挑戰，更導致不少年輕用戶因此受傷。對此，行政院指示教育部研議向學生及家長宣導避免使用 TikTok 等危害個資、身心發展的 APP 軟體，而教育部主責的《媒體素養教育政策白皮書》逾二十年未更新一事也浮上檯面。《媒體素養教育政策白皮書》旨在培養民眾具備主體意識，對媒體傳播內容能夠進行獨立思考、判斷。有立委認為，新媒體平臺如 TikTok 等對年輕人的負面影響，顯示教育部應修正不合時宜的白皮書。下列對於媒體的說明何者最符合文中立委的言論？
  options:
  - label: A
    content: 新聞媒體藉由影像畫面傳遞訊息，透過攝影器材呈現，可保持客觀中立
  - label: B
    content: 閱聽大眾本身應該有責任，主動辨識媒體資訊，是現代公民應具備的能力之一
  - label: C
    content: 在資訊繁多的現代，時間就是金錢，由媒體協助篩選資訊，有利於閱聽人接收
  - label: D
    content: 在民主政治已然確立的臺灣社會，媒體公信力雖尚未建立，有「國家傳播委員會」把關，我們可以盡量相信媒體資訊
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 媒體識讀能力是現代公民應具備的能力之一。(A)新聞媒體藉由影像畫面傳遞訊息，第二手資料會有媒體再現的狀況，由新聞媒體挑選事件視角來傳遞，難以絕對中立。(C)由媒體協助篩選資訊，雖然可以節省閱聽人的時間，但媒體一旦無法自律，可能傳遞假訊息、未證實的消息。(D)國家傳播委員會（NCC）的把關多採事後審查，無法在媒體製播前審查未播出的內容，若閱聽人無法保有媒體識讀的能力，無法覺察有問題的媒體內容。
  tags:
    unit:
      code: CI-1-3-1
      book: 公民與社會1 民主與人權
