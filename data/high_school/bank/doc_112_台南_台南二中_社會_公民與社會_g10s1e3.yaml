- id: doc_112_台南_台南二中_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 公民老師在課堂上提出一個案例來佐證媒體素養的概念，他說：今天我在超商的報架上多家的報紙，有一半的報紙頭版標題為「香港要穩定，香港要發展」的事件，另一半的報紙頭版標題為「883 億全球人壽標下國華人壽」的案例。請問下列哪位同學的說明符合媒體素養的概念？
  options:
  - label: A
    content: 進進：出版社出現兩強競爭與對立，屬於市場競爭的結果
  - label: B
    content: 小平：展現出多元社會下，大家關注的議題不盡相同
  - label: C
    content: 大維：媒體的立場將影響人民知的權利是否能充分實現
  - label: D
    content: 阿尼：政府對媒體規範不足，應該要求報導內容一致
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)若出版社出現兩強競爭，可能是因為市場上遭到收購的現象，呈現不完全競爭市場。(B)從上文中可得知，當香港發生重大社會運動時，部分新聞媒體因政治立場的因素，選擇不再頭版上報導，可能僅有小版面報導。(D)為保障新聞自由，政府不應強制各家媒體的內容相同。
