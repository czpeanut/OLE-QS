    labeled_by: agent
    label_confidence: high
- id: doc_112_台南_台南二中_社會_公民與社會_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 政府可能會藉由各種手段對媒體進行管理與控制，使其製作出符合社會發展及社會需求的內容。下列政府對媒體的管理，何者<u>錯誤</u>？
  options:
  - label: A
    content: 《廣播電視法》第 24 條規定：「廣播、電視評論涉及他人或機關、團體，致損害其權益時，被評論者，如要求給予相等之答辯機會，不得拒絕」，是保護民眾的媒體近用權
  - label: B
    content: 《兒童及少年福利與權益保障法》第 44 條規定：「新聞紙以外之出版品、錄影節目帶、遊戲軟體應由有分級管理義務之人予以分級」，用以保護青少年的身心健康
  - label: C
    content: 補助公共電視節目製作，使其做出符合執政黨政治意識型態的節目
  - label: D
    content: 《人民團體法》第 50 條：「政黨依法令有平等使用公共場地及公營大眾傳播媒體之權利」，保護不同政黨使用媒體的平等地位
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 若執政黨補助公共電視的節目製作，節目的呈現方式礙於資方需做出符合執政黨政治意識的內容，無助於媒體的守門特性、監督政府角色。
