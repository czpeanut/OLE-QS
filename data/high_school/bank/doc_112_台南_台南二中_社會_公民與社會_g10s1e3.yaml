  section: 2
  number: 45
  type: multiple
  page: 11
  stem: 國家為了改善某些群體的處境差距與不平等，提供某些在社會生活上的優惠，這種政策稱為「積極平權措施」。然而，這也帶來相應「反向歧視」爭議─在資源與機會有限的情況下，一旦政府給予特定群體政策上的優惠，勢必將排擠原本優勢群體享有同等資源的機會，這意味著為了彌補弱勢族群所遭受的實質不平等的政策，讓原先的優勢族群遭到差別對待。從「反向歧視」的定義推測，下列哪些可能會被批判為「反向歧視」的情況？
