  section: 1
  number: 1
  type: single
  page: 1
  stem: 每年度國際盛大體育賽事（如奧運、亞運）等轉播賽，臺灣媒體總在中場休息片刻穿插廣告片段，UberEats「今晚，我想來點……」獲選 2021 年令人印象最深刻的廣告前三名。試根據上述判斷，下列選項何者<u>無法</u>說明此一現象？
  options:
  - label: A
    content: 媒體的置入性行銷
  - label: B
    content: 媒體資訊與商業利益
  - label: C
    content: 媒體與企業間互蒙其利
  - label: D
    content: 媒體與企業間的依附關係
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 置入性行銷是指刻意將行銷事物以巧妙的手法置入既存媒體，以期藉由既存媒體的曝光率來達成廣告效果。在受關注的體育賽事轉播中，高頻率插入廣告，讓閱聽人留下深刻印象達成廣告效果，故選(A)。
