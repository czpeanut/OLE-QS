  stem: 2022 年 1 月，立法院三讀通過《道路交通管理處罰條例》、《刑法》及《陸海空軍刑法》部分條文修正草案，對於酒駕者擴增處罰範圍、延長對累犯的處罰期限，也增訂得併科罰金的規定。而在修法前，法務部曾邀請其他部會討論修法方向，研議是否針對屢次酒駕者「一律入監矯正」。下列有關此次修法及其程序所欲維護的正義目的之敘述，何者正確？
  options:
  - label: A
    content: 政府擴增處罰範圍、增訂併科罰金是為矯正錯誤維護程序正義
  - label: B
    content: 法務部邀請其他部會研擬修法方向，是符合分配正義的合理性
  - label: C
    content: 將屢次酒駕者「一律入監矯正」，是達到預防錯誤的實質平等
  - label: D
    content: 以入監矯正方式處罰酒駕累犯，是期待以匡正正義來糾正錯誤
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為矯正個人所犯下的錯誤而增訂的處罰範圍、增訂併科罰金的作為應屬匡正正義。(B)應為程序正義。(C)將屢次酒駕者「一律入監矯正」，此為一視同仁的做法，應為矯正錯誤的形式平等。
