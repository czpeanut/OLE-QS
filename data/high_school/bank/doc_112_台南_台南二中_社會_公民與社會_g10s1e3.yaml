- id: doc_112_台南_台南二中_社會_公民與社會_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '表為媒體常用的各種置入性行銷之方式，下列有關置入性行銷的討論，何者正確？

    | 報紙專題 | 以「廣編特輯」或專欄設計 |

    | --- | --- |

    | 電視新聞 | 以報導或專題方式呈現（現場連線或跑馬燈訊息） |

    | 談話性節目 | 探討養生，實則販賣產品 |

    | 座談會 | 媒體主辦並大幅報導鼓吹議題 |

    | 戲劇節目 | 主角對話中帶出產品優點並宣揚 |

    | 電影 | 主角使用某產品或持續出現品牌 LOGO |

    | 歌手 MV | 歌手代言產品，在 MV 中露出增加曝光 |

    | 網路部落格 | 邀請版主體驗並撰寫感想 |

    | 線上遊戲 | 將任務與商品結合，增加玩家印象 |'
  options:
  - label: A
    content: 置入性行銷僅限於商品或物件的推銷，在意識型態上影響不大
  - label: B
    content: 僅增加閱聽者的相關印象，在實質的影響力上沒有真正的作用
  - label: C
    content: 優秀的置入性行銷能夠創造廣告主、製作單位與觀眾間的三贏
  - label: D
    content: 眾多網路部落客撰寫使用感想文，有助於消費者判斷商品好壞
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)置入性行銷除了商品推銷之外，還可能有政府廣告的置入影響民眾對政府施政的意識型態。(B)除了增加閱聽者的相關印象外，往後在購買商品時往往會選擇曾有印象的品牌或物品。(D)部落客以置入的方式撰寫感想文，消費者在觀看感想文後可能影響對商品的觀感。
