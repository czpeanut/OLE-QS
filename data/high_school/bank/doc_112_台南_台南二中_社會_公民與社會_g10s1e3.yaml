  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 楊紫瓊的發言主要是居於維護女權的地位，因女性在社會中的刻板印象多是為育兒、家庭付出，失去自我職涯追求，因此楊的發言是為女性發聲。(A)推測中國存有貶低女性的現象，故楊的發言是為了被貶低的女性發聲；(C)從題文中推測女性長期以來權益未受支持，官方也不允許女權發展，故中國女性的能見度低，且在社會中地位未受到支持。(B)楊的發言是以性別平權的角度，並非以我族中心主義思維。(D)女性受到歧視並非職業選擇，而是性別。(E)中國政府擔憂支持女權的行動會逐漸壯大，該勢力進而威脅政府當局。
