- id: doc_112_台南_台南二中_社會_公民與社會_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 香港反送中行動，與過去的社會運動發起方式有許多的不同。行動沒有特定的領袖，去中心化的社會抗爭完全經由網路的媒合，讓這些自發性的行動持續不斷的在香港展開，包含資源的補給，以及集結地點皆透過網路傳遞資訊。請問該抗爭顯示了資通訊科技帶來的何種影響？
  options:
  - label: A
    content: 資通訊科技讓人民能在家就參與社會運動，不須走上街頭
  - label: B
    content: 資通訊科技增加了人民參與公共事務的機會
  - label: C
    content: 參與公共事務僅限於都市，鄉村人民無法參與，造成了城鄉不平等
  - label: D
    content: 香港反送中行動是第一個透過網路串連成功的社會運動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 香港反送中行動透過網路的媒合讓欲參與的民眾得以自發性的行動，不論是資源的補給、集結地點等都是以網路進行聯繫，讓反送中行動得以集結與發動，故選(B)。
  tags:
    unit:
      code: CI-1-3-2
      book: 公民與社會1 民主與人權
