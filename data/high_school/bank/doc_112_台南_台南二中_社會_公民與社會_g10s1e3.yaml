  stem: 小明參加全校班聯會主席的競選，他提出的競選口號是想要成為「正義使者」，為維護全校學生的公平正義而努力。有關小明的政見內容敘述，下列何者正確？
  options:
  - label: A
    content: 為達到「分配正義」，校務會議應開放學生代表參與校規制定
  - label: B
    content: 為重視「匡正正義」，學校面對霸凌事件應研究預防輔導機制
  - label: C
    content: 為符合「程序正義」，每間教室都應架設功能齊全的投影設備
  - label: D
    content: 為實現「實質平等」，校內學生的權利義務都相等以杜絕特權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)開放學生代表參與校規制定，應為程序正義。(C)每間教室都架設功能齊全的投影設備屬於分配正義。(D)校內學生的權利義務都相同，符合形式平等內容。
