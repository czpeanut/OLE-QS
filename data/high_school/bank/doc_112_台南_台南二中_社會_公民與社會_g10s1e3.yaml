  stem: 無條件基本收入（Universal Basic Income）所指「不須審查、不附工作義務、無條件、定期發放給所有個人的現金給付」，進行倡議的無條件基本收入臺灣協會主張國內面臨日益惡化的收入不平等及停滯的薪資成長，基本收入是一個重要的方式去應對在臺灣日益嚴重的「殆危階級」之感。此外，基本收入是一種人權，應該由政府所保障，讓人人有基本的財務安全感。對於上述簡介，無條件基本收入最可能達成以下哪些目標？
  options:
  - label: A
    content: 改善社會階級的所得不平等
  - label: B
    content: 實踐福利國家社會福祉理念
  - label: C
    content: 保障國家人民基本生存權益
  - label: D
    content: 促進國內民眾投入勞動市場
  - label: E
    content: 落實國家財政收支平衡穩定
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 無條件基本收入主要倡議在於維護人權，無論哪一位人民都能受到政府保障的生存權益，若落實無條件基本收入的政策，則能夠達成(A)(B)(C)的目標。(D)該政策無法使人民更積極投入勞動市場中。(E)該政策將增加政府財政支出。
