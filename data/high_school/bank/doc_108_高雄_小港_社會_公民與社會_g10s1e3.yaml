  stem: 人們藉由媒體認識世界，但媒體所提供的資訊，有時會讓閱聽人產生偏見或刻板印象。下列新聞標題何者較妥當，「不會」讓閱聽人產生偏見或刻板印象？
  options:
  - label: A
