- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 英國人類學家泰勒定義文化:「是一個複雜的整體，它包括知識、信仰、藝術、道德、法律、風俗，以及人作為社會成員所能習得的任何能力和習慣。」依據泰勒的定義，請問下列哪一位同學的文化觀念是正確的？
  options:
  - label: A
    content: 美美:落後國家的人民通常比較缺乏文化
  - label: B
    content: 羽羽:不只人類有文化，動物也有其文化
  - label: C
    content: 珍珍:文化的傳承是透過遺傳而長久持續
  - label: D
    content: 凱凱:人類發明電腦和網路算是一種文化
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_18
  section: 1
