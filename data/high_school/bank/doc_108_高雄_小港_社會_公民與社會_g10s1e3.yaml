  section: 1
  number: 4
  type: single
  page: 1
  stem: 多數國家對於政黨的組織、運作，皆訂有基本的法律規範，以建立公平的政黨競爭原則，使每一政黨處於平等地位，並避免政黨運作違背國家利益。請問我國對於政黨的相關規範，主要是依據下列何項法規？
  options:
  - label: A
    content: 《憲法》
  - label: B
    content: 《政黨法》
  - label: C
    content: 《人民團體法》
  - label: D
