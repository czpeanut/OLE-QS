  section: 1
  number: 13
  type: single
  page: 2
  stem: 有關公共媒體的敘述，下列何者正確？
  options:
  - label: A
    content: 是較重視公益的商業媒體
  - label: B
    content: 接受政府預算，易受政治力干擾
  - label: C
    content: 英國的BBC、日本的NHK 與臺灣的TVBS 均屬於公共媒體
  - label: D
    content: 播放內容呈現普遍性與多樣性，適合民眾欣賞
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
