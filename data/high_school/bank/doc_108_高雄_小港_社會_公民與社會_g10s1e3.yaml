- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 媒體近用權包含「接近權」與「使用權」兩種概念。下列選項中，何者落實了「接近權」的理念？
  options:
