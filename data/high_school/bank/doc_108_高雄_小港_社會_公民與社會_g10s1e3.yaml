  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 英國自從加入歐盟之後，國內一直存有「是否退出歐盟」的爭議。2016年英國舉辦脫歐公投，最終以 51.89%：48.11%的投票結果獲得通過。然而，英國國會一直無法就脫歐的具體方案達成共識，導致脫歐時程一再延後。隨著脫歐派的政見陸續跳票，以及脫歐後的可能影響一一浮現，許多當初投票支持脫歐的英國人開始感到焦慮與懊悔。請問同於英國脫歐公投的推論，下列何者正確？
  options:
  - label: A
    content: 正反雙方的票數接近，可能已形成社會對立
  - label: B
    content: 公投是直接民主的展現，可確保決策的品質
  - label: C
    content: 國會擁有國家主權，有權力推翻公投的結果
  - label: D
    content: 公投並無法賦予政治人物推動政策的正當性
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 公民投票是指人民以投票的方式，直接對「事」所表達的意見。某縣經由人民提案，欲申請地方公民投票事項，請問下列何者可以成為公民投票案？
  options:
  - label: A
    content: 調高房屋稅，以抑制房價節節高漲
  - label: B
    content: 為實施小班教學，中、小學每班不得超過25 人
  - label: C
    content: 縣(市)政府之各單位行政首長出生地應在本縣(市)
  - label: D
    content: 因應廉能政 府的推動，本縣公務員減薪10%
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 根據統計，臺灣新移民的社會屬性如下：大部分為女性、源於婚姻關係、主要來自中國大陸和東南亞各國。請問下列敘述何者最為正確？
  options:
  - label: A
    content: 新移民的跨國婚姻反映了全球政治經濟架構下的人口流動
  - label: B
    content: 新移民與原住民族都是少數族群，因此享有相同的法律保障
  - label: C
    content: 新移民來自各國，我們沒必要對他們的社會文化有太多的瞭解
  - label: D
    content: 新移民為融入本地社會，應該在臺灣文化和母國文化間作一個選擇
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
