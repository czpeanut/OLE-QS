  stem: 學生團體因服貿議題發起占領立法院行動，網路流傳一篇文章形容當時的媒體：「要看警察打人就要看三立，要看學生丟石頭讓警察受傷就要看中天:支持服貿救經濟的要看TVBS，怕有服貿會亡國的要看民視。」 請問上文指出臺灣媒體的何種現象？
