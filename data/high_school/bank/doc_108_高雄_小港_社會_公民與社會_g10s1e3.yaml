  stem: 當《長期照顧服務法》在立法院審議時，針對財源籌措有保險制與稅收制兩種版本在討論，不過為擴大並穩定長照財源，《長期照顧服務法》部分條文已於106年1月26日經總統公布修正，增訂了菸品稅、遺產及贈與稅所調增的税收，用來挹注長照財源。有關財源籌措的敘述，下列何者正確？
  options:
  - label: A
    content: 稅收制比保險制更能落實使用者付費精神
  - label: B
    content: 若採稅收制，少子女化將不利於財源籌措
  - label: C
    content: 我國目前的長照政策財源，應屬於保險制
  - label: D
    content: 對於低收入的族群而言，保險制更有保障
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小慈出生在一個重男輕女的家庭，他特別崇拜英國前首相柴契爾、德國總理梅克爾等具有影響力的女性政治人物，希望自己有朝一日也能在政治上發光發熱，為社會服務，並向家族證明女性也有足夠的能力、決心參與公共事務。若小慈今年剛滿19歲，請問他還「無法」運用何種政治參與管道？
  options:
  - label: A
    content: 在公投案投票
  - label: B
    content: 加入政黨成為黨員
  - label: C
    content: 撰文支持罷免不適任的行政首長
  - label: D
    content: 投票支持與自己立場相近的議員
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2018年年底，高雄市換黨執政，新市長上任過了約半年，部分高雄市民發起罷免。請問與直轄市長罷免相關的規定，何者敘述正確？
  options:
  - label: A
    content: 市長必須出現違法的行為，市民才能發動罷免
  - label: B
    content: 罷免案若提案通過，就可以直接進行罷免投票
  - label: C
    content: 有效同意票若不到選區選舉人總數的四分之一，便不算通過
  - label: D
    content: 罷免案須獲得直轄市議會四分之一以上同意才能交付市民投票
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
