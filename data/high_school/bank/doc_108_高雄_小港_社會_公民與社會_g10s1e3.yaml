  type: single
  page: 2
  stem: Oriental 指的是「東方人」或「亞洲人」，美國早期用此字稱呼亞裔美國人，但自1960年起就有人認為這種用法其實帶有歧視色彩。美國聯邦眾議院已通過臺裔國會眾議員孟昭文(Grace Meng)的提案，將聯邦法律中 的 Oriental 字眼以 Asian Arnerican(亞裔美國人)取代。請問美國聯邦眾議院通過該提案，是基於何種觀點？
  options:
  - label: A
    content: 多元文化主義
  - label: B
    content: 我族中心主義
  - label: C
    content: 種族主義
  - label: D
    content: 文化進化論
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 1994年非洲的族群衝突，方興未艾。盧安達境內的胡圖族及圖西族互相屠殺。胡圖族人竟然進口了58 萬1 千把開山刀，去砍殺圖西族，並利用電台廣播要每個胡圖族人不要放過任何一隻「蟑螂」(指圖西族人)， 造成大約有80 萬圖西族人遭到屠殺，占盧安達境內圖西族人口的四分之三，盧安達總人口的11%，迫使數百萬難民逃往鄰國。就客觀來說，下列哪一個概念是最能符合這個事件所呈現出的文化現象？
  options:
  - label: A
    content: 文化相對論
  - label: B
    content: 我族中心主義
  - label: C
    content: 文化帝國主義
  - label: D
    content: 種族主義
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 南韓釜山大學美籍教授凱力在家中接受BBC 視訊專訪談論南韓情勢時，家中兩個小孩突然闖進房間，一位亞裔女子連忙衝進去將小孩拖出來，尷尬又逗趣的影片在全球爆紅。許多網友稱該女子為「忍者保姆」，有媒體稱其為「嚇壞的保姆」。但後來才發現該女子是凯力教授的妻子、小孩的母親。四位同學針對上述作討論，請問誰的說法最正確？
  options:
  - label: A
    content: 大雄:預設白人男子為雇主、亞裔女子為保姆，反映出性別和種族的刻板印象
  - label: B
    content: 靜香;不同族裔的人們組成家庭，是當代全球化社會中一種全球在地化的現象
  - label: C
    content: 阿福:媒體以「嚇壞的保姆」稱呼之，這侵害了全球亞裔女性所擁有的文化權
  - label: D
    content: 胖虎:網友將「照顧白人小孩的亞裔女子」視為保姆，是合乎常理的判斷結果
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
