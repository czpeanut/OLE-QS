  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 中央社董事長表示，媒體最重要的社會責任是為民主體制的健全發展與運行服務。請問其所強調的責任應是指何者？
  options:
  - label: A
    content: 媒體要為政府宣導政策，促進民眾對政策有所了解並接受
  - label: B
    content: 媒體只需在選舉期間客觀地進行報導，揚棄媒體政治立場
  - label: C
    content: 媒體扮演公共論壇監督政府的角色，促進公民社會發展
  - label: D
    content: 媒體全面開放給公民使用，讓公民自行產製節目發表心聲
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 行政院於2019年2月21日正式宣布，遵守司法院大法官會議第74 保障同志婚姻，並已完成專法草案。為消弭社會歧見，專法名稱避開「同性婚姻」詞彙，以《司法院釋字第748號解釋施行法》取代。該事法最終獲得立法院三讀通過。請問下列相關敘述何者正確？
  options:
  - label: A
    content: 行政院須遵守司法院大法官會議的結論，因此行政院與司法院是垂直分權
  - label: B
    content: 人民進行公民投票是直接民主的展 現，選出立法委員立法則屬於間接民主
  - label: C
    content: 法律規定公投案的同意票必須過半才算通過，以確保公投結果具有代表性
  - label: D
    content: 從「行政院提出同性婚姻專法草案」可得知，我國的行政權與立法權融合
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
