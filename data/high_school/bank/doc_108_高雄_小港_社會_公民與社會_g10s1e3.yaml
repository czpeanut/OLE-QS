  group_stem: '題 美國總統川普上任後，主張「美國優先」，陸續退出多項國際條約、協定及組織，詳見表格:

    | 巴黎氣候協定 | 全球多數國家一同參與，以抑制全球暖化，因應氣候變遷。川普政府認為該協定對美國不公平，不利於美國的經濟 |

    | --- | --- |

    | 中程核武條約 | 美國和前蘇聯(現由俄羅斯取代)銷毀射程在500~5，000公里之間的陸基彈道飛彈和巡弋飛彈·美國曾於2008年指控俄羅斯違反條約，而川普政府認 為此條約不利於美國的對中戰略 |

    | 跨太平洋夥伴關係協定 | 由太平洋地區10多國所簽署，將消除區域內的貿易障礙，並使區域內的經貿法規及標準趨於一致，例如對於智慧財產權的保障。川普認為這個協定對美國勞工不公平 |

    | 聯合國人權委員會 | 川普政府指控這個組織對其盟友以色列有偏見 |

    | 聯合國教科文組織 | 川普政府指控這個組織對其盟友以色列有偏見 |

    川普也公開聲稱《北美自由貿易協定》很糟糕，並重談簽署典墨加協定》;他還表達對世界貿易組織及北大西洋 公約組織感到失望，要求進行改革，否則不排除退出。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
