  type: single
  page: 1
  stem: 我們往往可以發現媒體會出現「置入性行銷」的現象，下列哪些屬之？(甲)購物頻道請模特兒親身示範某品牌最新款秋冬服飾的穿搭(乙)偶像劇男女主角通電話的劇情中，畫面出現手機品牌標誌(丙)談話性節目請來幾名醫師在節目中談論「如何吃出健康」(丁)美妝節目向觀眾推薦某一品牌的保養品具有神奇美白效果。
