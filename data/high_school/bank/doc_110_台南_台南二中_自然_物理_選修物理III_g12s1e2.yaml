    3. 所謂眼鏡的度數，即透鏡焦距之倒數D＝$\frac{1}{ f }$（D：透鏡度數，f：焦距），然而市面所稱的眼鏡度數其使用單位為CGS制，為上式MKS制的100倍。配戴眼鏡是為了使觀察物體的情況與正常人相同，故以明視距離（p＝25 cm）作矯正，代入透鏡成像公式：

    $\frac{1}{ p }$＋$\frac{1}{ q }$＝$\frac{1}{ f }$ ⇒ $\frac{1}{ 0.25 }$＋$\frac{1}{－d }$＝$\frac{1}{ f }$

    若d＞25 cm（遠視鏡）⇒ f ＞0（需配戴凸透鏡） 若d＜25 cm（近近視）⇒ f ＜0（需配戴凹透鏡） 若改以遠點作矯正：正常眼對遠點（∞）的物體，經眼鏡折射成像於矯正眼之遠點$q_{m}$處，再經水晶體折射成像於視網膜上。

    ∴$\frac{1}{ p }$＋$\frac{1}{ －q_{m} }$＝$\frac{1}{ f }$ ⇒ $\frac{1}{ ∞ }$＋$\frac{1}{ －q_{m} }$＝$\frac{1}{ f }$ ⇒ f＝－$q_{m}$（f＜0需配戴凹透鏡）

    (1)小明觀察阿罵的眼鏡，發現眼鏡外觀一邊凹一邊凸，鏡片中間部分較厚實、邊緣較薄，幫小明判斷阿罵的眼鏡是何種透鏡？（2分）

    (2)拿阿罵的眼鏡做實驗，拿手電筒發現光線聚焦在離鏡片中心距離20 cm處，試算出阿罵的眼鏡度數？（需計算過程）（3分）

    (3)小明有近視，戴上眼鏡後能看清楚周圍的事物。試描繪出從物體發出來的光線經小明眼鏡進入眼睛，成像在視網膜上的光路。（4分）（有透鏡的地方用薄透鏡討論，並將透鏡畫出來，且要求直線光路須用直尺畫）

