  - label: A
    content: 開管
  - label: B
    content: 閉管
  - label: C
    content: 一樣高
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: $f_{開}$＝n $\frac{v}{ 2ℓ }$，$f_{閉}$＝(2n－1) $\frac{v}{ 4ℓ }$ 故$f_{開,3}$＝3$\frac{v}{ 2ℓ }$＞$f_{閉,3}$＝5$\frac{v}{ 4ℓ }$ 故選(A)。
