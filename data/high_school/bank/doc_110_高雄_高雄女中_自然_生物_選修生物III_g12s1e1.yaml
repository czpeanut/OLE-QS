- id: doc_110_高雄_高雄女中_自然_生物_選修生物III_g12s1e1_s3_45
  section: 3
  number: 45
  type: single
  page: 7
  stem: 根據文章及圖形下列相關敘述，哪些正確？
  options:
  - label: A
    content: 高GI的食物進入腸胃後，胰島素分泌較緩
  - label: B
    content: 低GI的食物進入腸胃後，胰島素短時間較大量分泌
  - label: C
    content: 低GI的食物進入腸胃後會被分解，血糖的上升速度比較慢
  - label: D
    content: 高GI的食物通常比較好消化，相對說血糖上升速度就快很多
  - label: E
    content: 胰島素會使體內血糖下降，升糖素會導致體內血糖上升，兩者的生理作用互相抗
  group_stem: 'GI值是英文Glycemic Indx的簡稱，中文稱為「升糖指數」，是指吃下食物後，食物與基準值相比，讓人體血糖上升快或慢的狀況。

    GI值最開始的發展是要幫助糖尿病患者了解每種食物對血糖的影響力，以利控制血糖穩定。GI值是以「食用100公克的純葡萄糖後，血糖在2小時內升高的反應」為主要基準點（GI值＝100），再用這個標準去判斷其他食物的數值。

    ＊上圖顯示某人在進食不同食物後，體內血糖的變化。

    有時改變食物外型，GI的數值就會不同。例如：食物組成與狀態—「熟」度；不論是成熟或煮熟都一樣，未熟食物的GI值都會小於熟透的食物；纖維含量的多寡；通常食物本身的纖維越高的食物越不好分解，GI值就越低。食物加工方式：1.較少人為加工：當食物添加物越多、加工得越精緻，就容易讓食物的GI值升高。2.食用時的樣貌：讓水果保持完整食用，GI值相對比較低，若切成細塊或打成果汁吸收程度會高，GI值也會上升，3.烹調方式：白切、清蒸、水煮的食物GI值較低，油炸、勾芡、糖醋或加了調味料的食物GI值較高。4.咀嚼程度：比起狼吞虎嚥，細嚼慢嚥可以減緩血糖上升的速度，GI值會比較低。

    低GI的食物有下列的好處，消化慢，容易產生飽足感，攝取的食物量會減少；不易增加體內三酸甘油酯、總膽固醇及低密度脂蛋白膽固醇（LDL）；避免胰島素分泌過多，穩定血糖；不易增加體脂肪累積及糖尿病、心肌梗塞、中風、高血壓等心血管疾病併發症；幫助記憶力，間接促進學習能力。2012年，一項研究證明了「低GI飲食確實對降低總膽固醇和低密度脂蛋白膽固醇有幫助」。不過，控制飲食的分量跟均衡攝取、多運動反而比狂吃單一低GI食物更重要！

    文章擷取自https：//health010.w/posts/nutrion-04-healthy-meal-fruit-lose-weighl'
