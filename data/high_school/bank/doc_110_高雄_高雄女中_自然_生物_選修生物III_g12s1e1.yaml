  group_stem: '肌紅素是心臟和骨骼肌中主要的攜氧色素。相較於血紅素，肌紅素與氧結合能力不易受到氧分壓的影響，且更容易跟氧結合。當氧合肌紅蛋白形成時，每公斤的肌肉約可儲存十毫升的氧氣。當運動使肌肉耗氧時，肌紅素可以提供氧給肌肉，以維持較長時間的運動。

    肌紅素由擁有153個胺基酸的肌紅蛋白與鐵離子為中心的原血紅素組成。肌紅素結構中的活化中心在擔任輔基的原血紅素鐵離子位置，氧分子在此與鐵離子結合。而肌紅蛋白中鐵離子的電荷價數和攜氧的多寡，會使生肉呈現不同顏色。當肉是生的時候，鐵離子帶有＋2電荷，此時肌紅素容易結合氧分子，呈現鮮紅色。肉煮熟後，鐵離子失去一個電子，變成＋3電荷，且多結合了一個水分子，便呈現褐色。在某些情況下，例如將肉浸泡在微量亞硝酸中（像是醃牛肉或是火腿），因為鐵離子結合了一氧化氮，儘管經過高溫加熱之後，熟肉依然可以維持粉紅色。另外，烤肉時，鐵離子會結合一氧化碳，呈現粉紅色。據此原理，生肉肉品包裝會填充微量一氧化碳氣體，這種人工的方式，可以讓生肉肉品保存很長一段時間仍不變色。'
  explanation: (B)電子數量越少 (C)一氧化碳 (D) 一氧化氮
