- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '下列五組反應中，何組在室溫下的反應速率為甲大於乙？

    |  | 甲 | 乙 |

    | --- | --- | --- |

    | (A) | $2H_{2}$(g)＋$O_{2}$(g) → $2H_{2}$O(l) | 2NO(g)＋$O_{2}$(g) → $2NO_{2}$(g) |

    | (B) | $H^{＋}$(aq)＋$OH^{－}$(aq) → $H_{2}$O(l) | $5Fe_{2}^{＋}$＋$MnO_{4}^{－}$＋$8H^{＋}$ → $5Fe^{3＋}$＋$Mn^{2＋}$＋$4H_{2}$O |

    | (C) | $5C_{2}O_{4}^{2－}$(aq)＋$2MnO_{4}^{－}$(aq)＋$16H^{＋}$(aq) → $10CO_{2}$(g)＋$2Mn^{2＋}$(aq)＋$8H_{2}$O(l) | $5Fe^{2＋}$＋$MnO_{4}^{－}$＋$8H^{＋}$ → $5Fe^{3＋}$＋$Mn^{2＋}$＋$4H_{2}$O |

    | (D) | $CH_{4}$(g)＋$2O_{2}$(g) → $CO_{2}$(g)＋$2H_{2}$O(l) | $H^{＋}$(aq)＋$OH^{－}$(aq) → $H_{2}$O(l) |

    | (E) | $C_{2}H_{5}$OH(l)＋$CH_{3}$COOH(l) → $CH_{3}COOC_{2}H_{5}$(l)＋$H_{2}$O(l) | $Ag^{+}$(aq)＋$Cl^{－}$(aq) → AgCl(s) |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  - label: E
    content: (E)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)甲在室溫下幾乎不反應。

    (B)甲為酸鹼反應較快，乙為氧化還原較慢。

    (C)皆為氧化還原反應，但甲的 $C_{2}O_{4}^{2－}$ 須斷鍵，乙的 $Fe^{2＋}$ 則不須斷鍵。

    (D)甲在室溫下幾乎不反應，乙為酸鹼反應較快。

    (E)甲為酯化反應較慢，乙為沉澱反應較快。'
- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: '某一化學反應經過下列三步驟才完成：

    步驟 1：$H_{3}O^{＋}$(aq)＋HOOH(aq) → $HOOH_{2}^{＋}$(aq)＋$H_{2}$O(l)

    步驟 2：$HOOH_{2}^{＋}$(aq)＋$Br^{－}$(aq) → HOBr(aq)＋$H_{2}$O(l)

    步驟 3：HOBr(aq)＋HOOH(aq) → $Br^{－}$(aq)＋$H_{3}O^{＋}$(aq)＋$O_{2}$(g)

    在此化學反應中，下列對各步驟中的物質所扮演的角色，哪一敘述正確？'
  options:
  - label: A
    content: $H_{3}O^{＋}$ 是中間產物
  - label: B
    content: HOBr 是產物
  - label: C
    content: $Br^{－}$ 是催化劑
  - label: D
    content: $HOOH_{2}^{＋}$ 是反應物
  - label: E
    content: $H_{2}$O 是中間物
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '將三個步驟相加可得總反應式 2HOOH(aq) → $O_{2}$(g)＋$2H_{2}$O(l)

    (A)(C)其中 $H_{3}O^{＋}$ 與 $Br^{－}$ 在三個步驟中為反應物，但為出現在總反應式中，故兩者為催化劑。

    (B)(D) HOBr 與 $HOOH_{2}^{＋}$ 為中間物。

    (E) $H_{2}$O 是產物。'
- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e2_s1_13
  section: 1
  number: 13
