      rect:
      - 410.2
      - 548.9
      - 564.3
      - 659.8
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)加入催化劑，正逆反應速率都會增快。

    (B)斜線部分為可能產生有效碰撞之粒子。

