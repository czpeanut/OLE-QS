  stem: 已知反應：2A(g)＋3B(g) → 2C(g) 之速率方程式為 r＝k[A][B]$^{2}$，當 A 為 2 mol、B 為 1 mol 時，反應速率為 r，下列敘述何者正確？
  options:
  - label: A
    content: 定溫、定容下，再加入 2 mol A，則速率為 $\frac{54}{125}$r
  - label: B
    content: 定溫下，再加入 2 mol B，並將體積擴大 $\frac{1}{2}$，則速率為 $\frac{8}{3}$r
  - label: C
    content: 定溫、定容下，再加入 3 mol He，則速率為 r
  - label: D
    content: 定溫、定壓下，再加入 3 mol He，則速率為 $\frac{1}{2}$r
  - label: E
    content: 定溫、定壓下，再加入 6 mol B，則速率為 $\frac{49}{9}$r
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)定溫、定容下，濃度與莫耳數成正比，故速率為 2r。

    (B)體積增大為原來 $\frac{3}{2}$，A 濃度變為原來 $\frac{2}{3}$ 倍，B 的莫耳數變為原來 3 倍，則 B 濃度變為原來 2 倍，則速率為（$\frac{2}{3}$）(2)$^{2}$＝$\frac{8}{3}$r

    (C)定溫、定容下，濃度與莫耳數成正比，A、B 濃度皆不變，故速率仍為 r。

    (D)定壓下，體積與莫耳數成正比，故體積變為原來的 $\frac{1+2+3}{1+2}$＝2 倍，則 A、B 濃度皆變為原來的 $\frac{1}{2}$ 倍，故速率為（$\frac{1}{2}$）（$\frac{1}{2}$）$^{2}$＝$\frac{1}{8}$r

    (E)定壓下，體積與莫耳數成正比，故體積變為原來的 $\frac{1+2+6}{1+2}$＝3 倍，則 A 濃度變為原來 $\frac{1}{3}$ 倍，B 濃度變為原來的 $\frac{7}{3}$ 倍，故速率為（$\frac{1}{3}$）（$\frac{7}{3}$）$^{2}$＝$\frac{49}{27}$r'
