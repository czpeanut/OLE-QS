- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某反應機構：(1) A＋B → C，慢；(2) C＋2A → D＋E，快；(3) E → F，快。下列敘述何者錯誤？
  options:
  - label: A
    content: 本反應的速率方程式為 r＝k[A]$^{3}$[B]
  - label: B
    content: 本反應的淨反應式為 3A＋B → D＋F
  - label: C
    content: C 和 E 為中間物
  - label: D
    content: 第(1)步為瓶頸反應
  - label: E
    content: D 和 F 為產物
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)第一個反應最慢，故本反應的速率定律為 r＝k[A][B]。

    (B)將 3 個反應機構相加得淨反應式為 3A＋B → D＋F。

    (C) C 和 E 為中間物非初反應物，故為中間物。

    (D)第一個反應最慢故為瓶頸反應。

    (E)由淨反應式可知 D 和 F 為產物。'
- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列何者為勻相催化反應？
  options:
  - label: A
    content: 在製造氨的哈柏法中，使用鐵為催化劑
  - label: B
    content: 在雙氧水分解製氧的反應中，使用二氧化錳為催化劑
  - label: C
    content: 用接觸法製備硫酸
  - label: D
    content: 在汽車排氣系統中，使用觸媒轉化器
  - label: E
    content: 在臭氧層中，一氧化氮加速臭氧分解
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)氣態反應物與固態鐵為非勻相催化反應。

    (B)液態反應物與固態二氧化錳為非勻相催化反應。

    (C)接觸法製備硫酸催化反應為 $SO_{2}$＋$O_{2}$ → $SO_{3}$，催化劑使用固態的五氧化二釩，為非勻相催化反應。

    (D)觸媒轉化器使用金屬或金屬氧化物與廢氣反應，為非勻相催化反應。

    (E)一氧化氮與臭氧皆為氣態可混合均勻，為勻相催化反應。'
- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 若已知鋅與鹽酸的反應中，對 [$H^{＋}$] 而言為二級反應，且鋅固體之總表面積與反應速率成正比。今 25 ℃ 每邊長 3 cm 的正立方體鋅塊，與 1.0 M 鹽酸反應之反應速率為 s，則在 45 ℃，將相同鋅塊切成每邊邊長 1.0 cm 的正立方體，與 0.5 M 鹽酸反應的速率應為何？（假設溫度每升高 10 ℃，反應速率加倍）
  options:
  - label: A
    content: 0.5 s
  - label: B
    content: s
  - label: C
    content: 3 s
  - label: D
    content: 4 s
  - label: E
    content: 12 s
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意反應速率定律為 r＝k[$H^{＋}$]$^{2}$，濃度減為原濃度一半，反應速率變為原來的 $\frac{1}{4}$。

    每邊長 3 cm 的正立方體鋅塊切成每邊邊長 1 cm 的正立方體，表面積增加 3 倍。溫度增加 20 ℃ ，則反應速率增加 4 倍，故 r''＝3×4×$\frac{1}{4}$s＝3s。'
