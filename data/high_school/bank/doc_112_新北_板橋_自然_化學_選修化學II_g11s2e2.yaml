  stem: 從右圖判斷，下列敘述何者正確？
  options:
  - label: A
    content: 淺灰色線為加入催化劑後反應途徑，此時正反應速率增加，逆反應速率降低
  - label: B
    content: 斜線部分為可能產生有效碰撞之粒子，其減少的數量
  - label: C
    content: 催化劑不改變反應熱與粒子動能分布曲線
  - label: D
    content: 活化能是一種動能，而低限能是一種位能
  - label: E
    content: 催化劑可改變反應途徑與活化複合體，但不改變其反應級數
  assets:
  - key: s1_13_f1
    kind: figure
    file: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e2/s1_13_f1.png
    crop:
