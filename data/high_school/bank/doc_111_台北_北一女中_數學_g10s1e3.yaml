- id: doc_111_台北_北一女中_數學_g10s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 有一實係數多項式 f（x）除以（2x＋1）（3x＋4）（x－1）的餘式為 2x＋5，請問下列敘述哪些正確？
  options:
  - label: A
    content: f（x）各項係數和為 7
  - label: B
    content: f（x）除以 3x＋4 的餘式為 2x＋5
  - label: C
    content: f（x）除以（2x＋1）（3x＋4）的餘式為 2x＋5
  - label: D
    content: f（x）除以 2（2x＋1）（3x＋4）（x－1）的餘式為 x＋$\frac{5}{2}$
  - label: E
    content: $f\left( \frac{1}{2} \right)$＝6
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '設 f（x）＝（2x＋1）（3x＋4）（x－1）q（x）＋2x＋5

    (A) ○：各項係數和為 f(1)＝0＋2．1＋5＝7

    (B) ╳：∵2x＋5＝（3x＋4）．$\frac{2}{3}$＋$\frac{7}{3}$ ∴餘式為$\frac{7}{3}$

    (C) ○

    (D) ╳：∵f（x）＝2（2x＋1）（3x＋4）（x－1）．$\left( \frac{1}{2}q(x) \right)$＋2x＋5

    ∴餘式為 2x＋5

    (E) ╳：$f\left( \frac{1}{2} \right)$＝2．$\frac{11}{2}$．$\left( -\frac{1}{2} \right)$．$q\left(
    \frac{1}{2} \right)$＋2．$\frac{1}{2}$＋5

    ＝$-\frac{11}{2}q\left( \frac{1}{2} \right)$＋6

    ∵$q\left( \frac{1}{2} \right)$未知，故無法求得$f\left( \frac{1}{2} \right)$之值

    故選(A)(C)'
