  stem: 設三次函數 f（x）＝a（x－2011）$^{3}$＋p（x－2011）＋18，已知 f（2022）＝17，則 f（2000）的值為下列何者？
  options:
  - label: A
    content: '16'
  - label: B
    content: －17
  - label: C
    content: '17'
  - label: D
    content: －15
  - label: E
    content: '19'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝a（x－2011）$^{3}$＋p（x－2011）＋18 圖形的對稱中心為（2011，18）

    ∵$\frac{2000+2022}{2}$＝2011

    ⇒（2000，f（2000））與（2022，17）對稱於點（2011，18）

    ∴$\frac{f(2000)+17}{2}$＝18 ⇒ f（2000）＝19

    故選(E)

    〈另解〉

    ∵f（2022）＝a×$11^{3}$＋p×11＋18＝17 ⇒ a×$11^{3}$＋p×11＝－1

    又 f（2000）＝a×（－11）$^{3}$＋p×（－11）＋18

    ＝－（a×$11^{3}$＋p×11）＋18＝－（－1）＋18＝19

    故選(E)'
