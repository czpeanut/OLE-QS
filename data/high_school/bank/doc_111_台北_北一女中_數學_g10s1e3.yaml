- id: doc_111_台北_北一女中_數學_g10s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: '團結 Band 想舉辦專場表演，需從 The Wall 與 Legacy 兩個場館擇一，並決定票價，場館租金與成本資訊如右表，如預期票價訂為 800
    元時會有 720 位觀眾，每漲 50 元，便會少 60 位觀眾；每降 50 元，則會多 60 位觀眾，請問下列敘述哪些正確？

    |  | The Wall | Legacy |

    | --- | --- | --- |

    | 租金 | 15 萬 | 20 萬 |

    | 容納人數上限 | 600 | 900 |

    | ＊器材、人力成本 5 萬 |  |  |'
  options:
  - label: A
    content: 當票價訂為 800＋50x 元時，會有 720＋60x 位觀眾
  - label: B
    content: 如不考慮場館容量，當票價訂為 700 元時會有最高收入
  - label: C
    content: 如果表演想辦在 Legacy 場館，則當票價訂為 700 元會有最高利潤
  - label: D
    content: 如果表演想辦在 The Wall 場館，則當票價訂為 700 元會有最高利潤
  - label: E
    content: 如果有最高利潤，需選擇 The Wall 場館
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：當票價訂為 800＋50x 元時，會有 720－60x 位觀眾

    (B) ○：承(A)，總收入為 f（x）＝（800＋50x）（720－60x）

    ＝50．60（16＋x）（12－x）

    ＝3000（－$x^{2}$－4x＋192）

    ＝3000〔－（x＋2）$^{2}$＋196〕

    當 x＝－2 時，f（x）有最大值

    即票價訂為 800＋50．（－2）＝700 元時會有最高收入

    (C) ○：承(B)，當 x＝－2，即票價訂為 700 元時會有最高收入

    此時會有最高利潤，且觀眾數為 720－60．（－2）＝840＜900

    在 Legacy 場館的容納人數上限內

    (D) ╳：承(C)，票價 700 元時會有最高利潤，但此時觀眾數為 840＞600

    已超過 The Wall 場館的容納人數上限

    (E) ○：當票價訂為 800＋50x 元時，會有 720－60x 位觀眾

    承(B)，總收入為 f（x）＝3000〔－（x＋2）$^{2}$＋196〕元

    ① The Wall 場館總成本為 15＋5＝20 萬

    觀眾數 720－60x ≤ 600 ⇒ x ≥ 2

    此時最高利潤為 f(2)－200000

    ＝3000（－16＋196）－200000＝340000（元）

    ② Legacy 場館總成本為 20＋5＝25 萬

    承(C)，最高利潤為 700×840－250000＝338000（元）

    由①、②可得，選擇 The Wall 場館會有最高利潤

    故選(B)(C)(E)'
