- id: doc_112_苗栗_苑裡_自然_生物_選修生物I_g11s1e3_s3_25
  section: 3
  number: 25
  type: multiple
  page: 3
  stem: 下列關於端粒與端粒酶的敘述，哪些正確？（多選）
  options:
  - label: A
    content: 同種生物不同種類的細胞，其端粒序列與重複數目也不一定相同
  - label: B
    content: 人類一般正常細胞的端粒可隨著分裂次數的增加而逐漸縮短
  - label: C
    content: 人體細胞衰老，主要是因為端粒酶的基因異常
  - label: D
    content: 抑制端粒縮短或增加端粒酶活性，都可能延長細胞的存活
  - label: E
    content: 端粒位在DNA的5'
  group_stem: '生物細胞在體內和體外的複製能力都有限，絕大部分的細胞經一定次數分裂後就不再具分裂能力，稱為細胞衰老（cellular senescence），此狀況與細胞的端粒（telomeres）長短有關，端粒是一種真核細胞染色體末端的DNA片段，這個片段由富含G的重複序列和蛋白質組成，不同生物在這個片段上的組成不同，例如：人與老鼠的重複序列為TTAGGG，而蛔蟲為TTAGGC，但另外一種Tetrahymena（單細胞纖毛原生動物）的重複序列則為TTGGGG。不同生物的端粒核酸序列之重複數目均不相同，有時亦會發現同一生物的不同種類細胞之重複數目會出現差異，例如在Tetrahymena這個物種的重複為70，但人類的重複次數可達2,000次。

    DNA的複製過程中，端粒上會有一小段DNA無法被複製，使得端粒的長度會隨著細胞分裂次數的增加而縮短，當端粒縮短至一定長度時，細胞就不再分裂，即所謂衰老。端粒的序列中雖然沒有攜帶基因，但這個序列卻與細胞的存活有關。一般而言，細胞在經過幾代的分裂後，染色體會愈來愈短，終將趨於死亡。但若如此，單細胞生物豈不早就滅絕了？因此，科學家推測DNA複製中，除DNA聚合酶外，可能另有酶來協助端粒複製。

    1985年，<u>美國</u>科學家<u>格里德</u>（Greider）和<u>布拉本</u>（Blackburn）在Tetrahymena中發現一種能在染色體3'' 端加入一小段DNA序列的酶，稱為端粒酶（telomerase）。功能是使端粒長度得以維持甚或延長，在端粒酶蛋白的結構中，還包含一小段RNA作為模版（template），以合成端粒DNA，加到染色體末端。1990年，科學家提出假說，認為Tetrahymena依賴端粒酶得以維持生存，當端粒酶基因突變、細胞就會死亡。格里德後來又發現人類許多體細胞缺少端粒酶，體外培養時，一般只能分裂80～90次；而年老人的細胞則只有20～30次，顯示人類體細胞隨分裂次數增加，其後代細胞更顯衰老。試根據本文，回答下列問題：'
