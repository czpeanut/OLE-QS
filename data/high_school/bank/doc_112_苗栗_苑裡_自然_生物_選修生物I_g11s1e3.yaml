  stem: 四種胺基酸：甲硫胺酸（Methionine）、脯胺酸（Proline）、離胺酸（Lysine）、精胺酸（Arginine），各有1、4、2、6組對應密碼子，假設一多肽鏈序列為[N端]—甲硫胺酸—脯胺酸—離胺酸—精胺酸—[C端]，其中N端為甲硫胺酸的—$NH_{2}$端，下列敘述哪些正確？
