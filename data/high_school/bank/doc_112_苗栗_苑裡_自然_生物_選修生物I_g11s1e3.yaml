- id: doc_112_苗栗_苑裡_自然_生物_選修生物I_g11s1e3_s3_22
  section: 3
  number: 22
  type: single
  page: 2
  stem: 根據上文與所學，修飾過後的新冠肺炎病毒mRNA進入人體細胞後，會發生下列哪一現象？
  options:
  - label: A
    content: 被限制酶切割
  - label: B
    content: 被轉譯成蛋白質
  - label: C
    content: 經修飾酶催化後與人體細胞共存
  - label: D
    content: 扮演抗原角色並激發人體的免疫反應
  group_stem: '1990年，科學家將全裸、無保護的mRNA注入小鼠肌肉，發現此外來mRNA被細胞轉譯為蛋白質，這個成果激發了無限的想像。1993年，人類首次將流感病毒蛋白mRNA注入動物體內，活化能辨認該蛋白的T細胞，開啟了人類發展mRNA疫苗的研究。

    但科學家很快地發現，mRNA疫苗在理論上雖然可行，但在真實世界卻窒礙難行，因為人體非常討厭外來物。人體的防禦系統，會摧毀外來的RNA、DNA，但奇怪的是，細胞自己也有RNA，為什麼不會引起免疫反應呢？

    其實人體內的DNA會被修飾以避開免疫系統的攻擊，最常見的修飾是在DNA複製後在胞嘧啶上加甲基。而細菌早就演化出利用核酸修飾來辨識敵我的機制，大約$\frac{1}{4}$的細菌都擁有一套或多套的「限制與修飾」系統，每1套都包含1個限制酶和1個修飾酶，能辨識同樣的標靶序列（通常4～8個鹼基對）。經修飾酶催化、被修飾過的序列就會被保護，反之，外來DNA在沒有修飾之下，就會被限制酶切割。

    細菌的mRNA基本上都沒有修飾，而哺乳類的mRNA在轉錄後通常會在特定鹼基加上超過100種的修飾，最常見的就是鹼基第5位置加上甲基的5-甲基胞嘧啶（5mC）、第6位置加甲基的6-甲基腺嘌呤（6mA），還有核糖第2位置加甲基的修飾等等，這些修飾不會改變轉譯的產物，只會增強mRNA的穩定性和轉譯效率。

    新冠肺炎的mRNA疫苗使用的材料是攜帶病毒表面棘蛋白的基因序列的人造mRNA，進入人體細胞之後會被核糖體轉譯而產生棘蛋白，並呈現在細胞表面，扮演抗原的角色，激發人體的免疫反應，但這些mRNA必須經由修飾才能逃避人體免疫系統的攻擊。'
