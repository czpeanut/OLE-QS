  group_stem: '2015年的3位諾貝爾獎得主<u>林達爾</u>（Tomas Lindahl）、<u>桑賈爾</u>（Aziz Sancar）與<u>莫瑞克</u>（Paul Modrich）發現了生物體內偵測與修護受損DNA的分子機制，讓未來能夠進一步了解一些遺傳性疾病、癌症的形成和老化的原因。DNA會進行一個緩慢的衰變；胞嘧啶會脫去一個胺基（-$NH_{2}$）而變成尿嘧啶（uracil , U），進而導致鹼基配對的改變，如果沒有修補，則會在下一次DNA複製時造成突變。

    <u>林達爾</u>（Tomas Lindahl）在1974年發現一組稱為醣苷酶的酵素，這些酵素可以偵測DNA中自然衰變產生的尿嘧啶，並將其切除，另一個酵素則會接續移除DNA鏈上殘缺的核苷酸，最後由DNA聚合酶和DNA連接酶把缺口縫合，以確保DNA的完整性，這是修復DNA的第一個機制。

    <u>桑賈爾</u>（Aziz Sancar）發現DNA在受到紫外線的破壞後，會有兩種修補的機制：光分解酵素修補機制和核苷酸切除修補機制。當紫外線照射到細胞的DNA時，鄰近的兩個胸腺嘧啶會產生二聚體，進而導致基因的突變。他發現有3個酵素以分工合作的方式，偵測和移除受到紫外線破壞的DNA（胸腺嘧啶二聚體），然後再把破損的DNA依鹼基配對的方式修補回去，以確保DNA的完整性，這是修復DNA的第二個機制。

    DNA複製的過程中可能會出錯，所以必須要確認哪一鏈是母代DNA，哪一鏈是子代DNA，把誤配的子代DNA切除，再依照母代DNA的鹼基序列修補回去。<u>莫瑞克</u>認為：在DNA複製的過程中，母代DNA已經被甲基化，子代DNA剛合成出來而尚未甲基化，參與誤配修補的酵素由此可以辨認出未被甲基化的子代DNA並予以切除，然後再依照甲基化的母代DNA的鹼基序列修補回去，以確保DNA的完整性，這是修復DNA的第三個機制。'
