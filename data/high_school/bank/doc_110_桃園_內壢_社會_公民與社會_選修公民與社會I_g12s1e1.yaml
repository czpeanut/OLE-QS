  group_stem: ◎印度宣佈封城，要求全國人民都待在家，防止新冠病毒肺炎疫情蔓延，但印度貧富差距嚴重，待在家保持社交距離並非人人都能享有的「權利」。根據CNN報導，待在家保持社交距離，在印度是只有中產階級與上流社會居民才能辦得到，有錢人家中空間寬敞，也有能力事先備妥充足的食物，甚至還能透現代科技在家工作。此外，移工返鄉問題對印度政府而言是大考驗，貧民窟也是印度防疫的一大缺口，以印度最大的貧民窟達拉維為例，平均1,440人共用一個馬桶，日常用水也要從公用儲水槽取，完全居家隔離基本上很難實行。 印度疫情從城市向鄉村擴散，位於東北部的比哈爾邦及阿薩姆邦等地，也宣佈重啟封鎖措施。由於印度貧窮人口偏多，不少人居住在衛生惡劣和擁擠的貧民窟，恐令疫情更難控制。新德里全印度醫學科學院教授指出，封鎖措施難以根治疫情，只能放緩擴散速度。流行病學家認為，當地醫療資源匱乏，估計疫情還需數個月才會到達高峰。國際紅十字會日前警告，印度、巴基斯坦和孟加拉可能成為疫情下一波震央。 →資料來源：1.許雅築（2020年3月31日）。窮人難落實隔離 印度封城挑戰多。臺灣醒報。取自https：//udn.com/news/story/120944/4458107；2.世界日報（2020年7年18日）。南亞成新震央！印度確診破百萬 恐不到一個月達200萬例。取自htps：//udn.com/news/story/120944/4711820
