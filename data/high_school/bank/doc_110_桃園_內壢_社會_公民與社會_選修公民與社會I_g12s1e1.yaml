  group_stem: 1.2020年新型冠狀病毒延燒，導致經濟活動停擺，衝擊全球景氣，位於「M型化社會」金字塔頂端的富人也不能倖免，財富跟著縮水，反觀部分科技業卻因疫情成為「疫想不到」的受益者。美國媒體《彭博社》報導指出，全球前10大富豪中，7位與科技業有關。例如：社群網路「臉書」創辦人祖克柏、跨國電子商務「亞馬遜」創辦人貝佐斯、電動汽車「特斯拉」執行長馬斯克，這3人今年的財富就增加了1,150億美元。 該報導指出，當前科技業制霸的情形，甚至可能比19世紀末，以有「鋼鐵大王」之稱的卡內基、「石油大王」之稱的洛克裴勒等以壟斷聞名的鍍金時代還要誇張，因為當時最大的5間公司市值加總，只占美國GDP的6%，如今蘋果、亞馬遜、Google母公司Alphabet、臉書、微軟等5間公司市值加總，已達美國GDP的30%，且在2018年的時候，此數字還只有約15%。 →資料來源：自由財經（2020年7月29日）。科技業累積財富無極限！這3人今年已賺逾3.4兆。取自 https：//ec.Itn.com.tw/article/breakingnews/3243634
