- id: doc_110_桃園_內壢_社會_公民與社會_選修公民與社會I_g12s1e1_s3_37
  section: 3
  number: 37
  type: single
  page: 5
  stem: '2.民族文化事業基金會表示，部分媒體對第55屆金鐘獎兒童少年節目主人獎得主Pangoyod（鍾家駿）穿著達悟族服出席，以「全場最露」等標題報導，深感遺憾，盼消弭歧視。原文會發聲明指出，臺灣自詡為多元民族社會，部分媒體竟以「股股蛋整顆露出」、「全場最露」、「僅丁字褲光屁股」、「全場最辣」等不雅標題字眼，扭曲形容族服所欲呈現的文化意涵，深感遺憾。原文會說明，達悟族人不論是出席國際重要典禮、政府各類重要活動，都是穿著傳統族服出席與會，表達對於所參加活動的最大敬意，呈現的文化意涵及解讀是莊重且嚴肅的，Pangoyod（鍾家駿）穿著族服出席金鐘盛宴，同樣也是對金鐘獎表達高度敬意。 原文會表示，廣播金鐘獎後又發生新的歧視爭議，期望全國各家媒體持續為收視收聽大眾，提供豐富深入的多元文化觀點，深入理解各自文化的蘊含，並呼籲學術界應加強多元文化及民族平等課程及推廣；政府及國會應加速催生民族平等委員會，革除種族族視、消弭刻板印象，促進社會和諧共榮。 →資料來源：楊淑閔（2020年9月27日)。穿達悟族服出席金鐘遭虧 原文會盼消弭歧視。中央社。取自https：//www.cna.com.tw/news/firstnews/202009270214.aspx

    針對部分媒體對於金鐘獎兒童少年節目主持人獎得主Pangoyod穿著傳統族服的批評，下列何者較符合上述媒體的觀點？(甲)以自己團體內的觀點及意識型態，作為判斷其他文化優劣的依據；(乙)認為每個文化都有其優點，與原住民文化之間並無高低優劣之分；(丙)以尊重和包容態度去面對原住民文化的差異及表現在外的行為；(丁)參照文化優劣的排序去論斷原住民族的價值和行為形成文化偏見'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丁
  - label: D
    content: 乙丁
