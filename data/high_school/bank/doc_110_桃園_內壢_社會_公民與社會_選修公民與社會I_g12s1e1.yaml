  type: single
  page: 2
  stem: 反向歧視（reverse discrimination）是一個圍繞著積極平權措施（affirmative action）而開展的概念。積極平權指的是保障弱勢群體的政策或法律，例如：國會少數族群保障名額、國會婦女保障名額、就業和入學時少數族群和身心障礙團體保障名額等。反向歧視的概念主張，這些保護弱勢群體的法律和政策，使得主流群體的權益受到限制和傷害，主流群體因其身分，反而在資源分配時受到不利而歧視的處置。下列何者不屬於反向歧視的討論議題？
  options:
  - label: A
    content: 不分區立委設定女性保障名額，讓男性候選人反而落選
  - label: B
    content: 美國某校優先錄取黑人學生，分數較高的白人學生落榜
  - label: C
    content: 大法官釋憲宣示保障同志婚姻自由，保守團體上街抗議
  - label: D
    content: 身心障礙者定額進用，壓縮非身心障礙者錄取工作機會
