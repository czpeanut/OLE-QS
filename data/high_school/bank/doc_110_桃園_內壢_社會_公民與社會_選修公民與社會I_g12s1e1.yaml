  stem: 華人的親疏遠近，基上是家族、宗族、民族的開展網絡，對於「關係」（Guanxi）的內外分際秩序井然、輩分分明，也因此嚴格區分伯、舅、姑、姨、堂、表、甥、姪等不同稱謂。此外，俗話說：「沒有關係找關係、找到關係拉關係」在需要特定事情的協助時，可能就會「拉關係」，例如：「我是你爸爸的同學的姪子，拜託幫個忙……」。從上述華人文化「關係」概念說明的段落中，何者是較合理的推論？
