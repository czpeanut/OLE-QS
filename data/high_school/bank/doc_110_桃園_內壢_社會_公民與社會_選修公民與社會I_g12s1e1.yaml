  - label: A
    content: 所有的親屬稱謂皆為法律用語，先有這些法律規範才形塑文化
  - label: B
    content: 華人文化的人際網絡因為太複雜，在機會競爭上就顯得較公平
  - label: C
    content: 屬於一種社會資本，若有良好的關係將可能助於個人職涯發展
  - label: D
    content: 華人文化較強調個人自主與獨立性，構成「個人主義」社會
