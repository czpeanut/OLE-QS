  stem: 對於此社會運動的發起原因，下列何者描述最適切？
  options:
  - label: A
    content: 批判不同地區的員警執法程式存在差異
  - label: B
    content: 不滿國內對不同族裔的差異對待與歧視
  - label: C
    content: 提出對社會新興進步價值的批判與反動
  - label: D
    content: 社會菁英利用資源進行大規模動員參與
  group_stem: 3.美國反種族歧視運動「Black Lives Matter」（黑人的命也是命，稱BLM)席捲全球，而整場運動的導火線，是2020年非裔美國人喬治‧弗洛伊德（George Floyd）之死。事發當時，弗洛伊德因涉嫌使用假鈔而被員警圍捕。儘管過程中他沒有任何抵抗，仍遭白人員警壓制在地，以膝蓋抵住脖子最後窒息死亡。過程中，弗洛伊德不斷求救說：「我不能呼吸了……」但員警仍不予理會。這事件引發全美憤怒，抗議示威在各地蔓延。 在美國結構性種族主義的社會歷史背景之下，非裔美國人無法放心地過日常生活，無論出門或待在自己的家，隨時都有生命的危險。即使不危及生命，也可能被他人誤認為是可疑分子，被員警盤查或者開車時一直被員警攔下等，時刻面臨著騷擾力，以及員警的監視與取締。這就是為什麼BLM運動引起共鳴，使人們走上街支持，譴責美國長久以來的種族歧視問題。
