- id: doc_111_台北_師大附中_數學_數乙_g12s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 試判斷下列哪些單項式的定積分值正確？
  options:
  - label: A
    content: $\int_{0}^{1} 1 dx$＝1
  - label: B
    content: $\int_{0}^{1} x dx$＝$\frac{1}{2}$
  - label: C
    content: $\int_{0}^{1} x^{2}dx$＝$\frac{1}{3}$
  - label: D
    content: $\int_{0}^{1} x^{3}dx$＝$\frac{1}{4}$
  - label: E
    content: $\int_{0}^{1} x^{4}dx$＝$\frac{1}{5}$
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\int_{0}^{1} 1 dx$＝$\left. x \right| _{0}^{1}$＝1－0＝1

    (B) ○：$\int_{0}^{1} x dx$＝$\left. \frac{1}{2}x^{2} \right| _{0}^{1}$＝$\frac{1}{2}$（$1^{2}$－$0^{2}$）＝$\frac{1}{2}$

    (C) ○：$\int_{0}^{1} x^{2} dx$＝$\left. \frac{1}{3}x^{3} \right| _{0}^{1}$＝$\frac{1}{3}$（$1^{3}$－$0^{3}$）＝$\frac{1}{3}$

    (D) ○：$\int_{0}^{1} x^{3} dx$＝$\left. \frac{1}{4}x^{4} \right| _{0}^{1}$＝$\frac{1}{4}$（$1^{4}$－$0^{4}$）＝$\frac{1}{4}$

    (E) ○：$\int_{0}^{1} x^{4} dx$＝$\left. \frac{1}{5}x^{5} \right| _{0}^{1}$＝$\frac{1}{5}$（$1^{5}$－$0^{5}$）＝$\frac{1}{5}$

    故選(A)(B)(C)(D)(E)'
