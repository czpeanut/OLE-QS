- id: doc_111_台北_師大附中_數學_數乙_g12s1e3_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 若 g（x）為連續函數 f（x）的一個反導函數，則下列關係式哪些恆成立？
  options:
  - label: A
    content: 微分 g'（x）＝f（x）
  - label: B
    content: 導函數 f'（x）＝g（x）
  - label: C
    content: 不定積分$\int f(x) dx$＝g（x）
  - label: D
    content: 定積分$\int_{a}^{b} f(x) dx$＝$\left. g(x) \right| _{a}^{b}$＝g（b）－g（a）
  - label: E
    content: 定積分$\left| \int_{a}^{b} f(x) dx \right|$之值表示函數 y＝f（x）的圖形在區間 [a，b] 與 x 軸所圍區域的面積
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○(B) ╳(C) ╳：∵g（x）為 f（x）的一個反導函數

    ∴g''（x）＝f（x）

    即$\int f(x) dx$＝g（x）＋C，其中 C 為任意常數

    (D) ○

    (E) ╳：反例：若 f（x）＝sinx，a＝－π，b＝π

    $\left| \int_{-\pi}^{\pi} \sin x dx \right|$＝0，但其不等於在區間 [－π，π] 和 x 軸所圍區域面積

    故選(A)(D)'
