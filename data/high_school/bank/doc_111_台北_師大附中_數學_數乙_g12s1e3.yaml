  stem: '已知二次不等式 f（x）＝$3x^{2}$＋mx＋n ≤ 0 的解區間為 [－1，1]，試求下列各值：

    (1) 數對（m，n）＝＿＿＿＿。

    (2) 定積分$\int_{-1}^{1} f(x) dx$＝＿＿＿＿。'
  answer:
  - (1)（0，－3）；(2)－4
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ∵f（x）＝$3x^{2}$＋mx＋n ≤ 0 的解為－1 ≤ x ≤ 1

    ⇒ 3（x＋1）（x－1）≤ 0 ⇒ $3x^{2}$－3 ≤ 0

    ∴數對（m，n）＝（0，－3）

    (2)$\int_{-1}^{1} f(x) dx$＝$\int_{-1}^{1} (3x^{2}-3) dx$＝$\left. (x^{3}-3x) \right| _{-1}^{1}$＝（1－3）－〔（－1）＋3〕＝－4'
