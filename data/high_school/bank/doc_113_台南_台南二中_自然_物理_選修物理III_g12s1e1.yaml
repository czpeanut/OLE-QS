  - label: E
    content: 1：1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '繩波波速$V=\sqrt{\frac{F}{\mu}}=\sqrt{\frac{F}{m/L}}\Rightarrow V_{A} : V_{B}=\sqrt{\frac{F}{3/2}} : \sqrt{\frac{F}{1/1}} =\sqrt{2} : \sqrt{3}$。故選(C)。'
