  stem: 在空氣和水之間放入一片玻璃平板，光自空氣以入射角$30^{\circ}$進入玻璃，而光線進入水中時的折 射角為$\theta$。已知水和玻璃的折射率分別為$\frac{4}{3}$和$\frac{3}{2}$，求sin$\theta$＝？。
  options:
  - label: A
    content: $\frac{3}{4}$
  - label: B
    content: $\frac{2}{3}$
  - label: C
    content: $\frac{1}{3}$
  - label: D
    content: $\frac{3}{8}$
  - label: E
    content: $\frac{8}{9}$
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_113_台南_台南二中_自然_物理_選修物理III_g12s1e1/s1_11_f1.png
    crop:
      page: 2
      rect:
      - 549.55
      - 47.75
      - 688.95
      - 164.15
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: $n_{1}\sin\theta _{1}=n_{2}\sin\theta _{2}=n_{3}\sin \theta _{3}\Rightarrow 1\times \sin 30^{\circ}=\frac{4}{3}\times \sin \theta _{3}\Rightarrow \sin \theta _{3}=\frac{3}{8}$。故選(D)。
