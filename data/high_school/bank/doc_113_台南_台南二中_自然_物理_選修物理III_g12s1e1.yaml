  explanation: 聲波在熱空氣中傳播得較快，在冷空氣(晚上)中較慢。當聲波在溫度隨高度改變的空氣中傳播時，便會發生折射現象，先往上折射後經全反射後接著向下折射，故傳較遠。故選(E)。
