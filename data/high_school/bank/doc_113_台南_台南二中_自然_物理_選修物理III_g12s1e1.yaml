  stem: '某生為了測得一個凸透鏡的未知焦距，進行以下實驗：將光源A、光源屏B、薄透鏡C、像屏D等依序水平排列，如圖 1所示。若該生由B、C之間面對光源屏B，會看到光源屏如圖 2所示，其中黑色的箭頭圖案即為光源屏的可透光區。每當改變BC的距離，則經調整CD的距離後，便可在像屏D上清楚看到帶有箭頭的影像。某生針對五個不同的BC距離，分別測量對應的CD距離，記錄於表1。請回答下列問題。

    |  |  |  |  |  |

