- id: doc_113_台南_台南二中_自然_物理_選修物理III_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 一凸透鏡的焦距為 30 cm，且其直徑為12 cm，一點光源置於鏡前45 cm處，則經過透鏡折射 後的光線，照射在鏡後45 cm處的屏上，屏幕所形成亮區的面積為若干$cm^{2}$？
  options:
  - label: A
    content: 4π
  - label: B
    content: 9π
  - label: C
    content: 16π
  - label: D
    content: 25π
  - label: E
    content: 36π
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_113_台南_台南二中_自然_物理_選修物理III_g12s1e1/s1_12_f1.png
    crop:
      page: 2
      rect:
      - 543.55
      - 168.75
      - 682.95
      - 296.5
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $\frac{1}{45}+\frac{1}{q}=\frac{1}{30}$則q＝90 cm，即在牆內90－45＝45 cm處，又由相似三角型比例$\frac{12}{90}=\frac{2r}{45}\Rightarrow r=3 cm$，故面積為$\pi r^{2}=\pi 3^{2}=9\pi cm^{2}$。故選(B)。
