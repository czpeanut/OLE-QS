  stem: 兩彈性繩A和B的質量比為3：1，串接起來，沿水平方向將兩端拉起，量得兩繩的長度比為2：1。在A繩的一端激起一脈衝波，此脈衝波在A和B兩彈性繩內行進的速率比為何？
  options:
  - label: A
    content: 2：3
  - label: B
    content: 3：2
  - label: C
    content: $\sqrt{2}$：$\sqrt{3}$
  - label: D
