- id: doc_113_台南_台南二中_自然_物理_選修物理III_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '當聲波從空氣傳入水中，其波速、波長、頻率如何變化？

    | 選項 | (A) | (B) | (C) | (D) | (E) |

    | --- | --- | --- | --- | --- | --- |

    | 波速 | 變大 | 變小 | 不變 | 變小 | 變大 |

    | 波長 | 變大 | 不變 | 變大 | 變大 | 不變 |

    | 頻率 | 不變 | 變小 | 變小 | 不變 | 變大 |'
  options:
  - label: A
    content: 波速：變大；波長：變大；頻率：不變
  - label: B
    content: 波速：變小；波長：不變；頻率：變小
  - label: C
    content: 波速：不變；波長：變大；頻率：變小
  - label: D
    content: 波速：變小；波長：變大；頻率：不變
  - label: E
    content: 波速：變大；波長：不變；頻率：變大
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 聲波從空氣傳入水波速變快波長變長但頻率不變。故選(A)。
