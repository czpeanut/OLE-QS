  section: 3
  number: 2
  type: fill
  page: 5
  stem: 如右圖（此為示意圖），在坐標平面上，O 為原點，已知 A（6，0），$\overline{OB} =2\sqrt{6}$，且 B 點在第二象限。若 M 為$\overline{AB}$邊上的中點，且$\tan \angle AOM=\sqrt{2}$，則 tan∠AOB＝＿＿＿＿。
  assets:
  - key: s3_2_f1
    kind: figure
    file: doc_108_台南_台南女中_數學_g10s2e3/s3_2_f1.png
    crop:
      page: 5
      rect:
      - 448.4
      - 87.9
      - 564.3
      - 154.8
  answer:
  - $-\frac{\sqrt{2}}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '由$\tan \angle AOM=\sqrt{2} =\frac{y}{x}$，其中 M（x，y）

    ⇒ M（x，y）＝M（x，$\sqrt{2}$x）

    又 M＝$\frac{B+A}{2}$ ⇒ B＝2M－A＝$2 (x , \sqrt{2}x)-(6 , 0)$＝$(2x-6 , 2\sqrt{2}x)$

    $\overline{OB} =2\sqrt{6}$ ⇒ $\overline{OB}^{2}=24$

    ⇒ （2x－6）$^{2}$＋（$2\sqrt{2}x$）$^{2}$＝24

    ⇒ $12x^{2}$－24x＋12＝0

    ⇒ $x^{2}$－2x＋1＝0

    ⇒ （x－1）$^{2}$＝0

    ⇒ x＝1

    故 tan∠AOB＝$\frac{2\sqrt{2}x}{2x-6}$＝$\frac{2\sqrt{2}\times 1}{2\times 1-6}$＝$\frac{2\sqrt{2}}{-4}$＝$-\frac{\sqrt{2}}{2}$'
