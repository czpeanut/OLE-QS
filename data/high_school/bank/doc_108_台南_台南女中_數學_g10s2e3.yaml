- id: doc_108_台南_台南女中_數學_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在$\left( 2x^{2}-\frac{1}{x} \right) ^{6}$的展開式中，常數項為下列哪一個選項？
  options:
  - label: A
    content: '240'
  - label: B
    content: '192'
  - label: C
    content: '160'
  - label: D
    content: '64'
  - label: E
    content: '60'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left( 2x^{2}-\frac{1}{x} \right) ^{6}$展開式中的每一項皆形如

    $C_{k}^{6}(2x^{2})^{6-k}\left( -\frac{1}{x} \right) ^{k}$＝$C_{k}^{6}\times 2^{6-k}\times (-1)^{k}x^{2 (6-k)}\frac{1}{x^{k}}$

    常數項 ⇒ 2（6－k）－k＝0 ⇒ k＝4

    則常數項為$C_{4}^{6}\times 2^{6-4}\times (-1)^{4}$＝$C_{2}^{6}\times 2^{2}\times (-1)^{4}$＝15×4＝60

    故選(E)'
