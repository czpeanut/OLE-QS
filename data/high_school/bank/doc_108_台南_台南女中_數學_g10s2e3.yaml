- id: doc_108_台南_台南女中_數學_g10s2e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 3
  stem: 在坐標平面上，廣義角θ的頂點為原點 O，始邊為 x 軸的正向，且滿足$\tan \theta =\frac{3}{2}$。若θ的終邊上有一點 P，其 x 坐標為－4，則下列哪些選項一定正確？
  options:
  - label: A
    content: P 的 y 坐標是 6
  - label: B
    content: $\overline{OP} =2\sqrt{13}$
  - label: C
    content: $\cos \theta =\frac{2}{\sqrt{13}}$
  - label: D
    content: $\sin (180^{^{\circ}}-\theta )=\frac{3}{\sqrt{13}}$
  - label: E
    content: $\cos (90^{^{\circ}}+\theta )=\frac{3}{\sqrt{13}}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\tan \theta =\frac{3}{2}$，P（－4，y） ⇒ θ為第三象限角

    (A) ╳：$\tan \theta =\frac{3}{2}=\frac{y}{-4}$ ⇒ y＝－6

    (B) ○：$\overline{OP} =\sqrt{(-4)^{2}+(-6)^{2}} =2\sqrt{13}$

    (C) ╳：$\cos \theta =\frac{x}{\overline{OP}}=\frac{-4}{2\sqrt{13}}=-\frac{2}{\sqrt{13}}$

    (D) ╳：sin（180°－θ）＝sinθ＝$\frac{y}{\overline{OP}}=\frac{-6}{2\sqrt{13}}=-\frac{3}{\sqrt{13}}$

    (E) ○：cos（90°＋θ）＝－sinθ＝$\frac{3}{\sqrt{13}}$

    故選(B)(E)'
- id: doc_108_台南_台南女中_數學_g10s2e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 3
  stem: 設標準位置角θ為第四象限角，且$\sin \theta +\cos \theta =\frac{1}{3}$，請選出一定正確的選項。
  options:
  - label: A
    content: $\sin \theta \cos \theta =-\frac{8}{9}$
  - label: B
    content: $\sin ^{3}\theta +\cos ^{3}\theta =\frac{5}{27}$
  - label: C
    content: $\sin \theta -\cos \theta =\frac{\sqrt{17}}{3}$
  - label: D
    content: $\cos \theta >\frac{1}{2}$
  - label: E
    content: θ＞300°
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：（sinθ＋cosθ）$^{2}$＝1＋2 sinθcosθ ⇒ $\left( \frac{1}{3} \right) ^{2}=1+2 \sin \theta \cos \theta$ ⇒ $\sin \theta \cos \theta =-\frac{4}{9}$

    (B) ╳：$sin^{3}$θ＋$cos^{3}$θ＝（sinθ＋cosθ）$^{3}$－3 sinθcosθ（sinθ＋cosθ）

    ＝$\left( \frac{1}{3} \right) ^{3}-3 \left( -\frac{4}{9} \right) \left( \frac{1}{3} \right)$＝$\frac{1}{27}+\frac{12}{27}=\frac{13}{27}$

    (C) ╳：（sinθ－cosθ）$^{2}$＝（sinθ＋cosθ）$^{2}$－4 sinθcosθ＝$\left( \frac{1}{3} \right) ^{2}-4 \left( -\frac{4}{9} \right) =\frac{17}{9}$

    ⇒ $\sin \theta -\cos \theta =\pm \frac{\sqrt{17}}{3}$（正不合 ∵θ為第四象限角）

    (D) ○：由 sinθ＋cosθ＝$\frac{1}{3}$，sinθ－cosθ＝－$\frac{\sqrt{17}}{3}$

    得 cosθ＝$\frac{1+\sqrt{17}}{6} > \frac{1}{2}$

    (E) ╳：θ有無限多個同界角

    故選(D)'
