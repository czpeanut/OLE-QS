  stem: 請閱讀以下兩則資料後回答問題： 資料一：宗教改革是否為一宗教事件？許多史學家從經濟、社會和政治的情況中，尋求宗教運動的原因，並認為其他因素遠大於宗教因素……某些人認為新教運動基本上是貴族和公候對教宗、皇帝或國王權威的反抗；另外一些則認為是被領主和大商人壓迫的小人物、手工業者和工人尋求解脫的嘗試；最後一種理論則認為宗教改革應乎大資產階級的需要。有些史實似乎證明了第一種理論。人人皆知日耳曼的路德派公侯，如薩克森選帝侯和條頓騎士團團長等人，將教產還給俗世政府……。第二種理論的支持者強調……1557年在巴黎及法國其他地區異端審判過程中，所發現的許多手工藝者、紡織工人、製鞋匠、修鞋匠和玻璃製造工人等等。第三種理論則基於安特衛普、布魯日、盧昂、里昂和其他大商業城市，有許多商人改信新教，以及路德派和喀爾文派對於盈利活動所給予道德方面的便利。從各個角度來看，不少史家認為政治經濟因素遠大於宗教，從實際帶來的成果而言，政治上帶來了地方公侯的政治力強化，得以逐步擴大領地，經濟上許多手工藝者與商人改教，新教的理論促使了經濟更為發達，因此認為政治與經濟影響遠重於宗教改革的成果。 資料二：宗教改革的產生完全是一個教會事件，此一運動的發起者為修士和教士。伊拉斯莫斯和路德為修士；喀爾文為教士。他們的動機基本上是宗教性的。我們應該承認有些人將他們與上帝之間的關係視為重要的事情，生活上的大事情。上述二段資料對於宗教改革的動機有不同的解釋。請根據上文用你的理解書寫所附表格。
