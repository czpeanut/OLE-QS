  stem: 「公元前28年，屋大維解決内戰、凱旋羅馬，元老院授予他「元首」稱號，別稱「第一公民」。隔年屋大維恢復共和政體，宣布「將全體公民託付給我的權力，全部歸到公民及元老院手中」。元老院瞬間響起如雷的歡聲，並立刻提案再授予屋大維「奧古斯都」的尊號，他們確信「奥古斯都」意指神聖而受尊敬的，完全沒有武力或是權力方面的意味。至此，屋大維實際掌握著執政官、大將軍及「第一公民」、「奧古斯都」等職位及稱號。……事隔五年，屋大維再度宣布卸任連任多屆的執政官，元老院議員簡直無法相信。因為這意味著他們恢復再次成為執政官的機會。但是與此同時，屋大維也向元老屋提出賦予他「護民官」的特權。這是自共和時代便已常設的一項官職，元老院不加思索便答應了。但他們沒有想到，屋大維看準的是護民官的否決權，這項權力是他成為羅馬獨裁統治者的最後一塊拼圖。」若要為上述資料下個標題，下列何者較為適切？
