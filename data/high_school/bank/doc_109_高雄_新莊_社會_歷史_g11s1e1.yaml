  stem: 閱讀以下兩則資料，回答問題： 資料一：法國大革命的過程，可分為三期。 第一期，從1789到1791年間。由中產階級主導改革，成果包括廢除封建制度、改革教務、取消貴族與教士特權、頒布《人權宣言》、建立君主立憲體制等。 第二期，從1791到1795年間。中產階級裡的激進分子取代溫和的中產階級成為革命的領導人。他們不滿意既有的革命成果，希望建立一個共和政府、而非君主立憲政體，其統治手段也趨於恐怖。這時歐洲各國君主擔憂國内民眾受法國革命煽動，因此組成同盟向法國宣戰，此舉更激化法國民眾的情緒，把革命推向高潮。 第三期，從1795到1799年間。溫和的中產階級復出，激進主義消退。1799年後戰績彪炳的拿破崙當政，他恢復法國秩序，推行有利中產階級的改革，並成為法國皇帝。這代表革命精神的挫敗，革命的發展也告一段落。 資料二：革命建立起這種局面，將從前分散在社會中的一切零散權力，全部納入一個龐大的民族統一體，每個公民都面對著更集權、嚴密的中央政府。法國大革命真正帶來的，並非人民渴望的民主，而是控制力更強大、更具壓迫性的統治。人們再次被吞沒在專制之中，新的專制比舊的更加公平，卻也更全面。這個結果，從概念層次上來說，可謂盧梭「公共意志」理論內在矛盾的展現。(4分) (1)資料二提及，革命將從前社會中的零散權力納入一個民族統一體，請你從資料一法國大革命的過程，舉出1個例證。 (2)資料二提及，革命帶來更具壓迫性的統治，請你從資料一法國大革命的過程，舉出1個例證。
