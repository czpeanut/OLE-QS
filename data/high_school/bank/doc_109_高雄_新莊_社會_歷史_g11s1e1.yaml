  stem: 「宗教改革在英格蘭是信仰問題，也是政治議題，它造就一個擁有獨立教會的君權國家，促成英格蘭王權迅速擴張。國王在宗教改革過程中將傳統教權納入了王權範圍；他享有的王權超越歷來的英格蘭君主。然而，國王要安享至高王權，必須獲得臣民支持；他必須說明王權合法的基礎。此辯護行動的重要性展現在兩個方面：第一，英格蘭脫離羅馬教會後，原以天主教義為基礎的君臣倫理不復適用。政府必須向英格蘭民眾解釋國王「新王權」的内涵與合法性，並在此前提下重建君臣倫理。第二，國王推動宗教改革迫使自己陷入内憂外患的危境中；在國內，傳統教徒對國教政策不滿：在國外，羅馬教廷提出討伐異端的呼籲。對國王而言，要度過難關，唯有倚賴全民對國王的支持。因是之故，王權的重新塑造，以及使人民周知新王權概念，是當時英國政府首要工作。」依上文，請問宗教改革在英格蘭的發展，具有哪一項特質？
