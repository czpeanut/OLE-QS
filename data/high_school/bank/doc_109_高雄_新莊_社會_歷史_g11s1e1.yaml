  stem: 「十八世纪以來，英國海外貿易已大幅擴張四倍之多，英國對西印度群島蔗糖的需求大增，西印度群岛對英國製造品及北美殖民地其他必需品採購的金額也不斷增加，連北美殖民地對英國製造品的消費也大增。加勒比海同時也是販賣奴隸的大本管，透過遠洋貿易，英國可能有四分之一的出口棉織品運到非洲以換取奴隸。這些都擴大了英國的大西洋貿易額，促使英國對美、非兩洲的整體出口額超越歐洲，成長幅度有八倍之多。……這樣的貿易發展，促進了英國的信貸與金融網絡，也替將來以工業製造為基礎的新貿易發展，創造了一個現成可用的網絡 ─ 西印度群島毫無阻礙地供應原物料，製作完成的工業製品（如棉製品）亦無困難地送到長期而穩定的市場。……工業化之前，英國龐大的外貿規模，同時帶來其他重大影響。相較於歐洲其他各國，英國政府高度關注貿易與製造的需求，積極保全金融體制以維持其信任度，甚至動用海軍保護其商業利益。在除了尼德蘭之外的歐洲各國中，英國應該是最投入商業投資、最倚賴商業擴張以取得收入的國家。」依據上文，十八世紀以來歐洲經濟出現激烈改變，形成工業革命、造就工業革命的原因眾多且複雜，但英國發展得以優於其他西歐國家的原因為何？
