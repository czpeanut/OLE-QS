- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 右方照片是地方選舉時，黨外候選人因對手作票而落選，後引來市民包圍，並放火、搗毀警察局，最終重新開票，該候選人以 22 萬票擊敗對手 13 萬票當選，也開啟黨外「街頭運動」的時代。此一事件應是下列何者？
  options:
  - label: A
    content: 中壢事件
  - label: B
    content: 二二八事件
  - label: C
    content: 美麗島事件
  - label: D
    content: 自由中國事件
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_111_台中_台中女中_社會_歷史_g10s1e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 345.9
      - 124.15
      - 564.3
      - 255.05
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 1977 年的中壢事件因選舉舞弊而引發街頭運動抗爭，並造成嚴重的警民衝突。(B)(C)(D)三事件與選舉爭議無關。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某一國際會議召開時，中華民國政府指出：會議摒除我國於會議之外，此為我國之辱。中華人民共和國當局也對該會議提出抗議，指出：該會議背棄國際義務，中國不予承認。該國際會議指的是
  options:
  - label: A
    content: 1945 年雅爾達會議
  - label: B
    content: 1946 年聯合國第一次大會
  - label: C
    content: 1951 年舊金山和會
  - label: D
    content: 1955 年的第一次亞非會議
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹來看，此國際會議召開之時並無中國代表參加，故兩岸政權皆表達不滿，答案為(C)。(A)當時尚未有中華人民共和國。(B)(D)皆有中國代表參與。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 東北亞地區發生衝突之際，一位美國官員建議其政府，應當採取具體措施援助臺灣。他指出：「保衛臺灣人民利益及維護太平洋地區和平與安全的計畫，如果僅由聯合國推動，不可能有任何效果。只能由美國提這種方案，才會符合各方期待而且有效。」此人說話的時機最可能是
  options:
  - label: A
    content: 1947 年，臺灣發生動亂，美國計畫穩定臺灣局勢
  - label: B
    content: 1950 年韓戰爆發之後，美國決定強化其東亞政策
  - label: C
    content: 1971 年我退出聯合國時，美國努力安定臺灣民心
  - label: D
    content: 1978 年底中美斷交時，美國要保障其在臺灣利益
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 東北亞的衝突使得美國官員建議採取具體措施援助臺灣，因此可推知此衝突事件為 1950 年爆發的韓戰，(B)為正解。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 明清之際，移民臺灣的漢人多來自漳州、泉州、嘉應州、潮州和惠州等地區。右圖是根據日治時期的調查結果所繪製的「祖籍優占區」分布圖。祖籍優占區係指某一祖籍人口占該地總人口比例最高的地區。請問圖中哪個族群原鄉信仰是開漳聖王？
  options:
  - label: A
    content: 甲族群
  - label: B
    content: 乙族群
  - label: C
    content: 丙族群
  - label: D
    content: 戊族群
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_111_台中_台中女中_社會_歷史_g10s1e2/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 387.9
      - 473.75
      - 564.3
      - 735.65
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 早期移民的分布，信仰開漳聖王的漳州人多分布在內陸平原，故為圖中的(A)甲族群。乙族群分布於沿海平原，為泉州人；丙丁戊則為客家族群。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某黨成立於上海，其組織大綱是由日本組織系統起草，中國組織承認，成為第三國際的一部分。在政治大綱上，公然提出臺灣民族獨立的激烈主張，並影響到日後新文化協會的分裂。請問該黨指的是
  options:
  - label: A
    content: 臺灣民眾黨
  - label: B
    content: 臺灣共產黨
  - label: C
    content: 中國國民黨
  - label: D
    content: 民主進步黨
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這個在上海成立，主張臺灣民族獨立，又屬於「第三國際」的政黨為(B)臺灣共產黨，為日本共產黨的分支。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 美國國務卿杜勒斯召開記者會，宣示○○的意義如下：調整中華民國與美國政府間的軍事安排。原本第七艦隊的安排是根據與韓戰有關的總統命令，這項命令日後可能隨時撤銷，但○○可使共同軍事安排安置於長期正式的條約基礎上。試問○○最可能為何？
  options:
  - label: A
    content: 《對華白皮書》
  - label: B
    content: 《中美共同防禦條約》
  - label: C
    content: 《臺灣關係法》
  - label: D
    content: 〈開羅宣言〉
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹提到○○可使共同軍事安排安置於長期正式的條約基礎上，可推知臺灣與美國此後有了軍事合作，因此○○應為(B)《中美共同防禦條約》。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 下圖是聯合國大會通過《2758 號決議案》，此決議案內容造成的影響，應為下列哪個選項？
  options:
  - label: A
    content: 我國辦理中央民意代表增額選舉
  - label: B
    content: 美國國會另外訂定《臺灣關係法》
  - label: C
    content: 中共轉變為「一國兩制統一中國」
  - label: D
    content: 暫停當年中央民意代表的增額選舉
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_111_台中_台中女中_社會_歷史_g10s1e2/s1_7_f1.png
    crop:
      page: 2
      rect:
      - 186.2
      - 103.8
      - 497.85
      - 312.25
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 聯合國大會的這項決議使中華人民共和國取得聯合國的中國代表權，因此臺灣退出聯合國，在政治局勢不安之際，對當時臺灣本土政治改革的訴求予以有限度的回應，於是(A)辦理中央民意代表增額選舉。(B)(C)(D)皆為 1979 年美國與臺灣斷交的後續影響。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 1907 年林獻堂訪日時，曾與流亡日本的維新派靈魂人物梁啟超商討臺人的政治政策，梁啟超回應：「三十年內，中國絕無能力營救，可效法愛爾蘭人之抗英。愛爾蘭人初期以暴動反抗，終被英國軍隊壓制無一倖免；後來獲得參政權，在英國國會取得席次，結交英國朝野，以國會少數取得左右政局之勢，不妨效法之。」後續，林獻堂會採取哪一項行動來表達臺人的政治訴求？
  options:
  - label: A
    content: 鼓吹民眾加入余清芳的行動
  - label: B
    content: 推動臺灣議會設置請願運動
  - label: C
    content: 支持《六三法》至《三一法》的改制
  - label: D
    content: 贊助臺灣共產黨的相關活動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 梁啟超建議的「愛爾蘭抗英經驗」，是先取得參政權，再從國會來左右政局，因此林獻堂等人在放棄《六三法》撤廢運動後，轉而推動臺灣議會設置請願運動，追求自治，答案選(B)。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 1947 年 3 月 2 日，「二二八事件處理委員會」決議擴大組織納入各界菁英。4 日，改組擴大為全省組織，各地紛紛成立處委會。5 日，通過〈處委會組織大綱〉，以處理二二八事件及改革臺灣政治為宗旨。請問下列何者是當時處委會的提議內容？
  options:
  - label: A
    content: 臺灣高度自治
  - label: B
    content: 臺灣獨立
  - label: C
    content: 國軍撤離臺灣
  - label: D
    content: 撤換陳儀
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「二二八事件處理委員會」與陳儀協商，提出肅清貪官汙吏、多起用本省人、(A)臺灣高度自治等要求，沒想到陳儀表面上與委員會交涉，卻同時向中央請兵，當國軍抵達基隆後，隨即展開全臺性的軍事鎮壓。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 以下是日治時期兩種民間運動的型態。甲：在各大城市成立簽名處，鼓勵民眾連署，然後在東京演講、遊行，拜訪政要與報社；乙：編製簡易識字教材，舉辦演講會、茶話會，以及有專人解說的電影巡迴播放。關於甲、乙的敘述，以下正確的是
  options:
  - label: A
    content: 甲：走的是文化啟蒙路線；乙：走的是農工運動路線
  - label: B
    content: 甲：目標是突顯臺灣的獨特性；乙：目標是啟迪本土的民智
  - label: C
    content: 甲：由林獻堂、林呈祿領導；乙：由連溫卿、謝雪紅領導
  - label: D
    content: 甲：獲得日本國會的支持；乙：遭總督府嚴厲打壓
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 甲為臺灣議會設置請願運動，乙為臺灣文化協會的做法，選項中敘述正確的是(B)。(A)甲為政治抗爭路線，乙才是文化啟蒙路線。(C)乙由蔣渭水、蔡培火等領導。(D)甲未獲日本國會支持，乙轉激進後才遭總督府打壓。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 日治中期，某臺灣民間組織的決議提到：「在日常經濟鬥爭上，吾○在全體無產階級的利害關係上，負有重大任務。」此決議中○應為
  options:
  - label: A
    content: 臺灣同化會
  - label: B
    content: 臺灣農民組合
  - label: C
    content: 臺灣議會期成同盟會
  - label: D
    content: 臺灣地方自治聯盟
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 此民間組織提及「經濟鬥爭」，並強調肩負「全體無產階級」的利害關係任務，可確認其立場應為激進的左派，選項中(B)臺灣農民組合即是。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 關於日治時期臺灣的文化社會運動，下列敘述何者正確？
  options:
  - label: A
    content: 臺灣同化會主要訴求為設置臺灣議會
  - label: B
    content: 臺灣民眾黨的訴求為撤廢《六三法》
  - label: C
    content: 臺灣文化協會向大眾傳播新思潮
  - label: D
    content: 二林事件的發動者為臺灣共產黨
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)臺灣同化會目的在消除日本人對臺灣人的差別待遇。(B)臺灣民眾黨的訴求是追求政治的、經濟的、社會的自由。(D)二林事件為李應章成立的「二林蔗農組合」所發起。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 1930 年，新民會發表一篇專刊，提及：「臺灣自歸屬日本統治……迄今尚有 26,942 人的鴉片癮者……可以說，誠日本之一大汙辱。然而臺灣總督府當局不但不醒悟，最近更欲特許鴉片吸食癮者一萬餘人左右的本島老百姓……在京臺灣人的代表團體新民會，為人道上與國民保健上起見，並期滅絕在臺灣的鴉片吸食，及暴露既往鴉片政策的無能，指摘其最近無理追認鴉片吸食的許可方針……。」由此可知，新民會檢討的是
  options:
  - label: A
    content: 鴉片嚴禁政策的失敗
  - label: B
    content: 吸食鴉片的利害得失
  - label: C
    content: 開放鴉片貿易的可能性
  - label: D
    content: 鴉片特許制度的毒害
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 新民會的文章指責臺灣總督府的鴉片政策無法滅絕臺灣的鴉片吸食，更「指摘其最近無理追認鴉片吸食的許可方針」，可見新民會主要檢討的是鴉片吸食的特許制度，(D)為正解。(B)文中未提及吸食鴉片之益處。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 白色恐怖時期，某刊物的主筆以中國大陸來臺的自由主義學者居多，曾出版「祝壽專號」慶祝蔣中正七十大壽，建議蔣中正確立內閣制、實施軍隊國家化。此刊物是
  options:
  - label: A
    content: 《美麗島》雜誌
  - label: B
    content: 《大學》雜誌
  - label: C
    content: 《臺灣新生報》
  - label: D
    content: 《自由中國》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹所述之刊物為雷震創辦的(D)《自由中國》雜誌，在 1960 年雷震被逮捕後，雜誌社隨之關閉。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 「在內陸之內戰未終息以前，除以守衛臺灣為目的之外，絕對反對在臺灣徵兵，以免臺灣陷入內戰漩渦。」這是以下哪一組織的訴求？
  options:
  - label: A
    content: 中國民主黨
  - label: B
    content: 美麗島雜誌社
  - label: C
    content: 臺灣行政長官公署
  - label: D
    content: 二二八事件處理委員會
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由「內陸之內戰未終息以前」一句，推知當時中國正陷入國共內戰的情勢。(A) 1960 年預計成立，之後組黨失敗。(B)成立於國府遷臺後。(C)為臺灣執政當局，理應配合中央行事。因此最可能為(D)二二八事件處理委員會提出的「處理大綱」與要求。
- id: doc_111_台中_台中女中_社會_歷史_g10s1e2_s1_16
  section: 1
  number: 16
