    30.1949 年政府開始推行土地改革政策，至 1953 年實施「耕者有其田」後，可明顯看到佃耕地大幅減少，因此(C)為正解。

    31. 1935 年為臺灣歷史上第一次的選舉，雖然選舉條件限制嚴苛，須為年納稅額 5 圓以上的 25 歲男子才能投票，但各地的投票率均高達九成以上，(D)為正解。(A)治警事件發生於 1923 年。(B)(C)僅是地方街庄議會的部分議員開放選舉，此外臺灣議會設置請願運動不算成功。

    32.19 世紀以來，許多國家將國民食糖量視為國力的指標之一，日本統治者因此非常重視臺灣糖業的發展，(A)為正解。(B)為臺灣的特產，但有茶文化的日本食用量不可能比歐洲國家少。(C)(D)並非臺灣特產，日本產量亦多。

    33.為解決「米糖相剋」問題，總督府在嘉南平原採分區供水方式，約束農民作物的選擇，(B)為正解。

    34.題幹所述為(A)世界貿易組織的理念。(B)與國際經貿發展無關。(C)臺灣目前未加入。(D)僅限亞太地區國家。

    35.1953 年實施「耕者有其田」政策時，政府以 70 ％實物土地債券及 30 ％水泥、紙業、農林、工礦四大公營事業股票補償地主，因此這張表格最適宜的名稱為(B)耕者有其田與官股補償一覽表。

    36.(A)產業外移為業界自發性行為，非政府推動。(C)臺灣 2002 年才加入世貿組織。(D)未有此事。

    37.「向西方文藝借鏡」為現代主義文學的特色，因此此人最可能是(A)白先勇。(B)懷鄉文學作家。(C)(D)鄉土文學作家。

    38.從 1945 年到 1947 年的匯率變化，可看出中國大陸的法幣嚴重貶值，最主要是受到(A)國共內戰的影響。(B) 1945 年已結束抗戰。(C) 1949 年國府才遷臺。(D)二二八事件發生在臺灣，法幣不致受此影響。

    39.(B)獎勵外國投資、設置加工出口區為 1960 年代出口擴張時期的重要措施。

    40.「客廳即工廠」為 1972 年提出的口號，希望家庭零細人力也投入工作，在能源危機的大環境下，臺灣經濟進入(C)第二次進口替代時期，臺灣低廉的工資與不斷擴充的勞動力，以代工、製程產業為主的中小企業因而興起活躍，也讓臺灣經濟能穩定成長，締造出經濟奇蹟。

    41.(C) 1934 年日月潭水力發電廠完工，使臺灣電力工程進入新的里程碑。

    42.媽祖為海神而非鄉土神，由於早期移民渡海來臺先集中在中、南部，因此媽祖信仰也在中、南部地區興旺，隨著移墾社會轉為定居社會後，媽祖信仰也就超越原有的鄉土神崇拜，(C)為正解。(A) 17 世紀初期，入臺移民不多，媽祖信仰尚未傳入。(B)此句敘述無誤，但與題目時代不符。(D)並無此事。

    43.西來庵事件後，臺灣總督府曾經展開全臺性的宗教調查，並非題幹指稱的「全面改造」，故不選(A)。題幹所述應為皇民化運動時期，倡導神道教信仰，展開正廳改正與寺廟整理運動，(D)為正解。

    44.皇民化運動時期，一方面改造傳統信仰，推動「寺廟整理」與「正廳改正」；另一方面大力推廣日本神道教，推動「一街庄一神社」，在各地普設神社，故答案選(B)。

    45.這段四天四地的文字，反映戰後初期 1945 ～ 1947 年的臺灣人民心情轉變，成為爆發二二八事件的重要背景，答案選(C)。

    46.資料一說明 1955 年一江山島的戰況，資料二說明美國協助撤退大陳島居民來臺的情形，故(D)為正解。(A)此時國府已經遷臺數年。(B) 1953 年韓戰已結束。(C)均在 1958 年金門八二三砲戰之前。

    47.從「本流發生了什麼……變遷，則支流也自然而然隨之而影響」的說法，可知這位文學家認為臺灣文學必定會受到中國文學的影響，剛好見證當時中國新文化運動鼓勵了臺灣新文學的發展，答案選(D)。

    48.日治時期，被尊為「臺灣新文學之父」者為(B)賴和。

    49.臺灣傳統布袋戲偶被迫要穿上日本和服、講日本話，此為皇民化運動時期的現象，只能演出皇民劇，目的在使臺灣人能成為效忠天皇的皇國子民，(A)為正解。

    50.(A)張我軍主張使用中國白話文創作。(B)余光中代表現代主義文學作家，批評鄉土文學為中共的工農兵文藝。(C)懷鄉文學關注的是中國大陸的故鄉。'
