  stem: 由基本的定律或概念出發，經過合理的推導，得到或預測正確結果的方式，稱為演繹法。從觀測、實驗或實驗的資料出發，不加任何假設，尋求出現象背後隱藏的共同規律，則稱為歸納法。演繹法與歸納法是我們在科學探究上經常交互使用的兩種重要之研究方法，克卜勒的行星運動定律與牛頓的萬有引力定律之發現，分別使用上述研究方法中的哪一種？
