- id: doc_112_嘉義_永慶_自然_物理_g10s1e2_s3_30
  section: 3
  number: 30
  type: fill
  page: 7
  stem: '由題幹表可知，RFID 四個主要操作頻帶的波長哪一類為最短？

    答：＿＿＿＿。'
  group_stem: '無線射頻辨識（Radio Frequency Identification）系統，簡稱 RFID。RFID 是第二次世界大戰時 （1948 年），英國人用在機場辨別敵我戰機而研發出來的。它的結構主要由下列三個部分所組成：

    (1)天線，被動式標籤的內建天線用以感應與產生 RF 無線電波，以收發資料。Reader 的天線一般內含於 Reader 機盒內部，當讀取距離較長時，因所需的 RF 能量更大，故天線會單獨存在並與 Reader 相連接。

    (2)感應器（Transponder，或 Tag），內含微細的晶片及天線，感應器如果透過電池動作，一般稱之為主動式 Tag，主動式 Tag 可儲存較大的記憶體及較遠的讀取距離，但價格較貴；如果靠內感電耦動作，則稱之為被動式 Tag，被動式 Tag 的記憶體較小，但好處是價格較具競爭力、體積小、壽命長。

    (3)接收器，主要功能在於接收主機端的命令，對於儲存在感應器的資料，以有線或無線方式傳回主機。

    RFID 運用在生活中，例如：進出捷運的卡片、電子錢包（如悠遊卡）、開啟大門門禁的晶片卡等。至於 RFID 常使用的操作頻率，主要頻帶與應用可分為四級，如下表：

    |  | 頻 率 | 通信距離 | 應用範圍 |

    | --- | --- | --- | --- |

    | 低 頻 （Low-Freq.） | 135 kHz 以下 | 讀取距離需在 50 cm 以內 | 動物 ID、倉儲控制、交通工具監控、非接觸式智慧卡 |

    | 高 頻 （High-Freq.） | 13.56 MHz | 讀取距離需在 1.5 m 以內 | 票證系統（如悠遊卡）、物件追蹤、航空公司行李追蹤、建築物存取、圖書館管理 |

    | 極高頻 （UHF） | 100 ～ 960 MHz | 讀取距離需大於 1.5 cm、小於 10 m | 生產供應鏈、容器追蹤、貨車追蹤 （貨櫃管理）、倫敦地下鐵道 |

    | 微 波 （Microwave） | 1 GHz 以上 | 讀取距離需在 10 m 以上 | 交通工具之存取控制、通行費徵收系統 |'
  answer:
  - 微波
  answer_status: verified
  answer_source: answer_key
  explanation: '由 v＝fλ⇒ 3×$10^{8}$＝fλ

    f 愈高，λ 愈短，故微波波長最短。'
