  stem: 綠色化學的概念強調化學製程中原子的使用效率，若製程中使用很多原子，最後這些原子卻成為廢棄物，就不符合綠色化學的原則。甲基丙烯酸甲酯是一種製造壓克力高分子的單體，以往是由丙酮製造，完整的製程可以用下列平衡的化學反應式表示： $CH_{3}COCH_{3}$＋HCN＋$CH_{3}$OH＋$H_{2}SO_{4}$ → $CH_{2}$＝C($CH_{3}$)$CO_{2}CH_{3}$＋$NH_{4}HSO_{4}$ 新的製程則用觸媒催化丙炔、甲醇與一氧化碳反應直接生成產物： $CH_{3}$C≡CH＋$CH_{3}$OH＋CO → $CH_{2}$＝C($CH_{3}$)$CO_{2}CH_{3}$ 使用丙炔的新製程，沒有製造任何廢棄物，原子使用效率為100％。試問使用丙酮製程的原子使用效率，最接近下列哪一項？
  options:
  - label: A
    content: 18％
  - label: B
    content: 29％
  - label: C
    content: 47％
  - label: D
    content: 55％
  - label: E
    content: 69％
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 甲基丙烯酸甲酯分子量＝100、硫酸氫銨式量＝115 原子效率＝$\frac{目標產物總質量}{所有產物總質量}$＝$\frac{100}{100+115}$＝0.47。故選(C)。
