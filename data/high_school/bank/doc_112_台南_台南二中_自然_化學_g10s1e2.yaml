- id: doc_112_台南_台南二中_自然_化學_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知有五個第一至第三週期元素的原子或離子：$_{a}$甲$^{2＋}$、$_{b}$乙$^{＋}$、$_{c}$丙、$_{d}$丁$^{－}$、$_{e}$戊$^{2－}$，若此五個原子或離子均具有同一個8A族元素的電子排列，則下列相關敘述，<u>不正確</u>的是何者？
  options:
  - label: A
    content: 甲、乙、丙、丁、戊屬於同週期元素
  - label: B
    content: 中性原子的價電子數：丙＞丁＞戊＞甲＞乙
  - label: C
    content: 質子數：e＜d＜c＜b＜a
  - label: D
    content: 原子半徑：乙＞甲＞戊＞丁
  - label: E
    content: 乙和戊可結合成離子化合物，化學式為「乙$_{2}$戊」
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 五個原子和離子皆形成同一個鈍氣的電子組態，故原子序甲(2A)＞乙(1A)＞丙(8A)＞丁(7A)＞戊(6A)，丙為鈍氣，則丙、丁、戊為同一週期元素，甲、乙應為下一個週期的元素。故選(A)。
