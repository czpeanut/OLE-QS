  stem: 0.5莫耳某C、H、O化合物完全燃燒，需32克純氧，生成44克$CO_{2}$和18克$H_{2}$O，下列敘述何者<u>不正確</u>？
  options:
  - label: A
    content: 實驗式為$C_{2}H_{4}$O
  - label: B
    content: 分子式為$C_{2}H_{4}O_{2}$
  - label: C
    content: C的質量百分比為40％
  - label: D
    content: 示性式可能為$CH_{3}$COOH
  - label: E
    content: 分子量為60
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 0.5 mol化合物燃燒產生二氧化碳1 mol、水1 mol，故可得知0.5 mol化合物中有碳原子＝1 mol、氫原子＝2 mol，則此化學式可表示為$C_{2}H_{4}O_{a}$。列出燃燒方程式：$C_{2}H_{4}O_{a}$＋$O_{2}$ → $2CO_{2}$＋$2H_{2}$O，可得a＝2。則(A)錯誤。故選(A)。
