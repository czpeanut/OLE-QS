  stem: 下列有關反應熱的敘述，何者正確？
  options:
  - label: A
    content: 正、逆反應之反應熱同值同號
  - label: B
    content: 反應熱之大小與反應式之物質狀態無關
  - label: C
    content: CO(g)＋$\frac{1}{2}O_{2}$(g) → $CO_{2}$(g)＋Q kJ，表示ΔH＝－Q kJ
  - label: D
    content: 在1atm、0℃時測定之反應熱稱為標準反應熱
  - label: E
    content: 反應熱之大小與反應式之係數無關
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)正、逆反應的反應熱為同值異號；(B)反應熱的大小和反應式之物質狀態有關；(D)反應熱若於標準狀態下測得，稱為標準反應熱，IUPAC將標準狀態的條件訂定為壓力1 bar，溫度則無規定；(E)有關。故選(C)。
