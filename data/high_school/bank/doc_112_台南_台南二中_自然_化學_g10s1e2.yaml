- id: doc_112_台南_台南二中_自然_化學_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 某碳氫化合物0.30莫耳，完全燃燒得到0.90莫耳二氧化碳與1.20莫耳水，則此碳氫化合物的分子式為何？
  options:
