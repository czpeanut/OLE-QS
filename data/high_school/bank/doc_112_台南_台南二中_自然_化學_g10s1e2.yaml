  explanation: W為碳、X為氬、Y為鈣、Z為溴。熔融狀態可導電者為離子化合物，由金屬、非金屬所組成，氬為鈍氣，不易與其他元素形成化合物。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 某金屬（M）的碳酸鹽（$MCO_{3}$）與稀鹽酸反應，產生二氧化碳的反應式如下： $MCO_{3}$(s)＋2HCl(aq) → $MCl_{2}$(aq)＋$CO_{2}$(g)＋$H_{2}$O(l) 若0.84克$MCO_{3}$與稀鹽酸完全反應，所產生的氣體，換算成標準狀態的乾燥二氧化碳，恰為224毫升。M應為下列哪一種金屬？（原子量：Be＝9，Mg＝24，Ca＝40，Zn＝65，Ba＝137）
  options:
  - label: A
    content: Be
  - label: B
    content: Mg
  - label: C
    content: Ca
  - label: D
    content: Zn
  - label: E
    content: Ba
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 二氧化碳224 mL＝0.224 L，於STP下，相當於0.01 mol。可產生0.01 mol的二氧化碳，則金屬碳酸鹽亦為0.01 mol，則$MCO_{3}$式量＝$\frac{0.84}{0.01}$＝84。可得M原子量＝24。故選(B)。
