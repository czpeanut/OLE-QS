  stem: 化學反應式「＿$CuFeS_{2}$＋＿$O_{2}$ → ＿$Cu_{2}$S＋＿$Fe_{2}O_{3}$＋＿$SO_{2}$」，以最簡整數係數平衡後，其各項係數之和為多少？
  options:
  - label: A
    content: '22'
  - label: B
    content: '23'
  - label: C
    content: '24'
  - label: D
    content: '25'
  - label: E
    content: '27'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 先假設$Cu_{2}$S係數＝1，則$CuFeS_{2}$係數＝2，則$Fe_{2}O_{3}$係數＝1。再由S原子不滅得$SO_{2}$係數＝3，再由O原子不滅得$O_{2}$係數＝$\frac{9}{2}$，同乘以2之後可得反應式為：$4CuFeS_{2}$＋$9O_{2}$ → $2Cu_{2}$S＋$2Fe_{2}O_{3}$＋$6SO_{2}$，總和＝23。故選(A)。
