questions:
- id: doc_112_台南_台南二中_自然_化學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 鑽石與石墨是碳的共價網狀固體。其中，鑽石質地堅硬，而石墨是易脆的物質。下列有關兩者的敘述，何者正確？
  options:
  - label: A
    content: 石墨具有導熱性，鑽石具有導電性
  - label: B
    content: 鑽石的每個碳原子連接三個碳原子，而石墨的每個碳原子連接四個碳原子
  - label: C
    content: 鑽石是二維網狀排列，而石墨是三維層狀排列
  - label: D
    content: 鑽石中碳原子間連接形成的幾何結構為三角形，而石墨中碳原子間連接形成的幾何結構為四面體形
  - label: E
    content: 鑽石與石墨都是高熔點的固體
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)石墨易導電，鑽石易導熱；(B)鑽石每個碳接4個原子，石墨每個碳接3個原子；(C)鑽石為三維結構，石墨為二維結構；(D)鑽石以四面體形鍵結，故接四個原子，為三維結構，石墨則是接三角形，所以接三個原子，為二維結構；(E)網狀固體要熔化需打斷很多共價鍵，故熔點高。故選(E)。
