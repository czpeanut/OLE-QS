    content: $CH_{4}$
  - label: B
    content: $C_{2}H_{16}$
  - label: C
    content: $C_{3}H_{8}$
  - label: D
    content: $C_{4}H_{10}$
  - label: E
    content: $C_{5}H_{12}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此碳氫化合物燃燒後可產生三倍的$CO_{2}$、四倍的$H_{2}$O，故可表示為$C_{x}H_{y}$＋$O_{2}$ → $xCO_{2}$＋$\frac{y}{2}H_{2}$O，得x＝3、$\frac{y}{2}$＝4。故選(C)。
