  stem: 日治之初，日本政府即將原住民地區之統治管理視為要務，……認為原住民居住地的開發可提供樟腦之製造、山林之經營、農産之增殖、日本人移住與礦山之開發等，應仿效清末之「開山撫番」政策建立「撫墾制度」，設立「撫墾署」。在給予原住民一定之土地，使其遷居後以耕種為業，政府就可以充分開發這些地區的豐富資源。……然而實際推行上，要強行遷移原住民並不是容易的事。同時，自樟腦局設立之後，沿用清代隘勇線與開闢「理番」道路之方式，保護樟腦製造業者，同時以「甘諾政策」，以引誘的方式，亦即提供田地開墾，使原住民甘心承諾居住在隘勇線內，再將線外原住民遷居至線內。但真正遷移的戶數仍然有限。依據短文，請同學簡短解釋甚麽是「甘諾政策」。（素養題）
