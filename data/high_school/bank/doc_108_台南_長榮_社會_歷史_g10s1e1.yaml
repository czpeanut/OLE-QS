  stem: 康熙五十年代中期，府城地區官紳編輯的《諸羅縣志》、《臺灣縣志》、《鳳山縣志》等三本地方志，都不約而同提到了屏東地區「客」或「客仔」的特色：祖籍廣東潮州，以佃耕丶傭工為生；喜聚居，善鬥健訟。根據當代所做的田野調查，當地傳說強調「客家」移民是在獲得官方的土地開發許可證（墾照）後，移墾屏東平原。另外，二十世紀初的一件土地訴訟中，來自臺南地區的閩籍地主提出了清代官方發給的屏東地區墾照，控訴屏東地區的客家佃戶侵奪了他們的土地。綜合來看，清初客家移民應是以佃戶的身分進入屏東平原，並逐漸掌握當地土地開墾，進而引起與閩南地主的緊張關係。文中認為客家移民最初是以佃戶身分進入屏東平原，其主要證據是什麽？（素養題）
