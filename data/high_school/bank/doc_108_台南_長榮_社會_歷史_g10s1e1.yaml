  type: calc
  page: 5
  stem: 1644年前，馬尼拉督柯逵拉被逮捕下獄。檢察官以他下令拆毀淡水城和撤退作為罪狀，以及他曾撤回四個聯隊駐軍，加上他還任命一個不能讀寫的老粗士兵擔任最後一任長官等理由起訴他。根據訴狀，這些行為是「艾爾摩沙島淪陷的總體原因」。審判曠日廢時，柯逵拉在馬尼拉受了四年牢獄之災。 雖然柯逵拉最後重獲自由，但後世史家還是為他無法確保臺灣而責備他。其實這是道明會士的一偏之見，他們對損失臺灣這塊教務的樂土相當不甘心。第一本道明會編年史，就是柯逵拉的政敵所寫。起了這個頭，十八世紀之後又被史學家加上另一條罪狀，宣稱是因為耶穌會士想要藉由放棄臺灣來打入中國傳教界，才向柯逵拉進讒言。到了二十世紀，道明會地理學與歷史學者仍不免再度對柯逵拉大加抨擊。 如我們所見，臺灣淪陷導源於一般政治經濟局勢的變化遠較個人的意志為多，柯逵拉不得不下令撤回臺灣駐軍以節省資源，是因為西班牙帝國轄區內經濟局勢的蕭條加上荷蘭勢力的增長，殆使回防馬尼拉為必要，柯逵拉必須選一處以撙節財源。臺灣駐軍對於整個帝國布局的利益甚少，將其駐軍抽回也是最為合理的抉擇，大部分的官員和軍人都贊同此一決策。事實上，或許由於削減了臺灣駐軍的開支，柯逵拉才有辦法籌資協助打擊菲律賓南部各回教蘇丹的遠征軍，作者認為臺灣的淪陷「政治經濟局勢的變化遠較個人的意志為多」，又說「大部分的官員和軍人都贊同此一決策」，但為何當時審判和後世道明會史家，仍會認為馬尼拉總督柯逵拉有過失呢？（素養題）
  answer:
  - (1)對損失臺灣這塊教務的樂土相當不甘心；(2)（道明會和耶穌會的鬥爭）
