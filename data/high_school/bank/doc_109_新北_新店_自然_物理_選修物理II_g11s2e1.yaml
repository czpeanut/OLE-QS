  stem: 新型汽車常使用安全帶與安全氣囊做為保護駕駛或乘客的第一道防護裝置，其中安全帶在防護效果占80％，而安全氣囊才占10％，因此安全氣囊是對安全帶的輔助，它的爆發力非常大，如果沒有安全帶的牽引緩衝，而直接撞到正在爆發的氣囊上，會對身體造成嚴重損傷。當高速前進的汽車緊急停下時，利用安全帶與安全氣囊，可以降低車內乘客可能受到的傷害。下列有關這兩種安全配備的敘述，何者正確？
