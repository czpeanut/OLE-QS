    content: 四種基本作用力中相對強度最弱為弱力
  - label: B
    content: 四種基本作用力中只有弱力是短程力，其它皆為長程力
  - label: C
    content: 夸克能結合成質子與中子等粒子主要是有強力的作用
  - label: D
    content: 重力與電磁力均為超距力，可藉由場與力線的概念來了解其作用
  - label: E
    content: 兩個氫原子結合成氫分子主要是靠質子與質子間有強力作用的緣故
