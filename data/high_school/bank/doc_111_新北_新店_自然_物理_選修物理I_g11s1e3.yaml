  - label: A
    content: 太空船離地球、月球、太陽太遠了，所受重力極小
  - label: B
    content: 太空船剛好落在地球、月球、太陽三者引力作用的平衡點處，重力的合力為零
  - label: C
    content: 太空之中沒有空氣，重力無法傳遞過來，故無重力作用
  - label: D
    content: 太空船受地球重力作用，恰好供給其繞地球作圓周運動所必須的向心力，所以感受不到重力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
