  page: 1
  stem: '解下列指對數方程式：

    (1) $log_{3}$x＝9×$log_{x}$3：＿＿＿＿。

    (2) log（$10^{x}$－1000）＝$\frac{x}{2}$＋1＋log9：＿＿＿＿。'
  answer:
