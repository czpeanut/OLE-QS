    (D) ╳：$log_{3}$4×$log_{4}$5×$log_{5}$6＝$log_{3}$6＝1＋$log_{3}$2

    (E) ○：$9^{\log _{3}2}$＝（$3^{\log _{3}2}$）$^{2}$＝$2^{2}$＝4

    故選(A)(E)'
