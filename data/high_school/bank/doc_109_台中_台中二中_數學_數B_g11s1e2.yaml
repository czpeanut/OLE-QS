  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 令 t＝$log_{3}$x ⇒ $log_{x}$3＝$\frac{1}{t}$

    原式 ⇒ t＝9×$\frac{1}{t}$ ⇒ t＝±3 ⇒ $log_{3}$x＝±3

    ∴x＝$3^{3}$ 或 $3^{－3}$ ⇒ x＝27 或$\frac{1}{27}$

    (2) 原式 ⇒ log（$10^{x}$－1000）＝log$10^{\frac{x}{2}}$＋log10＋log9

    ⇒ log（$10^{x}$－1000）＝$\log (90\times 10^{\frac{x}{2}})$

    ∴$10^{x}$－1000＝90×$10^{\frac{x}{2}}$ ⇒ $(10^{\frac{x}{2}}-100)(10^{\frac{x}{2}}+10)$＝0

    ⇒ $10^{\frac{x}{2}}$＝100 或－10（不合） ⇒ $\frac{x}{2}$＝2 ⇒ x＝4'
