  type: multiple
  page: 1
  stem: 設 t 是不為零的實數，關於對數函數 f（x）＝t．logx，下列敘述哪些正確？
  options:
  - label: A
    content: 若 t＞0，f（x）的圖形均在 x 軸上方
  - label: B
    content: 若 t＜0，f（x）為嚴格遞減函數
  - label: C
    content: 若 t≠0，f（x）的圖形凹口向上
  - label: D
    content: 若 f（x）＝f（π），則 x＝π
  - label: E
    content: 若 0＜t＜1 且 $x_{1}$＜$x_{2}$，則 f（$x_{1}$）＞f（$x_{2}$）
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：反例：t＝1

    (B) ○：∵logx 為嚴格遞增函數

    ∴當 t＜0，t．logx 為嚴格遞減函數

    (C) ╳：t＞0 時為凹口向下

    (D) ○：∵f（x）＝t．logx 為嚴格遞增函數或嚴格遞減函數

    ∴當 f（x）＝f（π）時，x＝π

    (E) ╳：當 0＜t＜1 時，f（x）為嚴格遞增函數

    故 $x_{1}$＜$x_{2}$ 時，f（$x_{1}$）＜f（$x_{2}$）

    故選(B)(D)'
