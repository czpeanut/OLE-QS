  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 原式 ⇒ （$2^{x}$－4）（$2^{x}$－1） ≤ 0 ⇒ 1 ≤ $2^{x}$ ≤ 4

    ⇒ 0 ≤ x ≤ 2

    (2) log（x＋1） ≤ 3 ⇒ log（x＋1） ≤ log1000

    ⇒ x＋1 ≤ 1000，又 x＋1＞0

    ⇒ －1＜x ≤ 999

    $6.9^{x}$＝2 ⇒ x＝$log_{9}$2，故 P（$log_{9}$2，2）

    $9^{x}$＝6 ⇒ x＝$log_{9}$6，故 Q（$log_{9}$6，6）

    ⇒ $\overset{\leftarrow \rightarrow}{PQ}$斜率＝$\frac{6-2}{\log _{9}6-\log _{9}2}=\frac{4}{\log _{9}3}=\frac{4}{\frac{1}{2} \log _{3}3}$＝8

    7.設 $n_{甲}$（t）、$n_{乙}$（t）分別為細菌甲、乙 t 天之數量

    則 $n_{甲}$（t）＝$n_{甲}$(0)×$4^{\frac{t}{3}}$ ………………①

    $n_{乙}$（t）＝$n_{乙}$(0)×$2^{\frac{t}{2}}$ ………………②

    又 $n_{甲}$(0)＝$n_{乙}$(0)

    $\frac{①}{②}$ ⇒ $\frac{n_{甲}(t)}{n_{乙}(t)}=\frac{4^{\frac{t}{3}}}{2^{\frac{t}{2}}}$＝$2^{\frac{2}{3}t-\frac{t}{2}}$＝$2^{\frac{1}{6}t}$

    ⇒ $2^{\frac{1}{6}t}$＞1000 ⇒ $\log 2^{\frac{1}{6}t} > \log 1000$

    ⇒ $\frac{1}{6}t \log 2$＞3 ⇒ t＞$\frac{3\times 6}{0.3010}$

    ⇒ t＞59.8……

    故 t 的最小正整數值為 60'
