  type: multiple
  page: 1
  stem: 關於兩函數 y＝$f_{1}$（x）＝$(\sqrt{2} )^{x}$和 y＝$f_{2}$（x）＝$\left( \frac{\sqrt{2}}{2} \right) ^{x}$的圖形，下列哪些選項正確？
  options:
  - label: A
    content: 兩函數均為嚴格遞增函數
  - label: B
    content: 兩函數圖形均凹口向上
  - label: C
    content: 兩函數圖形只有一個交點
  - label: D
    content: 兩函數圖形對稱於 y 軸
  - label: E
    content: y＝$f_{1}$（x）和$y =\sqrt{2} \log x$函數圖形對稱於直線 y＝x
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵0＜$\frac{\sqrt{2}}{2}$＜1

    ∴$f_{2}$（x）為嚴格遞減函數

    (B) ○：指數函數皆為凹口向上

    (C) ○：交（0，1）

    (D) ○：∵$\sqrt{2}$．$\frac{\sqrt{2}}{2}$＝1

    ∴$f_{1}$（x）、$f_{2}$（x）對稱於 y 軸

    (E) ╳：y＝（$\sqrt{2}$）$^{x}$ 和$y =\log _{\sqrt{2}}x$對稱於 y＝x

    且$y =\log _{\sqrt{2}}x$≠$\sqrt{2}$logx

    故選(B)(C)(D)'
