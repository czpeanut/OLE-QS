    (C) ○：$\cos \frac{5\pi}{3}$＝cos300°＝cos60°＝$\frac{1}{2}$

    (D) ╳：$\tan \frac{-3\pi}{4}$＝tan（－135°）＝－tan135°＝tan45°＝1

    (E) ╳：$\tan \frac{\pi}{2}$＝tan90° 無意義

    故選(A)(C)'
