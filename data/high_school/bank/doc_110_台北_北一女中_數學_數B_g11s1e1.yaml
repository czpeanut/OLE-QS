  stem: 下列哪些敘述是正確的？
  options:
  - label: A
    content: π＝180
  - label: B
    content: $\frac{\pi}{2}$＝90°
  - label: C
    content: 150°＝$\frac{5\pi}{6}$
  - label: D
    content: π$^{2}$＝32400°
  - label: E
    content: π°＝3.14159……
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：π＝180°

    (B) ○：$\frac{\pi}{2}$＝$\frac{180^{∘}}{2}$＝90°

    (C) ○：150°＝150×$\frac{\pi}{180}$＝$\frac{5\pi}{6}$

    (D) ╳：π$^{2}$＝（180π）°≠32400°

    (E) ╳：π°＝（3.14159……）°

    故選(B)(C)'
