  stem: 課堂中老師由兔子切入介紹了費氏數列，並說明費氏數列〈 $a_{n}$ 〉滿足遞迴式 $a_{1}$＝1，$a_{2}$＝1，$a_{n}$＝$a_{n－1}$＋$a_{n－2}$（n＞2）。<u>小綠</u>知道大自然裡隱藏有費氏數列後非常興奮，迫不及待買了一朵向日葵，認真數它右旋及左旋的數目：「居然真的符合費氏數列！」若<u>小綠</u>實際觀察之右旋及左旋數目皆介於 20～50，求該朵向日葵可能之右旋或左旋數目為＿＿＿＿。（兩解）
  answer:
  - 21 或 34
  answer_status: verified
  answer_source: answer_key
  explanation: '$a_{1}$＝1，$a_{2}$＝1，$a_{n}$＝$a_{n－1}$＋$a_{n－2}$（n＞2）

