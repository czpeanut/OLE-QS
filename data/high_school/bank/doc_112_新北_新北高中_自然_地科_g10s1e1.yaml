  group_stem: '科學家為了想要量化地球磁場擾動的等級，利用13個位在[<u> ① </u>]緯度的地球磁場觀測站，紀錄各個測站在三小時間隔內觀察到地磁場的橫向最大波動而得出，指數的最小值為0、最大值為9，區分的範圍從0、0＋、1－、1、1＋、……、8、8＋、9－、9。而當Kp指數達到5－以上時，就表示此時的地球磁場擾亂相當嚴重，便判定為磁暴（Geomagnetic Storm）發生。

    Dst指數的意義如下：磁暴發生時，地球的磁場強度會被環電流削弱，具體原因是當太陽風中的高能帶電粒子進入地球磁場，特別是在地球的赤道附近，這些帶電粒子會形成環繞地球的環電流。這個環電流會產生一個與地球磁場方向相反的磁場，會大幅減弱地球磁場，而將此些偏差值（ΔH＝H實測值－H基準值）取平均即為Dst指數。'
