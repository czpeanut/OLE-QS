- id: doc_112_新北_新北高中_自然_地科_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 人類以目前鑽探技術難以直接鑽透至地核，所以需要用較為間接的方式來推測地球內部的物理及化學狀態，下列有關於諸多方法的敘述何正確？
  options:
  - label: A
    content: 莫氏不連續面區分了岩石圈和軟流圈，是介質從固體（脆性）進入有部分熔融態（具可塑性）的影響
  - label: B
    content: 過渡帶作為上下地函的分界，地震波在此深度因礦物相變而使得波速突然增加，屬一不連續面
  - label: C
    content: P波的消失和S波的波速突減是古氏不連續面的定義
  - label: D
    content: 以地震波分析可以了解大致的物理樣態，化學組成需仰賴其他的方式，如：隕石或火山岩中所含的包裹體
  - label: E
    content: 至今鑽探垂直深度最深的鑽井，因位於較厚的海洋地殼中，並未直接地獲取地函的岩石樣本
  answer:
  - D
