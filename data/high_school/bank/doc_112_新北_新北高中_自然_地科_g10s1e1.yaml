  group_stem: '寒武紀是地質史上的一個年代，約500個百萬年前，多細胞動物突發性的在海洋中出現，而且迅速發展出形體多樣、構造複雜的類群，即稱為寒武紀大爆發。1984年<u>南京</u>地質古生物研究所的<u>侯先光</u>在<u>中國雲南</u>的<u>澄江</u>發現了五億三千萬年前的化石，此化石層保存了極為豐富的多細胞生物遺骸，被稱為「澄江生物群」。

    <u>澄江</u>附近地層其實是由許多細黏土事件層堆積而成的，每一事件層的底面並不平整，沉積顆粒在底部較粗，有向上變細的現象。以上的沉積構造說明了每一事件層的沉積岩層是在同一時間以快速的方式沉積下來的。沉積之前它們顯然是一種飽含著水分的泥流，在海底順著斜坡流動了一段距離之後，流動中粗的顆粒先向底部集中，形成了一種沉積物向上變細的粒序構造。這些泥流事件平均每一百年發生一次，每次事件均會導致區域性的生態浩劫和生物的集體死亡。【本文摘自<u>澄江生物群：寒武紀大爆發的見證</u>】'
