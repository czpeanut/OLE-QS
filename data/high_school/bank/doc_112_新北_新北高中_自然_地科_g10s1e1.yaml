- id: doc_112_新北_新北高中_自然_地科_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 地震預警是利用地震資訊的快速發布，讓地震波尚未到達的地區能即時因應。地震發生到市民收到<u>中央氣象署</u>預警通知需10秒，P波速率為每秒5公里，S波速率為每秒3公里。假設震波速率不變，震央距測站的距離為d公里，同學為了要如何推估成功預警所需的時間而議論紛紛，站在一旁的老師眉頭一皺發現有位同學的說法<u>有問題</u>，請問是哪位同學？
  options:
  - label: A
    content: <u>格溫</u>：預警是地震發生後，利用P和S波到時的時間差來爭取躲避時間
  - label: B
    content: <u>諾手</u>：而信息傳遞加上處理時間還需要10秒，代表如果S、P波到時差異小於十秒不就來不及了？
  - label: C
    content: <u>大嘴</u>：所以測站距震央d公里，P波需要$\frac{d}{5}$秒、S波需要$\frac{d}{3}$秒吧！
  - label: D
    content: <u>刀妹</u>：還要考慮地震波的出發時間，因為P波會比S波先出發假設是t秒，這樣要成功預警的話：（𝑡＋$\frac{d}{3}$）－$\frac{d}{5}$要大於等於10秒，真嚴格阿！
  - label: E
    content: <u>時光</u>：地震波應該是同時出發呀，以這樣的條件如果地震震央離我們有150公里的話應該可以成功預警！
  answer:
  - D
