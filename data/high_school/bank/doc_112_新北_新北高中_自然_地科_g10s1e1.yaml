  group_stem: '地震學家<u>芮克特</u>（Charles Francis Richter）和<u>古騰堡</u>（Beno Gutenberg）兩位<u>美國加州理工學院</u>的地震學家，想出了一個方式來解決量測方式的問題。既然離震源越遠，振幅會越小，那其實只要製定一個標準距離、振幅的「標準地震」（註1），只要將測量到的震波跟這個標準相比，就可以比較出地震大小了。雖然可以用儀器可以直接測得數據，但是不管怎麼擺放地震儀，都會有一個問題：那就是每次地震發生的地方與地震儀測的距離都不會一樣。

    <u>臺灣</u>地震發生頻率高，為了更精準、精確計算地震規模，中央大學接受<u>中央氣象署</u>委託，把使用近30年的芮氏規模（$M_{L}$）計算式，重新修正調整，完成後的新芮氏規模計算式，更能與國際計算式接近（圖二、註2）。

    <u>中央氣象署</u>地震規範計算已經使用近30年，地震規模在六以上，發現與國外相較，有明顯的高估情形，<u>中央大學地球科學院</u>教授郭陳澔博士表示，<u>中央氣象署</u>現有使用的地震規模計算是從1993年開始，根據當時的地震資料所推導出的芮氏規模計算式，缺乏足夠的深部地震資訊，近年來<u>臺灣</u>地區發生較為深部地震時，與美國地質調查所（USGS）所發布的震矩規模（$M_{W}$）相比，有偏大的情形。

    震矩規模（$M_{W}$）與芮氏規模（$M_{L}$）計算方式雖然不同，但也有一定的相關性，一般來說，規模介於四到六之間，兩者規模差異不大，而規模大於六以上，隨著規模量的增加，芮氏規模（$M_{L}$）會明顯比震矩規模（$M_{W}$）小非常多，主要是芮氏規模的計算方式，無法涵蓋到大地震發生時所產生的低頻能量。

    （註1）：以伍德－安德森扭力式地震儀量測距離100公里處發生的地震產生的最大振幅為0.001 mm的地震，其規模為0，數學關係如圖一所示。

    （註2）：（圖二）中顯示的為地震事件代號為16/02/02即為2016/02/02。

    （節錄自：1. Psi泛科學－地震大小誰說了算？Part I：課本沒教的芮氏規模；2. 中央大學地球科學學院研究成果）'
