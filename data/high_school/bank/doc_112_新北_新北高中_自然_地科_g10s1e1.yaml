  stem: 下列有關於早期太陽系演化的敘述何者正確？
  options:
  - label: A
    content: 由核融合反應產生的能量使星雲核心溫度極高，直至1000萬度時恆星形成
  - label: B
    content: 各顆行星被隕石轟擊的頻率應較現今更為罕見
  - label: C
    content: 太陽星雲的氣體未曾停留在各行星的表面即受太陽風吹拂而逸散
  - label: D
    content: 各行星的吸積作用，於太陽開啟核融合反應後才得以開始
  - label: E
    content: 太陽星雲中僅含氫和氦元素，地球上的重元素均來自於地球重力捕獲宇宙中其他天體所產生之
  answer:
