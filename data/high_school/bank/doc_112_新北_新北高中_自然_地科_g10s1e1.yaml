  type: single
  page: 2
  stem: 下列有關「地震規模」和「地震震度」的比較，何者正確？
  options:
  - label: A
    content: 當各地地震規模相同時，各地的地震震度也相同
  - label: B
    content: 地震規模通常與距震央遠近有關，地震震度則皆相同
  - label: C
    content: 地震規模越大則釋放能量較多，地震震度越大則破壞程度越大
  - label: D
    content: 地震規模僅代表釋放的能量多寡，不同的計算方式數值均相同
  - label: E
    content: 地震規模以整數代表，地震震度以（整數＋小數）表示
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
