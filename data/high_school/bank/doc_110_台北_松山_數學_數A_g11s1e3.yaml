- id: doc_110_台北_松山_數學_數A_g11s1e3_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 坐標平面上有一直線 $L:2x-3y+1=0$ 及其上一點 $(-2,-1)$，下列敘述何者正確？
  options:
  - label: A
    content: L的參數式可為 $\begin{cases}x=-2+2t \\ y=-1-3t\end{cases} ,t\in R$
  - label: B
    content: L的參數式可為 $\begin{cases}x=4+3t \\ y=3+2t\end{cases} ,t\in R$
  - label: C
    content: L的法向量平行向量 $(4,-6)$
  - label: D
    content: L的方向向量平行向量 $(\frac{1}{2},\frac{1}{3})$
  - label: E
    content: 直線 $M:3x-2y-1=0$ 與L的夾角為θ，則sinθ＝$\frac{5}{13}$
  answer:
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：因為 ( 2 ,－3 ) 為L的一組法向量，所以L的參數式不可為$\begin{cases}x=-2+2t \\ y=-1-3t\end{cases}$，t ∈ R。 (B) ○：因為 ( 3 , 2 )．( 2 ,－3 )＝0，所以 ( 3 , 2 ) 為L的一組方向向量， 又 ( 4 , 3 ) 為L上一點，因此L的參數式可為$\begin{cases}x=4+3t \\ y=3+2t\end{cases}$，t ∈ R。 (C) ○：承(A)可知，正確。 (D) ○：承(B)可知，正確。 (E) ○：設$\vec{l_{1}}$＝( 2 , 3 )，$\vec{l_{2}}$＝( 3 , 2 ) 分別為直線M與直線L的一組方向向量， 可知cosθ＝±$\frac{\vec{l_{1}}\cdot \vec{l_{2}}}{|\vec{l_{1}}| |\vec{l_{2}}|}$＝±$\frac{12}{\sqrt{13}\times \sqrt{13}}$＝±$\frac{12}{13}$ ⇒ sinθ＝$\frac{5}{13}$。 故選(B)(C)(D)(E)。
