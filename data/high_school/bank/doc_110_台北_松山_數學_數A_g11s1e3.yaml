- id: doc_110_台北_松山_數學_數A_g11s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 已知平面上三相異非零向量 $\vec{a},\vec{b},\vec{c}$ 彼此互不平行，其中$\left| \vec{a} \right| =\left| \vec{b} \right|$，已知 $t_{1},t_{2}\in R$，下列敘述何者正確？
  options:
  - label: A
    content: 當$\left| \vec{a}+t_{1}\vec{b} \right|$有最小值時，此時的$\vec{a}+t_{1}\vec{b}$與$\vec{b}$垂直
  - label: B
    content: 當$\left| t_{2}\vec{a}+\vec{b} \right|$有最小值時，此時的$t_{2}\vec{a}+\vec{b}$與$\vec{b}$平行
  - label: C
    content: 當$\left| \vec{a}+t_{1}\vec{b} \right|$與$\left| t_{2}\vec{a}+\vec{b} \right|$均有最小值時，此時的$t_{1}$＝$t_{2}$
  - label: D
    content: 必存在實數t使得$\vec{a}+t\vec{b}$//$\vec{c}$
  - label: E
    content: 必存在實數t使得$\vec{a}+t\vec{b}$//$\vec{b}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○。 (B) ×：當 | $t_{2}\vec{a}$＋$\vec{b}$| 有最小值時，此時的$t_{2}\vec{a}$＋$\vec{b}$與$\vec{a}$垂直。 (C) ○：承(A)(B)可知， ($\vec{a}$＋$t_{1}\vec{b}$)．$\vec{b}$＝0 ⇒ $t_{1}$＝$\frac{-\vec{a}\cdot \vec{b}}{|\vec{b}|^{2}}$，同理$t_{2}$＝$\frac{-\vec{a}\cdot \vec{b}}{|\vec{a}|^{2}}$， 又 |$\vec{a}$|＝|$\vec{b}$|，所以$t_{1}$＝$t_{2}$。 (D) ○。 (E) ×：因為$\vec{a}$與$\vec{b}$不平行，所以$\vec{a}$＋t$\vec{b}$與$\vec{b}$不平行。 故選(A)(C)(D)。
