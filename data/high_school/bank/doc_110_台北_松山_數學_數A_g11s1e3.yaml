  stem: 已知二階行列式 $\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| =\frac{5}{6}$，聯立方程組 $\begin{cases}a_{1}x+b_{1}y=c_{1} \\ a_{2}x+b_{2}y=c_{2}\end{cases}$( $c_{1}$，$c_{2}$≠0 )的解為 $\begin{cases}x=2 \\ y=3\end{cases}$，試問下列敘述何者正確？
  options:
  - label: A
    content: $\left| \begin{matrix}b_{1} & c_{1} \\ b_{2} & c_{2}\end{matrix} \right| =\frac{5}{3}$
  - label: B
    content: $\left| \begin{matrix}a_{1} & c_{1} \\ a_{2} & c_{2}\end{matrix} \right| =\frac{5}{2}$
  - label: C
    content: $\left| \begin{matrix}3a_{1}+2b_{1} & 3a_{2}+2b_{2} \\ -3b_{1} & -3b_{2}\end{matrix} \right| =\frac{5}{6}$
  - label: D
    content: 方程組 $\begin{matrix}\begin{cases}a_{1}x+b_{1}y=c_{1} \\ a_{2}x+b_{2}y=0\end{cases} \\ \end{matrix}$ 恰有一組實數解
  - label: E
    content: 方程組 $\begin{cases}a_{1}x+2b_{1}y=3c_{1} \\ a_{2}x+2b_{2}y=3c_{2}\end{cases}$ 的解為 $x=6,y=\frac{9}{2}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：△＝$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right|$＝$\frac{5}{6}$，△$_{x}$＝$\left| \begin{matrix}c_{1} & b_{1} \\ c_{2} & b_{2}\end{matrix} \right|$ ⇒ x＝$\frac{\triangle _{x}}{\triangle}$＝2， ⇒ $\left| \begin{matrix}c_{1} & b_{1} \\ c_{2} & b_{2}\end{matrix} \right|$＝2×$\frac{5}{6}$＝$\frac{5}{3}$ ⇒ $\left| \begin{matrix}b_{1} & c_{1} \\ b_{2} & c_{2}\end{matrix} \right|$＝－$\frac{5}{3}$。 (B) ○：△$_{y}$＝$\left| \begin{matrix}a_{1} & c_{1} \\ a_{2} & c_{2}\end{matrix} \right|$ ⇒ y＝$\frac{\triangle _{y}}{\triangle}$＝3 ⇒ $\left| \begin{matrix}a_{1} & c_{1} \\ a_{2} & c_{2}\end{matrix} \right|$＝3×$\frac{5}{6}$＝$\frac{5}{2}$。 (C) ×：$\left| \begin{matrix}3a_{1}+2b_{1} & 3a_{2}+3b_{2} \\ -3b_{1} & -3b_{2}\end{matrix} \right|$＝$\left| \begin{matrix}3a_{1} & 3a_{2} \\ -3b_{1} & -3b_{2}\end{matrix} \right|$＝－9$\left| \begin{matrix}a_{1} & a_{2} \\ b_{1} & b_{2}\end{matrix} \right|$＝－9$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right|$＝－9×$\frac{5}{6}$＝－$\frac{15}{2}$。 (D) ○：因為$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right|$≠0，所以方程組恰有一組實數解。 (E) ○：因為$\begin{cases}a_{1}x+b_{1}y=c_{1} \\ a_{2}x+b_{2}y=c_{2}\end{cases}$的解為$\begin{cases}x=2 \\ y=3\end{cases}$ ⇒ $\begin{cases}2a_{1}+3b_{1}=c_{1} \\ 2a_{2}+3b_{2}=c_{2}\end{cases}$ ⇒ $\begin{cases}6a_{1}+9b_{1}=3c_{1} \\ 6a_{2}+9b_{2}=3c_{2}\end{cases}$ ⇒ $\begin{cases}a_{1}\cdot 6+2b_{1}\cdot \frac{9}{2}=3c_{1} \\ a_{2}\cdot 6+2b_{2}\cdot \frac{9}{2}=3c_{2}\end{cases}$， 所以$\begin{cases}a_{1}x+2b_{1}y=3c_{1} \\ a_{2}x+2b_{2}y=3c_{2}\end{cases}$的解為x＝6，y＝$\frac{9}{2}$。 故選(B)(D)(E)。
