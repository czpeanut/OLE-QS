- id: doc_110_新竹_新竹高中_數學_g10s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 2
  stem: 若A ( 12 , 10 ) 與點A′ 對稱於直線L：x＝y，則A′ 的坐標為以下哪一個選項？
  options:
  - label: A
    content: ( 10 , 12 )
  - label: B
    content: (－10 , 12)
  - label: C
    content: ( 10 ,－12 )
  - label: D
    content: (－10 ,－12 )
  - label: E
    content: (12－10 , 12＋10 )
  group_stem: '工程師<u>袁宇宙</u>設計了一款名為「五銖獎」的虛擬情境遊戲，如下所述： 玩家化身為漢武帝劉徹，如圖所示，在直角坐標平面上，將單獨1支「光箭」 從A ( 12 , 10 ) 射向直線L：x＝y上的一點P ( t , t ) 後，遵循「入射角等於反 射角」（這相當於說：入射線及反射線都和鏡面L：x＝y 夾相同的角θ）的原 理來進行反射。若反射的光箭通過圓中那個「五銖錢區域」（外圓內方，上面 有「五銖」兩字的篆文），玩家就可獲得1個「五銖錢硬幣」；又若反射的光 箭通過「五銖錢區域」中央的正方形區域，玩家還可獲得額外獎勵而總共得 到2個「五銖錢硬幣」。 （※請注意：在本題中，我們假設虛擬的光箭經過「五銖錢區域」時仍然依直

    線方向前進而不會產生反射。） 今設右圖中的五銖錢區域的外緣為圓C：( x－10 )$^{2}$＋( y－4 )$^{2}$＝16，中央的正方

    形的中心就是圓心K ( 10 , 4 )，又已知此正方形的四個頂點中，位於中心的左下角的頂點的坐標為B ( 9 , 2 )。

    請就以下三個小題作答。'
  shared_asset: g4_1_3
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 設A ( 12 , 10 ) 相對於L：x－y＝0之對稱點A′ ( a , b )，$m_{L}$＝1， 故$m_{\overline{AA'}}=\frac{10-b}{12-a}$＝－1……①， 又$\overline{AA'}$中點 ($\frac{12+a}{2}$,$\frac{10 + b}{2}$) ∈ L， ⇒ $\frac{12+a}{2}$＝$\frac{10 + b}{2}$ ……②， 解①②得$\begin{cases}10-b=a-12 \\ 12+a=10+b\end{cases}$ ⇒ $\begin{cases}a=10 \\ b=12\end{cases}$ ⇒ A′ ( 10 , 12 )， 故選(A)。
