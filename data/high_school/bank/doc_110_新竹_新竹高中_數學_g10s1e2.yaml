  stem: 若一直線通過 ( 2 , 5 )，(－2 , 3 ) 兩點，求此直線的x截距＝＿＿＿＿。
  answer:
  - －8
  answer_status: verified
  answer_source: answer_key
  explanation: L過 ( 2 , 5 )，(－2 , 3 ) ⇒ $m_{L}$＝$\frac{5-3}{2-(-2)}$＝$\frac{1}{2}$， 得L：x－2y＝－8， 令y＝0，x＝－8， 得x截距為－8。
