  stem: 克裡諾林裙撐（Crinoline）是一種流行於1830年代至1860年代間的女性服裝。裙撐為類似鳥籠造型的構造，女性將其穿在裙子下方，可以讓裙裝在視覺上膨大化。然而穿著這種服裝，會使行動受到影響，使女性在進行家務時，更容易將自己絆倒，請問有關此種服飾，下列何者正確？
