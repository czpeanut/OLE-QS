  stem: '資料一：日治時期的臺灣在殖民政府支持下出現不少女性雜誌，內容談論關於「新女性」的形象，例如家庭主婦能操作現代家電、將家打理的整整齊齊、對兒女苦心栽培等。

    資料二：解嚴後的臺灣的婦運代表人物，其中以施寄青最為知名，她於1989年出版了《走過婚姻》一書，該著作是臺灣當時最具代表性的女性著作之一。她以自身婚姻與婚變為例，敘說她的成長以及最後決心踏入婦助專家領域的過程，對女性極具啟發意義。

    閱讀以上二段資料，請選出下列敘述正確者？'
