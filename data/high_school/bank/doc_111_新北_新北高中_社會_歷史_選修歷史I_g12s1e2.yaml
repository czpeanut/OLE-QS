  group_stem: '◎資料一：選美比賽常被批判物化女性，其中以美國小姐選美比賽為例，2017年爆發董事會以極不堪字眼評論參賽者的電子郵件內容後，除了改由同為選美冠軍的卡爾森擔任董事會主席，更發表聲明宣布取消競賽中泳裝及晚禮服的部分，改以評委進行現場互動的方式，著重顯示參賽者自己的個人特質、才能及熱情去獲取美國小姐的位子。這些改革被認為是呼應了「#Me Too」運動。

    資料二：「#Me Too」運動的特點如下：一，性侵及性騷擾受害者願意以實名分享自己的故事及作出指控，並對自己的言論負責，而非無的放矢；二，採用被社會公認為第四公權力的網路媒體，作為主要申訴管道；三，希望引起社會對性侵及性騷擾的關注及討論，以取得公義及推動制度改革；四，由個別性侵或性騷擾倖存者透過社交媒體自發分享自己的故事，並非團體行動。'
