  stem: '資料一：在臺灣傳統祭祀祖神的神臺上會出現「觀音媽聯」的彩圖，其最為常見的排序為下：

    第一層：觀音菩薩（陪祀善財、龍女）。

    第二層：媽祖（陪祀香火女、執扇侍女或千里眼、順風耳）。

    第三層：灶神（龍邊）與土地公（虎邊）的坐像。

    資料二：《天妃顯聖錄》篇首，由明神宗朝禮部尚書林堯俞（莆田籍）所撰序文云：「天妃，吾宗都巡願公之女也。……相傳謂大士轉身，其救世利人，扶危濟險之靈，與慈航寶筏，度一切苦厄，均屬慈悲至性，得無大士之遞變遞現於人間乎？」

    根據兩則資料，請判斷關於媽祖和觀音的描述下列何者正確？'
  options:
  - label: A
    content: 觀音高於媽祖，因為外來的和尚會唸經
  - label: B
    content: 媽祖高於觀音，臺灣比較需要海洋神明
  - label: C
    content: 觀音高於媽祖，默娘是觀音的凡間化身
  - label: D
    content: 媽祖高於觀音，媽祖融入佛道兩宗教
