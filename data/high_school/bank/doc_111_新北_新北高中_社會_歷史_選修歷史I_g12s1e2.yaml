  group_stem: '◎資料一：探討慰安婦的動機實無意義，以1930年代臺灣民情而言，「自願」擔任慰安婦不會是女性職業優先選項，背後多是因為經濟或社會壓力所致，例如：家庭負債；而且我們應當以國家如何介入使「女性成為國家／軍隊／戰爭解決軍人性慾的工具」，以及強迫從事的奴隸制度角度來檢視。除了多數是被欺騙、抽籤所致外，在無可選擇的經濟壓力下的選擇，以及奴隸制度的人權迫害角度，慰安婦「自願」與否都是受害者。

    資料二：有人從「國族」的觀點切入，認為臺灣慰安婦是「中華民族」的受難者，但簡化了阿嬤們的個人生命，擅自替她們架上國家／民族認同的擔子，也有人對雕像的特徵有如「純潔少女」提出省思質疑。一向支持慰安婦議題並認為日本必須以國家層級負責的日本女性主義學者上野千鶴子也觀察到，若女性成為家父長保護的弱女子，為男性統治者與男性被統治者鬥爭運用，或將慰安婦視為對民族的強暴行為，其實一如日本右派對慰安婦塑像的反應。踹像行為，實為無禮，但若不能尊重慰安婦女性自主權利，只藉以發酵妙作議題以圖己用，則令人遺憾，也褻瀆人權。

    資料三：慰安婦阿嬤面對日本政府、日本人的態度各有所不同。有的人願意和日本人建立友誼：有的人看到日本人就氣憤難平。她們不是一個被塑造的「象徵」或概念，而是有生命的「人」。 （資料來源：范情、王力緯(2018)。〈國家民族夾缝中，看見「慰安婦」女性人權〉。性別平等教育季刊(85)，頁41-48。）'
