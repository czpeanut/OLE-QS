    資料二：八世紀大和、奈良時期，育有三子的文武天皇病重時，指名讓位給母親阿閉皇女，是為元明天皇。之後，元明天皇讓位给長女冰高皇女，是為元正天皇。元正在位八年，讓位給文武天皇之子，也就是自己的姪子聖武天皇。聖武天皇立女兒阿倍為皇太子，聖武過世後，阿倍即位，是為孝謙天皇。

    資料三：十九世紀明治天皇時期制定《皇室典範》，第一章第一條明訂：「大日本帝國皇位由皇統男子繼承之。」

    資料四：二十一世紀初德仁太子夫婦愛女愛子出生後，首相小泉純一郎召開會議，希望考量時代變遷重新討論天皇繼位制度，開放女性繼承皇位，儘管這項提議在民意調查中得到多數民意支持，但未能在會議中達成共識。2006年德仁之弟兒子悠仁出生之後，小泉首相的提議遂遭擱置。

