  stem: '以下是清代光緒年間臺灣地區的兩份契約（代號皆為人名）：

    契約一：「甲自幼憑媒聘娶某氏長女乙為室。現年二十二歲。該氏入門數載，並無生育男女。兼之性情乖僻，不孝於翁姑、不睦於妯娌竊念人子娶妻，原期上事父母、下傳宗嗣，今娶妻若此，不特無以對父母，抑且獲罪於祖宗。該氏身犯七出不只一端。……親立休書交付該氏收執，或回外家，或改嫁別姓，均聽自便……（立休書人署名甲）」

    契約二：「因先年次男娶室……未生男育女，茲因去年間次男在家偶得疾恙，不幸身亡……不得已母媳相商允願贖身另配。所以請長男出首，得請媒人先去某家言定贖身價銀伍什大員正……將次男之室隻身經由媒交回伊父帶回另擇佳婿……（過世次男之母、長兄、媒人、代筆人署名）」

    從這兩份契約中，我們對清代的婚姻認識，何者正確？'
  options:
  - label: A
    content: 當時的女方在自身婚姻關係存續問題上個人有絕對的發言權
  - label: B
    content: 有無生育子女是決定女方在夫家地位的重要因素
  - label: C
    content: 宋代以後，理學大興，理學家發展出「七出」之說，明清時期列為法律
  - label: D
    content: 清光緒年間臺灣男多於女，結婚時男方需付出大筆聘金，因此女方要回到娘家需繳付贖金
