questions:
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 歷史系大一新生小光同學想要利用寒假期間，撰寫一篇關於「臺灣慰安婦」的期刊論文，他向老師詢問過蒐集資料的方式，在老師的要求之下，必須多以「第一手資料」為撰文的基礎架構，根據你的歷史知識判斷，下述何項資料是屬於「第一手資料」？
  options:
  - label: A
    content: 在校內圖書館借閱的《臺灣的慰安婦》一書
  - label: B
    content: 在地方公共圖書館借閱《蘆葦之歌》電影記錄片
  - label: C
    content: 親自訪問目前臺灣僅存的慰安婦阿嬤
  - label: D
    content: 在婦女新知協會借閱關於慰安婦的當代報章期刊
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 同學利用週休二日到臺南作古蹟巡禮時，來到一個原住民族群的公廨，看到公廨裡面有一個盛著清水、插著甘蔗葉的壺，導覽人員說這個族群很重視對「阿立祖」的崇拜，此壺即阿立祖的象徵。這可能是哪個族群？
  options:
  - label: A
    content: 布農族
  - label: B
    content: 西拉雅族
  - label: C
    content: 排灣族
  - label: D
    content: 巴則海族
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 十七世紀一份有關臺灣原住民的文獻：「是臺灣唯一非農耕也非漁獵、採集的南島人種，他們以做生意維生，拿硫磺、黃金向漢人交換玻璃珠、鐵器、織品，以便運用這些交換到的貨物再向其他更內陸的原住民交換黃金、鹿皮等物品，他們也製造鐵製農具、鹽、箭頭、衣物、小刀等物品，穿梭於漢人、其他原住民之間。」請問：文獻記載的是哪一個地區的臺灣原住民？
  options:
  - label: A
    content: 噶瑪蘭
  - label: B
    content: 雞籠
  - label: C
    content: 竹藝
  - label: D
    content: 打狗
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 1696年(康熙三十五年)，由於福州榕城失火，於是福建巡撫派遣郁永河來臺灣採硫礦。臺灣出產硫礦的地點為北部地區，當時為了能順利開採硫礦，郁永河聘用淡水一帶的原住民幫忙採礦。請問：當時幫忙郁永河採礦的原住民族是下列何者？
  options:
  - label: A
    content: 西拉雅族人
  - label: B
    content: 貓霧捒族
  - label: C
    content: 阿美族
  - label: D
    content: 凱達格蘭族
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「他們會將吃剩的鹿肉曬乾，做成臘肉。並且剖開鹿的腸胃，取出鹿剛吃下去但尚未消化完畢的青草，稱為『百草膏』。東番人覺得『百草膏』是人間美味，百吃不膩；但漢人看見時，卻覺得噁心嘔吐。」請依據你的歷史知識，判斷下列敘述何者正確？
  options:
  - label: A
    content: 「東番人」指的是臺灣的高山族
  - label: B
    content: 這段文字可見原住民族的狩獵習慣、飲食文化與漢人的農耕文化不同
  - label: C
    content: 文中可見東番人的文化水準較低，較不具有衛生知識
  - label: D
    content: 由於文中的敘述不具價值判斷，可以推測記載者應該是公正的第三方，為西方傳教士
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 阿俊看到一篇新聞「紐西蘭毛利人來臺尋根」，仔細閱讀之後才知道原來原住民族與毛利人竟然可能密切相關。請問：下列推論何者正確？
  options:
  - label: A
    content: 此報導內容不實，臺灣與紐西蘭相距甚遠，且缺乏大型渡海器具
  - label: B
    content: 此報導完全可信，由此可知臺灣與紐西蘭很早即已進行文化交流
  - label: C
    content: 報導缺乏文化素養，毛利人的歲時祭儀與原住民族大不相同，彼此應互不相干
  - label: D
    content: 此報導尚需後續追蹤，將毛利人的語言與原住民族相比對，似乎可找到類似的部分，但是否一脈相承必須從人類學進行深入研究
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 附圖是102年1月臺灣某一縣市的原住民諸族中，人口數最多的前五名統計圖。請問：此圖會是哪一縣市？
  options:
  - label: A
    content: 花蓮縣
  - label: B
    content: 臺東縣
  - label: C
    content: 屏東縣
  - label: D
    content: 高雄市
