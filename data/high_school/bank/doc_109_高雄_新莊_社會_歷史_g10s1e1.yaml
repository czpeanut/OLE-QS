- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 一位學生計畫撰寫一篇小論文，於是到圖書館借閱了《巴達維亞城日記》、《裨海紀遊》、《馬偕日記》三本書。請問：這位學生想要研究的主題最可能是下列何者？
  options:
  - label: A
    content: 平埔族社會的變遷
  - label: B
    content: 長老教會來臺傳教
  - label: C
    content: 東印度公司的貿易
  - label: D
    content: 行郊的成立和興衰
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 學者在進行臺灣人種的研究過程中，發現臺灣人的體態特徵與典型蒙古利亞種有所不同，例如：臉型較方、雙眼皮等；生活習俗方面，如結婚時，母舅坐大位，以及禮品有檳榔等，與傳統漢人也不相同。請問：這段資料我們可以如何解讀？
  options:
  - label: A
    content: 臺灣人的生理特徵與習俗都與漢人大不相同，證明彼此無直接血統關係
  - label: B
    content: 從生活習俗中可以看出母系社會的遺留，說明臺灣人有平埔族群的血統
  - label: C
    content: 從生理特徵與生活習俗可以看出臺灣人與典型漢人沒有明顯的差異
  - label: D
    content: 從生理特徵與生活習俗可以證明臺灣人有荷蘭與西班牙血統
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 資料一：郁永河《裨海紀遊》描述其停留牛罵頭期問：「有番婦至……貌不類人，舉手指畫，若有所欲，余探得食物與之；社人望見，亟麾之去，曰『此婦有術，擅崇人，毋令得近也!』」資料二：「尪姨帶領西拉雅人舉行『嚎海祭』，以感念先人渡海來臺的艱辛。」根據以上敘述，我們應有何適當的解讀？
  options:
  - label: A
    content: 根據社人的對待態度判斷，資料一中的番婦一定不是尪姨
  - label: B
    content: 原住民對女巫皆非常敬重
  - label: C
    content: 兩族的尪姨地位不太一樣
  - label: D
    content: 西拉雅族的尪姨不但掌握村民的宗教生活，並且還是實質的政治領袖
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 資料一：「番民老而無妻，各社戶口日益衰微。」資料二：「番童拱立背誦，……已有讀『四子書』、習一經者。」資料三：「(當地人)議事必於公廨，調發易也。」資料四：「女子健作；女常勞，男常逸。」請問：以上資料哪些是晚明陳第來到臺灣所看到的景象？
  options:
  - label: A
    content: 資料一與資料二
  - label: B
    content: 資料二與資料三
  - label: C
    content: 資料三與資料四
  - label: D
    content: 資料一與資料四
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 阿西到臺灣歷史博物館看特展，發現雍正九年後，臺灣中部平原的地圖上突然出現一些特殊的番社名，例如感恩社、遷善社、德化社、興隆社等。查詢資料後，發現是一起熟番不滿沉重勞役憤而抗官的事件，亂平後清朝將各社熟番社名更動以示教化。請問：阿西所查的熟番抗官事件是指下列何者？
  options:
  - label: A
    content: 霧社事件
  - label: B
    content: 牡丹社事件
  - label: C
    content: 麻豆事件
  - label: D
    content: 大甲西社事件
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 大言是1661年隨軍來臺的漢人。請問：下列何事他<u>不曾</u>經歷過？
  options:
  - label: A
    content: 從鹿耳門水道進攻，並攻陷普羅民遮城
  - label: B
    content: 前往林鳳營進行屯田，以穩定食物供應來源
  - label: C
    content: 與原住民族爆發衝突，並參與鎮壓卑南王的軍事行動
  - label: D
    content: 參與三藩之亂，曾占領閩粵沿海地區
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 臺灣史上某一制度提及：「統治者要求想與原住民族部落交易的漢人，必須先透過喊價的方式，來取得某段時間在該社的貿易經營權，得標者須支付現金給統治者當作稅收，得標的商人承辦原住民族社中日用品的交易，也代替統治者向原住民族徵收賦稅，此制度顯示經濟剝削的殖民體制本質，甚至延續至清領時期。」請問：上述應是指何項制度？
  options:
  - label: A
    content: 消除一田二主制度
  - label: B
    content: 贌社制度
  - label: C
    content: 合股合營制度
  - label: D
    content: 兵農合一軍屯制度
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 1930年代，南投地區爆發「霧社事件」，導致馬赫坡社大量族人死亡，領導頭目莫那．魯道最終也身亡，此事件導致石塚英藏總督的下臺，日人也重新調整在臺理蕃政策。日人在事件過程中更是不顧及國際輿論壓力，啟用毒氣、大砲、飛機轟炸等手段，一切只為報復性的嚴懲賽德克族，雙方都付出沉痛的代價。就你的歷史知識辨析，下述選項何者<u>並非</u>導致霧社事件發生的背景原因？
  options:
  - label: A
    content: 日人長期對蕃人的過度勞役
  - label: B
    content: 舊有理蕃政策導致原住民族既有獵場和祖靈地受壓迫
  - label: C
    content: 日本放縱資本家掠奪山林資源
  - label: D
    content: 移居川中島的集團移住政策(南投仁愛鄉清流部落)政策為此事件的爆發的導火線
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 小薇在「臺灣古地圖集」，發現一張地圖，在圖上辨認出一些由拉丁字母拼成的地名，如聖地牙哥、聖薩爾瓦多等。請問：此地圖最有可能為哪一國占領臺灣時繪製的？
  options:
  - label: A
    content: 荷蘭
  - label: B
    content: 西班牙
  - label: C
    content: 葡萄牙
  - label: D
    content: 法國
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 有一位臺灣原住民族向其子孫敘述他們的家族史：「祖先原來住在群山萬嶺之中，但來了一群『新的統治者』，強迫族人遷移到較低海拔的地區，集中居住。生活環境改變了，族人一直受到瘧疾、霍亂等新疾病的侵襲，部落裡的巫醫全都束手無策。」請問：這些「新的統治者」為何？
  options:
  - label: A
    content: 荷蘭東印度公司官員
  - label: B
    content: 鄭氏政權時期承天府官員
  - label: C
    content: 清治時期臺灣府官員
  - label: D
    content: 日治時期臺灣總督府官員
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 資料甲：《臺灣日日新報》在其〈番婦墜溪行蹤不明〉寫到一名泰雅少女莎韻，為了幫她的恩師田北搬運行李，不慎在途經南溪時從原木橋下滑，從此行蹤不明。資料乙：當時臺灣總督長谷川清為表揚其義行，特頒贈桃型「愛國少女莎韻之鐘」，以茲紀念。請問：這兩則資料最早可能在哪個年代出現？
  options:
  - label: A
    content: 1910年代
  - label: B
    content: 1920年代
  - label: C
    content: 1940年代
  - label: D
    content: 1950年代
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 一份觀察紀錄記載著：「統治者藉由盛大的排場，精心設計的儀式，讓地方代表震攝於領導的威儀，感受統治集團的強大力量。統治者在儀式中發給地方代表藤枝，代表權力的授予，並強調須定期繳回，重新頒授，另一方面，在現場為了要準確傳達統治者的要求，也會有各種即席翻譯，新港語、虎尾壠語、山地語、馬卡道語、排灣語、魯凱語，同時部分重要人物，如大肚王、琅嶠首領，也會受到特別禮遇。」請問這份紀錄記載著下列何者的盛況？
  options:
  - label: A
    content: 17世紀初的大員，地方會議
  - label: B
    content: 19世紀中的恆春縣，設置行政區域
  - label: C
    content: 19世紀的琅嶠，解決船難
  - label: D
    content: 20世紀中的臺北，臺灣博覽會
- id: doc_109_高雄_新莊_社會_歷史_g10s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 以下是1942年一位派遣在外、蘇澳郡Buta（武塔）社出身的豐田健太郎寄給妻子的信：「令我感到最高興的是已成為偉大日本帝國的義勇軍。我不是軍伕，也不是軍屬。……在這裡每天過著很好的生活，有很多鹽巴可以吃，連甜點這種奢侈的東西都是今生第一次嘗到。日軍非常強大，沒有一個□兵在這裡，只看到當地人。這裡的土地廣闊且肥沃，比臺灣的土壤好得多……。」有關這封信的解讀，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: 文中的□，指的是中國
  - label: B
    content: 這封信可能是從菲律賓寄回來的
  - label: C
