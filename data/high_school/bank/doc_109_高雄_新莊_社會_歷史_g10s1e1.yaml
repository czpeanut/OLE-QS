  stem: '3. 電影《灣生回家》因爆發製作人假冒是灣生後代的醜聞而蒙上陰影，但除開此事外，此部電影勾起臺灣人對灣生的注意與瞭解卻是不爭的事實。（灣生一般係指在臺灣出生長大的日籍人士，廣義也泛指曾長期居住過臺灣或對臺灣生活有濃烈情感者）電影藉由串聯數個灣生們的故事，透過口述歷史的拍攝手法，記錄著往返日、臺兩地這群高齡七、八十歲的爺爺、奶奶們，描述兒時在臺灣生活的歷程。電影內容包含在北一女中的就學過程、東部兒時田園生活甚至與當地原住民族的交流互動等生活經驗，影片中也提及日人在臺建置多處移民村聚落，諸如東部吉野村、賀田村、鹿野村，和南部千歲村等都是電影所提及的灣生們兒時回憶的故鄉題材。請問：

    (1)日人在臺建置多處移民聚落，這些移民村有的是民間資本家私營，有的是官方計畫主導，然而，二十世紀以後為加速移民試驗，臺灣總督府開始積極介入官營移民措施。當時進行官方集團式移民的主要動機應為何者？'
