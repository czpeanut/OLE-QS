  stem: 從前人們透過觀察太陽的位置來決定時間，因此不同經度的地方，其時間也有所不同。1863 年，首次使用時區的概念，解決了這個問題。以被 15 整除的經線為中心（即 0 度，東經 15 度，東經 30 度，……，東經 165 度，東經 180 度，西經 15 度，西經 30 度，……，西經 165 度，西經 180 度，其中東經 180 度與西經 180 度重合），向東西兩側延伸 7.5 度，即每 15 度劃分一個時區。所以每差一個時區，區時相差一個小時。另外，原則上在東經 180 度處設立國際換日線，以避免日期的紊亂。已知<u>埃及</u> <u>開羅</u>機場約在北緯 30°，東經 30°；<u>浙江</u> <u>蘭山</u>機場約在北緯 30°，東經 120°。這兩地每週都有直航班機往返，今從<u>開羅</u>當地時間星期三 23 時 50 分起飛，經 11 個小時後直飛至<u>蘭山</u>機場。此直航班機抵達<u>蘭山</u>機場的時間為＿＿＿＿。（請以 24 時制說明星期幾何時）
  answer:
  - 星期四 16 時 50 分
  answer_status: verified
  answer_source: answer_key
