- id: doc_110_台南_台南二中_數學_數B_g11s2e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 一正立方體的八個頂點中有四個頂點，各頂點彼此之間的距離都是 2，試問此正立方體的體積為＿＿＿＿。
  answer:
  - $2\sqrt{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '示意圖如右，四個頂點之間距離均為 2

    則可能為 A，C，F，H 或 B，D，E，G

    令$\overline{AF}$＝2 ⇒正立方體的邊長＝$\frac{2}{\sqrt{2}}$＝$\sqrt{2}$

    故所求體積為$(\sqrt{2} )^{3}$＝$2\sqrt{2}$'
