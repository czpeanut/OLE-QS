  stem: 某次班會討論班遊，雖然大家都表達了意見，但卻來不及得出結論。當晚，亞均私下召集其他幹部做出決定，並在隔天早自習宣布結果及理由。請問從行政法的正當程序原則來看，下列敘述何者正確？
  options:
  - label: A
    content: 班遊經過班會討論，讓同學有機會充分表達意見，符合民主原則
  - label: B
    content: 班級幹部都是由同學們投票選出來的，故所做的決定符合公正原則
  - label: C
    content: 雖然幹部是私下討論，但在早自習宣布決定跟理由就符合公開原則
  - label: D
    content: 如果幹部進行私下討論時，在網路上開直播，則可以符合公開原則
