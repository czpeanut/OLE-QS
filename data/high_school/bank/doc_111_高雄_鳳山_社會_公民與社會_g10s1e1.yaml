  group_stem: '「婦女保障名額」是我國立憲之初即明文規定之措施，用以促進男女在參政上的實質平等。有鑑於政治場域長期以來多由男性掌握，傳統觀念與社會經濟的不平等（受教育機會少、經濟不獨立等），使得女性難以與男性競爭，因而有此設計。

    學者黃長玲曾經做過一份研究，以我國 2002、2005 與 2009 年地方選舉中，針對因婦女保障名額而「當選的女人」與「落選的男人」進行比較。三次選舉共有 593 名女性當選，其中有 68 位是受席次保障而當選（即 68 位男性因此落選）。將每一組「當選的女人」與「落選的男人」兩人進行資歷（教育程度、社會參與度及政治經驗）的比較，比較結果如圖所示，請根據研究結果回答以下問題：'
