  stem: 在民主制度中，法治是一重要關鍵，洛克亦曾經說過：「沒有法律就沒有自由」，若僅有民主而沒有法治，可能使社會造成動亂，甚至毫無秩序可言，下列民主與法治的敘述，何者正確？
