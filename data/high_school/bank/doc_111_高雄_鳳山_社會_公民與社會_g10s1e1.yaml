  stem: 臺東縣馬蘭國小校長認為臺東縣是本土語言別最多的縣市，不同的語言背後蘊含著不同的文化資產。學校可透過母語商店、母語廣播、校埕說古、米食教學、親子文化營等文化體驗活動，將本土語言結合生活文化，讓學生經由接觸、體驗到喜愛，領略到臺灣文化之美。請問下列何者與題幹同為實踐多元文化權？
  options:
  - label: A
    content: 為讓大家有共同語言及增加族群團結，強迫客家人、原住民學習閩南語
  - label: B
    content: 立法對於東南亞來臺歸化的新移民，要求就讀夜間補校以早日適應臺灣生活
