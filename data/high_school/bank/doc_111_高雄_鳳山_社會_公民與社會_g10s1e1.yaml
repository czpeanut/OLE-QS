  stem: 西藏（Tibet）問題長期以來受到國際社會的關注，在印度北部達蘭薩拉還有個「西藏流亡政府」，對外號稱是代表六百萬藏民的唯一合法政府。在中國目前的版圖中有一個區域稱之為「西藏自治區」，而所謂的「藏獨」運動就是希望在中國西南藏民居住的地區，能夠建立一個獨立於中國之外，真正屬於藏民自治的國家。以目前的事實來看，藏獨運動者心目中獨立的「藏國」，欠缺現代國家的哪一個基本條件？
  options:
  - label: A
    content: 人民
  - label: B
