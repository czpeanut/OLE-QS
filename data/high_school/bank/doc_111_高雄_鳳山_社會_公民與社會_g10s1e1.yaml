    content: 飲食不屬於文化的一種，若無法確定製造過程衛生，應避免推廣到國外
  - label: D
    content: 文化部藉由社區總體營造計畫，將社區文化融入當地居民生活
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 文化部藉由社區總體營造計畫，將社區文化融人當地居民生活，符合多元文化主義，故(D)正確。(A)強迫客家人、原住民學習閩南語，以及(B)要求歸化的新移民就讀夜間補校，均非多元文化權的實踐。(C)飲食為文化的一種。
