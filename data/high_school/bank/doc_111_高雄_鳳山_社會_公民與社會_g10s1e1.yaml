  group_stem: '據報載，為身心障礙者爭取權益的各縣市政府「身心障礙權益推動小組」中，竟然只有少數是身心障礙人士。有立法委員希望立法院在審查《身心障礙者權益保障法》第 10 條修正案時，能把身心障礙權益推動小組法制化，明定成員須透過公開遴選，並保障有半數成員是身心障礙人士。

