  stem: 狹義的公民身分（citizenship)，通常用以指稱一國人民因符合法定資格而享有的權利與盡義務的身分；但實際上，不必然都建立在狹義的定義下，現代社會亦有從權利內涵的角度，探討基於公民身分而能擁有的各項權利。下列關於「公民身分」的敘述，何者正確？
  options:
  - label: A
    content: 公民身分須有一套固定的標準界定權利義務，即各國法定資格
  - label: B
    content: 身分的內涵不只是被動地取得資格，還包含主動地行使所擁有的權利
  - label: C
    content: 演變與擴展的過程是從普遍性個人到關注少數群體
  - label: D
    content: 演變至今已經在國際上獲得共識，各國公民擁有的權利因此趨於一致
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 公民身分的內涵不只是消極的自由權，還包含主動的參政權等，故(B)正確。(A)公民身分的界定不是一套固定的標準，會隨時代改變。(C)公民身分的演變是由有限人權變成普遍人權。(D)公民權利內涵在國際上未獲得共識。
