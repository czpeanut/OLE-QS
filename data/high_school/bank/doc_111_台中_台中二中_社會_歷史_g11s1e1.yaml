  stem: 「巴比倫之囚」原指當年猶太人被兩河流域加爾底亞帝國打敗，被迫由耶路撒冷遷往巴比倫一事。中古西歐基督教史上，也曾發生類似情節而引用此稱呼，請問下列就此事或此事造成的影響之敘述，何者正確？
  options:
  - label: A
    content: 是指 1075 年格列哥里七世革除亨利四世的教權，亨利四世被迫妥協，冒著嚴寒前往羅馬，在大風雪中罰站，並於城堡前向教皇「懺悔罪過」
