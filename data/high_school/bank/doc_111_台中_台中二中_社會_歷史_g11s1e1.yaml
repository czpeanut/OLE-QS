  explanation: 資料一為伊比鳩魯學派的主張，資料二為亞里斯多德的主張，資料三為蘇格拉底的主張，資料四為柏拉圖的主張，因此(B)為正解。(A)兩者並非同一位哲學家。(C)《理想國》為資料四哲學家的著作。(D)四位哲學家的時間先後依序為資料三→資料四→資料二→資料一。
