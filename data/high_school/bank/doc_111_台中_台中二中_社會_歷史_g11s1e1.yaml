- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「在某個國家中手工業與貿易發達，由奴隸負責大部分的生產與勞動工作，使國內男性自由公民得以擁有時間參與公共事務與國家決策，他們平時喜歡聚在市集與廣場上討論時事，或者與人辯論，也喜歡到劇院觀看最新的戲劇演出。」請問上述情況最可能為哪一政權的情況？
  options:
  - label: A
    content: 此政權最重要的宗教為希臘正教信仰
  - label: B
    content: 此政權深受軍國主義影響，合格軍人養成過程嚴謹
  - label: C
    content: 此政權強勢主導提洛同盟，參與伯羅奔尼撒戰爭
  - label: D
    content: 此政權重視公共工程，隨著其擴張此類建築遍布各地
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從男性自由公民喜歡參與公共事務與國家決策，並喜歡討論時事與觀看戲劇等特徵，可推知為古希臘雅典城邦，(C)為正解。(A)希臘正教為東歐的基督宗教信仰，此時基督教尚未形成。(B)此為斯巴達城邦的特徵。(D)雅典城邦並未向外擴張版圖。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有一個民族的文學作品中寫到：「風──仍不停，六日又六夜。洪水巨浪吞沒了大地。第七天，南來的波濤平息，海水平靜了，洪水也休停。」這個民族不單要面對洪水氾濫的恐懼，也存在外族威脅。請問這個民族可能寫出下列哪段文字敘述？
  options:
  - label: A
    content: 「壯觀的生命寶殿起於善端，陰暗的死亡之窟立於惡端。」
  - label: B
    content: 「別了故鄉特洛伊，在水一方……羅馬的榮光悠久無疆。」
  - label: C
    content: 「以色列的眾子……一同到埃及、他們的名字記在下面。」
  - label: D
    content: 「沒有永遠！……難道曾有人蓋過永遠不會倒的房子嗎？」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從這個民族同時要面對洪水氾濫與外患的威脅，可以推知其位於兩河流域文明區域，這些遭遇也使得當地的文明特色較為悲觀，(D)為正解。(A)善惡二元為波斯帝國祆教的特色。(B)特洛伊位於小亞細亞地區。(C)以色列、埃及皆不在兩河流域地區。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '請閱讀下列三則與希臘哲學家主張相關的資料：

    資料一：「物質世界的背後，必定有一個實在存在，這個實在為觀念世界」、「教育的目的就在找尋真正的理念、注重品格，引導他們具有自己思想的能力」。

    資料二：「最聰明的是明白自己無知的人；我只知道一件事，就是我一無所知」、「關心人生的意義與目的，認識自己，拓展自己的心智以分辨真正的善」。

    資料三：「不先存在於理性世界中的事物就不可能出現於自然界中」、「從感官經驗出發後，再依照嚴格的邏輯推理來探究一切事理」。

    針對三則資料，下列敘述何者正確？'
  options:
  - label: A
    content: 資料三的哲學家會駁斥資料一的哲學
  - label: B
    content: 資料二的哲學家被譽為生物科學的鼻祖
  - label: C
    content: 「將哲學從天上召喚下來，使它在各地落腳生根，並進入各個家庭，還迫使它審視生命、倫理與善惡」這是對資料三的評價
  - label: D
    content: 資料二誕生的背景與哲學家長期接觸兩河流域的天文知識有關
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一重視觀念，為柏拉圖的哲學；資料二強調認識自己，為蘇格拉底的哲學；資料三從感官經驗出發，為亞里斯多德的哲學，因此(A)為正解。(B)被譽為生物科學鼻祖的是資料三的亞里斯多德。(C)資料二的蘇格拉底被評為「將哲學從天上召喚下來」。(D)蘇格拉底之後的哲學重心已從宇宙本質轉為對現實人生與社會的關懷，與兩河流域的天文學知識無明顯關聯。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 假如問一個古希臘人，狄蜜特是誰的話，他會說，狄蜜特有一個非常漂亮的女兒，被黑帝斯搶走了，因此狄蜜特很悲傷。假如問一個古羅馬人，克瑞斯（即狄蜜特的羅馬化名字）是誰的話，他會說，克瑞斯是一個祭司，他的地位比朱比特低，但是比佛洛拉（掌青春與歡樂的女神）的地位要高；克瑞斯與立波爾、利貝拉均是掌管農業的神。由以上資料來比較希臘人與羅馬人對神話的態度，羅馬人較重視哪一要素？
  options:
  - label: A
    content: 故事情節
  - label: B
    content: 關係與職掌
  - label: C
    content: 親情倫理
  - label: D
    content: 與人間事務的關聯
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 羅馬神話多承襲自希臘神話，但由於羅馬民族的務實特性，因此在敘述神話的態度上，更重視主人翁的(B)關係與其職掌，而非簡單敘述故事情節。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 他在寫書的過程中，非常重視直接史料和口傳史料的運用，經常親自採訪古蹟、神廟、戰爭紀念碑等考古學的資料，遇到外國語碑文時，他都要商請當地人代為翻譯。他也親自到小亞細亞、埃及、兩河地區考察，以驗證對史料蒐集的慎重與完備。後人把他的成就與中國的司馬遷相比。請問上文是指何人？
  options:
  - label: A
    content: 修昔提底斯
  - label: B
    content: 亞里斯多德
  - label: C
    content: 希羅多德
  - label: D
    content: 荷馬
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 這位史學成就被拿來與中國司馬遷相比的希臘史學家為(C)希羅多德，被尊為西方的史學之父。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 3
  stem: 上古時某部作品流傳於同一地區不同民族之間。這部作品以主角為名，他企圖改變人終有一死的命運，但在經歷許多冒險與挑戰後，卻因一時疏失而喪失了永生不死的機會。這部作品透露出此文化認為命運無法改變的一面，勳業、名譽與成就均無助於永生。請問下列哪個選項最有可能為此一作品的內文？
  options:
  - label: A
    content: 「我雖然行過死蔭的幽谷，也不怕遭害。因為你與我同在。你的杖，你的竿，都安慰我」
  - label: B
    content: 「此刻我躺下睡覺，祈禱主為我保留靈魂，如我在醒前死去，請主將我的靈魂帶走」
  - label: C
    content: 「你永遠不會找到你想要的生命。當神明創造人的時候，衪們給了他死亡，將生命留給自己……這是人所分到的命運」
  - label: D
    content: 「我認識你，我知道你的名字，以及那些與你同在正義的大廳中的四十二位神明的名字。他們以行惡者為食物，並且在奧塞利斯審查品行之時飲他們行惡者的血」
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述的作品為兩河流域的史詩《吉爾伽美什》，內容反映出兩河流域悲觀的文化特徵，(C)為正解。(A)出自《聖經》。(B)柏拉圖的祈禱文。(D)出自埃及的《死者之書》。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 3
  stem: 古希臘的某位哲學家，認為人要先了解自己，並具有懷疑精神，以找出事情的真相。這種理念受到羅馬哲學家西塞羅的盛讚，認為他「將人由天上帶回到人間來」。請問這位哲學家是誰？
  options:
  - label: A
    content: 蘇格拉底
  - label: B
    content: 柏拉圖
  - label: C
    content: 亞里斯多德
  - label: D
    content: 泰利斯
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 主張「人要先了解自己」，並被譽為「將人由天上帶回人間來」的希臘哲學家為(A)蘇格拉底。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 「在今日伊朗境內發現的記功石刻中，除了有以三種楔形文字寫成的記功銘文，還刻有一幅浮雕。浮雕中的『統治者』頭戴王冠，左手持弓，左腳踩在仰臥於地的高墨達身上。其身後站著手握弓箭和長矛的二名侍從，面前是九名被俘的國王。浮雕部分的上方為擬人形象的阿胡拉馬茲達神，他長有翅膀，帶著太陽圓盤在飛翔，眼睛正俯視該名統治者。該名『統治者』就是再次壯大『帝國』國勢的名君。」以下有關題文的解讀，何者正確？
  options:
  - label: A
    content: 該名「統治者」崇信唯一真神阿胡拉馬茲達
  - label: B
    content: 該「壯大『帝國』國勢的名君」意指亞歷山大
  - label: C
    content: 阿胡拉馬茲達俯視「統治者」代表太陽神信仰
  - label: D
    content: 此浮雕象徵著「統治者」的權力源自於神
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「伊朗境內」、「阿胡拉馬茲達神」的崇拜，即可推知此記功石刻與波斯帝國的祆教信仰相關，(D)為正解。(A)祆教為善惡二元對立，除了阿胡拉馬茲達等善神外，另有惡神阿利曼等。(B)此位壯大帝國的名君為大流士。(C)阿胡拉馬茲達神為「智慧」、造物主，並非太陽神。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 西元前 1 世紀，羅馬人受到斯多噶學派影響而提出的自然法觀念如何？
  options:
  - label: A
    content: 主張人類不具備追求理性、公理與正義的天性，故必須由法律規範人的一切行為
  - label: B
    content: 主張宇宙間有一種自然法則，代表理性、公理與正義，任何法律都必須與其一致，才具有正當性
  - label: C
    content: 主張理性、公理與正義都是神明所賜與，任何法律都必須與神的訓示一致，才具有正當性
  - label: D
    content: 主張天地萬物間都具有上帝耶和華施予的真、善、美，人類制定的最高法律必定與其一致
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 斯多噶學派認為宇宙是理性的展現，主張人應以理性節制欲望，順應自然法則，遵循美德以獲得幸福，故(B)為正解。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 在某位哲學家眼中，人不僅要把自己當作是感性的生物來對待，也要當作理性的生物來對待。人們應該用理性來研究自己，這就是「認識你自己」，也是一種自我認知與自我意識。請問這位哲學家是誰？
  options:
  - label: A
    content: 蘇格拉底
  - label: B
    content: 柏拉圖
  - label: C
    content: 亞里斯多德
  - label: D
    content: 斯多噶
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「認識你自己」為(A)蘇格拉底的名言，並以此說明他對希臘哲學與美學的看法。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 古埃及人追求永生，發展出陪葬咒文，幫助死者通過死亡之地，前往來世。古王國時，咒文僅刻置在金字塔內法老墳室的牆上，稱為「金字塔文」；中王國時，咒文刻在棺木內側，稱為「棺文」，在許多達官貴人、祭司墓室均有發現；到新王國時，咒文多寫在莎草紙卷軸上，置於死者身旁，稱為「死者之書」，竟然也出現在一般官吏，甚至女性、寵物與少數一般人的墓葬中。我們應如何理解這樣的演變？
  options:
  - label: A
    content: 死者之書內容愈趨複雜與多元
  - label: B
    content: 追求永生的願望與方式普及化
  - label: C
    content: 埃及政治社會控制力持續下滑
  - label: D
    content: 追求永生的願望逐漸成為一般人的觀念
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 追求永生的陪葬咒文，從一開始僅刻置在法老墳室牆上，後來流傳到達官貴人、祭司的棺文，最後是一般官吏、尋常人家的墓葬都發現莎草紙卷軸的《死者之書》，可見追求永生的願望已普及到一般人。同時，從墳室壁刻的陪葬咒文，變成刻在棺木內側，又演變成以莎草紙卷軸書寫，也可看出陪葬咒文的處理方式愈來愈簡便，因此(B)選項較(D)選項更佳。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 4
  stem: 某國皇帝經數十年征戰擴大領土範圍後，認為首都建設要能展現萬邦來朝的和諧氣勢，下令從統治的各地徵集材料，包括：來自黎巴嫩的針葉林木材；埃及的銀、銅；印度的象牙。請問文中某國最可能是
  options:
  - label: A
    content: 波斯帝國
  - label: B
    content: 亞歷山大帝國
  - label: C
    content: 羅馬帝國
  - label: D
    content: 拜占庭帝國
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 這個國家的皇帝亟欲營建出「萬邦來朝」的和諧氣勢，因此採用來自東方黎巴嫩、埃及、印度等地的建材，從帝國的文化特徵與相關地理位置來看，此國家應為東方的(A)波斯帝國。(B)(C)(D)三者皆為西方的帝國，既無追求「萬邦和諧」的文化特徵，也與東方的印度文明少有交流，不太可能特地採用印度的象牙為建材。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 4
  stem: '以下是有關古希臘時代雅典文化的兩則敘述：

    資料甲：人們家中都設有祭壇，城邦中到處可見神龕，衛城上神廟比比皆是。每個節日開始前要祭祀，前兆、凶兆和神諭會影響重大決定。準備遠行或店鋪開張等事務都要事先祈禱。

    資料乙：西元前 5 世紀後期，雅典出現一些稱為「辯士」（sophists）的教師，以教授辯論術為生，多從經驗角度考察宇宙，認為真理與人本身的需要或利益有關，沒有絕對真理。最有名的辯士普羅泰格拉斯主張：「人是萬物的尺度」。惟辯士在當時社會的名聲不佳。

    對照甲、乙兩則資料，辯士在當時社會「名聲不佳」的原因最可能是'
  options:
