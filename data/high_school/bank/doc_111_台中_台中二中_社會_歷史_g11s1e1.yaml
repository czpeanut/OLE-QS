    資料二：「知識是透過經驗觀察所獲得；要從人的普遍感官經驗出發，依照嚴格的邏輯推理來探究一切事物。」

    資料三：「我非常清楚地知道，我並沒有智慧，不論大的還是小的都沒有。教育是把我們的內心勾引出來的工具和方法，最有效的教育方法不是告訴人們答案，而是向他們提問。」

    資料四：「任何美的事物，都無法與美的原型（理念）相比；前者不過是對後者的一種模仿。美的事物有千萬種，而美的原型（理念）卻只有一個。」

