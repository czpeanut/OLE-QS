  group_stem: '「天然獨」常被指涉出生晚於西元 1980 年的年輕世代，認同自己是臺灣人，並且主張臺灣

    是個獨立的主權國家。關於天然獨的起因，沈暐婕在《臺灣天然獨世代的民族認同與國家認同》研究發現包含以下 3 項：一是社群網站的興起，個人接收的政治資訊與刺激增加；二則是中華人民共和國崛起，當談論到「中國」，年輕世代立刻聯想到的是中華人民共和國代表的「中國」，且想要與中華人民共和國做出區辨；三則與交流經驗有關，許多年輕世代存在與中華人民共和國交流的某些不舒服經驗，這樣的經驗促使他們選擇進一步與「中國」做出更明確的切割。

    在國家認同上，年輕世代大多傾向以政治制度與法律，作為判斷兩岸分屬不同國家的依據。至於年長世代，有些則會以是否同文同種來區分自己與中華人民共和國的異同。顯然在年輕世代的詮釋中，民族並不構成國家建立的必要條件，是否存在一堅實的臺灣民族，或者中華民族，並不重要；反之，在年長世代，民族卻是國家建立的必要條件，因而年長世代，不論持何種認同者，都比年輕世代運用更多血緣、文化等相關的元素，來支持自己的國家認同論述。'
  answer:
