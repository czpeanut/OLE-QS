  answer_status: verified
  answer_source: answer_key
  explanation: (A)題文只提及出生晚於西元 1980 年的年輕世代的國家認同，無法得知是否我國全體的民眾皆偏向獨立。(B)雖然文中未提及其他世代的國家認同，但可推測不同的成長脈絡及國家狀態應該會有世代差異，為正解。(C)天然獨世代覺得臺灣是一個獨立的國家，不屬於中國的一部分。(D)從文中反而更堅定臺灣是一個獨立的國家。
