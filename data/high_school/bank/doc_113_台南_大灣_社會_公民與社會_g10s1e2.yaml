  stem: 「九二共識」是否代表兩岸在政治上已有共識？為什麼？
  options:
  - label: A
    content: 是，雙方所主張的中國意涵在本質上並無差異
  - label: B
    content: 是，兩岸皆認為自己屬於同一個中國概念之下
  - label: C
    content: 否，一中各表與一個中國原則完全沒有交集處
  - label: D
    content: 否，雖然都接受一中但各自的中國意涵並不同
  group_stem: 時任陸委會主委蘇起在卸任前夕提出「九二共識」一詞，用來概括 1992 年海峽兩岸政府所授權的「海基會」及「海協會」在香港會談，就「一個中國」問題及其內涵進行討論所形成的見解及體認的名詞。在當年的香港會談及後來的書信往來中，我方政府認為已獲得「一個中國，各自表述」（簡稱「一中各表」）的共識，北京則認為是「一個中國原則」的共識，甚至公開否認有「一中各表」的共識。2000 年民進黨政府上臺後，北京先要求臺灣方面接受「一個中國原則」，才可以恢復中斷已久的「海基」、「海協」兩會協商，後來也援用蘇起所創的「九二共識」，要求民進黨政府接受。但民進黨政府認為北京的「九二共識」就是「一個中國原則」，一旦接受「九二共識」，將讓臺灣在國際上陷於萬劫不復的情境。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「九二共識」其主要精神為「一個中國，各自表述」，簡稱為「一中各表」，亦即我方依據中華民國憲法，「一中」指的是中華民國，臺灣地區與大陸地區同屬一個中國。而對岸的「一中」指的是中華人民共和國，大陸與臺灣同屬一個中國。由此可知，雖承認一個中國，但對於中國的內容並無共識，答案為(D)。
