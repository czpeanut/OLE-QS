  stem: 行政院於 2022 年 11 月舉辦《消除對婦女一切形式歧視公約（CEDAW）》第 4 次國家報告國際審查會議結論性意見記者會，5 名來臺審查的國際婦女人權專家與會，行政院發言人等代表亦出席代表政府收下相關建議，這也是自 2011 年我國制定公布「消除對婦女一切形式歧視公約施行法」後第 4 次的國家報告。以下哪些描述，符合我國落實《消除對婦女一切形式歧視公約》的做法？
