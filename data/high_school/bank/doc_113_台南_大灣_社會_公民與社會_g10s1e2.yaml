  group_stem: 2023 年，桃園市大成國中與臺灣首位水下鯨豚攝影師金磊合作，舉辦「鯨生海有你」鯨豚特展，深入探討鯨豚生存危機，並決議在公共政策參與平臺上提出 3 點要求，包括控制水下噪音、淨灘列入教育課程及禁止圈養鯨豚，盼使大眾更加了解環境保育。公共政策網路參與平臺是我國政府與公民溝通的單一討論平臺。公民的參與能讓政府施政更為周延，未來行政機關的政策計畫將朝向公開透明、公民參與及強化溝通之目標邁進，讓政府與民間的社會氛圍趨向信任之夥伴關係。
