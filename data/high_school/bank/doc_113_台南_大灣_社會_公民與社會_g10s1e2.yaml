- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_27
  section: 1
  number: 27
  type: single
  page: 6
  stem: 依據我國中央與地方權限劃分之精神，文本中我國中央政府所主張之事務性質，與下列何者最為相似？
  options:
  - label: A
    content: 環保局對製造空汙者處罰鍰
  - label: B
    content: 政府決定公費疫苗施打順序
  - label: C
    content: 議會通過振興地方經濟方案
  - label: D
    content: 學校通過營養午餐補助辦法
  group_stem: '含有萊克多巴胺的美國豬肉自從政府決定開放進口之後爭議不斷。從憲法層面分析，國際貿易政策、公共衛生事項是由中央立法並執行；從法律層面分析，《食品安全衛生管理法》規定，國內外肉品跟相關產製品，由中央主管機關根據國人膳食習慣，訂出安全容許標準。換句話說，行政院依據中央法規公告的規定，對萊克多巴胺的要求是在安全範圍內可檢出，據此統一規範，制定全國一致的食安標準。

    另一方面，部分縣市則主張依據地方自治規範，地方有權限制訂萊克多巴胺零檢出的自治條例，各縣市規範的主要內容如下：

    | 規範標的 | 有些縣市僅禁豬肉，有些豬肉、牛肉併禁，有些肉品皆禁。 |

    | --- | --- |

    | 行為態樣 | 有些縣市僅禁販售、有些兼禁使用，有的併禁製造、運輸、貯存。 |

    | 法律效果 | 有些縣市只禁不罰，有些縣市既禁又罰。 |

    雖各地方自治團體制訂出規範該縣市的地方自治條例，但地方的自治條例與中央並不全然相同，行政院認為相關地方食安自治條例，凡定有「一律不得檢出」的規定，已違反憲法並牴觸中央法規。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 我國中央政府所主張之萊克多巴胺的標準制定應為中央政府之權限。(A)為地方政府之權限。(B)為中央政府之權限，與題幹相同，為正解。(C)為地方政府之權限。(D)此為各校之權限。
