  stem: 國際社會將人權視為普世價值，1948 年聯合國大會通過《世界人權宣言》、1966 年通過《公民與政治權利國際公約》、《經濟社會文化權利國際公約》，均是將人權概念積極落實於國際條約之中。關於人權議題的發展趨勢，下列敘述何者正確？
  options:
  - label: A
