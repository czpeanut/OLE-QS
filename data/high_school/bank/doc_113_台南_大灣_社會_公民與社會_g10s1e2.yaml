  - label: B
    content: 從個人基本權利發展至集體發展權利
  - label: C
    content: 從經濟權利擴展至政治權利
  - label: D
    content: 由國內法律保障擴展至國際法律保障
  - label: E
    content: 從司法保障擴展至政治保障
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)為正解。(C)應是從政治權利擴展至政治權利。(D)應是國際法影響至國內法之立法。(E)司法保全及政治保障皆為消極性權利。
