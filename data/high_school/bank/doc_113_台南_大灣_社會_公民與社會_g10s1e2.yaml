  stem: 臺北市長上任後提出「開放政府、公民參與」，提出 I-Voting 投票，從提案、討論、形成選項到投票，運用網路科技收集民意，促進市民參加正式討論與推動，請問 I-Voting 投票的目的，表現出制定政策的何種特性？
  options:
