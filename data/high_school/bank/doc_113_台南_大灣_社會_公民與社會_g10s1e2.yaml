    註：臺灣地區與大陸地區人民關係條例第 2 條

    本條例用詞，定義如下：

    一、臺灣地區：指臺灣、澎湖、金門、馬祖及政府統治權所及其他地區。

    二、大陸地區：指臺灣地區以外之中華民國領土。

    三、臺灣地區人民：指在臺灣地區設有戶籍之人民。

    四、大陸地區人民：指在大陸地區設有戶籍之人民。'
  answer:
  - 請勾選「治權範圍」象徵 我國哪項主權的內涵；治權範圍依據《憲法增修條文》應稱為何者？（限 4 字）
  answer_status: verified
  answer_source: answer_key
  explanation: 事實主權指對於一定範圍內的領土與人民，擁有實質統治的事實與效力，即我國的統治權所行使之範圍。中華民國憲法增修條文的制定，在中華民國歷史及臺灣歷史上均有著重大意義。條文將臺灣、澎湖、金門、馬祖等實際管轄領土稱為「自由地區」（未直接指涉），僅有自由地區之國民擁有完整的公民權利和政治權利（但部分僑民亦有選舉權）。
