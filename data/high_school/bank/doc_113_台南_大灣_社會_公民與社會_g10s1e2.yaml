  group_stem: '中國籍錢姓男子 2018 年來臺以單車環島，行經高雄路竹區遭路邊漏電路燈電死，家屬後提國家賠償訴訟，經一審高雄地方法院及二審高等法院判決，高雄市政府須賠償家屬 463 萬元。此判決引發輿論爭議，部分民眾認為《國家賠償法》將本國人與外國人做出區別，會依據國籍對象不同而適用不同條款，然而中國大陸地區人民不具中華民國國籍，應該適用《國家賠償法》本國人的部分又或外國人的部分存有疑義。

