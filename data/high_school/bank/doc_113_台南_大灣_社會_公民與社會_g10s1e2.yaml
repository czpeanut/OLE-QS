  - label: C
    content: 回應性
  - label: D
    content: 責任性
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)從題幹「運用網路科技收集民意，促進市民參加正式討論與推動」，使政府的施政更能貼近民意回應民眾的訴求。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 庫德族人居住的地方統稱為庫德斯坦，包括土耳其東南部、伊拉克北部、伊朗西部、敘利亞東北部、亞塞拜然與亞美尼亞南部地區。庫德族生活在這 6 國的統治之下，有自己的語言、文化，也有自己居住的土地，但同一族卻被 6 個不同政體統治，故無法聯合一致建立國家，也沒有人承認庫德斯坦國的存在。因為他們欠缺了現代國家的哪些組成要素？
  options:
  - label: A
    content: 人民與領土
  - label: B
    content: 政府與主權
  - label: C
    content: 領土與政府
  - label: D
    content: 人民與政府
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹「庫德族生活在這 6 國的統治之下，有自己的語言、文化，也有自己居住的土地，但同一族卻被 6 個不同政體統治，故無法聯合一致建立國家，也沒有人承認庫德斯坦國的存在。」可知庫德族有人民也有領土，但缺少(B)政府與主權。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 過去從我國往返中國必須辦理「臺灣居民來往大陸通行證」（簡稱臺胞證）始得順利入出境。而自 2015 年 7 月 1 日起，中國發行卡式臺胞證，且採取臺胞證免簽註政策，透過卡片晶片功能將可提供多項便捷有效率的功能。從我國《憲法》的角度判斷，臺胞證的存在反映出兩岸屬於哪種狀態？(甲)兩岸呈現分裂、分立、分治的現象(乙)臺灣屬於中國的一部分，行政區劃分屬於特別行政區(丙)將臺澎金馬以外之其他地區稱為大陸地區(丁)臺灣與中國屬於 2 個國家的對等關係
  options:
  - label: A
    content: (甲)(丙)
  - label: B
    content: (甲)(乙)
  - label: C
    content: (丙)(丁)
  - label: D
    content: (乙)(丁)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 我國往返中國必須辦理「臺灣居民來往大陸通行證」（簡稱臺胞證），可見我國並非中國的一部分，而依據我國憲法的角度，臺澎金馬以外地區稱為大陸地區，兩岸呈現分裂分治的狀況，(甲)(丙)正確，答案為(A)。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 請根據我國地方政府的行政機關和立法機關之組織架構和職責，判斷下列何者正確？
  options:
  - label: A
    content: 地方立法機關須議決自治法規與審核預算、決算之報告
  - label: B
    content: 直轄市政府、鄉鎮市均屬地方自治團體
  - label: C
    content: 直轄市山地原住民區為行政機關的派出單位，非地方自治團體
  - label: D
    content: 地方的立法與行政機關之權力運作，皆以中央政府為主
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)應是直轄市為地方自治團體，而非直轄市政府。(C)直轄市山地原住民區享有自治權，為地方自治團體。(D)地方的立法與行政機關之權力運作，主要以地方政府為主。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 請問均權制度可能會有哪些優缺點？
  options:
  - label: A
    content: 優點：中央政府具有絕對主導權，政策執行連貫性強
  - label: B
    content: 優點：能夠切合各級政府需要，使政策推行具有彈性
  - label: C
    content: 缺點：中央權力過大，可能有侵害人民權益的疑慮
  - label: D
    content: 缺點：全國政令不一，地方各自為政，導致區域發展落差
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 均權制度是指將事務性質全國一致性者歸中央，因地制宜者歸地方，即中央與地方權限的畫分原則。(A)此為中央集權之特色。(C)此為中央集權之特色。(D)此為地方分權之特色。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 流程簡化是公共治理的趨勢，臺北市政府優化過往的「1999 市民熱線」，將不同部門的業務內容整合為「1999」單一窗口服務，改變各機關的結構與作業流程，也提供民眾更方便的服務管道取得。2022 年 11 月，更新增「臺北通 APP」網路電話服務。以下哪些敘述，較符合前述討論的「1999 市民熱線」推動內部課責所帶來的益處？
  options:
  - label: A
    content: 促進中央與地方政府間的垂直整合
  - label: B
    content: 強化各縣市間的跨域治理運作模式
  - label: C
    content: 落實政府內部組織與人力的精簡化
  - label: D
    content: 媒合適當的相關單位有效提供服務
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹「將不同部門的業務內容整合為『 1999 』單一窗口服務」，可知此為地方政府內部的統合，「提供民眾更方便的服務管道取得」可知其目的為(D)媒合適當的相關單位有效提供服務。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 現為桃園市政府所有的「桃園國際棒球場」在 2021 年與中華職棒「樂天桃猿」球團簽下委外營運合約，並在 2022 年更名為「樂天桃園棒球場」。2023 年球季結束後，桃園市政府再與樂天桃猿球團協力進行球場優化改善工程，預計在 2024 年球季開打前完成。但因球場外野草皮狀況不佳且有積水情形，導致球季開打後該球場仍無法順利啟用；桃園市體育局對此進行砂層調整、重新植草，並在網站上公告「樂天桃園棒球場左外野局部區域積水改善說明」，讓球迷掌握相關工程進度。由上文中政府與球團的合作模式，可用來說明民主治理的何項特點？
  options:
  - label: A
    content: 建立公私協力的夥伴關係，以提升治理效能
  - label: B
    content: 政府由上而下將公共事務交由民間團體執行
  - label: C
    content: 由公民共同決定公共預算支出的金額與用途
  - label: D
    content: 強調政府扮演更積極的角色，擴張政府職能
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文可知桃園市體育局與樂天桃猿球團合作，一起優化球場的改善工程，所以(A)公私協力的夥伴關係最相符，為正解。(B)此並非由上而下的模式，而是共同治理的模式。(C)此案並非由公民共同決定公共預算的情況。(D)應是政府跟民間一起合作，並無擴張政府職能。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 美國政府對總值 2,500 億美元的進口中國產品課稅，以迫使中國接受美國要求，改革美方認為中國在保護智慧財產權、技術轉移、產業補助與市場開放等方面的不公平政策。此外美國總統也砲轟世界貿易組織（WTO），宣稱美國的貿易政策不會聽從這個國際機構指揮，並為動用關稅來對中國施壓的作法辯護。美國貿易代表署草擬一份報告，概述白宮的貿易施政方針，提及美國將持續透過設於瑞士的 WTO，對他們視為不公平的作法提出挑戰，請問根據美國總統對 WTO 的立場宣示，所要展現的主權特性及面向與下列何者最為相近？
  options:
  - label: A
    content: 國軍以武力驅逐非法闖入領空的外國軍機
  - label: B
    content: 國會制定及修改法律嚴懲酒後駕車的行為
  - label: C
    content: 法官依法獨立審判案件不受任何外力干涉
  - label: D
    content: 警察依規定向未戴安全帽的駕駛處以罰鍰
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 美國總統對 WTO 的立場宣示屬於對外主權的展現，與(A)相同，皆為對外主權。(B)(C)(D)屬於對內主權的展現。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 請問贊成與反對《德州心跳法》的人，分別在乎的是何種人權？
