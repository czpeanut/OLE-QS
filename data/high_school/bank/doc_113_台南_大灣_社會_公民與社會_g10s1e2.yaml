questions:
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 古希臘雅典城邦以「雅典式民主」聞名於後世，其所發展出來的民主體系是最早的民主制度，也是開啟直接民主的起源。下列關於雅典式民主的描述，何者正確？
  options:
  - label: A
    content: 主要受到天賦人權學說影響而開展
  - label: B
    content: 人民都能直接參與並決定公共事務
  - label: C
    content: 公民身分與權利是某部分人的特權
  - label: D
    content: 公民身分與權利內涵發展已完善
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)天賦人權為 18 世紀洛克提出的理論，與雅典城的時代不相符。(B)雅典的直接民主只有貴族男性能享受此公民身分，並非人民都能直接參與。(D)當時的公民概念才正要展開，尚未發展完全。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 內政部警政署 2023 年預告新版《原住民漁民自製獵槍魚槍許可及管理辦法》草案，引起原住民團體集會並上街抗議。原住民團體認為一旦該辦法通過，族人除了需負擔高價位的進口自製獵槍零件費用，新規定也讓族人可能面臨《刑法》罪責，因而痛批這是「文化滅絕的殖民手段」，並呼籲內政部應立即停止預告程序，同時廣邀族人等相關團體進行充分討論。請問題文中的原住民團體所涉及的公民權利內涵及發展關係應為下列何者？
  options:
  - label: A
    content: 藉社會權促成文化權的實現
  - label: B
    content: 藉參政權促成社會權的實現
  - label: C
    content: 以積極權利影響集體權利的實現
  - label: D
    content: 以消極權利影響集體權利的實現
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)原住民團體集會並上街抗議為集會自由（消極權利）的方式，而原住民漁民自製獵槍魚槍許可為多元文化權利（集體權利）的訴求。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 國際社會上，對於公約締約國而言，不僅代表締約國同意該公約內容，簽署後更有遵守的義務。請問下列何者屬於保障一般群體的國際人權公約？
  options:
  - label: A
    content: 消除對婦女一切形式歧視公約
  - label: B
    content: 兒童權利公約
  - label: C
    content: 經濟社會文化權利國際公約
  - label: D
    content: 身心障礙者權利公約
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 保障一般群體的國際人權公約指沒有針對特定的群體，(A)婦女、(B)兒童、(D)身心障礙者皆指涉特定的群體。因此(C)為正解，保障所有人的權利。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '「自由之家」（Freedom House）公布 2023 年網路自由度報告，調查全球 70 個國家的網路環境，並以取用網路障礙、網路內容的限制及對用戶權利的侵犯等 3 大指標評比，我國各項評分結果如附表。2023 年我國總分相較於 2022 年的 79 分略為下降，但仍名列世界第 6，更位居亞太地區第 1。下列關於我國評比結果的解讀，何者最適當？

    | 項目 | 得分 |

    | --- | --- |

    | 網路障礙 | 24 分（滿分 25 分） |

    | 網路內容的限制 | 29 分（滿分 35 分） |

    | 對用戶權利的侵犯 | 25 分（滿分 40 分） |

    | 總分 | 78 分（滿分為 100 分） |'
  options:
  - label: A
    content: 我國在參政權這項公民權利的發展上，獲得國際高度的肯定
  - label: B
    content: 我國網路基礎設施的限制為造成網路自由度評分下降之主因
  - label: C
    content: 我國擁有亞洲最自由的網路環境，公民自由權已獲得完善的保護
  - label: D
    content: 我國整體而言網路自由得以獲得保護，但仍有部分保障措施不足
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)網路使用應該涉及自由權較多，而非參政權。(B)應是「對用戶權利的侵犯」是使自由度評分下降的主因，因這個項目分數最低。(C)並非獲得滿分，仍有進步的空間。(D)最符合現況的敘述，為正解。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 聯合國人權理事會共設 47 個席位，成員國包含亞太地區和非洲地區各占 13 席，拉美及加勒比地區占 8 席，東歐地區占 6 席，西歐及其他地區占 7 席。2022 年 10 月改選後，現有成員國包含近年來人權狀況備受爭議的中國、喀麥隆、索馬利亞、孟加拉和厄利垂亞等國在內。從現有成員國組成來看，可能造成人權理事會何種功能被質疑？
  options:
  - label: A
    content: 協調與整合聯合國各機關人權工作的成效
  - label: B
    content: 監督並要求侵犯人權之國家改善的公信力
  - label: C
    content: 針對各項人權公約設立專責機構的可能性
  - label: D
    content: 定期審議各締約國的人權報告及個人申訴
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹「現有成員國包含近年來人權狀況備受爭議的中國、喀麥隆、索馬利亞、孟加拉和厄利垂亞等國在內」，可推測這些國家內部為落實對人權的保障，最相符的答案為(B)，因為這些國家即為侵犯人權之國家。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
