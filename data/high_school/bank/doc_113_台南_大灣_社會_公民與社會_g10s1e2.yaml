  section: 2
  number: 34
  type: multiple
  page: 8
  stem: 我國於 1987 年宣布解嚴之後，展開政治自由化的過程，對整體社會的民主化影響很大，許多公民權利陸續透過修法或政策而受到保障。下列對於解嚴後至今，我國公民權利的敘述哪些正確？
  options:
  - label: A
    content: 修正《刑法》第 100 條廢除因言論入罪，保障言論自由
  - label: B
    content: 立法院制定《公民投票法》後，落實人民間接參與政治
  - label: C
    content: 修憲將總統、副總統改為直接民選，落實國民主權觀念
  - label: D
    content: 修法使直轄市山地原住民區重新獲得地方自治團體地位
  - label: E
    content: 立法院修改《人民團體法》，保障人民集會之自由權利
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)為符合現實之情形，為正解。(B)應是落實直接參與政治。(E)應是保障人民結社自由。
