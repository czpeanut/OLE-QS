- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s2_36
  section: 2
  number: 36
  type: multiple
  page: 8
  stem: 民主治理過程中，政府扮演人民之代理人的角色，而人民可以透過哪些方式，來確保其施政的品質與內容符合人民期待？
  options:
  - label: A
    content: 要求地方的社福預算要由人民參與討論
  - label: B
    content: 透過不定期改選的方式來檢驗政府施政
  - label: C
    content: 透過媒體匯集民意形成政府改革的壓力
  - label: D
    content: 強調公聽會的建議須成為政府施政方針
  - label: E
    content: 選舉出中央地方民意代表監督政府施政
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 「民主治理」是結合「民主」與「治理」之概念，透過精簡中央政府組織，將權力適度下放地方政府，並以公私協力的方式，由民間企業與非營利組織來共同分擔政府的事務。(A)(C)(D)(E)皆為民主治理中，人民能採用的方式。(B)應是定期改選。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s2_37
  section: 2
  number: 37
  type: multiple
  page: 8
  stem: 為了因應中華人民共和國的建立、以及我國從威權體制走向民主化的需要，我國陸續進行 7 次修憲，以不變更《憲法》架構及本文為原則，通過《憲法增修條文》，主要即為了達成下列哪些目的？
  options:
  - label: A
    content: 具體落實國民主權的精神與正當性
  - label: B
    content: 爭取我國在國際社會上的生存空間
  - label: C
    content: 建立公正且獨立的司法體系與制度
  - label: D
    content: 捍衛我國主權獨立地位與領土完整
  - label: E
    content: 符合我國現行統治權力管轄的現狀
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 我國修憲的主要目的是因應國家面臨的內外環境變化，並在保持《中華民國憲法》基本架構不變的原則下，調整法律以反映現實需求。以下為具體目的：(A)落實民主化的進程，體現國民主權的精神，提升憲政正當性。(B)透過修憲強化法理基礎，增加國際社會對我國的支持與認可。(E)調整憲法內容以符合現行統治權力的實際狀況，例如刪除與大陸相關的過時條文。(C)與(D)雖然相關，但並非修憲的主要直接目的。
- id: doc_113_台南_大灣_社會_公民與社會_g10s1e2_s3_38
  section: 3
  number: 38
  type: single
  page: 9
  stem: 關於大陸地區人民在法律定義上應為本國人或外國人仍有爭議，下列何項最有可能是造成該爭議的原因？
  options:
  - label: A
    content: 中共於國際上堅持一中原則，使得人民的國家認同分歧
  - label: B
    content: 我國政府不具有事實主權，造成法律的適用上有所疑義
  - label: C
    content: 無論臺灣或大陸地區的人民都具有中華人民共和國國籍
  - label: D
    content: 我國實質的主權範圍與法律規定的主權範圍有明顯落差
  group_stem: '中國籍錢姓男子 2018 年來臺以單車環島，行經高雄路竹區遭路邊漏電路燈電死，家屬後提國家賠償訴訟，經一審高雄地方法院及二審高等法院判決，高雄市政府須賠償家屬 463 萬元。此判決引發輿論爭議，部分民眾認為《國家賠償法》將本國人與外國人做出區別，會依據國籍對象不同而適用不同條款，然而中國大陸地區人民不具中華民國國籍，應該適用《國家賠償法》本國人的部分又或外國人的部分存有疑義。

    而一審法院判決書則引用法務部於 1993 年 8 月 5 日函釋「所謂『中華民國人民』，參照《臺灣地區與大陸地區人民關係條例》第 2 條第 2 款、第 4 款規定之意旨，大陸地區人民亦為中華民國人民，該條例及《國家賠償法》，並無禁止大陸地區人民請求國家賠償之規定，故大陸地區人民如在臺灣地區因公務員執行公權力職務遭受不法侵害，或因公有公共設施設置或管理有欠缺致其生命、身體或財產受有損害者，似應有《國家賠償法》之適用。」因此，法院在綜合考量下，認為基於人權保障及人道理念，錢姓男子一案應適用《國家賠償法》，錢姓男子家屬勝訴。

    為了釐清爭議，2023 年 5 月行政院發文表示考量到現行《國家賠償法》部分法條在國籍適用上仍有疑義，未來將會檢討修正，期待修法通過後，基於「公民與政治權利國際公約」之精神，只要於我國治權範圍內發生的國賠案件，不論國籍均得依法請求賠償。

    註：臺灣地區與大陸地區人民關係條例第 2 條

    本條例用詞，定義如下：

    一、臺灣地區：指臺灣、澎湖、金門、馬祖及政府統治權所及其他地區。

    二、大陸地區：指臺灣地區以外之中華民國領土。

    三、臺灣地區人民：指在臺灣地區設有戶籍之人民。

    四、大陸地區人民：指在大陸地區設有戶籍之人民。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是我國的法規，與中國的一中原則無關。(B)我國具有事實主權，應是法理主權有爭議。(C)臺灣人民並未擁有中華人民共和國之國籍。
