- id: doc_111_新北_新北高中_數學_數B_g11s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: '某公司員工總數 400 人參加公司所舉辦的抽獎活動，已知有 80 個中獎機會，其中男性有 48 人中獎，女性有 120 人未中獎。依據以上資料，作性別與中獎與否的列聯表如右，則下列選項何者正確？

    | 性別 抽獎 | 男 | 女 | 總和 |

    | --- | --- | --- | --- |

    | 中獎 | 48 | c | 80 |

    | 未中獎 | a | 120 | e |

    | 總和 | b | d | 400 |'
  options:
  - label: A
    content: a＝200
  - label: B
    content: b＋d＝396
  - label: C
    content: c＋e＝350
  - label: D
    content: 公司員工中任選一人，此人中獎機率為$\frac{1}{5}$
  - label: E
    content: 已知某人未中獎，則此人是女性的機率為$\frac{12}{25}$
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '∵48＋c＝80

    ∴c＝32

    又 d＝c＋120＝152

    b＝400－d＝248

    a＝b－48＝200

    e＝a＋120＝320

    (A)○：a＝200

    (B)╳：b＋d＝248＋152＝400

    (C)╳：c＋e＝32＋320＝352

    (D)○：$\frac{80}{400}$＝$\frac{1}{5}$

    (E)╳：所求為$\frac{120}{e}$＝$\frac{120}{320}$＝$\frac{3}{8}$

    故選(A)(D)'
