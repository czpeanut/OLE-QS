  stem: 若有一個猜拳機器人設計成只會出剪刀、石頭、布。已知它出剪刀的機率是 0.5，出石頭的機率是 0.2。若按照一般猜拳的輸贏規則，今你跟此機器人交手時，出哪一種拳贏或平手（不輸）的機率最大？
  options:
  - label: A
