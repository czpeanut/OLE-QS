- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 智慧型手機與行動網路的普及化，使得網路媒體時代來臨，更帶領出網紅經濟的風潮。請問：若以媒體近用權的概念解釋，下列說明何者正確？
  options:
  - label: A
    content: 透過社交軟體公開自拍照：接近權
  - label: B
    content: 透過即時通訊軟體與好友聊天：使用權
  - label: C
    content: 透過社群網站直播演場會表演：接近權
  - label: D
    content: 在影音網站上傳自製微電影：使用權
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 今年8月甫落幕的東京奥運，我國須使用「中華臺北」名義參與奥運，而無法使用中華民國或臺灣之名，下列哪個選項可以說明這個現象？
  options:
  - label: A
    content: 欠缺完整的領主
  - label: B
    content: 欠缺國際上的合法主權
  - label: C
    content: 欠缺國際上的事實主權
  - label: D
    content: 欠缺國家認同
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 在下列四種情境中，哪一種較不容易被他人質問國家認同議題？
  options:
  - label: A
    content: 甲國女子嫁為乙國媳婦，甲己兩國因領土發生爭議時
  - label: B
    content: 丙國企業家到丁國投資設廠，丙丁兩國發生貿易街突
  - label: C
    content: 戊國人民移民己國，戊己兩國因主權爭議發生軍事戰爭
  - label: D
    content: 庚國遊客到辛國觀光，辛國發生動亂無法返回庚國
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 《釋字第364號》中指出，「接近使用傳播媒體」之權利，是指民眾得依一定條件，要求傳播媒體提供版面或時間，行使表達意見之權利，用以促進媒體報導或評論之確實、公正。關於此權利之內涵，下列敘述何者正確？
  options:
  - label: A
    content: 「接近權」雖具有被動性，但可不受範圍或程度上的限制
  - label: B
    content: 請媒體訂正不實或錯誤報導的「答辯權」即接近權的一種
  - label: C
    content: 「使用權」屬於主動性的權利，得自製節目提供媒體播放
  - label: D
    content: 民眾基於「使用權」可回應、解釋不公平報導或予以評論
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 美國聯邦眾嫌院通過《2019臺灣保證法》，要求美國政府對臺軍售常態化。以及支持臺灣有意義地參與聯合國等國際組織，或是成為不以國家為成員需求的國際組織會員。對此中國抨擊美國粗暴干涉中國內政，違反一個中國原則和中美三公報規定，美國聯邦眾議院外交委員會則回覆：「讓我們講清楚，美國的一中政策不等於中國的一中原則。」由上述可推知美方回覆的論點最可能會是？
  options:
  - label: A
    content: 就算承認中共代表中國，臺灣也不因此屬於中國的一部分
  - label: B
    content: 世界上只有一個中國，而在臺灣的中華民國才能代表中國
  - label: C
    content: 只不過在一中原則的基礎上，拓展與臺灣的互動關係而已
  - label: D
    content: 不論是否只有一個中國，臺灣已經是一個主權獨立的國家
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 主流媒體常將新移民女性塑造成「來臺賣淫」、「製造破碎家庭」「會降低人口素質」「唯利是圖的吸血鬼」、「有犯罪傾向」等形象，使新移民女性背負著「社會問題製造者」或「買賣婚姻」等汙名。請問上述內容呈現媒體的何種問題？
  options:
  - label: A
    content: 媒體再現導致的不平等現象
  - label: B
    content: 同溫層效應掩蓋了事實真相
  - label: C
    content: 媒體近用的權利不公平問題
  - label: D
    content: 閱聽人的媒體素養有待加強
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 呈上題，若我國新移民想對上述研究現象採取行動，最適切可行的建議應該是下列何者？
  options:
  - label: A
    content: 藉由「使用權」回應跟解釋主流媒體的報導內容
  - label: B
    content: 請求媒體澄清資訊後等待其更正相關報導內容
  - label: C
    content: 行使「接近權」製作播送新移民的相關追蹤報導
  - label: D
    content: 要求媒體提供全天候時段或全版頁面以進行答辯
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有學者檢視我國法律變遷時，注意到《後天免疫缺乏症候群防治條例》，更名為《人類免疫缺乏病毒傳染防治及感染者權益保障條例》，內容也從重視疾病防治，轉為亦同時重視感染者權益。學者評論，此修法呼應兩公約強調「在獲得健康照護與服務上，任何人都不應該被歧視」的精神。下列何者最符合該學者針對此項變遷所提出的人權發展評論？
  options:
  - label: A
    content: 人權為普世價值，故世界各國立法都強調保障所有人之權利
  - label: B
    content: 人權理念受重視後，不同群體的權益也陸續受到關注與落實
  - label: C
    content: 人權內涵隨時間改變，我國立法從重視國民健康權轉為保障基本權利
  - label: D
    content: 人權發展與國際參與密切相關，加入國際組織才能有效推動人權保障
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 有關我國對國際人權的敘述，何者正確？
  options:
  - label: A
    content: 我國曾簽署兩公約，並將批准書送交聯合國秘書處存放
  - label: B
    content: 我國對聯合國所有國際人權公約都制定施行法，積極促進人權
  - label: C
    content: 無國界記者因我國制定兩公約施行法，故將亞洲總部設在臺灣
  - label: D
    content: 我國依公民與政治權利國際公約意旨，保障原住民權利
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 甲財團擁有一家報社、兩家電視臺，為了擴張事業版圖，再買下另外一家有線電視系統，因此甲財團在平面和電子媒體的市占率，遠高於其他同業。依據上述內容，下列哪一種推論最可能發生？
  options:
  - label: A
    content: 會增加各有線電視網之間的競爭
  - label: B
    content: 可增加甲財團的政治及社會影響力
  - label: C
    content: 可聯合各有線電視網善盡媒體自律責任
  - label: D
    content: 讓更多人享有價格低廉的有線電視服務
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 新喀里多尼亞是法國在太平洋的3個海外屬地之一，自2018年起舉行2次獨立公投。支持獨立的人認為，獨立能夠使該地區獲得充分的＿＿＿，減少殖民化和不平等，並與其他太平洋國家建立更加廣泛的聯繫。法國也簽下同意公投的協議，唯有如此才能取得該地區獨立派人士的支持，獲得其繼續統治新喀里多尼亞的＿＿＿。上述兩個空格應該填上什麼？
  options:
  - label: A
    content: 政府、正當性
  - label: B
    content: 主椎、合法性
  - label: C
    content: 主權、正當性
  - label: D
    content: 政府、合法性：
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 關於媒體的敘述，何者正確？
  options:
  - label: A
    content: 媒體所提供的訊息為第一手的資料，是記者親自採訪得來的資訊
  - label: B
    content: 媒體是民眾重要的資訊傳播工具，提供的資訊不會有誤
  - label: C
    content: 媒體是現代社會資訊傳播的重要媒介，也是跨越時空障礙的重要管道
  - label: D
    content: 媒體近用權是媒體人之權利義務，可落實第四權的角色
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 美國新任副總統賀錦麗打破美國政壇玻璃天花板，成為史上第一位女性副總统。賀錦麗曾任加州首位非裔女性參議員，也是首位獲選進入聯邦參議院殿堂的南亞裔女性參議員，賀錦麗的父母分別為牙買加和印度移民，他們與賀錦麗的人生故事某方面來說體現了美國夢。請問，賀錦麗的當選，下列評論何者最為適切？
  options:
  - label: A
    content: 自美國建國之初，女性一直以來都是具有參政權之權利主體
  - label: B
    content: 象徽少數族裔也能爬到權力頂峰，公民權利內涵從普遍到特殊
  - label: C
