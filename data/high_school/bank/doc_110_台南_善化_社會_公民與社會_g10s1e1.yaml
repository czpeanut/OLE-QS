  stem: 國際社會經常因「中國」與「中華民國」的國名、民族相似而造成誤解，多年來政府極力推動「正名」，透過增加臺灣意象，以提升我國的國際辨識度。例如右圖更改護照封面，將Taiwan字體放大；而Republic of China字樣則改成圍繞國徽，提升設計感。請問：政府的「正名」政策著重增添Taiwan意象，此一連串的作為可能帶來哪種影響？
