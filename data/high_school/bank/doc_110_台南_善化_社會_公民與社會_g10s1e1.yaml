  - label: D
    content: 賀錦麗是因為生在美國加州才有資格當選美國副總統
- id: doc_110_台南_善化_社會_公民與社會_g10s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 作家Max Frisch描述西歐社會引進外籍勞動的現象：「我們要的是勞動力，來的卻是人。」這句話說明，舉凡移工之勞動、居住、遷徒、文化、宗教或者休閒活動都會和移住國家或社會產生連結與互動。一則是移工身分所產生我者（本國人)與他者（外國人）之分，涉及種族或族群；二是勞動身分而連結勞動權益與社會安全體系。請判斷下列敘述何者為是？
  options:
  - label: A
    content: 移工受到不同主權的國家統治，未必能取得完整的公民身分
  - label: B
    content: 勞動力的流動已成為常態，國家主權的概念終將瓦解
  - label: C
    content: 移工因為不具公民身分，故在移入國無法享有人身自由權
  - label: D
    content: 移工對於移入國家的政治認同，將能決定其所能獲取的權利
