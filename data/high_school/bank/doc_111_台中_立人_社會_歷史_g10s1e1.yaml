  stem: 資料一：泰雅族傳說：天地間本無人居住。某天突然出現一顆有靈氣的岩石，從中飛出三人，一人緩緩升天並消失在空中，剩下的一男一女結為夫婦，他們就是泰雅族人的祖先。 資料二：達悟族傳說：天神的兩個孫子降生在蘭嶼島上，是為「石生男」與「竹生女」。後來石生男與竹生女各自繁衍後代，不過生出的小孩身體都有缺陷，於是雙方協議讓彼此的小孩通婚，就生出身體完整的子孫，這些人就成為達悟族人的祖先。根據上述兩則資料，下列哪項說明適當？
