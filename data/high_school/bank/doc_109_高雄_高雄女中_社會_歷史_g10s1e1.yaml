  section: 3
  number: 1
  type: calc
  page: 5
  stem: '這些來自於中國的漢民，人數眾多，不但立即躍居臺灣府的主流人口，也自視為具有高等文化的「人」，而稱先住於此的原住民為「番」。「人」、「番」的區別，從此成為深入社會人心的分類架構。不僅如此，漢人又依分布空間的差異，稱平原上的住民為「平埔番」，活躍山地的為「高山番」。而從官府的角度來說，願意歸化，且能納稅、服教化（如薙髮結辮）、供勞役的「番人」，就是「土番」或「熟番」，相對不足的就是「生番」。等到18世紀初「番界」或「土牛界」建立後，「熟番」更特別指涉位於界內（或版圖內）的歸化番，「生番」則是分布於土牛界外原住民的稱呼了。

