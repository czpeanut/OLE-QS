  stem: '2. 以下是日本殖民時期《臺灣民報》中有關於日本「某項政策（措施）」的相關報導。

    資料一：吾處要行大清潔，因雨延期，到好天之時重行斯事，及清潔之日之早晨，甲長才通知各戶，我適足疾不能起床，屋裡雖行洗掃，而我所臥之一方地未照施行，意欲對巡查請求免，此乃因病之不得已也，檢視之巡察到舍監視時，我將原委說明，欲求其恕免，誰知那個巡查半言不聽，且以惡言責罵，……宣告罰金二圓也。

    資料二：桃園街去月二十五日施行大清潔，是早天氣清朗，家家戶戶皆依命將家具盡搬出，並洗掃家屋內外，及至午前十一時忽然天氣變了，黑雲密布，沛然下雨，街民不得不將所搬出的家具搬入來，某巡查看著清掃不完全，便告發三十多名，翌日召喚至警察課受司法警部的大說論文各處以罰金，若能即刻繳納便罷，不然就立刻要拘留。

    資料三：因景氣不況的關係，大溪神社建築的寄附金很多不得納付，以登前報。其後街役場竟藉警察的權力，於街民演戲的時候起了種種刁難。這回又再利用秋季大清潔日，以某警部補和巡查部長為先導，一行五六名像要補緝犯的樣子，到了人家就問神社費納完否？因此小老百姓怕被罰金，多向鄰右借來繳納，然無處可借的不計其數云。因此本季大清潔被告發的件數比往年多得很。 (資料來源：1.《臺灣民報》，第3卷第14號，大正14年5月11日，頁9。 2.《臺灣民報》，第3卷第105號，大正15年5月16日，頁6。 3.《臺灣民報》，第3卷第388號，昭和6年10月31日，頁8～9。)

    (1)從上述三段資料的報導，我們可以看出應該與日本殖民時的「哪一項政策（措施）」有關？日本在落實此政策時，主要透過「誰」加以督導、檢查？(各1分共2分)'
