  stem: 林家開臺祖是林石，祖籍福建漳州府平和縣山區，家境清寒，但甚有膽識，1729年來臺後，即選擇大里、霧峰之番界拓墾而成巨富與地方頭人。不幸，受林爽文事件之累，財產充公，子孫移往內山霧峰重起爐灶。其孫林甲寅由經商、墾田，又成為地方首富；傳至其孫林文察，則捐餉募勇效命清廷，打入官僚階層，高居福建陸路提督，林家遂崛起為中部第一大家。1885年清廷下詔臺灣建省，林朝棟執行開山撫番政策，控制中部撫墾大權，官民勢力往內山擴張，促成樟腦業復興與臺灣之榮登「樟腦王國」寶座。上述為阿罩霧林家故事，根據上述可略知當時臺灣社會現象，根據內文，下列何者敘述<u>錯誤</u>？
