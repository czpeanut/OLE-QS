  stem: 下為各個時代對於臺灣去留看法，請依照時間點排出順序 資料甲：「臺灣沃野數千里，實霸王之區。若得此地，可以雄其國；使人耕種，可以足其食。上至雞籠、淡水，硝磺有焉。且橫絕大海，肆通外國，置船興販，桅舵銅鐵不憂乏用。移諸鎮兵士眷口其間，十年生聚、十年教養，而國可富、兵可強，進攻退守，真足與中國抗衡也。」 資料乙：「臺灣為東南七省尾閭，上達津沽、下運閩浙；臺事果能整頓，則外人視之有若猛虎在山，不敢肆其恫喝。若再輔以中等鐵甲船二、三號，則遇各島無理肆擾，尚可由臺斷其後路，使彼有首尾不能相顧之憂。故臺強則彼有如芒刺在背，時存忌憚之心；臺弱則被視為奇貨可居，各蓄吞噬之念。」 資料丙：「如僅守澎湖，而棄臺灣，則澎湖孤懸汪洋之中，界於臺灣，遠隔金廈，是守臺灣則所以固澎湖……臺灣一地，雖屬多島，實關四省之要害……臣思慕之必釀成大禍，留之誠永固邊圍。」
