  stem: '根據下文，何者最能呼應豐子愷對「真善美」的看法：

    圓滿的人格好比一個鼎，「真、善、美」好比鼎的三足。缺了一足，鼎就站不住，而三者之中，相互的關係又如下：「真」「善」為「美」的基礎。「美」是「真」「善」的完成。

    真善生美，美生藝術。故藝術必具足真善美，而真善必須受美的調節。這道理又可用禮來比方。古人解釋禮字，說：「禮者，天理之節文，人事之儀則也。」天理、人事，就好比真和善。節文、儀則，就好比美。……孝和勇，都是天理，都是人事。但這天理必須加以節文，這人事必須加以儀則，方合乎禮。節文和儀則，就是「節制」。在藝術上，真善加了節制便成為美。（節錄自<u>豐子愷</u>〈藝術與藝術家〉）'
  options:
  - label: A
    content: 「恭而無禮則勞，慎而無禮則蕙，勇而無禮則亂，直而無禮則絞」
  - label: B
