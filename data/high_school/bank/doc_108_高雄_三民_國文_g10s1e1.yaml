  group_stem: '閱讀甲、乙二文，回答 19.-20. 題：

    甲

    柴米油鹽醬醋茶，對於他人是一種享受，但對於我們，每一件就是一種負擔，到了孩子入學，教育費又是我們必須去想去對付的另一件事。此外，還有醫藥費等，雖然我已用不著每天吃藥了。壓力來自各方。

    終於有一天，<u>平妹</u>掮木頭去了！

    我默然目送<u>平妹</u>和那班人一道兒走上山路，有如目送心愛的人讓獄卒押上囚室一樣，心中悲痛萬分。我從來沒有像這時一樣的怨恨自己的軟弱無能。我清楚覺得到我們之間有一種不可抗拒的力量在殘酷無情地支配著我們的生活和行動，我們的意志已被砍去了手和腳。

    日頭落山後不久，<u>平妹</u>很順利的掮著木頭由後門回來了。她的上衣沒有一塊乾燥，連下面的褲子也濕了大半截；滿頭滿臉冒著汗水，連頭髮也溼了；這頭髮蓬亂異常，有些被汙水膏在臉上，看上去，顯得兇狠剽悍。平妹看見我便咧開嘴巴，但那已不是笑，壓在肩上的木頭把它扭歪得不知像什麼。霎時我心中有股東西迫得我幾乎喊出來。但實際我只一言不發的把頭別開；我不忍看，也不敢問。（<u>鍾理和</u>〈貧賤夫妻〉）

    乙

    余既為此志，後五年，吾妻來歸。時至軒中，從余問古事，或憑几學書。吾妻歸寧，述諸小妹語曰：「聞姊家有閣子，且何謂閣子也？」其後六年，吾妻死，室壞不修。其後二年，余久臥病無聊，乃使人復茸南閤子，其制稍異於前。然自後余多在外，不常居。庭有枇杷樹，吾妻死之年所手植也；今已亭亭如蓋矣。（<u>歸有光</u>〈項脊軒志〉）'
