  stem: 關於上段文字，下列敘述何者正確？
  options:
  - label: A
    content: 和氏說明悲泣的緣由乃因當代社會對忠賢之士的扭曲誤解
  - label: B
    content: 作者認為鑑定寶玉已如此困難，更無論分辨有道之士
  - label: C
    content: 作者認為安定的國家應該是「主用術」而「官行法」
  - label: D
    content: 群臣人民之所以會認為法術為禍，是因為必須受君王控制
  - label: E
    content: 楚人和氏鍥而不捨的精神，使自己最終獲得安定富貴的一生
  group_stem: 閱讀以下文章，回答11.-12. <u>楚</u>人<u>和</u>氏得玉璞<u>楚</u>山中，奉而獻之<u>厲王</u>，<u>厲王</u>使玉人相之，玉人曰：「石也。」王以<u>和</u>為誑（ㄎㄨㄤˊ／，欺騙），而刖（ㄩㄝˋ，砍足的極刑）其左足。及<u>厲王</u>薨，<u>武王</u>即位，<u>和</u>又奉其璞而獻之<u>武王</u>，<u>武王</u>使玉人相之，又曰「石也」，王又以和為誑，而刖其右足。<u>武王</u>薨，<u>文王</u>即位，<u>和</u>乃抱其璞而哭於<u>楚</u>山之下，三日三夜，泣盡而繼之以血。王聞之，使人問其故，曰：「天下之刖者多矣，<u>子奚</u>哭之悲也？」<u>和</u>曰：「吾非悲刖也，悲夫寶玉而題之以石，貞士而名之以誑，此吾所以悲也。」王乃使玉人理其璞而得寶焉，遂命曰︰「<u>和</u>氏之璧。」 夫珠玉人主之所急也，<u>和</u>雖獻璞而未美，未為主之害也，然猶兩足斬而寶乃論，論寶若此其難也。今人主之於法術也，未必<u>和</u>璧之急也，而禁群臣士民之私邪；然則有道者之不僇（ㄌㄨˋ，殺戮）也，特帝王之璞未獻耳。主用術則大臣不得擅斷，近習不敢責重；官行法則浮萌（遊民）趨於耕農，而游士危於戰陳，則法術者乃群臣士民之所禍也。人主非能倍（違背）大臣之議，越（擺脫）民萌之誹，獨周乎道言也，則法術之士雖至死亡，道必不論矣。
  answer:
  - A
