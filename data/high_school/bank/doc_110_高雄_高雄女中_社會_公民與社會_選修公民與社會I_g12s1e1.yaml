  stem: 1985年、基督長老教會彩虹婦女事工心主任廖碧英發現了雛妓問題的嚴重性，在1986年成立「彩虹專案」，開始從事救援雛妓的工作。發現由於原住民在經濟上的弱勢，許多無辜的、未滿16歲的少女，往往被無知又缺錢的父母出賣到臺北華西街的私娼寮，淪為雛妓。在性交易的食物鏈之下，父母得到了物質需求上的滿足，嫖客得到了性需求的滿足，老鴇、人口販子、私娼寮的保鑣，都因性交易而在轉手之間獲利。最可憐的莫過於雛妓本身，她們被迫從事性交易，不但被剝削得一無所有，甚至連最基本的人身自由都沒有。請問關於上述原住民族所面臨的社會不平等現象，以下何者錯誤？
  options:
  - label: A
    content: 原住民少女被父母出賣到私娼寮，屬於現代奴隸的形態
  - label: B
    content: 原住民少女無法自由選擇職業，屬於就業所得的不平等
  - label: C
    content: 原住民少女面臨的雛妓問題，為性別與種族雙重的弱勢
  - label: D
    content: 原住民少女遭受到的對待，可能造成內在自我評價低落
