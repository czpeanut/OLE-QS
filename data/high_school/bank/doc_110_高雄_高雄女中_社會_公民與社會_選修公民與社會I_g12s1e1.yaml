    content: 從「含著金湯匙出生」，可看出田北辰屬聲望較高的社會階層
  - label: B
    content: 從「擔任香港立法會議員」，可看出田北辰屬權力較高的階層
  - label: C
    content: 從「居住在豪華籠屋内」，可看出田北辰屬於財富較高的階層
  - label: D
    content: 田北辰既是商界大人物，又是政壇代表，其社會聲望必定很高
  - label: E
    content: 香港清潔工的階層，無論是財富、權力或是聲望皆屬社會底層
  group_stem: ◎擔任港區全國人大代表、香港立法會議員的田北辰，是含著金湯匙出生的富二代，人稱「田二少」，從哈佛畢業後，回到香港創立了服飾品牌G2000，如今全球有七百多家分店，在香港商界可說是無人不知的大人物，田北辰曾堅信著：「如果你有鬥志，即使是弱者，亦可以變成強者。」 2011年，想要步入政壇的他為了瞭解不同階層的人民，參加了香港節目《窮富翁大作戰》。在節目中，他化身為時薪只有25元港幣的清潔工，每天的生活費只有製作單位給他的50港幣，並住在不到五坪的「豪華籠屋」，徹底體驗「普通香港清潔工」的人生，他怎麼也沒想到，短短兩天的體驗，竟然動搖了他「徹底信奉自由市場、相信市場會淘汰弱者」的信念，這位人生勝利組深深了解到，低學歷、低技術人士過著非人生活，受雇者是被剝削的一方，且社會對待清潔工也常以鄙視的態度，即便再努力也未必能夠翻身，社會上弱者越來越慘。田北辰事後更主張，不應事事靠市場主導，政府應更照顧窮人。
  tags:
