  stem: 《台灣蘋果日報》今年五月致讀者一封信寫到：「十八年，《台灣蘋果日報》紙媒以創新的內容改變臺灣媒體環境，但今天，我們也被媒體環境所改變。因營運上虧損持續，在非常不得已的情況下，壹傳媒集團決定《台灣蘋果日報》紙本停刊，集中資源發展《蘋果新聞網》。」關於《台灣蘋果日報》紙本停刊的消息，下列敘述何者正確？
