  stem: 根據財政部最新公布的《2019年度綜合所得稅申報初步核定統計專冊》，收入為全臺頂端5%的家庭，平均所得高達507.8萬元，低端5%的家庭平均所得僅3.9萬元，相差130倍。雖然財政部指出該數據不能作為貧富差距分析，但若以國際衡量家庭貧富指標的吉尼係數來觀察，近年係數持續上揚，2019年為0.339，已接近國際警戒0.4的標準，更遑論這2年受疫情影響尚未公布的數字，臺灣整體財富結構已從「M型」化轉向「L型」，造成許多家庭陷人貧窮循環的威脅。上述我國貧富不均的現象，以下何種方式能夠解決經濟資源造成的社會不平等？
