  stem: 如右圖所示，在一座h高公尺的平台上，設置了一條長70公尺的直線坡道， 以及一條曲線坡道。將一球從P點釋放，沿著直線坡道滑落到Q點，測得在 t秒時球的速度函數為$V_{1}$(t)＝$\frac{20}{7}$t（公尺／秒）；而若將此球從P點釋放，沿 著曲線坡道滑落到Q點，測得在t秒時球的速度函數為$V_{2}$(t)＝－$\frac{5}{9}t^{2}$＋$\frac{20}{3}$t（公尺／秒）。試問： (1) 已知球沿著曲線坡道從P點滑落到Q點需要6秒，試求曲線坡道的總長為＿＿＿＿公尺。 (2) 將此球沿著直線坡道從P點滑落到Q點的“平均速度”為＿＿＿＿（公尺／秒）。
