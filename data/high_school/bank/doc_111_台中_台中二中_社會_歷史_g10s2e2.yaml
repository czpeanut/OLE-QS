  group_stem: '請閱讀下列兩則資料，回答問題：

    資料一： 西班牙人殖民菲律賓後，華人開始出現較大規模移民。因菲律賓距離西班牙、及西班牙所屬領土墨西哥較遠，部分物品必須仰賴中國，而中國商人為了賺取白銀，到呂宋的人數開始大為增加，移民多數來自中國閩、粵地區。

    西班牙殖民後，分設土人、華人甲必丹來協助管理。甲必丹管理包含華人出入境、司法糾紛、與殖民者之間的溝通橋樑，權力相當大。西班牙人對於華人依賴日深，但也開始對華人產生忌憚、懷疑的情緒，因而時常有暴力鎮壓行為。

    明朝政府認為呂宋有金山銀山可供西班牙人維持富庶而派員查看，但西班牙人卻誤以為明朝有攻打呂宋的打算。1603 年，由於西班牙人懷疑華人將有顛覆舉動，沒收鐵器等，引發「聖法蘭西節」衝突；1609 年因稅賦問題屠殺超過兩萬五千名華人；1639 年也因抗稅問題而屠殺華人。西班牙原本擔心明朝報復，但萬曆皇帝卻表示不會追究，因為明朝並沒有從這些海外貿易中獲得太多利益，對於這些從事海外貿易的商人反而視為麻煩和累贅；加上明朝政府正處於內憂外患，對於海外華人的慘案無法救援。

    資料二： 1998 年，印尼發生舉世震驚的排華暴亂，被稱為「黑色五月」，數十萬華僑被殺害；婦女遭凌虐性侵，有說法認為是時任總統的蘇哈托，為了轉移金触危機和國內壓力，而試圖操弄族群對立，來削弱反對勢力。攤開華人的印尼移民史，2,000 多萬的華人，絕大多數是晚清以後，從中國的福建、廣東遷徙到印尼。華人初到印尼時，生活條件相當艱苦。先是從事捕魚業，之後逐步進入商業、服務業、製造業、金融業等產業，經過幾代人辛苦的奮鬥，在印尼的這些產業占據舉足輕重的地位。

    17 世紀，荷蘭占領印尼後，為積極發展蔗糖業，引入大批華人進行墾殖。並指定甲必丹來負責跟荷蘭人聯繫，擔任荷蘭人與當地著名的中介及勞工，華人因此掌握批發零售業。但勢力漸大的華人引起荷蘭猜忌，1740 年，巴達維亞萬餘名華人遭到屠殺，稱為「紅溪慘案」。當時中國清朝皇帝乾隆對此回應：「天朝棄民，不惜背祖宗廬墓，出洋謀利，朝廷概不聞問。」'
