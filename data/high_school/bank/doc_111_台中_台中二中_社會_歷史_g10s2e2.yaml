  answer_status: verified
  answer_source: answer_key
  explanation: 明清海禁政策下，視私自出洋謀利的移民為「天朝棄民」，因此才對紅溪慘案採不予回應的態度。由於清廷認知的「天朝棄民」為移居海外者，並非是違禁從事海外貿易者，因此選(C)，不選(A)。
