  stem: 游牧民族與農業民族之間的交流與衝突，可從政治、軍事、經濟等層面進行觀察，下列對此正確的解釋為何？
  options:
  - label: A
    content: 先秦時期游牧民族與農業民族混雜而居，隨著長城的修建，雙方才有明顯的居住分界
  - label: B
    content: 農業民族多半受天災影響而選擇北遷，逐漸融入游牧民族之中
  - label: C
    content: 中原政權穩定和平時往往能吸引游牧民族遷入，而中原政權動盪不安時游牧民族則會選擇遷移回原居故鄉
  - label: D
    content: 兩漢時期靠強大國力將胡人強制遷回北方，以免危害漢人的生活安全
  answer:
  - A
