  stem: 在中國歷史上人群選擇遷移的原因，大致上可分為「推力」與「拉力」二種。其中，「推力」主要是與不利於在當地生活的因素有關；「拉力」則是與促進外地人口遷入的因素有關。關於上述內容，請問下列說明哪些正確？
