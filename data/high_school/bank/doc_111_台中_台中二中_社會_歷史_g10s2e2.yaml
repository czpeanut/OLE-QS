  stem: 人群移動帶動文化傳播與族群融合，對區域間的發展影響極為深遠。中國歷史上有關人群遷移的情形屢見不鮮，其遷徙原因包括經濟與政治等不同因素。請問下列哪一項是屬於政權主導人民遷移的例子？
  options:
  - label: A
    content: 秦代各地豪富遷移至咸陽
  - label: B
    content: 西漢末羌族移入中國境內
  - label: C
    content: 東漢時期北匈奴向西遷徙
  - label: D
    content: 明清閩粵居民向海外遷移
  answer:
