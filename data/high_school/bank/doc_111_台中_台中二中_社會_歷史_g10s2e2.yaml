- id: doc_111_台中_台中二中_社會_歷史_g10s2e2_s2_37
  section: 2
  number: 37
  type: multiple
  page: 7
  stem: '閱讀下列三則資料，並回答問題：

    資料一：19 世紀中葉，當時西方殖民者在東南亞進行開發，因此他們需要大量的勞工，另一方面，中國在 19 世紀中期之後，也就是鴉片戰爭之後，逐步淪為殖民地、半殖民地。破產農民，或者是天災或者是人禍、戰爭、饑荒等的原因無法在國內謀生，他們就向外遷移。最近的一個地方當然就是東南亞了，也就是當時大多數人所稱的南洋。

    資料二：黃禍的問題是 19 世紀起，西方人對華工到美國、澳大利亞去，引起當地工人的不滿，而採取的一種排華政策。對東南亞來說，本地的人沒有機會表示他們的意見，因為那裡根本是西方殖民地。鼓勵華人到這裡工作的是西方人，華工人數才會這麼多。

    資料三：鄭和下西洋這段故事很有意思；但是否表示鼓勵中國跟東南亞有什麼密切的關係這還是一個疑問。鄭和在最後一趟航程返回之後，立刻就把這件事情完全忘掉了，所有的材料、資料都給毀掉了。明朝政府又開始實行海禁政策，閉關鎖國，所以根本沒有鼓勵和東南亞有什麼特別的關係。

    以下有關這三段資料的詮釋，哪些較恰當？'
  options:
  - label: A
    content: 鄭和下西洋，鼓勵華人大量移民東南亞
  - label: B
    content: 列強在 19 世紀末將華人帶到東南亞，使得東南亞華人人數占世界各地海外華人總數最多
  - label: C
    content: 太多華人到美國和澳大利亞工作，使得當地的工人採取排華政策，這就是所謂的「黃禍」
  - label: D
    content: 華人在 19 世紀中期以後能移民到海外的，都屬國內政治、經濟實力優勢者
  - label: E
    content: 鴉片戰爭後，華人無法在國內謀生而向外遷徙的地方，不包括歐洲和西伯利亞
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)當時明朝實施海禁，不可能鼓勵華人移民東南亞。(D) 19 世紀中葉後移民海外的華人，多是契約勞工（苦力），屬社會底層經濟較弱勢者。(E)華人移民亦到歐洲和西伯利亞。
