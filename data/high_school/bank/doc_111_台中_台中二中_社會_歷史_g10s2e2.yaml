  stem: 韓國電影《軍艦島》講述在日本殖民朝鮮時期，徵用了大量朝鮮勞工到長崎外海的小島上進行煤礦挖掘的故事。電影中有許多人是在被欺騙的情況下帶到當地成為採礦勞工，工作期間生活條件極差，片中的朝鮮勞工不僅得不到應有的薪酬，還時常遭受日本軍官打罵。而挖礦工作危險重重，隨時會有坍方和瓦斯洩漏的風險，時有勞工死傷。電影呈現了二戰時期朝鮮人民一段痛苦的歷史。有關該電影劇情真實性的判斷，下列何者較為恰當？
  options:
  - label: A
    content: 劇情應為虛構，因為當時朝鮮勞工對日本的開發建設貢獻極大，受到良好的對待，不太可能出現此種殘酷景象
  - label: B
    content: 劇情應有其依據，日本政府常對殖民地施以誘騙策略，表面上是徵用工，實則是將大批朝鮮勞工送到前線作戰
  - label: C
    content: 劇情應為虛構，當時日本以臺灣為主要殖民地，多以臺灣人作為勞動力，不可能徵用大量朝鮮勞工
  - label: D
    content: 劇情應有其依據，二戰時期日本男性多前往前線作戰，急需大量便宜勞工從事煤礦開採，最可能從殖民地招募用工
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 長崎外海的端島（又名軍艦島）發現煤礦，二戰時期日本企業引進大量朝鮮勞工前來挖煤，強迫他們居住在衛生條件不佳的環境，是朝鮮人民一段痛苦的歷史記憶，(D)為正解。
