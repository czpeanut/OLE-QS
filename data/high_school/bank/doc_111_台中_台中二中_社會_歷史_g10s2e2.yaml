  stem: 《史記》：「（匈奴）逆天理，……以盜竊為務，……苟利所在，不知禮義。」《漢書》：「夷狄之人，貪而好利，被髮左衽，人面獸心。」《新唐書》：「（回紇）貪婪尤甚，以寇抄為生。」關於中國正史中對外族的描述，所謂「盜竊」或「寇抄」的討論，以下何者適當？
  options:
  - label: A
    content: 因為游牧民族生活貧困，嚮往農業民族的生活方式，常以劫掠的手段取得經濟利益，故外族入侵的確是盜賊的行為
  - label: B
    content: 外族有盜賊的天性，道德有嚴重缺陷，在這種民族性的驅使下，不斷入侵農業民族，故外族入侵的確是盜賊的行為
  - label: C
    content: 這些記載都出自中國統治階層，是農業民族對於游牧民族的刻板印象，並非實情，游牧民族根本不需要入侵農業民族
  - label: D
    content: 外族的確不斷入侵，正史的記載反映了農業民族的憤怒，只是傳統正史不考慮游牧民族的立場及游牧社會的經濟特性
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 游牧民族入侵農業民族，通常是因為草原發生天災而難以維生，因此南下劫掠，就農業民族立場而言，自然充滿憤怒之情，(D)為正解。(A)游牧民族並未嚮往農業民族的生活方式。(B)所謂盜賊的天性或道德嚴重缺陷，乃是敵對立場的漢人說法，並非事實。(C)游牧民族在生活無以為繼時，就不得不入侵農業民族了。
