- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1945 年 8 月，二戰的戰勝國家，在倫敦簽下《國際軍事法庭憲章》，作為紐倫堡審判納粹的主要戰犯依據，憲法首次明確規定違反「反和平罪、戰爭罪」和「反人道罪」是國際法中的罪刑，請問所謂的「反人道罪」指的應是什麼？
  options:
  - label: A
    content: 違反人類本能而限制繁育後代的權利
  - label: B
    content: 採取性別隔離政策以平衡男女比例原則
  - label: C
    content: 採取種族隔離政策以達便於統治
  - label: D
    content: 對於平民進行謀殺、滅絕、奴役、放逐和其他非人道行為，或進行政治、種族、宗教背景的迫害
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 根據規約中的定義，反人道罪指的是「那些針對人性尊嚴極其嚴重的侵犯與凌辱的眾多行為構成的事實。這些一般不是孤立或偶發的事件，而是出於政府的政策，或是實施了一系列被政府允許的暴行。如針對民眾實施的謀殺、種族滅絕、人體試驗、致病針劑實驗、酷刑、強姦、政治性的、種族性的或宗教性的迫害，以及其他非人道的行為。」因此根據內容，故答案選(D)。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 越裔美籍學者阮越清曾說，「所有的戰爭都會打兩次，一次在戰場上，再一次在記憶裡。」我們怎樣解釋上述的說法較為合適？
  options:
  - label: A
    content: 代表這位學者的記憶力優異，能清楚記住戰爭的歷程，歷久彌新
  - label: B
    content: 代表戰爭發生的當下造成不可抹滅的傷痕，除了當下遭受的創傷，在心中也留下深刻記憶
  - label: C
    content: 由文中可見作者主張有仇必報的功利主義，呼籲世人莫忘仇恨
  - label: D
    content: 可見作者的內心較為封閉狹小，因為始終無法走出心理陰影
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)的選項都抱有主觀偏見的判斷，故不選。戰爭造成的衝擊與傷害是相當巨大，曾經參與過戰爭的人除了當下的衝擊外，在日後數年或是一輩子都有可能無法從戰爭的傷害中走出，就算經過時間的沉澱而較為釋懷，但這種經歷也不可能會被遺忘。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 1960 年代，馬丁．路德．金恩鼓吹非裔美國人平權運動；1964 年，美國通過《民權法案》宣示在美國境內的學校、工作場所、公共設施等，不得因種族、膚色、宗教、性別或原國籍而有歧視；1965 年《投票權利法案》禁止在投票過程中的種族歧視。請問上述作為產生什麼影響？
  options:
  - label: A
    content: 境內非裔美國人的社會經濟地位立即獲得顯著性提升
  - label: B
    content: 南非等其他國家也出現類似的抗爭運動，形成跨國際運動效應
  - label: C
    content: 該法案通過後，美國社會完全無種族歧視事件的發生
  - label: D
    content: 該法案通過後，宣示任何的種族歧視和隔離政策均為違法，但僅限於部分地區
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 隨著美國黑人民權運動的發起，也影響其他國家的人民對社會不公不義起而發聲抗議，如南非在 1960 年代也有反抗種族歧視的運動發生，故選(B)。(A)雖然法律要求禁止種族歧視，給予有色人種平等的權益，但並不代表在經濟上非裔美國人的地位便會顯著的提升。(C)仍然有種族歧視的事件發生。(D)該法案是全美國通行。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 二戰後，美國成為世界最強盛的國家，隨著二戰後冷戰的來臨，美國自認必須擔任世界秩序的維護者，阻止共產勢力在世界各地的蔓延與擴張。美國總統甘迺迪在 1961 年的就職演說中提及，「我們將付出任何代價，承受任何負擔，應付任何艱難，支持任何朋友，反抗任何敵人，以確保自由的存在和實現。」在這場就職演說之後，美國隨即投入以下哪戰役？
  options:
  - label: A
    content: 韓戰
  - label: B
    content: 越戰
  - label: C
    content: 以阿戰爭
  - label: D
    content: 波斯灣戰爭
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 越戰發生於 1955 ～ 1975 年，而 1961 年美國甘迺迪總統在位時，便已介入越南的問題與投入軍隊，故選(B)。(A)韓戰發生於 1950 ～ 1953 年。(C)以阿戰爭發生數次，但美國總統甘迺迪在任時並未爆發以阿戰爭。(D)波斯灣戰爭則爆發於 1990 ～ 1991 年。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 國家最終目標是以人民福祉為施政前提，但若統治者受到意識型態、政治利益、族群偏見等因素，便施以各種暴力形式的傷害。關於國家暴力的實施敘述何者「錯誤」？
  options:
  - label: A
    content: 依賴特殊機構強化統治的政權體當中，如：臺灣警備總司令部
  - label: B
    content: 資訊網絡的建立，藉由監聽等方式監控人民
  - label: C
    content: 對於媒體的言論審查是為了要維持社會文化的穩定
  - label: D
    content: 日常歧視，以種族類別建立分離的社會制度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)對於媒體的言論審查，是為了要打壓與禁止反對政府政策的言論，以維持威權體制的統治穩固。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 越戰期間，美國利用在亞太地區的軍事基地和航空母艦，對越南發射約 140 萬發飛彈，是二戰期間總投彈量的兩倍，落彈地區主要集中在南越、北越、寮國、柬埔寨。請問造成落彈在南越地區最有可能的因素應是什麼？
  options:
  - label: A
    content: 表示美國的作戰技術仍不佳，無法判斷正確敵方座標
  - label: B
    content: 蘇聯、中共和北韓背後給予軍事武器的援助，南越當時也被越共勢力入侵且滲透、游移不定，因此也成為轟炸目標
  - label: C
    content: 美國就由參與越戰用以向世界展示軍事武力強盛的形象
  - label: D
    content: 由於越戰後期，美國境內已出現反戰風潮，因此必須下猛藥以求勝
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)由於南越境內有許多北越共產勢力的滲透，因此南越地區也會成為美國轟炸的目標。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 電影《紐倫堡大審》以二戰後戰勝國於德國所進行的戰犯審訊為題材，劇中描述男主角奉命到倫堡主持司法審訊，被告為德國司法部長，控方為美軍上校，當被告被指應為諸多無辜之人死於其法制之下一事負責時，律師主張被告當時僅是執行元首命令，不算犯罪。請問若根據 1945 年戰勝國於倫敦簽署的《國際軍事法庭憲章》之原則，律師提出「被告當時僅是執行元首命令」的論點，是否為被告脫罪？理由為何？
  options:
  - label: A
    content: 是，《憲章》中明確主張「根據政府或上級命令而行事，得免除國際法責任」
  - label: B
    content: 是，《憲章》中並無關於這部分的規範，只要辯方律師在法律攻防上的論述合乎邏輯，即可為被告脫罪
  - label: C
    content: 否，《憲章》中明確主張「就算是根據政府或上級命令而行事，都不能作為免除國際法責任的理由」
  - label: D
    content: 否，《憲章》中並無關於這部分的規範，但因被告所涉為關乎眾多無辜性命的案件，故不可能無罪脫身
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)《國際軍事法庭憲章》中明確規定「反和平罪、戰爭罪」和「反人道罪」是國際法中的罪刑，凡觸法者，就算是根據政府或上級命令而行事，都不能作為免除國際法責任的理由，必須為此承擔個人責任。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 一群學生在 LINE 群組裡討論「為什麼『東京灣事件』後越戰不再是越南人自己的戰爭？」下列哪種解讀較為正確？
  options:
  - label: A
    content: 因為戰事蔓延到在亞洲以外的歐洲和美洲
  - label: B
    content: 因為聯合國派遣聯合部隊加入戰局
  - label: C
    content: 因為美國、蘇聯及中共紛紛投入戰場
  - label: D
    content: 因為法國殖民政府又重新回到越南，試圖操控戰爭
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)因東京灣事件後，越戰戰局全面擴大，美國在東京灣事件爆發的隔年派出首批陸戰部隊，正式投入中南半島的作戰，而南韓、蘇聯與中共則也以各種理由響應作戰，給予軍事支援。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 美國電影《致所有逝去的聲音》講述黑人少女斯塔爾．卡特與朋友開車時被警察攔下，朋友欲從窗戶拿梳子卻被當作拿武器而遭到白人警察槍殺，她作為唯一的證人面臨著要不要出庭的抉擇。劇中，同樣也是警察的舅舅說白人警察不覺得殺死黑人算是犯罪，只是例行檢查的失誤，如果是我也會這樣做，畢竟在黑人社區臨檢本身就要想很多，諸如車子是不是偷的，車內有無槍枝或者毒品等等；斯塔爾又問舅舅，如果是在白人社區，白人若想從窗戶拿車內的東西，舅舅會怎麼處理，而回應竟是：「我會請他把手舉起來。」請問這段描述反映了美國哪一種社會狀況？
  options:
  - label: A
    content: 「黑人就可能會做危險的事」，這個觀念即便是黑人都難以否認
  - label: B
    content: 社會普遍認為黑人是危險的，所以白人警察槍殺黑人不算犯罪
  - label: C
    content: 若遇到同樣情況，舅舅會請白人把手舉起來是出於禮貌
  - label: D
    content: 少女的舅舅同樣身為黑人卻不認同自身文化
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)這只是白人警察的認為，題文並未提到社會都是如此普遍認為。(C)在警察臨檢時若有伸手取物品的動作，很有可能被認為是具有威脅的，因此請臨檢者把手舉起乃是希望他可以停止動作，以證明沒有要拿取危險物品的清白，並非禮貌。(D)少女的舅舅是認為黑人的確相較起來比較危險，但與是否認同自身文化無關。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 根據越南官方統計，該國境內仍有大約 300 萬枚未爆地雷和手榴彈埋土壤中，保守推估清理這些未爆彈可能需要長達 100 年的時間，耗資數十億美元。目前政府及非政府組織皆募集了一些人力投入清理工作，有些女性加入排雷行列，她們因此得以維持生計，也能確保土地更安全。請問帶來未爆彈問題的那場戰爭還為越南社會帶來了哪些問題或後遺症？①平民死傷；②心理陰影；③未爆彈帶來的人員傷亡及經濟損失；④生態破壞；⑤國家自主權喪失。
  options:
  - label: A
    content: ①②③④⑤
  - label: B
    content: ①②③④
  - label: C
    content: ①②④⑤
  - label: D
    content: ①②④
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 越戰遺留下的未爆彈，若不幸引爆，會導致人民嚴重傷亡。戰後迄今，仍有許多中南半島的民眾誤觸地雷或因未爆彈被引爆而喪命或截肢，加上不知何時會碰觸到地雷的恐懼也依然存在，因此造成心理陰影。此外，未爆彈尚未清理，也汙染廣闊的大地，限制土地的使用，造成生態的破壞，故選(B)。⑤越戰並沒有讓越南的國家主權喪失。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 所謂的「國家暴力」是指，原本國家領導人應以建立在全民福祉為終極目標，但一旦當施政者，為滿足自身的利益或意識型態，以至於施政不公或獨裁壟斷，而透過國家權力向反對者施壓、迫害甚至是剝奪人民的基本人權自由。請問以下何者是國家暴力的例子？
  options:
  - label: A
    content: 二二八事件與白色恐怖時期
  - label: B
    content: 1980 年代，無殼蝸牛運動
  - label: C
    content: 1994 年，四一○教改大遊行
  - label: D
    content: 2004 年，二二八牽手護臺灣
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)(D)都是人民為了爭取自身的權益，抗議社會的不公義等現象而走上街頭的運動，並非國家對人民施壓的作為。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 越戰結束後，美國雖退出越南，北越統一越南，然而北越和美國沒有一方是贏家，戰爭所付出的龐大代價難以估計，雙方仍在進行著「未完成」的戰爭。我們可以怎樣解釋上述的說法？
  options:
  - label: A
    content: 代表越南和美國結束實體戰，爾後持續進行意識型態的口號戰爭，持續至今
  - label: B
    content: 代表戰爭發生的當下造成不可抹滅的傷痕，越南人、美國人除了當下遭受的創傷，在心中也留下深刻記憶持直至今日
  - label: C
    content: 意味山雨欲來風滿樓的前兆，之後將後更大規模的軍事衝突發生
  - label: D
    content: 這代表美國的資本主義和越共的社會主義旗鼓相當，雙方交戰不分軒輊
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
