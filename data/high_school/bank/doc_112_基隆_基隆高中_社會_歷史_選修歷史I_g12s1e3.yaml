  stem: 越戰是一場「客廳戰爭」，在金恩博士的〈越南之外〉演說中就多次引用電視報導（金恩本人毫無疑問沒去過戰場）：「諷刺的是什麼呢？我們把年輕的黑人派去千里之外，號稱要保護東南亞的自由，但這些黑人在喬治亞洲南部就沒有自由啊！而我們在電視上看到一群黑人和白人士兵，一起殺人，一起被殺，但他們從來就不可能『一起上學』啊！……我不想為雙邊政府、意識型態講話……但難道越南人沒看出來我們（號稱要殺越共）在他們的水裡下毒，他們不知道他們的孩子把自己的姐妹賣給我們美國軍人，然後順道幫自己媽媽拉客嗎？」請問關於上文，何者敘述正確？
  options:
  - label: A
    content: 這次的演講主軸是金恩宣揚黑白平權的「我有一個夢」
  - label: B
    content: 越戰是第一場衛星實況轉播的戰爭
  - label: C
    content: 金恩的資訊來自東京玫瑰等政治宣傳
  - label: D
    content: 越戰的影像報導反而催生反戰運動
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)從金恩的演說中，可看出他透過越戰的新聞報導（因為他並未去過戰場），將自己接收的資訊作為材料，不斷抨擊美國的種族歧視政策（黑人並未獲得自由卻要去保護東南亞的自由），以及批評越戰中美軍惡劣的行徑，故可知道金恩除了推動種族平等，也主張反戰。
- id: doc_112_基隆_基隆高中_社會_歷史_選修歷史I_g12s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 轉型正義的概念承認過去與現在不同的法律觀，過去的行為基於當時代的緣故有其合法性，當今的正義觀認為不正當，仍可予以非難，以追求實質的法治，並採取必要的方式維護當今的正義觀。臺灣的轉型正義主要有《戒嚴時期不當叛亂暨匪諜審判案件補償條例》、《二二八事件處理及賠償條例》、《促進轉型正義條例》三條法源，關於以下內容的敘述何者「錯誤」？
  options:
  - label: A
    content: 《戒嚴時期不當叛亂暨匪諜審判案件補償條例》目的在於為戒嚴時期不當叛亂暨匪諜審判案件之受裁判者，於解嚴後不能獲得補償或救濟，特制定本條例補償之
  - label: B
    content: 《二二八事件處理及賠償條例》目的為處理二二八事件賠償事宜，落實歷史教育，釐清相關責任歸屬，使國民了解事件真相，撫平歷史傷痛，促進族群融合，而特制定條例
  - label: C
    content: 《促進轉型正義條例》為促進轉型正義及落實自由民主憲政秩序，特制定本條例
  - label: D
    content: 《二二八事件處理及賠償條例》原稱《二二八事件處理及補償條例》，但賠償與補償意思皆同，均為賠償民眾當時的財務損失，或調查後為冤案，亦即以金錢補償
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)補償與賠償在法律上的意義並不相同，若只是補償，意味著二二八事件只有受害人，沒有加害人，賠償則是做錯了才要賠，這代表政府承認過往威權統治時期的政府在當年犯了錯，有其象徵意義。
