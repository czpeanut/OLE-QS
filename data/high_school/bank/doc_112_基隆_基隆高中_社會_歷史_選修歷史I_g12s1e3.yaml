  stem: 臺灣在結束威權體制後，於 1990 年代開始進行的轉型正義，以二二八事件、白色恐怖、原住民權益的重視為主軸，歷經李登輝總統、陳水扁總統、馬英九總統到蔡英文總統，持續進行相關施政，以透過各項執行層面以補償或賠償過去曾遭受國家暴力的臺灣人民，促進日後族群的和解共生。臺灣轉型正義的相關工作，包含開放政治檔案、清除權威象徵、保存不義遺址、平復司法不公、還原歷史真相、促進社會和解，不當黨產的處理和運用。請問 2005 年頒布《原住民族基本法》以及 2016 年蔡英文總統代表政府，向過去對原住民族的遭遇，表達道歉，並成立「原住民族歷史正義與轉型正義委員會」，這主要應是屬於哪一類別的轉型正義工作？
  options:
