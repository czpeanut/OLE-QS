questions:
- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 許多非洲國家有針對女性的「割禮」傳統，經過割禮儀式的女孩被視為「純潔、端莊」。然而這樣的習俗被外界認為是對女性的性控制，且有衛生與健康疑慮，這幾年開始出現推廣廢止的呼聲。根據聯合國兒童基金會（UNICEF）對非洲與中東 29 國的調查，儘管已有 24 國以不同程度的立法管制割禮，但割禮仍十分常見，人民時常忽略法規繼續維持割禮。以下關於女性割禮的敘述，何項正確？
  options:
  - label: A
    content: 因為法律不具有強制力，人民時常忽略法規繼續維持割禮
  - label: B
    content: 經過割禮的女性才能受到親友認同，此為社會規範的影響
  - label: C
    content: 各國不同程度的立法管制屬內在控制，因此發揮作用不大
  - label: D
    content: 該文化認為女性需要接受割禮，並非是對女性歧視的作為
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)法律具有強制力，但割禮仍盛行的原因，是由於習俗的影響力大於法規。(C)法律屬於外在控制，仍具有規範力。(D)此作為已對女性的身體及健康造成負面影響，具性別歧視。
  tags:
    unit:
      code: CI-1-7-2
      book: 公民與社會1 民主與人權
      chapter: 文化與社會規範
      title: 性別規範
      std: true
