  section: 1
  number: 26
  type: single
  page: 5
  stem: 某國政府擬推動全民換發數位身分證計畫，整合戶口、醫療、租稅等資訊，提供人民更便捷的政府服務。認同此計畫的支持者期望藉此實現「數位國家」願景；但有公民團體質疑政府缺乏審慎規畫，擔憂該政策將導致人民喪失個人資訊的控制力，主張必須先制定特別法律，明訂授權範圍、加密機制、跨部門讀取資訊的條件與監督機制。因爭議擴大，該國政府最後放棄換發計畫。某高中生瀏覽相關爭議的網路留言後，心生疑惑：「先前民間團體利用政府資源製作疫苗數位地圖，協助民眾查找疫苗施打場所，廣受社會稱許，為何數位身分證卻飽受質疑？」請問針對該高中生的疑惑，從資訊利用行為與個人權利的角度來看，下列何種見解最為合理？
