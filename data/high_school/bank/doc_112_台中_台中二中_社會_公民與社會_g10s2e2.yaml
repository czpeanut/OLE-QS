  section: 1
  number: 4
  type: single
  page: 1
  stem: 早期立法院修訂《廣播電視法》、《有線廣播電視法》、《衛星廣播電視法》（簡稱廣電三法）時，曾明訂黨政軍不得直接或間接投資有線電視系統等媒體，導致許多官股及政府基金投資的企業，都被迫不能持有股權。不過 2012 年□□將廣電三法新修正草案送交立法院審查，新草案放寬黨政軍退出媒體條款的限制，允許黨政軍可持股但比例不超過 5 ％。下列關於廣電三法的修法過程，何者敘述正確？
  options:
  - label: A
    content: □□是指公廣集團負責人，因其代表行政院向立法院提出法律修正案
  - label: B
    content: 立法院完成修正條文的三讀程序之後，修正後法律條文便會即刻生效
  - label: C
    content: 若該修正案送交行政院後，行政院認為窒礙難行，行政院得提出附議
  - label: D
    content: 如認為通過之條文牴觸《憲法》的精神，必須經憲法法庭判決來解釋
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)公司及人民團體不具有法案的提案權。(B)法律經三讀程序後，仍須經總統公布後才生效。(C)應是提出「覆議」。
  tags:
