  section: 1
  number: 10
  type: single
  page: 2
  stem: 公民老師提到有關人民結社的法律，未來可能朝鬆綁行政管制、分流管理異質性團體的方向修法。下課後，有幾位同學針對上課的內容進行討論，請問哪位同學的說法符合我國內政部目前的修法方向？
  options:
  - label: A
    content: 甲：為鼓勵人民結社，有關團體財務相關規定將鬆綁，以落實財務自主、減少公共監督為目標
  - label: B
    content: 乙：不同性質團體，將全以《人民團體法》規範，並以「政黨組織法」、「宗教團體規則」行政命令來規範
  - label: C
    content: 丙：針對團體名稱、理監事人數的限制將放寬，提供更全面的結社自由保障
  - label: D
    content: 丁：未來修法將從登記設立的「登記制」，改變為許可籌組的「許可制」
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)修法方向以鬆綁社會團體財務處理相關內容及程序，在尊重團體自治的前提下，適當限定主管機關對團體財務監督的職責，以打造更符合現代公民社會發展的環境。(B)政黨組織是由《政黨法》所規範。(D)目前仍以許可制為主。
