  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)由「對受刑人及其收發書信之相對人之祕密通訊自由，造成過度之限制」，可見違反比例原則，(A)為正解。(C)(D)由「其與監獄紀律之維護無關部分，逾越母法之授權，與《憲法》第 23 條法律保留原則之意旨不符」，(D)為正解。(E)從上述題文中，無提及明確性相關概念。
