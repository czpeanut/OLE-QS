  stem: 胖虎為一名出色的運動選手，某日抵達其妹妹家中時，發現一名男子正欲對妹妹進行侵犯就上前制止，然而在與該名男子扭打的過程中，胖虎為壓制對方勒緊其脖子，最終導致其窒息，該名男子送醫急救 3 天後仍宣告不治。爾後該事件進入法院審理，律師本以為可依「甲」結案，但法官最後仍判處胖虎有期徒刑一年。根據上文所述，判斷下列何者正確？
