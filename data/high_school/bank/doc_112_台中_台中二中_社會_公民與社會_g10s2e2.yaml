  group_stem: '請閱讀以下文章內容並回答下列問題：

    音樂老師拒盤查被「大外割」、上腳鐐 桃院判警 2 罪下場曝光。老師激動：司法一大進步！

    詹慧玲被中壢分局葉姓員警認為行跡可疑，上前攔檢盤查，她認為依法無據，拒絕提供個資，並罵員警「真的很蠢」，被員警以柔道「大外割」方式壓制，依侮辱公務員罪嫌帶回警局。詹慧玲事後以「失去自由的 9 個小時」為題在臉書發文，引發熱議，並依《刑法》向葉姓員警提出公務員假借職務上之機會故意犯強制、傷害、妨害自由等罪嫌告訴。

    雖然在 10 月獲不起訴處分，但詹慧玲提起再議，12 月臺灣高等檢察署發回更審。桃園地檢署認為被告葉姓警員的臨檢、盤查不符《警察職權行使法》規定，非依法執行職務，卻仍然阻擋告訴人離去；葉姓警員在告訴人無涉妨害公務犯行之情形下，違法逮捕，剝奪其行動自由，涉犯公務員假借職務上之機會妨害自由罪嫌重大，檢察官依法提公訴。

    詹慧玲的律師陳孟秀受訪時表示，她們還沒拿到起訴書，但已經得知檢方的說法，「我們真的非常激動，也很振奮！我自己眼淚都要掉下來，這是司法史上非常難得的一次起訴！」她表示，除了象徵司法進步，也能警惕部分員警。

    事後該名員警被依妨害自由罪判刑 6 個月全案定讞。關於本案，法官於判決理由提及：「……告訴人（詹姓老師）當時獨自行走在公共道路外側，外表整潔、神色正常，並無濫用毒品後精神異常之跡象，亦沒有其他參與犯罪或即將犯罪之徵兆，告訴人亦非由犯罪現場步行而出，且被告（葉姓員警）攔檢告訴人時，告訴人除質疑被告盤查之法律依據外，亦無攻擊、衝撞警察或加速逃逸之行為，難認被告符合《警察職權行使法》第 6 條第 1 項任一款之發動查證要件。詎被告仍以身體阻擋告訴人離去，並要求其等待支援警力到場，並到派出所查驗身分，自己構成以強暴方式妨害詹姓老師之行動自由權利。」

    〔資料來源：林捷庭報導（2023/02/01）。民視新聞網〕'
