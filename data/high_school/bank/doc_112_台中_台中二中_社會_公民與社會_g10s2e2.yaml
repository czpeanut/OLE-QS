  page: 2
  stem: 請判讀下文中缺漏字：「政府及立委提案後會先送＿＿＿(<u>甲) </u>編擬議事日程。＿＿＿(<u>甲) </u>由各政黨依其在『院會』席次之比例分配。院會審議法案的先後順序，由＿＿＿(<u>甲) </u>決定。排定議程後，經＿＿＿(<u>乙) </u>程序，即應交付＿＿＿(<u>丙) </u>『審查』或經表決逕付『二讀』」。請問上文中(甲)(乙)(丙)分別為何？
  options:
  - label: A
    content: (甲)為常設委員會、(乙)為二讀會、(丙)為程序委員會
  - label: B
    content: (甲)為程序委員會、(乙)為二讀會、(丙)為全體院會
  - label: C
    content: (甲)為程序委員會、(乙)為一讀會、(丙)為全體院會
  - label: D
    content: (甲)為程序委員會、(乙)為一讀會、(丙)為常設委員會
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)為程序委員會，可排定議程；(乙)排定議程後應交付一讀；(丙)指常設委員會，可在一讀會後交由其審查法案。故選(D)。
