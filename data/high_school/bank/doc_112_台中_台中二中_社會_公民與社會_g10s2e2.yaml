- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 泰國預計修訂新的民事法案，可望賦予同性伴侶更多合法權益，雖不確定會放寬到哪個程度，但只要新法案通過實施，泰國將繼臺灣之後，成為亞洲第二個同性婚姻合法化的國家。以下哪一個選項「最不可能」為泰國此次修法的理由？
  options:
  - label: A
    content: 落實人權保障
  - label: B
    content: 鞏固社會秩序
  - label: C
    content: 價值觀念變遷
  - label: D
    content: 既有規範不足
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 泰國欲通過同婚合法化的目的在於保障同性戀者的婚姻權及因應社會變遷，改變不足之法令，故(A)(C)(D)皆為其目的。(B)鞏固社會秩序並非其立法目的。
