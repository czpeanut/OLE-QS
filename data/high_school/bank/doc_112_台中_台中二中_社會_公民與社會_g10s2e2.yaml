    labeled_by: agent
    label_confidence: medium
- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 結社自由能讓人民匯集公共意見並發揮集體的力量，但這股力量若沒有受到規範，反而有可能會危害社會，因此國家可適當的限制結社自由。以下關於結社自由限制的敘述，何者正確？
  options:
  - label: A
    content: 組成政黨也是結社權的行使，因此限制法官於任職期間不得參加政黨，這是違憲的
  - label: B
    content: 我國若要成立政黨，現行法規規定需要依《人民團體法》規範成立政治團體才合於法令
  - label: C
    content: 若團體是為組成犯罪集團，以侵害他人的生命及財產安全為目的，國家可加以限制
  - label: D
    content: 我國已將申請成立社會團體的相關法規進行修法，由過往許可制轉變為現行登記制
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依據《法官法》，為使法官獨立審判，法官於任職期間不得參加政黨、政治團體及其活動，任職前已參加政黨、政治團體者，應退出之。(B)成立政黨的法源為《政黨法》。(D)依據《人民團體法》，人民團體之組織，應由發起人檢具申請書、章程草案及發起人名冊，向主管機關申請許可；可知現行制度仍為許可制，並未轉變成登記制。
  tags:
