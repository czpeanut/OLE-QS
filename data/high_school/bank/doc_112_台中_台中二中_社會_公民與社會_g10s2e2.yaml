  section: 1
  number: 28
  type: single
  page: 6
  stem: 大法官認為通姦罪規定導致的損害，顯然大於其所要維護的利益。請問最可能是違反下列何種原則？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 公益原則
  - label: C
    content: 平等原則
  - label: D
    content: 法律保留原則
  group_stem: 司法院大法官於 2020 年 5 月 29 日作出第 791 號解釋，宣告《刑法》第 239 條妨害家庭罪（俗稱「通姦罪」）及《刑事訴訟法》第 239 條但書「可單獨對通姦配偶撤告」違憲，將通姦罪正式除罪化，並且從即日起失效。該釋憲文指出，法律規範所允許的合理化差別待遇，應視該差別待遇之目的是否合憲，及其所採取之手段之關聯性；該但書設立目的在於使被害配偶，得以與通姦配偶持續婚姻關係，然而僅對相姦人追訴處罰，與其婚姻關係之延續與否，欠缺實質關聯，有違《憲法》要旨。本號解釋亦部分變更釋字第 554 號關於通姦罪合憲之解釋，認為通姦罪導致的不利益顯然大於利益，此是通姦罪違憲最主要的理由。此釋字一出也引發各界高度關注。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 釋憲文指出該規定導致的損害「顯然大於其所要維護的利益」，因此是違反(A)比例原則。比例原則又稱最小侵害原則或是禁止侵害過當原則，指國家的權力行使若有侵害人民之必要時，應以最適當、最小侵害的方法為之。其子原則如下：適當性原則：又稱適合性原則、合目的性原則，國家所採取之措施須有助於公益目的之達成；必要性原則：由合乎適當性之措施中，選擇對權利侵害程度最小的手段，但其功效必須與較大侵害程度的手段相同；衡量性原則：國家之措施所可能引起的損害與所欲達成國家任務間，未有顯失均衡或不相稱的情形發生。
