- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 我國透過司法審查檢視國家行使公權力有無違憲及確保人民權益，自 2022 年攸關大法官釋憲有了重大變革，不僅審理程序將全面司法化、裁判化及法庭化，組成「○○○○」審查法律、命令等法規範是否違憲，更進一步將「法院裁判」是否違憲納入審查範圍。政府機關、立法委員、各級法院法官，以及人民、法人、政黨等皆可依據相關條件聲請釋憲，以加強對人民基本權利之保障。關於上述的相關說明，何者正確？
  options:
  - label: A
    content: 憲法訴訟過程採不公開審理，若認為法規牴觸《憲法》，透過判決文宣告法規違憲
  - label: B
    content: 納入「法院裁判」審查範圍，代表人民聲請釋憲將不再有終局裁判的限制
  - label: C
    content: 「○○○○」即指以「憲法法庭」進行違憲訴訟審理，不再以會議方式決議作成「大法官解釋」
  - label: D
    content: 法律是經正當程序所制定，不可能因牴觸《憲法》而侵害人民的基本權利
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)以公開審理為原則。(B)人民聲請的要件，仍有確定終局判決之限制。(D)即使是正當程序所制定的法律，仍可能有牴觸《憲法》之虞，須由大法官召開憲法法庭裁判。
  tags:
    unit:
      code: CI-2-3-3
      book: 公民與社會2 正義與法治
      chapter: 憲法與權利保障
      title: 憲法規範公權力
