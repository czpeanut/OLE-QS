  stem: 我國在 2022 年 6 月 1 日正式施行《跟蹤騷擾防制法》，是規範「與性和性別」有關之行為，將反覆持續的跟蹤騷擾入罪化，無論是透過盯梢接近、威脅辱罵、通訊網路騷擾等行為騷擾被害人，俾使能早期就讓警察機關介入調查、告誡。而被害人、檢察官和司法警察更可以透過聲請保護令，讓法院核發保護令，禁止加害人的跟蹤騷擾行為，以保護被害人並免於恐懼。請問根據上述對於這部法律的說明與適用舉例，下列何者正確？
  options:
  - label: A
    content: 以電子通訊器材發送色情圖片給特定人，非本法範圍，無法向法院聲請保護令
  - label: B
    content: 本法將跟騷的行為入罪化，即是動用刑罰來處罰跟蹤騷擾行為，有違刑法謙抑
  - label: C
    content: 大名因仰慕心儀多年的小佳，多次跟隨她回家讓小佳感到困擾，大名適用本法
  - label: D
    content: 記者為跟追報導名模的新戀情，連續數天在她家樓下盯梢舉動，記者適用本法
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)藉由通訊網路的騷擾行為仍為該法的規範範疇。(B)因應社會變遷，有些新型犯罪仍須入法管理，此與《刑法》謙抑概念並無違背。(D)記者跟追名模的目的並非「與性或性別」有關，而是想探知其隱私，不適用《跟蹤騷擾防制法》。
