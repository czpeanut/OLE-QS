- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 《人民團體法》規定「職業團體的理事長，由理事在常務理事中選出一人，若不設常務理事的職業團體，就由理事中互選。」釋字第 733 號認為，該規定限制職業團體內部組織與事務之自主決定，逾越必要程度，已經違反○○原則，亦不符合《憲法》保障人民□□權利的精神，因此大法官會議宣告違憲。根據上文內容判斷，兩處空格先後應分別填入什麼？
  options:
  - label: A
    content: 比例原則，結社自由
  - label: B
    content: 比例原則，集會自由
  - label: C
    content: 平等原則，參政自由
  - label: D
    content: 平等原則，職業自由
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「逾越必要程度」，可知違反比例原則；規範職業團體內部的組織，涉及結社自由的面向，故答案為(A)。
