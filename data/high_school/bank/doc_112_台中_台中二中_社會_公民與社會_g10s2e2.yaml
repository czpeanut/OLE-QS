  stem: '釋字第 756 號是大法官對於受刑人祕密通訊自由之權利做出的有無違憲解釋，其中在 756 號釋憲文所摘錄的文字描述涉及法令如下：

    《監獄行刑法》第 66 條規定：「發受書信，由監獄長官檢閱之。如認為有妨害監獄紀律之虞，受刑人發信者，得述明理由，令其刪除後再行發出……。」其中閱讀書信部分，未區分書信種類，亦未斟酌個案情形，一概允許監獄長官閱讀書信之內容，顯已對受刑人及其收發書信之相對人之祕密通訊自由，造成過度之限制。

    《監獄行刑法施行細則》第 82 條規定：「……妨害監獄紀律之虞，指書信內容有下列各款情形之一者：一、顯為虛偽不實、誘騙、侮辱或恐嚇之不當陳述，使他人有受騙、造成心理壓力或不安之虞。」如受刑人發送書信予不具受刑人身分之相對人，以及第 7 款所引同細則第 18 條第 1 項各款之規定，均未必與監獄紀律之維護有關。其與監獄紀律之維護無關部分，逾越母法之授權，與《憲法》第 23 條法律保留原則之意旨不符。……逾越母法之授權。

    請問上述相關法令最有可能違反哪幾項法律原則？'
  options:
