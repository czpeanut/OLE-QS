  stem: 市政府表示在官網公告甲的個資，是依規定辦理公示送達，通知其領取受裁處書，請問此行政行為是期待符合《行政程序法》中的何項原則？
  options:
  - label: A
    content: 公開原則
  - label: B
    content: 公正原則
  - label: C
    content: 信賴保護原則
  - label: D
    content: 誠實信用原則
  group_stem: '民眾甲在 2020 年底發現新竹市政府網頁中的「公示送達」（以公告方式送達文書），內容載明他的戶籍地址、身分證字號前 7 碼、出生年月日及性別等個資，陸續向市政府反映陳情，但市政府僅回覆是依公示送達規定辦理，甲在 2021 年 3 月又上網查看，發現公告持續供不特定多數人點閱，瀏覽人數又增 126 人，損害程度持續增加。甲認為，市政府過度揭露個人資料已經逾越必要範圍，提起損害賠償之訴。市政府則抗辯，《行政程序法》並無明文規定個資應如何記載、隱蔽程度多寡等，因此市政府就個資的隱蔽程度，自有行政裁量之空間，且市政府有隱蔽其身分證末三碼，不得逕指行政機關行政行為屬不法。

    新竹地院審理認為，公示送達目的在於通知原告得隨時領取受裁處書，應以最少範圍之直接或間接識別應受送達對象為宜，檢視環保局、動保處等相關公告，都只有公開姓名，因此民眾甲主張公示送達侵害個資，應為可採，故法官認為市政府公布相關資料的方式已逾越執行公示送達法定職務之必要範圍，並侵犯原告對個人資料之自主控制權，判處新竹市政府賠償 5 千元精神慰撫金。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「依規定辦理公示送達，通知其領取受裁處書」屬於正當法律程序中的(A)公開原則。其意義指基於人民有知的權利之故，行政機關從事行政行為之際，該預告時就必須預告（預告公開），該資訊公開時就必須資訊公開，該將決定告知相對人就必須將決定告知相對人之謂。
