  section: 1
  number: 27
  type: single
  page: 6
  stem: 針對《刑事訴訟法》第 239 條但書規定，可以撤回對配偶的告訴，但相姦人不能撤回。請問上述大法官的論點可說明下列何種人權觀點？
  options:
  - label: A
    content: 原本《刑法》中的規定，可以嚇阻第三者以保護配偶權
  - label: B
    content: 對於配偶與第三者的行為若不相同處理，恐有違平等權
  - label: C
    content: 對破壞婚姻的無辜第三者，法律應給予合理的差別待遇
  - label: D
    content: 為維護婚姻完整的公益，法律更該給外遇配偶自新機會
  group_stem: 司法院大法官於 2020 年 5 月 29 日作出第 791 號解釋，宣告《刑法》第 239 條妨害家庭罪（俗稱「通姦罪」）及《刑事訴訟法》第 239 條但書「可單獨對通姦配偶撤告」違憲，將通姦罪正式除罪化，並且從即日起失效。該釋憲文指出，法律規範所允許的合理化差別待遇，應視該差別待遇之目的是否合憲，及其所採取之手段之關聯性；該但書設立目的在於使被害配偶，得以與通姦配偶持續婚姻關係，然而僅對相姦人追訴處罰，與其婚姻關係之延續與否，欠缺實質關聯，有違《憲法》要旨。本號解釋亦部分變更釋字第 554 號關於通姦罪合憲之解釋，認為通姦罪導致的不利益顯然大於利益，此是通姦罪違憲最主要的理由。此釋字一出也引發各界高度關注。
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)大法官認為通姦罪的追訴與婚姻關係之延續，欠缺實質關聯，意味此條文無法保障配偶權。(B)此法條之但書僅對相姦人追訴處罰，得不處罰配偶，已違反平等權，為正解。(C)應平等處理，不應予以差別待遇，此有違平等權。(D)大法官解釋文中並未提及此觀點。
