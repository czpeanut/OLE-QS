- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有關於黨團協商之相關敘述，下列何者為正確？
  options:
  - label: A
    content: 黨團協商又可稱「朝野協商」，若屬於無黨籍之立委則不得參與協商
  - label: B
    content: 發生於各黨派對法案有高度共識時，可連署表達贊同並逕付三讀會
  - label: C
    content: 黨團協商可以增進各政黨間的對話，有利小黨派的發聲
  - label: D
    content: 屬於違法程序僅得祕密進行不得公開，因此民主法治國家通常不許
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)無黨籍的立委也可以參與協商。(B)應該是逕付二讀會。(D)為協商議案或解決爭議事項，得由院長或各黨團向院長請求進行黨團協商，此為我國議事規則的合法程序，且為民主國家常用之方法。
