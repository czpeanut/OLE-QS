  explanation: 依據新聞：「被告（葉姓員警）攔檢告訴人時，告訴人除質疑被告盤查之法律依據外，亦無攻擊、衝撞警察或加速逃逸之行為，難認被告符合《警察職權行使法》第 6 條第 1 項任一款之發動查證要件。」可知員警的攔查行為違反法律保留原則。「法律保留原則」指《憲法》已將特定事項保留予立法者，須由立法者依法律加以規定，行政機關對此等事項，須有法律或依法律所授權訂定之命令為依據，方得有所作為。
