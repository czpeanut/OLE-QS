- id: doc_112_台中_台中二中_社會_公民與社會_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 民主國家相當重視人權，但是基本權利並非不得限制，如當基本權利與社會公益產生衝突，公權力應該如何限制人民權益，是必須嚴肅看待的課題。關於我國個人權利與公共利益之間的調和，以及國家機關介入的程序，下列敘述何者正確？
  options:
  - label: A
    content: 為防止肺炎疫情擴散，政府強制隔離染疫者並禁止其與他人通聯，符合適當性原則
  - label: B
    content: 行政機關得基於立法機關通過的法律授權，約束感染 COVID-19 的民眾居家隔離
  - label: C
    content: 若國家規定酒駕者一律處以無期徒刑，此手段深具嚇阻成效而具有立法之合理性
  - label: D
    content: 我國立法機關通過的法律，法官可自行認定法條違反比例原則而當庭宣告違憲
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)禁止隔離者與他人通聯，違反比例原則。(B)符合法律保留原則，為正確敘述。(C)對於酒駕者不分輕重一律處無期徒刑，違反比例原則。(D)須由大法官作出裁判才能宣告法律是否違憲，法官沒有此項權利。
