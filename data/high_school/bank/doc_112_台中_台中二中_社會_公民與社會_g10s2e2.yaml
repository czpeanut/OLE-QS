  stem: 德國刑法學者李斯特認為：「法益就是合法的利益」，就是「由法律保護的利益」。如果以「法益的持有人為誰」來區分，法益可分為國家法益、社會法益及個人法益。以下有四種犯罪的樣態，請問哪一種侵害的法益與其他三種「不同」？
  options:
  - label: A
    content: 建管單位派員去拆除張三的違章建築時，張三對公務員施暴脅迫，觸犯妨害公務罪
  - label: B
    content: 李四酒後開車，經警察攔檢實施酒測，吐氣酒精濃度達 0.25mg/L，觸犯公共危險罪
  - label: C
    content: 王五利用汽車旅館聚賭，經人檢舉遭警方查獲賭資、賭具和監視器等物，將王五依賭博罪送辦
  - label: D
    content: 趙六與朋友打賭服輸，大白天裸體在馬路跑步，被巡邏警察逮捕移送檢方偵辦，觸犯公然猥褻罪
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為侵害國家法益，與其他三者不同。(B)(C)(D)皆為侵害社會法益。
