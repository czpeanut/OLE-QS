  stem: 冬季東北抵達臺灣時，，常造成北部地區降下地形雨，其成雲降雨的主要原因為何？
  options:
  - label: A
    content: 山會將水氣擋住使其無法通過，故形成雲雨
  - label: B
    content: 山的迎風面風勢較強，較易散熱，故多半較冷，所以水氣較容易凝結成雨
  - label: C
    content: 山的迎風面是氣流上升之處，因對流層愈到高處愈冷，所以空氣遇冷凝結，故形成雲雨
  - label: D
    content: 山的迎風面是氣流被迫抬升之處，氣流上升，體積膨脹，溫度下降，空氣遇冷凝結，故成成雲雨
  - label: E
    content: 山的迎風面屬低氣壓中心，空氣向山心輻合，因次化氣抬升並凝結降雨
