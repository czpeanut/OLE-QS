  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列敘述何者正確？
  options:
  - label: A
    content: $\sqrt{\frac{1}{125}}$＝$5^{-\frac{1}{\sqrt{3}}}$
  - label: B
    content: $log_{2}$3＝－$log_{3}$2
  - label: C
    content: $\sqrt[3]{\log 5}$＝$\frac{1}{3}$ log5
  - label: D
    content: $\log _{\sqrt{2}}\sqrt{3}$＝$log_{2}$3
  - label: E
    content: $log_{111}x^{2}$＝2 $log_{111}$x
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$\sqrt{\frac{1}{125}}$＝$\sqrt{\frac{1}{5^{3}}}$＝$(5^{-3})^{\frac{1}{2}}$＝$5^{-\frac{3}{2}}$

    (B) ╳：$log_{2}$3×$log_{3}$2＝$\frac{\log 3}{\log 2}$×$\frac{\log 2}{\log 3}$＝1

    (C) ╳：$\sqrt[3]{\log 5}$＝$(\log 5)^{\frac{1}{3}}$≠$\log 5^{\frac{1}{3}}$＝$\frac{1}{3} \log 5$

    (D) ○：$\log _{\sqrt{2}}\sqrt{3}$＝$\frac{\log \sqrt{3}}{\log \sqrt{2}}$＝$\frac{\frac{1}{2} \log 3}{\frac{1}{2} \log 2}$＝$log_{2}$3

    (E) ╳：$log_{111}x^{2}$＝$\frac{\log x^{2}}{\log 111}$＝$\frac{2 \log | x |}{\log 111}$＝2 $log_{111}$∣x∣

    故選(D)'
