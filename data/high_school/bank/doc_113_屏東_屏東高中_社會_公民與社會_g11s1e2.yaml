  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 比較利益是由李嘉圖（David Ricardo）提出，指雙方生產兩種產品時，其中一種生產活動的機會成本較低者，即具有生產此項產品的優勢，而各國專業化生產具有比較利益的產品（機會成本低），並進行國際貿易，將可提升貿易雙方的福利水準；絕對利益是由亞當．斯密（Adam Smith）提出，為國際貿易理論起源，意指在某生產活動上，生產力優於另一人者，即具有絕對利益。本題答案選(C)。
