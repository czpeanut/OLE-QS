  stem: 疫情時代，民眾因無法出門，只能在家透過網路購物，導致電商平臺消費糾紛案件大增，其中以瑕疵品爭議及退費爭議占大宗。關於消費者透過網際網路購買商品的行為，下列敘述何者正確？
  options:
  - label: A
    content: 屬於新型態的買賣行為，受《公平交易法》的保障
  - label: B
    content: 屬於消費者未能檢視商品而與商家所為之訪問交易
  - label: C
    content: 消費者不滿意該商品，若非排外商品，可於收受商品後 7 日內退還
  - label: D
    content: 若消費者不滿意商品欲退貨，須說明理由並付郵資
  answer:
