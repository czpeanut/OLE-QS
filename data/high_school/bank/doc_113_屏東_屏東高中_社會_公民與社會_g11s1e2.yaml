- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 大學剛畢業的小華有三個工作機會與繼續升學的道路可選擇，一是月薪 2 萬 5 千元的家教老師；另一是月薪 2 萬 8 千元的房屋仲介；以及月薪 3 萬元的法務助理；若選擇不就業，繼續進入研究所碩士班就讀，學雜費兩年共需 20 萬元。依上述資料判斷，在不考慮其他條件的情況下，針對小華大學畢業後兩年間做選擇的機會成本之敘述，下列何者正確？
  options:
  - label: A
    content: 若當家教老師，機會成本為 67 萬 2 千元
  - label: B
    content: 若選擇當房屋仲介，外顯成本為 72 萬元
  - label: C
    content: 若選擇就學，外顯成本為 72 萬元
  - label: D
    content: 若選擇就學，機會成本為 92 萬元
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)當家教老師的機會成本為放棄法務助理兩年的薪資 72 萬元。(B)從題文無法判斷當房屋仲介的外顯成本。(C)選擇就學的外顯成本為兩年的學雜費 20 萬元。(D)選擇就學的外顯成本為學雜費 20 萬及隱藏成本當法務助理兩年的薪資 72 萬元，因此機會成本共 92 萬元，為正解。
