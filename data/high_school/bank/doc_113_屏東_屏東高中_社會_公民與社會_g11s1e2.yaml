- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 右圖是天龍科技集團使用所有生產要素生產面板和電池兩種產品之生產可能曲線。近日來，該科技集團之工程師向雇主提出建立完善加班制度之訴求，未獲得該集團主管之重視，工程師憤而集體罷工，生產線暫時停擺，使雇主不得不出面平息爭端。請問假設初始生產點為 A 點，此罷工事件後對該集團生產可能線之影響，下列敘述何者正確？
  options:
  - label: A
    content: 勞動力減少，造成整條生產可能線往內移動
  - label: B
    content: 資源使用效率減少，故由 A 點往 B 點移動
  - label: C
    content: 雇主減少工資成本，故由 A 點往 C 點移動
  - label: D
    content: 生產線停擺，故 A 點脫離生產可能線軌跡至 C 點
  assets:
  - key: s1_9_f1
    kind: figure
    file: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2/s1_9_f1.png
    crop:
      page: 2
      rect:
      - 448.1
      - 178.2
      - 564.3
      - 279.8
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 罷工會使生產線停擺，無法達到最大的生產組合，故生產組合及生產可能線會內移，故選(A)。
