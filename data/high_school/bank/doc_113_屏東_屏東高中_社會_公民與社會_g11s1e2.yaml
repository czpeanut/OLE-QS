  answer_source: answer_key
  explanation: 小華跳槽後沒有多支出的費用，因此沒有外顯成本，其隱藏成本（少得到）為之前工作的月薪 4 萬元，答案(B)。（學校答案為(C)，但筆者認為此題答案有誤）
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_15
