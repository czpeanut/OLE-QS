  answer_status: verified
  answer_source: answer_key
  explanation: (A)應受《消費者保護法》之保障。(B)屬於通訊交易。(C)(D)《消保法》第 19 條第 1 項：「通訊交易或訪問交易之消費者，得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。但通訊交易有合理例外情事者，不在此限。」故(C)為正解。
