  page: 1
  stem: 右圖顯示某國家使用所有生產因素生產兩種產品（X 與 Y）的生產可能曲線，下列敘述何者正確？
  options:
  - label: A
    content: 資源使用效率：A＞B＞C，多生產一單位 Y 的機會成本：A＜B＜C
  - label: B
    content: 資源使用效率：A＝B＝C，多生產一單位 Y 的機會成本：A＜B＜C
    asset:
      key: s1_7_optB
      file: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2/s1_7_optB.png
      crop:
        page: 1
        rect:
        - 439.8
        - 645.85
        - 564.3
        - 756.2
  - label: C
    content: 資源使用效率：A＝B＝C，多生產一單位 Y 的機會成本：A＞B＞C
  - label: D
    content: 資源使用效率：A＜B＜C，多生產一單位 Y 的機會成本：A＞B＞C
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: PPC 線上的每一點皆為充分利用資源的組合，因此資源使用效率：A＝B＝C；但 PPC 有機會成本遞增的現象，多生產一單位 Y 的機會成本：A＞B＞C，故選(C)。
