    | 美國 | 150 | 300 |

    | 臺灣 | 300 | 450 |'
  options:
  - label: A
    content: 臺灣將從美國進口麵包與飲料
  - label: B
    content: 臺灣將專業化生產麵包；而從美國進口飲料
  - label: C
    content: 臺灣將專業化生產飲料；而從美國進口麵包
  - label: D
