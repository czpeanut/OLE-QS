- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在追求自利的過程中，我們必須要在眾多可選擇的方案中有所取捨，意即人們必須要做選擇。下列何者符合經濟學「資源有限，必須選擇」的問題？
  options:
  - label: A
    content: 貧窮者才有資源有限的問題，有錢人則無稀少的問題
  - label: B
    content: 在當代，新鮮的空氣已非取之不盡，故有選擇的問題
  - label: C
    content: 學生尚在求學，因此父母給的零用錢並無選擇的問題
  - label: D
    content: 高所得國家相較於低所得國家較不會產生匱乏的問題
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)無論是何種人都有資源稀少的問題。(B)為正確敘述。(C)零用錢仍有用途選擇的問題。(D)只要涉及選擇都有稀少性跟匱乏的問題。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 經濟學與日常生活息息相關，只要有關「選擇」，都跟經濟學有關，請問下列何者敘述正確？
  options:
  - label: A
    content: 對於億萬富翁來說，不需做選擇
  - label: B
    content: 貧困者因為資源很少，也沒有選擇的問題
  - label: C
    content: 當資源只有一個用途時，就會沒有選擇的問題
  - label: D
    content: 政府決策時，僅需考慮如何做對社會較好，沒有選擇的問題
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)無論是何種人都有資源稀少的問題，都需要做選擇。(C)選擇需要資源有限且資源有多種用途，如果只有一種用途就無需選擇，為正解。(D)政府決策時亦需顧及成本效益分析，故仍有選擇的問題。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 韓國政府為因應人口老化，決定自 2025 年起將大學醫學院招生名額增加 65 ％，醫界擔心可能導致專業訓練不充分等問題，有損相關教育及醫療品質。實習醫生和住院醫生集體發起請辭及罷工運動，政府擔心爆發醫療危機，祭出強制復工令，揚言罷工醫生若不回醫院上班就要吊銷執照。請判斷韓國政府給予罷工醫生的誘因是屬於下列何種類型？
  options:
  - label: A
    content: 正向的金錢誘因
  - label: B
    content: 正向的非金錢誘因
  - label: C
    content: 負向的金錢誘因
  - label: D
    content: 負向的非金錢誘因
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 吊銷執照屬於負向非金錢誘因，故選(D)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列何種敘述符合「市場經濟制度」的定義？
  options:
  - label: A
    content: 是由政府主導市場活動
  - label: B
    content: 公共建設為此一制度的產物
  - label: C
    content: 大部分的生產與消費透過市場來進行
  - label: D
    content: 所有國家採行此一制度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)市場經濟制度的核心特徵是經濟活動主要由市場機制（如供需）決定，而非政府主導，而政府在市場經濟中通常僅扮演規範和監管的角色。(B)公共建設（如道路、橋梁）屬於政府提供的公共財，並非市場經濟制度的核心特徵，通常由政府提供，以避免排他性或妨害他人使用，並可保障社會公平與資源共享。(C)市場經濟制度的定義是透過市場機制（供給與需求）來分配資源，因此大部分的生產與消費是透過市場完成的，為正解。(D)並非所有國家都採行市場經濟制度，例如有些國家採取計畫經濟或混合經濟制度。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 假定甲國的生產可能曲線（PPC）往右上方擴增，下列何者可能是甲國生產可能曲線發生變化的原因？
  options:
  - label: A
    content: 貧富差距縮小
  - label: B
    content: 經濟出現停滯
  - label: C
    content: 失業率上升
  - label: D
    content: 生產技術進步
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: PPC 向外擴張，代表在同樣的時間或資源下，有較大的生產力，也意味生產技術提升或資源增加，故選(D)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有關生產可能曲線（PPC）的敘述，下列何者正確？
  options:
  - label: A
    content: 生產可能曲線上之任一點均代表已達經濟效率，其切線斜率的絕對值就是機會成本的概念
  - label: B
    content: 生產可能曲線乃表示資源固定和生產技術不變，其經濟體系所能生產出二種財貨之最小生產組合
  - label: C
    content: 如果社會是處於生產可能曲線上，則表示該社會處於充分就業與資源充分利用的狀況
  - label: D
    content: 若機會成本是固定的，則生產可能曲線為正斜率的曲線
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) PPC 上的每一點表示資源被充分有效利用，已達經濟效率；而切線斜率的絕對值反映了在生產一種商品時，必須放棄另一種商品的數量，即機會成本，為正解。(B) PPC 顯示的是兩種財貨最大可能的生產組合，而不是最小生產組合。(C) PPC 上的每一點表示社會正以最大效率使用資源（資源充分利用、充分就業），為正解。(D)若機會成本是固定的，PPC 為直線，且為負斜率，因為每增加一種商品的生產必須減少另一種商品的生產。（學校答案為(C)，筆者認為(A)亦可選）
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_7
  section: 1
