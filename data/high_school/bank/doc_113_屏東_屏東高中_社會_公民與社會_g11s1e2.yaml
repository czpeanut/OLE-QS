  explanation: 《消費者保護法》第 19 條第 1 項：「通訊交易或訪問交易之消費者，得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。但通訊交易有合理例外情事者，不在此限。」僅有(D)符合此種交易型態。(A)(C)屬於合理例外情事者，行政院消費者保護會透過《通訊交易解除權合理例外情事適用準則》，第 2 條具體規定出通訊交易不適用七日猶豫期的情形，以及不適用的原因。(B)屬於實體店面購物，不適用猶豫期。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_48
  section: 1
  number: 48
  type: single
  page: 10
  stem: 法律規定，定型化契約應給予消費者一定期間的審閱期，讓消費者詳讀契約或了解契約的內容後再行完成締約。法律設計「審閱期」的目的最主要為下列何者？
  options:
  - label: A
    content: 避免消費者跟店家要求減少審閱期換取優待
  - label: B
    content: 避免消費者在不明情形簽下對自己不利的合約
  - label: C
    content: 避免店家設計定型化契約的內容和法律牴觸
  - label: D
    content: 避免店家寫上政府已規定的不得記載之事項
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《消費者保護法》有關定型化契約審閱期間之立法目的，是為使消費者在訂立定型化契約前，得以充分了解及考量契約之內容，故選(B)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_49
  section: 1
  number: 49
  type: single
  page: 10
  stem: 定型化契約的使用，節省了許多交易時間，買方與賣方可迅速完成交易。下列有關定型化契約的敘述，何者是正確的？
  options:
  - label: A
    content: 《消費者保護法》有審閱期間的規定，讓消費者仔細審閱
  - label: B
    content: 定型化契約由企業單方面提供，消費者不可拒絕簽訂
  - label: C
    content: 只要不違背誠實信用原則，定型化契約內容不受限制
  - label: D
    content: 定型化契約屬於任意規定，為消費者擬定並提供給企業的內容
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正確敘述。(B)消費者可以拒絕簽訂對自己不利之契約。(C)定型化契約需符合《消保法》之相關規定，其內容違反互惠平等原則，對消費者（買方）顯失公平者，應為無效。(D)定型化契約是由一方（通常為企業主）需要與大量不特定的消費者締結契約以提供商品或服務，因此通常會預先擬定制式化的契約條款。其特色在於，他方必須接受該條款，較無商量餘地，但也非任意規定。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_50
  section: 1
  number: 50
  type: single
