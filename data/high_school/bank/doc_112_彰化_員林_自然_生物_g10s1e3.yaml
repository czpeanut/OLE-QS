  stem: 要製造CAR-T cells，需運用何者做為載體？（單選題）
  options:
  - label: A
    content: T細胞
  - label: B
    content: CAR DNA
  - label: C
    content: 病毒
  - label: D
    content: 質體
  group_stem: (三)嵌合抗原受體T細胞（chimenic antigen recentor Tcells，CAR-Tcels）療法為近期醫療新聞的寵兒，世界知名藥廠爭相發表有能力生產CAR-T細胞。CAR-T細胞的腫瘤免疫治療過程，簡單來說，一開始需要將病人的T細胞分離出來並活化，之後將帶有CAR DNA的病毒送至T細胞，幾天後T細胞表面會表現CAR，增殖至需要的細胞數目後，同時病人接受化療，降低病人的免疫功能，再將CAR-T細胞回輸至病人體内。CAR-T細胞會在病人體內尋找並攻擊腫瘤細胞，辨認腫瘤之後，還可以自我複製放大。病人體内的CAR-T細胞數目通常會在7到10天內到達高峰，而且此數量可達病人接受輸注數量的100到1000倍之多。
