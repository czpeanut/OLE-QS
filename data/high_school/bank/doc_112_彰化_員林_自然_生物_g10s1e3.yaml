  group_stem: (一)木質素是一種高度豐富的生物聚合物，來自於纖維素。木質素由三種苯丙烷單體構成，它們會彼此發生交聯組成木質素。這三種苯丙烷單體分別是H-木質素、G-木質素以及S-木質素。這三種木質素在植物中的分布有所不同。一般來說，被子植物則是三種木質素都有，但是H-木質素較少；蕨類與裸子植物主要由G-木質素組成，另外還有少量的H-木質素。
