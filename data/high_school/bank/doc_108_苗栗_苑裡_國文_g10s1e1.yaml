  stem: 下列文句，帶有激勵鼓舞人心意味的選項是：
  options:
  - label: A
    content: 我是學歷史的，我讀過關於那麼多時代的資料，然而真的，我找不到心目中的黃金時代
  - label: B
    content: 沒有黃金時代才是對的。在你描述的那種時代荒涼感受中，我讀到的其實是一顆不願輕易妥協的心
  - label: C
    content: 歷史裡發生過的都不夠好。所以我們才需要想像力，所以我們才需要對現實悲觀，以及相應地對改革樂觀
  - label: D
    content: 有一陣子我迷上了充滿叛逆反抗騷動衝突的六○年代。從新左思潮到嬉皮生活。我以為那應該就是最接近黃金時代的範例
  group_stem: 另外有一次，問起自己最想活的時代，如果不是活在這個時代。令我自己驚訝的，也令其他人不相信的，我竟然全答不上來。我是學歷史的，我讀過關於那麼多時代的資料，然而真的，我找不到心目中的黃金時代。沒有任何一時代是我羨慕或嚮往的，包括我自己所身處的時代。 為什麼沒有黃金時代？為什麼不相信黃金時代？這個問題一直跟隨著我。到美國之後，有一陣子我迷上了充滿叛逆反抗騷動衝突的六○年代。從新左思潮到嬉皮生活。我以為那應該就是最接近黃金時代的範例。可是後來弄清楚六○年代美國如何由民權運動開啟其端，新左派揭啟青年反文化序幕，到嬉皮式虛無主義奪權，這一連串的變化，我突然發現如果活在那個時代，我一定一樣不快樂。 現在我覺得，不快樂其實是對的。沒有黃金時代才是對的。在你描述的那種時代荒涼感受中，我讀到的其實是一顆不願輕易妥協的心。你不想拿哪個時代當標準。它們都不夠好。是的，歷史裡發生過的都不夠好。所以我們才需要想像力，所以我們才需要對現實悲觀，以及相應地對改革樂觀。讀著你的信，我一點都不難過，事實上我覺得似乎又和當年在白千層樹下或墓堆裡的那群老友，包括年少時的自己，重逢晤談呢。（楊照〈黃金時代〉）
