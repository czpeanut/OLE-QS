- id: doc_108_苗栗_苑裡_國文_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 根據上文，世人錯認韓熙載為韓愈，是因二人：
  options:
  - label: A
    content: 皆蓄美髯容貌相似
  - label: B
    content: 皆以文章名揚天下
  - label: C
    content: 皆被尊稱為韓文公
  - label: D
    content: 皆從享於文宣王廟
  group_stem: 世人畫韓退之，小面而美髯，著紗帽。此乃江南韓熙載耳，尚有當時所畫，題誌甚明。熙載諡文靖，江南人謂之韓文公，因此遂謬以為退之。退之肥而寡髯。元豐中，以退之從享文宣王廟，郡縣所畫，皆是熙載。後世不復可辨，退之遂為熙載矣。（沈括《夢溪筆談》）
