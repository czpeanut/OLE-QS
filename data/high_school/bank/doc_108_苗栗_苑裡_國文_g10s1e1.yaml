  number: 37
  type: multiple
  page: 4
  stem: 下列明代散文流變的敘述，<u>錯誤</u>的選項為？
  options:
  - label: A
    content: 明初三大家分別為：宋濂、劉基、方苞
  - label: B
    content: 前後七子文學主張可用「文必秦漢，詩必盛唐」來概括
  - label: C
    content: 歸有光作為唐宋派的代表人物，同時也取法《史記》的寫作特點
  - label: D
    content: 前後七子與唐宋派均以學習韓柳歐蘇等名家為核心主張，差別在於革新精神的存在與否
  - label: E
    content: 公安派主張的「文以載道，才學並重」乃是對於明朝文學思想主流反動
