  stem: 下列關於〈項脊軒志〉全文結構的說明，請選出<u>錯誤</u>的選項：
  options:
  - label: A
    content: 首段透過修葺前後的對比凸顯可喜之事
  - label: B
    content: 第二段以家人分裂為主軸貫穿整個段落
  - label: C
    content: 第四段開頭「項脊生日」正可看出歸有光取法《史記》的筆法
  - label: D
    content: 藉由引述蜀清恪守家業，曹操爭霸天下作為自我期許的對象
  - label: E
    content: 末段藉枇杷樹寫樹在人亡、物是人非的哀痛
- id: doc_108_苗栗_苑裡_國文_g10s1e1_s2_40
  section: 2
  number: 40
  type: multiple
  page: 4
  stem: 將兩種相反的事物或概念放置在一起，給人極鮮明的形象和極強烈的感受，稱之為「對比」手法。下列文句符合此種寫作手法的是：
  options:
  - label: A
    content: 聞道有先後，術業有專攻
  - label: B
    content: 弟子不必不如師，師不必賢於弟子
  - label: C
    content: 有緣千里來相會，無緣對面不相識
  - label: D
    content: 創業的人都會自然而然的想到上天，而敗家的人卻無時不想到自己
  - label: E
    content: 古之聖人，其出人也遠矣，猶且從師而問焉；今之眾人，其下聖人也亦遠矣，而恥學於師
