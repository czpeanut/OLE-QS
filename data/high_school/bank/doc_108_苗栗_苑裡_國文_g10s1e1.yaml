  stem: 下列關於本文內容的說明，敘述正確的選項是：
  options:
  - label: A
    content: 「目眶冉冉動」指寒花因害怕而淚眼汪汪
  - label: B
    content: 「婢持去，不與」寒花因荸薺未煮熟而不給作者
  - label: C
    content: 「事我而不卒，命也夫」為作者感嘆寒花早逝
  - label: D
    content: 「婢初媵時，年十歲，垂雙鬟，曳深綠布裳」在描述寒花的美貌
  group_stem: 婢，魏孺人媵也。嘉靖殅酉五月四日死，葬虛丘。事我而不卒，命也夫！ 婢初媵時，年十歲，垂雙鬟，曳深綠布裳。一日，天寒，爇火煮荸薺熟，婢削之盈甌。予入自外，取食之，婢持去不與。魏孺人笑之。孺人每令婢倚几旁飯，即飯，目眶冉冉動。孺人又指予以為笑。 回思是時，奄忽便已十年。吁，可悲也已！（歸有光〈寒花葬志〉）
