- id: doc_108_苗栗_苑裡_國文_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 文中「食」字的字義，說明<u>錯誤</u>的是：
  options:
  - label: A
    content: 一「食」或盡粟一石：一餐飯
  - label: B
    content: 「食」馬者：飼
  - label: C
    content: 不知其能千里而「食」也：吃
  - label: D
    content: 「食」之不能盡其材：飼養
  group_stem: 世有伯樂，然後有千里馬。千里馬常有，而伯樂不常有。故雖有名馬，祇辱於奴隸人之手，駢死於槽櫪之間，不以千里稱之。 馬之千里者，一食或盡粟一石。食馬者，不知其能千里而食也。是馬也，雖有千里之能，食不飽，力不足，才美不外見，且欲與常馬等不可得，安求其能千里也？ 策之不以其道，食之不能盡其材，鳴之而不能通其意，執策而臨之曰：「天下無馬。」嗚呼！其真無馬邪？其真不知馬也！（韓愈〈雜說四．馬說〉）
