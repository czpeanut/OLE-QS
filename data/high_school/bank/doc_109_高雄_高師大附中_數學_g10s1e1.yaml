  stem: 某個手機程式，每次點擊螢幕上的數 a 後，螢幕上的數就會變成 $a^{2}$。當一開始時螢幕上的數 b 為正且連續點擊螢幕 n 次後，螢幕上的數為
    $b_{n}$。已知 $b_{3}$＝$81^{3}$。下列哪些選項是正確的？
  options:
  - label: A
    content: b＝27
  - label: B
    content: $b_{6}$＝$81^{24}$
  - label: C
    content: 若 $b_{10}$＝$10^{k}$，則 731＜k＜732
  - label: D
    content: $b_{10}$ 為 732 位數
  - label: E
    content: $\frac{1}{b_{10}}$的小數點後第 733 位開始不為 0
  explanation: '(A)╳：$b_{3}$＝（（$b^{2}$）$^{2}$）$^{2}$＝$b^{8}$＝$81^{3}$＝（$3^{4}$）$^{3}$

    ∴b＝$3^{\frac{12}{8}}=3^{\frac{3}{2}}=3\sqrt{3}$

    (B)○：$b_{6}$＝（（（$b^{8}$）$^{2}$）$^{2}$）$^{2}$＝（$81^{3}$）$^{8}$＝$81^{24}$

    (C)╳：$b_{10}$＝$( (b^{8} )^{8} )^{2^{4}}$＝（（$b^{8}$）$^{8}$）$^{16}$＝（$81^{24}$）$^{16}$＝$3^{1536}\approx$（$10^{0.4771}$）$^{1536}$＝$10^{732.8256}$

    $\Rightarrow$k$\approx$732.8256

    (D)╳：$b_{10}\approx10^{732.8256}$＝$10^{732}$×$10^{0.8256}$＝6.……×$10^{732}$ 為 733
    位數

    (E)○：$\frac{1}{b_{10}}$＝（$b_{10}$）$^{－1}\approx10^{－732.8256}$＝$10^{－733＋0.1744}$＝$10^{0.1744}$×$10^{－733}$

    其小數點後第 733 位開始不為 0

    故選(B)(E)'
