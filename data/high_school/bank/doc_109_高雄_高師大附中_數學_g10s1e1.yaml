- id: doc_109_高雄_高師大附中_數學_g10s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些選項是正確的？
  options:
  - label: A
    content: 若 $a^{3}$ 是有理數，且 $a^{6}$ 是有理數，則 a 是有理數
  - label: B
    content: 若 $a^{3}$ 是有理數，且 $a^{5}$ 是有理數，則 a 是有理數
  - label: C
    content: 若 a，b 均為實數，a－b 為有理數，且 ab 為無理數，則 a＋b 必為無理數
  - label: D
    content: $0.\overline{9} < 1$
  - label: E
    content: a，b 均為實數，若$a +b\sqrt{2} =0$，則 a＝b＝0
  explanation: '(A)╳：反例：$a =\sqrt[3]{2}$是無理數，但 $a^{3}$＝2，$a^{6}$＝（$a^{3}$）$^{2}$＝4
    都是有理數

    (B)○：∵$a^{3}$，$a^{5}$ 皆為有理數 ∴$\frac{a^{3} \cdot a^{3}}{a^{5}}$＝a 為有理數

    (C)○：假設 a＋b 為有理數，又 a－b 為有理數

    則 a＝$\frac{(a +b)+(a -b)}{2}$，b＝$\frac{(a +b)-(a -b)}{2}$都是有理數

    ∴ab 為有理數，產生矛盾

    故假設有誤，即 a＋b 必為無理數

    (D)╳：$0.\overline{9} =\frac{9}{9}= 1$

    (E)╳：反例：$a =\sqrt{2}$，b＝－1，則$a +b\sqrt{2} =\sqrt{2} +(-1) \times \sqrt{2} =0$

    故選(B)(C)'
- id: doc_109_高雄_高師大附中_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列哪些選項是正確的？
  options:
  - label: A
    content: $10^{\log \frac{1}{2}}> 10^{\log \frac{1}{3}}$
  - label: B
    content: 將正數 a 寫成 10 的次方時，其指數必為正數
  - label: C
    content: a＞0，則 $10^{2 loga}$＝2a
  - label: D
    content: a＞0，則$\frac{1}{a}$＝$10^{－loga}$
  - label: E
    content: $10^{0.4771}$＝3
  explanation: '(A)○：∵$10^{\log \frac{1}{2}}=\frac{1}{2}$，$10^{\log \frac{1}{3}}=\frac{1}{3}$
    ∴$\frac{1}{2}>\frac{1}{3}\Rightarrow10^{\log \frac{1}{2}}> 10^{\log \frac{1}{3}}$

    (B)╳：反例：a＝$\frac{1}{10}> 0$，但 a＝$10^{－1}$

    (C)╳：a＞0，$10^{2 loga}$＝（$10^{loga}$）$^{2}$＝$a^{2}$≠2a

    (D)○：a＞0，$10^{－loga}$＝（$10^{loga}$）$^{－1}$＝$a^{－1}$＝$\frac{1}{a}$

    (E)╳：3＝$10^{0.4771212……}$≠$10^{0.4771}$

    故選(A)(D)'
- id: doc_109_高雄_高師大附中_數學_g10s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設 a＞0 且 a＋$a^{－1}$＝6，則下列哪些選項是正確的？
  options:
  - label: A
    content: a＞1
  - label: B
    content: a－$a^{－1}$＝$4\sqrt{2}$
  - label: C
    content: $a^{2}$＋$a^{－2}$＝34
  - label: D
    content: $a^{\frac{1}{2}}+a^{-\frac{1}{2}}=2\sqrt{2}$
  - label: E
    content: $a^{3}$＋$a^{－3}$＝196
  explanation: '(A)╳：a＋$a^{－1}$＝6

    $\Rightarrowa^{2}$－6a＋1＝0$\Rightarrow$a＝$\frac{6\pm \sqrt{32}}{2}=3\pm 2\sqrt{2}$

    (B)╳：（a－$a^{－1}$）$^{2}$＝（a＋$a^{－1}$）$^{2}$－$4aa^{－1}$＝$6^{2}$－4＝32

    $\Rightarrow$a－$a^{－1}$＝$\pm \sqrt{32} =\pm 4\sqrt{2}$

    (C)○：（a＋$a^{－1}$）$^{2}$＝$a^{2}$＋$2aa^{－1}$＋$a^{－2}$

    $6^{2}$＝$a^{2}$＋2＋$a^{－2}\Rightarrowa^{2}$＋$a^{－2}$＝34

    (D)○：$(a^{\frac{1}{2}}+a^{-\frac{1}{2}})^{2}$＝a＋$a^{－1}$＋2＝6＋2＝8

    ∵a＞0 ∴$a^{\frac{1}{2}}+a^{-\frac{1}{2}}=\sqrt{8} =2\sqrt{2}$

    (E)╳：$a^{3}$＋$a^{－3}$＝（a＋$a^{－1}$）$^{3}$－$3aa^{－1}$（a＋$a^{－1}$）＝$6^{3}$－3×1×6＝198

    故選(C)(D)'
- id: doc_109_高雄_高師大附中_數學_g10s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 若$\sqrt{7+4\sqrt{3}}$的整數部分是 a，小數部分是 b，則下列哪些選項是正確的？
  options:
  - label: A
    content: a＝4
  - label: B
    content: b＝0.732
  - label: C
    content: a－b＝$4+\sqrt{3}$
  - label: D
    content: a＋b＝$2+\sqrt{3}$
  - label: E
    content: $\frac{1}{a -b}=\frac{4+\sqrt{3}}{13}$
  explanation: '(A)╳：$\sqrt{7+4\sqrt{3}}$＝$\sqrt{7+2\sqrt{12}}$＝$\sqrt{(\sqrt{4} +\sqrt{3}
    )^{2}}$＝$2+\sqrt{3}$＝2＋1.732……$\approx$3.732

    ∴a＝3

    (B)╳：b＝$\sqrt{7+4\sqrt{3}} -a$＝$2+\sqrt{3} -3=\sqrt{3} -1$

    (C)╳：a－b＝$3-(\sqrt{3} -1)=4-\sqrt{3}$

    (D)○：a＋b＝$3+(\sqrt{3} -1)=2+\sqrt{3}$

    (E)○：$\frac{1}{a -b}=\frac{1}{4-\sqrt{3}}=\frac{4+\sqrt{3}}{13}$

    故選(D)(E)'
- id: doc_109_高雄_高師大附中_數學_g10s1e1_s1_5
