  stem: 很多人在服藥時，最擔心的是藥物在體內殘留的時間。根據專業藥師的說法，藥物在人體內，經過正常的代謝程序，最終都會排出體外，只是時間長短。一個比較客觀的判讀方法，是依照每個藥物的「半衰期」來預測。「半衰期」指的是藥物在體內吸收之後，分佈到血液中，達到最高血中濃度，經代謝排除之後，血中濃度下降到原本一半所需的時間。某常見的止痛藥，其有效主成分是「乙醯胺酚」（Acetaminophen），以一般健康成年人來說，其「半衰期」約為
    2.5 小時，今有一名健康成年人，用藥後 30 分鐘即達到血液高峰值，若再過 8 小時後，血液中的藥物濃度將是原本濃度的 a ％，則 a＝＿＿＿＿。（答案以四捨五入法取到小數點後第二位）
