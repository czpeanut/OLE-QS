  stem: 'pH 值是衡量溶液酸鹼程度的標準，定義如下：

    pH 值＝－log[$H^{＋}$]，其中：[$H^{＋}$] 為氫離子的濃度（莫耳／升）。

    下表是食物酸鹼程度的分類表：

    | 食物 | pH 值（平均） | 食物 | pH 值（平均） | 食物 | pH 值（平均） |

    | --- | --- | --- | --- | --- | --- |

    | 水 | 7.0 | 鳳梨 | 4.0 | 番茄 | 4.5 |

    | 牛奶 | 7.4 | 草莓 | 3.0 | 蘋果 | 4.9 |

    | 石榴 | 5.0 | 葡萄 | 4.5 | 蔓越莓汁 | 2.4 |

    | 西瓜 | 6.6 | 香蕉 | 4.85 | 檸檬 | 2.3 |

    則用一升西瓜、兩升牛奶的西瓜牛奶 pH 值為＿＿＿＿。（答案以四捨五入法取到小數點後第二位）'
