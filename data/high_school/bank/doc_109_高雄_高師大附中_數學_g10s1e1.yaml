  stem: 根據調查，九成減重的人面臨復胖困擾，關鍵點在「體脂肪」。現代醫學測量肥胖不再只用體重，而是體脂肪；對於是否須減肥，不再只以「體重」做標準，改以「體脂率」做判斷。體脂肪率是指體重有多少百分比是由脂肪所構成，男性正常體脂率在
    14～23 ％之間，女性在 17～27 ％之間，年紀越大體脂率越高，30 歲的男性超過 25 ％、女性超過 30 ％即為「肥胖」。如果一位 60 公斤的男性，體脂率為
    20 ％，其身體的脂肪重量為體重（60 公斤）×體脂率（20 ％）＝12 公斤。維持健康之最低體脂肪量：男性 3 ％、女性 10～12 ％。已知某年輕女性體重
    50 公斤，且體脂肪率在正常範圍內，若其身體的脂肪重量為 x 公斤且 x 的範圍可表為｜x－a｜$\leq$b，則數對（a，b）＝＿＿＿＿。
