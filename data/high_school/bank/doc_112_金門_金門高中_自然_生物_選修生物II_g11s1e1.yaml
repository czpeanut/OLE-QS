  group_stem: (一)光合作用為一個需透過光能驅動的反應，而光的質與量和農作物的產量及品質息息相關，因此探討光如何影響植物非常重要。植物經由光合作用將$CO_{2}$轉換為養分，而在呼吸作用時利用養分的代謝獲得能量，中間伴隨著$CO_{2}$的產生。光合作用與呼吸作用在不同的光照強度下有著不同的作用速率。當這兩種作用的速率相等時，代表此刻的$CO_{2}$淨交換率等於0，稱為「光補償點」（light compensation point），當植物在光補償點時，有機物的形成和消耗的量相等，無法累積養分。當光線大於光補償點後，植物的光合速率隨光照強度上升而增大，但當到達某一數值後，光合作用效率不再提高時的臨界光照強度，稱為「光飽和點」（light saturation point），當植物受到過強的光照，葉片有可能會因此受傷而無法再進行光合作用。不同植物的光補償點及光飽和點都不相同，陽性植物相較於陰性植物具有較高的光補償點及光飽和點，且光合作用方式不同亦會有不同的結果；而單一棵植物的光補償點及光飽和點也會受到許多環境因素影響，因此不論在園藝或是農業的應用上都需非常注意。
