- id: doc_110_桃園_平鎮_自然_生物_選修生物II_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 複式光學顯微鏡配置有10倍目鏡及4、10、40倍的物鏡，若以4倍物鏡來觀察物體，則下列敘述何者正確？
  options:
  - label: A
    content: 與使用其他物鏡相比，對焦完成後，物鏡與載玻片之間的距離最短
  - label: B
    content: 與使用其他物鏡相比，能看到的細胞數目最多
  - label: C
    content: 與使用其他物鏡相比，能觀察到的視野範圍最小
  - label: D
    content: 光源條件相同時，與使用其他物鏡相比，視野最暗
  group_stem: 阿凱利用複式光學顯微鏡進行植物細胞的觀察，請回答下列4、5題
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)倍率越高的物鏡，鏡身越長。因此對焦後，與載玻片之間距離最短的為40倍物鏡；(C)倍率越低的物鏡，所觀察到的視野範圍越大；(D)倍率越高的物鏡，需光量越大。因此固定相同光源條件，倍率越低的物鏡，視野越亮。
