  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)陸生植物的保衛細胞多位於下表皮；(B)洋蔥表皮細胞內無葉綠體；(D)花粉粒觀察的實驗中，為了避免液體的蒸發流失而影響花粉管萌發，因而使用凡士林將蓋玻片四周圍封住，非用以固定花粉粒。
