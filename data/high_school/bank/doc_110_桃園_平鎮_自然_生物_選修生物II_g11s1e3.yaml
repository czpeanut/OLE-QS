  type: single
  page: 1
  stem: 下列關於植物激素對於植物生長的配對，何者正確？
  options:
  - label: A
    content: 馬鈴薯在儲存時易發芽而失去市場價值，農民會利用植物生長素抑制其發芽
  - label: B
    content: 乙烯濃度上升時可促使植物葉柄基部產生離層
  - label: C
    content: 果農進行果樹嫁接時，常以細胞分裂素塗抹在接口處以加速其傷口的癒合
  - label: D
    content: 組織培養技術除了放入營養成分和植物生長素外，尚需加入離層酸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應使用離層酸，因離層酸會抑制植物生長，使其休眠；(C)嫁接時於切口處塗抹生長素可促進形成層細胞分裂，加速癒合；(D)植物組織培養使用生長素與細胞分裂素調控植物的生長發育。
