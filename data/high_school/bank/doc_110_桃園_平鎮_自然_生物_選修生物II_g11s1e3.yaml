  stem: 人們喜歡在各種季節欣賞美麗的花，但世界上最大的花卻有強烈的腐臭味，它就是大名鼎鼎的「大王花」（Rafflesia arnoldii），又稱「腐屍花」，花冠為帶有斑點的豔紅色，主要分布於蘇門答臘與婆羅洲的熱帶雨林中，一般直徑約1～1.5公尺，重量可達8公斤。事實上，這種花不具葉片，而是以菌絲般的構造寄生於藤類植物上。大王花為單性花，花苞發育需兩個月以上的時間，但開花期僅不到一週，開花後會散發腐敗的味道，以吸引蠅類等昆蟲協助傳播花粉；花期結束後，即崩塌成一堆黑色的黏性物質。大王花的果實具木質化棕色的表面，為一個直徑約15公分的球體，內部充滿乳白色、富脂肪的果肉及上千個紅棕色的種子，當動物前來享用時，種子就會藉由皮毛、爪子或糞便傳播。由上述短文中，可得知大王花應有下列哪些特徵？
  options:
  - label: A
    content: 屬於風媒花
  - label: B
    content: 可進行光合作用
  - label: C
    content: 具有雌性花與雄性花
  - label: D
    content: 具有多個胚珠
  - label: E
    content: 果肉具有毒液，避免動物攝食
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)藉由蠅類等昆蟲協助傳粉，為蟲媒花；(B)行寄生方式，無法行光合作用；(E)透過動物食用果實協助傳播種子，故其果肉無毒。
