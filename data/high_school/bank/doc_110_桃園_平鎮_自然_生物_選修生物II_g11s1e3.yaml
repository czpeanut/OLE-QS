  stem: 下列為阿凱觀察的過程及結果紀錄，何者正確？
  options:
  - label: A
    content: 榕樹葉片上、下表皮的保衛細胞數量差異不大
  - label: B
    content: 洋蔥表皮細胞有葉綠體，滴加亞甲藍液染色可見細胞核
  - label: C
    content: 水蘊草葉月中可以觀察到會移動的葉綠體顆粒，但無法觀察到保衛細胞
  - label: D
    content: 花粉粒的觀察，須塗上凡士林以固定花粉粒
  group_stem: 阿凱利用複式光學顯微鏡進行植物細胞的觀察，請回答下列4、5題
