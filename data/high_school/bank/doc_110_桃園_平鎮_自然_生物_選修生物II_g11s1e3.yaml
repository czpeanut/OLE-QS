  stem: 通常被子植物的一個大孢子母細胞經過減數分裂會產生A個大孢子，每個大孢子再經B次有絲分裂產生具有C個細胞的雌配子體，A～C代表數字，下列何者正確？
  options:
  - label: A
    content: A＋B＝7
  - label: B
    content: C＝8(
  - label: C
    content: A＋C＝9
  - label: D
    content: A＋B＋C＝11
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 大孢子母細胞經減數分裂後，會產生1個大孢子。大孢子再經過3次有絲分裂，產生雌配子體—胚囊，胚囊由7個細胞構成。因此，根據題意A＝1，B＝3，C＝7，A＋B＋C＝11。
