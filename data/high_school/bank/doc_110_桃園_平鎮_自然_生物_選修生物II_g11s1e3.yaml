  stem: 羊帶來為短日照植物，其臨界日照為15.5小時光照。現有a、b、c、d、e五組處理，如下圖所示。已知結果a、c兩組均開花，b組不開花，d、c組結果未知，下列敘述何者正確？
  options:
  - label: A
    content: 植物需整株施予適當光照才可聞花
  - label: B
    content: 由b與c組比較可知，植物是經由葉片感受適宜的光週期
  - label: C
    content: 預測d、e兩組植物皆不會開花
  - label: D
    content: a組可作為d組的對照組
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_110_桃園_平鎮_自然_生物_選修生物II_g11s1e3/s1_6_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 383.8
      - 401.8
      - 568.9
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)根據a、b、c組的實驗結果可以得知，只要植株上還有葉片，在適當的光週期處理下就會開花，因此葉片為感測光照週期的部位，不須整株施予適當光照才可開花；(C) e組因為有一片葉子處理可使其開花的光週期，因此e組會開花；(D) a、d兩組處理的光週期方式不同，且葉子數量也不同，有兩個變因，兩組無法互相比較。
