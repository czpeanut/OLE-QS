- id: doc_110_桃園_平鎮_自然_生物_選修生物II_g11s1e3_s3_32
  section: 3
  number: 32
  type: single
  page: 6
  stem: 被子植物的種子內含有哪些構造？
  options:
  - label: A
    content: 一個胚和一個胚乳
  - label: B
    content: 一個胚和兩個胚乳
  - label: C
    content: 兩個胚和一個胚乳
  - label: D
    content: 兩個胚和兩個胚乳
  group_stem: 被子植物有一個獨特的特徵，即由花粉管攜帶的兩個精細胞可分別與胚珠內的卵細胞和極核結合，產生胚與胚乳，並由種皮包覆形成種子。這兩個精細胞通常是由生殖細胞經對等的有絲分裂而產生的，因此它們的形態和基因表現應該是相似的。但是，長久以來，科學家的心中存著困惑－這兩個精細胞的功能是否相等？也就是說，這兩個精細胞與卵細胞和極核受精的能力是相等的嗎？ 為了回答這個問題，科學家選用了一個阿拉伯芥的突變株rbr1，此突變株與野生型不同之處為：它的胚珠在雌配子形成的過程中會無止境的增生，而產生較野生株多的極核（野生型只有兩個極核），但是這些極核不具受精能力。此外，rbr1突變株也含有與野生型的卵細胞形態相似之兩個卵細胞（野生型只有一個卵細胞），科學家利用一種只能在成熟卵細胞表現的特殊蛋白質（egg cell1，EC1）接上綠色螢光劑，在螢光顯微鏡下辨識卵細胞是否成熟，結果發現rbr1突變株的額外卵細胞是完全分化並具有功能的。因此，阿拉伯芥rbr1突變株的胚珠便提供了一個可以用來挑戰兩個精細胞是否皆具有與卵細胞受精的實驗系統。 科學家先將具有綠色螢光EC1的rbr1突變株之胚珠與野生型的花粉交配，此野生型的精細胞已先用接有紅色螢光劑的蛋白質HTR 10-mRFP1標識。在螢光顯微鏡下可以觀察到野生型的一對精細胞到達rbr1突變株的胚珠。接著觀察到這兩個精細胞的核與卵細胞的核結合，由此表示這兩個精細胞皆有相等能力與卵細胞結合。科學家的結論是：阿拉伯芥的兩個同型的精細胞具有同等的功能可與卵細胞受精，但是由本實驗尚無法知道兩個精細胞與極核結合的能力是否相似。依據上文內容和習得的知識，回答第31-33題：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 胚囊中僅有一個卵細胞與一個中央細胞(含兩個極核)，卵細胞與精細胞受精形成胚，中央細胞與精細胞受精形成胚乳。
