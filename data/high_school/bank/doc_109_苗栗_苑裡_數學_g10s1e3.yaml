  answer_status: verified
  answer_source: answer_key
  explanation: '由題意可設

    f（x）＝（－$x^{2}$－2x＋3）$Q_{1}$（x）＋（3x－1）……………①

    f（x）＝（x－2）$Q_{2}$（x）＋3 ………………………………②

    f（x）＝（$x^{2}$－3x＋2）Q（x）＋（ax＋b） ………………③

    $x^{2}$－3x＋2＝（x－1）（x－2）

    x＝1 代入①及③$\Rightarrow$f(1)＝0＋2＝0＋a＋b

    x＝2 代入②及③$\Rightarrow$f(2)＝0＋3＝0＋2a＋b

    $\Rightarrow\begin{cases}a +b =2 \\ 2a +b =3\end{cases}\Rightarrow\begin{cases}a =1 \\ b =1\end{cases}$

    故餘式為 x＋1'
