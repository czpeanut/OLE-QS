  stem: 下列有關絕對利益與比較利益的敘述，哪些是正確的？(甲)不必提高生產力，僅憑絕對利益分工就可以使雙方受惠；(乙)分工的好處必須利用絕對利益達成；(丙)比較利益主張，兩國（兩人）生產兩種產品，而其中一國（一人）擁有兩種絕對利益時，就無法達到分工互利的可能；(丁)透過專業分工、市場交換，進而促成經濟發展；(戊)生產自己具有比較利益的產品，再互相交換，會比自行生產各式產品來得好
