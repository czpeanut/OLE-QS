- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 假設我國代孕制度合法化後，一對委託夫妻提供健康的精子、卵子，並尋求一名單身女性實施代孕，根據我國現行法律，委託夫妻如何與代孕子女建立親子關係？
  options:
  - label: A
    content: 代孕子女出生後，委託夫妻推定為該名代孕子女的生父與生母
  - label: B
    content: 委託妻與代孕子女雖無分娩事實，但仍可以血緣關係推定為生母
  - label: C
    content: 代理孕母與委託夫無婚姻關係，委託夫可認領代孕子女成為親子
  - label: D
    content: 委託夫妻雙方皆依血緣關係認領方式與代孕子女建立親子關係
- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 2018年一名中國生物學家對外表示，其團隊已經順利培育出一對具有天生抵抗愛滋病能力的基因改造嬰兒，隨即受到舉世矚目與批評。因為這樣的實驗與研究，除了被世界各國明文禁止外，也踰越了人類社會的界限。雖然外界對其真實性有所質疑，但各國科學家仍痛批這是一個「瘋狂實驗」，將使全人類遭受莫大的風險。這個結果顯示，基因改造的問題不在於科技的發展成熟與否，而是下列哪一個問題？
  options:
  - label: A
    content: 公權力是否能建構制約個人或組織的制度
  - label: B
    content: 如何取得科技使用與社會觀感之間的平衡
  - label: C
    content: 是否動搖人類社會價值觀與違反生命倫理
  - label: D
    content: 實驗者未來將如何對被改造的當事人負責
- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2016年《牛津英語詞典》（Oxford English Dictionary）公布年度代表詞彙：「post-truth（後真相），意指「訴諸情感及個人信念，較陳述客觀事實更能影響輿論的情況」（引自：紐約時報中文網）。這個詞彙反映出，當代人們把個人觀感與情緒放在首位，認同媒體或政治人物的不實訊息，而「真相不再重要」的現象。因此，下列哪一個問題在後真相時代更須加以正視？
  options:
  - label: A
    content: 隱私權
  - label: B
    content: 正確性
  - label: C
    content: 所有權
  - label: D
    content: 可近性
- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 布拉格市市長賀瑞普（Zdenek Hrib）堅持要和中國刪除姊妹市協定中的「一中條款」，但未獲回應，因此宣布解除和北京市的姊妹市關係。日前來訪臺北市時表示自己為「臺灣迷」，臺灣人熱情又友善，加上臺北市與布拉格很多共同價值，例如：熱愛民主自由，因此雙方關係能更深化，甚至締結為姐妹市。布拉格市市長友好臺灣之舉，建立在我國的什麼條件上？
  options:
  - label: A
    content: 不以「國家」為參與國際活動的要件
  - label: B
    content: 民主自由與人民特質發揮實質影響力
  - label: C
    content: 當下兩岸關係處於緊張或和緩的狀態
  - label: D
    content: 參與國際事務並對國際社會產生貢獻
- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年來臺灣登山人口增加，山難事件時有所聞，常需內政部空勤總隊出動直升機搜救。許多縣市政府公告登山活動自治管理條例，未依原登山計畫而改變活動路線或範圍，因此發生事故者，除應繳交相關救援費用外，還應繳交罰鍰。題文涉及的有關政府立法時的考量，以下敘述何者正確？
  options:
  - label: A
    content: 政府出動直升機的費用為直接效益
  - label: B
    content: 政府購置直升機的經費為間接成本
  - label: C
    content: 登山客所繳交之罰鍰費用為間接效益
  - label: D
    content: 登山客所繳交之救援費用為直接效益
- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 經濟學與日常生活息息相關，只要有關「選擇」，都跟經濟學有關，請問下列何者敘述正確？
  options:
  - label: A
    content: 對於億萬富翁來說，不須做選擇
  - label: B
    content: 貧困者因為資源很少，也沒有選擇的問題
  - label: C
    content: 當資源只有一個用途時，就會沒有選擇的問題
  - label: D
    content: 政府決策時，僅需考慮如何做對社會較好，沒有選擇的問題
