- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 近年我國政府推動「新購電動機車補助方案」，當民眾購買電動機車時，政府便給予民眾一筆補助費用，藉此鼓勵民眾「汰換舊車換新電動車」。同時，電動車業者也配合政府，協助政策宣傳並提供優惠折扣。政府的這項政策方案，最可能是為了達成何種經濟效果？
  options:
  - label: A
    content: 透過政策提供實物補貼誘因，引導民眾將舊型機車汰換為電動車
  - label: B
    content: 透過政策提供非金錢誘因，藉此鼓勵業者進行電動車的增產
  - label: C
    content: 透過降低價格的方式，鼓勵業者自發性配合政府的環保政策
  - label: D
    content: 透過價格的改變建立金錢誘因，增加民眾購買電動車的意願
- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 誘因是驅動人們產生特定行為的推動力，包含正向鼓勵性的報償，與負向遏止性的代價。以下政府採取的政策工具，何者建立相應產品的負向消費誘因？
  options:
  - label: A
    content: 2016年起停徵個人證券交易所得稅
  - label: B
    content: 民眾實名制赴郵局領取三倍振興券
  - label: C
    content: 公家機關及學校不得使用一次性餐具
  - label: D
    content: 2020年國防軍事用品的採購管制鬆綁
- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 在多人線上戰鬥競技場遊戲（MOBA）中，「支援者」（Support）的工作主要是負責癱瘓對方角色並指揮隊友開戰，讓「核心者」（Cary）可以在最佳的時機點，進行最有效的攻擊，藉此打贏會戰、累積優勢並獲得勝利。由於核心者需要瞬間的反應，因此操作者的反應時間必須愈短愈好。下表為小安和小巴的癱瘓對方與反應時間比較，若依照專業分工的觀點，下列分工形式何者最能夠獲得勝利？
  options:
  - label: A
    content: 小安適合擔任支援者，小巴適合擔任核心者
  - label: B
    content: 小安適合擔任核心者，小巴適合擔任支援者
  - label: C
    content: 小安與小巴的能力顯不相當，小安任何工作安排均可
  - label: D
    content: 小安先擔任核心者，一段時間後換小巴擔任
