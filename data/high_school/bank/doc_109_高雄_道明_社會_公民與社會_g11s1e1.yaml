  stem: 阿鳳大學畢業後，同時考上公職、甲公司以及可自行創業，公職年薪是65萬元，甲公司的薪水是50萬元，創業的年薪為45萬，請問：阿鳳選擇公職的機會成本為何？
  options:
  - label: A
    content: 公職年薪65萬元
  - label: B
    content: 創業的年薪45萬元
  - label: C
    content: 公司年薪50萬元
  - label: D
