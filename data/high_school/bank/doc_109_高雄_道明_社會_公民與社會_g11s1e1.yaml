  group_stem: 新冠病毒肺炎（COVID-19，俗稱武漢肺炎）疫情在各國肆虐，為了確保疫情獲得妥善控制，行政院公布，若因新冠肺炎接受隔離、檢疫者，或者為照顧隔離、檢疫者而無法從事工作的照顧者，將可獲得補償每天1,000元，最多14天就可領取1.4萬元，但有支薪者不得重複領取。 為做好防疫工作，臺灣中央流行疫情指揮中心祭出「居家隔離」及「居家檢疫」，前者為確診個案接觸者，後者為曾有國外旅遊史入境者，均不可任意外出。不過這涉及到個人工作權益，甚至影響生活，因此行政院提出補償辦法。 國家疫情指揮中心在2020年3月16日也宣布，民眾非必要到旅遊疫情第三級警告的國家或地區，以及填寫檢疫通知書不實者、違反居家隔離、居家檢疫的國人，不可領取防疫補償並加徵必要費用，倘若確診，還要公布姓名。 ※居家隔離、居家檢疫和自主健康管理的差別 資料來源：中央流行疫情指揮中心，2020年4月7日。
