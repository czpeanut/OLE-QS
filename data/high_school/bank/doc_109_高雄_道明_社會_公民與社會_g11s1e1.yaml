- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 附圖是傅士慷科技集團使用所有生產要素生產面板和電池兩種產品之生產可能曲線。近日來，該科技集團之工程師向雇主提出建立完善制度之訴求，未獲得該集團主管之重視，工程師憤而集體罷工，生產線暫時停擺，使雇主不得不出面平息爭端。請問：假設初始生產點為A點，此罷工事件後對該集團生產可能線之影響，下列敘述何者正確？
