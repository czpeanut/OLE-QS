- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s2_38
  section: 2
  number: 38
  type: single
  page: 7
  stem: 依據題文訊息判斷，對於業者而言，限用塑膠袋政策與限用一次性塑膠吸管政策，各自屬於何種誘因的類型？
  options:
  - label: A
    content: 限用塑膠袋政策為正向誘因，限用一次性塑膠吸管政策為正向誘因
  - label: B
    content: 限用塑膠袋政策為負向誘因，限用一次性塑膠吸管政策為正向誘因
  - label: C
    content: 限用塑膠袋政策為負向誘因，限用一次性塑膠吸管政策為負向誘因
  - label: D
    content: 限用塑膠袋政策為正向誘因，限用一次性塑膠吸管政策為負向誘因
  group_stem: 資料一 2018年1月1日起，行政院環保署擴大限制使用購物塑膠袋政策正式上路，新增7類管制對象，包括藥粧店／美粧店／藥局、醫療器材行、家電攝影／資訊／通訊設備零售業、書籍及文具零售業、洗衣店、飲料店、西點麵包店，皆不得免費提供購物用塑膠袋，若民眾有需要須另行購買，預計將再納管8萬家業者。行政院環保署表示，違者第一次將先施以勸導，第二次及其後違反者，依《廢棄物清理法》處新臺幣1,200元以上6,000元以下罰鍰。期待塑膠筏從現在每人每年使用700個減少到400個，目標鎖定2025年再減少到100個。 資料二 行政院環保署推動一次性塑膠吸管限用政策，2019年7月1日上路，第一階段限制使用的對象，包括政府部門、學校、百貨公司及購物中心，以及連鎖速食店，不得提供用顧客一次性塑膠吸管。部分連鎖速食店明顯標示不提供一次性塑膠吸管，改提供就口杯杯蓋，也有店家以紙吸管作為替代，更有民眾自備不鏽鋼吸管。環保署表示，若店家違規會先開立勸導單，7天內再由地方環保局人員辦理複查，複查仍不合格將依《廢棄物清理法》處新臺幣1,200元以上6,000元以下罰鍰。目前國內1年約用30億支吸管，每人1年用量超過120支，此次限用政策，預期可減少1億支使用。環保署表示，會按原定規劃，在實施1年後再評估是否將外帶亦納入限用範圍。
