- id: doc_109_高雄_道明_社會_公民與社會_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 賈伯想買一支蘋果手機，他上網比價之後詢問到一支手機8,000元，但沒有任何保固，還要外加200元的運費。後來，他又在一家實體店面詢問到同款手機為10,000元，保固期限為1年。賈伯考慮後，決定在實體店面買下這支手機，下列關於他做選擇的理由，何者正確？
