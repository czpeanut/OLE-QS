  stem: 複合式網路咖啡店，服務包含電腦娛樂上網、漫畫租借或餐飲等生活消費，幾乎無一不有。許多網路咖啡店為了競爭，更推出儲值優惠，只要加入會員並且購買儲值卡，即能享有多項折扣。加入會員購買儲值卡所簽訂之契約，即為所謂「定型化契約」。關於「定型化契約」下列敘述何者正確？
