  stem: 成本效益分析（cost-benefit analysis）是一套有系統的分析方法，以提供政府評估公共支出計畫的可行性，然而在實際應用上卻有限制，下列敘述何者正確？
  options:
  - label: A
    content: 估算效益，僅包括直接效益，因為間接效益不是政府所得到的效益，應該排除
  - label: B
    content: 估算各項成本中只計算各項有形花費即可
  - label: C
    content: 成本效益分析有時具有不確定性，例如公共工程興建期間的成本波動等因素
  - label: D
    content: 成本效益分析只需要著重在短期的花費與成效上
