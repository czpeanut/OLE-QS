  answer_status: verified
  answer_source: answer_key
  explanation: '隨機變數 X 表示射擊失誤的次數，令射擊失誤為成功

    則成功的機率為 0.25，失敗的機率為 0.75，則 X～B（6，0.25）

    可得 X 的機率質量函數為 P（X＝k）＝$C_{k}^{6} ( 0.25 )^{k} ( 0.75 )^{6 -k}$，k＝0，1，2，……，6

    則隨機變數 X 的機率分布表如下

    0.（0.75）$^{6}\approx$0.17798 1.6×（0.25）×（0.75）$^{5}$ $\approx$0.35596 2.15×（0.25）$^{2}$×（0.75）$^{4}$ $\approx$0.29663 3.20×（0.25）$^{3}$×（0.75）$^{3}$ $\approx$0.13184 4.15×（0.25）$^{4}$×（0.75）$^{2}$ $\approx$0.03296 5.6×（0.25）$^{5}$×（0.75）$\approx$0.00439 6.（0.25）$^{6}\approx$0.00024

    當隨機變數 X 在 X＞3 時

    機率總和約為 0.03296＋0.00439＋0.00024＝0.03759＜α＝0.05

    在 X＞2 時，機率總和約為 0.33422＞α＝0.05

    故拒絕域為 X＞3'
- id: doc_110_台南_台南二中_數學_數乙_g12s2e1_s2_10
