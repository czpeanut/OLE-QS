  stem: '試選出右圖中鋪色區域（包含邊界）為下列哪個聯立不等式之解。

    $答$：＿＿＿＿。'
  options:
  - label: A
    content: $\begin{cases}x -y\geq -1 \\ 3x +y\leq 13 \\ x + 3y\leq 7\end{cases}$
  - label: B
    content: $\begin{cases}x -y\leq -1 \\ 3x +y\leq 13 \\ x + 3y\leq 7\end{cases}$
  - label: C
    content: $\begin{cases}x -y\geq -1 \\ 3x +y\geq 13 \\ x + 3y\geq 7\end{cases}$
  - label: D
    content: $\begin{cases}x -y\geq -1 \\ 3x +y\leq 13 \\ x + 3y\geq 7\end{cases}$
  - label: E
    content: $\begin{cases}x -y\leq -1 \\ 3x +y\leq 13 \\ x + 3y\geq 7\end{cases}$
  assets:
  - key: s2_10_f1
    kind: figure
    file: doc_110_台南_台南二中_數學_數乙_g12s2e1/s2_10_f1.png
    crop:
      page: 2
      rect:
      - 473.25
      - 567.7
      - 564.3
      - 662.5
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 過點（1，2）、（3，4）的直線為 x－y＝－1

    點（4，1）代入得 4－1＝3$\geq$－1

    故區域滿足$x -y\geq -1$

    (2) 過點（3，4）、（4，1）的直線為 3x＋y＝13

    點（1，2）代入得 3＋2＝5$\leq$13

    故區域滿足$3x +y\leq 13$

    (3) 過點（4，1）、（1，2）的直線為 x＋3y＝7

    點（3，4）代入得 3＋12＝15$\geq$7

    故區域滿足$x + 3y\geq 7$

    由上述(1)、(2)、(3)討論可知，所求即為聯立不等式$\begin{cases}x -y\geq -1 \\ 3x +y\leq 13 \\ x +3y\geq 7\end{cases}$之解

    故選(D)'
