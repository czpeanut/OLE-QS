- id: doc_110_台南_台南二中_數學_數乙_g12s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: <u>立達</u>發現一款畫面會顯示平面坐標與一顆虛擬公正骰子的手遊，每回合遊戲坐標都是從（0，0）開始，且每回合遊戲都得搖動手機擲出骰子 6 次。當搖出的點數為 1、2、3、4 時，只有 x 坐標會增加 1；當搖出的點數為 5、6 時，只有 y 坐標會增加 1，而每回合結束後會得到一個坐標（x，y），每次搖出的點數結果互相獨立，且每次遊戲的結果也互相獨立。設隨機變數 X 代表每回合遊戲最後的 x 坐標值，隨機變數 Y 代表每回合遊戲最後的 y 坐標值，試選出正確的選項。
  options:
  - label: A
    content: 每回合結束後，坐標的總和 x＋y 一定是 6
  - label: B
    content: 每回合結束後，坐標是（2，4）與（4，2）的機率相等
  - label: C
    content: 每回合結束後，若 x 坐標和 y 坐標相等，則相等的機率為$C_{3}^{6} \left( \frac{2}{3} \right) ^{3}\left( \frac{1}{3} \right) ^{3}$
  - label: D
    content: 隨機變數 X 的期望值為 4
  - label: E
    content: 隨機變數 X 的標準差不等於隨機變數 Y 的標準差
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵每回合共 6 次

    ∴x＋y＝6

    (B)╳：坐標（2，4）表示，點數 1、2、3、4 共 2 次，點數 5、6 共 4 次

    機率值為$\left( \frac{2}{3} \right) ^{2}\times \left( \frac{1}{3} \right) ^{4}\times \frac{6!}{2!4!}$

    坐標（4，2）表示，點數 1、2、3、4 共 4 次，點數 5、6 共 2 次

    機率值為$\left( \frac{2}{3} \right) ^{4}\times \left( \frac{1}{3} \right) ^{2}\times \frac{6!}{4!2!}$

    (C)○：x 坐標和 y 坐標相等，表示點數 1、2、3、4 共 3 次，點數 5、6 共 3 次

    則其機率值為$C_{3}^{6} \left( \frac{2}{3} \right) ^{3} \left( \frac{1}{3} \right) ^{3}$

    (D)○：∵X～B$\left( 6 , \frac{2}{3} \right)$ ∴E（X）＝$6\times \frac{2}{3}$＝4

    (E)╳：承(D)，Var（X）＝$6\times \frac{2}{3}\times \frac{1}{3}$＝$\frac{4}{3}\Rightarrow$X 的標準差＝$\sqrt{\frac{4}{3}}$＝$\frac{2}{\sqrt{3}}$

    ∵Y～B$\left( 6 , \frac{1}{3} \right)$

    Var（Y）＝$6\times \frac{1}{3}\times \frac{2}{3}$＝$\frac{4}{3}\Rightarrow$Y 的標準差＝$\sqrt{\frac{4}{3}}$＝$\frac{2}{\sqrt{3}}$

    ∴兩標準差相等

    故選(A)(C)(D)'
- id: doc_110_台南_台南二中_數學_數乙_g12s2e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: '設隨機變數 X 的機率分布表如下：

    | x | 1 | 2 | 3 | 4 |

    | --- | --- | --- | --- | --- |

    | p（x） | 2k | $2k^{2}$ | $5k^{2}$ | $k^{2}$ |

    (1) k 值為＿＿＿＿。

    (2) 設 X 的期望值 E（X）＝m，X 的變異數 Var（X）＝n，則數對（m，n）＝＿＿＿＿。'
  answer:
  - (1) $\frac{1}{4}$；(2) $\left( \frac{31}{16} , \frac{271}{256} \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 2k＋$2k^{2}$＋$5k^{2}$＋$k^{2}$＝1

    $\Rightarrow8k^{2}$＋2k－1＝0$\Rightarrow$（4k－1）（2k＋1）＝0$\Rightarrow$k＝$\frac{1}{4}$或 k＝$-\frac{1}{2}$（負不合）

    ∴k 值為$\frac{1}{4}$

    (2) E（X）＝m＝$1\times \frac{1}{2}+2\times \frac{1}{8}+3\times \frac{5}{16}+4\times \frac{1}{16}$＝$\frac{31}{16}$

    E（$X^{2}$）＝$1^{2}\times \frac{1}{2}+2^{2}\times \frac{1}{8}+3^{2}\times \frac{5}{16}+4^{2}\times \frac{1}{16}$＝$\frac{77}{16}$

    $\Rightarrow$Var（X）＝n＝$\frac{77}{16}- \left( \frac{31}{16} \right) ^{2}$＝$\frac{271}{256}$

    故數對（m，n）＝$\left( \frac{31}{16} , \frac{271}{256} \right)$'
