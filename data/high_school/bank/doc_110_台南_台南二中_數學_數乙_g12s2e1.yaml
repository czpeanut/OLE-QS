  stem: '某人宣稱他的射擊失誤率為 0.25 以下，今檢定其射擊的失誤率，並列出前三個步驟如下：

    （Ⅰ） 假設「此人射擊的失誤率$p\leq 0.25$」；

    （Ⅱ） 確立檢定統計量為「射擊 6 次，射擊失誤的次數」；

    （Ⅲ） 設定顯著水準為 0.05。

