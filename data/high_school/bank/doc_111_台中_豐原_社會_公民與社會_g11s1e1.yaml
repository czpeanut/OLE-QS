  stem: 阿宏是電動機車的所有權人，他可以向誰主張其對電動機車支配的權利？
  options:
  - label: A
    content: 任何人
  - label: B
    content: 僅可向警方主張
  - label: C
    content: 僅可向竊賊主張
  - label: D
    content: 僅可向簽訂維修機車的車行主張
  group_stem: ◎阿宏日前把電動機車停在路邊卻被偷走，警方調閱監視器循線逮捕竊賊。根據調查，竊賊在偷走電動機車後連闖數個紅燈，最後自撞毀損電動機車，並將其棄置於路旁，經車行評估維修費用需要 2 萬元。竊賊除了面對刑事追究及行政處罰外，關於民事糾紛請根據《民法》所有權的特性，回答下列問題：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '所有權具有保護之絕對性，得請求一般人均不得侵害其權利，阿宏為機車所有權人，可以向任何人宣布機車為阿宏的，故(A)正確。

    41.阿宏的機車被偷走，此時阿宏可以向小偷請求返還，故選(A)。(B)所有權妨害除去是指他人雖然沒有直接占用你的不動產，但卻影響你行使所有權時，可請求除去侵害。(C)所有權妨害防止是指他人尚未有侵害行為，但在客觀判斷下，被侵害可能性極大且有必要事先防範時，可請求預防措施。(D)損害賠償為事件發生後的結果，因侵權行為使人財產、權利受到損害或減少，因此負起相關損害賠償責任。

    42.由於竊賊將車子撞壞，屬侵權行為，故(D)阿宏可以請求竊賊負擔民事損害賠償責任，若竊賊不理賠，可提起訴訟。

    43.實體店面購物不受《消費者保護法》7 日鑑賞期的拘束，故陳嘉玲買的家具，沒有 7 日猶豫期保障，故(B)正確。

    44.(A)子女無須為父母償還債務。(B)法定財產制下，妻子不須為配偶償還債務。(C)手足之間無須承擔對方的債務。(D)陳晉文需自行負擔餘款與利息。

    45.(1)(丙)陳晉文、(己)陳明玉、(庚)陳明雅，為法定繼承人；(甲)陳嘉玲與(戊)陳嘉明為遺產指定繼承人，故繼承為(甲)(丙)(戊)(己)(庚)。

    (2) A.(丙)陳晉文、(己)陳明玉、(庚)陳明雅 3 人的應繼分為 1,800 萬∕3＝600 萬。

    B.(丙)陳晉文、(己)陳明玉、(庚)陳明雅的特留分為應繼分的 1∕2，故此 3 人每人可分 600 萬 × 1∕2＝300 萬。

    C.剩下的 1,800 萬－300 萬 × 3＝900 萬依遺囑平分給兩個孫子，故(甲)陳嘉玲與(戊)陳嘉明可均分 900 萬，各得 450 萬。

    46.不論是人民或政府在做選擇時，最有效率的方式應是選擇機會成本最低的方案，故(D)正確。

    47.(A)燕巢案的行車時間雖然最短，但政府仍有其他面向的考量，不一定會採燕巢案。(B)小港潮州案除了經費過高與大量拆遷外，行車時間也最長。(C)若單以經費預算項目來看，選擇左營案的經費為 554 億，故其機會成本為最小。(D)小港案因為大量拆遷，因此面臨居民抗議與補償的可能性最高。

    48.「左營案」的外顯成本為興建費用 554 億；隱藏成本為放棄高雄案中「大高屏生活圈所帶來的經濟效益」。'
