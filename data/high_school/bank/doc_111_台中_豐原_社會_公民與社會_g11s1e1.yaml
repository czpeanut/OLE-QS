  answer_source: answer_key
  explanation: 《民法》規定，繼承人在繼承開始前二年內，若有接受財產贈與的情形，該財產視為遺產，必須用來償還被繼承人之債務，以保障債權人的權益。故阿土伯生前贈與給兒子的財產應納入遺產範圍，必須清償債務後，才可以繼承，故(C)正確。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s2_34
  section: 2
  number: 34
