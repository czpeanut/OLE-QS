  group_stem: ◎年底選舉將至，許多政治人物的學歷與研究論文一一被放大檢視，甚至被指控取得學位的博碩士論文有抄襲之嫌，有人因此中箭落馬飲恨退選，有人身陷泥淖頻頻解釋，引起政壇的紛紛擾擾。政治人物的學歷常常是媒體關注的焦點之一，依規定要取得博碩士畢業資格，皆需要將論文上傳至國家圖書館博碩士論文網站進行發表，供往後學術研究者檢索閱覽，方符合學位授予條件，若有已上傳的論文遭人檢舉抄襲，經校方相關會議認定屬實且情節嚴重，這樣的行為不僅是侵害他人的權益，更可能因此被撤銷學歷，得不償失。依據上文回答下列問題：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 抄襲論文，不是將他人的著作拿來獲利，而是把他人的著作變成自己的，這是侵害他人的(D)著作人格權。
