  stem: 大艾思與隆隆再婚時，即到法院約定為夫妻共同財產制，依照現行《民法》規範，他們的財產分配，下列敘述何者正確？
  options:
  - label: A
    content: 無論婚前或婚後取得的財產皆應平均分配
  - label: B
    content: 婚前財產不計入，所有的婚後財產皆應平均分配
  - label: C
    content: 扣除婚前財產與特有財產，其餘才平均分配
  - label: D
    content: 僅有因職業上必須要用的物品才屬於特有財產
  group_stem: '◎知名演員大艾思與設計師王小飛結婚 10 年，因為工作時常分隔兩地，感情逐漸疏遠，兩人協議離婚，因結婚時未約定財產處置方式，在律師協助下順利和平分手。大艾思因 20 年未換電話號碼，與初戀男友隆隆聯繫上，並火速再婚。下表是大艾思和王小飛的財產清冊，請根據表中資訊回答下列問題：

    |  | 知名演員大艾思 | 設計師王小飛 |

    | --- | --- | --- |

    | 婚前財產 | 100 萬 | 700 萬 |

    | 婚後財產 | 演出用 120 萬名牌禮服 | 市值 600 萬的個人工作室 |

    |  | 繼承得到的 200 萬跑車 | 薪資收入 800 萬 |

    |  | 演出收益 1,000 萬 | 股票收入 200 萬 |

    |  | 結婚購置的房屋 800 萬 | 工作用電腦 20 萬 |'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 採用共同財產制，夫妻除特有財產外，不論婚前或婚後的財產完全共有，處分時應得他方同意，債務則共同承擔。所謂特有財產指的是夫或妻的個人使用物品、職業上必需物、夫或妻的受贈物（經贈與人聲明為特有財產）。故選(A)。
