  explanation: (A)(D)實體店面購物不受《消費者保護法》 7 日鑑賞期的拘束，是依雙方契約，約定是否可以進行退換貨，因商家有說不換貨，故答案為(A)。(B)(D)實體店面沒有 7 日鑑賞期，故業者不須受理客人購買後 7 日退貨的要求。(C)即使張貼「貨物售出，不退換貨」，業者仍應負瑕疵擔保責任。
