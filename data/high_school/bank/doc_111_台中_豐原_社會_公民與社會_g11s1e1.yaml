  stem: 阿土伯認為家產傳子不傳女的觀念，在現代社會仍時有所聞，請問我國在繼承權利方面採取甚麼樣的制度，最有助於落實性別平等的原則？
  options:
  - label: A
    content: 限定繼承
  - label: B
    content: 剩餘財產差額分配
  - label: C
    content: 應繼分制度
  - label: D
    content: 特留分制度
  group_stem: ◎阿土伯育有 2 男 2 女，皆已成家立業，妻子過世後，現有債務 200 萬元，財產 400 萬元，阿土伯認為家產傳子不傳女，本想立下遺囑，後來決定先將 400 萬元合法贈予給 2 個兒子，不到一年便因病過世，僅留下 200 萬元的債務。請回答下列問題：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)限定繼承是讓繼承人有機會在三個月內向法院聲請通知債權人或受遺贈人來報明債權，然後只以被繼承人遺留下來的財產來進行清償，繼承人並不須以自己的財產進行清償，與題意無關。(B)法定財產制在婚姻解消後（指一方死亡或離婚），享有「剩餘財產差額分配請求權」，與繼承權無關。(C)應繼分制度是每個繼承人對於遺產得繼承之比率，雖然保障男女平等，但被繼承人仍可以立下遺囑，將其所有遺產不留給女性，故無法達成性別平等。(D)特留分制度是為保障法定繼承權人的權益，避免其生活陷入困境，《民法》特別訂定法定繼承人不受遺囑影響，最少可以拿到的比例，可保障被繼承人至少可以獲得一部分遺產，故正確。
