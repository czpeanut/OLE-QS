  group_stem: ◎暑假期間琳琳到愛美服飾店應徵工作，店長告訴琳琳，暑期星期三至星期日每天 12：00 至 21：00，包含 1 小時用餐。第一週是試用期，薪水每日 1,200 元（150 × 8 小時）。第二週開始正式錄用，薪水每日 1,360 元（170 × 8 小時）。琳琳認為暑假 8 週平均下來有超過基本工資時薪 158 元，便同意簽約、當日開始上班。第一天，有客人拿著三天前在店裡買的衣服，到店裡表示雖無瑕疵，但不喜歡衣服顏色，所以要退貨。琳琳想到店長有在店門口貼著：「貨物售出，不退換貨」，便拒絕客人退貨。幾度交涉後，客人揚言提告。琳琳馬上把這件事回報給店長，讓店長與客人交涉。依據上述內容，回答下列問題：
  answer:
