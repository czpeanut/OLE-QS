    | 陳李月英 | 陳嘉玲的奶奶，在嘉玲回臺南生活一段時間後安詳辭世。陳嘉玲嫁到臺北的大姑姑陳明玉，以及在臺中擔任國小老師終身未嫁的二姑姑陳明雅，皆出席母親陳李月英的喪禮。陳李月英生前立下遺囑，希望以海葬的方式辦理她的後事，並打算將她價值新臺幣 1,800 萬元的遺產平分給陳嘉玲與陳嘉明……。 |

    | 陳義生 | 陳嘉玲的爺爺，在臺南經營金德興中藥行，是一個嚴肅正經的人。在陳嘉玲北上工作期間過世。 |'
  answer:
  - D
