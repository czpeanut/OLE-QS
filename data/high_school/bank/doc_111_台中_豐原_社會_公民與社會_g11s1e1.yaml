- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 經濟問題的根源是來自於「資源有限且有多種用途」，因此人們在有限的資源下，就需要做出選擇。下列何者最能代表「資源有限」的意涵？
  options:
  - label: A
    content: 人們擁有的財富有限，因為所有的資源都要用金錢來購買
  - label: B
    content: 對於擁有財富的富豪，就不會面臨資源有限必須選擇問題
  - label: C
    content: 相對於人們無窮的慾望而言，資源的數量具有稀少有限性
  - label: D
    content: 若人們擁有的資源只能做限定的用途，仍會面臨選擇問題
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資源有限是相對於人們無窮的慾望而言，資源的數量稀少有限，故(C)正確。(A)資源雖然有限，但並不是所有的資源都要用金錢來購買。(B)富豪仍會面臨資源有限的問題。(D)若資源只能做限定的用途，則無法選擇。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 送禮是一個難題，因此有些人開始贈送能讓受贈者選擇內容的禮物，下列禮物中，受贈者能選擇的品項範圍，何者「受到的限制最大」？
  options:
  - label: A
    content: 到百貨公司即能換取等值商品的禮券
  - label: B
    content: 已儲值一千元的韓國天團客製化的悠遊卡
  - label: C
    content: 僅能在學校校慶園遊會當天使用的園遊券
  - label: D
    content: 已經結帳且今明兩天可領取的蛋糕訂購單
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 已經結帳且今明兩天可領取的蛋糕訂購單，無法退貨，受到的限制最大，故(D)為答案。(A)到百貨公司即能換取等值商品的禮券，可以選擇各種等值商品。(B)已儲值一千元的韓國天團客製的悠遊卡，可以選擇一千元以內的商品或搭乘交通工具。(C)僅能在學校校慶園遊會當天使用的園遊券，可以購買當天園遊會的商品。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 人們會衡量做選擇時的利弊得失，做出決定後，行為就會受到誘因的支配和影響。而當誘因改變時，人的行為也可能會隨之改變，下列哪些符合此種情形？(甲)阿哲喜歡喝咖啡，當茶類飲品特價時，他仍選擇買咖啡；(乙)安安成績優秀是全班第一名，他決定持續努力維持第一；(丙)小珊看到網路有便宜的團購蛋糕，她也下單買來吃看看；(丁)阿中因為政府加重酒後駕車罰則，他喝酒後決定坐捷運
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (乙)(丙)
  - label: C
    content: (丙)(丁)
  - label: D
    content: (甲)(丁)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)阿哲喜歡喝咖啡，當茶類飲品特價時，他仍選擇買咖啡，表示茶類降價，亦非誘因；(乙)安安成績優秀是全班第一名，他決定持續努力維持第一，非受外在誘因影響；(丙)小珊看到網路有便宜的團購蛋糕，她也下單買來吃看看，表示受價格誘因影響購買行為；(丁)阿中因為政府加重酒後駕車罰則，他喝酒後決定坐捷運，表示罰則為負向誘因。故答案為(C)(丙)(丁)。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '附表是某市府對購買新型低汙染機車，以及報廢舊機車換購新型低汙染機車（汰舊換新）的補助，若這兩年新購置機車的數量與品質皆相同，僅有政府補助金額改變，則今年相較於去年，對消費者行為和空氣汙染的影響為何？

    | 年份 | 新購機車補助 | 汰舊換新補助 |

    | --- | --- | --- |

    | 去年 | 10,000 兀 | 8,000 元 |

    | 今年 | 6,000 元 | 10,000 元 |'
  options:
  - label: A
    content: 更多人願意汰舊換新，但去年的政策比較能改善空汙
  - label: B
    content: 更多人願意汰舊換新，且今年的政策比較能改善空汙
  - label: C
    content: 更多人願意新購機車，且今年的政策比較能改善空汙
  - label: D
    content: 更多人願意新購機車，但去年的政策比較能改善空汙
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 今年的新購機車補助變少，故新購機車會減少，減少新的汙染；汰舊換新補助增加，故更多人願意汰舊換新，把汙染高的舊車淘汰換新車，故今年的政策較能改善空汙，(B)正確。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 高麗菜的價格曾經因為連續大雨而漲到一顆 200 元，對菜農和消費者的行為都產生了影響。假設在成本不變的情況下，高麗菜價格大漲，會造成下列哪些情形發生？
  options:
  - label: A
    content: 菜農會因為價格上漲紛紛搶種高麗菜
  - label: B
    content: 消費者怕買不到高麗菜造成搶購潮
  - label: C
    content: 菜農不會因為價格誘因改變生產行為
  - label: D
    content: 消費者減少購買其他蔬菜以減少損失
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)菜農因價格上漲，根據供給法則，會搶種增加生產數量。(B)高麗菜價格上漲，根據需求法則，消費者會減少購買量。(D)高麗菜價格上漲，消費者減少購買高麗菜，改買其他蔬菜，以減少損失。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 玲玲本來在美國唸書，因為新冠病毒肺炎疫情影響，美國學校停課，所以玲玲選擇回臺灣。但她回國依規定要居家檢疫 14 天，期間不得外出或搭乘公共運輸工具，她雖然覺得不能外出購物或娛樂很麻煩，但還是乖乖遵守，否則可能會受到處罰。她做出此選擇的理由，下列何者<u>不正確</u>？
  options:
  - label: A
    content: 遵守居家檢疫的規定的機會成本最高
  - label: B
    content: 因為 14 天期間有多種用途所以必須做選擇
  - label: C
    content: 未遵守規定而受罰的代價很高所以不能外出
  - label: D
    content: 為防止疫情擴散而犧牲的「自由」是選擇守法的機會成本
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)未遵守規定而受罰的代價很高，違反規定的機會成本大於遵守規定的機會成本，因此遵守居家檢疫的規定的機會成本並非最高。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 學者詹姆斯．布坎南曾說：「官僚不是天使」，說明政府可能受不同利益團體的影響，有時會犧牲某些人甚至是社會大眾的利益。下列何者最可能會造成這種情形發生的原因？
  options:
  - label: A
    content: 社會大眾的人數眾多，通常政府比較不會忽視他們
  - label: B
    content: 利益團體為爭取成員權益，更願採取行動影響政策
  - label: C
    content: 社會公平逐漸受到重視，政府更應該照顧少數弱勢
  - label: D
    content: 利益團體可以反映民眾的需求，故使政府更有效能
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹指出政府可能受不同利益團體的影響，有時會犧牲某些人甚至是社會大眾的利益；由此可見，利益團體為了自己團體成員的利益，對政府遊說，使政府決策符合其利益，但可能不符社會大眾的利益，故選(B)。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 下列政府針對環境問題所提出的對策，何者屬於「負向非金錢誘因」？
  options:
  - label: A
    content: 針對排放汙染物質超標的工廠處以罰鍰
  - label: B
    content: 公告違反《空氣汙染防治法》企業名單
  - label: C
    content: 推動「綠色產品」驗證機制供企業申請
  - label: D
    content: 提供消費者節能家電減徵貨物稅的優惠
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)針對排放汙染物質超標的工廠處以罰鍰，為負向的金錢誘因。(B)公告違反《空氣汙染防治法》企業名單，為負向的非金錢誘因。(C)推動「綠色產品」驗證機制供企業申請，為正向的非金錢誘因。(D)提供消費者節能家電減徵貨物稅的優惠，為正向的金錢誘因。
- id: doc_111_台中_豐原_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 橫跨臺東跟屏東的阿塱壹古道、自然風光吸引很多遊客，交通部公路總局原欲利用古道內的一段路完成環島公路的最後一段，但因其沿線擁有低海拔熱帶季風林及熱帶海洋林的豐富生態，兩地縣政府因立場不同而產生爭議，最後公路總局放棄興建。請問該段公路最後放棄興建的考量因素，應該與下列何者相同？
  options:
  - label: A
    content: 我國政府規劃能源轉型以減煤、增氣、展綠、非核之潔淨能源為發展方向
  - label: B
    content: 桃園市政府進行民調，近 7 成民意都支持鐵路地下化，政府選擇順應民意
  - label: C
    content: 因為立法委員的質詢建議，政府調整振興券的數位登記政策
  - label: D
    content: 因應新冠肺炎疫情影響，整合各部會提供紓困措施
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '由題幹可知，政府放棄開發阿塱壹古道，是基於環保考量。我國政府規劃能源轉型以減煤、增氣、展綠、非核之潔淨能源為發展方向，是基於環保考量，故(A)正確。(B)桃園市政府進行民調，近 7 成民意都支持鐵路地下化，政府選擇順應民意，是基於民意考量。(C)因為立法委員的質詢建議，政府調整振興券的數位登記政策，是基於民意考量。(D)因應新冠肺炎疫情影響，整合各部會提供紓困措施，是基於公平考量。

    10.36 億元預算推動「擴大秋冬國民旅遊獎勵計畫」為正向的金錢誘因。(A)政府提高補助，促使民眾改搭大眾運輸或購買電動車，為正向的金錢誘因，故正確。(B)颱風過後葉菜類價格上漲，民眾減少葉菜需求，為負向的金錢誘因。(C)我國修法加重酒駕肇事刑責，導致民眾酒駕情況減少，為負向的非金錢誘因。(D)嚴重特殊傳染性肺炎疫情加劇，政府以社群平臺宣傳防疫步驟，為正向的非金錢誘因。

    11.(A)(B)(C)為非金錢誘因。(D)提供偏遠地區民眾至投票所之車資補助，為金錢誘因，故正確。

    12.公共計畫例如興建快速道路要考量成本效益分析，才能避免政府無效率，故(B)正確。(A)不論政府或個人，都應選擇機會成本最小。(C)肉桶立法是指國會議員在法案上附加對自己的支持者或親信有利的附加條款，從而使他們受益的手段，不應作為施政的原則。(D)政府政策會受到利益團體的遊說而影響施政。

    13.她選擇工作的隱含成本是大學生活和大學文憑，(D)正確。(A)外顯成本＝5 萬元 × 4（年）＝20 萬。(B)隱藏成本為 3 萬 × 12（月） × 4（年）＝144 萬。(C)機會成本＝20 萬＋144 萬＝164 萬。

    14.資本利得稅（Capital Gains Tax），是指對利用資本交易「低買高賣」獲取的所得課稅，而向人民課徵資本利得稅，可以縮小貧富差距，故選(C)。

    15.動產交易以交付為原則，故賣家把車交給阿民，車子的所有權即屬阿民；至於阿龍雖然簽約早，但阿龍只能以契約未履行要求賣家還錢，並不能向阿民要求取得車子，故選(D)。

    16.元元在她的直播節目中，朗讀了一段知名作家的文章，可能侵害作家著作權，故(B)正確。(A)小咪在直播節目中唱完整首周杰倫的歌曲，可能涉及侵害周董的著作權。(C)通神在遊戲直播中，一邊解說遊戲技巧同時進行遊戲，侵犯遊戲公司的著作權。(D)阿吉以超連結方式提供粉絲自己的直播，因為未使用他人的著作，故未侵害著作權。

    17.賭博是違反法律的行為，因此賭博所生的債權債務關係沒有《民法》上請求權，故選(A)。(B)爸爸決定將名下的空屋，出租給需要的人，以賺取租金、(C)某公司與新進員工簽訂的工資，高於《勞動基準法》、(D)大華以 8,000 元買下阿明的舊手機，並約定要當面付款，三者均符合私法自治的原則。

    18.法定財產制下，丈夫在婚前購入的汽車，屬於其個人財產，婚後想要出售不需經妻子的同意，故(B)正確。(A)法定財產制不用登記。(C)(D)依據法定財產制，夫妻婚前財產各自所有，婚後財產也是各自所有。

    19.(A)被繼承人沒寫遺囑時，應依法律規定的繼承順位和比例，故媽媽的決定不合法。(B)(D)收養等同婚生，因此妹妹（為第一順位）可以主張繼承權，故(D)正確。(C)若有留下全部遺產給哥哥的遺囑，則妹妹可以請求特留分。

    20.動產交易以交付為原則，阿志雖然已付錢，但小祺未交付筆電之前，筆電的所有權仍屬於小祺，仍可以如常使用該筆電，故選(B)。(A)若小祺後來決定將該筆電送給子見，阿志不可以向子見要回該筆電，只能請求小祺返還已付的金錢。(C)如果小祺未依契約將筆電交給阿志，則阿志不可逕自取走該筆電，必須透過法律途徑請求交付筆電。(D)若小祺尚未將筆電交給阿志，阿志只能向本人請求交付筆電。

    21.(A)小雯雖非正式員工，仍受《勞動基準法》保障。(B)勞動契約受《勞動基準法》保障規範，故法規可介入小雯和賣場間的勞動爭議。(C)《勞動基準法》限制契約自由，故時薪不可低於基本工資。(D)若小雯與經理簽訂情人條款，違反公序良俗，在法律上屬於無效的契約。

    22.(A)(B)拋棄繼承，是讓繼承人有機會藉著拋棄繼承人身分，而拋棄被繼承人所有的權利與義務，但須在知悉得繼承之時起三個月內向法院為拋棄繼承之聲明，故(A)正確。(C)(D)限定繼承，是讓繼承人有機會在三個月內向法院聲請通知債權人或受遺贈人來報明債權，然後只以被繼承人遺留下來的財產來進行清償，繼承人並不須以自己的財產進行清償。

    23.法定繼承人為配偶與子女共 5 人，應繼分是 5 人均分＝160 萬∕5＝32 萬元，故(A)正確。'
