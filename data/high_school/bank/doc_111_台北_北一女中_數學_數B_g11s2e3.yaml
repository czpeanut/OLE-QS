- id: doc_111_台北_北一女中_數學_數B_g11s2e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 設 A、B、C 皆為二階方陣，I 為二階單位矩陣，O 為二階零矩陣，則下列哪些敘述正確？
  options:
  - label: A
    content: 若 A＋B＝A＋C，則 B＝C
  - label: B
    content: 若 A≠O，且 AB＝AC，則 B＝C
  - label: C
    content: 若 AB＝BA，則 A＝I 或 B＝I
  - label: D
    content: 若 A、B 的乘法反方陣皆存在，則（AB）$^{－1}$＝$A^{－1}B^{－1}$
  - label: E
    content: （$A^{2}$）$^{－1}$＝（$A^{－1}$）$^{2}$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：A＋B＝A＋C

    ⇒ A＋B＋（－A）＝A＋C＋（－A）

    ⇒ B＝C

    (B)╳：反例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，B＝$\left[ \begin{matrix}2 & 0 \\ 0 & 0\end{matrix} \right]$，C＝$\left[ \begin{matrix}2 & 0 \\ 1 & 0\end{matrix} \right]$

    ⇒ AB＝AC＝$\left[ \begin{matrix}2 & 0 \\ 0 & 0\end{matrix} \right]$，但 B≠C

    (C)╳：反例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，B＝$\left[ \begin{matrix}2 & 0 \\ 0 & 0\end{matrix} \right]$⇒ AB＝BA＝$\left[ \begin{matrix}2 & 0 \\ 0 & 0\end{matrix} \right]$

    但 A≠I 且 B≠I

    (D)╳：$B^{－1}A^{－1}$AB＝$B^{－1}$IB＝$B^{－1}$B＝I，得（AB）$^{－1}$＝$B^{－1}A^{－1}$

    (E)○：$A^{－1}A^{－1}$AA＝I ⇒（$A^{－1}$）$^{2}A^{2}$＝I ⇒（$A^{－1}$）$^{2}$＝（$A^{2}$）$^{－1}$

    故選(A)(E)'
