  stem: 設 a，b，c，d 為實數，且$\left[ \begin{matrix}0 & 1 \\ 1 & -2\end{matrix} \right] \left[ \begin{matrix}2 & 1 \\ 1 & 0\end{matrix} \right] \left[ \begin{matrix}0 & 1 \\ 1 & 0\end{matrix} \right] \left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$＝$\left[ \begin{matrix}4 & -3 \\ -6 & 4\end{matrix} \right]$，試問 a－2d 的值為下列何者？
  options:
  - label: A
    content: －1
  - label: B
    content: '0'
  - label: C
    content: '1'
  - label: D
    content: '2'
  - label: E
    content: '3'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left[ \begin{matrix}0 & 1 \\ 1 & -2\end{matrix} \right] \left[ \begin{matrix}2 & 1 \\ 1 & 0\end{matrix} \right] \left[ \begin{matrix}0 & 1 \\ 1 & 0\end{matrix} \right] \left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$＝$\left[ \begin{matrix}4 & -3 \\ -6 & 4\end{matrix} \right]$

    ⇒$\left[ \begin{matrix}0 & 1 \\ 1 & -2\end{matrix} \right] \left[ \begin{matrix}2 & 1 \\ 1 & 0\end{matrix} \right] \left[ \begin{matrix}c & d \\ a & b\end{matrix} \right]$＝$\left[ \begin{matrix}4 & -3 \\ -6 & 4\end{matrix} \right]$⇒$\left[ \begin{matrix}0 & 1 \\ 1 & -2\end{matrix} \right] \left[ \begin{matrix}2c +a & 2d +b \\ c & d\end{matrix} \right]$＝$\left[ \begin{matrix}4 & -3 \\ -6 & 4\end{matrix} \right]$

    ⇒$\left[ \begin{matrix}c & d \\ a & b\end{matrix} \right]$＝$\left[ \begin{matrix}4 & -3 \\ -6 & 4\end{matrix} \right]$

    得 a＝－6，b＝4，c＝4，d＝－3

    則 a－2d＝0

    故選(B)'
