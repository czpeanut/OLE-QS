    又 $A^{4}$＝$A^{2}A^{2}$＝$\left[ \begin{matrix}4 & -5 \\ 1 & -1\end{matrix} \right] \left[ \begin{matrix}4 & -5 \\ 1 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}11 & -15 \\ 3 & -4\end{matrix} \right]$

    ⇒（$A^{4}$）$^{－1}$＝$\frac{1}{11\times (-4 ) -3\times (-15 )}\left[ \begin{matrix}-4 & 15 \\ -3 & 11\end{matrix} \right]$＝$\left[ \begin{matrix}-4 & 15 \\ -3 & 11\end{matrix} \right]$

    故 A＝$A^{5}$（$A^{4}$）$^{－1}$＝$\left[ \begin{matrix}-18 & 25 \\ -5 & 7\end{matrix} \right] \left[ \begin{matrix}-4 & 15 \\ -3 & 11\end{matrix} \right]$＝$\left[ \begin{matrix}-3 & 5 \\ -1 & 2\end{matrix} \right]$'
