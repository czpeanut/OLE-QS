  type: single
  page: 1
  stem: 小英想將一長寬比為 1.4 的矩形圖片調整成黃金矩形，試問下列哪一個的操作會使得此矩形的長寬比最接近黃金比例$\frac{1 +\sqrt{5}}{2}$？（已知$\sqrt{5}\approx$2.236）
  options:
  - label: A
    content: 將矩形的長增加 0.2 公分
  - label: B
    content: 將矩形的寬減少 2 公分
  - label: C
    content: 將矩形的長增為原來 1.15 倍
  - label: D
    content: 將矩形的長增為原來 1.6 倍
  - label: E
    content: 將矩形的對角線增為原來 1.2 倍
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '令長為 1.4x，寬為 x，且$\frac{1 +\sqrt{5}}{2}\approx$1.618

    (A)╳：若 x 愈大，則$\frac{1.4x + 0.2}{x}$愈接近 1.4

    (B)╳：若 x 愈大，則$\frac{1.4x}{x - 2}$愈接近 1.4

    (C)○：$\frac{1.4x\times 1.15}{x}$＝1.61

    (D)╳：$\frac{1.4x\times 1.6}{x}$＝2.24

    (E)╳：對角線增長，長寬比不變

    故選(C)'
