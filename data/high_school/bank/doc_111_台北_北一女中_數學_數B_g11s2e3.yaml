  stem: 實驗室培養兩種菌，〈$a_{n}$〉，〈$b_{n}$〉分別代表兩種培養菌在時間點 n 的數量，彼此有如下的關係：$a_{n＋1}$＝$\frac{3}{4}a_{n}$＋$\frac{1}{2}b_{n}$，$b_{n＋1}$＝$\frac{1}{4}a_{n}$＋$\frac{1}{2}b_{n}$（n＝0，1，2，……），若想維持這兩種菌在任意時間點的比例固定，則$\frac{a_{1}}{b_{1}}$值為＿＿＿＿。
  answer:
  - '2'
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$\begin{cases}a_{n + 1}=\frac{3}{4}a_{n}+\frac{1}{2}b_{n} \\ b_{n + 1}=\frac{1}{4}a_{n}+\frac{1}{2}b_{n}\end{cases}$

    又比例固定，令$\frac{a_{n}}{b_{n}}$＝$\frac{a_{n + 1}}{b_{n + 1}}$＝$\frac{a_{1}}{b_{1}}$＝k，且 $a_{n}$、$b_{n}$ 均為正數，則 k＞0

    （若 $a_{n}$＝0，$b_{n}$≠0，則比例不固定）

    ⇒ $a_{n＋1}$＝$kb_{n＋1}$，$a_{n}$＝$kb_{n}$

    ∴$\begin{cases}kb_{n + 1}=\frac{3}{4}kb_{n}+\frac{1}{2}b_{n}\cdots \cdots \cdots \cdots \cdots ① \\ b_{n + 1}=\frac{1}{4}kb_{n}+\frac{1}{2}b_{n}\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由$\frac{①}{②}$得 k＝$\frac{\frac{3}{4}k+\frac{1}{2}}{\frac{1}{4}k+\frac{1}{2}}$

    ⇒$\frac{1}{4}k^{2}$＋$\frac{1}{2}$k＝$\frac{3}{4}$k＋$\frac{1}{2}$

    ⇒ $k^{2}$－k－2＝0 ⇒ k＝2 或－1（不合）

    故$\frac{a_{1}}{b_{1}}$＝2'
