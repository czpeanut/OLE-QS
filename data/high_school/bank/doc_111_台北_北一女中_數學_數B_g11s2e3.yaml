  stem: 已知費氏數列〈$a_{n}$〉滿足遞迴式 $a_{1}$＝1，$a_{2}$＝1，$a_{n}$＝$a_{n－1}$＋$a_{n－2}$（n＞2），則下列哪些敘述正確？
  options:
  - label: A
    content: $a_{4}$＝5
  - label: B
    content: $a_{111}$＜$a_{112}$
  - label: C
    content: $\frac{a_{4}}{a_{3}}$＜$\frac{a_{5}}{a_{4}}$
  - label: D
    content: $\frac{a_{110}}{a_{111}}$＋1＝$\frac{a_{112}}{a_{111}}$
  - label: E
    content: $\frac{a_{2023}}{a_{2022}}$＝$\frac{1 +\sqrt{5}}{2}$
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$a_{3}$＝$a_{2}$＋$a_{1}$＝1＋1＝2，$a_{4}$＝$a_{3}$＋$a_{2}$＝2＋1＝3

    (B)○：∵對所有正整數 n，$a_{n}$ 均為正數，又 $a_{112}$＝$a_{111}$＋$a_{110}$

    ∴$a_{111}$＜$a_{112}$

    (C)○：承(A)，$a_{5}$＝$a_{4}$＋$a_{3}$＝3＋2＝5 ⇒$\frac{a_{4}}{a_{3}}$＝$\frac{3}{2}$＜$\frac{a_{5}}{a_{4}}$＝$\frac{5}{3}$

    (D)○：∵$a_{112}$＝$a_{111}$＋$a_{110}$（兩邊同除以 $a_{111}$）

    ⇒$\frac{a_{112}}{a_{111}}$＝1＋$\frac{a_{110}}{a_{111}}$

    (E)╳：$a_{2022}$，$a_{2023}$ 均為正整數 ⇒$\frac{a_{2023}}{a_{2022}}$為有理數

    故選(B)(C)(D)'
