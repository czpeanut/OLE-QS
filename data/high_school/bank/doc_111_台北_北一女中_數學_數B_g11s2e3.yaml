  explanation: '$\left[ \begin{matrix}t & 1 \\ 3 -t & t + 1\end{matrix} \right] \left[ \begin{matrix}x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}a \\ b\end{matrix} \right]$⇒$\begin{cases}tx +y =a \\ ( 3 - t )x + ( t + 1 )y =b\end{cases}$

    (A)○：當 t（t＋1）－1×（3－t）≠0 時，x，y 有唯一解

    (B)╳：若 x，y 有無限多解

    則 t（t＋1）－1×（3－t）＝0 ⇒ $t^{2}$＋2t－3＝0 ⇒ t＝－3 或 1

    ∴t 也可能為－3

    (C)○：當 t＝1，a＝1，b＝3 時，方程式為$\begin{cases}x +y = 1 \\ 2x +2y = 3\end{cases}$無解

    (D)╳：t＝－3 時，可能為無解或無限多解

    (E)○

    故選(A)(C)(E)'
