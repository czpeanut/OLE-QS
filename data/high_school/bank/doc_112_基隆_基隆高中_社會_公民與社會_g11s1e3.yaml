  stem: 2013 年，馬杜洛（Nicolás Maduro）就任委內瑞拉的總統，在其主導的政策下，委內瑞拉街上到處可以看到排隊購物的人潮，另有不少人在國內大量採購糖、牛奶、衛生紙等民生物資，再銷往鄰國。此外，當地的黑市交易也愈來愈盛行。單從前文來判斷，馬杜洛主導的政策最可能包含下列何者？
  options:
  - label: A
    content: 對產品實施價格上限
  - label: B
    content: 限制產品的最低價格
  - label: C
    content: 政府出資增加產品供給
  - label: D
    content: 禁止廠商聯合漲價交易
  answer:
