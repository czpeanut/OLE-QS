- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 如果貿易前香蕉每公斤之價格，甲國為 15 元，乙國為 19 元。兩國進行自由貿易後，香蕉之國際價格為何？
  options:
  - label: A
    content: 每公斤低於 15 元
  - label: B
    content: 每公斤 15 元
  - label: C
    content: 每公斤價格介於 15 元與 19 元之間
  - label: D
    content: 每公斤高於 19 元
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 兩國進行自由貿易，因為出口國出口產品，將會導致國內價格上升，而進口國進口產品，將會導致國內價格下降，而最終在自由貿易之下，國際貿易價格將會位於兩國貿易前國內價格之間。故本題選(C)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在勞動市場，工資的均衡點是由市場勞動供給及需求而決定。但因為有許多雇主剝削勞工，使得勞動市場均衡價格惡化，故「最低工資」政策是政府管制價格的一種形式，利用法律禁止雇主給付的工資不得低於某個價格。但因應較高的最低工資，會有較少的雇主願意提供工作給無技能或低技能的勞工類型。故有些證據顯示，當最低工資提高 10 ％，會導致低階工人的失業率增加 1 ～ 2 ％。對此，有學者認為最低工資的政策是雙面刃，應思考其他替代方案。勞動均衡市場因為雇主的剝削行為使勞動價格惡化，請問基本工資的設定是政府介入的哪一種手段？
  options:
  - label: A
    content: 直接管制價格
  - label: B
    content: 資訊公開
  - label: C
    content: 數量管制
  - label: D
    content: 課徵皮古稅
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 最低基本工資的設定，是由政府直接進行價格管制，屬於「價格下限」的價格管制。故本題選(A)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: GDP 可以用來作為衡量一國人民經濟福祉的指標之一。請問何者是 GDP 所能夠呈現的？
  options:
  - label: A
    content: 所得分配的情況
  - label: B
    content: 汙染與公害
  - label: C
    content: 家務勞動的價值
  - label: D
    content: 農人留供自用的農產品
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: GDP 原則上有經過市場交易的部分才會計入，因此農家自產自用的農產品量大又容易計算，也會計入 GDP。故本題選(D)。(A) GDP 為一個總值，無法呈現所得分配情況。(B)汙染與公害並非是產品，不計入 GDP。(C)家務勞動未經由市場交易，不會計入 GDP。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 嘉樂爾國的 GDP 為 100 億美元，民間消費支出、政府消費支出、投資支出及進口額分別為 25 億、20 億、10 億及 5 億美元，試求其「出口額」數字為何？
  options:
  - label: A
    content: 20 億美元
  - label: B
    content: 30 億美元
  - label: C
    content: 50 億美元
  - label: D
    content: 60 億美元
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: GDP＝C＋I＋G＋（X－M），由題文可知 100＝25＋10＋20＋（X－5），可知 X＝50，故本題為(C)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列關於 GDP 計算項目的說明，何者正確？
  options:
  - label: A
    content: 古董公仔買賣屬於市場交易，須計入
  - label: B
    content: 美甲服務非實體商品，因此不予計入
  - label: C
    content: 只計入最終產品，不另計中間產品的價值
  - label: D
    content: 今年賣出的去年存貨計入今年的 GDP
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)二手商品不會計入 GDP。(B)勞務也會計入 GDP。(D)會計入生產當時的 GDP，因此會計入去年的 GDP。故本題選(C)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '帕迪亞國的 2021 年國民所得相關資料如下（單位：億元）。請問帕迪亞國 2021 年的 GDP 為多少億元？

    | 政府消費支出 | 政府投資支出 | 社會安全支出 | 出口 | 進口 | 民間消費支出 | 民間投資支出 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 40 | 5 | 5 | 30 | 15 | 45 | 15 |'
  options:
  - label: A
    content: '150'
  - label: B
    content: '120'
  - label: C
    content: '115'
  - label: D
    content: '110'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: GDP＝C＋I＋G＋（X－M），由題文可知，GDP＝45＋（5＋15）＋40＋（30－15）＝120。故本題選(B)。其中社會安全支出並非是購買最終財貨與勞務，屬於移轉性支出不列入 GDP。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 與自由貿易相反的政策是貿易保護主義，具體做法是設置貿易障礙，何者「不屬於」貿易障礙？
  options:
  - label: A
    content: 對進口農產品實施檢疫
  - label: B
    content: 對進口品課徵進口關稅
  - label: C
    content: 提供國內廠商出口補貼
  - label: D
    content: 制定進口車的進口配額
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 貿易障礙是為了保護國內產業，對於進口商品有一些限制，因此(A)實施檢疫是為了維護國內農產品的安全，並非是為了保護國內產品而實施的貿易障礙。(B)課徵進口關稅、(C)國內廠商出口補貼與(D)進口配額，均屬於貿易障礙。故本題選(A)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 在貿易的談判桌上，大國通常擁有較多的談判籌碼，小國往往不是對手；不過，對於 WTO 的會員而言，即使是小國，也能享受大國之間談判貿易開放的成果。請問這是因為 WTO 遵循何種原則？
  options:
  - label: A
    content: 最惠國待遇原則
  - label: B
    content: 漸進開放原則
  - label: C
    content: 反傾銷原則
  - label: D
    content: 國民待遇原則
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到，在 WTO 當中，小國也可以享有大國之間談判貿易開放的成果，可知此為(A)最惠國待遇原則。(B)漸進開放原則指國家可以逐步調降關稅，而不是一口氣直接全面開放。(C)反傾銷是針對出口國補貼該國產品，對進口國形成不公平貿易的情形。(D)國民待遇原則指國外產品進口後，享有與本國產品相同的待遇。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 請問下列與國際貿易相關的說明，何者正確？
  options:
  - label: A
    content: 對一國而言，進口花錢、出口賺錢，因此進口有害、出口有利
  - label: B
    content: 當一國的產品國內價格高於國際價格時，該國會出口產品獲利
  - label: C
    content: 國際分工貿易根據比較利益，由機會成本較高者出口產品
  - label: D
    content: 參與國際貿易則有人獲利、有人受害，但整體經濟福祉會提高
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國際貿易對進出口國皆有利，只是進口國有利消費者，出口國有利生產者。(B)應當是進口國外較為廉價的產品。(C)應當是機會成本較低者。(D)正解。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 我國對「聯合行為」有明確的定義範圍，且有相關的法源依據與罰則，確保不會侵害消費者之權益。請問下列有關「聯合行為」的各選項，何者描述正確？
  options:
  - label: A
    content: 我國規範聯合行為的主管機關為行政院公平交易委員會
  - label: B
    content: 聯合行為指事業體之間的合併行為
  - label: C
    content: 與其他事業合併使市場占有率達五分之一者須先報備
  - label: D
    content: 若聯合行為違法，可能只須負刑事責任
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)非合併行為，合併行為是《公平交易法》中的「結合」行為。(C)題文在問聯合行為，但本選項在談結合行為。(D)聯合行為負擔行政責任，處以罰鍰。故本題選(A)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 2014 年，南韓決定開放大米市場，引發國內農業團體反彈。假設附圖代表南韓的大米市場，其中 S 是供給，D 是需求，$P_{i}$ 代表國際價格，且國際供給能滿足南韓所需的任何數量。請問當南韓開放進口後，會對南韓的大米市場產生何種影響？
  options:
  - label: A
    content: 將進口 $Q_{S}$ 單位的大米
  - label: B
    content: 生產者剩餘剩下 C
  - label: C
    content: 消費者剩餘增加 B
  - label: D
    content: 國內經濟福祉減少
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3/s1_11_f1.png
    crop:
      page: 2
      rect:
      - 257.4
      - 195.8
      - 426.7
      - 341.1
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到南韓開放國內市場，進口大米。可知南韓的大米價格將會由 $P_{n}$ 下降至 $P_{i}$，此時的消費者剩餘為 ABF，而生產者剩餘則剩下 C，因此(A)價格下降至 $P_{i}$，將產生 $Q_{d}$－$Q_{s}$ 數量的超額需求，因此將進口 $Q_{d}$－$Q_{s}$ 數量的大米。(C)消費者剩餘增加 B、F。(D)國內經濟福祉增加 Ｆ。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下圖是自由貿易區內的甲、乙兩國汽車市場的供需變化情形。甲國原本的汽車價格為 $P_{A}$，乙國原本的汽車價格為 $P_{B}$，當關稅一致（$P^{＊}$）的情形下，甲、乙兩國的汽車進出口市場為何？
  options:
  - label: A
    content: 甲國要出口汽車，乙國要進口汽車
  - label: B
    content: 甲國要進口汽車，乙國要出口汽車
  - label: C
    content: 甲國消費者有利
  - label: D
    content: 乙國消費者不利
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3/s1_12_f1.png
    crop:
      page: 2
      rect:
      - 159.35
      - 435.0
      - 524.75
      - 597.6
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 兩國進行國際貿易，其中貿易前國內均衡價格較低的國家，將會成為出口國，而貿易前國內均衡價格較高的國家，則會成為進口國。可知甲國為出口國、乙國為進口國。因此(A)正解。(B)甲國要出口汽車，乙國要進口汽車。(C)甲國為出口國，應當是對生產者有利。(D)乙國為進口國，對消費者有利。故本題選(A)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 某國經濟部長進行施政報告，強調國內生產毛額（GDP）連續成長，國民平均所得上升，勞動參與率持續提升，失業率創新低等數據，藉以顯示施政成效卓著。同一時間，該國某民間倡議組織也公布兩項統計數據加以批評：該國生育率持續下降，而女性在婚後退出勞動市場以承擔家庭照顧工作的比例正逐年攀升。請問上述數據顯示女性對 GDP 之貢獻程度並未妥當呈現出來，其理由是 GDP 在計算時「並未包含」下列何者？
  options:
  - label: A
    content: 生活品質之變動
  - label: B
    content: 外部成本與效益
  - label: C
    content: 非市場交易之產出
  - label: D
    content: 地下經濟
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到，女性常因為婚後照顧家庭，而離開職場，因此 GDP 沒辦法將女性的貢獻呈現出來。可知主要因素為家務勞動屬於非市場交易之產出，因此本題選(C)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_14
