  stem: 克洛洛國是一個以出口為導向的國家，哪一種經濟現象是促使該國將生產的商品出口到國外銷售的主因？
  options:
  - label: A
    content: 該國商品供給的數量低於該國消費的數量
  - label: B
    content: 該國消費者搶購該項商品
  - label: C
    content: 該國商品的價格低於國際市場的價格
  - label: D
    content: 該國政府針對國內生產商品課徵重稅
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 一個國家成為出口國，主要是因為國內商品價格遠低於其他國家，因此會希望出口而獲得更多利潤。故本題選(C)。(A)雖然還沒有貿易，但也應該是達到市場均衡。(B)(D)此非是出口的主因，主要是價格因素。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_36
  section: 1
  number: 36
  type: single
