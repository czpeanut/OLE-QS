  stem: 為刺激景氣提振經濟，政府推出低利貸款鼓勵民間消費與廠商投資，而政府本身也積極投入公共建設與都市更新。請問下列因低利貸款與政府措施而帶動之經濟活動，對國內生產毛額（GDP）影響的敘述何者最為正確？
