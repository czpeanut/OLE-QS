- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 對外國貨品在本國海關課徵的稅，稱為什麼稅？
  options:
  - label: A
    content: 關稅
  - label: B
    content: 貨物稅
  - label: C
    content: 營業稅
  - label: D
    content: 出口稅
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)對外國物品在本國海關課的稅稱之為關稅。(B)貨物稅，產製或自國外進口屬貨物稅條例規定之貨物，於貨物出廠或進口時所徵收的稅款，稱為貨物稅。(C)營業稅：對營業人銷售貨或勞務行為所課徵之一種銷售稅。(D)出口稅：出口商品在出口國家時需要支付的稅。故本題選(A)。
- id: doc_112_基隆_基隆高中_社會_公民與社會_g11s1e3_s1_16
  section: 1
  number: 16
  type: single
