  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到該國產生黑市交易，民生必需品排隊購買，可知產生了供不應求的情形。因此(A)價格上限為壓低市場價格，會導致供不應求，與此情形相符。(B)限制產品的最低價格，指設定價格下限，將會產生供過於求的現象。(C)增加產品供給，應當不會大排長龍購買民生必需品。(D)禁止廠商聯合漲價交易，為禁止聯合行為，應當也不會造成大排長龍購買民生必需品。故本題選(A)。
