  stem: 兩個國家若簽署「自由貿易區」協定，請問最可能發生下列何種情況？
  options:
  - label: A
    content: 兩國之間同額相互投資
  - label: B
    content: 兩國之間勞動力自由流動
  - label: C
    content: 兩國之間使用相同的貨幣
  - label: D
    content: 兩國之間取消彼此的關稅
  answer:
  - D
