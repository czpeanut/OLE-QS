  stem: 假設澳洲與奧地利之間出現下列情形，請問何者「違反」WTO 的國民待遇原則？
  options:
  - label: A
    content: 奧地利規定本土食品須標示成分，進口食品則還須標示反式脂肪含量
  - label: B
    content: 澳洲規定境內的奧地利國民不得任職於國防相關的高度敏感性產業
  - label: C
    content: 奧地利對澳洲農產品課徵關稅，澳洲對奧地利農產品卻沒有課徵關稅
  - label: D
    content: 奧地利產品輸入澳洲必須繳交關稅，但澳洲本土產品卻不用繳交關稅
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 國民待遇原則指當國外產品進口後，其要求、標準等待遇，都應與國內產品相同。因此(A)奧地利針對國外產品的標示要求較多，違反國民待遇原則。(B)此為澳洲保護國防機密的方法，與國民待遇原則無關。(C)此為兩國貿易給予的關稅優惠不同，與國民待遇原則無關。(D)關稅本來就是對於進口商品課徵的稅，國內產品當然不會被本國課徵關稅。故本題選(A)。
