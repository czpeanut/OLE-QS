  explanation: 經濟成長率的提升指的是實質 GDP 的上升，因此(A)環境破壞與公害不列入 GDP。(B) GDP 為一個總值，無法顯示所得分配是否平均。(C) GDP 為市場價值總和，無法顯示生產技術與品質。故本題選(D)。
