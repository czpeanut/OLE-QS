  stem: 經濟全球化是指經濟活動超越國界，通過產品、資金、人員和資訊的跨國移動，其中最明顯的表徵是國際貿易，下列敘述何者是國際貿易產生的原因？
  options:
  - label: A
    content: 各國供需均衡價格的差異引起的套利動機
  - label: B
    content: 生產過剩的廠商將產品銷售到價格較低的國家
  - label: C
    content: 政府為了穩定國內物價而出口本國較短缺的產品
  - label: D
    content: 參與國際貿易可以為國人增加就業的機會
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 國際貿易主要是因為出口國國內商品價格遠低於其他國家，因此會希望出口而獲得更多利潤，而進口國則因為國內價格較高，希望進口廉價的產品。故本題選(A)。(B)雖未國際貿易，但國內同樣是達到均衡，並沒有過剩的問題。(C)非國際貿易主因。(D)參加國際貿易不一定會為國人增加就業機會，例如進口國集會受到外來產品的衝擊，可能造成該產業就業機會減少。
