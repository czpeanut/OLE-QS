  answer_status: verified
  answer_source: answer_key
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 小新最近考試壓力太大，常常感到胃不舒服，醫生開給他的處方箋中有制酸劑，主要成分為Mg(OH)$_{2}$，藥量是1錠。當他複診時，仍感到不舒服，於是醫生增加制酸劑的藥量，改為2錠。下列有關制酸劑的敍述何者正確？
  options:
  - label: A
    content: 制酸劑在飯前吃效果較佳，是因為胃酸會增加Mg(OH)$_{2}$的溶解度
  - label: B
    content: 吃2錠制酸劑效果較好，是因為Mg(OH)$_{2}$的$K_{sp}$增加
  - label: C
    content: 如果吃2錠制酸劑後仍感到不舒服，小新可以自行增加制酸劑的藥量
  - label: D
    content: 此制酸劑為長效型，是因為Mg(OH)$_{2}$為易溶鹽類
  - label: E
    content: 吃入制酸劑後，Mg(OH)$_{2}$為限量試劑，可以完全中和胃酸，緩解身體不適的現象
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B) $K_{sp}$只隨溫度而變；(C)劑量須經醫師指示方可增加；(D)為難溶鹽類；(E)只能將pH值稍微提生，若完全中和會對身體有很大的傷害。故選(A)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 鋇劑為白色稠狀懸浮溶液，能夠暫時附著在結腸內壁上。「鋇劑X光攝影術」可幫助醫師來評估腸道是否存在有腫瘤，其基本原理乃是利用鋇具有較大原子量，可吸收較多X光使其難以穿透，如此便能在X光片上得到更清楚的顯影。但從鋇劑所溶出的很少量鋇離子卻是有毒的，因此藉由加入過量的硫酸鈉，與可溶的氯化鋇發生化學反應以配置鋇劑，如此製得的白色稠狀懸浮液便可有效減少其中所含的鋇離子濃度。試推測所謂「鋇劑」的主成分應為何？
  options:
  - label: A
    content: 氯化鈉
  - label: B
    content: 氯化鋇
  - label: C
    content: 硫酸鈉
  - label: D
    content: 硫酸鋇
  - label: E
    content: 鋇離子
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 鋇劑為混濁物，故應該為(D)硫酸鋇沉澱物。故選(D)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s2_25
  section: 2
  number: 25
  type: multiple
  page: 3
  stem: 下列有關電解質的敘述，哪些正確？（應選二項）
  options:
  - label: A
    content: 凡化合物的水溶液能導電者，該化合物即稱為電解質
  - label: B
    content: 熔融態的電解質一定可以導電
  - label: C
    content: 電解質不一定是離子化合物
  - label: D
    content: 電解質的水溶液中，陰、陽離子的個數一定相等
  - label: E
    content: 固態的氯化鈉不能導電，故氯化鈉為非電解質
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (B)不一定，分子化合物就不行；(D)不一定，例如$CaCl_{2}$中$Cl^{-}$的數量即為$Ca^{2+}$數量的兩倍；(E)錯誤，氯化鈉為離子化合物，為電解質。故選(A)(C)。
