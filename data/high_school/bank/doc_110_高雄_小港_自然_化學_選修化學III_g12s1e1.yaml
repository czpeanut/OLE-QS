  stem: 鈣離子與草酸根離子會形成難溶性鹽類，故誤食草酸的濃度大於一定值時，與血液中的鈣離子就會因為草酸鈣（$CaC_{2}O_{4}$）沉澱而可能有中毒症狀。現假設血液中鈣離子的濃度約為0.0125 M，則誤食草酸之濃度大於多少M時，就會產生草酸鈣沉澱？（草酸鈣的$K_{sp}$＝2.25×$10^{–9}$）
