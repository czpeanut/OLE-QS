questions:
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關可逆反應的特性，下列敘述何者正確？
  options:
  - label: A
    content: 可逆反應最終反應物會全部耗盡
  - label: B
    content: 可逆反應與不可逆反應的化學反應式皆可用雙箭號「⇌」表示
  - label: C
    content: 可逆反應只出現在化學反應中，沒有物理反應
  - label: D
    content: 所有化學反應皆為可逆反應
  - label: E
    content: 可逆反應的逆反應活化能較不可逆反應的逆反應活化能低
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)可逆反應達平衡時，反應物、產物同時存在；(B)僅可逆反應可以，不可逆反應應以「→」表示；(C)蒸發、凝結即為液體與氣體間的可逆反應；(D)錯誤，CO＋$H_{2}$O就無法變為可燃物質＋氧氣。故選(E)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列何者屬於離子沉澱反應？
  options:
  - label: A
    content: 2Mg(s) + $O_{2}$(g)$_{ }$→ 2MgO(s)
  - label: B
    content: Ba($NO_{3}$)$_{2}$(aq) + $Na_{2}CO_{3}$(aq) → $BaCO_{3}$(s) + $2NaNO_{3}$(aq)$_{ }$
  - label: C
    content: $CaCO_{3}$(s)→ CaO(s) + $CO_{2}$(g)
  - label: D
    content: $6CO_{2}$(g) + $6H_{2}$O(l)$_{ }$→ $C_{6}H_{12}O_{6}$(s) + $6O_{2}$(g)
  - label: E
    content: NaOH(aq) + HCl(aq) → $H_{2}$O(l) + NaCl(aq)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $Ba^{2+}$與$CO_{3}^{2-}$產生$BaCO_{3}$沉澱；(A)燃燒；(C)分解；(D)光合作用；酸鹼中和。故選(B)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列何者是處於平衡狀態？
  options:
  - label: A
    content: 沸騰的水持續蒸發至乾
  - label: B
    content: 濃度為0.5 M的未飽和食鹽水溶液
  - label: C
    content: 加熱糖水使更多糖溶解於水中的過程
  - label: D
    content: 煤炭完全燃燒形成二氧化碳
  - label: E
    content: 冰箱裡，未開封汽水罐中的二氧化碳
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)蒸乾，代表系統中無液態水存在，故不是平衡狀態；(B)未飽和，代表液中沒有沉澱物，不為平衡狀態；(C)溶解的過程中，溶解速率 > 析出速率，未達平衡；(D)燃燒為不可逆反應。故選(E)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關溶解的現象與溶解度的敍述何者正確？
  options:
  - label: A
    content: 溶解度為定溫下，定量的溶劑所能溶解物質的最大量
  - label: B
    content: 水量越多溶解度越大
  - label: C
    content: 溫度越高溶解度越大
  - label: D
    content: 將過量的鹽溶於水中，其溶解在水中的陽離子與陰離子的數目必相等
  - label: E
    content: 將過量的鹽溶於水中，達平衡後鹽的形狀不再改變
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)水越多可溶的溶質越多，但比例固定故溶解度不變；(C)並非所有物質溶於水皆吸熱，例如氣體在水中溶解度即隨溫度增加而下降；(D)不一定，例如$CaCl_{2}$中$Cl^{-}$的數量即為$Ca^{2+}$數量的兩倍；(E)因為動態平衡，溶解與析出都還在進行，故形狀會改變。故選(A)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列何者<u>不是</u>影響平衡移動的因素？
  options:
  - label: A
    content: 溫度
  - label: B
    content: 濃度
  - label: C
    content: 壓力
  - label: D
    content: 催化劑
  - label: E
    content: 體積
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 催化劑只會影響反應速率，且為「等量」影響反應速率，故不影響平衡移動。故選(D)。
