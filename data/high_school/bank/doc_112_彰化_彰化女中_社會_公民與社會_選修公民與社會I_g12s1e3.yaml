  answer_status: verified
  answer_source: answer_key
  explanation: '當薪資水準上漲（即價格上漲），會使得需求量減少，供給量增加，故選(B)。

    23.2021 年的 CPI＝（2021 的所有商品及勞務的價格×2020 年所有商品及勞務的數量／2020 的所有商品及勞務的價格×數量）×100，2021 年的 CPI＝（85×100＋95×80∕80×100＋90×80）×100＝（16,100∕15,200）×100＝105.9，故選(C)。

    24.2022 年的 CPI＝（90×100＋95×80∕80×100＋90×80）×100＝（16,600∕15,200）×100＝109.2，2022 的 CPI 年增率為＝（109.2－105.9∕105.9）×100 ％＝3.1 ％，故選(A)。

    25.從供需圖可看出，該國的總和需求增加（需求線右移），可見應該是廠商及消費者看好未來的經濟表現，而提高需求，故選(B)。(A)(D)原物料、生活成本或進口品價格上漲，應該會使需求量減少。(C)罷工應該會使產品的供給減少。

    26.(A)需求拉動的通膨是因需求增加而導致，成本推動的通膨是因成本上漲，供給減少而導致，因此兩者總產出變動方向不同，為正解。(B)總產出變動方向應該不同。(C)應是總和需求線的變動。(D)應是總和供給線的變動。

    27.烏克蘭的難民居留歐盟國家，可對這些歐盟國家的勞動市場提供勞動力，使勞動供給增加，故選(C)。

    28.為抑制物價上漲，應採緊縮的貨幣政策或緊縮的財政政策。依文中從事此項政策者為央行，所以要選擇緊縮的貨幣政策之作為，故選(B)。(A)為緊縮的財政政策。(C)(D)為寬鬆的貨幣政策。

    29.採取緊縮的貨幣政策，通常會伴隨利息上漲，可稍微抑制物價，因此(A)(B)(D)應該為可能產生的現象；而(C)租金價格較不會隨著利息調漲而跟著上升。'
