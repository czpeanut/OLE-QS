  group_stem: '在衡量勞動市場的狀況時，薪資水準與失業率經常被視為重要的指標。我國過去 20 年來，雖然受僱員工的經常性薪資、總薪資多呈正成長，但其實扣除物價後的實質經常性薪資，始終無法超越 2003 年的 4 萬 922 元；直到 2020 年公布實質經常性薪資為 4 萬 1,538 元，才終於揮別多年來「薪資倒退」的窘境。

