  stem: 關於中央銀行貨幣政策的公開市場操作敘述何者正確？
  options:
  - label: A
    content: 當經濟景氣過熱央行應賣出票據，增加市場貨幣流動數量
  - label: B
    content: 是中央銀行運用道德說服方式以管制貨幣的一種政策
  - label: C
    content: 購買市場合格票據增加貨幣數量，就是所謂擴張性貨幣政策
  - label: D
    content: 當經濟不景氣時，中央銀行可降低銀行存款準備率
  group_stem: 我國中央銀行總裁彭淮南自 1998 年 2 月上任以來，2000 年首次獲得 A 級評比，2005 年至 2016 年連續 12 年都拿 A，累計共拿下 13 個 A，從 12A 晉身為 13A 總裁，正式超越前馬來西亞央行總裁的 12A 成為全球第一。然而在 2016 年亦有國內雜誌以封面故事「他是神操作還是獨裁者」批評彭淮南獨裁把持央行十八年，讓央行理事會淪為一言堂，綁架「新臺幣」、扭曲臺灣經濟等，而央行也發布書面報告駁斥該篇報導。請問：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)景氣過熱時央行應賣出票據，減少市場貨幣流通數量。(B)公開市場操作（Open Market Operations，簡稱 OMO）是指央行在公開市場上購買或出售證券，藉此達到控制貨幣流通數量及調控利率的目標，非以道德勸說方式。(C)購買票據會增加貨幣數量，為擴張性貨幣政策，又稱寬鬆的貨幣政策，為正解。(D)降低銀行存款準備率不屬於公開市場操作的做法。
