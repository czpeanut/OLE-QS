  explanation: 從題文所述得知，經濟成長率高的國家，對勞動需求較高，可能提供較高的薪資；以此判斷，圖中以英國於 2020 年的經濟成長率為負成長最多，且高達近－10 ％，因此最不適合到英國度假打工，因為他們的經濟狀況最不佳，故選(B)。
