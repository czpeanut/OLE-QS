    2020 年雖然爆發新冠肺炎疫情，但因基本工資＿＿＿(<u>甲) </u>多數企業調薪，加上疫情導致全球需求下降、油價暴跌，連帶影響國際原物料價格，我國 2020 年消費者物價指數＿＿＿(<u>乙) </u>0.23 ％，調薪與物價都是影響實質薪資的關鍵因素。'
