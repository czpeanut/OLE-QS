- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 青輔會為協助青年體驗海外生活，與臺灣企銀合作，讓 20 ～ 30 歲的青年可透過「青年海外生活體驗專案貸款方案」，籌資出國自助旅行、遊學或打工度假。請問此方案的推動，可能對我國勞動市場產生何種影響？
  options:
  - label: A
    content: 若許多青年就業人口因此離職出國，失業率會下降
  - label: B
    content: 若許多青年失業人口因此選擇出國，失業率會上升
  - label: C
    content: 若許多青年就業人口因此離職出國，勞動參與率會上升
  - label: D
    content: 若許多青年失業人口因此選擇出國，勞動參與率會下降
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 讓臺灣青年可以貸款出國體驗，會使我國勞動市場的供給減少。失業率的計算公式為：失業人口÷勞動力人口×100 ％；勞動力參與率是指勞動力占 15 歲以上民間人口的比率。(A)就業者出國，會從勞動力轉為非勞動力，會使得失業人口不變，勞動力少一人，失業率增加。(B)失業人口出國，會變為非勞動力，失業率會下降。(C)就業者出國，會從勞動力轉為非勞動力，勞動參與率會下降。(D)失業人口出國，會變為非勞動力，勞動參與率會下降，為正解。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: '央行的貨幣政策會影響臺幣對美元的匯率，下表為某年臺幣對美元的匯率，依下表的結果推測，我國中央銀行在該年採用的相關政策以及其造成的影響，下列敘述何者正確？

    | 月分 | 一 | 二 | 三 | 四 | 五 | 六 | 七 | 八 | 九 | 十 | 十一 | 十二 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 匯率 | 30.83 | 30.816 | 30.857 | 30.861 | 31.246 | 31.335 | 32.089 | 31.413 | 31.142 | 30.731 | 30.479 | 30.325 |'
  options:
  - label: A
    content: 二月到六月增加臺幣使臺幣升值，降低進口成本
  - label: B
    content: 七月至十二月在市面上減少臺幣，刺激出口成長
  - label: C
    content: 七月到十二月期間美元貶值不利本國出口商品
  - label: D
    content: 二月到六月賣出公債使臺幣貶值不利出口商品
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)二月到六月應為臺幣貶值，有利於出口。(B)七月到十二月臺幣升值，有利於進口，不利出口。(C)七月到十二月臺幣升值美金貶值，利於進口，不利本國產品出口，為正解。(D)二月到六月臺幣貶值，應該有利本國產品出口。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 新冠肺炎病毒爆發，造成全球經濟衰退以來，各國金融市場幾乎都呈現極低的利率水準，到 2021 年多數國家仍持續低利率的現象。從市場資金需求與供給互動來看，此低利率形成的原因與效果，以下各項解釋何者正確？
  options:
  - label: A
    content: 資金需求增加導致資金需求線右移，經過市場均衡後形成低利率
  - label: B
    content: 市場資金供給意願降低，供不應求使資金供給線左移導致低利率
  - label: C
    content: 低利率造成資金的需求量增加，廠商將擴大購買機器設備與廠房
  - label: D
    content: 低利率導致資金的供給量變多，家戶與廠商將閒置資金存入銀行
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)經濟衰退應該是使資金需求減少，需求線左移，而形成低利率。(B)供不應求會使資金供給幅度小於需求移動幅度而形成高利率。(C)低利率會使借貸成本低，需求量增加，而使廠商擴大購買設備及廠房，為正確敘述。(D)低利率會使家戶與廠商將閒置資金提出銀行，從事更高報酬的投資。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_12
