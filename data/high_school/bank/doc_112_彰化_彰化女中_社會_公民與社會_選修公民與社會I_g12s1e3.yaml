  group_stem: 我國中央銀行總裁彭淮南自 1998 年 2 月上任以來，2000 年首次獲得 A 級評比，2005 年至 2016 年連續 12 年都拿 A，累計共拿下 13 個 A，從 12A 晉身為 13A 總裁，正式超越前馬來西亞央行總裁的 12A 成為全球第一。然而在 2016 年亦有國內雜誌以封面故事「他是神操作還是獨裁者」批評彭淮南獨裁把持央行十八年，讓央行理事會淪為一言堂，綁架「新臺幣」、扭曲臺灣經濟等，而央行也發布書面報告駁斥該篇報導。請問：
