- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s2_14
  section: 2
  number: 14
  type: single
  page: 5
  stem: 量化寬鬆（QE）對可貸資金市場的影響，與下列何種貨幣政策相同？
  options:
  - label: A
    content: 調升貼現率
  - label: B
    content: 調升存款準備率
  - label: C
    content: 央行賣出公債
  - label: D
    content: 降低重貼現率
  group_stem: '量化寬鬆（QE）主要是由各國的中央銀行透過公開市場操作，以金錢買入債券、證券甚至房貸等資產，使商業銀行資金增加，進而增加市面流通的貨幣。比如面對 2008 年的金融危機以及 2020 年新冠肺炎疫情的衝擊，許多國家便以 QE 的方式來救經濟。QE 的好處是，商業銀行為了增加利潤或利息收入，通常會將來自央行的錢，以借貸形式將錢流通給企業及人民，人民以貸款進行消費或投資在不同資產，例如股市及房市，並形成股價、房價皆升的局面，熱錢增加亦可以帶動投資及消費，有振興經濟的作用。

    不過，QE 所帶來的後續問題亦不少，首先若經濟活動未能配合，最直接的問題是貨幣貶值，引發通膨甚至讓貧富差距加劇。例如，西方國家在推出量化寬鬆政策的同時，並沒有意識到要增加開支或公共建設，讓更多人得到工作，只是將量化寬鬆所創造出來的金錢注入金融市場、房地產巿場，使得金融資產、房地產資產升值，但是一般民眾並沒有增加收入。結果是擁有金融資產、房地產資產的人因資產升值而變得更有錢，沒有資產的貧民依然一無所有，社會的貧富差距擴大、這是當年量化寬鬆對經濟帶來的負面影響。另一方面，若 QE 持續多年，熱錢充斥市場的狀況下，長期會形成資產泡沫化的問題。最後，由於 QE 前提是在利率接近零的時候推出，利率可能會進一步下降，甚至出現負利率情況，導致放在銀行的錢「減少」的情況出現。而以上這些結果，都是政府為活絡景氣推動 QE 時，應該要審慎思考的。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 寬鬆貨幣政策的做法有調降重貼現率、調降存款準備率、買回公債，故應選(D)。
