questions:
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 新聞報導：「俄羅斯入侵烏克蘭即將滿月，國際石油價格隨戰事拉長波動不止。部分煉油廠擔憂歐美政府可能進一步擴大制裁，減少採購俄羅斯原油，使國際油價在 3 月上旬突破每桶 130 美元大關，為 13 年來新高，臺灣恐將面臨通貨膨脹壓力。」下列何者最能夠解釋臺灣可能面臨通貨膨脹的原因？
  options:
  - label: A
    content: 進口導致需求拉升的物價上漲
  - label: B
    content: 進口導致成本推動的物價上漲
  - label: C
    content: 出口導致成本推動的物價上漲
  - label: D
    content: 出口導致需求拉升的物價上漲
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由於臺灣原油高度仰賴進口，進口價格受國際行情與匯率影響大；加上原油為許多產品的原物料，故此波通貨膨脹為(B)進口導致成本推動的物價上漲。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 通常而言，名目人均 GDP 與月薪漲幅呈現正向關係，但根據下圖，2002 年後的臺灣卻非如此。我們應該如何解讀上述現象？
  options:
  - label: A
    content: 國內的貧富差距日趨嚴重
  - label: B
    content: 國內生產毛額無實質改變
  - label: C
    content: 臺灣經濟進入低成長階段
  - label: D
    content: 臺灣轉型成為已開發國家
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 147.1
      - 296.45
      - 471.0
      - 480.9
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 據資料顯示，經濟所得的大餅，由勞工（包括藍領及白領）與資本家（俗稱老闆）按特定比例分配，可分為「勞動報酬」與「資本報酬」，勞動報酬就是分給勞工的所得，資本報酬則是資本家拿到的部分。如果經濟成長，但是勞動報酬沒增加，經濟成長的所得就很可能只被資本家分去。因此，資本家與勞工的所得差距日益加劇，與此統計數據相符的敘述為(A)國內的貧富差距日趨嚴重。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下表為某年我國與其他國家在人均 GDP 與以美國為基準之人均 GDP PPP 的相關資料，已知此表共採計 39 個國家，根據此表下列哪個解讀是正確的？

    |  | 人均 GDP（美元） |  | 人均 GDP PPP |  |

    | --- | --- | --- | --- | --- |

    |  | 名目 GDP | 排名 | PPP | 排名 |

    | 臺灣 | 27,371 | 28 | 54,841 | 10 |

    | 新加坡 | 54,781 | 10 | 93,396 | 2 |

    | 韓國 | 30,830 | 26 | 44,575 | 19 |

    | 日本 | 38,673 | 22 | 42,776 | 23 |

    | 美國 | 61,590 | 5 | 61,590 | 9 |

    | 瑞士 | 79,456 | 2 | 63,079 | 6 |

    | 39 國平均 | 42,311 | － | 49,615 | － |'
  options:
  - label: A
    content: 臺灣該年的 GDP 大幅增加，經濟成長率高於他國，僅次新加坡
  - label: B
    content: 臺灣的人均 GDP 在他國可購買的一籃子商品，價值約為五萬四
  - label: C
    content: 同樣一籃子商品物價，美國的當期價格高於新加坡的當期價格
  - label: D
    content: 若瑞士想以當期 GDP 做跨國比較，應以 79,456 的數據做為參考
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此表無呈現前一年的經濟狀況，無法推論臺灣該年的經濟成長率是否高於他國。(B)臺灣的人均可購買他國的一籃子商品，應該以人均 GDP PPP 來看，因此是 54,841，為正確敘述。(C)美國的當期價格為 61,590 低於新加坡的當期價格 93,396。(D)應該以反映物價的人均 GDP PPP 比較，故應以 63,079 的數據較能做為跨國的參考。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: '當市場機能發揮時可以達成經濟效率，然而，通貨膨脹卻會扭曲市場機能，影響經濟體系的資源配置。關於通貨膨脹的影響，下列哪些敘述正確？

    (甲)對生產者而言，通貨膨脹使產品價格上漲，誘使廠商投資生產，增加出口賺取利潤。

    (乙)通貨膨脹可能使廠商為了增產而擴廠，但當廠房蓋好時，工資、原料價格也上漲，原本的投資已無利可圖。

    (丙)若通貨膨脹的速度太快，則民眾會擔心貨幣貶值，為賺取利息大舉存錢，造成銀行錢滿為患。

    (丁)對消費者而言，通貨膨脹使民眾為了保值，因而購買更多實質資產，形成這些資產的泡沫。'
  options:
  - label: A
    content: (甲)(丙)
  - label: B
    content: (甲)(丁)
  - label: C
    content: (乙)(丙)
  - label: D
    content: (乙)(丁)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)廠商不一定會投資，因為通膨也會使成本增加；(丙)民眾擔心貶值，不會把錢存在銀行，會轉向投資實質資產，希冀較能保值。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: '某銀行的存放款相關資訊如下表，1 年下來，該銀行可賺取的「利差」最多為多少元？

    | 收到存款 | 存款利率 | 放款利率 | 法定準備率 |

    | --- | --- | --- | --- |

    | 100 萬元 | 2 ％ | 5 ％ | 10 ％ |'
  options:
  - label: A
    content: 20,000 元
  - label: B
    content: 25,000 元
  - label: C
    content: 30,000 元
  - label: D
    content: 50,000 元
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 放款利息收入＝100 萬×90 ％（扣除 10 ％存款準備率）×5 ％＝45,000；存款利息支出＝100 萬元×2 ％＝20,000，利差：45,000－20,000＝25,000，故選(B)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 相較於 2020 年底的景氣燈號為「穩定」，2021 年 2 月到 5 月景氣燈號都顯示為熱絡的「紅燈」，上述景氣波動會導致可貸資金市場產生什麼變化？
  options:
  - label: A
    content: 供給線右移
  - label: B
    content: 供給線左移
  - label: C
    content: 需求線右移
  - label: D
    content: 需求線左移
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 景氣燈號為紅燈意味著景氣熱絡，資金持有者紛紛拿出資金投資，可貸資金市場上資金較多，此代表供給增加，供給線右移，故選(A)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 經濟成長率用以衡量一個國家各年的成長幅度，當成長率高時，表示一國家的生產活動暢旺，此時，廠商對勞動需求會增加，勞動工資將上升，反之當一國呈現負成長，表示一國生產活動萎縮，勞動需求會減少，工資將下降。圖為主要國家的經濟成長率。根據圖中資訊，想要出國度假打工「最不應列入考慮」的國家是哪一個？ （各國由左而右分別為 2016 年、2017 年、2018 年、2019 年、2020 年）
