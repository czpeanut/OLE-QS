- id: doc_113_台北_明倫_自然_生物_選修生物II_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 若想試驗逆境是否造成豆苗的光合作用機制受損，應進行下列哪一項實驗？
  options:
  - label: A
    content: 以濾紙色層分析法檢視逆境下的豆苗，是否含有葉綠素 a
  - label: B
    content: 以濾紙色層分析法比較正常生長與逆境生長的豆苗，逆境組的葉綠素 a 之 Rf 值是否變小
  - label: C
    content: 比較正常生長與逆境生長豆苗的葉綠體粗萃取液加入 DCPIP 一段時間後，逆境組上清液顏色是否較深
  - label: D
    content: 分離逆境生長豆苗的葉綠體，加入 DCPIP 一段時間後，上清液是否變無色
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'DCPIP 為藍色，被還原後會呈現無色，由於光反應時水會被分解而釋放電子還原 DCPIP，因此可用來測定光合作用的情形。

    (C) 實驗中，逆境組上清液顏色若較深，代表光合作用機制受損。'
  tags:
    unit:
      code: BI-S2-3-2
