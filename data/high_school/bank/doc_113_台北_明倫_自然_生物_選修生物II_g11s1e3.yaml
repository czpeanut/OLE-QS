- id: doc_113_台北_明倫_自然_生物_選修生物II_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下列有關無機鹽由土壤溶液進入根部導管的敘述，何者正確？
  options:
  - label: A
    content: 無機鹽可經由滲透作用進入表皮細胞內，不需耗能
  - label: B
    content: 若土壤溶液的滲透壓較根部導管高，無機鹽仍可進入根部導管，不需耗能
  - label: C
    content: 已進入表皮細胞中的無機鹽，可經由原生質絲進入皮層細胞，不需耗能
  - label: D
    content: 無機鹽可穿過卡氏帶進入導管，不需耗能
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 水才經由滲透作用進入表皮細胞內，不需耗能。

    (B) 若土壤溶液的滲透壓較根部導管高，無機鹽就無法進入根部導管。

    (D) 無機鹽無法穿過卡氏帶，需要主動運輸進入細胞，需要耗能。'
  tags:
    unit:
