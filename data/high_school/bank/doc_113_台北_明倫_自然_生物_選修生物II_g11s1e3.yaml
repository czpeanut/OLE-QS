    根壓的形成，主要是由植物根部藉由主動運輸的方式提升滲透壓，引起水分滲透進入根部，形成推擠的壓力。由此可知，滲透壓為影響根壓的關鍵因子，而滲透壓主要是由離子濃度決定，然而，究竟土壤離子濃度與根壓兩者關係為何要如何得知呢？可藉由實驗控制土壤中的離子濃度來觀察根壓的大小，藉此推論兩者的關係，結果如圖(二)。請依上述與圖說明，回答以下問題：'
  shared_asset: g3_44_46
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(B) 若水溶液中的離子濃度高於中柱內的離子濃度，則中柱無法自水溶液再吸收更多的離子，而中柱內離子濃度低於土壤時，則水分不會再往中柱內移動。

    (D) 若土壤中缺少氧氣，則主動運輸吸收離子的能力下降，曲線的分布應往下移動。'
