  group_stem: '根壓為植物推動木質部中水溶液往上運輸的動力之一，測量根壓的方式為剪斷靠近地面的莖部，並用橡皮管與玻璃管連結如圖(一)，剛開始時管內液面會有一上升高度 $h^{a}$，此時因根壓持續作用，故液面會逐漸上升至某一高度後 $h^{b}$ 便不再上升了，可知液面差 $h^{b}$－$h^{a}$ 的壓力即為根壓。

