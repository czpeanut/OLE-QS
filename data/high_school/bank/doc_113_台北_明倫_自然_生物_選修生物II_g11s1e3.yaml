    content: 類囊體膜上的電子載體形成電子傳遞鏈，經由一系列氧化還原反應，將電子從水分子傳遞至最終的電子接受者氧氣
  - label: E
    content: 光系統Ⅰ和光系統Ⅱ之間的電子傳遞過程完全獨立，且光系統 I 的功能僅在非循環電子傳遞鏈中發揮作用
  answer:
