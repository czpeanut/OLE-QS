  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關植物共生性菌根的敘述，何者正確？
  options:
  - label: A
    content: 共生菌可增加植物根部的表面積，以增加水分與無機鹽的吸收
  - label: B
    content: 菌根是植物根部與細菌的共生構造
  - label: C
    content: 共生菌可提供植物生存所需的醣類等養分
  - label: D
    content: 所有共生菌都會在植物根部形成外鞘
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) 菌根是植物根部與真菌的共生構造。

    (C) 共生菌主要協助植物吸收生存所需的水與無機鹽。

    (D) 外生菌根菌才會在植物根部形成外鞘。'
