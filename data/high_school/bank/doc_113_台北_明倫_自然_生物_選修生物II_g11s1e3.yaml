  stem: '根據圖(一)的判斷，使用自然農法對茶園有何影響，下列何者正確？（2 分）

    | 選 項 | 小綠葉蟬數量 | 東方美人茶產量 |

    | --- | --- | --- |

    | (A) | 多 | 小 |

    | (B) | 多 | 大 |

    | (C) | 少 | 小 |

    | (D) | 少 | 大 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  group_stem: '花蓮的蜜香紅茶與產自北部山區的東方美人茶皆以具有蜂蜜般的氣味而聞名，這種特殊氣味的產生與茶樹的防禦作用有關，當一種綠色小昆蟲──小綠葉蟬以刺吸式口器吸食嫩葉汁液時，也啟動了茶樹的生物性防禦，產生具有蜜香的揮發性物質吸引獵蛛前來捕食。這些被昆蟲「加工」的茶葉再經採收與獨特的製程製作後，茶葉的香氣造就了高知名度。

    沖泡東方美人茶時，茶葉在約 85 ℃ 開水中搖曳舒展，被形容如同舞動的美人，此即該名稱的由來。約百年前新竹地區的茶農發現茶葉被小綠葉蟬吸食過後，以為是沾上小蟲的口水，稱為「著涎」。這些茶葉會萎縮變黃，但受損茶葉竟可製成高價的烏龍茶，而且著涎的程度愈高，蜜味更顯品質更佳，「涎仔茶」的美名不脛而走。

    今調查北部某一低海拔產茶山區兩處茶園，以黏蟲盒捕獲小綠葉蟬的數量統計如下表。兩處茶園面積相等，且分別施行自然農法（不使用農藥）及慣行農法（使用安全農藥），請依下列圖文說明回答相關問題。

    X：實線表示施行自然農法，無使用農藥之茶園的各月份捕獲隻數及數量變化。

    Y：虛線表示施行慣行農法，使用對小綠葉蟬無害，但可減少牠的天敵與競爭者的安全農藥之茶園各月份捕獲隻數及數量變化。'
  shared_asset: g3_49_50
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由題圖可知，使用自然農法茶園的小綠葉蟬較少。小綠葉蟬的吸食可以產出東方美人茶的茶葉。因此小綠葉蟬越少，產出的東方美人茶越少。
