  type: single
  page: 1
  stem: 以植物體營養器官橫切面的差異區分根或莖，可發現根的皮層比莖厚。若改以外形判定，則同樣呈塊狀的馬鈴薯及芋頭為莖，甘藷為根。請問此外形判斷的依據為何？
  options:
  - label: A
    content: 是否發芽
  - label: B
    content: 是否長根
  - label: C
    content: 節的有無
  - label: D
    content: 能否進行營養繁殖
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 莖上有節，可生出側芽，根則無節。
