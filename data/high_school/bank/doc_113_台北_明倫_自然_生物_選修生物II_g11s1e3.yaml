  section: 2
  number: 35
  type: multiple
  page: 6
  stem: '某生利用濾紙層析法進行葉片中的葉綠素 a、葉綠素 b、胡蘿蔔素及葉黃素等光合色素的分離實驗。a～e 是重要的操作步驟如下：

    a. 以 70 ℃ 烘乾菠菜葉片，再用研缽磨成粉狀

    b. 加入丙酮研磨至泥狀，用濾紙過濾，取濾液待用

    c. 取一長條濾紙，將前端 1.5 公分剪成尖形

    d. 用毛細管吸取濾液，將濾液點在離濾紙尖端 3 公分處，重複數次

    e. 將濾紙放入裝有展開液（石油醚：90％ 丙酮＝9：1）的量筒內，經密封、靜置後，觀察並比較光合色素的上升及分離情形

    根據以上的實驗操作步驟過程及結果，下列敘述哪些正確？'
  options:
  - label: A
    content: 實驗中，濾紙上顏色最深綠的是葉綠素 a
  - label: B
    content: 實驗後，所得到的光合色素相對擴散值 Rf 值以葉綠素 b 最大
  - label: C
    content: 量筒內展開液的高度應超過色素點的位置，以利色素展開
  - label: D
    content: 量筒要密封是為了使濾紙上的溶液飽和避免蒸發
  - label: E
    content: 若改變展開液的成分，光合色素相對擴散值 Rf 值也會隨著改變
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) 實驗後，所得到的光合色素相對擴散值 Rf 值以葉綠素 b 最小。

