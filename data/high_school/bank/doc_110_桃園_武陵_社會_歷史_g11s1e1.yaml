  stem: 修昔底德(Thucydides)以親身經歷寫成了《伯羅奔尼撒戰爭史》一書，並為整場戰爭做出以下結論：「使戦爭變得無可避免的真正原因是雅典權力的增長，並因而導致斯巴達的恐懼。」下列是關於這場戰爭的相關研究與評論： 資料一：在西元前445～435年之間，「提洛同盟」的勢力並沒有顯著的提升，而雅典也沒有不停的對外擴張，甚至對其現況感到十分滿意。而閉關自首的斯巴達，抱持著「只抵抗外侵略，不主動侵略他國」的治國邏輯，也沒有對雅典有過份的擔憂。戰爭的原因應該要歸咎於爆發前夕的那些緊急事件，讓兩國不得不以武力解決。 資料二：兩個盟主的領袖其實都很睿智且克制，並不會想要開戰，……想要開戰的是加盟的小國，都希望老大打赢，自己能分一杯羹。最怕的則是反覆投靠兩邊的「盟友」，其實他們完全沒有(盟友該有的)誠信，且往往都是他們惹出是非，開啟戰端。 資料三：歷史上發生過無數次新崛起的大國挑戰現存大國的事例，而多數以戰爭結局；例如第一次世界大戰的根源就是新崛起的大國德國挑戰了當時的大國英國，從而引發了世界災難，正如同雅典挑戰斯巴達、斯巴達便發動戰爭一樣，導致整個希臘世界受到重創。 關於上述資料的理解，何者較為適當？
  options:
  - label: A
    content: 均認為新崛起的強權不斷擴張勢力，導致現存的霸主因恐懼過度而終須一戰
  - label: B
    content: 資料一與資料二，肯定並認同修昔底德對於「伯羅奔尼撒戰爭」所做的結論
  - label: C
    content: 資料三的論點認為：先挑起並發動戰爭、引發災難的都是「現存霸主(大國)」
  - label: D
    content: 修昔底德對「伯羅奔尼撒戰爭」所做的結論，反映出對抗的「零和博弈思維」
