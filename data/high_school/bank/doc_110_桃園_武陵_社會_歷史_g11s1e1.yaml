  group_stem: ◎「霧霾」為現代概念，近代以前的稱呼為「霧」或「煙」，對其看法與現之環保意識頗有出入。以下三段資料是關於十九世紀末倫敦煙霧的描述。 資料甲：1872年到訪倫敦的日本岩倉使團發現，當地「到處是黑煙沖天，大小工廠遍地，由此足知英國富強的原因了。」 資料乙：19世紀末，一位住在倫敦的美國詩人寫道：「今天我們有黃色的霧，這總讓我精神振奮，它有著使景象千變萬化的秘訣……即便是出租馬車也框上了一圈光暈，而過馬路的人們都别有風味，令人聯想到斑駁的壁畫人像。即使是灰色、黑色的霧，也製造了全新未經探索的世界，讓原本平凡無奇、令人生厭的街景又變得有趣起來。」 資料丙：光緒16年十月初六(1890年)，薛福成於日記中提及：「蓋英倫三島，四面皆海，本多白霧；而倫敦五百萬煙戶之煤煙，又為霧所掩，不能沖霄直上，聚為黃霧。……蓋天地稍冷，則人皆擁爐，又多五百餘萬人終日夜焚煤之煙，非特灶突之燈也。大抵倫敦為地球第一繁盛之區。洋房幾無隙地，又多三層四層之樓，平房之下尚有地室，已不啻五六層矣，是不啻以一倫敦化為三四倫敦也。」
