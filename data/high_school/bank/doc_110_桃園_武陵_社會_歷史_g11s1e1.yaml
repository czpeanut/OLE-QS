- id: doc_110_桃園_武陵_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 資料一：我們身處的這個世界只是諸多世界中的一個，且它是原子「以諸多方式、碰巧、隨意及漫無目的的聚集」。迷信是一切惡行的源頭，最大的是驅逐恐懼、追求快樂，以達到一種寧靜且自由的狀態。 資料二：神的精神完全與物質結合，世界漸漸生成，神的精神即化為無數的「理性種子」(Logos Spermatikois)，並填塞於世界之中，使世界中之生成物隨著理性而生長。因此，「依照自然而生活」就是依照「理性」而行；與自然相一致的生活，就是道德的生活。 資料三：人類理性可以解開上帝創造自然的奥秘，因為宇宙猶如鐘錶，上帝就是鐘錶師，創造了一個超級的機器，規定運轉的法則(universal law)，然後就不再干預世間的一切，而讓世界按照它本身的規律，存在和發下去。 上述三段資料為不同歷史時期人們對「自然」世界的看法，請根據所學歷史知識判斷下列敘述何者適當：
  options:
  - label: A
    content: 資料一與資料二都相信這世界的運作與神無關，為「無神論者」
  - label: B
    content: 資料二的哲學思想，影響了羅馬法律中「自然法」概念的形成
  - label: C
    content: 上述三段資料所反映的歷史時期順序是資料二→資料三→資料一
  - label: D
    content: 資料二與資料三都相信宇宙運轉的理性原則，反對基督教「神啟」觀
