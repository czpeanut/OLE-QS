  stem: 「古希臘哲學是在與神話世界觀相決裂的過程中產生的，兩者在思維方式上有著明顯的分野。神話世界觀對世界的解釋總體上用的是一種超越論的思維方式，即超出自然之外採用一種神秘主義的態度來尋求對人與世界關系問題的答案，而古希臘哲學自其產生之日起，就打破了這種宗教思維方式，試圖從自然之内而不是自然之外尋求世界的齊一性問題解決的方法。正是這種面向事物本身的務實態度造就了古希臘的科學精神。」根據這段文字结合所學歷史知識，「打破這種宗教思維方式」的希臘哲學家應該是？
