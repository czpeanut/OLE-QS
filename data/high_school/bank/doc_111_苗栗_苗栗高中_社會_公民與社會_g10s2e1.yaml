- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某高中召開服儀委員會討論服儀規定實施要點，鬆綁穿著制服裙的限制，男、女生皆可穿著裙子上學；校方澄清，並非鼓勵男同學穿著裙子，只是尊重學生自主。關於上述作法，下列敘述何者正確？
  options:
  - label: A
    content: 男同學可穿著裙子上學將違反性別平權
  - label: B
    content: 制服裙之規定鬆綁，屬於結社權之範疇
  - label: C
    content: 學生代表有權參與服儀委員會之會議
  - label: D
    content: 制服裙之規定鬆綁，將侵害女同學權利
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)男生也選擇穿裙子，並無違反性平權。(B)應當為自由權的鬆綁。(C)關於學生權益的會議，有學生代表的規定。(D)增加男學生穿裙子的機會，並無侵害女學生的權益。故本題選(C)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 我國《憲法》所保護的人權，都是以維護人性尊嚴為核心，可以分為列舉基本權和概括基本權，下列各項敘述屬於《憲法》何種基本權？甲、參加公職人員考試；乙、在報紙上發表文章；丙、領取中低收入戶補助；丁、更改姓名為「鮭魚」；戊、服國民義務役
  options:
  - label: A
    content: 甲、乙、丙都是列舉基本權
  - label: B
    content: 甲、乙是列舉基本權，戊是概括基本權
  - label: C
    content: 丁、戊都是概括基本權
  - label: D
    content: 丙、丁是列舉基本權，甲是概括基本權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 甲：為參政權，屬於列舉基本權，乙：為言論自由權，屬於列舉基本權，丙：為社會權，屬於列舉基本權。丁：為姓名權，屬於概括基本權。戊：服兵役為義務，非基本權利。故本題選(A)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下表為內政部於 2017 ～ 2022 年 9 月全國人民團體的統計，請根據表中資料，判斷下列說明何者較為正確？

    | 年度 |  | 2017 | 2018 | 2019 | 2020 | 2021 | 2022 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 政治團體 | 政黨 | 328 | 290 | 291 | 127 | 112 | 80 |

    |  | 全國性政治團體 | 50 | 49 | 45 | 0 | 0 | 0 |

    | 職業團體 | 合計 | 354 | 359 | 366 | 369 | 371 | 375 |

    |  | 工業團體 | 156 | 155 | 156 | 157 | 157 | 157 |

    |  | 商業團體 | 147 | 150 | 153 | 155 | 157 | 161 |

    |  | 自由職業團體 | 51 | 54 | 57 | 57 | 57 | 57 |

    | 社會團體 | 合計 | 16,277 | 17,892 | 19,439 | 20,836 | 21,974 | 22,261 |

    |  | 學術文化團體 | 3,881 | 4,295 | 4,690 | 5,040 | 5,347 | 5,469 |

    |  | 醫療衛生團體 | 1,393 | 1,521 | 1,634 | 1,715 | 1,779 | 1,781 |

    |  | 宗教團體 | 1,465 | 1,549 | 1,644 | 1,718 | 1,788 | 1,810 |

    |  | 體育團體 | 1,382 | 1,493 | 1,639 | 1,757 | 1,848 | 1,867 |

    |  | 社會服務及慈善團體 | 3,492 | 3,887 | 4,240 | 4,669 | 5,002 | 5,087 |

    |  | 國際團體 | 212 | 246 | 256 | 263 | 278 | 274 |

    |  | 經濟業務團體 | 3,035 | 3,379 | 3,684 | 3,894 | 4,041 | 4,041 |

    |  | 同鄉、校友會及其他團體 | 1,417 | 1,522 | 1,652 | 1,780 | 1,891 | 1,932 |'
  options:
  - label: A
    content: 從社會團體、職業團體的數量變化來看，可推論對結社自由朝向鬆綁行政管制
  - label: B
    content: 從政治團體的數量可推斷，我國政府對於人民結社、參政權利的管制日趨嚴格
  - label: C
    content: 社會團體數量較其他二者多，可知社會團體成立並無門檻，並未建立退場機制
  - label: D
    content: 依整體發展來觀察，可知我國的教育水準日益提高，才能落實結社自由的保障
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)社會團體數量增加較多，職業團體數量也增加，兩者可推論結社自由朝向行政鬆綁的方向前進。(B)雖然政治團體數量減少，但社會團體蓬勃發展，無法推論我國對於結社權、參政權利管制日益嚴格。(C)我國社會團體成立目前依據《人民團體法》，並非沒有門檻。(D)該表並無提供教育水準資料，無法判斷。故本題選(A)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 憲法法庭於 2022 年 4 月作出 111 憲判字第 4 號判決，認為《原住民身分法》第 4 條第 2 項違憲，即「原住民與非原住民結婚所生子女，必須從原住民父親或母親姓氏，或取原住民傳統名字，才能取得原住民身分」的規定，侵害人民《憲法》上所保障的自由權、平等權等權利。對於上述案例，若從《憲法》與基本權利的角度來看，下列說法何者為正確？
  options:
  - label: A
    content: 姓名可表彰一個人的身分與認同，但我國目前對於姓名權尚未納入權利保障
  - label: B
    content: 原住民身分著重於血緣關係，應回歸各原住民族透過部落公法人認定其身分
  - label: C
    content: 身分與權益息息相關，本次憲法庭判決表達出不應對原住民身分有所限制
  - label: D
    content: 原始規範對原住民身分產生限制，侵害部分原住民身分認同之人格權的保障
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)我國已有《姓名條例》對姓名權進行保障與規範。(B)本憲法判決並無提到此概念。(C)憲法法庭判決顯示應保障原住民身分認同的自由與平等權利，但並非都不應加以限制。故本題選(D)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 一個國家的社會規範反映著主流群體的想法及期待，現代民主國家在面對國內各種不同性別、族群及身心障礙人士等處境不利的群體時，也常採取相關的「合理的優惠性差別待遇」制定政策，藉以改善其社會地位，請問這是基於什麼樣的因素影響？
  options:
  - label: A
    content: 處境不利群體僅因先天因素遭受到主流群體的迫害與歧視
  - label: B
    content: 處境不利群體長期處於劣勢地位而無法平等享有社會資源
  - label: C
    content: 合理的優惠性差別待遇是透過社會規範將資源做最有效率的分配
  - label: D
    content: 現代民主國家藉由改善弱勢群體的社會地位強化國家主權正當性
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)處境不利群體不一定會受到主流群體的歧視與迫害。(C)合理的優惠性差別待遇是給予處境不利群體最有利的條件，不一定是最有效率的分配。(D)改善處境不利群體的生活，與國家主權無關。故本題選(B)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 《法律女王》是 2018 年上映的美國傳記劇情電影，以美國最高法院大法官露絲．貝德．金斯伯格（Ruth Bader Ginsburg）為原型，描述她為性別平權而鬥爭的故事。金斯伯格是當年哈佛法學院內當中極少數的女性，經過一番努力終於成為美國第二位女性大法官，亦是《哈佛法律評論》創刊以來，第一位入選的女性成員。請問上述呈現女性面臨哪一種社會規範所造成的困境？
  options:
  - label: A
    content: 缺乏個人自我實現的機會
  - label: B
    content: 缺乏提升家庭地位的機會
  - label: C
    content: 多元化的選擇
  - label: D
    content: 缺乏自由參選的機會
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到美國最高法院女性大法官的故事，可知在當時環境下，大多數女性的發展受到玻璃天花板的限制，缺乏個人自我實現的機會，故本題選(A)。(B)此處與提升家庭地位無關，應為社會地位。(C)此處指女性的升遷與發展，與多元化的選擇無關。(D)此處與參選無關。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 有學者指出社會規範具備社會控制功能。社會控制是約束、調整與限制社會群體或個人行為的手段，確保其行為符合社會規範。請問下列哪一個例子屬於「非正式的外在社會控制」類型？
  options:
  - label: A
    content: 小華背地裡講同學的八卦，內心非常不安
  - label: B
    content: 大偉違規考試作弊，處罰記過一支
  - label: C
    content: 阿文搭公車時因為用手機聊天音量過高被鄰座提醒，而降低音量
  - label: D
    content: 小明因為趕時間而闖紅燈被開單
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 非正式的外在社會控制，其中「非正式」指的是法律規範以外的控制，而非法律規範。「外在」指的是來自於社會的壓力，而非本身，故本題選(C)。(A)為非正式規範的內在社會控制。(B)(D)為正式的外在社會控制。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 落實居住正義向來是我國的重要議題，2021 年立法院三讀通過《住宅法》修正案，希望落實居住正義，照顧弱勢及青年族群，回應人民的需求。下列有關完成修法程序背後所代表的原則與精神，何者最正確？
  options:
  - label: A
    content: 民主國原則：國家的立法權由人民來掌握
  - label: B
    content: 憲政主義：國家元首的產生由人民選出
  - label: C
    content: 多元文化原則：政府應規劃積極平權措施
  - label: D
    content: 福利國原則：政府機關應依據法律施政
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)人民選出的代表來進行立法工作，屬於民主國原則。(B)憲政主義的國家元首不一定是民選，也可能是世襲，例如：英國、日本。(C)應當為福利國原則。(D)應為法治國原則。故本題選(A)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '網紅小玉與同夥利用人工智慧與合成技術「Deepfake」（深度偽造），將數百名受害者臉部圖像製作成猥褻與色情影片上網販售及散播，不法獲利高達數千萬以上。面對諸如此類愈來愈多元的科技犯罪型態，行政院及立法委員們一致認為應該推動立法加以約束管制。依照我國的立法程序，可能進行的程序為何？

    甲、完成三讀通過 乙、向立法院提案 丙、逐條討論內容

    丁、召開公聽會 戊、進行黨團協商'
  options:
  - label: A
    content: 戊乙丁丙甲
  - label: B
    content: 乙丁甲丙戊
  - label: C
    content: 丁乙戊甲
  - label: D
    content: 乙丁丙甲
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 順序應當為乙：向立法院提案、丁：召開公聽會（相關常設委員會時）、戊：黨團協商（若相關常設委員會討論，各政黨意見差異大時為之）、丙：逐條討論（第二讀會）、甲：完成三讀通過。故本題選(D)乙丁丙甲。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 隨著資訊與網路的發展，民眾已廣泛應用資訊設備及網路表達對時事及公共政策的看法。因此，行政院國家發展委員會架設公共政策網路參與平臺，民眾對於公共政策提出建言或創意見解的「提點子」流程圖如下。若有民眾提議法律修正案成案，行政院回應後決定修法，此時將如何進行第一步？
  options:
  - label: A
    content: 行政院草擬法案後，交由立法院三讀
  - label: B
    content: 提議的民眾，草擬法案交付立法院三讀
  - label: C
    content: 執政黨的立院黨團負責草擬法案並交付三讀
  - label: D
    content: 司法院大法官進行釋憲後，要求立法院修法
  assets:
  - key: s1_10_f1
    kind: figure
    file: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1/s1_10_f1.png
    crop:
      page: 3
      rect:
      - 193.2
      - 182.35
      - 496.9
      - 284.95
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是交由立法院依修法程序展開修法。(B)民眾並無法提出法律修正案。(D)我國釋憲機制為事後審查，並非是透過釋憲來修法。故本題選(C)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 酒駕事故頻傳，政府為了遏止酒駕惡行，有意加重酒駕刑責。依照我國《憲法》規定，修法程序必須經過立法院三讀通過，並移請總統公布施行。因此立法院已經將相關修法提案送往院會討論，並排定相關議程，可望在短期內順利三讀通過該法案。請問有關於修法程序的敘述，下列何者正確？
  options:
  - label: A
    content: 僅立法委員及立院黨團具有修法提案的權力，行政院則無
  - label: B
    content: 對於部分提案內容並無異議而無須審查者，僅須通過二讀即可
  - label: C
    content: 法案內容經黨團協商之結論，並經院會同意後，出席委員仍得反對
  - label: D
    content: 行政院對通過的法案提出覆議後，立法院仍可能以全院委員會審查表決，維持原決議，而正式施行之
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)行政院可提出政府案，並非沒有提案權。(B)修法與立法需經三讀程序。(C)經黨團協商後的法律案內容，出席委員不得再反對。故本題選(D)。
- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: '立法院第 9 屆第 5 會期第 11 次會議議案關係文書：

    案由：本院親民黨黨團，鑑於臺灣的少子化問題日趨嚴重，根據內政部統計去年 2017 年截至 9 月的資料，臺灣的出生率僅 1.07 ％，是全世界最低的國家，儼然成為我國的不可避免的國家問題。爰此提案「《幼兒教育及照顧法》第 9 條之 1 及第 60 條條文修正草案」，要求政府機關（構）應設立幼兒園或提供適當之幼兒教保服務措施。

    提案人：親民黨立法院黨團

