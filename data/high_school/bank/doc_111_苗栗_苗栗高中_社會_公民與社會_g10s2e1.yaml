  stem: 法國社會的傳統觀念，形成了潛在的社會規範，影響著人們的行為，也阻礙了家暴事件的處理。請問下列相關說明，何者最為正確？
  options:
  - label: A
    content: 旁人根據傳統觀念認為，不應該干涉他人的家暴，這是外在社會控制的效果
  - label: B
    content: 「旁人的議論及異樣眼光」促使家暴受害者隱忍家暴，屬於內在的社會控制
  - label: C
    content: 教育民眾改變觀念、培訓警方對於家暴案件的理解，可加強內在的社會控制
  - label: D
    content: 法律是具強制力也最有效果的社會控制手段，只要修法就足以處理家暴問題
  group_stem: 法國每年約有 22 萬名女性遭到家暴，但許多受害者及其親屬卻因為害怕或羞於啟齒，選擇隱忍；旁人也常會覺得不應干涉別人的家務事而袖手旁觀。雪上加霜的是，即使人民的安全受到法規保障，但在傳統觀念之下，警察接到家暴受害者報案後，往往當作是伴侶吵架、民眾私事而消極以對；有些受害者在死於施暴者的攻擊之前，甚至曾多次求助警方，但都徒勞無功；此外，受限於法規，受害者也很難獲得法院核發保護令。2019 年，10 幾萬民眾走上街頭抗議，希望從教育做起，改變社會上「女人附屬於男人」觀念；同時也希望政府拿出作為，正視女性遭家暴的問題。法國政府宣布將修改不合時宜的法規，並採取多項新措施，包括為受虐婦女提供 1 千個庇護所、沒收施暴者的槍枝，以及加強培訓警方對家暴案件的理解及處理等。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)傳統觀念應為內在的社會控制。(B)他人的議論與眼光屬於外在的社會控制。(C)透過教育強化對家暴的認識，屬於內在的社會控制。(D)家暴問題並非是外在社會控制即可，仍須強化內在的社會控制。故本題選(C)。
