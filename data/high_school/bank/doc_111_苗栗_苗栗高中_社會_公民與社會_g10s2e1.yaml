  stem: 法國政府推出的各項措施也屬於社會規範，這些措施是由政府召集部會首長，並邀請家暴受害者家屬、律師、檢察官、警察、民間團體等代表，舉辦「國民論壇」，經過 2 個月的討論再制定而成。請問關於這些措施的相關敘述，何者正確？
