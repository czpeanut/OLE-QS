  group_stem: 法國每年約有 22 萬名女性遭到家暴，但許多受害者及其親屬卻因為害怕或羞於啟齒，選擇隱忍；旁人也常會覺得不應干涉別人的家務事而袖手旁觀。雪上加霜的是，即使人民的安全受到法規保障，但在傳統觀念之下，警察接到家暴受害者報案後，往往當作是伴侶吵架、民眾私事而消極以對；有些受害者在死於施暴者的攻擊之前，甚至曾多次求助警方，但都徒勞無功；此外，受限於法規，受害者也很難獲得法院核發保護令。2019 年，10 幾萬民眾走上街頭抗議，希望從教育做起，改變社會上「女人附屬於男人」觀念；同時也希望政府拿出作為，正視女性遭家暴的問題。法國政府宣布將修改不合時宜的法規，並採取多項新措施，包括為受虐婦女提供 1 千個庇護所、沒收施暴者的槍枝，以及加強培訓警方對家暴案件的理解及處理等。
  answer:
