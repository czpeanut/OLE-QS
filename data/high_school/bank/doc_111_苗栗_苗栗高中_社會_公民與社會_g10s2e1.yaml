- id: doc_111_苗栗_苗栗高中_社會_公民與社會_g10s2e1_s1_27
  section: 1
  number: 27
  type: single
  page: 5
  stem: 《憲法》第 7 ～ 18 條列舉人民的基本權利，包含自由、平等、受益、參政等四大範疇的基本人權。然而，《憲法》列舉的基本人權，是否受到完全的保障而不可侵犯？
