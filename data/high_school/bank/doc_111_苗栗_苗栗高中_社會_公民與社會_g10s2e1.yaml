  group_stem: 立法院院會於 2015 年 5 月 15 日三讀通過《長期照顧服務法》（以下稱《長照法》），確立長照制度法源，整合長照服務體系，設置長照服務發展基金並拓展偏鄉服務體系。依三讀通過條文，長期照護指身心失能持續已達或預期達 6 個月以上者，依其個人或其照顧者需要，所提供生活支持、協助、社會參與、照顧及相關醫護服務。回顧立法過程，行政院在 2012 年將長照法草案送立法院審議，<u>立法院社會福利及衛生環境委員會 2015 年完成初審</u>，經多次協商，朝野對長照基金來源有歧見，立法幾經延宕。依行政院提案說明，目前國內長照機構、人員管理較為多元，且規範不一，加上需求逐漸增加，《長照法》立法能健全長照服務體系發展，確保服務品質，保障接受長照服務者的尊嚴和權益，並使長照制度具有完備的法源基礎。
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
