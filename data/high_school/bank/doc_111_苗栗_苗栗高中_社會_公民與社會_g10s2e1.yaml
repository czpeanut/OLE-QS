  stem: 請問資料二主要是在解決何種權利間衝突的疑義？
  options:
  - label: A
    content: 新聞工作權與救濟權
  - label: B
    content: 人身自由權與隱私權
  - label: C
    content: 新聞自由權與隱私權
  - label: D
    content: 言論自由權與受益權
  group_stem: '請依下列資料回答問題：

    資料一：有關記者跟追採訪新聞權利的《社會秩序維護法》第 89 條第 2 款規定：「無正當理由跟追他人經勸阻不聽，處 3,000 元以下罰鍰。」

    資料二：司法院大法官釋字第 689 號解釋認為：(甲)法條中的「跟追」指的是尾隨、盯哨、守候等方式持續接近他人，侵擾他人行動或私密領域；「無正當理由」是指跟追目的，超過社會通念能容忍界限；「勸阻不聽」則指被跟追人或警察出面勸阻。大法官認為，一般民眾都看得懂法條意思。(乙)記者跟追採訪若具公益性或有新聞價值，只要不採緊迫跟追，就有正當理由不受罰。大法官舉例包括揭發犯罪或重大不當行為、監督政府施政的妥當性等 6 種狀況。由警察決定是否開罰，記者受罰後可向法院聲明異議尋求救濟。

    請閱讀上述兩則資料，並回答下列問題：'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料二提到新聞記者採訪若具有公益性，只要不採取緊迫跟追，是可以被接受的。可知此為新聞自由與隱私權的拿捏，故本題選(C)。(A)與新聞工作權、救濟權無關。(B)與人身自由權無關。(D)與受益權無關。
