  explanation: 資料二提到該法條的意思，一般民眾都看得懂，可推論符合明確性原則，同時規範處罰無正當理由，跟追經他人勸阻不聽開罰，符合比例原則，故本題選(B)。(A)信賴保護原則指政府應當保護人民對政府的信賴，不應任意改變已給予人民權益的部分，與此處無關。(C)合憲，無侵犯新聞自由。(D)合憲，且與誠實信用原則無關。
