  stem: 司法院長許宗力曾在大法官釋字第 755 號解釋的協同意見指出，受刑人只是穿「囚服」的國民，並非是《憲法》基本權保障的「棄民」。在監禁期間，除人身自由遭受限制外，受刑人一樣擁有在《憲法》中的各種基本權利。而我國於 1946 年制定之《監獄行刑法》規定了受刑人在監獄內的一切行為及作息規範，然該法老舊過時，引發外界批評聲浪不斷。當社會隨著時代變遷，原有的法律將難以達成原定的規範功能，故法律必須與時俱進做必要修正或廢止。因此，對該法修訂的呼籲，主要是基於以下何種因素？
  options:
  - label: A
    content: 為落實執刑之強制力，故經由修法加強對受刑人之管理
  - label: B
    content: 由於法律效力有限，故經由修法修正獄方管理措施
  - label: C
    content: 鑑於人權內涵的擴展，故經由修法保障受刑人基本權
  - label: D
    content: 基於法律之技術普遍性，故經由修法達到簡化管理程序
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依據許宗力大法官的呼籲，可知(A)並非是修法加強對受刑人的管理，而是維護其基本權利。(B)應當是為了保障受刑人的基本權利。(D)大法官的呼籲與簡化管理程序無關。故本題選(C)。
