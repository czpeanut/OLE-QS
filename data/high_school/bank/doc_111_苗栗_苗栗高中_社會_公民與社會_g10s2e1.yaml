  stem: 《人民團體法》第 2 條規定：「人民團體之組織與活動，不得主張共產主義，或主張分裂國土。」大法官釋字 644 號作出解釋，認為該法規規定主管機關於許可設立人民團體前，得審查人民「主張共產主義，或主張分裂國土」政治言論內容，並作為不予許可設立人民團體之理由，顯已逾越必要之程序，違反憲法保障人民結社自由與言論自由之意旨。依據上述判斷，下列何者為該解釋文的主要論點？
