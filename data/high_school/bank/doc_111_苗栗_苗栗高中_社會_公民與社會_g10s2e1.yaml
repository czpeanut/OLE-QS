  group_stem: '曾爭議多時的《社會秩序維護法》「罰娼不罰嫖」的規定，於司法院大法官會議第 666 號做出違憲解釋。聲請大法官釋憲的宜蘭地方法院法官因審理娼妓賣淫案時，認為《社會秩序維護法》的立法目的在維護社會安寧秩序，而現行罰娼的規定卻缺乏合理性，因為娼妓出賣身體，屬於經濟弱勢者；嫖客付錢，為經濟強勢者，法律卻「罰娼不罰嫖」，因此聲請大法官釋憲。

    第 666 號解釋「罰娼不罰嫖」違憲的理由，主要是認為性交易須由買春者與賣春者共同才能完成，因此法律對於雙方的處罰標準不應有差別待遇；此外，娼妓多屬於經濟弱勢者，若只處罰娼妓將導致其經濟狀況更形窘困，因此宣告該法條違憲。請問：'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到法律在買春與賣春者規定有差別待遇，可知此屬於平等原則的問題，故本題選(B)。與(A)(C)(D)無關。
