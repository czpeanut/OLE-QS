  type: single
  page: 1
  stem: 下列對於洋流特性及其影響的敘述，何者最正確？
  options:
  - label: A
    content: 涼流表層海水溫度比下層海水低
  - label: B
    content: 涼流經過之處氣候潮溼多雨
  - label: C
    content: 暖流會造成熱帶沙漠
  - label: D
    content: 暖流分布在低緯的大陸東岸和高緯的大陸西岸
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)涼流表層海水溫度較「周圍」低，而不是相較底層海水溫度低。(B)涼流經過之處氣候應較為乾燥少雨。(C)暖流經過之處潮溼多雨，不會成為熱帶沙漠，熱帶沙漠主要為副熱帶高壓籠罩乾燥少雨所致，如撒哈拉沙漠。
