  section: 1
  number: 28
  type: single
  page: 7
  stem: 剛從大學畢業的花甲有感於阿嬤年紀已大，決定回家務農陪伴家人。花甲農田種植高麗菜和青花菜為主，今年花甲預期高麗菜價上漲，因此減少青花菜種植，好擴增高麗菜田的面積，因此青花菜的供給也會隨之減少。請問花甲減少青花菜種植，是受以下何種供給變動因素的影響？
