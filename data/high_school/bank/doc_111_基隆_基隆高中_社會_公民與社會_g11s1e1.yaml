  stem: 雇主依《勞動基準法》規定終止勞動契約，應發給勞工資遣費，每滿 1 年發給相當於一個月平均工資之遣費。如果郭鹿鳴工作未滿 1 年被資遣，則其資遣費應如何計給較符合公平原則？
