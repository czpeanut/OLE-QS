- id: doc_111_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 資方從生產要素市場購買勞動，目的是生產商品追求利潤；因此，勞動者的「勞動」是與資方談判最有力的武器。為保障勞動者權益，《勞資爭議處理法》給予勞動者罷工的權利。而依此部法律，勞工與資方的法定權利為何？(甲)勞資雙方之間因工作條件而產生爭議；(乙)必須勞資雙方先進行爭議協商；(丙)協商、調解都不成，勞工可進行罷工；(丁)罷工期間資方可以不發薪、資遣或解聘
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (乙)(丙)(丁)
  - label: C
    content: (甲)(乙)(丁)
  - label: D
    content: (甲)(丙)(丁)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)涉及調整事項（如降低工時、加薪、增加休假日數、加發獎金、增付福利津貼、提高工作環境安全衛生等）的勞資爭議可以罷工。(乙)(丙)《勞資爭議處理法》第 53 條規定，勞資爭議若未經調解不成立，不可以有爭議行為；權利事項之勞資爭議，不得罷工。只有在經過調解卻不成立的情形，經會員以直接、無記名投票且全體過半數同意，才能發動罷工。(丁)罷工期間勞工不用上班，雇主也不用給付薪資，但資方不得因該勞資爭議事件而歇業、停工、終止勞動契約或為其他不利於勞工之行為。
  tags:
