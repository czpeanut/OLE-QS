  stem: 國際勞工組織曾發表四項基本國際勞動人權，包括：勞工組織工會及要求集體協商的權利、禁止強迫性或強制性的勞動、廢除童工，以及去除就業與職業的歧視。下列哪一個制度違反國際勞工組織的基本國際勞動人權？
  options:
  - label: A
    content: 禁止雇主僱用未滿十五歲的人工作
  - label: B
    content: 同意教師組織工會，進行勞動協商
  - label: C
    content: 強制性要求遊手好閒之人進行勞動
  - label: D
    content: 禁止雇主基於勞工性傾向而解僱之
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 強制性要求遊手好閒之人進行勞動違反國際勞工組織禁止強迫性或強制性的勞動的規定，故選(C)。(A)雇主原則上不能僱用未滿十五歲的人工作，若使未滿十五歲之人提供勞務，應依規定向地方勞工行政主管機關申請許可後才可以從事工作。(B)工會可保障勞工的集體權。(D)禁止雇主基於勞工性傾向而解僱之，符合性別平權。
