  section: 1
  number: 11
  type: single
  page: 3
  stem: 勞資協商有各種形式，以勞資會議為例，其協商精神以下何者敘述較正確？
  options:
  - label: A
    content: 勞資會議是一種協調勞資關係、促進勞資合作
  - label: B
    content: 勞資會議僅在解決現存問題，難以防範於未然
  - label: C
    content: 勞資會議為勞資雙方被動協商，增進雙方合作
  - label: D
    content: 勞資會議主要為減少衝突，無助提高工作效率
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由勞資雙方同數代表組成，其代表人數視事業單位人數多寡各為二人至十五人。但事業單位人數在一百人以上者，各不得少於五人。勞資會議是企業內讓勞工參與公司經營管理的一種管道，企業設立勞資會議可達到協調勞資關係、促進勞資合作、並防範各類勞工問題於未然之目的。故選(A)。
