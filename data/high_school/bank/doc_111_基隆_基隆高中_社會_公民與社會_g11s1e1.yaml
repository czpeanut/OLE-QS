- id: doc_111_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 司法院大法官釋字第 726 號指出：「衡酌《勞動基準法》之立法目的並考量其規範體例，除就勞動關係所涉及之相事項規定外，尚課予雇主一定作為及不作為義務，於違反特定義務時亦有相關罰則，賦予一定之公法效果，其規範具強制性質，以實現保護勞工之目的。而工作時間、例假、休假、女性夜間乃勞動關係之核心問題，影響勞工之健康及福祉甚鉅，故透過本法第三十條等規定予以規範，並此標準作為律保障之最低限度，除本法有特別規定外，自不容勞雇雙方以契約自由為由規避之。」該解釋文為以下何種原則之體現？
  options:
  - label: A
    content: 私法自治
  - label: B
    content: 無過失責任
  - label: C
    content: 契約正義
  - label: D
    content: 契約神聖
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「《勞動基準法》之立法目的……，課予雇主一定作為及不作為義務，於違反特定義務時亦有相關罰則，賦予一定之公法效果，其規範具有強制之性質，以實現保護勞工之目的。」此即說明《勞動基準法》基於契約正義而限制了契約自由，故選(C)。(A)私法自治指公共事務範圍外私人領域之法律關係，應任由私人自行建立及變更，尊重當事人之自由與自主，國家盡量不加以干預，只能消極維持基本之秩序。(B)無過失責任指在損害發生的情況下，即使不存在故意或者過失，也需要承擔損害賠償責任。(D)契約神聖指有效成立之契約，為維持法律生活之安定性，自應嚴格遵守之。
