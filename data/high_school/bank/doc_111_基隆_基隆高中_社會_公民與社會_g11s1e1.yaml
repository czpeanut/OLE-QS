- id: doc_111_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 現今社會下，想交換資源的雙方都擔心對方不守承諾，在交易過程中也害怕對方偷盜欲交換的物品，因此要保障契約成立，首先須界定以下何項權益？
  options:
  - label: A
    content: 隱私權
  - label: B
    content: 財產權
  - label: C
    content: 身分權
  - label: D
    content: 自由權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 交易是所有權的移轉，為免交易糾紛，宜界定資源的財產權，故選(B)。
  tags:
