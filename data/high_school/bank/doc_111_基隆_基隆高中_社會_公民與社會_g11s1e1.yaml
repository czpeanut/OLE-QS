- id: doc_111_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 6
  stem: 由於政府提倡新南向政策，加上東南亞的勞動力相對較低廉，且消費市場亦亟需開發，因此有許多看重勞動力要素的產業，紛紛投資或遷廠至該地，以透過取得較低的勞動力來增加獲利甚至直接打進該國市場。請問廠商以較低的生產成本來增加獲利，甚或擴廠增加產能，以提高其供給數量，是以下何種影響供給變動的因素？
  options:
  - label: A
    content: 投入生產要素的價格變動
  - label: B
    content: 在生產上具有相關性產品的價格變動
  - label: C
    content: 生產技術的突破
  - label: D
    content: 生產者對未來價格的預期
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 東南亞的勞動力相對較低廉，表示其生產要素的價格低，可以降低廠商的生產成本，來增加獲利，故選(A)。
