- id: doc_111_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小瑛欲前往歐洲旅遊，與旅行社洽談旅遊事宜時，於旅行社提供之定型化契約上，修訂部分條款。請問依《消費者保護法》規定，下列敘述何者正確？
  options:
  - label: A
    content: 依私法自治原則，中央主管機關不得規範定型化契約應記載或不得記載之事項
  - label: B
    content: 若定型化契約條款牴觸個別磋商條款之約定者，則牴觸部分應為無效
  - label: C
    content: 定型化契約一律須交消費者審閱 30 日
  - label: D
    content: 定型化契約條款如有疑義時，應為對雙方均有利於之解釋
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 個別磋商條款係指契約當事人個別磋商而合意之契約條款，相較於企業經營者事先擬定之定型化契約條款，更能彰顯消費者真意，因此，原則上定型化契約條款牴觸個別磋商條款之約定時，其牴觸部分為無效，故選(B)。(A)《消費者保護法》限制契約自由，中央主管機關得規範定型化契約中應記載或不得記載之事項。(C)定型化契約審閱期為 30 日以內皆可。(D)定型化契約條款如有疑義時，應為對消費者有利之解釋。
  tags:
    unit:
      code: CI-3-1-1
      book: 公民與社會3 選擇與永續
      chapter: 契約自由與財產權保障
      title: 契約自由
