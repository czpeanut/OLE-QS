  - label: A
    content: 投入生產要素的價格變動
  - label: B
    content: 在生產上具有相關性產品的價格變動
  - label: C
    content: 生產技術的突破
  - label: D
    content: 生產者對未來價格的預期
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 高麗菜和青花菜為生產上的替代品，因此當花甲預期高麗菜價上漲，會多種高麗菜，而減少青花菜種植，因此青花菜的供給也會隨之減少，故選(B)。
