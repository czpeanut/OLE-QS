  section: 1
  number: 14
  type: single
  page: 3
  stem: 關於勞工權益保障可分為個別勞動權與集體勞動權，個別勞動權著重於個別勞工與雇主間權利義務的規範，以《勞動基準法》為主，另有《性別工作平等法》、《勞工退休金條例》、《勞工保險條例》等規範保護個別勞動權；而集體勞動權則是俗稱三權：團結權、協商權、爭議權，著重於如何將個別勞工的個別勞動權以團體的方式實質爭取。請問以下何者最有可能是保障勞工集體動權的原因？
