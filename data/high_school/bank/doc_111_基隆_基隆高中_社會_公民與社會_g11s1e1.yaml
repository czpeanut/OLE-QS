- id: doc_111_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_26
  section: 1
  number: 26
  type: single
  page: 6
  stem: 小賈經營畜牧業，有鑑於肉品市場的變化，今年小賈專心畜養豬隻。請問就供給者而言，小賈心中有販售豬隻的「願售價格」，則此價格代表以下何者？
  options:
  - label: A
    content: 願售價格是與其他肉品相比後，小賈能得到最大利益的選擇
  - label: B
    content: 當市場價格高於願售價格時，小賈就會選擇生產其他肉品
  - label: C
    content: 當市場價格低於願售價格時，小賈就會出現生產者剩餘
  - label: D
    content: 願售價格必須低於支付生產時所產生的各項成本
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 願售價格即是成本，小賈選擇生產豬肉，表示生產豬肉小賈能得到最大利益，故選(A)。(B)當市場價格高於願售價格時，表示有利可圖，小賈就會生產豬肉。(C)當市場價格低於願售價格時，表示無利可圖，小賈沒有生產者剩餘。(D)願售價格等於生產成本。
