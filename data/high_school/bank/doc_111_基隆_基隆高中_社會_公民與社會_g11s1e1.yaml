- id: doc_111_基隆_基隆高中_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 《民法》中雖然重視契約自由原則，但契約訂立方式與內容仍應要確保雙方平等。請問以下何種情況<u>並不違反</u>民事契約中的平等互惠原則？
  options:
  - label: A
    content: 嫁妝百貨於門口告示「貨物出門，概不退換」
  - label: B
    content: 屋欣銀行規定，存款人文件上的簽章印鑑不論是否偽造，存款人都應負責賠償責任
  - label: C
    content: 大慶以分期付款購買冷氣，契約規定若未依約給付，應給付違約金
  - label: D
    content: 高分線上學習網招募會員時，於網站上規定「凡使用過會員權益任何一項內容者，均不予退費」
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《消費者保護法》中有分期付款的規範，若契約規定若未依約給付，應給付違約金，故選(C)。(A)商家依《民法》第 354 條之規定，負擔保其所出賣之物並無瑕疵之責任。(B)若存款人文件上的簽章印鑑是偽造，則存款人不應負賠償責任。(D)違反《消費者保護法》中定型化契約的規定。
  tags:
    unit:
      code: CI-3-1-1
      book: 公民與社會3 選擇與永續
      chapter: 契約自由與財產權保障
      title: 契約自由
      std: true
