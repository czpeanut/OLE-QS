- id: doc_109_台北_建國中學_數學_數B_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 試問有多少個實數 x 滿足$\frac{\pi}{2}$ ≤ x ≤ $\frac{3\pi}{2}$且 cosx° ≤ cosx？
  options:
  - label: A
    content: 0 個
  - label: B
    content: 1 個
  - label: C
    content: 2 個
  - label: D
    content: 4 個
  - label: E
    content: 無窮多個
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '∵π ≈ 3.14 且$\frac{\pi}{2}$ ≤ x ≤ $\frac{3\pi}{2}$

    ∴1.57° ≈ $\left( \frac{\pi}{2} \right) ^{^{\circ}}$ ≤ x° ≤ $\left( \frac{3\pi}{2} \right) ^{^{\circ}}$ ≈ 4.71°

    故 cosx°＞0

    又 cosx ≤ 0，當$\frac{\pi}{2}$ ≤ x ≤ $\frac{3\pi}{2}$

    故不存在 x∈$\left[ \frac{\pi}{2} , \frac{3\pi}{2} \right]$使得 cosx° ≤ cosx

    故選(A)'
- id: doc_109_台北_建國中學_數學_數B_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '如右圖，兩同心圓的半徑分別是 3 和 5，且$\overparen{AB}$的長度是 5，

    求陰影部分的面積是？'
  options:
  - label: A
    content: '8'
  - label: B
    content: '16'
  - label: C
    content: 4π
  - label: D
    content: 8π
  - label: E
    content: $\frac{20\pi}{3}$
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_109_台北_建國中學_數學_數B_g11s1e1/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 476.4
      - 186.05
      - 564.3
      - 267.7
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '由扇形弧長公式可知

    5＝$\overline{OA}$．∠BOA＝5．∠BOA

    ⇒ ∠BOA＝1（弳）

    故陰影面積為

    $\frac{1}{2}$．$5^{2}$．1－$\frac{1}{2}$．$3^{2}$．1＝8

    故選(A)'
- id: doc_109_台北_建國中學_數學_數B_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 牆上有一時鐘，其半徑為 50 公分，若早上 8 點整<u>小瑛</u>起床，則<u>小瑛</u>發現時針與分針重合時是經過幾分鐘後？
  options:
  - label: A
    content: 43 分鐘
  - label: B
    content: $\frac{480}{11}$分鐘
  - label: C
    content: 44 分鐘
  - label: D
    content: $\frac{490}{11}$分鐘
  - label: E
    content: 45 分鐘
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '設經過 t 分鐘後重合

    則時針和 12 點鐘方向夾角角度為 8×30°＋$\frac{t}{60}$×30°＝240°＋$\left( \frac{t}{2} \right) ^{^{\circ}}$

    分針和 12 點鐘方向夾角角度為$\frac{t}{60}$×360°＝（6t）°

    ⇒ 240°＋$\left( \frac{t}{2} \right) ^{^{\circ}}$＝（6t）°

    ⇒ 240＝$\frac{11}{2}$t

    ⇒ t＝$\frac{480}{11}$

    故選(B)'
- id: doc_109_台北_建國中學_數學_數B_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 化簡$\sqrt{1+\sin 340^{^{\circ}}}$－$\sqrt{1-\sin 340^{^{\circ}}}$之值可表為
  options:
  - label: A
    content: 2 cos10°
  - label: B
    content: 2 sin10°
  - label: C
    content: －2 cos10°
  - label: D
    content: －2 sin10°
  - label: E
    content: 以上皆非
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\sqrt{1+\sin 340^{^{\circ}}} -\sqrt{1-\sin 340^{^{\circ}}}$

    ＝$\sqrt{\sin ^{2}170^{^{\circ}}+\cos ^{2}170^{^{\circ}}+2 \sin 170^{^{\circ}}\cos 170^{^{\circ}}}$－$\sqrt{\sin ^{2}170^{^{\circ}}+\cos ^{2}170^{^{\circ}}-2 \sin 170^{^{\circ}}\cos 170^{^{\circ}}}$

    ＝｜sin170°＋cos170°｜－｜sin170°－cos170°｜

    ＝｜sin10°－cos10°｜－｜sin10°＋cos10°｜

    ＝－（sin10°－cos10°）－（sin10°＋cos10°）＝－2 sin10°

    故選(D)'
