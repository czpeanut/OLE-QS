  stem: 某島嶼面積約為 10,000 平方公里，若採用五萬分之一的比例尺繪製島嶼全圖，理論上需要多少張 100×100 公分的壁報紙才能涵蓋全島？
  options:
  - label: A
    content: 1 張
  - label: B
    content: 4 張
  - label: C
    content: 10 張
  - label: D
    content: 40 張
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '島嶼面積 10,000 平方公里須由 100 公里×100 公里得出，在五萬分之一的比例尺中，1 公分代表 500 公尺（0.5 公里），圖紙上邊長 100 公分代表 50 公里，因此需要(B) 4 張圖畫紙。

    13.4 個備選網格中，0305 與 0506 兩格的病媒蚊密度最高，其中 0305 的人口數量大，與平均氣溫差也較大，因此(B) 0305 應為 4 個選項最優先的警戒區。

    14.∠BAD 為 80 度，C 點為 180°經度，則 AEB 連線應為東經 140 度，故答案選(B)。

    15.(A)圖書館文獻屬於二手資料、訪談與地理實察屬於一手資料。(B)小雅進行的階段屬於蒐集資料。(D)民族問題無法以折線圖呈現。

    16.(C)此圖屬於點子圖，能表達出約略的人口分布與數字，可由點子分布在東北部密度高，得知人口較稠密。

    17.因題幹已說明涵蓋範圍及圖幅大小都相同，可知 2 圖比例尺應該相同，(B)選項無法判斷。

    18.TM 2 坐標中 X 坐標是表示離假想 X 軸（東經 121 度往西推移 250 公里）的公里數，因此 303 為距東經 121 度有 53 公里遠；Y 坐標則標示距赤道的距離。故答案選(B)。

    19.GPS 坐標會每隔固定時間記錄一次坐標，上坡時因前進進度緩慢，點坐標會密集接近，下坡則相反，因此間距最開的甲應為①下坡路段，最密集的丁應是痛苦的④上坡路段，丙為走走停停的②公車，點最平均的乙則為③步行。依據①②③④順序，GPS 軌跡依序為(D)甲丙乙丁。

    20.(A)應為相切於一點。(B)愈外圍變形愈大。(C)無法判斷。(D)最外圈應為南極點。此題無法作答。

    21.愈高緯的經線圈萎縮明顯，直線路徑最短，故答案選(D)丁→甲。

    22.4 地的幼年、壯年、老年比例依序為甲（20 ％、60 ％、20 ％）、乙（20 ％、70 ％、10 ％）、丙（10 ％、80 ％、10 ％）、丁（10 ％、70 ％、20 ％），故答案選(B)乙。

    23.(B)(甲)道路、(丙)拍攝地點、(戊)斷層線等點、線資料，適合以能精準呈現的向量模式記錄。

    24.(A)甲圖等高線倒 V 指向高處，為河谷地形。反之為山脊，故(B)乙圖正確。(C)丙圖一條等高線間距為 200 公尺，F 點高度應介於 2,500 ～ 2,700 公尺之間。(D) cd 之間水平距離短，坡度較陡。

    25.(乙)(丁) 2 項研究牽動的面相較多，偏向區域複合體分析。

    26.(B)拓撲地圖以展現站次順序正確為重點。

    27.地圖要進行疊圖分析之前須確定(A)比例尺、投影系統、坐標系統一致。

    28.空間傳統以討論空間分布為重心，故(A)甲戊正確。

    29.臺灣的對蹠點為(A)南半球的巴拉圭（翰版課本已修正為阿根廷）。

    30.TM2 坐標中 X 坐標是表示離假想 X 軸（東經 121 度往西推移 250 公里）的公里數，因此 227 位東經 121 度西側有 23 公里遠；Y 坐標則標示距赤道的距離。故答案選(D)(乙)(丁)。

    31.(丙)要能精確判讀街道圖需要大比例尺圖；(戊)大量街道匯集的地區應為商業區。

    32.人口密度面量圖適合以(B)等積投影法，做為底圖繪製。(A)為正形的圓錐投影。(C)為距離正確的方位投影。(D)為方向正確的等角投影。

    33.衛星影像是直接拍攝地表樣貌，因此(D)(丙)沒有選擇與概括化，(丁)也沒有圖例。

