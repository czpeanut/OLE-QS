  stem: 一光線由介質甲經介質乙進入介質丙，光的路徑如右圖所示。已知介質間的界面均互相平行且θ$_{1}$＞θ$_{3}$＞θ$_{2}$。若三種介質的折射率分別為$n_{甲}$、$n_{乙}$和$n_{丙}$，光在此三種介質中的速率分別為$v_{甲}$、$v_{乙}$和$v_{丙}$，則下列選項中的大小關係哪些正確？【改自研究試題】
