  answer_status: verified
  answer_source: answer_key
  explanation: θ$_{1}$＞θ$_{3}$＞θ$_{2}$ ⇒ $n_{甲}$＜$n_{丙}$＜$n_{乙}$ ⇒ $v_{甲}$＞$v_{丙}$＞$v_{乙}$。故選(A)。
