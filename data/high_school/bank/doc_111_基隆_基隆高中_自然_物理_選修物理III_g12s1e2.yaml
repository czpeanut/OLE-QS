  stem: 在楊格雙狹縫實驗中，光屏和狹縫的距離2.0 m，兩狹縫間距為0.05 mm。將兩不同波長的單色光同時垂直照射雙狹縫，結果發現有均勻暗紋分佈，如圖所示。圖中粗線為重疊暗紋，細線為單一暗紋，而重疊暗紋與其緊鄰的單一暗紋間的距離為1.4 cm。已知此兩單色光，其中一波長為另一波長的整數倍。問此兩單色光的波長為何？【研究試題改】
  options:
  - label: A
    content: 1050 nm，525 nm
  - label: B
    content: 700 nm，175 nm
  - label: C
    content: 700 nm，350 nm
