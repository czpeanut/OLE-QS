  section: 1
  number: 1
  type: single
  page: 1
  stem: 在十七世紀時，牛頓提出光的微粒說，認為光是由極輕的微小粒子所構成，由此可以解釋光線直進、反射等現象，但下列哪些光學現象，無法用牛頓的微粒說解釋？【103學測改】
  options:
  - label: A
    content: 針孔成像實驗，其像上下顛倒、左右相反
  - label: B
    content: 肥皂泡在空中飄浮時，呈現絢麗的色彩
  - label: C
    content: 物體在燈光照射下，其背光處有明顯的影子
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)薄膜干涉用光的波動性解釋。故選(B)。
