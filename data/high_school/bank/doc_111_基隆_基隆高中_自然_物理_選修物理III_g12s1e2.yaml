  section: 1
  number: 6
  type: single
  page: 1
  stem: 雨過天晴，在與太陽位置相對的天空處，有時會出現虹及霓。下列有關虹及霓的敘述哪項正確？【聯考題改】
  options:
  - label: A
    content: 虹及霓都是日光經過水珠所產生的色散現象
  - label: B
    content: 霓的光度較弱，因為霓的形成過程中，光在水珠內多經歷一次折射及一次反射
  - label: C
    content: 霓的色彩中，紫色的仰角比紅色的仰角小
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)虹為光線在水珠內發生二次折射一次反射，霓為光線在水珠內發生二次折射二次反射，因此霓較虹多一次反射；(C)霓的色彩分布為外紫內紅，紫色的仰角較紅色仰角大。故選(A)。
