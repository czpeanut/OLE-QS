      - 710.2
      - 689.25
      - 786.85
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: Δ$y_{1}$＝$\frac{L\lambda _{1}}{d}$，1.4×$10^{－2}$＝$\frac{2\lambda _{1}}{0.05\times 10^{-3}}$，$\lambda _{1}$＝3.5×$10^{－7}$ (m)＝350 (nm)。 Δ$y_{2}$＝2Δ$y_{1}$，則$\lambda _{2}$＝$2\lambda _{1}$＝700 (nm)。故選(C)。
