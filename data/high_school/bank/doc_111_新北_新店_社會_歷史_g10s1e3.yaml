  stem: 幣原坦在臺北帝大「創設說明書」中指出，臺北帝大各科目是「以臺灣為中心對象而作研究，……在文政學科(部)方面有其他大學無法致力之南洋史學，又設有土俗學與人種學講座，特別在臺灣有其意義；在心理學方面著重民俗心理學，在言語學方面，教材多取東洋、南洋各地的言語，在倫理學方面，破除從來只講西洋倫理學，在此講座中特別涵蓋東洋倫理學。……在理農學部方面，一切的學科是以臺灣為中心，熱帶、亞熱帶作為對象進行研究，取其特有的動物、植物、生產等作為資料，在內容上有顯著特徵，自不待言。要之，文政學部或理農學部在東洋、南洋及熱帶諸研究土，在臺灣帝國大學與已成立之大學有許多前所未見之特色。」，請間，臺北帝大背後所反映的日本政策，也促使日治時期成立了哪些相關機構？
