  stem: 若 203 班共有 20 個同學，且同學們的座號編號為 1～20，明天老師將透過抽籤，抽到號碼籤的同學就是下學期的班長，請選出下列敘述正確的選項。
  options:
  - label: A
    content: 「子維：12 號同學跟老師感情最好，中獎的一定是 12 號」，這句話是客觀機率
  - label: B
    content: 「恆予：這個月超常抽到 10 號，根據統計，抽中 10 號的機率快接近 20 ％ 了」，這句話是客觀機率
  - label: C
    content: 「心佑：我這個人預測得很準，相信我，7 號一定是下學期班長」，這句話是主觀機率
  - label: D
    content: 「惜羽：假設籤是公平的，每個人被抽到的機率一樣是$\frac{1}{20}$」，這句話根據古典機率是正確的
  - label: E
    content: 「靖璇：20 人當中有 12 位女生，所以抽到女生當班長的機率比較大」，這句話根據古典機率是正確的
  answer:
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：應為主觀機率

    (B)○：有統計數據，為客觀機率

    (C)○：為主觀機率

    (D)○：敘述為真

    (E)○：敘述為真

    故選(B)(C)(D)(E)'
