- id: doc_112_台北_明倫_數學_數B_g11s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: '甲、乙兩所國中學生申請入學當地一所高中，預定錄取 468 名。已知報名人數為甲校 400 人，乙校 432 人。已知是否錄取與就讀學校是獨立的，右方列聯表中 a，b，c，d 分別為各欄位的人數，請選出下列正確的選項。

    |  | 錄取 | 未錄取 |

    | --- | --- | --- |

    | 甲校 | a | b |

    | 乙校 | c | d |'
  options:
  - label: A
    content: a＋b＝400
  - label: B
    content: b＋d＝300
  - label: C
    content: a ≤ c
  - label: D
    content: c ≤ d
  - label: E
    content: b ≤ c
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：a＋b 為報名甲校人數＝400

    (B)╳：b＋d＝400＋432－468＝364

    (C)○：∵是否錄取與就讀學校獨立

    ∴P（甲校錄取）＝P（甲校）×P（錄取）

    ⇒$\frac{a}{832}$＝$\frac{400}{832}\times \frac{468}{832}$

    ⇒ a＝225

    可得 c＝468－225＝243，

    b＝400－225＝175，

    d＝432－243＝189

    則 a ≤ c，c ≥ d，b ≤ c

    (D)╳：同(C)

    (E)○：同(C)

    故選(A)(C)(E)'
