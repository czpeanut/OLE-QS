  page: 1
  stem: 下列選項何者正確？
  options:
  - label: A
    content: 阿哲認為他有百分之一百二十的機率數學考試可以及格，此機率為主觀機率
  - label: B
    content: 阿軒擲一枚硬幣 100 次，其中有出現 40 次正面，得此硬幣出現正面的機率為 0.4，是客觀機率
  - label: C
    content: 小傑計算擲兩顆公正的骰子出現點數和為 7 的機率為$\frac{1}{6}$，是古典機率
  - label: D
    content: 若 A、B 為獨立事件，則 P（A∣B）＝P（B∣A）
  - label: E
    content: 若 A、B 為互斥事件，則 P（A∣B）＝P（B∣A）
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：機率不可超過 1

    (B)○：有統計數據，為客觀機率

    (C)○：$\frac{n ( ｛ ( 1 , 6 ) , ( 2 , 5 ) , ( 3 , 4 ) , ( 4 , 3 ) , ( 5 , 2 ) , ( 6 , 1 ) ｝ )}{6^{2}}$＝$\frac{6}{36}$＝$\frac{1}{6}$

    (D)╳：A、B 獨立時，P（A∣B）＝P(A)，P（B∣A）＝P(B)

    但 P(A)，P(B)不一定相等

    (E)○：A、B 互斥時，P（A∣B）＝0＝P（B∣A）

    故選(B)(C)(E)'
