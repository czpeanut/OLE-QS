- id: doc_112_新北_新北高中_社會_公民與社會_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 在某國立高中就讀的阿傑，因無故未到校參加朝會等重要集會，經勸導未改善，被學校記警告。阿傑不服懲處，決定採取權利救濟，他第一步應該怎麼做？
  options:
  - label: A
    content: 向學生申評會申訴
  - label: B
    content: 向教育部提起訴願
  - label: C
    content: 向地方法院提出訴訟
  - label: D
    content: 向大法官聲請釋憲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 學生救濟之程序原則上需先為訴願先行程序，也就是第一步必須向校內申訴評議委員會提出「申訴」，不服學校申訴決定，得向教育部提出「再申訴」（視同訴願），其後若不服再申訴決定者，得依法提起行政訴訟，故選(A)。
  tags:
