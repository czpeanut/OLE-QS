  type: single
  page: 3
  stem: '立法院於 2018 年 12 月 18 日三讀通過《憲法訴訟法》，於 2022 年 1 月後取代《司法院大法官審理案件法》。其重點包括：

    (一)裁判化：大法官組憲法法庭，審理法規範憲法審查、裁判憲法審查、機關爭議、總統副總統彈劾、政黨違憲審查、地方自治保障、統一解釋法律及命令等，審理結果以裁判宣告。

    (二)裁判憲法審查：為使大法官憲法審查效力擴及確定終局裁判，人民用盡審級救濟之案件，認有牴觸《憲法》者，得聲請憲法法庭為違憲宣告之判決，但並不是第四審，而是特殊救濟制度。

    (三)法庭之友：大法官違憲審查尚涉政治、經濟、社會各領域，為擴大專業意見之徵集，供憲法法庭審理參考。乃引進美國聯邦最高法院實務，讓各領域具備專業知識的人或組織可提供意見。

    (四)公開透明之程序：

    ①憲法法庭決議受理聲請案件後，於網站公開聲請書、答辯書。

    ②判決書應記載判決之大法官姓名及其同意與不同意立場，並標示主筆大法官。

    ③過去大法官釋憲是以會議方式行之，卷宗保密，也無閱卷。未來就當事人、訴訟代理人、辯護人聲請閱卷之程序，比照一般訴訟法制閱卷。

    (五)現行法就審查法律是否牴觸《憲法》時，應有出席人數三分之二以上同意。本次修正為大法官現有總額三分之二以上參與，大法官現有總額過半數同意，即作成違憲或合憲判決。

    (六)總統、副總統提出彈劾案，聲請憲法法庭為宣告彈劾成立之程序，不因被彈劾人卸任、立法院之解散、該屆立委任期屆滿而受影響。

    根據以上題文判斷，《憲法訴訟法》上路後，可能發生的狀況為何？'
