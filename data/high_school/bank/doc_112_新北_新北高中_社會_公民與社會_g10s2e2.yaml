  explanation: (A)憲法法庭網站將可以查詢受理案件之答辯書以及聲請書。(B)依題文為正解。(C)判決書應記載大法官的姓名以及其同意與不同意立場。(D)應經大法官現有總額三分之二以上參與評議，現有總額半數以上同意。
