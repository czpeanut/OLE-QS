  page: 1
  stem: 有關文中所述某甲健保的停保、復保及尋求行政救濟的行為，下列分析或說明何者符合我國現行法律規範？
  options:
  - label: A
    content: 健保署要求某甲補繳保險費屬於「給付行政」行為
  - label: B
    content: 某甲可自由選擇是否成為文中保險制度的納保對象
  - label: C
    content: 某甲的救濟程序應是訴願不服後向高等法院提出行政訴訟
  - label: D
    content: 政府機關在某甲的行政救濟過程中應給予其陳述意見權利
  group_stem: '<u>第 1.～ 3. 題為題組</u>

    在臺灣有戶籍的某甲自 2002 年間即長期居留國外，只有每年農曆春節才返國，陪伴父親過節後即出境，衛福部中央健康保險署依據《全民健康保險法施行細則》通知某甲依規定辦理復保，某甲未處理後，健保署於 2015 年核定某甲復保、停保日期，並要求某甲補繳復保至停保期間的保險費；某甲不服因此提出行政救濟程序，最後向憲法法庭聲請釋憲。憲法法庭判決指出，《全民健康保險法施行細則》就停保及復保所設要件，雖然就人民管理自身健康風險之自主決定權及財產權確已形成一定限制，但目的是為追求正當之公共利益，限制及差別待遇之手段與目的間具有合理關聯，然而停保及復保規範內容既屬限制人民權利重要事項，應該以法律或法律明確授權的命令定之，《全民健康保險法施行細則》第 37 條及第 39 條至遲於憲法法庭判決公告之日起屆滿 2 年時，失其效力，立法機關應儘速制訂法律或修法授權命令訂定停保及復保規範。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是干預行政。(B)全民健保是基於社會公益目的，強制全體民眾納保。(C)應是向高等行政法院提出行政訴訟。(D)符合正當行政程序的做法，為正解。
  tags:
