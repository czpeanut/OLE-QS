  stem: 志明先以偽造文件向區公所申請低收證明，再以該份文件向主管機關申請每個月的生活扶助費用。後經主管機關查證其先前所出示的文件造假，欲撤銷核發的補助費用。請依行政法原理原則判斷，主管機關可否撤銷該處分？
