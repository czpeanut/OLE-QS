  stem: 為了協助單身青年以及婚育家庭減輕租屋負擔，內政部從 2019 年 9 月起推動租屋補貼，總共 24,000 戶名額，依照各縣市補助金額有所不同，每月補貼 2,600 到 5,000 元。以臺中市為例，平均每人每月所得低於 34,533 元，家庭成員均無自有住宅，就符合申請資格。如果從平等權的角度判斷，下列敘述哪些正確？
