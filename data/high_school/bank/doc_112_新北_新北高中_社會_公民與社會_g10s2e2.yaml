- id: doc_112_新北_新北高中_社會_公民與社會_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 文中的「甲原則」應為何項法律原則？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 誠信原則
  - label: C
    content: 法律保留原則
  - label: D
    content: 信賴保護原則
  group_stem: '某位農民依據《申請農業用地作農業設施容許使用審查辦法》向行政機關申請使用同意，興建農舍以包裝水果及儲存肥料，取得核發合法建照後開始動工，花費 200 餘萬元的工程在即將完工之際，卻因主管機關認定農地位於河川區域內，農舍工程已違反《水利法》及前述使用審查辦法等規定，因此原行政機關撤銷了原本核發建照。

    法界人士認為，該位農民可主張<u> 甲 </u>原則來捍衛自己的權利，因為行政機關之行政行為應前後一致，不能任意變更而失信於民，即使行政機關撤銷建照的行為實在非不得已，也應該有相對應的措施。

    阿文在跟同學阿武討論這個案例時，阿文認為《申請農業用地作農業設施容許使用審查辦法》的法律位階只是命令，應該不能做為核發建照或限制農民權利的依據，但是阿武查詢後發現此項辦法是依《農業發展條例》訂定的，因此符合<u> 乙 </u>原則，該位農民本來就可依辦法取得建照。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文「工程在即將完工之際，卻因主管機關認定農地位於河川區域內，農舍工程已違反《水利法》及前述使用審查辦法等規定，因此原行政機關撤銷了原本核發建照」，可知該情形違反信賴保護原則；信賴保護原則的法理基礎是為了保障人民的基本權，維護法律的安定性，即指法律應該保障人民對公權力行使結果所產生的合理信賴，故選(D)。
