  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知向量$\vec{a}$與$\vec{b}$所張成的平行四邊形面積為 4，則下列哪兩個向量所張成的平行四邊形面積為 12？
  options:
  - label: A
    content: $2\vec{a}+ 3\vec{b}$及$\vec{b}$
  - label: B
    content: $3\vec{a}+ 5\vec{b}$及$\vec{b}$
  - label: C
    content: $3\vec{a}- 2\vec{b}$及$- 3\vec{a}+ 3\vec{b}$
  - label: D
    content: $\vec{a}- 3\vec{b}$及$\vec{a}$
  - label: E
    content: $3\vec{a}$及$2\vec{b}$
  explanation: '設$\vec{a}$＝（$a_{1}$，$a_{2}$），$\vec{b}$＝（$b_{1}$，$b_{2}$）

    則$∣ \left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| ∣ = 4$

    (A)╳：$2\vec{a}+ 3\vec{b}$＝2（$a_{1}$，$a_{2}$）＋3（$b_{1}$，$b_{2}$）＝（$2a_{1}$＋$3b_{1}$，$2a_{2}$＋$3b_{2}$）

    $∣ \left| \begin{matrix}2a_{1} + 3b_{1} & b_{1} \\ 2a_{2} + 3b_{2} & b_{2}\end{matrix} \right| ∣$＝$∣ \left| \begin{matrix}2a_{1} & b_{1} \\ 2a_{2} & b_{2}\end{matrix} \right| ∣$＝$∣ 2 \left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| ∣$＝8

    (B)○：$3\vec{a}+ 5\vec{b}$＝3（$a_{1}$，$a_{2}$）＋5（$b_{1}$，$b_{2}$）＝（$3a_{1}$＋$5b_{1}$，$3a_{2}$＋$5b_{2}$）

    $∣ \left| \begin{matrix}3a_{1} + 5b_{1} & b_{1} \\ 3a_{2} + 5b_{2} & b_{2}\end{matrix} \right| ∣$＝$∣ \left| \begin{matrix}3a_{1} & b_{1} \\ 3a_{2} & b_{2}\end{matrix} \right| ∣$＝$∣ 3 \left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| ∣$＝12

    (C)○：$3\vec{a}- 2\vec{b}$＝3（$a_{1}$，$a_{2}$）－2（$b_{1}$，$b_{2}$）＝（$3a_{1}$－$2b_{1}$，$3a_{2}$－$2b_{2}$）

    $- 3\vec{a}+ 3\vec{b}$＝－3（$a_{1}$，$a_{2}$）＋3（$b_{1}$，$b_{2}$）＝（－$3a_{1}$＋$3b_{1}$，－$3a_{2}$＋$3b_{2}$）

    $∣ \left| \begin{matrix}3a_{1} - 2b_{1} & - 3a_{1} + 3b_{1} \\ 3a_{2} - 2b_{2} & - 3a_{2} + 3b_{2}\end{matrix} \right| ∣$＝$∣ \left| \begin{matrix}3a_{1} - 2b_{1} & b_{1} \\ 3a_{2} - 2b_{2} & b_{2}\end{matrix} \right| ∣$＝$∣ \left| \begin{matrix}3a_{1} & b_{1} \\ 3a_{2} & b_{2}\end{matrix} \right| ∣$

    ＝$∣ 3 \left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| ∣$＝12

    (D)○：$\vec{a}- 3\vec{b}$＝（$a_{1}$，$a_{2}$）－3（$b_{1}$，$b_{2}$）＝（$a_{1}$－$3b_{1}$，$a_{2}$－$3b_{2}$）

    $∣ \left| \begin{matrix}a_{1} - 3b_{1} & a_{1} \\ a_{2} - 3b_{2} & a_{2}\end{matrix} \right| ∣$＝$∣ \left| \begin{matrix}- 3b_{1} & a_{1} \\ - 3b_{2} & a_{2}\end{matrix} \right| ∣$＝$∣ 3 \left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| ∣$＝12

    (E)╳：$3\vec{a}$＝3（$a_{1}$，$a_{2}$）＝（$3a_{1}$，$3a_{2}$）

    $2\vec{b}$＝2（$b_{1}$，$b_{2}$）＝（$2b_{1}$，$2b_{2}$）

    $∣ \left| \begin{matrix}3a_{1} & 2b_{1} \\ 3a_{2} & 2b_{2}\end{matrix} \right| ∣$＝$∣ 6 \left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| ∣$＝24

    故選(B)(C)(D)'
