questions:
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有位導演計畫拍攝一部以耶穌會傳教士利瑪竇為主角的歷史劇，請問在這部戲劇作品中，飾演利瑪竇的演員最有可能會說出下列哪一句臺詞？
  options:
  - label: A
    content: 中國信徒在接受天主教信仰後，應該避免過去祭祖、祀孔的習俗
  - label: B
    content: 康熙皇帝實行的禁教政策對天主教在中國的發展造成很大的打擊
  - label: C
    content: 有部分中國士大夫對西方的天文學與數學等知識有很濃厚的興趣
  - label: D
    content: 經過多年的努力，天主教與西學知識在中國社會已變得相當普及
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 英、美、法三國當局原本聲稱對某一事件保持「中立」的立場。後來，為了維護在華利益和威脅清政府，1854年4月，英美迫使清政府與英、美、法當局談判，談判的結果為：清廷出讓上海海關和租界主權，以換取外國的支持。請問題幹中提到的「事件」為下列何者？
  options:
  - label: A
    content: 亞羅號船事件
  - label: B
    content: 太平天國之亂
  - label: C
    content: 牡丹社事件
  - label: D
    content: 義和團事件
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 資料一：此派高唱立國之道，尚禮義不尚權謀，……而模仿西法是「用夷變夏」，毀棄傳統倫理道德。資料二：今日和議既成，中外貿易有無交通，……不過一二年，火輪船必為中外官民通行之物，可以剿髮捻，可以勤遠略。有關兩則資料對自強運動態度，下列敘述何者正確？
  options:
  - label: A
    content: 兩則資料都持支持態度
  - label: B
    content: 兩則資料都持反對態度
  - label: C
    content: 資料一採支持態度，資料二採反對態度
  - label: D
    content: 資料一採反對態度，資料二採支持態度
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 清代中葉後，中國西南、西北地區陸續發生回民起來叛變的事件。下列何者「非」雲南回變的原因？
  options:
  - label: A
    content: 回民和漢人發生衝突時，地方官通常偏袒漢人
  - label: B
    content: 受太平天國的影響
  - label: C
    content: 回民的宗教與風俗習慣與漢人迥異，易形成民族衝突
  - label: D
    content: 雲南地方官支持回族團練屠殺漢人
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 一位英國商人五年前來到中國廣州經商，與中國人民發生衝突，立刻被當地官署糾正處罰。五年後，這位商人再度來到中國廣州經商，又與中國人民發生衝突，結果當地官署卻無法處罰他。請問這位英國商人大概是在何時再度來到中國？
  options:
  - label: A
    content: 1840年鴉片戰爭前後
  - label: B
    content: 1860年英法聯軍前後
  - label: C
    content: l895年甲午戰爭前後
  - label: D
    content: l900年八國聯軍前後
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 清末中國因哪一場對外戰役失敗，使列強對清廷提出租借港灣等要求，導致中國陷入被瓜分的危機？
  options:
  - label: A
    content: 甲午戰爭
  - label: B
    content: 第一次英法聯軍
  - label: C
    content: 中法戰爭
  - label: D
    content: 八國聯軍
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 1960年代後期，李光耀在新加坡獨立初期，曾說：「慢慢的，世人會知道，新加坡姓李、姓高、王、楊、林的人們，外表上是中國人，說著華文，然而卻與中國人不同。我們有中國人的血統，我們不否認這點。但重要的是，我們以新加坡的立場思考，關心新加坡的權益，而不是以中國人的立場，為中國人的權益著想。」關於上述這段資料，我們可以怎麼解讀？
  options:
  - label: A
    content: 李光耀認為「新加坡人」的意識比起血統更重要
  - label: B
    content: 有中國人的血統，就不太可能以新加坡立場思考
  - label: C
    content: 不管身在何處，擁有相同血脈，就永遠是中國人
  - label: D
    content: 新加坡姓李的中國人，多數為中國人的權益著想
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「上海城市近代化拓展，由租界肇始而改變了上海舊城的面貌。『租界』最初被劃定時不過是上城外的一片荒野之地，然而現代化以後的『租界』之所以興起，最基本的原因是在中國最動亂的年代，西方列強提供了安全的保障，吸引了全國的富室巨商及其資本向租界集中。每次戰爭動盪，不論是從小刀會的起義、太平天國事變、辛亥革命、軍閥混戰，迫使各地的富人大量攜資移居上海租界避難，同時也使大量難民紛紛湧入租界，成為廉價的勞動力，促使租界地區人口和財富的迅速積累。同時在西方列強建設租界地的同時，也把當時先進的市政建設、公共事業及西方治理城市的方法和物質文明帶進上海，因此上海二、三○年代，都市的繁華到達頂點。」就以上資料論述的重點說明，下列何者最為合理？
  options:
  - label: A
    content: 上海是中國認識西方文明的窗口
  - label: B
    content: 上海成為中國之金融中心的原因
  - label: C
    content: 肯定西方列強對上海建設的貢獻
  - label: D
    content: 租界的劃定與上海現代化的關係
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 某一時期，某國推行下列政策：廢除封建制度、強化中央集權、興築新式鐵路、扶植大型私人企業、廢除階級制度、停用陰曆、改用太陽曆、制定國民義務教育、推行愛國教育、實施徵兵制。下列關於前文的分析，何者最為合理？
  options:
  - label: A
    content: 某國為日本，時間為19世紀下半葉
  - label: B
    content: 某國為越南，法國在此推行現代化政策
  - label: C
    content: 某國為朝鮮，這是開港後的現象
  - label: D
    content: 某國為中國，時代背景為新文化運動
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 東干族是指遷移到中亞的中國回族後裔，主要信奉伊斯蘭教，人口約10萬，在各中亞國家屬少數民族。請問下列哪一事件造成東干族的遷徙？
  options:
  - label: A
    content: 曾國藩收復南京
  - label: B
    content: 左宗棠收復新疆
  - label: C
    content: 李鴻章平定捻亂
  - label: D
    content: 雲南回變後跨境逃到中南半島
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 在某部電影中出現了以下的場景：十幾位留著辮子的東方男子拿著鐵鎚在剛鋪設的鐵軌上敲打著，他們穿著布褲短衫，衣著有點破爛，看起來瘦弱不堪，白人監工在現場吆喝著指揮他們工作，不久之後，一旁的山壁傳來一聲巨響，原來是火藥爆破將山壁炸破了一個洞，只見一陣慌亂，因為有幾位工人當場被炸死了。這部電影的時代背景最有可能是
  options:
  - label: A
    content: 1850年，南洋
  - label: B
    content: 1860年，古巴
  - label: C
    content: l870年，美西
  - label: D
    content: l920年，美東
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 以下為國共兩黨之間在歷史上互動的過程： 甲：國民政府五度對中國共產黨在江西的根據地中央蘇區進行「圍剿」行動。 乙：中共在中國國民黨內部發展迅速，引起國民黨內激烈政治分歧。 丙：中國共產黨員以個人名義加入中國國民黨，建立「革命統一戰線」方針。 丁：提出《整理黨務案》，將共黨排擠出國民黨，並打擊國民黨左派。 將以上事件依時間順序排列，正確的選項為何？
  options:
  - label: A
    content: 甲→乙→丙→丁
  - label: B
    content: 乙→丙→丁→甲
  - label: C
    content: 丙→乙→丁→甲
  - label: D
    content: 丁→丙→乙→甲
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 阮朝建立之初優待朝中的法籍人士，並讓法國商船到越南貿易，但之後越、法關係逐漸轉趨惡化，法人更對越南統治者有所不滿，批評他「將法國人的恩惠拋諸腦後，與歐洲人為敵」，請問上述「法國人的恩惠」指的應該是
  options:
  - label: A
    content: 協助阮朝抵禦外敵入侵
  - label: B
    content: 提供阮朝建設經費與物資
  - label: C
    content: 向阮朝宣揚天主教信仰
  - label: D
    content: 法國曾援助阮朝建立政權
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 伊籐博文曾得意的對外賓說：「西歐為了廢除封建制度，花費好幾百年，進行長時期戰爭。日本滴血未流、一彈未發，以三年不到的時間完成壯舉。」請問日本在下列何事之後完成此壯舉？
  options:
  - label: A
    content: 大政奉還
  - label: B
    content: 廢藩置縣
  - label: C
    content: 頒布憲法
  - label: D
    content: 廢除不平等條約
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 以下有三則資料：資料一：四譯館是禮部的附屬機構，掌接待諸藩朝貢使，主管有郎中、大使。資料二：清咸豐8年的中英法《天津條約》中規定「各國可派公使進駐北京」。資料三：清光緒27年的《辛丑條約》中，有一項條款：「改總理衙門為外務部，位居六部之首」。請問從資料一至資料二到資料三的演變，透露了怎樣的訊息？
  options:
  - label: A
    content: 清廷結交外人，想借外軍助剿民變
  - label: B
    content: 清廷天朝觀念轉趨淡薄，主動學習西方制度
  - label: C
    content: 列強加緊侵華，清廷被迫接受西方國際對等的觀念
  - label: D
    content: 中國京畿門戶大開,政府形同傀儡
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 民國成立至第一次帝制的復活止，關於國家領導權的轉變，何者正確？
  options:
  - label: A
    content: 總統制→內閣制→總統制
  - label: B
    content: 內閤制→總統制→內閣制
  - label: C
    content: 貫徹內閣制
  - label: D
    content: 堅持總統制
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 20世紀後期，印尼曾數次發生排華暴動，一度造成社會上的嚴重不安。關於這些暴動的發生原因，以下說明何者最符合事實？
  options:
  - label: A
    content: 因為當地華人長期擁有經濟地位的優勢，導致本地人心理上產生不平衡
  - label: B
    content: 因為華人為政治上的實質控制者，本地人不甘受政治壓迫
  - label: C
    content: 因為華人自成社群而不願融入當地社會，且經常以征服者自居
  - label: D
    content: 因為華人在殖民時代與荷蘭人合作，對本地人進行經濟剝削
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 有一群人，自19世紀起曾受到日本政府長達數十年的迫害，政府不僅要求他們放棄自己的傳統習俗、改學日語、取日本姓名，並鼓勵日本各地人民渡海移居拓墾。到了二次大戰前，當地的人口已經達到300萬人，但其中有超過半數是來自本島的日本人，他們在自己的土地上，逐漸由「主人」變為「客人」。經過多年的抗爭，日本政府終於在1997年通過針對該群人的文化振興法，並在2008年確認他們的地位。請問這是關於哪一群體的敘述？
  options:
  - label: A
    content: 朝鮮人
  - label: B
    content: 阿伊努族
  - label: C
    content: 臺灣人
  - label: D
    content: 琉球人
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有一位住在山西的美國婦女伊娃在1899年家書寫道：「我在這兒非常寂寞，事實上，我非常地憂鬱。你以為傳教士永遠都聰明、快樂、充滿希望嗎？也許有這種人，但絕對不在這裡。」到了1900年，伊娃和丈夫、女兒為躲避一場暴動而離開住所，沒多久即全部遇害。下列解讀何者正確？
  options:
  - label: A
    content: 英法聯軍之後，外人的傳教工作一直進行得很順利
  - label: B
    content: 伊娃一家人住在山西的美國租界內
  - label: C
    content: 文中指的暴動是義和團事件
  - label: D
    content: 中國內地民風純樸，對外國人都持別和善親切
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 20世紀初期，某位實業家說：「……不變政體，枝枝節節之補救無益矣也。……日、俄之勝負，立憲、專制之勝負也。今全球完全專制之國誰乎？一專制當眾立憲，尚可幸乎？」前文在說明哪件事情對清廷實施立憲運動有加分效果？
  options:
  - label: A
    content: 俄國成功干涉日本歸還遼東半島，使中國對俄國心存感激
  - label: B
    content: 日本取得與俄國對戰的勝利，社會輿論認為兩國的政治體制是決定勝敗的關鍵
  - label: C
    content: 俄國在中國東北占有廣大利益，清廷以聯日抗俄做為因應
  - label: D
    content: 日本與英國結盟，以俄國為假想敵，代表日本已是世界強國
- id: doc_108_高雄_道明_社會_歷史_g10s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 大航海時代開啟了亞洲大門．也影響到東亞的越南；面對西力的衝擊，在劇烈變化中，因應時代軌跡，進行調整，逐步邁向現代化的旅程。下列有關越南改革發展的敘述何者正確？
  options:
  - label: A
    content: 潘周楨為越南民族主義革命家，他主張「擁君反法」，希望爭取日本的軍事援助，並發起東渡留洋計畫
  - label: B
