  type: fill
  page: 1
  stem: '小綠綠的媽媽因個人喜好在家裡客廳選擇購置圓弧設計家具，請回答下列問題：

    (1) 客廳的茶几平面圖如下圖所示，桌面是由一個長2公尺、寬1公尺的矩形搭配寬的兩邊各加上一個弓型合併而成。如果已知這兩個弓型長相全等，且都是由一個直徑也是2公尺的圓形桌面(圖中以虛線圓示意)直接裁一直線而得。試問此茶几桌面的面積為多少平方公尺？

    (2) 客廳的沙發平面是一個像摺扇扇面的形狀，如下圖所示，此沙發的周長由一段大圓弧、一段小圓弧和兩條直線所構成，且兩圓弧所對應的圓周角一樣。若已知周長中的兩條直線長度皆為1公尺，且大圓弧和小圓弧的長度剛好差2公尺，則試問大小圓弧所對應到的圓心角為幾弧度？

    (3) 承上題，如果沙發的佔地面積為3平方公尺，則大圓弧長為多少公尺？'
