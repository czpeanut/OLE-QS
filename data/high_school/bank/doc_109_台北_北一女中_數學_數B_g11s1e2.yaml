  stem: '請搭配計算機回答下列問題：

    (1) 台北車站附近的新光三越大樓樓高約244.15公尺，小綠綠在二年忠班的教室(眼睛位置大約在13.5公尺高的地方)看新光三越大樓最高點的仰角角度大約是$\frac{\pi}{15}$弧度，試問二年忠班和新光三越大樓的水平距離大約是幾公尺？(四捨五入取到整數位)

    (2) 承上題，若是小綠綠在放學後經過總統府前看新光三越大樓最高點，此時小綠綠的位置和新光三越大樓的水平距離大約是800公尺，如果小綠綠的眼睛高度約在1.6公尺高度，則此時小綠綠看向新光三越大樓最高點的仰角大約是幾弧度？(四捨五入取到小點後第二位)'
