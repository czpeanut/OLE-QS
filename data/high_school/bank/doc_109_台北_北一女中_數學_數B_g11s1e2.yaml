- id: doc_109_台北_北一女中_數學_數B_g11s1e2_s3_1
  section: 3
  number: 1
  type: calc
  page: 1
  stem: '經過和EaTingMath的對話後，我們知道f (x)＝4 sin ( 3x＋$\frac{\pi}{2}$)－1的函數圖形可從y＝sin x圖形經過伸縮平移後得到，試回答下列問題：

    (1) 將y＝sin x的函數圖形上下伸縮成a倍後向上平移b單位，左右伸縮成c倍後向右平移d單位後便可以得到 f (x)＝4 sin ( 3x＋$\frac{\pi}{2}$)－1的函數圖形。試寫出一組符合條件的a、b、c、d值。

    (2) 請在表中根據3x＋$\frac{\pi}{2}$的值填入相對應的x、sin ( 3x＋$\frac{\pi}{2}$)、4 sin ( 3x＋$\frac{\pi}{2}$)－1的值。

    | 3x＋$\frac{\pi}{2}$ | 0 | $\frac{\pi}{2}$ | π | $\frac{3\pi}{2}$ | 2π |

    | --- | --- | --- | --- | --- | --- |

    | x |  |  |  |  |  |

    | sin ( 3x＋$\frac{\pi}{2}$) |  |  |  |  |  |

    | 4 sin ( 3x＋$\frac{\pi}{2}$)－1 |  |  |  |  |  |

    (3) 承上題，根據表中得到的五組x和4 sin ( 3x＋$\frac{\pi}{2}$)－1的值，在圖中標示對應到的點坐標，並畫出坐標平面範圍中的 f (x)＝4 sin ( 3x＋$\frac{\pi}{2}$)－1函數圖形(請務必在點的旁邊註明清楚坐標，函數圖形盡量畫完整)。

    (4) 函數f (x)＝4 sin ( 3x＋$\frac{\pi}{2}$)－1的振幅和週期分別為何？'
  answer:
  - (1) a＝4，b＝－1，c＝$\frac{1}{3}$，d＝$\frac{-\pi}{6}$；
