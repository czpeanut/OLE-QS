  stem: 原訂2019年12月開始，泰國簽證新制上路，必須要上網申請電子簽證，還要附上近3個月的財力證明，但我國對泰國旅客給予免簽證的優惠，這讓觀光業者批評兩國互惠不對等。泰國貿易經濟辦事處則發出聲明，表示電子簽證系統會通行全球，財力證明並非只針對我國。此外，辦事處也強調為了讓申請人有充分準備時間，新制暫緩延後到2020年3月1日實施。不過，旅行公會認為，檢附財力證明根本就是把我國當成第三世界國家，呼籲外交部宣布停止泰國來臺免簽證優惠反制，並揚言抵制組團赴泰旅遊。從此案例觀察，下列關於國家主權行使之敘述，何者正確？
  options:
