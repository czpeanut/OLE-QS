- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s2_28
  section: 2
  number: 28
  type: single
  page: 4
  stem: 劉小明取得雙重國籍後，被服務的公立醫院免職，他不服向大法官聲請釋憲，請問：依上文敘述下列哪些可能是他聲請釋惠的理由？(甲)人民有工作選擇的自由，政府不應加以干涉職業選擇；(乙)人民有選擇國籍的自由，個人選擇其他國籍不應受限；(丙)人民因雙重國籍任公職而免職，影響憲法保障的工作權；(丁)人民公務員身分受雙重國籍影響，違反憲法上的平等權
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丙
  - label: D
    content: 甲丁
  group_stem: 劉小明（化名）為臺北市立某公立醫院醫師，2004年取得加拿大國籍，被市政府衛生局發現，認為他具公務員身分卻同時擁有臺、加國籍，違反《醫事人員人事條例》、《公務人員任用法》，核定免職。劉小明不服，2014年聲請釋憲，主張相關法令違反「法律明確性」、「比例原則」、「人民服公職權」、「平等權」，侵害他的工作權。 大法官審查後做出釋字768號解釋，公務員代表國家履行公共任務，與國家恆處於特別緊密的忠誠、信任關係，因此國家就兼具外國國籍者是否適於擔任公務人員，應有較大裁量空間。因此，限制目的如屬正當，手段與目的之達成間具有合理關聯，就沒有違反比例原則，因此《醫事人員人事條例》等相關法律禁止雙重國籍者任公職，屬「合憲」。
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s2_29
