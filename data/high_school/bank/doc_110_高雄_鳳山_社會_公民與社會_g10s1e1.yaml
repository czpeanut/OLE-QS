- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 司法院釋字649號解釋文中說明：《身心障礙者保護法》中規定，非視覺障礙者不得從事按摩業，與《憲法》第7條平等權不符，有關此法違憲的說明，何者正確？
  options:
  - label: A
    content: 只有視障者可以從事按摩業，會加深社會大眾產生負面標籤
  - label: B
    content: 視障者間障礙程度不一，忽略視障者內部優勢或弱勢的差異
  - label: C
    content: 限制視障者只能從事按摩業，反而造成視障者的工作權限制
  - label: D
    content: 對視障者的差別待遇，造成對非視障者的限制其合理性不足
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 我國某航空公司空服員為要求合理的勞動條件而發動罷工，最終成功迫使資方讓步，也帶動後續的機師罷工及其他航空公司的勞權抗爭。請問：上述呈現的公民權利發展面向，最近似於何者？
  options:
  - label: A
    content: 因應人口高齡化現象故要求政府健全長期照護機制
  - label: B
    content: 爭取讓18歲青年擁有投票資格以促進其共參與
  - label: C
    content: 為維護民族固有的狩獵傳統因此鬆綁保育法規限制
  - label: D
    content: 重症病患呼籲政府讓安樂死合法化以減少病痛折磨
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 國後島位於日本北海道東北，日本將它與齒舞、色丹、擇捉三島並稱北方四島。此四島原為日本領土，第二次世界大戰後，此四島先後為蘇聯、俄羅斯管轄。日本政府要求人民不能申請俄羅斯簽證進入四島，因為若以俄羅斯簽證登島，即代表下列何種意義？
  options:
  - label: A
    content: 承認四島為俄羅斯領土，俄羅斯享有主權
  - label: B
    content: 代表放棄日本國籍，改為取得俄羅斯國籍
  - label: C
    content: 俄羅斯對四島具有行政權，主權仍歸日本
  - label: D
    content: 俄羅斯政府可設立觀光局，招攬日本遊客
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 頓內茨和盧甘斯克位於烏克蘭東部，緊鄰俄羅斯，俄語人口偏多。2014年，頓內茨與盧甘斯克自行辦理公投，要求脫離烏克蘭獨立，公投結果兩地都以80%以上的高票通過獨立，成立頓内茨共和國舆盧甘斯克共和國，由俄國支持的分離主義分子治理，但未獲西方國家及聯合國承認。不過俄羅斯總統普丁在2019年簽署行政命令，讓上述兩地的居民能在提出申請的3個月內輕易獲得俄國護照，請問：此舉對俄烏兩國的意義，該如何評析最為恰當？
  options:
  - label: A
    content: 俄羅斯在其領土內行使主權應當不容他國勢力干涉
  - label: B
    content: 烏克蘭的領土及主權完整性受俄國挑戰而陷入危機
  - label: C
    content: 俄羅斯的主權地位高於烏國故干涉其內政尚屬合理
  - label: D
    content: 烏克蘭已無權力賦予公投地區的人民各項權利義務
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 若僅依據我國《憲法增修條文》及《臺灣地區與大陸地區人民關係條例》的相關內容，並對應下表來界定「中華民國」的領土及主權，則最合理的推論為？
  options:
  - label: A
    content: 甲乙兩者皆應填入「有」
  - label: B
    content: 丙丁兩者皆應填入「無」
  - label: C
    content: 甲應填「有」，乙應填「無」
  - label: D
    content: 丙應填「有」，丁應填「無」
