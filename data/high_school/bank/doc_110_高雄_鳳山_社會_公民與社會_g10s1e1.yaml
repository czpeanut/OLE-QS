  group_stem: 新北市某名男子因為兒子買回來的肉圓沒加辣，竟氣憤掌摑兒子，又鎖喉妻子，消息一出郷民群起激憤，衝到其家中對該男子動私刑，2名鄉民被警方依《社會秩序維護法》送辦，新北地方法院日前裁罰2人各2000元。法官認為，2男出手毆打男子，但事後都留在現場，並主動向警坦承有施暴行為，表示願意負起法律責任，算態度良好，但法官強調，動用私刑而行私法正義並非正義，無法處理社會紛爭，應主動報請警察、檢察官依正當法律程序介入處理。
