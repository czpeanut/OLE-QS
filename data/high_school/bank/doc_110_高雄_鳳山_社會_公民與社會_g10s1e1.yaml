  stem: 從文中劃線部分，從遴選環委的條件來看，環保署列為首要的課責機制應該是？
  options:
  - label: A
    content: 政府資訊的透明性
  - label: B
    content: 參與成員的代表性
  - label: C
    content: 對於人民的回應性
  - label: D
    content: 公私協力的可能性
  group_stem: 環保署罕見特別為環評委員遴選舉行記者會。會中指出，第12屆環委任期於2019年7月底屆滿，將公開接受各界推薦專家學者擔任第13屆環委。 環委為無給職，每任為2年，可以續任1次，但依規定每屆環委需半數更新，也就是下一屆至少有7位新任委員。不少人認為這個工作吃力不討好，面對各大小環境評估案件，逃不了各界的輿論和壓力，甚至有環委私透露，有時在會議上表達的意見，會後都會收到恐嚇訊息。不過環保署表示，想擔任委員必須先同意「被直播」，被推薦者須先簽署線上直播同意書，往後所有環評會議無分大小輕重，全都會在網路直播，影片還會上傳到YouTube，提供民眾重複觀看或下載。 結果第13屆環部委員名單公布後，各家報章雜誌紛紛追蹤報導，指出14位民間委員有6位是環工技術領域，社會環境專家少，顯得「專業領域失衡」，除此之外，已經連續2屆僅有1位女性委員，性別比例明顯失衡，也引起32個臺灣婦女團體以及民間組織共同譴責環保署「性別麻木」，性別平等專案小組3位外聘委員更是請辭以示抗議。
