  stem: 依據國會議員的發言，其認為「不能被容許的」原因可能為下列何者？
  options:
  - label: A
    content: 從軍的機會並沒有開放給所有人
  - label: B
    content: 募兵制所能給予的待遇條件太低
  - label: C
    content: 推動募兵制並無法落實實質平等
  - label: D
    content: 每個人擁有的先天資源都不均等
  group_stem: 「是否推動募兵制」在南韓被朝野政治人物拋出後，各界意見紛紛出籠，但多以批判與不贊成居多。根據Realmeter在2016年9月8日的民調結果顯示，有61.6%的受訪者，認為現行徵兵制應該維持，認為應轉換為募兵制者則有27%，其餘11.4%回答不清楚。 新世界黨國會議員公開回應了募兵制議題： 若以每月給予200萬元（約新台幣5萬多）為條件，實行募兵制，我們國家出身富裕家庭的兒子們，幾乎不會有人從軍，只會剩下家境困難、貧窮的子女會去當兵。基於平等的要求，這是不能被容許的。 他認為，討論募兵制預算問題前，符合「正義」與否，更為重要。此外其他反對者則表示，在北韓核武裝與發射飛彈，造成南韓國民不安的現在，討論募兵制會讓人聯想是要放棄安保。 但也有人認為，徵兵制度亦存在不平等問題。「安全市民社會連帶」的代表在報章撰文指出： 財閥或是權力人家的子女，創造各種方法免除兵役，或是獲得較好職位或較好地區工作的機會，這種入伍歪風現象很多。 他認為，國家要徵集國民的子女們入伍，就必須要有合理的待遇；而推行募兵制將迫使軍方不得不改變，可有效解決軍隊叢生的腐敗、人權侵害與事故問題。
