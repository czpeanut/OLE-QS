- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 某市長在政見發表會中曾提出開採礦產自籌財源，以緩解市府財政赤字的政見，後來到議會說明市府的總預算編列時，遭到議員質詢為何沒有編列該政見的預算。請問：上述課責機制的運作，其屬性來源與何者最為相近？
  options:
  - label: A
    content: 記者對各地閒置的公共建設進行追蹤報導，以凸顯浪費公帑的問題
  - label: B
    content: 議會提供會議實況轉播服務，使民眾了解立法運作與民代問政表現
  - label: C
    content: 教育部邀集學者、教師、家長、學生等團體代表共同審議課程綱要
  - label: D
    content: 市政府建置線上服務平臺，讓市民能即時陳情檢舉並查詢處理進度
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 馬爾他騎士團的前身為成立於第一次十字軍東征之後的一個軍事組織，最初為保護本篤會耶路撒冷的醫護設施，同時也是宗教及慈善性質，且受國際法承認之主權實體，可發行自己的護照、郵票、貨幣及司法獨立等權利。自1798年失去馬爾他島後，就一直沒有屬於自己的領土。〔甲］聯合國並未將其分類為正式會員國家，而將其視為受邀之實體與國際組織；〔乙〕馬爾他騎士團目前與105個國家建立正式外交關係。請問：造成上述(甲)(乙)兩者差異的原因可能為何？
  options:
  - label: A
    content: 義務履行
  - label: B
    content: 主權承認
  - label: C
    content: 社會目的
  - label: D
    content: 政府統治
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 民主治理有一項重要的核心概念為課責（accountability）。其概念包含政府應扮演具強制力的負責機構，以及政府需對本身行為或政策，主動向人民提出解釋、說明與回覆。根據上述課責的敘述，下列例子何者正確？
  options:
  - label: A
    content: 總統上任後為實現競選諾言，要求教育部開始逐步推動教育改革
  - label: B
    content: 教育部研擬新課綱，交由地方教育局與各級學校協助宣傳、執行
  - label: C
    content: 各縣市教育局推廣政策時，聆聽各方家長意見，並作解釋與說明
  - label: D
    content: 各級公立學校確實執行教育局的政策，開始與他校進行校際合作
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 資訊不對稱乃源自於經濟學理論，意指市場出現一方擁有較多訊息，一方擁有較少訊息，進而衍生出一連串的問題。請問：資訊不對稱的出現會在人民與政府之間產生下列何種問題？
  options:
  - label: A
    content: 人民是訊息的蒐集與擁有者，因此政府往往無法得知人民的需求
  - label: B
    content: 政府應在相關政策訊息的發布上進行管制，避免人民藉訊息圖利
  - label: C
