  stem: 香港人在過去30年共有三波移民海外的浪潮。第一波是1989年中國天安門事件後，加上港人對於回歸中國的一國兩制有疑慮；第二波為香港回歸前兩年；第三波則是2010年之後，中國放寬國人旅遊香港，帶來高房價等社會問題，激化中港矛盾，以及收緊港人的言論自由尺度。前兩波因為臺灣剛解嚴，民主化剛起步，港人對臺灣民主沒信心，故多半移民至英國、加拿大等地，但在2014年香港爭取真普選失敗後，民主的臺灣便成為第三波移民首選。上述現象可看出影響港人國家認同的主因應該是？
