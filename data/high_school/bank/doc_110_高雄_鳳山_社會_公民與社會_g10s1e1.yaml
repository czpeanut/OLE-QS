  stem: 2018年11月24日舉行的九合一選舉中，包含地方民意代表選舉，根據《地方制度法》第33條規定「各選舉區選出之直轄市議員、縣（市）議員、鄉（鎮、市）民代表名額達四人者，應有婦女當選名額一人；超過四人者，每增加四人增一人。」請問：上述規範之目的與下列何者相同？
  options:
  - label: A
    content: 準公共化托育政策下，政府要求私立幼兒園舆公立幼兒園之教師薪水應一致
  - label: B
    content: 領取教育部公費者，畢業後須接受分發並服務一定年限
  - label: C
    content: 身心障礙者參加考試，得申請提早入場或延長作答時間
  - label: D
    content: 《民法》將「妻以夫之住所為住所」修訂為由雙方共同協議
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 玟龍在整理班會議題時，覺得與公民課中討論的社會正義有關，請依(甲)、(乙)、(丙)的順序，在下列選項中幫她找出正確的配對？
  options:
  - label: A
    content: 程序正義、分配正義、匡正正義
  - label: B
    content: 分配正義、程序正義、匡正正義
  - label: C
    content: 程序正義、匡正正義、分配正義
  - label: D
    content: 匡正正義、分配正義、程序正義
