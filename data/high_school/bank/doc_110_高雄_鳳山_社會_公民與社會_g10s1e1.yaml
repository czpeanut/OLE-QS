  stem: 英國在2016年6月23日公投選擇脫離歐盟，隨後英國政府與歐盟陸續開啟多場談判，內容包含未來貿易關係、公民權及「分手費」等重要議題。其中就公民權題，雙方協議會讓兩地公民權利獲得保障。因為根據《歐洲聯盟條約》規定，歐盟公民得以在其所居住的其他歐盟國家行使與該國公民相同的選舉權與被選舉權，以及向歐洲議會請願的權利。在這種形態下，對傳統主權國家產生什麼影響？
