  group_stem: 我國自2009 年起連續8年受邀以「中華臺北」（Chinese Taipei）觀察員身分參與世界衛生大會（WHA），而2017、2018、2019連續3年受打壓而中斷。但近年來卻也出現不少支持臺灣的國際聲量，包括美、日、德、加、紐、澳等數十個國家及代表為我國發聲，強調世界衛生組織（WHO）是技術性機構、不是政治機構，排除臺灣不僅使疾病控制出現缺口，罔顧臺灣兩千多萬人的健康，更使各國失去學習臺灣技術優勢的機會。然而，仍有代表團主張WHO應遵循聯合國2758號決議的法理基礎，臺灣最終仍未能受邀。
