  stem: 德國國會通過《女性及男性領導階層平等法〉所展現的平權意涵與我國何項政策最為相近？
  options:
  - label: A
    content: 要求媒體開放版面時段給民眾或團體使用以落實其人民使用媒體的權力
  - label: B
    content: 將子女一律從父姓的規定改為父母都有子女姓氏的決定權
  - label: C
    content: 設置客家族群專屬的電視頻道以維繫其語言及文化的傳承
  - label: D
    content: 偏鄉或社區高中學生能透過繁星推薦錄取臺大等頂尖大學
  group_stem: 德國國會通過《女性及男性領導階層平等法》，為德國社會及企業界帶來大震撼。此法核心內容如下： 一、上市公司的監事會必須在監事成員上，保障女性比例達30%。 二、2016年開始，各企業進行監事會改選時，必須嚴格遵守此規定。倘無法在改選時選出足額比例的女性，則必須遇缺不補。 三、約有3,500家中型企業不強制30%門檻，但必須提高女性在決策層的比例，包括監事、董事及高階經理人等。 聯邦家庭事務、老年、婦女及青年部部長稱該法是德國的歷史性進步。實施後將直接影響德國108家大企業，另外也規範了3,500家中型企業，以及所有官股企業。2018年開始，婦女保障比例甚至將提高至50%。 德國政府之所以大動作地強制企業保障女性主管比例，最直接的原因是：德國經濟仍由男性主導。據統計，在企業的監事會中，女性只有18.9%，而監事會女性多於男性的企業，全德只有2家。在董事會中，女性比例更只達5.7%，明顯比例不足。 德國已由女性總理執政多年，且女性人口數占全國人口半數以上、大學畢業程度也是女性多於男性，在一個以社會民主、公平而自豪的國家中，很難容許這樣性別不平等的現象。因此，相關的改革在德國已醞釀多年，但因牽涉產業走向，來自業界的壓力甚大，政府立場並非始終一致。雖然政府已強制推動這項平等政策，但是社會、輿論、學界、政界仍對該政策有許多爭議與批評。
