- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 社會設計是當代社會創新相當重要的關鍵趨勢，意指每一個地方都有屬於它的歷史文化或社會脈絡，核心價值便是要找到該地方的設計智慧，來解決當地所可能面臨到的挑戰、問題，使社會邁入成熟的設計社會。請問：下列有關社會設計的敘述何者正確？
  options:
  - label: A
    content: 社會設計中，政府須針對當地需求解決問題，屬於治理的概念
  - label: B
    content: 社會設計與民主治理的概念相同，因此更強調「責任」的概念
  - label: C
    content: 社會設計採取由上而下的決策過程，如此更能回應民主的需求
  - label: D
    content: 社會設計偏向專家參與治理模式，即參與專業委員會等的方式
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 近年來全球有近2，000個城市實施「參與式預算」，意即將公共預算部分的分配權交給人民，由當地居民共同審議預算計畫，並以投票方式決定支出的優先順序。上述制度與下列何種民主政治的概念相近？
  options:
  - label: A
    content: 衛福部召開公民審議會議，討論代理孕母制度的爭議
  - label: B
    content: 外交部長因為索羅門群島與我國斷交，負起政治責任
  - label: C
    content: 中選會委託各縣市選委會辦理明年的總統及立委選舉
  - label: D
    content: 鴻海企業併購日本面板大廠夏普，促進臺灣經濟發展
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 司法院近年推動「國民參與審判」制度，讓完全沒有審判專業知識、經驗的一般國民加入審判程序，參與聽訟、問案及最後判決的形成。司法院參考國外經驗顯示，來自不同社會階層、出身背景，擁有不同生活經歷的國民，得以直接在法院形成判決過程中，提供他們寶貴的生活經驗、法律感情，及不同的價值觀，有助於豐富法院的判斷視角及審判透明化。此制度的規劃、有助於建立民主課責下的何種效果？
  options:
  - label: A
    content: 行政過程的透明性
  - label: B
    content: 參與成員的代表性
  - label: C
    content: 提高政府的回應性
  - label: D
    content: 司法審判的強制性
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 芷芸參加全校班聯會主席的競選，他提出的競選口號是想要成為「正義使者」，為維護全校學生的公平正義而努力。請問：有關芷芸的政見內容敘述，下列何者正確？
  options:
  - label: A
    content: 為達到「分配正義」，校務會議應開放學生代表參與校規制定
  - label: B
    content: 為重視「匡正正義」，學校面對霸凌事件應研究預防輔導機制
  - label: C
    content: 為符合「程序正義」，每間教室都應架設功能齊全的投影設備
  - label: D
    content: 為實現「實質平等」，校內學生的權利義務都相等以杜絕特權
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 安達曼群島上的加洛瓦族是目前全球最原始部落之一。自然的生態環境提供他們生活所需，使得加洛瓦人可以與世隔絕。但隨著觀光客的進入，加洛瓦人染上外來疾病的人數增加，導致人口逐年減少；且遊客就像參觀動物園一樣，隨意丟食物給加洛瓦人，還有收賄員警命令加洛瓦族人跳舞娛樂觀光客，以交換食物。請問：加洛瓦人可能面臨下列何種困境？
  options:
  - label: A
    content: 遊客「逛動物園」的心態，嚴重影響加洛瓦人的自由權
  - label: B
    content: 若觀光客減少，族人以娛樂觀光客的工作權將受影響
  - label: C
    content: 因為外來疾病，短期内人口可能減少將會威脅其環境權
  - label: D
    content: 觀光客及員警可能迫使族人改變傳統生活，侵害文化權
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 新北市新店區達觀里是全國第一個執行「參與式預算」的行政區，選定解決山坡地、排水孔疏通及自來水問題等3案，已於2016年底全部執行完畢。推動此專案的市議員表示，這個做法讓公民參與不再只是選舉時的一張選票；里長也表示，雖然花費相當多的時間，但能讓民眾更關心公共事務。從民主治理的概念來看，最可能會採取下列何種模式？
  options:
  - label: A
    content: 經里民提案並投票選出執行方案
  - label: B
    content: 由市議員及里長負責決策與執行
  - label: C
    content: 邀集相關專家學者召開專家會議
  - label: D
    content: 透過網路或社群平臺宣傳與分享
