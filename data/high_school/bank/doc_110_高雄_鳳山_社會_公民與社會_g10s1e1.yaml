  stem: 「公共政策網路參與平臺」的運作，展現下列何種意義？
  options:
  - label: A
    content: 網路傳播的公共意見已成為民主治理的主要管道
  - label: B
    content: 由權責機關處理及回應，能避免行政專斷的問題
  - label: C
    content: 成案後的處理與回應為行政自我要求的內部課責
  - label: D
    content: 提案因民意背書而有助於提高執行政策的可行性
  group_stem: 為因應我國民眾廣泛應用資訊設備及網路表達對時事及公共政策的看法，國家發展委員會參考美國白宫網站“We the People”，於2015年建置「公共政策網路参與平臺」，作為全民參與公共事務的常設管道，並於成案後要求權責機關於規定時間內處理及回應。 然而，有網友卻提案廢除此一平臺。不少附議者認為，事實上能成案而順利推動，或具有建設性的提案屈指可數，質疑此平臺並非政府傾聽民意之處，反而被當成民意背書的工具；再者，以「廢除各項公共運輸工具上博愛座之設置」此一提案為例，附議者的分布如圖所示（共8,697人附議），明顯集中在特定區域：「廢除各項公共運輸工具上博愛座之設置」附議者居住地統計 （圖表數據來源：公共政策網路參與平臺）
  shared_asset: g2_47_48
