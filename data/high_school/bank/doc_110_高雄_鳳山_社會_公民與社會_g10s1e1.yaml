  stem: 《熔爐》是一部於2011年上映的韓國電影，改編自真實案件的同名小說。劇情講述一所聾啞特教學校爆發校長及教職員集體性侵和凌虐學生的事件，雖當時已進行司法審判、同時有人權團體奔走與抗議，仍然因司法包庇而獲輕判。電影上映後引來廣大迴響，民眾連署要求重啟審判與修法。輿論壓力不僅使檢調單位重啟調查、法院重判加害人，更使國會修訂相關法律（稱為「熔爐法案」），也成為改變社會的公共力量。下列何項分析符合題文的敘述？
  options:
  - label: A
    content: 國會修訂法律的手段，是制衡司法機關審判的重要機制
  - label: B
    content: 政府內部課責只能仰賴國會修改或制定法律，達到權責相符
  - label: C
    content: 輿論能對政府產生監督的效果，使政府負起應有的責任
  - label: D
    content: 輿論壓力是所有民主課責制度中，最重要且有效的手段
