  stem: 一開始，地球的生物形成後，就在海洋中逐漸發展。海洋環境萬分多樣，扮演保留生物發展的成果，及促其持續演化的場所或棲地之角色。最原始的多樣性是由單細胞的真細菌和古細菌所組成。接著是細胞核的生成，形成真核生物體，於是開啟了真核生物域的大演化。以動物界為例，由最簡單的組織構成多細胞海綿，再逐步形成具有器官及器官系統的複雜生物體。生物體集結成族群，更進而與棲地相依，整合成為生態系。下列有關地球生物演化的次序，哪些正確？
  options:
  - label: A
    content: 先發生在陸地，然後到海洋
  - label: B
    content: 先生成域，再生成界，最後形成物種
  - label: C
    content: 先有原核的真細菌及古細菌，然後才有真核生物體
  - label: D
    content: 生物體先有器官系統以容納各器官及組織
  - label: E
    content: 原始細胞生成細胞核後，再演化為多細胞的海綿動物
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
