- id: doc_111_新北_明德_自然_生物_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 達爾文在西元 1831～1836 年隨小獵犬號出航，在加拉巴哥群島的觀察獲得許多啟發，又閱讀學習各種理論，最後提出天擇說。下列相關敘述何者正確？
  options:
  - label: A
    content: 達爾文在加拉巴哥群島觀察到的雀鳥體型大小與其食性有關
  - label: B
    content: 達爾文在林奈學會，首次看到華萊士提出的演化理論
  - label: C
    content: 達爾文從《人口論》中理解到資源限制與個體間競爭的關係及重要性
  - label: D
    content: 天擇說強調競爭過後產生大量變異，使天擇有更多篩選的對象
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 各種雀鳥的鳥喙大小與其食性有關。

    (B) 達爾文與華萊士共同在林奈學會發表演化理論。

    (D) 天擇說強調在競爭前，大量變異已經存在於生物族群內。'
