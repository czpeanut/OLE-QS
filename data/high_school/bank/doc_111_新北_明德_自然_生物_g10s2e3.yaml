  stem: '演化生物學家 David Reznick 在千里達島某條河流研究古比魚（Poecilia reticulata）與其掠食者的交互作用。該河流因為瀑布造成上、下兩河段的高低落差，上河段古比魚的主要掠食者為殺手魚，下河段古比魚的主要掠食者為梭子魚。與梭子魚相比，殺手魚的體型小很多，甚至與較大的古比魚體型相近，故對古比魚的掠食壓力較小。今調查甲、乙兩河段古比魚的族群特徵數據如下表（數據為平均值）。下列對於甲、乙兩河段古比魚的推測，哪些合理？

    |  | 雌體大小 | 雄體大小 | 胚胎重量 | 胎間距 |

    | --- | --- | --- | --- | --- |

    | 河段甲 | 14.5 mm | 14.8 mm | 0.9 mg | 24.2 天 |

    | 河段乙 | 17.5 mm | 16.8 mm | 1.5 mg | 26.5 天 |'
  options:
  - label: A
    content: 河段甲的古比魚體型較流線型，有助於躲避掠食者
  - label: B
    content: 河段乙的古比魚體型較流線型，因為被捕食的壓力較大
  - label: C
    content: 經演化後，河段甲的古比魚顏色較不鮮豔
  - label: D
    content: 經演化後，河段乙的古比魚顏色較不鮮豔
  - label: E
    content: 此兩河段的古比魚因為地理隔離，無法自然交配產生有生育力的後代
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 河段甲的掠食者為梭子魚，體型較大對古比魚的掠食壓力較大，故河段甲古比魚的魚體較小且體型應較流線型，使其移動較快速以躲避掠食者。河段乙的掠食者為殺手魚，對古比魚的掠食壓力較小，河段乙古比魚較無躲避掠食者的顧慮，因此魚體較大且顏色較鮮豔。兩河段古比魚的學名相同仍為同種，可以自然交配產生後代，故應選(A)(C)。
