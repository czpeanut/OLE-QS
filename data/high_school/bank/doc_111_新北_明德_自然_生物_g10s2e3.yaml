  - label: A
    content: 創造論
  - label: B
    content: 災變說
  - label: C
    content: 用進廢退說
  - label: D
    content: 天擇說
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 天擇說加入遺傳學理論後，是現今最佳的演化理論，故選(D)。
