  section: 1
  number: 19
  type: single
  page: 3
  stem: 達爾文的小獵犬號之旅，途經厄瓜多爾及加拉巴哥群島。回國後分析旅途所見及所收標本，歸納出共同祖先及物種形成的概念。下列有關此概念的推論，何者<u>錯誤</u>？
  options:
  - label: A
    content: 原核及真核生物皆以轉錄及轉譯製造蛋白質，可推論生物界可能是單一起源
  - label: B
    content: 哺乳動物皆以乳汁養育幼兒，可證明哺乳動物存在共同祖先
  - label: C
    content: 麻雀與企鵝的 翼可證明有共同祖先，但蝙蝠則不是此祖先的後代
  - label: D
    content: 通常古老地層中的化石構造簡單，年輕的相對複雜，可證明祖先及後代之關係
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 古老地層的化石構造簡單，但並非所有古生物皆具有相似的構造，故無法證明祖先及後代之關係，故選(D)。
