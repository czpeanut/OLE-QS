  page: 1
  stem: 有關演化的敘述，下列何者正確？
  options:
  - label: A
    content: 突變常對生物體有害，故不利於生物演化
  - label: B
    content: 孟德爾的分離律及獨立分配律，是達爾文演化論的基礎
  - label: C
    content: 人類大量使用抗生素，使得抗藥性的細菌增加，此為天擇作用的結果
  - label: D
    content: 拉馬克的用進廢退理論，是達爾文演化論的基礎
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 突變可能對生物體有利，有益於生物發生演化。

    (B) 達爾文的演化論未提及孟德爾遺傳法則。

    (D) 拉馬克的用進廢退理論與達爾文演化論是不同的理論。'
