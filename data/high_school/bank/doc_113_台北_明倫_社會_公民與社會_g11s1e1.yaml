  explanation: (A)法定財產制下，夫妻間就其婚後財產，互負報告之義務。(B)法定財產制下，夫妻的財產分為「婚前財產」與「婚後財產」，由夫妻各自所有，為正解。(C)此為共同財產制的規定，依《民法》第 1034 條規定：「夫或妻結婚前或婚姻關係存續中所負之債務，應由共同財產，並各就其特有財產負清償責任。」(D)法定財產制下，雙方於離婚時皆可主張剩餘財產差額分配請求權。
