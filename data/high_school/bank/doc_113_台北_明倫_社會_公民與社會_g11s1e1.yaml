- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 你是否曾想過：同樣是考試成績進步 10 分，「從 40 分到 50 分」與「從 80 分到 90 分」所須花費的額外讀書時間卻不同。請問經濟學如何描述這種現象？
  options:
  - label: A
    content: 絕對利益
  - label: B
    content: 比較利益
  - label: C
    content: 機會成本不變
  - label: D
    content: 機會成本遞增
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)機會成本增加原理也稱為低果先摘原理，是指在擴大一種產品產量的時候，首先使用機會成本最低的資源，然後再逐漸使用機會成本較高的資源；而且隨著生產成本愈來愈高，代表需要放棄的事物價值會愈高，也因此考試同樣進步 10 分，所付出的代價愈高，此概念符合題意所述。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺灣消費糾紛層出不窮，曾有一群大學生到熱炒店用餐，店內標示「白飯免費供應」，然而大學生在吃光店內白飯要求續飯時，店家回覆：「由於煮飯需要時間；目前無法供應……」，學生離開後卻在網路狂洗一星負評。針對此項爭議，店家與消費者可以如何主張？
  options:
  - label: A
    content: 店家張貼「白飯免費供應」屬定型化契約，但店家作為顯失公平有違《公平交易法》
  - label: B
    content: 大學生因白飯免費供應而入店消費，基於信賴保護原則，店家應讓消費者吃到飽
  - label: C
    content: 該消費事件落幕後，若要避免爭議，店家有權利拒絕該校或該系大學生入內用餐
  - label: D
    content: 店家餐點送上桌後大學生尚未取得餐點所有權，須結帳付費後才可以取得所有權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)若店家認為入店消費應該是以點菜為主，白飯只是「附帶」贈送，屬於「贈品」的一種，店家本來就沒有義務要補飯，白飯並非無限量供應。依照《民法》規定：「贈與之物或權利如有瑕疵，贈與人不負擔保責任。若店家主張讓顧客免費吃白飯如同贈品，不屬於契約服務範圍之內容，並不違反《公平交易法》或《消費者保護法》；信賴保護原則是在保護人民對於國家正當合理的信賴，與此處無關。(C)依據契約自由選擇，店家有締約人選擇自由，此舉並不違法，為正解。(D)餐點為動產，交付才生效力，以本題觀之，不須先結帳即取得餐點所有權。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「貨物出門，概不退換」是商店中常見的一句標語，根據臺灣法規的規定，下列相關敘述何者正確？
  options:
  - label: A
    content: 買賣是你情我願的事，基於私法自治，商家不願退換，買家自然應該尊重
  - label: B
    content: 消費者應該在店內仔細檢查商品，若出了店門才發現瑕疵，本當自行負責
  - label: C
    content: 顧客至上的觀念已製造太多的奧客，店家為了保護自己權益可以不給退換
  - label: D
    content: 該標語不問情形一律免除店家責任，告示內容顯失公平有違平等互惠原則
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)買受人因物有瑕疵，而得解除契約或請求減少價金者，其解除權或請求權，於買受人依《民法》第 356 條規定為通知後 6 個月間不行使或自物之交付時起經過 5 年而消滅。若商品有瑕疵，仍可主張退換或賠償。
