  stem: 題文中的建商欲以不實廣告營造銷售熱潮來使預售屋價格上漲的做法，其涉及的經濟學供需概念，與下列何者最相似？
  options:
  - label: A
    content: 產糧大國發生戰爭無法出口，使得國際糧價大漲
  - label: B
    content: 趁百貨週年慶化妝品優惠折扣，小資女趕緊囤貨
  - label: C
    content: 數位相機銷售長紅，帶動相機記憶卡的價格上漲
  - label: D
    content: 政府研擬調升水費電費，民生商品價格應聲上漲
  group_stem: 我國房屋市場的「預售屋」是指尚未開始動工或正在施工，而預先銷售的房屋。有的建商在預售屋銷售時，打出不實廣告，藉此促銷，例如：有建商在廣告文宣中呈現「空中景觀泳池」的意象，但實為無景觀之一般泳池；另外，也有建商為營造購屋熱潮，形成預期心理，哄抬建案價格，喊出「本案即將完銷」，但實際上該建案還有多戶未售出。也有投資客看準購屋者的預期心理，搶先簽訂預售屋買賣契約，俗稱紅單，而後換約轉售紅單，進行預售屋炒作，政府因而修改相關法律條文，規定預售屋買賣契約禁止讓與或轉售。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 以廣告營造銷售熱潮推動價格上漲，屬於預期心理以為價格將上漲，而使需求增加推升房價的影響，與(D)政府擬調漲水電費，也屬於預期心理推升價格，兩者原因雷同。(A)此為供給減少而使價格上漲的情況。(B)此為價格下降引起需求量增加的情況。(C)相機與記憶卡屬於需求上的互補品，為相關產品的價格影響。
