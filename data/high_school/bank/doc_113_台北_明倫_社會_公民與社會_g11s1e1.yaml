  stem: 小陳與妻子小芳結婚前約定採取法定夫妻財產制。婚後小芳生下小孩，小陳為了照顧好家庭，衡量雙方收入後，決定辭職在家帶小孩和負責家務。以下敘述何者正確？
  options:
  - label: A
    content: 小陳與小芳婚前已約定好採取法定財產制，婚後即無法再登記改為共同財產制
  - label: B
    content: 小陳除了向小芳請求家庭生活費用外，雙方可協議自由處分金作為家務的回報
  - label: C
    content: 若小芳拒絕提供家庭生活費用，仍有自己存款的小陳無法向法院提起訴訟請求
  - label: D
    content: 若兩人離婚，法律保障小陳可向小芳請求兩人全部財產差額的一半作為贍養費
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)婚後仍可以去法院登記更改為共同財產制。(B)自由處分金是根據《民法》第 1018 條之規定：「夫妻於家庭生活費用外，得協議一定數額之金錢，供夫或妻自由處分。」其立法目的在於保障夫妻經濟自主及婚姻和諧，明定夫妻於家庭生活費用外，得協議一定數額之金錢，供夫或妻自由處分。為正解。(C)《民法》第 1003-1 條規定：「家庭生活費用，除法律或契約另有約定外，由夫妻各依其經濟能力、家事勞動或其他情事分擔之。」因此小陳可以向法院提起訴訟請求。(D)依據剩餘財產差額分配請求權，須扣除婚前財產、贈與等，再平均分配剩餘的婚後財產，故非全部財產差額的一半。
