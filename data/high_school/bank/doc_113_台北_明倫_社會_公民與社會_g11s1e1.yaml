  stem: 承上題，若陳大帥過世後留下一千萬的遺產，根據題文所述，下列關於小成及小功可繼承的遺產金額，何者正確？
  options:
  - label: A
    content: 小成：750 萬；小功：250 萬
  - label: B
    content: 小成：800 萬；小功：200 萬
  - label: C
    content: 小成：500 萬；小功：500 萬
  - label: D
