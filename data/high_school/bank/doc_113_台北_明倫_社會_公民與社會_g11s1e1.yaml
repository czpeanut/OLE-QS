  explanation: 債務人死亡後，其繼承人若未辦理拋棄繼承，原則上就會繼承債務人之權利與義務；換言之，就是財產與負債將一併繼承。所以即使債務人死亡，債權人仍可以向債務人的繼承人訴請清償、強制執行。故對其妻子及子女最適切的做法為向法院辦理拋棄繼承，才可避免未來仍需面對清償債務的可能，故選(B)。
