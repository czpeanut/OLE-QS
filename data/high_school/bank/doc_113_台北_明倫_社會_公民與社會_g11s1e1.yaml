  stem: 蘋蘋在班上耶誕節活動中所準備的交換禮物，最後由同學強強抽中，但過一陣子蘋蘋發現強強將禮物放桌上都未拆開，便好心幫他拆封，卻當場被強強目睹。強強怒喊：「你送出去的禮物，既然已經被我抽中，我想放著就放著！」請問強強怒喊所提及的是所有權的哪一特性？
  options:
  - label: A
    content: 排他性
  - label: B
    content: 優先性
  - label: C
    content: 直接支配性
  - label: D
    content: 保護之絕對性
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 強強的話語呈現直接支配性的概念，指物權人得依自己之意思，無須他人之意思或行為介入，對標的物即得為管領處分，實現其權利內容之特性，故選(C)。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 陳大帥婚後妻子早逝，因此為了未有子嗣而煩惱不已，後決定收養小功以繼承香火；而後發現年輕時因誤會而分開的情人竟為他生下一子小成，大喜過望的他，迅速的將小成帶回家門並認祖歸宗，並隨即立下遺囑，在遺囑中說明遺產將全部由小成繼承。請問陳大帥與小成、小功之間親子關係的敘述，何者正確？
  options:
  - label: A
    content: 小成和小功在我國法律中均被認為是陳大帥的「婚生子女」
  - label: B
    content: 小成在法律上被稱為「法定血親」，小功則是「擬制血親」
  - label: C
    content: 陳大帥與小成、小功的親子關係一旦成立，其關係永遠存在
  - label: D
    content: 小成和陳大帥之親子關係透過認領程序確立，沒有期間限制
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)小功應為法定血親（又稱擬制血親），而小成應視為婚生子女（認領）。(C)基於公序良俗，自然血親是不可以斷絕關係的，但收養而來的法定血親，則有以下方法可以斷絕：雙方合意以書面終止收養。(D)生父認領並沒有任何時效限制，只要提出相關的證明文件就可完成認領，為正解。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_12
