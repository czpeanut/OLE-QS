  group_stem: 外送平臺和餐廳、小吃店合作，將店家提供的食物上架到平臺業者的 App，民眾下載 App 後即可叫餐，如果店家位置和民眾取餐位置在一定範圍內，就會由外送平臺招聘的外送員利用最短的時間將美食送到民眾住家或公司。民眾使用外送平臺 App 叫餐，每一單除了食物本身的價格，還要視食物金額再額外付出一筆外送費。但是，即使利用外送平臺叫餐的食物價格，比親自到店家購買的金額還要貴，還是有很多人願意叫餐。請以上述內容為依據，回答以下問題：
