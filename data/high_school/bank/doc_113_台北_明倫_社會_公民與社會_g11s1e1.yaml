  stem: 大學生小金，某日趕著上課，機車騎到停車場後懶得找停車位，隨意停放就離開了。下課後回到停車場，看到自己的機車輪胎被學校生輔組的大鎖鎖住。小金知道自己沒有停在格內是不對的，他只希望能趕快解鎖、騎車回家。依據法律的規定，小金到生輔組後可以如何主張其權利？
  options:
  - label: A
    content: 主張損害賠償
  - label: B
    content: 主張所有物返還
  - label: C
    content: 主張所有權妨害除去
  - label: D
    content: 主張所有權妨害防止
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《民法》第 767 條第 1 項前段：對於妨害其所有權者，得請求除去之（所有權妨害除去請求權）。學校並無侵占其所有權，而是妨害其所有權行使，因此小金應該主張所有權妨害除去，選(C)。
