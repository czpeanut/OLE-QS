- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '四位同學一起租屋在外，某天討論房屋修繕的分工方式，請問哪些人的經濟學概念較正確？

    阿中：「我裝潢的速度比大家都快，在裝潢方面我有比較利益！」

    小華：「我水電維修速度最慢，我在維修水電的機會成本最低！」

    阿民：「我粉刷牆壁速度最快，因此我粉刷牆壁具有絕對利益！」

    阿國：「我各方面都不如你們，但我參與分工還是對大家有利！」'
  options:
  - label: A
    content: 阿中、小華
  - label: B
    content: 阿中、阿民
  - label: C
    content: 小華、阿國
  - label: D
    content: 阿民、阿國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 阿中：比較利益須有兩樣商品依其單位時間內的機會成本做比較，才有辦法得知，該說法錯誤；小華：速度慢為成本高，該說法錯誤；阿民：速度快可以在單位時間內有更多產出，該說法正確；阿國：每個人都會有機會成本較小的專長，因此參與分工對大家有利，該說法正確。故選(D)。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 3
  stem: 我國《消費者保護法》規定：通訊交易與訪問交易消費者可享有猶豫期，除了特殊狀況例外。請問下列何種情況消費者可主張退貨？
  options:
  - label: A
    content: 迪迪在電視購物上購買電視，使用 8 天發現別家賣更便宜
  - label: B
    content: 小永在路上被推銷買了百科全書，回到家發現根本不需要
  - label: C
    content: 冠冠到金士曼西服店訂製西裝，穿上後發現褲子太過合身
  - label: D
    content: 阿民在網路書店訂購了電子書，很快在當天就把書看完了
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 依《消費者保護法》第 19 條第 1 項及第 2 項規定：「通訊交易或訪問交易之消費者，得於收受商品或接受服務後 7 日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。」(A)使用 8 天後無法主張猶豫期。(B)此為訪問交易，適用猶豫期規定，為正解。(C)至店面購買商品，不適用《消保法》的猶豫期間。(D)電子書屬於《通訊交易解除權合理例外情事適用準則》中規範之情形，非以有形媒介提供的數位內容，或一經提供即為完成的線上服務，經消費者事先同意才提供。因此，電子書不適用猶豫期。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 3
  stem: 年過六旬的阿榮早年喪偶，要過世後，他獨立撫養一子一女。好不容易子女各自成家立業，阿榮也認識年方二十的美美，阿榮不顧子女的反對與美美結婚，展開自己的人生第二春。阿榮的子女認為美美覬覦父親的財產才結婚，因此要求父親寫下遺囑，全數遺產由子女均分，不可以給美美，阿榮為得到子女體諒因此照做。如今阿榮過世，關於其遺產的處理，下列何者較為適當？
  options:
  - label: A
    content: 因為阿榮生前已立遺囑，其法定繼承人僅有子與女二人
  - label: B
    content: 依據阿榮所立遺囑，美美無法主張自己有權利繼承遺產
  - label: C
    content: 儘管阿榮立了遺囑，美美仍可以主張取回特留分的比例
  - label: D
    content: 雖然阿榮立下遺囑，美美仍可主張自己與阿榮子女均分
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)美美為阿榮的配偶，為當然繼承人，享有繼承權。(B)美美為配偶，仍可以獲得特留分。(D)基於尊重立遺囑人的意願，美美僅可主張特留分，無法與阿榮子女均分遺產。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 阿榮與小美連假期間計畫到宜蘭頭城旅遊，上網查詢民宿資料發現：當地觀海民宿星期日到星期四期間有八折優惠，星期五到星期六及國定假日期間完全沒有折扣，住一晚要價不斐。以下有關契約自由的相關敘述，何者觀念正確？
  options:
  - label: A
    content: 民眾放假才有空出遊，無良業者趁此大賺連假財屬於暴利行為
  - label: B
    content: 同一間民宿平日與假日期的售價迥異，業者違反公平交易原則
  - label: C
    content: 民眾不滿價格差異，可以依《消費者保護法》向地院提起民事訴訟
  - label: D
    content: 消費者自行上網預定喜歡的民宿是私法自治的相對人選擇自由
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)差別定價為契約自由所允許，此為依照平日與假日需求不同的做法，並不違反法規，所以無法提起訴訟。
