  stem: 甲與乙口頭約定用兩人合夥賺取的金錢，共同向丙購買一棟房子。房屋過戶給甲、乙兩人共同持有後，甲、乙約定「將來若要賣出，需要甲、乙兩人共同同意」。不料某日，甲卻以該屋風水不佳，乙應該也會不喜歡為由，在未經乙同意下，將該屋轉售給丁並進行過戶。關於此筆交易所涉及的買賣和物權行為，下列敘述何者符合我國《民法》的規定？
  options:
  - label: A
    content: 甲乙僅有口頭約定卻沒有簽書面契約，雙方合購該屋契約未成立
  - label: B
    content: 乙可以因甲未經其同意售屋侵害他的債權，而對甲提出民事訴訟
  - label: C
    content: 甲因為違背約定，就不再是該屋所有人，無法享有售屋收入權利
  - label: D
    content: 甲雖未經乙同意賣屋，但丁因不知情且已過戶仍取得該屋所有權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依契約自由原則，口頭約定亦有效力。(B)未經同意售屋為侵害其所有權，所有權為物權。(C)甲雖違背約定，但甲與乙皆為該物的所有人，應共享所有權。(D)基於物權優先於債權，指同一個標的物上，如果有物權與債權並存時，無論物權成立於債權之前還是成立於債權之後，物權均有優先於債權實現的效力。丁為善意第三人可以取得房屋之所有權，為正解。
