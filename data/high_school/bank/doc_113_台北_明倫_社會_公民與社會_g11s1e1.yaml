  answer_status: verified
  answer_source: answer_key
  explanation: 題文是指政府有時會為了增進公共利益而對個人的所有權進行部分限制，例如：蓋捷運、高鐵而徵收人民的土地。(A)機場附近房屋屋頂不得興建鴿舍是為了大眾的飛行安全，為公益而犧牲，符合題文，為正解。(B)此舉是主張私人所有權。(C)此舉是私人自身的行為，除非是政府依法令規定要求私人開放。(D)此舉是主張鄰居侵害其私人所有權。
