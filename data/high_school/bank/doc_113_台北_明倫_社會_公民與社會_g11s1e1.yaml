- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s2_42
  section: 2
  number: 42
  type: single
  page: 12
  stem: 針對題文中建商的行為，下列論點何者合乎我國現行《民法》與相關法規範？
  options:
  - label: A
    content: 泳池廣告不屬契約的一部分，依法不得拘束買賣雙方
  - label: B
    content: 若無脅迫他人買賣房屋，政府基於契約自由無法介入
  - label: C
    content: 刊登廣告係為勸說消費者購買，內容雖誇大並不違法
  - label: D
    content: 政府可透過《消保法》或《公平交易法》管制建商的泳池廣告
  group_stem: 我國房屋市場的「預售屋」是指尚未開始動工或正在施工，而預先銷售的房屋。有的建商在預售屋銷售時，打出不實廣告，藉此促銷，例如：有建商在廣告文宣中呈現「空中景觀泳池」的意象，但實為無景觀之一般泳池；另外，也有建商為營造購屋熱潮，形成預期心理，哄抬建案價格，喊出「本案即將完銷」，但實際上該建案還有多戶未售出。也有投資客看準購屋者的預期心理，搶先簽訂預售屋買賣契約，俗稱紅單，而後換約轉售紅單，進行預售屋炒作，政府因而修改相關法律條文，規定預售屋買賣契約禁止讓與或轉售。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)泳池屬於公共設施，也屬於契約之一部分。(B)脅迫他人買房違反契約自由精神，契約無效。(C)《公平交易法》第 21 條，廣告不實是指業者在商品或廣告上進行「虛偽不實」或「引人錯誤」的表示，而且這些不實或錯誤，與消費者在決定「要不要買這個商品」有重要的關聯。
- id: doc_113_台北_明倫_社會_公民與社會_g11s1e1_s2_43
  section: 2
  number: 43
  type: single
