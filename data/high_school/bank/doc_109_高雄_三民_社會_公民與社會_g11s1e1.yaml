  group_stem: 1946年中油公司接收日軍在楠梓後勁的第六燃料廠成立高雄煉油廠，修復戰火下的設施後，1948年運入原油開始蒸餾加工煉油，自此，當地的孩子放學後不再跳入後勁溪沖涼戲水，高高屏日漸蒙塵。而同樣倚在後勁半屏山麓的還有高汙染的水泥業，1958年東南水泥第一號案竣工後，煙塵恣意吐納，黑煙與臭味沒少過。 1968年，在煉油之外中油公司大舉進攻石化業，第一、第二輕油裂解場在煉油廠區內陸續商轉，楠梓及不遠處的大社、仁武，被石化業、汽電共生（燃煤）的煙囪與偌大的煤倉盤據。記得有位老高雄人跟我說過，那個年代，烏煙瘴氣根本習以為常。 1969、1970年位在南高雄小港區的臺電大林電廠兩部燃煤機組（共60萬瓩）運轉，兩年後，燃油的三、四號機（共75萬）加入，緊接著是包括中鋼、中船等數百家工廠進駐的臨海工業區，日以繼夜，往天空塗碳。 資料來源：王敏玲（2019）。空汙治理與人民的距離。取自https://www.cti-laiwai.lgriode/3578
