    content: 因為有蘭花的國際貿易市場，會促進各國更專業生產
  group_stem: 臺灣蘭花從1999到2014年，出口值持續成長到年外銷值破億美元，締造蘭花王國的美名。荷蘭既是臺灣最大的競爭對手，也是臺灣蝴蝶蘭外銷的第二大市場，荷蘭人大約花費10年的時間，做了兩件大事。首先，荷蘭突破了臺灣的品種優勢，在商業化運作下，從過去臺灣買斷的品種中，精選出獲利品種，專心投入市場銷售，近幾年其產銷運作已經成型了。而臺灣花農向來愛當趣味栽培者，200到300種新品種端出，卻不見得能壯大成為產業品項。其次，荷蘭為了破解臺灣掌握的優質介質優勢，持續投入人工介質研發、模組暨機械化生產開發。2015年，荷蘭將研發完成的介質系統生產的花市問市，立即導致臺灣10幾年來外銷長紅的上升斜線首次下滑。除了荷蘭所做的這兩件大事致使這些年來向臺灣進口花苗的數量不斷下跌外，越南在蘭花生產上，也是後生可畏，足以讓臺灣蘭花產業憂心。
