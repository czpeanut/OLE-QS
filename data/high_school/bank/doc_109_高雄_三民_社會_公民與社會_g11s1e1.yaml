  group_stem: 根據一讀通過的《人工生殖法》修正草案，要實施代孕生殖，必須符合以下其中1項條件，包括：1.妻無子宮。2.妻子子宮病變、免疫疾病或其他事實，難以孕育子女。3.妻因懷孕或分娩有嚴重危及生命之虞。另一方面，若委託者需使用他人精子或卵子，不得使用代孕者的卵子，或代孕者配偶的精子。 由於代孕者只是代理懷孕，所生的子女與胎兒並無血緣關係，因此依照血緣原則，代孕出生的子女，依法屬於委託者的子女。但如果委託者夫妻在胎兒出生前死亡，那麼胎兒出生後，代孕者有優先收養的權利，但收養程序仍應依《民法》及《兒童及少年福利與權益保障法》的規定辦理。 資料來源：游資芸（2020）。代理孕母在臺灣有希望了！《人工生殖法》一讀通過，可給酬金，三大醫學問題搶先看。
