    content: 兩國貿易戰在開打期間，對中國的農產品消費者具不利影響
  - label: C
    content: 美國在生產大豆和高粱等農產品，具有絕對利益和比較利益
  - label: D
    content: 兩國簽署貿易協議之後，對美國的農產品消費者具有利影響
  group_stem: 2018年7月6日，美中貿易戰開打，美國對價值340億美元的中國輸美產品徵收25％的額外關稅。中國商務部同日作出反制措施，對價值340億美元的美國輸入中國產品徵收25％的額外關稅，其中包括美國向中國出口最多的產品──大豆。在貿易戰開打之前，中國是美國最主要的農產品消費國之一，不但買了美國60％的大豆，也是高粱、乳製品和豬肉的高消費國。兩國貿易戰了1年半，終於在2020年1月16日美中兩國簽署第一階段貿易協議，中國承諾要擴大購買美國農產品。 過去兩年之間，在美中貿易戰的背景下，出口量受到影響，美國農民變得更加依賴政府補助過活。農業部秘書長表示，中國接下來很快就會開始購買美國農產品，實現承諾的400億美元（約新臺幣1.2兆元）農產品購買目標。如此一來，農民對政府補助的需求便會逐漸降低。
