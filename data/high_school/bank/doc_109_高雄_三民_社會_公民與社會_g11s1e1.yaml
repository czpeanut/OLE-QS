  stem: 依據國貿局的解釋，我國電子零組件對中國的出口量有所增加，下列何者<u>並非</u>其主要原因？
  options:
  - label: A
    content: 由於疫情影響，使消費者產生添購電腦、平板的購物需求
  - label: B
    content: 兩岸在相關產業具專業分工，我國對組裝較具有比較利益
  - label: C
    content: 中國復工時程較早，並且對我國電子零組件持續具有需求
  - label: D
    content: 我國相關產業受到疫情影響程度較低，因此產能足以應付
  group_stem: 經濟部指出，今年上半年我國積體電路、記憶體等電子零組件對中國出口增加25.9％。國貿局表示，臺灣本是電子零件的主要供應國，且因兩岸貿易主要產品多所重疊，電子產業內貿易及分工密切，加上疫情帶動全球遠距通訊需求，中國又是全球重要的電子產品組裝地，復工最早，臺灣也未因為疫情停工，因此，今年上半年中國對我國電子零件需求呈現正成長。 國貿局強調，臺灣多年來透過新南向政策積極深耕東南亞地區，顯示該政策方向正確，與國際觀點一致。全球供應鏈變化，也使新南向國家近年來加速順應變化轉型，為業者創造有利經商環境。因此，為配合各國政府因疫情採取之限制入出境措施，經濟部已加強數位貿易推廣及電子商務拓銷，例如：建置線上展覽、提供數位行銷輔導、成立數位貿易學苑，加強培訓企業所需數位行銷與電商人才等措施，協助廠商拓銷及布局全球。經濟部也表示，將持續觀察疫情對貿易的影響，協助業者布局新南向國家及全球，妥為因應。
  tags:
    unit:
      code: CI-3-5-2
