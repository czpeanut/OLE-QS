  group_stem: 世界衛生組織（WHO）於2月就新型冠狀病毒舉行專家會議，我國已向WHO表達派員與會的強烈意願，將持續爭取參與相關會議。 近來國際友人強力表達支援臺灣參與WHO的聲浪大增，顯示國際社會對中國武漢肺炎疫情迅速擴散的高度關注，以及認同將臺灣納入全球公衛及防疫體系的急迫性及必要性。對於WHO研議邀請臺灣以線上方式參與若干相關會議，外交部予以肯定，認為這是個好的開始，但強調這絕不意謂我方不須繼續爭取以觀察員身分出席世界衛生大會（WHA），以及其他的WHO技術性會議、活動或機制；我方籲請WHO秉持專業，繼續協助臺灣完整參與國際醫衛及防疫體系並作出貢獻。 外交部重申，臺灣必須以定期和機制化的方式，完整、充分地參與WHO所有相關會議、活動及機制，始不致成為全球防疫的漏洞，也才能為國際合作共同對抗疫情危機作出更多貢獻。
