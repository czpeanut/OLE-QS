  stem: 在1803年，道耳頓提出以下的原子說，從現在的化學知識來看，下列哪些正確？
  options:
  - label: A
    content: 一切物質都是由原子組成
  - label: B
    content: 相同元素的原子，具有相同的質量和性質
  - label: C
    content: 化合物分解所得的原子與構成化合物的同種原子性質相同
  - label: D
    content: 原子是基本粒子，不可分割
  - label: E
