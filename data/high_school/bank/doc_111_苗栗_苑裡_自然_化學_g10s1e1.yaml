  stem: 濾紙層析是分離混合物的一種簡便方法。首先用鉛筆在長條形濾紙上，距上、下緣適當距離處（約1公分）各畫一條細線（如附圖的X、Y橫線）；然後用毛細管在Z處點好樣品後，再放入裝有適當展開液之展開槽中進行分離。下列有關濾紙層析之原理與操作，哪些選項正確？
  options:
  - label: A
    content: 濾紙層析是利用混合物中各成分物質的性質差異（如對濾紙之吸附力）達到分離效果
  - label: B
    content: 用毛細管將樣品溶液點在濾紙上的Z點時，須持續接觸約10秒，以提高樣品含量
  - label: C
    content: 必須使用足量的展開液，使其液面剛好接觸到X處之橫線
  - label: D
    content: 當移動最快的成分物質到達Y處之細線峙，即可停止展開
  - label: E
    content: 改變展開液的成分可改變混合物的分離效果
