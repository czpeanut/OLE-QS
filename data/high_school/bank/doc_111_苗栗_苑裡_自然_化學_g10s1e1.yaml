  stem: 目前市面上欲去除糧食作物中的農藥殘留，可使用超臨界二氧化碳，它是種具有氣體流動性、擴散性，又同時具有液體高密度特性的二氧化碳。當它通過被處理的食物（如米粒）時，殘留的農藥會溶到超臨界二氧化碳中，因而與米粒分離。請問上面所描述的農藥分離技術，可歸類為何種分離方法？（2分）請說明你的判斷依據。（2分）
  answer:
  - 萃取法，見解析
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹說明殘留的農藥溶到超臨界二氧化碳中，與米粒分離，透過物質在互不相溶的溶劑中的不同溶解度使其分離，米粒與超臨界二氧化碳互不相溶，農藥較易與超臨界二氧化碳相溶，故透過此法分離，是為萃取法。
