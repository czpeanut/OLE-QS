  type: single
  page: 2
  stem: 2020年為營造籌組工會的友善環境，並為強化工會協商實力，勞動部開始受理新成立工會獎勵金、工會簽訂團體協約獎勵金、輔導籌組工會及補助工會辦理教育訓練之申請，勞動部展開推動協助組織工會三部曲，分別在勞工組織工會前、籌組中及組織成立新工會後，提供勞工各種補助及獎勵措施。請問：關於該則新聞報導內容，以下四位網紅就勞動三權來檢視勞動部作為做出不同的評論，何者的說法較為正確？
  options:
  - label: A
    content: 蔡阿嘎：協助新成立工會穩定運作並發揮功能是落實《團體協約法》的團結權
  - label: B
    content: 志琪七七：勞動部透過各種獎勵激勵工會積極運作，以實現集體勞動權益
  - label: C
    content: 瓜吉：勞動部肯定工會簽訂團體協約，以提升勞動條件，此舉主要為個別勞動權益的實現
  - label: D
    content: 傑哥：工會能向勞動部申請簽訂團體協約獎勵金，顯示有實踐《勞資爭議處理法》的協商權
