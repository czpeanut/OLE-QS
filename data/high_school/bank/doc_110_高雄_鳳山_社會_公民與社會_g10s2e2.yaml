- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 近年來「零工經濟」與「斜槓」成為熱門關鍵字。英國《金融時報》將零工經濟解釋為「接案經濟」，意指透過各樣「不提供傳統工作保障」的兼職工作維生。而當以完成差事為主的「零工」大軍興起，連帶也影響到傳統的「全職」工作模式。《零工經濟》一書就指出：全職員工是最昂貴、最沒有彈性的人力來源，而企業正透過裁員、縮編和組織重整，把以前的全職工作變成較小的專案或工作，進行自動化或委外，如此一來成本較低廉、也更有彈性。人力銀行網站調查發現：有近五成的企業沒有增員擴編的計畫，反而聘用零工。因此有人認為：「<u>臺灣的『勞工』越來越少，但『勞動者』可是越來越多了。</u>」根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 彈性的人力來源，對勞工來說可以增加業外收入而無一害
  - label: B
    content: 傳統的工作相較於零工經濟會使得雇主要付出較多的成本
  - label: C
    content: 從畫線處指出勞動者越來越多可見我國勞動參與率的改善
  - label: D
    content: 零工經濟的勞動者較傳統工作勞動者更容易組織企業工會
  tags:
    unit:
      code: CI-2-6-1
      book: 公民與社會2 正義與法治
      chapter: 生活中的勞動參與
      title: 勞動參與
      std: true
    textbook: 公民與社會2 正義與法治 勞動參與
    labeled_by: agent
    label_confidence: high
    label_note: 選項D開頭多了一個右括號「)」
    fixed_by: agent
    fix_note: （人工修正：修正題幹錯字「意旨」與「組織」及選項D多餘括號並補充答案與解析）
  explanation: 文中指出「全職員工是最昂貴、最沒有彈性的人力來源」，且企業改聘零工「成本較低廉、也更有彈性」，可見傳統全職工作使雇主付出較多成本，故(B)正確。(A)零工經濟缺乏傳統工作保障，對勞工亦有風險；(C)畫線處反映的是非典型僱傭與承攬接案增加，不代表勞動參與率改善；(D)零工分散且非受僱於單一企業，更難組織企業工會。答案選(B)。
  answer_status: ai_generated
  answer_source: agent
  answer:
  - B
