  stem: 報導資料：自2020年起，因COVID-19疫情延期一年的東京奥運，終於在2021年8月上旬圓滿完結，臺灣達成史上表現最佳的傑出成績，但你知道，在許多未曾留意的角度，也隱藏著許多「臺灣之光」嗎？近年來，許多名符其實的臺灣之光廠商紛紛西進中國，擴展廠房與業務規模。然而同時也造成許多我國勞工的失業，也使得近年許多勞工為了其本身的工作權，上街頭遊行、或是到政府相關部門請願。請根據上述內容推論，下列敘述何者正確？
