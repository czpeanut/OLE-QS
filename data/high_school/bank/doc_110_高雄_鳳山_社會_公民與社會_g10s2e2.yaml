  stem: 遠雄倉儲快遞專區於2016年3月2日發生桃園機場有史以來第一次快遞業者大罷工，罷工主因在於不滿海關公告遠雄專區的26家本土報關業者，每天由海關決定其中一家報關業者不得進入理貨區。若持續罷工，估計臺灣近40萬件快遞無法收到，許多等著零件的工廠將面臨停工，影響層面無法預估。請就下列關於我國勞動三權的敘述，何項說明為正確？
