  stem: 據醫學研究指出，夜市常見的鹽酥雞與燒烤攤位，所排放出的油煙為一級致癌物，若長期暴露在攤位油炸環境，罹癌風險可能是平常人的兩倍。請問：衛生福利部國民健康署可否基於維護學童健康的理由，自行訂定行政命令，向小吃攤位課徵「夜市油煙稅」？
