  stem: 因巷道本身狹窄，若再加上居民在外違停、違建影響消防車出入，更增添救災之困難。在臺灣巷弄失火，因消防車無法進入導致傷亡時有所聞，故為了維護市民生命、財產及居住安全，市政府擬積極取締巷弄間之違建、違規廣告及障礙物。凡經查獲任何妨礙救災之違建或障礙物，一律依法拆除。以下關於市政府行為是否合法的判斷與陳述，何者正確？
  options:
  - label: A
    content: 行為合法，基於憲法第23條公共利益之維護，政府得合法限制居民之權利，無需顧慮居民意見
  - label: B
    content: 行為不合法，因市府並未給予民眾陳述意見的機會，並不符合正當法律程序
  - label: C
    content: 行為合法，因居民違法在先，法律並不保障違法之行為，故政府得強制拆除
  - label: D
    content: 行為不合法，因強制拆除的手段無法達成目的，因此違反比例原則
