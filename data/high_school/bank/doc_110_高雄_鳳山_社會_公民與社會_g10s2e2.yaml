  stem: 若行政院內政部認為上述修法將產生大量的申報案件，其人力難以負荷，且有過度限制人民財產權與宗教信仰自由之虞，下述相應處理方式，何者<u>不正確</u>？
  options:
  - label: A
    content: 內政部得轉請行政院向立法院提出覆議
  - label: B
    content: 行政院得向大法官聲請解釋上述規定牴觸《憲法》
  - label: C
    content: 內政部得提起行政訴訟，由行政法院禁止其受理申報
  - label: D
    content: 總統得就此爭執，召集行政院院長及立法院院長會商解決
  group_stem: (八)設若立法院有感假借宗教詐欺歛財的情形日益嚴重，經修正通過相關法律，明定民眾捐贈給教派領袖或宗教團體時，如超過新臺幣二萬元，受贈者須於一個月內向內政部申報，否則除沒入捐贈物外，還將對受贈者課處罰鍰。
