  stem: 文中提到：「臺北地院行政法庭認為講學和學術自由、大學自治並不能當做違反其他憲法權利、人權公約、性平法等的正當法律理由，學校不能因為命題行為涉及學術自由，就不須接受關於性平法的規範與處分。」請問，這段文字所涉及到的行政法一般原理原則相似於下列哪個選項？
  options:
  - label: A
    content: 內政部訂定的役男出境處理辦法限制役男出國的權利
  - label: B
    content: 某甲收到一張超速罰單，上面記載罰鍰1200-2400元
  - label: C
    content: 為處罰酒駕惡行，警察依照酒測值越高者應開罰越重
  - label: D
    content: 原訂兩個月後拆除違章建築，政府卻在隔天進行拆除
  group_stem: (二)附圖為臺灣大學機械系在辦理甄選入選考試時引用聖經創世紀的出題，引言指出「社會中有許多的律，例如：人要離開父母，與妻子連合，二人成為一體，家庭是由一男一女、一夫一妻組成，這是社會和家庭的律」要求考生以100字論述「身為工程師應盡的社會責任，以及該社會責任所依據的自然的律」，並在題目說明「社會的和諧不能違反社會的律，雖然有一些例外，但以下問題不討論例外的情況。」 臺大學代會認為考題違反《性別平等教育法》(以下簡稱《性平法》)，向教育部提出檢舉，教育部性別平等教育委員會認為此題違反多元成家觀念與性平法，並以一夫一妻的引言限制學生作答方向，影響考生權益，對臺大裁處3萬元。 臺大主張試題是由有多年業界經驗且無宗教信仰的教師閱卷，評分並不會有差別待遇；再者性平法規範主體為教師而非學校，且出題行為屬於大學自治應尊重學術自由，教育部不應該以「龍頭學校」加重開罰。 臺北地院行政法庭認為講學和學術自由、大學自治並不能當做違反其他憲法權利、人權公約、性平法等的正當法律理由，學校不能因為命題行為涉及學術自由，就不須接受關於性平法的規範與處分。(資料來源：擷取自臺大機械系網站)
