  stem: 2017年，一位女性公務員在受訓期間遭到性騷擾，向研習中心輔導員申訴，但該中心卻未依法通報性平會，反要求女職員勿將事情鬧大，並威嚇若會被調查洩密責任會遭註記，恐影響未來發展，迫使女職員接受男性成員道歉，事後更曲解為達成和解。雖然最後新北市政府調查認為本案不構成性騷擾，但被害人不服向監察院陳情，監察委員調查後認為本案調查違反性別工作平等法，糾正新北市政府。關於上述內容，何者推論較為合適？
