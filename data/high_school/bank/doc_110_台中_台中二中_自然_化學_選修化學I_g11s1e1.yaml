    content: '0.11'
  - label: B
    content: '0.22'
  - label: C
    content: '0.33'
  - label: D
    content: '0.67'
  - label: E
    content: '0.86'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由反應式3 $O_{2}$ → 2 $O_{3}$，可知每產生2個$O_{3}$，總分子數會減少1個。 假設該溫度、壓力下每毫升氣體所含的分子數為n，由反應後氣體體積减少50 mL，可得知產生$O_{3}$的分子數為100n，因此$O_{3}$所佔的體積比值為$\frac{ 100n }{ 950n }$＝0.105。故選(A)。
