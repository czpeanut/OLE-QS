  stem: '芒果的花呈淡黃色，萼片4-5枚，花瓣與萼片同數。雄蕊，雌蕊與花瓣均著生於黃色花盤上，雄蕊4-5枚，但僅一枚完全較其他為大，雌蕊一枚位於花盤中央，而花瓣著生於花盤邊緣。當其完成雙重受精後，可見雌蕊的子房膨大，逐漸成長為芒果果實。當我們切開芒果，品嘗酸甜的果肉後，可見一白色毛狀的長扁卵形構造，若用剪刀剪開，則可發現芒果的種子位於其中（如圖一）。芒果的種子具褐色的種皮內含兩枚子葉（如圖二），播種種子後，可萌發出一株小芒果植株。根據上文與課堂所學有關被子植物的有性生殖過程，回答下列問題：

    圖一 圖二 圖三

    (1) 芒果果實內的「白色毛狀的長扁卵形構造」，應由附圖三中的哪一構造發育而來？（請以代號作答）

    (2) 若附圖三為二倍體芒果植株雌蕊授粉的過程示意圖，則圖三各種構造中，哪些為具有單套染色體的構造？（請以代號作答）

    (3) 若觀察某芒果雌株莖細胞的兩個基因座，其基因型分別為aa及BB，另一雄株的基因裂為Aa及bb，則芒果子葉構造的基因型可能為何？

    (4) 假設芒果具有二倍體與四倍體個體，若四倍體（4N）的雄株和二倍體（2N）的雌株雜交，則子代胚乳的染色體套數為何？

    (5) 一般芒果的花期多在每年的11～12月至次年的3～4月。冬天的低溫乾旱有利於芒果花芽的分化。對於易受颱風危害的芒果種植區來說，選擇早熟品種和能提早開花以提早芒果收穫期，並避開颱風，才能保證產量。而對於易受早春低溫陰雨影響的芒果種植區來說，推遲花期，避過低溫陰雨後再開花，才能獲得好收成。目前在農業技術上，可籍由摘除早油的花序後，並噴灑「巴克素（paclobutraezol $(PP_{333})$）」，可達推遲花期約40天的效果。根據上文敘述，請推測「巴克素」的成分，可能是下列何者？'
