  stem: 下列哪些結果符合本文的研究成果？（多選）
  options:
  - label: A
    content: MYBS1基因突變的種子可在長時間淹水時發芽
  - label: B
    content: 在同時淹水及缺糖時，在$CIPK_{15}$突變種子中發酵作用活性降低
  - label: C
    content: 缺糖時種子中α-澱粉水解酶的量沒有變化
  - label: D
    content: 提高α-澱粉水解酶活性可幫助$CIPK_{15}$突變種子在淹水時發芽
  - label: E
    content: 在淹水的$CIPK_{15}$突變種子中，α-澱粉水解酶基因的表現上升
  group_stem: '【閱讀二】近年來因環境變遷造成異常淹水逆境，已嚴重衝擊全球糧食作物的生產。淹水會造成植物根部缺氧、能量生成過少且產生酒精毒害而造成植物死亡。然而在所有的穀類作物中，水稻卻是唯一可耐淹水的重要糧食作物。淹水可增加水稻中植物激素的合成：一方面促進細胞分裂及延長，讓莖的莖節向上伸長，使植株高於水面以進行空氣交換；另一方面，促進根部皮層細胞部分老化死亡，進一步特化成具有較大細胞間隙的通氣組織，以利於儲存氧氣使根部維持活性。

    臺灣的學者經多年研究更進一步解開水稻耐淹水的分子調控機制。該研究團隊發現當水稻種子在淹水缺氧時，會誘導兩種蛋白激酶（$CIPK_{15}$及SnRK1A）、轉錄因子MYBS1及可將澱粉轉化成糖的α-澱粉水解酶（α-amylase）等基因的大量表現。先前研究已發現MYBS1可結合在α-澱粉水解酶基因的啟動子序列，增加α-澱粉水解酶基因的表現。而當植物細胞缺糖時，則會促成SnRK1A活化MYBS1的活性。進一步的分析則發現當水稻$CIPK_{15}$基因產生突變時，SnRK1A的蛋白質則無法累積，同時也觀察到$CIPK_{15}$突變種子無法在同時淹水及缺糖的情況下發芽而死亡。這些研究成果得知植物中耐淹水的機制為透過缺糖訊息傳遞途徑，促進碳水化合物的分解，使種子有足夠的能量在水中發芽。根據上文及所習得的知識，回答下列問題：'
