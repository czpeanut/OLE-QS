  stem: '芒果的花呈淡黃色，萼片4～5枚，花瓣與萼片同數。雄蕊、雌蕊與花瓣均著生於黃色花盤上，雄蕊4～5枚，但僅一枚完全較其他為大，雌蕊一枚位於花盤中央，而花瓣著生於花盤邊緣。當其完成雙重受精後，可見雌蕊的子房膨大，逐漸成長為芒果果實。當我們切開芒果，品嘗酸甜的果肉後，可見一白色毛狀的長扁卵形構造（果核／內果皮），若用剪刀剪開，則可發現芒果的種子位於其中。芒果的種子具褐色的種皮，內含兩枚子葉，播種種子後，可萌發出一株小芒果植株。

