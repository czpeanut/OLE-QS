  stem: 關於下列問題，哪些正確？
  options:
  - label: A
    content: 一朵花必須包括花萼、花瓣、雄蕊、雌蕊
  - label: B
    content: 對於不完全花，ABC模式應予以修正
  - label: C
    content: 花萼常見為綠色，其功能為保護花朵，並無法進行光合作用
  - label: D
    content: 開花植物又稱為被子植物，分單子葉與雙子葉植物
  - label: E
    content: 重瓣花的出現可能與A群與B群基因同時發生缺失有關
  group_stem: '開花是植物生活史中最錯綜複雜的過程之一。經由開花突變體基因的分析及其他的研究，過去由一些學者以阿拉伯芥（Arabidopsis thaliana）和金魚草（Antirrhinum majus）為模式系統，提出［ABC調控模式（ABC model）］來解釋基因突變種與花器性狀之間的關係。

    花的形成基因由分生組織基因（flower meristem identity gene）所決定，這個基因產物為蛋白質，可以當作一種轉錄調節因子，可與DNA結合以調節DNA的轉錄作用，並且進一步活化花的分生組織產生發育所需的基因，這些基因與花的形式發育關條密切，統稱為器官確認基因（organ identity genes），係由三組不同基因相互作用調控，也就是ABC調控模式。

    以下針對三組基因的調控方式進行說明：在阿拉伯芥的模式系統下，將參與花器形成的基因的功能區分為A、B、C三群。A群基因單獨調控花萼的形成，A群與B群基因共同調控花瓣的形成，B群與C群基因共同調控雄蕊的形成，而C群基因單獨調控雌蕊的形成。

    進一步研究顯示，A群與C群基因的活性互相拮抗，當一方發生突變時，另一方的功能會占據對方的位置。並且B基因不受A和C基因所影響。這些花器形成基因具有高度保留性，也透過這些花器形成基因的選殖而逐步將ABC調控模式的架構進行修正，並可應用在觀賞花卉的改良及新品種的開發。依據上文內容和習得知識，回答下列各題：'
- id: doc_111_桃園_武陵_自然_生物_選修生物II_g11s1e1_s3_37
  section: 3
  number: 37
  type: single
  page: 4
  stem: '附圖分別為正常生長之阿拉伯芥植株與突變植株的花器構造示意圖，根據ABC模型，試推測形成突變植株花器的原因？

    【閱讀二】

    近年來因環境變遷造成異常淹水逆境，已嚴重衝擊全球糧食作物的生產。淹水會造成植物根部缺氣、能量生成過少且產生酒精毒害而造成植物死亡。然而在所有的穀類作物中，水稻卻是唯一可耐淹水的重要糧食作物。淹水可增加水稻中植物激素的合成：一方面促進細胞分裂及延長，讓莖的莖節向上伸長，使植株高於水面以進行空氣交換；另一方面，促進根部皮層細胞部分老化死亡，進一步特化成具有較大細胞間隙的通氣組織，以利於儲存氧氣使根部維持活性。

    臺灣的學者經多年研究更進一步解開水稻耐淹水的分子調控機制。該研究團隊發現當水稻種子在淹水缺氧時，會誘導兩種蛋白激酶（$CIPK_{15}$及SnRK1A）、轉錄因子MYBSl及可將澱粉轉化成糖的α-澱粉水解酶（α-amylase）等基因的大量表現。先前研究已發現MYBSl可結合在α-澱粉水解酶基因的啟動子序列，增加α-澱粉水解酶基因的表現。而當植物細胞缺糖時，則會促成SnRK1A活化MYBSl的活性。進一步的分析則發現當水稻$CIPK_{15}$基因產生突變時，SnRK1A的蛋白質則無法累積，同時也觀察到$CIPK_{15}$突變種子無法在同時淹水及缺糖的情況下發芽而死亡。這些研究成果得知植物中耐淹水的機制為透過缺糖訊息傳遞途徑，促進碳水化合物的分解，使種子有足夠的能量在水中發芽。此篇論文的關鍵發現將可協助育出各種耐淹水作物，減少淹水農損。根據上文及所習得的知識，回答下列問題：'
  options:
