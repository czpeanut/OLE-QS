- id: doc_110_台南_台南二中_自然_生物_選修生物I_g11s1e2_s3_29
  section: 3
  number: 29
  type: single
  page: 4
  stem: 下列哪些反應或現象應該會出現在成熟的紅血球細胞中？
  options:
  - label: A
    content: 產生基因突變
  - label: B
    content: 細胞膜具有選透性
  - label: C
    content: 粗糙內質網的生成
  - label: D
    content: 中心體複製
  group_stem: 哺乳動物的紅血球主要功能為運輸$O_{2}$和部分的$CO_{2}$。在骨髓中初生成的紅血球稱為前紅血球母細胞（proerythroblas），含有細胞核與胞器，一段時間後發育為紅血球母細胞（erythroblast）。紅血球母細胞在進入血液之前會先將細胞核排出，形成無核的未成熟紅血球，而喪失有絲分裂的能力，此種血球稱為網狀紅血球（reticulocyte）。網狀紅血球在血液循環中會經歷1～2天的成熟期，過程中多數的胞器，包括粒線體與核糖體等都會消失，取而代之的是大量能攜帶$O_{2}$的血紅素，最後生成的成熟紅血球（erythrocyte）體積較小，外觀呈扁平狀，兩面中心向內凹陷。紅血球生成素（簡稱EPO）是一種由腎臟所產生的醣蛋白激素，當血液中$O_{2}$或成熟的紅血球減少，會增加EPO的分泌，EPO再結合到某些紅血球細胞表面的受器而刺激其增生。藉由遺傳工程的方式可獲得具有功效的EPO，臨床上可以用來治療因腎臟疾病所導致的貧血。研究發現，病人在注射EPO後1～2天即可在血液中偵測到成熟紅血球數量的增加。
  tags:
