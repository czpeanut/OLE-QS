  stem: 市面上可以看到名為「嫩肉粉」的調理產品，主打在醃漬肉類時加入一點，就能夠把柴柴老母雞變回軟嫩小鮮肉─這類商品為什麼能具有這種神奇功能呢？其實原理很簡單，在嫩肉粉中通常含有一種稱為木瓜酵素的蛋白，能將蛋白質分子變小，進而使得肉質變的軟嫩，下列有關使用此商品的敘述何者正確？
