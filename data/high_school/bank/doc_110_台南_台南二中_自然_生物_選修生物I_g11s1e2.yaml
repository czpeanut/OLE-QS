    content: 因為木瓜酵素是一種可以分解蛋白質的酶，所以多吃一點這類產品可以瘦身
  - label: C
    content: 醃漬生肉時，為了要殺死細菌和提高酵素活性，應該煮沸至攝氏一百度以上
  - label: D
    content: 蛋白酶除了能作用於蛋白質外，也能催化肝糖分解為葡萄糖，讓肉質更為鮮甜
