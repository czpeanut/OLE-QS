- id: doc_110_台南_台南二中_自然_生物_選修生物I_g11s1e2_s3_32
  section: 3
  number: 32
  type: single
  page: 4
  stem: 如果將細胞比喻成小型工廠，許多不同的「部門」分工合作維持工廠的最佳運作。但若大環境不佳或員工壓力太大，就可能造成各生產線中出現不良產品，藉由許多微小的「垃圾回收車」來清理異常的胞器、老舊的蛋白質或入侵的微生物等，接著將垃圾載往「垃圾處理場」，整個過程稱為「自噬作用」。以上敘述中「部門」、「垃圾回收車」及「垃圾處理場」的配對依序為何？
  options:
  - label: A
    content: 胞器、高基氏體、過氧化體
  - label: B
    content: 細胞核、高基氏體、溶體
  - label: C
    content: 細胞核、囊泡、過氧化體
  - label: D
    content: 胞器、囊泡、溶體
  group_stem: '當細胞處於各種環境壓力下，如溫度、酸鹼、飢餓、缺氧，為了因應惡劣環境，會啟動許多相應的存活機制，其中一種機制就是自噬作用（autophagy）。直到1990年代，我們才從日本科學家大隅良典的研究中，了解細胞自噬的詳細機制。大隅教授也藉此研究榮獲2016年諾貝生理醫學獎。

    「細胞自噬」簡單來說，就是細胞對於自己的胞器進行分解、回收的機制。每個細胞都有壽命以及階段性的任務，當細胞完成任務後，就會開啟一連串的程式性死亡。細胞自噬與細胞凋亡最大的不同，在於細胞自噬只要度過危機，細胞就不見得會死亡。在部分情況下，細胞自噬也會誘導進行細胞凋亡或者啟動自噬式的細胞死亡。細胞自噬會維持細胞內蛋白質與胞器的恆定並控管胞器的品質，包括長半衰期的蛋白質以及粒線體、過氧化體、內質網等胞器。如果細胞自噬的基因產生突變，可能導致細胞無法正常清除有害的蛋白質、胞器，還有細胞分化與胚胎發育過程中從外面入侵的細菌或病毒，進而導致感染發炎反應、老化、神經系統退化、第二型糖尿病、癌症病變等疾病。

    以失智症和帕金森氏症等神經退化性疾病為例，一開始都是因為蛋白質不正常摺疊、堆積所致，而細胞自噬就像是清道夫一般，可以清除不正常結構的蛋白質。如果能夠了解啟動細胞自噬的機制，可能就可以發現這些疾病的有效療法。'
