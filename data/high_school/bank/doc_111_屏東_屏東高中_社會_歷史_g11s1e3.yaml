- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 大謙想要撰寫一份關於美國在二戰後社會改變的報告，請問他可以參考並搜尋哪些關鍵字，來找到他需要的資料？
  options:
  - label: A
    content: 經濟大恐慌／難民／納粹
  - label: B
    content: 普普藝術／北大西洋公約組織／反戰運動
  - label: C
    content: 推動計畫經濟／石油／平權運動
  - label: D
    content: 西線無戰事／馬克通膨／福利國家
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 二戰結束後，很快世界就進入冷戰對立的局勢，連帶影響美國社會與文化的發展，(B)為正解。(A)(D)一次大戰後的情勢。(C)「推動計畫經濟」為經濟大恐慌時期的措施。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 1964 年，某人曾在法庭上替自己辯護，他說：「我對抗白人統治，我也對抗黑人統治。我珍視民主自由社會，所有人能和諧共處，擁有均等的機會。我為此理想而生，也希望有朝一日能達成這個理想。但如果有必要，我也準備好為這理想而死。」後來此人對南非有極大的影響。請問此人的辯護與下列何者有關？
  options:
  - label: A
    content: 民族自決風潮
  - label: B
    content: 種族衝突大屠殺
  - label: C
    content: 給予殖民地國家和人民獨立宣言
  - label: D
    content: 種族隔離政策
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 這位抗議人士應是曼德拉，從「所有人能和諧共處，擁有均等的機會」的主張，可知其抗議在南非政府的(D)種族隔離政策，使黑人無法享有與白人同等的權利。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 一段英國工黨形成的討論如下：「工黨組成的目的，就是為了在政治上和立法上保護工人階級的經濟利益。而在實踐上，工會主義者把工黨的成長發展列為首要，因此極力避免大規模地與國家機器對決，傾向以合法的手段選出工人代表，進而建立工人的政府。」下列敘述何者較為合理？
  options:
  - label: A
    content: 英國工黨延續費邊社的主張推動改革
  - label: B
    content: 英國工黨傾向較激烈的革命推動改革
  - label: C
    content: 英國工黨並未接納工會主義的支持者
  - label: D
    content: 英國工黨積極地保障所有階級的利益
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 工黨「極力避免大規模地與國家機器對決，傾向以合法的手段選出工人代表」，此與費邊社會主義的主張不謀而合，可知是受其影響，因此(A)為正解。(B)避免與國家機器對決，因此反對激烈的革命運動。(C)應是接納工會主義者。(D)主要保障工人階級的利益。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 天主教神學體系派系眾多，其中一支被命名為「解放神學」派，於 1960 年代創立並逐漸發展起來，並主張要求教徒須積極實踐，特別是針對社會中的公平正義，包括資源過度集中少數人、經濟剝削和種族歧視的問題等，教徒應試圖扭轉社會的問題。該派系是天主教傳入該地後，將教義重新解釋後的結果，並一度蔚為流行。請問何者是此派出現的地方？
  options:
  - label: A
    content: 亞洲東部
  - label: B
    content: 北美地區
  - label: C
    content: 中南美洲
  - label: D
    content: 中東地區
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中有幾個線索，「解放神學」的發展地有資源過度集中少數人、經濟剝削和種族歧視等問題，此外，「解放神學」並非 1960 年代自外地傳入，而是「天主教傳入該地後，（1960 年代）將教義重新解釋後的結果」，選項中僅(C)中南美洲為信仰天主教地區，且當地的社會問題與題文相符。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有一張圖片為女性投票權相關議題的海報，圖中的男人身上寫著「政治手段」字樣，左手邊有一群在投票站排隊的流浪漢，他將手上的錢交給尾端身上寫有「流浪漢」的男子，而右手則試圖阻止想要爭取婦女選舉權的女性。小插圖的場景有婦女照料小孩、在工廠工作以及被警察逮捕等畫面。海報最下方則有「女性該有投票權嗎？不，他們會打亂現有事務的順序」字樣。關於此圖片，下列敘述何者正確？
  options:
  - label: A
    content: 第一次世界大戰後，女性在戰時對國家的貢獻深受肯定，女性是否該擁有投票權的問題亦被提出討論
  - label: B
    content: 隨著教育的普及化，女性逐漸參與推動平等參政權的運動，並藉由俄國二月革命提升社會影響力
  - label: C
    content: 歐洲民主國家女性在 1880 年代多數已享有投票權
  - label: D
    content: 歐洲國家的女性參政權運動推行非常順利
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)女性在第一次世界大戰後才明顯提升社會影響力。(C)歐洲民主國家女性直到 20 世紀第一次世界大戰後才陸續享有投票權。(D)從圖片的描述即可看出女性參政權運動的推行阻力甚大。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 雖然歐洲自 20 世紀逐步退出對非洲殖民地的控制，但非洲各國並未脫離歐洲的控制，反而陷入另一種形式的牢籠，學者稱之為「新殖民主義」，請問何者是新殖民主義的內涵？
  options:
  - label: A
    content: 文化滲透
  - label: B
    content: 干涉信仰
  - label: C
    content: 武力控管
  - label: D
    content: 經濟宰制
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 在獨立之後，許多非洲國家因為政權無法穩定、經濟無法自立，因此許多歐洲大國不再像以前以軍事來占領殖民地，而是改用經濟或文化等方式來影響當地，尤其以(D)經濟宰制的方式繼續控制原有的殖民地國家。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '資料一：印尼領導者蘇卡諾的演說：「第二次……東西方之間的戰爭，是最近的日本與盟軍間的戰爭，東方又再次輸了。但是，直到今日，西方仍不覺得它們已經吃到夠多勝利的果實。現在，西方正在走向第三次戰爭，這次，該是印尼人取得勝利的時候了。」

    資料二：聯合王國與緬甸臨時政府的協議：「期望在完全自由、平等和獨立的條件下，確定其作為獨立國家政府間在未來的關係，並鞏固和延續它們之間存在的友好友誼和良好的理解。」

    關於以上資料，下列敘述何者正確？'
  options:
  - label: A
    content: 資料一和資料二的殖民母國分別是荷蘭、英國
  - label: B
    content: 資料一以和平的方式獨立，資料二透過武裝抗爭的方式獨立
  - label: C
    content: 在二戰後國際輿論壓力下，兩國的獨立方式都是和平獨立
  - label: D
    content: 印尼獨立是在一戰後，緬甸獨立是在二戰後
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 印尼與緬甸分別脫離自荷蘭、英國而獨立，(A)為正解。(B)資料一以武裝抗爭方式獨立，資料二以和平談判方式獨立。(C)印尼以武裝抗爭方式獨立。(D)印尼在二戰後才獨立。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 「馬的哀號聲簡直是世界上最悲慘的聲音，所有備受折磨的生物都會發出陣陣哀嚎。那匹馬的哀嚎影響了軍事的行動，不得已的我們只好站起來把牠處理掉。對，處理，面對死亡時的委婉詞彙，搭配著滿聲響起的火箭砲爆炸聲，滿天的星星和死亡的動物，如此奇妙。……他聲音激動的說：『要動物參加戰爭，大概是世界上最殘忍的事。』」請問此小說符合下列哪一項分類？
  options:
  - label: A
    content: 爭取非裔人權的過程
  - label: B
    content: 女性主義的理論
  - label: C
    content: 民權運動的精神
  - label: D
    content: 反戰精神的文藝
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中充滿對戰爭場景的描述，加上「要動物參加戰爭，大概是世界上最殘忍的事」的說法，可見小說所呈現的是(D)反戰精神的文藝。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 他這趟旅行讓「他」看到了中南美洲各國的社會現實面，包括階級的不公、種族的壓迫、貧富差距，認識南美洲在當代社會的處境，醞釀他之後發動革命的種子，並寫下革命前夕的《摩托車日記》一書。他曾說：「漫遊南美洲對我造成的改變，遠超過我所能預見。」哲學家沙特說過他是「當代最偉大的英雄」。請問「他」後來投入了哪國的革命運動？
  options:
  - label: A
    content: 印尼
  - label: B
    content: 巴西
  - label: C
    content: 古巴
  - label: D
    content: 印度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中的「他」是切．格瓦拉，原是醫學院學生，卻在騎摩托車環遊中南美洲之後，毅然決然投入革命事業，並助卡斯楚在(C)古巴建立社會主義國家。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: '右表為某一洲的獨立國家總數，下列關於此地區的敘述，何者正確？

    | 年分 | 獨立國家數 |

    | --- | --- |

    | 1949 年以前 | 4 |

    | 1950 ～ 1959 年 | 12 |

    | 1960 ～ 1969 年 | 44 |

    | 1970 年以後 | 57 |'
  options:
  - label: A
    content: 因美國推行睦鄰政策，該洲國家紛紛獨立
  - label: B
    content: 表中國家獨立後仍存在著族群衝突的問題，如盧安達大屠殺
  - label: C
    content: 表中國家以發起不合作運動的印度先獨立
  - label: D
    content: 獨立後的國家界線皆以族群分布為標準
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 此洲在 1949 年以前僅有 4 個獨立國家，1960 年代後則有大量國家獨立，因此可推知為最晚獨立的非洲，(B)為正解。(A)美國推行睦鄰政策為 1930 年代，中南美洲國家多在 1830 年代已獨立。(C)印度在亞洲。(D)當年列強為自身利益而任意劃分疆域，導致非洲國家獨立後無法以族群分布劃分國家界線。
- id: doc_111_屏東_屏東高中_社會_歷史_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「埃及總理沙達特與敘利亞政府於 1973 年發動贖罪日戰爭攻打以色列，贖罪日為以色列人最重要的假日，這場戰爭造成以色列人重大的傷亡，但進攻的那一方並未達成戰略目標。不久，蘇伊士運河再度開放，雙方領導人進行和平交涉，於 1979 年達成和約，雖然仍有許多問題並未解決，但至少暫時的進入和平狀態。」阿傑整理了關於此場戰爭的筆記，其中何者是正確的？
  options:
  - label: A
    content: 1973 年埃及與以色列的戰爭造成世界性的氣候危機
  - label: B
    content: 1979 年巴勒斯坦成功建立以阿拉伯人為主的巴勒斯坦國
  - label: C
    content: 1979 年簽訂和平協議後以色列和阿拉伯國家不再有武裝衝突
  - label: D
    content: 在美國的援助下，以色列最終取得戰爭的勝利
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)阿拉伯地區的石油生產國為打擊支持以色列的歐美國家而發動石油禁運，造成世界性的石油危機。(B)巴勒斯坦國於 1988 年建立。(C)至今以、阿衝突依舊是國際秩序中的棘手難題。

    12.1975 年南越淪陷，因此大量越南難民海漂逃難，(A)為正解。(B)美國撤離越戰後，南越不敵北越而遭到攻陷。(C)最終北越、南越合併，成立越南社會主義共和國。(D)臺灣被納入東亞反共防線是在韓戰後。

    13.這段演講為馬丁．路德．金恩的「我有一個夢」節錄，(A)為正解。(B) 1960 年代除了黑人民權運動外，同時有因美軍參與越戰而起的反戰浪潮。(C)瑪莉．吳爾史東克拉夫特為英國 18 世紀的女權作家，不可能於 1960 年代參與美國女性大罷工。(D)美國大學的校園民主運動反對美國介入他國內政，即反對美軍參與越戰。

    14.(A)雖然世界社會論壇反全球化，但其反對的是不公平的體制造成貧富差距，並非世界不需要分工。(B)世界社會論壇是為與世界經濟論壇相抗衡而在一月開會。(C)為正解。(D)阿富汗由塔利班掌權，與卡敏坦主張增加公民參與公共事務的民主機制不符。

    15.1969 年美國正陷於越戰泥淖中，因此尼克森才會認為未來國際局勢將「轉為多股勢力並存的多極世界」，並且決定「降低對亞洲國家內政的積極介入，特別是內戰」，從主張「越戰越南化」到最後退出越戰，因此(C)為正解。(A)美國降低對亞洲的介入，不代表就強化對歐洲的控制。(B)美國在越戰中落敗。(D)第三世界的態度是不結盟政策，並未親共。

    16.911 事件的主謀賓拉登所領導的蓋達組織，受到阿富汗的塔利班政權支持，因此美國宣布向恐怖主義開戰，發兵進攻(C)阿富汗。

    17.(A)從題文的內容來看，此項計畫顯然並未成功讓低度開發國家經濟成長。(C)此決議案的目的應是減緩南方國家與北方富國的經濟差距。(D)北方富國並非拒絕提供協助，但在施行上有其考量與困難。

    18.1947 年蘇聯欲將勢力擴張到希臘與土耳其，因此杜魯門宣示援助兩國以阻止共產勢力蔓延，(D)為正解。

    19.(A)(B)題文中提到美國最終「放棄了解體財閥與除去資本集中的政策」。(C)美國在日本的改革範圍及於政治、經濟、社會各領域，非僅侷限於軍事體制。

    20.吳爾芙主張女性應有屬於自己的空間，許多女性因在家庭中缺乏屬於自己的空間，因此難以培養個人興趣與才能，被迫依賴丈夫或父親而使尊嚴與地位降低，因此她所想要闡述的重點應是(B)女性應該擁有隱私與自我的掌控權。

