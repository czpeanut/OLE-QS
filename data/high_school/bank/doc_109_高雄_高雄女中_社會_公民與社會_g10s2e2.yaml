  group_stem: ◎21.～21.為題組 大新科技總公司設立於美國，其經營特點是零庫存，透過網際網路接受訂貨、即時生產（Just In Time），不經過中盤商而由公司直銷到消費者手中。雖然這種經營方式，可能導致交貨期延長和單位物流成本增加，但該公司卻能克服困難，於 21世紀初發展成知名的跨國企業，在全球各地廣設生產據點和客服中心，公司總部也根據市場需求不斷研發新產品。大新的成功與其用人文化密切相關，外文系畢業的臺籍女生吳意文就是其中一例。吳意文第一份工作是電腦公司業務，之後加入大新，受重用成為產品開發部門總監，現長期旅居美國，管理臺美研發團隊。許多人都好奇，吳意文沒有理工背景，如何帶領研發團隊？但她指出，科技產品的研發趨勢為重視使用者體驗，她的長項在於理解用戶需求，讓研發者不會只著眼於技術突破，使人文與技術有效互補。不過，回首職涯，吳意文也承認，身為一個外文系畢業卻任職科技公司的女生，當初高層要升任她當研發主管時，難免自我懷疑而問道：「我是女的，又是外文系，適合嗎？」但主管的一句「妳為何畫地自限？」讓她獲得更多勇氣。<u>對於自己的跨領域突破，吳意文強調企業用人重視多元，亦即對不同文化背景員工皆能無差別對待，無論所學為何、各種思維觀點，都給予機會發揮才能</u>，是員工可以追求自我突破的重要因素。請問：
