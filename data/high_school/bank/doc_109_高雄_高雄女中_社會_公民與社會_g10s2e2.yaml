  stem: 巴貝多的政府體制應偏向下列何者？（請勾選一項） □內閣制 □總統制 可以從文章何處判斷出來？請簡要摘述題文為佐證。（4分，限40字內，全對才給分）
  group_stem: 加勒比海島國巴貝多（Barbados）於2020年9月宣佈準備取消英國女王伊麗莎白二世（Queen Elizabeth Ⅱ）作為該國國家元首的地位。 巴貝多1966年脫離英國獨立，但仍為大英國協的一員，且以英國女王伊麗莎白二世為國家元首，而巴貝多總理為政府領導人，握有行政實權。不過巴貝多要捨棄維持超過半世紀的君主立憲制，15日的國會第2會期開議演說中，總督梅森宣讀總理莫特利所寫講稿，表明2021年要轉為共和制。 「是時候完全擺脫過去的殖民樣貌了」，梅森宣讀講稿稱，「巴貝多想要有自己的國家元首，這是自我認同和有能力達成目標的最終信心宣言，巴貝多會在慶祝獨立55周年（2021）前，採取合理步驟建構完整主權的共和國」。 BBC分析，取消女王作為國家元首地位，是一件很少發生的事，上一次發生已距離至今近30年，模里西斯於1992年宣布改為共和制，實行議會民主制，總統則作為國家的虛位元首。 近來「黑人的命也是命」（Black Lives Matter）的平權運動延燒下，曾經被作為奴隸販賣的慘痛歷史，也可能讓其他前殖民地國家思考，是否要呼應巴貝多。
