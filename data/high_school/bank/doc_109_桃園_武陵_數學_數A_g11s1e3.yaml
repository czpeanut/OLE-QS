  - label: B
    content: $\vec{a}$和$\vec{b}$－2$\vec{a}$的夾角是鈍角
  - label: C
    content: '|$\vec{a}$＋$\vec{b}$|＝7'
  - label: D
    content: '|$\vec{a}$＋2$\vec{b}$|＝97'
  - label: E
