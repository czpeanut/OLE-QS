- id: doc_112_高雄_三民_自然_生物_選修生物V_g12s1e2_s6_48
  section: 6
  number: 48
  type: multiple
  page: 6
  stem: 由上述文章內容判斷，下列敘述哪些正確？（應選3項）
  options:
  - label: A
    content: 細菌數目與人類細胞的比例是10：1
  - label: B
    content: 人體中數量占比最高的細胞是紅血球
  - label: C
    content: 以重量來看，人類細胞占比最高的是肌肉細胞
  - label: D
    content: 人類微生物群系中，物種指的是生活在人體的微生物，而其生活的「棲地」就是人體
  - label: E
    content: 細菌以數量來說約等於人類細胞，但其質量卻只占人體的百分之三
  group_stem: ◎ 生物群系是由各類型生物群落組成，在生態學上，亦可以是由氣候條件相似並按照氣候和地理劃分的區域。生物群系屬於大尺度的生態環境，亦被認為是生態系統。 我們可以利用群系的概念來探討人體內的小小世界，以腸道為例：這些不可計數的微生物，其約具有200～300萬的基因數，是人類遺傳基因數的100倍以上。藉分析基因組來探討整個組成，則稱為微生物群系（Microbiome），其與微生物叢（Microbiota）兩者常被互通使用；而這整個微生物族群所產生的代謝物質將被吸收，甚至通過腦的血腦屏障（Blood-Brain Barrier，BBB），影響整個生理機能，甚至身心的問題；人體腸道菌叢與身體各器官連結，如腸-腦軸（Gut-Brain axis），腸-皮膚軸（Gut-Skin axis），腸-肝軸（Gut-Liver axis），腸-免疫軸（Gut-Immune axis），在人體的健康生理病理機制扮演重要角色。 學界引進了生態學的思考方式，將人體視為棲息地（human as habitat perspective）而非戰場，微生物是人體的一部份而非外來者，身體狀態是細菌與人體細胞共同作用的外顯特徵，體內微生物的組成和神經疾病、肥胖、過敏相關，微生物不只單純棲息於體內，它們可能參與人體生理的大小反應。健康則是生態平衡的紅利（ecosystem service），不是固有的狀態。 目前最新的研究顯示，人類的細胞總數約莫30億個，而據估計人體內的細菌總數約38億個（如圖1），這樣的數據己推翻了最常被提及的細菌數與人類細胞數的比例是10：1的說法。人體應可認定是地球上最複雜的生態系統之一，與人體共同演化之各部位微生物相（Microbiota）有相當高的密度、多樣性及複雜性。 圖1 細菌與人體中不同細胞類型的細胞數量和質量分布（70公斤的成年人） 上方橫條顯示細胞數量，下方橫條顯示每種主要細胞的占比，它們構成了整個細胞的身體質量（不包括增加額外的≈24 kg的細胞外質量）。為了比較，右邊顯示細菌的占比，僅占0.2千克，約占體重的0.3％。 正因為有許多的細菌就生活在人體，我們對於牠們的存在展現了高度的興趣，在人類基因組完整定序後，美國國立衛生研究院（NIH）2008年發起「人類微生物組計畫（human microbiome project 1，HMP1，2008～2012）」，以歸納出完整的人類微生物組的基因特徵，隨著DNA定序費用的降低，要辨別不同的微生物的種類以及他們對於人類健康和疾病的影響，變得更加容易。 第一期的人類微生物組計畫，分析來自300個健康人類的5個人體區域（鼻腔、口腔、皮膚、腸胃道、生殖泌尿道）的微生物組成，來瞭解人體微生物相的所涉及到的代謝途徑等生物功能。第二期的人體微生物組計畫（Integrative Human Microbiome Project，IHMP，2013～2016）利用多種組學「omics」技術來瞭解女性生殖泌尿的菌叢在懷孕期間的改變以及菌叢組成與早產之間的關聯；腸道菌叢的組成及其代謝活性的變化是否與炎症性腸病（inflammatory bowel disease）有關；呼吸道相關疾病以及人體腸道微生物相與第二型糖尿病之間的關係。
