    content: 在生態系中，硫化菌與硝化菌所扮演的角色相同
  - label: E
    content: 細胞內進行酵素代謝反應的最適溫度和人類相同
  group_stem: ◎ 1977年，海洋生態學家首次在靠近加拉巴哥群島附近的太平洋2700公尺深的海底發現深海熱泉，灼熱的岩漿從海底的裂谷和斷裂處不斷地向上噴湧，噴出的流質狀煙霧溫度高達300℃以上，富含硫化物。海底熱泉形成於板塊活動頻繁的海底火山附近，最容易出現這樣的熱泉區多靠近中洋脊或其他有海底火山活動的海域。在深海熱泉生態系中，生物以硫化氫為主要的能量來源，硫化菌可以分解硫化氫，利用產生的能量生成有機物質，供深海生物所需，300℃至450℃以上的噴出物遇冷，使含硫的細微顆粒迅速沉澱而形成黑霧狀。深海熱泉生物消費者大抵以管蟲類、甲殼類（如鎧甲蝦、螃蟹）、貝類等為主要組成份子，其中像是管蟲或固著性的貽貝，其體內並沒有消化道，但有與硫化菌共生的組織。 不過這樣的生態系統還有下列問題，通常一個熱液噴出口的存在時間約幾十年不等，當熱泉熄滅了之後，所有的生物就必須遷移，否則就會跟著死亡。深海中除了熱泉外，最佳的硫化氫來源就是沉在海底的動物屍體，有人相信一些大型鯨魚的屍體可以成為熱泉生物尋找下一個熱泉的跳板。
