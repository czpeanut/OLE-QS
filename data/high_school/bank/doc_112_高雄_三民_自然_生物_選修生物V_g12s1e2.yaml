    content: 掠食的優勢會傷害本地生態平衡
  group_stem: ◎ 以下為題組 在臺灣發現的紅火蟻主要是Solenops isinvicta，它是Solenopsis中280個物種之一，原產於南美洲，但最直接的來源指向美國加州。1930年代，紅火蟻在美國的南方沿海各州被發現，並引人注意。經追查，此物種最先出現在阿拉巴馬州，與貨船的泊靠有關。為防止紅火蟻在臺灣造成嚴重危害，2004年各方力促成立專責機構，採取積極行動，以降低其對人體健康、社會擾動、經濟損失以及生態變遷等的危害。 紅火蟻是絕佳的掠食者，其獵物包括甘蔗的害蟲白斑擬蝶蛾，及水稻的害蟲稻褐蝽等。但是牠也殺害傳粉昆蟲，如蜜蜂等諸多物種。控制紅火蟻並不容易，物理方法是對蟻巢用火燒或噴熱蒸氣來消滅蟻塚，但卻是危險的行動；化學方法如用毒劑混入食餌中毒殺之。在南美洲，蚤蠅（Pseudacteont ricupis）會產卵並寄生在紅火蟻的頭胸部，且具有物種專一性。蚤蠅的幼蟲會逐步啃食紅火蟻的頭部，以其外骨骼的成份作為蛹殼。科學家也發現20％的紅火蟻帶有SINV-1病毒，造成蟻群慢慢死亡。依本文所述及相關知識，回答下列問題。
