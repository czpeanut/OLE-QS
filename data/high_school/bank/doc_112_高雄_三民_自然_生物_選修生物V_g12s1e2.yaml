  group_stem: ◎ 以下為題組 在海洋中，有一群「小生物」利用溶於表層海水的二氧化碳與營養鹽來進行光合作用，將無機的二氧化碳轉變為碳水化合物（海洋學家通稱為顆粒有機碳），就會降低海水中二氧化碳的分壓，導致更多大氣中的二氧化碳在海水中溶解，這些顆粒碳被帶離有光層，會因重力慢慢下沉至深海被儲存，稱為「生物幫浦」，也稱為顆粒有機碳輸出通量（POC flux）。雖然這些被帶至深海儲藏的有機碳最終也會被分解成溶解性無機碳或有機碳，但深層海水的循環與流動非常慢，加上深海停留時間較長，因此這些被帶至深層海洋的碳要約五百年後才能再回到大氣中。 除了「生物幫浦」，大氣中的二氧化碳透過海氣交換溶解到海水，再透過低溫水的下沉作用，將二氧化碳帶至深海則被稱為「物理幫浦」，這主要是發生在高緯度海域，總計海洋透過「生物幫浦」及「物理幫浦」兩項作用，扮演減碳大功臣的角色，約能吸收地球的總碳排放量1／4～1／3。科學家發現「小生物」執行生物幫浦的能力受到光照、營養鹽、溫度的影響很大。附圖為薔密（Jangmi）颱風行經某海域後的調查結果，圖中實線表示颱風前該數據之平均數值、虛線則為颱風前該數據之誤差值、各長條圖代表颱風過境後4天與7天的平均數值與誤差值。［參考文章：洪慶章（2017）聯合報-大海如何減碳］
