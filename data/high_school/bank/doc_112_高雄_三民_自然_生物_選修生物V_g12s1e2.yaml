  group_stem: ◎ 界、門、綱、目、科、屬、種，許多人都可以朗朗上口的背誦著，其中最低位階的「種」，也是在學習中很常被提及的，例如：二名法的種名，又或是各式「種」的定義。而「種」這個分類位階是一個很迷人的存在，「種」是生物分類系統中唯一具有人類與自然性質的位階，因為不論分類系統是否存在，「種」都真實存在，「種」是由演化所定義，達爾文手記的生命之樹，基本單位也是「種」。 「種」指的是一群由獨立演化的關聯族群（meta population）組成的譜系（lineage），各物「種」間具有生殖隔離，此即最為經典的生物「種」定義。不過現今生物學者仍在尋找各式不同界定「種」的方法，據信目前有近70個物種理論。 【臺灣特有種】 臺灣寶島是很常見的說法，所以我們就由「臺灣特有種植物」的角度來切入。首先，先來說明什麼是「特有種」，特有種是指分布限於某一特定地區的特色物種。該物種時常反應出分布區域的特色，若是其分布區域範圍狹小，只要其棲地環境受到破壞，這個特有種很可能消失。（這裡所提到的分布區域範圍主要是以人為的行政區來闡述，可能為洲、國家，也可能是島嶼或一處） 因此，要界定或是描述特有種，應先定義地域範圍，而所謂特有植物（endemic plant），即指侷限分布於特定地域的植物物種。臺灣四面環海，但物種的親緣地理關係與鄰近的歐亞大陸相近，因此，臺灣僅有特有的屬與種，而沒有特有科的存在。根據《臺灣植物誌》第二版，臺灣的特有種植物共有1,067種，約為全臺灣植物種總數的四分之一。 【臺灣特有屬】 在分類的歷史裡，臺灣「曾經」有4個特有屬，而在經由更多分子層次的分析與鑑定後，現在僅有一個特有屬。那些「曾經」指的是：華蔘屬（Sinopanax）、臺灣東部的玉蘭草屬（Hayataella）、南部淺山地區的銀脈爵床屬（Kudoacanthus），以及廣泛分布於中海拔地區的香蘭屬（Haraella），目前唯一的特有屬只剩下唯一木本的華蔘屬。 「屬」這個階層，對於我們研究一地的自然史，具有重要的地位。因為「屬」具有以下特徵：「屬」必定是一個單系群，組成這個「屬」的所有物種，是該「屬」共同祖先的所有後代。「屬」有演化上的意義，在型態上，具有一定的共同特徵；在遺傳上累積一定程度的變異。起源較為久遠，表示其獨立演化的時間尺度夠長。而這些特徵在研究某地區自然史優於「種」原因在於尺度，「屬」更容易與已知的大尺度地質或氣候連結，不同於「種」可能過於區域性的缺點，「特有屬」就具有其重要的價值。 圖1 五加科親緣樹。Fatsia：八角金盤屬、Sinopanax：華蔘屬、Oreopanax：山參屬
