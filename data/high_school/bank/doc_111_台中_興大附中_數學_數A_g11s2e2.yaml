- id: doc_111_台中_興大附中_數學_數A_g11s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 在空間坐標中，下列敘述何者正確？
  options:
  - label: A
    content: x－y＋z＝5 的圖形為一平面
  - label: B
    content: $\begin{cases}x=5-2t \\ y=7+3t \\ z=-2+t\end{cases}$（t 為實數）的圖形為一直線
  - label: C
    content: $\frac{x}{5}=\frac{y-1}{-4}=\frac{z+7}{2}$的圖形為一直線
  - label: D
    content: 3x－y＝7 的圖形為一直線
  - label: E
    content: $\begin{cases}2x+y-z=3 \\ 4x+2y-2z=6\end{cases}$的圖形為一直線
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：x－y＋z＝5 為法向量（1，－1，1）的平面

    (B) ○：$\begin{cases}x=5-2t \\ y=7+3t \\ z=-2+t\end{cases}$為方向向量（－2，3，1）的直線

    (C) ○：$\frac{x}{5}=\frac{y-1}{-4}=\frac{z+7}{2}$為方向向量（5，－4，2）的直線

    (D) ╳：3x－y＝7 為法向量（3，－1，0）的平面

    (E) ╳：$\begin{cases}2x+y-z=3 \\ 4x+2y-2z=6\end{cases}$⇒ 2x＋y－z＝3 為法向量（2，1，－1）的平面

    故選(A)(B)(C)'
