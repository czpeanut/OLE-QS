- id: doc_111_台中_興大附中_數學_數A_g11s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設 A、B 為兩事件，且滿足 P（A ∣ B）＝$\frac{2}{3}$，P（B'）＝$\frac{1}{4}$，P（A－B）＝$\frac{1}{6}$。請選出正確的選項。
  options:
  - label: A
    content: P(A)＝$\frac{11}{12}$
  - label: B
    content: P（B ∣ A）＝$\frac{1}{3}$
  - label: C
    content: P（A ∪ B）＝$\frac{11}{12}$
  - label: D
    content: P（A' ∩ B）＝$\frac{1}{4}$
  - label: E
    content: P（B－A）＝$\frac{5}{6}$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$P (A | B)=\frac{P (A \cap B)}{P (B)}=\frac{2}{3}$，P（B''）＝1－P(B)＝$\frac{1}{4}$，

    P（A－B）＝P(A)－P（A ∩ B）＝$\frac{1}{6}$

    ∴P(B)＝$\frac{3}{4}$，P（A ∩ B）＝$\frac{1}{2}$，P(A)＝$\frac{2}{3}$

    (A) ╳：P(A)＝$\frac{2}{3}$

    (B) ╳：P（B ∣ A）＝$\frac{P (A \cap B)}{P (A)}=\frac{\frac{1}{2}}{\frac{2}{3}}=\frac{3}{4}$

    (C) ○：P（A ∪ B）＝P(A)＋P(B)－P（A ∩ B）

    ＝$\frac{2}{3}+\frac{3}{4}-\frac{1}{2}=\frac{11}{12}$

    (D) ○：P（A''∩ B）＝P(B)－P（A ∩ B）

    ＝$\frac{3}{4}-\frac{1}{2}=\frac{1}{4}$

    (E) ╳：P（B－A）＝P(B)－P（A ∩ B）

    ＝$\frac{3}{4}-\frac{1}{2}=\frac{1}{4}$

    故選(C)(D)'
