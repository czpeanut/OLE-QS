  stem: 設 A 與 B 為獨立事件，則下列選項何者正確？
  options:
  - label: A
    content: $P(A\mid B) = P(B\mid A)$
  - label: B
    content: $P(A\mid B) = P(A)$
  - label: C
    content: $P(A\mid B) = P(B)$
  - label: D
    content: $P(A\cap B) = P(A)\times P(B)$
  - label: E
    content: $P(A'\cap B') = P(A')\times P(B')$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'A 與 B 為獨立事件，

    表示 P（A ∣ B）＝P(A)，P（B ∣ A）＝P(B)，P（A ∩ B）＝P(A)×P(B)

    且 A'' 與 B'' 亦為獨立事件

    (A) ╳：P（A ∣ B）＝P(A)，P（B ∣ A）＝P(B)，

    因此 P（A ∣ B）≠P（B ∣ A）

    (B) ○：P（A ∣ B）＝P(A)

    (C) ╳：P（A ∣ B）＝P(A)

    (D) ○：P（A ∩ B）＝P(A)×P(B)

    (E) ○：P（A'' ∩ B''）＝P（A''）×P（B''）

    故選(B)(D)(E)'
