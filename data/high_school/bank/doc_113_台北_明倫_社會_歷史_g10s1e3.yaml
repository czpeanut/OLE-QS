  stem: 17 世紀後期，英國的貿易談判代表向英國某地商館報告說：「這裡屬大員的船隻有兩百艘。今年十八艘開往日本，其中大半為國王所有，鹿皮全為國王的貨物，年產有二十萬張。臺灣每年產糖五萬石。國王的政府甚嚴。登記有案的兵士有七萬名。在最初三年間，賜錢及米，並撥給一塊土地為生活，又配給畜牲以施肥。以後就停發錢及米。他們不被允許回去中國。」請問英國貿易談判代表謁見的臺灣國王，應為何人？
