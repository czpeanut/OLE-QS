  stem: 一份 18 世紀前期的資料記載：「過去臺灣有社無莊，南北千餘里，草木茂密，各番以世相承，用資捕鹿，名曰『草地』，此疆彼界，社番自定。迨後地入版圖，閩粵之人以次鱗集，或向番贌墾，年貼社餉、社租或向番價買，昔日荒蕪，今為沃壤矣。」以下對於該資料的解讀，何者最為合理？
  options:
  - label: A
    content: 「有社無莊」是因清廷禁止興建城池
  - label: B
    content: 「草地」的界線即指官府劃定的土牛界線
  - label: C
    content: 漢人移民透過支付「番大租」取得番地耕作權
  - label: D
    content: 描述漢人武力侵墾番地迫使原住民遷徙的現象
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)「有社無莊」指漢人來臺前，只有原住民村社的時代。(B)「草地」的界線由社番自定。(D)題文描述漢人向番贌墾租借或購買土地，非武力侵墾番地。
