  stem: 有人認為臺灣某種信仰有以下的特色：「不是一個特定的神明，是一種男性鬼神的通稱，其各種來源並不衝突，包含了各種系統。每幾年就會舉辦一次大型豐富隆重的祭祀，另有災禍或瘟疫時，亦迎請此類信仰神明至該地區鎮壓，以安定地方。」關於此種信仰的祭祀，以下敘述何者正確？
  options:
  - label: A
    content: 此信仰受開港通商影響，逐漸沒落
  - label: B
    content: 此信仰為地方原鄉神明，具有地緣凝聚力
  - label: C
    content: 此信仰與臺灣頻繁械鬥相關，屬鬼神信仰
  - label: D
    content: 燒王船屬於此信仰的重要儀式
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從此信仰每幾年就會舉辦一次大型的祭祀、遇災禍或瘟疫時即奉迎至該地區鎮壓等特徵，可推知為王爺信仰，因此答案為(D)。(A)王爺信仰迄今仍受到重視，並未沒落。(B)王爺信仰並非地方原鄉神明。(C)與械鬥相關的鬼神信仰為有應公、大眾爺等，並非王爺。
