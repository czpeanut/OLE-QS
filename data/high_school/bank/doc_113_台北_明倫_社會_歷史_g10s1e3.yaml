- id: doc_113_台北_明倫_社會_歷史_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '小明倫在網路上查閱臺灣史資料時，發現一張臺灣對外貿易的表格，但該表格卻沒有標示時間，請你根據自己的歷史知識判斷，下列何者為正確？

    | 時期 | 貿易地區 | 進口商品 | 出口商品 |

    | --- | --- | --- | --- |

    | 甲 | 英國 | 軍火、布料 | 蔗糖、鹿皮 |

    |  | 日本 | 軍用物資 | 蔗糖、鹿皮、稻米、中國絲織品 |

    | 乙 | 中國 | 紡織品及日用品 | 稻米、蔗糖 |

    | 丙 | 中國、英國、日本、南洋、美國 | 鴉片、紡織品 | 茶、蔗糖、樟腦 |'
  options:
  - label: A
    content: 按照時間順序是丙→甲→乙
  - label: B
    content: 甲時期的政權是清朝
  - label: C
    content: 乙時期的政權是鄭氏政權
  - label: D
    content: 乙和丙的分期時間點可能是在臺灣開港前後
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '甲時期進口商品有大量的軍用物資，應為鄭氏時期。乙時期進口商品以日用品為主，應為清領前期。丙時期進口鴉片，應為臺灣開港通商後，按時間順序為甲→乙→丙，因此正確答案為(D)。

    8.1630 年的北臺灣為(B)西班牙人所占領。

    9.南郊為府城當地從事兩岸貿易的商號組成的公會之一，貿易對象地點為福建福州以南地方。反之，北郊的貿易對象則位於福建福州以北地區，因此答案為(A)。

    10.從「我們以信用貸款的方式出售獵照給漢人，雇用漢人來耕種稻田與蔗田」，可推知為荷治時期的經營方式，因此答案為(C)。

    11.南部的下淡水溪岸邊皆是種植甘蔗，居民主要維生方式是製成蔗糖出售至中國江浙地區，應為(B)清治初期兩岸形成「區域分工」階段。

    12.數據顯示從 1905 年至 1940 年有逐漸減少情形，但差異不大，因此答案可能為(A)，1930 年代總督府推動「農業南洋，工業臺灣」後，部分農業人口轉移至工業部門。(B)日本在臺統治不以傳教為目的，因此本土宗教信徒比例不會從一開始即逐漸減少。(C) 1930 年代後，農業產值的比例應該有明顯的減少。(D)即使推動皇民化運動，臺灣人仍多以本地語言為日常用語，因此比例應該更高。

    13.(A)早期以臺南、高雄為中心。(B)蛤仔難的拓墾模式為結首制。(C)中北部地區於雍正、乾隆年間已普遍展開拓墾。

    14.(B)初期「農業臺灣，工業日本」政策下，致力推動水稻、蔗糖中心的商品化經濟。

    15.「以農業培養工業」為 1950 年代(B)第一次進口替代時期的經濟政策。

    16.物理量指商品的單位，如：個、石、兩、尺等。價值量指商品的價值，通常以貨幣為計算尺度。從「商品生產及交換，需要每一商品之量的規定」，可知日本統治臺灣的經濟措施，包括重新整頓度量衡與貨幣的規定，因此答案為(C)。(A)設立臺灣銀行屬於價值量的問題。(B)度量衡的規定屬於物理量。(D)總督府在臺灣推行資本主義化後，才能吸引日本企業家來臺投資。

    17.正確的敘述只有(丙)，因此答案為(A)一項。(甲)茶葉加工集散地在大稻埕。(乙) 1880 年代後，經濟已轉為出超。(丁)客家人的經濟地位因為茶葉而有所提昇。

    18.甲銀行為 1905 年設立的彰化銀行，乙銀行為 1919 年成立的華南銀行，丙銀行為 1899 年創立的臺灣銀行，正確答案為(A)。(B)乙銀行是華南銀行。(C)成立時間順序為丙→甲→乙。(D)臺灣銀行原採用臺灣居有的銀本位制，後鑑於銀價不穩而改與日本同步採用金本位制。

    19.「股」與「份」的地名與早期合股開墾土地有關，因此答案為(B)。(A)「張」與土地開墾面積有關。(C)與移民原鄉有關。(D)與移民的防禦工事有關。

    20.(B)荷蘭入臺後，將臺灣定位為東亞轉口貿易的要地，進行南洋、中國、日本的商品交換，可謂扮演著「亞太營運中心」的角色。

    21.從「水力發電廠」與「神社」，即可推知為(C)日治時期。

    22.臺灣過去的貿易經濟時常輸出農產品以交換日常用品，直到 1950 年代才開始發展在地的民生工業，因此(D)解嚴開放後的 1980 年代，已不可能再出現輸出農產品以交換日常用品的情形。

    23.(A)甲 1950 年代→乙 1960 年代→戊 1970 年代→丁 1980 年設立新竹科學園區→丙 1984 年起的經濟政策。

    24.(A)資料一說明糖廠對蔗農提出嚴苛的收購甘蔗要求，並藉機剝削蔗農。(B)兩則資料並未提及政府補助舊糖廠轉型。(C)指定甘蔗採收區域的政策是保障新式糖廠的收益，蔗農反受其害。

    25.1647～1656 年的赤崁地區為荷蘭人所統治，因此正確答案為(B)。(A)□□國是荷蘭。(C)荷蘭人將製糖技術引入臺灣，從此甘蔗即是臺灣主要的經濟作物。(D)荷蘭人並未採行軍隊屯墾，而是自中國招募漢人來臺拓墾。

    26.(A)美援與韓戰爆發有關。(B) 1965 年美援已終止，並非直到 1979 年臺美斷交。(C)美援除了貸款援助外，更多的是實物與技術的支援。

    27.(A)八堡圳為清領前期的水利設施，非日治時期。(B)提出〈糖業改良書〉的是新渡戶稻造。(C)稻米的研發與改良者是磯永吉。

    28.(A) 1980 年代臺灣成為全球電子資訊業的代工基地，因此表中產品以提供外銷為主。(C) 1960 年代的建設。(D) 1970 年代為第二次進口替代，其產業政策與 1980 年代完全不同。

    29.題文所述的傳教士為馬偕，其對臺灣的貢獻為(A)。(B)馬雅各。(C)巴克禮。(D)甘為霖。

    30.從農民必須利用兼職收入「從市場購買稻穀換取高價肥料」一句，可知題文討論的問題與「肥料換穀」政策有關，因此答案為(C)。

    31.從「政府、軍隊及黨營文化事業在文化生產中扮演舉足輕重的角色」一句，可知此時應為黨國威權體制時期，因此正確答案為(D)。(A)○○是指 1980。(B)應是二次大戰後。(C)在黨國威權體制下，受雇於政軍黨組織文人多為外省籍。

    32.機械、電機、運輸工具等重工業為 1970 年代(C)第二次進口替代時期的重點產業。

    33.(A)從題文所述，臺灣土地開墾的墾首制度源於漢人的原鄉。(B)土地所有權人為大租戶，收取「大租」。(D)施九緞事件前已有廢除大租戶的規畫。

    34.(A)張我軍主張以中國白話文創作文學。(B)余光中屬於「現代主義文學」派，抨擊「鄉土文學」為「工農兵文學」。(C)關注臺灣本土的是「鄉土文學」。

    35.〈獎勵投資條例〉為 1960 年代出口擴張時期的政策，並(B)設立加工出口區以吸引外商投資。

    36.題文所述能成為歐美商人與中國商人雙向溝通媒介的是買辦，正確答案為(D)。(A) 19 世紀後期臺灣開港通商後興起。(B)買辦以歐美商人為貿易對象，非中國大陸。(C)鹿港並非開放通商的港口，不是買辦的營業據點。

    37.題文顯示此時的臺灣盛行西洋文化，從當時大學生的流行時尚來看，可見經濟生活條件尚稱繁榮，加上第一部 007 電影於 1962 年上映，因此推知此時為臺灣經濟開始起飛的(C) 1960 年代。(D) 1970 年代遭逢外交重挫，此時對西方文化的推崇已大不如前。

    38.從題文可知該批評者認為臺灣地方自治聯盟只關心「地主資產階級的利益」，不在乎「工農小市民」，因此戰後能獲得其認同的應是(C) 1970 年代鄉土文學，關注農民、勞工等社會底層人民的遭遇。

    39.從信中的內容來看，當時有外國船隻侵入到中國的福建泉州的海域與領土，就時間點來看，這個「外國船隻」最可能為荷蘭船，答案為(A)。(B)(C)與史實不符。(D)清法戰爭發生於 19 世紀晚期。

    40.題文所述的神靈多為早期在臺因械鬥或疾疫而冤死者，恐其無人祭祀而作祟，因此加以供養，屬於(B)孤魂野鬼的信仰。

    41.從「海外接單數量一路攀升，但國內就業市場萎縮」來看，可見產業外移現象嚴重，GDP 的成長全數為大公司的獲利，國內人民未能分享到此紅利，反而呈現高失業率，(D)為正解。(A) GDP 成長來看，臺灣並未受到國際經濟不景氣影響。(B)加入 WTO 後受到影響最大的應是農業，非傳統產業。(C)大量人口失業與傳統產業外移有關，並非服務業衰退。

    42.此份報告認為「政府產業政策有所偏頗」、「以特定產業為施政主軸」造成不公的現象，自 1980 年代起，政府即鼓勵發展汙染較低、技術密集、消耗能源較少與高附加價值的高科技產業，因此答案為(B)。

    43.(A)「小租戶只需繳交十分之六的大租」為劉銘傳的土地改革。(C)「小租戶成為土地唯一的擁有者」為日治時期的土地改革。(D)「三七五減租」指地主向佃農收取的地租不得超過全年收穫量的 37.5％。

    44.(乙)(丙)的敘述正確。(甲)從三則資料來看，日治時期與國府時期的土地改革明顯可看出成效。

    45.從「三七五減租」到「耕者有其田」，可看出戰後土地改革不僅要減輕佃農的地租負擔，更要使佃農擁有土地成為自耕農，因此答案為(A)。

    46.(A) 1920 年代為日治時期。(D)題材取自臺灣民俗風情，並非日本流行的主題。

    47.題文所述為 16、17 世紀東亞海域的情景，(A)(C)(D)(E)為正解。(B)日本明治維新開始於 19 世紀後半葉。

    48.(A)櫟社為霧峰林家所成立。(C)《送報伕》的作者為楊逵。(D)張我軍鼓吹使用中國白話文創作。

    49.此類〈土地申告書〉的基本欄目資料非常完整，加上業主資料中有「二結」、「三結」與「庄」、「番戶」等編制，可能與日治時期宜蘭地區的土地調查有關，因此答案為(B)(D)。(A)應是臺灣總督府。(C)政府以公債補償大租戶。(E)日治時期的土地改革成功。

    50.從這些作家必須「避過政府的檢查，處處避免正面評議當前社會政治問題，轉向個人內心的探索」等線索，可推知此時應是 1950 ～ 1960 年代白色恐怖時期，文學作品因此傾向現代主義文學，正確答案為(A)(C)(E)。(B) 1950 ～ 1960 年代。(D)鄉土文學作家批判這類文學作品為崇洋媚外。'
