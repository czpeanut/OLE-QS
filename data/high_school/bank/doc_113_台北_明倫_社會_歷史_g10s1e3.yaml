  number: 43
  type: single
  page: 7
  stem: 請比較資料一、二、三的土地改革方式，選出正確的選項？
  options:
  - label: A
    content: 小租戶在清領時期需繳交全額的大租，到了日治時期只需繳交十分之六
  - label: B
    content: 劉銘傳進行了土地改革，大租戶能留有原來租金的十分之六
  - label: C
    content: 政府實行「耕者有其田」的土地政策，使小租戶成為土地唯一的擁有者
  - label: D
    content: 戰後國民政府實施「三七五減租」，意思是所有人的年租皆減少 37.5 ％
  group_stem: '資料一：為了增加稅收，劉銘傳戮力以推動清賦為中心的土地改革工作……他一方面藉著土地的調查，清查臺灣實際的耕作面積，及土地的狀況；另一方面則希望解決臺灣原來由大租戶、小租戶、佃農構成的傳統土地所有制。……最後採取減少小租戶繳交大租的四成，作為由小租戶繳交賦稅的代價，大租戶仍保有原來大租的六成……而後由於爆發大規模的民變，抗議清丈工作不公，使土地改革無法貫徹。

    資料二：1898 年，臺灣總督府從初步控制臺灣北部開始進行土地調查，至 1904 年完成。調查結果臺灣的土地面積較劉銘傳時期的調查結果增加了 70％以上，這當然也增加了總督府的稅收。…… 1903 年臺灣總督先禁止新設大租權，次年，給予大租戶低額的公債作為補償，確立小租戶作為土地唯一的所有者，土地作為商品流通的可能性大增，相對地也有利於日本人資本取得土地。

    資料三：此時，為了避免農村的資租佃關係惡化給予共產主義活動的空間，陳誠宣布「三七五減租」，在陳誠的強力推動下，縱使當時由地主出身的議員掌控的省參議會，亦無力反對。其後，減租成為臺灣土地改革的先聲。接著又實施「公地放領」及「耕者有其田方案」，除了解決農村租佃問題外，同時也削弱了以土地為基礎的土紳力量，政府則在取得農民支持後，鞏固統治基礎。'
