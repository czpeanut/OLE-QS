  group_stem: (八)2000年臺中縣政府辦理大里都市計畫的區段徵收，先支付了自來水管鋪設的全部費用後，在2004年請臺灣自來水公司依照內政部2002年訂定發布的《土地徵收條例施行細則》第52條1項8款「區段徵收範圍內新設自來水管線工程費用，由需用土地人跟管線事業機關各負擔1/2」的規定，給付１/2管線費用。臺灣自來水公司拒絕後，臺中縣政府提起民事訴訟，2013年最高法院判決確定，自來水公司應支付1/2管線費用，臺灣自來水公司因此在2014年向大法官聲請釋憲。 大法官因此作出《釋字第765號解釋》，解釋文及理由書中提到，地方自治團體的地位，受憲法保障，並享有財政自主權，而公營事業依《公司法》規定設立公司者，仍為權利義務之主體。《土地徵收條例施行細則》第52條1項8款之規定無法律明確授權，逕就攸關需用土地人之財政自主權及公營自來水事業受憲法保障之權利事項而為規範，已違反憲法原則，應自本解釋公布之日起，至遲於屆滿2年時，不再適用。
