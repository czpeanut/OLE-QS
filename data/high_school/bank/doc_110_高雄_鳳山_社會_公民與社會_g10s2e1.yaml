  group_stem: (五)廣電三法包含《廣播電視法》、《有線廣播電視法》與《衛星廣播電視法》，在2015年底未能通過修法時，國民黨立院黨團表示民進黨沒有在「協商結論」上簽字，而使得修法草案無法順利進行討論表决，但民進黨表示是因為由台聯黨團提案進入討論事項，卻遭國民黨反對而擱置，民進黨建議朝野不要互踢皮球，拿出誠意儘速修法通過。事後於2015年12月18日完成三讀，並於2016年元月修正公布，其後也持續修法中，以符合目前的廣電實際狀況。
