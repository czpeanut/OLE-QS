  stem: 關於《司法院釋字第756號解釋》對《監獄行刑法》第66條規定所闡述之意旨，下列何者是正確的解讀？
  options:
  - label: A
    content: 監獄長官檢査受刑人之書信，違反公益原則
  - label: B
    content: 一概允許監獄長官閱讀受刑人之書信内容，違反比例原則
  - label: C
    content: 不論檢查或閱讀受刑人之書信，均違反《憲法》秘密通訊自由之保障
  - label: D
    content: 檢查受刑人書信之手段與目的間若不具合理關聯，即違反法律保留原則
  group_stem: (七)過去《監獄行刑法》第66規定：「受刑人發受書信，由監獄長官檢閱之。如認為有妨害監獄紀律之虞，受刑人發信者，得述明理由，令其刪除後再行發出：受刑人受信者，得述明理由，逕予刪除再行收受。」《司法院釋字第756號解釋》認為，所稱「檢閱」一詞，包括檢查及閱讀。其中檢查書信部分，旨在使監獄長官確認有無夾帶違禁品，於所採取之檢查手段與目的之達成間，具有合理關聯之範圍內，與《憲法》第12條保障秘密通訊自由之意旨尚無違背。其中閱讀書信部分，未區分書信種類，亦未斟酌個案情形，一概允許監獄長官閱讀受刑人收發書信之内容，顯已對受刑人及其收發書信之相對人之秘密通訊自由，造成過度之限制。
