  group_stem: (四)30多年前，<u>(甲)臺東縣</u>以「知本綜合遊樂區開發區」開發計畫，徵收臺東知本卑南族<u>(乙)卡大地布部落</u>的傳統領域土地Kanaluvang(卡那魯汎)，爾後因契約爭議並未開發。直至2017年，臺東縣政府在<u>(丙)知本里</u>知本溪出海口規劃161公頃太陽能光電園區，並由<u>(丁)韋能能源公司</u>得標。由於光電區域就是先前卡大地布部落的傳統領域，卑南族人認為臺東縣政府未和部落諮商，未取得同意權就逕行招標，違反《原住民族基本法》，不同意業者開發，但也有族人認為業者回饋可照顧部落老人及小孩子升學，兩方意見分歧。 《原住民族基本法》自公布後，知本光電開發案是臺東首次使用諮商同意權，卡大地布部落在2019年6月召集部落族人舉行部落諮詢同意投票，部落5百多户，贊成187票、反對173票，無效1票，最終同意光電開發。
