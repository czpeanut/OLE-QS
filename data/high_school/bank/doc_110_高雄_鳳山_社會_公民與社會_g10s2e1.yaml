questions:
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 依《刑事訴訟法》第228條規定，經告訴、告發、自首等而知悉有犯罪嫌疑者，檢察官應開始調查。但若犯罪者是18歲以下的兒童或少年，則此時應依《少年事件處理法》第19條的規定，先交由少年法院指派的少年調查官調查。請問上述體現的原則最可能是何者？
  options:
  - label: A
    content: 程序法從新原則
  - label: B
    content: 特別法優於普通法原則
  - label: C
    content: 實體法從舊原則
  - label: D
    content: 程序法優於實體法原則
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 承上題，以法律位階而言，
  options:
  - label: A
    content: 《少年事件處理法》優於《刑事訴訟法》
  - label: B
    content: 《刑事訴訟法》優於《少年事件處理法》
  - label: C
    content: 二者的法律位階相同
  - label: D
    content: 《少年事件處理法》是實體法位階
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 為使婚姻自由之平等保護，使同性婚姻之關係獲法律承認，司法院釋字第748號解釋表示《民法》未讓同性別成立有親密性和排他性之永久結合關係，違反《中華民國憲法》第7條平等權和第22條保障人民婚姻自由，要求有關機構必須在2年內完成法律之修正或制定。依據我國現行的體制，請問：下列敘述何者正確？
  options:
  - label: A
    content: 大法官直接公布《司法院釋字第七四八號解釋施行法》保障同性婚姻
  - label: B
    content: 内政部主掌婚姻登記，行政院直接公告施行《司法院釋字第七四八號解釋施行法》
  - label: C
    content: 行政院擬案《司法院釋字第七四八號解釋施行法》，經立法院三讀
  - label: D
    content: 《民法》違憲，因此整部《民法》應直接廢止
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 依據我國《身心障礙者權益保障法》的規定，只有視障者才能從事按摩業。對此，大法官作出解釋，認為保障視障者是應追求的重大公共利益，但僅限視障者從事按摩業的規定，對於想要從事按摩業的非視障者造成過度的限制，因此宣告該規定違憲。依大法官解釋，該規定違背了下列何種原則？
  options:
  - label: A
    content: 誠實信用原則
  - label: B
    content: 比例原則
  - label: C
    content: 法律保留原則
  - label: D
    content: 權力濫用原則
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 2020年2月農曆新年假期之後，因為新冠病毒肺炎疫情影響，使得部分國人與中國籍配偶所生之子女滯留中國無法回臺，這些孩子也就是前陸委會主委陳明通口中的「小明」。「小明們」具有中華人民共和國國籍，但在臺設有學籍、加入健保，以長期居留方式在臺灣生活，他們在年假期間到中國探親，卻因為防疫政策回不了臺灣。有人從平等的角度主張，如果基於防疫目的，在中國的臺商以及大量來自東南亞、歐美人士也應受到同等限制。若以《憲法》第7條平等權保障條款檢視上述事件，則下列敘述何者正確？
  options:
  - label: A
    content: 該法第7條的適用範圍不包括國籍，此事件與平等權不相涉
  - label: B
    content: 不分對象均作相同處理，才符合憲法追求之形式平等的精神
  - label: C
    content: 須有合理正當的實質理由，才能對不同國籍者作出差別對待
  - label: D
    content: 「不等者不等之」，不同國籍者不同待遇才能實錢實質平等
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「天使心家族基金會」創始人林照程、蕭雅雯夫婦，因為有兩位重度身障的孩子，經過照顧孩子的苦楚與社會異樣眼光的洗禮之後，發現社會中有許多與自己類似的家庭，於是主動出來組織大家，相互協助並一起爭取權利。關於此基金會的特徵，下列何者正確？
  options:
  - label: A
    content: 基於政府法令立案故屬於公法人
  - label: B
    content: 可以成為法律上權利主體的組織
  - label: C
    content: 可享有與自然人完全相同的權利
  - label: D
    content: 由類似家庭組成，屬於社團法人
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '在全國法規資料庫的最新訊息中，有則公告如下：

    | 廢止公務人員退休法 |  |

    | --- | --- |

    | 公(發)布日期 | 107-11-21 |

    | 內文 | 總統 令 中華民國107年11月21日華總一義字第oooo號 茲廢止公務人員退休法，公布之。 總   統 蔡英文 行政院院長 賴清德 |

    這則公告該如何解讀較為合宜呢？'
  options:
  - label: A
    content: 公務人員退休法就算沒有此公告也會自動廢止
  - label: B
    content: 從內文可推知廢止生效日已授權給行政院定之
  - label: C
    content: 廢止該法案仍需相關機關提案並經過立法程序
  - label: D
    content: 由内文可以看出我國總統具有廢止法案的權力
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 環保團體地球公民基金會表示，行政院公布的93個優先法案中，沒有《礦業法》修正草案，但立法院經濟委員會跨黨派立委很認真逐條討論，已在臨時會將草案完成初審、送出委員會，有很多關鍵條文、民間訴求的改革方向，都取得多數委員支持，只有少數條文遭保留協商；希望當時的經濟委員會召委及立法院院長能趕快召集協商，讓《礦業法》在這會期完成三讀。請從上述內容判斷目前《礦業法》卡關的狀況與成因為何？
  options:
  - label: A
    content: 程序委員會未將法案排入議程當中藉此阻擋法案
  - label: B
    content: 黨團尚未完成協商取得共識故連二讀都無法開始
  - label: C
    content: 經濟委員會未確實完成審查故無法進行後續討論
  - label: D
    content: 仍在等待二讀會完成黨團協商後才能邁向三讀會
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 自由權是不可剝奪的天賦人權，但擁有自由不見得代表不受拘束。下列何種情形，政府可依法限制人民的自由？
  options:
  - label: A
    content: 戰爭時期為保護國家機密，依法限制人民祕密通訊的自由，進行必要的書信檢查
  - label: B
    content: 警方將嫌疑犯以調查犯罪事實為由，直接搜查嫌犯住處，才移送法院審理
  - label: C
    content: 大地震發生後，因應緊急情況，市長以行政命令，徵用一般百姓住宅
  - label: D
    content: 為控制疫情在公共場所實施簡訊實聯制，警方也可調用此資訊，追蹤調查嫌疑犯
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 依據《憲法訴訟法》建構的違憲審查機制，與過去大法官會議釋憲制度相較，有較大差異不同的是？
  options:
  - label: A
    content: 大法官會議針對抽象的法律命令違憲審查，憲法法庭針對一般法院的具體裁判違憲審查
  - label: B
    content: 大法官會議針對一般法院的具體裁判違憲審查，憲法法庭針對抽象的法律命令違憲審查
  - label: C
    content: 大法官會議違憲審查乃法規範違憲審查，憲法法庭違憲審查範圍包括法規範審查及裁判憲法審查
  - label: D
    content: 大法官會議違憲審查範圍包法規範違憲審查及裁判憲法審查，憲法法庭違憲審查範圍是法規範審查
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 法官須依法審判，但若法官認為審判案件時所適用的法律條文有違憲之虞時，得採取下列哪一項措施？
  options:
  - label: A
    content: 裁定停止審判，聲請憲法法庭釋憲
  - label: B
    content: 針對有違憲之虞的法律拒絕適用
  - label: C
    content: 向最高法院報告，由其提出釋憲聲請
  - label: D
    content: 將此案件轉由司法院審判
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 若立法院三讀通過總統公布之法律，吾人認為該法有違背憲法侵犯基本人權之虞，除了聲請釋憲，其他可行的管道是？(甲)公投創制 (乙)公投複決 (丙)請願促請立法委員提案修法 (丁)促請總統廢止該法律
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: Google Map街景車到處拍攝，雖可以讓人們便於使用實景街圖來辨識位置方向，但連同街道上的人車影像也都清楚可見，而顯露了民眾的行蹤與相對位置。消基會呼籲主管機關NCC應介入管理。試問Google的這項服務可能涉及侵犯以下哪一項人權？
  options:
  - label: A
    content: 祕密通訊自由權
  - label: B
    content: 隱私權
  - label: C
    content: 姓名表示權
  - label: D
    content: 人身自由權
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 新北市議員在市政總質詢時，關切新北市政府的財政問題，新北市長則在議會答詢時指出，中央的財源再不按照標準給，新北市3年就會破產。請問：「新北市」作為權利主體，其屬性與何者最為相近？
  options:
  - label: A
    content: 臺灣省
  - label: B
    content: 彰化市
  - label: C
    content: 台北市萬華區
  - label: D
    content: 高雄市會結村
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 應屆就讀高一的小楊在公民與社會的課堂上，知道自己尚未符合公民的法定資格，無法享有選舉、罷免等權利，但老師提到：「自然人是權利主體，有權利能力。」此話讓小楊心生疑惑：「明明自己還沒有公民的法定權利，可是身為人卻具有權利能力？」請問：該如何為小楊解惑最為恰當？
  options:
  - label: A
    content: 公民屬於完全權利能力人，而小楊屬於限制權利能力人
  - label: B
    content: 公民的資格及權利與自然人不同，所以不是權利主體
  - label: C
    content: 權利能力是享有權利負擔義務的資格，公民是具備一定條件享有實質的權利内涵
  - label: D
    content: 小楊未成年，還不是權利主體，無法享有公民權利
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 身體權是人民維護其身體完整並能自由支配其身體各個組成部分的權利，屬性為《憲法》第22條的「概括基本權」請問：下列何者權利屬性與其最為相似？
  options:
  - label: A
    content: 國人可以自主選擇信仰或不信仰宗教
  - label: B
    content: 公民能在總統選舉時投下神聖的一票
  - label: C
    content: 人民有媒體的接近權與使用權
  - label: D
    content: 人民可以向法院提起訴訟來解決紛爭
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 《憲法》明文列舉若干項基本權利，稱為「列舉基本權」。請問：下列何者權利屬性與其最為相似？
  options:
  - label: A
    content: 如果沒有經過本人同意，不可以強制按捺指紋
  - label: B
    content: 面對警察任意的隨機臨檢與盤查，民眾可予以拒絕
  - label: C
    content: 當事人基於法律規定和本人意志，自主決定自己的婚姻問題，不受他人的非法干涉
  - label: D
    content: 個人名譽關乎人格完整及尊嚴，故應受到保護
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 亞洲水泥（以下簡稱亞泥）在花蓮新城、秀林鄉有「大理石礦」採礦執照，在執照期限即將屆滿之際，亞泥向經濟部礦務局申請執照展延。2017年，經濟部展延亞泥20年採礦權利至2037年，引發太魯閣族人不滿，因而提起行政訴訟。2019年，臺北高等行政法院判決經濟部敗訴、必須撤銷原處分，理由是經濟部在核准礦權展延時，沒有踐行《原住民族基本法》的規定。試問此事件違反《原住民族基本法》的可能原因為何？
  options:
  - label: A
    content: 該地為原住民族的傳統領域，採礦侵犯其土地所有權卻沒有給予補償
  - label: B
    content: 原住民族或部落周邊一定範圍內的土地的開發未徵詢當地原住民族同意
  - label: C
    content: 基於尊重臺灣最早住民，公權力限制原住民族部落的權利能力即違法
  - label: D
    content: 礦權展延使太魯閣族必須離開原本的生活場域，產生文化傳承的危機
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 《戶籍法》第8條第2項曾規定：「依前項請領國民身分證，應捺指紋並錄存。」第3項規定：「請領國民身分證，不依前項規定捺指紋者，不予發給。」2005年大法官針對上述《戶籍法》之内容宣告違憲，且說明：「（捺指紋）縱用以達到國民身分證之防偽、防止冒領、冒用、辨識路倒病人、迷途失智者、無名屍體等目的而言亦屬損益失衡、手段過當。」請問大法官宣告《戶籍法》違憲的理由為何？
  options:
  - label: A
    content: 違反正當程序原則
  - label: B
    content: 違反權力濫用原則
  - label: C
    content: 違反比例原則
  - label: D
    content: 違反平等原則
- id: doc_110_高雄_鳳山_社會_公民與社會_g10s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
