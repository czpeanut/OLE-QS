  stem: 《憲法》規定我國男女在法律上一律平等，但是《兵役法》卻規定我國只有男子有依法服兵役的義務，那麼《兵役法》的規定是否牴觸《憲法》？針對此問題，大法官做出《釋字第490號解釋》如下： 「人民有依法律服兵役之義務，為《憲法》第20條所明定。……立法者鑒於男女生理上之差異及因此種差異所生之社會生活功能角色之不同，於《兵役法》第1條規定：『中華民國男子依法皆有服兵役之義務』，係為實踐國家目的及憲法上人民之基本義務而為之規定，原屬立法政策之考量……復次，服兵役之義務，並無違反人性尊嚴亦未動搖《憲法》價值體系之基礎，且為大多數國家之法律所明定，更為保護人民，防衛國家之安全所必需，與《憲法》第7條平等原則及第13條宗教信仰自由之保障，並無牴觸。」 根據上述解釋文，下列敘述何者正確？
  options:
  - label: A
    content: 《兵役法》牴觸《憲法》，因為《憲法》規定人民有服兵役的義務，並未區分男女
  - label: B
    content: 《兵役法》牴觸《憲法》，因為平等原則要求男女應相同對待，女性也有服兵役義務
  - label: C
    content: 《兵役法不牴觸《憲法》，因為《憲法》過於抽象，立法者可以自行解釋
  - label: D
    content: 《兵役法》不牴觸《憲法》，因為我國《憲法》第7條追求實質平等，《兵役法》可以對男子為合理的差別待遇
