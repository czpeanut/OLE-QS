  stem: '某日同學整理實驗桌時，發現一瓶未加蓋的水合硫酸鐵(Ⅱ) ($FeSO_{4}$．7 $H_{2}$O)，其中已部分晶體變為黃褐色，得知是因為部分鐵(Ⅱ)離子被氧化所致。於是決定經由「氧化還原反應滴定」的實驗，分析這瓶試藥中鐵(Ⅱ)離子的含量。 「氧化還原反應滴定」的實驗過程及結果如下： 【第一部分】以草酸鈉標定酸性過錳酸鉀溶液的實驗： 稱取草酸鈉（$Na_{2}C_{2}O_{4}$）0.335 g置入器材甲中，加入70毫升蒸餾水及2.0 M某酸性溶液25毫升酸化，隔水加熱後，趁熱以過錳酸鉀水溶液滴定，滴入25.00毫升時恰達當量點。 【第二部分】以標定過的過錳酸鉀溶液測定未知試樣的含鐵量的實驗： 步驟1：稱取水合硫酸鐵(Ⅱ)試樣2.00 g溶於50毫升蒸餾水倒入器材甲中，加入2.0 M某酸性溶液25毫升。 步驟2：將【第一部分】已標定過的過錳酸鉀溶液裝入器材乙中，並讀取器材乙中溶液體積的最初刻度為18.25 mL。 步驟3：以過錳酸鉀溶液滴定器材甲中的硫酸鐵(Ⅱ)溶液，當達到滴定終點時，讀取器材乙中的溶液刻度為48.25 mL。 （式量：$Na_{2}C_{2}O_{4}$＝134、$FeSO_{4}$．7 $H_{2}$O＝278；原子量：Fe＝56）

