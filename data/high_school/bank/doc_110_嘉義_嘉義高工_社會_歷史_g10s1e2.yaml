  stem: 臺灣作為一海島，展現出十足的海洋性格，因此重視海洋貿易的國家亦多重視此地。二十世紀初，某人的日記寫到：「此日，當英國皇帝誕辰。前十一時半，整儀列，往大稻埕同國領事館而賀之，內外縉紳集者數十人。予舉杯而祝曰：『謹奉祝我同盟國大英國皇帝陛下宸誕令節……當我皇太子殿下見訪問英國，英國皇室及國民披瀝熱誠之至情，盡深厚之歡迎，是我帝室及國民之所感謝而不能措，足以證兩國親交益致輯睦，而世界之平和據以保持也。』，諸員舉杯共祝，同領事述謝辭而散。』關於這段史料，下列何者敘述正確？
