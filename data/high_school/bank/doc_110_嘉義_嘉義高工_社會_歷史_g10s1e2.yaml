  stem: 從清治末年到日治初期，臺灣人感受到日常生活有那些轉變？
  options:
  - label: A
    content: 之前都只有牛車、馬車代步，之後有火車可以坐
  - label: B
    content: 之前大多只能用河水、井水，之後有自來水可供使用
  - label: C
    content: 之前打官司只能聽任州縣衙門，之後卻有法院、律師的保障，
  - label: D
    content: 之前作息都依賴農曆，之後以使用西曆、星期制為主
  - label: E
    content: 之前生病多找藥房、郎中，之後可至公立醫院看病
