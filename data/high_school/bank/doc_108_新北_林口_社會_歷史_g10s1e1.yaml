  stem: 兩位清朝官員分別談論到有關臺灣的械鬥，以下為他們的看法。熊一本說：「兩類肇端，每在連塍（土溝）爭水、強割占耕、毫釐口角，致成大爭。」福康安說：「因閩庄、粵庄彼此交錯，田業毗連，遂有構係相爭之事。」就兩人的說法來看，分類械鬥的起因是
