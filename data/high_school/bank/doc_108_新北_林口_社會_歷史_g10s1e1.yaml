  stem: 根據上方文本內容，文中提到史尼育唔不知道自己已名為李光輝，假如你是當時的記者，請運用你的歷史知識，你會怎麼告訴史尼育唔改名字的原因呢？
  options:
  - label: A
    content: 隨著戰後政府推動原住民族政策，改善原住民族的生活水準，而認同自己為中華民族而改用漢人姓名
  - label: B
    content: 在正名運動與孫文思想的推動下，政府允許原住民族使用漢人姓氏，許多原住民族紛紛改用漢人姓名
  - label: C
    content: 原住民族在戰後，為了表達自己對政府的忠誠，而主動改用漢人姓名
  - label: D
    content: 戰爭結束，日本戰敗，臺灣交由中華民國統治，而政府強迫原住民族改用漢人姓名
  group_stem: 1974年12月26日，印尼空軍巡邏隊發現摩洛泰（Morotai）島的遼闊森林冒出一道炊煙；空軍中尉蘇巴迪，據報深山有身分不明者出沒，乃率隊前往搜捕。一路翻山越嶺，經30餘小時，終於在崇山峻嶺處發現一間約2公尺見方的簡陋草房，屋旁有男人正持刀劈竹；大夥一擁而上捕捉。透過翻譯，才知道這個人是來自臺灣的日本兵中村輝夫。一個原鄉在臺東都歷的阿美族人，但隨著在媒體報導下，中村輝夫不知如何被改名為李光輝，並在國人期盼下返回國門。
    中村輝夫，原名史尼育唔，1919年（大正8年）誕生於今臺東縣成功鎮信義里。八歲時，入學都歷公學校就學，擅長相撲和棒球，曾代表臺東廳遠征臺北。1943年（昭和18年）10月，史尼育唔在第八回募集中被徵召成為「高砂特別志願兵」。在接受短期訓練後，即調往印尼戰場。當時，日軍在南洋的戰局已經節節敗退，聯軍成功擊殺聯合艦隊司令山本五十六。該年年底，美軍開始圍困新幾內亞群島上的十萬名日軍，四處逃竄的日軍，猶作困獸之鬥。在某次的戰役中，史尼育唔與隊友失散，隻身逃入深山匿居，自此開始了30年離群索居的生活。但史尼育唔重返臺灣生活不到5年，即於1979年病故。
    又名中村輝夫、李光輝的史尼育唔，一生因政權的變動、國族的差異，雖擁有三個語言文化不同的名字，卻孤獨終身；這是不由自主的人生遭遇，也是時代浪潮撥弄下的悲劇。然而，相較於還有機會返鄉的史尼育唔，有更多的高砂義勇隊的族人埋首異地，再也見不到家鄉的山川田園、父母妻小，甚至連他們曾經的存在，也被戰後的新國家唾棄、臺灣社會遺忘，名字只能在風中漂蕩。直到歷史記憶甦醒，原住民族這段最稱吊詭、複雜的國家經驗，才能解除咒語，重新再生。
    資料出處：改編自詹素娟，《典藏臺灣史(二)：臺灣原住民史》（臺北市：玉山社，2019），頁214-215。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
