  stem: '1867年，羅妹號船事件發生後，美國駐廈門領事李仙得偕同通事六人抵臺，與恆春地區十八社總頭目卓杞篤直接交涉，雙方達成口頭協議，同意歸還船長亨利夫婦的首級及所劫物品，並允諾受難者以紅旗為信號，表示對頭目的友好，不再殺害船難者。1869年，李仙得再度來臺確認原住民是否遵守該條約，2月28日與卓杞篤再度會面，正式簽訂「親善盟約」的書面協議，羅妹號事件始告落幕。

