  stem: 清朝政府規定：「內山的生番，野性難馴，殺人放火，習以為常，其實真正挑起事端的大都是漢人。譬如開墾土地時，不管是生番、熟番的土地，往往越界侵占，甚至勾結黨羽，入山搭寮，看見番人獵的鹿麂，往往還竊為己有，所以才會遭殺害。從現在開始，凡在此當官者，在臨近生番處大約數十餘里之地，立石為界限，擅越界者以違反禁令論處。」根據這段文字，下列敘述何者正確？
