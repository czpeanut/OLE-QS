  stem: 歷史老師帶領大家討論陳第的《東番記》時，班上同學發表下列意見：周子瑜說：「其反映了臺灣十九世紀時原住民族的生活型態。」新垣結衣說：「當時因為沒有漢人能了解原住民族的語言，所以陳第只好靠自己的觀察做紀錄，已算是忠實紀錄原住民族的風俗習慣。」崔始源說：「陳第寫東番記的價值在於其對原住民族觀察非常廣泛，包括泰雅族、賽夏族等皆有公正而客觀的描述。」新野源說：「陳第當時要求與打擊『倭寇』的沈有容將軍同行，故有機會登陸臺灣南部，留下這篇珍貴的紀錄。」請問：以上四位學生何者對陳第《東番記》的了解是正確？
