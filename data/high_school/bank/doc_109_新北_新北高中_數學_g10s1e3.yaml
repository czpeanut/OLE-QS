  stem: 設二次函數 f（x）＝$ax^{2}$＋bx＋c 之圖形如右，試判定下列哪些選項是正確的？
  options:
  - label: A
    content: a＞0
  - label: B
    content: b＞0
  - label: C
    content: c＞0
  - label: D
    content: a＋b＋c＞0
  - label: E
    content: 9a－3b＋c＞0
