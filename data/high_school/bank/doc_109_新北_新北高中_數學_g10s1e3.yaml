  explanation: '令 f（x）＝$ax^{2}$＋bx＋c＝$a \left( x +\frac{1}{2} \right) \left( x -\frac{5}{2} \right)$＝$ax^{2}$－2ax－$\frac{5}{4}a$

    (A)○：開口向上$\Rightarrow$a＞0

    (B)╳：∵a＞0 ∴b＝－2a＜0

    (C)╳：∵a＞0 ∴c＝$-\frac{5}{4}a < 0$

    (D)╳：a＋b＋c＝f(1)＜0

    (E)○：9a－3b＋c＝f（－3）＞0

    故選(A)(E)'
