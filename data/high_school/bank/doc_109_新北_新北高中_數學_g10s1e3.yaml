- id: doc_109_新北_新北高中_數學_g10s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設 f（x）與 g（x）都是三次多項式，而 h（x）是二次多項式，試問下列哪些選項是正確的？
  options:
  - label: A
    content: f（x）＋g（x）的次數必為三次多項式
  - label: B
    content: f（x）－g（x）的次數小於三次
  - label: C
    content: f（x）g（x）的次數必為六次
  - label: D
    content: f（x）除以 h（x）所得餘式為一次多項式
  - label: E
    content: 若 a≠0，則 f（x）除以 h（x）所得餘式與 f（x）除以 ah（x）所得餘式相同
  explanation: '(A)╳：∵degf（x）＝degg（x）＝3

    ∴deg（f（x）＋g（x））$\leq$3

    (B)╳：∵degf（x）＝degg（x）＝3

    ∴deg（f（x）－g（x））$\leq$3

    (C)○：deg（f（x）g（x））＝degf（x）＋degg（x）＝3＋3＝6

    (D)╳：∵degh（x）＝2 ∴degr（x）$\leq$1

    (E)○：令 f（x）＝h（x）q（x）＋r（x），degr（x）$\leq$1

    ＝ah（x）．$\frac{1}{a}$q（x）＋r（x）

    商式為$\frac{1}{a}q (x )$，餘式為 r（x）

    故選(C)(E)'
- id: doc_109_新北_新北高中_數學_g10s1e3_s1_2
