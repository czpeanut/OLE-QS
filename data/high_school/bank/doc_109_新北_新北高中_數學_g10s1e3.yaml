  stem: 已知實係數多項式 f（x）除以 $x^{2}$＋2 的餘式為 x＋1。若 xf（x）除以 $x^{2}$＋2 的餘式為 ax＋b，則數對（a，b）＝＿＿＿＿。
  explanation: '令 f（x）＝（$x^{2}$＋2）q（x）＋x＋1

    $\Rightarrow$xf（x）＝x（$x^{2}$＋2）q（x）＋$x^{2}$＋x

    ＝（$x^{2}$＋2）．xq（x）＋（$x^{2}$＋2）．1＋x－2

    ＝（$x^{2}$＋2）〔xq（x）＋1〕＋x－2

    餘式為 x－2$\Rightarrow$數對（a，b）＝（1，－2）'
- id: doc_109_新北_新北高中_數學_g10s1e3_s2_2
  section: 2
  number: 2
  type: fill
  page: 2
  stem: 已知多項式 f（x）除以 x＋1 的餘式為 3；除以 x－3 的餘式為 7，則 f（x）除以 （x＋1）（x－3）的餘式為＿＿＿＿。
  explanation: '令 f（x）＝（x＋1）$q_{1}$（x）＋3$\Rightarrow$f（－1）＝3

    f（x）＝（x－3）$q_{2}$（x）＋7$\Rightarrow$f(3)＝7

    f（x）＝（x＋1）（x－3）$q_{3}$（x）＋ax＋b

    $\begin{cases}f (-1)=3 \\ f ( 3 )=7\end{cases}\Rightarrow\begin{cases}-a +b =3 \\ 3a +b =7\end{cases}\Rightarrow\begin{cases}a =1 \\ b =4\end{cases}$

    ∴餘式為 x＋4'
