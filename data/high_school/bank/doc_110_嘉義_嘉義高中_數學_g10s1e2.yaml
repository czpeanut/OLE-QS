    content: ( 2 ,－1 )
  - label: D
    content: ( 3 ,－1 )
  - label: E
    content: (－1 , 2 )
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 3x＋5y－7＝0， ( 0 , 0 ) 代入得 ∵ 3．0＋5．0－7＜0， ∴ ( 0 , 0 ) 在3x＋5y－7＜0中， (－5 , 5 ) 代入 ⇒ 3．(－5 )＋5．5－7＞0，錯誤。 ( 0 , 2 ) 代入 ⇒ 3．0＋5．2－7＞0，錯誤。 ( 2 ,－1 ) 代入 ⇒ 3．2－5－7＜0，正確。 ( 3 ,－1 ) 代入 ⇒ 3．3－5－7＜0，正確。 (－1 , 2 ) 代入 ⇒ 3．(－1 )＋5．2－7＝0，錯誤。 故選(C)(D)。
