  stem: '<u>臺灣</u>的茶金

    臺灣茶樹的較佳種植環境為年雨量1500公釐以上，年均溫約18～25℃，砂質土壤且排水良好之山坡地。茶樹在分類學上為山茶科、山茶屬，多年生植物，常為喬木、小喬木或灌木。茶樹的根具有明顯的主根和支根；葉形為倒卵形至橢圓形等，葉正面的中助和葉脈明顯，葉緣有鋸齒；秋冬開花，花色為白色。茶樹不一定全年皆可採收，依生長氣候之不同有其特定之採收期。好的茶葉一般多為「一心二葉」（圖二），也就是說採茶時要摘取茶樹莖頂的一個頂芽和兩片嫩葉，再加以烘焙，因而須使用人力摘取，方能製成好茶。若以機器採茶雖然可以節省人力﹒但易夾雜老葉且有葉形不完整的缺點。根據歷史書籍記載，早在300餘年前在墓灣便發現有野生茶樹，然而臺灣目前的茶樹栽培管理，是在200餘年前先人從福建武夷山所引進的茶種，獨特的烘焙技術。使臺灣茶揚名國際。請根據以上所述，回答下列問題：

    56. 請根據上文推斷有關茶樹的特徵哪些正確？（多選）'
