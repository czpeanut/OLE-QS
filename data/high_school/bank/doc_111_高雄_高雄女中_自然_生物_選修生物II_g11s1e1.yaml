- id: doc_111_高雄_高雄女中_自然_生物_選修生物II_g11s1e1_s3_2
  section: 3
  number: 2
  type: multiple
  page: 6
  stem: '內共生假說的提出者：<u>瑪格莉斯</u>

    <u>瑪格莉斯</u>曾任<u>波士頓大學</u>的微生物學教授，1963年發現葉綠體內可以有片段之DNA存在，而且也能遺傳。她指出這核外DNA之來源、特性及演化與核內之DNA不同。在1967年完成博士學位後轉赴波<u>士頓大學</u>任教，擔任微生物的教學和研究。在長期的觀察和研究中，她認為真核生物的跑器有些特徵與原核細胞構造類似。同時胞飲現象廣泛存在於很多細胞，例如：有不少變形蟲（Amoeba）或草履蟲（Paramaecium sp.）經常可見到藉胞飲作用攝食細菌、矽藻、綠藻或藍綠菌。這些被攝食的細菌及藻類，在變形蟲細胞內可存活一段相當長久的時間，甚至可以行細胞分裂形成共生的現象。另外她到<u>加州巴哈海岸</u>之泥灘地上找到某些螺旋菌（Spirochetes），其外形和構造與人體肺部氣管上的纖毛細胞很類似。就因為她找到類似的例子不少，所以才提出真核細胞及複雜多細胞生物可能是自不同的原核細胞藉著胞飲共生之方式（endosymbiosis）演化而來。在1970年及1981年，分別出版The origin of Eukaryotic cell及Symbiosis in cell Evolution，來說明真核多細胞生物之演化，可能是由一連串原核生物或與真核生物以內共生的方式形成。她提出的主要證據如下：

    甲：粒線體及葉綠體都有DNA，往往呈環狀；與一般細菌的DNA構造相似，且可複製。

    乙：一般有鞭毛、纖毛的細胞，其鞭毛或纖毛在電子顯微鏡下的構造與螺旋菌的構造類似；有微管（microtubule）的構造。其排列方式一樣為9＋2或9＋0。

    丙：在一般精子的鞭毛與自由生活之螺旋菌類似乎都含有Kinetosomal DNA。

    請依據上文回答下列問題：

    59. <u>瑪格莉斯</u>的內共生假說可解釋哪些胞器？（單選）'
