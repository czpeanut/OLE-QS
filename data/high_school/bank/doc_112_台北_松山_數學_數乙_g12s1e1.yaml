  explanation: '∵$\left\langle \left( 1-\frac{4x}{5} \right) ^{n} \right\rangle$收斂 ∴－1＜1－$\frac{4x}{5}$ ≤ 1

    ⇒－2＜$-\frac{4x}{5}$ ≤ 0 ⇒－10＜－4x ≤ 0 ⇒ 0 ≤ x＜$\frac{5}{2}$

    4.1.$\overline{2}$＝1＋（0.2＋0.02＋……）＝1＋$\frac{\frac{2}{10}}{1-\frac{1}{10}}$＝1＋$\frac{2}{9}$＝$\frac{11}{9}$

    無窮等比級數之和為$\frac{a}{1-0.1}$＝$\frac{11}{9}$⇒ a＝$\frac{11}{10}$

    5.0.$\overline{17}$＋0.$\overline{83}$

    ＝（0.17＋0.0017＋……）＋（0.83＋0.0083＋……）

    ＝$\frac{\frac{17}{100}}{1-\frac{1}{100}}$＋$\frac{\frac{83}{100}}{1-\frac{1}{100}}$＝$\frac{17}{99}$＋$\frac{83}{99}$＝$\frac{100}{99}$

    6.$\lim_{x\rightarrow 2^{-}} f(x)$＝$\lim_{x\rightarrow 2^{-}} (-x^{2}+1)$＝－3

    $\lim_{x\rightarrow 2^{+}} f(x)$＝$\lim_{x\rightarrow 2^{+}} (x+a)$＝2＋a

    ∵$\lim_{x\rightarrow 2} f(x)$存在 ∴$\lim_{x\rightarrow 2^{-}} f(x)$＝$\lim_{x\rightarrow 2^{+}} f(x)$

    ⇒－3＝2＋a ⇒ a＝－5

    7.∵f（x）為連續函數

    ∴$\lim_{x\rightarrow 4} f(x)$＝f(4)，表示 $x^{2}$＋ax＋b 有 x－4 的因式

    ⇒ $4^{2}$＋4a＋b＝0 ⇒ b＝－4a－16，代回原式得

    $\lim_{x\rightarrow 4} \frac{x^{2}+ax+b}{x-4}$＝$\lim_{x\rightarrow 4} \frac{x^{2}+ax+(-4a-16)}{x-4}$＝$\lim_{x\rightarrow 4} \frac{(x-4)〔x+(a+4)〕}{x-4}$

    ＝$\lim_{x\rightarrow 4}$〔x＋（a＋4）〕＝a＋8＝8

    ⇒ a＝0，b＝－16，故數對（a，b）＝（0，－16）

    8.白色三角形的面積分別為

    $\frac{\sqrt{3}}{4}$×$3^{2}$，$\frac{\sqrt{3}}{4}$×$3^{2}$＋3×$\frac{\sqrt{3}}{4}$×$\left( \frac{3}{2} \right) ^{2}$，$\frac{\sqrt{3}}{4}$×$3^{2}$＋3×$\frac{\sqrt{3}}{4}$×$\left( \frac{3}{2} \right) ^{2}$＋9×$\frac{\sqrt{3}}{4}$×$\left( \frac{3}{4} \right) ^{2}$，……

    可知其為首項為$\frac{9\sqrt{3}}{4}$，公比為$\frac{3}{4}$的無窮等比級數

    故白色三角形面積的總和為$\frac{\frac{9\sqrt{3}}{4}}{1-\frac{3}{4}}$＝$9\sqrt{3}$'
