- id: doc_112_台北_松山_數學_數乙_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 試選出收斂的無窮級數。
  options:
  - label: A
    content: $\sum_{k=1}^{\infty} (-1)$
  - label: B
    content: $\sum_{k=1}^{\infty} 〔1+(-1)^{k}〕$
  - label: C
    content: $\sum_{k=1}^{\infty} \left( \frac{\pi}{3} \right)^{k}$
  - label: D
    content: $\sum_{k=1}^{\infty} \left( -\frac{\pi}{3} \right)^{k}$
  - label: E
    content: $\sum_{k=1}^{\infty} 0.99^{k}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$\sum_{k=1}^{\infty} (-1)$＝（－1）＋（－1）＋（－1）＋……，發散

    (B) ╳：$\sum_{k=1}^{\infty} 〔1+(-1)^{k}〕$＝0＋2＋0＋2＋……，發散

    (C) ╳：$\frac{\pi}{3}$＞1，發散

    (D) ╳：－$\frac{\pi}{3}$＜－1，發散

    (E) ○：－1＜0.99＜1，收斂

    故選(E)

    2.$2x^{2}$－4x－6 ≥ 0 ⇒ $x^{2}$－2x－3 ≥ 0 ⇒（x＋1）（x－3）≥ 0 ⇒ x ≥ 3 或 x ≤ －1

    故選(E)

    3.令 f（x）＝x×$2^{x}$－$2^{14}$

    f(10)＝10×$2^{10}$－$2^{14}$＝$2^{10}$×（10－$2^{4}$）＝$2^{10}$×（－6）＜0

    f(11)＝11×$2^{11}$－$2^{14}$＝$2^{11}$×（11－$2^{3}$）＝$2^{10}$×3＞0

    ∵f(10)×f(11)＜0 ∴f（x）＝0 在 10 和 11 之間至少有一實根，得 k＝10

    故選(A)'
