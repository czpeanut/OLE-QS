- id: doc_112_台北_松山_數學_數乙_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設 $a_{1}$，$a_{2}$，……，$a_{n}$，……是一公比為$-\frac{2}{3}$的無窮等比數列且 $a_{1}$＝1。試問以下哪些數列會收斂？
  options:
  - label: A
    content: －$a_{1}$，－$a_{2}$，……，－$a_{n}$，……
  - label: B
    content: $a_{1}^{2}$，$a_{2}^{2}$，……，$a_{n}^{2}$，……
  - label: C
    content: │$a_{1}$│，│$a_{2}$│，……，│$a_{n}$│，……
  - label: D
    content: $\frac{1}{a_{1}}$，$\frac{1}{a_{2}}$，……，$\frac{1}{a_{n}}$，……
  - label: E
    content: $a_{1}$，$a_{1}$＋$a_{2}$，……，$a_{1}$＋$a_{2}$＋……＋$a_{n}$，……
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '〈$a_{n}$〉：1，$-\frac{2}{3}$，$\frac{4}{9}$，$-\frac{8}{27}$，……為一無窮等比數列

    (A) ○：－1，$\frac{2}{3}$，$-\frac{4}{9}$，$\frac{8}{27}$，……

    ∵公比 r＝$-\frac{2}{3}$ ∴此數列收斂到 0

    (B) ○：1，$\frac{4}{9}$，$\frac{16}{81}$，$\frac{64}{729}$，……

    ∵公比 r＝$\frac{4}{9}$ ∴此數列收斂到 0

    (C) ○：1，$\frac{2}{3}$，$\frac{4}{9}$，$\frac{8}{27}$，……

    ∵公比 r＝$\frac{2}{3}$ ∴此數列收斂到 0

    (D) ╳：1，$-\frac{3}{2}$，$\frac{9}{4}$，$-\frac{27}{8}$，……

    ∵公比 r＝$-\frac{3}{2}$ ∴此數列發散

    (E) ○：1，1－$\frac{2}{3}$，1－$\frac{2}{3}$＋$\frac{4}{9}$，1－$\frac{2}{3}$＋$\frac{4}{9}$－$\frac{8}{27}$，……

    ∵$\sum_{n=1}^{\infty} (a_{1}+a_{2}+\cdots \cdots +a_{n})$為收斂 ∴此數列為收斂

    故選(A)(B)(C)(E)'
- id: doc_112_台北_松山_數學_數乙_g12s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 關於數列極限的運算，試選出正確的選項。
  options:
  - label: A
    content: 若〈$a_{n}$〉、〈$b_{n}$〉均為收斂數列，則〈$a_{n}$×$b_{n}$〉為收斂數列
  - label: B
    content: 若〈$a_{n}$〉為收斂數列、〈$b_{n}$〉為發散數列，則〈$a_{n}$－$b_{n}$〉為發散數列
  - label: C
    content: 若〈$a_{n}$〉為發散數列，則$\left\langle \frac{a_{n}}{n} \right\rangle$為收斂數列
  - label: D
    content: 若〈$a_{n}$＋$b_{n}$〉為收斂數列，則〈$a_{n}$〉、〈$b_{n}$〉均為收斂數列
  - label: E
    content: 若〈$a_{n}$〉、〈$a_{n}$－$b_{n}$〉均為收斂數列，則〈$b_{n}$〉為收斂數列
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○；(B) ○

    (C) ╳：令〈$a_{n}$〉：$1^{2}$，$2^{2}$，$3^{2}$，……，$n^{2}$，……

    $\left\langle \frac{a_{n}}{n} \right\rangle$：1，2，3，……，n，……為一發散數列

    (D) ╳：令〈$a_{n}$〉：1，－1，1，－1，……，（－1）$^{n＋1}$，……

    〈$b_{n}$〉：－1，1，－1，1，……，（－1）$^{n}$，……

    〈$a_{n}$＋$b_{n}$〉：0，0，0，0，……

    〈$a_{n}$＋$b_{n}$〉為收斂數列，但〈$a_{n}$〉、〈$b_{n}$〉均為發散數列

    (E) ○

    故選(A)(B)(E)'
- id: doc_112_台北_松山_數學_數乙_g12s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 關於函數的極限，試選出正確的選項。
  options:
  - label: A
    content: $\lim_{x\rightarrow 3} \frac{1}{x}$＝$\frac{1}{3}$
  - label: B
    content: $\lim_{x\rightarrow 3} | x |$＝3
  - label: C
    content: $\lim_{x\rightarrow 3} [x]$＝3，其中 [x] 為高斯函數
  - label: D
    content: $\lim_{x\rightarrow 3} \frac{1}{x-3}$＝0
  - label: E
    content: $\lim_{x\rightarrow 3} \frac{| x-3 |}{x-3}$＝1
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○；(B) ○

    (C) ╳：$\lim_{x\rightarrow 3^{+}}$[x]＝3，$\lim_{x\rightarrow 3^{-}}$[x]＝2

    ∵$\lim_{x\rightarrow 3^{+}}$[x]≠$\lim_{x\rightarrow 3^{-}}$[x] ∴$\lim_{x\rightarrow 3}$[x] 極限不存在

    (D) ╳：$\lim_{x\rightarrow 3} \frac{1}{x-3}$極限不存在

    (E) ╳：$\lim_{x\rightarrow 3^{+}} \frac{| x-3 |}{x-3}$＝$\lim_{x\rightarrow 3^{+}} \frac{x-3}{x-3}$＝1，$\lim_{x\rightarrow 3^{-}} \frac{| x-3 |}{x-3}$＝$\lim_{x\rightarrow 3^{-}} \frac{-(x-3)}{x-3}$＝－1

    ∵$\lim_{x\rightarrow 3^{+}} \frac{| x-3 |}{x-3}$≠$\lim_{x\rightarrow 3^{-}} \frac{| x-3 |}{x-3}$ ∴$\lim_{x\rightarrow 3} \frac{| x-3 |}{x-3}$極限不存在

    故選(A)(B)'
