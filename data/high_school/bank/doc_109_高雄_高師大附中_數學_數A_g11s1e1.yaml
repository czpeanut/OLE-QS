- id: doc_109_高雄_高師大附中_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知$\frac{3\pi}{2}$＜α＜2π，sinα＋cosα＝$\frac{1}{5}$，則下列敘述哪些正確？
  options:
  - label: A
    content: sin2α＝$- \frac{12}{25}$
  - label: B
    content: sinα－cosα＝$- \frac{7}{5}$
  - label: C
    content: cosα＝$\frac{3}{5}$
  - label: D
    content: $\tan \frac{\alpha}{2}$＝$- \frac{1}{3}$
  - label: E
    content: $\sin \left( \alpha - \frac{3\pi}{2} \right)$＝$\frac{4}{5}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：（sinα＋cosα）$^{2}$＝$\left( \frac{1}{5} \right) ^{2}\Rightarrow$1＋2 sinαcosα＝$\frac{1}{25}$

    ∴sin2α＝2 sinαcosα＝$- \frac{24}{25}$

    (B)○：（sinα－cosα）$^{2}$＝1－2 sinαcosα＝$1 + \frac{24}{25}$＝$\frac{49}{25}$

    又$\frac{3\pi}{2}$＜α＜2π$\Rightarrow$sinα－cosα＜0

    ∴sinα－cosα＝$- \frac{7}{5}$

    (C)╳：$\begin{cases}\sin \alpha + \cos \alpha = \frac{1}{5} \\ \sin \alpha - \cos \alpha = - \frac{7}{5}\end{cases}\Rightarrow\begin{cases}\sin \alpha = - \frac{3}{5} \\ \cos \alpha = \frac{4}{5}\end{cases}$

    (D)○：$\tan \frac{\alpha}{2}$＝$- \sqrt{\frac{1 - \cos \alpha}{1 + \cos \alpha}}\left( \because \frac{3\pi}{4}<\frac{\alpha}{2}<\pi \right)$＝$- \sqrt{\frac{1 - \frac{4}{5}}{1 + \frac{4}{5}}}$＝$- \frac{1}{3}$

    (E)○：$\sin \left( \alpha - \frac{3\pi}{2} \right)$＝cosα＝$\frac{4}{5}$

    故選(B)(D)(E)'
