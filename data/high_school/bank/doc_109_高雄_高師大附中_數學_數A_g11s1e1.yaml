- id: doc_109_高雄_高師大附中_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 已知α，β$\in$R，則下列敘述哪些正確？
  options:
  - label: A
    content: 4 sinα＋3 cosβ的最大值為 7
  - label: B
    content: 4 sinα＋3 cosβ的最小值為－5
  - label: C
    content: 4 sin2α＋3 cos2α的最大值為 7
  - label: D
    content: 4 sin2α＋3 cos2α的最小值為－5
  - label: E
    content: 4 sin2（20°－α）＋3 cos2（α－20°）有可能為－3.5
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：當α＝$\frac{\pi}{2}$，β＝0 時，4 sinα＋3 cosβ 的最大值為 7

    (B)╳：當α＝$\frac{3\pi}{2}$，β＝π 時，4 sinα＋3 cosβ 的最小值為－7

    (C)╳：4 sin2α＋3 cos2α的最大值為$\sqrt{4^{2} + 3^{2}}$＝5

    (D)○：4 sin2α＋3 cos2α的最小值為$- \sqrt{4^{2} + 3^{2}}$＝－5

    (E)○：4 sin2（20°－α）＋3 cos2（α－20°）

    ＝4 sin2（20°－α）＋3 cos2（20°－α）

    最小值為$- \sqrt{4^{2} + 3^{2}}$＝－5，最大值為$\sqrt{4^{2} + 3^{2}}$＝5

    故可能為－3.5

    故選(A)(D)(E)'
