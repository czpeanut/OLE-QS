- id: doc_109_高雄_高師大附中_數學_數A_g11s1e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 1
  stem: 下列有關三角函數圖形的平移與伸縮，哪些敘述是正確的？
  options:
  - label: A
    content: y＝sin（x＋2）的圖形可利用 y＝sinx 的圖形向右平移 2 弳得到
  - label: B
    content: y＝sin（2x－2）的圖形可利用 y＝sinx 的圖形先向右平移 2 弳，再以 y 軸為中心，水平方向伸縮 2 倍得到
  - label: C
    content: y＝sin（2x－2）的圖形可利用 y＝sinx 的圖形先以 y 軸為中心，水平方向伸縮 2 倍，再向右平移 2 弳得到
  - label: D
    content: y＝2 sinx－3 的圖形可利用 y＝sinx 的圖形先以 x 軸為中心，鉛直方向伸縮 2 倍，再向下平移 3 單位得到
  - label: E
    content: y＝2 sinx－3 的圖形可利用 y＝sinx 的圖形先向下平移 3 單位，再以 x 軸為中心，鉛直方向伸縮 2 倍得到
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：應為向左平移 2 弳

    (B)╳：y＝sinx$\xrightarrow[2 弳]{向右平移}$ y＝sin（x－2）

    $\xrightarrow[2 倍]{水平伸縮}$y＝sin$\left( \frac{1}{2}x - 2 \right)$

    (C)╳：y＝sinx$\xrightarrow[2 倍]{水平伸縮}$ y＝$\sin \frac{1}{2}x$

    $\xrightarrow[2 弳]{向右平移}$ y＝$\sin \frac{1}{2} ( x - 2 )$＝sin$\left( \frac{1}{2}x - 1 \right)$

    (D)○：y＝sinx$\xrightarrow[2 倍]{鉛直伸縮}$ y＝2 sinx

    $\xrightarrow[3 單位]{向下平移}$ y＝2 sinx－3

    (E)╳：y＝sinx$\xrightarrow[3 單位]{向下平移}$ y＝sinx－3

    $\xrightarrow[2 倍]{鉛直伸縮}$ y＝2（sinx－3）＝2 sinx－6

    故選(D)'
