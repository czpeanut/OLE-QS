  stem: 甲國企圖以經濟戰手段迫使乙國屈服，並保護自己的經濟發展，乃宣布禁止一切來自乙國的貨物登陸歐洲大陸；還在其統治區內，追查乙國商人並沒收乙國貨物，造成乙國經濟危機，引發社會動盪。但乙國尚有許多海外貿易，仍可支撐其經濟。請就下列敘述何者正確？
