    28.(A)學者認為希臘神話「實際上也反映了古希臘的宗教和政治制度」，可見並非與事實無關。(B)(D)希臘神話中的神祇擁有超人的能力，卻具有凡人的七情六欲，甚至會隨心所欲主導與干預世界。

    29.17 世紀中期為科學革命時期，(A)學校並非培育官僚人才的地方，(C)中產階級於中古後期已崛起，(D)遠航人才的培育應在 16 世紀，三者皆非正確的選項。因此可能的原因為(B)，為抵抗新知識對教義與教會權威的挑戰，教會學校大增。

    30.(B)柏拉圖追求客觀的真實性，認為只有觀念才是真實的，感官都是虛幻的，透過哲學反思與探究，才能獲得真正的知識。

    31.從題文可看出這個國家的國王受到國會的牽制，甚至發生「國會殺國王」的事件，因此可推知該國家為(C) 17 世紀的英格蘭，「國會殺國王」事件是指清教徒革命。

    32.甲挑戰神父的權威，應為宗教改革之後；乙視宗教是必要的存在，但又表示世上還有許多事值得關注，應為中古後期至文藝復興時期；丙攻訐教會迷信宰制人民，強調理性取代宗教，故為啟蒙運動時。依出現的時間排序為(D)乙甲丙。

    33.這位紡織廠的老闆應是蘇格蘭的歐文，從建立合作社以解決經濟問題的作法，可知這位老闆應是烏托邦社會主義者，(B)為正解。

    34.崇尚古典學術，追求「全能的人」為文藝復興時期的特徵，其藝術發展錯誤的敘述為(C)，此時藝術作品仍以宗教題材為多。

    35.從追求分權、權力均衡來看，作者應是主張三權分立且制衡的(B)孟德斯鳩。

    36.(A)(B)(C)三者皆為古羅馬帝國的皇帝，僅(D)查士丁尼為 6 世紀拜占庭帝國皇帝，在位時曾重建都城、興建教堂、頒布法典，為拜占庭帝國的全盛時期。

    37.從「從為奴之家救贖你們脫離埃及法老的手」一句，可知與摩西率領族人出埃及有關，(A)(B)(C)皆是正確的敘述，(D)猶太人雖信仰一神的猶太教，但並非始終堅定如一，直至亡國後才堅定一神信仰。

    38.從題文的求援信來看，馬其頓南下攻擊希臘城邦的行為已危及全希臘的利益，因此該城邦才寄望雅典能出兵幫忙，可見當時希臘世界已經衰退而無力應付北方的外患，(D)為正解。(A)該國王為亞歷山大的父親腓力二世。(B)伯羅奔尼撒戰爭使希臘衰退，引來馬其頓的擴張。(C)某希臘城邦向雅典求援，不代表雅典軍事實力遠勝於馬其頓。

    39.從手工業與貿易發達、男性自由公民參與公共事務、喜歡在市集與廣場討論時事或辯論等線索，可推知此一政權應為古希臘的雅典，(C)為正解。(A)東羅馬帝國。(B)斯巴達。(D)羅馬帝國。

    40.法國大革命期間頒布法典，將啟蒙思想編入其中的統治者為(D)拿破崙，隨著對外軍事的擴張，亦將此法典的革命精神傳播到歐陸其他地區。

    41.(C)基督長老教會屬於喀爾文派，位於圖中的丙區；丁區為英國國教派。

    42.甲為美國 1787 年制定聯邦憲法之前，乙為美國行憲後第二任總統的話，丙為英王對北美殖民地獨立運動的回應，時間先後順序應為(D)丙甲乙。'
