  answer_status: verified
  answer_source: answer_key
  explanation: (A)《神曲》並未控訴教會腐敗與封建諸王的爭鬥，(C)題文看不出「愚人」對教會的嘲諷，(D)《沉思錄》為奧里略的私人日記，與題文的寫法並不相同，排除三者選項，故選(B)。題文節錄自《十四行詩》第 104 首，後面缺漏的幾句是「我鄙視生存，卻偏偏滯留人世；我厭惡自己，卻愛別人愛得發狂；我在痛苦中存活，流淚神傷，但心內隱約的暗喜；我厭惡死，也痛恨生：就是這樣，女子，你任意把我的心傷。」寫出對一生摰愛女子逝世後的痛苦與悲傷。
