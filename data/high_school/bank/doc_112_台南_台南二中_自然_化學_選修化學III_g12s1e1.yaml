  stem: '下列是在特定溫度下，利用目視比色法求$Fe^{3＋}$(aq)＋$SCN^{－}$(aq) ⇌ $FeSCN^{2＋}$(aq)平衡常數的實驗。實驗步驟如下： 步驟1：取2支規格相同的比色用試管，分別加入0.002 M、5.0毫升的KSCN溶液，並標記為1、2號試管。 步驟2：取0.20 M、20.0毫升硝酸鐵溶液，置於錐形瓶中，標為甲溶液。 步驟3：以吸量管吸取10.0毫升甲溶液，置於容器A中並加水稀釋成25.0毫升，標為乙溶液。 步驟4：以吸量管吸取甲溶液5.0毫升加至1號試管，將5.0毫升乙溶液加至2號試管。

