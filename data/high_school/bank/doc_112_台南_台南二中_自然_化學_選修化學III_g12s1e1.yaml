    content: 莫耳數比$H_{2}$：$I_{2}$：HI＝1：1：2
  - label: B
    content: 正向反應速率＝逆向反應速率＝0
  - label: C
    content: 系統總質量維持不變
  - label: D
    content: $I_{2}$(g)濃度不再改變
  - label: E
    content: 系統的總壓維持不變
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)係數比＝反應過程中物質變化量比，與平衡狀態無關；(B)反應速率不為0；(C)系統質量無論何時皆維持不變，質量守恆，與平衡無關；(D)正確；(E)本反應之反應物、產物之氣體係數總和相同，故總壓無論何時皆維持不變。故選(D)。
