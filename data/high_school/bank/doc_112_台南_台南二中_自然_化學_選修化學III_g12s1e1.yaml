  stem: 25℃時，$PCl_{3}$(g)＋$Cl_{2}$(g) ⇌ $PCl_{5}$(g) ΔH＜0，平衡常數為$K_{c}$，則下列敘述何者正確？
  options:
  - label: A
    content: 溫度升高，[$PCl_{5}$]變小，$K_{c}$值變小
  - label: B
    content: 定溫定壓下，加入He，平衡向右移動
  - label: C
    content: 加入催化劑，平衡向右移動，$K_{c}$值變大
  - label: D
    content: 加入催化劑，正反應速率變快，逆反應速率變慢
  - label: E
    content: 升高溫度，$PCl_{5}$(g)的分解速率變快，$PCl_{3}$(g)和$Cl_{2}$(g)的結合速率變慢
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為放熱反應，加熱平衡向左移動，K變小；(B)定溫定壓下加入不反應氣體，視為擴大容器體積，則平衡往氣體係數和較大的方向移動；(C)加催化劑不影響平衡；(D)加入催化劑，正逆反應速率皆變快；(E)升高溫度，正逆反應速率都變快。故選(A)。
