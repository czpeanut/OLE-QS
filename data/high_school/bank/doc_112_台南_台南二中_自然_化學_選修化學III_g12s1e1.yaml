  stem: 小恩在燒杯中裝了100 mL蒸餾水，並放入足量的$BaCrO_{4}$(s)，攪拌一陣子後靜置，發現燒杯底部沉降下來的$BaCrO_{4}$(s)的固體不再變少，反應為$BaCrO_{4}$(s) ⇌ $Ba^{2＋}$(aq)＋$CrO_{4}^{2－}$(aq)，則下列敘述何者正確？
  options:
  - label: A
    content: 此時的溶液為過飽和溶液
  - label: B
    content: 加入純水，平衡向右移動，新平衡時[$Ba^{2＋}$]變小
  - label: C
    content: 加入$K_{2}CrO_{4}$(s)，平衡向左移動，新平衡時[$CrO_{4}^{2－}$]減少
  - label: D
    content: 加入HCl(aq)，會使[$CrO_{4}^{2－}$]減少，故平衡向右移動
  - label: E
    content: 加入$BaCrO_{4}$(s)，溶液顏色變深
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為飽和溶液；(B)重新達平衡時，因K不變，故離子濃度也不變；(C)平衡向左移動，故[$Ba^{2＋}$]減少，但K不變，故達新平衡時[$CrO_{4}^{2－}$]還是會比原本多；(D)正確；(E)加入固體不影響平衡移動，顏色不變。故選(D)。
