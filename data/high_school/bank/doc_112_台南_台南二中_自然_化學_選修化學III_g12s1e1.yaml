  stem: 關於電解質的敘述，下列何者正確？
  options:
  - label: A
    content: 電解質水溶液中，陰、陽離子數目必相同
  - label: B
    content: 能導電的物質即為電解質
  - label: C
    content: 電解質水溶液必為電中性
  - label: D
    content: NaOH固態及水溶液狀態皆能導電
  - label: E
    content: 電解質溶在水中，通電後陽離子往正極移動，陰離子往負極移動
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)電荷總量相同，陰、陽離子個數不一定相同；(B)金屬也能導電，但不是電解質，電解質指的是在水溶液中或液態可導電的物質；(D)固態NaOH無法導電；(E)陽離子往負極移動、陰離子往正極移動。故選(C)。
