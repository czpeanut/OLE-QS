  stem: 抽血的時候，常常會看到護理師拿著五顏六色的採血管（如下圖），不同顏色採血管分別代表不同的醫療用途。例如：灰色的管中含有草酸鉀當作抗凝血劑，氟化鈉可避免紅血球糖解，常被用於檢驗血液中的葡萄糖和乳酸。為了避免抽出人體的血液凝結，必須從血漿中除去鈣離子，所以抗凝劑的作用就是去除血液中的鈣離子，如草酸根（$C_{2}O_{4}^{2－}$）。當$C_{2}O_{4}^{2－}$濃度夠高時，鈣離子和草酸根離子會形成固體$CaC_{2}O_{4}$沉澱。已知血清樣品中[$Ca^{2＋}$]＝2.0×$10^{－3}$ M。試回答下列問題： （$CaC_{2}O_{4}$ $K_{sp}$為1.96×$10^{－8}$，$K_{2}C_{2}O_{4}$莫耳質量166 g／mol） (1) 血液中的鈣離子在[$C_{2}O_{4}^{2－}$]大於多少時，會產生沉澱？ (2) 一支3.0 mL的真空抽血管中，最少須含有多少毫克（mg）草酸鉀（$K_{2}C_{2}O_{4}$）才可抑制血液凝固？
