  - label: B
    content: 25℃、1 atm的二氧化碳在pH＝8之NaOH水溶液中的溶解度小於0.034 M
  - label: C
    content: 25℃、1 atm的空氣溶在水中二氧化碳的濃度小於0.034 M
  - label: D
