  page: 5
  stem: 根據明朝賦稅制度的轉變，請問明朝一條鞭法之前，實施的是甚麼稅收制度？
  options:
  - label: A
    content: 均田制
  - label: B
    content: 租庸調制
  - label: C
    content: 兩稅法
  - label: D
    content: 攤丁入畝
  group_stem: '以下是明朝前期賦稅制度的內容，請根據下列資料，回答第 42-43 題：

    資料一：

    甲.田賦

    徵收稅額：明代的農田分為官田及民田，稅分兩等，官田每畝課稅五升三合，民田每畝課稅三升二合。

    徵收次數：分夏秋兩季徵收。夏稅無過八月，秋糧無過明年二月。

    乙.服役年齡

    1. 明初規定，民年十六歲為成丁，即須服役，年六十免役。

    2. 力役種類：分里甲、均徭、雜役三種。里甲以戶為單位，負責管治本里的事務；均徭以丁為單位，為官府工作；雜役是臨時徵役。

    3. 以銀代役：明代容許出錢代役。凡親身服役的叫「力差」，納銀雇人代替服役。

    資料二：

    隨著政府資料散亂，加上政府經常額外加收其他賦稅，所以需要改革明朝賦稅制度。於是在明中葉實施一條鞭法改革，

    下列是一條鞭法的內容：

    萬曆九年，通令全國將田賦、徭役、土貢（各州進貢的土產）合併徵收。

    先行核算各州縣之田畝，統計該地人口多寡，估量所須負擔徭役之輕重，然後分減該處人民承擔。每年徵收一次，除

    固定之漕糧地區外，一般以色銀轉算計納。'
