  group_stem: 資料一：國之語音，異乎中國，與文字不相流通。故愚民有所欲言而終不得伸，其情者多矣。予為此憫然，新制二十八字，欲使人人易習，便於日用……有其聲而無其字，假中國之字以通其用，是猶枘鑿之鉏鋙也，豈能達而無礙乎，要皆各隨所處而安不可強之使同也。吾東方禮樂、文章、侔擬華夏，但方言俚語，不與之同，學書者患其有趣之難曉，治獄者病其曲折之難通，昔新羅薛驄，始作吏讀，官府民間至今行之。然皆假宇而用，或澀或窒，非但鄙陋無稽而已，至於言語之間，則不能，達其萬一焉。 資料二：我朝自祖宗以來，至誠事大，一遵華制，今當同文同軌之時，創作諺文，有該觀聽。儻曰諺文，皆本古字非新字也，則字形雖倣古之篆文，用音合字盡反於古實無所據，若流中國，或有非議者。豈不是愧於事大慕華。
