  stem: 儒學思想與漢字雖然是日本、朝鮮與越南的共同文化基礎，但在歷史變遷過程中，逐漸發展出屬於自己文化特質，請閱讀以下資料並選出正確敘述：資料一：長期以來，當地政府高官主要是使用漢文與文言文，但卻聲稱「我國的歷史是一部中國侵略史」，11世紀以後開始創造屬於自己的文字。現今城市裡雖然還留有孔廟與中文字，但人們已不識中文。資料二：人們對孔子非常尊崇，但在孔典禮時有穿明朝儒服，有的穿當地古代服裝，有的穿神道裝，可見這是一個文化包容性極強的國家。資料三：這是一個民族性強悍的國家，雖然使用中國旳漢字，但在15世紀創立一套本國語音文字系統？
