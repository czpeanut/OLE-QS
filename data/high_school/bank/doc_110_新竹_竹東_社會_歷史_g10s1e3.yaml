  group_stem: '資料一：朝鮮之戰奠定了東亞其後三百年的區域權力格局，被學者宋念深稱為東亞第一次世界大戰。「此戰之後，日本當時的領導者勢力一蹶不振，東瀛諸島由德川家康收拾一統，開闢了兩百六十多年的江戶幕府時代。大明和朝鮮則元氣大傷，努爾哈赤領導的女真部在遼東迅速崛起，並在此後幾十年中攻半島、結蒙藏、入中原、創立盛極一時的清帝國」

    資料二：2014年韓國史詩大片《鳴梁海戰》上映，打破此前由《阿凡達》保持的韓國觀影人次紀錄，電影講述的是日本發動第二次侵朝攻勢之時，朝鮮名將李舜臣，利用半島南端鳴梁海峽險要地形和複雜水文條件，以十二艘板屋船，阻擊了日本數量龐大的先遣部隊。從意識和認知的角度來看，此一戰役的「現代」意義在於它成為東亞國關係記憶的一個節點。第一，中日韓三國對此戰的稱呼，一開始就指向不同的方向。這場戰爭在中國被稱為征韓之役，在日本稱為文祿•慶長之役，在朝鮮則稱為壬辰倭亂。第二，三國在此後不同時期，總是透過回朔這場戰爭，來尋求當下對自身民族命運和世界格局的歷史解釋。'
