  group_stem: 「竹東集團」是一家大型的公司，旗下有許多子公司。隨著數位科技的興起，公司經營將進行轉型，並強化網路的經營。對此，「竹東集團」推出因應計畫，預計未來十年進行中央管理階層改組，逐年引進年輕、了解網路生態並且清楚公司內部營運狀況的人才。於是，母公司「竹東集團」派遣管理階層至子公司考察人選，建立日後公司轉型所需的儲備管理階層的人才庫。不料此制度實施後數年，因為管理階層的私心，使得公司管理階層均為同一派系，讓董事長備感威脅。
