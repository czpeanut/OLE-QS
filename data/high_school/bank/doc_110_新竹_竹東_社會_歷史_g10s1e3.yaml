  group_stem: '資料一 說起「支那」這個字，其實在日本人語感中是傾向中性的，例如有很多地理稱呼：「東支那海」、「印度支那半島」，還有食物：「支那竹」「支那そぼ｣，依然保留「支那」。由其語源來說，中國史上第一個統一帝國是「秦」，這「Ch''in」的發音經印度變成梵語的「チ一ナ」（Cina）、「テイソ」(Thin)，再轉到歐洲，變成法文的「シーヌ」(Chine)和英文的「チヤイナ」(China)。

    資料二 後來日本侵華，與中華民國交惡，日本不再稱呼對方作「中華民國」而是繼續使用「支那」一名。自侵略開始、侵華戰爭過程中日本一直以「支那」稱呼中國，這點連中國的平民都知道，所以「支那」一字由那時開始增添了「帝國主義」、「軍國主義」的色彩，令中國人對「支那」一字產生極厭惡的感覺。'
