  group_stem: 咻的一聲，小英穿越到了第二站～陽光暖暖的印尼，印尼剛於2019年4月17日舉行總統直選和國會大選，小英看著新聞報導和官方資料，將各個政黨得票率和席次數整理如下圖。小英也觀察到印尼國會選舉法規中明訂「每個政黨至少需提名三成的女性」，不過因為宗教和社會文化因素，導致人民對女性從政態度趨於保守，史不少政黨難以找到足夠的女性候選人，但小英看到有一位女模參選者在電視採訪時說「我希望改變這的國家，最好的改變方式就是進入這個系統，有權力起草法案、推動改變，這就是我投入選舉的原因」，也進而思索我國的相關狀況與規定。
