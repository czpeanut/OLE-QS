  stem: 根據題幹情境，請判斷英國的脫歐公投屬於何種性質？
  options:
  - label: A
    content: 強制性的公投
  - label: B
    content: 諮詢性的公投
  - label: C
    content: 地區性的公投
  - label: D
    content: 變更主權的公投
  group_stem: ◎1～5為題組 小英乘坐時空機，穿越到了第一站～2017年6月局勢渾沌的英國，此時的首相梅伊（Theresa May）面臨了如何帶領英國脫離歐盟的嚴峻挑戰。小英知道英國在2016年6月舉行的脫歐公投（Brexit Vote）中，以51.9％的比例同意脫離歐㬈，但此項公投結果對首相並拘束力，最後是國會通過《退出歐盟法案》（European Union Withdrawal Act），並經過（甲程序）後，鉬相才須執行歐政策，當時支持留歐立場的首相卡麥隆也因此辭職下台，由梅伊於02016年7月接任。而此時，梅伊為了令脫歐方案得到更多的支持以順利脫歐，以「建立強而穩定的領導」口號，在國會中提出解散國會、提前大選的動議，（乙程序）後，2017年6月8日舉行了共650個選區的國會大選，小英進行觀察並整理出此次國會大選前後的國會席次情況如下。大選後，梅伊先後提出三個脫歐方案，卻全部遭國會投票否決，繼而在野黨又對其提出不信任案，於脫歐泥淖的梅伊終於在2019年黯然宣布亂職下台，現任首相強森（Boris Jhonson）接任後，不僅要完成歐的重大任務，還將帶領英國人民共同對抗新冠肺炎疫情。
  shared_asset: g1_1_5
