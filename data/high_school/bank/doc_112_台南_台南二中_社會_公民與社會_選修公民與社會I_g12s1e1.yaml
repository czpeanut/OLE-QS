  stem: 某高中老師安排全班同學到音樂廳聆聽交響樂演出。從未去過音樂廳的甲生很緊張，除事前煩惱當天應如何穿著才「得體」外，欣賞過程中也擔心自己表現不適當，連何時該拍手都怕抓錯時機。相對地，乙生因常跟家人購票去音樂廳觀賞演出，故活動過程中從容不迫，事後老師也讚揚乙生舉止優雅、具備良好音樂欣賞素養。若從社會階層化角度分析上述事件中「資本與社會平等」的關係，下列哪些為適當之論點？
  options:
  - label: A
    content: 即使老師事前提供解說，也難以完全消除同學文化資本的落差
  - label: B
    content: 學生們具備的文化資本高低，決定於教育機構的資源分配多寡
  - label: C
    content: 文化資本的獲取如同習慣養成，會讓學生內化特定的生活風格
  - label: D
    content: 具備豐富文化資本有助於突破階層化現象，進而實現社會平等
  - label: E
    content: 經濟資本有時可轉換為主流認可的文化資本，因而再製不平等
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)文化資本蠻大的層面是由家庭教育習慣所養成，非一朝一夕能改變，為正確敘述。(B)教育機構雖可提供文化資本，但透過家庭慣習的養成和文化資本的培育才是關鍵。(C)文化資本指個人對於語言、文化、知識的掌握能力，以及內在特質的展現，並表現在生活風格中，為正確敘述。(D)文化資本常會造成階級再製，反而強化階層化現象。(E)家庭經濟狀況佳可學習更多文化資本，如：語言、音樂、旅行等，豐富自身視野，從而再製社會不平等，為正確敘述。
