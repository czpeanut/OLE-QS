  group_stem: 根據某國勞保局 2022 年 12 月公布最新「勞保老年年金給付領取金額分布」統計顯示，目前請領勞保老年年金給付者，平均月領金額為 1 萬 7,651 元，其中有 16 萬 4,967 人月領金額未滿 1 萬元。若加入性別項目分析，發現男性請領勞保老年年金給付平均月領金額為 1 萬 8,854 元，女性則為 1 萬 6,640 元，女性平均金額相較男性少了 2,214 元。女性月領金額未滿 1 萬元的人數達 10 萬 3,934 人，相較男性有 6 萬 1,085 人，女性月領金額在 1 萬以下的人數是男性的 1.7 倍。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 勞保老年年金屬於勞工保險的一部分，為社會保險的一種，與(A)健保費同為社會保險，為正解。(B)為社會救助。(C)(D)為社會津貼（社會福利服務）。
