  stem: 2007 年《新聞週刊》雜誌 George Wehrfritz 一篇名為〈社會流動之死〉（The Death of Social Mobility）專論文章，探討南韓、香港、臺灣、新加坡等亞洲四小龍過去經濟發展帶動的社會流動機會，將因社會不公平的分配機制而出現停滯的危機。受訪的香港中文大學社工學者 Wong Hung 指出：「過去的人們懷抱的希望，現在則難以奢望有朝一日成為中產階級分子。」讓底層民眾失去力爭上游期待出頭天的夢想希望，除顯示社會流動之死，也為社會進步發展埋下不安的因子。請問下列有關該現象的敘述，何者正確？
  options:
  - label: A
    content: 其僅存在於世襲、封閉系統的社會
  - label: B
    content: 代表階級結構具有跨世代的穩定性
  - label: C
    content: 總流動率愈低的社會，愈可能存在
  - label: D
    content: 具備先賦地位，不會產生代內流動
  - label: E
    content: 強化社會福利制度有助於改善困境
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)在開放的社會，也會有社會流動停滯之情形。(B)社會流動出現停滯，意味著階級結構具有跨世代的穩定性，為正確敘述。(C)社會流動停滯也代表社會總流動率低，為正確敘述。(D)具備先賦地位仍有產生社會流動的可能。(E)社會福利制度有助於減緩先賦地位造成的社會不平等，為正確敘述。
