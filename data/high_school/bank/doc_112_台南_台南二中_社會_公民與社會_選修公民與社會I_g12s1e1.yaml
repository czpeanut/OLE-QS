  stem: 有關臺灣經濟發展引起的社會流動現象，下列何者正確？
  options:
  - label: A
    content: 1950 年代，政府推動農業培養工業、工業發展農業，使得許多農民向上流動成為工業鉅子
  - label: B
    content: 1960 年代，透過出口導向生產模式，拓展國際市場帶動經濟成長，農民成為藍領階級勞工
  - label: C
    content: 1970 年代，政府提倡「客廳即工廠」，推動中小企業發展，由於代工，許多黑手變成頭家
  - label: D
    content: 1980 年代，電子業成為經濟發展重心，在產業結構轉變下，促成了「科技新貴」的興起
  - label: E
    content: 1990 年代，傳統的製造性產業外移，失業率提高及部分工時工作增加，加速了向上流動
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府連續推動四期「經濟建設四年計畫」（1953 年至 1968 年），採取「以農業培養工業，以工業發展農業」之策略，以農業為主，農民尚未向上流動成為工業鉅子。(D)科技新貴一詞是 2000 年代因股市盛行，當時高科技產業的年終、分紅多而出現，而非指 1980 年代的電子業。(E)產業外移和失業率提高，應會導致向下流動。
