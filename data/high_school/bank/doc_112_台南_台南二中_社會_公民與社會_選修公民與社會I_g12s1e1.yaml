- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 社會階層化理論主要有功能論與衝突論兩大學派，兩者對社會階層化論述各有不同，但他們對社會階層化的共同主張為何？
  options:
  - label: A
    content: 階層化的衝擊需要政府制定法規加以緩解
  - label: B
    content: 階層化的現象常會普遍存在於每個社會中
  - label: C
    content: 階層化的延續是為了社會經濟可分工運作
  - label: D
    content: 階層化的存在源自底層人民個人努力不足
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為衝突論的主張。(C)(D)此為功能論的主張。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
