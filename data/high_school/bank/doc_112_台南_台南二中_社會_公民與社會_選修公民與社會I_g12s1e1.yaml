  stem: 經濟學家克魯曼在其著作中有段話：「一項國家教育統計中心公布的數據，追蹤 1988 年美國八年級生教育經驗。這些學生依照兩項標準分類，一、以數學測驗衡量的個人才能，二、以父母的職業、所得和教育水準衡量的父母社經地位。測驗得高分和父母社經地位高，都能增加學生完成大學學業的機會，家庭地位的幫助較大。而測驗中分數最低四分之一，但來自家庭地位最高四分之一的學生，他們完成大學的機會，大於分數是最高四分之一，但家庭地位最低四分之一的學生。」依據資料顯示，個人是否能完成大學學業因素中，何者影響力較大？
