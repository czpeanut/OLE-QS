- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 關於我國社會流動的情形，下列敘述何者正確？
  options:
  - label: A
    content: 工業化時期的「黑手變頭家」，主要是憑個人努力所形成的社會流動
  - label: B
    content: 義務教育延長、大學升學率提高，顯示臺灣的教育資源分配具平等性
  - label: C
    content: 近年來年輕人想向上流動不容易，社會流動趨於停滯，形成封閉社會
  - label: D
    content: 隨著教育程度的提高、人權意識的增長、女性的社會地位比過去提升
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)除了個人努力，社會產業結構的轉變也是主要原因。(B)教育資源分配仍有許多不公平之處。(C)雖然向上流動較以前不易，但社會流動仍有，未形成封閉社會。(D)符合現況的正解。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 試從臺灣的工業化現象及其伴隨的社會流動情形分析，下列敘述何者「不」正確？
  options:
  - label: A
    content: 後工業時代隨著經濟全球化的發展，使中小企業及自營業者更具競爭力
  - label: B
    content: 1970 年代，臺灣經濟從進口替代逐漸轉為出口導向，農民成為藍領勞工
  - label: C
    content: 1960 ～ 1980 年代造就許多黑手變頭家的小企業主，提供向上流動的途徑
  - label: D
    content: 1990 年代以後，黑手頭家比例減少，科技新貴興起，服務業人口也增加
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)全球化使個體戶或中小企業更難以和大財團及大企業競爭，此為錯誤的敘述。(B)(C)(D)為符合臺灣社會現象的敘述。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 以下何者屬於社會流動中的「水平流動」？
  options:
  - label: A
    content: 計程車司機努力工作培育兒子成為大學教授
  - label: B
    content: 公司員工從基層技術員做起，最後成為經理
  - label: C
    content: 電子公司工程師遭資譴，成為打工時薪人員
  - label: D
    content: 工廠勞工不滿薪資過低，改行開計程車營業
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)為向上流動。(C)為向下流動。(D)勞工與計程車司機兩者的職業階層相似，轉換工作為水平流動。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 美國創投基金負責人漢諾爾提到，現在世界的貧富不均愈來愈嚴重，(<u>甲)為了維持資本民主高度作用，某種程度的不平等是必要的</u>。問題在於這些不平等正處於歷史新高，而且日漸惡化。(<u>乙)若是財富、勢力和收入都繼續集中在最頂層人的手中，社會將會開始起變化，就像 18 世紀的法國，貴族和農民爭鬥，流血衝突不斷</u>。請問下列關於(甲)、(乙)兩處的敘述，何者正確？
  options:
  - label: A
    content: (甲)屬於衝突論的觀點，認為在資本主義下自然會產生資產階級與無產階級
  - label: B
    content: (甲)屬於功能論的觀點，認為不平等雖有其必要，但終將不利於社會的運作
  - label: C
    content: (乙)屬於權力菁英觀點，認為政府政策多由少數人來決定，大眾毫無影響力
  - label: D
    content: (乙)屬於馬克思的觀點，認為當社會貧富差距愈來愈大時，會導致階級鬥爭
  answer:
  - D
