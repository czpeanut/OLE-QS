questions:
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 社會各行各業的人，他們工作時數一樣，但報酬各有不同。有人正職之外找尋斜槓副業，仍入不敷出；有人憑藉長輩贈與房產收取租金，則衣食無憂。請問社會階層化理論如何看待這些現象？
  options:
  - label: A
    content: 功能論主張擁有資源的人會致力維持自身利益
  - label: B
    content: 功能論主張富人制定經濟規則而導致貧富差距
  - label: C
    content: 衝突論主張依照個人才能及貢獻程度決定報酬
  - label: D
    content: 衝突論主張個人擁有的報酬不必然反映其價值
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)為衝突論的論點。(C)為功能論的主張。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 現代社會利用收入和財富衡量一個國家經濟不平等的現象，請問經濟不平等現象對一個國家或社會而言，最主要可能會直接產生何種影響？
  options:
  - label: A
    content: 政治權力掌握在少數權力菁英
  - label: B
    content: 難以共享社會資本的互惠價值
  - label: C
    content: 暴力犯罪增加使幸福感也降低
  - label: D
    content: 少數人壟斷了知識和文化資源
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 需找尋跟經濟不平等有關所造成的直接原因，以經濟資本低落易造成暴力犯罪行為增加，而使幸福感降低最相關，故以(C)為正解。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據英國《每日郵報》報導，丹麥攝影師埃斯基爾森（Joakim Eskildsen）曾在 7 個月內走訪美國五個州，以照片記錄當下美國社會底層人民的生活現狀。這些人與電視中所展示的「美國夢」形成巨大反差，他們長期失業與居無定所，不僅難以維生，更沒有時間與能力照顧子女及協助他們學習，因此預計下一代也無法脫離這樣的困境。針對上述社會問題，功能論者會對此作出何種解釋？
  options:
  - label: A
    content: 透過社會競爭分配工作與報酬是合理的
  - label: B
    content: 政府應協助失業者維持基本生活與就業
  - label: C
    content: 社會要提供資源幫助失業家庭子女學習
  - label: D
    content: 失業問題不能完全歸因於個人能力不足
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 功能論認為社會裡的一切活動，都是由該社會中的需求所決定或創造的，其社會地位是由其能力及努力所決定，故(A)為符合功能論的觀點。衝突論則認為社會階層和處境，是由社會結構所造成，因此政府應該介入協助失業者，故(B)(C)(D)皆為衝突論的主張。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「社會階層化」與「社會流動」都是現代社會極為常見的社會現象，兩者之間有密切的關聯性。下列對「社會階層化」與「社會流動」的解釋，何者正確？
  options:
  - label: A
    content: 社會階層化可以說是社會現代化的指標之一
  - label: B
    content: 社會階層化可以加速社會流動的速度與廣度
  - label: C
    content: 社會流動可以減輕社會階層化的約束與限制
  - label: D
    content: 社會流動愈順暢象徵階級複製的現象愈頻繁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)兩者並無關聯。(B)階層化會減緩社會流動的速度與廣度。(D)社會流動是象徵階級複製的程度會減輕。
- id: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 附圖是財政部公告的遺產繼承及拋棄繼承之性別比例。我國不僅分配遺產受傳統觀念影響甚深，就連贈與財產也是。2016 年度全臺受贈人共 22.8 萬人，其中男性占比達到 61.5 ％，比女性的 38.5 ％高出 23 個百分點，差距倍數約 1.6，顯見進行資產移轉或財務規劃時深受傳統觀念影響。依據圖文，請判斷下列敘述何者正確？
  options:
  - label: A
    content: 女性遺產繼承與拋棄繼承皆有逐年減少，顯見繼承權法定規定平等已具成效
  - label: B
    content: 無論遺產或資產轉移，男女平權觀念上仍受到「家產不落外姓」思維的影響
  - label: C
    content: 遺產繼承的性別差異逐漸縮小，顯示我國已擺脫「傳子不傳女」的傳統觀念
  - label: D
    content: 先天繼承、獲得財富資料取得容易，是我國用以衡量經濟不平等的主要指標
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_112_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 275.35
      - 573.2
      - 564.45
      - 728.0
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)女性繼承遺產比例逐年略有增加，而女性拋棄繼承的比例無明顯改變，因此看不出繼承權法定規定平等是否具有成效。(B)因為這 5 年來可看出，女性在遺產繼承的比例仍低，且拋棄繼承的比例仍高，因此家產不落外姓的性別不平等概念仍存在，為正解。(C)並無擺脫傳子不傳女的思維，顯示此思維仍繼續存在。(D)先天繼承、獲得的財富資料取得較所得資料不易，故我國衡量經濟不平等是以所得資料作為主要指標。
