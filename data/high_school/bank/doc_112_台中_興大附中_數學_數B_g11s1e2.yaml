  stem: 設 a＝$log_{2}$3，b＝$\log _{\frac{1}{2}}\frac{1}{4}$，c＝$log_{4}$7，則下列敘述何者正確？
  options:
  - label: A
    content: a＞b＞c
  - label: B
    content: a＞c＞b
  - label: C
    content: b＞a＞c
  - label: D
    content: b＞c＞a
  - label: E
    content: c＞a＞b
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '將 a，b，c 的底數換成 2，再比較真數大小

    則 a＝$log_{2}$3，b＝$\log _{\frac{1}{2}}\frac{1}{4}$＝$\log _{2^{-1}}4^{-1}$＝$\frac{-1}{-1}$ $log_{2}$4＝$log_{2}$4，

    c＝$log_{4}$7＝$\log _{4^{\frac{1}{2}}}7^{\frac{1}{2}}$＝$\log _{2}\sqrt{7}$

    又$\sqrt{7}$＜3＜4 ⇒ $\log _{2}\sqrt{7}$＜$log_{2}$3＜$log_{2}$4

    ⇒ c＜a＜b

    故選(C)'
