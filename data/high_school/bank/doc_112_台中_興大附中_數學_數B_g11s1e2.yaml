  stem: 一曲線 y＝$\left( \frac{1}{3} \right) ^{x}$分別與兩直線 $L_{1}$：y＝4，$L_{2}$：y＝36 交於 P、Q 兩點，則直線 PQ 的斜率為 ＿＿＿＿。
  answer:
  - －16
  answer_status: verified
  answer_source: answer_key
  explanation: '令 P（$x_{1}$，4），Q（$x_{2}$，36）

    $\begin{cases}4=\left( \frac{1}{3} \right) ^{x_{1}} \ldots \ldots \ldots \ldots \ldots ① \\ 36 =\left( \frac{1}{3} \right) ^{x_{2}}\ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由$\frac{②}{①}$得 9＝$\left( \frac{1}{3} \right) ^{x_{2}-x_{1}}$ ⇒ $3^{2}$＝$3^{-(x_{2}-x_{1})}$ ⇒ $3^{x_{1}-x_{2}}$＝$3^{2}$

    ⇒ $x_{1}$－$x_{2}$＝2

    故$m_{\overline{PQ}}=\frac{4-36}{x_{1}-x_{2}}=\frac{-32}{2}$＝－16

    〈另解〉

    $\begin{cases}4=\left( \frac{1}{3} \right) ^{x_{1}} \Rightarrow x_{1}=\log _{\frac{1}{3}}4 \ldots \ldots \ldots \ldots \ldots \ldots ① \\ 36 =\left( \frac{1}{3} \right) ^{x_{2}} \Rightarrow x_{2}=\log _{\frac{1}{3}}36 \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由②－①得 $x_{2}$－$x_{1}$＝$\log _{\frac{1}{3}}36-\log _{\frac{1}{3}}4$

    ＝$\log _{\frac{1}{3}}\frac{36}{4}$＝$\log _{3^{-1}}3^{2}$＝－2

    故$m_{\overline{PQ}}=\frac{36-4}{x_{2}-x_{1}}=\frac{32}{-2}$＝－16'
