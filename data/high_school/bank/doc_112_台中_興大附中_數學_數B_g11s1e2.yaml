  stem: 化學上的 pH 值用來表示溶液的氫離子濃度，溶液的氫離子濃度若為 x（莫耳／升），則定義－logx 為溶液的 pH 值。可樂的 pH 值為 3.5，咖啡的 pH 值為 5，試問可樂的氫離子濃度為咖啡氫離子濃度的＿＿＿＿倍。
  answer:
  - $10\sqrt{10}$
  answer_status: verified
  answer_source: answer_key
  explanation: '令可樂的氫離子濃度為 $x_{A}$，咖啡的氫離子濃度為 $x_{B}$

    則$\begin{cases}-\log x_{A}=3.5 \\ -\log x_{B}=5\end{cases} \Rightarrow \begin{cases}x_{A}=10^{-3.5} \ldots \ldots \ldots \ldots \ldots ① \\ x_{B}=10^{-5} \ldots \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由$\frac{①}{②}$得$\frac{x_{A}}{x_{B}}$＝$\frac{10^{-3.5}}{10^{-5}}$＝$10^{1.5}$＝$10\sqrt{10}$

    故可樂的氫離子濃度為咖啡氫離子濃度的$10\sqrt{10}$倍'
