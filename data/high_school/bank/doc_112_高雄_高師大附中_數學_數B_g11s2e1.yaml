  type: single
  page: 1
  stem: 在皮克斯開頭動畫中，跳跳燈讓人印象深刻，如果跳跳燈一開始傾斜（圖(一)）到後來正朝向地上（圖(二)），請問地面上的圖案會如何變化？
  options:
  - label: A
    content: 橢圓→圓形
  - label: B
    content: 雙曲線的部分圖形→拋物線
  - label: C
    content: 拋物線→圓形
  - label: D
    content: 拋物線→雙曲線的部分圖形
  - label: E
    content: 圓形→橢圓
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_112_高雄_高師大附中_數學_數B_g11s2e1/s1_3_f1.png
