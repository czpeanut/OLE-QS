- id: doc_112_高雄_高師大附中_數學_數B_g11s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 請問下列哪些選項是正確的？
  options:
  - label: A
    content: 空間中，若兩相異直線 $L_{1}$ 和 $L_{2}$ 均與平面 E 垂直，則 $L_{1}$ 與 $L_{2}$ 必平行
  - label: B
    content: 空間中，若兩相異直線 $L_{1}$ 和 $L_{2}$ 均與直線 L 垂直，則 $L_{1}$ 與 $L_{2}$ 必平行
  - label: C
    content: 空間中，若一直線 L 垂直平面 E，則包含 L 的每一個平面均垂直平面 E
  - label: D
    content: 空間中一直線及任意一點可決定唯一的平面
  - label: E
    content: 空間中兩相異直線不共面，則兩直線必歪斜
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_112_高雄_高師大附中_數學_數B_g11s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 右圖是正四角錐（底面 ABCD 為正方形，其餘四面均為等腰三角形），直線 EH 為正四角錐的高，請問下列哪些選項是正確的？
  options:
  - label: A
    content: 直線 AB 與直線 DE 平行
  - label: B
    content: 直線 AD 與直線 BC 歪斜
  - label: C
    content: 直線 AE 與直線 BC 不相交
  - label: D
    content: 直線 BE 與直線 CE 不共平面
  - label: E
    content: 直線 EH 與直線 AD 歪斜
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_112_高雄_高師大附中_數學_數B_g11s2e1/s2_2_f1.png
    crop:
      page: 2
      rect:
      - 451.0
      - 438.3
      - 563.85
      - 529.1
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：直線 AB 與直線 DE 歪斜

    (B)╳：直線 AD 與直線 BC 平行

    (C)○：直線 AE 和直線 BC 歪斜，故兩直線不相交

    (D)╳：直線 BE 與直線 CE 均在平面 BCE 上

    (E)○

    故選(C)(E)'
