- id: doc_112_台北_明倫_數學_數B_g11s2e1_s3_1
  section: 3
  number: 1
  type: multiple
  page: 4
  stem: 已知空間中一點 P 至 x 軸，y 軸，z 軸的距離分別為$\sqrt{41}$，$\sqrt{34}$，5，若點 P 在第一卦限，請選出下列正確的敘述。
  options:
  - label: A
    content: P（3，5，4）
  - label: B
    content: P 至原點的距離為$5\sqrt{2}$
  - label: C
    content: P 在 xy 平面上的投影為（3，4，0）
  - label: D
    content: P 在 yz 平面上的投影為（0，4，3）
  - label: E
    content: P 在 xz 平面上的投影為（3，0，5）
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '設 P（a，b，c），其中 a，b，c＞0

    $\begin{cases}P 到 x 軸距離為 \sqrt{41} \\ P 到 y 軸距離為 \sqrt{34} \\ P 到 z 軸距離為 5\end{cases}$⇒$\begin{cases}\sqrt{b^{2}+c^{2}} =\sqrt{41} \\ \sqrt{a^{2}+c^{2}} =\sqrt{34} \\ \sqrt{a^{2}+b^{2}} = 5\end{cases}$⇒$\begin{cases}b^{2}+c^{2} = 41 \cdots \cdots \cdots \cdots \cdots \cdots ① \\ a^{2}+c^{2} = 34 \cdots \cdots \cdots \cdots \cdots \cdots ② \\ a^{2}+b^{2} = 25 \cdots \cdots \cdots \cdots \cdots \cdots ③\end{cases}$

    由$\frac{①+②+③}{2}$得 $a^{2}$＋$b^{2}$＋$c^{2}$＝50 ………………………………………④

    由④－①得 $a^{2}$＝9 ⇒ a＝3

    由④－②得 $b^{2}$＝16 ⇒ b＝4

    由④－③得 $c^{2}$＝25 ⇒ c＝5

    (A)╳：P（3，4，5）

    (B)○：P 至原點的距離為$\sqrt{3^{2}+ 4^{2}+ 5^{2}}$＝$\sqrt{50}$＝$5\sqrt{2}$

    (C)○

    (D)╳：（0，4，5）

    (E)○

    故選(B)(C)(E)'
