  stem: 設$\varphi$＝$\frac{1 +\sqrt{5}}{2}$，試選出所有與$\varphi$相等的選項。（已知$\sqrt{5}\approx$2.236）
  options:
  - label: A
    content: '1.62'
  - label: B
    content: $\frac{1}{\varphi}$＋1
  - label: C
    content: 1－$\varphi^{2}$
  - label: D
    content: $\frac{1}{\varphi - 1}$
  - label: E
    content: 以上皆是
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\frac{1 +\sqrt{5}}{2}\approx\frac{1 + 2.236}{2}$＝1.618$\neq$1.62

    (B)○：$\frac{1}{\frac{1 +\sqrt{5}}{2}}$＋1＝$\frac{2}{\sqrt{5} + 1}$＋1＝$\frac{2 (\sqrt{5} - 1 )}{(\sqrt{5} + 1 ) (\sqrt{5} - 1 )}$＋1＝$\frac{\sqrt{5} - 1}{2}$＋1＝$\frac{1 +\sqrt{5}}{2}$＝$\varphi$

    (C)╳：1－$\left( \frac{1 +\sqrt{5}}{2} \right) ^{2}$＝1－$\frac{6 + 2\sqrt{5}}{4}$＝1－$\frac{3 +\sqrt{5}}{2}$＝$\frac{-1 -\sqrt{5}}{2}$＝－$\varphi$

    (D)○：$\frac{1}{\frac{1 +\sqrt{5}}{2}- 1}$＝$\frac{1}{\frac{-1 +\sqrt{5}}{2}}$＝$\frac{2}{\sqrt{5} - 1}$＝$\frac{2 (\sqrt{5} + 1 )}{(\sqrt{5} - 1 ) (\sqrt{5} + 1 )}$＝$\frac{1 +\sqrt{5}}{2}$＝$\varphi$

    故選(B)(D)'
