  stem: '【資料一】高麗成宗（981 ～ 998 年在位）重臣崔承老（927 ～ 989）說：「華夏之制，不可不遵，然四方習俗，各隨土性，似難盡變（中國的制度不能不遵守，但是四方習俗，各有其本土性，似乎也很難完全改變）。其禮樂詩書之教，君臣父子之道，宜法中華，以革卑陋（禮樂詩書之教，君臣父子根本之道，應效法中國，革除陋習）。其餘車馬、衣服、制度，可因土風（可以配合當地風俗），使奢儉得中，不必茍同（適度增減折衷，不必要求一定要和中國一樣）。」

