  stem: 「過去越南語跟漢語為不同語言系統，使用漢字記載越南語十分不便，故字喃在漢字基礎上發展而成，用來記錄越南語。然而字喃的寫法多樣而欠缺統一，使得學習、使用上十分不便，縱使在阮朝時曾有大臣提出以字喃作為官方文字，也未能落實。直到法國殖民時期，在法語以及拉丁文的教育政策與文化霸權的影響下，字喃、漢字的書寫系統逐漸凋零，直至 1945 年越南共和國確立以拉丁文書寫系統為『國語』，才結束字喃的歷史。」根據這段文章與所學知識，下列敘述何者正確？
  options:
  - label: A
    content: 字喃因推行科舉考試而創造
  - label: B
    content: 字喃書寫不易，未能發展本國文學作品
  - label: C
    content: 字喃因異體字繁多，於阮朝時被放棄
  - label: D
    content: 字喃不易學習，未能取代漢字
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
