- id: doc_112_新北_新北高中_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 《史記．○○列傳》中，記錄了不少地方領袖，他們能號召或動員地方百姓，容易引起官方的關注，甚至不為政權所容忍，進而受到打擊。這是專制政府的特點之一，不容許社會有強大的團體或組織，侵犯政府的權威。社會力量必須在官方掌控之下，才有發展的可能性。○○應該填入：
  options:
  - label: A
    content: 僧侶
  - label: B
    content: 食貨
  - label: C
    content: 社團
  - label: D
    content: 游俠
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: ○○為地方領袖，能號召或動員地方百姓，因此不為政權所容忍，應為(D)游俠。(A)(C)在漢代並非地方領袖，(B)泛指財政經濟之事，亦非地方領袖。
- id: doc_112_新北_新北高中_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 清朝乾隆皇帝南巡到蘇州時，曾臨幸范仲淹祠堂，為其賜名「高義」。根據歷史知識，我們對皇帝出巡的理由，以下何者看法「不正確」？
  options:
  - label: A
    content: 乾隆此舉在嘉許范氏，並讚揚其體恤同宗的義行
  - label: B
    content: 義莊與族田的構想最早源自於范仲淹
  - label: C
    content: 范氏的行為受到明清時期官方的認同，且認為具有穩定地方秩序的作用
  - label: D
    content: 因為范氏在當時是高官大族，宗族力量高於朝廷，乾隆希望藉此籠絡范氏宗族，並鞏固滿人政權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(D)清初漢人地位不高，范氏不可能是高官大族，宗族力量亦不可能高於朝廷。

    7.8 世紀中葉的越南北部仍屬中國唐朝的領土，因此(B)為正解。(A) 19 世紀末受法國殖民統治後。(C)《太上感應篇》為明清時期的道教勸善書，8 世紀中葉尚未出現。(D)此時越南北部尚未脫離中國自立王國。

    8.祠堂為祭祀祖先的場所，也是宣導和執行族規之地，亦用議事宴飲的功能，還可作為私塾使用，故答案為(B)。(A)此為族田的功能。(C)以祭祖收族為主，與宗教信仰較無關聯。(D)民間祠堂商議的應為宗族內部之事，非國家軍國大事。

    9.資料一主張禮樂詩書之教、君臣父子之道應效法中國，但其餘車馬、衣服、制度等不必苟同。資料二主張教育原則以孔子為主、大中至正之教學，但「我邦獨立之精神」亦無可愧恥。綜合兩則資料，都主張以中國文化為依歸，但可以配合本土文化，(C)為正解。

    10.(A)為正解。(B)道教信徒各階層皆有。(C)應是從多元分歧逐漸走向整合融會。(D)應是從神仙理論逐漸走向融通佛儒。

    11.(A)中國古代並未建立金融資料。(B)在中央集權下由中央派任地方官員。(C)封建制度係分裂領土與政權，與中央集權作法相反。(D)由中央調派軍隊駐紮地方，即有嚴密且直接控制之意，是為正解。

    12.(A)為正解。(B)藉由宗法血緣關係。(C)除了天子是永遠的大宗外，其餘諸侯以下則兼具大宗與小宗雙重身分。(D)此為西周封建體系下的宗法制度。

    13.選項中僅(A)日本屬於「東亞文化圈」，曾實施過科舉制度。

    14.城牆與壕溝不同，需動員大量的勞力與物力方可完成，代表強有力的統治者權威，故被視為國家起源的標誌，(C)為正解。

    15.「文帝行璽」金印為南越國文帝生前的皇帝璽印，(B)為正解。(A)南越國文帝，非中國漢文帝。(C)南越國趁秦末大亂時自立，此印並非中國王朝所賜與，況且中國王朝賜與藩屬國的金印會使用「王」而非「帝」。(D)金印文字以小篆體書寫，可見受到中國文化之影響。

    16.選項中僅(A)西來庵事件是利用宗教信仰為號召的民變。(B)(C)(D)三者皆與諸侯藩王有關，非一般民變。

    17.秦末大亂，位於南方邊陲的南越即自立為國。迨中原政權底定後，南越再度歸降中原政權，因此(C)的解釋最適宜。(A)南越政權歸順成為漢代的藩屬國，即不再是「天有二日」。(B)題文資料無法判讀。(D)漢朝與南越國互派使者與通市，即是承認其政權的合法性。

    18.題文題示兩漢時期人民旅行時必須攜帶的通行文件，內容除了詳細登錄個人所有資訊外，並經過嚴格審核後才發行，足見漢帝國掌握人口動向所仰賴的即是這些詳實的文件資料，答案為(B)。

    19.司馬遷以漢人的角度看待匈奴，只覺匈奴貴壯賤老、報寡嫂為野蠻無禮。從匈奴接待者的回覆，即可推知在草原上貴壯賤老、報寡嫂有其社會功能的必要性，因此(C)為正解。(A)(B)(D)匈奴自身無文字，後人僅能從漢朝的記載了解匈奴歷史，但也應考慮漢與匈奴的敵對立場，因此《史記》的記載有其事實依據，但並非完全符合史實。

    20.東漢緱氏縣侍廷里居民的作法，類似南宋的(C)義役，透過集資僱人代役以達成「平均賦役」，是當時救助貧困的實際做法之一。

    21.(A)貴族分為文人與武人，稱作「兩班」。(B)重視名分，貴族靠科舉或蔭任取得官職，不可能自由選擇經商或務農。(C)崇尚儒家文化，科舉亦以儒家經典為主。

    22.中國中央官制的演變，從秦漢三公制、隋唐三省制到明清內閣制，宰相從獨相、多相到無相的發展，可知(B)時代愈晚，宰相權力愈小。

    23.土斷政策初實施時，原為解決國家財政問題而將南渡的北方僑民納入徵稅對象，竟意外消弭南北人民之間的矛盾與隔閡，促成南北族群融合，答案為(B)。(A)南渡者均為漢人，無混入胡族。(C)將南渡僑民納入徵稅對象。(D)與史實不符。

    24.陶弘景的著作為《神農本草經集注》，(C)為正解。

    25.資料一說明行會以壟斷市場為職志，因此「官方將行會納入管控」。資料二提及朝鮮的市廛商人需獲得官方營業許可，江戶幕府亦規定人民世襲家業，市場管理權由大名所控制。綜合兩則資料，可知無論中國、朝鮮或日本的商人，均受到官方的控管，(A)為正解。

    26.從題文來看，胥吏與役人均需靠著額外的收入才能維生。(A)儒學與維生無關。(C)為非低階公務員所能取得的高價物品。(D)與題文的「無償性義務」說法不符，因此最可能的答案為(B)糧食穀物。

    27.資料所述為帝王毀佛情形，從還俗僧尼人數與收大量膏腴上田來看，可看出當時佛教與寺院經濟興盛的概況，答案為(B)。(A)(D)資料為唐武宗時期的毀佛，僧侶均被迫還俗。(C)從兩稅戶擴充與收膏腴上田數來看，佛教確實已嚴重影響國家稅收。

    28.(A)為正解。(B)郡縣兵權在中央，封建兵權在地方。(C)封建賦稅收入歸地方領主。(D)郡縣長官由中央直接派任，兩者並無權利與義務的契約關係。

    29.從「廣東、福建地狹人稠、生計艱難」一句，可知○○指人口成長。從「大批人群離鄉背井……來到陌生地方」段落，可推知□□應為移民，故答案為(C)。

    30.(C)武士道為日本幕府時期武士階層的道德規範，講究義、勇、仁、禮、誠、名譽、忠義、克己等美德，最重要的是背負責任與完成責任，題文中的大石復仇行為即符合此精神。(A)(B)並不鼓勵斬殺復仇行為。(D)彌勒轉世係為救世，與個人復仇無關。

    31.(A)兩稅法為唐德宗時所創。(B)為正解。(C)均田制已破壞，政府不再授田。(D)相較於租庸調法，兩稅法被視為較簡便與公平之法，且從人身稅轉為較進步的資產稅，並非愚民政策。

    32.明初發行紙鈔，易造成通貨膨脹，幸中葉後歐洲人展開(C)地理大發現，透過貿易將大量白銀流入中國，因此才廢除紙鈔，改行銀銅雙本位制。

    33.(A)新羅、高句麗、百濟先後建國。(B)為正解。(C)唐初，太宗曾數度派軍進攻高句麗未果。(D)統一新羅之後，朝鮮半島再度分裂為三個政權，稱為後三國時代。

    34.(B)漢武帝將烏桓從東北遷入遼西，目的在使之與匈奴隔離，為漢偵察匈奴動靜，與漢朝的統治正當性無關。

    35.明代廢相後，以內閣大學士代為協調輔政。清雍正時設立軍機處，漸取代內閣職權。清末庚子新政後欲仿日本的君主立憲政體，於 1911 年廢除內閣與軍機處，改設內閣總大臣，答案為(A)。

    36.「三武之禍」指北魏太武帝、北周武帝與唐武宗的毀佛事件，正確答案為(C)。

    37.從商鞅變法到漢代對官文書的管理規範，目的皆在(C)樹立中央統治權威，不容出錯與冒犯。(A)(B)(D)題文僅提及官方文書的管理規範，與箝制人民思想、經濟物資流通、官僚任命等並無相關。

    38.(A)為方便平民接收訊息，應使用諺文而非漢字。(B)為正解。(C)豐臣秀吉入侵時，朝鮮向明帝國求援，在明軍支援下順利擊退日本軍隊。(D)控制大量土地和人口者皆為兩班貴族，非低級官員。

    39.(A)(B)(D)皆是中央集權國家所使用的制度，僅(C)宗法制度為鞏固封建政策的設計。

    40.(A)為正解。(B)(C)科舉考試範圍取自儒家經典，與宗教信仰發展無關。(D)考生並無身分階級的限制，因此有助於文人政治發展。

    41.(A)為正解。(B)東晉謝玄招募的北府兵，性質與唐代府兵不同。(C)府兵為西魏宇文泰所創，沿用至唐代中期。(D)應是安史之亂後。

    42.(A)行會於唐代已形成。(B)經營錢莊的是山西商人。(C)明代同鄉商人組成的商業性組織稱為「會館」。

    43.(C)商鞅變法規定成年男子必須與父母分家，因此小家庭成為社會的主流。(A)指將民戶編輯成冊、(B)(D)為宋代重建宗族組織之法，三者皆不會強迫成年男子與父母分家。

    44.東漢的父老僤、南宋的社倉皆為(B)民間鄉里互助組織。(A)從「鄉里」、「社里」可知並非宗族組織。(C)(D)兩者皆是當地居民組成的互助團體，並非外地人的同鄉會或是地方商業組織。

    45.與封建制度的地方分權不同，郡、縣長官皆由(D)中央政府直接任命派官，有助於中央集權。

    46.(A)從題文中無法判斷。(B)越南亦有不少以字喃書寫的文學作品。(C)阮朝曾欲以字喃作為官方文字，並未放棄。

    47.兩則資料皆提及義田是「養濟群族之人」、「公於族者」，因此可知其屬性為賑恤宗族的慈善事業，答案為(B)。(A)與宗教無關。(C)從題文中無從判斷。(D)以義田收入救濟貧窮族人，非使人人都有田產。

    48.(甲)資料說明東漢察舉制已出現舞弊情形；(乙)資料有「中正官」，應為魏晉南北朝的「九品官人法」；(丙)資料的謄錄規定，是宋代科舉的防弊措施之一；(丁)資料指出明清八股取士的弊端。依時代順序排列為(A)(甲)(乙)(丙)(丁)。

    49.引清兵入關，投降成為清朝藩王者為(B)吳三桂。

    50.(A)為正解。(B)(D)明清為加強對宗族的控制，修改律法賦予族長司法的權力，使其管理宗族並能協助地方推行政務，地方宗族勢力不可能凌駕國家之上。(C)應是明清時期。'
