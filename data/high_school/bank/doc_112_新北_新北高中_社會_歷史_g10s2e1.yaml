  stem: '資料一：傳統中國工商業性質組織的行會，大致形成於唐代，宋代趨於成熟。形成與發展的原因，唐代市場貿易活絡，有些商人組成行會，以壟斷市場為志，照顧「行戶」（行會成員）們的利益。日後，官方將行會納入管控，並委之物資採購的責任，如供應官方的糧食及布帛；還有輪流當差的義務，以協助政府統治。

    資料二：隨著商業與手工業發展，朝鮮王朝在大城市設立官方指定的交易市場，泛稱「市廛」。市廛設有行會，領導人稱為「行首」。市廛商人從官府獲得經營商品的許可，行首有向官方提供物資的義務。江戶幕府為維持社會穩定，規定人民必須世襲家業，不可更換職業。社會階層從上到下，分為士（武士）、農、工、商、穢多（賤民）等。在江戶幕府初期，市場管理權由大名所控制，商人較難有自主權，這情況到了晚期才有所改變。

    請問下列何者說明正確？'
  options:
  - label: A
    content: 兩段資料都說明官方控管商人組織
  - label: B
    content: 兩段資料都在說明商人已經擺脫官方管控
  - label: C
    content: 資料一：受官方控管；資料二：不受官方控管
  - label: D
    content: 資料一：不受官方控管；資料二：受官方控管
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
