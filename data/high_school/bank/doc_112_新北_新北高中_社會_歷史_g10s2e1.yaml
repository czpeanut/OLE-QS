- id: doc_112_新北_新北高中_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關佛教在南北朝的發展情形，下列相關敘述何者正確？
  options:
  - label: A
    content: 佛教大為衰敗，出家為僧的人寥寥可數
  - label: B
    content: 佛教寺院占有大片土地，經濟實力日益強大
  - label: C
    content: 北魏孝文帝時下令坑殺沙門，燒毀經像
  - label: D
    content: 梁武帝時強迫僧侶還俗，並將寺院土地收歸國有
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)佛教在南北朝時受到帝王權貴與世家大族崇奉，政治與經濟實力強大。(B)為正解。(C)應是北魏太武帝。(D)梁武帝篤信佛教，寺院經濟更為充實。
- id: doc_112_新北_新北高中_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 關於東晉政府所實施的土斷政策，下列敘述何者正確？
  options:
  - label: A
    content: 對象為北渡的中原移民
  - label: B
    content: 對象是位高權重的南方世族
  - label: C
    content: 政府希望以當時出生地為戶籍
  - label: D
    content: 實施後增加了政府稅收
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)土斷政策的對象應是南渡的中原移民。(C)以現居住為戶籍，政府即可按戶籍收稅，因此增加了政府稅收，答案為(D)。
- id: doc_112_新北_新北高中_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 越南受中國文化影響深遠，其陳朝考試制度也與中國科舉制度相似，甚至發展出本土化特色，關於越南陳朝科舉制度的描述，下列何者正確？
  options:
  - label: A
    content: 陳朝推行科舉制度，選拔人才，武官制度因而穩定
  - label: B
    content: 曾實行儒、佛、道三教考試
  - label: C
    content: 在文化發展上，參考漢字，另造「訓民正音」
  - label: D
    content: 發展本國詩文，提高民族自尊心。但本土語言學習容易，慢慢取代漢學的地位
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)科舉制度選拔出來的人才屬於文官。(B)為正解。(C)創造「字喃」，「訓民正音」為朝鮮世宗所頒布。(D)與歷史事實不符。
- id: doc_112_新北_新北高中_社會_歷史_g10s2e1_s1_4
