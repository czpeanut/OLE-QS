  type: single
  page: 1
  stem: 公民課堂上，學生針對國家對於人民權益造成之損害應負何種法律責任，以下的討論，何人答案最正確？
  options:
  - label: A
    content: 路路：社會治安日益敗壞，因犯罪行為而受重傷的被害者，可聲請國家賠償
  - label: B
    content: 昱璇：二二八受難者因戰後社會的特殊性，導致歷史悲劇發生，屬損害補償
  - label: C
    content: 蕭氏：高雄發生氣爆案，政府針對當地居民的特別犧牲，主動提出國家補償
  - label: D
    content: 小喬：民間古厝因具有歷史文化與藝術價值，被政府限建屬於特別犧牲原則
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是申請犯罪被害人補償，屬社會補償之一種。(B)《二二八事件處理及賠償條例》立法目的為處理二二八事件（以下簡稱本事件）賠償事宜，落實歷史教育，釐清相關責任歸屬，使國民瞭解事件真相，撫平歷史傷痛，促進族群融合，特制定本條例。可知此事件屬於國家賠償。(C)因相關政府行政人員有所疏失，故屬國家賠償。
