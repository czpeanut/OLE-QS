- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 彰化縣政府發布新聞稿，表示位於彰化縣鹿港鎮的「打鐵厝產業園區」環評通過，進入實質開發程序。然而當地居民卻表示堅決反對，「反打鐵厝產業園區自救會」表示已委託環境權保障基金會律師，向臺中高等行政法院提起行政訴訟。反對者表示，產業園區緊鄰社區、健康有機園區、自來水淨水場和自來水抽水井，且該地區為高度土壤液化區，不應作為產業園區開發之用。況且鹿港鎮是目前整個彰化縣工業土地閒置率最高的鄉鎮，閒置工業地達 51 筆占 38.06 ％，打鐵厝產業園區根本不具開發的必要性和公益性，政府執意開發的動機啟人疑竇。彰化縣政府表示一切為依法核定，打鐵厝產業園區開發決策過程合法，此政策也有助於產業的升級，是地方重要的經濟開發建設。請問關於上述報導所牽涉到的行政程序原則，以下何者說明最為合理？
  options:
  - label: A
    content: 反對者認為此開發決策違反「實質正義」，彰化縣政府則強調決策符合「程序正義」
  - label: B
    content: 反對者認為彰化縣政府強制推動該園區的開發，已經違反行政程序的「公開原則」
  - label: C
    content: 由上可知，該園區開發案的決策過程缺乏當地居民之參與，因而違反「民主原則」
  - label: D
    content: 該園區開發涉及多方利益，彰化縣政府應「主動迴避」，避免參與此開發案之核定
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)反對者認為開發的目的正當性不足，違反實質正義；而縣政府強調決策過程合法，符合程序正義，為正確敘述。(B)此與公開原則無關。(C)由文中無法看出縣政府未給民眾參與的機會，無法判斷是否違反民主原則。(D)本題中彰化縣政府為計畫執行者，不為主動迴避的規範對象。
