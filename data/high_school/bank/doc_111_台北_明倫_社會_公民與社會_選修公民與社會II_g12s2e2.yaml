  stem: 幾年前南投縣臺電武界水壩，第六號水閘門異常開啟放水，導致下游溪床的野營民眾被沖走而釀成 4 死悲劇，家屬欲提出國家賠償，引發正反兩方熱議。倘若申請國家賠償要成立，請問下列哪項「不是」必備的條件？
  options:
  - label: A
    content: 負責單位怠於行使職務
  - label: B
    content: 負責單位執行公權力有過失
  - label: C
    content: 事件造成民眾有特別犧牲
  - label: D
    content: 公共設施設置或管理有所欠缺
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《國家賠償法》第 2 條：「公務員於執行職務行使公權力時，因故意或過失不法侵害人民自由或權利者，國家應負損害賠償責任。公務員怠於執行職務，致人民自由或權利遭受損害者亦同。」《國家賠償法》第 3 條：「公共設施因設置或管理有欠缺，致人民生命、身體、人身自由或財產受損害者，國家應負損害賠償責任。」(A)(B)(D)皆符合，故僅有(C)事件造成民眾有特別犧牲不為其要件。
