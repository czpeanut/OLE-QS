  answer_status: verified
  answer_source: answer_key
  explanation: 契約自由即每一個人均得以其獨立而自由之人格，在社會生活中，基於其意思之自主而締結或不締結契約，藉以處理或管理自己之私人生活。本題中上敏自行決定交易的對象及方式等，即屬於(A)契約自由的範疇。
