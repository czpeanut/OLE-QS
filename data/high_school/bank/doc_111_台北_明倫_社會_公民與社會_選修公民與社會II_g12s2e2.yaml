  stem: 關於上文中大法官針對「事前申請核准」合憲性的分析，下列何者敘述最為正確？
  options:
  - label: A
    content: 文化權為憲法所保障，惟為兼顧野生動物保育，狩獵行為需有法律授權，故事前核准制度符合法律保留原則
  - label: B
    content: 採事前核准制為對原住民族文化權的最低侵害，而此侵害與生態保育維護相較又未顯失衡，故符合比例原則
  - label: C
    content: 生態保育固然重要，原住民族文化存續亦不容忽視，故原住民狩獵行為事前核准制符合優惠差別待遇的原則
  - label: D
    content: 狩獵為原住民族傳統文化，事前申請核准制係為確保原住民族從事安全合法之狩獵活動，符合誠實信用原則
