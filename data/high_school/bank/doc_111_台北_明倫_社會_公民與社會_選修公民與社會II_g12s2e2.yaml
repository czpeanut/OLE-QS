  stem: 國防部預備軍士官班招生簡章規定「曾受刑之宣告者不得報考」，但大法官認為，若因疏忽而觸法，與故意犯罪之惡性不同，且其過失情節輕微者，難認其必然欠缺應具備之服役品德、能力而影響國軍戰力。該規定剝奪其擔任軍職的機會，非屬達成目的之最小侵害手段，且與《憲法》保障人民服公職之權利意旨不符。關於此案例以下敘述何者正確？
  options:
  - label: A
    content: 大法官認為該規定牴觸法律保留原則
  - label: B
    content: 大法官認為該規定侵害了人民的工作選擇權
  - label: C
    content: 大法官認為該規定牴觸正當程序原則
  - label: D
    content: 大法官認為該規定侵害人民的服公職權利
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「該規定剝奪其擔任軍職的機會，非屬達成目的之最小侵害手段，且與《憲法》保障人民服公職之權利意旨不符」，可知此作為已違反比例原則，且侵害民眾服公職之權利，故選(D)。
