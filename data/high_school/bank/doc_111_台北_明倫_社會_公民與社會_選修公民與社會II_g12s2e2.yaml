  stem: 根據相關公民知識判斷，針對選文畫線處的措施，政府最有可能的考量是什麼？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 信賴保護原則
  - label: C
    content: 平等原則
  - label: D
    content: 明確性原則
  group_stem: '在 2023 年 1 月，立法院三讀通過了《菸害防制法》條文修正案。根據新版條文，製造、進口、販售、供應、廣告以及使用電子菸將一律被禁止，並且違者將受到罰款，包括業者和吸菸者。也就是說，當新法生效後，電子菸將會被全面禁止，不能販售和使用。至於加熱菸，只要被中央主管機關公告為指定菸品，無論是製造或輸入，都必須進行「健康風險評估」審查。此外，菸品包裝上的警示圖文面積將從原本的 35 ％增加至至少 50 ％。電子菸和加熱菸的修正條文預計在新法公告一個月後生效，<u>而警示圖文則預計在公告一年後正式實施</u>。

    新法規定的最嚴格部分是「全面禁止」電子菸的條文，引起了不少爭議。支持者認為，電子菸是一種比較「好入門」的產品，因為它沒有傳統紙菸燃燒的臭味，常常添加香味，讓吸菸者誤以為這種菸比較健康。此外，電子菸的味道也比較難聞到，周圍的人可能會吸入二手菸而不自知。因此，他們認為「全面禁止」是比較理想的做法。反對者則認為，現實情況是電子菸已經非常普及，需求量很大，比起「全面禁止」，「納管」可能是比較好的做法。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「公告一年後正式實施」是為了讓民眾知道法律規範後，得以在這段時間做相應的行為處置，以免在法令更動前後，侵害人民的權益，此符合(B)信賴保護原則的概念；人民因信賴特定行政行為所形成之法秩序，而政府安排其生活或處置其財產時，不能因為嗣後行政行為之變更而影響人民之既得權益、使其遭受不可預見之損害。
