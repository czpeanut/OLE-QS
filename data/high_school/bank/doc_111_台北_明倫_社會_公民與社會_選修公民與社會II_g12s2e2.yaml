  stem: 臺中市某高中學生因無照騎乘機車被校方記大過一次，該生向學校提出申訴未果，遂嘗試提起行政救濟，但卻遭行政法院駁回其訴。該生向大法官聲請解釋憲法，司法院大法官在 2019 年 10 月作出《司法院釋字第 784 號解釋》，解釋文中提到：「本於《憲法》第 16 條保障人民訴訟權之意旨，各級學校學生認其權利因學校之教育或管理等公權力措施而遭受侵害時，即使非屬退學或類此之處分，亦得按相關措施之性質，依法提起相應之行政爭訟程序以為救濟，無特別限制之必要。」根據前述，關於《司法院釋字第 784 號解釋》的內容，下列詮釋何者最為適當？
  options:
  - label: A
    content: 僅有類似退學這種「足以改變學生身分」的處分，才有可能會侵害到學生的權利
  - label: B
