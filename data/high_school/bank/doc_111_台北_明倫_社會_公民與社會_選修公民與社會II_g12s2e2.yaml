  group_stem: '《學位授予法》規定：凡修滿應修學分，經考核成績及格者，即應授予學士學位。某國立大學三名原本符合畢業資格的應屆學生，因抗議學校對學生機車入校違停罰錢之不合理規定拒繳罰錢，遭校方以未能辦完離校手續而扣留畢業證書。

