- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 7
  stem: 根據上文判斷，請問布農族獵人 Talum 的釋憲案的聲請人屬下列何種？
  options:
  - label: A
    content: 法官聲請
  - label: B
    content: 法人聲請
  - label: C
    content: 政黨聲請
  - label: D
    content: 人民聲請
  group_stem: '布農族獵人 Talum（王光祿）上山打獵而遭判刑 3 年半定讞，理由是他所持的獵槍是撿到的，不符合「自製槍枝」的定義，無法適用例外不罰之規定；其狩獵的山羌、長鬃山羊是保育類動物，故違反《野生動物保育法》。此案件引起社會關注，在檢察總長顏大和援引聯合國《原住民族權利宣言》提起非常上訴得以轉圜，Talum 暫停入監服刑。2017 年最高法院合議庭裁定王光祿案停止審理，最高法院法官史上首次聲請釋憲，創下最高法院的新紀錄。

    針對該聲請案，大法官做出釋字第 803 號解釋：其中一段《野生動物保育法》第 21 條之 1 第 2 項前段規定：「前項獵捕、宰殺或利用野生動物之行為應經主管機關核准」，所採之事前申請核准之管制手段，尚不違反憲法比例原則。

    原住民族基於傳統文化及祭儀需要獵捕宰殺利用《野生動物管理辦法》第 4 條第 3 項規定：「申請人應填具申請書……於獵捕活動 20 日前，向獵捕所在地鄉（鎮、市、區）公所申請核轉直轄市、縣（市）主管機關核准。但該獵捕活動係屬非定期性者，應於獵捕活動 5 日前提出申請……。」有關非定期性獵捕活動所定之申請期限與程序規定部分，其中就突發性未可事先預期者，欠缺合理彈性，對原住民從事狩獵活動之文化權利所為限制已屬過度，於此範圍內，有違憲法比例原則，應自本解釋公布之日起不再適用。請問：'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從文中第四行「最高法院合議庭裁定王光祿案停止審理，最高法院法官史上首次聲請釋憲」，可得知此釋憲聲請者為(A)法官聲請。
