  stem: 我國《姓名條例》規定，有「字義粗俗不雅、音譯過長或有特殊原因」之情事者，得申請改名，但以 3 次為限。某男大生為響應壽司店推出的免費優惠活動，將自己的名字改為「張鮭魚」，但因為額度用完無法改回原名。如果張鮭魚認為改名 3 次為限的規定不合理，擬透過聲請釋憲爭取他的權益，下列何者為最適合的建議？
