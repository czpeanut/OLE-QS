  explanation: 筠凱先向專利局申請復查，經程序審查受理後，將指定專利審查人員進行實體審查，並將審查結果作成審定書（此為訴願先行程序）；舉發人或專利權人對審定結果不服者，得提起訴願，如不服訴願決定者，得以本局為被告，向智慧財產法院提起行政訴訟，不服智慧財產法院判決者，得向最高行政法院提起上訴，故應選(D)。
