  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)大法官的解釋文並未提及何種處分方式，才會侵害學生之權利。(B)大法官的解釋文無提及比例原則。(C)此釋字針對過往，須為退學或類此處分，才能提起行政爭訟而做出更動；只要是學生權利受侵害皆可提出，為正確敘述。(D)校規不需受到大法官之合憲性審查，僅有在權利受損符合釋憲流程時，才能聲請釋憲。
