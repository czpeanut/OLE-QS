  page: 1
  stem: 知名最新款高階手機缺貨，上敏在官網預購時搶到 2 支，其中 1 支想要轉賣。在蝦皮交易平臺上貼出訊息，有 3 個人立即來信詢問，上敏決定賣給可以到住家附近超商面交的阿中。阿中確認手機沒問題後，上敏要求阿中直接從提款機領取現金給他。請問上述的例子，最適合用以下何種概念作說明？
  options:
  - label: A
    content: 契約自由
  - label: B
    content: 契約正義
  - label: C
    content: 信賴保護
  - label: D
    content: 物權優於債權
  answer:
