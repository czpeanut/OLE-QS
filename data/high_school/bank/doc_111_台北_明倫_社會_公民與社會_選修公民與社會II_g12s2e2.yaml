  stem: 日本吉卜力工作室日前宣布，開放網友使用包含《神隱少女》等動畫作品共計 400 張之劇照，給大家在「常識範圍內」自由使用，引起一陣利用劇照創作的梗圖風。但法律專家建議為避免日後發生爭議，仍應符合《著作權法》「合理使用」之相關規範。請問下列何者屬於合理使用範圍？
