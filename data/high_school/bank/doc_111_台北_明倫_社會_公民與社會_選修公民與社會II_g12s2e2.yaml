  stem: 新聞畫面常將被移送法辦之人臉打馬賽克，讓民眾無法看到容貌，有人認為這是保護壞人，剝奪民眾知的權利。公民老師在課堂詢問學生看法，以下哪位同學的看法較為恰當？
  options:
  - label: A
    content: 甯甯：打馬賽克是基於尊重嫌疑犯的肖像權
  - label: B
    content: 欣妤：為遵守罪刑法定原則，打馬賽克是必要之惡
  - label: C
    content: 姿妤：打馬賽克不妥，《憲法》不須保障罪犯的隱私權
  - label: D
    content: 卓璇：根據法益衡量原則，打馬賽克公益大於私益
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為保障其隱私權。(B)此與罪刑法定原則無關。(C)即使是罪犯，仍須保障其隱私權。
