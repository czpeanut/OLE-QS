  stem: 「行政訴訟堅實第一審新制」於 2023 年 8 月 15 日正式上路，新制度將使得原本分散在 22 所地方法院的行政訴訟庭走入歷史，而北、中、高三所高等行政法院所增設的「地方行政訴訟庭」則開始運作，負責訴訟標的金（價）額新臺幣 150 萬元以下之稅捐、罰鍰或其附帶之裁罰性、管制性不利處分，以及其他公法上財產關係訴訟之第一審。此外，也增設「巡迴法院」讓行政訴訟法官定期至各地方法院審理案件，讓民眾救濟上更為便利。而為健全紛爭解決機制，也擴大行政訴訟和解的範圍，並增訂行政訴訟調解制度，相信除了可以節省訴訟資源外，也能減輕民眾進行訴訟的時間及心力負擔。請問以下何者說明最為符合現行制度？
  options:
  - label: A
    content: 地方行政訴訟庭可審理 150 萬元以下標的之民事訴訟
  - label: B
    content: 普通法院與行政法院負責之訴訟任務界線將更為清楚
  - label: C
    content: 訴訟標的大於 150 萬之行政訴訟一審為最高行政法院
  - label: D
    content: 訴訟標的小於 150 萬之行政訴訟均改由巡迴法院審理
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 原本之行政訴訟制度，較為簡易或爭訟金額較小的案件（簡易訴訟程序事件），會在地方法院行政訴訟庭審理，此次修法後，將地方行政訴訟庭回歸高等行政法院，更能落實普通法院與行政法院分立之雙軌制訴訟系統，故選(B)。(A)無此規定，且民事訴訟由普通法院審理。(C)此屬通常訴訟程序事件，一審由高等行政法院高等行政訴訟庭審理。(D)無此規定。
  tags:
