  stem: 依據「契約自由原則」來看上述契約內容，下列何者敘述恰當？
  options:
  - label: A
    content: 契約自由屬於《憲法》第 22 條列舉所保障之人民權利
  - label: B
    content: 小叮噹可決定將車位出租給何人、租金多寡與收取方式
  - label: C
    content: 小叮噹於契約簽訂後可單方反悔取消，不將車位租給大雄
  - label: D
    content: 雙方當事人對契約無異議即有效成立，任何法律不得干涉
  group_stem: '小叮噹與大雄簽了一份車位租賃契約書如下：

    立契約書人：出租人 小叮噹（以下簡稱甲方）

    立契約書人：承租人 大雄（以下簡稱乙方）

    茲因車位租賃事件，雙方合意訂立本契約，約款如下，以資共同遵守：

    甲方停車位編號，位置：B3-3

    乙方汽車牌號：XXX-1234

    一、租期：民國 110 年 1 月 1 日至民國 110 年 12 月 31 日止總計 12 月。

    二、租金：新臺幣 1,500 元∕月，一次交 6 個月，6 個月總計為新臺幣 9 千元整。

    押金：新臺幣 1 仟元整，搖控器完整歸還甲方後，將此押金退還乙方。

    三、移交物：遙控器 1 個。

    四、車位租賃注意說明：本車位為機械式停車位下層車位，乙方車子在本車位內甲方不負保管之責任。

    五、使用租賃物之限制：

    (一)乙方不得將租賃停車位之一部分或全部轉租、分租、出租或以其他方法變相由他人使用。

    (二)乙方應依本停車場相關單位所訂立之停車位管理辦法使用本件租賃停車位。

    (三)租賃物不得供非法使用或存放妨害公共安全之物品，並嚴禁洗車、嚴禁機車、腳踏車進入停放。

    六、以上契約雙方同意各無反悔，訂立 2 份各執 1 份存照。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)契約自由為個人自主發展與實現自我之重要機制，亦屬《憲法》第 22 條所保障其他自由權利之一，屬於概括人權，非為列舉權。(B)此為契約自由的內涵。(C)契約既已成立，雙方皆需遵守契約內容，不能單方面反悔。(D)契約自由仍不得違反強制及禁止規定，也不能違反公序良俗等規範。
