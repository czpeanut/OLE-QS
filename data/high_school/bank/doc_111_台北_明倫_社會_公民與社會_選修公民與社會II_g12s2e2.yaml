  group_stem: '車輛轉彎、變換車道不打方向燈，是最常被檢舉的交通違規案件項目之一。自 2019 年 10 月 1 日起，車輛未依規定使用方向燈「加重罰鍰」，從原本 900 元至 1,200 元，全面加重為 1,200 元起跳。

    某日汪汪開車時聽到後方有救護車聲響，此時指揮交通的警察，以手勢要求汪汪開車往路旁行駛，以便救護車先行通過。於是汪汪遵守警察手勢，馬上往路旁行駛而未打方向燈。不料，2 週後，汪汪收到變換車道前未打方向燈的相片與罰單，處以 1,200 元罰鍰。汪汪覺得委屈，打算向處罰機關提起申訴。請問：'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「行政處分」就是行政機關就公法上具體事件所為的決定或其他公權力措施而對外直接發生法律上效果的單方行政行為，例如：建築執照核發、命拆除違建、戶籍登記、土地登記、命停止營業及環保、衛生等各類行政罰鍰。因此罰單即屬之，應選(D)。
