- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e2_s1_40
  section: 1
  number: 40
  type: single
  page: 8
  stem: 上文提到「精神慰撫金」的概念，下列有關其內涵之敘述，何者正確？
  options:
  - label: A
    content: 僅被害人可以向加害人請求相當數額的金錢賠償作為精神慰撫金
  - label: B
    content: 精神慰撫金有一定計算標準，以被害人精神的痛苦程度核定金額
  - label: C
    content: 小明不小心打破阿嬌的玻璃水壺，阿嬌可向小明請求精神慰撫金
  - label: D
    content: 依一般實務，法院會斟酌當事人雙方學歷、薪資核定慰撫金金額
  group_stem: 3 年前網紅「館長」在他的直播頻道中，用不雅字眼飆罵藝人吳○○並嗆「你連屁都不如嘛」等語，館長依公然侮辱罪判拘役 58 天，可易科罰金確定；吳○○提起民事求償 200 萬並要求館長道歉，最高法院認定，館長侵害吳的名譽，判他須賠償吳○○精神慰撫金 80 萬確定。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依最高法院 85 年度台上字第 460 號判決︰「按慰藉金之多寡，應斟酌雙方之身分、地位、資力與加害之程度及其他各種情形核定相當之數額；其金額是否相當，自應依實際加害情形與被害人所受之痛苦及雙方之身分、地位、經濟狀況等關係決定之。」故選(D)。(A)假設車禍被害當事人不幸身亡，則根據《民法》第 194 條，不法侵害他人致死者，被害當事人的「父、母、子、女及配偶」雖非財產上之損害，亦可請求精神賠償（慰撫金）。(B)不只有考量被害人的痛苦程度。(C)此為財產權之侵害，非人格權，無法主張精神慰撫金。
