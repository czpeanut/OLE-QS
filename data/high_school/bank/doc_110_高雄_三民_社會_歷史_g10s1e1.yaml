  group_stem: '(簡答2) 械鬥是各種勢力衝突產生的結果，也往往在生活中留下各種不同痕跡，例如：(甲)板橋大眾廟；(乙)鹿港隘門；(丙)臺中土牛民番地界碑；(丁)苗栗泉漳和睦碑記。請問上述哪個遺存與械鬥較無關？為什麼？(簡答)

    ◎靜佳在撰寫臺灣原住民族相關的期中報告，找到三則相關資料： 資料一：此原住民族以火耕方式耕作旱稻；害怕大海，不會泛舟，只在溪澗捕魚；女子有繼承權。 資料二：長老……只有在部落中有難事待決時，才會召集族人到公廨討論。……長老的另一項職責是監督族人遵守祭司（Inibs，又稱尪姨）的指示，以防止有人因不遵守規定而觸怒神明。……此原住民族祭拜的神有兩類，婦女崇拜農業神，男性則崇拜戰神。 資料三：「尪姨」所做的宗教儀式為：請神和獻神，是被神靈附身的神人溝通者……獻上供品後，尪姨會開始唸長咒召請神靈。她們開始轉動眼珠，並倒在地上大叫，這時便代表有神靈附身，……這種儀式就在公廨中公開舉行。尪姨不只在族群的宗教上扮演重要角色，個別家庭如果遇到任何困難，他們會請尪姨到家裡做法……尪姨甚至能預測天氣好壞。'
