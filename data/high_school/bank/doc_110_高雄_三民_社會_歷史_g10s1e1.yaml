  group_stem: '(簡答1) 從資料一到資料二的時間相距年餘，日方之所以再度掀起事端，是依據何種理論作為出兵藉口？(簡答)

    ◎小明來到臺北市大稻埕著名的觀光景點霞海城隍廟，他看到寺廟旁的石碑記載「漳泉民鬥」的事蹟。小明後來發現碑文中的「漳泉民鬥」便是知名的頂下郊拼，他整理衝突爆發的過程和原因如下：「械鬥雙方為同屬泉州府的同安人和三邑人，但同安人因為原鄉的地理位置較接近漳州，在漳泉械鬥之中較不積極援助三邑人，引起三邑人不滿。另一方面，以同安人為主的下郊，與三邑人的頂郊為了爭取艋舺碼頭的貿易權利，時常發生衝突。加上同安人奉祀霞海城隍，並未加入三邑人龍山寺的信仰圈，埋下衝突遠因。因此所謂漳泉民鬥，其實應該說是泉州人內部的利益爭奪。」'
