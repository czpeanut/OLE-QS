    ◎資料一：劉家謀(1814～1853)的<u>海音詩</u>記載，吳鳳是蒲羌林十八社的通事，每當要殺阿豹厝人的時候，他請求緩期並想辦法讓阿豹厝人順利逃走，被憤怒的原住民發現後殺害，死後化身披髮帶劍的形象，他經過之處原住民多染疾患，原住民在畏懼下不再殺人並且定期祭拜吳鳳。 資料二：原住民每當要祭祀的時候便會殺人，有天原住民急索人，吴鳳嚴厲地說：「殺人的人是不受王法赦免的，不過既然已和你有約定，我一定會履行。」並向家人告誡辦理後事後赴會：「我將給予我的頭，永絕後患！」原住民發現殺死的人是吳鳳而驚駭。後來有原住民發現吳鳳帶刀馳騁，所經之處瘟疫大作，陸續有死傷的情形，原住民族依巫師的建議祭祀吳鳳，並發誓永不殺人。（節錄自1912年後藤新平<u>阿里山蕃通事吳元輝碑</u>） 資料三：1987年吳鳳鄉的鄒族青年湯英伸自首傷害雇主致死，最終遭到槍决，這個事件因涉及原住民族遭漢族欺壓、歧視和剝削，社會逐漸重視原住民族的處境，並以吳鳳事蹟反思其神話對鄒族人造成的問題，之後嘉義車站前的吳鳳像遭到拆毀，吳鳳鄉也改名為阿里山鄉，同時教育部也刪除推崇吳鳳的相關課文。'
