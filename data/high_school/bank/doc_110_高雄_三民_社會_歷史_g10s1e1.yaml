  stem: 1955年臺灣報導大陳撤離抵臺：「他們為了尋求自由的生活，免為奴役，皆自願地放棄家財，離開生長的土地，追隨政府和擁護政府的决策，到他們所響往的臺灣寶島來重建他們的家庭。他們的堅決行動，表示出他們的反共意志，與共匪偽政權的不得人心。」同時，共産黨<u>人民日報</u>則如此評論：「蔣賊為了實現他劫走大陳等島全部二萬多居民的罪惡目的，曾下令甚至對那些年老重病行動不便的居民也不要放過，要部隊『排除任何困難』、『必須運臺』。但是，儘管有這樣的『命令』，居民們還是堅決表示不願意去臺灣。」請問：我們應該如何理解上述兩段資料？
