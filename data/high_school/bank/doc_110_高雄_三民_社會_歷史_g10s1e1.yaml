  stem: 1867年3月(同治六年)，一艘美國商船在今日屏東觸礁沉沒，遇難船員誤闖排灣族領地而遭當地原住民殺害。美國原欲透過清廷調停，然而清帝國官方的回應卻是「生番向來不歸王化」，因此不願介入，美國最後自行派員與當地原住民簽訂協議，原住民頭目也允諾往後將善待遇難的西方人民。根據上文，請問下列敘述何者正確？
