- id: doc_112_台北_北一女中_數學_數A_g11s1e1_s1_1
  section: 1
  number: 1
  type: fill
  page: 1
  stem: 已知一扇形的周長為 18 公分，所圍的面積為 18 平方公分，則此扇形由兩半徑所夾的角度為 ＿＿＿＿弳。（有兩解）
  explanation: '令半徑 r，角度θ弳

    則$\begin{cases}2r +r\theta = 18\ldots \ldots \ldots \ldots \ldots ① \\ \frac{1}{2}r^{2}\theta = 18 \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由①將 rθ＝18－2r 代入②

    得$\frac{1}{2}r (18 - 2r)= 18$

    $\Rightarrowr^{2}$－9r＋18＝0

    $\Rightarrow$（r－3）（r－6）＝0

    $\Rightarrow$r＝3 或 6

    當 r＝3，代入①得 6＋3θ＝18

    $\Rightarrow$θ＝4

    當 r＝6，代入①得 12＋6θ＝18

    $\Rightarrow$θ＝1

    故 θ＝1 或 4'
- id: doc_112_台北_北一女中_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '對於一個角的大小，我們可以用“弳”與“度”表示。請問下列五個選項中哪一個值最小？

    答：＿＿＿＿。'
  options:
  - label: A
    content: sin1°
  - label: B
    content: cos2
  - label: C
    content: cos3
  - label: D
    content: tan4°
  - label: E
    content: tan5
  explanation: '已知 sin1°，tan4°皆大於 0

    cos2$\approx$cos114°＞cos120°＝$\frac{- 1}{2}$

    cos3$\approx$cos171°＜cos120°＝$\frac{- 1}{2}$

    tan5$\approx$tan285°＜tan300°＝$- \sqrt{3}$

    ∵tan285°＜$- \sqrt{3}$＜－1＜cos171°＜$\frac{- 1}{2}$＜cos114°＜0

    ∴tan5 最小

    故選(E)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '下列選項的函數中，與 y＝tanx 週期<u>不同</u>的是哪一個？

    答：＿＿＿＿。'
  options:
  - label: A
    content: y＝sin（－2x）
  - label: B
    content: y＝｜sinx｜
  - label: C
    content: y＝｜sin2x｜
  - label: D
    content: y＝cos｜2x｜
  - label: E
    content: y＝｜sinx＋cosx｜
  explanation: 'y＝tanx 週期為π

    (A) y＝sin（－2x）週期為$\frac{2\pi}{∣ - 2 ∣}=\frac{2\pi}{2}=\pi$

    (B) y＝｜sinx｜週期為π

    (C) y＝｜sin2x｜週期為$\frac{\pi}{2}$

    (D) y＝cos｜2x｜＝cos2x 週期為π

    (E) y＝｜sinx＋cosx｜週期為π

    故選(C)'
- id: doc_112_台北_北一女中_數學_數A_g11s1e1_s1_4
  section: 1
  number: 4
  type: fill
  page: 1
  stem: '已知△ABC 中，cosA＝$-\frac{5}{13}$，sin（B－C）＝$\frac{4}{5}$，則：

    (1) sin（B＋C）＝＿＿＿＿。

    (2) cos2C＝＿＿＿＿。'
  explanation: '(1) cosA＝cos（180°－（B＋C））

    ＝－cos（B＋C）

    ＝$-\frac{5}{13}$

    $\Rightarrow$cos（B＋C）＝$\frac{5}{13}$

    ∵cosA＝$-\frac{5}{13}$

    ∴∠A＞90°，∠B＋∠C＜90°

    故 sin（B＋C）＝$\sqrt{1 - \left( \frac{5}{13} \right) ^{2}}$＝$\frac{12}{13}$

    (2) ∵sin（B－C）＝$\frac{4}{5}$

    ∴0°＜∠B－∠C＜90°

    $\Rightarrow$cos（B－C）＝$\frac{3}{5}$

    故 cos2C＝cos（（B＋C）－（B－C））

    ＝cos（B＋C）cos（B－C）＋sin（B＋C）sin（B－C）

    ＝$\frac{5}{13}\times \frac{3}{5}+\frac{12}{13}\times \frac{4}{5}$

    ＝$\frac{63}{65}$'
- id: doc_112_台北_北一女中_數學_數A_g11s1e1_s1_5
  section: 1
  number: 5
  type: fill
  page: 1
  stem: 已知$\tan \alpha =\frac{4}{5}$，$\tan \beta =\frac{6}{5}$，試求$\frac{\sin (\alpha -\beta )}{\cos (\alpha +\beta )}$＝＿＿＿＿。
  explanation: '$\frac{\sin (\alpha -\beta )}{\cos (\alpha +\beta )}$＝$\frac{\sin \alpha \cos \beta -\cos \alpha \sin \beta}{\cos \alpha \cos \beta -\sin \alpha \sin \beta}$（上下同除 cosαcosβ）

    ＝$\frac{\tan \alpha -\tan \beta}{1 -\tan \alpha \tan \beta}$

    ＝$\frac{\frac{4}{5}-\frac{6}{5}}{1 -\frac{4}{5}\times \frac{6}{5}}$＝－10'
- id: doc_112_台北_北一女中_數學_數A_g11s1e1_s1_6
  section: 1
  number: 6
  type: fill
  page: 1
  stem: '已知直線 M 的斜率為 m，與直線 L：4x－3y－2023＝0 所夾的銳角為 θ。若 tanθ＝7，則：

    (1) m 的值有＿＿＿＿種可能。

    (2) 若 m 為整數，試求 m＝＿＿＿＿。'
  explanation: '(1) 令直線 M 和 x 軸正向夾α角

    直線 L 和 x 軸正向夾β角

    則 tanα＝m，$\tan \beta =\frac{4}{3}$，且θ＝α－β或β－α

    若θ＝α－β

    tanθ＝tan（α－β）＝$\frac{m -\frac{4}{3}}{1 +m\times \frac{4}{3}}$＝7

    $\Rightarrow$21＋28m＝3m－4

    $\Rightarrow$m＝－1

    若θ＝β－α

    tanθ＝tan（β－α）＝$\frac{\frac{4}{3}-m}{1 +\frac{4}{3}m}$＝7

    $\Rightarrow$21＋28m＝4－3m

    $\Rightarrowm =-\frac{17}{31}$

    故 m 有 2 種可能

    (2) 承(1) ，得知 m＝－1'
