- id: doc_110_高雄_鳳山_數學_g10s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列敘述哪些是正確的？
  options:
  - label: A
    content: 設$C_{2}^{2}$＋$C_{2}^{3}$＋$C_{2}^{4}$＋…＋$C_{2}^{14}$＝$C_{m}^{n}$，則數對 ( n , m)＝( 15 , 3 )
  - label: B
    content: 7200的正因數中為完全平方數的共有12個
  - label: C
    content: 從0 , 1 , 2 , 3 , 4 , 5，六個數字中，取出4個相異數字排成四位數，共可排出$P_{4}^{6}$個四位數
  - label: D
    content: 從5位男生6位女生中，選出5人組成委員會，若至少要選出1位男生及2位女生，則共有$C_{1}^{5}$×$C_{2}^{6}$×$C_{2}^{8}$種選法
  - label: E
    content: 滿足2000＜$C_{1}^{n}$＋$C_{2}^{n}$＋$C_{3}^{n}$＋…＋$C_{n}^{n}$＜10000之正整數n共有3個
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：$C_{2}^{2}$＋$C_{2}^{3}$＋$C_{2}^{4}$＋…＋$C_{2}^{14}$＝($C_{3}^{3}$＋$C_{2}^{3}$)＋$C_{2}^{4}$＋…＋$C_{2}^{14}$＝$C_{3}^{4}$＋$C_{2}^{4}$＋…＋$C_{2}^{14}$＝$C_{3}^{15}$＝$C_{12}^{15}$， 所以數對 ( n , m) 不一定為 ( 15 , 3 )。 (B) ○：7200＝$2^{5}$×$3^{2}$×$5^{2}$ ⇒ ( $2^{2}$×3×5 )$^{2}$，所以$2^{2}$×3×5的正因數個數即為所求， 因此7200的正因數中為完全平方數的個數為 ( 2＋1 )×( 1＋1 )×( 1＋1 )＝12。 (C) ×：因為0不能排首位，所以方法數不為$P_{4}^{6}$。 (D) ×：分類如下 ① 1男4女：方法數＝$C_{1}^{5}C_{4}^{6}$＝75 ② 2男3女：方法數＝$C_{2}^{5}C_{3}^{6}$＝200 ③ 3男2女：方法數＝$C_{3}^{5}C_{2}^{6}$＝150 所以共有75＋200＋150＝425種，因為$C_{1}^{5}C_{2}^{6}C_{2}^{8}$＝2100≠425，因此方法數不為$C_{1}^{5}C_{2}^{6}C_{2}^{8}$。 (E) ○：可知$C_{1}^{n}$＋$C_{2}^{n}$＋$C_{3}^{n}$＋…＋$C_{n}^{n}$＝$2^{n}$－$C_{0}^{n}$＝$2^{n}$－1 ⇒ 2000＜$2^{n}$－1＜10000 ⇒ 2001＜$2^{n}$＜10001 ⇒ n＝11 , 12 , 13。 故選(B)(E)。
