  stem: 下列敘述哪些是正確的？
  options:
  - label: A
    content: 若數據y對x之迴歸直線為y＝－5＋$\frac{3}{7}$x，則x與y為正相關
  - label: B
    content: 若數據x對y之相關係數為0，則其散布圖為鉛直線或水平線
  - label: C
    content: 若數據y對x之迴歸直線的斜率愈大，則x與y之相關程度愈高
  - label: D
    content: 設數據x，y經標準化為x' , y'，且x與y之相關係數為0.68，則y' 對x' 之迴歸直線為y' ＝0.68x'
  - label: E
    content: 在右圖的散布圖中，有五筆數據 ( $x_{i}$ , $y_{i}$ )，去掉B數據之後，剩下的四筆數據相關係數會變大
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_110_高雄_鳳山_數學_g10s2e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 589.0
      - 124.4
      - 676.85
      - 218.45
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：因為迴歸直線的斜率為$\frac{3}{7}$＞0，所以x與y為正相關。 (B) ×：可能呈現左右或上下對稱。 (C) ×：若數據越接近一斜直線，則x與y的相關程度越高。 (D) ○：因為x' 與y' 的相關係數r'＝r＝0.68，所以y' 對x' 的迴歸直線為y'＝0.68x'。 (E) ×：剩下的四筆數據相關係數會變小。 故選(A)(D)。
