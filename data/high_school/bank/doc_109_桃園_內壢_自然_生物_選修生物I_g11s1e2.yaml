    細胞骨架由三種纖維構成，其粗細不同，最粗的是微管（microtubule），最細的是微絲（microfilament），直徑介於兩者之間的是中間絲（intermediate filament）。細胞骨架的功能如下：

    微管的直徑大約為25 nm、為管狀構造，其管壁由球蛋白構成，且長度可以改變，因為微管能組合與拆卸。微管是由微管素（tubulin）所組成，當組裝時，兩個微管素分子合成雙體，再由雙體組合成中空的微管。在許多細胞中，是由接近細胞核的微管架構中樞（microtubule organizing center）調節微管組合，微管從該中樞輻射伸出以強化細胞的形狀，並充當胞器移動的軌道，運輸囊泡由內質網移至高基氏體，也與微管有關聯。細胞分裂時，微管亦與染色體的移動有關。在動物細胞中，微管架構中樞包含互呈直角的兩個中心粒。另鞭毛與纖毛為運動構造，纖毛比鞭毛小得多，但都有相似的結構。真核生物的纖毛與鞭毛是由膜包著基質，基質中有九個微管雙體包圍著中央的兩個微管單體，此即所謂9＋2微管模式，當微管雙體互相滑動時，纖毛與鞭毛即表現運動現象。每個纖毛與鞭毛的基部有一個基體（basal body）；位於細胞質中，其衍生自中心粒，與中心粒有相同的構造，皆為9＋0微管模式。

    微絲又稱肌動蛋白絲（actin filaments），直徑約為7 nm。微絲含有兩條肌動蛋白分子鏈，互相扭結成螺旋狀，微絲與微管一樣能組合及拆卸，通常以束狀或網狀架構出現。肌動蛋白絲參與了真核細胞的運動，如肌動蛋白和肌凝蛋白（myosin）與肌肉收縮有關；小腸的微絨毛中亦可發現肌動蛋白絲；微絲亦與變形運動有關，如細胞伸出偽足；在植物細胞中，肌動蛋白絲形成路徑，使細胞中的胞器（如葉綠體）可依一定的方向循流。

    中間絲的直徑約為8～11 nm，是繩索狀的纖維蛋白聚合物，不能組合及拆卸。若利用化學方法將細胞質內的微絲和微管移除後，網狀的中間絲仍能留下並維持原來的形狀；此結果暗示中間絲在強化細胞形狀及固定各胞器的位置方面特別重要。'
  explanation: 細胞骨架存在於真核細胞細胞質中，主要由蛋白質構成；其中微管最粗（25 nm）、微絲最細（7 nm）；微管與微絲皆可作為胞器在細胞質中移動的軌道或路徑，故選(D)。
  answer_status: ai_generated
  answer_source: agent
  answer:
  - D
