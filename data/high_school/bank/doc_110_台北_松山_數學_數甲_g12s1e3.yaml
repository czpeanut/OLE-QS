  type: fill
  page: 2
  stem: 善於利用時間的<u>祥祥</u>於凌晨 2 點開車在看不到終點的公路起點一路飄向北方，<u>祥祥</u> t 小時後的車速為 v（t）＝－$t^{3}$＋$2t^{2}$＋40t（公里／小時），<u>宏宏</u>於凌晨 3 點一邊開車一邊打哈欠從相同起點沿著相同路徑以等速度火力全開追上<u>祥祥</u>，請問<u>宏宏</u>若要在凌晨 6 點前追上<u>祥祥</u>，車速至少應該為＿＿＿＿公里／小時。（無條件進位至整數，才不可能錯過<u>祥祥</u>）
  answer:
  - '100'
  answer_status: verified
  answer_source: answer_key
  explanation: '<u>祥祥</u>由凌晨 2 點到凌晨 6 點的行駛距離為

    $\int_{0}^{4} ( -t^{3}+ 2t^{2}+ 40t )dt$

    ＝$\left. \left( -\frac{1}{4}t^{4}+\frac{2}{3}t^{3}+ 20t^{2} \right) \right| _{0}^{4}$＝$-\frac{1}{4}$×$4^{4}$＋$\frac{2}{3}$×$4^{3}$＋20×$4^{2}$＝－64＋$\frac{128}{3}$＋320＝$\frac{896}{3}$

    <u>宏宏</u>由凌晨 3 點到凌晨 6 點等速追上$\Rightarrow$速度為$\frac{896}{3}$÷3＝$\frac{896}{9}$＝99.……

    故車速至少應該為 100 公里／小時'
