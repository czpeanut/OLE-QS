- id: doc_110_台北_松山_數學_數甲_g12s1e3_s3_5
  section: 3
  number: 5
  type: fill
  page: 2
  stem: 求定積分$\int_{0}^{3} | x^{2}- 3x + 2 |dx$＝＿＿＿＿。
  answer:
  - $\frac{11}{6}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$x^{2}$－3x＋2＝（x－1）（x－2）

    當 x＜1 或 x＞2 時，$x^{2}$－3x＋2＞0

    當 1＜x＜2 時，$x^{2}$－3x＋2＜0

    ∴$\int_{0}^{3} | x^{2}- 3x + 2 |dx$＝$\int_{0}^{1} ( x^{2}- 3x + 2 )dx$＋$\int_{1}^{2} 〔 -( x^{2}- 3x + 2 ) 〕dx$＋$\int_{2}^{3} ( x^{2}- 3x + 2 )dx$

    ＝$\left. \left( \frac{1}{3}x^{3}-\frac{3}{2}x^{2}+2x \right) \right| _{0}^{1}$－$\left. \left( \frac{1}{3}x^{3}-\frac{3}{2}x^{2}+2x \right) \right| _{1}^{2}$＋$\left. \left( \frac{1}{3}x^{3}-\frac{3}{2}x^{2}+2x \right) \right| _{2}^{3}$

    ＝$\left( \frac{1}{3}-\frac{3}{2}+ 2 \right)$－$\left[ \frac{1}{3} ( 2^{3}- 1^{3} )-\frac{3}{2} ( 2^{2}- 1^{2} )+ 2 ( 2 - 1 ) \right]$ ＋$\left[ \frac{1}{3} ( 3^{3}- 2^{3} )-\frac{3}{2} ( 3^{2}- 2^{2} )+ 2 ( 3 - 2 ) \right]$

    ＝$\frac{1}{3}$（1－7＋19）－$\frac{3}{2}$（1－3＋5）＋2（1－1＋1）

    ＝$\frac{13}{3}$－$\frac{9}{2}$＋2＝$\frac{11}{6}$'
- id: doc_110_台北_松山_數學_數甲_g12s1e3_s3_6
  section: 3
  number: 6
  type: fill
  page: 2
  stem: 函數 f（x）＝$x^{3}$－$2x^{2}$＋4x＋1 與 g（x）＝$x^{2}$＋2x＋1 的圖形所圍區域的面積為＿＿＿＿。
  answer:
  - $\frac{1}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$x^{3}$－$2x^{2}$＋4x＋1＝$x^{2}$＋2x＋1$\Rightarrowx^{3}$－$3x^{2}$＋2x＝0$\Rightarrow$x（x－1）（x－2）＝0$\Rightarrow$x＝0 或 1 或 2

    ①$\int_{0}^{1} 〔 ( x^{3}- 2x^{2}+ 4x + 1 )-( x^{2}+ 2x + 1 ) 〕dx$

    ＝$\int_{0}^{1} ( x^{3}- 3x^{2}+ 2x )dx$＝$\left. \left( \frac{1}{4}x^{4}-x^{3}+x^{2} \right) \right| _{0}^{1}$＝$\frac{1}{4}$－1＋1＝$\frac{1}{4}$

    ②$\int_{1}^{2} 〔 ( x^{3}- 2x^{2}+ 4x + 1 )-( x^{2}+ 2x + 1 ) 〕dx$

    ＝$\int_{1}^{2} ( x^{3}- 3x^{2}+ 2x )dx$＝$\left. \left( \frac{1}{4}x^{4}-x^{3}+x^{2} \right) \right| _{1}^{2}$

    ＝$\frac{1}{4}$（$2^{4}$－$1^{4}$）－（$2^{3}$－$1^{3}$）＋（$2^{2}$－$1^{2}$）＝$\frac{1}{4}$×15－7＋3＝$-\frac{1}{4}$

    故所求面積為$\left| \frac{1}{4} \right|$＋$\left| -\frac{1}{4} \right|$＝$\frac{1}{2}$'
