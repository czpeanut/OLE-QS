- id: doc_110_台北_松山_數學_數甲_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列何者為函數 g（x）＝$3x^{2}$－2x－1 的反導函數？
  options:
  - label: A
    content: $3x^{2}$－2x－1
  - label: B
    content: $6x^{2}$－4x－1
  - label: C
    content: $x^{3}$－$x^{2}$－x＋1
  - label: D
    content: 6x－2
  - label: E
    content: $\int_{1}^{x} ( 6t - 2 )dt$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：（$3x^{2}$－2x－1）''＝6x－2

    (B)╳：（$6x^{2}$－4x－1）''＝12x－4

    (C)○：（$x^{3}$－$x^{2}$－x＋1）''＝$3x^{2}$－2x－1

    (D)╳：（6x－2）''＝6

    (E)╳：$\left( \int_{1}^{x} ( 6t - 2 )dt \right) ''$＝6x－2

    故選(C)'
