- id: doc_110_台北_松山_數學_數甲_g12s1e3_s3_1
  section: 3
  number: 1
  type: fill
  page: 2
  stem: 設 f（x）為一實係數多項式，若 f（x）＝$x^{2}$＋2x－$\int_{0}^{1} f ( x )dx$，試求 f(1)＝＿＿＿＿。
  answer:
  - $\frac{7}{3}$
  answer_status: verified
  answer_source: answer_key
  explanation: '設$\int_{0}^{1} f ( x )dx$＝k，由 f（x）＝$x^{2}$＋2x－k 代入得

    $\int_{0}^{1} ( x^{2}+ 2x -k )dx$＝k

    $\Rightarrow\left. \left( \frac{1}{3}x^{3}+x^{2}-kx \right) \right| _{0}^{1}$＝$\frac{1}{3}$＋1－k＝k$\Rightarrow$k＝$\frac{2}{3}$

    得 f（x）＝$x^{2}$＋2x－$\frac{2}{3}$，故 f(1)＝$1^{2}$＋2×1－$\frac{2}{3}$＝$\frac{7}{3}$'
- id: doc_110_台北_松山_數學_數甲_g12s1e3_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 已知 f（x）與 g（x）皆為實係數多項式函數，且$\int_{1}^{5} f ( x )dx$＝8，$\int_{5}^{7} f ( x )dx$＝－5，$\int_{1}^{7} g ( x )dx$＝2，試求$\int_{1}^{7} 〔 2 f ( x )-3g ( x ) 〕dx$＝＿＿＿＿。
  answer:
  - '0'
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{1}^{7} 〔 2f ( x )- 3g ( x ) 〕dx$

    ＝$2\int_{1}^{7} f ( x )dx$－$3\int_{1}^{7} g ( x )dx$

    ＝$2 \left( \int_{1}^{5} f ( x )dx +\int_{5}^{7} f ( x )dx \right)$－$3\int_{1}^{7} g ( x )dx$

    ＝2〔8＋（－5）〕－3×2＝0'
- id: doc_110_台北_松山_數學_數甲_g12s1e3_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 求$\lim_{n \rightarrow \infty} \frac{1^{4}+3^{4}+5^{4}+\cdots \cdots +( 2n - 1 )^{4}}{n^{5}}$＝＿＿＿＿。
  answer:
  - $\frac{16}{5}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{1^{4}+ 3^{4}+ 5^{4}+\cdots \cdots +( 2n - 1 )^{4}}{n^{5}}$

    ＝$\frac{1^{4}+ 2^{4}+ 3^{4}+\cdots \cdots +( 2n )^{4}}{n^{5}}$－$\frac{2^{4}+ 4^{4}+\cdots \cdots +( 2n )^{4}}{n^{5}}$

    ＝$\frac{1}{n} \left[ \left( \frac{1}{n} \right) ^{4}+ \left( \frac{2}{n} \right) ^{4}+\cdots \cdots + \left( \frac{2n}{n} \right) ^{4} \right]$－$\frac{2^{4}}{n} \left[ \left( \frac{1}{n} \right) ^{4}+ \left( \frac{2}{n} \right) ^{4}+\cdots \cdots + \left( \frac{n}{n} \right) ^{4} \right]$

    故$\lim_{n \rightarrow \infty} \frac{1^{4}+3^{4}+5^{4}+\cdots \cdots +( 2n - 1 )^{4}}{n^{5}}$＝$\int_{0}^{2} x^{4}dx$－$2^{4}\int_{0}^{1} x^{4}dx$

    ＝$\left. \left( \frac{1}{5}x^{5} \right) \right| _{0}^{2}$－$\left. 16 \left( \frac{1}{5}x^{5} \right) \right| _{0}^{1}$＝$\frac{1}{5}$×$2^{5}$－$\frac{16}{5}$×$1^{5}$

    ＝$\frac{1}{5}$（32－16）＝$\frac{16}{5}$'
