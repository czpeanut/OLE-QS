    ＝$\left. \pi \left( \frac{1}{5}x^{5}+x^{4}+\frac{4}{3}x^{3} \right) \right| _{0}^{1}$＝$\pi \left( \frac{1}{5}+1+\frac{4}{3} \right)$＝$\frac{38\pi}{15}$'
- id: doc_110_台北_松山_數學_數甲_g12s1e3_s3_8
  section: 3
