  explanation: 單一選區兩票制之「聯立制」以政黨票得票率決定各政黨在國會應得之總席次比例，能讓小黨依其得票比例獲得席次，最能保障小黨生存空間與多元意見展現。(A)(B)單一選區制具贏者全拿效果，不利小黨；(C)並立制比例席次與區域席次分開計算，仍較有利大黨。答案選(D)。
