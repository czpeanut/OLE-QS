- id: doc_110_新北_新店_自然_物理_選修物理V_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 光碟以反射層的凹點紀錄訊息，表面覆以透明介質保護層（折射率 n），雷射光束由下向上垂直射向反射層，其反射光由雷射訊號讀取器讀取。若同時反射自保護層底面與凹洞底部的兩光線疊加成為破壞性干涉，則凹洞的最小深度為多少？（真空中雷射光波長為 λ）
  options:
  - label: A
    content: $\frac{ 1 }{ 4 }$λ
  - label: B
    content: $\frac{ 1 }{ 2 }$λ
  - label: C
    content: $\frac{ 1 }{4n }$λ
  - label: D
    content: $\frac{ 1 }{ 2n }$λ
  - label: E
    content: $\frac{ n }{ 4 }$λ
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (1) 在介質中的波長 $\lambda_{n}＝\frac{\lambda}{n}$。(2) 兩反射光之波程差為凹洞深度 $d$ 的 2 倍，當波程差 $2d＝\frac{\lambda_{n}}{2}＝\frac{\lambda}{2n}$ 時發生破壞性干涉，故最小深度 $d＝\frac{\lambda}{4n}$。故選(C)。
  tags:
    unit:
      code: PH-S3-4-2
      book: 選修物理III 波動、光及聲音
      chapter: 物理光學
      title: 光的干涉
      std: true
