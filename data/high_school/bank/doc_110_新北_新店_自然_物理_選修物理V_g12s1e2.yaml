  type: single
  page: 1
  stem: 在「單狹縫繞射」實驗中，若以波長為6.0×$10^{－7}$公尺之單色光照射在單狹縫上，測知屏上繞射的中央亮帶寬度為1.0公分；如將屏後移使屏與狹縫之間距離增加20公分，則中央亮帶寬度變為1.5公分。此狹縫之寬度應為若干？
  options:
  - label: A
    content: 2.4×$10^{－3}$公分
  - label: B
    content: 4.0×$10^{－3}$公分
  - label: C
    content: 4.8×$10^{－3}$公分
  - label: D
    content: 6.0×$10^{－3}$公分
  - label: E
    content: 7.2×$10^{－3}$公分
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 中央亮帶＝2Δy＝2×$\frac{λr }{ b }$＝1cm，調整後的中央亮帶＝2×$\frac{λ(r＋20) }{ b }$＝1.5cm，所以$\frac{r }{ r＋20 }$＝$\frac{ 1 }{ 1.5 }$，r＝40cm，帶回原來中央亮帶。2×$\frac{(6×10^{－5}cm)×(40cm) }{ b }$＝1cm，b＝4.8×$10^{－3}$cm。答案選(C)。
