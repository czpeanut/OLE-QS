  stem: 單色光從折設率$n_{1}$之介質，射入折射率$n_{2}$之介質，在$n_{1}$、$n_{2}$各介質時的波長為λ$_{1}$、λ$_{2}$，頻率為$f_{1}$、$f_{2}$，若$n_{1}$＜$n_{2}$，則下列何選項正確？
  options:
  - label: A
    content: $f_{1}$＞$f_{2}$，λ$_{1}$＝λ$_{2}$
  - label: B
    content: $f_{1}$＜$f_{2}$，λ$_{1}$＝λ$_{2}$
  - label: C
    content: $f_{1}$＞$f_{2}$，λ$_{1}$＜λ$_{2}$
  - label: D
    content: $f_{1}$＝$f_{2}$，λ$_{1}$＞λ$_{2}$
  - label: E
    content: $f_{1}$＝$f_{2}$，λ$_{1}$＜λ$_{2}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (1)波傳遞的過程中頻率不變，$f_{1}$＝$f_{2}$。(2)根據折射定律$\frac{ v_{1} }{ v_{2} }$＝$\frac{λ_{1} }{λ_{2} }$＝$\frac{ n_{2} }{ n_{1} }$，所以λ$_{1}$＞λ$_{2}$。答案選(D)。
