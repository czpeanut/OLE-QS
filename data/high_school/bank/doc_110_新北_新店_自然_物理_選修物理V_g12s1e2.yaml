  page: 1
  stem: 人臉辨識系統已經開始應用在業界的出勤管理、或是宿舍社區門禁管理。辨識系統的攝影機可以自動將鏡頭前1公尺處人臉拍攝成數位相片，再將影像傳遞給電腦識別。這個攝影機的鏡頭應如何設計？
  options:
  - label: A
    content: 相當於凸透鏡，焦距可為0.1公尺
  - label: B
    content: 相當於凹透鏡，焦距可為0.1公尺
  - label: C
    content: 相當於凸透鏡，焦距可為0.5公尺
  - label: D
    content: 相當於凹透鏡，焦距可為0.5公尺
  - label: E
    content: 相當於凸透鏡，焦距可為0.6公尺
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (1)照相機的鏡頭為凸透鏡，且呈縮小的倒立實像在底片上； (2)為了成縮小實像，物距要大於2倍焦距，所以1公尺＞2f，f＜0.5公尺。答案選(A)。
