  section: 2
  number: 19
  type: multiple
  page: 2
  stem: '在空氣中已波長為λ$_{1}$的雷射光垂直入射雙狹縫做干涉實驗，已知兩狹縫間的距離為d，狹縫至屏幕的距離為$L_{1}$，測得中央亮帶寬度為Δ$y_{1}$；乙生以波長為λ$_{2}$的雷射光於同一狹縫作相同的實驗，狹縫至屏幕距離為$L_{2}$，測得中央亮帶寬度為

    Δ$y_{2}$，則下列哪些選項是正確的？'
  options:
  - label: A
    content: 若$L_{2}$＝$L_{1}$，Δ$y_{2}$＞Δ$y_{1}$，則λ$_{2}$必大於λ$_{1}$
  - label: B
    content: 若Δ$y_{2}$＞Δ$y_{1}$，則$L_{2}$必大於$L_{1}$
  - label: C
    content: 若λ$_{2}$＞λ$_{1}$，且$L_{2}$＞$L_{1}$，則Δ$y_{2}$＞Δ$y_{1}$
  - label: D
    content: 若Δ$y_{1}$＝Δ$y_{2}$，則 $\frac{λ_{1} }{ L_{1} }$＝$\frac{λ_{2} }{ L_{2} }$
  - label: E
    content: 若Δ$y_{1}$＞Δ$y_{2}$，則波長λ$_{1}$的雷射光在真空的速率較波長λ$_{2}$的雷射光為快
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
