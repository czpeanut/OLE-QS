  section: 2
  number: 18
  type: multiple
  page: 2
  stem: 一物體位於凸透鏡一側，物距為p，透鏡焦距為f，像距為q。下列敘述何者正確？
  options:
  - label: A
    content: 把一點光源放在焦點，則其光線經折射後會聚於透鏡另一側的焦點
  - label: B
    content: 若p＝2q，則放大率為2
  - label: C
    content: 若p＝2f，則物與像大小相同
  - label: D
    content: 若p＞2f，則q＜p
  - label: E
    content: 若p＞3f，則在透鏡另一測產生一倒立縮小之實像
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)錯誤，自焦點發出的光線經凸透鏡後會變成平行光；(B)錯誤，放大率M＝$\frac{ q }{ p }$＝$\frac{ q }{ 2q }$＝$\frac{ 1 }{ 2 }$；(C)正確，物在2倍焦距處，q＝2f，放大率M＝$\frac{ q }{ p }$＝$\frac{ 2f }{ 2f }$＝1；(D)(E)皆正確，物在2倍焦距外，像在f~2f之間成倒立縮小實像。答案選(C)(D)(E)。
