  stem: 今有三次函數 f（x）和二次函數 g（x），已知 y＝f（x）的對稱中心和 y＝g（x）的頂點均為（0，1）。而將（x－1）f（x）除以 g（x），得商式 $x^{2}$－x－2 和餘式 3x＋1。試問 f（x）－g（x）＝＿＿＿＿。
  answer:
