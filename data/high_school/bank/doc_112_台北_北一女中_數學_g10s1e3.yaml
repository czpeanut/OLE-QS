  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝$ax^{3}$＋cx＋1，g（x）＝$px^{2}$＋1

    又（x－1）f（x）＝g（x）（$x^{2}$－x－2）＋3x＋1

    ⇒（x－1）（$ax^{3}$＋cx＋1）＝（$px^{2}$＋1）（$x^{2}$－x－2）＋3x＋1

    $x^{4}$ 項係數：左式＝a＝p＝右式 ……………………①

    $x^{2}$ 項係數：左式＝c＝1－2p＝右式 ………………②

    x 項係數：左式＝1－c＝－1＋3＝右式……………③

    由③ 得 c＝－1，代入①、② 得 p＝1＝a

    故 f（x）－g（x）＝（$x^{3}$－x＋1）－（$x^{2}$＋1）＝$x^{3}$－$x^{2}$－x'
