- id: doc_112_台北_北一女中_數學_g10s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 設兩相異多項式 f（x）、g（x）分別為 m 次和 n 次，下列敘述哪些正確？
  options:
  - label: A
    content: deg（f（x）＋g（x））可能為 m＋n
  - label: B
    content: 若 m ≥ n，則 deg（f（x）－g（x））≤ m
  - label: C
    content: deg（f（x）g（x））＝mn
  - label: D
    content: deg（f（$x^{2}$＋1））＝$m^{2}$
  - label: E
    content: 已知 f（x）為一多項式函數。若 deg（f（x））＝3，則 deg（〔f（x）〕$^{3}$）＝6
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：令 f（x）＝$x^{2}$，g（x）＝1，則 m＝2，n＝0

    ⇒ deg（f（x）＋g（x））＝2＝2＋0＝2

    (B) ○：若 m＞n，或 m＝n，但兩者首項係數不同，則 deg（f（x）－g（x））＝m

    又若 m＝n 且 f（x）之首項係數和 g（x）之首項係數相等

    則 deg（f（x）－g（x））＜m

    (C) ╳：deg（f（x）g（x））＝m＋n

    (D) ╳：deg（f（$x^{2}$＋1））＝2m

    (E) ╳：deg（〔f（x）〕$^{3}$）＝3×3＝9

    故選(A)(B)'
