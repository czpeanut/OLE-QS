  answer_status: verified
  answer_source: answer_key
  explanation: 釋字第 791 號為說明通姦罪不符合比例原則。(A)此法有為保障人格權之意旨，與比例原則無關。(B)此釋憲文處理中央民代的正當性，原文部分如下：「由中央政府依《憲法》之精神、本解釋之意旨及有關法規，適時辦理全國性之次屆中央民意代表選舉，以確保憲政體制之運作。」(C)此與法律保留原則有關。(D)此釋憲案內容如下：「與《憲法》第 23 條法律保留原則無違。惟其對應考試資格所為之限制，逾越必要程度，牴觸《憲法》第 23 條比例原則，與《憲法》第 18 條保障人民服公職之權利意旨不符。」符合題幹之比例原則，故為正解。
