  stem: 國家批准藥物上市，卻無力排除藥物對人體的不良反應，導致用藥人死亡、障礙或重大疾病時，用藥人可依據《藥害救濟法》申請藥害救濟。但因為批准藥物上市是依循療效大於風險的準則，難謂公務員的行為違法或有責；另方面用藥人又不是因追求特定公益目的而遭受特別犧牲。因此學理認為，行政法上的藥害救濟是基於衡平原則、社會共同體連帶的思維。由此可知，藥害救濟制度的國家責任類型應歸屬於下列何者？
  options:
  - label: A
    content: 國家賠償責任
  - label: B
    content: 損失補償責任
  - label: C
    content: 社會補償責任
  - label: D
    content: 公務員過失責任
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 人民權利受損，區分為因國家公權力行使，致人民權利受損的「國家賠償」（條件：行為不法）與「損失補償」（條件：行為合法）；另一種非因國家公權力行為直接造成的「社會補償」，其類型如下：國家依照社會國原則（追求社會正義與社會安全為國家目標與任務）所為之各項給付行政，可區分為「社會促進」與「社會補償」，前者屬於國家的「無因性給付」，其目的純粹在扶助弱勢，與彌補虧欠的補償無關，本例中藥害救濟制度即屬之，故選(C)。
  tags:
    unit:
      code: CI-S2-5-3
      book: 選修公民與社會II 民主政治與法律
      chapter: 防止公權力濫用的行政法
