  stem: 《司法院釋字第 382 號解釋》指出：「各級學校依有關學籍規則或懲處規定，對學生所為退學或類此之處分行為，足以改變其學生身分並損及其受教育之機會，自屬對人民《憲法》上受教育之權利有重大影響。受處分之學生於用盡校內申訴途徑，未獲救濟者，自得依法提起救濟程序。」依據《司法院釋字第 382 號解釋》，高中生的權利義務與權利救濟，下列何者敘述是正確的？
