- id: doc_111_基隆_中山_社會_公民與社會_選修公民與社會II_g12s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 我國《菸害防制法》規定，菸品所含之尼古丁及焦油含量，應以中文標示於菸品容器上，否則處以罰鍰。但對於該法施行前已進入銷售通路，尚未售出之菸品也要求須履行法定標示義務，勢必對菸品業者造成不可預期之財產損害。為因應此種情形，《菸害防制法》乃制定了過渡條款，《菸害防制法》制定過渡條款的理由最可能為下列何者？
  options:
  - label: A
    content: 保護人民正當合理之信賴
  - label: B
    content: 行政行為須由法定管轄機關所為
  - label: C
    content: 對於菸商處以罰鍰違反法律授權
  - label: D
    content: 要求菸品標示成分應有法律依據
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 如果人民已經對既有法規所做出的行政行為，或形塑出來的法律秩序產生信賴，但之後卻因為法規或行政處分的變動，進而影響人民已經享有的利益、遭受預期之外的損害時，國家就應該透過訂立過渡條款、給予補救措施等方式，來保護人民的信賴利益，故應選(A)。
  tags:
