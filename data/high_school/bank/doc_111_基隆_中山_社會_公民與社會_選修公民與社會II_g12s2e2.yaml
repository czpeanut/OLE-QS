  section: 1
  number: 35
  type: single
  page: 9
  stem: RSF 呼籲 NCC 對○○新聞臺的執照審查標準，未來也要同樣適用於不同政治色彩的媒體，這是基於對行政處分合法性的何種要求？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 誠信原則
  - label: C
    content: 平等原則
  - label: D
    content: 信賴保護原則
  group_stem: '國家通訊傳播委員會（NCC）於 2020 年 11 月 18 日對○○新聞臺作出不予換照的決議，主要理由是○○新聞臺「違規紀錄嚴重」、「內部自律機制失靈」，這意味著○○新聞臺在原有衛星廣播頻道執照到期後，就不能在有線電視網絡播出。

    長期關注新聞自由的無國界記者組織（RSF）表示，雖然對○○新聞臺員工深表遺憾，但他們認為 NCC 的決議並未侵害新聞自由。因為新聞自由並非毫無限制的濫用，需要相關管控才能發揮使公眾接收正確資訊的效用。此外，由獨立機關對電視臺換照進行定期審查，是民主國家的常態，且基於《衛星廣播電視法》的規範，政府發放執照時，可提出遵守新聞倫理等附帶要求，○○新聞臺在 2014 年被許可換照時，就被附帶要求必須建立機制以確保新聞的最佳產製流程。

    然而，RSF 也表示，不予換照是極端手段，需要妥善證明合理性，呼籲 NCC 提供完整資料說明若予○○新聞臺換照對公眾利益可能造成的損害，同時要求未來不同政治色彩的媒體執照審查也要適用相同的標準。

    針對 NCC 的決議，○○新聞臺則聲明「一定會提出後續的法律救濟程序」。有專家認為，在行政訴訟上，法院會著重於 NCC 做出相關決議時，是否顧及當事人（○○新聞臺）權益、尊重當事人並給予合理的表述機會、整個程序是否依據《行政程序法》。且 NCC 不允許○○換照，對○○的不利影響大過給予有條件換照，故手段是否必要、對於保障媒體產業健全、維護視聽大眾權益和公共利益的目標是否能達成，亦將為審查的重點。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從提問「對○○新聞臺的執照審查標準，未來也要同樣適用於不同政治色彩的媒體」，可判斷 RSF 之要求，屬於平等原則，是指相同之事件應為相同之處理，不同之事件則應為不同之處理，除有合理正當之事由外，否則不得為差別待遇，故選(C)。
