  stem: 政府為了防止新冠肺炎疫情擴散，要求自他國入境者須遵守 14 天居家檢疫規範。2020 年 9 月，○○集團董事長赴國外出差，返臺後卻未落實居家檢疫規定私自外出，遭到新北市衛生局裁罰 50 萬元。新北市衛生局的作為應為下列何種行政行為？
  options:
  - label: A
    content: 行政指導
  - label: B
    content: 行政處分
  - label: C
    content: 行政契約
  - label: D
    content: 行政計畫
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「行政處分」就是行政機關就公法上具體事件所為的決定，或其他公權力措施而對外直接發生法律上效果的單方行政行為，例如：建築執照核發、命拆除違建、戶籍登記、土地登記、命停止營業及環保、衛生等各類行政罰鍰。本題中之裁罰即屬之，故選(B)。
