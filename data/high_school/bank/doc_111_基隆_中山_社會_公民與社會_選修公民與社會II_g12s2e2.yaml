  answer_status: verified
  answer_source: answer_key
  explanation: 由題文「最高法院的責任，是確保政府永不越界或是侵害人民的權利」，可知司法權作為行政與立法權之外的權力，可以保障人民免於受到政府侵犯其基本權利，故選(B)。
