- id: doc_111_基隆_中山_社會_公民與社會_選修公民與社會II_g12s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 身材嬌小的高三學生小真某日瀏覽警察大學的招生簡章，發現簡章規定的錄取資格設有身高限制，覺得該招生簡章涉及身材歧視，讓自己當女警的希望破滅，有違反《憲法》平等原則、受教權之保障與侵害未來可能的就業權利之疑慮，希望司法機關審查是否違憲。若小真欲聲請司法違憲審查，下列何者是可行的建議？
  options:
  - label: A
    content: 向教育部提出訴願遭到駁回之後，即可逕行向司法院大法官聲請違憲審查
  - label: B
    content: 報考未獲錄取後依序提起行政爭訟，於最終確定判決仍未獲救濟方可聲請
  - label: C
    content: 招生簡章之違憲疑義屬抽象法規審查，應向立法院陳情後由立委連署提出
  - label: D
    content: 到法院聲明異議讓司法院得知招生簡章有違憲疑義，大法官即會主動審查
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此時仍可展開行政訴訟，因尚未用盡所有救濟程序。(C)抽象法規的審查應可於終局審判後聲請大法官解釋。(D)違憲審查機關採取不告不理的被動角色，除相關機關請求外不得主動進行違憲審查，此亦是基於對行政權與立法權的尊重，故大法官非主動審查。
