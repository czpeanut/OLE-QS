  section: 1
  number: 14
  type: single
  page: 3
  stem: 中橫公路太魯閣國家公園路段地質不穩，屬於天險路段，即使設置防護網或防石柵仍無法完全阻擋落石，公路總局因此在當地附近設置「注意落石」警告標誌，仍不免發生用路人遭落石擊中而傷亡的意外事故。有用路人在此處騎自行車遭落石重擊喪生，家屬申請國家賠償卻遭法院駁回，該國賠案遭駁回的理由最可能為下列何者？
  options:
  - label: A
    content: 太魯閣國家公園為公共設施，但非屬公有
  - label: B
    content: 中橫公路為自然公物，非《國賠法》適用範圍
  - label: C
    content: 國賠責任僅限於身體、人身自由受損害者
  - label: D
    content: 管理機關公路總局已善盡管理及警告義務
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國家公園為公有地，告示牌屬於公有公共設施。(B)公路為公共設施，適用《國家賠償法》。(C)依《國家賠償法》第 2 條第 2 項及第 3 項規定：「公務員於執行職務行使公權力時，因故意或過失不法侵害人民自由或權利者，國家應負損害賠償責任。公務員怠於執行職務，致人民自由或權利遭受損害者亦同。前項情形，公務員有故意或重大過失時，賠償義務機關對之有求償權。」故自由或權利亦屬於國賠之範疇。
