  stem: 高中生阿杰因三度未參加學校朝會升旗及防災演練而被學校記了三支警告，下列有關其權利救濟的敘述何者正確？
  options:
  - label: A
    content: 阿杰可循序向學校申訴、上級機關再申訴，若不服可提行政訴訟
  - label: B
    content: 學校對阿杰的懲處不影響受教權，阿杰只能循校內申訴途徑救濟
  - label: C
    content: 該懲處為行政處分，阿杰若覺得權利受侵害可直接提起行政訴訟
  - label: D
    content: 司法不干預學校對學生的教育管理措施，阿杰只能向教育部訴願
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依據《高級中等教育法》，學生或學生自治組織對學校之懲處、其他措施或決議，認為違法或不當致損害權益者，得向學校提出申訴；不服學校申訴決定，得向各該主管機關提出再申訴；若不服，可再提起行政爭訟，故選(A)。
