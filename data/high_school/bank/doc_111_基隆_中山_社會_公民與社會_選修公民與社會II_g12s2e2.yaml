- id: doc_111_基隆_中山_社會_公民與社會_選修公民與社會II_g12s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 我國司法院大法官的任命與任期在《憲法》及《憲法增修條文》中均設有相關規定，下列制度的設計何者有利釋憲經驗的傳承？
  options:
  - label: A
    content: 大法官任期 8 年，並且不得連任
  - label: B
    content: 15 名大法官包括司法院正副院長
  - label: C
    content: 大法官不分屆次，採交錯任期制
  - label: D
    content: 由總統提名經立法院同意後任命
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「交錯任期制」的好處在於單一總統無法一次決定所有大法官的人員組成，可降低政治力介入的疑慮。更重要的是，「交錯任期制」同時能達到經驗傳承的效果，即每次會有 7 至 8 位已擔任 4 年的大法官，可與新任的 8 ～ 7 位大法官交流經驗，故應選(C)。
  tags:
    unit:
      code: CI-S2-4-1
      book: 選修公民與社會II 民主政治與法律
      chapter: 釋憲制度與人權保障
      title: 憲法最高性與釋憲機制
      std: true
    textbook: 選修公民與社會II 民主政治與法律 憲法最高性與釋憲機制
    labeled_by: agent
    label_confidence: high
- id: doc_111_基隆_中山_社會_公民與社會_選修公民與社會II_g12s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 震驚社會的臺南啟聰學校集體性侵案中，一名受害女學生在歷經三年多的國賠訴訟中勝訴定讞。判決指出，該校是依《特殊教育法》設立，辦理身心障礙學生教育的學校，未建立安全的校園空間，所屬公務員怠於執行職務，而其怠於執行職務與受害學生遭強制性侵害的結果間，有相當因果關係，因而判決學校應賠償該名受害學生精神慰撫金、看護費用及醫療費用。下列對於該國賠案件的敘述，何者正確？
  options:
  - label: A
    content: 啟聰學校的公務員應有故意或過失而造成國賠責任
  - label: B
    content: 判決認為學校公務員有違背職務上權力的不法作為
  - label: C
    content: 女學生勝訴的主因在於學校的公共設施設置有欠缺
  - label: D
    content: 啟聰學校公共設施管理不當以致學生遭強制性侵害
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 此案的判決指出「公務員怠於執行職務，與造成學生遭強制性侵害的結果間具有因果關係」，因此國賠成立，故選(A)。(B)與公務員不法作為無關。(C)(D)與公共設施設置或管理不當無關。
  tags:
    unit:
      code: CI-S2-5-3
      book: 選修公民與社會II 民主政治與法律
