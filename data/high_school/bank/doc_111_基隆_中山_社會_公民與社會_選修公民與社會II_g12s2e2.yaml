  stem: 為保障勞工工作權及調和雇主經營權，《大量解僱勞工保護法》規定，若雇主資遣人數達法定標準，應於 60 天前將解僱計畫書通知主管機關、相關單位或人員，違反規定者可處新臺幣 10 萬至 50 萬元罰鍰。某知名科技公司因業務緊縮解僱 434 名員工，卻未依法於解僱日前 60 天函報大量解僱計畫書，違反《大量解僱勞工保護法》之規定，經市府勞動局衡量該公司違法情節、財力及獲利情形及受影響的勞工人數後，處以法定罰鍰最高的 50 萬元。下列關於該裁罰的敘述，何者正確？
