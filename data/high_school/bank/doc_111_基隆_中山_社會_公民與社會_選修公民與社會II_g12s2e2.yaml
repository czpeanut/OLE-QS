  - label: C
    content: 50 萬元的罰鍰金額違反法律優越原則
  - label: D
    content: 市府明顯裁量濫用造成雇主重大損失
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)信賴保護適用於國家與人民之間，而非雇主與員工間。(B)裁量金額仍於法律規定的範圍內，符合法律授權的內容，為正確敘述。(C)(D) 50 萬的金額符合法律規定，並無違反法律優越原則，也並未造成裁量濫用。
