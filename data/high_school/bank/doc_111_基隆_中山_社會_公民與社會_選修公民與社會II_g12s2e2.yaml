  stem: 大法官在釋字第 603 號解釋認為：《戶籍法》第 8 條第 2 項「……請領國民身分證，應捺指紋並錄存。……」第 3 項「請領國民身分證，不依前項規定捺指紋者，不予發給。」之規定，以強制按捺並錄存指紋作為核發國民身分證之要件，縱然可以達到防偽、防止冒領、冒用、辨識路倒病人、迷途失智者、無名屍體等目的，亦屬損益失衡、手段過當。上述內容說明《戶籍法》第 8 條第 2、3 項的何項違憲理由？
