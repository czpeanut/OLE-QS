  stem: 布農族人王光祿因持用先進獵槍射殺保育類野生動物長鬃山羊、山羌各 1 隻，經判刑確定。最高法院受理檢察總長提起非常上訴後，經開庭調查及廣泛蒐集資料，於 2017 年聲請釋憲。合議庭認為狩獵是原住民傳統文化之一，《槍砲彈藥刀械管制條例》限制原住民僅能以自製的落後槍枝打獵，致不能使用較安全的現代化制式獵槍；《野生動物保育法》限制原住民只能基於因動物逾量、學術研究、教育目的或傳統文化祭儀必要，進行狩獵，罔顧其生活習慣，違反《憲法增修條文》肯定多元文化、維護原住民傳統及促進其發展的意旨，乃請求大法官就上述法條未考量原住民特殊情形之部分宣告違憲。若大法官依《憲法訴訟法》進行違憲審查，則下列相關敘述何者正確？
  options:
  - label: A
    content: 此聲請案應屬裁判憲法審查案件
  - label: B
    content: 以憲法法庭經言詞辯論程序進行
  - label: C
    content: 以閉門會議方式作出有罪或無罪判決
  - label: D
    content: 大法官須至少 10 人同意才可宣告違憲
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依文中可知，此案為最高法院合議庭認為本案有違憲之虞所聲請之釋憲案，故應屬於法令是否違憲的審查。(B)若依《憲法訴訟法》進行違憲審查，可知是採憲法法庭的形式審理。(C)是以公開審理的方式作成合憲或違憲的判決，故並非是做出有罪或無罪判決。(D)新法為「由大法官目前全部人數 2∕3 以上出席參與評議，但僅須有大法官目前全部人數過半數的同意，即可作成判決」，故超過 8 人同意即可作成決議。
