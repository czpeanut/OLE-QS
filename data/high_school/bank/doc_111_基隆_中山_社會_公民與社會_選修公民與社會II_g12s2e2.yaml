  stem: 美國最高法院大法官艾蕾娜．卡根（Elena Kagan）在其就任演講稿中曾說：「最高法院的責任，是確保政府永不越界或是侵害人民的權利。」從這一句話推論艾蕾娜．卡根認為的最高法院職責，下列哪一個選項的詮釋最為正確？
  options:
