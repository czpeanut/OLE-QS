  type: single
  page: 4
  stem: 司法院大法官於釋字第 791 號解釋宣告我國通姦除罪化。理由之一是大法官認為《刑法》第 239 條關於通姦罪的規定雖然立法原因合憲，但就一般預防及特別預防而言，均無助於維繫婚姻家庭，其所欲達成之目的，亦可藉由民事方式達成，故系爭規定之《刑法》手段，並非最小侵害手段。上述宣告通姦罪違憲的理由與下列哪一號釋憲文最為相似？
  options:
  - label: A
    content: 釋字第 399 號解釋：內政部函釋姓名讀音不雅不得改名案
  - label: B
    content: 釋字第 261 號解釋：第一屆中央民意代表得不受任期限制案
  - label: C
    content: 釋字第 443 號解釋：內政部訂定《役男出境處理辦法》限制役男出境案
  - label: D
    content: 釋字第 715 號解釋：國防部「國軍志願役專業預備軍官預備士官班考選簡章」限制曾受刑之宣告者均不得報考案
  assets:
  - key: s1_19_f1
    kind: figure
    file: doc_111_基隆_中山_社會_公民與社會_選修公民與社會II_g12s2e2/s1_19_f1.png
    crop:
      page: 5
      rect:
