  stem: 1970 年黃文雄等人為鬆動獨裁政權而參與刺殺蔣經國的行動。行刺失敗後，黃文雄流亡海外多年，於 1996 年偷渡返國時，因其為政治異議人士禁止入境名單（黑名單）之人，被依《國家安全法》起訴。《司法院釋字第 558 號解釋》認為：《國家安全法》第 3 條第 1 項「人民入出境，應向內政部警政署入出境管理局申請許可。未經許可者，不得入出境。」之規定違憲。下列對於此釋憲文的相關敘述，何者正確？
  options:
  - label: A
    content: 這是基於保障人民言論及思想自由而做出的解釋
  - label: B
    content: 認為政府不可設黑名單制度阻止反政府人士回臺
  - label: C
    content: 主張任何在國內設有戶籍的國民可以隨時返國違反比例原則
  - label: D
    content: 為防止肺炎疫情擴散，逕以行政命令限制高中以下師生出國符合該解釋之意旨
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 釋字第 558 號認為《國安法》第 3 條第 1 項侵害人民之遷徙自由之虞，所以違憲。(A)應是針對遷徙自由。(B)黑名單制度侵害人民遷徙自由，符合此釋憲案保障範疇，為正確敘述。(C)此與比例原則無關。(D)以行政命令限制出國，可能侵犯人民之遷徙自由，且未符合法律保留原則，不符合該解釋之意旨。
