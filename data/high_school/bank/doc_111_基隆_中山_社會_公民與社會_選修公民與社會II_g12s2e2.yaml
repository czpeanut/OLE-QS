- id: doc_111_基隆_中山_社會_公民與社會_選修公民與社會II_g12s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 《釋字第 399 號解釋》宣告內政部「姓名不雅，不能以讀音會意擴大解釋」之函釋違憲，理由在於姓名權為人格權之一種，受《憲法》保障，故如何命名為人民之自由，而本號解釋公布後，《姓名條例》也進行了修正。下列相關敘述，何者正確？
  options:
  - label: A
    content: 《釋字第 399 號解釋》落實了《憲法》列舉基本權的保障
  - label: B
    content: 依據《姓名條例》人民可自由改名，沒有年齡及次數限制
  - label: C
    content: 《姓名條例》放寬改姓的限制，可自由選用父姓、母姓或第三姓氏
  - label: D
    content: 現行《姓名條例》的規範，展現人民命名自由與社會公益間的調和
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)姓名權並未明列在《憲法》相關條文中，屬於《憲法》第 22 條概括基本權的保障。(B)依據《姓名條例》，改名有年齡及次數之限制。(C)沒有開放第三姓氏。(D)現行規範讓人民有改名自由，但有相關限制是調和公共利益，避免濫用行政資源，故為正解。
  tags:
    unit:
      code: CI-S2-4-2
      book: 選修公民與社會II 民主政治與法律
      chapter: 釋憲制度與人權保障
      title: 憲法訴訟與基本權保障實務
      std: true
