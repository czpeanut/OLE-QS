  - label: B
    content: 《憲法》對隱私權採絕對保障主義，故國家不得限制
  - label: C
    content: 對換發國民身分證的人民形成不合理的差別待遇
  - label: D
    content: 強制按捺並錄存指紋的規定欠缺法律的明文授權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 釋憲文中提及「亦屬損益失衡、手段過當」，可見大法官認為按捺指紋之手段，逾越比例原則，故選(A)。(B)我國《憲法》對任何權利，皆未採用絕對保障主義。(C)(D)並非大法官釋憲的內容重點。
