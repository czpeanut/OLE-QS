- id: doc_109_高雄_高師大附中_數學_數B_g11s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設$\vec{a}$，$\vec{b}$是兩個非零向量，下列哪些條件可以推得$\vec{a}$，$\vec{b}$互相垂直？
  options:
  - label: A
    content: $\vec{a}$．$\vec{b}$＝0
  - label: B
    content: ∣$\vec{a}$＋$\vec{b}$∣＝∣$\vec{a}$－$\vec{b}$∣
  - label: C
    content: ∣$\vec{a}$－$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋∣$\vec{b}$∣$^{2}$
  - label: D
    content: ∣$\vec{a}$＋2$\vec{b}$∣＝∣$\vec{a}$－2$\vec{b}$∣
  - label: E
    content: ∣$\vec{a}$＋$\vec{b}$∣＝$\sqrt{2}$∣$\vec{a}$∣＝$\sqrt{2}$∣$\vec{b}$∣
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\vec{a}$．$\vec{b}$＝0

    ⇒ ∣$\vec{a}$∣∣$\vec{b}$∣cosθ＝0

    ⇒ θ＝90°，$\vec{a}$⊥$\vec{b}$

    (B) ○：∣$\vec{a}$＋$\vec{b}$∣$^{2}$＝∣$\vec{a}$－$\vec{b}$∣$^{2}$

    ⇒ ∣$\vec{a}$∣$^{2}$＋2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$－2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$

    ⇒ $\vec{a}$．$\vec{b}$＝0

    (C) ○：∣$\vec{a}$－$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$－2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋∣$\vec{b}$∣$^{2}$

    ⇒ $\vec{a}$．$\vec{b}$＝0

    (D) ○：∣$\vec{a}$＋2$\vec{b}$∣$^{2}$＝∣$\vec{a}$－2$\vec{b}$∣$^{2}$

    ⇒ ∣$\vec{a}$∣$^{2}$＋4$\vec{a}$．$\vec{b}$＋4∣$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$－4$\vec{a}$．$\vec{b}$＋4∣$\vec{b}$∣$^{2}$

    ⇒ $\vec{a}$．$\vec{b}$＝0

    (E) ○：∣$\vec{a}$＋$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$＝2∣$\vec{a}$∣$^{2}$＝2∣$\vec{b}$∣$^{2}$

    ⇒ $\vec{a}$．$\vec{b}$＝0

    故選(A)(B)(C)(D)(E)'
