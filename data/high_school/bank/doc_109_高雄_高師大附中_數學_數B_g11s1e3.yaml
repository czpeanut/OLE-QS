- id: doc_109_高雄_高師大附中_數學_數B_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 已知平面上三非零向量$\vec{a}$，$\vec{b}$與$\vec{c}$，則下列敘述何者正確？
  options:
  - label: A
    content: $\vec{a}$．$\vec{b}$ ≤ ∣$\vec{a}$∣∣$\vec{b}$∣
  - label: B
    content: （$\vec{a}$．$\vec{b}$）$\vec{c}$＝$\vec{a}$（$\vec{b}$．$\vec{c}$）
  - label: C
    content: 若$\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$，則$\vec{b}$＝$\vec{c}$
  - label: D
    content: 若$\vec{a}$⊥$\vec{b}$且$\vec{b}$⊥$\vec{c}$，則必$\vec{a}$⊥$\vec{c}$
  - label: E
    content: 若$\vec{b}$與$\vec{c}$平行，則$\vec{a}$在$\vec{b}$上的正射影與$\vec{a}$在$\vec{c}$上的正射影相同
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\vec{a}$．$\vec{b}$＝∣$\vec{a}$∣∣$\vec{b}$∣cosθ ≤ ∣$\vec{a}$∣∣$\vec{b}$∣

    (B) ╳：反例：$\vec{a}$＝（1，0），$\vec{b}$＝（1，2），$\vec{c}$＝（0，1）

    （$\vec{a}$．$\vec{b}$）$\vec{c}$＝1．$\vec{c}$＝（0，1）

    $\vec{a}$（$\vec{b}$．$\vec{c}$）＝2．$\vec{a}$＝（2，0）

    (C) ╳：反例：$\vec{a}$＝（1，0），$\vec{b}$＝（0，1），$\vec{c}$＝（0，2）

    則$\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$，但$\vec{b}$≠$\vec{c}$

    (D) ╳：反例：$\vec{a}$＝（1，0），$\vec{b}$＝（0，1），$\vec{c}$＝（2，0）

    則$\vec{a}$⊥$\vec{b}$，$\vec{b}$⊥$\vec{c}$，但$\vec{a}$不垂直於$\vec{c}$

    (E) ○：令$\vec{c}$＝t$\vec{b}$，則

    $\vec{a}$在$\vec{c}$上的正射影＝$\frac{\vec{a} \cdot \vec{c}}{| \vec{c} |^{2}}\vec{c}$

    ＝$\frac{t\vec{a} \cdot \vec{b}}{t^{2} | \vec{b} |^{2}}t\vec{b}$

    ＝$\frac{\vec{a} \cdot \vec{b}}{| \vec{b} |^{2}}\vec{b}$＝$\vec{a}$在$\vec{b}$上的正射影

    故選(A)(E)'
