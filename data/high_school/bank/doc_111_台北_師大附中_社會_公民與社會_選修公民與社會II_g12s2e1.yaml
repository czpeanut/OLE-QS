  section: 1
  number: 7
  type: single
  page: 1
  stem: 中國 2018 年第十三屆全國人民代表大會通過憲法修正案，將憲法條文中「中華人民共和國主席、副主席每屆任期同全國人民代表大會任期相同」後面的文字「連續任職不得超過兩屆」刪去。這象徵中國政治體制將出現歷史性轉變，代表中國國家主席的任期將更有彈性，下列關於中國國家主席之敘述何者正確？
  options:
  - label: A
    content: 國家主席在憲法上屬實權元首，但實際政治權力掌握於總理
  - label: B
    content: 國家主席的職權包括：管理經濟、教育、衛生、國防與外交
  - label: C
    content: 國家主席之選擇、罷免皆須經過全國人大表決同意
  - label: D
    content: 國家主席的政治權力在憲法中凌駕於全國人大之上
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依其憲法，國家主席職務的本質上是屬於虛位元首。(B)國家主席職務讓最高領導人有了代表國家的身分，在國際上進行元首外交、國事訪問和出席國際會議等國事活動；內政則為總理主導。(C)依據該國憲法，全國人民代表大會可對以下人員提出選舉及罷免：全國人大常委會委員長、副委員長、祕書長和委員；中華人民共和國主席、副主席；國務院總理、副總理、國務委員、各部部長、各委員會主任、審計長和祕書長；中央軍事委員會主席和中央軍事委員會其他組成人員；最高人民法院院長；最高人民檢察院檢察長，故為正確敘述。(D)依據其憲法，全國人民代表大會擁有最高的權力。
