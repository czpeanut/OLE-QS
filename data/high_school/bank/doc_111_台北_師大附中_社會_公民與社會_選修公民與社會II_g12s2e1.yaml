  type: single
  page: 3
  stem: 四位朋友對於中華人民共和國的政府體制很有興趣，不僅研究了中國中央政府體制，也比較了中央政府、地方政府和共產黨組織的設置情況，下列何人的說法最符合中國現行政治體制？
  options:
  - label: A
    content: 甲：中國的中央立法的核心機關是國務院
  - label: B
    content: 乙：中國最高人民法院為最高法律監督機關
  - label: C
    content: 丙：中國共產黨的黨國體制只在中央運作，未在地方政府中運作
  - label: D
    content: 丁：中國全國最高人民法院需對中國最高立法機關負責
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為全國人大。(B)中國最高人民法院為是中華人民共和國的最高國家審判機關，而非法律監督機關。(C)黨國體制無論是在中央或地方皆運作之。(D)全國人民代表大會的法律地位高於行政機關與司法機關，因此全國人民最高法院須對中國最高立法機關（全國人大）負責。
