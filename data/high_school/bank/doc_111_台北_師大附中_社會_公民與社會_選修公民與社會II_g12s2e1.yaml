  section: 1
  number: 9
  type: single
  page: 3
  stem: 中國的「全國人民代表大會」自 1995 年以來形成每年在 3 月 3 日開幕的傳統，但 2020 年 2 月，中國的疫情達到高峰期，中國宣布推遲開幕時間，打破 20 多年來的傳統。下列關於「全國人大」的敘述何者正確？
  options:
  - label: A
    content: 全國人大代表立法權，是權力分立的象徵
  - label: B
    content: 國家主席是透過全國人大的代表投票選出
  - label: C
    content: 全國人大具有立法與行政權，立法行政合一
  - label: D
    content: 在黨國體制下，全國人大仍是實質權力機關
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 中華人民共和國全國人民代表大會為《中華人民共和國憲法》規定的中華人民共和國最高國家權力機關，是中華人民共和國國家立法機關。中華人民共和國採取議行合一制度，人民代表大會的法律地位高於行政機關與司法機關，(A)所以並未落實權力分立，但仍有(C)行政機關（國務院）及司法機關（最高人民法院及檢察院）依規定行使職權。(D)在黨國體制下的中國，兩會（全國人民代表大會及政治協商會議）難有效開會，常淪於為黨國當局背書的橡皮圖章，因此全國人大在法理上權力很大，但實際政治實權很小。
