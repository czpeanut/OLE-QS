- id: doc_111_台北_師大附中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 民主國家依法統治，但其作為若違反公平正義侵害到人民基本權利時，統治便不具有正當性。在這樣的情況下，人民具有「公民不服從」的權利，關於此權利的相關敘述何者正確？
  options:
  - label: A
    content: 採取行動時仍必須謹守法律規範
  - label: B
    content: 必須以實現每個人的私利為基礎
  - label: C
    content: 它是一種不具有選擇性的公開違法行為
  - label: D
    content: 參與者可能會受到法律制裁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「公民不服從」是指透過公開、非暴力且基於良知的違法行為，目的在促進政府改變不正義的政策與作為。但民眾須承擔實行公民不服從的後果，有可能會受到法律制裁，正解為(D)。(A)應為違法行為。(B)是以公共利益為目的。(C)是一種具有選擇性的政治行動。
  tags:
    unit:
      code: CI-S2-1-2
      book: 選修公民與社會II 民主政治與法律
      chapter: 民主政治的變遷與發展
      title: 公民不服從
      std: true
