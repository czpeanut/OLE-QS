- id: doc_111_台北_師大附中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 「黨國體制」起源於蘇聯，是指列寧在 1917 年十月革命奪取政權後，作為第一個共產主義的國家，為了權力集中所用的方式。以下比較「黨國體制」與「民主體制」的差異，下列敘述何者正確？
  options:
  - label: A
    content: 黨國體制的軍隊採用軍隊法人化
  - label: B
    content: 兩者的司法都是獨立的
  - label: C
