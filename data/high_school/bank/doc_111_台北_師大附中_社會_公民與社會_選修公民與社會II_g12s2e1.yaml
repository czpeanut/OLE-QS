  type: single
  page: 1
  stem: 「公民不服從有可能在對立衝突後促成社會的進步嗎？」常成為支持者與反對者的爭辯問題。而支持與反對者經常用「惡法非法」與「惡法亦法」的觀點來討論，下列相關敘述何者正確？
  options:
  - label: A
    content: 持「惡法亦法」論者：支持公民不服從，打破惡法規範
  - label: B
    content: 支持公民不服從論者：均認為不需要接受違法處分
  - label: C
    content: 反對公民不服從論者：認為會傷害社會秩序與穩定
  - label: D
    content: 持「惡法非法」論者：反對公民不服從所做的違法行為
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為「惡法非法」論者的觀點。(B)若是支持「惡法亦法」論者，則認為違法行為仍需受到處分，因為惡法仍為法律。(D)此為「惡法亦法」論者的觀點。
  tags:
