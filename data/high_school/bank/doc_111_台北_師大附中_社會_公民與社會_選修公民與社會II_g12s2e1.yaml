  stem: 從 2010 年開始，中國超過日本成為世界第二大經濟體，2014 年中國成為世界上第二個 GDP 邁入 10 萬億美元的國家，而如今的中國 GDP 更是達到了 13.6 萬億美元（接近美國的 70 ％），世界已經從 2010 年之前的一超多強開始轉變，甚至有學者形容為「二超多強」。當前的國際權力結構，下列敘述何者正確？
