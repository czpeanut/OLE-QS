  type: single
  page: 3
  stem: 中國談論政治時常有一些特殊慣稱，比如一把手和二把手，兩人的影響和威嚴卻是天差地遠，很多二把手，終其一生也跨越不到一把手。若以深圳市為例，該市的一把手最可能是下列何者？
  options:
  - label: A
    content: 深圳市委書記（黨委書記）
  - label: B
    content: 深圳市長
  - label: C
    content: 深圳市民代表大會主席
  - label: D
    content: 廣東省省長
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 在共產黨的職務劃分中，書記比起同樣位階的省長或市長更大，在一黨專政國家以黨領政，以黨領軍的政治教條下，書記才是真正的一把手，故選(A)。
