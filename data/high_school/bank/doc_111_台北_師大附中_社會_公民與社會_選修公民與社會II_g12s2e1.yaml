  answer_status: verified
  answer_source: answer_key
  explanation: 依據此位大法官之說法，最高法院的責任是保障人民的權利不受政府之侵害，故並非確保政府的統治權，也不是要確保違憲審查結果符合民意，更不是要維持法規的一致性，而是要制衡政府權力，避免其侵害《憲法》保障的人權，答案選(B)。
