  stem: 18 世紀英國保守主義大師柏克（E. Burke）的名言：「選舉之日即人民裁判政府之日。」這句話放到現代的代議民主最接近下列哪一種觀念？
  options:
  - label: A
    content: 政治人物經由選舉來取得民眾授權
  - label: B
    content: 政治人物透過選舉與選民討論議題
  - label: C
    content: 政治人物透過選舉被選民定期檢視
  - label: D
    content: 政治人物選舉若貪汙將被司法審判
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「選舉之日即人民裁判政府之日」，可知民眾可藉由定期選舉檢視政治人物的作為，並藉此彰顯人民監督政治人物的指標，故選(C)。
