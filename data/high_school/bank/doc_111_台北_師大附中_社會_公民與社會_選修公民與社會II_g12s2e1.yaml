  type: single
  page: 1
  stem: 審議民主和代議民主的核心大不相同，下列關於審議民主與代議民主差異的敘述何者正確？
  options:
  - label: A
    content: 審議民主比代議民主更強調應由菁英帶領討論
  - label: B
    content: 代議民主強調多數決，審議民主則強調共識決
  - label: C
    content: 代議民主又稱間接民主，審議民主又稱直接民主
  - label: D
    content: 審議民主比代議民主更容易發生多數暴力的問題
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)代議民主較強調應由菁英帶領討論。(C)代議民主又稱間接民主，但直接民主應是創制與複決，而非審議民主。(D)因為代議民主強調多數決，所以更容易發生多數暴力的問題。
  tags:
