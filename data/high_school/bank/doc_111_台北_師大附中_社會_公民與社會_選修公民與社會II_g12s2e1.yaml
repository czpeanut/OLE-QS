  options:
  - label: A
    content: 裁判審查結果只影響未來的判決，對聲請個案無拘束力
  - label: B
    content: 對憲法審查結果不服，應向憲法法庭提起非常上訴救濟
  - label: C
    content: 憲法審查只拘束國家公權力機關，對人民不具法律效果
  - label: D
    content: 法規範審查結果具實質憲法的地位，法律命令不得牴觸
  group_stem: '《司法院大法官審理案件法》於民國 82 年 2 月 3 日修正公布施行，全文 35 條，但規範內容簡要，不敷司法實務運作，立法院遂於民國 107 年 12 月進行全面翻修，並正式更名為《憲法訴訟法》，條文也增至 95 條，新制於公布後 3 年施行，使釋憲制度邁入新紀元。《憲法訴訟法》主要包括六大重點：

    (一)全面司法化、裁判化及法庭化

    (二)憲法審查程序更加公開透明

    (三)合理調降憲法審查案件之表決門檻

    (四)引進美國「法庭之友」制度

    (五)引進德國「裁判憲法審查」制度

    (六)明定總統、副總統彈劾案件之審理規定'
