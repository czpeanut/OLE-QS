  stem: 新北市政府舉辦「新北市青年就業公民審議」，希望透過審議民主方式的會議，由下而上蒐集年輕人對創業、就業、職業訓練的意見，作為制訂政策的參考。下列何者「不屬於」上述會議特色？
  options:
  - label: A
    content: 公民之間交流意見訊息
  - label: B
    content: 領袖必須配合群眾輿論
  - label: C
    content: 就相關訊息加以反思
  - label: D
    content: 進行雙方立場的論證
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)皆為審議民主的特色。(B)審議民主重視民眾的討論及溝通，且領袖應參考民眾的意見，但非必須配合群眾輿論，仍應多方考量與衡酌，若過度配合民眾意見反而可能造成民粹主義。
