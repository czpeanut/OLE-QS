  stem: 新冠肺炎（COVID-19）在全球大流行，造成數千萬民眾染疫，因此國家防疫政策及紓困政策的好壞會影響到國家面對疫情時受到的衝擊，但當疫情發生時卻突顯出審議民主的侷限性，這個侷限性最接近下列何者？
  options:
  - label: A
    content: 審議民主的參與者通常為自願，並未得到民意的授權
  - label: B
    content: 涉及國家人民立即性安全問題，無法等待審議民主的共識
  - label: C
    content: 審議民主所形成的共識並未經過多數決的合法化程序
  - label: D
    content: 審議民主的共識決其實也只是建立在菁英的領導討論之上
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 因為疫情是屬於突然且大規模的傳染病，無法讓民眾藉由長時間的溝通討論以凝聚共識，因此可以突顯其侷限為(B)涉及國家人民立即性安全問題，無法等待審議民主的共識。(A)審議民主的群眾本就是代表自身的意見，不需獲得任何人的授權。(C)審議民主的共識若要形成政策仍需經過合法化程序。(D)審議民主的共識決是建立在民眾討論的共識，非菁英領導之討論。
