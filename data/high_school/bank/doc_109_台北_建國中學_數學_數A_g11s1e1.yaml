- id: doc_109_台北_建國中學_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 右圖為三角函數 y＝3 sin（ax－b）的部分圖形，其中 a＞0，則下列各項敘述何者正確？
  options:
  - label: A
    content: B（0，－3）
  - label: B
    content: b＝$\frac{\pi}{6}$
  - label: C
    content: $C \left( \frac{5\pi}{6} , 0 \right)$
  - label: D
    content: y 的週期為$\frac{2\pi}{3}$
  - label: E
    content: 其圖形可由 y＝3 sin3x 向右平移$\frac{\pi}{6}$而得
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_109_台北_建國中學_數學_數A_g11s1e1/s2_1_f1.png
    crop:
      page: 1
      rect:
      - 458.8
      - 513.8
      - 561.5
      - 650.9
  explanation: '由題圖可判斷如下：

    ①振幅為 3$\Rightarrow$A（0，3），B（0，－3）

    ②週期為$\left( \frac{\pi}{2} - \frac{\pi}{6} \right)$×2＝$\frac{2\pi}{a}\Rightarrow$a＝3

    ③ x＝$\frac{\pi}{3}$代入$\Rightarrow$3＝3 sin$\left( 3\times \frac{\pi}{3} - b \right)\Rightarrow$sin（π－b）＝1

    $\Rightarrow$π－b＝$\frac{\pi}{2}$＋2kπ（k 為整數）$\Rightarrow$b＝$\frac{\pi}{2}$－2kπ（k 為整數）

    ④圖形可由 y＝3 sin3x 向右平移$\frac{\pi}{6}$而得$\Rightarrow$y＝3 sin 3$\left( x - \frac{\pi}{6} \right)$＝3 sin$\left( 3x - \frac{\pi}{2} \right)$

    ⑤點 C 的 x 坐標為$\frac{\pi}{2}$＋$\frac{\pi}{3}$＝$\frac{5\pi}{6}$

    故選(A)(C)(D)(E)'
- id: doc_109_台北_建國中學_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 令 tanθ＝u，則下列何者正確？
  options:
  - label: A
    content: sin2θ＝$\frac{2u}{1 + u^{2}}$
  - label: B
    content: cos2θ＝$\frac{1 - u^{2}}{1 + u^{2}}$
  - label: C
    content: tan2θ＝$\frac{2u}{1 - u^{2}}$
  - label: D
    content: sin4θ＝$\frac{4u^{2}}{1 + u^{4}}$
  - label: E
    content: cos4θ＝$\frac{1 - 6u^{2} + u^{4}}{1 + 2u^{2} + u^{4}}$
  explanation: 'tan2θ＝$\frac{2\tan \theta}{1 - \tan ^{2}\theta}$＝$\frac{2u}{1 - u^{2}}$

    $\Rightarrow$sin2θ＝$\frac{2u}{1 + u^{2}}$，cos2θ＝$\frac{1 - u^{2}}{1 + u^{2}}$

    sin4θ＝2 sin2θcos2θ

    ＝2×$\frac{2u}{1 + u^{2}}$×$\frac{1 - u^{2}}{1 + u^{2}}$＝$\frac{4u - 4u^{3}}{1 + 2u^{2} + u^{4}}$

    cos4θ＝$cos^{2}$2θ－$sin^{2}$2θ

    ＝$\left( \frac{1 - u^{2}}{1 + u^{2}} \right) ^{2} - \left( \frac{2u}{1 + u^{2}} \right) ^{2}$

    ＝$\frac{( 1 - u^{2} ) ^{2} - ( 2u ) ^{2}}{( 1 + u^{2} ) ^{2}}$

    ＝$\frac{1 - 6u^{2} + u^{4}}{1 + 2u^{2} + u^{4}}$

    故選(A)(B)(C)(E)'
- id: doc_109_台北_建國中學_數學_數A_g11s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 若 cos2θ為無理數，則下列何者必為無理數？
  options:
  - label: A
    content: cos4θ
  - label: B
    content: cosθ
  - label: C
    content: tan2θ
  - label: D
    content: sinθ
  - label: E
    content: tan$\frac{\theta}{2}$
  explanation: '(A)╳：cos4θ＝2 $cos^{2}$2θ－1 可能為有理數

    (B)○：cosθ＝±$\sqrt{\frac{1 + \cos 2\theta}{2}}$必為無理數

    (C)╳：tan2θ＝$\frac{\sin 2\theta}{\cos 2\theta}$＝$\frac{\pm \sqrt{1 - \cos ^{2} 2\theta}}{\cos 2\theta}$

    可能為有理數

    (D)○：sinθ＝$\pm \sqrt{\frac{1 - \cos 2\theta}{2}}$必為無理數

    (E)○：設 tan$\frac{\theta}{2}$＝t 為有理數

    $\Rightarrow$cosθ＝$\frac{1 - t^{2}}{1 + t^{2}}$＝k 為有理數

    $\Rightarrow$cos2θ＝$2k^{2}$－1 為有理數（矛盾）

    ∴tan$\frac{\theta}{2}$必為無理數

    故選(B)(D)(E)'
