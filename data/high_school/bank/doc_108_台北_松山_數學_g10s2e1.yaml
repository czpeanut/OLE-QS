  stem: 下圖為甲地區2018年冬夏兩季各100天PM $_{2.5}$的濃度直方圖。 試選出正確的選項：
  options:
  - label: A
    content: 夏季PM $_{2.5}$濃度高於25（μg／$m^{3}$）低於20天
  - label: B
    content: 冬季PM $_{2.5}$濃度的第40百分位數（$P_{40}$）在5（μg／$m^{3}$）與15（μg／$m^{3}$）之間
  - label: C
    content: 冬季PM $_{2.5}$濃度的全距大於夏季PM $_{2.5}$濃度的全距
  - label: D
    content: 冬季PM $_{2.5}$濃度的標準差大於夏季PM $_{2.5}$濃度的標準差
  - label: E
    content: PM $_{2.5}$濃度高於35（μg／$m^{3}$）對敏感體質的人不健康，在這200天裡，甲地區對敏感體質族群有害之天數，所占之百分比小於10％
  assets:
