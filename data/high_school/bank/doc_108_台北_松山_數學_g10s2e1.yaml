- id: doc_108_台北_松山_數學_g10s2e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設n為正整數，$a_{1}$ , $a_{2}$ ,…, $a_{n}$為一實數數列，滿足$a_{n+1}$＝$a_{n}$＋$\frac{3n(n +1)}{2}$ 試選出正確的選項：
  options:
  - label: A
    content: 若$a_{1}$＝1，則$a_{2}$＝4
  - label: B
    content: 數列$\left\langle a_{n} \right\rangle$為等差數列
  - label: C
    content: 若$a_{1}$為整數，則此數列每一項都是整數
  - label: D
    content: 若$a_{1}$為無理數，則此數列每一項都是無理數
  - label: E
    content: 設k為正整數，若$a_{k}$是偶數，則$a_{k+2}$都是偶數
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
