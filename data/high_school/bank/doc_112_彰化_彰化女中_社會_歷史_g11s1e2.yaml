  stem: 這個帝國的蘇丹在約半世紀中，有多達 13 次的遠征行動，西至阿爾及利亞、北至黑海與匈牙利，南至埃及，統治範圍橫跨歐亞非三大洲，帝國之中包含 20 多個民族，為了攻擊奧地利維也納甚至與法蘭西王國的國王合作結盟，請問這位蘇丹是誰？
  options:
  - label: A
