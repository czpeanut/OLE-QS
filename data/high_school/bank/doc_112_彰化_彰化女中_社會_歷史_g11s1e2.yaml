- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s2_34
  section: 2
  number: 34
  type: single
  page: 7
  stem: '關於為什麼皈依伊斯蘭教的問題。早期歐洲學者相信伊斯蘭教的皈依是通過刀劍實現的，被征服者要麼選擇皈依要麼選擇死亡，但這樣的情況實際上是很少的。穆斯林的征服者通常所希望的是統治而不是皈依，大多數人都是自願皈依伊斯蘭教。8 ～ 12 世紀的穆斯林統治者給人們皈依提供了實質的刺激。它構成了穆斯林團體的組織的保護傘，而且給予穆斯林宗教生活賦予了國家的威信，包含政治庇護；阿拉伯帝國的建立，使得伊斯蘭教吸引了被征服的拜占庭和波斯的貴族階層；阿拉伯的駐防城市吸引了阿拉伯移民，他們在開放的軍隊和行政領域找到了自己的職業。……儘管有這些誘惑，但是中東地區的大量民族並不是很快或很容易就皈依伊斯蘭教的。隨著穆斯林團體在 10 ～ 12 世紀社會和宗教結構的崩潰，才造成教會的衰弱、穆斯林對非穆斯林敵意的復甦；同時，伊拉克和伊朗土地貴族的毀滅，破壞了非穆斯林民族的公社組織。此後，穆斯林的教長們才能夠在伊斯蘭信仰和認同的基礎上重建地方團體方面佔得先機。

    (1)根據上述，穆斯林的統治者給皈依者提供了實質的刺激，就歷史知識而言，請問「哪一政權」開始開放較多經濟誘因與政治上的誘因？

    (2)根據作者的觀點，穆斯林快速成長在幾世紀後？

    (3)原因為何？'
  options:
  - label: A
    content: 6 ～ 8 世紀
  - label: B
    content: 8 ～ 10 世紀
  - label: C
    content: 10 ～ 12 世紀
  - label: D
    content: 12 ～ 14 世紀
  explanation: '(1)跟奧瑪亞王朝相比，阿拔斯王朝奉行伊斯蘭社群平等精神，接納更多外族進入軍隊與宮廷官僚體系，因此能吸引更多人皈依伊斯蘭教。

    (2)資料指出雖然 8 世紀起，穆斯林的統治者給人們皈依提供了實際的刺激，但是中東地區的大量民族並不是很快或很容易就皈依伊斯蘭教；直到(C) 10 ～ 12 世紀的社會和宗教結構的崩潰，加上伊拉克和伊朗土地貴族的毀滅，穆斯林的教長們才能夠在伊斯蘭信仰和認同基礎上占得先機。

    (3)當時社會和宗教結構的崩潰，造成教會衰弱、穆斯林對非穆斯林敵意復甦、非穆斯林民族的公社組織遭破壞，因此許多人才會認同伊斯蘭信仰，由穆斯林的教長們領導重建地方團體。'
