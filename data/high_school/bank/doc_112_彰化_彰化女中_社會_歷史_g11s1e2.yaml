  answer_source: answer_key
  explanation: 這位以戰爭、集權、文化造勢傳揚自由平等的思想，並能讓歐洲腥風血雨，應為「革命之子」(B)拿破崙。(A)(C)(D)三者皆未以武力向外宣揚自由平等的思想。
