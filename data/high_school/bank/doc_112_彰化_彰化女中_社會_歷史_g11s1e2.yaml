  stem: '請閱讀下列資料：

    從中古時期以來，糖的歷史一直與暴力密不可分。根據記載，西元前 4 世紀甘蔗在印度被馴化為作物。雖然阿拉伯人以武力征服伊比利半島後，將甘蔗引進當地進行大規模栽種，但其他歐洲人是直到十字軍武力挺進耶路撒冷時，才開始熟悉這種新植物。中古時期威尼斯商人利用龐大的商業艦隊和海軍，掌控歐洲的糖貿易。15 世紀開始，鄂圖曼拿下威尼斯人所控制的穆斯林地區，商道受阻的威尼斯商人轉而與葡萄牙人聯手遠航，成功在距非洲陸地不遠的海上發現聖多美島。聖多美島甘蔗農場的開闢，使得蔗糖生產出現革命性且驚人的變革。在這些宛如勞動地獄的農場中，非洲人淪為生產主力。16 世紀的歐洲遽然致富後，更多人有能力消費並享受這種甜味，促使葡萄牙人在巴西擴大甘蔗的種植面積。

    原本已在歐洲銷聲匿跡的奴隸買賣因為糖與「地理大發現」而重獲新生。繼巴西後，加勒比海地區成為甘蔗大農場的重點區域，特別是海地的甘蔗栽種，使全島變成一間大型糖廠與奴隸監獄。17 世紀糖廠可說是最早以工業時間的紀律管理的工廠，各有所司的工人協調合作完成製糖流程，配合機器節省人力卻又極力剝削奴隸人力。一座糖廠動用到兩百名奴隸和自由人，其中九成勞動力在田裡幹粗活，一成專業工人分配在壓榨機、蒸煮室、蒸餾室工作。這樣的模式成功生產出大量蔗糖，讓糖價下跌，這曾經昂貴的香料和藥材搖身一變成為大眾化的日常食品。

    (1)根據資料內容，關於糖的歷史，下列敘述何者正確？

    (2)請根據資料內容，提出一個理由，說明砂糖能由昂貴商品變成大眾食品的原因。（20 字以內）'
  options:
  - label: A
    content: 原產於阿拉伯半島，由阿拉伯人在伊比利半島推廣栽種
  - label: B
    content: 歐洲人首次利用非洲奴隸種植熱帶製糖業的地點在巴西
  - label: C
    content: 蔗糖大規模生產與地理大發現的結合讓奴隸貿易再興起
  - label: D
    content: 威尼斯商人憑藉艦隊和海軍，主宰 17 世紀的糖業貿易
  explanation: '(1)(A)原產於印度。(B)應是非洲的聖多美島。(D)威尼斯商人主宰的是中古的歐洲，17 世紀的糖業貿易重心已轉移到加勒比海地區。

    (2)資料末尾說明，糖廠的製糖流程中以機器節省人力，成功生產出大量蔗糖，才使糖價大跌。'
