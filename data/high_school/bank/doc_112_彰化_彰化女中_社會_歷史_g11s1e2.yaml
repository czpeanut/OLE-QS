- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: '請閱讀下列兩則討論十字軍運動的資料：

    資料一：「即使到現在，他們仍持續努力擴張他們的領土；……他們的貪婪一再膨脹。而且他們現在想要的終局是成為整片國土的主宰，向神祈求，因祂的大慈，他能重建社群（烏瑪）的團結，藉以阻撓他們的企求。」

    資料二：「這裡沒有豐饒的土地，沒有充足的糧食。因此，你們謀殺彼此、發動戰爭，而且經常因相互傷害而死亡。因此，仇恨離間於你們之間。讓你們的爭吵結束吧，讓戰爭停止吧，讓所有爭議都沉寂吧。進入聖墓的道路；我們要從邪惡的種族中奪回土地（耶路撒冷）。……它比其他地方富庶……為了赦免你的罪而前往旅程。」

    請運用上兩則史料以及你的歷史知識判斷下列敘述何者正確？'
  options:
  - label: A
