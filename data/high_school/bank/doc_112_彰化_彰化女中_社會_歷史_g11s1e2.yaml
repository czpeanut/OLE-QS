- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 分析工業革命的初期發展：「紡織業可說是工業革命的火車頭工業，因為生產速度與數量的需要，刺激了蒸汽機的改良及生產機器的發明，開始了英國工業的機械化。」根據上述表示工業革命的發展與何者有關？
  options:
  - label: A
    content: 市場的需求
  - label: B
    content: 交通的便利
  - label: C
    content: 資本的累積
  - label: D
    content: 國力的擴張
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 工業革命最初從紡織業開始，因為有生產速度與數量的需求，才刺激後續的連環發明，因此可知早期工業革命的發展與(A)市場的需求有關。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 歐洲歷史上有位評價兩極的人物，支持者認為他所引領的勢力避免了歐洲戰爭發生的可能，他的外交才能有目共睹，即使他只是不讓歐洲列強知道他的國家在軍事和經濟上已經是外強中乾。他因為召開國際會議撲滅了歐洲的革命之火，而被封為「消防隊長」；但其反對者認為，他堅持其病態的保守主義，僅僅是出於他的虛榮心和不犯錯主義，他們認為本可以為其國家做得更多，而不只是通過行政改革來壓制德意志的民族主義思想，而如此做的結果則是使德國在普魯士的主導下走上統一。請問這位人物是下列何人？
  options:
  - label: A
    content: 威廉一世
  - label: B
    content: 梅特涅
  - label: C
    content: 俾斯麥
  - label: D
    content: 伊曼紐二世
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這位立志撲滅歐洲革命之火的「消防隊長」是(B)梅特涅，曾主持過維也納會議，一心想使歐洲回復到 1789 年以前的狀態，但於 1848 年的革命風潮中下臺。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '每年的 10 月 12 日是美洲國家及西班牙的「哥倫布日」，用以紀念發現美洲新大陸。1992 年，美國、義大利等國紛紛舉行紀念哥倫布航行美洲 500 周年的慶祝活動。但是，加州伯克萊地區率先呼籲使用「原住民日」，取代哥倫布日，至今仍有相當多爭論。以下四段關於「歐洲文明殖民美洲」的評論：

    甲：「1492 年 10 月 12 日，兩大世界首度相遇，四名騎士從西班牙船艦躍下，傳染病一馬當先，飢荒、戰爭、死亡尾隨其後。此後，這四名騎士踏上征途、橫越美洲大陸，所到之處，盡是恐怖。」

    乙：「特諾奇地特蘭（阿茲特克首都）的陷落證明了君王若不懂得體恤民情，必不能長治久安。我們不應該為這個國家的滅亡感到惋惜，因為它是如此吝於提升人民的福祉和全體人類的利益。」

    丙：「西班牙探險家科提斯帶著一批堅強果敢的勇士，勇闖頑強善戰的帝國……皮薩羅則揮軍直搗安地斯高地……他們的成就連小說都沒有這麼精彩，從古到今沒有哪一段歷史能相提並論。」

    丁：「西班牙不是破壞者，因為當西班牙人抵達時，當地根本沒有值得保留的東西，除非有人覺得那些垃圾──野人吃人肉、蠻族殺人獻祭─也算是一種信仰。」

    其中何者的敘述立場與其他三者「不同」？'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)乙丙丁三者皆為西班牙的殖民行為辯護，指責被毀滅的印第安帝國，只有甲主張西班牙人給美洲大陸帶來災難與破壞。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 教宗烏爾班二世發起十字軍運動，號召西歐基督教徒驅趕占領耶路撒冷的穆斯林，請問下列的敘述何者正確？
  options:
  - label: A
    content: 十字軍運動，促使了東西方商品流通，並刺激了西歐商業城市的繁榮
  - label: B
    content: 使得伊斯蘭教內部的什葉派與素尼派願意攜手一同對抗西方的武裝侵略
  - label: C
    content: 從阿拉伯人手中學到火砲技術，成為日後西歐各君主對抗封建領主的利器
  - label: D
    content: 使拉丁民族與阿拉伯民族產生近千年的隔閡，未曾收復失地讓教皇聲望下墜
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)並無此事。(C)火砲是蒙古人傳入。(D)曾一度收復耶路撒冷，但不久又失去。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: '資料一：18 世紀法國的政治統一，容易形成全國性的政治改革與共同輿論，此時期的法國人已意識到自己是國家統一體的成員。革命激發這種成員意識，並加速轉化為對公民身分與投票權的渴望。所以革命爆發時，民眾多以公民自居，高呼國家萬歲，此更鼓舞民眾參與政治改革。

    資料二：18 世紀末的法國報刊，充斥著對美國革命運動與新憲法的報導。民間流傳的小冊子，多記載著王公貴族的桃色緋聞與貪汙傳聞。加上沙龍、咖啡館所培養的批判精神，讓貴族與平民的對立更加明顯且激烈。

    請問上述兩段資料，有何異同？'
  options:
  - label: A
    content: 都是在描述造成財政危機的原因
  - label: B
    content: 都是在描述國民會議的召開結果
  - label: C
    content: 資料一描述輿論對革命的影響
  - label: D
    content: 資料二描述拿破崙出現的歷史意義
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)兩者都未討論到財政危機。(B)兩者都未提到國民會議。(C)為正解。(D)資料二描述法國大革命前的社會現象，與拿破崙無關。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 19 世紀的英國改革當中，論者曾針對其中一次改革的結果有以下的評論：「這次議會改革只是一次小小的變動，並沒有造成重大的體制改革，掌權的仍然是貴族，選舉資格的限制也僅從身分資格轉為財產資格，身分歧視變為財產歧視。工人和貧困農民等社會絕大多數成員仍然在受歧視之列。」請問這個評論指的是下列何次改革？
  options:
  - label: A
    content: 1689 年的權利法案
  - label: B
    content: 1832 年改革法案
  - label: C
    content: 1867 年改革法案
  - label: D
    content: 1884 年改革法案
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從「工人和貧困農民……仍在受歧視之列」的說法，顯見此時只有中產階級獲得選舉資格，因此這個評論所檢討的是(B) 1832 年改革法案。(A)選舉資格只有地主貴族。(C)部分工人已有選舉資格。(D)社會絕大多數成員都獲有選舉資格。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_7
