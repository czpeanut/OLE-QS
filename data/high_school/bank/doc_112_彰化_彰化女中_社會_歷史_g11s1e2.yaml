  - label: B
    content: 鄂斯曼
  - label: C
    content: 麥何密一世
  - label: D
    content: 蘇里曼一世
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為鄂圖曼土耳其帝國，國勢於(D)蘇里曼一世任內達到巔峰。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 在歐洲史的觀念中，15 世紀是世界史的開端，其中最驚人的事蹟不外乎「發現美洲」新大陸，大航海時代作為人類歷史上重要的轉折點，下列哪一<u>並非</u>是其影響？
  options:
  - label: A
    content: 西歐等國突破印度洋為「伊斯蘭之海」局面向東發展，歐洲在擴張中逐步掌握經濟制高點
  - label: B
    content: 基督宗教的世界觀與羅馬教廷在政治型態的解釋權連帶瓦解，衝擊《聖經》記述的歷史理論
  - label: C
    content: 西班牙人來到新大陸之後，造成了全球性的生物交換衝擊，如將馬鈴薯等作物傳至歐洲
  - label: D
    content: 威尼斯和熱那亞等義大利城市受惠於地理大發現的香料貿易，都市更加繁榮與迅速發展
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)大航海時代來臨後，義大利城市失去了地理位置優勢而衰退，歐洲政經重心由地中海地區轉向大西洋沿岸。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 1651 年英國通過《航海法》，其主要內容為：「政府指定某些殖民地產品只准許販運到英國本土或其他英國殖民地，且英國或其殖民地所擁有、製造的船隻可以運裝英國殖民地的貨物，他國的產品，必須經由英國本土課稅，而不能直接運銷殖民地。」其背後理念與下列何者相同？
  options:
  - label: A
    content: 努力累積該國的貴重金屬，如黃金、白銀的數量，避免貴重金屬外流國外
  - label: B
    content: 政府鼓勵新興中產階級，經由投資、設工廠而致富，累積資本再賺取利潤
  - label: C
    content: 市場投資的決定由私人進行，生產和銷售由公司控制，國家鼓勵互相競爭
  - label: D
    content: 國家提倡整個社會作為整體，以公平為理念，其管理和分配基於公眾利益
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從英國《航海法》的內容來看，是受到重商主義的影響，相信「財富即實力」，因此由國家政府主導經濟發展，著重累積黃金、白銀等貴重金屬，(A)的作法即符合該理念。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 「即使不談僱傭勞動制度中包含的一般奴隸狀態，工人階級也不應該誇大這種日常鬥爭的最終效果。他們不應該忘記：在日常鬥爭中，他們反對的只是結果，而不是產生這種結果的原因……。他們應該要認識到：現代制度給他們帶來一切的貧困……『他們應該摒棄做一天公平的工作，得一天公平的工資』」上述是某位社會主義學者對於資本主義的批評，請問這位社會主義學者認為該如何改善工人的處境？
  options:
  - label: A
    content: 排斥階級鬥爭，透過選舉投票改變制度以解決問題
  - label: B
    content: 縮短工人的勞動時間，改善福利條件，提高工資
  - label: C
    content: 建立小型的同居社，各選其專長並合理分配利潤
  - label: D
    content: 工人解放，應由工人階級爭取，應由下而上革命
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文為馬克思對資本主義的批評，從「他們應該摒棄做一天公平的工作，得一天公平的工資」一句，顯示工人不應該奢望會有「公平的工資」出現，根本解決之道應是消滅帶來貧困的現代制度，也就是僱傭勞動制度，因此答案為(D)。
- id: doc_112_彰化_彰化女中_社會_歷史_g11s1e2_s1_11
  section: 1
