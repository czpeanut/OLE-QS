  stem: 拿破崙在1817年3月3日的日記寫道：「我打了五十次激戰，幾乎每次都取得勝利。我設計並編纂成型的一部法典，這部法典使我的名字永傳後世。我白手起家，成為世界上最強大的君主，歐洲在我腳下。……我始終認為君權基於人民。事實上，帝國政府是一種共和國。民族召喚我成為其首領，我的信條是不分出身或財產，有能者居之，而這種平等的制度就是你們寡頭政府如此痛恨我的原因。」根據拿破崙的自述，他之所以遭到各國政府痛恨的主要因素為何？
