- id: doc_111_新北_新北高中_數學_數A_g11s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 2
  stem: '試求下列各式之值：

    (1) $\log _{\sqrt{10}}1000$＝＿＿＿＿。

    (2) $\log 6 + \log \frac{5}{4} - \log 9 + \log 12$＝＿＿＿＿。

    (3) $\frac{1}{\log _{2}100!} + \frac{1}{\log _{3}100!} + \frac{1}{\log _{4}100!} +\cdots \cdots + \frac{1}{\log _{100}100!}$＝＿＿＿＿。'
  answer:
  - (1) 6；(2) 1；(3) 1
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $\log _{\sqrt{10}}1000$＝$\log _{10^{\frac{1}{2}}}10^{3}$＝$\frac{3}{\frac{1}{2}}\log _{10}10$＝6

    (2) $\log 6 + \log \frac{5}{4} - \log 9 + \log 12$＝$\log \frac{6 \times \frac{5}{4} \times 12}{9}$＝log10＝1

    (3) $\frac{1}{\log _{2}100!} + \frac{1}{\log _{3}100!} + \frac{1}{\log _{4}100!} +\cdots \cdots + \frac{1}{\log _{100}100!}$

    ＝$log_{100!}$2＋$log_{100!}$3＋$log_{100!}$4＋……＋$log_{100!}$100

    ＝$log_{100!}$（2×3×4×……×100）

    ＝$log_{100!}$100!

    ＝1'
- id: doc_111_新北_新北高中_數學_數A_g11s1e2_s2_2
  section: 2
  number: 2
  type: fill
  page: 2
  stem: '求解下列不等式：

    (1) $4^{x＋1}$－5．$2^{x}$＋1$\leq$0。$答$：＿＿＿＿ 。

    (2) $log_{3}$（x－1）＞$log_{9}$（7－x）。$答$：＿＿＿＿ 。'
  answer:
  - (1) －2$\leq$x$\leq$0；(2) 3＜x＜7
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $4^{x＋1}$－5．$2^{x}$＋1$\leq$0

    $\Rightarrow$4．（$2^{x}$）$^{2}$－5．$2^{x}$＋1$\leq$0

    $\Rightarrow$（4．$2^{x}$－1）（$2^{x}$－1）$\leq$0

    $\Rightarrow\frac{1}{4}\leq2^{x}\leq$1

    $\Rightarrow2^{－2}\leq2^{x}\leq2^{0}$

    $\Rightarrow$－2$\leq$x$\leq$0

    (2) $log_{3}$（x－1）＞$log_{9}$（7－x）

    ① x－1＞0$\Rightarrow$x＞1

    ② 7－x＞0$\Rightarrow$x＜7

    ③$\log _{3^{2}}(x - 1)^{2}$＞$log_{9}$（7－x）

    $\Rightarrowx^{2}$－2x＋1＞7－x

    $\Rightarrowx^{2}$－x－6＞0

    $\Rightarrow$（x－3）（x＋2）＞0

    $\Rightarrow$x＞3 或 x＜－2

    由①、②、③知 3＜x＜7'
