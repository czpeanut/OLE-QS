  stem: 設 a＝$log_{2}$3，b＝$log_{3}$7，試以 a，b 表 $log_{6}$21＝＿＿＿＿。
  answer:
  - $\frac{a + ab}{1 + a}$ 4.27 5.4 6.13 7.$\frac{4}{27}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}a = \log _{2}3\cdots \cdots \cdots ① \\ b = \log _{3}7\cdots \cdots \cdots ②\end{cases}$

    由①×②得 ab＝$log_{2}$3×$log_{3}$7＝$log_{2}$7

    故 $log_{6}$21＝$\frac{\log _{2}21}{\log _{2}6}$＝$\frac{\log _{2}3 + \log _{2}7}{\log _{2}2 + \log _{2}3}$＝$\frac{a + ab}{1 + a}$'
- id: doc_111_新北_新北高中_數學_數A_g11s1e2_s2_4
  section: 2
  number: 4
  type: fill
  page: 2
  stem: 設指數函數 y＝$a^{x}$ 的圖形上有三點（p，q），（r，s），（u，v）。已知 r－p＝2，u－r＝3，且 s＝9q。試求$\frac{v}{s}$之值＿＿＿＿。
  explanation: '∵y＝$a^{x}$ 過（p，q），（r，s），（u，v）三點

    ∴$\begin{cases}a^{p} = q\cdots \cdots \cdots ① \\ a^{r} = s \cdots \cdots \cdots ② \\ a^{u} = v \cdots \cdots \cdots ③\end{cases}$

    由$\frac{②}{①}$得$\frac{a^{r}}{a^{p}}$＝$\frac{s}{q}\Rightarrowa^{r－p}$＝$\frac{s}{q}\Rightarrowa^{2}$＝$\frac{s}{q}$ ……………④

    由$\frac{③}{②}$得$\frac{a^{u}}{a^{r}}$＝$\frac{v}{s}\Rightarrowa^{u－r}$＝$\frac{v}{s}\Rightarrowa^{3}$＝$\frac{v}{s}$ ……………⑤

    又 s＝9q 代入④得 $a^{2}$＝$\frac{9q}{q}$＝9

    ∵a＞0$\Rightarrow$a＝3

    代入⑤得$\frac{v}{s}$＝$a^{3}$＝$3^{3}$＝27'
