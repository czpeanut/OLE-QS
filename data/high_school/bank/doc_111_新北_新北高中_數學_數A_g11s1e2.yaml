- id: doc_111_新北_新北高中_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些對數的尾數與 log338 的尾數相同？
  options:
  - label: A
    content: log33800
  - label: B
    content: $\log \frac{1}{338}$
  - label: C
    content: log0.000338
  - label: D
    content: log33.8－log1000
  - label: E
    content: $log338^{10}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '∵log338＝log（3.38×$10^{2}$）＝$log10^{2}$＋log3.38＝2＋ log3.38

    ∴尾數為 log3.38

    (A)○：log33800＝log（3.38×$10^{4}$）＝$log10^{4}$＋log3.38

    ＝4＋log3.38

    (B)╳：$\log \frac{1}{338}$＝$log338^{－1}$＝－log338＝－（2＋log3.38）

    ＝－3＋（1－log3.38）

    ∴尾數為 1－log3.38

    (C)○：log0.000338＝log（3.38×$10^{－4}$）＝$log10^{－4}$＋log3.38

    ＝－4＋log3.38

    (D)○：log33.8－log1000＝（1＋log3.38）－3

    ＝－2＋log3.38

    (E)╳：$log338^{10}$＝10×（log338）＝10×（2＋log3.38）＝20＋10×log3.38 ………①

    又 log338＝2＋log3.38 ……………………………………………………②

    由①－②得 $log338^{10}$－log338＝18＋9×log3.38 不為正整數

    故 $log338^{10}$ 與 log338 尾數不相同

    故選(A)(C)(D)'
- id: doc_111_新北_新北高中_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 已知 a＞0，a≠1，b＞0，n、m 為非零任意實數，則下列敘述何者正確？
  options:
  - label: A
    content: log（a＋b）＝loga×logb
  - label: B
    content: $\log \frac{a}{b}$＝loga÷logb
  - label: C
    content: log（－a）$^{2}$＝2 log（－a）
  - label: D
    content: $\log _{a^{n}}b^{n}$＝$\log _{a^{m}}b^{m}$
  - label: E
    content: $a^{\frac{\log b}{\log a}}$＝b
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：應更正為 log（a×b）＝loga＋logb

    (B)╳：應更正為$\log \frac{a}{b}$＝loga－logb

    (C)╳：應更正為 log（－a）$^{2}$＝$loga^{2}$＝2 loga（∵a＞0）

    (D)○：$\log _{a^{n}}b^{n}$＝$\frac{n}{n}\log _{a}b$＝$log_{a}$b＝$\frac{m}{m}\log _{a}b$＝$\log _{a^{m}}b^{m}$

    (E)○：$a^{\frac{\log b}{\log a}}$＝$a^{\log _{a}b}$＝b

    故選(D)(E)'
