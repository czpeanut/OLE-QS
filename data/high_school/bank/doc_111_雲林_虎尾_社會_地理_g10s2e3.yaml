    content: 甲乙丁
  group_stem: '下列為有關日本的 4 篇報導。請問：

    甲：「日本小笠原諸島的西之島附近出現因噴發而形成的『新島』。日本海上保安廳表示，由於火山熔岩填埋海面使東側陸地面積增加，新島的面積比剛形成時擴大約 1.5 倍。」

    乙：「有多少地方就有多少方言，有多少方言也就有多少告白方式。如果不是同鄉的異性告白，用方言反而可能發生奇蹟。」

    丙：「東京的築地市場是國際聞名的，每日在 4 時多晨昏時分即開始作業，新鮮海產的流動量與金錢交易之高，難以想像。一尾巨大的肥美鮪魚，投標價格可以超過 10 萬美金。」

    丁：「日本長野地獄谷的雪猴泡湯，已經是受遊客歡迎的奇景，伊豆仙人掌公園季節限定的水豚泡湯，也令人直呼超可愛！」'
