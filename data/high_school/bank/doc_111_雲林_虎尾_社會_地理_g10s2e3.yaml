  group_stem: '《斯卡羅》電視劇 2021 年上映，描述一個曾經活躍於臺灣屏東一帶的原住民族群，也就是現在○○族的前身。<u>1867 年初，斯卡羅殺害了因船難而誤闖原住民領地的 12 名美國船隻羅妹號（The Rover）船員。當時，斯卡羅族稱斬首船員，目的是為了幫祖先報仇，但卻因此將剛開港的南臺灣推上世界舞臺，並引發一場國際衝突</u>。此事件的主角之一──李仙得，經此一事後了解清朝對原住民的政策，進而唆使日本統治者，間接引發了事後的臺日交鋒。

    隨著電視劇的播放，許多遊客重遊電視劇取景的地點，包含舊名「瑯嶠」的恆春鎮、斯卡羅人翻山越嶺的「瑯嶠卑南古道」（俗稱的阿朗壹古道）、社頂凌霄亭及擁有高位珊瑚礁與熱帶季風林的墾丁國家森林遊樂區等，紛紛出現許多遊客，好奇的探索充滿歷史痕跡的地點。

    作者陳耀昌說：《傀儡花》改編成電視劇《斯卡羅》之前，我也沒有想到一個電視劇的力量是這麼大，因為這一部戲，變成臺灣人幾乎是全民運動，來追尋臺灣史，追尋自己的身世。（參考資料：美國之音）請問：'
