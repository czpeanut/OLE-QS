  group_stem: '2020 年初，嚴重特殊傳染性肺炎（COVID-19，又稱武漢肺炎、新型冠狀病毒肺炎）肆虐中國，在 2 月 3 日春節假期結束之後，境內多數的製造業宣布延期復工，從電子零件、汽車、手機、遊戲機、護膚品，再到治療高血壓、抑鬱症等的藥品，均列為停工的範疇，嚴重衝擊全球產業供應鏈，從上游的原料生產，乃至中、下游的加工環節無一不受影響。

    例如全球最大的 iPhone 製造商富士康，其中國廠房被迫停工 1 個月，並且不得不透過額外獎金吸引職員復工；而美國一家煙火公司因「花炮之鄉」中國瀏陽市遲遲不復工而無法出貨；日本神奈川的一家墓碑公司，則因需從中國進口便宜的花崗岩作原料，從二月中旬起不得不暫時歇業。

    各國過度依賴「中國製造」的窘況，在疫情蔓延全球後逐漸浮現，也讓全球產業鏈傳出斷裂的聲響。這些企業原先翹首以待中國貨源，如今開始擔心中間產品無法出貨，或因本土市場的需求下跌，紛紛取消或縮減訂單。

    1980 年代，中國以大量廉價勞力、完備的基礎設施、政策補貼等方式吸引一眾跨國公司投資，進而擁有聯合國產業分類中全部的工業門類，其中有 200 多種品項的產量更居於全球第一，無國可比，此成就讓中國成為 120 多個國家的最大交易夥伴，在全球分工體系之下占有舉足輕重之地。

    如今，鑒於中國是口罩、醫療設備、抗生素等基礎藥品的主要出口國，不少國家擔憂若流行病、戰爭等極端情況爆發，將隨時面臨藥品短缺、醫療體系崩潰。而美國總統川普則趁機再次鼓勵醫藥企業回歸「美國製造」，擴大對本土產藥品及醫療產品的需求。預計這場疫情災難，將再次掀起中美兩國另一場醫藥的貿易大戰。

    ■ 新聞名詞解說

    <u>中間產品：產品從初級產品加工至最終消費的生產過程中，處於加工過程中的產品統稱中間產品。例如棉花是初級產品，投入生產過程後得到的棉紗、色布、服裝面料等，都是中間產品。</u>

    請問：'
