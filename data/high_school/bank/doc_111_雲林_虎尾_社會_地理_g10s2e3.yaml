  group_stem: '下表為臺北、臺中、高雄 3 個氣象測站，在 2016 年 6 月的降水與氣溫日變化資料，其中 6／10 ～ 6／19 期間，有一波鋒面過境。請問：

    | 日期 |  | 6／10 | 6／11 | 6／12 | 6／13 | 6／14 | 6／15 | 6／16 | 6／17 | 6／18 | 6／19 |

