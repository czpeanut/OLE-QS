  answer_status: verified
  answer_source: answer_key
  explanation: '從降水的資料中可以看到，6／10 ～ 11 以高雄的降水較多，接下來 6／13 臺中有較多降水，然後 6／17 以臺北降水較多，故降水的中心區域有往北移動的情形，故選(D)，往東海的區域移動。

    17.6 月分的降水，逐漸向北移動，判斷應為滯留鋒面，故在鋒面過後，太平洋高壓籠罩，天氣轉為高溫晴朗，故選(C)。

    18.斯卡羅所在的位置為屏東縣的恆春，故選(C)排灣族。

    19.寒假到恆春半島可以看到石灰岩地形的景觀，故選(D)。(A)恆春冬季強勁的風，應為「落山風」非九降風。(B)墾丁為珊瑚礁海岸，非谷灣式海岸。(C)季風雨林在冬季會落葉，但並不會整片森林光禿禿的，因為地面會有灌木叢。

    20.離水作用指的是陸地隆起，故選(C)高位珊瑚礁。過去在海平面附近的珊瑚礁隨著陸地上升隆起，成為高位珊瑚礁。

    21.日本因為板塊接觸而有火山作用（甲報導），因地形崎嶇，所以有許多區隔的地方方言（乙報導），並有火山的溫泉作用（丁報導），故選(D)。

    22.正確答案為(A)。(B)人口多集中在本州島的太平洋沿岸。(C)日本為板塊交界的新褶曲山脈。(D)本州島東岸沿海受黑潮的影響，1 月月均溫會高於西岸沿海。

    23.(B)為韓國擁有的人文特色。(A)(C)(D)皆為日本特有的自然與人文特色。

    24.(C)春季蒙古高壓依然強勁，故可能受到高壓的影響擴散到臺灣上空。(A)黑潮往北流動，因此不會影響到臺灣。(B)福島電廠位於太平洋側，故非中國沿岸流的影響範圍。(D)春季的亞洲太平洋非高壓籠罩區。

    25.臺灣的高科技產業使用日本的零組件與原料，對於彼此之間的產業關係相當緊密，故選(D)空間分工鏈。

    26.甲報導，韓國與全球三大經濟體簽署 FTA，應在 2014 年左右；乙報導，韓國發展重化工業，應位於 1980 年代；丙報導，韓國受到 1997 年東南亞金融危機的波及。故前後順序為(C)乙丙甲。

    27.依丙報導，韓國體質應修改為：(A)以大企業為主；(C)缺乏彈性；(D)資金、資源都挹注在大企業，造成國內貧富差距大，故選(B)。

    28.全國能源消費量最少，可知甲為臺灣；全國能源消費量最高，人均消費量少，可知乙為中國；全國能源消費量第三高，可知丙應為韓國；全國能源消費量第二高，可知丁為日本。故人口數最多的為中國，故選(B)乙。

    29.中國因為農耕、放牧活動造成嚴重的土壤鹽鹼化，故選(B)乙。

    30.因為汞汙染爆發水俣病，以及鎘汙染而爆發痛痛病的為日本，故選(D)丁。

    31.從兌匯率可以發現，日圓比美元，數值愈來愈少，故 1 美元可換的日圓變少，屬於日圓升值的狀況，有利進口。故選(B)。

    32.從匯率變動可以看出日圓升值，故(B)日本國民出國旅遊的情況會增加。(A)日圓升值，不利出口。(C)無法解讀利率的數據。(D)房地產由於日圓升值，會呈現熱絡的交易情形。

    33.日本西岸全年多雨的原因為西岸沿海有西北季風帶來日本海的水氣，故選(A)。

    34.日本的工業區位於沿海地區，是因為日本(B)缺乏能源礦產，所以需要進口原料，故工業區大多位於沿海港口地區。

    35.火山除了帶來災害之外，也有溫泉、地熱等觀光資源，故選(D)。

    36.韓國經濟成長的危機，對照其時間點ㄅ點位於 1980 年，應為(甲)石油危機；ㄆ點位於 1998 年，故為受(丙)亞洲金融風暴，故選(B)。

    37.日本發展汽車產業的過程中，遇到(甲)石油危機，轉為發展省油輕便的小車，讓其汽車受到國際市場的青睞。故選(A)。

    38.仰賴中國製造中間產品的歐美企業若取消或縮減訂單，會造成(甲)國際原油期貨的價格下降、(丁)中國的碳排放量因沒有生產而降低。故選(B)。(乙)中國產能過剩的問題應該無法解決。

    39.1980 年代，中國以大量廉價的勞力、政策補貼等方式吸引外資投資，使中國成為世界的工廠，故選(D)丁：東南沿海的深圳、珠海等地區。

    40.中國以「世界工廠」之姿，大量行銷廉價產品，會使已開發國家將產業外移到中國，造成(B)已開發國家產業空洞化。

    41.甲國的 GDP 最高，應為美國；乙國在 1980 年代之後，GDP 才成長快速，故應為中國；丙國的 GDP 第 3 高，應為日本；丁為韓國。故中國應為(B)乙國。

    42.(A)丁為韓國，其經濟主要倚靠大型企業。(B)為日本。(C)為中國。

    43.丙為日本，其經濟成長停滯或崩跌的原因，應為 1985 年《廣場協議》，日圓升值，與政府提升利率，使經濟泡沫破滅有關，故選(D)。

    44.可以發現「胡煥庸線」將中國分為東南部與西北部，因此該線大概可以切分(甲)農牧分界；(丁)溼潤、乾燥分界；(戊)人口稠密與稀疏區的分界，故選(B)。(乙)一穫區與二穫區的分界為長城，應是受到溫度的影響；(丙)水道和小麥的分界為秦嶺、淮河。

    45.中國為促進西部發展，有(甲)西氣東輸；(乙)西電東送；(戊)青藏鐵路的興建，故選(D)。(丙)振興老工業，為振興東北工業區；(丁)沿海經濟開放政策，為促進東部的經濟發展。

    46.A 至 B 的剖面圖可以看到青藏高原、四川盆地與長江中下游平原，故選(A) 30°N。

    47.中國北京於 1950 年代以來的某種天氣現象，可以從圖中得知：此現象在 3、4 月（春季）的時候為高峰期，故選(D)沙塵暴。(A)降雪在冬季。(B)豪雨的高峰應在夏季。(C)焚風則全年皆有可能。

    48.題目中指寧波乘船出逃，船隻可在江南沿海躲藏，因此這是利用東南沿海地區為谷灣式海岸，海岸曲折、島嶼眾多的特性，故選(D)。

    49.長江流域地勢低窪、雨季常淹大水，其雨季主要在(乙) 6、7 月，屬滯留鋒面的(丁)鋒面雨，故選(D)。

    50.中國兩湖盆地容易淤積的原因為(A)坡度減緩。(C)應為流速減慢。(D)應為流輻變寬。'
