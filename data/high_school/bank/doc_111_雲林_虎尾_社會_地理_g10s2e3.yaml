  stem: 臺灣早期來自中國的漢人主要為泉州人、漳州人及客家人，其傳統分布區域特徵如下：甲集中分布於桃竹苗丘陵臺地及高屏六堆（美濃）等地；乙主要分布於西部沿海平原與港口周邊；丙多分布於內陸平原與近山平原地帶。請問甲、乙、丙依序代表下列哪一組？
  options:
  - label: A
    content: 漳、泉、客
  - label: B
    content: 客、泉、漳
  - label: C
    content: 漳、客、泉
  - label: D
    content: 泉、客、漳
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)分布在竹、苗、高雄美濃等地區，因此為客家人的分布；(乙)分布在海邊，應為泉州人；(丙)分布在平原地區，應為漳州人。故甲乙丙為(B)客、泉、漳。
