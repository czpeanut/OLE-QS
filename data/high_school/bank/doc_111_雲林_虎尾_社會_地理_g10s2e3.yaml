  group_stem: '下列是有關韓國經濟的 3 篇報導。請問：

    甲：「美國、歐盟和中國全球三大經濟體都成了韓國的 FTA 經濟領土。未來韓國的 FTA 經濟領土規模可望繼續擴大。目前韓國正與紐西蘭和越南等國進行 FTA 談判，很有可能在年內達成。若包括日後可能簽訂的中日韓 FTA 和區域全面經濟夥伴協定（RCEP），韓國經濟領土占世界比重會更寬闊。

    乙：「由於積極扶植重化工業發展及努力拓展工業產品為主的出口，重化工業生產占製造業總生產比重超過 50 ％。」

    丙：「因半導體國際價格急速下跌，出口環境惡化，使韓國企業之庫存快速增加，這種生產過剩現象使過度借貸之韓國企業還款困難，呆帳由企業擴展至金融機構和證券公司，以成長至上的『韓國體質』加上受到東南亞金融危機之波及，終於使韓國成為 OECD 加盟國中第一個受 IMF 接管經濟的國家。」'
