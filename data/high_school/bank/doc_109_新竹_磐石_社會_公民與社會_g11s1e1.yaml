  stem: 小宜和小潔都是裁縫家；小宜1天可以縫4雙襪子或3條手帕；小潔1天可以縫5雙襪子或3條手帕。則小宜在縫手帕方面具有何種條件？
  options:
  - label: A
    content: 稀少性
  - label: B
    content: 生產無效率
  - label: C
    content: 絕對利益
  - label: D
    content: 比較利益
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 瑪莉的父母要求她每晚12點就寢，但補完習回家都已經10點了；瑪莉必須要在逛網拍和寫作業之間進行抉擇，其原因為何？
  options:
  - label: A
    content: 資源充分
  - label: B
    content: 資源有限
  - label: C
    content: 無法選擇
  - label: D
    content: 經濟效益
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 月光香麵包店的師傅每天可以烘培40條吐司或20條法國麵包。請問：該師傅烘培1條吐司的機會成本為何？
  options:
  - label: A
    content: 0.5條
  - label: B
    content: 1條
  - label: C
    content: 1.5條
  - label: D
    content: 2條 法國麵包
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 阿傑是名漁夫，他每小時可捕6條魚，或者在每小時撿拾24個貝殼，他每天會把漁獲拿去黃昏市場賣。而在市場上，1條魚可賣15元，1個貝殼可賣3元，則同樣的一小時內，對於阿傑的機會成本的敘述何者正確？
  options:
  - label: A
    content: 阿傑1條魚的機會成本為5個貝殼
  - label: B
    content: 若阿傑選擇抓魚，則抓魚的機會成本為75元
  - label: C
    content: 若阿傑選擇撿拾貝殼，則撿拾貝殼的機會成本為90元
  - label: D
    content: 撿1個貝殼的機會成本為$\frac{1}{3}$條魚
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 阿爸在公司的薪水每天1,500元。工作時間早上9點到下午5點，每小時加班費150元，阿爸每天固定上班到晚上9點。在西洋情人節這天，阿爸決定5點準時下班和阿母去約會，和阿母吃了頓浪漫的燭光晚餐，餐費2,000元由阿爸買單。請問：阿爸與阿母共度浪漫情人節的機會成本為何？
  options:
  - label: A
    content: 4,100元
  - label: B
    content: 2,500元
  - label: C
    content: 2,000元
  - label: D
    content: 1,500元
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 新北市政府正評估一立體停車場之建設案。不論今年或明年蓋好均需花成本9,000萬元，但如於今年蓋好，今年將會帶給周圍商家約5,000萬元的商機。請問：於明年蓋立體停車場的機會成本為何？
  options:
  - label: A
    content: 4,000萬元
  - label: B
    content: 5,000萬元
  - label: C
    content: 19,000萬元
  - label: D
    content: 1億4,000萬元
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列何者<u>不會</u>造成商品「需求」（demand）的變動？
  options:
  - label: A
    content: 互補品與替代品的價格
  - label: B
    content: 對未來價格的預期
  - label: C
    content: 消費者的人數
  - label: D
    content: 商品在當下的價格
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列哪一種現象<u>不符合</u>「供不應求」？
  options:
  - label: A
    content: 石油的價格一直向上攀升
  - label: B
    content: 航空公司徵求50名培訓機師，有1,000名來應徵
  - label: C
    content: 顧客一直換不到超商的公仔，氣得破口大罵
  - label: D
    content: 拍賣市場的黃牛票為原價的三倍
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 咖啡與奶精為互補品，下列何者會造成奶精的需求線右移？
  options:
  - label: A
    content: 咖啡的價格下降
  - label: B
    content: 消費者偏好降低
  - label: C
    content: 咖啡的價格上升
  - label: D
    content: 製造奶精的成本下降
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 政府為了打壓房價，祭出課徵「奢侈稅」的政策，試圖平抑不斷飆漲的房價。請問：此舉對於房市造成的影響為何？
  options:
  - label: A
    content: 供給減少
  - label: B
    content: 供給增加
  - label: C
    content: 供給量減少
  - label: D
    content: 供給量增加
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 關於市場交易，下列敘述何者正確？
  options:
  - label: A
    content: 消費者願付價格高於交易成本即可以交易
  - label: B
    content: 消費者願付價格低於社會總成本仍可能交易
  - label: C
    content: 消費者願付價格高於社會總成本才可以交易
  - label: D
    content: 消費者願付價格高於製造成本與交易成本即可以交易
