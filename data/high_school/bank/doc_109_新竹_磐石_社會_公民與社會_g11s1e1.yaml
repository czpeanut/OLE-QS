- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 經濟學上的供給（Supply）是指在其他條件不變的情形下，於特定時間內，某商品的價格與供給量的關係。請問：供給法則是指在其他情況不變之下，一種財貨
  options:
  - label: A
    content: 供給的增減與價格漲跌成同方向變動
  - label: B
    content: 供給的增減與價格漲跌成反方向變動
  - label: C
    content: 供給量的增減與價格漲跌成反方向變動
  - label: D
    content: 供給量的增減與價格漲跌成同方向變動
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 日本在2011年遭遇世紀強震並引發大海嘯，東北地區災情慘重，無論農產品或工業產品都受到重創。若以工業產品為橫軸，農業產品為縱軸，則此次「日本東北大地震」會造成「生產可能曲線」如何變動？
  options:
  - label: A
    content: 整條生產可能曲線往內移動
  - label: B
    content: 整條生產可能曲線往外移動
  - label: C
    content: 生產組合點沿著原來的生產可能線往右移動
  - label: D
    content: 生產組合沿著原來的生產可能線往左移動
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 在其他條件不變的情形下，開放外國水梨進口，會使得我國水梨市場的供需有何變化？
  options:
  - label: A
    content: 需求不變，供給增加
  - label: B
    content: 需求增加，供給不變
  - label: C
    content: 需求增加，供給增加
  - label: D
    content: 需求減少，供給減少
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: Uber以「共用經濟」的概念成功地顛覆了傳統計程車行業，造成國內計程車行業的困境，假設我國政府對傳統計程車採取油價補貼政策，則計程車的供給線與需求線將如何變動？
  options:
  - label: A
    content: 需求線往右方移動
  - label: B
    content: 需求線往左方移動
  - label: C
    content: 供給線往右方移動
  - label: D
    content: 供給線往左方移動
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 隨著嚴重特殊傳染性肺炎（COVID-19）的感染個案及死亡人數在法國持續增加，羅浮宮員工在政府及館方尚未有任何決議前，先行以投票結果298票同意對比2票反對，選擇罷工閉館，避免在接觸各國旅客時暴露於高風險之下。請問：何人在產品與要素市場中扮演的角色與羅浮宮員工相同？
  options:
  - label: A
    content: 購買口罩原料的工廠
  - label: B
    content: 販賣75％酒精的藥局
  - label: C
    content: 驗嚴重特殊傳染性病毒（COVID-19）的醫檢師
  - label: D
    content: 因染疫而住院的民眾
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 好萊塢女星派特洛出版食譜書與粉絲分享養生食物，卻引來不少批評，因為在大型超市中價格遠低於新鮮蔬果、肉類的微波食品，才是窮人們的購物首選，而這些不健康的食物正是使窮人趨於肥胖的元兇。請問：對於養生食物與微波食品之敘述何者正確？
  options:
  - label: A
    content: 當窮人的收入增加，購買的微波食品數量也會增加
  - label: B
    content: 當窮人意識自己的肥胖問題，就會減少買微波食品
  - label: C
    content: 微波食品對窮人而言屬於正常財，所得增就會多買
  - label: D
    content: 微波食品對窮人而言屬於劣等財，所得增就會少買
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 根據上文敘述，若政府致力於居住正義，實現住者有其屋，因此訂定房價的上限，將會導致房市出現下列何種現象？
  options:
  - label: A
    content: 供過於求
  - label: B
    content: 供不應求
  - label: C
    content: 消費者剩餘減少
  - label: D
    content: 生產者剩餘增加
