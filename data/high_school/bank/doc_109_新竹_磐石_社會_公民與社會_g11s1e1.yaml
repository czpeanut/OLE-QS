  section: 1
  number: 12
  type: single
  page: 1
  stem: 附表為X國生產蘋果、香蕉兩種商品的生產可能組合。該表顯示，生產第1、第2、第3以及第4單位蘋果的機會成本，分別為1單位、2單位、3單位以及4單位的香蕉。請問：有關該生產可能組合的敘述，何者正確？
  options:
  - label: A
    content: 生產第10單位香蕉的機會成本低於生產其他單位香蕉之水準
  - label: B
    content: 組合乙的香蕉與蘋果總量大於組合丁，就X國不會以組合丁進行生產
  - label: C
    content: 組合甲的香蕉與蘋果總量大於組合戊的水準，故組合甲的效率高於組合戊
  - label: D
    content: 生產第20單位香蕉的機會成本與生產第1至第4單位香蕉的水準不同
