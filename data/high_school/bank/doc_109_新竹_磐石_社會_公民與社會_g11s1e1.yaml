  section: 1
  number: 13
  type: single
  page: 1
  stem: 假設臺南市北門區只生產鹽虱目魚，因蘇迪勒颱風的危害，造成全區大淹水，同時養殖魚場潰堤，則颱風過後，北門區的生產可能曲線的變化為何？
  options:
  - label: A
    content: 生產可能曲線外移
  - label: B
    content: 鹽的產量減少，虱目魚的產量不變
  - label: C
    content: 兩者只會在生產可能曲線上產生點的移動
  - label: D
    content: 內移並且兩者產量同時下降
- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 美國史丹佛大學做了一個著名的實驗：實驗中把一群小孩帶進實驗室，每個人各分得一塊棉花糖，研究人員告訴小孩有兩種選擇，如果能等15分鐘後再把糖吃掉便可以再拿到第二塊棉花糖。丁丁選擇先把糖吃掉；彬彬選擇15分鐘後再把糖吃掉。下列關於兩人選擇的敘述何者正確？
  options:
  - label: A
    content: 對丁丁前言，先把糖吃得的機會成本＜15分鐘後再吃的機會成本
  - label: B
    content: 對彬彬而言，先把糖吃掉的機會成本＜15分鐘後再吃的機會成本
  - label: C
    content: 丁丁選擇的機會成本＞彬彬選擇的機會成本
  - label: D
    content: 彬彬選擇的機會成本＞丁丁選擇的機會成本
