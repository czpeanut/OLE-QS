- id: doc_109_新竹_磐石_社會_公民與社會_g11s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 關於文章的敘述，下列選項何者對於稀少性的定義是正確的？
  options:
  - label: A
    content: 稀少性可以用絕對的數量來決定
  - label: B
    content: 稀少性指的是資源總數量的多寡
  - label: C
    content: 稀少性可以透過人過來創造
  - label: D
    content: 具備稀少性則意味著貧窮
  group_stem: ◎一杯星巴克的美式咖啡，其物料人事成本大約只有30元，可是一杯星巴克咖啡在市場上的價格大約是120元，在物資豐沛的臺灣，咖啡並不稀少，為什麼星巴克咖啡的售價可以明顯高於85度C咖啡2倍，超商咖啡3倍呢？ 有些同學會認為這是星巴克的地段好，開在機場與火車站人流多的地方，這是一個正確的思考方向。可是進一步想，火車站人流多的地方也會有其他的競爭者，為什麼其他的競爭者沒有想到要在這裡開店競爭呢？ 這是因為星巴克付出了夠高的成本，高到其他咖啡店放棄競爭的想法。通常在核心地段，例如：火車站與機場周邊，星巴克會和周邊房東簽一個排他性的，約定10個店面只能有星巴克賣咖啡，也就是它高價排除了競爭者來製造稀少性。 所以占領稀少性是需要成本的，沒有稀少性就不可能賺錢，星巴克的一杯咖啡賣120元其實並不是自己能夠決定，如果該地段的120元是暴利，那隨時都會有其他廠商等著加入競爭，這就是市場的力量，讓稀少性的東西變得不那麼稀少。 全世界的咖啡生產者本來是非洲與南美洲國家，這些國家的咖啡種植者協會曾在上個世紀末成立了非生產國協會的組織，共同推動公平貿易，讓咖啡豆的價格能夠因為聯合壟斷而提高。但這個協會很快就解散了。因為沒有加入這個協會的其他國家農民，例如：越南發現自己的氣候條件可以用低於咖啡生產國協會的價格生產咖啡豆，於是鼓勵農民生產，造就了這個全球第二大咖啡生產國。 經濟的世界裡，市楊具有自動調節的機能，也會在最大可能的情形下扭轉稀少性的局面。在上述的例子當中，越南就具有補足稀少性的特質，咖啡生產國協會以為掌握了稀少性就能夠隨意定價，市場就會毫不留情給予淘汰。所以維護市場的自由競爭與定價，也許價格會有短暫的波動，但對於如何分配這件事來說，市場是最能將資源送到最需要的人手上的一種機制。
