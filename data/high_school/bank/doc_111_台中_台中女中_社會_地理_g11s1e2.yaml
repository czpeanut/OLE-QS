  group_stem: 2011 年 3 月 11 日日本東北外海發生芮氏規模 9.0 的淺層地震，引發大海嘯，除造成嚴重傷亡外，也導致福島核電廠輻射外洩、高科技產業工廠停產、交通運輸基礎設施受損。日本震災對臺灣的半導體、面板、太陽光電所使用的原料與零組件供應帶來影響。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(D)日本產的原料與零組件提供給臺灣的半導體、面板、光電使用，為一生產流程跨國分工的現象。

    4.4 選項皆為中國沙塵暴的特色，但題述引號中的文句表達沙塵暴大多向東邊吹送，最遠可達美國，故應選與沙塵暴擴散方向有關的(D)選項。

    5.由圖可知，該農場 3 ～ 4 月播種冬穀，10 ～ 11 月冬穀收成，而 7 月為冬季，該農場位於南半球，再加上同時發展酪農業，最可能是(D)澳洲的維多利亞省。(A)(B)應為傳統集約農業。(C)應為熱帶栽培業。

    6.照片中可見告示牌有「噴氣孔」，推論為火山地形，可能於臺北大屯火山拍攝；北部地區為降水分布相對最平均的地區，故應選全年皆有降水且各月落差最小的(A)。

    7.此四國中，日、韓的經濟、教育、壽命水準都較高。甲：平均每人 GNI 與總 GDP 均最低，應為菲律賓；乙：總 GDP 最高，但平均每人 GNI 為次低，應為人口數量龐大的中國；丙：預期壽命、平均教育、平均每人 GNI 均次高，應為韓國；丁：預期壽命、平均每人 GNI 都是最高，應為日本。故選(C)丁、丙。

    8.甲：有玉山主峰圖樣，為玉山國家公園；乙：有閩式建築圖樣，為金門國家公園；丙：有黑面琵鷺圖樣，為台江國家公園；丁：有大霸尖山與櫻花鉤吻鮭圖樣，為雪霸國家公園。(1)保留戰地文化的為乙：金門國家公園；(2)東亞最高峰為甲：玉山國家公園；(3)漢人登臺地點為丙：台江國家公園；(4)保育冰河期孑遺生物櫻花鉤吻鮭的為丁：雪霸國家公園。

    9.(B)在此 4 處國家公園中有保育野生森林群落的有甲：玉山國家公園、丁：雪霸國家公園。

    10.(丁)財團仰賴國外市場，貿易依存度高。

    11.(A)一企業透過擴大生產規模，壓低單位生產成本，為規模經濟的特徵。

    12.根據關鍵詞「擠牛奶」與「餵養牲畜人工牧草」可知，應為酪農業。甲：酪農業；乙：商業性穀物農業（或混合農業）；丙：放牧業（綿羊）；丁：放牧業（肉牛）。

    13.(乙)打工度假的工作多為基礎勞力工作，並無法提升產業生產技術。

    14.(C)文中提及此料理為麥哲倫抵達此地後傳入，可推測為歐洲文化影響，菲律賓曾為西班牙殖民地。

    15.(D)辛香料可使人在高溫潮溼的氣候中增加食慾。

    16.(D)從圖中可知，民國 44 年倚賴單一貿易國；民國 93 年時，四國貿易額較相近，推測市場有逐漸分散的趨勢。

    17.(C)民國 68 年中美斷交，使貿易往來大幅減少。

    18.(甲)應為臺北拉力大；(乙)由文中「短短 500 公尺距離內可見數十家布莊」可知有聚集經濟效益；(丙)文中無提及；(丁) 70 ～ 80 年代為臺灣發展高科技產業的時期。

    19.(B)中南半島唯一流經五國的河流為湄公河。

    20.(B)上游興建水壩會造成下游流量減少，河水更新時間拉長、下游產業用水減少。

    21.(D)泰國近年轉型以汽車產業為主，又稱「東方底特律」。(A)從主要出口產品有「天然氣」可知，為出口天然氣至中、泰的緬甸。(B)從主要出口產品有「咖啡」可知，為越南。(C)從主要出口產品有「電力」可知，為水壩密度最高，又稱「東南亞發電廠」的寮國。

    22.(C)文中提及海上貿易活動的商人主要來自阿拉伯，推測應為伊斯蘭世界的強盛時期。

    23.(乙)一胎化政策在都市比鄉村更容易進行；(丙)幼年人口下降後人口老化，因此扶養比應下降後再上升。

    24.(C)東亞的傳統集約農業特色為單位勞力產量低，單位面積產量則因農業發展程度有低有高。因此最符合圖中的丙。

    25.(C)雅美族又稱「達悟族」，主要居住於蘭嶼，並非臺灣本島。

    26.(A)澳洲原住民來源說法眾多，其中一說是由新幾內亞搬遷來的巴布亞人，並非南島語族。

    27.(D)因新加坡有 4 種官方語言，故告示牌上須標示 4 種語言的內容。

    28.根據降水量，可刪去全年降水量少的(D)澎湖；再根據冬溫低於 20°C 但不低於 18°C 推測，再刪去海拔較高的(C)山區和較高緯的(A)金門。

    29.(D)核電的限制為輻射物汙染，因此位於板塊交界的臺灣可能因地震使核電廠結構受破壞。

    30.(C)由於本州中部有飛驒山脈，使氣溫低於同緯度的平地地區。

    31.(A)(B)兩地地點相近，且皆靠海，因此氣壓與距海距離並無太大差異。(C)由於東京較接近太平洋，因此氣候相較釜山較受海洋影響，而釜山較受大陸氣團影響。(D)盛行風相同，冬季皆為西北風。

    32.要在一國見到活火山地形與冰河地形，4 選項中僅(C)紐西蘭有此景觀。

    33.(A)河流由西向東流。(C)年均溫由南向北遞減。(D)植被垂直分布受海拔變化影響，與此無關。

    34.(C)三民為國民政府提倡的三民主義，取前兩字命名。

    35.林鳳營位於臺南市；瑞穗位於花蓮縣；三貂嶺位於新北市。

    36.(C)若以海運方式從中國至德國會依序經過太平洋、印度洋、地中海、大西洋。因此會受影響的有：(甲)蘇伊士運河：連結印度洋、地中海；(丙)麻六甲海峽：連結太平洋與印度洋；(丁)直布羅陀海峽：連結地中海與大西洋。(乙)巴拿馬運河：連結太平洋與大西洋。

    37.(D)冬季降水較多的氣候有溫帶地中海型氣候及溫帶海洋性氣候，分別為丙、丁。甲：熱帶乾燥氣候；乙：熱帶莽原氣候；戊：夏雨型暖溫帶氣候。

    38.(C)南海蘊藏石油(丁)、可連結東亞與東南亞(甲)、擁有豐富(丙)漁業資源，對國家經貿有正面影響。(乙)(戊)南海的珊瑚礁島嶼普遍缺水、面積小，不適合發展觀光與農業。

    39.(D)雅加達於南半球且位爪哇島北部，於 7 ～ 10 月時，因(丁)間熱帶輻合區北移，(丙)東南信風帶移入，但背信風使降水量減少。

    40.(A)東南亞族群多元的原因為(甲)中南半島多縱谷、南洋群島島嶼眾多，有天然屏障，以及位於(乙)兩大洋之間而成為東西文化的交會處。

    41.(B)題述「逢特定年分」會有較高出生率，與東亞文化圈的生肖有關。

    42.(C)澳洲以(乙)畜牧業與(丙)礦業為主要產業，兩者皆為碳排放量高的產業，又因(丁)澳洲地廣人稀總人口數僅約 2 千多萬，使人均碳排放量較他國高。

    43.(D)東南亞國協成員國皆以熱帶栽培業、民生工業或電子代工產業為主，因早期受西方殖民而有此產業特性。

    44.(C) RCEP 的總人口約占全球 1／4，且皆位於西太平洋地區。

    45.(A)閩粵各族群分布圖。(B)河流流域分布圖。(C)自然保護區分布圖。(D)縣市鄉鎮界地圖。

    46.由於河川皆有入海，可推測圖中每一統計區都應臨海，且由主要河川的流路可判斷其正確性。例如：淡水河流域包含上游大漢溪、新店溪、基隆河流域，因此流域範圍遍布桃園、新北、臺北、基隆。

    47.宜蘭至花蓮之間為中央山脈的北段。

    48.中央山脈的北段為泰雅族主要居住地之一。

    49.根據其莖葉特色可推測為棕櫚樹。

    50.由於棕櫚樹用途多，東南亞多國將其原始雨林轉作棕櫚產區，以獲取經濟效益。然而，棕櫚油的價格易受國際價格影響，因此國家經濟易不穩定，且雨林受破壞後是無法復原的。

    51.由題圖可知，高氣壓中心位於蒙古上空，應為冬季的蒙古冷高壓，因此當時的韓國應受冬季季風──西北季風吹拂。

    52.由於 3 月風向由西北向東南吹拂，欲改善韓國境內空氣品質，應由上風處的 III 區海域實施人造雨較有成效。

    53.由文中「當時的盛行風」、「鄰國主要工業區分布」可推測霧霾來源應為中國，且恰好為西北風的上風處，是中國東北及華北工業區所在位置。'
