- id: doc_109_高雄_鳳山_自然_物理_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 1911年，<u>拉塞福</u>利用鐳所放出的α射線為放射源，以厚度約為1微米的金箔為靶（約有$10^{4}$個金原子排列在其中），進行α粒子散射的實驗，並偵測在各個方向散射的α粒子數目。<u>拉塞福</u>發現絕大多數α粒子的散射角（α粒子散射前後偏折的角度）都很小，幾乎都是直接通過金箔，運動方向無顯著改變。少數粒子散射角較大，大約每8000顆α粒子會有1顆超過90°的大角度散射，甚至有散射角為180°的反向散射。在這粒子穿過金箔發生大角度散射的過程中，下列說法何者正確？
  options:
  - label: A
    content: α粒子發生散射，最後結果是讓拉塞福發現原子核由質子與中子組成
  - label: B
    content: α粒子發生散射，是因為金箔原子內部必有某處與α粒子發生強烈吸力作用
  - label: C
    content: α粒子發生散射，是因為金箔原子內部必有某處與α粒子發生強烈斥力作用
  - label: D
    content: α粒子發生散射，是其與金箔中的電子碰撞後之結果
  - label: E
    content: α粒子發生散射，是其與金箔中的電子吸引後之結果
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
