  stem: 下列何種天文現象，最不可能觀測到重力波？
  options:
  - label: A
    content: 黑洞碰撞
  - label: B
    content: 火星大接近
  - label: C
    content: 雙中子星合併
  - label: D
    content: 超新星
  - label: E
    content: 黑洞合併
  group_stem: '2016年正逢愛因斯坦發表廣義相對論100週年，美國的激光干涉重力波天文台（LIGO Lab）舉行記者會，發表愛因斯坦廣義相對論的最後一個預言一重力波一的直接證據，證實了廣義相對論裡的最後一項推測。 廣義相對論說，時空會被非常重的物質扭曲。想像時空是一張彈床的表面，上面放一個網球和一個保齡球。保齡球比較重，所以彈床表面會被保齡球壓得比較深。把網球滾向保齡球附近，網球就會沿著保齡球附近被扭曲的彈床表面公轉，看上去彷彿網球被保齡球的一道無形的「力」給拉了過去。這就是重力的表現。如果有兩個保齡球在彈床上呢？這樣的話，兩個保齡球就會互相圍繞其重心公轉。彈床表面就會因為兩個保齡球循環施壓而形成向外擴散的彈床波浪。因此，當兩個極高質量的天體 ── 通常是中子星或黑洞 ── 互相圍繞公轉，時空就會被它們的重力循環拉址而形成向外擴散的波浪。這個重力的波浪，就叫做重力波。

    重力波的效應實在太過微弱，愛因斯坦當時認為這是人類永遠無法證實的理論。直接探測重力波非常困難，即使極高質量的天體，其所造成的重力波波幅仍然非常小，LIGO在2015年9月升級成Advanced LIGO（aLIGO）後成功完成了使命。人類於2015年9月14日首次直接探測到重力波，其源自於雙黑洞合併。之後，又陸續多次探測到重力波事件，特別是於2017年8月17日首次探測到源自於雙中子星合併的重力波事件。改寫自https://www.thenewsiens.com/article/36099'
