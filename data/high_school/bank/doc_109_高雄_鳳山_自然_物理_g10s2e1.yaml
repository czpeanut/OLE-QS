  stem: 20世紀的物理學家費曼（Richard Philip Feynman）認為：假如地球發生大災難而只能留下一段話給新世代的文明，應該留下宇宙萬物皆由原子組成的內容。下列關於物質組成的敘述，哪些正確？（應選2項）
  options:
  - label: A
    content: 當物質溫度極低時，其組成原子會靜止不動
  - label: B
    content: 當物質溫度升高時，其組成原子的運動會隨之激烈
  - label: C
    content: 當物質由固體融化液體時，其組成原子會失去部分動能促使物質融化，故組成原子的動能會變小
  - label: D
    content: 原子由帶正電的原子核與核外電子組成，電子不可再分割，為基本粒子
  - label: E
    content: 原子核由質子與中子組成，中子與質子不可再分割，為基本粒子
