  group_stem: 根據新聞報導，IBM在《自然》期刊發表了一項最新研究，將用於卡帶、硬碟的磁儲存技術，成功應用於原子內，這項研究可使1顆原子儲存1位元的資料，將儲存單位縮小好幾個數量級，而現今市面上的硬碟需要10萬顆原子才能儲存1位元。不僅如此，IBM在儲存密度的技術上也有重大突破，可使用2顆原子僅需距離1奈米即可不受互相干擾，使儲存密度比現在硬碟的儲存技術高一千倍。意即相較現有技術，同樣的空間可以多存1千倍的資料。透過提升單位面積可儲存的資料量，能大幅縮小手機、電腦等個人裝置，甚至是資料中心的體積。一個信用卡大小的裝置，即可儲存擁有3,500萬首歌的蘋果iTunes音樂庫。 該技術是利用附著在氧化鎂表層的「鈥（Holminum）」原子，並讓原子的磁極保持穩定，而磁極的方向用來代表原子狀態是二進位的0或1。IBM的研究團隊利用掃描式穿隧電子顯微鏡（Scanning Tunneling Microscope, STM）發出電流，改變鈥原子的方向來模擬資料的寫入。讀取資料時，則是測量通過每個原子的電流方向。 不過，研究人員表示，這項技術距離商業化還有至少10年的時間，因為需要在超高真空（ultra-high vacuum）以及液態氮低溫的環境中才能執行。IBM研究員Chris Lutz表示，這個研究並不是為了開發產品，而是希望幫助研究人員將儲存大小縮減到原子級，並開發出引領下一個儲存技術的工具和知識。改寫自https://www.bnext.com.tw/article/43506/ibm-fits-a-bit-on-an-atom
