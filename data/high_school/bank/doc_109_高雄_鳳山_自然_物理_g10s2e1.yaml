  type: single
  page: 3
  stem: 海王星又被稱為筆尖上的行星，從上面文章推論其最可能的原因為何？
  options:
  - label: A
    content: 海王星被發現的時期同時也是原子筆的誕生
  - label: B
    content: 海王星的樣貌長得很像筆尖
  - label: C
    content: 地球上的人觀測到的海王星大小與筆尖相當
  - label: D
    content: 海王星的英譯就是筆尖的意思
  - label: E
    content: 海王星是先被用理論計算出來才觀測到的行星
  group_stem: 太陽系九大行星的發現過程中，八顆是靠天文望遠鏡的觀察先發現，然後結合數學計算確定其運行軌道。惟獨海王星的發現很神奇。 這個故事要從太陽系第七顆大行星天王星的發現說起。1781年3月31日晚，德裔英國天文學家威廉‧赫歇耳用自製天文望遠鏡觀測夜空時，發現了一顆新的天體，他以為可能是一顆彗星。但其後其他天文學家的觀測證明了這是一顆大行星，被命名為天王星。1821年，巴黎天文台台長布瓦爾把天文學家歷年來對天王星的觀測記錄編緝成天王星星表，並根據萬有引力定律算出天王星的運行軌道，驚訝地發現天王星的實際位置偏離了推算出的軌道。這是一個困擾天文學的大難題。 1832年劍橋大學天文學教授艾里提出沒有必要懷疑萬有引力定律的正確性，哪麼更可能的情形就是存在另一顆待發現的大行星，它在干擾天王星的運行。如果知道一顆大行星的位置，根據萬有引力定律可以計算出它對臨近大行星運行的干擾，也就是天文學上所謂的攝動。但是如果反過來，要從某顆大行星受到的攝動推算出未知大行星的位置，則要困難得多，需要解決逆攝的問題，當時大多數科學家認為是不可能做到的。 1845年夏天，巴黎綜合理工學院教師勒威耶開始研究天王星攝動問題，勒威耶利用有關天王星的18次觀測資料，運用萬有引力定律，通過求解33個方程，於1846年8月31日計算出對天王星起攝動作用的未知行星的軌道和質量，並且預測了它的位置。1846年9月18日晚，柏林天文台副台長伽勒僅用一個半小時就在偏離勒威耶預言的位置52分處觀測到了這顆當時星圖上沒有的星，這就是後來命名的海王星。改寫自網址：<u>https://kknews.cc/science/zk52q33.html</u>
