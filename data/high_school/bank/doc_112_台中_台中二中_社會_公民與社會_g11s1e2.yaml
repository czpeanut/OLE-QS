- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 20 歲的小文是依法來臺工作的泰國人，來臺工作幾年後，發現老闆給他的薪水遠比《勞動基準法》規定的最低工資還少。小文對自己的薪資問題，是否有可以申訴或救濟管道？
  options:
  - label: A
    content: 《勞動基準法》不保障外國勞工，所以小文無管道可救濟
  - label: B
    content: 小文可以向行政院消費者保護處申訴
  - label: C
    content: 公平交易委員會可針對小文的薪資問題仲裁
  - label: D
    content: 小文可透過勞動主管機關來爭取自己應有的薪資權益
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《勞基法》保障在我國工作的勞工，也包含外國人。(B)當向該地勞動主管機關爭取權益。(C)並無此機制。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列哪一個人的行為，在經濟活動循環中，和「甜點師傅購買烤箱製作招牌蛋糕」最相似？
  options:
  - label: A
    content: 小巴放學後到飲料店打工
  - label: B
    content: 哈哈上網拍賣二手參考書
  - label: C
    content: 阿姆聘用小哈擔任外送員
  - label: D
    content: 迪特購買哈哈賣的二手書
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 甜點師傅購買烤箱，指的是廠商在生產要素市場購買資本。(A)屬於家戶提供生產要素到生產要素市場。(B)廠商提供產品至產品市場。(C)廠商在生產要素市場購買勞動。(D)家戶在產品市場購買產品。故本題選(C)。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 阿騰向甲電信的乙營業處預購一支手機，並支付訂金，阿騰期盼能夠盡快拿到手機來使用。依照所有權的特性，下列敘述何者正確？
  options:
  - label: A
    content: 阿騰可向甲電信的任一分店要求領貨
  - label: B
    content: 阿騰取得手機後，可以對任何人說手機是他的，不得隨意使用
  - label: C
    content: 因銀貨兩訖，就算阿騰發現手機有瑕疵，也無法請求乙營業處退換貨
  - label: D
    content: 因所有權絕對，阿騰無法轉售該手機給他人
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)要視該公司的機制，原則上應向乙營業處要求領貨。(B)正解。此屬於所有權絕對原則。(C)店家應負產品的瑕疵擔保責任。(D)應當是所有權直接原則，故本題選(B)。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 2022 年，東非面臨 40 年來最嚴重的乾旱，氣候乾熱還助長蝗蟲繁衍，肯亞、衣索比亞以及索馬利亞等國遭到數十億的蝗蟲侵襲，大量蝗蟲把作物吃光，使許多國家陷入了嚴重的糧食危機。上述事件會如何影響東非國家糧食作物的供需？
  options:
  - label: A
    content: 需求線左移
  - label: B
    content: 需求線右移
  - label: C
    content: 供給線右移
  - label: D
    content: 供給線左移
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知蝗災造成糧食不足，糧食供給減少，供給線左移。故本題選(D)。(A)(B)題文並無提到需求的變動。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 全聯福利中心併購大潤發案，歷經逾 8 個月審查，公平會於 2022 年 7 月中宣布有條件通過，條件包括不得任意調漲價格，三年內維持全國各門市價格一致等；全聯則表示將以雙品牌形式並進經營，並承諾協助農產品促銷、加強對離島與偏鄉服務等。試問此案所依據的法條為何？
  options:
  - label: A
    content: 《公平交易法》
  - label: B
    content: 《消費者保護法》
  - label: C
    content: 《商標法》
  - label: D
    content: 《勞動基準法》
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，此為結合行為，為《公平交易法》所規範，故本題選(A)。(B)保障消費者權益的法規。(C)規範商標的申請與保護。(D)保障勞工的基本權益保障。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 聯合漲價行為是指具競爭關係的廠商之間，一同協議調漲產品或服務價格的行為，以獲取更多利潤或控制市場價格。OPEC 石油輸出國家組織成員國簽署減產協議，目的是想透由聯合減產以拉抬油價，然而其聯合減產漲價的效果卻高低起伏，其可能原因為何？
  options:
  - label: A
    content: 石油開挖技術不良，無法控管產量
  - label: B
    content: 部分成員國考量現實利益，不遵守產量的協議私下增產
  - label: C
    content: 成員國間商議聯合降價，薄利多銷可減少存貨
  - label: D
    content: 電動車的問世與普及，使石油不再是主要的燃料來源
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 石油輸出國家組織雖打算聯合減產，抬高石油價格，但有部分成員國不遵守規定，導致成效不如預期。故本題選(B)。(A)與生產技術無關。(C)由題文可知，並無聯合降價的情事。(D)題文並無提及。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 《消費者保護法》規定定型化契約內容應秉持平等互惠的原則，以避免擬訂定型化契約的一方，利用其優勢剝削消費者。以下哪個做法符合此原則？
  options:
  - label: A
    content: 房東要求房客租金不要報稅可享較低廉的租金
  - label: B
    content: 百貨公司周年慶的禮券未使用完的餘額不得消費
  - label: C
    content: 補習班報名繳費後給予學生 5 天時間審閱契約
  - label: D
    content: 線上遊戲公司聲稱若帳號被盜用本公司概不負責
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此行為違反法規。(B)此規定也違反法規。(C)審閱期間為定型化契約給予消費者有較多的時間審閱契約內容。(D)帳號被盜，雖也許可歸咎於使用者，但若為廠商資安防護不足，同樣也須負起責任。故本題選(C)。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 小又與小柔相約一起去桃園球場看「魔獸」霍華德在桃園雲豹球隊的比賽。而球場為了應付眾多球迷到場，球場中的商家特別準備多於平時的周邊商品數量，並加聘臨時工讀生，以滿足到場球迷的需求。請問「增加商品數量」、「加聘工讀生人手」分別是屬於圖中的哪兩部分？
  options:
  - label: A
    content: 乙、丁
  - label: B
    content: 丙、丁
  - label: C
    content: 甲、丙
  - label: D
    content: 甲、乙
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_112_台中_台中二中_社會_公民與社會_g11s1e2/s1_8_f1.png
    crop:
      page: 2
      rect:
      - 247.05
      - 122.2
      - 437.0
      - 225.5
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 增加商品數量，為廠商提供至產品市場的產品增加，屬於「甲」。增聘工讀生，屬於廠商於生產要素市場聘僱勞動，屬於「乙」，故本題選(D)。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 買房子只登記一個「所有權人」，他會擁有百分之百的產權；若今天是一間房子兩人出資，那可以採取「共同登記」，即雙方都是持有人。請問在共同持有房屋所有權的狀況下，未來房子要怎麼規劃，包括產權變更、變賣或是要出租時，按照《民法》應如何處置？
  options:
  - label: A
    content: 一物多權：房屋上存在兩個所有權，兩人皆獨自享有房屋處置的權利
  - label: B
    content: 一物一權：兩人共享一個所有權，若想出售該房屋，必須得到對方同意
  - label: C
    content: 按出資比例決定所有權歸屬，由錢付較多的人決定
  - label: D
    content: 依照所有權的排他性，一間房子不可能兩人共同持有
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)物權為一物一權主義，每個「物」只會有一個所有權，多人共用所有權的使用、收益、處分，須經其他共有人的同意。(B)正解。(C)並無此規定，應當由所有共有人同意。(D)所有權的排他性，指所有物的使用排除他人的干涉。故本題選(B)。
