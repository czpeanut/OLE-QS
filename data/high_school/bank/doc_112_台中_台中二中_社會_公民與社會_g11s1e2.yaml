- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 農曆春節將至，春節圍爐團圓必備象徵「年年有餘（魚）」的白鯧魚，卻呈現捕獲數量不如往年的情況，影響白鯧價格上升。依據一般供需法則來檢視此現象，春節前夕，白鯧魚的需求線會如何變動？
  options:
  - label: A
    content: 左移
  - label: B
    content: 右移
  - label: C
    content: 下降
  - label: D
    content: 不變
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，春節前夕白鯧魚的銷售會變好，此屬於消費者偏好的影響，會使需求增加，需求線右移，故本題選(B)。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 丁丁和小穎結婚後生了一個小孩，兩人考量彼此的工作和所得後，決定讓丁丁辭職回家成為家庭主夫，專心照顧小孩和處理家務。假設兩人婚後沒有辦理其他財產制，請問針對夫妻兩人的財產說明何者正確？
  options:
  - label: A
    content: 小穎辛苦賺錢，沒有必要向丁丁報告財產的義務
  - label: B
    content: 兩人若性格不合要離婚，此制度會最不利於丁丁
  - label: C
    content: 丁丁除生活費用外，可以向小穎要求自由處分金
  - label: D
    content: 若小穎在外欠債，丁丁也需要連帶負起償債責任
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《民法》規定，夫妻仍負相互報告財產的義務。(B)雙方婚後沒有辦理財產制的登記，代表為法定財產制，若離婚丁丁依法可要求剩餘財產差額分配，並無不利。(D)法定財產制婚後的財產與債務同樣是各自管理、使用與處分，不會有此情事。故本題選(C)。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: '假設柴柴和圓圓均會採莓果和蘑菇，在相同資源之下，他們 1 小時分別可摘採莓果和蘑菇的產量如附表。若兩人欲進行分工，下列相關敘述何者正確？

    | 1 小時生產力 | 莓果 | 蘑菇 |

    | --- | --- | --- |

    | 柴柴 | 8 顆 | 2 個 |

    | 圓圓 | 6 顆 | 4 個 |'
  options:
  - label: A
    content: 圓圓沒有生產蘑菇之比較利益
  - label: B
    content: 圓圓具有生產蘑菇之絕對利益
  - label: C
    content: 若兩人分工，柴柴應生產蘑菇
  - label: D
    content: 柴柴生產一個蘑菇的機會成本是 1∕4 個莓果
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由表格可知，柴柴具有生產莓果的絕對利益與比較利益。圓圓具有生產蘑菇的絕對利益與比較利益。因此(A)圓圓有生產蘑菇的比較利益。(C)柴柴應生產莓果。(D)柴柴生產
    2 單位蘑菇須放棄 8 單位莓果，可知柴柴生產 1 單位蘑菇的機會成本是 4 單位莓果。故本題選(B)。
- id: doc_112_台中_台中二中_社會_公民與社會_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 阿龍在網路上與賣家約定好以 2,000 元價格買下一臺二手腳踏車，並約定交貨時間。不久後阿民也在網路上看到該腳踏車，阿民親臨現場並出價 3,000
    元，賣家考量收益便將腳踏車交付給阿民。請問依上述狀況，阿龍應如何主張自己的權利呢？
  options:
  - label: A
    content: 阿龍契約簽訂的時間較早，可直接向阿民要求交付腳踏車
  - label: B
    content: 阿民已經取得腳踏車的所有權，阿龍沒有任何辦法
  - label: C
    content: 阿龍可以向阿民提出所有物返還
  - label: D
    content: 阿龍可向賣家要求負起債務不履行的責任
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由題文可知，腳踏車已完成交付，此時腳踏車的所有權屬於阿民，基於物權優先主義，阿龍無法基於債權要求阿民交付腳踏車。(B)阿龍可以向賣家要求負起債務不履行的責任。(C)阿龍並沒有腳踏車的所有權，無權要求所有物返還。(D)正解，故本題選(D)。
