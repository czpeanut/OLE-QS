  section: 1
  number: 1
  type: single
  page: 1
  stem: 中國傳統官方史書很早就記載了周邊民族的文化，但歷代史官受限於語言、文化等因素，紀錄並不正確，士人也不關心。但自某時期起，知識分子開始重視邊疆問題，並參考外文著作，積極研究周邊族群的歷史和地理。這種轉變的背景最可能是
  options:
  - label: A
    content: 北宋初年，遼夏壓境，士人提倡春秋大義以保護國土
  - label: B
    content: 明中期以後，耶穌會教士引入歐洲新地理學帶來啟發
  - label: C
    content: 清中期以後，俄國蠶食邊疆，激發學者拓展邊疆研究
  - label: D
    content: 日本扶持滿洲國，刺激中國學者研究邊疆歷史的風氣
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「知識分子開始重視邊疆問題，並參考外文著作」，可知此時中國邊疆正面臨西方勢力的入侵，因此答案為(C)。
