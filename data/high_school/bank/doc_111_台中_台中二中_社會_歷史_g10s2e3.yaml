  stem: 戊戌維新之前，主張維新的人，發表各自意見。嚴復在上皇帝萬言書請皇帝「結百姓之心」，方法是「親至沿海各地，巡守省方，縱民嵩呼，瞻識共主」。譚嗣同在仁學中說：「君也者，為民辦事者也。事不辦而易其人，亦天下之通義也。」依據以上兩人之言論，下列敘述何者最為適宜？
  options:
  - label: A
    content: 兩位維新者，都抱有新思想，都反對舊觀念
  - label: B
    content: 認同維新者，重點各有不同，但都主張民主
  - label: C
    content: 嚴復主張君主立憲，譚嗣同主張民主共和
  - label: D
    content: 相對而言，嚴復思想保守，譚嗣同思想激進
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 嚴復與譚嗣同皆為主張維新之人，即支持君主立憲政體，但譚嗣同卻稱君若不為民辦事則可「易其人」，可見譚嗣同思想確實較嚴復激進，故選(D)。(A)新文化運動時才反對舊觀念。(B)(C)兩人並未主張民主共和。
