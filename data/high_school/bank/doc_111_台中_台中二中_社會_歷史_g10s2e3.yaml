  stem: 針對戰爭時期日本提出的「大東亞共榮圈」，日本人認為他們是「解放殖民地、相互尊重彼此獨立」；對美國人而言，認為這是一種侵略行為；然而對於當時位處於共榮圈內的東南亞諸國民族領袖而言，卻是相當肯定共榮圈的主張，因此樂於提供日本協助。針對上述三方對於「大東亞共榮圈」的看法歧異，下列何者的解釋符合歷史事實？
  options:
  - label: A
    content: 日本提出「大東亞共榮圈」，是為了達成亞洲區域和平，協助東南亞獨立建國
  - label: B
    content: 美國之所以認為日本實質上是侵略行為，主要是出於人道主義與維持世界秩序考量
  - label: C
    content: 東南亞領袖對共榮圈的肯定，實際上是為了要排除歐美殖民帝國勢力
  - label: D
    content: 東南亞領袖與日本對共榮圈的最終目的均是要建立經濟上互利共榮的亞洲區域組織
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)日本真正目的在東南亞擴張勢力以牟取國家利益，非協助東南亞獨立建國。(B)美國認為日本對其殖民地有侵略之虞。(D)東南亞領袖希望能借助日本之力獨立建國。
