  stem: 1866 年，日本的福澤諭吉在著作《西洋事情》中對日本的現代化提出了下列六項原則：「一、尊重個人自由，法律不束縛國民；二、保障國民信教的自由；三、促進科學技術的發展；四、充實學校教育；五、依靠合理的法律穩定政治，從而培育產業；六、時刻注重國民福祉的提高。」而同時期的中國官員則是提出「師夷之長技以治夷」、「中學為體、西學為用」等口號。請問可看出中、日的知識分子對西化的態度有何不同？
  options:
  - label: A
    content: 中國知識分子對於西方的知識較為嚮往，更積極向西方學習
  - label: B
    content: 日本知識分子的西化著重在物質方面，主要是希望提升軍事實力
  - label: C
    content: 日本知識分子提出的西化政策較全面，不局限於器物層次
  - label: D
    content: 中國朝廷對於西化十分積極，主張拋棄中國傳統文化
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(D)中國知識分子在西化的同時，更重視捍衛中國傳統文化。(B)應是中國的西化特色。
