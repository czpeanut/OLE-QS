- id: doc_111_台中_台中二中_社會_歷史_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 一位中共領導人表示：「我們既要反左，又要反右，但更重要的是反對左，這是從我黨幾十年來的歷史教訓中總結出來的。」這段資料最有可能出自下列何者？
  options:
  - label: A
    content: 毛澤東於中共建國時的演說
  - label: B
    content: 周恩來參加亞非會議時的演說
  - label: C
    content: 六四天安門事件時保守派的談話
  - label: D
    content: 鄧小平於南巡時發表的談話
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)在中共的領導階層人物中，毛澤東是典型的左派人士，不可能說出「反對左」的主張；鄧小平則是相反的右派人士，尤其主張以右派方式治理經濟，因此在六四事件後被各國經濟制裁時，決定提出更優惠的條件吸引各國再度對中國投資。(B)亞非會議時提出中國不干預其他國家的主張，與反左、反右無關。(C)六四天安門事件時的保守派為反對胡耀邦的左派，不會主張反對左。
  tags:
    unit:
