  page: 1
  stem: 清代晚期，有學者認為中國傳統的「道德之學」易流於空洞說教，故應「學習西方、大開民智」，強調師法西方重智的「物質之學」，因為唯有重視「智學」，民族才能興盛、國家才可富強。與此論點有關的敘述，下列何者最為符合？
  options:
  - label: A
    content: 從器物層面的改革漸漸延伸進入學術層面
  - label: B
    content: 此後清廷上下致力於推動軍事器物之改革，追求船堅砲利以自強
  - label: C
    content: 此主張影響「師夷長技以制夷」的理論，為中國現代化改革之契機
  - label: D
    content: 官府成立新式學堂，教授外文以利與世界接軌
  answer:
