  stem: 某年美國中情局副局長訪問臺灣，分析中國局勢時說道：「中國此時進行的某項運動，是中蘇分裂下延伸的病態現象，毛澤東希望激發中國大陸勞動者的士氣，建立一套比蘇聯更純粹的馬克思主義。」請問文中所謂的「此時」中國大陸正在進行的是哪一項運動？
