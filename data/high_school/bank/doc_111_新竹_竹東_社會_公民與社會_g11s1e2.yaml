  stem: 麥當勞傳出「薯餅荒」，搭配早餐的薯餅一度停售，原因在於由美國進口的薯餅，因為疫情導致航運缺工及缺櫃，貨物「塞港」的問題非常嚴重。近年來消費者的永續意識上升，「在地採購」成為許多企業考慮的選項。增加「在地」和「區域」生產的比例，縮短交貨期也減少碳足跡，達到環境永續。根據上文，有關全球專業分工的敘述何者最為正確？
