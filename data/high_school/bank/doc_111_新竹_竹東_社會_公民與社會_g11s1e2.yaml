  stem: 烏俄戰爭開打以來，歐洲各國的能源供給大受影響，天然氣價格不斷飆漲，也同時帶動木柴價格狂漲，使得羅馬尼亞政府出手管制天然氣與電費價格，但仍使得民生基本需求受到衝擊。而後則通過緊急管制方案，限制每立方公尺的木柴售價不得超過400列伊（約2,536新臺幣）。此外，羅馬尼亞林業局宣布增加木柴產量的緊急措施。在2022年2月24日俄國入侵烏克蘭之前，羅馬尼亞已經在鼓勵家戶安裝燒木頭的取暖裝置，政府說，燒木頭取暖並不落後，也不可恥，就連奧地利也在燒木頭取暖。根據上文下列關於羅馬尼亞政府對木柴管制措施，何者說明最適當？
