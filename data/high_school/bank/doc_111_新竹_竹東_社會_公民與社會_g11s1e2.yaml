  type: single
  page: 5
  stem: 根據新聞内容，關於葡萄柚在國內市場的情況，下列何者最能夠適當詮釋？
  options:
  - label: A
    content: 農民低估生產葡萄柚的機會成本導致短缺
  - label: B
    content: 民眾因媒體報導少買葡萄柚而改買替代品
  - label: C
    content: 葡萄柚與葡萄柚果汁屬於消費間的互補品
  - label: D
    content: 葡萄柚可外銷代表具有生產上的絕對利益
  group_stem: 雲林縣古坑鄉為柑橘類產區，有葡萄柚、柳橙、茂谷柑等水果，除內銷外，部分也外銷至中國，中國海關總署2022年8月宣布，暫停臺灣柑橘類水果輸入中國，包含鮮果和果汁及其他加工品都被禁止進口。 張姓果農說，前幾年媒體報導「高血壓藥物不能跟葡萄柚一起吃」，嚴重打擊內銷市場，「葡萄柚在臺灣只剩下果汁市場」，但今年葡萄柚品質很好，若打成果汁真的很可惜。 林姓果農說，農民種水果之外，還得身兼多職，建立品牌、經營顧客、網路行銷，若無法出口，所有柑橘類都留在國內，勢必對銷售產生影響。 古坑鄉農會表示，柑橘類作物到產季時多數農民會自行送往集貨場賣給盤商，少數則由農會送至北部市場拍賣，因產量與鄰近縣市相比少很多，平時主要以國內銷售市場為主，因此柑橘類禁輸的影響目前還無法看出，且今年受氣候影響，柑橘類有減產情形，會持續關注。 縣府農業處表示，2021年柑橘類全國出口到中國的數量為文旦4,800公噸、葡萄柚550公噸、柳橙100公噸、茂谷柑255公噸；古坑鄉是全臺柳橙產量最多的地方，中國禁止進口對柑橘類銷售影響很大。縣府會持續舉辦評鑑、柳橙節等活動，未來會陸續開拓市場。
