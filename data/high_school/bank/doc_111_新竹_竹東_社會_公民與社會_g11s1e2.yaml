  group_stem: '砂石與水泥是興建房屋的重要原料，若價格上漲將直接衝擊房價，從河川疏濬、砂石碎解到混凝土，層層轉售也藏有哄抬空間。早年疏濬工程會發包給下游廠商，疏運後的砂石料為廠商所有，廠商就多了囤積、哄抬、控制價格的空間。

