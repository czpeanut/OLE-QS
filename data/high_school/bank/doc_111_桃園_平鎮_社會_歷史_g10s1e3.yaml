  stem: 臺灣經濟奇蹟的推手——尹仲容，關於他的經濟政策說明如下：「那個時候尹先生的重心就是負責臺灣米的出口，同時進口肥料。結果，出口稻米賺外匯，導致臺灣人無法統統吃臺灣米，必須進口便宜的小麥，讓民間磨成麵粉來做饅頭、包子、麵條、水餃，尹先生因此鼓吹多吃麵少吃米；飲食習慣的變化，其實象徵著戰後經濟轉型的起步。」請問：尹仲容所推動的經濟政策為哪一階段？
