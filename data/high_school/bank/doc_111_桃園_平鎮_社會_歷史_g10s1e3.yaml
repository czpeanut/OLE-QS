    資料二：這個時期，臺灣深入參與國際分工體制，以勞力密集型加工出口工業為中心，取得了發展。此時期發展特點是外資、民間企業、廉價勞動和出口市場等三個因素。 資料三：這個時期，在政府當局主導下，進行了總額為2,094億新臺幣的鉅額投資。其中，建設基礎設施，即交通運輸、機場港口等，占總投資的63%；重化學工業的投資有鋼鐵、石油化學等，則占總投資的37%。
  answer:
