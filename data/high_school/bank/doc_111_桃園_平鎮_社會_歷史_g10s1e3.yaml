  stem: 資料一：墾戶制有強烈的合作性質。原因是開墾事業須要相當大的資金，多數墾戶並非大富豪，而且成敗難卜，獲利時間也不定，因此多數開發組織是合資的，以墾號向官府登記。
    資料二：墾戶所申請開發荒地非常廣闊，並無足夠的資金、人力進行開墾工作，如何解決此一難題呢？先民創造了一合作開墾模式。辦法是將荒地分成小塊，招承墾者，叫做「墾佃」，由他們自備資金、勞力，負責實際的開發工作。
    根據上述兩個資料，下列敘述何者正確？
  options:
  - label: A
    content: 資料一說明了農業開發資金龐大，必要時須官府投資，因此政府介入土地經營乃為常態
  - label: B
    content: 資料一所敘述的「墾號」，有出現開墾臺北的「陳賴章」、拓墾新竹的「金廣褔」
  - label: C
    content: 資料二敘述也衍生了清代土地所有制，即一田二主制，其中墾佃取得永佃權
  - label: D
    content: 臺南的七股鄉，新北的九份、十分寮等地名由來與資料二敘述有直接的關聯
  - label: E
    content: 資料二的拓墾方式，在宜蘭地區被稱為結首制
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
