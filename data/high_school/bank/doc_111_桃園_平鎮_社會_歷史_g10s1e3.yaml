    content: 「十大建設」的推行主要是受到國際冷戰局勢下，蘇聯禁止輸出石油至歐美等資本主義國家，因而爆發石油危機，造成全球經濟不景氣的衝擊
  - label: B
    content: 十大建設基本目的為消除基本設施不足的瓶頸，提高經濟活動的效率
