  stem: 1882-1891年某地海關報告書：「三十年前臺灣北部的可耕地大抵都用於種植稻米，因此有剩餘米可供出口之用。從那時以後，城市人口增加，大批茶農占用了高地，每年都有無數批的茶葉揀選者和包裝者到來……。到了最近幾年，不僅沒有可供出口的餘糧，而且有時還需要由大陸輸入食米來補充。」這應該是哪一個地方的海關報告書？
