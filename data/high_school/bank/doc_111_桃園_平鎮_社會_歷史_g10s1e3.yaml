  stem: 隨著臺灣的開放與對外通商，歐美人隨之湧入臺灣各大港市，並促成一八六○至一八八○年間漢人從大陸持續不斷移入臺灣，其中有一種漢人商人，靠替洋行買賣鴉片、茶葉、糖、靛藍染料、樟腦發財。例如在淡水許建勳父子，將英商怡和洋行和美商羅賓內洋行進口的鴉片配送到島上吸食鴉片者手上，還控制了南臺灣的米、糖市場，支配了北臺灣的樟腦、茶葉市場，因此洋商通常靠他們來取得臺灣本地商品，以外銷到香港、印度和更遠地方。請問：這種漢人商人的身分為何？
