  stem: '在「等位線與電場」實驗中，以實驗方法畫出兩電極間的等位線及電力線。

    (1) 右圖為不完整的實驗裝置圖，其中虛線方塊內未畫出的儀器$X_{1}$及$X_{2}$各是什麼？（4分）

    (2) 在線路連接完成後，進行測量等位線的實驗，其步驟如下所示，試完成步驟①空格內的內容。

    ① 將探針$N_{1}$置於測試盤中固定位置，記錄其位置，＿＿＿＿，此線即為等位線。

    ② 移動$N_{1}$至新位置，重覆步驟①。畫出另一條等位線。

    ③ 重覆步驟②，盡可能畫出多條等位線。（3分）

    (3) 畫出一個圓柱形（圓柱直徑3公分、高度5公分）與一條長條形金屬電極（長、寬、高各為30公分、3公分、5公分）之間的電力線與等位線分布情形（圓柱形與長條形金屬電極相距20公分，左邊長條形金屬為正極、右邊圓柱形金屬為負極，相對位置的俯視示意圖，如下表圖所示）。（4分）'
