  stem: '電流天平的主體為一塊長方形的絕缘板，在天平的一側有一掛物處，而另一側周邊有一U型銅條，該銅條與金屬中央支架K與K''連接，天平兩端到中央支架等距離。阿龍利用圖(一)的儀器裝置組合進行「電流的磁效應」實驗。其中電流天平所通入的電流為$I_{1}$、螺線管所通入的電流為$1_{2}$，如圖(二)所示。已知當$I_{1}$＝$I_{2}$＝0且天平前端未掛置小重物時，天平呈水平狀態，試回答下列各小題。

    (1) 在此實驗中會用到的主要儀器及其代替符號如下： 請畫出實驗中產生磁場的線路圖，包括所需儀器、接線方法，並標明電流方向。（3分）

    (2) 簡述通電流$I_{1}$與$I_{2}$後・維持電流天平平衡的原理為何？（2分）

    (3) 阿龍實驗時，先固定電流天平的電流$I_{1}$為2.0安培，增加質量均相等的小掛勾個數，逐次調整螺線管的電流$I_{2}$，使電流天平恢復平衡；如此取得對應的w（以小掛勾個數表示之）、$I_{2}$五組數據如下表： 請在答案卷作圖區畫出上表中小掛勾個數與$I_{2}$關係的圖線，再依據圖線的結果，寫下你對螺線管內磁場量值與$I_{2}$關係的結論。（5分）'
