  stem: 「磁力線」為虛構的線條，可用以描繪磁場的分布情形。有關磁力線的敘述，下列何者正確？
  options:
  - label: A
    content: 磁力線的切線方向即磁針N極所指的方向
  - label: B
    content: 磁力線相交處代表該處磁場的量值最大
  - label: C
    content: 磁力線的概念是厄斯特所提出
  - label: D
    content: 磁力線愈稀疏處，代表磁場愈強
  - label: E
    content: 磁力線由N極發出而經過空間後進入S極，為非封閉曲線
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)磁力線之間互相排斥不會相交會；(C)磁力線概念由法拉第所提出；(D)磁力線愈疏處，代表磁場愈弱；(E)磁力線由N極發出而經空間進入S極，再由磁鐵內部S至N極，為封閉曲線。故選(A)。
