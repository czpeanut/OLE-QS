- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關生產可能曲線之敘述，何者正確？
  options:
  - label: A
    content: 生產可能曲線是正斜率，以表示兩種產品有取捨關係
  - label: B
    content: 生產可能曲線上愈靠近 X 軸的生產組合，經濟效率愈好
  - label: C
    content: 生產可能曲線上組合點的移動是因為技術或資源產生變化
  - label: D
    content: 若為「向右上方突出」的曲線時即表示機會成本遞增
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)生產可能線為負斜率而非正斜率。(B)生產可能線上的各點，都同樣有效率。(C)資源或技術的變化會導致整條 PPC 的移動，而非點的移動。(D)正解。
- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 右圖為生產 X 及 Y 產品的生產可能曲線，假設原本的生產可能組合為丙，若受到各種因素的影響，生產組合產生不同的變化。有關這些變化之解釋，何者較為適當？
  options:
  - label: A
    content: 若 X 產品的市場價格上漲，生產組合將移至乙
    asset:
      key: s1_2_optA
      file: doc_112_台中_台中女中_社會_公民與社會_g11s1e2/s1_2_optA.png
      crop:
        page: 1
        rect:
        - 424.15
        - 222.85
        - 564.3
        - 352.9
  - label: B
    content: 若生產 X 的機器發生故障，生產組合將移至甲
  - label: C
    content: 若生產 Y 的原物料因船運誤期，生產組合將移至戊
  - label: D
    content: 若 X 產品的市場需求增加，生產組合將移至己
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) X 產品價格上漲，代表生產 X 產品利潤增加，生產組合應當會由丙右移至丁。(B)若生產 X 的機器故障，應當無法生產 X，而非移至同樣是最高效率的甲組合。(C)正解。因為就無法以最高效率進行生產，戊為在此情況下可能的生產點。(D)即便市場對 X 產品的需求增加，但在資源與技術不變的情形下，己為當下無法達到的產品組合。
- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某高中與食品廠發售限量版包裝乖乖，原本僅限校內學生訂購，因反應熱烈，食品廠決定加開產線，並進一步開放給校友及民眾訂購。若市場價格由供需決定，則下列敘述何者正確？
  options:
  - label: A
    content: 均衡價格上漲，均衡數量增加
  - label: B
    content: 均衡價格下跌，均衡數量增加
  - label: C
    content: 均衡數量可能增加或減少，均衡價格上漲
  - label: D
    content: 均衡價格可能漲或跌，均衡數量增加
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到，限量版乖乖反應熱烈，可知需求增加，需求線右移，另外廠商增開產線，代表供給增加，供給線右移，此時的價格不一定上漲或下跌，但是均衡數量一定會增加，故本題選(D)。
- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_4
