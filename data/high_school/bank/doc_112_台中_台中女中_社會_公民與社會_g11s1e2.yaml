  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，此為消費者的預期心理導致「需求」增加。(A)此為消費者偏好，導致供不應求的現象。(B)此為消費者偏好導致「需求」增加。(C)此為消費者預期心理，導致「需求」增加。(D)此為本身價格的影響，屬於「需求量」的變動，故本題選(C)。
