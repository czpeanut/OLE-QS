  stem: 秀子到文創市集擺攤賣自己精心設計，獨一無二的耳環。這天遇到一個客人，看了標價 890 元，一開口就出價 300 元，秀子心想，這客人不識貨，要是 300 元我就留著自己用了。雙方討價還價後，最終以 650 元成交。試從供需的角度分析，何者較為正確？
  options:
  - label: A
    content: 顧客的願付價格低於 890 元
  - label: B
    content: 秀子獲得 350 元的生產者剩餘
  - label: C
    content: 顧客的消費者剩餘為 240 元
  - label: D
    content: 秀子的機會成本不會超過 650 元
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)顧客雖然認為 890 元太貴而殺價，但並不代表其願付價格低於 890 元。(B)無中並無提到秀子的願售價格為何，無法判斷。(C)文中並無提到顧客的願付價格，無法判斷。(D)經濟學假定人是理性自利的，因此秀子的機會成本若高於 650 元，將不會以 650 元售出。故本題選(D)。
