  type: single
  page: 1
  stem: '我們把邦邦與阿源每個小時生產炒飯或燴飯的產出數量列表如右，假設你是店長，你會如何安排兩人的工作？

    |  | 邦邦 | 阿源 |

    | --- | --- | --- |

    | 炒飯 | 5 | 12 |

    | 燴飯 | 8 | 18 |'
  options:
  - label: A
    content: 阿源兩者的產出皆多，可由阿源決定生產何者
  - label: B
    content: 阿源的燴飯多邦邦 10 份，炒飯只多 7 份，所以在燴飯上有比較利益，應選燴飯
  - label: C
    content: 阿源應負責生產炒飯，邦邦應負責生產燴飯
  - label: D
    content: 阿源應負責生產燴飯，邦邦應負責生產炒飯
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 日本秋田縣知事（縣市首長）在秋田市舉辦的會議中，表示愛媛縣的特產炸魚板（Jako-ten）「很窮酸」等，其發言陸續引發各界批評。不過因為此一事件，愛媛縣內製造販賣炸魚板的店舖，開始收到大量來自秋田縣的訂單。請問前述事件對市場供需產生的影響與下列何例較為相近？
  options:
  - label: A
    content: 為迎接跨年夜，超商預備了比平日多兩倍的茶葉蛋
  - label: B
    content: 健身房歡慶開幕，一對一教練課程費用打八折
  - label: C
    content: 麝香葡萄價格上揚，廠商加緊包裝出貨
  - label: D
    content: 某餐廳獲選米其林一星，預約用餐人數是以往的三倍
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，魚板訂單的增加是來自於本身價格以外的因素，屬於「需求」增加。因此(A)此為生產者的預期心理，而增加「供給」。(B)打折屬於本身價格的影響，為「需求量」的變化。(C)葡萄價格上揚，使「供給量」增加。(D)此為消費者偏好增加而導致的「需求」增加，故本題選(D)。
- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '右表為某廠商的供給表，當市場價格為 40 元時，則下列敘述何者正確？

    | 願售價格 | 10 | 20 | 30 | 40 | 50 |

    | --- | --- | --- | --- | --- | --- |

    | 供給數量 | 0 | 2 | 5 | 8 | 10 |'
  options:
  - label: A
    content: 整體市場出現供過於求
  - label: B
    content: 廠商的供給數量共 15 個
  - label: C
    content: 生產者剩餘為 70 元
  - label: D
    content: 總生產成本為 320 元
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此處並無提供需求量的資料，無法判斷。(B)願售價格為廠商的成本，因此當價格為 40 元時，願意供給的數量為 8。(C)生產者剩餘為：（40－20）×2＋（40－30）×（5－2）＋（40－40）×（8－5）＝70。(D)總生產成本為 20×2＋30×（5－2）＋40×（8－5）＝250。故本題選(C)。
- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '下表為某產品的供給與需求對照表，請問何者敘述正確？

    | 價格（元） | 20 | 50 | 80 | 110 | 140 | 170 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 供給數量（個） | 0 | 100 | 150 | 200 | 250 | 300 |

    | 需求數量（個） | 900 | 700 | 500 | 300 | 100 | 0 |'
  options:
  - label: A
    content: 市場沒有達成均衡之可能
  - label: B
    content: 市場的均衡價格會介於 110 至 140 元之間
  - label: C
    content: 價格為 80 元時，消費者剩餘＝2,500 元
  - label: D
    content: 價格為 50 元時，社會福祉＝12,000 元
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)觀察表格不同價格的供給量與需求量，供給量與需求量在 110 ～ 140 元之間交叉，可推得均衡價格應位於 110 ～ 140 元之間，故本題選(B)。(C)價格 80 元時，消費者剩餘為：（170－80）×0＋（140－80）×100＋（110－80）×（300－100）＋（80－80）×（500－300）＝6,000＋6,000＝12,000。(D)價格為 50 元時，消費者剩餘為：（170－50）×0＋（140－50）×100＋（110－50）×（300－100）＋（80－50）×（500－300）＋（50－50）×（700－500）＝9,000＋12,000＋6,000＝27,000。生產者剩餘為：（50－20）×0＋（50－50）×100＝0。社會福祉：生產者剩餘＋消費者剩餘＝0＋27,000＝27,000。
- id: doc_112_台中_台中女中_社會_公民與社會_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 為避免黃豆價格過低影響農民生計與生產意願，政府規定黃豆價格每公斤不得低於 150 元。若其他條件均未變動，實施該政策將會帶來何種影響？
  options:
  - label: A
    content: 若黃豆原本的市場均衡價為每公斤 160 元，此措施將不會影響經濟福祉
  - label: B
    content: 當黃豆原本的市場均衡價低於每公斤 150 元時，此措施造成需求大於供給的現象
  - label: C
    content: 此類價格下限的價格管制，將會降低消費者剩餘、提高生產者剩餘
  - label: D
    content: 當黃豆原本的市場均衡價為每公斤 140 元時，此措施使農民惜售並囤積黃豆
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，政府為了避免黃豆價格過低，而訂定價格下限 150 元。因此(A)若市場均衡價格為 160 元，未違反價格下限，因此沒有影響。(B)應當產生供給大於需求的現象。(C)會降低消費者剩餘，但不一定會提高生產者剩餘。(D)市場均衡價格低於保證收購價，此時應當會趕緊以保證收購價賣出。故本題選(A)。
