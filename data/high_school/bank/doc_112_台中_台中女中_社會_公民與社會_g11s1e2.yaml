  stem: 中部知名蛋黃酥業者為反映生產成本增加，公告將於兩週後調漲價格。消息曝光後，湧現排隊人潮，甚至有人專程搭乘高鐵到店家排隊購買。請問前述現象的市場供需變化與下列何者相近？
  options:
  - label: A
    content: 五月天演唱會開售，購票網站瞬間擠爆當機
