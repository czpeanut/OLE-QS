  group_stem: 閱讀下列文字，回答23-24題。 村上春樹寫過一篇〈貧窮到哪裡去了？〉，裡面有點感歎現在社會「把貧窮當成一種沒錢的悲慘狀態來理解」，其實貧窮有著另一種的心靈自由，他認為「只要有想像力，我們大多的東西都可以克服，不管有錢也好，沒錢也好。」 現在自己賺錢自己花用，好像終於可以享受人生了。但實則不然。 我還是常因吝嗇被人恥笑：我從沒花錢買過手機，都是撿別人用舊不要的；也沒買車，去年才「忍痛」買了第一輛全新的摩托車，以前都是騎二手；家裡不裝有線電視，東西壞了先自己修理，一件衣服可以穿十幾年，買個東西要考量再三、舊東西捨不得丟，幾乎不去什麼地方玩……。 看起來是很悲苦的人生啊！其實不然，簡約的生活是因有另一種追求，那可是有相當深切的味道在其中。少年時的貧窮，真正帶給我的是無所計較，也就是隨時可以在小地方感到快樂而滿足的生活方式吧！ 不過我現在的問題在於如何教育孩子。時代已和過去不同，不可能讓孩子經歷自己苦過的歲月。才四歲多的她，已有了好幾架的書、影音產品和玩具，穿不下的舊衣是整箱整箱地淘汰。我發現我對於她的要求，幾乎無法拒絕；同時也盡其可能讓她使用品質較好的東西。這些時刻，我便興起害怕的念頭，怕她長大後沉迷於追逐名牌，在意衣服鞋子的款式，上課忙著畫睫毛膏、貼雙眼皮貼紙而無心聽講、不知物力維艱、不明白金錢來之不易、不懂體恤窮人，只是追逐著物質享受與過度浪費的生活形態……。也許我的擔心純屬多餘，但我們的下一代，砥礪現實生活的機會的確是比較少了。 所以，「千金難買少年貧」，人生能有某種機緣，在年輕的時候匱乏一下，只要志氣不被消磨、價值觀不因此而扭曲，那不啻是相當難能可貴的經驗。孔子很推崇「貧而樂道，富而好禮」的生活態度，我記得多年前的高中聯考，以「創造一個富而有禮的社會」當作文題目，當時搜索枯腸而無法下筆；現在我大約體會了，少年時生活環境清苦一點，在淡泊中，心裡存在著超越物質的追求並一步一步實踐它，那麼人生應該就可以「貧而樂道，富而好禮」了。（節錄自徐國能〈少年貧〉）
