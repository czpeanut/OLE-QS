  stem: 依據引文，下列關於音樂欣賞的敘述，最符合文旨的是： 「剛到巴黎時，覺得這裡既然是新音樂中心，一切都該前衛，而且要求嚴謹理論。有次輪到我報告一首莫札特作品，我仔仔細細把曲子從頭到尾整理一遍，樂句、節奏、和聲、曲式等等全都完整分析。」當郭爾自信滿滿，在老師與同學面前講解時，「沒想到當我說：『在這個小節，樂曲轉入下屬小調和弦』，教授居然毫不客氣地當場說『錯！』」 被當場抓出錯誤，郭爾自然覺得很沒面子。他一邊繼續報告，一邊再把那個和弦看了一次──等等，沒錯呀！這明明是下屬小調和弦呀！ 難道是老師看錯了？郭爾巧妙地把話轉回，又提了一次；可沒等他說完，教授居然還是說了「錯！」 同一個地方，居然被老師糾正兩次，這實在很難看。無論郭爾如何確定，那個和弦就是下屬小調，他也沒有勇氣再提一次。但是，「如果不是下屬小調，那個和弦又會是什麼呢？」好不容易捱到下課，郭爾馬上向老師請教。 「在那個小節啊」，教授淡淡地說，「莫札特，在音樂中灑下一道陰影。」 當郭爾在演講中說到此處，全場聽眾都笑了。有學生問他感想如何，他答：「荒謬透頂！我大老遠跑到巴黎，居然來學這個！」聽他這樣說，大家笑得更大聲了。 「可是，各位，我現在卻不覺得荒謬了……」話鋒一轉，這次，輪到郭爾淡淡地說，「因為當莫札特寫到那個小節，他心裡想的絕對不會是什麼進入下屬小調，而是要在音樂裡灑下一道陰影啊！」（焦元溥《想樂．序》）
  options:
  - label: A
    content: 欣賞不能單靠理論分析，還須了解作品的創作背景
