  stem: 下列敘述，符合本段文字主旨的是：
  options:
  - label: A
    content: 選出一個值得信賴的領袖，方可不誤入歧途
  - label: B
    content: 人當如羊群般順從，卻沒有辨別正確的方向
  - label: C
    content: 水可載舟，亦可覆舟，群眾的力量不容小覷
  - label: D
    content: 群眾效應有助於經濟發展，但易被政客濫用
  group_stem: 閱讀下列文字，回答21-22題。 科學家曾經做過一個這樣的實驗：他們在豢養羊群柵欄的出口處，橫放一塊木板，然後驅趕羊群跑出柵欄，只要第一隻羊跳躍過這塊木板，接著第二隻、第三隻、第四隻就會一一跟著跳過了，即使把木板悄悄移走，後面的羊群還是會跟著前面的羊隻，向上跳躍一下。科學家把這種現象叫做「羊群效應」。 其實這種「羊群效應」在人群裡叫做「從眾效應」。 所謂「從眾」，顧名思義，就是跟隨著群眾做出相同的反應。也就是說有人先那樣做或那麼說，不管對與錯，就有人跟著那麼做、那麼說，跟著做或說的人愈來愈多，加上媒體的推波助瀾，就形成了群眾運動，這就是臺灣諺語所說的「西瓜偎大邊」，社會學家稱它為「社會傳染力」的效應。 …… 「從眾效應」存在於市場機制上，說通俗一點，就是「趕流行」或「跟時尚」。想當年牛仔褲流行時，男女老幼都以穿牛仔褲為時尚，「牛仔風」風靡全球；「迷你裙」流行時，年輕少女甚至中年婦女都一窩蜂地趕時髦，一時蔚為風尚；之後又有「露背裝」、「嬉皮裝」等不一而足，也都曾風行一時成為潮流。這種趕流行的「從眾效應」不僅存在於普羅大眾，就是上層社會裡的貴婦士紳，也存在著這種效應，我們姑且叫它為「名牌效應」。 其實人類社會中最大的「從眾效應」就是民主機制。民主政治最基本的原則就是「從眾」，就是「取決於大多數」。所以政治人物為了爭取群眾的支持，必須利用人類的「從眾心理」，不得不「媚眾」，也就是討好社會大眾，於是發起「粉絲團」，成立「按讚隊」，掛勾「社群網站」，或利用「社運團體」，鼓動「熱血青年」，討好「鄉民酸民」，透過各種媒體，結合各類名嘴，散布對於自己有利，對於對手不利的訊息。那些訊息有些是無中生有，有些是誇大渲染，有些是言過其實，有些是憑空臆測，總而言之，就是要利用群眾的盲從特性，壯大自己聲勢，贏得政治利益。 旁觀「羊群效應」，我們或許會覺得羊群的可笑，但冷靜想想人類，又何嘗不是像羊群那樣地盲從可笑呢？日常生活中我們「從眾」而不自知；我們「媚俗」而不自覺，於是「人云亦云」；於是「一犬吠影，萬犬吠聲」；於是「一人吐虛，萬人傳實」；於是我們也加入了「羊群效應」的行列而不自知。（刪節自王思熙〈羊群效應與從眾心態〉）
