  stem: 已知鋅和鹽酸作用產生氫氣的反應級數為$H^{＋}$的二級反應，且反應速率與鋅的總表面積成正比。使邊長為5公分的正立方體鋅塊與1.0 M的鹽酸完全反應，需時800秒，則將該鋅塊切割成邊長1公分的正立方體，與4.0 M的鹽酸完全反應，需時若干秒？
  options:
