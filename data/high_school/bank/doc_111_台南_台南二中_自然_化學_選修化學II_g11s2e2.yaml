  - label: D
    content: '250'
  - label: E
    content: '64000'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 邊長5公分的正立方體切割為邊長1公分的正立方體，表面積會變為5倍，故反應速率變為5倍。又對於$H^{＋}$而言為二級反應，故濃度4倍時，反應速率16倍，因此整個反應的速率將提升為5×16＝80倍，反應時間為10秒。故選(A)。
