- id: doc_111_台南_台南二中_自然_化學_選修化學II_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 乙醇在600 K時，於$Al_{2}O_{3}$的表面上可進行如下的分解反應：$C_{2}H_{5}$OH(g) → $C_{2}H_{4}$(g)＋$H_{2}$O(g) 假設以$C_{2}H_{5}$OH(g)的濃度對時間作圖，可得一斜率為－4.00×$l0^{－5}$ M‧$s^{－1}$的斜直線，假設$C_{2}H_{5}$OH(g)的初始濃度為l.2×$10^{－2}$ M，$C_{2}H_{5}$OH(g)完全分解完畢，需時多久？
  options:
  - label: A
    content: '100'
  - label: B
    content: '150'
  - label: C
    content: '200'
  - label: D
    content: '250'
  - label: E
    content: '300'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 因濃度對時間作圖為斜直線，代表反應速率不受起始物濃度影響，故可得知其為零級反應。斜率為－4.00×$10^{－5}$ M／s，代表反應速率為4.00×$10^{－5}$ M／s。今有1.2×$10^{－2}$ M的反應物，則需要時間＝$\frac{1.2\times 10^{-2}}{4.00\times 10^{-5}}$＝300 (s)。故選(E)。
