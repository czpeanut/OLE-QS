  answer_status: verified
  answer_source: answer_key
  explanation: (1)略 (2) $KIO_{3}$莫耳數＝0.003 mol，配製成100 mL溶液，則濃度＝$\frac{0.003}{0.1}$＝0.03 M。 (3)步驟2中，取用0.03 mol的$Na_{2}S_{2}O_{5}$，由(1)之反應式，可知共得到0.06 mol的$NaHSO_{3}$。最後配製成1 L的溶液，故[$HSO_{3}^{－}$]＝0.06 M。在步驟5中，因各取10 mL混合，故反應初始時，[$HSO_{3}^{－}$]＝0.03 M，經過5秒後反應完成，故反應速率＝－$\frac{\Delta [HSO_{3}^{-}]}{\Delta t}$＝$\frac{0.03}{5}$＝0.006 M／s。 (4)當$HSO_{3}^{－}$用盡，$IO_{3}^{－}$才能與$I^{－}$反應生成$I_{2}$，並與澱粉呈色。反應式為$IO_{3}^{－}$＋$3HSO_{3}^{－}$ → $I^{－}$＋$3SO_{4}^{2－}$＋$3H^{+}$，故當$\frac{IO_{3}^{-}莫耳數}{HSO_{3}^{-}莫耳數}$＞$\frac{1}{3}$，才會有多餘的$IO_{3}^{－}$與$I^{－}$反應生成碘。溶液(A)中[$HSO_{3}^{－}$]＝0.06 M，溶液(B)中[$IO_{3}^{－}$]＝0.03 M，故五個選項中，$\frac{IO_{3}^{-}莫耳數}{HSO_{3}^{-}莫耳數}$的比值依序為：(A) $\frac{1}{2}$；(B) $\frac{1}{4}$；(C) $\frac{1}{8}$；(D)$\frac{3}{5}$；(E) 5。故選(A)(D)(E)。
