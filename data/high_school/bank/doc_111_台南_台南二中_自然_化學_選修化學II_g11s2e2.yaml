  answer_status: verified
  answer_source: answer_key
  explanation: 速率常數單位為$atm^{－1}$‧$min^{－1}$，則代表為二級反應。因此將體積壓縮一半，濃度會加倍，則反應速率將變為4倍。又室溫附近，每增加10 ℃，反應速率加倍，增加20 ℃則增為4倍，故反應速率為原來的4×4＝16倍。故選(C)。
