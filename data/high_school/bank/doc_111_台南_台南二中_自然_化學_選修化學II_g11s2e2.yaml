- id: doc_111_台南_台南二中_自然_化學_選修化學II_g11s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 鋁粉與過氯酸銨的混合物可作為太空梭火箭推進器的燃料，其反應式如下：3 Al(s)＋3 $NH_{4}ClO_{4}$(s) → $Al_{2}O_{3}$(s)＋$AlCl_{3}$(s)＋3 NO(g)＋6 $H_{2}$O(g)。將鋁粉與過氯酸銨各1.0 mol，放入一個體積為1.0 L、溫度為490 K的定體積恆溫反應槽內反應，並測得槽內氣體總壓力隨時間變化的關係如下圖。（假設其氣體為理想氣體，溫度為490 K的RT值＝40），8分鐘內$H_{2}$O的平均生成速率（M $min^{－1}$）為何？
  options:
  - label: A
    content: 6.25×$10^{－4}$
  - label: B
    content: 1.25×$10^{－3}$
  - label: C
    content: 1.875×$10^{－3}$
  - label: D
    content: '0.05'
  - label: E
    content: '0.075'
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_111_台南_台南二中_自然_化學_選修化學II_g11s2e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 171.35
      - 260.7
      - 321.75
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由圖可知，8 min時共產生0.6 atm的氣體。由PV＝nRT，可計算：0.6×1＝n×0.082×490，可得n＝0.015 mol。又可由方程式得知，生成的氣體中NO：$H_{2}$O＝1：2，故可得知在8分鐘內共生成了0.01 mol的水蒸氣，故其生成速率為1.25×$10^{－3}$ M/min。故選(B)。
