    1. 測定濾紙圓片上升至液面所需的時間的目的為何？ (A)為了比較過氧化氫分解速率 (B)為了比較過氧化氫溶液的濃度 (C)為了比較過氧化氫酶的濃度 (D)為了比較pH值對過氧化氫的影響

