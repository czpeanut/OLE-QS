  stem: 賀勒氏症（Hurler syndrome）是一種體染色體的隱性遺傳疾病，俗稱第一型IH亞型的黏多醣症，患者的兩條第四號染色體上的異戊二酸酶（iduronidase）基因皆缺損才會發病，原本可表現的第70或第402個胺基酸密碼子突變為終止密碼子，無法製造正常的酵素，導致體內兩種黏多醣（dermatan、heparan sulphate）推積，繼而影響外觀與呼吸系統，嚴重者會影響神經系統，賀勒氏症患者多半在10～12歲前即死亡。請依據上文判斷下列敘述哪些正確？
