  group_stem: 五○年代以前，科學家只針對蛋白質中各種胺基酸的比例作研究，1950年左右，<u>英國</u> <u>劍橋</u>的<u>桑格</u>（FrederickSanger）在研究胰島素時，發現胺基酸的排列順序直接影響了蛋白質的結構與功能。胺基酸的排列順序是蛋白質的初級結構，各種胺基酸彼此互相作用，使多肽縫有些部分呈螺旋狀、摺片狀，有些部分則呈不規律狀，這種多肽鏈的結構稱為蛋白質的次級結構；同一條多肽鏈可能具有一種以上的次級結構，使整條多肽鏈以三度空間的角度來看具有特殊的外型，這種更加扭曲的立體外型稱為蛋白質的三級結構，使蛋白質具有有特定的功能。一個有功能的蛋白質，有時由一條以上的多肽鏈次單元所組成，這些由次單元組成的複合體結構稱為蛋白質的四級結構。試根據上文回答第22-23題：
  answer:
  - D
  answer_status: verified
