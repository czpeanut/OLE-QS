  stem: '糖尿病已是現代高盛行的疾病之一，尤其第二型糖尿病的患者數更是節節攀升，第二型糖尿病的患者初期對胰島素具有阻抗性，細胞無法對胰島素產生反應，後期更會併發胰島素分泌不足的狀況，導致細胞無法利用血糖而造成血糖上升。鈉－葡萄糖共同轉運器-2抑制劑（SGLT2 inhibitor）可有效抑制腎臟對葡萄糖的再吸收，使過高的血糖隨尿液排出，減少高血糖對身體的負擔，是治療糖尿病的新藥。如附圖所示，鈉－葡萄糖共同轉運器的運作是以鈉鉀幫浦主動運輸製造的細胞內外鈉離子濃度差異為基礎，利用鈉離子欲擴散進入細胞而將葡萄糖同步攜入細胞，故亦屬於主動運輸的一種類型。圖中的GLUT2（Glucose transporter 2）則為葡萄糖轉運蛋白，是細胞運輸葡萄糖的載體蛋白。根據上文，下列敘述哪些正確？

