  stem: 資料甲：「臺灣一地雖屬外島，實關四省之要害，勿謂彼中耕種，由能少資兵食，固當議留；即為不毛荒壤，必藉內地輓運，亦斷斷乎其不棄。」 資料乙：「臺地向稱饒沃，久為他族所垂涎，今雖外患暫平，旁人仍眈眈相視，……年來洋務日密，偏重在於東南，臺灣孤懸海外，七省以為門戶，其關係非輕。」 根據上兩段資料，下列敘述何者為是？
  options:
  - label: A
    content: 皆為清朝官員所述，資料甲應為劉銘傳，資料乙應為沈葆楨
