  type: single
  page: 1
  stem: 16 世紀時，人們在「新西班牙」發現了豐富的白銀礦藏，當地的經濟條件一飛衝天。當地總督府的廚房裡，裡面來自歐洲的廚師，以及修道院、莊園和家財萬貫的銀礦主在城裡的宅院裡，烹調的都是天主教式的料理，包含麵包、葡萄酒、各式堅果醬料燉肉等。題幹中的「新西班牙」最可能指的是現在的哪裡？
  options:
  - label: A
    content: 巴西
  - label: B
    content: 美國
  - label: C
    content: 墨西哥
  - label: D
    content: 加拿大
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '從時間、豐富的白銀礦藏，可推知「新西班牙」應位於中南美洲的西班牙殖民地，故選(C)。(A)巴西是葡萄牙殖民地。(B)(D)美國與加拿大當時仍以英法勢力為主，並非「新西班牙」的中心地帶。

    2.13 世紀崛起橫掃歐亞大陸後建立大帝國的民族應是蒙古人，除了中國的元帝國，加上四大汗國統治的區域，可謂歷史上版圖最大的帝國，因此正確答案為(D)。(A)這個民族是指蒙古。(B)通稱蒙古帝國。(C)蒙古西征。

    3.1787 年通過的美國憲法放棄原有的邦聯制，中央政府採取三權分立體制，故選(A)。(B)此時的選舉仍有財產與性別、種族等諸多限制。(C)改採聯邦制。(D)南北戰爭後才廢除黑奴。

    4.(A)反對宗教迷信應為 18 世紀前期啟蒙運動的特徵，非 1789 年之後革命風潮的核心理念。(B)中產階級於中世紀後期已經出現。(C)革命風潮影響遍及全歐。

    5.從阿拔斯人招募的醫生包括猶太人與基督徒、翻譯希臘羅馬時期的醫學著作、《醫典》修正並改善蓋倫的理論等，皆可看出(C)伊斯蘭醫學兼容並蓄的特色。(A)兼容各民族的成就，並非原創。(B)題文資料不足以推得此結論。(D)《醫典》能夠修正改善蓋倫的理論，可見伊斯蘭的醫學成就高於基督教世界。

    6.(A)為正解，甲、乙兩國分別為法國與英國。(B)乙國（英國）的勢力並未涵蓋整個中南半島。(C)丙國為統治印尼的荷蘭，但於 19 世紀末已不再是「海上馬車夫」。(D)丁國為統治菲律賓的美國，並未在非洲建立殖民地。

    7.題文強調統一大業「應該由薩丁尼亞王國來完成」，(A)(B)說明統一運動的背景，未提及薩丁尼亞王國，(C)加里波底獻地，並非薩丁尼亞王國的作為，因此符合題意者為(D)，加富爾為薩丁尼亞王國的首相，對義大利統一所做的實質貢獻。

    8.阿拉伯人於 8 世紀新征服的這塊土地，曾經是羅馬人統治的區域，且日後經濟與文明程度已可以和巴格達相抗衡，因此可推知為(C)伊比利半島的哥多華。(A)(D)未曾被羅馬人統治過。(B) 7 世紀時已被阿拉伯人征服，改信伊斯蘭教。

    9.從「最下層居住的是法老」一句，可推知此地為埃及，於 19 世紀下半葉成為兵家必爭之地的原因是(B)蘇伊士運河的開通，大大縮減東、西方航行的距離與時間。(A)石油在 19 世紀下半葉還不是重要能源。(C) 20 世紀前期第一次世界大戰後。(D)埃及為英國與法國的競爭之地，與德國無關。

    10.根據題文所述，巴黎公社摧毀舊的資產階級國家機器，實行無產階級國際主義原則，吸收外國進步僑民「參與戰鬥」，因此可推知受到激進的社會主義思想影響，答案為(D)馬克思。(A)(B)屬於烏托邦社會主義者，主張成立集體經濟的合作組織，(C)英國費邊社成員，主張透過漸進改革實現社會主義，不鼓吹革命手段，三者皆屬溫和的社會主義。

    11.(A)(C)歐洲人於大航海時代已展開對世界的探勘，後因經濟與工業的發展而逐漸產生民族優越感。(D)在「歐洲中心論」的心態下，視其他文化為野蠻、落後，優勝劣敗的評斷與文明發展順序無關。

    12.題文的「空想社會主義」應是烏托邦社會主義，為實行「財產公有制」，學者建議成立集體經濟的「公社」組織，合理、平等的分配所得，故選(D)。(A)(C)這是費邊社會主義的主張。(B)此為馬克思主義的作法。

    13.根據題幹線索「威尼斯商人獲益最大」、「洗劫□□的主要街道」、「威尼斯特區」、「搶占拜占庭 3／8 的領土」、「總督被稱為拜占庭帝國 3／8 的君主」，可以推斷這是描述第四次十字軍的軍事行動，其最終攻擊與占領的對象是君士坦丁堡，故選(C)。(A)「□□」指的是君士坦丁堡。(B)應是 15 世紀中葉。(D)應是希臘、羅馬與伊斯蘭的風格。

    14.從題文敘述可得知「這個國家」為義大利，在地理大發現後，重商主義與殖民重心轉向大西洋，義大利城邦（如威尼斯、熱那亞）失去貿易優勢，無法與大國競爭，導致長期衰退與分裂，故選(B)。(A)黑死病雖對社會有重大打擊，但義大利在疫情後仍進入文藝復興高峰，無法作為衰落分裂的主因。(C)宗教戰爭主要集中在中北歐，與義大利的歷史衰退無直接關聯。(D) 18 世紀革命浪潮與義大利的「衰退」無直接因果關係，但是革命反而激發民族主義與統一的意識。

    15.(A)穆斯林信仰中的「阿拉」就是「真主」，與基督教信仰中的上帝是同一位神，且伊斯蘭教嚴格禁止神的肖像崇拜。(B)基督徒主張耶穌是神，並非先知。(D)教宗是天主教最高領袖，與伊斯蘭教無關，穆斯林不會以擔任教宗為榮。

    16.(B)清真寺建築藝術受到拜占庭與波斯影響，並非原創性。(C)各地清真寺的建築特色與風格受當地建材與人文環境影響，並非一貫的華麗風格。(D)教義禁止偶像崇拜，因此清真寺內部不可能有人物雕像與自然寫實畫像。

    17.題文所述的外交文件為 1823 年美國總統門羅發表的「門羅宣言」，意在警告歐陸國家切勿出兵干預中南美洲的獨立運動，故選(A)。

    18.從「更多尋找職業的人被趕到城市去，城市和手工業工廠將會擴大」，可知圈地運動導致失去土地的農民遷移到城市去，成為工業發展的勞動力，故選(B)。(A)英國王權並未解體。(C)圈地運動的農場主以機器取代農民耕種，更能提升農業生產效率。(D)圈地運動助長工業革命的發生。

    19.這位傳教士是李文斯頓，雖然其目的欲絕禁非洲的奴隸貿易，但因其深入非洲內陸探險，主張歐洲人到非洲內陸通商、引入文明，反而造成非洲成為歐洲人掠奪的新目標，因此答案為(C)。(A)黑奴貿易的正式廢除是透過英國政府及其他廢奴運動人士的長期努力，與李文斯頓並無直接關係。(B)北非於羅馬帝國統治時期已接受基督教信仰。(D)此為德意志帝國首相俾斯麥的作為。

    20.(B)應是受到費邊社會主義的影響。(C)第一次世界大戰後才首度給予婦女投票權。(D) 1928 年的國會改革法案，英國女性才擁有與男性同等的選舉權利，實現全民普選。

    21.(A)資料三的立場與資料一、資料二不同，主張穆斯林婦女可以穿戴傳統服飾。(B)三段資料對穆斯林婦女傳統服飾的態度分別為否定、中立與肯定。(C)資料一明顯欲以國家法律來限制穆斯林婦女的傳統宗教服飾。

    22.題幹明確指出「法、西、荷等國」參戰對抗英國，使英國「陷於孤立」。這反映美國能成功的關鍵在於得到強大盟友的支持（如法國提供軍援、軍隊與海軍支援），這些支持對戰局轉折極為關鍵，故選(B)。

    23.1864 年俾斯麥與奧匈帝國聯手對丹麥發動戰爭，這是藉由軍事手段實現德意志的統一，直接體現「鐵和血」的政策，故選(B)。(A)(C)(D)三者談論經濟合作或外交結盟，但未涉及軍事行動。

    24.十字軍東征的軍事行動與宗教目的並未達成，但在經濟與文化方面卻影響深遠，促成東西方的商業與文化交流，(D)為正解。(A)屬於宗教領域，雖然收聖地耶路撒冷，但不久即失去。(B)基督徒與穆斯林之間的仇恨於日後更為加深。(C)古希臘羅馬的思想由伊斯蘭世界重新傳回歐洲。

    25.美國於 1823 年提出〈門羅宣言〉，主張「美洲是美洲人的美洲」，反對歐洲勢力干預拉丁美洲事務，實質上是希望擴展美國在美洲的影響力，支持中南美洲的獨立可削弱西班牙與葡萄牙等殖民母國的力量，(A)為正解。

    26.19 世紀上半葉維也納會議後，統治階級支持的保守主義上揚，但受到法國大革命思想洗禮的人民群眾卻渴望自由主義，兩者矛盾衝突下造成各地革命風潮不斷，因此答案為(B)。

    27.(B)帖木兒於 15 世紀初已逝世，且鄂圖曼帝國與蒙兀兒帝國並未彼此爭霸。(C)鄂圖曼帝國並未與蒙古人交手；英國東印度公司是在 1600 年才成立，且真正對蒙兀兒帝國造成威脅是在 17、18 世紀。(D)鄂圖曼帝國並未統治伊比利半島，且伊比利半島的穆斯林勢力早於 1492 年被驅逐，不再由穆斯林政權控制。

    28.(A)僅可可的原產地在美洲。(B)咖啡、可可的原產地不在亞洲。(C)資料提到的是英格蘭對進口商品課徵關稅充實國庫，沒有涉及對北美殖民地課稅。美國獨立運動確實與茶葉稅有關（如波士頓傾茶事件），但那是指英國向北美殖民地課稅，而非本題中描述的英國本土稅收。

    29.伊斯蘭教於 7 世紀建立，從資料一推斷此事件發生於 13 世紀，伊斯蘭世界為非穆斯林大舉入侵統治，應該是指蒙古西征後所建立的伊兒汗國，而此時伊斯蘭世界的文化、宗教與政治重心也隨之轉向埃及和北非地區，故選(A)。(B)伊斯蘭教於 7 世紀後半葉已分裂為兩教派對立。(C)第二次世界大戰結束，以色列復國後，與 13 世紀蒙古入侵無關。(D)並無此事，與史實不符。

    30.從資料一政權境內的古文明來推斷，此政權為阿拉伯帝國的阿拔斯王朝，全盛時期與中國唐朝相毗鄰，故選(C)。(A)阿拔斯王朝屬於什葉派。(B)阿拉伯帝國。(D)飲食規範中沒有不食蔥蒜、不殺害生命的規定。'
