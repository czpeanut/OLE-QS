  stem: 新左派史學家霍布斯邦認為：「1789 ～ 1848 年間出現一股股的革命風潮，此股革命風潮從英、法兩個孿生的火山口向外爆發，而結果之一是中產階級取得最後勝利。」下列關於題幹中所提及的革命風潮理解何者正確？
