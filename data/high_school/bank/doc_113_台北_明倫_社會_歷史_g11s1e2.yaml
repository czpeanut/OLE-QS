  stem: 漢彌爾頓是美國憲法的主要起草人之一，在 1787 年的制憲會議上，他與華盛頓等人克服種種阻礙，促使這部憲法得以順利通過。他與美國首任大法官傑伊、後來擔任美國第四任總統的麥迪遜聯合發表了八十五篇重要文章，大力宣揚「□□□□」的重要性，這部憲法終於在 1789 年公布實施，被視為啟蒙思想在大西洋彼岸的開花結果。請問「□□□□」內應填入
