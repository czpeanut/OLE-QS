- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e3_s2_45
  section: 2
  number: 45
  type: single
  page: 13
  stem: 2020 年在疫情的影響下，各國經濟慘淡但股市卻大漲，甚至創下有史以來的新高。造成此結果的原因應為何？
  options:
  - label: A
    content: 各國政府大幅興建公共建設以提升國內 GDP
  - label: B
    content: 央行降低基準利率以減少市場上的熱錢流動
  - label: C
    content: 各國政府為了使經濟回升制定疫情紓困方案
  - label: D
    content: 央行以印製鈔票方式鼓勵民間企業消費投資
  group_stem: '2020 年因 COVID-19 疫情，全球各地無數人失去了工作或事業，對全球經濟與社會造成的衝擊之嚴重，恐怕比 1929 年的大蕭條更甚。然而奇怪的是，各地股市卻「漲」聲響亮：從美國道瓊工業指數，到臺灣加權股價指數，甚至接連創下有史以來的新高？為何在景氣慘澹、未來更充滿不確定性的同時，資本市場的表現卻恰恰相反？每當百業蕭條、民眾怨聲載道時，當今奉福利國家為主流的各國政府，自然要「體民所苦」、想辦法「振興經濟」。

    通常可用的手段有二：財政政策和貨幣政策。前者主要透過減稅、增加公共支出、投資特定產業等方式，調整國家的經濟體質。這個方法的代表性案例是大蕭條時，美國總統羅斯福推出的「新政」，它多半相對能夠「治本」，卻也往往需經過一定的立法程序、因而需要一段時間方能見效。後者，即中央銀行降低基準利率，或直接擴大資產負債表──即俗稱的「印鈔票」，針對特定對象「紓困」。好聽一點的講法叫量化寬鬆（QE），直白點講就是「大撒幣」。它並不能直接解決經濟體質的問題，卻往往能透過讓市場上流動的資金增加、從而達到「短期治標」的效果。

    根據各國央行的公開資訊，從 2020 年 3 月至今，全球主要經濟體（美國、歐盟、日本、中國）等的通貨（即「鈔票」）總量，若單純以名目價值來看，已經超過 2008 年之前人類歷史 5 千年中，各國所有貨幣加總的總值。

    各國大印鈔的代價是什麼？即便美國可以轉嫁自身的通膨壓力，但於國際貿易戰場上，價格早已做出反應──明明疫情尚未退去，但主要國家的股匯市、大城市的房價皆再度上漲；大宗商品也不遑多讓，原油價格回到相對高點，玉米，小麥每噸的價格也都有 40 ～ 50 ％的漲幅，再看到金屬、銅、鋁、鐵礦，以及稀土等，無論現貨期貨，價格也連帶影響到生產鏈與供應鏈。

    資料來源：Jack I. C. Huang：《大撒幣時代：為何疫情重創全球，股市卻狂漲？因為我們是史上最「有錢」的一代》。換日線。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文的資訊：中央銀行降低基準利率，或「印鈔票」，鼓勵民間企業消費投資，故選(D)。(A)題文未提到各國政府大幅興建公共建設。(B)央行降低基準利率以增加市場上的熱錢流動。(C)各國財政政策主要透過減稅、增加公共支出、投資特定產業等方式；貨幣政策則是中央銀行降低基準利率，或「印鈔票」。
