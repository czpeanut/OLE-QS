- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 隨著 COVID-19 疫苗接種持續，美國就業市場似乎正逐漸復甦。高盛集團（Goldman Sachs）首席經濟學家 Jan Hatzius 認為：「受惠於拜登政府 1.9 兆美元紓困案，以及疫苗進展持續，將有望帶動就業熱潮，美國 2021 年失業率有望回到疫情前水準，一直以來，失業率數字被視為一個反映整體經濟狀況的指標，而它又是每個月最先發表的經濟資料，是市場上最為敏感的月度經濟指標。」上述關於經濟學家對於就業與失業的敘述，下列推論何者正確？
  options:
  - label: A
    content: 元元因工作表現不佳被裁員後，從此泡在網咖中不願工作，失業率會增加
  - label: B
    content: 國防部為了募兵制大舉徵才，阿蔡在大學一畢業後就馬上報名獲錄取，此時我國失業率會減少
  - label: C
    content: 就讀大學經濟系的王修明在假日都會去打工賺取生活費，故他應列入勞動力中的就業人口
  - label: D
    content: 張婷婷在證券業上班，後來公司因經濟不景氣裁員，使她面臨失業的情況，而她目前仍努力的在找新工作，這會使失業率增加
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '失業率＝失業者／勞動力×100 ％，張婷婷被裁員，屬失業者增加，失業率增加，故選(D)。(A)元元不願工作，不算失業者，屬非勞動力，故失業率下降。(B)阿蔡本為大學生，屬非勞動力，畢業後直接投入軍職，也不屬於民間人口，故不影響失業率。(C)學生屬非勞動力。

    6.2008 年 1 月至 2008 年底金融海嘯發生前的變化，應觀察丙，丙的高峰期為 3 月，故 2008 年 1 月 ～ 3 月應是繁榮期，3 月之後進入衰退、蕭條，直到 2009 年 2 月至谷底，之後才復甦，故選(D)。

    7.若一國國內景氣衰退，導致廠商大量生產的產品無法售完，則廠商不願意繼續投資，故選(B)。(A)景氣衰退，政府會增加消費支出（G），以刺激景氣。(C)景氣衰退時，民間消費支出(C)可能會減少，但不會如廠商投資那麼直接，原因是一般人民生活仍須基本消費。(D)淨出口額無法直接判斷。

    8.由景氣循環波動造成的失業即為循環性失業，故選(D)。(A)(C)為摩擦性失業。(B)為結構性失業。

    9.物價膨脹時，則存錢的利率不及於通膨指數，則人民的儲蓄意願降低，甚至會改買黃金等實物保值，故選(D)。(A)通膨造成投資意願下降。(B)通膨降低民眾購買力，故生活品質下降。(C)薪水階級領取固定薪資，購買力下降，處於不利的地位。

    10.特色一為製造業外移，故形成結構性失業；特色二為出口衰退，故為景氣循環導致甲國出現循環性失業，故選(C)。

    11.當某國人民的所得增加、消費能力增強，表示需求增加，故形成需求拉升的物價膨脹，進而使失業率下降，故選(A)。

    12.由表中可以判斷，中國和香港占我國出口比率的第一位，因此若中港地區對我國的產品需求減少，則會影響我國經濟景氣下滑，故選(D)。(A)我國對東協出口比重大於歐洲，因此我國應該更關心東協的民間需求狀況。(B)日本在表中排名第五，因此相較於其他國家，不是最為重要的出口夥伴。(C)美國和中國都是我國重要的出口國，因此兩國之間貿易戰，會影響我國經濟甚鉅。

    13.台積電將晶片販售給美國蘋果公司，會獲得銷貨收入，故(A)錯誤。台積電為可貸資金需求者，因此會透過(B)(C)(D)的管道籌措資金。

    14.證券交易所為供有價證券之競價買賣所開設之市場，故屬於丙股票市場，故選(C)。

    15.當國外對我國的產品需求增加，我國出口商品的價格自然會上升，此時投資報酬率也會跟著上升，廠商的投資意願會增加，故資金的需求增加，在其他條件不變的情況下，利率會上升，故選(B)。

    16.消費者增加對房屋的需求，表示資金需求增加，因此均衡利率會上升，故選(B)。

    17.一個國家因為經濟景氣欠佳，會實施寬鬆貨幣政策，故會降低存款準備率、降低重貼現率、買回政府公債，以讓市場的貨幣增加，故選(D)丁國。

    18.由於越南是表中出口額占 GDP 的比重最大的，因此若是各國緊縮自由貿易，嚴格管制進口品，則對越南景氣所造成的衝擊應是最大的，故選(B)。(A)越南國內景氣在附表的五國中，最容易受到國際景氣波動影響。(C)因為表中沒有馬來西亞與新加坡之間的貿易關係，故無法判斷如果新加坡發生金融危機，是否對馬來西亞的景氣影響最大。(D)若就表中數字判斷，美國景氣衰退應是對我國影響較大。

    19.民間人口包含勞動力與非勞動力，因此未找工作但隨時可以上工的人口，找到工作後由原先的非勞動力變為勞動力，並不影響民間人口的計算。故選(C)。

    20.從市場交易效率的角度來看，物價膨脹係因貨幣數量過多而導致物價上漲，因此可能對消費者產生皮鞋成本，對生產者產生菜單成本等，使廠商資源誤置，故選(D)。(A)皮鞋成本是針對消費者而言的效率損失，指物價持續上漲，消費者若預期銀行會升息，將會降低現金持有的數量，增加到銀行或 ATM 提領現金的次數，讓鞋底消磨速度增快。(B)消費者在物價膨脹時，會購買黃金等實質資產變現以求保值。(C)菜單成本是針對生產者而言的效率損失，指廠商可能要更改印刷、更改銷貨系統等損失。

    21.(乙)(丙)是進口成本上漲而形成的通貨膨脹，這是一種全面性物價的上升，故選(B)。(甲)梅雨帶來的豐沛雨量，導致菜價上揚，並非全面的物價上漲，且非永久性上漲，故不屬物價膨脹現象；(丁)貨幣數量發行過多造成物價上漲現象才算。

    22.房屋價格上揚，是受到進口的國際鋼筋原料價格大幅上揚，而非出口產品價格因素影響，故(D)錯誤。(A)國際鋼筋原料價格大幅上揚，故房屋價格上揚原因是受到成本推動因素影響，正確。(B)房仲公司可能要更改印刷、更改銷貨系統等損失為菜單成本，故正確。(C)房屋價格上揚主要是受到進口鋼筋原料物價膨脹影響，故正確。

    23.由圖中可以判斷，國泰世華銀行的利息與手續費淨收益皆為最高，故選(C)。(A)土地銀行的主要營收來源為【放款】利息收入－【存款】利息費用。(B)臺灣銀行的利息收入是四家銀行中最高的，但無法推論其利率最高，因為可能是貸放的客戶或金額較多。(D)由臺北富邦銀行與國泰世華銀行的手續費收入較高，推論兩家銀行的信用卡發卡量可能較多。

    24.定存族小心錢放銀行，愈存愈薄，指的是錢存在銀行雖然有名目利率，但通膨因素會讓實質利率變成負值，故選(C)。(A)股市、債市泡沫化是指金錢遊戲盛行後的結局。(B)中央暫停降息，指央行的寬鬆貨幣政策暫停。(D)消費需求強出口旺，指出口帶動經濟成長。

    25.當投資者預期未來獲利能力會提升時，則投資意願便會提高，因此資金需求增加，故市場均衡利率會上升，故選(A)。

    26.當我國出口暢旺，則廠商會收到美元的銷貨收入，廠商將美元換成臺幣，會導致央行外匯存底逐漸增加，故選(D)。(A)新臺幣升值有利進口商，不利出口商。(B)新臺幣升值表示其他國家看好我國未來經濟前景，不斷將資金投入臺灣。(C)中央銀行可能會透過買入外匯資產（美元）來對抗此狀況，以避免升值太快。

    27.冰島經濟嚴重衰退，表示 GDP 下降，因此應採取寬鬆的貨幣政策，降低利率來增加市場上的貨幣量，故選(C)。(丙)冰島不得不向國際貨幣基金會融資借錢；(丁)由於冰島貨幣貶值，因此外國遊客對冰島的觀光需求增加。

    28.2008 年至 2010 年的重貼現率下降，故判斷央行是採寬鬆貨幣政策，增加供給使利率下降，故選(A)。(B) 2004 年至 2008 年的重貼現率上升，故判斷央行是採取緊縮貨幣政策，以提高貼現的成本。(C) 2002 年至 2004 年的重貼現率下降，故判斷央行是採取寬鬆貨幣政策，以增加貨幣供給。(D) 2010 年至 2020 年的重貼現率時升時降，故可能在不同時期採寬鬆或緊縮的貨幣政策。

    29.業者有意願增加固定投資的前提，必須是名目報酬率＞物價膨脹率＋借款利率 1.5 ％，故業者整年都不會願意投資，故選(C)。

    30.澳洲的薪水平均雖是臺灣的 3、4 倍以上，但我們必須考量物價水準，才是實質購買力，故選(C)。(A)從名目薪資來看，澳洲的薪水平均是臺灣的 3、4 倍以上，臺灣人的生產力約只有澳洲人的 1∕3 到 1∕4。(C)無法得知澳洲失業率與臺灣的高低比較。(D)由於不知物價水準，因此無法判斷澳洲的生活水準是否為臺灣的 4、5 倍以上。

    31.(A)(B)利率愈高，對放款者愈有利，可貸資金供給量愈大。(C)(D)利率愈低，對借款者愈有利，可貸資金需求量愈大，故選(D)。

    32.圖為 1980 至 2005 年間，全球 75 個國家貨幣供給成長率與物價上漲率之間的關係，故此圖在探討貨幣政策可能對物價產生的影響，故選(B)。

    33.當實質利率低於均衡利率時，則廠商的投資意願上升，市場資金需求量增加；而家戶的儲蓄意願下降，市場資金供給量減少，因此會出現資金供不應求的資金不足現象，故選(B)。

    34.題文提及年底臺灣景氣未達高峰，因此不屬繁榮階段，故(A)不正確。(B)年中因臺灣疫情控制較好，航運業業績開始升溫，顯示國際景氣逐步恢復，進出口漸有起色。(C)臺灣航運業受到全球景氣波動衝擊，故表示臺灣景氣易受國際景氣影響。(D)臺灣出口以中、美兩國為重，故年初中、美景氣受疫情重創，會影響兩國對臺的進口需求。

    35.臺灣出口額占 GDP 總額五成以上，因此國際油價逐漸提高，會導致臺灣廠商成本上升（供給面），且使國際市場對臺灣的需求減少，臺灣出口受限，故影響臺灣景氣下滑，(B)正確。(A)(B)(D)為需求面，非供給面。

    36.Y－Z＝現役軍人與監管人口。Z－L＝非勞動力，例如：家庭主婦、學生、退休公務員、無工作意願也未工作的遊民。L－E＝失業人口，例如：被裁員的勞工、大學畢業未找到工作的小王、流浪教師小林等。故選(B)。

    37.失業率＝失業者／勞動力×100 ％＝（900－870）÷900×100 ％≒3 ％，故選(B)。

    38.國際移工增加表示勞動供給增加，在不考慮其他因素下，勞動市場均衡量增加，均衡薪資下降，故選(C)。

    39.立委提出的建議「限制每年只能引進 20 萬名外籍勞工」，屬於數量管制，若管制數量小於均衡數量，則會使勞動供給量小於需求量，造成缺工的情況，故可能造成非法工作的外籍勞工可能增加，故選(B)。(A)外籍勞工的薪資將上升。(C)外籍勞工的薪資是否市場化，須視政府是否介入干預。(D)管制外勞數量，社會福利將會減少。

    40.由於基本工資高於均衡價格，因此勞動供給量大於勞動需求量，會出現失業狀態，故選(C)。(A)(D)對勞工有超額供給。(B)市場將會出現失業狀態。'
