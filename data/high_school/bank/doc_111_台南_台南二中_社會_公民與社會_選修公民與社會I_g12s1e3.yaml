  stem: 炭治郎正在修習本學期的「公民科探究與實作」課程，現在正在進行「觀察與蒐集資料」的階段，他閱讀的資料如右圖所示，以此回推他目前的研究問題最有可能是以下何者？
  options:
  - label: A
    content: 中美貿易戰開打後，美國部分廠商將訂單轉移到臺灣生產，廠商對市場發展前景看好，會對可貸資金市場產生何影響
    asset:
      key: s1_4_optA
      file: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e3/s1_4_optA.png
