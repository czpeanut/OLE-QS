- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 根據日本在地報導指出，由於原油價格下跌和對中國經濟的不安影響，讓日本中央銀行推遲 2 ％的通貨膨脹目標，並持續實施負利率政策。負利率可以鼓勵銀行放款，一方面是刺激消費者花錢而不是儲蓄，刺激國內支出和企業投資，同時貨幣因此進一步貶值，有助於出口。請問以下何種狀況與上述日本所實施的政策帶來類似的影響？
  options:
  - label: A
    content: 寬鬆的貨幣政策會使長期均衡利率偏低，使市場資金缺乏，產生物價膨脹現象
  - label: B
    content: 低利率政策會使借貸成本降低，會使家庭固定投資的意願增加，促進民間消費
  - label: C
    content: 透過降低債券利率，市場上的資金會留存於國內產業，將有利於刺激經濟發展
  - label: D
    content: 此政策採取釋放資金到市場的模式，可促使全體產業發展，將可縮小貧富差距
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 依題文所述，日本實施負利率政策，是寬鬆的貨幣政策，目的在使借貸成本降低，會使家庭固定投資的意願增加，促進民間消費，故選(B)。(A)寬鬆的貨幣政策會使市場資金增加。(C)(D)市場上的資金不一定會留存於國內產業，也可能造成投資股市或房地產，造成投機盛行，不一定可促使全體產業發展，常因此擴大貧富差距。
