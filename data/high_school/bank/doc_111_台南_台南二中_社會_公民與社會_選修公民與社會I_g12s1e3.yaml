  section: 2
  number: 41
  type: single
  page: 11
  stem: 有人認為乙的批評是對法律上平等原則的誤解，下列何項論述最能反駁乙學者？
  options:
  - label: A
    content: 立法機關依民主程序議決法律適用於所有人民，即已落實法律上平等原則
  - label: B
    content: 在婦女擁有包括出任公職等選擇職業的自由時，即已落實法律上平等原則
  - label: C
    content: 保障名額制度未直接造成其他性別參選者的不利，不違反法律上平等原則
  - label: D
    content: 制度設計按照性別社會處境的不同給予差別待遇，可實現法律上平等原則
  group_stem: '19 世紀婦女運動興起時，便訴求女性參政與就業之平等。200 年後的今天，這兩項平等實現了嗎？學者仍有不同意見。

    在政治參與方面，人們常主張各國女性元首持續增加，女性的政治參與已趨於平等。但甲學者提醒，各國重要政治職務（如國會議員等）的性別比率仍是男高於女，因為傳統認為女性較不懂政治、欠缺參與技能，這不僅使人們較不支持女性從政，甚至導致女性即便具備能力，仍自我限縮、對政治事務卻步。

    為改善此問題，許多國家在各種公職選舉訂定女性保障名額。但乙學者批評保障名額雖增加女性出任公職的機會，卻對未受保障者形成另一種歧視；另外，丙學者提醒，基於選舉制度差異，有些公職選舉適合規劃保障名額，有些並不適合。

    至於就業平等，許多人認為統計顯示女性失業率低於男性，故現今女性就業並無不利，無須保障。但丁學者持反對意見，他主張應重視女性勞動參與率較男性低，僅看失業率無法完整掌握女性參與勞動市場的不利之處。請問：'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 乙學者的觀點「保障名額雖增加女性出任公職的機會，卻對未受保障者形成另一種歧視」，但批評者認為此觀點忽視女性長期因社會結構因素，導致在參政機會上的不利處境，所以若能透過「合理差別待遇」積極平權措施，改善其不利處境，才能實踐法律上的實質平等，故選(D)。(A)此做法不能保障落實法律上平等原則。(B)即使在婦女擁有包括出任公職等選擇職業的自由時，仍因性別刻板印象等傳統，不能落實法律上平等原則。(C)保障名額制度可能造成其他性別參選者的不利，但為「合理差別待遇」。
