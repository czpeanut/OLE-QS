  stem: 日本動畫「蠟筆小新」中，主角小新的爸爸野原廣志號稱是個還有 32 年房貸要繳的男人。在廣志想向銀行貸款的當下，以下哪一個時事的發生，會增加他借貸買房的欲望？
  options:
  - label: A
    content: 政府宣布提高公債利率
  - label: B
    content: COVID-19 疫情發生，各國政府紛紛宣布調降利率
  - label: C
    content: 政府宣布調高利率
  - label: D
    content: 該國當年通貨膨脹率極低，還低於銀行利息
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 根據需求法則，當利率愈低，借貸的還款成本降低，民眾對資金的需求量增加，因此借貸買房的意願上升，故選(B)。(A)公債利率上升，購買公債意願上升。(C)政府宣布調高利率，借貸意願下降。(D)當年通貨膨脹率極低，還低於銀行利息，則錢存在銀行比較划算，故民眾存款意願上升。
