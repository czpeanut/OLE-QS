- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2020 年 8 月勞動部部長宣布 2021 年基本薪資上調至 24,000 元、調幅約 0.84 ％，時薪則調至 160 元、調幅約 1.3 ％。主要原因在於 COVID-19 疫情肆虐，考量到許多企業受到衝擊，因此，此次調幅為蔡政府上任最低的一次。某立委表示調整幅度之小，讓民眾直呼無感；同時強調，應加速《最低工資法》立法程序，以避免基本工資審議過程淪為雙方喊價，才能落實保障勞工工資權益的目標。請問下列有關基本工資對勞動市場的影響，何者正確？
  options:
  - label: A
    content: 最低工資是一種價格上限的政府管制用以保障弱勢勞工
  - label: B
    content: 政府對勞動市場進行價格管制將有助於減少失業人口
  - label: C
    content: 處境最不利的勞工失業未必能因政府介入而得到保障
  - label: D
    content: 基於契約自由原則應避免政府的介入否則擾亂市場機制
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 最低工資是政府為保障勞工而進行的價格下限管制，但若最低工資與均衡價格差距過大，此時可能導致廠商僱人意願下降，勞工失業反而增加，故選(C)。(A)最低工資是一種價格下限。(B)政府對勞動市場進行價格管制可能導致失業人口增加。(D)政府介入勞動市場是基於契約正義原則而進行的市場管制。
  tags:
