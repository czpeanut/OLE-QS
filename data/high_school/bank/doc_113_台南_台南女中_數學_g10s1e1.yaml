- id: doc_113_台南_台南女中_數學_g10s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設 x＝$\frac{\sqrt{5} -2}{\sqrt{5} +2}$，則下列選項何者正確？
  options:
  - label: A
    content: x＋$x^{－1}$＝18
  - label: B
    content: x－$x^{－1}$＝$8\sqrt{5}$
  - label: C
    content: $x^{2}$＋$x^{－2}$＝324
  - label: D
    content: $x^{3}$－$x^{－3}$＝$2584\sqrt{5}$
  - label: E
    content: $x^{\frac{1}{2}}+x^{-\frac{1}{2}}$＝$2\sqrt{5}$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'x＝$\frac{\sqrt{5} -2}{\sqrt{5} +2}$＝$\frac{(\sqrt{5} -2)\times (\sqrt{5} -2)}{(\sqrt{5} +2)\times (\sqrt{5} -2)}$＝$\frac{(\sqrt{5} -2)^{2}}{5 -4}$＝9－$4\sqrt{5}$

    (A) ○：$x^{－1}$＝$\frac{1}{9-4\sqrt{5}}$＝$\frac{1\times (9+4\sqrt{5} )}{(9-4\sqrt{5} )\times (9+4\sqrt{5} )}$＝$\frac{9+4\sqrt{5}}{81-80}$＝9＋$4\sqrt{5}$

    因此 x＋$x^{－1}$＝（9－$4\sqrt{5}$）＋（9＋$4\sqrt{5}$）＝18

    (B) ╳：由(A)得 $x^{－1}$＝9＋$4\sqrt{5}$

    因此 x－$x^{－1}$＝（9－$4\sqrt{5}$）－（9＋$4\sqrt{5}$）＝－$8\sqrt{5}$

    (C) ╳：由(A)得 x＋$x^{－1}$＝18

    因此（x＋$x^{－1}$）$^{2}$＝$18^{2}$

    ⇒ $x^{2}$＋2．x．$x^{－1}$＋（$x^{－1}$）$^{2}$＝324

    ⇒ $x^{2}$＋2＋$x^{－2}$＝324

    ⇒ $x^{2}$＋$x^{－2}$＝322

    (D) ╳：由(B)、(C)得 x－$x^{－1}$＝－$8\sqrt{5}$，$x^{2}$＋$x^{－2}$＝322

    因此 $x^{3}$－$x^{－3}$＝$x^{3}$－（$x^{－1}$）$^{3}$＝（x－$x^{－1}$）（$x^{2}$＋x．$x^{－1}$＋（$x^{－1}$）$^{2}$）

    ＝（x－$x^{－1}$）（$x^{2}$＋1＋$x^{－2}$）

    ＝（－$8\sqrt{5}$）（322＋1）

    ＝$-2584\sqrt{5}$

    (E) ○：∵$\sqrt{5}$＞2 ∴x＝$\frac{\sqrt{5}-2}{\sqrt{5}+2}$＞0

    又 x＝9－$4\sqrt{5}$＝9－$2\sqrt{20}$

    ∴$x^{\frac{1}{2}}$＝$\sqrt{9-2\sqrt{20}}$＝$\sqrt{(\sqrt{5}-\sqrt{4} )^{2}}$＝$\sqrt{5}$－$\sqrt{4}$

    $x^{-\frac{1}{2}}$＝$\frac{1}{x^{\frac{1}{2}}}$＝$\frac{1}{\sqrt{5}-\sqrt{4}}$＝$\frac{1\times (\sqrt{5}+\sqrt{4} )}{(\sqrt{5}-\sqrt{4} )\times (\sqrt{5}+\sqrt{4} )}$＝$\sqrt{5}$＋$\sqrt{4}$

    因此$x^{\frac{1}{2}}$＋$x^{-\frac{1}{2}}$＝$2\sqrt{5}$

    〈另解〉

    $(x^{\frac{1}{2}}+x^{-\frac{1}{2}})^{2}$＝$(x^{\frac{1}{2}})^{2}$＋2．$x^{\frac{1}{2}}$．$x^{-\frac{1}{2}}$＋$(x^{-\frac{1}{2}})^{2}$＝x＋2＋$x^{－1}$

    由(A)得 x＋$x^{－1}$＝18

    因此$(x^{\frac{1}{2}}+x^{-\frac{1}{2}})^{2}$＝18＋2＝20

    又$\sqrt{5}$＞2 ∴x＝$\frac{\sqrt{5} -2}{\sqrt{5} +2}$＞0，即$x^{\frac{1}{2}}$＞0，$x^{-\frac{1}{2}}$＞0

    因此$x^{\frac{1}{2}}$＋$x^{-\frac{1}{2}}$＝$\sqrt{20}$＝$2\sqrt{5}$

    故選(A)(E)'
