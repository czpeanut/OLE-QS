- id: doc_113_台南_台南女中_數學_g10s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 下列選項何者正確？
  options:
  - label: A
    content: $\sqrt{17}$＋$\sqrt{3}$＜$\sqrt{20}$
  - label: B
    content: 3－$\sqrt{2}$＞$\sqrt{10}$－$\sqrt{3}$
  - label: C
    content: 3＜$\sqrt{12+2\sqrt{5}}$＜4
  - label: D
    content: 4＜log98000＜5
  - label: E
    content: －5＜log0.00089＜－4
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：（$\sqrt{17}$＋$\sqrt{3}$）$^{2}$＝20＋$2\sqrt{51}$＞20

    又$\sqrt{17}$＋$\sqrt{3}$＞0，20＞0 ∴$\sqrt{17}$＋$\sqrt{3}$＞$\sqrt{20}$

    (B) ○：$\frac{1}{3-\sqrt{2}}$＝$\frac{1\times (3+\sqrt{2})}{(3-\sqrt{2} )\times (3+\sqrt{2} )}$＝$\frac{3+\sqrt{2}}{7}$

    $\frac{1}{\sqrt{10}-\sqrt{3}}$＝$\frac{1\times (\sqrt{10}+\sqrt{3} )}{(\sqrt{10}-\sqrt{3} )\times (\sqrt{10}+\sqrt{3} )}$＝$\frac{\sqrt{10}+\sqrt{3}}{7}$

    ∵$\sqrt{10}$＞3，$\sqrt{3}$＞$\sqrt{2}$

    ∴$\frac{\sqrt{10}+\sqrt{3}}{7}$＞$\frac{3+\sqrt{2}}{7}$，即$\frac{1}{\sqrt{10}-\sqrt{3}}$＞$\frac{1}{3-\sqrt{2}}$

    又$\sqrt{10}$－$\sqrt{3}$＞0，3－$\sqrt{2}$＞0

    ∴$\sqrt{10}$－$\sqrt{3}$＜3－$\sqrt{2}$

    (C) ╳：∵$\sqrt{5}$＞$\sqrt{4}$＝2 ∴$2\sqrt{5}$＞4

    ⇒ 12＋$2\sqrt{5}$＞12＋4＝16

    又 12＋$2\sqrt{5}$＞0 ∴$\sqrt{12+2\sqrt{5}}$＞$\sqrt{16}$＝4

    (D) ○：98000＝9.8×$10^{4}$

    ⇒ $10^{4}$＜98000＜$10^{5}$

    ⇒ 4＜log98000＜5

    (E) ╳：0.00089＝8.9×$10^{－4}$

    ⇒ $10^{－4}$＜0.00089＜$10^{－3}$

    ⇒－4＜log0.00089＜－3

    故選(B)(D)'
