- id: doc_113_台南_台南女中_數學_g10s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 下列選項何者正確？
  options:
  - label: A
    content: $0. \overline{25}$＋$0. \overline{2}$＝$0. \overline{45}$
  - label: B
    content: $(4+3\sqrt{2} )^{-2}(4-3\sqrt{2} )^{-2}$＝$-\frac{1}{4}$
  - label: C
    content: 若 a＞b＞$\sqrt{2}$，則 a＋b＞$2\sqrt{ab}$
  - label: D
    content: 若 c＋d、c－d 均為有理數，則 d 必為有理數
  - label: E
    content: 若 e、f 皆不為 0，且 e＞f，則 $e^{2}$＞$f^{2}$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$0. \overline{25}$＋$0. \overline{2}$＝0.2525 ……＋0.2222 ……

    ＝0.4747 ……＝$0. \overline{47}$

    (B) ╳：（4＋$3\sqrt{2}$）$^{－2}$（4－$3\sqrt{2}$）$^{－2}$＝［（4＋$3\sqrt{2}$）（4－$3\sqrt{2}$）］$^{－2}$

    ＝（16－18）$^{－2}$＝（－2）$^{－2}$＝$\frac{1}{(-2)^{2}}$＝$\frac{1}{4}$

    (C) ○：∵a＞b＞$\sqrt{2}$＞0

    ∴由算幾不等式得$\frac{a+b}{2}$≥$\sqrt{ab}$⇒ a＋b ≥ 2$\sqrt{ab}$ ……………（＊）

    等號成立的條件為 a＝b

    但 a＞b ∴（＊）之等號不成立

    即 a＋b＞2$\sqrt{ab}$

    (D) ○：∵c＋d、c－d 均為有理數

    ∴（c＋d）－（c－d）＝2d 為有理數

    ⇒ d＝$\frac{2d}{2}$為有理數

    (E) ╳：反例：設 e＝－1，f＝－2

    則 $e^{2}$＝1，$f^{2}$＝4

    此時 $e^{2}$＜$f^{2}$

    故選(C)(D)'
