- id: doc_111_桃園_武陵_數學_數甲_g12s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設Γ＝｛z｜z ∈ C 且｜z－2i｜＝1｝，下列哪些點會落在圖形 Ω＝｛w｜w＝－iz，z ∈Γ｝上？
  options:
  - label: A
    content: '3'
  - label: B
    content: －2i
  - label: C
    content: 2＋i
  - label: D
    content: 1－i
  - label: E
    content: －2－i
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵3＝－i×z

    ∴$z =\frac{3}{-i}\times \frac{i}{i}= 3i$

    代入｜z－2i｜＝｜3i－2i｜＝1

    (B)╳：∵－2i＝－i×z

    ∴z＝2

    代入｜z－2i｜＝｜2－2i｜＝$\sqrt{2^{2}+(- 2)^{2}}$≠1

    (C)○：∵2＋i＝－i×z

    ∴$z=\frac{2 +i}{-i}\times \frac{i}{i}=-1 + 2i$

    代入｜z－2i｜＝｜（－1＋2i）－2i｜＝｜－1｜＝1

    (D)╳：∵1－i＝－i×z

    ∴$z=\frac{1 -i}{-i}\times \frac{i}{i}= 1 +i$

    代入｜z－2i｜＝｜（1＋i）－2i｜＝｜1－i｜＝$\sqrt{1^{2}+(- 1)^{2}}$≠1

    (E)╳：∵－2－i＝－i×z

    ∴$z=\frac{- 2 -i}{-i}\times \frac{i}{i}= 1 - 2i$

    代入｜z－2i｜＝｜（1－2i）－2i｜＝｜1－4i｜＝$\sqrt{1^{2}+(- 4)^{2}}$≠1

    故選(A)(C)'
