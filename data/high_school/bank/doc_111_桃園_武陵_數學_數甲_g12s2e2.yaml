- id: doc_111_桃園_武陵_數學_數甲_g12s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 甲在袋中放入 3 顆黑球與 1 顆白球，每次取一球再放回袋子，重複進行取球後放回袋子的動作，直到取出白球為止。乙也在同一袋子中，每次取一球後再放回，重複進行取球後放回袋子的動作 100 次，假設每顆球被取出的機會均相等。設隨機變數 X 表示甲取到白球時的總取球次數，而隨機變數 Y 表示乙重複進行取球後放回的動作 100 次後，取出白球的總次數。則下列選項何者正確？
  options:
  - label: A
    content: E（X）＝2
  - label: B
    content: E（Y）＝25
  - label: C
    content: Var（X）＝16
  - label: D
    content: Var（Y）＝$\frac{75}{4}$
  - label: E
    content: E（$X^{2}$）＝28
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意知

    $X～G \left( \frac{1}{4} \right)$，$Y～B \left( 100 , \frac{1}{4} \right)$

    (A)╳：E（X）＝$\frac{1}{p}$＝$\frac{1}{\frac{1}{4}}$＝4（次）

    (B)○：Ｅ（Y）＝np＝$100\times \frac{1}{4}$＝25（次）

    (C)╳：Var（X）＝$\frac{1 -p}{p^{2}}$＝$\frac{1 -\frac{1}{4}}{\frac{1}{16}}$＝12

    (D)○：Var（Y）＝np（1－p）＝$100\times \frac{1}{4}\times \left( 1 -\frac{1}{4} \right)$＝$\frac{75}{4}$

    (E)○：Var（X）＝E（$X^{2}$）－（E（X））$^{2}$

    $\Rightarrow$12＝E（$X^{2}$）－$4^{2}$

    $\Rightarrow$E（$X^{2}$）＝12＋16＝28

    故選(B)(D)(E)'
