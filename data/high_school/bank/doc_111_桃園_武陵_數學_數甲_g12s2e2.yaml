  type: fill
  page: 2
  stem: '$Z =\left( \frac{\sqrt{3} +i}{2} \right) ^{7}+i$，則：

    (1)（｜Z｜，Arg（Z））＝＿＿＿＿。

    (2) n ∈ Z，－20$\leq$n$\leq$100，可使 $Z^{n}$ 為純虛數之所有整數 n 有＿＿＿＿個。'
  answer:
  - (1)（1，150°）；(2) 20
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ∵Z＝$\left( \frac{\sqrt{3}}{2}+\frac{1}{2}i \right) ^{7}+i$＝（cos30°＋i sin30°）$^{7}$＋i

    ＝cos210°＋i sin210°＋i＝$-\frac{\sqrt{3}}{2}+i\times \left( -\frac{1}{2} \right) +i$

    ＝$-\frac{\sqrt{3}}{2}+\frac{1}{2}i$＝cos150°＋i sin150°

    ∴（｜Z｜，Arg（Z））＝（1，150°）

    (2) $Z^{n}$＝（cos150°＋i sin150°）$^{n}$＝cos（150°×n）＋i sin（150°×n）為純虛數

    ∴cos（150°×n）＝0

    $\Rightarrow$150°×n＝180°×k＋90°，k ∈ Z，又－20$\leq$n$\leq$100，n ∈ Z

    $\Rightarrown =\frac{6}{5}k+\frac{3}{5}$，令 k＝5t＋2

    ∴$n =\frac{6}{5}(5t + 2)+\frac{3}{5}= 6t + 3$，t ∈ Z，即－20$\leq$6t＋3$\leq$100

    $\Rightarrow$t＝－3，－2，－1，0，1，2，……，15，16，共 20 個

    ∴k 有 20 個，故 n 有 20 個'
