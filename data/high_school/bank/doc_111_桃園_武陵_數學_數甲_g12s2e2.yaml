  stem: '有一個圓形的荷花池塘，兩隻青蛙在池塘圓周上作規律性的跳動。今建立一複數平面，如右圖，觀察兩隻青蛙的跳動情形。假設兩隻青蛙開始跳動的位置定為 A(1)，而且甲青蛙沿著圓周依逆時針方向跳動，第 m 次跳到複數$\left( \cos \frac{\pi}{12}+i\sin \frac{\pi}{12} \right) ^{m}$所代表的點；同時乙青蛙沿著圓周依順時針方向跳動，第 n 次跳到複數$\left( \cos \frac{\pi}{6}-i\sin \frac{\pi}{6} \right) ^{n}$所代表的點，其中 m，n 皆為正整數。

