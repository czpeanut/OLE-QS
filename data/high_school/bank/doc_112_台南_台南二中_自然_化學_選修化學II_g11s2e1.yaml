  stem: 下列何項為放熱過程？
  options:
  - label: A
    content: Li原子電子由4s→3d
  - label: B
    content: N：1s²$2s^{2}2p_{x}$²$2p_{y}^{1}$→1s²$2s^{2}2p_{x}^{1}2p_{y}^{1}2p_{z}^{1}$
  - label: C
    content: Cr：[Ar] $3d^{5}4s^{1}$→[Ar] $3d^{4}4s^{2}$
  - label: D
    content: H原子電子由3d→4s
  - label: E
    content: Fe²$^{+}$：[Ar] $3d^{6}$→[Ar] $3d^{4}$4s²
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)多電子系統，3d軌域能量較4s軌域能量大，4s→3d為吸熱反應；(B)洪德定則，電子填入相同能量之軌域時須分別、同向填入，起始狀態比最終狀態的能量高，為放熱反應；(C) Cr的基態組態為[Ar]$3d^{5}4s^{1}$，[Ar]$3d^{5}4s^{1}$→[Ar]$3d^{4}4s^{2}$為吸熱反應；(D)單電子系統的軌域能量僅由n值決定，n值越大能量越高，3d→4s為吸熱反應；(E) Fe的基態電子組態為[Ar]$3d^{6}4s^{2}$，形成陽離子時，4s軌域的電子會優先被移除，故$Fe^{2＋}$的基態電子組態為[Ar]$3d^{6}$，[Ar]$3d^{6}$→[Ar]$3d^{4}4s^{2}$為吸熱反應。故選(B)。
