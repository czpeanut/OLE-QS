    content: 鈦
  - label: B
    content: 碳
  - label: C
    content: 硼
  - label: D
    content: 釩
  - label: E
    content: 鎳
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 氮的基態電子組態為$1s^{2}2s^{2}2p^{3}$，其中p軌域中三個電子各自填入不同的p軌域，故未配對電子共有3個。(A) [Ar]$3d^{2}4s^{2}$，2個未配對電子；(B) $1s^{2}2s^{2}2p^{2}$，2個未配對電子；(C) $1s^{2}2s^{2}2p^{1}$，1個未配對電子；(D) [Ar]$3d^{3}4s^{2}$，3個未配對電子；(E) [Ar]$3d^{8}4s^{2}$，2個未配對電子。故選(D)。
