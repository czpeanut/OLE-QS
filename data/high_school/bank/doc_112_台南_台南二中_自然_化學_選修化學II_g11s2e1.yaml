  stem: 附圖為氫原子光譜中的可見光區及紫外光區，試回答下列各題：（已知電磁波能量ΔE ＝1312$( \frac{1}{n_{L}^{2}}-\frac{1}{n_{H}^{2}} )$（kJ/mol）， h＝6.626×$10^{－34}$ J·s） (1)巴耳末系為何區（I或II）？ (2)譜線d的頻率為多少？ (3)譜線f與譜線d的能量差，恰與哪一區的哪一條譜線的能量相同？ (4)譜線e、譜線d和譜線a之波長，分別為$\lambda _{1} 、 \lambda _{2} 、 \lambda _{3}$，試推出這三條譜線波長之數學關係式為何？
