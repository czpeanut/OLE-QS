  explanation: (1) 來曼系列第一條（2→1）、第二條（3→1）譜線的差距是3→2的這段；巴耳末系列第一條（3→2）、第二條（4→2）譜線的差距是4→3的這段，故相差較大的那一個區域(II)為來曼系列。 (2) 由(1)小題可得知譜線越右邊代表能量越高，則d譜線為來曼系列能量最低的譜線，即n＝2→n＝1的譜線，其能量數值為1312（$\frac{1}{1^{2}}$－$\frac{1}{2^{2}}$）＝984 kJ／mol＝1.64×$10^{－18}$ J。再由E＝hv，可得到頻率＝2.47×$10^{15}$ hz。 (3) d譜線為n＝2→n＝1的譜線，f則為n＝4→n＝1的譜線，兩者之差即為n＝4→n＝2，為b。 (4) ① e譜線為n＝3→n＝1的譜線，② d譜線為n＝2→n＝1的譜線，③ a譜線為n＝3→n＝2的譜線。由能量守恆可得知$E_{1}$＝$E_{2}$＋$E_{3}$，又E＝ $\frac{hc}{\lambda}$，其中h、c皆常數，故可得$\frac{1}{\lambda _{1}}$＝$\frac{1}{\lambda _{2}}$＋$\frac{1}{\lambda _{3}}$。
