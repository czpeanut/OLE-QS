  stem: 從啟蒙運動時期開始倡導天賦人權後，「人權」開始逐漸受到重視，人權的形式、內容與重要性歷經幾個世紀以來的發展，人權在今日社會已是普世價值，許多國家都在相關法律中明文保障。以下關於人權的敘述何者正確？
  options:
  - label: A
    content: 人權的實踐要考慮文化差異，有些國家的女性沒有投票權，還是文化差異，和人權無關
  - label: B
    content: 學校規定不可以體罰，但法律賦予父母懲戒權，父母打小孩都是為了他們好，故沒有侵犯人權的疑慮
  - label: C
    content: 人權和公民權的範圍不同，來臺的外籍觀光客沒有公民權，但我國法律仍然保障其人權
