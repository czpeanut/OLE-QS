  group_stem: ◎ 政府為使人民均能有所居，除了建設國民住宅，近年也開始進行「青銀共居」方案。政府整合民間閒置居住空間，嘗試透過跨世代的居住共享方案，為高齡者、青年找出可能的新生活選項。新北市政府於2017年與民間共生公寓合作，進行了全臺第一場青銀共居的實驗，並於2018年3月由10位申請者開始正式共居生活。臺北市政府亦與民間長照中心受託經營之老人公寓及大學合作，學生只要定時陪伴長者，不論是打麻將、下棋，還是教他們網購、用臉書等等，每月服務滿20個小時，就可以用月租3千元入住老人公寓。 在高齡化、少子化與高房價的時代，高齡者獨居以及青年蝸居的現象屢見不鮮。青銀共居提供給長輩與青年另一種居住生活型態。在長照措施尚未足夠密集的現代，青年可就近陪伴長輩，教長輩們使用現代科技、網路應用；長輩們也能把豐富寶貴的人生閱歷，透過自然互動傳承給共居的青年，彼此在生活中共同成長，如大家庭般互助相伴。有論者認為，青銀共居可以使青年與老年人彼此更加了解，有助從世代對立到世代融合。
  tags:
    unit:
      code: CI-1-6-1
