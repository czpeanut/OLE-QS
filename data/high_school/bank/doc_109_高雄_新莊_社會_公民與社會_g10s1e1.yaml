  stem: '住在東京都內的野見山女士今年69歲，她40多歲的時候跟丈夫離婚，那時父母親都還有充裕的收入可以照顧自己，而野見山女士的經濟狀況也算穩定：但六年前父親過世之後，母親開始出現失智的狀況，生活完全無法自理，她一個人又無法抱起母親作身體清潔，必須把母親送到安養院。 安養院最低費用為每個月14萬5千日圓（約新臺幣40,867元），而母親的基礎年金每月只有4萬5千日圓（約新臺幣12,682元），野見山女士的基礎年金與厚生年金每月則有11萬日圓（約新臺幣31,002元）；繳給安養院之後每月只剩下1萬日圓（約新臺幣2,818元），自己的退休金和存款陸續在父母親與自己的醫療費用逐漸耗盡，現在她只能靠著在車站做清潔工來維生，每週工作五到六天，時薪為950日圓（約新臺幣267元），換算月薪約十萬（約新臺幣28,184元）。2015年日本受僱者的平均月薪為34萬6千日圓（約新臺幣97,517元）。 因為房子是自己的，生活還過得去，但也因此無法申請到社會救助。「離婚之後跟著爸媽在一起度過了最後的歡樂時光，照顧他們是應盡的義務，也沒有想這麼多，只是還能做到幾歲，未來誰能夠照顧自己？她不敢想這些。」 日本的年金分成了三層： 第一層為基礎年金，法律規定20歲以上，60歲以下所有國民都有義務加入，保費由國庫補貼一半，被保險人每月應自繳1萬5千日圓（約新臺幣4,227元）。若完整繳納，則被保險人65歲之後可月領5萬5千日圓（約新臺幣15,501元）。 第二層為厚生年金，指的是政府強制規範企業必須要為其員工設立的年金，保費由企業主與員工各分攤一半：若雇主為政府，則稱之為共濟年金。 第三層則為年資加給，年金的請領人若有65歲以下的配偶或18歲以下之子女，可以領取加給年金。另外還附加不具有強制性質的介護保險，向45歲以上的國民提供不同的保費選項以滿足老年看護的需求。 即便有這樣的社會安全網，面對即將到來的超高齡社會，日本仍無可避免「一億人的下流化」，《下流老人》一書的作者藤田孝典如是說。他很憂心大家在看了他的書之後只是在想著自己，例如：退休該存多少錢？該買怎麼樣的保險商品？退休之後怎樣才能繼續有收入？ 他嚴正指出，靠著自己力量來找出不下流化只是一種自我防衛心理，並不能消除高齡者的貧困。他進一步在《續‧下流老人》書中舉出各種中產階級與中上階級的案例來說明：所有人在老年面對衰退與長期疾病時都是不堪一擊的。當保險業者將《下流老人》的例子當成案例推銷安心的保險，卻使政府與人民無視於全球化所造成的貧富差距日漸擴大與貧困的結構性問題，這其實是日本社會的真正貧困。

    (1)從文章對於野見山女士所面對處境的描述，下列何項敘述是文章中所無法推導出來的結論？'
