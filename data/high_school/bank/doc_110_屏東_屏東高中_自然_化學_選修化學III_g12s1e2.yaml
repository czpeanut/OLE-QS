  page: 1
  stem: '氫氧化鋁在不同pH值水溶液中的溶解度列於附表，根據附表資料，請回答下列問題。

    | pH值 | 溶解度（mol／L） |

    | --- | --- |

    | 4.0 | 2.0×$10^{－2}$ |

    | 5.0 | 2.0×$10^{－5}$ |

    | 6.0 | 4.2×$10^{－7}$ |

    | 7.0 | 4.2×$10^{－6}$ |

    | 8.0 | 4.0×$10^{－5}$ |

    | 9.0 | 4.0×$10^{－4}$ |

    | 10.0 | 4.0×$10^{－3}$ |

    | 11.0 | 4.0×$10^{－2}$ |

    | 12.0 | 4.0×$10^{－1}$ |

    下列有關氫氧化鋁溶解度的敘述，哪些正確？'
  options:
  - label: A
    content: 水溶液的pH值為6.0時，氫氧化鋁溶解度最大
  - label: B
    content: 酸性的水溶液中，若[$H^{＋}$]愈大，則氫氧化鋁溶解度愈小
  - label: C
    content: 鹼性的水溶液中，若[$OH^{－}$]愈大，則氫氧化鋁溶解度愈小
  - label: D
    content: 在1升0.0001 M的鹽酸比在1升純水中的溶解度大
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 12時最大；(B)酸性溶液中，溶液越酸，溶解度越大；(C)鹼性溶液中，溶液越鹼，溶解度越大；(D) 0.0001 M鹽酸即pH＝4的酸性溶液，溶解度確實比pH＝7的純水較大。故選(D)。
