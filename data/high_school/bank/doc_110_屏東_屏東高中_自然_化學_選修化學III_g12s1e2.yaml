- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 下列哪一組溶液組成<u>不具有</u>緩衝溶液的性質？
  options:
  - label: A
    content: 0.1 M、50.0 mL的$CH_{3}$COOH＋0.1 M、50.0 mL的$CH_{3}$COONa
  - label: B
    content: 0.2 M、50.0 mL的$CH_{3}$COOH＋0.1 M、20.0 mL的NaOH
  - label: C
    content: 0.2 M、50.0 mL的$CH_{3}$COONa＋0.1 M、100.0 mL的HCl
  - label: D
    content: 0.5 M、10.0 mL的$NH_{3}$＋0.5 M、10.0 mL的$NH_{4}$Cl
  - label: E
    content: 0.5 M、30.0 mL的$NH_{4}$Cl＋0.4 M、20.0 mL的NaOH
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 緩衝溶液的組成：莫耳數接近的弱酸+弱酸鹽 or 弱鹼+弱鹼鹽。(A)(D)符合；(B)氫氧化鈉莫耳數(0.1×0.02)＜醋酸莫耳數(0.2×0.05)，故醋酸將部分被中和成醋酸鈉，醋酸與醋酸鈉共存，故有緩衝效果；(C)醋酸鈉莫耳數(0.2×0.05)＝鹽酸莫耳數(0.1×0.1)，故會完全中和，溶液中幾乎不存在醋酸根，無緩衝效果；(E)氫氧化鈉莫耳數(0.4×0.02)＜銨根莫耳數(0.5×0.03)，故銨根將部分被中和成氨，氨與銨根共存，故有緩衝效果。故選(C)。
