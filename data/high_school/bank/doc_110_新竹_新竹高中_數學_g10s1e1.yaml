  stem: 若a，b為整數，c為正整數且不是完全平方數，在算式皆為合法情形下，試問下列敘述之中，哪些是正確的？
  options:
  - label: A
    content: a＋b$\sqrt{c}$＝0，則a＝b＝0
  - label: B
    content: b$\sqrt{c}$必為無理數
  - label: C
    content: a＋$\sqrt{c}$必為無理數
  - label: D
    content: $\frac{\sqrt{c}}{a}$必為無理數
  - label: E
    content: $\sqrt{\frac{b}{c}}$必為無理數
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ( 正確 )。 (B) 舉反例， b＝0，c＝3， 0$\sqrt{3}$＝0 ∈ Q ( 錯誤 )。 (C) a＋$\sqrt{c}$必為無理數 ( 正確 )， a為有無理數，$\sqrt{c}$為無理數， ⇒ a＋$\sqrt{c}$為無理數。 (D) $\frac{\sqrt{c}}{a}$為無理數，同(C) ( 正確 )。 (E) 舉反例， b＝12，c＝3， ⇒ $\sqrt{\frac{12}{3}}$＝$\sqrt{4}$＝2 ∈ Q ( 錯誤 )。 故選(A)(C)(D)。
