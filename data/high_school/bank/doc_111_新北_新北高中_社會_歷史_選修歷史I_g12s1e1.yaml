  section: 1
  number: 50
  type: single
  page: 7
  stem: 劇名「綠皮書」(Green Book)，是在吉姆‧克勞法(Jim Crow Laws）時代，紐約市一名郵遞員維克多‧雨果‧格林(Victor Hugo Green）於1936年至1966年間，專為黑人或有色人種編寫出版的旅遊指南，裡面詳列各州黑人可以下榻的旅館、餐廳、搭乘的交通工具等等，這本書對於當時已經具有經濟能力、可以購買汽車的黑人中產階級而言，簡直就是旅遊的葵花寶典，否則就會有許多危險。電影中可以看到黑人“唐薛利”即使身為紐約知名的藝術家，卻仍處處遭遇不公平待遇，連義裔白人“東尼”都感到憤怒。包括，唐身為受邀的貴賓，只因為是有色人種，就不能和白人一起在餐廳用餐、不能試穿西裝、甚至上廁所，必須開半小時車回旅館自行解決。種種以現在眼光來看，匪夷所思的限制對當時的黑人菁英而言，該是多麼痛苦的事。在真實生活中，知名演藝經紀人索爾‧胡洛克(Sol Hurok）就曾勸阻唐薛利追求成為古典音樂演奏家，原因是「這個國家還沒有預備好接受一黑人的古典鋼琴大師」。難怪，有一次唐氣到吶喊:「如果我不夠黑，也不夠白，又不夠像男人，那麼你告訴我，我到底是誰？我只不過是個被桎梏於城堡中的孤魂。」這本旅遊指南出現，其可能的意涵為何？
  options:
  - label: A
    content: 非裔美國人很受到美國重視，還特地出書指引他們
  - label: B
    content: 在當時有色人種受到歧視的年代，這本書的作者很可能是具有知識涵養的白人
  - label: C
    content: 非裔美國人出遊很容易受到友善對待
  - label: D
    content: 黑人之所以更願意購買汽車，是為了避免大眾運輸當中的種種歧視
