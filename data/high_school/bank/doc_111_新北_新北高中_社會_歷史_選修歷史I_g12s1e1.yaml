  section: 1
  number: 10
  type: single
  page: 2
  stem: 在美國獨立戰爭後的三十多年間，原住民部落的大片土地被侵占奪取，政府不僅沒有站在原住民部落的角度保護他們，反而用武力侵略和欺騙手段強迫遷移，如切羅基部族。他們聽信白人的承諾，簽下條約離開他們傳統狩獵地，想過上定居安定生活，但因日後新的居住區發現金礦，再次被驅趕。根據題幹所述，判斷下列何者是站在原住民立場書寫的論述？
