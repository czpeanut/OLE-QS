  stem: 愛爾蘭土地肥沃，盛產大麥、小麥等穀類。十三世紀以後，愛爾蘭即受英國統治，長期成為穀物供應者。十七世紀以後，愛爾蘭人民以馬鈴薯為主食。1845至1852年間，愛爾蘭馬鈴薯歉收，發生嚴重饑荒，約有20%以上的人口死亡或移民。研究指出，晚疫病應是造成馬鈴薯歉收的主因，其主要傳播途徑來自空氣或人畜攜帶，尤其在持續低溫、高溼的環境最容易傳播，而多雨加上強風更助長其快速蔓延，極短時間即可造成馬鈴薯廢耕。學者分析，在饑荒時期，愛爾蘭歉收的作物只有馬鈴薯，然輸出至英國的穀物，據推算足以養活當時愛爾蘭的兩倍人口，因而認為饑荒實為人禍。饑荒之後，愛爾蘭展開大規模佃農運動，組織聯盟，爭取權求，提出幾項訴求，包括：土地買賣自由、保障佃租契約與合理地租。請問：依上文推論，除馬鈴薯歉收外，最可能造成愛爾蘭饑荒的主要原因是
