  stem: 十七世紀的北美大陸因其豐富的毛皮資源，吸引了自法國、英國及荷蘭的移民及商人，紛紛與當地的原住民部落進行毛皮生意。隨著歐洲人的大量需求，北美洲易洛魁人所在的哈德遜河谷的河狸被大量捕殺，在1640年的時候易洛魁人能捕獲獵物大大減少，為了捕獲更多的河狸，易洛魁人把目光瞄向了休倫人的領地，與他們合作的英國盟友自然是百般支持，還願意提供他們新型武器。而與休倫人合作的法國人，雖在武器供應上猶豫不決，然而在幾次對抗失利下，亦派部隊協助他們與易洛魁部落的戰事。請根據上述資料，判斷下列論述何者正確？
