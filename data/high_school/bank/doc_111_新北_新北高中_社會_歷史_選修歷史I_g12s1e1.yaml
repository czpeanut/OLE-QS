  stem: 美洲原住民的祖先，推測約在5萬年前，因自然災害、戰爭，或追捕野牛、大角鹿、馴鹿、長毛象等大型動物等緣故，通過○○陸橋（今之○○海峽）從西伯利亞進入阿拉斯加，後代子孫再逐漸向南散布，足跡遍布整個美洲大陸，也逐漸發展出眾多不同語言和文化的族群，各族群因區域生態環境的差異，形成多元的生活型態。而類似狀況，在臺灣的△△，在△△附近的海域撈出古菱齒象、熊、野馬、四不像鹿、水牛等十多種哺乳動物的化石。在數千件標本中，研究人員找到了1件人類古肱骨化石、1件骨器和1件帶有人工刻痕的動物下顎骨。其種類有：似浣貉、棕熊、最後鬣狗、虎、諾氏古菱齒象△△種、大連馬、普氏野馬中國亞種、野豬、北京斑鹿、達氏四不像鹿、德氏水牛等。其中以古菱齒象、德氏水牛和四不像鹿的數量最多，研究者花費了3年的時間對前兩類動物化石進行了復原、拼補和裝架，並依據其動物群組合特徵命名為「△△海溝動物群」，最近研究員改稱「臺灣陸橋動物群」。除了哺乳動物化石外，在這批化石材料中，還有少量人類肢骨和具有明顯人工砍痕的四不像鹿鹿角，暗示當時的臺灣陸橋可能有人類活動。請問○○、△△正確為何？
