  stem: '資料一：十八世紀時紐西蘭還鮮有定居的歐洲人，絕大部分人只把紐西蘭當成臨時的落腳點，但隨著歐洲人發現在紐西蘭可以獲取更多經濟價值，前來移民定居的人增加，雙方衝突增加，但大多數還是小摩擦，然而歐洲人帶來了槍砲軍火及傳染疾病，致使毛利人社會出現了極大轉變。

