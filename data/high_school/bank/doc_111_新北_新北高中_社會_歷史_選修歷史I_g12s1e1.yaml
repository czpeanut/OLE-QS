  stem: '資料一：1835年在一片腥風血雨中宣告結束。那一年的11月19日，500個毛利人帶著槍支、棍棒和斧頭，乘坐一艘船來到了。接著在12月5日，又有一股船運來了400個毛利人。一群群毛利人走過莫裡奧裡人的一個個定居點，宣布說莫裡奧裡人現在是他們的奴隸，並殺死那些表示反對的人。當時，如果莫裡奧裡人進行有組織的抵抗，是仍然可以打敗毛利人的，因為毛利人在人數上以一比二處於劣勢。然而，莫裡奧裡人具有一種和平解決爭端的傳統。他們在議事會上決定不進行反擊，而是提出和平、友好和分享資源的建議。莫裡奧裡人還沒有來得及發出那個建議，毛利人已開始了全面進攻並且占領全部土地。

    資料二：毛利人在十九世紀以來，取得了幾次驚人的暫時勝利，但他們不能在戰場上保持一支常備軍，所以到頭來還是被18000人的英國專職軍隊拖垮了。糧食儲備還可以養活為征服戰爭提供宗教理由的神職人員，養活像製造刀劍、槍炮和發展其他技術的金屬加工工人之類的手藝人，以及養活能夠保存信息的抄寫員，因為他們所記錄的信息比人們能夠準確記住的信息要多得多。

    請問以上兩段資料運用在小論文的寫作上，正確的標題應該是？'
  options:
  - label: A
    content: 弱肉強食、優勝劣敗
  - label: B
