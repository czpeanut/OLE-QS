  stem: '資料一：1980年代以後，因為本土意識抬頭、民主運動蓬勃發展，多元文化的價值觀逐漸成為臺灣的主流思想。社會漸趨多元的結果，民族上，原住民族宣稱他們並非炎黃子孫，撼動漢族中心主義；在文化上，則降低了中華文化的優越地位，強調西方的自由、平等、法治、人權等價值亦為臺灣文化的重要成分，並且原住民族、客家人、福佬人、外省眷村的文化也受到重視。再者，各種公共場合不再獨尊北京話，也開始可以使用各種母語。在此情形下，以「臺灣意識」為視角書寫的歷史，也如雨後春筍般出現。

    資料二：1990年代，紐西蘭政府更從立法上保障毛利人參與博物館的權利，規劃了以毛利人文化與歷史為中心的常設展，展館中的說明板和文物標籤皆以英語和毛利語兩種語言標示，1992年紐西蘭國家博物館也在名稱中附加毛利語“Te Papa TongarewaÝ”（意指「我們的地方」）。這些改變顯示對新世代的「紐西蘭人」而言，毛利文化是紐西蘭歷史的一部分，成為紐西蘭人看待自身過去的方式。

    說明兩段資料最佳註解為'
  options:
  - label: A
    content: 一切歷史都是當代史
  - label: B
    content: 一切歷史都是經濟史
  - label: C
    content: 一切歷史都是政治史
  - label: D
    content: 一切歷史都是“他”歷史
