  stem: 毛利人把世代以來部落所累積的價值觀、生態觀與宇宙觀，合稱為毛利○○體系，也是毛利人理解世界的方式，包括毛利神話、文化、穿著都包含在此○○體系之下。例如，毛利人的神話故事中，半人半神的毛伊乘坐獨木舟釣魚，釣起的魚成為紐西蘭北島，毛伊乘坐的獨木舟則成為南島。毛伊傳說與毛利人祖先乘坐獨木舟(waka)來到紐西蘭的經歷相近，獨木舟更成為毛利社會組織的單位之一。在臺灣的原住民各族也有「○○體系」的概念，以鄒族(Tsou)為例，鄒族人時常以周遭的植物解決生活所需，植物不僅是鄒族人的物質資源，更象徵人與神之間的連結。在鄒族人的神話傳說中，認為天神哈漠(Hamo)降臨玉山，然後搖落楓樹創造了鄒族人；受族人敬重的神妮芙努(Nivnu)在河裡洗頭，使得水中漂著許多金草蘭(fiteu)。又如戰神在天界的寓所到處長著金草蘭，因而部落會所的屋頂必須栽植金草蘭作為標誌，參與部落祭典的勇士也要金草蘭作為頭飾，使戰神認得鄒族的部落及子民。從這些神話傳說可知植物是鄒族人的文化符號之一。請問○○、此段主題各為何者？
  options:
  - label: A
    content: 戰爭，毛利與鄒族的另類接觸
  - label: B
    content: 美感，毛利與鄒族的服裝設計
  - label: C
    content: 知識，毛利與鄒族的知識體系
  - label: D
    content: 階級，毛利與鄒族的社會意識
