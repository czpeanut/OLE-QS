  stem: 十六世紀時歐洲人「發現」美洲大陸後，因建立大規模農園而需要大量勞工，致使到了十七、十八世紀時，非洲西岸沿海的奴隸販賣終於成為跨大西洋貿易的主要項目。據學者統計，這對此區沿海及內地族群的政經及社會結構，產生深遠的影響。例如位於西非的貝寧灣港市的奴隸被販售給歐洲人，歐洲人並沒有直接深入內地去捕捉或買奴，大部分的奴隸都是非洲內地戰爭下的俘虜或遭襲擊，再被帶到海岸賣給歐洲商人。關於大西洋的三角貿易網路的論述，下列何者正確？
