  stem: 資料一：科舉制度對平民開放，但要能參加並通過考試，需要其他條件的協助，大抵而言，這些條件在北宋後才趨於成熟。資料二：唐朝的均田制度是在土地國有的原則下，經由國家的分配讓農民擁有適量的田地，並且能讓民眾自給自足，享有安定的生活。然而均田制的優點是犧牲了一般人民遷徙、擇業自由換來的。請問：上述兩則資料的關聯性為何？
