  stem: 隋文帝楊堅開皇十年（590年）下詔：「凡是軍人可悉屬州縣，墾田籍帳，一與民同」，成為「兵農合一」的制度，平時府兵耕地種田，並在折衝將軍領導下進行日常訓練，出征時要自備兵器和糧餉。但是到了唐高宗、武則天當政時，府兵日漸腐化，逃兵日多，到玄宗時改為募兵。請問：什麼因素導致府兵制的崩壞？
