  section: 1
  number: 33
  type: single
  page: 4
  stem: 七世紀中葉，日本孝德天皇仿傚中國唐朝體制推動改革，是為「大化革新」，其具體做法如下，關於此一改革的解讀，下列何者有誤？ (1)廢止皇室、豪族之私有土地及人民，改為公有土地及公民。 (2)設立統一系統之行政制度，劃定全國行政區。 (3)設戶籍、班田收授法。 (4)頒布租、庸、調等稅制法。
  options:
  - label: A
    content: 改革的動機之一，是為解決土地兼併問題
  - label: B
    content: 這波改革運動不僅止於政治制度的變革，同時也擴及文化層面
  - label: C
    content: 並非全然複製中國的制度，而是針對日本自身之社會現況進行微調後施行
  - label: D
    content: 改革成效不彰，最終導致天皇地位嚴重衰落，八世紀起即進入武家政治的局面
