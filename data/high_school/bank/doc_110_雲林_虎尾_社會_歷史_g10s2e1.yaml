questions:
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 東亞地區的某一國家在十九世紀進入西方建構的條約體系時代之後，積極推動變法改革，力求富國強兵。相較於同時期已漸失自主性的其他東亞國家，這個國家卻能逐漸躋身於世界強國之列。關於上文，下列敘述何者正確？
  options:
  - label: A
    content: 這個國家是指日本，以「興亞論」做為改革與富強的核心思想
  - label: B
    content: 面對西方勢力，這個國家因應得宜，從未受到不平等條約束縛
  - label: C
    content: 這個國家在當時採行「脫亞入歐」的方針，積極仿效西方文明
  - label: D
    content: 在過去東亞文化圈形成的時代，這個國家已居於東亞盟主地位
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 資料二：宋真宗致書予遼國蕭太后表達祝賀。在書信內容中，稱宋為南朝，並稱遼為北朝。 資料三：南宋孝宗與寧宗與金朝的和議，曾分別確立雙方關係為叔侄、伯侄關係。請根據以上三則資料的內容從當時的背景判斷，宋朝與這兩國政權的外交關係有何特點？
  options:
  - label: A
    content: 認為世界是由中央與四邊的方國構成，本身則居於中心的位置
  - label: B
    content: 強調本身文明優於四邊民族，將四邊視為文化落後的蠻夷戒狄
  - label: C
    content: 形成明確的邊界意識，認為中原與四邊民處於對等多元的關係
  - label: D
    content: 強調本身為文明中心，將華夏與周邊民族視為上對下的尊卑關係
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 1919年梁啟超在他的《中國史敘論》一書中，將中國的歷史發展階段分為：「中國之中國」、「亞洲之中國」、「世界之中國」三階段，雖仍有學者提出不同看法，但仍有可參考之處。請問：下列敘述何者符合其說法？
  options:
  - label: A
    content: 春秋戰國時代華夏與四夷之間相互交融，「東亞文化圈」即在此時形成
  - label: B
    content: 唐太宗貞觀四年，受西域各族上「天可汗」稱號，為東亞各國盟主，正符合「亞洲之中國」概念
  - label: C
    content: 在「世界之中國」時期，中國文化像是：漢字、儒家觀念、中國化佛教、律令制度等首次外傳影響他國
  - label: D
    content: 自八國聯軍以後，西方列強以船堅砲利進入中國，給予中國極大的刺激與挑戰
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 有學者認為：「清帝國之所以能夠長期維繫其版圖，是因為大清皇帝不會強加特定的價值給這些民族，而是貫徹尊重各民族宗教文化所產生的社會型態。」如果就此觀點看來，下列敘述何者正確？
  options:
  - label: A
    content: 這些民族可能是指西藏、新疆、蒙古等地區的民族
  - label: B
    content: 此學者認為清帝國以儒家文化傳布到邊陲地區是維繫統治的主要力量
  - label: C
    content: 此學者認同「東亞文化圈」的觀念，且認為清帝國也是東亞文化圈中的一環
  - label: D
    content: 由此觀念看來，此學者認同中國傳統夷夏之辨—夷狄進於中國，則中國之
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「中國」一詞原為地域觀念，由周朝所統治的中原地區擴展為諸夏領域，到後來多指正統政權的統治區域；「中國」亦具有文化意涵，指從華夏民族不斷吸收周邊民族文化摶成一整體，但真正形成「國名」，則是近現代以後的事了。請問：就這個脈絡而言，下列觀念何者正確？
  options:
  - label: A
    content: 中國一詞具有空間、文化與政治等多重意義
  - label: B
    content: 「夷狄進於中國則中國之」這句話多半強調只要夷狄征服中原地區，就可以成為中國之主
  - label: C
    content: 「中國」代表文明、「夷狄」被視為野蠻落後，所以塞北民族入主華夏地區後，都會以「中國」自居，並變更原有服儀
  - label: D
    content: 自漢武帝「罷黜百家、獨尊儒術」後，儒家文化成為亂世明燈，形成維繫「中國」的唯一凝聚力量
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 中國歷史上「縣」最早出現於何時？請依所列資料加以判定。 資料一、《漢書•地理志》：「（秦）併四海，以為周制微弱，終為諸侯所喪，故不立尺土之封，分天下為郡縣。」 資料二、《左傳》僖公三十三年，晉師破白狄，胥臣有功，「襄公命（令）先茅之縣賞胥臣。」杜預注：「先茅絕後（嗣），故取其縣以賞胥臣。」
  options:
  - label: A
    content: 春秋之時
  - label: B
    content: 戰國之時
  - label: C
    content: 秦滅六國之後
  - label: D
    content: 漢帝國建立時
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 電視劇《瑯琊榜》雖是平行時空的古裝劇，但其歷史內容考究相當仔細。其中有一幕是靖王蕭景琰、梅長蘇、戶部尚書沈追、刑部尚書蔡荃在討論當年度「中正定品」之事，以下是關於它們討論的內容： 蕭景琰：「找個公正不阿，清廉忠正之人就可以杜絕選士流弊。」 蔡荃：「靖王所言甚是！實際上中正官人選並不容易尋覓，其出身、地域、故舊、姻親、師門都可能影響人才選拔結果。」 沈追：「擔任中正官之人的品級不能太低，還需有品評人才之本事，才能服人。」 梅長蘇：「選一個中正官都如此困難，還有十八個副中正。」 請問：上述所討論之選才方式，與中國哪個朝代的取才制度相似？
  options:
  - label: A
    content: 漢朝，徵辟制
  - label: B
    content: 漢朝，貢舉制
  - label: C
    content: 曹魏，九品官人法
  - label: D
    content: 隋朝，科舉
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 忽必烈的繼承者所做唯一一樁不因循朝代創始者規畫的大事，就是恢復了中國傳統的科舉取士。其目的並不在構成中國式的文官組織，考試時蒙古人和色目人另設一科，而錄取的人也不出任重要職守，只能在低層組織中出任不重要的官員。中國不少讀書人因此鬱鬱不得志，只好將才能向其他方面發展，反倒促成了中國文學的一段黃金時代。請問：這個時期的科舉制度開始出現以下什麼現象？
  options:
  - label: A
    content: 名額增加，開始促進社會階級的流動
  - label: B
    content: 開始採分科考試，蒙古人、色目人考明經科，漢人考進士科
  - label: C
    content: 規定以朱熹的《四書集注》作答，固定文章格式以建立客觀的取才標準
  - label: D
    content: 開始以朱熹所撰的《四書集注》作為考試的定本
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 「尚書」在先秦原是掌文書的小官，職卑權輕；漢武帝時成為給士人方便出入內廷的官銜而已，負責在皇帝與丞相之間轉達文書，但沒有參與決策的權力；東漢光武帝時，將參政權下放予尚書，有關選舉誅賞與參議朝政，都由尚書負責；漢順帝時尚書已成外朝的官員。由以上對尚書職權變化的敘述，反映出什麼現象？
  options:
  - label: A
    content: 尚書由朝廷大官變成地方官
  - label: B
    content: 相權地位不斷提高，君權地位不斷降低
  - label: C
    content: 君權旁落，尚書權愈來愈大
  - label: D
    content: 皇帝不願強臣干政，打壓相權，重用近臣
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 某地洪水為患，消息上報朝廷後，皇帝一方面交待工都盡速搶修潰決的堤防，勿使水患繼擴大；另一方面實成戶部盡速調度糧食，運往災區，賑濟災民。幕僚根據皇帝之意，寫成詔書，經皇帝確認無誤後，直接送至工、戶部等單位執行。這是哪個時期的制度？
  options:
  - label: A
    content: 秦漢
  - label: B
    content: 隨唐
  - label: C
    content: 宋元
  - label: D
    content: 明清
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 如以附圖來說明西周到東周時代的政治時局，請問：下列解讀何者正確？
  options:
  - label: A
    content: 若以歷史發展趨勢排序，應為丙→甲→乙
  - label: B
    content: 圖乙時各國競相推動變法，中央集權的態勢萌生
  - label: C
    content: 圖丙的時代，周天子連名義上的共主亦不可得
  - label: D
    content: 圖甲的時代封建制度崩解，周天子無力以宗法及禮樂制度維繫社會秩序
