  stem: 在這次的改革中，皇帝在將人丁數已轉為定額的基礎上，把丁稅平均攤入田賦中，徵收統一的地丁銀，不但簡化了稅收方式，而且進一步解放人力，使農村人口可以遷往城市謀生。請問：關於上述稅法改革的敘述何者正確？
  options:
