  stem: 小君對韓國文化有濃厚的興趣，最近也報名韓語課程。老師在第一堂課首先介紹現今通用韓文的淵源，亦即「諺文」的由來。請問：她在這一堂課最有可能會聽到下列哪一項介紹內容？
