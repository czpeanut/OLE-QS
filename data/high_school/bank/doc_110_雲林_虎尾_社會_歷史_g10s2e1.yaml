- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 提到武士的起源，現今日本史教科書如此寫道：「在九世紀末到十世紀間，地方政治發生巨大變化，＿＿＿＿＿。」例如，嘉凁二年（1095），延曆寺和日吉社強求治流罪於美濃守源義綱，關白（類似中國的丞相）藤原詩通拒絕了該要求，並派大和源氏將上訴之人全部擊退。可見，當時朝廷已經無法應對寺社的強訴，轉而重用卓弓射箭的地方武士。此後，都城周邊開始變得沒有武士就無法解決紛爭，地方上更是如此。請問，在底線處，應該接著的是哪句話最為適宜？
  options:
  - label: A
    content: 前方後圓墳的出現十分值得留意
  - label: B
    content: 地方豪族和有力農民為維持自己勢力開始武裝群眾
  - label: C
    content: 日本和新羅一樣，開始學習唐朝最新治技術
