  stem: 小南在網路上找到一些關於唐代稅法演變的資料，然而在抄錄的過程中卻不小心弄亂了，以下是他找的資料內容。資料一：百姓舉家逃亡，規避賦稅，流散他地被稱為「客戶」。資料二：以國家財政開支所需為總額，所謂「量出以制入」，所有民戶在現居地登記，不分主客、根據財產情況定戶等，按戶等高低交納賦稅，分夏秋兩季徵收。資料三：此時規定每個成丁的農民都應受田一百畝，因此國家徵稅時只問丁身，不問財產。請問：資料一、二、三發生的時間順序應該為何？
