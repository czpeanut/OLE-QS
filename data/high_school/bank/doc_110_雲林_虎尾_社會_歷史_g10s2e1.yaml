  stem: 選才制度在不同的時代略有差異，以下是三則對於古代選本制度的現代詮釋說法，請問按照時代順序排列何者正確？ 資料一：為了在考試拿到高分，讀論文之類的文章因為易遭到背論抄錄的批評，所以應試以議論文作答往往無法得到好成績，唯有作詩寫賦才能展現個人聰明千思。 資料二：由於不需考試個人的經歷累積、自家長期形成的家學門風，輔以個人對於學問知識的自由鑽研，成為社會晉身的重要憑藉，因此家疾勢力的個人學問品味相輔相成，透過各級考核人員，依照家庭背景、道德、知識，評斷出才能高下，進而成為政府官員。 資料三：考試甚為重要，因此政府研擬出的防弊措施，同時，為求公平起見，統一規定了考試的範圍以及作答的字數、形式，讓政府能夠兼具公平原則下，夠有效地選拔人才。
  options:
  - label: A
    content: 一、二、三
  - label: B
    content: 二、一、三
  - label: C
    content: 二、三、一
  - label: D
    content: 三、二、一
