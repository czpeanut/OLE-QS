- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: 學者認為，「編戶齊民」的形成有其歷史意義，「編戶」屬於政府內政的一環，「齊民」是人民身份的問題，兩者雖屬不同概念，卻相輔相成、不能分割。編戶之民脫離了各級貴族的束縛或壓迫，成為國君統治下的平等人民，故曰：「齊民」。春秋中晚期後，戶籍制度與田籍制度逐漸出現。請問編戶齊民制度出現的主因為何？
