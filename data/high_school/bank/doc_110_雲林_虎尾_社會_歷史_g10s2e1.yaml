- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 在一次君臣朝會時，皇帝說：「改朝換代之前，統治者禁止宗室們定期聚會，也不讓宗室們參與政治，後來這個統治家族的勢力式微後，我的祖、父輩逐漸地滲透帝國核心權力，以致我可以順利地奪取這個帝國。因此，我決定分封我的宗室及子弟為王，讓他們在封國之內都可以有力量對抗外來者的勢力。」請問：關於這次朝會的內容，下列敘述何者正確？
  options:
  - label: A
    content: 從文中判斷，這位皇帝的祖、父輩滲透東漢的權力核心，並奪取漢的統治權
  - label: B
    content: 這位皇帝質終結群雄割據並開創統一的局面
  - label: C
    content: 這位皇帝開創了以人才品第選拔中央官員的制度
  - label: D
    content: 這位皇帝分封宗室與子弟為王是後來導致「七國之亂」的原因
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 漢武帝即位後，透過察舉制度從民間拔擢人才為其獻策，後來皇帝與其身邊的近臣就稱之為「內朝」。請問：漢武帝建立內朝的原因為何？
  options:
  - label: A
    content: 外朝容易被宦官把持朝政，故以內朝培植皇帝的執政團隊
  - label: B
    content: 強化皇權力量，因相權與君權容易衝突，故以內朝分散外朝丞相權力
  - label: C
    content: 外朝處理國事，內朝處理皇帝私事，可建立公私分明的政治環境
  - label: D
    content: 內朝主國事，外朝主外交，有利政務分工
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 自秦始皇統一中國後，接受李斯的建議在全國實施郡縣制度，除漢初的郡國並行，西晉與明朝給予封建諸侯較大的權限外，郡縣制其實為中國歷代王朝承襲。明末學者顧炎武曾評述：「封建之失，其專在下；郡縣之失，其專在上。」請問：下列選項何者較符合其意？
  options:
  - label: A
    content: 封建之弊，在於特意將權力收歸中央
  - label: B
    content: 郡縣之弊，則在於地方權重，中央無法掌控
  - label: C
    content: 認為封建和郡縣兩制都各有優、缺點
  - label: D
    content: 推崇中央集權，反對地方分權
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列各點是小南整理出來關於中國各朝代宰相制度的發展：(甲)為防止專權擴權，丞相不但分出了軍事大權，甚至財經權力都被剝奪；(乙)設丞相負責處理中央政策，任官方式由世官世祿漸轉為用人唯才；(丙)宰相合議，不僅分權，同時分責，君主權力更形擴大；(丁)丞相之職已遭廢止，只有票擬職權的大學士在朝堂上唯唯諾諾。請依照甲、乙、丙、丁四個朝代的發展，按照時代先後，排序正確。
  options:
  - label: A
    content: 丁丙甲乙
  - label: B
    content: 乙丙甲丁
  - label: C
    content: 乙丁甲丙
  - label: D
    content: 甲乙
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 錢穆先生在《中國歷代政治得失》一書中曾評論中國政治制度，認為：「秦漢是一個大變動，唐之於漢，也是一大變動。」請問：下列的解釋何者比較符合錢先生的說法？
  options:
  - label: A
    content: 秦漢的變動在於將國家由地方分權的封建制轉為中央集權的郡縣制
  - label: B
    content: 秦漢中央集權制度也引發始皇設內朝制衡以丞相為首的外朝
  - label: C
    content: 唐之於漢的變動是將三省制轉化為三公制
  - label: D
    content: 這兩次的變動都產生相權侵凌君權的現象
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 部分研究中國史的學者認為所謂皇權是絕對的，也有學者說皇權是專制的，是指皇帝不受任何法律制度的约束。但在中國中央政府制度的設計上，何時並未如同上述，而是皇權是會受到约束的？
  options:
  - label: A
    content: 漢武帝時代的丞相
  - label: B
    content: 唐代的門下省
  - label: C
    content: 宋代的樞密院
  - label: D
    content: 清代的軍機處
- id: doc_110_雲林_虎尾_社會_歷史_g10s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 小南在上歷史課時，根據課本內容把明清兩朝的中央官制簡畫為附圖，下列相關敘述何者正確？
  options:
  - label: A
    content: 甲為明朝的情況、乙為清朝的編制
  - label: B
    content: 無論在甲、乙兩朝，內閣大學士的地位都是一致的，其上沒有其他更受皇帝重用的官員或機構
  - label: C
    content: 此朝代可稱為皇權專制的時代，主因內閣大學士只有建議權，而無決策權
  - label: D
    content: 軍機處與廠衛機構負責的事務一致，只是名稱不同
