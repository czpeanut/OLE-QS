  stem: 人類依照美學的觀點，將蘭花培育成能開出各式各美麗花朵的不同品種，這種「人擇」的篩選方式，加速了蘭花品種的演化。若將這些培育成的各種蘭花種到森林中適合生長的地方，使其自然繁衍，則這些蘭花大多數會繁衍茂盛或遭到環境淘汰而滅絕？為什麼？
