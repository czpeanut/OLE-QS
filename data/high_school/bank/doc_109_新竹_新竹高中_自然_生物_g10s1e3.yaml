  stem: 請觀察此圖，且從下列敘述中選出最合理之推論？
  options:
  - label: A
    content: 口器長度與果實半徑呈負相關，科學家的推測可能有誤
  - label: B
    content: 口器長度與果實半徑呈無相關，口器長度應該愈長愈好，能大小通吃
  - label: C
    content: 口器長度與果實半徑呈正相關，但仍需進一步研究釐清因果關係
  - label: D
    content: 口器長度與果實半徑呈正相關，必定是果實半徑愈長造成甲蟲口器愈長
  group_stem: 科學家正在研究某無患子科植物與無患子甲蟲的關係，無患子甲蟲以取食無患子科植物的種子為食。科學家觀察到甲蟲可以使用細長的口器穿過果實的0外層而到達種子，以口器吸食種子內部的汁液。但是無患子科的植物在種子的大小上具相當的差異，因此可以猜測口器的長度決定了無患子甲蟲能否生存。為了證實想法，科學家採取了當地11個不同的族群，並且針對各族群當地的無患子科植物果平均半徑，各甲蟲族群口器的平均長度進行測量。其結果表示如附圖。請回答下列49.、50.題
