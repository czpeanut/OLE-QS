- id: doc_109_新竹_新竹高中_自然_生物_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 地球的生物一開始形成後，就在海洋中逐漸發展。海洋環境十分多樣，扮演保留生物發展的盛果及促其持續演化的場所或棲地的角色。最原始的多樣性形成是由單細胞的細菌和古菌所組成。接著是細胞核的生成，而後形成真核生物體，於是開啟真核生物域的大演化。以動物界為例，由最簡單的組織構成多細胞的海綿動物，再逐步形成具有器官及器官系統的複雜生物體。生物體集結成族群，更進而與棲地相依，整合成為生態系。下列有關地球生物演化的次序，何者<u>錯誤</u>？
  options:
  - label: A
    content: 先發生在海洋，然後到陸地
  - label: B
    content: 先生成域，再生成界，最後形成物種
  - label: C
    content: 先有原核的細菌及古菌，然後才有真核生物體
  - label: D
    content: 生物體先出現組織，再演化形成器官
