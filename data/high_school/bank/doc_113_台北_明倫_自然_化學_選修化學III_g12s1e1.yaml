  group_stem: 一燒杯含有$Cl^{－}$、$CrO_{4}^{2－}$、$Br^{－}$三種離子各0.01 M。取裝有0.01 M的硝酸銀水溶液滴入燒杯中，假設滴入硝酸銀的體積可忽略，回答7-8題。（氯化銀、鉻酸銀、溴化銀的Ksp依序為1.5×$10^{－10}$、9×$10^{－12}$、7.7×$10^{－13}$）
