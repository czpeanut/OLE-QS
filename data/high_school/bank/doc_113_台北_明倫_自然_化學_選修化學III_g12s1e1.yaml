  stem: '平衡系BOH(aq) $\rightleftharpoons$ $B^{＋}$(ag)＋$OH^{－}$(aq)，25℃時的$K_{C}$＝2×$10^{－6}$。（共5分）

    (1) 25℃時：0.02 M BOH(aq)的pH值為多少？（log 2＝0.3）（3分）

    (2) （答案卡第28題）承上題，若在此水溶液加水稀釋，達新平衡時，pH的變化與原平衡相比為何？（2分）'
  options:
  - label: A
    content: 變大
  - label: B
    content: 不變
  - label: C
    content: 變小
  explanation: '(1) 列式可計算：（單為皆為M） $\rightleftharpoons$

    可得$\frac{x^{2}}{0.02 - x}$＝2×$10^{－6}$。假設0.02＞＞x，則可得0.02－x≒0.02，解得x＝2×$10^{－4}$。 pOH＝4－log2＝3.7，pH＝14－3.7＝10.3。

    (2) 加水稀釋，所有物質濃度下降，接著平衡往係數和大的方向和向右移動：達新平衡時因[BOH]較加水前低，溫度不變故K不變，故[$B^{＋}$]、[$OH^{－}$]也比加水前低，因此pOH增加、pH下降。故選(C)。'
