- id: doc_113_台北_明倫_自然_化學_選修化學III_g12s1e1_s4_3
  section: 4
  number: 3
  type: single
  page: 3
  stem: '在一公升容器中，平衡系2A(g) $\rightleftharpoons$ B(g)在某溫度下達平衡，此時A和B的濃度皆為1M。（共8分）

    (1) 定溫定容下，加入B多少莫耳可讓A在達新平衡時變為3M？（3分）

    (2) 定溫下，擴大容器體積變為二公升。

    ① （答案卡第32題）$\frac{新平衡的 [B]}{原平衡的 [B]}$是否小於$\frac{1}{2}$？（2分）

    ② 利用移動方向說明如何判斷第①小題的答案。（3分）'
  options:
  - label: A
    content: 是
  - label: B
    content: 否
  explanation: '(1) 由平衡時濃度[A]＝[B]＝1 M，可得$K_{c}$＝$\frac{[B]}{[A]^{2}}$＝1。

    反向列式，K仍為1，假設加入a mol的B（濃度皆為M）： $\rightleftharpoons$

    $K_{c}$＝$\frac{[A]^{2}}{[B]}$＝$\frac{3^{2}}{a}$＝1，可得a＝9，B的起始濃度＝9 M，又體積為1 L，故加入的B＝9 mol。

    (2) 擴大容器體積瞬間，所有物質濃度減半，但平衡移動方向會由氣體係數小→氣體係數大，故[B]的濃度會比原本的一半再更少，故答案為(A)。'
