  answer_source: answer_key
  explanation: 解離方程式：Mg(OH)$_{2}$(s)$\rightleftharpoonsMg^{2＋}$(aq)＋2 $OH^{－}$(aq)，$K_{sp}$＝$4a^{3}$。 在2M氣化鎂溶液中，[$Mg^{2＋}$]＝（2＋b）M，[$OH^{－}$]＝2b M，$K_{sp}$＝（2＋b）(2b)＝$8b^{2}$ 在2M氫氧化鈉溶液中，[$Mg^{2＋}$]＝c M，[OH]＝（2＋2c）M，$K_{sp}$＝c（2＋2c）＝4c 因$K_{sp}$＜＜1，故a＞b＞c，或由同離子效應可得知，加入與沉澱物相同的離子會使溶解度下降，一樣可得a＞b＞c。又由上式可得知$K_{sp}$＝$4a^{3}$＝4c，可得a3＝c，在2M鹽酸溶液中，因$H^{＋}$會與$OH^{－}$中和，故溶解度會比在水中更大，故d＞a＞b＞c。故選(B)(D)。
