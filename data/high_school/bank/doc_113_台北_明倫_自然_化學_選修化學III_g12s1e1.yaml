  answer_status: verified
  answer_source: answer_key
  explanation: 假設200 g的碳酸鈣（2 mol）完全反應可生成2 mol的二氧化碳，計算2 mol二氧化碳的氣體壓力：P（atm）×4.1（L）＝2（mol）×0.082（$\frac{atm\cdot L}{mol\cdot K}$）×1000（K），可得P＝40 atm＞0.5 atm，故最終系統只會達到平衡狀態的0.5 atm。故選(E)。
