  answer_source: answer_key
  explanation: $K_{p} = K_{c}(RT)^{\Delta n}$，其中 $\Delta n$ 為（產物氣體係數和）－（反應物氣體係數和）$= 2 - 1 = 1$。因此 450 K 時 $\frac{K_{p}}{K_{c}} = 450R$，300 K 時 $\frac{K_{p}}{K_{c}} = 300R$，兩者比值為 $\frac{450}{300} = 1.5$。故選(D)。
