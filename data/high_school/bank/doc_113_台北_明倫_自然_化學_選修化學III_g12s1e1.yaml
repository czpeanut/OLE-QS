- id: doc_113_台北_明倫_自然_化學_選修化學III_g12s1e1_s2_11
  section: 2
  number: 11
  type: multiple
  page: 1
  stem: 光氣（$COCl_{2}$）是一種無色不可燃氣體，因為有劇毒，在第一次世界大戰中用作化學武器造成數萬人死亡。CO和$Cl_{2}$加熱並經活性碳催化下可合成光氣，CO(g)＋$Cl_{2}$(g) $\rightleftharpoons$ $COCl_{2}$(g)。在定溫、密閉系统下，可藉由下列哪些方式確認已達平衡？
  options:
  - label: A
    content: 系統總質量不變
  - label: B
    content: 系統顏色深淺不變
  - label: C
    content: 定壓下，系統總體積不再改變
  - label: D
    content: CO分壓＝$Cl_{2}$分壓
  - label: E
    content: $COCl_{2}$的消耗速率＝$COCl_{2}$的生成速率
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)化學反應只要密閉（使氣體無法進出），質量就會守恆；(B)氯氣有顏色，故顏色不變代表氯氣濃度不變，則系統達平衡；(C)反應物氣體係數＞產物氣體係數，故系統體積不改變代表系統達平衡；(D)若起始加入的CO、$Cl_{2}$相等，因其系數比＝1：1，故從頭到尾分壓都會相等，若起始加入的CO、$Cl_{2}$不相等，那從頭到尾分壓都不會相等，故此敘述錯誤；(E)正反應速率＝逆反應速率，為平衡的狀態。故選(B)(C)(E)。
  tags:
    unit:
      code: CH-S3-1-1
      book: 選修化學III 化學平衡
      chapter: 化學平衡
