  stem: 已知拋物線過兩定點（3，1），（9，3），又對稱軸為 y＝－1，則此拋物線方程式為＿＿＿＿。
  explanation: '∵對稱軸為 y＝－1

    ∴令Γ：（y＋1）$^{2}$＝4c（x－h），過點（3，1），（9，3）

    代入得$\begin{cases}4 = 4c (3 -h) \ldots \ldots \ldots \ldots \ldots ① \\ 16 = 4c (9 -h) \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由$\frac{①}{②}$得$\frac{1}{4}=\frac{3 -h}{9 -h}$

    $\Rightarrow$9－h＝12－4h

    $\Rightarrow$3h＝3$\Rightarrow$h＝1 代入①

    ∴4＝4c×2

    $\Rightarrow$4c＝2

    故Γ：（y＋1）$^{2}$＝2（x－1）'
