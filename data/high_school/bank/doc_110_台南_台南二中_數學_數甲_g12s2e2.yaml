  stem: 拋物線之對稱軸平行 x 軸，且過（0，2），（－2，0），（3，4）三點，則此拋物線之方程式為＿＿＿＿。
  explanation: '∵對稱軸平行 x 軸 ∴拋物線為左右型

    令Γ：x＝$ay^{2}$＋by＋c，過點（0，2），（－2，0），（3，4）

    代入得$\begin{cases}4a + 2b +c = 0 \\ c =- 2 \\ 16a + 4b +c = 3\end{cases}\Rightarrow\begin{cases}4a + 2b = 2 \ldots \ldots \ldots \ldots \ldots ① \\ 16a + 4b = 5 \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由②－①×2 得 8a＝1

    ∴a＝$\frac{1}{8}$代入①得$\frac{1}{2}+ 2b = 2\Rightarrow2b =\frac{3}{2}\Rightarrowb =\frac{3}{4}$

    ∴$x =\frac{1}{8}y^{2}+\frac{3}{4}y - 2$'
