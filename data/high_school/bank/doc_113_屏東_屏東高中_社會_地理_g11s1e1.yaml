  stem: 改編自史詩的印度寶萊塢史詩電影《帕德瑪瓦特》（Padmavat），因劇情問題遭「印度教教徒」抵制上映，引爆印度 4 省暴動，特別是某一種姓的民眾行動最為激進。電影描述 14 世紀入侵印度的「伊斯蘭教徒」統治者，人稱蘇丹的阿拉烏丁（Alauddin Khilji）愛上印度王后帕德瑪瓦蒂。為了保護拉吉普特人（Rajput）的名聲，帕德瑪瓦蒂寧死不願讓敵人玷汙，最後帶領全城女性自焚的故事，帕德瑪瓦蒂在印度人民心中留下寧死不屈的巾幗形象，成為拉吉普特人心中永遠的驕傲。拉吉普特人原為印度種姓階級中的戰士，具驍勇善戰形象，被視為是婆羅門文化的守衛者，不僅男性好武，女性也具有堅忍不拔的形象，在當今印度社會擁有一席之地，請問上述「拉吉普特人」應屬於種姓制度中的哪一階級？
