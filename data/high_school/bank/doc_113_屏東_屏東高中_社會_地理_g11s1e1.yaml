  page: 8
  stem: 紐西蘭為各類極限運動的發源地，應與紐西蘭的哪一特色最相關？
  options:
  - label: A
    content: 位於水半球中心
  - label: B
    content: 被譽為「活的地形教室」
  - label: C
    content: 為南島語族分布最南端
  - label: D
    content: 世界奶粉出口最大國
  group_stem: 紐西蘭為各類極限運動的發源地，知名項目包括：空中跳傘、高空彈跳、冰河健行、峽谷鞦韆、噴射快艇、黑水漂流等，吸引世界各地的運動好手與遊客前來挑戰自我……。2015 年紐西蘭進行過更換國旗公投（圖(一)），提案原因主要有(甲)國旗與澳洲國旗太過相似、(乙)國旗上的紐西蘭在地元素太少、(丙)歷史因素，而新國旗上的銀蕨圖案，根據毛利族的傳說，銀蕨會為迷路的勇士指引方向。結果，56.6 ％的投票民眾支持維持舊有國旗，43.2 ％支持新國旗，更換國旗的公投沒有成功，圖(二)是紐西蘭銀蕨分布圖。又，紐西蘭公布的農業調查結果顯示，當地 2022 年繁育的綿羊數量為 2,530 萬頭，是自 1850 年代有紀錄以來，羊隻數與人口比首次跌破 5：1 的水準（1982 年的高峰為 22：1），而同樣畜牧業發達的澳洲，綿羊數量大約是紐西蘭的 3 倍，與澳洲的人口比為 3：1。紐西蘭綿羊數量減少的原因與羊毛價格下跌有關，一方面是人工合成纖維的出現，導致羊毛需求減少、價格下跌，另一方面則與來自「某國」的羊毛廠訂單大減最有關。請問：
  shared_asset: g3_44_47
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)紐西蘭北島多火山、南島多冰河，地形豐富，適合各項極限運動進行。
