  stem: 2020 年東非蝗蟲災害，堪稱是 25 年來最嚴重的一次，這種蝗蟲主要分布在非洲、中東及亞洲等地，平時牠們是一隻隻單獨地生活，但因為大雨讓草木變得青翠，一個地點就會有許多隻蝗蟲聚集，然後產生異變，而且變得比較小隻，較容易飛行，食慾也變得旺盛，同時群體化行動，又大量產卵，一旦幼蟲們翅膀生成就無法阻止牠們的前進。印度西北邊於 2020 年 4 月 11 日發現第一批蝗蟲群，其農業部希望能在 6 月底蝗蟲進入繁殖季節之前獲得控制蝗災，否則水稻、玉米和高粱等作物不保。為阻止蝗蟲來吃作物，相關單位以拖拉機噴灑殺蟲劑、消防車消滅樹上蝗蟲，警民不斷以汽車喇叭聲、大聲的音樂聲來驅趕蝗蟲。所幸蝗蟲數量已經開始下降，但<u>現在的</u>天氣雖然可能減輕蝗蟲威脅，但卻是一把雙面刃，幾乎可以預測今年的農作物收成也不會好……。請問 4 月到 6 月之後，蝗蟲容易進入印度，主要受下列何種天氣系統影響？
