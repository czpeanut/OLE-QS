  explanation: '(D)丁：菲律賓位環太平洋板塊交界位置，多火山地震，也位西太平洋的颱風路徑上。

    12.19 世紀華工至東南亞主要參與殖民時期的(C)熱帶栽培業農場工作。

    13.熱帶栽培業為(B)歐洲人殖民東南亞時發展的主要產業之一。

    14.由南側的東南風至(B)ㄆ處轉為西南風，可知此處接近赤道的位置。

    15.(D)甲乙兩國皆位在中南半島上，同屬熱帶季風氣候，主因為大規模海陸性質差異所導致。

    16.蘇門答臘的霾害會因信風偏轉，形成西南風而影響到北方的鄰國，故選(B) b。

    17.(B)乙：泰國的曼谷近代大力發展汽車產業，有「東方底特律」之稱。

    18.(A)泰國人力眾多、工資相對於已開發國家便宜、國家發展相對穩定，是吸引投資的利多條件。

    19.(A)是食品類的清真認證，故此題送分。(B)為各項產品進行科學檢驗的機構。(C)為中華食品安全管制標章。(D)為經濟部標準檢驗標章。如果僅選擇「最相關」則(A)正確，但母嬰產品應不會只有食品類的認證，因此本題建議送分。

    20.(B)金三角因位在高山地區，地形崎嶇，生活不易，形成三不管地帶，易生犯罪事件。(A)此地位居山區，非低窪區。(C)此區為熱帶季風氣候，夏季多雨。(D)此地並非海濱地區，不會有海嘯。

    21.(D)湄公河流經中南半島 5 國，亦流經泰國、緬甸、寮國交界的金三角區域。

    22.(A)殖民歷史背景類似、氣候條件相同，導致農業產品相近，同質性高。

    23.(C)人力眾多、工資相對於已開發國家便宜，是東南亞地區吸引外資投資的重大關鍵，且龐大的人口數同時是內需市場的保證，能形成外資投資的拉力。

    24.RCEP 以免關稅為最終極目標，形成單一市場，擴大生產規模，獲得(D)規模經濟。

    25.澳洲北側夏季受間熱帶輻合區影響，降水豐沛；冬季則受副熱帶高壓帶籠罩，乾燥少雨，為乾溼季節分明的熱帶莽原氣候區，圖中甲、己兩地可見莽原景觀。故選(A)甲。

    26.乙區為夏雨型暖溫帶氣候，主要終年受東南信風吹拂，且有東澳暖流調節所造成。故選(A)。

    27.澳洲中西部終年因副熱帶高壓帶籠罩、西澳涼流流經而乾燥少雨，為熱帶乾燥氣候區，最適宜設置太陽能板，故選(D)丁。

    28.葡萄栽植盛行於溫帶地中海型氣候區，澳洲西南部夏季因副熱帶高壓帶籠罩、西澳涼流流經而乾燥少雨；冬季吹西風且涼流稍減而有降雨，為夏乾冬雨的溫帶地中海型氣候區。故選(D)戊。

    29.澳洲東南側的夏雨型暖帶氣候區為移民最早的精華區，故選(B)乙。

    30.夏乾冬雨為溫帶地中海型氣候的特徵，故選(D)戊。

    31.澳洲東北部有世界規模最大的大堡礁，故選(D)己。

    32.由年曆可知為混合農業經營型態，主要分布在新南威爾斯州（大分水嶺山西側），故選(D)庚。

    33.自流井需位在受壓水層、井口低於受壓水面、受壓水帶傾斜處，故選(D) D。

    34.澳洲人口成長率約為 6 ‰，且預期壽命高，代表老年人口眾多，已進入(D)低穩定階段。

    35.取消簽證費會降低移動因素中的利空，屬於消除(C)中間障礙。

    36.甲有肉牛養殖，丙有羊隻養殖，故選(A)。

    37.(C)毛利人為紐西蘭原住民，非澳洲原住民。

    38.澳洲綿羊養殖在大分水嶺山脈以西的半乾燥氣候區；紐西蘭全境多屬海洋性氣候區，故選(D)。

    39.(A)印度傳統上沒有大量焚燒農地的農業習慣。

    40.(B)冬季時陸地受副熱帶高壓籠罩，空氣更不容易對流。

    41.(乙)印度近代鼓勵開放外資投資，但因基礎建設差，很多地區招商不利。

    42.乙、丁皆主要信仰印度教，而印度半島上因過去有相當大比例的穆斯林，因此乙應為印度，丁則為尼泊爾。故選(B)乙。甲為信仰伊斯蘭教為主的孟加拉；丙為信仰佛教為主的斯里蘭卡。

    43.(B)恆河為印度的聖河。'
