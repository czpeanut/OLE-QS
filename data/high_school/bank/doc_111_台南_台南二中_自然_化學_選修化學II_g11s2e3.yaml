- id: doc_111_台南_台南二中_自然_化學_選修化學II_g11s2e3_s2_30
  section: 2
  number: 30
  type: multiple
  page: 3
  stem: 有關分子或離子的鍵角比較，下列何者正確？
  options:
  - label: A
    content: $NO_{3}^{－}$＞$NO_{2}^{－}$＞$NH_{4}^{＋}$
  - label: B
    content: $SO_{3}$＞$SO_{3}^{2－}$＞$SO_{4}^{2－}$
  - label: C
    content: $CCl_{4}$＞$CO_{3}^{2－}$＞$CO_{2}$
  - label: D
    content: $CH_{4}$＞$NH_{3}$＞$H_{2}$O
  - label: E
    content: $CF_{4}$＝$PO_{4}^{3－}$＝$SO_{4}^{2－}$
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)$NO_{3}^{－}$、$NO_{2}^{－}$為$sp^{2}$混成，鍵角約為120°，又$NO_{2}^{－}$有lp，鍵角略小於120°。$NH_{4}^{＋}$為$sp^{3}$混成，鍵角為109.5°。(B)$SO_{3}$為$sp^{2}$混成，鍵角為120°。$SO_{3}^{2－}$、$SO_{4}^{2－}$為$sp^{3}$混成，鍵角約為$109.5^{o}$，又$SO_{3}^{2－}$有lp，鍵角略小於109.5°。(C) $CCl_{4}$為$sp^{3}$混成，鍵角為109.5°，$CO_{3}^{2－}$為$sp^{2}$混成，鍵角為120°，$CO_{2}$為sp混成，鍵角為180°。(D)皆為$sp^{3}$混成，鍵角約為109.5°，又$NH_{3}$、$H_{2}$O有lp，鍵角略小於109.5°，且lp越多鍵角越小，故$CH_{4}$＞$NH_{3}$＞$H_{2}$O。(E)皆為$sp^{3}$混成、皆無lp，故鍵角皆為109.5°。故選(A)(D)(E)。
