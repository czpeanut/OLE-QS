  answer_status: verified
  answer_source: answer_key
  explanation: (A)原子量$O_{2}$＞$N_{2}$，故沸點$O_{2}$＞$N_{2}$；(B)原子量相同，極性CO＞$N_{2}$，故沸點CO＞$N_{2}$；(C) $C_{6}H_{12}O_{6}$為分子化合物，$SiO_{2}$為網狀固體，故$SiO_{2}$熔沸點較大；(D) $H_{2}$O的氫鍵最多，沸點最高，HF的氫鍵較$NH_{3}$的氫鍵強，故為$H_{2}$O＞HF＞$NH_{3}$；(E)分子量越大，分散力越大，沸點越高，故$C_{3}H_{8}$＞$C_{2}H_{6}$＞$CH_{4}$。故選(A)。
