    content: $C_{6}H_{12}O_{6}$＞$SiO_{2}$
  - label: D
    content: $NH_{3}$＞$H_{2}$O＞HF
  - label: E
    content: $CH_{4}$＞$C_{2}H_{6}$＞$C_{3}H_{8}$
