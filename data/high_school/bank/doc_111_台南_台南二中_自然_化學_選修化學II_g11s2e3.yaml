  options:
  - label: A
    content: 鍵角：$CCl_{4}$＞$NCl_{3}$
  - label: B
    content: 鍵角：$BF_{3}$＞$NF_{3}$
  - label: C
    content: 鍵角：$CF_{4}$＞$BF_{3}$＞$BeF_{2}$
  - label: D
    content: 氮－氮鍵的鍵能：$N_{2}$＞$N_{2}F_{2}$＞$N_{2}F_{4}$
  - label: E
    content: 碳一氧鍵的鍵能：CO＞$CO_{2}$＞$CO_{3}^{2－}$
