  stem: ▲ 在實驗室中有一台可發出波長為550奈米的綠色雷射光源，發光功率為3.6 W。已知光速為3.0×$10^{8}$公尺，普朗克常數為6.6×$10^{－34}$焦耳‧秒。以此為入射光源，並以金屬A為材料，進行光電效應實驗。 a. 簡要說明雷射光為單一波長而非連續光譜的原因。（4分） b. 此光源發出的每個光子之能量為若干焦耳？（需列出計算式）（4分） c. 理論上金屬板A每秒最多可產生多少個光電子？（需列出計算式）（4分） d. 若實驗一直無法測到光電流的產生，判斷以下方式是否可行？並簡要說明原因： (1) 更換為發光功率為10 W的雷射光源。（3分） (2) 更換為632.8奈米的He-Ne雷射光源 (3<u>)</u> 更換功函數較高的金屬B為材料。（3分） (4) 將雷射先通過雙狹縫後之干涉條紋再打至金屬A材料上。（3分）
