  stem: 坐標平面上，直線 L 通過點（2，3）且斜率為－$\frac{3}{2}$，若直線 L 與 x 軸、y 軸在第一象限圍出△ABC，則下列哪些選項是正確的？
  options:
  - label: A
    content: △ABC 的周長大於 17
  - label: B
    content: △ABC 的外心坐標為（3，2）
  - label: C
    content: △ABC 的內心坐標為（1，1）
  - label: D
    content: △ABC 的垂心坐標為（0，0）
  - label: E
    content: △ABC 的重心坐標為$\left( \frac{4}{3} , 2 \right)$
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'L：x－5y＋21＝0$\xrightarrow{向右平移 k 單位}$（x－k）－5y＋21＝0

    $\xrightarrow{向下平移 2k 單位}$（x－k）－5（y＋2k）＋21＝0

    將（0，0）代入得 0－k－5（0＋2k）＋21＝0

    ⇒－11k＋21＝0

    故 k＝$\frac{21}{11}$'
