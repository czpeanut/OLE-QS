- id: doc_112_台南_台南一中_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知三直線 $L_{1}$：x＋y＝5、$L_{2}$：x－3y＝0、$L_{3}$：2x－y＝0 所圍成的三角形區域（不含邊界）為 R，則下列哪些選項的點位在區域 R 的內部？
  options:
  - label: A
    content: （1，1）
  - label: B
    content: （2，2）
  - label: C
    content: （3，3）
  - label: D
    content: （1，2）
  - label: E
    content: （2，1）
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '解 $L_{2}$、$L_{3}$ 之交點 ⇒$\begin{cases}2x + y = 3 \\ x - y = a\end{cases}$⇒ x＝$\frac{3 +a}{3}$，y＝$\frac{3 - 2a}{3}$

    ∴三相異直線恰有一交點$\left( \frac{3 +a}{3} , \frac{3 -2a}{3} \right)$

    代入 $L_{1}$ 得 a$\left( \frac{3 +a}{3} \right)$＋$\left( \frac{3 -2a}{3} \right)$＝1

    ⇒ 3a＋$a^{2}$＋3－2a＝3 ⇒ $a^{2}$＋a＝0 ⇒ a（a＋1）＝0 ⇒ a＝0 或－1

    ① 當 a＝0 時，$\begin{cases}L_{1} : y = 1 \\ L_{2} : 2x + y =3 \\ L_{3} : x - y = 0\end{cases}$

    解得三直線恰交於一點（1，1）

    ② 當 a＝－1 時，$\begin{cases}L_{1} : -x + y = 1 \\ L_{2} : 2x + y = 3 \\ L_{3} : x - y =-1\end{cases}$

    解得三直線恰交於一點$\left( \frac{2}{3} , \frac{5}{3} \right)$，但 $L_{1}$＝$L_{3}$ 與題意不合

    由①、② 得 a＝0'
- id: doc_112_台南_台南一中_數學_g10s1e2_s2_2
  section: 2
