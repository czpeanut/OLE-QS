- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: <u>瓦特尼</u>最多可製造出多少公斤的氫氣？
  options:
  - label: A
    content: '41.6'
  - label: B
    content: '38.2'
  - label: C
    content: '35.7'
  - label: D
    content: '31.4'
  - label: E
    content: '28.8'
  group_stem: ◎ 2015年<u>美國</u>電影《絕地救援》（The Martian），故事敘述一次火星任務中，太空人兼植物學家<u>馬克‧瓦特尼</u>在沙塵暴襲擊後醒來發現，自己已被任務組員認定罹難而被遺棄在火星。<u>瓦特尼</u>清點物資後，發現剩餘的物資只能够支撐他過309個火星日，還好<u>瓦特尼</u>發現一個原定感恩節打開的箱子内塞滿了馬鈴薯。於是<u>瓦特尼</u>運用其對植物與化學的知識，決定利用火星的土壤種植馬鈴薯以延長存活時間等待救援。於是他清出一塊居住艙的空間，並估計至少需要250公斤的水才足以供應馬鈴薯四年灌溉所需，並使用自己和其他組員留下的排遺物當作肥料，種植馬鈴薯；但最大得問題還是如何取得水。 <u>瓦特尼</u>想到利用氫氣燃燒來產生水。其中燃燒時氧氣的來源，是利用NASA所發明的製氧機（MOXIE）經催化劑將火星上的二氧化碳轉換為氧氣，由於火星大氣中含有95%以上的二氧化碳，因此氧氣的供應並無問題。而氫氣的來源，<u>瓦特尼</u>想到將登陸艇Mars Descent Vehicle（MDV）内剩下的300公升的液態聯胺$N_{2}H_{4}$（密度1.02 kg／L；分子量為32）小心倒人反應槽，加入由登陸艇取得的銥催化劑，將聯胺分解為氫氣與氮氣，其反應式為：$N_{2}H_{4}$(l) → $N_{2}$(g)＋2 $H_{2}$(g) <u>瓦特尼</u>用PVA塑膠布將馬鈴薯種植區域圍起來，再小心地將反應槽的氣體以塑膠管導流出，便可以適當的氣體供應速率將氫氣與氧氣點火來製造水，這樣一來，燃燒所產生的水蒸氣以及熱能得以保留在這個空間中，水蒸集在塑膠布上冷凝為液態水得以保持土壤濕潤。另外，在氫與氧燃燃的反應式中，每生成1 mol液態水可放熱285.8 kJ，故產生的熱也有助於使馬鈴薯保持在適合生長的溫度，試回答18～20題：
  answer:
  - B
