  stem: 設實係數二次方程式$x^{2}$－kx＋(k＋3)＝0的兩根為α，β，試問： (1) 若α，β為實數，求k的範圍為＿＿＿＿。 (2) 若α，β為實數，求k等於＿＿＿＿時，會使得α$^{2}$＋β$^{2}$的值最小。
  answer:
  - (1)$k\geq 6$或$k\leq -2$；(2) 1
  answer_status: verified
  answer_source: answer_key
  explanation: '$\alpha +\beta =-\frac{-k}{1},\alpha \beta =k+3$

    (1) $D=(-k)^{2}-4\times 1\times (k+3)\geq 0\Rightarrow k^{2}-4k-12\geq 0\Rightarrow (k-6)(k+2)\geq 0$

    $k\geq 6$或$k\leq -2$ (2)$\alpha ^{2}+\beta ^{2}=(\alpha +\beta )^{2}-2\alpha \beta =k^{2}-2(k+3)=k^{2}-2k-6=(k-1)^{2}-7\geq -7$

    所以當$k=1$時, $\alpha ^{2}+\beta ^{2}$有最小值。'
