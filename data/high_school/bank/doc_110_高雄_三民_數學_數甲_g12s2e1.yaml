  stem: 設x,y ∈ R，若x＋y＝－10，且xy＝9，則下列何者為真？（多選）
  options:
  - label: A
    content: $(\sqrt{x}+\sqrt{y})^{2}=-16$
  - label: B
    content: $(\sqrt{x}-\sqrt{y})^{2}=-4$
  - label: C
    content: $\sqrt{x}+\sqrt{y}=\pm 4i$
  - label: D
    content: $\sqrt{x}-\sqrt{y}=\pm 2i$
  - label: E
    content: $\frac{\sqrt{x}}{\sqrt{y}}=-\frac{\sqrt{x}}{\sqrt{y}}$
  answer:
  - A
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\because x+y=-10,xy=9\therefore x<0,y<0$

    (A) $(\sqrt{x}+\sqrt{y})^{2}=x+y-2\sqrt{xy}=-10-6=-16\therefore$正確

    (B) $(\sqrt{x}-\sqrt{y})^{2}=x+y+2\sqrt{xy}=-10+6=-4\therefore$正確

    (C) $\sqrt{x}+\sqrt{y}=\pm 4i\therefore$正確

    (D) $\sqrt{x}-\sqrt{y}=\pm 2i\therefore$正確

    (E) $\frac{\sqrt{x}}{\sqrt{y}}=\sqrt{\frac{x}{y}}\therefore$錯誤'
