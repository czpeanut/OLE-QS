  stem: 設複數z的虛部為$-\frac{1}{2}$，且$\frac{1}{z}$的實部為$\frac{3}{5}$，試求其共軛複數$\overline{z}$。
  answer:
  - $\overline{z}=\frac{3}{2}+\frac{1}{2}i$或$\frac{1}{6}+\frac{1}{2}i$
  answer_status: verified
  answer_source: answer_key
  explanation: '設$z=a-\frac{1}{2}i,\frac{1}{z}=\frac{3}{5}+bi$

    $\frac{1}{z}=\frac{1}{a-\frac{1}{2}i}=\frac{a+\frac{1}{2}i}{a^{2}+\frac{1}{4}}=\frac{a}{a^{2}+\frac{1}{4}}+\frac{\frac{1}{2}}{a^{2}+\frac{1}{4}}i$

    $\therefore \frac{a}{a^{2}+\frac{1}{4}}=\frac{3}{5},3a^{2}+\frac{3}{4}=5a$

    $\therefore z=\frac{3}{2}-\frac{1}{2}i$或$\frac{1}{6}-\frac{1}{2}i$

    $\overline{z}=\frac{3}{2}+\frac{1}{2}i$或$\frac{1}{6}+\frac{1}{2}i$'
