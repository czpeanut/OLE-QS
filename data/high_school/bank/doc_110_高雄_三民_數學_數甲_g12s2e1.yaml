  explanation: '$X:$ 1 2 3 4 5 6

    $p:\frac{1}{2}\frac{1}{2}\frac{1}{3}\frac{1}{3}\frac{1}{3}\frac{1}{3}$

    $\because p=\frac{1}{3}\therefore P(X>2)=P(X=3)+P(X=4)+P(X=5)+P(X=6)$

    $=C_{3}^{6}(\frac{1}{2})^{3}(\frac{1}{2})^{3}+C_{4}^{6}(\frac{1}{2})^{2}(\frac{1}{2})^{4}+C_{5}^{6}(\frac{1}{2})^{1}(\frac{1}{2})^{5}+C_{6}^{6}(\frac{1}{2})^{6}=\frac{20+15+6+1}{64}=\frac{42}{64}=\frac{21}{32}$'
