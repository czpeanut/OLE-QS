  stem: 美國政治哲學家羅爾斯（John Rawls）提出，建立社會基本制度的指導原則是「正義」原則。追求社會的公平正義，是為了促進個人及群體權利的實質平等，而政府存在的目的之一，就是要維護公平正義的社會。下列何項政策符合羅爾斯的「正義論」？
  options:
