    content: 為改善臺灣媒體環境，新聞產製流程應由政府進行最後把關
  group_stem: 國內某新聞臺依《衛星廣播電視法》申請換照，因該新聞臺違規件數過多，且在新聞製播中經常遭受董事、大股東等介入干擾，主管機關審查後決議否決其換照申請。某在野黨表示譴責，認為此舉將會嚴重限縮言論自由，是政治力干預新聞自由的行為，執政黨應省思關掉一家新聞臺將影響民眾接受不同立場的新聞，相當不利於臺灣民主的發展。無國界記者組織（RSF）則表示新聞自由並非無限上綱，須符合民主法治的規範才能有效發揮第四權的效用，權力不該被濫用；由獨立審查機關進行定期審查在民主政體是標準作業流程，並未涉及侵害新聞自由；而臺灣記者在政治高度兩極化、腥羶色、利潤至上的工作環境中掙扎，連帶影響臺灣公眾接受完整不被扭曲資訊的權利，政府必須要為媒體缺乏的新聞倫理與編輯自主負起監督責任。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: RSF 的主張為新聞自由仍須符合民主法治的規範。(A) RSF 並未主張媒體需為媒體亂象負起全責。(B)換照未通過，使因其違規情事較多，並非因為其社會功能不彰。(D)此會有言論審查的疑慮，民主國家不會做此種限制言論自由的行為。
