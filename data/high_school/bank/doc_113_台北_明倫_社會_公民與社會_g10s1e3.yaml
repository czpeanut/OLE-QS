  stem: 根據題文內容，下列敘述何者正確？
  options:
  - label: A
    content: 影片內容能讓民眾釐清家務輕重緩急，有利文化學習與傳承
  - label: B
    content: 看似沒問題的玩笑或言語可能會形成對他人僵化的刻板印象
  - label: C
    content: 教育部製作該廣告宣傳少子女化政策，有助於消除文化位階
  - label: D
    content: 文化歧視是文化接觸會正常發生的現象，接受差異才能共存
  group_stem: 教育部 YouTube 頻道 2023 年 9 月推出「0～6 歲國家一起養」宣傳廣告片，片中育有 2 名子女的男性拜託媽媽代收訂購的「公仔」包裹，卻被媽媽質疑當爸爸還玩「尪仔」，結果媽媽將費用挪去買「更有用的」育兒用品。許多網友認為此橋段暗示生小孩就必須犧牲自身興趣，且涉及對喜愛動漫公仔族群的歧視。對此，教育部立即下架影片並發表道歉聲明，表示影片本是要鼓勵更多年輕人願意結婚、生育小孩，但因腳本規劃思慮不周使民眾產生疑慮，深表歉意。
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此與文化學習與傳承無關。(C)此廣告有貶抑「公仔」的潛在想法，可能會加重文化位階，文化位階指由社會中掌握較多權力與資源的階層所決定，對於和自己不同文化位階者進行優劣排比，而產生階層化現象。(D)歧視侵害了生而為人的核心價值；僅因一個人的身分或信念而侵犯他的權利就是歧視，歧視行為不能包容。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 11
  stem: 行政院推動「300 億元中央擴大租金補貼專案計畫」的理念與下列哪一種社會安全制度最相似？
  options:
  - label: A
    content: 提供急難受災者經濟援助
  - label: B
    content: 調高農民保險的給付金額
  - label: C
    content: 增加婦女生育的育兒補助
  - label: D
    content: 針對低收入戶的急難救助
  group_stem: 政府為將經濟成長與全民共享，111 年 7 月正式實施「300 億元中央擴大租金補貼專案計畫」，全面減輕年輕人、新婚、育兒及弱勢家庭租屋負擔。為擴大照顧，於 112 年續辦租金補貼 2.0，推動多項簡政便民精進措施，如放寬年滿 18 歲以上的學生族及租屋民眾申請、隨到隨辦、舊戶直接帶入審查不用重新申請、租約無房東身分證號可申請、放寬房屋認定條件等。依據租屋所在地與租客是否有特殊身分等不同條件，提供每戶每月 2,000 元至 8,000 元租金補貼，其中單身青年、新婚家庭、育有未成年子女（胎兒）家庭、社會經濟弱勢家庭 4 類申請人可加碼補助。至 113 年 7 月底已受理逾 80 萬戶，核定補助達 60.7 萬餘戶，顯示補貼覆蓋率持續擴大，支持民眾減輕租屋負擔的成效顯著。114 年起再擴大租金補貼戶數，同時簡化申請流程，由地方政府主責審查，中央負責撥款，落實對全國租屋族的照顧。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 租金補貼為社會津貼之範疇，社會津貼為補充社會保險的不足，針對特定身分的人民提供定期或一次性的現金給付。例如：生育津貼、育兒津貼、托育補助等。(A)為社會救助。(B)為社會保險。(C)此為社會津貼，與題幹相同，為正解。(D)急難救助為社會救助。
