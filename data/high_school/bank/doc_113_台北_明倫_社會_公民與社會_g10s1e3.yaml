  stem: 2024 年 6 月德國新《國籍法》生效後，入籍程序簡化、讓外國人更易入籍。對於新的《國籍法》，德國總理蕭茲（Olaf Scholz）表明支持態度，他曾發言表態：「長期在德國生活和工作的人，應該成為我們國家的一分子，擁有所有相應的權利和責任。」新法囊括不少吸引移民、促進融合的內容，例如入籍申請者可擁有雙重國籍、取消客工和契約工原本入籍測試中的德語書寫能力筆試。但欲入籍者需承諾遵守德國《基本法》所規定的自由和民主的基本秩序，有種族主義、反猶太主義或仇外心理紀錄的人無法入籍，任何不認真履行及遵守「承諾德國特殊歷史責任」者，其德國護照將會被撤銷。根據題文，下列敘述何者正確？
  options:
  - label: A
    content: 外籍人士即使取得德國護照，其不具備國民身分，公民權利保障亦不完備
  - label: B
    content: 新法放寬外籍人士領取德國護照的程序，透過義務履行及遵守條件，有助於強化公民的國家認同
  - label: C
    content: 德國《國籍法》企圖以「承諾德國特殊歷史責任」的條款，實行族群同化
  - label: D
    content: 撤銷有傳播反猶仇恨言論之歸化國民的護照，為主權對外發生效力的展現
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)取得護照即意味具備國民身分，公民權利保障完整。(B)符合新國籍法的立法目的，為正解。(C)新國籍法並未要求移民者放棄自己的文化及語言，而是避免有偏激的意識形態而造成社會秩序混亂，不為族群同化政策。(D)應為對內主權效力的展現。
