  stem: 根據題文，哪一個說法最符合反向歧視論者的觀點？
  options:
  - label: A
    content: 積極性平權措施違反程序正義因此不能被正當化
  - label: B
    content: 優勢群體的自我發展機會不因差別待遇而受限制
  - label: C
    content: 公平正義的對待方式應根據不同人的身分而不同
  - label: D
    content: 比起積極性平權措施形式平等的考慮標準更合理
  group_stem: 美國哈佛大學基於《平權法案》設立「種族多元」招生政策，採取「種族配額」、「大學入學的性別配額」等措施，保障各族群都有一定比例能錄取大學。2014 年該政策遭「學生公平入學組織」指控為「反向歧視」（Reverse discrimination），訴訟案因此展開。2023 年 6 月底，美國最高法院裁定大學在招生政策中考慮種族因素，即「積極性平權措施」（Affirmative Action），違反了美國憲法第 14 條修正案的平等保護條款，且此裁定結果將適用於全美各個大學。「反向歧視」是指在資源與機會有限的情況下，政府給予特定群體政策上的優惠勢必將排擠其他群體（尤其是原本的優勢群體）享有同等資源的機會，而反向歧視論者在意的是「為什麼基於某個正當理由就可以排除其他人的平等權？」該如何正當化積極性平權措施所帶來的這種反向歧視難題，受到許多哲學家與法學家的關注。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 反向歧視是指在保障特定群體受到公平待遇之後，之前因為擁有固有優勢的群體因此受到了新的歧視或不公平待遇。因此其主張不應該基於不同身分而給予差別待遇，反向歧視者應該會主張無差別對待的政策，最適切的答案為(D)。
