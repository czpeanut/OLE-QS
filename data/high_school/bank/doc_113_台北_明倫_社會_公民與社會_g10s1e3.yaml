    content: 為防民眾遭拐賣至柬埔寨，警察在機場出境大廳向民眾宣導
  - label: B
    content: 為尊重喪失意思能力的高齡者，依其先前的意思決定未來的監護人
  - label: C
    content: 為照顧長者、孕婦與行動不便者，設置無障礙專用購票窗口
  - label: D
    content: 為鼓勵民眾搭乘大眾運輸，政府提供全時段票價優惠
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 羅爾斯的正義論強調實質平等，此依照事物本質作合理的差別待遇，即「對實質上相同的事物作相同處理；實質上不相同的事物，須依其特性做不相同的處理」。(A)(B)與平等無關。(C)針對這些族群給予差別待遇，屬於實質平等之範疇，為正解。(D)此為無差別對待的平等。
