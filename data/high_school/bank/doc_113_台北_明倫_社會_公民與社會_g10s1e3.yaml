  answer_status: verified
  answer_source: answer_key
  explanation: 針對不同群體給予加碼補助，屬於實質平等，此為依照事物本質作合理的差別待遇，即「對實質上相同的事物作相同處理；實質上不相同的事物，須依其特性做不相同的處理」，最適切的答案為(C)。
