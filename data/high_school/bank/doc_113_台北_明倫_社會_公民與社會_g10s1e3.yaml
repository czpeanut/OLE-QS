  stem: 「月經貧窮」（Period Poverty）指女性無法負擔生理用品費用且缺乏生理用品，因而身處劣勢的現象。許多低度開發國家的女孩因無法負擔或難以取得生理用品，導致生理疾病及心理健康、減損受教育機會。然而月經貧窮的爭議並非僅發生在低度開發國家，許多歐洲國家將女性生理用品視為「奢侈品」而課徵較高額的稅率，造成部分女性無法負擔生理用品。臺灣有團體呼籲衛生棉等女性生理用品也應與其他民生必需品相同免徵營業稅，而蘇格蘭議會已於 2020 年 11 月通過《生理期用品免費供應法》，規定地方政府有法律義務，以方便及有尊嚴的方式免費提供生理用品給任何有需要的人。根據題文，國內呼籲衛生棉免稅的團體所提出之主張與下列何種公平正義的思考最相關？
  options:
  - label: A
    content: 分配正義
  - label: B
    content: 程序正義
  - label: C
    content: 形式平等
  - label: D
    content: 實質平等
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)從題文「有團體呼籲衛生棉等女性生理用品也應與其他民生必需品相同免徵營業稅」可知這是為追求相同情形應相同處理的形式平等。
