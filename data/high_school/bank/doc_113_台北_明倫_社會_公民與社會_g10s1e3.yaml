  stem: 一篇文章中提到，「媒體可以改變大眾的消費習慣，為市場帶來龐大的利益；可以改變一場選舉的結果，干預整個國家的政策；更重要的是，它能操控社會群體的思想。」某資深記者在一場演講亦點出媒體的特性：記者的工作其實就在做輿論製造，在輿論製造的時代，從「真相」轉變到「資訊」，中間受到很多角力的影響，網軍只是一部分，還有記者、公關、行銷、政府、黑道、幕僚、企業……等等的參與。所有經過人們篩選、包裝的內容沒有所謂的「絕對客觀」，傳遞資訊的過程頂多只有「相對客觀」，不能期待新聞是絕對的公平與客觀。題文中對媒體問題的描述，下列何項推「不正確」？
