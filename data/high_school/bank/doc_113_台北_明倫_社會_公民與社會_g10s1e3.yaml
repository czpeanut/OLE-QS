- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺灣同志諮詢熱線協會於 2024 年 1 月發布《 2023 臺灣跨性別族群生活處境報告》，其中指出「使用公共廁所對許多跨性別者來說，充滿壓力與倍感困擾，32％跨性別者甚至直接選擇憋尿不如廁」。其原因主要是跨性別者無論選擇男廁或女廁，都會遭受社會大眾的質疑或困惑。若要針對前述狀況改善跨性別者的處境，保障跨性別者的多元身分認同，下列措施何者最能發揮效果？
  options:
  - label: A
    content: 鼓勵跨性別者使用無障礙廁所，避免遭受他人質疑眼光
  - label: B
    content: 改建部分廁所，設立專門提供跨性別者使用的廁所
  - label: C
    content: 推廣性別平等價值，讓大眾習慣與跨性別者共用廁所
  - label: D
    content: 推動空間去性別化，降低跨性別者選擇廁所的身心壓力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)跨性別者並非身心障礙者，反而會造成對跨性別者的錯誤認知。(B)讓跨性別使用專用廁所，反而會造成標籤化的情形。(C)(D)「性別友善廁所」不只是單純的將 2 種不同性別族群置入同個空間，必須認知到「去二元標籤化」以及「多元性別認同」的觀念，才能真的推動實質的性別友善。最適切的答案為(D)。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 我國媒體對於俄烏戰爭的報導，常見到俄國強勢侵略、烏克蘭奮勇抵抗與多國對其援助、俄羅斯受世界多國制裁等。但臺灣常見之美國 CNN 與福斯、英國 BBC、Skynews 等主要媒體的訊息亦有其立場，可能有缺少不同的報導角度，不利於臺灣人研判現勢發展的疑慮。就此反映出現代科技媒體的哪一項問題？
  options:
  - label: A
    content: 媒體推播相似報導給閱聽人，部分有價值的公共議題被忽略
  - label: B
    content: 媒體充斥假訊息，讓民眾無法分辨事實以致以行使近用權
  - label: C
    content: 資訊來源太過侷限，易使主流媒體價值左右公共意見的形成
  - label: D
    content: 有些報導未能被看見，形成數位落差並影響公民參與的機會
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹「主要媒體的訊息有其立場，可能有缺少不同的報導角度。」可推知資訊的來源及報導立場過於單一，然後導致民眾的價值受到主流媒體的影響甚多，最適切的答案為(C)。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「多元文化政策」的用意並非只有行為上表示欣賞或尊重群體差異，而是藉由公共政策的資源分配力量，促進不利群體的文化發展與平等參與社會的權利。下列何者最能突顯題文所述的相關政策？
  options:
  - label: A
    content: 政府在工業區內興建國際移工宿舍提供移工舒適安全的居住環境
  - label: B
    content: 政府補助社區大學授課鼓勵文史工作者研究社區或部落發展歷史
  - label: C
    content: 政府立法將臺灣各族群自然語言及手語皆納為國家語言並列入中小學課程
  - label: D
    content: 政府透過 BOT 方式獎勵企業興建具原民風格的渡假村振興觀光產業
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)與發揚多元文化的目的無直接關聯。(B)文史工作者研究的部落發展史研究不一定與多元文化有關。(C)將各族群語言及手語納入中小學課程，可以落實以語言傳承文化等目標，為正解。(D)興建渡假村反而會破壞原住民的文化。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 為了突顯角色特性，在臺灣電影中原住民往往被形塑成愛吃檳榔、愛喝酒、喜歡打赤腳跑步、喜歡彈吉他唱歌，然而並非所有原住民都如電影中所形塑的模樣，有些原住民甚至因為與對原住民的刻板印象不符而被質疑「不像原住民」。下列有關電影劇組對原住民角色設定之敘述，何者正確？
  options:
  - label: A
    content: 電影劇組對原住民角色設定帶有種族主義色彩易造成族群衝突
  - label: B
    content: 電影劇組以漢人觀點詮釋原住民角色是對被統治者的文化侵略
  - label: C
    content: 電影中的角色設定可能加深對原住民族的刻板印象造成微歧視
  - label: D
    content: 電影劇組消費原住民族文化以賺取高額報酬刻意製造文化衝突
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為刻板印象之展現，不為種族主義之內涵。種族主義為有些人們會因種族優越感的偏差觀念，採取激進或暴力的手段來達成排除異類之目的，危害到他人生命財產的安全。(B)此不符合文化侵略的內涵，文化侵略指一個強勢國家透過武力或是經濟優勢、科技媒體等資源擴張自身的文化意識和價值觀，間接或直接改變、取代其他地區的思想和文化型態。(C)此行為可能會造成微歧視。微歧視的「微」並非指歧視類型微小或是歧視不存在，而是與對特定族群造成「傷害」的言語有關，為正解。(D)強化刻板印象的目的並非賺取高額報酬。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 教育部線上辭典因編修年代較早，許多詞條被批評不合時宜，在立委要求下，國教院建立常態性檢修詞條機制，邀集專家學者討論涉及性別平等議題的詞條。例如將外祖父、外祖母、外公、外婆等，加註「今亦稱祖父、祖母、阿公、阿嬤」，不用再有內外之分。但對此稱呼的改變並未能引起共鳴，甚至許多民眾更認為多此一舉。請問造成政府與民眾間的落差，其主要原因可能與下列哪一現象相同？
  options:
  - label: A
    content: 原住民族自治法在立院卡關多年遲遲未通過
  - label: B
    content: 民法修正由父母約定從父姓或母姓但仍以父姓居多
  - label: C
    content: 政府積極爭取加入國際組織卻頻頻受到阻礙
  - label: D
    content: 民法設有剩餘財產差額請求權肯定家務勞動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文須選出「政府與民眾間價值觀的落差」，最適切的答案為(B)從父系源自於為長久以來的父系社會思維，短時間要改變並非易事。(A)(C)(D)選項不符合提問。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 大雄為了完成一篇有關社會安全制度的報告，對社區的長者進行訪談，以下是訪談的部分內容：「我已經老了，最近發現走不太動，（<u>甲）幸虧政策提供專業居家與社區照顧、交通接送等措施</u>，真的解決許多問題。而且（<u>乙）政府開辦國民年金制度</u>，讓我不用太擔心未來日常生活的花費，另外，（<u>丙）每月領取低收入戶生活扶助費</u>，日子還算馬馬虎虎過得去！」請問上述(甲)(乙)(丙)畫底線處的內容，依序分別是哪一種性質的社會安全制度？
  options:
  - label: A
    content: 福利服務、社會保險、社會救助
  - label: B
    content: 社會救助、社會津貼、福利服務
  - label: C
    content: 福利服務、社會保險、社會津貼
  - label: D
    content: 社會救助、福利服務、社會津貼
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(甲)居家與社區照顧為福利服務項目；(乙)國民年金屬於社會保險；(丙)低收入戶生活扶助費屬於社會救助。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 2024 年，《華爾街日報》所屬「新聞集團」（News Corp）與人工智慧新創公司 OpenAI 達成協議，授權 OpenAI 利用其新聞內容回答用戶的查詢並培訓生成技術，象徵科技和新聞二大領域的歷史性合作，預估 5 年內交易價值可能超過 2.5 億美元。新聞集團的執行長表示，與其被無情的科技浪潮掃進歷史，新聞業應採取不同做法，此協議代表優質新聞具高價值，當 ChatGPT 用戶查詢時，將提供資料來源及完整文章連結，OpenAI 也可利用專業新聞內容建構大型語言模型。根據題文，下列何者最能說明新聞媒體的所有權及運作特色？
  options:
  - label: A
    content: 為求客觀與公正，新聞媒體應避免高度集中化
  - label: B
    content: 傳播媒體是營利事業，在市場競爭中求生存發展
  - label: C
    content: 精進 AI 的產出技術，可強化媒體再現的不平等
  - label: D
    content: ChatGPT 附有文章連結，置入性行銷影響閱聽人
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)與題幹敘述無關。(B)商業媒體為謀求利潤，避免被人工智慧取代，因與其合作，善用人工智慧擴展媒體的事業版圖，為正解。(D)此為置入性行銷無關，置入性行銷指刻意將行銷事物以巧妙的手法置入既存媒體，以期藉由既存媒體的曝光率來達成廣告效果。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 為強化職場性騷擾防治機制，我國政府推動《性別工作平等法》修法，修正名稱為《性別平等工作法》。新法於 2023 年 8 月公布施行，修法的重點包括：強化雇主防治意識及責任、政府與雇主協力被害人之保護與扶助、處罰性騷擾之負責人、建立公權力介入的外部申訴管道。下列關於此次修法的敘述何者正確？
  options:
  - label: A
    content: 雇主需提高性騷擾防治意識，預防公司未來發生類似事件，符合轉型正義
  - label: B
    content: 提供保護扶助管道，讓被害者能有較多資源爭取自身權益，符合分配正義
  - label: C
    content: 最高負責人的權力最大，針對負責人提高罰則符合積極性差別待遇精神
  - label: D
    content: 建立外部申訴管道，以公正程序收集必要資訊，目的在強化程序正義
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為匡正正義。(B)此為積極性差別待遇之做法。(C)此不為積極性差別待遇之做法，積極性差別待遇指個體處於不利的情況，政府應該積極地介入，給予特別優厚的待遇，透過一套完善的補償計畫或策略，以減少文化不利與文化剝奪，造成弱勢者與一般者程度上的差異。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 2024 年新一屆立法院多了幾位形象近似「網紅」的立委，開直播、拍攝短影音，積極經營社群，將網路上的支持聲量化為選票。立委甲表示：「以前在立法院要搶麥克風，發表意見要靠媒體報導，在可能只有一分鐘的時間內要想辦法發揮得淋漓盡致。現在，我對粉絲有無限話語權，他們對我有信任感、願意花時間聽我完整說出想法，並幫我擴散出去。」立委乙說：「每週固定直播，利用多機拍攝在 YT、IG、FB、TikTok 共 4 個平臺放送，比照政論節目開放 call-in、接受網友指教，並當場認錯修正，每次約與 3,000 名網友互動，這是跑攤再用力也很難碰到的選民數。」依據題文資訊，這些利用 YT、IG 等新型態媒體工具的立委認為其對公共生活參與的影響為何？
  options:
  - label: A
    content: 藉由新型媒體工具，讓支持者可突破同溫層效果
  - label: B
    content: 利用使用者的偏好篩選，推播更多元開放的訊息
  - label: C
    content: 數位傳播的即時性，容易出現錯誤與不實的內容
  - label: D
    content: 擴大公共參與人數，強化資訊傳播的速度及範圍
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹科技媒體可讓立委有更多元的管道傳達自己的想法，也讓民眾可以接觸民意代表，最適切的答案為(D)。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 某國舉行地方選舉，其中某縣長候選人認為開票過程有瑕疵，因此提出當選無效之訴，堅持全面驗票，讓真相能水落石出。該縣選委會委任律師表示，若有具體違法事證皆會配合勘驗，不過選務人員皆依照工作手冊辦理選務，縱使有部分人員因便宜行事造成疏失，應不致影響最終選舉結果。下列選項涉及的公平正義議題，何者與題幹「不同」？
  options:
  - label: A
    content: 為減輕家長經濟負擔育兒津貼取消排富條款
  - label: B
    content: 透過非法手段取得的證據在法庭上不得被採納
  - label: C
    content: 入學面試前負責審查的教授與考生私下會面
  - label: D
    content: 評審得知親戚的小孩為考生而申請迴避審查
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)(D)之敘述與題幹皆提及程序正義的議題。(A)取消排富條款屬於資源分配的範疇，與題幹不同。
- id: doc_113_台北_明倫_社會_公民與社會_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 2019 年，英法等 22 國大使遞交聯署信函給聯合國人權理事會，呼籲中國停止在新疆以「再教育營」拘押多達上百萬的維吾爾人及其他少數民族穆斯林。中國表示這些機構是「職業技能教育培訓中心」，用來幫助民眾遠離極端主義並重新融入社會，已使新疆人民的幸福感大幅提升。同時中國也表達強烈不滿，反控這些信函枉顧事實，且將人權問題政治化；中國強調新疆事務純屬中國內政，不容任何國家和外部勢力干預。請問中國以主權的何種特點，主張其推動新疆政策的正當性？
  options:
  - label: A
    content: 中國主權受國際承認，有權與他國發展平等外交關係
  - label: B
    content: 主權包含了一個對其領土範圍內進行治理的最高權力
  - label: C
    content: 中國依其主權有責任保障新疆民眾的各項公民權利
  - label: D
    content: 中國人民是主權的擁有者，新疆政策應根據中國民意
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 中國提及新疆事務屬於中國內政，強調主權的對內最高性，最高性指的是主權是不受限制的，是一種最高無上權力，最適切的答案為(B)。
