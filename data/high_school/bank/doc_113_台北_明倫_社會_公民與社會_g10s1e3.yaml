  stem: 有感於「長輩群組」中錯誤資訊氾濫，一名民間工程師開發了一款對話機器人「美玉姨」（「每」當「遇」到謠言的諧音）。民眾只須將機器人加入通訊軟體群組中，機器人便會在民眾收到訊息後，將訊息與資料庫內容進行比對，偵測哪些訊息屬於假訊息，並即時提供相關資訊闢謠，使錯誤資訊得以被即時更正，避免更多民眾接受到錯誤資訊。下列有關「美玉姨」對話機器人之敘述，何者正確？
