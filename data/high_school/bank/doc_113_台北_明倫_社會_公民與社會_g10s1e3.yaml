  stem: 題文中的宣傳廣告遭批評用輕視的眼光來看待不同族群，此問題與下列何種概念最為相符？
  options:
  - label: A
    content: 我族中心主義
  - label: B
    content: 文化相對主義
  - label: C
    content: 多元文化主義
  - label: D
    content: 文化霸權主義
  group_stem: 教育部 YouTube 頻道 2023 年 9 月推出「0～6 歲國家一起養」宣傳廣告片，片中育有 2 名子女的男性拜託媽媽代收訂購的「公仔」包裹，卻被媽媽質疑當爸爸還玩「尪仔」，結果媽媽將費用挪去買「更有用的」育兒用品。許多網友認為此橋段暗示生小孩就必須犧牲自身興趣，且涉及對喜愛動漫公仔族群的歧視。對此，教育部立即下架影片並發表道歉聲明，表示影片本是要鼓勵更多年輕人願意結婚、生育小孩，但因腳本規劃思慮不周使民眾產生疑慮，深表歉意。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 宣傳廣告的概念屬於(A)我族中心主義，即是以自己熟悉的文化模式做為衡量其他文化的標準。只要不符合自己文化的觀點，就是不好的文化。
