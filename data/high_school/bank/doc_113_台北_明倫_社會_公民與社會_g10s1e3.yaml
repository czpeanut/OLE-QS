  stem: 依《紀念日及節日實施辦法》，具法定原住民身分之學生，得就原住民族委員會公告其所屬族群歲時祭儀擇 1 日放假。然而僅 1 日的假期長度，遠不能符合真實需求。而許多族群、宗教有重要祭典或活動，學生要參與通常只能請事假。政治大學在 2023 年首創增訂多元文化假，並增加歲時祭儀假至 5 天。臺灣大學亦於 2024 年正式通過請假辦法修正，將歲時祭儀假增為每學期至多 4 天，另也新增每學期至多 2 天的多元文化假，不限自身所屬族群。有關「多元文化假」的目的，下列敘述何者正確？
