- id: doc_111_台南_台南二中_數學_數乙_g12s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列選項中，請選出隨機變數 X 是「二項分布」的選項。
  options:
  - label: A
    content: 10 題五選一的單選題，每題皆隨意選擇 1 個選項作答，隨機變數 X 表示答對的題數
  - label: B
    content: 10 題五選二的多選題，每題皆隨意選擇 2 個選項作答，隨機變數 X 表示完全答對的題數
  - label: C
    content: 擲一枚兩面皆為人頭的硬幣 10 次，隨機變數 X 表示出現人頭的次數
  - label: D
    content: 袋中有相同的黑球 2 顆、白球 2 顆，從袋中一次任取 1 球，取球後不放回袋中，稱為一次試驗。隨機變數 X 表示重複此試驗 3 次後，取出黑球的次數
  - label: E
    content: 袋中有相同的黑球 2 顆、白球 2 顆，從袋中一次任取 2 球，取球後放回袋中，稱為一次試驗。隨機變數 X 表示重複此試驗 3 次後，兩球同色的次數
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵X～B$\left( 10 , \frac{1}{5} \right)$

    ∴隨機變數 X 是二項分布

    (B)○：∵每題答對之機率為$\frac{C_{2}^{2}}{C_{2}^{5}}$＝$\frac{1}{10}$

    且 X～B$\left( 10 , \frac{1}{10} \right)$

    ∴隨機變數 X 是二項分布

    (C)╳：伯努力試驗需只有 2 種可能的結果

    (D)╳：伯努力試驗需在完全相同的情況下

    取球後需放回袋中

    (E)○：∵從袋中任取 2 球，取後放回

    兩球同色之機率為$\frac{C_{2}^{2}+C_{2}^{2}}{C_{2}^{4}}$＝$\frac{1}{3}$，且 X～B$\left( 3 , \frac{1}{3} \right)$

    ∴隨機變數 X 是二項分布

    故選(A)(B)(E)'
