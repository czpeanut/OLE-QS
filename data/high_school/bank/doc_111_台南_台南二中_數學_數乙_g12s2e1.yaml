  answer_status: verified
  answer_source: answer_key
  explanation: '點數和為 9 之情形如下：

    6＋3，5＋4，4＋5，3＋6

    其機率分別為$\frac{1}{6}\times \frac{1}{6}$＝$\frac{1}{36}$，$\frac{1}{6}\times \frac{1}{6}$＝$\frac{1}{36}$，$\frac{1}{6}\times \frac{1}{6}$＝$\frac{1}{36}$，$\frac{1}{6}\times \frac{1}{6}$＝$\frac{1}{36}$

    由上可知，出現點數和為 9 的機率為$\frac{1}{36}+\frac{1}{36}+\frac{1}{36}+\frac{1}{36}$＝$\frac{1}{9}$

    ∴E（X）＝$162\times \frac{1}{9}$＝18

    σ（X）＝$\sqrt{Var( X )}$＝$\sqrt{162\times \frac{1}{9}\times \frac{8}{9}}$＝4

    故數對（E（X），σ（X））＝（18，4）'
