- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某專題報導指出，臺灣星巴克咖啡被視為一種時尚跟品味的象徵，反觀中國的星巴克咖啡售價更是榮登全球最貴，以中杯拿鐵為例，美國一杯要價98元新臺幣，占一般民眾千分之一的月薪；而中國一杯則要價130元新臺幣，占一般民眾百分之一的月薪，但是星巴克還是生意興隆，不斷在中國擴展分店。請問：依據上述報導可以作出什麼推論？
  options:
  - label: A
    content: 中國大陸人民的文化資本在增加
  - label: B
    content: 中國大陸權力菁英人數多於臺灣
  - label: C
    content: 中國大陸認為美國文化位階較高
  - label: D
    content: 中國大陸人民間的貧富差距大
- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2019年香港反送中事件後，開始有大量的香港富豪準備移民或轉移資產。其中瑞士銀行的「世界億萬富豪人口調查報告」指出，香港淨資產逾3,000萬美元的超級富豪人數，但其中近半數的財富來自繼承，都是「富二代」、「富三代」。起因為在60、70年代是香港經濟起飛時期，第一代富豪在傳統行業有大量致富的機會，但香港經濟成長趨緩後，傳統行業的發達機會隨之減少，但在新興行業上，特別是IT、互聯網等，仍有發達的機會。關於上述，請問：下列何者敘述推論正確？
  options:
  - label: A
    content: 香港的第一代富豪多由資訊產業致富
  - label: B
    content: 香港的社會流動具有結構流動的特色
  - label: C
    content: 「富二代」、「富三代」屬於代間流動
  - label: D
    content: 階級複製使香港人不再可能白手起家
- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在上完哆啦A夢公民老師選修一課程後，四位同學在班上討論現今社會階層與流動的情況，請問下列哪一位同學的推論觀點較為正確？
  options:
  - label: A
    content: 大雄：我認為社會職業結構的變遷有助於全體人民向上流動
  - label: B
    content: 靜香：我認為高階層家庭的子女較容易出現向上的代間流動
  - label: C
    content: 小夫：我認為財富多寡對社會流動的影響大於政治權力多寡
  - label: D
    content: 胖虎：我認為社會開放程度是個人能否改變階層的先決條件
- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 現今108新課綱強調自主學習與多元表現的重要性，使才藝學習越來越受重視，但某報導指出僅有1成6的弱勢孩子有學習才藝，低於一般孩子的3成，對弱勢家庭來說，經濟壓力已讓他們喘不過氣，即使想送孩子去學才藝或補習加強多元表現，但在開學費用繳不出、文具買不起的情況下，讓孩子學才藝、補習成為遙不可及的夢想，讓人擔憂新的教育政策是否會導致貧富差距問題的延伸。關於上述報導內容，請問可推論出何種結論？
  options:
  - label: A
    content: 弱勢家庭出身的孩子註定成為階級複製的犧牲者
  - label: B
    content: 弱勢家庭孩子可透過十二年國教改變其社會地位
  - label: C
    content: 學才藝或上補習班，是家庭代間流動的必要途徑
  - label: D
    content: 經濟資本的多寡經常是能否累積文化資本的基礎
