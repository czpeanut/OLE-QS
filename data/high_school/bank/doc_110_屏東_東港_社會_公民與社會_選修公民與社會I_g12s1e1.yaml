- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下表為2020年疫情過後，東太國與西太國兩國依「五分位數法」將全國家庭依所得多寡排序後，再將全部戶數分為五等分的資料。請根據資料判斷下列哪些敘述最為符合2020年兩國的社會現象？
  options:
  - label: A
    content: 東太國最高20%家庭所得組為最低20%家庭組的53倍
  - label: B
    content: 東太國的經濟不平等現象較月亮國為嚴重
  - label: C
    content: 西太國最高20%家庭所得組為最低20%家庭組的7.2倍
  - label: D
    content: 西太國最高所得組與最低所得組的倍數較小，表示所得分配較平均
