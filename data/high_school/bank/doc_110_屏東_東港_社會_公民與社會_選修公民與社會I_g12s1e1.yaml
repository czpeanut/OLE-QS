  stem: '日本大學教授以COVID-19疫情與《身心障礙者權利公約》（CRPD）間的關係為主題探討，其認為COVID-19疫情對身障人權是個挑戰。根據CRPD第11條，在緊急狀況時應採取所有必要措施，讓身心障礙者獲得保障及安全。而有四項內涵是必須優先確保的：使身心障礙者能取得疫情與防止病毒傳播的資訊、持續取得支持和社區服務、平等地獲得健康照護、身心障礙者退休金與社會福利在任何時候獲得保障。 聯合國也曾提出，CRPD的核心在平等及反歧視，CRPD在各國推動時，保護身障者權利是最重要的目標，要尊重個別差異、注意障礙是否完全排除。人權沒有終點，需要持續才能達成目標。 我國伊甸基金會表示，21世紀的人權推動中，CRPD是最重要的發展之一。伊甸創立以來，堅信身心障礙者與眾人一樣，享有自由發展生活的權利，並透過政策倡導，積極實踐人權為基礎的社福政策服務。伊甸基金會也舉辦實踐工作坊，能與實務工作者、學界、政府部門共同討論，使身心障礙者人權與福利全面實踐。

    47. ( )根據日本大學教授的探討，下列敘述何者正確？'
