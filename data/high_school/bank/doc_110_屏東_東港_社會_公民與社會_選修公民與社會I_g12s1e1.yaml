- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 4
  stem: 日本東大學生說：「在進入東大前，我考上明星私中。而考上後為贏過同儕，課後繼續補習，這些都得花錢。往後為人父母，我會運用更好的資源，培育下一代進入東大。」我國臺大學生說：「我的同學絕大多數來自明星公私立高中。而我從小就補英文和數學，有多餘時間就學樂器。因為這樣我在申請學校時才能加分。」根據上述，判斷下列何者正確？
  options:
  - label: A
    content: 成為東大學生得花許多錢，所以必須要撥出時間打工賺錢
  - label: B
    content: 從小就要補習，並學習多樣樂器，才能成為一名臺大學生
  - label: C
    content: 依東大學生所述，階級複製在其與子女兩代間將更加鞏固
  - label: D
    content: 只有就讀公私立明星高中的學生，才有機會進入臺大就讀
- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 4
  stem: 一位企業主說，其向銀行借錢是非常容易的，反觀窮人向銀行借錢，條件既難符合，利息也高。但政府提供的紓困方案，對像是社會經濟弱勢，則不應在程式上，排擠可能需要紓困的族群。依據上述，判斷下列何者正確？
  options:
  - label: A
    content: 因企業主的先賦地位較高，所以向銀行借錢較容易
  - label: B
    content: 銀行借貸與政府紓困皆是借錢給民間，其意義相同
  - label: C
    content: 窮人不易向銀行借到錢，乃因窮人無法接受高利息
  - label: D
    content: 為實現紓困意義，方案流程不該讓申領人感到困窘
- id: doc_110_屏東_東港_社會_公民與社會_選修公民與社會I_g12s1e1_s1_16
  section: 1
  number: 16
