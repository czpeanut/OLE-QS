  stem: '一名單親媽媽因壓力大，勒斃兩名幼子，隨後自殺未遂，遭法院判處死刑。法官認為：該女子極端惡劣，滅人性，不判處死刑，有違天理，判決結果引兩方的論戰：辯護律師、立委、婦女團體及民眾認為，法官的尖銳言詞未能考慮單親媽媽在社會上缺乏支持與飽受歧視的處境：另一方則認為，殺害沒有自衛能力的幼年子女，就該施以重刑，如真想突破困境，未必沒有出路。 此案件中，最令人爭議的就是母親這個角色。「怎麼有母親會下此狠手？」此與我們想像中母親所應扮演的功能和角色衝突。這反映出母親是一個被賦予特定想像和任務的角色，這個角色有至高無上的優先性，生命裡其他面向都不應超越。一個努力的正常人，應要盡畢生之力達成母親這個優先使命，不論遇到任何問題都不能放棄。 在社會大眾眼中，此案件的邪惡程度之所以高，不只因犯罪本身，更因當事人是一個背棄被性別化的自身任務的母親，這是父權社會無法容忍的。在評價此案當事人時，不論是法官言詞或輿論，皆透露出隱晦卻真實存在的厭女情結，這套機制其實比我們想像中更廣泛地在父權社會中。

    49. ( )如果你是本文作者，最可能想表達下列何種看法？'
