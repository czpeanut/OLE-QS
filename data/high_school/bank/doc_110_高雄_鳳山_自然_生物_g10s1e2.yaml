- id: doc_110_高雄_鳳山_自然_生物_g10s1e2_s3_51
  section: 3
  number: 51
  type: single
  page: 7
  stem: 下列有關正常酵母菌「葡萄糖抑制作用」的敘述，何者正確？
  options:
  - label: A
    content: 缺氧條件下，會抑制酒精發酵的進行
  - label: B
    content: 會使得雜菌滋生
  - label: C
    content: 會抑制酵母菌使用葡萄糖
  - label: D
    content: 有丙酮酸的形成
  group_stem: ◎ 【文章一】為什麼酵母菌不想發酵？ 酵母菌在有葡萄糖存在的時候，只會利用葡萄糖，這個現象稱為「葡萄糖抑制作用」。如果環境中只有葡萄糖，但氣氣不足時，酵母菌為了生存，會利用丙酮酸進行酒精發酵，產生乙醇與二氧化碳，然而在某些「發酵停滯」的狀況下，酵母菌不會受到葡萄糖抑制作用的影響，即使環境中存在葡萄糖，酵母菌仍會轉而利用其他碳源。在這樣的狀況下，雖然酵母菌照常生長，但是並未進行發酵作用，而其他的細菌也跟著一起生長，於是發酵就失敗了。 研究發現這種發酵停滯的現象，是因為酵母菌內一個稱為[$GAR^{＋}$]的普利昂蛋白所引起。「GAR」是「對葡萄糖抑制作用有抵抗力」的意思，而大寫及中括號，則分別代表了這是顯性和非孟德爾遺傳。 分析發酵停滯的培養液可以發現，其中不只有酵母菌，也含有大量的其他細菌，但發酵成功的培養液中，絕大部分的微生物都是酵母菌，因此以競爭的角度看，優先取用葡萄糖是有利的。某些種類的細菌（如葡萄球菌Staphyloccus gallinarium）會引發酵母菌內的[$GAR^{＋}$]普利昂蛋白，使酵母菌轉而利用其他碳水化合物，不再利用葡萄糖，發酵作用也因此減緩，培養液內酒精濃度的上升速度也隨之變慢，這使其他細菌在較佳的生長環境中能夠存活，同時酵母菌仍可維持繼續生長。研究發現，[$GAR^{＋}$]的酵母菌，較原來的酵母菌更耐酒精，也更能夠在養分不足（低胺基酸）的環境下生存，所以可以說那些細菌跟酵母菌已經達成互利共生了！此外，如果通入大量氧氣，酵母菌利用糖的量會減少而且發酵作用會受到抑制，這稱為巴斯德效應。《摘自CASE報科學，為什麼酵母菌不想發酵？，2014，葉綠舒》 試根據上文回答下列問題：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
