  stem: 我國《民法》對於子女姓氏應從父姓或母姓的規定，歷經數次修正，由原先「子女應從 父姓」，改成可以父母書面約定子女姓氏；但目前依據內政部調查顯示，絕大多數的 子女仍以從父姓為主。下列哪一個論點最能用來說明此一現象？
  options:
  - label: A
    content: 法律未強制子女從父姓，係因社會習慣與法律具有一致性
  - label: B
    content: 因習慣法的效力優先於法律規定，故此現象合乎法律要求
  - label: C
    content: 社會大多數人重視家庭倫理，認為家庭是社會規範的基礎
  - label: D
    content: 社會傳統風俗習慣形塑了人們的行為，其影響比法律更強
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e3_s1_2
  section: 1
