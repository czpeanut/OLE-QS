  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 《 《人民團體法》長期以來都被視為是用來箝制公民社會，壓制人民集會結社自由的惡法，例如有團體因為不想面對種種行政限制，放棄成立「社團法人」，改成立「基金會」，只不過基金會所被要求的資產金額，也逐年提高，若經營不善還要將基金充公，使其陷入進退兩難的結局。請問：上述現象的最佳解決方法應該是？
  options:
  - label: A
    content: 落實政府審核機制，使團體成立能夠名實相符
  - label: B
    content: 採用登記制，團體只須完成登記就能成立運作
  - label: C
    content: 提高基金會經營門檻，藉此促進社團法人發展
  - label: D
    content: 不再核准基金會成立，以後只可成立社團法人
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 立法院內政委員會初審通過「集會遊行法修正草案」，將名稱變更為「集會遊行保障法」，由原本「許可制」改為「自願報備制」，並取消現行法之罰則；但其中包括是否設置禁制區（不能集會遊行的區域）、和授予警方命令解散權等，因各黨團無共識，保留送交朝野協商。從上述可看出，下列何者為最能充分、完整保障集會自由的關鍵，也是各團體無法形成共識的爭點？
  options:
  - label: A
    content: 法案的名稱是否有多加保障兩個字
  - label: B
    content: 自行集會是否仍需要獲得當局許可
  - label: C
    content: 立法院各黨團是否有達成朝野協商
  - label: D
    content: 禁制區與命令解散的條文是否刪除
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
