  type: calc
  page: 3
  stem: '隨著網路科技發展，線上下注的新興博奕模式也在國內風行。依現行《刑法》第266條第1項「普通賭博罪」之規定：「在公共場所或公眾得出入之場所賭博財物者，處一千元以下罰金。」 小楊認為以往傳統的賭博場所皆是賭客穿梭其中，使用實際賭具進行賭博的實際地點，即占有實際空間體積的實體，且可透過人的知覺直接感受其存在的空間，故除非修改現行普通賭博罪中有關「場所」的構成要件，否則行為人利用電腦網路上網賭博，應不成立普通賭博罪。 但小豪認為不能因賭博新興管道為網際網路，便因此大開賭博的方便之門，讓在網路上賭博之人，享有不受《刑法》處罰的特權，網際網路縱屬虛擬空間，也仍是不特定的網友們得任意出入之「場所」，故主張應可成立普通賭博罪。

    以罪刑法定主義內涵來判斷，兩人主要的爭執點應該會是哪一項，並加以說明？（3分）'
