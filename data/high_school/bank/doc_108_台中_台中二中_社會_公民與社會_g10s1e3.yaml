  - label: C
    content: 內政部在立法院沒有授權的情況下，訂定限制役男出境的辦法
  - label: D
    content: 警察為了攔停逆向行駛的車輛，當下選擇直接開槍射破其輪胎
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 某大學生不滿教授的授課與評量方式，所以在網路上發文公開批評教授教學不力，並經常盜取學生成果，結果遭到教授提告誹謗。依《刑法》第310條規定：「<u>意圖散布於眾，而指摘或傳述足以毀損他人名譽之事者</u>，為誹謗罪，處1年以下有期徒刑、拘役或500元以下罰金。<u>散布文字、圖畫犯前項之罪者</u>，處2年以下有期徒刑、拘役或1,000元以下罰金。對於所誹謗之事，能證明其為真實者，不罰，但涉於私德而與公共利益無關者，不在此限。」請問：法官在適用法律審理本案時，最可能出現何種情形？
  options:
  - label: A
    content: 此條文本身清楚明瞭所以直接適用無須解釋內容
  - label: B
    content: 學生的行為只要與公共利益無關就有機會免罰
  - label: C
    content: 認定學生罪名成立且合併處以1,500元罰金
  - label: D
    content: 若能確認學生行為與畫底線內容相符就可定罪
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
