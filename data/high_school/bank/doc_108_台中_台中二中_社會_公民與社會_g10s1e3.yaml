  stem: 2015年爆發了大統、頂新等食安事件後，立法院立即通過對《刑法》的修正案，將沒收變成一個獨立的法律效果，可以單獨宣告，未來除了犯罪的個人外，包括自然人、法人或民間組織、基金會等，只要是惡意或因犯罪取得的獲利，均可沒收，以防止犯罪者蓄意脫產避罪。有關我國法律修正，下列程序何者正確？
  options:
  - label: A
    content: 修正法案一旦經立法院三讀通過後將立即生效
  - label: B
    content: 法律修正案由大法官宣告違憲，立法院進行修改
  - label: C
    content: 行政院院長經總統核可，可以向立法院提出要求重新修改法條
  - label: D
    content: 由程序委員決定將此修正案排入議程討論
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
