  type: calc
  page: 3
  stem: '以下節錄自我國某立委對於毒品犯罪的看法： 毒品犯罪的重刑化政策已經實施很多年，可是只看到監所人滿為患，監所人員肩負沉重的戒護壓力，沒有餘力做矯治，更無力協助受刑人回歸社會。<u>司法介入除了把人關起來眼不見為淨外，沒有任何實際效用，還讓這些藥癮者的學業、工作以及原有的社交網絡與正常社會生活被迫中斷，更加深他們復歸社會的困難，最終難以擺脫對毒品的心理依賴，甚至可能因為毒癮的衍生犯罪，而變成社會的危險來源。</u> 因此我提出「施用毒品罪醫療前置化」的修法草案，希望能讓這些單純施用毒品的藥癮者在進入司法程序前，先按時到醫療機構接受藥癮治療的計畫，如果能夠順利完成治療程序，就不用被送入矯正機構而中斷他原本的生活；反之，若無法完成治療程序，仍然要依照現行原有的司法程序，進入矯正機構接受觀察勒戒、強制戒治等司法處遇。

    就畫線部分是現行的毒品犯罪政策，以刑罰目的來說明該立委對現行毒品犯罪政策的主要批評

    （2分）'
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e3_s1_40
  section: 1
  number: 40
  type: calc
  page: 3
  stem: '徐自強與黃春棋、陳憶隆、黃銘泉等人被控於1995年間共同綁架、殺害富商黃春樹；其後黃銘泉潛逃泰國遇害死亡；黃春棋、陳憶隆及徐自強3人於2000年被最高法院判決死刑定讞。 徐自強是否涉案疑點重重，當時法院僅憑黃春棋、陳憶隆的共同被告自白作為唯一證據；但根據徐自強自白的不在場證明，徐自強案發當天在龜山郵局提款，有監視器證明，中午回到媽媽家吃飯，有證人可作證，下午在桃園市區租車，有租車單可以證明。不過，法院一審到更五審均不採信徐自強的不在場證明。監察院2000年間曾作調查報告，指出案情有諸多疑點，希望法院能重啟調查。 徐自強律師團2003年間聲請釋憲，大法官做出釋字第582號解釋，認為「共同被告的自白必須經過證人詰問對質程序，且不能將自白當成有罪認定的唯一證據。」徐自強在大法官釋憲後獲得單獨更審的機會。2009年，更六審仍判處徐自強死刑；更七、八審從死刑改為無期徒刑。2012年5月19日，徐自強受惠速審法，在未定讞的狀況下，被告不得羈押超過8年，因此獲釋，被羈押16年的徐自強終於離開看守所。 本案檢察官最主要是以原審同案被告黃春棋、陳憶隆2人於司法警察詢問、檢察官訊問的供述內容認定被告徐自強共同犯罪；但合議庭認為，黃春棋以及陳憶隆的訊問供述，未經具結，欠缺可信情況，均不具有證據能力。更九審開庭期間，黃春棋拒絕作證，陳憶隆雖然有作證，有說出部分證言，但合議庭認為陳憶隆證詞充滿矛盾，欠缺其他補強證據，不具有證據力，此外，檢察官其他的舉證，均不足以認定徐自強共同犯案，因此基於無罪推定原則，改判徐自強無罪。

    發揮你的辦案精神，從上文中找出徐自強獲判無罪的理由（3分）

    <u>答案公佈表</u>

    臺中市立臺中第二高級中等學校'
