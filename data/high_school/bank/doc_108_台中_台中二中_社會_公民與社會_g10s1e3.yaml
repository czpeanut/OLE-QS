  stem: 在發生普通過失致人受傷的事件時，對於傷者有意義的法律救濟，其實就是損害的填補。把對方判刑，不但對被害人無意義，對國家也很少有犯罪預防的意義，只是增加有前科紀錄的人民而已。由於多數人都很難擔保自己一生，不會因為一個疏忽造成他人傷害，因此「普通過失致傷害罪」使社會中相當多數的人，每天都曝露在成為罪犯的風險當中。請問：上文對「普通過失致傷害罪」抱持的立場應該是？
