  group_stem: '臺北市長柯文哲組建台灣民眾黨，8月6日進行創黨大會，並向內政部申請備案。但該政黨名稱卻與蔣渭水等人於1927年創立的「台灣民眾黨」完全相同，此舉令部分民眾感到不妥。因此，「公共政策網路參與平臺」有人發起「政黨名稱若有影響民眾對歷史認知混淆者應不允同意登記」的提案，同時呼籲文化部應主動針對「台灣民眾黨」之歷史內涵及重要價值向國人說明。

    該提案考量的主要背景是，「《政黨法》第8條雖規範政黨名稱不得與已成立之政黨名稱或簡稱相同或類似，但未慮及採用歷史著名之政黨名稱可能造成民眾對歷史之混淆，顯有漏洞。」認為政治人物擬以「台灣民眾黨」之名登記政黨，其建黨目的、精神以及代表人物之行誼都與上世紀之「台灣民眾黨」及創黨者蔣渭水先生有天壤之別。「政治人物之一時操作可能造成純真民眾對歷史之誤解，實有不妥。」提議者希望透過此項提案，維護文化歷史資產不被汙染；確保抄襲歷史黨名之鬧劇不再發生，政治人物學習尊重文化歷史資產。然而在主管機關徵詢專家學者意見後，認為《政黨法》第8條所規定的政黨，指的是現今政黨，就法言法，很難不核准。最後台灣民眾黨也於8月23日通過備案，待完成法人登記即可成為合法政黨。 出處：文化部：雖無法可管，台灣民眾黨為社會公眾珍惜的歷史記憶 公民提案：內政部勿通過柯文哲台灣民眾黨申請（編修），自由時報。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
