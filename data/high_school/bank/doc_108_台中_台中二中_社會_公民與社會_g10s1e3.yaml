  stem: '網上瘋傳一張加油站公告，指出有2位車主被加油站列為黑名單，原因是他們不斷多臺「小額加油」，一次只加2元、3元，導致油槍鎖槍，一臺被鎖又換一臺，導致整個「自助加油區」因此癱瘓，讓加油員必須不停重設電腦，最後只好把2部車車主列為黑名單，並貼出公告，嚴禁他們再犯，否則恐觸法。根據報導，其實站方早在更早之前，就已在加油站的油槍上，列出「嚴禁加油10元以下」公告。加油站站長說「機器是透過馬達，去把油抽出來，頻繁動作的話會造成機器過熱，最後造成鎖槍。」（有人不把公告當一回事，疑似利用加油來賺發票。)

    上述車主行為可能違反的原則或精神，與何者所為最相近？'
  options:
