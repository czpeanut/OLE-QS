- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 立法院日前召開院會，執政黨挾著立委多數席次優勢，表決通過以執政黨團版本為主的《反滲透法》，全文共12條。根據法案內容，若接受境外敵對勢力的指示、委託或贊助，從事選舉相關活動，最高可處五年以下有期徒刑或併科罰金1千萬。立法院待整理完法條並完成公文程序後就會送交相關機構宣布正式實施。下列針對《反滲透法》的相關敘述何者正確？
  options:
