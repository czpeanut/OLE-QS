  type: single
  page: 1
  stem: 環保團體地球公民基金會表示，行政院公布的93個優先法案中，沒有《礦業法》修正草案。但後來立法院已在臨時會將草案完成初審、送出委員會，有很多關鍵條文、民間訴求的改革方向，都取得多數委員支持，只有少數條文遭保留協商；希望當時的經濟委員會召委及立法院長能趕快召集協商，讓《礦業法》在這會期完成三讀。請從上述內容判斷目前《礦業法》卡關的狀況與成因為何？
  options:
  - label: A
    content: 程序委員會未將法案排入議程當中藉此阻擋法案
  - label: B
    content: 黨團尚未完成協商取得共識故連二讀都無法開始
  - label: C
    content: 經濟委員會未確實完成審查故無法進行後續討論
  - label: D
    content: 仍在等待二讀會完成黨團協商後才能邁向三讀會
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_台中二中_社會_公民與社會_g10s1e3_s1_3
