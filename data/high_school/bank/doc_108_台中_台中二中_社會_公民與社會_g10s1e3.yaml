  stem: 立法院第9屆第5會期第11次會議議案關係文書 案由：本院親民黨黨團，鑑於臺灣的少子化問題日趨嚴重，根據內政部統計去年2017年截至9月的資料，臺灣的出生率僅1.07%，是全世界最低的國家，儼然成為我國的不可避免的國安問題。爰此提案「幼兒教育及照顧法第九條之一及第六十條條文修正草案」，要求政府機關（構）應設立幼兒園或提供適當之幼兒教保服務措施。 提案人：親民黨立法院黨團 請問：下列解釋本案之選項哪一個符合現行法律規定？
  options:
  - label: A
    content: 本案是由15位立委連署提出的委員案
  - label: B
    content: 黨團是立法院組織，法律案審議程序與政府案不同
  - label: C
    content: 黨團成員可以包括非該黨之無黨籍委員
  - label: D
    content: 黨團所提法律案先送黨團協商後再步入一讀會
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
