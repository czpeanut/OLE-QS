  stem: 某一員警在分局警備隊的辦公室，看見冰箱內有甲同事放的養樂多，隨手拿取飲用，甲同事發現養樂多不見後報警處理，案經檢察官偵辦，將員警依竊盜罪起訴，並聲請簡易判決處刑。案經台北地方法院審理後，員警自白犯罪，法官依竊盜罪判他罰金2000元，緩刑2年，本案可上訴。法官認為，該員警為現職員警，是執法機關一員，卻竊取財物，缺乏尊重他人財產權的觀念，但他犯後坦承犯行，態度尚可，由於沒前科，也當庭道歉，雖然被害人認為他多次不告而取，不願原諒，還建議法官加重其刑，但終究犯罪所得不高，判罰金2000元，緩刑2年。針對此案選出正確選項
