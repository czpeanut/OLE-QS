  stem: 實數對（x，y）滿足方程組$\begin{cases}\log _{2}x+\log _{y}8=2 \\ \log _{y}2+2 \log _{8}x=1\end{cases}$，求 x＋y 之值＝ ＿＿＿＿。
  answer:
  - '10'
  answer_status: verified
  answer_source: answer_key
  explanation: '$log_{y}$8＝$\frac{\log 8}{\log y}$＝$\frac{3 \log 2}{\log y}$＝3 $log_{y}$2，$log_{8}$x＝$\frac{\log x}{\log 8}$＝$\frac{\log x}{3 \log 2}$＝$\frac{1}{3} \log _{2}x$

    $\begin{cases}\log _{2}x+\log _{y}8=2 \\ \log _{y}2+2 \log _{8}x =1\end{cases}$ ⇒ $\begin{cases}\log _{2}x+3 \log _{y}2=2 \cdots \cdots \cdots \cdots \cdots ① \\ \log _{y}2+\frac{2}{3} \log _{2}x =1\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    ②×3－①得 $log_{2}$x＝1 ⇒ x＝2

    代回①得 $log_{2}$2＋3 $log_{y}$2＝2 ⇒ 3 $log_{y}$2＝1 ⇒ $log_{y}$2＝$\frac{1}{3}$

    ⇒ $y^{\frac{1}{3}}$＝2 ⇒ y＝$2^{3}$＝8

    故 x＋y＝2＋8＝10'
