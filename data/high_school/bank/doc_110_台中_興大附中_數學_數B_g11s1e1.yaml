- id: doc_110_台中_興大附中_數學_數B_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 令 a＝$\cos \sqrt{2}\pi$，試問下列哪一個選項是對的？
  options:
  - label: A
    content: a＝－1
  - label: B
    content: －1＜a ≤ $-\frac{1}{2}$
  - label: C
    content: $-\frac{1}{2}$＜a ≤ 0
  - label: D
    content: 0＜a ≤ $\frac{1}{2}$
  - label: E
    content: $\frac{1}{2}$＜a ≤ 1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{4\pi}{3}<\sqrt{2}\pi <\frac{3\pi}{2}$ ⇒ $\cos \frac{4\pi}{3}<\cos \sqrt{2}\pi <\cos \frac{3\pi}{2}$

    ∴$-\frac{1}{2}$＜a＜0，故選(C)'
- id: doc_110_台中_興大附中_數學_數B_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 訊號處理學中，以儀器測量一個訊號的強度 x 通常以分貝（dB）值表示，其定義為 dB（x）＝10×$\log \frac{x}{x_{0}}$，其中 $x_{0}$ 是一個參考訊號的強度（$x_{0}$ 為一常數）。今以儀器測得某個訊號強度的分貝值為－3dB，關於該訊號的強度相對於參考訊號的強度，請由下列敘述中選出最適合的選項。（已知 log2 ≈ 0.3010）
  options:
  - label: A
    content: 該訊號的強度大約與參考訊號的強度相同
  - label: B
    content: 該訊號的強度大約比參考訊號的強度增加三分之一
  - label: C
    content: 該訊號的強度大約比參考訊號的強度增加二分之一
  - label: D
    content: 該訊號的強度大約比參考訊號的強度減少三分之一
  - label: E
    content: 該訊號的強度大約比參考訊號的強度減少二分之一
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '－3＝10×$\log \frac{x}{x_{0}}$ ⇒ －0.3＝$\log \frac{x}{x_{0}}$

    ⇒ $\frac{x}{x_{0}}$＝$10^{－0.3}$＝$\frac{1}{10^{0.3}}$ ≈ $\frac{1}{2}$（∵$10^{0.3010}$ ≈ 10 $^{log2}$＝2）

    ∴x ≈ $\frac{1}{2}x_{0}$，故選(E)'
- id: doc_110_台中_興大附中_數學_數B_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 依據醫學研究，人的體能模式為 P＝50（1＋sinωt），其中ω＞0，P ％表能量的百分比，t 表示出生後的天數。如果某人的體能週期是 30 天，則在一個週期中，有多少天能量的百分比不小於 75 ％？
  options:
  - label: A
    content: '9'
  - label: B
    content: '10'
  - label: C
    content: '11'
  - label: D
    content: '12'
  - label: E
    content: 以上皆非
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '週期為$\frac{2\pi}{\omega}$＝30 ⇒ ω＝$\frac{2\pi}{30}$＝$\frac{\pi}{15}$

    $50\left( 1+\sin \frac{\pi}{15}t \right)$ ≥ 75 ⇒ $1+\sin \frac{\pi}{15}t$ ≥ $\frac{3}{2}$ ⇒ $\sin \frac{\pi}{15}t$ ≥ $\frac{1}{2}$

    又 0 ≤ t ≤ 30 ⇒ 0 ≤ $\frac{\pi}{15}t$ ≤ 2π

    ∴$\frac{\pi}{6}$ ≤ $\frac{\pi}{15}t$ ≤ $\frac{5\pi}{6}$ ⇒ 2.5 ≤ t ≤ 12.5 ⇒ t＝3，4，……，12，共 10 天

    故選(B)'
- id: doc_110_台中_興大附中_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
