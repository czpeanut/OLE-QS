  stem: 下列選項哪些正確？
  options:
  - label: A
    content: $log_{7}$（－3）$^{2}$＝2 $log_{7}$（－3）
  - label: B
    content: $\sqrt{(\log 0.2)^{2}}$＝log0.2
  - label: C
    content: $\frac{1}{\log 2}$＝$\log \frac{1}{2}$
  - label: D
    content: $log_{2}$3＝$log_{4}$9
  - label: E
    content: log（$2^{(35)}$）＝$3^{5}$ log2
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$log_{7}$（－3）$^{2}$＝$\frac{\log (-3)^{2}}{\log 7}$＝$\frac{2 \log | -3 |}{\log 7}$＝2 $log_{7}$∣－3∣

    (B) ╳：$\sqrt{(\log 0.2)^{2}}$＝∣log0.2∣＝－log0.2

    (C) ╳：$\log \frac{1}{2}$＝log1－log2＝0－log2＝－log2≠$\frac{1}{\log 2}$

    (D) ○：$log_{4}$9＝$\frac{\log 9}{\log 4}$＝$\frac{2\log 3}{2\log 2}$＝$log_{2}$3

    (E) ○

    故選(D)(E)

    2.3（弳）≈ 3×57.3°＝171.9°

    (A) ╳：sin3 ≈ sin171.9°＞0

    (B) ○：cos3 ≈ cos171.9°＜0

    (C) ╳：150°＜171.9°＜180° ⇒ 0＜sin3＜$\frac{1}{2}$

    (D) ╳：150°＜171.9°＜180° ⇒ －1＜cos3＜$-\frac{\sqrt{3}}{2}$ ∴∣cos3∣＞$\frac{1}{2}$

    (E) ○：由(C)、(D)知∣sin3∣＜∣cos3∣

    故選(B)(E)

    3.(A) ○(B) ○(C) ╳(D) ╳：$log_{(6－a)}$（a－2）恆有意義 ⇒ $\begin{cases}底數: 6-a>0 , 6-a \neq 1 \\ 真數: a-2>0\end{cases}$

    ⇒ $\begin{cases}a<6 ,a \neq 5 \\ a>2\end{cases}$ ∴2＜a＜6，a≠5

    (E) ╳：a＝3，4，共 2 個

    故選(A)(B)

    4.(A) ○：－1 ≤ sin2x ≤ 1 ⇒ －3 ≤ 3 sin2x ≤ 3

    (B) ╳：x＝$\frac{\pi}{2}$代入得 3 sin2$\left( \frac{\pi}{2} \right)$＝3 sinπ＝0

    (C) ╳：振幅為 3

    (D) ╳：週期為$\frac{2\pi}{2}$＝π

    (E) ○：x＝$\frac{3\pi}{4}$代入得 $3 \sin 2\left( \frac{3\pi}{4} \right)$＝$3 \sin \frac{3\pi}{2}$＝－3 為最小值 ∴對稱於直線 x＝$\frac{3\pi}{4}$

    故選(A)(E)

    5.(A) ○：a＝50 ……振幅

    (B) ╳：b＝50 ……輪軸中心高度

    (C) ○：t＝0 時，$\sin \left( kt+\frac{\pi}{2} \right)$＝$\sin \frac{\pi}{2}$＝1 為最大值

    (D) ╳：每 4 秒轉一圈 2π（弳） ∴每秒轉$\frac{2\pi}{4}$＝$\frac{\pi}{2}$（弳）

    (E) ○：週期為 4＝$\frac{2\pi}{k}$ ∴k＝$\frac{2\pi}{4}$＝$\frac{\pi}{2}$

    故選(A)(C)(E)'
