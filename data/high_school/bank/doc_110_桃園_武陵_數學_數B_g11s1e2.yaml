- id: doc_110_桃園_武陵_數學_數B_g11s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 試選出第三象限的角。
  options:
  - label: A
    content: π$^{2}$
  - label: B
    content: '10'
  - label: C
    content: 100π°
  - label: D
    content: 2π
  - label: E
    content: $\frac{\pi}{2}$＋3
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：π$^{2}$（弳）≈ 3.14π（弳）＝2π＋1.14π

    又π＜1.14π＜$\frac{3\pi}{2}$，故π$^{2}$（弳）為第三象限角

    (B) ○：10（弳）≈ 10×57.3°＝573°＝360°＋213°

    故 10（弳）為第三象限角

    (C) ╳：100π° ≈ 314°為第四象限角

    (D) ╳：2π（弳）為軸上角

    (E) ○：$\frac{\pi}{2}$＋3 ≈ 4.57

    因為 180° ≈ 3.14 弳，270° ≈ 4.71 弳

    故$\frac{\pi}{2}$＋3（弳）為第三象限角

    故選(A)(B)(E)'
- id: doc_110_桃園_武陵_數學_數B_g11s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 關於 y＝sinx 的圖形經過平移或伸縮後的圖形，試選出正確的選項。
  options:
  - label: A
    content: 將 y＝sinx 的圖形向左平移 3 單位後，可得到 y＝sin（x－3）的圖形
  - label: B
    content: 將 y＝sin（x＋3）的圖形水平伸縮為 3 倍後，可得到 y＝sin（3x＋3）的圖形
  - label: C
    content: 將 y＝sin$\left( x+\frac{\pi}{3} \right)$的圖形鉛直向上平移 3 單位後，可得到 y＝sin$\left( x+\frac{\pi}{3} \right)$＋3 的圖形
  - label: D
    content: 將 y＝sin$\left( x+\frac{\pi}{3} \right)$的圖形鉛直伸縮為 2 倍後，可得到 y＝sin2$\left( x+\frac{\pi}{3} \right)$的圖形
  - label: E
    content: 將 y＝sin$\left( x+\frac{\pi}{3} \right)$的圖形鉛直伸縮為 2 倍後，可得到 y＝2 sin$\left( x+\frac{\pi}{3} \right)$的圖形
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：應為 y＝sin（x＋3）

    (B) ╳：應為 y＝$\sin \left( \frac{1}{3}x+3 \right)$

    (C) ○：y＝$\sin \left( x+\frac{\pi}{3} \right)$的圖形鉛直向上平移 3 單位，得 y＝$\sin \left( x+\frac{\pi}{3} \right)$＋3 的圖形

    (D) ╳：應為 y＝$2 \sin \left( x+\frac{\pi}{3} \right)$

    (E) ○：同(D)

    故選(C)(E)'
- id: doc_110_桃園_武陵_數學_數B_g11s1e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 關於函數 y＝f（x）＝40 sin$\left( \frac{1}{2}x+\frac{\pi}{2} \right)$＋77，下列何者正確？
  options:
  - label: A
    content: －77 ≤ y ≤ 77
  - label: B
    content: 週期為π
  - label: C
    content: 圖形對稱 y 軸
  - label: D
    content: $f\left( \frac{\pi}{2} \right)$＞100
  - label: E
    content: f(3)＜77
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝f（x）＝40 sin$\left[ \frac{1}{2} (x+\pi ) \right]$＋77

    (A) ╳：∵－1 ≤ sin$\left[ \frac{1}{2} (x+\pi ) \right]$ ≤ 1

    ∴37 ≤ 40 sin$\left[ \frac{1}{2} (x+\pi ) \right]$＋77 ≤ 117，即 37 ≤ y ≤ 117

    (B) ╳：週期應為$\frac{2\pi}{\frac{1}{2}}$＝4π

    (C) ○：∵x＝0 時，f(0)＝117 在波峰

    ∴y＝f（x）的圖形對稱於 y 軸

    (D) ○：$f\left( \frac{\pi}{2} \right)$＝40 sin$\frac{3\pi}{4}$＋77

    ＝40×$\frac{\sqrt{2}}{2}$＋77＝$20\sqrt{2}$＋77＝$\sqrt{800}$＋77＞28＋77＞100

    (E) ╳：f(3)＝40 sin$\left[ \frac{1}{2} (3+\pi ) \right]$＋77

    ∵sin$\left[ \frac{1}{2} (3+\pi ) \right]$ ≈ sin3.07＞0 ∴f(3)＞77

    故選(C)(D)'
- id: doc_110_桃園_武陵_數學_數B_g11s1e2_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 如右圖所示，有 4 個函數 y＝2 sin$\left( 2x-\frac{\pi}{6} \right)$， y＝2 sinx，y＝sin$\left( x+\frac{\pi}{6} \right)$，y＝sin$\left( 2x-\frac{\pi}{3} \right)$， 則下列何者正確？
  options:
  - label: A
    content: f（x）＝2 sin$\left( 2x-\frac{\pi}{6} \right)$
  - label: B
    content: g（x）＝2 sinx
  - label: C
    content: h（x）＝sin$\left( x+\frac{\pi}{6} \right)$
  - label: D
    content: k（x）＝sin$\left( 2x-\frac{\pi}{3} \right)$
  - label: E
    content: f（x）＝2 sinx
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_110_桃園_武陵_數學_數B_g11s1e2/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 391.85
      - 573.0
      - 564.3
      - 692.4
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由題圖可知 f（x）和 h（x）週期較長且 f（x）較高

    ⇒ f（x）＝2 sinx，h（x）＝$\sin \left( x+\frac{\pi}{6} \right)$

    其餘兩圖形中，g（x）較高

    ⇒ g（x）＝$2 \sin \left( 2x-\frac{\pi}{6} \right)$，k（x）＝$\sin \left( 2x-\frac{\pi}{3} \right)$

    故選(C)(D)(E)'
