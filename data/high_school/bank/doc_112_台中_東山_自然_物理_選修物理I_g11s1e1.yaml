  explanation: '由於金屬小球相對於碗處於靜止位置，意味著金屬小球在碗內的受力達到平衡，在這個加速的參考系中，需要考慮一個假想向左的慣性力 $F_{慣}$ 來抵消碗的加速運動。

    ①重力：垂直向下，量值為 mg＝0.2×10＝2（牛頓）。

    ②慣性力：水平向左，量值為 $F_{慣}$＝ma＝0.2×7.5＝1.5（牛頓）。

    這兩個力將構成一個合力，使小球沿著半球碗的表面施加一個正向力。

