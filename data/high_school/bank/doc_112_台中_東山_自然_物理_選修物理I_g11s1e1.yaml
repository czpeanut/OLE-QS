- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s2_17
  section: 2
  number: 17
  type: multiple
  page: 4
  stem: 小楊老師在教室平面桌上設置一個旋轉實驗，利用三條長度均為 L 的細繩按順序由內向外連接三小球 A、B、C，此三顆小球其質量皆為 m，固定 O 點為旋轉中心，如右圖，接著小楊老師開始進行實驗，首先讓這三顆小球 A、B、C，以 O 點為旋轉中心，在這光滑水平面上作等速圓周運動，假設 A 的速率為 v，則下列敘述哪些正確？
  options:
  - label: A
    content: 連接 B、C 間繩的張力為$\frac{2mv^{2}}{L}$
  - label: B
    content: B 所受的向心力為$\frac{mv^{2}}{L}$
  - label: C
    content: 連接 A、B 間繩的張力為$\frac{5mv^{2}}{L}$
  - label: D
    content: A、B、C 三球的向心力比為 1：2：3
  - label: E
    content: A、B、C 三球的角速度均相同
  assets:
  - key: s2_17_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s2_17_f1.png
    crop:
      page: 4
      rect:
      - 450.9
      - 491.25
      - 565.1
      - 605.45
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由於三顆小球 A、B、C 都以固定點 O 為中心進行等速圓周運動，角速度 ω 相同，可使用小球 A 的速率 v 來確定角速度：ω＝$\frac{v}{L}$

    利用向心力公式 $F_{c}$＝mRω$^{2}$，可以分別計算三個小球的向心力。

    小球 A 的旋轉半徑為 L，其向心力為 $F_{A}$＝mω$^{2}$L＝m（$\frac{v}{L}$）$^{2}$×L＝$\frac{mv^{2}}{L}$

    小球 B 的旋轉半徑為 2L，其向心力為 $F_{B}$＝mω$^{2}$（2L）＝m（$\frac{v}{L}$）$^{2}$×2L＝$\frac{2mv^{2}}{L}$

    小球 C 的旋轉半徑為 3L，其向心力為 $F_{C}$＝mω$^{2}$（3L）＝m（$\frac{v}{L}$）$^{2}$×3L＝$\frac{3mv^{2}}{L}$

    B 與 C 間的繩子張力 $T_{BC}$：由於小球 C 的向心力由 $T_{BC}$ 提供，因此 $T_{BC}$＝$F_{c}$＝$\frac{3mv^{2}}{L}$。

    A 與 B 間的繩子張力 $T_{AB}$：根據小球 B 的向心力來計算 $T_{AB}$，對於小球 B，其向心力為 $F_{B}$＝$\frac{2mv^{2}}{L}$，由於 B 受到兩個張力的作用為 $T_{BC}$ 朝外，提供一部分的向心力與 $T_{AB}$ 朝內，提供另一部分的向心力。

    因此，對小球 B：$T_{AB}$－$T_{BC}$＝$F_{B}$

    將 $T_{BC}$＝$\frac{3mv^{2}}{L}$與 $F_{B}$＝$\frac{2mv^{2}}{L}$代入方程式：

    $T_{AB}$－$\frac{3mv^{2}}{L}$＝$\frac{2mv^{2}}{L}$

    ⇒ $T_{AB}$＝$\frac{2mv^{2}}{L}$＋$\frac{3mv^{2}}{L}$＝$\frac{5mv^{2}}{L}$

    (A)連接 B、C 間繩的張力應為$\frac{3mv^{2}}{L}$。

    (B) B 所受的向心力應為$\frac{2mv^{2}}{L}$。'
