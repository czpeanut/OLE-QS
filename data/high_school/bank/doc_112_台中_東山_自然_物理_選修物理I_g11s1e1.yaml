- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s2_19
  section: 2
  number: 19
  type: multiple
  page: 5
  stem: 大東在閱讀下列針對簡諧運動的敘述，則哪些<u>錯誤</u>？
  options:
  - label: A
    content: 正在作簡諧運動的物體，當在平衡點時，所受合力為零，速度最小
  - label: B
    content: 正在作簡諧運動的物體，當在端點時加速度最大，但是速度為零
  - label: C
    content: 正在作簡諧運動的物體，當愈接近平衡點時，加速度的量值愈大
  - label: D
    content: 正在作簡諧運動的物體，物體速度方向恆與加速度方向相反
  - label: E
    content: 正在作簡諧運動的物體，可以用等速圓周運動的投影來表示簡諧運動
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)當物體通過平衡點時，合力確實為零，但速度最大，而不是最小。

    (B)物體在運動的端點處速度為零，而加速度達到最大值，方向指向平衡點。

    (C)加速度的量值與位移成正比，因此當物體接近平衡點時，加速度的量值應該愈小，而不是愈大。

    (D)在簡諧運動中，加速度的方向總是指向平衡點，而物體的速度方向取決於它的位置：

    (1)當物體從端點向平衡點運動時，速度方向指向平衡點，而加速度方向也是指向平衡點，兩者方向相同。

    (2)當物體越過平衡點並向另一個端點運動時，速度方向與加速度方向才會相反。

    因此，速度方向與加速度方向並非「恆」相反。

    (E)簡諧運動可以被視為等速圓周運動在某一軸上的投影，這是一種常見的表示方式。'
