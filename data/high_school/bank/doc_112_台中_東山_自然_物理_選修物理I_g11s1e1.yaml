- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '在東山高中園遊會前一天，有一個大型的熱氣球招牌正在架設，小楊老師利用物理實驗方法，協助調整熱氣球的高度，以下為小楊老師依序的步驟：（假設此熱氣球的浮力為定值，不計熱氣球的重量與負載浮力）

    ①首先他先使用 2 包重物（每包質量皆相等）負載時，此時熱氣球以加速度 a 上升。

    ②後來再調整，使用 6 包重物（每包質量皆相等）負載時，此時熱氣球卻以加速度 a 下降。

    ③小楊老師再改變，使用 4 包重物（每包質量皆相等）負載時。

    則此時熱氣球其加速度為何者？'
  options:
  - label: A
    content: $\frac{g}{6}$↓
  - label: B
    content: $\frac{g}{4}$↓
  - label: C
    content: $\frac{g}{2}$↓
  - label: D
    content: $\frac{g}{4}$↑
  - label: E
    content: $\frac{g}{2}$↑
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '假設浮力為 B；每包重物負載的重量為 mg（其中 m 是每包負載的質量， g 是重力加速度）。

    根據牛頓第二運動定律，浮力 B 與負載的重量之差將決定加速度：

    (1)當使用 2 包重物負載時（加速度 a 向上）：

    B－2mg＝2m×a ………①

    (2)當使用 6 包重物負載時（加速度 a 向下）：

    B－6mg＝－6m×a ………②

    ①×3 ⇒ 3B－6mg＝6ma

    ①×3＋② ⇒ 4B－12mg＝0

    ⇒ 4B＝12mg

    ⇒ B＝3mg

    將 B＝3mg 代入①可得 3mg－2mg＝2m×a ⇒ mg＝2m×a ⇒ a＝$\frac{g}{2}$

    當使用 4 包重物負載時，浮力 B 與重力之間的差異給出加速度：B－4mg＝3mg－4mg＝－mg；

    加速度 a'' 為 a''＝$\frac{-mg}{4m}$＝－$\frac{g}{4}$；熱氣球的加速度為$\frac{g}{4}$向下，故選(B)。'
  tags:
    unit:
      code: PH-S1-4-3
