    N＝$\sqrt{(mg)^{2}+(ma)^{2}}$ ⇒ N＝$\sqrt{(2)^{2}+(1.5)^{2}}$ ⇒ N＝$\sqrt{4+2.25}$＝$\sqrt{6.25}$＝2.5（牛頓）

