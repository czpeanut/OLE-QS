  stem: 小楊老師在黑板上畫 F-x 圖，如右圖，此為描述甲、乙兩條彈簧的形變量 x 與彈力 F 的圖形，已知兩彈簧原長相同，若將甲、乙兩彈簧並聯後，並且使用 30 gw 的力拉彈簧組，其形變量為多少 cm？
