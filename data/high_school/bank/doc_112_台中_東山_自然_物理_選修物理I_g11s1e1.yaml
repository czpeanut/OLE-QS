  answer_source: answer_key
  explanation: '根據簡諧運動的力方程式 F＝－kx，可以看出力常數 k＝10 N∕m，當物體位於最大位移時，受力達到最大值，因此，可以根據最大受力 $F_{max}$ 求出振幅 A。

    $F_{max}$＝k×A ⇒ 100＝10×A ⇒ A＝10 m

    在簡諧運動中，角頻率 ω 與力常數 k 和質量 m 的關係為 ω＝$\sqrt{\frac{k}{m}}$

    將 k＝10 N∕m 與 m＝2 kg 代入得 ω＝$\sqrt{\frac{10}{2}}$＝$\sqrt{5}$（rad∕s）

    在簡諧運動中，最大速率 $v_{max}$ 可由公式 $v_{max}$＝ωA 求出。

    將 ω＝$\sqrt{5}$與 A＝10 代入得 $v_{max}$＝$\sqrt{5}$×10＝10$\sqrt{5}$（m∕s）'
