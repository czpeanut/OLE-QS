- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 小楊老師利用假日載家人出去遊玩，途經一個大彎路，為了行車安全，小楊老師在腦袋中，開始進行物理向心力的計算，首先他確認公路轉彎處為一個傾斜的路面，假設此彎道的曲率半徑為 r，路面傾斜角為θ＝37°，假設小楊老師若不依賴路面與輪胎間的摩擦力而能轉彎通過，則小楊老師速限需為多少 m∕s？（重力加速度為 g）
  options:
  - label: A
    content: $\sqrt{\frac{3}{4}gr}$
  - label: B
    content: $\sqrt{\frac{4}{3}gr}$
  - label: C
    content: $\sqrt{\frac{3}{5}gr}$
  - label: D
    content: $\sqrt{\frac{4}{5}gr}$
  - label: E
    content: $\sqrt{\frac{5}{4}gr}$
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s1_8_f1.png
    crop:
      page: 2
      rect:
      - 443.75
      - 491.35
      - 565.1
      - 569.95
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '向心力表示為 $F_{c}$＝$\frac{mv^{2}}{r}$

    重力與正向力的分解：

    (1)沿垂直於斜面的方向：N cosθ＝mg

    (2)沿水平方向（向心力）：N sinθ＝$\frac{mv^{2}}{r}$

    聯立方程式求出 v，消去 N 得到

    （mg）tanθ＝$\frac{mv^{2}}{r}$

    ⇒ $v^{2}$＝gr tanθ

    ⇒ v＝$\sqrt{gr\tan \theta}$

    tan37°＝$\frac{3}{4}$，因此 v＝$\sqrt{\frac{3}{4}gr}$

    ∴車輛在彎道上的速限為$\sqrt{\frac{3}{4}gr}$，故選(A)'
  tags:
