- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 承 11. 題，大東又進行了另外一項實驗，他將兩個物體 $m_{1}$、$m_{2}$ 放置於和水平成 53°、30° 的光滑斜面上，將其保持平衡，如右圖，假設他開始調整實驗裝置，將物體 $m_{1}$、$m_{2}$ 位置互換，則物體 $m_{1}$ 的加速度量值為多少 m∕$s^{2}$？
  options:
  - label: A
    content: '3'
  - label: B
    content: '2'
  - label: C
    content: '1'
  - label: D
    content: $\frac{11}{5}$
  - label: E
    content: $\frac{3}{10}$
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s1_12_f1.png
    crop:
      page: 3
      rect:
      - 474.0
      - 329.25
      - 565.05
      - 384.6
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)在初始平衡狀態下，兩個物體在各自的斜面上靜止，沿著斜面的重力分力相等：

    $m_{1}$g sin53°＝$m_{2}$g sin30°

    ⇒ $m_{1}$×10×sin53°＝$m_{2}$×10×sin30°

    ⇒ $m_{1}$ sin53°＝$m_{2}$ sin30°

    已知 sin53°＝$\frac{4}{5}$與 sin30°＝$\frac{1}{2}$，代入得 $m_{1}$×$\frac{4}{5}$＝$m_{2}$×$\frac{1}{2}$ ⇒ $\frac{m_{1}}{m_{2}}$＝$\frac{\frac{1}{2}}{\frac{4}{5}}$＝$\frac{5}{8}$

    (2)當物體 $m_{1}$ 與 $m_{2}$ 互換位置後：

    ①物體 $m_{1}$ 位於 30°斜面上，沿斜面的重力分力為 $m_{1}$g sin30°。

    ②物體 $m_{2}$ 位於 53°斜面上，沿斜面的重力分力為 $m_{2}$g sin53°。

    這時系統的合力將會產生一個加速度 a，根據牛頓第二運動定律：

    $F_{net}$＝（$m_{2}$g sin53°－$m_{1}$g sin30°）＝（$m_{1}$＋$m_{2}$）a

    將 g＝10 m∕$s^{2}$、sin53°＝$\frac{4}{5}$、sin30°＝$\frac{1}{2}$、$m_{1}$＝$\frac{5}{8}m_{2}$ 代入得

    $m_{2}$×10×$\frac{4}{5}$－$\frac{5}{8}m_{2}$×10×$\frac{1}{2}$＝（$m_{1}$＋$m_{2}$）a

    第一項計算：$m_{2}$×10×$\frac{4}{5}$＝$m_{2}$×8＝$8m_{2}$

    第二項計算：$\frac{5}{8}m_{2}$×10×$\frac{1}{2}$＝$\frac{5}{8}$×10×$\frac{1}{2}m_{2}$＝$\frac{5}{8}$×$5m_{2}$＝$\frac{25}{8}m_{2}$

    因此，左邊的合力為 $8m_{2}$－$\frac{25}{8}m_{2}$

    將這兩項化為同一分母＝$\frac{64}{8}m_{2}$－$\frac{25}{8}m_{2}$＝$\frac{39}{8}m_{2}$

    右邊的總質量為 $m_{1}$＋$m_{2}$＝$\frac{5}{8}m_{2}$＋$m_{2}$＝$\frac{5}{8}m_{2}$＋$\frac{8}{8}m_{2}$＝$\frac{13}{8}m_{2}$

    根據牛頓第二運動定律：$\frac{39}{8}m_{2}$＝$\frac{13}{8}m_{2}$×a

    a＝$\frac{\frac{39}{8}}{\frac{13}{8}}$＝$\frac{39}{8}$×$\frac{8}{13}$＝$\frac{39}{13}$＝3（m∕$s^{2}$）

    物體 $m_{1}$ 的加速度量值為 a＝3 m∕$s^{2}$，故選(A)。'
