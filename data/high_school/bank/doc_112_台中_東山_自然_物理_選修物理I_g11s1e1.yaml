      - 479.75
      - 221.95
      - 565.1
      - 285.6
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '對物體 m 使用牛頓第二運動定律：

    m×g－T＝m×a

    ⇒ 2×10－T＝2×a

    ⇒ 20－T＝2a ………………①

    對物體 M 使用牛頓第二運動定律：

    T＝M×a

    ⇒ T＝3×a ……………………②

    將②代入①可得 T 與 a：

    20－3a＝2a

    ⇒ 20＝5a

    ⇒ a＝4（m∕$s^{2}$）……………③

    將③代入②可得繩子的張力 T：

    T＝3×4＝12（N）'
