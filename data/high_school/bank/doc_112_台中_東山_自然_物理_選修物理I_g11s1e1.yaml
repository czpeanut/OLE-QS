  explanation: '懸掛在天花板的細繩所承受的總張力 T，實際上是兩個物體的重量與系統運動所產生的附加力總和，可以分別計算出兩側繩子的張力，然後將它們加總以得到懸掛於天花板的總張力。

    (1)對於物體 $m_{1}$（向下加速）：

    ①重力：$m_{1}$g＝3×10＝30（N）

    ②根據牛頓第二運動定律，可以寫出張力 $T_{1}$ 的方程式：

    $m_{1}$g－$T_{1}$＝$m_{1}$a ⇒ 30－$T_{1}$＝3×5 ⇒ 30－$T_{1}$＝15 ⇒ $T_{1}$＝15（N）

    (2)對於物體 $m_{2}$（向上加速）：

    ①重力：$m_{2}$g＝1×10＝10（N）

    ②根據牛頓第二運動定律，可以寫出張力 $T_{2}$ 的方程式：

    $T_{2}$－$m_{2}$g＝$m_{2}$a ⇒ $T_{2}$－10＝1×5 ⇒ $T_{2}$－10＝5 ⇒ $T_{2}$＝15 N

    由於系統的張力在滑輪上分成兩邊，懸掛在天花板繩子的總張力 $T_{總}$ 是兩側張力的和： $T_{總}$＝$T_{1}$＋$T_{2}$＝15＋15＝30（N）

    接下來將其轉換為「kgw」單位：$T_{總}$＝$\frac{30}{10}$＝3（kgw）'
