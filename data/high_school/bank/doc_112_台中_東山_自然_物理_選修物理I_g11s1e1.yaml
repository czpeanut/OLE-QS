- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s2_16
  section: 2
  number: 16
  type: multiple
  page: 4
  stem: 小楊老師在教室擺設一個錐動擺，此時小楊老師調整錐動擺擺角由 53° 變為 37° 角時，則下列敘述哪些正確？
  options:
  - label: A
    content: 向心加速度變為$\frac{16}{9}$倍
  - label: B
    content: 向心加速度變為$\frac{9}{16}$倍
  - label: C
    content: 繩子張力變為$\frac{4}{3}$倍
  - label: D
    content: 繩子張力變為$\frac{3}{4}$倍
  - label: E
    content: 向心力變為$\frac{16}{9}$倍
  assets:
  - key: s2_16_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s2_16_f1.png
    crop:
      page: 4
      rect:
      - 432.1
      - 275.25
      - 565.1
      - 391.95
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)錐動擺的向心力與張力：

    ①當擺在作圓周運動時，繩子提供的張力 T 可以分解為兩個分量：

    ❶垂直分量 T cosθ平衡重力 mg。

    ❷水平方向的分量 T sinθ提供向心力 $F_{c}$。

    ②可以寫出以下兩個方程式：

    ❶垂直方向的力平衡：T cosθ＝mg

    ❷水平方向的向心力：T sinθ＝$ma_{c}$（其中 $a_{c}$ 是向心加速度）

    (2)解向心加速度 $a_{c}$：

    ①根據上面兩個方程式，可得 $a_{c}$＝g tanθ

    ②向心加速度 $a_{c}$ 與擺角的正切值成正比。

    (3)分析擺角變化對向心加速度的影響：

    ①當擺角從θ$_{1}$＝53° 變為θ$_{2}$＝37° 時，考慮 tanθ的變化：tan53°＝$\frac{4}{3}$與 tan37°＝$\frac{3}{4}$

    ②向心加速度的變化比為$\frac{a_{c2}}{a_{c1}}$＝$\frac{\tan 37^{^{\circ}}}{\tan 53^{^{\circ}}}$＝$\frac{\frac{3}{4}}{\frac{4}{3}}$＝$\frac{3\times 3}{4\times 4}$＝$\frac{9}{16}$

    ∴當擺角從 53° 減少到 37° 時，向心加速度變為原來的$\frac{9}{16}$倍

    (4)繩子的張力變化：

    ①由垂直方向的力平衡式 T cosθ＝mg 可得 T＝$\frac{mg}{\cos \theta}$

    ②繩子的張力與 cosθ成反比，因此，張力的變化比為$\frac{T_{2}}{T_{1}}$＝$\frac{\cos 53^{^{\circ}}}{\cos 37^{^{\circ}}}$

    ③代入數值：cos53°＝$\frac{3}{5}$與 cos37°＝$\frac{4}{5}$

    ④得到張力的變化比為$\frac{T_{2}}{T_{1}}$＝$\frac{\frac{3}{5}}{\frac{4}{5}}$＝$\frac{3}{4}$

    ∴繩子的張力變為$\frac{3}{4}$倍'
