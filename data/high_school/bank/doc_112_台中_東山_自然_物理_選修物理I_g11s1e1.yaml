  explanation: '從 P 點開始經過 1 s 後的角位移：

    質點經過時間 t＝1 s 後的角位移為θ＝ωt。已知 ω＝$\frac{\pi}{3}$ ∴θ＝$\frac{\pi}{3}$×1＝$\frac{\pi}{3}$（rad）

    加速度量值：簡諧運動中，加速度的量值為 a＝ω$^{2}$A cosθ。

    已知 A＝2 m，且 ω＝$\frac{\pi}{3}$：a＝（$\frac{\pi}{3}$）$^{2}$×2 cos$\frac{\pi}{3}$

    ∵cos$\frac{\pi}{3}$＝$\frac{1}{2}$ ∴a＝$\frac{2\pi ^{2}}{9}$×$\frac{1}{2}$＝$\frac{\pi ^{2}}{9}$（m∕$s^{2}$）

    故經過 1 秒後，加速度量值為$\frac{\pi ^{2}}{9}$m∕$s^{2}$。'
