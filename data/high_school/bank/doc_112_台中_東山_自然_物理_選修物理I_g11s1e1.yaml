  answer_source: answer_key
  explanation: '(1)從題圖可知：

    ①在 t＝0 → t＝2 s 的區間，角速度從 0 增加到 40 rad∕s，是一段線性增長。

    ②在 t＝2 → t＝3 s 的區間，角速度保持在 40 rad∕s。

    (2)角位移可以通過計算角速度－時間圖形下的面積來得到，從 t＝0 → t＝2 s 的角位移：

    ①這段時間角速度從 0 ～ 40 rad∕s 線性增長，面積為梯形的面積。

    ②梯形面積公式為$\frac{1}{2}$×（上底＋下底）×高

    ③上底為 2 s，下底為 2 s，高度為 40 rad∕s，因此θ$_{0→2}$＝$\frac{1}{2}$×（0＋40）×2＝40（rad）

    (3)從 t＝2 → t＝3 秒的角位移：

    ①在這段時間角速度保持為 40 rad∕s，這部分為矩形面積。

    ②矩形面積為θ$_{2→3}$＝寬×高＝1×40＝40（rad）

    總角位移為θ＝θ$_{0→2}$＋θ$_{2→3}$＝40＋40＝80（rad）

    當 t＝3 s 時，質點的角位移為 80 rad，故選(C)。'
