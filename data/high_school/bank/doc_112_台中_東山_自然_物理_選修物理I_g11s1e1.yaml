  stem: '大東在物理實驗課程中，使用一個質量為 2 kg 的物體（此物體可以當作一個質點）進行簡諧運動，其條件如下：

    ①此物體受到的合力方程式為 $F＝－10x$（單位為 SI 制）。

    ②此物體運動過程中最大受力為 100 牛頓。

    則物體運動過程中最大的速率量值為多少 m∕s？'
  options:
