- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 小楊老師在一個無摩擦力的桌面上擺放一個質量 m 的物體，以一個質量可以忽略的繩子，通過桌面中央一小洞與物體 M 相連接，假設物體 m 在桌面上不轉動，則物體 M 以$\frac{1}{3}$g 向下作等加速運動（g 為重力加速度），若物體 m 在桌面上開始作半徑為 R 的等速圓周運動時，物體 M 恰好靜止不動，請問此時物體 m 的旋轉之速率為多少 m∕s？
  options:
  - label: A
    content: $\sqrt{gR}$
  - label: B
    content: $\sqrt{3gR}$
  - label: C
    content: $\sqrt{2gR}$
  - label: D
    content: $\sqrt{\frac{1}{2}gR}$
  - label: E
    content: $\sqrt{\frac{1}{3}gR}$
  assets:
  - key: s1_10_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s1_10_f1.png
    crop:
      page: 3
      rect:
      - 460.7
      - 77.35
      - 565.1
      - 164.1
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '當物體 m 靜止不動，而物體 M 向下加速時，整個系統的合加速度為$\frac{1}{3}$g，可以將 M 與 m 當作一個整體系統進行分析。對於整個系統，向下的合力是 Mg，並且系統總質量是 M＋m。

    根據牛頓第二運動定律：

    Mg＝（M＋m）$\frac{1}{3}$g

    ⇒ M＝$\frac{1}{3}$（M＋m）

    ⇒ 3M＝M＋m

    ⇒ 2M＝m

    因此，質量比為$\frac{M}{m}$＝$\frac{1}{2}$

    當物體 m 以半徑 R 作等速圓周運動時，物體 M 恰好靜止，此時，物體 m 的向心力需由繩子的張力提供，而此張力剛好等於物體 M 的重力 Mg。

    根據向心力公式：T＝$\frac{mv^{2}}{R}$

    且 T＝Mg ∴$\frac{mv^{2}}{R}$＝Mg

    將 m＝2M 代入得$\frac{2Mv^{2}}{R}$＝Mg ⇒ $2v^{2}$＝gR ⇒ $v^{2}$＝$\frac{gR}{2}$ ⇒ v＝$\sqrt{\frac{gR}{2}}$'
