- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 小楊老師正在進行彈簧實驗，他使用彈簧，讓彈簧的一端懸於天花板，另一端則是掛 20 牛頓的鐵塊，如右圖所示，當鐵塊所受作用力合力為零時，彈簧長為 24 公分，則木板與鐵塊間的作用力量值為多少牛頓？（彈簧長 30 公分，彈性常數為 500 牛頓∕公尺）
  options:
  - label: A
    content: '20'
  - label: B
    content: '30'
  - label: C
    content: '50'
  - label: D
    content: '90'
  - label: E
    content: '120'
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s1_5_f1.png
    crop:
      page: 2
      rect:
      - 478.55
      - 59.15
      - 565.1
      - 162.4
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '彈簧的自然長度為 30 公分，而在靜止狀態下，彈簧被壓縮到 24 公分，因此壓縮量為 Δx＝30－24＝6＝0.06（公尺）

    根據虎克定律，彈簧的回復力為 $F_{彈簧}$＝k×Δx＝500 N∕m×0.06 m＝30 N

    鐵塊的重量為 20 N，彈簧施加的向下彈力為 30 N，因此總向下的力量為

    $F_{總向下}$＝20 N＋30 N＝50 N

    要使鐵塊保持靜止，木板需施加一個向上的力來平衡這 50 N 的向下合力。因此，木板與鐵塊間的作用力量值為 $F_{木板－鐵塊}$＝50 N，故選(C)。'
