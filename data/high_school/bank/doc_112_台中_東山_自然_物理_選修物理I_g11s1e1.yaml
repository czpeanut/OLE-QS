  type: single
  page: 1
  stem: 下列為小楊老師在東山高中的各種行為，請問何者<u>不屬於</u>牛頓第一運動定律的表現？
  options:
  - label: A
    content: 小楊老師上班開車進入校園當中，突然前方碰到掉落的障礙物，立即緊急剎車，小楊老師突然向前傾
  - label: B
    content: 小楊老師在後山跟同學打完球後，帶著球走下山坡，結果不小心，將球從斜坡上等速度滑落
  - label: C
    content: 夏天的老泉里後山，突然下起午後雷陣雨，雨滴從天空落下一段距離後，等速度掉落下來
  - label: D
    content: 小楊老師在上物理課的時候，利用教學影片介紹人造衛星，正在繞地球作等速圓周運動
  - label: E
    content: 小楊老師在教室中，進行彈簧實驗，他將物體掛在彈簧，讓彈簧伸長，使物體呈現靜止狀態
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)小楊老師在緊急剎車時，由於慣性效應，身體傾向於保持運動狀態而向前傾，屬於牛頓第一運動定律的表現。

    (B)此情況中球在斜坡上等速度滑落，可以認為外力平衡，因此屬於牛頓第一運動定律的表現。

    (C)雨滴在重力作用下，最初加速落下，之後達到與空氣阻力平衡，開始等速度落下，屬於牛頓第一運動定律的表現。

    (D)人造衛星以等速率進行圓周運動時，方向不斷改變，意味著有向心力作用，因此不屬於牛頓第一運動定律中的直線等速運動。

    (E)物體在彈簧力與重力的平衡下靜止，沒有淨外力，滿足牛頓第一運動定律的靜止狀態。'
