- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 東山開心農場今年開始種植蘋果樹，此時小楊老師詢問同學，若成熟的蘋果由樹上落下時，根據小楊老師在課堂教過的牛頓的萬有引力定律，請問下列敘述何者正確？
  options:
  - label: A
    content: 地球對蘋果有吸引力，蘋果對地球沒有吸引力
  - label: B
    content: 蘋果對地球有吸引力，地球對蘋果沒有吸引力
  - label: C
    content: 地球對蘋果的吸引力大於蘋果對地球的吸引力（僅考慮力的量值）
  - label: D
    content: 地球對蘋果的吸引力小於蘋果對地球的吸引力（僅考慮力的量值）
    asset:
      key: s1_3_optD
      file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s1_3_optD.png
      crop:
        page: 1
        rect:
        - 507.6
        - 669.95
        - 565.1
        - 774.35
  - label: E
    content: 地球對蘋果的吸引力等於蘋果對地球的吸引力（僅考慮力的量值）
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)根據牛頓第三運動定律，蘋果對地球也會施加相同大小的吸引力，因此蘋果對地球同樣有吸引力。

    (B)與(A)相似，地球與蘋果會相互吸引，因此地球對蘋果也有吸引力。

    (C)根據牛頓第三運動定律，兩物體間的引力量值相等，不論質量大小，因此地球對蘋果的吸引力應該等於蘋果對地球的吸引力。

    (D)理由同(C)，兩者間的引力大小相等，因此地球對蘋果的吸引力不會小於蘋果對地球的吸引力。

    (E)這符合牛頓第三運動定律的描述，兩者的引力量值相等且方向相反。'
  tags:
