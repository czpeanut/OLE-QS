  answer_source: answer_key
  explanation: '甲、乙彈簧的彈性常數 k。

    甲彈簧：從題圖中，當 x＝10 cm 時，F＝10 gw，因此 $k_{甲}$＝$\frac{F}{x}$＝$\frac{10gw}{10cm}$＝1 gw∕cm

    乙彈簧：當 x＝20 cm 時，F＝10 gw，因此 $k_{乙}$＝$\frac{F}{x}$＝$\frac{10gw}{20cm}$＝0.5 gw∕cm

    並聯後的總彈性常數 $k_{並聯}$＝$k_{甲}$＋$k_{乙}$＝1 gw∕cm＋0.5 gw∕cm＝1.5 gw∕cm

    形變量 x：使用 30 g 重的力拉並聯的彈簧組，因此 x＝$\frac{F}{k_{並聯}}$＝$\frac{30gw}{1.5gw∕cm}$＝20 cm'
