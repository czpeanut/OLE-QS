  stem: 小楊老師在教室中示範滑輪實驗，如右圖所示，他將物體 M 放在水平實驗桌面上，此滑輪藉由物體 m 的重量讓滑輪自由下滑（繩子質量不計），請問此時繩子張力為多少 N？（M 質量＝3 kg，m 質量＝2 kg， g＝10 m∕$s^{2}$）
  options:
