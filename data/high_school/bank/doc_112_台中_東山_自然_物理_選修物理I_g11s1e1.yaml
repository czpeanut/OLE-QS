- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1_s2_21
  section: 2
  number: 21
  type: multiple
  page: 5
  stem: '右圖為大東的實驗裝置圖，實驗資料如下：

    ①質量分別為 $M_{1}$＝2 kg 與 $M_{2}$＝1 kg 的物體懸掛於滑輪下。

    ②假設滑輪為光滑，且繩重與滑輪均不計， g＝10 m∕$s^{2}$。

    若 $M_{1}$ 加速度方向向下，如右圖，則下列敘述哪些<u>錯誤</u>？'
  options:
  - label: A
    content: $M_{1}$ 的加速度量值為 $\frac{20}{3}$ m∕$s^{2}$
  - label: B
    content: $M_{1}$ 的加速度量值為 $\frac{40}{3}$ m∕$s^{2}$
  - label: C
    content: 拉動 $M_{2}$ 的繩張力 $T_{2}$ 量值為 $\frac{20}{3}$ N
  - label: D
    content: 拉動 $M_{2}$ 的繩張力 $T_{2}$ 量值為 $\frac{40}{3}$ N
  - label: E
    content: 無法計算
  assets:
  - key: s2_21_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s2_21_f1.png
    crop:
      page: 5
      rect:
      - 482.8
      - 509.25
      - 565.1
      - 614.05
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '假設 $M_{1}$ 的加速度量值為 a 向下，則 $M_{2}$ 的加速度量值應為$\frac{a}{2}$向上（由於動滑輪的設計，使得 $M_{2}$ 的加速度只有 $M_{1}$ 的一半）。對於 $M_{1}$ 而言，其受力情況如下：

    (1)向下的重力：$M_{1}$g＝2×10＝20（N）

    (2)向上的張力：T。

    根據牛頓第二運動定律：

    $M_{1}$g－T＝$M_{1}$a ⇒ 20－T＝2a ……………①

    對於 $M_{2}$ 而言，由於其為動滑輪裝置，受到兩個張力 T 向上作用，因此總向上力為 2T。其受力情況如下：

    (1)向上的力：2T。

    (2)向下的重力：$M_{2}$g＝1×10＝10（N）

    由於 $M_{2}$ 的加速度量值為 $\frac{a}{2}$，根據牛頓第二運動定律：

    2T－$M_{2}$g＝$M_{2}$×$\frac{a}{2}$

    ⇒ 2T－10＝1×$\frac{a}{2}$

    ⇒ 2T－10＝$\frac{a}{2}$ ……………②

    為了消去 T 或 a，由①表示 T＝20－2a，將 T 代入②中可得

    2（20－2a）－10＝$\frac{a}{2}$

    ⇒ 40－4a－10＝$\frac{a}{2}$

    ⇒ 30－4a＝$\frac{a}{2}$

    ⇒ 30＝$\frac{9a}{2}$

    ⇒ a＝$\frac{30\times 2}{9}$＝$\frac{60}{9}$＝$\frac{20}{3}$（m∕$s^{2}$）

    ∴$M_{1}$ 的加速度量值為 $\frac{20}{3}$ m∕$s^{2}$

    將 a＝$\frac{20}{3}$代①可得 T＝20－2×$\frac{20}{3}$ ⇒ T＝20－$\frac{40}{3}$＝$\frac{60-40}{3}$＝$\frac{20}{3}$（N）

    根據以上計算結果：

    (1) $M_{1}$ 的加速度量值為 $\frac{20}{3}$ m∕$s^{2}$。

    (2)拉動 $M_{2}$ 的繩張力 $T_{2}$＝2T＝2×$\frac{20}{3}$＝$\frac{40}{3}$（N）'
