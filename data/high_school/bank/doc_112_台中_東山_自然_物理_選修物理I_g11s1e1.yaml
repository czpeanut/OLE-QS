  section: 1
  number: 13
  type: single
  page: 3
  stem: '小楊老師測試一個浮力裝置，他將一個浮體放置水缸當中，並且描繪出其受力的情形，如右圖所示。

    ① $F_{B}$ 為浮力、W 為重力、$S_{1}$ 與 $S_{2}$ 為水對浮體的兩側壓力。

    ② $P_{1}$ 為大氣壓力，$P_{2}$ 為液體給予浮體的上壓力。

    ③浮體對地球的吸引力為 $F_{A}$（圖中未標示）。

    下列哪一組力是作用力與反作用力？'
  options:
  - label: A
    content: $F_{A}$ 與 $F_{B}$
  - label: B
    content: $S_{1}$ 與 $S_{2}$
  - label: C
    content: $P_{1}$ 與 $P_{2}$
  - label: D
    content: $F_{A}$ 與 W
  - label: E
    content: $F_{B}$ 與 W
  assets:
  - key: s1_13_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e1/s1_13_f1.png
    crop:
      page: 3
      rect:
      - 444.0
      - 437.25
      - 565.1
      - 550.85
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(1) $F_{A}$ 是浮體對地球的吸引力（即浮體引力作用於地球）。

    (2) $F_{B}$ 是水對浮體的浮力，這是浮體受到的力。

    (3)這兩個力不是作用力與反作用力，因為它們作用在不同的相互作用（地球與浮體 vs 水與浮體）。

    (B)(1) $S_{1}$ 與 $S_{2}$ 是水對浮體的側向壓力，作用在浮體的兩側。

    (2)這兩個力並不是作用力與反作用力，而是水對浮體施加的壓力，它們並不符合作用力與反作用力的條件。

    (C) $P_{1}$ 與 $P_{2}$ 是大氣壓力在水體表面的壓力，並非作用在浮體上，且它們並不是作用力與反作用力。

    (D)(1) $F_{A}$ 是浮體對地球的吸引力（浮體對地球的引力）。

    (2) W 是地球對浮體的吸引力（浮體的重力）。

    (3)這兩個力大小相等、方向相反，且作用在不同物體上（地球與浮體），因此符合作用力與反作用力的條件。

    (E)(1) $F_{B}$ 是浮力（由水對浮體向上施加的力），而 W 是重力（地球對浮體向下的吸引力）。

    (2)雖然這兩個力大小可能相等，且方向相反，但它們並不是作用力與反作用力，因為它們不是由同一個相互作用產生的。'
