    content: 兩人直奔太巴塱部落是因為想要復興阿美族語
  - label: B
    content: 五十名種子教師可能是從紐西蘭來的毛利人
  - label: C
    content: 阿美族與毛利族的祖靈會堂建築、語言及神話類同，可推測與南島語族有關
  - label: D
    content: 毛利人教授覺得阿美族的故事很熟悉，可能是都為泛靈信仰的關係
  group_stem: Ⅱ、以下為有關臺灣阿美族與紐西蘭毛利人的報導： 臺灣被學界歸屬於南島語族的最北端，也很可能是南島語系的源頭之一，2012年來自紐西蘭的毛利族女教授Te Ripowai Higgins以及毛利語教師Winiata Vincent Whare抵臺，希望透過研討會傳授毛利語從瀕臨滅絕到復振的經驗，不過有趣的是在會議開始之前，兩人就直奔太巴塱部落。 一到部落，看見Kakita´an的型式和祖靈柱雕刻，竟與毛利人部落的Wharenui（會堂）極為相似，當場就問太巴塱部落頭目是否能在Kakita´an唱毛利人的禱歌，沒想到他們竟感動地說：「我們回家了!」 研討會第三天，兩位教授與五十名族語種子教師來到Kakita´an，太巴塱族人在Kakita´an燃起火堆，透過燃起的煙霧告訴祖靈紐西蘭的自己人回來了！Te Ripowai Higgins教授說，儘管是第一次來臺灣，但聽到阿美族祖先的神話故事卻很熟悉，證明臺灣原住民與毛利人真的是同源，來到這裡就像「受到祖靈的引領而回家，非常熟悉」。 最後教授希望此舉能夠揚起部落中的凝聚意識，使臺灣的原住民延續祖先傳下來的文化跟語言。頭目說，當他聽見兩位教授說自己是在洪水時代漂流到紐西蘭的自己人時，就想到遙遠的地方還有許多的親人，不禁感動流淚。
