  stem: 2014年起美國開始興建「達科他輸油管」，此地下油管預計將中西部北達科他州的頁岩油運送至墨西灣沿岸。此油管在興建之時便遭到多方人士反對，除了經濟發展和環境汙染間的平衡討論外，因油管所經土地多位於蘇族的保留區內，經過其祖先墳地，且有汙染其賴以維生的水源之虞，使之成為近期蘇族主導最大的抗爭事件。請問下列對題幹的理解何者正確？
