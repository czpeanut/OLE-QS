  section: 2
  number: 12
  type: single
  page: 2
  stem: 每年5月5日，墨西哥都會舉行慶祝活動，紀念1862年的一場戰役。當時，法國因墨西哥無力償債而出兵，起初被墨西哥打敗，但拿破崙三世繼續推進，在1864年建立一個政權，立奧地利帝之弟為「墨西哥皇帝」。直到1867年，墨西哥人才在美國協助下推翻此一政權，重建共和政府。美國何以到1867年才介入此事？
  options:
  - label: A
    content: 美國南北戰爭結束後，始有餘力加干涉
  - label: B
    content: 美國因德州問題與墨西哥交惡，遲不介入
