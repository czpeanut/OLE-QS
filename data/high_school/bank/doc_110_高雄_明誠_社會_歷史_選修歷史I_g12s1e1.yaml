  group_stem: Ⅴ、以下兩則資料出自一本大約三百年前的暫居巴達維亞的討海人航海日誌。 資料一：我們沿著洋流一路往南，在海上漂流了好幾天，空氣也愈來愈像冬天，終於看到右前方有一片巨大的陸地，不過我們的目的並非那裡，然後依靠西風停靠在左邊的島的西岸，大夥兒稍作休息就在一間工作站的房子裡住著，大約等待三到五天，我們就會開始結伴獵捕海豹跟鯨魚，海豹的皮可以做成皮製品，而鯨魚的油更是值錢，不但可以潤滑，還可以點亮故鄉現代化大城市的夜晚！除此之外，我們也會在航程結束前幾天，去當地採集一些自然資源像是亞麻、高品質的木材，這也許能稍稍彌補我們的成本。 資料二：回想這趟航程，捕鯨跟獵海豹的成果實在差強人意，鯨魚愈來愈少了，而且這次最後一天還有團隊商船加入，他們比我們有效率多了，我開始對於這個行業的未來感到擔憂……。準備返航的前幾天，我進入小鎮的市集逛逛，看到當地的居民竟然也有白人，我上前去打招呼詢問，他說自己是最近幾年搬到這裡，還跟我說只要用一點點鐵器或者當地沒有的火槍跟原住民交換，想要成為擁有大片莊園的主人也是輕輕鬆鬆呢!他得意的嘴角跟我此刻的心情形成強烈對比，我一邊思考著原住民為何需要火槍，也一邊思考下一次我是不是也該把妻子跟孩子都帶過來……。
