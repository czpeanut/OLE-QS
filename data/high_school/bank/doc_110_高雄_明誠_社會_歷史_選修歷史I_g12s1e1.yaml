  group_stem: Ⅳ、資料一： 美國語言學家魯茲（Richard Ruiz）將語言規劃成三個階段：1.把語言當作問題；2.把語言當作權利；3.把語言當作資源。根據魯茲的論述判斷，臺灣剛跨過第一個階段，而紐西蘭的語言規劃則已經到第三階段。然而紐西蘭政府在處理原住民語言時並非一開始就如此完善，初期認為毛利語是製造族群對立的問題而打壓；後來過渡到消極應付，不反對原住民族使用毛利語但也不肯定其法律地位；直到近代才承認毛利語與英語具有同等官方語言的地位，並將其視為拓展紐西蘭在國際影響力、發展軟實力的國家寶貴資產，讓紐西蘭變成世界各國眼中的「世界級母語與原住民政策模範國」。 資料二： 「語言巢制度」是種專門針對出生到6歲的學齡前兒童所設計，它結合了母語教學與公共托嬰功能。讓父母上班前將幼兒送到部落的「集會所」，由該地區會說族語的者老們授課，在早上九點至下午三點期間內進行全毛利語的沉浸式教育。「家族發展計劃」於都市成立「毛利人社區中心」，將毛利部落「集會所」的功能延伸到都會社區，讓都市與部落語言文化重建速度能夠「同步連動」，而不是把某個偏鄉部落劃成與外界隔絕的原住民文化保護區，此種做法也能夠消除「都市現代化」和「保留原鄉文化」之間的衝突性，並且全面建立毛利文化價值觀，使毛利語復興運動變成一整個文化的復甦。
