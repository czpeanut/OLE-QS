  stem: 二戰的爆發，紐西蘭派遣軍隊協助英國作戰，成年男性召募前往戰場，也讓農牧業生產工作空缺出來了，婦女紛紛走出家庭代替男性工作，不少原本生活在郷間的毛利人也前往都市投入生產。二戰後期，日軍自珍珠港事件後南侵，使紐西蘭惶恐不安，美軍來紐協防後，雖使戰爭局勢穩定，但美國尚有歧視有色人種的傳統，故毛利人亦受到歧視，在走入都市以及面對其他白種人歧視下，使毛利人感受到自己權益被漠視。請問毛利人在經過第二次世界大戰後的轉變，下列敘述何者正確？
