  type: single
  page: 1
  stem: 以下是一段來自紐西蘭毛利人的自白：好幾百年前，白人開始進入了我們的土地，他們很厲害，用會發光的管子對著我們，然後我們的祖先就一個個的倒下了，我們害怕死亡，所以最後投降了，後來我們開始割草、鋸木跟狩獵，我們的村子愈來愈空曠，樹都不見了……。祖先們說，再這樣破壞下去我們的祖靈會懲罰我們，但我們沒辦法，我們害怕會發光的管子，結果有一天，村子裡很多人開始生病了，死了更多的人，這肯定就是祖靈告訴神明降災在我們身上了。關於這段文字，下列敘述何者正確？
  options:
  - label: A
    content: 生病死去的原因可能是天花跟麻疹
  - label: B
    content: 村裡的人生病死去是因為毛利人的祖先在警告他們
  - label: C
    content: 毛利人開始大量採集狩獵自然資源是因為白人答應要幫他們蓋現代的房子，所以需要更多的糧食跟木材
  - label: D
    content: 發光的管子是現代雷射武器
