  stem: 以下是一篇有關毛利人信仰、習俗與禁忌的文章： 毛利人是目前已知最早定居紐西蘭的族群，他們的信仰上屬於多神教，相信萬物有靈，族群內部有祭司與巫師，神話傳說也與大自然有關，並透過歌曲舞蹈流傳坊間。他們相信靈魂不滅，意即人死後靈魂還會存在這世上，所以他們特別重視先人留下來的東西，像是綠寶石做成的提基（Tiki）雕像，祖靈會透過這些東西保佑還活著的人；對於喪禮，一但得知親朋好友有人過世，所有人都會放下手上的工作前去弔祭。此外，他們也不喜歡拍照或攝影，覺得這是沒禮貌的行為。 毛利人有個特殊的「碰鼻禮」，這是由於毛利人相信人的靈氣都在頭上，透過鼻子可以與人相通，所以當毛利人與客人碰鼻，代表彼此交流，通常是碰兩下到三下，時間愈久、次數愈多代表兩人之間的關係愈好。關於男女兩性的習俗有兩個，第一個是毛利人在互許終身前，男女會先同居一段時間，確認彼此適合長久地生活下去才结婚；第二個很多場合毛利人會避免男子與女子同時參加一些場合，所以會設有男子場以及女子場，下次到紐西蘭旅遊，可别被嚇到了！ 依照題幹所述，下列關於毛利人傳統習俗與禁忌的論述何者適當？
  options:
  - label: A
    content: 毛利人舉行活動竟然分成男女兩場，是一種性別歧視
  - label: B
    content: 毛利人在婚前就同居，代表他們在兩性關係上是很開放的
  - label: C
    content: 碰鼻禮就像是其他文化的擁抱、握手、點頭示意或者鞠躬一樣，是交流彼此重要的方式
  - label: D
    content: 不論時地都會前去親友的喪禮，除了代表對於亡者這一生的敬重之外，也希望能受到保佑
  - label: E
    content: 毛利人至今都有祭司跟巫師，這可能與他們維繁傳統的思想有關
