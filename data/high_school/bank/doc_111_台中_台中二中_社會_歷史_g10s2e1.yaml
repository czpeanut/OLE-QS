  group_stem: '請閱讀以下兩段資料：

    資料一：「此時期的朝鮮因為君王有感於當地語言沒有文字，常以漢字為書寫工具。由於韓語與漢語是完全不同的語系，使用漢字記錄韓語是一件很不容易的事，加之一般百姓不懂得漢文，非常不利於文化的交流與發展。因此創造適合標記韓語語音的字母。這些文字當時被稱作『訓民正音』，意為『教老百姓以正確的字音。』」

    資料二：「自古九州之內，風土雖異，未有因方言而別為文字者。唯蒙古、西夏、女真、日本、西蕃之類，各有其字，是皆夷狄事耳，無足道者。《傳》曰：『用夏變夷，未聞變於夷者也。』歷代中國皆以我國有箕子遺風，文物禮樂，比擬中華。今別作諺文，舍中國而自同於夷狄，是所謂棄蘇合之香，而取螗螂之丸也；豈非文明之大累哉？」'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一指(D)李氏朝鮮世宗寫《訓民正音》，創造諺文。
