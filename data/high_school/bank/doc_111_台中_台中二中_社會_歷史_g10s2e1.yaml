  stem: 中國民間宗教起自宋朝，興盛於明清。這些民間宗教特性往往具備儒佛道三者的傳統信仰，甚至是透過上述儀式與理念進行反對政權的活動。試問以下哪些團體具備上述特徵？
  options:
  - label: A
    content: 白蓮教
  - label: B
    content: 羅教
  - label: C
    content: 拜上帝會
  - label: D
    content: 湘軍
  - label: E
    content: 淮軍
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 中國民間宗教多脫胎於佛、道，兼融傳統儒家思想，教義通俗而能快速流傳，但亦被有心人士利用進行反政權活動，明清時期最具代表性的民間宗教為(A)白蓮教與(B)羅教。白蓮教曾有元末的紅巾之亂、清中葉的川楚教亂；羅教信徒有許多為大運河的漕運水手，後發展出青幫組織，兩者符合題文所述。(C)拜上帝會假基督教勢力反對政權，太平軍所到之處毀廟焚書，不符合民間宗教「具備儒佛道三者的傳統信仰」條件。(D)(E)為民間團練，並非反對政權的民間宗教。
