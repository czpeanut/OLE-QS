- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 日本於 7 ～ 10 世紀間實行一種名為「班田制」的土地制度，內容如下：規定土地國有，六歲以上之公民，男子每人授田十一公畝，女子則為男子的三分之二，謂「口分田」，官員依等級另有授田，至於官奴婢與私奴婢亦各有授田。每六年一班，未及班而死亡者，田地歸公，既班者，田地終身受用，並負擔租庸調，死後官府收回土地。由題幹可知班田制主要參考了中國哪一土地制度？
  options:
  - label: A
    content: 井田制
  - label: B
    content: 王田制
  - label: C
    content: 占田制
  - label: D
    content: 均田制
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 班田制的規定為土地國有，再由政府按男女身分、官員等級分別授田，所授田地有「身死歸公」與「終身受用」兩種，這些規定皆與中國的均田制相近似，答案為(D)。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 魏晉南北朝時，僧人僧肇（384 ～ 414 年）提出菩薩為救度眾生，由自己之實身變化諸多分身，以度化大眾；實身在本地，分身則在他處，此種說法又稱「本地垂跡」。而此學說在 6 世紀中傳到日本，則專門針對日本傳統舊有「神道」中之神明去做解釋，如神道中的天照大神為大日如來的分身、愛宕權現為地藏菩薩的分身。請問關於「本地垂跡」在日本的運用，應做下列何者解釋？
  options:
  - label: A
    content: 為建立有別於中國的日本佛教
  - label: B
    content: 為使外來佛教更融入本地社會
  - label: C
    content: 為塑造佛學在宗教上的正統性
  - label: D
    content: 為使底層平民更容易學習佛學
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 佛教以「本地垂跡」的方式傳教，以菩薩化身去結合各地的固有神明，便能使當地人民更容易接受佛教信仰，在中國、日本皆是如此，故答案為(B)。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 中國中古時代一位學者對佛教評論如下：「神即形也，形即神也；是以形存則神存，形謝則神滅也……形者神之質，神者形之用；是則形稱其質，神言其用；形之與神，不得相異也。」對此評論，以下選項何者正確？
  options:
  - label: A
    content: 他認同佛教，認為形神為一體兩面
  - label: B
    content: 他質疑佛教，並認為形神說即排斥其他信仰
  - label: C
    content: 他認同佛教，形神合一即儒佛融合
  - label: D
    content: 他質疑佛教，認為形神理論反映佛教不可信
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中的「神」為靈魂，佛教主張靈魂不滅即「神不滅」，而這位學者主張「形存則神存，形謝則神滅」，因此可知其立場為質疑佛教，(D)為正解。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「這個時代的這群人」是儒學堅定的支持者，是政府與民眾的中間人，同時也可以展現好幾種不同面孔。對民眾而言，他們可以為之爭取權益，主持公道，但也可能勾結官府，魚肉鄉民；對統治者而言，他們可以協助國君管理地方秩序，強化控制，但也可能政策施行時因為牴觸他們的利益，遭到他們集體抵制。上述題幹的「這個時代的這群人」是指以下哪一選項？
  options:
  - label: A
    content: 西周，諸侯
  - label: B
    content: 魏晉，世族
  - label: C
    content: 唐宋，行會
  - label: D
    content: 明清，士紳
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)不會是「儒學堅定的支持者」，因此這群人應為明清時期的士紳階級，故答案選(D)。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某一人物的歷史記載如下：一生主要從事煉丹與醫學，既是一名儒道合一的宗教理論家，也是從事醫療活動與研究的醫學家。「他」著書對神仙思想總結，證明長生神仙是可以修得的，在道教歷史發展有極為重要的意義。試問題幹中的「他」為何人？
  options:
  - label: A
    content: 張陵
  - label: B
    content: 張魯
  - label: C
    content: 葛洪
  - label: D
    content: 寇謙之
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為葛洪的作為，著有《抱朴子》與《肘後備急方》，建立道教的理論基礎，並從理論上確立了修道可以成仙不死的基本教義，極力推崇煉丹術，故答案為(C)。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '請閱讀以下兩段資料：

    資料一：「婚姻中講求門當戶對是一種普遍現象，不過它並非世族門閥式的，而是品官高低與財產多寡間的門當戶對，隨著經濟條件的變化及任官制度的發展，一部分有遠見的官僚與富人，在挑選女婿時不過分注重男方眼前的狀態，是重視他的未來發展，從而出現婚姻中愛才的觀念。成語『榜下捉婿』與『這個時代』婚姻情況有著高度相關。」

    資料二：「原本對婦女改嫁的問題並不忌諱，有些還傳為美談；但是到了『這個時代』，要求婦女守節，反對婦女再嫁的情況就日益增多。」

    請問上述兩段資料的中的「這個時代」最早出現於以下哪一時代？'
  options:
  - label: A
    content: 唐代
  - label: B
    content: 宋代
  - label: C
    content: 元代
  - label: D
    content: 明代
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一中提到的門當戶對，因經濟與任官制度的改變轉而重視女婿的未來發展，並非傳統的世族門閥式；資料二提到這個時代要求婦女守節，反對婦女再嫁者日多。綜合兩則資料，這個時代應是經濟日益發達，社會流動快速且重視儒家禮教的時代，最早出現於宋代，答案為(B)。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 這時代因為商業繁榮，棄儒從商的人數增多，但他們也將倫理道德作為從商的原則，比如誠信優先、以禮待人等。試問這時代為以下何者？
  options:
  - label: A
    content: 魏晉時代
  - label: B
    content: 隋唐時代
  - label: C
    content: 宋元時代
  - label: D
    content: 明清時代
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 此時期「棄儒從商」者眾，但也將「倫理道德作為從商的原則」，可推知為商業繁盛的明中葉以後，答案為(D)。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 史籍記載：「（譯文）現在國土有五個方圓一千里的地方，可是能種莊稼的田地還不能占到十分之二，井田數不到一百萬，國中的湖泊、沼澤、山谷、溪流、大山、大河中的原材料、財寶又不能全部被利用。……現在大王發布大的優惠政策，凡是鄰國來歸附的人，立刻免除他們三代的徭役賦稅，不用參加作戰。四界之內的土地，十年不收賦稅，並把這些都寫在法律中，足夠招來上百萬的人。……大王為什麼還要吝嗇爵位，捨不得免除役賦呢？」判斷上文，此應是哪一時期的臣子建言？以及政策宗旨為何？
  options:
  - label: A
    content: 西周，收歸土地國有
  - label: B
    content: 戰國，招徠移民開墾
  - label: C
    content: 西漢，削弱地方豪強
  - label: D
    content: 新莽，預防貧富不均
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從「井田數不到一百萬」，到「十年不收賦稅……招來上百萬的人」，可知此時期的井田制度已經衰微，這位臣子因此建議國君以不收賦稅方式招徠移民開墾土地，故(B)選項最為適宜。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 著名的明末清初學者黃宗羲，對於中國歷代的賦稅制度問題，曾提出這樣的看法：「（譯文）唐初行租、庸、調的賦稅方法，……有田土的出租、有人戶的出調，有丁口的出庸。楊炎變租、庸、調為兩稅法，人無丁中，以貧富為差別，租、庸之名雖然不見了，但其實是把庸、調納入租裡面了。兩稅法相沿至宋代，沒有減庸、調於租內，反而又徵收錢米作為丁身的賦稅。後世以此為心安理得，認為兩稅指的就是租賦，丁身指的就是庸，豈不知，這實際上是重疊的賦稅。假使庸、調之名不去除，何至於此！所以，楊炎的兩稅法於一時之利少，而帶給後世莫大的弊害。」請問關於他的看法，下列解釋何者正確？
  options:
  - label: A
    content: 兩稅法後走向單一賦稅，卻常因缺錢在此賦稅上增加額度
  - label: B
    content: 政府經常將繁多稅賦簡化，但往後又加徵稅項，稅上加稅
  - label: C
    content: 宋徵收丁身賦稅，實為重複徵收唐代租庸調制度的「租」
  - label: D
    content: 兩稅法與宋代的賦稅，將繁雜的賦稅項目簡化，便民利民
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)庸、調之名不去除，因此並非走向單一賦稅。(C)丁身賦稅應為租庸調制度的「庸」。(D)宋代沒有減庸、調，反而又徵收錢米作為丁身的賦稅，因此使賦稅項目更加重疊，加重人民的負擔。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 西周封建時代，只有統治集團才有姓氏，主要是因為封建體制下，由諸侯向天子納貢，作為王室的經濟來源。東周時代，因為封建制度瓦解，農民成為國家租稅的對象，這些租稅又讓國家以此建立官僚系統。所以國家的運作與富強，有賴確立稅源的穩定，試問這與以下哪一制度的出現有關？
  options:
  - label: A
    content: 編戶齊民
  - label: B
    content: 井田制度
  - label: C
    content: 禮樂制度
  - label: D
    content: 宗法制度
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 在封建制度崩解之後，國家為掌控對百姓的租稅與勞役的基礎資料，因此出現編戶齊民制度，故答案選(A)。(B)(C)(D)三者為維繫封建體制的重要制度。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 李唐王室因與老子同姓，常自稱為老子後裔，加上多位皇帝喜食丹藥以求長生，而製作丹藥正是道士專長，成為推崇道教原因之一。但是武后臨朝，卻提倡佛教，透過《大雲經》中「當來以女身作轉輪王，護持正法」一事，將佛教提升於道教之上。試問此舉是出於以下選項哪一原因、目的？
  options:
  - label: A
    content: 健康因素，唐初的皇帝多服食丹藥致死
  - label: B
    content: 外交因素，希望提倡佛教改善對西域諸國關係
  - label: C
    content: 政治因素，佛教有利於日後稱帝之理論
  - label: D
    content: 經濟因素，打擊道教有利增加國家財政的收入
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「當來以女身作轉輪王，護持正法」一句，可知武后臨朝提倡佛教，主要原因是政治因素，日後可利用佛教理論稱帝，故答案選(C)。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 清嘉慶 15 年的科舉，將臺灣的應試考生類別分為閩籍、粵籍、郊籍三種。試問清廷將臺灣考生分出郊籍的原因可能為何？
  options:
  - label: A
    content: 臺灣治安混亂，保障郊商考生安全
  - label: B
    content: 臺灣偷渡盛行，避免郊商協助偷渡
  - label: C
    content: 臺灣械鬥頻繁，藉此避免郊商作亂
  - label: D
    content: 臺灣商貿發展，藉此拉攏商人勢力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 郊籍指具郊商身分，朝廷將應試考生特別分出郊籍一類，除可看出郊商的勢力頗盛外，且明顯有拉攏的作用，(D)為正解。(A)保障考生安全無需特別列出郊籍。(B)嘉慶年間臺灣西部土地多已開發，偷渡之風大減。(C)郊商甚少參與械鬥。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 歷史上某一時期，皇帝下詔同意官員可依照等級申請 50 頃到 10 頃不等大小的田地使用權，同時也可以申請 50 戶到 1 戶不等，不列入國家戶籍的人力。請問該制度對應的時代與團體為以下何者？
  options:
  - label: A
    content: 西漢的外戚
  - label: B
    content: 西晉的世族
  - label: C
    content: 北宋的宗族
  - label: D
    content: 清初的八旗
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為西晉的占田制，其訴求對象為世族，(B)為正解。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 以下哪個描述最符合道教信仰對常民生活的影響？
  options:
  - label: A
    content: 「修道長生以成仙」，反映人們對生命延續的渴望
  - label: B
    content: 提供盛世時強化政權；亂世時百姓心靈寄託的功能
  - label: C
    content: 接受這輩子的磨難考驗，以祈求來世獲得更好生活
  - label: D
    content: 強調「內外兼修」方式，提供國家有效的治理對策
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 選項中以(A)最符合道教對「常民生活」的影響。(B)(D)「強化政權」、「有效的治理對策」與常民生活無關。(C)道教追求現世的生活，與祈求來世獲得更好生活的佛教不同。
- id: doc_111_台中_台中二中_社會_歷史_g10s2e1_s1_15
  section: 1
  number: 15
