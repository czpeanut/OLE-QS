  stem: 某學者在談到井田制度的崩壞時，提出了下面的說法：「昔人皆怪罪商鞅廢井田開阡陌之作法，然而商鞅一人，為何能夠毀壞三代的成法？而且秦國之井田如果是商鞅所破壞的，那麼其他六國又是誰破壞的呢？其實，井田制度的廢除，實在是因為地狹人稠，而政府不給予授田。商鞅為了珍惜地力，避免浪費，而希望能大幅度開墾。開墾多則賦稅也會增長，掌握土地的君主，亦必然會因為這樣的利益而暗中允許這樣的行為，而商鞅乃是將原本的非法行為合法化。」根據以上的說法，下列的解讀或推論，哪些選項正確？
  options:
  - label: A
    content: 商鞅廢井田開阡陌之作法，是土地私有化最主要的原因
  - label: B
    content: 人口增長使井田制度難以維持，商鞅的變法是因應時勢
  - label: C
    content: 民間私下形成的土地私有制，應早於商鞅的變法
  - label: D
    content: 國君為了增加賦稅，也希望能擴大土地的開墾
  - label: E
    content: 商鞅的變法引領六國，使國家土地所有權公有化
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)根據題文內容，土地私有化的最主要原因是地狹人稠，政府又不給予授田所致。(E)商鞅的變法，使國家土地所有權私有化。
