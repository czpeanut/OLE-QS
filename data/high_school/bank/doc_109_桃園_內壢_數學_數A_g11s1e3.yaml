  stem: '▲ 夜晚的天空無數的星星閃爍其中，有些明亮耀眼，有些黯淡無光，但因星星和地球的距離各不相同，究竟要如何判斷其亮度是因本身的發光強度，或是因距離地球遠近所致呢？ 假設M代表絕對星等 ( 絕對星等的數字越小，代表恆星越亮 )，換句話說，就是恆星真正發光的強度；m代表視星等，也就是在地球所見恆星的亮度，d則代表距離，$d_{0}$則為標準距離單位，大約等於32.616光年，三者之間的關係是 M＝m＋5 $log_{10}$ ($\frac{d_{0}}{d}$)，據此可用以判斷實際恆星本身發光的強度。若由地球所測量出來的數據，北極星與織女星的視星等分別是2和0，距離分別是431光年與26.5光年。( 參考資料《科學發展》2017年9月537期 ) ( 已知$log_{10}$ 3.2616 ≈ 0.5134，$log_{10}$ 4.31 ≈ 0.6345，$log_{10}$ 2.65 ≈ 0.4232 )。試回答下列問題：

    (1) 下列何者正確？

    (2) 請問北極星與織女星何者比較亮？'
