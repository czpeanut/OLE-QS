- id: doc_109_桃園_內壢_數學_數A_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設a＞0，a≠1關於y＝$a^{x}$，與y＝$log_{a}$ x，x為實數之圖形的敘述，下列何者為真？
  options:
  - label: A
    content: y＝$a^{x}$的圖形向右上升
  - label: B
    content: y＝$log_{a}$ x的圖形，當a＞1時，凹口向下
  - label: C
    content: y＝$a^{x}$圖形恆過點 ( 1 , 0 )
  - label: D
    content: y＝$a^{x}$之圖形與y＝$a^{－x}$之圖形對稱於x軸
  - label: E
    content: y＝$a^{x}$之圖形與y＝$log_{a}$ x之圖形對稱於直線y＝x
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：當0＜a＜1時，y＝$a^{x}$的圖形向右下降。 (B) ○：如右圖。 (C) ×：y＝$a^{x}$恆過點 ( 0 , 1 )。 (D) ×：y＝$a^{x}$與y＝$a^{－x}$對稱於y軸。 (E) ○：設 ( r , s ) 為y＝$a^{x}$上一點，可得$a^{r}$＝s ⇒ r＝$log_{ a}$ s ⇒ ( s , r ) 為y＝$log_{ a}$ x上一點， 所以y＝$a^{x}$與y＝$log_{ a}$ x對稱於y＝x。 故選(B)(E)。
- id: doc_109_桃園_內壢_數學_數A_g11s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 設a是不等於1的正數，x∈R，x≠0，y∈R，y≠0，則下列何者必成立？
  options:
  - label: A
    content: $log_{a}$ $x^{2}$＝2 $log_{a}$ x
  - label: B
    content: $log_{a}$ xy＝$log_{a}$ x＋$log_{a}$ y
  - label: C
    content: $log_{a}$ ( $x^{2}$＋x＋1 )$^{2}$＝2 $log_{a}$ ( $x^{2}$＋x＋1 )
  - label: D
    content: $log_{a}$ ( $x^{2}$＋1 )$^{3}$＝ 3 $log_{a}$ ( $x^{2}$＋1 )
  - label: E
    content: $log_{a}$ $x^{4}$＝2 $log_{a}$ $x^{2}$
  answer:
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：$log_{ a}$ $x^{2}$＝$\frac{\log x^{2}}{\log a}$＝$\frac{2\log |x|}{\log a}$＝2 $log_{ a}$ | x |。 (B) ○：$log_{ a}$ xy＝$\frac{\log xy}{\log a}$＝$\frac{\log x+\log y}{\log a}$＝$log_{ a}$ x＋$log_{ a}$ y。 (C) ○：因為"x ∈ R，$x^{2}$＋x＋1＞恆成立， 所以承(A)可知，$log_{ a}$ ( $x^{2}$＋x＋1 )$^{2}$＝2 $log_{ a}$ ( $x^{2}$＋x＋1 )。 (D) ○：承(C)可知，正確。 (E) ○：承(C)可知，$log_{ a}$ $x^{4}$＝$log_{ a}$ ( $x^{2}$ )$^{2}$＝2 $log_{ a}$ $x^{2}$。 故選(B)(C)(D)(E)。
