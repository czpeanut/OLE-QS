  explanation: (A) ○：M＝200×( 1＋0.3＋0.5 )＝360 ( 萬 )。 (B) ×：承(A)可知，錯誤。 (C) ○：K＝1200×( 1＋$\frac{0.06}{12}$)－360＝846 ( 萬 )。 (D) ○：N＝1200×( 1.005 )$^{5}$－200×( 1.005 )$^{4}$－200×0.8×( ( 1.005 )$^{4}$＋( 1.005 )$^{3}$＋( 1.005 )$^{2}$＋1.005＋1 ) ≈ 1200×1.025－200×1.02－160×( 1.02＋1.015＋1.01＋1.005＋1 )＝218。 (E) ×：承(D)可知，錯誤。 故選(A)(C)(D)。
