  - label: E
    content: '1.5'
  group_stem: '網球比賽是力與美的運動，處處都可看到物理學的展現與原理。網球的最高殿堂為四大公開賽（法網、溫網、美網、澳網）各球場都是不同的材質：溫網為草地球場，法網為紅土球場，而美網和澳網為硬地球場（不同硬地係數）。表一為2009年個公開賽所記錄男子選手「著地擊球時間」其定義為：球著地開始到選手擊球所經歷的時間。會造成擊球時間差異的重要原因，來自於球場材質影響反彈後的球速。

    由於在標準尺寸的網球場內（如下圖），選手並沒有太多的時間去考慮回擊球，所以發球的好壞，很容易左右比賽結果。除了具有強力與技巧性的發球和截擊之外，底線抽球技術的好壞也是比賽中決定勝負的主要關鍵。「截擊」代表球未落地前即擊回，通常屬於快速攻擊，截擊的好可快速得分；「底線抽球」代表球員站在底線附近進行來回擊球，通常需要來回多拍。表二為分析公開賽中球員擊球得分的比例，因為球場的特性不同，在不同球場較容易得分的方法也不同。

