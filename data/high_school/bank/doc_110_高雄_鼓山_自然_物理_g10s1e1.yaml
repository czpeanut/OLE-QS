  stem: 在玻璃杯上方置放一紙板，如右圖所示，取一硬幣置於紙板中央，隨後抽拉紙板，有關硬幣掉落玻璃杯內的敘述，何者正確？
  options:
  - label: A
    content: 若往右緩慢拉動紙板時，硬幣會垂直落下
  - label: B
    content: 同(A)，硬幣會慣性而懸空靜止
  - label: C
    content: 同(A)，因為硬幣與紙板間存在著摩擦力，使得硬幣受摩擦力作用而隨之向右運動
  - label: D
    content: 若向右瞬間快速拉動紙板時，硬幣隨紙板一起向右運動
  - label: E
    content: 同(D)，硬幣呈現的現象可以用牛頓第二運動定律來說明
