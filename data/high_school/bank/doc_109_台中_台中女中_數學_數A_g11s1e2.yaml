  stem: 設集合 A＝｛x｜$log_{3}$（$x^{2}$－3x＋3）＜1，x$\in$R｝、B＝$\left\{ y \left| y = \sin \left( x + \frac{\pi}{2} \right) , x\in R \right. \right\}$，則 A 與 B 交集內的元素可為下列何者？
