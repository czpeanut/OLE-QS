  explanation: 'log（$3^{100}$×$2^{50}$）＝100 log3＋50 log2$\approx$100×0.4771＋50×0.3010＝62.76

    ∴a＝62＋1＝63，又 log5＜0.76＜log6$\Rightarrow$b＝5

    ∵$2^{1}$ 的個位數字為 2，$2^{2}$ 的個位數字為 4，

    $2^{3}$ 的個位數字為 8，$2^{4}$ 的個位數字為 6，

    $2^{5}$ 的個位數字為 2，……

