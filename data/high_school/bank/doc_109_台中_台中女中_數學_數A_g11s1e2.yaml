- id: doc_109_台中_台中女中_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設 x 與 y 的關係式為 y＝$20\times \log _{2}\left( \frac{x}{3} \right) ^{2}$，且當 x＝$x_{1}$、$x_{2}$ 時，其對應的 y 值分別為 $y_{1}$、$y_{2}$，其中 $x_{1}$、$x_{2}$ 皆為正實數。若 $x_{1}$＝$2x_{2}$，則對於 $y_{1}$ 與 $y_{2}$ 的關係，試選出正確的選項。
  options:
  - label: A
    content: $y_{1}$＝$2y_{2}$
  - label: B
    content: $y_{1}$＝20 $log_{2}y_{2}$＋20
  - label: C
    content: $y_{1}$＝20 $log_{2}y_{2}$＋$log_{2}$20
  - label: D
    content: $y_{1}$＝$y_{2}$＋1
  - label: E
    content: $y_{1}$＝$y_{2}$＋40
  explanation: '$y_{1}$＝$20\log _{2}\left( \frac{x_{1}}{3} \right) ^{2}$＝40（$log_{2}x_{1}$－$log_{2}$3） ……………①

    $y_{2}$＝$20\log _{2}\left( \frac{x_{2}}{3} \right) ^{2}$＝40（$log_{2}x_{2}$－$log_{2}$3）……………②

    ②－①得 $y_{2}$－$y_{1}$＝40（$log_{2}x_{2}$－$log_{2}x_{1}$）＝$40\log _{2}\frac{x_{2}}{x_{1}}$

    又 $x_{1}$＝$2x_{2}\Rightarrowy_{2}$－$y_{1}$＝$40\log _{2}\frac{1}{2}$＝－40

    $\Rightarrowy_{1}$＝$y_{2}$＋40，故選(E)'
  tags:
