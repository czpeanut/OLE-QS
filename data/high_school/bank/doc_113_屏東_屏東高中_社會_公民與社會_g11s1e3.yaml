- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2024 年由荷蘭概念藝術師 Florentijn Hofman 所創作的巨型藝術品「黃色小鴨」睽違 10 年後，再次在港都颳起旋風。將近 30 天的展期吸引 900 萬人次觀賞，也造成民眾對小鴨周邊商品的需求大增，而 140 億的觀光財更讓相關業者笑開懷。雖然如此，但如果廠商無法立刻提高產能，縱使民眾願以兩倍的價格購買，也無法解決黃色小鴨周邊商品供不應求的問題。根據以上的敘述，請問下列有關黃色小鴨周邊商品價格措施及其對經濟福祉的影響，何者敘述正確？
  options:
  - label: A
    content: 提高黃色小鴨周邊商品價格可降低需求數量，但會降低整體的經濟效率
  - label: B
    content: 提高黃色小鴨周邊商品價格可提高供給數量，有助提高生產者剩餘
  - label: C
    content: 限制黃色小鴨周邊商品維持原有價袼，可讓經濟福祉的損失達到最低點
  - label: D
    content: 限制黃色小鴨周邊商品維持原有價格，可保障消費者權益及增加經濟效率
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正確敘述。(B)因為交易數量不一定會成長，因此，生產者剩餘不一定會提高。(C)(D)限制價格違反自由市場的精神，反而會減損經濟福祉及經濟效率。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 牛肉批發商人阿霞從臺南善化購入一批價值 15 萬的牛肉，他將一部分牛肉以 13 萬賣給城邊牛肉湯店，城邊牛肉湯店將這些牛肉製成牛肉湯賣給消費者，共販售 20 萬；另一部分牛肉則製作成牛肉丸，以 13 萬賣給城邊牛肉湯店販售，城邊牛肉湯店又將這些牛肉丸以 20 萬的總價賣給消費者，請問這批牛肉的買賣行為一共為國內增加多少 GDP？
  options:
  - label: A
    content: 26 萬
  - label: B
    content: 40 萬
  - label: C
    content: 51 萬
  - label: D
    content: 81 萬
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 國內生產毛額（GDP）是衡量本國（或一定地區）疆域以內所有常住生產機構或單位的生產成果（附加價值），不論生產要素來自本國或外國。而 GDP 是計入最終財，因此賣給消費者的部分為牛肉湯 20 萬及牛肉丸 20 萬，共 40 萬，故選(B)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 稻產大國印度為了面對糧食價格飆升引發的通膨危機，限制香米每公噸出口價格不低於 1,200 美元，以確保國內穩定供應。請問上述所描述的政策方式與下列何者最為接近？
  options:
  - label: A
    content: 為友善社工之職場環境，政府訂定民間社工的基本工資為 34,916 元
  - label: B
    content: 紐約市規定房子一旦出租，房租的升幅不能超過每年平均工資增加幅度和通膨幅度
  - label: C
    content: 政府規定東港櫻花蝦每艘漁船最多只能捕 11 箱，每箱不超過 21 公斤
  - label: D
    content: 經濟部召開電價審議委員會，決定 2024 年 4 月起，農漁、學校、社福團體維持電價凍漲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 限制香米出口價格不低於 1,200 美元，屬於價格下限的做法；政府訂定市場中可合法進行交易的最低價格，此價格往往比市場均衡價格高，用以保護生產者及勞工，與(A)相同。(B)(C)(D)屬於價格上限，指政府訂定市場中可合法進行交易的最高價格，此價格往往比市場均衡價格低，用以保護消費者權益。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 日本漫畫《航海王》其中一段說，主角們來到充滿東洋風情的「和之國」，然而和之國卻隱藏著許多不平等的情況。原因是和之國受控於大海賊「凱多」，為賺取更多的金錢，凱多將和之國多數地區用於生產生化武器，使得和之國的河水與土壤飽受汙染，人民失去良田，飢餓度日，痛苦不堪。請問若以經濟學的概念說明和之國的情況，以下何者的說明最為合理？
  options:
  - label: A
    content: 魯夫：凱多為了生化武器的生產使得農民的良田汙染，造成外部成本
  - label: B
    content: 娜美：河水的財產權不明確，河水汙染使農民損失外部效益
  - label: C
    content: 索隆：農民飢餓度日是因為資源有限，為私人效益減少所造成的問題
  - label: D
    content: 羅賓：凱多為生產生化武器所負擔的成本，包括私人成本與外部成本
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正確敘述。(B)農民損失為外部成本。(C)資源有限而導致必須選擇，此與私人效益減損無關。(D)凱多所負擔的成本僅為私人成本，而外部成本由當地人民承擔。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 各國通常會估算一個國家在一段時間生產的總成果，分別由支出面與生產面估算，來表示一個國家的經濟活動狀況，最常用來衡量的指標為 GDP 及 GNI。請問下列敘述何者正確？
  options:
  - label: A
    content: 政府發放給農民的補助費可計入 GDP 中
  - label: B
    content: 外公將耕種的稻米留下 30 斤自用可計入 GNI 中
  - label: C
    content: 友志在士林夜市擺地攤的收入可計入 GDP 中
  - label: D
    content: 可欣在愛車聯盟購買二手車可計入 GNI 中
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)補助費屬於移轉性支出，不計入 GDP。(B)農民自用稻米可計入 GDP，為正解。(C)攤販屬於地下經濟，不計入 GDP。(D)二手車在當年度被生產出來時已計算過 GDP，再度買賣時就不再計入。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 空汙法規加嚴，逾 10 年汽機車要符合環保四期排放標準，臺中市政府指出，市民期盼呼吸好空氣，中市有全國最優渥的二行程機車汰換電動車補助，現已淘汰 60 ％以上。關於此項補助，下列敘述何者正確？
  options:
  - label: A
    content: 補助後二行程機車的市場需求曲線會向右移動
  - label: B
    content: 補助後電動機車的市場供給曲線會向左移動
  - label: C
    content: 補助措施是透過外部成本內部化，以減少環境汙染
  - label: D
    content: 若此項政策成功，則補助後電動車的均衡點應於補助之前的均衡點右方
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)補助後會使需求量增加，是點在線上移動。(B)如果是補助給消費者，不會影響供給。(C)補助應是增加電動車帶來的外部效益，而非解決外部成本。(D)補助後會使交易數量增加，而使新均衡點在舊均衡點之右方，為正解。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 依《公平交易法》規定，廠商直接或間接妨礙公平競爭而影響消費者權益的行為，為「不公平競爭行為」。以下何者較符合《公平交易法》所規定的「不公平競爭行為」？
  options:
  - label: A
    content: 美國特斯拉公司將全球狂銷，車款調漲了五至六萬臺幣
  - label: B
    content: 正逢砂石短缺，五家預拌混凝土業者同時間調漲價格
  - label: C
    content: 某業者因不實宣稱其「天井燈」產品榮獲節能標章而遭罰
  - label: D
    content: 公平會禁止好樂迪、錢櫃兩家業者合併
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 不公平競爭包含：妨礙公平競爭的行為，指以不當獲取其他事業之產銷祕密，以脅迫、利誘等方式不當攬客。也包含不誠實的競爭行為，指以仿冒方式或是以虛偽不實的記載或廣告，引人錯誤的認定。(A)此屬於自由競爭的情形。(B)此為聯合行為之範疇。(C)此符合不誠實競爭行為，屬於不公平競爭之情形，為正解。(D)此屬於結合行為之範疇。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 桃園龜山區空屋量高居全臺之冠，呈現嚴重供過於求現象。房地產專家分析，目前當地建商出清空屋外，還有許多投資客準備出售。但龜山緊鄰林口、新莊，有大臺北地區宜居特性，等到周邊建設陸續到位，有機會提升買氣。根據此專家分析，未來龜山地區房地產市場的成交價與成交量應呈現何種變化？
  options:
  - label: A
    content: 成交價與成交量同時減少
  - label: B
    content: 成交價與成交量同時增加
  - label: C
    content: 成交價減少，成交量未定
  - label: D
    content: 成交價未定，成交量增加
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 文中指出「建商清空空屋、投資客準備出售」，屬於供給增加；而「因宜居特性有機會提升買氣」屬於需求增加，在此種情形下，會使成交量增加，成交價未定，故選(D)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 有篇美國的文章這樣寫道：「我的 T 恤來自中國。它可能是在 1998 年底離開上海，幾星期後抵達邁阿密的港口……儘管必須面對配額、關稅和中國官僚體制，中國還是可以用最好的價錢生產最好的 T 恤。」從文章中我們可以推測出下列哪個敘述是正確的？
  options:
  - label: A
    content: 紡織業對美國及中國而言屬於弱勢產業需要保護
  - label: B
    content: 運用限制進口的貿易政策是無效的
  - label: C
    content: 進口 T 恤造成美國工人失業問題嚴重
  - label: D
    content: 中國生產 T 恤具有比較利益
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)對中國而言，紡織業並非弱勢產業。(B)可以看出即使有配額、關稅及官僚體制等情形，中國的 T 恤仍可以用最好的價錢出口，可見限制進口貿易無效，為正解。(C)從文中無法看出美國工人是否失業。(D)從中國可以用最好的價錢生產最好的 T 恤，可以看出其具有絕對利益。（學校給的答案為(A)，筆者認為應選(B)）
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 下列何者符合「外部效果」的現象敘述？(甲)夜市裡人潮滿滿，使得附近住戶的生活品質不佳(乙)國際原物料上漲，使得國內衛生紙紛紛調漲價格(丙)雙薪家庭愈來愈多，市場上的托兒所也愈來愈多(丁)由於鄰居在陽臺上種滿香花，而隔壁的小華只能緊閉門窗避免花粉過敏(戊)為降低室內油煙量，小吃店增置抽風設備、並將油煙直接排放到馬路上
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲丁戊
  - label: D
    content: 乙丁戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「外部成本」、「負的外部性」、「負效益」意指行為人的行為對不相關第三者產生負面影響，使第三者間接承擔成本，(甲)(丁)(戊)屬之，選(C)。(乙)(丙)屬於市場機能的運作。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 為防止市場自由競爭秩序被廠商的聯合行為破壞，令消費者權益受損，所以政府制定《公平交易法》來維持公平競爭及市場機能，在經濟市場扮演監督跟介入的角色。請問下列何者屬於《公平交易法》所禁止的行為？
  options:
  - label: A
    content: 企業出現共同研發新產品和降低生產成本的行為
  - label: B
    content: 各家手搖飲店因應原料上漲，各自調高飲料價格
  - label: C
    content: 兩家美妝保養品公司合併，合併後市占率約 1∕10
  - label: D
    content: 皮老闆以不當方式獲取蟹堡王餐廳的獨家醬料配方
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)屬於合法的企業經營策略。(D)屬於妨礙公平競爭的行為，為《公平交易法》所禁止之行為，為正解。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 哥倫比亞因國內高血壓、心血管疾病患者過多，為降低心血管疾病發生率，於 2023 年 11 月通過《垃圾食物法》。被列管為「超加工食品」（工業生產的即食食品以及高鹽、高飽和脂肪產品），如洋芋片等，即刻起徵收 10 ％的附加稅，2024 年提升到 15 ％、2025 年提高至 20 ％。關於哥倫比亞因應高血壓人數過多的政策，從處理外部成本的角度分析，與我國下列何者措施最相似？
  options:
  - label: A
    content: 臺北、新北市垃圾費採隨袋徵收方式
  - label: B
    content: 要求食品業者需標示食品添加物含量
  - label: C
    content: 制定《氣候變遷因應法》以課徵碳稅
  - label: D
    content: 疫情期間要求搭乘大眾運輸需戴口罩
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 哥倫比亞是以徵收附加稅的方式，解決超加工食品的外部成本。(A)此屬於使用者付費。(B)此為公開資訊。(C)屬於課稅方式，與本題雷同，為正解。(D)屬於直接管制的做法。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 1988 年臺灣仍處於《動員戡亂時期臨時條款》下的緊急狀態，人民基本權利受到嚴格限制。而各中央民意機構仍有過半以上代表不必改選，長年由 1940 年代大陸各省市選出者擔任，與臺灣社會脫節。為平衡對外貿易逆差，當時的行政部門擬開放國外農產品進口，但有農民認為此舉嚴重衝擊農民生計，因而在相關提案送立法院審議時，部分農民集結臺北抗議，這在當時屬於體制外的抗爭。抗議過程原本平和，途中卻發生警民推擠、逐漸失序，當警察提高鎮壓強度，部分群眾也予以還擊，在混亂與衝突中民眾遭逮捕約 90 餘人。依題文，此農民抗議起因於政府農產品政策對農民經濟福祉的影響。假設附圖為國內農產品市場供需的兩種情形，請判斷前述情境適用甲圖或乙圖，並從經濟福祉的角度分析可能的影響為何？
  options:
