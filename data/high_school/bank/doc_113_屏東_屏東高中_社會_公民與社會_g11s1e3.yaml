  section: 1
  number: 16
  type: single
  page: 3
  stem: '漫威國與正義國兩國之蘋果供需如下表，兩國若開放農產品自由買賣，則兩國所形成的「蘋果國際市場」之分析何者正確？

    | 漫威國 |  |  |  |

    | --- | --- | --- | --- |

    | 需求 |  | 供給 |  |

    | P | Q | P | Q |

    | 50 | 5,500 | 50 | 3,500 |

    | 60 | 5,000 | 60 | 5,000 |

    | 70 | 4,500 | 70 | 6,500 |

    | 正義國 |  |  |  |

    | --- | --- | --- | --- |

    | 需求 |  | 供給 |  |

    | P | Q | P | Q |

    | 70 | 10,000 | 70 | 8,000 |

    | 80 | 9,000 | 80 | 9,000 |

    | 90 | 8,000 | 90 | 10,000 |'
  options:
  - label: A
    content: 均衡價格為 60
  - label: B
    content: 均衡價格為 90
  - label: C
    content: 均衡數量為 5,000
  - label: D
    content: 均衡數量為 2,000
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '從表中可知，漫威國的市場均衡價格為 60，均衡數量為 5,000；正義國的市場均衡價格為 80，均衡數量為 9,000。漫威國應為出口國，而正義國應為進口國，國際均衡價格應介於 60 ～ 80 之間。但均衡數量應低於 5,000，因為漫威國不可能將所有產品出口，故選(D)。

    17.2008 年的金融危機源於美國的金融業不當發行金融性衍生商品，因牽一髮而動全身，引起世界性的金融風暴，此可以反映經濟全球化下導致的現象，最適切的答案為(A)。

    18.甲國的 GDP 為 200＋150＋200＋60＝610，綠色 GDP 為 610－50－60＝500；而乙國的 GDP 為 240＋120＋180＋50＝590，綠色 GDP 為 590－40－30＝520。甲國的 GDP 大於乙國，而乙國的綠色 GDP 大於甲國，故選(D)。

    19.GNI 是由國內生產毛額加上國外要素所得淨額，即可算出國民所得毛額。以在國內的得常住居民為衡量標準，故符合者為(C)。(A)非常住居民不計入 GNI。(B)該畫作應是於生產年即計入 GNI。(D)二手品不計入 GNI。

    20.資訊不對稱會產生外部成本，指消費者與生產者在市場上所掌握的資訊不相同。而食品安全標章可以讓消費者選擇商品時，資訊更為公開透明，也可以降低交易成本，建立起人際間的信任感，提升社會資本，但無助於達成(C)消除外部效益。

    21.航空公司減班為供給減少，但不知道需求的變化，因此無法得出價格之變動，故選(C)。

    22.(A)此為國內現象，並非全球化現象。(B)屬於全球貿易之範疇，為經濟全球化的現象，為正解。(C)此為人才流動的全球化。(D)此可能會減少環境汙染之情形，與經濟全球化較無直接關聯。

    23.均衡價格為 10，均衡數量為 10，則：(A)應屬於價格下限之管制。(B)應屬於價格上限之管制。(C)當市場均衡，沒有政府干涉時，不會有無謂損失，為正解。(D)條件不足無法判斷。

    24.在有外部成本的情形下，應是社會成本高於私人成本，從整體社會觀點，塑膠吸管的生產數量過多，(B)為正解。

    25.寇斯定理認為在交易成本很低的情況下，只要能界定財產權，人們會自動透過市場交易來解決外部效果的問題，不一定要靠政府介入，最適切的答案為(C)。

    26.對不同的國家徵收不同的關稅將違反世貿組織成員之間不相互歧視的承諾，故選(A)不歧視原則。

    27.(A)保護費為地下經濟，不列入 GDP。(B)捕魚會增加 GDP，為正解。(C)教導捕魚技術並不會直接增加生產力，不增加 GDP。(D)應是甲國出口漁獲後，GDP 會增加。

    28.(A)國畫大師的畫作在生產時即已列入該年 GDP，之後買賣就不會再列入 GDP，為正解。(B)(C)(D)皆會計入該年度 GDP。

    29.(A) OPEC 為主要產油國，但沒有完全壟斷市場。(B)「卡特爾」（Cartel）又可稱獨占聯盟、獨占利益集團、企業聯合、同業聯盟、行業聯合會等，是指壟斷集團，其容易發生在少數資源被數個企業完全掌握的情況下，而這些企業組成聯盟控制該資源產品的產量和價格，為正解。(C) OPEC 成員國仍以國家及商業利益為優先，不一定會遵守協議。(D)因為 OPEC 成員國為主要產油國，任一國家減產仍會影響價格，但是否得到超額利潤無法判斷。

    30.此機制會使高汙染產業因碳排成本增加而減少，可能會使 GDP 減少，但因為減少排碳可能會使我國綠色 GDP 增加，故選(C)。

    31.(A)(B)(C)為歐盟政策措施的目的。(D)歐盟的做法並非鼓勵境內購買電動車，而是對中國進口的電動車採取更多的貿易限制手段。

    32.(A)因為我國出口非動力二輪腳踏車，顯示我國具有生產此產品的比較利益，機會成本較低，為正解。(B)積體電路是我國具有比較利益。(C)淨出口為負值時，稱為貿易赤字、貿易逆差或入超，因此英國產生貿易逆差，則不利英國的經濟福祉。(D)是因為我國生產烈酒不具有比較利益，並非沒有生產者願意生產烈酒。

    33.(A)廠商是為了降低生產成本，非交易成本；交易成本是指買賣雙方於協調中產生的成本，包括無形的時間、精神消耗與有形的各種成本，例如：搜尋、議價、運輸、訂約、履約等成本。(B)會造成市場上生產過多的現象。(C)外部成本內部化是指透過某些方式，要求行為者承受原本由第三者負擔的外部成本，例如：環境開發之公害，依據汙染者付費的原則，政府可採行管制，賠償也是一種做法，為正解。(D)有外部性的情形下，政府須介入管制才能減損社會無謂的損失。

    34.從題文可知，需求增加及供給增加，會使得均衡數量增加，但均衡價格變化不一定，故選(D)。

    35.(A)(D)此為市場競爭的正常做法。(B)此為不誠實競爭，為《公平交易法》禁止的行為，為正解。(C)瓦斯事業具有市場上的自然壟斷現象，不為《公平交易法》所禁止之行為。

    36.直接管制係以行政許可的手段直接介入經濟主體的決策，使之降低外部成本之做法，政府立法讓帶自帶杯者可以少 5 元，屬於直接管制，故選(B)。

    37.此抵制做法會使得馬來西亞的 GDP 及 GNI 皆會下降，但這些產業因為設在海外，未在美國境內，因此不影響美國的 GDP，故選(D)。

    38.(A)限制房屋最高價格可能會使房東不願意出租，使租客租不到房屋。(B)此政策對房東不利，因此更不願意修繕房屋。(C)此政策是為了保障消費者，而會造成供不應求，因此租客人數多於房客，而無法有向房東議價的機會，為正解。(D)訂定價格上限，會產生租屋的黑市情況，房東為了增加收入，可能會巧立名目加收費用。

    39.亞馬遜雨林為環境生態面向，而亞馬遜網站則為經濟面向，可以展現傳統 GDP 只重視經濟面而忽略環境生態面，使得生活福祉被高估，故選(A)。

    40.從題文「經濟優勢的少數掌握了大部分的商業利益，造成弱勢者一直被剝削」，可以看出國際貿易會產生跨國的貧富不均現象，故選(A)。

    41.日本出口汽車有利於日本汽車生產者，增加生產者剩餘；但貿易後，會使得國內價格上升，不利國內消費者；整體來說，國際貿易有利於進出口兩國，故選(C)。

    42.國際貿易是指兩國以具有生產優勢的項目專業化生產並出口，由該表可知，乙國的米價格較低，而甲國布的價格較低，因此乙國會出口米而進口布，甲國會出口布而進口米。(A)自由貿易對甲國的布商有利。(B)自由貿易對甲國的米商不利，因此會反對自由貿易政策，為正解。(C)自由貿易對乙國布商不利。(D)甲國的布價格會上升、米價格會下降；乙國的布價格會下降、米價格會上升。

    43.建立版權而使創作者可以獲得利潤，具有鼓勵創作，保障智慧財產權之功能，此做法屬於建立財產權制度的外部性解決方式，故選(C)。

    44.(A)小吃攤屬於地下經濟，不列入 GDP。(B)罰鍰不列入 GDP。(C)訂購營養補給品會列入 GDP，為正解。(D)國外大學線上課程不計入本國的 GDP。

    45.依據題文說法，禁止海豹產品進口的立法並非專指加拿大，因此是在回應最惠國待遇原則，故選(D)。最惠國待遇原則即一般所稱之不歧視、無差別待遇原則，任一會員對任何國家之貿易相關措施，必須立即且無條件適用於所有會員，不得對會員有較不利之歧視性待遇。

    46.(甲)關稅減讓是有利本國產品出口；(乙)(丙)是針對外國產品管制進口的貿易政策手段；(丁)查緝走私不為貿易手段。故選(D)。

    47.一個或多個世貿組織的會員認為其他會員所採取貿易政策措施違反世貿組織協定或未能履行會員義務以至於產生爭端，會員之間須採用多邊的爭端解決機制（Dispute Settlement Mechanism, DSM），故選(B)。

    48.該國飛盤達到市場均衡時，均衡價格為 240 元，均衡數量為 600 萬個，此時社會福祉最大，故選(C)。

    49.政府定 300 元的價格下限，會有利於生產者，此時不利消費者，消費者剩餘會減少，但生產者剩餘不一定會增加（須視交易量多寡），會造成供過於求，整體經濟福祉會下降，故選(B)。

    50.價格上限為政府訂定市場中可合法進行交易的最高價格，此價格往往比市場均衡價格低，用以保護消費者權益。該題並未指出價格上限位於原本價格之上或之下，因此無法作答。（學校給的答案為(C)）

    (1)若假設是有效管制：(A)應是增加飛盤需求。(B)(C)可能會產生供不應求，飛盤的交易數量可能會減少，(B)為正解。(D)應是減少飛盤供給。

    (2)若假設是無效管制，則交易數量不變，答案才為(C)。'
