  group_stem: ＿＿＿孟德爾以圓形種子與皺皮種子的純品系豌豆株做為親代（P）進行種皮表型雜交試驗，其F1全為圓形，而$F_{2}F$則圓形與皺皮的豌豆株為2.96：1。在孟德爾發表其豌豆雜交實驗結果100多年後，科學家終於了解種子為圓形或皺皮的成因。 生物學家認為圓形與皺皮種子差異與醣類有關。相較於異型合子的種子和雙顯性等基因的種子，含雙隱性等位基因的種子在其發育過程中含有較多的蔗糖。也就是驅雙隱生2等位基因的種子其滲透度較高，在發育過程中有相對多的水分進入種子中。當種子發育完成，水分減少，但種皮卻未相對縮小，因而形成皺皮種子。
