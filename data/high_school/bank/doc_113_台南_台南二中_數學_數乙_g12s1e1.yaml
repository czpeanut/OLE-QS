  section: 4
  number: 2
  type: calc
  page: 3
  stem: '設想您居住在繁華的大都市，計程車隨時可供召喚。然而，每趟車資均經過精確的計算，讓我們來探討這項計費機制：起步價為新臺幣 70 元，此費用僅涵蓋 1 公里的行程。接續的行程費用則依每 0.5 公里加收 5 元。也就是說，行駛距離越遠，所需支付的費用將相應增加。現在，如果計程車行駛距離為 x 公里，車資公式為 f（x）＝$\begin{cases}70 , 0<x\leq 1, \\ 70+5\left[ \frac{x-1}{0.5} \right] , x>1\end{cases}$，其中[ ]為高斯符號。

    (1) 假設要從家裡到圖書館，距離為 7.6 公里，請計算這段行程的計程車費用。（3 分）

    (2) 假設乘坐計程車從圖書館到朋友家，車資為 100 元，求這段行駛距離的範圍？（3 分）'
  answer:
  - (1) f（7.6）＝70＋$5\left[ \frac{7.6-1}{0.5} \right]$＝70＋5×13＝135（元）
  answer_status: verified
