- id: doc_113_台南_台南二中_數學_數乙_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知函數 f（x）＝$\begin{cases}-1 , x>0 \\ 0 , x=0 \\ 1 , x<0\end{cases}$，則下列選項哪些正確？
  options:
  - label: A
    content: f(1)＞f（－1）
  - label: B
    content: $\lim_{x\rightarrow -1} f(x)$＝f（－1）
  - label: C
    content: $\lim_{x\rightarrow 0} f(x)$＝0
  - label: D
    content: $\lim_{x\rightarrow 1} \frac{f(x)}{(x-1)}$＝－1
  - label: E
    content: $\lim_{x\rightarrow -1} \frac{(x+1)}{f(x)}$＝0
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵f(1)＝－1，f（－1）＝1

    ∴f(1)＜f（－1）

    (B)○：$\lim_{x\rightarrow -1} f(x)$＝$\lim_{x\rightarrow -1} 1$＝1＝f（－1）

    (C)╳：∵$\lim_{x\rightarrow 0^{-}} f(x)$＝1 且$\lim_{x\rightarrow 0^{+}} f(x)$＝－1

    ∴$\lim_{x\rightarrow 0} f(x)$極限不存在

    (D)╳：$\lim_{x\rightarrow 1} \frac{f(x)}{x-1}$＝$\lim_{x\rightarrow 1} \frac{-1}{x-1}$

    ∵$\lim_{x\rightarrow 1} (x-1)$＝0 ∴極限不存在

    (E)○：$\lim_{x\rightarrow -1} \frac{(x+1)}{f(x)}$＝$\lim_{x\rightarrow -1} \frac{x+1}{1}$＝0

    故選(B)(E)'
