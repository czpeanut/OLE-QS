  group_stem: 2011 年 3 月 11 日（平成 23 年），日本發生了史上最大規模的地震與海嘯，東北地區的宮城縣、岩手縣和福島縣災情慘重。日本政府後續制定了「大震災復興基本方針」，其中一項重點是未來遇到災難時，要爭取更多「逃跑」時間。所以強調「逃跑」，是源於此次的慘痛經驗：海嘯警報響起時，民眾因擔心自家安全，沒有及時往高處逃難，反而選擇開車回家，結果途中塞車，最終連人帶車被海浪捲走；也有人輕忽海嘯高度，結果因選擇的避難處高度不足而罹難。311 地震並不是東北地區的第一次經歷海嘯，1896 年的明治三陸地震、1933 年的昭和三陸地震，都曾發生過海嘯。岩手縣宮古市田老町的漁業協會將 3 次海嘯的高度記錄於貯水設施的牆面上，附近學校也將過往海嘯造成的傷亡及避難所地點製作成說明牌，希望後人能更重視海嘯帶來的危害。請問：
