      - 437.2
      - 401.15
      - 509.55
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 向量資料轉網格資料時需注意：(1)若向量資料是記錄「數量」，則須考量網格面積後均分。(2)若向量資料記錄屬「性質」或是「區域內均值」，在切分成多個網格後，「性質」不會改變，「區域內均值」的數值也不會改變，如人口密度。(A)選項人口數為數量，由向量面 100 切為 2 個網格時，人數會變成一網格 50，如此才能達成總數不變。人口密度、單位面積產量、坡度百分率，皆為區域內均值的數值。
