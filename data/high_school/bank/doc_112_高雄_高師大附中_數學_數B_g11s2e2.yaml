- id: doc_112_高雄_高師大附中_數學_數B_g11s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 設 A＝$\left[ \begin{matrix}3 & 2 \\ 1 & 1\end{matrix} \right]$，B＝$\left[ \begin{matrix}2 & 6 \\ 3 & k\end{matrix} \right]$，若（A＋B）$^{2}$＝$A^{2}$＋2AB＋$B^{2}$，則 k 值為哪一選項？
  options:
  - label: A
    content: －6
  - label: B
    content: －5
  - label: C
    content: －4
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '（A＋B）$^{2}$＝（A＋B）（A＋B）＝AA＋AB＋BA＋BB

    ＝$A^{2}$＋AB＋BA＋$B^{2}$＝$A^{2}$＋2AB＋$B^{2}$

    ⇒ AB＝BA

    ⇒$\left[ \begin{matrix}3 & 2 \\ 1 & 1\end{matrix} \right] \left[ \begin{matrix}2 & 6 \\ 3 & k\end{matrix} \right]$＝$\left[ \begin{matrix}2 & 6 \\ 3 & k\end{matrix} \right] \left[ \begin{matrix}3 & 2 \\ 1 & 1\end{matrix} \right]$

    ⇒$\left[ \begin{matrix}12 & 18 + 2k \\ 5 & 6 + k\end{matrix} \right]$＝$\left[ \begin{matrix}12 & 10 \\ 9 + k & 6 + k\end{matrix} \right]$

    ⇒$\begin{cases}18 + 2k = 10 \\ 5 = 9 + k \\ 6 + k = 6 + k\end{cases}$

    ⇒$\begin{cases}k =-4 \\ k =-4 \\ k 為任意實數\end{cases}$⇒ k＝－4

    故選(C)'
