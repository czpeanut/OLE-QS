- id: doc_112_高雄_高師大附中_數學_數B_g11s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 若$\left[ \begin{matrix}6 & 7 \\ 5 & 4\end{matrix} \right]$＝$a\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$＋$b\left[ \begin{matrix}1 & 0 \\ 0 & -1\end{matrix} \right]$＋$c\left[ \begin{matrix}0 & 1 \\ 1 & 0\end{matrix} \right]$＋$d\left[ \begin{matrix}0 & 1 \\ -1 & 0\end{matrix} \right]$，則 a＋b＋c＋d 的值為何？
  options:
  - label: A
    content: '11'
  - label: B
    content: '12'
  - label: C
    content: '13'
  - label: D
    content: '14'
  - label: E
    content: '15'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left[ \begin{matrix}6 & 7 \\ 5 & 4\end{matrix} \right]$＝$a\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$＋$b\left[ \begin{matrix}1 & 0 \\ 0 & -1\end{matrix} \right]$＋$c\left[ \begin{matrix}0 & 1 \\ 1 & 0\end{matrix} \right]$＋$d\left[ \begin{matrix}0 & 1 \\ -1 & 0\end{matrix} \right]$

    ＝$\left[ \begin{matrix}a & 0 \\ 0 & a\end{matrix} \right]$＋$\left[ \begin{matrix}b & 0 \\ 0 & -b\end{matrix} \right]$＋$\left[ \begin{matrix}0 & c \\ c & 0\end{matrix} \right]$＋$\left[ \begin{matrix}0 & d \\ -d & 0\end{matrix} \right]$

    ＝$\left[ \begin{matrix}a + b & c + d \\ c - d & a - b\end{matrix} \right]$

    ⇒$\begin{cases}a + b = 6 \cdots \cdots \cdots \cdots \cdots ① \\ a - b = 4 \cdots \cdots \cdots \cdots \cdots ② \\ c + d = 7 \cdots \cdots \cdots \cdots \cdots ③ \\ c - d = 5 \cdots \cdots \cdots \cdots \cdots ④\end{cases}$

    由①＋③得 a＋b＋c＋d＝6＋7＝13

    故選(C)'
