- id: doc_112_高雄_高師大附中_數學_數B_g11s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設 A，B，C 皆為 n 階方陣，I 為 n 階單位方陣，O 為 n 階零矩陣，請選出正確選項。
  options:
  - label: A
    content: 若 AB＝O，則 A＝O 或 B＝O
  - label: B
    content: 若 AB＝AC，且 A≠O，則 B＝C
  - label: C
    content: （AB）$^{2}$＝$A^{2}B^{2}$
  - label: D
    content: （A＋I）$^{2}$＝$A^{2}$＋2A＋I
  - label: E
    content: （A＋B）（A－B）＝$A^{2}$－$B^{2}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：反例：$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right] \left[ \begin{matrix}0 & 0 \\ 0 & 1\end{matrix} \right]$＝$\left[ \begin{matrix}0 & 0 \\ 0 & 0\end{matrix} \right]$，但 A≠O，B≠O

    (B)╳：反例：$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right] \left[ \begin{matrix}1 & 2 \\ 3 & 4\end{matrix} \right]$＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right] \left[ \begin{matrix}1 & 2 \\ 5 & 6\end{matrix} \right]$＝$\left[ \begin{matrix}1 & 2 \\ 0 & 0\end{matrix} \right]$

    但 B≠C

    (C)╳：（AB）$^{2}$＝（AB）（AB）

    當 BA＝AB 時，（AB）$^{2}$＝（AB）（AB）＝AABB＝$A^{2}B^{2}$ 才成立

    (D)○：（A＋I）$^{2}$＝（A＋I）（A＋I）

    ＝AA＋AI＋IA＋II

    ＝$A^{2}$＋2A＋I

    (E)╳：（A＋B）（A－B）＝AA－AB＋BA－BB＝$A^{2}$－AB＋BA－$B^{2}$

    當 AB＝BA 時，（A＋B）（A－B）＝$A^{2}$－$B^{2}$ 才成立

    故選(D)'
