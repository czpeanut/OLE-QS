- id: doc_111_新北_新店_數學_數甲_g12s1e3_s2_2
  section: 2
  number: 2
  type: fill
  page: 2
  stem: 已知 F（x）為 f（x）＝$3x^{2}$＋6x－1 的反導函數，且 F（－2）＝10，反曲點為（h，k），則 7h＋k＝＿＿＿＿。
  answer:
  - '0'
  answer_status: verified
  answer_source: answer_key
  explanation: 'F（x）＝$\int f ( x )dx$＝$\int ( 3x^{2}+ 6x - 1 )dx$＝$x^{3}$＋$3x^{2}$－x＋c

    由 F（－2）＝10$\Rightarrow$（－2）$^{3}$＋3（－2）$^{2}$－（－2）＋c＝10$\Rightarrow$c＝4

    ∴F（x）＝$x^{3}$＋$3x^{2}$－x＋4

    F''''（x）＝f''（x）＝（$3x^{2}$＋6x－1）''＝6x＋6＝6（x＋1）

    故反曲點為（－1，F（－1））＝（－1，7）

    ∴7h＋k＝7（－1）＋7＝0'
