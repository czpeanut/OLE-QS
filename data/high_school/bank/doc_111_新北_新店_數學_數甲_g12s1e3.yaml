  stem: 已知坐標平面上四點 O（0，0），P（1，0），Q（1，1），R（0，1）。多項式函數 f（x）與 g（x）在區間 [ 0，1 ] 上的圖形將正方形
    OPQR 分成 A，B，C 三區域，如圖所示。設 A、B、C 三區域的面積分別為 a、b、c，試問下列選項哪個<u>不正確</u>？
  options:
  - label: A
    content: a＝$\int_{0}^{1} f ( x )dx$
  - label: B
    content: b＝$\int_{0}^{1} ( f ( x )-g ( x ) )dx$
  - label: C
    content: c＝$\int_{0}^{1} g ( x )dx$
  - label: D
    content: $\frac{1}{2}$＝$\int_{0}^{1} ( x -g ( x ) )dx +c$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\int_{0}^{1} f ( x )dx$＝b＋c

    (B)○

    (C)○

    (D)○：$\int_{0}^{1} ( x -g ( x ) )dx +c$＝（$\overline{OQ}$與 y＝g（x）所圍面積）＋（C 區域面積）

    ＝△OPQ 面積＝$\frac{1}{2}\times 1\times 1$＝$\frac{1}{2}$

    故選(A)'
