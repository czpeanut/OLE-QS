- id: doc_111_新北_新店_數學_數甲_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 已知函數 f（x）在區間 [ a，b ] 內為連續，則下列選項的敘述何者<u>不正確</u>？
  options:
  - label: A
    content: 函數 f（x）的圖形與 x 軸及直線 x＝a，x＝b 所圍成的區域面積為$\int_{a}^{b} f ( x )dx$
  - label: B
    content: 若 a＜c＜b，則$\int_{a}^{b} f ( x )dx$＝$\int_{a}^{c} f ( x )dx$＋$\int_{c}^{b}
      f ( x )dx$
  - label: C
    content: $\int_{a}^{a} f ( x )dx$＝0
  - label: D
    content: 若 f（x）≤ g（x），則$\int_{a}^{b} f ( x )dx\leq \int_{a}^{b} g ( x )dx$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：所圍區域面積為$\int_{a}^{b} | f ( x ) |dx$

    (B)○

