- id: doc_111_新北_新店_數學_數甲_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 已知函數 f（x）在區間 [ a，b ] 內為連續且值均為正數，考慮函數 f（x）對於 [ a，b ] 的 n 等分分割之上和與下和依序為 $U_{n}$
    與 $L_{n}$，則下列何者正確？
  options:
  - label: A
    content: $\lim_{n \rightarrow \infty} U_{n} > \lim_{n \rightarrow \infty} L_{n}$
  - label: B
    content: 對於任意正整數 m，n，$U_{m}$＞$L_{n}$ 必成立
  - label: C
    content: 對於任意正整數 n，$U_{n}$＝$L_{n}$ 必成立
  - label: D
    content: 設 R 為曲線 y＝f（x）與直線 x＝a，x＝b，y＝0 所圍成的區域，則 R 的面積為$\int_{a}^{b} f ( x )dx$＝$\lim_{n
      \rightarrow \infty} L_{n}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(D)○：∵f（x）在區間 [ a，b ]內為連續且值均為正數

    ∴R 的面積為$\int_{a}^{b} | f ( x ) |dx$＝$\int_{a}^{b} f ( x )dx$＝$\lim_{n \rightarrow
    \infty} L_{n}$

    故選(D)'
