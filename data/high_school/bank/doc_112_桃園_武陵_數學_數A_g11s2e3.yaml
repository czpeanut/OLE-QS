- id: doc_112_桃園_武陵_數學_數A_g11s2e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 袋中有大小相同的3顆紅球與2顆白球，自袋中任取一球 ( 每球被取到的機會均等 )，取後放回，取球五次，記錄每次所取出的顏色結果。令A表示取球過程中有連續三次恰好抽中「紅球、紅球、白球」的事件，B表示取球過程中有連續三次恰好抽中「紅球、白球、白球」的事件，請問下列哪些選項是正確？
  options:
  - label: A
    content: P (A)＝$\frac{54}{125}$
  - label: B
    content: A和B為獨立事件
  - label: C
    content: A和B為互斥事件
  - label: D
    content: P ( B | A )＝$\frac{4}{15}$
  - label: E
    content: P ( B | A' )＝$\frac{11}{15}$
  explanation: 'A：紅，紅，白 紅，白， B：紅，白，白 紅，紅， (A) P (A)＝$\frac{3! \times (3 \cdot 3 \cdot 2) \cdot 3 \cdot 2}{5^{5}}$＝$\frac{3^{4} \cdot 2^{3}}{5^{5}}$ (B) (C) P (B)＝$\frac{\frac{3!}{2!1!} \times (3 \cdot 2 \cdot 2) \cdot 3 \cdot 3}{5^{5}}$＝$\frac{3^{4} \cdot 2^{2}}{5^{5}}$ ∵ A∩B＝{紅紅白白紅，紅紅紅白白} ∴ P ( A∩B )＝$\frac{(3 \cdot 3 \cdot 2) \cdot 2 \cdot 3+3 \cdot (3 \cdot 3 \cdot 2) \cdot 2}{5^{5}}$＝$\frac{3^{3} \cdot 2^{3}}{5^{5}}$≠0

    且P ( A∩B )≠P (A) P (B)，得A , B不互斥，不獨立 (D) P ( B | A )＝$\frac{P(A\cap B)}{P(A)}$＝$\frac{1}{3}$ (E) P ( B | A'' )＝$\frac{P(A''\cap B)}{P(A'')}$＝$\frac{P(B)-P(A\cap B)}{1-P(A)}$＝$\frac{108}{2477}$。

    【註】沒有選項可選'
