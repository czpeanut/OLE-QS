- id: doc_111_台南_瀛海_社會_公民與社會_g10s1e1_s3_49
  section: 3
  number: 49
  type: calc
  page: 6
  stem: 《梨俱吠陀》中關於經期的論述，影響了印度社會，若欲從公民權利的角度來看，侵害哪一項公民權利(2分)?請「摘錄題文」簡要敘明理由。(2分)
  group_stem: '《梨俱吠陀》是用古梵文創作的頌神宗教詩歌，是印度最古老的宗教文學。《梨俱吠陀》中描述女性的經血與內疚、罪惡有關，人們因此將月經視為女性須接受的懲罰；此觀念影響印度社會和公眾輿論，「月經」經常被視為骯髒的生理現象、不潔的象徵，無法公開討論。

    許多印度女孩在成長的過程中也相信月經的禁忌，認為經期間被女性碰到的任何物品都會變得汙穢，這也間接導致女性在經期時，被禁止進入寺廟以及公共場所。就現代觀點而言，生理女性因為具有月經經驗，讓女性遭受貶低，因而遭受偏見、歧視甚至社會排除，稱為「月經汙名化」。

    此根深柢固的文化刻痕，迄今仍存在印度社會之中，儘管如此，知名印度羽球女將辛度(PVSindhu)努力翻轉這種傳統觀念，在東京奧運奪牌後，其主張引起更多媒體的關注，她致力於為印度女性平權運動發聲，曾投書《印度時報》呼籲：「不要讓月經成為一個藉口，經期並沒有讓我動搖，而是讓我更加堅定去追求我的夢想。」她希望月經汙名化能夠早日消失'
