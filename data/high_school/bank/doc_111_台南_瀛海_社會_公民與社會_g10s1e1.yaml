  stem: 傳統上的阿美族人認為只要是親手開墾的地方，便有使用的權利，但是這樣的傳統卻與現代法律規定相違背，常形成阿美族人違法使用土地情形；而布農族人的狩獵傳統，同時也是生命教育，但從立法院制定《槍砲彈藥刀械管制條例》及《野生動物保育法》以來，原住民因為狩獵而身陷牢獄者不計其數。上述問題顯示國家忽視原住民族權益，衍變成政府執法時複雜難解的問題。以下為各大媒體的新聞內容，請問：何者與本文著重的公民權利發展面向最為相近?
  options:
  - label: A
    content: 勞工團體要求提高最低基本薪資並且降低工作時數
  - label: B
    content: 大法官釋憲保障同性戀者擁有選擇結婚與否的權利
  - label: C
    content: 臺鐵擬將東南亞語言納入廣播系統中以服務新住民
  - label: D
    content: 各地的年輕學子要求將投票年齡門檻下修至18歲
