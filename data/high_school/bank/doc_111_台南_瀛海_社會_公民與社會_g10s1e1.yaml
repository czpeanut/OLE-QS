  - label: A
    content: 漁工的勞動權益議題，為文化權的展現，應保障其捕魚為生的舊有傳統
  - label: B
    content: 以國際人權公約來拘束我國勞動基準法內容，保障勞方之權益不受侵害
  - label: C
    content: 我國勞動基準法未能保障外籍移工和境外漁工，顯示該法未盡完善之處
  - label: D
    content: 外籍移工與境外漁工之就業選擇自由與保障，不該為我國立法予以保障
