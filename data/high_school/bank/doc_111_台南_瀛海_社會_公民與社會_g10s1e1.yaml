  stem: 針對行政院推出《勞基法》「一例一休」再修法，包括鬆綁7休1、提高加班工時及工時帳戶等彈性政策等，經濟系教授指出《勞基法》違憲，《勞基法》中的「例假」規定勞工在特殊情況下才能工作，但政府無權規定勞動者不能工作。另一位教授指出，立法通過的「一例一休」是進步的立法，來保護勞動者身體健康。請問上述關於兩位教授的敘述何者正確？
