  stem: 只要是人，就應當享有人權。維護人性尊嚴的人權觀念，已經成為一種普世性的基本價值，受到世人肯定。無論是何種性別、種族、宗教、膚色、國籍、年齡、階級的人，每個人均應平等享有各種公民、政治、經濟、社會以及文化上的權利，獲得不被歧視的平等對待。請問上文所提之社會權是第二代人權，強調國家應以積極作為保障人民之生活，請問：下列何項政策「不是」保障基本人權中社會權的表現？
