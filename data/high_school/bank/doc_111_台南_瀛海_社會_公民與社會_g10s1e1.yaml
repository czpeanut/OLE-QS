  stem: 為落實聯合國「國際人權憲章」中《公民與政治權利國際公約》及《經濟社會文化權利國際公約》相關人權保障之規定，我國於2009年立法通過「兩公約」施行法，要求各级政府行使職權時，應符合相關人權保障規定，並2年內完成法令之制(訂)定、修正或廢止。兩公約及其施行法所具備的意義為何?(甲)個人有權對抗來自於國家的不合理干預及侵害；(乙)人民有權向國家爭取經濟、社會及文化等；(丙)闡明會員國國民權利，並敦促聯合國積極落實；(丁)福利人權需仰賴國家的保障，也來自於國家的賦予；(戊)公民與政治權利國際公約為人權基礎應優先適用。
