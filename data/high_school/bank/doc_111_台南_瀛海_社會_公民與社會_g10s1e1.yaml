  stem: 依人權公約施行監督聯盟表示，我國總統曾談及臺灣在國際社會的責任，並列舉出多項人道救援、醫療援助與防治等傑出表現，但現實臺灣生活的近六十萬名外籍移工、及十六萬名境外漁工的權益目前因無法適用勞動基準法而未能得到完善的勞動權益，呼籲政府應參考國際勞工組織(ILO)推動的第188號《關於漁業部門工作的公約》，制定符合漁業特性的規定，並邀集漁工代表與民間團體，討論究竟是要在《勞基法》內設於漁工專章，或者另立專法保障漁工權益。請問，上文所述，突顯我國在公民權利保障內容中，可能有哪些問題?
