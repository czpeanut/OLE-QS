  stem: 兩名《路透社》緬甸記者－瓦隆(Wa Lone)和喬索歐(Kyaw Soe Oo)因報導緬甸軍隊在若開邦印丁村(Inn Din)，屠殺10名羅興亞村民，而遭到警方「設局誘捕」、指控盜竊官方文件，遭緬甸法院以「觸犯《政府機密法》」為由，重判7年有期徒刑。消息傳出後，包括聯合國、歐盟、美英加澳與眾多人權與記者組織，紛紛出面譴責緬甸政府羅織罪名，意圖掩蓋對其「種族滅絕」指控的真相。針對《路透社》記者案，以及聯合國「種族滅絕」的指控報告，翁山蘇姬都未有公開回應；但面對印丁村與羅興亞難民問題，翁山蘇姬维持一貫的態度，呼籲國際社會應尊重緬甸的內政問題與司法制度，並多次回絕聯合國派遣獨立調查團的申請。緬甸政府因記者報導敏感議題而將其判刑入獄，請問這是侵犯哪一項基本人權？
