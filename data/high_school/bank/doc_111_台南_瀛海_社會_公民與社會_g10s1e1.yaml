  group_stem: '(七)國際救援組織海洋觀察(Sea-Watch)的「海洋觀察3號」德籍船長拉克特，為讓船上40名難民上岸而槓上義大利的內政部長，強行在義靠港，如今恐面臨上看10年要牢獄之災。

    海洋觀察發言人紐格包爾(Ruben Neugsbauer)告訴法新社：31歲的德國籍船長拉克特(Carola Rackete)昨晚未獲當局許可便強行將船隻駛進拉姆培杜薩島(Lampedusa)港口，目前已被捕。義大利極右派內政部長薩爾维尼(Matteo Salvini)形容拉克特為「眼中釘、肉中刺」般的麻煩人物，說她「犯下罪行，犯下戰爭行為」，並要她坐牢。

    海洋觀察3號強行在義靠岸後，船上剩餘的40名難民在漂流17天終於獲准上岸，並被帶往收容中心。難民有的含淚。有的微笑，他們將轉往法國或德國、芬蘭、盧森堡、葡萄牙；而法國已同意收留其中10人。'
