  type: single
  page: 5
  stem: 根據上述周子瑜道歉事件，國家人權委員會是人權維護的重要機構之一。請問下列敘述何者正確？
  options:
  - label: A
    content: 我國已於2009年通過兩公約施行法的同時，建立國家人權委員會
  - label: B
    content: 國家人權委員會強調獨立性，包括組織、預算、人事及運作的獨立
  - label: C
    content: 聯合國依據巴黎原則，鼓勵政府組織國家人權委員會，並加以管理
  - label: D
    content: 國家人權委員會為準司法機關，因此與法院皆有審理、判決等權力
  group_stem: '(五)年僅16歲周子瑜為揮舞中華民國國旗道歉事件引起巨大風波。韓國公民團體「韓國多文化中心」認為「其所屬經紀公司JYP娛樂及老闆朴軫永因屈服於中國大陸網友的抵制與施壓，強制她錄製道歉的聲明，已嚴重侵犯了人權｣；聲明將以「歧視」與「侵害人權」為由，向韓國國家人權委員會提出申訴。南韓作為聯合國《兒童權利公約》的締約國，卻未能採取適當措施維護周子瑜的自由表意權，免於政治主張、國籍身分權之歧視，很可能也違反其國際義務。

    根據法律規定，韓國國家人權委員會有調查及救濟人權侵害與歧視之職責，為具有一定調查權之「準司法機關」。雖然JYP並非公家機關，而韓國多文化中心也非這次事件的當事人，但是任何人只要得知歧視情事，即使行為主體是私法人、組織或私人，都可以向國家人權委員會申訴。若國家人權委員會決定受理周子瑜案，未來進一步調查判定其道歉確實存在強迫與歧視行為，得正式向韓國檢方提告JYP。

    國家人權機構的存在，能夠初步調查這類位於模糊地帶、過去國家並未積極介入保護的人權侵害爭議事件，幫助社會大眾釐清是否涉及違反人權之爭論，亦能協助案件進入後續救濟程序。'
  tags:
