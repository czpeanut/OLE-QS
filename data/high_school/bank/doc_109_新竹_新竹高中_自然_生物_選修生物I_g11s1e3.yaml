- id: doc_109_新竹_新竹高中_自然_生物_選修生物I_g11s1e3_s3_42
  section: 3
  number: 42
  type: single
  page: 6
  stem: 下列關於本文的推論，何者最為合理？
  options:
  - label: A
    content: 端粒酶可以本身的RNA作為模版，做出RNA使端粒增長
  - label: B
    content: 癌細胞可突破海佛列克極限使得複製次數超過一般體細胞
  - label: C
    content: 複製過程中，RNA引子可透過端粒酶移除，再藉由DNA聚合酶修補
  - label: D
    content: 所有端粒酶活性高的細胞均有發展為癌細胞的可能
  group_stem: 端粒（telomere）是真核生物染色體末端的DNA-蛋白質複合體，這些DNA為連續重複序列，富含G與T，可保護染色體末端的穩定。細胞在複製DNA時必須遵循一定方向，並透過RNA引子協助引導DNA聚合，最後再把RNA引子移除，並利用其中一種DNA聚合酶將RNA引子移除。但是，當最後一個引子被移除後，DNA無法填補缺少的部分，於是在末端會留下空隙，染色體的末端便會少50～200個鹼基，因此，在多次複製後，末端就會愈來愈短，細胞最終無法複製而走向衰老，稱為海佛列克極限（Hayflick Iimit）。然而，對幹細胞與生殖母細胞的功能而言，必須要不斷地複製，若端粒過短會導致無法維持正常功能，因此，在這些細胞中，可偵測到高活性的端粒酶（telomerase）。端粒酶一種由RNA和蛋白質組成的核糖核蛋白複合體，屬於反轉錄酶，端粒酶以本身的RNA片段作為模版，做出端粒DNA，加長端粒，從而穩定了染色體的結構。在正常人體細胞中，端粒酶的活性極低，只有在幹細胞和生殖細胞，這些必須不斷分裂複製的細胞之中，才可以偵測到具有高活性的端粒酶。此外，癌細胞通常也能偵測到高活性的端粒酶，能抑制端粒酶活性的藥物也許具抗癌的潛能。根據描述，回答40.～42.題：
