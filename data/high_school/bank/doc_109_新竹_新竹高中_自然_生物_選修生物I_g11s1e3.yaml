  group_stem: 乳糖操縱組是一種常見的基因調控機制，（圖十一，圖中結構基因僅顯示lacZ）在啟動子前端，有一段可連接蛋白質啟動子的DNA片段（CAP site），可被CAP蛋白連接。大腸桿菌平時以葡萄糖為主要能量來源，當環境中缺乏乳糖時，乳糖操縱組的結構基因不會表現，可是當環境中同時存在乳糖與葡萄糖時，乳糖會使抑制蛋白構型改變使結構基因表現，但由大腸桿菌主要以葡萄糖為主要能量來源，因此，在此狀態下結構基因的表現量極低。最後，若環境中僅有乳糖時，細胞內會累積大量cAMP（cyclic AMP, 環化單磷酸腺苷），cAMP會與CAP蛋白形成複合體並連接在CAP site，在此狀態下，會大幅增加RNA聚合酶轉錄的效率，加速乳糖代謝。根據文章描述，回答37.～39.題：
