  stem: '纖連蛋白（fibronectin）是一種位於細胞膜外側的蛋白質，可協助細胞與胞外物質結合，並與細胞修復有關。科學家發現纖連蛋白基因有許多外顯子（如圖八所示。圖一的兩條黑線區域表示內含子，箭頭標示之長方形區域為外顯子，且內含子片段長於外顯子片段），在纖維母細胞（fibroblast）與肝細胞（hepatocyte）表現該基因時，會出現差異性剪輯（alternative spicing），其中，EIIIB與EIIIA僅在纖維母細胞作為外顯子，而在肝細胞則作為內含子，使得修飾後產生不同的成熟mRNA（圖一）。根據描述，下列敘述哪些正確？（應選3項）

    圖一

    圖二'
  options:
  - label: A
    content: 不論是纖維母細胞或肝細胞，成熟mRNA的5’端均會出現端帽
