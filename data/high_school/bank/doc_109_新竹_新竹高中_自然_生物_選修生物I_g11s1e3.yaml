- id: doc_109_新竹_新竹高中_自然_生物_選修生物I_g11s1e3_s3_43
  section: 3
  number: 43
  type: single
  page: 6
  stem: 下列關於新冠病毒的敘述，何者正確？
  options:
  - label: A
    content: 病毒以包膜蛋白來辨識宿主細胞
  - label: B
    content: 病毒入侵後其遺傳物質不會進入細胞核
  - label: C
    content: 感染新冠肺炎後死亡率在不同年紀均相同
  - label: D
    content: 目前科學家已確認新冠病毒的野外來源
  group_stem: 新冠病毒（COVID-19，下圖）是一種具套膜單股RNA病毒，外殼由包膜蛋白（E protein）、膜蛋白（M protein）與棘突蛋白（S protein）組成，其中，病毒透過棘突蛋白去結合人體細胞膜上第二型血管收縮素轉化酶（ACE2）作為辨識。目前野外來源尚不明確，疫情最早爆發於中國武漢，大多數患者只會有輕微症狀，少部分個案會有重症，死亡率介於1％至5％之間，多集中在中老年，並與其他疾病併發。治療上多以支持療法，但仍有抗病毒藥物被臨床採納，如瑞德西韋，其結構類似核苷酸，使病毒在增殖時使用瑞德西韋使之出錯，因而中止RNA複製。 目前歐美各國公開核准的疫苗多為DNA疫苗（牛津Oxford-AstraZeneca）與mRNA疫苗（輝瑞Pfizer，莫德納Moderna）。牛津疫苗是以腺病毒為載體，將棘突蛋白DNA置入後，藉由腺病毒感染，此DNA會送入宿主細胞表現棘突蛋白。而輝瑞與莫德納疫苗則是將mRNA以奈米級固態脂質所包覆，將其打入細胞後表現棘突蛋白。這些疫苗表現出棘突蛋白後會將其移至細胞膜上，或釋出至胞外，供免疫細胞辨識，進而產生免疫力。 臺灣檢測新冠病毒以Real Time-rtPCR為主，首先，取得病毒RNA序列後，將部分片段藉由反轉錄酶產生DNA，將其作為DNA探針，供比對使用。在檢驗時，將檢體先進行反轉錄，再藉由PCR放大檢體量，過程中使用DNA探針進行偵測，每一次的循環就偵測一次，看看檢體中是否有對應的DNA，若可完全互補，透過特殊的螢光染劑，將其產生螢光。實務上檢測人員會依據PCR循環幾次後產生螢光作為判讀陽性的依據，稱作CT值（threshold cycle），目前臺灣以採檢後進行Real Time-rtPCR，在CT值＜34產生螢光作為判讀陽性的依據。根據描述，回答43.～46.題：
