  section: 1
  number: 4
  type: single
  page: 1
  stem: 某種意識形態可說是「神聖的自私主義」。它是現代性的負面展現，是現代社會「逃避自由」的結果，支持者寧願服從權威，藉此便不必選擇、不必負責。它反對一切，反革命、反民主、排外，在民族共同體的偉大口號下，將各種問題推給外人。請問這種意識形態最有可能是？
  options:
  - label: A
    content: 國家社會主義
  - label: B
    content: 費邊社會主義
  - label: C
    content: 共產主義
  - label: D
    content: 烏托邦社會主義
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 此帝國之所以強盛的原因，也許是權力高度集中於蘇丹手中。透過強制基督徒幼兒充軍，並逼其改信伊斯蘭，選拔成為官僚或新軍，使其成為效命於蘇丹一人的軍政團體。並配合巧妙的外交策略與善用火藥武器成就帝國盛世。請問此帝國最有可能是？
  options:
  - label: A
    content: 蒙兀兒帝國
  - label: B
    content: 鄂圖曼帝國
  - label: C
    content: 薩法維帝國
  - label: D
    content: 帖木兒帝國
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 如果你開始質疑一些看似「理所當然」的事情，「為什麼男生的座號會在女生前面？」、「為什麼男生的身分證字號是1開頭、女生是2開頭？」你其實已經運用了「第二性」的概念。也就是男女差異來自社會文化，女性被建構為從屬性別。請問「第二性」的理論為何人提出？
  options:
  - label: A
    content: 曼德拉
  - label: B
    content: 切格拉瓦
  - label: C
    content: 馬丁路德‧金恩
  - label: D
    content: 西蒙‧波娃
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 1946 年英國首相邱吉爾發表著名的「鐵幕」演說：「從波羅的海的思德丁到亞德里亞海邊的的里雅斯特，一幅橫貫歐洲大陸的鐵幕已經降下。在這條線的後面，座落著中歐和東歐古國的都城。」請問下列哪座都城不在邱吉爾所稱的「鐵幕」範圍內？
  options:
  - label: A
    content: 雅典
  - label: B
    content: 布達佩斯
  - label: C
    content: 布拉格
  - label: D
    content: 華沙
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 這場戰爭的特徵之一是「空襲」。按照總體戰(total war)的思考方式，要使敵國屈服，不只是消滅前線的士兵，更要消滅後方的工廠與人民的戰鬥意志，於是倫敦、柏林、德勒斯登、重慶、臺北與東京成為轟炸的對象。在德勒斯登，800 度的高溫使躲在防空洞的民眾依舊被烤成人乾；在東京，一次空襲燒死十萬人，單日死亡人數超過原子彈。請問這場戰爭應為？
  options:
  - label: A
    content: 第一次世界大戰
  - label: B
    content: 第二次世界大戰
  - label: C
    content: 韓戰
  - label: D
    content: 越戰
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 《檔案》是英國牛津大學歷史教授提摩西賈頓‧艾許作品。他事後得知 1980 年代在德國留學時，竟被自己的德國朋友、老師出賣，他們其實是德意志民主共和國國家安全部(俗稱「史塔西」，Stasi)線民，並留下345 頁紀錄。作者回到德國，根據跟監檔案和自己的日記、回憶對照，重構自己的歷史。請問艾許最有可能是造訪哪個城市時被出賣？
  options:
  - label: A
    content: 法蘭克福
  - label: B
    content: 東柏林
  - label: C
    content: 西柏林
  - label: D
    content: 維也納
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 以下是某作品的部分內容：「今天是英國伊莉莎白公主十八歲生日……我們常常談到這麼美麗的公主究竟要嫁給什麼樣的王子呢？……隱秘之家的不幸真是一樁又一番，我們以為外面的門夠安全，但太白粉依舊被偷？」文中伊莉莎白公主便是今年過世的英女王，而小公主三歲。當時十五歲的作者，最後卻死於七十幾年前的戰爭之中。請問這份作品最有可能是：
  options:
  - label: A
    content: 《西線無戰事》
  - label: B
    content: 《安妮日記》
  - label: C
    content: 《亞維農的少女》
  - label: D
    content: 《東方主義》
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 有學者認為 1571年才是全球化真正誕生的一年，而非一般認為的1492年。因為此年是大帆船(Galleon)定期航線啟航之年，有別於過去各文明如接力賽般，與遙遠地區產生間接聯繫的運作方式。如今透過國王麾下運行的定期交通工具串連，補足了過去始終欠缺的「美洲──亞洲太平洋航路」，所謂的「世界貿易」自此展開。請問上述的「國王」最有可能指的是？
  options:
  - label: A
    content: 葡萄牙國王
  - label: B
    content: 西班牙國王
  - label: C
    content: 荷蘭奧蘭治親王
  - label: D
    content: 英國國王
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 有本書認為這個時期發生的變化構築成最基本的全球化，雖然作者承認這不是現化觀念的全球化。此後數百年間維京人在美洲建立短暫居留地，美洲印第安人發展長距離的貿易路線，大量的斯拉夫人、非洲黑人被賣為奴隸送到西亞，印度、東南亞、中亞與東歐出現大規模的宗教改宗浪潮。請問這本書最有可能是？
  options:
  - label: A
    content: 《西元一千年》
  - label: B
    content: 《1493：物種大交換丈量的世界史》
  - label: C
    content: 《現代世界六百年》
  - label: D
    content: 《1683：近世世界的變貌》
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 此時期在歐洲除了是啟蒙運動的時代外，藝術文化高度模仿「中國風」。波蘭國王將600名薩克森龍騎兵賣給普魯士國王，交換 151件康熙時期青花瓷。這些青花瓷被稱為「龍騎兵瓶組」，騎兵被編入薩克森九十四步兵師，俗稱「瓷器兵團」，這支部隊的最後重要一戰是1942-43年的史達林格勒攻防戰。請問此時期與當時流行的藝術風格為？
  options:
  - label: A
    content: 17世紀的「洛可可」
  - label: B
    content: 18世紀的「洛可可」
  - label: C
    content: 17世紀的「巴洛克」
  - label: D
    content: 18世紀的「巴洛克」
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 以下是英國第一位，也是史上最年輕(42 歲)的諾貝爾文學獎得主吉卜林的詩句〈白人的負擔〉： 儘管挑起白人的負擔 把你們最優秀的品種送出去 捆綁起你們的兒子們將他們放逐出去 去替你們的奴隸服務…… 堅持著耐心 掩飾起恐懼 隱藏起驕傲 用公開與簡易的語言 不厭其煩的說清楚 去替別人謀福利 去為別人爭利益 請問〈白人的負擔〉詩句的主旨為何？
  options:
  - label: A
    content: 西方殖民活動成功因素是武力
  - label: B
    content: 好的帝國主義是實施「文明教化」
  - label: C
    content: 須嚴厲批判西方各種殖民活動
  - label: D
    content: 西方殖民活動目標是謀取經濟利益
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 1671 年有一份「東印度公司致臺灣王公函」內容為： 「如陛下樂予鼓勵，則可能銷售歐洲及印度之貨物，作盛大之貿易，以交換貴國能提供之物品。敝公司亦久欲與日本通商，故已派有若干船隻，裝運各種貨物，並令其裝運認為可在貴國銷售之一批貨品，即若干種洋布及其他東印度貨物，將在駛往日本之途中，在貴國安平卸下，然後再裝糖、鹿皮及其他適於日本銷售之貨物；又再日本回航時再過安平，裝入其他物品。……」 請問此處的「東印度公司」、「臺灣王公」最有可能？
  options:
  - label: A
    content: 荷蘭東印度公司、鄭成功
  - label: B
    content: 荷蘭東印度公司、施琅
  - label: C
    content: 英國東印度公司、鄭經
  - label: D
    content: 英國東印度公司、施琅
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 十九世紀末，有人說：「我國不可猶疑，與其坐等鄰邦之進步而與之共同復興東亞，不如脫離其行伍，而與西方各文明國家共進退。對待鄰國之辦法，不必因其為鄰邦而稍有所顧慮，只能按西洋人對待此類國家之辦法而對待之。」請問這種論調與下列何種思想最為接近？
  options:
  - label: A
    content: 社會達爾文主義
  - label: B
    content: 達爾文主義
  - label: C
    content: 資本主義
  - label: D
    content: 社會主義
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 19 世紀後期，是新帝國主義國家競逐海外殖民地最激烈的時刻，當時歐洲強權在非洲積極進行「大獵」行動，其中「甲」國欲建立開羅至好望角的南北軸心，「乙」國希望自撒哈拉至紅海建立東西軸心，因而形成對立狀態。請問上文提到的甲、乙兩國各是指：
  options:
  - label: A
    content: 德國、法國
  - label: B
    content: 法國、英國
  - label: C
    content: 英國、法國
  - label: D
    content: 英國、德國
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 列寧認為□□□□的最初階段，勞工、軍人與農民的蘇維埃在某種程度上落實了勞工與農民的革命民主專政，不過他們只實現二分之一的權力。他們支持資產階級政權，只能稱為勞工、農民和軍人的半政權聯盟，是妥協派的蘇維埃。請問此處的□□□□最有可能指的是？
  options:
  - label: A
    content: 1830 年的七月革命
  - label: B
    content: 1848年的二月革命
  - label: C
    content: 1917年的二月革命
  - label: D
    content: 1917年的十月革命
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 1947年在某地區發生規模空前的巨大移民潮，在這年結束的三到四個月內，兩邊各有約五百萬的難民移動，這種結果近似於種族清洗。搭載難民跨越邊界的火車最容易成為各方的攻擊目標，這些火車通常最後都會抵達終點，只是車上載運的是無數的屍體，在這兩個新成立的國家記憶裡留下了不可抹滅的傷痕。請問這地區最有可能位於何處？
  options:
  - label: A
    content: 印度河流域
  - label: B
    content: 恆河流域
  - label: C
    content: 約旦河流域
  - label: D
    content: 兩河流域
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 這個國家認為國內族群應「分別發展」，頒布《禁止跨族婚姻法》、《隔離設施法》，強迫占國家人口比例80%的族群搬到指定的「種族分區」，他們到其他區域時需攜帶通行證，否則會被視為非法移民拘捕，也不得在其他區域經商。公共游泳池、天橋、停車場、墓園、公廁、火車、醫院與救護車都是分開使用的，不同種族的人也不應該一起運動。請問上述狀況應發生在：
  options:
  - label: A
    content: 1920年代的英國
  - label: B
    content: 1940年代的德國
  - label: C
    content: 1960年代的美國
  - label: D
    content: 1980年代的南非
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 1962 年一本名叫《八月砲火》的書籍成為當年美國的暢銷書。這本書描述在柏林、倫敦、巴黎、維也納與莫斯科，一批軍事戰略專家為戰爭狀況做好各種規畫，一開始是基於預防性、遏阻性的動機，或是為了履行軍事同盟的義務。但到最後卻成為無人能理解、也無人能駕馭的連鎖反應機制，於是一件偶發事件成為不可收拾的局面。請問這本書的主題與何者最有關係？
  options:
  - label: A
    content: 普法戰爭的爆發
  - label: B
    content: 帝國主義國家爭奪殖民地
  - label: C
    content: 一次大戰的爆發
  - label: D
    content: 共產主義的興起
- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 歐洲的經濟重心，在海外探險及「發現新大陸」前後，呈現什麼轉變？
  options:
  - label: A
    content: 地中海→北大西洋→伊比利半島
  - label: B
