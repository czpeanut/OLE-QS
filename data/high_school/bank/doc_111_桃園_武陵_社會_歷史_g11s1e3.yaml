- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s2_34
  section: 2
  number: 34
  type: single
  page: 4
  stem: 資料一二三分別是哪個國家？
  options:
  - label: A
    content: 葡、義、美
  - label: B
    content: 西、義、美
  - label: C
    content: 葡、義、英
  - label: D
    content: 葡、德、美
  group_stem: '題，以下是1500 年以來西方各國的帝國事業描述。

    甲國：它是第一個取得海外帝國的歐洲國家，也是最後一個放棄海外帝國的國家。在 1540 年代已創造規模為本國五倍大的帝國，它們的帝國事業主要在亞洲各地建立重要據點，在海上以暴虐的「武裝貿易」聞名，並成為大航海時代第一個來到中國的西方勢力。

    乙國：該國的殖民主義被認為是「乞丐帝國主義」，急就章又自視甚高。在 19 世紀末能在東非擁有殖民地，背後是其他歐洲強國的計算：讓該國控制，可避免兩強權正面交鋒。1930 年代雖然付出沉重代價，又藉著入侵衣索匹亞，來宣揚自身的民族光榮。

    丙國：此國在一戰後開始獲得全球規模的領導霸權，成為一種非正式帝國(informal empire)。其帝國事業在意的不是空間的控制，而是對貿易、交通、通訊與文化交流的控制，網際網路只是這個趨勢的最新展現。要確保對貿易、交通的控制，則須擁有世界上最強大的軍事力量。'
