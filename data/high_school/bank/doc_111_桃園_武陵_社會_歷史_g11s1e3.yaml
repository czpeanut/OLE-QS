- id: doc_111_桃園_武陵_社會_歷史_g11s1e3_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 這場戰爭最有可能是哪場戰爭？
  options:
  - label: A
    content: 拿破崙戰爭
  - label: B
    content: 第一次世界大戰
  - label: C
    content: 第二次世界大戰
  - label: D
    content: 越戰
  group_stem: '題，請閱讀下列資料後回答問題：

    …… 24歲的托爾金來到戰場時，正好趕上參加索姆河戰役，這場戰役旨在打破協約國和同盟國之間的僵局，但是這一目標未能實現。

    7月1日，戰役第一天，就發生了瘋狂的殺戮。英軍不知道己方炮火未能攻破德軍的掩體，大舉衝上前去，死傷慘重。

    夜晚降臨之前，共有 19,240 名英國士兵戰死──戴維‧勞合‧喬治（David Lloyd George）首相稱他們是「我們最出類拔萃的年輕人」。100 年前的那一天，至今仍是英國戰爭史上死亡人數最多的一天。

    托爾金的傑作《魔戒》（The Lord of the Rings）很大程度上來源於他在索姆河戰役中的經歷，不過這個來源常常被人們忽視。……

    《魔戒》中戰爭場面的描寫似乎正是來自戰壕中的慘痛記憶：無休無止的炮火、芥子氣的陣陣毒霧，陣亡士兵的屍體倒在泥坑裡。在崗多之困中，充滿仇恨的獸人「挖出一條條深深的戰壕，構成一個巨大的圓環」，其他獸人操縱著「一台台用來投擲石彈的巨大機器」。

    在通往黑暗之主索倫的領地魔多的道路上，空氣中「充滿難聞的臭氣，讓他們無法呼吸，口乾舌燥」。托爾金後來承認，布滿成潭污穢，漂浮著無數屍體的死亡沼澤（Dead Marshes），「部分是來自索姆河戰役之後的法國北部」。……

    在戰後的歲月裡，索姆河成了一個典型，證明著戰爭帶來的巨大浪費與戰爭本身的毫無意義，它不僅象徵著戰爭的幻滅，也象徵著英雄主義這概念的幻滅。回到牛津，作為一個盎格魯─薩克遜文學教授，托爾金更偏愛亞瑟王傳說與貝奧武甫的道德世界。他想為一個中世紀的追求創造出一個現代版本：用神話的語言，敘寫戰爭的恐怖與美德。

    在《魔戒》中，我們見到了夏爾郡的霍比特人（哈比人）弗羅多‧巴金斯（Frodo Baggins）和山姆衛斯‧詹吉（Samwise Gamgee），他們要執行一項宿命的任務，摧毀最後的權力之戒，把中土世界從遭受奴役和毀滅的命運中拯救出來。托爾金筆下人物的英雄主義，在於他們能抵禦邪惡，以及面對失敗時的堅忍。這正是他在西線戰場上，在戰友們身上所看到的品質。

    「我們之所以活下來，都是因為那些小人物反抗強大命運的那股不可摧折的勇氣，這總是讓我深受觸動，」他解釋說。霍比特人「反映了英國士兵」，他們身材矮小，為了強調「普通人『在危急時刻』所爆發出的令人讚歎而且出乎意料的英雄主義」。……

    約瑟夫‧洛孔特，《紐約時報中文網》，2016.7.4。

    說明：托爾金（1892-1973）：牛津大學畢業後，在母校任教，以少尉軍官身分參與索姆河戰役。'
