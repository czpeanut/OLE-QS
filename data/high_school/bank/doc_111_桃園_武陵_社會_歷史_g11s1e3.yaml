  group_stem: '題。以下是某時期世界各地學生運動發展的狀況

    資料一：紐約哥倫比亞大學為美國東岸學生運動的重心。事件發生前三週黑人民權人士金恩被暗殺；學校被發現與美國國防分析研究所關係密切，間接捲入戰爭；加上興建專供黑人使用，帶有種族主義意味的體育館，引起學生抗議。動亂中，學生曾短暫攻陷校長室，在裡頭戴著太陽眼鏡抽雪茄，事件最後至少有 30 位哥大學生被退學。

    資料二：東京大學醫學部因為抗議學校更改實習制度，展開無限期罷課。之後學生占領學校精神象徵東大安田講堂，校長請求警方出動驅趕學生。引發其他學部(學院)學生不滿，認為違反大學自治精神，警察沒有權力進入校園，展開全面性罷課，又再度占領安田講堂，最後又被警方攻陷驅趕。在紛爭中，東大校長與 10 個學部部長全部辭職，東大有一年停止招收新生。

    資料三：此地因戰後大學教育過度膨脹，學位價值貶值、學費高漲，引發學生抗議，並獲得工人階級支持，政府一度擔心會爆發革命、內戰，總統逃往德國，政府雖然最後穩定局勢，總統之後被迫下臺。'
