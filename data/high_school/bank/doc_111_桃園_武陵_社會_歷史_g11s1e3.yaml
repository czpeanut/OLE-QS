  stem: 請問資料一二三的飲品分別是？
  options:
  - label: A
    content: 可可、咖啡、茶
  - label: B
    content: 茶、咖啡、可可
  - label: C
    content: 葡萄酒、咖啡、可可
  - label: D
    content: 茶、葡萄酒、可可
  group_stem: '題，以下是關於世界三大飲品的描述。

    資料一：原產地在中國西南，直到 19 世紀英國的植物獵人，將其成功移植至印度大吉嶺、阿薩姆之前，中國是最主要產地。該飲品在 18 世紀英國首先成為上層階級的飲品，之後再普及到各階層。由於保存困難，英國主要喝的是發酵後的種類，並加入砂糖、牛奶飲用。

    資料二：原產地在非洲衣索匹亞，其為 17、18 世紀伊斯蘭商人彌補歐洲人在印度洋發展貿易造成損失的產品，紅海某港口成為今日某品種名稱的由來。在傳入歐洲時，由於其對身心不好的謠傳，於是特別在法國，加入牛奶飲用，成為主流喝法。

    資料三：原產地在中南美洲，傳統喝法為溶解於水中，不加熱直接喝下去，加糖加熱是西班牙人的做法。在 19 世紀英國人將其改良成可直接食用的固狀物，在工業革命時代成為勞工替代酒精補充熱量的補給品，KitKat 獨有的溝槽設計就是設計給無暇休息勞工們的體貼心意。'
