  stem: 根據兩項資料，資料二的□□最有可能指的是何種疾病？
  options:
  - label: A
    content: 天花
  - label: B
    content: 梅毒
  - label: C
    content: 鼠疫
  - label: D
    content: 霍亂
  group_stem: '題，下列資料都來自克羅斯比，《哥倫布大交換》。

    資料一：它一來到，立如死神般散臨眾人，有些人全身蓋病(膿包)——臉上、頭上、胸前。一片驚慌混亂，許多都因此死了。他們走不動，他們只能倒在床上，他們動彈不得，他們起不來，他們換不了姿勢，他們不能側臥，他們不能俯臥，也不能仰臥。如果稍微動一下，就會大聲呼號。它的殺傷力極大，渾身遍體都是膿包，多少人就這樣病死了。

    資料二：大哉之問，當然，可能會引向過度簡化之答。或許我自己就犯過這個毛病：談到□□登陸美洲，以及第一次在此地傳播感染的經過，我就表示：獨獨根據這項事實本身，歐人當然會在美洲大獲全勝。的確，沒有免疫準備的人口，一旦爆發疫疾(通常稱之為疫疾處女地型的流行)，常常會導致高死亡率。可是若無其他外力介入干擾，他們的人數久之自會慢慢恢復。'
