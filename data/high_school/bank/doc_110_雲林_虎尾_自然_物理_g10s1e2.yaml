  section: 3
  number: 33
  type: single
  page: 4
  stem: EMS的系統中，若導軌電磁鐵線圈上的電流為順時針方向，則起落架電磁鐵線圈上的電流方向為何？（註：判斷電流方向時均以由上往下俯視）
  options:
  - label: A
    content: 順時針
  - label: B
    content: 逆時針
  - label: C
    content: 順時針和逆時針交互變化
  - label: D
    content: 無電流
  - label: E
    content: 無法判斷
  group_stem: '磁浮列車是一種使用磁力使得列車扶起並移動的交通工具。由於磁浮行駛時不與地面接觸，故可減小摩擦力，以獲得較高的行駛速率。磁浮的原理可分為兩大類，一個是以德國為代表的EMS系統（電磁力懸浮，又稱為常導型懸浮），另外則是以日本為代表的EDS系統（電動力懸浮，又稱為超導型懸浮）。EMS的原理，車廂底部的起落架上方及導軌的下方各有一組電磁鐵，通以電流時，兩者互相吸引，使得列車獲得一個向上的磁力，當向上的磁力與向下的重力達成平衡時，便能使得車廂浮在導軌上。

    EDS的原理，列車在導槽內行駛，車廂的兩側有電磁鐵，而導槽兩側則有8字型的線圈。當電磁鐵接近通過8字型線圈就會因電磁感應而在線圈上形成應電流，而應電流所生的磁場又與電磁鐵產生排斥及吸引的作用，最後形成一個向上的磁力使得列車能夠浮起。根據上述資料，試回答下列問題'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
