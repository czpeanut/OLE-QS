  answer_status: verified
  answer_source: answer_key
  explanation: (B)同一行星之面積速率相同。
- id: doc_110_雲林_虎尾_自然_物理_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有關力與運動的說法，何者正確？
  options:
  - label: A
    content: 物體受力時，速率一定改變
  - label: B
    content: 物體速度改變時，速率必也跟著改變
  - label: C
    content: 物體速度改變時必定受到力的作用
  - label: D
    content: 物體的瞬時速度為零時，所受的合力必是零
  - label: E
    content: 物體的運動速度是需要力來維持的
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)物體受力時，可能方向改變而速率不改變；(B)速度方向改變時，速率可能不改變；(D)瞬時速度為零時，所受合力可能不為零；(E)物體受力作用時，則速度改變。
