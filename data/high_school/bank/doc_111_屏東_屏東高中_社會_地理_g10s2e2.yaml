  group_stem: '彰化縣社頭鄉是臺灣織襪工業的大本營，自民國 70 年代中期之後，面對國內生產要素改變、產業結構的轉型及國內外市場不穩定等，廠商開始調整經營策略。請根據下列 4 家廠商的策略，回答下列問題：

    甲：派公司的技術人員到國外研習新的織襪技術，引進現代化電腦操作機器，促進大量及自動化生產，甚至自創品牌，強調品質與服務。

    乙：了解自行車選手腳步傷害主因、比賽規則等，研究腳趾到腳底板施力點在哪，哪邊需要透氣，把繃帶核心融入單車襪上，再研發一系列的單車襪款，攻進單車市場。

    丙：移到國外設廠，採取垂直整合模式，進行紡紗、染織、剪裁、車線、定型等一貫作業；達到規模經濟，降低生產成本。

    丁：尋找紡織、縫合、染整、包裝等的專業代工廠或家庭代工，與他們建立合作關係，並透過開會，讓代工們相互溝通培養良好默契。'
  answer:
