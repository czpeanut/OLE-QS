  stem: 19 世紀末期，某國政府日漸接受西方文化，官方也發出「興諺廢漢」的指令，開始用「諺文」書寫官方文書，諺文成為正式的「國文」，取代了長達 1,500 年以上的漢字。到了戰爭結束後的 1895 年，將法律文書一律改為夾帶漢字的「國文」。1910 年此國遭到日本吞併，「諺文」成為民族抗日標誌；1948 年恢復獨立後，政府公布《諺文專用法》，規定公務文件不得使用漢字。關於上述國家的發展史，下列敘述何者正確？
