questions:
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有言：「舉秀才不知書，察孝廉父別居。寒素清白濁如泥，高第良將怯如雞。」對這句話，我們應有何理解？
  options:
  - label: A
    content: 東漢察舉制度的流弊，推舉出來的文人及武將多不適任
  - label: B
    content: 唐代科舉制度的弊端，考上秀才的寒門子弟才識多平庸
  - label: C
    content: 宋代科舉取士的結果，導致重文輕武，武將怯於外侮
  - label: D
    content: 明代八股取士的遺毒，造成文人品性不端，武人不能打仗
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「舉秀才」與「察孝廉」二詞，即可推知這句話說的是東漢的察舉制度，但從秀才不知書、孝廉父別居、清白濁如泥、良將怯如雞等現象來看，此時的察舉制度已出現明顯名實不符的流弊，因此答案為(A)。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 古人認為，人死之後，鬼魂依活人給他們的供奉享祀而居，否則變為孤魂野鬼。古代禮制中的宗廟，正是供給祖先亡靈居處的所在。周代禮制規定祖先宗廟之祭：天子七廟，諸侯五廟，大夫三廟，士人一廟，庶人無廟，只能進行家祭。上文敘述所反映出的「禮」，其作用為何？
  options:
  - label: A
    content: 表達對祖先的戒慎恐懼
  - label: B
    content: 使上下有序、尊卑有別
  - label: C
    content: 強調上、下情感的一體
  - label: D
    content: 可強化上、下階層彼此的感情
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 周代禮制針對祖先的祭祀，從天子到庶人各有不同等級的規定，由此可反映出「禮」的作用在於區別上下、尊卑的社會階級，因此(B)為正解。(A)(C)(D)三者從題文中皆無法判斷。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 日本以天皇為主體的政治制度在 9 世紀開始解體，12 世紀末由武士所建立的幕府成為日本政權的實際擁有者。請問日本幕府執政的順序為下列何者？
  options:
  - label: A
    content: 鎌倉幕府→德川幕府→室町幕府
  - label: B
    content: 德川幕府→鎌倉幕府→室町幕府
  - label: C
    content: 鎌倉幕府→室町幕府→德川幕府
  - label: D
    content: 室町幕府→鎌倉幕府→德川幕府
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 日本幕府執政的順序為(C)鎌倉幕府（1192～1333）→室町幕府（1336～1573）→德川幕府（1603～1867）。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 春秋兩百餘年內，一方面某些貴族不但擴張壯大，終於取代國君；另一方面則是更多的貴族相繼淪亡，這兩種因素綜合起來，終於促使國內分屬國君與不同貴族之人民的身分逐漸整齊劃一。而在戰爭中，貴族的采邑歸公，使得國君直接控制的人口更多。請問春秋時期的國君使用何種制度掌握人民的身分與人口？
  options:
  - label: A
    content: 戶籍制度
  - label: B
    content: 土地制度
  - label: C
    content: 賦稅制度
  - label: D
    content: 封建制度
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 春秋晚期，為有效控制並管理人口，因此逐漸建立「編戶齊民」制度，將人民以戶為單位登記入籍，納入管轄且齊受均一的法律規範，(A)戶籍制度為正解。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 宋代宰相為同中書門下平章事，只管民政、另設樞密使掌軍事，設三司使掌理財政，對於中央官僚職掌的調整，主要目的為何？
  options:
  - label: A
    content: 透過細密的分工，以期提高政府效能
  - label: B
    content: 透過新的分工方式，以表達對各種專業領域人才的尊重
  - label: C
    content: 透過分權的做法削減宰相權力，以達集權之功效
  - label: D
    content: 為充分落實文人政治的理念
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 宋代合併中書與門下省成為宰相機構，但只管民政，將軍事與財政從原本的相權中抽離，可知其目的在削減宰相的權力，以達到中央集權之功效，答案為(C)。(A)將軍事與財政從相權分離後，三方面需要協調的事務更多，反而造成政府效能不彰。(B)宋代重文輕武，樞密院多由文人擔任，不符合對專業人才的尊重。(D)從題文中無法判斷。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「自古三公論道，六卿分職。自秦始皇置丞相，不旋踵而亡。漢、唐、宋因之，雖有賢相，然其間所用者，多有小人專權亂政，我朝罷相，設五府、六部，都察院、通政司、大理寺等衙門，分理天下事務，彼此頡頏，不敢相壓，事皆朝廷總之，所以穩當。以後嗣君並不許立丞相，臣下敢有奏請設立者，文武群臣即時劾奏，處以重刑。」上述資料旨在說明何事？
  options:
  - label: A
    content: 這是明太祖廢相時的言論
  - label: B
    content: 這是明成祖建立內閣制的言論
  - label: C
    content: 說明了中國丞相制度的優點
  - label: D
    content: 說明廢相後大權容易旁落宦官及權臣的現象
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料說明古代丞相制度的諸多缺點，最後結論是「以後嗣君並不許立丞相」，且不准臣下奏請設立，即可判斷應為(A)明太祖廢相時的言論。(C)資料所述盡是中國丞相制度的缺點。(D)明太祖廢相之時，並無法預測其後所產生的弊病。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 中國歷史上，「內朝」之所以會形成，其根本的主因是什麼？
  options:
  - label: A
    content: 相權和君權的衝突
  - label: B
    content: 漢武帝的雄才大略
  - label: C
    content: 政治事務日漸龐雜
  - label: D
    content: 帝國領土的日漸擴張
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 自秦始皇建立丞相制度以來，並無「外朝」與「內朝」之分，但漢武帝為壓制丞相權力，刻意任用親信幕僚如大司馬、尚書等參與政務，因此形成對應於三公的「內朝」，答案為(A)。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某國和中國的歷史淵源，可追溯到秦漢時代。該國漢化的過程主要可以分為三個階段，在秦代，秦始皇設置象郡，首先將該國北部納入中國版圖。到了漢代，漢武帝在該國北部設立交趾、九真、日南三郡，此時漢字已逐漸在當地傳播。五代十國時期，豪族丁部領於 968 年建立了大瞿越，方使得該國脫離中國獨立。這個國家是何者？
  options:
  - label: A
    content: 日本
  - label: B
    content: 暹羅
  - label: C
    content: 越南
  - label: D
    content: 朝鮮
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從象郡、交趾、九真、日南等郡名，即可推知此地為(C)越南北部，由中國直接管轄，直到五代十國時才脫離中國統治自立。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 學者認為，貴族制度是中國社會的產物，但就人格主義的原理而言，貴族階級不應該被限定於特定的家門內，而是應該包含所有具備貴族特長的人格者，使他們能做為社會的領導者，而科舉制度的施行，就是實現貴族制普遍化的結果。請問關於中國科舉制度之實施，下列敘述何者正確？
  options:
  - label: A
    content: 唐朝時成為選才的主要管道，能有效促進階級流通
  - label: B
    content: 宋朝時發展出彌封、謄錄等措施，有效提升科舉考試的公平性
  - label: C
    content: 元朝時廢除科舉制度，改由皇帝親自主持的殿試選拔人才
  - label: D
    content: 明清時以八股文取士，能客觀的選拔人才，並有助於讀書人思想的解放
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 宋朝對科舉制度進行了重大改革，設立了更加系統化的考試制度，包括鄉試、會試和殿試，這些考試層層遞進，從地方到中央，逐步篩選人才，並利用彌封、謄錄等方式防止舞弊，使考試制度更加嚴謹，答案為(B)。(A)科舉在唐代並非為選才的主要管道，當時門閥的勢力仍強，朝廷亦保有門閥入仕名額。(C)元朝仍保有科舉。(D)八股文格式嚴格，限定字數，不許違背經注，不能自由發揮，反而限制了讀書人的思想發揮。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 這個官職初設時，任務就是上奏文書預擬皇帝應下的裁斷文字，地位不高，如同皇帝的祕書一般，但經歷兩個皇帝的發展之後，其重要性大幅提升，皇帝將一切重要事項皆與其商議，並參考其票擬做出決策，有學者認為其地位等同於宰相。請問關於上述資料正確的理解是
  options:
  - label: A
    content: 這個官職指的是內閣大學士，其票擬可做為皇帝決策時的參考
  - label: B
    content: 這個官職指的是內閣大學士，權限不斷提升後能監控百官，使君權更加獨裁
  - label: C
    content: 這個官職僅掌管民政，軍政及財政另外設官治理，反映出宰相權力的衰退
  - label: D
    content: 這個官職在清朝時被廢除，由軍機大臣取代其原有職務
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「票擬」為內閣大學士的職權，最後決策權仍掌握在皇帝之手，正確答案為(A)。(B)內閣大學士僅握有票擬權，其權限並不包括監控百官。(C)此為宋代中央官制的敘述。(D)清朝沿續明制仍設內閣，但其職責漸為軍機處所取代。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某稅制：以州縣為單位，將所有的田賦、勞役（或代役的丁銀）以及各種攤派的貢納和雜差，統統折合成銀兩，歸併成一個總數，然後按本州、縣田畝分攤，向土地所有人徵收。「某稅制」為何？何時實行？
  options:
  - label: A
    content: 兩稅法、唐代
  - label: B
    content: 免役法、宋代
  - label: C
    content: 租庸調法、唐代
  - label: D
    content: 一條鞭法、明代
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「統統折合成銀兩，歸併成一個總數」，可推知為(D)明代的一條鞭法。(A)(B)以繳納錢幣為主。(C)以實物繳納賦稅。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 16 世紀東亞兩個國家的狀況如下：甲國以學習儒家學說為入仕之道，考試的科目包括策論與詩賦，多被文班與武班子弟壟斷；乙國的才智之士多投靠地方勢力，累積軍功是出人頭地最迅速的方式。請問甲國和乙國分別為何？
  options:
  - label: A
    content: 甲國是朝鮮，乙國是日本
  - label: B
    content: 甲國是越南，乙國是朝鮮
  - label: C
    content: 甲國是日本，乙國是朝鮮
  - label: D
    content: 甲國是朝鮮，乙國是越南
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 甲國的科考多被文班與武班（兩班階級）子弟壟斷，此國應為朝鮮；乙國地方勢力強盛且重視軍功，應為戰國時代的日本，故答案為(A)。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 唐太宗曾說：「以天下之廣，四海之眾，千端萬緒，須合變通，皆委百司商量，宰相籌畫，于事穩便，方可奏行。豈得以一日萬機，獨斷一人之慮也。」請問根據這個概念所設計出的中央官制為何？此官制有什麼特色？
  options:
  - label: A
    content: 內朝制，使皇帝親信進入決策核心
  - label: B
    content: 內閣制，確保皇帝能直接掌控六部
  - label: C
    content: 三省制，宰相分工明確，互不干涉
  - label: D
    content: 三省制，宰相能合議討論政事，互相監督
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 唐太宗認為天下之廣，事務千端萬緒，須「委百司商量，宰相籌畫」，因此設計出三省制，並置政事堂予三省長官合議討論，彼此監督制衡，可避免權相出現，故選(D)不選(C)。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 西漢丞相蕭何過世後，惠帝任命曹參繼任，曹參囑咐舊屬說：「牢獄和市集都是龍蛇雜處之地，沒事最好別去攪亂這兩個處所的內在秩序，否則搗蛋的壞分子無所容身，就會給整個社會帶來更大的不安。」曹參的見解最可能反映下列哪一類的思想、主張？
  options:
  - label: A
    content: 黃老思想：治道貴清靜而民自定
  - label: B
    content: 墨家思想：彊本節用則人給家足
  - label: C
    content: 法家思想：尊主卑臣分職不相逾越
  - label: D
    content: 儒家思想：以人主為天下之儀表
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 明知牢獄和市集是龍蛇雜處之地，卻主張不去攪亂這兩個處所的內在秩序，可知曹參的見解較接近道家的「無為而治」，答案為(A)。
- id: doc_112_苗栗_苗栗高中_社會_歷史_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: '唐代建立起以中國為中心的世界帝國體系，下列資料為東亞國家在唐朝時與中國的關係：

    甲國：始終處於唐朝的羈縻體制下，由中國的皇帝直接任命當地領袖為地方長官，統治模式最為直接。

    乙國：統一半島後並非完全脫離唐朝而獨立，仍然接受唐朝所授予的官爵，透過冊封體制維持與唐朝的臣屬關係，負有向唐朝朝貢的義務。

