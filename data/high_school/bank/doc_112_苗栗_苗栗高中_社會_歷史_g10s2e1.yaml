  stem: 有學者於文章中談到：「早期的官僚機構，是為了輔佐君主而生。皇帝將國家庶務決策權統一交給百僚之長，看上去君臣一心。但皇帝對相權總有猜疑，於是歷朝歷代皆是透過體制，將決策機構與流程設置的愈加繁瑣。甚至明代之後，將涉及決策的機構，直接廢除，改以『皇宮內祕書協助』的形式來解決。可以說，皇權與相權之間，不僅是地位之爭，也是決策之爭。」請問按上述可知，下列哪些「不能」代表國家將決策權逐漸分化的結果？
  options:
  - label: A
    content: 戰國時，因應專業化官僚體系，秦武王始設左、右丞相，掌丞天子，助理萬機
  - label: B
    content: 隋唐時，設置三省長官機構，負責國家政令的草擬、封駁與執行，並由皇帝發布
  - label: C
    content: 宋代時，將行政權歸於中書門下，財政權歸於三司，軍事權歸於樞密院
  - label: D
    content: 元代時，設置中書一省，設左右丞相，共掌軍務，凡軍國重事，無不由之
  - label: E
    content: 明代時，題本進入宮內，先由內閣票擬，皇帝參考調旨之後決策，交文書房批紅
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
