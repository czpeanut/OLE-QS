  stem: 從資料一可判斷，春秋戰國時期已有與夷狄相對的「中國」觀念，當時的「中國」應包括哪些區域？
  options:
  - label: A
    content: 黃河中下游一帶
  - label: B
    content: 黃河流域與長江流域
  - label: C
    content: 東北地區至中南半島
  - label: D
    content: 中原與華南地區
  group_stem: '請閱讀以下資料，並回答問題：

    資料一：「古代中國的『華夷』觀念，至少在戰國時代已經形成，那個時代，也許更早些時候，中國人就在自己的經驗與想像中建構了一個『天下』，他們想像，自己所在的地方是世界的中心，也是文明的中心。大地彷彿一個棋盤一樣，或者像一個回字形，四邊由中心向外不斷延伸，中心是王所在的京城，中心之外是華夏或者諸夏，諸夏之外是夷狄，大約在春秋戰國時代，就已經形成了與南夷北狄相對應的『中國』概念。」

    資料二：「有種傾向認為，朝鮮的『小中華』意識是清朝之後才有的。但其實早在明朝後期，出使北京的朝鮮使臣已經屢次表達對明朝禮崩樂壞、人心不古的鄙夷。他們尤其看不慣當時明儒推崇的王陽明心學，斥之為偽學邪說，認為程朱理學正統只有在朝鮮才得到悉心維護。這個時候，『小中華』意識已經存在了。到滿洲入主中原，『華夷變態』，就更加刺激了菁英士人的文化危機感和文化優越感。可見，這裡的『中華』首先不是國家意義上的中國，而指的是理學道統。」'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
