  stem: '有一理想彈簧直立在水平地面，今有一質量為 1 kg 的小球靜止在彈簧上緣正上方距離 20 m 處作自由落體運動。忽略小球體積與空氣阻力，設重力加速度為 $g＝10$ m／$s^{2}$，彈簧彈力常數為 k＝20 N／m，則：

