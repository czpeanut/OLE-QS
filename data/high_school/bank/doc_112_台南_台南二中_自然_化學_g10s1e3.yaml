  stem: 已知$KNO_{3}$在水中溶解度於90℃時為200克／100克水，於10℃時為20克／100克水。現在在90℃時取150克的飽和溶液，溫度冷卻至10℃時，可析出結晶若干克？
  options:
  - label: A
    content: '45'
  - label: B
    content: '60'
  - label: C
    content: '90'
  - label: D
    content: '100'
  - label: E
    content: '120'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 90℃時的150 g飽和溶液，當中包含100 g溶質、50 g水。假設降溫後析出x g結晶，則可列式：$\frac{100-x}{50}$＝$\frac{20}{100}$，得x＝90。故選(C)。
