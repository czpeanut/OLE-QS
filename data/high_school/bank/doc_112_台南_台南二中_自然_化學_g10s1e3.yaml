  section: 2
  number: 28
  type: multiple
  page: 4
  stem: 下列選項哪些敘述正確？
  options:
  - label: A
    content: 汽油和水不互溶，丙酮和水互溶，溶解度不同是因溶質和溶劑之本性
  - label: B
    content: 定溫下在均盛有50克水的三個燒杯甲、乙、丙中，分別加入10克、15克、20克的硫酸銅，經充分攪拌後，發現甲杯顏色最淡，而乙、丙二杯仍有固體沉澱，則甲杯是不飽和溶液，乙杯是飽和溶液，丙杯是過飽和溶液
  - label: C
    content: 承(B)，若升高相同溫度後，乙、丙二杯尚有固體沉澱，則其濃度相等
  - label: D
    content: 同壓下，二氧化碳溶於水之溶解度：10℃＜20℃
  - label: E
    content: 加大壓力，會增加食鹽對水的溶解度
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (B)乙、丙顏色相同，則濃度相同都為飽和溶液；(D)氣體溶解度皆隨溫度上升而下降；(E)壓力對固體溶解度影響不大。故選(A)(C)。
