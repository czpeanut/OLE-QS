- id: doc_112_台南_台南二中_自然_化學_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 把點燃的鎂帶放進二氧化碳的集氣瓶中，發現鎂帶繼續燃燒，反應後瓶壁上有黑色斑點附著。試問下列敘述何者<u>正確</u>？
  options:
  - label: A
    content: 此反應的平衡反應式為：Mg＋$CO_{2}$ → MgO＋CO
  - label: B
    content: 瓶壁上黑色斑點為氧化鎂
  - label: C
    content: 在這反應中鎂進行還原反應
  - label: D
    content: 儲存鎂粉的倉庫失火時，可用二氧化碳滅火器來滅火
  - label: E
    content: $CO_{2}$為氧化劑
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為2Mg＋$CO_{2}$ → 2MgO＋C；(B)黑色固體為碳；(C)鎂被氧化成氧化鎂；(D)由此實驗可得知，鎂可在二氧化碳中燃燒，故不能用二氧化碳滅火器撲滅火勢；(E)正確，二氧化碳本身被還原成碳。故選(E)。
  tags:
