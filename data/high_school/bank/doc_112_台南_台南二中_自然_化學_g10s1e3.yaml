  stem: 蔗糖（分子量＝342）1.71 g及澱粉（分子量＝162 n）3.24 g的混合物，完全水解成單醣後，可得何種單醣各多少克？
  options:
  - label: A
    content: 葡萄糖＝4.5克，果糖＝0.9克
  - label: B
    content: 葡萄糖＝4.95克，果糖＝1.71克
  - label: C
    content: 葡萄糖＝3.6克，果糖＝1.8克
  - label: D
    content: 葡萄糖＝3.6克，果糖＝0.9克
  - label: E
    content: 葡萄糖＝5.4克
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 蔗糖1.71 g＝$\frac{1.71}{342}$＝5×$10^{－3}$ mol，水解可得5×$10^{－3}$ mol葡萄糖、5×$10^{－3}$ mol果糖。澱粉3.24 g＝$\frac{3.24}{162n}=\frac{3.24}{162n}=\frac{2}{n}$×$10^{－2}$ mol，水解可得2×$10^{－2}$ mol葡萄糖。共2.5×$10^{－2}$ mol葡萄糖⇒2.5×$10^{－2}$×180＝4.5 g、5×$10^{－3}$ mol果糖⇒5×$10^{－3}$×180＝0.9 g。故選(A)。
