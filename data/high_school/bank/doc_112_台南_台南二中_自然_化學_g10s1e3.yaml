  stem: 有甲、乙、丙三瓶醋酸溶液（醋酸分子量＝60），各瓶之濃度分別為：(甲) 20％重量百分率；(乙) 250000 ppm（百萬分點濃度）；(丙) 4.0 M（比重1.1），則各瓶醋酸溶液濃度之大小次序，何者正確？
  options:
  - label: A
    content: 丙＞甲＞乙
  - label: B
    content: 乙＞丙＞甲
  - label: C
    content: 甲＞乙＞丙
  - label: D
    content: 乙＞甲＞丙
  - label: E
    content: 丙＞乙＞甲
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '% → ppm數值乘以10000倍（百分濃度→百萬分濃度），故(乙)可視為25％。(丙)可假設1 L溶液中有4 mol溶質，因比重＝1.1，則溶液重量＝1100 g，溶質重量＝4×60＝240 g。重量百分濃度＝$\frac{240}{1100}$×100％＝22％。濃度：乙＞丙＞甲。故選(B)。'
