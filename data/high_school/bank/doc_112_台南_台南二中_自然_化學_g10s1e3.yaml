- id: doc_112_台南_台南二中_自然_化學_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 已知坊間所賣的光觸媒，其主要成分是奈米級的二氧化鈦，而其吸收光之波長至少需低於400 nm。吸收光能後的二氧化鈦具有相當強之氧化力，可以直接將吸附在物質表面之汙染物直接氧化，使其分解，或者將吸附於物質表面之水分子氧化為氫氧根自由基（‧OH＋$H^{＋}$＋$e^{－}$ → $H_{2}$O）進而分解汙染物。試問下列敘述何者正確？
  options:
  - label: A
    content: ‧OH為強還原劑可以分解汙染物
  - label: B
    content: 奈米級的顆粒大小，是比原子的大小更小
  - label: C
    content: 光觸媒處理過的場所，在黑暗中也具有消毒效果
  - label: D
    content: 即便是塊材等級的二氧化鈦，仍然有光觸媒的效果
  - label: E
    content: 二氧化鈦達到奈米級時，$\frac{表面積}{體積}$的比值相當高，性質會變得更為活潑
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由半反應方程式可得知‧OH被還原，為氧化劑；(B)原子半徑約為$10^{－10}$ m，奈米為$10^{－9}$ m；(C)光觸媒需照光才有效果；(D)需奈米等級的二氧化鈦才有效果。故選(E)。
  tags:
    unit:
      code: CH-1-4-4
