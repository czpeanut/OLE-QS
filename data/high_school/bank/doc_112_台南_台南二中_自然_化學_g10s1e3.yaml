- id: doc_112_台南_台南二中_自然_化學_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有五組化合物，哪一組的三種化合物水溶液均可導電，且全部都是分子化合物？
  options:
  - label: A
    content: CO、$NH_{4}NO_{3}$、$HClO_{3}$
  - label: B
    content: $C_{6}H_{12}O_{6}$、HCl、$CH_{4}$
  - label: C
    content: $C_{2}H_{5}$OH、$H_{2}$S、NaOH
  - label: D
    content: $CH_{3}$COOH、$CO_{2}$、$NH_{3}$
  - label: E
    content: KCl、$H_{2}SO_{4}$、MgO
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) CO不可導電、$NH_{4}NO_{3}$為離子化合物；(B) $C_{6}H_{12}O_{6}$、$CH_{4}$不可導電；(C) $C_{2}H_{5}$OH不可導電、NaOH為離子化合物；(D)皆為酸/鹼，可導電；(E) KCl、MgO為離子化合物。故選(D)。
