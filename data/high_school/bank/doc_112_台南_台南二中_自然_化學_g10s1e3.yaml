- id: doc_112_台南_台南二中_自然_化學_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 自然界中，氧化還原反應扮演著重要的角色，下列有關碳循環的過程，何者沒有牽涉到氧化還原反應？
  options:
  - label: A
    content: 細胞呼吸是利用葡萄糖反應產生二氧化碳，並釋出能量
  - label: B
    content: 生物體內的碳水化合物逐漸在地層中沉積，最後轉變成煤
  - label: C
    content: 煤和石油在空氣中燃燒產生二氧化碳
  - label: D
    content: 二氧化碳溶於水，與鈣離子（$Ca^{2＋}$）結合，以碳酸鈣沉澱的方式積存於海底
  - label: E
    content: 二氧化碳經由光合作用轉變為葡萄糖，並釋放出氧氣
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(E)葡萄糖轉變為二氧化碳：$C_{6}H_{12}O_{6}$＋$6O_{2}$ → $6CO_{2}$＋$6H_{2}$O，其與逆寫之反應皆屬於氧化還原反應；(B)碳水化合物中，碳的價數（氧化數）不一定為0，煤為元素碳，價數（氧化數）為0，故屬於氧化還原反應；(C)燃燒反應為氧化還原反應；(D)二氧化碳溶於水成為碳酸（$H_{2}CO_{3}$），碳酸根（$CO_{3}^{2－}$）再與$Ca^{2＋}$形成碳酸鈣沉澱，過程中碳的價數（氧化數）均為＋4，不為氧化還原反應。故選(D)。
