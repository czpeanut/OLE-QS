  stem: 1881年起，瑞典人阿瑞尼斯進行電解質導電情形的研究，於1884年提出「電解質解離說」。下列各項敘述，何者錯誤？
  options:
  - label: A
    content: 食鹽溶液可導電，是因在水溶液中可解離出離子
  - label: B
