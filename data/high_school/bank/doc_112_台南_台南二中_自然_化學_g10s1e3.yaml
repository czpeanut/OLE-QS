  section: 1
  number: 12
  type: single
  page: 1
  stem: 若某單醣的分子式為$C_{6}H_{12}O_{6}$，那麼其形成之參醣的分子式為何？
  options:
  - label: A
    content: $C_{18}H_{32}O_{16}$
  - label: B
    content: $C_{18}H_{34}O_{17}$
  - label: C
    content: $C_{18}H_{36}O_{18}$
  - label: D
    content: $C_{18}H_{30}O_{15}$
  - label: E
    content: $C_{18}H_{30}O_{16}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 參醣形成是由三個單醣分子脫去兩個水，故可表示成$3C_{6}H_{12}O_{6}$ → 參醣＋$2H_{2}$O，可得參醣分子式為$C_{18}H_{32}O_{16}$。故選(A)。
  tags:
    unit:
