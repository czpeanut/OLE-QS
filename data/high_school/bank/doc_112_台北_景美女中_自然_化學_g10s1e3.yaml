  - label: C
    content: 這些溫室氣體在大氣中的主要來源
  - label: D
    content: 這些溫室氣體的分子量
  - label: E
    content: 這些溫室氣體的分子結構
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 溫室氣體對全球暖化的貢獻不只和相對暖化效應有關，另外兩個重要因素為在大氣中的含量與停留時間，由於二氧化碳的含量遠大於其他溫室氣體，故整體效應最大。
