  stem: '在探討全球暖化的議題時，已知有一份溫室氣體相對暖化效應的資料：

    | 溫室氣體 | $CO_{2}$ | $CH_{4}$ | $N_{2}$O | $CCl_{2}F_{2}$ | $SF_{6}$ |

    | --- | --- | --- | --- | --- | --- |

    | 大氣暖化相對能力 | 1 | 25 | 298 | 11000 | 22800 |

    此資料顯示 1 個溫室氣體的分子與 1 個 $CO_{2}$ 比較下，會造成大氣暖化的相對能力，例如：$CH_{4}$ 造成大氣暖化的相對能力便為 $CO_{2}$ 的 25 倍，同理 $SF_{6}$ 造成大氣暖化的相對能力便為 $CO_{2}$ 的 22800 倍，基於這份資料，有些人便認為 $CO_{2}$ 不是導致全球暖化的主要元兇，為了可以做出更正確合理的判斷，應該再提供下列哪些資料？（應選 2 項）'
  options:
