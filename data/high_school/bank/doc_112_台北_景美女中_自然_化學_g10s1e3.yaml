  section: 1
  number: 16
  type: single
  page: 2
  stem: '科學家發現用於臘肉與香腸的防腐劑亞硝酸鹽（如 $NaNO_{2}$），當其隨著食物進入人體後，易解離出 $NO_{2}^{－}$。$NO_{2}^{－}$ 會將血紅素中的亞鐵離子（$Fe^{2＋}$）＿＿＿(1)＿＿＿為鐵離子 （$Fe^{3＋}$），進而破壞紅血球輸送氧氣的功能；此時可以醫療上常用的維生素 C 作為解毒劑，利用維生素 C 作為＿＿＿(2)＿＿＿劑將 $NO_{2}^{－}$ 轉變成 NO，以保護紅血球免遭破壞。上述欄位(1)、(2)的組合應為何？

    | 選 項 | (A) | (B) | (C) | (D) | (E) |

    | --- | --- | --- | --- | --- | --- |

    | 欄位(1) | 氧化 | 還原 | 氧化 | 還原 | 以上皆非 |

    | 欄位(2) | 還原 | 還原 | 氧化 | 氧化 |  |'
  options:
  - label: A
    content: 欄位(1)：氧化；欄位(2)：還原
  - label: B
    content: 欄位(1)：還原；欄位(2)：還原
  - label: C
    content: 欄位(1)：氧化；欄位(2)：氧化
  - label: D
    content: 欄位(1)：還原；欄位(2)：氧化
  - label: E
    content: 欄位(1)：以上皆非
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: $NO_{2}^{－}$ 為氧化劑，故可將 $Fe^{2＋}$ 氧化成 $Fe^{3＋}$，維生素 C 為還原劑，故可將 $NO_{2}^{－}$ 還原成 NO。
