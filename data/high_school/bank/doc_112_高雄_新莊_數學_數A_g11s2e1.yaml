    content: $\vec{a}\times \vec{b}=\vec{b}\times \vec{a}$
  - label: B
    content: $(\vec{a}+\vec{b}) \cdot (\vec{a}\times \vec{b})=0$
  - label: C
    content: $(\vec{a} \cdot \vec{b}) \cdot \vec{c}=\vec{a} \cdot (\vec{b} \cdot \vec{c})$
  - label: D
    content: $\vec{a}\times \vec{b}= |\vec{a}||\vec{b}|\sin \theta$
  - label: E
    content: $|\vec{a}\times \vec{b}|^{2}+|\vec{a} \cdot \vec{b}|^{2}= |\vec{a}|^{2}|\vec{b}|^{2}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
