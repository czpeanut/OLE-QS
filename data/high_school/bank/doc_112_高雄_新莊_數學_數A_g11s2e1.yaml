  stem: 'A. <u>小新</u>玩滑翔翼，自海拔450公尺的山頂直線滑翔而下，降落到地面的目標區。現<u>莊仔</u>位於此 山頂在地面的垂足正北方1000公尺處，開車再向北走了200公尺，然後再向東走了600公 尺也到達同一個目標區。已知地面的海拔高度為50公尺，今兩人同時出發、同時抵達目標 區，已知汽車的平均速率為800（公尺／分），則滑翔翼的平均速率為＿＿＿＿（公尺／分）。

    B. 空間中三向量$\vec{a}$＝( 1 , 1 , 1 )、$\vec{b}$＝( 113 , 112 , 110 )、$\vec{c}$＝( 202 , 200 , 209 )，則由$\vec{a}$、$\vec{b}$、$\vec{c}$所展成的平行六面體的體積為＿＿＿＿。

    C. 已知空間中四點A ( 1 , 1 , 1 )、B ( 2 , 3 , 5 )、C ( 2 , －4 , 26 )、D ( 2 , k＋1 , $k^{2}$＋1 ) 共平面，則所有可能k值的和為 ＿＿＿＿。

    D. 有一光線過A ( 2 , －3 , 3 ) 經鏡面E上一點P ( 1 ,－1 , 1 ) 反射後，朝B (－3 , 1 , 5 ) 的方向直線前進，則鏡面E之方程式為＿＿＿＿。

    E. 空間中一長方體ABCD－EFGH如右圖，其中三個頂點的坐標為A ( 2 , 1 , －1 )、B ( 0 , 3 , －2 )、 D ( 4 , 4 , 5 )，且長方體體積為42$\sqrt{17}$，則點H的坐標為＿＿＿＿。

    F. 如右圖，正立方體OABC－DEFG的稜長為2，K為正方形DEFG的中心，若正四角錐K-OABC 相鄰兩側面的夾角為θ，則 | cos θ |＝＿＿＿＿。

    G. 在坐標空間中，一平面E過點P ( 1 , 4 , 2 )，且與x軸、y軸、z軸的正向分別交於A、B、C三點，又設O為原點，則當 $\overline{OA}+\overline{OB}+2\overline{OC}$有最小值時，平面E的方程式為＿＿＿＿。'
