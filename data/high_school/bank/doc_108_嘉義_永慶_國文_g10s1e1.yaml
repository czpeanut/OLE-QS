  - label: A
    content: 到了五月節，石榴花沒有開得那麼紅，那麼大
  - label: B
    content: 四個姊妹和兩個弟弟都坐在院子裡的小板凳上，他們在玩沙土，旁邊的夾竹桃不知什麼時候垂下了好幾枝子，散散落落的很不像樣
  - label: C
    content: 我的襟上一朵粉紅色的夾竹桃，是臨來時媽媽從院子裡摘下來給我別上的，她說：「夾竹桃是你爸爸種的，戴著它，就像爸爸看見你上臺一樣！」
  - label: D
    content: 從最高臺階的<u>正金銀行</u>出來．看著<u>東交民巷</u>街道中的花圃種滿了蒲公英，我高興的想：闖過來了，快回家去，告訴爸爸，並且要他明天在花池裡也種滿了蒲公英
