  stem: 〈傷仲永〉中，從「指物作詩立就，其文理皆有可觀者」到「今作詩，不能稱前時之聞」到「泯然眾人矣」，<u>無法</u>看出：
  options:
  - label: A
    content: 仲永的不進反退
  - label: B
    content: 王安石鄙視仲永
  - label: C
    content: 人若不學，天才亦不足恃
  - label: D
    content: 王安石惋惜仲永的際遇
  group_stem: 金谿民方仲永，世隸耕。仲永生五年，未嘗識書具，忽啼求之。父異焉，借旁近與之，即書詩四句，並自為其名。其詩以養父母、收族為意，傳一鄉秀才觀之。自是指物作詩立就，其文理皆有可觀者。邑人奇之，稍稍賓客其父，或以錢幣乞之。父利其然也，日扳仲永環謁於邑人，不使學。 予聞之也久。明道中，從先人還家，於舅家見之，十二三矣。今作詩，不能稱前時之聞。又七年，還自揚州，復到舅家，問焉。曰：「泯然眾人矣！」 王子曰：「仲永之通悟，受之天也。其受之天也，賢於材人遠矣。卒之為眾人，則其受於人者不至也。彼其受之天也，如此其賢也，不受之人，且為眾人；今夫不受之天，固眾人，又不受之人，得為眾人而已邪？」（王安石〈傷仲永〉）
