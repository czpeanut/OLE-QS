  group_stem: 以下文章節錄自徐仁修〈桃花源記現代版：獨龍族〉。閱讀內容後回答下列問題： 一九九九年，首次打通這條公路，但因山高積雪深厚，每年冰封半年以上，再加上雨季路滑，通行困難。二○一五年底，六公里長穿越高黎貢山脊梁的隧道終於打通，再加上派駐鏟雪車，現在不通的時間就少得多了。 公路穿過高黎貢山脊梁隧道之後，急速下降，從海拔三千四百公尺降至一千四百公尺左右。終於我們俯望到深谷中的綠色獨龍江，這裡就是獨龍族隱居的山谷。以前少為外人所知，唯一與外界聯繫是每年馬幫會在夏季，越過高山來到此與獨龍族人以物易物。 這是陶淵明寫的〈桃花源記〉現代真實版，他們不知有中華民國，也不知有二次世界大戰。當一九九九年，打通公路之後，人民政府帶著大量物質與技術人員進入，為族人建立新房舍，建公路，架橋梁，辦學校。他們從十六世紀的生活一下子跳到二十一世紀…… 他們的寨子十分乾淨，房子四周種著桃樹，現在正是桃花盛開，這是真正的世外桃源啊！獨龍江四周都是雪山與外界隔離，江的兩岸是峽谷絕壁，幾乎沒有平地。他們的小小寨子建在江邊窄窄的緩坡，或崖壁上方的小小空地。我們走訪了好幾個寨子，我發現他們的相貌很特別，男的斯文而有俊氣，女生溫和又秀氣，似乎某種感覺有些些日本民族味。同行的段世同先生，突然想起他看過的資料說，有日本學者認為獨龍族是他們的祖先，因為日本人的胎記與獨龍族相同。獨龍族會不會是秦始皇派向西南尋找長生不老藥的另一隊伍佰童男童女？
