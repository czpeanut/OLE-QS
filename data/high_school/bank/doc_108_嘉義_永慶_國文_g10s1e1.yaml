  group_stem: 下列兩篇皆為生態作家劉克襄以同一棵雀榕為主題所寫的文章，閱讀後回答問題： (甲) 每年春天，我都會如約前往金山，拜訪那棵大樹。一棵可能在荷蘭時代就出現的雀榕。 還記得最初時，它的周遭都是泥土，好幾種野花野草，像馬齒筧、車前草、鼠麴草和昭和草等。它的身上還有伏石蕨、山蘇花等依傍著。每一年，我們也會幫它從樹洞裡清除一些有礙生長的垃圾，諸如鋁鐵罐、錫箔紙寶特瓶之類。大樹旁邊的漁村很乾淨 ，那些垃圾可能都是遊客帶來的。 有時我們去時，它正重新冒出新芽，甚至還綠葉蓊鬱，形成一片傘狀的綺麗樹海。雀榕就是這種怪脾氣，不按時節冒芽，讓人捉摸不著，跟它遙望的大海一樣。我們只能依著它長什麼樣子，欣賞它的多樣變化了。 但誰會料到，當今年春天我抵達漁村，赫然發現，老樹不見了。原本矗立著大樹的地方，只剩下空曠的水泥地，一口深井，以及曾經陪伴它的紅磚屋。 怎麼會這樣呢？我吃驚地倒抽了一口冷氣。再趨前一看，老樹竟然只剩下殘根，整棵樹都不見了。殘留的樹根已經腐朽和些許泥土攪拌在一塊。村人似乎認為是肥沃的土壤，利用為菜畦，種滿了紅鳳菜。 我再回顧四周，旁邊一棵連皮掉落的巨大樹幹正躺在草地裡，樹上還殘留者一些丟棄的垃圾。那不就是大樹嗎？ 我走過去檢視，兀自站著，低迴了好一陣，還是不肯相信這個事實。 挨著旁邊狹窄巷弄的住家探詢，結果遇見了一位老婆婆，無所事事地蹲在門口。她告訴我，老樹是自己老死掉的。她還指著旁邊的公園說，以前附近也有一棵，也是莫名奇妙地死去。 我再回到大樹佇立過的位置，仔細看周遭。除了有些變成腐木，還殘留的一小段樹根，透露了它在死前，顯然被蟲蛀蝕得相當厲害。同時，因為被水泥地面包圍著，搞不好也是它提早結束生命的原因。水泥是前幾年才鋪的。我愈看愈生氣，直想把大樹的死亡歸罪到這個原因，因為我實在找不出更好的原因。（改寫自〈□□□□〉） (乙) 這棵基部足足可讓四人擁抱的大樹，葉子已經落得一乾二淨，只剩肥胖的軀幹和枯枝伸向清冷的天空。以前爸爸去金山賞鳥，都會順路去探望它。有一次，我在它身上粗略統計了一下，還有十來種草木寄宿在它身上；像常見的酢漿草、鼠麴草、黃鵪菜、馬齒莧等，都會發現。 但附近的人並非很善待它，他們在它的身上纏繞了電線，還掛魚網曝晒，樹幹間的樹洞裡也堆積著廢棄的空罐頭和保特瓶。我們仔細探視這位老朋友，它的枯枝已有一些紅色的嫩芽，準備掙出天空了。下個月再來，想必已蓊鬱成一片樹海！
    它的旁邊還有一位垂倒的夥伴，大概是枯死一段時候了，又有新的小雀榕自枯樹裡長出橢圓、淺黃的優雅嫩葉，象徵著新生命的孳生不息。（節錄自〈大樹之歌〉）
