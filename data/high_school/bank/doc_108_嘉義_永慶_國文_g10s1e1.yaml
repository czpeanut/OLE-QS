  stem: 下列選項，最符合上文「畫家」敘述的是：
  options:
  - label: A
    content: 他原本和藹可親的微笑，可以讓他跟周遭的人、事保持適當距離
  - label: B
    content: 他婚後，生活圈有了改變，他對於和眾多的人相處，感到很厭倦
  - label: C
    content: 他在閣樓裡畫了一幅拼滿字母的畫作，但他因太辛勤工作而昏倒
  - label: D
    content: 他體認到，創作得「孤獨」與「合群」兼備，他還是較偏好前者
  group_stem: <u>卡謬</u>有一篇短篇小說「<u>工作中的藝術家</u>」，大意是這樣的：有一個人，因閒暇而對繪畫產生興趣，結果沒費多大功夫就在這方面有了令人艷羨的成就。他原是一個相當安靜的人，對於周遭的人和生活環境只保留著一種和藹可親的微笑，這種微笑可使他免於關心俗事，而專心繪畫。 婚姻為他帶來了三個兒女，繪畫的成就為他帶來了大批的朋友、崇拜者及門生，他的畫室變成像菜市場般，有小孩的哭聲、藝術與美學的討論、時局與政治的爭辯。他喜歡繪畫，也喜歡這些人，但一方面要畫這個世界和人們，一方面又要和他們生活在一起，這對他而言似乎是一種兩難。 終於，他的聲望盛極而衰。但家裡還是有一群遲來的崇拜者、發牢騷者、同情者、長大的孩子和日漸衰老的妻子進進出出。他經常望著天空發呆，他想重新開始，要創造出偉大而嶄新的作品。最後。他在天花板的高牆間蓋了一個閣樓，開始到那上面工作，不受人打擾也不打擾別人。他不停地工作著，不眠不食，幾天後因工作過度而昏迷在閣樓裡。他最忠誠的朋友發現他辛勤工作的畫布上竟然空空如也，只有在中心處用很小的宇母寫了一個字，但不太能確定它是solitary（孤獨的），還是solidary（合群的）。 畫家到最後才體認到，要創造出不朽的傑作。「孤獨」與「合群」是缺一不可。這不僅對藝術家如此，對所有想過創造性生活的人亦是如此。「孤獨」是一種面對永恆、審視自我的主動體認，恐懼孤獨的人乃是在逃避他的自我。而「合群」則是在人群中發現自己生命的意義，一個不想與他人發生關係的人，將像空轉的輪子，無任何意義可言。（節錄自<u>王溢嘉工作中的藝術家</u>）
