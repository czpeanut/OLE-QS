  group_stem: 閱讀下列文章，並回答問題： 余家貧，耕植不足以自給。幼稚盈室，缾無儲粟，生生所資，未見其術。親故多勸余為長吏，脫然有懷，求之靡途。會有四方之事，諸侯以惠愛為德；家叔以余貧苦，遂見用於小邑。於時風波未靜，但心憚遠役。彭澤去家百里，公田之利，足以為潤，故便求之。及少日，眷然有歸與之情。何則？質性自然，非矯厲所得；飢凍雖切，違已交病。嘗從人事，皆口腹自役，於是悵然慷慨，深愧平生之志。猶望一稔，當斂裳宵逝。尋程氏妹喪於武昌。情在駿奔，自免去職。仲秋至冬，在官八十餘日。因事順心，命篇曰〈歸去來兮〉，序乙已歲十一月也。（陶淵明〈歸去來辭序〉）
