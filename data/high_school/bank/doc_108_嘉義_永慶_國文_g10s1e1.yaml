    content: 他們從十六世紀的生活一下子跳到二十一世紀的主因是公路打通了
  - label: B
    content: 根據他們的相貌特徵，有可能是日本人的祖先
  - label: C
    content: 過去獨龍族唯一與外界的聯繫是為了交換物資
