  stem: 〈師說〉一文語氣極富變化，同是慨嘆時人的愚蠢，結尾語氣卻各有不同。下列對於各段結尾語氣之說明，正確的是：
  options:
  - label: A
    content: 「聖人之所以為聖，愚人之所以為愚，其皆出於此乎」──用推測語氣，說明聖人愚人之差別
  - label: B
    content: 「小學而大遺，吾未見其明也」──用反詰語氣，說明小學大遺的愚蠢
  - label: C
    content: 「巫、醫、樂師、百工之人，君子不齒，今其智乃反不能及，其可怪也歟」──用判斷語氣，說明其中令人不解之處
  - label: D
    content: 「聞道有先後。術業有專攻，如是而已」──用感嘆語氣，說明從師問學之必要
