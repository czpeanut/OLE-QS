- id: doc_109_台中_台中二中_數學_數B_g11s2e2_s3_2
  section: 3
  number: 2
  type: single
  page: 2
  stem: 'S公司於2020年11月19日於全球發行最新的次世代遊戲主機PS5，在上市之前公司內部以對數函數y＝$log_{a}$ ( x＋k ) 來預估上市後一個月內的銷售總數量 ( 如右圖所示 )，此函數表示從銷售日算起x天後 ( 0 ≤ x ≤ 30 )，共可賣出y百萬台主機，其中a、k為常數。

    (1) 根據文中的對數函數與圖形，請選出正確的選項？( 多重選擇題 )'
  options:
  - label: A
    content: k＜0
  - label: B
    content: 0＜a＜1.5
  - label: C
    content: 1.5 ≤ a＜3
  - label: D
    content: 當1 ≤ x ≤ 30時，y＝log ( x＋k ) 恆在y＝$log_{a}$ ( x＋k ) 圖形的上方
  - label: E
    content: 當1≤ x≤ 30時，y＝$log_{a}$ x恆在y＝$log_{a}$ ( x＋k )圖形的下方
  assets:
  - key: s3_2_f1
    kind: figure
    file: doc_109_台中_台中二中_數學_數B_g11s2e2/s3_2_f1.png
