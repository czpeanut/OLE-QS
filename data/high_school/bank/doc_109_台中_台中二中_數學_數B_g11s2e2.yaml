- id: doc_109_台中_台中二中_數學_數B_g11s2e2_s3_2
  section: 3
  number: 2
  type: multiple
  page: 2
  stem: S 公司於 2020 年 11 月 19 日於全球發行最新的次世代遊戲主機 PS5，在上市之前公司內部以對數函數 $y = \log_a(x+k)$ 來預估上市後一個月內的銷售總數量，此函數表示從銷售日算起 $x$ 天後（$0 \le x \le 30$），共可賣出 $y$ 百萬台主機，其中 $a$、$k$ 為常數。已知此函數圖形通過 $(0, 0)$ 與 $(1, 2)$ 兩點，請選出正確的選項？（多重選擇題）
  options:
  - label: A
    content: k＜0
  - label: B
    content: 0＜a＜1.5
  - label: C
    content: 1.5 ≤ a＜3
  - label: D
    content: 當1 ≤ x ≤ 30時，y＝log ( x＋k ) 恆在y＝$log_{a}$ ( x＋k ) 圖形的上方
  - label: E
    content: 當1≤ x≤ 30時，y＝$log_{a}$ x恆在y＝$log_{a}$ ( x＋k )圖形的下方
  assets:
  - key: s3_2_f1
    kind: figure
    file: doc_109_台中_台中二中_數學_數B_g11s2e2/s3_2_f1.png
    crop:
      page: 2
      rect:
      - 39.6
      - 89.8
      - 159.25
      - 198.4
  explanation: '(A) ×：代入 $(0,0)$ 得 $\log_a k = 0 \Rightarrow k = 1 > 0$。

    (B) ○：代入 $(1,2)$ 得 $\log_a 2 = 2 \Rightarrow a = \sqrt{2} \approx 1.414$，故 $0 < a < 1.5$。

    (C) ×：承 (B)，$a < 1.5$。

    (D) ×：當 $1 \le x \le 30$ 時，$x+1 > 1$ 且 $10 > \sqrt{2}$，故 $\log(x+1) < \log_{\sqrt{2}}(x+1)$。

    (E) ○：當 $1 \le x \le 30$ 時，$x < x+1$ 且 $a = \sqrt{2} > 1$，故 $\log_a x < \log_a(x+1)$。'
