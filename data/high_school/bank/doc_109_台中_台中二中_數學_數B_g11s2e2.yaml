  explanation: '(2) 十年後本利和為$10^{4}$×( 1＋0.08 )$^{10}$＋$10^{4}$×( 1＋0.08 )$^{9}$＋……＋$10^{4}$×( 1＋0.08 ) ＝$10^{4}$ ( 1.08＋$1.08^{2}$＋……＋$1.08^{10}$ ) ＝$10^{4}$×1.08×$\frac{1.08^{10}-1}{1.08-1}\approx\frac{10^{4}\times 1.08\times (2.16-1)}{0.08}$＝156600 故<u>阿兩</u>一共可得156600元

    2. (1) (A) ×：將 ( 0 , 0 ) 代入可得$log_{a}$ k＝0 ⇒ k＝1＞0 (B)○：將 ( 1 , 2 ) 代入可得$log_{a}$ 2＝2 ⇒ a＝$\sqrt{2}$ ⇒ 0＜a＜1.5 (C) ×：承(B)可知錯誤 (D) ×：因為a＝$\sqrt{2}$＜10，所以當1 ≤ x ≤ 30時，y＝log ( x＋k ) 恆在y＝$log_{a}$ ( x＋k ) 圖形的下方 (E)○：因為k＝1，所以將y＝$log_{a}$ x的圖形向左平移1單位可得y＝$log_{a}$ ( x＋k ) 的圖形，即當1 ≤ x ≤ 30時，y＝$log_{a}$ x恆在y＝$log_{a}$ ( x＋k ) 圖形的下方 故選(B)(E)

    (2) 依題意可知$\log _{\sqrt{2}}$( x＋1 ) ≥ 10 ⇒ x＋1 ≥ $(\sqrt{2})^{10}$＝$2^{5}$＝32 ⇒ x ≥ 31 所以至少要31天，故營銷部門無法達成這個目標'
