  stem: 實驗室發現在水中當細菌甲是細菌乙的千倍以上時，有利於孑孓的生長。根據過往經驗可知細菌甲每3天增長為原來的4倍，細菌乙每2天增長為原來的2倍。若現在取相同數量的細菌甲、乙進行培養，則 t 天後即可發展成利於孑孓的生長環境，則t的最小正整數值為＿＿＿＿。
  answer:
  - 0 ≤ x ≤ 2
  answer_status: verified
  answer_source: answer_key
  explanation: 依題意可知$\frac{4^{\frac{t}{3}}}{2^{\frac{t}{2}}}\geq 1000$ ⇒ $\frac{2^{\frac{2t}{3}}}{2^{\frac{t}{2}}}\geq 1000$ ⇒ $2^{\frac{2t}{3}-\frac{t}{2}}\geq 1000$ ⇒ $2^{\frac{t}{6}}\geq 1000$ ⇒ $\log 2^{\frac{t}{6}}\geq \log 1000$ ⇒ $\frac{t}{6}\log 2\geq 3$ ⇒ $t\geq \frac{18}{\log 2}\approx \frac{18}{0.301}\approx 59.8$ 故t的最小正整數值為60
