- id: doc_112_高雄_高師大附中_數學_數B_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知 A1 紙張的面積是 0.5 平方米，且長是寬的 1.414 倍，則 A1 紙張的寬最接近下列哪一個數值（毫米）？（1 米＝1000 毫米）
  options:
  - label: A
    content: '585'
  - label: B
    content: '590'
  - label: C
    content: '595'
  - label: D
    content: '600'
  - label: E
    content: '605'
  explanation: '令寬為 x 毫米，則長為 1.414x 毫米

    ⇒ 1.$414x^{2}$＝0.5×$1000^{2}$

    ⇒ $x^{2}$＝$\frac{500000}{1.414}\approx$353606.79

    又 $590^{2}$＝348100，$595^{2}$＝354025 ⇒ x 最接近 595 毫米

    故選(C)'
