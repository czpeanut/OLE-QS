      - 51.3
      - 564.3
      - 124.7
  explanation: '∵白色正五角星形邊長＝$\frac{3}{2}$×灰色正五角星形邊長

    ∴白色正五角星形面積＝$\frac{9}{4}$×灰色正五角星形面積

