  section: 1
  number: 6
  type: single
  page: 2
  stem: 右圖灰色部分是正五角星形，今以其中心 O 為伸縮中心，伸縮$\frac{3}{2}$倍，得到白色正五角星形。如果將原灰色正五角星形挖掉，那麼白色正五角星形剩下的區域面積會是原灰色正五角星形區域面積的幾倍？
  options:
  - label: A
