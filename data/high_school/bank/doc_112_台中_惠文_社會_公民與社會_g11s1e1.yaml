  stem: 行政院消費者保護處發布「網路連線遊戲服務定型化契約應記載及不得記載事項」，應記載事項第 6 點修正草案於 2023 年 1 月 1 日正式上路，增訂揭露機會中獎商品或活動的機率相關規範。揭露中獎機率必須用數字百分比（％）方式記載，業者應於官網首頁、遊戲登入頁面或購買頁面及遊戲套件包裝上載明。機率揭露的範圍包括「有提供直接或間接、部分或全部付費購買之機會中獎商品或活動」，違者將由主管機關經濟部工業局限期改正，屆期不改正，依《消費者保護法》第 56 條之 1 規定，處新臺幣 3 萬元以上、30 萬元以下罰鍰，再次限期改正而不改正，處 5 萬元以上、50 萬元以下罰鍰，並得按次處罰。關於下列敘述何者正確？
  options:
  - label: A
    content: 遊戲抽獎機率應該在官網、登入或購買頁面公布，因未有正式書面契約故不屬定型化契約
  - label: B
