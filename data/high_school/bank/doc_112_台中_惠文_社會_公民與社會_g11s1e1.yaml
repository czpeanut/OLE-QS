  stem: 在法律上是如何解釋毛小孩的定位，近期有實務判決認為人跟寵物間有情感上的密切關係，近似於家人間的伴侶關係，可能被重新定義為「獨立生命體」。另外依《動物保護法》規定：「飼主應防止其所飼養動物無故侵害他人之生命、身體、自由或財產。」飼主應為相當注意之管束措施。請問依據上文關於寵物在法律上的定位，還有寵物和飼主的權利義務關係的說法，何者正確？
  options:
  - label: A
    content: 寵物是權利客體，屬於物之不動產
  - label: B
    content: 寵物是權利主體，擁有繼承人資格
  - label: C
    content: 主人攜帶寵物出入公共場所而未牽繩必將涉及刑事責任
  - label: D
    content: 當寵物被其他人偷抱走，飼主可行使所有物返還請求權
  - label: E
    content: 當寵物咬傷其他人，民事責任上飼主須負損害賠償責任
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為動產而非不動產。(B)非權利主體，當然亦無繼承人資格。(C)從上文並看不出未牽繩的刑事責任。
