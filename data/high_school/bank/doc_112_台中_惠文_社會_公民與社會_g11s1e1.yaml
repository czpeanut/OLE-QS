  - label: D
    content: 業者未清楚揭露中獎機率讓消費者處於不利的契約關係，尚無違背應記載及不得記載事項
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為企業單方面擬定與不特定人締約的模式，雖未有書面契約，但仍屬定型化契約。(B)由題文可知具有強制力。(D)由題文可知，此屬於應記載事項。故本題選(C)。
