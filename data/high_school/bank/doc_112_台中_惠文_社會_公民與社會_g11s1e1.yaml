- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列關於約定財產制的說明，何者正確？
  options:
  - label: A
    content: 此約定只要經過雙方書面簽約，手續就已經完備，不需經法院
  - label: B
    content: 「共同財產制」是指夫妻特有財產合併為雙方共有、共同管理
  - label: C
    content: 「分別財產制」是指不分婚前或婚後，各自保有財產的所有權
  - label: D
    content: 約定財產制一經成立，夫妻就必須秉持誠信執行，永不能更改
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)仍須於婚後以書面向法院登記。(B)應是除了特有財產以外，合併為雙方共有。(D)仍可以更改。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: A 國曾經是農業王國，現在則是工業王國。下列何者可以說明此種轉變？
  options:
  - label: A
    content: 農業的機會成本降低，工業的比較利益增加
  - label: B
    content: 農業的比較利益降低，工業的機會成本下降
  - label: C
    content: 農業的機會成本增加，工業的比較利益下降
  - label: D
    content: 農業的比較利益增加，工業的機會成本增加
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 國際分工的原則是選擇比較利益高、機會成本低的產品來生產。故(A)應為農業的機會成本提高。(B)正解。(C)工業的比較利益上升。(D)農業的比較利益減少、工業的機會成本減少。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 甲與乙結婚，甲婚前擁有財產 1,000 萬，財產總額為 5,100 萬，另有酒店欠款 100 萬。乙婚前擁有財產 500 萬，婚後繼承遺產 1,200 萬，丙贈與乙結婚賀禮 500 萬，財產總額為 4,500 萬。甲乙最終以離婚收場。兩人結婚時，如果沒有約定夫妻財產制，請問兩願離婚後，如無另外約定，在剩餘財產分配請求權方面，誰擁有請求權？可以請求多少金額？
  options:
  - label: A
    content: 甲，850 萬元
  - label: B
    content: 乙，300 萬元
  - label: C
    content: 乙，850 萬元
  - label: D
    content: 乙，1,700 萬元
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，甲的婚後剩餘財產為 5,100－1,000－100＝4,000（萬），乙婚後的剩餘財產則為 4,500－500－1,200－500＝2,300（萬），故應為乙有剩餘財產差額分配請求權，每人應當分得（4,000＋2,300）÷2＝3,150（萬），甲應當分給乙 4,000－3,150＝850（萬），故本題選(C)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 甲因擅長投資理財，過世時，扣除遺產稅後還有 800 萬元，配偶和其 3 名子女在整理遺物時，發現這筆錢都嚇一大跳，夫妻光可以分配的剩餘財產差額有 680 萬元。丈夫事後向法院提出剩餘財產差額分配請求權。請問依據現行《民法》規定，3 名子女各可分得多少遺產？
  options:
  - label: A
    content: 0 元
  - label: B
    content: 40 萬元
  - label: C
    content: 115 萬元
  - label: D
    content: 200 萬元
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，剩餘財產差額有 680 萬元，丈夫應可分得剩餘財產差額的一半，故應為 680÷2＝340（萬），因此剩餘可分配的遺產應為 800－340＝460 萬，而繼承人則有丈夫、3 名子女，每人應繼分為 460÷4＝115（萬），3 名子女各可拿到 115 萬元，故本題選(C)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 公民課程中，老師和學生討論繼承制度的合理性，請問下列何者原因是考量到被繼承人的權益而設立的制度？
  options:
  - label: A
    content: 為了保障不致因繼承債務而使生活陷入困境
  - label: B
    content: 為了保障生前的意願及自由處分財產的權利
  - label: C
    content: 為了避免因被繼承人死亡而使生活陷入困境
  - label: D
    content: 為了避免被繼承人生前規避債務而求償無門
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)為繼承人的權利。(B)此為保障被繼承人的權利。(C)此為繼承人的權利。(D)此為債權人的權利。故本題選(B)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 早期繼承的規定是負無限清償責任的概括繼承。2009 年修法後，改採限定繼承。如此雖有利繼承人，避免父債子還的問題，卻也讓債權人的權利受到損害。對此法律上設有哪一項規定，以保障被繼承人的債權人？
  options:
  - label: A
    content: 要求債權人陳報被繼承人的債務清冊
  - label: B
    content: 要求被繼承人生前自行陳報財產清冊
  - label: C
    content: 要求繼承人必以自己的財產補足被繼承人的債務缺口
  - label: D
    content: 要求繼承人向法院陳報財產清冊以確認遺產債務
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)並無此規定。(C)限定繼承僅需以遺產償還被繼承人的債務，負有限清償責任。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 甲與前夫育有一子和收養一女，甲立遺囑將財產全部留給隔壁鄰居友人乙。甲死後，親屬不服遺囑內容，向法院提起訴訟。若該遺囑符合成立要件，針對此繼承爭議，下列見解何者正確？
  options:
  - label: A
    content: 前夫是當然繼承人，有權與甲之子女共同繼承遺產
  - label: B
    content: 准許被繼承人在生前以遺囑自由處置全部範圍財產
  - label: C
    content: 法院應判決財產由甲的兒子和鄰居友人乙均分財產
  - label: D
    content: 遺囑違反《民法》特留分規定，子女有權繼承部分財產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)既稱為「前夫」，代表已無法定的婚姻關係，並無繼承權。(B)被繼承人處理遺產受到特留分的規定限制。(C)繼承人應為其子、養女與遺囑指定之繼承人。故本題選(D)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 小惠趁著百貨公司週年慶的時候大肆購物，她買了一條寬褲，回家後卻發現寬褲口袋出現破洞，因此隔天返回專櫃希望要求退換貨，專櫃卻以收銀臺旁設立的「貨物售出，恕不退換」為由，不予以退換貨。依據題幹及我國相關法令規定，下列敘述何者正確？
  options:
  - label: A
    content: 因在實體店面購買，無鑑賞期保障，小惠無法向專櫃要求換貨
  - label: B
    content: 服飾類為七天試用期的例外，故小惠無法向店家主張退貨權利
  - label: C
    content: 專櫃拒絕小惠退換有瑕疵寬褲的行為，可能違反瑕疵擔保責任
  - label: D
    content: 專櫃提出理由合理沒有違反法律規定，小惠無法主張減少價金
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是無「猶豫期」的保障，另外此案為物品瑕疵，廠商應給予退換貨負起瑕疵擔保責任。(B)服飾並非「猶豫期」的例外。(D)違反瑕疵擔保責任。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 男子因罹癌過世，遺產全留給父親，但引起妻子不滿一狀告上法院，主張夫妻剩餘財產分配，但地院審理後發現，男子罹癌期間均由父親照顧並負擔醫療費用，妻子長年離家完全不聞不問。請根據《民法》規定，下列何者主張較合理？
  options:
  - label: A
    content: 父親主張妻子沒負擔丈夫醫療費，故不能請求財產分配
  - label: B
    content: 父親主張因繼承失格，男子雖沒表示妻子仍不得繼承
  - label: C
    content: 妻子主張無論婚姻情況，都必能請求剩餘財產差額分配
  - label: D
    content: 妻子主張即使無法請求剩餘財產分配，仍有特留分規定
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)主因應當不是沒有負擔醫療費，而是不聞不問，沒有照顧。(C)剩餘財產差額分配必須為夫妻關係方有資格。(D)法院若判定繼承失格，也無法享有特留分之保障。故本題選(B)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 臺鐵工會因不滿臺鐵與工會協商，近年常發起集體「不加班運動」，造成連假時期臺鐵停駛疑慮。臺鐵工會表示：「不反對臺鐵改革及公司化，但協商過程中，交通部長維持一貫態度，致使協商破局」。若政府不回應，也不聆聽員工的訴求，不排除持續採取不加班策略，以繼續向臺鐵施壓。根據題幹有關臺鐵勞動契約關係的敘述，下列何者正確？
  options:
  - label: A
    content: 休假為《勞基法》賦予員工的基本權利，此行動並無不法
  - label: B
    content: 集體不加班的行動為罷工行為，需要經工會投票始得為之
  - label: C
    content: 根據契約正義原則，《勞基法》對臺鐵員工有完全的權利保障
  - label: D
    content: 根據契約自由的原則，臺鐵可以要求員工加班，不得拒絕
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)不加班非罷工行為。(C)《勞基法》對於勞工、資方的權利義務關係均有規定，並非僅對勞工有完整權利保障。(D)《勞基法》依據契約正義原則，對勞資雙方關係進行規範。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 沉寂 3 年的藝文展演活動於 2023 年疫後大爆發，國內、外知名藝人演唱會巡演不斷，面對市場上黃牛猖獗現象，行政院會通過《文化創意產業發展法》部分條文修正草案增訂「黃牛條款」，未來販售黃牛票者，將處以票面金額 10 倍至 50 倍罰鍰，若以外掛程式或掃票機器人大量登錄假帳號等方式購買藝文票券者，最重處 3 年以下有期徒刑。請問下列何者的觀點最可能為此次修法的立場？
  options:
  - label: A
    content: 甲：依照契約自由原則，不可修法介入干涉買賣契約
  - label: B
    content: 乙：依照契約正義原則，可以修法介入干涉買賣契約
  - label: C
    content: 丙：依照經濟效率評估，應該修法管制黃牛票現象
  - label: D
    content: 丁：依照市場自由放任，應該修法管制黃牛票現象
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由題文可知，此次修法為對契約自由原則的限制，屬於契約正義原則。(C)若依據經濟效率原則，應當鬆綁管制。(D)若依據市場自由放任，即不應該修法管制。故本題選(B)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 甲之元配去世後，甲依乙女的要求辦理宴會，公開宣布兩人結婚，並生下己。但因為甲的女兒丙與養子丁的反對，甲並未與乙辦理婚姻登記，後來甲因病去世，留下與弟弟戊共同掌管之家族企業。有關遺產繼承問題，下列敘述何者正確？
  options:
  - label: A
    content: 甲死亡時，甲的女兒丙、養子丁和弟弟戊三人同為繼承人
  - label: B
    content: 乙得於繼承開始前，主張行使夫妻財產之差額分配請求權
  - label: C
    content: 甲如立遺囑將財產全留給丙，丁可主張不得侵害其特留分
  - label: D
    content: 戊與甲共同掌管企業，應由戊決定甲名下之遺產如何分配
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)繼承人應當為直系血親卑親屬，丙、丁、己共三人。(B)乙未與甲辦理結婚登記，法律上並無配偶關係，無剩餘財產差額分配請求權。(D)並無此規定。故本題選(C)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 甲和乙在未約定夫妻財產的情況下結婚，甲婚前有 500 萬的存款和 1,200 萬的豪宅一棟，乙婚前則有 900 萬存款和 800 萬的別墅一棟。後來婚姻經營不易，甲乙分居多年，甲以個性不合向法院訴請離婚。清算婚後財產，甲婚後財產工作收入增加 300 萬元，另有貸款 100 萬，乙婚後工作收入則增加財產 300 萬元。關於甲和乙的財產關係，下列敘述何者正確？
  options:
  - label: A
    content: 《民法》規定只有婚前財產夫妻雙方各自使用、收益及處分
  - label: B
    content: 兩人應適用法定財產制，須至法院辦理夫妻財產制登記
  - label: C
    content: 兩人財產除婚前各自擁有之外，婚後財產則由夫妻共有
  - label: D
    content: 兩人離婚後，甲得向乙請求 50 萬元的剩餘財產差額分配
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)婚後財產同樣是各自使用、收益與處分。(B)法定財產制無須至法院辦理登記。(C)婚後財產仍為各自所有。(D)甲婚後剩餘財產有 300－100＝200（萬）、乙婚後剩餘財產為 300 萬，離婚後應各自分得剩餘財產（200＋300）÷2＝250（萬）故，乙應給予甲 50 萬元。故本題選(D)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 甲在網路向乙公司購買球鞋，收到後發現顏色與電腦螢幕顯示不同，故聯絡乙欲退貨退款。乙表示「網站有明顯標示『貨物售出，恕不退貨，僅能依同等價額換貨』」，但甲堅持退貨退錢。關於甲乙間交易的權利義務，下列敘述何者最適切？
  options:
  - label: A
    content: 甲符合網路交易的退貨規定，可不附理由且無須證明貨品有瑕疵
  - label: B
    content: 乙在網站的標示依契約自由的特別約定，故甲不能主張退錢退貨
  - label: C
    content: 該標示因設置於網站屬定型化契約不成立，甲可主張試用期規定
  - label: D
    content: 球鞋顏色與螢幕顯示不同屬貨品瑕疵，甲只可主張的是損害賠償
  answer:
