  stem: '下表為南屯國生產水梨與葡萄兩種商品的生產可能組合。有關生產可能組合，下列何者正確？

    | 組合 | 水梨 | 葡萄 |

    | --- | --- | --- |

    | 甲 | 0 | 12 |

    | 乙 | 1 | 11 |

    | 丙 | 2 | 9 |

    | 丁 | 3 | 5 |

    | 戊 | 4 | 0 |'
  options:
  - label: A
    content: 生產第 12 單位葡萄的機會成本與生產戊到丁間葡萄的水準相同
  - label: B
    content: 生產第 12 單位葡萄的機會成本，高於生產其他單位的葡萄成本
  - label: C
    content: 組合乙的水梨、葡萄產量低於組合甲，故南屯國不以組合乙生產
  - label: D
    content: 組合丁的水梨、葡萄總量高於組合戊，故組合丁效率高於組合戊
  - label: E
