  answer_status: verified
  answer_source: answer_key
  explanation: (A)生產第 12 單位葡萄的機會成本為 1 單位水梨，戊到丁則是增加 5 單位葡萄，少了 1 單位水梨，生產 1 單位葡萄的機會成本，平均為 1∕5 單位水梨。兩者水準不相同。(C)(D)生產可能線上的點都一樣有效率，都是可能的生產產品組合。(E)生產組合丁到丙增加了 4 單位的葡萄，而減少了 1 單位的水梨，平均增加 1 個葡萄，減少 1∕4 單位的水梨。
