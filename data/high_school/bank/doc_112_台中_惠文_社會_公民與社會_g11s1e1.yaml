  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為通訊交易，屬於特種買賣，有七日猶豫期度的規定。(B)此規定違反《消費者保護法》的規定，不受契約自由的保障。(C)非試用期而非「猶豫期」的規定。(D)通訊交易有「猶豫期」的保障，甲可以主張退貨。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 甲今年 16 歲，因父子不合，父親聲明斷絕父子關係。最近，甲的父親車禍過世，留下 3,000 萬元債務和一棟登記在父親本人名下，價值 500 萬元的房子。甲的父母不曾就夫妻財產制有過約定。現在，甲和母親擔心父親生前的債權人來向他們討債。關於上述甲和他母親的繼承問題，下列敘述何者正確？
  options:
  - label: A
    content: 依概括繼承有限清償責任，甲和母親完全不必繼承甲父親所留下的債務
  - label: B
    content: 依概括繼承無限清償責任，甲父親的債權人可依法強制甲清償全部債務
  - label: C
    content: 依拋棄繼承，甲如果沒有在期限內到法院登記，要清償父親的全部債務
  - label: D
    content: 依限定繼承，甲的母親須清償繼承父親遺產的範圍內，能夠負擔的債務
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)概括繼承是有限清償責任。(C)目前採用全面限定繼承，與是否拋棄繼承無關。(D)限定繼承僅需以遺產償還被繼承人的債務，負有限清償責任。故本題選(A)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 傅利曼《世界是平的》一書，強調無國界的供應鏈帶動全球分工與貿易的興盛。開發中國家因為低廉的人力及土地成本，專心發展「低端製造」，而歐美先進國家則專注在「微笑線」的兩端，賺取原創設計與市場行銷豐厚的利潤。但發生疫情後，全球分工、供應鏈經濟都要重新考量。因為醫療、衛生等防疫的「低端製造」，變得十分重要。因此我們看到時尚精品業的古馳、普拉達、聖羅蘭等加入製造口罩、防護衣行列，迪奧、嬌蘭等化妝品廠商投入生產乾洗手，通用、特斯拉等汽車製造商改做呼吸器。請問若以「比較利益法則」來分析上文內容，何者敘述正確？
  options:
  - label: A
    content: 國際間專業分工較不利於歐美先進國家
  - label: B
    content: 歐美因技術衰退又開始製造口罩等商品
  - label: C
    content: 此改變證明開發中國家已具有絕對利益
  - label: D
    content: 歐美現階段製造低端商品機會成本較低
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國際間專業分工，有利跨國貿易雙方。(B)並非是技術衰退，而是有更多的需求。(C)此改變並無法看出開發中國家是否具有絕對利益，僅能看出國際貿易中的比較利益。(D)因疫情關係，高端產品需求減少，可能降低生產口罩等物品的機會成本，故本題選(D)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 年滿 15 歲的小虎在飲料店打工，跟老闆約定報酬和工作時間，也得到父母同意，工作愉快。某晚勞工局執行勞動檢查時，發現小虎逾時夜間工作，將老闆移送法辦。此事件涉及勞動法規，下列何者正確？
  options:
  - label: A
    content: 小虎打工獲父母同意，勞工局依法不得干涉經法定代理人同意之僱用契約
  - label: B
    content: 勞動契約受到私法自治保障，雙方合意簽訂的契約內容不應受到法律限制
  - label: C
    content: 勞動契約須受《勞動基準法》規定限制，小虎與老闆不能享有完全的締約自由
  - label: D
    content: 《勞基法》所訂工資、工時等勞動條件標準，經締約雙方同意得另外約定排除
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 小虎剛滿 15 歲，屬於《勞基法》裡面的「童工」應受《勞基法》相關規範。屬於契約正義原則對契約自由的限制。故本題選(C)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 4
  stem: 關於死前脫產，有些人會鑽法律漏洞，知道自己即將不久於世，就把財產移轉給配偶、小孩，或是其他第三人，讓債權人無法對遺產求償，也就是所謂的「脫產」，請問債權人相關權利何者正確？
  options:
  - label: A
    content: 債權人不得主張《民法》規定「債務人所為之無償行為，有害及債權者」，合法追討此債務
  - label: B
    content: 《民法》規定繼承人在繼承開始前 2 年內被繼承人受有財產贈與者，債權人可就該財產求償
  - label: C
    content: 債務人將財產移轉給他人之行為，雙方知道不是單純贈與，債權人無法主張該移轉行為無效
  - label: D
    content: 即使繼承人隱匿財產、虛偽記載遺產清冊等欺騙債權人的行為，仍採「概括繼承的有限責任」
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是債權人「得」主張追討。(C)並無此規定。(D)若有此情形，會失去限定繼承的有限清償資格。故本題選(B)。
- id: doc_112_台中_惠文_社會_公民與社會_g11s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 4
  stem: 甲與乙婚後生下一子丙，隨後甲贈與乙一棟房屋，就離家與外遇對象丁長期同居（未登記結婚），並育有一女戊，因甲認領戊，故戊視為婚生子女，有繼承權。甲離世前，為照顧未成年且還在求學的戊，立遺囑將所有財產全部留給戊。甲死亡時，如其遺囑有效，依《民法．繼承編》規定，下列法律見解何者正確？
  options:
  - label: A
    content: 應依《民法》應繼分規定，由乙、丙、丁三位法定繼承人平均分配甲之遺產
  - label: B
    content: 依代位繼承，因戊視為婚生子女故可繼承未登記結婚丁原本應繼承部分
  - label: C
    content: 丁非甲之合法配偶，戊亦非甲之婚生子女，丁與戊均無權繼承甲之遺產
  - label: D
    content: 依《民法》特留分規定，即便乙曾獲房屋，乙與丙仍有權取得甲之部分遺產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是乙、丙、戊繼承並平分遺產。(B)代位繼承為血親繼承第一順位直系血親卑親屬於得繼承前即已去世，由其子女代位繼承。(C)戊為甲的直系血親卑親屬，也有認領程序應有繼承權。(D)正解。
