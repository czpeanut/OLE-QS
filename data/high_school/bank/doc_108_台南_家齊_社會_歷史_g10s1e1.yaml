    乙：「在川中島，優秀的青年都爭先恐後地赴海外出征。我們都在志願制度下血書報效。這是告訴日本人，我們也是男子漢呀！不要對我們有差別待遇！」

    丙：「每逢建設，我們必定被強迫從事砍伐森林等苦工，工資比其他地方低很多，還時常領不到錢，只給我們鹽代替工資，強迫勞役的日子有增無減。」

    (1)請就甲、乙、丙三則文獻內容，依時間先後，排列順序？ (2)乙文獻中的人會居住在川中島，是因為統治者採取了什麼措施？'
  answer:
  - (1)丙、甲、乙；(2)集團移住
