  stem: 資料一：到臺灣的日本農民，多數為經濟情況不佳的貧農、佃農階級。離鄉背井渡臺雖然得到政府奧援，但與居住在城市的日本人相比，移民住宅的建造以低廉、平面簡單為原則。官方在規劃移民村時，只提供一個遮風避雨的住所，並不注重環境的美化，即使移民並非出身富裕之家，對這樣如沙漠般的家園還是非常失望。 日本移民村由於民族不同及殖民者優越感，自絕於臺灣農村；封閉的經濟與社會形態，造成移民參與文化、政治活動的機會大減。離開故鄉的日本農民移住臺灣之後，原本就有文化上、生活上的孤立感，孤島式的移民村更使移民產生疏離感；這種疏離感存在於移民與其他階層的日本人之間，也存在於移民與臺灣人之間。 資料來源：張素玢，《未竟的殖民：日本在臺移民村》（臺北：衛城，2017），p.82 資料二：「外省人」居住在營區四周類似軍營的木造房子裡，和軍方部隊保持著密切的關係，這是官方「集中居住、集中管理」的策略，也是為了配合可能因為戰事而起的緊急動員。眷村居民以近乎難民的姿態來到臺灣，住在臨時搭建的屋舍裡，使得眷村像是在陌生土地、陌生文化包圍下的安全避風港，也促使眷村形成近似隔離的社區特性。此外因為語言、生活背景和習慣與原居者不同，為了自我保護，他們自然產生一種較為團結的眷村性格；加上村的「中國人意識」頗為強烈，其結果使得眷村的空間性格更為封閉與排外。 資料來源：戴寶村，《簡明臺灣史》（南投：國史館臺灣文獻館，2007），p.104 (1)請從上述兩則資料，比較日本移民村與眷村兩種移民聚落有何相同與相異之處？
  answer:
  - 異：一、軍政移民與經濟移民；二、分布多在西部，與集中在東部。 同：1.封閉、孤立與本地族群互動少；2.文化的優越感；3.語言的差異。
