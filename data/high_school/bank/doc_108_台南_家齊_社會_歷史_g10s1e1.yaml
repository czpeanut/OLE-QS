    content: 兩者都以「他者」的角度來看待原住民
  - label: B
    content: 資料二與資料一的觀點均屬歷史事實
  - label: C
    content: 兩段資料所探討的對象都屬高山族
  - label: D
    content: 兩段資料描寫的對象分屬不同族群
  group_stem: 資料一：東番夷人不知所自始，居彭湖外洋海島中；起魍港、加老灣，歷大員、堯港、打狗嶼、小淡水、雙溪口、加哩林、沙巴里、大幫坑，皆其居也。斷續凡千餘里，種類甚蕃。別為社，社或千人、或五六百，無酋長。性好勇，喜鬥，無事晝夜習走，足蹋皮厚數分，履荊刺如平地，速不後奔馬，能終日不息。地暖，冬夏不衣，婦女結草裙，微蔽下體而已。無揖讓拜跪禮。無曆日文字，計月圓為一月、十月為一年。女子健作；女常勞，男常逸。 陳第〈東番記〉 資料二：這是福爾摩沙島，島的周圍有一百三十荷哩，包括許多村落，人口眾多。她們並不是講同一種語言，沒有國王、統治者或首領。彼此間並不和睦，村落間時常打仗。夏天裸體，不覺得羞愧。婦女承擔大多數的農事，若不在田裡工作，便會架著舢舨，忙著捕捉蝦蟹或採及牡蠣，她們把魚類是為僅次於稻米的重要食物。婦女工作時，男人卻游手好閒。 甘治士〈福爾摩沙島略記〉
  answer:
  - A
