  stem: 請閱讀下列兩則資料後回答相關問題： 資料一：吉野村民 草間長吉回憶 我聽說台灣的土地將以最低廉的價格配售，於是和兩位好友帶著僅有的資金到臺灣，希望有朝一日能成為大地主。…我們九人每天六點出發一直做到傍晚，晚上一聽到蕃社的狗吠聲，馬上拿起刀劍到指導所警戒。…帶來的資金已經沒有了，無收入沒有好酒，沒有魚可吃，每天粗茶淡飯配味磳湯，時時有不如歸去之感 資料來源：張素玢 未竟的殖民：日本在臺移民村 臺北 衛城 頁126-127 資料二：花蓮港區 品川政次郎回憶 我在大正三年（1914）移民到林田村來。此地瘧疾、黑水熱、恙蟲病非常猖獗，我來此的第五六年間，曾患過恐怖的黑水熱。…我最煩惱的是分配地的地質問題，我分配到的土地地質是砂質土。…移住之初，鹿野豬很多，任何的農作物都遭其破壞，收入減少無望。移住當初遭遇甚多困難，水土又不適應，一時對心理打擊甚大 資料來源：張素玢 未竟的殖民：日本在臺移民村 臺北 衛城 頁482 (1)從上述兩則資料來看，日本移民來臺會面臨哪些困境（至少寫出三項）？ (2)上述資料中兩佐日本移民進駐的是哪一種移民村？
