  stem: 十七世紀末，大批粵人相繼移入屏東平原東側沖積扇拓墾。他們開闢水田以發展稻作為主，和西側閩人以種蔗為主有別。村莊外圍，常沿河溝密植樹、竹，形成天然防衛界線；村莊與村莊之間則聲息相通，團結對外。十八世紀中葉，有官員向清廷報告，這些粵人曾助清廷平定朱一貴事件，常挾功自重、民性剽悍，雖然外有閩人牽制，還不致為非作歹，但官府也須防範未然，一方面要劃清界線以抑制粵人向外擴張，另一方面要限制移民搬眷來臺以避免人滿為患。 請問：根據十八世紀中葉該官員的報告，可以看到當時清人治臺的哪項特色？
  options:
  - label: A
    content: 嚴格檢查貿易商船，以防漢民偷渡
  - label: B
    content: 操弄族群關係，以控制地方的秩序
  - label: C
    content: 經由墾照的發給，以進行土地開發
  - label: D
    content: 禁止官兵攜眷渡臺，以減財政負擔
