  group_stem: 資料一：1624年，荷方司令曾認為占有臺窩灣（安平）：「可以領有比澎湖更肥沃而適於健康，且有豐富清水之島嶼。」又說：「再應考慮者，中國人已在臺窩灣與日本人盛行貿易，故余等若在該地定居，當可予以防止，倘若不為，則將失去所期待在日本之絹絲貿易之利益。」（郭輝譯，巴達維亞日記，第一冊，臺北：臺灣省文獻委員會，1970年） 資料二：□憂心來到臺灣的倭寇、海賊，會和日本、荷蘭聯手騷擾中國東南沿海，因此使出「若能使夷寇相殘，我徐收漁人之利」的誘敵之計，以臺灣為誘餌，將荷蘭人引往臺灣。（引文出自兵部題行「條陳彭湖善後事宜」殘稿(二)）
