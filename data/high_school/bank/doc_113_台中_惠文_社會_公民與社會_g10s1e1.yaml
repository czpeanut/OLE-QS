  explanation: 從題文可知，中華人民共和國政府認為，一個中國原則為「世界上只有一個中國，中華人民共和國政府是代表中國的唯一合法政府，大陸和臺灣同屬一個中國，中國的主權和領土完整不容分割」。而國民黨認為的九二共識為一個中華民國兩個地區、分裂分治。(A)由上可知，中國及國民黨認可的九二共識不相同。(B)民進黨並不否認協商會議的歷史事實。(D)不同政府對於九二共識的內涵解釋不同，也不一定認可其內容。
