  - label: B
    content: 必須歸化取得其他國籍
  - label: C
    content: 無法獲得母國使館協助
  - label: D
    content: 無法使用母國原有貨幣
  group_stem: 位於大西洋西側加勒比海的某島西部，曾是法國盛產蔗糖的殖民地，該地的人囗除歐洲白人、原住民與黑奴之外，尚有法國男性在當地所生的混血人種，他們也可受教育、擁有財產及黑奴，是所謂「有色自由人」。法國大革命初期，新政府依〈人權宣言〉主張公民在法律之前一律平等，但該地居民的公民資格並非馬上就取得。歐洲人種植園主反對用公民平等的原則來治理，爭取成立自治政府。1791 年該地爆發奴隸反抗事件，法國政府擔心島嶼動盪會被保王派或英國、西班牙乘虛而入，急需「有色自由人」為革命盟友，故宣布他們為法國公民。緊接著法國政府又發現，若沒有奴隸的支持，也無法控制該地的族群衝突，因此 1793 年釋放當地奴隸並宣布他們為公民。但該地仍持續抗爭追求獨立，1804 年終於建國，然因主權爭議，直到 19 世紀中期才獲得大多數國家承認。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 根據題文敘述，因主權爭議，該島國在 19 世紀初期，未獲其他國家承認，因此該島人民去其他國家工作時，會無法獲得母國使館的協助，答案為(C)。
