  group_stem: 東華大學社會學系社會實踐課程小組探討部落諮商同意權問題。為瞭解原住民族諮商同意權在實際運作上的問題，學生針對世豐電力在花蓮縣卓溪鄉設置水力發電廠一事進行田野調查，探討《原住民族基本法》第 21 條有關部落諮商同意權如何造成對立與衝突。根據《原住民族基本法》第 21 條規定「政府或私人於原住民族土地或部落及其周邊一定範圍內之公有土地從事土地開發、資源利用、生態保育及學術研究，應諮商並取得原住民族或部落同意或參與，原住民得分享相關利益。政府或法令限制原住民族利用前項土地及自然資源時，應與原住民族、部落或原住民諮商，並取得其同意；受限制所生之損失，應由該主管機關寬列預算補償之。」然而，經過該小組到部落踏查與訪談後，發現《原基法》第 21 條部落諮商辦法存有諸多漏洞，造成諸多亂象。資訊不對等的情況下匆忙投票造成原民族群內部分裂。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 原住民部落的開發諮商同意權是屬於原住民族的集體權利。(A)(B)(C)皆為個人的權利類型。而原住民族傳統智慧創作專用權制度，係以原住民族自治為核心，以原住民族族群、部落內部共識為基礎，使原住民族得以就傳統之宗教祭儀、音樂、舞蹈、歌曲、雕塑、編織、圖案、服飾、民俗技藝或其他文化成果之表達，取得智慧創作人格權與財產權。與(D)傳統智慧創作專用權相符。
