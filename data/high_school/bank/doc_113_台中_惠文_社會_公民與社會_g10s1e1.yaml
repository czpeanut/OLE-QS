- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_27
  section: 1
  number: 27
  type: single
  page: 7
  stem: 請問關於題文中畫線處內容之聯合國「文件」，應該是何項國際宣言或公約？
  options:
  - label: A
    content: 〈世界人權宣言〉
  - label: B
    content: 〈聯合國原住民族權利宣言〉
  - label: C
    content: 《保護所有人免遭強迫失蹤國際公約》
  - label: D
    content: 《消除一切形式種族歧視國際公約》
  group_stem: '西拉雅族的文化復興可追溯自 1995 年臺南縣政府陸續在大內鄉頭社、佳里鄉北頭洋部落協助舉辦傳統祭儀「夜祭」，如今與東山吉貝耍、官田番仔田部落及大武壠族的太祖夜祭並稱為「五大夜祭」。2006 年臺南縣政府成立「西拉雅族事務委員會」，肯認該族，但仍非行政院核定的原住民族，因為是否具有原住民族特徵備受質疑，以及認定西拉雅族為原住民族後，帶來的資源分配疑慮。有行政官員認為，潛在 100 萬人囗的平埔族群面臨嚴重「漢化」，當平埔族群正名議題又牽涉到政治權利、原住民保留地、健保補助、學雜費補助、住宅重建獎勵等原住民資源時，原民會又會擔心預算無法擴大，既有 60 萬人囗的（山地和平地）原住民會產生相對剝奪感。2016 年「原住民族日」，總統蔡英文代表政府對原住民族所遭受的土地掠奪、傳統破壞，以及政治、經濟與社會的不平等及歧視道歉，並承諾檢討相關法規，讓平埔族群得到應有的權利與地位。

    2022 年，憲法法庭針對西拉雅族案做出判決，認為《憲法》所保障的「原住民族」並不限於「山地原住民」、「平地原住民」，具有「民族文化特徵」、「族群認同」及「客觀歷史紀錄」3 項判準的其他臺灣南島語族，也屬於「原住民族」。認定《原住民身分法》對原住民的定義違反《憲法》及《憲法增修條文》規定意旨有違，要求相關機關於 3 年內完成修法或另訂特別法，否則符合上述標準的民族，可以在逾期後依其意願，向政府申請認定為原住民族。關於原住民族的身分問題，涉及到「自我認同」，原住民應具有保有自有文化的權利，進而對抗外來政權以不被同化。此權利保障可援引自聯合國通過的文件，<u>該文件</u>肯認原住民族及原住民個人的權利，包含生命、自由、平等、自決、自主、自治、文化傳統及宗教習俗等。

    #註：《原住民身分法》將原住民分為「山地原住民」及「平地原住民」。「平地原住民」是國民政府來臺後實施的原住民族身分制度，「平埔族」則是日本政府辦理人囗普查及戶籍登記時所登記的種族類別，兩者範圍不同。在日本時期被登記為「平埔族」或「熟番」的人，在中華民國來臺後，如果未能在開放登記為「平地原住民」的期間申請登記，就無法取得「平地原住民」身分。西拉雅族屬於平埔族群，因平埔族世居平地，漢化程度深，政府過去辦理「平地山胞」登記時又多未申請，因而未獲法律承認其原住民身分。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「該文件肯認原住民族及原住民個人權利」可推知此文件應為(B)〈聯合國原住民族權利宣言〉，該宣言內容涵蓋原住民族的個人和集體權利，以及在文化、身分、語言、工作、健康、教育等權利。
