- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2019 年 7 月，以歐洲為主的 22 國大使遞交連署信函給聯合國人權理事會，呼籲中國停止在新疆以「再教育營」，拘押多達上百萬的維吾爾人及其他少數民族穆斯林。中國表示這些機構是「職訓中心」，用來幫助民眾遠離極端主義並重新融入社會，已經使新疆人民的幸福感大幅提升。同時中國也表達強烈不滿，反控這些信函枉顧事實真相，且將人權問題政治化；中國強調新疆事務純屬中國內政，不容任何國家和外部勢力干預。請問中國以主權的何種特點，主張其推動新疆政策的正當性？
  options:
  - label: A
    content: 主權包含了一國對其領土範圍內進行治理的最高權力
  - label: B
    content: 中國依其主權，有責任保護新疆民眾的各項公民權利
  - label: C
    content: 中國人民是主權的擁有者，新疆政策應根據中國民意
  - label: D
    content: 中國主權受國際承認有權與他國發展平等外交關係
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「中國強調新疆事務純屬中國內政，不容任何國家和外部勢力干預」，其強調主權對內的最高性及對外的獨立性，最相符的答案為(A)。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 右圖是某國政治宣傳的圖片，有學者指出：此圖呈現該國執政領袖、執政黨和人民三者的關係，可清楚看出民主國家運作與該國存有最根本的差異。請問下列何者應為該學者所指的最根本差異？
  options:
  - label: A
    content: 肯認多元認同，不易服從單一的政治領袖
  - label: B
    content: 存在多黨競爭，難有全民效忠服從的政黨
  - label: C
    content: 執政領袖和執政黨皆是國家管理人，而非效忠對象
  - label: D
    content: 執政領袖和執政黨只是代表政府，人民應效忠政府
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_113_台中_惠文_社會_公民與社會_g10s1e1/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 400.95
      - 318.65
      - 564.3
      - 439.0
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題圖敘述中可看中該國的黨具有最高性，須服從及效忠之，此國應為一黨專政的政黨體制，(A)(B)(C)皆是屬於民主國家容許政黨競爭的體制，因此答案為(D)。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 緬甸是多民族國家，目前政府在僅承認的少數民族中排除華人與羅興亞人，特別是從中國雲南等移民至緬甸的華人（多數被稱為果敢人），至今多數仍無法取得緬甸公民身分，這被認為是緬甸軍政府基於歷史因素並為鞏固緬甸人的多數地位，而犧牲少數族群。下列敘述何者能詮釋此種現象？
  options:
  - label: A
    content: 普遍的公民身分能夠保障少數族群在社會中存續
  - label: B
    content: 公民身分的取得與保障不需仰賴國家立法與政策
  - label: C
    content: 城鄉差距與教育程度加深了公民身分取得的困難
  - label: D
    content: 個人在社會生活中往往只有單一群體的成員身分
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)若一國能以法令肯認該國內所有群體的公民身分，則能保障其權利及地位，為正解。(B)公民身分的取得有賴該國的法令政策規範。(C)並非因城鄉差距極教育程度使公民身分取得困難，而是該國的制度及政策所導致。(D)個人在社會生活中常具有多元的成員身分。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 我國「紀念日及節日實施辦法」規定，臺灣原住民族各族的歲時祭儀日期，依原住民族委員會的公告，定為法定民俗節日，各該族原住民應予放假。從公民權利與社群資源分配的角度思考，該立法用意與下列何者最為相近？
  options:
  - label: A
    content: 《國家語言發展法》將臺灣手語納入國家語言的範圍
  - label: B
    content: 《民法》規定父母應以書面約定子女要從父姓或母姓
  - label: C
    content: 《國籍法》限制新住民歸化未滿 10 年不得參選公職規定
  - label: D
    content: 《廣播電視法》規定無我國國籍者不得擔任董監事職務
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣原住民族的歲時祭儀假期為政府考量不同族群差異而作為的積極平權措施。(A)將臺灣手語納入國家語言的範圍也是肯定不同群組需求的積極平權措施，為正解。(B)此為無差別對待的形式平等概念。(C)(D)之限制與平等原則之概念無關。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 俄羅斯近來在指派軍隊進入烏克蘭東部邊境的「頓巴斯」地區，被國際視為侵略行為。其實俄羅斯覬覦烏克蘭領土已久，總統普丁在電視上發表談話，強調烏克蘭與俄羅斯在歷史上同屬基輔羅斯帝國的後裔，現在烏克蘭是蘇聯時期規劃的產物。針對普丁的發言，烏克蘭總統澤倫斯基表示，烏克蘭拒絕任何侵犯其領土的行為，也不懼怕任何威脅。請問根據普丁的發言，可以得知他以什麼樣的理由正當化對烏克蘭的侵略行為？
  options:
  - label: A
    content: 強調俄國與烏克蘭歷史文化共通的認同
  - label: B
    content: 重視烏克蘭人透過合併公投的民族自決
  - label: C
    content: 強調俄國與烏克蘭兩國悠久的民主傳統
  - label: D
    content: 視烏克蘭自古屬俄國國土神聖不可分割
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文敘述「普丁強調烏克蘭與俄羅斯在歷史上同屬基輔俄羅斯帝國的後裔」中可得知其強調兩國源於共通的文化認同，答案為(A)。(B)(D)無中並無提及。(C)俄國並無悠久的民主傳統，該國不採行民主制度。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 《芭比》真人版電影為華納兄弟公司的暑期大作，越南官媒「青年報」（Tuoi Tre）於 2023 年報導，該電影禁止在越南各地的電影院上映。原因為電影畫面的一個場景，一張手繪地圖中亞洲（Asia）地區的南海區域畫上一條 U 形虛線，被認定與中國主張「九段線」主權宣示有關。越南電影局局長表示，長期以來越南與中國存在緊張關係，國家電影鑑定與分類委員會審查後，因片中使用九段線地圖，故越南不會上映這部電影。「九段線」為中國宣稱在南海擁有主權的區域，範圍與越南、菲律賓、汶萊、馬來西亞和印尼的專屬經濟海域有重疊，此外，臺灣、越南、菲律賓、汶萊和馬來西亞皆為聲索國，主張具有部分南海島嶼及海域的主權。荷蘭海牙國際法庭在 2016 年 7 月 12 日對「南海仲裁案」作出裁定，中國拒絕承認該裁決結果，並在南海區域屢次進行海軍巡演，使越南多次控告中國船隻侵犯其主權。依據題文訊息與相關公民知識判斷，下列哪個可能是南海爭議不斷的原因？
  options:
  - label: A
    content: 南海不為任何一國實際管轄，各國船隻皆可取得海洋資源
  - label: B
    content: 鄰近國家因南海航線及漁業石油資源，不願意放棄其主權
  - label: C
    content: 南海之島礁因為海平面上升縮小面積，影響國家領土範圍
  - label: D
    content: 九段線區域達成南海鄰近國家共識，但每段線未公平分配
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此不為爭議的主要緣由，爭議來自於主權爭議及相關的資源爭奪。(C)與其無關。(D)領土分配本就無法公平，此並非爭議的主要原因。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 護照的便利性常是各國人民感興趣的議題，根據倫敦某顧問公司公布的資料，2023 年最好用的護照為日本，其可享有 193 個國家和地區的免簽，而我國排名第 35，享有 145 個國家和地區的免簽；最難用的護照為阿富汗，僅能享有 27 個國家和地區的免簽。從我國主權發展而言，下列哪一項說明符合現況？
  options:
  - label: A
    content: 護照是國民身分的證明，受各國政府承認的免簽待遇與我國主權發展無關
  - label: B
    content: 護照發放為國家決定，通常與國民身分無相關，外國人也可拿到我國護照
  - label: C
    content: 「免簽」反映主權對外展現，各國的接受程度代表我國事實主權受多國承認
  - label: D
    content: 任何一國國民若未擁有該國護照，遇有緊急狀況也能享有該國國民待遇救援
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)護照承認會涉及國家主權之發展。(B)護照的申請資格通常為具有該國國籍者。(D)沒有國家護照，無法享有國民待遇之救援。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某國一個少數族群音樂團體經過激烈競爭，獲得該國政府頒發音樂界最高獎項，發表以下感言：「感謝這個獎項支持多元族群文化；在這片多元、自由和民主的創作沃土，不但讓許多的『我』，可以是不同的『我』，也讓許多的『我』，願意在這個國家成為『我們』」。從國家政策及影響的角度，該團體感言與下列哪項論述最吻合？
  options:
  - label: A
    content: 鼓勵多元文化自由競爭的國家政策，有利於文化創新發展
  - label: B
    content: 肯認族群差異的文化政策，最能激發多元類型的音樂創作
  - label: C
    content: 文化的多元認同與國家政策關係密切，後者能夠促成前者
  - label: D
    content: 多元文化與自由民主息息相關，兩者皆仰賴國家政策支持
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文敘述「不但讓許多的『我』，可以是不同的『我』，也讓許多的『我』，願意在這個國家成為『我們』，可得知該團體強調的是文化認同及國家認同，而國家藉由各項政策可使個群體的民眾在國家中，能自由自在的做自己，而能形成各種豐富多元的創作，最相符的敘述為(C)。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 我國障礙者依法可向政府申請補助，僱用助理協助生活。小天提出申請，政府依據既有預算額度及權限，核定部分而非足額補助。小天認為這違反《身心障礙者權利公約》，因該公約要求政府應保障身心障礙者自立生活。依據我國法律體系，對本案政府作為的評論，下列何者最適當？
  options:
  - label: A
    content: 政府核定補助應依既有預算額度及權限，而非依國際人權公約
  - label: B
    content: 基於個人自我負責理念，政府不應該補助小天之自立生活費用
  - label: C
    content: 須經國際專家建議，政府才應補助讓小天足以自立生活之費用
  - label: D
    content: 依該公約施行法精神，政府應盡量補助讓小天能夠自立之費用
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 我國既然簽署《身心障礙者權利公約》應遵守其規範，因此需遵循施行法之精神，政府應盡量補助，以讓小天能夠自立，答案為(D)。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 位於美墨邊境的蒂華納臨時帳篷區，將近有 400 位非法移民，多半是來自宏都拉斯、瓜地馬拉等國長期棲息地方，然而，長期占據通往美國的主要通道，成了墨西哥政府的眼中釘。2022 年 2 月，墨西哥政府突襲拆除帳篷區，雖聲明仍會提供人權協助，但仍使許多非法移民不知所措，距離夢想中的家園，依舊遙不可及。請問根據上述內容，下列有關非法移民的敘述何者正確？
  options:
  - label: A
    content: 墨西哥政府此舉作法有助於促進每一位非法移民者自身的公民身分認同
  - label: B
    content: 墨西哥政府此舉有助於捍衛所有主流公民身分的落實為普世人權的展現
  - label: C
    content: 來自宏都拉斯的非法移民者可能無法合法在地工作、且無法享有參政權
  - label: D
    content: 公民身分皆為特定群體權益故墨西哥政府此舉並未對國際造成任何影響
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)墨西哥政府強行拆除帳篷，並無法助於促進非法移民者的公民身分認同。(B)墨西哥政府強行拆除帳篷，忽視非法移民者之人權，無法落實普世人權之展現。(C)非法移民者無法享有參政權、合法工作權等公民權利，為正解。(D)公民身分的界定為一國主權之展現，因此墨西哥之做法會影響周邊國家移民之權利，也會影響與周邊國家之關係。
- id: doc_113_台中_惠文_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 英國脫離歐洲聯盟後，英國與歐盟人民的生活於 2021 年起出現顯著變化，其中改變最大的是英國和歐盟公民自由遷徙的權利。雖然 90 天免簽證對短期旅行影響不大，但赴英國留學或商務而需要在英國久留的話，就要另外申請簽證。英國人原本在歐盟享受的居住、學習、工作上的權利也會停止，變成跟其他非歐盟國家的公民一樣英國學生原本可以申請伊拉斯莫斯計畫（Erasmus Program）至歐盟成員國的大學或研究所當交換學生，但脫歐之後，英國學生就無法申請此計畫。此外英國於 2021 年開始實施「移民積分制」，衡量年齡、英語能力、財力來判斷歐盟公民是否可以移民英國。從此案例觀察，下列敘述何者最符合主權行使的原則？
  options:
  - label: A
    content: 歐盟公民無論觀光、留學或商務皆應享有免簽證待遇，方能平等互惠
  - label: B
