  stem: 我國某市立音樂廳需要整修，基於《身心障礙者權利公約（CRPD）》的要求，民間團體主張應增加身障座位，但也有反對聲浪。正反意見彙整如下：反對意見：在廳內增加身障座位需拆除 20 個座位，會產生拆除與增建的施工成本，也會有未來每場表演的門票損失。支持意見：整建雖需付出成本，但建構友善身障者的環境，讓城市更具包容性，將帶來促進人權保障、落實文化權等看不見的效益。在與各界交換意見後，市政府確立以「障礙者文化平權」做為整修原則，以符合 CRPD 之「共融模式」的 2 項原則：Ⅰ、確保障礙者如所有人一般平等參與社會生活的權利，提高障礙者與非障礙者互動的可能性。Ⅱ、尊重障礙者的自主選擇，不將障礙者弱化為需要被保護的對象。請問依據 CRPD 與我國法之關係來評論題文中主管機關之作為，下列何者最適當？
  options:
  - label: A
