  group_stem: '《公民與政治權利國際公約及經濟社會文化權利國際公約施行法》於 2009 年公布施行，政府於 2016 年公布第 2 次國際人權報告，並於 2017 年邀請來自不同國家的人權專家來臺進行「兩公約國家人權報告第 2 次國際審查」。會後審查委員共提出結論性建議給我國政府。其中審查委員特別關注同性婚姻等議題。審查委員十分樂見我國政府推動婚姻平權，以 2018 年公投結果在 2019 年訂立同婚專法《司法院釋字第 748 號解釋施行法》，保障同性婚姻，使同性戀者與異性戀者皆擁有結婚的權利，成為消弭性別歧視、性別不平等的亞洲先鋒。

    我國大法官在 2017 年做出《司法院釋字第 748 號解釋》，認為《民法》沒有保障同性別二人結婚之權利，違反《憲法》中的權利，並要求立法院應該要在兩年內以任何立法的形式補足同性伴侶的權利。雖然確立我國同性婚姻合法化將在 2 年內完成，不過也開啟「修民法」與「立專法」來保障同性伴侶權益的爭論。包含立專法派的「愛家公投」與修民法派的「平權公投」，結果愛家公投提出的「民法婚姻應該限定在一男一女的結合」以及「同性婚姻應該以民法婚姻規定以外之其他形式來保障」2 項公民投票案通過。最後立法院三讀通過《司法院釋字第 748 號解釋施行法》，我國成為亞洲第 1 個同性婚姻合法化的國家。今年泰國繼臺灣和尼泊爾之後，成為亞洲第 3 個同婚合法國家，同運人士讚許為「歷史性的一步」，成為東南亞第一個承認同性婚姻的國家。泰國國會 6 月通過這項新法案，泰王瓦吉拉隆功（Maha Vajiralongkorn）簽署成法，刊登在王室公報後 120 天法律將生效，意味泰國第 1 個同性婚禮能於明年 1 月舉行。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)婚姻自由並非特殊權利，而是基本無差別對待之人權。(B)此與國家認同無關。(C)此與意見表達自由無關。(D)同婚法律之施行能使不同群體的多元身分認同落實。
