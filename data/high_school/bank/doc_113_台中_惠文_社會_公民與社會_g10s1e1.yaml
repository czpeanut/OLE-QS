  group_stem: 在我國，年滿 18 歲可以考機車駕照、參與公投、擔任公務人員，也要負起完全的刑事責任，2020 年年底三讀通過將《民法》成年年齡下修為 18 歲。相關法律規範都認可了 18 歲具有足夠的自主能力，能成為享有權利並負起相應義務的權利主體，但卻要 20 歲才能參與選舉投票。長久以來關注此議題的民間團體「十八歲公民權推動聯盟」認為，這樣的情況造成年輕人「有責無權」的困境。不僅是投票年齡，諸如《集會遊行法》、《人民團體法》等相關法律也以年滿 20 歲為限制，無形中都是限制了人民參與國家政治過程、申請集會遊行或成立團體等權利。但事實上，歷史上諸多學運及社會運動中，年輕人從未缺席，而是在臺灣民主轉型過程中，扮演了推動民主扎根的重要角色。「十八歲公民權推動聯盟」在 2020 年所做的「18 破框：18 歲公民權支持度調查」報告指出，超過 85 ％的成年民眾對於投票年齡下修表態支持。全世界也僅剩 5 ％左右的國家或地區，與臺灣同樣 18 歲尚無投票的權利。2022 年 11 月我國辦理 18 歲公民權的修憲公投，公投結果唯最終仍因未達選舉人總額半數的門檻而未通過。
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
