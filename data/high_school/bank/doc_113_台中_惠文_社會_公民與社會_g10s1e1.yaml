  explanation: (A)選舉罷免為參政權，屬於消極人權。(B)此為普遍適用全體人民的權利，並非保障少數群體的特權。(C)下修選舉罷免的投票年齡後，能使更多人參與政治，為正解。(D)從題文敘述，相關法律認可 18 歲具有足夠的自主能力，為權利主體，但卻無參與選舉投票的權利，造成年輕人「有責無權」的困難，可知下修公民投票年齡可使公民身分權責相符，為正解。(E)此為落實年輕人的人權，並非老年人。
