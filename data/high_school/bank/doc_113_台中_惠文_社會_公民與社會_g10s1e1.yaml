  stem: 2020 年《國家安全法》在香港通過並實施。此法對「國家安全」的廣泛定義仿效中國中央當局的定義，缺乏明確性和法律可預測性，且一直被恣意用來限制表達、和平集會與結社自由等權利，以及打壓異議聲音和政治反對派。香港人權律師鄒幸彤因和平紀念 1989 天安門事件被控《國家安全法》下的「煽動顛覆罪」，2021 年起遭受監禁，面臨高達 10 年有期徒刑。她和其他香港市民「支援愛國民主運動聯合會（支聯會）」的核心成員不願配合當局要求，他們在拒絕提交支聯會成員、員工和合作組織的相關資料後被捕。由於核心成員遭到起訴，加上政府施壓日益加劇，香港支聯會隨後於 2021 年解散。國際特赦組織致力於人權維護，請參考題文敘述，下列作為何者最有可能為國際特赦組織的人權行動？
  options:
  - label: A
