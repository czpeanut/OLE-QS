  - label: B
    content: 因公約已經國內法化，主管機關作為符合依法行政
  - label: C
    content: 因公約具有命令位階，政府仍應遵守相關公約內容
  - label: D
    content: 因公約內容未違反既有法規，政府可做為施政參考
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)我國雖為《身心障礙者權利公約》的締約國，需依公約辦理，但此措施不須經由專家審查才能執行。(C)公約國內法化後，應具有法律位階之效力。(D)應是法規需遵循國際公約，而非公約需符合既有法規。
