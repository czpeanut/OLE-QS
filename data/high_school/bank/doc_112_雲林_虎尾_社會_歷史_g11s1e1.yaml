  stem: 有一個民族的文學作品中寫到：「風──仍不停，六日又六夜。洪水巨浪吞沒了大地。第七天，南來的波濤平息，海水平靜了，洪水也休停。」這個民族不單要面對洪水氾濫的恐懼，也存在外族威脅。請問這個民族可能寫出下列哪個作品？
  options:
  - label: A
    content: 「壯觀的生命寶殿起於善端，陰暗的死亡之窟立於惡端。」
  - label: B
    content: 「沒有永遠！……難道曾有人蓋過永遠不會倒的房子嗎？」
  - label: C
    content: 「以色列的眾子……一同到埃及、他們的名字記在下面。」
  - label: D
    content: 「別了故鄉特洛伊，在水一方……羅馬的榮光悠久無疆。」
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 此為飽受洪水氾濫威脅的兩河流域的文學作品，洪水加上外族入侵，使得當地的文化呈現悲觀特色，認為人無法掌握命運、逃脫命運的安排，(B)符合這種心態。(A)波斯祆教的善惡二元對立。(C)希伯來人的歷史。(D)羅馬的《埃涅阿斯記》。
