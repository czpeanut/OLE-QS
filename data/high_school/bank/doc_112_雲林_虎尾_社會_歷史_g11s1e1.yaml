  stem: 亞述國王提格拉特帕拉沙爾一世如此描述自己：「宇宙無與倫比的國王，四個地區的國王，萬王之王，萬主之主，萬民之王的牧民……被沙瑪什（兩河流域的太陽神）給予神聖權杖，對人民有絕對的權威……燦爛的光輝籠罩了整個地區，壯麗的火焰像暴雨一樣籠罩著敵對的土地，我在神恩利爾（造成大洪水的神）的命令下，毫無敵手的擊敗了亞述神的敵人。」根據引文，下列解讀何者正確？
