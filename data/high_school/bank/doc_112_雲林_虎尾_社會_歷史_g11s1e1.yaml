  stem: 泰利斯看到生命都由潮溼中誕生，因此主張一切事物都由「水」而產生；阿納克西美尼主張萬物是由「氣」組成，因為氣可以藉由凝聚和稀釋，轉化成其他事物；德謨克利圖斯等原子論者，則認為萬物由「原子」而成，無數多且本質相同的原子透過形狀、結構上的不同安排而產生萬物。以上古希臘哲學家們對於自然界的見解，有何共同之處？
  options:
  - label: A
    content: 皆為任意猜測的想像，並沒有任何參考價值
  - label: B
    content: 皆試圖以理性思維而非神話角度來解釋世界，為人類理性思考打下基礎
  - label: C
    content: 皆用多種以上的元素來解釋萬物，不同元素互相混合而成複雜的世界
  - label: D
    content: 皆因面臨自然環境的艱困，才試圖提出理論以解決勞苦的命運
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這些古臘哲學家對自然界的見解雖然不同，但皆是以理性思維與客觀觀察而得到的結論，非以神話角度來解釋，(B)為正解。(A)這些解釋都是經過審慎觀察、思考而得出之結論，並非任意猜測。(C)題文所舉例子皆以單一元素來解釋。(D)從題文中無法判斷這些哲學家皆面臨自然環境的艱困，提出對自然界的看法也與解決勞苦命運無關。
