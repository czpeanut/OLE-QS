  answer_status: verified
  answer_source: answer_key
  explanation: 亞述國王自認從神手中收到權杖，擁有統治人民的權力，並以神之名發動戰爭，因此答案為(C)。(A)亞述國王認為戰爭勝利乃是神意。(B)(D)從題幹中無法看出。
