  stem: '以色列和巴勒斯坦的衝突，周旋在歷史糾葛和現代紛爭中至今難解，右圖為巴勒斯坦地區簡圖。請問：

    (1) 造成以色列和巴勒斯坦的衝突，主要有下列哪些因素？(甲)民族(乙)宗教(丙)石油(丁)領土(戊)民主改革。

    (2) 以色列歷經多次戰爭之後，占領 R 地至今尚未歸還，其主要原因是為了取得哪一條河流的控制權？

