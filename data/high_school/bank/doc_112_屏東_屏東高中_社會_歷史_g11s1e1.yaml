  stem: '資料一：荷馬史詩《奧德賽》描述西元前 13 世紀的故事，曾提及「當時腓尼基人的貿易活動已經非常蓬勃」。

    資料二：1960 年，有位考古學者率先潛入東地中海的海底，從事打撈古代沉船的工作，在打撈上岸的古物中，有一枚商人使用的圓石印章。七年後，考古人員證實這艘商船於西元前 1200 年左右因觸礁而沉入海底，而那枚印章為腓尼基商人所有。

    透過上述兩則資料，關於研究古代史，下列哪些敘述是較合理的理解？'
