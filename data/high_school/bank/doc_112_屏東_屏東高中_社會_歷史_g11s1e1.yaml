  stem: 阿拔斯王朝建立後，由哈里發倡導、鼓勵，9 世紀時「翻譯運動」達到極盛。在所建的「智慧之宮」中有來自各地的翻譯家，將古代的哲學和科學著作譯成阿拉伯文，並作了大量的勘誤和注釋工作。當時由於「智慧之宮」的設立，使何地被稱為「智慧之城」？
  options:
  - label: A
    content: 麥加
  - label: B
    content: 巴格達
  - label: C
    content: 麥地那
  - label: D
    content: 大馬士革
  answer:
  - B
