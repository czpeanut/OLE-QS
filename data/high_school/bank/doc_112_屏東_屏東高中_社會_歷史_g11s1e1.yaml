    content: 從荷馬史詩當中的記錄，可以得知其記載的特洛伊戰爭可能曾真實發生過
  - label: C
    content: 憑藉考古的成就，古代史整體可以全面獲得重建
  - label: D
    content: 考古成就能印證史詩內容，但並不一定能完全相符
  - label: E
    content: 荷馬史詩中居然出現考古才知道的內容，我們可以懷疑史詩應是現代人偽造的內容
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)荷馬史詩可以參考，但並非正確無誤的歷史事實。(C)考古出土有助於重建歷史，但無法全面性。(E)研究古史本就該以文字資料搭配地下材料，沒有證據證明荷馬史詩為現代人所偽造。
