  stem: 「中世紀作家利用古代資料的意圖，傾向於補充和證明預先形成的基督教假說，那麼，文藝復興時期的作家習慣上則引用古典文獻來重新討論他們預先形成的觀念，並改變其表達方式。」請問上述談到文藝復興的什麼精神？
  options:
