- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 希臘某位學者的名言是：「吾愛吾師，但吾更愛真理。」他創造出與他的老師截然不同的哲學體系，他把自然當作科學研究的客觀對象，並進行科學分類，使得自然科學與社會科學逐漸演變成許多獨立的學科。請問此位學者是誰？
  options:
  - label: A
    content: 泰利斯
  - label: B
    content: 蘇格拉底
  - label: C
    content: 柏拉圖
  - label: D
    content: 亞里斯多德
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
