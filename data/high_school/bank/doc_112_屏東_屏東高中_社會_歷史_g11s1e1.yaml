  section: 1
  number: 9
  type: single
  page: 1
  stem: 宗教改革與文藝復興兩者之間的關係相當密切，文藝復興時代的基督教人文主義的興起對於宗教改革有所影響，因為這些學者對早期《聖經》的分析發現到中古教會曲解原始經文，因此主張改革教義。下列哪一個人物正是代表之一？
  options:
