    content: 皆屬於伊斯蘭教的遜尼派
  - label: B
    content: 皆很重視商業與貿易發展
  - label: C
    content: 皆以白銀為主要通行貨幣
  - label: D
    content: 皆以阿拉伯文為官方語文
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)第二段提到「四國都鼓勵商業發展」，(B)為正解。(A)薩法維為什葉派。(C)題文中並未提到。(D)薩法維與蒙兀兒的首要行政用語為波斯語。

    (2)(A)薩法維與蒙兀兒的衝突，多肇因於爭奪戰略要地。(B)為正解。(C)題文中看不出四國已漸淪為歐洲殖民地。(D)薩法維為什葉派國家，對宗教應最嚴格。

    (3)蒙兀兒與薩法維皆於 16 世紀建立，加上歐洲人帶進美洲白銀的時間也在 16 世紀，因此可推測資料所述時代最早可能出現於 16 世紀。'
