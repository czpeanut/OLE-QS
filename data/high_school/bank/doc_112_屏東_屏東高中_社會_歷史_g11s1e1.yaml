  stem: 法蘭為 13 世紀法蘭克的農夫，請問有關他生活的描寫，下列敘述何者正確？
  options:
  - label: A
    content: 法蘭出生時會在教會接受受洗
  - label: B
    content: 因為不識字，所以無法了解《聖經》裡的故事
  - label: C
    content: 因為農事繁忙，無法參加宗教慶典
  - label: D
    content: 會前往麥加朝聖
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 古典時期的希臘城邦與中古後期的西歐城市，雖然興起的時空不同，其發展卻有不少雷同之處。下列選項何者為是？
  options:
  - label: A
    content: 皆因商業需要而興起
  - label: B
    content: 公民皆以商人為主體
  - label: C
    content: 皆是獨立的政治單位
  - label: D
    content: 皆實施直接民主政治
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 中古後期的西歐城市多發展成自治城市，由市民階級自行管理統治，與希臘城邦類似，答案為(C)。(A)希臘城邦並非全商業需要而興起。(B)希臘城邦的公民多為農民。(D)中古後期的西歐城市並未實施直接民主政治。
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 這個民族經歷苦難，但因為恪守與神的「約」和「神選說」，他們堅信苦難是神對違背神意與惡行的懲罰，讓他們藉此進行深刻的反省與革新。請問上文中提及的「這個民族」應該是
  options:
  - label: A
    content: 希臘人
  - label: B
    content: 羅馬人
  - label: C
    content: 希伯來人
  - label: D
    content: 阿拉伯人
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 這個重視與神的「約定」，自認是「神的選民」卻又受到神的懲罰的民族應是(C)希伯來人。視亡國為神的懲罰，因此每日向神懺悔祈求原諒，堅信一神以等待獲赦重新復國的時機。
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 一個延續千餘年的大帝國，以農業為立國基礎，其首都是歐洲地區及地中海世界最大的政治、經濟和宗教中心，控制歐洲和亞洲之間的貿易與文化往來。這個帝國是指
  options:
  - label: A
    content: 波斯帝國
  - label: B
    content: 亞歷山大帝國
  - label: C
    content: 羅馬帝國
  - label: D
    content: 拜占庭帝國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 選項中位居歐洲地區及地中海世界，且曾延續千餘年的大帝國，僅有(D)拜占庭帝國。(A)(B)(C)三者國祚皆未及千餘年。
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 13 世紀以後，東南亞島嶼地區的人民，經由阿拉伯人、波斯人與印度人的媒介，逐漸接受了伊斯蘭信仰。阿拉伯人、波斯人與印度人等最主要是以何種方式傳播伊斯蘭教？
  options:
  - label: A
    content: 透過貿易接觸
  - label: B
    content: 藉由軍事征服
  - label: C
    content: 倚賴外交壓力
  - label: D
    content: 利用物質引誘
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 早期伊斯蘭勢力自阿拉伯半島向外武力擴張，曾建立橫跨三洲的版圖，但未及東南亞地區，該地區則是在 13 世紀後，(A)透過貿易接觸、通婚等方式傳播伊斯蘭教。
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 1258 年 2 月，凶猛的軍隊攻克阿拉伯帝國的首都巴格達。哈里發被裝進袋子後遭士兵縱馬踏死，昔日繁華的帝國幾乎成了廢墟，此後統一的阿拉伯帝國不復存在。請問攻克巴格達的軍隊是
  options:
  - label: A
    content: 羅馬人
  - label: B
    content: 蒙古人
  - label: C
    content: 塞爾柱土耳其人
  - label: D
    content: 鄂圖曼土耳其人
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)13 世紀的巴格達為塞爾柱土耳其人掌控政權的阿拔斯王朝，後亡於 1258 年蒙古第三次西征。

    7.13 世紀初，印度北部出現最早的伊斯蘭政權──德里蘇丹國；16 世紀，信仰伊斯蘭教的帖木兒後裔巴卑爾攻占德里，建立蒙兀兒帝國，積極拓展疆域，伊斯蘭信仰也因此在印度擴散，(C)為正解。(A)(B)兩政權皆未曾統治過印度。(D)法國不會在印度宣揚伊斯蘭教。

    8.(A)《十二表法》內容多與民法有關，以保障平民權益為目的。(C)應是發展成民法。(D)曾參考雅典法律。

    9.(B)伊拉斯莫斯為北方文藝復興的精神領袖，其《愚人頌》隱含對基督教會的批評與改革想法，後來馬丁路德受到啟發而展開宗教改革。(A)(C)(D)三者為義大利文藝復興的代表，關注重心不在基督教會。

    10.題文所述為(D)亞里斯多德的名言，與強調觀念論的柏拉圖不同，亞里斯多德更重視感官經驗與對實際觀察，再以邏輯推論出普遍的原則，為後世科學研究方法奠下基礎。

    11.文藝復興的作家「引用古典文獻來重新討論他們預先形成的觀念，並改變其表達方式」，可見得這些人文學者並非完全仿古，而是加上創新的想法，(C)較為貼切其精神。

    12.阿拔斯王朝將「智慧之宮」設於首都(B)巴格達，成為阿拉伯學術文化重鎮。(A)伊斯蘭的聖地。(C)「聖遷」之地。(D)奧瑪亞王朝的首都。

    13.(C)為正解。(A)(B)(D)文藝復興時期的教堂建築不再使用哥德式風格，改以恢復古代圓頂的羅馬式風格為主，並非自創新風格。

    14.(B)波隆納大學以法學見長。(C)巴黎大學以神學著稱。(D)大學的前身是教師行會或學生行會，非商人捐款。

    15.從「神同人一般」一句，即可推知是希臘人的宗教觀，與其他民族高高在上、嚴明正義的神祇不同，希臘的神明為有情有欲的超人，常隨心所欲去干預世界與人的命運，答案為(A)。

    16.(A)斯多噶派與伊比鳩魯派表面上論點相異，實則兩者都追求內心的平靜以獲致幸福。(B)斯多噶派的主張。(C)斯多噶派反對避世自保。(D)斯多噶派受到羅馬政權的喜愛，甚至影響到羅馬法律與基督教。

    17.東羅馬帝國的皇帝除了是政治領袖外，並可任免主教和獎懲教士、介入教義和崇拜問題、召開並主持大公會議，可知東羅馬帝國具有(D)政教合一的統治現象。

    18.(A)達文西、米開朗基羅以人的形象畫神，展現出此時代的特徵，當然可劃歸為人文學者。(C)人文學者最看重拉丁文的學習。(D)宗教依然是此時期最多的藝術題材，但藝術創作目的已不再是彰顯教義。

    19.題文所述為「亞威農之囚」事件，(B)為正解。(A)十字軍為 11 ～ 13 世紀，對抗東方的穆斯林。(C)東西教會於 11 世紀已分裂。(D)此時尚未宗教改革，沒有新教。

    20. 11 世紀後，阿拔斯王朝國力衰退，軍政大權旁落於塞爾柱土耳其人手中，此原是來自東方的(B)突厥人。

    21.這份文件表示願意尊重所有人的宗教，包括基督教，由此可推知是讓基督教合法化的(B)君士坦丁。

    22.(A)題文所述的四個城市皆位於義大利北部，在十字軍東征後，因位於重要貿易路線上，商業發達，經濟繁榮，故而快速發展成為大城市。

    23.(B)西元 8 世紀，法蘭克國王丕平將義大利中部的土地贈與教宗，成為日後教宗國的基礎。

    24.阿克巴實施宗教寬容，奧朗則布壓迫非穆斯林，兩者宗教政策完全不同，因此(C)為正解。(A)(D)題文並未提及。(B)較符合奧朗則布的作法。

    25.從 1145 年、戰勝異教徒、奪回聖地等關鍵詞，可推知此演說應與十字軍運動有關，(C)為正解。(A) 13 世紀。(B)從「戰勝異教徒」一句，可知其反對的是異教，而非基督教內不合理的規定。(D) 14 世紀。

    26.題文所述為陶片流放法，此為古典希臘時期雅典為防止民主制度遭破壞的方法，故答案為(A)。

    27.(A)哈里發為穆罕默德的繼承者，並未強調阿拉伯主義。(B)哈里發制度非穆罕默德所制定。(C)為正解。(D)伊朗信奉什葉派。

    28.(A)瑪爾斯原本的神性應與繁衍有關，非守護軍隊。(B)資料說明兩者不同。(C)為正解。(D)羅馬文化強調兼容並蓄，能吸納其他地區的神祇。

    29.伊斯法罕為(B)薩法維帝國的首都，帝國以什葉派作為國教，與其他伊斯蘭帝國截然不同。

    30.從這段評論來看，奧瑪亞王朝時由阿拉伯人壟斷政權，阿拔斯王朝則較能與其他民族分享權力，因此答案為(D)。(A)阿拉伯人壟斷政權。(B)獨尊阿拉伯人。(C)兩個王朝的族群政策不同。

    31.兩則資料都是關於西元 622 年穆罕默德離開麥加，只是資料一從穆斯林的立場稱之為「聖遷」，資料二從非穆斯林的眼中看待此事就成了「大逃亡」，因此(C)為正解。

    32.佩脫拉克的詩文裡提到不想變成上帝或居住在永恆之中，只願追求人的光榮與凡人的幸福，反映出文藝復興時代的人文主義思想，答案為(A)。

    33.(A)如果希臘懷恨在心，應不會高舉「馬其頓是希臘的」標語。(C)希臘不曾武力征服馬其頓。(D)今日的馬其頓政權並未承自亞歷山大，希臘也不會因此忌妒馬其頓。(B)為正解。

    34.(D) SPQR 是古羅馬政府的正式名稱，意思是「元老院與羅馬人民」，直至今日，在羅馬的公共設施或市徽仍可以看到。

    35.(A)《新約》聖經有「彼得磐石」的說法，據聞耶穌在升天之前，曾將天國鑰匙交給彼得，此也是羅馬主教成為基督教會領袖的神學理論。

    36.(C)伊斯蘭教的教義不允許偶像崇拜，在藝術表現上不能出現神像或聖像，因此清真寺的裝飾只能以花草、幾何圖形或《古蘭經》經文做為裝飾。

    37.都爾戰役是伊斯蘭勢力入侵伊比利半島後第一場敗戰，穆斯林在占領伊比利半島後，企圖往歐洲繼續擴張，後為法國國王鐵槌查理擊退，將伊斯蘭勢力侷限在伊比利半島上，因此其地點應是(A)。'
