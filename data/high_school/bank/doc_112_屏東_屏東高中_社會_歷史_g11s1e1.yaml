  stem: '請閱讀下列資料後回答問題：

    當時，在西亞到印度這片土地上，突厥─蒙古勢力建立了四個大國，即鄂圖曼、薩法維、蒙兀兒與烏茲別克。四國的統治家族都以突厥語為母語，並依賴部族奪權。在鄂圖曼與烏茲別克，阿拉伯語文一直是宗教與神學用語，也是大部分地區的文學、歷史與商業用語；薩法維與蒙兀兒首要的行政與文學用語則是波斯語。宗教方面，薩法維與其他三國不同，是以什葉派為主，因此加劇它與鄂圖曼、烏茲別克的衝突；不過薩法維與蒙兀兒之間的軍事衝突無關教派，大多肇因於爭奪戰略要地。蒙兀兒早期的統治者，也未將宗教認同視為對政權效忠的標準。

    四國都鼓勵商業發展，這裡已構成一片遼闊、相對穩定、低稅率的商業區，歐洲人帶進購買商品的美洲白銀，也促進此地的發展。蒙兀兒是其中最大的經濟體，其他三國的經濟體質則較脆弱，無力支持日漸增加的開銷。

    【資料出處：法蘭西斯．羅賓笙主編，黃中憲譯，《劍橋插圖伊斯蘭世界史》，臺北：如果出版社，2008，第 64 ～ 66頁】

    (1)這四個伊斯蘭大國有何共通點？

    (2)依據引文內容，下列說明正確者為何？ (A)四國的衝突皆是肇因於宗教 (B)四國之中最富庶的是蒙兀兒 (C)四國均已逐漸淪為歐洲的殖民地 (D)四國中對宗教最寬容的是薩法維。

    (3)題幹所述情景，最早出現於哪一世紀？請寫出兩項判斷依據。

    | 最早出現世紀 |  |

    | --- | --- |

    | 判斷依據一 |  |

    | 判斷依據二 |  |'
  options:
