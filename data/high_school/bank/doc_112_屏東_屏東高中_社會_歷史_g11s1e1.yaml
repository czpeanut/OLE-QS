  stem: '請閱讀下列資料後回答問題：

    公元前 28 年，屋大維解決內戰、凱旋羅馬，元老院授予他「元首」稱號，別稱「第一公民」。隔年屋大維恢復共和政體，宣布「將全體公民託付給我的權力，全部歸到公民及元老院手中」。元老院瞬間響起如雷的歡聲，並立刻提案再授予屋大維「奧古斯都」的尊號，他們確信「奧古斯都」意指神聖而受尊敬的，完全沒有武力或是權力方面的意味。至此，屋大維實際掌握著執政官、大將軍及「第一公民」、「奧古斯都」等職位及稱號。

    事隔五年，屋大維再度宣布卸任連任多屆的執政官，元老院議員簡直無法相信，因為這意味著他們恢復再次成為執政官的機會。但是與此時同時，屋大維也向元老院提出賦予他「護民官」的特權。這是自共和時代便已常設的一項官職，元老院不加思索便答應了。但他們沒有想到，屋大維看準的是護民官的否決權，這項權力是他成為羅馬獨裁統治者的最後一塊拼圖。

    【資料出處：改寫自鹽野七生著、張麗君譯，《羅馬和平》（臺北：三民書局，1998），第 16 ～ 17、20 ～ 21、26、61 ～ 66 頁；馬世力、陳光裕，《一本就通世界史》（臺北：聯經，2010），第 92 頁】

    (1)請問此段資料可以下列何者為標題？

    (2)從資料中研判，若屋大維想要走向帝制，哪一個職位可能是最關鍵的？（非選擇題）

    (3)請根據這段資料，對屋大維如何達成目標做一段落結論，須運用資料內容，並分析最終目標為何。（非選擇題，50 字內）'
  options:
  - label: A
    content: 羅馬和平建造者─屋大維稱霸地中海
  - label: B
    content: 羅馬共和的輓歌─屋大維的帝國之路
  - label: C
    content: 恢復古羅馬共和─屋大維心繫共和制
  - label: D
    content: 重整元老院制度─元老院的前世今生
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)題文資料顯示，屋大維看似要將恢復共和政體，但每次的宣布皆使他的職位及稱號更多，最後終於成為羅馬獨裁統治者了，因此(B)標題最符合。

    (2)第二段說明「護民官」的否決權是屋大維最想要的特權，也使他成為羅馬獨裁統治者。

    (3)屋大維自擊敗安東尼後，表面上透過釋放權力，如恢復共和政權、卸任執政官等方式，讓元老院以為他正在走回共和。然而，實際上他仍掌握大將軍的軍隊實權，且更讓元老院同意給予護民官的否決權。縝密的擴權策略，使他被視為走向羅馬帝國的開端。'
