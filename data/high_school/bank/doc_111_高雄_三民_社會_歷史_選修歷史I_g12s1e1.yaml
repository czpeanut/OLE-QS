  answer_source: answer_key
  explanation: '(A)《懷唐伊條約》（《懷坦吉條約》、Treaty of Waitangi）簽訂後，確立毛利族各部落將統治主權轉移予英國女王，也推進英國殖民者於紐西蘭的殖民化腳步。(B)許多平埔族人與漢人通婚，確實是造成平埔族文化流失的重要因素。(C)日本早期殖民所採取的差別統治，和一戰後民族自決風潮的興起，促成日治中期臺灣人本土意識與族群認同的抬頭。(D)毛利人喪失族群認同的關鍵原因在於二戰後快速的都市化。(E)
    1980 年代起，許多原住民在民主化運動的浪潮下，開始推動原運、提倡文化復振，並透過如《高山青》等刊物進行宣傳。

    33.1851 年於英國倫敦舉辦舉辦的萬國工業博覽會（Great Exhibition of the Works of Industry of all Nations），是世界上首次舉辦的世界博覽會，其舉辦之動機乃是為了彰顯英國於工業革命後，在工業技術、帝國殖民與文明化的高度發展。會中展出的展覽品超過一萬多件，並多為展現當時英國高度工業發展之技術製品，包括蒸氣火車、高速汽船、起重機，以及用洛可可風裝飾的紡織機、哥德式圖樣的蒸汽機等；另外，也展出包含來自印度、紐西蘭、澳洲等地的相關展示品，以炫耀大英帝國在世界各地所經營的殖民成果。(D)核子武器發明於
    20 世紀中期的二戰期間。'
