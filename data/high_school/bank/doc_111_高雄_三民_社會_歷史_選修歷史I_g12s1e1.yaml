  stem: '閱讀下列兩則資料，回答問題：

    資料一：一位傳教士寫信向教會報告宣教成果：「某些地區，百分之八十的居民接受了基督教教義，其中半數會閱讀並使用羅馬拼音文字。」

    資料二：一位清代人的回憶：「原來我們沒有文字，傳教士來後幫我們創造一套文字，這套文字在傳教士離開後，我們在土地契約上，繼續使用至少一百五十年。」

    下列有關這兩則資料的解讀，哪些是正確的？'
  options:
  - label: A
    content: 兩則資料內容和荷蘭傳教士在臺傳教有關
  - label: B
    content: 兩則資料所指的傳教士是指耶穌會傳教士
  - label: C
    content: 兩則資料所指的文字是指岸里社語和文書
  - label: D
    content: 「地區」和「我們」是指宜蘭的噶瑪蘭族
  - label: E
