  stem: '2003 年，紐西蘭國家博物館被政府指名進行「歐提羅奧呼喚回歸計畫」（The Karanga Aotearoa Repatriation Programme），是此計畫唯一參與的國家博物館。1865
    年紐西蘭國家博物館成立之初多藉展品歌頌西方文明。1998 年始納入原住民族的傳統文化及殖民接觸史並以此正式營運。「歐提羅奧呼喚回歸計畫」便是主動進行國內及國際間祖先遺骸回歸的計畫，這些遺骸包含大量原本大部分在歐洲的紋面頭顱，返還的最終站在該遺骸的原生部落。該館在
    1970 年代便開始進行返還的協商，計畫開始至 2017 年，該博物館已將海外四百二十具祖先遺骸帶回紐西蘭，目前仍約有六百具欲返回紐西蘭。由紐西蘭國家博物館提供遺骸相關的研究報告及負保護的責任，返還的細節及儀式則由部落主導，毛利人相信，遺骸返回家園，死者和活者的後代將恢復他們的尊嚴。

    1980 年代某國也開始透過各種外交手段要求大英博物館歸還原屬該國古文明神殿中的神像雕塑，遭到英國政府拒絕。拒絕的理由是，這些雕塑是十九世紀當地的伊斯蘭統治者賣到英國，並非透過戰爭或是殖民掠奪取得；某國政府則認為，該統治者是歷史上的侵略者，其作為不代表人民的意志，更沒有權利將當地的重要資產給予任何人。這座具古典民主象徵的神殿與其神像雕塑，至今仍在異地相望。

    (1) 請問流落海外的紋面頭顱大部分在歐洲最有可能的原因是？'
  options:
  - label: A
    content: 頭顱是殖民時期和歐洲人交易的物品之一
  - label: B
    content: 遭外來者強制遷移的毛利人最終死於歐洲
  - label: C
    content: 歐洲人對毛利奴隸階層的劫掠及人口販賣
  - label: D
    content: 第二次世界大戰中大量死亡的毛利人
  answer:
  - A
  explanation: 根據學者研究，毛利族傳統文化中，會將生前紋面的親人或敵人之頭顱製作成可長期保存的紀念物「Toi moko」。19 世紀初期，毛利人因發現歐洲移民商人對「Toi
    moko」有交易的興趣，因此開始以此交換毛利人所需要的毛瑟槍、彈藥，故答案選(A)。
  answer_status: verified
