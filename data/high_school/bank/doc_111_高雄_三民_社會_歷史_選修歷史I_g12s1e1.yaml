- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 學生在做清代臺灣史的報告時，其內容摘要為：一是臺灣和中國大陸間「區域分工」頻繁，造成商業貿易在臺灣特別發達；二是商業貿易日趨頻繁，漳、泉商賈彼此競爭激烈，遂依祖籍、宗族團結共謀利益；三是清廷對臺灣限制糧運，福建兵糧，由臺補給，食糧的配運，都需有船團的組織及管理。就摘要來看，這份報告的主題應是
  options:
  - label: A
    content: 行郊形成的背景
  - label: B
    content: 分類械鬥的原因
  - label: C
    content: 東亞貿易的概況
  - label: D
    content: 渡臺禁令的內容
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹敘述中時間點為清代，和兩岸「區域分工」下商貿發達、商人依祖籍、宗族等「團結共謀利益」等特色，可判斷此為描述清代行郊形成的背景。(B)題文敘述中未提及分類械鬥。(C)此時期在政策的限制下，主要為兩岸對渡貿易，並未擴及東亞。(D)題文敘述與渡臺禁令無關。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 附圖為 1500 年至 1799 年間，從歐洲出發，前往亞洲海域貿易前三名國家的船隻數量變化圖。根據該圖，甲、乙、丙依序是哪些國家？
  options:
  - label: A
    content: 葡萄牙、荷蘭、英國
  - label: B
    content: 西班牙、英國、荷蘭
  - label: C
    content: 荷蘭、英國、西班牙
  - label: D
    content: 英國、葡萄牙、荷蘭
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e1/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 169.65
      - 279.75
      - 514.4
      - 426.5
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 本題圖表中，甲國貿易船數於 16 世紀前半達到高峰後，逐年衰退，可推測甲國應為歐洲早期海權霸主的西班牙或葡萄牙；乙國自 17 世紀前期崛起後，貿易船數即遠遠領先他國，並於
    18 世紀前半達到高峰後衰退，與荷蘭聯合東印度公司的發展脈絡相符；丙國則是自 17 世紀前期開始發展後，慢慢擴張至 18 世紀末期，並追上衰退的荷蘭聯合東印度公司，因此可判斷丙應為英國東印度公司。綜合前面的推斷，正確答案為(A)葡萄牙、荷蘭、英國。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 深夜，在工廠旁的麵攤上，剛下工的工人相聚聊天，而黑白電視螢幕上，臺語歌手正唱著剛推出的新歌，傾訴離開臺灣中南部農村來到都市打拼的工人，思念家鄉的雙親和戀人的情懷。工人聽了，不禁流下淚來。這種景象最常見於下列哪一時期？
  options:
  - label: A
    content: 1930 年代日本政府推動工業化政策
  - label: B
    content: 1950 年代政府推動第一期經建計畫
  - label: C
    content: 1970 年代實施第二次進口替代政策
  - label: D
    content: 1990 年代推動產業升級與經濟轉型
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 本題描述的情景，呈現臺灣社會在戰後逐步工業化後，1970 年代農村勞動力大量轉入工廠，並開始加速都市化。政府透過重大投資，解決失業問題，並強化國家基礎建設和改變產業結構，減少原料進口，提升產業的競爭力。這段時期稱為「第二次進口替代時期」。(A)日本殖民政府雖於
    1930 年代推動臺灣的工業化，但規模並不大，勞動人口仍多從事於農業，且當時流行文化的傳播媒介以收音機為主，因此不符合題幹描述之景象。(B) 1950 年代推動的第一期經建計畫（1953
    ～ 1956），主要目的為土地改革與鼓勵農業生產，因此尚未正式進入工業化社會。(D) 1990 年代推動的產業升級與經濟轉型，以高科技產業和服務型產業為主，與題幹敘述較不相符。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 近世臺灣開發以來，逐漸形成「大租戶、小租戶、佃戶」的土地所有與經營結構。某個時期，政府為了解決財政不足的問題，除了清查全臺土地，防止逃漏稅外，更以行政命令，剝奪某個層級地主的土地所有權，而以政府發行的公債以及現金做為補償。如此一來，政府得以向直接經營土地者徵稅，擴大徵稅對象，稅收也得以增加。這次土地所有權的變動最可能是指
  options:
  - label: A
    content: 鄭成功實施屯田制
  - label: B
    content: 劉銘傳行減四留六法
  - label: C
    content: 日本取消了大租權
  - label: D
    content: 民國政府三七五減租
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 日治時期，為了解決清代以來臺灣社會土地與租稅制度的混亂，並強化政府稅收的機制，日本殖民政府自 1898 年起即開始著手進行全臺的土地調查事業，確認土地所有權後，總督府頒布「律令第六號」（律令可視為總督行政命令）宣告廢除已確認之大租權，並以補償金和公債補償被廢除的大租戶。(A)與本題脈絡無關。(B)減四留六法並未取消大租權。(D)三七五減租的目的為保障佃農權益，規定佃農向地主繳納地租的上限，且在租期中非因法定事故，地主不得終止租約。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 一位美國空軍人員回憶：某處基地駐紮了各型新式戰機，都是循著軍售管道或從我國的軍事顧問團獲得。這些戰機停滿了機場待命區，隨時準備升空，迎擊入侵的敵機。這個場景應當是
  options:
  - label: A
    content: 1938 年重慶
  - label: B
    content: 1944 年上海
  - label: C
    content: 1970 年臺中
  - label: D
    content: 1995 年臺南
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 本題敘述之背景為冷戰期間，臺灣作為美國防堵共產勢力島鏈的一員，接受美國援助的情況，美軍顧問團於韓戰爆發後進駐臺灣，成立的「駐臺軍事援助顧問團」，存在時間為
    1951 ～ 1979 年。(A)二戰期間，美國首次派遣軍事顧問團到中國的時間為 1941 年。(B) 1944 年的上海由汪精衛政府所控制，因此不會受到美軍援助。(D)
    1979 年中華民國與美國斷交，1995 年的臺灣已無美軍顧問團的存在。
- id: doc_111_高雄_三民_社會_歷史_選修歷史I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 連橫《臺灣通史》自序云：「夫臺灣固海上之荒島爾！篳路藍縷，以啟山林，至於今是賴。顧自海通以來，西力東漸，運會之趨，莫可阻遏。」又說：「洪維我祖宗，渡大海，人荒陬，以拓殖斯土，為子孫萬年之業者，其功偉矣！」從這些文字可理解連橫的觀點是
  options:
  - label: A
    content: 符合世界潮流的文化多樣性觀點
  - label: B
    content: 以臺灣原住民族為主體的歷史觀
  - label: C
    content: 結合文獻與考古資料的歷史解釋
  - label: D
    content: 以漢人開拓角度書寫的歷史觀點
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '從連橫自序中「篳路藍縷，以啟山林」、「渡大海，入荒陬，以拓殖斯土」等敘述，可判斷其認為臺灣的開發，基於漢人移民的功業，而並未重視臺灣早於移民前來，即有原住民族在此生活之事實，因此可判斷這段敘述呈現出以漢人開拓角度書寫的歷史觀點，故答案選(D)。

    7.1960 年代，美國搖滾樂文化在民權、反戰等思潮下蓬勃發展，其充滿反抗、叛逆的詞曲風格，深刻影響美國與全球社會的流行文化；其中作為搖滾樂指標性盛會的「胡斯托音樂節」（The
    Woodstock Festival），更高舉「愛與和平」，進一步催化反戰運動的發展。(A)(B)(D)選項的敘述皆與其時代特徵不符。

    8.題幹敘述中學者的主張，較接近近來史學界提倡之社會史、公眾史或是新文化史，此類研究者的研究目標，一改過去學界較著重於國家、政策、制度史上的研究，而以人民的日常生活、文化等為研究重點。因此較符合的選項為清代臺灣沿海的王爺信仰，故答案選(C)。

    9.清廷早期在臺灣設治的邏輯，主要是以降低統治成本、方便管理為目標，因此清治初期僅於臺灣西南部有設置官廳，也未建築城牆。然而隨著漢人移民的開發腳步，與各地民變的發生，清廷才逐步進行行政區劃、設治、築城政策的調整，因此較符合的選項為(C)。(D)清代官方設廳的目的主要為維持統治穩定與治安，並非為保障原住民族。

    10.從本題題幹中，日軍稱呼懾服者為「蕃人」，且在政治協商後順應清國請求而撤軍等描述，可判斷此份公告應為牡丹社事件後，日清議和所發布之公告，故答案選(A)。(B)日軍占領琉球後並未應清國要求而撤軍。(C)甲午戰爭日軍作戰對象為清軍，因此不可能於布告書中說明「我軍所向，蕃人懾服」。(D)日俄戰爭後日軍亦不可能對東北宣稱「我軍所向，蕃人懾服」。

    11.本題圖表中在臺漢人人口減少的區段自 1683 年始，約於 1700 年達到底端後開始逐年成長；此段人口變化反映鄭氏政權於 1683 年向清帝國投降後，清治初期朝廷將原東寧朝臣、軍隊與其親屬遷回中國本土所造成漢人人口下降的狀況，故答案選(D)。

    12.本題主要測驗學生對荷治時期，荷蘭東印度公司貿易網的理解。17 世紀初期，日本江戶幕府頒布鎖國令，開放荷蘭人僅能於長崎進行貿易，因此荷蘭人僅能將來自魯凱族的商品運往長崎的港口販售；另外，魯凱族的活動範圍位於臺灣南部地區，其與荷蘭人交換的商品以鹿皮為主，由此可知(C)為正確選項。

    13.本題測驗學生對於史料類型與運用的理解。其中「旅券」最能反映人群的移動情形，而日治時期的戶口名簿、同鄉會名簿、人口與戶口調查等資料，則可顯示人群的籍貫、居地、族群類別等資訊，由此可判斷這些史料最可能用來研究人群的移動與交流，故答案選(A)。

    14.1895 年由清、日簽訂的《馬關條約》中，第五款特別註明：「本約批准互換之後，限二年之內，日本准中國讓與地方人民願遷居讓與地方之外者，任使變賣所有產業退去界外，但限滿之後尚未遷徙者酌宜視為日本臣民。」因此自
    1895 年 5 月 8 日條約生效起算兩年，臺籍居民可選擇遷籍離臺或歸日本籍。而這樣的特殊制度，並未於(A)(B)(D)的時間點出現，因此正確選項為(C)。

    15.(A)從題幹敘述中可得知，臺灣於 16、17 世紀政治易主後，被排除於以中國為主的東亞貿易體系外。因此可推斷此「政治易主」指的是鄭氏降清，臺灣納入清帝國版圖後，被限制於東亞航線之外，僅可進行兩岸對渡，因而成為大清帝國的邊陲地區。(B)(D)臺灣並未和中國共同建立朝貢貿易體系，亦未取代琉球的朝貢貿易。

    16.從本題附表中可觀察到，甲族群在人口占比上，一直維持於九成左右，因此可推斷甲族群為漢人；乙族群的人口占比均未超過 1 ％，因此可判斷其為外國人（日治時期的外國人大宗為中國籍的「福廣人」）；丙族群占比逐年下降，而丁族群占比逐年上升，由此可推斷丙應為原住民族，丁為日本人。

    17.本題題文提及 1950 年初，共軍原本欲發兵攻打金門，但年中後即取消攻擊計畫，此轉變乃因該年 6 月 25 日韓戰爆發後，為避免共產勢力進一步擴張，美國總統杜魯門隨即於
    6 月 27 日下令第七艦隊協防臺灣，也迫使中共的攻擊計畫受到阻止，故答案選(C)。

    18.大稻埕於開港通商後，因活絡的茶葉貿易，而聚集許多茶商，並帶動貿易的繁榮，故答案選(D)。(A)從題目中的時間點，可判斷當時臺灣外貿興盛的情形，發生於清末開港通商之後，並非日治時期。(B)當時因清帝國國力不振，因此被迫開港與西方通商。(C)由題目中提及該商品為淡水港出口大宗，及其運銷方式，可判斷這項商品應為茶葉；糖則會在產地附近採收、加工後，再送至商行與港口，且多由南部港口出口。

    19.(A)資料一提及「又欲招約三十名有相當學識、精通國語者，往為事務員」，由此可知當時臺灣前往南洋的移民亦有從事管理工作者。(C)從資料二中可判斷，臺人死亡率高的訊息為謠傳，久原農園進行二次招募的主因為臺人「體力強健，性行純樸，勤勉耐勞」。(D)從二則資料中可得知，婆羅洲與臺灣之氣候雖「不甚懸殊」，但並非促成臺人移民的主因，而是因公司人手缺乏，且臺人勤勉、體力良好，因此成為招募的對象。

    20.資料一的日治時期「理蕃事業」，與資料二中紐西蘭政府透過簽訂條約、把持地價與武力脅迫等方式掌握毛利人的土地等，兩則資料皆為反映國家、政權介入原住民族傳統領域的歷程，故答案選(D)。

    21.從題目中美國政府同時限制出身與德、日兩國相關的移民，甚至進行集中管理與隔離審查等較激進的手段，可以判斷此現象的背景源自二戰期間，美國與軸心國的敵對關係，故答案選(A)。

    22.從圖表中可得知毛利人使用母語的能力於 20 世紀快速的下降，尤其在戰後此現象更為顯著，其可能的原因來自於快速的都市化，許多毛利人離開部落前往都市生活、而以英語系為主流語言的社會與教育體系，造成毛利傳統文化與語言的流失。(A)紐西蘭的主流語言為英語。(B)此趨勢顯現出毛利人在適應社會的過程中造成語言的流失。(C)由此可知不同世代的母語能力落差逐漸擴大。

    23.(A)西進運動雖然標誌著美國作為民族國家的發展歷程，卻也破壞了美國原住民族的傳統社會與文化。(C)「血淚之路」反映當時以白人為核心的「文明」觀念，對不同族群的傳統生活、社會與文化型態的輕蔑與忽視。(D)美國政府制定原住民保留地政策，是為了進一步控制原住民社會，進行集中管理與「文明化」改造，因此並非為了保留完整的原住民生態而創制。

    24.(A)從馬胡塔的案例中，可發現毛利族仍保留其特有的傳統文化。(C)此選項的敘述反映著「白人優越主義」的價值觀，所謂「優雅文明的象徵」，僅限於以歐美白人文化建構的外交禮儀，並未尊重不同族群的文化與價值。(D)批評紋面文化者主要認為紋面為「未開化」的象徵，與幫派無關。

    25.(A)從題幹敘述中可得知，語言巢的設立源自於毛利族的推動而成立，非由政府主導。(B)語言巢的理念重視基礎正規教育對兒童的文化語言影響。(C)從敘述中可知在語言復振的過程中，社區、學校所扮演的教育角色，其重要性並不低於家庭。

    26.題目引文中，可得知當事者與新移民為對立的狀態；且當事者於移民的獨立戰爭中，選擇協助移民者的母國，卻面臨該國於海外的戰爭失利的狀況。由此可判斷當事者應該是在美國獨立戰爭中，協助英軍與移民者作戰的原住民。「我們協助的遠在海外的一方輸掉戰爭」指得是英國皇家海軍被法國海軍所擊敗，因此移民者得以成功建國。美國建國後，更多的新移民來北美洲，拓墾的範圍與速度也逐步擴大，進而壓縮到原住民部落的傳統領域與生活範圍。

    27.(A)法國在七年戰爭失利後，雖然失去北美洲大部分殖民的的統治權，但法裔移民並未因此遷離北美洲，也因此今日加拿大尚有法語區存在。(C)從題幹敘述中可判斷，英國於七年戰爭後取得新殖民地的統治權，但在原住民族的抗爭後，在土地問題與政策上作出調整與讓步。(D)《皇家宣言》是對原住民族抗爭行動中，就土地權作出的政治妥協，並保障原住民族的未轉讓或未出售之土地權益。

    28.(A)從題幹敘述中可得知，美國社會不僅非裔族群，各族群間仍有許多的差異，並未完全融合。(B)美國社會中依然存在歧視亞裔族群的狀況。(C)許多歐裔移民仍保有原鄉的傳統文化，例如義大利裔、法裔或德裔等。

    29.(A)從題目敘述中可得知，英國移民與原住民間雖有衝突，但仍在雙方聯姻期間恢復和平關係。(B)雙方武力衝突的起因為英國移民侵占原住民土地的問題。(D)原住民在與英國移民爆發正面衝突後，才透過聯姻的方式恢復關係。'
