  explanation: 綜合資料一、二，可得知此文字為荷蘭傳教士根據臺南西拉雅族使用之語言，透過羅馬拼音所創造之文字系統，通稱「新港文書」。此文字系統最初是荷蘭傳教士為了傳教用途而創建，其後被泛用於契約文書的使用上，並沿用至清代。(B)荷蘭傳教士屬於基督新教，非舊教耶穌會系統。(C)岸里社文書以漢文書寫。(D)「地區」與「我們」是指南部的西拉雅族。
