- id: doc_111_桃園_武陵_數學_數甲_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設 f（x）為多項式，且 deg（f（x））≥ 3，若 g（x）＝$\int_{0}^{x} t \cdot f ( t )dt$＋$x\int_{x}^{1} f ( t )dt$，則 g''（x）為下列哪一個函數？
  options:
  - label: A
    content: f（x）
  - label: B
    content: －f（x）
  - label: C
    content: xf（x）
  - label: D
    content: －xf（x）
  - label: E
    content: $x^{2}$f（x）
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 'g（x）＝$\int_{0}^{x} t \cdot f ( t )dt$－$x\int_{1}^{x} f ( t )dt$

    g''（x）＝xf（x）－$\int_{1}^{x} f ( t )dt$－x．f（x）

    ＝$-\int_{1}^{x} f ( t )dt$

    g''''（x）＝－f（x）

    故選(B)'
- id: doc_111_桃園_武陵_數學_數甲_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設某一質點在數線上運動，時刻 t 時的速度為 v（t）＝$3t^{2}$＋63（公尺∕秒），則此一質點從時刻 t＝1 秒至時刻 t＝2 秒的位移為多少公尺？
  options:
  - label: A
    content: 30 公尺
  - label: B
    content: 40 公尺
  - label: C
    content: 50 公尺
  - label: D
    content: 60 公尺
  - label: E
    content: 70 公尺
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '所求為$\int_{1}^{2} ( 3t^{2}+ 63 )dt$

    ＝$\left. ( t^{3}+ 63t ) \right| _{1}^{2}$

    ＝（8＋126）－（1＋63）＝70

    故選(E)'
- id: doc_111_桃園_武陵_數學_數甲_g12s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設函數 f（x）＝1－$x^{2}$ 的圖形與直線 x＝0，x＝1 及 x 軸所圍成的區域為 R。將閉區間 [ 0，1 ] 等分成 n 等分，並設上和為 $U_{n}$，下和為 $L_{n}$。試選出正確的選項。
  options:
  - label: A
    content: $U_{6}$＜$U_{3}$
  - label: B
    content: $L_{6}$＜$L_{3}$
  - label: C
    content: $L_{6}$＜$U_{6}$
  - label: D
    content: $\lim_{n \rightarrow \infty} L_{n}$＝$\lim_{n \rightarrow \infty} U_{n}$
    asset:
      key: s2_1_optD
      file: doc_111_桃園_武陵_數學_數甲_g12s1e3/s2_1_optD.png
      crop:
        page: 1
        rect:
        - 459.75
        - 594.35
        - 564.3
        - 698.9
  - label: E
    content: R 的面積為$\frac{2}{3}$
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：當 n 愈大，則 $U_{n}$ 愈小

    (B)╳；當 n 愈大，則 $L_{n}$ 愈大

    (C)○：上和必大於下和

    (D)○：∵y＝f（x）為連續函數

    ∴$\lim_{n \rightarrow \infty} L_{n}$＝$\lim_{n \rightarrow \infty} U_{n}$

    (E)○：R 的面積為$\int_{0}^{1} ( 1-x^{2} )dx$

    ＝$\left. \left( x -\frac{1}{3}x^{3} \right) \right| _{0}^{1}$＝$\left( 1 -\frac{1}{3} \right) - 0$＝$\frac{2}{3}$

    故選(A)(C)(D)(E)'
