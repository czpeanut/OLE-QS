- id: doc_110_桃園_內壢_社會_公民與社會_g10s2e3_s2_49
  section: 2
  number: 49
  type: single
  page: 6
  stem: 就刑罰目的而言，某立委對現行毒品犯罪政策的主要批評為？
  options:
  - label: A
    content: 偏重特別預防，不斷地給予藥癮者自新機會
  - label: B
    content: 採用應報理論，懲罰藥癮者但缺乏積極意義
  - label: C
    content: 傾向一般預防，用重刑嚇阻人民卻毫無作為
  - label: D
    content: 實行綜合理論，處罰預防並重分散防治力量
  group_stem: '◎以下節錄自我國某立委對於毒品犯罪的看法：毒品犯罪的重刑化政策已經實施很多年，可是只看到監所人滿為患，監所人員肩負沉重的戒護壓力，沒有餘力做矯治，更無力協助受刑人回歸社會。司法介入除了把人關起來眼不見為淨外，沒有任何實際效用，還讓這些藥癮者的學業、工作以及原有的社交網絡與正常社會生活被迫中斷，更加深他們復歸社會的困難，最終難以擺脫對毒品的心理依賴，甚至可能因為毒癮衍生犯罪，而變成社會的危險來源。

    因此我提出「施用毒品罪醫療前置化」的修法草案，希望能讓這些單純施用毒品的藥癮者在進入司法程序前，先按時到醫療機構接受藥癮治療的計畫，如果能夠順利完成治療程序，就不用被送入矯正機構而中斷他原本的生活；反之，若無法完成治療程序，仍然要依照現行原有的司法程序，進入矯正機構接受觀察勒戒、強制戒治等司法處遇。'
  tags:
    unit:
      code: CI-2-5-1
      book: 公民與社會2 正義與法治
      chapter: 生活中的刑事保障
      title: 罪刑法定
      std: true
    textbook: 公民與社會2 正義與法治 罪刑法定
    labeled_by: agent
    label_confidence: high
