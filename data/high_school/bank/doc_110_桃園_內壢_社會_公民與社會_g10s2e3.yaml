- id: doc_110_桃園_內壢_社會_公民與社會_g10s2e3_s2_47
  section: 2
  number: 47
  type: single
  page: 6
  stem: 從勞動部的說明可知，基本工資具有下列何種意義？
  options:
  - label: A
    content: 維護勞動市場中自由競爭的機制
  - label: B
    content: 平衡資方與勞方之間的利益分配
  - label: C
    content: 透過公權力保障勞工的勞動條件
  - label: D
    content: 促使企業經營者思考轉型或升級
  group_stem: '◎勞動部召開基本工資審議委員會，決議自2022年1月1日起，每月基本工資調整至25.250元、每小時基本工資調整為168元。勞動部則再次強調，勞雇雙方約定之工資不得低於法定基本工資。

    媒體報導指出，會議過程勞資僵持不下，雙方毫無交集，一度暫停各自帶開小組討論。資方代表認為，近日美中貿易戰已衝擊產業界，基本工資訂得太高反影響勞工就業機會；但勞方代表表示，提高基本工資有助於提升勞工消費力，以及可促使企業思考轉型、升級。'
  tags:
