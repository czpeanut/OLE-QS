- id: doc_110_桃園_內壢_社會_公民與社會_g10s2e3_s2_45
  section: 2
  number: 45
  type: single
  page: 5
  stem: 根據上文，大法官認為《少年事件處理法》中相關規定，並不符合比例原則，其意涵是指下列何者？
  options:
  - label: A
    content: 若只為了暫時保護虞犯少年的安全、並導正其偏差行為，而將少年收容於少年觀護所，目的並不正當
  - label: B
    content: 將虞犯少年收容於少年觀護所，並非保護少年安全及提供教育輔導的唯一手段，尚有其他方式可選擇
  - label: C
    content: 為了維持社會秩序及整體利益，對於經常逃學逃家的虞犯少年進行收容處置，其利益與損害並未失衡
  - label: D
    content: 經常逃學逃家的虞犯少年，因尚未成年，又沒有真正觸犯《刑法》，法院不應對其進行任何保護處置措施
  group_stem: ◎過去《少年事件處理法》規定，關於經常逃學逃家之少年，依其性格及環境。而有觸犯刑罰法律之虞者（以下簡稱虞犯少年），由少年法庭處理之。少年法庭於必要時，對於少年得裁定收容於少年觀護所。針對以上規定是否違憲，大法官作成釋字第664號解釋，認為這些規定的涵蓋範圍過廣、不明確，而且與比例原則不符，應自解釋文公布日起，至遲於屆滿1個月時，失其效力。（2019年6月21日《少年事件處理法》已去除「虞犯」身分標籤，改以「曝險少年」取代之。）
