  section: 1
  number: 10
  type: single
  page: 2
  stem: 少年司法誕生之初，「保護」與「教育」的思潮滿溢，過去的應報思想受到攻擊，在此一時期建立以保護少年為旨的少年法制，儘管日後演變至嚴罰化的趨勢，然而此一保護優先的中心思想基本上較未受質疑，僅保護至何程度不斷產生爭議，立法政策無不在「教」與「罰」之間謀求平衡。關於我國《少年事件處理法》中心思想的演變，以下何者正確？
  options:
  - label: A
    content: 1971年我國初實行《少年事件處理法》時，強調「愛與寬容」引導青少年向善，主張以保護優先主義為核心
  - label: B
    content: 1997年修法時，認為防止青少年犯罪的方法與防止成人犯罪相似，強調刑事制裁的重要性
  - label: C
    content: 現行少年法制的立法宗旨是以調整少年所處的環境及矯治其行為，達到保障少年健全自我成長的目的
  - label: D
    content: 現行少年制裁的執行上為使其融入社會規範，會安排與成人犯同處一室，共同學習
  tags:
    unit:
      code: CI-2-5-3
      book: 公民與社會2 正義與法治
      chapter: 生活中的刑事保障
      title: 少事保護
