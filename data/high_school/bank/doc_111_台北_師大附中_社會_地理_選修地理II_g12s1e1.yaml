  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  explanation: (B)近年來「全球暖化」的名詞漸漸被「氣候變遷」取代，強調氣候的改變，並且不僅僅只有溫度的變化。「全球暖化」或「氣候變遷」名詞出現的初期主要是指「人為活動對氣候的影響」，聯合國政府間氣候變遷委員會（Intergovernmental Panel on Climate Change, IPCC）的 2001 年第 3 次評估報告開始不再侷限於評估人為活動對氣候的影響，氣候自然變化評估也同等重要。而已開發國家透過國際分工導致開發中國家快速工業化，氣候變遷現象在世界各地不斷發生。
