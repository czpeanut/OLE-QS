  stem: '沙黑爾（Sahel）是全球降水相對不穩定、經濟發展較緩的地區，20 世紀以來發生多次糧食危機、恐怖組織的衝突，為人道救援長年關注的地方之一。根據美國氣候才會研究指出，在自然與人為因素的雙重影響下，自 1923 年至 2013 年以來撒哈拉沙漠的面積擴大了約 10％，使沙黑爾地區的沙漠化情形更加嚴重，而沙漠化使其生態、環境更加脆弱。請問：

