  stem: 氣候變遷一詞首度被提出的時間點，與下列哪些事實、現象有關？(甲)已開發國家進入後工業化社會(乙)開發中國家工業化快速推展(丙)全球人均 GDP 持續增長(丁)國際空間分工鏈的形成
