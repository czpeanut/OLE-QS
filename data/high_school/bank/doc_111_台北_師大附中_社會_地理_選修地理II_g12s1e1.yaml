    content: 西北太平洋颱風形成個數增加
  group_stem: 2018 年 5 月時，一個熱帶氣旋─梅庫努，越過了阿拉伯半島南部一處空曠無人的沙漠，因為潮溼的環境，使得蝗蟲在該地快速繁殖。2018 年 10 月另一個熱帶氣旋─魯班，在阿拉伯海中部登陸，而這次的蝗蟲繁殖民力比上一次強 20 倍。後續有 10 多個熱帶氣旋襲繫東非和阿拉伯半島，這些蝗蟲在 2019 年開始越過紅海往西移動，肯亞、厄利垂亞、吉布地、烏干達、坦尚尼都深受其害，最遠還飛越印度洋抵達巴基斯坦和印度西部，使得 2020 年蝗害災情慘重，是東非 70 年來最嚴重的蝗災。右圖為 2020 年的蝗蟲分布與移動狀況，請問：
