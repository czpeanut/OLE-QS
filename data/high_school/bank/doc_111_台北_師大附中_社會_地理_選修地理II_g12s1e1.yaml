    26.此坐標為玉山氣候站附近，海拔高度超過 3,900 公尺，因氣候因高度的垂直分布特性，應較接近高緯區的(C)丙圖：副極地大陸性氣候。

    27.乾旱、野火等最好發的氣候應為(D)丁圖：夏乾冬雨的溫帶地中海型氣候。

    28.丙主要為夏季對流雨，故選(A)。(B)為迎風側的地形雨。(C)(D)為鋒面雨。

    29.甲為開發中國家都市人口，未來仍持續增長；乙為開發中國家鄉村人口，因人口持續往都市移動而下降；丙為已開發國家都市人口，都市發展階段已進入緩慢期；丁為已開發國家鄉村人口，因人口老化而逐漸凋零下降。

    30.(B)開發中國家城鄉間人口移動的原因，主要有(子)都市的拉力（優點）、(卯)鄉村的推力（缺點），此推力尤其來自(巳)城鄉區域發展不均。

    31.(A)開發中國家的鄉村面臨青壯年人口不斷外移，少子化加上高齡化，出生率小於死亡率，故人口將快速下降。

    32.(D)逐漸進入冬季，盛行強勁的東北季風，風浪大。

    33.雅美人的傳統生態知識可維持生態平衡，故選(B)(甲)(丙)(戊)。

