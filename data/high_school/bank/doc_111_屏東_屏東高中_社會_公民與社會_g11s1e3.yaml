  explanation: 健康捐是針對菸害的外部成本而加徵的規費，故與避免高齡者流感傳染造成外部成本而予以免費施打流感疫苗目的相同。(A)性別主流化政策。(B)具有促進學童健康的外部效益。(C)社會福利政策。
