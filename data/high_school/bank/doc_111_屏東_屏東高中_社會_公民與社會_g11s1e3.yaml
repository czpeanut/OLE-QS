- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_48
  section: 1
  number: 48
  type: single
  page: 8
  stem: 阿偉與小萊結婚，兩人未以書面約定財產分配方式，婚前阿偉買了一棟 1,200 萬的房子，並自行付清 400 萬的頭期款，剩下的 800 萬房貸於婚後給付。婚後兩人因價值觀不同，時常爭吵，最終以離婚收場，若阿偉與小萊都沒有其他債務與財產，小萊可分配到多少財產？
  options:
  - label: A
    content: 400 萬元
  - label: B
    content: 600 萬元
  - label: C
    content: 800 萬元
  - label: D
    content: 0 元
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 婚前所購買的房產，在婚後所支付的房貸，推定為夫妻「共有」，也就是夫妻各有一半的權利。房子雖是阿偉在婚前買的，但婚前的 400 萬是阿偉的個人財產，婚後 800 萬的財產為「共有」，故小萊可向阿偉請求 400 萬，選(A)。
