  section: 1
  number: 2
  type: single
  page: 1
  stem: 王先生妻子早已過世，並有兩名女兒，一名兒子。大女兒小文出嫁後生下兩名小孩後過世。王先生的兒子小成不工作又時常不回家，只把年邁的王先生交由妻子（即王先生兒媳）照顧。王先生去世前也經小女兒小寧同意，讓她簽下預先拋棄繼承書後，又立下有效遺囑將其四億元遺產全數由兒子小成繼承。以下敘述何者正確？
  options:
  - label: A
    content: 王先生過世後，小成、小寧、小文的兩名小孩每人將可各分得一億元遺產
  - label: B
    content: 王先生兒媳應為配偶當然繼承人，應可與王先生其餘子女平分先生遺產
  - label: C
    content: 小文結婚後所生的孩子均非姓王，非王先生的直系血親，故不得代位繼承
  - label: D
    content: 《民法》規定拋棄繼承應於知悉得繼承後為之，故預先拋棄繼承聲明無效
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 《民法》第 1174 條第 1 項規定，繼承人得拋棄繼承權，但是繼承於被繼承人死亡時才開始，所以被繼承人死亡之前不發生繼承的情況，更無從預先約定拋棄繼承權，故選(D)。(A)(B)繼承人為小成、小寧、小文的兩名小孩，但小成和小寧各得 1∕3，兩位小孩只能分 1∕6；兒媳非繼承人，故無繼承權。(C)兩位小孩因小文過世，因此可以代位繼承小文的應繼分。
  tags:
