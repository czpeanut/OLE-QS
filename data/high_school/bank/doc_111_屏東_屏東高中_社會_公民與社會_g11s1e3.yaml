  stem: 市場的價格機能是透過供需調整來解決資源配置的問題，亞當史密斯稱此機能為「看不見的手」。請問下列何種政府政策是透過此一機能來解決問題？
  options:
  - label: A
    content: 政府實施國民年金制度來解決人民老年照顧的問題
  - label: B
    content: 政府依據家戶的所得水準作為學生是否免繳學費的依據
  - label: C
    content: 政府利用碳排放權交易方式來解決二氧化碳排放過高的問題
  - label: D
    content: 缺水時政府依據民生用水、農業用水、工業用水的順序來供水
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 碳交易市場，就是將碳排放的權利作為一種資產標的，進行公開交易買賣以控制碳排放總量為目標，故選(C)。(A)(B)(D)是政府來分配資源。
