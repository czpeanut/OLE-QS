  stem: 國健署 2017 年宣布對免稅菸品課徵每包 20 元的健康福利捐，主要目的之一是為了進一步降低菸害帶來的外部性。下列各項針對特定族群的政府政策中，哪一項的政策效果與前述政策最相似？
  options:
  - label: A
    content: 設置不分區立委的婦女保障名額
  - label: B
    content: 每周提供國小學童飲用免費牛奶
  - label: C
    content: 免費提供身心障礙人士復康巴士
  - label: D
    content: 免費提供高齡國民施打流感疫苗
  answer:
