  stem: 衛福部指出，含有過量脂肪、鈉、糖的垃圾食物有害兒童健康，因而訂定《不適合兒童長期食用之食品廣告及促銷管理辦法》，規定這類食物不能在兒童頻道廣告，也不能用贈送玩具的方式促銷。請問上述規定是以何種做法來讓兒童少吃垃圾食物？
  options:
  - label: A
    content: 運用以價制量的方式減少消費
  - label: B
    content: 避免廠商間採取聯合行為促銷
  - label: C
    content: 減少生產者對垃圾食物的供給
  - label: D
    content: 降低消費者偏好，以減少需求
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 衛福部公告「不適合兒童長期食用之食品廣告及促銷管理辦法」，明訂不適合未滿 12 歲兒童長期食用之零食、糖果、飲料、冰品及直接供應飲食之場所之食品及其廣告、促銷限制等，依法規定於 17 ～ 21 時，不得於兒童頻道刊播廣告及不得對兒童以贈送、加購玩具或以玩具為獎勵等方式為促銷，此為限制生產者對此類食物的供給，故選(C)。(A)與價格無關。(B)此為限制廣告，而非聯合行為。(D)此做法不會減少消費者偏好。
