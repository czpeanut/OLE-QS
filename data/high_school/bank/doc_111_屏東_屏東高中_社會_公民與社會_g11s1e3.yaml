  stem: 我國某知名大亨與元配生下子女四人，元配較其早逝，大亨晚年續弦後又生一子，去世前預立遺囑，表示將所有 240 億元的財產都留給續弦所生的兒子一人，引發元配子女不滿，認為父親於死前製作的密封遺囑無效，提起民事訴訟，豪門後代爭產的新聞，成為話題。最後法院宣判遺囑有效。這則熱門新聞，對於尋常百姓而言，不僅是茶餘飯後的家族企業二代爭產的八卦，更有許多不可不知的繼承常識。請問下列說法何者正確？
