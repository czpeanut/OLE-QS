  stem: 「廠商聯手漲價」與「價格跟隨行為造成的同步漲價」的主要差別在於廠商之間有無達成合意的意思聯絡。下列情境中，何者較符合「廠商聯手漲價」的行為描述？
  options:
  - label: A
    content: 牛奶價格上升，某一家大型咖啡連鎖店調漲拿鐵的價格
  - label: B
    content: 紙漿價格上升，衛生紙業者與製紙業者同步調漲產品價格
  - label: C
    content: 人事成本上升，小型速食業者餐點價格漲幅小、大型業者漲幅則較大
  - label: D
    content: 店租成本上升，三、四家 KTV 業者針對全國店面的消費調漲相同價格
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 聯合行為指當同一階段具競爭關係的廠商之間，以契約、協議或其他方式之合意，有共同決定產品或服務的價格、數量等或其他相互約束的行為，而足以對生產、產品交易或服務供需之市場功能產生影響，故選(D)。(A)牛奶與咖啡廠商不具競爭關係。(B)衛生紙與製造紙廠商不具競爭關係。(C)小型業者與大型業者漲幅不同，故未符合「合意」。
