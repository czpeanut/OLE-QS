  stem: 劉富貴事業有成，但後來子女均遠居他國，老婆也跟他離婚。他晚年多病纏身，只能依賴外籍看護小桃照顧，為了感謝小桃，他請律師當見證，立下遺囑將遺產都給小桃。後來劉富貴過世，子女四人回國爭產，請問小桃在法律上最後可以得到多少財產？
  options:
  - label: A
    content: 1∕8
  - label: B
    content: 1∕5
  - label: C
    content: 1∕4
  - label: D
    content: 1∕2
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 子女 4 人為法定繼承人，雖然劉富貴立遺囑將遺產給小桃，但因違反特留分，因此四位子女可請求應繼分 1∕4 的一半，故每人得 1∕8，最後剩下的 1∕2 才是小桃可獲得的遺產，故選(D)。
