  type: single
  page: 1
  stem: 某國只有甲、乙、丙三家電信業者，三家的市占率相差不大。某日甲業者推出為期 7 天的「行動網路吃到飽」降價促銷，引爆搶辦人潮。事情發生後，乙、丙業者的公開反應如下：乙業者：公司內部考慮研擬新的優惠方案，一定會讓客戶物超所值。丙業者：我們仍會專注於確保品質及服務，暫不考慮跟進低價競爭。然而，隨著愈來愈多客戶要求解約以便和甲業者簽約，乙、丙業者緊急在 1 天後推出降價活動，降幅及條件皆比照甲業者。請問根據上述情形，下列哪個推論最為合理？
  options:
  - label: A
    content: 乙、丙業者在同一天降價，屬於廠商間的聯合行為
  - label: B
    content: 甲業者屬於聯合行為中帶頭調整價格的價格領導者
  - label: C
    content: 乙、丙業者出現價格跟隨行為，因此是價格跟隨者
  - label: D
    content: 乙、丙業者跟著甲業者降價，因此屬於價格接受者
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 乙丙價格跟隨的結果，會形成市場上廠商有同時漲價的現象，但不一定代表廠商間有一起說：「好，我們要一起漲跌」的聯合行為，故選(C)。
