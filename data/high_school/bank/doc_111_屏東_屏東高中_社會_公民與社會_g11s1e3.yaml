  stem: 近年來勞工過勞死新聞時有所聞，在責任制的要求下，許多員工超時上班，卻無加班費可領，導致身體不堪負荷。為維護勞動者之權益，《勞動基準法》訂有保護勞動者之相關規定，請問下列敘述何者正確？
  options:
  - label: A
    content: 勞工每日正常工時不能超過 8 小時
  - label: B
    content: 勞工每工作 7 日至少應休息 2 日
  - label: C
    content: 勞工每兩週總工作時數不得超過 88 小時
  - label: D
    content: 工資由資方決定，且不得高於基本工資
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)勞工正常工作時間每日不得超過 8 小時，每週不得超過 40 小時。繼續工作 4 小時，至少應有 30 分鐘之休息。每 7 日中應有 2 日之休息，其中 1 日為例假（此例假為可勞資約定而更動，即不一定為六、日，不可加班），1 日為休息日（可加班）。故選(A)。(D)不得低於基本工資。
  tags:
