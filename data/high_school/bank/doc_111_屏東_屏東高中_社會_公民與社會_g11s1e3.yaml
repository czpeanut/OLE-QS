- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_46
  section: 1
  number: 46
  type: single
  page: 8
  stem: 當政府欲以公權力對市場機制作出限制時，往往會使用制定價格上下限的方式運作。有關此種制定價格限制的方式與後續影響，下列何者正確？
  options:
  - label: A
    content: 會想要制定價格上限，是因為認為均衡價格過高
  - label: B
    content: 會想要制定價格下限，是因為認為均衡價格過高
  - label: C
    content: 只有制定價格上限後，會對社會產生無謂損失，價格下限則不會
  - label: D
    content: 制定價格下限後，市場成交量會少於原先均衡，價格上限則不會
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 為了保障消費者，政府制定價格上限，將價格壓低於均衡價格之下，故選(A)。(B)價格下限是為了保護生產者，將價格提高至均衡價格之上。(C)不論價格上限或下限，都會產生無謂損失。(D)不論價格上限或下限，市場均衡量都會小於原先的均衡量。
