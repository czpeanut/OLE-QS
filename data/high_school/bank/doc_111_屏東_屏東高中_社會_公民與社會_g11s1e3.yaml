- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 8
  stem: 張三原本要進行密封遺囑但是到公證人處，半路不幸死亡，身上遺囑效力為何？
  options:
  - label: A
    content: 無效
  - label: B
    content: 有效
  - label: C
    content: 效力未定
  - label: D
    content: 自書遺囑
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依《民法》第 1192 條規定，密封遺囑指的是遺囑人立完遺囑並簽名後，將遺囑密封並於封縫處簽名後，指定兩個以上見證人，一同向公證人提出此為遺囑。如果沒有按照上述密封遺囑的方式處理，假設在擬定遺囑時有按照自書遺囑程序的話，這份遺囑還是有自書遺囑的效力，故選(D)。
