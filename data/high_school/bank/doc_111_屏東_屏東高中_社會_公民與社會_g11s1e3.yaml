- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 小雅是個單親媽媽，獨立撫養女兒佳佳長大成人。某日佳佳的生父阿榮出現在母女倆面前，表示想與小雅復合、讓佳佳認祖歸宗。在母女倆還在猶豫是否接受阿榮之時，阿榮就因為事故意外死亡。當債主找上門的時候，母女倆才知道阿榮積欠大筆債務。請問下列敘述何者正確？
  options:
  - label: A
    content: 因為阿榮已經承認佳佳是自己的小孩，所以佳佳因準正成了阿榮的婚生子女
  - label: B
    content: 如果佳佳是阿榮唯一的血親，則佳佳和媽媽小雅必須繼承阿榮的債務
  - label: C
    content: 如果佳佳認為無法償還阿榮積欠的債務，可以向法院提出拋棄繼承
  - label: D
    content: 如果佳佳逾期未向法院提出拋棄繼承，則必須以自己的財產償還阿榮的欠債
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)佳佳若是阿榮唯一的血親，仍可以拋棄繼承；小雅與阿榮非配偶關係，故無繼承權，故選(C)。(A)「準正」是指非婚生子女，其生父和生母後來又結婚而言（即所謂「先上車後補票」，與題意不符。(D)《民法》的繼承制度採「限定繼承」，是指以被繼承人生前所遺留下來的財產為限度，去償還其遺留下來的債務，繼承人不必以自己固有的財產幫他們還債；如果遺產清償繼承債務後還有餘額，繼承人還是可以繼承；如果被繼承人的債務有多筆，即為將已知債權按數額，財產依照比例計算分別償還。
