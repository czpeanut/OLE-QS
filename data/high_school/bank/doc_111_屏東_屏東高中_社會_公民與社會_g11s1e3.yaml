  number: 45
  type: single
  page: 8
  stem: 據報載，某市區知名補習街多家「高中全科家教班」的定價，就之前的 11 萬漲到 12 萬元；單科的費用，定價也漲約一成。但業者也擔心家長因漲價而卻步，因此祭出較高的折扣與獎金。另外有業者分析漲價的主因，是受到政府調高最低薪資的影響，由於暑假是招生旺季，業者會聘用許多工讀生，因此人力成本明顯增加。有關上文的敘述，下列哪個選項最可能正確？
  options:
  - label: A
    content: 多家補習班漲價原因必定是想透過「聯合行為」獲利
  - label: B
    content: 業者漲價行為反映成本增加的現象，均衡數量將減少
  - label: C
    content: 若政府要干預業者漲價，訂定價格下限或許會有效果
  - label: D
    content: 政府將最低薪資調高，即是一種調漲價格下限的概念
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 基本工資是一種價格下限，故選(D)。(A)非聯合行為，是反映成本增加。(B)補習班因工讀生的基本工資上漲，故成本上升，因此供給減少；但暑假是補習旺季，因此需求增加，最終均衡價格會上漲，均衡數量無法判斷。(C)政府要壓低補習價格應採價格上限。
