  stem: 英國運輸部科學諮詢委員會於 2020 年 6 月提交報告指出，免費送貨或退貨服務，導致消費者網購量大增，以 2018 年 12 月「黑色星期五」及感恩節長假活動為例，退貨總額高達 24 億英鎊，因此，建議向所有網購消費者強制徵收費用，以緩解網購送貨激增導致的汙染，該建議是帶望透過下列何項方式，解決環境問題？
