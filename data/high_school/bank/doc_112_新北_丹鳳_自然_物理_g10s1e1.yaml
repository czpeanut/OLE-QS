- id: doc_112_新北_丹鳳_自然_物理_g10s1e1_s2_38
  section: 2
  number: 38
  type: multiple
  page: 6
  stem: 已知甲向東行 5 公尺，乙向西行 5 公尺，且兩人皆費時 4 秒，則兩人的哪些物理量相同？
  options:
  - label: A
    content: 位移
  - label: B
    content: 路徑長
  - label: C
    content: 平均速度
  - label: D
    content: 平均速率
  - label: E
    content: 瞬時速度
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)甲、乙位移量值均為 5 公尺，但兩者方向不同，所以兩者位移不同。

    (B)路徑長為純量，甲、乙兩人路徑長均為 5 公尺。

    (C)甲、乙兩人因位移方向不同，因此平均速度也不同。

    (D)甲、乙兩人的路徑長及時間均相同，所以平均速率均為 $\frac{5}{4}$ 公尺∕秒。

    (E)甲、乙兩人的速度方向不同，因此瞬時速度不可能相同。'
