- id: doc_112_新北_丹鳳_自然_物理_g10s1e1_s2_34
  section: 2
  number: 34
  type: multiple
  page: 5
  stem: 下列有關原子結構的敘述，哪些正確？
  options:
  - label: A
    content: 構成原子的質子、中子及電子是目前發現最基本的粒子
  - label: B
    content: 原子的大小主要決定在原子核
  - label: C
    content: 電子可以環繞原子核運行，主要是藉由電子與原子核間的庫侖力
  - label: D
    content: 穩定原子核中，質子數一定大於中子數
  - label: E
    content: 原子的化學性質主要是質子數來決定
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)目前發現最基本的粒子為夸克與電子，質子與中子均由夸克所組成。

    (B)原子的大小主要決定在原子核外電子活動的空間。

    (D)不一定，例如：$_{6}^{12}C$，其質子數與中子數相同，甚至有些原子的中子數大於質子數。'
