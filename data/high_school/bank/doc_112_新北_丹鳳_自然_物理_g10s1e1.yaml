- id: doc_112_新北_丹鳳_自然_物理_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 16 世紀左右，有一位科學家使用全新的科學方法來探討物體之運動。其方法主要是：數學論證、提出假設、設計實驗、檢驗原理，例如提出重物與輕物一起釋放後，必會同時著地，堅持實驗才能提供最清楚正確的事實之理念。依據以上敘述，這位科學家應為下列何者？
  options:
  - label: A
    content: 牛頓
  - label: B
    content: 愛因斯坦
  - label: C
    content: 伽利略
  - label: D
    content: 虎克
  - label: E
    content: 庫侖 【111.全國模考】
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)牛頓提出萬有引力定律。

    (B)愛因斯坦提出相對論、光電效應理論與布朗運動理論。

    (D)虎克提出虎克定律。

    (E)庫侖提出庫侖定律。'
- id: doc_112_新北_丹鳳_自然_物理_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在力學中，使質量 1 公斤的物體，產生 1 公尺∕秒$^{2}$ 之加速度所需的力，稱為 1 牛頓（N）。根據此定義及公式 F＝ma，則 1 牛頓與下列何者相同？
  options:
  - label: A
    content: 1 公斤．秒$^{2}$∕公尺
  - label: B
    content: 1 公斤．公尺∕秒$^{2}$
  - label: C
    content: 1 克．公分∕秒$^{2}$
  - label: D
    content: 1 公斤重
  - label: E
    content: 9.8 公斤．公尺∕秒$^{2}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '根據 F＝ma

    1 牛頓＝1 公斤×1 公尺∕秒$^{2}$＝1 公斤．公尺∕秒$^{2}$'
- id: doc_112_新北_丹鳳_自然_物理_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 中秋連假期間強颱天兔席捲而來，美國 CNN 稱其為今年地表最強風暴，而在中臺灣卻仍可一睹中秋月圓風采，真是何其有幸！氣象學上說颱風為劇烈的熱帶氣旋（低氣壓），受地球偏向力（科氏力）在北半球呈逆時針方向旋入，南半球則為順時針，天兔強颱低氣壓中心離臺灣最近約 910 hPa，若壓力單位用 SI 的基本單位表示可寫為何？
  options:
  - label: A
    content: atm
  - label: B
    content: Pa
  - label: C
    content: N∕$m^{2}$
  - label: D
    content: kg∕$m^{2}$
  - label: E
    content: kg∕（m．$s^{2}$）
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'P＝$\frac{F}{A}$＝$\frac{ma}{A}$

    ∴P 的 SI 單位為 $\frac{kg\cdot m∕s^{2}}{m^{2}}$＝kg∕（m．$s^{2}$）'
- id: doc_112_新北_丹鳳_自然_物理_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 當前熱門的十七世紀科學家牛頓，最早發現萬物間彼此相吸的道理，根據牛頓的重力理論，質量為 $M_{1}$ 與 $M_{2}$ 的兩物體，若相距為 r，其間的引力可以數學式表為 F＝$\frac{GM_{1}M_{2}}{r^{2}}$，G 為重力常數。請問在國際單位制（SI）中，常數 G 的單位為下列哪一項？
  options:
  - label: A
    content: $\frac{m^{2}}{kg^{2}}$
  - label: B
    content: $\frac{m^{3}}{s^{2}}$
  - label: C
    content: $\frac{m^{3}}{kg\cdot s^{2}}$
  - label: D
    content: $\frac{kg}{m^{2}}$
  - label: E
    content: $\frac{kg\cdot s}{m^{3}}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'F＝$\frac{GM_{1}M_{2}}{r^{2}}$，則 G＝$\frac{Fr^{2}}{M_{1}M_{2}}$

    又 F＝ma，則 F 的 SI 單位為 kg．m∕$s^{2}$

    ∴G 的 SI 單位為 $\frac{(kg\cdot m∕s^{2})\cdot m^{2}}{kg^{2}}$＝$\frac{m^{3}}{kg\cdot s^{2}}$'
- id: doc_112_新北_丹鳳_自然_物理_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 下列有關國際單位制（SI）的敘述，何者正確？
  options:
  - label: A
    content: 作為標準單位需具有恆常性
  - label: B
    content: 目前 SI 有五個基本單位
  - label: C
    content: 在力學上最常用的三個基本量為長度、質量及速度
  - label: D
    content: 力為一個基本量，其 SI 單位為牛頓
  - label: E
    content: 電荷單位是藉由質量與電流兩個基本量導出
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) SI 有七個基本單位。

    (C)力學最常用的三個基本量為長度、質量及時間。

    (D)力不是 SI 的基本量。

    (E)根據定義，I＝$\frac{Q}{\Delta t}$ ⇒ Q＝I．Δt

    故電荷單位應由時間與電流兩個基本量導出。'
