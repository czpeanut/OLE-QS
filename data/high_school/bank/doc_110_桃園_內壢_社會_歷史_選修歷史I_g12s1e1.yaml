  stem: '資料：最高行政法院今天（2021/09/16）傍晚發出新聞稿指出，《礦業法》的採礦行爲是影響到原住民族群及傳統文化的典型土地開發行爲，因此立法者在《原住民族基本法》（原基法）中課予義務，國家在礦業權展限決定前，應該與原住民族進行諮商同意的參與程序。法官認為，亞泥公司於1973年取得花蓮縣秀林鄉及新城鄉大理石礦採礦權，1978年獲第一次展限至1997年，1998年又獲第二次展限至2017年，2017年獲第三次展限至2037年，展延處分事前均未踐行《原基法》規定的尊重原住民族意願、平等對待、諮商同意等程序，原住民族只剩下接受決定及繼續開發的事實。法官強調，亞泥上訴意旨雖主張可於展限後補正參與，提供原住民就業、水土保持及生活照顧等，但這充其量只是開發者提出的事後回饋，存乎開發者單方意願，此種事後參與已無濟於事，無異使維繫原住民族及其傳統文化的土地流於私有化及不停止的開發行為，違反《憲法》及《原基法》，因此認定北高行撤銷展期處分判決無違誤，駁回亞泥上訴，原住民勝訴確定(蘋果日報，李奕緯/台北報導，2021/09/16)

    (1)根據資料，本案法官之所以判定原住民勝訴確定，主要原因是認為礦業開採權的延長並未尊重哪一部法規？

    (2)根據資料，上題法規中，特別強調地方開發時，關於原住民必須符合哪些程序？'
