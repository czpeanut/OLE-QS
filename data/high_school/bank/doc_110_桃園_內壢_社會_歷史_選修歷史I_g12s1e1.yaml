  stem: '資料一：2016年8月在某場美式足球比賽開始前的國歌儀式進行時，舊金山49人隊的四分衛科林·卡佩尼克藉由單膝下跪，來反映他對種族不公和警察暴力的抗議。他這個突如其來的舉動登上世界各地媒體頭條，同時引來批評。一直到2020年5月喬治·佛洛伊德死亡事件發生後，支持「Black Lives Matter（黑人的命也是命）」運動的抗議才成了世界各地體育界的一個常態。 資料二：2014年8月9日，18歲的邁克爾·布朗在密蘇里州弗格森市被警方開槍射殺。布朗的死激發了「弗格森騷亂」，以及全美展開關於警察如何對待非裔美國人的辯論，同時也催生了「我舉手，別開槍」的手勢，成為反對警暴的一個象徵。11月29日，阿里亞娜·史密斯這名大學籃球隊成員，得知射殺布朗的嫌犯不起訴後，在賽前國歌響起時，帶著「我舉手，別開槍」的姿勢走進了球場，然後走到美國國旗前跪了下來，並在國歌唱到最後一句時，她躺倒在地上四分半鐘，代表布朗被殺後，屍體躺在街上的那四個半小時。最後，她站起來時，做了「黑人權力」的敬禮手勢——那是在1968年奧運會上湯米·史密斯和約翰·卡洛斯高舉拳頭表達對黑人歧視的抗議行動——然後走出了場館。 資料三：在此之後，陸陸續續還有其他運動選手，藝人及其他族裔以各種行動抗議黑人受到不公待遇的事件。而在2020年5月，佛洛伊德死亡事件發生後，支持「Black Lives Matter」運動的示威抗議，在世界各地以及各項體育賽事當中成為每日常態。 資料四：很多人認為，科林·卡佩尼克是整個「單膝下跪」抗議行動中的代表，因為他的堅持，確保了「Black Lives Matter」運動被帶到主流媒體和公眾意識當中，這些抗議從1968年墨西哥城奧運會領獎臺上的「黑人權利」敬禮式到現在，已經過去五十多年，這場對抗種族不公的戰鬥至今仍在繼續。

    (1)請問這些資料認為，對於種族不公問題的抗議，下列論述何者正確？'
