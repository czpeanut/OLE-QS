  stem: 歐洲某兩國在海外殖民擴張中成為彼此的主要對手，「甲國」掌握著密西西比河以西的新法蘭西，「乙國」則掌握著十三個殖民地，雙方早從十七世紀起就衝突不斷。1754年「甲國」為阻止「乙國」向北美洲西部擴張，在俄亥俄河及密西西比河沿岸修築大量防禦工事，在「乙國」派遣交涉未果下，雙方戰事一觸即發。隨後而來的七年戰爭，更擴大的戰事範圍，最終以「乙國」獲得勝利，而「甲國」撤出北美洲收場。請問根據論述，判斷甲、乙兩國分別為下列者?
