  stem: '資料一：這座被聯合國教科文組織（UNESCO）列入世界遺產（World Heritage）的348公尺高巨岩，之前稱作艾爾斯岩（Ayers Rock)，雖然位於北領地(Northern Territory)艾麗絲泉（Alice Springs）附近的偏遠沙漠地區，仍是最受歡迎的觀光景點。烏魯魯巨岩傳統上的擁有者阿南古人（Anangu），自1985年這片園區回歸原住民控制以來便要求封山。阿南古人認為烏魯魯是祖先走過的路，對他們來說有極大的精神意義。 資料二：位於澳洲中部的烏魯魯，也有「世界肚臍」之稱。數千年來，烏魯魯都是澳洲中部原住民的信仰核心；但當歐洲的白人殖民者，於18世紀末期大批登陸澳洲後，原民的土地慘遭掠奪，就連烏魯魯也失去原本的名字，而被殖民的英國人以南澳洲首相亨利·艾爾斯（Henry Ayers）的名字，冠稱作「艾爾斯岩」（Ayers Rock）。 資料三：對阿南古人來說烏魯魯有如他們的聖殿，先祖造世之後遺留的能量全都留在上頭，因此往來攀爬烏魯魯被視為是打擾能量與先祖記憶的禁忌。1985年起阿南古人便大力爭取禁止攀登令，一直到2017年才獲得通過。阿南古長者佛瑞斯特表示，「你知道的這是一個宗教地點，是一個信仰之地朝拜之地，所以為什麼要（攀登）呢?」 資料四：墨爾本遊客德爾克斯認為，「我不覺得攀登會造成什麼傷害，只要你不要破壞任何東西，只要尊重他們的文化，就只是步行啊，不要破壞任何東西或留任何垃圾在上頭。」來自澳洲阿得雷德市的文恩康布（Sonita Vinecombe）表示，因為禁令即將生效，讓她趕緊來到烏魯魯巨岩。她說：「我們本來沒有計劃這麼快來，但這是最後一天，所以我們來了。」（資料來源，關鍵評論網，https：//www.thenewslens.com/article/126595）

    (1)對當地原住民族而言，烏魯魯具有什麼意義?

    (2)資料中可以看出當地原住民與遊客對於攀登烏魯魯的觀念有何不同?'
