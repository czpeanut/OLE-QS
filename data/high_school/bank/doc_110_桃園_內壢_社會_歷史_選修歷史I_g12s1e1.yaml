  page: 1
  stem: 在美國獨立戰爭後的三十多年間，原住民部落的大片土地被侵占，政府不僅沒有站在原住民部落的角度保護他們，反而用武力侵略和欺騙手段強迫遷移，如切羅基部族。他們聽信白人的承诺，簽下條約離開他們傳統狩獵地，想過上定居安定生活，但因日後新的居住區發現金礦，再次被驅趕。根據前述資料，請判斷下列何者是站在原住民立場書寫的論述？
  options:
  - label: A
    content: 我看到無助的切羅基人被拖出家門，圈在刺刀下的草棚欄裡，在淒風苦雨中，我看到他們像牛羊一樣馱著東西上了四輪運貨馬車開始西行
  - label: B
    content: 如果我們今年殺印第安人殺得多一點，那麼下一年要殺的印第安人就可少一點……反正他們都得殺掉
  - label: C
    content: 如果白人要求得到印第安人的土地，那就不存在上訴的問題，印第安人必須交出來，否則就應無情地把他們碾過粉碎，邊摧毀邊前進
  - label: D
    content: 這些人(印第安人)占據了廣大的土地卻不懂得利用，簡直是暴殄天物，在白人手上更能物盡其用
