  stem: '資料一：「在二次大戰中，墨西哥裔美國人與美國其他已經同化的移民並肩作戰。這些墨西哥裔美國人相信，當戰爭結束，他們為國奮戰必將贏得社會尊敬。……1945～1960年，美國在世界上的經濟霸主地位使大多數美國白人移民的美國夢得以實現，他們擁有了自己的汽車、大型冰箱、存款、政府對子女教育的貸款等。但美國的黑人、亞洲人、墨西哥人卻無權享受這些，他們被關在社會發展的邊緣。」 資料二：「1968年，美國社會爆發奇卡諾學生運動，其領導人曾寫下以下詩篇：『我是喬昆，失落在混亂的世界裡，捲入外國佬社會的漩渦中。被種種規則搞得暈頭轉向，被人嗤之以鼻，被操縱者壓制，被現代社會摧殘。……我是喬昆……在我體內奔流的一部分血液未能被摩爾人征服，我在五百年後戰勝了他們，而且我挺了過來。我的一部分血統在貪婪的歐洲人鐵蹄下，不停地勞作了五百年，我仍健在！在我們國家崎嶇的山脈我堅持下來……講西班牙語的美洲人！奇卡諾人！……我拒絕被同化。我是喬昆。力量懸殊，但我的精神堅強不屈，我的信念牢不可破……。』」

    (1)(甲)推動社會政策以促進族裔平等與融合；(乙)重新定義族群認同以抗拒美國化；(丙)建立自身文化與美國社會的連結；(丁)建構美國為美洲原住民為主的美國。請問資料一的訴求應該符合上述哪一項？資料二的奇卡諾學生運動主要的核心價值符合上述哪一項？（請依序回答）

    (2)綜合兩則資料，資料二「我的一部分血統在貪婪的歐洲人鐵蹄下，不停地勞作了五百年，我仍健在！在我們國家崎嶇的山脈我堅持下來」指的是過去哪一個民族消滅了哪一個國家？（都對才給分）

    (3)綜合上述資料，請簡述奇卡諾運動發生時，該時代歐美有什麼特別的思想（主義）或政治、社會、文化運動？（請舉兩個）'
