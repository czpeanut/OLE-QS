  type: single
  page: 1
  stem: 司法院釋字第552號解釋文指出：「惟婚姻涉及身分關係之變更，攸關公共利益，後婚姻之當事人就前婚姻關係消滅之信賴應有較為嚴格之要求，僅重婚相對人之善意且無過失，尚不足以維持後婚姻之效力，須重婚之雙方當事人均為善意且無過失時，後婚姻之效力始能維持。」這號解釋對釋字第362號解釋：「第三人本於善意且無過失······致後婚姻成為重婚；依信賴保護原則，該後婚姻之效力，仍應予維持」，產生嚴格限縮的作用，除可保障人民對司法之信賴，亦可防堵造成一有多配偶的法律漏洞。請問下列各種說法，何者最符合釋字第552號解釋文意旨？
  options:
  - label: A
    content: 此為違憲審查制度落實《憲法》對一夫一妻制的制度保障
  - label: B
    content: 大法官對法令之違憲審查，常因聲請釋憲的個案而改變
  - label: C
    content: 此解釋成為我國雙婚姻合法化的法源依據
  - label: D
    content: 這是我國傳統婚姻觀影響司法審判與違憲審查的現象
