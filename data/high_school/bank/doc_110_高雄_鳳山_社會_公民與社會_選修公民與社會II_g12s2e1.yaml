  - label: B
    content: 行政訴訟費用，須由原告先行繳納裁判費，待法院作出判決，裁判費則由敗訴的一方負擔
  - label: C
    content: 人民要求政府給付徵收土地補償金的訴訟，需先經過訴願程序之後，再提出給付訴訟
  - label: D
    content: 行政訴訟採三級二審制，包含最高行政法院、高等行政法院以及地方法院「行政訴訟庭」
  - label: E
    content: 給付之訴是指行政機關應作為而不作為導致人民權益受損，而請求課予行政機關作成處分之訴
