  stem: 根據上文，關於臺灣省政府對於「居住平地的平埔族」之認定，以下解讀何者最合理？
  options:
  - label: A
    content: 居住平地的平埔族在戰後都會被登載為山地同胞，歸屬山地鄉的選區
  - label: B
    content: 省政府的人口區分標準，皆是依照實際居住區域，故需進行戶口調查
  - label: C
    content: 居住平地的平埔族被歸為一般平地人，使後來平埔族權利復振更困難
  - label: D
    content: 省政府強制平埔族登記為平地山胞，使平埔族身分認同得以延續至今
  group_stem: '請閱讀以下資料：

    中華民國接收臺灣後，開始進行人口清查。對於「原籍在山地行政區」且本人或尊親屬「在光復前日治時期種族欄登載為高山族」者，稱為山地同胞。但因平地也有「山胞」，所以 1950 年代縣市議員、國大代表選舉等選區劃分時，已出現「山地鄉」及「居住平地的山地同胞」之區分。然而，這使得「居住平地的山地同胞」及「居住平地的平埔族」的認定，產生困難。一開始，普通行政區在製作選民名冊時，曾向省政府請示：「居住平地的平埔族，應視為平地人還是山地同胞？」省政府回應：「居住平地的平埔族應視為平地人，列入平地選民名冊。」後來，省政府又再發布命令，規定平地山胞是「日治時代居住平地，其戶口調查記載為『高山族』」，並要求平地山胞向各地鄉鎮市區公所提出申請登記。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(D)平埔族被視為一般平地人，列入平地選民的選區，使今日平埔族的權利復振較高山族困難。(B)從題文可知人口區分標準，乃為選舉選區劃分，非依實際居住區域。

    30.1950 年代對原住民族的分類，先是依據日本的分類，再按居住地區加以區分，出現認定困難時，又直接以行政命令統一規定，並未實際去考察或研究各地原住民的生活狀況，因此(A)的分析較合理。

    31.造成資料一灣生返日慘況的原因，是因日軍在二次大戰中戰敗，臺灣為國民政府所接收，要求在臺日本人必須遣返，因此答案為(B)。

    32.(A)兩則資料並未看出灣生之間自相競爭的說明。(B)戰後初期的日本人亦缺乏物資，生活並不充裕。(C)灣生回日本後多面對歧視的眼光，但並非只能擔任低賤工作，因此(D)為正解。

    33.資料二可看出早期日人移民臺灣主要是因國內土地不足、經濟不佳，因而響應政府對策，移民臺灣。(A)故鄉受到歧視非原因。

    34.題文中的「他們」擔負起生育、照顧丈夫、侍候公婆等工作，同時要面對跨文化適應的衝擊，可推知應為(B)外籍配偶。

    35.這些外籍配偶被稱為「新住民」，其相關權益的保障為(C)移民署所負責的業務。'
