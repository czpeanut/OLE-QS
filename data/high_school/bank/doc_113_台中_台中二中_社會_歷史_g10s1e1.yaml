  stem: 17 世紀末的某文獻記載，臺灣北部原住民族的居住型態是：「以大木鑿空倒覆為蓋，上下貼茅，撐以林木，兩旁皆通小戶。」按題幹所述，何地最容易找到同種居住型態？
  options:
  - label: A
    content: 印尼
  - label: B
    content: 印度
  - label: C
