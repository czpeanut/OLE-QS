  stem: '以下是三筆對臺灣的紀錄資料：

    資料一： 我主差遣我來此地，為居民傳播福音，此島位於北緯 22 度，周圍有 130 哩，包括許多部落。……居民很野蠻凶暴，男人高又極粗壯，膚色介於黑與棕之間。……被稱為 Inibs 的女祭司影響族人，不敢放棄拜偶像的習俗。

    資料二： 東番夷人不知道從何時就開始居住在澎湖外的海島了。……他們沒有酋長的職位，族人們推舉子女多的人做領導者，並且聽從他的號令。夷人生性勇敢，喜愛戰鬥。凡是門前面懸掛很多骷髏頭的人，就被尊為壯士。

    資料三： 我在 Rahao 社（位置在今新北烏來區）受到眾人熱情款待，喝了幾杯後，就不勝酒力睡著了。結果半夜，一位喝醉的族人持刀闖進來，要殺掉我以示英勇，幸好被頭目發現才沒有成功。但我渾然不知，依舊呼呼大睡。

    根據內容判斷，三筆資料記載發生時間的先後順序為何？'
