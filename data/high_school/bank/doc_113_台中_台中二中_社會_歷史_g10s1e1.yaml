- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '以下有兩段資料：

    資料一：「文獻記載中國官方與臺灣住民的接觸，可以追溯到三國夷州或隋代流求，故可知臺灣與大陸有著極其密切的歷史關係，臺灣自古以來就是中國的領土，居住在臺灣的高山族是祖國民族大家庭的成員。」

    資料二：「在歷史時代，文獻記載中國官方與臺灣住民的接觸，最早的可能可追溯到三國時代，或在隋代。假設文獻記載的島嶼的確指臺灣，這類的接觸也是偶發的、不連續的，數百年難得發生一次，在本質上不是隸屬的關係。我們甚且可以說，正由於有這類的記載，我們可以確定臺灣並非『自古即為中國領土』。」

    試問我們該如何理解這兩段資料？'
  options:
  - label: A
    content: 資料一為歷史事實，資料二則是歷史解釋
  - label: B
    content: 資料一為歷史解釋，資料二則是歷史事實
  - label: C
    content: 學者引用相同史料，可能獲得不同的結論
  - label: D
    content: 兩者引用相同史料，結論不同，當有一誤
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一利用三國與隋代的文獻記載，強調臺灣自古即是中國的領土；資料二同樣以三國與隋代的文獻記載，說明臺灣並非自古即是中國的領土，可知即使引用相同的史料，也可能得到不同的結論，因此(C)為正解。(A)(B)兩則資料皆為歷史解釋。(D)結論不同係因學者的立場不同，並非必有一錯一對。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在臺灣歷史人物裡，鄭成功的歷史地位與評價是很特別的。從清代初期視為「鄭寇」，到後期強調他的忠貞，日治時期著重他的武士道精神，到中華民國強調他反攻大陸的特質，而中華人民共和國稱許他打倒帝國主義等，幾乎多以正面來評價他。請問鄭成功之所以有上述的歷史評價，底下哪個解釋最為合理？
  options:
  - label: A
    content: 學者會因政府政策背景，反映歷史解釋立場
  - label: B
    content: 兩岸學術交流後，認同臺灣學者的觀察角度
  - label: C
    content: 引用西方史學新的觀點，建構新的史觀框架
  - label: D
    content: 在中國發現新史料，得以重新評估他的功過
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 清初因與鄭成功政治立場對立，故視為「鄭寇」，後期為拉攏臺灣人而強調他的忠貞；日本政府亦藉鄭成功的形象提升臺灣人民的認同；臺灣與中國對立時，兩邊政權亦各自強調鄭成功的特殊特質，可見鄭成功的歷史評價常與統治的立場與政策有關，(A)為正解。(B)從題文敘述來看，中國學者與臺灣學者的觀察角度並不相同。(C)從題文敘述判斷，並未建構新的史觀框架。(D)中華人民共和國對鄭成功的稱許，與當時中國對抗帝國主義的思潮有關，並非發現新史料。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在清代，朝廷對原住民的分類共有「生番」、「化番」、「熟番」三種。在實際的分類操作上，依據：「編籍」、「納糧」、「應差」。「生番」三者全無，「熟番」三者皆有，而「化番」則是只有輸餉納糧，無編籍應差，介於「生番」與「熟番」之間。請問根據這段文字，清廷對原住民的區分標準為何？
  options:
  - label: A
    content: 文化差異
  - label: B
    content: 歸順程度
  - label: C
    content: 生活區域
  - label: D
    content: 種族分類
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 清廷對原住民的分類在於編籍（編入戶籍）、納糧（繳稅）與應差（負擔徭役）與否，可知其區分標準與(B)歸順程度有關。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 自 1980 年代起，臺灣各原住民族相繼要求政府承認族群部落的存在與自主性，然而這些正名活動，是否造成相關族群被不適當地分割，學界的討論並沒有形成共識。如 2014 年「拉阿魯哇族」與「卡那卡那富族」兩族，終獲得支持通過正名，這兩族世居於高雄市桃源區以及那瑪夏區，由於傳統領域重疊且物質文化相近，以往是被歸類為哪一族群？
  options:
  - label: A
    content: 鄒族
  - label: B
    content: 邵族
  - label: C
    content: 阿美族
  - label: D
    content: 排灣族
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 拉阿魯哇族與卡那卡富族居於南臺灣高雄山區，過去曾被官方視為(A)鄒族。(B)居於中部的日月潭地區。(C)居於東臺灣。(D)居於屏東山區。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某部族的祭典內容如下：「……此時刺球儀式時的五顆 ljineveljev（揀選出的），第一顆 ljineveljev，代表洗清過去五年內之所有不好的事件，故在安撫人間創傷的心靈及慰問祖靈；第二顆 vusan，代表家族興旺、穀物及獵物豐收；第三顆 qiman，代表福氣；第四顆 tinukuyan，代表所有凶兆、霉運、不吉利或不順，但不可刻意避開，因為如果刺中者善加利用，將可帶來好運；第五顆 kadjuq，其特性不定，總合所有未列之好壞事宜。」請問以上是哪一族知名的祭典內容？
  options:
  - label: A
    content: 卑南族
  - label: B
    content: 達悟族
  - label: C
    content: 魯凱族
  - label: D
    content: 排灣族
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 刺球為(D)排灣族五年祭的重要儀式之一，福球象徵愛情、財富、事業與健康等。
