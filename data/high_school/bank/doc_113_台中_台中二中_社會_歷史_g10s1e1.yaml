- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 清代文人郁永河曾寫作土番竹枝詞，描繪臺灣原住民族的形象。其中有一首詞：「竹弓楛矢赴鹿場，射得鹿來交社商；家家婦子門前盼，飽惟餘瀝是頭腸（只有鹿頭和鹿腸與家人食用）。」請問上述情形的出現與下列何者有關？
  options:
  - label: A
    content: 漢人不斷侵墾導致鹿場減少，使得鹿群減少，捕鹿不易
  - label: B
    content: 原住民族往內山或東部遷徙，尋找捕鹿獵場，逃避社商
  - label: C
    content: 社商包辦番社稅捐，但因需索過多，原住民族所剩無幾
  - label: D
    content: 原住民族以捕鹿彰顯男人能力，多以上繳鹿製產品為榮
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「射得鹿來交社商」一句，可知原住民族生活困苦乃因社商剝削所致，因此答案為(C)。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 西元 1661 年鄭成功攻打臺灣，有一份記載提到：「當時，有的原住民族歡迎鄭成功，甚至追隨漢人對荷蘭人作戰；但也有的與荷蘭人合作，攻擊鄭成功軍隊。」試問我們該如何理解此一情形？
  options:
  - label: A
    content: 此敘述出自漢人，與實際的情況顯然有出入
  - label: B
    content: 原住民族利用雙方衝突之際，恢復大肚王國
  - label: C
    content: 鄭成功以民族大義號召，原住民族紛紛響應
  - label: D
    content: 各部落原住民族之意見紛歧，立場未必一致
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 記載中有的原住民族歡迎鄭成功，有的則與荷蘭人合作，可見當時原住民各部落的立場並不相同，因此答案為(D)。(A)此記載與實際情況應該相符。(B)大肚王國當時仍然存在，談不上「恢復」。(C)部分原住民部落與荷蘭人合作，並非紛紛響應鄭成功的民族大義。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_10
  section: 1
