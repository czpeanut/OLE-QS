    資料三： 1930 年 10 月，泰雅族賽德克霧社群的馬赫坡、荷歌、波亞倫、斯庫、羅多夫、塔羅灣等六部落族人，分隊襲擊附近的警察分駐所、學校、郵政局、日本人官舍等。臺中州廳亦向臺灣總督府請求派兵支援，加上屏東第八飛行連隊飛來山區實施偵察和威嚇飛行。日軍並利用馬赫坡社和他社爭奪獵地的衝突，利誘道澤、太魯閣等社的住民，組成良蕃襲擊隊以協助軍警戰鬥。'
