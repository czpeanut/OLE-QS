- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 關於清治臺灣下的移墾社會特色，以下敘述何者正確？
  options:
  - label: A
    content: 宗族組織從唐山祖走向開臺祖，說明武裝豪強取代地方士紳
  - label: B
    content: 分類械鬥從籍貫型態轉為商貿型態，反映民眾缺乏宗族意識
  - label: C
    content: 官民關係不良，使百姓常組織跨籍貫、跨族群組織對抗政府
  - label: D
    content: 單身男性極多雖然易使社會不穩定，但同時也是開墾的主力
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)移墾社會的宗族組織以唐山祖為主，地方領導人士多為武裝豪強。(B)分類械鬥從地緣性轉為多元型態，其中亦有姓氏械鬥，顯見並非缺乏宗族意識。(C)吏治不良造成百姓抗官事件頻傳，仍多為相同籍貫、族群的組織團體。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 《臺灣日日新報》於〈番婦墜溪行蹤不明〉報導一名泰雅少女莎韻，為了幫她的恩師田北搬運行李，不慎在途經南溪時從原木橋下滑，從此行蹤不明。統治者為表揚其奉獻義行，特頒贈桃型「愛國少女莎韻之鐘」，以茲紀念。請問上述題幹所述最早可能在哪個年代出現？
  options:
  - label: A
    content: 1890 年代
  - label: B
    content: 1940 年代
  - label: C
    content: 1960 年代
  - label: D
    content: 1990 年代
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「莎韻之鐘」發生於 1938 年，經刻意報導宣傳後，成為總督府宣揚在臺理蕃政策成效的最佳樣本，也是皇民化運動時期的重點教材，因此答案為(B) 1940 年代。
- id: doc_113_台中_台中二中_社會_歷史_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 根據《馬關條約》內容，該條約生效後兩年內臺人可自由選擇是否離臺，且攜帶之財產不需納稅；期限滿後而未離開者即自動成為日本國民。而期限結束後僅六千多人離開，又以士紳、商人占多數，試問這類人離開的主要原因為何？
  options:
  - label: A
    content: 在中國有功名或者田產，離臺後不至一無所有
  - label: B
    content: 平時作威作福，擔心政權交接混亂時遭到報復
  - label: C
    content: 返回中國後積極準備，靜待適當時機發動反攻
  - label: D
    content: 皆為強烈國家意識者，離臺拒絕成為日本臣民
  answer:
  - A
