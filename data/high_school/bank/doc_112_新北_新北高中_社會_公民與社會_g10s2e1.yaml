  explanation: (A)不一定，端看何者對於個人的拘束力較強。(B)法治社會強調外在控制中法律具強制力的特性，以約束不符合社會規範的行為，因此其效果較內在控制強。(C)不一定，端看何者對於個人的拘束力較強，拘束力強的社會控制對當事人而言，可能較為嚴厲。
