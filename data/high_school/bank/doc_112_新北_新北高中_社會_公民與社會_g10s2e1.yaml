  section: 1
  number: 1
  type: single
  page: 1
  stem: 現在不少年輕人抱持單身主義，不想結婚也不想生育，但有些長者仍抱持著「男大當婚，女大當嫁」、「結婚生子是人生必經歷程」的觀念。因此，逢年過節的家庭團聚，常會上演長輩對年輕人逼婚、逼生的世代衝突戲碼。上述現象所反映的社會控制意義與影響，該如何解讀最為恰當？
  options:
  - label: A
    content: 長輩試圖透過外在正式的社會控制，來達成逼婚、逼生的目的
  - label: B
    content: 長輩行為是透過對年輕人施加壓力，屬外在非正式的社會控制
  - label: C
    content: 長輩逼婚、逼生的行為，會使年輕人產生罪惡感而有具體成效
  - label: D
    content: 透過社會化的過程，長輩觀念已轉化為年輕人的內在社會控制
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)道德習俗屬於非正式的社會控制。(C)逼婚、逼生的行為不會使年輕人產生罪惡感，反倒會讓年輕人覺得反感，形成反效果。(D)從兩代間的衝突來看，長輩的觀念並無讓年輕人轉化為內在的社會控制。
