  stem: 過去我國關於婚姻與家庭制度僅保障異性戀婚姻及異性戀者共同收養子女，2019 年通過《司法院釋字第 748 號解釋施行法》使同性婚姻合法化，2023 年更進一步修正該法，明定同性配偶家庭可以共同收養子女。從社會規範的改變來看，下列哪種原因是促使我國婚姻與家庭制度改變的主因？
