  stem: 立法院於 2023 年 1 月三讀修正《菸害防制法》部分條文，修法重點包含未滿 20 歲不得吸煙、對加熱菸及其載具納管等，臺灣拒菸聯盟認為修法結果與人民期待仍有落差，下列何者可能為臺灣拒菸聯盟的作為？
  options:
  - label: A
    content: 自行向立法院再度提出新的「《菸害防制法》修正草案」
  - label: B
    content: 自行向立委請願，促使立委針對《菸害防制法》提出覆議
  - label: C
    content: 提案與連署《菸害防制法》相關立法原則，要求辦理公投
  - label: D
    content: 向總統陳情，透過總統向立法院提出新的修正草案
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)人民團體並無法律的提案權。(B)立委無法提出覆議，覆議權的行使歸屬行政院，即行政院對於立法決議之法律案、預算案、條約案，若行政院認為窒礙難行時，可經總統核可後，於該決議案送達行政院 10 日內，移請立法院覆議。(C)人民可透過公民投票表達人民的意志，且只要非與預算、租稅、薪俸，以及人事事項相關，則此事項為該團體可從事的方法，為正解。(D)總統僅能就國家安全事項提防禦性公投。
