  stem: 立法院於三讀通過《電子支付機構管理條例》後，表示感謝提出修法草案的金管會對於立法院之支持協助，並說明本條例之修正，將原本「電子支付」、「電子票證」二元化管理的法制統合為一，增加民眾支付的便利性，可為我國電子化支付及行動支付營造良好發展環境，加速普惠金融的推動，是我國儲值支付工具發展的重大里程碑。關於行動支付相關法規的性質，下列敘述何者最為符合我國法律規範？
  options:
  - label: A
    content: 《民法》的法律位階較《電子支付機構管理條例》為高，因此優先適用《民法》
  - label: B
    content: 因《銀行法》為範圍較廣的實體法，比《電子支付機構管理條例》優先適用
  - label: C
    content: 基於特別法優於普通法原則，《電子支付機構管理條例》優於《民法》適用
  - label: D
    content: 《電子支付機構管理條例》規範行動支付平臺及交易的過程，屬程序法
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)《民法》與《電子支付機構管理條例》皆為法律位階，但後者為特別法，故以特別法為優先。(B)《銀行法》與《電子支付機構管理條例》皆為實體法。(D)《電子支付機構管理條例》的目的為促進電子支付機構健全經營及發展，以提供安全便利之資金移轉服務，並保障消費者權益，屬於實體法。
