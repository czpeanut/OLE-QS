  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 要因應社會變遷，使《憲法》可適用於當時的社會情境，可使用的方法有：修法或制定法律、經憲法法庭判決；而我國的立法機關（立法院）即為經人民選出之民意代表掌理立法權，因此由立法院制定法律的做法最完備，故選(A)。(B)命令位階較法律為低。(C)(D)非處理法律制度不完備的常見做法。
