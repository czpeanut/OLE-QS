  stem: 有些夫妻希望共同生活，為了不區分彼此，夫妻財產制選擇共同財產制。在共同財產制下，雙方帶入婚姻生活的財產，以及婚後產生的財產，原則上皆合併為共同財產，共同使用管理。但有一些「特有財產」不用合併，而由其中一方單獨管理。下列項目中，哪些屬於共同財產制下的特有財產？(甲)結婚後丈夫購入的電視(乙)丈夫選購的客廳桌子(丙)丈夫使用的髮型定型液(丁)烘焙師妻子工作用的烤箱(戊)夫妻上班一起共乘的汽車
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (丙)(丁)
  - label: C
    content: (丁)(戊)
  - label: D
    content: (乙)(丙)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《民法》第 1031-1 條：「特有財產：一、專供夫或妻個人使用之物。二、夫或妻職業上必需之物。三、夫或妻所受之贈物，經贈與人以書面聲明為其特有財產者。」因此，(丙)丈夫使用的髮型定型液及(丁)烘焙師妻子工作用的烤箱屬於特有財產，故選(B)。
