  section: 2
  number: 47
  type: multiple
  page: 8
  stem: 由於人是群居的動物，而每個人的想法、習慣、好惡等都不盡相同，為了減少摩擦衝突，就需要有社會規範來約束彼此。關於社會規範之敘述，何者正確?
  options:
  - label: A
    content: 社會規範是由全體社會成員認可並且遵守的行為準則
  - label: B
    content: 社會規範有其不變性，較不會隨時空環境而有所不同
  - label: C
    content: 社會規範可以維持社會秩序，但也可能對某些人不利
  - label: D
    content: 倫理道德也是重要的社會規範，例如公車上的博愛座
  - label: E
    content: 法律是有強制力的規範，例如我國捷運手扶梯靠右站
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)社會規範未必是由全體社會成員所認可。(B)社會規範並非是一成不變的，會因時空而轉變。(E)手扶梯靠右站僅為習慣，並未訂定法律規範。
