  stem: 因為時空環境的演變，《憲法》條文的原則性或抽象性規定，可能會出現保障人民權利不足之情形。以我國為例，為彌補《憲法》保障之不足，在未修憲的前提下，除經由大法官憲法法庭判決（解釋）以外，尚可經由下列哪個途徑來彌補屬最完備？
