  answer_status: verified
  answer_source: answer_key
  explanation: 原本我國法規僅有異性戀可結婚，2019 年通過《司法院釋字第 748 號解釋施行法》使同性婚姻合法化，之後進一步修法讓同性配偶可共同收養子女，讓同性戀者可以獲得婚姻自由及平等的權利外，也有更實質的權益，而此原因即為(D)人權價值觀念提升。
