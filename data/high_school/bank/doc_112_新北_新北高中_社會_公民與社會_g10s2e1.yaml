  stem: 社會規範的功能之一是社會控制（social control），而社會控制是社會對其成員的行為進行指導、制裁和約束。又可分為外在控制與內在控制。前者是要求社會成員必須接受控制者提出的行為模式，一旦違反可能受到權力的嚴厲懲處；後者是社會或組織成員用內化的價值規範約束和指導自己行為的過程，也就是社會成員自我願意遵守。比較社會規範中的「外在控制」與「內在控制」的意涵與效果，下列哪一個選項正確？
  options:
