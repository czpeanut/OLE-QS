  section: 1
  number: 10
  type: single
  page: 2
  stem: 我國《民法》對於子女姓氏應從父姓或母姓的規定，歷經數次修正，由原先「子女應從父姓」，改成可以由父母書面約定子女姓氏。但目前依據內政部調查顯示，絕大多數的子女仍以從父姓為主。下列哪一個論點最能用來說明此一現象？
  options:
  - label: A
    content: 法律未強制子女從父姓，係因社會習慣與法律具有一致性
  - label: B
    content: 因習慣法的效力優先於法律規定，故此現象合乎法律要求
  - label: C
    content: 社會大多數人重視家庭倫理，認為家庭是社會規範的基礎
  - label: D
    content: 社會傳統風俗習慣形塑了人們的行為，其影響比法律更強
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)我國目前社會上對於子女姓氏仍習慣從父姓，但《民法》已規定從父姓或母姓皆可，可見社會習慣和法律兩者並不具有一致性。(B)應是法律規定優於習慣法。(C)從父姓應為傳統風俗，與重視家庭倫理無關。(D)即使法律規定可從父姓或母性，但傳統社會觀念裡仍從父姓居多，可見傳統風俗的影響比法律更強，為正解。
