  stem: 美國皮尤研究中心（Pew Research Center）2023 年 3 月公布一份美國收入調查報告。調查結果顯示，儘管近年性別平等意識抬頭，但 2022 年美國女性的平均收入僅為男性的 82 ％，男、女性的收入差距在這 20 年來幾乎沒有縮小。請問此調查結果最可能反映出美國職場中存在哪種現象？
  options:
  - label: A
    content: 性別多元化
  - label: B
    content: 性別主流化
  - label: C
    content: 玻璃天花板
  - label: D
    content: 性別職業區隔
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文可看出美國男女性所得收入不平等的現象，此為同工不同酬的具體情形。(A)性別多元化為代表人類的社會性別特徵，性取向和性別認同的所有多元性，而不需要詳細說明或列舉形成這種多元性的每個個體、行為或特徵。(B)性別主流化是一種策略，也是一種價值，希望所有政府的計畫與法律要具有性別觀點，並在作成決策之前，對男性和女性的可能影響進行分析，以促使政府資源配置確保不同性別平等獲取享有參與社會、公共事務及資源取得之機會，最終達到實質性別平等。(C)玻璃天花板指在公司、企業和機關、團體中對某些群體（如女性、少數族裔）晉升到高級職位或決策層的潛在限制或障礙，因此會導致女性的薪資較低，與題文的現象最相似，為正解。(D)性別職業區隔為不同性別的勞動者分別集中在不同職業的現象，其原因並非男女天生差異所導致，而是社會制度及政策形塑的結果。
