  stem: 現年 21 歲的巧虎，父母在十年前早已離婚，不負責任的父親在離婚後即不知去向，巧虎在母親含辛茹苦的養育之下長大成人，母親已於去年過世。本月初，巧虎突然獲知其父親已經去世一個月的消息，並得知他自己在父親死後繼承了 500 萬的遺產和 1,000 萬的債務。依據現行《民法》的觀點，巧虎一定要還清這 1,000 萬嗎？
