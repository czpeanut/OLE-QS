  stem: '小安研究某國財產制度，蒐集該國某年遺產繼承統計資料（附表）。她推論造成男女數據差異的成因，除與該國傳統社會觀念有關外，與其《民法》繼承法律的規定亦有關聯。下列該國繼承制度所採取的原理原則，何者與表中數據所呈現之性別差異最為相關？

