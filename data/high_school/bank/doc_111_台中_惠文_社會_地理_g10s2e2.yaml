  stem: 2022 年新冠疫情持續燒，4 月底臺北農產運銷公司（以下簡稱北農）因確診數持續飆升，市場員工接近四成確診，使全臺的果菜運銷大受影響。北農承銷人感受到拍賣人力吃緊，並希望北農能澈底清消，以免疫情擴大影響買氣，遂要求各產地端減少供應蔬果或是轉運至附近的新北果菜運銷市場，但北農一天交易量就高達一千多公噸，新北的板橋、三重市場在過年高峰期加起來一天也才八百公噸，實在難以消化。雲林斗南農會表示：「農產品的特性就現採現賣，不能存放太久。」雲林縣光是絲瓜、竹筍年產值就高達一億，八成都是透過共同運銷的方式送往北農拍賣，「不是不願意到屏東、高雄或臺中等量體較小的拍賣市場，但數十年以來，北農就是品項多、量多，多數承銷人也都集中在北農，這是整體人口結構不均導致的問題。」依據上文所示，下列關於臺灣果菜運銷市場的推測，何者正確？
  options:
  - label: A
    content: 雲林縣農會是北農最大蔬果供應來源
  - label: B
    content: 可用區位租來解釋臺灣蔬果市場分布
  - label: C
    content: 北農蔬果拍賣的市場範圍全臺灣最大
  - label: D
    content: 新北市場的蔬果拍賣價格較北農為低
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中提及「不是不願意到屏東、高雄……，但數十年來，北農就是品項多、量多，多數承銷人也都集中在北農……，這是整體人口結構不均的問題」，可知北農的銷售量最大，故選(C)。
