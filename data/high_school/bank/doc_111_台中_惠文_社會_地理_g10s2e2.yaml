- id: doc_111_台中_惠文_社會_地理_g10s2e2_s2_4
  section: 2
  number: 4
  type: calc
  page: 11
  stem: '東南水泥拆遷之前，該地水泥產業的區位條件改變，但水泥工廠仍持續經營，最符合哪個產業相關概念？請在表格中勾選相關運用概念，並依據資料一說明判斷的理由。（各 3 分）

    | 運用概念（請勾選一項） | 判斷依據（40 字以內） |

    | --- | --- |

    | □區位移轉 □工業慣性 □產業群聚 □產業升級 |  |'
  group_stem: '閱讀以下資料並回答問題：

    資料一：隨著臺灣經濟建設發展，水泥需求大增，自 1956 年起，半屏山東南側便陸續設立東南、正泰、建台 3 家水泥公司，3 廠合占臺灣年產量 1 ～ 2 成。1984 年經濟部以臺灣西部的礦藏開採殆盡、人民環保意識抬頭為由，推動「水泥業東移計畫」政策。1997 年半屏山採礦權終止，水泥遂尋求其他原料來源及轉型發展，例如：東南水泥改向菲律賓進口石灰石繼續生產，並轉型熟料研磨營運，降低周遭環境汙染。

    資料二：半屏山的採購過程屢屢發生工安事件，尤以 1961 年的崩坍事故最為嚴重。半屏山地層約向東南傾斜 30 ～ 35 度，該年東南水泥開挖坡腳引發大規模崩坍，除造成傷亡外，也將位於山腳與水泥廠間的縱貫鐵路掩埋約 1 公里。此後，鐵路便移至水泥廠東側。下圖為重建後的縱貫公路與水泥分布圖。

    資料三：2022 年清明連假前夕，東南水泥儲槽因施工拆除不慎，壓毀高壓電線，導致臺鐵及高鐵交通斷電，列車被迫停駛，影響旅客返鄉。其實，水泥廠的拆遷是重建與美化高雄門戶計畫的一環。市政府重新規劃半屏山周邊的土地利用，將水泥廠區、中油高雄煉油廠（台積電預定地）等，規劃為科技產業園區、商業區及住宅區，更大量植栽串連半屏山、蓮池潭及周邊溼地，打造成為北高雄的生態綠廊。'
  shared_asset: g2_4_5
  answer:
  - ✓工業慣性；改向菲律賓進口石灰石繼續生產，並轉型熟料研磨營運
  answer_status: verified
  answer_source: answer_key
  explanation: 工業慣性是指工廠的原區位優勢喪失，但仍不輕易遷移，由文中改向菲律賓進口石灰石繼續生產，並轉型熟料研磨營運。
