  page: 8
  stem: 從上文判斷，右圖中的哪些農業類型與嘉吉（Cargill）相關？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丁戊己
  - label: D
    content: 甲戊己
  group_stem: '2010 年 5 月 19 日，英國《金融時報》做了一篇專題報導，並搭配英式早餐照片，提及：「紅豬肉到鹽、砂糖、可可、棉布等，都是這家美國企業所供給的產品，已經把我們餐桌上所有東西全包了」。而這家企業就是嘉吉（Cargill），是全球最大的非上市企業，全球第三大肉品加工企業，製造培根、香腸與煎蛋等料理的原料。該公司更是全球最大穀物貿易商，掌握全球大部分用來製造麵包的小麥，以及製造乳瑪琳等的油料作物，全球米貿易同樣由該公司掌控。

    嘉吉旗下也有全球第二大家畜飼料品牌，如果失去該公司提供的穀物、飼料與油料作物，恐怕全球的酪農業都要停擺。不僅如此，該公司旗下化學肥料子公司「美盛」（The Mosaic Company）排名全球第三大，專門提供番茄與香菇等栽培所需之化學肥料。就連餐桌上使用的調味料與鹽，嘉吉產品也充斥市場。嘉吉亦為巴西最大柳橙果汁加工與出口企業，乃至於製造塑膠杯的工廠，其原料大豆與玉米，都是由嘉吉一手包辦。此外，嘉吉還是可可豆（可可與巧克力的原料）及砂糖的全球最大貿易與加工企業，就連餐桌上的杯墊與餐巾原料棉，嘉吉同樣掌握全球第二大交易量。（資料來源：桝潟俊子等編，蕭志強等譯，《食農社會學：從生命與地方的角度出發》，臺北：開學文化，2016 年）請問：'
