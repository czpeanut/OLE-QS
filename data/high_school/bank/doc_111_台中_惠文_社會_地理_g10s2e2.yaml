  stem: 加盟連鎖（Franchsing），指由許多個別店鋪經營者透過總部的指導，經營相同品牌連鎖店的一種商業模式。透過這樣的經營方式，個別經營者可以迅速取得經營的知識，減少自我學習的時間，而且通常能獲得總部提供統一規格的原物料，使源頭供應無虞；企業總部也可以藉此方式，無需投入較高資金開設直營分店，但又能快速擴張經營版圖、搶占市場。在經營模式上，企業總部將自己所擁有的商標（包括服務商標）、商號、產品、專利和專有技術、經營模式等以加盟連鎖契約的形式授予加盟者使用，同時對加盟店的營運有一定的指導權；加盟者則需要按契約規定，在總部統一的業務模式下從事經營活動，並向特許者支付相應的費用。上述模式對「加盟者」而言，透過加盟連鎖可以獲得下列何種效益？
  options:
  - label: A
    content: 聚集經濟
  - label: B
    content: 規模經濟
  - label: C
    content: 生產規格化
  - label: D
    content: 生產標準化
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)連鎖加盟店藉由眾多分店創造規模經濟。
