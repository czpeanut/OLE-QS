  section: 1
  number: 23
  type: single
  page: 8
  stem: 報導二中的併購策略，為生產組織進行何項調整？
  options:
  - label: A
    content: 水平分工
  - label: B
    content: 垂直分工
  - label: C
    content: 水平整合
  - label: D
    content: 垂直整合
  group_stem: '從精品包至平價購物袋，包袋為日常重要配件，來自臺灣的包袋代工龍頭──威宏，為目前全球前三大包裝代工公司。以下為該公司相關報導，請問：

    報導一：威宏從運動手套、護膝、腳架型高爾夫球袋等「冷門產品」起家，以少量多樣的策略避開與大廠搶單，生產上也較其他大廠更彈性。由於品項多、數量少，威宏得靠精準的管理才能握緊手中的訂單。

    報導二：當威宏在代工界站穩腳步，接下來要能在技術與客戶上快速擴張，靠的是併購策略。2017 年威宏收購泰國 TWT 公司，不僅順利在泰國插旗，也一腳踏入行李箱市場，更接下 TWT 既有客戶 TUMI 的訂單，成功切入輕奢品牌。2020 年威宏再收購德禦越南公司，其主要客戶包括 Nike、TaylorMade、PUMA，藉此拿下更多國際一線品牌的訂單。

    報導三：過去，威宏只有中國單一生產據點，南移後布局泰國、越南與柬埔寨，如何精準管理調控產能，成為一大挑戰。「現在要把一個袋子從中國生產，改到越南或柬埔寨來做，就會面臨到轉接的過程。威宏董事長洪永裕進一步解釋說，包括物料、生產到出貨的管理都要仰賴系統，才不會需要那麼多的腦力跟人力去鋪排它的生產線。威宏在疫情期間，大動作將旗下各事業體都建置 ERP（企業資源規劃）系統，節省作業上的溝通成本，建立公司內部的「生產模組化」。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 併購相同類型的工廠即為水平整合，故選(C)。
