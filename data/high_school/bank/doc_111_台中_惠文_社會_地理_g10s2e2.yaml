  - label: B
    content: 產品規格化
  - label: C
    content: 聚集經濟
  - label: D
    content: 生產專業化
  group_stem: '以下是一段 18 世紀關於蔗糖生產過程的描述：

    榨汁坊裡的步調是如此緊湊，而煮沸房為了煮沸需要不斷燃燒乾甘蔗或「甘蔗廢渣」，上述動作雖然很單純，卻仍讓人精疲力竭。一名法國作家用「令人驚奇」來描述自己看到驢子為了拉動榨汁機而全力奔跑的景象。但「更令人驚奇」的是見到顧火爐的工人如何分毫不停歇地快速添注甘蔗廢渣到火焰裡，確保大火總是維持在最旺的狀態。那些負責將甘蔗放進榨汁機的人，手指很有可能會被機器夾住，尤其他們疲倦或昏昏欲睡時，若手指被夾住，經常會導致整個手臂被機器捲進去，因此旁邊總會隨時備著一把便短斧。這同時也解釋了為什麼有這麼多守衛是殘疾人士，被分派去負責煮沸的黑人，其工作內容雖然沒那麼精細，卻更加沉重。在工作期間，他們必須赤腳站在石頭或堅硬的地板上，沒有椅子，更從來不能休息，因此他們常常會出現腿部方面的疾病。而懸吊在桿子上、將蔗糖從一個大鍋轉移到另一個大鍋的長勺，「本身就極為沉重」，加上負責拉的工人站在相當高的地方，因此他們必須使勁將其升高或擺盪。請問：'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 每個工人專責一件事務，屬於專業分工，故選(D)。
