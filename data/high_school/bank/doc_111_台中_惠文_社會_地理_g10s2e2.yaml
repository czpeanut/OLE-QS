  group_stem: '臺灣第一個公告的都市計畫是日治時期 1900 年 1 月公布的「臺中市區設計圖制定」，而後陸續推出市區改正與臺灣都市計畫令，可說是臺灣都市規劃的始祖。除了當時的行政中心臺北城之外，臺中州的都市計畫也如火如荼的進行，配合臺中驛（臺中火車站）的興建並在現今的中區建設出棋盤狀結構的都市中心。然而戰後臺中的發展迅速早已突破日治時期的發展框架，以臺中火車站為中心向西北方延伸出多條主要幹道，搭配一圈一圈的外環道路，臺中成為了臺灣最具代表性的放射狀都市。

