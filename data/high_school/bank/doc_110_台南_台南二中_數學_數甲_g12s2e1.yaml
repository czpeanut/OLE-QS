  stem: 設 a 是實數，若複數$\frac{3 +ai}{2 +i}$的實部與虛部相等，則 a＝＿＿＿＿。
  explanation: '∵$\frac{3 +ai}{2 +i}$＝$\frac{3 +ai}{2 +i}\times \frac{2 -i}{2 -i}$＝$\frac{6 - 3i + 2ai -ai^{2}}{2^{2}-i^{2}}$＝$\frac{a + 6}{5}+\frac{2a - 3}{5}i$

    ∵實部與虛部相等

    ∴$\frac{a + 6}{5}$＝$\frac{2a - 3}{5}\Rightarrow$a＋6＝2a－3$\Rightarrow$a＝9'
