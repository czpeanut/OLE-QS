  stem: 已知將函數 y＝f（x）與 x 軸及 x＝1 所圍成的區域，繞 x 軸旋轉一圈所得的旋轉體體積為 S。請選出使得 S＞$\frac{\pi}{7}$的函數 f（x）。
  options:
  - label: A
    content: f（x）＝$\sqrt{x}$
  - label: B
    content: f（x）＝x
  - label: C
    content: f（x）＝$x^{2}$
  - label: D
    content: f（x）＝$x^{3}$
  - label: E
    content: f（x）＝$x^{4}$
- id: doc_110_台南_台南二中_數學_數甲_g12s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 已知 a，b 為複數，i＝$\sqrt{- 1}$，下列哪些敘述正確？
  options:
  - label: A
    content: $\sqrt{- 2}\times \sqrt{- 3}\times \sqrt{-\frac{1}{8}}\times \sqrt{12} +\frac{\sqrt{125}}{\sqrt{- 5}}= 2i$
  - label: B
    content: i＋$i^{2}$＋$i^{3}$＋……＋$i^{111}$＝－1
  - label: C
    content: 若 $a^{2}$＜0，則$a + \overline{a} = 0$
  - label: D
    content: 若｜a｜＞｜b｜，則 $a^{2}$＞$b^{2}$
  - label: E
    content: 若 $a^{2}$＞$b^{2}$，則｜a｜＞｜b｜
  explanation: '(A)╳：$\sqrt{- 2}\times \sqrt{- 3}\times \sqrt{-\frac{1}{8}}\times \sqrt{12} +\frac{\sqrt{125}}{\sqrt{- 5}}$＝$(\sqrt{2}i)\times (\sqrt{3}i)\times \frac{i}{2\sqrt{2}}\times 2\sqrt{3} +\frac{5\sqrt{5}}{\sqrt{5}i}$

    ＝$3i^{3}+\frac{5}{i}\times \frac{i}{i}$＝－3i－5i＝－8i

    (B)○：i＋$i^{2}$＋……＋$i^{111}$＝$\frac{i (1 -i^{111})}{1 -i}$＝$\frac{i 〔1 -(-i)〕}{1 -i}$

    ＝$\frac{i (1 +i)}{1 -i}$＝$\frac{- 1 +i}{1 -i}$＝－1

    (C)○：∵a 為複數，又 $a^{2}$＜0

    ∴a 必為純虛數，令 a＝ki，k≠0

    ∴$a + \overline{a}$＝$ki + \overline{ki}$＝ki＋（－ki）＝0

    (D)╳：反例：若 a＝1＋2i，b＝1＋i 則｜a｜＝｜1＋2i｜＝$\sqrt{1^{2}+ 2^{2}}$＝$\sqrt{5}$，｜b｜＝｜1＋i｜＝$\sqrt{1^{2}+ 1^{2}}$＝$\sqrt{2}$

    ∴｜a｜＞｜b｜

    又 $a^{2}$＝（1＋2i）$^{2}$＝－3＋4i，$b^{2}$＝（1＋i）$^{2}$＝2i，$a^{2}$，$b^{2}$ 無法比較大小

    (E)╳：反例：若 a＝2i，b＝3i，$a^{2}$＝（2i）$^{2}$＝－4，$b^{2}$＝（3i）$^{2}$＝－9 ∴$a^{2}$＞$b^{2}$

    但｜a｜＝｜2i｜＝2，｜b｜＝｜3i｜＝3

    ∴｜a｜＜｜b｜

    故選(B)(C)'
- id: doc_110_台南_台南二中_數學_數甲_g12s2e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: '設 f（x）為實係數四次多項式，且 f（3i＋2）＝0，若已知一些 f（x）的正、負，整理如下表：

    | x | －1 | 0 | 1 | 2 | 大於 2 |

    | --- | --- | --- | --- | --- | --- |

    | f（x） | ＋ | ＋ | － | － | － |

    則下列關於 f（x）的敘述哪些正確？'
  options:
  - label: A
    content: f（3i－2）＝0
  - label: B
    content: f（x）＝0 在 1 與 2 之間必無實根
  - label: C
    content: f（x）＝0 在 0 與 1 之間可能不只一個實根
  - label: D
    content: f（x）＝0 恰有兩實根兩虛根
  - label: E
    content: 若 f（－2）＜0，則 f（－3）＜0
  explanation: '(A)╳：f（x）為實係數多項式

    f（3i＋2）＝f（2＋3i）＝0，則$f(\overline{2 + 3i})$＝f（2－3i）＝0

    又 f(0)＞0，f(1)＜0，則 f（x）＝0 在區間（0，1）必有實根

    根據實係數方程式虛根成對定理可知，必存在另一實根

    ∴f（3i－2）≠0

    (B)○：若 f（x）＝0 在區間（1，2）有實根，必為正偶數個根或無實根，矛盾

    (C)╳：∵f(0)×f(1)＜0 得知 f（x）＝0 在區間（0，1）存在正奇數個根， 又 deg f（x）＝4

    ∴f（x）＝0 有 4 個根

    即兩實根兩虛根

    ∴f（x）＝0 在區間（0，1）必存在一實根

    (D)○：同(C)

    (E)○：若 f（－2）＜0，則 f（－1）×f（－2）＜0 即 f（x）＝0 在區間（－2，－1）存在另一實根

    ∴f（－2）×f（－3）＞0

    $\Rightarrow$f（－3）＜0

    故選(B)(D)(E)'
- id: doc_110_台南_台南二中_數學_數甲_g12s2e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 下列哪些複數的主輻角是第二象限角？
  options:
  - label: A
    content: －5＋5i
  - label: B
    content: $-\sqrt{3}i + 1$
  - label: C
    content: －sin130°＋i cos250°
  - label: D
    content: $\frac{2i}{\sqrt{3} -i}$
  - label: E
    content: （1－i）$^{7}$
  explanation: '(A)○：∵－5＋5i ∴（－5，5）在第二象限

    (B)╳：∵$- \sqrt{3}i + 1 = 1 - \sqrt{3}i$ ∴$(1 , - \sqrt{3})$在第四象限

    (C)╳：∵－sin130°＋i cos250°＝－sin（90°＋40°）＋i cos（270°－20°）

    ＝－cos40°－i sin20°

    ∴（－cos40°，－sin20°）在第三象限

    (D)○：∵$\frac{2i}{\sqrt{3} -i}$＝$\frac{2i}{\sqrt{3} -i}\times \frac{\sqrt{3} +i}{\sqrt{3} +i}$＝$\frac{2i (\sqrt{3} +i)}{(\sqrt{3})^{2} -i^{2}}$

    ＝$\frac{2\sqrt{3}i - 2}{4}$＝$-\frac{1}{2}+\frac{\sqrt{3}}{2}i$

    ∴$\left( -\frac{1}{2} , \frac{\sqrt{3}}{2} \right)$在第二象限

    (E)╳：∵（1－i）$^{2}$＝$1^{2}$－2×1×i＋$i^{2}$＝－2i

    ∴（1－i）$^{7}$＝（1－i）$^{2}$（1－i）$^{2}$（1－i）$^{2}$（1－i）

    ＝（－2i）（－2i）（－2i）（1－i）

    ＝－$8i^{3}$（1－i）

    ＝（－8）（－i）（1－i）

    ＝8i（1－i）

    ＝8＋8i

    （8，8）在第一象限

    故選(A)(D)'
