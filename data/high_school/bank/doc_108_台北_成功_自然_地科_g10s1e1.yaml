  stem: 由布設在<u>臺灣</u>的全球衛星定位系統 ( GPS ) 地面觀測站，可以估算<u>臺灣</u>現今的地殼變形量。附圖中之箭號為各測站相對於<u>澎湖</u>測站SO1R的移動速度。測站2、3、4及5分別位於花東縱谷斷層的兩側。地殼變形的速率非常緩慢，地球科學家常以兩測站的速率差值除以測站距離，得到應變率，單位為1／秒，可估算地殼的變形速率。根據附圖測站的栘動速度，下列敘述哪些正確？ (甲)所有的測站都向大陸靠近，因為菲律賓海板塊以每年約8公分的速度向歐亞板塊碰撞 (乙)測站6和7之間的距離加大，此區域以伸張變形為主 (丙)測站4和5之間的距離減小，縱谷斷層以壓縮變形為主 (丁)測站2和3之間的距離減小，縱谷斷層以壓縮變形為主 (戊)<u>臺灣</u>地區地殼變形狀況很均勻一致，東部與西部無明顯差異。
