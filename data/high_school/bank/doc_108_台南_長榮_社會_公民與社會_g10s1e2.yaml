  page: 1
  stem: 老師在上課時提到原住民的權益，小芳回應：「讓原住民考生在升學考試中加分，不但無法保障原住民的權益，而且根本就違反了《憲法》當中的平等原則及比例原則。」其他同學對此一議題有所討論，下列說法何者正確？
