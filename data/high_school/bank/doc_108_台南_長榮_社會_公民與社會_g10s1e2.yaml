  - label: C
    content: 肯定各國家文化價值，強調「差異只是差異」尋求共存
  - label: D
    content: 各國應嚴守自身文化的價值，不需要在意其他文化作法
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
