  stem: 阿南大學畢業後就要人伍，寫下屬於自己的「新兵日記」。阿南認為當兵是《憲法》上的義務，他願意遵守，但同為大學畢業生，女性同學卻可以早一步進入職場，多賺一年的錢，這實在是很不公平。請問：關於女性不用服兵役與平等原則之敘述，下列何者正確？
