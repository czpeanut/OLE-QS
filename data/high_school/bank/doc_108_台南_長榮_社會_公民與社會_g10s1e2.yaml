  stem: 有一天建宏與盈心在聊天，建宏說到：「我覺得喝紅酒感覺是高級的行為，紅酒充斥著學問，未來我想要考侍酒師的證照」」，而盈心說：「雖然我不是很懂喝紅酒的文化，但我覺得臺灣啤酒的小麥味很濃郁，我很愛」，建宏接著說：「是嗎？雖然啤酒蠻好喝，但等級差很多。」請問：下列何種說法符合建宏的觀點？
  options:
  - label: A
    content: 我們不能用主流文化的標準去評論少數族群的文化，這是不公平的
  - label: B
    content: 文化透過不斷演進的過程，逐漸倉將優勢文化留下，劣勢文化淘汰
  - label: C
    content: 文化有其優劣，我們應學習位階較高的文化，顯示良好的生活風格
  - label: D
