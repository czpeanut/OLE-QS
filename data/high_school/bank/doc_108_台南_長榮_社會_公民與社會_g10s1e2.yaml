  - label: A
    content: 男性有服兵役的義務，因為當過兵才算男人
  - label: B
    content: 女性不用服兵役是因為女性進入部隊恐遭性騷擾
  - label: C
    content: 女性不用服兵役是一種保障弱勢的優惠性差別待過
  - label: D
    content: 服戰鬥兵役需要強健的體魄，因此生理上的差異使立法者決定僅男性需服兵役
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
