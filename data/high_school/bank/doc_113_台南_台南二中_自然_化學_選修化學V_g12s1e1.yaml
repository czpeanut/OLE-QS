  explanation: '(1)發生氧化：Cu→Cu($NO_{3}$)$_{2}$，氧化數(0 → ＋2)發生還原：$HNO_{3}$→NO，氧化數（＋5 → ＋2）。因並非所有硝酸都發生 還原反應生成NO，故考慮得失電子相等的情況下，可在Cu、Cu($NO_{3}$)$_{2}$的係數加上3、NO的係數加上2。

    ※不是所有的硝酸都發生還原反應生成NO，但所有發生還原反應的硝酸都變成了NO，故係數可掛在NO上。可得方程式：

