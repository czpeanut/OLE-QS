  stem: 取一含$I_{2}$的水溶液120毫升，加入少許澱粉液使溶液呈藍色，再加入0.05 M $Na_{2}S_{2}O_{3}$溶液60.0毫升恰可使溶液褪色，則原溶液中含$I_{2}$的重量為多少克？（原子量：I＝127）
  options:
  - label: A
    content: '0.191'
  - label: B
    content: '0.381'
  - label: C
    content: '0.763'
  - label: D
    content: '1.27'
  - label: E
    content: '2.54'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $I_{2}$與$S_{2}O_{3}^{2－}$反應：$I_{2}$＋2 $S_{2}O_{3}^{2－}$ → $2I^{－}$＋$S_{4}O_{6}^{2－}$。其中每個$I_{2}$得到2個電子、每個$S_{2}O_{3}^{2－}$失去1個電子。由得電子數＝失電子數，可得$I_{2}$莫耳數×2＝$S_{2}O_{3}^{2－}$莫耳數×1，可得$I_{2}$莫耳數×2＝0.05×0.06×1，則$I_{2}$＝0.0015 mol。又$I_{2}$分子量＝254，故重量＝0.381 g。故選(B)。
