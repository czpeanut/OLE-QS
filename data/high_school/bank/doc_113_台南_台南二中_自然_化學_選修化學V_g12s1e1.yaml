  answer_source: answer_key
  explanation: 反應式：Cu(s)＋$2Ag^{＋}$(aq) → $Cu^{2＋}$(aq)＋2Ag(s)。(A)銅線被氧化，為還原劑；(B)漸漸生成銅離子，故顏色變深；(C)銀離子被還原，為氧化劑；(D)每反應掉一個Cu，即生成兩個Ag，又原子量Ag＞Cu，故金屬片質量變重、溶液質量變輕；(E)假設反應掉x mol的Cu，則生成2x mol的Ag，故金屬片質量變化＝108×2x－63.5x＝152.5x＝1.08，x＝0.007，析出的銀共0.014 mol。
