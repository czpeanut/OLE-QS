  stem: 過錳酸鉀在酸性條件下，紫色的過錳酸鉀會被還原成幾近無色的錳（II）離子。下列何者是在製備酸性過錳酸鉀溶液時，最常使用的酸？
  options:
  - label: A
    content: HF
  - label: B
    content: $HNO_{3}$
  - label: C
    content: $HClO_{4}$
  - label: D
    content: $H_{2}SO_{4}$
  - label: E
    content: $H_{2}S_{2}O_{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 硫酸在濃度不高的情況下不參與氧化還原反應，故適合作為氧化還原滴定中酸性條件的提供者。故選(D)。
