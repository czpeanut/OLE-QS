  section: 2
  number: 16
  type: multiple
  page: 2
  stem: 太空梭使用的固態燃料是由過氯酸銨（$NH_{4}ClO_{4}$）和鋁粉混合而成，會依下列反應式進行反應：Al(s)＋$NH_{4}ClO_{4}$(s) → $Al_{2}O_{3}$(s)＋$AlCl_{3}$(s)＋NO(g)＋$H_{2}$O(g)（未平衡係數）。請問下列敘述哪些正確？（Al原子量：27）
  options:
  - label: A
    content: 最簡整數比係數和為16
  - label: B
    content: $NH_{4}C1O_{4}$中的N，氧化數由－3變為＋2
  - label: C
    content: $NH_{4}ClO_{4}$只為氧化劑
  - label: D
    content: Al為還原劑
  - label: E
    content: 527℃，8.2 L容器中反應後，若產生氣體壓力2.4 atm，則需消耗8.1克的鋁金屬
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 方程式：Al(s)＋$NH_{4}ClO_{4}$(s) → $Al_{2}O_{3}$(s)＋$AlCl_{3}$(s)＋NO(g)＋$H_{2}$O(g)，(B)(C)(D)每個Al氧化失去3個電子、每個$NH_{4}^{＋}$氧化成NO失去5個電子，但同時$ClO_{4}^{－}$還原成$Cl^{－}$得到8個電子，故每個$NH_{4}ClO_{4}$反應的總得失電子數＝得到3個電子。因此可假設$AlCl_{3}$係數＝1，則由Cl不滅得$NH_{4}ClO_{4}$係數＝3、由得失電子相同得Al係數＝$NH_{4}ClO_{4}$係數＝3、由Al不滅得$Al_{2}O_{3}$係數＝1、由N不滅得NO係數＝3、由H不滅得$H_{2}$O係數＝6。故方程式為： 3Al(s)＋$3NH_{4}ClO_{4}$(s) → $Al_{2}O_{3}$(s)＋$AlCl_{3}$(s)＋3NO(g)＋$6H_{2}$O(g) (A)最簡整數比係數和＝17；(E)由理想氣體方程式：2.4(atm)×8.2(L)＝n(mol)×0.082($\frac{atm L}{mol K}$)×800(K)，得n＝0.3 mol。由方程式可得知，產生0.3 mol的氣體，當中包含0.1 mol的NO與0.2 mol的$H_{2}$O，故由係數可得知反應需消耗0.1 mol的鋁金屬，即2.7 g。故選(B)(D)。
