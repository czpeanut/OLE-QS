  stem: 下列哪一個反應不屬於自身氧化還原反應？
  options:
  - label: A
    content: 5Cl＋$ClO_{3}^{－}$＋$6H^{＋}$ → $3Cl_{2}$＋$3H_{2}$O
  - label: B
    content: 2CuCl → Cu＋$CuCl_{2}$
  - label: C
    content: $3ClO^{－}$ → $ClO_{3}^{－}$＋$2Cl^{－}$
  - label: D
    content: $3HNO_{2}$ →$HNO_{3}$＋2NO＋$H_{2}$O
  - label: E
    content: $2H_{2}O_{2}$ →$2H_{2}$O＋$O_{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)Cl氧化數：（－1、＋5→0），不屬於自身氧化還原反應；(B)Cu氧化數：（＋1→＋2、0），屬於自身氧化還原反應；(C)Cl氧化數：（＋1→＋5、－1），屬於自身氧化還原反應；(D)N氧化數：（＋3→＋5、＋2），屬於自身氧化還原反應；(E)O氧化數：（－1→－2、0），屬於自身氧化還原反應。故選(A)。
  tags:
