  stem: 下列有關氧化數的敘述，何者正確？
  options:
  - label: A
    content: 在化合物中每種元素皆具有多種氧化數
  - label: B
    content: 金屬的氧化數必為正，非金屬的氧化數必為負
  - label: C
    content: 典型元素中除F以外，其他元素的最高氧化數均等於族數
  - label: D
    content: $Na_{2}SO_{5}$中的氧化數為＋8
  - label: E
    content: $Pb_{3}O_{4}$中之Pb必有兩個以上之氧化數
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不一定，例如Na就只有＋1、F就只有－1；(B)非金屬元素的氧化數有正有負；(C)不一定，例如O最高氧化數只有＋2；(D)S有6個價電子，故最大氧化數只能到＋6；(E)因為4個O氧化數共－8，故3個Pb必須有不同的氧化數才會讓總和為＋8。故選(E)。
