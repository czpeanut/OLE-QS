- id: doc_109_台北_北一女中_數學_數A_g11s1e1_s3_3
  section: 3
  number: 3
  type: calc
  page: 2
  stem: 承上題，假設某國人口為5千萬人，若傳染率以及總人口數不變，請問最少經過多少個月，全國確診人數會達到全國人口50%？(取到整數位)
  answer:
  - 6個月
  answer_status: verified
  answer_source: answer_key
  explanation: 設經過n個月， 可知30000×$10^{\frac{n}{2}}$ ≥ 2500×$10^{4}$ ⇒ $10^{\frac{n}{2}}$ ≥ $\frac{2500}{3}$ ⇒ log$10^{\frac{n}{2}}$ ≥ log$\frac{2500}{3}$， ⇒ $\frac{n}{2}$ ≥ 2 log 5＋2－log 3 ≈ 2×0.699＋2－0.4771＝2.9209 ⇒ n ≥ 5.8418， 故最少經過6個月。
