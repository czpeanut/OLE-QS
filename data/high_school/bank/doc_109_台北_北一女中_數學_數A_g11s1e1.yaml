    content: y＝$log_{ 2}$ x和y＝$log_{ 4}$ $x^{2}$的圖形重合
  - label: D
    content: $\frac{\log _{2}20+\log _{2}40}{2}$＜$log_{ 2}$ 30
  - label: E
    content: 方程式 ($\frac{1}{2}$)$^{x}$＝－$log_{ 2}$ x的唯一實根α滿足0＜α＜1。
  answer:
