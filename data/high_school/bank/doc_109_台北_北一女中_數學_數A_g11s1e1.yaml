  stem: 試求下列各式的值： (1) $log_{ 2}〔(3\times 2^{6})^{\frac{2}{3}}\times \frac{1}{\sqrt[3]{81}}\div (2^{\frac{-4}{3}}\times (\frac{4}{3})^{\frac{2}{3}})〕$。 (2) 4 $log_{ 5}\sqrt{5}$－$\frac{1}{3}log_{ 5}$ 2＋$log_{ 125}$ 250。 (3) ［$log_{ 2}$ ( 4 $log_{ 2}$ 4 )］( $log_{ 8}$ 2＋1)。
  answer:
  - (1) 4；(2) 3；(3) 4
  answer_status: verified
  answer_source: answer_key
  explanation: (1) $\log _{2}〔(3\times 2^{6})^{\frac{2}{3}}\times \frac{1}{\sqrt[3]{81}}\div 2^{-\frac{4}{3}}\times (\frac{4}{3})^{\frac{2}{3}}〕$ ＝$\log _{2}〔(3^{\frac{2}{3}}\times 2^{4})\times 3^{-\frac{4}{3}}\times (2^{\frac{4}{3}}\times 3^{-\frac{4}{3}}\times 3^{\frac{2}{3}})〕$＝$log_{ 2}$ $2^{4}$＝4。 (2) 4$\log _{5}\sqrt{5}$－$\frac{1}{3}log_{ 5}$ 2＋$log_{ 125}$ 250 ＝$\frac{4\log \sqrt{5}}{\log 5}$－$\frac{\frac{1}{3}\log 2}{\log 5}$＋$\frac{\log 250}{\log 125}$＝$\frac{2\log 5}{\log 5}$－$\frac{\log 2}{3\log 5}$＋$\frac{3\log 5+\log 2}{3\log 5}$ ＝2＋$\frac{(3\log 5+\log 2)-\log 2}{3\log 5}$＝2＋1＝3。 (3) ［$log_{ 2}$ ( 4 $log_{ 2}$ 4 )］( $log_{ 8}$ 2＋1 ) ＝$log_{ 2}$ 8 ( $log_{ 8}$ 2＋1 )＝3 ($\frac{\log 2}{\log 8}$＋1 )＝3 ($\frac{\log 2}{3\log 2}$＋1 )＝1＋3＝4。
- id: doc_109_台北_北一女中_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 解下列方程式與不等式： (1) $\begin{cases}3^{x}-8 \cdot 3^{y}=27 \\ \log _{2}(x+3)-\log _{2}(y+1)=1\end{cases}$。 (2) $2^{－2x＋5}$－18．$2^{－x}$＋1 ≤ 0。 (3) log ( 2x＋3 )－log ( x－1 ) ≥ log ( x＋5 )。
  answer:
  - (1) ( x , y )＝( 5 , 3 )；(2) 1 ≤ x ≤ 4；(3) 1＜x ≤ 2
  answer_status: verified
  answer_source: answer_key
  explanation: (1) $log_{ 2}$ ( x＋3 )－$log_{ 2}$ ( y＋1 )＝$\frac{\log (x+3)}{\log 2}$－$\frac{\log (y+1)}{\log 2}$＝$\frac{\log \frac{x+3}{y+1}}{\log 2}$＝1 ⇒ $\frac{x+3}{y+1}$＝2 ⇒ x＝2y－1 ⇒ $3^{2y－1}$－8．$3^{y}$－27＝0 ⇒ $\frac{1}{3}$．( $3^{y}$ )$^{2}$－8．$3^{y}$－27＝0 ⇒ ( $3^{y}$ )$^{2}$－24．$3^{y}$－81＝0， ⇒ ( $3^{y}$－27 ) ( $3^{y}$＋3 )＝0 ⇒ $3^{y}$＝27 ⇒ y＝3 ⇒ x＝5， 故 ( x , y )＝( 5 , 3 )。 (2) 32．( $2^{－x}$ )$^{2}$－18．$2^{－ｘ}$＋1 ≤ 0 ⇒ ( 16．$2^{－x}$－1 ) ( 2．$2^{－x}$－1 ) ≤ 0 ⇒ $\frac{1}{16}$ ≤ $2^{－x}$ ≤ $\frac{1}{2}$ ⇒ $2^{－4}$ ≤ $2^{－x}$ ≤ $2^{－1}$ ⇒ －4 ≤ －x ≤ －1 ⇒ 1 ≤ x ≤ 4。 (3) 對數有意義的條件為$\begin{cases}2x+3>0 \\ x-1>0 \\ x+5>0\end{cases}$ ⇒ x＞1， log ( 2x＋3 )－log ( x－1 )＝log$\frac{2x+3}{x-1}$ ≥ log ( x＋5 ) ⇒ $\frac{2x+3}{x-1}$ ≥ x＋5， ⇒ 2x＋3 ≥ $x^{2}$＋4x－5 ⇒ $x^{2}$＋2x－8 ≤ 0 ⇒ ( x－2 ) ( x＋4 ) ≤ 0 ⇒ －4 ≤ x ≤ 2， 故所求為1＜x ≤ 2。
