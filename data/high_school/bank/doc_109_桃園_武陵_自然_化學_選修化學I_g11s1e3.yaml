  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列幾種日常生活中的操作，下列敘述何者正確？
  options:
  - label: A
    content: 欲快速煮熟且煮爛綠豆時，往往先在含有綠豆的水中溶解大量蔗糖，以增高水溶液的沸點，使綠豆快被煮熟
  - label: B
    content: 欲由牛奶製備奶粉且不想破壞牛奶中的營養成分，常在低溫、低壓下操作，故常使用真空蒸發器來處理
  - label: C
    content: 市面上所販售的長時效花卉肥料，往往其對水的溶解度較小，目的是為了讓花長得比較快
  - label: D
    content: 欲在高山上烹煮米飯，但發現煮出來往往是半生不熟的狀態，若以滲透壓的原理使用壓力鍋，則可改善此現象
  - label: E
    content: 一般人如果上吐下瀉太嚴重，可能需要吊點滴充能量外，也順便補充一些電解質，免得身體失衡。點滴液中的滲透壓要比人體血液的滲透壓高，才易吸收
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
