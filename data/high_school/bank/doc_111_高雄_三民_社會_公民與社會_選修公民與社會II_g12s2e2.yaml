  stem: 人格權是指做為權利主體的人對其自身與生俱來所享有的權利，任何人都不可以恣意窺探和揭露他人的隱私，因此人格權與權利主體的存在有密不可分的關係。衡量人格權與公共利益的關係，請問下列敘述何者已侵害人格權？
