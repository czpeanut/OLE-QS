  stem: 某文藝愛情電影在全國賣出破億票房，成為臺灣影史最賣座同志片。不過卻有網友在社群平臺發文指稱 A 導演是「抄襲慣犯」，對此 A 導演在臉書貼出長文自清，因為種種因素 B 作家不方便繼續完成，因此雙方簽訂保密契約，並強調已委請律師，要求爆料網友出面說明。有關上述事件，假設抄襲事件為真，A 導演可能需負擔何種民事責任？
  options:
  - label: A
    content: A 侵害了 B 作家肖像權的損害賠償
  - label: B
    content: 侵害 B 作家公開傳輸權的損害賠償
  - label: C
    content: 侵害 B 作家著作財產權的損害賠償
  - label: D
