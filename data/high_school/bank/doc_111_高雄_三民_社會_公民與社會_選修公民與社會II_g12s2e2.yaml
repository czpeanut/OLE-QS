  stem: 隱私是基本人權的一部分，並受到法律保護。下列有關隱私權的認知，哪些最為正確？(甲)隱私權是個人的重要自由權利之一(乙)隱私權常被等同於人格權的延伸(丙)隱私權為重要人權，新聞自由也不能凌駕在其上(丁)我國《憲法》有明確的法律條文保障隱私權(戊)未經當事人同意而洩漏或宣揚他人隱私，必須負擔相關的法律責任
