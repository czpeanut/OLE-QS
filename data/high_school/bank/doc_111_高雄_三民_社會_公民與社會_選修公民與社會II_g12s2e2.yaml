    使用網際網路已經成為很多人日常生活的一部分，從搜尋、地圖、社群媒體、通訊軟體、照片應用程式，以及每天都在使用的各種網路服務等，這些服務很多是免費的，但提供這些網路服務平臺的業者仍然賺很多錢，他們到底賣什麼？最簡單的答案就是：他們在賣「我們」。我們所有重要資訊，包括瀏覽記錄、偏好網站、財務背景和信用狀況，都可能會以某種方式被販售，他們可以透過這些資料，提供精準的廣告投放或市場分析來賺錢。'
  answer:
