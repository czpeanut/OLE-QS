  stem: 中國「社會信用體系」於 2020 年全面上路，全境監視器的數量將會由 2 億增至 6 億 2,600 萬臺，搭載臉部辨識系統的鏡頭安裝在各棟建築角落，掃描每張臉孔。中國政府認為此為國家利益與安全的一環，而《時代雜誌》則認為，目前中國的「天網」系統不斷擴散、精進，已經失去控制。若以我國法律來判斷上文內容，下列何者的理解最為正確？
  options:
