  explanation: (甲)侵害的是物品，屬於財產上的損失，無法請求精神賠償；(乙)侵害其名譽及人格，可請求精神慰撫金；(丙)配偶婚外情會侵害無過失的一方之配偶權，可要求精神慰撫金；(丁)此行為侵害男友的隱私權，並對其造成精神創傷，可請求精神慰撫金。故選(D)。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_26
  section: 1
  number: 26
  type: single
