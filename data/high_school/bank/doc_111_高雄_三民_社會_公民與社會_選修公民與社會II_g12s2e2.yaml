  answer_status: verified
  answer_source: answer_key
  explanation: 肖像權是指自然人對於自己的人物影像加以使用、控制的權利，屬於人格權的一種。在無正當理由下，任何人有權禁止他人將自己的肖像未經同意而被公開使用。(A)雖是小偷，但其仍可主張有肖像權，為正確敘述。(B)此為兩人自願的行為，不涉及肖像權之侵害。(C)此影響朋友的健康權，並非肖像權。(D)獲得當事人同意授權，並未侵害其肖像權。
