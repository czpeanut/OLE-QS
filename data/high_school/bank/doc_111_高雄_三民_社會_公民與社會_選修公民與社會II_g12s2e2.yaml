  answer_status: verified
  answer_source: answer_key
  explanation: 此段引文的主題涉及網際網路的使用及其需注意的面向，與其有關的倫理議題應為(B)資訊倫理。資訊倫理在討論人們對資訊的態度以及行為，應用於電腦的使用、資訊科技、資訊系統、資訊網路等之倫理規範。
