  stem: 關於新聞記者跟追知名公眾人物的案件中，大法官釋字第 689 號解釋，提出利益衡量的判斷基準。即「新聞採訪者於有事實足以認定某特定事件屬大眾所關切並具一定公益性之事務，而具有新聞價值，如須以跟追方式進行採訪，其跟追若依社會觀念認定非不能容忍者，即具正當理由」。由此判斷，下列何者較「不」符合公益性之事務？
