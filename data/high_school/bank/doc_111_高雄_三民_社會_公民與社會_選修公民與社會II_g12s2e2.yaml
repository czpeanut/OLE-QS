  stem: 振宇住在一棟大廈的二樓，三樓住戶阿香重新裝潢房屋，於地面鋪設木地板，但木地板與樓地板並未緊密貼合，以致快步走動、搬動桌椅時，均會產生巨大聲響，而且阿香的小孩時常在家跑跳，往地上扔擲東西，讓振宇一家人每天被噪音吵得心神不寧，且多次與阿香溝通無效，嚴重影響睡眠，振宇因此得了憂鬱症。關於此糾紛，振宇有什麼方法可以保障自己的權益，以下說明何者較正確？
  options:
  - label: A
    content: 振宇的財產權因受到住戶阿香的侵害，可要求賠償
  - label: B
    content: 住戶阿香並非故意製造噪音，因此不屬於侵權行為
  - label: C
    content: 振宇的居住安寧及健康權受阿香影響，可要求精神慰撫金
  - label: D
    content: 只要振宇覺得無法容忍，就可向阿香要求損害賠償
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 居住安寧權為人格權之一種，其侵害構成權利之侵害，被害人自得依《民法》第 184 條第 1 項前段，於加害人有故意或過失時，主張侵權責任損害賠償請求權。(A)侵害的為居住安寧權，屬於人格權的一種。(B)雖非故意，但仍造成振宇的居住安寧受到侵害，屬於侵權行為。(D)振宇覺得無法容忍過於主觀，仍須依照法規有客觀認定的標準。
