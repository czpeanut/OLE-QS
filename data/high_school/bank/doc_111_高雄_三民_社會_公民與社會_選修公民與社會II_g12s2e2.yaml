  explanation: 根據《刑法》第 359 條：「無故取得、刪除或變更他人電腦或其相關設備之電磁紀錄，致生損害於公眾或他人者，處五年以下有期徒刑、拘役或科或併科六十萬元以下罰金。」及根據《刑法》第 358 條：「無故輸入他人帳號密碼、破解使用電腦之保護措施或利用電腦系統之漏洞，而入侵他人之電腦或其相關設備者，處三年以下有期徒刑、拘役或科或併科三十萬元以下罰金。」故(A)(C)(D)皆屬於該法規範的情形。(B)使用金融卡與電腦使用之情形無關，不屬於該法適用範圍。
