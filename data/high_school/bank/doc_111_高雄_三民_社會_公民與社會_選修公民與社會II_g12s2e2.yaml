questions:
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 安安買到了當前熱銷的手機，卻被同學摔壞，安安可如何主張自己的權利呢？
  options:
  - label: A
    content: 同學須負責修復安安的手機，另外還要賠償安安精神慰撫金
  - label: B
    content: 同學須負責修復安安的手機，若無法修復則須依照市價賠償金錢
  - label: C
    content: 同學摔壞安安的手機，侵害安安使用手機的身分權，須賠償金錢
  - label: D
    content: 同學摔壞安安的手機，侵害安安使用手機的人格權，須賠償金錢
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)侵害財產權不用賠償精神慰撫金。(B)關於損害賠償之債，因《民法》第 213 條第 1 項規定：「負損害賠償責任者，除法律另有規定或契約另有訂定外，應回復他方損害發生前之原狀。」為正解。(C)(D)損害手機為侵害財產權，非人格權及身分權。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 法益衡量原則在個案中將雙方主張的權利加以衡量，以釐清界限解決衝突，使雙方法益得到實質上的調和。亦即就被害人被侵害之法益、加害人之權利及社會公益等，依比例原則等標準綜合判斷，若衡量之結果不足以正當化加害人的行為，其侵害便具有不法性。下列何者「不屬於」以法益衡量原則做出的評論？
  options:
  - label: A
    content: 記者揭露明星藝人私生活，應衡量當事人隱私權的保護、民眾知的權利以及新聞自由
  - label: B
    content: 對任何特殊氣味都會引發身體不適的甲限制同儕不得噴香水，恐過度限制同儕自由權
  - label: C
    content: 換發身分證強制按捺並錄存指紋，應衡量個人資訊自決權與相關公益的維護何者為重
  - label: D
    content: 相同性別二人成立具親密性及排他性之永久結合關係的權利，應衡量是否為基本人權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)皆為符合法益衡量原則的相關情境，有公益及私益需相互衡量的情形。(D)相同性別二人成立具親密性及排他性之永久結合關係的權利屬於基本人權，本來就需要維護，且此非公共利益的範疇。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「初音未來」是個綁著綠色雙馬尾長髮的高瘦女孩，她於 2007 年誕生，是日本知名的虛擬偶像，一直是許多動漫迷心目中的女神，有人笑稱要惹怒一個動漫迷最快的一句話，就是跟他說「初音只是個軟體」。有動漫迷在社群媒體上宣布與初音未來的結婚，若依我國《民法》規範，初音未來能否享有配偶權的保障？
  options:
  - label: A
    content: 不能，初音未來非權利主體，不具權利能力
  - label: B
    content: 不能，初音未來只是法人，無法享有身分權
  - label: C
    content: 能，動漫迷心中的虛擬偶像也具有人性尊嚴
  - label: D
    content: 能，初音未來是「物」，權利可由自然人賦予
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 初音未來因為是虛擬偶像（「物」），所以不為自然人，並非權利主體，不具有權利能力，故選(A)。(B)(C)(D)初音未來不為自然人，也並非法人，因此不具權利能力。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 文化創意品牌「誠品書店」所屬的誠品公司，對「誠品搬家公司」及「誠品優質包裝公司」提出侵權訴訟，認為這兩家公司的營業車輛、廣告文宣等特別使用及突顯「誠品」二字，且屢屢對外宣稱向誠品書店借名，但其實完全沒有洽談授權。誠品公司應認為「誠品搬家公司」及「誠品優質包裝公司」侵害其何種權利？
  options:
  - label: A
    content: 商標權
  - label: B
    content: 專利權
  - label: C
    content: 肖像權
  - label: D
    content: 信用權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 商標通常是文字、詞語、記號或圖形，甚至是顏色、商品形狀或其包裝形狀、動態、全像圖、聲音等，或是由 2 種以上的這些元素所聯合組成，因此誠品書店在此情境中所主張的是「商標權」，故選(A)。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 阿民到寵物店購買一隻 1 個多月大的法國鬥牛犬，買回來就發現該鬥牛犬有感冒症狀，經治療後仍因感冒併發呼吸道炎症而住院，最後不治死亡。阿民要求店家退還購買犬隻的價金及支付所有醫療費用遭到拒絕，因而產生消費糾紛。關於上述個案的法律分析，何者正確？
  options:
  - label: A
    content: 鬥牛犬具有生命，是《民法》中的權利主體
  - label: B
    content: 阿民與該寵物店訂定買賣契約屬於物權行為
  - label: C
    content: 鬥牛犬的買賣關係中阿民為債權人，寵物店是債務人
  - label: D
    content: 阿民請求店家退還及支付的費用屬於財產損失的賠償
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)鬥牛犬為權利主體施行權利的對象，為權利客體中的「物」。(B)買賣契約為債權行為，契約為債的一種。(C)如本題買賣關係中，債權人店家賣出鬥牛犬，而需要給付金錢的是債務人阿民。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 民事法是規範與保障人民私權利關係的法律，其制度可說以「權利」為核心而建立，包括權利主體、權利客體、權利種類、權利行使方式等，下列關於民事法律的重要概念，何者正確？
  options:
  - label: A
    content: 抽象的思想創作雖非有形的物體，但仍屬於民事法保障的權利客體
  - label: B
    content: 法人為權利主體，但因不具有生命，不得主張侵權行為的損害賠償
  - label: C
    content: 物若不具經濟上的效益，沒有市場交換價值，即不受財產權的保障
  - label: D
    content: 《民法》將成年年齡由 20 歲降為 18 歲，表示年滿 18 歲始具有權利能力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)法人雖不具有生命，但亦為法律上的權利主體，仍有名譽權等權利，可主張侵權行為的損害賠償。(C)只要是《民法》定義的「物」，無論是否具有經濟上之效益，皆受財產權保障。(D)凡自然人皆為權利主體，權利能力始於出生，終於死亡；《民法》下修成年年齡，影響的是行為能力。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 甲向乙訂購了一臺冰箱，價金甲已付清，但乙尚未將冰箱交付予甲，有關甲乙間之權利義務關係，下述敘述何者最為適當？
  options:
  - label: A
    content: 乙將冰箱交付予甲前，甲乙因契約而有債權債務關係與物權行為
  - label: B
    content: 乙決定將冰箱售予甲並未立即喪失所有權，仍得另行處分該冰箱
  - label: C
    content: 甲可請求乙交付冰箱，亦可本於所有權人的地位自由使用該冰箱
  - label: D
    content: 價金甲已付清，若乙未依約交付，甲可本於契約逕自取走該冰箱
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)乙將冰箱交付予甲之前，甲乙間只有因契約而生之債權債務關係，沒有物權行為。(B)乙將該冰箱售予甲，且甲已付錢，並未立即喪失所有權，但應交付冰箱給甲，所以不得另行處分該冰箱。(C)甲可請求乙交付冰箱，且甲已付錢，所以可以本於所有權人的地位處分該冰箱，為正確敘述。(D)倘若乙未依約將冰箱交付予甲，甲仍無法依契約逕自取走該冰箱，需買賣雙方要同意才可以。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 來自越南的移工阿紅，透過仲介來到臺灣為雇主看護失能長輩。仲介說，為了讓雇主安心，防止他們逃跑，要他們把護照跟居留證都交給雇主保管。某日，阿紅覺得沒有證件造成生活上許多不方便，於是告知雇主要拿回護照和居留證，但雇主卻把影本給她，不願歸還正本。對於雇主保管阿紅證件不願歸還的行為，下列敘述何者較為正確？
  options:
  - label: A
    content: 移工非本國人士，即使權利受侵害，仍無法受我國《民法》保障
  - label: B
    content: 以法益衡量原則評估雙方相關的權利，恐難以正當化雇主的行為
  - label: C
    content: 雇主不歸還阿紅證件正本可有效防止其逃跑，符合比例原則
  - label: D
    content: 雇主保管阿紅的證件並未違反公序良俗，故法律不加以干涉
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 雇主為了自己的私益，保管移工們的護照及居留證，對其生活造成不便，影響其權益，故(B)為正確敘述。(A)基本人權受侵害，可受我國法律保障。(C)雇主的行為恐有過當之虞，不符合比例原則。(D)侵害人權之行為，我國法律可介入保障移工之權利。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 新冠肺炎疫情肆虐全球，不少國家利用數位科技，作為對抗新冠病毒的公衛手段之一。有國家推出可以取得確診者活動足跡的防疫 App，確診病患去過哪些餐廳、住在哪家旅館、搭乘哪一線地鐵或公車、看電影坐的是哪一個位子，都一目了然，以便使用者達到趨吉避凶的目的。但有些國家卻不考慮這種追蹤足跡的做法，認為有心人士可藉由公布的詳細出沒地點拼湊線索，確認感染者身分，網路霸凌與汙名化問題隨之而起。上述各國的公衛政策說明何種現象？
  options:
  - label: A
    content: 確診者的隱私攸關大眾生死，故應放寬跟追行為的限制
  - label: B
    content: 隱私權與健康權的保障衝突時，隱私權應居於優先地位
  - label: C
    content: 無法了解確診者足跡而產生感染，比侵犯人格權更嚴重
  - label: D
    content: 公益與個人人格權的尊重何者重要，因民情有不同標準
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹可了解有些國家會利用科技追蹤確診者足跡，來達到防疫目的；有些國家卻害怕這種 App 侵害感染者的隱私權及造成汙名化。故以「(D)公益與個人人格權的尊重何者重要，因民情有不同標準」為較適切的選項。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 阿強到大賣場玩夾娃娃機，機臺註明保證夾取金額為 250 元。不料投了 250 元夾到第一隻娃娃後，機器並沒有停下來，阿強一連夾取了 7 隻娃娃，機器才停止。此時機臺主出現，告知阿強機器故障，只能保證夾取 1 隻，其餘 6 隻應歸還，阿強則主張機臺上並未說明遊戲規則，以為投幣後至機器停止前，都可以自由操作取物，但為了迅速解決爭端，因此提議自己拿 3 隻，另外 4 隻還給機臺主。關於上述爭議的敘述，何者正確？
  options:
  - label: A
    content: 依據物權法定原則，《民法》優先保障機臺主對娃娃的所有權
  - label: B
    content: 依據侵權行為的賠償原則，阿強應將夾取的娃娃回復原狀
  - label: C
    content: 依據財產權的專屬性，阿強投幣後夾取的商品均歸其所有
  - label: D
    content: 依據契約自由原則，阿強的提議若獲機臺主同意便可成立
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此非物權法定主義之概念，物權法定主義之定義為除了法律允許外，當事人不可自行創設物權的種類，也不能自由約定物權的內容。(B)阿強的行為不構成侵權行為。(C)娃娃的所有權爭議，與財產權的專屬性無關。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 甲將祖傳的古董花瓶售予乙，移轉所有權時甲告知乙對古董花瓶的所有權不包括處分權能，亦即乙取得古董花瓶的所有權後，得以合法占有、使用、收益，但永久不得有出售等處分行為。甲對古董花瓶的所有權設定「違反」《民法》的何種原理原則？
  options:
  - label: A
    content: 契約自由原則
  - label: B
    content: 法益衡量原則
  - label: C
    content: 物權法定主義
  - label: D
    content: 比例原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「物權法定主義」之定義為除了法律允許外，當事人不可自行創設物權的種類，也不能自由約定物權的內容。而所有權之規定如下，《民法》第 765 條：「所有人，於法令限制之範圍內，得自由使用、收益、處分其所有物，並排除他人之干涉。」由此可知，甲對乙之所有權內涵的約定違反物權法定主義，故選(C)。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 4
  stem: 資訊倫理是一套價值觀，用來指引資通訊科技的生產、傳播、整理、保存、檢索以及利用等活動，並提供使用者「正確」應用資通訊科技之行為準則。下列關於資訊倫理的相關評論，何者正確？
  options:
  - label: A
    content: 因為立法跟不上社會變化的速度，資訊倫理成為維持社會秩序的重要力量
  - label: B
    content: 由於資訊倫理不具強制力，無法發揮任何影響，讓使用者「正確」的應用
  - label: C
    content: 在網路上的言論，只要符合現行的法律規範，必定符合資訊倫理的準則
  - label: D
    content: 違反法律的人可能面臨民事、行政或刑事處罰，使資訊倫理不再被需要
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)在法律無法規範的情形時，倫理可以成為維持社會秩序的力量，為正確敘述。(B)即使資訊倫理不具強制力，仍有維持社會秩序的影響力。(C)符合法律不一定符合倫理道德，法律是最低限度的道德。(D)即使有法律，倫理道德仍有其重要性及影響力。
