  stem: 一名幼教老師在私人社群媒體貼出學生的照片，並直指該生飯吃不好、水喝不好、還尿在教室裡的行為是「智障日常」，更奚落學生家長完全不知道自己生出了一個社會敗類、全家都沒救了。下列對此事件的相關敘述，何者敘述正確？
  options:
  - label: A
    content: 老師在私人社群媒體的發言均受言論自由的保障
  - label: B
    content: 即使老師刪除不當圖文，仍不能阻卻行為的違法
  - label: C
    content: 如果老師被檢察官起訴，才須對學生負賠償責任
  - label: D
    content: 社群媒體為個人專屬空間，屬隱私權保護的範圍
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)私人透過社群媒體的發言仍可能涉及公然侮辱罪，並非均受言論自由的保障。(B)刪除貼文不可抹滅其曾說過不適當言論的事實，因此無法阻卻行為違法，為正確敘述。(C)檢察官起訴為刑事責任，但被害者主張民事責任也可獲得賠償。(D)社群媒體屬不特定多數人得以見聞的空間，雖保障其隱私權，仍須符合其他法律之規範。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 5
  stem: 電子商務興起，傳統透過實體店面販售商品的交易模式也日益轉移到網路平臺。但網路商店為了吸引消費者瀏覽，常需要精美的商品照片，有些貪小便宜的網路商店經營者為了節省照片的拍攝成本，會採取「網路盜圖」的方式，例如：在網路上搜尋販售相同商品之店家所使用的照片，以複製、貼上方式，張貼在自己的商品網頁上。根據上文，下列關於著作權的相關規定何者正確？
  options:
  - label: A
    content: 「網路盜圖」的行為可能會侵害著作權人的著作財產權
  - label: B
    content: 照片拍攝者若未向智慧財產局申請，即無法享有著作權
  - label: C
    content: 「複製」、「貼上」的行為即《著作權法》中所謂的「改作」
  - label: D
    content: 盜用的圖片並非直接用來出售謀利，應屬合理使用的範圍
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是侵害著作人格權。(B)著作權採用創作保護主義，創作完成即享有著作權。(C)複製、貼上屬於抄襲，故一般所謂的「著作抄襲」，即指構成著作「重製權」或「改作權」的侵害，為正確敘述。(D)即使非營利，仍侵害著作權人的著作人格權，不屬於合理使用範圍。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_19
  section: 1
  number: 19
  type: single
