    《釋字第 791 號解釋》宣告《刑法》第 239 條通姦罪、《刑事訴訟法》第 239 條但書「可單獨對配偶撤告」之規定，因分別違反比例原則及平等原則而違憲，相關法律自解釋公布之日起失其效力。幾經紛擾之通姦罪是否除罪化議題，於法律上已臻底定，改以民事求償。然而社會上仍不乏有一波波贊成與反對之討論聲浪，贊成者認為通姦罪對維繫婚姻實際上無太大幫助；反對者擔心缺乏《刑法》規範，未來婚姻外遇案例會增加。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 侵權行為可分為侵害財產權與身分權，與人通姦為侵害配偶的身分權（配偶權）。(A)仿冒簽名為侵害其姓名權，屬於人格權之一種。(B)盜版影片侵害著作權人的著作財產權。(C)二手菸侵害的是身體健康權。(D)拐走孩子，造成其父母無法行使親權，此為身分權的一種，為正解。
