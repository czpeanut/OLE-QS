  stem: 甲使用乙的筆記型電腦上網，並因此得知乙電腦內部的資料內容。被檢察官以《刑法》第 358 條「無故輸入他人帳號密碼、破解使用電腦之保護措施或利用電腦系統之漏洞，而入侵他人之電腦或其他相關設備者」的罪名起訴。但法院認為，甲所使用的筆記型電腦固然是乙所有，但是該電腦並沒有設定任何密碼，也沒有其他的保護措施或系統上的漏洞，所以未依《刑法》第 358 條之規定對甲處以刑罰。法院未對甲處以刑罰的理由應為何？
  options:
  - label: A
    content: 甲不具有責任能力
  - label: B
    content: 甲欠缺故意或過失
  - label: C
    content: 甲的行為具有阻卻違法事由
  - label: D
    content: 甲的行為不符合法條明定的犯罪構成要件
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 因為《刑法》第 358 條「無故輸人他人帳號密碼、破解使用電腦之保護措施或利用電腦系統之漏洞，而入侵他人之電腦或其他相關設備者」；而甲未有破解帳號密碼之情事，不符合上述法規的構成要件，因此無法以此法懲罰他，故選(D)。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_20
