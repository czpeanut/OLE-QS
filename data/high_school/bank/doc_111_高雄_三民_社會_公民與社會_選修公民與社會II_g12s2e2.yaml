- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 4
  stem: 小芸用手機上網時，在社群平臺上滑到一則免費的星座運勢 App 廣告，基於好奇、沒有想太多就下載使用，免費試用期過後，她覺得無趣將該款 App 刪除，就不再理會。平時鮮少檢查 e-mail 的她，一個月後打開信箱，發現早已收到一封購買星座運勢 App 的確認信，但她沒注意到該信件 ，因此沒有以手動方式設定「取消購買」，所以後來陸續收到多封扣款收據的信件，無故被扣款數千元。上述事例說明資訊生活可能遭遇何種風險？
  options:
  - label: A
    content: 個人的「生物特徵」外洩，成為人工智慧、大數據分析的資料
  - label: B
    content: App 開發公司任意使用個人儲存在手機、伺服器裡的隱私資訊
  - label: C
    content: 下載應用程式未充分了解契約內容，導致後續消費爭議及損失
  - label: D
    content: 軟體公司任意重製、出版、傳播用戶創造的作品侵害其著作權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹「但她沒注意到該信件，因此沒有以手動方式設定『取消購買』，所以後來陸續收到多封扣款收據的信件，無故被扣款數千元」，可見此為消費爭議與糾紛有關，以(C)為最適切的答案。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_17
  section: 1
  number: 17
