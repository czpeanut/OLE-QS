  answer_source: answer_key
  explanation: (A)與文中敘述無關。(B)是否侵害人格權與隱私權，與是否具有營利行為無關。(C)蒐集民眾之人臉，屬於侵害個人肖像權，為正確敘述。(D)中國應無《個資法》，且即使為維護社會秩序，也需符合相關法律原則，否則仍是侵害人權。
