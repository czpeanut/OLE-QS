- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 5
  stem: 人格權是身為自然人的固有權利，下列關於人格權的敘述，何者「錯誤」？
  options:
  - label: A
    content: 個資屬於人格權的範疇
  - label: B
    content: 居住安寧權屬於概括人格權的範圍
  - label: C
    content: 人格法益受不法侵害而情節重大者，可請求精神賠償
  - label: D
    content: 個人肖像為可公開資訊，不屬於人格權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《個人資料保護法》的立法目的保障個體對個人資料的「人格權」外，更強調對個人資料的「合法」、「合理」的蒐集、處理及利用。(B)居住安寧權為人格權之一種，他人若構成權利之侵害，被害人得依《民法》第 184 條第 1 項前段，於加害人有故意或過失時，主張侵權責任損害賠償請求權。(C)依《民法》第 195 條規定：「不法侵害他人之身體、健康、名譽、自由、信用、隱私、貞操，或不法侵害其他人格法益而情節重大者，被害人雖非財產上之損害，亦得請求賠償相當之金額。」(D)肖像權之保護，在我國法律上並無明文，但學說上及司法機關之判決，都將其列為《民法》第 18 條人格權的一種，並為《民法》第 195 條第 1 項所稱之「其他人格法益」，故此敘述有誤。
- id: doc_111_高雄_三民_社會_公民與社會_選修公民與社會II_g12s2e2_s1_24
  section: 1
  number: 24
  type: single
