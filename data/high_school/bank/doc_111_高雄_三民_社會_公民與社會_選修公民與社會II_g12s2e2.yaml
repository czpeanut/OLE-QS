  stem: 被害人權利受侵害時，無論是財產權或人格權、身分權，都可能受到財產上損害或非財產上損害。在下列哪些情況中，被害人可請求加害人支付精神賠償？(甲)小倫不小心撞壞小美收藏的古董汽車，使小美生氣到斷絕往來(乙)阿恆在公眾場合以三字經辱罵小維，使小維深受羞辱(丙)阿民與第三者發生婚外情，對妻子造成極大的身心壓力(丁)阿倫將男友的私密照片公布於網路，使男友不敢面對親友
  options:
