  stem: 我國《刑法》第 365 章規範「妨害電腦使用罪」，對相關犯罪行為施以處罰。下列何者「並非」《刑法》妨害電腦使用罪所規範的範圍？
  options:
  - label: A
    content: 竊取他人線上遊戲寶物
  - label: B
    content: 利用他人金融卡竊領存款
  - label: C
    content: 盜用他人的網路帳號密碼
  - label: D
    content: 隨意侵入他人電腦觀看內容
