- id: doc_113_台南_台南二中_自然_化學_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 一氧化氮（NO）在細胞的訊號傳遞中，扮演重要的調控角色。實驗室製備NO時，可用銅還原稀硝酸而得，係數尚未平衡的反應式如下：aCu(s)＋$bHNO_{3}$(aq)→cCu($NO_{3}$)$_{2}$(aq)＋dNO(g)＋$eH_{2}$O(l)，當反應式完成平衡時 ，a＋b＋c＋d＋e之值最小為何？（a、b、c、d、e均為正整數）
  options:
  - label: A
    content: '8'
  - label: B
    content: '10'
  - label: C
    content: '20'
  - label: D
    content: '23'
  - label: E
    content: '26'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 因左、右Cu原子數相等，故可先假設a＝c＝1。接著由H原子數相等可得(1) b＝2e，由N原子數相等可得(2) b＝2＋d，最後由氧原子數相等可得(3) 3b＝6＋d＋e。聯立以上(1)(2)(3)式子後可得b＝$\frac{8}{3}$、d＝$\frac{2}{3}$、e＝$\frac{4}{3}$。通分後可得係數a～e依序為3、8、3、2、4，總和為20。故選(C)。
