  options:
  - label: A
    content: Mn
  - label: B
    content: MnO
  - label: C
    content: $Mn_{2}O_{3}$
  - label: D
    content: $Mn_{3}O_{4}$
  - label: E
    content: $Mn_{4}O_{5}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 二氧化錳莫耳數：消耗掉的氧氣莫耳數＝$\frac{5.23}{87}$：$\frac{0.64}{32}$＝0.06：0.02＝3：1。原本的二氧化錳中共有0.06 mol的Mn原子、0.12 mol的O原子，反應後失去0.04 mol的O原子，剩餘0.08 mol的O原子。故原子數比Mn：O＝0.06：0.08＝3：4，故化學式應為$Mn_{3}O_{4}$，故選(D)。
