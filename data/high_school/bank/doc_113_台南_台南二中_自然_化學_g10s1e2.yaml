  - label: A
    content: '3'
  - label: B
    content: '4'
  - label: C
    content: '2'
  - label: D
    content: '5'
  - label: E
    content: '6'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 血紅素一分子的重量為 68000 amu，其中含 0.33% 的鐵，相當於 $68000 \times 0.0033 \approx 224\text{ amu}$。鐵原子個數 $= \frac{224}{56} = 4$。故選(B)。
