  type: single
  page: 1
  stem: 已知蔗糖的分子量為 342克／莫耳，而其水溶液的發酵可用下列反應式表示： $C_{12}H_{22}O_{11}$＋$H_{2}$O → $C_{2}H_{5}$OH＋$CO_{2}$（係數未平衡）。今取蔗糖 6.84克溶於水後，加酵母使其發酵。假設只考慮蔗糖變為酒精的發酵，且蔗糖的發酵只完成50%，則在此發酵過程中，所產生的二氧化碳在標準狀態下總共有幾毫升？（在標準溫壓時1莫耳氣體為22.4升）
  options:
  - label: A
    content: '112'
  - label: B
    content: '224'
  - label: C
    content: '336'
  - label: D
    content: '448'
  - label: E
    content: '896'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 先完成方程式：$C_{12}H_{22}O_{11}$＋$H_{2}$O → $4C_{2}H_{5}$OH＋$4CO_{2}$，取6.84 g蔗糖相當於$\frac{6.84}{342}$＝0.02 mol，由係數比＝1：4可得知最多可產生0.08 mol的二氧化碳；但發酵只完成50％，故只產生0.04 mol的二氧化碳。1 mol氣體在STP下體積為22.4 L，故0.04 mol的氣體相當於0.896 L＝896 mL。故選(E)。
