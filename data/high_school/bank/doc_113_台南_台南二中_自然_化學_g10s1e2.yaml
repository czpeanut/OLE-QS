  stem: '麻醉劑的發現與使用，是人類醫療史上一項重大的成就，無論是局部麻醉劑或是全身麻醉劑，其作用都是阻止神經訊息傳送到中樞神經系統的痛覺中樞。氯仿是俗稱哥羅芳的三氯甲烷（$CHCl_{3}$），為一無色可揮發性液體，聞起來似乙醚味，嚐起來帶點甜味，自西元1847年起，曾被用於吸入性麻醉劑用途；然因其對肝臟、腎臟造成的毒性較大，西元1912 年後，即不建議用於醫療用途。氯仿在工業上，可被用於樹脂、橡膠製造之溶劑、黏著劑、穀物燻蒸除蟲劑。在實驗室中則常用以萃取DNA、RNA 及脂肪。至於一氧化二氮（$N_{2}O$）是無色有甜味氣體，吸入會感到欣快，而使人發笑，故又稱笑氣，在室溫下穩定，其麻醉作用於1799 年由<u>英國</u>化學家<u>漢弗萊．戴維</u>發現。該氣體早期被用於牙科手術的麻醉，現用於外科手術和牙科之麻醉與止痛。根據上文，回答下列問題：

