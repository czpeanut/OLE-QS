  stem: '2023年諾貝爾化學獎揭曉，由創造量子點的<u>布魯斯</u>及<u>艾吉莫夫</u>與改變量子點的製造方法的<u>巴文迪</u>共同獲得。量子點是典型的奈米材料代表，可視為「具量子特性之奈米粒子」。量子特性係指如原子具有分離的能階，有類似原子的量子特性，故稱之為量子點。量子點的電子能階密度隨著其尺寸大小而異，也就是說物質性質可以單純的由尺寸大小變化來改變，藉由控制粒徑大小，可改變吸收能量後所放光的波長（粒徑愈小，放光波長愈短，由紅光移向藍光）。量子點現已成奈米科技工具箱裡的重要用具，其發光特性被應用於 QLED電視（Q代表量子點）和改變LED燈的色溫；生物化學家將量子點附著在生物分子上，藉此標示出細胞和器官，醫學界也開始研究利用量子點追蹤體內腫瘤組織的潛力。

    (1) 根據所學知識及上文提供的訊息，下列哪些正確？

    (2) 硒化鎘是目前最廣泛使用的量子點材料，研究發現在硒化鎘膠體量子點外包覆硫化鋅，可大幅提升其發光效率。硫化鋅為立方晶體結構，其晶格長約 0.5 nm，一個晶格內有 4 個鋅離子及 4 個硫離子。試問：一個 10 nm × 10 nm × 10 nm 的硫化鋅量子點中，約含幾個鋅離子？'
