  page: 1
  stem: 有關化學式的敘述，下列何者正確？
  options:
  - label: A
    content: 結構式可表示分子真正形狀
  - label: B
    content: 實驗式相同者，其化性必定相同
  - label: C
    content: 示性式多用於離子化合物
  - label: D
    content: 不同的化合物不可能有相同的實驗式
  - label: E
    content: 分子式可顯示化合物之原子總
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)只能表示原子相對排列位置，不能表示出正確形狀；(B)實驗式相同甚至連原子數量都不一定一樣，化性也不一定一樣；(C)多用在有機化合物（分子化合物）上；(D)不一定，例如葡萄糖、乙酸、甲醛的實驗式都是$CH_{2}O$。故選(E)。。
