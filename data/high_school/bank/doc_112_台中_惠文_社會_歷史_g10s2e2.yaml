  stem: 東漢末年詩人王粲的〈七哀詩〉：「西京（長安）亂無象，豺虎方遘（遭遇）患。復棄中國（中原）去，遠身適荊蠻（荊州）。」請問詩人為何去荊州？
  options:
  - label: A
    content: 天災接連不斷
  - label: B
    content: 猛獸攻擊人群
  - label: C
    content: 中原戰亂無道
  - label: D
    content: 荊州發展良好
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「西京亂無象」一句，可知當時(C)中原戰亂無道，因此不得不遠離，前往蠻荒的荊州。
