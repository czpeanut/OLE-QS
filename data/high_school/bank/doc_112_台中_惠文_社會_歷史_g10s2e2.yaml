- id: doc_112_台中_惠文_社會_歷史_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 日本德川幕府常藉外交手段來強化政權的合法性，鞏固統治地位。1607 ～ 1811 年，朝鮮派遣 12 次通信使到日本；1610 ～ 1850 年，琉球也派了 21 次使節團。使節團主要是恭賀將軍繼位或世子出生，各地大名目睹其豐厚的賀禮，聽到祝賀德川一統天下的頌辭，自然心悅誠服。不過，德川幕府卻從未與中國發展正式關係，最可能的原因是：
  options:
  - label: A
    content: 幕府實施「鎖國」政策，拒與中國建立關係
  - label: B
    content: 幕府拒絕奉行朝貢體制，不願接受天朝秩序
  - label: C
    content: 幕府的財政發生困難，無法負擔沉重的賀禮
  - label: D
    content: 日本自古以文明開化自居，對中國向來輕視
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)鎖國期間，朝鮮與琉球使節團仍持續與德川幕府有所往來，可見「鎖國」並非未與中國發展正式關係的真正理由。(B)為正解。(C)與史實不符。(D)日本過去曾與中國有封貢關係，並非自古以來就輕視中國。

    6.18 世紀中葉發生於巴達維亞鄰近城鎮的華人屠殺事件，是為(A)紅河慘案。(B) 1925 年上海學運抗議日工廠槍殺華工，5 月 30 日遊行抗議期間遭到租界軍警鎮壓；(C) 1932 年日本首相犬養毅因與軍隊意見不合，遭海軍少壯派軍人刺殺。(D) 1936 年日本少壯派軍人在東京的叛亂事件，推動了日本法西斯主義。

    7.《大雲經》裡提到有女身當王、王女繼承王嗣的例子，武則天將之頒布天下並令每寺各藏一冊，其欲利用宗教穩固政權的意圖昭然若揭，因此答案為(B)。

    8.這段史料說明福建人口過剩，連深山窮谷都過度開發，因此(甲)(丙)為正確的敘述，答案選(A)。(乙)應是推力；(丁)史料中並無提到政治相關敘述。

    9.(A)小冰河時期的氣溫降低會影響作物生長，但人口不會急速銳減。(B)大批人口移往南方是因為戰亂，非因為異常氣候；(C)異常氣候與戰亂促使北方人移往南方，但此時尚未有海外拓殖現象。

    10.從糕點加入「在地的香料」來看，小美現居地應該位於東南亞，因此正確答案為(C)。(A)東南亞地區。(B)此糕點應是東南亞的娘惹糕。(D)華人後裔多仍維持佛教或道教信仰。

    11.粟特人、大食人活躍於唐朝與西域的貿易往來，因此答案為(B)。

    12.羌族党項人建立夏，契丹人建立遼，女真人建立金，(C)為正解。

    13.這位滅佛的帝王為北周武帝，從「武器」與「士兵」即可推知其滅佛的考量與戰事有關，因此答案為(B)。

    14.資料一介紹衛所兵制的特色與運作，著眼於制度本身的說明；資料二說明衛所兵制的缺失，強調其未經籌備、調查、實驗且管理不佳，著眼於管理上的問題，因此最適當的解讀為(A)。

    15.甲國應為西班牙的殖民地――菲律賓；乙國能重用華人擔任政府官員，可能為暹羅；丙國應為曾經屠殺華人的荷蘭殖民地――印尼，因此答案為(B)。

    16.兩則資料皆提到人口過多而造成耕地不足，使得人民生活貧苦，正確答案為(C)。

    17.(A)唐朝中國經濟重心加速南移，但尚未南移完成。(B)為正解。(C)唐代並未刻意將政治與經濟中心分離。(D)唐代運河皆在隋朝時興建完成。

    18.白江口之役中，日本與(B)百濟結盟，與唐、新羅聯軍對抗。

    19.地理大發現時期，最重要的貴重金屬為(B)白銀，歐洲人透過貿易方式傳入中國，使得明中葉貨幣改成銀銅雙本位制。

    20.從鮮卑大臣議論國政、操漢語引用儒學發表議論，即可推斷與北魏孝文帝的漢化政策有關，因此答案為(A)。

    21.題文所述的明朝遺民為(A)朱舜水。(B)曾赴唐遊學的新羅詩人。(C)唐朝揚州高僧，後赴日弘法。(D)日本遣唐留學生，曾在唐擔任多項要職。

    22.越南的明鄉人原是明朝遺民，在越南成立「明香社」，但在不斷混血及當地政權的強迫同化下，今已融入越南文化中，故答案為(B)。

    23.甲往東北、西南與東南亞遷移，應為明清時期；乙只有南遷，應為靖康之難後的人口移動；丙除了南移外，另有往西北方向移動者，故為永嘉之亂後的人口移動。三次人口移動的先後次序為(A)丙乙甲。

    24.題文提到中國的君主能夠調停國際糾爭，並能冊立分封西域各部族領袖，可推知為唐代前期的天可汗體系，因此答案為(B)。

    25.此制度係針對雲貴地區的苗蠻部族，可推知為清雍正實施的「改土歸流」政策，廢除原本的土司制度改派流動官吏治理當地，與「因俗而治」的政策不符，因此答案選(B)不選(A)。

    26.(A)為正解。(B)從「必置重典」可知是重罪。(C)主要是禁止漢人、朝鮮人進入東北。(D)題文資料中無法判斷。

    27.中原與北方游牧民族的貿易地點稱為(A)榷場。(B)管理海上對外貿易的機構，即今日的海關。(C)古代供傳遞軍事情報官員途中食宿、換馬的場所。(D)唐朝管理祆祠的官府機構。

    28.根據題文，森安孝夫認為唐朝在某事件後已武力大失，盛況不再，因此這個事件□□最可能是(A)安史之亂，結束唐朝盛世。

    29.兩則資料都提到唐代賦稅倚賴浙江東西與江南地區，反映出經濟重心南移的現象，江南賦稅收入較北方為高，因此答案為(B)。

    30.從元代建築遺跡與數量眾多的伊斯蘭教、古基督教石刻，推測此城市為(A)泉州，在元朝時為當時世界最大的港口。(C)廣州在唐代也有許多僑居的外國人，但當時少有基督徒，且港口設備在南宋抗元戰爭中破壞，因此地位為泉州所取代。

    31.從四川總督的上奏內容可知，當時四川地廣人稀，竟「無可耕之民」，主要原因是經歷數次動亂與明末流寇張獻忠的「屠蜀」，造成人口銳減，因此答案選(C)不選(D)。

    32.原刑法裡的「殺傷」記載「殺人者死」，但蒙古人毆死漢人時卻「斷罰出征」，即停止罪刑改為隨軍出征，可見蒙古的種族歧視政策亦影響到司法的判決，因此答案為(D)。

    33.(A)明代長期海禁及清初海禁，都嚴重影響正式的對外商貿機能；規模小、地點多、機動強的走私貿易，取而代之。(B)西班牙人、(C)阿拉伯人都是欲與中國貿易的對象，不致於打擊中國港口發展。(D)明清時期的日本從戰國時代進入鎖國，不會影響中國沿海貿易發展。

    34.資料一以儒家孝道觀念批評佛教徒出家為不孝的行為；資料二認為世間本無生死輪迴之事，主張人應安於自然。綜合兩者，可見佛教在傳教過程中與中國文化產生的衝突問題，因此答案為(D)。(A)(B)(C)兩則資料皆未有相關的討論。

    35.此時期經濟重心已經南移，加上南北之間有政治上的對峙，因此可推知為靖康之難後的南宋時期，故答案為(C)。

    36.蘇軾認為每年耗費金錢與絲織品去餵養二虜，是為「既往之咎」，可見他反對長期以來對外族使用的歲幣策略，並認為「二虜未去」則天下不可能長治，因此答案為(B)。

    37.此以歲幣維持與外族的和平策略源自於宋真宗時的(A)澶淵之盟。

    38.北宋每年以歲幣維繫和平的外族對象為(C)遼與西夏。

    39.(A)亦為解決財政問題。(B)為正解。(C)從題文中無法判斷。(D)朝貢貿易屬於官方獨占的海上貿易事業。

    40.(C)為正解。(A)為 15 世紀末歐洲人所開啟。(B)(D)與鄭和下西洋無關。

    41.(C)應是北魏太武帝。(D)梁武帝崇信佛教，曾三次捨身同泰寺。

    42.(C)中原文化隨著僑人移往南方，因此與南方文化產生交融。

    43.假宗教起事的民變有臺灣的(A)西來庵事件、東漢的(C)黃巾之亂、元末的(D)白蓮教之亂。(B)為異姓諸侯的亂事。(E)政府打壓佛教的事件。

    44.苻堅統一北方建立前秦，與南方的東晉對峙，原本聲勢大好，但苻堅卻發動肥水之戰進攻南方，沒想到被北府兵以寡擊眾，前秦潰敗而亡國，北方再度分裂，直至鮮卑人建立北魏，進入北朝，南方東晉則持續偏安江南，直至劉宋開啟南朝政權。

    45.(B)資料二說明中原戰亂而造成大批人士遷居江南。(D)「洛京傾覆」使得中原人士避居江南，但南方人口尚未超越北方。'
