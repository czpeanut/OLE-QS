  stem: 「胡人統治者招募當地豪強加入軍隊，更改將領的郡望與姓氏，規定所有軍士從將領之姓，最後賜予土地，把將領和土地結合在一起，藉此維繫當地胡漢民族的人心，這個集團也成為一個全新的政治共同體。」有關此集團的敘述，下列何者正確？
  options:
  - label: A
    content: 引發北方軍鎮不滿，引發內亂而導致政權分裂
  - label: B
    content: 當地是指「關中地區」，為南方政治與經濟中心
  - label: C
    content: 導致胡人將領成為手握重軍的節度使，成為唐朝政權安定隱憂
  - label: D
    content: 首創於西魏宇文泰，形成軍事、政治與經濟整合的「關隴集團」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述，這個集團係胡漢民族融合的結果，應為西魏宇文泰所創的關隴集團，後成為隋唐開國君臣的重要主力，因此(D)為正解。(A)指北魏晚期的六鎮之亂。(B)關中地區為西魏的政治中心。(C)指安史之亂的背景，但此時關隴集團已經衰微。
