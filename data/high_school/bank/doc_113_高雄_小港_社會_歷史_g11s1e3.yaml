  stem: 關於阿拉伯對西方文明的影響，歷史學者分析「由於阿拉伯國家在鼎盛時期的領土較廣，東至波斯、西至西班牙，把它分為東、西兩段來敘述是較為方便。東阿拉伯伊斯蘭國家在初期和中期是扮演一個比西阿拉伯伊斯蘭國家更重要的角色，把從世界各處的科學知識吸收，並加上自己的貢獻。西阿拉伯伊斯蘭國家即□□哈里發王朝，即建都伊比利半島上的哥多華王朝。西哈里發在西元 10、11 世紀，把阿拉伯伊斯蘭國家所得的科學知識傳回歐洲，引發歐洲 14 世紀後的○○。扮演上述的雙重角色，即是伊斯蘭國家在科學史上的重大貢獻。」關於上文，下列哪些解釋是正確的？
