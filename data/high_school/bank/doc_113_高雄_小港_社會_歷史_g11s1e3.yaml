  page: 2
  stem: 伊斯蘭的「Jihad」，原意並非單指戰爭，而是「按神所期望的方式奮發」，為了維護伊斯蘭的事業而進行的一切努力與抗爭，這也是伊斯蘭教徒的宗教義務。少數什葉派穆斯林甚至將之視為五功之後的「第六功」。請問「Jihad」的觀念開端於何時？
  options:
  - label: A
    content: 穆罕默德避居麥地那時期，為凝聚信眾與維護伊斯蘭勢力而衍生的理念
  - label: B
    content: 穆阿維亞王朝時期，為積極向外擴張而宣傳的理念
  - label: C
    content: 塞爾柱突厥崛起時，以「伊斯蘭捍衛者」自居，藉此理念強化穆斯林對其政權的支持
  - label: D
    content: 三大火藥帝國崛起時，鄂圖曼土耳其為突顯自身政權的「正統性」所喊出的口號
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '「Jihad」原意為「為真主而奮鬥」，包括內心修行與對外抗爭，是穆斯林的重要宗教觀念。此理念最早出現在穆罕默德遷居麥地那後，當時面臨敵對勢力威脅，他強調信徒需團結抗爭、維護社群與信仰，作為凝聚力量的手段。之後歷代穆斯林政權雖多加以政治運用，但這個觀念的核心精神，是在穆罕默德時期，配合宗教信仰與實際處境所形成的，故選(A)。

    15.17 世紀的荷蘭稱霸海權，有「海上馬車夫」之稱，因此英國多次通過《航海法》，目的在(B)應付荷蘭的競爭。

    16.14 世紀時，伊斯法罕歷經蒙古與帖木兒入侵，城市衰敗。直到薩法維帝國的阿拔斯一世於 17 世紀初遷都至此，積極推動都市建設，興建清真寺、市集、皇宮與花園，使伊斯法罕重現榮景，並成為伊斯蘭世界最繁榮的城市之一，贏得「伊斯法罕半天下」的美譽，故選(C)。

    17.西敏司於《甜與權力》中探討蔗糖在全球資本主義體系中的角色，強調其生產與消費如何形塑殖民秩序與社會階級。他的田野調查主要集中於加勒比海地區的西印度群島（如牙買加、波多黎各），該地自 17 世紀起為歐洲殖民者經營蔗糖種植園的區域，並廣泛依賴非洲奴工，故選(A)。

    18.16 世紀的歐洲物價明顯提升，主要原因是大量中南美洲白銀流入，形成的「物價革命」，因此答案為(B)。(A) 18 世紀後半葉後；(C) 1618 ～ 1648 年；(D) 13 世紀，以上三者的時間與題文不符。

    19.阿拔斯王朝不再獨厚阿拉伯人，故選(C)。(A)從附表來看，阿拔斯王朝仍獨尊穆斯林的權益。(B)從遜尼派統治到什葉派治國。(D)奧米亞王朝已擴及伊比利半島，境內有許多非阿拉伯民族。

    20.19 世紀在英國殖民統治下，印度傳統社會與文化遭受挑戰，部分受西方教育的知識分子於是開始反思民族文化的價值。以孟加拉地區為中心的知識運動，強調藉由教育、文學與宗教改革重建印度自信，掀起文化復興風潮，史稱「孟加拉文藝復興」，故選(C)。

    21.題文的著作在分析中南美洲白銀對世界與中國的影響，(A)(C)(D)皆是可能的議題，僅(B)日本鎖國的成因與中南美洲白銀的流通無關。

    22.從部分共識內容可推知此國際會議為 1884 年的柏林西非會議，正確答案為(C)。(A)確立瓜分非洲的「有效占領」原則。(B)由德意志帝國首相俾斯麥所主持。(D)與比利時國王合作的是美籍記者史坦利。

    23.(A)蒙兀兒開國者巴布爾自認為帖木兒與成吉思汗的後裔，非阿拉伯帝國繼承者。(C)泰姬瑪哈陵是沙賈汗為愛妻所建，結合印度教與伊斯蘭的建築風格。(D)奧朗吉步全力推動印度的伊斯蘭化，導致叛亂四起，嚴重削弱帝國實力。

    24.(A)英國的羊毛紡織品在亞洲的銷售不佳。(B)早在上古羅馬帝國時期，歐洲人已接觸過東方的香料。(D)日本鎖國期間，仍能經由荷蘭人而掌握部分世界動態與西方知識。

    25.17 世紀荷蘭拓展北美與臺灣殖民地時，兩地出產的特殊商品中，相同的為(B)獸皮。(A)美洲商品。(C) 17 世紀時，兩地皆未生產棉花。(D)產自東南亞，北美與臺灣皆無生產香料。

    26.1730 年代以前的英國沒有人穿著棉襪，這是因為棉織品尚未傳入英國，後來自印度輸入棉布後帶動工業革命的展開，加上七年戰爭後英國控制印度大部分的領土，使棉花輸入英國的量更多，故選(C)。

    27.(C)地理大發現後，東方商品隨著歐、亞商貿交流愈趨頻繁而於歐洲社會日漸增多，影響歐洲人的生活形態，並助長歐洲的異國情調與時尚風潮，形成「中國風」的熱潮，其中又以法國最為流行，但此風潮在 1800 年前後沒落，「歐洲意識」逐漸形成，亞洲圖像也從正面過渡為負面評價。

    28.地理大發現後，西方國家的海外拓殖在非洲即遇到阻礙。北非為鄂圖曼帝國所控制，使歐洲國家難以靠近，除了對撒哈拉沙漠以南的非洲大陸所知甚少外，同時顧忌當地的熱帶氣候和地形、疾病的阻擋，直到奎寧出現後，才帶動前往非洲探險的風潮。因此，「敵對勢力」與「征服地區」應是(A)鄂圖曼帝國；西非。

    29.甲國為賴比瑞亞，乙國為衣索比亞，兩國皆為「非洲大獵」後悻存的獨立國家，(D)為正解。

    30.可可是中南美洲原生植物，阿茲特克人曾以可可豆作為交易媒介，並製作成加入辣椒與香料的冷飲，具有提神作用。後來傳入歐洲，受到貴族歡迎，加入糖與牛奶熱飲，逐漸發展為今日的巧克力。巧克力依可可含量比例不同，風味苦甜各異，現今也常作為情人節傳情達意的象徵，故選(C)。

    31.甲為鄂圖曼帝國，乙為薩法維帝國，丙為蒙兀兒帝國。薩法維帝國，奉行什葉派伊斯蘭教，並與遜尼派的鄂圖曼帝國對抗，故選(C)。(A)三大帝國雖有游牧背景，但建國後皆發展火器軍隊與中央集權制度，並非僅靠騎兵優勢獨霸一方。(B)甲帝國直至第一次世界大戰後才瓦解。(D)宣稱繼承「阿拔斯哈里發政權」的是鄂圖曼帝國。

    32.題文為 1095 年羅馬教宗烏爾班二世號召十字軍東征的演說，「來自波斯的民族□□□□」指的是(B)塞爾柱突厥人。

    33.「東方兄弟的國家」指拜占庭帝國，原是教宗號召十字軍拯救的對象，但在第四次東征時受到威尼斯商人煽動，反而劫掠君士坦丁堡，重創拜占庭帝國，使得東、西方裂痕更深，最後拜占庭帝國於 15 世紀時為鄂圖曼土耳其人所滅，正確答案為(C)。

    34.三則資料說明在中南美洲的重大傳染病，造成印第安人大量死亡，因此○○為(D)天花。

    35.天花為舊大陸傳入新大陸的疾病，資料二的「主人」來自舊大陸白人，本身應具有一定程度的免疫力，因此比起印第安人較不容易感染天花，(C)為正解。

    36.資料二的「主人」來自歐洲，故為(A)半島人。(B)指土生白人。(C)白人與印地安人的混血。(D)非裔與原民混血者，屬殖民社會底層階級。'
