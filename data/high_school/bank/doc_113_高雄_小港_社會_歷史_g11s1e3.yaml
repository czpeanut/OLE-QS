  stem: 中古後期，歐洲學者熱衷於伊斯蘭文明的研究，甚至納入大學課程。到了 16、17 世紀，阿拉伯文持續受到重視，請問阿拉伯文受到重視的原因為何？
  options:
  - label: A
    content: 阿拉伯文成為歐洲官方文字
  - label: B
    content: 鄂圖曼土耳其成功擴張至神聖羅馬帝國境內，阿拉伯文備受重視
  - label: C
    content: 歐洲商人與伊斯蘭世界貿易時，被迫以阿拉伯文進行溝通
  - label: D
    content: 阿拔斯王朝時期，「翻譯運動」將大量希臘羅馬古典文籍翻譯成阿拉伯文
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中古後期歐洲官方文字為拉丁文，文藝復興後各地方言陸續興起，阿拉伯文從未成為歐洲官方文字過。(B)鄂圖曼土耳其並未成功擴張至神聖羅馬帝國境內。(C)歐洲與伊斯蘭世界的貿易與交流，可經由翻譯溝通，並未規定使用阿拉伯文。
