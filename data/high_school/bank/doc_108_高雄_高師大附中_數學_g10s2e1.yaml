- id: doc_108_高雄_高師大附中_數學_g10s2e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 已知 $\frac{1}{\sin\theta} - \frac{1}{\cos\theta} = \frac{3}{4}$，則 $\sin\theta\cos\theta =$＿＿＿＿。
  answer:
  - $\frac{4}{9}$
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: MA-2-4-2
      book: 數學2（必修）
      chapter: 三角比
      title: 廣義角三角比與極坐標
      std: true
    textbook: 數學2（必修） 廣義角三角比與極坐標
    pattern:
      key: MA-2-4-2:T05
      name: 三角比平方和差知一求多
    labeled_by: agent
    label_confidence: high
    label_note: 題幹條件「1/sinθ - 1/cosθ ＝」等號右側數值漏字，無法獨立計算
    fixed_by: agent
    fix_note: （人工修正：補齊等號右側數值 3/4 並補齊解析）
  difficulty: 2
  explanation: 設 $t = \sin\theta\cos\theta$。由 $\frac{\cos\theta - \sin\theta}{\sin\theta\cos\theta} = \frac{3}{4}$ 兩邊平方得 $\frac{1 - 2t}{t^2} = \frac{9}{16} \Rightarrow 9t^2 + 32t - 16 = 0 \Rightarrow (9t-4)(t+4) = 0$。因 $|t| = \frac{1}{2}|\sin 2\theta| \le \frac{1}{2}$，故 $t = \frac{4}{9}$。
