  section: 2
  number: 4
  type: fill
  page: 1
  stem: 已知 $180^\circ \le \alpha \le 360^\circ$，$180^\circ \le \beta \le 360^\circ$，且 $\sin\alpha$、$\tan\beta$ 為方程式 $3x^2 - 4x - 4 = 0$ 的兩根，則 $\tan\alpha \times \cos\beta =$＿＿＿＿。（答案有兩個）
  answer:
  - ±$\frac{2}{5}$
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: MA-2-4-2
      book: 數學2（必修）
      chapter: 三角比
      title: 廣義角三角比與極坐標
      std: true
    textbook: 數學2（必修） 廣義角三角比與極坐標
    pattern:
      key: MA-2-4-2:T05
      name: 三角比平方和差知一求多
    labeled_by: agent
    label_confidence: high
    label_note: 題幹「180° ≤≤ 360°」中 β 出現亂碼
    fixed_by: agent
    fix_note: （人工修正：修補題幹亂碼並補齊解析）
  difficulty: 3
  explanation: 解 $3x^2-4x-4=(3x+2)(x-2)=0$ 得兩根 $-\frac{2}{3}, 2$。因 $|\sin\alpha| \le 1$，故 $\sin\alpha = -\frac{2}{3}$、$\tan\beta = 2$。由 $\alpha \in [180^\circ, 360^\circ]$ 得 $\cos\alpha = \pm\frac{\sqrt{5}}{3}$、$\tan\alpha = \mp\frac{2}{\sqrt{5}}$；由 $\beta \in [180^\circ, 360^\circ]$ 且 $\tan\beta > 0$ 知 $\beta$ 在第三象限，故 $\cos\beta = -\frac{1}{\sqrt{5}}$。因此 $\tan\alpha\cos\beta = \pm\frac{2}{5}$。
