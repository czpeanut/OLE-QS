- id: doc_112_屏東_屏東高中_社會_公民與社會_g10s2e3_s1_39
  section: 1
  number: 39
  type: single
  page: 10
  stem: 此事件涉及的勞動權利，下列敘述何者正確？
  options:
  - label: A
    content: 機師工會須經由資方同意後才能發動罷工行為
  - label: B
    content: 機師工會運用集體勞動權利爭取個別勞動權利
  - label: C
    content: 機師若最後進行罷工，其行為屬勞動三權中的「團結權」
  - label: D
    content: 機師工會最後是依《工會法》與雇主進行勞動待遇之協商
  group_stem: '桃園市機師職業工會於 2024 年 1 月 22 日，針對長榮分會與長榮航空公司間勞資爭議的罷工投票，進行開票，最後確定工會長榮分會取得合法罷工權，理事長表示，將朝春節前後啟動罷工行動，規劃細節將在 25 日理事會討論。長榮航空則發聲明，呼籲工會優先考慮旅客權益，以理性務實態度繼續勞資協商。

    長榮航空機師主要訴求為爭取調薪 20 ％、提高外站津貼至每小時 6 美元、要求公司禁用違法外籍機師。機師工會指出，長榮航空近 2 年獲利大增，盈餘屢創紀錄卻處處苛扣成本，航空地勤人力嚴重流失短缺，導致多起安全事故。

    長榮航空與機師工會於 1 月 24 日在桃園市勞動局展開第一次協商，達成部分共識，而後於 1 月 28 日在行政院、勞動部、交通部及地方勞動局協助下，並針對勞資爭議逐項達成協議，並於行政院正式簽約。達成共識後，原訂 31 日協商會議就不再召開，也將取消原預計於春節、清明連假舉行的罷工行動。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)工會罷工毋需經由資方同意。(B)罷工為集體勞動權之做法，爭取調薪、提高外站津貼則為個別勞動權之內容，為正解。(C)罷工屬於「爭議權」。(D)協商法源為《團體協約法》。
