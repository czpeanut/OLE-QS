- id: doc_112_屏東_屏東高中_社會_公民與社會_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 桃園市碩果僅存、位於龜山區的協和磚廠八卦窯，因地主無意保存，加上居民有通行需求，原面臨拆除的命運，經文史團體疾呼保留，市府文化局去年緊急列為暫定古蹟，經《文化資產保存法》的文化資產審議通過，日前公告「龜山樟腦寮協和磚廠」為歷史建築，對於相對指定古蹟保存的行為，若以所有權的觀點解讀，下列何者正確？
  options:
  - label: A
    content: 地主先取得土地，保存古蹟行為侵害所有權的優先性
  - label: B
    content: 地主可依所有權的絕對性向政府主張其不可侵犯
  - label: C
    content: 基於文化保存的公益目的可對地主的所有權加以限制
  - label: D
    content: 地主可主張妨害除去請求權，依法請求政府除去限制
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)《憲法》第 15 條規定人民之財產權，應予保障。然而，為了維護公共利益，國家必須藉由正當程序對所有權加以限制，因此，所有權並非受到絕對的保護，此乃基於所有權社會化原則，如政府有時會為了增進公共利益而對個人的所有權進行部分限制，例如：興建捷運、高鐵、開闢馬路而徵收人民的土地。(C)基於文化保存的公益目的，可對地主的所有權加以限制，為正解。
