- id: doc_112_屏東_屏東高中_社會_公民與社會_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 雖然國內已有許多勞動法規的保障，但許多企業為了節省成本巧立名目扣員工薪水，甚至無故解聘員工，導致許多勞動問題的產生，因此工會的組成對勞工權利的保障相當重要。請問下列有關「工會」的敘述，何者正確？
  options:
  - label: A
    content: 目前所有類別的勞工都能依據《工會法》組成工會
  - label: B
    content: 工會是集體勞動權的基礎，才能運用協商權和爭議權
  - label: C
    content: 須有 20 名員工連署發起才能組成工會，組成門檻偏高
  - label: D
    content: 工會的組成須經由資方和勞動主管機關的核准才能成立
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依照現行《工會法》第 4 條規定，現役軍人與國防部所屬及依法監督之軍火工業員工，不得組織工會。(B)工會依據《團體協約法》可與雇主針對工資、工時等工作條件及勞資關係事項的權利作協商，此為協商權；當工會與雇主協商不成，可依《勞資爭議處理法》申請勞資調解，調解不成可行使爭議權，為正解。(C)《工會法》第 11 條規定組織工會應有勞工 30 人以上之連署發起，組成籌備會辦理公開徵求會員、擬定章程及召開成立大會。(D)工會為法人，其成立毋須經由資方核准；其主管機關在中央為勞動部，在直轄市為直轄市政府，在縣（市）為縣（市）政府。
  tags:
    unit:
      code: CI-2-6-2
      book: 公民與社會2 正義與法治
      chapter: 生活中的勞動參與
      title: 勞動法規
      std: true
