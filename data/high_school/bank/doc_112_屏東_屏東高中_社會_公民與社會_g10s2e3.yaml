- id: doc_112_屏東_屏東高中_社會_公民與社會_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 明介是一個新手檢察官，卻剛好被分配到一個案情複雜的凶殺案，不過明介不畏辛勞，展開調查，誓言伸張正義。以下是明介的行為，請問哪一項可能「違反」了《刑事訴訟法》的規定？
  options:
  - label: A
    content: 向法院聲請搜索票後，指揮警察前往當事人住家搜索
  - label: B
    content: 記者來電詢問時，因為偵查不公開原則，不洩漏資訊
  - label: C
    content: 未等待指定的律師到達，趁當事人記憶深刻，馬上開始訊問
  - label: D
    content: 即使不小心聽到當事人與律師的對話，也沒有記錄作為證據
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)為符合《刑事訴訟法》的規定。(C)此舉侵害被告的緘默權；緘默權是指在刑事訴訟中被告人、犯罪嫌疑人所享有的可以對司法人員的訊問保持沉默，而不自證其罪的權利。
