  group_stem: '近日因金曲獎擬邀請藝人甲男出席紀念已逝藝人李玟，使其過去的生活與形象又再度被檢視。甲男的前妻乙女曾寫下超過 5,000 字的長篇信件，控訴男方多年來的各種惡行。以下是為該文章之擷取內容：

    「現代的女性不像從前的女性沒有教育的機會，在家庭中沒有選擇的只能擔任妻子母親的角色。我們很幸運的有機會接受高等教育，有知識，學識，也有機會見識，也有謀生能力，也同樣能為社會貢獻。無論是過去或是現代的女性，選擇為家庭全心付出當家庭主婦，雖然實質上是屬於「無酬」的工作。但，這只是家庭成員角色的分配，也是家中重要的支撐，甚至是一個全年無休，24 小時多重角色（例如：保母∕老師∕打掃阿姨∕司機∕總管∕伴侶∕特助等工作）。這份工作的薪酬應該加總計算加上以你的能力不外出工作的機會成本。這應是所有家庭主婦透過自己努力應得的薪酬，而不是被贈與或施捨的。被分配到這個角色的人不應該是理所應當要永遠沒有經濟能力或積蓄，而擔任在外工作的那一方獲得所有的利益和權利。這樣會形成不對等的關係，也會讓女性處於弱勢，即便男生出軌或家暴也難以有話語權。

    我身邊的家庭主婦很多戶頭裡都沒有自己的積蓄或收入，平時用先生賺來的錢也會感到不好意思，用錢也會自己看看先生的臉色，也絕不敢開口說想要照顧自己父母。女性如果開口聊到錢的話題就會被我們的社會譴責為市儈或是質疑是不是拜金女，只是圖男生的錢。對於長期都以家庭為重，沒有在外工作的女性，如果沒有做錯什麼卻因為男方無正當理由而被迫離婚，通常會不知所措。……

    嫁給你這麼多年，被你和家人不斷地懷疑……羞辱和冷暴力。一開始就被逼著簽署不對等的婚前協議，你要保護你婚前的財產，我能夠理解也完全接受，但婚後的財產是我們共同的努力，也是我們各自做好份內的工作而得來的，房子在你名下，車子在你媽的名下，財產轉移得很乾淨，深怕我占到你任何的『便宜』。」

    請就該文章擷取之內容回答下列問題：'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)家務勞動因屬於無酬勞動，易被低估價值。(B)應該是來自社會大眾的性別偏見與歧視，以及制度上的不平等所致。(D)依文中所述，貪財形象之標籤易被貼於女性身上，因為女性較多從事家務勞動，無經濟收入，若要求自由處分金等收入，則容易被歸為貪財之形象。
