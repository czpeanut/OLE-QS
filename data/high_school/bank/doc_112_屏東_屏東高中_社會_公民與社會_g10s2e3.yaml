- id: doc_112_屏東_屏東高中_社會_公民與社會_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 小高和小葳有婚姻關係，兩人婚後生下小佑，並收養一女小芳；其中小佑已結婚並育有一子洋洋。小高和小葳因晚年投資失利欠下百萬債務，後皆因年事高而逝世，留下一棟房子。小佑和小芳面對這個情況，按現今規範，下列說明何者較為正確？
  options:
  - label: A
    content: 若二人要拋棄繼承，表示不繼承債務和房子，須以書面通知債權人後才會產生效力
  - label: B
    content: 若遺產不夠清償債務，繼承人無需負擔不足的部分，此為有限清償責任的限定繼承
  - label: C
    content: 若父母有遺留遺產，除小佑和小芳外，洋洋也可因代位繼承的關係，共同均分遺產
  - label: D
    content: 因只有一棟房子，且小佑為親生子女，又依傳子不傳女習俗，應只由小佑繼承房子
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
