  stem: '柏德與班班結婚後育有一女，並收養一子。婚後柏德出外上班賺錢，班班在家照顧小孩，並約定好每個月由柏德支付 10,000 元自由處分金給班班花用。但柏德發現自己還是忘不了高中的初戀家漢，於是決定和班班協議離婚。在班班得知柏德要離婚後，提出了剩餘財產差額分配的請求。但在未完成離婚手續之前，柏德竟出車禍死亡。傷心欲絕的班班，在整理遺物時，發現了柏德留下的遺囑，卻發現遺囑上面寫到其過世後要將所有的遺產留給家漢。下表為柏德與班班兩人的財產狀況，請問下列敘述何者正確？

    |  | 柏德 | 班班 |

    | --- | --- | --- |

    | 婚前財產 | 60 萬元 | 100 萬元 |

    | 婚後財產 | 180 萬元 | 40 萬元 |

    | 債務 | 20 萬元 | 0 |'
  options:
  - label: A
    content: 兩人結婚後，婚後財產合併計算為共同財產，債務亦須共同分擔
  - label: B
    content: 班班主張剩餘財產差額分配請求權時，可從柏德身上獲得 40 萬
  - label: C
    content: 柏德過世後，若無其他親屬，則文中班班與其子女皆享有繼承權
  - label: D
    content: 雖然遺囑交代遺產留給家漢，但班班可主張應繼分保障自己權利
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依題文，兩人應是採用法定財產制。(A)婚後財產仍各自使用、收益、處分，債務也各自清償。(B)「剩餘財產分配請求權」是指先計算出兩人的婚後財產扣除債務後相加均分，一人可得到 100 萬元，婚後財產低於平均的一方，有權要求另一方給予差額補到平均值，因此班班可從柏德身上獲得 60 萬元。(C)班班為配偶是當然繼承人，子女為第一順位的血親繼承人，為正解。(D)應是主張特留分；《民法》的特留分是指保留給每位繼承人有最低繼承比例的分額，避免因為偏愛等原因讓遺產只留給特定一人，此為透過法律保障遺產的分配方法，確保公正性。
