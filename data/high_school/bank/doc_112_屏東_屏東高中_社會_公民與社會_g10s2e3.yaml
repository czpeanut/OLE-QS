  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依《勞動基準法》規範，勞雇雙方議定的薪水不得低於基本工資，因此並非完全遵守契約自由原則。(B)罷工是為爭取自身或行業勞動權益，難免會影響民眾，但透過此方法，民眾也才能認知該全體勞工之貢獻。(D)有好的勞動條件將能提供更好的服務，每個人都有權捍衛自己的權利。
