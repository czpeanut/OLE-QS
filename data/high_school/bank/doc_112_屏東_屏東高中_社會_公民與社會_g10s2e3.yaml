  stem: 關於機師工會欲採取罷工行動的分析，下列何者正確？
  options:
  - label: A
    content: 工資待遇屬契約自由，若不滿應以更換工作來改善
  - label: B
    content: 儘管勞工有抗爭權利，但罷工不應該影響多數民眾
  - label: C
    content: 長榮與政府單位正面回應機師罷工，可見抗爭權能發揮助益
  - label: D
    content: 機師應該有為大眾服務的精神，故不應該爭取自身的勞動權
