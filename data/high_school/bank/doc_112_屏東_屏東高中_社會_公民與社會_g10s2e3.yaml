  type: single
  page: 1
  stem: 市面上有許多徵求家教的廣告中會載明家教老師「限國立大學畢業」，私立大學畢業的阿和覺得這個規定造成對私立大學畢業生工作權上的排擠，應要有限制。請問阿和的主張是否合理？
  options:
  - label: A
    content: 合理，因為老師的學歷與能力並沒有相當的關聯性
  - label: B
    content: 合理，因為《憲法》的最高性，不得牴觸《憲法》的平等原則
  - label: C
    content: 不合理，家教工作應具備教學專業，私立大學無相關培訓故不符合
  - label: D
    content: 不合理，根據契約自由原則，人民可以自由決定契約相對人的條件
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依據《民法》契約自由原則，是指在不超過法律強制或禁止規定、公共秩序及善良風俗的範圍內，讓當事人自由約定契約內容。如文中要求家教老師之學歷，並不違反公序良俗或禁止規定，故選(D)。
