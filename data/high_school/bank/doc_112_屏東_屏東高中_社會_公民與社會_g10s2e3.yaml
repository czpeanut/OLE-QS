  stem: 位在屏東市的衛福部南區老人之家，被護理師出面指控保健科科長要求提早半小時上班，未給予加班費。曾有護理師去勞工局詢問自身權益，卻被主管強迫要求簽和解同意書，放棄加班時數，否則就個別約談，並拒絕給予應有的 3 天國定假日。立委要求勞動部儘速介入勞檢，也呼籲衛福部全面檢討轄下社會福利機構的勞動契約爭議。關於上述案例所涉及的護理師勞動權益問題，下列敘述何者正確？
