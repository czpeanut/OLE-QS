- id: doc_112_屏東_屏東高中_社會_公民與社會_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 根據《少年事件處理法》的規定，對少年犯罪的處理，分為刑事制裁及保護處分兩種。下列何者是適用保護處分的事件？
  options:
  - label: A
    content: 16 歲少年犯殺人罪，經移送檢察署檢察官依法處理
  - label: B
    content: 15 歲少年無正當理由經常攜帶刀械，參加不良幫派
  - label: C
    content: 在未成年時犯殺人罪，法院審理時已年滿 20 歲
  - label: D
    content: 少年犯傷害罪，經調查認為其犯罪情節嚴重者
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)適用少年刑事事件。(B)適用少年保護事件；當少年涉及犯罪，或者是從事某些行為而成為法律上的「曝險少年」時，就會先由《少年事件處理法》的程序來處理，包括：無正當理由經常攜帶危險器械；有施用毒品或迷幻物品之行為而尚未觸犯刑罰法律；有預備犯罪或犯罪未遂而為法所不罰之行為。因此「15 歲少年無正當理由經常攜帶刀械，參加不良幫派」符合曝險行為的內涵，適用保護處分。
  tags:
    unit:
      code: CI-2-5-3
      book: 公民與社會2 正義與法治
      chapter: 生活中的刑事保障
      title: 少事保護
      std: true
