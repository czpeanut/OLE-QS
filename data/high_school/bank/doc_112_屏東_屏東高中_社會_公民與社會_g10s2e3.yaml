  stem: '阿冬買了一顆籃球放在班上，想說可以讓班上同學使用，增進大家的感情，但他希望大家拿球之前先問過他，也要珍惜使用。某天籃球不見了，有同學回想起說最後一次看到籃球是前一天下午小天和阿超一起拿球跑去操場。於是大家找他們釐清狀況：

    阿冬：「你們怎麼沒有先問過我就拿球去打？球現在在哪裡？」

    小天：「我明明有把球放回來，後來是誰拿走了？快點拿回來！」

    阿超：「因為明天就要比班籃了，我們想要加練，沒想到你會請假所以我們就先直接借走了……。」

    阿正：「你們沒有問過阿冬就拿球，現在球不見了，應該要想辦法還給他！」

