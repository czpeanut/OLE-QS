- id: doc_112_屏東_屏東高中_社會_公民與社會_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 乙骨與里香結婚時即約定共同財產制，婚後乙骨在外工作，里香則在家操持家務，下列敘述何者正確？
  options:
  - label: A
    content: 因里香在家沒有收入，可向乙骨主張要求自由處分金
  - label: B
    content: 各自管理婚後取得之財產收益，但負債必須共同清償
  - label: C
    content: 此財產制之約定以兩人口頭表示即具有完全之法律效力
  - label: D
    content: 若里香出車禍死亡，乙骨可以共同均分里香的婚後財產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為法定財產制的概念。(B)無論是財產或負債皆須共同處理。(C)以書面契約的方式約定，婚後須至法院登記才生效力。
  tags:
    unit:
      code: CI-3-1-3
      book: 公民與社會3 選擇與永續
      chapter: 契約自由與財產權保障
      title: 配偶財產規範
