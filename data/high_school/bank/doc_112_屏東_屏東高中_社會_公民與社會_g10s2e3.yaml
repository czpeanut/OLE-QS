  stem: 依我國《刑事訴訟法》規定，法官對於犯罪事實之認定，應依證據為之，若沒有證據則不得認定犯罪事實。有關證據裁判之敘述，下列何者正確？
  options:
  - label: A
    content: 當證據不明確時，應對被告作出有利判決，此為無罪推定原則
  - label: B
    content: 如果是經由合法取得的被告自白供述，就可以當作唯一的證據
  - label: C
    content: 我國採取證據排除法則，違法取得的證據不得作為判決依據
  - label: D
    content: 法官應依據自由心證原則，隨心所欲認定證據的證明能力進行審判
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此應為罪疑唯輕原則。(B)被告或共犯之自白，不得作為有罪判決之唯一證據，仍應調查其他必要之證據，以察其是否與事實相符。(D)司法案件之事實的認定，都要依照證據判斷；而自由心證原則是指證據讓法官相信事實是否存在的程度（即證明力），且不得違背經驗法則及論理法則所做的衡斷，並非隨意審判。
  tags:
