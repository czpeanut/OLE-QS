  type: single
  page: 1
  stem: 新聞報導：「根據行政院主計總數 2020 年薪資統計，女性需多工作 51 天，才能與男性達到相同年薪，因此 2021 年的『同酬日』訂為 2 月 20 日。」此報導主要呈現的問題為何？
  options:
  - label: A
    content: 女性面對玻璃天花板
  - label: B
    content: 兩性薪資待遇不平等
  - label: C
    content: 社會輕忽家務勞動價值
  - label: D
    content: 女性勞動參與率較低
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「同酬日」的概念，突顯男女工資的差距，存在性別不平等意涵；而兩性平均薪資除受性別影響外，亦與工作性質、類型、年資、學經歷等因素有關，縮小兩性薪資差距為社會各界共同努力的目標，故選(B)。
