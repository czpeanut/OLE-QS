  stem: 我國主要以《民法》保障勞資雙方自行協商勞動條件的權利，但還額外制定了個別和集體勞動法規，對勞動條件設下限制，請問其原因「不包含」何者？
  options:
  - label: A
    content: 勞工人數眾多，與勞工站在同一陣線，能獲更多民意支持
  - label: B
    content: 在勞資雙方中，資方多居於強勢以致勞方的權益無法伸張
  - label: C
    content: 《民法》中關於勞資糾紛處理的規範尚有不足之處
  - label: D
    content: 為了平衡僱傭關係中勞工與雇主之間的權力不平等
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)訂定特別勞動法規，是為了保障勞動權益，與民意支持較無直接關聯。(B)(C)(D)皆為特別訂定勞動法規的原因。
