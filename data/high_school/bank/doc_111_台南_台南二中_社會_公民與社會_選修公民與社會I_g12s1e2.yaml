- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某國因國內外資金不斷流入房地產市場，使房價居高不下甚至不斷攀升，引起無力購屋者的不滿。於是，人民發起「巢運」，號召民眾夜宿在該國地價最高的住宅區，表達對高房價的抗議，並提出改革房產稅制、廣建社會住宅等訴求。政府在數日後對巢運的訴求做出回應，將研議修法的可行性。巢運結束後，房產稅制改革、社會住宅推動等團體相繼成立，表示將持續關注相關議題並監督施政。關於該國居住正義運動的屬性與發展，下列哪項詮釋最適當？
  options:
  - label: A
    content: 從社會運動轉變為與政府公私協力廣建社會住宅
  - label: B
    content: 從社會運動轉變為推動以直接民主決定改革方向
  - label: C
    content: 從社會運動轉變為競爭國會議席以實現政治主張
  - label: D
    content: 從社會運動轉變為利益團體以期實現運動的訴求
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)社會住宅乃是政府推動之社會福利工作之一。(B)(C)以直接民主決定改革方向，或是透過競爭國會議席實現政治主張，屬於政黨的功能，題幹中為利益團體。
  tags:
    unit:
      code: CI-S1-3-2
      book: 選修公民與社會I 現代社會與經濟
      chapter: 社會運動
