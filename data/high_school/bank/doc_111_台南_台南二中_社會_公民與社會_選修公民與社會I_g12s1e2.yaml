  stem: '假設某國民眾只生產消費 X 與 Y 兩樣東西，如果該國以 2020 年為基期，2021 年消費者物價指數（CPI）為 120，而該國 2020 ～ 2021 年的消費數量及價格如附表，請問表中問號應填入多少？

    | 年分 | X |  | Y |  |

    | --- | --- | --- | --- | --- |

    |  | 消費數量 | 價格 | 消費數量 | 價格 |

    | 2020 | 100 個 | 10 元／個 | 150 個 | 12 元／個 |

    | 2021 | 120 個 | 14.1 元／個 | 100 個 | ？元／個 |'
  options:
  - label: A
    content: '12'
  - label: B
    content: '13'
  - label: C
    content: '14'
  - label: D
    content: '15'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '假設 2021 年 Y 產品的價格為 X，將 CPI＝120 代入公式，

    120＝（14.1×100＋X×150）÷（10×100＋12×150）×100

    → 1410＋150X＝3360

    → X＝13，故選(B)。

    22.2021 年所得 60,000÷物價指數 120＝50,000。

    23.(A)未必能夠透過獲利填補減損的 GDP，發展石化產業時綠色 GDP 必定受到影響。(C)由題幹敘述無法推斷其社會成本的多寡。(D)其他方面的財政支出未必會減少。

    24.物價指數算法為（一籃子商品的當期價格×基期數量）÷（一籃子商品的基期價格×基期數量）×100，（40×10＋50×12）÷（30×10＋45×12）×100＝1000÷840×100＝119，故選(B)。

    25.(A)另有可能是「物價上漲」導致。(B)應是「物價上漲幅度大於勞工薪資」。(D) 2021 年 2 月 CPI 減少，並沒有逐年增加。

    26.名目工資÷消費者物價指數×100＝實質工資，40,000÷105×100＝38,095。

    27.代入公式：（一籃子商品的當期價格×基期數量）÷（一籃子商品的基期價格×基期數量）×100

    2020 年：（31×100＋50×50＋230×5）÷（30×100＋50×50＋200×5）×100＝6750÷6500＝103.8

    2021 年：（35×100＋70×50＋250×5）÷（30×100＋50×50＋200×5）×100＝8250÷6500＝126.9

    28.(A) 2020 年的物價指數為 103.8。(B) 2021 年的物價指數為 126.9。(C) 2020 年的物價膨脹率為 3.8 ％。

    29.購買力平價人均 GDP 下跌，表示其經濟可能處於萎縮狀態，國民所得減少或是物價水準提高。(A)購買力平價指數已將各國貨幣價值考量進去，逐年下跌代表其購買力減弱，物價水準可能處於上升狀態。(B)中國的購買力平價人均 GDP 超過巴西，表示其購買力優於巴西，物價水準應比巴西低。

    30.(A)以購買力平價指數計算，2020 年中國的物價水準上升幅度可能低於巴西。(B)應是國內物價水準「上升」。(D)中國不一定沒有相關問題，可能是遭到掩飾。

    31.大麥克指數（the Big Mac index），用來衡量不同貨幣相對於美元的價值差距，其以購買力平價為基礎，認為各國的匯率會自行調整，直到一籃子商品在不同國家的售價相同。(B)大麥克指數與物價水準為「正相關」，題幹說明日本與韓國的物價長期偏高，顯示大麥克指數會高於臺灣。(C)題幹並未提及卡達的大麥克指數，因此無法判斷。(D)大麥克指數與物價膨脹並沒有關聯。

    32.(D)臺灣的貨幣購買力高，是「物價」較低的緣故。

    33.(A)該事件並未涉及人身自由。(B)(D)應是強調「公共利益」。

    34.(A)須兼顧效益與公平正義，避免侵害少數人權益。(B)徵收土地有時涉及公共利益，因此仍有其必要性。(C)土地徵收是「由上而下」的政策。'
