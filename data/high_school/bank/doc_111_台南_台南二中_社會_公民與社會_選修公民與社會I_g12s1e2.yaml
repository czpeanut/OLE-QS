  stem: 臺灣早期的黨外雜誌、民主第四臺、民主電臺等另類媒體，到現在網路普及後有「南方電子報」、「苦勞網」、「公民行動影音紀錄資料庫」、「焦點事件」等媒體出現，呈現和主流媒體不同的媒體風格，對於這些另類媒體與主流媒體的比較，何種說明較為合適？
  options:
  - label: A
    content: 主流媒體和另類媒體均以營利為目的，但另類媒體廣告收入較少
  - label: B
    content: 主流媒體和另類媒體均為迎合大眾口味，但另類媒體報導較深入
  - label: C
    content: 主流媒體較少深入公共議題，另類媒體常為社會處境不利者發聲
  - label: D
    content: 主流媒體會從多元視角觀察，另類媒體大多呈現衝突對立的場面
  answer:
