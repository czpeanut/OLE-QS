- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s3_41
  section: 3
  number: 41
  type: single
  page: 10
  stem: 高三學生小南在複習公民課上過的內容，突然發現筆記裡，勞動市場供給變動的部分似乎出現了錯誤，所以他開始打電話詢問同學，請問下列何人的說法是正確的？
  options:
  - label: A
    content: 甲：因為高等教育普及化，學歷變得不重要，所以大家都早早投入職場，使勞動供給增加
  - label: B
    content: 乙：由於面臨少子化，所以未來投入勞動市場的人口降低，將會使勞動供給減少
  - label: C
    content: 丙：若大量引進外國移工，取代本國勞工的勞動力，則會使勞動供給減少
  - label: D
    content: 丁：在休閒與工作之間，若大多數人選擇休閒，就會有很多工作機會釋出，使勞動供給增加
  group_stem: '經濟行為通常指的是所生產的商品或服務，但也可以說是每個人早上起床工作後所發生的事。供給與需求，一如它們在商品市場扮演的角色，也是了解勞動市場的關鍵。在勞動市場，我們不談商品價格，而是有關每個工作者的工資或薪酬。就如同廠商生產的很多商品與服務有各自的市場，勞動市場也有很多不同的市場，如護士的勞動市場、消防員市場、電腦程式設計師市場等。但有一個主要的差異：在商品市場，企業是供給者，家庭和個人是需求者；但在勞動市場，家庭和個人是供給者，企業是需求者。

    勞動需求，是工資或薪酬與雇主所需勞務數量之間的關係。高工資容易使企業減少對勞務數量的需求，就如同較高的價格容易使消費者需求減少。廠商想賺錢，但如果勞動成本上升，就會想裁員。你現在可能已經想到，工資增加所減少的勞工需求量，取決於勞動需求的彈性。

    現在讓我們來思考勞動供給。再次重申，供給是一種關係，這裡是指工資與勞動供給量之間的關係。高工資通常意味著較高的勞動供給量，因為較高的工資會使工作更有吸引力。工資增加會使勞動供給量增加多少？同樣取決於「彈性」。

    對很多全職工作者（每週投入工作四十小時）而言，勞動供給是相當無彈性的；他們的工資增加 10 ％，工作時數的增加卻少於 10 ％（很多全職工作者沒有能力調整其工作時數，所以不容易估計他們如何看待工資上漲）。然而，對於兼職者或是家裡第二份薪水來源者而言，勞動供給是較有彈性的，工資增加 10 ％，通常會導致工作時數增加超過 10 ％。

    資料來源：《史丹佛給你最好懂的經濟學：個經篇》：最低工資是雙面刃，而工會的存在並不是壞事 https://www. thenewslens.com/article/121181'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)題幹並未提及學歷的重要性，且目前狀況是高等教育普及化，念大學與碩、博士人數變多，反而較以往延後進入勞動市場。(C)應是勞動供給「增加」。(D)若大多數人選擇休閒，表示勞動供給會減少。
