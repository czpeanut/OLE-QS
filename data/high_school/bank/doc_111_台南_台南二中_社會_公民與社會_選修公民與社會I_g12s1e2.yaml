  stem: 1970 年代開始，臺灣有一些另類媒體開始關注到社會處境不利者的聲音，傳達非主流的聲音，例如：黨外雜誌、民主電臺等媒體，請問這些另類媒體的經營方式與目的，與一般主流媒體有何不同？
  options:
  - label: A
    content: 另類媒體組織偏向內部民主，存在目的是在推動社會改革
  - label: B
    content: 另類媒體組織運作採科層分工，區別小眾媒體為獲利目的
  - label: C
    content: 另類媒體組織運作常由上而下，呈現經營者的非主流色彩
  - label: D
    content: 另類媒體組織經費來自大眾捐款，在報導上強調中立客觀
