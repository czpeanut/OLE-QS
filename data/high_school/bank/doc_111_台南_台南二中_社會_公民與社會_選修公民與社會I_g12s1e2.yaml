  stem: 2015 年間，國道收費員因抗議遠通安置方案不當，罔顧收費員工作保障，因而選擇以絕食方式抗議，並到國道上靜坐癱瘓交通，表達訴求，交通部高公局則回應國道收費員自救會，應愛惜自己身體健康，理性透過正常管道處理相關訴求，不宜因違規行為影響社會秩序。下列有關此一事件的分析，何者正確？
  options:
  - label: A
    content: 國道收費員自救會爭取自身權益，屬於第二部門
  - label: B
    content: 此次抗議行動因屬於違法行為，不屬於社會運動
  - label: C
    content: 目的是希望改變安置方案，反映缺乏溝通管道
  - label: D
    content: 自救會的抗議凸顯公部門僱用非典勞工等長期不合理問題
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)自救會為利益團體，屬於「第三部門」。(B)社會運動亦有可能出現違法行為。(C)仍有其他正常管道處理相關訴求。
