- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '部分政治社會學者認為政黨、社會運動與壓力團體三種政治參與途徑存有差異，在比較不同面向後歸納為表中資訊。根據內容判斷，甲、乙、丙所指分別為何？

    | 類型 | 甲 | 乙 | 丙 |

    | --- | --- | --- | --- |

    | 與政治權力的關係 | 直接取得 | 間接影響、交換 | 間接影響、交換 |

    | 代表的社會群體 | 選民 | 優勢的利益 | 被邊緣化的利益 |

    | 與組成分子的關係 | 選舉動員 | 非動員的委託關係 | 抗議動員 |

    | 主要的政治參與 | 選舉 | 遊說 | 抗議 |

    | 對於既有的秩序 | 接受 | 接受 | 挑戰 |'
  options:
  - label: A
    content: 甲：政黨；乙：壓力團體；丙：社會運動
  - label: B
    content: 甲：政黨；乙：社會運動；丙：壓力團體
  - label: C
    content: 甲：壓力團體；乙：政黨；丙：社會運動
  - label: D
    content: 甲：壓力團體；乙：社會運動；丙：政黨
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)因提及直接取得政治權力，可推論其為「政黨」；(乙)因提及遊說為主要政治參與，故偏向「壓力團體」的運作；(丙)其代表的社會群體為被邊緣化的利益，可推斷其為「社會運動」。
  tags:
    unit:
      code: CI-S1-3-1
      book: 選修公民與社會I 現代社會與經濟
      chapter: 社會運動
      title: 社會運動的定義與成因
      std: true
    textbook: 選修公民與社會I 現代社會與經濟 社會運動的定義與成因
    labeled_by: agent
    label_confidence: high
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 另類媒體是指媒體經營目的、內容取向、價值立場、運作模式均與主流媒體有所差異的媒體，此類媒體在報導社會運動時也與主流媒體不同，請問對於另類媒體與社會運動之間的關係，何者較符合現實狀況？
  options:
  - label: A
    content: 與社會運動團體的關係較為密切，但仍能公正客觀
  - label: B
    content: 讓社會處境不利群體有發聲的機會，促成社會改革
  - label: C
    content: 另類媒體被視為社會運動，易從單一視角觀察分析
  - label: D
    content: 挑戰既有的資本主義社會，報導呈現衝突對立場面
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)另類媒體的立場不一定公正客觀。(C)另類媒體不等於社會運動。(D)另類媒體指立場與主流媒體有差異，不一定是挑戰既有的資本主義社會。
  tags:
