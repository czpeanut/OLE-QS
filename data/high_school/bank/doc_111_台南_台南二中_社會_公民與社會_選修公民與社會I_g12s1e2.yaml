- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「社會運動」必須在長時間的堅持之下，透過有組織、有計畫的群眾運動以追求防止社會惡化、解決社會問題的目標達成。依此定義，以下是不同的事件：請問何者可歸類為「社會運動」？(甲)高雄市政府為娛樂大眾，辦理跨年晚會；(乙)婦女救援基金會推動援救雛妓、終止婦女買賣等運動；(丙)選舉訴訟敗訴，帶領群眾聚集法院外，抗議司法不公；(丁)為表達對性侵幼童案遭法官輕判的憤怒，由群眾發起的「白玫瑰運動」，推動《性侵害防治法》的修正
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (丙)(丁)
  - label: C
    content: (乙)(丁)
  - label: D
    content: (乙)(丙)(丁)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)由市政府發起，因此並非社會運動；(丙)屬於「私人利益」事件。
