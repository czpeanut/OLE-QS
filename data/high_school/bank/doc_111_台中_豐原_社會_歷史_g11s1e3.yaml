questions:
- id: doc_111_台中_豐原_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1949 年 1 月，蘇聯在莫斯科成立一個經濟組織，以加強共產國家之間的經濟合作關係，目的在對抗馬歇爾計畫內所欲建立的美元中心；但隨著東歐政局的劇變，這個組織已於 1991 年 6 月在布達佩斯正式宣布解散。請問這個經濟組織是
  options:
  - label: A
    content: 歐洲經濟共同體
  - label: B
    content: 經濟互助委員會
  - label: C
    content: 歐洲共同體
  - label: D
    content: 歐洲經濟合作組織
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '蘇聯為與美國抗衡而禁止東歐國家加入馬歇爾計畫，於 1949 年成立(B)經濟互助委員會，加強共產國家間的經濟合作，也強化蘇聯對東歐的經濟控制。

    2.1950 年開始的麥卡錫主義可說是美國反共意識的極致表現，這股全國性的反共運動最可能與(D)杜魯門圍堵共產國家有關。(A) 1962 年、(B) 1960 年代、(C) 1970 年代，三者的時間並不符合。

    3.(D)匈牙利於 1956 年曾聲援波蘭的抗議運動，學生、勞工和軍人在布達佩斯進行抗爭，襲擊祕密警察、推倒史達林頭像，並要求總書記拉柯西下臺，稱為「十月革命」，但最後遭到蘇聯派軍鎮壓收場。

    4.(B)伊斯蘭主義反西方現代化，強調回歸伊斯蘭傳統，因此必須檢討凱末爾西化政策的利弊得失，引發伊斯蘭社群與政府的對立。(A)(C)主張結合伊斯蘭信仰與現化文化。(D)與宗教信仰較無關聯。

    5.(D)題文所述事件引發美國的黑人民權運動，也影響政府於 1964 年通過《民權法案》。(A) 1861 ～ 1865 年。(B) 1863 年。(C) 1847 年獨立建國。

    6.(A)為美國與西歐國家所組成的反共軍事聯盟，(B)為蘇聯與共產國家組成的經濟合作組織，(C) 1943 年已被史達林自行解散，因此蘇聯只能根據(D)華沙公約組織的規定派軍鎮壓「布拉格之春」，但由於華沙公約組織原係與北大西洋公約組織對抗，集團軍隊卻大規模入侵成員國內，也招致普遍抗議。

    7.(C)非洲獨立運動較亞洲晚且不順利，1950 年代後才陸續有國家獨立。1960 年聯合國通過〈給予殖民地國家和人民獨立宣言〉，催化非洲國家獨立的浪潮，該年有 17 個國家宣布獨立，因此稱為「非洲獨立年」。

    8.從「英國占領區」、「蘇聯占領區」、「美國占領區」等，可推知此地應是被四國分區占領的(D)柏林。

    9.這位以苦行僧方式，採取非暴力手段的「不合作運動」，最後爭取到印度民族獨立的人是「聖雄」(A)甘地。(B)以武裝革命方式爭取印尼的獨立。(C)抗爭南非政府的種族隔離政策而遭逮捕入獄。(D)採非暴力手段領導美國黑人民權運動。

    10.19 世紀初，(D)英國利用拿破崙戰爭封鎖歐陸之際，自荷蘭奪取非洲南端的海角殖民地；1840 年代英籍傳教士李文斯頓深入中非探險並出版成書，吸引西方各國對非洲產生濃厚興趣；19 世紀晚期在非洲大獵中，其殖民地縱貫非洲南北兩端。

    11.位於東西文明交匯處，掌握東西商貿路線的□□帝國應是巴爾幹半島的鄂圖曼帝國；召開柏林會議的○○為德意志帝國首相俾斯麥，答案為(D)。

    12.《我的奮鬥》為(B)希特勒的自傳，融合其政治意識型態，並成為日後德國納粹黨的思想綱領。

    13.1947 年的法國與英國經濟不見起色，係因二次大戰後的破壞尚未復原；1948 年後的經濟發展快速，主要是因為「馬歇爾計畫」，美國為避免西歐因經濟破產而發生無產階級革命，於是編列預算協助歐洲各國戰後重建，(D)為正解。(A) 1948 年尚未爆發韓戰，英、法也不是東亞第一島鏈。(B)柏林危機不會使英、法經濟迅速恢復。(C)此時尚未爆發越戰。

    14.自古巴飛彈危機後，美、蘇雙方進入「低盪」和緩階段，但在 1980 年代後雙方關係重回緊繃狀態，尤其 1983 年雷根總統提倡「星戰計畫」後，兩國再度展開軍備競賽，因此也讓蘇聯的經濟更加雪上加霜，答案為(A)。

    15.(A)她出生時，東、西德分裂為兩個國家。(B)柏林圍牆於 1961 年築起，是為正解。(C)她於 1989 年德國統一前擔任發言人，當時史達林早已離世。(D)華沙公約組織於 1991 年已撤銷。

    16.《好萊塢的黑名單》描述好萊塢的反共意識高漲，使得名編劇難以立足，此背景應是美國(C) 1950 年代麥卡錫主義盛行之時。

    17.題文所述為伊朗的(C)何梅尼，1979 年領導革命，推翻西化、世俗化且親美的巴勒維政權，建立政教合一的伊朗伊斯蘭共和國，宣揚回歸傳統文化。

    18.全世界各地的生活型態與品味漸趨於一致，此即(B)全球化。

    19.從「都是為了香蕉」與「海軍陸戰隊、裝甲艦和刺刀的歷史」兩句，可知美國係(C)利用軍事與經濟的雙重力量控制中南美洲國家。

    20.從爭取亞、非人民的獨立自由與民族自決、「第三世界」等，即可推知此會議為(A) 1955 年在印尼萬隆舉行的亞非會議。

    21.從題文中政治人物的演說來看，該國直到 1990 年的民主選舉仍然是白人壟斷政權的狀況，因此可推知此國家為實施種族隔離政策的南非，這名政治人物為(B)曼德拉。

    22.從強迫種植的經濟作物種類來看，此殖民地位於熱帶地區，加上 20 世紀中期經由武裝抗爭才得獨立，因此這個殖民地最可能為東南亞的印尼，(D)為正解。(A)美國非熱帶地區。(B)巴西於 19 世紀前期已獨立。(C)印度以和平談判方式獨立。

    23.義大利的法西斯政權於 1922 年建立，演說中提到的時間是「法西斯時代第 14 年」，即 1935 年義大利入侵衣索比亞之時，答案為(C)戰間期。

    24.(A)「從女性還是被貶到次等地位」一句，可知兩者的抗爭者並未完全重疊。(B)為正解。(C)(D)從題文中看不出這兩項的關聯性。

    25.兩則資料所描述的皆為二次大戰後的北大西洋公約組織，1949 年由美國聯合西歐國家組成，目的在以軍事聯盟對抗蘇聯的入侵，(D)為正解。

    26.資料一中，蘇聯將工、農產品製造出價格差，應是 1928 年後的五年計畫所使然；資料二揭露列寧係受德國資助回到俄國發動 1917 年十月革命；資料三為共產革命後，俄國三年內戰的情形。因此(C)為正解。(A)事件順序應為資料二三一。(B)從壓低農業品價格、提升工業產品價格來看，目的應在推動工業化。(D)一次大戰已經結束，1920 年為俄國國內的內戰。

    27.(A)韓戰於 1953 年已告一段落。(B)雷根為 1980 年代的美國總統。(D)柏林圍牆於 1989 年倒塌。

    28.資料一顯示美國因為越戰而造成的財政赤字愈趨沉重，資料二則顯示投入戰爭中的人力愈來愈多，兩則資料正可說明美國國內反越戰聲浪興起的原因，(B)為正解。(A)應是越戰。(C)與馬歇爾計畫無關。(D)資料二僅能顯示出美國投注大量人力，看不出圍堵政策的成效。

    29.(A)甘地並未領兵作戰。(B)土耳其於第一次世界大戰後改建為共和國，擺脫列強的控制。(D)甘地並未當選過印度總統。

    30.(A)史達林自 1928 年開始推動五年計畫，目標是農業集體化；1933 年後開啟第二次五年計畫，主要目標轉為發展重工業，至 1939 年蘇聯的工業總產值已居世界第三。(B)蘇聯於二戰初期宣布中立，並未主張發動戰爭。(C)由於五年計畫，使蘇聯未受經濟大恐慌影響。(D)二戰前，德國與蘇聯簽訂《德蘇互不侵犯條約》。

    31.兩則資料顯示出法國的學生運動，當時年輕學生對「習慣的社會」不滿，欲藉此打破傳統，因此為 1960 年代的學生運動，不僅促使法國國會改選，並間接導致戴高樂總統下臺，(D)為正解。

    32.馬來亞的橡膠產業為典型的殖民地經濟模式，(B)單一作物的產業結構使得糧食等需依賴進口，即使獨立建國後，對母國的經濟依賴仍深。(A)單一作物的產業結構，無法帶動整體建設。(C)人民多被壓榨與經濟剝削，殖民者才是最大獲利者。(D)早期殖民時期多利用當地便宜的勞動力生產。

    33.這位讓蘇聯有「民主」和「言論自由」的諾貝爾和平獎得主為戈巴契夫，在 1985 年擔任蘇聯第一總書記以後，即推動改革開放政策，放寬政府對人民經濟與政治自由的箝制，並嘗試與美國建立友好關係，(C)為正解。(A)戈巴契夫放鬆對經濟的管制，允許人民有部分私有財產。(B)(D)為美國雷根總統的主張。

    34.資料一提到該地居民生活用品皆需靠空運供應，資料二更提到「封鎖前」的運量，因此可推知與 1948 年的柏林封鎖危機有關，蘇聯至 1949 年才解除西柏林的封鎖，(C)為正解。(A)「此地」指柏林。(B)負責運輸工作主要是美國與英國。(D)此一危機發生於 1948 年，第二次世界大戰已經結束。

    35.這本戰爭小說是德國雷馬克的《西線無戰事》，從「戰壕」與毒氣等新式武器可推知為 20 世紀後的(A)第一次世界大戰。

    36.文中有兩個重要線索：一、「戰爭」仍在進行，二、新政府要「走向共和」卻同「舊俄」當局一樣。從這兩個線索可推測此時應為一次大戰期間，推翻舊俄、建立共和新政府的□□則是 1917 年的(B)二月革命，由於新政府仍持續參加一次大戰，使人民失望，才讓列寧有機可乘發動十月革命。

    37.(A)凱末爾為推行現代化，主張政教分離。(B)義大利侵占的非洲國家是衣索比亞。(D)蘇聯因推行五年計畫，因此完全不受經濟大蕭條影響。

    38.甲同學的目標是「要自由」，應為共產體制的捷克；乙同學正在戰爭中且需要建設國家，應為才剛立國的以色列；丙同學學生不用讀書，只要鬥垮資本主義，應是文革時期的中國；丁同學只想要引起政客注意年輕人的需求，故為法國。(A)為正解。

    39.1962 年的(C)古巴飛彈危機為美、蘇冷戰的巔峰，此後白宮與克里姆林宮之間建立「熱線」，雙方並展開核子武器限制談判，使冷戰情勢趨於緩和，稱為「低盪」。

    40.1980 年代的美國總統為(A)雷根。

    41.這場會議確定了瓜分非洲的「有效原則」，因此為 1884 年的柏林會議，答案為(D)。

    42.1884 年柏林會議的主導者為(C)德國的俾斯麥。

    43.資料一直接點明「緬甸人是一群頭腦簡單又懶惰的民族」，資料二又強調白種人的優越感與「負擔」，反映出 19 世紀西方盛行的(C)社會達爾文主義思想。

    44.緬甸是英國的殖民地，因此資料一的評論最可能來自(B)英國人。

    45.資料甲的「星際大戰」可推知為 1980 年代的雷根總統，資料乙為 1940 年代提出「圍堵政策」的杜魯門總統，資料丙為 1970 年代主張「對談取代對抗」的尼克森總統，三者出現的時間依序為(C)乙丙甲。

    46.從越南「光榮撤退」的美國總統是尼克森，即(C)丙。

    47.盧安達原為德國的殖民地，於一次大戰後改為(D)比利時殖民，圖西族與胡圖族的差別待遇即是比利時的統治策略。

    48.由於比利時於殖民期間對盧安達人民採取差別待遇，造成圖西族與胡圖族間長期的對立與衝突，進而引發 1994 年的大屠殺，(B)為正解。

    49.1954 年法越戰爭結束，簽訂《日內瓦停戰協定》，法國撤出越南後，越南以北緯 17 度為界分裂南北，其中南越建立親美的共和政府。題文提到□□喪失的話，可能進一步向南威脅到澳大利亞和紐西蘭，因此更可推斷□□指(A)中南半島，而非(B)。(C)(D)兩地非「第一島鏈」的防禦圈。

    50.1960 年代，美國介入越戰，但因戰況膠著使得美國國內掀起反越戰風潮，造成美國進退維谷，最後於 1970 年代決定退出，(B)為正解。(A)並無此事。(C)中國正值文革期間，並未派出志願軍參戰。(D)美國改採聯中制蘇，因此不願激怒中國。

    51.(C)未有此事。(D)海地起兵反抗法國的統治，1804 年成為中南美洲第一個獨立的國家。

    52.(A)此時青年受「新左派」思想影響，多反對資本主義及官僚體系。(C)馬丁．路德．金恩主張以非暴力的和平方式爭取平等權利。(D)女權運動於 19 世紀已有，非 1960 年代才出現。

    53.(C)利比亞原為義大利的殖民地，在義大利戰敗後即被盟軍占領，1951 年才獨立。(E)非洲各國獨立後往往面臨糧食短缺、經濟貧困與軍事獨裁等問題。

    54.(A)印尼經過武裝抗爭後才脫離荷蘭而獨立。(B)(C)(D)(E)為正解。

    55.法蘭西斯．福山認為「自由民主制是人類社會演化的終點」，因此他最可能以(A)(B)(D)作為他的論點例證。(C)美國本就是自由民主制的政體，1960 年代的民權運動並未改變其政體。(E) 1960 年代的古巴危機之後，古巴依然維持共產政權體制。

    56.(A)巴爾幹半島居民信奉希臘正教。(B)東羅馬帝國滅亡後，伊斯蘭教隨土耳其人傳入。(C)應是柏林會議。

    57.(B)在美、蘇冷戰期間，選擇不結盟方式，因此自稱為「第三世界」。(E)圖中的 A 區多為工業發達、經濟富裕的國家。

    58.(A)第二次世界大戰是同盟國獲勝。(D)第一次世界大戰時，日本和德國處於敵對陣營。(E)第二次世界大戰後避免重蹈覆轍，對戰敗國不再執行報復性懲罰。

    59.(B)透過和平漸進的方式推動伊斯蘭內部的改革。(D)此人應為阿布杜。(E)此主張被稱為「泛伊斯蘭主義」。

    60.(A)蘇維埃政府於 1917 年十月革命後成立。(C)「和平、土地、麵包」為列寧領導十月革命的口號，尼古拉二世於二月革命後已宣布退位。(D)尼古拉二世於二月革命後退位，十月革命後列寧才下令退出第一次世界大戰。'
