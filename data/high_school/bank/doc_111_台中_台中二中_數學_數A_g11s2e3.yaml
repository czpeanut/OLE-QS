- id: doc_111_台中_台中二中_數學_數A_g11s2e3_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 若線性變換矩陣 $A_{2×2}$，將平面上兩點 P、Q 分別變換到 P'、Q'，選出正確的選項：
  options:
  - label: A
    content: 若 P、Q 不重合，則 P'、Q' 也不重合
  - label: B
    content: 若 P、Q、P'、Q' 皆不重合，則直線$\overset{\leftarrow \rightarrow}{PQ}$的斜率與直線$\overset{\leftarrow \rightarrow}{P'Q'}-$的斜率相等
  - label: C
    content: 若 det A＝－1，O 為原點，則△OPQ 與 △OP'Q' 面積相等
  - label: D
    content: 若 det A＝1，則線段$\overline{PQ}$與線段$\overline{P'Q'}$的長度相等
  - label: E
    content: 向量$\vec{PQ}$經過線性變換 A 後，為向量$\overset{-⃑}{P'Q'}$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：令 A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，P＝$\left[ \begin{matrix}2 \\ 1\end{matrix} \right]$，Q＝$\left[ \begin{matrix}2 \\ 4\end{matrix} \right]$

    則 AP＝AQ＝$\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$，即 P''＝Q''，P''，Q'' 兩點重合

    (B) ╳：令 A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，P＝$\left[ \begin{matrix}2 \\ 1\end{matrix} \right]$，Q＝$\left[ \begin{matrix}3 \\ 2\end{matrix} \right]$

    ⇒ P''＝$\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$，Q''＝$\left[ \begin{matrix}3 \\ 0\end{matrix} \right]$

    但$m_{PQ}$＝$\frac{2-1}{3-2}$＝1，$m_{P''Q''}$＝$\frac{0-0}{3-2}$＝0

    (C) ○：△OP''Q'' 面積為∣detA∣×△OPQ 面積＝△OPQ 面積

    (D) ╳：令 A＝$\left[ \begin{matrix}2 & 0 \\ 0 & \frac{1}{2}\end{matrix} \right]$，P＝$\left[ \begin{matrix}2 \\ 0\end{matrix} \right]$，Q＝$\left[ \begin{matrix}0 \\ 2\end{matrix} \right]$⇒$\overline{PQ}$＝$2\sqrt{2}$

    ⇒ P''＝$\left[ \begin{matrix}4 \\ 0\end{matrix} \right]$，Q''＝$\left[ \begin{matrix}0 \\ 1\end{matrix} \right]$，得$\overline{P''Q''}$＝$\sqrt{17}$≠$\overline{PQ}$

    (E) ○：令 P（$x_{1}$，$y_{1}$），Q（$x_{2}$，$y_{2}$），P''（$x_{1}$''，$y_{1}$''），Q''（$x_{2}$''，$y_{2}$''）

    ⇒$\vec{PQ}$＝（$x_{2}$－$x_{1}$，$y_{2}$－$y_{1}$）

    $A\left[ \begin{matrix}x_{2}-x_{1} \\ y_{2}-y_{1}\end{matrix} \right]$＝$A\left[ \begin{matrix}x_{2} \\ y_{2}\end{matrix} \right]$－$A\left[ \begin{matrix}x_{1} \\ y_{1}\end{matrix} \right]$＝$\left[ \begin{matrix}x_{2}'' \\ y_{2}''\end{matrix} \right]$－$\left[ \begin{matrix}x_{1}'' \\ y_{1}''\end{matrix} \right]$＝$\left[ \begin{matrix}x_{2}''-x_{1}'' \\ y_{2}''-y_{1}''\end{matrix} \right]$

    ⇒$\overset{-⃑}{P''Q''}$＝（$x_{2}$''－$x_{1}$''，$y_{2}$''－$y_{1}$''）

    故選(C)(E)'
