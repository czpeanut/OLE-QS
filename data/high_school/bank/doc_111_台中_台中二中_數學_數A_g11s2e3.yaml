  answer_source: answer_key
  explanation: '令 f（x）＝ax（x＋1）（x＋2）＋bx（x＋1）＋cx＋d

    x＝0 代入得 d＝5

    x＝－1 代入得－c＋5＝9 ⇒ c＝－4

    x＝－2 代入得 2b－2×（－4）＋5＝13 ⇒ b＝0

    x＝1 代入得 6a＋（－4）＋5＝7 ⇒ a＝1

    得 f（x）＝x（x＋1）（x＋2）－4x＋5

    故 f(11)＝1677'
