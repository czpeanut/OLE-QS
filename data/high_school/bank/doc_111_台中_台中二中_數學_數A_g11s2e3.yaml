- id: doc_111_台中_台中二中_數學_數A_g11s2e3_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 空間中向量$\vec{a}$＝（1，2，3），$\vec{b}$＝（2，3，1），$\vec{c}$＝（3，5，3），$\vec{d}$＝（5，9，8），若$x\vec{a}+y\vec{b}+z\vec{c}=\vec{d}$，求序組（x，y，z）＝＿＿＿＿。
  answer:
  - （1，－1，2）
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$x\vec{a}+y\vec{b}+z\vec{c}=\vec{d}$

    ∴$\begin{cases}x+2y+3z=5 \ldots \ldots \ldots \ldots \ldots ① \\ 2x+3y+5z=9 \ldots \ldots \ldots \ldots ② \\ 3x+y+3z=8\ldots \ldots \ldots \ldots \ldots ③\end{cases}$，由②－①×2 且③－①×3 得$\begin{cases}-y-z=-1 \\ -5y-6z=-7\end{cases}$

    ⇒$\begin{cases}y=-1 \\ z=2\end{cases}$代回①得 x＝1

    故序組（x，y，z）＝（1，－1，2）'
