- id: doc_111_台中_台中二中_數學_數A_g11s2e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 關於二階方陣 A、B、C、單位矩陣 $I_{2}$、零矩陣 $O_{2}$，選出正確的選項：
  options:
  - label: A
    content: 若 AB＝AC，則 B＝C
  - label: B
    content: 若 B＝C，則 AB＝AC
  - label: C
    content: 若 $A^{2}$＝$I_{2}$，則 A＝$I_{2}$ 或－$I_{2}$
  - label: D
    content: 若 $A^{3}$＝$A^{4}$，則 A＝$I_{2}$
  - label: E
    content: 若 AB＝$O_{2}$，則 A＝$O_{2}$ 或 B＝$O_{2}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：反例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，B＝$\left[ \begin{matrix}0 & 0 \\ 0 & 2\end{matrix} \right]$，C＝$\left[ \begin{matrix}0 & 0 \\ 1 & 2\end{matrix} \right]$

    則 AB＝AC＝$\left[ \begin{matrix}0 & 0 \\ 0 & 0\end{matrix} \right]$，但 B≠C

    (B) ○

    (C) ╳：反例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & -1\end{matrix} \right]$⇒ $A^{2}$＝$I_{2}$，但 A≠$I_{2}$ 且 A≠－$I_{2}$

    (D) ╳：反例：A＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$⇒ $A^{3}$＝$A^{4}$＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，但 A≠$I_{2}$

    (E) ╳：反例同(A)

    故選(B)'
