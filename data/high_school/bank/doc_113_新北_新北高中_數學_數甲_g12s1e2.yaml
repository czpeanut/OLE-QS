  explanation: '設所求直線與Γ 相切於點（a，$a^{2}$－2a＋2）

    由 f''（x）＝2x－2 得切線斜率為 f''（a）＝2a－2

    2a－2＝$\frac{a^{2}- 2a + 2 - 1}{a -( -1 )}$＝$\frac{a^{2}- 2a + 1}{a + 1}$

    $\Rightarrow$2（a－1）（a＋1）＝（a－1）$^{2}$

    $\Rightarrow$（a－1）（a＋3）＝0

    $\Rightarrow$a＝1 或－3

    因為切線過點 A（－1，1）

    所以當 a＝1 時，斜率 f''(1)＝0，此時切線為 y－1＝0（x＋1）$\Rightarrow$y＝1

    當 a＝－3 時，斜率 f''（－3）＝－8，此時切線為 y－1＝－8（x＋1）$\Rightarrow$8x＋y＋7＝0

    因此，所求切線為 y＝1 及 8x＋y＋7＝0'
