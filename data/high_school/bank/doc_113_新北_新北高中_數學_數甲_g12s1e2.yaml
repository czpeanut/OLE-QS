  stem: 若 f（x）＝｜x－1｜，則 f'(1)＝1 或－1。
  answer:
  - ╳
  answer_status: verified
  answer_source: answer_key
  explanation: '╳：$\lim_{x \rightarrow 1^{+}} \frac{f ( x )-f ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{| x - 1 |}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{x - 1}{x - 1}$＝1

    $\lim_{x \rightarrow 1^{-}} \frac{f ( x )-f ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{| x - 1 |}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{-( x - 1 )}{x - 1}$＝－1

    因為$\lim_{x \rightarrow 1^{+}} \frac{f ( x )-f ( 1 )}{x - 1}$≠$\lim_{x \rightarrow 1^{-}} \frac{f ( x )-f ( 1 )}{x - 1}$

    所以 f''(1)不存在'
