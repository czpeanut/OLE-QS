  answer:
  - －$x^{3}$－$3x^{2}$＋9x＋2
  answer_status: verified
  answer_source: answer_key
  explanation: '因為三次函數之反曲點即為對稱中心

    所以可設 f（x）＝a（x＋1）$^{3}$＋p（x＋1）－9

    則 f''（x）＝3a（x＋1）$^{2}$＋p

    ∵f（x）在 x＝1 處有極大值 7

    ∴f(1)＝7，f''(1)＝0

    $\begin{cases}8a + 2p -9 = 7 \\ 12a +p = 0\end{cases}\Rightarrow\begin{cases}4a +p = 8 \\ 12a +p = 0\end{cases}$

    解聯立可得 a＝－1，p＝12

    故 f（x）＝－（x＋1）$^{3}$＋12（x＋1）－9＝－$x^{3}$－$3x^{2}$＋9x＋2'
