- id: doc_113_台北_明倫_數學_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 對某數 N 取一次 log 後，其值為 x，再對此數 x 取一次 log 後，其值為 108，試問 N 是幾位數？
  options:
  - label: A
    content: 108 位
  - label: B
    content: 108＋1 位
  - label: C
    content: $10^{108}$ 位
  - label: D
    content: $10^{108}$＋1 位
  - label: E
    content: $10^{10^{108}}$位
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'x＝logN ⇒ N＝$10^{x}$

    又 108＝log x ⇒ x＝$10^{108}$ ⇒ N＝$10^{10^{108}}$⇒ N 的位數為 $10^{108}$＋1

    故選(D)'
- id: doc_113_台北_明倫_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設 a 為非零之有理數，b 為無理數。請從下列敘述中，選出正確選項：
  options:
  - label: A
    content: $b^{2}$ 為有理數
  - label: B
    content: $\frac{a}{b}$為無理數
  - label: C
    content: $\frac{2a+b}{3}$為有理數
  - label: D
    content: $\frac{\sqrt{2}a+b}{\sqrt{2} +1}$為無理數
  - label: E
    content: 若$a+b\sqrt{2}$＝0，則 a＝b＝0
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：反例：b＝$\sqrt{2}$＋1 ⇒ $b^{2}$＝3＋2$\sqrt{2}$不為有理數

    (B) ○：反設$\frac{a}{b}$＝k，其中 k 為有理數⇒ b＝$\frac{a}{k}$為有理數⇒矛盾，故$\frac{a}{b}$為無理數

    (C) ╳：反例：a＝3，b＝$3\sqrt{3}$⇒$\frac{2a+b}{3}$＝2＋$\sqrt{3}$不為有理數

    (D) ╳：反例：a＝2，b＝1－$\sqrt{2}$⇒$\frac{\sqrt{2}a+b}{\sqrt{2} +1}$＝$\frac{2\sqrt{2} +1-\sqrt{2}}{\sqrt{2} +1}$＝1 為有理數

    (E) ╳：反例：a＝－2，b＝$\sqrt{2}$⇒ a＋b$\sqrt{2}$＝－2＋2＝0，但 a≠0，b≠0

    故選(B)'
- id: doc_113_台北_明倫_數學_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: log0.000000123 的值介於哪兩個整數之間？
  options:
  - label: A
    content: －6 與－5 之間
  - label: B
    content: －7 與－6 之間
  - label: C
    content: －8 與－7 之間
  - label: D
    content: －9 與－8 之間
  - label: E
    content: －10 與－9 之間
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∵0.000000123＝1.23×$10^{－7}$

    又 $10^{－8}$＜1.23×$10^{－7}$＜$10^{－7}$ ⇒－8＜log（1.23×$10^{－7}$）＜－7

    故選(C)'
- id: doc_113_台北_明倫_數學_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知 k 是整數，且滿足 k＜$2\sqrt{2}$＋$\sqrt{3}$＜k＋1，試求 k 之值為
  options:
  - label: A
    content: '3'
  - label: B
    content: '4'
  - label: C
    content: '5'
  - label: D
    content: '6'
  - label: E
    content: '7'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$\sqrt{2}$≈ 1.414，$\sqrt{3}$≈ 1.732

    ⇒ 2$\sqrt{2}$＋$\sqrt{3}$≈ 2×1.414＋1.732＝4.56

    ∴4＜2$\sqrt{2}$＋$\sqrt{3}$＜5 ⇒ k＝4

    故選(B)'
- id: doc_113_台北_明倫_數學_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 已知$\sqrt{2}$為無理數。若 a，b 均為有理數，且（3＋$\sqrt{2}$）a＋（1－$\sqrt{2}$）b－9＋$\sqrt{2}$＝0，則 a＋b 的值為下列哪一個選項？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '（3＋$\sqrt{2}$）a＋（1－$\sqrt{2}$）b－9＋$\sqrt{2}$＝0

    ⇒（3a＋b－9）＋（a－b＋1）$\sqrt{2}$＝0

    ∵a，b 均為有理數 ∴3a＋b－9，a－b＋1 亦為有理數

    ⇒$\begin{cases}3a+b-9=0 \\ a-b+1=0\end{cases}$⇒$\begin{cases}a=2 \\ b=3\end{cases}$⇒ a＋b＝5

    故選(E)'
