  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
  group_stem: 南北戰爭後，加勒比海地區所生產的香蕉已經無法滿足美國對於香蕉的需求，因此香蕉產地擴大至中美洲地區，但是香蕉採收後，為避免香蕉過度成熟，必須以冷藏設備保存，且盡快送至消費者手中。而美國鐵路企業家──基斯，在哥斯大黎加興建連結首都與港口之間的鐵路後，拿下該鐵道 99 年的經營權與鐵道周圍 80 萬英畝稅土地種植香蕉，隨後成立聯合果品公司。聯合果品公司在中美洲當地政府的支持下，開闢一座座的香蕉園，並自由使用當地港口設施，憑藉著先進的冷藏設備延緩香蕉成熟；相比之下，當地的小蕉農根本無力與聯合果品公司競爭，只能任由其所產的香蕉被低價收購。後來聯合果品公司更大量收購土地種植經濟作物，使得中美洲傳統作物─玉米產量減少，不足以供應國內需求，因此糧食仰賴進口，其中有 4 成的糧食來自美國。中美洲平均一年消費 6 百萬噸玉米，卻有 3 百萬噸的玉米仰賴進口。1951 年瓜地馬拉總統阿本茲，宣布將聯合果品公司在瓜地馬拉大片因巴拿馬病而休耕的土地，約占瓜國可耕地面積的 7 成，收歸國有後分發予無耕地可耕的貧民，但引起該公司強烈不滿。曾任職於聯合果品公司的美國國務卿杜勒斯於 1954 年策動阿本茲的競爭對手阿馬斯從宏都拉斯入侵，導致阿本茲辭職，落魄的流亡墨西哥。請問：
