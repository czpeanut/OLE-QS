  answer_status: verified
  answer_source: answer_key
  explanation: (B)澳洲西部為古老結晶岩層，盛產鐵礦，東部老褶曲山脈盛產煤礦，其東北部熱帶雨林氣候區多種植甘蔗。(A)越南、(D)馬來西亞鐵礦、煤礦不豐富。(C)智利國內氣候類型由北至南為熱帶乾燥、溫帶地中海、溫帶海洋性，並不適合種植甘蔗（砂糖原料）。
