  stem: 中南美洲近年來有相當多的西方人前往該處旅行，除了欣賞自然風光外，更多人是為了當地多元的文化景觀而來，如巴西的嘉年華會，早已成為世界著名的文化節慶。請問中南美洲的多元文化影響先後順序，應該為下列何者？
  options:
