- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2022 世界十大城市排名依次是：紐約、倫敦、東京、巴黎、新加坡、洛杉磯、香港、上海、雪梨、多倫多。上述世界都市的界定指標包含哪些項目？(甲)農業產值(乙)訊息交流(丙) GDP 產值(丁)第三級產業活動
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)世界都市以第三級產業為主體，其 GDP 占國內比例高。通常為跨國企業總部、國際組織總部、重要媒體與文化產業的區位選擇。(甲)農業產值不符合世界都市的界定指標。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 巴塔哥尼亞高原位於阿根廷南部和一小部分的智利境內，擁有如莫雷諾冰河的酷冷景觀，也有廣大荒蕪的沙漠，亦有麥哲倫企鵝的分布。造成該區沿海氣溫低於同緯度地區的原因，最可能為下列何者？
  options:
  - label: A
    content: 福克蘭洋流流經
  - label: B
    content: 位於西風背風側
  - label: C
    content: I.T.C.Z. 季節性移動
  - label: D
    content: 極圈低壓全年籠罩
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 巴塔哥尼亞高原內部為一溫帶沙漠，其成因為背西風、福克蘭寒流流經。其中福克蘭寒流流經使此地氣溫較同緯度的其他地區低，故選(A)。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 專家學者指出亞馬孫地區的森林大火大部分都不是「天然」森林火災，通常是農民和畜牧業砍伐樹木後將其點燃，以便取得土地用於農業。巴西的農場和牧場，主要以種植何種作物與畜養何種牲畜為主要農業活動？
  options:
  - label: A
    content: 大豆與牛群
  - label: B
    content: 甘蔗與乳牛
  - label: C
    content: 小麥與駱馬
  - label: D
    content: 馬鈴薯與豬隻
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)亞馬孫雨林地區因人口增加而被大幅開發，在巴西境內的雨林區多開發為放牧肉牛牧場；近年因中美貿易戰之故，中國為降低從美國進口大豆，轉向自巴西進口，使大豆種植成為破壞亞馬孫雨林的主要作物之一。
