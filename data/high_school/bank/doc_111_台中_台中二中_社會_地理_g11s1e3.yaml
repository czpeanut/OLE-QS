  answer_source: answer_key
  explanation: (C)墨西哥、玻利維亞、秘魯皆位於環太平洋火山地震帶上，多新褶曲山脈及金屬礦。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「為什麼北方富而南方窮？歐洲農民遠渡重洋，翻越阿帕拉契山，直奔遼闊大草原。他們是自由農場主，為數眾多的農場主，構成巨大購買力的國內市場，保持了工業發展勢頭。巴西內地的農村勞動者，他只是大莊園主的雇工，為了他人的利益開拓疆界。迥然不同的兩種國內墾殖體制，是美國和拉美在發展模式的主要區別之一。」（出自《拉丁美洲被切開的血管》），以上有關中南美洲土地經營的敘述，與下列何種農業特徵最相似？
  options:
  - label: A
    content: 北美農場主人透過飛機方式噴灑農藥
  - label: B
    content: 西非童工在農場裡受到不公平的對待
  - label: C
    content: 南美農夫利用駱馬載運農業生產資材
  - label: D
    content: 西亞農場透過坎井設施取得灌溉水源
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中「巴西內地的農村勞動者，他只是大莊園主的雇工，為了他人的利益開拓疆界……」可看出中南美洲農業經營的「大地主制度」及「殖民地式經濟」特徵，故選同為殖民地式經濟的(B)。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 全球暖化帶來的海平面上升問題，將使下列哪些地區受淹水災害的衝擊最大？(甲)斯里蘭卡(乙)馬爾地夫(丙)小安地列斯群島(丁)巴哈馬群島
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 甲丙
  - label: D
    content: 乙丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 海平面上升將使地勢較低矮的環礁型島嶼國家面臨國土消失的困境，故選(D)。(甲)斯里蘭卡為大陸島；(丙)小安地列斯群島多為火山島。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 某旅行社對甲國的文宣介紹如下：「這個美洲大陸的文明古國，以陽光與熱情聞名於世；國民也以親切、開朗的性格，自詡為『友好（Amigo）之國』。在 16 世紀西班牙人來到之前，是由擁有先進天文、曆法與建築技術的阿茲特克帝國所統治，現在從首都即可見到古舊斑駁的阿茲特克時代遺跡、西班牙式的宮殿與教堂、現代化的摩天大樓等多重的人文景觀。」甲國最可能是下列何者？
  options:
  - label: A
    content: 智利
  - label: B
    content: 墨西哥
  - label: C
    content: 巴拿馬
  - label: D
    content: 委內瑞拉
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中提及該國曾為美洲三大古文明之一的「阿茲特克帝國」，可知其為(B)墨西哥。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
