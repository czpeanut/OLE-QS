  group_stem: CPTPP 是目前世界上體量第三大的自由貿易協定，11 個成員國 GDP 合計約13.5 兆美元，約占全球經濟總量的 13 ％，排在 26 兆美元的 RCEP 和 21.1 兆美元的 USMCA 之後。CPTPP 是一個高標準、全面性的區域貿易協定，成員包括澳洲、汶萊、加拿大、智利、日本、馬來西亞、墨西哥、紐西蘭、秘魯、新加坡及越南等 11 個國家。中華民國已於 2021 年 9 月 22 日申請加入跨太平洋夥伴全面進步協定（CPTPP），在此前一週，中國也宣布已遞交正式申請。請問：
  answer:
