  explanation: 該圖為熱帶高地氣候的農業利用垂直分布，故選(C)安地斯山脈北段。(A)墨西哥高原北段為乾燥氣候。(B)東非大裂谷北段較為乾燥，糧食作物多以花生、小米的種植為主。(D)喜馬拉雅山南坡為副熱帶高山。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '下表為三大國際金融機構的前五大借貸對象，請問表中的中南美洲各國會有大量借貸資金的原因，可能與下列哪幾項因素有關？(甲)農業以熱帶栽培業的發展為主(乙)大量生產糧食作物以利外銷(丙)多以農礦原料出口為主(丁)與其他已開發國家進行不對等貿易交流

    | （單位：十億美金） |  |  |  |

    | --- | --- | --- | --- |

    |  | 國際貨幣基金 | 世界銀行 | 美洲開發銀行 |

    | 第一名 | 巴西（$28） | 中國（$10.8） | 巴西（$12.9） |

    | 第二名 | 土耳其（$23.6） | 墨西哥（$10.7） | 阿根廷（$8.7） |

    | 第三名 | 阿根廷（$15.7） | 印尼（$10.3） | 墨西哥（$7.2） |

    | 第四名 | 印尼（$10.2） | 巴西（$8.7） | 哥倫比亞（$4.0） |

    | 第五名 | 俄羅斯（$4.8） | 阿根廷（$7.9） | 秘魯（$3.0） |'
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲丙丁。（資料來源：國際貨幣基金、世界銀行及美洲開發銀行）
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 中南美洲各國多以「初級原料產品輸出」作為國內經濟的主要來源。其中農作物的種植多以經濟作物為主，故排擠國內糧食作物的生產，導致區內國家需以借貸方式大量進口國外糧食作物，故(乙)不選。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 哪一項敘述為「全球化」後，最可能遇到的問題？
  options:
  - label: A
    content: 開發中國家失去發展的機會
  - label: B
    content: 將高汙染產業移往處理能力較低的國家，形成生態危機
  - label: C
    content: 各國以增加關稅的方式，進行貿易競爭
  - label: D
    content: 國際貿易的依賴程度增高，貨幣趨於統一
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 全球化下，已開發國家企業為降低成本將勞力密集產業、高耗能、高汙染產業移轉至開發中國家，故選(B)。(C) 1990 年代「自由貿易」風潮興起，各國紛紛加入世界貿易組織，逐期漸漸降低關稅，促進全球化的發展。(D)全球化使各國間的貿易依賴程度提高，但並沒有統一貨幣。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 根據統計，2022 年全球 GDP 年成長率前 5 名之國家為：利比亞、馬爾地夫、摩納哥、蓋亞那、維德角（位於非洲西岸的大西洋島國，距離西非海岸線 570 公里）。請問利比亞、蓋亞那、維德角這三國成長率均高的原因，最可能與哪些因素關聯「最大」？(甲)區域之間互賴程度提高(乙)外資流入勞工密集國家(丙)已開發國家產業空洞化(丁)接近已開發國家的市場
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 馬爾地夫、維德角未接近已開發國家市場，故(丁)不選。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 肯亞花卉出口在 2014 ～ 2019 年間成長雙倍，占歐洲花卉來源的 35 ％。目前肯亞花卉業的從業人口已超過 10 萬人，在肯亞，大多數花卉產品都是為了滿足出口的需要而生產的，主要出口市場包括荷蘭，其次是英國、阿拉伯聯合大公國和德國。新鮮玫瑰的主要出口目的地是荷蘭、英國和俄羅斯。據了解，世界上最大的花卉拍賣市場荷蘭的阿爾斯梅爾（Aalsmeer），其經銷商在肯亞每周定期有花卉貨運航班，即早上採摘的鮮花，晚上就能到達荷蘭阿姆斯特丹的市場。請問肯亞花卉得以銷至歐洲國家，與下列哪些因素最相關？(甲)金融流通(乙)空運便捷(丙)關稅協定(丁)文化習俗
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中「在肯亞，大多數花卉產品都是為了滿足出口的需要而生產」，可知種植花卉為經濟目的，與文化習俗無關，故(丁)不選。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 在全球化的影響之下，世界都市的規模數量都較之前增加許多。世界都市與一般都市相較，其何項機構的設立數量可能高於平均值？
  options:
  - label: A
    content: 量販店
  - label: B
    content: 科學園區
  - label: C
    content: 跨國企業總部
  - label: D
    content: 企業生產部門
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 世界都市意為「在全球經濟、政治、社會、文化層面上極具影響力的都市」，此類型都市資訊流通快速、金融產業發達，因此跨國企業往往將總部區位設在主要的世界都市內，故選(C)。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 中南美洲國家部分地區農民，依賴種植咖啡為生。當國際咖啡價格暴跌時，農民生活便無以為繼，此種現象與下列哪些農業生產的特性關係密切？(甲)集約農業(乙)精緻農業(丙)農業專業化(丁)科技化農業(戊)殖民地式經濟
  options:
  - label: A
    content: 甲戊
  - label: B
    content: 乙丁
  - label: C
    content: 丙丁
  - label: D
    content: 丙戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)咖啡為熱帶栽培業，其經營特徵為「大規模」、「專業化（單一種植）」以降低單位生產成品；而中南美洲、非洲、亞洲等地熱帶栽培業的發展往往與殖民歷史背景有關，故選(丙)(戊)。
- id: doc_111_台中_台中二中_社會_地理_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 奇里基火山是巴拿馬海拔最高的山，主峰海拔 3,474 公尺。奇里基火山最近一次的主噴發大約在 500 年前。請問下列哪些火山的噴發形式最接近奇里基火山？(甲)富士山(乙)基隆火山群(丙)澎湖火山群(丁)大屯火山群
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)由文中提及奇里基火山「主峰海拔 3,474 公尺」、「最近一次的主噴發大約在 500 年前」，可知其為猛烈噴發型的火山，故選同為猛烈噴發型的錐狀火山(甲)(丁)。(乙)基隆火山群為侵入式火山，未噴發；(丙)澎湖火山群為寧靜噴發型，為地勢低平的火山熔岩台地或平原。
