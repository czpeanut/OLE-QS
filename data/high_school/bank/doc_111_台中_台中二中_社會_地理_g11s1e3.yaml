  stem: 反全球化並非否定全球化本身，而是反對「全球化帶來的負面影響」，諸如剝削勞工、貧富差距和社會不平等加劇、環境災難等，而這些也正是「反全球化運動」涵蓋的議題。換言之，並非每人都能從全球化中受惠，部分群體因立場差異而對全球化產生質疑，甚至掀起反全球化運動。下列哪些事件為反全球化的運動？(甲)歐債危機(乙)英國的脫歐(丙)新冠病毒誘發全球金融危機(丁) 2017 年美國退出 TPP
