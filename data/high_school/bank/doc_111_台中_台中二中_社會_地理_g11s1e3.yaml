  stem: 電影《阿波卡獵逃》（Apocalypto）主要敘述中南美洲某著名的古文明所發生的獵殺事件，主角成為俘虜後從不可見天的森林家鄉來到當時貴族的居住地，觀察到當地利用原料石灰岩興建的金字塔群。本來主角要在金字塔的頂端被獻祭，所幸祭司要活摘主角心臟時產生日蝕現象。該文明在當時已發展出精準的曆法制度，可惜最後卻因為內部制度的衰敗而導致文明衰退沒落，16 世紀以後被西班牙人所殖民。請問電影中指的文明是下列何者？
