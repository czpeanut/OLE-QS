  group_stem: '委內瑞拉坐擁全球最大石油蘊藏，97 ％外匯收入來自石油，高油價的時代曾造就經濟榮景，委國曾是拉丁美洲最富裕的國家，人民也享盡社會福利。1999 年前總統查維茲（Hugo Chávez）上任後，積極推動多項社會主義政策，包括將民生企業國有化、管制外匯、固定民生用品價格等。但由於糧食等民生事業變得無利可圖，企業紛紛轉往石油發展，全國高達 95 ％企業為石油相關產業，物資幾乎全仰賴進口，風險難以分散。2014 年出現新的採油技術，市場上石油供應量大增、國際油價暴跌，重挫委國經濟。國際油價從每桶 115 美元左右，下探至每桶 70 美元，2016 年委內瑞拉石油收益只剩下 2 年前的 1／3。

    2016 年委內瑞拉物價上漲 800 ％。經濟崩潰加上財政赤字，促使委內瑞拉政府不斷印鈔，光是 2017 年貨幣供應就增加了 14 ％，導致玻利瓦迅速貶值。1 杯 95 玻利瓦的咖啡，1 個月後同樣價錢只能買到半杯，再過 1 個月就只能買到 1／4 杯。請問：'
