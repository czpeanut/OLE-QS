- id: doc_109_高雄_鳳山_自然_生物_選修生物II_g11s1e1_s2_25
  section: 2
  number: 25
  type: multiple
  page: 4
  stem: 下列關於植物為了因應過強陽光所造成影響之敘述，哪些正確？（多選）
  options:
  - label: A
    content: 產生芥子酸酯以吸收多餘電子
  - label: B
    content: 植物多半較矮小
  - label: C
    content: 葉綠體通常均分布於葉肉細胞內
  - label: D
    content: 類胡蘿匐素除了是光合色素，也具抗氧化能力
  - label: E
    content: 葉綠素可能會被自由基破壞
  group_stem: '當陽光過於強烈時，也會對植物造成傷害，為了避免傷害發生，植物會產生一些防護措施，例如當陽光中的紫外線過強時，植株高度通常會降低、葉片變厚、葉面積變小、葉綠體上下相疊，或者花朵富含花青素，除使顏色鮮艷外，可吸收過強的紫外線。研究團隊發現有些植物能合成一些物質，防止植物被曬傷，例如芥子酸酯類能吸收UVB。

    植物會吸收光子進行光反應，一般情況下，光系統Ⅱ會將電子傳給電子傳遞鏈，可是當陽光太強烈時，植物吸收了太多光子時，光系統Ⅱ無法將電子傳給$PQH_{2}$，因而使電子的傳遞會在此發生塞車現象。原因是$PQH_{2}$將電子傳給細胞色素b6f時需大於4～20毫秒（ms），等到$PQH_{2}$失去電子和質子變成PQ時，會再回去光系統Ⅱ，接受電子和質子再成$PQH_{2}$，然而傳遞電子給PQ所需時間遠小於1～4毫秒，甚至可能只需數微秒（μs）就能傳遞過去了。於是當電子傳遞鏈塞車時，有些電子就會離開，到處亂跑，甚至使氧氣還原，產生過多的自由基，因而造成葉綠體被破壞，產生白斑。類胡蘿葡素、葉黃素或者類黃酮等物質，都具有抗氧化能力，以避免白斑產生。'
  answer:
  - B
