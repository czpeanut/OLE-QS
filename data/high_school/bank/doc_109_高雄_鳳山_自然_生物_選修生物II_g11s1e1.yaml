- id: doc_109_高雄_鳳山_自然_生物_選修生物II_g11s1e1_s2_20
  section: 2
  number: 20
  type: single
  page: 3
  stem: 下列有關微脂體的敘述，何者正確？
  options:
  - label: A
    content: 具半透性
  - label: B
    content: 可行有分裂
  - label: C
    content: 內含酵素
  - label: D
    content: 可催化新RNA的合成
  group_stem: '在近代的實驗中，有被認為是活細胞前身的原生體合成，在實驗室中的原生體是無生命的，可由有機物產生，並且可以自發性的聚集形成微小球體，這些微小球體可以表現出半透性等生命特徵。形成微小球體的有機物質如為脂質時，稱為微脂體。微脂體可形成非常相似於細胞膜上的脂雙層。微脂體表現流體性，有時可吸入小微脂體而變大，有時大微脂體可以分裂為二，有時甚至可以分開產生一些小微脂體。實驗室中搖晃多肽、核苷酸及多醣溶液後，可以產生一種為凝聚體的顆粒，其內如含有酵素，可吸收環境中的基質加以反應，並釋出產物。

    生命的遺傳必定是由遺傳物質被包圍入細胞內才開始的。近代的實驗發現RNA具有催化的功能，使人類更相信最早出現的遺傳物質必定是RNA。科學家曾經假設地球的原始時期有一個RNA世界，他們在試管中合成小段的RNA，並加入適量的核糖核酸單體，則這些單體會依據原來的RNA片段，聚合成新股的RNA。

    1980年科羅拉多大學的柴克等人，在研究一種原生動物四膜蟲時發現，前rRNA分子切下的某些RNA片段，可將核苷酸聚合成核苷酸鏈，也能將核苷酸加工切成不同長度的片段，而它本身保持不變，顯然這段RNA具有酵素的功能，這種RNA酵素被稱為核糖核酸酶，某些核糖核酸酶可催化RNA的合成，包括rRNA、tRNA、mRNA。在這之前，我們均認為生物體內的酵素一定只由蛋白質組成。目前大部分的人相信在有蛋白質組成的酵素及DNA出現之前，RNA分子應該是最早在細胞中形成的遺傳物質。'
  answer:
  - A
