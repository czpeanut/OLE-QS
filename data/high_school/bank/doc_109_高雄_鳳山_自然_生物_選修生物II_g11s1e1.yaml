  - label: A
    content: 植物在噴灑巴拉刈後仍可持續進行碳反應
  - label: B
    content: 巴拉刈分解後產生氧使細胞加速受損
  - label: C
    content: 巴拉刈以吸收電子方式干擾電子傳遞過程
  - label: D
    content: 巴拉刈在葉綠體的作用位置主要在基質
  - label: E
    content: 巴拉刈對植物與動物造成毒害的主要胞器完全相同
  answer:
  - C
