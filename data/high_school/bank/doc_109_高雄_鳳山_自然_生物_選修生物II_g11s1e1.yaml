  group_stem: '具有雜色斑紋的葉片稱為斑葉，斑葉的成因有四種，第一種與葉綠體的有無有關，例如：三白草；第二種是因為含有其他色素而影響了葉片的顏色，例如：變葉木；第三種是因為光線於表皮下的細胞間隙反射所造成的色差，例如：粉黛葉；第四種則是因為有些表皮細胞較厚，經光反射所形成，例如：斑葉酢醬草（Oxalis martiana）。

    斑葉植物的同一片葉子常會同時存在白色區域和綠色區域，科學家研究秋海棠斑葉的橫切面，可以發現白區（圖B）的葉肉細胞和上表皮間存有氣體，當光線進入不同介質時，會因折射率改變而反射，而綠區（圖A）則否，因而產生視覺上的差異。綠區和白區的葉肉細胞中都有發展良好的葉綠體，亦可見光合作用的產物澱粉粒。測量光合作用光反應的光系統Ⅱ（PSⅡ）的最大光效率，顯示此兩區的值亦沒有差異。再研究斑葉薜荔的葉片橫切面，在白區中則只發現未能成功發育為葉綠體的原質體，其PSⅡ最大光效率在綠區和白區之間也有顯著的差異。

    科學家也發現以穿透葉片的光觀察秋海棠的斑葉時，綠、白兩區域同樣呈現綠色，且葉片背面看不出斑紋；而斑葉薜荔不論是反射光或穿透光照射，綠區依然是綠色，亮區依然是白色，葉背也具有相同的斑紋。'
  shared_asset: g2_22_24
  answer:
  - D
