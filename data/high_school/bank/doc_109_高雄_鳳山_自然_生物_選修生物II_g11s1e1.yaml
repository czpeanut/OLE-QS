    content: 46億年前太陽系剛形成時，地球表面充滿水蒸氣及各種氣體，包括$H_{2}$、$O_{2}$、$NH_{3}$、$CH_{4}$等
  - label: B
    content: 在有機演化發生的那段時間中，地球的氣候已非常穩定，火山、隕石及強烈閃電的活動都已很少發生
  - label: C
    content: 科學家認為，最原始的細胞屬於異營生物，攝食有機分子，並行有氧呼吸以產生能量
  - label: D
    content: 科學家認為在原始環境下，若環境提供足夠能量，組成生命的大部分有機物可由無機物自然合成
  answer:
