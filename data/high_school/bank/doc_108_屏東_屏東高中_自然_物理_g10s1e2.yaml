  type: multiple
  page: 3
  stem: 在科學史上，對於光的本質，曾有「微粒說」和「波動說」兩派的爭論。下列關於這兩派學說的敘述，哪些正確？
  options:
  - label: A
    content: 「微粒說」由惠更斯提出，「波動說」由牛頓提出
  - label: B
    content: 兩者皆能解釋司乃耳折射定律
  - label: C
    content: 「微粒說」可以解釋繞射現象
  - label: D
    content: 「微粒說」預測光在水中的光速大於在空氣中的光速
  - label: E
    content: 楊氏的干涉實驗是支持「波動說」的證據之一
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
