- id: doc_108_屏東_屏東高中_自然_物理_g10s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 警察電影中，常有審問嫌犯的畫面，常見的情況是，由警員負責偵查審問嫌犯，而檢察官與警長則躲在隔壁房間觀察該嫌犯的行為及動作，通常審問的房間和警長所在的房間只有一鏡牆之隔，但這道牆可使警長看見嫌犯的一舉一動，而嫌犯卻無法看見警長，聰明的你，請你由你所學的光學原理解釋此現象？
  options:
  - label: A
    content: 因為警長所在的房間燈光相當微弱，因此由警長房間透過鏡牆到嫌犯房間的光線非常微弱，使嫌犯無法看見警長
  - label: B
    content: 因為嫌犯的房間不開任何燈光，所以嫌犯看不見警長
  - label: C
    content: 因為光線在牆上漫射
  - label: D
    content: 因為光通過牆 時會折射
  - label: E
    content: 因為光通過牆時會繞射
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
