  - label: A
    content: θ是第四象限角
  - label: B
    content: y＝－4
  - label: C
    content: cosθ＝－$\frac{3}{5}$
  - label: D
    content: sin ( 180°＋θ)＝$\frac{4}{5}$
  - label: E
    content: cos$\frac{\theta}{2}$＞0
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
