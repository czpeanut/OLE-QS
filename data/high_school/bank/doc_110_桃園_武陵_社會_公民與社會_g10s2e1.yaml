  type: single
  page: 4
  stem: 「諮商同意權」是我國《原住民族基本法》所保障的權利。依題文訊息與公民權利相關概念推論，關於此權利落實的情況，下列敘述何者最為正確？
  options:
  - label: A
    content: 部落行使諮商同意權時，必須以舉辦說明會並投票的方式來進行
  - label: B
    content: 凡設籍在原住民族部落傳統領域者，皆能參與開發案的諮商會議
  - label: C
    content: 此權利是由原住民族部落集體行使，個別原住民無從行使該權利
  - label: D
    content: 政府或私人不須取得部落同意但須將利益回饋給族人，使得進行開發
