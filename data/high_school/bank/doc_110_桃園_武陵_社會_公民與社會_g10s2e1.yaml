  section: 2
  number: 29
  type: single
  page: 4
  stem: 依據上文的分析結果，有關我國販毒行為層出不窮的原因為何？
  options:
  - label: A
    content: 政府的政策提供金錢誘因，讓毒販繼續願意販毒
  - label: B
    content: 政府決策未考量非金錢誘因，導致毒販願意販毒
  - label: C
    content: 毒品市場提供毒販金錢誘因，鼓勵其繼續販毒
  - label: D
    content: 毒品市場提供毒販非金錢誘因，導致其繼續販毒
  group_stem: (四)我國政府對於毒品是採取禁止吸食與禁止販售的政策，只要有吸食或是販售，至少科處半年以上的有期徒刑；但至今仍然可以從新聞中聽到有人從事吸毒與販毒的行為，有些學者因此就嘗試探究為什麼有人願意冒極大的風險來從事販毒的行為。研究顯示，政府禁止販毒，有需求的人為了獲得毒品，喊出更高的價格，毒品價格也因此水漲船高。此時也因為價格的上漲，使得毒販願意投入市場，因此即使販售毒品具有高度風險性，也會有毒犯願意嘗試。不過統計也顯示，毒品成癮者若沒有足夠金錢購買昂貴的毒品時，可能會引發例如：竊盜、強盜及恐嚇等犯罪問題。因此有些國家利用毒品除罪化的政策，增加供給，進而使毒品價格下降，不僅能降低販毒者的利潤，或許也能減少為買毒品而引發的相關犯罪。
