  page: 6
  stem: '(一)現在每位即將當兵的男生，都可以出國，只是要經過事先核准，但以前可不是如此。1993年，時為役男之彭姓男子，向內政部出入境管理局申請出境，但遭到否決，否決的依據則來自內政部發布的《役男出境處理辦法》。彭男遂以該行政命令違、違法為由，提起行政訴訟，其訴訟仍遭行政法院以該命令合法為由，駁回聲請人之請求，於是他聲請大法官釋憲，認為以《役男出境處理辦法》來限制役男出境是違憲的。 1997年12月26日，大法官做出釋字第443號解釋，以下摘錄該解釋文：「若欲對人民之自由權利加以限制，必須符合憲法第23條所定必要之程度，並以法律定之或經立法機關明確授權由行政機關以命令訂定。限制役男出境係對人民居住遷徙自由之重大限制，《兵役法》及《兵役法施行法》均未設規定，亦未明確授權以命令定之。行政院發布之徵兵規則，委由內政部訂定《役男出境處理辦法》，欠缺法律授權之依據，該辦法第8條規定限制事由，與前開《憲法》意旨不符，應自本解釋公布日起至遲於屆滿六個月時，失其效力」 請問根據大法官釋憲文判斷，大法官認為原規範違憲，是因為違反下面哪項原則？請以上文內容做為舉例，並結合課堂所學，具體說明原規範違憲之理由。(4分)

    (二)中國當局近來正升級對民眾的人臉辨識監控工具，並透過招標採購最新人工智慧技術，以將收集到的大量民眾個資適當分類，讓監控行動變得更有效率。而我國在2019年臺鐵曾宣布在豐原站試辦「智慧型影像監控系統工程」，並使用人臉辨識系統，主要是為警務用安全名單(黑名單)、人員異常停留或逗留、跨越月臺區警示線、火警偵測等安全目的。但因引起侵犯人權之疑慮，對此臺鐵認為各界對人臉辨識功能及適法性仍有疑慮，將不使用此項功能，並已協調鐵道局及鐵警局取消其中人臉辨識功能及安全特殊名單(警務用)，以確保民眾基本權利不受侵害。 法界一般認為人臉辨識系統為了安全理由，拍攝人們公共場所走動沒有隱私問題，但人臉資料若再搭配上其他個人資料，可以拼湊出一個人的生活習慣，該方法有可能過度侵害基本人權。而車站屬公共場所，為維護公眾安全利益，臺鐵此舉是否侵害基本人權，是否符合「 」原則是關鍵。也有律師指出，因民情不同，台灣民眾不像歐美國家排斥監視器或監控系統，很多人覺得「沒犯法怕人拍什麼」，對於在公共場所的隱私權並不像外國重視，若鐵道局監控系統取景畫面為公共場所，基本上沒有侵害隱私權或個資，適法性沒太大疑慮，鐵道局為維護場所和乘客安全，加裝監控系統應屬正當，但仍要看是否符合「 」原則。請問依據題文內容，「 」部分應當填入何種限制基本人權應遵循之原則？並請摘錄上文內容來說明判斷之理由。(4分)

    (三)衛生主管機關到營養午餐廠商進行抽檢，確認其環境衛生的條件，檢查後列出幾項環境缺失，檢查時並未通知廠商到場說明，後來直接做成行政處分，依法裁處廠商須繳交罰鍰，並要求三週內完成改善報告，否則將再次裁罰。未料，三週時間未到，衛生主管機關直接發函要廠商停止營業…。 請問：以上案例衛生主管機關可能違反正當行政程序的何種基本原則(4分)？又可能違背行政法上何種重要的法律原則呢(3分)？請引用本文內容具體說明之。'
