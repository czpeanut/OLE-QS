  section: 1
  number: 5
  type: single
  page: 1
  stem: '某則網路新聞報導如下：

    立法院三讀通過《消費者債務清理條例》部分條文修正案，法規鬆綁對更生方案之規定，也降低債務人盡力清償的門檻。法案上路後，將大幅放寬債務人還款壓力；不過第29條第4項原本規定，條文應該寫《刑法》用語「追徵金」，但三讀條文卻寫為行政罰用語「追繳金」，當時法案二、三讀時並未有人發現，就在即將完成立法程序之前，司法院認為該名詞應該修訂，於是立法院因此提出覆議，再次進行二、三讀。

    請問就我國法律制定與修正程序而言，以上新聞報導出現了一處「錯誤」，應為下列何者？'
  options:
  - label: A
    content: 覆議應由我國總統直接向立法院提案，而非立法委員自行提出
  - label: B
    content: 立法院所提出的應該是「復議」動議，而不是文中的「覆議」
  - label: C
    content: 法案經過覆議後應重回一讀程序，而非直接從二、三讀議決
  - label: D
    content: 法條用語錯誤應送相關委員會修改，而非由立法院院會審議
