  section: 3
  number: 38
  type: multiple
  page: 5
  stem: 有關上文中提到，在當代勞動與人之價值往往受到資本主義的邏輯所決定，試判斷下列何者能夠符合此種邏輯之主張？
  options:
  - label: A
    content: 有酬勞的勞動者被認為比無酬勞動者更加重要
  - label: B
    content: 政府應重視性別主流化改善隱藏於性別間的不平等
  - label: C
    content: 社會應多加肯定家務勞動間接對市場經濟運作之貢獻
  - label: D
    content: 沒有再生產勞動的付出，市場(性)勞動將缺乏效率與持久性
  - label: E
    content: 工廠的工人創造產品、提升經濟，其勞力付出較志工有價值
  group_stem: (一)主流的人口學研究，將65歲以上的老人歸類為「依賴人口」，老人被視為缺乏經濟獨立與生產力的一群，更成為計算扶養比公式的分子。「依賴人口」與「勞動人口」的區分，揭露資本主義市場邏輯以可轉換為有酬薪資的勞動力與生產力來定義人的價值，不僅邊緣化貨幣市場外的生產活動，也低估家戶內進行的再生產或是無酬的志願服務工作所產生的價值。例如：現今臺灣社會相當依賴祖父母照顧孫子女的勞動力。而臺灣的祖父母早已投入顧孫的行列，根據主計總處的「婦女婚育與就業調查」顯示，學齡前兒童由祖父母照顧的比例由1980年的14.64%上升到2010年的34.74%。這些被國家定義為「依賴人口」與「被扶養人口」的老人，實際上卻密集從事難以被量化與計價的照顧工作，承擔原本該由國家擔負的責任。這群以萬為計算單位的祖父母經驗，挑戰了「依賴」的定義，同時讓我們得以重新思考人與人之間相互依賴的關係。
