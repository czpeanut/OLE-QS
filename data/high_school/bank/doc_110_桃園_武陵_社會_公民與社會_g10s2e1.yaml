- id: doc_110_桃園_武陵_社會_公民與社會_g10s2e1_s2_27
  section: 2
  number: 27
  type: single
  page: 4
  stem: 依據「法人」創設的法律依據進行分類，私法人係依私法所成立之法人，公法人則是依據公法所設立之法人。請問下列組合中哪兩者性質最為接近？
  options:
  - label: A
    content: 臺東縣政府與臺東市公所
  - label: B
    content: 卡大地布部落與盛力能源公司
  - label: C
    content: 盛力能源公司與荒野保護協會
  - label: D
    content: 卡大地布部落與私立學校
  group_stem: (三)臺東縣政府規劃要在臺東縣的「知本溼地」設置全國最大的太陽能光電廠。卑南族卡大地布部落於2019年3月前往行政院抗議，光電區域為該部落的傳統領域，但臺東縣政府2017年只對部落開過一場說明會告知，2018年就公開招標，族人直到招標當天才得知開發案的規劃內容。2018年4月，全案確定由盛力能源公司得標，依其計畫，光電廠開發面積達161公頃，預計每年提撥給部落的回饋金超過2,000萬元。但部落族人質疑，此開發案並未依照《原住民族基本法》第21條，應諮詢並取得原住民族部落的同意權。荒野保護協會也憂心，太陽能光電廠預定設置的位置正好是東亞候鳥遷徙的必經廊道，如果要在溼地架上光電板，可能會破壞棲地與當地野鳥生態。 如上所述，卡大地布部落的族人認為，臺東縣政府未先和部落諮商取得同意權就逕行招標，違反《原住民族基本法》，不同意業者開發，希望臺東縣政府將開發案退回原點，與部落重新溝通。不過，也有當地卑南族人認為，業者提出的回饋可以照顧到部落的老人和小孩子的升學，以及提供就業機會，對於開發持較為正面的態度。2019年6月，由臺東市公所召開諮商會議，首先由業者報告回饋措施，接著聽取民眾意見，最後進行投票，投票結果為187票同意光電案，173票反對。 原住民族委員會表示，卡大地布部落是全臺第一個因重大開發案而行使同意權的部落，這次實務運作與執行狀況將作為未來其他開發案之參考範例。然而，亦有族人指出，部落一直都希望能夠一起參與討論，開發案若能調整位置與範圍，也可能有不同的土地利用方式。若部落只能在無法提出自己的想法下被動進行投票，可能並不是最適切的參與方式。
