  page: 1
  stem: 某國街頭常有高分貝噪音車聚集，該國政府認為，是因現行處罰太輕導致民眾不斷違法，為維護環境安寧，該國實施新法加重處罰，規定凡拆除消音器一律吊銷駕照且不得再考照，並處10萬元以上100萬元以下罰鍰。假設該國《憲法》的基本原則與我國相同，下列對此新法的評論哪項最適當？
  options:
  - label: A
    content: 《憲法》保護自由權，但行為妨礙社會秩序時，人民之自由權即不受保障
  - label: B
    content: 新法之處罰因為有助於維護環境安寧且僅限制特定個人，故符合比例原則
  - label: C
    content: 新法經立法機關通過，符合法律保留原則和正當法律程序，屬合憲之手段
  - label: D
    content: 維護安寧有助公益，但立法機關應考慮採取其他侵害人民權利更小之手段
