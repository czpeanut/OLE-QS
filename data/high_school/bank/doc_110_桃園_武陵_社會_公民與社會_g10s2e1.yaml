  - label: A
    content: 原規範不符合當前社會的價值理念
  - label: B
    content: 原規範的內涵有侵害基本人權之虞
  - label: C
    content: 原規範受到科技發展帶來的挑戰
  - label: D
    content: 原規範違反國際人權公約的規定
