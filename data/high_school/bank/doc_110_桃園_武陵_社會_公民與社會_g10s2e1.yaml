- id: doc_110_桃園_武陵_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 為了達到防偽冒領，辨識路倒病人、迷途失智者及無名屍體等目的，原《戶籍法》第8條規定請領國民身分證須按捺指紋始得核發，但此規定引發社會反彈，認為恐有侵害人民隱私權的疑慮。雖然隱私權並未明文列入我國《憲法》所保障之基本權利，司法院仍在85位立委提出聲請後，針對該法規定做出憲法解釋。試判斷下列何者最接近大法官釋憲之結果？
  options:
  - label: A
    content: 《憲法》及增修條文皆未明文保障隱私權，《戶籍法》之規定無違憲之虞
  - label: B
    content: 隱私權雖非《憲法》列舉權利，但仍為《憲法》概括基本權之保障範圍
  - label: C
    content: 《憲法》所保障之隱私權為人民基本權利，國家不得以任何理由限制之
  - label: D
    content: 《戶籍法》要求按捺指紋作為發給身分證之要件，手段違反適當性原則
