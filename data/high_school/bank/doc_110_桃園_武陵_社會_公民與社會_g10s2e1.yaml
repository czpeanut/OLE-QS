- id: doc_110_桃園_武陵_社會_公民與社會_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 2013年臺東縣布農族獵人王光祿拿拾獲的長槍，獵捕保育類動物給母親食用，經起訴後，依《槍砲彈藥刀械管制條例》及《野生動物保育法》判刑定讞；2017年最高法院認定有違憲之虞，裁定停止審判並聲請釋憲；2021年3月大法官召開釋憲案言詞辯論庭，原住民族團體主張狩獵是原住民傳統文化特徵之一，《野生動物保育法》卻限制原住民只能基於因動物通量、學術研究、教育目的或傳統文化祭儀必要進行狩獵，罔顧其生活習慣，違反《憲法增修條文》與《原住民族基本法》肯定多元文化、維護原住民傳統及促進其發展的意旨，希望可以用部落公法人來規範個人和集體的狩獵方式。此案不只是關乎王光祿的個案判決結果，也在檢討現行法律是否違反憲法所保障的基本權利，若確定違憲，法律將可能再次修正。下列「對於上文」的解讀，何者正確？
  options:
  - label: A
    content: 原住民族團體的期望，較接近於原住民族自治的精神，以保障文化權
  - label: B
    content: 王光祿遭判刑定讞後不再享有權利能力，也不再是法律上的權利主體
  - label: C
    content: 大法官認為《野生動物保育法》因過度限制了原住民的狩獵權而違憲
  - label: D
    content: 若法律確定違憲，將由原住民族團體向立法院提出修正後的法律草案
  tags:
    unit:
      code: CI-2-3-2
      book: 公民與社會2 正義與法治
      chapter: 憲法與權利保障
      title: 憲法保障基本權利
      std: true
    textbook: 公民與社會2 正義與法治 憲法保障基本權利
