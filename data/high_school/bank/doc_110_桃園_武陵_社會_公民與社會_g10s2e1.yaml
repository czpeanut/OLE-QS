  stem: 我國之前發生多起駭人聽聞的跟蹤擄殺案，震驚社會，促成立院三讀通過已延宕多時的《跟蹤騷擾防制法》。該法案將騷擾行為定義為「以人員、車輛、工具、設備、電子通訊、網際網路或其他方法，對特定人反覆或持續為違反其意願且與性或性別有關之下列行為之一，使之心生畏怖，足以影響其日常生活或社會活動。」並定義8大跟騷樣態，包含監視、守候、尾隨等。據上文可知騷擾行為因概念較模糊，故需要透過舉例及解釋加以認定，故在立法的方式上，羅列出許多可能成為騷擾行為的舉例，並輔以概括條款「其他方法」來使之更加全面，並讓人可參考、想像大概的情況。請問這是達到以下什麼原則？
