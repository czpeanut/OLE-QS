  stem: 2020年7月，立法院三讀通過《國民法官法》，將試行為期6年的國民參與刑事審判制度，而此改變主要呼應近年來人民對於司法信任度不足，因而期望透過讓人民共同參與罪、量刑的過程，讓法律與人民更貼近。如此不僅能增進司法的透明度，更期望能改善過去當出現悖離人民「法律情感」的判決出現時，社會各界都要耗費許多澄清、論戰的龐大成本。《國民法官法》預定2023年元旦上路後，改變了過去全由職業法官認定的審判程序，請問為什麼會產生此社會規範的改變？
