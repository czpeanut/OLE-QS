  answer_status: verified
  answer_source: answer_key
  explanation: (A) sin 10°＋$\sqrt{3}$cos 10°＝2［sin 10°．$\frac{1}{2}$＋$\frac{\sqrt{3}}{2}$cos 10°］ ＝2 sin(10°＋60°)＝2 sin70°。 (B) sin 20°＋$\sqrt{3}$cos 20°＝2 sin ( 20°＋60° )＝2 sin 80°。 (C) sin 30°＋$\sqrt{3}$cos 30°＝2 sin ( 30°＋60° )＝2 sin 90°＝2。 (D) sin 40°＋$\sqrt{3}$cos 40°＝2 sin ( 40°＋60° )＝2 sin 100°。 (E) sin 50°＋$\sqrt{3}$cos 50°＝2 sin ( 50°＋60° )＝2 sin 110°。 故選(C)。
