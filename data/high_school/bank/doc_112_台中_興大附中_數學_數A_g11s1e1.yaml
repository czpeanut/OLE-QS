  stem: 下列選項中的值何者最大？
  options:
  - label: A
    content: sin 10°＋$\sqrt{3}$cos 10°
  - label: B
    content: sin 20°＋$\sqrt{3}$cos 20°
  - label: C
    content: sin 30°＋$\sqrt{3}$cos 30°
  - label: D
