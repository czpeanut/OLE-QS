- id: doc_112_台中_興大附中_數學_數A_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 化簡$\sqrt{1+\sin 320^{\circ}}$－$\sqrt{1-\sin 320^{\circ}}$之值可表為
  options:
  - label: A
    content: 2 sin 20°
  - label: B
    content: －2 sin 20°
  - label: C
    content: 2 cos 20°
  - label: D
    content: －2 cos 20°
  - label: E
    content: 2 tan 20°
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $\sqrt{1+\sin 320^{\circ}}$－$\sqrt{1-\sin 320^{\circ}}$ ＝$\sqrt{\sin ^{2}160^{\circ}+\cos ^{2}160^{\circ}+2\sin 160^{\circ}\cos 160^{\circ}}$－$\sqrt{\sin ^{2}160^{\circ}+\cos ^{2}160^{\circ}-2\sin 160^{\circ}\cos 160^{\circ}}$ ＝$\sqrt{(\sin 160^{\circ}+\cos 160^{\circ})^{2}}$－$\sqrt{(\sin 160^{\circ}-\cos 160^{\circ})^{2}}$ ＝| sin 160°＋cos 160° |－| sin 160°－cos 160° | ＝－sin 160°－cos 160°－sin 160°＋cos 160° ＝－2 sin 160° ＝－2 sin 20° 故選(B)。
