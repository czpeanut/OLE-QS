- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列哪一種酵索基因突變會導致同崎片段（Okazaki fragment）在細胞中累積？
  options:
  - label: A
    content: DNA聚合酶
  - label: B
    content: RNA聚合酶
  - label: C
    content: DNA連接酶
  - label: D
    content: RNA連接酶
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: DNA連接酶若發生基因突變，岡崎片段就無法接在一起。故選(C)。
- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關真核生物遺傳訊息的轉錄和轉譯，何者正確？
  options:
  - label: A
    content: 可同時進行轉錄和轉譯
  - label: B
    content: 轉錄過程需解旋酶解開DNA雙股
  - label: C
    content: 一條DNA上的所有基因，皆以同一股作為模版股
  - label: D
    content: 轉錄峙，RNA的合成方向為5’→ 3’
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)原核生物才可同時進行；(B)DNA複製需要解旋酶解開；(C)可以以不同股做模版股。故選(D)。
