  - label: D
    content: 耐高溫的引子合成技術
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 聚合酶來自於一種水生嗜熱菌，(A)(B)(D)皆非。故選(C)。
- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s1_10
