- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 關於DNA複製過程的方向性，何者正確？
  options:
  - label: A
    content: 新股合成方向：3’→5’
  - label: B
    content: DNA聚合酶運作方向：沿著模版股3’→5’
  - label: C
    content: DNA聚合酶連接方向：將新核苷酸含氮氮鹼基接上前一個核苷含氮鹼基
  - label: D
    content: DNA連接酶連接方向：將新核苷酸磷酸基接上前一個核苷酸五碳醣
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)新股合成方向是5´→3´，沿著模版股3´→5´；(C)(D)新核苷酸的磷酸基接上前一個核苷酸的氫氧基。故選(B)。
