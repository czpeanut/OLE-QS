- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s3_22
  section: 3
  number: 22
  type: single
  page: 5
  stem: 此研究中，計劃以外來DNA取代原細胞染色體，比方法與下列何種生物技術雷同？
  options:
  - label: A
    content: 細胞融合
  - label: B
    content: 複製羊
  - label: C
    content: 聚合酶連鎖反應
  - label: D
    content: 基因晶片
  group_stem: '「人造有機體」的研究計畫中，科學家計劃要用最少的基因數目，創造一個有機體，他們要創造的有機體是一種稱為黴漿齒的單細胞生物。

    黴漿菌寄生在動物細胞的表面，沒有細胞壁，是所有細菌中最小、最簡單的一種，這類細菌的基因組非常小（少於100萬個鹼基對，少於1000個基因）。Mycoplasma gentialium 是「生殖道黴漿茵」，存於生殖道與呼吸道，是已知基因組最小的生物，只有58萬個鹼基對，含約500個基因。以致於科學家以其當作實驗對象，來尋找維持生命所需的最少基因數。

    一般而言，在細胞的基因組中，除維持生命所必須的基因之外，尚有許多不是絕對必須但有助於細胞生長的基因，譬如將合成胺基酸之基因除去，只要在垥養基中加入胺基酸即可延續細胞之活力。將此黴漿菌基固定序完畢後，科學家先挑出約300個左右的重要基因，仍可以在實驗室控制的環境下生長，接下來就是在電腦中模擬這些基因如何分工合作以維持細胞的生命，然後計畫將人工合成的300餘個基因的染色體，植入細胞核已被剔除的細胞中，重建生命。

    此計畫被媒體渲染為「創造新生命」，其實DNA就是DNA，不管是自身產生、抑或在實驗室以人工合成，對細胞來說皆是含氮鹼基對組成的雙螺旋結構，只要其上有記載延續細胞生命所需之密碼，都能維持細胞的生命力。

    根據上文，回答下列問題。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)細胞融合會造成不同染色體混合；(C)目的是DNA放大；(D)只有染色體上的部分基因。故選(B)。
