- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s3_26
  section: 3
  number: 26
  type: multiple
  page: 6
  stem: 下列哪些屬於基因治療的範園？（多選）
  options:
  - label: A
    content: 將抗除草劑的基因打入大豆細胞內
  - label: B
    content: 將改造過的DNA注射入人體
  - label: C
    content: 利用攜帶新基因的病毒成染人體細胞
  - label: D
    content: 將改造過的DNA植入骨髓細胞，再將骨髓細胞送入人體
  - label: E
    content: 將生長激素基因送入鮭魚內
  group_stem: '人類基固體計童在2003年宣布解碼完成後，基因治療的想法使扶搖直上。雖然目前成功的應用案例不多，但是人類還是對此療法寄以厚望。基因療法就是把一個新的基因放到病人的細胞中，藉此替換缺失或功能異常的基因。研究人員一般是利用病毒來攜帶這些遺傳物質進入細胞，因為病毒就是演化成做這件事的微生物，它能將自己的基因插入宿主的基因組中。

    基因療法在1990年第一次進行人體測試。醫生可以採取體內或者體外治療，前者是直接將攜帶基因的病毒注射到受損細胞所在區域，這個方法對於治療柏金森氏症之類的疾病比較有效，因為只有大腦的一部分是作用目標。早期的體內基因治療是利用腺病毒（一般感冒病毒的變種），但是它會啟動身體的免疫反應。現今的研究人員則使用不會導致人類疾病的「腺相關病毒」。在體外治療中，研究人員會抽取病人的血液或者骨髓，分離出未成熟的細胞，接著將基因送入這些細胞，再重新注射到病人的血液中。這些細胞會移動到骨髓，在那邊成熟並大量增殖，最終替換掉那些受損的細胞。研究人員希望可以找到替換病人所有骨髓或整體血液系統的方法，這可用於治療鐮狀細胞貧血症。體外基因治療已經用來處理重症聯合免疫缺陷（SCID）病患（又稱為氣泡寶寶）。SCID病患無法對抗一般的感染，通常死於孩童時期。科學家使用反轉錄病毒（HIV屬於這類病毒）來治療這個疾病，它可以非常有效地把基因插入宿主的DNA，約有30個SCID孩童接受治療，超過90％治癒，比起骨髓移植的50％治癒率，這真是一大進展。 【參考自：林雅玲（譯），2008，基因治療如何發揮作用，科學人雜誌(79)。】

    根據上文，回答下列問題：'
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(E)皆不是治療疾病。故選(B)(C)(D)。
