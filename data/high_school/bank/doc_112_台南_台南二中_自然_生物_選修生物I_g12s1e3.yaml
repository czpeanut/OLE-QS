- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有關原核細胞和真核細胞的基因表現，下列敘述何者正確？
  options:
  - label: A
    content: 都需要進行rnRNA的剪接
  - label: B
    content: 都需先將rnRNA送出細胞核，再進行轉譯
  - label: C
    content: 都在核糖體上進行轉譯
  - label: D
    content: 都以操縱組的方式調控其基因的表現
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)真核生物需要剪接；(B)原核生物沒有細胞核；(D)原核生物以操縱組方式調控。故選(C)。
- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 聚合酶連鎖反應（PCR）技術，主要目的是短時間內複製出大量所需DNA。步驗中有三種溫度控制：(a) 50～60℃、(b) 72℃、(c) 90～95℃，及三個步驟：①接合引子、②雙股DNA分離、③複製DNA，下列溫度與步驟搭配及進行順序，何者正確？
  options:
  - label: A
    content: (c)－②→(a)一①→(b)－③
  - label: B
    content: (c)一①→(a)－②→(b)－③
  - label: C
    content: (a)－①→(b)一②→(c)一③
  - label: D
    content: (c)一②→(b)一③→(a)一①
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 解開DNA：加熱至90〜96℃→接上引子：溫度降回45〜55℃→分子延長：問度設定72℃。故選(A)。
- id: doc_112_台南_台南二中_自然_生物_選修生物I_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 聚合酶連鎖反應（PCR）技術的發展，下列何者是主要的關鍵？
  options:
