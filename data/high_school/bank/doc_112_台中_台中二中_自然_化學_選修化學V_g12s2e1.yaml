  - label: B
    content: '11'
  - label: C
    content: '12'
  - label: D
    content: '13'
  - label: E
    content: '24'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 不飽和度DBN＝1＋(碳數量)－(氫數量／2)。不飽和度數值＝π鍵／環的數量。由以上公式可計算$C_{40}H_{58}$的不飽和度DBN＝1＋40－(58／2)＝12。又不具有環、參鍵，則有12個雙鍵。故選(C)。
