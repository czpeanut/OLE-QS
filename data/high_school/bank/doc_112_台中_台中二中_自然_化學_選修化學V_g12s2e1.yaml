- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 呈上題，已知某碳、氫、氧組成的有機化合物4.40毫克完全燃燒後，產生二氧化碳11.0毫克與水5.40毫克。且知，在同溫、同壓下，此化合物的蒸氣密度為氧氣的2.75倍。下列有關此化合物的敘述，何者正確？
  options:
  - label: A
    content: 此化合物的實驗式為$C_{3}H_{8}$O
  - label: B
    content: 此化合物的分子量為44
  - label: C
    content: 此化合物的分子式為$C_{5}H_{12}$O
  - label: D
    content: 有些碳原子以$sp^{2}$混成軌域參與鍵結
  - label: E
    content: 氧與碳以雙鍵結合
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)二氧化碳中的碳含量＝11×$\frac{12}{44}$＝3.0 mg；水中的氫含量＝5.4×$\frac{2}{18}$＝0.6 g；氧重量＝4.4－3.0－0.6＝0.8 mg。故可知化合物中碳、氫、氧原子的莫耳數比＝$\frac{3.0}{12}$：$\frac{0.6}{1}$：$\frac{0.8}{16}$＝5：12：1。又其蒸氣密度（分子量）為氧氣的2.75倍，可知分子量＝32×2.75＝88。故此化合物實驗式、分子式皆為$C_{5}H_{12}$O。(D)(E) DBN＝0，故結構中不存在雙鍵，也不會有原子以$sp^{2}$混成軌域鍵結。故選(C)。
