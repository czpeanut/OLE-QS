- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 清代有一筆記小說<u>埋憂集</u>，作者用誇張的筆法諷刺當時社會：松江有姓趙的先生，以販布起家。其後通過捐納成為一名通判。被人引薦到皇上面前，皇上問他出身，他答道：「臣以前是賣布的，覺得做官比賣布有賺頭，所以才來當官。」皇上震怒之下免除其官職，趙某卻大聲叫喊：「既然剝奪我做官的資格，也應還我錢來啊!」請問上述内容反映了當時的何種現象？
  options:
  - label: A
    content: 反映當時商人地位低落，欲透過「捐官」改變身分
  - label: B
    content: 反映經商利益微薄，百姓不願從商
  - label: C
    content: 反映國空虛，朝廷大肆販賣官職以斂財
  - label: D
    content: 反映當時商人透過「捐官」取得官職的風氣
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 知識分子回憶成立育嬰堂的緣由：「近來溺嬰之風興盛，不僅貧困家庭這麼做，連不那麼貧困的父母，亦將剛出生的嬰兒活活淹死。民眾對此更習以為常，甚至出現模仿行為。我不忍見呱呱墜地的嬰兒，隨即遭到成人殺害。所以求救於四方仁人君子，通過募資成立了這個組織。」根據上述資料，此組織的出現反映何種社會困境？
  options:
  - label: A
    content: 白蓮教宣傳末世思想
  - label: B
    content: 倭寇大量擄掠孩童
  - label: C
    content: 中國人口增長快速
  - label: D
    content: 父母經商無力撫養
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 清代江西有四地聞名中外：樟樹有「藥都」之名；河口有造紙業與茶市；吳城是全省重要的紙、茶、木材集散地；景德以陶瓷生產與貿易聞名國際。請問上文所述應與江西的何者相關？
  options:
  - label: A
    content: 專業化市鎮的發展
  - label: B
    content: 白銀的流通與使用
  - label: C
    content: 行會的規模
  - label: D
    content: 商幫的出現
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 某府志記載如下：「……東北半城皆居織戶……工匠各有專能，匠有常主，計日授值。有他故，則換無主之匠代之，曰換找。無主者黎明立橋以待，緞工立花橋，紗工立廣化寺橋，以車紡絲者曰車匠，立濂溪坊，什百為群。」關於上段資料之解讀何者正確？
  options:
  - label: A
    content: 此情況應發生在唐代
  - label: B
    content: 由「東北半城皆居織戶」可知其為專業市鎮
  - label: C
    content: 由「無主者黎明立橋以待」可知當地失業問題嚴重
  - label: D
    content: 該產業人員熟悉每一階段的手藝
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 北宋仁宗時期的一位大臣上奏表示：「伏思朝廷用度，如軍食、幣帛、茶、鹽、泉貨、金、銅、鉛、銀，以至羽毛、膠、漆，盡出此九道。……此九道者，朝廷所仰給也。」依當時的經濟發展情況而言，文中的「九道」多在哪個區域？
  options:
  - label: A
    content: 西北
  - label: B
    content: 東南
  - label: C
    content: 東北
  - label: D
    content: 西南
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 北宋以後，北方水利工程項目日趨減少；南部各省如江蘇、浙江、福建則快速增加。明代以後湖南與雲南亦增加許多水利工程建設。關於上述的變化我們應如何解讀？
  options:
  - label: A
    content: 顯示政府對江南一帶的重視
  - label: B
    content: 水利工程建設多位於人口遷出地區
  - label: C
    content: 上述地點都是當時工商業最發達之地
  - label: D
    content: 可觀察出糧食作物生產中心的轉移
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: <u>明史</u>記載：「外邦入貢，乃彼之利，一則奉正朔以威其鄰，一則通貿易以足其國。」這段資料針對的主題，顯示出何種特性？
  options:
  - label: A
    content: 中國外交上的平等觀
  - label: B
