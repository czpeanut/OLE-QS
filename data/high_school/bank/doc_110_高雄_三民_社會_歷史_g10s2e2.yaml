questions:
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 一位菲律賓政府官員曾於 1989 年在投稿專欄的文章中提到：「如果你想具有高超的經營手腕，你去求教華人；如果你想要得到可靠的投資，你去求助華人，……首都警局滿街馳騁的新巡邏車，大部分是華人社區的贈品；如果你是想物色敲詐對象的政府官員，去找華人；如果你是想要找尋良好綁架目標的退休軍官，你就翻到電話號碼本中『C』字頭的部分，找姓陳、姓鄭或姓莊的。」由此反映菲律賓當地人對華人存在某些偏見及看法。下列關於上述文句的解釋，何者較符合菲律賓華人的處境？
  options:
  - label: A
    content: 當地人認為華人處事圓融而願學習其社交手腕
  - label: B
    content: 當地人不滿華人占有經濟優勢而對其抱有敵意
  - label: C
    content: 當地人認為華人慷慨捐獻資產而對其心存感激
  - label: D
    content: 當地人不滿華人曾經殖民當地而對其施予暴力報復
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 根據美國 1990 年人口普查統計，二十五歲到二十九歲的亞裔男性，完成高中學業的高達 89%，其中，華裔完成高中學業人數的比例達 90%。二十五歲到六十四歲的男女性受博士教育的華裔為7.1%。據統計，曾經受過十七年到十九年(即研究所程度)教育的，白人在1980
    年平均收入為20083 美元，而華裔只有 16841 美元。請問針對此現象，下列說法何者正確？
  options:
  - label: A
    content: 白人的工作時數多於華裔
  - label: B
    content: 華裔仍受到不平等待遇
  - label: C
    content: 華裔的努力程度不如白人
  - label: D
    content: 白人的智商高於華裔
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 歷史記載有一個時代，其社會現象是「堡壁大帥，數不盈冊，多者不過四、五千家，少者千家、五百家」。此現象出現於何時何地？
  options:
  - label: A
    content: 漢代的關中地區
  - label: B
    content: 永嘉之亂後的江南一帶
  - label: C
    content: 永嘉之亂後的中原地區
  - label: D
    content: 安史之亂後的長江流域
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「我家累世餘慶，子孫眾多，上下和睦。然恐雲礽漸夥，……恐乖負荷之理。今欲維之以局務，定之以規程，推功任能，勸善懲惡，使公私財用之費，冠婚喪祭之等，衣食輿馬之給，子孫可以世守。」上文可以解讀為
  options:
  - label: A
    content: 是宗族長依據族規在嚴罰不守家規的族人
  - label: B
    content: 這種族規不為政府所接受
  - label: C
    content: 這種「規程」沒有太大的約束力
  - label: D
    content: 這類的「規程」在宋元以後很普遍
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 據學者統計，乾隆十八年（1753年）年時，清朝各省平均每平方公里為24人，然而東北三省（奉天、吉林、黑龍江）皆低於1.7人。咸豐元年（1851年）各省平均每平方公里為80.69人，但奉天20.65人、吉林0.43人、黑龍江少於吉林。上述數據可以佐證以下哪一論點？
  options:
  - label: A
    content: 東北地區人少地多，引起華北人民私渡東北
  - label: B
    content: 大量漢人移民東北地區，使得東北境內漢化
  - label: C
    content: 東北省分人口密度低，乃政府人口政策所致
  - label: D
    content: 東北自古以來人口本來就少
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 同學正在準備期末報告，在他的報告中，出現了朱熹的<u>家禮</u>、范仲淹的<u>義莊規矩</u>、司馬光的<u>家範</u>等資料，則他的報告主題最可能為何？
  options:
  - label: A
    content: 明代商幫的興衰
  - label: B
    content: 宋代的士大夫精神
  - label: C
    content: 明清的士紳社會
  - label: D
    content: 宋代的宗族發展
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 明清社會經濟發達，跨省分的商業組織崛起，徽商即為其中著名的商幫。<u>徽州府志</u>記載：「徽州保界山谷，山地依原麓，田瘠确，所產至薄，大都一歲所入，不能支什一。小民多執技藝，或販負就食他郡者，常十九。」由此可知徽商的興起背景為何？
  options:
  - label: A
    content: 民風剽悍，善於在商場上爭鬥
  - label: B
    content: 家鄉貧瘠，不得不向外經商
  - label: C
    content: 物產豐饒，有多餘物資可交易
  - label: D
    content: 交通發達，便於與四方貿易
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有一個時期，許多地方志都提及「民務農賈」、「民務耕商」、「民多商賈」、「富者皆棄本(農)逐末(商)」之類的記述。當時的學者在著作中也有「富室之稱雄者，江南則推新安，江北則推山右」之類的文字。我們應該怎樣理解這些資料？
  options:
  - label: A
    content: 由於經濟繁榮，人們的觀念改變，棄農從商，這應是對宋代的描述
  - label: B
    content: 棄本逐末的觀念，古已有之，富室稱雄者之中，已有江南商人，表示南方繁榮富庶。這應是對宋代的描述
  - label: C
    content: 人民從事商業活動是由於居住在沿海地區，地狹人稠，只有向海外發展，並出現一些新的都市。這是關於明代的敘述
  - label: D
    content: 商業興盛，人們觀念改變，從商致富的人很多，某些地方的商人聞名全國。這是關於明代的描述
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 某人回憶：過去我只是個書生，因欽佩侍郎的學養志趣，在其奉召回鄉建軍時，加入軍隊保衛家鄉。平定太平天國亂事後，我軍之興雖威震海內，但軍餉仍十分吃緊，時常受各地督撫排擠。請問：此人加入的組織可能為？
  options:
  - label: A
    content: 湘軍
  - label: B
    content: 商幫
  - label: C
    content: 倭寇
  - label: D
    content: 會黨
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 雍正皇帝曾對大臣們表示：「京師廣寧門外，向有普濟堂，凡老疾無依之人，每棲息於此，司其事者，樂善不倦，殊為可嘉，聖祖仁皇帝曾賜額立碑，以旌好義，有地方之責者，宜時獎勵鼓舞之。」請問依上文所述，下列解讀何者正確？
  options:
  - label: A
    content: 朝廷鼓勵民間組織慈善事業
  - label: B
    content: 普濟堂為官府出資交由民間經營的機構
  - label: C
    content: 地方長官成立普濟堂受到皇帝嘉獎
  - label: D
    content: 只有仁善好義者可以接受普濟堂的救濟
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 元代有威尼斯商人馬可・波羅到中國遊歷，其留下遊記：「剌桐城(泉州)……居民使用紙幣而為偶像教徒。應知剌桐港即在此城，印度一切船舶運載香料及其他一切貴重貨物咸蒞此港。是亦為一切蠻子(南宋之領土範圍)商人常至之港，由是商貨寶石珍珠……由此港轉販蠻子境內。……大汗在此港徵收稅課，為額極巨。凡輸入之商貨……大汗課額十分取一……剌桐城附近有一別城，名稱迪雲州(福建德化建窯)。製造碗及瓷器，既多且美。」請從此文中判斷何者正確？
  options:
  - label: A
    content: 元代海陸貿易興盛，但使用沉重的金屬貨幣而沒有紙幣，商業發展受限
  - label: B
    content: 泉州港貿易興盛，主要與朝鮮日本進行交易，而少見來自印度的商船
  - label: C
    content: 福建的瓷器產地離泉州不遠，產品可能就近從泉州出海，被販售到海外
  - label: D
    content: 元代以苛捐重稅打壓海上貿易商人，使海貿不興、官府也因此無稅可收
- id: doc_110_高雄_三民_社會_歷史_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 有一份清代考據市面流通錢幣的研究：「江浙行用佛頭洋銀，製自大西洋之西班牙國。西班牙滅小西洋之呂宋國(今菲律賓)，故俗又呼之為大呂宋。乾嘉之時，其國在廣東省，貿易頗盛，故其洋銀流入中國最廣，中國因而習用。之後其國衰微，且所鑄洋銀已換新式，佛頭銀已於道光初年停鑄，所來中國洋銀愈用愈少矣。閩廣各省必椎爛用之，日見其絀，江浙商民樂其便易，市井貿易惟此信行。」請參閱上文與附圖中的佛頭銀(刻文中譯：卡洛斯三世，1779年，託上帝鴻福)，判斷何者正確？
  options:
  - label: A
    content: 西班牙人在呂宋島上發現大量銀礦，製成銀幣後輸送到中國購買商品
  - label: B
    content: 佛頭銀的得名自錢幣上所刻的佛像，是受到流行於東南亞的佛教影響
  - label: C
    content: 福建廣東商人與在呂宋島的西班牙人商貿關係密切，銀幣因此流入中國
  - label: D
    content: 西班牙在東亞的殖民勢力始終強盛，到清朝末年西班牙銀幣仍大量流入
