  stem: 若方程式 $x^{2}$－（2i）x－5＝0 的兩根為α，β，求α$^{2}$＋β$^{2}$＝ ＿＿＿＿。
  explanation: '∵$x^{2}$－（2i）x－5＝0 之兩根為α，β ∴由根與係數的關係得$\begin{cases}\alpha +\beta =-\frac{- 2i}{1}= 2i \\ \alpha \beta =\frac{- 5}{1}=- 5\end{cases}$

    故α$^{2}$＋β$^{2}$＝（α＋β）$^{2}$－2αβ＝（2i）$^{2}$－2×（－5）＝4×（－1）＋10＝6'
