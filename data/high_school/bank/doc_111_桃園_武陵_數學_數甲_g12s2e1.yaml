  stem: 已知拋物線 Γ 的頂點在 y 軸上，焦點為（0，1），且通過點 P（4，4），求拋物線的方程式為＿＿＿＿。（有兩解，各 3 分）
  explanation: '∵頂點在 y 軸上，且焦點為（0，1）

    ∴Γ 必為上下型拋物線，令頂點 V（0，k）

    得Γ：（x－0）$^{2}$＝4c（y－k）

    ∴焦點坐標為 F（0，k＋c）＝（0，1）

    $\Rightarrow$k＋c＝1$\Rightarrow$c＝1－k 代回Γ 得

    $x^{2}$＝4（1－k）（y－k），過 P（4，4）

    代入得 $4^{2}$＝4（1－k）（4－k）

    $\Rightarrowk^{2}$－5k＝0$\Rightarrow$k（k－5）＝0$\Rightarrow$k＝0 或 5

    (1) 若 k＝0，則 c＝1－k＝1－0＝1

    ∴Γ：（x－0）$^{2}$＝4×1×（y－0）$\Rightarrowx^{2}$＝4y

    (2) 若 k＝5，則 c＝1－k＝1－5＝－4

    ∴Γ：（x－0）$^{2}$＝4×（－4）（y－5）$\Rightarrowx^{2}$＝－16（y－5）'
