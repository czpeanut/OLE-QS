- id: doc_111_桃園_武陵_數學_數甲_g12s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 請選出敘述正確的選項。
  options:
  - label: A
    content: 若（a＋2）－5i＝－4＋（b＋3）i，則 a＝－6，b＝－8
  - label: B
    content: z 為複數，則$(z + 1)(\overline{z} + 1)$一定為實數
  - label: C
    content: 若 a＋b＝m 且 ab＝n，則 a，b 為方程式 $x^{2}$－mx＋n＝0 的兩根
  - label: D
    content: f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d，a，b，c，d 皆為正數，則 f（x）＝0 一定有虛根
  - label: E
    content: f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d，a，b，c，d 皆為實數，若 f（α）＝0 且 0＜α＜1，則 f(0)f(1)＜0
  explanation: '(A)╳：∵（a＋2）－5i＝－4＋（b＋3）i，則 a＝－6，b＝－8 只在 a，b 皆為實數時成立

    (B)○：∵z 為複數 ∴令 z＝a＋bi，其中 a，b 為實數

    ∴$(z + 1)(\overline{z} + 1)$＝（a＋bi＋1）（a－bi＋1）＝〔（a＋1）＋bi〕〔（a＋1）－bi〕

    ＝（a＋1）$^{2}$－（bi）$^{2}$＝（a＋1）$^{2}$＋$b^{2}$ 為實數

    (C)○：∵a＋b＝m，ab＝n 代入 $x^{2}$－mx＋n＝0

    $\Rightarrowx^{2}$－（a＋b）x＋ab＝0$\Rightarrow$（x－a）（x－b）＝0$\Rightarrow$x＝a 或 b

    ∴a，b 為方程式 $x^{2}$－mx＋n＝0 的兩根

    (D)╳：反例：令 a＝1，b＝3，c＝3，d＝1

    ∴f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d＝$x^{3}$＋$3x^{2}$＋3x＋1＝（x＋1）$^{3}$＝0

    $\Rightarrow$x＝－1，－1，－1，三個相等實根，無虛根

    (E)╳：反例：令 f（x）＝（x－0）（x－α）（x－1），0＜α＜1

    ∴f(0)×f(1)＝0×0＝0，矛盾

    故選(B)(C)'
- id: doc_111_桃園_武陵_數學_數甲_g12s2e1_s3_1
  section: 3
