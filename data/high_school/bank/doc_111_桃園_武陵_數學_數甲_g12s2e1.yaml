  explanation: '令橢圓Γ''：$x^{2}$＋$2y^{2}$＝4$\Rightarrow\frac{x^{2}}{4}+\frac{y^{2}}{2}= 1\Rightarrow$a''$^{2}$＝4，b''$^{2}$＝2

    $\Rightarrow\begin{cases}a'' = 2 \\ b'' = \sqrt{2} \\ c'' = \sqrt{a''^{2} -b''^{2}} = \sqrt{4 - 2} = \sqrt{2}\end{cases}$ ∴正焦弦長為$\frac{2b''^{2}}{a''}=\frac{2\times (\sqrt{2})^{2}}{2}= 2$

    令雙曲線Γ：$\frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}= 1$ ∵$a^{2}$＋$b^{2}$＝$c^{2}$＝c''$^{2}$＝2 ……………（＊）

    又正焦弦長為$\frac{2b^{2}}{a}= 2$

    ∴$b^{2}$＝a 代入（＊）得 $a^{2}$＋a－2＝0$\Rightarrow$（a＋2）（a－1）＝0$\Rightarrow$a＝1 或－2（不合）

    ∴$b^{2}$＝a＝1$\Rightarrow$b＝1

    故Γ：$\frac{x^{2}}{1^{2}}-\frac{y^{2}}{1^{2}}= 1\Rightarrowx^{2}$－$y^{2}$＝1'
