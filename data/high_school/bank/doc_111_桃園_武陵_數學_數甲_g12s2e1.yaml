  stem: '設 f（x）＝$x^{3}$＋x－1，已知 f（x）＝0 唯一的實根為α，試回答下列問題。

    (1) 若α介於連續整數 k 與 k＋1 之間，求整數 k 之值。（請寫出過程及用到的定理名稱）

    (2) 以牛頓法解α，接近α的初始值為 $a_{1}$，過（$a_{1}$，f（$a_{1}$））作切線交 x 軸於（$a_{2}$，0），試以 $a_{1}$ 表示 $a_{2}$ 的值。（即以 $a_{2}$＝F（$a_{1}$）的形式表示）

    (3) 承(1)及(2)，設初始值 $a_{1}$＝k，牛頓法的遞迴關係式為 $a_{n＋1}$＝F（$a_{n}$），試求 $a_{2}$ 與 $a_{3}$ 的值。（請以實數表示，勿以 k 表示）'
