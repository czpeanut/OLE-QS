- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 羅興亞人長期遭遇迫害，少數羅興亞人亦組織「羅興亞救世軍（ARSA），對於緬甸的軍事侵略做出反擊。直至2017年8月25日，ARSA襲擊位於若開邦某間警察局並殺死12人，此舉引來緬甸的軍事報復，促使雙方衝突愈演愈烈。而若開邦將近16萬名羅興亞人逃亡至孟加拉，「緬甸軍方與當地佛教徒甚至放火燒掉其村落並逼迫他們離開」。上述「 」處屬於哪種行為？
  options:
  - label: A
    content: 包容文化多樣性
  - label: B
    content: 尊重文化差異性
  - label: C
    content: 消弭族群間的不平等
  - label: D
    content: 實施種族清洗
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 加拿大有「第一民族」之稱的印第安人，其政府於19世紀晚期大舉設置「印第安寄宿學校」，將許多印第安兒童送往學校學習英語和融入基督教文化，並無法使用母語和接觸傳統文化，直至1996年最後一所寄宿學校關閉。百年以來的寄宿學校政策，至少影響15萬名兒童與家庭。若以多元文化主義角度分析，下列敘述何者正確？
  options:
  - label: A
    content: 為了促使印第安兒童融入社會，將其送往寄宿學校是積極性差別待遇
  - label: B
    content: 印第安寄宿學校可展現印第安與白人文化的差異，符合多元文化主義
  - label: C
    content: 印第安兒童學會英語可提高社會地位和薪資水準，是實質正義的展現
  - label: D
    content: 當時加拿大政府對印第安族抱持的態度屬於「我族中心主義」的觀點
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 臺灣許多民眾在跨年夜倒數迎接新年，但是有一群人以撿垃圾的方式跨年。「笑擁地球青年聯盟」是由交大學生發起，政大、東吳等大學生加入組成的志工，帶領兩千名大學生在跨年結束的臺北市府前廣場，撿拾狂歡之後的垃圾；他們工作到元旦凌晨兩點，總共收拾八公噸的垃圾交給清潔隊員。他們藉由自己的力量，在迎接新年的同時，讓101大樓周邊恢復乾淨。關於「笑擁地球青年聯盟」所發起的活動，下列敘述何者正確？
  options:
  - label: A
    content: 目的是促使政府改變不當政策，爭取弱勢權益
  - label: B
    content: 採取體制內與體制外雙管齊下的社會參與
  - label: C
    content: 是具有公民參與意願並能擔負責任的表現
  - label: D
    content: 是為了維持既有社會傳統價值的社會運動
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 法國總統馬克宏於日前出訪埃及，在記者會上表示，法國政府沒有禁止「黃背心」示威者的遊行活動，但暴徒搗毀店鋪、公共設施，才依法把這些人抓起來，「一個包容、積極向上、充滿活力的社會是打擊極端主義最佳的堡壘」。而埃及總統基西認為：「埃及不同於歐洲或北美，不能把一種發展的道路強加給所有的社會。不要忘記我們所處的地區是不穩定的」。若就民主或人權的角度而言，關於兩位總統的看法，下列分析何者正確？
  options:
  - label: A
    content: 法國總統認為任何的示威遊行都不該禁止，才能塑造包容向上充滿活力的社會
  - label: B
    content: 埃及總統認為民主的制度與原則不能改變，才能透過民主制度帶來區域的穩定
  - label: C
    content: 法國總統認為民主應保障集會、遊行和示威自由，但不代表可以縱容暴力行為
  - label: D
    content: 兩位總統的發言顯示，公民權利是否落實保障應以國家所處的社會穩定度決定
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 聯合國〈世界人權宣言〉之序言明確指出對於基本人權的承認，乃是世界自由、正義與和平的基礎，其基本理念是人人生而自由，尊嚴和權利一律平等。關於〈世界人權宣言〉的敘述，下列何者正確？
  options:
  - label: A
    content: 由聯合國大會通過，屬於強制性的國際公約
  - label: B
    content: 內容包含公民政治權利，但是並未納入經濟權利
  - label: C
    content: 法律之前人人平等，享有不被任意逮捕的權利
  - label: D
    content: 主張人人有權享有生命，並明文禁止死刑
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 身為一個具有權利意識的公民，必須了解與認識其享有的各項權利，下列何者是高中生應有的權利意識？
  options:
  - label: A
    content: 維護每個學生的受教權，阿河上課不吵鬧、不干擾其他同學的學習
  - label: B
    content: 為了讓其他學生專心上課，教師讓不專心的學生站在走廊
  - label: C
    content: 三年A班的班費遺失，班長可請教官搜索與檢查學生書包
  - label: D
    content: 為了避免學生發表不雅的言論而損及學校名譽，學校得關閉所有公共論壇
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 臺北於2017年舉辦世界大學運動會，排灣族、泰雅族的原漢團員一同演唱〈擁抱世界擁抱你〉主題曲，曲風結合排灣族傳統聚會歌的元素與當代流行電音。而開幕表演節自包括原住民族歌謠、客家山歌、採茶歌、舞龍舞獅、歌仔戲等，呈現出多元文化的特色。根據上文內容判斷，下列敘述何者正確？
  options:
  - label: A
    content: 原漢團員演唱〈擁抱世界擁抱你〉，即是展現我族中心主義
  - label: B
    content: 排灣族傳統聚會歌的元素與當代流行電音，兩者呈現出文化位階之現象
  - label: C
    content: 世大運的表演節目讓各族群展現其文化特色，屬於文化權之維護
  - label: D
    content: 原住民族僅能參與表演活動，並無法參與競技比賽，實為美中不足之處
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
