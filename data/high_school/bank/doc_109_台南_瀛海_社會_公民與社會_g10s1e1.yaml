  stem: 自1949年以來，兩岸關係受到國際組織的牽動之下，歷經軍事衛突、和平對峙、民間交流等階段，臺海兩岸於各個階段均提出不同的發言與政策。關於兩岸各個階段的政策演變，下列何者正確？
  options:
  - label: A
    content: 軍事衝突階段：中國制定《反分裂國家法》
  - label: B
    content: 民間交流階段：臺灣廢除《動員勘亂時期臨時條款》
  - label: C
    content: 民間交流階段：臺灣提出不接觸、不談判、不妥協
  - label: D
    content: 和平對峙階段：中國強調武力侵略臺灣
