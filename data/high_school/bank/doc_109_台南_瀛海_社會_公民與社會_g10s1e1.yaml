    content: 我國政府於國際社會處處碰壁，主要是受到一個中國框架之影響
  - label: B
    content: 建立正式外交是我國提升國際能見度的主要途徑
  - label: C
    content: 承認臺灣是主權獨立國家，為兩岸創造雙贏的格局
  - label: D
    content: 我國的外交政策以金援外交為主
