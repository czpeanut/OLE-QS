- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 華航機師罷工正式落幕，勞資方歷經7天4度談判，華航除了對於10條疲勞航線讓步之外，再承諾2年內研議規劃只進用外國籍副機飾、不對工會秋後算帳、不撤換管理高層但加強內部溝通、增加飛安且獎金等事項；工會則簽署和平協議，即日起停止罷工，並承諾3年半之內不再罷工。對於此次華航罷工的行動，下列解讀何者正確？
  options:
  - label: A
    content: 罷工必須獲得政黨支持，才有與公司談判的資本
  - label: B
    content: 罷工的行為促使社會正視其訴求，雖然可能造成不便，但是仍可接受
  - label: C
    content: 成熟的公民社會團體應時常透過激烈的社會運動，才能展現多數民意之所在
  - label: D
    content: 參與工會、志願結社的目的是推動罷工，以爭取勞工權利
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某間科技公司招募行政助理期間，曾電話回覆面試者表示徵才職務僅限女性，拒絕男性求職者，導致部分男性面試者感到不滿並提出檢舉。高雄市勞工局介入調查，該公司辯稱是考量女性細心度較佳，然而對照職缺內容發現並沒有其合理性與必要性，因此市政府決定依法對該公司裁罰30萬元。請問市政府是依據哪項法律做出裁罰？
  options:
  - label: A
    content: 《勞動基準法》
  - label: B
    content: 《性別工作平等法》
  - label: C
    content: 《勞動事件法》
  - label: D
    content: 《勞資爭議處理法》
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 關於人權發展的敘述，下列何者正確？(甲)風災發生之後，政府提供「以工代賑」的機會，屬於經濟社會權利的保障；(乙)民眾行使「公民投票權」屬於集體發展權利的表現；(丙)為了因應高齡化社會而推辦「國民年金」屬於政府保障經濟社會權利的做法；(丁)兩次大戰的浩劫而主張「和平權」，屬於政府不得侵犯的公民政治權利
  options:
  - label: A
    content: 乙丙
  - label: B
    content: 乙丁
  - label: C
    content: 甲丙
  - label: D
    content: 甲丁
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 公民身分是指個人做為一個政治共同體的成員資格，在法律層次上如何界定它？
  options:
  - label: A
    content: 擁有共享的情感與認同的成年人，都可以享有公民身分
  - label: B
    content: 具有共同民主信仰的成年人，都可以享有公民身分
  - label: C
    content: 凡是具有國民身分並有行為能力的成年人，都可以享有公民身分
  - label: D
    content: 凡是具有公民意識的所有人，都可以享有公民身分
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 隨著人權議題日益受到重視，人權保障的對象亦有逐漸擴大的趨勢，目前國際社會比較重視兒童、婦女、原住民、同性戀者與國際勞工等議題，至於我國社會正面臨哪種弱勢族群的人權議題？
  options:
  - label: A
    content: 家庭暴力經常涉及虐待兒童，因此兒童人權問題受到重視
  - label: B
    content: 政府將國家公園開放給予原住民狩獵，以尊重其生活習慣
  - label: C
    content: 我國現行法律廢除死刑，以遵照盟際人權公約的規定
  - label: D
    content: 《憲法》及《憲法增修條文》規定種族一律平等，已明文保障新住民的語言、就業與參政權益
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 曉華進入職場工作之前，搜尋我國相關的勞動法規，希望可以確保自身權益，關於其蒐集之資料，下列何者正確？
  options:
  - label: A
    content: 由於男性不擅長育嬰，因此由女性擔任育嬰工作比較拾當
  - label: B
    content: 若職場發生性騷擾行為，其適用的法律為《勞動基準法》
  - label: C
    content: 為了維護公司利益，老闆可與員工擬訂結婚或懷孕須自行離職的契約
  - label: D
    content: 職場之招募、考續、升遷等，不得因性別或性傾向而有差別待遇
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 2019年3月初，育達科大涉及與仲介代辦公司合作，招攬菲律賓學生來臺就讀並強迫到工廠工作的消息。然而此種情形並不是特例，許多東南亞學生來臺遭到勞力剝削而變成「學工」。有的學生一週只能上課2天、休假1天，其他4天則是集體載到工廠工作。這些學校掛著「產學合作」的招牌，實際內容卻與其來臺求學的科系名目或技能無關。從公民權利的角度探討此事件，下列敘述何者正確？
  options:
  - label: A
    content: 經由產學合作來臺就學的學生稱為新二代，其人數已超越全體學生一成
  - label: B
    content: 產學合作的學生到工廠工作，因其具備學生身分，不適用我國的勞動規定
  - label: C
    content: 東南亞學生不具備我國公民身分，所以無法保障其公民權利
  - label: D
    content: 國際學生或勞工的權利應受到重視，此為社會權的展現
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 過去已有研究指出，房價愈高，年輕人結婚率愈低。中研院公布「臺灣社會變遷基本調查計畫」研究結果，顯示女性受教育程度成長，現在大學中，55%的學生為女性，出男性高出10%。從1990年到2015年間的受訪女性，認為婚後應與公婆同住的比率從54.6%下滑到27%；偏好另覓新居的人數則從30.4%提高到48.2%。若特別探討月薪3萬元以下的族群，有48.39%的男性沒有結婚，比起低薪女性僅24.11%。現有研究指出，月薪3萬元以下低薪族中，男性比女性更被排除在婚姻市場外，未婚率、離婚率都偏高。根據前述，月薪3萬元以下男性未婚比例較女性高，可能與下列何者最相關？
  options:
  - label: A
    content: 48.2%希望結婚後可以另覓新居，但民眾的薪資不足以負擔高房價
  - label: B
    content: 55%的大學學生為女性，女性受教育程度較男性高，經濟獨立自主
  - label: C
    content: 認為婚後應與公婆同住的比率從54.6%下滑到27%，三代同堂式微
  - label: D
    content: 低薪女性僅24.11%為單身狀態，低薪男性想找條件相當者更為困難
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 長久以來，人民為了爭取人權投注許多心力，關於人權的發展與內涵，下列敘述何者正確？(甲) 20世紀以來較強調社會、經濟權與平等權；(乙)弱勢族群權屬於第三代人權；(丙)人身自由權是一切自由權利的基礎；(丁) 17世紀以前即已重視參政權；(戊)國民年金、老農津貼等政策屬於第一代人權之實現
  options:
  - label: A
    content: 甲丙戊
  - label: B
    content: 乙丙丁
  - label: C
    content: 乙丁戊
  - label: D
    content: 甲乙丙
- id: doc_109_台南_瀛海_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 附圖是父母離婚之後，雙方對未成年子女親權或監護權行使的比例，可以發現早期的男女公民權利存在哪種問題？
  options:
  - label: A
    content: 監護權以父母共同行使為主流
  - label: B
    content: 父母平均分擔家庭的生養責任
  - label: C
    content: 女性較難獲得親權或監護權，屬於性別歧視
  - label: D
    content: 女性具備天生的母性，因此較容易獲得親權或監護權
