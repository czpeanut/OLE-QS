  stem: 由於《兩岸租稅協議》存在技術問題，因此兩會暫時沒有簽署。其所面臨的技術問題乃在(甲)爭議的根源性問題，連帶影響課稅權劃分等實質問題。對於臺灣政府而言，並沒有退讓空間；而「(乙)」政策亦是中國不可讓步的紅線，因此雙方如何在協議文字異中求同，將是協議能否獲得進展的關鍵。(甲)(乙)分別應填入什麼名詞？
  options:
  - label: A
    content: 《臺灣地區與大陸地區人民關係條例》、《反分裂國家法》
  - label: B
    content: 臺灣優先、一個中國
  - label: C
    content: 臺灣主體性、一國兩制
  - label: D
    content: 主權、一個中國
