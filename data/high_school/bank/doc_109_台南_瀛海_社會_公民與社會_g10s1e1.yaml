  section: 1
  number: 42
  type: single
  page: 4
  stem: 2015年，亞太綠黨於紐西蘭首都舉行大會，臺灣綠黨共同召集人提出承認臺灣為主權獨立國家等五項決議獲得大會通過。相較之下，我國政府於國際社會處處碰壁，無法與各國政府建立正式外交關係，但是臺灣綠黨積極與亞太地區綠黨建立網絡與友誼，實為珍貴的外交資產，值得長期深耕發展。若以我國與國際社會的關係檢視前文，下列敘述何者正確？
  options:
