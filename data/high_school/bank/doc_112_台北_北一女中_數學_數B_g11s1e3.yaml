- id: doc_112_台北_北一女中_數學_數B_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設 x 為實數，坐標平面上，O 為原點，已知$\vec{OA}$＝（－1，2），$\vec{OB}$＝（x＋3，－1），$\vec{OC}$＝（2，x－2），若 A、B、C 三點共線，則 x 的所有可能值之總和為何？
  options:
  - label: A
    content: '0'
  - label: B
    content: －$\sqrt{7}$
  - label: C
    content: '7'
  - label: D
    content: $\sqrt{7}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '∵A、B、C 三點共線

    ∴$\vec{AB}$//$\vec{AC}$ ⇒ （$\vec{OB}$－$\vec{OA}$）//（$\vec{OC}$－$\vec{OA}$）

    ⇒ （x＋4，－3）//（3，x－4）

    ⇒ $\frac{x +4}{3}=\frac{-3}{x -4}$

    ⇒ （－3）．3＝（x＋4）（x－4）

    ⇒ $x^{2}$＝7 ⇒ x＝±$\sqrt{7}$

    則 x 的所有可能值之總和為 0

    故選(A)'
- id: doc_112_台北_北一女中_數學_數B_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知向量$\vec{a}$與$\vec{b}$所決定的平行四邊形面積為 4，則下列哪兩個向量所決定的平行四邊形面積為 12？
  options:
  - label: A
    content: 2$\vec{a}$＋3$\vec{b}$及$\vec{b}$
  - label: B
    content: 3$\vec{a}$＋5$\vec{b}$及$\vec{b}$
  - label: C
    content: 3$\vec{a}$－2$\vec{b}$及－3$\vec{a}$＋3$\vec{b}$
  - label: D
    content: $\vec{a}$－3$\vec{b}$及$\vec{a}$
  - label: E
    content: 3$\vec{a}$及 2$\vec{b}$
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設$\vec{a}$＝（$a_{1}$，$a_{2}$），$\vec{b}$＝（$b_{1}$，$b_{2}$） ⇒ ∣$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right|$∣＝4

    (A) ╳：｜$\left| \begin{matrix}2a_{1}+3b_{1} & b_{1} \\ 2a_{2}+3b_{2} & b_{2}\end{matrix} \right|$｜＝｜$\left| \begin{matrix}2a_{1} & b_{1} \\ 2a_{2} & b_{2}\end{matrix} \right|$｜＝2．4＝8

    (B) ○：｜$\left| \begin{matrix}3a_{1}+5b_{1} & b_{1} \\ 3a_{2}+5b_{2} & b_{2}\end{matrix} \right|$｜＝｜$\left| \begin{matrix}3a_{1} & b_{1} \\ 3a_{2} & b_{2}\end{matrix} \right|$｜＝3．4＝12

    (C) ○：｜$\left| \begin{matrix}3a_{1}-2b_{1} & -3a_{1}+3b_{1} \\ 3a_{2}-2b_{2} & -3a_{2}+3b_{2}\end{matrix} \right|$｜＝｜$\left| \begin{matrix}b_{1} & -3a_{1}+3b_{1} \\ b_{2} & -3a_{2}+3b_{2}\end{matrix} \right|$｜＝｜$\left| \begin{matrix}b_{1} & -3a_{1} \\ b_{2} & -3a_{2}\end{matrix} \right|$｜

    ＝｜$\left| \begin{matrix}3a_{1} & b_{1} \\ 3a_{2} & b_{2}\end{matrix} \right|$｜＝3．4＝12

    (D) ○：｜$\left| \begin{matrix}a_{1}-3b_{1} & a_{1} \\ a_{2}-3b_{2} & a_{2}\end{matrix} \right|$｜＝｜$\left| \begin{matrix}-3b_{1} & a_{1} \\ -3b_{2} & a_{2}\end{matrix} \right|$｜＝｜$\left| \begin{matrix}a_{1} & 3b_{1} \\ a_{2} & 3b_{2}\end{matrix} \right|$｜＝3．4＝12

    (E) ╳：｜$\left| \begin{matrix}3a_{1} & 2b_{1} \\ 3a_{2} & 2b_{2}\end{matrix} \right|$｜＝3．2．4＝24

    故選(B)(C)(D)'
