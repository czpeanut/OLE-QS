- id: doc_110_台南_善化_數學_數甲_g12s2e2_s2_1
  section: 2
  number: 1
  type: calc
  page: 1
  stem: 下列哪一些條件可以確定z為實數？ (1) $z=-z$ (2) $z=\overline{z}$ (3) $iz=\overline{z}$ (4) $z\cdot \overline{z}$為實數 (5) $z-\overline{z}$為實數
  answer:
  - (1)(2)(5)
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)若$z=a+bi\because z=-z\therefore z+z=0,2z=0,z=0$實數 $\therefore$正確

    (2)$z=\overline{z},z$為實數 $\therefore$正確

    (3)$iz=\overline{z},i(a+bi)=a-bi,-b+ai=a-bi\Rightarrow a=-b$可能是虛數 $\therefore$錯誤

    (4)$z\times \overline{z}=(a+bi)(a-bi)=a^{2}+b^{2}\in R$恆成立 $\therefore z$未必是實數 $\therefore$錯誤

    (5)$z-\overline{z}=a+bi-(a-bi)=2bi\in R\Rightarrow b=0\Rightarrow z\in R\therefore$正確

    故選(1)(2)(5)。'
