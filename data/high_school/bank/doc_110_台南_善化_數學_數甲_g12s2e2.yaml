- id: doc_110_台南_善化_數學_數甲_g12s2e2_s4_1
  section: 4
  number: 1
  type: calc
  page: 1
  stem: 設實係數二次方程式$x^{2}-kx+(k+3)=0$的兩根為$\alpha ,\beta$，試問： (1) 若$\alpha ,\beta$為實數，求k的範圍。 (2) 續(1)，求k等於多少時，得α$^{2}$＋β$^{2}$ 的最小值為何？
  answer:
  - (1)$k\geq 6∨k\leq -2$；(2)$k=-2$時，最小值為2
  answer_status: verified
  answer_source: answer_key
  explanation: '$\alpha +\beta =-\frac{-k}{1},\alpha \beta =k+3$。

    (1)$D=(-k)^{2}-4\times 1\times (k+3)\geq 0\Rightarrow k^{2}-4k-12\geq 0\Rightarrow (k-6)(k+2)\geq 0$，

    $k\geq 6$或$k\leq -2$。

    (2)$\alpha ^{2}+\beta ^{2}=(\alpha +\beta )^{2}-2\alpha \beta =k^{2}-2(k+3)=k^{2}-2k-6=(k-1)^{2}-7\geq -7$，

    所以當$k=1$時, $\alpha ^{2}+\beta ^{2}$有最小值。'
