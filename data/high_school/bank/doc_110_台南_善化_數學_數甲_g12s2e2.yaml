  stem: '設已知實係數方程式$x^{3}$－$10x^{2}$＋mx－n＝0有兩複數根a＋3i, 1＋bi，其中a, b是實數。

    (1)求數對(a，b)＝＿＿＿＿

    (2)求三次函數y＝$x^{3}$－$10x^{2}$＋mx－n的圖形與x軸的交點坐標為＿＿＿＿'
  answer:
  - (1) (1,－3)；(2) (8,0)
  answer_status: verified
  answer_source: answer_key
  explanation: '$x^{3}-10x^{2}+mx-n=0$的二根為$a+3i,1+bi$

    $\because$虛根成對定理, 得知$a=1,b=-3$

    (1) $(a,b)=(1,-3)$

    (2) $\left[ x-(1+3i) \right] \left[ x-(1-3i) \right] =(x-1)^{2}-(3i)^{2}=x^{2}-2x+10$

    $x^{3}-10x^{2}+mx-n=(x^{2}-2x+10)(x-8)$

    $\therefore m=26,n=80$

    $y=x^{3}-10x^{2}+26x-80=(x^{2}-2x+10)(x-8)$與$x$軸交$(8,0)$'
