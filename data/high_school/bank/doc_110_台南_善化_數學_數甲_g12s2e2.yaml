- id: doc_110_台南_善化_數學_數甲_g12s2e2_s1_3
  section: 1
  number: 3
  type: calc
  page: 1
  stem: 設a , b為整數，若方程式$x^{2}$＋ax＋4b＝0有一根為－1，另一根為α且5＜α＜10，則數對 (a,b)＝？ (1) (－7,－8) (2) (－7,－4) (3) (－7,－2) (4) (7,－2) (5) (7,－8)
  answer:
  - (3)
  answer_status: verified
  answer_source: answer_key
  explanation: '$x^{2}+ax+4b=0$，有二根$-1,\alpha$

    $\therefore -1+\alpha =-a,(-1)\times \alpha =4b,\alpha =-4b$

    $\because 5<\alpha <10\therefore 5<-4b<10\Rightarrow -\frac{5}{4}>b>\frac{-10}{4}\therefore b=-2$

    $-1-4b=-a\Rightarrow a=4b+1\therefore a=-7$

    $\therefore (a,b)=(-7,-2)$，故選(3)'
