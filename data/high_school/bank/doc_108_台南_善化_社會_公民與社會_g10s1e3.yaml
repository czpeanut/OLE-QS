- id: doc_108_台南_善化_社會_公民與社會_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: '立法院今日（108.12.31.）下午三讀通過以民進黨團版本為主的《反滲透法》，全文共12條，法案內容指出，若接受境外敵對勢力的指示，委託或贊助，從事選舉相關活動，最高可處5年以下有期徒刑或併科罰金1000萬元。《反滲透法》全文如下：

