- id: doc_108_台南_善化_社會_公民與社會_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 舊《商標法》第63條規定，商標權受侵害之被害人得向加害人請求商品零售價之「五百至一千五百倍」損害賠償，導致有網友販售仿冒品獲利僅十餘萬元，卻須賠償上億元的案例發生。由於不法所得逾賠償金額比例失當，恐有違憲之虞，立法院乃修法更改賠償金額之計算方式。請問舊《商標法》第63條違反哪個憲法原則？
  options:
  - label: A
    content: 「比例原則」之衡量性——不法獲利僅數十萬元卻須賠償上億元過度侵害人民財產權
  - label: B
    content: 「比例原則」之適當性——賠償五百至一千五百倍之金額無法有效遏止仿冒品的販售
  - label: C
    content: 「法律保留原則」——對人民財產權的限制，須有憲法的明確授權
  - label: D
    content: 「平等原則」——所有商品的販售接受《民法》契約自由的保障，不應有差別待遇
