  stem: 國內房地產的違建現象十分普遍，但拆除率相對偏低。下表為營建署2019年7月以前違建統計資料，各縣市政府對於違建物的處理方式不盡相同，但對於有危害公共安全之虞，且依法無法補照或有構成違法之虞的施工中新建物，通常採取即時與強制性的拆除措施。請問：下列敘述何者正確？
