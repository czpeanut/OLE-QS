  - label: A
    content: 若人民對違建拆除不服，應直接向行政院提起訴訟請求停止執行
  - label: B
    content: 六都違建之通報件數與結案比率均較高，非都會地區執行相對不易
  - label: C
    content: 縣市政府對違建物的處理方式是一種行政指導，不具強制執行效果
