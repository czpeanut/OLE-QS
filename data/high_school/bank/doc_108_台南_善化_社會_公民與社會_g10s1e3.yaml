- id: doc_108_台南_善化_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一般來說，現代大部份的國家要休妻都需經過一套法律程序，不是單方想離異就能離異。但在印度，其境內的穆斯林還留有一個習俗，男方只要念或寫「塔拉格（talag）」三次就能把妻子休掉，這叫做「快速休妻法」。書寫時須用阿拉伯文，而使用的媒介不拘任何形式，寫信、打電話或甚至在臉書等社群媒體上貼文都能生效。此法雖已被二十多個穆斯林國家禁止，但因為印度法律有保護穆斯林、基督教徒的規定，所以對這項古老的習俗仍默許；很不公平的是，穆斯林女性卻沒有「快速休夫法」，也不能要求男方給予贍養費。根據上面之內容敘述，下列何者正確？
  options:
  - label: A
    content: 此現象代表印度尚未進入法治社會
  - label: B
    content: 很明顯該法是違反性別平等的
  - label: C
    content: 此現象顯示道德拘束印度社會的離婚制度
  - label: D
    content: 若有一方不想繼續維持婚姻關係，此法的確是解決婚姻關係之最佳方法
  tags:
    unit:
      code: CI-1-7-2
      book: 公民與社會1 民主與人權
      chapter: 文化與社會規範
      title: 性別規範
      std: true
    textbook: 公民與社會1 民主與人權 性別規範
    labeled_by: agent
    label_confidence: medium
