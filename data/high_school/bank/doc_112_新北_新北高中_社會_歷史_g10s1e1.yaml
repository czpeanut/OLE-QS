  stem: 明代士人陳第曾隨沈有容來臺平亂，之後著有〈東番記〉記載來臺所見之原住民族婚姻風俗情形：「迨產子女，婦始往婿家迎婿，如親迎，婿始見女父母，遂家其家，養女父母終身。」下列關於上述資料相關的分析何者正確？
  options:
  - label: A
    content: 根據資料內容，可判斷應為實施貴族制度的排灣族
  - label: B
    content: 由內容可知，婦女生子後，其夫婿才會迎接她回家
  - label: C
    content: 根據資料內容來判斷，此原住民族群應為父系社會
  - label: D
    content: 由內容所述可知女性地位較高，應為母系社會現象
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 〈東番記〉所記載的原住民族為臺灣南部的平埔族，從「婦往婿家迎婿」一句，即可知該族為母系社會，(D)為正解。(A)(C)此原住民族為母系社會的西拉雅族。(B)婦女迎接夫婿回女方家。
