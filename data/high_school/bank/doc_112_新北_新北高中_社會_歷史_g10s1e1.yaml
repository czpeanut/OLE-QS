- id: doc_112_新北_新北高中_社會_歷史_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 在阿美族的社會中，以「家」為構成部落與親屬組織的基本單位，為女性的主要活動場所，而且女性擁有繼承權；「會所」則是行政、教育中心，是男性的主要活動場所，而且負責處理部落對內對外的事務。上文展現出阿美族怎樣的社會特色？
  options:
  - label: A
    content: 男性負責公共事務，但以地位而言女性占優勢
  - label: B
    content: 阿美族為母系社會，女性擁有絕對的地位與權力
  - label: C
    content: 男性在家為一家之主，對外也須負責公共事務
  - label: D
    content: 阿美族為父系社會，但女性擁有財產的繼承權利
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
