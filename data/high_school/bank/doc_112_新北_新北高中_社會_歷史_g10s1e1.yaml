  stem: 以下是一則描述臺灣的史料：「他們不記年月、沒有官吏階級，赤身裸體以繩結記事的民族，不是很奇怪嗎？而且他們雖然住在海邊卻不捕魚，男女雜居卻不淫亂，男女地位相反，住家與墳墓在一起。」觀察以上敘述，何者解釋較為適當？
