  stem: 日本人伊能嘉矩（1867 ～ 1925）在 1895 年來到臺灣，開啟其對原住民族的現代研究。其依照各族文化、語言、風俗習慣差異，將原住民族分成 8 類（泰雅、阿美、布農、曹、賽夏、排灣、卑南、平埔），打破以往籠統的生番、熟番劃分法，其中平埔族再分為 10 族（馬卡道、西拉雅、魯羅阿、貓霧捒、阿里坤、巴布蘭、巴則海、道卡斯、凱達格蘭、噶瑪蘭），堪稱是臺灣原住民分類的第一人。請問根據此文，下列何者敘述最為合理？
  options:
  - label: A
    content: 伊能嘉矩僅根據自己喜好對原住民族分類
  - label: B
    content: 伊能嘉矩的分類一直沿用至今無任何修正
  - label: C
    content: 此分類並未臻於完整，但已具備現代專業
  - label: D
    content: 此分類具有對原住民族濃厚的歧視意味
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)為正解。(A)依照各族文化、語言、風俗習慣差異來分類，並非根據自身喜好。(B)迄今已經過多次修正。(D)此為科學分類，並無歧視之意。
