    content: 平埔族對漢人的祖先崇拜、姓氏排斥
  - label: D
    content: 平埔族自覺文化優越感，高於漢文化
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一顯示竹塹社平埔族接受漢文化的情形，但仍保留「番」字以示「食邑不忘其祖」；資料二的平埔族，在外使用仿漢制的公姓名，但在家中仍使用原私姓名。綜合兩者可知，平埔族雖然已陸續接受漢文化，但並未因此丟棄其原有的文化，故(B)說法較為適宜。
