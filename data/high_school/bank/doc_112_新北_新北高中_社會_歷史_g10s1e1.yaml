  stem: '請閱讀以下兩則資料：

    資料一：「采田福地」是原住民竹塹社（道卡斯族）7 個姓氏的公廳。源自清乾隆 25 年由皇帝御賜「義勇可嘉」匾額，並建祠堂而命名。根據光緒 4 年重建采田福地新社公館所記載，有「義配食祖，番從采田」之句，「采田」兩字合起來就是「番」字，「福地」則為土地公，表示「食邑不忘其祖」。當地居民以客家語暱稱「番仔伯公」。

    資料二：《臺灣通志》：「清乾隆 23 年，以後土著諸族，尊制薙髮打辮，即陸續改用漢姓。」當時賜與「平埔族」同胞的姓有衛、金、向、錢、廖、三、王、潘、黎等姓，其中以潘姓最多，番名係經翻譯的同音漢字，有分公姓名與私姓名兩種，公姓名是仿照漢制的姓名，在官府中使用，私姓名則在家中使用。

