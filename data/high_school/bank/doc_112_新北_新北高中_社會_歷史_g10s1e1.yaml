  stem: 以下為臺灣某一時期，某人對臺灣原住民族分類的意見：「臺灣過去雖分為支那人（指的是中國人）及熟番、生番 3 者，但是除了支那人之外，皆視為異種人類，此是從華夷之名，支那（指的是中國）古來習慣的稱呼而已。故所謂生番、熟番不可直接作為學術上的名詞，必須依據今後的科學研究成果，始能決定種族為何。」請問上述提及的「某人」應該身處於何時？
