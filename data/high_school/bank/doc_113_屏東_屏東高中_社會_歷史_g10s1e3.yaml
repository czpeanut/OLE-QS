questions:
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺灣在荷蘭、鄭氏政權、清治時期，這三個不同政權統治期間，其貿易方式及貿易商品並非完全相同，請問這三個時期，臺灣向島外輸出的主要商品，共同者為何？
  options:
  - label: A
    content: 蔗糖
  - label: B
    content: 稻米
  - label: C
    content: 絲綢
  - label: D
    content: 鹿皮
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 自從荷蘭人將蔗糖製造技術引入臺灣後，(A)蔗糖一直是臺灣重要的輸出商品。(B)稻米在荷蘭、鄭氏時期並非外銷的主要商品。(C)非臺灣製造的商品。(D)鹿皮主要銷往日本，從荷治時期延續至清治初期，其貿易量與銷售時間都不如蔗糖。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 戰後政府選定紡織業及麵粉、食油與飼料工業為所謂「進口替代工業」的策略性產業。這些棉花、棉紗、小麥與黃豆等原物料的來源是？
  options:
  - label: A
    content: 臺灣農村的生產
  - label: B
    content: 以日本進口為主
  - label: C
    content: 大部分是美援的物資
  - label: D
    content: 國共內戰時的軍備儲糧
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣並非棉花、小麥與黃豆的產地，因此這些原物料的主要來源(C)大部分是美援的物資。(A)臺灣農村並非產地。(B)此時的臺灣主要以農產加工品出口到日本。(D) 1950 年代，國共內戰早已結束。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 政府實施土地改革後，為何會促使地主轉營工商業？
  options:
  - label: A
    content: 政府立法獎勵私人投資，並予以優待
  - label: B
    content: 政府徵收地主的土地，使地主無法在土地上獲利，轉而經營工商業
  - label: C
    content: 二二八事件的影響
  - label: D
    content: 地主所得的土地補償都是實物債券，只好轉向工商業發展
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「耕者有其田」之後，政府以實物債券及公營事業股票補償地主，使地主無法在土地上獲利，部分地主因此轉而投資工商業，故答案為(B)。
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某個時期的臺灣大學生，流行泡咖啡館，讀英美文學，聽西洋音樂，看好萊塢電影。第一部 007 電影在臺北首映時，甚至有人從高雄坐十二個小時的平快車前來觀賞。這個對西方文化著迷的時代是
  options:
  - label: A
    content: 1940 年代
  - label: B
    content: 1950 年代
  - label: C
    content: 1960 年代
  - label: D
    content: 1970 年代
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '題文顯示此時的臺灣盛行西洋文化，從當時大學生的流行時尚來看，可見經濟生活條件尚稱繁榮，加上第一部 007 電影於 1962 年上映，因此推知此時為臺灣經濟開始起飛的(C) 1960 年代。(D) 1970 年代受到外交重挫，此時對西方文化的推崇已大不如前。

    5.1990 年(D)三月學運後，李登輝當選總統隨即召開國是會議，於 1991 年宣布終止動員戡亂時期，並廢除《臨時條款》，回歸正常憲政體制。

    6.糖、茶及鳳梨、香蕉罐頭都是農產加工品，顯見此時總督府的經濟政策為「農業臺灣，工業日本」，因此答案為(C)。

    7.(A)鹿港位於海線，以泉州人為多。(B)鹿港為乾隆時期開放的兩岸對渡港口，並非清末開港通商的港口。(C)中國貨物進口最早的唯一港口是鹿耳門，並非鹿港。

    8.從此份報告可知此人將蓋基督教教堂視為威嚇原住民部落的必要建設，加上「新港人」與「大量的鹿皮」等線索，可推知與 17 世紀的荷蘭人有關，因此答案為(B) 17 世紀的荷蘭駐大員長官。

    9.為解決糧食不足問題，鄭成功來臺後即實施軍事屯墾政策，由防守各地的兵員加入土地開墾之列，稱為「營盤田」，(B)為正解。

    10.1978 年底，(C)美國宣布隔年起與臺灣斷交，於是政府宣布停止當年的中央民代增補選舉活動，使得黨外人士改以辦雜誌、演講等方式表達訴求。

    11.日治時期，總督府雖曾於 1935 年舉辦過街庄協議會員及州、市會議員半數民選，但投票門檻甚高，全臺僅有 28,000 多人具備選民資格。國民政府遷臺後，於 1950 年展開地方自治，雖僅限省籍以下民意代表及縣市級以下首長民選，但對受日本殖民五十年的臺灣人民而言，自然是值得興奮激動的大事，因此答案為(B)。

    12.在「指定原料採收區域」政策下，糖廠能掌握甘蔗供應並壓低收購價格，因此以甘蔗折價繳納灌溉溝渠的使用費，能使糖廠取得更多的原料，獲利也更高，(B)為正解。

    13.「自由化、國際化」為(B) 1980 年代後的經貿政策。

    14.從「大規模的土地調查」、「以公債做為大租權的補償金」等作為，即可推知為(C)日治時期的土地改革措施。

    15.這位傳教士的禮拜堂分別在新店、南港與淡水，可推知為在北臺灣傳教的(B)馬偕。(A)(C)(D)三者的傳教地點以臺南為主。

    16.戰後初期，國民政府積極去日本化，推動國語政策及中華文化，導致臺灣本土文人創作受限，因此答案為(D)。

    17.葉石濤先生自謙自己是殘活下來的「二流以下的人才」，可見「一流的菁英」皆已罹禍死難，從其生存年代來推算，最可能的原因為白色恐怖時期的政治受難者，因此答案為(C)。(A)作家雖有自謙，但也感嘆許多一流菁英的離世。(B)日本人徵召臺灣軍伕不會僅限於一流菁英人才。(D)從「殘活下來」的說法，可知並非只是感慨人才不如前朝。

    18.從「瘟疫流行，死亡相繼」，可推知這座廟宇供奉的主神為送瘟避疫的(A)王爺。(B)與航海安全相關。(C)地方守護神。(D)民變時協助官方平亂陣亡者。

    19.(A)應是鹿耳門。(B)乾隆年間增開的對渡口岸為鹿港與八里坌，並非大稻埕。(C)清末開放通商的港口為淡水與安平，沒有大稻埕。

    20.從中國將新文學引進臺灣，並引發新舊文學論戰者為(B)張我軍。(A)被稱為「臺灣新文學之父」。(C)主要貢獻在政治社會運動。(D)主要以日文創作。

    21.白先勇所述及的作家面臨政府檢查的壓力，作品甚至必須處處避免正面評議當前社會政治的問題，因此寫作內容轉向個人內心的探索，可推知為 1950 ～ 1960 年代白色恐怖背景下的(D)現代主義文學。

    22.在 1970 年代外交困頓之際，知識青年開始揚棄西洋流行音樂，疾呼「唱自己的歌」，發起校園民歌運動，(C)為正解。

    23.1930 年代起，因應日本對外擴張而逐步進入軍需工業時代，因此積極拓展交通、電力等工業設施，尤其在 1934 年日月潭水力發電廠完工後，更使臺灣電力發展進入新的里程碑，故答案為(C)。(A)鐵路電氣化於 1970 年代才展開。(B)電燈的耗電量小，電力需求不大。(D)推動電力工程與軍需工業有關，並非為增加就業機會。

    24.余光中從民族主義的角度，質疑鄉土文學是狹隘的地方主義文學，甚至是中共的工農兵文學，因此答案為(A)。(B)(D)為鄉土文學派的主張。(C)余光中所質疑的鄉土文學，不符合大中國視角的民族主義情感。

    25.早期移民以原鄉守護神的信仰為主，隨著定居社會形成，祭祀圈也因族群融合而不斷擴大，出現跨越祖籍信仰的現象，(D)為正解。

    26.土地公原先是守護土地的神祇，卻成為保佑學子課業的神明，顯見臺灣民間信仰的功利特徵，神明的角色與功能也會隨著信眾的需要而有所改變或調整，(D)為正解。

    27.由於前一年糖價稍長，農民唯利是驅，種蔗者快速倍增，因此較符合的敘述應為(C)農業高度商品化。(A)從題文敘述無法判斷。(B)史料提及此地較內地溫暖，並非氣候暖化。(D)題文敘述未提及勞動力問題。

    28.(A)國共內戰為 1940 年代後期，非 1960 年代。(B)《動員戡亂時期臨時條款》修訂的內容，與世界民主潮流不符。(C)修訂內容使總統擴權，鞏固中央集權統治，與反共復國目標無關。

    29.從賴和是一位「社會主義者」來看，可推測其作品(B)關心底層群眾，著重社會寫實。(A)(D)與社會主義的主張不符。(C)作品使用臺灣話文、中國白話文皆有，非僅使用臺灣話文。

    30.(A)「米糖相剋」發生於日治時期的 1920 年代中後期，(B)(D)與史實不符，因此正確答案為(C)。

    31.題文所述為皇民化運動時期，倡導神道信仰，實施正廳改善運動與寺廟整理運動，故(D)為正解。

    32.施九緞事件為臺灣建省以來規模最大的民變，最後劉銘傳調派(A)霧峰林家的林朝棟率軍鎮壓才平息亂事。

    33.臺北清真寺於 1960 年落成，在此之前臺灣穆斯林人數增加的原因，是因大批穆斯林隨國民政府遷臺，之後來臺的泰緬軍民中亦有雲南裔穆斯林，奉白崇禧將軍為精神領袖，故(B)為正解。(A)(C)與史實不符。(D) 1980 年代後。

    34.從鼓勵戰鬥精神、擊滅英美文化來看，此時臺灣政權應與英美國家為敵，最可能為二次世界大戰期間，臺灣歸屬於軸心國家陣營的日本，因此答案為(B)。(A)戰間期，尚未仇視英美。(C)(D)為國民政府統治時期，不可能抨擊英美文化。

    35.(A)日治時代的歌仔戲並未出現本質的變化。(B)歌仔戲的原始面貌並非低級、淫蕩，與報導不符。(C) 1927 年尚未嚴厲禁止歌仔戲。

    36.從題文敘述可知，「不宜另結新黨」的「非常時期」已經過了十幾年，意即 1949 年《戒嚴令》開啟「黨禁」後又過了十多年，可推知這刊物為雷震的《自由中國》，之後發生 1960 年(A)雷震案。(B) 1979 年。(C) 1986 年。(D) 1987 年。

    37.(A)女性前往都市就業是因為謀生機會多，與婦女運動無關。(C)應是「進口替代」轉為「出口擴張」。(D)歌詞描述底層女工的辛酸，與中小企業發展無關。

    38.文中報告稱臺灣的漢人為「中國人」，加上「禮拜天」、「人頭稅據」與各種壓迫，可推知為荷蘭時期對漢人的欺壓，因此促成 1652 年(B)郭懷一率領漢人起事抗荷。(A)原住民抗荷與題文敘述無關。(C)清領後期傳教士來臺。(D)日治時期的漢人抗日起事。

    39.(A)戒嚴時期的臺灣不可能「太自由」。(B)反對任何意識型態的控制。(C)此時為國民政府的黨國威權統治，非日治時期。

    40.從總督府的經常收入來看，鴉片稅、鹽、菸、樟腦的收入即接近八成，可見臺灣財政能夠完全獨立，與(B)專賣事業關係最密切。

    41.表中水田比例於 1933 年後明顯增加，應與水利設施相關，嘉南大圳於 1930 年完工，因此答案為(A)嘉南平原。(B)(C)(D)三地於 1930 年代並無重大水利工程興建，水田不至於快速增加。

    42.1970 年代初，因國際外交失利及國內經濟與社會的發展，知識分子要求民主改革，行政院長蔣經國乃實施「政治本土化」，起用臺籍菁英參政，本省人的比例因此增加，(C)為正解。(A)國民政府遷臺之後，即重用外省人，與二二八事件造成的臺灣人才斷層無太大關聯。(B)戒嚴體制時，本省人的政治參與明顯受到打壓。(D)在民主時代，外省人的參政機會並未被剝奪。

    43.此版畫完成後不到一年即發生的事件為 1947 年的二二八事件，因此推知該作品的年代為(A) 1940 年代。

    44.(A) 1662 ～ 1683 年間僅完成 4 ％，談不上是「廣泛興建」。(B)統計圖中並沒有荷治時期的相關資料。(C) 1683 ～ 1722 年為清領時期，興建水利設施高達 96 ％，是為正解。(D)從圖中資料無法判讀中部地區的水利設施發展。

    45.《臺灣府城教會報》為(D)巴克禮在臺南所創辦。

    46.(B)施明德、(C)呂秀蓮、(D)黃信介為美麗島事件中被審判的「六大寇」成員，陳水扁、謝長廷則為當時的辯護律師。

    47.(B)鹿港於乾隆年間才開放。(C)乾隆晚期的林爽文之役後，臺灣才解禁允許建造城牆。(E)玉米、茶葉並非臺灣生產的物資。

    48.(B)政府給予稅收優惠吸引外資設廠，並非免關稅。(C)以「田賦徵實」及「肥料換穀」等方式，將農業所得轉移至政府和工業部門，並非公債。

    49.(B)《臺灣府城教會報》為巴克禮所創辦，(D)淡水理學堂為馬偕所創建，兩人都屬基督教長老教會，非天主教。

    50.題幹顯示這位文人贊成文藝須擔負起戰鬥任務，並否定「敵對勢力」的血腥統治與無自由，可推知為戰後初期支持反共的人士，因此正確答案為(B)(D)。(A)戰後初期，非日治時期。(C)響應政府的反共復國政策，支持戰鬥文學、反共文學，並非現代主義文學。(E)此時臺灣正值黨國威權體制時期。'
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1947 年，共產黨軍隊的勢力逐漸擴大，蔣中正下達「動員戡亂」的動員令。次年，第一屆國民大會制定《動員勘亂時期臨時條款》，使總統獲得緊急處分權。直到哪一事件發生後，動員戡亂時期才走向終點？
  options:
  - label: A
    content: 韓戰爆發
  - label: B
    content: 越戰爆發
  - label: C
    content: 美麗島事件
  - label: D
    content: 三月學運
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 日本殖民統治時期，臺灣經濟改革的特色之一是製糖、製茶及鳳梨、香蕉罐頭工廠發展頗盛。此現象顯示的意義為何？
  options:
  - label: A
    content: 統治初期為謀求臺地的財政獨立
  - label: B
    content: 使臺灣成為日本南進軍需工業地
  - label: C
    content: 使農產品加工業成為臺灣工業主體
  - label: D
    content: 工業臺灣、農業日本的垂直分工
  answer:
