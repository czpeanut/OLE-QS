  stem: '以0.01 M鹽酸滴定未知氫氧化鈉溶液50 mL，下表為實驗過程中的pH值變化學習單，請回答下列各小題，<u>(1)～(3)需寫出其計算過程才給分</u>： （log2＝0.30、log3＝0.48） (1)加入HCl的V＝0.0 mL時，溶液之pH為＿＿＿＿。 (2)加入HCl的V＝＿＿＿＿mL時，溶液之pH＝11.4。 (3)加入HCl的V＝25.1 mL時，溶液之pH為＿＿＿＿。 (4)上述實驗中，可能使用的器材如下圖所示，下列選項操作會造成實驗誤差的有①～⑤哪些？＿＿＿＿

    ①蒸餾水清洗過的儀器「庚」，利用漏斗直接將鹽酸裝入滴定管以進行滴定

    ②蒸餾水清洗過後的「戊」，用未知氫氧化鈉溶液潤洗過後，再加入氫氧化鈉50mL進行滴定

    ③用洗淨乾燥後的「丁」準確量取50 mL未知氫氧化鈉溶液，放入「甲」中進行滴定

    ④用洗淨乾燥後的「己」吸取50 mL未知氫氧化鈉溶液，放入洗淨乾燥後的「乙」瓶中，並加入適量蒸餾水稀釋後再滴定

    ⑤利用洗淨乾燥後的「丙」配製0.1 M鹽酸，再裝入以鹽酸潤洗過的儀器「庚」中，並於滴定前加入2～3 mL酚酞於容器「乙」中作為指示劑。'
