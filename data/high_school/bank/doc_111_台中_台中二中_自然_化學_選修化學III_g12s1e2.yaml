  answer_source: answer_key
  explanation: 常見的鹼性酸式鹽陰離子包含：$HS^{－}$、$HCO_{3}^{－}$、$HPO_{4}^{2－}$…等。(B)(D)為正鹽；(E)為複鹽。故選(A)(C)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s2_10
  section: 2
  number: 10
  type: multiple
  page: 1
  stem: 下列有關25℃時，溶液pH值的相關敘述，何者正確？
  options:
  - label: A
    content: 任何水溶液：[$H^{＋}$]＋[$OH^{－}$]＝1×$10^{－14}$
  - label: B
    content: 某水溶液pH＝0，則[$OH^{－}$]＝14 M
  - label: C
    content: pH＝3的鹽酸其[$H^{＋}$]等於pH＝3的醋酸溶液
  - label: D
    content: pH＝1與pH＝2的硝酸水溶液中，[$H^{＋}$]濃度比為1：10
  - label: E
    content: pH＝1的鹽酸與pH＝1的醋酸水溶液，分別以水稀釋10倍，則兩者的pH值均增加1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為[$H^{＋}$]×[$OH^{－}$]＝1×$10^{－14}$；(B)應為$10^{－14}$ M；(C)正確；(D)應為10：1；(E)鹽酸完全解離，故稀釋10倍時，濃度變為十分之一，pH增加1，但醋酸為弱酸，稀釋後會增加解離度，pH不會增加到1那麼多。故選(C)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s2_11
  section: 2
  number: 11
  type: multiple
  page: 1
  stem: 下列有關緩衝液的敘述，何者正確？
  options:
  - label: A
    content: 緩衝液常為弱酸和其鹽或弱鹼和其鹽的混合液
  - label: B
    content: 0.01 M HCl(aq) 50 mL＋0.02 M $NH_{3}$(aq) 50 mL混合液可做為緩衝液
  - label: C
    content: 緩衝液之pH值不論加入多少量的強酸或強鹼，均不會發生大幅度的變化
  - label: D
    content: 在含醋酸及醋酸鈉均為0.2 M之緩衝液100毫升中，加水至溶液體積為200毫升後，溶液[$H^{＋}$]減半
  - label: E
    content: 以磷酸及氫氧化鈉配製pH＝7.0之緩衝溶液，則緩衝液之主要組成粒子為$HPO_{4}^{2－}$及$PO_{4}^{3－}$ （已知：磷酸的三個$K_{a}$分別為7.1×$10^{－3}$，6.3×$10^{－8}$及4.4×$10^{－13}$）
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (C)若加入過量的酸鹼物質，會將緩衝液完全中和而使之失效；(D)緩衝液的pH值不因加水而改變；(E)當pH與$pK_{a}$接近時，緩衝效果最好，於pH＝7.0的緩衝溶液中，$pK_{a}$接近7.0的緩衝系統效果最佳，而磷酸的$K_{a_{2}}$＝6.3×$10^{－8}$，$pK_{a}$最接近7.0，故$H_{2}PO_{4}^{－}$、$HPO_{4}^{2－}$為其主要的成分。故選(A)(B)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s2_12
  section: 2
  number: 12
  type: multiple
  page: 2
  stem: 以體積莫耳濃度相同之NaOH溶液分別滴定兩杯體積莫耳濃度亦相同之HCl(aq)與$CH_{3}$COOH(aq)水溶液，若當量點時分別用去NaOH：x mL及y mL，下列敘述何者正確？
  options:
  - label: A
    content: 未滴定前溶液pH值：HCl＜$CH_{3}$COOH
  - label: B
    content: 當量點時x＞y
  - label: C
    content: 中和點時x＜y
  - label: D
    content: 達當量點時，兩溶液均[$H^{＋}$]＝[$OH^{－}$]
  - label: E
    content: 滴定時皆可使用甲基紅作為指示劑，以判斷滴定終點是否到達
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因體積莫耳濃度相同，鹽酸為強酸、醋酸為弱酸，故pH值鹽酸＜醋酸；(B)無法判斷，因不知道鹽酸、醋酸體積誰大誰小；(C)達中和點時，pH＝7.0；(D)達當量點時，可分別形成NaCl、$CH_{3}$COONa的鹽類，但後者可水解呈鹼性，故錯誤；(E)甲基紅的變色範圍位於4.4～6.2之間，此滴定地當量點為中性與鹼性，故不適用。故選(A)。
