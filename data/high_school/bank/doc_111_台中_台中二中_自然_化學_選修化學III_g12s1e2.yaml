  explanation: '(1) 當量點時，加入25 mL鹽酸，由酸所提供的$H^{＋}$莫耳數＝鹼所提供的$OH^{－}$莫耳數，故可列式：0.01×0.025×1＝C×0.05×1，得[$OH^{－}$]＝C＝0.005 M，pOH＝3－log5＝2.3，pH＝11.7。

    (2) pH＝11.4代表NaOH過量，故僅需計算過量的$OH^{－}$濃度即可。pH＝11.4＝12－0.6＝12－log4，[$H^{＋}$]＝4×$10^{－12}$，[$OH^{－}$]＝2.5×$10^{－3}$。 $OH^{－}$莫耳數＝NaOH莫耳數－加入的HCl莫耳數＝(0.005×0.05－0.01×V) mol，溶液體積＝(0.05＋V) L。故[$OH^{－}$]＝$\frac{0.005\times 0.05-0.01\times V}{0.05+V}$＝2.5×$10^{－3}$，解得V＝0.01 L＝10 mL。

    (3) 因加入25 mL時達當量點，此時的水溶液為中性。故加入25.1 mL時，可視為在(25＋50) mL的溶液中額外加入0.1 mL、0.01 M的鹽酸。則鹽酸的濃度可視為從0.1 mL被稀釋至75.1 mL，其濃度＝0.01×$\frac{0.1}{75}$＝$\frac{4}{3}$×$10^{－5}$ M，pH＝5－log4＋log3＝4.88。

    (4) ①滴定管需以滴定液潤洗；②被滴定液應製於錐形瓶(乙)中，且不可潤洗；③以吸量管(己)準確量取未知氫氧化鈉溶液放入錐形瓶(乙)；⑤加入酚酞2～3滴即可，加太多會影響結果。'
