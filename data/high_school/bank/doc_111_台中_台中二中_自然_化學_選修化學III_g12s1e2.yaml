questions:
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知下列兩反應均傾向右方進行： $NH_{2}^{－}$＋$H_{2}$O $\rightleftharpoons$ $NH_{3}$＋$OH^{－}$ $OH^{－}$＋HCN $\rightleftharpoons$ $H_{2}$O＋$CN^{－}$ 試問：下列何者的鹼性最強？
  options:
  - label: A
    content: $CN^{－}$
  - label: B
    content: $NH_{2}^{－}$
  - label: C
    content: $OH^{－}$
  - label: D
    content: $H_{2}$O
  - label: E
    content: $NH_{3}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 酸鹼反應進行方向：強→弱，故可得知鹼性：$NH_{2}^{－}$＞$OH^{－}$＞$CN^{－}$。故選(B)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列為濃度均為0.1 M之a～e五種水溶液 (a) HCl、(b) NaOH、(c) $CH_{3}COONH_{4}$、(d) $CH_{3}$COONa、(e) $NH_{4}$Cl 試問pH值從小排到大之順序（左小右大）為何？
  options:
  - label: A
    content: a＜e＜c＜d＜b
  - label: B
    content: b＜e＜a＜d＜c
  - label: C
    content: a＜e＜b＜d＜c
  - label: D
    content: a＜c＜d＜b＜e
  - label: E
    content: b＜d＜c＜e＜a
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (a)強酸、(b)強鹼、(c)弱酸（$CH_{3}$COOH）與弱鹼（$NH_{3}$）中和的鹽類，恰為中性；(d)弱酸與強鹼中和的鹽類，為弱鹼性；(e)強酸與弱鹼中和的鹽類，為弱酸性。(a)＞(e)＞(c)＞(d)＞(b)，故選(A)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 體積莫耳濃度相同的三種鹽NaX、NaY和NaZ的水溶液中，已知pH值依次為8、9、10，試問： HX、HY、HZ的酸度由強到弱，依序為下列何者？
  options:
  - label: A
    content: HX、HZ、HY
  - label: B
    content: HX、HY、HZ
  - label: C
    content: HY、HZ、HX
  - label: D
    content: HZ、HX、HY
  - label: E
    content: HZ、HY、HX
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 共軛鹼的鹼性越強，則共軛酸的酸性越弱。因共軛鹼的鹼性：$Z^{－}$＞$Y^{－}$＞$X^{－}$，故酸性：HX＞HY＞HZ。故選(B)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在25℃，0.1 M氯化銨水溶液中，下列各粒子濃度比較之關係式，何者正確？（已知$NH_{3}$的$K_{b}$≒$10^{－5}$）
  options:
  - label: A
    content: '[$Cl^{－}$] ＝ [$NH_{4}^{＋}$] ＞ [$H^{＋}$] ＞ [$OH^{－}$]'
  - label: B
    content: '[$Cl^{－}$] ＝ [$NH_{4}^{＋}$] ＞ [$H^{＋}$] ＝ [$OH^{－}$]'
  - label: C
    content: '[$Cl^{－}$] ＞ [$NH_{4}^{＋}$] ＞ [$H^{＋}$] ＞ [$OH^{－}$]'
  - label: D
    content: '[$NH_{4}^{＋}$] ＞ [$Cl^{－}$] ＞ [$H^{＋}$] ＞ [$OH^{－}$]'
  - label: E
    content: '[$OH^{－}$] ＞ [$Cl^{－}$] ＞ [$NH_{4}^{＋}$] ＞ [$H^{＋}$]'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 溶於水後解離為$NH_{4}^{＋}$(aq)＋$Cl^{－}$(aq)。又$NH_{4}^{＋}$於水中會水解產生少量的$NH_{3}$(aq)與$H^{＋}$(aq)，故[$Cl^{－}$]最大、[$NH_{4}^{＋}$]次之，另外因水也會解離出$H^{＋}$、$OH^{－}$，故[$H^{＋}$]＞[$OH^{－}$]。故選(C)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在1升濃度為a M之單質子弱酸HA水溶液中，已知[HA]、[$H^{＋}$]和[$A^{－}$]三者濃度總和為（n×a）M，則HA(aq)之解離度應為下列何者？
  options:
  - label: A
    content: n×100%
  - label: B
    content: (an－a)×100%
  - label: C
    content: $\frac{n}{2}$×100%
  - label: D
    content: $\frac{n}{3}$×100%
  - label: E
    content: (n－1)×100%
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 已知25℃時，某二質子酸$H_{2}$A之$K_{a1}$＝5.6×$10^{－2}$；$K_{a2}$＝5.4×$10^{－5}$，試問0.1M此酸鈉鹽NaHA(aq)之酸鹼性應為下列何者？
  options:
  - label: A
    content: 酸性
  - label: B
    content: 鹼性
  - label: C
    content: 中性
  - label: D
    content: 無法判斷
  - label: E
    content: 以上皆非
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 比較此酸式鹽之解離傾向（$K_{a2}$）以及水解傾向（$\frac{K_{w}}{K_{a_{1}}}$）之大小即可。 $K_{a_{2}}$＝5.4×$10^{－5}$、$\frac{K_{w}}{K_{a_{1}}}$＝$\frac{1\times 10^{-14}}{5.6\times 10^{-2}}$，$K_{a_{2}}$較大，為酸性。 故選(A)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 張同學以0.100 M的NaOH水溶液滴定未知濃度的50.0 mL鹽酸溶液甲，當滴入48.0 mL的NaOH溶液時，發覺忘了加入酚酞指示劑。待加入指示劑後，發現溶液已呈現桃紅色。於是進行反滴定，先加入1.80 mL的0.100 M鹽酸溶液後，再滴入0.20 mL的NaOH溶液，即達到滴定終點，則此鹽酸溶液甲的濃度（M）為何？
  options:
  - label: A
    content: '0.093'
  - label: B
    content: '0.103'
  - label: C
    content: '0.156'
  - label: D
    content: '0.186'
  - label: E
    content: '0.206'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 酸所提供的$H^{＋}$莫耳數＝鹼所提供的$OH^{－}$莫耳數，此處HCl、NaOH皆為一元酸鹼，故可得：C×50.0＋0.100×1.80＝0.100×50＋0.100×0.20，得C＝0.093 (M)。故選(A)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 取1.06 g $Na_{2}CO_{3}$固體加水溶解成100 mL水溶液，取其中40.0 mL加入甲基橙作為指示劑，再以未知濃度鹽酸滴定，已知用去25.0 mL鹽酸溶液恰可使溶液變色，試問為未知鹽酸濃度為若干M？（$Na_{2}CO_{3}$式量106）
  options:
  - label: A
    content: 1.60×$10^{－4}$
  - label: B
    content: 3.20×$10^{－4}$
  - label: C
    content: '0.16'
  - label: D
    content: '0.32'
  - label: E
    content: 0.64 M
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 1.06 g的碳酸鈉＝0.01 mol，自100 mL溶液中取40 mL，故所取得的碳酸鈉＝0.01×0.4 mol。此處HCl為一元酸、$Na_{2}CO_{3}$則為二元鹼，酸所提供的$H^{＋}$莫耳數＝鹼所提供的$OH^{－}$莫耳數，故可得：C×0.0250＝0.01×0.4×2，得C＝0.32 (M)。故選(D)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e2_s2_9
  section: 2
  number: 9
  type: multiple
  page: 1
  stem: 下列何者為酸式鹽且水溶液成鹼性？
  options:
  - label: A
    content: $Na_{2}HPO_{4}$
  - label: B
    content: $NaH_{2}PO_{2}$
  - label: C
    content: $NaHCO_{3}$
  - label: D
