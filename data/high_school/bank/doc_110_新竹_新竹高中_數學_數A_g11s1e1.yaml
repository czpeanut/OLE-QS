- id: doc_110_新竹_新竹高中_數學_數A_g11s1e1_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: 若$log_{ 3}$ ( x＋2 )＋$log_{ 3}$ ( x－3 )＝$log_{ 3}$ ( 2x＋4 )－1，則x之值為＿＿＿＿。
  explanation: 原式可化為$\frac{\log ( x + 2 )}{\log 3}$＋$\frac{\log ( x - 3 )}{\log 3}$＝$\frac{\log ( 2x + 4 )}{\log 3}$－$\frac{\log 3}{\log 3}$ ⇒ log ( x＋2 ) ( x－3 )＝log$\frac{2x + 4}{3}$ ⇒ 3 ( $x^{2}$－x－6 )＝2x＋4 ⇒ $3x^{2}$－5x－22＝0 ⇒ ( 3x－11 ) ( x＋2 )＝0 ⇒ x＝$\frac{11}{3}$或－2（不合） 故x＝$\frac{11}{3}$。
- id: doc_110_新竹_新竹高中_數學_數A_g11s1e1_s2_4
  section: 2
  number: 4
  type: fill
  page: 1
  stem: 若$log_{ 4}$ log$_{\frac{1}{3}}$( x－2 )＞$log_{ 2}\sqrt{3}$，則x之範圍為＿＿＿＿。
  explanation: 原式可化為$\frac{\log _{\frac{1}{3}} ( x - 2 )}{\log 4}$＞$\frac{\log \sqrt{3}}{\log 2}$＝$\frac{2 \log \sqrt{3}}{2 \log 2}$＝$\frac{\log 3}{\log 4}$，其中$\log _{\frac{1}{3}} ( x - 2 ) > 0$ ⇒ $3 < \log _{\frac{1}{3}} ( x - 2 )$⇒ $\frac{\log ( x - 2 )}{\log \frac{1}{3}}$＞$\frac{3 \log \frac{1}{3}}{\log \frac{1}{3}}$，其中x－2＞0 ⇒ 0＜x－2＜$\frac{1}{27}$⇒ 2＜x＜$\frac{55}{27}$。
