  page: 1
  stem: 已知a為方程式$log_{ 3}$ x＝－x＋8之解，β為方程式$3^{x}$＝－x＋8之解，則α＋β＝＿＿＿＿。
  explanation: 設y＝$log_{3}$ x與y＝－x＋8的交點為$A ( \alpha , -\alpha + 8 )$， y＝$3^{x}$與y＝－x＋8的交點為$B ( \beta , -\beta + 8 )$， 因為y＝$log_{3}$ x與y＝$3^{x}$的圖形對稱於y＝x，且y＝－x＋8與y＝x的交點為C ( 4 , 4 )， 所以$\overline{AB}$中點為C，即$\frac{\alpha + \beta}{2} = 4$⇒$\alpha + \beta = 8$ 故選(C)。
