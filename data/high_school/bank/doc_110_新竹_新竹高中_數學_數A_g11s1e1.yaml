- id: doc_110_新竹_新竹高中_數學_數A_g11s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 在y＝$a^{x}$及y＝$log_{ a}$ x有意義之條件下，下列敘述哪些正確？
  options:
  - label: A
    content: y＝$a^{x}$之圖形必與直線y＝k（其中k為任意實數）相交
  - label: B
    content: y＝$log_{ a}$ x的圖形必與直線y＝k（其中k為任意實數）相交
  - label: C
    content: y＝$log_{ a}$ x之凹口一定向下
  - label: D
    content: 若f (x)＝$a^{x}$，則對任意實數b，c，$\frac{f(c)+f(b)}{2}$ ≤ f ($\frac{c+b}{2}$) 恆成立
  - label: E
    content: 若g (x)＝$log_{ a}$ x，則對任意實數b，c，$\frac{g(c)+g(b)}{2}$ ≤ g ($\frac{c+b}{2}$) 恆成立
  explanation: (A) ×：y＝$a^{x}$與直線y＝k（其中k ≤ 0）不相交。 (B) ○：即y＝$log_{ a}$ x的值域為 { y | y∈R }。 (C) ×：當0＜a＜1時，y＝$log_{ a}$ x的凹口向上。 (D) ×：因為f (x)＝$a^{x}$圖形的凹口向上，所以$\frac{f (c) + f (b)}{2} \geq f ( \frac{c + b}{2} )$恆成立。 (E) ○：當0＜a＜1時，y＝$log_{ a}$ x的圖形為凹口向上，所以$\frac{g (c) + g (b)}{2} \geq g ( \frac{c + b}{2} )$成立。 故選(B)。
- id: doc_110_新竹_新竹高中_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列敘述哪些正確？
  options:
  - label: A
    content: 將y＝$2^{x}$的圖形往下移3單位再往右移2單位，則新圖形與y＝$2^{x＋2}$－3的圖形重合
  - label: B
    content: 將y＝$log_{ 2}$ x的圖形往左移動3單位，再往下移動2單位後之新圖形與y＝$log_{ 2}\frac{1}{4}$( x＋3 ) 的圖形重合
  - label: C
    content: 方程式 | $log_{ 2}$ x |＝x有3個相異實根
  - label: D
    content: 方程式$2^{| x |}$＝x＋1有2個相異實根
  - label: E
    content: 若a＞1，則函數y＝$log_{ a}$ x之圖形與直線y＝x必無交點
- id: doc_110_新竹_新竹高中_數學_數A_g11s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 若a＝$2^{32}$，b＝$3^{20}$，則下列哪些選項正確？
  options:
  - label: A
    content: a為10位數
  - label: B
    content: b為9位數
  - label: C
    content: a乘開後之最高數字為6
  - label: D
    content: b乘開後之最高數字為3
  - label: E
    content: a＋b為11位數
  explanation: (A) ○：log a＝32 log 2 ≈ 32×0.301＝9.632，所以a為10位數。 (B) ×：log b＝20 log 3 ≈ 20×0.4771＝9.542，所以b為10位數。 (C) ×：由(1)可知log a ≈ 9＋0.632，因為0.602＜0.632＜0.699， 所以log 4＜0.632＜log 5，即最高位數字為4。 (D) ○：由(2)可知log b ≈ 9＋0.542，因為0.4771＜0.542＜0.602， 所以log 3＜0.542＜log 4，即最高位數字為3。 (E) ×：因為a , b均為10位數，且其最高位數字分別為4 , 3，所以a＋b為10位數。 故選(A)(D)。
