  stem: 小明於民國110年10月1日在銀行存10萬，預計10年期滿（即民國120年10月1日）領回，期間利率皆不變，A方案採複利計算，利率1％，B方案採單利計算，利率1.2％，則10年期滿（即民國120年10月1日）後兩種方案本利和差距＿＿＿＿元。（民國120年10月1日當日不計息）（$1.01^{10}$＝1.10462）
  explanation: A方案本利和為$10^{5}$ ( 1＋0.01 )$^{10}$＝$1.01^{10}$×$10^{5}$； B方案本利和為$10^{5}$ ( 1＋10×0.012 )＝1.12×$10^{5}$； 故兩種方案本利和差距為1.12×$10^{5}$－1.10462×$10^{5}$＝0.01538×$10^{5}$＝1538（元）。
- id: doc_110_新竹_新竹高中_數學_數A_g11s1e1_s2_8
  section: 2
  number: 8
  type: fill
  page: 1
  stem: 根據統計，在A鎮發布訊息後，t小時之內聽到該訊息的人口是全體人口的100 ( 1－$3^{－kt}$ )％，其中k＞0。今有某訊息，假設在發布3小時內已經有60％的人口聽到該訊息，又假設最快要T小時後，有95％的人口聽到該訊息，則T值為＿＿＿＿。（小數點後無條件進位至整數）
  explanation: 可知$\begin{cases}100 ( 1 - 3^{- 3k} ) = 60 \\ 100 ( 1 - 3^{- Tk} ) = 90\end{cases}$⇒$\begin{cases}3^{- 3k} = 0.4 \\ 3^{- Tk} = 0.05\end{cases}$⇒$0.05 = 3^{- Tk} = ( 3^{- 3k} )^{\frac{T}{3}} = ( 0.4 )^{\frac{T}{3}}$ ⇒$\log 0.05 = \log ( 0.4 )^{\frac{T}{3}}$⇒$\frac{T}{3} ( 2 \log 2 - 1 ) = \log 5 - 2$⇒$T = \frac{3 ( \log 5 - 2 )}{2 \log 2 - 1} \approx \frac{3 ( 0.699 - 2 )}{2\times 0.301 - 1} \approx 10$。
- id: doc_110_新竹_新竹高中_數學_數A_g11s1e1_s2_9
  section: 2
  number: 9
  type: fill
  page: 1
  stem: 根據研究狗的年紀 ( x ) 歲換算成人類年紀 ( y ) 歲之公式為y＝16．$log_{ 2.71828}$ x＋31；現有甲、乙兩隻狗，甲之人類年紀為11歲，乙之人類年紀為3歲，則甲之狗的年紀是乙之狗年紀的＿＿＿＿倍。（答案以2.71828為底數之指數方式表示即可，不必求出，年紀可不為整數）
  explanation: 設甲之狗年紀為$x_{1}$，乙之狗年紀為$x_{2}$， 可知$\begin{cases}16 \log _{2.71828} x_{1} + 31 = 11\cdots \cdots ① \\ 16 \log _{2.71828} x_{2} + 31 = 3 \cdots \cdots ②\end{cases}$ ①－②：$16 ( \log _{2.71828} x_{1} - \log _{2.71828} x_{2} ) = 8$⇒$\frac{\log x_{1}}{\log _{2.71828}} - \frac{\log x_{2}}{\log _{2.71828}} = \frac{1}{2}$ ⇒$\log \frac{x_{1}}{x_{2}} = \frac{1}{2}\log 2.71828$⇒$\frac{x_{1}}{x_{2}} = 2.71828^{\frac{1}{2}}$ 故所求為$2.71828^{\frac{1}{2}}$倍
