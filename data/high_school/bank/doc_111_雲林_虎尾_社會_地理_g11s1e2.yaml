    年在科威特與美國的調停下，沙烏地阿拉伯、阿聯、巴林、埃及才又與卡達恢復外交關係。此外 2022 年的世界盃足球賽也於 11 月 20 日起在卡達舉辦，這是首次在伊斯蘭國家所舉辦的世足賽，也號稱是史上最貴、最保守、爭議最大的世足賽，賽前有關氣候、移工勞權等議題引發關注。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)卡達面臨斷交危機的原因與(乙)半島電視臺播送阿拉伯之春內容、(丙)穆斯林兄弟會與沙烏地阿拉伯相左，而卡達與其維持友好關係，以及(戊)卡達與伊朗及什葉派國家保持友好關係，使以同為遜尼派為主要信仰的沙烏地阿拉伯等國紛紛與其斷交。
