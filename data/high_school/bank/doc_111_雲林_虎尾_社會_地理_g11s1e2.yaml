- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 美國都市因郊區化的發展，逐漸擴張為都會區，甚至最後連結成都會帶，請問下列哪個選項「不是」造成美國郊區化的主要原因？
  options:
  - label: A
    content: 汽車普及
  - label: B
    content: 市區環境惡化
  - label: C
    content: 政策鼓勵
  - label: D
    content: 高速公路的建設
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 郊區化成因主要為市區因人口過多而生活品質下降，加上交通革新，促使人口向郊區移動。因此與(C)政策無關。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 歐洲三面環海，且海岸線曲折，海洋深入內陸，具有「海中有海，灣中有灣」的特色。下列哪二項地理現象與此項特色有密切關係？(甲)歐洲農牧業發達(乙)氣候溫和溼潤，無沙漠分布(丙)歐洲文化擁有既多元、又分裂的特性(丁)利於向海洋發展，航運便利
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 甲丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)～(丁)皆為歐洲的特色，因海洋深入內陸，使各地皆能向海上發展，且全區氣候皆可受海洋影響，無乾燥氣候，故選(C)(乙)(丁)較合適。(甲)農牧業發達與諸多自然（如氣候、土壤）和人文（如市場）因素皆有關，故無法以此理由判斷；(丙)應與其自古以莊園治理非統一的國家有關。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s2_11
  section: 2
  number: 11
  type: single
  page: 3
  stem: 右圖為 2020 年西亞各國人均 GDP 比較圖，其中巴林、卡達、沙烏地阿拉伯、阿拉伯聯合大公國各以不同代號表示，請判斷何者為卡達？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: 卡達近年來有許多議題都是世界注目的焦點，如 2017 年沙烏地阿拉伯等共 9 國宣布與卡達斷交，當時成為卡達的重大外交危機，直到 2021
    年在科威特與美國的調停下，沙烏地阿拉伯、阿聯、巴林、埃及才又與卡達恢復外交關係。此外 2022 年的世界盃足球賽也於 11 月 20 日起在卡達舉辦，這是首次在伊斯蘭國家所舉辦的世足賽，也號稱是史上最貴、最保守、爭議最大的世足賽，賽前有關氣候、移工勞權等議題引發關注。請問：
  assets:
  - key: s2_11_f1
    kind: figure
    file: doc_111_雲林_虎尾_社會_地理_g11s1e2/s2_11_f1.png
    crop:
      page: 3
      rect:
      - 331.15
      - 181.5
      - 564.3
      - 274.45
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 若論國家 GDP 而言，由高至低的排序，應為沙烏地阿拉伯、阿拉伯聯合大公國、卡達、巴林，且巴林整體發展低於前三國。題圖為人均 GDP
    的數值，需考量人口的數值，沙烏地阿拉伯與阿拉伯聯合大公國的人口較多，故人均 GDP 會較卡達低，因此甲～丁依序為巴林、沙烏地阿拉伯、阿拉伯聯合大公國、卡達。
