  stem: 下圖為某地區的衛星影像，表現出其農業活動型態，請問此區農地主要灌溉水源最可能為下列何者？
  options:
  - label: A
    content: 河水
  - label: B
    content: 雨水
  - label: C
    content: 地下水
  - label: D
    content: 海水淡化
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_111_雲林_虎尾_社會_地理_g11s1e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 265.85
      - 217.15
      - 418.2
      - 316.2
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題圖是西亞或乾燥區常見的中樞灌溉系統，此種灌溉技術，利用會旋轉的灑水頭供給環繞著中心點種植的作物，長條狀的噴灌機像是圓規，繞一圈畫成一個圓，就是噴灌機的灑水範圍，形成一個圓形農場，為抽取(C)深層地下水的灌溉方式。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 東歐為歐洲經濟發展較遲緩的地區，下列對於東歐地區的敘述哪些正確？(甲)形勢上較為封閉，距離大洋遙遠，海洋帶來的優勢較少(乙)地形破碎複雜，喀爾巴阡山東西橫亙(丙)境內全為基督教國家(丁)介於東、西方的陸橋位置，為連接南、北歐的走廊通道
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (丙)東歐因地形破碎與地理位置居要衝地位，造成東歐宗教複雜。北部波蘭、匈牙利、斯洛伐克以天主教為主；南部巴爾幹半島為東正教；阿爾巴尼亞為伊斯蘭教，並非全境皆為基督教。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下圖為某種民族的分布範圍，該民族生活空間分散，但一直企圖建立自己的國家。請問下列關於該民族的敘述，何者「不正確」？
  options:
  - label: A
    content: 宗教信仰以伊斯蘭教為主
  - label: B
    content: 游牧為傳統生產活動
  - label: C
    content: 活動範圍包括伊拉克、伊朗、土耳其等
  - label: D
    content: 因石油經濟的發展而擁有強大的政治力量，不久可望順利獨立建國
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_111_雲林_虎尾_社會_地理_g11s1e2/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 253.15
      - 474.75
      - 430.95
      - 633.95
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)題圖為庫德族主要分布區域，雖該地有蘊藏石油，但其主控權並非於庫德族手中，且因為活動範圍分布在周邊國家領土內，一旦獨立建國就會立刻引發整個區域的連鎖效應。所以土耳其、伊拉克、敘利亞、伊朗等國雖然政治立場殊異，但是在壓制庫德族獨立一事上具有共同利益，目前庫德人獨立建國的難度尚高。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 1906 年 4 月美國某大城發生芮氏規模 7.8 地震；1989 年 10 月，同地發生芮氏規模 6.9 地震；1994 年 1 月該城南方的另一大都市也發生芮氏規模
    6.6 地震。上述地震均發生在同一都會帶中，此都會帶最可能為下列何者？
  options:
  - label: A
    content: 波士頓─華盛頓都會帶
  - label: B
    content: 芝加哥─匹茲堡都會帶
  - label: C
    content: 舊金山─聖地牙哥都會帶
  - label: D
    content: 亞特蘭大─邁阿密都會帶
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 美國西部沿海屬於環太平洋火山地震帶，因此(C)西部沿海都市較可能為此題答案。(A)位於美國東北部沿海。(B)位於美國東北部五大湖南側。(C)位於美國西南部沿海。(D)位於美國西南部墨西哥灣沿岸。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 下圖是北美洲某一地理現象的移動示意圖，請問此為何種地理現象？
  options:
  - label: A
    content: 大陸冰河影響範圍
  - label: B
    content: 原住民的遷移
  - label: C
    content: 冷氣團發源地
  - label: D
    content: 溫帶氣旋的路徑
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_111_雲林_虎尾_社會_地理_g11s1e2/s1_5_f1.png
    crop:
      page: 2
      rect:
      - 228.2
      - 85.4
      - 455.85
      - 283.5
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由圖可知，該地理現象是由哈德孫灣及格陵蘭兩地發源，向四周擴散，最南端至現今五大湖地區附近，故判斷為(A)大陸冰河的影響範圍。(B)原住民的遷移應是由阿拉斯加向東南部延伸。(C)冷氣團會由北向南擴張，與圖中擴散範圍不同。(D)溫帶氣旋影響的空間尺度較小，無法一次影響整個北美洲。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 伊斯蘭國曾為西亞地區的重要組織，2014 至 2017 年擴大其占領範圍，但之後受到各國部隊的攻擊，最終在 2019 年宣布解散，但許多人相信其殘餘勢力仍舊留存，下列對於伊斯蘭國的敘述何者正確？
  options:
  - label: A
    content: 因消滅海珊政權而確立其政治地位
  - label: B
    content: 其主要分布地為敘利亞、約旦
  - label: C
    content: 掌控部分石油資源，故在短時間內快速擴張
  - label: D
    content: 伊斯蘭國最大的盟友為庫德族，共同對抗西方勢力
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)伊斯蘭國的勢力主要在伊拉克與敘利亞，美國對伊拉克發動戰爭，2011 年才結束，使伊斯蘭國元氣大傷；敘利亞自 2011 年初的阿拉伯之春開始動盪，同年
    3 月陷入全面內戰，故伊斯蘭國以這兩國為活動範圍，他們掠奪伊、敘兩國境內的煉油廠及油田，以賣石油取得財源，故得以快速擴張。(A)海珊政權是美國所滅。(B)主要控制伊拉克西北部及敘利亞東部地區。(D)庫德族非盟友。
- id: doc_111_雲林_虎尾_社會_地理_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 2010 年歐盟區爆發「歐豬五國」的債信危機，這些國家在經過數年努力與歐盟的紓困之後，經濟才逐漸回穩，但歐債危機也成為其他國家加入或脫離歐元區的考量，請問造成歐債危機的原因之一，是因為歐元的哪一種特性造成？
  options:
  - label: A
    content: 各國無法掌控本國的匯率
  - label: B
    content: 幣值大於美元，易受國際熱錢炒作
  - label: C
    content: 歐元區並無涵蓋所有歐盟會員國
  - label: D
    content: 只有在歐洲通用，實用性不高
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 就貨幣匯率與貿易收支的關係來說，貨幣貶值有利於出口，故貨幣政策亦是政府調整經濟的方法之一，歐盟採統一貨幣政策，當希臘國際競爭力較低時，希臘政府不只未能藉貶值來提升競爭力，歐元匯率反被德國等高競爭力國家拉升，使希臘無法藉貶值改善競爭力，提高所得來還債，也無法藉物價上漲來降低實質債務負擔，所以形成難解之危機，故選(A)。(B)並非國際資金炒作造成。(C)歐元區並無涵蓋所有歐盟會員國，非歐債危機的原因。(D)並無此說法。
