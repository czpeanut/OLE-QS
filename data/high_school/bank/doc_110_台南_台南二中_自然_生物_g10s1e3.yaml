- id: doc_110_台南_台南二中_自然_生物_g10s1e3_s3_40
  section: 3
  number: 40
  type: single
  page: 4
  stem: 根據本文，下列何者敘述<u>錯誤</u>？
  options:
  - label: A
    content: 相較於DNA，RNA有結構穩定、不易造成患者基因長期改變與容易發展客製化醫療等優點
  - label: B
    content: mRNA疫苗除了應用在新冠肺炎之外，也可以用來預防流感、瘧疾與狂犬病
  - label: C
    content: 在大腸桿菌繁殖複製DNA時所參與的酵素是DNA聚合酶
  - label: D
    content: 除了mRNA疫苗以外，現在也正積極發展SaRNA的疫
  group_stem: 【閱讀一】RNA應用－mRNA疫苗 1980年代末期，有病毒學家開始著手研究mRNA疫苗，直到新型冠狀肺炎（COVID-19）爆發前，已成功開發出可預防流感、瘧疾與狂犬病等傅染性疾病的mRNA疫苗。而近期因應COVID-19所開發的眾多疫苗中，mRNA疫苗的優良防護效果也讓它成為民眾較為信賴的疫苗選擇，包括BNT162b2（輝瑞-BioNTech疫苗）和mRNA-1273（Moderna莫德納疫苗）。 mRNA疫苗，顧名思義就是利用mRNA引人體免疫反應的疫苗。以輝瑞疫苗為例，其利用的是可以轉譯出新型冠狀病毒棘狀蛋白的mRNA，注入人體後細胞就能製造出病毒的棘狀蛋白，繼而引發一系列的免疫反應，產生對病毒的免疫力。 而mRNA疫苗是如何被製作出來的呢？首先，會透過基因轉殖技術，將含有病毒特定基因的質體轉殖人大腸桿菌，經由大腸桿菌繁殖的同時複製出大量的質體，再將質體從大腸桿菌中萃取出來，確認其序列無誤後便可利用酵素切取質體中的病毒基因片段，接著再由RNA聚合酶轉錄出mRNA。至此雖然獲得了疫苗中最重要的主體，但下一階段才是關鍵的步驟。 mRNA是單股結構，其穩定性不如DNA的雙股結構來得高，容易受到高溫破壞，而且人體内具有許多可將RNA分解的酵素（如RNase），所以需要提供mRNA足夠的保護才能使其進入人體細胞中。目前的方式多是將mRNA包裹於由脂質製成的膜内，形成「脂質奈米顆粒」（lipid nanoparticle，LNP），如此一來可供施打的疫苗便算是完成了。不過要注意的是，雖然有了脂質的保護，但還是改變不了mRNA容易受高溫破壞的性質，因此在運輸與儲存的過程中都必須保持低溫，才能維持mRNA疫苗的效力。 另外在2021年9月，同樣發展出COVID-19疫苗的公司 ─ 一阿斯米（AstraZeneca，簡稱Az）宣布，將與<u>英國</u>生技公司VaxEquity合作開發「自我擴增RNA」（self-amplifyingRNA，簡稱SaRNA）的技術，發展新一代的RNA療法與疫苗。saRNA另一種RNA，其作用原理與mRNA相似，但多了自我複製、擴增的能力，因此saRNA可以比mRNA轉譯出更多的蛋白質。若這項技術成功開發出來，不但能降低RNA疫苗或藥劑的使用劑量與投藥頻率，也將能拓展RNA療法更多的可能性。 （文章取自三民誌第17期2021年12月RNA在醫學上的應用）
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
