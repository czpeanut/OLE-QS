  stem: 1940年代，<u>喬治．韋爾斯．比德爾</u>（George Wells Beadle）與<u>愛德華．勞里．塔特姆</u>（Edward Lawrie Tatum）發現基因受到特定化學過程的調控而獲得1958年諾貝爾生理學或醫學獎。他們的關鍵實驗將粉色麵包黴菌暴露於X射線下，使突變發生。一系列的實驗顯示了這些突變造成了特定有關代謝途徑的酵素改變。這些實驗讓他們提出了基因和酵素反應的直接關聯，稱為一基因一酶說。下圖為人體黑色素表現的過程，甲乙丙丁為黑色素的前驅物質，abcd為參與各個過程的酵素，請選出正確的敘述：
