  group_stem: 【閱讀二】 農桿菌原來只是植病學家研究的對象，演變為農業生技的重要技術媒介，其歷史可追溯到西元1897年，<u>義大利</u>的Fridiano Cacara博士首先在葡萄藤的根交接處，觀察到如腫瘤般脹大的病徵。經進一步分離研究，發現宅是由桿狀的細菌Agrobacteriumvitis感染所致。1974年，<u>美國</u> <u>洛克菲勒大學</u>的Armin C. Brun博士證實植物的腫瘤組織即使沒有細菌存在，仍可繼續增生繁殖，顯示這些受感染的植物細胞已被細菌分泌出的某種物質改變。而隨著近代分子生物學的進步，終於在農桿菌中分離出與產生腫瘤能力有關的大型質體，命名為Ti質體（Tumor-inducing Plasmid）。1977年，<u>美國</u> <u>華盛頓大學</u>的Eugene W. Nester博士、Mary-Dell Chilton博士等人更發現，在植物腫瘤細胞中有一段誘導腫瘤的質體DNA存在，使得受感染的植物細胞產生如此劇烈變化，因此稱這段DNA為T-DNA。這結果顯示農桿菌可以跨越原核生物與真核生物的鴻溝，把遺傳物質從原核生物轉移至真核生物，進而改變真核生物的生長與發育。 農桿菌感染植物後使其產生腫瘤，是為了能利用腫瘤細胞不斷增生的能力，同時讓腫瘤細胞產生可供農桿菌利用的能量，而不需用到農桿菌本身的資源。農桿菌原存在於土壤裡，當植物因機械性傷害或昆蟲咬傷產生傷口時，這些傷口會分泌一些酚類化合物或醣類分子，用於修補傷口或抵抗病原菌入侵。這時農桿菌會利用VitA致病蛋白質所組成的感應系統，去感受這些植物分子的存在，進而機攻擊植物，開始其感染過程。農桿菌利用致病蛋白質把Ti質體打開，截切一段特定DNA產生單股的T-DNA，把T-DNA運送至植物細胞核中，以幫助T-DNA插入植物染色體中。在野生種農桿菌T-DNA上，含有負責生合成植物荷蒙的基因。當植物細胞表現T-DNA時，會使得植物細胞大量合成植物生長素和細胞分裂素，造成植物細胞不正常地增生分裂產生腫瘤。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
