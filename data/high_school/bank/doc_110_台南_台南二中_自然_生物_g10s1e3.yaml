  - label: C
    content: 普恩蛋白在人體內本來就存在，故可能是自然產生異常普恩蛋白
  - label: D
    content: 異常的普恩蛋白含有特殊的反轉錄酶，能自行大量複製，在個體內增殖
  group_stem: 【閱讀三】 1986年<u>英國</u>首先發現「牛海綿狀腦病」，也就是俗稱的狂牛病。引發海綿狀腦病的機制為：「只含蛋白質成分的病原體『普恩』侵入個體，在個體體內增殖後，破壞個體腦部。」普恩蛋白的性質舆我們所知的細菌、病毒等微生物迥異。這種病原體最大的特色是僅由蛋白質構成，不含DNA等遺傳物質。令人訝異的是，普恩蛋白竟為牛、人類細胞所原有。 普恩蛋白的增殖方式與細菌、病毒完全不同。目前關於普恩蛋白的增殖方式有兩種假說。普恩蛋白可分為正常型與異常型，兩種假說都認為正常普恩蛋白碰到異常普恩蛋白後，會轉變成為異常普恩蛋白。假說一：一個正常普恩蛋白與一個異常普恩蛋白結合後，會變成兩個異常的普恩蛋白：假說二：異常普恩蛋白會先聚合成團，當正常普恩蛋白與該團聚合後，也會轉變為異常普恩蛋白。這種正常轉為異常的作用發生在相同物種的普恩蛋白間，但是這種轉換現象偶爾也會出現在不同物種的普恩蛋白間，也就是說，將罹患綿羊搔癢症的綿羊體內異常普恩蛋白放進牛隻體內，牛隻體內原有的正常普恩蛋白碰到該異常普恩蛋白，也可能變成異常普恩蛋白。 <u>美國</u>科學家Prusiner和他的同事續又解開了普恩蛋白的化學密碼，利用此種蛋白質的基因排列順序，在基因庫裡找到對應的DNA排列順序。更令人吃驚的發現是，它們也存在正常倉鼠及正常人的細胞之中。接著證實了正常和患病兩種形式的普恩蛋白有完全相同的基因密碼。正常普恩蛋白和異常普恩蛋白其胺基酸序列一模一樣，不同之處在於立體結構，只是折疊方式不同。正常普恩蛋白被周圍的蛋白酶分解、消化，相對的，異常普恩蛋白則很難被蛋白酶分解，且能抵抗熱處理、化學處理，在細胞內不被分解，而得以不斷蓄積。
