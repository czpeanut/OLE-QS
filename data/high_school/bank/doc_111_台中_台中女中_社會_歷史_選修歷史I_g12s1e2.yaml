  stem: 右圖是某場戰爭的宣傳海報，請問下列說明何者正確？
  options:
  - label: A
    content: 這場戰爭是工業化之後的克里米亞戰爭
  - label: B
    content: 這個海報說明了總體戰之下全體動員的特點
  - label: C
    content: 這場戰爭發生在 18 世紀下半葉
  - label: D
    content: 這場戰爭在歐洲戰爭史上屬於有限戰爭
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 360.0
      - 133.65
      - 564.3
      - 271.95
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 附圖為英國政府於一戰期間發布的招募海報，由陸軍中將貝登堡勳爵所設計。海報中有五名英國平民和兩名英國軍人站在山坡上。左下角一名工人正舉起的大錘準備作業，中間一名女工人在一張桌子旁工作。後方一名護士正進行包紮工作。而背景中，一名童子軍將包裹遞給一名步兵，而一名海軍士兵則在操作大砲。這幅海報主要呈現當時在總體戰之下，為了贏得戰爭而全民一同動員的理想形象，故答案選(B)。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 兩次世界大戰後各自成立的國際組織，分別為「國際聯盟」及「聯合國」，用意在於防止世界大戰再起。關於這兩個國際性組織的敘述，下列何者正確？
  options:
  - label: A
    content: 皆為美國總統發起，故美國都有加入這兩個組織
  - label: B
    content: 前者由美國總統尼克森發起，後者由美國威爾遜總統提倡
  - label: C
    content: 兩個組織皆設有安全組織，以武力制裁侵略行為，且總部皆位於瑞士日內瓦
  - label: D
    content: 聯合國的功能遠高於國際聯盟
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國際聯盟的構想來自英國的布萊斯勳爵等人，時任美國總統威爾遜雖有參與設立與推廣工作，但美國最終在參議院的反對下並未加入國際聯盟。(B)聯合國的構想由美國總統羅斯福所提出，並在 1942 年同 26 國政府簽訂〈聯合國共同宣言〉，戰後逐步擴大。(C)國際聯盟設於瑞士日內瓦，但其並未設置安全組織，無法用武力制裁侵略行為，因而影響力不如聯合國，聯合國總部則設立於美國紐約。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 改革派在 1968 年主政後，在經濟方面開始實行市場經濟的政策，並開放言論等方面的自由權。然而這一系列的措施引起蘇聯的不滿，被視為對其政治權威的挑戰，蘇聯遂開始進行軍事干預，當地人民雖然紛起抵抗，後來仍被鎮壓，改革也宣告落幕。根據以上的內容，請問下列何者正確？
  options:
  - label: A
    content: 以上內容是描述東德政府在冷戰時期推動的改革
  - label: B
    content: 當時改革者曾提出「帶有人性面孔的社會主義」
  - label: C
    content: 改革派政權雖然瓦解，但不少改革政策仍獲保留
  - label: D
    content: 此次民主化運動即為捷克有名的「天鵝絨革命」
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題目敘述之時間點、改革內容、推動過程與結果，可判斷「改革派」所指的是前捷克斯洛伐克共產黨第一書記杜布切克（Alexander Dubček）。(A)題目內容為描述捷克斯洛伐克政府在 1968 年所推動的「布拉格之春」。(C) 1968 年 8 月蘇聯協同其他三個華沙公約成員國，入侵捷克斯洛伐克並強行終止改革行動，隔年杜布切克被迫辭職，繼任者胡薩克重新推動符合蘇聯路線的「正常化」政策。(D)「天鵝絨革命」發生於 1989 年。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 史家指出：「在第一次世界大戰期間，雖然甲國做為挑起戰端的國家，不過，在一戰結束後，各國的政府、人民自發展開對甲國的仇恨，似乎不太正常。甲國也因此接受了各國的指責，成為所有罪惡的承擔者，並且在各國決議中，甲國陷入萬劫不復的對待。」請問下列選項說明，何者為是？
  options:
  - label: A
    content: 甲國雖為戰勝國家，但卻遭到世界各國的指責謾罵
  - label: B
    content: 各國對甲國的仇恨很可能是來自戰爭期間的宣傳所導致
  - label: C
    content: 各國召開的決議會場，中國身為戰敗一方而無法參加
  - label: D
    content: 希特勒崛起之後，他第一個展開的進攻國家即是甲國
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從引文中可判斷，甲國應是《凡爾賽和約》中承擔最多戰責的德國，而各國人民對甲國的「不正常」仇恨，來自於戰爭期間各國醜化德國形象的宣傳手法。(A)甲國應為戰敗國。(C)中國當時雖為戰勝的協約國一員，但作為戰勝國卻仍在巴黎和會中，遭受如山東問題等不平等對待，因而引發五四運動。(D)甲國應為德國。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某國曾經長期受到白人統治者實行種族隔離政策的影響，後來隨著政治環境的變遷與舊體制的結束，到 1990 年代以後開始推動「轉型正義」的工程，強調追求真相與和解共生的精神，且被視為當代國家推動轉型正義的重要代表之一。根據以上內容，請問下列說明何者正確？
  options:
  - label: A
    content: 以上的種族隔離政策，是指澳洲過去實行的白澳政策
  - label: B
    content: 曼德拉在該國民主運動與轉型正義工作扮演重要角色
  - label: C
    content: 此國的轉型正義工程，促成印度教徒與穆斯林的整合
  - label: D
    content: 從以上內容可知這是指美國在民權運動後出現的轉變
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從題目的敘述，可判斷此應為南非政府過去所實施的種族隔離政策，1995 年南非政府開始執行轉型正義工作，成立「真相與和解委員會」，透過調查種族隔離時期對人權的大規模侵害，追求真相並達成社會和解。(C)南非的轉型正義工程，主要促成白人與黑人社群的整合。(D)此為南非政府執行轉型正義工作後產生的轉變。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 日本外務大臣松岡洋右在上臺後的演說中，首次正式提出在政治上建立一個以日本為主宰，以日、滿、華的牢固結合為基礎，囊括印度以東、澳大利亞和紐西蘭以北的所有地區和國家的殖民大帝國。請問下列敘述何者正確？
  options:
  - label: A
    content: 此論點為「大東亞共榮圈」
  - label: B
    content: 此為脫亞入歐論
  - label: C
    content: 此為日滿一體論
  - label: D
    content: 此論點引發了七七事變
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 松岡洋右為 1940 年第二次近衛內閣時期的外務大臣，其提出的論述乃反映當時日本政府在軍國主義盛行下，欲建立以日本為核心的「大東亞共榮圈」，實際上是對日本殖民帝國理想化的放大投射。(B)(C)從引文中欲將帝國範圍擴及東南亞、紐澳以北，即可判斷此已超越「脫亞入歐」與「日滿一體」的概念。(D)七七事變發生於 1937 年，早於「大東亞共榮圈」概念的出現。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 某資料指出：「此事件因為傷亡過大，且原住民已退至素有天險之稱的馬赫坡絕壁，日方因此改變策略，改以防線封鎖、炮兵炮擊及以飛機投擲炸彈的方式對岩窟進行圍攻。期間並以山炮發射疑似糜爛性之瓦斯彈，及讓飛機投擲白磷燃燒彈等，對躲藏在密林中的原住民進行攻擊。1931 年 1 月，民眾黨納入『反對一切妨害蕃人民族自由發展』條文，並向日內瓦之國際聯盟發電抗議。」請問上述資料，民眾黨提出抗議是因為日本政府在此次事件中的何種作為？
  options:
  - label: A
    content: 違反國際公約使用瓦斯毒氣彈攻擊原住民
  - label: B
    content: 違反人權對躲藏在密林中的原住民進行攻擊
  - label: C
    content: 違反帝國主義對殖民地人民使用燃燒彈
  - label: D
    content: 違反人道主義妨害番人生存自由
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 鑒於一次大戰期間，各國軍隊使用生化武器、毒氣等，對士兵造成極大的危害，大戰結束後在國際聯盟主導下，各國於是在 1925 年簽訂《日內瓦議定書》，限制生化武器的使用。然而日軍在霧社事件中，卻違規對原住民使用糜爛性瓦斯彈，對原住民產生嚴重的危害。總督府雖曾試圖掩蓋消息，但仍被臺灣民眾黨、臺灣自治聯盟等臺籍知識分子得知，並藉此向日本拓務省、國際聯盟，強力施壓並譴責總督府對臺灣的不當暴行，故答案選(A)。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 轉型正義是「一個原先不民主的社會，如何處理過去所發生的人權侵犯、集體暴行、或其他形式的巨大社會傷痛，以建立一個民主、正義、和平的未來」，德國以各種途徑來實踐「轉型正義」。請問下列敘述何者為正確？
  options:
  - label: A
    content: 戰後針對全部納粹黨首長與共犯展開紐倫堡大審判來實現轉型正義
  - label: B
    content: 針對奧斯威辛集中營展開法蘭克福大審判，成功的將所有管理共犯起訴
  - label: C
    content: 戰後有著「去納粹化」、「人事除垢」，所有納粹黨人無法進入公職服務
  - label: D
    content: 冷戰時東德運動員被迫施打藥劑以求獲勝，也納入實施轉型正義範圍
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)「紐倫堡大審」僅針對納粹德國的政治、軍事、司法和經濟領導人員進行戰罪究責。(C)戰後德國被分裂後又為美、蘇兩國納入冷戰體制下，因德國處於冷戰前線的特殊地位，因而在「紐倫堡大審」後，未針對過去曾為納粹黨的中下階層、協力者進行完全的「去納粹化」與「人事除垢」，因此 1950 年代的西德政府仍有許多舊納粹人員處於其中。(D)東德運動員被不當使用禁藥一事，並未被納入轉型正義的實施範圍。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 《凡爾賽和約》最引起爭議的內容是迫使德國要擔負起發動戰爭的全部責任，和約也限制德國的軍事能力，使其割讓領土，以及迫使他們支付鉅額的賠款，此和約也引起德國民眾的反感，並導致後來的第二次世界大戰的發生。當第二次世界大戰結束後，同盟國認知到不應懲罰軸心國的無辜平民，於是採用何種方式懲罰戰爭發動者？
  options:
  - label: A
    content: 對戰敗國提出割地賠款的要求
  - label: B
    content: 對戰敗國的首領進行暗殺行動
  - label: C
    content: 舉行司法審判釐清戰罪
  - label: D
    content: 懲罰戰敗國首領進行勞動服務
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 第二次世界大戰結束後，對於戰罪的究責工作，分別以「紐倫堡大審」、「東京大審」進行國際聯合司法審判。兩場審判針對的對象，為在戰爭期間犯下策劃、執行或以其他方式參與大屠殺和其他戰爭罪行者，基本上為軍、政領導階層，故答案選(C)。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 何以美國參戰後，第一次世界大戰勝負之勢已可預知？
  options:
  - label: A
    content: 原子彈將研發成功
  - label: B
    content: 協約國的人力、物力遠勝同盟國
  - label: C
    content: 同盟國已不再發動攻勢
  - label: D
    content: 德國的無限制潛水艇政策遭到嚴重破壞
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 美國的參戰是第一次世界大戰戰局的轉捩點，當時美國本土並未受到戰火波及，且具規模的工業生產與經濟實力，使協約國在後勤支援上得以遠勝於同盟國，此也被視為一戰戰局扭轉的關鍵點之一。(A)原子彈為二次大戰期間所發明。(C)美國於 1917 年參戰後，原本在東線牽制同盟國的俄國亦因革命問題而退出戰爭，德軍因而可於 1918 年春天，將原先駐防東線的軍隊調往西線，並對協約國發動大規模攻擊行動。同盟國聯軍雖成功將戰線推進至巴黎近郊，但卻在後繼無力的狀況下而戰敗。(D)無限制潛艇政策執行至戰爭結束。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_11
