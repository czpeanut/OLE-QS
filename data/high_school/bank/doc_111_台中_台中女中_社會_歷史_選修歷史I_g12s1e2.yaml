  stem: 1917 年西班牙流感在美國大爆發，這場疫情卻被一次大戰所掩蓋，相關報章媒體報導被政府審查，就連其他藝術創作也極少有相關論述，但據官方估計因疫情導致喪生的人數不亞於戰爭。起初媒體對疫情的報導輕描淡寫，內容不外乎「疫情已受控制」、「警報或恐慌是不必要的」、「死亡人數會持續減少」等，甚至宣稱疫情已近尾聲，但隨著疫情的擴大，政府才不得不面對疫情早已不受控制的現實，而媒體開始使用「瘟疫」一詞，甚至出現黑死病疫情的謠言，此時疫情已經嚴重到出現在每一位市民的身邊。關於上述資料，下列論述何者正確？
  options:
  - label: A
    content: 戰爭時媒體傳播的可信度高
  - label: B
