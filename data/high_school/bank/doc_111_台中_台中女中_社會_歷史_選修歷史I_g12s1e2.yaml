  explanation: (A)維也納會議為 1814 ～ 1815 年間，由奧國首相梅特涅所主持召開，主要針對法國大革命至拿破崙戰爭期間對列強間所形成的問題進行處理，並以維持列強間的權力平衡為核心。神聖同盟則是 1815 年由俄國沙皇亞歷山大一世所發起，成員國基本與參與維也納會議的國家相同，同盟的目標亦是維持君主制以及在維也納會議上所決定的歐洲政治和國家體系。(B)日耳曼邦聯於維也納會議後成型，主要聯合日耳曼境內各小國的國際聯盟，由奧地利、普魯士主導。然而奧、普之間始終存在權力鬥爭，並於 1866 的普奧戰爭中由普魯士勝出，普魯士將奧國勢力逐出日耳曼，並以其為核心重組北日耳曼邦聯。(C)第一國際成立於 1864 年，正式名稱為國際工人協會，1870 年代因局勢轉變，在馬克思、恩格斯主導下過渡為第二國際。第三國際原名「共產國際」，1919 年由列寧主導成立，主要為第二國際中的革命派所組成，並成為日後蘇聯的原型。
