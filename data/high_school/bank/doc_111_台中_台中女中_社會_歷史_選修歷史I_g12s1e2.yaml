  stem: '請閱讀資料回答下列問題：「總括一州縣之賦役，量地計丁，丁糧畢輸於官。一歲之役，官為金募。力差，則計其工食之費，量為增減；銀差，則計其交納之費，加以增耗。凡額辦、派辦、京庫歲需與存留、供億諸費，以及土貢方物，悉並為一條，皆計畝徵銀，折辦於官，故謂□□」。

    (1)請問□□應為何種制度？

    (2)資料顯示，此制度以哪兩者為收稅依據？

    (3)此賦稅制度徵收之物為何？'
  answer:
  - (1)一條鞭法；(2)土地、人丁；(3)白銀
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)此段引文出自《明史．食貨志》中，對於萬曆年間所推行的「一條鞭法」的敘述。一條鞭法的推行背景，乃為簡化明初以來複雜的賦役問題，並且朝廷得以增加並方便徵收稅款。引文中「量地計丁」、「並為一條，皆計畝徵銀，折辦於官」等兩項敘述，為一條鞭法的重要特徵。

    (2)題文中「量地計丁」，說明此稅法是根據「土地」與「人丁」的數量進行徵收。

    (3)題文中「並為一條，皆計畝徵銀，折辦於官」，則說明此稅法徵收之物為白銀。'
