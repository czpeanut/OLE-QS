  - label: C
    content: 戰爭時媒體只報導人民想聽的正面消息
  - label: D
    content: 戰爭時媒體報導會考量是否影響國家士氣
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題目提及戰爭期間媒體因受到政府審查的影響，因此對流感疫情的報導，大多採取輕描淡寫的態度。政府對疫情報導的掩飾，最可能的目的乃是避免因為疫情引發民眾恐慌，進而對戰爭士氣產生負面影響。由此可判斷較符合題目敘述的選項為(D)。
