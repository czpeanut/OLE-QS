  stem: 大衛名畫〈馬拉之死〉，這幅畫由來是女刺客夏洛蒂．科黛暗殺馬拉。科黛被捕後被送上了斷頭臺，行刑之前，她說：為了國家利益，不惜犧牲個人幸福要殺死馬拉以支持民主運動。她死的時候，拒絕像一般行刑者用眼罩遮住眼睛，因為她要好好觀看行刑過程，並自動把頸部放在斷頭臺刀下。她的表現讓那些痛恨恐怖政治、溫和派的市民們，視她為殉道者。請問馬拉當時應是法國哪一時期的執政者？
