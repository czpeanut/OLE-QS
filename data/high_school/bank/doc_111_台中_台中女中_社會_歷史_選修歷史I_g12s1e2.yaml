  answer_status: verified
  answer_source: answer_key
  explanation: '「賣豬仔」的概念形成於 19 世紀中期，當時因受招募出國的勞工都會簽署契約，而被稱為「契約華工」、俗稱「豬仔」；而販運、交易華工的「招工館」，亦被戲稱為豬仔館。當時的澳門為人口販賣中心，而這些華工則多前往馬來亞、美國西岸、古巴或秘魯，正確選項為(D)。

    38.19 世紀中期，美國因西部大開發、淘金熱等因素，吸引大量華工移民前往美國西岸，進行採礦業、興建鐵路等勞力工作。然而 1870 年代受到南北戰爭後的經濟衰退影響，美國本地勞工的就業機會受到排擠，因而開始向政府遊說、呼籲限制華工移民進入美國，而最終美國國會於 1882 年通過《排華法案》，故答案選(B)。

    39.由「父系血緣」、「姓、氏共同體」、「家庭私有制」與「財產繼承權」等特徵，可判斷此應為對(D)宗法制度的描述。(A)中國上古「封建制度」的內涵，主要為天子與諸侯間的分封、從屬關係的建立。(B)「井田制度」主要與農田分配、生產與稅賦相關。(C)「禮樂制度」主要為對身分地位、行為舉止和權利義務的相關規範。

    40.從三則資料的內容中，可判斷資料二中胡三省所注，乃為解釋資料一北魏太武帝要求五十歲以下僧侶還俗的動機，而資料三則為說明徵召還俗僧侶入伍的背景，乃為北魏與柔然間的戰爭相持不下，朝廷需加派援兵所致。正確選項為(A)資料二注釋資料一，資料三說明背景。'
