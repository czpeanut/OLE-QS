  stem: 歐洲某個時代的政治思想認為：「統治者和被統治的人民之間原來應屬於平等的關係。統治階層擁有的權力也是源自於人民基於共識而賦予的，但如果濫權、破壞人民與生俱有的自然權利，人民即有拒絕服從以至於發動革命行動的正當性。」根據以上內容，請問下列的說明何者正確？
  options:
  - label: A
    content: 此種政治思想在法國大革命後首度被提出
  - label: B
    content: 這種思想的形成，是受到社會主義的影響
  - label: C
    content: 馬基維利的政治學說已充分反映這種政治觀點
  - label: D
    content: 上述的天賦人權與革命權屬於啟蒙時代的思想
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 近代「革命權」的概念，主要在英國啟蒙哲士洛克的《政府論》中被提出，並成為構成「社會契約論」的重要思想。而自然權利亦為啟蒙思想的發展基礎，由此可判斷正確選項為(D)。(A)法國大革命的行動基礎乃是源於啟蒙思想的自然權利與革命權等概念。(B)社會主義的發展立基於啟蒙時代的政經哲學之上。(C)馬基維利的主要論述為《君主論》，為君權專制思想的重要理論家。
