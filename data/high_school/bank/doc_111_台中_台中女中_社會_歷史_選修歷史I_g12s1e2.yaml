  explanation: 甲、節錄自胡適於 1918 年發表的《建設的文學革命論》；乙、節錄自胡適於 1923 年發表的《國學季刊》發刊宣言；丙、節錄自梁啟超於 1896 年發表的〈論變法不知本原之害〉。此三則資料反映清末民初，中國新知識分子對教育、文化與思想改革所提出的論述。另外，「甲」資料強調文學與生活的連結，可判斷其背景為新文學運動；「乙」則近一步希望接納西方思想以對國學進行改革，因此可判斷「乙」出現的時間點晚於「甲」；而「丙」以文言文形式寫成，且批判的內容為傳統教育與科舉制度，由此可判斷其出現的時間最早。
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s2_42
  section: 2
  number: 42
  type: calc
  page: 7
  stem: '臺灣原住民的建築與中國西南的少數民族建築，在構造、形式上有許多共同相似之處，也與菲律賓、中南半鳥、馬來西亞、印尼有共同特徵，成為研究環太平洋土著建築文化的重要文化資產。請問：

    (1)在民族學上，臺灣原住民被歸類為哪一族？

    (2)華僑在馬來半島與馬來人所生下的男孩稱為什麼？

    (3)東南亞的哪一國在 1998 年曾發生嚴重的排華衝突，使許多臺商的生命財產遭受嚴重的威脅？'
  answer:
  - (1)南島語族；(2)峇峇；(3)印尼
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)臺灣的原住民族被歸類於南島語族的原因，主要是根據學者研究，各族群使用的語言有其共通性，再加上文化習俗、生活習慣等方面的多重考證，因而被歸類於南島語族。

    (2)早期中國移民與東南亞原住民通婚後，所生下的後裔，男性被稱為峇峇、女性被稱為娘惹。

    (3)印尼華人與當地原住民族之間，早自荷蘭殖民時期即存在許多族群間的矛盾。1945 年印尼獨立後，印尼政府曾在與荷蘭軍隊的抗爭中，放任軍隊劫掠、焚燒華人社區，造成泗水慘案等多起排華騷亂出現。其後印尼社會長期存在排華騷亂的問題，並在 1997 年亞洲金融風暴後，因經濟問題和對新政府的不滿，排華問題遭到有心人士刻意操弄，激化族群對立，終於在 1998 年爆發針對華人族裔的大規模暴動事件。此次事件逾千名華人遭到殺害，又被稱為「黑色五月暴動」。'
- id: doc_111_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s2_43
  section: 2
  number: 43
  type: calc
