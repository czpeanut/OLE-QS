  stem: 日本自 12 世紀後進入長達 600 多年的「幕府時代」。下列有關幕府時代的敘述，何者正確？
  options:
  - label: A
    content: 幕府是指地方上最有實力的豪族所形成的武士集團，以大將軍的名義組成統治機構，其地位需得到地方諸侯的承認
  - label: B
    content: 幕府為唯一的政府，大將軍以其個人名義實施統治，天皇已完全消失於政治舞臺
  - label: C
    content: 歷任幕府將軍均實施中央集權化的統治，其行政權可推行於全國
  - label: D
    content: 日本此時出現封建制度與莊園經濟，並建立了類似領主與附庸之間的依附關係
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)武士如欲開啟幕府體制，其關鍵乃為成功獲得天皇與朝廷冊封為「征夷大將軍」，其地位方可受到認可。(B)幕府體制可視為天皇與朝廷，授權給將軍與幕府實行統治，此為日本中古時期特有的二元統治系統。(C)幕府體制較接近於封建制度，將軍與各地實力派武士「大名」形成主從依附關係。
