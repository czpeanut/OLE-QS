  - label: C
    content: 醛固酮由腎臟分泌
  - label: D
    content: RAAS和人體體液滲透壓的維持有關
  - label: E
    content: RAAS和體液酸鹼值的恆定有關
  group_stem: 腎素－血管收縮素－醛固酮系統（RAAS），在人體內負責血管張力、鹽分及水分的平衡；血管收縮素II，是其中最重要的產物。正如其名，它可作用在血管，造成血管收縮及血壓上升；也可作用在腎小管，造成鹽分的回收；另外血管收縮素II也可促使醛固酮的分泌來造成腎元對鹽分的回收。此系統的重要性無可替代，但是若過度的活化，將會造成腎臟等多重器官的傷害。血管收縮素II可藉由造成出球小動脈的收縮，而引起腎絲球內壓力的上升和過濾率的上升。
