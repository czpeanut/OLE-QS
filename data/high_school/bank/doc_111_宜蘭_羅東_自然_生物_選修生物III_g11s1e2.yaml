  stem: 科學家利用菊糖來測定絲球體的過濾速率。菊糖是一種對人體細胞無害的多醣，可以通過絲球體空隙，完全過濾到鮑氏囊中，且不會被腎小管再吸收或是分泌出來，所以是測定絲球體過濾率的好材料，正常成年人的絲球體過濾率為125毫升／分鐘。若一正常人每天的排尿量為1.8公升，則下列數據的敘述何者正確？
  options:
  - label: A
    content: 鮑氏囊每天形成濾液180公升，濾液回收率為99%
  - label: B
    content: 鮑氏囊每天形成濾液1800公升，濾液回收率為99%
  - label: C
    content: 鮑氏囊每天形成濾液180公升，濾液回收率為90%
  - label: D
    content: 鮑氏囊每天形成濾液1800公升，濾液回收率為90%
  answer:
  - A
  answer_status: verified
