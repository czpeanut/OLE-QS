  stem: 關於自律神經的敘述，何者正確？
  options:
  - label: A
    content: 交感神經為感覺神經；副交感神經為運動神經
  - label: B
    content: 交感神經末梢分泌乙醯膽鹼；副交感神經末梢主要分泌去甲基腎上腺素
  - label: C
    content: 交感和副交感神經兩者共同維持體內恆定
  - label: D
    content: 交感神經促使心搏加快、腸胃蠕動加快；副交感神經則否
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
