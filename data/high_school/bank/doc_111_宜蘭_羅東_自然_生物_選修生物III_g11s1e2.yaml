- id: doc_111_宜蘭_羅東_自然_生物_選修生物III_g11s1e2_s3_44
  section: 3
  number: 44
  type: single
  page: 4
  stem: 下列何者<u>不是</u>血管收縮素II過於活化時，對腎臟造成傷害的原因？
  options:
  - label: A
    content: 使出球小動脈管徑縮小
  - label: B
    content: 使血漿更不易流出腎絲球
  - label: C
    content: 使腎絲球內的血壓過高
  - label: D
    content: 使過濾作用更不易進行
  - label: E
    content: 使蛋白質等大分子可進入鮑氏囊
  group_stem: 腎素一血管收縮素－醛固酮系統（RAAS），在人體內負責血管張力、鹽分及水分的平衡；血管收縮素II，是其中最重要的產物。正如其名，它可作用在血管，造成血管收縮及血壓上升；也可作用在腎小管，造成鹽分的回收；另外血管收縮素II也可促使醛固酮的分泌來造成腎元對鹽分的回收。此系統的重要性無可替代，但是若過度的活化，將會造成腎臓等多重器官的傷害。血管收縮素II可藉由造成出球小動脈的收縮，而引起腎絲球內壓力的上升和過濾率的上升。藉由血液流動力學的改變，造成腎絲球的傷害；因腎絲球內壓力和過濾率的上升，造成腎絲球通透性增加，導致蛋白尿。除此，血管收縮素II本身也會造成腎組織的發炎反應及纖維化。自從血管收縮素轉化酶抑制制（ACE inhibitor）問市以來，因其特殊的作用機轉，可降低血中血管收縮素II的濃度，使得出球小動脈擴張，而降低腎絲球內壓力，故早已被認定在慢性腎臓病有器官保護作用。而血管收縮素受體阻斷劑（ARB）的出現，又提供了我們另一選擇。 根據上文，回答下列問題。
  answer:
  - D
