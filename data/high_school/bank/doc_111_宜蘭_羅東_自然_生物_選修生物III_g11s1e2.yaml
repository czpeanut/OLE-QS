  explanation: (A)交感與副交感神經皆屬於傳出（運動）神經；(B)交感節後神經末梢主要分泌正腎上腺素，副交感節後神經末梢分泌乙醯膽鹼；(C)正確；(D)交感神經抑制腸胃蠕動。故選(C)。
