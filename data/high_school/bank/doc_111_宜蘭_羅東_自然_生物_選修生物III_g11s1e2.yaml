  stem: 在臉部局部注射肉毒桿菌素去除皺紋，主要原理是肉毒桿菌素會干擾何種神經元的末梢分泌神經傳遞物？
  options:
  - label: A
    content: 感覺神經元的樹突
  - label: B
    content: 運動神經元的軸突
  - label: C
    content: 聯絡神經元的軸突
  - label: D
    content: 運動神經元的樹突
  group_stem: '注射「肉毒桿菌素」是目前常見的美容醫療方式，普遍應用於去除臉部的皺紋。

    顧名思義，肉毒桿菌素（Botulinum toxin）是肉毒桿菌所分泌的毒素，其毒性主要作用於神經與肌肉連接的部位，會抑制神經傳遞物的釋放，進而阻斷神經訊號的傳遞，導致肌肉無法收縮而麻痺，嚴重時會致死。肉毒桿菌素被應用於醫學美容上純粹是一個意外的發現。在1990年代，眼科醫師<u>卡露瑟斯</u>（Dr. Carruthers）利用肉毒桿菌治療斜視病患時，觀察到患者的魚尾紋也同時獲得改善，經過多年的研究之後，肉毒桿菌素在醫學美容方面的應用獲得更的突破，幾乎掩蓋了其在純醫療領域的光芒。 注射「肉毒桿菌素」可有效去除上半臉的皺紋，如魚尾紋、抬頭紋、皺眉紋，肉毒桿菌素使這些部位的肌肉無法收縮而放鬆，達到消除皺紋的效果。另外，肉毒桿菌素也可以治療多汗症，汗腺分泌受自律神經系統控制，在多汗部位注射肉毒桿菌素，可以抑制神經傳遞物的釋放，減少汗腺分泌而達到良好治療效果。 但注射肉毒桿菌素的醫療效果並非一勞永逸，它對神經訊號傳遞的干擾是可逆的，因此經過四至六個月便須再次接受治療。依據上文內容和習得的知識，請回答下列問題：'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
