  stem: 黃叔璥《臺海使槎錄》：「蓋自紅夷至臺，就中土之遺民，今之耕田輸租，以受種十畝之田為一甲，分別上、中、下則徵粟，其陂塘修築之費，耕牛、農具、種籽，皆紅夷資給，故曰『王田』。亦猶中土之人，受田耕種而納租於田主之義，非民自世其業，而按畝輸稅也。」以下對上述史料的分析何者較恰當？
