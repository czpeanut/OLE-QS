    資料三： 大清國列祖列宗與汝有何讎乎？太后、皇上與汝有何讎乎？汝既將發祥之地、陵寢迫近之區割媚倭奴……又將關係七省門戶之臺灣……全輸之倭奴！……亂臣賊子，人人得而誅之，聖訓昭然。

