  stem: '下列是三則與中華民國外交有關的文件內容，閱讀後回答問題：

    甲：提供防禦性武器給臺灣人民；維持美國的能力，以抵抗任何訴諸武力、或使用其他方式高壓手段，而危及臺灣人民安全及社會經濟制度的行動。

    乙：美利堅合眾國承認中華人民共和國政府是中國的唯一合法政府。在此範圍內，美國人民將同臺灣人民保持文化、商務和其他非官方關係。

    丙：以光榮之同感，追溯上次大戰期間，兩國人民為對抗侵略，而在相互同情與共同理想之結合下，團結一致併肩作戰之關係；……願加強兩國為維護和平與安全而建立集體防禦之現有努力，以待西太平洋區域安全制度之發展。

    (1) 甲、乙、丙三項文件依制定∕簽署時間的先後順序為何？

    (2) 因何場戰爭的影響，而有「丙」文件的簽署？請寫出該場戰爭與「丙」文件。

    (3) 依據甲、乙兩項文件，簡述中華民國與美國外交關係的變化？'
  answer:
  - (1) 丙→乙→甲。
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 甲文件提到「提供防禦性武器給臺灣人民」，是 1979 年臺美斷交後，美國國會通過的《臺灣關係法》；乙文件提到「承認中華人民共和國政府是中國的唯一合法政府」，故為 1979 年元旦生效的美中〈建交公報〉；丙文件有加強兩國合作「建立集體防禦」的內容，應為 1954 年簽訂的《中美共同防禦條約》。因此時間先後順序為丙乙甲。

    (2) 1950 ～ 1953 年韓戰期間，美國宣布「臺灣海峽中立化」，派第七艦隊協防臺灣。迨戰爭結束後，為加強防堵共產勢力的擴張，因此簽訂《中美共同防禦條約》，中華民國加入太平洋反共陣線。

    (3) 1979 年美國與中華人民共和國建交，與中華民國斷交，但美國仍通過《臺灣關係法》維持與臺灣的實質交流，並持續對臺軍售防衛性武器。'
