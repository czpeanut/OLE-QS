  stem: '資料一： 今年乙卯五月，倭賊到臺二十有年已滿，氣數將終，天地不容，神人共怒。我朝大明，國運初興，本帥奉天，舉義討賊，興兵伐罪。大會四海英雄，攻滅倭賊，安良除暴。

