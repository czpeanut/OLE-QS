  stem: '請閱讀下列兩則資料：

    資料一：「臺灣總督府於 1912 年頒布《本島人、清國人不得使用會社名義》，規定：『本島人、清國人或僅在本島人與清國人間設立的團體，在其商號中，不得使用會社的字樣。違背上項規定者，處二百元以下的罰金。本令自發布之日起施行，於本令施行時已使用會社字樣者亦適用之。但在本令施行後三個月內取消其會社字樣者，不予處罰。』」

    資料二：「1926 年，林獻堂與陳炘、吳子瑜等人成立『大東信託株式會社』，目的在『糾集臺灣人的資金，以供臺灣人利用』。由於其董事、監事都是臺灣文化協會的支持者，故有『臺灣運動的金庫』之稱。」

