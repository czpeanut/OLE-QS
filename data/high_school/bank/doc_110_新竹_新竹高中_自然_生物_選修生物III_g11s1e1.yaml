  stem: 心肌炎影響心臟收縮能力而使心輸出量減少，下列關於人體心臟收縮的機制，哪些正確？（應選2項）
  options:
  - label: A
    content: 由位於右心室的節律點控制心臟收縮頻率
  - label: B
    content: 心肌細胞的排方式有助於心房及心室的肌肉同步收縮
  - label: C
    content: 心肌交替地進行收縮和舒張
  - label: D
    content: 心房收縮、房室瓣關閉時會引發第一心音
  - label: E
    content: 激素可調節心臟的收縮強度
  group_stem: '近期已在學生族群開打第一劑BNT新冠疫苗，因為其罕見副作用「心肌炎」，大眾因此對這個疾病有更多的認識及討論。美國食藥署（FDA）與歐盟藥品主管機關（EMA）發現，接種COVID-19 mRNA疫苗（包括BNT與Moderna疫苗）和心肌炎、心包膜炎之間，可能有關聯性，然確切的成因仍不明。歐洲藥管局分析，至2021年5月31日，歐盟地區共接種了1.77億劑BNT疫苗及2,000萬劑莫德納疫苗，計分別有145例及19例心肌炎，以及138例及19例心包膜炎病例報告。mRNA疫苗造成的心肌炎或心包膜炎副作用，主要發生在年輕男性、第二劑接種的時候，且發病時間約在一周後到28天內發生。

    心肌炎是指心臟肌肉發炎，心包膜炎是包圍心臟周圍的纖維組織發炎。這兩個情況可以單獨或同時發生，發病的原因主要為病毒感染（腸病毒、腺病毒、流感病毒等），也可能因其他原因（如免疫反應、細菌感染）。心肌炎可能導致心臟收縮能力減弱，甚至心臟的跳動受影響而使心輸出量減少，嚴重者導致心臟衰竭而死。若心包膜發炎，液體可能會蓄積於心胞膜與膜穿刺引流，有死亡的風險。心肌炎／心包膜炎最初症狀包括胸痛、呼吸困難、心悸，雖多數個案需要住院觀察治療，但大多數病程輕微、對治療反應良好。（文章來源https://www.cdc.gov.tw/lile/File/Get/es0pwDYE2z1.2Y3kCjxpdqO）'
  explanation: (A)右心房 (D) 心室收縮 (E)收縮頻率
