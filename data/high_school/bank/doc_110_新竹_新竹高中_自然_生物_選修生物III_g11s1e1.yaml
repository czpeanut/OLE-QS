  stem: 動物生理學是生物學領域中發展最為成熟的學門，研究歷程中許多觀念或定義會隨之演變。下列敘述何者較接近現今生理學家對於「恆定」一詞的看法？
  options:
  - label: A
    content: 阻隔或減少外環境對生物體內的影響就能維持恆定
  - label: B
    content: 動物體需由體內細胞的生理運作調控動態穩定，才能達到恆定
  - label: C
    content: 動物體內不可能恆定，生理指標隨環境變化與個體狀態而起伏不定
  - label: D
    content: 動物體內必須維持恆定，稍微偏離恆定值便會造成嚴重的生理異常
