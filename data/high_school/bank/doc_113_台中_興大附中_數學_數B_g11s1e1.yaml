- id: doc_113_台中_興大附中_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 有一圓形摩天輪，中心軸高 20 公尺，直徑 36 公尺，逆時 針方向運轉一圈需 15 分鐘。當摩天輪開始運轉時，<u>阿正</u>恰坐在離地面最近的位置上，x 分鐘後，<u>阿正</u>離地面高度為 y＝a sin（bx＋c）＋d，a＞0，b＞0，0＜c＜2π，下列哪些 選項正確？
  options:
  - label: A
    content: a＋d＝36
  - label: B
    content: a＝18
  - label: C
    content: b＝$\frac{2\pi}{15}$
  - label: D
    content: c＝$\frac{2\pi}{3}$
  - label: E
    content: d＝18
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_113_台中_興大附中_數學_數B_g11s1e1/s2_1_f1.png
    crop:
      page: 2
      rect:
      - 444.4
      - 419.3
      - 564.3
      - 523.7
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '依題意，y＝a sin（bx＋c）＋d 之最小值為 2，最大值為 38，週期為 15

    ⇒ $\begin{cases}a+d=38 \\ -a+d=2 \\ \frac{2\pi}{b}=15\end{cases}$ ⇒ $\begin{cases}a =18 \\ d =20 \\ b =\frac{2\pi}{15}\end{cases}$

    又 x＝0 時，y＝2 ⇒ 2＝18 sinc＋20 ⇒ sinc＝－1

    ∵0＜c＜2π ∴c＝$\frac{3\pi}{2}$

    故選(B)(C)'
