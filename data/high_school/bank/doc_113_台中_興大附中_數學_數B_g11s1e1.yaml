- id: doc_113_台中_興大附中_數學_數B_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設 f（x）＝$\frac{(2^{x}-128) (3^{x}-1) (6^{x}+6)}{(5^{x}-125) (2^{-x}-4)}$，若 f（a）＜0，則 a 可以是下列何數？
  options:
  - label: A
    content: －4
  - label: B
    content: '1'
  - label: C
    content: $\sqrt{20}$
  - label: D
    content: $\sqrt{40}$
  - label: E
    content: $\sqrt{60}$
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵$2^{－4}$－128＜0，$3^{－4}$－1＜0，$6^{－4}$＋6＞0，$5^{－4}$－125＜0，$2^{4}$－4＞0

    ∴f（－4）＜0

    (B) ○：∵$2^{1}$－128＜0，$3^{1}$－1＞0，$6^{1}$＋6＞0，$5^{1}$－125＜0，$2^{－1}$－4＜0

    ∴f(1)＜0

    (C) ╳：∵4＜$\sqrt{20}$＜5 ⇒ $2^{\sqrt{20}}$－128＜0，$3^{\sqrt{20}}$－1＞0，$6^{\sqrt{20}}$＋6＞0，$5^{\sqrt{20}}$－125＞0，$2^{-\sqrt{20}}$－4＜0

    ∴f（$\sqrt{20}$）＞0

    (D) ╳：∵6＜$\sqrt{40}$＜7 ⇒ $2^{\sqrt{40}}$－128＜0，$3^{\sqrt{40}}$－1＞0，$6^{\sqrt{40}}$＋6＞0，$5^{\sqrt{40}}$－125＞0，$2^{-\sqrt{40}}$－4＜0

    ∴f（$\sqrt{40}$）＞0

    (E) ○：∵7＜$\sqrt{60}$＜8 ⇒ $2^{\sqrt{60}}$－128＞0，$3^{\sqrt{60}}$－1＞0，$6^{\sqrt{60}}$＋6＞0，$5^{\sqrt{60}}$－125＞0，$2^{-\sqrt{60}}$－4＜0

    ∴f（$\sqrt{60}$）＜0

    故選(A)(B)(E)'
