  stem: 某報導指出：「中東與北非因政治動盪引爆的難民危機在歐洲各地蔓延，許多難民前仆後繼地跨越歐陸向英國邁進，除了英語是大家較熟悉的溝通語言外，英國的褔利制度更是吸引難民的主要原因，日前英國首相宣布一項難民轉送政策，欲將部分難民安置至非洲的盧安達，隨即引來聯合國難民署抨擊，認為該政策嚴重違反國際法和難民法。」從人口推拉理論分析，該報導中哪段敘述最可能符合中間障礙因素？
