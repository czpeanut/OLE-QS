  stem: '區位商數法（Location Quotient）是經濟地理學常用的指標，主要用來衡量一個區域的特定產業重要程度，計算方式如下：

    LQ＝$\frac{某地區i產業就業人口/某地區總就業人口}{全國i產業就業人口/全國總就業人口}$

    當 LQ＞1：意即某區域某產業的就業人數大於全國平均水準，顯示該產業為該區的重要產業

    當 LQ＜1：意即某區域某產業的就業人數小於全國平均水準，顯示該產業非該區的重要產業

    下表為臺灣 6 都各行業區位商數比較表，從表中可以推論出哪幾項資訊？(甲)新北市以「營建工程業」為最主要都市機能(乙)與其他都市相比，臺北市最多種行業具有顯著機能(丙) 6 都中僅臺南市以「農、林、漁、牧業」為主要機能(丁)桃園市的「運輸及倉儲業」為 6 都中最突出

    ▲ 2022 年臺灣 6 都各行業區位商數比較表'
