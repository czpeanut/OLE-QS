  section: 1
  number: 2
  type: single
  page: 1
  stem: 在美國職棒大聯盟（MLB）中，大都市的球隊因為企業資金充裕，球隊常能以高薪吸引球員，像是紐約洋基隊、洛杉磯道奇隊以及波士頓紅襪隊，但小都市的球隊就無法負擔如此高額的薪資。而此最可能與美、加兩國都市體系所具有的下列哪項特色有關？
  options:
  - label: A
    content: 交通便利有別，大都市較具有通勤旅時較短現象
  - label: B
    content: 人口結構不同，大都市有較高比例藍領勞工球迷
  - label: C
    content: 都市階層不一，大都市通常擁有較高的生產總值
  - label: D
    content: 內部結構各異，大都市內部土地利用分區較完善
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)都市人口規模不同形成不同等級的都市階層。當都市等級愈高，不僅人口總數愈高，其工商業發展規模及產值隨之愈大，企業挹注至球隊的資金亦多，自然也得以負擔球隊更高額的薪資成本。
