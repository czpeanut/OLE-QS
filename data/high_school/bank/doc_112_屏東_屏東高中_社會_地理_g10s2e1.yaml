  stem: '下表為聯合國 2020 年發表的都市化資料，推估到 2030 年全球將有 60.4 ％人口居住在都市地區。其中與歐、北美兩洲都市化程度相當的某洲，其經濟發展程度卻無歐、北美兩洲高。造成此現象的主要原因，最可能為下列何者？

