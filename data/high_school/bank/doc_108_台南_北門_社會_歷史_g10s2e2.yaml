  stem: 移民會影響漢語方言的地理分布格局；詩云：「北人避胡多在南，南人至今能晉語」，足以反映哪一個亂事對於漢語方言分布的影響？
  options:
  - label: A
    content: 永嘉之禍
  - label: B
    content: 八王之亂
  - label: C
    content: 六鎮之亂
  - label: D
    content: 安史之亂
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關馬來西亞華人的相關敘述，何者正確？
  options:
  - label: A
    content: 馬來西亞當地俗諺稱「三代成峇」，象徵華人文化已有當地色彩
  - label: B
    content: 華人與當地人結婚生下的女孩被稱為「峇峇」
  - label: C
    content: 華人在當地事業有成，如郭春秧被譽為「馬國糖王」
  - label: D
    content: 為向當地政府宣示效忠，華人均改信天主教
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 教科書描述某一古都；「這個城市的人口大約一百萬，外國人可能占了三分之一。城內圍隔成一百多個坊，除了皇城、中央官署外，還有東、西兩個市場。如果有機會拜訪這座城市，你會因為眾多的佛寺而感到震驚。宴會上常可看到外國女子組成的樂隊，坐在駱駝背負的平臺上表演，演奏著類似吉他的琵琶。」這最可能是哪一座都城？
  options:
  - label: A
    content: 東漢的洛陽
  - label: B
    content: 唐朝的長安
  - label: C
    content: 北宋的汴京
  - label: D
    content: 元朝的大都
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 資料一：我做皮貨生意，同治二年到省城賣皮，賣了四十三銀兩，遇見認識的陳阿里，他是賣豬到省城的。他約我到澳門玩……我喝醉了，酒醒了，就在豬仔館內，……見西洋官，給合同一張，告訴我做八年工。 資料二：豬販恐失權利，即代為答應，強其畫押，畫押後驅至工作所在地，鞭撻凌虐，苦過於豬……欲逃不得……至於水土之合宜與否，尤無人過問，病死不過草草掩埋。染病不死，而羸弱不堪工作，則驅逐出外，悵悵無之，以葬身溝壑……此豬仔之名所由來也。 請問：有關上述兩段資料的敘述何者「錯誤」？
  options:
  - label: A
    content: 當時有華工是遭到人口販子設計而簽下合約
  - label: B
    content: 當時人口販子稱為豬販，是因為其以不人道的手法對待華工
  - label: C
    content: 當時華工皆是因為在家鄉生活不下去自願前往海外工作
  - label: D
    content: 這應當發生於十九世紀
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「這個地區原為物產豐饒的農業區。但在晚明時期受到流寇戰亂的影響，大量的人口遭到屠戮。及至清初，政府實行獎勵移民政策，促成數百萬移民分別由華中與華南地區湧入，不僅使得這個地區在清代後期成為全中國人口最多的省區之一，也造成此地的文化風貌呈現多元並蓄的特點。」下列相關敘述何者正確？
  options:
  - label: A
    content: 上文內容與清朝實行「改土歸流」後的雲貴地區有關
  - label: B
    content: 清政府獎勵移民移居此地主要是為防範俄國侵略
  - label: C
    content: 大量移民移入的現象，曾被稱為「湖廣填四川」
  - label: D
    content: 外地移民的湧入曾引起當地占大多數的回族反彈
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《裨海紀遊》中有如下記載：「我朝嚴禁通洋，片板不得入海，而商賈壟斷，厚賂守口官兵，潛通鄭氏以達廈門，然後通販各國。凡中國各貨，海外人皆仰資鄭氏；於是通洋之利，惟鄭氏獨操之，財用益饒。」請問下列關於引文的敘述，何者正確？
  options:
  - label: A
    content: 鄭成功是官方的海上貿易轉運人員
  - label: B
    content: 海禁政策使商人跟海盜密集合作
  - label: C
    content: 商人必須跟官方合作才可進行貿易
  - label: D
    content: 官方壟斷了海上貿易的發展
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 1941到1945年間，有大量的朝鮮人被日本占領軍憲兵隊從農田或城市掠劫，帶到了日本，強迫他們到礦場與工廠工作，北海道所有的礦工裡有一半以上是朝鮮人。1941年在關鍵工業部門工作的大多是日本男子，然而到1945年已有一半是朝鮮人與婦女。根據題幹，1941到1945年間朝鮮人移居日本的原因最可能為何？
  options:
  - label: A
    content: 戰爭期間朝鮮經濟不佳
  - label: B
    content: 朝鮮人積極爭取平等的工作機會
  - label: C
    content: 工業部門環境不佳日本人不願從事
  - label: D
    content: 日本戰時勞動力不足而被迫移居
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 宋、遼間的戰爭長達25年，與燕雲十六州的爭奪有很大關聯。雙方最後在澶州城下達成協議，兩國約為兄弟之邦，宋每年贈予遼歲幣，宋、遼邊界設立榷場貿易。請問此協議對宋朝的影響或意義為何？
  options:
  - label: A
    content: 宋朝必須承認遼國擁有燕雲十六州的主權
  - label: B
    content: 宋朝確立天朝上國地位，遼國透過榷場貿易向宋朝進貢
  - label: C
    content: 中國首次與周邊國家建立對等關係，宋、遼從此不再戰爭
  - label: D
    content: 北宋拉攏西夏，充實軍力伺機滅遼
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「中國對日作戰的戰費，每天為國幣二百五十萬元，以此推論，則每月之戰費為七千萬元至八千萬元，每年戰費為九億元，以□地區在抗戰第一年內僑匯的總額約國幣四億三千多萬元，可以充抵抗日總經費的二分之一」。請問□中填入哪一地區較合理？
  options:
  - label: A
    content: 臺灣
  - label: B
    content: 日本
  - label: C
    content: 朝鮮
  - label: D
    content: 東南亞
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 華商阿財在商會回顧商會領袖的貢獻：「……該時我僑陳君開順，亦係該會之中堅人物，……英人雖已統治新加坡，但尚未開發柔佛（馬來西亞地名）；……陳君開順率領工人同志多人，……從事墾殖，極為成功。後來逐漸開拓柔佛埠，秩序井然，遂迎柔佛蘇丹（伊斯蘭國家統治者的頭銜）置都於此，……深得柔佛蘇丹之器重，……仍經營工農生產等工作……。」請問下列關於陳開順的經歷的描述何者正確？
  options:
  - label: A
    content: 陳開順的事業受到法國政府支持
  - label: B
    content: 陳開順的事業範圍在暹羅
  - label: C
    content: 陳開順的政商關係良好
  - label: D
    content: 商會並未獲得開墾利益
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 關於遼的「二元統治」，下列何者描述正確？
  options:
  - label: A
    content: 設北面官管理契丹與其他游牧民族
  - label: B
    content: 將境內民族分成國人、漢人與南人三個等級
  - label: C
    content: 將大量的猛安、謀克遷入華北
  - label: D
    content: 設立薩保府管理漢人
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 1868年新登基的明治天皇為強化工業化與軍事建設，以對抗西方強權主義，開始向人民徵收高額稅金，不少農民起而反抗。1875年，夏威夷與美國簽訂互惠條約，允許夏威夷的糖免稅進口美國，夏威夷的製糖業因此需要更多勞工。夏威夷甘蔗園主將日本視為廉價勞工的來源，與日本移民公司簽約，為夏威夷甘蔗園提供了超過十二萬四千名日本勞工，並從中獲得許多利益。從題幹中可判斷日本人移居夏威夷的原因為何？
  options:
  - label: A
    content: 日本受到西方殖民統治
  - label: B
    content: 日本的帝國王義侵略政策
  - label: C
    content: 日本國內的經濟壓力
  - label: D
    content: 日本航海技術發達
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 唐玄宗開元年間，以關內道京兆府有戶362,909，到了憲宗元和年間只剩241,202戶。雖然京兆府仍擁二十四萬餘戶，是全國人口最多的地區，但江北州府戶數已經遠不如江南。請問造成這種情況的原因可能為何？
  options:
  - label: A
    content: 吐蕃大舉入侵江北造成江北經濟嚴重破壞
  - label: B
    content: 南方的士族努力保存傳統文化
  - label: C
    content: 科舉制度設計對南方州府有利
  - label: D
    content: 戰亂後人口往相對安定處移民
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 某一朝代，許多中亞與波斯等西域各族人士來到中國境內，由於他們擅長經商理財，因而深受統治者所倚重，大量出任政府要職。這些西域人士多數為穆斯林，也構成一個特殊族群身分，享有優於漢人的社會地位和法律待遇。請問：他們的族群身分被稱為何？
  options:
  - label: A
    content: 色目人
  - label: B
    content: 旗人
  - label: C
    content: 潘泰人
  - label: D
    content: 阿伊奴人
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 有一位來自臺灣的旅遊者前往中亞的哈薩克與吉爾吉斯，他曾在楚河流域探訪了幾個東干族人的聚落，其間，也向當地的長者探詢關於東干族的歷史文化。下列何者最有可能是這位旅遊者會聽到的說明內容？
  options:
  - label: A
    content: 我們族人最初是從中國雲南遷離故鄉，輾轉來到中亞地區
  - label: B
    content: 我們現在使用的語言，其實仍含有許多陝、甘的漢語方言
  - label: C
    content: 我們的祖先來自中國陝西，在蒙古西征後就已定居於此地
  - label: D
    content: 我們族人信仰伊斯蘭教，在文化上仍保持原鄉新疆的傳統
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 福澤諭吉的《臺灣永遠的方針》：「臺灣現在既歸入我國版圖，便不容許照舊交付在蠻民手中，應自內地大舉移民開發富源，這樣才符合文明的本意。政府的方針一定，諒不催促也有多數內地人希望移居。」從引文中，可以判斷福澤諭吉主張移民政策的原因為下列何者？
  options:
  - label: A
    content: 日本人口數過多
  - label: B
    content: 日本當時經濟不佳
  - label: C
    content: 殖民地無人居住
  - label: D
    content: 強化對殖民地統治
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 資料一：「汝（指卑彌呼）所在踰遠，乃遣使貢獻，是汝之忠孝，我（魏明帝曹叡）甚哀汝。今以汝為親魏倭王，假金印紫綬，裝封付帶方（州郡名稱）太守假授汝。」 資料二：「日本曾多次遣使至隋朝，其中有次由小野妹子擔任遣隋使，該次小野妹子代天皇遞給隋煬帝的國書中寫道『日出處天子致書日沒處天子無恙』，讓隋煬帝極度憤怒。」 請問我們可以如何解讀這兩則與日本相關的資料？
  options:
  - label: A
    content: 日本遣使至中國的目的均是為了挑釁中國皇帝
  - label: B
    content: 日本統治者自稱天子，顯示日本欲脫離與中國的冊封關係
  - label: C
    content: 隋煬帝憤怒的原因實為日本統治者要求被冊封為天子，欲取得跟中國皇帝平等的地位
  - label: D
    content: 卑彌呼被三國魏王冊封為親魏倭王，由於其被封為王，與中國天子間是平等的關係而非君臣關係
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 史書記載：「□以國俗沿上世之陋，欲遷洛以變舊風。恐大臣不欲，乃發京師步騎百餘萬南伐，至洛陽，帝戎服執鞭而出，群臣稽顙於馬前，請停南伐，□曰：「今者之舉，興發不小，動而無成，何以示後？若不南伐，便當都洛。」乃議遷移之計。次年，至平城宮，部分遷留。又臨太極殿，喻在代諸臣遷移之略。時舊臣多不欲行，帝先與城王澄議之，謂平城乃用武之地，非可興文，須光宅中原，澄力贊之，乃決。」請問：上述史料，對於□應指下列何者較為適當？
  options:
  - label: A
    content: 匈奴
  - label: B
    content: 回紇
  - label: C
    content: 鮮卑
  - label: D
    content: 氐
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 北宋滅亡之後，大量人民南渡，使南方產生文化上的轉變。關於這個時期文化轉變的敘述，下列何者為「非」？
  options:
  - label: A
    content: 江南地區湧入大批北方移民
  - label: B
    content: 北方飲食文化影響南方，像是食用麵食
  - label: C
    content: 臨安融入北方的語言系統
  - label: D
    content: 北方人南遷重挫南方經濟
- id: doc_108_台南_北門_社會_歷史_g10s2e2_s1_20
  section: 1
  number: 20
