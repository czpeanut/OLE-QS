  stem: '今日我們稱這條由長安到西域的路為何？

    ◎請閱讀下列資料後回答問題： 1949年印尼脫離荷蘭獨立後，當地的經濟主體轉而由華人把持，引發當地排華聲浪。印尼商人阿沙特帶頭發起攻擊，他主張，華人就是華人，華人群體具有強烈的排他性，即使華人入籍成為印尼公民，他們那種無孔不入的本性也是任何「真正的」印尼人無法接受的。因此必須打擊華人，保障印尼當地住民在經濟和地位上的權利。 然而，排華聲浪更超出經濟領域，1965年印尼爆發大規模的排華運動，起因是親美的軍人將領蘇哈托發動政變，企圖推翻左傾的總統蘇卡諾，蘇哈托展開針對共產黨的屠殺，而華人一方面不被認同為「真正的」印尼人，二方面華人普遍被認為支持共產黨，竟衍生成大規模的排華運動。 政變之後，印尼政府在提及中國時，改採具歧視意味的「支那」一詞，即使北京提出嚴重抗議，印尼方面仍不理睬，為何要改變名稱？根據印尼官員給出的理由，乃是「讓我們的人民不再感到卑微，同時也不允許華裔有優越意識」。這正可以看出印尼「華人問題」的癥結所在，由於自荷蘭殖民以來，推行種族等級制度，將華人列為二等公民，位居於荷蘭人之下，卻在印尼「土人」之上，並保證印尼「土人」只能從事種植咖啡、甘蔗、茶葉等勞動，並委派許多華商擔任中間人代為管理與徵稅，這一措施使得印尼人民認知自身是遭受剝削者，而這種長期累積的屈辱情緒，在獨立之後，加劇了印尼人民的排華情緒。 ＊資料出處：改寫自孔復禮著、黃中憲譯，《華人在他鄉：中華近現代海外移民史》（新北：臺灣商務印書館，2019），頁367～371'
