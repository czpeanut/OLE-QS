  section: 3
  number: 36
  type: multiple
  page: 4
  stem: 含萊特多巴胺的美國豬肉在2021年起開放進口，但部分縣市仍制定「零檢出」的地方自治條例，有牴觸中央「在安全範圍內可檢出」的行政命令之虞。行政院院長在備詢時表示，食安標準應全國一致，才利於遵行。地方食安自治的相關條例，凡訂有零檢出規定者，因違反憲法並牴觸中央法規，將函告無效。在「萊豬」開放進口的過程，中央與地方政府間存有許多意見相左之處。以下何者對於中央與地方關係詮釋最為恰當?
  options:
  - label: A
    content: 行政院認為檢出標準屬全國一致性事務，應由中央政府統一規範
  - label: B
    content: 我國主權歸屬中央，中央政府可無需理由函告地方自治條例無效
  - label: C
    content: 檢驗標準屬於跨區事項，鄰近縣市若無統一標準則抵觸憲法精神
  - label: D
    content: 縣市首長認為我國採地方分權制度，命令若牴觸地方條例則無效
  - label: E
    content: 中央與地方政府於訂標準有權限劃分爭議，應由立法院協調解決
