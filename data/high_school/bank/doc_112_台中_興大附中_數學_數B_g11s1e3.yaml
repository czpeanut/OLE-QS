- id: doc_112_台中_興大附中_數學_數B_g11s1e3_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 已知平面上四點 A（x，y），B（3，6），C（6，0），D（3，－2），其中 x、y 皆為整數。若滿足$\vec{BC}$與$\vec{DA}$平行，$\vec{AC}$與$\vec{BD}$垂直，則數對（x，y）＝＿＿＿＿。
  answer:
  - （2，0）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{BC}$＝（3，－6）//（1，－2）

    ∵$\vec{BC}$//$\vec{DA}$ ∴可設$\vec{DA}$＝（t，－2t）

    則 A 點坐標為（3，－2）＋（t，－2t）＝（3＋t，－2－2t）

    又$\vec{AC}$＝（3－t，2＋2t），$\vec{BD}$＝（0，－8）

    ∵$\vec{AC}$⊥$\vec{BD}$

    ∴$\vec{AC}$．$\vec{BD}$＝0 ⇒ 0＋（2＋2t）．（－8）＝0 ⇒ t＝－1

    ∴A 點坐標為（2，0）

    故數對（x，y）＝（2，0）'
