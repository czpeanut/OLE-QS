- id: doc_111_桃園_武陵_數學_數乙_g12s1e3_s1_1
  section: 1
  number: 1
  type: fill
  page: 1
  stem: '試求下列定積分之值：

    (1) $\int_{-1}^{2} (2x-1)^{2}dx$＝＿＿＿＿。

    (2) $\int_{-1}^{3} |x^{2}-4x+3 |dx$＝＿＿＿＿。'
  answer:
  - (1) 9；(2) 8
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $\int_{-1}^{2} (2x-1)^{2}dx$＝$\int_{-1}^{2} (4x^{2}-4x+1)dx$＝$\left. \left( \frac{4}{3}x^{3}-2x^{2}+x \right) \right| _{-1}^{2}$

    ＝$\left( \frac{32}{3}-8+2 \right)$－$\left( -\frac{4}{3}-2-1 \right)$

    ＝$\frac{14}{3}$－$\left( -\frac{13}{3} \right)$＝9

    (2) 若 $x^{2}$－4x＋3 $\geq$ 0 ⇒（x－1）（x－3）$\geq$ 0 ⇒ x $\geq$ 3 或 x $\leq$ 1

    $\int_{-1}^{3} |x^{2}-4x+3 |dx$＝$\int_{-1}^{1} (x^{2}-4x+3)dx$＋$\int_{1}^{3} (-x^{2}+4x-3)dx$

    ＝$\left. \left( \frac{1}{3}x^{3}-2x^{2}+3x \right) \right| _{-1}^{1}$＋$\left. \left( -\frac{1}{3}x^{3}+2x^{2}-3x \right) \right| _{1}^{3}$

    ＝$\left[ \left( \frac{1}{3}-2+3 \right) -\left( -\frac{1}{3}-2-3 \right) \right]$＋〔（－9）＋18－9〕－$\left( -\frac{1}{3}+2-3 \right)$

    ＝$\frac{20}{3}$＋0－$\left( -\frac{4}{3} \right)$＝8'
- id: doc_111_桃園_武陵_數學_數乙_g12s1e3_s1_2
