  stem: 如右圖，點（2，0）為三次函數 y＝f（x）圖形中的反曲點，設 A＝$\int_{-5}^{0} f(x)dx$，B＝$\int_{-5}^{3} f(x)dx$，C＝$\int_{0}^{4} f(x)dx$，D＝$\int_{2}^{3} f(x)dx$， 試比較 A、B、C、D 四數的大小關係為＿＿＿＿。
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_111_桃園_武陵_數學_數乙_g12s1e3/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 459.85
      - 264.0
      - 564.3
      - 348.2
  answer:
  - D＞C＞A＞B
  answer_status: verified
  answer_source: answer_key
  explanation: '設 y＝f（x）的圖形與 x 軸、x＝－5 及 x＝0 所圍成的區域面積為 M

    y＝f（x）的圖形與 x 軸、x＝0 及 x＝2 所圍成的區域面積為 N

    y＝f（x）的圖形與 x 軸、x＝2 及 x＝3 所圍成的區域面積為 P

    y＝f（x）的圖形與 x 軸、x＝3 及 x＝5 所圍成的區域面積為 Q

    則 A＝$\int_{-5}^{0} f(x)dx$＝－M

    B＝$\int_{-5}^{3} f(x)dx$＝－M－N＋P，其中 N＞P

    C＝$\int_{0}^{4} f(x)dx$＝$\int_{0}^{2} f(x)dx$＋$\int_{2}^{4} f(x)dx$＝0

    D＝$\int_{2}^{3} f(x)dx$＝P

    ∴D＞C＞A＞B'
- id: doc_111_桃園_武陵_數學_數乙_g12s1e3_s1_4
  section: 1
  number: 4
  type: fill
  page: 1
  stem: '已知一水族箱內的溫度（攝氏）會隨著時間而改變，且在 0 到 5 小時內是依照函數 f（t）＝$\frac{3}{2}t^{2}$－2t＋1（0 $\leq$ t $\leq$ 5）在改變，試求這段時間內的：

    (1) 平均溫度為攝氏＿＿＿＿度。

    (2) 某時刻 t＝＿＿＿＿時，恰為平均溫度。'
  answer:
  - (1) $\frac{17}{2}$；(2) 3
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 平均溫度為

    $\frac{1}{5-0}\int_{0}^{5} \left( \frac{3}{2}t^{2}-2t+1 \right) dt$＝$\left. \frac{1}{5}\left( \frac{1}{2}t^{3}-t^{2}+t \right) \right| _{0}^{5}$＝$\frac{1}{5}\left( \frac{125}{2}-25+5 \right)$＝$\frac{17}{2}$（度）

    (2) $\frac{3}{2}t^{2}$－2t＋1＝$\frac{17}{2}$ ⇒ $3t^{2}$－4t－15＝0 ⇒（3t＋5）（t－3）＝0

    ⇒ t＝－$\frac{5}{3}$（不合）或 t＝3 ∴t＝3 時，恰為平均溫度'
- id: doc_111_桃園_武陵_數學_數乙_g12s1e3_s1_5
  section: 1
  number: 5
  type: fill
  page: 1
  stem: 如右圖，函數 y＝－$x^{2}$＋6x 與 x 軸所圍成的區域被函數 y＝－$x^{2}$＋kx 的圖形分割成面積相等的 A、B 兩區域，試求 $\int_{0}^{k} x^{2}dx$＝＿＿＿＿。
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_111_桃園_武陵_數學_數乙_g12s1e3/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 476.05
      - 431.65
      - 564.3
      - 540.6
  answer:
  - '36'
  answer_status: verified
  answer_source: answer_key
  explanation: '令 y＝－$x^{2}$＋6x＝0 ⇒－x（x－6）＝0 ⇒ x＝0 或 x＝6

    可知 y＝－$x^{2}$＋6x 的圖形與 x 軸交於（0，0）、（6，0）

    ∵$\int_{0}^{6} (-x^{2}+6x)dx$＝$\left. \left( -\frac{1}{3}x^{3}+3x^{2} \right) \right| _{0}^{6}$＝－72＋108＝36

    ∴A＝B＝$\frac{36}{2}$＝18

    令 y＝－$x^{2}$＋kx＝0 ⇒－x（x－k）＝0 ⇒ x＝0 或 x＝k

    可知 y＝－$x^{2}$＋kx 的圖形與 x 軸交於（0，0）、（k，0）

    A＝18＝$\int_{0}^{k} (-x^{2}+kx)dx$＝$\left. \left( -\frac{1}{3}x^{3}+\frac{k}{2}x^{2} \right) \right| _{0}^{k}$＝－$\frac{1}{3}k^{3}$＋$\frac{1}{2}k^{3}$ ⇒ $k^{3}$＝108

    ∴$\int_{0}^{k} x^{2}dx$＝$\left. \frac{1}{3}x^{3} \right| _{0}^{k}$＝$\frac{1}{3}k^{3}$＝$\frac{1}{3}$×108＝36'
