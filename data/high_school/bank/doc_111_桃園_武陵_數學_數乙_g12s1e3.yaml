  stem: 已知 g'（x）＝$6x^{3}$－4x＋7 且 g(2)＝21，則 g(0)＝＿＿＿＿。
  answer:
  - －9
  answer_status: verified
  answer_source: answer_key
  explanation: '∵g（x）＝$\int (6x^{3}-4x+7)dx$＝$\frac{3}{2}x^{4}$－$2x^{2}$＋7x＋C，其中 C 為常數

    又 g(2)＝$\frac{3}{2}$×16－2×4＋14＋C＝21 ⇒ C＝－9

    ∴g（x）＝$\frac{3}{2}x^{4}$－$2x^{2}$＋7x－9，故 g(0)＝－9'
- id: doc_111_桃園_武陵_數學_數乙_g12s1e3_s1_3
