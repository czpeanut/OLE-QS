- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e2_s2_26
  section: 2
  number: 26
  type: multiple
  page: 4
  stem: 關於氣體的通性，下列敘述哪些正確？（應選 2 項）
  options:
  - label: A
    content: 固定質量的同一物質之三態的體積皆符合：固體＜液體＜氣體
  - label: B
    content: 氣體的體積主要由粒子決定，粒子愈大，氣體體積愈大
  - label: C
    content: 氣體沒有固定的形狀與體積，具有可壓縮性及擴散性
  - label: D
    content: 溫度升高時，氣體粒子的動能仍不變
  - label: E
    content: 互不反應之氣體，可以任意比例均勻混合
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)多數物質符合，但有特例。例如：水的體積：液態水＜固態冰＜氣態水蒸氣。

    (B)氣體的體積是粒子的運動空間，粒子本身的體積很小，幾乎可以忽略不計。

    (D)溫度升高時，氣體粒子的動能也增大。'
