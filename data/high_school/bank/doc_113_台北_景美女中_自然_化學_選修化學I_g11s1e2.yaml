  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知冷氣團的中心氣壓為 1033 百帕，下列敘述何者正確？
  options:
  - label: A
    content: 1 百帕＝100 公斤重∕平方公尺
  - label: B
    content: 此冷氣團的中心氣壓大於 1 大氣壓
  - label: C
    content: 此冷氣團的中心氣壓相當於 760 mmHg
  - label: D
    content: 1 百帕＝100 毫巴
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 1 百帕（hPa）＝100 牛頓∕平方公尺（N/$m^{2}$）。

    (B)(C) 1 atm＝76 cmHg＝760 mmHg＝760 torr

    ⇒ 76（cm）×13.6（gw/$cm^{3}$）＝1033.6（gw/$cm^{2}$）＝1.013×$10^{5}$ 帕（Pa）＝1013 百帕 （hPa）。

    故此冷氣團的中心氣壓為 1033 hPa，大於 1 atm（760 mmHg，1013 hPa）。

    【註】1033.6（gw/$cm^{2}$）×$\frac{10^{4}}{1}$（$cm^{2}$/$m^{2}$）×$\frac{1}{10^{3}}$（kgw/gw）×$\frac{9.8}{1}$（N/kgw）

    ＝1.013×$10^{5}$（N/$m^{2}$）＝1.013×$10^{5}$（Pa）＝1013（hPa）

    (D)氣象學使用「巴（bar）」或「毫巴（mbar）」作為氣壓的單位。

    1 bar＝$10^{5}$ N/$m^{2}$＝$10^{5}$ Pa，1 mbar＝$10^{－3}$ bar＝$10^{2}$ Pa，即 1 毫巴＝1 百帕。'
