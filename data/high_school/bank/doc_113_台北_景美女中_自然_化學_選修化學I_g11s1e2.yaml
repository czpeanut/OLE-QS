    content: 定壓，定量氣體溫度每上升 1 ℃，體積增加 0 ℃ 時體積之 $\frac{1}{300}$
  - label: B
    content: 定壓，定量氣體之體積與溫度成反比
  - label: C
    content: 定壓，定量氣體溫度由 27 ℃ 上升到 28 ℃ 時，體積增加 27 ℃ 時體積之 $\frac{1}{300}$
  - label: D
    content: 定壓，定量氣體溫度由 27 ℃ 上升到 28 ℃，體積逸出率為 $\frac{1}{300}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)根據查理定律 $V_{t}$＝$V_{0}$（1＋$\frac{t}{273}$），定壓、定量氣體溫度每上升 1 ℃，體積增加 0 ℃ 時體積之$\frac{1}{273}$。

    (B)體積與絕對溫度成正比。

    (C)溫度由 27 ℃ 升至 28 ℃ 時，其體積增加 27 ℃ 時體積的$\frac{28-27}{27+273}$＝$\frac{1}{300}$。

    (D)溫度由 27 ℃ 升至 28 ℃ 時，其體積逸出率為$\frac{28-27}{28+273}$＝$\frac{1}{301}$。'
