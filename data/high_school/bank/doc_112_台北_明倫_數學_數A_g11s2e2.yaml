- id: doc_112_台北_明倫_數學_數A_g11s2e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 某高二學生阿倫班上第一次期中考成績，經過統計後得知全班有 40 ％的學生數學不及格，有 30 ％的學生英文不及格，有 20 ％的學生數學、英文都不及格，則下列各敘述中，哪些是正確的？
  options:
  - label: A
    content: 若阿倫同學英文不及格，則他數學不及格的機率為$\frac{2}{3}$
  - label: B
    content: 若阿倫同學英文及格，則他數學也及格的機率為$\frac{5}{7}$
  - label: C
    content: 若阿倫同學數學不及格，則他英文不及格的機率為$\frac{1}{2}$
  - label: D
    content: 若阿倫同學數學及格，則他英文也及格的機率大於$\frac{5}{6}$
  - label: E
    content: 全班同學中，數學、英文至少有一科不及格的機率為$\frac{1}{2}$
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '令 A 為數學不及格之集合

    B 為英文不及格之集合

    則 P(A)＝0.4，P(B)＝0.3，P（A∩B）＝0.2

    (A) ○：P（A∣B）＝$\frac{P (A \cap B)}{P (B)}$＝$\frac{0.2}{0.3}$＝$\frac{2}{3}$

    (B) ○：P（A''∣B''）＝$\frac{P (A'' \cap B'')}{P (B'')}$＝$\frac{1-P (A \cup B)}{1-P (B)}$＝$\frac{1-P (A) -P (B) +P (A \cap B)}{1-P (B)}$

    ＝$\frac{1 - 0.4 - 0.3 + 0.2}{1 - 0.3}$＝$\frac{5}{7}$

    (C) ○：P（B∣A）＝$\frac{P (B \cap A)}{P (A)}$＝$\frac{0.2}{0.4}$＝$\frac{1}{2}$

    (D) ╳：P（B''∣A''）＝$\frac{P (A'' \cap B'')}{P (A'')}$＝$\frac{0.5}{1 - 0.4}$＝$\frac{5}{6}$

    (E) ○：P（A∪B）＝P(A)＋P(B)－P（A∩B）＝0.5＝$\frac{1}{2}$

    故選(A)(B)(C)(E)'
