- id: doc_112_台北_明倫_數學_數A_g11s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 設 A 與 B 為獨立事件，則下列哪些選項恆正確？
  options:
  - label: A
    content: P（B∣A）≠P（A∣B）
  - label: B
    content: P（A∣B）＝P(A)
  - label: C
    content: P（A∪B）＝P(A)＋P(B)
  - label: D
    content: P（A∩B）＝P(A)P(B)
  - label: E
    content: P（A'∪B'）＝1－P(A)P(B)
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：P（B∣A）＝P(B)，P（A∣B）＝P(A)

    但 P(A)和 P(B)的值可能相同

    (B) ○：∵A，B 為獨立事件 ∴P（A∣B）＝P(A)

    (C) ╳：P（A∪B）＝P(A)＋P(B)－P（A∩B）

    ＝P(A)＋P(B)－P(A)P(B)

    ≠P(A)＋P(B)

    (D) ○：∵P（A∣B）＝P(A)

    ∴$\frac{P (A \cap B)}{P (B)}$＝P(A)⇒ P（A∩B）＝P(A)P(B)

    (E) ○：P（A''∪B''）＝P（（A∩B）''）＝1－P（A∩B）

    ＝1－P(A)P(B)

    故選(B)(D)(E)'
