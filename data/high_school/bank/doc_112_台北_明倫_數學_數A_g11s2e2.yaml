- id: doc_112_台北_明倫_數學_數A_g11s2e2_s1_4
  section: 1
  number: 4
  type: multiple
  page: 2
  stem: 數學題目，甲、乙能解出之機率各為$\frac{2}{3}$、$\frac{1}{4}$，若甲、乙同解一數學問題且互不影響，則下列選項正確的有哪些？
  options:
  - label: A
    content: 甲、乙兩人都解出之機率為$\frac{1}{6}$
  - label: B
    content: 恰一人解出之機率為$\frac{7}{12}$
  - label: C
    content: 兩人都解不出之機率為$\frac{1}{3}$
  - label: D
    content: 此題被解出之機率為$\frac{3}{4}$
  - label: E
    content: 若恰一人解出，則由甲解出的機率為$\frac{6}{7}$
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵甲、乙為獨立事件 ∴P（甲∩乙）＝P(甲)P(乙)＝$\frac{2}{3}\times \frac{1}{4}$＝$\frac{1}{6}$

    (B) ○：P（甲∩乙''）＋P（甲''∩乙）＝P(甲)P（乙''）＋P（甲''）P(乙)

    ＝$\frac{2}{3}\times \frac{3}{4}+\frac{1}{3}\times \frac{1}{4}$＝$\frac{7}{12}$

    (C) ╳：P（甲''∩乙''）＝P（甲''）P（乙''）＝$\frac{1}{3}\times \frac{3}{4}$＝$\frac{1}{4}$

    (D) ○：由選項(C)可知，1－P（甲''∩乙''）＝1－$\frac{1}{4}$＝$\frac{3}{4}$

    (E) ○：由選項(B)可知，所求為$\frac{\frac{2}{3}\times \frac{3}{4}}{\frac{7}{12}}$＝$\frac{6}{7}$

    故選(A)(B)(D)(E)'
