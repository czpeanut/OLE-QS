- id: doc_112_台北_明倫_數學_數A_g11s2e2_s1_5
  section: 1
  number: 5
  type: multiple
  page: 2
  stem: A 袋中有 4 個紅球，4 個白球，B 袋中有 3 個紅球，2 個白球；今從 A 袋中任取一球，令其為 X；然後將 X 放入 B 袋，再從 B 袋中取出 1 球，令其為 Y，則下列哪些選項正確？
  options:
  - label: A
    content: P（X 為紅球）＝$\frac{1}{2}$
  - label: B
    content: P（Y 為紅球∣X 為紅球）＝$\frac{4}{5}$
  - label: C
    content: P（Y 為紅球∣X 為白球）＝$\frac{1}{2}$
  - label: D
    content: P（Y 為紅球）＝$\frac{1}{2}$
  - label: E
    content: P（X 為紅球∣Y 為紅球）＝$\frac{3}{7}$
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：P（X 為紅球）＝$\frac{4}{8}$＝$\frac{1}{2}$

    (B) ╳：P（Y 為紅球∣X 為紅球）＝P（4 紅 2 白抽中紅球）＝$\frac{4}{6}$＝$\frac{2}{3}$

    (C) ○：P（Y 為紅球∣X 為白球）＝P（3 紅 3 白抽中紅球）＝$\frac{3}{6}$＝$\frac{1}{2}$ (D) ╳：由選項(B)(C)可知

    P（Y 為紅球）＝$P (X 紅 \cap Y 紅)+P (X 白 \cap Y 紅)$

    ＝$P (X 紅)P (Y 紅 | X 紅)+P (X 白)P (Y 紅 | X 白)$

    ＝$\frac{1}{2}$×$\frac{2}{3}$＋$\frac{1}{2}$×$\frac{1}{2}$＝$\frac{7}{12}$

    (E) ╳：由選項(D)可知，P（X 為紅球∣Y 為紅球）＝$\frac{P (X 紅 \cap Y 紅)}{P (Y 紅)}$＝$\frac{\frac{1}{2}\times \frac{2}{3}}{\frac{7}{12}}$＝$\frac{4}{7}$

    故選(A)(C)'
