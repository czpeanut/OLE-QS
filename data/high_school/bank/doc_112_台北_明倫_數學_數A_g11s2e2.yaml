- id: doc_112_台北_明倫_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列各條件中，哪些恰可決定唯一的一個平面？
  options:
  - label: A
    content: 點 A（5，－3，1）與直線 L：$\frac{x -2}{3}$＝$\frac{y +1}{-2}$＝2z－3
  - label: B
    content: 三點相異 A（2，1，5），B（3，4，3），C（4，7，1）
  - label: C
    content: $L_{1}$：$\frac{x -1}{2}$＝$\frac{y +2}{4}$＝$\frac{z -3}{3}$與 $L_{2}$：$\frac{x -1}{2}$＝$\frac{2y +4}{4}$＝$\frac{z -3}{3}$
  - label: D
    content: $L_{1}$：$\frac{x -2}{3}$＝$\frac{y +1}{2}$＝$\frac{z -1}{1}$與 $L_{2}$：$\frac{x -8}{3}$＝$\frac{y -3}{2}$＝$\frac{z -3}{1}$
  - label: E
    content: L：$\begin{cases}2x +y =3 \\ z =1\end{cases}$與 x 軸
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：點 A 代入 L：$\frac{3}{3}$＝$\frac{-2}{-2}$≠－1

    ⇒ 點 A 不在 L 上，故恰可決定唯一平面

    (B) ╳：$\vec{AB}$＝（1，3，－2）＝$\vec{BC}$⇒ A，B，C 三點共線

    (C) ○：$L_{2}$：$\frac{x - 1}{2}$＝$\frac{y + 2}{2}$＝$\frac{z - 3}{3}$

    ⇒$\vec{v_{2}}$＝（2，2，3）

    ⇒$\vec{v_{2}}$和$\vec{v_{1}}$＝（2，4，3）不平行

    又（1，－2，3）在 $L_{1}$ 上也在 $L_{2}$ 上

    ⇒ $L_{1}$，$L_{2}$ 交於一點（1，－2，3）

    ⇒ 恰可決定唯一平面

    (D) ╳：（2，－1，1）為 $L_{1}$ 上的點代入 $L_{2}$：$\frac{-6}{3}$＝$\frac{-4}{2}$＝$\frac{-2}{1}$

    ⇒（2，－1，1）亦為 $L_{2}$ 上一點

    又$\vec{v_{1}}$//$\vec{v_{2}}$⇒ $L_{1}$，$L_{2}$ 重合

    (E) ╳：L 之方向向量$\vec{v_{L}}$//（2，1，0）×（0，0，1）＝$\left( \left| \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right| , \left| \begin{matrix}0 & 2 \\ 1 & 0\end{matrix} \right| , \left| \begin{matrix}2 & 1 \\ 0 & 0\end{matrix} \right| \right)$

    ＝（1，－2，0）

    和 x 軸不平行，且 x 軸上任一點（a，0，0）明顯不為 L 上一點（∵z≠1）

    ⇒ 此兩線歪斜

    故選(A)(C)'
