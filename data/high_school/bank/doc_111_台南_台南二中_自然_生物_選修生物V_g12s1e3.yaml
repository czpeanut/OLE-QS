  stem: <u>臺灣</u>春季常見的螢火蟲有黑翅螢、大端黑螢、梭德氏脈翅螢及黃緣螢。黑翅螢（Luciola cerata）前胸背板橙黃色，觸角絲狀，前翅黑色。主要生長於海拔1，500公尺以下山區，發黃綠色光，是臺灣螢火蟲中數量最多；而大端黑螢（Luciola
    anceyi）體色為橙黃色，前翅末端為黑色，觸角絲狀。主要分布於海拔2,000公尺以下山區，是相當常見的種類，雄蟲發橙黃色光。黃緣螢（Luciola fictar）前胸背板橙黃色，觸角絲狀，前翅黑色，沿翅緣有黃色細紋為其最大特徵。分布於全<u>臺</u>平地至低海拔山區的水域中，發黃色光；而梭德氏脈翅螢（Cutos
    sauteri）個體間體長差異大，前胸背板橙黃色，背版中央有明顯黑色紋，觸角絲狀，前翅黑色，翅側緣處有摺狀彎曲。主要分布於<u>臺灣</u>低海拔山區之森林，發綠色光，光持續，閃爍時間較遲，因此所產生的發光景觀相當特別。下列有關此四種<u>臺灣</u>春季常見的螢火蟲的敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 梭德氏脈翅螢與另外三種螢火蟲在分類上距離最遠
  - label: B
    content: 這四種螢火蟲在形態上不易區別，從型態種概念而言為同種
  - label: C
    content: 這四種螢火蟲在行為上具有隔離
  - label: D
    content: 黑翅螢活動的範圍應屬闊葉林
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台南_台南二中_自然_生物_選修生物V_g12s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 4
  stem: 現代海洋藥物的發展以科學家博格曼和飛聶為先驅，其於1950 年代曾對<u>加勒比海</u>海綿（Tectitethyacrypta）進行研究，發現「海綿尿核苷（spongouridine）」及「海綿胸苷（spongotimidine）」兩種阿拉伯糖苷類化合物。科學家在研究這兩種化合物的生物活性時發現，生物系統會將其識別為核苷酸，進而影響DNA複製；因此化學家以化合物為模版，將其結構加以修飾，合成抗腫瘤及抗病毒藥物，如用於治療白血病的抗癌藥物阿糖包苷（cytarabine），其主要功能為抑制DNA聚合酶，並使細胞停滯在細胞週期中的DNA合成期；而阿糖腺苷（vidarabine）則為治療單純皰疹和帶狀皰疹病毒感染的抗病毒用藥。下列何者正確？
  options:
  - label: A
    content: 海綿是常見的海洋植物，主要分布於潮間帶
  - label: B
    content: 大多數海綿是異營性生物，但部分海綿可以透過共生的藍綠菌行光合作用來提供能量，此共生狀態類似豆科植物與根瘤菌的關係
  - label: C
    content: 海洋生態系的優點為取之不絕的大量資源，即使汙染亦可快速自然恢復
  - label: D
    content: 海綿在海流強的水域，高度普遍不到2.5 mm，且表面形成許多流線型的紋路，此為擬態行為
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台南_台南二中_自然_生物_選修生物V_g12s1e3_s1_50
  section: 1
  number: 50
  type: single
  page: 4
  stem: 物種的形成過程中，當出現生殖隔離時，往往意味著原本親緣關係非常接近的生物已不能在自然狀態下互相交配。下列有關生殖隔離的敘述，何者正確？
  options:
  - label: A
    content: 受精卵無法發育是一種前合子屏障的生殖隔離
  - label: B
    content: 不同物種求偶儀式不同，是一種合子前的機械隔離
  - label: C
    content: 不同種類的生物其配子即便相遇亦無法完成受精，為配子隔離
  - label: D
    content: 生殖隔離通常出現在地理隔離之前
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
