  stem: 某位因食安問題入獄的食品公司董事長報請假釋，被法務部以《辦理假釋應行注意事項》中的「社會觀感不佳」為由駁回。但在《刑法》的假釋規定是：「受徒刑之執行而有悛悔實據者，無期徒刑逾25年，有期徒刑逾1/2、累犯逾2/3，由監獄報請法務部，得許假釋出獄。」故有學者指出，我國假釋准駁與否卻沒有一定的標準，常常受到社會輿論所影響。《刑法》規定的假釋條件原則上就是：受徒形之執行、執行一定期間徒刑刑期、有悛悔實據等三項而已，可是法務部用行政命令位階的《辦理假釋應行注意事項》增加了《刑法》原本沒有的假釋條件，這很明顯是違反行政法的相關原則，在法律體系上不應該有這樣的情形。關於上述事件的分析，下列何者正確？
  options:
  - label: A
    content: 政府對食安問題通常採取直接管制的手段，本來就不應假釋獲准
  - label: B
    content: 該注意事項增加了《刑法》所沒有的限制，違反了法律保留原則
  - label: C
    content: 法務部的注意事項因為有維護社會公益的目的，沒有侵害人權的疑慮
  - label: D
    content: 《刑法》的假釋規定違反法律優位，但用注意事項補充有違平等原則
