questions:
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 1970年代，美國爆發水門案，總統尼克森遭到媒體爆料涉嫌在民主黨全國委員會總部的水門大廈裝設竊聽器，最後黯然請辭下臺。請問下列敘述中，何者所負擔的責任與尼克森相同？
  options:
  - label: A
    content: 地方政府工程處處長圖利廠商接受司法調查
  - label: B
    content: 行政院長為南方澳大橋倒塌事件道歉
  - label: C
    content: 警察用警棍毆傷集會民眾，因執法過當遭法官判刑
  - label: D
    content: 地方首長收受廠商賄賂而遭判決確定
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 請問下列關於行政訴訟程序的敘述，何者正確？
  options:
  - label: A
    content: 現行的行政訴訟程序為三級三審制
  - label: B
    content: 行政審判法庭分為地方法院行政訴訟庭、高等行政法院、最高行政法院
  - label: C
    content: 交通裁决案件須先訴願才能提起行政訴訟
  - label: D
    content: 為保障人民權益，任何時候都能提出訴願或行政訴訟
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某國為了維護網路資訊安全，通過法令讓政府可以在必要時取得人民存取在網路上的個人資料。蔚萊與同學們討論這樣的規定是否可行，請問誰的說法合乎我國對政府限制基本權利時，應遵守的原則？
  options:
  - label: A
    content: 蔚萊：限制基本權最重要的就法律保留原則，因此有法律依據就可以了
  - label: B
    content: 亞均：法令若只規定「必要時」卻沒說明哪種情形必要，會違反明確性原則
  - label: C
    content: 小銘：如果每個人的個資都受到政府控管，符合平等原則，就可以限制權利
  - label: D
    content: 航航：維護網路資訊安全跟是否取得個人資料無關，不符合正當程序原則
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 2020年因為新冠肺炎疫情影響，登山等國内旅遊活動發展興盛，但也引發不少問題。例如日前林務局阿里山林業鐵路及文化資產管理處的公務員在巡山過程中，發現有83名民眾沿著鐵路行走，雖未造成事故，但仍相當危險。依據鐵路法規定，行人不得在鐵路營運路段、橋梁、隧道內通行，違反者可處罰新台幣1萬至5萬元。最後只對民眾開立勸導單警告勿再違法。請問關於本事件的敘述，何者推論較為合適？
  options:
  - label: A
    content: 林務局的公務員未依法對民眾開罰，違反依法行政原則
  - label: B
    content: 林務局的公務員僅對民眾開勸導單，是行使行政裁量權
  - label: C
    content: 民眾行走在鐵路上會造成危險，不開罰將違反比例原則
  - label: D
    content: 人民信賴鐵路是交通道路，若開罰會違反信賴保護原則
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 《警察職權行使法》規定，警察在行使職權時應著制服或出示證件表明身分，並應告知當事人事由。若是人民認為警察行使職權不符合法律，可以當場提出異議，並要求警察做成異議紀錄。以正當程序原則的觀點來看，以下敘述何者正確？
  options:
  - label: A
    content: 著制服或出示證件讓人民知道執法者是合法的，此為公正原則的要求
  - label: B
    content: 人民對警察行使職權時的爭議作為提出異議，是民主原則的表現
  - label: C
    content: 警察依當事人要求做出異議紀錄，是公正執法的表現，符合公正原則
  - label: D
    content: 告知人民事由，讓人民充分知道當下的情況，是民主原則的展現
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 現今的民主國家經常使用「公投」的手段，達成民主的目的。當國家在制定或執行政策時，如果有無法決定或具有爭議的情況，公投使國民發揮創制及複決權利，並讓人民在決定的過程中，可以有機會公開的討論，發表自己的看法，言論自由可以充分的發揮。請問，根據上述的內容，我們看到基本權利運作時的哪一個特性？
  options:
  - label: A
    content: 充分檢視比例原則
  - label: B
    content: 權利之間彼此作用
  - label: C
    content: 增加政府權力運作
  - label: D
    content: 基本權利遵守底線
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 為了改善違章工廠占據農地，造成汙染等危害，立法院修正「工廠管理輔導法」以解決汙染工廠的問題。經濟部也做出農地違章工廠報告，不過當環保團體請求提供時，卻以資料準確度為由而拒絕。經濟部可能違反了何種正當程序原則？
  options:
  - label: A
    content: 民主原則
  - label: B
    content: 公開原則
  - label: C
    content: 公正原則
  - label: D
    content: 迴避原則
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 我國中央民意代表在立法院進行質詢時，要求政府應不只班班有冷氣，更能推動「生生有平板」。因為在新冠疫情期間，許多地區都緊急抽調平板提供給學生，產生嚴重的數位落差。行政院長表示，目前的平板發放方式是以弱勢家庭優先，未來的確有朝著民意代表所言的方向進行，但跟裝設冷氣一樣，屬於跨部會議題，相關準備工作要很仔細，經費非常龐大。以平等權落實的思維來看，「生生有平板」是屬於哪一種平等權的概念？
  options:
  - label: A
    content: 實質平等
  - label: B
    content: 形式平等
  - label: C
    content: 形式的差別待遇
  - label: D
    content: 合理的差別待遇
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 臺北市進出口商業公會已舉辦53年的「年度冬令慈善贈捐活動」，募集食品、生活物品及現金捐贈，讓老人、孩童、身心障礙等機構及收容單位冬天充滿溫暖，善盡企業社會責任，回饋社會。此公會成立於1947年，會員超過6,200多家貿易廠商，其中經營製造業近1,300家，從事進口業者約3,500家，是臺灣貿易界的最大組成單位，也是臺灣最具規模的商業團體之一。公會主要功能為凝聚業界共識，積極協助業者開拓全球市場商機。請問上述内容可以看到結社的哪一個重要性？
  options:
  - label: A
    content: 使個人興趣專長得到發揮
  - label: B
    content: 加強人與人間的地緣關係
  - label: C
    content: 可支撐與補強社會的運作
  - label: D
    content: 結合少數人力量整合資源
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 近日接連發生民眾行車途中，同一違規事項在短短的距離中被開多張罰單。例如新竹一名男子開車在高速公路，被後方民眾拍到變換車道沒打方向燈，在5百公尺距離內、短短17秒被連開3張罰單，不但被罰9千元還被記違規點數3點，該名男子不服警方密集開單而提起行政訴訟。法官根據法規認定連續開單，需相距超過6公里、時間超過6分鐘或經過一個路口，最後判決撤銷王姓男子後2張罰單。請問，法官撤銷罰單的理由應是「該行政行為不符合」下列哪一種原則？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 平等原則
  - label: C
    content: 明確性原則
  - label: D
    content: 正當程序原則
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某市政府擬將該市的老舊房屋進行都市更新計畫，規劃作為商業區供企業開發，不過規劃將發給居民的補償金過低，引起居民不滿，在市政府前的廣場發起抗爭運動。關於人民監督政府行使權力的方法，下列敘何者正確？
  options:
  - label: A
    content: 此案例中，因居民僅為自身補償金抗議，並非基於公益事項，故不受到《憲法》集會結社自由權利的保障
  - label: B
    content: 都市更新雖涉及土地利用重大變更，影響人民權益，但已依法給予補償，則無需使居民參與決策過程
  - label: C
    content: 若居民因此對市政府施政不滿、於之後的選舉中改投其他人，也是使執政者承擔政治責任的方法之一
  - label: D
    content: 居民應先窮盡司法體制內的救濟途徑，若直接發動集會遊行，將有違憲法保障人民集會自由之意旨
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 2017年立法院三讀通過《政黨法》，取代《人民團體法》中關於政黨的規定。為兼顧保障人民結社自由，同時維護政黨與民主政治。《政黨法》中對政黨設立多項限制，以下四位同學對政黨法中的限制及其限制目的的發言，你覺得何者最為合理？
  options:
  - label: A
    content: 甲：政黨負責人不可曾犯下組織犯罪行為，此規定是排除黑道立黨，不會有限制更生人結社權的疑慮
  - label: B
    content: 乙：政黨名稱不得有歧視仇恨字眼，是為維護社會的善良風俗，不會有限制結社權和言論自由的疑慮
  - label: C
    content: 丙：政黨不可在學校內設置黨團組織，此規定雖限制政黨的結社自由，但目的是為了避免年輕人參政
  - label: D
    content: 丁：政黨未申報財務狀況將處以罰鍰，此規定雖對政黨課予義務，但其目的是為了促進政黨公開透明
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 我國日前發生多起民眾手持鋁製棒球棒毆人事件，造成社會惶恐且有仿效的延續效應。故有政府官員建議，未來攔檢車輛時，只要發現放有球棒等危險物品都要註記在警用行動電腦，作為未來院檢偵查及審判的參考。但此建議引發基層員警的反彈，法界人士也認為應該有對人民隱私侵害更小的方式可以解決，只要有放球棒就註記恐違反「比例原則」。請問，法界人士的想法代表他認為這項政策可能違反「比例原則」下的哪一個子原則？
  options:
  - label: A
    content: 適當性原則
  - label: B
    content: 必要性原則
  - label: C
    content: 衡量性原則
  - label: D
    content: 目的性原則
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 我國一名男子，把110報案專線當個人熱線撥打，在5個月內連續打了63通報案電話，內容從看到飛碟、小孩要生幾個，到能不能養狗，一連串無厘頭問題。警方不堪其擾，只好函送地檢署處理，最後男子被依照違反《社會秩序維護法》，裁罰3,000元。男子相當不服氣，認為110專線本來就是用來解決民眾緊急問題，進行救濟時法官卻認為裁罰有理。請問依據《憲法》的規範，法官認為裁罰有理的原因是？
  options:
  - label: A
    content: 警方的作為有可能違反比例原則
  - label: B
    content: 法官須具體化概括基本權的意涵
  - label: C
    content: 個人權利皆有界限應受國家限制
  - label: D
    content: 民眾行事必須符合法律保留原則
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 為維持社會治安，我國於民國44年時發布《檢肅流氓條例》，然而此條例卻陸續遭大法官三度宣告違憲，其中第二條規定：「品行惡劣或遊蕩無賴，有事實足認為有破壞社會秩序或危害他人生命、身體、自由、財產之習慣者，稱流氓。」大法官認為此法條內容均屬對個人社會危險性之描述，其所表示之行為類型過於空泛，非一般人民依其日常生活及語言經驗所能預見，亦非司法審查所能確認，與憲法意旨不符，違反「甲」原則，最後立法院決議於2009年廢除此條例。請問「甲」應填入何者？
  options:
  - label: A
    content: 明確性原則
  - label: B
    content: 誠實信用原則
  - label: C
    content: 比例原則
  - label: D
    content: 依法行政原則
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 我國從民主化以來，民眾罷免權的行使相對選舉權薄弱許多，罷免制度也曾經被批評門檻規範過高，根本無法實踐。在立法院修法降低罷免門檻後，有位地方首長，因為違背選舉時所提出的競選承諾，而成為我國第一位被成功罷免的民選首長。請問關於上述事件的相關敘述何者較為適切？
  options:
  - label: A
    content: 官員勾結建商所負責任與民選首長違背選舉承諾的責任類型相似
  - label: B
    content: 地方首長所負責任與行政院長回答立法院質詢所負責任類型相似
  - label: C
    content: 罷免門檻愈低愈利於促使首長承擔政治責任，並體現民主正當性
  - label: D
    content: 地方議會代表民意，表決罷免首長，體現立法權對行政權的監督
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 我國政府在第三級疫情警戒期間發布公告，縮短製造業、批發業、綜合商品零售業、倉儲業等4行業輪班間隔，由11小時改為8小時，勞工團體「工鬥」急赴疾管署，批評勞動部是逼勞工在「染疫病倒」和「過勞累倒」之間做選擇，呼籲政府保障勞工的生命健康安全，因為「勞工的命也是命」，痛批勞動部本應保護勞工，卻已變成勞工的加害者。以「憲政主義」分析上述事件，下列何者正確？
  options:
  - label: A
    content: 「工鬥」的作為充分展現集會支撐社會的力量
  - label: B
    content: 政府發布行政公告為《憲法》賦予的行政自由權利
  - label: C
    content: 勞動部對此錯誤的決定可能必須負起法律責任
  - label: D
    content: 勞工的生命健康安全涉及《憲法》所保障的生存權
- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 澳洲總理莫里森表示，日後將立法要求各大社群網站（如FB、Twitter等），如果不撤下平臺上的詆毀、霸凌言論，政府將進一步要求平臺提供留言者的用戶相關資訊。莫里森表示，網路世界不該放任惡霸、酸民橫行、恣意傷害他人，將網路世界變成一處「蠻荒之地」，強調這樣的行為在現實世界中不被允許，在數位世界裡也無法被容忍。故他認為平臺創立空間也必須確保其中的安全「如果它們無法做到的話，將透過法律來達成」。請問政府可立法要求平臺公布個人資訊侵犯個人隱私，主要是立基於下列哪一個理由？
