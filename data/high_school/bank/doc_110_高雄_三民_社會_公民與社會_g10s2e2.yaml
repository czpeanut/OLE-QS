  stem: 小維某日在同學筆記上看到一則新聞摘要：「某車輛駕駛在某日下午5時的2分鐘內三度變換車道，均未依法使用方向燈，市府交通局依《道路交通管理處罰條例》開出3張裁決書，對該駕駛裁罰共計9,000元。駕駛不服提起訴訟，地院法官認為，雖每次變換車道可各構成一次違規行為，可連續舉發，但若間隔過密，裁處1次就能達成行政目的，多次處罰有所過當。」不過，筆記上並沒有記載這則新聞的標題，請從摘要判斷以下哪個新聞標題與此案件最相符？
