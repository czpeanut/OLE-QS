- id: doc_110_高雄_三民_社會_公民與社會_g10s2e2_s3_1
  section: 3
  number: 1
  type: calc
  page: 5
  stem: 甲案涉及一位前NCC委員推薦姐夫擔任駕駛；乙案是嘉義縣梅山鄉公所課長的配偶擔任臨時人員，身為主管的先生幫太太打了考績；丙案則是壹南市文化資產管理處組長要求承辦人員錄取岳父擔任工讀生。這三位公務員都因為違反《公職人員利益衝突迴避法》，處罰的依據不盡相同，但依法都可以裁罰100萬元上、500萬元罰以下罰鍰。主管機關監察院也就分別罰了3位公務員當時規定的最低罰鍰100萬元，承辦的行政法院合議庭認為這樣的處罰違反比例原則，裁定停止審判，向大法官聲請憲法解釋。 據此，大法官作出第786號解釋：「中華民國89年7月12日制定公布之《公職人員利益衝突迴避法》第14條前段規定：『違反第7條……規定者，處新臺幣100萬元以上500萬元以下罰鍰』同法第16條規定：『違反第10條第１項規定者，處新臺幣100萬元以上500萬元以下罰鍰。惟立法者未衡酌違規情節輕微之情形，一律處以100萬元以上之罰鍰，可能造成個案處罰顯然過苛而有情輕法重之情形，不符責罰相當原則，於此範圍內，牴觸《憲法》第23條比例原則，與《憲法》第15條保障人民財產權之意旨有違，應自本解釋公布之日起，不予適用。又本解釋聲請案之原因案件，及適用上開規定處罰，於本解釋公布之日尚在行政救濟程序中之其他案件，法院及相關機關應依本解釋意旨及107年6月13日修正公布之《公職人員利益衝突迴避法》規定辦理。」 （資料來源：786號解釋：利益衝突迴避法的罰鍰底線，有沒有太嚴苛，一起讀判決，2019/12/15。） 請問：依資料内容，釋字786號，大法官基於何項憲法原則認為《公職人員利益衝突迴避法》侵害人民財產權而違憲？（2分）根據你寫出的原則，試述說明大法官的理由為何？（3分）
