  stem: 新冠肺炎疫情爆發，造成人們生活習慣的巨大改變，出門要配戴口罩、回家要洗手、物品要用酒精消毒，疫情嚴重的國家，甚至需要實施「禁足」。世界各國幾乎都受到這波疫情的影響，美國也不例外。美國在年中已超過中國，成為疫情最為嚴重的國家，各州政府也相繼規範民眾的出入，並要求在公共空間戴口罩。不過美國部分民眾卻有不同的想法；他們認為強迫戴口罩侵犯到他們的權利，是一項惡法；許多美國人為此走上街頭抗議，甚至連美國總統川普在公開場合都不太願意戴口罩。美國人之所以這麼排斥口罩政策，有觀察者提出幾個可能的原因： 一、美國人崇尚自由，他們認為政府不該過度介入民眾的生活。 二、美國將生病歸咎於個人管理不當，所以看到人戴口罩會認為他缺乏自主管理，而非是想防止病毒擴散。 三、恐怖攻擊的影響，美國民眾對於伊斯蘭、穆斯林的蒙面習俗產生反感。 綜上所述，美國政府防疫政策的推動上，遇到不小的挑戰。美國各州政府除了訂定相關法律規範，仍須加強內在的社會控制，才能改變人們對戴口罩的偏見，自發地配合。 請問：上文中美國人所捍衛的權利為何種權利？（2分）另外，若要在我國實施口罩禁令，政府應遵循《憲法》第23條所規定的哪三個基本要求？（6分）
