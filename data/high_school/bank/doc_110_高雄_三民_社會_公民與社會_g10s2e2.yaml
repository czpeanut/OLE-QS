  stem: 我國一名未成年少女遭三名少年散布私密照，該名少女的家長對三名少年提起妨害風化告訴，法院裁定其中2名少年訓誡，另1人不付審理確定。家長認為，法官沒有傳喚他的女兒出庭陳述受害經過，才會處罰這麼輕，在全案定讞後聲請釋憲。大法官認為，《少年事件處理法》第36條：「審理期日訊問少年時，應予少年之法定代理人或現在保護少年之人及輔佐人陳述意見之機會。」及其他少年保護事件之相關條文，整體觀察，均未明文規範被害人（及其法定代理人）於少年保護事件處理程序中得到庭陳述意見，有違《憲法》保障人民權利之意旨，有關機關應妥適修正《少年事件處理法》。 請問：大法官對於被害人（及其法定代理人）於少年保護事件處理程序中未能到庭陳述意見的法律規定宣告違憲，是因為該規定違反哪一種原則？（請在答案卡的表格中勾選一項，2分）並簡述原因。(3分)
