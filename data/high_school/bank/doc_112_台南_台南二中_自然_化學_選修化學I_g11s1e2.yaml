  explanation: 由圖可得知，氣體壓力＝30 cmHg，若改至開口壓力計測量，開口端的壓力為外界大氣壓（76 cmHg），此時氣體端的水銀柱＝76－30＝46 cm。故選(B)。
- id: doc_112_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 常溫、常壓下，下列哪些同體積的各組物質具有相同的分子數？
  options:
  - label: A
    content: 金、銅
  - label: B
    content: 水、冰
  - label: C
    content: 氫氣、氧氣
  - label: D
    content: 甲烷、乙醇
  - label: E
    content: 冰、二氧化碳
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 相同溫度、壓力下，相同體積的氣體有相同數量的分子，此為亞佛加厥定律的內容，故選兩者皆為氣體的選項(C)。
- id: doc_112_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 同溫、同壓下，氣體甲的密度為氧氣的2倍，8 L的氣體乙與9 L的氧氣等重，則下列敘述哪些正確？
  options:
  - label: A
    content: 甲分子量為48
  - label: B
    content: 乙分子量為24
  - label: C
    content: 密度：甲＞乙＞氧氣
  - label: D
    content: 同體積的三種氣體所含分子數：甲＞乙＞氧氣
  - label: E
    content: 等重的三種氣體所含分子數：甲＞氧氣＞乙
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)由PM＝dRT，同溫同壓下甲氣體密度為氧氣的2倍，代表其分子量為氧氣的2倍，即甲分子量＝64。8 L的氣體乙與9 L的氧氣等重，又由亞佛加厥定律可得知同溫同壓下，氣體的體積比＝莫耳數比。故可得知8 mol的氣體乙與9 mol的氧氣等重，即可得氣體乙的分子量＝36；(C)比較密度可由PM＝dRT，得知分子量甲＞乙＞氧氣；(D)由PV＝nRT可得知，同溫、同壓、同體積下，氣體分子數都相同；(E)等重的三種氣體分子，分子量越大者分子數越少，故應為氧氣＞乙＞甲。故選(C)。
- id: doc_112_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 27℃時，一體積為12.3 L的密閉容器中，裝有氮氣及氧氣的混合物，總壓為4 atm，已知所含的氮氣為42 g，則氧氣的莫耳分率為何？
  options:
  - label: A
    content: '0.1'
  - label: B
    content: '0.25'
  - label: C
    content: '0.5'
  - label: D
    content: '0.75'
  - label: E
    content: '0.9'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由理想氣體方程式計算氮氣分壓：P×12.3＝1.5×0.082×300，得P＝3 atm，故氮氣的莫耳分率＝$\frac{3}{4}$＝0.75，氧氣莫耳分率＝1－0.75＝0.25。故選(B)。
- id: doc_112_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 將一個容積固定的開口容器加熱，溫度由27℃上升到若干℃時，原有容器內的空氣將有25％逸出至容器外？
  options:
  - label: A
    content: '77'
  - label: B
    content: '87'
  - label: C
    content: '97'
  - label: D
    content: '107'
  - label: E
    content: 127 ℃
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 因容器體積固定，若故有的氣體會逸出$\frac{1}{4}$，代表加熱後氣體的體積變為原本的$\frac{4}{3}$倍，才會有$\frac{1}{4}$逸出。（變為$\frac{4}{3}$倍後有$\frac{3}{3}$留在容器內、$\frac{1}{3}$逸出）故溫度也會變為原本的$\frac{4}{3}$倍，即從27℃（300 K）上升至127℃（400 K）。故選(E)。
- id: doc_112_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於氣體性質的敘述，下列何者正確？
  options:
  - label: A
    content: 不起化學反應的氣體，可依任意比例均勻混合
  - label: B
    content: 氣體體積不受溫度、壓力的影響而改變
  - label: C
    content: 0℃時的任何氣體物理性質均相同
  - label: D
    content: 氣體不具可壓縮及膨脹的性質
  - label: E
    content: 容器內氣體壓力產生原因為氣體的重量所造成
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)由PV＝nRT，可知體積會受溫度、壓力影響；(C)物理性質隨物質本性而有不同；(D)氣體可壓縮可膨脹；(E)為氣體碰撞氣壁導致。故選(A)。
- id: doc_112_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在密閉容器中有定量的空氣，下列何者不會改變氧氣的分壓？
  options:
  - label: A
    content: 定容下，降低溫度
  - label: B
    content: 定溫、定容下，加入少量的氧氣
  - label: C
    content: 定溫下，縮小容器體積
  - label: D
    content: 定溫、定容下，添加少量氦氣
  - label: E
    content: 定溫、定容下，抽出少量的空氣
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 分壓的討論亦滿足PV＝nRT，故(A)降低溫度，分壓下降；(B)加入氧氣使氧氣莫耳數增加，分壓增加；(C)體積下降，分壓增加；(D)溫度、體積、莫耳數都不變，故壓力不變；(E)抽出空氣，則減少氧氣莫耳數，分壓下降。故選(D)。
