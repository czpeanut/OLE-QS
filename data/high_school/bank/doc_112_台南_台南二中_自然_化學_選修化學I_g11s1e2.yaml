  stem: '在1升的甲容器中，置入8 atm的$H_{2}$氣體，另外3升的乙容器置入4 atm的He氣體，甲乙容器間以一體積可忽略不計之毛細管連結，當毛細管開關打開，在同溫下氣體達平衡時，試回答下列問題。

    (1) 乙容器總壓為何？（3分）

    (2) 甲容器中$H_{2}$氣體的莫耳分率為何？（3分）

    (3) $H_{2}$氣體在甲、乙兩容器之莫耳數比為何？（3分）

    (4) 甲容器中$H_{2}$、He氣體之莫耳數比為何？（3分）'
  answer:
  - (1) 5 atm (2) 0.4 (3) 1：3 (4) 2：3
  answer_status: verified
  answer_source: answer_key
  explanation: (1) 打開毛細管開關後，依照波以耳定律，$H_{2}$分壓＝8×$\frac{1}{1 + 3}$＝2 atm；He分壓＝4×$\frac{3}{1 + 3}$＝3 atm，總壓＝2＋3＝5 atm。 (2) 分壓＝總壓×莫耳分率，故莫耳分率＝0.4。 (3) 兩容器壓力相等、溫度也相等，故兩容器中的莫耳數比即為體積比＝1：3。 (4) 甲容器中的兩氣體體積相等、溫度相等，故莫耳數比＝分壓比＝2：3。
