  stem: 氮氣與氫氣反應生成氨，在200℃時，於一密閉容器中置入1.40大氣壓氮氣，2.60大氣壓氫氣。達到平衡時總壓力為2.40大氣壓，平衡時氮氣的分壓應為下列何者？
