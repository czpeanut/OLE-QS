  answer_source: answer_key
- id: doc_112_台南_台南二中_自然_化學_選修化學I_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 保持相同溫度，取下列氣體各1克，分別置入五個相同體積之容器中，何者之壓力最小？
  options:
  - label: A
    content: 氧氣
  - label: B
    content: 氫氣
  - label: C
    content: 氮氣
  - label: D
    content: 氦氣
  - label: E
    content: 二氧化碳
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 由理想氣體方程式，PV＝nRT，當系統溫度、體積固定時，壓力與莫耳數成正比。取氣體各1 g，則分子量越大者，莫耳數越小，壓力也就越小。故選分子量最大的(E)。
