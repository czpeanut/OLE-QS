  - label: E
    content: '0.8'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 假設水銀柱兩端垂直水銀柱高度和＝h，則在A氣體測量實驗中，閉口端高度＝$\frac{2}{3}$h、氣室端高度＝$\frac{1}{3}$h；在B氣體測量實驗中，閉口端高度＝$\frac{4}{5}$h、氣室端高度＝$\frac{1}{5}$h。由上述數據可知，A氣體壓力＝$\frac{2}{3}$h－$\frac{1}{3}$h＝$\frac{1}{3}$h；B氣體壓力＝$\frac{4}{5}$h－$\frac{1}{5}$h＝$\frac{3}{5}$h。則B氣體壓力為A氣體的1.8倍。故選(A)。
