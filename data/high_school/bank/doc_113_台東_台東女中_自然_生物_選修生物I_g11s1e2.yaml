  stem: 下列有關細胞呼吸的敘述，何者正確？
  options:
  - label: A
    content: 有氧的情況下，葡萄糖直接進入粒線體進行氧化反應
  - label: B
    content: 缺氧的情況下，細胞呼吸反應先在細胞質液中進行，之後才在粒線體中進行
  - label: C
    content: 缺氧的情況下，葡萄糖可在細胞質發生若干反應，轉變為乳酸或酒精
  - label: D
    content: 無論有氧及缺氧，在細胞質液進行的反應所得的能量都比在粒線體多
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 葡萄糖不會直接進入粒線體。

