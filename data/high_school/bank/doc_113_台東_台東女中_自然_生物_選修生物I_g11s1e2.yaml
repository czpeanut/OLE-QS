  stem: 下列有關輔因子的敘述何者正確？
  options:
  - label: A
    content: 所有的維生素都可擔任輔因子
  - label: B
    content: $Mn^{2＋}$、$Zn^{2＋}$ 等金屬離子是常見的輔因子
  - label: C
    content: 輔因子與酵素相同，具有專一性
  - label: D
    content: 有機輔因子無法重複作用，反應後即分解
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 並非所有維生素都可以擔任輔因子。

    (C) 酵素和受質間具有專一性，輔因子則無專一性，一種輔因子可協助多種酵素。

    (D) 有機物的輔因子通常可以重複使用，並不會在反應後分解。'
