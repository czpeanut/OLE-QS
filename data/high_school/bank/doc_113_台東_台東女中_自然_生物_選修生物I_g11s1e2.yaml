  stem: 下列有關甲、乙生物的敘述，何者正確？
  options:
  - label: A
    content: 甲不可能是人，因為人的體溫不會高於 40 ℃
  - label: B
    content: 乙是高溫地區的陸生生物，因為近 80 ℃ 時其酵素活性最大
  - label: C
    content: 甲、乙都不是恆溫動物，因為酵素並非在恆溫條件下作用
  - label: D
    content: 甲、乙不會生活於同一環境，因為酵素作用的適當溫度範圍並無交集
  group_stem: 右圖為溫度變化對不同生物之酵素活性的影響，根據圖中資料回答下列問題：
