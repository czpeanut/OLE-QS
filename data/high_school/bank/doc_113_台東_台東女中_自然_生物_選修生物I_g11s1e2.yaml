  stem: 有關反應的活化能，下列敘述何者正確？
  options:
  - label: A
    content: 酵素是一種有機催化劑
  - label: B
    content: 僅有酵素可降低反應的活化能
  - label: C
    content: 加熱可降低反應需要的活化能
  - label: D
    content: 催化劑可提供反應需要的活化能
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) 無機催化劑也可降低活化能。

    (C) 加熱無法改變反應需要的活化能，而是降低活化能。

    (D) 催化劑不能提供反應需要的活化能。'
