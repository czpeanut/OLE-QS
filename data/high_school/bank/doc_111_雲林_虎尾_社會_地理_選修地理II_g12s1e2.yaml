  stem: 經濟結構脆弱是促成委內瑞拉人口大量外移的重要原因之一，該國經濟結構脆弱的主要原因為何？
  options:
  - label: A
    content: 依賴礦產原料出口的單一經濟結構
  - label: B
    content: 實施進口替代經濟，缺乏民生工業
  - label: C
    content: 土地分配不均，社會貧富差距過大
  - label: D
    content: 鄉村推力太大，都市就業機會不足
  group_stem: 一碗年初賣 100 元的麵，到年底漲到 83,000 元；每 100 位民眾，就有 7 人沒有食物吃而不得不逃往鄰國，這正是南美洲委內瑞拉的現狀。來自委內瑞拉的難民和移民數量從 2015 年底的 69 萬 5 千人暴增至 2019 年的 400 萬，成為全球被迫遷離家園的最大族群之一。該國坐擁全球將近 25 ％的石油儲量，但過去的石油出口收益多用於推動收入再分配與社會福利計畫，並未發展其他產業，導致民生物資仰賴進口、經濟結構脆弱。美國的頁岩油生產 2014 年中期興起後，委內瑞拉等石油輸出組織的國家雖然壓低油價試圖抗衡，國家收入卻也跟著減少，導致進口民生物資、糧食缺乏，經濟狀況難以起死回生，導致人民逃往國外，截至 2020 年已超過 600 萬委內瑞拉人移往鄰近國家尋求庇護。而委內瑞拉的惡性通膨漲已經來到第 4 年，經濟衰退已經長達 8 年，央行救經濟的辦法就是印新鈔，目前最高面額的鈔票 100 萬玻利瓦在市面上奇缺，買一瓶 5 公升的水需要用到 7 張以上的 100 萬玻利瓦。今年 5 月馬杜羅政府將最低月薪提高了 2 倍，但仍不夠買 1 公斤肉。由於通膨情況嚴重，以至於日常經濟主要以①計算，商店通常也以①標價。請問：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)委內瑞拉雖然擁有大量石油蘊藏，但是整體國家經濟結構也高度仰賴原油出口，以及相關石化產品，這樣的經濟結構容易受到國際波動影響、隨著油價大起大落，相當不穩定。
