- id: doc_111_雲林_虎尾_社會_地理_選修地理II_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 人口倍時指「一地人口增加 1 倍所需的時間」，世界人口於 1800 年由 5 億增加至 10 億費時約 300 年，1960 年代世界人口由 15 億成長到 30 億費時約 80 年，到 1999 年成長至 60 億只用了將近 40 年。人口倍時快速縮短與下列哪些趨勢有關？(甲)醫藥衛生進步，死亡率降低(乙)預期壽命不斷延長(丙)生產力改善，出生率大幅提高(丁)運輸革新，人口國際遷移頻繁
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丙
  - label: D
    content: 乙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)世界人口得以在短時間之內增加 1 倍，主要原因在於死亡率明顯下降、世界各國的平均壽命有所增長，上述皆與醫療進步有關。與(丙)生產力改善、(丁)人口遷移沒有關係。
- id: doc_111_雲林_虎尾_社會_地理_選修地理II_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 食物里程（Food Miles）指「食物從生產出來，直到運送至消費者手中的運送距離」。關於降低食物里程的飲食消費趨勢所具有下列優點，下列何者為「非」？
  options:
  - label: A
    content: 減少化石能源的消耗，降低溫室氣體的排放
  - label: B
    content: 避免傳統銷路的盤商剝削
  - label: C
    content: 消費者可食用更新鮮的食物
  - label: D
    content: 提高土地利用效率，達到聚集經濟
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)聚集經濟，是因為空間聚集得以降低外部成本，或是如人潮匯聚帶動消費、公共設施提供工業製造等，使得產業集中。與食物里程沒有關係。
- id: doc_111_雲林_虎尾_社會_地理_選修地理II_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 糧食自給率的概念較適合用來評估下列哪一個食品與農業體系的狀況？
  options:
  - label: A
    content: 飲食習慣改變，對糧食生產結構的影響
  - label: B
    content: 農業生產與國家糧食供應安全
  - label: C
    content: 全球化糧食貿易對糧食供應安全的貢獻
  - label: D
    content: 食物供應鏈與食物里程拉長的情形
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)糧食自給率為國家安全重要的一環，一國的農業生產愈是能夠自足，提供人民所需，降低對於進口的依賴度，特別是在氣候變遷或是戰時等情況，更顯重要。
- id: doc_111_雲林_虎尾_社會_地理_選修地理II_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 為改善全球糧食供應由少數跨國企業控制的結構，許多歐美國家開始提倡新的農產品交易概念，並逐漸擴散至全球。希望用較為合理的價格保障生產者的權益，以改善開發中國家農民的生活。讓市場價格下降時，生產者也能擁有保障生活一定的利潤。上述的概念最可能為何？
  options:
  - label: A
    content: 全球化與自由貿易
  - label: B
    content: 公平貿易
  - label: C
    content: 綠色革命
  - label: D
    content: 小農經濟
  - label: E
    content: 農業系統
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)為了避免開發中國家的農民生產過程及農產品銷往各國時，被跨國企業的把持及剝削，以公平貿易來保障農民獲得合理的報酬及勞務。
- id: doc_111_雲林_虎尾_社會_地理_選修地理II_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年臺灣農田休耕、棄耕或廢耕的面積逐年增加，糧食進口量大幅上揚，2016 年以熱量為計算基準的糧食自給率僅剩 31 ％。造成臺灣近年糧食自給率下降的原因，除了農村勞動力老化外，尚包括哪兩項？(甲)農業科技進步(乙)將糧食作物充當生質能，以降低對化石性燃料的依賴(丙)氣候變遷導致產量降低(丁)國人飲食習慣改變(戊)加入 WTO 後部分糧食作物無法與進口作物競爭
  options:
  - label: A
    content: 乙丁
  - label: B
    content: 丙戊
  - label: C
    content: 甲丁
  - label: D
    content: 丁戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)臺灣的糧食自給率下降，主要原因之一是(丁)國人的飲食習慣有明顯改變，原本主食米飯，但在許多飲食選擇進入後，如麵食、餃子、肉類、海鮮等，對於稻米種植需求下降；還有一原因為(戊)我國加入世界貿易組織（WTO）之後，部分農產品以進口的方式趨於明顯，如黃豆、小麥、玉米等。(甲)農業科技進步將使產量提高，並提高糧食自給率；(乙)臺灣雖然有在發展生質能，但是比例並不高；(丙)氣候變遷可能影響生產，但並非糧食自給率低的原因。
