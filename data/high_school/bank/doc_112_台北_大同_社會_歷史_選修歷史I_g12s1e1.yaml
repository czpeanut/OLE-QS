  stem: 1845 年，當美國與英國因奧勒岡州的國界問題而產生糾紛時，紐約記者歐蘇利文以「昭昭天命」為觀點，認為美國有權取得奧勒岡州。他相信將共和民主實施於整個北美洲是上帝賦予美國的神聖使命，未來美式民主的拓展勢不可當，將會隨著盎格魯薩克遜白人的遷移拓展至北美各處。不久之後，「昭昭天命」的論述，成為帶動整個美國向西拓殖的風潮與立論。同學若要使用上述資料中的價值觀，作為課堂學期報告的討論內容，那麼最適合用來研究以下哪一主題？
  options:
  - label: A
    content: 美國人的資本主義經濟演變過程
  - label: B
    content: 美國原住民遷徙的原因與過程
  - label: C
    content: 南北戰爭的遠因與西部關係
  - label: D
    content: 美國民主體制的建立以及省思
  answer:
  - B
