- id: doc_112_台北_大同_社會_歷史_選修歷史I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「會堂」是毛利人心目中具有神聖性質的空間，是毛利人婚喪喜慶，以及族人開會的重要場所，反映出以部落為核心的思想。從會堂的建築結構、雕刻以及內部擺設也能得知毛利人的歷史與世界觀。請問下列選項當中的聚會場所在人與空間的互動關係上最近似毛利人與會堂？
  options:
  - label: A
    content: 客家公嘗（公嘗：祭祀公業）
  - label: B
    content: 基督教堂
  - label: C
    content: 孔廟
  - label: D
    content: 祖靈屋
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 毛利人的會堂建築物本身被視為是祖先的化身，屋頂為祖先的頭、梁柱為祖先的脊椎，而此建築象徵了部落受祖靈保佑，在祖靈見證下完成會議、儀式，可見其對祖靈的尊崇，故其性質與(D)選項最為相近。
