  stem: 一篇討論毛利人論文的關鍵字中，出現「免疫力」、「疾病」、「抗體」等詞，請問這篇文章探討的主題應為下列何者？
  options:
  - label: A
    content: 毛利人與南島語族的關係
  - label: B
    content: 毛利人的衛生習慣
  - label: C
    content: 毛利人人口驟減的因素
  - label: D
    content: 毛利人與自然共存的情形
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 大航海時代下，歐裔白人進入紐西蘭，帶來天花、麻疹等傳染病，導致沒有免疫力的毛利人大量死亡，因而人口驟減，由此可推知其論文探討的主題應該與毛利人口驟減相關，故選(C)。
