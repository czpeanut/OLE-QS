  section: 3
  number: 1
  type: calc
  page: 6
  stem: '請閱讀文章，並回答問題：

    1870 年代，美國幾乎所有由中國人組成的社區中，都可以看到這些由中國人經營的洗衣店。隨著洗衣業帶來的利益愈來愈大，許多來美國追求「美國夢」的其他族群移民也紛紛投入洗衣業。

    19 世紀末舊金山政府通過一項法令，規定所有洗衣業者，都必須要向市政府申請執照才能做生意。最終，超過三分之二由中國裔移民經營的洗衣店，都沒有被頒發執照，另外由非中國裔移民開設的洗衣店，則只有一家沒有被核發執照。中國裔洗衣業者一狀告上法院。最後美國最高法院判決認定，雖然舊金山政府的新法令內容上沒有族群歧視的意圖，但是他的執行結果，確實有族群歧視的事實。然而在美國社會上述風氣醞釀已久，1882 年通過某項法案，是美國第一部針對特定族群禁入美國的法令。

    (1)請問文章中提到的某項法案為何？'
  answer:
  - (1)《排華法案》
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)題幹所述被美國限制種種權益的族群為中國人，而的確在 19 世紀以來，隨著華工到美國找尋工作者日眾，美國社會排華的風氣就愈發顯著，最終美國政府於 1882 年通過《排華法案》，此也為美國第一部針對特定族群禁入美國的法令。

    (2)德裔美國人購買債券也非法律規範，而是社會輿論風氣所導致；而對照中國裔洗衣業者未被舊金山政府核發執照一事，也被判定「沒有族群歧視」的意圖，只是執行結果如此，因此兩者性質最接近。'
