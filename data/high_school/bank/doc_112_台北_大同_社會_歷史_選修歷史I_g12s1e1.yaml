  stem: 2007 年美國芝加哥菲爾德博物館將過去於 1893 年購得，臉上有文面的毛利人頭顱以及另外 13 具骨骸歸還給紐西蘭，成為美國史上第一個歸還毛利人祖先遺骸的國家博物館。臺灣亦有類似的案例，如阿美族太巴塱部落要求中研院歸還屋柱。請問這樣的模式又被稱作為
