  answer_status: verified
  answer_source: answer_key
  explanation: 《懷唐伊條約》簽訂後，由於英國政府強調官方有「優先購地權」，土地價格被官方把持，引發毛利人反抗後，殖民政府派出軍隊鎮壓抗爭，直接把土地充公，爾後造成毛利人的土地逐漸流失，故此一仲裁法庭調查方向應與毛利人土地流失的問題相關，故選(D)。
