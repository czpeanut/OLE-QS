  stem: 1960 年代至 1970 年代正值國際民權高漲之際，世界各地脫離殖民母國的抗爭運動此起彼落，而國際也開始關注各地區原住民權益，毛利人歷經多年的抗爭運動，終於獲得眾多關注與支持。紐西蘭國會更在 1975 年通過《懷唐伊條約法案》，成立專門仲裁法庭，調查過去政府破壞《懷唐伊條約》的情形。請問下列何者應為該仲裁法庭調查方向？
  options:
  - label: A
    content: 毛利人被迫強制召募進軍隊服役
  - label: B
    content: 毛利人申請政府部門公職能被優先採用
  - label: C
    content: 毛利人議會的投票公正性與否
  - label: D
    content: 毛利人土地資源被剝奪的情形
  answer:
