- id: doc_112_台北_大同_社會_歷史_選修歷史I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 世界各地原住民族有其特殊文化藝術，其中刺青就是一項具有代表的特色。下列關於紐西蘭原住民族的刺青說明，何者符合實際狀況？
  options:
  - label: A
    content: 作為該民族唯一傳承歷史的方式
  - label: B
    content: 全身除臉部之外均可以進行刺青
  - label: C
    content: 以各種圖案進行記錄，甚至顯示個人與家族、部落的關係
  - label: D
    content: 基本上作為藝術價值的特色居多，其他意義明顯較少
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 在毛利文化中，刺青表示成年與尊貴的地位，不同的圖樣意指來自不同的擴展家庭、部落與身分地位，故選(C)。(A)並非僅有文身可做為傳承歷史的方式，像是建築雕刻、信仰神話等也是。(B)毛利男性有時會在全臉、臀部與大腿上文身，而女性則以口唇周圍為主。(D)毛利人認為文身可展現自身的認同。
  tags:
    unit:
      code: HI-S1-1-1
      book: 選修歷史I 族群、性別與國家的歷史
