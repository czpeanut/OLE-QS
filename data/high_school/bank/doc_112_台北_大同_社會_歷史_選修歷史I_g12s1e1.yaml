- id: doc_112_台北_大同_社會_歷史_選修歷史I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 歐洲人在 18 世紀中葉後才開始對紐西蘭進行深入的探索，請判斷最先對紐西蘭內部進行探索的歐洲人較有可能會在毛利族社會中見到何種情況？
  options:
  - label: A
    content: 平等的社會，雖有頭目但與其他族人處於同一位階
  - label: B
    content: 紐西蘭眾部落基於同族觀念而少有戰爭，村寨僅作為日常生活空間
  - label: C
    content: 集體生活模式下，「擴展家庭」為最小的共同生活、從事生產之居住單位
  - label: D
    content: 毛利人因生活地域物資匱乏而不擅使用大自然資源
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 擴展家庭是毛利社會共同生活、從事經濟生產活動的最小居住單位，成員通常由夫妻、已婚子嗣和未婚子女所組成，故選(C)。(A)毛利人屬於階層制度社會，根據出身條件區分成頭目貴族、平民和奴隸。(B)毛利人由於部落眾多而戰爭頻繁，村寨的建造便是為了有利禦敵所用。(D)天然資源豐富，因此毛利人善於使用自然環境並與之共存。
