  section: 1
  number: 11
  type: single
  page: 2
  stem: 紐西蘭，北島也被稱為「Te IkaaMāui」（毛伊的魚），這是因為在毛利神話中，北島是由半人半神的毛伊釣起的巨大魚隻轉變而來。而在南島上，則有一個被荷蘭聯合東印度公司的塔斯曼命名為「殺人者灣」的地方。關於題幹的描述，下列何者正確？
  options:
  - label: A
    content: 紐西蘭的土地是由最先發現的人來命名
  - label: B
    content: 「Te IkaaMāui」反映出毛利文化的視角
  - label: C
    content: 「殺人者灣」展現了毛利人的血腥殘暴本性
  - label: D
    content: 「Te IkaaMāui」與「殺人者灣」只是地名，不具特別意義
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)北島的稱呼是來自毛利神話，可見題幹敘述未必符合事實。(C)「殺人者灣」乃是荷蘭聯合東印度公司的塔斯曼命名的，這是因為塔斯曼的船隊與毛利人之間的誤解，讓毛利人誤以為其為侵略者而殺害其船員，並非毛利人本性殘暴。(D)其名稱都代表著原住民族與外來者的觀點，具特別意義。
