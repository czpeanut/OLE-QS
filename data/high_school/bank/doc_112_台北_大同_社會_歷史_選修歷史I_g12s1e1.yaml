  stem: New York 即「新約克」的意思，該地最初有一批來自英國約克郡的新移民，他們以家鄉的地名為新居住地命名。歷史上，臺灣也有地名的由來與此類似，這是指
  options:
  - label: A
    content: 新北的新莊
  - label: B
    content: 臺中的沙鹿
  - label: C
    content: 臺南的新營
  - label: D
    content: 屏東的潮州
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 屏東潮州的名稱乃是因為該地居民主要來自廣東潮州的移民，故以原鄉名稱命名，與題幹所述的情況最為類似，故選(D)。(A)即「新興的街莊」之意，因淡水河帶來的河港之利，是臺灣北部早期開發的地區之一。(B)名稱來源為平埔族巴布拉族沙轆社的聚落，日治時期將轆改為鹿，國民政府時期則沿用「沙鹿」的名稱至今。(C)鄭氏時期軍屯下新開墾的土地，皆多以「營」為名稱，新營即為其中之一。
