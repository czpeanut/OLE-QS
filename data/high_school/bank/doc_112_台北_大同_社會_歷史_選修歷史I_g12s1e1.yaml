  - label: A
    content: 文物回歸運動
  - label: B
    content: 文化傳承運動
  - label: C
    content: 世界原住民運動
  - label: D
    content: 語言巢運動
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 所謂文物回歸運動，乃在歷史上經戰爭、走私等不當掠奪的文物，應回歸文物的原生地。1980 年代起，世界各地的原住民族陸續提出文物回歸的訴求，包含殖民時期流落海外的文物，以及被博物館收藏的部落文物，而題幹所舉的例子便是屬於文物回歸運動的一環。
