  stem: 英式橄欖球作為紐西蘭盛行的運動，深受毛利人喜愛，亦為其一展運動長才的空間。1970 年代凡踏入某一國家進行世界巡迴賽，毛利人都會被排除在參賽名單之外，或以「榮耀白人」的身分參戰。請問此一國家最有可能為下列何者？
  options:
  - label: A
