  stem: 遠在南半球的紐西蘭其實是 17 世紀歐洲人抵達該地，才出現紐西蘭這個名字，在此之前抵達「紐西蘭」的原住民毛利人是以下列何者稱呼該地？
  options:
  - label: A
    content: 復活島之鄉
  - label: B
    content: 長白雲之鄉
  - label: C
    content: 殺人者灣
  - label: D
    content: 新的「西蘭」之地
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 毛利族的祖先約在 10 ～ 14 世紀間來到紐西蘭地區，他們將此地命名為歐提羅奧，在毛利語中為「長白雲之鄉」之意。17 世紀歐洲人來到此地，才出現「紐西蘭」這個稱呼。
