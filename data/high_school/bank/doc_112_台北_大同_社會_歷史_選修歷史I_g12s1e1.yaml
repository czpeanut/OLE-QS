  stem: 1642 年，荷蘭聯合東印度公司的航海家塔斯曼於紐西蘭南島的北端海域下錨，他原本有機會成為歷史上第一個登陸紐西蘭的航海家，卻因為誤會而派遣武裝船隻與毛利人探查的獨木舟起衝突，最終四人被殺，塔斯曼隨即起錨返航。請問題幹中所述塔斯曼抵達紐西蘭後「因為誤會而派遣武裝船隻與毛利人探查的獨木舟起衝突」，這場衝突發生地點在當時被稱「殺人者灣」。一百年後，英國船長庫克，透過了翻譯與事前了解毛利文化，成功登陸到紐西蘭的土地。請問「殺人者灣」，是依據何種視角而來？（西方人視角／毛利人視角）塔斯曼的失敗與庫克的成功，從文中哪一段話可看出？（30 字內）
