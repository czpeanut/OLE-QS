- id: doc_112_台北_大同_社會_歷史_選修歷史I_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 某場長達多年的戰爭決定了 18 世紀中期歐洲列強對北美洲的勢力範圍，這場戰爭奠定了英國在大西洋的海上霸權地位。法國將整個新法蘭西割讓給英國，並從印度撤出，使英國自此成為海外殖民地霸主，成就日不落帝國的名聲。請問該場戰役應為下列何者？
  options:
  - label: A
    content: 七年戰爭
  - label: B
    content: 中南美洲獨立戰爭
  - label: C
    content: 美國獨立戰爭
  - label: D
    content: 南北戰爭
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '關鍵在這場戰爭發生於 18 世紀中期，且影響為「奠定英國在大西洋的海上霸權」、「法國將新法蘭西割讓給英國，並從印度撤出」，這些線索皆可推測題幹所述為七年戰爭。(B)(D)皆發生於 19 世紀，時間與題幹所述不符。(C)七年戰爭後英國獲勝，為還戰債向北美人民徵稅，進而引發美國獨立戰爭。

    14.17 世紀，在英國遭受宗教迫害的清教徒，乘坐「五月花號」來到北美洲，這些移民到達目的地之時正值冬季，在陌生的環境中難以取得食物，當地原住民慷慨分享食物，移民得以度過眼前的困境，因而有感恩節的由來，故選(C)。(A)應是清教徒，屬新教中的喀爾文教派。(B)乃自願移民，並未接受帝國贊助。(D)在北美洲東岸建立殖民地。

    15.從題文內容來看，美國白人認為遷徙至北美各地，乃是「昭昭天命」，他們被賦予拓展民主的使命，因而往北美各處拓展，但也因此造成原住民族的居住環境受到破壞而被迫遷徙。(A)題幹中所述為美國人民的使命感與領土擴張之間的關係。(C)南北戰爭的因素與廢奴制度、聯邦政府權力分配的原因相關，與題幹所述無關。(D)題幹中只是說民主乃是美國白人的驕傲，他們要將其擴展到其他各地，以此作為白人擴張遷徙的合理理由，但並非對美國的民主體制有何省思之處。

    16.1970 年代，南非實行種族隔離政策，有色人種都要與白人隔離，故毛利人也會被排除在外。(C)美國於 1964 年制定《民權法案》，宣示對種族、膚色、宗教信仰、性別之歧視性行為是為非法，代表對於種族隔離政策的禁止。

    17.(A)(D)有自願與非自願遷徙的移民，如非洲黑奴被販售到美洲，是被強迫的移民。(C)有相當多與經濟因素有關。

    18.(A)哥倫布登陸美洲時，誤以為所到之處為印度，故稱在地人為印度人，西班牙語常被譯為印第安人。(B)中美洲。(D)加拿大官方以「第一民族」稱之。

    19.(A)還是會出現，若遇到天災、戰爭、政治迫害等因素，農業民族也會遷徙。(C)任何民族遭遇天災、戰爭、政治迫害等因素，都可能會出現移民的現象。(D)農業開墾的目的為主。

    20.布克．華盛頓的主張，對白人來說應該比較容易接受，因為他認為要先讓非裔族群提升自身的教育與財富，才能有跟白人一樣的公民權，是先融入白人社會再追求權益。杜．波伊斯主張先追求法律與社會上的實質平等，包括公民權的爭取，但在許多白人的心中，黑人的文化落後、經濟狀況不佳、教育水準低，因而沒有資格擁有參政權，因此會認為杜．波伊斯的主張過於激進，故選(D)。

    21.美國在獨立戰爭後，建立民主共和的政體，也強調了人民的自由與平等，但僅限於白人，黑人在社會上仍處於劣勢，因此會有這段控訴出現，故選(A)。(B)法國若要強調平等、自由等價值的體現，應該會以法國大革命的紀念日作為代表，而非拿破崙戰爭紀念日。(C)俄國革命發生於 1917 年，與題文提及的年代不符。(D)印度獨立發生於 1947 年，因此 19 世紀中葉尚未發生。

    22.移民在初來乍到的陌生地區時，其民族或國族認同仍會以自己的家鄉為主，因此在移居地的地名命名上，便會以原居地的地名為基礎，故選(B)。

    23.19 世紀中期後，中國許多華工移往海外，其中前往美國的華工眾多，由於太平洋鐵路工程險峻，白人勞工參與意願不高，加上華工的薪資低廉、忍耐與配合度高，故鐵路工程多聘用華工，但由於移入美國的華工人數漸多，且搶走許多美國人民的工作機會，因而造成美國的排華風潮，使得政府於 1882 年通過《排華法案》。

    24.題文提及美國政府審查與囚禁的對象主要針對「德國」與「日本」，可見當時美國與這兩個國家為敵對狀態，故會特別懷疑該國移民，因此可推測當時正值二戰期間，美國為同盟國，與軸心國家敵對，所以對其移民無法信任而限制其權利，故選(A)。

    25.(A)南北戰爭爆發於 1861 ～ 1865 年，但《綠皮書》乃是出版於 1936 年之後。(B)題幹有說因為許多新興非裔中產階級購買汽車，為避免遭遇危險，而出版了這本服務指南，這本服務指南可能會讓非裔中產階級購買汽車的意願提高，因為可以事先知道哪些地方對非裔是友善的，有助於出外旅遊的安全。(C)《民權法案》推動後，《綠皮書》的作用不大，因此停止再版。

    26.(D)拉丁美洲的政局不穩，且經濟發展也較落後，因此許多拉丁美洲的移民，會經由墨西哥與美國的邊境非法移民到美國找尋工作或定居，故川普此舉是為了要阻擋來自拉丁美洲的非法移民。

    27.19 世紀末以來，英國殖民政府採行同化政策，不准在學校裡面說毛利語，等這些小孩長大後，在社會要立足也需要接受英式教育，故會說毛利語的比例必定會大幅下降，故選(D)。(A)毛利人擁有的土地，在 1840 年代簽訂《懷唐伊條約》之後，應該就開始大量流失，不會在 20 世紀初還擁有 90 ％的土地。(B)應該愈往後其比例愈高，因為沒有土地只好前往都市找尋工作。(C)被英國殖民後，毛利人不可能擁有 80 ～ 90 ％的公務員比例。

    28.關鍵為社會上仍抱持著種族歧視的觀點，認為黑人看守白人戰犯會產生問題，讓黑人誤以為自身的社會地位高於白人，且黑人士兵看守德國戰犯，代表當時德國是為戰敗國，故可推測應該是二戰後美國的現象，因此答案選(B)。

    29.阿美族與毛利人同屬於南島語族，因此無論是語言、文化與傳說皆有相似的發展，很可能具有相同的來源，因此有一定的關連性，故(C)的選項最為合理。

    30.(A)荷蘭聯合東印度公司的航海者塔斯曼到達紐西蘭之時，為 17 世紀中葉，當時尚未開始工業革命。(B) 16 世紀時，已發現到達中國的新航路。(D)此為新帝國主義下白種人的使命感，要等到 19 世紀末葉。

    31.南歐、東歐的移民從大西洋搭船，抵達美國東岸，為加強管制，美國在紐約的艾利斯島設入境檢查站，故來自歐洲的移民一定會看到自由女神像，因此受到美國夢吸引的移民，看到自由女神像的瞬間，應該會產生他們已來到一個充滿自由、平等、機會無限國度的感受，故選(C)。(A)象徵黑人奴隸獲得解放與自由，非奴隸主。(B)美國是從英國獨立出去。(D)從中國遷移至美國的移民從太平洋坐船，自美國西岸登陸，不會看到位於美國東岸的自由女神像。

    32.特定族裔的美國人會有如以下稱呼，「愛爾蘭裔美國人」、「德裔美國人」。19 世紀末、20 世紀初的美國雜誌中將他們統稱為「帶連字符號的美國人」。此種用法往往有歧視意味，又有雙重認同的意涵。(A)並非迎接不同文化，而是帶有歧視意味。(B)種族隔離政策是針對有色人種，不包含歐洲移民而來的白人。(C)無助於人民認同美國，而是具有雙重認同的意涵。

    33.早期歐洲移民與毛利人交換商品，大多是透過以物易物的方式，因彼此對商品的價值定義不同，因此會利用自身對產品的價值與計價方式和對方交換認為等價的商品，故選(C)。(A)布匹並非毛利人使用的貨幣單位，但因歐洲布匹較物美價廉，故會與其交換商品。(B)並非受到西方人僱傭，在歐洲人來到紐西蘭後，便會透過以物易物的方式來向原住民交換當地特有的獵物或產品。(D)並沒有如此規範。

    34.(A)熔爐論強調文化融合，往往會造成強勢人群的文化成主流，少數族裔的文化遭到不同程度的忽略。(B) 1960 年代，多元文化主義抬頭，熔爐論逐漸被取代。(C)沙拉碗代表多元文化主義，強調多元差異、彼此互相尊重，包容不同文化並進行保留，而非合而為一。

    35.1982 年，加拿大頒布憲法法令，指出政府認定的原住民族群，分別是第一民族、因紐人，以及梅蒂人。從題幹也可判斷國家內有印第安人的族群勢必在美洲，且因紐特人分布在接近北極圈一帶，因此這個國家應是指國土範圍有到極北的加拿大。

    36.有些原住民族因地緣關係，與歐洲外來者進行貿易往來。例如：生活在北美五大湖區的原住民族掌握大量的河狸毛皮，積極與歐洲人進行貿易，以換取金錢、槍枝、鐵器等。'
  tags:
    unit:
      code: HI-S1-2-1
