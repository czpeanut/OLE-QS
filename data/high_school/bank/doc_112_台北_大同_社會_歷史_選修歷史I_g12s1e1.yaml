  type: single
  page: 1
  stem: 根據某項資料顯示，19 世紀歐洲火槍輸入紐西蘭的「價格」並非穩定不變，如 1814 年一支火槍需 150 籃的馬鈴薯或 8 隻豬，1820 年增升為一支火槍需 200 籃馬鈴薯或 15 隻豬，但到了 1827 年，卻又降為 120 籃馬鈴薯或 10 隻豬得以換取一支火槍。根據以上資料，請問造成火槍「價格」暴增的主要因素為何？
  options:
  - label: A
    content: 物產歉收
  - label: B
    content: 疾病傳布
  - label: C
    content: 歐人壟斷價格
  - label: D
    content: 部落競爭
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由於紐西蘭毛利部落之間爭奪資源的競爭在 19 世紀初更加劇烈，因此需要用火槍來爭奪資源的毛利人，便利用土地或資源向歐洲人交換火槍，由此可知火槍價格暴增的原因是因為需求量高，而需求量高是因為部落競爭的緣故，故選(D)。
  tags:
    unit:
      code: HI-S1-1-1
      book: 選修歷史I 族群、性別與國家的歷史
      chapter: 原住民、移民與殖民
