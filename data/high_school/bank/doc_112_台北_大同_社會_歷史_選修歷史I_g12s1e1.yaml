  page: 1
  stem: 在傳統毛利人的世界觀以及信仰當中，有著創世的始祖神、掌管世界各種自然力量的自然神以及各種災厄的惡靈，人們會向著神靈祈求豐收、健康、子孫平安，同時也期望著遠離災厄的降臨，除此之外，毛利人認為靈魂不滅，因此每當重要的時刻他們都會崇敬地祭拜祖靈。下列關於毛利族人的信仰描述何者正確？
  options:
  - label: A
    content: 從自然神的信仰可知毛利人相信萬事萬物都有神靈的存在
  - label: B
    content: 從始祖神的存在可以判斷是一神信仰
  - label: C
    content: 毛利人的信仰是建立在虛構的神話之上
  - label: D
    content: 毛利人與臺灣原住民相同，只崇拜自己的祖靈
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)多神信仰。(C)信仰是自古以來流傳下來傳統與信念，並非僅有虛構的神話。(D)毛利人認為人類屬於宇宙，人類的起源源自於「祖靈」，與遠古時期的祖先神祇與自然界眾神，共同構成宇宙，只是當重要時刻以崇拜祖靈為主，但不代表只崇拜祖靈。
