  stem: 《懷唐伊條約》第二條英文版本說明女王保證紐西蘭的部落、頭目及其家屬治理與掌控自己原本擁有的土地、森林、漁場及其他物產，對照毛利語版本中的「Taonga」這個詞也包含語言和文化等珍貴財產。根據題幹敘述，下列何者理解較適當？
  options:
  - label: A
    content: 該條約出現不同的解釋空間
  - label: B
    content: 因英文版本草案先出現，故應以英文版為依歸
  - label: C
    content: 該英文版條約與之後的毛利語版本是一致的
  - label: D
    content: 可知殖民政府認定應保障毛利族的無形資產
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)並非草案先出現，就以該版本為依歸，英文版本的條約翻譯成毛利語之後，其內容與原本有落差，因此造成毛利部落酋長的誤解，也導致其權益的喪失，是相當不公正的。(C)有很大落差，例如英文版第一條提及毛利人把主權割讓給英國，但在毛利文版中將「主權」翻譯成「治權」。(D)代表這些文化財產的存廢，主導權在殖民政府手中，而日後英國也陸續在紐西蘭推動同化政策，並無認定應保障毛利族的無形資產。
