  stem: 臺灣在實施40多年的9年國民義務教育後，即將推動12年國教，有幾位同學因國民教育即將延長的政策，討論學校教育對於社會階層化的影響。 小天：我覺得學校教育依據個人的能力，讓大家在公平機會的競爭下，被選擇和分配到各種社會階層上，使大家各司其職、發揮所長。 小華：我不認為學校教育造成社會的階層化分工以及經濟收入差異，是由個人努力或能力決定。家庭階級背景更決定個人受教育的機會和社會階層的分工。 小英：我覺得學校教育反應出的是主流文化的價值，整體環境對中上階層的學生有利，應多關注較低階層學生的學習與心態，避免貼標籤。 小敏：但我認為學校教育都在灌輸資本主義中能力與收入相符合的概念，使勞工階級的社會大眾安於其位，所以我覺得學校教育無法改變社會既存的不平等現象。請問根據討論的觀點，下列判斷何者正確？
