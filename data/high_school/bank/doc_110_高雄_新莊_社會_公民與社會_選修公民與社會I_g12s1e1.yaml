  stem: 全球超過15億學生因新冠肺炎疫情危機被隔離於家中進行遠距學習，要在短時間適應新型態教學模式，讓大家都措手不及。資源豐富的學區有能力推出完整的線上學習計劃，貧窮學區卻仍在想辦法讓所有學生都能在家使用電腦和網路。某些家庭並非遭遇經濟問題，但家中在學的兄弟姐妹達3人以上，不見得有足夠的電子產品，讓所有孩子同時進行線上學習；居家學習對於某些階段的孩子來說，通常需要家長從旁協助才能有效完成，中產階級通常可以居家工作以便陪伴孩子，但藍領階級則得外出工作，除了無法陪伴孩子，還有染疫風險。 請問文中主要反映了貧窮學區孩童面臨何種不平等的現象？請先勾選一項並簡要摘述題文做為佐證。
