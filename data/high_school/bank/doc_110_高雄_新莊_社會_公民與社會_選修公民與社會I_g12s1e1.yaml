- id: doc_110_高雄_新莊_社會_公民與社會_選修公民與社會I_g12s1e1_s2_36
  section: 2
  number: 36
  type: single
  page: 6
  stem: 《魷魚遊戲》劇中每一位主角群都代表著不同的社會階級，包含被老闆欠薪水欺壓的非法滯留外籍移工<u>阿里</u>、因涉嫌掏空公款的銀行前主管<u>尚佑</u>、醫療糾紛而被告的醫生<u>秉基</u>、非法脫北者<u>姜曉</u>、女性家暴受害者<u>智英</u>、使用暴力的黑社會大哥<u>德秀</u>等，有關於劇中主角群下列敘述何者正確？
  options:
  - label: A
    content: <u>阿里</u>與<u>姜曉</u>缺乏正式的公民身分，未能享有參政權利
  - label: B
    content: 上述所有主角皆因族群或性別因素導致不平等的交織
  - label: C
    content: <u>尚佑</u>和<u>秉基</u>的社會流動類型皆為水準性流動
  - label: D
    content: <u>智英</u>的狀況顯示出低社會階級較易出現性別暴力施暴者
  group_stem: ◎近日熱播的影集《魷魚遊戲》講述一群陷入財務危機、生活在社會底層的人士。 受邀參加一場不是你死就是我亡的遊戲，每一場遊戲都只有「通過」和「死亡」兩種結果，隨著每次遊戲的結束和死亡人數的增加，獎金則不斷向上累積，最後的贏家則可獲得456億韓元的钜額獎金。 除了《魷魚遊戲》，韓國過去也有反應韓國社會階級現象的影視作品，例如首部獲得坎城金棕櫚獎的韓國電影《寄生上流》以及《SKY天空之城》，皆反映了韓國的幾個社現象：貧富差距大、許多產業被大財閥壟斷、競爭地搶著上名校、取得好文憑擠進財閥集團工作等現象。 總統<u>文在寅</u>上任後，公開經濟政策方向將擴大公共與社福領域支出來縮減分配不均，縮短韓國貧富差距所造成的不平等，總統<u>文在寅</u>為國家元首也是最高行政首長，經濟政策所帶來的效果須負擔所有政治責任。
