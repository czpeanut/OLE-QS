  stem: 世界各國追求 GDP 的成長時，有個荒謬的現象，那就是汙染和犯罪也可以提高 GDP。由此可知以 GDP 來衡量生活福祉是有缺點的。請問下列相關說法何者正確？
  options:
  - label: A
    content: GDP 已有考量環境汙染的問題，但仍嫌不足
  - label: B
    content: 忽略處理犯罪的支出，使 GDP 低估生活福祉
  - label: C
    content: 平均每人 GDP 即可用來比較各國的貧富差距
  - label: D
    content: GDP 不考慮產品的內涵，因而高估生活福祉
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) GDP 並無考量汙染問題。(B)忽略犯罪的支出，應當是使 GDP 高估生活福祉。(C)平均每人 GDP 可以用來評估各國的貧富差距，但與題意無關。(D) GDP 忽略汙染與犯罪對生活環境的影響，使得 GDP 被高估。故本題選(D)。
