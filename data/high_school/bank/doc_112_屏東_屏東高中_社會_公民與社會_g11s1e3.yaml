  stem: GDP 數據廣受各界重視，許多國家都會定期公布相關的統計資料，不過，GDP 計算時有其侷限，曾遭英國的《經濟學人》雜誌戲稱為「嚴重扭曲的事實」（Grossly Distorted Picture）。請問下列對於 GDP 問題之說明，何者正確？
