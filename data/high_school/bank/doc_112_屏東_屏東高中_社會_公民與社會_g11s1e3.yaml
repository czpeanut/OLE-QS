  stem: 受到新冠肺炎疫情衝擊，國際原物料食材價格飆漲，以及工資攀升等壓力，國內知名連鎖餐飲業者王品集團於 2021 年 10 月宣布將於月底調漲旗下 15 個品牌價格，平均漲幅大約 5 ％，其中部分平價品牌維持原價，關於此一舉措，下列分析何者正確？
