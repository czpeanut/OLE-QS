  stem: 全球化包含經濟、政治和文化等層面的互動，一個國家的政策可能擴散並影響到其他國家。下列舉例何者最能適切說明「經濟面」的全球化現象？
  options:
  - label: A
    content: 臺灣高鐵推出國內旅遊套票，引發民眾搶購熱潮
  - label: B
    content: 中國沒有遵守「對伊朗禁售商品」的政策，因而遭到美國抵制進口商品
  - label: C
    content: 某位臺灣年輕人留學英國，學成歸國之後任教於國內某間大學
  - label: D
    content: 中國強行關閉境內高汙染的傳統產業
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為國內旅遊，無法看出全球化。(B)此為進出口貿易障礙，屬於經濟全球化的互動問題。(C)此為文化全球化，並非經濟全球化。(D)此為國內經濟政策，非屬於經濟全球化。故本題選(B)。
