  stem: 對於流感疫苗接種者而言，注射疫苗會有減少罹病的私利，也可能會有需要承擔疫苗過敏或其他後遺症的私弊。此外，注射疫苗保護自己不得到流感，同時也不會將病毒散播給其他人，因此也間接降低他人罹病的機率。然而，這項好處的受益者卻不是自己，而是其他人。也就是說，接種流感疫苗除了自己利害的計算之外，這個行為還會影響其他人，使他人受益，但接種者卻不會經由市場機制得到獎勵。下列對於打疫苗行為的描述何者正確？(甲)原本個人自費施打疫苗的數量會比補貼前多(乙)若政府補貼公費施打疫苗，將可提升社會效益(丙)公費施打疫苗可能出現造成市場運作缺乏效率(丁)考慮外部效益後的施打疫苗人數應提升
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (甲)(丙)
  - label: C
    content: (丙)(丁)
  - label: D
    content: (乙)(丁)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)個人自費打疫苗應當會比補貼前少；(丙)在有外部效益的情形下，政府的補貼會提高社會福祉。故本題選(D)。
