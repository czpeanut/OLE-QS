  stem: '設θ是一廣義角，以下(1)至(6)的敘述中有幾個是正確的？

    (1)－1 ≤ sinθ ≤ 1

    (2)－1 ≤ cosθ ≤ 1

    (3) $sin^{2}$θ＋$cos^{2}$θ＝1

    (4)若 cosθ≠0，則 tanθ有意義，且此時$\tan \theta =\frac{\sin \theta}{\cos \theta}$

    (5) sin（90°－θ）＝cosθ

    (6) cos（90°－θ）＝sinθ'
  options:
  - label: A
    content: 二個
  - label: B
    content: 三個
  - label: C
    content: 四個
  - label: D
    content: 五個
  - label: E
    content: 六個
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (1)～(6)均正確，故選(E)
