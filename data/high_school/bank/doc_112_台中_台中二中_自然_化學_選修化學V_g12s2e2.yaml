  stem: 治療流行性感冒的「克流感」是由八角的果實中，萃取出莽草酸，再經反應而製得的；莽草酸的結構為，下列有關莽草酸結構的敘述，何者正確？
  options:
  - label: A
    content: 分子式為$C_{7}H_{6}O_{5}$
  - label: B
    content: 分子中所有碳原子均在同一平面上
  - label: C
    content: 具有烯基可進行加成反應
  - label: D
    content: 加入氯化鐵溶液檢驗，呈紫色
  assets:
  - key: s1_1_f1
