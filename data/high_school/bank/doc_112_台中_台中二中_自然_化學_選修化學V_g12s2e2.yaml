  stem: 醇類反應的實驗裝置如附圖所示，加0.5克二鉻酸鉀晶體於3毫升2-丙醇中，搖盪試管，使其儘量溶解。在此溶液中加入3毫升1 M $H_{2}SO_{4}$後，加熱至85～90℃，並將所產生的蒸氣溶入3毫升冷水（以冰水冷卻）中。熱水浴溫度只要能使試管內的溶液繼續沸騰即可，避免溫度過高，且要注意防止逆流。下列敘述，哪些<u>錯誤</u>？
