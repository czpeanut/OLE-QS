  page: 6
  stem: '取4.4 mg的某一含碳、氫、氧的化合物甲，經完全燃燒後，得8.8 mg的$CO_{2}$及3.6 mg的$H_{2}$O。另取4.4 g的甲，在1.0 L的容器加熱，當完全氣化時，測得容器的溫度為127℃，壓力為1.64 atm。請回答下列問題

    (1) 寫出化合物甲的實驗式（1分）

    (2) 計算出化合物甲的分子量（2分）

    (3) 承畫出化合物甲之所有可能的結構異構物（3分）'
  answer:
  - (1)$C_{2}H_{4}$O (2)88
  answer_status: verified
  answer_source: answer_key
  explanation: 二氧化碳中的碳含量＝8.8×$\frac{12}{44}$＝2.4 mg；水中的氫含量＝3.6×$\frac{2}{18}$＝0.4 mg；氧重量＝4.4－2.4－0.4＝1.6 mg。故可知化合物中碳、氫、氧原子的莫耳數比＝$\frac{2.4}{12}$：$\frac{0.4}{1}\frac{1.6}{16}$＝2：4：1，實驗式為$C_{2}H_{4}$O。又由理想氣體方程式可得：1.64×1＝n×0.082×（127＋273），可得n＝0.05 mol。分子量＝88，分子式＝$C_{4}H_{8}O_{2}$。
