  stem: 利用柳酸與乙酐進行酯化反應，以少量濃硫酸作為催化劑，則可得到乙醯柳酸，乙醯柳酸又稱為阿司匹靈。實驗步驟如下： (I)在乾燥的10 mL試管內裝入2.0 mL乙酐。 (II)秤取約1.00克的柳酸，倒入試管中。 (III)試管中滴入3～5滴的濃硫酸，使柳酸完全溶解，混合均勻。 (IV)將試管置於70℃的熱水浴中15～20分鐘。 (V)將試管自熱水浴取出，靜置自然冷卻至室溫。 (VI)將溶液置於冰水浴，加入10 mL蒸餾水，以玻棒攪拌，使白色沉澱析出，再進行分離及純化 下列有關此反應的敘述，哪些正確？
  options:
  - label: A
    content: 實驗若使用乙酸作為反應物，一樣能順利合成阿司匹靈
  - label: B
    content: 步驟(III)加入濃硫酸的主要目的是為了移除反應所生成的水
  - label: C
    content: 步驟(IV)的熱水浴是為了加速反應進行
  - label: D
    content: 步驟(VI)表示阿司匹靈在低溫有較大的溶解度
  - label: E
    content: 將氯化鐵溶液加入產物的酒精溶液，若產生紫色，表示產物中有柳酸殘留
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)醯氯、酐的反應性遠大於羧酸，故使用乙酸為反應物，反應會很慢；(B)做為催化劑使用；(D)表示阿司匹靈溶解度差，會析出。故選(C)(E)。
