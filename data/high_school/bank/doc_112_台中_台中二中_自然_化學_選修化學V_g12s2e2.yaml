- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某一元羧酸與甲醇完全反應後，生成2.2克酯，以1 M NaOH(aq)40毫升使其完全水解，再以1 M HCl(aq)滴定過剩的鹼液，共耗去15毫升HCl(aq)，則該羧酸的分子式為何？
  options:
  - label: A
    content: $C_{3}H_{6}O_{2}$
  - label: B
    content: $C_{4}H_{8}O_{2}$
  - label: C
    content: $C_{4}H_{10}O_{2}$
  - label: D
    content: $C_{5}H_{10}O_{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 氫氧化鈉可催化酯類水解成羧酸、醇。隨後可再與水解的產物─羧酸進行中和反應。故可得知氫氧化鈉莫耳數＝羧酸莫耳數＋HCl莫耳數。可得0.04＝x＋0.015，得酯類莫耳數＝0.025 mol。酯類共2.2 g，故其分子量＝88。某酸與甲醇反應脫水得到此酯類，若酸分子量＝M，則可得知M＋32－18＝88，得到M＝74。故選(A)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: (1)甲酸 (2)甲醇 (3)甲胺 (4)甲醯胺 (5)甲醛 沸點的高低順序為：
  options:
  - label: A
    content: (1) > (2) > (3) >(4) > (5)
  - label: B
    content: (4) > (1) > (2) >(3) > (5)
  - label: C
    content: (4) > (1) > (3) >(2) > (5)
  - label: D
    content: (3) > (1) > (4) >(5) > (2)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 一般有機化合物分子量接近時，沸點高低：醯胺＞羧酸＞醇＞胺＞酮、醛、酯＞醚＞烴。故選(B)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 分子式為$C_{5}H_{10}O_{2}$的酯類，將其水解後的混合物與本氏液反應不會生成紅色沉澱。符合此性質的酯類共有幾種？
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '5'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 酯類水解後應得羧酸、醇。若不會與本氏液反應代表沒有醛基，代表羧酸不為甲酸。則有可能的組合為：（乙酸、正丙醇）、（乙酸、異丙醇）、（丙酸、乙醇）、（丁酸、甲醇）、（甲基丙酸、甲醇）五種。故選(D)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 3
  stem: 有關此邦克列酸的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 可被氧化劑再氧化
  - label: B
    content: 室溫下，該酸可與甲胺形成醯胺類的化合物
  - label: C
    content: 該物質為脂溶性
  - label: D
    content: 該酸具有立體異構物
  group_stem: '下圖為米酵菌酸（Bongkrek acid，目前衛福部更正名稱為邦克列酸）的結構式。根據該圖回答第7、第8題：

    該酸碳數28個，為一種強烈的粒線體呼吸毒素，多於穀物、椰子、食用菌等食物受致病型唐菖蒲伯克氏菌汙染後由該菌所分泌生成。'
  shared_asset: g1_7_8
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)具有雙鍵，可被氧化劑氧化；(B)室溫下反應較難進行；(C)碳數相當多，難溶於水，正確；(D)有許多雙鍵，具有順反異構物。故選(B)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 若W克的該酸與足量的Zn反應產生1莫耳的氫氣，則該邦克列酸的分子量為
  options:
  - label: A
    content: 0.5W
  - label: B
    content: W
  - label: C
    content: 1.5 W
  - label: D
    content: 3W
  group_stem: '下圖為米酵菌酸（Bongkrek acid，目前衛福部更正名稱為邦克列酸）的結構式。根據該圖回答第7、第8題：

    該酸碳數28個，為一種強烈的粒線體呼吸毒素，多於穀物、椰子、食用菌等食物受致病型唐菖蒲伯克氏菌汙染後由該菌所分泌生成。'
  shared_asset: g1_7_8
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 每mol羧基與Zn反應可產生0.5 mol的氫氣，故產生1 mol氫氣代表此化合物中共有2 mol羧基。設分子量為x，可列式：$\frac{W}{x}$×3＝2，x為1.5W。故選(C)。
