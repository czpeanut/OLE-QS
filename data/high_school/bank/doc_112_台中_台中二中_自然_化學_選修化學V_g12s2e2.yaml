      - 191.2
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為$C_{7}H_{10}O_{5}$；(B)環的結構中有些碳以$sp^{3}$混成軌域鍵結，故不為平面分子；(D)不具有苯環上的OH基，故無法。故選(C)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在下列反應的產物中加入斐林試液時，何者會產生紅色沉澱？
  options:
  - label: A
    content: 乙醛$\xrightarrow{K_{2}Cr_{2}O_{7} , H^{+} , 加熱}$
  - label: B
    content: 1-丙醇$\xrightarrow{K_{2}Cr_{2}O_{7} , H^{+} , 加熱}$
  - label: C
    content: 甲酸$\xrightarrow{K_{2}Cr_{2}O_{7} , H^{+} , 加熱}$
  - label: D
    content: 2-甲基-2-丙醇$\xrightarrow{Cu , 加熱}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)產物為乙酸；(B)產物為乙醛；(C)產物為二氧化碳；(D)不反應。醛類可與斐林試劑反應。故選(B)。
