- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 某生將7.4克的2-丁醇、2-甲基-2-丙醇的混合物完全氧化後，需使用0.500 M之$KMnO_{4}$酸性水溶液32 mL方能反應完，問2-丁醇含量為（％）？
  options:
  - label: A
    content: '20'
  - label: B
    content: '30'
  - label: C
    content: '40'
  - label: D
    content: '60'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 假設2-丁醇x mol、2-甲基-2-丙醇y mol，又此二醇類互為同分異構物，分子量皆為74。則x＋y＝0.1，又$2^{o}$醇氧化失去2個電子變為酮、$3^{o}$醇不氧化，得2x＝0.5×0.032×5＝0.08。x＝0.04，y＝0.06。故選(C)。
