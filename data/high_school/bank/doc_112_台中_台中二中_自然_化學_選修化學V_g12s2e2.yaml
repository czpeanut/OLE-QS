  stem: 有甲、乙、丙、丁、戊五種有機物（苯酚、乙酸、丙醇、苯、戊烯）。進行試驗結果如下： (I)甲、乙不與Na反應，其餘都反應。 (II)甲、乙各加數滴溴的四氯化碳溶液振盪，甲褪色、乙不褪色。 (III)丙與丁的混合物與濃硫酸共熱，能聞到水果香味。 (IV)丁能與$Na_{2}CO_{3}$反應，產生$CO_{2}$氣體。 (V)戊不溶於水，但易溶於強鹼性溶液中。 依上述資料判別，下列各化學式之配對哪些正確？
