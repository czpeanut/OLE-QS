  stem: 近日一名藝人分享一種珍珠奶茶的方法叫「混珍珠」，意指混合大珍珠與小珍珠並且請店員將珍珠再次過水，一方面可以滿足喝手搖飲料的慾望，二方面也能避免喝到過甜的飲料，另外將奶精改為鮮奶更為健康。此舉引發網友正反兩面討論，諸如：「改成鮮奶都可以加10元了，店員額外洗珍珠應可以增收5到10元的價格」、「這真是減重者的福音，這樣感覺健康多了」。從經濟學的角度，此案例可用下列何項說明較為合理？
  options:
