  section: 1
  number: 10
  type: single
  page: 2
  stem: 美華在上完公民課之後，仍然對消費者剩餘及生產者剩餘的定義不是很熟悉，因此他決定去問四位朋友，希望他們能以生活上的例子來解釋這兩個名詞。下列是四位朋友的解釋，誰說得最為正確？
  options:
  - label: A
    content: 凱利：當你買藍牙耳機的時候，你願意付的最高價格，跟老闆願意賣的最低價格的差距，就是消費者剩餘
  - label: B
    content: 阿肯：當你只有2千元，但你很想要的衣服只要1千元，多出來的那1千元就是消費者剩餘
  - label: C
    content: 范姊：當一盒骰子牛肉市面價格為120元，但老闆想賣的最高價格為150元，多出來的30元就是生產者剩餘
  - label: D
    content: 小迪：當你買一杯珍珠鮮奶茶是50元，但老闆想賣的最低價格是35元時，多出來的那15元就是生產者剩餘
