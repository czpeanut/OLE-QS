- id: doc_111_台中_興大附中_數學_數B_g11s1e2_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 最近陽光紫外線強烈，生產玻璃的幸福公司聲稱，他們的玻璃能隔絕掉光線中 50 ％的紫外線，若依幸福公司的說法，要使紫外線隔絕到原來的 1 ％以下（含），則理論上至少要＿＿＿＿層玻璃。
  answer:
  - '7'
  answer_status: verified
  answer_source: answer_key
  explanation: '設要 n 層玻璃，則

    $\left( \frac{1}{2} \right) ^{n}\leq\frac{1}{100}$

    ⇒ $2^{n}\geq$100，取 n＝7

    故至少要 7 層玻璃

    4.2 $log_{3}$y＝1 ⇒ $log_{3}$y＝$\frac{1}{2}$ ⇒ y＝$3^{\frac{1}{2}}$ ⇒ $y^{4}$＝$3^{2}$＝9

    $x^{\frac{-1}{3}}y^{4}$＝1 ⇒ $x^{\frac{-1}{3}}$＝$\frac{1}{9}$ ⇒ x＝$\left( \frac{1}{9} \right) ^{-3}$＝729

    故$\frac{x-y^{4}}{10}$＝$\frac{729-9}{10}$＝72

    5.設 A（t，logt），t≠0

    ∵$\overline{OA}$：$\overline{OB}$＝1：4 ∴B（4t，4 logt）

    ∵B 在 y＝logx 的圖形上 ∴4 logt＝log4t

    ⇒ $t^{4}$＝4t ⇒ $t^{3}$＝4 ⇒ t＝$2^{\frac{2}{3}}$，故 m＝$\frac{2}{3}$

    6.（1－r ％）$^{6}$＝70 ％

    ⇒ 1－r ％＝$0.7^{\frac{1}{6}}\approx$0.9423

    ⇒ r ％$\approx$0.0577 ⇒ r$\approx$5.8

    7.$\begin{cases}L (1)=a (1-10^{-b})=50 \ldots \ldots \ldots \ldots \ldots ① \\ L (2)=a (1-10^{-2b})=90\ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    $\frac{②}{①}$得$\frac{a (1-10^{-b})(1+10^{-b})}{a (1-10^{-b})}$＝$\frac{90}{50}$ ⇒ 1＋$10^{－b}$＝$\frac{9}{5}$ ⇒ $10^{－b}$＝$\frac{4}{5}$

    代入①得$a \left( 1-\frac{4}{5} \right)$＝50 ⇒ a＝250

    ∴L(3)＝250（1－$10^{－3b}$）＝250 $\left[ 1-\left( \frac{4}{5} \right) ^{3} \right]$＝250×$\frac{61}{125}$＝122

    故<u>小英</u>三星期可以背熟 122 個德文單字

    8.$log_{2}$x＋$log_{x}$2－4＝0

    ⇒ $\frac{\log x}{\log 2}$＋$\frac{\log 2}{\log x}$－4＝0 ⇒ $\left( \frac{\log x}{\log 2} \right) ^{2}$－4×$\frac{\log x}{\log 2}$＋1＝0 ⇒ （$log_{2}$x）$^{2}$－4 $log_{2}$x＋1＝0

    ∵α，β為方程式 $log_{2}$x＋$log_{x}$2－4＝0 的兩根

    得（$log_{2}$x－$log_{2}$α）（$log_{2}$x－$log_{2}$β）＝0

    ⇒ （$log_{2}$x）$^{2}$－（$log_{2}$α＋$log_{2}$β）$log_{2}$x＋$log_{2}$α×$log_{2}$β＝0

    ∴$\begin{cases}\log _{2}\alpha +\log _{2}\beta =4 \\ \log _{2}\alpha \times \log _{2}\beta =1\end{cases}$

    故 $log_{α}$β＋$log_{β}$α＝$\frac{\log \beta}{\log \alpha}$＋$\frac{\log \alpha}{\log \beta}$＝$\frac{\frac{\log \beta}{\log 2}}{\frac{\log \alpha}{\log 2}}$＋$\frac{\frac{\log \alpha}{\log 2}}{\frac{\log \beta}{\log 2}}$＝$\frac{\log _{2}\beta}{\log _{2}\alpha}$＋$\frac{\log _{2}\alpha}{\log _{2}\beta}$

    ＝$\frac{(\log _{2}\beta )^{2}+(\log _{2}\alpha )^{2}}{\log _{2}\alpha \times \log _{2}\beta}$＝$\frac{(\log _{2}\beta +\log _{2}\alpha )^{2}-2 \log _{2}\alpha \times \log _{2}\beta}{\log _{2}\alpha \times \log _{2}\beta}$

    ＝$\frac{4^{2}-2\times 1}{1}$＝14

    9.設 x 小時後，則 $2e^{－0.2x}$＜0.1

    ∵log（$2e^{－0.2x}$）＝log2＋$loge^{－0.2x}$＝log2－0.2x loge，log0.1＝－1

    ∴log2－0.2x loge＜－1

    ⇒ x＞$\frac{\log 2+1}{0.2 \log e}\approx\frac{1.3010}{0.2}$×$\frac{1}{\log e}\approx\frac{1.3010}{0.2}$×2.3＝14.9615

    取 x＝15

    故至少在 15 小時後，在身體內的殘餘量會低於 0.1 毫克

    10.$m_{1}$＝$\frac{\log _{a}5-\log _{a}2}{5-2}$＝$\frac{\frac{\log 5}{\log a}-\frac{\log 2}{\log a}}{3}$＝$\frac{\frac{\log \frac{5}{2}}{\log a}}{3}$＝$\frac{\log \frac{5}{2}}{3 \log a}$

