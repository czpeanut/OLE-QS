  stem: 已知點（a，b）是對數函數 y＝$log_{2}$x 圖形上的任一點，則下列哪些選項中的點也會在此 y＝$log_{2}$x 的圖形上？
  options:
  - label: A
    content: （10a，b＋1）
  - label: B
    content: （$a^{2}$，2b）
  - label: C
    content: （$\sqrt{a}$，$\sqrt{b}$）
  - label: D
    content: $\left( \frac{1}{a} , -b \right)$
  - label: E
    content: $\left( \frac{a}{4} , b-2 \right)$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '已知 b＝$log_{2}$a

    (A) ╳：$log_{2}$10a＝$\frac{\log 10a}{\log 2}$＝$\frac{\log a+\log 10}{\log 2}$＝$\frac{\log a}{\log 2}$＋$\frac{\log 10}{\log 2}$＝$log_{2}$a＋$log_{2}$10＝b＋$log_{2}$10≠b＋1

    (B) ○：$log_{2}a^{2}$＝$\frac{\log a^{2}}{\log 2}$＝$\frac{2 \log a}{\log 2}$＝2 $log_{2}$a＝2b

    (C) ╳：$\log _{2}\sqrt{a}$＝$\frac{\log \sqrt{a}}{\log 2}$＝$\frac{\frac{1}{2} \log a}{\log 2}$＝$\frac{1}{2}log_{2}$a＝$\frac{1}{2}$b≠$\sqrt{b}$

    (D) ○：$\log _{2}\frac{1}{a}$＝$\frac{\log \frac{1}{a}}{\log 2}$＝$\frac{-\log a}{\log 2}$＝－$log_{2}$a＝－b

    (E) ○：$\log _{2}\frac{a}{4}$＝$\frac{\log \frac{a}{4}}{\log 2}$＝$\frac{\log a-\log 4}{\log 2}$＝$log_{2}$a－$\frac{2 \log 2}{\log 2}$＝b－2

    故選(B)(D)(E)'
