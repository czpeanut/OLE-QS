  stem: 第 1 天獲得 1 元，第 2 天獲得 2 元，第 3 天獲得 4 元，第 4 天獲得 8 元，依此每天所獲得的錢為前一天的兩倍，如此進行到第 20 天，試問這 20 天所獲得的錢，總數最接近下列哪一個選項？
  options:
  - label: A
    content: 10,000 元
  - label: B
