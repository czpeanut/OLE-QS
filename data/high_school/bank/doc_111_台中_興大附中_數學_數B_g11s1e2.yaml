  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵β＝$a^{－α}$ ∴$log_{a}$β＝－α

    ⇒ α＝－$log_{a}$β＝$-\frac{\log \beta}{\log a}$＝$\frac{\log \frac{1}{\beta}}{\log a}$＝$\log _{a}\frac{1}{\beta}$ ⇒ （β，α）必為 y＝$\log _{a}\frac{1}{x}$ 圖形上的一點

    (B) ○：當 a＞1，直線 PQ 斜率必為正數

    (C) ○：∵$\frac{b}{a}$＜1＜$\frac{a}{b}$ ∴log$\frac{b}{a}$＜log$\frac{a}{b}$

    (D) ╳：$log_{a}$1＝$log_{b}$1＝0

    (E) ╳：反例：當 a＝4，b＝$\frac{1}{2}$時，$log_{4}\frac{1}{2}$＞$\log _{\frac{1}{2}}4$

    故選(A)(B)(C)'
