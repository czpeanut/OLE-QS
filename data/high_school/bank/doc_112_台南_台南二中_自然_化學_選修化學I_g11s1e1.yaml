  type: calc
  page: 4
  stem: '以0.5 M的NaOH(aq)滴定0.2 M的$CH_{3}$COOH(aq) 50 mL正好完全中和，試回答下列問題：

    (1) 0.5 M的NaOH(aq)所使用的體積為多少mL？

    (2) 若反應後溶液溫度上升1.9℃，則NaOH(aq)與$CH_{3}$COOH(aq)之中和熱為若干kJ／mol？（設各溶液比熱為1、比重為1 cal／g．℃，且體積可加成，1 cal＝4.18 J）'
  answer:
  - (1) 20 (3%) (2) 55.6 (3%)
  answer_status: verified
  answer_source: answer_key
  explanation: (1) 酸莫耳數＝鹼莫耳數 → 0.5V＝0.2×50，可得V＝20 mL。 (2) 體積共70 mL，故溶液＝70 g。由ΔH＝msΔT可得ΔH＝70×4.18×1.9＝556 J。此為0.01 mol的酸鹼中和所放的熱，故1 mol的酸鹼中和可放熱55600 J＝55.6 kJ。
