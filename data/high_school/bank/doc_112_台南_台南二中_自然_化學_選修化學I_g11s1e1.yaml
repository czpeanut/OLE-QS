  type: calc
  page: 3
  stem: '某混合氣體中含有$CH_{4}$、CO、$H_{2}$，試依據下列實驗結果(Ⅰ)～(Ⅳ)，回答相關問題。 (Ⅰ)混合氣體在STP下的體積為8.96升。 (Ⅱ)混合氣體完全燃燒後，共得0.3莫耳$H_{2}$O、0.3莫耳$CO_{2}$。 (Ⅲ)已知一些熱化學反應： $H_{2}$(g)＋$\frac{1}{2}O_{2}$(g)$^{ }$→$^{ }H_{2}$O(l)＋285 kJ C(s)＋$O_{2}$(g) → $CO_{2}$(g)＋394 kJ CO(g)＋$\frac{1}{2}O_{2}$(g)$^{ }$→$^{ }CO_{2}$(g)＋280 kJ (Ⅳ)甲烷的莫耳生成熱為－75 kJ／mol。

    (1) 寫出$CH_{4}$完全燃燒的熱化學反應式。（須標註狀態及反應熱）

    (2) 寫出混合氣體中各氣體的莫耳數。

    (3) 混合氣體完全燃燒時共放熱多少千焦？'
  explanation: (1) 注意狀態須為25 ℃下的狀態，甲烷燃燒熱＝(二氧化碳生成熱＋2×水生成熱)－(甲烷生成熱)＝(－394)＋2×(－285)－(－75)＝－889 kJ／mol。 (2) 假設甲烷＝x mol、一氧化碳＝y mol、氫氣＝z mol。則x＋y＋z＝0.4 （8.96 L氣體在STP下相當於0.04 mol） 完全燃燒後可得到x＋y mol的二氧化碳、2x＋z mol的水，故x＋y＝0.3、2x＋z＝0.3。可解得x＝z＝0.1、y＝0.2。 (3) 甲烷燃燒熱＝－889 kJ／mol、一氧化碳燃燒熱＝－280 kJ／mol、氫氣燃燒熱＝－285 kJ／mol。故燃燒放熱＝0.1×889＋0.2×280＋0.1×285＝173.4 kJ。
