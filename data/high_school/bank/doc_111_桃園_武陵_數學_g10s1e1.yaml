  answer:
  - $\frac{x^{2}+12}{4x^{2}-16}$
  answer_status: verified
  answer_source: answer_key
  explanation: 設$\begin{cases}a=x-2 \\ b=x+2\end{cases}\Rightarrow$ 4＝b－a $\Rightarrow$ 原式＝$\sqrt{\frac{1}{a^{2}}+\frac{1}{b^{2}}+\frac{1}{(b-a)^{2}}}$＝$\sqrt{\frac{(a^{2}+b^{2})(b-a)^{2}+a^{2}b^{2}}{a^{2}b^{2}(b-a)^{2}}}$＝$\sqrt{\frac{(a^{2}+b^{2})(a^{2}+b^{2}-2ab)+a^{2}b^{2}}{a^{2}b^{2}(b-a)^{2}}}$＝$\sqrt{\frac{(a^{2}+b^{2})^{2}-2ab(a^{2}+b^{2})+a^{2}b^{2}}{a^{2}b^{2}(b-a)^{2}}}$＝$\sqrt{\frac{(a^{2}+b^{2}-ab)^{2}}{[ab(b-a)]^{2}}}$＝$\frac{|a^{2}+b^{2}-ab|}{ab(b-a)}$＝$\frac{|(a+b)^{2}-3ab|}{4ab}$＝$\frac{4x^{2}-3(x^{2}-4)}{4(x^{2}-4)}$＝$\frac{x^{2}+12}{4x^{2}-16}$。
- id: doc_111_桃園_武陵_數學_g10s1e1_s3_1
