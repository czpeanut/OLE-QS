  stem: 影印店中常用的最大影印紙是A3，將長邊對折裁成兩半後就是家中印表機的A4影印紙。用相同方法把A4再裁一半，就是A5以此類推。 A.(計算題)已知A3，A4，…這類型號的影印紙的長寬比例，對半裁切後依然維持相同的長寬比。請問長與寬的比值必須要是多少？ B.(計算題)A5紙的寬度約為14.85公分，估計A3紙的長度約為多少公分 [$\sqrt{2}$ ≈ 1.414 , $\sqrt{3}$ ≈ 1.732 , $\frac{\sqrt{5}+1}{2}$ ≈ 1.618](計算時使用題目給的數值位數，取答案時四捨五入至3位有效數字)
  answer:
  - A. 4% B. 6%
  answer_status: verified
  answer_source: answer_key
