- id: doc_111_桃園_武陵_數學_g10s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設p、q為實數，下列選項哪些正確？
  options:
  - label: A
    content: 若p＜q，p、q為有理數，至少有一有理數r使得p＜r＜q。
  - label: B
    content: 若p＜q，p、q為無理數，至少有一有理數r使得p＜r＜q。
  - label: C
    content: 若p為無理數，p＞0，則$p^{\frac{1}{2}}$為無理數。
  - label: D
    content: 若$p^{2}$為無理數，$p^{3}$為無理數。
  - label: E
    content: 若p為無理數，q為有理數，則$\frac{7p+q}{8}$為無理數。
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：有理數具有稠密性。 (B) ○：設a，b均為有理數，且p＜a＜b＜q，由稠密性可知至少有一有理數r使得a＜r＜b，即p＜r＜q。 (C) ○：設$p^{\frac{1}{2}}$為有理數，可知p＝($p^{\frac{1}{2}}$)$^{2}\in$Q (矛盾)，所以p為無理數。 (D) ×：反例：p＝$\sqrt[3]{2}\Rightarrow$ $p^{2}$＝$\sqrt[3]{4}$為無理數，但$p^{3}$＝2為有理數。 (E) ○：可知7p為無理數，所以7p＋q為無理數 $\Rightarrow\frac{7p+q}{8}$為無理數。 故選(A)(B)(C)(E)。
- id: doc_111_桃園_武陵_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列關於2的次方的運算哪些正確？
  options:
  - label: A
    content: $2^{2}$＋$2^{1}$＝$2^{3}$
  - label: B
    content: $2^{\frac{1}{2}}$－$2^{\frac{1}{2}}$＝$2^{0}$
  - label: C
    content: $2^{\frac{1}{2}}$＝$2^{－1}$
  - label: D
    content: ($2^{x}$)$^{2}$＝($4^{x}$)
  - label: E
    content: $2^{\sqrt{2}}$＋$2^{\sqrt{2}}$＝$2^{\sqrt{2}+1}$
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：$2^{2}$＋$2^{1}$＝6，$2^{3}$＝8 $\Rightarrow$ $2^{2}$＋$2^{1}$≠$2^{3}$。 (B) ×：$2^{\frac{1}{2}}$－$2^{\frac{1}{2}}$＝0，$2^{0}$＝1 $\Rightarrow2^{\frac{1}{2}}$－$2^{\frac{1}{2}}$≠$2^{0}$。 (C) ×：$2^{\frac{1}{2}}$＝$\sqrt{2}$，$2^{－1}$＝$\frac{1}{2}\Rightarrow2^{\frac{1}{2}}$≠$2^{－1}$。 (D) ○：($2^{x}$)$^{2}$＝$2^{2x}$＝($2^{2}$)$^{x}$＝$4^{x}$。 (E) ○：$2^{\sqrt{2}}$＋$2^{\sqrt{2}}$＝2×$2^{\sqrt{2}}$＝$2^{\sqrt{2}+1}$。 故選(D)(E)。
- id: doc_111_桃園_武陵_數學_g10s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 下列選項哪些正確？
  options:
  - label: A
    content: $\sqrt{15}$－$\sqrt{14}$＞$\sqrt{30}$－$\sqrt{29}$
  - label: B
    content: $\sqrt{30}$－$\sqrt{28}$＞$\sqrt{15}$－$\sqrt{14}$
  - label: C
    content: $\sqrt{1}$＋$\sqrt{2}$－$\sqrt{3}$＞$\sqrt{2}$＋$\sqrt{3}$－$\sqrt{4}$
  - label: D
    content: 3＋$\sqrt{18}$＞4＋$\sqrt{11}$
  - label: E
    content: $\sqrt{20}$＋$\sqrt{27}$＞$\sqrt{18}$＋$\sqrt{30}$
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：$\sqrt{15}$－$\sqrt{14}$＝$\frac{1}{\sqrt{15}+\sqrt{14}}$，$\sqrt{30}$－$\sqrt{29}$＝$\frac{1}{\sqrt{30}+\sqrt{29}}$，因為$\sqrt{30}$＞$\sqrt{15}$，$\sqrt{29}$＞$\sqrt{14}$， 所以$\sqrt{15}$＋$\sqrt{14}$＜$\sqrt{30}$＋$\sqrt{29}\Rightarrow\frac{1}{\sqrt{15}+\sqrt{14}}$＞$\frac{1}{\sqrt{30}+\sqrt{29}}\Rightarrow\sqrt{15}$－$\sqrt{14}$＞$\sqrt{30}$－$\sqrt{29}$。 (B) ○：$\sqrt{30}$－$\sqrt{15}$＝$\sqrt{15}$($\sqrt{2}$－1 )＞$\sqrt{14}$($\sqrt{2}$－1 )＝$\sqrt{28}$－$\sqrt{14}\Rightarrow\sqrt{30}$－$\sqrt{28}$＞$\sqrt{15}$－$\sqrt{14}$。 (C) ×：$\sqrt{1}$＋$\sqrt{4}$＝1＋2＝3＝$\sqrt{9}$＜$\sqrt{12}$＝$2\sqrt{3}\Rightarrow\sqrt{1}$－$\sqrt{3}$＜$\sqrt{3}$－$\sqrt{4}\Rightarrow\sqrt{1}$＋$\sqrt{2}$－$\sqrt{3}$＜$\sqrt{2}$＋$\sqrt{3}$－$\sqrt{4}$。 (D) ×：( 3＋$\sqrt{18}$)$^{2}$＝27＋$2\sqrt{162}$，( 4＋$\sqrt{11}$)$^{2}$＝27＋$2\sqrt{176}$， 所以( 3＋$\sqrt{18}$)$^{2}$＜( 4＋$\sqrt{11}$)$^{2}$ $\Rightarrow$ 3＋$\sqrt{18}$＜4＋$\sqrt{11}$。 (E) ×：($\sqrt{20}$＋$\sqrt{27}$)$^{2}$＝47＋$2\sqrt{540}$，($\sqrt{18}$＋$\sqrt{30}$)$^{2}$＝48＋$2\sqrt{540}$，
    所以($\sqrt{20}$＋$\sqrt{27}$)$^{2}$＜($\sqrt{18}$＋$\sqrt{30}$)$^{2}$ $\Rightarrow\sqrt{20}$＋$\sqrt{27}$＜$\sqrt{18}$＋$\sqrt{30}$。 故選(A)(B)。
- id: doc_111_桃園_武陵_數學_g10s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 下列選項哪些正確？
  options:
  - label: A
    content: log$\frac{1}{\sqrt{10}}$＝$\frac{-1}{2}$
  - label: B
    content: log 123＞2
  - label: C
    content: 0＜log a＜3，則1＜a＜999
  - label: D
    content: $10^{\log \frac{1}{10}}$＝－1
  - label: E
    content: $100^{log 3}$＝$10^{2log 3}$＝($10^{log 3}$)$^{2}$＝9
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：$\log \frac{1}{\sqrt{10}}$＝$\log 10^{\frac{-1}{2}}$＝$\frac{-1}{2}$。 (B) ○：10 $^{log 123}$＝123＞100＝$10^{2}$ $\Rightarrow$ log 123＞2。 (C) ×：0＜log a＜3 $\Rightarrow$ $10^{0}$＜$10^{log a}$＜$10^{3}$ $\Rightarrow$ 1＜a＜1000。 (D) ×：$10^{\log \frac{1}{10}}$＝$\frac{1}{10}$＝$10^{－1}$。 (E) ○：$100^{log 3}$＝($10^{2}$)$^{log 3}$＝$10^{2 log 3}$＝($10^{log 3}$)$^{2}$＝$3^{2}$＝9。 故選(A)(B)(E)。
- id: doc_111_桃園_武陵_數學_g10s1e1_s2_1
  section: 2
  number: 1
