  page: 1
  stem: 已知x＋$\frac{2}{x}$＝$\sqrt{10}$，求$\frac{x^{3}}{8}$＋$\frac{1}{x^{3}}$之值。＿＿＿＿
  answer:
  - $\frac{\sqrt{10}}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: x＋$\frac{2}{x}$＝$\sqrt{10}\Rightarrow\frac{x}{2}$＋$\frac{1}{x}$＝$\frac{\sqrt{10}}{2}\Rightarrow$ ($\frac{x}{2}$)$^{2}$＋($\frac{1}{x}$)$^{2}$＝($\frac{x}{2}$＋$\frac{1}{x}$)$^{2}$－2×$\frac{x}{2}$×$\frac{1}{x}$＝$\frac{5}{2}$－1＝$\frac{3}{2}$， 故$\frac{x^{3}}{8}$＋$\frac{1}{x^{3}}$＝($\frac{x}{2}$)$^{3}$＋($\frac{1}{x}$)$^{3}$＝($\frac{x}{2}$＋$\frac{1}{x}$)[($\frac{x}{2}$)$^{2}$－$\frac{x}{2}$．$\frac{1}{x}$＋($\frac{1}{x}$)$^{2}$]＝$\frac{\sqrt{10}}{2}$×($\frac{3}{2}$－$\frac{1}{2}$)＝$\frac{\sqrt{10}}{2}$。
- id: doc_111_桃園_武陵_數學_g10s1e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: x為整數且滿足 | x－2－$\sqrt{3}$ |＋| x－5 |＝3－$\sqrt{3}$，求x的值。＿＿＿＿
  answer:
  - 4 , 5
  answer_status: verified
  answer_source: answer_key
  explanation: 討論如下 ( i ) x ≥ 5時，( x－2－$\sqrt{3}$ )＋( x－5 )＝3－$\sqrt{3}\Rightarrow$ 2x＝10 $\Rightarrow$ x＝5。 ( ii ) 2＋$\sqrt{3}$＜x＜5時，( x－2－$\sqrt{3}$ )＋( 5－x )＝3－$\sqrt{3}\Rightarrow$ 0x＝0 $\Rightarrow$ 2＋$\sqrt{3}$＜x＜5，又x$\in$Z，所以x＝4。 ( iii ) x ≤ 2＋$\sqrt{3}$時，( 2＋$\sqrt{3}$－x )＋( 5－x )＝3－$\sqrt{3}\Rightarrow$ 2x＝4＋$2\sqrt{3}\Rightarrow$ x＝2＋$\sqrt{3}$(不合)。 故x＝4 , 5。
