  stem: x＝$\frac{\sqrt{2}+1}{\sqrt{2}-1}$，求$x^{4}$－$\frac{1}{x^{4}}$＝＿＿＿＿。
  answer:
  - $816\sqrt{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: 因為x＋$\frac{1}{x}$＝$\frac{\sqrt{2}+1}{\sqrt{2}-1}$＋$\frac{\sqrt{2}-1}{\sqrt{2}+1}$＝($\sqrt{2}$＋1 )$^{2}$＋($\sqrt{2}$－1 )$^{2}$＝6，x－$\frac{1}{x}$＝$\frac{\sqrt{2}+1}{\sqrt{2}-1}$－$\frac{\sqrt{2}-1}{\sqrt{2}+1}$＝($\sqrt{2}$＋1 )$^{2}$－($\sqrt{2}$－1 )$^{2}$＝$4\sqrt{2}$， 所以$x^{2}$＋$\frac{1}{x^{2}}$＝( x＋$\frac{1}{x}$)$^{2}$－2＝36－2＝34 $\Rightarrow$ $x^{4}$－$\frac{1}{x^{4}}$＝($x^{2}$－$\frac{1}{x^{2}}$)($x^{2}$＋$\frac{1}{x^{2}}$)＝( x－$\frac{1}{x}$)( x＋$\frac{1}{x}$)($x^{2}$＋$\frac{1}{x^{2}}$)＝$4\sqrt{2}$×6×34＝$816\sqrt{2}$
- id: doc_111_桃園_武陵_數學_g10s1e1_s2_5
