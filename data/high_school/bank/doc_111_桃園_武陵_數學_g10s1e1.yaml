  stem: (多選題)1624年，布里格斯所發表的著作《對數算數》中，提到了一種計算log 2的方法。他首先算出10的平方根、4次方根、8次方根…得到下表 由於$10^{\frac{1}{4}}$＜2＜$10^{\frac{1}{2}}$，他假設2＝$10^{\frac{1}{4}}$×a，然後計算出a的近似值a＝$\frac{2}{10^{\frac{1}{4}}}$ ≈ 1.12468， 由於$10^{\frac{1}{32}}$＜a＜$10^{\frac{1}{16}}$，假設a＝$10^{\frac{1}{32}}$×b，然後計算出b的近似值……依此方法一直做下去 2＝$10^{\frac{1}{4}}$×a＝$10^{\frac{1}{4}}$×$10^{\frac{1}{32}}$×$10^{\frac{1}{64}}$×$10^{\frac{1}{256}}$×d＝…由於d是一個非常接近1的數 2 ≈ $10^{\frac{1}{4}}$×$10^{\frac{1}{32}}$×$10^{\frac{1}{64}}$×$10^{\frac{1}{256}}$＝$10^{\frac{77}{256}}$，所以log 2 ≈ $\frac{77}{256}$ ≈ 0.3007…
  options:
