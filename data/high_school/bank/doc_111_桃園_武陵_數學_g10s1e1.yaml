  stem: 解不等式 | 2x－1 |＞x－6，解x的範圍並以區間表示。＿＿＿＿
  answer:
  - ($-\infty , \infty$)
  answer_status: verified
  answer_source: answer_key
  explanation: 討論如下： ( i ) x ≥ $\frac{1}{2}$時，2x－1＞x－6 $\Rightarrow$ x＞－5 $\Rightarrow$ x ≥ $\frac{1}{2}$， ( ii ) x＜$\frac{1}{2}$時，1－2x＞x－6 $\Rightarrow$ 3x＜7 $\Rightarrow$ x＜$\frac{7}{3}\Rightarrow$ x＜$\frac{1}{2}$， 故所求為 ($-\infty , \infty$)。
- id: doc_111_桃園_武陵_數學_g10s1e1_s2_6
  section: 2
  number: 6
  type: fill
  page: 1
  stem: 已知2( log x )$^{2}$＋3 log x＋2是正數，求2( log x )$^{2}$＋3 log x＋2＋$\frac{16}{2(\log x)^{2}+3 \log x+2}$＋8的最小值＿＿＿＿求發生最小值的x值，x＝＿＿＿＿。
  answer:
  - (1)16；(2)$\frac{1}{100} , \sqrt{10}$
  answer_status: verified
  answer_source: answer_key
  explanation: 由算幾不等式可知$\frac{[2(\log x)^{2}+3 \log x+2]+\frac{16}{2(\log x)^{2}+3 \log x+2}}{2}$ ≥ $\sqrt{[2(\log x)^{2}+3 \log x+2]\times \frac{16}{2(\log x)^{2}+3 \log x+2}}$＝4 $\Rightarrow$ 2( log x )$^{2}$＋3 log x＋2＋$\frac{16}{2(\log x)^{2}+3 \log x+2}$＋8 ≥ 8＋8＝16， 其中當2( log x )$^{2}$＋3 log x＋2＝$\frac{16}{2(\log x)^{2}+3 \log x+2}$時，等號成立， 可知2( log x )$^{2}$＋3 log x＋2＝4 $\Rightarrow$ 2( log x )$^{2}$＋3 log x－2＝0 $\Rightarrow$ ( 2 log x－1 )( log x＋2 )＝0 $\Rightarrow$ log x＝－2或$\frac{1}{2}\Rightarrow$ x＝$10^{－2}$或$10^{\frac{1}{2}}$， 故x＝$\frac{1}{100}$或$\sqrt{10}$時，有最小值16。
