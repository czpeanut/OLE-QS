  stem: 歸納全球的降雨季節分布可分為 4 種：全年有雨、全年乾旱、夏雨冬乾、冬雨夏乾。請問下列哪一組的降雨季節分布相同？
  options:
  - label: A
    content: 熱帶莽原、熱帶沙漠
  - label: B
    content: 溫帶海洋性、溫帶地中海型
  - label: C
    content: 溫帶地中海型、熱帶莽原
  - label: D
    content: 熱帶雨林、溫帶海洋性
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 全年有雨：熱帶雨林氣候、溫帶海洋性氣候；全年乾旱：沙漠區、高緯區；夏雨冬乾：熱帶莽原氣候、季風氣候、溫帶大陸性氣候；冬雨夏乾：溫帶地中海型氣候。故選(D)。
- id: doc_112_新北_新北高中_社會_地理_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 4
  stem: 4 位同學上臺報告冰河作用的特色。下列何者的報告內容最合理？
  options:
  - label: A
    content: 甲生：高緯度地區才能看到冰河作用
  - label: B
    content: 乙生：冰河挾帶的岩塊也會對岩床進行磨蝕，形成冰積地形
  - label: C
    content: 丙生：一定厚度的冰層受壓力和重力影響而移動即稱冰河
  - label: D
    content: 丁生：冰河堆積物與其他外營力所形成的堆積物相較，層次較為分明
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)冰河可見於高緯度和高山地區，因此不論任何地區，只要地勢超過一定高度且降水充沛都可能會出現冰河地形。(B)冰河挾帶的岩塊也會對岩床進行磨蝕，形成冰蝕地形。(D)冰河堆積物與其他外營力所形成的堆積物相較，淘選度較差，顆粒大小混雜。
