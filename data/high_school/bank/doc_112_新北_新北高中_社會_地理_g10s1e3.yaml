  group_stem: 右圖為北半球某地區，a、b、c 代表 7 月的等溫線，甲～丁表示位於海洋或陸地的 4 個地點。請問：
  shared_asset: g2_45_46
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '愈往北邊緯度愈高，氣溫愈低。由此可知，a、b、c 等溫線的溫度由高到低為 c → b → a，(A)甲點位於 a 的北側，溫度為 4 地中最低的。

    46.7 月分為北半球夏季，受海陸性質影響，同緯度地區陸地溫度比海洋溫度高。在畫一條水平線經過海岸線的兩側，可知灰色區域的溫度較同緯度白色區域高溫，由此推論灰色的乙丁應為陸地、白色的(B)甲丙應為海洋。

    47.1 月均溫約在 5 ℃左右，為暖溫帶的特色，7 月高溫多在 20 ℃以內，此氣候年溫差小，最有可能為(C)溫帶海洋性氣候。(A)熱帶莽原最冷月均溫大於 18 ℃。(B)溫帶大陸性氣候最冷月均溫小於 0 ℃。(D)熱帶高地日溫差大、年溫差小，全年氣溫涼爽。

    48.溫帶海洋性氣候終年盛行西風，再加上沿海有暖流流經，形成暖溼、年溫差較小的氣候型態。由上述可知(A)地形平坦非影響因素。

    49.(C) 2 個相鄰的自然景觀帶之間的變化，通常為漸進式的轉化，彼此間並沒有固定或明顯的界線。每個自然景觀帶都有一定的熱量和水分組合，以及有其代表性的植被和土壤類型，更重要的是，(甲)都有一種最占優勢的特有景觀；(丁)由於植被類型經常是最具優勢的景觀特徵，所以自然景觀帶常以植被類型為名。(乙)兩個不同的自然景觀帶，其熱量與降水組合也不同；(丙)景觀帶間沒有固定或明顯的界線。

    50.(D)甲為熱帶季風雨林，受到降水夏雨冬乾的特性影響，冬季會有短暫的乾季，造成落葉的特性。

    51.(B)缺水區，蒸發散旺盛。(C)副熱帶高壓區：蒸發散量大於降水量、極地高壓區：蒸發散量約等於降水量。(D)低壓區，氣流多上升。

    52.(D)為副極地大陸氣候，因位於寒帶地區，蒸發弱，降水量少，最接近「水平衡」。(A)為熱帶雨林氣候。(B)為熱帶季風氣候。(C)為溫帶地中海型氣候。

    53.(C)因受副熱帶高壓帶籠罩影響，氣流下沉增溫，天氣晴朗不易降水，蒸發散量大。'
