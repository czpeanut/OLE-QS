  stem: 行星風系乃以全球為範圍，風向恆定的理想風系。此理想風系的提出，主要考量下列哪 2 項因素對行星大氣環流的影響？(甲)太陽照射(乙)海陸分布(丙)地球公轉(丁)地球自轉
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 甲丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 理想的行星風系形成包含 3 大假設與 2 項影響因素。3 大假設為地軸不傾斜、地表無海陸差異、地勢無高低差異。(D)影響因素：(甲)日照與(丁)地球自轉偏向力（科氏力）。
