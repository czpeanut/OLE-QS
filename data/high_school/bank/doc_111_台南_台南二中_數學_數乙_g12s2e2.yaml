  stem: 已知 i＝$\sqrt{-1}$，則$\frac{101}{i^{101}}+\frac{102}{i^{102}}+\frac{103}{i^{103}}+\frac{104}{i^{104}}$＝＿＿＿＿。
  answer:
  - 2＋2i
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$i^{101}$＝i，$i^{102}$＝$i^{2}$＝－1，$i^{103}$＝$i^{3}$＝－i，$i^{104}$＝$i^{4}$＝1

    所求為$\frac{101}{i}+\frac{102}{( -1 )}+\frac{103}{( -i )}+\frac{104}{1}$＝（－101i）－102＋103i＋104＝2＋2i'
- id: doc_111_台南_台南二中_數學_數乙_g12s2e2_s3_2
  section: 3
  number: 2
  type: fill
  page: 1
  stem: 設 a，b 為實數，若 a－2b＋3＋（2a－b－1）i＝3＋4i，則數對（a，b）＝＿＿＿＿。
  answer:
  - $\left( \frac{10}{3} , \frac{5}{3} \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵a－2b＋3＋（2a－b－1）i＝3＋4i

    ∴$\begin{cases}a - 2b + 3 = 3 \\ 2a -b - 1 = 4\end{cases}\Rightarrow\begin{cases}a - 2b = 0 \\ 2a -b = 5\end{cases}$

    可解得 a＝$\frac{10}{3}$，b＝$\frac{5}{3}$

    故數對（a，b）＝$\left( \frac{10}{3} , \frac{5}{3} \right)$

    3.2－3i＝$\frac{18 +bi}{a + 4i}$

    $\Rightarrow$（2－3i）（a＋4i）＝18＋bi

    $\Rightarrow$（2a＋12）＋（8－3a）i＝18＋bi

    $\begin{cases}2a + 12 = 18 \\ 8 - 3a =b\end{cases}$，可解得 a＝3，b＝－1

    故數對（a，b）＝（3，－1）

    4.∵$\frac{1 +i}{4 + 3i}$＝$\frac{1 +i}{4 + 3i}\times \frac{4 - 3i}{4 - 3i}$＝$\frac{7 +i}{25}$＝$\frac{7}{25}+\frac{1}{25}i$

    故共軛複數為$\frac{7}{25}-\frac{1}{25}i$

    5.設 8－6i 的平方根為 a＋bi，其中 a，b 為實數

    則（a＋bi）$^{2}$＝8－6i

    $\Rightarrow$（$a^{2}$－$b^{2}$）＋2abi＝8－6i

    $\Rightarrow\begin{cases}a^{2}-b^{2}= 8 \ldots \ldots \ldots \ldots \ldots ① \\ 2ab =-6 \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由②可知 b＝$-\frac{3}{a}$代入①得

    $a^{2}- \left( -\frac{3}{a} \right) ^{2}$＝8

    $\Rightarrowa^{2}-\frac{9}{a^{2}}$＝8

    $\Rightarrowa^{4}$－$8a^{2}$－9＝0

    $\Rightarrow$（$a^{2}$－9）（$a^{2}$＋1）＝0

    $\Rightarrowa^{2}$＝9 或 $a^{2}$＝－1（不合）

    $\Rightarrow$a＝± 3

    當 a＝3，則 b＝－1

    當 a＝－3，則 b＝1

    故所求為 3－i 或－3＋i

    6.∵x，y 為實數，x＋y＋i＝－10＋xyi

    ∴$\begin{cases}x +y =-10 \\ xy = 1\end{cases}$且 x＜0，y＜0

    $( \sqrt{x} +\sqrt{y} )^{2}$

    ＝$( \sqrt{x} )^{2}+ 2 \cdot \sqrt{x} \cdot \sqrt{y} +( \sqrt{y} )^{2}$

    ＝（x＋y）－$2\sqrt{xy}$

    ＝－10－2＝－12

    7.z＝$\frac{1 + 2i}{a -i}\times \frac{a +i}{a +i}$＝$\frac{( a - 2 )+( 1 + 2a )i}{a^{2}+ 1}$

    ∵z＝$\overline{z}$ ∴$\left( \frac{a - 2}{a^{2}+ 1} \right) + \left( \frac{1 + 2a}{a^{2}+ 1} \right) i$＝$\left( \frac{a - 2}{a^{2}+ 1} \right) - \left( \frac{1 + 2a}{a^{2}+ 1} \right) i$

    $\Rightarrow$1＋2a＝－1－2a$\Rightarrow$4a＝－2$\Rightarrow$a＝$-\frac{1}{2}$

    8.正六邊形的邊長即$( -3\sqrt{3} , 11 )$到$( 4\sqrt{3} , 10 )$之距離

    故所求為$\sqrt{( -3\sqrt{3} - 4\sqrt{3} )^{2}+( 11 - 10 )^{2}}$＝$\sqrt{148}$＝$2\sqrt{37}$

    9.$\left| \frac{( 1 - 5i )^{2} ( 2 - 2i )}{( 3 - 4i ) ( -2 + 3i )^{2}} \right|$

    ＝$\left| \frac{( -24 - 10i ) ( 2 - 2i )}{( 3 - 4i ) ( -5 - 12i )} \right|$

    ＝$\frac{| -24 - 10i | \cdot | 2 - 2i |}{| 3 - 4i | \cdot | -5 - 12i |}$

    ＝$\frac{26\times 2\sqrt{2}}{5\times 13}$

    ＝$\frac{4\sqrt{2}}{5}$

    10.∣z－2＋3i∣＝2$\Rightarrow$∣z－（2－3i）∣＝2

    可視為平面上，所有到點（2，－3）之距離為 2 的點，其軌跡為一圓

    ∴圓方程式為（x－2）$^{2}$＋（y＋3）$^{2}$＝4'
