- id: doc_111_台南_台南二中_數學_數乙_g12s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列各式何者正確？
  options:
  - label: A
    content: $\sqrt{-2}\times \sqrt{3}$＝$\sqrt{( -2 ) \times 3}$
  - label: B
    content: $\sqrt{-2}\times \sqrt{-3}$＝$\sqrt{( -2 ) \times ( -3 )}$
  - label: C
    content: $\frac{\sqrt{-2}}{\sqrt{-3}}$＝$\sqrt{\frac{-2}{-3}}$
  - label: D
    content: $\frac{\sqrt{2}}{\sqrt{-3}}$＝$\sqrt{\frac{2}{-3}}$
    asset:
      key: s2_1_optD
      file: doc_111_台南_台南二中_數學_數乙_g12s2e2/s2_1_optD.png
      crop:
        page: 1
        rect:
        - 458.85
        - 464.2
        - 564.25
        - 559.1
  - label: E
    content: $\frac{\sqrt{-2}}{\sqrt{3}}$＝$\sqrt{\frac{-2}{3}}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\sqrt{-2}\times \sqrt{3}$＝$\sqrt{2} i\times \sqrt{3}$＝$\sqrt{6} i$

    $\sqrt{( -2 ) \times 3}$＝$\sqrt{-6}$＝$\sqrt{6} i$

    (B)╳：$\sqrt{-2}\times \sqrt{-3}$＝$( \sqrt{2} i ) \times ( \sqrt{3} i )$＝$-\sqrt{6}$

    $\sqrt{( -2 ) \times ( -3 )}$＝$\sqrt{6}$

    (C)○：$\frac{\sqrt{-2}}{\sqrt{-3}}$＝$\frac{\sqrt{2} i}{\sqrt{3} i}$＝$\sqrt{\frac{2}{3}}$

    $\sqrt{\frac{-2}{-3}}$＝$\sqrt{\frac{2}{3}}$

    (D)╳：$\frac{\sqrt{2}}{\sqrt{-3}}$＝$\frac{\sqrt{2}}{\sqrt{3} i}\times \frac{i}{i}$＝$\frac{\sqrt{2} i}{-\sqrt{3}}$＝$-\sqrt{\frac{2}{3}} i$

    $\sqrt{\frac{2}{-3}}$＝$\sqrt{\frac{2}{3}} i$

    (E)○：$\frac{\sqrt{-2}}{\sqrt{3}}$＝$\frac{\sqrt{2} i}{\sqrt{3}}$＝$\sqrt{\frac{2}{3}} i$

    $\sqrt{\frac{-2}{3}}$＝$\sqrt{\frac{2}{3}} i$

    故選(A)(C)(E)'
- id: doc_111_台南_台南二中_數學_數乙_g12s2e2_s3_1
