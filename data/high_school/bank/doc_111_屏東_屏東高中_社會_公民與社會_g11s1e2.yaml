- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 臺灣曾經是鞋子王國，現在則是資訊產品王國。下列何者可以說明此種轉變？
  options:
  - label: A
    content: 鞋子的機會成本降低，資訊產品的比較利益增加
  - label: B
    content: 鞋子的機會成本增加，資訊產品的比較利益下降
  - label: C
    content: 鞋子的比較利益降低，資訊產品的機會成本下降
  - label: D
    content: 鞋子的比較利益增加，資訊產品的機會成本增加
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 國際貿易要選擇機會成本低，具比較利益的產品，所以臺灣鞋子現在不具比較利益，比較利益轉為資訊產品，故表示鞋子的機會成本變高，資訊產品的機會成本變低。故選(C)。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 若甲、乙兩小國均生產某產品，其進出口不影響國際價格。在自給自足的狀況下，該產品在甲國國內價格高於國際價格，但在乙國的國內價格則是低於國際價格。若兩國均開放自由貿易，對於兩國該產品市場所造成的影響下列何者正確？
  options:
  - label: A
    content: 甲國該產品的生產者收入上升
  - label: B
    content: 使該產品在乙國的消費量增加
  - label: C
    content: 將使該產品在兩國的價格相等
  - label: D
    content: 甲國福利下降但乙國福利上升
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 甲國價格＞乙國價格時，甲國為進口國，故貿易有利甲國的消費者，不利甲國的生產者；乙國為出口國，有利乙國的生產者，不利乙國的消費者。貿易使兩國的產品價格變成相同，且對兩國都有利，故選(C)。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 下列與機會成本相關的敘述，何者正確？
  options:
  - label: A
    content: 個人只要持續努力，就能在各種生產活動上擁有低於其他人的機會成本
  - label: B
    content: 每個人對各個活動的機會成本不盡相同，因而可藉由分工提高整體產出
  - label: C
    content: 某個選項的機會成本，等同為了這個選項所放棄的其他選項之價值總和
  - label: D
    content: 機會成本須包含隱藏成本，而隱藏成本是指無法以數字計量的各種成本
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
