  - label: B
    content: 日本的消費者剩餘與生產者剩餘都減少
  - label: C
    content: 日本的消費者剩餘增加，臺灣的生產者剩餘增加
  - label: D
    content: 日本的消費者剩餘減少，臺灣的生產者剩餘增加
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣出口稻米至日本，則臺灣的稻米銷量增加，生產者剩餘增加，消費者剩餘減少；日本本國的稻米減產，生產者剩餘減少，消費者剩餘增加。故選(C)。
