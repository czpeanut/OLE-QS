- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '下表是甲、乙兩國在 2018 年各項經濟變數的統計值（單位：兆元），根據這些資訊，有關國內生產毛額（GDP）與綠色國內生產毛額（Green GDP）的敘述，下列何者正確？

    | 項目 | 甲國 | 乙國 |

    | --- | --- | --- |

    | 民間消費支出 | 200 | 240 |

    | 政府消費支出 | 150 | 120 |

    | 投資支出 | 200 | 180 |

    | 淨出口 | 60 | 50 |

    | 自然資源消耗 | 50 | 40 |

    | 環境品質損失 | 60 | 30 |'
  options:
  - label: A
    content: 甲國國內生產毛額與綠色國內生產毛額皆大於乙國
  - label: B
    content: 甲國國內生產毛額與綠色國內生產毛額皆小於乙國
  - label: C
    content: 甲國國內生產毛額大於乙國，甲國綠色國內生產毛額小於乙國
  - label: D
    content: 甲國國內生產毛額小於乙國，甲國綠色國內生產毛額大於乙國
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'GDP＝C＋I＋G＋（X－M），綠色 GDP＝GDP－自然資源消耗－環境品質損失。

    甲國的 GDP＝200＋150＋200＋60＝610。

    甲國的綠色 GDP＝610－50－60＝500。

    乙國的 GDP＝240＋120＋180＋50＝590。

    乙國的綠色 GDP＝590－40－30＝520。故選(C)'
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 不少企業將客戶服務委外經營，例如美國企業便將電話客戶服務委由印度、菲律賓等同是英語國家的公司經營。下列有關企業業務委外並透過跨國方式經營的敘述，何者正確？
  options:
  - label: A
    content: 印度、菲律賓等國勞工可因此直接受僱於美國企業，提高當地人民所得
  - label: B
    content: 美國勞工可因此輕易移動至外國獲得就業機會，降低美國失業問題
  - label: C
    content: 企業基於機會成本的考量，選擇有利的經營方式以降低成本提高獲利
  - label: D
    content: 企業考慮貧窮問題，藉此援助開發中國家，改善其與已開發國家的差距
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 委外化是企業基於比較利益，用比較便宜的人力，故可降低成本，提高獲利機會，故選(C)。(A)印度與菲律賓勞工並非直接受僱於美國企業，而是外包公司。(B)美國工作機會減少，失業上升。(D)企業不是為了縮小貧富差距而採此措施。
