  - label: B
    content: 兩國相互貿易的原因在於，生產產品的機會成本不同
  - label: C
    content: 一國生產甲、乙兩種產品，若甲產量較多，則一定有比較利益
  - label: D
    content: 經濟高度發展的現代化國家，對各種產品的生產都有比較利益
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)兩國生產的產品即使相同，只要有比較利益，仍可貿易。(C)應是生產上機會成本較小才具比較利益，並非產量多。(D)不論經濟發展程度為何，每個國家都有某些產品的比較利益。
