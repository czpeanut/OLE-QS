- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 圖為多家刨冰店對於水果的需求線。從圖中數據來看，以下完全正確的選項為何？
  options:
  - label: A
    content: 需求線呈現負斜率，是因為其遵守需求法則：價格愈低、需求愈大
  - label: B
    content: 當水果的市場價格為 30 元時，刨冰店能購買 10 箱以上的水果
    asset:
      key: s1_1_optB
      file: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2/s1_1_optB.png
      crop:
        page: 1
        rect:
        - 417.1
        - 170.8
        - 564.3
        - 291.15
  - label: C
    content: 水果價格從 30 元降到 20 元時，願付價格高於產品價格的業者家數變多
  - label: D
    content: 業者購買第 30 箱水果的願付價格，會比購買第 10 箱的願付價格還高
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從 30 元降到 20 元，購買數量會變多，故表示願付價格高於產品價格的業者變多，故選(C)。(A)價格愈高，應改成需求量愈大，而非需求愈大。(B)價格為 30 元時，購買數量為 10 箱以下。(D)購買數量愈多，願付價格應該愈少。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 請問下列與國際貿易相關的說明，何者正確？
  options:
  - label: A
    content: 對一國而言，進口花錢、出口賺錢，因此進口有害、出口有利
  - label: B
    content: 當一國的產品國內價格高於國際價格時，該國會出口產品獲利
  - label: C
    content: 國際分工貿易乃是根據比較利益，由機會成本較高者出口產品
  - label: D
    content: 參與國際貿易則有人獲利、有人受害，但整體經濟福祉會提高
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 國際貿易時，若有利國內消費者，則不利生產者；若有利生產者，則不利於消費者，但整體而言，對國家都是有利的，故選(D)。(A)進出口對國家都是有利的。(B)一國產品國內價格高於國際價格，此時應該由國外進口較有利。(C)出口產品應選比較利益中，機會成本較低的品項。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 部分烘焙業者漲聲連連，連知名的吳寶春麵包店也宣布調漲，業者解釋因原物料漲價才不得不出此下策。請問下列哪個相關敘述最為正確？
  options:
  - label: A
    content: 原物料屬於最終產品
  - label: B
    content: 原物料價格上漲導致麵包供給增加
  - label: C
    content: 原物料的價值將會直接計入今年 GDP
  - label: D
    content: 麵包的價格將會直接計入 GDP
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D) GDP 以最終產品計算，因此不算原料，而算麵包的價格，故(D)正確。(A)(C)原物料屬中間產品，不計入 GDP。(B)原料價格上漲，生產成本增加，故供給減少。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列關於生產可能曲線的敘述，何者「錯誤」？
  options:
  - label: A
    content: 曲線內的組合點代表資源或技術沒有充分利用
  - label: B
    content: 曲線上每一點都代表資源已作了最充分的利用
  - label: C
    content: 曲線外的生產組合是充分利用現有技術的結果
  - label: D
    content: 在現有資源與技術下，曲線上的生產組合具有生產效率
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 生產可能線以外的點，是以目前的資源和技術固定下，無法達成的生產組合，故(C)錯誤。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列關於貿易的敘述，何者正確？
  options:
  - label: A
    content: 政府以關稅保護國貨，會扭曲市場的資源配置
  - label: B
    content: 開放貿易必須一步到位，才符合 WTO 的原則
  - label: C
    content: 政府運用補貼刺激出口賺錢，能提升經濟福祉
  - label: D
    content: WTO 允許會員國對便宜進口品課徵反傾銷稅
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 貿易保護因為無法發揮比較利益，不利一國的經濟發展，故(A)正確。(B)開放貿易通常採漸進式，以減少衝擊。(C)補貼違反自由貿易原則。(D)反傾銷稅只有在違反公平貿易時才可以課徵。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 我國自行車產業的生產模式以全球專業分工進行定位，進行產業分工與國際貿易可帶來哪些好處？(甲)可充分利用各地的生產要素(乙)提高資源的使用效率(丙)享受到世界各國的比較利益(丁)可減緩全球資源的消耗
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (甲)(乙)(丁)
  - label: C
    content: (甲)(丙)(丁)
  - label: D
    content: (乙)(丙)(丁)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 貿易因為可以充分發揮各國的比較利益，故(甲)(乙)(丙)皆為其優點，但反而會加速資源的耗竭，故(丁)錯誤。(A)正確。
