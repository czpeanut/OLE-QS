  stem: 某國自甲、乙兩國進口汽車之關稅原本分別為 25 ％、40 ％，當三國均加入世界貿易組織（WTO）後，某國對甲、乙兩國進口汽車之關稅均訂為 25 ％。根據上述，下列何者正確？
