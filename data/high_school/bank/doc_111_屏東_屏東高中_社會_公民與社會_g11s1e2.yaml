  stem: GDP 是計算一國一段期間內產值常見的指標，但 GDP 亦有其依定義「不需」計算或實務上「無法」計算到的部分。請問下列何者屬之？(甲)二手遊戲市場重新開幕買賣熱絡(乙)國家準時發放公務機關人員薪水(丙)工廠廢水偷排河川省下處理費用(丁)農夫將自家收成的蔬菜留供自用(戊)國家改善所得分配問題達成均富
