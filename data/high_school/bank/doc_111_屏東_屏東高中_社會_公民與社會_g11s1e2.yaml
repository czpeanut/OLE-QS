- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 學者甲說：「透過自由競爭，市場會將產品交由願售價格最低的那些廠商來生產」，請問這反映了下列何種概念？
  options:
  - label: A
    content: 市場可以協調廠商根據比較利益進行分工
  - label: B
    content: 市場讓產品價格降至大家都能接受的水準
  - label: C
    content: 競爭會讓市場上只剩下品質較差的便宜貨
  - label: D
    content: 價格愈低、供給量愈多的廠商才能生存
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 自由競爭，市場會將產品交由願售價格最低的那些廠商來生產，即表示市場機制會使廠商透過比較利益，選擇機會成本低的品項來從事生產，故(A)正確。(B)產品價格無法讓所有人都接受，只能說：不能接受市價者，不會購買。(C)競爭會使品質提升。(D)若廠商的產品具有獨特性，仍有生存的空間。
- id: doc_111_屏東_屏東高中_社會_公民與社會_g11s1e2_s1_40
  section: 1
  number: 40
  type: single
  page: 6
  stem: '下表為在一天之內，小金、小天、小才各自捕魚或獵兔的生產力，若從比較利益的觀點來看，下列敘述何者正確？

    |  | 小金 | 小天 | 小才 |

    | --- | --- | --- | --- |

    | 一天全用於獵兔 | 5 隻兔 | 8 隻兔 | 3 隻免 |

    | 一天全用於捕魚 | 10 條魚 | 8 條魚 | 6 條魚 |'
  options:
  - label: A
    content: 小金與小才可根據比較利益分工，提高兩人的整體產出
  - label: B
    content: 相較於小天，小金有捕魚的絕對利益及獵兔的比較利益
  - label: C
    content: 與小金相比，小才捕魚沒有比較利益，獵兔才有比較利益
  - label: D
    content: 小天與小才根據比較利益分工，小天應獵兔，小才則應捕魚
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 小天和小才分工時，因為小天捕兔的機會成本為放棄 1 條魚，小才為 2 條魚，故小天應捕兔；小才應捕魚，(D)正確。(A)(C)對小才而言，小金在捕魚和兔都有絕對利益，但因小金和小才兩人的機會成本相同，故沒有比較利益，無法選擇機會成本較低者進行專業分工。(B)相較於小天，小金具有捕魚的絕對利益和比較利益。
