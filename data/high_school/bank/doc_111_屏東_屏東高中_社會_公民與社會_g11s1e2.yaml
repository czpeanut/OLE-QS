  - label: B
    content: 甲既將該筆電售予乙，立即喪失所有權而不得如常使用該筆電
  - label: C
    content: 乙可請求甲交付筆電，也可以本於所有權人的地位處分該筆電
  - label: D
    content: 倘甲未依約將筆電交付予乙，乙可本於該契約逕自取走該筆電
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 買賣是債權債務關係，故(A)正確。(B)筆電未交付前，甲仍是筆電的所有權人。(C)乙可請求甲交付筆電，但未交付前，乙不是所有權人。(D)雖然乙是債權人，但乙不可以自行取走筆電。
