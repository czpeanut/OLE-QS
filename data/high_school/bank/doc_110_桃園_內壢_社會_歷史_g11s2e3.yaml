  section: 1
  number: 7
  type: single
  page: 1
  stem: 何人嚴厲地貶斥巴勒維王朝國王為「猶太人的代理人、頭部被石頭砸碎的美國大蛇」，1979年以勝利姿態返國建立了新政府？
  options:
  - label: A
    content: 巴勒維
  - label: B
    content: 何梅尼
  - label: C
