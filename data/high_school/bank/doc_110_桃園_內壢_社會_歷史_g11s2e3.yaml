    content: 甘迺迪與幕僚討論如何處理蘇聯在古巴設置的飛彈
  - label: D
    content: 尼克森主張以談判代替軍事對抗，轉與蘇聯交好對抗中共
  group_stem: 2013年電影《白宮第一管家》，是改編自第一位在白宮擔任管家的非裔美國人尤金•艾倫的生平與經歷，他自1952年起進入白宮從事，於1986年退休之前的職位是白宮總管。在他任職於白宮期間，從艾森豪到雷根總統，他一共服侍過七位美國總統。根據電影劇情描述，1960年代他的兩個兒子選擇了截然不同的道路：大兒子熱血沸騰，充滿改革大志，積極參與民權社團，追尋基本人權；小兒子則是從軍報效國家，到外國打仗後生死不明，劇情的走向形成一個強烈的對比：老大「fight country(對抗國家)，老二「fight for country(報效國家)」。電影巧妙地以此劇情生動呈現出當時美國內外所面臨的問題與情況。
