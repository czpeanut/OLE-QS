- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 1947年法國與英國經濟不見起色，失業率增加、食品短缺、各地不斷罷工，經濟無法恢復。據統計，農業生產是1938年的83%，工業生產為88%，出口總額則僅為59%；但1948年至1952年經濟發展快速，工業生產增長了35%，農業生產實際上已經超過戰前的水準，戰後前幾年的貧窮和饑餓已不復存在，經濟開始了長達二十年的空前發展。請問英、法兩國在短時間內的大幅轉變，下列何者解釋最為恰當？
  options:
  - label: A
    content: 韓戰爆發，美國將英、法納入東亞第一島鏈，大量金援歐洲
  - label: B
    content: 第一次柏林危機爆發，英、法因而盡全力恢復經濟
  - label: C
    content: 越戰爆發，西歐國家趁機急起追趕美國經濟
  - label: D
    content: 美國對歐洲進行金援，避免重蹈戰間期的經濟大恐慌覆轍
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 1971年，美國尼克森總統在堪薩斯演講時說：「當我發表就職演說的時候，我提到一個需要談判的時代，……我們在世界上許多地區正在進行談判而不是正在對抗。」請問促使尼克森進行這段演說的背景為？
  options:
  - label: A
    content: 蘇聯建立柏林圍牆分隔東西德
  - label: B
    content: 蘇聯於古巴架設飛彈瞄準美國
  - label: C
    content: 韓戰失利簽訂《韓戰停戰協定》
  - label: D
    content: 越戰失利使美國從越南撤兵
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 英國作家喬治歐威爾於1943～1944年創作一部反烏托邦小說《動物農莊》，內容諷刺共產主義與史達林的極權統治，不過最初遭到美、英出版社的拒絕而無法出版，最終於1945年8月由一家小型出版社出版，竟獲得巨大成功，出版的四千五百本全數售罄。請問從該書被拒絕到出版銷售一空，可能與國際局勢的何種改變有關？
  options:
  - label: A
    content: 二次世界大戰後期，蘇聯加入同盟國
  - label: B
    content: 二戰結束後，美蘇兩大陣營分裂對抗
  - label: C
    content: 韓戰爆發，美國國內姑息主義盛行
  - label: D
    content: 古巴飛彈危機爆發，民眾厭惡蘇聯
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 以默劇聞名的卓別林，在電影《摩登時代》中描繪工業革命下工人生活的不幸，反映出其在政治思想上較為左傾。由於這樣的政治觀點，使得卓別林在1950年代遭到美國聯邦調查局的祕密調查，最後黯然離開美國。根據文中所述，導致卓別林遭受此待遇的原因，與當時美國盛行什麼思潮有關？
  options:
  - label: A
    content: 杜魯門主義
  - label: B
    content: 法西斯主義
  - label: C
    content: 姑息主義
  - label: D
    content: 麥卡錫主義
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 1989年，蘇聯開始重新檢討當年出兵鎮壓捷克之事：對於這種合理化干涉友邦內政的行為，在當時是以東西方對抗為出發點的。我們贊同捷克政府的觀點，1968年出兵捷克領土的決定是錯的。關於蘇聯對1968年出兵捷克的反省，我們可如何理解？
  options:
  - label: A
    content: 這段資料應為造假，蘇聯不可能認為當時出兵捷克是錯誤的
  - label: B
    content: 此時應為冷戰激烈之時，雷根欲以星際大戰拖垮蘇聯
  - label: C
    content: 此時正值戈巴契夫改革之際，引發蘇東波浪潮
  - label: D
    content: 此時應為蘇聯瓦解之際，共產黨在蘇聯全面潰敗
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 蘇聯的解體，代表持續近半個世紀的冷戰和兩極格局的結束，美國成了世界上唯一的超級強國，但是後冷戰時期的世界局勢發展，並未如預期般朝向一元發展。綜觀世界局勢發展，不斷出現不同陣營爭霸的情況：(甲)同盟國與協約國；(乙)協約國與法西斯陣營；(丙)資本主義與共產陣營。請問若按照世界局勢的發展，上述應如何排列？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丙乙
  - label: C
    content: 乙甲丙
  - label: D
    content: 乙丙甲
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 1955年美國阿拉巴馬州的蒙哥馬利，一名非裔美國女性羅莎•帕克斯在白人座位坐滿後，拒絕服從公車司機的命令，將有色座位讓給白人乘客，因此遭到逮捕，此事件引發大眾發起抵制蒙哥馬利公車運動。請問這樣的罷乘運動，對於日後產生什麼影響？
  options:
  - label: A
    content: 導致南北戰爭的發生
  - label: B
    content: 解放奴隸宣言的頒布
  - label: C
    content: 賴比瑞亞的正式獨立
  - label: D
    content: 美國《民權法案》通過
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 1991年的葛萊美獎頒獎典禮上，大會將象徵西洋流行樂壇最高榮譽的「終身成就獎」頒給了「美國民謠之父」巴布狄倫。1960年代，他被公認為當代最具影響力的創作歌手之一，他的歌曲能反映當時群眾心聲，如他於1963年發行的「Blowin In The Wind」，歌詞即傳達反戰訴求。請問當時這首歌最有可能被什麼群體的人傳唱？
  options:
  - label: A
    content: 主張女性獲得平等地位者
  - label: B
    content: 主張非裔美國人獲得平等地位者
  - label: C
    content: 受新保守主義影響者
  - label: D
    content: 受新左派思想影響者
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 20世紀的霍布斯邦在《極端的年代》中陳述：「本世紀的最後一部分，則是分散解體、徬徨不確定、危機重重的年代。其實對世界絕大部分來說，如之前於非洲及歐洲的蘇聯社會主義地區，根本就是一個災難時期。隨著1980年代過去，1990年代揭幕，瀰漫的氣氛是股世紀末的悲觀心情。」請問有關上文的分析，下列何者正確？
  options:
  - label: A
    content: 「分散解體」所言是指民主與共產陣營衝突形成
  - label: B
    content: 匈牙利、捷克等地屬於「蘇聯社會主義地區」的一部分
  - label: C
    content: 「分散解體」所言是指東西德的分裂
  - label: D
    content: 希臘、土耳其等地屬於「蘇聯社會主義地區」的一部分
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 冷戰期間，部分亞洲、非洲、拉丁美洲的國家，基於過去被殖民的負面經驗，不希望美、蘇兩大集團干預其內政，逐漸形成所謂的「第三世界」勢力。下列關於「第三世界」的敘述，何者最為適當？
  options:
  - label: A
    content: 社會主義與法西斯主義是促使第三世界形成的動力
  - label: B
    content: 越南、菲律賓均透過和平談判脫離母國獨立
  - label: C
    content: 「第三世界」在外交上採行不與美、蘇結盟的彈性策略
  - label: D
    content: 中共號召亞非國家，團結對抗美蘇，形成「第三世界」
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 甘地與凱末爾各領導印度與土耳其的民族復興運動，兩人有何相似之處？
  options:
  - label: A
    content: 均領兵作戰，崛起於第一次世界大戰期間
  - label: B
    content: 皆於第二次世界大戰後使國家獲得獨立
  - label: C
    content: 反抗對象均有英國
  - label: D
    content: 兩者皆於獨立後當選首任總統
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 某本書提到：「我們忽視大自然的力量，自以為能改造大自然，低估天敵的價值，未考慮生物複雜的系統結構。無論科技發展多快、生產的殺蟲劑愈來愈毒，但昆蟲的抗藥性還是快了一步，要殺滅的昆蟲反而更強壯，更爆發性的繁殖。最後，終將面臨大自然的反撲。此書的創作背景是1940年代以後，人們開始大量使用難以分解的有機氯殺蟲劑。」請問這本書為何？
  options:
  - label: A
    content: 《百年孤寂》
  - label: B
    content: 《寂靜的春天》
  - label: C
    content: 《西線無戰事》
  - label: D
    content: 《存在與虛無》
