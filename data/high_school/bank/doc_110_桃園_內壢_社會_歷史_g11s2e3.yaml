  group_stem: '甲：他貫徹反共產主義的政策，以力保資本主義社會。企圖加大美蘇之間的軍備競賽，致使美蘇兩國展開「星際大戰｣。

    乙：他首先採用「圍堵政策」的概念來對抗共產集團，他認為美國有領導自由世界之使命，並且企圖聯合全球各地之反共勢力，以構築防範與遏阻蘇聯共產勢力向外擴張的反制力量。

    丙：他提出「新和平」的戰略，「實力」、「夥伴關係」、「談判」是新和平戰略的三大支柱。因此他以美國實力為基礎，展開「對談取代對抗」的和解談判，嘗試與共產集團中的國家建立新的夥伴關係。'
