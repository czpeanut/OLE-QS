  stem: 1950年代後期，海運界曾考慮「貨櫃運輸」的作法，亦即將雜散貨品組合包裝，放入標準貨櫃內，以改善運輸效率。但因必須改建港口，導致費用太高而無法推廣。後來，美國參與一場戰爭，利用貨櫃從美國將大量軍需品運到「甲」地，貨輪返航時再到「乙」地，將該地工業產品運回美國銷售。此後，世人才認識到貨櫃運輸的效能。上文所說「甲」、「乙」地最可能是：
