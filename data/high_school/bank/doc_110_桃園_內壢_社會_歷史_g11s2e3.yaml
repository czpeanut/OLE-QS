questions:
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 資料一：假如沒有1929年的□□，則德國威瑪共和國的壽命可以延長。……但情況並非如此，事實上一開始德國威瑪共和國便被○○束縛著，加速國家的經濟崩潰。 資料二：人民在1918年尚可以一美元兌換四元本國貨幣，但到1923年卻是上億元才可兌換一美元。」請問文中的□□和○○各應填入何者？
  options:
  - label: A
    content: 經濟大恐慌；《凡爾賽和約》
  - label: B
    content: 一次大戰；希特勒
  - label: C
    content: 經濟大恐慌；「十四點和平計畫」
  - label: D
    content: 二次大戰；墨索里尼
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「所有的軍官！士官！非洲各地及義大利的武裝士兵！革命的黑衫軍！散布在祖國及世界各地的義大利子民們，聽著！馬上你們就會知道一個決定……我們已經完成了一件偉大的勳業：今天，法西斯時代第14年的5月9號，衣索比亞的命運已然註定……義大利人民已經用鮮血創建了一個帝國。我們要用工作使它富饒，用武器使它免於任何人的侵犯。」此一演說的時代背景為何時的義大利？
  options:
  - label: A
    content: 19世紀末統一運動期間
  - label: B
    content: 一次大戰期間
  - label: C
    content: 戰間期
  - label: D
    content: 二次大戰期間
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 美國的蘇聯問題專家肯楠（G. Kennan）在1947年的《外交季刊》發表一篇專文，他的主張如下：「美國對蘇聯的擴張必須採取『長期而忍耐，但又堅定而警覺的圍堵政策，每當蘇聯對世界任一地區顯示侵略企圖時，美國必須以堅定不移的相對力量來加以制止』……，唯有如此，方可使克里姆林宮當局知所警惕，自我約束後，最後放棄其狂妄的擴張計畫」。請問下列何者被肯楠視為「狂妄擴張計畫」的一部分？
  options:
  - label: A
    content: 馬歇爾計畫
  - label: B
    content: 華沙公約組織
  - label: C
    content: 東南亞公約組織
  - label: D
    content: 麥卡錫主義
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 一次大戰初期，在平安夜或聖誕節中，德軍與英軍或是德軍與法軍之間會有一些短暫非官方的休戰，雙方士兵在無人地帶做一些交流，互相交換食物、香菸和酒等小禮物，還有以鈕扣或帽子等來作為紀念品。請問這種「聖誕節休戰」主要係因下列何種戰爭型態而產生？
  options:
  - label: A
    content: 堅壁清野戰略使士兵物資匱乏
  - label: B
    content: 閃電戰術使雙方短兵相接
  - label: C
    content: 毒氣戰後倖存者為悼念亡者而發生
  - label: D
    content: 壕溝戰陷入僵持對峙時發生
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以下是三段有關俄國的史料： 資料一：蘇聯實施工、農產品價格的「剪刀差」，即政府無償向農民徵收公糧，或以低價收購農產品，而以較高價格將工業產品賣給農民。 資料二：〈被收買的革命〉文章披露：「根據德國外交部的資料，德皇威廉二世至少給予列寧2,600萬馬克，相當於今天7,500萬歐元，使其於1917年回到國內，發動革命。」 資料三：1920年俄國的情景：寒冬裡，一位農民辛苦的挑著糧食到鎮上賣，路上遇到了紅軍士兵，士兵告訴他國家正在內戰，按政府命令，這些糧食歸國家所有，遂沒收他的糧食。 請問：下列理解何者「正確」？
  options:
  - label: A
    content: 資料按照事件發生先後順序，應為資料三二一
  - label: B
    content: 實施資料一的目的是為了增加資本累積，以推動集體農業化
  - label: C
    content: 資料二說明列寧獲得協助返回俄國後，發動政變建立共產政權
  - label: D
    content: 資料三的狀況是為了應付一次大戰，政府徵用所有的糧食
- id: doc_110_桃園_內壢_社會_歷史_g11s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有一篇關於反對運動的描寫：「在1930年的食鹽長征中，我看著他手拄柺杖走向海邊，以土法煮鹽，用行動抗拒殖民者的食鹽壟斷政策，那是我腦海中最重要的畫面。他是一位朝聖者，他默然平靜、意志堅定、無所畏懼。無論結果如何，他都會持續不斷地追求。」請問這段文字是關於下列哪一人物的描寫？
  options:
  - label: A
    content: 創建土耳其共和國的凱末爾
  - label: B
    content: 文化抗日運動中的林獻堂
  - label: C
    content: 印度不合作運動中的甘地
  - label: D
    content: 南非反種族隔離的曼德拉
