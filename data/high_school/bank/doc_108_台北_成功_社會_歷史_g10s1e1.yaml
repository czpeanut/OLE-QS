  stem: 閱讀資料，回答問題： 資料一：南島語族共有959個語言，可以分成四個亞群，其中之一獨大，就是「馬玻亞群」，包括了945個南島語，占98.5％強。幾乎整個南島語系的地理範圍，都由馬玻亞群獨領風騷。歐洲的印歐語系到近代才開始向海外擴張，先前的南島語族是世界上分布範圍最廣的族群。 資料二：臺灣的大坌坑文化遺址出土的一件石器，使臺灣和後來的泛太平洋島嶼文化聯繫在一起，就是樹皮布打棒。那是一種磨製石器，用來打擊某種樹的樹皮，以製作繩索、漁網、衣布。此工具在所羅門島南方的土著─玻里尼西亞人，至1930年以前都還使用著。 根據上述兩段資料，下列有關南島語族的敘述，何者正確？
  options:
  - label: A
    content: 南島語族擴張受印歐語系的影響
  - label: B
    content: 南島語族是今日人口最多的族群
  - label: C
    content: 大坌坑文化是由南島語族創建的
  - label: D
    content: 玻里尼西亞人創建了大坌坑文化
  answer:
  - C
