  stem: 2019年底青春無敵的大學生寶弟，他靈活運用了多種交通工具規畫了一個星期的國內旅遊，並在自己的「探險寶弟」部落格寫下環島旅行的經驗如下： 現在不論是高鐵還是台鐵都已經可以線上訂票，真的很方便！尤其是<u>高鐵(甲)</u>，服務好、速度快，當然票價也不便宜，不過不知道為什麼明明看起來乘客就很多，卻又傳出倒閉爭議，希望政府出資相救呢？高鐵和政府之間的財務狀況真令人摸不著頭緒。 比較有趣的是國光客運(乙)，我看到有張海報上面寫著國光客運的歷史：國光客運的前身為公營事業台灣汽車客運公司，2001年由員工集資成立國光汽車股份有限公司。我還是第一次知道呢！ 在旅遊過程中，我也參觀了台南市美術館，它是台灣首座行政法人和唯一有科學研究、修復畫作的美術館，融合了歷史古蹟建築與現代建築設計工法，真的讓我大開眼界！ 回程中，還經過我曾就讀的<u>武陵高中</u>(丙)，那時還是國立高中，現已改制為「市立」武陵高中了，過往的時光一一浮現在我眼前……。 上述部落格資料中(甲)(乙)(丙)在民主治理中各自採何種政府再造之策略，並請簡要說明，依序填入表格中。
