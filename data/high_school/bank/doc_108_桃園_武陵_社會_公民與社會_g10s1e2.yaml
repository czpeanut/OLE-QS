  stem: 人權是數世紀前就產生的概念，隨時間推進才成為現代民主國家普遍認同的理念。關於人權演進情形，下列敘述何者正確？
  options:
  - label: A
    content: 人權的核心價值在於維護君權神授與自由、平等、博愛的精神
  - label: B
    content: 天賦人權強調人是自由平等，但僅限於某些特殊條件者才享有，為有限人權的概念
  - label: C
    content: 美國〈獨立宣言〉、法國〈人權宣言〉是邁向普遍人權的開端
  - label: D
    content: 聯合國通過九大核心國際人權公約，凡締約國包含我國在內皆受其拘束，作為人權保障的依據
