  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
  group_stem: ◎ 題組：2017年，司法院大法官作出釋字第748號解釋，並首度同步發出英文版釋憲文，宣告《民法》未使用同性別二人，得為經營共同生活之目的，成立具有親密性及排他性之永久結合關係，於此範圍內，與《憲法》第22條保障人民婚姻自由以及第7條保障人民平等權之意旨有違。有關機關應於本解釋公布之日起2年內，依本解釋意旨完成相關法律之修正或制定。逾期未完成相關法律之修正或制定者，相同性別二人為成立上開永久結合關係，得依上開婚姻章規定，持二人以上證人簽名之書面，向戶政機關辦理結婚登記。 2018年「下一代幸福聯盟」主張捍衛一夫一妻婚姻，認為一男一女結合才有導向生育的可能，才能得到法律上婚姻的保障。為了婚姻家庭及下一代，發起三個「愛家公投」。爾後，支持同婚方也發起兩個「挺同公投」。2018年底九合一大選合併公投的投票中，與同志議題相關的公投就高達五個。
