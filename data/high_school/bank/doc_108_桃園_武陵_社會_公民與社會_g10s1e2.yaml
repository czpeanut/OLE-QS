  page: 1
  stem: 「社會權」是基於福利國家的理念，為使所有國民皆可過著合乎人性尊嚴的生活，而予以保障之所有權利的總稱；我國《憲法》亦明文規定政府必須保障人民前述的權利。請問下列何者最符合落實社會權的積極作為？
  options:
  - label: A
    content: 多次修訂《公民投票法》，以確保國民直接民主之行使
  - label: B
    content: 制定《集會遊行法》，保障人民集會、遊行之自由權利
  - label: C
    content: 開辦國民年金保險，確保國民皆能享有基本的經濟安全
  - label: D
    content: 教育部通令各中等學校取消髮禁，以保障學生人權
