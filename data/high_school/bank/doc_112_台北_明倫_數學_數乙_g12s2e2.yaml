  stem: 若整係數方程式 $ax^{2}$＋bx＋41＝0 的兩根為相異的整數，且 a＞0，b＜0，則 a＋b＝？
  options:
  - label: A
    content: －41
  - label: B
    content: '41'
  - label: C
    content: －42
  - label: D
    content: '42'
  - label: E
    content: －40
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '設此方程式之兩根為α，β

    則兩根之積αβ＝$\frac{41}{a}$為一整數$\Rightarrow$a＝1 或 41

    若 a＝1，若方程式 $x^{2}$＋bx＋41＝0

    兩根之積為αβ＝41，其中α，β為相異整數

    $\Rightarrow$α＝1，β＝41 或α＝41，β＝1

    則兩根之和為$\frac{-b}{1}$＝42$\Rightarrow$b＝－42

    ∴a＋b＝1＋（－42）＝－41

    若 a＝41，則方程式 $41x^{2}$＋bx＋41＝0

    兩根之積αβ＝1，其中α，β為相異整數（不合）

    故選(A)'
