    content: －2
  - label: C
    content: '1'
  - label: D
    content: '2'
  - label: E
    content: '3'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵方程式 $x^{2}$－3x＋k＝0 有兩個共軛虛根

    ∴判別式為（－3）$^{2}$－4×1×k＜0

    $\Rightarrow$9－4k＜0

    $\Rightarrowk > \frac{9}{4}$

    故選(E)'
