  stem: 若α，β為 $x^{2}$＋4x＋9＝0 之兩根，試求$\frac{\beta}{\alpha}+\frac{\alpha}{\beta}$＝？
  options:
  - label: A
    content: $\frac{16}{9}$
  - label: B
    content: $-\frac{4}{9}$
  - label: C
    content: $-\frac{19}{9}$
  - label: D
    content: $\frac{4}{9}$
  - label: E
    content: $-\frac{2}{9}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵α，β為 $x^{2}$＋4x＋9＝0 之兩根

    ∴$\begin{cases}\alpha +\beta =-4 \\ \alpha \beta = 9\end{cases}$

    $\frac{\beta}{\alpha}+\frac{\alpha}{\beta}$＝$\frac{\alpha ^{2}+\beta ^{2}}{\alpha \beta}$＝$\frac{( \alpha +\beta )^{2}- 2\alpha \beta}{\alpha \beta}$＝$\frac{16 - 18}{9}$＝$-\frac{2}{9}$

    故選(E)'
