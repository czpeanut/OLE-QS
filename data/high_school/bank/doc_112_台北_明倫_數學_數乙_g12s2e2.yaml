  stem: 若 1－i 為方程式 $x^{2}$＋kx＋3－i＝0 之一根，則 k 值為下列何者？
  options:
  - label: A
    content: －3
  - label: B
    content: －2
  - label: C
    content: '2'
  - label: D
    content: '3'
  - label: E
    content: －1－i
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '將 x＝1－i 代入方程式 $x^{2}$＋kx＋3－i＝0

    （1－i）$^{2}$＋k（1－i）＋3－i＝0

    $\Rightarrow$1－2i－1＋k（1－i）＋3－i＝0

    $\Rightarrow$k（1－i）＝－3＋3i

    $\Rightarrow$k＝$\frac{-3 + 3i}{1 -i}$＝－3

    故選(A)'
