- id: doc_112_台北_明倫_數學_數乙_g12s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知實係數三次多項式 f（x）除以 x－4 餘 10，除以 x＋2 餘－50，且 f（1＋i）＝0，則下列敘述何者錯誤？
  options:
  - label: A
    content: 函數 y＝f（x）與 x 軸恰交於一點
  - label: B
    content: f(1)＜0
  - label: C
    content: f(4)＞0
  - label: D
    content: f（1－i）＝0
  - label: E
    content: x＋3 為 f（x）之因式
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）為實係數三次多項式，又 f（1＋i）＝0

    ∴f（1－i）＝0，且 f（x）＝0 有一實根，兩個共軛虛根

    設 f（x）＝（ax＋b）〔x－（1＋i）〕〔x－（1－i）〕＝（ax＋b）（$x^{2}$－2x＋2），其中 a，b 為實數

    ∵f(4)＝（4a＋b）（$4^{2}$－2×4＋2）＝10$\Rightarrow$4a＋b＝1 …………………………………①

    f（－2）＝（－2a＋b）〔（－2）$^{2}$－2×（－2）＋2〕＝－50$\Rightarrow$2a－b＝5 ……………②

    由①、②得 a＝1，b＝－3

    故 f（x）＝（x－3）（$x^{2}$－2x＋2）

    (A)○：f（x）＝0 恰有一實根，因此函數 y＝f（x）與 x 軸恰交於一點

    (B)○：f(1)＝（1－3）（$1^{2}$－2×1＋2）＝－2＜0

    (C)○：f(4)＝10＞0

    (D)○：f（1＋i）＝f（1－i）＝0

    (E)╳：∵f（x）＝（x－3）（$x^{2}$－2x＋2）

    ∴x＋3 不是 f（x）的因式

    故選(E)'
