  type: single
  page: 1
  stem: 已知 a、b 為實數，若方程式 $x^{2}$＋ax＋b＝0 兩根為純虛數，則下列敘述何者正確？
  options:
  - label: A
    content: 此方程式的兩根為共軛虛根
  - label: B
    content: $a^{2}$－4b＞0
  - label: C
    content: a 為正數
  - label: D
    content: b 為負數
  - label: E
    content: 函數 y＝$x^{2}$＋ax＋b 的圖形與 x 軸有交點
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵a、b 為實數 ∴$x^{2}$＋ax＋b＝0 為實係數方程式

    因此其兩虛數根為共軛虛根

    (B)╳：∵有兩共軛虛根 ∴判別式為 $a^{2}$－4×1×b＝$a^{2}$－4b＜0

    (C)╳：設其兩共軛虛根為 Bi、－Bi

    ∵兩根為純虛數 ∴兩根之和為－a＝0$\Rightarrow$a＝0

    (D)╳：承(C)，兩根之積為 $B^{2}$＝b＞0

    (E)╳：∵判別式小於 0

    ∴函數 y＝$x^{2}$＋ax＋b 的圖形和 x 軸無交點

    故選(A)'
