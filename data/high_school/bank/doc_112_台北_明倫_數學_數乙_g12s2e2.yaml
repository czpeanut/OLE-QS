  stem: 設 f（x）為三次實係數多項式，且知複數 1＋i 是方程式 f（x）＝0 之一根，則下列敘述何者正確？
  options:
  - label: A
    content: f（－1＋i）＝0
  - label: B
    content: f（1＋2i）≠0
  - label: C
    content: f（x）＝0 恰有一個有理根
  - label: D
    content: 函數 f（x）的圖形與 x 軸有三個交點
  - label: E
    content: 多項式 f（x）不可被 $x^{2}$－2x＋2 整除
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵f（x）＝0 為三次實係數多項式方程式，且複數 1＋i 是其一根

    ∴1－i 是其另一虛根，且另有一實根

    由此可知 f（－1＋i）≠0

    (B)○：∵方程式 f（x）＝0 有兩共軛虛根，一實根

    ∴f（1＋2i）≠0

    (C)╳：僅可知 f（x）＝0 恰有一個實根

    (D)╳：∵f（x）＝0 只有一實根

    ∴函數 f（x）的圖形與 x 軸只有一個交點

    (E)╳：∵以 1＋i、1－i 為根的二次多項式方程式為

    〔x－（1＋i）〕〔x－（1－i）〕＝$x^{2}$－2x＋2＝0

    ∴多項式 f（x）可被 $x^{2}$－2x＋2 整除

    故選(B)'
