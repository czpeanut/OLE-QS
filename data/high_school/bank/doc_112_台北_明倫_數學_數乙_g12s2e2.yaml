  answer_source: answer_key
  explanation: '∵f（x）＝0 為三次實係數多項式方程式，且 1＋i 為其一根

    ∴1－i 為其另一根

    可知此三次實係數多項式方程式有一實根、兩共軛虛根

    因此函數 f（x）＝0 和 x 軸有 1 個交點

    故選(B)'
