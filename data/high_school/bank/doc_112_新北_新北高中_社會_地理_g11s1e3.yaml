  stem: 某資料指出：全球化的支持者提出許多的事實與和各種數據，說明全球化如何推動經濟與社會的進步，增加人類福祉的結論。但也看到全球化之下的確存在著嚴重、甚至不斷加劇的發展不平衡及貧富分化。這不僅存在於人與人之間，也存在於一國之內的不同區域之間，以及不同國家之間。哪些因素是造成上述資料現象的主因？(甲)已發展國家憑藉掌握資金與技術，在全球化下獲益(乙)跨國環保組織阻止跨國企業擷取大量自然資源，造成熱帶國家無法全力發展經濟(丙)隨著市場的擴大，開發中國家的農民可從糧食運銷公司獲得更高的收購價格(丁)跨國企業、國際性經濟組織成立，助長了跨國企業及強國的經濟入侵，對發展中國家的弱勢產業和弱勢族群不利
