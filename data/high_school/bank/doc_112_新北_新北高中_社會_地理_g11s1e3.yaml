  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)大量供應鏈中的廠商，只因缺電就輕易被踢出供應鏈，主要是這些廠商的可替代性高，而這些大多是非核心技術的廠商。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 4
  stem: 世界體系理論中按照勞動分工狀況，將世界各區域分為核心、半邊陲、邊陲區 3 大類，而這 3 種類型的區域也並非一成不變的發展下去，而會受到某些因素的影響而有位階變化的狀況。請問邊陲區發展成為半邊陲區或甚至核心區，主要的成因應為下列何者？
  options:
  - label: A
    content: 核心國投資邊陲區並引入技術
  - label: B
    content: 邊陲區的國家透過核心區的資金進行政治革命
  - label: C
    content: 核心區持續在邊陲區拓展貿易路線
  - label: D
    content: 邊陲區發展集約農業並增加勞動力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)邊陲變為半邊陲或核心區，主要是透過模仿核心區的經驗，而核心區則是透過擴散方式將經驗傳至邊陲國家，形成改變。
