  stem: 全球化帶動世界經濟相互依賴與影響的趨勢，為已開發國家與開發中國家創造發展的機會，也帶來諸多的風險，文中主要強調哪種全球化風險？
  options:
  - label: A
    content: 金融風險
  - label: B
    content: 人才流失風險
  - label: C
    content: 貿易風險
  - label: D
    content: 生態風險
  group_stem: 近 20 年來，隨著全球貿易區域化的發展，形成了東亞、歐洲、北美三大經濟板塊。然而受到新冠肺炎疫情衝擊，這些貿易活動和運輸出現一些變化。2020 年 3 月疫情發生後，口罩、抗生素等重要抗疫物資都要仰賴中國製造，各國醫療用品的短缺清楚展現供應鏈斷裂的結果，企業紛紛考慮將設立在中國的工廠移到他國或撤回本國，提高供應鏈在國內與區域內的比重，降低跨區域貿易的風險，顯示疫情對逆全球化的影響力。中國也是高度仰賴進出口的經濟體，在這次的逆全球化潮流下，肯定受到不少衝擊。請問：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)全球化強調全球布局，全球貿易，商品的生產以全球為市場。但疫情期間，某些地區產生部分商品因過度依賴他區，而使供給吃緊甚至短缺，這都突顯了跨區貿易的風險。
