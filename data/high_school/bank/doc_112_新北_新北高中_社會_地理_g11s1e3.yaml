  stem: 蘋果的各項產品都是國際分工鏈的產物，該公司 2020 年共有 404 家供應商（如下圖），其中 156 家來自中國，然而近期因中國限電的影響，數十家中國廠商被踢出供應鏈，此反映出跨國供應鏈的何種特徵？
  options:
  - label: A
    content: 非核心技術的製造部門容易被取代
  - label: B
    content: 蘋果訂單規模大，廠商形成依賴性
  - label: C
    content: 因中國市場規模大，就近生產以降低成本
  - label: D
    content: 因應產品生命週期縮短，供應鏈要移動至成本最低的區位
  assets:
