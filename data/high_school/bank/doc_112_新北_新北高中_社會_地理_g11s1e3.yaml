questions:
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 土耳其目前已經收容 370 萬敘利亞難民，成為全世界難民人口最多的國家。土耳其成為西亞與南亞難民前往歐洲的中繼站，與該國何種特徵有關？
  options:
  - label: A
    content: 地形相對平坦
  - label: B
    content: 氣候溫暖溼潤
  - label: C
    content: 難民政策寬容
  - label: D
    content: 位於歐亞交界
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)土耳其位在歐亞交界，西亞地區難民進入歐洲需先經過土耳其，成為全世界收容難民人口最多的國家。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下圖為穆斯林女性的服裝樣式，從伊斯蘭女性服飾的種類多樣，可得知下列哪種資訊？
  options:
  - label: A
    content: 每年 11 至 4 月為主要雨季
  - label: B
    content: 伊斯蘭教為多神教，服飾因信奉不同神而不同
  - label: C
    content: 沙漠氣候日溫差大，風沙大
  - label: D
    content: 歷史長達 2,000 年以上，不同時期有著不同服飾
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_112_新北_新北高中_社會_地理_g11s1e3/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 162.0
      - 309.15
      - 522.1
      - 523.85
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)伊斯蘭女性服飾雖然多樣，但以罩袍為主，不管臉部有無露出，從頭到腳都覆蓋住，主要是因為乾燥氣候溫差大且風沙大。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 西亞與北非在自然與人文關係同質性高，因此被歸類在同一個地理區，請問此地理區具有哪些共同的特色？(甲)各國的經濟活動皆以石油為主(乙)降水季節均集中在夏季(丙)區域內乾燥氣候分布最廣(丁)穆斯林的比例高
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)西亞、北非因長年高壓籠罩，氣候乾燥；以人文角度而言，伊斯蘭教是主要信仰，又稱伊斯蘭文化區。(甲)除波斯灣沿岸國家，其他不見得都有石油生產；(乙)本區為乾燥氣候區，降水量不大，即使下雨，因近地中海，也多以冬雨為主。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '閱讀以下兩則有關西亞的新聞摘要後，歸納出最合理的推論：

    摘要一：「伊朗一名年輕庫德族女子艾米尼因未佩戴好頭巾，遭宗教警察逮捕後死亡，引發多起示威行動，該行動在伊朗西北部的庫德族集中地最為活躍。伊朗政府多次鎮壓異議分子，並且發射飛彈攻擊鄰國伊拉克北部的庫德族自治區。」

    摘要二：「土耳其針對其首都伊斯坦堡爆炸案作出清算行動，土耳其認為此次爆炸案主謀為庫德族好戰分子，於是多次空襲靠近其邊境的敘利亞及伊拉克之庫德族自治區作為報復。」'
  options:
  - label: A
    content: 西亞各國為單一民族國家，皆為阿拉伯人
  - label: B
    content: 各國穆斯林婦女外出時皆需佩戴頭巾
  - label: C
    content: 庫德族在歐美國家介入下獨立建國，引起阿拉伯世界的不滿
  - label: D
    content: 庫德族分布於西亞多國境內，導致區域衝突不斷
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)兩則報導皆提到庫德族，第一則在伊朗，第二則在土耳其，顯示庫德族分布在多個國家，且多有衝突，造成區域衝突不斷。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 雖然現代化建築在伊朗逐漸取代傳統建築，但是下方照片中的設施卻依然受到伊朗民眾的青睞。此建築主要能提供下列何種效益？
  options:
  - label: A
    content: 引進採光
  - label: B
    content: 降低室內溫度
  - label: C
    content: 視覺美觀
  - label: D
    content: 防止風砂
  assets:
