  explanation: (A)受疫情衝擊，全球各區域間的相互依賴度降低，跨區域的貿易減少，取而代之的是區域內部間的貿易依賴度增加。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s2_49
  section: 2
  number: 49
  type: single
  page: 11
  stem: 關於石油輸出國家組織（OPEC），下列的敘述何者正確？
  options:
  - label: A
    content: 會員國皆信仰伊斯蘭教
  - label: B
    content: 採取石油生產配額制的目的，以控制石油產量穩定價格
  - label: C
    content: 受美國開採頁岩油技術成熟而增產，此組織會員國的收入也增加
  - label: D
    content: 每日向世界各地輸出原油占全球總輸出量的 90 ％以上，幾乎全球石油產量均在 OPEC 掌控中
  group_stem: 下圖為 2000 ～ 2021 年沙烏地阿拉伯的 GDP 與全球油價變化圖，身為 OPEC 會員國一員的沙國，早期 GDP 深受原油價格影響，後期該國逐漸邁向轉型，將非石油產品出口額占 GDP 的比例從目前 16 ％提高到 50 ％，例如：提升再生能源技術與出口，提高金融、保險、觀光服務等收入。請問：
  shared_asset: g2_49_50
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)石油輸出國家組織 OPEC 以生產配額制，藉以維持世界油價穩定。(A)此非宗教組織而是經濟組織，部分國家如委內瑞拉以天主教為主。(C)美國開採頁岩油技術成熟，國際石油供應增加，衝擊油品市場，也影響 OPEC 國家收入。(D)根據美國能源資訊署統計，2019 年 OPEC 原油產量占全球產量的 38 ％。
