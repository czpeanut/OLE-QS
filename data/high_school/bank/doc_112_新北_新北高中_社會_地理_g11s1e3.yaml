  group_stem: 下圖為 2000 ～ 2021 年沙烏地阿拉伯的 GDP 與全球油價變化圖，身為 OPEC 會員國一員的沙國，早期 GDP 深受原油價格影響，後期該國逐漸邁向轉型，將非石油產品出口額占 GDP 的比例從目前 16 ％提高到 50 ％，例如：提升再生能源技術與出口，提高金融、保險、觀光服務等收入。請問：
