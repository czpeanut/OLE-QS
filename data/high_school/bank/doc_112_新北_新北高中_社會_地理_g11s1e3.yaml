  explanation: 依經緯度，麥加約在北緯 21.5 度、東經 40 度，亦即最接近臺灣的西方偏南，選項中朝西的只有(D)西南向。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 跨國速食業麥當勞在世界各地均設有分店，因為各地的風俗民情不同，而推出不同餐點，如：日本的蝦堡，印度以素肉漢堡取代牛肉漢堡。以色列多以蔬菜為主。請問這種針對區域差異做出的調適方式，稱為
  options:
  - label: A
    content: 在地全球化
  - label: B
    content: 全球在地化
  - label: C
    content: 反全球化
  - label: D
    content: 文化全球化
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)跨國企業為適應區域特色做出的調整，稱為全球在地化。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 《世界是平的》一書指出：「只要有寬頻，只要有雄心，不管你在哪兒都不會被邊緣化，競爭的立足點變平等了。」；「小時候我常聽爸媽說：兒子，乖乖把飯吃完，因為中國跟印度的小孩沒飯吃。」現在我則說：「女兒，乖乖把書唸完，因為中國跟印度的小孩等著搶你的飯碗。」上述書籍所陳述的 2 段內容，最能夠反映出下列哪種全球現象？
  options:
  - label: A
    content: 在全球環境尺度下，陸地起伏相對不明顯，所以可被視為平坦的
  - label: B
    content: 在全球經濟架構下，中國因寬頻使用有限，使經濟發展趨向邊緣化
  - label: C
    content: 在全球國際分工下，各地經貿關係的密切，使個人或企業競爭激烈
  - label: D
    content: 在全球暖化下，海水上升淹沒耕地，導致各國面臨糧食危機
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)此 2 段在描述中國和印度的崛起，原本被視為邊緣地帶的中、印，在全球分工下，經濟快速起飛，和全球緊密相連，並和全球的企業競爭。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 4
  stem: 某企業接到美國客戶的訂單，在東南亞的零件廠第 2 天便將生產好的零件，進行分裝整理。第 3 天即以空運送至墨西哥，與其他工廠生產的零件進行組裝。產品組裝完成後，隨即運往美國。請問該企業將零件送至墨西哥組裝，最可能是基於下列何種因素的考量？
  options:
  - label: A
    content: 擁有大量廉價的研發人才，同時存在廣大的銷售市場
  - label: B
    content: 工廠勞工福利制度相當完善，所需勞動力素質水準整齊
  - label: C
    content: 與美國同屬北美自由貿易區，可減少進出口關稅的成本
  - label: D
    content: 鄰近美國西南部的石油產區，組裝廠所需動力不虞匱乏
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)通常成品的關稅較高，如果簽訂相關貿易協定，則可減少關稅成本。東南亞製造的零組件，運至墨西哥組裝後送至美國市場，主要是因為美國和墨西哥同為美墨加協定成員（以前為北美自由貿易區），因此可減少成品直接進口的關稅。（此題北美自由貿易區已成為歷史）
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 4
  stem: 2016 年的某新聞指出：長期以來，美國勞工團體不滿部分開發中國家，憑著低薪和缺乏勞工保障勞動環境，讓美國國內製造業就業機會持續流失，因此，在 2017 年當美國政府宣布退出「跨太平洋夥伴協定」時，這些勞工團體為政府的決定感到歡喜。該報導標題，最可能符合下列哪個觀念？
  options:
  - label: A
    content: 全球化
  - label: B
    content: 在地化
  - label: C
    content: 反全球化
  - label: D
    content: 全球在地化
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)「跨太平洋夥伴協定」為全球化的象徵，退出此協定即為反全球化的表現。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
