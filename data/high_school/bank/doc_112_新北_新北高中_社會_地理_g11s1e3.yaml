  answer_source: answer_key
  explanation: (B)此為伊朗地區常見的風塔，利用建築設計，促進室內空氣和外界交換，熱氣排出，並使室內降溫，以利人類居住。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 齋戒月後的開齋節為穆斯林重要節日之一，我國境內約有 5 至 6 萬名穆斯林。為促進不同文化間的交流，2023 年 4 月 23 日臺北市政府於大安森林公園舉辦「2023 Eid-al-Fitr in Taipei 相聚臺北開齋食刻」，鼓勵穆斯林與其他信仰的市民透過各種活動，增進對彼此的認識。「齋」為伊斯蘭教的「五功」之一，有關「齋」的敘述何者正確？
  options:
  - label: A
    content: 「齋」源自人人平等、救濟貧民的教義
  - label: B
    content: 穆斯林於齋戒月的日出至日落不得進食
  - label: C
    content: 齋是每天要朝麥加方向朝拜
  - label: D
    content: 全體穆斯林都要參加禁食活動，無論性別與年紀，顯示在真主面前人人平等
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)齋戒月自日出至日落不得進食。(A)源自人人平等、救濟平民的是「課」。(C)朝麥加朝拜的是「禮」。(D)特殊狀況如嬰兒、老人、病人等可以不受日間不食的約束。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 西亞是全球紛爭最多的地區之一，哪些事實是誘發近代「中東問題」的原因？(甲)氣候乾燥，人民普遍貧窮(乙)宗教內部派系不同(丙)資源分布不均(丁)地形平坦，外族容易入侵(戊)領土、主權的認定
  options:
  - label: A
    content: 甲丙丁
  - label: B
    content: 乙丁戊
  - label: C
    content: 乙丙戊
  - label: D
    content: 丙丁戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)近代的「中東問題」為區域政治不穩定，紛爭不斷。主要原因有：(乙)不同宗教間或同一宗教內部派系的爭鬥、(丙)資源分布不均，例如：水資源的紛爭或石油資源引發外來勢力介入、(戊)領土和主權的紛爭，這 3 項是主要的問題癥結。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 過去沙烏地阿拉伯是全世界唯一限制女性開車的國家，此禁令在 2018 年 6 月正式解除，沙國解除女性開車禁令後，對當地經濟發展帶來何種影響？
  options:
  - label: A
    content: 國際移工減少
  - label: B
    content: 石油輸出量增加
  - label: C
    content: 當地觀光人數增加
  - label: D
    content: 失業率上升
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)沙國解除女性開車禁令，使開車人口增加，對從事司機行業的移工造成影響。女性開車對(B)石油輸出、(C)觀光人數均未造成影響。(D)解除女性開車會先影響國際移工，但對失業率不會影響。
- id: doc_112_新北_新北高中_社會_地理_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 徐匯商旅（25°4' N , 121°25' E）即將開幕，未來將接待來自中東的客戶，因此，設計師在每間房間的天花板繪製方向標，方便他們進行禮拜。右圖為伊斯蘭教聖地位置圖，天花板上的方向標，要如何標示？
  options:
  - label: A
    content: →
  - label: B
