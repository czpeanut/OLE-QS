- id: doc_109_台中_興大附中_數學_數B_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 坐標平面上，直線 L 的方程式為 5x＋12y＝2021，則下列選項哪些是正確的？
  options:
  - label: A
    content: L 的斜率為$\frac{5}{12}$
  - label: B
    content: L 的法向量可為（5，12）
  - label: C
    content: L 的法向量可為（10，－24）
  - label: D
    content: L 的方向向量可為（12，5）
  - label: E
    content: 若 L 與另一直線 M：3x－4y＝3 的鈍夾角為θ，則 cosθ＝$-\frac{33}{65}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：L 斜率為$-\frac{5}{12}$

    (B) ○：由 ax＋by＝c 有一組法向量（a，b）可知

    5x＋12y＝2021 有一法向量（5，12）

    (C) ╳：（10，－24）$//＼$（5，12），不為法向量

    (D) ╳：∵（12，5）．（5，12）≠0

    ∴方向向量不為（12，5）

    (E)○：令 L 法向量$\vec{n_{L}}$＝（5，12）

    M 法向量$\vec{n_{M}}$＝（3，－4）

    則 cosθ＝$\pm \frac{\vec{n_{L}} \cdot \vec{n_{M}}}{| \vec{n_{L}} | | \vec{n_{M}} |}$＝$\pm \frac{15-48}{13 \cdot 5}$＝$-\frac{33}{65}$或$\frac{33}{65}$（正不合，因為θ為鈍角）

    故選(B)(E)'
