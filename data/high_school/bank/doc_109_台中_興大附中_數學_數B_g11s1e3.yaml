- id: doc_109_台中_興大附中_數學_數B_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若 O 為原點，下列哪一個條件會使點 P 在$\overline{AB}$上？
  options:
  - label: A
    content: $\vec{OP}$＋$\vec{OA}$＋$\vec{OB}$＝$\vec{0}$
  - label: B
    content: 3$\vec{OP}$＋$\vec{OA}$－4$\vec{OB}$＝$\vec{0}$
  - label: C
    content: $\vec{OA}$＝$\frac{7}{10}\vec{OB}$＋$\frac{3}{10}\vec{OP}$
  - label: D
    content: $\vec{AP}$＝$-\frac{1}{2}\vec{AB}$
  - label: E
    content: $\vec{OA}$＝3$\vec{OP}$－2$\vec{OB}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '若 P 在線段$\overline{AB}$上，則$\vec{OP}$＝α$\vec{OA}$＋β$\vec{OB}$，α＋β＝1，α＞0，β＞0

    (A) ╳：$\vec{OP}$＝－$\vec{OA}$－$\vec{OB}$，（－1）＋（－1）≠1

    (B) ╳：$\vec{OP}$＝$-\frac{1}{3}\vec{OA}$＋$\frac{4}{3}\vec{OB}$，$-\frac{1}{3}$＜0

    (C) ╳：$\vec{OP}$＝$\frac{10}{3}\vec{OA}-\frac{7}{3}\vec{OB}$，$-\frac{7}{3}$＜0

    (D) ╳：$\vec{OP}$－$\vec{OA}$＝$-\frac{1}{2}$（$\vec{OB}$－$\vec{OA}$）

    ⇒ $\vec{OP}$＝$\frac{3}{2}\vec{OA}-\frac{1}{2}\vec{OB}$，$-\frac{1}{2}$＜0

    (E) ○：$\vec{OP}$＝$\frac{1}{3}\vec{OA}$＋$\frac{2}{3}\vec{OB}$

    故選(E)'
