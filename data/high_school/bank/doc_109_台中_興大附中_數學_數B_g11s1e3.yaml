- id: doc_109_台中_興大附中_數學_數B_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 若∣$\vec{a}$∣＝1，∣$\vec{b}$∣＝3，且∣$\vec{a}$－$\vec{b}$∣＝$\sqrt{7}$，求$\vec{a}$與$\vec{b}$之夾角為何？
  options:
  - label: A
    content: 160°
  - label: B
    content: 60°
  - label: C
    content: 120°
  - label: D
    content: 150°
  - label: E
    content: 210°
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '令夾角為θ

    ∣$\vec{a}$－$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$－2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$

    ⇒ $\vec{a}$．$\vec{b}$＝$\frac{3}{2}$

    又$\vec{a}$．$\vec{b}$＝∣$\vec{a}$∣∣$\vec{b}$∣cosθ＝$\frac{3}{2}$

    ⇒ cosθ＝$\frac{1}{2}$

    ⇒ θ＝60°

    故選(B)'
