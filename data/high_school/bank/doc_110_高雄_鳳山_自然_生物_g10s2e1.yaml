  stem: 本文主要在強調下列何種概念？
  options:
  - label: A
    content: 光合作用中酵素的調控機制
  - label: B
    content: 光合作用產生ATP的過程
  - label: C
    content: 光照對於碳反應的重要性
  - label: D
    content: 光反應與碳反應間的關係
  group_stem: 綠色植物行光合作用的過程常被區分為光反應和碳反應兩階段。碳反應中，固定$CO_{2}$的步驟由酵素Rubisco負責進行催化，其活性受到多重因子的調控。有研究顯示，葉綠體基質內氫離子濃度降低鎂離子濃度提升，有利於此酵素活性的表現；而光照也可增進「Rubisco酵素」的活性，以提升Rubisco酵素的活性。此外，在黑暗中，葉肉細胞會持續生成Rubisco酵素的抑制分子，但在光照條件下，該抑制分子會分解而失去作用。 除Rubisco酵素之外，目前已知至少還有其他4種參與碳反應的酵素也需要照光才能被活化。因此，光合作用的碳反應不僅需要利用光反應的能量產物，同時也需要光照來活化多種參與其反應的酵素，所以，光合作用碳反應的進行並不是完全與光照無關。
  answer:
  - C
