  stem: 下列有關顯微觀測所採用的工具與敘述，何者最為適當合理？
  options:
  - label: A
    content: 用來測量細胞的單位常為nm，因此直到顯微鏡發明，細胞學才有長足的進展
  - label: B
    content: 人體細胞中的構造皆可用光學顯微鏡觀察，例如粒線體與核糖體
  - label: C
    content: 若想要觀察昆蟲的複眼、或花朵子房中的胚珠等立體構造，可以使用解剖顯微鏡
  - label: D
    content: 細菌的大小常以μm表示，因此必須要用电子顯微鏡才能看到
  answer:
  - C
