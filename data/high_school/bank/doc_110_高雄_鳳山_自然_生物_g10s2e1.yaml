  section: 1
  number: 12
  type: single
  page: 1
  stem: 氰化物是推理小說或特務電影中常見用來謀殺的無色劇毒，已知其毒性機轉是阻斷粒線體內膜電子傳遞鏈而干擾粒線體的正常功能，進而導致細胞及生物體死亡。請問下列關於氰化物與細胞生理的敘述何者最為直接相關、且正確？
  options:
  - label: A
    content: 氰化物作用在膜蛋白上，使細胞膜無法維持正常的通透性
  - label: B
    content: 氰化物對發酵作用的影響較小，生物仍可透過發酵作用維持生命現象氰
  - label: C
    content: 氰化物使細胞合成ATP的速率下降，因此氰化物對於代謝旺盛的細胞影響較大
  - label: D
    content: 糖解作用產生丙酮酸的反應被阻斷，因此有氧呼吸與發酵作用都無法進行
