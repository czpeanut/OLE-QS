  group_stem: 瘧原蟲和弓漿蟲是屬於同一類原生動物的人類寄生蟲，感染導致瘧疾和弓漿蟲病，兩者都有一種特殊的胞器，稱為端複胞器（apicoplast）。端複胞器是兩次特殊的内共生事件所遺留下來的痕跡。在真核生物的演化史中，以內共生方式將原核生物轉變成細胞内胞器的，除了粒線體外，還有被認為是源自光合菌的葉綠體。根據目前關於真核生物起源的研究，粒線體和葉綠體，都是一次內共生所產生的胞器，即一個遠古時代的古細菌吞噬了另一好氧菌或另一光合菌。 被吞噬的好氧菌或光合菌未經由胞內消化、而是保留在細胞質中，分別演化成為粒線體及葉綠體，此過程稱為一次內共生。瘧原蟲和弓漿蟲端複胞器基因的比較研究，顯示它和紅藻葉綠體基因有相當大的相似度，因此端複胞器被認為是遠古二次内共生事件的結果，即一個紅藻又再度被另一個真核生物所吞噬，並形成其內共生的胞器，故二次內共生的胞器多具有四層膜。目前已知具有二次内共生胞器的生物尚包括了眼蟲、褐藻等，雖然它們的起源並不相同，但是它們的胞器也都具有環形的DNA，與原核生物相似。 雖然源自紅藻，但瘧原蟲和弓漿蟲的端複胞器並沒有進行光合作用的能力，它主要的功用與脂肪酸的合成有關。目前在端複胞器基因體中，已經發現了一些脂肪酸合成途徑的酵素基因如acetyl-carboxylase（ACC基因）與已知的細菌和植物基因相當類似，但在動物中類似基因只發現在粒線體中，與粒線體的脂肪酸合成有關。由於具有動物宿主所沒有的基因，由端複胞器所編碼轉譯的蛋白質，與人體內的蛋白質完全不同。若某特定的藥物能辨識此端複胞器中，如上述的ACC，並進行破壞，那麼這個藥物對人體應不會產生副作用。目前科學家也已證實有一些ACC抑制劑在特定濃度下可抑制弓漿蟲的生長，而不會影響人類細胞。因此未來可能找到具有專一性無副作用的藥劑來治療瘧疾。請根據上文，回答下列問題：
  answer:
  - A
