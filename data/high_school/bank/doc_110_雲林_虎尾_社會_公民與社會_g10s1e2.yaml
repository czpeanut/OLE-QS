  stem: '立法院院會三讀通過《公民投票法》修正草案，公投年齡從20歲降至18歲；提案門檻降為萬分之一（約1,800多人）、連署門檻1.5％（約28萬人）、通過門檻同意票數多於不同意票數，同意票須超過投票人數1／4，並刪除公投審議委員會，未來公投遇選舉應同日舉行；另新增行政院提案權以及不在籍投票。 這次《公投法》修正重點，在於廢除鳥籠公投，在公民投票案提案人數門檻，從最近一次總統、副總統選舉選舉人總數千分之五降至「萬分之一」；連署人數應達提案時由最近一次總統、副總統選舉選舉人總數的5％降至「1.5％」；公投通過投票結果刪除「雙二一制」，修正為有效同意票數多於不同意票，且有效同意票達投票權人總額1／4以上者，即為通過。條文明定，中華民國國民，除《憲法》另有規定外，年滿18歲，未受監護宣告者，有公民投票權；並將全國性公投的主管機關改為「中選會」，廢除公投審議委員會。 民進黨團主張行政院有公投提案權，雖然遭國親反對，但仍依人數優勢表決通過。行政院對於立法原則之創制、重大政策之制或複決，認為有進行公民投票之必要者可提出，經立法院同意交由主管機關辦理公民投票。針對國民黨建議放入不在籍投票，民進黨也放入修正動議，新增「主管機關辦理全國性公民投票得以不在籍投票為之，其實行方式另以法律定之。」相關辦法將另訂於「公職人員選舉罷免法」，或是制定不在籍投票的專法。

    47. ( )立法院於2017年年底修正《公投法》，在公投提案人數門檻，由最近一次總統、副總統選舉選舉人總數千分之五降至「萬分之一」，連署人數則由5％降至「1.5％」，投票年齡也從20歲降至18歲，「鳥籠公投」正式被廢除。請問：依上文，可推測此次《公投法》修正的目的為何？'
