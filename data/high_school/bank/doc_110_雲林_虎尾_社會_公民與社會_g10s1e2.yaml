  stem: '由於公投年齡下修到18歲，許多高中生擁有投票權，一群來自全臺各地的學生發起「全臺高中職公投模擬考」，比照中選會公投流程，在全臺20所學校舉辦模擬公投，希望藉此提升學生公共參與的意願，並了解各個公投議題的內涵。

    49. ( )國內不少學者對公投年齡的下修紛紛表示贊成，認為現今的高中生對於資訊的接收與批判能力都有明顯成長；但也有不少民眾認為，高中生年紀太小了，不適合投票。請從公投年齡下修的討論以及公投的特性進行判断，下列敘述何者正確？'
