  page: 1
  stem: 下列有關選舉制度的敘述，何者是正確的？
  options:
  - label: A
    content: 將全國劃分為多個選區，而每一選區選出3名以上代表，稱為單一選區制
  - label: B
    content: 比例代表制中的國會能相對準確反映大眾的各種利益，提高選民投票的興趣
  - label: C
    content: 絕對多數決制若首輪無人獲得過半選票，須進行第二輪投票，較費時、傷財，我國總統選舉即採取此制度
  - label: D
    content: 法國總統與我國總統選制同為相對多數決，可增加當選人的正當性
