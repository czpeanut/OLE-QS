  stem: 有美國公司發布了一份臺灣網路健康調查報告，顯示臺灣的網路環境存在三大高風險問題：資訊壟斷、訊息誤導、隱私風險。調查顯示，受訪者對問題的意識程度由高至低分別為「資訊壟斷」（85.8％）、「訊息誤導」（77.5％）、「隱私風險」（49.7％）；從行動力來看，由高至低則分別為「隱私風險」（76.1％）、「訊息誤導」（70.9％）、「資訊壟斷」（56.4％）。其中，在隱私風險問題方面，缺乏行動力的年長者與年輕族群相比反而占少數，不過年長者對資訊誤導的問題意識及行動力皆偏低。依據上述的新聞數據，請判斷下列選項何者正確？
  options:
  - label: A
    content: 民眾對資訊壟斷的問題的表現，顯示個資雖遭壟斷運用，但皆是民眾同意
  - label: B
    content: 隱私的問題意識較低，顯示臺灣社會非常的安全，所以不用擔心隱私問題
  - label: C
    content: 年輕族群在隱私風險的方面缺乏問題意識與行動力，顯示年輕人沒有隱私
  - label: D
    content: 年長者在資訊誤導問題意識偏低，可能會造成許多未查證的資訊不斷轉傳
