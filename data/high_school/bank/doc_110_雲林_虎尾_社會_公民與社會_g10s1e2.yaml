  stem: 環保署罕見特別為環評委員遴選舉行記者會。會中指出，第12屆環委任期於2019年7月底屆滿，將公開接受各界推薦專家學者擔任第13屆環委。環委為無給職，每任為2年，可以續任1次，但依規定每屆環委需半數更新，也就是下一屆至少會有7位新任委員。不少人認為這個工作吃力不討好，面對各大小環境評估案件，逃不了各界的輿論和壓力，甚至有環委私下透露，有時在會議上表達的意見，會後都會收到恐嚇訊息。而第13屆環評委員名單公布後，各家報章雜誌紛紛追蹤報導，指出14位民間委員有6位是環工技術領域，社會環境專家少，顯得「專業領域失衡」，除此之外，已經連續2屆僅有1位女性委員，性別比例明顯失衡，也引起32個臺灣婦女團體以及民間組織共同譴責環保署「性別麻木」，性別平等專案小組3位外聘委員更是請辭以示抗議。關於第13屆環委名單公布後的課責機制運作，其屬性來源與何者最為相似？
