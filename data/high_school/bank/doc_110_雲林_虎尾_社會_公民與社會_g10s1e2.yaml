  stem: '宜蘭農地「種」農舍現象，引發宜蘭縣羅東鎮北成國小師生關注。北成國小學生2015年暑假花2個月訪問老農、居民與政府官員，甚至出動空拍機空拍，將300分鐘的影片剪成30分鐘紀錄片，反省人與環境問題。「這是小學生版的《看見宜蘭》」，指導老師李易倫說，《田•滿》有農田被農舍填滿的警示意味，也寓意昔日農家的米缸貼「滿」字。但沒有了田，米缸就不會滿，凸顯農地農用的重要。《田•滿》紀錄片拍攝團隊是北成國小媒體素養中心的學生，在教務主任等人指導下，完成劇本架構、拍攝、約訪、後製剪輯等工作。《929樂團》主唱吳志寧提供樂曲《島》為紀錄片主題曲。他們想告訴大家，農舍不是不能蓋，但應該合理與適當。而從空拍看到農舍東一塊、西一塊，農田破碎，消失嚴重。令人擔心農舍繼續增加，農村景觀也將都市化。「學習不只有課本上知識，更應關心土地」，校長簡信斌說，因拍攝紀錄片，學生對家鄉認識更深。

    42. ( )北成國小師生出動空拍機空拍紀錄片《田•滿》，記錄宜蘭農地「種」農舍現象，影片將在公視及新北市公共頻道播出。請問：此為何種權利的行使？'
