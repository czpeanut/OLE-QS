  type: single
  page: 2
  stem: 已知三次函數 f（x）＝$x^{3}$＋$3x^{2}$＋kx－3 沒有極大極小值，則 k 的範圍為何？
  options:
  - label: A
    content: k ≤ －3
  - label: B
    content: k ≥ －3
  - label: C
    content: k ≥ 0
  - label: D
    content: k ≤ 3
  - label: E
    content: k ≥ 3
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）沒有極大極小值，且 f（x）的三次項係數大於 0

    ∴可知 f（x）為遞增函數，故 f''（x）＞0 或 f''（x）＝0

    由已知得 f''（x）＝$3x^{2}$＋6x＋k，若 f''（x）≥ 0，則 $6^{2}$－4×3×k ≤ 0

    即 36－12k ≤ 0，得 k ≥ 3

    故選(E)'
