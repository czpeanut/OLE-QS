- id: doc_113_台北_明倫_數學_數甲_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 若函數 f（x）滿足$\lim_{x \rightarrow 2} \frac{f ( x )}{x - 2}$＝5，下列選項何者正確？
  options:
  - label: A
    content: x－2 為 f（x）的因式，因此，f（x）＝（x－2）g（x），其中 g（x）為多項式函數，且 g(2)＝5
  - label: B
    content: $\lim_{x \rightarrow 2} f ( x )$＝0
  - label: C
    content: $\lim_{x \rightarrow 2} \frac{f ( x )}{( x - 2 )^{2}}$＝0
  - label: D
    content: $\lim_{x \rightarrow 3} \frac{f ( x )}{x - 2}$＝f(3)
  - label: E
    content: f'(2)＝5
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：由$\lim_{x \rightarrow 2} \frac{f ( x )}{x - 2}$＝5，且$\lim_{x \rightarrow 2} ( x - 2 )$＝0，可知$\lim_{x \rightarrow 2} f ( x )$＝0

    但 g（x）不一定是多項式函數

    (B)○：由(A)知，$\lim_{x \rightarrow 2} f ( x )$＝0

    (C)╳：反例：若 f（x）＝5（x－2），則$\lim_{x \rightarrow 2} \frac{f ( x )}{x - 2}$＝5，但$\lim_{x \rightarrow 2} \frac{f ( x )}{( x - 2 )^{2}}$不存在

    (D)╳：反例：若 f（x）＝$\frac{-5( x - 2 )}{x - 3}$，則$\lim_{x \rightarrow 2} \frac{f ( x )}{x - 2}$＝5

    但$\lim_{x \rightarrow 3} \frac{f ( x )}{x - 2}$＝$\lim_{x \rightarrow 3} \frac{-5}{x - 3}$不存在

    (E)╳：反例：若 f（x）＝$\begin{cases}5 ( x-2 ) , x\neq 2 \\ 1 , x = 2\end{cases}$，則 f''(2)＝$\lim_{x \rightarrow 2} \frac{f ( x )-f ( 2 )}{x - 2}$不存在

    故選(B)'
