  type: fill
  page: 3
  stem: 一跳水選手從高 14.7 公尺的跳水平臺以 9.8 公尺／秒的速度向上彈跳，經 t 秒後，此選手的離地高度是 h（t）＝14.7＋9.8t－4.$9t^{2}$。假設水面與地面等高，試求這位選手入水時的速度為 ＿＿＿＿公尺／秒。
  answer:
  - －19.6
  answer_status: verified
  answer_source: answer_key
  explanation: '入水時 h（t）＝14.7＋9.8t－4.$9t^{2}$＝0

    $\Rightarrow$－4.9（$t^{2}$－2t－3）＝0$\Rightarrow$－4.9（t＋1）（t－3）＝0

    ∴t＝－1（不合）或 3

