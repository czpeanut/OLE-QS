  type: single
  page: 2
  stem: 已知函數 g（x）＝$\begin{cases}3x^{2}-2x , x\geq 1 \\ 2x^{3}-2x , x < 1\end{cases}$，則 g（x）在 x＝1 處的導數為何？
  options:
  - label: A
    content: '4'
  - label: B
    content: '3'
  - label: C
    content: '2'
  - label: D
    content: '1'
  - label: E
    content: 不存在
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow 1^{+}} \frac{g ( x )-g ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{( 3x^{2}- 2x )- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} ( 3x + 1 )$＝4

    $\lim_{x \rightarrow 1^{-}} \frac{g ( x )-g ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{( 2x^{3}- 2x )- 1}{x - 1}$不存在

    $\Rightarrow\lim_{x \rightarrow 1} \frac{g ( x )-g ( 1 )}{x - 1}$不存在

    故選(E)'
