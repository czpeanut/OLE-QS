  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$\begin{cases}a , x\geq 1 \\ 2x , x < 1\end{cases}$

    因為 f（x）在 x＝1 處可微分，所以 f''(1)＝a＝2

    故選(C)'
