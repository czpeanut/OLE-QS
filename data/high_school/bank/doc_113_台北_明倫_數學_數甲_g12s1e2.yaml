    content: f'（x）＝（x－1）$^{3}$（2x＋2）（12x＋4）
  - label: C
    content: f'(1)＝2
  - label: D
    content: f'(0)＝8
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：f''（x）＝〔（x－1）$^{4}$〕''（2x＋2）$^{2}$＋（x－1）$^{4}$〔（2x＋2）$^{2}$〕''

    ＝4（x－1）$^{3}$（2x＋2）$^{2}$＋（x－1）$^{4}$〔2（2x＋2）．2〕

    ＝（x－1）$^{3}$（2x＋2）（8x＋8＋4x－4）

    ＝（x－1）$^{3}$（2x＋2）（12x＋4）

    (B)○：同(A)

    (C)╳：由(A)可知 f''(1)＝0

    (D)╳：由(A)可知 f''(0)＝（－1）$^{3}$×2×4＝－8

    故選(B)'
