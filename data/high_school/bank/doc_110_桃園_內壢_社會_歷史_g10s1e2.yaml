  stem: 「義民」是一項官方賦予協助平定動亂者的身分表徵，除客家族群外，也有閩籍漳泉人士。義民的出現背景之一來自於閩粵族群的「舊恨」，在面對社會動亂時，義民選擇幫助官方平定敵對族群挑起的動亂。而當時客家族群在臺灣為相對少數，在科舉、渡臺、日常農墾處於劣勢，反而較有團結意識。加上義民封號有免除勞役、渡海優惠證照、獲得官職等好處，讓有較強生存危機感的客家族群比較響應官府號召，也較有意主張義民身分。有關上文的理解，下列敘述何者正確？
