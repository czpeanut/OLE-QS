- id: doc_111_台中_興大附中_數學_數甲_g12s2e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設 f（x）＝$2x^{3}$＋$ax^{2}$＋bx－5 為三次實係數多項式，且知 1－2i 為 f（x）＝0 之一根，試問下列哪些敘述正確？
  options:
  - label: A
    content: f（－1－2i）＝0
  - label: B
    content: f（1＋2i）＝0
  - label: C
    content: 沒有實數 x 滿足 f（x）＝$x^{2}$
  - label: D
    content: f（x）＝0 必有一有理根
  - label: E
    content: （a，b）為定值
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳(B)○：∵f（x）＝$2x^{3}$＋$ax^{2}$＋bx－5 為實係數多項式，又 f（1－2i）＝0

    ∴$f (\overline{1 - 2i})$＝0$\Rightarrow$f（1＋2i）＝0

    可得 f（x）＝0 有一實根，兩個共軛虛根

    ∴f（－1－2i）≠0

    (C)╳：∵f（x）－$x^{2}$ 為實係數多項式，且 deg（f（x）－$x^{2}$）＝3

    ∴f（x）＝$x^{2}$ 必有實根

    (D)(E)○：令 x＝1 ± 2i

    ∴（x－1）$^{2}$＝（± 2i）$^{2}\Rightarrowx^{2}$－2x＋1＝$4i^{2}\Rightarrowx^{2}$－2x＋5＝0

    ∴令 $2x^{3}$＋$ax^{2}$＋bx－5＝（$x^{2}$－2x＋5）（2x－1）

    ∴f（x）＝0 必有一有理根為$\frac{1}{2}$

    利用比較係數得

    $x^{2}$ 項：a＝－1＋（－2）×2＝－5

    x 項：b＝5×2＋（－2）×（－1）＝12

    ∴數對（a，b）＝（－5，12）為定值

    故選(B)(D)(E)'
