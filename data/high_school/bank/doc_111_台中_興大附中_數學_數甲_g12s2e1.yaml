  stem: '設隨機變數 X～B（40，0.5），利用 Excel 計算二項分布的部分機率值 P（X＝k）與 P（X$\geq$k）如下表：

    | X | P（X＝k） | P（X$\geq$k） |

    | --- | --- | --- |

    | 23 | 0.080702 | 0.214795 |

    | 24 | 0.057164 | 0.134094 |

    | 25 | 0.036585 | 0.076930 |

    | 26 | 0.021107 | 0.040345 |

    | 27 | 0.010944 | 0.019239 |

    現有一個硬幣，連續投擲此硬幣 40 次，假設在公正的情況下，設出現正面的次數超過 k 次的機率小於 0.05，我們判定此硬幣不公平，試求 k 的最小值為多少？'
  options:
