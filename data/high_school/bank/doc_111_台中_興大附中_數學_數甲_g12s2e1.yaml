- id: doc_111_台中_興大附中_數學_數甲_g12s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 二項分布 X～$B\left( 30 , \frac{2}{5} \right)$，試選出正確的選項。
  options:
  - label: A
    content: X 的可能取值有 30 個
  - label: B
    content: P（X＝11）＝P（X＝13）
  - label: C
    content: X＝12 時，機率最大
  - label: D
    content: σ（X）＜2
  - label: E
    content: $\sum_{k = 0}^{30} kC_{k}^{30}\left( \frac{2}{5} \right) ^{k}\left( \frac{3}{5} \right) ^{30 -k}= 12$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵X～$B\left( 30 , \frac{2}{5} \right)$

    ∴P（X＝k）＝$C_{k}^{30}\left( \frac{2}{5} \right) ^{k}\left( \frac{3}{5} \right) ^{30 -k}$，k＝0，1，2，……，30

    ∴X 的可能取值有 31 個

    (B)╳：∵$\frac{P (X= 11)}{P (X= 13)}$＝$\frac{C_{11}^{30} \left( \frac{2}{5} \right) ^{11} \left( \frac{3}{5} \right) ^{19}}{C_{13}^{30} \left( \frac{2}{5} \right) ^{13} \left( \frac{3}{5} \right) ^{17}}$＝$\frac{\frac{30!}{11!19!}\times \left( \frac{3}{5} \right) ^{2}}{\frac{30!}{13!17!}\times \left( \frac{2}{5} \right) ^{2}}$

    ＝$\frac{12\times 13}{19\times 18}\times \frac{9}{4}$＝$\frac{39}{38}$＞1

    ∴P（X＝11）＞P（X＝13）

    (C)○：∵E（X）＝np＝$30\times \frac{2}{5}$＝12 ∴在 X＝12 時，機率最大

    (D)╳：∵Var（X）＝np（1－p）＝$12\times \left( 1 -\frac{2}{5} \right)$＝$\frac{36}{5}$＝〔σ（X）〕$^{2}$

    ∴σ（X）＝$\frac{6}{\sqrt{5}}$＞2

    (E)○：$\sum_{k = 0}^{30} kC_{k}^{30} \left( \frac{2}{5} \right) ^{k} \left( \frac{3}{5} \right) ^{30 -k}$＝$\sum_{k = 0}^{30} k \cdot P(X =k)$＝E（X）＝np＝$30\times \frac{2}{5}$＝12

    故選(C)(E)'
