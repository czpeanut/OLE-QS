    content: '23'
  - label: B
    content: '24'
  - label: C
    content: '25'
  - label: D
    content: '26'
  - label: E
    content: '27'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∵P（X$\geq$27）＝0.019239，P（X$\geq$26）＝0.040345＜0.05

    又 P（X$\geq$25）＝0.076930＞0.05

    ∴k 的最小值為 25，故選(C)'
