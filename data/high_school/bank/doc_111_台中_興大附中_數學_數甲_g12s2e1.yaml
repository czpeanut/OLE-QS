  stem: 設 k 為整數，已知方程式 $x^{4}$－$3x^{3}$＋$5x^{2}$＋kx－4＝0 在 1 與 2 之間恰有一實根，則 k 值可能為下列哪個選項？
  options:
  - label: A
    content: －4
  - label: B
    content: －2
  - label: C
    content: '2'
  - label: D
    content: '4'
  - label: E
    content: '6'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝$x^{4}$－$3x^{3}$＋$5x^{2}$＋kx－4＝0

    ∵f（x）＝0 在 1 與 2 之間恰有一實根

    ∴f(1)×f(2)＜0

    ∴（1－3＋5＋k－4）×（16－24＋20＋2k－4）＜0

    ∴（k－1）×（2k＋8）＜0

    $\Rightarrow$（k－1）×（k＋4）＜0

    $\Rightarrow$－4＜k＜1

    ∴k＝－2 是其中可能的值，故選(B)'
