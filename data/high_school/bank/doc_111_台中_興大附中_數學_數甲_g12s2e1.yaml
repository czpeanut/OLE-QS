  page: 1
  stem: 若α，β為方程式 $x^{2}$－（3＋i）x＋1＋2i＝0 之兩根，則（2－α）（2－β）＝？
  options:
  - label: A
    content: －1
  - label: B
    content: '1'
  - label: C
    content: －2＋i
  - label: D
    content: 2－i
  - label: E
    content: 3－2i
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '利用根與係數關係

    ∵$x^{2}$－（3＋i）x＋（1＋2i）＝0 之兩根為α，β

    則$\begin{cases}\alpha +\beta =-\frac{-(3 +i)}{1}= 3 +i \\ \alpha \beta =\frac{1 + 2i}{1}= 1 + 2i\end{cases}$

    ∴（2－α）（2－β）＝4－2（α＋β）＋αβ

    ＝4－2（3＋i）＋（1＋2i）

    ＝－1

    故選(A)'
