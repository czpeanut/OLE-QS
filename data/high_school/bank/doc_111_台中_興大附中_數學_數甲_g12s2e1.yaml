- id: doc_111_台中_興大附中_數學_數甲_g12s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 甲袋中有 5 個藍色球，分別編號 1，2，3，4，5；乙袋中有 5 個綠色球，分別編號 2，5，8，11，14，今從甲、乙兩袋中分別取球兩次，每次取一球，取後放回原袋，每球被取的機會均等。設隨機變數 X 表示從甲袋取出的 2 顆球<u>球號差</u>的絕對值；隨機變數 Y 表示從乙袋取出的 2 顆球<u>球號差</u>的絕對值，下列哪些選項正確？
  options:
  - label: A
    content: X 的可能取值為 0、1、2、3、4
  - label: B
    content: P（X＝2）＜P（X＝3）
  - label: C
    content: P（1＜X＜4）＝$\frac{1}{5}$
  - label: D
    content: P（Y＝3）＝P（X＝1）
  - label: E
    content: E（Y）＝3E（X）－1
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$S_{甲}$＝｛1，2，3，4，5｝， 又∣1－1∣＝0，∣2－1∣＝1，∣3－1∣＝2，∣4－1∣＝3，∣5－1∣＝4

    ∴X 的可能取值為 0，1，2，3，4

    (B)╳：X＝2 的可能取值為（1，3），（3，1），（2，4），（4，2），（3，5），（5，3），共 6 種

    $\Rightarrow$P（X＝2）＝$\frac{6}{C_{1}^{5}\times C_{1}^{5}}$＝$\frac{6}{25}$

    X＝3 的可能取值為（1，4），（4，1），（2，5），（5，2），共 4 種

    $\Rightarrow$P（X＝3）＝$\frac{4}{C_{1}^{5}\times C_{1}^{5}}$＝$\frac{4}{25}$

    ∴P（X＝2）＞P（X＝3）

    (C)╳：P（1＜X＜4）＝P（X＝2）＋P（X＝3）

    ＝$\frac{6}{25}+\frac{4}{25}$＝$\frac{10}{25}$＝$\frac{2}{5}$

    (D)○：X＝1 的可能取值為（1，2），（2，1），（2，3），（3，2），（3，4），（4，3），（4，5），（5，4），共 8 種

    $\Rightarrow$P（X＝1）＝$\frac{8}{C_{1}^{5}\times C_{1}^{5}}$＝$\frac{8}{25}$

    Y＝3 的可能取值為（2，5），（5，2），（5，8），（8，5），（8，11）， （11，8），（11，14），（14，11），共 8 種

    $\Rightarrow$P（Y＝3）＝$\frac{8}{C_{1}^{5}\times C_{1}^{5}}$＝$\frac{8}{25}$

    ∴P（X＝1）＝P（Y＝3）

    (E)╳：令 $a_{k}$＝k，$b_{k}$＝3k－1，其中 1$\leq$k$\leq$5，且令 i、j 皆符合 k 之範圍

    ∴Y＝∣$b_{i}$－$b_{j}$∣＝∣（3i－1）－（3j－1）∣＝3∣i－j∣＝3∣$a_{i}$－$a_{j}$∣＝3X

    $\Rightarrow$E（Y）＝3E（X）

    故選(A)(D)'
