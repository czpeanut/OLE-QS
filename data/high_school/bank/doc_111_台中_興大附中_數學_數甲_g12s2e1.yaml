  type: multiple
  page: 2
  stem: 下列各複數中，請選出是$- 8 + 8\sqrt{3}i$的 4 次方根之選項。
  options:
  - label: A
    content: $\sqrt{3} -i$
  - label: B
    content: $- 1 + \sqrt{3}i$
  - label: C
    content: $- \sqrt{3} -i$
  - label: D
    content: $- 1 - \sqrt{3}i$
  - label: E
    content: $- \sqrt{3} +i$
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $z_{k}^{4}$＝$- 8 + 8\sqrt{3}i$

    ＝$16\left( -\frac{8}{16}+\frac{8\sqrt{3}}{16}i \right)$＝$2^{4} \left( -\frac{1}{2}+\frac{\sqrt{3}}{2}i \right)$

    ＝$2^{4}\left( \cos \left( \frac{2\pi}{3}+2k\pi \right) +i\sin \left( \frac{2\pi}{3}+2k\pi \right) \right)$

    ∴$z_{k}$＝$2\left( \cos \left( \frac{\frac{2\pi}{3}+2k\pi}{4} \right) +i\sin \left( \frac{\frac{2\pi}{3}+2k\pi}{4} \right) \right)$，k＝0，1，2，3

    ＝$2\left( \cos \left( \frac{\pi}{6}+\frac{k\pi}{2} \right) +i\sin \left( \frac{\pi}{6}+\frac{k\pi}{2} \right) \right)$，k＝0，1，2，3

    若 k＝0，則 $z_{0}$＝$2\left( \cos \frac{\pi}{6}+i\sin \frac{\pi}{6} \right)$＝$2\left( \frac{\sqrt{3}}{2}+\frac{1}{2}i \right)$＝$\sqrt{3} +i$

    若 k＝1，則 $z_{1}$＝$2\left( \cos \left( \frac{\pi}{6}+\frac{\pi}{2} \right) +i\sin \left( \frac{\pi}{6}+\frac{\pi}{2} \right) \right)$＝$2\left( -\sin \frac{\pi}{6}+i\cos \frac{\pi}{6} \right)$＝$- 1 + \sqrt{3}i$

    若 k＝2，則 $z_{2}$＝$2\left( \cos \left( \frac{\pi}{6}+\pi \right) +i\sin \left( \frac{\pi}{6}+\pi \right) \right)$＝$2\left( -\cos \frac{\pi}{6}-i\sin \frac{\pi}{6} \right)$＝$- \sqrt{3} -i$

    若 k＝3，則 $z_{3}$＝$2\left( \cos \left( \frac{\pi}{6}+\frac{3\pi}{2} \right) +i\sin \left( \frac{\pi}{6}+\frac{3\pi}{2} \right) \right)$＝$2\left( \sin \frac{\pi}{6}-i\cos \frac{\pi}{6} \right)$＝$1 - \sqrt{3}i$

    故選(B)(C)'
