- id: doc_111_台北_北一女中_數學_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: $P_{1}$ 為任意擲兩個均勻銅板，恰好出現一正面的機率；$P_{2}$ 為任意擲四顆公正骰子， 恰有 2 顆出現偶數的機率；$P_{3}$ 為任意擲三顆公正骰子，恰有一顆出現質數的機率。下列敘述何者正確？
  options:
  - label: A
    content: $P_{1}$＝$P_{2}$
  - label: B
    content: $P_{2}$＝$\frac{1}{2}$
  - label: C
    content: $P_{2}$＝$P_{3}$
  - label: D
    content: $P_{3}$＞0.4
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$P_{1}$＝$\frac{2}{2^{2}}=\frac{1}{2}$

    $P_{2}$＝$\frac{(C_{2}^{4}\times 3\times 3)\times 3\times 3}{6^{4}}=\frac{3}{8}$

    $P_{3}$＝$\frac{(C_{1}^{3}\times 3)\times 3\times 3}{6^{3}}=\frac{3}{8}$＝0.375

    故選(C)'
- id: doc_111_台北_北一女中_數學_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 已知 n＝7200，則下列敘述何者正確？
  options:
  - label: A
    content: n 的正因數有 56 個
  - label: B
    content: n 的正因數中為完全平方數的有 10 個
  - label: C
    content: n 的正因數中所有為完全立方數的和為 8
  - label: D
    content: n 的正因數中是 4 的倍數但不是 5 的倍數者有 12 個
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'n＝7200＝$2^{5}$×$3^{2}$×$5^{2}$，正因數形如 $2^{a}$×$3^{b}$×$5^{c}$

    (A) ╳：a＝0，1，2，3，4，5，b＝0，1，2，c＝0，1，2

    ∴有（5＋1）（2＋1）（2＋1）＝54 個

    (B) ╳：a＝0，2，4，b＝0，2，c＝0，2

    使得正因數為完全平方數 ∴有 3×2×2＝12 個

    (C) ╳：a＝0，3，b＝0，c＝0

    使得正因數為完全立方數，這些數為 $2^{0}$×$3^{0}$×$5^{0}$，$2^{3}$×$3^{0}$×$5^{0}$

    ∴和為 1＋8＝9

    (D) ○：a＝2，3，4，5，b＝0，1，2，c＝0，1，2，使得正因數為 4 的倍數

    a＝2，3，4，5，b＝0，1，2，c＝1，2，使得正因數為 20 的倍數

    ∴所求為 4×3×3－4×3×2＝12 個

    故選(D)'
