- id: doc_110_高雄_三民_自然_生物_選修生物I_g12s2e3_s2_5
  section: 2
  number: 5
  type: single
  page: 1
  stem: 下列何種方法可用來進行檢體病毒測，以作為確診依據的方式？
  options:
  - label: A
    content: 反轉錄聚合酶連鎖反應（RT-PCR）
  - label: B
    content: 複式顯微鏡觀察
  - label: C
    content: 基因轉殖技術
  - label: D
    content: 病毒基因體定序
  group_stem: (一) 2019年新冠病毒（COVID-19）疫情於全球爆發至今，指揮中心疫情記者會成為許多人下午2點必看的直播，許多專家提到Ct值，到底什麼是Ct值？為什麼Ct值愈高愈沒有傳染力？到了34、35，甚至可以解除隔離。
    Ct值英文全名為「cycle threshold（CT）value」，中文又可稱為「循環數閥值」，這是新冠肺炎病毒基因在實驗室中，透過病毒核酸進行聚合酶鏈鎖反應（PCR）之後所測出来的數值。<u>長庚大學</u>新興病毒感染研究中心主任<u>施信如</u>指出，新冠病毒非常微小，僅約流感病毒的10分之1，想要監測病毒RNA的濃度，就必須透過反轉錄PCR多次複製特定基因，放大觀測。每將病毒放大1次就是1單位的Ct值，也就是2的次方倍。如果確診者體内病毒RNA濃度很高，進行PCR檢測時，只要複製幾次就能觀測到病毒，此時Ct值數值相對較低，顯示傳染力較高。
    相較之下，許多確診者感染時間較久，體内病毒濃度相當低，在做PCR檢測時，就必須重複複製好多次，才能觀測到病毒RNA濃度，這個時候Ct值數值就較高了，卻也代表傳染力低。一般來說，確診者出現症狀時，Ct值較低，顯示剛被傳染，體内病毒濃度較高。在染疫14至20天後，Ct值漸變高，如果到了30以上，傳染力相當低。另外，Ct值在27、28以上幾乎無法分離出活病毒。因此，<u>臺灣</u>疫情指揮中心將檢測Ct值大於30，作為確診患者解除隔離的條件之一（改編自https：/rcevi.cgu.edu.tw/p/406-1030-85183,r520.php?Lang=zh-tw）
    請依上文和所學回答第5～7題（皆為單選題）。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
