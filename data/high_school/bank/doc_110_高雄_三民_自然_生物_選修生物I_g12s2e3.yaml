questions:
- id: doc_110_高雄_三民_自然_生物_選修生物I_g12s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關基因轉錄的敘述，何者正確？
  options:
  - label: A
    content: 轉錄過程中，DNA的兩股都可作為模版使用
  - label: B
    content: 轉錄的起始點為ATG序列
  - label: C
    content: 轉錄時需要連接酶串接核苷酸
  - label: D
    content: RNA聚合酶移動到終止子的序列上即會脫離DNA
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_110_高雄_三民_自然_生物_選修生物I_g12s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 生物科技發達的結果，人類可以使用細菌來表現許多外源蛋白，但並非所有蛋白質均可交給細菌來表現，主要原因為下列何者？
  options:
  - label: A
    content: 細菌無細胞核，因此轉錄和轉譯必須要同時進行
  - label: B
    content: 細菌利用操縱組來控制基因的表現，因此轉譯後會產生不需要的蛋白質產物
  - label: C
    content: 細菌的基因不具內含子序列，因此不會進行轉錄後修飾
  - label: D
    content: 細菌不具內質網與高基氏體等胞器，許多轉譯後蛋白質的修飾無法進行
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
