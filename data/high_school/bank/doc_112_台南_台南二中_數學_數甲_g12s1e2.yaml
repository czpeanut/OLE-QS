  answer:
  - (1) 27；(2) －1
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) f''(1)＝$\lim_{x \rightarrow 1} \frac{f ( x )-f ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1} \frac{( x - 1 ) ( x - 2 )^{2} ( 2x^{2}+ 1 )^{3}- 0}{x - 1}$

    ＝$\lim_{x \rightarrow 1} ( ( x - 2 )^{2} ( 2x^{2}+ 1 )^{3} )$＝（－1）$^{2}$(3)$^{3}$＝27

    (2) f''（x）＝$\frac{( -2x+1 )'' ( x^{2}+2x+3 )-( -2x+1 ) ( x^{2}+2x+3 )''}{( x^{2}+2x+3 )^{2}}$

    ＝$\frac{( -2 ) ( x^{2}+ 2x + 3 )-( -2x + 1 ) ( 2x + 2 )}{( x^{2}+ 2x + 3 )^{2}}$

    ∴f''（－1）＝$\frac{-2\times 2 - 3\times 0}{2^{2}}$＝－1'
