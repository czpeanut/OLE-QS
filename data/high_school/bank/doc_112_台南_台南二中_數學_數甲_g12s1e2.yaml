  stem: 設三次函數 f（x）＝$ax^{3}$－$3x^{2}$＋（a＋2）x－5 為嚴格遞減函數，則實數 a 的範圍為＿＿＿＿。
  answer:
  - a ≤ －3
  answer_status: verified
  answer_source: answer_key
  explanation: '三次函數 f（x）＝$ax^{3}$－$3x^{2}$＋（a＋2）x－5 為嚴格遞減函數

    $\Rightarrow$f''（x）＝$3ax^{2}$－6x＋（a＋2）≤ 0 恆成立

    $\Rightarrow\begin{cases}開口: 3a < 0 \\ 判別式: ( -6 )^{2}- 4( 3a ) ( a+2 )\leq 0\end{cases}$

    $\Rightarrow\begin{cases}a < 0 \\ -12a^{2}- 24a + 36\leq 0\end{cases}\Rightarrow\begin{cases}a < 0 \\ -12 ( a^{2}+ 2a - 3 )\leq 0\end{cases}$

    $\Rightarrow\begin{cases}a < 0 \\ -12 ( a - 1 ) ( a + 3 )\leq 0\end{cases}\Rightarrow\begin{cases}a < 0 \\ ( a - 1 ) ( a + 3 )\geq 0\end{cases}$

    $\Rightarrow\begin{cases}a < 0 \\ a\leq -3 或 a\geq 1\end{cases}\Rightarrow$a ≤ －3

    ∴a 的範圍為 a ≤ －3'
