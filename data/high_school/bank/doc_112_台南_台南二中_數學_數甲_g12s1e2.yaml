- id: doc_112_台南_台南二中_數學_數甲_g12s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: '[ x ] 表不大於 x 的最大整數。下列各函數何者在 x＝0 處可微分？'
  options:
  - label: A
    content: f（x）＝｜x｜
  - label: B
    content: f（x）＝$\left[ x -\frac{1}{2} \right]$
  - label: C
    content: f（x）＝x｜x｜
  - label: D
    content: f（x）＝$\frac{1}{x}$
  - label: E
    content: f（x）＝$\begin{cases}2x+3 , x\leq 0 \\ 3 , x > 0\end{cases}$
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\lim_{x \rightarrow 0^{-}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{( -x )- 0}{x}$＝－1

    $\lim_{x \rightarrow 0^{+}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{x- 0}{x}$＝1

    ∴在 x＝0 處不可微分

    (B)○：$\lim_{x \rightarrow 0^{-}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{( -1 )-( -1 )}{x}$＝0

    $\lim_{x \rightarrow 0^{+}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{( -1 )-( -1 )}{x}$＝0

    ∴在 x＝0 處可微分

    (C)○：$\lim_{x \rightarrow 0^{-}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{x ( -x )- 0}{x}$＝0

    $\lim_{x \rightarrow 0^{+}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{x ( x )- 0}{x}$＝0

    ∴在 x＝0 處可微分

    (D)╳：f（x）＝$\frac{1}{x}$在 x＝0 處不連續

    ∴不可微分

    (E)╳：$\lim_{x \rightarrow 0^{-}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{( 2x + 3 )- 3}{x}$＝2

    $\lim_{x \rightarrow 0^{+}} \frac{f ( x )-f ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{3 - 3}{x}$＝0

    ∴在 x＝0 處不可微分

    故選(B)(C)'
