  explanation: '已知 $x^{2}$＋4xh＝108$\Rightarrow$h＝$\frac{1}{4x} ( 108 -x^{2} )$，$0 < x < \sqrt{108}$

    令 $x^{2}$h＝$x^{2} \cdot \frac{1}{4x} ( 108 -x^{2} )$＝$\frac{1}{4} ( 108x -x^{3} )$＝f（x）

