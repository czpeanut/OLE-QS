  stem: 設 f（x）＝$\begin{cases}x^{2}+ 1 , x\leq 1 \\ \frac{ax +b}{x + 1} , x > 1\end{cases}$，若 f（x）在 x＝1 處可微分，求實數數對（a，b）＝＿＿＿＿。
  answer:
  - （6，－2）
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）在 x＝1 處可微分

    ∴f（x）在 x＝1 處必連續

    故$\lim_{x \rightarrow 1^{-}} f ( x )$＝$\lim_{x \rightarrow 1^{+}} f ( x )$

    得 $1^{2}$＋1＝$\frac{a\times 1 +b}{1 + 1}\Rightarrow$a＋b＝4$\Rightarrow$b＝4－a

    又 f（x）在 x＝1 處可微分

    ∴$\lim_{x \rightarrow 1^{-}} \frac{( x^{2}+ 1 )-( 1 + 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{\left( \frac{ax +b}{x + 1} \right) -( 1 + 1 )}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{-}} \frac{x^{2}- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{ax + 4 -a - 2x - 2}{( x - 1 ) ( x + 1 )}$

    $\Rightarrow\lim_{x \rightarrow 1^{-}} ( x + 1 )$＝$\lim_{x \rightarrow 1^{+}} \frac{( a - 2 )x -( a - 2 )}{( x - 1 ) ( x + 1 )}$

    $\Rightarrow$2＝$\lim_{x \rightarrow 1^{+}} \frac{( a - 2 ) ( x - 1 )}{( x - 1 ) ( x + 1 )}$

    $\Rightarrow$2＝$\frac{a - 2}{2}\Rightarrow$a＝6

    又 b＝4－a，得 b＝－2

    故數對（a，b）＝（6，－2）'
