  answer:
  - '10'
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $\lim_{x \rightarrow \infty} \frac{f ( x )}{( x^{2}- 1 ) ( 3x + 1 )}$＝1$\Rightarrow$a＝0，b＝3

    (2) $\lim_{x \rightarrow 0} \frac{f ( x )}{x}$存在$\Rightarrow$f（x）有因式 x，即 f(0)＝0

    $\Rightarrow$f(0)＝e＝0

    (3) $\lim_{x \rightarrow 1} \frac{f ( x )}{x - 1}$＝2$\Rightarrow$f（x）有因式 x－1，即 f(1)＝0

    $\Rightarrow$f(1)＝3＋c＋d＝0$\Rightarrow$d＝－c－3

    代回$\lim_{x \rightarrow 1} \frac{f ( x )}{x - 1}$＝$\lim_{x \rightarrow 1} \frac{3x^{3}+cx^{2}-( c + 3 )x}{x - 1}$

    ＝$\lim_{x \rightarrow 1} \frac{( 3x^{3}- 3x )+( cx^{2}-cx )}{x - 1}$

    ＝$\lim_{x \rightarrow 1} \frac{( x - 1 ) ( 3x ( x + 1 )+cx )}{x - 1}$

    ＝$\lim_{x \rightarrow 1} ( 3x ( x + 1 )+cx )$＝3×1×2＋c＝2

    $\Rightarrow$c＝－4，d＝－c－3＝4－3＝1

    ∴f（x）＝$3x^{3}$－$4x^{2}$＋x

    所求 f(2)＝3×$2^{3}$－4×$2^{2}$＋2＝10'
