  answer:
  - y＝－3 及 8x－y＝35
  answer_status: verified
  answer_source: answer_key
  explanation: '設切點 A（t，$t^{2}$－4t＋1）

    f''（x）＝2x－4$\Rightarrow$f''（t）＝2t－4

    $\Rightarrow$過 A 的切線為 y－（$t^{2}$－4t＋1）＝（2t－4）（x－t）

    過 P（4，－3）$\Rightarrow$－3－（$t^{2}$－4t＋1）＝（2t－4）（4－t）

    $\Rightarrow$－3－$t^{2}$＋4t－1＝8t－$2t^{2}$－16＋4t

    $\Rightarrowt^{2}$－8t＋12＝0

    $\Rightarrow$（t－2）（t－6）＝0

    $\Rightarrow$t＝2 或 6

    (1) t＝2 時，f''(2)＝2×2－4＝0 ∴切線 y－（－3）＝0（x－4）$\Rightarrow$y＝－3

    (2) t＝6 時，f''(6)＝2×6－4＝8 ∴切線 y－（－3）＝8（x－4）$\Rightarrow$8x－y＝35

    故所求切線方程式為 y＝－3 及 8x－y＝35'
- id: doc_112_台南_台南二中_數學_數甲_g12s1e2_s2_6
