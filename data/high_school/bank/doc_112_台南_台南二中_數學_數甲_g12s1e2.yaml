- id: doc_112_台南_台南二中_數學_數甲_g12s1e2_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 已知（x＋1）$^{2}$ 可整除多項式 f（x）＝$x^{8}$＋$ax^{3}$＋bx＋1，則下列何者正確？
  options:
  - label: A
    content: a＋b＝2
  - label: B
    content: a＝－1
  - label: C
    content: $\lim_{x \rightarrow -1} \frac{f ( x )}{x + 1}$＝0
  - label: D
    content: 函數 f（x）在 x＝1 附近的一次近似為 14x－12
  - label: E
    content: ｜f（0.999）－4｜＜0.1
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$8x^{7}$＋$3ax^{2}$＋b

    又 f（x）＝$x^{8}$＋$ax^{3}$＋bx＋1 有因式（x＋1）$^{2}$

    $\Rightarrow\begin{cases}f( -1 )= 0 \\ f'' ( -1 )= 0\end{cases}$

    $\Rightarrow\begin{cases}f( -1 )=( -1 )^{8}+a ( -1 )^{3}+b ( -1 )+1 = 0 \\ f'' ( -1 )= 8 ( -1 )^{7}+ 3a ( -1 )^{2}+b = 0\end{cases}$

    $\Rightarrow\begin{cases}1 -a -b + 1 = 0 \\ -8 + 3a +b = 0\end{cases}$

    $\Rightarrow\begin{cases}a +b = 2 \\ 3a +b = 8\end{cases}\Rightarrow$a＝3，b＝－1

    (A)○：a＋b＝3＋（－1）＝2

    (B)╳：a＝3

    (C)○：$\lim_{x \rightarrow -1} \frac{f ( x )}{x + 1}$＝$\lim_{x \rightarrow -1} \frac{( x + 1 )^{2} \cdot g ( x )}{x + 1}$＝$\lim_{x \rightarrow -1} ( ( x + 1 ) \cdot g ( x ) )$＝0

    (D)╳：f（x）在 x＝1 附近的一次近似為 f''(1)（x－1）＋f(1)

    由 f(1)＝(1)$^{8}$＋3(1)$^{3}$－1＋1＝4

    f''(1)＝8(1)$^{7}$＋9(1)$^{2}$＋（－1）＝16

    ∴所求為 16（x－1）＋4＝16x－12

    (E)○：由(D)，｜f（0.999）－4｜$\approx$｜（16（0.999－1）＋4）－4｜

    ＝｜16（－0.001）｜＝0.016＜0.1

    故選(A)(C)(E)'
