  stem: 設（a，b）是對數函數 y＝$log_{2}$x 圖形上任意點，則下列哪些點必在此函數圖形上？
  options:
  - label: A
    content: （1，0）
  - label: B
    content: （2a，b＋1）
  - label: C
    content: （2a，b）
  - label: D
    content: $\left( \frac{1}{a} , 1 - b \right)$
  - label: E
    content: （$a^{2}$，2b）
  explanation: 'b＝$log_{2}$a

    (A)○：0＝$log_{2}$1 ∴（1，0）在圖形上

    (B)○：$log_{2}$2a＝1＋$log_{2}$a＝1＋b ∴（2a，b＋1）在圖形上

    (C)╳：同(B)

    (D)╳：$\log _{2}\frac{1}{a}$＝$log_{2}$1－$log_{2}$a＝0－$log_{2}$a＝－b

    (E)○：$log_{2}a^{2}$＝2 $log_{2}$a＝2b ∴（$a^{2}$，2b）在圖形上

    故選(A)(B)(E)'
