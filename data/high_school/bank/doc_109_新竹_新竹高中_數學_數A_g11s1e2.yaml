  explanation: 'F(1)＝a×（1－$10^{－b×1}$）＝200 ……………①

    F(2)＝a×（1－$10^{－b×2}$）＝300 ……………②

    $\frac{①}{②}$得$\frac{1 - 10^{-b}}{1 - ( 10^{-b} ) ^{2}} = \frac{2}{3}\Rightarrow$3－3×$10^{－b}$＝2－2（$10^{－b}$）$^{2}$

    $\Rightarrow$2（$10^{－b}$）$^{2}$－3（$10^{－b}$）＋1＝0

    $\Rightarrow$（$10^{－b}$－1）（2×$10^{－b}$－1）＝0

    $\Rightarrow10^{－b}$＝1 或 $\frac{1}{2}$

    若 $10^{－b}$＝1 代入①$\Rightarrow$不合

    若 $10^{－b}$＝$\frac{1}{2}$代入①$\Rightarrowa\times \left( 1 - \frac{1}{2} \right) = 200\Rightarrow$a＝400

    ∴F(3)＝a×（1－$10^{－b×3}$）＝$400\times \left[ 1 - \left( \frac{1}{2} \right) ^{3} \right]$＝$400\times \frac{7}{8}$＝350

    故三星期後，<u>阿悟</u>可背熟 350 個單字'
