  explanation: '設 t＝$3^{x}$＋$3^{－x}\Rightarrowt^{2}$＝（$3^{x}$＋$3^{－x}$）$^{2}$＝$9^{x}$＋$9^{－x}$＋2$\Rightarrow9^{x}$＋$9^{－x}$＝$t^{2}$－2

