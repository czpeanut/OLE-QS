  explanation: '$1320\times \left( \frac{1}{2} \right) ^{\frac{n}{8}} = 110\Rightarrow\left( \frac{1}{2} \right) ^{\frac{n}{8}} = \frac{1}{12}\Rightarrow2^{\frac{n}{8}} = 12$

    $\Rightarrow\log 2^{\frac{n}{8}}$＝log12$\Rightarrow\frac{n}{8}\log 2$＝2 log2＋log3$\Rightarrow\frac{n}{8}$×0.3010$\approx$2（0.3010）＋0.4771

