- id: doc_109_新竹_新竹高中_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 關於對數函數圖形的敘述，下列哪些選項是正確的？
  options:
  - label: A
    content: y＝logx 為嚴格遞增函數
  - label: B
    content: y＝logx 與 y＝$\log _{\frac{1}{10}}x$的圖形對稱於 x 軸
  - label: C
    content: y＝logx 與 y＝log（－x）的圖形對稱於 y 軸
  - label: D
    content: y＝logx 對稱直線 x＝y 之後的函數為$y = \left( \frac{1}{10} \right) ^{x}$
  - label: E
    content: 在 y＝logx 的圖形上任取相異兩點 A，B，則直線 AB 的斜率為正
  explanation: '(A)○：$x_{2}$＞$x_{1}$ 時，$logx_{2}$＞$logx_{1}$ ∴y＝logx 為嚴格遞增函數

    (B)○：設 f（x）＝logx，$g ( x ) = \log _{\frac{1}{10}}x$

    $\Rightarrow$f（x）＝－g（x）

    ∴圖形對稱於 x 軸

    (C)○：設 f（x）＝logx，g（x）＝log（－x）

    $\Rightarrow$f（－x）＝g（x）

    ∴圖形對稱於 y 軸

    (D)╳：y＝logx 對稱於 x＝y 之後的函數為 x＝logy$\Rightarrow$y＝$10^{x}$

    (E)○：y＝logx 為嚴格遞增函數

    故選(A)(B)(C)(E)'
