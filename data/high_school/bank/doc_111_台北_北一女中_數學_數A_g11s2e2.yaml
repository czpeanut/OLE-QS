  stem: 直線 L：$\frac{x-2}{2}$＝$\frac{y-1}{1}$＝$\frac{z-4}{4}$，請從下列選項中選出其圖形與直線 L 相同者。
  options:
  - label: A
    content: $L_{1}$：$\frac{x}{2}=\frac{y}{1}=\frac{z}{4}$
  - label: B
    content: $L_{2}$：$\frac{x-2}{2}=\frac{1-y}{-1}=\frac{4-z}{-4}$
  - label: C
    content: $L_{3}$：$\begin{cases}\frac{x}{2}=\frac{y}{1} \\ \frac{y}{1}=\frac{z}{4}\end{cases}$
  - label: D
    content: $L_{4}$：$\begin{cases}x-3y+2=0 \\ 2x-z=0\end{cases}$
  - label: E
    content: $L_{5}$：$\begin{cases}x=-2t \\ y=-t \\ z=-4t\end{cases}$，t ∈ R
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'L 之方向向量$\vec{v}$＝（2，1，4），L 上點 P（2，1，4）

    (A) ○：$\vec{v_{1}}$＝（2，1，4）//$\vec{v}$，且點 P 代入 $L_{1}$ 合

    (B) ○：$L_{2}$ 可表示為$\frac{x-2}{2}=\frac{y-1}{1}=\frac{z-4}{4}$，同 L

    (C) ○：$L_{3}$ 可表示為$\frac{x}{2}=\frac{y}{1}=\frac{z}{4}$，同 $L_{1}$

    (D) ╳：點 P 代入 x－3y＋2＝0 不合，得 $L_{4}$≠L

    (E) ○：$\vec{v_{5}}$＝（－2，－1，－4）//$\vec{v}$，且點 P 代入 $L_{5}$ 得$\begin{cases}2=-2t \\ 1=-t \\ 4=-4t\end{cases}$⇒ t＝－1，合

    故選(A)(B)(C)(E)'
