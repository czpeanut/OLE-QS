  stem: 下列各選項中，請選出空間中的兩圖形為平行的。
  options:
  - label: A
    content: $L_{1}$：$\frac{x-1}{1}$＝$\frac{y-6}{6}$＝$\frac{z-8}{8}$；$L_{2}$：$\frac{x-1}{1}$＝$\frac{y-6}{6}$＝$\frac{z+8}{8}$
  - label: B
    content: $L_{3}$：$\frac{x-1}{1}$＝$\frac{y-2}{2}$＝$\frac{z-3}{3}$；$L_{4}$：$\begin{cases}\frac{x-1}{1}=\frac{y+2}{2} \\ \frac{y+2}{2}=\frac{z-3}{3}\end{cases}$
  - label: C
    content: $L_{5}$：$\begin{cases}x=1+5t \\ y=0-4t \\ z=1+3t\end{cases}$，t ∈ R；$L_{6}$：$\begin{cases}x=1-5s \\ y=1+4s \\ z=1-3s\end{cases}$，s ∈ R
  - label: D
    content: $L_{7}$：x＝y＝z；$E_{1}$：5x－2y－3z＝7
  - label: E
    content: $E_{2}$：3x＋4y＋5z＝6；$E_{3}$：6x＋8y＋10z＝6
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：兩直線方向向量平行，且 $L_{1}$ 上點（1，6，8）代入 $L_{2}$ 不合

    所以 $L_{1}$//$L_{2}$

    (B) ○：$L_{4}$：$\begin{cases}\frac{x-1}{1}=\frac{y+2}{2} \\ \frac{y+2}{2}=\frac{z-3}{3}\end{cases}$⇒$\frac{x-1}{1}=\frac{y+2}{2}=\frac{z-3}{3}$

    兩直線方向向量平行，且 $L_{3}$ 上點（1，2，3）代入 $L_{4}$ 不合

    所以 $L_{3}$//$L_{4}$

    (C) ○：兩直線方向向量平行，且 $L_{5}$ 上點（1，0，1）代入 $L_{6}$：$\begin{cases}1=1-5s \\ 0=1+4s \\ 1=1-3s\end{cases}$不合

    所以 $L_{5}$//$L_{6}$

    (D) ○：直線 $L_{7}$ 方向向量$\vec{v_{7}}$＝（1，1，1），平面 $E_{1}$ 法向量$\vec{n_{1}}$＝（5，－2，－3）

    ⇒$\vec{v_{7}}$．$\vec{n_{1}}$＝5－2－3＝0

    又 $L_{7}$ 上點（0，0，0）代入平面 $E_{1}$ 不合

    所以 $L_{7}$//$E_{1}$

    (E) ○：兩平面法向量平行，且 $E_{2}$ 上點（2，0，0）代入 $E_{3}$ 不合

    所以 $E_{2}$//$E_{3}$

    故選(A)(B)(C)(D)(E)'
- id: doc_111_台北_北一女中_數學_數A_g11s2e2_s1_2
