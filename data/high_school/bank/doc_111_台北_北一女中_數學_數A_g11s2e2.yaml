  stem: '一個標有 1 至 12 號格子的 12 格戳戳樂遊戲，每回遊戲以投擲一枚均勻銅板四次來決定要戳哪些格子。規則如下：

    (一)第一次投擲銅板，若是正面，則戳 1 號格子；若是反面，則戳 3 號格子。

    (二)第二、三、四次投擲銅板，若是正面，則所戳格子的號碼為前一次所戳格子的號碼加 1；若是反面，則所戳格子的號碼為前一次所戳格子的號碼加 3，依此類推。

    例如：投擲銅板四次的結果依序為「正、反、反、正」，則會戳編號分別為 1、4、7、8 號的四個格子。假設 $p_{m}$ 代表在每回遊戲中 m 號格子被戳到的機率。

    (1) 試選出正確的選項。（多選題，8 分）

    (2) 在 6 號格子被戳到的條件下，5 號格子也被戳到的機率為＿＿＿＿。（填充題，5 分）'
