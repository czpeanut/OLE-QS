- id: doc_111_新北_明德_自然_生物_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 人類胚胎發育時，細胞迅速進行分裂與生長，並生成細胞膜，細胞膜的成分<u>不含</u>下列何者？
  options:
  - label: A
    content: 蛋白質
  - label: B
    content: 磷脂
  - label: C
    content: 醣類
  - label: D
    content: 核糖核酸
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 細胞膜為細胞最外層的構造，主要由磷脂、蛋白質、醣類及固醇類所組成，故選(D)。
- id: doc_111_新北_明德_自然_生物_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列有關有氧呼吸和發酵作用的比較，何者正確？
  options:
  - label: A
    content: 有氧呼吸的過程全部都在粒線體內進行
  - label: B
    content: 發酵作用都有二氧化碳的產生
  - label: C
    content: 發酵作用的過程全部都在細胞質中進行
  - label: D
    content: 人體細胞只能進行有氧呼吸，不能進行發酵作用
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 有氧呼吸的場所包括細胞質與粒線體。

    (B) 乳酸發酵未生成二氧化碳。

    (D) 人體的骨骼肌細胞可進行乳酸發酵。'
