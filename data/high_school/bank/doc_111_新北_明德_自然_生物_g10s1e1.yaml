- id: doc_111_新北_明德_自然_生物_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 細胞利用呼吸作用以獲得能量，下列有關呼吸作用的敘述，何者正確？
  options:
  - label: A
    content: 有氧呼吸的過程中，$O_{2}$ 會進入粒線體參與作用
  - label: B
    content: 有氧呼吸的過程中，葡萄糖會進入粒線體，然後被分解為丙酮酸
  - label: C
    content: 當骨骼肌細胞缺氧時，丙酮酸會進入粒線體，然後被分解產生 ATP
  - label: D
    content: 當酵母菌在缺氧環境下，葡萄糖會進入粒線體，然後被分解產生 ATP
