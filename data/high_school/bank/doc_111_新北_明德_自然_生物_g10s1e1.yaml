  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) 有氧呼吸的過程中，葡萄糖會在細胞質內被分解為丙酮酸。

    (C) 當骨骼肌細胞缺氧時，丙酮酸在細胞質內會轉變為乳酸。

    (D) 當酵母菌在缺氧環境下，丙酮酸在細胞質內會轉變為酒精與二氧化碳。'
