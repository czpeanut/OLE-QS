- id: doc_111_新北_明德_自然_生物_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 當生物老師踩出雙重橫撤步（double side back）投籃得分時，其骨骼肌細胞內何種構造可提供較多的 ATP？
  options:
  - label: A
    content: 高基氏體
  - label: B
    content: 粒線體
  - label: C
    content: 中心體
  - label: D
    content: 溶體
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 粒線體為細胞進行呼吸作用的主要場所，可生成較多的 ATP，故選(B)。
- id: doc_111_新北_明德_自然_生物_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列何種作用是有氧呼吸與發酵作用皆須進行的步驟？
  options:
  - label: A
    content: 葡萄糖分解產生丙酮酸
  - label: B
    content: 丙酮酸進一步分解為 $CO_{2}$ 與 $H_{2}$O
  - label: C
    content: 丙酮酸轉變為酒精與 $CO_{2}$
  - label: D
    content: 丙酮酸轉變為乳酸
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 有氧呼吸為(A)→(B)；酒精發酵為(A)→(C)；乳酸發酵為(A)→(D)，故選(A)。
- id: doc_111_新北_明德_自然_生物_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 生物個體或構造與其量測或觀察工具的對應關係，下列何者<u>最不恰當</u>？
  options:
