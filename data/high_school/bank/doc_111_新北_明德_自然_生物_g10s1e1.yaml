  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) 內質網—協助物質的運輸。

    (C) 粒線體—生成 ATP。

    (D) 細胞膜－控制物質進出細胞。'
- id: doc_111_新北_明德_自然_生物_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 狂牛症是指牛的海綿樣腦病變，經由一種稱為普里昂（prion）的蛋白質所傳染，其潛伏期可能長達好幾年，但一旦發病，牛隻會在數個星期內死亡。下列何者是狂牛症病原體的成分？
  options:
  - label: A
    content: 脂肪酸
  - label: B
    content: 核糖核酸
  - label: C
    content: 核苷酸
  - label: D
    content: 胺基酸
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 狂牛症的病原體為蛋白質，胺基酸為組成蛋白質的單元分子，故選(D)。
