  stem: 建立公平國際碳權交易在國際上是一重要議題，而我國於 2023 年年末成立臺灣碳權交易所，由碳權交易所協助過濾碳權來源、確定案場、碳權品質並且提供透明安全交易機制，讓需要碳權的企業能有一公平公正公開管道進行購買及抵銷，加速淨零轉型，也是我國結合公私部門關鍵資源，共同推動淨零轉型的具體實踐。請問在企業可以交易碳排放權的情況下，若交易價格持續上升，其原因最可能為下列何者？
