  section: 3
  number: 2
  type: calc
  page: 13
  stem: '解決外部效果一直是政府維持市場機制的課題，界定財產權是解決外部成本的一種方式，但寇斯認為交易成本等於零，才可以讓雙方自行協商解決外部成本的問題，例如：工廠排放工業廢水至旁邊的河川所產生的汙染問題，藉由界定河川的財產權就可以讓雙方自行協商解決汙染問題，請回答以下問題：

    (1)何謂交易成本（定義 3 分），請舉例說明（舉例 2 分）。

    (2)界定河川的財產權給工廠負責人還是當地居民可以解決汙染問題？請說明理由（5 分）。'
  answer:
  - (1)交易成本指的是買賣雙方於協調中產生的成本，包括無形的時間、精神消耗與有形的各種成本。舉例：搜尋、議價、運輸、訂約、履約等成本。
  answer_status: verified
  answer_source: answer_key
  explanation: 寇斯定理是指在交易成本為零且財產權明確的情況下，市場中的雙方可以透過協商達成有效率的解決方案，無論財產權歸屬於哪一方。換言之，只要財產權被清楚界定，汙染問題可以通過協商解決，即可達到最佳的資源配置。
