  stem: 美國租車公司龍頭 Hertz，過去看好電動車的發展市場，在 2022 年曾宣布要大舉擴張電動車出租車隊，然而到了 2023 年，Hertz 卻表示要售出旗下所擁有的 2 萬臺電動車。這是因為許多消費者族群並不熟悉電動車，因此傾向選擇租用傳統的燃油車，導致引入電動車對營收的貢獻不如預期。因此 Hertz 會在未來逐漸縮減電動車隊，並重新購入傳統的燃油汽車。依據題文判斷，若電動車市場的其他條件不變，下列敘述何者最為可能？
