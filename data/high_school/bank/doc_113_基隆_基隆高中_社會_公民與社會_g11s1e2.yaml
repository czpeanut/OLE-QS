  section: 1
  number: 2
  type: single
  page: 1
  stem: 有鑑於全球暖化的問題日漸緊迫，愈來愈多的國家開始嘗試更多樣化的方式來應對溫室氣體，尤其是二氧化碳增加的問題。其中一種方法來自於英國經濟學家皮古的說法：「外部性來源於私人成本與社會成本的落差。因此政府應矯正私人成本，使其與社會成本相符合」。請問下列哪一做法，最符合皮古的理論？
  options:
  - label: A
    content: 針對高排碳量的產業，如石化工業或火力發電廠，課徵碳稅
  - label: B
    content: 使高排碳量產業的營運標準更嚴格，使其擴廠或新建變得更困難
  - label: C
    content: 劃定碳排放權為一種財產權，並鼓勵產業間交易此種權利
  - label: D
    content: 建立更嚴謹與透明的監察機制，讓民眾可隨時查看工廠排碳情形
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 皮古稅（Pigouvian tax）是指對任何產生負的外部性（成本未包含在市場價格中）市場活動的稅收，目的是將未內部化的成本納入市場價格中，促使行為者承擔外部成本並調整其行為，故選(A)。(B)此為直接管制之做法。(C)此為界定財產權。(D)此為公開資訊之做法。
