  stem: 現今環保當道，許多消費者都考慮將燃油車改為電動車，但電動車電池成本昂貴，占電動車售價約 40 ％左右，這也是目前一般消費者買不起電動車的原因。有研究指出，汽車製造商正投資開發新電池化學品、材料，以及提升電動車效能的軟體，使電池和電動車價格逐步往下降。預計到 2030 年，電動車價格將會與燃油車一樣便宜。以下相關分析，何者說明正確？
