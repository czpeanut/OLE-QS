  section: 1
  number: 1
  type: single
  page: 1
  stem: 阿文是某島嶼國的環保部長，近日他對國內日益嚴重的空氣汙染及過量垃圾感到憂心忡忡，因此召集各級官員商討應對政策。某官員認為該國絕大多數民眾都是避罰服從取向的好公民，可透過「負向誘因」來設計相關制度。若阿文決定採納該官員的建議，下列哪一項政策最為貼近該官員的設計理念？
  options:
  - label: A
    content: 對排放黑煙的交通工具進行取締，並公告車牌
  - label: B
    content: 拿電池及光碟至超商回收，可以給予購物折扣
  - label: C
    content: 針對環保節能的運具給予補貼，鼓勵民眾購買
  - label: D
    content: 捐款給環保相關公益團體，可以抵部分綜合所得稅
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)屬於負向非金錢誘因，為正解。(B)(C)(D)皆為正向誘因。
