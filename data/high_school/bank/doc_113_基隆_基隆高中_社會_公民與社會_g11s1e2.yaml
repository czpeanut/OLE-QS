- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '下表是星星社區內，豆花伯販售的豆花一天內的供需狀況。請問下列敘述何者正確？

    | 價格（元） | 供給量（單位／天） | 需求量（單位／天） |

    | --- | --- | --- |

    | 30 | 100 | 180 |

    | 40 | 120 | 160 |

    | 50 | 140 | 140 |

    | 60 | 160 | 120 |

    | 70 | 180 | 100 |'
  options:
  - label: A
    content: 豆花的均衡價格是由豆花伯獨立決定
  - label: B
    content: 在 40 元時，豆花的均衡數量短缺 20 單位
  - label: C
    content: 在 70 元時，出現供過於求而過剩 80 單位
  - label: D
    content: 在 50 元時，豆花面臨供不應求，有漲價壓力
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)豆花的均衡價格是由買賣雙方一起決定。(B)在 40 元時，豆花的數量短缺 160－120＝40 單位。(C)在 70 元時，豆花的數量過剩 180－100＝80 單位，為正解。(D)在 50 元時，供給量等於需求量皆為 140 單位，為市場均衡的狀態。
  tags:
    unit:
      code: CI-3-3-1
