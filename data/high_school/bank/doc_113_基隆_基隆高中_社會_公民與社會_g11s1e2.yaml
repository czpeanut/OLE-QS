  section: 2
  number: 38
  type: single
  page: 12
  stem: 針對上述通過《房屋稅條例》部分條文修正草案的政策分析，以下何種解釋最為適當？
  options:
  - label: A
    content: 房屋具有稀少性，必須提高房價才得以解決供需失衡之情形
  - label: B
    content: 提高持有非自住房屋稅率，增加國家預算符合成本效益分析
  - label: C
    content: 擴大國內非自住房屋的出售及租賃，落實無屋者的居住正義
  - label: D
    content: 鼓勵政府與業者公私協力興建社會住宅，完善社會安全制度
  group_stem: '為回應廣大民意，立法院在 2023 年底通過攸關囤房稅 2.0 的《房屋稅條例》部分條文修正草案，預計於 2025 年 5 月開徵。專家預估未來房市將出現四大變化：

    一、多屋族可能會在節稅前提下，啟動房產重新配置，減少在高稅率縣市的持有量，降低整體的持有稅負擔。

    二、多屋族可能會開始出租手中多餘的房屋，以換取降稅。原因就是比起囤房稅 2.0 最高稅率 4.8 ％，將房產出租所適用的稅率僅 1.5 ％到 2.4 ％，因此新制上路後，可望促使多屋族將空屋出租。

    三、買家可能會捨新屋買中古屋，主因為房屋稅還是以房屋標準單價、屋齡和路段等條件來課稅，所以愈新的住宅，被課徵的房屋稅就會愈高，在稅率調升的情況下，買家可能因此轉向中古屋市場。

    四、建商可能會更傾向先完銷預售屋，以避免銷售期拉長，導致新成屋被課以重稅。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《房屋稅條例》修正草案是有鑑於有錢人囤房（多屋族）推升房價，而祭出的打房措施，目標是為了降低房價。(B)應該是會增加國家稅收，與國家預算無關。(C)此乃修正草案的目的，為正解。(D)這並非《房屋稅條例》修正草案的目的，且題文也未提及相關概念。
