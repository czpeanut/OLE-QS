  stem: 印尼度假勝地峇里島（Bali）每年總會吸引數百萬名遊客造訪，但也因「過度旅遊」而衍生出許多問題，包括垃圾遍布海岸，遊客酒駕、非法工作、不尊重宗教場所、非法使用加密貨幣支付服務費等。當地政府為了解決嚴重的垃圾和交通問題，決定自 2024 年 2 月 14 日起，針對外國遊客徵收「旅遊稅」，每人約為 15 萬印尼盾（約新臺幣 300 元），大人與小孩相同費用。此外，該「旅遊稅」可事先繳納，並可透過信用卡、銀行轉帳、虛擬帳戶等方式支付。另外依據規定，遊客每次入境峇里島都須繳稅，換句話說如果遊客跳島旅遊完畢再返回峇里島時，需再次支付「旅遊稅」。根據官方說明，徵收的「旅遊稅」將會使用在改善旅遊服務品質、保護當地的文化遺產和自然奇觀等方面。請問下列有關峇里島政府該項政策的用意與對旅遊市場的影響，下列何者敘述正確？
