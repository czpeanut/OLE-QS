- id: doc_113_基隆_基隆高中_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: '資料一：私人櫻花林園的所有權人平時為了養護櫻花樹，會購買肥料，並聘請園丁定期施肥、除草與修剪樹枝。而在櫻花季的期間，林園開放免費入園賞花，無償提供民眾觀光遊憩的場所，同時也帶動周邊餐廳與店家的收益提升。

    資料二：夜市攤販以油炸或燒烤料理出美味的小吃，並向顧客收取餐點的費用。路過的行人雖然沒有向攤販消費，但料理產生的油煙卻可能造成他們的不適，甚至附近的住戶也因為油煙會吹進家裡，無法打開窗戶通風，從而降低了生活品質。

    請問依照經濟學原理，有關資料一與資料二的敘述，下列何者正確？'
  options:
  - label: A
    content: 資料一與資料二中，只有外部效果是負面時，才會對我們的日常生活產生影響
  - label: B
    content: 資料二中，製造油煙的路邊攤之經濟行為會影響無關的第三人，產生外部效益情形
  - label: C
    content: 資料二中，生產者負擔的私人成本高於社會成本，所以會過度生產而產生較多的公害
  - label: D
    content: 資料一中，行為人的行為對不相關第三人產生正面影響，第三人不需支付報酬即可享用
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一為外部效益（正的外部性），資料二為外部成本（負的外部性）。(A)正面或負面的外部效果皆會對我們的生活產生影響。(B)應是產生外部成本。(C)應是生產者負擔的私人成本低於社會成本，所以會過度生產，製造較多的公害。(D)此為外部效益之概念，為正解。
  tags:
    unit:
      code: CI-3-4-3
      book: 公民與社會3 選擇與永續
      chapter: 市場失靈與外部性
      title: 外部效果
      std: true
    textbook: 公民與社會3 選擇與永續 外部效果
    labeled_by: agent
    label_confidence: high
