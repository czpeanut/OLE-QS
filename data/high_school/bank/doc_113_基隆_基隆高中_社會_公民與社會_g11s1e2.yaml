  type: single
  page: 1
  stem: 消費者在購物時，因為不想以較高的價格買到一樣的商品，常需要花費時間、精力來「貨比三家不吃虧」，有業者注意到這個情形，提出店內商品「買貴退差價」的保證。請問上述業者主要著眼於下列選項中，何者所引發的問題？
  options:
  - label: A
    content: 政府干預
  - label: B
    content: 外部效果
  - label: C
    content: 交易成本過高
  - label: D
    content: 財產權界定不清
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中「提出店內商品『買貴退差價』的保證」，是因為民眾沒有辦法一直比價找到最便宜的商品，因此買貴退差價可降低交易成本過高造成的外部成本，答案選(C)。交易成本指的是買賣雙方於協調中產生的各種成本，包括無形的時間、精神消耗與有形的各種費用，如：搜尋、議價、運輸、訂約、履約等成本。
