  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 在冰河流動的過程中，常在冰河的底部和側邊出現「擦痕」，此屬於冰河侵蝕地形，且其方向與冰河流向一致。鼓丘和羊背石長軸的方向都和冰河流向一致，但鼓丘屬冰積地形，(D)羊背石是冰蝕地形。
