  stem: 依據上表資料判斷，「擦痕」與冰河流動方向之關係，和下列哪個冰蝕地形最接近？
  options:
  - label: A
    content: 鼓丘
  - label: B
    content: 端磧
  - label: C
    content: 冰坎
  - label: D
    content: 羊背石
  group_stem: '1930 年代日本學者鹿野忠雄在南湖大山和雪山圈谷發現冰蝕地貌，並以臺灣冰河期的雪線高度做為間接證據，認為臺灣高山有冰河遺跡，開啟了臺灣高山冰河調查的熱潮。然而，臺灣的「圈谷」究竟是冰河遺跡，還是河流向源侵蝕造成的崩谷，持續爭議了 70 多年。直到臺灣學者楊建夫探勘雪山諸多圈谷，提出擦痕、冰斗和冰坎等諸多冰河遺跡的指標證據，證實臺灣高山地區曾有冰河覆蓋。擦痕、圈谷及冰坎的地貌特徵如下表。請問：

    | 地形名稱 | 地形特徵 |

    | --- | --- |

    | 擦痕 | 冰河夾帶岩石向前移動，與冰河槽底部及兩側摩擦所留下的大片光滑痕跡 |

    | 圈谷 | 多位於山岳冰河的源頭，當冰雪下得快又多，到達一定厚度時，會向下密壓，形塑出圓弧狀或漏斗型的山谷 |

    | 冰坎 | 冰斗最前端形成的凸丘狀基岩堤，是冰河遺跡中重要的地貌證據。因冰層厚度不一，冰河向下侵蝕的厚度亦不同，在前緣較薄處會形成突起的坎狀地形，大致與冰河流向垂直 |'
