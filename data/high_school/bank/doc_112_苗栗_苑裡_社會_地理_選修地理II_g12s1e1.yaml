  stem: 過去幾 10 年來，中國對乾旱區沙漠化的治理，多以大規模植樹造林為主，但治理速度趕不上惡化速度。不少專家認為，中國的沙漠化地區大多位於半乾旱區或草原區，因此應師法自然以植草取代種樹，作為防治沙漠化的方法。持這樣看法的專家所依據的理由最可能是：(甲)樹林擋沙防風的功能比草原低(乙)樹林根部向四周延展較小，水土保持能力較草原弱(丙)降水環境較適宜草原發展，不利樹木生長(丁)樹木蒸發散較草原強烈，導致水分較易流失
