  stem: '<u>萱萱</u>將本金 1 萬元存入銀行，在年利率 100 ％的情形下，以一年複利一次（此時利率為 100 ％＝1）、每半年複利一次（此時利率為 100 ％÷2＝0.5）、每季複利一次（此時利率為 100 ％÷4＝0.25），……，一年後得到的本利和列出如下表（單位：萬元）。

    | 計息週期 （多久複利一次） | 每期的利率$\frac{100 ％}{n}$ | 一年（n 期）的本利和 1×$\left( 1+\frac{100 ％}{n} \right) ^{n}$ |

    | --- | --- | --- |

    | 一年 | 100 ％＝1 | （1＋1）$^{1}$＝2 |

    | 半年 | 100 ％÷2＝0.5 | （1＋0.5）$^{2}$＝2.25 |

    | 一季 | 100 ％÷4＝0.25 | （1＋0.25）$^{4}$ ≈ 2.4414 |

    | 一個月 | 100 ％÷12 ≈ 0.0833 | （1＋0.0833）$^{12}$ ≈ 2.61207 |

    | 一天 | 100 ％÷365 ≈ 0.00274 | （1＋0.00274）$^{365}$ ≈ 2.71484 |

    | 一小時 | (A) | (C) |

    | 一分鐘 | (B) | (D) |

    由上表可看到，計息次數愈多，本利和愈大，而且會大約趨近一個定值；事實上，當一年內計息次數愈來愈多次時，本利和並不會無上限的愈來愈大，而會趨近一個固定的常數，我們將這個常數記做 e。設每小時計息的本利和為 m 萬元。每分鐘計息的本利和為 n 萬元（m，n 均四捨五入至小數點後第五位），求 m 與 n 的差距∣m－n∣＝＿＿＿＿。'
