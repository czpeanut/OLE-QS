  stem: 氣象學者研究發現：龍捲風中心風速 v 與行進距離 d 有關，其關係式為 v＝65＋93 logd，其中 v 為中心風速（英里／小時），d 為行進距離（英里）。則中心風速 200 英里／小時的行進距離是中心風速 100 英里／小時行進距離的＿＿＿＿倍。（四捨五入至整數位）
  answer:
  - '12'
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}v_{1}=200=65+93 \log d_{1} \cdots \cdots \cdots \cdots \cdots ① \\ v_{2}=100=65+93 \log d_{2}\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    ①－②得 100＝93 log$\frac{d_{1}}{d_{2}}$ ⇒$\frac{d_{1}}{d_{2}}$＝$10^{\frac{100}{93}}$＝11.89…… ≈ 12

    故中心風速 200 英里／小時的行進距離是中心風速 100 英里／小時行進距離的 12 倍

    11.2996863034895 ≈ 2.99686×$10^{12}$

    2996863034895×$2^{1290000}$

    ≈ $10^{log（2.99686×1012）}$×（$10^{log2}$）$^{1290000}$

    ＝$10^{12}$×$10^{0.476……}$×$10^{1290000 log2}$

    ＝$10^{12}$×$10^{0.476……}$×$10^{388328}$×$10^{0.69……}$

    ＝$10^{0.166……}$×$10^{388341}$ 為 388342 位數

    故 2996863034895×$2^{1290000}$ ±1 皆為 388342 位數'
