- id: doc_110_桃園_武陵_數學_數B_g11s1e1_s2_6
  section: 2
  number: 6
  type: fill
  page: 2
  stem: 心理學家常用數學模型 L（t）＝a（1－$10^{－bt}$）來描述學生經過 t 週的學習之後所得的成果，此處的常數 a、b 會與學生及學習的科目有關。<u>婷婷</u>一週可以背熟 80 個英文單字，兩週可以背熟 150 個英文單字，則三週後，<u>婷婷</u>可以背熟＿＿＿＿個英文單字。（四捨五入至整數位）
  answer:
  - '211'
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}80=a(1-10^{-b}) \cdots \cdots \cdots \cdots \cdots ① \\ 150=a(1-10^{-2b})\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    $\frac{②}{①}$得$\frac{15}{8}$＝$\frac{1-10^{-2b}}{1-10^{-b}}$

    令 k＝$10^{－b}$

    則 15（1－k）＝8（1－$k^{2}$） ⇒ $8k^{2}$－15k＋7＝0 ⇒ （k－1）（8k－7）＝0

    ⇒ k＝1 或$\frac{7}{8}$

    若 k＝1，代回①不合

    若 k＝$\frac{7}{8}$，代回①得 80＝$a\left( 1-\frac{7}{8} \right)$ ⇒ a＝640

    則 L(3)＝$640\left[ 1-\left( \frac{7}{8} \right) ^{3} \right]$＝211.25 ≈ 211

    故三週後，<u>婷婷</u>可以背熟 211 個英文單字'
