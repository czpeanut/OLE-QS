  explanation: 可得μ$_{x}$＝$\frac{7+9+10+11+13}{5}$＝10，μ$_{y}$＝$\frac{43+46+50+54+57}{5}$＝50 ⇒ $S_{xx}$＝(－3 )$^{2}$＋(－1 )$^{2}$＋$0^{2}$＋$1^{2}$＋$3^{2}$＝20，$S_{yy}$＝(－7)$^{2}$＋(－4)$^{2}$＋$0^{2}$＋$4^{2}$＋$7^{2}$＝130， $S_{xy}$＝(－3 )×(－7 )＋(－1)×(－4 )＋0×0＋1×4＋3×7＝50， 所以相關係數為$\sqrt{a}$＝$\frac{S_{xy}}{\sqrt{S_{xx}}\times \sqrt{S_{yy}}}$＝$\frac{50}{\sqrt{20}\times \sqrt{130}}$＝$\frac{5}{\sqrt{26}}$＝$\sqrt{\frac{25}{26}}$，故a＝$\frac{25}{26}$。
