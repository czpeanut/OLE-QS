- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 為了避免有人利用民主制度來推翻民主，德國發展出「防衛性民主」的概念，利用少數否決的方式，以維護民主制度的最低底線。臺灣的憲法也有引入類似概念，例如「政黨違憲解散」就是為了防止政黨推翻民主制度並建立獨裁國家，所以讓大法官決定是否可以解散政黨。從以上內容可發現，民主政治目前面臨到的限制或困境可能為何？
  options:
  - label: A
    content: 三權分立制度是否能有效制衡行政機關與立法機關之間的衝突
  - label: B
    content: 多數暴力與少數暴力的糾葛，少數大法官能否有權推翻多數決
  - label: C
    content: 民眾是否有足夠的政治參與公共決策機會，藉此保障自身權益
  - label: D
    content: 是否能保障普遍性的個人自由，不因身分地位等差別而有不同
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從文中提及防衛性民主給予少數人否決的權利，在於民主制度的本身含有不可變動的絕對價值，若受到體制內的敵人破壞民主將有嚴重後果，故在極力避免之。但如同避免多數人藉由多數暴力推翻國家或侵害少數群體的權益，少數否決的權力是否也是一種少數暴力，因此形成多數暴力與少數暴力的糾葛，且文中提及大法官的政黨違憲解散權，故(B)符合此敘述內涵。
  tags:
    unit:
      code: CI-S2-1-1
      book: 選修公民與社會II 民主政治與法律
      chapter: 民主政治的變遷與發展
