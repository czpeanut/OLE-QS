  stem: 當建築物老舊、巷道狹窄，有消防安全疑慮時，常藉由實施都市更新的方式來改善與處理。原則上，一般地區要辦理都市更新需要整合超過 5 分之 4 的同意才能送件。而此做法雖兼顧多數人的意願，但少數人可能無力負擔後續費用、對住家建築的情感等表示不同意都更，卻於此機制下無法改變結果。在此兩難情境中，這決議的機制門檻也面對了挑戰。請問關於此決議的機制門檻之說明，何者較為正確？
