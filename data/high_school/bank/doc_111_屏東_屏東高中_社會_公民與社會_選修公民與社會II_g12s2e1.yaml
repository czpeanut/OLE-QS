  stem: 王光祿獵槍釋憲案終於在 2021 年 3 月 9 月召開憲法法庭進行言詞辯論。開庭前，原住民族團體於司法院前施放狼煙並詔告上天及祖靈，強調「獵人無罪、法律違憲！」期盼大法官不該只用文獻來判斷這起案件，因為部落群體以及族人都存在，希望透過對話，讓大法官及社會各界理解原住民族傳統習俗。請問下列敘述何者正確？
  options:
  - label: A
    content: 該案件為法律與文化權之爭議受民眾關注，因此司法主動審理
  - label: B
    content: 大法官主要針對個案具體事實解釋憲法，此案為裁判憲法審查
  - label: C
    content: 大法官釋憲結果牽涉法令是否違憲，有助加速相關法案的修訂
  - label: D
    content: 提出釋憲案後，首先會經大法官全體審查會決議是否受理案件
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)釋憲須有聲請人，故並非大法官主動審理。(B)此案涉及《槍砲彈藥刀械許可及管理辦法》與《野生動物保護法》間適用之爭議，並非是針對個案具體事實而作出的釋憲。(C)此次釋憲結果仍是規範原住民狩獵只可使用「自製獵槍」以及不得狩獵保育類動物。但在「自製獵槍」的定義上，要求有關機關須檢討現行標準，使原住民得以採用更安全的獵槍進行狩獵，可加速相關法案的修訂。(D)原有的釋憲流程是收到案件聲請後，會有大法官三人組成小組審核，決定是否受理聲請案，並非是經由全體大法官審議。
