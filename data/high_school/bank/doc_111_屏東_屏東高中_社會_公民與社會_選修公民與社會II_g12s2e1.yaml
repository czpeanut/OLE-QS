  stem: 廣義的官二代泛指政府及國家部門官員的子女；狹義的官二代專指一類憑藉上一代在官場或公務領域的關係進行權力腐敗（以權謀私）的人。後者的官二代權力腐敗的表現如通過行政權力干預法律的正常執行、違法後逃避正常的法律制裁，或是利用父輩的權力以不正當手段就學、就業等。從社會流動與階層化的角度來看，下列敘述何者正確？
  options:
