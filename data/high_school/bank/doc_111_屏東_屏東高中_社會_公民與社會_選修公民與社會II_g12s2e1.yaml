  - label: D
    content: 立法委員憑藉專業知能，著重訴求高度的自主性，應弱化民眾觀感和福祉
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)立委須顧及全體國民利益，而非不忤逆民意，因為此作為可能流於民粹。(B)立委須重視全民的福祉而非僅有選區選民的利益，為正確敘述。(C)立委是中央民意代表，選上立委後應顧及全民之利益，國家利益也應優先看待。(D)仍須關注民眾的觀感，而非選上後就忽視選民的意見，否則有負選民所託。
