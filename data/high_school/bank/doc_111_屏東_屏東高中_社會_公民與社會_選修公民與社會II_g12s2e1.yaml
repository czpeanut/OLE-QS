    content: 若政治權力仍集中在官二代手中，菁英的「團夥」和權力鬥爭仍會影響政局發展
  - label: B
    content: 官二代現象表示中國的階級複製嚴重，但有助於社會階層的穩定，避免發展不均
  - label: C
    content: 官二代是因為早期中國人口政策所導致，導致人口結構失衡與人口老化問題發生
  - label: D
    content: 因中國力行反貪打腐的政策，已有效減少官二代所造成的問題，使社會流動增加
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)社會階層複製嚴重，反而造成資源分配更加不均。(C)官二代的產生並非因為人口政策，而是政治資本或資產的代際轉移繼承人（特指第一代繼承人），是一個隨著中國的經濟和社會之現代化進而產生的群體。(D)官二代問題愈來愈嚴重，並未獲得良好的解決，因而社會流動可能受阻。
