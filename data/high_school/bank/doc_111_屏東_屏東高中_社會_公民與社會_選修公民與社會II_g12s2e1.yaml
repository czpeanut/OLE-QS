  stem: 大法官會議 2019 年作成釋字第 784 號解釋，學生被學校記過記警告，可提行政訴訟，尋求行政救濟。2020 年有一起高中學生被記警告向教育部提訴願遭駁，因此提告獲勝的判決出爐。當事人陳同學表示，這次判決最重要的實質意義，是大法官釋字第 784 解釋後，在高中教育行政上全國第 1 件適用的案件，也是全國司法史上，有高中生被學校處分後上法院告贏的案例，由此可見，大法官會議作成解釋促成法律變遷之事實。請你協助判斷，下列案例中何者「不是」因為我國大法官會議作成解釋，促成法律變遷之事實？
