  type: single
  page: 7
  stem: 立法院在 2016 年修改罷免的門檻，期待落實罷免權的基本權利，也因此陸續有多位民意代表接受到人民提出罷免案。罷免的因素很多，但主要涉及到人民與代議士之間的關係，也讓人思考立法委員之於人民，本身應該具備何種角色與功能。請問以下關於立法委員與人民的關係之說法，何者較為正確？
