  stem: 「審議民主」目的是促成公眾對政策進行知情且理性的討論，近年在臺灣各種審議參與也不斷在公民社會擴散，並有成功的例子落實在社區或政府公共事務的決策上。而審議式民主運作過程中，也面對到一些挑戰，請問以下何者屬於審議民主遇到的挑戰？
