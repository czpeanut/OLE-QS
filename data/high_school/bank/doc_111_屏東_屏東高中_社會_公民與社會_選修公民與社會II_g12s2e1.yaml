  type: single
  page: 1
  stem: 「一帶一路」為習近平主政下中國的對外措施，以古絲綢的海上和陸上路線作為主要發展方向，欲積極開發沿線的基礎建設，如：鐵路和港口，故習近平也倡議籌建「亞洲基礎設施投資銀行」，促進本地區互聯互通建設和經濟一體化進程，向東南亞國協在內的開發中國家提供資金貸款，以協助其進行基礎建設，請問此舉顯示中國何項對外作為？
  options:
  - label: A
    content: 以經貿合作計畫提升國際影響力
  - label: B
    content: 改革國有企業試圖提升其競爭力
  - label: C
    content: 欲與美國維持穩定且和平的關係
  - label: D
    content: 試圖以「大外宣」影響國際輿論
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 一帶一路是一種經濟戰略，象徵著中國由區域邁向世界，且試圖與美國爭奪世界重要強國的領導地位，故偏向(A)以經貿合作計畫提升國際影響力。(B)此與國有企業改革無關。(C)沒有與美國維持和平關係的意圖。(D)從題文內容無法看出其是否透過「大外宣」控制輿論。
  tags:
    unit:
      code: CI-S2-2-2
      book: 選修公民與社會II 民主政治與法律
