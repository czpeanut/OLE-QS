  stem: 毛澤東主政時期的中華人民共和國，馬列思想被視為最高指導原則，以建立無產階級專政的社會為目標，請問以下何者「並非」此時期的政策？
  options:
  - label: A
    content: 政府宣布將私有農業和工商業收歸國有
  - label: B
    content: 國家機器掌握並分配生產要素和勞動力
  - label: C
    content: 國家將民生經濟的資源轉移至重工業上
  - label: D
    content: 以各項政策發展經濟特區藉此吸引外資
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)皆為毛澤東的社會主義政策作為。(D)此為鄧小平改革開放的作為，影響日後中國的經濟發展模式，使中華人民共和國經濟高速發展，先後出現了以深圳經濟特區以及上海浦東新區為代表的發展模式。
