  answer_status: verified
  answer_source: answer_key
  explanation: (A)改革開放後，會使得城市和鄉村的經濟差距拉大。(B)目前中國經濟朝社會主義市場經濟為主，計畫經濟已名實不符，且已承認私有財產制。(D)在 2007 年立法通過實施，然而回顧草案審議過程中卻爭議不斷，最後仍確立所有權主體分類係採取「三分法」類型化，國家所有權、集體所有權、私人所有權之所有權分類。但此做法並非完全落實私有財產制，也與所有權社會化概念無關。
