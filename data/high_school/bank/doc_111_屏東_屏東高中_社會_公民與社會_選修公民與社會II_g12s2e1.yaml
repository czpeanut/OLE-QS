  stem: 下列何種行為屬於「審議民主理論的公民參與」之具體表現？
  options:
  - label: A
    content: 為保護大巨蛋工地旁的路樹，市民召開「公民咖啡館」討論路樹去留
  - label: B
    content: 風災過後，社區居民透過 FB、IG 等社群軟體發起捐款募集物資行動
  - label: C
    content: 民眾將選票投給喜愛的候選人，期望該位候選人能代表人民監督政府
  - label: D
    content: 熱舞社成員為了成果發表會，於臺北車站的地下街號召社員集合苦練
  answer:
  - A
  answer_status: verified
