  page: 1
  stem: 近期，中國政府著手建置「社會信用體系」，預計透過「天網」系統（即影像監控系統）來監督公民各項行動。這項體系美其名獎勵誠信、守法等傳統美德，但更招致損害隱私權、打壓異己的批評。請問此舉顯示中國社會存有什麼樣的問題？
  options:
  - label: A
    content: 人口過多難以管理
  - label: B
    content: 更緊縮的社會控制
  - label: C
    content: 低流動的社會階層
  - label: D
    content: 經濟成長漸漸趨緩
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「天網」可監督人民的一舉一動，並搭配社會信用制度，對公民展開行為監管，屬於一種社會控制的工具，對人民形成更為緊縮的控制效果，故選(B)。
  tags:
