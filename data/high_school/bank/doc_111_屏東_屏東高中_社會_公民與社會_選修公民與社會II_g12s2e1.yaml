  type: single
  page: 10
  stem: 中國在國際組織影響力日趨上升，臺灣參與國際組織受到打壓，名稱更成為兩岸在國際場域上的角力，臺灣目前以正式會員身分參與的國際組織有 38 個，而以觀察員身分參加的有 21 個國際組織，在名稱上主要以「中華臺北」為主，像是國際奧運、亞太經合會等，而世界貿易組織則以「臺灣、澎湖、金門、馬祖個別關稅領域」加入。請問文中有關「以何種身分加入國際組織」的議題，下列哪一項敘述正確？
  options:
  - label: A
    content: 相較於全球性組織，區域性組織通常不以是否為主權國家作為會員資格
  - label: B
    content: 世界貿易組織負責監督成員間的各種貿易協議，故允許非主權實體加入
  - label: C
    content: 國家在國際法上的地位依然重要，以經濟體作為會員資格不是明智選擇
  - label: D
    content: 以觀察員身分參加表示在此國際組織中具有與其他國家同等的會員地位
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)只要是官方的國際組織，仍以主權國家作為會員資格。(C)須依照不同國際組織之性質，若為經貿組織則以經濟體作為主體即符合組織運作的目標。(D)觀察員並無表決權等權利，故與一般成員的權利不同。
