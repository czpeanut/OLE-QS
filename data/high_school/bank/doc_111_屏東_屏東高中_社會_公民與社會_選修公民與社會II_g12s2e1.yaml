- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 近年來不論是中央政府還是地方政府，都開始愈來愈注重「審議式民主」，並舉辦相關的工作坊或會議，例如臺北的「公民咖啡館」，臺中、新竹等地的「參與式預算」、中央政府行之有年的「青年國是會議」（後來改為青年好政聯盟）等。請問審議民主理論開始受到重視的原因可能為何？
  options:
  - label: A
    content: 許多領導菁英已無法有效解決國家政治經濟危機，且無法回應人民的需求
  - label: B
    content: 審議民主強調每個人都能積極、理性地參與政治，並體現社會契約的精神
  - label: C
    content: 過去的民主理論太過依賴投票，審議民主能以共識決作為投票的輔助制度
  - label: D
    content: 西方民主國家出現廣受人民狂熱支持的極權政體，造成古典民主理論崩解
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 當代民主政治透過代議制來決定重要法律和公共政策，根據多數決的原則來裁決不同觀點和利益的衝突。然而，民主的實踐結果卻普遍存在公民參與意願低落、決策品質不佳、金權政治等問題，甚至多數決也可能得出侵害少數人基本權利的政策決議。1980 年代開始在政治哲學領域興起的審議民主思潮，希望能夠改善傳統民主理論和當代民主政治實作的問題。審議民主論者在民主的概念和代議制之上加入「公共審議」的元素，要求在依民主程序做決策前，先經過適當的集體討論，故最適切的答案為(C)。
  tags:
    unit:
      code: CI-S2-1-1
      book: 選修公民與社會II 民主政治與法律
      chapter: 民主政治的變遷與發展
      title: 代議民主與審議民主
      std: true
