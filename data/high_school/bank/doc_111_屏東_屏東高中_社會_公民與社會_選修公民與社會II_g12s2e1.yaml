  stem: 2012 年中國共產黨召開第 18 屆全國代表大會（簡稱 18 大）前夕，各界紛紛揣測未來的中國政治路線以及人事布局。何以黨的代表大會能夠重要到凌駕國家層級的全國人大，下列哪一解釋較為合理？
  options:
  - label: A
    content: 中國政體運作偏向內閣制，多數黨人事變動則影響政府人事變動
  - label: B
    content: 中國人治色彩濃厚，政治決策模式時常因領導人的更迭有所差異
  - label: C
    content: 中國共產黨實施以黨領政模式，使得國家決策受到共產黨所支配
  - label: D
    content: 中國習慣在政策出來前，透過黨代表大會邀集各黨會商決定方向
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 中國實行黨國體制（簡稱黨國），屬於一黨制的政黨制度，執政黨掌握絕對權力，代表國家行使主權，採行全面控制國家機器的政體，實現從中央到地方行政、黨組織與政府的一體化，即黨政一體（黨領導一切），因此答案為(C)。
