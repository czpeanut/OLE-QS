- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 從法律地位觀察，中國現行政府體制中，下列何種機構的法律地位最為崇高？
  options:
  - label: A
    content: 全國人民代表大會
  - label: B
    content: 中央軍事委員會
  - label: C
    content: 最高人民法院
  - label: D
    content: 國務院
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 中華人民共和國全國人民代表大會簡稱全國人民代表大會、全國人大，是《中華人民共和國憲法》規定的中華人民共和國最高國家權力機關，同時為中華人民共和國國家立法機關，故選(A)。
  tags:
    unit:
