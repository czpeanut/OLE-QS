  section: 1
  number: 36
  type: single
  page: 7
  stem: 近年政治素人參與民意代表的情形愈來愈多，一個素人想要參選，和具有政治資源的現任議員或是政治資源繼承人最明顯的差距就是經費。以保證金為例，不靠政黨，在臺灣選直轄市議員就要交出 20 萬的保證金，但是在加拿大選國會議員只要 3 萬、英國及澳洲則是 2 萬多、紐西蘭 9,000 元、德國甚至是零元。這議題也呈現在政治參與上的另一種問題。請問依據上述案例，何者較為正確？
  options:
  - label: A
    content: 臺灣的參選門檻較高，主要目的在於尋求具備專業知識的人士參政
  - label: B
    content: 由於臺灣保證金相對於其他國家門檻較高，可知民主素養尚未成熟
  - label: C
    content: 臺灣保證金門檻設置較高，可能影響弱勢的個人或群體參選的機會
  - label: D
    content: 政治參與機會應人人均等，應免除保證金制度確保參政的數量品質
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)參選的保證金門檻高低，不意味候選人的專業知識水準高低。(B)參選的保證金門檻高低之限制，與民眾之民主素養的連結無關。(C)弱勢的人或群體擁有比較少的經濟資源，若保證金太高，會限制其參選的可能，為正確敘述。(D)若完全沒有保證金制度，也可能造成過多的人任意參選，反而浪費國家資源。
