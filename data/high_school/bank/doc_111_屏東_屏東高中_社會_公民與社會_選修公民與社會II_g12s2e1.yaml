  stem: 同學在網路上找到這些資料：世界上第一個具有國家性質的政治組織，實際是英法等國維護戰後體系的工具，因此處理與本國無關的衝突時大都不痛不癢。例如：1931 年日本對中國的「九一八事變」，1935 年義大利入侵衣索比亞，都束手無策。直至英法「綏靖政策」頂峰，放縱法西斯德國，其維護世界和平的宗旨形同虛設。請問同學關注的國際組織最有可能為以下何者？
