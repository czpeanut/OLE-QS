- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 梭羅的抗稅運動，彰顯民主國家運作中，人民可以透過抗爭的形式反對民主政府的不當政策或法律，下列敘述何者是美國政治學者羅爾斯依此所定義的抗爭意涵與形式？
  options:
  - label: A
    content: 人民應該基於良知與公平正義原則，而從事故意公開的反對政府運動
  - label: B
    content: 面對政府制訂的惡法或錯誤政策，人民應尋求行政與司法的救濟制度
  - label: C
    content: 梭羅的抗稅運動並非違法行為，但若牴觸政府的政策仍應該會受處罰
  - label: D
    content: 公民的良心位階高於政府法律，因此若因良知而違法則不會受到處罰
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 公民不服從最常見的定義是羅爾斯提出的「一個公然、非暴力、出於良心但違法的政治行為，通常是為了促成法律或政府政策的改變」，故選(A)。(B)這是惡法亦法的概念，公民不服從為惡法非法的觀點。(C)梭羅的抗稅行為為非法行為。(D)違法行為仍會受到處罰。
  tags:
    unit:
      code: CI-S2-1-2
      book: 選修公民與社會II 民主政治與法律
      chapter: 民主政治的變遷與發展
