  type: single
  page: 2
  stem: 學生在冬天是否可以於制服外加穿非規定的禦寒衣物，一直是學生與學校之間時常討論的議題，教育部明確規定各校應允許學生加穿禦寒衣物，但全臺仍有五成以上學校要求學生不得加穿，違規者仍會受到懲處。假設有一名學生因穿著禦寒衣物而被處罰，與校方溝通說明失敗後，便協同全校同學穿禦寒衣物來學校。請問該事件與「公民不服從」的關係為何？
  options:
  - label: A
    content: 該學生刻意違反教育部訂定的法規命令，符合公民不服從要件
  - label: B
    content: 僅穿著非規定禦寒衣物，未有其他暴力行為，符合非暴力原則
  - label: C
    content: 在教室裡當眾宣稱服儀不符規定，因不在室外，不符公開要件
  - label: D
    content: 穿著非規定的衣物僅是為了美觀，不符合「基於良知」的精神
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 依公民不服從的定義為「一個公然、非暴力、出於良心但違法的政治行為，通常是為了促成法律或政府政策的改變」，而(A)學生是刻意違反校規，並非違反教育部規定。(C)教室仍屬於公開場域。(D)協同全校同學穿著禦寒衣物的目的是為了抵抗校方不合理的規定，並非僅為了美觀，仍屬於基於良知的精神。
  tags:
