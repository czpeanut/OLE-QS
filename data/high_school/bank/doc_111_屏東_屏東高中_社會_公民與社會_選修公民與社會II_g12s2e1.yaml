  explanation: (A)由於多數決可能會犧牲部分人之利益，因此應該審慎評估方案，為正確敘述。(B)仍有可能造成多數暴力，而且是更多數人的暴力。(C)多數決之下，表示仍有少數不同意見者，故未必是兼顧所有人之權益。(D)民眾不一定會去閱覽相關資訊，即使了解資訊也並非皆是理性選擇。
