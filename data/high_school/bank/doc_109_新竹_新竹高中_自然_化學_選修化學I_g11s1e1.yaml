  stem: '因年初爆發疫情之故，各式消毒水名譟一時。某商品號稱可用水和食鹽經由電解即可製作消毒水。其原理應為電解氯化鈉水溶液，再將產生的氯氣溶於水產生次氯酸與鹽酸，稱其為次氯酸水。其中次氯酸具有強氧化力，可作為消毒劑的有效成分，此產品亦標榜次氯酸水經久未用會自然分解為氯氣與水，故不會有消毒水殘留的疑慮。已知電解氯化鈉飽和溶液的半反應式如下： 陽極半反應：$2Cl^{－}$ → $Cl_{2}$＋$2e^{－}$ 陰極半反應：$2H_{2}$O＋$2e^{－}$ → $H_{2}$＋$2OH^{－}$

