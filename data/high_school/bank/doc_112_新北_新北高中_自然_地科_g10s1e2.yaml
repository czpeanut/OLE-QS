  stem: 下列哪項敘述是溫室效應讓地球表面溫度逐漸升高的主因？
  options:
  - label: A
    content: 平流層中的臭氧大量吸收紫外線
  - label: B
    content: 因臭氧層的破洞，陽光中的紫外線能直接照射在地球表面
  - label: C
    content: 紫外線與臭氧的光化反應導致大氣增溫
  - label: D
    content: 大氣中的二氧化碳大量吸收紅外線輻射
  - label: E
    content: 溫室效應增強表示大氣輻射能量小於吸收能量，因此大氣中累積的能量越來越多
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
