  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：A 到 xy 平面的距離為 1

    (B) ○

    (C) ○：A、B 對 yz 平面作垂線分別得垂足為（0，2，1）和（0，1，3）

    得投影長為$\sqrt{0^{2}+(-1)^{2}+2^{2}}=\sqrt{5}$

    (D) ╳：A、B 均在 xy 平面上方，又 A 對 xy 平面之對稱點為 A''（3，2，－1）

    得$\overline{PA}$＋$\overline{PB}$最小值為$\overline{A''B} =\sqrt{3^{2}+1^{2}+(-4)^{2}} =\sqrt{26}$

