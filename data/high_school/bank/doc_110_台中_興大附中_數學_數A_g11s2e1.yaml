- id: doc_110_台中_興大附中_數學_數A_g11s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設 A（1，2，－3），B（3，1，－5），C（0，0，－1），$\vec{w}$＝$t\vec{AB}+\vec{AC}$，t 為實數，則下列敘述何者正確？
  options:
  - label: A
    content: $\vec{AB}$與$\vec{AC}$夾角為銳角
  - label: B
    content: 若△ABC 面積為 a，則 a 為 5 的倍數
  - label: C
    content: $\vec{AB}$在$\vec{AC}$上的正射影長為$\frac{4}{9}$
  - label: D
    content: $| \vec{w} |$最小為$\frac{\sqrt{65}}{3}$
  - label: E
    content: 若$\vec{w}$平分∠BAC，則 t＞1
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{AB}$＝（2，－1，－2），$\vec{AC}$＝（－1，－2，2）

    (A) ╳：$\vec{AB}$．$\vec{AC}$＝－2＋2－4＜0 ⇒ 夾角為鈍角

    (B) ╳：△ABC 面積為$\frac{1}{2}| \vec{AB}\times \vec{AC} | =\frac{1}{2}\sqrt{(-6)^{2}+(-2)^{2}+(-5)^{2}}=\frac{\sqrt{65}}{2}$

    (C) ╳：正射影長為$\frac{| \vec{AB} \cdot \vec{AC} |}{| \vec{AC} |}=\frac{4}{3}$

    (D) ○：$| \vec{w} |$＝∣（2t－1，－t－2，－2t＋2）∣

    ＝$\sqrt{(2t-1)^{2}+(-t-2)^{2}+(-2t+2)^{2}}$＝$\sqrt{9t^{2}-8t+9}=\sqrt{9\left( t-\frac{4}{9} \right) ^{2}+\frac{65}{9}}$

    故當 t＝$\frac{4}{9}$時，$| \vec{w} |$有最小值$\sqrt{\frac{65}{9}}=\frac{\sqrt{65}}{3}$

    (E) ╳：∵$| \vec{AB} |$＝$| \vec{AC} |$＝3 ∴t＝1

    故選(D)'
