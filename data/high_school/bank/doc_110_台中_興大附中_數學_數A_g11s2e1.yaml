- id: doc_110_台中_興大附中_數學_數A_g11s2e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 設$\vec{u}$＝（a，b，0），$\vec{v}$＝（c，d，4），其中 $a^{2}$＋$b^{2}$＝$c^{2}$＋$d^{2}$＝4，則下列選項哪些是正確的？
  options:
  - label: A
    content: $\vec{u}$與 z 軸垂直
  - label: B
    content: $\vec{u} \cdot \vec{v}$的最大值為 2
  - label: C
    content: $\vec{u}$、$\vec{v}$的夾角為 θ，則 60°＜θ＜120°
  - label: D
    content: ad－bc 的值可能為 4
  - label: E
    content: $| \vec{u}\times \vec{v} |$的最大值為$2\sqrt{5}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：令 z 軸方向向量$\vec{v_{z}}$＝（0，0，1）

    ⇒$\vec{u} \cdot \vec{v_{z}}$＝0 ⇒$\vec{u}$⊥$\vec{v_{z}}$

    (B) ╳：$\vec{u} \cdot \vec{v}$＝ac＋bd，又 $a^{2}$＋$b^{2}$＝$c^{2}+d^{2}$＝4

    由柯西不等式知，（$a^{2}$＋$b^{2}$）（$c^{2}+d^{2}$）≥（ac＋bd）$^{2}$

    ⇒－4 ≤ ac＋bd ≤ 4，得最大值為 4

    (C) ○：$| \vec{u} | =\sqrt{a^{2}+b^{2}}=2$，$| \vec{v} | =\sqrt{c^{2}+d^{2}+4^{2}}=2\sqrt{5}$

    又 cosθ＝$\frac{\vec{u} \cdot \vec{v}}{| \vec{u} | | \vec{v} |}$，由(B)知

    $\frac{-4}{2\times 2\sqrt{5}}$ ≤ cosθ ≤ $\frac{4}{2\times 2\sqrt{5}}$⇒$\frac{-1}{\sqrt{5}}$ ≤ cosθ ≤ $\frac{1}{\sqrt{5}}$

    ⇒$-\frac{1}{2}$＜cosθ＜$\frac{1}{2}$⇒ 60°＜θ＜120°

    (D) ○：承(B)，由柯西不等式知

    （$a^{2}$＋$b^{2}$）（$d^{2}$＋（－c）$^{2}$）≥（ad－bc）$^{2}$

    ⇒－4 ≤ ad－bc ≤ 4，故可能為 4

    (E) ╳：$| \vec{u}\times \vec{v} |$＝$| \vec{u} || \vec{v} |$sinθ，又∣cosθ∣≤$\frac{1}{\sqrt{5}}$

    ⇒$\frac{2}{\sqrt{5}}$ ≤ sinθ ≤ 1 ⇒$| \vec{u}\times \vec{v} |$之最大值為$| \vec{u} || \vec{v} |$＝$4\sqrt{5}$

    故選(A)(C)(D)'
