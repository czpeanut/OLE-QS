- id: doc_110_台中_興大附中_數學_數A_g11s2e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 空間中有一四面體 ABCD。假設$\vec{AD}$分別與$\vec{AB}$和$\vec{AC}$垂直，請選出正確的選項。
  options:
  - label: A
    content: $\vec{DB}$．$\vec{DC}$＝$\overline{DA}^{2}+\vec{AB} \cdot \vec{AC}$
  - label: B
    content: 若∠BAC 是銳角，則∠BDC 是銳角
  - label: C
    content: 若∠BAC 是直角，則∠BDC 是銳角
  - label: D
    content: 若∠BAC 是鈍角，則∠BDC 是銳角
  - label: E
    content: 若$\overline{AB}$＜$\overline{AD}$且$\overline{AC}$＜$\overline{AD}$，則∠BDC 是銳角
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\vec{DB} \cdot \vec{DC}$＝$(\vec{DA}+\vec{AB}) \cdot (\vec{DA}+\vec{AC})$＝$| \vec{DA} | ^{2}+\vec{DA} \cdot \vec{AC}+\vec{AB} \cdot \vec{DA}+\vec{AB} \cdot \vec{AC}$

    又$\vec{AD}$⊥$\vec{AB}$且$\vec{AD}$⊥$\vec{AC}$⇒$\vec{DA} \cdot \vec{AC}$＝$\vec{AB} \cdot \vec{DA}$＝0

    得$\vec{DB}$．$\vec{DC}$＝$\overline{DA}^{2}$＋$\vec{AB} \cdot \vec{AC}$

    (B) ○：∵∠BAC＜90° ∴$\vec{AB} \cdot \vec{AC}$＞0，得$\vec{DB} \cdot \vec{DC}$＞0

    故∠BDC 為銳角

    (C) ○：∵∠BAC＝90° ∴$\vec{AB} \cdot \vec{AC}$＝0，得$\vec{DB} \cdot \vec{DC}$＝$\overline{DA}^{2}$＞0

    故∠BDC 為銳角

    (D) ╳：∵∠BAC＞90° ∴$\vec{AB} \cdot \vec{AC}$＜0，但$\vec{DB} \cdot \vec{DC}$＝$\overline{DA}^{2}+\vec{AB} \cdot \vec{AC}$

    無法確定正負，故∠BDC 可能是銳、直、鈍角

    (E) ○：$\vec{DB}$．$\vec{DC}$＝$\overline{DA}^{2}+\vec{AB} \cdot \vec{AC}$＝$\overline{DA}^{2}+\overline{AB}\times \overline{AC}$cos∠BAC

    又∣cos∠BAC∣≤ 1，且$\overline{AB}$＜$\overline{AD}$，$\overline{AC}$＜$\overline{AD}$⇒$| \overline{AB}\times \overline{AC} \cos \angle BAC |$＜$\overline{AD}\times \overline{AD}$

    ⇒$\vec{DB}$．$\vec{DC}$＞$\overline{DA}^{2}-\overline{AD}\times \overline{AD}$＝0

    故∠BDC 為銳角

    故選(A)(B)(C)(E)'
