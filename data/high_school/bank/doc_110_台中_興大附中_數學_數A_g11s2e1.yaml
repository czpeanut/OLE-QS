  - label: B
    content: B 對 y 軸作垂線，垂足為（0，1，0）
  - label: C
    content: $\overline{AB}$在 yz 平面的投影長為$\sqrt{5}$
  - label: D
    content: 若 P 點在 xy 平面上，則$\overline{PA}+\overline{PB}$的最小值為 5
  - label: E
    content: 若 P 點滿足$\vec{OP}$＝$\vec{OA}+t\vec{OB}$，其中 0 ≤ t ≤ 1，則所有 P 點所成的圖形為一菱形
  answer:
