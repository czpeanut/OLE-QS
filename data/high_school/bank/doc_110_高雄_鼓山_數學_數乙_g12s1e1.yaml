  stem: 設隨機變數X表示投擲一不公正骰子出現的點數，P (X＝$x_{k}$)表示隨機變數X取值為$x_{k}$的機率。已知X的機率分布表如下：（x，y為未知常數） 已知X的期望值等於$\frac{13}{4}$，試求： (1) 數對 (x,y)。 (2) 投擲此骰子兩次，點數和為3的機率。 (3) X的變異數。
  assets:
  - key: s2_3_f1
    kind: figure
    file: doc_110_高雄_鼓山_數學_數乙_g12s1e1/s2_3_f1.png
