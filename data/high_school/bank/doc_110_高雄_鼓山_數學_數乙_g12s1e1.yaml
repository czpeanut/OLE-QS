  answer_status: verified
  answer_source: answer_key
  explanation: '$x+y+y+x+y+y=1\Rightarrow 2x+4y=1$

    $E(X)=1\times x+2\times y+3\times y+4\times x+5\times y+6\times y=\frac{13}{4}\Rightarrow 5x+16y=\frac{13}{4}$

    (1) 聯立得到 $\therefore x=\frac{1}{4} ,y=\frac{1}{8}\Rightarrow (x,y)=(\frac{1}{4},\frac{1}{8})$

    (2) 點數和為3的情形為: 2+1, 1+2 則$P=\frac{1}{4}\times \frac{1}{8}+\frac{1}{8}\times \frac{1}{4}=\frac{1}{16}$

    (3)$Var(X)=E(X^{2})-\left[ E(X) \right] ^{2}=1^{2}\times \frac{1}{4}+2^{2}\times \frac{1}{8}+9\times \frac{1}{8}+16\times \frac{1}{4}+25\times \frac{1}{8}+36\times \frac{1}{8}-(\frac{13}{4})^{2}=\frac{108}{8}-\frac{169}{16}=\frac{47}{16}$'
