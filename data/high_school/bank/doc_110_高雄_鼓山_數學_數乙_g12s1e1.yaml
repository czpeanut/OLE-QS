      name: 二項分布試驗判別與單項機率
    labeled_by: agent
    label_confidence: high
  difficulty: 2
- id: doc_110_高雄_鼓山_數學_數乙_g12s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 二項分布X～B (25,0.4)，請問下列哪些選項是正確的？
  options:
  - label: A
    content: X的可能值有25個
  - label: B
    content: X＝12與X＝14的機率相同
  - label: C
    content: X＝9與X＝11的機率相同
  - label: D
    content: X的期望值是10
  - label: E
    content: X的標準差小於3
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) X可能26種 $\therefore$錯誤

    (B)$P(X=14)=C_{14}^{25}(\frac{4}{10})^{14}(\frac{6}{10})^{11},P(X=12)=C_{12}^{25}(\frac{4}{10})^{12}(\frac{6}{10})^{13}$不相同 $\therefore$錯誤

    (C)$P(X=9)=C_{9}^{25}(\frac{4}{10})^{9}(\frac{6}{10})^{16},P(X=11)=C_{11}^{25}(\frac{4}{10})^{11}(\frac{6}{10})^{14}$不相同 $\therefore$錯誤

    (D)$E(X)=25\times 0.4=10\therefore$正確

    (E)$\sigma (X)=\sqrt{25\times \frac{4}{10}\times \frac{6}{10}}=\sqrt{6}<\sqrt{9}=3\therefore$正確

    故選(D)(E)。'
