  stem: 設一箱中有標記1號、2號、…、n號，大小相同的球各一顆，每球被取中之機會均等，今從箱中任取一顆球，令隨機變數X表抽中球的號碼，試求隨機變數X的(1)期望值與(2)變異數。
  answer:
  - (1)$\frac{n+1}{2}$；(2)$\frac{n^{2}-1}{12}$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)$E(X)=\frac{1}{n}\times 1+\frac{1}{n}\times 2+\frac{1}{n}\times 3+..+\frac{1}{n}\times n=\frac{1}{n}\times \frac{n(n+1)}{2}=\frac{n+1}{2}$

    (2) $\therefore Var(X)=E(X^{2})-\left[ E(X) \right] ^{2}=\frac{1}{n}\times (1^{2}+2^{2}+..+n^{2})-(\frac{n+1}{2})^{2}=\frac{n^{2}-1}{12}$'
