  - label: B
    content: 重視公營機構的生產與經營
  - label: C
    content: 從計畫經濟轉向市場經濟
  - label: D
    content: 國家管控生產的商品種類與價格
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 近百年來，此國周旋於中國、蘇聯、日本和美國之間，嘗盡了做小蝦米的滋味。1905年日俄戰爭，日本獲勝，戰利品不是俄國的領土，而是獲得此國的宗主權。五年後，日本進一步兼併了它。直到第二次世界大戰結束，戰敗的日本才撤出這片土地。上述的國家指的應該是
  options:
  - label: A
    content: 越南
  - label: B
    content: 琉球
  - label: C
