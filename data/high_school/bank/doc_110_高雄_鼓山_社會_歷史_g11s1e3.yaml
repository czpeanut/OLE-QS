questions:
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 英國的大砲轟開了中國閉關自守的大門，使得有些愛國知識分子從「天朝上國」的夢幻中驚醒，一股新思潮萌發了。這一新思潮的核心為何？
  options:
  - label: A
    content: 效法西方的君主立憲政治
  - label: B
    content: 與西方展開「商戰」，保護本土工業的權益
  - label: C
    content: 發起收回利權運動，重建中國司法、築鐵路等主權
  - label: D
    content: 向西方尋求強國禦悔之道
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某篇旅遊版的報導中：「當我們在西貢（今胡志明市）街頭閒逛時，便有一種置身在東方□□的錯覺，除了建築外，常見西貢人就像□□人在咖啡店外三三兩兩地閱報閒聯，在某種程度上，西貢就像另一真實版的□□，只不過是一處很燠熱的□□。」請問上文報導應填入哪一城市？
  options:
  - label: A
    content: 倫敦
  - label: B
    content: 巴黎
  - label: C
    content: 漢堡
  - label: D
    content: 威尼斯
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 一本關於中共黨史的書論述：「中國共產黨遭到大規模的破壞，幾個月前還有五萬名黨員，現在只剩七千名左右。左翼的國民黨人士不是銷聲匿跡，就是被迫流亡。湖南、廣東的大部分農民運動領袖不是犧牲，便是被逮捕下獄。」造成如此結果是遭遇何事使然？
  options:
  - label: A
    content: 國府北伐期間排共
  - label: B
    content: 國民黨清黨
  - label: C
    content: 九一八事件後遭軍殺害
  - label: D
    content: 國軍剿共
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 有位近代史學者評論某一時期的中國政局：「當時的中國，雖然已經達成統一，但在實質上，僅屬於一種形式上的統一。中央政府對於各地區控制的程度與影響力仍有一定的限度，過去那種地方割據的特質還未能真正擺脫。以軍事形勢而論，全國大致分為南京、武漢、廣州、太原與開封等數個軍權重心。儘管後來政府在現代化經濟建設方面付出的努力仍獲得一定的成果，但上述的政治特質，對於國家內部的不穩，以至於外患的趁機侵略，都可說是重要的因素。」請根據上文，判斷下列說明何者正確？
  options:
  - label: A
    content: 這段評論主要是探討民國初建北洋政府時期的中國
  - label: B
    content: 此時期中央政府傾向「先攘外再安內」的政策
  - label: C
    content: 上述內容指出「黃金十年」期間不穩定的因素
  - label: D
    content: 當時政府為尋求外援而實行「聯俄容共」的政策
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 哲明是一位曾經親歷民初社會變遷的知識分子，他回顧1915年到1930年期間的見聞與往事，並和年輕朋友分享。請問下列哪一項描述「不可能」會出現於他的分享內容？
  options:
  - label: A
    content: 當時不少知識分子將各種西方學說思想當成救國的良方
  - label: B
    content: 儒家傳統文化受到批判，甚至還被視為「吃人的禮教」
  - label: C
    content: 新的改革縮短城鄉差距，且促成農村土地獲得平均分配
  - label: D
    content: 有的地區傳統大家族制度逐漸沒落，小家庭的數量增多
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在中國飲食史的課堂上，老師說道：「因為中國開放港口，於是西方的商人們來到中國沿海地區進行通商活動，一些西方政府官員與傳教士先後進入中國帶來了西方的文化及宗教，這些人一般在中國生活時間較長，為了方便生活，他們往往會帶來本國食物跟本國廚師，同時也不可避免的要僱用中國工人為他們服務，這樣一來西方的生活方式也慢慢在國內傳播開來，甚至在之後出現中國人自己開設的西餐廳以及咖啡廳，麵包房。」請問老師所說的變化要在哪一個年代以後開始出現？
  options:
  - label: A
    content: 1880～1810年代
  - label: B
    content: 1820～1830年代
  - label: C
    content: 1840～1850年代
  - label: D
    content: 1860～1870年代
- id: doc_110_高雄_鼓山_社會_歷史_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 清末民初以來，有一個城市的繁榮要歸功於外國人的開港通商，也因此發展出一種拜金、西化的生活方式，雖然不是擁有豐富傳統資產的地方，但也成為現代化革命思想、西方新知的交換處。請問這個城市是？
  options:
  - label: A
    content: 北京
  - label: B
    content: 上海
  - label: C
    content: 西安
  - label: D
    content: 南京
