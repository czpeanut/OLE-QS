  section: 1
  number: 18
  type: single
  page: 2
  stem: 越南戰爭是20世紀歷時取久的戰爭。從1940年代中後期至1970年代中期，將近三十年的時間內，越南憑著簡陋的武器先後戰勝了兩個強盛的資本主義工業強國，不僅創造了戰爭史中的奇蹟，而且以其前仆後繼的民族犧牲精神演示了戰爭史中的一幕幕奇觀。請問這兩個工業強國是指？
