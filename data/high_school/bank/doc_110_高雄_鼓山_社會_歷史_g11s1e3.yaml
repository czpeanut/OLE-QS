  stem: 一篇2013年的報導中提到：「北韓當局將大規模下放經濟主導權給各級工廠與企業，由這些生產單位管理者自行決定交易、經營與僱用規劃，甚至可直接處理海外輸出項目。近年來，當局已在平壤針對各級管理人才施予建立『經濟管理改善體系』的集中教育，範圍從中央擴及至地方……。」由報導中可看出北韓經濟出現以下何種變化？
