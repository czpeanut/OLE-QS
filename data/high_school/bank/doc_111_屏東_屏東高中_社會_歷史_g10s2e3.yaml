  stem: 17 世紀初某中央政權頒布的法令如下：「嚴格禁止國人出入國門，同時嚴加取締天主教，禁止葡萄牙人進入。但另一方面民間卻出現以學習西方伽利略、牛頓科學體系的本地學者。其開館教授天文、醫學、物理、化學、植物以及世界地理等學問，而被譽為『接觸科學之初始』。」請問造成此一社會現象與下列何者有關？
  options:
  - label: A
    content: 明末耶穌會士來華
  - label: B
    content: 清初雍正實施禁教
  - label: C
    content: 德川幕府時期蘭學興盛
  - label: D
    content: 清末開港通商西學傳入
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此法令開始鎖國，嚴禁天主教與葡萄牙人進入，但民間卻能持續學習西方科學，可知並非清初的中國禁教，而是日本德川幕府時期的鎖國，當時仍能經由荷蘭人引進「蘭學」，故答案選(C)。
