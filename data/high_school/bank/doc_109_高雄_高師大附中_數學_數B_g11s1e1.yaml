  page: 2
  stem: 考慮函數 f（x）＝3 sin2x－1，試問下列選項何者為真？
  options:
  - label: A
    content: 值域為[－3，3]
  - label: B
    content: f（x）在 x＝$\frac{\pi}{2}$時有最大值
  - label: C
    content: f（x）的週期為$\frac{2\pi}{3}$
  - label: D
    content: y＝f（x）的圖形對稱於直線 x＝π
  - label: E
    content: f(1)＞0
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝3 sin2x－1

    (A) ╳：max＝3×1－1＝2

    min＝3×（－1）－1＝－4 ⇒ 值域為[－4，2]

    (B) ╳：$f \left( \frac{\pi}{2} \right)$＝3 sinπ－1＝3×0－1＝－1≠2，非最大值

    (C) ╳：週期＝$\frac{2\pi}{2}$＝π

    (D) ╳：f（π）＝3 sin2π－1＝－1

    ⇒ x＝π未通過波峰或波谷

    ⇒ 非對稱線

    (E) ○：f(1)＝3 sin2－1

    ≈ 3 sin114.6°－1＞3×$\frac{\sqrt{3}}{2}$－1＞0

    故選(E)'
