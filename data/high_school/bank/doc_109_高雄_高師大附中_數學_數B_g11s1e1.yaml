  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 設 sinθ＝$-\frac{3}{5}$，且θ為第四象限角，試選出正確的選項。
  options:
  - label: A
    content: cosθ＝$\frac{4}{5}$
  - label: B
    content: tanθ＝$-\frac{4}{3}$
  - label: C
    content: sin（π＋θ）＝$\frac{3}{5}$
  - label: D
    content: cos$\left( \frac{\pi}{2}+\theta \right) =\frac{3}{5}$
  - label: E
    content: tan（θ－π）＝$\frac{3}{4}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵cosθ＞0 且 sinθ＝$\frac{-3}{5}$ ∴cosθ＝$\frac{4}{5}$

    (B) ╳：tanθ＝$\frac{\sin \theta}{\cos \theta}$＝$-\frac{3}{4}$

    (C) ○：sin（π＋θ）＝－sinθ＝$\frac{3}{5}$

    (D) ○：$\cos \left( \frac{\pi}{2}+\theta \right)$＝－sinθ＝$\frac{3}{5}$

    (E) ╳：tan（θ－π）＝tanθ＝$-\frac{3}{4}$

    故選(A)(C)(D)'
