- id: doc_109_高雄_高師大附中_數學_數B_g11s1e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 右圖為三角函數 y＝3 sin（ax－b）的部分圖形，其中 a＞0 且 0＜b＜π，則下列各項敘述哪些正確？
  options:
  - label: A
    content: B（0，－3）
  - label: B
    content: b＝$\frac{\pi}{2}$
  - label: C
    content: $C \left( \frac{5\pi}{6} , 0 \right)$
  - label: D
    content: y＝f（x）的週期為$\frac{\pi}{2}$
  - label: E
    content: 其圖形可由 y＝3 sin3x 向左平移$\frac{\pi}{6}$而得
  assets:
  - key: s2_4_f1
    kind: figure
    file: doc_109_高雄_高師大附中_數學_數B_g11s1e1/s2_4_f1.png
    crop:
      page: 2
      rect:
      - 415.0
      - 569.6
      - 564.3
      - 679.2
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '週期＝$2 \left( \frac{\pi}{2}-\frac{\pi}{6} \right)$＝$\frac{2\pi}{3}$

    又週期＝$\frac{2\pi}{a}$ ⇒ a＝3

    ∵$f \left( \frac{\pi}{3} \right)$＝3 ⇒ 3＝$3 \sin \left( 3\times \frac{\pi}{3}-b \right)$

    ⇒ sin（π－b）＝1

    ∴b＝$\frac{\pi}{2}$

    (A) ○：x＝0 代入 y＝$3 \sin \left( 3x-\frac{\pi}{2} \right)$

    ＝3×sin$\left( -\frac{\pi}{2} \right)$＝－3

    (B) ○：b＝$\frac{\pi}{2}$

    (C) ○：∵週期＝$\frac{2\pi}{3}$

    又$\frac{\pi}{6}$＋$\frac{2\pi}{3}$＝$\frac{5\pi}{6}$

    ∴$C \left( \frac{5\pi}{6} , 0 \right)$

    (D) ╳：y＝f（x）的週期為$\frac{2\pi}{3}$

    (E) ╳：y＝3 sin3x $\xrightarrow[\frac{\pi}{6}]{左平移}$ y＝$3 \sin \left( 3 \left( x+\frac{\pi}{6} \right) \right)$

    ⇒ $y =3 \sin \left( 3x+\frac{\pi}{2} \right)$

    應為右平移$\frac{\pi}{6}$

    故選(A)(B)(C)'
