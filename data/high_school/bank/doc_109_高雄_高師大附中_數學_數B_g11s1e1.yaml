  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：sin3 ≈ sin171.9°＞0

    (B) ╳：cos3 ≈ cos171.9°＜0

    (C) ○：sin3 ≈ sin171.9°＝sin8.1°＜sin30°＝$\frac{1}{2}$

    (D) ╳：｜cos3｜ ≈ ｜cos171.9°｜＝cos8.1°＞cos60°＝$\frac{1}{2}$

    (E) ○：由(A)、(C)知，｜sin3｜＜$\frac{1}{2}$

    又由(D)知｜cos3｜＞$\frac{1}{2}$

    ∴｜sin3｜＜｜cos3｜

    故選(C)(E)'
