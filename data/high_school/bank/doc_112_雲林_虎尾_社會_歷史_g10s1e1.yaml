  page: 7
  stem: '以下有兩則與平埔族群正名相關的資料：

    資料一：2017 年，政府通過《原住民身分法》修正草案，在原本的身分別「山地原住民」及「平地原住民」之外，新增「平埔原住民」回應平埔族群長期以來的正名運動。

    資料二：1990 年代以來，尋求正名的平埔族群除了西拉雅等族外，陸續還有大大小小的族群爭取正名，例如位在埔里的噶哈巫族，長期被歸類為巴則海族的支分，然而其語言與習俗與巴則海族相異，近年來加入了正名的行列，並透過在部落開辦族語課程，傳承部落獨有的語言與文化。

    請參考上述兩則資料，判斷下列敘述何者正確？'
  options:
  - label: A
    content: 平埔族群正名運動至今仍未有進展
  - label: B
    content: 母語僅是內部文化的一環，對於平埔族群正名並未有影響
  - label: C
    content: 透過制定法律，代表平埔族群的權益日漸受到重視
  - label: D
    content: 由資料二可知政府對於原住民族的分類並不夠精細
  - label: E
    content: 原住民族的正名運動與近年來族群意識提升有關
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 2017 年新增「平埔原住民」的身分別，可算獲得初步進展。(B)復振母語是平埔族群正名運動的重要工作之一。
