  stem: 日治時期，總督府推動了林野調查：「1895 年，總督府發布官有林野取締規則，將無所有權證明或確實官方證據之山林原野，劃歸官有。1910 年，總督府以律令制訂臺灣林野調查規則，由殖產局林野調查課進行全臺林野調查，調查重點在確定臺灣林野所有權中，官有、民有的歸屬認定，初步查定官有與民有林野比例為 24 比 1。」關於該政策對原住民的影響，下列哪些選項正確？
  options:
  - label: A
    content: 原住民部落生存空間受到壓迫
  - label: B
    content: 80 年代後的原民「還我土地」運動可追溯至此
  - label: C
    content: 造成原住民僅有土地所有權，沒有土地使用權
  - label: D
    content: 造成原住民被大規模的強迫遷徙到平地實施農耕
  - label: E
    content: 促使原住民的認同由部落轉向以語言文化為區分的族群
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 林野所有權幾乎都歸官有，造成的影響有(A)(B)。(C)原住民幾乎沒有土地所有權，生活空間大受限制。(D)原住民並未被大規模遷徙至平地農耕。(E)土地居住範圍並非原住民族的認同依據。
