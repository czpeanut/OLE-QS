  stem: '關於明鄭政權在臺統治，有多種看法跟紀錄，請試著分析下列文字並解釋之。

    資料一：「鬼子滾蛋了，祖國的戰士們在延平郡王的率領和指揮下，解放了這塊美麗的土地，所有知道這件大事的臺灣人民，不管是赤崁城附近或其他更遠的地方，都在狂歡中慶祝這次的勝利。」

    資料二：「因為害怕鄭成功打臺灣，漢人紛紛準備逃亡。漢人領袖向荷蘭人密告並指出，即使國姓爺不能攻占或保有臺灣，他帶來的船也會搶奪大量的糧食、牲畜等，以維持軍需。」

    資料三：「鄭氏繼至，立法尤嚴，誅夷不遺赤子，併田疇廬舍廢之。」'
  options:
  - label: A
    content: 資料一是從民族主義立場描述
  - label: B
    content: 資料一和資料二對此事的評價相反
  - label: C
    content: 資料一出自日本描述、資料二出自荷蘭人
  - label: D
    content: 鄭成功的英雄形象是被塑造出來的
  - label: E
    content: 資料三鄭成功來臺對荷蘭人採用報復的手段
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (C)資料一稱荷蘭人為「鬼子」，稱鄭軍為「祖國的戰士們」，應為中國人的描述。(E)「誅夷不遺赤子」的「夷」指原住民，非荷蘭人。
