  stem: '以下是兩段有關臺灣歷史的資料：

    資料一：「本地民間信仰的力量仍大，居民又以遊獵為主，居無定所，傳教工作難以持續。」

    資料二：「各社設立小學，每學三十人，於是番人多習羅馬字，能作書。荷人又與番婦婚，教化之力日進。」

    試根據資料的內容，何者說法正確？'
  options:
  - label: A
    content: 資料一應是荷西時代，傳教士在臺傳教的情況
  - label: B
    content: 資料一應是日治時期日本人在臺傳教的情況，「居無定所」者指大陸移民
  - label: C
    content: 資料二應是荷蘭人所寫，可能是在傳教士向其所屬教會說明在臺灣的工作
  - label: D
    content: 資料二應是漢人所寫，描述他在臺灣開墾時，所見原住民部落學校的情形
  - label: E
    content: 兩段資料發生的地點應是在臺灣的南部地區，而時間應是在 17 世紀中期
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(E)為正解。(B)應為 17 世紀荷西統治時期。(D)資料二應是荷蘭傳教士所寫。
