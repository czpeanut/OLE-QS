- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 中共史家對臺灣歷史上的重要人物施琅有頗多研究。1980 年以前，這些史家稱施琅為「背叛明朝，投降滿清的漢奸」；1980 年以後，改稱施琅「事親至孝，接受儒家薰陶」，是一位正面人物。他們對施琅評價轉變的最合理解釋是
  options:
  - label: A
    content: 學者依當局政策，調整歷史解釋立場
  - label: B
    content: 引用西方觀點，拋棄道德史觀的框架
  - label: C
    content: 發現新史料，得以重新評估施琅功過
  - label: D
    content: 學術交流後，認同臺灣學者觀察角度
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 傳統史家對施琅皆為負面的評價，但 1980 年中共史家突然改變對施琅的評價，在沒有任何新史料發現的情況下，最有可能是受到政治力的操作影響，(A)為正解。(B)施琅的正面評價內容亦不脫道德史觀的框架。(C)沒有發現新史料。(D)臺灣史家對施琅依然多負面評價，顯見並非受到臺灣影響。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 歷史老師要同學以「緬懷先祖」為主題做一份報告，賴之遠同學決定以曾在二戰期間遠赴南洋作戰的曾祖父為對象。下列是他報告中所採用的資料，何者可被歸為一手史料？
  options:
  - label: A
    content: 賴氏宗族家傳的族譜
  - label: B
    content: 曾祖父寫給曾祖母的手札書信
  - label: C
    content: 採訪祖父追憶已逝的曾祖父的口訪內容
  - label: D
    content: 歷史教科書中關於太平洋戰役的記載
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「一手史料」指當事人或當時人直接留下的文字紀錄，因此答案為(B)。(A)(C)(D)皆屬二手史料。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 課堂上同學進行有關第一次世界大戰的專題報告時，討論起照片和繪畫兩種資料的價值。以下哪位同學的觀點最合理？(甲)照片是科技產品，不會造假，是過去的真實翻版(乙)繪畫是畫家所作，只要不虛構，便是過去的重現(丙)照片和繪畫若非為當時人留下的作品，都不可信(丁)照片和繪畫都不等於過去，而是通往過去的路徑
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)照片亦可能造假。(B)繪畫是畫家的意志創作，不見得能重現過去。(C)繪畫即使非當時人留下的作品，亦有參考價值。(D)為正解。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '資料一：「文獻記載中國官方與臺灣住民的接觸，可以追溯到三國或隋代，臺灣與大陸有著極其密切的歷史關係，臺灣自古以來就是中國的領土，居住在臺灣的高山族是祖國民族大家庭的成員。」

    資料二：「在歷史時代，文獻記載中國官方與臺灣住民的接觸，最早的可能可追溯到三國時代，或在隋代。」

    假設文獻記載的島嶼的確指臺灣，這類的接觸也是偶發的、不連續的，數百年難得發生一次，在本質上不是隸屬的關係。我們甚且可以說，正由於有這類的記載，我們可以確定臺灣不是『自古即為中國領土』。」我們應該如何理解這兩段文字？'
  options:
  - label: A
    content: 資料一為歷史事實，資料二則是歷史解釋
  - label: B
    content: 資料一為歷史解釋，資料二則是歷史事實
  - label: C
    content: 學者引用相同史料，可能獲得不同的結論
  - label: D
    content: 兩者引用相同史料，結論不同，當有一誤
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 文獻記載中國官方與臺灣住民的接觸，可以追溯到三國或隋代，但資料一與資料二卻做出完全相反的結論，可見得使用相同的史料，史家仍可能因為其他證據或是自身因素而做出不同的歷史解釋，答案為(C)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 連橫於〈臺灣通史序〉中寫下：「臺灣固無史也。荷人啟之，鄭氏作之，清代營之，開物成務，以立我丕基，至於今三百有餘年矣。」此外，臺獨教父史明所著的《臺灣人四百年史》，同樣也是以漢人來臺為臺灣歷史的開始。對此類觀點的駁斥，下列何者最為有力？
  options:
  - label: A
    content: 考古出土的遺址遺物
  - label: B
    content: 《南島語族》紀錄片
  - label: C
    content: 《巴達維亞城日誌》
  - label: D
    content: 現代史家的學術研究
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 連橫與史明主張臺灣的歷史從荷蘭人或漢人開啟，實則無視於更早居於臺灣的原住民族的存在，因此駁斥兩者的最有力證據應是(A)考古出土的遺址遺物。(B)(C)(D)皆為後人的成果，時間不早於(A)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '以下為當時擔任福建巡撫的劉銘傳與擔任道臺職務的劉璈的資料：

    資料一：「法人之役，劉銘傳治軍臺北，而劉璈駐南，皆有經國之才。使璈不以罪去，輔佐巡撫，以經理臺疆，南北俱舉，必有可觀。而銘傳竟不能容之。非才之難，而所以用之者實難，有以哉。」

    資料二：「臺灣三百年間，吏才不少；而能立長治之策者，厥為兩人；曰陳參軍永華，曰劉巡撫銘傳，是皆有大勳勞於國家者也。」

    資料三：詩人對劉銘傳評論：「自古眾志方成城，不聞鐵車（火車）與敵戰。又況勞民復傷財，民窮財盡滋內息。」

    我們如何理解這 3 段資料？'
  options:
  - label: A
    content: 3 則資料皆在讚嘆劉銘傳在臺治績
  - label: B
    content: 資料一主要批評劉璈，讚揚劉銘傳
  - label: C
    content: 資料一與資料二對劉銘傳評價完全正向
  - label: D
    content: 資料二與資料三立論矛盾，因其立場不同
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一批評劉銘傳不能見容劉璈；資料二稱讚劉銘傳對國家有大勳功；資料三批評劉銘傳的鐵路建設勞民傷財，因此答案為(D)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 歷史事實與歷史解釋不同，歷史事實是呈現客觀的事實本身；而歷史解釋則是史學家對史實的詮釋。下列哪一項敘述屬於史學家對史實的解釋？
  options:
  - label: A
    content: 後藤新平設立臺灣舊慣調查會，調查臺灣的傳統習慣
  - label: B
    content: 後藤新平設立臨時臺灣土地調查局，清查土地所有權
  - label: C
    content: 後藤新平決定廢除「三段警備法」，讓警察負起治安全責
  - label: D
    content: 後藤新平的執政，讓抗日活動漸漸消弭
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)皆是後藤新平政策的具體內容，屬於歷史事實。(D)敘述呈現政策與結果的因果關係，屬於歷史解釋。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 「X 族以檳榔、米酒祭拜被稱為『阿立祖』的壺。阿立，寫做 Alib 或 Alit，是神或靈的意思；祖則是祖先的意思。阿立祖沒有形體，其靈被請下來時，會居住在壺中。壺通常指的是陶器、瓷器或玻璃材質的花瓶、酒瓶、水缸或罐甕，被放置在公眾祭壇或自家宅中所設的祭壇上。」請問 X 族是指下列哪一族？
  options:
  - label: A
    content: 賽夏族
  - label: B
    content: 阿美族
  - label: C
    content: 噶瑪蘭族
  - label: D
    content: 西拉雅族
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 奉祀「阿立祖」的陶壺，為(D)西拉雅族的信仰文化。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 清初到過臺灣的黃叔璥在《臺海使槎錄》中記載一首原住民族歌謠：「今日歡會飲氣，明日及早捕鹿。回到社中，人人要得鹿。將鹿易銀完餉，餉完再來會飲。」這是指哪一族原住民族的生活寫照？
  options:
  - label: A
    content: 平埔族
  - label: B
    content: 泰雅族
  - label: C
    content: 布農族
  - label: D
    content: 鄒族
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「將鹿易銀完餉」一句，可知此原住民族為需要納餉的熟番，故答案為(A)平埔族。(B)(C)(D)皆為高山族，在清初不會向朝廷納餉。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 西元 2010 年 5 月，「平埔權益促進會」理事長潘紀揚，向聯合國人權理事會控告臺灣政府漠視平埔族生存權益，引發國內熱烈報導討論。請問有關平埔族的歷史及相關敘述何者正確？
  options:
  - label: A
    content: 因早期平埔族有獵首習俗，故清代稱之為「生番」
  - label: B
    content: 日治時期使用「平埔族」名稱，並依人類學方式再細分為數個不同的族群
  - label: C
    content: 戰後，國民政府將日治時期的「平埔族」併入「山地山胞」中
  - label: D
    content: 目前行政院核可的原住民族中，屬於平埔族的有噶瑪蘭族及西拉雅族
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)獵首、「生番」指高山族，清代稱平埔族為「熟番」。(C)國民政府將「平埔族」視同漢人，直接取消平埔族群身分。(D)西拉雅族目前尚未被行政院核可。
