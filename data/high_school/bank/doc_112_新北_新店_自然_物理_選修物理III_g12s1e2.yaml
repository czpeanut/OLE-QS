  section: 2
  number: 15
  type: multiple
  page: 2
  stem: 因為新冠肺炎的流行，餐廳經常在桌面上豎立壓克力板，以防止用餐時飛沫的傳播。若將厚度h的透明平板豎立於有方格紙圖案的餐桌上，使板面平行於水平格線，如圖示意圖。當垂直於板面正視時，發現板後水平格線的位置都往平板移動。若空氣折射率為1，平板的折射率為n，則下列敘述哪些正確？（注意：圖為手機拍攝到的畫面，其格線距離與真實距離不同。）
  options:
  - label: A
    content: 板後水平格線的位移量值，隨其距離版面的遠近而有不同
