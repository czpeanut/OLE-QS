  - label: C
    content: 板後各水平格線的位移量值都為$\frac{h}{n}$
  - label: D
    content: 板後各水平格線的位移量值都為$\frac{nh-h}{n}$
  - label: E
    content: 測得水平格線位移量值與平板厚度的比值，即可決定折射率n
