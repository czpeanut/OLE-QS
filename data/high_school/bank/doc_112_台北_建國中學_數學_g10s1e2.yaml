  stem: 直線 L 通過點（3，2）且與兩坐標軸在第一象限所圍的三角形面積有最小值，則 L 的方程式可表為＿＿＿＿。
  answer:
  - 2x＋3y＝12
  answer_status: verified
  answer_source: answer_key
  explanation: '設直線 L 的 x 截距為 a，y 截距為 b 且 a，b＞0

    令 L：$\frac{x}{a}+\frac{y}{b}$＝1

    ∵L 過點（3，2） ∴$\frac{3}{a}+\frac{2}{b}$＝1

    又所求為$\frac{1}{2}$ab 的最小值

    由算幾不等式，$\frac{\frac{3}{a}+\frac{2}{b}}{2}$≥$\sqrt{\frac{3}{a} \cdot \frac{2}{b}}$

    ⇒$\sqrt{\frac{6}{ab}}$≤$\frac{1}{2}$⇒$\frac{6}{ab}$≤$\frac{1}{4}$⇒ ab ≥ 24 ⇒$\frac{1}{2}$ab ≥ 12

    當$\frac{3}{a}$＝$\frac{2}{b}$＝$\frac{1}{2}$，即 a＝6，b＝4 時，三角形面積有最小值 12

    故 L 的方程式為$\frac{x}{6}+\frac{y}{4}$＝1 ⇒ 2x＋3y＝12'
