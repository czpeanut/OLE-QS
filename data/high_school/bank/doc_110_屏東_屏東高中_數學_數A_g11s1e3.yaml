- id: doc_110_屏東_屏東高中_數學_數A_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 若三向量$\vec{a}$＝（5，1）、$\vec{b}$＝（1，－2）、$\vec{c}$＝（18，8）滿足 $m\vec{a} + n\vec{b}$＝$\vec{c}$，其中 m、n 為實數，則 m＋2n 的值為下列何者？
  options:
  - label: A
    content: '0'
  - label: B
    content: －4
  - label: C
    content: －8
  - label: D
    content: '4'
  - label: E
    content: '8'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$m\vec{a} + n\vec{b}$＝$\vec{c}$

    $\Rightarrow$m（5，1）＋n（1，－2）＝（18，8）

    $\Rightarrow$（5m＋n，m－2n）＝（18，8）

    ∴$\begin{cases}5m + n = 18\ldots \ldots \ldots ① \\ m - 2n = 8 \ldots \ldots \ldots ②\end{cases}$

    由①×2＋②得 11m＝44，解得 m＝4

    代回①得 20＋n＝18$\Rightarrow$n＝－2

    ∴m＋2n＝4＋2×（－2）＝0，故選(A)'
  tags:
