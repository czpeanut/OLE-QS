  stem: 將 y＝$2^{x}$ 的圖形沿著 x 軸方向平移 h 單位，再沿著 y 軸方向平移 k 單位之後得到新的函數 y＝16×$2^{x}$＋2，其中 h＞0 表示向右平移，h＜0 表示向左平移，k＞0 表示向上平移，k＜0 表示向下平移，則 h＋k 之值為＿＿＿＿。
  answer:
  - －2
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$2^{x}$ $\xrightarrow{沿 x 軸平移 h 單位}$ y＝$2^{x－h}$

    $\xrightarrow{沿 y 軸平移 k 單位}$ y＝$2^{x－h}$＋k

    y＝$2^{x－h}$＋k＝16．$2^{x}$＋2＝$2^{4}$．$2^{x}$＋2＝$2^{x＋4}$＋2

    $\Rightarrow$h＝－4，k＝2

    故 h＋k＝－2'
