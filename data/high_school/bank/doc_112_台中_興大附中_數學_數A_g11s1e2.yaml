- id: doc_112_台中_興大附中_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 滿足不等式$\frac{1}{112}\leq(\sqrt{11})^{x}\leq$2023 的整數 x 共有多少個？
  options:
  - label: A
    content: 9 個
  - label: B
    content: 10 個
  - label: C
    content: 11 個
  - label: D
    content: 12 個
  - label: E
    content: 13 個
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$(\sqrt{11})^{- 4}$＝$\frac{1}{(\sqrt{11})^{4}}$＝$\frac{1}{11^{2}}$＝$\frac{1}{121}$＜$\frac{1}{112}$

    $(\sqrt{11})^{- 3}$＝$\frac{1}{(\sqrt{11})^{3}}$＝$\frac{1}{11\sqrt{11}}$＞$\frac{1}{11\times 4}$＞$\frac{1}{112}\Rightarrow$x$\geq$－3 ……………①

    $(\sqrt{11})^{6}$＝$11^{3}$＝121．11＝1331＜2023

    $(\sqrt{11})^{7}$＝$11^{3} \cdot \sqrt{11}$＞$11^{3}$．3＝3993＞2023$\Rightarrow$x$\leq$6 ………………②

    由①、②得－3$\leq$x$\leq$6

    整數 x 共有 10 個

    故選(B)'
