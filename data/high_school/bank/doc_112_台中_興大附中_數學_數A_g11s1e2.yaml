- id: doc_112_台中_興大附中_數學_數A_g11s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 關於對數函數的圖形，下列選項哪些是正確的？
  options:
  - label: A
    content: 設 0＜a＜b＜1，則$\frac{1}{2}(\log _{2}a +\log _{2}b)$＞$\sqrt{\log _{2}a\times \log _{2}b}$
  - label: B
    content: 設 0＜a＜b＜1，則$\log _{2}\left( \frac{a +b}{2} \right)$＞$\frac{1}{2}(\log _{2}a +\log _{2}b)$
  - label: C
    content: 當 0＜a＜1 時，y＝$log_{a}$x 與 y＝$a^{x}$ 的圖形對稱於直線 y＝x
  - label: D
    content: 當 a＞1 時，y＝$log_{a}$x 與 y＝$\log _{\frac{1}{a}}x$的圖形對稱於 x 軸
  - label: E
    content: 當 a＞1 時，y＝$log_{a}$x 與 y＝$a^{x}$ 的圖形沒有交點
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：由算幾不等式$\frac{∣ \log _{2}a ∣+∣ \log _{2}b ∣}{2}$＞$\sqrt{∣ \log _{2}a ∣∣ \log _{2}b ∣}$

    但 $log_{2}$a＜0，$log_{2}$b＜0，不滿足$\frac{\log _{2}a +\log _{2}b}{2}$＞$\sqrt{\log _{2}a\times \log _{2}b}$

    (B)○：a，b＞0，由算幾不等式$\frac{a +b}{2}$＞$\sqrt{ab}$

    $\Rightarrow\log _{2}\frac{a +b}{2}$＞$\log _{2}\sqrt{ab}$＝$\frac{\log \sqrt{ab}}{\log 2}$＝$\frac{\frac{1}{2}\log (ab)}{\log 2}$＝$\frac{1}{2} \left( \frac{\log a}{\log 2}+\frac{\log b}{\log 2} \right)$

    ＝$\frac{1}{2} (\log _{2}a +\log _{2}b)$

    (C)○：a＞0，a≠1 時，y＝$a^{x}$ 與 y＝$log_{a}$x 對稱於 y＝x

    (D)○：a＞0，a≠1 時，y＝$log_{a}$x 與 y＝$\log _{\frac{1}{a}}x$＝－$log_{a}$x 對稱於 x 軸

    (E)╳：當 a＝$e^{\frac{1}{e}}\approx$1.44 時，y＝$a^{x}$ 與 y＝$log_{a}$x 有一個交點

    故選(B)(C)(D)'
