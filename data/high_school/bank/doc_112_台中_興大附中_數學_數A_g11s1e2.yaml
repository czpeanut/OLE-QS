    ∴斜率＝$-\frac{\log 4}{\log 5}$＝－$log_{5}$4＝$log_{5}4^{－1}$＝$\log _{5}\frac{1}{4}$

    故 k＝$\frac{1}{4}$

    9.$\begin{cases}8^{x} = 54^{z} \\ 81^{y} = 54^{z}\end{cases}\Rightarrow\begin{cases}8 = 54^{\frac{z}{x}} \\ 81 = 54^{\frac{z}{y}}\end{cases}$

    $\Rightarrow\begin{cases}8^{4} = 54^{\frac{4z}{x}} \cdots \cdots \cdots \cdots \cdots ① \\ 81^{9} = 54^{\frac{9z}{y}}\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①×②得 $8^{4}$×$81^{9}$＝$54^{\frac{4z}{x}+\frac{9z}{y}}$

