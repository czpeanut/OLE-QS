    $\Rightarrow\begin{cases}\log _{a} (2t)=t \cdots \cdots \cdots \cdots \cdots ① \\ \log _{a} (4t)= 2t\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①得 t＝$log_{a}$（2t）代入②

    $\Rightarrow$2×$log_{a}$（2t）＝$log_{a}$（4t）

    $\Rightarrow$（2t）$^{2}$＝4t

    $\Rightarrow4t^{2}$－4t＝0

    $\Rightarrow$4t（t－1）＝0

    $\Rightarrow$t＝0（不合）或 1

    ∴A（2，1）

    所求$\overline{OA}^{2}$＝$(\sqrt{(2 - 0)^{2} +(1 - 0)^{2}})^{2}$＝5'
