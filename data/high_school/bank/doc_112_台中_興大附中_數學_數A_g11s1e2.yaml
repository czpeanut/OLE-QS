  explanation: '$\frac{\log k -\log 6}{10 - 6}$＝$\frac{\log 6 -\log 2}{6 - 2}$

    $\Rightarrow\frac{\log \frac{k}{6}}{4}$＝$\frac{\log 3}{4}\Rightarrow\frac{k}{6}$＝3

