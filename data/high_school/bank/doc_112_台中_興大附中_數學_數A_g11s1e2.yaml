- id: doc_112_台中_興大附中_數學_數A_g11s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 已知 log2$\approx$0.3010，log3$\approx$0.4771，請選出正確的選項。
  options:
  - label: A
    content: $6^{100}$ 是 78 位數
  - label: B
    content: $2^{50}$＋$5^{20}$ 是 16 位數
  - label: C
    content: $2^{30}$＋$3^{20}$ 是 11 位數
  - label: D
    content: 將$\left( \frac{1}{6} \right) ^{100}$表示成小數後，從小數點後第 78 位開始出現不為 0 的數字
  - label: E
    content: 將（0.2）$^{100}$＋（0.5）$^{200}$ 表示成小數後，從小數點後第 61 位開始出現不為 0 的數字
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：log $6^{100}$＝100 log 6＝100（log 2＋log 3）

    $\approx$100×（0.3010＋0.4771）＝77.81＝77＋0.81

    ∵首數為 77 ∴$6^{100}$ 為 78 位數

    (B)○：log $2^{50}$＝50 log 2$\approx$50×0.3010＝15.05＝15＋0.05

    ∵首數為 15 ∴$2^{50}$ 為 16 位數

    log $5^{20}$＝20 log 5＝$20\log \frac{10}{2}$＝20（log 10－log 2）

    $\approx$20×（1－0.3010）＝20×0.6990＝13.98＝13＋0.98

    ∵首數為 13 ∴$5^{20}$ 為 14 位數

    則 $2^{50}$＋$5^{20}$ 為 16 位數

    (C)╳：log $2^{30}$＝30 log 2$\approx$30×0.3010＝9.03＝9＋0.03

    ∵首數為 9 ∴$2^{30}$ 為 10 位數

    log $3^{20}$＝20 log 3$\approx$20×0.4771＝9.542＝9＋0.542

    ∵首數為 9 ∴$3^{20}$ 為 10 位數

    又 log 1＝0＜0.03＜0.3010＝log 2

    log 3＝0.4771＜0.542＜0.6020＝log 4

    則$2^{30}$＋$3^{20}$ 為 10 位數

    (D)○：$\log \left( \frac{1}{6} \right) ^{100}$＝log $6^{－100}$＝－100 log 6

    $\approx$－100×0.7781＝－77.81＝－78＋0.19

    ∵首數為－78

    ∴$\left( \frac{1}{6} \right) ^{100}$從小數點後第 78 位開始出現不為 0 的數字

    (E)○：log（0.2）$^{100}$＝$\log \left( \frac{1}{5} \right) ^{100}$＝log $5^{－100}$＝－100 log 5

    $\approx$－100×0.6990＝－69.9＝－70＋0.1

    ∵首數為－70

    ∴（0.2）$^{100}$ 從小數點後第 78 位開始出現不為 0 的數字

    log（0.5）$^{200}$＝$\log \left( \frac{1}{2} \right) ^{200}$＝log $2^{－200}$＝－200 log 2

    $\approx$－200×0.3010＝－60.2＝－61＋0.8

    ∵首數為－61

    ∴（0.5）$^{200}$ 從小數點後第 61 位開始出現不為 0 的數字

    則（0.2）$^{100}$＋（0.5）$^{200}$ 從小數點後第 61 位開始出現不為 0 的數字

    故選(A)(B)(D)(E)'
