  answer_status: verified
  answer_source: answer_key
  explanation: '$\log _{3}18 +\log _{\sqrt{3}}2 -\log _{9}576 +(\log _{3}5)(\log _{125}9)+(4)^{\log _{2}3}$

    ＝$\frac{\log 18}{\log 3}+\frac{\log 2}{\log \sqrt{3}}-\frac{\log 576}{\log 9}+ \left( \frac{\log 5}{\log 3} \right) \left( \frac{\log 9}{\log 125} \right) + 4^{\frac{\log 3}{\log 2}}$

    ＝$\frac{\log 18}{\log 3}+\frac{\log 2}{\frac{1}{2}\log 3}-\frac{2\log 24}{2\log 3}+ \left( \frac{\log 5}{\log 3} \right) \left( \frac{2\log 3}{3\log 5} \right) + 4^{\frac{2\log 3}{2\log 2}}$

    ＝$\frac{\log 18}{\log 3}+\frac{2\log 2}{\log 3}-\frac{\log 24}{\log 3}+\frac{2}{3}+4^{\frac{\log 9}{\log 4}}$

    ＝$\frac{\log 18}{\log 3}+\frac{\log 4}{\log 3}-\frac{\log 24}{\log 3}+\frac{2}{3}+4^{\log _{4}9}$

    ＝$\frac{\log \frac{18\times 4}{24}}{\log 3}+\frac{2}{3}+ 9$

    ＝$\frac{\log 3}{\log 3}+\frac{2}{3}+ 9$＝$\frac{32}{3}$'
