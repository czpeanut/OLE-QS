    故至少 23 年

    5.（logx）$^{2}$－logx－6＝0 的兩根 x＝α，β

    設 logx＝t

    $\Rightarrowt^{2}$－t－6＝0 的兩根 t＝logα，logβ

    則（t－logα）（t－logβ）＝0

    $\Rightarrowt^{2}$－（logα＋logβ）t＋logα．logβ＝0

    對照係數可得$\begin{cases}\log \alpha +\log \beta = 1 \\ \log \alpha \cdot \log \beta =- 6\end{cases}$

    故 $log_{α}$β＋$log_{β}$α＝$\frac{\log \beta}{\log \alpha}+\frac{\log \alpha}{\log \beta}$＝$\frac{(\log \alpha )^{2} +(\log \beta )^{2}}{\log \alpha \cdot \log \beta}$

    ＝$\frac{(\log \alpha +\log \beta )^{2} - 2\log \alpha \cdot \log \beta}{\log \alpha \cdot \log \beta}$

    ＝$\frac{(1)^{2} - 2 (- 6)}{- 6}$＝$-\frac{13}{6}$

    6.$\begin{cases}I (0)=\frac{1}{4 +k\times 4^{0}}=\frac{12}{240}=\frac{1}{20} \cdots \cdots \cdots \cdots \cdots ① \\ I (3)=\frac{1}{4 +k\times 4^{- 3a}}=\frac{20}{240}=\frac{1}{12}\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①得 k＝16

    代入②得 16×$4^{－3a}$＝8

    $\Rightarrow$（$4^{－a}$）$^{3}$＝$\frac{1}{2}$

    $\Rightarrow4^{－a}$＝$\left( \frac{1}{2} \right) ^{\frac{1}{3}}$

    則 I（t）＝$\frac{1}{4 + 16\times 4^{- at}}$＝$\frac{1}{5}$

    $\Rightarrow$16×（$4^{－a}$）$^{t}$＝1

    $\Rightarrow\left( \left( \frac{1}{2} \right) ^{\frac{1}{3}} \right) ^{t}$＝$\frac{1}{16}$＝$\left( \frac{1}{2} \right) ^{4}$

    $\Rightarrow\frac{1}{3}t$＝4

    $\Rightarrow$t＝12

    故第 12 個月時，是此傳染病的傳染高峰

    7.A（3，$log_{2}$3），B（7，$log_{2}$7），C（9，$log_{8}$9），D（49，$log_{8}$49）

    $m_{1}$＝$\frac{\log _{2}7 -\log _{2}3}{7 - 3}$

    ＝$\frac{1}{4}\times \left( \frac{\log 7}{\log 2}-\frac{\log 3}{\log 2} \right)$

    ＝$\frac{1}{4}\times \frac{\log \frac{7}{3}}{\log 2}$

    $m_{2}$＝$\frac{\log _{8}49 -\log _{8}9}{49 - 9}$

    ＝$\frac{1}{40}\times \left( \frac{\log 49}{\log 8}-\frac{\log 9}{\log 8} \right)$

    ＝$\frac{1}{40}\times \frac{\log \frac{49}{9}}{\log 8}$

    ＝$\frac{1}{40}\times \frac{2\log \frac{7}{3}}{3\log 2}$

    ＝$\frac{1}{60}\times \frac{\log \frac{7}{3}}{\log 2}$

    故$\frac{m_{1}}{m_{2}}$＝$\frac{\frac{1}{4}\times \frac{\log \frac{7}{3}}{\log 2}}{\frac{1}{60}\times \frac{\log \frac{7}{3}}{\log 2}}$＝15

    $8.4^{x}$．$5^{y}$＝100

