- id: doc_112_台中_興大附中_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某品牌計算機在計算對數 $log_{a}$b 時需按 log （ a ， b ）。某生在計算 $log_{a}$b 時（其中 a＞1 且 0＜b＜1）順序弄錯，誤按 log （ b ， a ），所得為正確值的$\frac{16}{9}$倍。試選出 a，b 間的關係式為何？
  options:
  - label: A
    content: $a^{3}$＝$b^{4}$
  - label: B
    content: $a^{4}$＝$b^{3}$
  - label: C
    content: $a^{16}$＝$b^{9}$
  - label: D
    content: $a^{3}$×$b^{4}$＝1
  - label: E
    content: $a^{4}$×$b^{3}$＝1
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '∵a＞1，且 0＜b＜1

    ∴$log_{a}$b＜0

    $log_{b}$a＝$\frac{16}{9}\log _{a}b$

    $\Rightarrow\frac{1}{\log _{a}b}$＝$\frac{16}{9}\log _{a}b$

    $\Rightarrow$（$log_{a}$b）$^{2}$＝$\frac{9}{16}$

    $\Rightarrowlog_{a}$b＝$\pm \frac{3}{4}$（正不合）

    $\Rightarrow$b＝$a^{-\frac{3}{4}}$

    $\Rightarrowb^{4}$＝$a^{－3}$

    $\Rightarrowa^{3}b^{4}$＝1

    故選(D)'
