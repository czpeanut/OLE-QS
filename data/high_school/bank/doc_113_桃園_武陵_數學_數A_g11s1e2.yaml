  stem: <u>阿奇</u>儲蓄多年準備在今年買房，銀行評估後能給阿奇的房屋貸款年利率為2.4％。若<u>阿奇</u>打算每個月的房貸支出最多為4萬元，並以30年無寬限期採本息平均攤還法還款，即每個月複利一次，每個月繳納相同的金額，分360個月還清。則<u>阿奇</u>向銀行貸款的最高金額為＿＿＿＿萬元。（單位為萬元，答案請四捨五入至整數位）（$1.024^{30}\approx$2.037，$1.024^{-30}\approx$0.491，$1.002^{360}\approx$2.053，$1.002^{-360}\approx$0.487）
  explanation: 即每月還4萬元，年利率2.4％ ⇒ 月利率0.2％ 設最多貸款x元， x．( 1＋0.2％)$^{360}$＝4．( 1＋0.2％)$^{359}$＋4．( 1＋0.2％)$^{358}$＋…＋4 ⇒ x．$1.002^{360}$＝$\frac{4 [1.002^{360}-1]}{1.002-1}$ ⇒ x＝$\frac{4 [2.053-1]}{0.002}$×$\frac{1}{1.002^{360}}$＝2000×1.053×0.487＝1025.622 故最多貸款1025萬。
