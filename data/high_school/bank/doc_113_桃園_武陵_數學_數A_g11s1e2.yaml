  stem: 將y＝$2^{x}$的圖形以y軸為基準線水平伸縮$log_{a }$b倍，所得圖形與y＝$6^{x}$的圖形重合，其中a、b皆為小於10的正整數，試求( a , b )＝＿＿＿＿。
