questions:
- id: doc_113_桃園_武陵_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 梅森質數是指能表示成$2^{n}$－1的質數，記為$M_{n}$。<u>杜蘭特</u>於2024年宣布找出了目前世界上已知的最大質數$M_{136279841}$＝$2^{136279841}$－1，比2018年發現的最大質數$M_{82589933}$＝$2^{82589933}$－1還多出了k位數（例如131071比8191多出了2位數），則k最接近下列何數？
  options:
  - label: A
    content: 136279841－82589933
  - label: B
    content: $2^{136279841-82589933}$
  - label: C
    content: $2^{136279841}$－$2^{82589933}$
  - label: D
    content: (136279841－82589933 ) log 2四捨五入至整數位
  - label: E
    content: $log_{2}$ (136279841－82589933 )四捨五入至整數位
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: k＝log $2^{136279841}$－log $2^{82589933}$ ＝( 136279841－82589933 ) log 2四捨五入至整數位 故選(D)。
- id: doc_113_桃園_武陵_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 方程式$log_{x}$ ( $3x^{2}$－2x )＝$log_{x}$ $x^{3}$的實數解x一共有幾個？
  options:
  - label: A
    content: 1個
  - label: B
    content: 2個
  - label: C
    content: 3個
  - label: D
    content: 0個
  - label: E
    content: 以上皆非
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: $log_{x}$ ( $3x^{2}$－2x )＝$log_{x}$ $x^{3}$ ⇒ $3x^{2}$－2x＝$x^{3 }$ ⇒ x ( $x^{2}$－3x＋2 )＝x ( x－1 ) ( x－2 )＝0 ∴ x＝0，1，2，但x＝0，1不合（在底數） x＝2時，$log_{2}$ ( 8 )＝$log_{2}$ $2^{3}$（正確） 故選(A)。
