  stem: 心理學中的席克法則說明人們在面對決策時，當選項越多，需要決策的時間就越長。<u>阿奇</u>每天早上花在決定要穿哪球鞋出門的時間T符合席克法則，可用下列數學式表示： T＝1＋$log_{2}$ ( n＋1)，其中n為阿奇的球鞋數量（單位為雙）。 已知目前<u>阿奇</u>有兩雙球鞋，若再購入一雙新球鞋，則<u>阿奇</u>每天早上花在決定穿哪雙鞋的時間將會變成原來的log $_{a }$b倍，其中a、b皆為小於10的正整數。試求數對( a , b )＝＿＿＿＿。
