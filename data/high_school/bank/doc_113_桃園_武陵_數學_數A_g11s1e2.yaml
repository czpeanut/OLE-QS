- id: doc_113_桃園_武陵_數學_數A_g11s1e2_s2_4
  section: 2
  number: 4
  type: multiple
  page: 1
  stem: 假設f (x)＝($\sqrt{2}$)$^{x}$，其中x為實數，請選出下列正確的選項。
  options:
  - label: A
    content: f (4)＝4
  - label: B
    content: f (3)＜3
  - label: C
    content: y＝f (x)的圖形與y＝x恰交於一點
  - label: D
    content: 若a＞$\sqrt{2}$，則y＝a $^{x}$與y＝log $_{a}$ x的圖形沒有交點
  - label: E
    content: 若1＜a＜$\sqrt{2}$，則y＝a $^{x}$與y＝log $_{a}$ x的圖形恰交於兩點
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_113_桃園_武陵_數學_數A_g11s1e2_s2_5
  section: 2
  number: 5
  type: multiple
  page: 1
  stem: 請選出下列正確的選項。( e$\approx$2.718 )
  options:
  - label: A
    content: $e^{-e}$＞$3^{-3}$
  - label: B
    content: $4^{\log _{6}\frac{1}{2}}>3^{\log _{6}\frac{1}{2}}$
  - label: C
    content: 已知0＜α＜β，則log (α＋β )＞$\frac{1}{2}$log (αβ )＋log 2
  - label: D
    content: 已知$2^{α}$＝$3^{β}$，則α＞β
  - label: E
    content: 已知($\frac{1}{2}$) $^{α}$＝α，($\frac{1}{3}$) $^{β}$＝β，則α＞β
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：1＜e＜3 ⇒ $e^{e}$＜$3^{e}$＜$3^{3}$ $(e^{e})^{-1}$＞$(3^{3})^{-1}$ ⇒ $e^{-e}$＞$3^{-3}$。 (B) ×：$4^{\log _{6}\frac{1}{2}}=(\frac{1}{2})^{\log _{6}4}$，$3^{\log _{6}\frac{1}{2}}=(\frac{1}{2})^{\log _{6}3}$ ∵ $log_{6}$ 4＞$log_{6}$ 3 ∴$(\frac{1}{2})^{\log _{6}4}<(\frac{1}{2})^{\log _{6}3}$ ⇒$4^{\log _{6}\frac{1}{2}}<3^{\log _{6}\frac{1}{2}}$。 (C) ○：∵$\frac{\alpha +\beta}{2}>\sqrt{\alpha \beta}$ ⇒ $\log ^{\frac{\alpha +\beta}{2}}>\log \sqrt{\alpha \beta}$ log (α＋β)－log 2＞$\frac{1}{2}$log (αβ) log (α＋β)＞$\frac{1}{2}$log (αβ)＋log 2 (D) ○：$2^{α}$＝$3^{β}$ ⇒ log $2^{α}$＝log $3^{β}$ ⇒ αlog 2＝βlog 3 $\frac{\alpha}{\beta}=\frac{\log 3}{\log 2}>1$ ⇒ α＞β (E) ○：考慮$\begin{cases}y=x \\ y=(\frac{1}{2})^{x}\end{cases}$交點x坐標α $\begin{cases}y=x \\ y=(\frac{1}{3})^{x}\end{cases}$交點x坐標β α＞β 故選(A)(C)(D)(E)。
