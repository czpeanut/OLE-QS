  stem: 滿足不等式$\log _{\frac{1}{10}}$( x－20 )＞$\log _{\frac{1}{100}}$( 336－6x )的整數x共有＿＿＿＿個。
  explanation: $\log _{\frac{1}{10}}$( x－20 )＞$\log _{\frac{1}{100}}$( 336－6x ) ⇒ $\log _{\frac{1}{100}}$( x－20 )$^{2}$＞$\log _{\frac{1}{100}}$( 336－6x ) ⇒ $\begin{cases}x-20>0 \\ 336-6x>0 \\ (x-20)^{2}>336-6x\end{cases}$ ⇒ $\begin{cases}x>20 \\ x<56 \\ x>32 , x<2\end{cases}$交集32＜x＜56 ∴整數x有55－33＋1＝23 (個)
