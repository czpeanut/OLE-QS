  stem: 已知直線y＝$\frac{x}{10}$與y＝log x的圖形有兩個交點。設a、b、c分別為直線y＝$\frac{x}{10}$與y＝log (－x )、y＝log |－x |、y＝| log x |三圖形的交點個數，則a、b、c三數的大小關係為？
