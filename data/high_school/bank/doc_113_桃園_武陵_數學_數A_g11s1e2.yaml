  stem: 行政院為落實全民節電，於103年訂定各機關學校須達成每年節電1％以上之目標值，即每年用電量較前一年度減少1％以上。假設本校每年都恰好節電1％，以102年用電量為基準，實施第一年（103年）用電量為102年用電量的99％，實施第二年（104年）用電量為102年用電量的99％× 99％＝98.01％，…，依此類推。則至少實施至第＿＿＿＿年，可達成節電20％的目標（即該年用電量小於等於102年用電量的80％）。（log 8$\approx$0.9031，log 9$\approx$0.9542，log 11$\approx$1.0414）
