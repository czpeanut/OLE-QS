  stem: 教育部於嘉義中埔、鹿草、義竹等地設立數位機會中心，除提供各項資訊課程提昇社區居民的數位能力之外，更努力將當地特有的人文、產業、景觀、資源，利用資訊化的方式推廣出去，以達到數位夢想的時代。此外，有些地區更推動銀髮數位教育，辦理適合長者的電腦資訊課程，如平板體驗課程，讓樂齡長者們也能跟得上時代的潮流。請問：根據上文，下列敘述何者正確？
