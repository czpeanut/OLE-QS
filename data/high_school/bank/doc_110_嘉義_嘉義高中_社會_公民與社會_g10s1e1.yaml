  stem: 臺灣近年發生幾起因為「思覺失調症」，而減輕罪責的犯罪事件。在新聞報導中常見堂特別標記傷人者患有「精神疾病」而被減刑，因此精神疾病容易被誤認為是「危險的」、「能拿來脫罪」等負面形象，而社會大眾也因此出現司法不公的聲浪。不只讓社會大眾對精神病患產生疑慮，更對司法產生不信任。而反觀思覺失調症患者及家屬，卻很少能在媒體上發聲，而新聞更是鮮少報導司法運作的正確流程。請問根據上述判斷，下列敘述何者正確？
  options:
  - label: A
    content: 弱勢族群因數位落差、資訊不平均，帶來不平等待遇
  - label: B
    content: 思覺失調患者被媒體貼上標籤，為了要提醒民眾注意
  - label: C
    content: 顯示處於社會不利處境的群體有媒體再現的不平等問題
  - label: D
    content: 新聞報導「又有犯人靠思覺失調症減刑？」，是平等的媒體再現
