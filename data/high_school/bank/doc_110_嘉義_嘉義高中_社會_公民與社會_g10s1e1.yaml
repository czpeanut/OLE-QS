- id: doc_110_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s2_2
  section: 2
  number: 2
  type: single
  page: 5
  stem: '國內新聞廣告化的情形相當普遍，尤其是業配式的新聞更引起各界的爭議。一般而言，廣告主最常藉由此一手法，將訊息轉化成新聞，或以新聞報導方式來包裝廣告內容，至於廣告商則未在報導中公開曝光。新聞的置入性行銷有許多呈現形式，通常最常見可分為以下四類： (一)策劃報導：行銷傳播代理商直接贊助某一電視新聞雜誌節目，做一項專題報導，詳細介紹產品的品質、功能、特色，或者是產品生產的過程，乃至於產品使用者的體驗等。 (二)與公關活動搭配：這種置入性行銷的手法可算是事件行銷的延伸，記者錄製或現場報導產品地上市或說明會等活動，在新聞報導直接露出產品。 (三)新聞話題置入：電視新聞主播報導一項新聞話題時，用某一產品品牌作例子，將這個品牌與新聞話題結合。此一手法也可能會報導一些其他的相關品牌，以平衡報導的樣貌，而骨子裡卻是只以某一產品品牌為主題。 (四)談話性節目的置入：在各類電視新聞談話性節目中，主持人與來賓都可能似乎不經意提到某個產品品牌，描述他們使用這個品牌的親身體驗，或談論其他使用者對於使用這個品牌的感受與想法。 利用報紙電視新聞的權威性，為其商品宣傳做背書，企圖模糊新聞與廣告兩者間的界線，藉以達到宣傳的效果。 然而針對新聞的置入性行銷，有學者則持反對意見，其認為電視新聞是提供閱聽人新聞資訊的主要管道，倘若新聞內容中充斥著商業訊息及對價關係，使閱聽眾收視時難以區辨，不僅妨礙了新聞自主、社會責任和客觀公正的專業意理，更利用新聞的可信度引起觀眾的注意或收視，轉售給廣告商這種行為，「新聞」不再單純的為民喉舌，而成為媒體業販賣的商品之一，故有學者提出政府應制定法律，限制新聞的置入性行銷…。

    43. ( )根據上列資訊，請判斷下列何者「不是」新聞裡的置入性行銷？'
