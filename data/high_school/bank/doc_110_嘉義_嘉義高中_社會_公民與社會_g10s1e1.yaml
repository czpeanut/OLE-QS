  stem: '下表為芋頭研究我國2020年第十屆立委選舉結果的統整資料，請根據下列資料一及資料二回答問題： 資料一： 資料二：憲法增修條文第四條第三款：「依政黨名單投票選舉之，由獲得百分之五以上政黨選舉票之政黨依得票比率選出之，各政黨當選名單中，婦女不得低於二分之一。」

