  type: single
  page: 1
  stem: 公民投票是落實憲法所賦予人民的「創制權」及「複決權」。其中創制權為人民主動積極的立法權，而複決權為投票決定支持與否的消極立法權。請間：根據上述，下列關於公民投票的敘述，何者「錯誤」？
  options:
  - label: A
    content: 人民可透過公投來落實立法原則之創制
  - label: B
    content: 人民可透過公民投票來行使法律的創制權及提案權
  - label: C
    content: 人民可提案針對法律、立法原則、或重大政策進行公投
  - label: D
    content: 針對國家的重大政策，人民可透過公投來行使創制權或複決權
