  stem: '自2020年美國總統川普簽署行政命令，試圖限縮社群媒體免責權後，美國政府於今年（2021年）政策轉向保障新聞自由，不再以法律命令強迫記者必須揭露消息來源，只有在特殊情況下例外。司法部表示，未來將不再利用「強迫的法律手段來獲取新聞媒體成員在新聞採集活動中的信息或紀錄」，這意味著司法部將不再向記者、出版社、第三方的服務商，以發出傳票或是搜查令，來取得紀錄。 但美國政府亦宣布，此政策在特殊情況之下並不適用，例如當記者被列為調查對象、或是被懷疑是國外情報人員、恐怖組織成員，或是涉入有「緊迫」死亡或受傷危險的案件。另外，如果記者成為犯罪嫌疑人，例如涉嫌內部交易，或是在採訪時有闖入民宅的犯罪行為，也不適用新政策。

