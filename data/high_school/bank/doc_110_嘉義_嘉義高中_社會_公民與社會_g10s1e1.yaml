  stem: 政府資訊透明化是讓民主治理課責的重要一環之一。透過讓政府公開決策過程，不僅能給選民更多資訊、讓選民監督，更能提高民眾參與決策的機會。請問下列關於「政府資訊透明化」的相關敘述，何者正確？
