  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 因為tanθ＜0且P點的x坐標為1＞0，所以θ為第四象限角， (A) ×：sinθ＝－$\frac{5}{13}$。 (B) ○：cos 2θ＝1－2 $sin^{2}$θ＝1－2×(－$\frac{5}{13}$)$^{2}$＝1－$\frac{50}{169}$＝$\frac{119}{169}$。 (C) ○：sin$\frac{\theta}{2}$＝±$\sqrt{\frac{1-\cos \theta}{2}}$＝±$\sqrt{\frac{1-\frac{12}{13}}{2}}$＝±$\frac{1}{\sqrt{26}}$。 (D) ×：因為θ為第四象限角，所以$\frac{\theta}{2}$為第二象限角或第四象限角， 又sin$\frac{\theta}{2}$＝±$\frac{1}{\sqrt{26}}$，因此可得tan$\frac{\theta}{2}$＝－$\frac{1}{5}$。 (E) ×：cos (θ＋$\frac{\pi}{6}$)＝cosθcos$\frac{\pi}{6}$－sinθsin$\frac{\pi}{6}$＝$\frac{12}{13}$×$\frac{\sqrt{3}}{2}$－(－$\frac{5}{13}$)×$\frac{1}{2}$＝$\frac{12\sqrt{3}+5}{26}$。 故選(B)(C)。
