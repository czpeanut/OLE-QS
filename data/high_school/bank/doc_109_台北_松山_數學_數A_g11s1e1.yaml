  - label: B
    content: cos 2θ＝$\frac{119}{169}$
  - label: C
    content: sin$\frac{\theta}{2}$＝±$\frac{1}{\sqrt{26}}$
  - label: D
    content: tan$\frac{\theta}{2}$＝±5
  - label: E
    content: cos(θ＋$\frac{\pi}{6}$)＝$\frac{12\sqrt{3}-5}{26}$
