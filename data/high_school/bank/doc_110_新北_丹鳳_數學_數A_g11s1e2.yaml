  stem: 在五個數字$\log (3 + 2\sqrt{2})$、$\log (3 - 2\sqrt{2})$、$- \log (3 + 2\sqrt{2})$、$- \log (3 - 2\sqrt{2})$、$\log 3 + \log 2\sqrt{2}$中，經化簡後有多少個不同的實數？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＝$\log (3 + 2\sqrt{2})$

    b＝$\log (3 - 2\sqrt{2})$

    c＝$- \log (3 + 2\sqrt{2})$＝$\log (3 + 2\sqrt{2})^{- 1}$＝$\log \frac{1}{3 + 2\sqrt{2}}$＝$\log (3 - 2\sqrt{2})$

    d＝$- \log (3 - 2\sqrt{2})$＝$\log (3 - 2\sqrt{2})^{- 1}$＝$\log \frac{1}{3 - 2\sqrt{2}}$＝$\log (3 + 2\sqrt{2})$

    e＝$\log 3 + \log 2\sqrt{2}$＝$\log (3 \times 2\sqrt{2})$＝$\log 6\sqrt{2}$

    ∵a＝d，b＝c ∴此 5 個數化簡後有 3 個不同的實數，故選(C)'
