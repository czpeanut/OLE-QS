  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵$a^{\log _{a}b}$＝b ∴$5^{\log 3}$≠3

    (B)╳：∵$log_{2}$3＞1 且 $log_{3}$7＞1

    ∴$log_{2}$3＋$log_{3}$7＞2，但 1＜$log_{6}$21＜2

    ∴$log_{2}$3＋$log_{3}$7≠$log_{6}$21

    (C)╳：$log_{2}$7＞$log_{2}$4＝2，$\log \frac{7}{2}$＜log10＝1

    ∴$log_{2}$7≠$\log \frac{7}{2}$

    (D)○：$log_{4}$27＝$\log _{2^{2}}3^{3}$＝$\frac{3}{2}\log _{2}3$

    (E)○：log252＝log（$2^{2}$×$3^{2}$×7）＝$log2^{2}$＋$log3^{2}$＋log7＝2 log2＋2 log3＋log7

    故選(D)(E)'
