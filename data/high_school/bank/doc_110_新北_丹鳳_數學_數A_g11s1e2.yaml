  - label: B
    content: $\log _{\frac{1}{3}}0.2$＜$\log _{\frac{1}{3}}0.25$＜$\log _{\frac{1}{3}}0.5$
  - label: C
    content: $log_{3}$11＜$log_{2}$11
  - label: D
    content: $\sqrt[4]{\frac{1}{3}}$＜$\sqrt[3]{\frac{1}{3}}$＜$\sqrt{\frac{1}{3}}$
  - label: E
    content: $\frac{3^{45} + 3^{55}}{2}$＜$3^{50}$
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵3＞1 且 0.2＜0.25＜0.5

    ∴$log_{3}$0.2＜$log_{3}$0.25＜$log_{3}$0.5

    (B)╳：∵0＜$\frac{1}{3}$＜1 且 0.2＜0.25＜0.5

    ∴$\log _{\frac{1}{3}}0.2$＞$\log _{\frac{1}{3}}0.25$＞$\log _{\frac{1}{3}}0.5$

    (C)○：∵log3＞log2 ∴$\frac{\log 11}{\log 3}$＜$\frac{\log 11}{\log 2}$

    故 $log_{3}$11＜$log_{2}$11

    (D)╳：∵$\frac{1}{4}$＜$\frac{1}{3}$＜$\frac{1}{2}$且 0＜$\frac{1}{3}$＜1

    ∴$\left( \frac{1}{3} \right) ^{\frac{1}{4}}$＞$\left( \frac{1}{3} \right) ^{\frac{1}{3}}$＞$\left( \frac{1}{3} \right) ^{\frac{1}{2}}$

    ∴$\sqrt[4]{\frac{1}{3}}$＞$\sqrt[3]{\frac{1}{3}}$＞$\sqrt{\frac{1}{3}}$

    (E)╳：∵$\frac{3^{45} + 3^{55}}{2}$＞$\sqrt{3^{45} \times 3^{55}}$＝$\sqrt{3^{45 + 55}}$＝$(3^{100})^{\frac{1}{2}}$＝$3^{50}$

    故選(A)(C)'
