    ＝$5 - \frac{2}{3}$＝$\frac{13}{3}$

    (2) $\left( \frac{\log _{5}3}{\log _{5}2} - \log _{2}\sqrt{6} + \log _{2}\sqrt{2} \right) (1 - \log _{3}6)$

    ＝$(\log _{2}3 + \log _{2}\sqrt{2} - \log _{2}\sqrt{6}) (\log _{3}3 - \log _{3}6)$

    ＝$\log _{2}\frac{3 \times \sqrt{2}}{\sqrt{6}} \times \log _{3}\frac{3}{6}$＝$\log _{2}\sqrt{3} \times \log _{3}\frac{1}{2}$

    ＝$\left( \frac{1}{2}\log _{2}3 \right) (- \log _{3}2)$＝$- \frac{1}{2}$'
