  stem: 如右圖為函數 y＝k＋$log_{a}$（x＋b）的部分圖形，x＝－1 為此函數圖形之漸近線，下列敘述何者正確？
  options:
  - label: A
    content: a＞1
  - label: B
    content: b＝－1
  - label: C
    content: k＝1
  - label: D
    content: a－k＞0
  - label: E
    content: a－b＜0
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_110_新北_丹鳳_數學_數A_g11s1e2/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 433.9
      - 326.1
      - 564.3
      - 412.25
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵x＝－1 為漸近線$\Rightarrow$ x＋1＝0$\Rightarrow$得 b＝1

    ∵圖形為遞減函數 ∴0＜a＜1

    又 y＝k＋$log_{a}$（x＋1）過（0，2）

    $\Rightarrow$2＝k＋$log_{a}$（0＋1）＝k＋0

    $\Rightarrow$k＝2

    (A)╳：0＜a＜1

    (B)╳：b＝1

    (C)╳：k＝2

    (D)╳：a－k＝a－2＜0

    (E)○：a－b＝a－1＜0，故選(E)'
