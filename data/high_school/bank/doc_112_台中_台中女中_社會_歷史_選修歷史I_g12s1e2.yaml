  stem: 光緒年間，上海《女子世界》雜誌有人賦詩：「黃帝子孫神明冑，源何甘為奴隸死？乘此風潮好進行，大家勉造國民母。」文中所謂國民母是國民之母的意思，請問這個概念是源自於何種「風潮」使然？
  options:
  - label: A
    content: 歐洲女性主義思潮傳入中國，女性地位受到重視
  - label: B
    content: 「孟母三遷」典範再度重視，使得「國民之母」教育思想興起
  - label: C
    content: 西方教育思想傳入中國，捨棄「賢妻良母」標準，鼓勵女性從政
  - label: D
    content: 國族主義與強國保種思想盛行，女性被納入未來國家建設的藍圖
