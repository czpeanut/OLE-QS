  answer_source: answer_key
  explanation: '從題幹可看出 14、15 世紀英格蘭森林又再度覆蓋大地，15 世紀晚期才因人口復甦，林地又被清理，而 14、15 世紀人口減少，應與黑死病流行相關，故選(C)。(A)諾曼人征服於 11 世紀。(B)十字軍運動於 11 ～ 13 世紀。(D)百年戰爭雖發生於 14 ～ 15 世紀，但戰場大多在法國，且戰局初期多是英人獲勝，再加上當時仍為冷兵器時代，在火器尚未大規模使用之前，因戰爭而死傷的人口數量有限，並未如黑死病影響來的巨大。

    27.15 世紀中葉古騰堡是歐洲第一位發明活字印刷術的歐洲人，活字印刷術的發明使得書籍的印刷速度加快、成本也降低，因此書籍的價格也較為便宜，符合題幹所述現象，故選(A)。

    28.文藝復興時代的人文學者研究希臘、羅馬時代的書籍，從中發現古代的科學研究與藝術風格。後來傳播到日耳曼一帶，當地的人文學者所研究的古學，以《聖經》與古代的基督徒作品為主，發展出「基督教人文主義」。無論是研究希臘羅馬時期的書籍，或是《聖經》與基督教的作品，均需仰賴文字的考據，以釐清經典的原意。(B)邏輯辯證、(D)神學爭論均為抽象的討論，文藝復興時代重視的是具體的經典。(C)科學實驗在 17 世紀科學革命後才較為普及。

    29.16 世紀宗教改革以來，由於新教派拒絕承認教會與教宗權威，與天主教產生衝突，此即丙同學的看法。同一時間，世俗王權興起，君王企圖利用宗教控制人民，但其治下的人民卻有可能為不同信仰的教徒，且也有許多諸侯貴族為了自身利益而選擇與國王不同的教派，因此爆發戰爭，如神聖羅馬帝國內戰或三十年戰爭都可做為案例，此即乙同學的看法，故選(B)。甲同學：資本主義的發展若有強大的國家支持，則能更為興盛，但宗教戰爭卻削弱了國家的力量，並造成各國的對立，不利商業流通與發展。丁同學：自由主義思潮是 18 世紀啟蒙運動的產物。

    30.題文中提到該殖民地為黃金豐富的產區，與原住民遭屠殺殆盡的景象，得以判斷應是西班牙對南美洲的統治，由於南美洲蘊藏豐富的黃金與白銀，而原有的土著印第安人在西班牙的統治之下又發生幾近滅絕的情形，故可得知(A)最為正確。(B)(C)(D)三選項中的殖民地皆非黃金產區，且當地人民也未發生種族滅絕的現象。

    31.根據題幹可以知道伏爾泰認為「最偉大的人」應該是獲得上天賦予的天分，並以此照亮人們的心智，同時能以真理的力量引領我們的心，並且了解宇宙者。而牛頓是科學革命時代最重要的學者，他不僅奠定力學基礎的基本概念，還有研究天體力學的理論，更提出「機械式的宇宙觀」，這些都是帶領世人了解宇宙的重要關鍵。

    32.腓特烈二世為 18 世紀的「開明專制」君主，施行許多含有啟蒙運動思想的改革，如法律改革、宗教自由、興辦教育與鼓勵科學、文藝發展。(甲)「每個人都將依照自己的方式崇拜上帝」說明人民擁有宗教自由；(乙)「猶太人基礎條例」富含種族歧視，與啟蒙強調人權與平等的觀念背道而馳；(丙)「廢除刑求、放寬嚴刑峻罰」則含有啟蒙運動重視人權的精神；(丁)擴充軍隊都與啟蒙運動的精神相左。故答案選(C)(甲)(丙)。

    33.解題關鍵就在題幹所言的「自創邦國」、「王加征（稅）」、「非法苦（毒）我，始設新政」等內容。英國在議會中沒有十三州人民代表的情況下，通過對北美殖民地的加徵新稅，使殖民地人民認為此乃暴政，走向追求獨立，最終促使美國的建立，而華盛頓則是帶領美國獨立的領袖，自是會說出這些內容的人物。

    34.本題關鍵在於開赴比利時前線與向沙俄宣戰。1914 年，因塞拉耶佛事件導致第一次世界大戰爆發，德國則對俄、法宣戰，德國為取得與法國作戰的優勢，先攻取比利時，故答案選(C)。(A)克里米亞戰爭，儘管英軍會向沙俄宣戰，卻無須將軍隊開赴比利時前線。(B)德（普）法戰爭爆發時，德意志聯軍並沒有向俄國宣戰。(D) 1939 年 9 月德軍入侵波蘭之前，已與蘇聯簽訂《德蘇互不侵犯條約》，故德軍此時不會準備進攻蘇聯。'
