  page: 1
  stem: 考古學家在西起西班牙、東至西伯利亞這塊大陸中，發現了五十幾件石器時代的雕塑品，女性雕像居多，且多置於重要位置被祭拜，而這類女性塑像也大多具備幾項造型特徵：裸體，強調乳房、肚腹、生殖器等等（右圖）。關於這些發現，我們應如何理解？
  options:
  - label: A
    content: 史前時代的社會結構以母系社會為主
  - label: B
    content: 這應是原始社會對生育力的一種敬仰
  - label: C
    content: 祖靈信仰早在遠古時期就已開始發展
  - label: D
    content: 古代社會以一種肉慾的視角看待女性
