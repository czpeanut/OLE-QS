  stem: 明清時期，《閨範》、《女兒經》、《閨訓千字文》等淺易的讀本成為大量女子接受教育的普及讀物，女教的精神在於「道之以德」、「檢束身心」，教誨女子心甘情願「惟務清貞」。由此可看出當時的女教特別重視女子哪一層面的作為？
  options:
  - label: A
    content: 一技之長
  - label: B
    content: 保住名節
  - label: C
    content: 品學兼優
  - label: D
    content: 相夫教子
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從教導的精神在「道之以德」、「檢束身心」、「惟務清貞」等內容，便可得知當時的女教特別重視清白、貞節等德行，故選(B)。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_2
  section: 1
  number: 2
