  answer_status: verified
  answer_source: answer_key
  explanation: A 國應為英國，1689 年通過《權利法案》，確立了君主立憲的政體；B 國為法國，1789 年法國大革命，頒布了《人權宣言》，申明人類權利的自由與平等；1889 年 C 國（日本）頒布《明治憲法》，乃是日本參考西方理論與德國憲法而頒布的，也讓日本走上了君主立憲的國家；1989 年 D 地區（東歐）以波蘭為首，展開了去共化、民主化的浪潮，使得東歐許多國家紛紛走向自由民主的國度。選項中只有(A)為英國人；(B)(C)(D)都為法國人，故選(A)。
