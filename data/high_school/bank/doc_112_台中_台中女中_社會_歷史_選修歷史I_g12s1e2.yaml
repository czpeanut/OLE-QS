    1689 年，A 國確立了君主立憲政體，宣告對於人權的保障，重申了人民不可置疑的權利和自由應該受到尊重。

    1789 年，B 國於此份文件中，申明人類在權利上自由平等，並由法律規範其界限。

    1889 年，C 國憲法的制訂，證明了出自西方的理論，同樣也能應用於亞洲國家，顯示人權理念的普遍性。

