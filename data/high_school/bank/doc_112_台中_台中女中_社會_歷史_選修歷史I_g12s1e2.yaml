  explanation: '第三波女權運動開始於 1980 年代，其中的內涵除了納入黑人與第三世界女性主義外，同時也提倡酷兒理論，主張性別多樣性與包容差異，認為應該跳脫男與女、同性戀與異性戀等相對的性別觀；並強調性別認同與性取向的多元化。

    45.1868 年日本明治天皇展開明治維新，派遣許多大臣至歐洲考察，回國進行政治改革，於 1889 年頒布《明治憲法》，即參考西方理論與德國憲法而頒布的，也讓日本走上了君主立憲的國家。

    46.根據圖示可看出，甲地區被蘇聯占領，但卻有國家大量空投物資到甲地，而再配合資料一的敘述，便可得知給予大量空投物資的國家為美國，可藉此推測這兩則資料是在敘述柏林危機，因此甲地為柏林。

    47.柏林危機乃是冷戰的局勢下，由於美國與蘇聯兩大陣營在意識型態的對抗下，而造成緊張對峙的局面，故選(C)。

    48.1948 年美國在歐洲推動馬歇爾計畫，在西德區發行新貨幣。蘇聯亦在東德區發行新貨幣，並軍事封鎖西柏林，此事件在美軍空投物資下解決。而當時東柏林與東德皆被蘇聯共產政權控制，因此圖示中的持槍者，便是占領東柏林、封鎖西柏林的蘇聯領導人史達林。'
