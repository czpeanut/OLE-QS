      - 364.7
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 原始的人類社會，往往會出現女神崇拜，著重在女性的生殖能力，而女性的乳房象徵哺育生命，肚腹與生殖器則是象徵著孕育新生命，因此可推測這類女性的塑造與生育力崇拜相關，故選(B)。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 康熙年間編纂的《臺灣府志》、《諸羅縣志》與《鳳山縣志》，在諸多歲時祭儀的記載中，絲毫未見關於媽祖信仰的相關紀錄，但《安平縣雜記》卻指出清代時的媽祖相關慶典動輒數萬人參與。關於上述，我們可以推論出清治時期臺灣媽祖信仰的發展應該是
  options:
  - label: A
    content: 19 世紀後期才受到官方提倡
  - label: B
    content: 因鐵公路的興建而日漸普及
  - label: C
    content: 從臺灣內陸擴散到沿海一帶
  - label: D
    content: 已朝向庶民化與全民化發展
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 清代康熙年間因傳說中媽祖庇護漕運、助施琅率清軍渡臺擊敗鄭氏政權等，而清廷欲藉由提高媽祖的影響力打壓以玄天上帝為守護神的鄭氏政權，故對媽祖進行冊封，加上清治時期許多移民渡海而來，需要媽祖的庇護因而信仰大盛，故選(A)。(B)清領時期臺灣尚未興建公路。(C)媽祖信仰應該是從沿海擴散到內陸。(D)可從題幹看出媽祖信仰的擴大與興盛，但無法判斷是否已向全民化發展。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 日本德仁天皇登基後，與皇后雅子每年分別都要參與「種田日」與「養蠶禮」，親自下田耕作或挑葉養蠶。請問日本天皇與皇后這些舉動背後的意義為何？
  options:
  - label: A
    content: 表示統治者對生產工作的重視
  - label: B
    content: 強調日本是儒家文化的繼承者
  - label: C
    content: 提倡恢復男耕女織的分工秩序
  - label: D
    content: 種田養蠶是日本帝后日常職責
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 傳統社會的經濟生產以耕田與織布為主，而傳統的產業分工便是「男耕女織」，為了祈禱豐收與鼓勵生產，皇帝與皇后往往會主持耕作與祭祀蠶神的儀式，反映出統治者重視糧食生產與蠶桑紡織，並藉由儀式將男女分工的形象傳達天下。因此，日本天皇與皇后參與的這些活動主要的目的應該以鼓勵生產，由於當代日本已非農業社會，而走向工業社會，且社會上性別平權的觀念也已逐漸普及，故不可能是要恢復「男耕女織」的分工，故選(A)。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 中古歐洲的教會在定位聖母的神學地位時，有意識地嘗試去除她身為女性可能會沾染到加諸在夏娃身上的邪惡特質，並刻意稱頌祂陰柔的特質，如謙遜、臣屬與服從等。請問教會此舉目的為何？
  options:
  - label: A
    content: 消弭歧視女性的言論
  - label: B
    content: 強化父權的中心思想
  - label: C
    content: 標榜聖母聖潔的神性
  - label: D
    content: 改變全體女性的形象
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 教會刻意稱頌聖母「謙遜、臣屬與服從」的特質，目的是為了鼓勵信仰基督宗教的婦女，要模仿學習聖母的這些特質，因為這些特質是父權思想下社會期待女性該擁有的內涵。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《聖經．創世紀》：「神就照著自己的形像造人，乃是照著祂的形像造男造女。」4 世紀的神學家聖奧古斯丁說：「男性才有神的形像，女人要憑藉丈夫才有神的形象」。我們應如何正確理解上文？
  options:
  - label: A
    content: 基督教的原始教義已蘊涵男女不平等
  - label: B
    content: 神學家對經學的詮釋完全依歸《聖經》
  - label: C
    content: 女性在教會的職分與權柄完全被剝奪
  - label: D
    content: 教會女性地位的從屬與教義曲解有關
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 《聖經．創世紀》的教義中，可看出男與女都是神按照自己的形象創造的，然而神學家卻解釋只有男人才有神的形象，女性則是居於附屬於丈夫的地位，可知原本的教義並未蘊含不平等，而神學家對《聖經》的解釋也未完全遵從《聖經》內容，故(A)(B)可刪；而(C)女性的職分與權柄是否完全被剝奪無法從題幹中得知。但教會女性地位有可能會因為掌握話語權神學家的解釋而受到影響，因此(D)為正解。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 根據《聖經》記載，耶穌復活和升天時，揀選三位瑪利亞作為最早的見證人；早期基督教的女信徒參加並主持聖餐、祈禱和傳授教義等教會活動；她們甚至是家庭私人教堂的擁有者，傳授福音的主教和贊助人。根據上述，可以推測早期基督教教義的觀念為
  options:
  - label: A
    content: 男女平等
  - label: B
    content: 男主女從
  - label: C
    content: 男女有別
  - label: D
    content: 男內女外
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從耶穌揀選三位瑪利亞作為見證人、女信徒主持教會儀式、讓女信徒傳播宗教，可知女性也可與男性一樣為基督宗教做出貢獻與主持儀式，顯示男女間的關係是較為平等的。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 先蠶禮是中國體制中唯一由皇后主持的儀禮，可是因為過程繁複且辛苦，一般都由官員代理。就唐代的紀錄中，皇后親自主持的先蠶禮僅有八次，武則天一人就包辦了四次，而且完全不依傳統禮制，規模甚大，還有百官陪位。請問武則天此舉的用意為何？
  options:
  - label: A
    content: 宣揚唐朝以農立國，極力推動養蠶繅絲等經濟活動
  - label: B
    content: 藉此強化「男耕女織」的性別分工，落實男女有別
  - label: C
    content: 昭示她是朝廷重要成員，提高女性在祭儀中的地位
  - label: D
    content: 藉由公開場合爭取支持，為往後登上帝位之途鋪路
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 武則天積極的舉辦與主持先蠶禮，且題文提及「就唐代的紀錄中，皇后親自主持的先蠶禮僅有八次，武則天一人就包辦了四次，而且完全不依傳統禮制，規模甚大」，便可知武則天在擔任皇后時已開始干預政治，而先蠶禮得以讓武則天公開表現，讓世人知曉，彰顯武則天的功業，自然也是武則天為掌握或提升權力的手段，故選(D)。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_9
