- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 此書可謂現代女權主義的經典，書中提出「女人不是生成的，而是形成的」，並主張沒有永恆的女性氣質或女人宿命。儘管女人為「與全體人類一樣自由而獨立的存在，卻發現自己在這世界上為男人逼迫，不得不採取『他者』的身分」，因此女人需誠實面對自我，勇敢地做抉擇，努力改變處境，重新定義自己的存在，進而全面參與塑造過去一直由男人所塑造的世界。請問這本書的作者為下列何者？
  options:
  - label: A
    content: 瑪麗．戈茲
  - label: B
    content: 瑪麗．沃斯通克拉夫特
  - label: C
    content: 瑪格麗特．費爾
  - label: D
    content: 西蒙．波娃
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)西蒙．波娃在其著作中，指出男性是能自我定義的主體，女性則是被他人定義的客體，女性被形塑成屈於男性、僅為「次要性別」，因此提倡女性應該要成為能夠自我定義的主體，因此這本書應該為西蒙．波娃所著的經典《第二性》。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_15
