  answer_status: verified
  answer_source: answer_key
  explanation: 清末遭遇西力入侵，國家面臨存亡的危機，加上引進社會達爾文主義的思想，因而知識分子發展出國族主義的思想，若要救亡圖存，則女性也須盡一己之力，便是身為國民之母，要有健康的體魄與足夠的知識方能養育強大的下一代，因此提倡興女學與廢纏足，故選(D)。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 敦慈穿越時空回到某個時代的中國，他看到街道上有人遊行，呼籲「男人殺敵，女人救護」，教育部剛剛公布課程標準，強制規定高中以上學校的女學生必修軍事看護的訓練。請問敦慈穿越到了哪個時代的中國？
  options:
  - label: A
    content: 1920 年代
  - label: B
    content: 1930 年代
  - label: C
    content: 1940 年代
  - label: D
    content: 1950 年代
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B) 1930 年代面臨日本入侵中國東北與華北，因此中國教育部於 1933 年頒行《高級中學軍事看護課程標準》，強制高中以上學校的女學生必須接受軍事看護訓練，隔年更明令將「軍事護理教育」列為高中女生必修學科。
- id: doc_112_台中_台中女中_社會_歷史_選修歷史I_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 艾蜜莉．潘赫克斯特曾多次領導英國婦女，以激進行動進行女權抗爭。但一次大戰爆發時，她暫停所有的示威活動，說服政府讓女性加入職場，使女性成為戰時重要的生產力。她的女權訴求也因此在戰後獲得一定的實現。請問她的主要訴求為何？
  options:
  - label: A
    content: 工作權
  - label: B
    content: 選舉權
  - label: C
    content: 男女平權
  - label: D
    content: 身體自主權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 第一次世界大戰前後，英國的女權運動主要的訴求乃是以選舉權為主，由於戰時女性在後方的表現，展現的女性能力也提升女性地位，因而在戰後英國女子獲得選舉投票權，故選(B)。
