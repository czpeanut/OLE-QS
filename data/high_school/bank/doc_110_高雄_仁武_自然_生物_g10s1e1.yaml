  stem: 構成生物體體內的主要物質有水、醣類、蛋白質、脂質和核酸，還有少量的礦物質和維生素及無機鹽類。這些物質與生物體的新陳代謝、生長、生殖、適應等生命現象有關。下列有關上述物質的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 核酸是與遺傳有關的重要物質
  - label: B
    content: 脂質是構成細胞膜的主要成分如磷脂質
  - label: C
    content: 細胞内有少量的礦物質和維生素，可提供能量
  - label: D
    content: 生物體內的醣類、脂質、蛋白質、核酸等為含碳的有機物質
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
