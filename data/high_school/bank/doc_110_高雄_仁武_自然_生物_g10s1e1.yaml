- id: doc_110_高雄_仁武_自然_生物_g10s1e1_s3_41
  section: 3
  number: 41
  type: single
  page: 6
  stem: 細菌生長於合適的環境時，細胞內大多<u>不會</u>觀察到以下何種構造？
  options:
  - label: A
    content: 細胞質
  - label: B
    content: 質體DNA
  - label: C
    content: 染色體DNA
  - label: D
    content: 核糖體
  - label: E
    content: 內孢子
  group_stem: '◎ 細菌 ─ 原核細胞 地球上充斥著細菌，從大氣頂層到幽暗的海溝，乃至火山口、地底下都找得到細菌的蹤跡，細菌的生物量遠大於動植物生物量的總和。人體更是細菌的大本營，皮膚、消化道、生殖道、泌尿道等與外界接觸的表面上無處不布滿著各式細菌，每天排出的糞便更有接近一半是大腸桿菌，而與我們一同生活的細菌細胞數還是構成身體細胞總和的數倍呢！與我們共生的龐大細菌們絕大多數都是無名英雄，幫助人體抵禦壞菌、供給人體所需的維生素，甚至還有協助訓練免疫系統的神奇功能！
    細菌屬於原核生物的一員，原核細胞最大的特色是缺乏細胞核與狀胞器，細菌細胞可略分為類核區、細胞質、細胞膜、細胞壁，以及不是多數細菌都具有的特殊結構，如鞭毛、莢膜等，以下將逐一介紹細菌的構造。
    圖一、細菌的結構

    基本結構

    *類核區 細菌雖不具備細胞核，但遺傳物質並非散布在整個細胞中，而是聚集成團，稱為類核區。類核區內的遺傳物質是由環狀、頭尾相接的DNA所構成。

    *質體 類核區已包含大部分的遺傳物質，但另有部分遺傳物質由質體所攜帶。質體是較小的環狀DNA，獨立在細胞質中，質體可由環境直接攝入或經其他細菌傳入。質體被認為是細菌致病性與抗藥性的重要來源，也是遺傳工程的重要工具。

    *細胞質 細菌無膜狀胞器，因此凝膠狀的細胞質是發生所有生命反應的重要場所。漂浮在細胞質中的除了各類小分子、質體外，還有細菌唯一的胞器 ─ 核糖體，是合成蛋白質的重要構造。

    *細胞膜 細胞膜是細菌細胞與外界的主要屏障，由磷脂（脂雙層）組成，鑲嵌許多蛋白質，可控制物質進出，但不含真核生物細胞膜常見的固醇類。有時細菌細胞膜會暫時內陷創造小隔間，以利化學反應進行。

    *細胞壁 由肽聚糖構成的堅韌細胞壁可讓細菌抵抗外在滲透度改變所造成的影響，並保護細胞免於物理性傷害，但非全部細菌皆有，如行胞內寄生的黴漿菌便無細胞壁構造。
