    *鞭毛 鞭毛是細菌的運動構造，由細胞膜延生出，可有一至多條，細菌鞭毛在結構、組成分子、驅動能源和運動模式皆和真核生物不同。

    *線毛 線毛比鞭毛更加微細，它並不是運動構造，而是用來協助細菌固著在物體表面，一個細菌的線毛可多達上千條。另有一特別的線毛稱為性線毛，是細菌間傳遞遺傳物質（如質體）所需。

