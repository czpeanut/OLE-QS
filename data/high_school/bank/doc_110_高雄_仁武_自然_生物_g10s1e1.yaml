  - label: A
    content: 大雄：一切生物，從單細胞生物到高等動物、植物，都是由細胞構成
  - label: B
    content: <u>胖虎</u>：細胞是生物體的形態、結構、功能的基本單位
  - label: C
    content: <u>小夫</u>：新細胞是藉著先前存在的細胞分裂而來的
  - label: D
    content: <u>靜香</u>：凡是細胞都具有細胞核、細胞質和細胞膜等基本構造
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
