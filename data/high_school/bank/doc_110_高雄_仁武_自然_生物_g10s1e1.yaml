    *細胞膜 細胞膜是細菌細胞與外界的主要屏障，由磷脂（脂雙層）組成，鑲嵌許多蛋白質，可控制物質進出，但不含真核生物細胞膜常見的固醇類。有時細菌細胞膜會暫時內陷創造小隔間，以利化學反應進行。

    *細胞壁 由肽聚糖構成的堅韌細胞壁可讓細菌抵抗外在滲透度改變所造成的影響，並保護細胞免於物理性傷害，但非全部細菌皆有，如行胞內寄生的黴漿菌便無細胞壁構造。
    細胞壁是分類革蘭氏陽性菌與革蘭氏陰性菌的重要依據，這兩類細菌對抗生素的反應明顯不同，故在醫療上可快速分類細菌的革蘭氏染色法有重要價值。革蘭氏陽性菌的細胞壁肽聚糖較厚，在染色中可緊緊吸附第一次染上的結晶紫染料不被脫色，故呈現紫色；革氏陰性菌的細胞壁肽聚糖層較薄，且在肽聚糖層外尚有一層磷脂外膜，外表較為平滑，在染色中會被酒精脫去第一次染上的結晶紫，故呈現第二次染番紅的紅色。

    特殊結構

    *鞭毛 鞭毛是細菌的運動構造，由細胞膜延生出，可有一至多條，細菌鞭毛在結構、組成分子、驅動能源和運動模式皆和真核生物不同。

    *線毛 線毛比鞭毛更加微細，它並不是運動構造，而是用來協助細菌固著在物體表面，一個細菌的線毛可多達上千條。另有一特別的線毛稱為性線毛，是細菌間傳遞遺傳物質（如質體）所需。

    *莢膜 有的細菌在細胞壁外還有一莢膜，莢膜是由多醣類組成，能保護細胞壁免於溶菌酶的分解，或抵抗吞噬性免疫細胞的吞噬，因此具有莢膜的細菌致病性也較強。

    *內孢子 芽孢桿菌屬（如炭疽桿菌）和梭菌屬（如肉毒桿菌）等細菌在遭遇惡劣環境時，會在內部形成內孢子並進入休眠期，可長期等待環境好轉再行萌發。内孢子是具有多層厚壁的高度濃縮構造，對於熱、酸鹼、滲透度、有毒物質甚至輻射都有極高的耐受性，只能以高溫高壓來消除內孢子，才能徹底滅菌。'
