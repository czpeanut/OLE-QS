- id: doc_108_高雄_小港_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 香山國是一個民主國家，該國某政治評論員談論其國會選舉時說道：「近年政治人物為求勝選，已經劃分成壁壘分明的兩大陣營，掌握了各種資源、人脈，小黨、第三勢力根本沒有生存空間，……雖然兩大陣營用激烈的言詞互相攻防，激化選民對立，但如果冷靜去看，就會發現兩大陣營的政策主張其實大同小異，因為不論是哪一邊，都希望立場向人數最多的中間選民靠攏，以掌握最多的選票、順利當選。我認為該是改變的時候了？如果能讓選舉制度改成……，相信前述問題將能有所改善。」請問：這位評論員所提的國會選舉改變，應該是下列何者？
  options:
  - label: A
    content: 單一選區相對多數決制改成比例代表制
  - label: B
    content: 比例代表制改成複數選區相對多數決制
  - label: C
    content: 比例代表制改成單一選區相對多數決制
  - label: D
    content: 複數選區相對多數決制改成單一選區相對多數決制
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_108_高雄_小港_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 甲國國內有許多政黨蓬勃發展，每個政黨都各有擁護者，也都能在國會選舉時獲得一定的席次。不過，這種情形也使得甲國不時出現「政府難產」的問題，或是政府好不容易組成了，沒過多久卻又因為幾個政黨之間出現歧見而必須解散重組。若從上文推斷，甲國應該是採取什麼樣的政府體制及國會選舉制度？
  options:
  - label: A
    content: 內閣制及比例代表制
  - label: B
    content: 總統制及比例代表制
  - label: C
    content: 內閤制及單一選區相對多數決制
  - label: D
    content: 總統制及單一選區相對多數決制
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
