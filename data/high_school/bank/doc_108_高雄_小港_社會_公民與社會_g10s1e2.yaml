- id: doc_108_高雄_小港_社會_公民與社會_g10s1e2_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 一位民初的政治領袖以教育事項為例，解釋我國中央政府與地方政府權限劃分的概念。他寫道：「權之性質，不當以中央或地方為對象，而當以權之性質為對象。例如軍事外交，宜統一不宜分歧，此權之宜屬於中央者也。教育、衛生，隨地方情況而異，此權之宜屬於地方者也。更分析以言，……同一教育也，濱海之區，宣重水產，山谷之地宜側重礦業或林業，是故宜予以地方措施之自由；然學制，義務教育年限，中央不能不為劃一範圍，是中央亦不能不過問教育事業矣。」從上述內容可知，就教育事項而言，我國中央政府及地方政府的權責分配，下列敘述何者正確？
  options:
  - label: A
    content: 由中央政府就全國統一事權，興辦各級學校
  - label: B
    content: 由地方政府依民情需要規劃及安排升學管道
  - label: C
    content: 中央執掌升學制度，學習內容則由地方規劃
  - label: D
    content: 由中央問查民意後，交由地方政府規劃辦理
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
