  stem: 有4位同學於公民課結束後，討論總統制與內閣制的優缺點比較。請問：何人的發言內容為總統制的優點？ 小清：元首與議員有固定任期，政府與國會相對較穩定。 橘子：總統與議員都有民意基礎，意見對立將不易化解。 吉岡：國會具有倒閣權、內閣具有解散權，可化解僵局。 小紫：聯合內閣執政不易，頻繁倒閣會導致政局不穩定。
