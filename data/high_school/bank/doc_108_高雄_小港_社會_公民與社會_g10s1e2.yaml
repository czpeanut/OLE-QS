  stem: 有許多專業而優秀的立法委員，因為不願隨媒體起舞，反而缺少曝光機會，在現有選舉制度之下造成劣幣驅逐良幣的現象，優秀努力的人反而輸掉選舉。因此我國選舉制度有「不分區立委」這一項設計，讓政黨可以推薦專業立委進入國會。「不分區立委」的席次是依何種方式分配？
