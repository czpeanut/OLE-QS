  - label: D
    content: 共同辦理事項
  group_stem: 臺灣燈會屬於交通部觀光局負責的工作，過去都由其主辦，地點在臺北市；2001年起為了平衡縣市發展，轉而交付全國各縣市輪流辦理，成為全國性的國家級活動；2008年又改為評選制，各縣市政府可以提出計畫向中央爭取主辦權，獲選者可籍著舉辦燈會吸引觀光人潮、凸顯地方風土民情及知名度。 2019年，屏東縣政府獲選承辦第30屆臺灣燈會，這次主燈為屏東在地特色黑鮪魚，跳脫以往以生肖為主的設計；而另一款以寺廟的光明燈為發想，由空酒瓶和LED燈組成的「恆春風巢」，則是屏東在地藝術家和丹麥藝術家共同創作的成果。由於花燈形式新穎，富有多元化、國際化的元素，頗受國人及外界好評。 因燈會會場地處海邊，為使民眾能順利抵達燈會會場，屏束縣政府調派400餘臺接駁車，從火車站、高鐵站及周邊停車場等接送民眾往返；同時也與交通部商擬對策，由交通部高速公路局配合進行國道管制，僅供接駁車、客運行駛，以舒緩交通。此外，屏東縣政府也動員6千多位志工每天輪值巡視，協助展場維持秩序及清潔。最終這場燈會共吸引1,300萬人次參觀，可說是相當成功。請問：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
