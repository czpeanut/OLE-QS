  section: 1
  number: 11
  type: single
  page: 2
  stem: 為整合行政資源、平衡區域發展，我國自2009年修定《地方制度法》，增訂縣市合併改制為直轄市的法源。請問：高雄縣、市合併後，下列何種變化為真？
