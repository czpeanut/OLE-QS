    content: 國會若想再度通過被總統否決的法案，需取得國會特別多數同意
  - label: C
    content: 若是國會通過的法律案被總統否決，國會可以提案罷免總統
  - label: D
    content: 若是國會通過的法律案被總統否決，國會可以對總統提不信任案
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
