  group_stem: 臺灣2020年的總統大選，也是首投族小民參加的第一次選舉，為了選出理想的候選人，小民相當積極觀看各家報導以了解政府的運作及參選人的立場。小民根據報導內容做了以下資料整理： 資料一：報導可以看見立法機關質詢行政部門的畫面，行政首長若政策失敗也常因而辭職下臺，再由總統再任命新的行政院長，且立法委員不可以兼任行政官員。 資料二：A候選人提出若當選總統，推出「總統可兼閣揆」的制度，總統也必須負責，B候選人則提出，若未來當選總統，可推行臺灣「立委可兼內閣」的制度。 資料三：「《憲法》之修改，須經立法院立委1/4提議，3/4出席，及出席委員3/4決議提出修正案，並於公告半年後，經選舉人投票複決，有效同意票過選舉人總額之半數，即通過之。」門檻相當高，因此也有人認為修憲在短時間內都只是話題，不具可行性。請問：
