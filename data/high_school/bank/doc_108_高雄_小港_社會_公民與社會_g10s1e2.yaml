- id: doc_108_高雄_小港_社會_公民與社會_g10s1e2_s2_37
  section: 2
  number: 37
  type: single
  page: 5
  stem: 請問：魚池鄉公所及魚池鄉民代表會，兩者之間的關係為何？
  options:
  - label: A
    content: 鄉公所隸屬於鄉民代表會
  - label: B
    content: 鄉民代表會隸屬於鄉公所
  - label: C
    content: 兩者屬於南投縣政府底下的平行單位
  - label: D
    content: 兩者屬於水平分權，相互監督、制衡
  group_stem: 2018年6月，行政院原住民族委員會公告邵族傳統領域，幾乎涵蓋整個南投縣魚池鄉，引發地方反彈。魚池鄉民代表會認為：全鄉將近16,000人，邵族只有300多人，不到0.2％，當年卻被納入平地原住民鄉，現在又被劃定成邵族傳統領域，以後鄉裡的工程即使獲得大部分鄉民支持，仍可能遭到邵族否決，恐有漠視漢人權益、阻礙全鄉發展之嫌；對此，魚池鄉公所也在同年12月向鄉代會提案「退出平地原住民鄉」。 原民會則表示：歷史上，當地在引入土地產權制度之前就是邵族的生活領域，是後來經過一連串的外來「開發」，才造成邵族失去土地，這次劃設後，部落的諮商同意權只適用於重大開發案，且還有協商機制，一般私有地則不受影響，應不至於造成嚴重衝擊。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
