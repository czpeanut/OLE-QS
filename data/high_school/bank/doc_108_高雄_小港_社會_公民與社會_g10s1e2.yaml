  section: 1
  number: 22
  type: single
  page: 3
  stem: 臺灣民主國是1895年短暫存在於臺灣的共和制政權，亦稱為福爾摩沙共和國。並於同年5月24日由陳季同起草《臺灣民主國宣言》，宣合內容主要為：「……臺灣同胞，誓不服倭，與其事敵，寧願戰死。爰經大會議決，臺灣自立，改建民主國；官吏皆由民選，一切政務秉公處理。但為禦敵及推行新政，必須有一元首，俾便統率，以維持秩序而保安寧。巡撫承宣布政使唐景崧為萬民所敬仰，故由大會公推為臺灣民主國大總統。」請問：就該宣言內容，臺灣民主國傾向何種政府體制？
  options:
  - label: A
    content: 內閣制
  - label: B
    content: 總統制
  - label: C
    content: 混合制
  - label: D
    content: 委員制
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
