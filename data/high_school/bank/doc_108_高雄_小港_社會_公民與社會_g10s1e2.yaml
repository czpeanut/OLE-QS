  section: 1
  number: 15
  type: single
  page: 2
  stem: 於2019年10月初開始，智利首都的聖地牙哥捷運局以「國際油價漲價」、「營運成本增加」、「線路擴建與設備更新」為由，宣布調漲捷運的尖峰時刻票價。消息一出，大批學生團體·勞工團體群起抗議，並自10月中旬起，不斷針對各線捷運發動佔領示威。就統治正當性來看，有關調漲票價政策的推論何者正確？
