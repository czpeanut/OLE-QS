- id: doc_110_台中_興大附中_數學_數甲_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列哪個函數在 x＝1 處可微？（其中 [ x ] 表示不超過 x 的最大整數）
  options:
  - label: A
    content: $f_{1}$（x）＝[ x ]
  - label: B
    content: $f_{2}$（x）＝$\frac{( x - 1 )^{2}}{| x - 1 |}$
  - label: C
    content: $f_{3}$（x）＝｜x－1｜
  - label: D
    content: $f_{4}$（x）＝x（x－1）
  - label: E
    content: $f_{5}$（x）＝x [ x ]
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$f_{1}$（x）＝[ x ] 在 x＝1 不連續$\Rightarrow$不可微

    (B)╳：$f_{2}$（x）在 x＝1 無定義，則必不可微

    (C)╳：$\lim_{x \rightarrow 1^{+}} \frac{f_{3} ( x )- f_{3} ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{x - 1}{x - 1}$＝1，

    $\lim_{x \rightarrow 1^{-}} \frac{f_{3} ( x )- f_{3} ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{-( x - 1 )}{x - 1}$＝－1，不相等，則不可微

    (D)○：$f_{4}$（x）＝x（x－1）＝$x^{2}$－x

    $f_{4}$''（x）＝2x－1，可微

    (E)╳：$\lim_{x \rightarrow 1^{+}} \frac{f_{5} ( x )- f_{5} ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{x - 1}{x - 1}$＝1

    $\lim_{x \rightarrow 1^{-}} \frac{f_{5} ( x )- f_{5} ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{0 - 1}{x - 1}$不存在

    則不可微

    故選(D)'
