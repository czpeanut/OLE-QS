- id: doc_110_台中_興大附中_數學_數甲_g12s1e2_s3_1
  section: 3
  number: 1
  type: fill
  page: 2
  stem: 若函數 f（x）＝$\sqrt{2x - x^{2}}$的最大值為 M，最小值為 m，求 M＋m＝＿＿＿＿。
  answer:
  - '1'
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$\sqrt{2x -x^{2}}$＝$\sqrt{-( x - 1 )^{2}+1}$

    又 2x－$x^{2}\geq$0$\Rightarrow$x（x－2）$\leq$0$\Rightarrow$0$\leq$x$\leq$2

    當 x＝1 時，f（x）有最大值 M＝1

    當 x＝2 或 0 時，f（x）有最小值 m＝0

    故 M＋m＝1'
