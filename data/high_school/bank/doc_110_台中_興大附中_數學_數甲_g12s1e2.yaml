- id: doc_110_台中_興大附中_數學_數甲_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 若方程式 $2x^{3}$－$3x^{2}$－12x＋（5－k）＝0 有兩相異負根與一正根，則實數 k 的範圍為下列哪一個選項？
  options:
  - label: A
    content: －15＜k＜12
  - label: B
    content: 5＜k＜12
  - label: C
    content: 0＜k＜12
  - label: D
    content: －12＜k＜15
  - label: E
    content: －12＜k＜5
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '若 f（x）＝$2x^{3}$－$3x^{2}$－12x＋（5－k）＝0 有兩相異負根與一正根

    則波峰和波谷的 y 值異號且 f(0)＜0

    f''（x）＝$6x^{2}$－6x－12＝6（x－2）（x＋1）

    當 x＝－1 或 2 時，f''（x）＝0

    則$\begin{cases}f ( -1 )f ( 2 )< 0 \\ f ( 0 )< 0\end{cases}\Rightarrow\begin{cases}( 12 -k ) ( -15 -k )< 0 \\ 5 -k < 0\end{cases}$

    $\Rightarrow\begin{cases}( k - 12 ) ( k + 15 )< 0 \\ k > 5\end{cases}\Rightarrow\begin{cases}-15 < k < 12 \\ k > 5\end{cases}$

    $\Rightarrow$5＜k＜12

    故選(B)'
- id: doc_110_台中_興大附中_數學_數甲_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知 0＜a＜2，若$\int_{0}^{1} | 3x - a |dx$＝$\frac{5}{6}$，則 a 的值為下列哪一個選項？
  options:
  - label: A
    content: '1'
  - label: B
    content: $\frac{1}{2}$
  - label: C
    content: $\frac{5}{6}$
  - label: D
    content: $\frac{1}{3}$
  - label: E
    content: $\frac{5}{4}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{0}^{1} | 3x -a |dx$＝$\int_{0}^{\frac{a}{3}} | 3x -a |dx$＋$\int_{\frac{a}{3}}^{1} | 3x -a |dx$＝$\int_{0}^{\frac{a}{3}} ( a - 3x )dx$＋$\int_{\frac{a}{3}}^{1} ( 3x -a )dx$

    ＝$\left. \left( ax -\frac{3}{2}x^{2} \right) \right| _{0}^{\frac{a}{3}}$＋$\left. \left( \frac{3}{2}x^{2}-ax \right) \right| _{\frac{a}{3}}^{1}$

    ＝$\left( \frac{a^{2}}{3}-\frac{a^{2}}{6} \right) + \left[ \left( \frac{3}{2}-a \right) - \left( \frac{a^{2}}{6}-\frac{a^{2}}{3} \right) \right]$

    ＝$\frac{a^{2}}{6}$＋$\left( \frac{3}{2}-a +\frac{a^{2}}{6} \right)$＝$\frac{a^{2}}{3}$－a＋$\frac{3}{2}$＝$\frac{5}{6}$

    $\Rightarrow2a^{2}$－6a＋4＝0$\Rightarrowa^{2}$－3a＋2＝0$\Rightarrow$（a－2）（a－1）＝0

    ∵0＜a＜2 ∴a＝1

    故選(A)'
- id: doc_110_台中_興大附中_數學_數甲_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 若三次函數 f（x）＝$2x^{3}$－$\frac{13}{2}x^{2}$＋6x＋$\frac{1}{2}$，則下列哪個選項為此函數的切線方程式？
  options:
  - label: A
    content: 3x＋2y＝0
  - label: B
    content: 2x＋3y＝0
  - label: C
    content: x＋y＝3
  - label: D
    content: x＋y＝2
  - label: E
    content: x＋y＝－1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$6x^{2}$－13x＋6，令切點為（a，f（a））

    (A) $6a^{2}$－13a＋6＝$-\frac{3}{2}$

    $\Rightarrow12a^{2}$－26a＋15＝0 無實根

    故 f（x）圖形上不存在斜率為$-\frac{3}{2}$之切線

    (B) $6a^{2}$－13a＋6＝$-\frac{2}{3}\Rightarrow18a^{2}$－39a＋20＝0$\Rightarrow$（3a－4）（6a－5）＝0$\Rightarrow$a＝$\frac{4}{3}$或$\frac{5}{6}$

    故切點為$\left( \frac{4}{3} , \frac{91}{54} \right)$或$\left( \frac{5}{6} , \frac{463}{216} \right)$，和（0，0）之直線斜率皆不為$-\frac{2}{3}$

    (C)(D)(E) $6a^{2}$－13a＋6＝－1$\Rightarrow6a^{2}$－13a＋7＝0$\Rightarrow$（6a－7）（a－1）＝0$\Rightarrow$a＝$\frac{7}{6}$或 1

    當 a＝$\frac{7}{6}$，切點為$\left( \frac{7}{6} , \frac{395}{216} \right)$，與選項不符合

    當 a＝1，切點為（1，2），故切線方程式為 x＋y＝3

    故選(C)'
