- id: doc_110_台中_興大附中_數學_數甲_g12s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設 k 為實數，則關於函數 f（x）＝$x^{3}$－$3x^{2}$＋5x＋k 的圖形，請選出正確的選項。
  options:
  - label: A
    content: 圖形與任一水平直線恰有一交點
  - label: B
    content: 圖形有水平切線
  - label: C
    content: 若（p，q）在圖形上，則（2－p，6－q＋2k）也在圖形上
    asset:
      key: s2_2_optC
      file: doc_110_台中_興大附中_數學_數甲_g12s1e2/s2_2_optC.png
      crop:
        page: 2
        rect:
        - 435.9
        - 358.45
        - 564.3
        - 488.85
  - label: D
    content: 圖形有最高點，也有最低點
  - label: E
    content: 函數 f（x）在 x＝0 附近的一次近似為 y＝5x＋k
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵f''（x）＝$3x^{2}$－6x＋5 恆大於 0

    ∴y＝f（x）的圖形和任一水平線恰有一交點

    (B)╳：同(A)，故無水平切線

    (C)○：f（x）＝（$x^{3}$－$3x^{2}$＋3x－1）＋2x＋k＋1

    ＝（x－1）$^{3}$＋2（x－1）＋k＋3

    可知對稱中心在（1，k＋3）

    若（p，q）在圖形上，則對稱點（2－p，6－q＋2k）亦在圖形上

    (D)╳：同(A)，故無最高、最低點

    (E)○：∵f（x）＝（x－0）$^{3}$－3（x－0）$^{2}$＋5（x－0）＋k

    ∴可知在 x＝0 附近之一次近似為 y＝5x＋k

    故選(A)(C)(E)'
