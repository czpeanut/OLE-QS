  stem: 將一銅線放入裝有硝酸銀溶液的燒杯中，杯口以塑膠膜封住後，靜置一天。試問下列有關此實驗之敘述，哪一個選項是正確的？
  options:
  - label: A
    content: 銅線為氯化劑
  - label: B
    content: 溶液顏色逐漸變透明
  - label: C
    content: 銀離子為還原劑
  - label: D
    content: 溶液中液體的質量逐漸減少
  - label: E
    content: 反應方程式為 Ag $^{+}$＋Cu → $Cu^{2＋}$＋Ag
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為還原劑；(B)變藍色；(C)為氧化劑；(D)$Ag^{+}$ 析出變成Ag，Cu變成$Cu^{2+}$，原子量Ag>Cu，∴變輕，正確；(E) Cu+ $Ag^{+ }$→ $Cu^{2+}$ +Ag。故選(D)。
