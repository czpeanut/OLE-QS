  page: 1
  stem: 對某一濃度為0.01 M的未知水溶液進行測試，觀察到下列現象： (1)此溶液具有極佳導電性。 (2)此溶液的pH值大於純水。 (3)此溶液通入二氧化碳，會產生白色沉澱，持續通入二氧化碳，則沉澱會溶解。 此水溶液最可能含有下列何種物質？
  options:
  - label: A
    content: 氫氧化鈉
  - label: B
    content: 氯化鈣
  - label: C
    content: 蔗糖
  - label: D
    content: 氨水
  - label: E
    content: 氫氧化鈣
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (1)導電性 ∴是電解質；(2) pH>7 ∴為鹼性；(3)通入二氧化碳產生沉澱為碳酸鈣，再通入二氧化碳沉澱消失為碳酸氫鈣 ∴此物推測為氫氧化鈣。故選(E)。
