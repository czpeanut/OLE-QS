  stem: 水是人類及其他生物賴以生存的重要資源，影響民生工業甚巨。下列有關水質淨化的敘述，何者正確？
  options:
  - label: A
    content: 通氧氣是最常用的消毒方法，可用以消除水中細菌
  - label: B
    content: 活性碳可以有效吸附水中的有機雜質及金屬離子
  - label: C
    content: 曝氣作用是為了增加水中含氯量，加速微生物分解水中有機物質
  - label: D
    content: 凝聚法是在水中加人明礬等凝聚劑，吸附水中顆粒較小懸浮物質
  - label: E
    content: 含鈣或鎂離子的硬水，通過ROH離子樹脂的管柱時，能進行離子交換使水質軟化
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)水的消毒通常用臭氧或氯氣；(B)利用活性碳表面的孔洞，將具有不良氣味及顏色的有機物，吸附於孔洞中；(C)曝氣是增加水中溶氧；(D)正確；(E)通過RH離子樹脂管柱。故選(D)。
