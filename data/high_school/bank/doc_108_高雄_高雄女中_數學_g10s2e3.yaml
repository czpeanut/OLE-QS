    content: x＞4
  - label: B
    content: x ≤ －2
  - label: C
    content: x＝3
  - label: D
    content: ｜x｜＞2
  - label: E
    content: x≠1
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：x＞4 即可確保 $x^{2}$＞4

    (B) ╳：x＝－2 時，x ≤ －2

    但 $x^{2}$＞4 不成立

    (C) ○：x＝3 即可確保 $x^{2}$＞4

    (D) ○：｜x｜＞2 即可確保 $x^{2}$＞4

    (E) ╳：x＝0 時，x≠1

    但 $x^{2}$＞4 不成立

    故選(A)(C)(D)'
