  stem: A＝｛x｜1 ≤ x ≤ 7｝，B＝｛x｜－3＜x＜5，x ∈ Z｝，則下列哪些敘述正確？
  options:
  - label: A
    content: A＝｛x｜$x^{2}$－8x＋7 ≤ 0｝
  - label: B
    content: 4 ∈ A ∩ B
  - label: C
    content: A ∩ B＝｛x｜1 ≤ x＜5｝
  - label: D
    content: A ∪ B＝｛x｜－3＜x ≤ 7，x ∈ Z｝
  - label: E
    content: n（B－A）＝3
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：｛x｜$x^{2}$－8x＋7 ≤ 0｝＝｛x｜（x－7）（x－1） ≤ 0｝＝｛x｜1 ≤ x ≤ 7｝＝A

    (B) ○：∵4 ∈ A 且 4 ∈ B

    ∴4 ∈ A ∩ B

    (C) ╳：$\frac{7}{2}\in A$但$\frac{7}{2}\notin B$，故$\frac{7}{2}\notin A \cap B$，但$\frac{7}{2}\in ｛x | 1\leq x < 5 ｝$

    故 A∩B≠｛x｜1 ≤ x＜5｝

    (D) ╳：$\frac{13}{2}\in A$，故$\frac{13}{2}\in A \cup B$，但$\frac{13}{2}\notin ｛x | -3 < x\leq 7 , x\in Z ｝$

    ⇒ A∪B≠｛x｜－3＜x ≤ 7，x ∈ Z｝

    (E) ○：B－A＝｛－2，－1，0｝，故 n（B－A）＝3

    故選(A)(B)(E)'
