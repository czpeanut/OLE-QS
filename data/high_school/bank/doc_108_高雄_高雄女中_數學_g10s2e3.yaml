    content: 某團體有男性 20 人、女性 16 人，參加某館場時，館方請該團體成員倆倆並排驗票入場，則共有$C_{20}^{36}$種排法
  - label: B
    content: 平面上 7 條相異的直線，最多可有$C_{2}^{7}$個交點
  - label: C
    content: 今有 4 男 4 女排成一列，男女相間的排法有$4 ！\times C_{3}^{4}\times 4 ！$種
  - label: D
    content: 今有 6 對夫婦共 12 人，由其中任選 5 人，恰有一對夫妻的方法有$C_{1}^{6}\times C_{3}^{10}$種
  - label: E
    content: 將 10 件相異的禮品分成三堆，其中一堆有 4 件，另兩堆各 3 件，共有$\frac{C_{4}^{10}C_{3}^{6}C_{3}^{3}}{2}$種方法
  answer:
