  answer_source: answer_key
  explanation: '（1，1，2），有$\frac{3 ！}{2 ！}=3$（種）

    P（點數和為 4）＝$\frac{3}{6^{3}}$

    點數和為 17：（5，6，6），有$\frac{3 ！}{2 ！}=3$（種）

    P（點數和為 17）＝$\frac{3}{6^{3}}$

    故「點數和為 4」的機率等於「點數和為 17」的機率

    故選(C)(D)

    4.(A) ╳：共 36 人，應為$C_{2}^{36}C_{2}^{34}\ldots \ldots C_{2}^{2}$

    (B) ○：當 7 條皆不互相平行，且任意 3 條不共點時，有$C_{2}^{7}$個交點

    (C) ╳：有<u> 2 </u>×4！×4！種排法

    男女男……

    女男女……

    (D) ╳：應為$C_{1}^{6}\times C_{3}^{5}\times 2^{3}$種

    (E) ○：共有$C_{4}^{10}\times C_{3}^{6}\times C_{3}^{3}\times \frac{1}{2 ！}$種方法

    故選(B)(E)'
