  stem: 文人畫的風氣，以寄情託志的寫意畫為主要表現方式。江南文人本追求「學而優則仕」，但卻因政府國策打壓，畫作多呈現消極避世思想，題材多為象徵清高堅貞人格精神的梅、蘭、竹、菊、松、石等，最能展現文人胸中之「逸氣」。閱讀上述，可知文人畫之高峰且逐漸成主流，可能與朝廷何項政策相關？
