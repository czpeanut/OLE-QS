  stem: 中國某一朝代的帝王實行「重文輕武」的政策，設立「翰林畫院」獎勵學畫，加上這個朝代的帝王又多喜藝術，甚至多有鑽研造詣。許多原先供職於南唐、西蜀及梁各朝朝廷的畫家，都紛紛加入畫院。當時在民間方面，由於連年戰亂災難，許多文人士大夫將精神寄託於詩文繪畫，把它們當成高雅的娛樂手段，加上國家統一之後，都市繁榮造成了社會對繪畫作品的大量需求，因此許多民間畫家競相出賣繪畫作品，謀求生計。請問，上述這個朝代，最可能是中國歷史上的哪一朝？
