  stem: 許多學者認為伊波拉病毒、禽流感、新冠肺炎等這些對人類危害嚴重的疾病是源自於人類對於環境的恣意破壞所致。學者指出，氣候暖化讓病毒更為多樣而具致命性，更糟的是，氣候暖化不斷威脅人類的糧食生產與保存，疫情的擴散更會進一步限制了人類的糧食生產與交易，如果人類再不深刻反省並拿出實際作為，難保毀滅性的危機不會發生。請問這則資料主旨為何？
