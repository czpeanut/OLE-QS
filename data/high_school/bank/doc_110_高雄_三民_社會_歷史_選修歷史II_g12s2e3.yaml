  stem: 從定義上來看，資源與環境的永續發展指的是為保持或延長資源的生產使用性和資源基礎的完整性，使自然資源能夠永遠為人類所利用，不會因耗竭而影響後代人類的生產與生活。請問關於永續發展觀念的歷史描述何者正確？
