  stem: 某一種作物，它藉由哥倫布大交換傳入歐洲，普魯士、法國等國家都曾在十八世紀透過國家力量推行種植。它更改變了愛蘭人的飲食內容，同時也是導致十八世紀某場大饑荒的原因之一。十九世紀暢銷食譜<u>持家之書</u>對此作物有如此評論：「這個有價值的食品，僅次於小麥，在政治經濟學家眼中具有極端的重要性。沒有其他作物可以像它，為大眾帶來這麼多益處。據信，一英畝的□□田，可比同面積的小麥田餵飽兩倍多的人口。」根據題幹所述，請問此作物應該為下列何者?
