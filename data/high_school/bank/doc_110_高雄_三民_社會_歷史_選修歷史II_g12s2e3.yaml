  stem: 十九世紀時，煤是主要的能源來源，後來石油取代煤為主要能源，但煤仍然繼續被應用在能源設施發電上。二十世紀後，隨著油價高漲，生質柴油（從植物及動物脂肪提煉)、頁岩油、天然氣、太陽能、核能，甚至風力發電等各種新能源陸續開發，能源議題不再單獨聚焦於石油，反而是如何保護地球環境，達成潔淨能源的永續目標。第三次石油危機因於1990年波斯灣戰爭爆發，石油價格在3個月内從每桶14美元漲到40美元，但這次危機對世界經濟的影響要比前兩次石油危機來的小。石油危機讓許多專家學者開始擔心當石油用盡時，人類文明將面臨重大危機。根據你對於上述資料的解讀，請問下列敘何者正確？
