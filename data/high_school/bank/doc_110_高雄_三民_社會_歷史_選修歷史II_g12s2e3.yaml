  stem: 埃及神話中，□□象徵拯救者，蛇則代表死亡與疾病。相傳太陽神的船是由死者幽魂相伴，在行經陰間時，毒蛇阻止太陽神飲用船下的水，但□□現身並斬下蛇首，埃及人得以再重見天日。□□在西元前7500年已馴化成功，為埃及人所馴養，象徵著太陽、生育與守護。當時的法律規定，將□□帶出境將會被處以死刑。□□去世後，主人們會將眉手剃掉以示悼念，但主人離世、□□就要被毒死或勒死做成木乃伊。請問□□為何?
