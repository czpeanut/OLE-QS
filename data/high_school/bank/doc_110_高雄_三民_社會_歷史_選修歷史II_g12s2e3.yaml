  stem: 以下兩則為關於石油與環境之報導資料，請選出正確的選項。報導一：2010年4月20日墨西灣的鑽油平臺發生爆炸，導致數十人死傷，大量的石油外漏，導致兩千平方里的海水遭到石油覆蓋，水質受到汙染。棲息於當地的鳥類、魚類受到影響，嚴重危害海洋生態。報導二：1987年中油公司決議於高雄增設第五輕裂解廠，引起當地居民極力反對，甚至成立「反五輕自力救濟會」，積極到環境保護局、市議會與立法院陳情抗議。最終政府妥協，提供居民回饋金，並承諾25後遷廠。現今煉油廠内已拆除十多座工廠，預計2026年全數拆除。
