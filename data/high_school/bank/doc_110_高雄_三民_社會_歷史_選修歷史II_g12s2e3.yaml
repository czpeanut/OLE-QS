  stem: 在一個美術館特展中，導覽員如此介绍其中一件作品：這是一個非常特別的時代，藝術家們的繪畫以宗教題材為主，讓信徒們了解經典的教誨。另一方面，這時期的作品風格也更貼近『人』。大家眼前的這件作品以等腰三角形構圖，讓畫面結構看起來穩定，人物的背景也展現出当時盛行的透視法，越遠的景物比例會逐漸缩小」根據上述，導覽員可能正在介紹下列哪位藝術家的作品？
