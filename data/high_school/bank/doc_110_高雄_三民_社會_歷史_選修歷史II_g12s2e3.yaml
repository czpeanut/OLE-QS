  stem: 生物學家羅伯特‧帕關伯格（Robert L Paarlberg）將各國對基因改造食品的政策立場分為四種，根據以下附表，關於這些基因改造分類的描述何者正確？
  options:
  - label: A
    content: 由於基因改造是世界趨勢，故全世界沒有禁止型的國家
  - label: B
    content: 美國因崇尚自由而無須標示，代表限制越多的國家或區城人民越不自由
  - label: C
    content: 澳洲以及臺灣等地不用像預警型受到嚴格管理是因為科技發展足以自己把關
  - label: D
    content: 世界各國對於基因改造的食品信任程度不一，但基因改造仍持續進行
