  stem: 某報導指出:「在過去五十年内，全球的塑膠產量便增加了20多倍，塑膠產量呈現不斷上升的趨勢，意味著製造這些塑膠的碳排放與塑膠產品本身的碳足跡，在這五十年來已增加20倍多。碳排量的顯著增加，也完全貢獻在全球暖化與氣候變上。·····現今製造塑膠所產生的碳足跡(温室氣體效應)已經等同於全球航空業製造的碳足跡。由於製造塑膠對石化企業來說可賺得更多，可以想見在不久的將來，塑膠的大量生產將是造成氣候變遷的主要原因。」關於石化產品過度使用所造成的問題，下列敘述何者正確？
