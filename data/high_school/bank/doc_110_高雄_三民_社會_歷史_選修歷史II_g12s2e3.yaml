  - label: A
    content: 二十世紀的石油危機對世界經濟的影響並不嚴重
  - label: B
    content: 煤在石油出現後，便不再被人類利用
  - label: C
    content: 目前尚未找到任何新型能源
  - label: D
    content: 二十世紀後環保意識抬頭，人類開始思考研究如何有效利用潔淨能源
