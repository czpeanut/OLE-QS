  - label: A
    content: 自然反撲正在威脅現代文明
  - label: B
    content: 人類科技持續成長才能對抗疫情
  - label: C
    content: 科學萬能且文明無限
  - label: D
    content: 自然界自癒的能力趕不上人為的破壞
