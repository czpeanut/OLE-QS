  stem: 根據上述兩段资料的敘述可知，萬神殿作為西元二世紀的建築，其頂部有一圆形大洞作為唯一採光點，建築內部神聖莊嚴：同時也因為支撐巨大穹頂的結構力學，而成為古不朽的建築。當時取名為「萬神殿」，意為崇敬希臘與羅馬諸神，希望得到眾神的祝福，讓帝國維持強盛。但到了十七世紀，教宗烏爾巴諾八世下令移出建築物內部神像、拆下天花板，又將外部增加了雙鐘樓。關於此轉變，我們可以如何解讀？
