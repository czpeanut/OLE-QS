- id: doc_110_高雄_三民_社會_歷史_選修歷史II_g12s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 二十世紀綠色革命的成功讓科學家開始意識到在地品種消失的隱憂，擔心作物的多樣性減少，將導致糧食安全系統出現危機。二十一紀時，挪威政府獲得聯合國的支持，在北極圈興建一座國際種原庫，裡面保存了全球超過八十多萬種的種子，作為現代糧食的「挪亞方舟」，希望能應對候變遷、自然災害、核彈爆炸等，預防一旦發生世界性大災難時，人類可以使用這些種子重新播種、恢復糧食的供應。請問挪威設置國際種原庫主要的目的是?
  options:
  - label: A
    content: 進行基因改造的研究
  - label: B
    content: 以政府力量來進行種原的保育
  - label: C
    content: 研究如何降低自然災害對農業的危害
  - label: D
    content: 對抗大型育種企業，防止壟斷
- id: doc_110_高雄_三民_社會_歷史_選修歷史II_g12s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 在官方統計資料中，日治之前臺灣並沒有種植粳米，也就是後俗稱蓬萊米的紀錄。日本向來就將粳米作為日常主食，1895年日本來臺後為滿足在臺日人的需求，驅使殖民政府投入研究，最初日人僅能在北部大屯山一帶種植粳米成功，但日方希望能在臺灣大規模推廣種植粳米，以滿足日本殖民政府的需求。後來日本以農業試驗場為中心，開啟現代化品種改良研究與推廣工作，終於在1926年由磯永吉博士研發出適合在臺灣普遍栽種的粳米品種。請問：關於題幹的敘述，下列何者正確？
  options:
  - label: A
    content: 日本在臺研發蓬萊米是為了讓臺灣人能享用粳米
  - label: B
    content: 日本在臺種植梗米是因為臺灣的氣候適合粳米生長
  - label: C
    content: 日本希望臺灣大規模種植梗米是因為粳米適合外銷
  - label: D
    content: 磯永吉研發適合臺灣栽種的粳米符合「育種」定義
