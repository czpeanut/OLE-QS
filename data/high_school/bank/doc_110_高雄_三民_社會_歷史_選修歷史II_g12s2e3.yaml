  - label: A
    content: 宗教建築運用於民眾公共生活
  - label: B
    content: 藝術領域會遭教會權威干預介入
  - label: C
    content: 基督信仰在中世紀後擴張普及
  - label: D
    content: 世俗權威凌駕於精神信仰領域
  group_stem: '◎資料一：(搭配圖一義大利羅馬萬神殿)萬神廟最能表現羅馬古典精神。這座磚、石、混的殿堂建於哈德良時代，至今保存完好。他的主體大略是方形的門廊身整體設計突破傳統羅馬神的格局，影響後世教堂建風格甚大。萬神廟的圓頂並無內部支架，其頂部圓形開口尤為天才巧思，它使大廳具有自然均勻的採光，令人置身其中備感神聖崇高。萬神廟興建之時正值羅馬人宗教情緒昂揚、而東方宗教在羅馬興盛之際，它的建造含有振興羅馬傳統信仰與固有價值觀的用意。
    自七世紀開始長期被用作基督教教堂，當羅馬文明的物質性太強而精神內涵過於當羅馬的軍政與經濟勢力衰微，不再能支士氣民心時，思考生命意義的而生，而在此时強超越性一神信的基督教後來上，取代重視因果報應與切東方宗教。【資料源:王世宗，<u>歷史與圖像：文明發展軌跡的尋思</u>】

    圖一：義大利羅馬萬神殿 圖二：十七至十九世紀的萬神殿與雙鐘樓 資料二：(搭配圖二：雅各布‧阿爾特所繪十七至十九世紀的萬神殿與雙鐘樓)十七世紀中葉，羅馬教廷準備重建聖伯多祿大殿，教宗烏巴諾八世將萬神殿天花板上的鍍金青銅板拆下熔化，用來建造聖伯多祿大殿天蓋及大炮。另外仿造中世紀教堂，下令在門廊兩側建鐘塔。一位評論家一語雙關地說：「那些野蠻人沒做的，巴貝里尼都做到了」。(教宗原名馬費奧‧巴貝里尼。而野蠻人barbari(義大利文)barbarian(英文)，與巴貝里尼barberini(義大利文)發音類似，故為俏皮話)
    【參考資料:Hugh Chisholm,Encyclopaedia Britannica】'
