  stem: 請根據以下資料，判斷下列選項何者正確？資料一：這種飲料原來只有阿茲特克帝國的神權政治家跟貴族可以飲用，在過去的歐洲，這種飲料用於教會以外的場合；它們原本僅屬於貴族專享的飲品，後來逐漸擴大為中產階級的消遣，最後成為普羅大眾愛好的民生必需品。資料二：康熙四十五年（1706年），康熙皇帝於奏朱批中提到此物：「多羅所攜得利雅有餘，赫世亨爾向伊求取，若少則勿取，可捎信到廣東後尋得寄來。若有綽科拉（coKola），亦求取」、「保義言味甜苦，屬熱。但未寫有何效益、治何病，殊未盡善」。
  options:
  - label: A
    content: 資料二所指之物由中國傳入歐洲
  - label: B
    content: 資料一提及的飲品為咖啡
  - label: C
    content: 資料二中康熙皇帝認為此物具有治百病之效益
  - label: D
    content: 資料二的綽科拉成為現今風靡世界的甜點之一
- id: doc_110_高雄_三民_社會_歷史_選修歷史II_g12s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「2005年英國<u>獨立報</u>披露了某基因轉殖研公司的一份秘密報告。根據報告顯示，食用基因轉殖玉米的老鼠，血液和腎臟中會出現異常。當試驗報告公布後，歐盟立即著手對安全評價的材料及補充試驗報告進行分析，最終歐盟認為該基因轉殖玉米不會對人體和動物健康造成負面影響，因此決定許可進口該玉米用於動物飼料，但不允許提供人類食用和種植。2009年歐洲食品安全局在總結報告中表示，目前這種玉米對人類和動物健康及環境的影響都很安全。因此，EFSA
    基因轉殖小組認為這種玉米品種不大可能在應用中對人類和動物健康或環境造成任何不良影響。根據上述短文内，列選項之解釋何符合文意?
  options:
  - label: A
    content: 顯示基因轉殖食品並未對生物健康有任何影響
  - label: B
    content: 歐盟決定將基因轉殖玉米授權用於動物飼料上
  - label: C
    content: 歐盟允許將基因轉殖玉米給予人類食用與種植
  - label: D
    content: 此事件引起全球對於基因改造食品的恐慌
