  stem: 北魏<u>齊民要術</u>記載培育「騾子」的原則，須選七、八歲左右、骨骼端正的母馬，配上高大的公驢，則生出的騾子比馬還要雄壯。從這一記載可知古代中國已有人工選育動物的概念，請問下列何種現代種方式與其最為相似?
  options:
  - label: A
    content: 挑選不同優良的品種、雜交育成的牛奶鳳梨
  - label: B
