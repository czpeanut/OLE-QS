  stem: 自古以來種子被視為公共財，眾人皆可繁殖、播種、販賣種子，然而二十世紀後，透過技術與法律手段，種子逐漸成為公司私有財產。進入二十一世紀後，據統計，全球前三大公司：拜耳、迪華、先正達，他們的營業額就占全球總額的一半，耳和科迪華的營業額更是先正達的三到四倍。請問此一趨勢若未改變將導致什麼現象？
  options:
  - label: A
    content: 人類再也不用面對糧食缺乏的危機
  - label: B
    content: 種子可能被少數企業壟斷
  - label: C
    content: 能夠保存更多元化的原始植物基因
  - label: D
    content: 改善傳統農民的耕作環境和生計
