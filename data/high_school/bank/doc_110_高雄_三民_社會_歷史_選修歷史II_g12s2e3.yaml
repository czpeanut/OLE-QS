- id: doc_110_高雄_三民_社會_歷史_選修歷史II_g12s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 5
  stem: 中國藝術發展當中有特有的文字藝術：書法。書法是從中國最古老的文字甲骨逐漸演變而來，加上中國特有的筆墨紙硯，讓每個字都能成為藝術品，每筆勾勒，或圓滑、或勁疾，都能看出書寫者的心境。除了文字之外，隨著毛筆的使用方式同，依墨色渲染、淡深淺不一而成為幅幅意境悠遠的山水畫，在黑與白的世界當中，無論是失意、詠嘆、懷古或者意氣風發，千古多少人皆寄情於此。請問根據題幹下列何者正確？
  options:
  - label: A
    content: 書法與甲骨文無演變關係，應屬於不同文字體系
  - label: B
    content: 書法與山水畫所使用的材料不同
  - label: C
    content: 書法、書畫與中國文人生活息息相關
  - label: D
    content: 中國的繪畫只有黑白兩種色彩
