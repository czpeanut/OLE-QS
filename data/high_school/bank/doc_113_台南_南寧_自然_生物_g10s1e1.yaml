- id: doc_113_台南_南寧_自然_生物_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 光合作用的光反應於何處進行？
  options:
  - label: A
    content: 葉綠體的內膜
  - label: B
    content: 葉綠體的基質
  - label: C
    content: 葉綠體的類囊體膜
  - label: D
    content: 葉綠體的類囊體腔
  - label: E
    content: 葉綠體的外膜
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '、7.光合作用分成兩個階段：第一階段為光反應，發生於類囊體膜；第二階段為固碳反應（卡爾文循環），發生於葉綠體的基質。

    8.原核細胞不具有核膜及膜狀胞器，真核細胞才具有核膜及膜狀胞器，其中以雙層膜包覆的構造為核膜、粒線體及葉綠體。

    (A) 大腸桿菌為原核細胞，不具有屬於膜狀胞器的粒線體。

    (B) 神經細胞的高基氏體為單層膜包覆的構造。

    (D) 植物根尖細胞位於土壤中，見不到光，因此細胞不具有葉綠體。

    (E) 酵母菌的核糖體不具有膜包覆。

    9.人類細胞的細胞膜是由磷脂、蛋白質、寡醣及膽固醇組成。

    10.(B) 核糖體是由蛋白質與核酸（rRNA）組成。

    11.、12.去氧核糖核酸為 DNA，因此產生去氧核糖核酸的代謝作用為 DNA 複製作用。

    (A) 糖解作用的產物為丙酮酸、ATP 及 NADH。

    (B) 克氏循環的產物為 ATP、NADH、$FADH_{2}$ 及二氧化碳。

    (C) 卡爾文循環的產物為醣類。

    (D) DNA 複製作用的產物為 DNA。

    (E) 轉錄作用的產物為 RNA。

    13.(C) 光反應時，於類囊體膜靠腔內側裂解水產生電子、氫離子及氧氣。

    14.(D) 光反應時，裂解水產生的電子於類囊體膜上進行電子傳遞，最後由 $NADP^{＋}$ 及 $H^{＋}$ 獲得產生 NADPH。

    15.(B) A 為腺嘌呤之意、T 為三個之意、P 為磷酸基之意。

    16.ATP 具有三個磷酸基，高能磷酸鍵位於磷酸基與磷酸基之間，故只會有兩個高能磷酸鍵。

    17.ATP 釋出的能量可以推動合成反應或是耗能反應。

    (A) 肝細胞進行葡萄糖合成肝糖為耗能反應。

    (B) 螢火蟲夜間屁屁發出螢光為耗能的反應。

    (C) 美女腿部肌肉收縮使其可瘋狂追逐 WESI 老師，肌肉收縮運動為耗能反應。

    (D) 脂肪分解成脂肪酸與甘油為釋能反應，不需要 ATP 水解提供能量。

    (E) 腦細胞思考此題的正確答案為何，此為耗能的反應。

    18.有氧呼吸作用的過程：❶糖解作用→❷轉化成乙醯輔酶 A →❸克氏循環→❹電子傳遞鏈。其中❶及❸會產生少量 ATP，❹電子傳遞鏈會產生大量 ATP。

    (A) 卡爾文循環為光合作用的過程。

    19.(A) 磷酸甘油酸→磷酸甘油醛，兩者都是三碳有機物，沒有碳原子的減少，依據原子不滅定律推測該反應無二氧化碳產生。

    20.(E) 題幹提及「會干擾生物體的電子傳遞鏈……導致醣類產量下降。」且巴拉刈具有很強的氧化力，因此推測巴拉刈於光反應時劫取了電子，故選類囊體膜（光反應的場所）。

    21.(B) 人體細胞不具有葉綠體，但粒線體參與呼吸作用時，於內膜會進行電子傳遞鏈，因此推測具強氧化力的巴拉刈於此處劫取電子，進而影響細胞能量的產生。

    22.(A)(C) 二氧化錳為無機化合物，應為催化劑。酵素又稱酶，為有機物組成，大部分是蛋白質組成，少數由 RNA 組成。

    (B) 添加酵素只能加快反應速率，無法使產物的量增加。

    (D) 適當的溫度範圍內，溫度愈高，酵素的活性愈高，但超過酵素的溫度耐受性時，活性會快速降低甚至發生變性而失去活性。

    (E) 酵素參與反應時，可降低活化能來加快反應速率。

    23.有氧呼吸作用為一連串的氧化作用並釋出能量。葡萄糖為醛醣，經糖解作用變成有機酸（碳元素在有機物中，氧化數達最高的狀態），故判斷其發生氧化反應。

    24.丙酮酸→乙醯輔酶 A 的過程會釋出二氧化碳，此為氧化作用，會釋出電子，而電子被 $NAD^{＋}$ 及 $H^{＋}$ 獲得產生 NADH。

    25.克氏循環會產生 $CO_{2}$、ATP、NADH 及 $FADH_{2}$。有氧呼吸作用是於最後一個步驟產生水。

    26.(B) 合成 RNA 為轉錄作用，需要 RNA 聚合酶（核糖核酸聚合酶）。

    27.(B) 神經細胞具有細胞核，DNA 位於細胞核內，因此依據 DNA 序列合成 RNA 的轉錄作用應發生於細胞核內。

    28.RNA 聚合酶的產物是 RNA，RNA 為一條多核苷酸。RNA 為一種核酸，核酸是由核苷酸縮合聚合而成的聚合物。

    29.抗體為一種分泌性的蛋白質，因此需要高基氏體進行加工修飾、包裝、運輸。

    30.(D) 溶體具有酸性水解酵素，可將老舊胞器溶解回收。

    31.腺體細胞為分泌旺盛的細胞，因此負責物質分泌、運輸的高基氏體含量較多。

    32.去氧核糖核酸（DNA）→核糖核酸（RNA）→蛋白質。

    33.(C) 溶體具有酸性水解酵素，可執行胞內消化作用。

    34.rRNA 的功能是與蛋白質結合形成核糖體。

    (A) 原核細胞與真核細胞均具有核糖體。

    (B) 是由 DNA 進行轉錄作用產生。

    (C) 結構為單股多核苷酸。

    (E) 具有催化能力，可使肽鍵生成。

    35.青黴素是抑制細菌的細胞壁生成，因此是抑制肽聚糖。

    36.(A) 磷脂使膜具有流動性，並且使膜具有攔阻水溶性物質通過膜的功能。

    (B) 蛋白質可擔任通道或載體以協助物質通過細胞膜。

    (C) 醣類附著於細胞外側，具有分子辨識的功能。

    (D) 膽固醇位於磷脂之中，具有穩定細胞膜結構的功能。

    (E) 細胞膜的組成分中不含 DNA。

    37.外側需具親脂性，才能與脂溶性的磷脂接觸；內側則需具有親水性，才能與親水性的物質（如金屬離子）結合。

    38.(A) 鈉離子通道是一種膜蛋白，因此其蛋白質的立體結構形成與粗糙內質網有關。

    (B)(C) 通道是由蛋白質組成，因此應為胺基酸鏈捲繞形成。

    (D) 該通道的基因位於細胞核內。

    (E) 離子通道具有專一性。

    39.藍綠菌為原核生物，因此細胞中不具有葉綠體，光反應則是於細胞膜上進行。

    40.(A)(B)(C) 就碳而言，這是一個還原反應，此過程所獲得的電子由 NADPH 提供。

    (E) 反應前後均為三碳化合物，因此沒有消耗或生成二氧化碳。'
