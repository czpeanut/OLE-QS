  options:
  - label: A
    content: 纖維素
  - label: B
    content: 澱粉
  - label: C
    content: 幾丁質
  - label: D
    content: 聚乳酸
  - label: E
    content: 肽聚糖
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 原核生物（乳酸菌）的細胞壁主要為肽聚糖組成；真菌的細胞壁主要為幾丁質組成；藻類與植物的細胞壁主要為纖維素組成。
