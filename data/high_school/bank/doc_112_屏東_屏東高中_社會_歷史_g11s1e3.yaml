- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 18 世紀時，某國內部爭鬥不斷，國勢逐漸衰落，周圍又有強大的鄰國，最終遭到瓜分，消失於歐洲政治版圖。第一次世界大戰後雖得以復國，但在 1930 年代又遭強鄰入侵，因此引發第二次世界大戰，戰時更被瓜分占領，戰後才得以再度建國。請問這個國家是下列何者？
  options:
  - label: A
    content: 義大利
  - label: B
    content: 奧地利
  - label: C
    content: 鄂圖曼帝國
  - label: D
    content: 波蘭
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D) 18 世紀的波蘭曾三度遭到俄、普、奧瓜分而消失於歐洲政治版圖，直至第一次世界大戰後才得以復國，卻又於 1939 年遭到德國入侵，引發第二次世界大戰，直到戰後才得以再度建國，卻從此淪為共產政權所統治，直至 1989 年才建立東歐第一個非共的民主國家。
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有位外交官參加某場會議後，原本期望大會能對戰爭費用、領土等議題做出公正明智的處置，但會中的決議卻令他失望。他表示：「許多代表運用詭辯來掩飾他們的報復行為，有的強索鉅額賠款，有的企圖在亞洲取得更多殖民地，有的為了自己的利益要求限制軍備，有的又屈從於強權，不能公正處理領土問題。」請問這場會議，造成了何種影響？
  options:
  - label: A
    content: 導致奧匈帝國王儲遭暗殺
  - label: B
    content: 埋下日後二次大戰的種子
  - label: C
    content: 促成冷戰局勢形成
  - label: D
    content: 致使德國分裂為東、西德
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從報復、強索巨額賠款、限制軍備等關鍵詞，可推知這場會議為第一次世界大戰後的巴黎和會，因此(B)為正解。(A)第一次世界大戰的導火線，非和會影響。(C)(D)第二次世界大戰後的形勢。
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 美國總統回憶某一事件時談到：「他們並非真的想發射這些導彈，因為如果要進行一場核戰爭，他們在蘇聯有足夠導彈。但是他們這樣做就能在政治上改變力量均勢，會給人已改變均勢的印象，而人們的印象卻是有真實價值的。」請問此事件應為下列何者？
  options:
  - label: A
    content: 韓戰
  - label: B
    content: 柏林危機
  - label: C
    content: 越戰
  - label: D
    content: 古巴飛彈危機
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「他們並非真的發射這些導彈」與「核戰爭」，可推測這是一場未能實現的核戰爭危機，因此答案為(D)古巴飛彈危機。(A)(B)蘇聯尚未擁有核武，沒有能力進行核戰爭。(C)蘇聯未直接介入此戰爭。
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某個社會運動中所提出的口號有：「權力歸於想像！」、「不受約束地享受吧！」、「禁止禁止！」、「不要作戰」、「工廠，大學，聯合」，主要訴求包含反戰、改善工人待遇、人自身完全的解放、思想與行動的自由等，請問這場運動應為下列何者？
  options:
  - label: A
    content: 俄國二月革命
  - label: B
    content: 法國巴黎學運
  - label: C
    content: 蘇聯共產革命
  - label: D
    content: 東歐民主化運動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '從訴求內容可看出此社會運動反戰爭、反國家官僚權威、反資本主義剝削、追求思想與行動的自由，顯示出其性質的多元性，應是 1960 年代的(B)法國巴黎學運，學生受到「新左派」批判思想的影響，要求教育改革與校園民主，同時批評西方資本主義及官僚體系，後期又加入工人團體聲援，使學運聲勢更加浩大。(A)(C)不會訴求人身解放與思想自由。(D)不會訴求反戰。

    5.1954 年韓戰已經結束，因此美國毋需擔心朝鮮半島再遭共產主義擴張的問題，此時更令人擔心的是南北分裂的越南，所以艾森豪決定加強對南越的援助，正確答案為(A)中南半島。

    6.比利時殖民(B)盧安達時，對當地人民採取差別待遇，造成胡圖族與圖西族間長期的對立與衝突，進而引發 1994 年的大屠殺。(A)(C)(D)獨立之前為英國的殖民地。

    7.從薩伊德的評論中，可知部分伊斯蘭人煽動對美國發動聖戰，且這些人與阿富汗有關係，從這些線索應可推斷薩伊德所評論的事件為(C) 911 事件，發動攻擊的蓋達組織即是受到阿富汗塔利班政權的支持。

    8.前者為甘地「不合作運動」的一項抗爭，後者為美國非裔人士的民權運動，兩者雖然訴求不同，但都是以非暴力行動向當局抗爭，因此答案為(C)。(A)僅後者，(B)(D)僅前者。

    9.文中所謂「史上第一次」的全球化現象，指的是 16 世紀的大航海時代，首次將全球不同大陸的生產與消費綁在一起，當時促成這樣「全球化」的動機是對(A)香料的強烈需求所使然，可以說地理大發現是為了香料而開啟的。

    10.(A)蘇聯協助成立德意志民主共和國。(C)英國。(D)英、法、美協助西德建立聯邦共和體制國家。

    11.「星際大戰」原是 1980 年代美國雷根總統提出的構想，此國經濟面臨的挑戰包括開放後的民怨、「星際大戰」的挑戰，因此可推知應為戈巴契夫任內的蘇聯情勢，答案為(D)。(A) 1920 年代。(B) 1930 年代。(C) 1980 年代，雖然時間吻合，但中國並未試圖與美國競爭「星際大戰」計畫。

    12.從這場革命「使西化運動停止」、「新興執政宗教人士」兩個結果，可判斷為(D) 1979 年的伊朗革命，親美的巴勒維國王被推翻後，取而代之的是宗教領袖何梅尼以伊斯蘭教義治國。(A)(B)本身即是西方國家，沒有停止西化運動的問題。(C)兩次革命的結果都不是宗教人士執政。

    13.衣索比亞曾於非洲大獵期間擊敗義大利軍隊，因此為提振民族信心，墨索里尼於 1935 年大舉入侵(A)衣索比亞，成功將之併入義大利王國。

    14.西蒙．波娃認為，女人並非生來就是女人，而是後天從小被灌輸要完成女性的使命而「成為」女人，最符合此敘述的觀點為(D)。(A)(C)題文並未提到相關論述。(B)兩性在生理方面差異甚大。

    15.從題文可知這場戰爭讓美國陷入兩難的困境，無法取勝又不甘心失敗，只好採取邊談邊打、逐步撤軍、轟炸升級策略的戰爭為(B)越戰。

    16.題文中主人翁回憶自小即被灌輸特定的思想，直到 1968 年後才意識到全是當局的謊言，可見得此人生活在極權國家裡，1968 年的事件使人們的意識出現變化，正確答案為(C)。(A)(B)(D)三者皆非發生於極權國家的事件。

    17.凱末爾在宗教方面的作為，厲行「政教分離」以推動世俗化改革，自然引來傳統(C)伊斯蘭主義支持者的詬病與批評。

    18.選項中較符合「追求美麗、潔淨和秩序」目標的是(B)現代性，但希特勒實現目標的作法卻殘忍又冷酷，故有此批評。(A)偏經濟面向，(C)偏政治面向，(D)不重科學與秩序，三者與題文論述的重點不同。

    19.從「帝國主義戰爭在全歐洲開啟了內戰」，可推知此時歐洲正值第一次世界大戰期間，加以這位政治領袖主張「資本主義能隨時被摧毀」，即可判斷為列寧領導的十月革命，(A)為正解。(B)二月革命的成果。(C)(D)史達林的政策與作為。

    20. 1929 年全球經濟大恐慌時期，原本戰後被賠款壓得喘不過氣來的德國社會更形嚴峻，圖中節節上升的社會資料應該是(B)德國失業人口，統計時間正值全球性經濟大恐慌。

    21.第二次世界大戰造成的破壞遠較第一次世界大戰嚴重，西歐國家能於戰後快速恢復經濟的原因，主要得利於美國(C)杜魯門主義的反共產勢力擴張思想，為避免西歐國家因為經濟破壞而讓共產勢力有機可乘，於是提供經濟援助，稱為「馬歇爾計畫（歐洲復興計畫）」。

    22.題文中的主人翁遭檢舉誣陷為共產主義分子，即遭好萊塢封殺，可見此時的美國反共意識型態特別高漲，應是 1950 年代初期「麥卡錫主義」盛行時期，這波「紅色恐怖」風潮也造成許多人受害，正確答案為(D)。

    23.蘇聯從「只有木犁」到「擁有核武器」，主要奠基於史達林時期推動多次的「五年計畫」，使蘇聯成功躲過經濟大恐慌，更使蘇聯於第二次世界大戰之前躋身工業強國之林，(C)為正解。

    24.從海報的文字與意象顯示，此時英國的女權運動者訴求在爭取投票權，時間落在 1884 ～ 1918 年之間，因此答案為(B)，第一次世界大戰後，英國婦女終於達到此一目標。

    25.從德皇威廉二世、德國潛艇等關鍵詞，即可推斷這場戰爭應為第一次世界大戰，時間為(B) 1910 年代。

    26.小說中，中南美洲當地充滿美國以強大的資本建設的交通、建築等，當地的歷史更是美國海軍陸戰隊、裝甲艦和刺刀的歷史，可知美國係(C)利用軍事與經濟的雙重力量控制中南美洲。(A)美國並未在當地建立殖民地，且未提及經濟部分。(B)是操控，且未提及到軍事的部分。(D)題中並未提到與歐洲合作。

    27.題文中的「紅色恐怖」發生於 1950 年代初期的美國，參議員(A)麥卡錫宣稱共產勢力已經滲入美國，煽動全國性反共運動，造成許多人遭到政府的調查與逮捕，演藝圈內亦有多人受害，如知名喜劇演員卓別林。

    28.全世界各城市的居民在品味、型態、習慣等皆相似，主要與(C)全球化有關，受到大眾傳播媒體的宣傳與影響，才造成全球出現一致現象。

    29.世界糧食產量創歷史新高紀錄，但長期處於飢餓狀態的人口卻愈來愈多了，主要原因是分配不均，許多糧食資源掌控在少數富國之中，因此(B)為正解。(A)此時已無帝國主義的殖民。(C)(D)兩者無法解釋為何糧食產量增多，飢餓的人更多的原因。

    30.(A)現代主義重視科學性、目的性，鼓勵人們重新檢視過去的一切既存事物。(B)與經濟較相關，(C)強調多元價值的意識型態，(D)主張社會資源公有共享的經濟學說，三者與題文敘述無關。

    31.題文顯示殖民母國自覺已無法再持續在非洲殖民，已有放手讓非洲國家獨立的打算，最可能的時期為二次大戰結束後的(D) 1960 年代。(A)(B)(C)時間太早，歐洲列強尚未有放棄非洲殖民地的打算。

    32.(A)甘地領導不合作運動，以溫和方式抗爭。(B)印尼採武裝革命方式獨立。(C)經過法越戰爭後，簽訂《日內瓦停戰協定》而獨立。

    33.題文為甘迺迪於 1963 年訪問西柏林時的演講，西柏林經過三次柏林封鎖危機，在 1961 年柏林圍牆建立後，更是成為東歐共產鐵幕中唯一的自由民主希望，因此答案為(C)。

    34.從沙特國王的說法，可知以阿衝突的最根本原因是(D)領土糾葛，猶太人堅持在巴勒斯坦復國，因此就損害了原居於當地的阿拉伯人民權益。

    35.(A)二月革命時已推翻帝國，十月革命時推翻民主的臨時政府。(B)為正解。(C)希特勒領導的政黨獲得國會大選勝利，依據憲法出任內閣總理。(D)軸心國指德國、義大利與日本。

    36.1947 年美國提出「馬歇爾計畫」，為避免西歐因經濟破產而發生無產階級革命，以此計畫編列預算，協助歐洲各國戰後重建，故答案為(D)。

    37.「第一世界」指美國、西歐等民主陣營，「第二世界」指蘇聯為首的共產集團，「第三世界」則多指二戰後獨立的亞非國家，造成三個陣營的出現與(A)冷戰局勢的對峙有關。

    38.最末一段提到，現今世界最重要的人口問題「並非第三世界國家人滿為患」，而是「第三世界生活水準提高」，透過人口移動，造成對環境更大的衝擊，故(D)為正解。

    39.A 組織為歐洲的北大西洋公約組織，因此答案為(A)。(B)成員國多數為歐洲國家。(C)古巴飛彈危機時，未曾出兵介入。(D)此為防共、反共的軍事聯盟，非經濟援助計畫。

    40.(B)美國透過與蘇聯共產集團周圍各國交好結盟，形成圍堵防線，阻止共產勢力擴散。

    41.甲計畫要使歐洲經濟復興，應是指美國提出「馬歇爾計畫」援助西歐國家，但資料二卻指稱美國的計畫其實是「偽善包裝」，顯見提出的國家應是反對美國經援歐洲的(C)蘇聯。

    42.資料三中的乙計畫要成立共同管理煤鋼的單位，應是法國提議而成立的「歐洲煤鋼組織」。至於甲計畫目的在團結自由國家對抗共產政權，因此延伸出來的國際組織為「北大西洋公約組織」，故答案為(A)。

    43.題文所述應為 1971 年的「乒乓外交」，當時美國正陷入越戰的泥淖，企圖「聯中制蘇」以改善自身困境，因此答案為(D)。

    44.嬉皮運動盛行於美國 1960 年代，當時造成美國社會惶恐不安的因素之一是(B)越戰，前線戰局膠著使得國內的反戰活動盛行。(A) 1953 年已停戰。(C) 1962 年，時間短暫故對社會氛圍影響不大。(D) 1990 ～ 1991 年。

    45.(A)為正確答案。(B)甘迺迪。(C)雷根。(D)尼克森。'
- id: doc_112_屏東_屏東高中_社會_歷史_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1954 年 4 月，美國總統艾森豪在記者招待會中，提出著名的「骨牌效應」觀點，宣稱：在丟失「中國」之後，美國再也禁不起更大的損失了。一旦□□喪失，就會出現「骨牌效應」，……緊接著是美國「第一島鏈」防禦圈受到威脅，再進一步就是向南威脅到澳大利亞和紐西蘭。……因此美國必須承擔起遏制共產主義在□□擴張的責任。請問□□是指下列何地？
  options:
  - label: A
    content: 中南半島
  - label: B
    content: 朝鮮半島
  - label: C
    content: 巴爾幹半島
  - label: D
