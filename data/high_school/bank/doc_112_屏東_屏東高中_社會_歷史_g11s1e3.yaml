  stem: 文中的「第一世界」與「第三世界」的劃分由來是源自
  options:
  - label: A
    content: 冷戰局勢的對峙
  - label: B
    content: 帝國主義的擴張
  - label: C
    content: 工業革命的影響
  - label: D
    content: 一戰後的建國潮
  group_stem: '世界人口不斷增加，所需的食物、空間、水、能源等資源就愈多。但世界各地的人口成長率和人口組成變化很大：第三世界有些國家每年人口成長率達 4 ％或更高；第一世界有些國家的人口成長率卻很低，甚至低於 1 ％。除了人口增加的數字之外，更要關切的是人口增加對環境的衝擊。今日世界每人對環境所造成的衝擊，以第一世界最大，第三世界最小。美國、西歐、日本平均每人耗費的自然資源，要比第三世界居民多了 32 倍（如化石燃料），產生的廢物也多了 32 倍。

    然而，本來對環境衝擊較小的人民，目前看來卻可能會變成衝擊大的一群，原因有二：一是第三世界生活水準不斷提高，如中國，因為他們羨慕第一世界的生活方式，因而見賢思齊；另一是由於各種因素，第三世界的居民紛紛往第一世界移民。因此，現今世界最重要的人口問題並非第三世界國家人滿為患，如肯亞、盧安達等，而是第三世界生活水準提高，加上第三世界移民前往第一世界的人數增加，且過著第一世界的生活，使得人類全體對環境的衝擊更大。

    【資料出處：賈德．戴蒙著，廖月娟譯，《大崩壞：人類社會的明天》（臺北：時報出版，2019），第 564 ～ 566 頁】'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
