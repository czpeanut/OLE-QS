    資料一：甲計畫最高目標是於 1952 年前建構歐洲健康的經濟體，毋需其他外援，其四項行動綱領：加強生產、擴張外貿、內部財政穩定、發展經濟合作。對許多歐洲人來說不希望是大型救濟方案，因為唯有透過歐洲經濟整體永久性結構改善才是根本治療之道。

    資料二：甲計畫點出「經濟復興、自由體制」兩大外交目標，呼應當時總統向國會提出支持自由國家對抗專制國家的「主張」。且此計畫強調歐洲自行請援，以免顯得是計畫主持國家主動介入，但這無非就是地緣政治下的偽善包裝。

    資料三：1950 年，歐洲某國外交部長提出乙計畫，他主張透過團結歐洲國家，維持和平關係，首先必須解決西歐兩國百年來的紛爭，因此成立一個組織，將兩國全部煤鋼產品交由同一個官方單位來管理，其他歐洲國家得隨時加入此組織，如此一來，即可保證在經濟發展上建立一個共同的基礎，共同繁榮，隔年歐洲六國便於計畫提出國簽署條約。'
  answer:
