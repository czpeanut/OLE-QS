- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 臺灣現存清領時期的八條古道中，交通部公路總局原欲利用其中一條古道內的一段路以完成環島公路的最後一段，因其沿線擁有低海拔熱帶季風雨林及熱帶海岸林的豐富生態及地景，引發環保團體抗爭。該路線跨越兩縣，兩縣產生分歧：甲縣政府援引《文化資產保存法》，將該區範圍內的公有土地（國有和縣有），劃為「禁止改變或破壞其原有自然狀態」的自然保留區；但乙縣政府則行文主管自然地景保護的行政院農委會，要求撤銷劃設保留區的公告，理由是劃設保留區未經兩縣協調，且範圍內國有土地的劃設權責，應屬於中央。因兩縣府的爭議未決，最後公路總局放棄興建。請問依據題文，該古道現址興築公路的爭議，其牽涉的政府權責和有效的問題解決方向，下列分析何者最適當？
  options:
  - label: A
    content: 爭議產生於農委會與地方政府權責劃分不明，應修改《地方制度法》規定
  - label: B
    content: 跨域治理的爭議問題由兩縣政府協商解決即可，共同落實地方自治精神
  - label: C
    content: 地方政府與環保團體可以合作開發古道，協力發展地方公共建設
  - label: D
    content: 事涉政府權責的垂直與水平劃分及運作，相關政府單位應該共商解決
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題意可知，此事涉政府權責的垂直與水平劃分及運作，相關政府單位應該共商解決，故選(D)。(A)中央與地方政府有爭議，可以由立法院解決。(B)這不是跨域治理的爭議。(C)此案不是公私協力的爭議。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 某國政府擬將該國主要移民群體之母語增列為基本教育課程，政策一出引發論辯。反對者主張此舉將增加學生負擔，支持者則強調落實多元文化的文化權，著眼可能帶來之效益。下列何者最符合支持者強調文化權的主張？
  options:
  - label: A
    content: 可落實主流文化對少數文化之包容
  - label: B
    content: 有助移民群體認同並傳承自身文化
  - label: C
    content: 可有效提升學生外語能力並培養多元視野
  - label: D
    content: 有益移民適應新生活時不忘自身文化傳統
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 支持多元文化主義者，贊成將主要移民群體之母語增列為基本教育課程，主要考量的效益是有助移民群體認同並傳承自身文化，故選(B)。(A)並非對少數文化之包容，而是「尊重」。(C)學習母語最主要不是為了提升學生外語能力。(D)移民本身通常不會忘了自身文化傳統。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 有學者檢視我國法律變遷時，注意到《後天免疫缺乏症候群防治條例》，更名為《人類免疫缺乏病毒傳染防治及感染者權益保障條例》，內容也從重視疾病防治，轉為亦同時重視感染者權益。學者評論，此修法呼應兩公約強調「在獲得健康照護與服務上，任何人都不應被歧視」的精神。下列何者最符合該學者針對此項變遷所提出的人權發展評論？
  options:
  - label: A
    content: 人權為普世價值，故世界各國立法都強調保障所有人之權利
  - label: B
    content: 人權理念受重視後，不同群體的權益也陸續受到關注與落實
  - label: C
    content: 人權內涵隨時間改變，我國立法從重視國民健康權轉為保障基本權利
  - label: D
    content: 人權發展與國際參與密切相關，加入國際組織才能有效推動人權保障
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中指出「法律內容從重視疾病防治，轉為亦同時重視感染者權益」，顯見除了人權理念的重視，不同群體的權益也陸續受到關注與落實。(A)題幹只提到我國，未討論各國。(C)人權內涵隨時間改變，我國立法除了保障基本權利之外，更擴展至重視國民健康權。(D)即使不加入國際組織，也可以推動人權。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_11
  section: 1
