  - label: A
    content: 在渡假村開發案的核准文件中，未明訂須聘用當地原住民為員工
  - label: B
    content: 縣府並未事先取得各個公民團體之同意，就核准該渡假村開發案
  - label: C
    content: 承辦開發案的公務員與建商有同學關係，卻未依法主動自行迴避
  - label: D
    content: 開發案未經部落會議取得當地部落的同意，政府即核准該開發案
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依《原住民族基本法》規定，原住民族有傳統領域的諮商同意權，因此傳統領域開發案未經部落會議取得當地部落的同意，政府即核准該開發案，違反程序正義，故選(D)。(A)在渡假村開發案的核准文件中，未明訂須聘用當地原住民為員工，不一定構成違法。(B)縣府並未事先取得各個公民團體之同意，不構成違法。(C)承辦開發案的公務員與建商有同學關係，卻未依法主動自行迴避，當事人或上級長官可以要求其迴避。
