  stem: 關於《戒嚴令》第二條、第四條的規定，下列敘述何者正確？
  options:
  - label: A
    content: 國家禁止的行為與防止擾亂治安無關，已違反法治國原則
  - label: B
    content: 國家對於違反行為不分輕重均判死刑，已違反國民主權原則
  - label: C
    content: 國家只限制部分違法行為，已違反民主國家的平等原則
  - label: D
    content: 《戒嚴令》的頒布已經限制到人民的基本權利，需經立法院追認
  group_stem: 臺灣曾於民國 38 年 5 月實施戒嚴。當時由警備總部公告的《戒嚴令》第二條規定：「自同日起，除基隆、高雄、馬公三港口在本部監護之下，仍予開放，並規定省內海上交通航線（辦法另行公布）外，其餘各港，一律封鎖，嚴禁出入。」第四條也列舉處以死刑的各項「擾亂治安」行為，包括：造謠惑眾、聚眾暴動、擾亂金融、搶奪財物、鼓動學潮、破壞交通通信、妨害公眾用水及電氣煤氣事業、持有槍彈或爆裂物等。該次戒嚴歷經 38 年，直至民國 76 年始依總統令解除（右圖）。請問：
  shared_asset: g1_11_12
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
