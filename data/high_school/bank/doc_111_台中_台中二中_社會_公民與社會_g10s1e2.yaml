  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《兩岸人民關係條例》的法源是依據《憲法增修條文》第 11 條，故選(C)。(A)《憲法增修條文》沒有內地地區。(B)《憲法增修條文》條文規定，我國有效統治的範圍為臺澎金馬。(D)領土的變更由立法院提出，再經由人民投票複決，有效同意票超過選舉人總額之半數，使得變更。
