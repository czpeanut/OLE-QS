- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '某國舉行國會大選，某選區共有 38 位參選人競爭 8 席，附表是該選區 8 位得票最高當選人的資料。該國某政治學者據此結果撰文評論其選舉制度問題。下列何者最可能是該學者提出的問題？

    | 當選名次 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 所屬政黨 | 甲 | 乙 | 乙 | 丙 | 甲 | 甲 | 甲 | 丁 |

    | 得票率（％） | 19.8 | 9.4 | 6.9 | 4.6 | 3.5 | 3.4 | 2.8 | 2.7 |'
  options:
  - label: A
    content: 有得票門檻限制，無法充分反映民意
  - label: B
    content: 易獨厚大黨，小黨勝選機率過低
  - label: C
    content: 讓同選區當選者的民意基礎差距過大
  - label: D
    content: 讓落選者得票數總和高於當選者總和
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 選區共有 38 位參選人競爭 8 席，表示為「複數選區相對多數決制」；觀察第一高票與第八高票的得票率，會發現同選區當選者的民意基礎差距過大，答案選(C)。(A)沒有得票門檻限制，只要爭取到前八高票，即可當選。(B)此制度有利小黨或無黨。(D)無法從此表判斷落選者得票數和當選者得票數的總和何者較大。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 德國聯邦議會選舉，在選前一個月，選情突然出現翻轉，基民黨和基社黨聯盟推出的候選人表現不佳，失去領先優勢，社民黨後來居上躍居首位。分析指出未來不論何黨拿下最高票，都可能因得票率不足被迫與其他兩黨分享權力。下列何者可能是德國選舉後可能出現的情況？
  options:
  - label: A
    content: 出現聯合政府，但政府容易不穩定
  - label: B
    content: 出現分立政府，政府推動政策不易
  - label: C
    content: 出現一致政府，國會監督力量削弱
  - label: D
    content: 出現少數政府，執政權責不易劃分
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題意得知，由於德國為內閣制國家，沒有任何一黨在國會超過 50 ％的席次，因此必須組成聯合政府，故選(A)。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國的政府體制是兼具內閣制與總統制特色的雙首長制，以我國的體制相較於英國和美國的政府體制，何者說明正確？
  options:
  - label: A
    content: 我國總統直接任命行政院院長，與美國總統直接任命重要官員相似
  - label: B
    content: 我國國會可以對總統提出不信任案，與英國國會的倒閣案制度相似
  - label: C
    content: 我國總統發布法令時需要內閣副署，與美國總統發布法令程序相似
  - label: D
    content: 我國具有倒閣與解散國會的機制，與英國行政對立法負責制度相似
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)我國總統可直接任命行政院院長，而美國總統任命重要官員要國會同意。(B)我國國會可以對行政院長提出不信任案，與英國國會的倒閣案制度相似。(C)我國總統發布法令時需要內閣副署，但美國總統發布法令不必副署。
- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 冷戰期間，美國促成「東南亞公約組織」（SEATO）的成立。由於國際局勢變化，該組織無法有效達成發展目標而逐漸被後來成立的「東南亞國家協會」（ASEAN，簡稱「東協」）取代。而東協循歐洲聯盟經驗有效促進區域經濟的合作與發展，成為鄰近經濟強國拉攏的對象，例如中國、日本、韓國、澳洲、紐西蘭，即與東協十國簽署「區域全面經濟夥伴協定」（RCEP），但我國仍然無法成為簽署國。請問有論者指出，我國無法加入當年的「SEATO」和現今的「RCEP」，皆與某項「中國因素」有關。依據題文推論，下列何者最可能是該項因素？
  options:
  - label: A
    content: 我國政府遷臺以後，即喪失在聯合國原有的「中國」代表權
  - label: B
    content: 中國共產黨政權建立後，國際社會即堅持「一個中國」政策
  - label: C
    content: 中國共產黨政權持續透過不同手段，壓縮我國國際參與空間
  - label: D
    content: 各國著眼中國開放後的市場利益，屈服於中國對我國的打壓
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 我國無法參與重要的國際組織，主要是因中國共產黨政權持續透過不同手段，壓縮我國國際參與空間，故選(C)。(A)(B) 1970 年我國退出聯合國以後，喪失在聯合國原有的「中國」代表權，國際社會才逐漸採取「一個中國」政策。(D)各國著眼自身的利益，不一定都是中國開放後的市場利益。
