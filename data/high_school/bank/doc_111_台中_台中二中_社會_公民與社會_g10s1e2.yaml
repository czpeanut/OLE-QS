  stem: 某建商看中某原住民族傳統領域土地開發成本較低，決定興建渡假村。當地縣政府認為渡假村有助經濟發展與促進原住民就業，故積極提供行政協助，快速核發開發許可，而承辦開發許可的縣府科員恰巧是建商大學同學。此案引發當地原住民強烈抗議。數個公民團體也指控，該案的環境影響評估程序不完備，且一再忽視公民團體訴求，更批評承辦公務員未事先自行迴避。另有學者指出，此開發案爭議根源，在於原住民族傳統領域及其文化未受主流社會肯認，這也是原住民族曾在總統府前長期抗議的原因；此種抗議強調為自身文化與認同發聲，與著眼於爭取權益的抗爭有所不同。因爭議擴大，縣議會做成決議，要求縣政府提出專案報告。此案經媒體披露，也引發民眾不同意見。依尊重文化權與其他相關法規，下列何者會造成開發案的許可違法？
