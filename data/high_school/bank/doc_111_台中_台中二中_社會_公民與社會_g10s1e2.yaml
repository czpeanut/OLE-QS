  stem: 我國某屆立法委員選舉（區域立委、不分區立委）的選票設計如附圖，關於選票之相關敘述，下列何者正確？
  options:
  - label: A
    content: 原住民身分選民與其他選民同為領取圖中區域立委選票
  - label: B
    content: 可以從選票設計看出這是以並立制計算席次的選舉制度
  - label: C
    content: 某個不分區立委因故辭職，屆時將辦理補選
  - label: D
    content: 政黨票須超過 5 ％門檻，各政黨才能分配到不分區席次
