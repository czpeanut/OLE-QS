  stem: 1946 年，政府在嘉義山區新設吳鳳鄉，以紀念 18 世紀清朝通事吳鳳。有關吳鳳的故事，說法不一。最早，吳鳳是清朝負責傳達官命、收繳稅餉和分配差役的通事；日本治臺後，總督府為加強山地部落的管理，另立官職取代通事，並將吳鳳塑造成「捨身取義」、感化原住民的角色；戰後，政府承襲這種「吳鳳神話」，以其名設鄉。1980 年代，在原住民族抗議及社會反省與討論後，將吳鳳鄉正名為阿里山鄉。請問該正名事件所彰顯的去除偏見、尊重群體主體性之多元文化理念，與下列何項政策目的最相似？
