  stem: 在大部分穩定的民主國家中，法理主權與事實主權呈現契合的狀態，但臺灣因兩岸分裂出現認定不一致的問題。憲法本文對於領土「固有疆域」之範圍並未明確規範，之後從 1991 年至今總共 7 次修憲，透過修憲來設定我國的領土架構。關於憲法界定主權的相關敘述請選出正確答案？
