- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 民國 111 年底我國將舉行九合一選舉，屆時所有的地方政府民選公職，包括直轄市市長、市議員，縣市長、議員，鄉鎮市長、代表，以及村里長等，將一併改選。關於此次選舉的方式，下列敘述何者正確？
  options:
  - label: A
    content: 所有的選舉皆採取「單一選區相對多數決制」
  - label: B
    content: 所有的候選人只要年滿 23 歲就都有參選資格
  - label: C
    content: 所有縣市長選舉時必須同時提出副首長人選
  - label: D
    content: 縣市長的選舉制度有利於大黨，不利小黨
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)地方政府民選公職中，直轄市議員、縣（市）議員、鄉（鎮、市）民代表、直轄市山地原住民區區民代表，採「複數選區相對多數決制」。(B)縣市長須 30 歲，鄉鎮市長須滿 26 歲。(C)縣市長選舉時不必同時提出副首長人選。(D)地方行政首長選舉採取「單一選區相對多數決制」，有利於大黨，為正解。
