  group_stem: ◎某國醫院及診所主要由民間經營，再由政府進行價格管制。該國政府為避免一般民眾因醫療服務昂貴而怯於就醫，將醫療價格抑制在市場均衡價格的三分之一。這樣的政策照顧到人們的醫療需求，並提升國民健康，但也造成正反兩面的後果。雖說民眾對現有政策堪稱滿意，但政府為了解決部分問題，計畫將價格上調到均衡價格的二分之一，此舉引來民眾的不滿，而醫療產業也有意見。
