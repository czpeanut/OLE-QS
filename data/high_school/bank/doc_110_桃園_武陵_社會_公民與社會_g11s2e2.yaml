  stem: 後疫情時代不僅改變人們的消費型態、生活模式，也考驗廠商是否能在時代變局中做出適時的策略調整，洞燭機先。下圖是經濟部公布2020年產值創歷年新高之產品，何者是影響這些產業表現亮眼之主因？
