- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 4
  stem: 公平會點出在Google搜尋引擎結果的呈現上，不應該有誤導消費者的效果。業者違反《公平交易法》第25條「足以影響交易秩序之欺罔及顯失公平行為」處以業者分別為200萬元和80萬元罰鍰。請根據上文判斷，公平會開罰之依據為何？
  options:
  - label: A
    content: 獨占行為
  - label: B
    content: 聯合行為
  - label: C
    content: 結合行為
  - label: D
    content: 不公平競爭行為
  group_stem: ◎公平會發現，消費者在Google搜尋引擎打上特定品牌名稱，例如搜尋商品時，搜尋結果會出現「A商品的熱銷搜尋結果 | B購物網站」、「人氣熱銷C商品口碑推薦品牌整理－D購物網站」等搜尋結果，消費者被前述搜尋結果吸引點選進入購物網站，卻發現賣場並沒有此商品，實則電商平台，分别利用SEO（Search Engine Optimization，搜尋引擎最佳化）技術所產生的搜尋結果。 公平會指出，雖不反對SEO技術，但在搜尋結果的呈現不應有誤導消費者之效果，此作法形同引誘消費者「逛錯街」，這使電商平台增進網站到訪率，也吸引消費者比較或購買這2家網站所銷售的其他品牌商品，進而減少消費者原本欲搜尋品牌商品的銷售機會。本質上是「誘導/轉向」的欺罔行為，除了打斷消費者正常的商品搜尋與購買過程，也對其他販售該品牌商品的經營者形成不公平競爭。若任由發生而不予規範，未來可能導致其他電商業者競相仿效，消費者將更難分辨搜尋結果呈現資訊的真偽。過去公平會曾就公司使用競爭對手事業名稱做為關鍵字廣告，並在關鍵字廣告併列競爭對手事業名稱的行為，認定違反公平交易法第25條規定。此案雖非業者直接使用他人品牌做為關鍵字廣告，但最終呈現的結果，本質上都是「誘導/轉向」的欺罔行為，於是決定開罰。（取自科技新報）
