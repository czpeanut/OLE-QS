  section: 1
  number: 21
  type: single
  page: 4
  stem: 根據文章所述，國際油價市場自戰爭爆發前至戰事爆發後，供需情形應呈現何種趨勢？
  options:
  - label: A
    content: 供給不變，需求持續減少
  - label: B
    content: 供給減少，需求先增後減
  - label: C
    content: 供給增加，需求持續增加
  - label: D
    content: 供給減少，需求持續減少
  group_stem: ◎俄羅斯與烏克蘭戰事尚未停歇，國際能源價格隨戰事拉長而波動不止。美國雖是全球最大產油國，但政府推動能源轉型、業者為求生存不願增產。俄烏戰爭2月24日爆發前，國際油價就因COVID-19疫情趨缓帶動用油需求而走揚。俄羅斯揮軍烏克蘭後持續向歐洲供應石油，但部分煉油廠擔憂歐美政府制裁可能擴大而減少採購俄羅斯原油，促使國際油價在3月上旬衝破每桶130美元大關，攻上13年來最高點。美國、英國為向莫斯科施壓，已禁止進口俄羅斯石油。高度仰賴俄羅斯能源的歐洲聯盟（EU）暫未跟進，但內部已在討論是否要全面封殺俄羅斯石油。
