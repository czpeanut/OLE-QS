  section: 1
  number: 13
  type: single
  page: 2
  stem: 阿園有天到農場購買草莓，阿園的願付價格、農場老闆的願售價格如表格所示。請問依據表格，當市場價格為75時，下列哪些敘述正確？
  options:
  - label: A
    content: 隨著阿園消費的數量增加，個人額外增加的滿足感會愈大
  - label: B
    content: 阿園買了總共3斤的草莓時，生產者剩餘總共為5元
  - label: C
    content: 阿園買了總共2斤的草莓時，消費者剩餘總共為25元
  - label: D
    content: 由於市場價格高於願售價格，老闆不會賣出第2斤的草莓
