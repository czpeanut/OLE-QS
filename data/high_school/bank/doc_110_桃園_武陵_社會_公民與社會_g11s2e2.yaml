  group_stem: ◎許多民眾不解為何夏天電費比較高，台灣電力公司表示，因夏天民生用電需求倍增，必須啟動發電量大的機組，其供電成本比一般發電機高；因此，為了公平反映成本差異，台電參考各國電力公司的模式，每年6月到9月會實施夏季電價，而10月1日起則恢復原價計費。 此外，為了促使民眾節約用電，對於一般家戶用電以累進方式計算電費，共分為6個級距，上表為2021年的電價。受到今年本土疫情影響，居家辦公、上課人數使用電的需求大幅攀升，不少產業受到衝擊，難以負擔高額的電費支出，因此行政院會透過紓困4.0精進方案，依照用電量對服務業、農業用電戶實施減免，一般住宅用戶也取消6、7月的夏季電價，不過只有全月用電數在1000度以下的住戶可享減免，超過1000度的部分仍須按夏季電價收費。
