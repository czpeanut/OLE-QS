- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_25
  section: 1
  number: 25
  type: single
  page: 4
  stem: 文中提及「省下來的成本回饋給消費者」，長期下來形成消費者對品牌平價的印象，若分析消費者對品牌的愛好情況，代表需求線呈現下列哪種移動方式？
  options:
  - label: A
    content: 需求線右移
  - label: B
    content: 需求線左移
  - label: C
    content: 點的移動，右下到左上
  - label: D
    content: 點的移動，左上到右下
  group_stem: ◎宜家家具的創辦人坎普拉（Ingvar Kamprad）17歲的時候用父親給的一點現金開了間樸實的地方家具店。有一天看到4名員工費力地把桌子搬上貨車，他心裡想著：「這太占空間了，該把桌腿先旋開！」這靈光乍現的時刻，使他開創了舉世聞名的家具王國。他試著設計各種客戶可以自己組裝的產品，扁平的封裝大幅減少了運輸的成本。 光是暢銷的比利書架，拆卸後再裝盒運送，整個成本就節省1/7，他把省下來的成本回饋給消費者，使得坎普拉的訂單從此應接不暇。宜家憑著驚人的成本控制能力與數量優勢擊敗了各色的挑戰者，迄今生產了6,000萬組比利書架。如果你覺得書架省了1/7還不夠看，宜家後來推出了一款Bang馬克杯，它的口寬底窄，把手很小，這樣的設計並非全然為了審美上的考量，而是它可以讓馬克杯堆疊起來，讓運送成本減少一半，產品也不容易損壞。當成本變低，你就成了最能夠在市場上生存的生產者。
