- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 聯合行為最著名的案件是多家台灣大企業（如友達電、奇美電子、帝寶車燈等等）被美國政府予以開罰，甚至經營者處以刑罰而到美國服刑的事件。美國也有類似台灣公平交易法的「反托拉斯法（Antitrust Law）」，同樣禁止聯合行為。美國司法部調查發現。有多家亞洲LCD面板廠商透過聚會方式，共同協議達成共同價格並交換市場資訊的結論。而三星率先認罪並作污點證人，證實廠商間有協議行為，而以「窩裡反條款」獲得處罰上的豁免。相較下，友達電則被處以上億的罰金及有期徒刑。請問美國的反托拉斯法對比臺灣的公平交易法何者正確？
  options:
  - label: A
    content: 無須負擔刑事責任，不可能遭判刑
  - label: B
    content: 聯合行為的證據必須為書面的契約
  - label: C
    content: 皆鼓勵參與者協助調查，且可能減免處罰
  - label: D
    content: 都只規範不公平競爭行為，不涉及限制競爭
