  group_stem: ◎世界知名的電動車品牌特斯拉（Tesla）為了以更低成本量產電動車Model3，宣布在美國內華達州、紐約州水牛城與中國上海設立三座超級工廠（Gigafactory）。依照創辦人馬斯克（Elon Musk）的說法，這3座工廠將會是「3臺打造機器的巨型機器」，組裝線上的機器人將承擔大部分工作，這些機器人連充電都能自行計算並自行輪替。投入電動車生產的廠商增加，生產成本變便宜而商品價格下滑。 關於自動化是否引起失業，經濟學家以19世紀鐵路興起為例，當時有一堆馬車夫失業，也有許多人預言這將導致社會動盪不安，因此反對鐵路的鋪設。但從古典經濟學的角度來看，興建鐵路是政府真正該做的事，馬車夫失業反而不是政府該介入的事。馬車夫相關的產業的確受到致命的影響，但就社會整體來說，造樣的損失就是經濟學家熊彼得所稱的「創造性破壞」。社會進步的過程中，總有些人暫時受損，但你如果以為馬車夫永遠只能當馬車夫，那你就太小看人們改善自身處境的能力了。
