- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列何項為有約束力、有效的的價格管制政策？
  options:
  - label: A
    content: 低於勞動市場均衡價格的最低工資管制
  - label: B
    content: 低於稻米市場均衡價格的稻米保證收購價格
  - label: C
    content: 低於租屋市場均衡價格的房租租金上限
  - label: D
    content: 高於油品市場均衡價格的油價上限
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小武目前與父母同住，每個月必要之生活費為1萬元，工作收入2萬5千元。最近有一間新的公司要僱用小武，月新3萬5千元。小武目前沒有搬家的打算，但搭車前往新公司將使生活費提高為1萬5千元。根據以上條件，請問小武選擇新工作的機會成本是多少？
  options:
  - label: A
    content: 2萬元
  - label: B
    content: 3萬元
  - label: C
    content: 4萬元
  - label: D
    content: 5萬元
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 生產可能曲線通常是一條凹向原點的曲線，而較少是一條負斜率的直線。請問：生產可能曲線凹向原點或是呈一條直線的原因為何？
  options:
  - label: A
    content: 直線表示機會成本固定，而凹向原點表示機會成本遞增
  - label: B
    content: 直線表示變動的機會成本，而凹向原點表示機會成本固定
  - label: C
    content: 直線表示機會成本不存在，而凹向原點表示機會成本存在
  - label: D
    content: 機會成本的變化與曲線之形狀及直線無關
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列有關價格管制之敘述，何者正確？
  options:
  - label: A
    content: 保障收購價格制度是屬於價格上限之管制概念
  - label: B
    content: 若採有效價格上限管制，易出現供不應求情況
  - label: C
    content: 有效的價格下限旨在保護生產者利潤，其價格應低於市場均衡價格
  - label: D
    content: 於戰亂或過度通貨膨脹時，政府較易採價格下限手段管制商品價格
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 百貨公司每年都會舉行為期數天的週年慶，這段期間內展場眾多商品都有豐富的折扣優惠，往往吸引大批人潮前來撿好康。像是某些中高價位的衣服，週年慶時只要平日價格的四到八成。請問下列何者較符合對這種「同商品、不同價」情形的說明？
  options:
  - label: A
    content: 週年慶的商品皆已推出一段時間，因技術進步而壓低成本
  - label: B
    content: 週年慶的低價顯示平日的交易都是業者獲利，消費者受害
  - label: C
    content: 週年慶和平日的消費者對同一產品可能有不同的願付價格
  - label: D
    content: 週年慶時人潮增加，產品的需求增加，價格應該上漲才對
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 從全球化下衡量臺商的產業佈局，兩岸政策將對臺商產生推力及拉力，成為臺商考量因素。關於臺商回臺投資的情況，我國運用政策來吸引台商回流。同時中國對臺商的政策及執法態度也影響臺商未來的產業佈局。下列關於兩岸政策對增進在當地設廠的情況，何者運用的誘因類型配對正確？
  options:
  - label: A
    content: 我國為導引台商回台，提供客製化單一化窗口由專人專案協尋土地服務：金錢負向誘因
  - label: B
    content: 我國運用雇主僱用獎助、勞工就業獎勵等津貼，協助補實人力需求：金錢正向誘因
  - label: C
    content: 中國實施「能耗雙控」限電措施，造成在江蘇和廣東臺商減產和違約交貨：金錢正向誘因
  - label: D
    content: 某臺商的化纖紡織、水泥產業，被認定有違法行為，遭罰款和追繳稅款：非金錢負向誘因
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 高雄城中城大火釀成近百人傷亡，也燒出臺灣老舊大樓的安危議題。事故發生前，大樓早已被檢驗出消防設備有缺失，但住民多屬經濟弱勢，無力負擔管理費，因此大樓並未設置管理委員會處理公共安全問題，也是釀成此事故重大傷亡的原因之一。對此，內政部表示將會推動修法，全面盤點高風險建築，並強制要求既有老舊複合式大樓成立管理組織，確保民眾社區居住安全。關於政府因應此公安事故的改善對策，下列分析何者正確？
  options:
  - label: A
    content: 針對住民所製造的私人成本進行直接管制
  - label: B
    content: 課徵皮古稅，利用金錢誘因改善住民行為
  - label: C
    content: 藉由界定權利，使住民將外部成本內部化
  - label: D
    content: 公開資訊讓全國人民掌握危老建築的分布
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「快篩實名制」於4月28日正式上路，每份5劑包裝500元。日前家用快篩劑出現供不應求的情況，快篩實名制，換算1劑等於100元，不過高雄市採購的快篩試劑1劑只要59元，指揮官表示，高雄市採購的快篩試劑是廠商之前給政府共同供應契約的售價，這個價位已逼近廠商成本，且在現在這種情況下，要廠商再調降價格，可能性不高。而實名制外，四大超商等通路販售1劑180元。關於快篩價格變動和市場狀態敘述，何者正確？
  options:
  - label: A
    content: 因需求增加，未來政府仍可能談到1劑59元的價格
  - label: B
    content: 因供不應求，過去高雄市政府採購價格出現1劑59元
  - label: C
    content: 因目前市場達均衡狀態，所以需要政府介入管制快篩價格
  - label: D
    content: 因1劑59元較現在均衡價格低，廠商不願以此價提供商品
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 基本工資審議委員會每年於第三季進行審議，勞方、資方與政府機關、學者一同審議。民國111年基本工資調漲，月薪從新台幣2萬4000元調升至2萬5250元、時薪從160元調升至168元，預估有245萬名勞工受惠。另外，經濟部推動基本工資補貼與業者共體時艱，但也要求事業能夠肩負社會責任，保障員工及兼顧消費者權益，有關基本工資政策的影響，何者正確？
  options:
  - label: A
    content: 政府訂定價格上限會有無謂損失出現
  - label: B
    content: 對所有勞工都帶來有利的就業保障
  - label: C
    content: 將提高雇主成本，勞動供給線左移
  - label: D
    content: 市場雇用的勞工人數可能會減少
- id: doc_110_桃園_武陵_社會_公民與社會_g11s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 為避免生產過剩，我國農糧署會定期監測各種農產品的數量，適時發布「大宗蔬菜播種量及供苗預警資訊」（如下圖），上旬為綠色，中旬為黃色，下旬為紅色。110年8月下旬時高麗菜（甘藍）的供苗量高達594.7萬株，農糧署就發出「紅色燈號警示」，提醒農民目前已接近合理種植數上限，為避免超種可以轉種其他作物。請問農糧署希望避免下列哪一種情況發生，而發布紅色燈號警訊？
  options:
  - label: A
    content: 該農作物的價格飊漲
  - label: B
    content: 種植該作物的生產要素價格上升
  - label: C
    content: 該農作物的價格崩跌
  - label: D
    content: 種植其他農作物的機會成本降低
