  stem: 公民課後，四位同學分別分享上課所聽到的心得，何者敘述較符合我們對於勞動薪資的理解？晶芳：「調整薪資對廠商負擔大，政府不應鼓勵資方透過調整薪資來維持受薪者的購買力。」人碩：「我國薪資計算以貨幣計價，換言之，不會受物價波動的影響。」燕婷：「工資由勞雇雙方共同議定，若不願屈就，就再回到勞動市場重新媒合。」銘哲：「實質報酬是生活及生存的基礎，政府介入自由經濟市場，可以提升經濟效益。」
  options:
  - label: A
    content: 燕婷
  - label: B
    content: 銘哲
  - label: C
    content: 晶芳
  - label: D
    content: 人碩
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
