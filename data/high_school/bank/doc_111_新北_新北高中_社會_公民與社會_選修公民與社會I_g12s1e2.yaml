  group_stem: 2008年全球金融風暴後，因美國貨幣當局已將利率調降至趨於零之低點，讓傳統以改變利率達到調節經濟之措施無法繼續施展，因此改採量化寬鬆政策，作為提振經濟之措施。此政策由美國貨幣當局買入企業發行的債券開始，當由市場購入企業發行的債券後，等同把資金挹注進入金融體系，提高銀行將資金貸放給企業與個人之意願，以刺激投資與消費，進而達到提振經濟之目標。美國並非量化寬鬆措施的發明者，日本為最早實行量化寬鬆政策的國家。至目前為止，量化寬鬆亦是日本政府採用的政策，例如2019年4月，日本中央銀行就提及考慮採取額外的量化寬鬆措施，此舉讓日本股票市場股價指數在當日出現上揚變化。除日本外，歐洲央行也採量化寬鬆因應金融風暴之衝擊。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
