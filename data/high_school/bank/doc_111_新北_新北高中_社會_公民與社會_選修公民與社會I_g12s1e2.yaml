  stem: 隨著金融科技的快速進步，網路借貸平臺無疑地隨之蓬勃發展，所謂P2P（Peer to Peer）借貸又稱為「市場平臺借貸」，意即透過網路平臺，將資金提供者（放款人）提供的放貸資金，貸放給資金需求者（放款人）的一種小額借貸模式。相較於傳統放款流程，打破僅能向銀行或民間機構借貸的限制，透過網路串連借款人，使一般人也可以成為放款人；再者，借款人相對也較容易被核貸、取得的利率也較低；而放款人則能獲得比一般儲蓄還高的利率。如上所述，P2P借貸的發展，對於可貸資金市場而言將產生哪些影響？
  options:
  - label: A
    content: 資金需求線左移
  - label: B
    content: 資金供給線右移
  - label: C
    content: 借貸總額一定上升
  - label: D
    content: 借貸總額不一定下降
  - label: E
    content: 利率一定下降
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
