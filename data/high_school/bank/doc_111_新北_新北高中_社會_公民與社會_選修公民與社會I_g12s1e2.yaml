- id: doc_111_新北_新北高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有鑑於物價持續上漲，勞動部欲以調高基本工資的方式，減輕通貨膨脹對勞工生活水準的影響。請問由勞動市場供需理論看，以下有關基本工資政策的影響，何者正確？
