- id: doc_111_新北_新北高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 2022年COVID-19疫情肆虐全球，臺灣疫情控制得宜，但觀光，餐飲業等仍受重創，加上國外需求下降部分製造業也受到波及；雖然臺灣不像國外出現大規模失業潮，但勞動市場仍受到影響，根據行政院主計總處調查，5月台灣的總人口為2,320萬，勞動人口約為1,190萬，失業人數約達50萬，為近8年同月最高。根據題目所述，判斷下列何者正確？
  options:
  - label: A
    content: 5月就業者約為1,140萬人
  - label: B
    content: 失業人數包含想找工作而未找工作者
  - label: C
    content: 5月的失業率約為6%
  - label: D
    content: 失業率為失業者占總人口之比率
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_111_新北_新北高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 新冠肺炎疫情爆發後，曾有電視節目針對某三代同堂七口之家，做了病毒擴散的模擬實驗，以特殊螢光劑追蹤全家人互動的觸摸軌跡。結果顯示：有六人在兩小時內接觸到的模擬病毒量就已達危險等級，唯獨奶奶平安無事，身上幾無螢光反應。事後分析發現，由於家務主要由奶奶負責，她的雙手一直與水為伍，模擬病毒的螢光劑就一直被水沖掉。節目最後盛讚奶奶家事做得完美，不僅善盡家庭責任，也是防疫表率。然而，評論者指出，這種稱讚僅片面選擇、歌頌特定現象，可謂透過媒體再現強化了性別不平等。依據上文，下列何者能正確描述奶奶的勞動參與以及對GDP統計的影響？
  options:
  - label: A
    content: 雖然屬於非勞動力，但其家務活動價值仍可計入GDP
  - label: B
    content: 雖非就業人口，但其活動屬於重要勞務，可計入GDP
  - label: C
    content: 因其在統計上為非勞動人口，故其活動並不計入GDP
  - label: D
    content: 因其屬於失業人口，故其每日家務生產並不計入GDP
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_111_新北_新北高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 農曆年後，在屏東居住與就業之某甲，離開年薪60萬元之現職另覓工作。今分別收到二份新工作之邀約：屏東年薪70萬元，臺北年薪100萬元。考慮兩地物價與居住成本後，甲決定留在屏東工作。根據經濟學對就業的定義及以上內容，下列敘述何者正確？
  options:
  - label: A
    content: 甲農曆年後另覓工作，仍屬勞動力人口，且處於結構性失業狀態
  - label: B
    content: 甲決定繼續留在屏東工作，係基於名目所得而非實質所得之考慮
  - label: C
    content: 依照甲的現況，甲的年紀應該滿15歲，並且不具有現役軍人身分
  - label: D
    content: 失業率通常在農曆年後上升，此季節性變化與循環性失業提高有關
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
