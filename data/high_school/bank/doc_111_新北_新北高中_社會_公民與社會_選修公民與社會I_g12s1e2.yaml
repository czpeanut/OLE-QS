  stem: 圖(一)及圖(二)中，橫軸為勞工數量，縱軸為工資水準。圖(一)代表甲國之勞動市場供需均衡，均衡工資水準為$P_{L}^{甲}$，均衡勞工數量為$Q_{L}^{甲}$；圖(二)代表乙國之勞動市場供需均衡，均衡工資水準為 $P_{L}^{乙}$，均衡勞工數量為$Q_{L}^{乙}$。假設初始狀況為 $P_{L}^{甲}$高於 $P_{L}^{乙}$，若其他條件不變，二國簽署共同市場協定，允許勞工自由移動。假設兩國勞工具有替代性，且會往高工資水準的勞動市場移動，則勞動市場供需均衡會如何變動？
