- id: doc_111_新北_新北高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 今年初基本工資上調到25,250元，原本理論預測調高基本工資會引發失業，但臺灣今年面對的卻是缺工潮來襲。論者認為這是因為全球半導體短缺，臺灣相關產業的人才需求旺盛，間接吸走了其他產業的人力，加上疫情後有些人選擇離開職場，各行各業突然都缺人。請問下列何者最能正確描繪題文所述近來臺灣勞動市場狀況？
  options:
  - label: A
    content: 臺灣受惠於全球半導體短缺，因而使結構性失業人口大幅減少
  - label: B
    content: 缺工引發換工潮，會出現一些摩擦性失業，但循環性失業減少
  - label: C
    content: 受疫情影響，臺灣的勞動參與率逐漸增加，因而帶動薪資上漲
  - label: D
    content: 提高基本工資有助於生產設備自動化，進而提高整體平均薪資
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_111_新北_新北高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 資金借貸的市場，被稱作為「可貸資金市場」，下列關於該市場的敘述，何者正確？
  options:
  - label: A
    content: 就個別家戶而言，在市場中儲蓄將會大於投資
  - label: B
    content: 就個別廠商而言，在市場中投資將會大於供給
  - label: C
    content: 當市場利率低於均衡水準時，會出現供不應求
  - label: D
    content: 當市場利率高於均衡水準時，會出現超額需求
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_111_新北_新北高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 近期消費者物價指數屢創新高，但銀行存款仍維持低率。不少家庭怨聲載道抱怨著:「錢變薄了。」在資金借貸市場中，關於儲蓄者與借款者的觀點何者正確？
  options:
  - label: A
    content: 對儲蓄者而言，生活成本提高且利率低，希望趕快將錢領出花掉或投資
  - label: B
    content: 對借款者而言，低利率致借貸成本增加，故將減少向銀行借錢避免虧損
  - label: C
    content: 對儲蓄者而言，物價指數提高且利率低，傾向透過儲蓄來避免通膨損失
  - label: D
    content: 對借款者而言，低利率致借貸成本增加，致使投資意願大幅下降
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
