  stem: 怯志工作者也稱為隱藏性失業，有些人曾認真尋職卻屢屢受挫以致失去信心，因此退出勞動市場而成為怯志工作者，相較於失業者，他們更需要社會的關懷與協助。下列關於怯志工作者的敘述，何者正確？
