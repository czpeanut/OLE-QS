  section: 1
  number: 19
  type: single
  page: 3
  stem: 許多國家可能基於某些理由查禁流行歌曲。以臺灣為例，1930年代開始流行以福佬系民謠為創作題材，當時西門町與大稻埕有許多收費不低的音樂廳，傳唱這些歌謠。但部分歌謠後來遭政府以過於寫實、動搖民心為由，予以查禁。1950年代左右，行政院依據《戒嚴法》訂定《臺灣省戒嚴期間新聞雜誌圖書管理辦法》，開始管制流行文化，主要由警備總司令部執行歌曲查禁。如披頭四樂團演唱之〈革命〉便因「內容欠妥，混淆視聽，危害社會治安」遭禁。至1970年代，查禁業務改由新聞局負責，據統計，當時約有六分之一的歌曲因未通過審查而禁唱。到了1980年代，絕大多數歌曲都通過審查，禁唱歌曲大幅減少。面對審查制度，音樂人仍勇於透過流行樂曲批判現狀。曾有外國歌手唱道：「這是最好的年代，所以人民不需要自由」而遭到禁播。有樂評指出，該歌詞字面上說政府讓經濟成長率翻升，表示統治萬能，所以人民也就不需要自由，但實際是諷刺該政府，試圖以經濟成果遮掩其威權統治事實。像這類具批判性的樂曲，多非屬主流文化，常被忽視；但也有作品廣受歡迎，甚至在特定時期帶動反叛精神。請問：以人權保障與法治國原則來看，關於戒嚴時期政府查禁歌曲之相關規定與現象，下列評論何者正確？
  options:
