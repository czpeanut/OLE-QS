  stem: 2019年10月，大法官做出釋字第784號解釋，解釋文提到：「本於憲法第16條保障人民訴松權之意旨，各级學校學生認其權利因學校之教育或管理等公權力措施而遭受侵害時，即使非屬退學或類此之處分，亦得按相關措施之性質，依法提起相應之行政爭訟程序以為救濟，無特別限制之必要。」一名國立高中的學生葛瑞絲因為學期成績未達70分，被學校限制不得繼續參加戲劇社，依大法官解釋之意旨與相關法規判斷，下列何者是葛瑞絲可以尋求的行政救濟管道？
  options:
  - label: A
    content: 依釋字第784號解釋之意旨，若權利受侵害得逕向教育部提起訴願
  - label: B
    content: 先向校內提出申訴，若是申訴評議委員會維持原決議，再向學校的上級機關提出再申訴
  - label: C
    content: 透過學生會在校務會議提案廢止以成績限制社團參與之不合理規定
  - label: D
    content: 由於被限制不得參加社團非屬退學之處分，無法提起相應行政爭訟
