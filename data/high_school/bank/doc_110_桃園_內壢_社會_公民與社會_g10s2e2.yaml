  stem: 小潘隨隊出國比賽，機場安檢時，戲稱：「我行李有炸彈」，迅即遭移送法辦。縱使小潘解釋此純屬玩笑，行李也查無炸彈，仍因散布危害飛航安全之不實訊息，已涉嫌犯罪而面臨法律制裁及當日無法隨隊出境之後果。關於小潘個人基本權利的限制，下列敘述何者正確？
