  stem: 新冠肺炎本土個案確診數目，在111年4月底開始迅速增加，中央流行疫情指揮中心則公布，居家隔離天數縮短為「三加四」定案，「以篩代隔」政策，自最後接觸日隔天起算三天內須強制居隔，居隔第三天須實施快篩，快篩陽性者做PCR採檢禁止搭乘大眾交通工具，可自行開車、騎車或家人親友載送前往；快篩陰性者後四天仍須每天快篩，陰性者可外出工作及採買生活必需品，外出須全程載口罩，但禁止餐廳內用餐、聚餐、聚會、到校上課、前往人潮擁擠場所及與不特定對象接觸。（摘自國語日報2022/4/26）。<u>上述居家檢疫規定會限制人民基本權利，必須有法律依據（該法律為：嚴重特殊傳染性肺炎防治及紓困振興特别條例），使行政機關依法行政</u>。請問上述政府作法畫底線部分符合下列何種法律原則？
