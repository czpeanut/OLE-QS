  type: single
  page: 2
  stem: 公民與社會科上課時，任教老師為使同學能夠徹底理解「法律優位原則」與「法律保留原則」的內涵，舉了兩個案例。 案例一：《勞動基準法》第50條第2項規定，產假期間薪資給付規定是依「工資」給付，然而勞動部則以公文揭示產假工資計算不得低於「平均工資」數額。 案例二：教育部為維護「兒童暨少年之身心健康」，於法律未臻完備之際，基於職權發布命令，規定電動玩具業不得容許未滿18歲之兒童及少年進入其營業場所。 有關上述二項案例，下列選項解釋何者正確？
  options:
  - label: A
    content: 案例一與案例二都是違反法律優位原則
  - label: B
    content: 案例一與案例二都是違反法律保留原則
