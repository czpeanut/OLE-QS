- id: doc_108_高雄_仁武_自然_地科_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關太陽系起源的學說中，何者為星雲學說的解釋？
  options:
  - label: A
    content: 太陽受彗星的撞擊，一大塊物質被撞離後再各自固化成行星
  - label: B
    content: 太陽系起源於一團雲氣，中心收縮而外圍盤狀物質再各自發展為行星
  - label: C
    content: 有一個恆星從太陽旁邊掠過，分裂太陽成若干塊，而後冷卻成行星
  - label: D
    content: 外來星球從太陽表面吸引出的熾熱物質，冷卻成無數的小石塊，這些小石塊互相碰撞積聚，最後變成行星
- id: doc_108_高雄_仁武_自然_地科_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關地球磁層的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 太陽活動激烈時，會影響磁層並引發磁暴
  - label: B
    content: 太陽風被磁層所阻礙，不能直接進入大氣層
  - label: C
    content: 磁層受到太陽風的作用，在背太陽面形成長長的磁尾
  - label: D
    content: 磁層受到太陽風的作用，在地球赤道地區會出現極光
