- id: doc_108_高雄_仁武_自然_地科_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「夏威夷毛納基的山頂被公認為全世界最佳的天文台台址。山頂的位置在40%的大氣和90%的水蒸氣之上，因此有著格外清楚的星空影像。此外，山峰位於逆溫層之上，每年可以有300個晴朗的夜晚；同時，北緯19度的低緯度，幾乎可以看盡南北半球的天空。它是盾狀火山的事實，意味著很容易由陸路運輸抵達山頂。夏威夷島人口的低密度也意味著這兒只有非常輕微的人造污染源。所有的這些因素，造就了毛納基山成為天文科技發展的殿堂。」下列何者<u>不是</u>此地點的適宜觀測的原因？
  options:
  - label: A
    content: 空氣較稀薄，相對溼度低
  - label: B
    content: 可觀測之星空範圍大
  - label: C
    content: 每日的夜晚較其他地區長
  - label: D
    content: 人煙稀少，光害少
