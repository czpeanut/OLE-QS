- id: doc_112_嘉義_永慶_自然_物理_g10s1e1_s3_30
  section: 3
  number: 30
  type: single
  page: 5
  stem: '過去幾次比較大 K 與複製品的質量時，發現大 K 變輕了，依上文中資訊可推得的確切結論為何？（3 分）

    答：＿＿＿＿。'
  options:
  - label: A
    content: 大 K 的質量並未改變
  - label: B
    content: 大 K 的質量變小
  - label: C
    content: 大 K 的質量變大，但其他複製品的質量變得更大
  - label: D
    content: 大 K 的質量變小，但其他複製品的質量變得更小
  - label: E
    content: 無法確認大 K 質量的變化
  group_stem: '國際單位對於科學發展是極為重要的。試想兩地區使用不同單位，卻無法相互轉換，就無法確認實驗的可重複性了。過往質量的標準單位，是由人工打造的國際公斤原器所定義，暱稱大 K，是鉑銥合金製成的圓柱體。大 K 有很多複製品，送往世界各地以利質量的校準，臺灣在 1995 年取得第 78 個複製品，目前擺放在新竹工研院內的「國家度量衡標準實驗室」。

    為了確保質量單位的準確，過去大 K 與其複製品曾重聚了三次，以進行比對。經過同樣的擦拭清洗流程，科學家不安地發現，大 K 不知為何比它的孿生兄弟輕了一些：大約是 50μg，約略是一粒沙的差距。你或許覺得這沒什麼好大驚小怪的，但在許多精準的科學與工程設計中，這樣的誤差是無法容許的。更重要的是，這不僅只是質量的問題，只要因次中含有質量，該物理量的精確度就會受到影響。幸好自 2019 年 5 月 20 日起，新的 SI 以 7 個基本常數重新定義 7 個基本單位，大 K 終於功成身退，科學家也不必再擔心大 K 到底胖了還是瘦了！'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '根據題意可知：大 K 比複製品輕 50μg。

    (1)有可能大 K、複製品皆變輕，但大 K 比複製品更輕。

    (2)有可能大 K、複製品皆變重，但大 K 比複製品更輕。

    (3)有可能複製品沒變，大 K 變輕。

    (4)有可能大 K 沒變，複製品變重。

    由以上推論，可知無法確切知道大 K 質量的變化，故選(E)。'
