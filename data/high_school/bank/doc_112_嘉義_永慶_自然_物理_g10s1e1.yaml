  page: 4
  stem: 下列哪些是弱核力的特性？（應選 2 項）
  options:
  - label: A
    content: 弱核力為四種基本交互作用中強度最弱的
  - label: B
    content: 弱核力屬短程作用力
  - label: C
    content: 在低能量狀態下，弱核力即為作用力很小的電磁交互作用
  - label: D
    content: 弱核力過程中可產生新粒子
  - label: E
    content: α衰變為弱核力現象的一種
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)重力最弱。

    (B)作用範圍小於 $10^{－18}$ m，屬短程作用力。

    (C)在日常生活中（低能量狀態），電磁交互作用與弱核力為不同的基本交互作用，強度：電磁交互作用大於弱核力。當能量數量級超過 100 GeV 時，電磁力與弱核力統合為電弱作用力。

    (D)中子 → 質子＋電子＋反微中子

    (E)β衰變為弱核力現象的一種。'
