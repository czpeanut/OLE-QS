- id: doc_110_新北_新北高中_自然_生物_選修生物III_g12s1e3_s2_58
  section: 2
  number: 58
  type: multiple
  page: 5
  stem: 注入食鹽水短時間內，血液內$Na^{＋}$濃度有何變化？為什麼？
  options:
  - label: A
    content: $Na^{＋}$濃度增加，因為食鹽水含$Na^{＋}$
  - label: B
    content: $Na^{＋}$濃度增加，因為腎臟再吸收$Na^{＋}$
  - label: C
    content: $Na^{＋}$濃度下降，因為是注入低張食鹽水
  - label: D
    content: $Na^{＋}$濃度下降，因為腎臟再吸收水
  group_stem: '◎水與體內鹽類濃度變化

    若大量喝水使身體吸收大量水後，尿液的量會明顯增加。除了尿量增加外，身體內還會發生什麼事？血液與尿液的鹽類濃度會有什麼變化？

    某研究者以大鼠作為實驗動物，在大鼠麻醉的情況下從膀胱與動脈分別收集血液與尿液樣本，並分析樣本內$Na^{＋}$與$K^{＋}$的濃度，以及大鼠在單位時間所排出的尿液體積；研究者以這些數據作為對照組。

    為了探討身體吸收大量水後，對血液與尿液的鹽類濃度，以及產生尿液的體積有何影響；在大鼠仍在麻醉的情況下，由其靜脈注入大量的低張食鹽水溶液。30分鐘後再從膀胱與動脈分別收集血液與尿液樣本，並分析樣本內$Na^{＋}$與$K^{＋}$的濃度，以及單位時間所排出的尿液體積；這些數據作為實驗組。對照組與實驗組的比對、可讓研究者知道血液與尿液內的鹽類濃度變化。其樣本內$Na^{＋}$與$K^{＋}$的濃度如附表，請依此表與習得的知識回答下列問題。'
