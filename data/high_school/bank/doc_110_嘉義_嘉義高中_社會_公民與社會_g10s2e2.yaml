- id: doc_110_嘉義_嘉義高中_社會_公民與社會_g10s2e2_s2_41
  section: 2
  number: 41
  type: single
  page: 4
  stem: 根據上述《憲法訴訟法》首宗判決的說明，下列何者正確？
  options:
  - label: A
    content: 憲法法庭判決《道路交通管理處罰條例》相關規定違憲，表示該法條自判決公告日起即刻失效
  - label: B
    content: 花蓮地院法官審理案件時發現擬適用的法律有違憲疑義時，須取得確定終局裁判之後才可以聲請釋憲
  - label: C
    content: 和以前釋憲不同，現在改以「憲法法庭」方式審理，再以裁判宣告審理結果
  - label: D
    content: 人民無法提出釋憲聲請，只有各級法院法官可以聲請釋憲
  group_stem: '(三)憲法訴訟法上路，首宗判決出爐。花蓮地院法官認為肇事駕駛人受強制抽血檢測酒精濃度有違憲疑慮，聲請釋憲，憲法法庭判決道路交通管理處罰條例相關規定違憲。

    修正前道路交通管理處罰條例第35條第5項規定，「汽機車駕駛人肇事拒絕接受或肇事無法實施第一項測試之檢定者，應由交通勤務警察或依法令執行交通稽查任務人員，將其強制移由受委託醫療或檢驗機構對其實施血液或其他檢體之採樣及測試檢定。」道路交通事故處理辦法等也有相關規定。

    花蓮縣林姓男子於民國105年1月間在住處飲酒後騎乘機車出門，不慎因擦撞排水溝而自撞電線桿，民眾報警後，林男被送醫急救，由於林男受傷無法實施酒精測試，警方以抽血檢驗酒精濃度超標，移送法辦。全案起訴後由花蓮地方法院審理，花蓮地方法院吳姓法官認為，「強制抽血」性質上應屬於干預人民基本權的強制處分，但並無事前聲請令狀或事後向法院聲請令狀的規定。道交條例等違反法治國原則下「法官保留」，也與憲法正當法律程序的「令狀原則」不符，且違反憲法第22條保障人民之資訊隱私權、免於身心受傷的基本權，向大法官聲請釋憲。

    憲法法庭判決，修正前道交條例第35條第5項規定牴觸憲法第8條保障人身自由、第22條保障身體權及資訊隱私權意旨。

    判決表示，原規定應自本判決公告之日起，至遲於屆滿2年時失其效力。又本判決公告前，已依上開規定實施相關採證程序而尚未終結之各種案件，仍依現行規定辦理。

    判決指出，相關機關應自本判決公告之日起2年內，依本判決意旨妥適修法。自本判決公告之日起2年期間屆滿前或完成修法前之過渡階段，交通勤務警察就駕駛人肇事拒絕接受或肇事無法實施吐氣酒測，認有對其實施血液酒精濃度測試，以檢定其體內酒精濃度值之合理性與必要性時，其強制取證程序之實施，應報請檢察官核發鑑定許可書始得為之。

    判決表示，情況急迫時，交通勤務警察得將其先行移由醫療機構實施血液檢測，並應於實施後24小時內陳報該管檢察官許可，檢察官認為不應准許者，應於3日內撤銷之；受測試檢定者，得於受檢測後10日內，聲請該管法院撤銷之。'
  tags:
    unit:
      code: CI-2-3-3
      book: 公民與社會2 正義與法治
      chapter: 憲法與權利保障
      title: 憲法規範公權力
      std: true
    textbook: 公民與社會2 正義與法治 憲法規範公權力
    labeled_by: agent
    label_confidence: high
