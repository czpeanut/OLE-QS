  number: 2
  type: multiple
  page: 1
  stem: 設A、B、C為平面上相異三點，r、s為實數，$\vec{AP}$＝r$\vec{AB}$＋s$\vec{AC}$，請選出正確的選項？
  options:
  - label: A
    content: x、y為實數，若$\vec{AP}$＝x$\vec{AB}$＋y$\vec{AC}$，則x＝r且y＝s
  - label: B
    content: 若r＝$\frac{1}{2}$且s＝1，則P點在$\overline{AB}$上
  - label: C
    content: 若r ≥ 1且s＝1，則P點所成圖形是一直線
  - label: D
    content: 若0 ≤ r ≤ 1且s＝1，則P點所成圖形是一線段
  - label: E
    content: 若0 ≤ r ≤ 1且0 ≤ s ≤ 2，則P點所成圖形的面積是△ABC面積的2倍
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
