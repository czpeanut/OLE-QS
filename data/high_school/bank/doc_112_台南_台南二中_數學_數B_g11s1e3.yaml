- id: doc_112_台南_台南二中_數學_數B_g11s1e3_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 已知四邊形ABCD是平行四邊形，請選出正確的選項？
  options:
  - label: A
    content: $\vec{AB}$．$\vec{AC}$＝$\vec{AD}$．$\vec{AC}$
  - label: B
    content: 若 |$\vec{AB}$|＝|$\vec{AD}$|，則$\vec{AC}$．$\vec{BD}$＝0
  - label: C
    content: 若 |$\vec{AC}$|＝|$\vec{BD}$|，則$\vec{AB}$．$\vec{AD}$＝0
  - label: D
    content: 若 |$\vec{AC}$|＝|$\vec{BD}$|，則ABCD為正方形
  - label: E
    content: 若 |$\vec{AC}$＋$\vec{BD}$|＝|$\vec{AC}$－$\vec{BD}$|，則ABCD為正方形
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：$\vec{AC}$．($\vec{AB}$－$\vec{AD}$)＝0 ⇒$\vec{AC}$．$\vec{DB}$＝0 ⇒ 對角線$\overline{AC}$和$\overline{DB}$垂直 (B) ○：此時ABCD為菱形，其對角線互相垂直 ∴$\vec{AC}$．$\vec{BD}$＝0 (C) ○：此時對角線等長，表示ABCD為矩形 ∴$\vec{AB}$．$\vec{AD}$＝0 (D) ×：為矩形 (E) ×：兩邊平行 |$\vec{AC}$|$^{2}$＋2$\vec{AC}$．$\vec{BD}$＋|$\vec{BD}$|$^{2}$＝|$\vec{AC}$|$^{2}$－2$\vec{AC}$．$\vec{BD}$＋|$\vec{BD}$|$^{2}$ 使得$\vec{AC}$．$\vec{BD}$＝0，對角線互相垂直，又ABCD為平行四邊形，得對角線也互相平分 ∴ ABCD為菱形 故選(B)(C)。
