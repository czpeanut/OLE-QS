- id: doc_112_台南_台南二中_數學_數B_g11s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 已知平面上四點A、B、C、D，請選出正確的選項？
  options:
  - label: A
    content: 若$\vec{AB}$＋$\vec{CD}$＝$\vec{0}$，則$\overline{AB}$＝$\overline{CD}$
  - label: B
    content: 若 |$\vec{AB}$|＝|$\vec{CD}$|，則$\vec{AB}$//$\vec{CD}$
  - label: C
    content: 若$\vec{AB}$－$\vec{AC}$＝$\vec{BC}$，則$\vec{BC}$＝$\vec{0}$
  - label: D
    content: 若$\frac{1}{3}\vec{AB}$＋$\frac{2}{3}\vec{AC}$＝$\vec{AD}$－$\vec{AC}$，則$\overline{BD}$：$\overline{CD}$＝1：2
  - label: E
    content: 若$\vec{AB}$．$\vec{AC}$＝$\vec{AB}$．$\vec{AD}$，則$\vec{AC}$＝$\vec{AD}$
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：|$\vec{AB}$|＝|－$\vec{AC}$| ⇒ $\overline{AB}$＝$\overline{CD}$ (B) ×：未必平行，例$\vec{AB}$＝( 1 , 0 )，$\vec{CD}$＝( 0 , 1 ) (C) ○：$\vec{CB}$＝$\vec{BC}$ ∴$\vec{BC}$＝$\vec{0}$ (D) ×：$\frac{1}{3}\vec{AB}$－$\frac{1}{3}\vec{AC}$＝$\vec{AD}$－$\vec{AC}$，$\frac{1}{3}\vec{CB}$＝$\vec{CD}$ ∴$\overline{BD}$：$\overline{CD}$＝2：1 (E) ×：內積無消去律 故選(A)(C)。
- id: doc_112_台南_台南二中_數學_數B_g11s1e3_s1_2
