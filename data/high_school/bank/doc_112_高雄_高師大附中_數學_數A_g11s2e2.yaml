- id: doc_112_高雄_高師大附中_數學_數A_g11s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 對於空間坐標中直線 L：$\frac{x -2}{1}=\frac{y +3}{-2}=\frac{z -1}{3}$，下列哪些敘述是正確的？
  options:
  - label: A
    content: 點（3，－5，－2）在 L 上
  - label: B
    content: L 與$\frac{x +2}{1}=\frac{y +3}{2}=\frac{z +7}{1}$互為歪斜線
  - label: C
    content: L 與$\begin{cases}x -y -z=-1 \\ x +2y +z=0\end{cases}$平行
  - label: D
    content: L 與$\frac{x +2}{1}=\frac{y +3}{2}=\frac{z -1}{1}$交於一點
  - label: E
    content: L 與$\frac{x +2}{1}=\frac{y +3}{2}=\frac{z -1}{1}$垂直
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：（3，－5，－2）代入$\frac{x -2}{1}=\frac{y +3}{-2}=\frac{z -1}{3}$

    得$\frac{1}{1}$＝$\frac{-2}{-2}$≠$\frac{-3}{3}$

    可知（3，－5，－2）不在直線 L 上

    (B) ╳：∵兩直線方向向量不平行

    ∴兩直線為相交或歪斜

    計算 L 的參數式$\begin{cases}x = 2+t \\ y =-3 -2t \\ z =1 +3t\end{cases}$，t ∈ R

    代入另一直線得$\frac{4+t}{1}$＝$\frac{-2t}{2}$＝$\frac{8+3t}{1}$

    可得 t＝－2，故兩線相交於（0，1，－5）

    (C) ○：$\vec{n_{E_{1}}}$＝（1，－1，－1），$\vec{n_{E_{2}}}$＝（1，2，1）

    $\vec{n_{E_{1}}}$×$\vec{n_{E_{2}}}$＝$\left( \left| \begin{matrix}-1 & -1 \\ 2 & 1\end{matrix} \right| , \left| \begin{matrix}-1 & 1 \\ 1 & 1\end{matrix} \right| , \left| \begin{matrix}1 & -1 \\ 1 & 2\end{matrix} \right| \right)$＝（1，－2，3）

    可知$\vec{n_{E_{1}}}$×$\vec{n_{E_{2}}}$和 L 之方向向量平行

    又 L 上一點（2，－3，1）不在 x－y－z＝－1 上

    故兩線平行

    (D) ╳：將 L 的參數式代入另一直線

    得$\frac{4+t}{1}$＝$\frac{-2t}{2}$＝$\frac{3t}{1}$

    ∵$\frac{4+t}{1}$＝$\frac{-2t}{2}$⇒ t＝－2，$\frac{-2t}{2}$＝$\frac{3t}{1}$⇒ t＝0 ∴無解

    故兩線歪斜

    (E) ╳：由選項(D)可知兩線歪斜，故不垂直

    故選(C)'
