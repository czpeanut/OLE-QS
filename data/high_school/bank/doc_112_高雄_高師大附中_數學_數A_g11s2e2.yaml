  stem: 甲班有 40 位同學，座號 1 到 40 號。期末同樂會時舉辦摸彩活動，摸彩箱中有 40 支籤，其中 5 支有獎。現在從 1 號、2 號、3 號、……、40 號，按照順序輪流抽籤（取後不放回），試問下列哪些選項正確？
  options:
  - label: A
    content: 40 號中獎的機率最低
  - label: B
    content: 1 號中獎的機率高於 2 號中獎的機率
  - label: C
    content: 1 號、2 號均中獎的機率為$\frac{1}{78}$
  - label: D
    content: 在 1 號中獎的條件下，2 號中獎的機率為$\frac{4}{39}$
  - label: E
    content: 在 2 號中獎的條件下，3 號中獎的機率為$\frac{1}{13}$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：每一號中獎機率一樣高

    (B) ╳：每一號中獎機率一樣高

    (C) ○：所求為$\frac{5\times 4}{40\times 39}$＝$\frac{1}{78}$

    (D) ○：P（2 中∣1 中）＝$\frac{P (1 中 \cap 2 中)}{P (1 中)}$＝$\frac{\frac{5}{40}\times \frac{4}{39}}{\frac{5}{40}}$＝$\frac{4}{39}$

    (E) ╳：所求和 P（2 中∣1 中）相同，亦為$\frac{4}{39}$

    故選(C)(D)'
