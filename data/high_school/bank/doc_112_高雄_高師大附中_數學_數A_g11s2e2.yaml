- id: doc_112_高雄_高師大附中_數學_數A_g11s2e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 投擲一個均勻的骰子，設 A 表示出現奇數點的事件，B 表示出現偶數點的事件，C 表示出現 1 點或 2 點的事件，下列哪些選項正確？
  options:
  - label: A
    content: P（A∣B）＝0
  - label: B
    content: P（A∣C）＝$\frac{1}{2}$
  - label: C
    content: A、B 是獨立事件
  - label: D
    content: A、C 是互斥事件
  - label: E
    content: B、C 是獨立事件
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'P(A)＝$\frac{1}{2}$，P(B)＝$\frac{1}{2}$，P(C)＝$\frac{1}{3}$，

    P（A∩B）＝0，P（A∩C）＝$\frac{1}{6}$，P（B∩C）＝$\frac{1}{6}$

    (A) ○：P（A∣B）＝$\frac{P (A \cap B)}{P (B)}$＝$\frac{0}{\frac{1}{2}}$＝0

    (B) ○：P（A∣C）＝$\frac{P (A \cap C)}{P (C)}$＝$\frac{\frac{1}{6}}{\frac{1}{3}}$＝$\frac{1}{2}$

    (C) ╳：∵P（A∩B）＝0≠P(A)×P(B)＝$\frac{1}{4}$

    ∴A，B 不獨立

    (D) ╳：∵P（A∩C）≠0 ∴A，C 非互斥

    (E) ○：∵P（B∩C）＝$\frac{1}{6}$＝$\frac{1}{2}\times \frac{1}{3}$＝P(B)×P(C)

    ∴B，C 獨立

    故選(A)(B)(E)'
