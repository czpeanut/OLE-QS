- id: doc_112_高雄_高師大附中_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 坐標空間中有一平面 P 過（0，0，0）、（3，2，1）及（3，2，－1）三點。試選出正確的選項。
  options:
  - label: A
    content: 向量（3，2，0）與平面 P 垂直
  - label: B
    content: 平面 P 與平面 6x＋4y－z＝7 垂直
  - label: C
    content: 點（0，－6，－4）在平面 P 上
  - label: D
    content: 平面 P 包含 z 軸
  - label: E
    content: 點（－5，1，3）到平面 P 的距離是$\sqrt{13}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '令 A（0，0，0），B（3，2，1），C（3，2，－1）

    則$\vec{AB}$＝（3，2，1），$\vec{AC}$＝（3，2，－1）

    ⇒$\vec{AB}$×$\vec{AC}$＝$\left( \left| \begin{matrix}2 & 1 \\ 2 & -1\end{matrix} \right| , \left| \begin{matrix}1 & 3 \\ -1 & 3\end{matrix} \right| , \left| \begin{matrix}3 & 2 \\ 3 & 2\end{matrix} \right| \right)$＝（－4，6，0）//（2，－3，0）

    故平面 P 的方程式為 2x－3y＝0，$\vec{n_{P}}$＝（2，－3，0）

    (A) ╳：∵（2，－3，0）．（3，2，0）＝0

    ∴$\vec{n_{P}}$⊥（3，2，0）⇒ 平面 P 平行（3，2，0）

    (B) ○：∵（2，－3，0）．（6，4，－1）＝0

    ∴平面 P⊥平面 6x＋4y－z＝7

    (C) ╳：（0，－6，－4）代入得 0＋18≠0

    故（0，－6，－4）不在平面 P 上

    (D) ○：從 z 軸上任取兩點（0，0，1），（0，0，2）皆在平面 P 上，可知平面 P 包含 z 軸

    (E) ○：d（（－5，1，3），P）＝$\frac{| -10-3 |}{\sqrt{2^{2}+(-3)^{2}+0^{2}}}$＝$\sqrt{13}$

    故選(B)(D)(E)'
