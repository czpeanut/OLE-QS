questions:
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列哪一項反應過程需消耗ATP分子？
  options:
  - label: A
    content: 糖解作用
  - label: B
    content: 主動運輸
  - label: C
    content: 丙酮酸氧化成乙醯輔酶A
  - label: D
    content: 胺基酸氧化作用
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(D)會產生ATP；(C)會產生NADH。故選(B)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列細胞內的結構，何者具有雙層膜？
  options:
  - label: A
    content: 高基氏體
  - label: B
    content: 溶體
  - label: C
    content: 內質網
  - label: D
    content: 細胞核
  - label: E
    content: 液泡
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)(E)均為單層膜。故選(D)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 四根試管各加入2 mL的澱粉溶液，a、c兩管加入2 mL的新鮮唾液，b、d加入2 mL的蒸餾水，實驗裝置如附圖，分別在四根試管內加入碘液，在充分的反應結果下，哪幾管的溶液顏色不會變藍色？
  options:
  - label: A
    content: a
  - label: B
    content: b
  - label: C
    content: ac
  - label: D
    content: bd
  - label: E
    content: bcd
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 237.9
      - 217.05
      - 329.25
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 不會變藍色表示澱粉已分解，a管唾液含有澱粉酶可分解澱粉，不會變藍色；b、d管無酵素可分解澱粉，為藍色；c管酵素已破壞，澱粉無法分解，為藍色。故選(A)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 人體胚胎發育的過程中，約在第五週時手指及腳趾的蹼會慢慢消失，該區細胞凋亡。依據上述，請問主要是細胞中哪種胞器的功能所造成？
  options:
  - label: A
    content: 粒線體
  - label: B
    content: 溶體
  - label: C
    content: 中心體
  - label: D
    content: 高基氏體
  - label: E
    content: 內質網
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)細胞凋亡來自溶體內的水解酶。故選(B)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有關酵素之敘述，下列何者正確？
  options:
  - label: A
    content: 酵素主為小分子有機物
  - label: B
    content: 酵素在代謝反應中扮演催化劑的角色
  - label: C
    content: 酵素是激素的一種
  - label: D
    content: 酵素只在動植物細胞內才有活性
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為大分子有機物；(C)酵素非激素；(D)試管中也有活性。故選(B)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列何者是紫外線造成皮膚癌變的原因？
  options:
  - label: A
    content: DNA分子的吸光波長與紫外線波長有重疊
  - label: B
    content: 紫外線會破壞皮膚所需的維生素A
  - label: C
    content: 紫外線因波長較短因而無法提供皮膚細胞足夠的能量
  - label: D
    content: 紫外線會遮蔽可見光對皮膚細胞的修復能力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)DNA可吸收波長260 nm的紫外光；(B)會產生維生素D；(C)(D)波長短能量高會破壞皮膚細胞。故選(A)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 螢火蟲發光與電鰻放電與細胞中那種分子最相關？
  options:
  - label: A
    content: 核酸
  - label: B
    content: 葡萄糖
  - label: C
    content: ATP
  - label: D
    content: 磷脂質
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)螢火蟲發光需要消耗ATP發生氧化反應，從而產生螢光；(B)(C)(D）較無關。故選(C)
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 構成生物體體內的主要物質有水、醣類、蛋白質、脂質和核酸，還有少量的維生素及無機鹽類。這些物質與生物體的新陳代謝、生長、生殖、適應等生命現象有關。下列有關上述物質的敘述，何者錯誤？
  options:
  - label: A
    content: 核酸是與遺傳有關的重要物質
  - label: B
    content: 生物體內的醣類、脂質、蛋白質、核酸等為含碳的有機物質
  - label: C
    content: 維生素是綠色植物維持生命所必要的物質，須由自然界吸收
  - label: D
    content: 細胞膜主要由蛋白質及脂質所組成，可控制細胞內外物質的進出
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)可自行製造。故選(C)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 從有機化合物分子的組成判斷，生物體內哪三種元素含量最多？
  options:
  - label: A
    content: 碳、氮、氧
  - label: B
    content: 氫、氧、硫
  - label: C
    content: 磷、氮、氧
  - label: D
    content: 碳、氫、氧
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 組成元素比例：氫59％，氧24％，碳11％。故選(D)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 葉綠體是綠色植物或藻類細胞內的一種胞器，下列有關其構造的敘述何者正確？
  options:
  - label: A
    content: 葉綠體是由單層膜所構成的
  - label: B
    content: 每個類囊體由數個葉綠餅堆疊而成
  - label: C
    content: 胞器內含有DNA分子
  - label: D
    content: 類囊體膜所包含的空間中充滿了半液體狀的物質，稱為基質
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)葉綠體為雙層膜；(B)每個葉綠餅為數個類囊體堆疊而成；(D)類囊體腔。故選(C)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列關於有氧呼吸和發酵作用的比較，何者正確？
  options:
  - label: A
    content: 發酵作用全部在細胞質中進行
  - label: B
    content: 有氧呼吸全部在粒線體中進行
  - label: C
    content: 有氧呼吸產生的丙酮酸較發酵作用多
  - label: D
    content: 有氧呼吸和發酵作用產生的能量一樣多
  - label: E
    content: 酵母菌可進行發酵作用，無法進行有氧呼吸
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)粒線體及細胞質中進行；(C)一樣多；(D)有氧呼吸產生的能量較多；(E)酵母菌可進行有氧呼吸。故選(A)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 水的何種特性可使魚類在冰天雪地的冬天安然生存於湖泊下層？
  options:
  - label: A
    content: 最佳溶劑
  - label: B
    content: 比熱大
  - label: C
    content: 強的內聚力
  - label: D
    content: 0℃密度較液態水小，冰浮於上層
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)水在4℃時密度最大，故0℃時密度小，冰會浮在上層。故選(D)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 下列哪個敘述只會出現在精子形成的過程，而不會發生於皮膚細胞的增生？
  options:
  - label: A
    content: 紡錘體的形成
  - label: B
    content: 同源染色體的配對
  - label: C
    content: 同源染色體濃縮變短
  - label: D
    content: 姊妹染色體的形成
  - label: E
    content: DNA複製
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)精子形成為減數分裂，皮膚細胞增生為有絲分裂，同源染色體配對為減數分裂的特徵。故選(B)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 科學家在河口生態系發現新種草履蟲，觀察得知其伸縮泡在原生環境下每分鐘約收縮30次，這種草履蟲在淡水中也可以存活一段時間。試問此蟲在淡水時其伸縮泡每分鐘收縮次數為何？為什麼？
  options:
  - label: A
    content: 大於30次，因為草履蟲處在更低張的液體內
  - label: B
    content: 大於30次，因為草履蟲處在更高張的液體內
  - label: C
    content: 小於30次，因為草履蟲處在更低張的液體內
  - label: D
    content: 小於30次，因為草履蟲處在更高張的液體內
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 淡水為低張溶液，故伸縮泡收縮次數會大於30次。故選(A)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 附圖為真核細胞行呼吸作用的代謝路徑，請以代號回答。甲、乙、丙、丁過程中，何者需要氧的參與？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  - label: E
    content: 甲乙
  assets:
  - key: s1_16_f1
    kind: figure
    file: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1/s1_16_f1.png
    crop:
      page: 2
      rect:
      - 54.9
      - 314.9
