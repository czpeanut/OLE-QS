- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_29
  section: 1
  number: 29
  type: single
  page: 4
  stem: 正常細胞和癌症細胞在呼吸作用上有何差別？
  options:
  - label: A
    content: 前者進行葡萄糖酒精發酵，而後者進行葡萄糖有氧呼吸
  - label: B
    content: 前者在氧氣充足情形下能大多進行乳酸發酵，而後者乳酸發酵的代謝途徑比例增加到85％
  - label: C
    content: 前者使用葡萄糖作為有氧呼吸原料，而後者使用胺基酸為原料
  - label: D
    content: 前者葡萄糖直接進入粒線體產生能量，而後者糖解作用後再進入粒線體
  group_stem: '正常動物細胞80％是透過粒線體的有氧呼吸途徑來產生能量，只有小部分是透過乳酸發酵進行葡萄糖的分解代謝，但因為癌細胞對於能量的高度需求，讓葡萄糖走向乳酸發酵的代謝途徑比例增加到85％，原本透過粒線體的有氧呼吸途徑只剩下5％左右，科學家將此種現象稱作瓦氏效應（Warburg effect）。這種偏向快速產生能源的代謝途徑轉變現象，幾乎存在於所有癌細胞中，科學家研究與前列腺癌及乳癌發生有高度相關的致癌因子JMJD5，發現它能和控制癌細胞生長的「守門人」酵素$PKM_{2}$結合，影響細胞新陳代謝的路徑，進一步促進腫瘤生長。因此，如果以JMJD5為分子標靶降低其表現量，有機會將癌細胞不正常的代謝路徑還原，使腫瘤生長速度減慢。

    JMJD5是如何影響PKM2的呢？在氧氣充足的情況下，絕大部分的葡萄糖通過PKM2酵素的轉換成能量與二氧化碳，但JMJD5會與PKM2酵素結合，轉化為腫瘤形態之PKM2酵素，這使得PKM2酵素失去功能，讓癌細胞轉而產生乳酸，將細胞的正常代謝途徑的門關上。這不但改變了癌細胞的代謝途徑，過程中累積的中間代謝產物（如胺基酸、核酸及脂質）也成為有利於癌細胞生長的原料，這也就是為什麼過多葡萄糖的攝取會促進腫瘤生長的原因。研究中，除了發現JMJD5與PKM2間的調控關係外，更發現此兩種酵素會共同參與調控癌細胞葡萄糖代謝所需酵素的基因表現。有些研究嘗試以PKM2作為分子標靶來抑制腫瘤生長，但直接以PKM2為標靶可能會影響到位於細胞質中正常PKM2酵素的活性。因此，科學家嘗試改以shRNA降低乳癌細胞JMJD5酵素的表現量，發現乳癌細胞出現葡萄糖攝取率降低、乳酸釋出量減少、增生減緩等現象，這表示乳癌細胞的葡萄糖分解代謝途徑已隨之改變了。（參考資料：國家衛生研究院電子報，第555期）

    試根據上文回答下列問題：'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)正常細胞進行葡萄糖有氧呼吸，癌細胞進行葡萄糖乳酸發酵；(D)糖解作用後才會進入粒線體。故選(C)。
