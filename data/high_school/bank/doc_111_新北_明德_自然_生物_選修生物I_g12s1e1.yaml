  explanation: 甲為糖解作用；丁為酒精發酵；丙為乳酸發酵；乙為呼吸作用，最後階段將電子傳給氧氣，產生$CO_{2}$及$H_{2}$0。故選(B)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 小明觀察單胞藻與藍綠菌，下列敘述何者正確？
  options:
  - label: A
    content: 兩者的細胞膜均有兩層磷脂排列組成
  - label: B
    content: 兩者均具葉綠體，可行光合作用
  - label: C
    content: 兩者細胞膜內側的醣類不同，可作為辨識用
  - label: D
    content: 藍綠菌缺粒線體，故無法行有氧呼吸
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)藍綠藻是原核生物，沒有葉綠體；(C)醣類位於細胞膜外側；(D)可利用細胞膜進行有氧呼吸。故選(A)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 綠色植物於白天進行呼吸作用，其電子傳遞過程中的電子由何處來？此電子最後將會傳給何物？
  options:
  - label: A
    content: NADH；$O_{2}$
  - label: B
    content: $CO_{2}$；NADP＋
  - label: C
    content: $H_{2}$O；NADP＋
  - label: D
    content: $H_{2}$O；NADPH
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)(D)$NADP^{＋}$及NADPH為光合作用所需的輔酶，非呼吸作用。故選(A)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有關細胞分裂期含有細胞核分裂和細胞質分裂，下列的敘述，何者正確？
  options:
  - label: A
    content: 有絲分裂期介於S期與G2期之間
  - label: B
    content: 細胞核分裂時間比細胞質分裂期短
  - label: C
    content: 細胞核分裂是複製染色體的分離、而細胞質分裂是胞器等物質的分配
  - label: D
    content: 染色體複製發生於有絲分裂開始時
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)介於$G_{1}G_{2}$之間；(B)細胞核分裂時間較長；(D)發生於間期。故選(C)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 癌細胞是一種不斷分裂的異常細胞。某科學家探討維生素C對癌細胞生長的影響，在癌細胞培養液中加入維生素C，再於不同時間計算正在進行有絲分裂的細胞百分比（％），結果如附圖。依據實驗結果，下列關於維生素C的作用，何者正確？（對照組細胞不加維生素C）
  options:
  - label: A
    content: 可有效抑制癌細胞進入有絲分裂期
  - label: B
    content: 使癌細胞無法完成有絲分裂
  - label: C
    content: 使癌細胞的有絲分裂期提前完成
  - label: D
    content: 延長細胞進行有絲分裂的時間
  assets:
  - key: s1_20_f1
    kind: figure
    file: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1/s1_20_f1.png
    crop:
      page: 2
      rect:
      - 54.9
      - 703.5
      - 257.65
      - 824.8
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 對照組在約10小時，有絲分裂細胞百分比就下降，維生素C組則在接近20小時，百分比才下降。故選(D)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 下列有關染色質複製時的狀態，何者正確？
  options:
  - label: A
    content: 此時為細胞分裂的間期
  - label: B
    content: DNA複製而蛋白質不增加
  - label: C
    content: 染色質套數增加兩倍
  - label: D
    content: 此時染色質已濃縮為染色體
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)蛋白質也會增加；(C)DNA量增加，套數不變；(D)分裂時才會濃縮為染色體。故選(A)。
- id: doc_111_新北_明德_自然_生物_選修生物I_g12s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 下列有關細胞凋亡的敘述，何者錯誤？
  options:
  - label: A
    content: 屬於細胞有計畫性的死亡過程
  - label: B
    content: 會經歷細胞萎縮、DNA破碎化
  - label: C
    content: 蝌蚪尾巴消失和蜥蜴斷尾皆屬於細胞凋亡
  - label: D
    content: 癌細胞的細胞凋亡程序和正常細胞不同
  - label: E
