- id: doc_109_新竹_新竹女中_數學_數B_g11s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 已知$\vec{a}$、$\vec{b}$、$\vec{c}$為平面上三個<u>非零向量</u>，則下列敘述哪些是正確的？
  options:
  - label: A
    content: 若$\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$，則$\vec{b}$＝$\vec{c}$
  - label: B
    content: 若（$\vec{a}$．$\vec{b}$）．$\vec{c}$＝（$\vec{a}$．$\vec{c}$）．$\vec{b}$，則$\vec{b}$＝$\vec{c}$
  - label: C
    content: 若$\vec{a}$⊥$\vec{b}$，則∣$\vec{a}$＋$\vec{b}$∣＝∣$\vec{a}$－$\vec{b}$∣
  - label: D
    content: 若∣$\vec{a}$∣＝∣$\vec{b}$∣，則（$\vec{a}$＋$\vec{b}$）．（$\vec{a}$－$\vec{b}$）＝0
  - label: E
    content: 若α$\vec{a}$＋β$\vec{b}$＝$\vec{0}$，其中α，β為實數，則α＝β＝0
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：反例：$\vec{a}$＝（1，1），$\vec{b}$＝（2，－1），$\vec{c}$＝（3，－2）

    則$\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$＝1，但$\vec{b}$≠$\vec{c}$

    (B) ╳：反例：$\vec{a}$＝（1，1），$\vec{b}$＝（2，－1），$\vec{c}$＝（4，－2）

    則（$\vec{a}$．$\vec{b}$）$\vec{c}$＝（$\vec{a}$．$\vec{c}$）$\vec{b}$＝（4，－2），但$\vec{b}$≠$\vec{c}$

    (C) ○：∵$\vec{a}$⊥$\vec{b}$ ⇒ $\vec{a}$．$\vec{b}$＝0

    ∴∣$\vec{a}$＋$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋∣$\vec{b}$∣$^{2}$

    且∣$\vec{a}$－$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$－2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋∣$\vec{b}$∣$^{2}$

    故∣$\vec{a}$＋$\vec{b}$∣＝∣$\vec{a}$－$\vec{b}$∣

    (D) ○：（$\vec{a}$＋$\vec{b}$）．（$\vec{a}$－$\vec{b}$）＝∣$\vec{a}$∣$^{2}$－∣$\vec{b}$∣$^{2}$＝0

    (E) ╳：反例：$\vec{a}$＝（2，－1），$\vec{b}$＝（4，－2），則－2$\vec{a}$＋$\vec{b}$＝$\vec{0}$

    即α＝－2，β＝1 均不為 0

    故選(C)(D)'
