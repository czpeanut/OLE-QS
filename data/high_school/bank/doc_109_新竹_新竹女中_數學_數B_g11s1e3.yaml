  answer_status: verified
  answer_source: answer_key
  explanation: '令∣$\vec{AC}$∣＝∣$\vec{BD}$∣＝a，B 為（0，b）

    ⇒ C（－1＋a，0），D（0，a＋b）

    ∵$\vec{BC}$＝$\vec{AB}$＋$\vec{AD}$

    ∴（－1＋a，－b）＝（1，b）＋（1，a＋b）

    ⇒ $\begin{cases}-1+a =1+1 \\ -b =b+a+b\end{cases}$ ⇒ $\begin{cases}a =3 \\ b =-1\end{cases}$

    得 A（－1，0），B（0，－1），C（2，0），D（0，2）

    (A) ○：2$\vec{AB}$＝（2，－2）＝$\vec{DC}$

    (B) ○：∵$\overline{OA}$：$\overline{OC}$＝$\overline{OB}$：$\overline{OD}$ 且∠AOB＝∠COD

    ∴△AOB～△COD

    (C) ╳：應為（2，0）

    (D) ╳：$\vec{AB}$．$\vec{AD}$＝（1，－1）．（1，2）＝－1

    (E) ○：cos∠BAD＝$\frac{\vec{AB} \cdot \vec{AD}}{| \vec{AB} | | \vec{AD} |}$＝$\frac{-1}{\sqrt{10}}$ ⇒ tan∠BAD＝－3

    故選(A)(B)(E)'
