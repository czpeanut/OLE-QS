  stem: 如右圖（此為示意圖），已知四邊形 ABCD 中，$\vec{BC}$＝$\vec{AB}$＋$\vec{AD}$， $\vec{AC}$⊥$\vec{BD}$且∣$\vec{AC}$∣＝∣$\vec{BD}$∣。若假設射線 AC 為 x 軸正向， 射線 BD 為 y 軸正向，O 為原點且 A 點坐標為（－1，0）， 則下列敘述哪些是正確的？
