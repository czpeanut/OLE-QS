  stem: 有三種重量莫耳濃度均為0.1 m的水溶液：(甲)食鹽（NaCl）水溶液、(乙)尿素（CO($NH_{2}$)$_{2}$）水溶液、(丙)醋酸（$CH_{3}$COOH）水溶液，則有關此三種溶液性質的比較，下列哪些正確？
