- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 工業區排放的廢水中常含有毒的金屬離子，某工廠排放的廢水經採樣化驗，與0.10 M的$SO_{4}^{2－}$或$Cl^{－}$均不沉澱，但與0.10
    M的$OH^{－}$則會沉澱，此廢水採樣中所含的哪種金屬離子符合化驗結果？
  options:
  - label: A
    content: $Pb^{2＋}$
  - label: B
    content: $Ag^{＋}$
  - label: C
    content: $Cu^{2＋}$
  - label: D
    content: $Ba^{2＋}$
  - label: E
    content: $Na^{＋}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $PbSO_{4}$(s)↓，$PbCl_{2}$(s)↓ (B) AgCl(s)↓ (C) $CuSO_{4}$(aq)，$CuCl_{2}$(aq)，而Cu(OH)$_{2}$(s)↓
    (D) $BaSO_{4}$(s)↓ (E)均不會沉澱。故選(C)。
