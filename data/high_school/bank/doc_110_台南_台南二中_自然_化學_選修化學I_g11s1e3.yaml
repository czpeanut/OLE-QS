- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 附圖為不揮發性、非電解質之溶質甲溶於溶劑乙所成各種不同重量莫耳濃度與溶液凝固點之關係圖，下列何項<u>錯誤</u>？
  options:
  - label: A
    content: 溶劑乙之莫耳凝固點下降常數$K_{f}$＝$20^{ }$℃／m
  - label: B
    content: 直線之斜率大小等於$K_{f}$值
  - label: C
    content: 更換溶劑可改變圖中直線之斜率
  - label: D
    content: A點為6克甲／300克乙，則甲之分子量為50
  - label: E
    content: 加入溶劑乙稀釋該溶液並不能改變圖中直線之斜率
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $K_{f}$＝| 斜率 |＝$\frac{ 8－4 }{ 0.2－0 }$＝20（℃／m）； (B)同(A)； (C) $K_{f}$受溶劑影響；
