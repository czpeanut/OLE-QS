- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 血液的平均滲透壓在$37^{ }$℃約為7.7大氣壓，下列相關的敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 為病人靜脈注射葡萄糖水溶液時，葡萄糖濃度最好約為03 M
  - label: B
    content: 若靜脈點滴的水溶液中，只含有等莫耳數的葡萄糖及食鹽，食鹽濃度最好約為0.1 M
  - label: C
    content: 將人的紅血球置入0.2 M NaCl水溶液中（$37^{ }$℃），紅血球會膨脹
  - label: D
    content: 剛吃飽時，血液的平均滲透壓會升高，然後會再降低
  - label: E
    content: 靜脈注射時，注射溶液之滲透壓若大於血液的滲透壓，紅血球會皺縮
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: π＝$iC_{M}$RT (A) $C_{6}H_{12}O_{6}$ i＝1 7.7＝1 × $C_{M}$ × 0.082 × (
    37＋273 ) ⇒ $C_{M}$≒0.3 M； (B)等莫耳數 ∴ $C_{6}H_{12}O_{6}$與NaCl之濃度相等 7.7＝( 1 × $C_{M}$＋2
    × $C_{M}$ ) × 0.082 × ( 37＋273 ) ⇒ $C_{M}$≒0.1 M； (C)水由（$iC_{M}$）小的往（$iC_{M}$）大的方向移動
    ∴紅血球萎縮； (D)剛吃飽濃度變大； (E)水由π小往π大方向移動 ∴紅血球萎縮。故選(C)。
