- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 托里切利水銀氣壓計可以量測大氣壓力，也可以用來量測揮發性液體的蒸氣壓。其方式如附圖所示：在固定溫度的情況下，用針筒將液體慢慢地從汞柱下方注入，每次僅注入少量的液體，並且要在注射完後，等待液體蒸發達到平衡。不斷重複此步驟，直到在汞柱表面看到一層薄薄的液體後，即可藉由汞柱下降高度得此液體在此溫度下的飽和蒸氣壓。已知$25^{
    }$℃時，水的飽和蒸氣壓為24 torr，乙醚的飽和蒸氣壓為545 torr。下列相關的敘述，何者正確？
  options:
  - label: A
    content: 若汞柱表面有液體出現，則注入液體為水時，汞柱下降程度比注入乙醚時大
  - label: B
