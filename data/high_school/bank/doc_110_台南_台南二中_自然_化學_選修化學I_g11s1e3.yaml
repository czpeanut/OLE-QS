- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列哪一組化合物，在$0^{ }$℃、1大氣壓條件下，能共存於同一容器内而<u>不發生</u>變化？
  options:
  - label: A
    content: $H_{2}$O(l)、$NH_{3}$(g)
  - label: B
    content: $NH_{3}$(g)、HCI(g)
  - label: C
    content: $CO_{2}$(g)、Ca(OH)$_{2}$(aq)
  - label: D
    content: $AgNO_{3}$(aq)、$K_{2}CrO_{4}$(aq)
  - label: E
    content: $KNO_{3}$(aq)、$CaCl_{2}$(aq)
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「豆子煮軟前就加糖，會使豆子緊縮而不易煮爛」的道理，與下列何者涉及的原因相同？
  options:
  - label: A
    content: 用真空蒸發器，低溫下將牛奶除去水分以製奶粉
  - label: B
    content: 入冬前，松樹會在葉片內貯存大量糖分，使寒冬時松葉長青不凍
  - label: C
    content: 去除蛋殼的雞蛋，置於清水中，雞蛋逐漸膨脹
  - label: D
    content: 戶外烤肉將粗大木炭敲成細塊，能較快升火
  - label: E
    content: 汽水是以高壓將大量二氧化碳溶入水溶液中，再予以裝瓶冷藏
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '$AgNO_{3}$(aq)＋$K_{2}CrO_{4}$(aq) → $Ag_{2}CrO_{4}$(s)＋2 $KNO_{3}$(aq)。故選(E)。

    2. (A)壓力降低，沸點降低； (B)濃度愈高，Δ$T_{f}$下降愈多； (C)與滲透壓有關； (D)接觸面積大，反應速率快； (E)加壓，氣體在水中溶解度變大。
    而題目與滲透壓有關，故選(C)。'
