- id: doc_110_台南_台南二中_自然_化學_選修化學I_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 將500毫升乙醇（密度為0.8克／毫升）和500毫升水混合，所得溶液密度為0.92 g／$cm^{3}$。則下列敘述何者正確？
