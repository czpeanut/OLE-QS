  stem: 星巴克為著名的咖啡連鎖店，全球分店超過 2 萬間。若用 GIS 協助分店位址分析，條件是：①地價或租金便宜；②最好距離主要交通中心不遠，步行 10 分鐘以內可達；③與其他競爭店面有適當距離。若要達成以上目標，在疊圖分析前，可依次運用 GIS 的哪些分析？
  options:
  - label: A
    content: 查詢→服務區→環域
  - label: B
    content: 查詢→環域→環域
  - label: C
    content: 地形→環域→路徑
  - label: D
    content: 路徑→查詢→地形
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「地價或租金便宜」屬於屬性查詢。「主要交通中心步行 10 分鐘內可到達」，乃利用路網分析內的服務區分析，計算交通中心在路網上步行 10 分鐘可到達的服務區範圍。「與其他店面有適當距離」，可將店面視為點，以此點設定一定範圍做出點環域，此環域的範圍內不開設店面。故選(A)查詢→服務區→環域。
