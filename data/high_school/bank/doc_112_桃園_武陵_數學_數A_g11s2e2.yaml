  stem: <u>小智</u>觀察正立方體形狀的橡皮擦，如圖正立方體橡皮擦平放在桌面上，此正立 方體的邊長為6，而四邊形ABCD是某一平面截此正立方體所得的截面圖形。 已知ABCD是平行四邊形，若A、B、C三點到桌面的距離分別為0 , 3 , 4 (1) 求D點到桌面的距離為何＿＿＿＿。 (2) 求平行四邊形ABCD面積＿＿＿＿。
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_112_桃園_武陵_數學_數A_g11s2e2/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 485.95
      - 310.25
      - 599.55
      - 417.85
  answer:
  - (1) 1；(2) 6$\sqrt{46}$
  answer_status: verified
  answer_source: answer_key
  explanation: 取坐標：A ( 0 , 0 , 0 )，B ( 6 , 0 , 3 )，C ( 6 , 6 , 4 ) 設D ( 0 , 6 , t ) $\vec{AD}=\vec{BC}$ ⇒ ( 0 , 6 , t )＝( 0 , 6 , 1 )，得t＝1 (1) D到桌面的距離為1。 (2) $\vec{AB}$＝( 6 , 0 , 3 )，$\vec{AD}$＝( 0 , 6 , 1 ) 平行四邊形ABCD面積為 $\sqrt{|\vec{AB}|^{2}|\vec{AC}|^{2}-(\vec{AB} \cdot \vec{AC})^{2}}$＝$\sqrt{1656}$＝6$\sqrt{46}$ [註] 由$|\vec{AB} \times \vec{AD}|$＝| (－18 , －6 , 36 ) |＝6$\sqrt{46}$。
