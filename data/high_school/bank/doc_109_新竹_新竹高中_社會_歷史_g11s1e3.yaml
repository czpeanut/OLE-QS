  group_stem: '◎以下是兩則同一時期西方認識非西方世界的紀實或資料：

    資料一：迪琪十九歲到美國念大學時，室友被她嚇壞了。她（指室友）問我去哪學這麼標準的英文，我回答，奈及利亞這個國家的官方語言剛好是英文時，她還一臉疑惑。她請我放放我的「部落音樂」，结果看到我拿出瑪麗亞凱莉的時候，整個大感失望。她想當然地認為我不會用爐子、也以為非洲是沒有網際網路的世界。我突然意識到，她還沒見過我就已經可憐我了。她對我這個非洲人的預設立場是可憐、好意的憐憫；我室友對非洲有個單一故事，就是它充滿災難。在這單一故事裡，容不下非洲與她有任何相似之處，容不下除了憐憫之外的態度。

    資料二：「東方主義」是指透過建構東方的陳述，把關於東方的視點權威化，描述它、講授它、定位它並進而統治它的一整套話語系統及其協作機構。以至於「任何一個書寫或作用於東方的人，如果不接受東方主義所強加於思想與行為的限制，就不能書寫或作用於東方」也因如此，這個被建構的「東方」就不可能是真正的東方。'
