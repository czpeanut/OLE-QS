  group_stem: ◎以下是關於某個城市從1920年代以來所展現的日常生活變遷： 資料一：城市裡的國會辨公大樓刻意跨越河的兩岸，象徴國家的統一與民主，而在兩棟建築之間的河岸，可以看到一排白色十字架做成的紀念牌，紀念著過去從城市另一處投奔自由而在此地被射殺的犠牲者。城裡也圈起許多舊建築、打造了不少紀念園區，要從圈出来的空間，帶人回溯時間長河裡的過往…… 資料二：那時，大約85%的人只負擔得起每星期上電影院1-2次。戰爭當時，中產階級曾把大筆的金錢投資於戰事公債，結果損失慘重。戰爭結束初期出現的惡性通膨，掃除了中產階級消費者，使得大部分的人民實在沒有太多的錢。幾年後，經濟雖開始復甦，這座城市卻因突如其來的經濟泡沫化陷入混亂。 資料三：地下鐵路和地上鐵路相互交叉連貫，從城市的一邊穿越到另一邊的時候，整個過程都受到嚴格的監控，車站的建構十分複雜，讓人摸不著方向，不同的鐵軌被完全區隔開來，通往城市兩邊的軌道保持分離，當走下火車朝出口移動的時候，必須不斷地變化方向和樓層……
