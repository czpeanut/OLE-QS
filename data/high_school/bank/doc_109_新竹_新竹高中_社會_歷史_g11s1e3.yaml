  stem: 右圖是冷戰時期蘇聯對於附庸國的鎮壓，當時此地的共產黨領導人企圖進行改革，宣稱要建設「帶有人性面孔的社會主義」，一時之間全國洋溢著改革的活力與氣息，但是這項運動在剛起步沒多久就被蘇聯的T-54坦克碾壓了。這應是哪一國家？
  options:
  - label: A
    content: 捷克
  - label: B
    content: 芬蘭
  - label: C
    content: 希臘
  - label: D
    content: 法國
