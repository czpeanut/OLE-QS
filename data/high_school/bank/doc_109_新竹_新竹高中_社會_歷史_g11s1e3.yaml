- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 十九世紀的一位英國政治人物在某時期提到：「遠方來的旅客一定會覺得很詫異，因為他會發現，一個不過是塊小土墩的地方，就得選出兩名議員……不過，等他到了北英格蘭，他的詫異就會變成吃驚了，因為在那些富庶繁華的城鎮上，人們會告拆他，這些地方沒有代表人民的國會議員。」請問，這種狀況在下列哪一次改革或事件後有所改變？
  options:
  - label: A
    content: 1832年國會改革
  - label: B
    content: 1848年憲章運動
  - label: C
    content: 1867年國會改革
  - label: D
    content: 1884年國會改革
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 一份出自十九世紀的文件主張：「如果歐洲列強企圖把其制度擴張到本半球的任何區域，我們便認為此舉危及我們的和平與安全。對於歐洲任何國家現有的殖民地與附屬國，我們不曾干涉過，今後也不會干涉。但是對於有些已經宣布獨立並維護其獨立的政府，我們憑正義的原則，已經予以承認。任何歐洲國家旨在壓迫這些政府，或以任何其他方式控制其命運，都是對美國不友好的表現。」此主張的背景為何？
  options:
  - label: A
    content: 歐洲列強準備干預拉丁美洲國家獨立
  - label: B
    content: 歐洲各國在非洲大獵威脅大西洋安全
  - label: C
    content: 新帝國主義國家在中國劃分勢力範圍
  - label: D
    content: 第一次世界大戰德國慫恿墨西哥反美
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 右圖是十九世紀某一會議的現場描繪。判斷這是哪一會議？其協商的內容為何？
  options:
  - label: A
    content: 維也納會議，列強重新調節各列強的權力以建立均勢體系
  - label: B
    content: 巴黎和會，英法逼迫俄羅斯放棄對巴爾幹半島諸國的控制
  - label: C
    content: 法蘭克福和會，法國承認普王威廉一世為德意志帝國皇帝
  - label: D
    content: 柏林會議，與會各國對非洲問題達成「有效占領」的共識
