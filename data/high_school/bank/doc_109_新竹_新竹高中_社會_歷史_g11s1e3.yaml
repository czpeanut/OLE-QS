- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 某一事件後，1958年美國成立太空總署，投入更多資金培養人才與技術研發。1961年，美國即刻啟動以登陸月球為目標的阿波羅計畫，1969年，阿波羅11號成功讓阿姆斯壯登上月球，將月球漫步影像傳回地球。文中提到的某一事件，底下哪個描述最為適合？
  options:
  - label: A
    content: 蘇聯搶先發射史普尼克一號
  - label: B
    content: 破獲蘇聯間諜竊取美國的機密
  - label: C
    content: 雷根提倡星際大戰的具體行動
  - label: D
    content: 拍攝星際電影來作為文化對抗
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「□年某個早上，我安靜地坐在閣樓努力寫作我的劇本，突然有位朋友上氣不接下氣地跑進來，嘴裡喊著：『你居然還坐在這裡！你不知道外面發生什麼事嗎？』『不知道，發生什麼事？』『法國人已經趕走○國王，建立共和政體了。」……整個廣場只有熱切的交談聲。我們聚集在廣場上要做什麼呢？也許沒有人知道。但是，既然法國人已經趕走國王○，建立共和政體，日耳曼應該也要有所行動才是。維也納也傳來好消息，當地的大學生首先起義，向奥國首相爭取自由與公民權。大街小巷皆發生流血事件，造成梅特涅首相的下臺。」以上為歐洲某位劇作家的回憶錄，關於□和○應該各自為何？
  options:
  - label: A
    content: □是1830；○是查理十世
  - label: B
    content: □是1830；○是亨利十八
  - label: C
    content: □是1848；○是路易菲力
  - label: D
    content: □是1848：○是路易拿破崙
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 「大約在建立德意志帝國時，俾斯麥發現自己面對著兩個嶄新的政黨，分别為『中央黨』和『社會民主黨』。……社會民主主義構成了一個工人階級政黨，有意建立一個截然不同的社會，打算在德意志國的框架內進行革命。但俾斯麥痛恨革命，他想要的是一個階級社會，並希望自己所屬的階級在那社會中享有領導地位，不過願意與其他階級妥協。……俾斯麥嘗試運用建設性的手段來應對社會民主黨，1880年代推出了一系列的□制度，他希望國家改善了工人社會處境以後，就能夠把他們從社會民主黨那邊爭取過來。」根據這段文章，應如何理解俾斯麥？
  options:
  - label: A
    content: 一個自由主義者，為了打擊政敵而實施勞工保險制度
  - label: B
    content: 一個自由主義者，為了社會穩定實施了窮人救濟制度
  - label: C
    content: 一個保守主義者，為了社會穩定實施了窮人救濟制度
  - label: D
    content: 一個保守主義者，為了打擊政敵而實施勞工保險制度
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 一戰期間，有些德國士兵先是在他們的戰壕與聖誕樹上擺上了蠟燭，並唱起聖誕頌歌來慶祝；英國士兵則唱他們自己語言的聖誕頌歌做為回禮，接著兩邊開始互相對彼此喊著祝賀聖誕節的話語。很快地，雙方在無人地帶開始有一些的交流，士兵們互相交換起食物、香菸和酒等小禮物，還有像是鈕扣與帽子等來作為紀念品。這種行為被稱為「聖誕節休戰」，這樣活動產生的主要原由為何？
  options:
  - label: A
    content: 交戰國實施堅壁清野，使前線士兵物資匱乏相互交換
  - label: B
    content: 對於交戰雙方的士兵而言，節慶與戰爭皆為同等重要
  - label: C
    content: 德國疲勞轟炸英倫，再利用聖誕的宗教活動軟化英軍
  - label: D
    content: 壕溝戰使戰事陷入僵局，以節慶交流表達出厭戰心態
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: ○戰爭是美國歷史上最恥辱的一章，戦爭罪行的概念本身就是美國的發明。美國在此犯下了很多戰爭罪行，為了殲滅共黨人士不惜屠村，有報導指出在一村莊殺347至504位男女老幼及嬰兒，亦有輪姦和割解屍體等案情。事件剛發生後，美軍還稱滅共大成功。然而，這卻引起國內強大的反戰聲浪，最終，拖了數年後，美國狼狽退出戰事。這場戰爭是？
  options:
  - label: A
    content: 中國國共內戰
  - label: B
    content: 朝鮮半島戰爭
  - label: C
    content: 越南戰爭
  - label: D
    content: 波灣戰爭
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 冷戰初期，一位政治人物針對某一議題的演說如下：「希特勒一開始就以種族理論開啟了戰爭，他宣稱只有講德語的人才能構成完整的國家。邱吉爾先生也正打算以種族理論發動戰爭，他指出說英語的國家才是真正被神召來統治世界的國家。……從本質上說，邱吉爾和他在英國和美國的朋友們向非英語國家表達了類似的結論；如果你們願意承認我們的支配地位，那麽世界的一切就會變得更有秩序；如果不承認，那走上戰爭是不可避免的事。」依據内容判斷，這段話和底下哪位政治人物有關？
  options:
  - label: A
    content: 杜魯門對於「圍堵政策」的主張
  - label: B
    content: 史達林針對「鐵幕演講」的回應
  - label: C
    content: 甘迺迪在西柏林激勵人心的演講
  - label: D
    content: 卡斯楚在古巴飛彈危機時的作為
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 一本談論到德意志建國書提到：「1848年後，□和普魯士成為了德國問題的競爭對手，普魯士的政策自然是偏向『小德意志』，有時甚至只著眼於日耳曼北部；與此相反，□若意欲主宰一個統一的德意志國，同時維持自己的多民族國家特質，就必須以『超級大德國』為目標。」□應該是哪一個國家？
  options:
  - label: A
    content: 法國
  - label: B
    content: 丹麥
  - label: C
    content: 奧國
  - label: D
    content: 義大利
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 十九世紀，東印度公司以豬油、牛油混合的潤滑油塗在步槍的子彈紙皮包裝上。在裝彈之前，士兵又必須用牙齒來咬破步槍子彈的紙皮，令士兵們感到受了極大侮辱。密拉特城的士兵因公開拒絕使用這種子彈遭到逮捕，從而引發了密拉特起義。上述的事件應發生於何地？
  options:
  - label: A
    content: 美國屬地菲律賓
  - label: B
    content: 英國統治的印度
  - label: C
    content: 法屬的索馬利亞
  - label: D
    content: 荷蘭殖民的印尼
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 某次戰爭之後，戰勝國要求：挑起戰事者要割地、賠款。有人呼籲：如果賠償金額遠超出發動戰爭者所能承擔，一定會造成經濟困境，引發民怨，無論任何一方都難逃捲入的命運，甚至引發下一場戰爭。不幸言中，不久之後，各國又捲入衝突之中。底下何項最適合這段描述的内容？
  options:
  - label: A
    content: 1815年維也納會議，梅特涅維護歐洲秩序
  - label: B
    content: 1871年普法戰爭後，俾斯麥想要修辱法國
  - label: C
    content: 1919年巴黎和會，法國對德國的報復措施
  - label: D
    content: 1945年二次大戰後，美國推動馬歇爾計畫
- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 在拉丁美洲這塊土地上，我們看到的不是資本主義原始的幼年時期，而是資本主義血腥的衰敗。不發達並非發達的階段，他是發達的結果。這裡的不發達來自他人的發達，現在他還在養活他人的發達。可以這麼說，從地理大發現以來，這個地區的一切先是被轉化為◎的資本，而後又轉化為□的資本，並在遙遠的權力中心積累。導致持續依附的枷鎖變得越來越沉重，遠遠超出雙重鎖鍊的桎梏。請問，◎與□分別是？
  options:
  - label: A
    content: 歐洲、英國
  - label: B
    content: 美洲、日本
  - label: C
    content: 美洲、中國
