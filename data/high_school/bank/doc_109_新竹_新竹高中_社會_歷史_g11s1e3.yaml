- id: doc_109_新竹_新竹高中_社會_歷史_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 此時，這個國家再次爆發了思想的革命，成了世界許多如反殖民主義、性別平等等現代進步思想的發源地。和當年其他國家一樣，國內那些感到被社會無形壓迫，想要推翻一切，建立烏托邦的學生們，雖沒有在政治上立刻取得具體成果，而且眾多的政治訴求反而讓當時國内派系更加分裂。不過，後來國内女性的解放，社會更加開放，企業中勞資關係進一步改善，工人的待遇和保護提高，這都與當時風暴不無關係。上述的運動發生在何時何地？
  options:
  - label: A
    content: 1920年代，柏林
  - label: B
    content: 1940年代，紐約
  - label: C
    content: 1960年代，巴黎
  - label: D
    content: 1980年代，倫敦
