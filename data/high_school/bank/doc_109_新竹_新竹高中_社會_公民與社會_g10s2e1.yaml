  group_stem: 已滿十八歲的阿錩即將在今年八月行使其人生中的第一個投票權～公民投票，阿錩已在荒野保護協會等環保團體的倡議與遊說下，在藻礁公投案連署人名冊上進行了連署（公投文如下）。支持藻礁公投案者認為，由無節珊瑚藻死亡鈣化逐漸沉積成的藻礁生長緩慢，大潭藻礁是經過7600年的生長才有現今的規模，其豐富的生態養育近百種生物，抱括保育類的柴山多杯孔珊瑚、綠蠵龜與台灣白海豚等，一旦破壞即無法挽回。但經濟部和桃園市市政府的說法為目前開發範圍已從前朝政府的230多公頃縮減至23公頃，以避開藻礁區域，若終止此項政策重新選址，將推遲至少十年，恐影響供電。但環保團體不認同政府說法，而阿錩目前也仍無法判斷兩方所提供的資訊是否充足、論點何者較為真確，因此對於如何投下他人生第一張公投票仍需深思一番。 公投主文：您是否同意第三天然氣接收站遷離桃園大潭藻礁海岸及海域？（即北起觀音溪出海口，南至新屋溪出海口之海岸，及由上述海岸最低潮線往外平行延伸五公里之海域）
