  stem: 請問題文中我國政府金對政府針對新冠疫情採取的政策措施，何者為正確敘述？
  options:
  - label: A
    content: 居家隔離或檢疫屬於外部成本內部化的政策
  - label: B
    content: 每日一千元的防疫補償是正向的非金錢誘因
  - label: C
    content: 違反隔離規定處以罰鍰是負向的非金錢誘因
  - label: D
    content: 防疫補償乃欲藉由補貼以使外部效益內部化
  group_stem: 新冠肺炎（COVDI-19）於2019年12月在中國傳出首例病患後，疫情急速擴散至全球名國。我國政府為抑止疫情擴散，依法對感染高危險群採取居家隔離、居家檢疫、集中隔離、集中檢疫或其他之要措施，遵守隔離或防疫相關規定者，可申請防疫補償每日1000元。但卻有部分民眾違反居家隔離或檢疫的管制措施，逕自離家外出，因而遭處罰鍰。 嚴峻的疫情使得疫苗成為各國冀望的解方，世界衛生組織（WHO）祕書長譚德賽2021年3月5日於報紙撰文表示，支持取消新冠肺炎疫苗的商業專利，以使各國可以廉價生產和出售其他國家發明的疫苗，但此舉遭到歐美國家和各大藥廠的強烈反對。而美國東北大學也預測，若富裕國家購買了前20億劑疫苗，將會減少33％的死亡人口，但如果將這些疫苗分給所有國家，則將減少61％的死亡人口。 隨著疾病擴散迅速，多國居民也感到恐慌，且浮現排華心理以及相關衝突事件，甚至各國媒體也出現對華人的歧視語言。有專家學者對此現象分析指出：中國崛起為全球經濟和軍事強國，引發亞洲鄰國以及西方大國人民的不它，而對疫情的恐懼，則更加文大了人們對中國的潛在敵視。而不幸的是，3月17日美國喬治亞州發生一起白人持槍闖進亞裔按摩店的槍殺事件，8名死者中有6名是亞裔女性，其中4位為韓裔、2位為華裔，兇嫌雖否認行兇動機是針對亞裔人士，但已造成當地亞裔人士充滿恐懼和痛楚。
