  section: 1
  number: 29
  type: single
  page: 4
  stem: 請問有關原住民族傳統智慧創作專用權的闡釋，下列何者最為「不適當」？
  options:
  - label: A
    content: 賦予原住民族或部落有關文化方面的集體權利
  - label: B
    content: 為了維護多元文化而使原住民族擁有權利能力
  - label: C
    content: 回復原住民族原有地位與權利以實踐轉型正義
  - label: D
    content: 擁有傳統祭舞專用權可使個別原住民賴以維生
  group_stem: 花蓮縣阿美族「奇美部落」於20198年4月依據《原住民族傳統智慧創作保護條例》（原創條例），向原住民族委員會（原民會）申請將「勇士（Ciopihay）服飾和Pawali祭歌與舞蹈」（勇士舞）登記為傳統智慧創，其後經原民會認定、登記並公告成為勇士舞此傳統智慧創作的專用權人。但2018年8月1日原民會主辦的南島民族論壇開幕典禮中，舞者穿著奇美部落勇士服飾、表演勇士階級之Pawali祭歌與舞蹈，該專用權代表人都元俊等人認為原民會未經授權同意即表演，且舞蹈表演時由錯誤的人進㣔領唱，也違反了權利內涵中有關「表演時機」的要求，亦即「勇士階級的舞蹈及歌曲必須在嚴肅的步時祭儀，或以奇美部落為主體的對外展下才能演出，且領唱和舞蹈的人都有嚴格的部落階級限制，否則可能對祖先不敬或造成農作物歉收」，因此主張其智慧創作專用權受到侵害，而對原民提起訴訟；原民會則主張其為「合理使用」，目的是為了「強化與南島友邦之文化連結，以促進文化發展」，認為並沒有侵權。目前此案仍於法訴訟程序中。
  tags:
