  group_stem: 阿錩在「深究與實作」課程想探討名國有關同性戀者是否可以合法結婚的議題時，看到下列這篇新聞報導：「汶萊於2019年4月公布實施伊斯蘭刑事法典（SPCO），其中一項為針對同性性行為處以石刑（亂石砸死）的刑罰，雖然同性戀行為在汶萊長年即是犯法行為，但過去最高僅被判處十年徒刑。此項新法的公布汶萊同性戀者處於極度的恐懼之中，甚至連跟親近朋友訴說或出櫃都不敢，以免傳至工作同仁間而影響工作表現與升遷、甚至被公石裁員」。阿錩和同學們分享後，有了下列的討論。 阿錩：誇張耶，汶萊政府在制定政策法律時，都沒有考慮其對性別和性傾向的影響！ 阿華：對啊，而且對同性戀者使用「石刑」的方式來處死，讓們一點(甲)都沒有！ 阿樹：我知道聯合國、國際人權觀察組織及影視明星都強力批評甚至抵制汶萊企業。 阿兵：是啊！終於迫使汶萊蘇丹（國家元首兼總理）在該年日公布暫緩實施此項法律！
