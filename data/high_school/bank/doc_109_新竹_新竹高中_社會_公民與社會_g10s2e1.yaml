  stem: 請問有關阿錩和鮭魚世代的相關敘述，何者為正確？
  options:
  - label: A
    content: 阿錩因為父母反對而無法改名，是因為阿錩還不具有權利能力
  - label: B
    content: 阿錩不是法律的權利主體，故無法依據個人的獨立意志去改名
  - label: C
    content: 壽○郎的促銷活動不僅對鮭魚世代也對其他世代具有強大誘因
  - label: D
    content: 某位民眾將自己的名字改為「張鮭魚之夢」是權利能力的展現
  group_stem: '◎1.～5.為題組 滿十八歲的高中生阿錩看至新聞報導壽○郎迴轉壽司舉辦「愛的迴鮭，尋人啟事」促銷活動，只要名字中有鮭魚兩字就可免費用餐，因此想將本名黃錩瑜改為黃鮭魚，但卻被父母反對而作罷，但他看到全台竟有兩百多人因而改名，且網友根據這些秀出「鮭魚」身分證的照片發現，大多是民國87至90年出生者，而稱呼他們為「鮭魚世代」，但後續新聞也報導部分鮭魚只吃生魚片、不吃白飯，而將白飯堆成很多小山，使得廚餘量是平時六倍以上，讓員工罵他們是「乞丐鮭魚」。這場鮭魚之亂不僅讓阿錩思考鮭魚世代的價值觀，也對我國姓氏名字的相關法規有所好奇，而整理了下列資料一和二。 資料一

    資料二'
