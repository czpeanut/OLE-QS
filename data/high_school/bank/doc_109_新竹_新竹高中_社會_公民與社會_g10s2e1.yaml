  stem: 請問(甲)內容最有可能為下列何者？
  options:
  - label: A
    content: 經濟部核准礦業展延權之前，並未要求亞泥公司與該原住民族或部落進行諮商
  - label: B
    content: 經濟部並非礦業權的主管機關，無權對於礦業權的展延予以核定，違反《礦業法》
  - label: C
    content: 經濟部以及亞泥公司違反《原住民族基本法》，侵害該原住民族的傳統智慧專用權
  - label: D
    content: 經濟部給予亞泥公司的礦業權展延期長達二十年，不符合慣例也違反契約內容
  group_stem: 亞泥公司數十年來長期於花蓮縣新城山附近開採砂石以製作水泥，最近一次採礦權有效期限於106年11月屆滿之前，亞泥公司依《礦業法》向經濟部申請展延採礦權二十年，經濟部經調查後核准亞泥公司展延礦業權至126年11月。但當地原住民認為亞泥公司採礦區域位於其原住民保留地，<u>其開採活動所生之震動、噪音、粉塵、甚至土石流災害，造成當地居民權益的損害</u>，而且此項展延採權的行政處分並未遵行《原住民族基本法》相關規定，因此向經濟部提出訴願，但㣔政院卻維持原行政處分，當地原住民遂提出訴訟。108年高等行政法院認定亞泥公司的展延礦權案違反《原住民族基本法》規定，判決經濟部敗訴，其判決主要理由為(甲)，訴願決定及原行政處分均撤銷，本案可提起上訴。
