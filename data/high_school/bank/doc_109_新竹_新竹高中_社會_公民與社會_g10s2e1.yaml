  stem: 請問下列何者分析最能代表澳洲政府的立場？
  options:
  - label: A
    content: Facebook等社群網路平台製造外部成本，故必須將其外部成本內部化
  - label: B
    content: 媒體生產者製造外部效益卻難以獲得多數利益，將使新聞媒體生產太少
  - label: C
    content: Facebook等社群網路協助新聞媒體散播更多新聞，產生很多外部效益
  - label: D
    content: 新聞媒體製造和傳播不實訊息會產生外部成本，將使社會陷入動亂不安
  group_stem: 澳洲政府研擬了《新聞媒體議價法令》（News Media Brgaining Code），草案內容規範Google與Facebook等社群網路平台使用當地新聞內容時，應該支付費用給新聞內容提供者。因為澳洲政府認為媒體是新聞內容的生產者，但廣告利益卻大多被Google及Facebook拿走，此種現象會造成媒體的生存與經營越顯困難，也不利於社會大眾。但Facebook不贊同澳洲此項法律草案，認為Facebook上的新開內容主要是使用者主動在平台上分享，且Facebook也提供了新聞媒體大量的曝光機會，其產生的價值就已非常高，故「為什麼Facebook還需要付費給媒體？」因此，Facebook在2月中旬突然下架了所有澳洲媒體的內容，禁止澳洲用戶在其平台分享新聞內容和相關文章，影響了澳洲網民與澳洲媒體。在經歷了一段對立之後，Facebook終於發表聲明，說明其已與澳洲政府達成協議，也恢復了澳洲地區的新聞內容。
