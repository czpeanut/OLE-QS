    content: 是，立院在公投反對之下仍積極立法實現婚姻平權
  group_stem: '(五)「同性婚姻」是近年我國社會高度重視，也高度爭議的議題，爭議的主因即在於同性戀屬於社會上的少數，經常因不同於主流的異性戀而被汙名化為「不正常」，剝奪了本應擁有的權利。

    2017年5月24日，司法院公布《釋字第748號解釋》，認定《民法》關於婚姻之規定，未使相同性別者結婚的權利獲得保障，形同差別待遇，有關機關應自本解釋公布之日起2年內，依本解釋意旨完成相關法律之修正或制定。

    2018年11月24日，我國依《公民投票法》舉行多案全國性公民投票，其中第12案及第14案分別討論保障同性別二人經營永久共同生活的權利應以民法以外之其他形式或是以民法來加以保障，公投結果反對直接適用《民法》加以保障。2019年5月17日，立法院三讀通過專法《司法院釋字第748號解釋施行法》，同性戀者始得享有選擇結婚與否、與誰結婚的權利，我國也成為亞洲第一個同性婚姻合法化的國家。'
