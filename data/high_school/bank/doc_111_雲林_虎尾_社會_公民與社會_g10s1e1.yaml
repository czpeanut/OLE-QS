  - label: D
    content: 提醒政府應該著手現今政策，而非回顧過去歷史
  group_stem: '(六)紅色高棉是柬埔寨最黑暗的歷史篇章，波布政權在1975年至1979年統治期間，為了實現所謂的共產烏托邦，實施血腥統治，導致估計有220萬柬埔寨人，相當於柬國當時四分之一的人口，死於處決、酷刑、強迫勞動和飢餓。為了起訴紅色高棉政權犯下的駭人罪行，柬埔寨在聯合國的支持下開設了一個特別法庭，希望透過法律審判，為倖存者伸張正義。

    特別法庭於2022年9月22日，對紅色高棉政權最後一位在世的領導人喬森潘(91歲)作出最終判決，維持他犯下種族滅絕等罪行以及無期徒刑的判決。許多倖存者對法院維持先前的有罪判決感到欣慰，不過也有倖存者認為這個法庭過去十多年來只成功將3名紅色高棉領導人定罪，做的遠遠不夠多。儘管這個法庭已進行了最後一場審判，但它的任務仍未告終，倖存者團體和運動人士也持續努力挖掘這段歷史。'
