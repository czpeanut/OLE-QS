  - label: C
    content: 當時天賦人權的「人權」範圍，和當今社會的人權不同，仍有性別、財產的限制
  - label: D
    content: 社會權的興起起源於二戰後重建，是為了保障人民能夠享有尊嚴的最低限度生活
