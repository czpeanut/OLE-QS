  stem: 根據題文，下列何者並非是此次18歲公民權下修之目的？
  options:
  - label: A
    content: 因應世界多數國家投票年齡下修的趨勢
  - label: B
    content: 避免因年齡限制而造成權利義務不對等
  - label: C
    content: 高齡化下避免政府的施政偏向老年政治
  - label: D
    content: 修憲成本及門檻過高可能增加社會成本
  group_stem: '(四)2022年11月26日，除了舉辦地方選舉外，也將舉辦「18歲公民權」的公民複決：人民决定是否同意修素，將選舉投票的年齡從20歲降到18歲。

    支持年齡下修者認為世界上多數國家皆陸續將投票年齡下修至18歲，目前有約9成的國家投票年齡為12歲，而身為民主國家的臺灣，投票年齡竟然仍為20歲，在這波投票年齡下修的浪潮中吊車尾。此外，目前《刑法》規定住歲負完全責任；2023年1月1日開始，《民法》成年年齡也降為18歲；在兵役上，12歲的男性亦有服役的義熱，在負有責任及義務的同時，青少年卻至20歲才被賦予投票權，限制了年輕社群的公共參與。最後，近年來許多國境人口高齡化問題，為避免下一世代的未來被上一世代決定，各國開始以降低投票年齡放大年輕人的聲量，以免民意代表偏向討好高齡選民，造成年輕選民對政治更形冷感。

    因為這項議題涉及修憲，所以比一般的修法來的複雜許多：立法院必須先提出修憲案，接著在公告半年後，經過三種決同意。公民複決的通過門檻為，有效同意票過選舉人總額的半數。2022年的選舉人數大約1,930萬，表示「民權」修憲複決若想過關，至少需要獲得965萬張同意票，門檻相當高。'
  tags:
    unit:
      code: CI-1-1-1
      book: 公民與社會1 民主與人權
      chapter: 公民身分與普世人權
      title: 公民身分
