  page: 1
  stem: 中世紀時是人權的黑暗時期，君王可以任意干涉人民生活，直到啟蒙時代提出人權思想，人權才逐漸被重視，更在法國大革命、美國獨立運動中成為不可撼動的權利，而當時的「天賦人權」說，主張人權是與生俱來、天賦的自然權利，不可任意被剝奪、轉讓，也成為當今社會的普世價值。請問有關於人權演進的相關敘述，何者最為正確？
  options:
