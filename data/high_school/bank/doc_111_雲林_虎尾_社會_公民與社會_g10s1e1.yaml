  group_stem: (三)臺灣原住民族在歷史上是臺灣最早的主人，在歷代統治者未到臺灣建立政權前，本有自身完整的政治組織、傳統規範與文化制度，然而四百年來的政治變遷與時空變化，原住民族的生存發展面臨空前的危機與困境。早期國民政府來台時，為使原住民族盡快融入漢人社會，對原住民族實施漢化政策，包括強制要求原住民族以漢姓命名、大力推廣國語文運動與漢人文化。但及至今日，《憲法增修條文》裡已將山胞正名為原住民族，大學多元入學亦實施「外加名額保障及族語認證進行內部區別加分」的制度，蔡英文總統更代表政府向原住民族道歉，並提出包括設置「總統府原住民族歷史正義與(甲)正義委員會」等具體承諾。
