- id: doc_108_屏東_屏東高中_自然_物理_g10s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 在<u>臺灣</u>，每逢夏秋兩季，便會有颱風侵襲，而颱風的氣流旋轉總是逆時鐘方向旋轉。而遠在距離<u>臺灣</u>一萬公里左右的<u>地中海</u>岸，每逢冬季便會吹起西風，帶來豐沛的雨水，形成獨特的地中海型氣候。相隔一萬公里的兩種氣候，其實都和科氏力息息相關，而科氏力的產生，事實上是因為地球自轉與慣性，我們可以利用一個簡單的模型，並應用慣性定律理解科氏力。假定我們在赤道，放置一個砲台，並將砲口對準北方，發射一顆砲彈。因為地球自轉的因素，赤道的物體之運動速度總是比高緯度的物體之運動速度來的快（若物體相對於地面沒有運動）。因此，當我們發射砲彈時，砲彈因為慣性在空中運動的過程，仍會保有赤道的速度。當砲彈要落地時，落地點的經度會往東偏，在赤道的炮台，觀察砲彈的落地點，會感覺砲彈似乎受到一個往東的力量，而這股假想的力量就是科氏力，科氏力並非真實存在的力，而是因為在不同的觀察者坐標中，所產生的一種現象。再讓我們重新思考，如果在地球上有一股氣流由赤道往北吹，那麼我們則會因科氏力感受到風往東偏，如此便能順利解釋氣流在地球上轉彎的現象。
    依據上文所述，請問科氏力的成因，主要是因為地球自轉與下列牛頓的哪一項貢獻有關？
  options:
  - label: A
    content: 牛頓第一運動定律
  - label: B
    content: 牛頓第二運動定律
  - label: C
    content: 牛頓第三運動定律
  - label: D
    content: 萬有引力定律
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
