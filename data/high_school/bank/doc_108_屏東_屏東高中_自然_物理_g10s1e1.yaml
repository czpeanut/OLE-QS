- id: doc_108_屏東_屏東高中_自然_物理_g10s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 3
  stem: 近年來，為了因應全球暖化與空氣污染問題日益嚴重，倡議綠色交通的聲音開始在<u>臺灣</u>社會開始浮現，其中，「腳踏車」（又稱自行車）是最常為人重視與期待的項目之一。各縣市政府對於自行車道與自行車環境的投資以及推廣與日俱增，對自行車產業與觀光旅遊的參與度更是積極。而民間自行車協會也推出「一日北高380公里」的活動，限時18小時內，由<u>臺北</u>騎腳踏車到<u>高雄</u>，路程380公里，於時限內完成者可獲的主辦單位認識。
    這天，愛好健康與環保的<u>P哥</u>也參加了一日北高的活動。清晨5：00從<u>臺北</u>騎腳踏車出發，沿著路線圖（如右圖所示）騎向<u>高雄</u>，途中有上坡也有下坡，路線有時彎曲，有時筆直。直線上坡時，需費力踩踏才能維持等速前進；直線下坡時，不須踩踏就能等速前進。除起點與終點外，路途中有數個休息站可以短暫停留，最後<u>P哥</u>於隔日凌晨0：00到達<u>高雄</u>的終點站，雖然超過時限沒有獲得認證，但也完成了一日北高的挑戰。依據上文所述，試回答下題：
    關於<u>P哥</u>由<u>臺北</u>騎車到<u>高雄</u>過程的敘述，下列選項哪個正確？
  options:
