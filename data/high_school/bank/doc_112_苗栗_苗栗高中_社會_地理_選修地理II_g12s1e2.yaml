  stem: 哪一種能源因「狹管效應」而有發電的發展潛能？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: 為減緩空汙，臺灣近年來再生能源的發電比例有提高的趨勢。右圖中甲～丁代表臺灣風力、水力、太陽能、地熱（未依序排列）4 種再生能源分布。請問：
  shared_asset: g1_7_8
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 狹管效應為地形上產生風速較強的現象，故選風能，而圖中位於臺灣海峽的海陸交界側最右可能為風場分布所在，故選(B)乙。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 臺灣部分地層下陷區域，進行「養水種電」計畫，藉由不再養魚與抽取地下水，減輕地層下陷的問題；也讓業者以高於農作物或水產養殖利潤的租金，承租無法再使用的魚塭或廢耕的土地，發展再生能源，並將發電售給台電。請問上文中的再生能源是指圖中何項能源？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: 為減緩空汙，臺灣近年來再生能源的發電比例有提高的趨勢。右圖中甲～丁代表臺灣風力、水力、太陽能、地熱（未依序排列）4 種再生能源分布。請問：
  shared_asset: g1_7_8
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 甲能源分布在中部山地地區，故應為水力發電；丙能源分布在西部與南部地區，故推測為太陽能發電；丁能源數量最少，故為地熱發電。臺灣地層下陷為西南部沿海一帶，而養水種電的能源為太陽能發電，故選(C)丙。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 若以國土的鄰近性和領海的概念來看，哪一個國家最有可能宣稱擁有這 5 座新島嶼的主權？
  options:
  - label: A
    content: 美國
  - label: B
    content: 挪威
  - label: C
    content: 加拿大
  - label: D
    content: 俄羅斯
  group_stem: 全球暖化除了加速北極冰川融化，更導致北極區原本冰封的土地露出地面，2019 年 8 月就有 5 座過去被冰雪覆蓋的島嶼被探險家發現。這 5 座新島嶼位於新地島對面的維澤灣一帶（如右圖），島嶼的面積有大有小，最小的只有 900 平方公尺，最大一座則有 54,500 平方公尺。冰川消融也讓北極區成為人類更容易進入的地區，許多國家極力推動極區新航線，同時北極海的資源爭奪戰也同步在各國間悄悄上演。請問：
  shared_asset: g1_9_10
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 這 5 座新島嶼位於俄羅斯的北部，故(D)俄羅斯最有可能宣稱其擁有這 5 座島嶼的主權。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 北極航線的開通，可縮短下列哪兩條海運的航程，產生的正面效益最大？
  options:
  - label: A
    content: 西亞石油→臺灣高雄
  - label: B
    content: 澳洲小麥→日本東京
  - label: C
    content: 西非可可→英國倫敦
  - label: D
    content: 德國汽車→中國北京
  group_stem: 全球暖化除了加速北極冰川融化，更導致北極區原本冰封的土地露出地面，2019 年 8 月就有 5 座過去被冰雪覆蓋的島嶼被探險家發現。這 5 座新島嶼位於新地島對面的維澤灣一帶（如右圖），島嶼的面積有大有小，最小的只有 900 平方公尺，最大一座則有 54,500 平方公尺。冰川消融也讓北極區成為人類更容易進入的地區，許多國家極力推動極區新航線，同時北極海的資源爭奪戰也同步在各國間悄悄上演。請問：
  shared_asset: g1_9_10
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)西亞石油到高雄，須通過麻六甲海峽。(B)澳洲小麥到日本，不需經過海峽，僅需穿越太平洋。(C)西非可可到英國，不需經過海峽，僅需經過大西洋。(D)德國汽車到中國北京，歐洲到亞洲，本來需要經過直布羅陀海峽與蘇伊士運河、麻六甲海峽；若西北航道開通，則可經由上方（北極海）的西北航道縮短航線，故其產生的正面效益最大。
