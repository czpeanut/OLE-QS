  stem: 小明在進行地理問題探究學習時，蒐集到 1960、1980、2000 和 2020 等 4 年苗栗地區工商消費電話簿，電話簿載有各行業營業場所的地址和電話號碼。小明探究的主題最可能是下列何者？
  options:
  - label: A
    content: 苗栗市都市機能結構變遷
  - label: B
    content: 苗栗市都市住宅用地擴張
  - label: C
    content: 苗栗市土地競租曲線消長
  - label: D
    content: 苗栗地區都市成長的歷程
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從工商業的營業場所與電話登記簿，可以看出苗栗地區的從業人口數變化，因此能推知該(A)都市機能的結構變遷。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_4
  section: 1
  number: 4
