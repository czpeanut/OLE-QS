  stem: 臺灣自 17 世紀起開始與世界接軌，先後受到不同文化的洗禮，現今的生活中存在著多元文化的色彩。下列有關臺灣文化景觀的說明，哪些最為合理？(甲)臺鐵「普悠瑪」列車是以臺東西拉雅族語來命名(乙)新北三峽老街的街屋有巴洛克風格紋飾，為荷西時代所留下的建築(丙)臺中大甲鎮瀾宮媽祖遶境活動是由漢人的宗教祭典發展而來(丁)花蓮瑞穗、池上、關山等地名是日本殖民時所留下的地名(戊)燒餅、油條、牛肉麵等美食是隨戰後中國軍民來臺所帶入
