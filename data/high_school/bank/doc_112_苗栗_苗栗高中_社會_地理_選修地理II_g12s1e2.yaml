  stem: 某一地區民間音樂的特點是，帶有淡淡懷鄉、憂愁的色彩，重唱形式多，唱法放鬆，音色柔和抒情。一個音樂家評論：「原住民族提供基本的五聲音階模式，並喜用單調的擊鼓聲作伴奏；殖民者帶來和弦的概念及西班牙慣用的節奏，黑人則增加了變化音的修飾。」該地區最可能是
  options:
  - label: A
    content: 澳洲昆士蘭地區
  - label: B
    content: 非洲喀拉哈里盆地
  - label: C
    content: 南美洲拉布拉他平原
  - label: D
    content: 北美洲密士失必三角洲
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此音樂有原住民的基本五聲音階，再加上殖民者帶來的西班牙慣用節奏，最後是黑人加入了變化音的修飾，因此該地區應為被西班牙殖民且引進黑人勞力的南美洲拉布拉他平原，故選(C)。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 1980 年代起亞洲四小龍經濟快速起飛，1990 年代後亞洲四小虎也致力工業發展，而 2000 年代後的金磚四國皆企圖脫離邊陲區努力成為半邊陲區，尤其中國的發展經驗和亞洲四小龍類似，但是仍有明顯的差別。請問下列敘述哪 2 項正確？(甲)透過核心區的資金技術擴散，使得原為邊陲區的東亞、東南亞地區得以進入工業化的階段(乙)東亞、東南亞的新興工業化國家與中國皆是透過市場經濟來發展的資本主義國家(丙)亞洲四小龍、四小虎、中國在核心區的跨國企業投資後，從技術密集產業或貨物轉運業開始發展帶動經濟成長(丁)在亞洲四小龍、四小虎、中國陸續脫離邊陲區後，也能透過本地的跨國企業控制其他邊陲區
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (乙)中國並非透過市場經濟來發展的資本主義國家；(丙)亞洲四小龍、四小虎等在核心區跨國企業投資後，是從勞力密集型產業開始發展帶動經濟成長的。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_6
  section: 1
