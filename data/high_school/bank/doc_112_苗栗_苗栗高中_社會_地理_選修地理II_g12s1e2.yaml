  answer_source: answer_key
  explanation: 若要將富裕國家的疫苗公平分配給中低收入國家，此應符合區域均衡發展的概念，故選(C)。(A)反吸與退化，在發展的晚期，核心發展程度更高，邊陲的發展程度更低。(B)早期發展核心高、邊陲低，晚期核心、邊陲發展皆下降，可能發生全球性災害，如世界戰爭等。(D)早期核心發展高、邊陲低，而晚期形成核心低、邊陲高，可能是核心地區發生了文明毀滅事件，邊陲形成新核心的狀況，因此不符合題目所描述之情形。
