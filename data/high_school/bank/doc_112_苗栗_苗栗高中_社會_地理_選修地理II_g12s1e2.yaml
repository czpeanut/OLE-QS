  type: single
  page: 2
  stem: '下表是某種可用來提煉生質燃料的原料，其產量在 2013 年的全球排名概況。該原料最可能為下列何者？

    | （單位：百萬公噸） |  |  |  |  |  |

    | --- | --- | --- | --- | --- | --- |

    | 生產國 | 美國 | 巴西 | 阿根廷 | 中國 | 印度 |

    | 產量 | 89.5 | 81.7 | 49.3 | 12.0 | 11.9 |'
  options:
  - label: A
    content: 大豆
  - label: B
    content: 甘蔗
  - label: C
    content: 稻草
  - label: D
    content: 油菜籽
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 此作物可用來提煉生質燃料，而其主要分布在美國、巴西、阿根廷與中國、印度，因此可以推測應是位於熱帶、溫帶地區皆可以生產的大豆，故選(A)。(B)甘蔗主要生產在熱帶地區，阿根廷占比應不高。(C)稻草非主要生質燃料的原料，且應以中國印度生產較多。(D)油菜籽應以中國、印度生產較多。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
