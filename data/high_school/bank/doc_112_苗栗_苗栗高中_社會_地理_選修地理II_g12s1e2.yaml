  group_stem: 在 2021 年 9 月 23 日的聯合國大會上，非洲國家領袖呼籲國際社會重視疫苗分配的公平性。全球逾 82 ％疫苗由富裕國家掌控，僅不到 1 ％供給低收入國家；而非洲 13 億人口完成疫苗接種比率卻不到 3 ％。非洲領袖直言，目前情形猶如「疫苗種族隔離」，也呼籲國際社會在疫苗分配上，應落實「多邊主義」。非洲聯盟的疫苗大使對「全球疫苗分配計畫」感到失望。該平臺目標是向中低收入國家捐贈疫苗，但因疫苗短缺而遲遲未達到平臺預設的目標，但同時部分國家卻仍然大量囤積疫苗。目前非洲仍是全球接種率最低地區，惟有疫苗共享，全球才能一起度過疫情。請問：
