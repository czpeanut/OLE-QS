  page: 1
  stem: 北美洲及歐洲的年降水量均低於非洲，水資源在全球占比卻高於非洲，原因何在？
  options:
  - label: A
    content: 地處溫帶，蒸發散較少
  - label: B
    content: 氣候變遷，年變率加大
  - label: C
    content: 所得較高，節水效率較佳
  - label: D
    content: 地下水多，利用相當普遍
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)非洲的年降水量高，但因為水利基礎建設不佳與政府效能不彰，故水資源量會較歐洲與北美洲低，其為「經濟性缺水」。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 大洋洲的水資源雖僅占全球 1.6 ％，平均每人水資源卻比全球平均值的 3 倍還多，主因為何？
  options:
  - label: A
    content: 地下水豐
  - label: B
    content: 人口稀少
  - label: C
    content: 全民節水
  - label: D
    content: 氣候變遷
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)由於大洋洲的人口稀少，故其人均水資源的量較全球平均值高。
- id: doc_112_苗栗_苗栗高中_社會_地理_選修地理II_g12s1e2_s1_3
