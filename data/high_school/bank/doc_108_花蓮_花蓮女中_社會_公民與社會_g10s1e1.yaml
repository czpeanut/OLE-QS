  stem: 司法院大法官會議針對「同性二人婚姻自由案」公布了釋字第748號，大法官多數意見認為：「《民法》關於婚姻規定，未使相同性別二人，得為經營共同生活之目的，成立具有親密性及排他性之永久結合關係，達反《憲法》第22條保障婚姻自由與平等權。有關機關應於2年內修法，至於以何種形式達成婚姻自由之保護，屬立法形成之範圍。如逾期未修正，相同性別二人為成立上開永久結合關係，可以直接依《民法》婚姻章規定，持二人以上證人簽名之書面，向戶政機關辦理結婚登記。」關於此釋憲文所彰顯的權利內涵，何者正確？
