  stem: 1963年8月28日華盛頓大遊行中，馬丁路德金恩於林肯紀念堂前發表知名演說〈我有一個夢〉，演說內容節錄如下： 朋友們，今天我對你們說，在此時此刻，我們雖然遭受種種困難和挫折，我仍然有一個夢想。這個夢想是深深紮根於美國的夢想中的。 我夢想有一天，這個國家會站立起來，真正實現其信條的真諦：「我們認為這些真理是不言而喻的：人人生而平等。」 我夢想有一天，在喬治亞的紅山上，昔日奴隸的兒子將能夠和昔日奴隸主的兒子坐在一起，共敘兄弟情誼。 我夢想有一天，我的四個孩子將在一個不是以他們的膚色，而是以他們的品格優劣來評價他們的國度裡生活。 金恩博士鏗鏘有力的講演不僅帶領黑人展開平權運動，亦促使政府廢除種族隔離法案。在他的講稿中，可以發現何種關於權利內涵的概念？
