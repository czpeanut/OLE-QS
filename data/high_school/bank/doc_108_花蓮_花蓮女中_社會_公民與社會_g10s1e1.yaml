  stem: 文化部推動的「中正紀念堂轉型之社會討論計畫」，自2017年起舉辦多場願景工作坊。參與者具有年齡、地區及背景的多樣性，有高中生、大學生、文字工作者、公司職員、現役軍人、退休警官，也有曾在中正紀念堂任職的員工，以及來自不同立場政治團體的代表。其中有參與者表達：「我的立場就是跟你不一樣，但我想跟你溝通，社會可以有談論中正紀念堂各種不同想像空間的可能性。」請問：文化部採用的方式，比較接近下列何種主張？
