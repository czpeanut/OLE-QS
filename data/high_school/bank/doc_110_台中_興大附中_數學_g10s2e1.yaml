- id: doc_110_台中_興大附中_數學_g10s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 3
  stem: 設各項都是實數的等差數列 $a_{1}$，$a_{2}$，$a_{3}$，……之公差為負實數α，試選出正確的選項。
  options:
  - label: A
    content: 若 $b_{n}$＝－$a_{n}$，則 $b_{1}$＞$b_{2}$＞$b_{3}$＞……
  - label: B
    content: 若 $c_{n}$＝$a_{n}^{2}$，則 $c_{1}$＜$c_{2}$＜$c_{3}$＜……
  - label: C
    content: 若 $d_{n}$＝$a_{n}$＋$a_{n＋1}$，則 $d_{1}$，$d_{2}$，$d_{3}$，……是公差為 2α的等差數列
  - label: D
    content: 若 $e_{n}$＝$a_{n}$＋n，則 $e_{1}$，$e_{2}$，$e_{3}$，……是公差為α＋1 的等差數列
  - label: E
    content: 若 $f_{n}$ 為 $a_{1}$，$a_{2}$，……，$a_{n}$ 的算術平均數，則 $f_{1}$，$f_{2}$，$f_{3}$，……是公差為$\frac{\alpha}{2}$的等差數列
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '〈$a_{n}$〉的公差α為負，表示愈來愈小

    (A) ╳：$a_{1}$＞$a_{2}$＞$a_{3}$＞…… ⇒ －$a_{1}$＜－$a_{2}$＜－$a_{3}$＜……，即 $b_{1}$＜$b_{2}$＜$b_{3}$＜……

    (B) ╳：若 $a_{1}$＝3，$a_{2}$＝2，$a_{3}$＝1，…… ⇒ $a_{1}^{2}$＝9，$a_{2}^{2}$＝4，$a_{3}^{2}$＝1，……，即
    $c_{1}$＞$c_{2}$＞$c_{3}$＞……

    (C) ○：$d_{n＋1}$－$d_{n}$＝（$a_{n＋1}$＋$a_{n＋2}$）－（$a_{n}$＋$a_{n＋1}$）＝$a_{n＋2}$－$a_{n}$＝2α為定值

    (D) ○：$e_{n＋1}$－$e_{n}$＝〔$a_{n＋1}$＋（n＋1）〕－（$a_{n}$＋n）＝α＋1 為定值

    (E) ○：$f_{n＋1}$－$f_{n}$ ＝$\frac{a_{1}+\ldots \ldots +a_{n+1}}{n+1}-\frac{a_{1}+\ldots
    \ldots +a_{n}}{n}$＝$\frac{a_{1}+a_{n+1}}{2}-\frac{a_{1}+a_{n}}{2}=\frac{1}{2}
    (a_{n+1}-a_{n})=\frac{\alpha}{2}$為定值

    故選(C)(D)(E)'
