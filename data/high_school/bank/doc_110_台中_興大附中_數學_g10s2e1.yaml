- id: doc_110_台中_興大附中_數學_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '一數列〈$a_{n}$〉滿足$\begin{cases}a_{1}=\frac{1}{2} \\ a_{n+1}=\frac{4a_{n}-1}{9a_{n}-2}
    , n 為自然數\end{cases}$，試求：

    (1) $a_{2}$＝＿＿＿＿，$a_{3}$＝＿＿＿＿，$a_{4}$＝＿＿＿＿。

    (2) 請推測 $a_{n}$＝＿＿＿＿，並證明你的推測是對的。

    <u>小華</u>在練習這個題目的時候，分成下列幾個步驟：

    步驟 1：$a_{2}=\frac{4\times \frac{1}{2}-1}{9\times \frac{1}{2}-2}=\frac{1}{\frac{5}{2}}=\frac{2}{5}$，

    步驟 2：$a_{3}=\frac{4\times \frac{2}{5}-1}{9\times \frac{2}{5}-2}=\frac{\frac{3}{5}}{\frac{8}{5}}=\frac{3}{8}$，

    步驟 3：$a_{4}=\frac{4\times \frac{3}{8}-1}{9\times \frac{3}{8}-2}=\frac{\frac{4}{8}}{\frac{11}{8}}=\frac{4}{11}$，

    由步驟 1、2、3 推測$a_{n}=\frac{n}{3n-1}$，n 為自然數，

    步驟 4：當 n＝1 時，$a_{1}=\frac{1}{2}$，原式成立， 設 n＝k 時，原式成立，即$a_{k}=\frac{k}{3k-1}$，k
    為自然數，

    步驟 5：當 n＝k＋1 時，$a_{k+1}=\frac{k+1}{3 (k+1)-1}=\frac{k+1}{3k+2}$，原式成立，

    故由數學歸納法得證$a_{n}=\frac{n}{3n-1}$，n 為自然數。

    請你幫<u>小華</u>檢查一下，他是否有做錯，並選出他錯在哪一個步驟？'
  options:
  - label: A
    content: 步驟 1
  - label: B
    content: 步驟 3
  - label: C
    content: 步驟 4
  - label: D
    content: 步驟 5
  - label: E
    content: 全部答對
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '步驟 5：當 n＝k＋1 時 $a_{k＋1}$＝$\frac{4a_{k}-1}{9a_{k}-2}$＝$\frac{4\left(
    \frac{k}{3k-1} \right) -1}{9\left( \frac{k}{3k-1} \right) -2}$＝$\frac{4k-(3k-1)}{9k-2
    (3k-1)}$＝$\frac{k+1}{3k+2}$＝$\frac{(k+1)}{3 (k+1)-1}$亦成立

    故選(D)'
- id: doc_110_台中_興大附中_數學_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 2
  stem: '<u>錢</u>老闆急需用錢，打算向銀行借 10 萬元並在三個月後還清，他向銀行詢問利息的算法，銀行提出四個方案如下：

    甲：月利率為 2 ％，每個月複利一次

    乙：月利率為 2 ％，每半個月複利一次

    丙：第一個月利率為 1 ％，第二個月為 2 ％，第三個月為 3 ％，每個月複利計息

    丁：第一個月利率為 3 ％，第二個月為 2 ％，第三個月為 1 ％，每個月複利計息

    這四個方案以哪一個方案對<u>錢</u>老闆<u>最不利</u>（即所還的本利和為最多）？'
  options:
  - label: A
    content: 甲方案
  - label: B
    content: 乙方案
  - label: C
    content: 丙方案
  - label: D
    content: 丁方案
  - label: E
    content: 四個方案的本利和都一樣
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '甲：100000（1＋2 ％）$^{3}$＝100000×$1.02^{3}$

    乙：100000（1＋1 ％）$^{6}$＝100000×$1.01^{6}$＝100000×（$1.01^{2}$）$^{3}$＝100000×$1.0201^{3}$

    丙：100000（1＋1 ％）（1＋2 ％）（1＋3 ％）＝100000×1.01×1.02×1.03

    丁：100000（1＋3 ％）（1＋2 ％）（1＋1 ％）＝100000×1.03×1.02×1.01

    ∵1.03×1.01＜$1.02^{2}$

    ∴乙＞甲＞丙＝丁，故選(B)'
