  stem: 等差數列〈$a_{n}$〉中共有 15 個項，此數列所有項的算術平均數為 6，現從中刪去兩個項，使剩下的 13 個項之算術平均數亦為 6，已知刪去者之其中一項為
    $a_{9}$，則刪去之另一項為原數列〈$a_{n}$〉的第 k 項，求 k 值為何？
  options:
