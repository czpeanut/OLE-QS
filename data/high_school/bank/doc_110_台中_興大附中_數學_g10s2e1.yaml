  stem: 有一組二維數據（$x_{i}$，$y_{i}$），其中 y 對 x 的迴歸直線方程式為$y =\frac{3}{5}x+12$，且平均數μ$_{x}$＝60，而
    y 對 x 的相關係數為 $r_{（x，y）}$，今有另一組二維數據（$s_{i}$，$t_{i}$），其中$s_{i}=-\frac{1}{3}x_{i}+15$，$t_{i}=\frac{1}{4}y_{i}+3$，若
    t 對 s 的迴歸直線為 L：t＝a＋bs，則下列哪些是正確的選項？
  options:
  - label: A
    content: $r_{（x，y）}$＞0
  - label: B
    content: t 對 s 的相關係數為$-\frac{1}{12}r_{(x , y)}$
  - label: C
    content: L 通過（－5，15）
  - label: D
    content: a＞0
  - label: E
    content: b＝$\frac{9}{20}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：資料大多在斜率為正的直線附近 ∴為正相關，即 $r_{（x，y）}$＞0

    (B) ╳：$r_{（s，t）}$＝－$r_{（x，y）}$

    (C) ○：迴歸直線必過資料中心，μ$_{x}$＝60 代入 y＝$\frac{3}{5}$x＋12 得 y＝$\frac{3}{5}$×60＋12＝48＝μ$_{y}$

    則（μ$_{s}$，μ$_{t}$）＝$\left( -\frac{1}{3}\mu _{x}+15 , \frac{1}{4}\mu _{y}+3 \right)$＝$\left(
    -\frac{1}{3}\times 60+15 , \frac{1}{4}\times 48+3 \right)$＝（－5，15）

    (D) ○：b＝$r_{（s，t）}$×$\frac{\sigma _{t}}{\sigma _{s}}$＝－$r_{（x，y）}$×$\frac{\left|
    \frac{1}{4} \right| \sigma _{y}}{\left| -\frac{1}{3} \right| \sigma _{x}}$＝$-\frac{3}{4}
    \left( r _{(x , y)}\times \frac{\sigma _{y}}{\sigma _{x}} \right)$＝$-\frac{3}{4}\times
    \frac{3}{5}=-\frac{9}{20}$

