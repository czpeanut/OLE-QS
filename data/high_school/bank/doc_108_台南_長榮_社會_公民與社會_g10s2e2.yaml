- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 國家為了達成某種目的會透過國家公權力從事各種行政行為，與人們的生活領域密不可分。請問：下列行政行為的性質與其他三者<u>明顯不同</u>？
  options:
  - label: A
    content: 行政院農委會補助颱風天受災農民天然災害救助金
  - label: B
    content: 臺中市政府著手規劃興建臺中都會區大眾捷運系統
  - label: C
    content: 中央健保署協助各政府機關辦理補助全民健康保險
  - label: D
    content: 《菸害防制法》全面禁止民眾在室內公共場所吸菸
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 有關公法上之爭議，若人民不服行政機關所為之決定時，可尋求行政救濟管道。請問：下列何者應屬行政法院之審判範圍？
  options:
  - label: A
    content: 《家庭暴力防治法》中的家暴事件
  - label: B
    content: 《教師法》中的公立學校解聘事件
  - label: C
    content: 《公職人員選舉罷免法》中的選舉無效事件
  - label: D
    content: 《社會秩序維護法》中的罰鍰事件
  - label: E
    content: 《道路交通管理處罰條例》中的交通違規事件
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列何者屬於行政法之範疇？
  options:
  - label: A
    content: 至戶政機關辦理結婚登記
  - label: B
    content: 警察依法逮捕現行犯
  - label: C
    content: 透過外送APP訂購餐點
  - label: D
    content: 與公司簽訂雇傭契約
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 小露露為了投稿「中學生小論文寫作比賽」，開始針對研究題目蒐集可用的新聞素材，以下是小露露蒐集到的三個新聞標題，請推斷下列何者最有可能是她的研究主題？ 標題一：未踐行原住民諮商同意權，經濟部核准亞泥挖礦權展延，行政院法院判決經濟部敗訴 標題二：行政院以程序瑕疵撤銷邵族傳統領域公告，引起地方人士反彈聲援抗議並提告 標題三：公聽會會議通知被消失！？住戶受告權利被剝奪，反臺南鐵路強拆抗爭持續上演
  options:
  - label: A
    content: 沒有人是局外人－原住民族傳統領域爭議之探討
  - label: B
    content: 我們與政府的距離－從個案看公民不服從之體現
  - label: C
    content: 程序不正義－從新聞事件探討行政程序的重要性
  - label: D
    content: 又是恐龍法官？一論媒體報導與實際判決的落差
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 阿田為某所公立高中的高一生，欲成立一個名為「邊綠的小圈圈」專門討論社會議題的非主流社團。但先後遭校方以「名稱不佳」、「社員不足八個系所」等事由拒絕，於是阿田便在校內展開靜坐以表抗議，但此舉卻更引來校方採取記兩大過、兩小過的處分，將其惡意退學……。假使你為阿田的好友，你會如何建議他採取下列哪一種合理的管道途徑來尋求救濟？
  options:
  - label: A
    content: 向各大媒體投書引起關注→尋求民意代表向學校施壓→向監察院彈劾辦事人員
  - label: B
    content: 向校內學務處進行申訴→向教育部提出訴願→向地方法院行政訴訟庭提起訴訟
  - label: C
    content: 向教育部提起訴願→向地方法院行政訴訟庭提起訴訟→向高等行政法院提起上訴
  - label: D
    content: 向學生申訴評議委員會進行申訴→向教育部提起訴願→向行政院提起行政訴訟
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 《德國基本法》第1條第1項：「人性尊嚴不可侵犯。尊重及保護人性尊嚴為所有國家權力之義務。有關人性尊嚴的敘述，何者最為正確？
  options:
  - label: A
    content: 基於人性尊嚴，每個人得以「為所欲為」
  - label: B
    content: 人是工具，不是目的
  - label: C
    content: 保障人性尊嚴，是基本法之構成原則
  - label: D
    content: 人性尊嚴存在於每個人，可以剝奪、喪失、拋棄
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 《德國基本法》第20條第2項：所有國家權力來自人民。國家權力由人民以選舉及公民投票，並由彼此分立之立法、行政及司法機關行使之；我國《憲法》第2條：中華民國之主權屬於國民全體。透過德國與我國的憲法條文研判，此最主要在闡釋何種原則？
  options:
  - label: A
    content: 菁英原則
  - label: B
    content: 民主國原則
  - label: C
    content: 政黨政治原則
  - label: D
    content: 審議原則
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 權利主體是《民法》的靈魂人物，而有關《民法》所承認的權利主體，下列敘述，何者正確？
  options:
  - label: A
    content: 權利主體均具有權利能力的存在
  - label: B
    content: 權利主體得享受權利、拒絕義務負擔
  - label: C
    content: 是專指有血有肉，生理上存在的自然人
  - label: D
    content: 法人的權利能力與自然人均相同
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 形成法律關係的主要因素，包括人、物、行為，而人在法律關係中屬於權利主體，並分成自然人與法人兩種，而有關法人的敘述，何者正確？
  options:
  - label: A
    content: 台南市議會為公法人
  - label: B
    content: 公司企業為財團法人
  - label: C
    content: 高雄市那瑪夏區為公法人
  - label: D
    content: 財團法人為營利性團體
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 在法院審理案件的過程中，通常會採取何種作為？
  options:
  - label: A
    content: 先程序法、後實體法的步驟
  - label: B
    content: 普通法優於特別法的適用原則
  - label: C
    content: 下位階法律優於上位階法律的適用原則
  - label: D
    content: 行政部門的解釋優先於司法部門的解釋
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 各級校園自治後，學生會的運作必須有相關經費的挹注，而收取學生會費成為最大的財源；然而各校學生會卻常面臨學生不願意繳納學生會費的困境，形成財源困窘。從支持學生自治觀點來檢視，會提出何種論點？
  options:
  - label: A
    content: 學生不滿意學生會的運作績效，得拒繳
  - label: B
    content: 基於學生自治的權責相符，學生有繳費義務
  - label: C
    content: 校園自治與學生會運作，不應該有金錢的紛爭
  - label: D
    content: 學生會應有自行募款能力，以免受制於學生會員
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 司法審查權是指，法院有權宣告行政措施、法律，因為不合憲而無效的權力；目前各國承認司法部門是行使司法審查權的機關，藉以彰顯何者？
  options:
  - label: A
    content: 司法權凌駕於行政、立法之上
  - label: B
    content: 強調以誠信原則作為最高準則
  - label: C
    content: 依法享受權利，但禁止權利濫用
  - label: D
    content: 權力分立與制衡，展現法治國精神
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 《憲法》第2章「人民基本權利」列舉許多基本權利，但是隨社會變遷與時代演進，已不敷使用，因此透過司法院大法官釋憲，填補部分憲法未列舉權保障之缺失，下列相關敘述，何者正確？
  options:
  - label: A
    content: 釋憲屬於被動性的司法權，釋憲結果不涵蓋行政立法兩權
  - label: B
    content: 包括生命、身體、尊嚴、人格、參政等憲法未列舉之權利
  - label: C
    content: 大法官釋憲的結果，積極落實憲法第22條概括人權的保障
  - label: D
    content: 此類型釋憲，大法官特別是依據憲法第23條的限制人權規定
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 釋字第752號解釋指出《刑事訴訟法》第376條第2款所列案件「經第一審判決被告無罪，但第二審撤銷原審判決而自為有罪判決者，不得上訴於第三審法院」規定違憲，認為未能提供至少一次上訴之機會，因為與《憲法》第16條所保障人權基本權利之意旨有違，而宣告違憲。釋字第752號解釋，保障人民的何種權利？
  options:
  - label: A
    content: 救濟權
  - label: B
    content: 平等權
  - label: C
    content: 人格權
  - label: D
    content: 自由權
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 國家的行政行為、人民的日常生活都受到行政法規的約束，而行政法規具有何種特色？
  options:
  - label: A
    content: 是一部大法典，規範政府所有的行政行為
  - label: B
    content: 行政法於生活之中無所不在
  - label: C
    content: 泛指所有與人民權利義務有關的普通私法
  - label: D
    content: 人民藉由行政法規，完全排除政府的干涉
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 政府要限制人民權利，必須透過法律來限制；也就是說，應該由法律來限制人民權利，若政府在實際運作時卻沒依照法律規定，此時違反何種行政法原理原則？
  options:
  - label: A
    content: 明確性原則
  - label: B
    content: 法律保留原則
  - label: C
    content: 法律優越原則
