- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 我國設有「覆議制度」的規定，關於「覆議」的敘述，下列何者正確？
  options:
  - label: A
    content: 我國中央政府各院在相互制衡上，皆有行使覆議權之權力
  - label: B
    content: 行政院若認為法律案窒礙難行，得不經過總統向立法院提出覆議
  - label: C
    content: 行政院提起覆議後，如立法院逾期仍遲未作成決議，原決議將失其效力
  - label: D
    content: 行政院提起覆議後，如全體立委1/2維持原案，行政院院長應接受並進行總辭
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 我國大法官作出了784號解釋，打破了過去學生與學校強調紀律與服從的「特別權利關係」。解釋一改過去認為僅在行政處分會對高中生身分權益的重大影響，才能依法提起行政救濟的傳統思維，主張未來各級學校學生，凡因學校之教育或管理等公權力措施而遭受不法侵害時，便可依法提起行政訴訟，積極落實「有權利即有救濟」的憲法人權。請問：此是屬於哪一種法律解釋？
  options:
  - label: A
    content: 立法解釋
  - label: B
    content: 行政解釋
  - label: C
    content: 司法解釋
  - label: D
    content: 政治解釋
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 經濟部針對日前所提出「著作權法」大翻修方向，要求在公園播音樂跳土風舞的民眾必須支付音樂版權費，引發民眾強烈質疑。機關諮詢各方意見後，考量我國「特殊國情」，在最新修法草案中把類似行為視為「合理使用」，不另收權利金。下列敘述何者正確？
  options:
  - label: A
    content: 此修正案僅須通過行政院會議即可產生效力
  - label: B
    content: 此修正案須送進立法院院會三讀通過即產生效力
  - label: C
    content: 此修正案提案後將進入程序委員會，排定議程
  - label: D
    content: 此修正案為法律位階，得逕行進入政黨協商程序
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 《憲法》向來與保障人權密切關連，下列關於人民基本權利的敘述，何者屬於「概括」的權利？
  options:
  - label: A
    content: 達法定年齡可以參選里長
  - label: B
    content: 人民有著作與出版的權利
  - label: C
    content: 不能因黨派立場不同而有差別待遇
  - label: D
    content: 個人可以自主控制個人資料之隱私
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 隨著17世紀「天賦人權」的提倡，主張天生擁有生命、自由及財產等自然權利，「天賦人權」思想影響了後世的民主化與人權的發展。現在，民主國家已將人權保障視為各國制憲的首要目的，請問人權保障的核心意義為何？
  options:
  - label: A
    content: 增進公共利益
  - label: B
    content: 維持社會秩序
  - label: C
    content: 避免緊急危難
  - label: D
    content: 維護人性尊嚴
- id: doc_108_台南_長榮_社會_公民與社會_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 為促進台南市街頭藝術，文化局已設置塗鴉專區，呼籲市民可在合法開放的塗鴉專區進行創作，但仍禁止專區外的塗鴉行為，請問這項禁止措施理由為何？
  options:
  - label: A
    content: 避免緊急危難
  - label: B
    content: 維持社會秩序
  - label: C
    content: 增進個人利益
  - label: D
    content: 防止妨礙他人自由
