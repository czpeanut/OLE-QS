  group_stem: 資料一：「2015年，布農族獵人王光祿（Talum）為95歲的母親獵捕山產，遭最高法院依違反《槍砲彈藥刀械管制條例》和《野生動物保育法》判處3年6月徒刑定讞……」 資料二：「2017年1月，17歲的黃姓少年偕同友人上山打獵，雖其持有「自製」獵槍為合法申請，但上山打獵仍需要申請許可，故仍可能會面臨相關行政相關責任……」 資料三：「2014年，潘志強從小跟著外公上出打獵，因女友家長來訪，他上山狩獵，獵得兩隻山羌，想獻給女方家長，卻遭警方逮捕，法院以《野生動物保育法》，判刑6個月，易科罰金18萬元，他至今還在分期付款，繳交罰金，但感情已告吹，等於「人財兩失」……」
