  stem: 求極限$\lim_{x \rightarrow 2} \frac{\sqrt{1+\sqrt{2+x}} - \sqrt{3}}{x -2}$＝＿＿＿＿。
  answer:
  - $\frac{\sqrt{3}}{24}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow 2} \frac{\sqrt{1+\sqrt{2+x}} - \sqrt{3}}{x -2}$

    ＝$\lim_{x \rightarrow 2} \left( \frac{\sqrt{1+\sqrt{2+x}} - \sqrt{3}}{x -2}\times \frac{\sqrt{1+\sqrt{2+x}} + \sqrt{3}}{\sqrt{1+\sqrt{2+x}} + \sqrt{3}} \right)$＝$\lim_{x \rightarrow 2} \frac{( \sqrt{1+\sqrt{2+x}} )^{2}-( \sqrt{3} )^{2}}{( x -2 ) ( \sqrt{1+\sqrt{2+x}} + \sqrt{3} )}$

    ＝$\lim_{x \rightarrow 2} \frac{\sqrt{2+x} - 2}{( x -2 ) ( \sqrt{1+\sqrt{2+x}} + \sqrt{3} )}$＝$\lim_{x \rightarrow 2} \left( \frac{\sqrt{2+x} - 2}{( x -2 ) ( \sqrt{1+\sqrt{2+x}} + \sqrt{3} )}\times \frac{\sqrt{2+x} + 2}{\sqrt{2+x} + 2} \right)$

    ＝$\lim_{x \rightarrow 2} \frac{( \sqrt{2+x} )^{2}-2^{2}}{( x -2 ) ( \sqrt{1+\sqrt{2+x}} + \sqrt{3} ) ( \sqrt{2+x} + 2 )}$＝$\lim_{x \rightarrow 2} \frac{x -2}{( x -2 ) ( \sqrt{1+\sqrt{2+x}} + \sqrt{3} ) ( \sqrt{2+x} + 2 )}$

    ＝$\lim_{x \rightarrow 2} \frac{1}{( \sqrt{1+\sqrt{2+x}} + \sqrt{3} ) ( \sqrt{2+x} + 2 )}$＝$\frac{1}{( \sqrt{1+\sqrt{2+2}} + \sqrt{3} ) ( \sqrt{2+2} + 2 )}$

    ＝$\frac{1}{2\sqrt{3}\times 4}$＝$\frac{\sqrt{3}}{24}$'
