  stem: <u>臺灣</u>綜藝節目「油魚遊戲」共有 7 關，每關所玩的遊戲相當公平，3 人一組每組會淘汰 1 人，當參賽者人數不為 3 的倍數時，無法湊成組的人會自動晉級下一關。依前面敘述可寫出函數 f（x）＝$x - \left[ \frac{x}{3} \right]$，如果參賽者有 200 人參加遊戲，則會有 f（200）人晉級，繼續挑戰第二關，……。問此 200 人挑戰 7 關最後成功過關的有＿＿＿＿人。
  answer:
  - '12'
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（200）＝200－$\left[ \frac{200}{3} \right]$＝200－66＝134

    f（134）＝134－$\left[ \frac{134}{3} \right]$＝134－44＝90

    f(90)＝90－$\left[ \frac{90}{3} \right]$＝90－30＝60

    f(60)＝60－$\left[ \frac{60}{3} \right]$＝60－20＝40

    f(40)＝40－$\left[ \frac{40}{3} \right]$＝40－13＝27

    f(27)＝27－$\left[ \frac{27}{3} \right]$＝27－9＝18

    f(18)＝18－$\left[ \frac{18}{3} \right]$＝18－6＝12

    故此 200 人挑戰 7 關最後成功過關的有 12 人'
