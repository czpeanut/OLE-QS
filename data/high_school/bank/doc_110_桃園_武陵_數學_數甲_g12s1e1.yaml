- id: doc_110_桃園_武陵_數學_數甲_g12s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 關於函數 f（x）＝$\begin{cases}x , x\in Q \\ x^{2} , x\notin Q\end{cases}$，下列選項哪些正確？（Q 為所有有理數集合）
  options:
  - label: A
    content: $\lim_{x \rightarrow 1} f ( x )$＝1
  - label: B
    content: $\lim_{x \rightarrow 0} f ( x )$＝0
  - label: C
    content: 函數 f（x）在 x＝1 處連續
  - label: D
    content: 函數 f（x）在 x＝0 處連續
  - label: E
    content: 函數 f（x）在 x＝－1 處連續
  answer:
  - A
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：當 x$\in$Q 時，$\lim_{x \rightarrow 1} f ( x )$＝$\lim_{x \rightarrow 1} x$＝1

    當 x$\notin$Q 時，$\lim_{x \rightarrow 1} f ( x )$＝$\lim_{x \rightarrow 1} x^{2}$＝1

    ∴$\lim_{x \rightarrow 1} f ( x )$＝1

    (B)○：同(A)

    (C)○：$\lim_{x \rightarrow 1} f ( x )$＝1＝f(1)

    ∴f（x）在 x＝1 處連續

    (D)○：$\lim_{x \rightarrow 0} f ( x )$＝0＝f(0)

    ∴f（x）在 x＝0 處連續

    (E)╳：x$\in$Q 時，$\lim_{x \rightarrow -1} f ( x )$＝$\lim_{x \rightarrow -1} x$＝－1

    x$\notin$Q 時，$\lim_{x \rightarrow -1} f ( x )$＝$\lim_{x \rightarrow -1} x^{2}$＝1

    ∴f（x）在 x＝－1 處不連續

    故選(A)(B)(C)(D)'
