  stem: 已知 a，b，c 為常數，$\lim_{x \rightarrow 3} \frac{ax^{2}+bx +c}{x^{2}-9}$＝2，$\lim_{x \rightarrow 2} \frac{ax^{2}+bx +c}{x^{2}-4}$＝－3，求$\lim_{n \rightarrow \infty} \frac{a^{n +1}+b^{n +1}+c^{n +1}}{a^{n}+b^{n}+c^{n}}$＝ ＿＿＿＿。
  answer:
  - '72'
  answer_status: verified
  answer_source: answer_key
  explanation: '由$\lim_{x \rightarrow 3} \frac{ax^{2}+bx +c}{x^{2}-9}$＝2，$\lim_{x \rightarrow 2} \frac{ax^{2}+bx +c}{x^{2}-4}$＝－3

    $\Rightarrowax^{2}$＋bx＋c 有因式 x－3、x－2

    設 $ax^{2}$＋bx＋c＝a（x－3）（x－2）

    代回得$\lim_{x \rightarrow 3} \frac{a ( x -3 ) ( x -2 )}{x^{2}-9}$＝$\lim_{x \rightarrow 3} \frac{a ( x -3 ) ( x -2 )}{( x +3 ) ( x -3 )}$＝$\lim_{x \rightarrow 3} \frac{a ( x -2 )}{x +3}$＝$\frac{a\times 1}{6}$＝2$\Rightarrow$a＝12

    故 $ax^{2}$＋bx＋c＝12（x－3）（x－2）＝$12x^{2}$－60x＋72$\Rightarrow$a＝12，b＝－60，c＝72

    ∴$\lim_{n \rightarrow \infty} \frac{a^{n +1}+b^{n +1}+c^{n +1}}{a^{n}+b^{n}+c^{n}}$＝$\lim_{n \rightarrow \infty} \frac{12^{n +1}+( -60 )^{n +1}+72^{n +1}}{12^{n}+( -60 )^{n}+72^{n}}$ ＝$\lim_{n \rightarrow \infty} \frac{12\times \left( \frac{12}{72} \right) ^{n}+( -60 ) \times \left( \frac{-60}{72} \right) ^{n}+72}{\left( \frac{12}{72} \right) ^{n}+ \left( \frac{-60}{72} \right) ^{n}+1}$＝72'
