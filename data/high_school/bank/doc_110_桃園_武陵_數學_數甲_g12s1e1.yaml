  section: 2
  number: 5
  type: fill
  page: 2
  stem: '下列數列共有幾個極限值存在？

    $\left\langle \frac{4n^{2}+ 7n - 8}{4n - 8} \right\rangle$、$\left\langle \frac{n^{2}+ 5n - 1}{n^{3}- n} \right\rangle$、$\left\langle \frac{( n + 3 )^{5}-( n - 2 )^{5}}{n^{4}} \right\rangle$、$\langle ( \sqrt{3 + \sqrt{8}} - \sqrt{2} )^{n} \rangle$、$\left\langle \frac{2n^{2}+ 1}{n}-\frac{2n - 1}{n} \right\rangle$、$\left\langle \frac{1^{2}+2^{2}+\cdots \cdots +n^{2}}{n^{2}} \right\rangle$

    $答$：＿＿＿＿個。'
  answer:
  - '3'
  answer_status: verified
  answer_source: answer_key
  explanation: '①$\lim_{n \rightarrow \infty} \frac{4n^{2}+7n - 8}{4n - 8}$不存在

    ②$\lim_{n \rightarrow \infty} \frac{n^{2}+5n - 1}{n^{3}-n}$＝0

    ③$\lim_{n \rightarrow \infty} \frac{( n + 3 )^{5}-( n - 2 )^{5}}{n^{4}}$＝$\lim_{n \rightarrow \infty} \frac{( n^{5}+5n^{4}\times 3+\cdots \cdots )-( n^{5}-5n^{4}\times 2+\cdots \cdots )}{n^{4}}$＝25

    ④$\lim_{n \rightarrow \infty} ( \sqrt{3+\sqrt{8}} - \sqrt{2} )^{n}$＝$\lim_{n \rightarrow \infty} ( \sqrt{3+2\sqrt{2}} - \sqrt{2} )^{n}$＝$\lim_{n \rightarrow \infty} ( ( \sqrt{2} + 1 )-\sqrt{2} )^{n}$＝1

    ⑤$\lim_{n \rightarrow \infty} \left( \frac{2n^{2}+1}{n}-\frac{2n -1}{n} \right)$＝$\lim_{n \rightarrow \infty} \frac{( 2n^{2}+1 )-( 2n -1 )}{n}$不存在

    ⑥$\lim_{n \rightarrow \infty} \frac{1^{2}+2^{2}+\cdots \cdots +n^{2}}{n^{2}}$＝$\lim_{n \rightarrow \infty} \frac{\frac{n ( n +1 ) ( 2n +1 )}{6}}{n^{2}}$＝$\lim_{n \rightarrow \infty} \frac{\frac{2n^{3}+3n^{2}+n}{6}}{n^{2}}$不存在

    故共有 3 個極限值存在'
