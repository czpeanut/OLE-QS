- id: doc_110_桃園_武陵_數學_數甲_g12s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 函數 f（x）＝$\frac{x^{3}}{| x |}$，g（x）＝x sinx，下列函數在其定義域的敘述哪些正確？
  options:
  - label: A
    content: f（x）是奇函數
  - label: B
    content: g（x）是偶函數
  - label: C
    content: f（x）×g（x）是奇函數
  - label: D
    content: （f。g）（x）是偶函數
  - label: E
    content: （f。f）（x）是偶函數
  answer:
  - A
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：f（－x）＝$\frac{( -x )^{3}}{| -x |}$＝$-\frac{x^{3}}{| x |}$＝－f（x）

    ∴f（x）是奇函數

    (B)○：g（－x）＝（－x）sin（－x）＝（－x）（－sinx）＝x sinx＝g（x）

    ∴g（x）是偶函數

    (C)○：f（－x）×g（－x）＝（－f（x））×g（x）＝－f（x）×g（x）

    ∴f（x）×g（x）是奇函數

    (D)○：（f。g）（－x）＝f（g（－x））＝f（g（x））＝（f。g）（x）

    ∴（f。g）（x）是偶函數

    (E)╳：（f。f）（－x）＝f（f（－x））＝f（－f（x））＝－f（f（x））＝－（f。f）（x）

    ∴（f。f）（x）是奇函數

    故選(A)(B)(C)(D)'
