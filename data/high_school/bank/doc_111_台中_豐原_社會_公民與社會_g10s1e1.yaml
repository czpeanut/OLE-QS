- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s2_46
  section: 2
  number: 46
  type: single
  page: 7
  stem: 從文中哪一個現象可以充分展現主權國家的特徵？
  options:
  - label: A
    content: 內政部受理申請並依規定准予入籍
  - label: B
    content: 對於有特殊貢獻者應給予特殊對待
  - label: C
    content: 具有乾淨準時的捷運及良好的治安
  - label: D
    content: 人民不會以膚色做為判斷人的標準
  group_stem: '臺灣籃壇首名歸化球員戴維斯「本土變洋將」爭議，幾經波折終於塵埃落定，PLG 職籃聯盟董事會協商確認，歸化球員議題並不影響「Q 就是本土」身分，對此結果當事人百感交集，坦言其實過程並不好受，甚至覺得尷尬又無奈。

    籃球員戴維斯（Quincy Davis）在 2013 年歸化中華民國國籍並放棄美國國籍，當時內政部引用《國籍法》第 6 條規定，認定其對國家有特殊貢獻者，不受居留 5 年等限制受理申請，在各方單位的協助之下，順利入籍。戴維斯曾接受媒體訪問時表示，臺灣有世界上最好的健保系統、臺北的捷運乾淨又準時，最重要的是有良好的治安，這些都是他在美國不曾感受到的。成為臺灣人後，「讓我感受到身為人該有的樣子」，因為臺灣人不會單憑膚色來看待一個人。

    （資料來源：https://reurl.cc/GE6jV3）'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 內政部受理國籍申請並依規定准予入籍，是給予國民身分的展現，屬於主權的對內表現，故選(A)。(B)對於有特殊貢獻者應給予特殊對待，屬合理差別待遇。(C)具有乾淨準時的捷運及良好的治安是國家進步的表現。(D)人民不會以膚色作為判斷人的標準，是人民民主素養的展現。
