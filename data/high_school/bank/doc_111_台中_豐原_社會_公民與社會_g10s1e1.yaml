  stem: 第一則新聞，本次修憲目的在賦予 18 歲公民權，主要是實現哪項公民權利？
  group_stem: '【第一則新聞】

    立法院三讀通過「18 歲公民權」修憲案於 9 月 28 日公告期滿，今日交由中選會辦理公民複決投票。投票日期經中選會委員會議決議，訂於今年 11 月 26 日與地方公職人員選舉同日舉行。

    中選會說明，立法院交付複決事項為「中華民國憲法增修條文增訂第一條之一條文修正案：第一條之一中華民國國民年滿十八歲者，有依法選舉、罷免、創制、複決及參加公民投票之權。除本憲法及法律別有規定者外，年滿十八歲者，有依法被選舉之權。憲法第一百三十條之規定，停止適用。」

    【第二則新聞】

    《流麻溝十五號》為臺灣首部以女性政治犯為主角的電影，改編自曹欽榮的《流麻溝十五號：綠島女生分隊及其他》一書，講述 1950 年代女性政治受難者到綠島集中營進行「思想再教育」的真實故事，英文片名 Untold Herstory 已道盡失語的年代。電影刻畫三位不同年齡身分的女性，包括女學生、才華洋溢的舞者與年輕母親，有的是讀幾本書、唱幾首歌，有的只是追求正義的熱血……，就一同「被消失」帶至火燒島服刑，被抹去名字，改以編號代稱，就連戶籍謄本上也沒有相關資料，僅以「流麻溝十五號」六字代替。

    （資料來源：https://reurl.cc/W1mRKD；https://reurl.cc/RXVWpx）'
  answer:
  - 參政權
  answer_status: verified
  answer_source: answer_key
