questions:
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 最早的民主制度為雅典的直接民主，當時具有公民權利的雅典公民能透過投票創立法律、決定行政議案，及向某個國家開戰，公民也可在大會上進行演講。請問根據雅典民主的敘述，何者正確？
  options:
  - label: A
    content: 當時身受天賦人權思維影響，政治權利不得剝奪
  - label: B
    content: 權利主體已從特殊走向普遍，城邦主權屬於公民
  - label: C
    content: 並非所有雅典人皆為公民，婦女、奴隸皆被排除
  - label: D
    content: 雅典公民是間接參與城邦的治理，無法擔任官職
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 雅典時期的權利主體只侷限在成年男性自由人，婦女、奴隸皆被排除，故(C)正確。(A)天賦人權出現於 17 世紀。(B)雅典時期的權利主體只侷限在成年男性自由人，屬於有限人權。(D)雅典公民是直接參與城邦的治理，亦可以擔任官職。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 美國〈獨立宣言〉指出：「人生而平等，享有造物主賦予的各種不可轉讓的權利，包括生命、自由和追求幸福的權利。」但當時所言的「人生而平等」中的人，只是部分的人，並「不包含」哪些人？(甲)女人；(乙)男人；(丙)黑人；(丁)白人
  options:
  - label: A
    content: (甲)(丙)
  - label: B
    content: (甲)(丁)
  - label: C
    content: (乙)(丙)
  - label: D
    content: (乙)(丁)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 美國立國之初，採有限人權，只有(乙)男人和(丁)白人，才有公民權，婦女、黑人、原住民（印第安人）並未實質享有天賦人權，故選(A)。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 國家應積極保障人民享有維護其人性尊嚴所必需的最低基本生活需求，這樣的概念促使社會福利政策成為國家施政的重點之一。請問上述內容旨在落實何種權利？
  options:
  - label: A
    content: 社會權
  - label: B
    content: 參政權
  - label: C
    content: 自由權
  - label: D
    content: 文化權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 國家積極保障人民享有最低基本生活需求，社會福利政策即為落實積極的社會權保障，故選(A)。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 我國生育率處於低迷不振的狀態，各地方政府紛紛祭出高額生育補助，中央也加碼將每個月的育兒津貼延長到 4 歲，希望藉此減輕新手爸媽負擔及鼓勵生育。請問上述主要涉及的公民身分權利內涵為何？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 參政權
  - label: C
    content: 社會權
  - label: D
    content: 文化權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 地方政府給予生育補助與育兒津貼，屬於積極的社會權保障，故選(C)。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年來，為了積極保障各族群的文化權發展，除了將本土語言（閩南語、客家語、原住民族語）列入中小學的正式課程外，2018 年立法院通過《國家語言發展法》強調尊重我國語言的多元性，並且追求各語言之平等。這些政策對於各族群文化有何幫助？
  options:
  - label: A
    content: 有效強化特定族群的優勢地位
  - label: B
    content: 提升國家認同度以降低歧異性
  - label: C
    content: 保有並發展其獨特文化的權利
  - label: D
    content: 保障各族群文化的媒體傳播權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《國家語言發展法》強調尊重我國語言的多元性，並且追求各語言之平等，是為了落實多元文化主義，維護各族群的文化傳統，故選(C)。(A)應保障各族群地位平等。(B)維護多元性，有助於提升國家認同。(D)語言不屬於媒體傳播權。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 布農族獵人王光祿為孝敬年邁母親，上山獵捕山羊、山羌而遭法院以《野生動物保育法》、《槍砲彈藥刀械許可及管理辦法》判處有期徒刑 3 年 6 個月。本案經法律扶助基金會向最高檢察署聲請非常上訴獲准並暫緩執行，且以最高法院合議庭法官名義聲請釋憲，希望透過大法官解釋，能真正理解並尊重原住民族之傳統習俗、文化及價值觀，進而保障原住民的權益。此案件是我國法律與下列何種基本人權的衝突？
  options:
  - label: A
    content: 文化權
  - label: B
    content: 參政權
  - label: C
    content: 社會權
  - label: D
    content: 自由權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 法律在制定之時未能理解並尊重原住民族之傳統習俗，屬於法律與文化權的衝突，故選(A)。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 桃園市素來擁有親切厚實的族群包容性格，不僅是全國客家人口數最多的縣市，也是西半部原住民族最多的城市，新住民人口也占全臺一成以上，加上閩南聚落與眷村，以及為數不少的移工，呈現臺灣豐富的多元族群。請問目前政府對於多元族群的做法，下列何者「錯誤」？
  options:
  - label: A
    content: 制定《原住民族基本法》
  - label: B
    content: 法規政策中的「原住民」正名為「原住民族」
  - label: C
    content: 成立客家電視臺以推動、振興客家語言文化
  - label: D
    content: 針對閩南族群訂定《閩南基本法》保護權益
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)目前我國並未制定《閩南基本法》。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 人權保障的發展，從「有限人權」邁向「普遍人權」始於下列何項文獻？
  options:
  - label: A
    content: 美國〈獨立宣言〉
  - label: B
    content: 聯合國《公民與政治權利國際公約》
  - label: C
    content: 聯合國〈世界人權宣言〉
  - label: D
    content: 《聯合國經濟社會文化權利國際公約》
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 第二次世界大戰時，由於納粹對猶太人的迫害暴行，使各國人們深切地認識到要避免戰爭的再度發生，必須重視人權，因此聯合國於 1948 年 12 月 10 日公布〈世界人權宣言〉，人權保障的發展，從「有限人權」邁向「普遍人權」，故選(C)。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 1948 年聯合國發表〈世界人權宣言〉以來，一直致力人權的保護，請問下列何者「不是」屬於聯合國人權組織（機關）？
  options:
  - label: A
    content: 人權理事會
  - label: B
    content: 人權公約機構
  - label: C
    content: 人權事務高級專員
  - label: D
    content: 自由之家
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)自由之家是非營利機構，主要從事民主、政治自由和人權方面的研究和倡議。(A)(B)(C)均隸屬聯合國。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 善逸不小心在公民課堂上睡著，醒來後看到自己筆記寫著：「此組織關注死刑、酷刑、難民等議題，每年 12 月會舉辦「寫信馬拉松」，透過信件聲援受到人權迫害的人們」。請問筆記描述的應該是
  options:
  - label: A
    content: 國際紅十字會
  - label: B
    content: 國際特赦組織
  - label: C
    content: 無國界記者
  - label: D
    content: 自由之家
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「寫信馬拉松」起源於國際特赦組織波蘭分會，24 小時不間斷的寫信聲援人權受侵害的人們，是全球最大的人權行動盛會，故(B)正確。(A)國際紅十字會是一個國際人道主義組織，主要從事領導和組織大規模緊急救援。(C)無國界記者是一捍衛新聞自由的國際非營利組織。(D)自由之家主要從事民主、政治自由和人權方面的研究和倡議。
- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 國際勞工來臺工作逐年增加，勞動部統計目前共有 28 萬（占 44 ％），在臺從事「3K 產業」（日語 Kitanai、Kiken、Kitsui，骯髒、危險、辛苦）；其次有 22 萬（約 36 ％），投入家庭看護工的工作。且經常因職災無法得到協助，產生另一社會問題。此人權之維護可參考聯合國的何項公約進行立法？
  options:
  - label: A
    content: 《消除一切形式種族歧視國際公約》
  - label: B
    content: 《保護所有人免遭強迫失蹤國際公約》
  - label: C
    content: 《保護所有移徙工人及其家庭成員權利國際公約》
  - label: D
    content: 《禁止酷刑和其他殘忍、不人道或有辱人格的待遇或處罰公約》
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '與國際移工保護最有關係的公約，應為(C)《保護所有移徙工人及其家庭成員權利國際公約》。

    12.1971 年，我國在聯合國的代表權被中華人民共和國取代後，因為國際地位爭議，無法成為任何國際人權公約的正式締約國，因此立法院通過國際人權公約的施行法，使國際公約具有國內法效力，故選(A)。(B)我國不是聯合國會員，故無法完成公約批准並交存聯合國的程序。(C)人權公約不能選擇性遵守。(D)人權是普世價值，我國將人權法制化有助提高國際形象。

    13.聯合國九部核心人權公約都各自建立了由獨立專家所組成的委員會，負責監督各個締約國的落實情況。依據聯合國模式，各締約國須提交報告及進行審查，故選(C)。(A)每個人權公約都有一個單獨的監督機構。(B)聯合國人權事務高級專員由聯合國祕書長任命，經聯合國大會核准產生。(D)聯合國進行訪視與人權調查須經我國同意。

    14.「國家認同」是指個人認為自己歸屬於哪一個政治共同體，而當國家遇到外來的攻擊或國際衝突與競爭時，較容易激發一國人民的向心力，故選(D)。

    15.以色列的《民族國家法》，將以色列定義為猶太人民族國家，由此判斷以色列國家認同的主要因素為血緣，故選(B)。

    16.《司法院釋字第七四八號解釋施行法》保障同性婚姻，使同性戀者與異性戀者皆擁有結婚的權利，由此顯示對不同性傾向者的肯定，故選(C)。(A)(D)去除對社會處境不利群體的不公平待遇，保障其婚姻自由為消極權。(B)肯認多元身分雖可促進國家認同，但不是直接目的。

    17.主權對內是指國家對內的最高統治權力，也就是國家統治權的權力來源；對外是指國家對外擁有獨立自主且平等的國家權力，不受其他國家的干涉，故(A)錯誤。

    18.國家的構成要素有：人民、土地、政府、主權，吉普賽有人民，再加上一塊可以供居住為領土，且不屬任何國家管轄，有政府與主權，故選(D)。(A)文字非國家構成要素。(B)即使聯合國或國際組織不承認，仍可以成為國家。(C)國家不一定要是民主國家。

    19.國際法上對於主權的取得有二種說法：一是「宣示說」，認為國家的存在是客觀的事實，並不需要他人的承認，就可以自動獲得主權；二是「構成說」，主張國家必須經過他國的承認，否則在國際上並沒有地位。因此巴勒斯坦國積極尋求國際承認其主權，即在獲得國際社會對主權的認同，故選(C)。

    20.《中華民國憲法》第二條明訂：「中華民國之主權屬於國民全體」，故選(C)。

    21.國家主權廣泛表現在日常生活中，例如：發行貨幣、證明身分、頒布法律等，而海巡署派遣船艦在我國海域實施護漁，即為一例，故選(B)。(A)為經濟交易。(C)我國非 WHA 正式會員，只能列席，表示主權未受承認。(D)為人道救援，但與他國承認無關。

    22.身分證是用於證明持有人身分的證件，多數由各國或地區政府發行予公民，它將作為每個人獨一無二公民身分的證明工具，為主權對內最高性的展現。故選(A)。

    23.日韓對「獨島」或「竹島」的爭議，代表兩國對此小島的領土歸屬與主權有爭議，故選(C)。

    24.頓內茨和盧甘斯克本為烏克蘭領土，但在俄國的鼓動下，公投脫離烏克蘭獨立，此舉對烏克蘭而言，代表其領土及主權完整性受俄國挑戰而陷入危機，故選(B)。(A)頓內茨共和國與盧甘斯克共和國原本並非俄國領土。(C)各國主權地位平等。(D)烏克蘭因為不承認此公投的效力，仍主張具有該地區主權，故會對該地區人民給予各項權利義務。

    25.中國政府一再打壓臺灣，導致我國邦交國減少，顯示部分國家不承認我國的主權，故法律主權受國際質疑，答案選(D)。(A)《憲法增修條文》中將我國有效統治範圍定為包括臺灣、澎湖、金門、馬祖的「自由地區」。(B)我國目前主權實際控制範圍與《憲法》制定時界定的領土範圍不同。(C)目前臺灣政府統治權是由人民合法選舉產生，具有正當性。

    26.(A)《臺灣地區與大陸地區人民關係條例》的法源是依據《憲法增修條文》，為正解。(B)《國家安全法》旨在確保國家安全，維護社會安定。(C)《國家統一綱領》已在 2006 年 2 月 27 日由時任總統陳水扁於國家安全會議裁示「終止適用」。(D)《動員戡亂時期臨時條款》自 1948 年（民國 37 年）5 月 10 日公布實施起，以適應動員戡亂時期政軍情勢，直到 1991 年（民國 80 年）5 月 1 日公告廢止。

    27.由圖中可以看出，「維持現狀再決定」與「永遠維持現狀」的比例最高，故判斷臺灣民眾較傾向維持現狀，答案選(D)。

    28.我國無法使用中華民國或臺灣之名參與奧運，主要的原因在於承認我國主權的國家不多，因此欠缺國際上的法理主權，答案選(B)。(A)我國有領土。(C)我國有事實主權。(D)我國人民對國家有認同。

    29.(A)「中華臺北」是中華民國在國際體育賽事及亞太經合組織、經濟合作發展組織等國際組織中使用的稱謂，源自兩岸分治後奧林匹克運動會的「中國」代表權爭議。為了解決我國在國際社會中「法理主權」的名稱問題，我國參加許多國際組織多以中華臺北的名義參加。

    30.我國因兩岸特殊的關係，在國際事務參與或互動上因中國堅持「一中原則」，形成我國參與國際事務的主要障礙，答案選(A)。(B)幾乎所有國際組織，我國都不能以正式的國名參加。(C)以「臺澎金馬個別關稅領域」名稱加入世界貿易組織。(D)以觀察員身分受邀世界衛生大會。

    31.題幹所述為民間外交，與(A)最相同。(B)(C)(D)屬正式的官方外交。

    32.某媒體出現歧視身障者標題，公民團體發動抗議，要求媒體承諾改善，此即公民團體擔負監督媒體角色並以行動增進社會公益，故選(C)。(A)網友肉搜，揭露虐待者身分，可能會有侵犯個資及不符程序正義的問題。(B)為媒體接近權。(D)環保團體結合媒體力量揭露某公司排放有毒廢水，此為志願團體結合媒體，發揮民間監督企業與政府的力量。

    33.媒體針對年金改革採訪立場相異團體，並探討此改革對國家人民的影響，此即媒體對於新聞事件提供不同分析觀點，並可能提出相關改善措施，以發揮媒體的公共角色，故選(D)。(A)(B)(C)為媒體報導事實，提供閱聽人消息，或引發民眾關注此事件。

    34.置入性行銷指刻意將行銷事物以巧妙的手法置入既存媒體，以期藉由既存媒體的曝光率來達成廣告效果，故選(C)。(A)(B)(D)為廣告，廣告會讓閱聽人可以認知到廠商的行銷行為，與置入性行銷不同。

    35.媒體不會直接殺人，但新聞報導的輿論壓力或錯誤形象卻可能直接將人「定罪」，主要即是媒體帶風向的議題設定，對某些人貼標籤，故選(C)。(A)媒體不具公權力。(B)媒體背後有商業利益與政治操作，但與題文敘述無關。(D)民主國家為確保新聞自由，不會審核新聞產製過程，但媒體仍應為其言論負責。

    36.題文所述即是讓社群的成員都是支持該名候選人的粉絲，這會導致人們只願意接受與自己立場相近的觀點，對其他觀點視而不見，不同群體之間的對話變得愈加困難，故選(D)。

    37.媒體傳播的內容即如題文所述，是經過加工後的二度呈現，此即「媒體再現」，其傳播的內容往往與事實之間有所出入，無法完整反映社會現實，甚至同樣的新聞，在不同媒體報導下，其呈現的立場與觀點也不盡相同，答案選(A)。

    38.當媒體報導、評論內容涉及相關人士、機關的權利時，應給相關人士答辯機會。題文中新聞媒體因為沒有給予被報導的當事人答辯機會，當事人才會在事後要求更正與刪除不正確的影片，故選(D)。

    39.媒體須給予報導關係人更正事項的權利，以避免妨害當事人的名譽與隱私，故選(C)。

    40.移工製作的議題短片，幾乎無媒體頻道可播出，由此可見移工團體的媒體近用權保障未能落實，而影響其公共意見無法表達，故選(A)。(B)記者雖引述不實資訊報導，但題文並未描述移工團體因而飽受輿論指責。(C)移工並未缺乏媒體資訊，而是沒有管道表達意見。(D)移工群體不是因為不具公民身分才沒有行動力。

    41.(A)國家通訊傳播委員會是中華民國有關電信通訊和廣播電視等訊息流通事業的最高主管機關，因此若媒體違法時，應由國家通訊傳播委員會進行裁罰。

    42.(C)臺灣事實查核中心（TFC）是臺灣的事實查核非營利組織，透過事實查核，抑制媒體不實資訊的負面影響，提升公眾的資訊素養，屬於民間團體監督媒體。'
