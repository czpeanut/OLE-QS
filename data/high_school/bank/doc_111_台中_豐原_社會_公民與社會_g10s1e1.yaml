- id: doc_111_台中_豐原_社會_公民與社會_g10s1e1_s2_43
  section: 2
  number: 43
  type: single
  page: 6
  stem: 第一則新聞，行政院推疫情急難紓困金補助，性質為急難救助，主要是保障哪項公民權利？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 社會權
  - label: C
    content: 參政權
  - label: D
    content: 文化權
  group_stem: '【第一則新聞】

    行政院推疫情急難紓困金 1 萬元到 3 萬元補助，根據衛福部統計，從 3 月 19 日到昨天晚間止，受理 13 萬 2,336 案、核定 4,068 件，共 5,652 萬 600 元。

    【第二則新聞】

    李登輝前總統於其主政 12 年間，透過 6 次修憲完成不流血的「寧靜革命」。包括，終止「動員戡亂時期」、廢除《動員戡亂時期臨時條款》；總統任期定為一任 4 年，連選得連任一次；確立省長和直轄市長民選制度，落實地方自治；第 3 次修憲時，更確定了公民直選總統的制度，這項臺灣政治史上的巨大變革，落實了國民主權理念。

    【第三則新聞】

    聯合國報告指出，中國在新疆的集中營恐拘禁上百萬人，但中國硬說那是協助維族人士就業訓練的「再教育營」，被關進集中營，一舉一動都受到嚴密管制，從床位、座位、工作地點到排隊順序，都不准有變動。文件內提到，進入集中營之後，只有思想、信仰、語言都表現出改變之後，徹底接受洗腦，才有可能獲釋。願意認錯、對過去行為悔悟的人，才可獲得嘉許。表現出負面態度，甚至有反抗之意，就必須「教育」他們達到效果。

    （資料來源：https://reurl.cc/8nN6Rg；https://reurl.cc/m90lpM；https://reurl.cc/zz6ALe）'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 行政院推疫情急難紓困金補助，屬於一種生存權的保障，故為(B)社會權。
