- id: doc_109_台中_台中二中_數學_g10s1e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: '設 x＝$\sqrt{5} -2$，求下列各式的值：

    (1)$x +\frac{1}{x}$＝＿＿＿＿。

    (2)$x^{2}+\frac{1}{x^{2}}$＝＿＿＿＿。

    (3)$x^{3}-\frac{1}{x^{3}}$＝＿＿＿＿。'
  explanation: '(1) x＝$\sqrt{5} -2\Rightarrow\frac{1}{x}=\frac{1}{\sqrt{5} -2}=\sqrt{5} +2$

    ∴$x +\frac{1}{x}$＝$\sqrt{5} -2+\sqrt{5} +2=2\sqrt{5}$

    (2)$x^{2}+\frac{1}{x^{2}}$＝$\left( x +\frac{1}{x} \right) ^{2}-2 \cdot x \cdot \frac{1}{x}$＝$(2\sqrt{5} )^{2}-2$＝18

    (3)$x -\frac{1}{x}$＝$\sqrt{5} -2-(\sqrt{5} +2)$＝－4

    $x^{3}-\frac{1}{x^{3}}$＝$\left( x -\frac{1}{x} \right) ^{3}+3x \cdot \frac{1}{x} \cdot \left( x -\frac{1}{x} \right)$

    ＝（－4）$^{3}$＋3．1．（－4）＝－76'
- id: doc_109_台中_台中二中_數學_g10s1e1_s2_3
