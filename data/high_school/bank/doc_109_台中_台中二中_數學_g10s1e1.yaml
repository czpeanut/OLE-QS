  stem: '如右圖，平面上有共線三相異點 A，B，C，其中 B 介於 A、C

    之間，已知$\overline{AB} =2$，$\overline{BC} =14-4\sqrt{6}$。以$\overline{AC}$為直徑作一半圓，過 B 作$\overline{AC}$垂直線交半圓於 D，若$\overline{BD}$的長度可化簡為$a +b\sqrt{6}$（其中 a，b 皆為整數），則數對（a，b）＝＿＿＿＿。'
  assets:
  - key: s2_3_f1
    kind: figure
    file: doc_109_台中_台中二中_數學_g10s1e1/s2_3_f1.png
    crop:
      page: 2
      rect:
      - 415.7
      - 53.05
      - 563.3
      - 135.2
  explanation: '$\overline{BD}^{2}=\overline{AB} \times \overline{BC} =2 (14-4\sqrt{6} )=28-2\sqrt{96}$

    ∴$\overline{BD}$＝$\sqrt{28-2\sqrt{96}} =\sqrt{(\sqrt{24} -\sqrt{4} )^{2}}$＝$\sqrt{24} -\sqrt{4} =-2+2\sqrt{6}$

    $\Rightarrow$數對（a，b）＝（－2，2）'
