questions:
- id: doc_113_台北_明倫_社會_歷史_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「凱達格蘭族群原住於中原山西地方，人口數萬人。有一天忽然天昏地暗，出現一隻大怪蛇，族人都被噬去，只剩兄妹二人，遂結為夫婦，傳承子孫。其後又遇有大洪水，田園廬舍均被淹沒，族人乃相率渡海，在基隆附近的海岸上陸。」這個凱達格蘭族群的傳說，為日治時期學者的調查訪問所採錄，由此記載我們應該有何認知？
  options:
  - label: A
    content: 傳說並非歷史，缺乏參考價值
  - label: B
    content: 臺灣原住民都是從中國大陸遷居來臺
  - label: C
    content: 各民族皆有洪水傳說，可見南島語族的足跡遍及世界各地
  - label: D
    content: 凱達格蘭族早期的主要活動區域在北臺灣
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)即使是傳說，也有一定的參考價值。(B)臺灣原住民屬於南島語族，學者研究很可能起源自臺灣。(C)南島語族的活動與分布有一定範圍，並非遍及世界各地。

    2.1950 ～ 1960 年代已是國民政府治臺時期，對原住民的政策為(丁)(戊)，答案為(D)。(甲)(乙)(丙)為日治時期總督府的原住民政策。

    3.採用西洋的計畫手法規劃居住區域應是日治以後，加上兩則資料顯示該居住地居民經濟生活以農業為主，不太可能是為戰後的眷村或滇緬泰移民所規劃，因此答案為(B)日治時期移民村的規劃。

    4.(B)高山族與平埔族皆有祖靈崇拜，並尊重各種自然神靈。(C)彩虹橋為泰雅族、太魯閣族、賽德克族的傳說。(D)平埔族亦有祈求豐收的祭典。

    5.(A)布農族屬父系社會；貴族社會為排灣族、魯凱族。(C)達悟族屬父系社會，財產與家系由男子繼承。(D)平埔族多屬母系社會。

    6.臺灣的跨國婚姻中，以中國大陸籍的配偶人數最多，因此為圖中的(A)甲曲線。

    7.(C)日本統治時期，學者伊能嘉矩首先以科學方式對臺灣原住民族進行種族分類。

    8.(C) 1955 年中共對一江山島與大陳島展開攻勢，在一江山島淪陷後，國民政府決定撤離大陳島居民，稱為「大陳義胞」。

    9.從「新人又不斷移來……臺灣未能言之安定」一段，可知姚瑩對臺灣未來治安的憂心，因此(D)為正解。(A)姚瑩並未提出開山撫番建議。(B)姚瑩認為土牛界並非長治久安之計。(C)從「番族勢力龐大，漢人……不敢深入」，可推知當時的水埔二十四社應是生番地。

    10.火神祭為(B)撒奇萊雅族的祭典，以祭祖儀式為基礎，放火焚燒祭屋以告慰在加禮宛抗清事件犧牲的祖先。

    11.題文所述原住民部落的轉變為國民政府治臺以後的措施，因此開始推動的機構為(A)行政長官公署。(C)原住民族委員會於 1996 年底才成立，並非開始推動題文政策的機構。

    12.(B)丁日昌延續沈葆楨的撫番政策，並且留意原住民族的教育，於任內錄取臺灣首位「番秀才」。

    13.從時間與地點可判斷此備忘錄為荷蘭統治者所留存，正確答案為(D)。(A)「土著」西拉雅族屬於平埔族。(B)能於熱蘭遮城書寫備忘錄者，應是荷蘭派遣來臺的統治者，非一般傳教士。(C)荷蘭人在臺傳布的宗教信仰為基督新教。

    14.(A)原住民的圖騰並非只有動物，也有植物。(B)丁字褲為達悟族的傳統服飾，非各族皆如此穿著。(D)原住民的衣飾顏色除黑、白外，尚有藍、黃、紅、綠等色系。

    15.1628 年臺灣南部為荷蘭人所統治，為了農業生產，招募不少漢人開發土地，因此正確答案為(C)。(A)荷蘭人對漢人課以名目繁多的賦稅。(B)荷蘭統治者不允許漢人擁有土地所有權，因此漢人不可能為尋更好的耕地而頻繁搬遷。(D)當時來臺漢人的數量不多，少有團體與集會活動。

    16.「部落主義」的概念即回歸部落、回歸原鄉，(A)(B)(C)皆不符合回歸傳統的做法，因此正確答案為(D)。

    17.(A)明朝陳第已使用「東番」稱呼臺灣原住民。(B)《說文解字》將番字解釋為獸足，與原住民自視的「人」意思不同。(C)高山番與平埔番皆為外族的稱呼，非原住民的自稱。

    18.(B)顏思齊拓墾的地區在今北港至嘉義一帶。(C)顏思齊死後，所部為鄭芝龍所接管，兩人並未長期對立。(D)豐臣秀吉曾派遣使者來臺要求原住民族朝貢，非在臺漢人勢力。

    19.此份報告一再強調對蕃地的經營要從「經濟上」、「財政上」解決，選項中僅(C)提到「攫取臺灣山地資源」符合此觀點。

    20.□□族群在械鬥中曾勾結生番，犯後並逃竄至後山花東地區，可判斷應為住在近山丘陵地區的客家人，答案選(A)粵籍。

    21.(B)鄭成功擁戴南明政權，堅持反清復明。(C)臺灣從未納入明帝國的版圖。(D)此指臺灣在鄭氏治理下，百廢俱興。

    22.清初對山區、東部原住民部落以土牛界線隔離，至沈葆楨之後才改採開山撫番政策，正確答案為(B)。(A)為 19 世紀晚期。(C)沈葆楨來臺與牡丹社事件有關。(D)山區、東部的原住民部落為高山族。

    23.海商集團曾招募漳、泉百姓來臺開墾，但人數不足以稱之為「大規模且有計畫的」移民。正確答案應是(B)荷蘭統治時期，為增加農業產量，荷蘭人大規模招募中國東南沿海漢人來臺墾荒，形成來臺漢人第一波高峰期。

    24.滯緬國軍於 1954 年、1961 年兩次撤軍來臺，安置於中壢忠貞新村、新北的中和、永和與南投清境農場附近，故選(C)。

    25.17 世紀向澎湖、臺灣一帶發展的海上新勢力應為(A)荷蘭。(B)西班牙與葡萄牙同時發展海上事業，非新崛起的海上勢力。(C)英國於 17 世紀初尚未在澎湖、臺灣一帶發展勢力。(D)漢人海商集團的勢力更早崛起，且不符合企圖「建立與中國的貿易」敘述。

    26.康熙年間的臺灣尚屬移墾社會，當地地廣人稀且有嚴格的《渡臺禁令》，因此答案為(B)。(A)當時的土地開墾多在南部地區，東部尚未開發。(C)頂下郊拚發生於咸豐年間。(D)此時應為「唐山祖」宗族組織。

    27.安撫司為鄭氏時期的地方行政機構，鄭經曾於澎湖設置安撫司，因此答案為(D)。

    28.題文所述為清初的三條《渡臺禁令》，正確答案為(D)。(A)康熙年間頒布的禁令。(B)沿海移民多偷渡來臺，人數並未大量減少。(C)來臺移民多為閩人，非浙人。

    29.(B)葡萄牙人並未攻打基隆、淡水等地。(C)應是日本的鎖國政策。(D)菲律賓南部的動亂，使西班牙人急於撤軍回菲律賓平亂。

    30.(B) 17 世紀的漢人移民宗族組織多為唐山祖。(C)《渡臺禁令》在 19 世紀晚期才廢止。(D) 19 世紀後期臺灣開港後，漢人已少有械鬥事件。

    31.(A)滇、緬、泰移民於 1950 年代中期才移入臺灣，人數也不足百萬。(C)「新住民」指 1980 年代後的新移民配偶；來自中國逃難的移民被稱為「外省人」，亦將其原鄉的飲食文化與生活習慣帶進臺灣。(D)國際移工來臺自 1989 年起，非 1970 ～ 1980 年代。故答案為(B)。

    32.三山國王原為客家人的鄉土神，顯見早期新莊應有客家人定居開墾，但後來客家人被迫離開當地，最可能的原因與閩粵械鬥有關，人數較少的粵籍人士常在械鬥中居於劣勢，因此答案為(C)。(A)《渡臺禁令》並未規定各族群的居住地區。(B)日本總督府欲開發臺灣東部，曾鼓勵桃竹苗客家人移居花東。(D)客家人在國民政府遷臺前已居於桃竹苗。

    33.資料中的主角搭船的目的地為臺灣的後山，(A)(B)的登陸地點不符。(D) 1930 年代的官營移民地點在臺灣西部的濁水溪、高屏溪等河床一帶，因此答案為(C) 1910 年代的官營移民，地點在花蓮、臺東一帶。

    34.康熙將臺灣納入版圖後，採「為防臺而治臺」的態度，將與鄭氏政權相關人士、沒有妻室產業者、犯罪者等遣送回中國大陸，使臺灣出現「人去業荒」的情形，(B)為正解。

    35.(A)此時來臺多為從事建置與管理殖民地之工作人員，非大量日軍駐防。(B)賀田組於 1899 年建立第一個私營移民村，但宣告失敗，此時的移民多為官營移民。(C) 1930 年代的官營移民已轉向西臺灣濁水溪、高屏溪河床一帶。'
