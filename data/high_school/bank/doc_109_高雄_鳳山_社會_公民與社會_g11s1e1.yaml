  stem: 屏東種植紅豆的農民，過去為避免鳥害造成農損，會利用毒餌造成小型鳥類死亡，進而導致撿食的老鷹跟著中毒。近來因維護生態環境，農夫改變耕作方式，在播種期不毒鳥、採收時不用落葉劑，以新創農業的方式建立「老鷹紅豆」品牌以及產銷履歷。雖然生產紅豆的成本上升，但有效提升消費者對產品的評價，使市場銷售價格與數量都大幅提升。老鷹紅豆的契作地區主要在屏東東港和萬丹一帶。請問：以下何者最可以表現屏東紅豆由傳統產銷方式到新創品牌後，其市場供給與需求的變動情形？
