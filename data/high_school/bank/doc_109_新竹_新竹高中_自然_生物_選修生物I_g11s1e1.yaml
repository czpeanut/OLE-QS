  - label: C
    content: c—已將胞器分解的溶體
  - label: D
    content: d—不含水解酵素的自噬小體
  group_stem: 每一個科學主題的釐清都累積許多人的投入，透過不斷地觀察、理論推導及實驗驗證，現今我們能從教科書中了解生物體運作的機制概要。以「細胞自噬」為例，1950年代科學家先發現了內含多種水解酵素的胞器，稱之為「溶體」，它可以將胞器分解並將物質回收再利用；1974年諾貝爾生醫獎得主杜武發現「細胞自噬」的現象；2004年諾貝爾化學獎得主解開分解蛋白質的系統；2016年諾貝爾生醫獎得主大隅良典利用酵母菌作為模式生物進行研究，找到控制細胞自噬的基因及其作用機制，當細胞進行自噬時，會由變形增大的囊泡包裹壞掉的胞器而形成雙層膜的自噬小體，然後與溶體融合，再利用溶體內的酵素將之分解，此現象普遍存於各種生物體細胞中，包括人體。
