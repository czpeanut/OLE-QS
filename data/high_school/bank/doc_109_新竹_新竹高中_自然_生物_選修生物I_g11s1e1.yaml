- id: doc_109_新竹_新竹高中_自然_生物_選修生物I_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 水是生物體內含量最多的化合物，其獨特的化學及物理性質，對生命產生不言可喻的重要性。下列關於水分子的敘述，何者正確？
  options:
  - label: A
    content: 水分子間透過H-H形成氫鍵
  - label: B
    content: 水分子具有極性，可溶解不具極性的溶質，如：葡萄糖
  - label: C
    content: 水的比熱較大，有助於生物體維持體溫，不易變動
  - label: D
    content: 水分子間可造成內聚力，減緩植物體內的水分運輸，以減少蒸散
  group_stem: 【1.～10.為題組】生物體內的大分子有機物分為醣類、蛋白質、脂質及核酸等四類，這些大分子大多由特定的基本單元聚合而成，每一類中再依組成分差異區分出更多的項目，分別在生物體內扮演不同的角色。除此之外，生物體內的小分子，包括水、礦物質及維生素，也各司其職，不可或缺。
  tags:
