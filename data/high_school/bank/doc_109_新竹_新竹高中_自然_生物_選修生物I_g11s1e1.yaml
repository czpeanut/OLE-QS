  group_stem: 細胞骨架是細胞質內纖維狀，絲狀或網狀的構造，由蛋白質構成，依直徑大小區分為三種形式，如下圖。整體而言，細胞骨架具有維持細胞形狀、支持胞內構造、協助細胞運動、協助胞器及染色體等移動的功能。微管也是構成紡錘絲、中心粒、鞭毛及纖毛的成分；中間絲為較穩定的網狀結構，一般不參與細胞運動；微絲則與肌肉收縮、原生質流與動物細胞的分裂溝等有關。
