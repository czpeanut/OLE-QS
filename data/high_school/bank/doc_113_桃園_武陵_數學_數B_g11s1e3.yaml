- id: doc_113_桃園_武陵_數學_數B_g11s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 關於向量內積的敘述，下列哪些正確？
  options:
  - label: A
    content: 在△ABC中，若$\vec{AB}$．$\vec{AC}$＜0，則△ABC是個鈍角三角形
  - label: B
    content: 在△ABC中，若$\vec{AB}$．$\vec{AC}$＞0，則△ABC是個銳角三角形
  - label: C
    content: 當$\vec{a}$≠$\vec{0}$時，若$\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$，可推得$\vec{b}$＝$\vec{c}$
  - label: D
    content: 若兩非零向量$\vec{a}$，$\vec{b}$滿足|$\vec{a}$＋$\vec{b}$|＝|$\vec{a}$－$\vec{b}$|，則$\vec{a}$⊥$\vec{b}$
  - label: E
    content: 若兩非零向量$\vec{a}$，$\vec{b}$滿足($\vec{a}$＋$\vec{b}$)⊥($\vec{a}$－$\vec{b}$)，則$\vec{a}$，$\vec{b}$兩向量的長度相等
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (1) ○：$\vec{AB}$．$\vec{AC}$＜0，表示∠BAC＞90°。 (2) ×：$\vec{AB}$．$\vec{AC}$＞0，表示∠BAC＜90°，但∠B，∠C仍有可能出現鈍角或直角。 (3) ×：內積無消去律。 (4) ○：|$\vec{a}$＋$\vec{b}$|$^{2}$＝|$\vec{a}$－$\vec{b}$|$^{2}$ |$\vec{a}$|$^{2}$＋2$\vec{a}$．$\vec{b}$＋|$\vec{b}$|$^{2}$＝|$\vec{a}$|$^{2}$－2$\vec{a}$．$\vec{b}$＋|$\vec{b}$|$^{2}$ ⇒ $\vec{a}$．$\vec{b}$＝0 ∵$\vec{a}$，$\vec{b}$非零向量 ∴$\vec{a}$⊥$\vec{b}$ (5) ○：($\vec{a}$＋$\vec{b}$)．($\vec{a}$－$\vec{b}$)＝|$\vec{a}$|$^{2}$－|$\vec{b}$|$^{2}$＝0 ⇒ |$\vec{a}$|＝|$\vec{b}$|。 故選(A)(D)(E)。
