questions:
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「竇太后臨朝，外戚竇憲掌權。皇帝成年後與宦官合謀誅殺竇氏黨羽」、「何太后臨朝，外戚何進執政。欲謀誅殺宦官，事洩，為宦官所殺。」依上文資料判斷，下列敘述何者正確？
  options:
  - label: A
    content: 漢武帝尊崇儒術，開啟漢代外戚輔政的先例
  - label: B
    content: 政爭的開端源自皇帝年幼即位，大權旁落
  - label: C
    content: 為了制衡皇權而產生的必然結果
  - label: D
    content: 可以論證五德循環的相生相剋之說
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 武王伐紂，以「小邦周」取代「天邑商」，帶給周人什麼樣的啟示？
  options:
  - label: A
    content: 商王權力有限，周天子加強王權
  - label: B
    content: 商因天命而亡，周人認為天命不可信
  - label: C
    content: 周人不再敬鬼神
  - label: D
    content: 天命靡常，惟德居之
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 甲時期：「出身低微但深受皇帝重用的大將軍，提出與江南望族聯姻請求時，連皇帝也不敢答應。」 乙時期：「皇帝即位後，宰相職務分立，不得過問軍事，還必須受諫官的監督。」 丙時期：「皇帝統轄所有官員，另外再設置特務組織監視臣民。」 丁時期：「官員直接對皇帝上奏密摺，大小政事都須皇帝硃批才能執行。」 請問上述四個時期，應各自分屬哪一朝代現象？
  options:
  - label: A
    content: 南朝、宋、明、清
  - label: B
    content: 唐、五代、明、清
  - label: C
    content: 東晉、唐、宋、明
  - label: D
    content: 漢、隋、唐、元
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 唐中葉後，賦役制度從租庸調法改為兩稅法，關於其背景或影響的敘述，下列何者正確？
  options:
  - label: A
    content: 土地開墾飽和，政府無荒地可授，只好直接課徵錢幣
  - label: B
    content: 戶籍散亂使政府改行兩稅法，以現有男丁徵加力役，卻造成沉重負擔
  - label: C
    content: 兩稅法將實物交稅改以錢幣繳納，有利貨幣經濟的發展
  - label: D
    content: 兩稅法可避免政府濫增名目收稅，也可杜絕土地兼併問題
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 歷代中國有兩項主要賦稅，一是田賦稅、二是人丁稅。中國百姓為了逃避賦稅、徭役，常會隱匿人丁不報之情形。直到哪一項稅制改革之後，百姓即可無須再隱匿人口了？
  options:
  - label: A
    content: 新莽的王田制
  - label: B
    content: 北魏的均田制
  - label: C
    content: 中唐的兩稅法
  - label: D
    content: 清代的攤丁入畝【改寫95指考】
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 朝鮮半島上的某個王朝，曾仿唐朝制定許多國家體制、使用年號，外交政策上採取「外王內帝」的方針，即對中國自稱為國王、在國內自稱為皇帝。請問此王朝應為下列何者？
  options:
  - label: A
    content: 新羅王朝
  - label: B
    content: 高麗王朝
  - label: C
    content: 朝鮮王朝
  - label: D
    content: 大韓帝國
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 學者認為：國家失道，將敗之際，上天會先降下災害，以為警惕。如果人君無法領受天降災異的教訓，把政治導正，那麼天就有權力來奪取君王的權位。如果君王行為得當，五行運轉便正常。他因此主張：「天道」運行變化，主要是為了建立「人道」。這位學者最可能是：
  options:
  - label: A
    content: 主張民貴君輕的孟子
  - label: B
    content: 主張天人感應的董仲舒
  - label: C
    content: 主張格物致知的朱熹
  - label: D
    content: 主張知行合一的王陽明
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 學者指出：北魏實行均田法的背景，第一，因戰亂的傷亡及遷徙，留下大片無主荒田；第二，許多農民為躲避戰禍，逃離農村，流落城市，成為不事生產的游民；第三，農民投靠大戶士族，「五十三十家方為一戶」，只向其宗主貢獻，不必向政府納稅。均田法的實施是結合戶籍的清查及管理，透過計口授田，使農業勞動力與耕地達到合理配合，以恢復生產，建立小農社會。根據上述，學者認為北魏均田法實施的主要目的最可能是：
  options:
  - label: A
    content: 限制土地兼併
  - label: B
    content: 保全士族特權
  - label: C
    content: 重建編戶稅基
  - label: D
    content: 推行漢化運動
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 王姓家族原居河北地區，因戰亂遷徙到長江下游。後來政府下令，住民不分新、舊，一律編入所居郡縣戶籍。同時，政府也將逃亡的農民和被豪強隱匿的奴婢列入課稅對象。王家經歷了這些新措施後，終於在僑居地正式落戶。王家應是遇到哪項措施？
  options:
  - label: A
    content: 西晉實施的占田制度
  - label: B
    content: 東晉實施的土斷政策
  - label: C
    content: 安史亂後的清查戶口
  - label: D
    content: 清代實施的改土歸流
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 春秋時代晚期以後，列國開始登錄人民，建立戶籍制度。戶籍制度出現以後，凡著錄的人，又謂之「齊民」。漢代人民都要登錄於戶籍，也稱作「錄民」。請問：「齊民」主要表示何種身分上的平等？「齊民」與「錄民」的出現，在歷史上應作怎樣的解釋？
  options:
  - label: A
    content: 政治身分；封建制延續的舊面貌
  - label: B
    content: 經濟身分；郡縣制形成的新現象
  - label: C
    content: 社會身分；封建制延續的舊面貌
  - label: D
    content: 法律身分；郡縣制形成的新現象
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 漢初法律規定，國家按人民的爵等賜予田土和居宅；北魏至唐初也都有政府頒授土地給成年人的相關法令。這些作法的共通目的最可能是：
  options:
  - label: A
    content: 擴大國家賦稅來源
  - label: B
    content: 實現均富社會理想
  - label: C
    content: 強化社會救濟效果
  - label: D
    content: 促進農耕技術改良
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 在位32年，治績可觀，被稱為「海東堯舜」的是下列哪一位？
  options:
  - label: A
    content: 太祖李成桂
  - label: B
    content: 高麗太祖王建
  - label: C
    content: 大院君
  - label: D
    content: 朝鮮世宗
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 奇隆在看過電視劇《步步驚心》後．便成為雍正皇帝狂粉，瘋狂蒐集雍正皇帝的相關資料。在蒐集資料的過程中，他發現雍正皇帝每天會在乾清門聽取官員匯報政事，在養心殿批閱奏章，抑或是召集軍機大臣共同討論政事，時常出現「燈下批閱奏摺，每至二鼓三鼓（約晚上11點），不覺稍倦」的情形。對此，奇隆崇拜得五體投地。請問造成上述雍正皇帝行為的主要原因應為何？
  options:
  - label: A
    content: 雍正不信任當朝宰相，故親自打理政事
  - label: B
    content: 雍正親民愛民，自我要求每天須勤於政務
  - label: C
    content: 雍正延續前朝廢除宰相的政策，凡事親力親為
  - label: D
    content: 雍正朝民變不斷，因此才需疲於奔命
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 秦始皇採行了「五德終始說」中的「五德相勝」，自認為秦為水德，取代周的火德而有天下，並建立了一套繁雜的宮室、宗廟、陵寢、輿服以及相關的禮儀典章，藉此以強調皇帝至尊的權威地位。請問秦始皇採行「五德終始說」的主要目的為？
  options:
  - label: A
    content: 為實施中央集權統治
  - label: B
    content: 為進行神權統治
  - label: C
    content: 為推展封建制度
  - label: D
    content: 確立其政權的合理性
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 如果周是火德，秦是水德，依陰陽家「五德終始說」的說法，漢代應該是哪一德？
  options:
  - label: A
    content: 金德
  - label: B
    content: 土德
  - label: C
    content: 木德
  - label: D
    content: 火德
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 學者傅斯年認為：周人自認為「夏」的繼承者，視商人為東方的「夷」人，夷夏東西對立的觀念由此形成。上述內容說明中國歷史早期為「夷夏東西對立」，但到了東漢以後卻逐漸轉變為「南北對抗」。請問出現此一變化的關鍵性因素為何？
  options:
  - label: A
    content: 中國經濟重心南移
  - label: B
    content: 南方民族的強盛
  - label: C
    content: 氣候與溫度變遷
  - label: D
    content: 北亞民族的內徙
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 從各朝代賦稅與土地制度的演變，我們可以發現什麼趨勢？
  options:
  - label: A
    content: 時代愈後，因貨幣不穩，逐漸改由實物繳稅
  - label: B
    content: 時代愈後，為彰顯皇室權力，徵調勞役來建設成為常態
  - label: C
    content: 時代愈後，因國家事務繁雜，賦役制度也逐漸變得複雜
  - label: D
    content: 時代愈後，為提高治理效率，賦稅制度逐漸簡化
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「各國頒布的成文法典，成為全國人民共同遵守的公開規範，此後人民在法律之前地位齊平。政府透過戶籍帳冊有效地執行國家成文法律，『編戶齊民』成為平民百姓的代名詞。」請問政府編戶齊民的原因為何？
  options:
  - label: A
    content: 加強中央集權
  - label: B
    content: 彰顯高壓皇權
  - label: C
    content: 體現人皆生而平等的精神
  - label: D
    content: 落實孟子的民本思想
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有學者認為中國透過實施某一貿易制度，一方面確認其統治者身分，另一方面也確立彼此的尊卑主從關係。請問此一貿易制度應是下列何者？
  options:
  - label: A
    content: 走私貿易
  - label: B
    content: 轉運貿易
  - label: C
    content: 朝貢貿易
  - label: D
    content: 平等貿易
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 12世紀起，日本進入「幕府時代」，有關幕府的演變，下列何者正確？
  options:
  - label: A
    content: 足利尊氏廢除天皇制度，建立鎌倉幕府，開啟幕府政治
  - label: B
    content: 室町幕府末期群雄並起，進入戰國時代
  - label: C
    content: 德川家康為末代幕府將軍，1867年還政於天皇
  - label: D
    content: 織田信長建立幕藩體制穩定政治秩序
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 中國歷史上君權與相權之間的關係，下列何者符合史實？
  options:
  - label: A
    content: 漢代儒學以「君尊臣卑」為原則，君權與相權關係便難以對等
  - label: B
    content: 中國宰相此官職出現於漢代
  - label: C
    content: 即使是皇帝親信、外戚、宦官，也難以侵奪相權
  - label: D
    content: 時代愈後，君權愈小，相權愈高
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 學者在評論歷史上某一中央官制時，指稱該制度堪稱是國史上的一良好制度。其主要優點有：(一)相互制衡：既可防止宰相一人獨斷專權，又可制約君主的獨裁。(二)謹慎決策：宰相可對皇帝詔敕提出異議、甚至原件封還，請皇帝重新思考，有利於制定較正確的政策。請問上文評論係針對下列何者？
  options:
  - label: A
    content: 周朝封建制度
  - label: B
    content: 秦漢三公九卿制
  - label: C
    content: 隋唐三省六部制
  - label: D
    content: 明清內閣制
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 旅行社推出城市觀光行程，訴求：「大唐遺風」，說明此行可以參訪當地的唐式建築，體驗茶道，參拜佛寺，也可以參觀法律文書的收藏，領略中國唐朝的風情。這個行程最可能是：
  options:
  - label: A
    content: 京都物語
  - label: B
    content: 首爾采風
  - label: C
    content: 河內漫遊
  - label: D
    content: 上海驚艷
- id: doc_109_高雄_明誠_社會_歷史_g10s2e2_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 韓愈的〈師說〉一文指出：「師者，所以傳道、授業、解惑也」，強調學習過程中老師扮演重要角色。但文中也反映了唐代以來，學子學習過程中不重師道的現象。這種現象與下列何者關係最為密切？
  options:
  - label: A
    content: 唐行科舉，以文取士，強調創作，不再依賴經師傳授
  - label: B
    content: 隋唐帝國雜染胡人風俗，不重視學術，師道因之不彰
  - label: C
    content: 佛學傳入中國，主張眾生平等，學生因而不重視師道
  - label: D
    content: 唐代經濟繁榮，人們多追逐利益，師道尊嚴因而不顯
