- id: doc_110_台南_善化_數學_數甲_g12s2e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 1
  stem: 隨機變數X與Y的期望值分別以E (X) 與E (Y) 表示，變異數以Var (X) 與Var (Y) 表示，標準差以σ (X) 與σ (Y) 表示。試問下列哪些選項是正確的？
  options:
  - label: A
    content: 設a，b為常數，若Y＝aX＋b，則E (Y)＝aE (X)＋b
  - label: B
    content: 設a，b為常數，若Y＝aX＋b，則Var (Y)＝| a | Var (X)
  - label: C
    content: 若E (X)＞E (Y)，則E ( X $^{2}$ )＞E ( Y $^{2}$ )
  - label: D
    content: 若E (X)＞E (Y)＞0，且E ( X $^{2}$ )＞E ( Y $^{2}$ )，則σ (X)＞σ (Y)
  - label: E
    content: 若E (X)＞E (Y)＞0，且Var (X)＞Var (Y)，則E ( X $^{2}$ )＞E ( Y $^{2}$ )
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：若$Y=aX+b\Rightarrow E(Y)=aE(X)+b$，正確。 (B) ×：$Var(Y)=a^{2}Var(X)$，錯誤。 (C) ×：$\because E(X)>E(Y)$，但$E(X^{2}),E(Y^{2})$無法比較大小 $\therefore$錯誤 (D) ×：若$E(X)>E(Y)>0$且$E(X^{2})>E(Y^{2})$，但 $\sigma (X),\sigma (Y)$無法比較大小 $\therefore$錯誤 (E) ○：$\because Var(X)=E(X^{2})-\left[ E(X) \right] ^{2}$ 又$\because E(X)>E(Y)\thereforeE(X^{2})-\left[ E(X) \right] ^{2}>E(Y^{2})-\left[ E(Y) \right] ^{2}$

    $\therefore E(X^{2})+\left[ E(Y) \right] ^{2}>E(Y^{2})+\left[ E(X) \right] ^{2}\therefore E(X^{2})>E(Y^{2})\therefore$正確

    故選(A)(E)。'
  tags:
