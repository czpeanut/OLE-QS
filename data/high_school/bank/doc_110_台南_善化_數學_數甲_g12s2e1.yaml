- id: doc_110_台南_善化_數學_數甲_g12s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知十個紅包袋中，有1個裝1000元，有2個裝500元，有3個裝100元，其餘4個是空的，若取到的紅包袋中有錢，則可得到該錢數，若取到空的，則賠400元，同學<u>妙有</u>從這十個紅包袋中任取3個，若期望值為E元，得200元的機率為p，則下列何者正確？
  options:
  - label: A
    content: E＝70
  - label: B
    content: E＝210
  - label: C
    content: p＞0.2
  - label: D
    content: p＞0.3
  - label: E
    content: p＞0.4
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 取一個的期望值$E(X)=\frac{1}{10}\times 1000+\frac{2}{10}\times 500+\frac{3}{10}\times 100+\frac{4}{10}\times (-400)=70$(元)， 所以任取3個期望值為$E=70\times 3=210$(元)，選(B) 得$200$元的情形有$500+100+(-400)$和$1000+(-400)+(-400)$ 所以$P=\frac{C_{1}^{2}\times C_{1}^{3}\times C_{1}^{4}+C_{1}^{1}\times C_{2}^{4}}{C_{3}^{10}}=\frac{30}{120}=\frac{1}{4}=0.25>0.2$，選(C) 故選(B)(C)。
  tags:
