- id: doc_111_台中_后綜_社會_歷史_選修歷史I_g12s2e1_s2_3
  section: 2
  number: 3
  type: calc
  page: 4
  stem: '請閱讀以下資料：

    資料一：英國哲學家史賓塞（Herbert Spencer，1820～1903）認為，達爾文適者生存的原則不只發生在自然界，也發生在人類社會。該理論被帝國主義與種族主義者挪用，以合法化壓迫不同種族的不公行為。

    資料二：1930年代隨著中日衝突白熱化，日本為動員殖民地物資與人力，增加人民的忠誠度，於是在臺灣推行皇民化運動。總督府廢止報紙的漢文欄、禁止使用方言、推行使用日語、強制神社參拜，及禁止臺灣風俗習慣、儀式等，然而，同化政策下的臺灣人，儘管努力學習日語、更改姓名、參加志願兵，仍無法被當成日本人，陷入多重認同與文化扭曲的困境。

    根據資料一、資料二請回答下列相關問題：

    (1) 資料一中「達爾文適者生存的原則不只發生在自然界，也發生在人類社會。該理論被帝國主義與種族主義者挪用……。」請問此段文字中的「理論」所指為何？

    (2) 資料二為資料一理論的例證，請從資料二中列舉出殖民政府以合法化壓迫臺灣人的不公行為的例子？（舉出兩例即可）'
