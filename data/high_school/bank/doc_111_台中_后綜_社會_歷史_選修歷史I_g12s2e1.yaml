  group_stem: '◎請閱讀以下資料：

    資料一：（西漢）《史記‧呂后本紀》司馬遷評價「孝惠皇帝、高后之時，黎民（百姓）得離戰國之苦，君臣俱欲休息乎無為，故惠帝垂拱（垂衣拱手，表毫不費力），高后女主稱制，政不出房戶，天下晏然。刑罰罕用，罪人是希（稀少）。民務稼稽，衣食滋殖。」

    資料二：（西漢）《史記‧外戚世家》司馬遷寫道：「自古受命帝王及繼體守文之君（繼承王位者），非獨內德茂也，蓋亦有外戚之助焉。」

    資料三：（東漢）《後漢書‧光武帝》：「高皇帝與群臣約，非劉氏不王。呂太后賊害三趙（高皇帝庶子），專王呂氏……天命幾墜，危朝更安。呂太后不宜配食高廟……遷呂太后廟主於園，四時上祭。」

