  stem: 1803年，美國政府以1,500萬美元的價格，從某國手中購買了約214萬平方公里的土地，約合7美元1平方公里。所購得的土地將國土拓展了1倍，土地面積則是今日美國國王的22.3%，為其後的西部開發鋪了路，也奠定了當代美國版圖主要疆界的基礎。根據以上資料，下列敘述何者正確？
