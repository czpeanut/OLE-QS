  stem: 參與這次運動的國民超過200萬人，示威場次達1,500多次，全國218個郡有211個參加了，而且連國外的滿洲、俄國境內僑民都參與，運動雖然未能達到預期的目的，但在韓國民族主義運動史上卻具有重大意義，他們追求的民族自主與獨立以及和平抗爭的精神，對後來的影響既深且遠。請問此運動是指
