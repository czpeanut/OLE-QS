    content: 東學運動
  - label: B
    content: 三一運動
  - label: C
    content: 開化改革運動
  - label: D
    content: 自由民權運動
- id: doc_111_台中_后綜_社會_歷史_選修歷史I_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 隨著女性主義的抬頭與世界軍事型態的轉變，愈來愈多女性選擇加入軍隊的行列，蔚然形成一股新趨勢，女性軍人已經成為捍衛國家不可缺少的防衛力量。下列關於歷史上女性從軍捍衛政權的事蹟，何者「有誤」？
  options:
  - label: A
    content: 西非的達荷美王國於18世紀建立女戰士部隊，歐洲人使用希臘神話中的亞馬遜女兵，稱呼這支軍隊為「達荷美亞馬遜」
  - label: B
    content: 中國傑出的女性將領有明代的秦良玉
  - label: C
    content: 第一次世界大戰中，美國徵召百萬女兵充任步兵、砲兵並開裝甲
  - label: D
    content: 曾在美國獨立戰爭為士兵送水、當砲兵助手的是瑪麗‧海斯
- id: doc_111_台中_后綜_社會_歷史_選修歷史I_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 北美原住民族有一種特殊的節慶，稱為「誇富宴」，時間在每年冬季。期間主辦者會特意將財物慷慨贈送給參與的賓客，甚至會在眾人前浪費食品及損壞珍貴之物。請問此種「誇富宴」最可能蘊含下列何種目的或意義？
  options:
  - label: A
    content: 象徵資源平均分配，個別部落不會累積過多財富而有兼併他者的企圖
  - label: B
    content: 藉以誇示個別部落的富強，試圖拉攏其他部落轉而歸附於本身的統治
  - label: C
    content: 象徵本族的富裕及上天的眷顧，試圖彰顯個別部落在區域的優勢地位
  - label: D
    content: 彰顯個別部落經濟條件的優渥，吸引其他部落前來從事各類交易活動
- id: doc_111_台中_后綜_社會_歷史_選修歷史I_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 從某一時期開始，美國印第安人全國代表大會展開了一場消除媒體對印第安族群負面定型的運動。他們認為亞特蘭大勇士隊、辛辛那提紅人隊等使用印第安吉祥物的職業棒球隊，是在長久延續對於印第安人的刻板印象，同時貶低他們特有的傳統和禮儀。然而，另一群人則相信這些吉祥物是在向印第安族群致敬，並且喚起大眾更正確理解他們的文化。這一議題是在□□時期產生的，至今仍然持續延燒著。請問□□應填入哪一時期？
  options:
  - label: A
    content: 獨立戰爭
  - label: B
    content: 南北戰爭
  - label: C
    content: 經濟蕭條
  - label: D
    content: 民權運動
- id: doc_111_台中_后綜_社會_歷史_選修歷史I_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '帝國主義依其發展，大致可分為舊帝國主義與新帝國主義，下列有關這兩概念的整理，何者正確？

    | 概念 特色 | 舊帝國主義 | 新帝國主義 |

    | --- | --- | --- |

    | 甲、時間 | 約14～18世紀 | 約19~20世紀初 |

    | 乙、興起背景 | 工業革命的影響 | 歐洲人海外探險所致 |

    | 丙、特色 | 主要偏重貿易與傳教 | 主要找尋原料、勞動力與市場 |

    | 丁、代表國家 | 西、葡、俄、英、德 | 英、法、西、美、日 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
