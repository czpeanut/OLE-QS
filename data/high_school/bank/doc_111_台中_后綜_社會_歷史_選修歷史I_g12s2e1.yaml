  stem: '請閱讀以下資料：

    資料一：她與仁愛修女會的貢獻，為女性在軍事層面的影響賦予一種新的意義，促成女性成為戰爭時重要的專業護理人員。

    資料二：晚清時期，有許多英國、美國的女性傳教士，受到她的事蹟影響，陸續前來中國開辦護理學校，培育女性護理人員。

