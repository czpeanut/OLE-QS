  page: 1
  stem: 從北美原住民族「易洛魁同盟」的規約內容可知，這個同盟對於各部族的傳統抱持尊重，也確立公平的行政組織。關於這個同盟的發展及其特點，請問下列的說明哪一項正確？
  options:
  - label: A
    content: 由各部族共同成立類似帝國架構的中央集權組織
