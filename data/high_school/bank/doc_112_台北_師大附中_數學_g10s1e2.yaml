  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：配方可得 ( x＋1 )$^{2}$＋$y^{2}$＝1，所以為一圓。 (B) ○：圖形為一圓。 (C) ○：可得$x^{2}$＋$y^{2}$＝9，所以為一圓。 (D) ×：圖形為上半圓。 (E) ×：當k＝1時，圖形為一直線。 故選(A)(B)(C)。
- id: doc_112_台北_師大附中_數學_g10s1e2_s2_4
  section: 2
  number: 4
  type: multiple
  page: 1
  stem: 平面上有一圓C：( x＋3 )$^{2}$＋( y－1 )$^{2}$＝25，圓內有一點A (－1 , $\frac{5}{2}$ )，圓心Q (－3 , 1 ) 已知直線L：2x－y＋2＝0，則下列選項何者正確？
  options:
  - label: A
    content: 設P ( x , y ) 為圓C上動點，則$\overline{AP}$的最小值為$\frac{5}{2}$
  - label: B
    content: 設P ( x , y ) 為圓C上動點，當$\overline{AP}$有最大值時，P點坐標為 (－7 , －2 )
  - label: C
    content: 直線L與圓C恰交於兩個點
  - label: D
    content: 若直線L與直線$\overleftrightarrow{AQ}$的交點為M，則M在圓C上
  - label: E
    content: 若直線L與直線$\overleftrightarrow{AQ}$的交點為M，且A對L的投影點為B，則△BAM的面積為$\frac{5}{4}$
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 可知$\overline{AQ}$＝$\sqrt{(-1-(-3 ) )^{2}+(\frac{5}{2}-1)^{2}}$＝$\frac{5}{2}$，半徑r＝5。 (A) ○：$\overline{AP}$ ≥ r－$\overline{AQ}$＝5－$\frac{5}{2}$＝$\frac{5}{2}$，即最小值為$\frac{5}{2}$。 (B) ○：$\overline{AP}$ ≤ r＋$\overline{AQ}$＝5＋$\frac{5}{2}$＝$\frac{15}{2}$，可知$\overline{AP}$有最大值時， $\overline{AP}$：$\overline{QP}$＝$\frac{15}{2}$：5＝3：2，由外分點公式可得P ($\frac{-2\times (-1)+3\times (-3)}{3-2}$ , $\frac{-2\times \frac{5}{2}+3\times 1}{3-2}$) ⇒ P (－7, －2 )。 (C) ○：因為d ( Q , L )＝$\frac{│ 2\times (-3)-1+2 │}{\sqrt{2^{2}+(-1)^{2}}}$＝$\frac{5}{\sqrt{5}}$＝$\sqrt{5}$＜5＝r， 所以L與圓C恰交於兩個點。 (D) ○：可知$m_{\overleftrightarrow{AQ}}$＝$\frac{\frac{5}{2}-1}{-1-(-3 )}$＝$\frac{3}{4}$ ⇒ $\overleftrightarrow{AQ}$：y－1＝$\frac{3}{4}$ ( x＋3 ) ⇒ 3x－4y＝－13 解$\begin{cases}3x-4y=-13 \\ 2x-y=-2\end{cases}$ ⇒ $\begin{cases}x=1 \\ y=4\end{cases}$ ⇒ M ( 1 , 4 ) ⇒ (1＋3)$^{2}$＋(4－1)$^{2}$＝25， 所以M在圓C上。 (E) ○：承(D)可知$\overline{AM}$＝$\sqrt{( 1-(-1 ))^{2}+( 4-\frac{5}{2} )^{2}}$＝$\frac{5}{2}$，$\overline{AB}$＝d ( A , L )＝$\frac{│ 2\times
    (-1)-\frac{5}{2}+2 │}{\sqrt{2^{2}+(-1 )^{2}}}$＝$\frac{\sqrt{5}}{2}$， 所以$\overline{BM}$＝$\sqrt{\overline{AM}^{2}-\overline{AB}^{2}}$＝$\sqrt{(\frac{5}{2})^{2}-(\frac{\sqrt{5}}{2})^{2}}$＝$\sqrt{5}$， 因此△BAM的面積為$\frac{1}{2}$×$\overline{AB}$×$\overline{BM}$＝$\frac{1}{2}$×$\frac{\sqrt{5}}{2}$×$\sqrt{5}$＝$\frac{5}{4}$。 故選(A)(B)(C)(D)(E)。
