  - label: B
    content: $x^{2}$＋( y－1 )$^{2}$＝5
  - label: C
    content: $\sqrt{x^{2}+y^{2}}$＝3
  - label: D
    content: y＝$\sqrt{1-x^{2}}$
  - label: E
    content: $\sqrt{x^{2}+y^{2}}$＝k$\sqrt{(x-3)^{2}+y^{2}}$，k＞0
  answer:
