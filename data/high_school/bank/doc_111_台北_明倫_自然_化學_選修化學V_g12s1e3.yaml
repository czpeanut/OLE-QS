  stem: 下列關於半導體的敘述何者正確？
  options:
  - label: A
    content: 半導體的價帶與傳導帶能隙大於絕緣體
  - label: B
    content: 半導體的導電度隨溫度的升高而降低與金屬的特性一樣
  - label: C
    content: 籍由大量加入3A或5A族的元素可增加半導體的導電度
  - label: D
    content: 摻雜鎵於矽晶體中可形成p型半導體提高矽的導電度
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)半導體能隙較小，故導電性較絕緣體好；(B)半導體升溫時導電性增加、金屬升溫時導電性下降；(C)加入少量3A或5A族元素可增加半導體的導電性；(D)正確。故選(D)。
