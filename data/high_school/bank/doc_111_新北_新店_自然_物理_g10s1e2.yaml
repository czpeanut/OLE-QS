  stem: 家電用的電磁爐通常是根據法拉第感應原理，利用磁場使置於爐面上的鍋子出現感應電流，再透過電流的熱效應，使鍋子產生高溫以烹煮食物。下列有關此種電磁爐與所有鍋子的敘述，何者正確？
