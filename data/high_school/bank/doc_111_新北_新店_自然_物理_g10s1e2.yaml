  stem: 「暮從碧山下，山月隨人歸。卻顧所來徑，蒼蒼橫翠微。」唐朝詩人李白，從山上下來時，天色已暗，但還好有月光跟隨在後方，幫他照路，伴隨他前行，回頭看一下走過的山路，都已經在暮色中，變得糢糊成一整片翠綠色了，心想還好已經離開了林木幽鬱的山區，走到開闊的平地了，只是平地的路面也是坑坑洞洞不好走，而且山區氣候變化大，常常都會下雨造成積水。路上又沒有路燈照明，這時他眼前地面因為月光的照明，白茫茫一片，讓他一度懷疑地面上結了霜，只是路面上，不知道為什麼還出現多處暗黑的區塊散布在前方地上，有點近視實在看不清楚，說時遲那時快，一腳踩上去……（只好靠幾何光學的知識來幫他做判斷了！）
  options:
  - label: A
    content: 光亮或陰暗處，就是因為月光有無被遮蔽造成的，因此都可能是積水灘
  - label: B
    content: 光亮或陰暗處，就是因為月光有無被反射造成的，因此都不可能是積水灘
  - label: C
    content: 光亮處就是因為月光漫射造成的，較可能為積水灘
  - label: D
    content: 陰暗處就是因為月光反射造成的，較可能為積水灘
  - label: E
    content: 陰暗處就是因為月光反射造成的，較不可能為積水灘
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
