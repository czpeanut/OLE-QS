  section: 1
  number: 8
  type: single
  page: 2
  stem: 微波爐可以在短時間內加熱食物，使用相當便利，其價格也愈趨便宜，在現今的家庭相當普及。可是人們對於它的疑慮卻也多過其他的家電產品，請問下列敘述何者正確？
  options:
  - label: A
    content: 微波爐加熱原理和電磁爐加熱原理相同
  - label: B
    content: 微波是一種頻率比X射線還高的電磁波，因此可以快速加熱食物
  - label: C
    content: 微波和超音波相同，均不需要靠介質傳播
  - label: D
    content: 微波和可見光在真空中的傳播速度相同
  - label: E
    content: 人們對於微波爐的疑慮是因為微波會像γ射線一樣具有強輻射，使得食物中殘留放射性物質
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
