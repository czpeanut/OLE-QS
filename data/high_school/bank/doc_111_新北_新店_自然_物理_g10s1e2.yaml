  - label: A
    content: 電磁爐所用的鍋子必須是可以導電的
  - label: B
    content: 電磁爐使用的是不隨時間變化的磁場
  - label: C
    content: 電磁爐所用的鍋子必須是熱的絕緣體
  - label: D
    content: 鍋子中出現的感應電流必為直流電
  - label: E
    content: 電磁爐的爐面必須是可以導電的金屬
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
