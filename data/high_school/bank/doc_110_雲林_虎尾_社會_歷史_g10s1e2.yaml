  stem: 荷蘭先後兩度占領澎湖，卻遭受明軍驅逐：但在1624年8月，荷蘭艦隊司令宋克與明廷將軍俞咨皋達成協議，荷蘭從澎湖撤退，並允許其占領臺灣。請問：明廷對澎湖、臺灣處理問題不同，其關鍵為何？
  options:
  - label: A
    content: 戰略地位
  - label: B
    content: 經濟利益
  - label: C
    content: 主權主張
  - label: D
    content: 民族問題
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 臺灣史學者對於十九世紀中葉後，臺灣社會文化内涵的看法可分成兩派，兩者見解的比較可參考附表。請問：雖然這兩派解釋不同，但他們對於哪件事的看法是一致的？
  options:
  - label: A
    content: 維持原鄉信仰
  - label: B
    content: 已成定居型社會
  - label: C
    content: 祭祀的對象
  - label: D
    content: 械鬥的組合
