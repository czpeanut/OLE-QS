- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 清領時期臺灣某一處開發過程的記錄：「淡水同知李嗣鄴，對粤籍墾戶姜秀鑾委以開墾的重任，因而由粵籍墾戶姜秀鑾與閩籍墾戶周邦正合組墾號，展開『防番』和『開墾』，的工作，其間與原住民族衝突數十次，後來移民陸續遷入定居，遂在集村聚落外圍設置隘寮，做為哨站。」請問姜秀鑾等人開發此處時，可能會與哪一原住民族發生衝突？
  options:
  - label: A
    content: 魯凱族
  - label: B
    content: 阿美族
  - label: C
    content: 噶瑪蘭族
  - label: D
    content: 泰雅族
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有一石碑的內容為：「臺灣知府楊廷理稱林爽文為逆賊……。當時朝廷號召義民共同來對抗亂軍，死傷者多人。為了讓死傷的義民靈魂能有棲息之地，集資官俸建立了義民祠，以安慰義民的忠魂，此碑於乾隆五十五年立於赤崁樓。」依據内容所提供的線索，撰者書寫的立場為？
  options:
  - label: A
    content: 統治者立場
  - label: B
    content: 主謀者立場
  - label: C
    content: 中立者立場
  - label: D
    content: 受害者立場
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 清領時期，彰化莿桐腳三塊厝有漳州人籌辦演戲謝神事宜，期間漳州人與泉州人相約賭博，結果竟引起互鬥事件。事情先是漳人黃姓與泉人廖姓口角，黃姓族人殺死廖姓的廖老，廖姓向彰化知縣焦長發告發，但彰化知縣企圖大事化小，並未捉拿兇手，引起廖姓不滿，邀糾族人數十人前往附近漳州人家鬥毆搶劫，路過的泉州籍人士亦隨同幫忙搶掠，漳州人也感不滿，隨即掠奪泉州人的財物，雙方各自糾眾，以神佛大旗為號召，泉人之大旗上書著「泉興」，漳人之大旗上寫「興漳滅泉」，互相廝殺。此次事件延續三個多月，最後由福建水師提督黃仕簡來臺灣鎮壓，事件才結束。依據官方報告，此事件中被正法的有二百九十餘人，流放的有三百二十餘人。針對上述資料，下列敘述何者正確？
  options:
  - label: A
    content: 此事可歸類為閩、粵械鬥
  - label: B
    content: 械鬥原因是建屋蓋廟產生的爭執
  - label: C
    content: 此事由清廷派官來臺灣鎮壓可見是抗官民變
  - label: D
    content: 此事反映了地方官失職的現象
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 根據研究，1915-1934年間，臺灣的殖民政府為補助臺灣人、日本人在東南亞的多種生意、農業計畫、企業，撥發不少款項。例如：1915年臺灣總督府撥款3500日圓給「南亞興農組合」，以鼓勵臺灣人移民東南亞。1930年代初期，愈來愈多臺灣人被招募到南洋，協助管理日本人投資的事業。當時至海外求職的臺灣人，以〇在荷屬印尼發展最佳。〇是下列何人？
  options:
  - label: A
    content: 周里觀
  - label: B
    content: 謝雪紅
  - label: C
    content: 李友邦
  - label: D
    content: 黃朝琴
