- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 對臺灣紳民來說，無異是晴天霹靈。頓時，臺灣紳民陷入了去留兩難的困境，「欲盡棄田里，則内渡後，無家可歸；欲隱忍偷生，實無顏以對天下。」造成上述臺灣政治社會難題的背景是來自下列何者？
  options:
  - label: A
    content: 鴉片戰爭
  - label: B
    content: 牡丹社事件
  - label: C
    content: 中法戰爭
  - label: D
    content: 甲午戰爭
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 他曾經擔任伊藤博文來臺灣時的翻譯。日本在中國東北成立滿洲國時，他是第一任外交總長，也曾任駐日大使。他一生先後擁有五個國籍：清國、日本、滿洲國、中華民國、中華人民共和國，且能在最後一個政權平安終老，有人稱他是個「幸運兒」。請問：此位政治人物是何人？
  options:
  - label: A
    content: 汪精衛
  - label: B
    content: 謝介石
  - label: C
    content: 連震東
  - label: D
    content: 蔣介石
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 資料一：1917年一則報導：内地富豪久原氏，將於南洋之婆羅洲，經營護謨（橡膠）產業……因人夫缺乏，著手殊難，欲就内地募集，恐氣候不佳，於往者無益：以臺灣之氣候，與該處不甚懸殊，爰欲於本島募集前往，……其所欲募之人夫數，先按三十名；又欲招約三十名有相當學識、精通國語者，往為事務員，給予厚資。 資料二：英領北婆洲久原農園，曩募第一回渡航臺灣勞動者，嗣知其一般強健，性行純樸，勸勉耐勞，因思更募第二次渡航者。……或人錯會北婆羅洲之位置，屬南洋熱帶圈内，暑氣酷暑，前次渡航之人有多數病死者，實則不然，現皆健全活動。 關於上述二段資料，下列何者正確？
  options:
  - label: A
    content: 從資料一可知由臺灣前往南洋的移民只能從事勞力工作
  - label: B
    content: 由資料二可知當時已有臺灣人因經濟活動而往南洋遷移
  - label: C
    content: 發布二次招募公告是因臺人死亡率過多造成人手空缺
  - label: D
    content: 由兩則資料可知臺灣人主要是因為氣候相近而移民東南亞
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 知名電視節目「時尚玩家」以介紹全臺各地美食著稱，某一次特輯介紹的美食為中壢龍岡、忠貞、士校一帶販售的滇緬過橋米線、大薄片、雲南米干、月亮蝦餅、椒麻雞等，酸甜辣口味特殊且美味，尤重各式香料的添加，口味多元令節目中的來賓嘗試之後皆讚嘆不已。請間：何以該地會出現這些異國美食？
  options:
  - label: A
    content: 此為新住民的飲食文化，政府開放外配政策後所致
  - label: B
    content: 此為穆斯林的傳統美食，為國際移工文化帶入所致
  - label: C
    content: 此為1950-1960年代，滇緬泰邊境孤軍撤退來臺後受政府安置所致
  - label: D
    content: 此為臺灣原住民各族傳統美食，不同於傳統漢人的飲食文化
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 臺灣在某一時期，因資金外移與引進國際移工課題，衝擊本土勞動力就業市場，影響了臺灣籍勞工既有的工作權益。此外，臺灣女性對於婚姻自主權日益高漲，政策開放下，經濟力較薄弱的男性則開始對外尋求婚配對象。請問：此應為臺灣哪一時期的社會現象？
  options:
  - label: A
    content: 1970年代，退出聯合國之際
  - label: B
    content: 1990年代，經濟面臨轉型
  - label: C
    content: 1950年代，韓戰爆發時期
  - label: D
    content: 1980年代，解除戒嚴時期
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 福建泉州人張大川於1870年渡海來臺，在臺灣娶妻生子，至第四代為張光明：1950年，福建泉州張讓隨軍來臺。在一次聚會中，張讓與張光明發現他們的曾祖父是兄弟；張光明是一般人所認為的閩南族群，而張讓則被認為是外省族群。請問：他們被歸類為不同族群的原因為何？
  options:
  - label: A
    content: 語言不同
  - label: B
    content: 血緣不同
  - label: C
    content: 來臺時間不同
  - label: D
    content: 風俗習慣不同
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 小日某天在國書館檔案室翻到一份舊報紙，内文提到「大陸地區宣布從11月3日起，由香港的中國旅行社代理簽發《臺灣同胞旅行證明》，打開了對臺灣關閉幾十年的大門，第一批從未坐過飛機、沒換過外幣的臺灣老人手持大包小袋地到達了香港的啟德機場，志忑不安卻又近鄉情怯地等待出關，到市區換火車準備回到暌違多年的家鄉探親。」請問：上述情境應是哪一年份的事情？
  options:
  - label: A
    content: 1970年代
  - label: B
    content: 1980年代
  - label: C
    content: 1990年代
  - label: D
    content: 2000年代
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 在臺北讀大學的健程於暑假時去了中部某地旅遊，這個景點的街景與臺北相當迥異，綠地覆蓋率高，健程在觀光之餘查詢了這個景點的相關資訊，以下是他收集到的幾個重點：參照倫敦新市鎮規畫的臺灣戰後第二座新市鎮、住宅與辦公合一之田園式行政社區、曾是臺北以外臺灣最重要的行政中心。請問：健程這趟中部之旅去的景點是何處？
  options:
  - label: A
    content: 審計新村
  - label: B
    content: 中興新村
  - label: C
    content: 霧峰林家
  - label: D
    content: 彩虹眷村
- id: doc_110_雲林_虎尾_社會_歷史_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 臺灣、澎湖、金門、馬祖在地理上是四個分開的島嶼，它們走向一體化與哪一歷史背景有關？
  options:
  - label: A
    content: 自清代以來臺澎金馬就同屬一個行政單位，其密切的聯繫使其成為命運共同體
  - label: B
    content: 1945年後，日本投降並將臺澎金馬的主權轉移到中華民國，使其成一政治實體
  - label: C
    content: 1949年後中華民國政府撤退後，實質統治區域為臺澎金馬地區，使之成為一體
  - label: D
    content: 1998年臺灣省政府虛級化，將省政府職能收歸中央政府，使中央直轄臺澎金馬
