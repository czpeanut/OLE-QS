  type: single
  page: 1
  stem: 小健與父母住在臺東，因為臺東的工作機會不多，家裡主要的經濟來源是爸爸不穩定的臨時工收入和政府的休耕補助，小健放學後會到處收集資源回收物貼補家用。小曼住在臺北，放學後通常是趕著去補習，假日則和同學去逛街或看電影，她從來不需要擔心金錢的問題。請問：小健和小曼的生活方式的差異，主要受到下列哪一項因素的影響？
  options:
  - label: A
    content: 性別
  - label: B
    content: 族群
  - label: C
    content: 個人才能
  - label: D
    content: 區域
- id: doc_110_高雄_仁武_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 在公民課的專題報告中，小潔採用<u>衝突論</u>的觀點說明社會階層化的現象。請問：下列哪一項敘述不會出現在她的報告中？
  options:
  - label: A
    content: 階層普遍存在，而且有助於社會整體的功能表現
  - label: B
    content: 個人的社會階層地位，取決於所屬群體所擁有的資源
  - label: C
    content: 工作與酬勞的分配，往往是優勢階層不合理分配的結果
  - label: D
    content: 階層阻礙社會與個人的功能表現，使弱勢階層難以獲得資源
- id: doc_110_高雄_仁武_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 有關權力對社會階層的影響，下列敘述何者正確？
  options:
  - label: A
    content: 要掌握權力，必然要先有突出的社會地位
  - label: B
    content: 權力運用在人與人互動上，將形成社會階層
  - label: C
    content: 權力較大的人，對社會所造成的影響層面並不明顯
  - label: D
    content: 所有權力的運用，都在於促使人類更趨於立足點的平等
- id: doc_110_高雄_仁武_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 法國社會學家布爾迪厄（Pierre Bourdieu）曾提出何種概念，藉以說明人們社會生活中的不平等現象？
  options:
  - label: A
    content: 經濟資本（economic capital）
  - label: B
    content: 社會資本（social capital）
  - label: C
    content: 文化資本（cultural capital）
  - label: D
    content: 人力資本（human capital）
- id: doc_110_高雄_仁武_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 根據文中馬克思對於宗教的想法，下列敘述何者正確？
  options:
  - label: A
    content: 屬於功能論的想法，認為宗教促進社會各階層分工合作
  - label: B
    content: 屬於功能論的想法，認為宗教給予普羅大眾努力的誘因
  - label: C
    content: 屬於衝突論的想法，認為宗教讓窮人安於不平等的現狀
  - label: D
    content: 屬於衝突論的想法，認為宗教讓窮人擁有階級鬥爭意識
  group_stem: ◎馬克思所處的19世紀是一個統治階級與資本主義結合的時代，歐洲政權與資產階級為了保護私有財產，以宗教做為統合的工具，提供對原有社會體制神聖的認可，合法化資本主義追求的價值，並且合理化階級的利益。馬克思認為宗教給予窮人想像和誤導，成為了「精神上的鴉片」，讓窮人抽離現實世界，將現實的苦難投射到不可知的世界，要人們忍受現實的苦難，轉而期待死後的天堂；當窮人抱怨財富不均、權力掌控於少數人手中時，宗教便告誠人們，真正的財富並不是在這個世上，轉而要人們注重心靈層面的祝福。因此，當宗教信仰使人們忽視現世的不公不義、當宗教信仰讓人們麻痺現實、當宗教信仰讓人專注於靈性的修養且願意忍受苦難時，宗教就成為了普羅大眾失去批判與進步的精神鴉片。
- id: doc_110_高雄_仁武_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 有關「功能論：衝突論」的主張內容之對比。請問下列哪些敘述正確？(甲)階層是必須的：階層並非必須；(乙)階層提高社會與個人之功能表現：階層阻礙社會發展與個人才能之表現；(丙)工作與酬勞的分配是合理的：工作與酬勞的分配是不合理的；(丁)個人的社會階層地位取決於所屬群體所擁有的資源：個人的社會階層地位取決於個人的努力
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (乙)(丙)(丁)
  - label: C
    content: (甲)(丙)(丁)
  - label: D
    content: (甲)乙)(丁)
