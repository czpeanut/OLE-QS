  stem: 在美國或臺灣社會，大學教授和醫生均享有優渥的薪水與高社會地位。請問：功能論者應會提供出下列哪一種說法來解釋此社會現象？
  options:
  - label: A
    content: 具備良好家庭背景的人，往往比一般人更容易能從事這些職業
  - label: B
    content: 從事這些職業的人未必有良好能力，而是其所屬群體擁有較多社會資源
  - label: C
    content: 這些專業工作對社會相當重要，因此需要高薪和高地位元來吸引有能力的人
  - label: D
