  stem: 總統制強調權力分立，法律案及預算案一定要經過國會通過，總統簽署公佈才生效。如果未完成上述程式，可能出現什麼狀況？
  options:
  - label: A
    content: 若是預算案沒有通過，總統必須辭職以示負責
  - label: B
    content: 若是預算案沒有通過，政府可能因此被迫停擺而無法運作
  - label: C
    content: 若是國會通過的法律案被總統否決，國會可以提案罷免總統
  - label: D
    content: 若是國會通過的法律案被總統否決，國會可以對總統提不信任案
  group_stem: ◎馬克思所處的19世紀是一個統治階級與資本主義結合的時代，歐洲政權與資產階級為了保護私有財產，以宗教做為統合的工具，提供對原有社會體制神聖的認可，合法化資本主義追求的價值，並且合理化階級的利益。馬克思認為宗教給予窮人想像和誤導，成為了「精神上的鴉片」，讓窮人抽離現實世界，將現實的苦難投射到不可知的世界，要人們忍受現實的苦難，轉而期待死後的天堂；當窮人抱怨財富不均、權力掌控於少數人手中時，宗教便告誠人們，真正的財富並不是在這個世上，轉而要人們注重心靈層面的祝福。因此，當宗教信仰使人們忽視現世的不公不義、當宗教信仰讓人們麻痺現實、當宗教信仰讓人專注於靈性的修養且願意忍受苦難時，宗教就成為了普羅大眾失去批判與進步的精神鴉片。
