  section: 1
  number: 31
  type: single
  page: 4
  stem: 從上文可知，天皇本人對關於自己的事務沒有決定權，一切皆須依照法律、流程。請問天皇在日本政治中的功能為何？請先勾選一項（1分），再說明理由（4分）。
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  group_stem: ◎日本天皇明仁在2016年8月8日發表電視演說，表達退位意願。由於日本皇室相關法規並沒有天皇在生前退位的條文，加上日本《憲法》規定天皇不可發表政治性言論，因此，在天皇表露心聲後，日本政府向國會提出僅適用日皇明仁的退位特例法案。 2017年6月2日日本國會通過了《天皇退位特別法》(天皇の退位等に関する皇室典範特例法)。第1條並明確規定：「本法作為《皇室典範》第4條規定之特例，為實現天皇陛下退位與皇嗣即位，特此規定天皇陛下退位後的地位及退位相關必要事項。」 從天皇退位一事，我們也可以看出皇室成員雖然表面上榮華富貴，但實際上卻幾乎完全無法享受《憲法)所保障的自由：因為皇族不能干政，因此皇族不能有選舉權、被選舉權，也不能隨意對政治發表言論，等於失去言論自由，結婚也必須獲得皇室會議許可而沒有婚姻自由，天皇本人甚至連退休的自由都沒有。因此，也有人認為，生前退位一事，是沒有人權的天皇為自己爭取人權！
