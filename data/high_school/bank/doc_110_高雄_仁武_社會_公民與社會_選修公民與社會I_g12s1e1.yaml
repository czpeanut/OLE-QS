  stem: 假設在修憲委員會中，有立委提案將我國政府體制改為總統制。若修憲通過後，下列何者最有可能是我國的政治發展情形？
  options:
  - label: A
    content: 總統無法向立法院提出法律覆議案
  - label: B
    content: 總統所屬政黨與立法院多數不一致
  - label: C
    content: 總統需赴立法院接受立委質詢監督
  - label: D
    content: 立法院無法提出對總統的不信任案
  group_stem: ◎立法院此會期成立修憲委員會，截至2020年10月4日，目前已有包括18歲公民權等17個草案。有立委提案修憲恢復立法院行使閣揆同意權（以下簡稱第一案），以及提出「自2024年第16任總統及第11屆立委，任期調整至2028年2月29日」的草案（以下簡稱第二案）。（註：第15任總統任期為2020年5月20日至2024年5月19日；第10屆立委任期為2020年2月1日至2024年1月31日）
