  section: 1
  number: 12
  type: single
  page: 2
  stem: 下列有關「階層與階級之不同」的敘述，何者錯誤？
  options:
  - label: A
    content: 階層純粹是一個社會類別（social category），而階級可以是一個類別，也可以是一個群體
  - label: B
    content: 階級以個人在生產過程中所處的位置為基礎，階層則以個人所擁有的財富、權力及聲望的多寡高低而劃分
  - label: C
    content: 階層與階層之間，一個接著一個，沒有明顯的分界，而階級的界限則比較明顯
  - label: D
    content: 階級之間，不一定彼此排斥，但階層之間則懷有敵意，並且進行對抗性的活動
