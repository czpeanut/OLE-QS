  stem: 2010年當選十大傑出青年的網球好手盧彥勳，父母親從事活雞中盤商工作，早年盧彥勳父親的工作並不穩定。盧彥勳憑自身努力不放棄學習，加上後來父母的支持，成為國際網壇一顆耀眼的閃亮之星，更進入中上級社會階層。關於他的發展歷程，何者正確？
