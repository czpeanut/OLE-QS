  number: 15
  type: single
  page: 2
  stem: 人們的社會地位可由先賦地位與成就地位來決定，下列有關此兩種地位之說明，何者錯誤？
  options:
  - label: A
    content: 族群、性別都是先賦地位
  - label: B
    content: 富二代所指的是一種成就地位
  - label: C
    content: 先賦地位可能影響成就地位
