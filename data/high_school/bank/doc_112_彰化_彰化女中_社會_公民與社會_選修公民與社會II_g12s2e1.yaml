  answer_source: answer_key
  explanation: (A)目的為補償犯罪被害人。(B)此與國家損失無關。(D)特別犧牲之國家補償為國家因公權力的「合法」行使，造成人民權益受特別嚴重的損害時，國家負有補償的責任，人民可以就其損失向國家請求「補償」。
