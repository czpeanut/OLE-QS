  stem: 文中兩名學生提出的訴訟遭法院駁回，請問駁回的法院應為何者？
  options:
  - label: A
    content: 地方法院
  - label: B
    content: 高等法院
  - label: C
    content: 高等行政法院
  - label: D
    content: 最高行政法院
  group_stem: '2016 年聲請人臺中市一高中學生張生，因其於叼含香菸，受記小過 1 次之處分；又因無照騎乘機車，受記大過 1 次之處分。張生不服，循序提起救濟，經臺行政法院號裁定，認原處分未對學生《憲法》上受教育之權利或其他基本權利造成重大影響，依本院釋字第 382 號解釋駁回其訴。

    另一聲請人新竹一國中學生傅生，於 2014 年該校舉辦定期評量時，請病假而未參加其中一日之評量，後參加補考。但當時依《新竹市國民中學學生成績評量辦法》中規定「學生定期評量時，因公、因病或因事經准假缺考者准予補考。……補考成績依下列規定辦理：二、因事、因病假缺考者，其成績……超過 60 分者，其超過部分 7 折計算」，該名國中生向行政法院提起訴訟，法院認為成績評量非行政處分，因此駁回。

    這兩名學生認為行政法院駁回訴訟有違憲法精神，分別在 2018 年、2015 年聲請大法官釋憲。大法官遂做出釋字第 784 號解釋，認為《憲法》保障的人民訴訟權，不能因為「身分」不同而剝奪。因此各級學校學生其權利因為學校公權力的措施而遭到侵害時，可按相關程序提起行政訴訟，無需有特別條件限制。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文「經臺行政法院號裁定」，此為通常行政訴訟之第一審，為(C)高等行政法院。
