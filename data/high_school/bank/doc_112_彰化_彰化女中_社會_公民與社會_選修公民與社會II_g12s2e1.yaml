  group_stem: '「祭祀公業」係指前清或日治時期先民離鄉背井之際，為懷念其原鄉祖先，而由子孫集資購買田產，以其收益作為祖先祭祀時之備辦及聚餐費用，而所繼承祭祀公業的代表人則稱為「派下員」。我國的《祭祀公業條例》規定，在該條例施行前已存在的祭祀公業，其派下員依規約定之，實際情況則大多排除女性。

