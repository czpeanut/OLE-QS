  options:
  - label: A
    content: 釋憲範圍擴大，及於個案的解釋能更貼近事實，其他相類似案件也不能適用，具備獨特性
  - label: B
    content: 釋憲門檻降低，能讓更多人有機會達到釋憲聲請門檻，釋憲成功比例會大幅提升，保障人權
  - label: C
    content: 公布大法官所持立場，並具名標示主筆大法官，能讓民眾監督大法官施政，必要時得罷免之
  - label: D
    content: 邀集當事人以外的專業人士成立法庭之友，其意見可以被憲法法庭納入參考，更具專業性
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《憲法訴訟法》建立「裁判憲法審查」制度，指大法官憲法審查客體從原本法律、命令，藉由新制，擴及於法院確定終局裁判，使人民可個案聲請釋憲。因效力只限個案，因此類似案件當事人則可先審酌目前是否為收受確定終局裁判後 6 個月期間，若是，應以個案方式聲請釋憲，若不是，則可提出成功釋憲個案為證據，向法院提出再審，但此與獨特性無關。(B)對立委聲請人數來說，從立委總額 1∕3 下降至 1∕4，聲請釋憲門檻降低，但與釋憲成功比例無關。(C)人民無法罷免大法官。(D)法庭之友是當事人以外的人民、機關或團體，即使只是情感上關注案件，也可以向憲法法庭聲請，經過同意後，主動提出專業意見或資料，供憲法法庭審判時參考，為正確敘述。
