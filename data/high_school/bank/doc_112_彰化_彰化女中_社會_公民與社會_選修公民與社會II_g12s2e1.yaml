questions:
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 新北市某幼兒園爆發教保員疑似餵食幼童不明藥物案。該案經新北市地檢署偵查終結後，對相關人員予以不起訴處分，證明該幼兒園無不當對待幼生情事。新北市教育局亦主動撤銷先前廢止該幼兒園設立許可的行政行為，使其恢復立案。試問新北市教育局的作為應為下列何種行政行為？
  options:
  - label: A
    content: 行政命令
  - label: B
    content: 行政契約
  - label: C
    content: 行政處分
  - label: D
    content: 行政計畫
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 撤銷廢止幼兒園的設立許可應為(C)行政處分。行政處分係指行政機關就公法上具體事件所為之決定，或其他公權力措施而對外直接發生法律效果之單方行政行為。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 莎莎因不滿樓上鄰居小孩奔跑、拖拉重物等噪音問題被吵，故意在夜晚放高分貝音樂反擊樓上鄰居，被害者鄰居一家三口提出求償。關於此糾紛，以下說明何者正確？
  options:
  - label: A
    content: 鄰居製造噪音不算侵權行為
  - label: B
    content: 鄰居的財產權因受到侵害可要求賠償
  - label: C
    content: 放高分貝音樂行為屬於自力救濟之行為
  - label: D
    content: 鄰居被影響健康及居住安寧，可要求精神慰撫金
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)長期處於噪音之下會影響健康，為侵權行為。(B)應為健康權而非財產權。(C)此為報復行為，非自力救濟。合法的自力救濟，是在一些情況下來不及請求警察機關、檢察機關或法院的協助，而用自己的力量來維護自己的權利。(D)為正解。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小皮決定蓋一棟摩天大樓，主管機關也核發了建造執照給他，但於施工中才發現該建地居然埋有商朝時的遺跡，主管機關為保存古蹟，就廢止了小皮的建造執照，並且要求小皮停工。蓋房子蓋到一半的小皮只好申請損失補償。請問小皮所申請的是哪一種損失補償？
  options:
  - label: A
    content: 徵收補償
  - label: B
    content: 社會補償
  - label: C
    content: 基於信賴保護的損失補償
  - label: D
    content: 因特別犧牲的損失補償
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提及「主管機關為保存古蹟，廢止小皮的建造執照」，此屬於(C)基於信賴保護的損失補償。此意義為當事人對合法行政處分之存在，具有值得保護之信賴，並因廢止建造執照受到的損失，自應給予補償
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「真相錯覺效應」（the illusory truth effect）是指人們容易把接觸過的資訊當成是正確的。當我們的大腦經常接收某種資訊時，會提高處理該資訊的效率，這種效率的提升會使我們對這類資訊產生好感，並認為它是可信的。關於這樣的心理學現象，可能會造成資訊生活上的哪一個隱憂加劇？
  options:
  - label: A
    content: 假訊息的危害
  - label: B
    content: 個人資料的洩漏
  - label: C
    content: 網路霸凌的影響
  - label: D
    content: 智慧財產權的侵害
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「真相錯覺效應」意味人們容易把接觸過的資訊當成是正確的，因此若民眾接觸許多假資訊，反倒被洗腦為真實資訊，因此會加劇此隱憂，故選(A)假訊息的危害。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 過去《身心障礙者權益保障法》規定只有視障者可以從事按摩業，大法官於 2008 年作成解釋，認為該規定侵害非視障者的工作權，違憲，於 3 年內失效。因應此一釋憲宣告，政府依法公告：「2011 年 2 月 1 日起，醫療機構、車站、民用航空站、公園及政府機關等五大類場所，不得提供場所供明眼人從事按摩工作。其提供場地供視覺功能障礙者從事按摩或理療按摩工作者應予優惠。」下列何種觀點最符合上述？
  options:
  - label: A
    content: 兼顧個人職業選擇自由，及弱勢族群差別待遇之保障
  - label: B
    content: 因應社會變遷差異，擴大公益範疇且限縮個人自由
  - label: C
    content: 擴大社會權保障的範疇，加強少數群體的職業訓練
  - label: D
    content: 落實個人工作權益保護，以個別補償取代制度維護
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)規定只有視障者可以從事按摩業違憲，為保障個人職業選擇自由；給予視障者場地優惠為給予弱勢族群差別待遇之保障，為正確敘述。(B)此釋憲文並無限縮個人自由，反倒放寬大眾的職業選擇自由。(C)此釋憲文並無提及加強少數群體的職業訓練。(D)「其提供場地供視覺功能障礙者從事按摩或理療按摩工作者應予優惠」並非個人權益之保障或個別補償，而是針對整個弱勢群體。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小柯家的土地因處於市府興建科學園區以及附近聯外道路的計畫用地，被依法徵收。請問小柯可以提出下列何種權利主張？
  options:
  - label: A
    content: 向市府提起訴願
  - label: B
    content: 向市府請求損失補償
  - label: C
    content: 向市府請求國家賠償
  - label: D
    content: 向行政院提起行政訴訟
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 國家因公權力的「合法」行使，造成人民權益受到特別嚴重的損害（理論上稱為「特別犧牲」）時，國家負有補償的責任，人民可以就其損失向國家請求「補償」。依據題文，政府依法徵收土地，小柯可主張(B)向市府請求損失補償。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 《憲法訴訟法》施行後對我國的司法審查制度有重大變革，關於《憲法訴訟法》施行後我國司法審查制度的敘述，下列何者正確？
  options:
  - label: A
    content: 為保障時效，當人民認為法令侵害自身權利時，大法官可聲請違憲審查
  - label: B
    content: 為保障少數，個別立法委員認為法律牴觸《憲法》時，可聲請違憲審查
  - label: C
    content: 為保障人權，大法官可針對法院的確定終局裁判是否違憲進行審查
  - label: D
    content: 為保障司法獨立，司法院公布《憲法》判決時，主筆大法官姓名須保密
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)須為確定終局判決後。(B)須由立委總額 1∕4 以上提出聲請。(C)正解。(D)大法官作成判決時，應署名以示負責。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 對於侵權行為之損害賠償，法律採「損害填補原則」，亦即被害人因侵權行為所發生之任何損害，加害人都必須加以賠償，關於侵權損害行為之賠償，下列敘述何者正確？
  options:
  - label: A
    content: 損害賠償之權利人僅限受害者本人
  - label: B
    content: 損害賠償之義務人僅指加害人本身
  - label: C
    content: 損害賠償之原則以金錢賠償為主
  - label: D
    content: 損害賠償之原則以回復原狀為主
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不僅限於受害者，如受害者死亡，其親屬可請求損害賠償。(B)部分情況下有連帶賠償者，如未成年子女之法定代理人；雇主對於雇員之錯誤，可負擔連帶賠償責任。(C)(D)以回復原狀為原則，金錢賠償為例外。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 網友阿德看到得獎電影《可憐的東西》賣座，於是自己剪輯 5 分鐘電影畫面，再配上無厘頭的對話，註明編導者是阿德，上傳到網站上供人免費點閱觀賞。有關阿德的行為，下列敘述何者正確？
  options:
  - label: A
    content: 加上創意，可以登記為其著作
  - label: B
    content: 不違法，仍在合理使用範圍內
  - label: C
    content: 沒有收費，不會侵犯到著作財產權
  - label: D
    content: 已經侵犯到導演的姓名表示權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此行為侵害電影的著作人格權。(B)此已侵權，不屬於合理使用範疇。(C)侵權與是否收費無關，已侵害著作權人之人格權及財產權。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: YouTuber 老高一直以分享冷知識和科普影片而受到眾多觀眾的喜愛，然而最近他卻遭到指控是「抄襲慣犯」，有人聲稱他的好幾部影片幾乎完全是從日本的 YouTube 頻道翻譯過來的，老高的影片在選題、結構編排、資訊內容到敘事手法幾乎都跟該日本 YouTube 頻道高度相同，老高只是透過更改部分敘事順序、增加一些細節以及大量的通俗比喻來達到「看似沒有抄襲」的效果。如果指控屬實，老高的行為侵害了該日本 YouTube 頻道創作者的何種權利？
  options:
  - label: A
    content: 著作人格權
  - label: B
    content: 著作財產權
  - label: C
    content: 所有權
  - label: D
    content: 名譽權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 老高的影片編排結構、範例採用與影片內容都與原片相似，可能會侵害原著作人的「重製權」與「改作權」，屬於(B)著作財產權之範疇。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 大法官針對「猥褻資訊或物品」應如何評價，公布釋字第 407 號解釋文：「猥褻出版品，乃指一切在客觀上，足以刺激或滿足性慾，並引起普通一般人羞恥或厭惡感而侵害性的道德感情，有礙於社會風化之出版品而言。猥褻出版品與藝術性、醫學性、教育性等出版品之區別，應就出版品整體之特性及其目的而為觀察，並依當時之社會一般觀念定之。又有關風化之觀念，常隨社會發展、風俗變異而有所不同，主管機關所為釋示，自不能一成不變，應基於尊重《憲法》保障人民言論出版自由之本旨，兼顧善良風俗及青少年身心健康之維護，隨時檢討改進。」請選出最符合解釋文精神的選項
  options:
  - label: A
    content: 大法官提醒規範「猥褻」的概念，必須隨時代的改變而調整內容定義
  - label: B
    content: 大法官強調維護善良風俗及青少年身心健康，猥褻出版品應從寬認定
  - label: C
    content: 大法官認定猥褻出版品雖具有藝術性、醫學性、教育性，也應該禁止
  - label: D
    content: 大法官主張尊重《憲法》保障言論自由，猥褻出版品不應該列為《刑法》罪名
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文「有關風化之觀念，常隨社會發展、風俗變異而有所不同，主管機關所為釋示，自不能一成不變，應基於尊重《憲法》保障人民言論出版自由之本旨，兼顧善良風俗及青少年身心健康之維護，隨時檢討改進。」最符合大法官解釋之精神為(A)大法官提醒規範「猥褻」的概念，必須隨時代的改變而調整內容義。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 《刑法》第 185 條之 4 規定：「駕駛動力交動工具肇事，致人死傷而逃逸者，處 1 年以上 7 年以下有期徒刑。」2019 年，大法官作出釋字第 777 號解釋，認定法條規定的「肇事」是否有包含「非因駕駛人之故意或過失」（包括不可抗力、被害人或第三人之故意或過失）這件事情並不是一般人可以理解或預見，且如果在犯罪情節輕微卻沒有辦法易科罰金的情況，對個案構成顯然過苛之處罰，從而宣告肇事逃逸罪規定違憲失效。大法官認定肇事逃逸罪規定違憲的理由，依據哪些法律原則？(甲)信賴保護原則(乙)明確性原則(丙)比例原則(丁)平等原則
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (乙)(丙)
  - label: C
    content: (甲)(丙)
  - label: D
    content: (丙)(丁)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文「規定的『肇事』是否有包含『非因駕駛人之故意或過失』」，可知大法官認為此違反「明確性原則」；「如果在犯罪情節輕微卻沒有辦法易科罰金的情況，對個案構成顯然過苛之處罰」，可知大法官認為此違反「比例原則」。答案為(B)(乙)(丙)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_選修公民與社會II_g12s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
