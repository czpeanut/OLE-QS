  - label: D
    content: 某甲因確定終局裁判敗訴而負起賠償責任
  group_stem: 某甲與配偶婚後未共同生活十餘年，故依據《民法》第 1052 條第 2 項所定之「難以維持婚姻之重大事由」請求法院判准離婚。唯《民法》第 1052 條第 2 項但書規定，「其事由應由夫妻之一方負責者，僅他方得請求離婚。」限制有責配偶不得請求裁判離婚。聲請人在依法調查事證後，認定甲與配偶確有「難以維持婚姻之重大事由」，但此一事由甲應負較大責任，而《民法》第 1052 條第 2 項但書的合憲與否，與離婚准否之裁判結果有直接影響，因確信應適用之法律有牴觸《憲法》之疑義，故聲請司法院大法官解釋。大法官認為，《民法》第 1052 條第 2 項但書的規定限制有責配偶請求裁判離婚，原則上與《憲法》第 22 條保障婚姻自由之意旨尚屬無違。惟其規定不分難以維持婚姻之重大事由發生後，是否已逾相當期間，或該事由是否已持續相當期間，一律不許唯一有責之配偶一方請求裁判離婚，完全剝奪其離婚之機會，而可能導致個案顯然過苛之情事，於此範圍內，與《憲法》保障婚姻自由之意旨不符。相關機關應自本判決宣示之日起 2 年內，依本判決意旨妥適修正之。
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依據題文「相關機關應自本判決宜示之日起 2 年內，依本判決意旨妥適修正之」，顯然應修法而非另立專法。(B)(C)(D)此為法院法官暫停審判聲請之釋憲，大法官無權限廢棄原法院判決，此案尚未終局審判，以(B)為正解。
