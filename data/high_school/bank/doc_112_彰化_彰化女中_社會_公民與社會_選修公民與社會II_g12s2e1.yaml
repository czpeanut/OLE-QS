  group_stem: 釋字第 791 號解釋宣告《刑法》第 239 條通姦罪、《刑事訴訟法》第 239 條但書「可單獨對配偶撤告」之規定，因分別違反比例原則及平等原則而違憲，相關法律自解釋公布之日起失其效力。幾經紛擾之通姦罪是否除罪化議題，於法律上已臻底定，改以民事求償。然而社會上仍不乏有一波波贊成與反對之討論聲浪，贊成者認為通姦罪對維繫婚姻實際上無太大幫助；反對者擔心缺乏《刑法》規範，未來婚姻外遇案例會增加。
