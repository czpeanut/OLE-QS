  stem: 18 世紀，清朝一位皇帝對該朝首都地理形勢描述：「右擁太行左滄海，南襟河濟北居庸。會通帶內遼海外，雲帆可轉東吳粳（稻米）。」請問該首都及其附近地區在現代工商業發展中，必需克服的環境限制為何？
  options:
  - label: A
    content: 礦物原料短缺
  - label: B
    content: 冬夏溫差劇烈
  - label: C
    content: 土壤退化嚴重
  - label: D
    content: 淡水資源不足
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 清朝首都為北平（現稱北京），位於華北地區的黃淮平原，此地屬於夏雨冬乾的溫帶季風氣候。近年來中國北方沿海地區的大城市皆因工商業發達及人口密集致使缺水、缺電問題日益嚴重，官方因而積極採取南水北調、西電東送等重大基礎設施解決此問題。故選(D)。
