  section: 1
  number: 8
  type: single
  page: 2
  stem: 日本大阪西北方的「寶塚市」，為知名觀光旅遊勝地。遊客可在榮町的寶塚大劇場觀賞東西方歷史劇表演，在湯本町的寶塚溫泉泡湯，參訪市郊紫雲山以祈求安產、護佑嬰兒聞名的佛寺中山寺，參觀武庫川町的手塚治虫漫畫紀念館。上述哪個地方的景點，最能說明東亞文化圈的擴散現象？
  options:
  - label: A
    content: 榮町
  - label: B
    content: 紫雲山
  - label: C
    content: 湯本町
  - label: D
    content: 武庫川町
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)紫雲山的佛寺說明源於印度的佛教向東傳至中國及日本，符合題目所述的東亞文化圈擴散現象。
- id: doc_112_台中_台中二中_社會_地理_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: '下表為日本、韓國、美國與英國等 4 個國家文化產業發展特色的描述。請問臺灣與表中哪兩個國家的貿易依存度最高？

    | 國家 | 文化產業發展特色 |

    | --- | --- |

    | 甲 | 重視創意設計，為全球第一個利用公共政策推動文化創意產業發展的國家。主要的文化產業部門趨於多元，涵蓋建築、音樂、電腦遊戲、電影等，中、小型企業是該國發展文化創意產業的主力。實現了由以製造業為主的「世界工廠」向以文化產業為主的「世界創意中心」的成功轉型 |

    | 乙 | 藉由強大的政治和經濟影響力輸出文化產品，以視聽影音產品為大宗，產品製作多結合高科技，投資成本與利潤均大。國內發展出專業化文化產業生產區，尤其是西海岸的地中海型氣候區，企業在此共享區域公共設施與市場環境，緊密分工，提高產值與利潤 |

    | 丙 | 是全球最大的動漫製作和輸出國，遊戲產業也在全球占有舉足輕重的地位，其文化產業規模已超過了本國具有國際競爭力的電子產業和汽車產業。由於開發的遊戲軟體常源自動漫作品，因此形成了以動漫產品為核心，帶動遊戲、圖書、視聽影音等周邊商品出口的發展趨勢 |

    | 丁 | 文化產業在近十餘年才呈現快速增長，並風靡全球，以影視、網路遊戲、音樂等娛樂文化為主體，國家金融的大力扶持為其提供了良好的環境。近年大量出口的影視產品與音樂具有區域性國際影響力，帶動了觀光旅遊業的發展；網路遊戲除在其國內的市場持續成長外，出口規模也快速擴增 |'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從文化產業特色判斷：甲為英國（政府重視文化產業多元發展）、乙為美國（強大政治與經濟影響力、西海岸的好萊塢）、丙為日本（全球最大的動漫製作與輸出國）、丁為韓國（國家金融大力扶持近年來的文化產業）。而近十年來臺灣主要貿易夥伴依比重順序為中國、美國(乙)、日本(丙)、香港、韓國(丁)、新加坡。故選(C)。
