- id: doc_112_台中_台中二中_社會_地理_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 中國某年 7 月連續 7 日的暴雨，造成長江中下游地區發生嚴重洪患，受災戶超過千萬，造成此洪患的可能原因為何？(甲)青藏高原暴雨導致宣洩不及(乙)中下游地勢低造成排水不易(丙)冷鋒鋒面過境造成降雨不斷(丁)都市擴張造成滯洪空間不足
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 洪患主要發生在時雨量大（暴雨）、排水不及（地勢低窪、排水管線堵塞、沒有足夠滯洪空間等）。長江中下游地區原屬於地勢低窪的人口密集區，近年來因工商業發展造成大量墾伐及都市擴張，使得溼地縮減（河湖淤積）、綠地覆蓋率減少，一旦暴雨發生即會出現排水不及的洪患災害。故選(C)。
