- id: doc_112_台中_台中二中_社會_地理_g10s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 中國的沙塵暴主要發生在北方地區，其中南疆盆地、青海西南部、西藏西部及內蒙古中西部和甘肅中北部是沙塵暴的多發區，以春季發生的頻率最高。據統計，沙塵暴捲起的沙塵，80 ％往日韓方向傳送，最遠到達美國；約 20 ％往東南傳送到華南，甚至到達臺灣。「沙塵暴捲起的沙塵，80 ％往日韓方向傳送，最遠到達美國。」此現象和沙塵暴哪特性關係最密切？
  options:
  - label: A
    content: 沙塵暴多發區均位於西風帶中
  - label: B
    content: 不合理的土地開發導致沙塵暴頻率增高
  - label: C
    content: 造成沙塵暴的最大主因是土地沙漠化不斷擴張
  - label: D
    content: 春季乾旱少雨，氣溫升高，冷空氣活躍，是沙塵暴活躍的主因
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題目述及沙塵從中國北方吹送至日韓及美國，說明此地的盛行風乃由西向東。除該地冬季的西北季風將沙塵往華北及日、韓地區帶外，北緯 40 ～ 50 度間的盛行西風亦協力將此處的沙塵吹往太平洋東岸的美國。故選(A)。
