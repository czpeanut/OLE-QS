- id: doc_112_台中_台中二中_社會_地理_g10s2e3_s2_39
  section: 2
  number: 39
  type: single
  page: 11
  stem: 日本半導體產業起步於 1970 年代，1980 年代達到榮景。日本在 1970 年代轉而發展高科技產業，主要是考量到哪些時空背景？(甲)石油危機(乙)國內工資上漲(丙)中國經濟崛起(丁)民眾環保意識提升
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  group_stem: 2021 年，台積電宣布與日本企業在熊本合資成立「日本先進半導體製造」（JASM）公司。與台積電合作的兩大股東：索尼（SONY）半導體與豐田（TOYOTA）汽車大有來頭，索尼即以電子產品起家，陸續推出 Walkman 隨身聽與 Play Station 遊戲主機而在市場上占有一席之地，甚至在 1980 年代以 60 億天價併購美國哥倫比亞影業；而豐田汽車早年以生產紡織機起家，1950 年代得力於國際局勢而發展，1970 年代以省油為特色的日本汽車受到青睞，豐田汽車也逐步站穩全球最大汽車製造商的地位。台積電與兩家企業的合作引起日本政府高度關注，期盼藉由半導體振興計畫重回 1980 年代的榮景。請問：
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '高科技屬於技術密集但附加價值高的知識經濟產業，相較於日本 1970 年代前的石化工業而言，發展高科技產業得以減少汙染、減少對進口石油的依賴，且能提高產業獲利。依此判斷當時日本面臨(甲)(乙)(丁)的時空背景，符合日本積極從重工業轉型高科技產業的需求。故選(B)。

    40.1980 年代為日本泡沫經濟時期，源於美國要求日幣升值（購買力提高）及日本政府推行低利率政策（日本銀行大量放貸）。不僅熱錢因而大量湧入投資市場造成股市、房市大幅飆升外，日本企業亦至海外大量購買全球資產。故選(A)。

    41.(A)韓戰發生於 1950 ～ 1953 年間，美國考量軍需物資得就近支援韓戰戰線及支援日本重建，故將日本設為韓戰軍事物資生產基地，此舉則有利於日本企業恢復產能且奠定後續重工業與高科技產業的基礎。

    42.甲為金門國家公園（馬背造型的閩南建築特色為其人文特色之一）；乙為雪霸國家公園（大霸尖山及櫻花鉤吻鮭）；丙為玉山國家公園（高山及豐富動植物資源）；丁為台江國家公園（黑面琵鷺及沙洲）。故選(A)。

    43.丙為玉山國家公園，位於中央山脈中部段，此地亦為(D)傳統布農族聚落的主要分布區域。

    44.照片呈現沙洲、潟湖等臺灣西南部沿海沙岸景觀，此為臺灣西南部(D)丁：台江國家公園的景觀特色。

    45.受季節溫差、季風風向及地形等因素，臺灣愈往北部與東部降水愈豐沛且愈平均，愈往南部與西部則降水較少且集中夏季。依此原則推論甲為臺中、乙為臺北、丙為花蓮、丁為高雄。故選(A)。

    46.臺中為中部都會區的核心都市，除了人口大量移入提高用水需求外，近年來中部科學園區亦大幅度增加了供水壓力。故選(C)。

    47.水庫多設立於水源區，當河川上游集水區的泥沙豐富且沖刷力強時，將使得水庫淤沙情形嚴重。臺灣(甲)地震頻繁，震後地質脆弱且鬆軟，山崩、地滑提供了水源區豐富泥沙來源。此外，臺灣(乙)夏季降水強度大，暴雨加上(丙)河川上游坡度陡峭，使得河川侵蝕沖刷力道強，亦會使得大量泥沙沖刷至水庫淤積。故選(A)。

    48.文中提到 1970 年代臺灣從美國轉移技術至臺灣發展晶片產業，由此可推論此區域互動屬於擴散作用（核心國轉移技術）與模仿作用（半邊陲國模仿技術）。故選(A)。

    49.微笑曲線中的甲為技術研發、乙為製造代工、丙為品牌行銷。臺灣的半導體產業專注在代工製造，故屬於(B)乙階段。

    50.(B)交通革新包含通訊及運輸，有助於不同國家間的資訊與資源流通。全球分工仰賴於交通革新，使得設立於不同國家企業部門得以快速溝通與合作。'
