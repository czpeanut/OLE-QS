  page: 1
  stem: 1983 年成立於美國華盛頓州西雅圖市的好市多（Costco），是現今全球銷售量最大的連鎖會員制倉儲式量販店。目前全臺共有 14 家分店，其中臺中市有 2 家，分別位於南屯區與北屯區，未來臺中將開設第 3 家分店，傳出賣場位置鄰近海線地區。以臺中市的分店為例，好市多在臺中市選址的條件最可能有哪些？(甲)交通便利(乙)人口密度高(丙)土地面積大(丁)鄰近住宅區(戊)鄰近中心商業區
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲戊
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 量販店因賣場占地大且屬於量大銷售模式，其設址須考量土地廣闊、土地成本及交通便利等條件，故以市郊及近交通幹線地區為首選。故選(A)。
