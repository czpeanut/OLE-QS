  type: single
  page: 1
  stem: 石滬是一省時省力的古老漁撈方式，但建造石滬需有一定的地理條件配合，包括沿岸海底傾斜度不宜過大、海岸附近需有足夠建造石滬的石料、潮差適中。照片為臺灣西部某處海岸拍攝的石滬，該處海岸最可能位於下列何處？
  options:
  - label: A
    content: 竹苗
