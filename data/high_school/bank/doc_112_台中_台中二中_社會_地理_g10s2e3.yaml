  group_stem: 早在 1970 年代，臺灣政府決定從美國引進積體電路製造工業，由經濟部出資推動美國無線電公司（RCA）技術移轉計畫，並由張忠謀帶領工業技術研究院與荷蘭飛利浦公司、台塑企業等各方合資成立一家半導體公司，即現今的台積電。台積電開創晶片設計與晶片製造分工的模式，以晶圓代工製造為核心業務，逐步改進生產製程並走出屬於自己的路。自 2003 年起，台積電陸續在臺灣各地與中國等地設廠。隨著 COVID-19 疫情後經濟復甦對於晶片的需求提升與國家安全等理由，台積電陸續宣布在美國、日本與德國等地設廠。下圖為高科技產業的微笑曲線，請問：
