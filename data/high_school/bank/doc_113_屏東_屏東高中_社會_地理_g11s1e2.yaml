  group_stem: 在 2021 年埃及當地時間 3 月 23 日上午，一艘由長榮海運租用的超大型貨櫃輪長賜輪在蘇伊士運河擱淺，而且整個船身打橫阻塞住運河，根據長榮海運表示，長賜輪是被突然來的強風吹襲，導致偏離航道而擱淺。蘇伊士運河是亞洲通往歐洲，與中東通往歐洲的重要海運航線，此次大排長榮事件阻斷全球商貿和交通要道，6 天後才脫困，衝擊全球經濟與供應鏈，全球貨物貿易損失每小時約達 4 億美元（約新臺幣 114 億），石油和原物料等眾多貨物運輸受阻，也突顯現代商業模式對全球供應鏈的嚴重依賴。許多船隊若不繼續等待，就得考慮 140 年前的老方法：改道南非好望角。以新加坡到荷蘭鹿特丹為例，走此運河的路線全長約 8,288 海里、費時約 34 天，但走需繞經非洲南端好望角的路線，里程暴增且需耗費 49 天。請問：
