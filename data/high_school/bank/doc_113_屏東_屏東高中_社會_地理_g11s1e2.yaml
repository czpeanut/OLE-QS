- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s3_51
  section: 3
  number: 51
  type: calc
  page: 12
  stem: 某生製作了介紹 2024 年夏季奧運舉辦地點的地理報告，提到該地自然景觀為灌木林，請問 2024 年夏季奧運舉辦地點的氣候類型為何？
  group_stem: '奧林匹克運動會源於希臘，是每 4 年舉辦一次的運動盛會，2024 年夏季奧運開幕式，於臺灣時間 7 月 27 日凌晨 1 點半隆重登場。開幕式的地點選擇了塞納河畔，且民眾可免費到場共襄盛舉。以代表法國國旗的藍、白、紅 3 色煙霧在奧斯特利茨橋炸開作為開場，隨後各國代表團的遊船入場並由知名運動員擔任掌旗官，如希臘的籃球名將「字母哥」安特托昆博（Giannis Antetokounmpo）、英國的「跳水王子」戴利（Tom Daley）、美國的籃球巨星「詹皇」詹姆斯（LeBron James）、盧森堡的「桌球阿嬤」倪夏蓮（Ni Xia Lian）等，義大利的跳高選手坦貝里（Gianmarco Tamberi）甚至太投入而不慎把婚戒遺落在塞納河中。

    在表演節目方面，則展現了法國的文化魅力和巴黎地標，包括了向 5 年來全力重建巴黎聖母院團隊的致敬片段；在巴黎古監獄（La Conciergerie）用重金屬搖滾樂重新詮釋法國大革命名曲〈Ah! Caira〉，展現自由、平等、博愛的精神；以動畫方式重現 1911 年〈蒙娜麗莎的微笑〉失竊事件，巧妙地帶領觀眾進入羅浮宮與奧賽美術館等橋段。

    儘管開幕式受到好評，卻也引發一些爭議。變裝皇后表演因與位於義大利米蘭的達文西名畫〈最後的晚餐〉相似，即便創意總監澄清該表演參考了〈諸神的盛宴〉，以致敬希臘神話，仍引起宗教團體抗議。另外，作為觀光大國的法國，旅客量已幾乎達到國內居民的承載極限，也讓許多人對於奧運是否真的能帶來觀光效益持懷疑態度。

    請問：'
  answer:
  - 溫帶海洋性氣候
  answer_status: verified
  answer_source: answer_key
