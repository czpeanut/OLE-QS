  explanation: '沙黑爾地區為撒哈拉沙漠（北半球）邊緣的半乾燥氣候區（雨量約 100 ～ 600 mm），以(C)最接近此一特徵。

    38.4 國中，以尼日的各項指標都較低，故選(A)。

    39.歐盟首都為(C)比利時的布魯塞爾。

    40.(B)各國之間免除關稅，等於各國進出口上去邊界，形成單一市場，可增加規模經濟。

    41.(B)(乙)瑞士、(丁)冰島未加入歐盟；(丙)丹麥並未發行歐元。

    42.(C)可可為西非地區最主要的區域專業化產品。

    43.幾內亞灣沿岸因夏季 I.T.C.Z. 北移所形成的信風偏轉，夏吹西南風、冬吹東北風，形成(C)熱帶季風氣候。

    44.(B)非洲國家多因受殖民背景影響，經濟型態非礦即農，農業多以種植單一經濟作物的熱帶栽培業為主。

    45.(B)大規模、單一經濟作物、勞力密集、出口導向為熱帶栽培業的主要特徵。'
