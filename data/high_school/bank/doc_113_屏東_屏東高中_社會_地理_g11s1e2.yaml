      - 398.2
      - 434.2
      - 515.3
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由正圓形的農田可知，應為抽取深層地下水的自動灌溉所形成。(D)超抽地下水之後常造成地層下陷等更嚴重的環境問題。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下圖為烏克蘭穀物的主要出口國家占比圖。圖中的 9 個國家分屬 4 個不同的文化圈，其中包含最多國家的文化圈敘述，最可能為下列何者？
  options:
  - label: A
    content: 主要受到漢文化的影響，儒家思想為代表特色
  - label: B
    content: 分布範圍最廣且影響大，基督宗教為文化核心
  - label: C
    content: 多信仰印度教與伊斯蘭教，且處於人口紅利期
  - label: D
    content: 主要受到伊斯蘭教影響，開齋節為其重要節日
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_113_屏東_屏東高中_社會_地理_g11s1e2/s1_12_f1.png
    crop:
      page: 2
      rect:
      - 268.3
      - 619.0
      - 415.8
      - 793.35
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 出口對象中，西班牙、義大利、荷蘭、葡萄牙均屬於西方文化圈，以基督教為文化核心。故選(B)。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 小凱暑假到德國和瑞士旅遊，沿途拍了許多照片，也寫下旅遊札記，下列是小凱札記中的片段敘述，其中哪兩段敘述正確？(甲)我在德國南部的大城法蘭克福看到歐盟的總部和歐洲央行，在這城市裡可以體會到德國真的是歐盟的要角之一(乙)今天從德國一路開車向南行駛，經過德國與瑞士的邊界時，不用停車受檢，可以節省許多時間(丙)在瑞士欣賞到角峰、槽湖和 U 型谷等美景，果真是世界公園啊(丁)在瑞士逛街時，看到一家酒品專賣店，裡面有法國產的葡萄酒、德國產的啤酒、蘇格蘭威士忌等，價格都比想像中低廉，原因是瑞士為歐盟的成員國，和其他會員國間享有「關稅同盟」
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)歐盟總部在比利時的布魯塞爾，央行則位在德國的法蘭克福；(丁)瑞士為申根區，但並未加入歐盟。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 伊利蘇水壩位於底格里斯河上游，是土耳其最大的水力發電計畫。在伊利蘇水壩完工後，形成的人工湖卻將擁有 1 萬 2 千年歷史的古鎮哈桑凱伊夫淹沒，損失包含新石器時期所留下的洞穴和該國主要信仰宗教的建築遺址，此外更造成世居當地的少數民族流離失所。關於伊利蘇水壩完工後的影響，下列敘述哪些正確？
  options:
  - label: A
    content: 文末的少數民族應是指貝都因人
  - label: B
    content: 水壩蓄水後將淹沒基督宗教的古蹟
  - label: C
    content: 水壩位於熱帶莽原上，降水豐沛
  - label: D
    content: 水壩完工對下游的伊拉克影響最大
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)敘利亞、伊拉克位居兩河流域的下游，土耳其建壩將對此兩國產生重大影響。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 齋戒月是伊斯蘭教曆 9 月，以伊斯蘭教的曆法來計算，和西元曆相比每年比上一年提前約 10 天，所以齋戒月有時在冬季，有時在夏季，由下圖 2021 年齋戒月期間世界各地穆斯林的齋戒時間，推論其齋戒期間可能臨近哪項其他族群、宗教的節慶活動？
  options:
  - label: A
    content: 中秋節
  - label: B
    content: 聖誕節
  - label: C
    content: 潑水節
  - label: D
    content: 西洋情人節
