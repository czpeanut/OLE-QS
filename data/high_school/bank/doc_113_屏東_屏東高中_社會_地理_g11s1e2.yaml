  group_stem: '2023 年 7 月 26 日晚間，西非國家尼日共和國發生政變，該國現任暨首位民選總統貝佐姆（Mohamed Bazoum）遭總統衛隊成員挾持，並宣布關閉邊境、實施宵禁，成立臨時政府。

    尼日的政治動盪，引發西非國家及西方國家關注，尼日從 1960 年脫離法國殖民之後，已經發生 4 次軍事政變，可見該國政局的不穩定性。尼日部分國土位於沙黑爾地區，此區域氣候乾旱且大多數國家經濟貧困，因此成為有利恐怖組織發展的環境。近年來，美國、法國不斷給予沙黑爾地區反恐協助與經濟支援，但此區域的局勢依舊動盪不斷，自 2020 年以來，沙黑爾地區已經爆發了 7 場軍事政變。

