questions:
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '義大利西西里島的第一大城巴勒莫，融合拜占庭、伊斯蘭、諾曼 3 種風格的建築，被譽為是「世界上最美麗的伊斯蘭城市」。此地因為天候優良，成為義大利著名觀光勝地。下表中哪一氣候資訊為西西里島氣候？

    |  | 1 月均溫 （℃） | 7 月均溫 （℃） | 年降水量 （mm） | 6 ～ 8 月降水量 （mm） | 12 ～ 2 月降水量 （mm） |

    | --- | --- | --- | --- | --- | --- |

    | 甲 | 25 | 27 | 2,418 | 952 | 667 |

    | 乙 | 3 | 18 | 1,382 | 358 | 545 |

    | 丙 | 12 | 24 | 520 | 40 | 300 |

    | 丁 | －5 | 17 | 409 | 176 | 50 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 義大利為溫帶地中海型氣候，夏乾冬雨，(C)丙符合此一特徵。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 2023／2／6 土耳其凌晨 4 點 17 分在其與敘利亞接壤邊境發生強烈的地震。其規模 7.8，震源深度 17.9 公里，造成土耳其、敘利亞在內共超過 4 萬人死亡、10 萬餘人受傷，是這一個世紀以來該區經歷最強震之一。以下對於土耳其境內的敘述何者正確？
  options:
  - label: A
    content: 位非洲板塊與歐亞板塊之間
  - label: B
    content: 板塊張裂所形成的高原地形
  - label: C
    content: 為古老結晶陸塊礦產資源多
  - label: D
    content: 地形上屬安納托力亞高原
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 土耳其交界在北邊的歐亞板塊、南方的阿拉伯板塊、西南方的非洲板塊，多火山地震。(D)屬於安納托力亞高原。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 15 至 17 世紀馬來半島南部海岸，有許多自殖民母國遷入該地的男性商人、船員與苦力，在與當地女性通婚後，逐漸在當地形成一混血的少數族群，並保有原鄉海神節的慶典習俗。該族群在節慶當天，會先在海邊進行彌撒，接著抬出聖彼得神像遊行，最後來到船隻旁灑聖水祈福。根據前述，該族群的先人最可能來自下列哪個地區？
  options:
  - label: A
    content: 約旦河西岸
  - label: B
    content: 波斯灣沿海
  - label: C
    content: 中南半島沿海
  - label: D
    content: 伊比利半島西部
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由「海神節、彌撒、聖彼得」等資訊可知此地殖民母國應信仰天主教，(D)伊比利半島為天主教信仰。馬來西亞馬六甲地區的葡萄牙村村民每年 6 月都會慶祝海神節，形成觀光盛事。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 今日歐洲各地發展依然有差距，請問促使東歐地區仍然被視為經濟相對落後的邊陲區，與下列哪項因素關聯性最大？
  options:
  - label: A
    content: 社會治安不佳
  - label: B
    content: 工業化時間晚
  - label: C
    content: 缺乏原料和動力
  - label: D
    content: 民族多元衝突多
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)東歐國家因遠離工業革命的起源地，工業發展相對落後。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 非洲大陸形勢完整，地質多屬古老結晶岩，地形以台地和高原為主，高原邊緣多直抵海岸。下列非洲的哪個特色與上文所述最為相關？
  options:
  - label: A
    content: 下游水運不興
  - label: B
    content: 人口聚居沿海
  - label: C
    content: 生態環境多元
  - label: D
    content: 蘊藏豐富煤礦
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)非洲為一古老結晶陸塊，海岸線平整落差大，造成下游水運不暢，礦藏豐富。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '由於水資源的匱乏，西亞各國十分重視水資源的開發。下表為有關各國水資源的利用，何者「錯誤」？

    |  | (甲) | (乙) | (丙) | (丁) |

    | --- | --- | --- | --- | --- |

    | 國家 | 土耳其 | 沙烏地阿拉伯 | 阿富汗 | 伊朗 |

    | 取水方式 | 築壩 | 水井 | 海水淡化 | 坎井 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)丙：阿富汗為內陸國，無法開發海水淡化廠。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 下列有關二次大戰後各國的經濟發展特徵，何者正確？
  options:
  - label: A
    content: 西班牙利用阿爾卑斯山的水電發展工業
  - label: B
    content: 法國以鐵礦交換德國的煤礦，發展鋼鐵工業
  - label: C
    content: 義大利利用北海油田，迅速發展重工業
  - label: D
    content: 挪威擁有豐富的鐵礦，發展汽車、機械等工業
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)西班牙境內為庇里牛斯山。(C)鄰接北海油田的是英國、挪威。(D)鐵礦礦藏豐富的是西班牙、法國。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 2020 年歐盟共同農業政策中提及如農民將 5 ％土地做為休耕農地、梯田、隔離帶來種植樹木……等，每公頃會給予 85 歐元補貼，由此政策可知近年歐盟農業面臨哪項挑戰最棘手？
  options:
  - label: A
    content: 環境汙染嚴重
  - label: B
    content: 農業氣候惡化
  - label: C
    content: 耕作意願下降
  - label: D
    content: 進口糧價較低廉
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)歐盟過度發展農業，造成地力枯竭、環境嚴重汙染之後，鼓勵農田休耕，以利環境休養生息。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 某海峽扼波斯灣為油輪進出的重要水道，戰略地位相當重要，請問此海峽為何？
  options:
  - label: A
    content: 博斯普魯斯海峽
  - label: B
    content: 直布羅陀海峽
  - label: C
    content: 達達尼爾海峽
  - label: D
    content: 荷莫茲海峽
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)荷莫茲海峽為進入波斯灣的關鍵海峽。(A)博斯普魯斯海峽與(C)達達尼爾海峽居進出黑海關鍵位置。(B)直布羅陀海峽為大西洋進出地中海必經之處。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 西班牙足球甲級聯賽最強的兩隊是巴塞隆納與皇家馬德里，但兩隊不只是賽事上的對手，背後更有加泰隆尼亞與西班牙中央之間濃濃的政治、族群恩怨，尤其是「某事件」發生後，中央面臨財政危機，向加泰隆尼亞收取高額稅金，卻無給予相對應的統籌款所造成的不滿。此處提到的「某事件」最可能是什麼？
  options:
  - label: A
    content: 歐債危機
  - label: B
    content: 脫歐公投
  - label: C
    content: 難民危機
  - label: D
    content: 阿拉伯之春
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 位於西班牙東北部的加泰隆尼亞長期有獨立運動，與中央政府不合，(A)歐債風暴之後，政府面臨財務加劇，兩方情況更為交惡。
- id: doc_113_屏東_屏東高中_社會_地理_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 下圖為西亞某地衛星影像的農業景觀，請問下列何者敘述正確？
  options:
  - label: A
    content: 此灌溉以滴灌方式灌溉
  - label: B
    content: 為伊朗常見的坎井灌溉
  - label: C
    content: 此灌溉的水源主要來自河水
  - label: D
    content: 此灌溉容易造成地下水位降低
  assets:
  - key: s1_11_f1
