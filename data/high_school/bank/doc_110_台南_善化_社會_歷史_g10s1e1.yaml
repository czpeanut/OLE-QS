  stem: 智利某位學者曾表示：「某個島嶼部落酋長的交接儀式，曾因為樹皮布產量不足以供應即位大典所需，新酋長只好等到樹皮布足夠再即位。在臺灣俗稱『鹿仔樹』的構樹，是適應力強、在都市牆角、水泥地縫隙、鄉間荒地都容易出現的不起眼桑科植物，廣泛分布在東亞和中南半島。在西方紡織品被带入太平洋之前，比現代文化更早進入南太平洋群島的原住民長期維持種植構樹、拍打樹皮製成『樹皮布』的習俗。今日樹皮布的實用價值雖被紡織布取代，但在大洋洲島嶼仍具有南島文化的象徵意義，是重要慶典中極具代表的物質文化。」關於上文，下列分析何者正確？
  options:
  - label: A
    content: 構樹在臺灣與南太平洋隨處可見，可證明臺灣文化來自於南太平洋地區
  - label: B
    content: 臺灣與南太平洋地區有相同樹皮布文化，可做為同屬於南島語族之佐證
  - label: C
    content: 構樹與樹皮布文化反映了東南亞、澳洲、紐西蘭與臺灣皆應屬同一族群
  - label: D
    content: 目前樹皮布文化是唯一可證明臺灣與太平洋地區之間有文化關聯的證劇
