  stem: 關於IAA的敘述，何者正確？
  options:
  - label: A
    content: IAAH只在酸性環境下形成
  - label: B
    content: IAA是細胞分裂素的一種
  - label: C
    content: $IAA^{－}$可利用簡單擴散運輸
  - label: D
    content: $IAA^{－}$為親脂性物
  group_stem: 【閱讀二】 吲哚乙酸（IAA）在植物體內的運輸具有極性，只能從植物某一端向另一端運輸，不能反向運輸，稱為極性運輸，即莖部的IAA運送由莖頂往基部方向運輸，若為根的外圍細胞則由根尖往上運送。但若為根部的中柱，其IAA運送則為往根尖運送，因為其運送機制是利用韌皮部內的集體流動來運送，為非極性運輸。 以植物的莖為例，一般情況下植物細胞間隙的pH值約為5，當IAA位於胞外時，易於和質子結合形成IAAH，IAAH為親脂性分子，大多可以利用擴散作用進入細胞內，少數利用輸入運送蛋白（AUXI）進入胞內。因為質子幫浦利用主動運輸運送質子，故細胞的pH值可維持在7左右，和胞外有很大的差距，而進入胞內IAAH在此pH值下解離為$IAA^{－}$，$IAA^{－}$不能自由穿過細胞膜，必須藉由在細胞另一側的輸出運送蛋白（PIN）的協助運出胞外，運出胞外的$IAA^{－}$又將變成IAAH，又能利用擴散作用或AUX1進入下一個細胞中了。但是若將植物處以ATP合成抑制劑，則會抑制極性運輸。
  answer:
  - A
