  stem: 下列敘述何者正確？
  options:
  - label: A
    content: 運動細胞位在葉柄內
  - label: B
    content: 鉀離子離開運動細胞，會造成葉子張開
  - label: C
    content: 鉀離子進入運動細胞內，會造成葉子張開
