  group_stem: '【閱讀三】 研究顯示：玉米種子及果實的產量，決定於其雌花序的早期發育是否受到干擾。換言之，雌花序在授粉前的發育會嚴重影響後續的果實發育。為探討乾旱環境對玉米產量之影響，以及若在發育過程中提供養分能否改善因缺水所造成的產量損失，某科學家選擇生長大小相當且具花序芽的玉米植株進行實驗，作了以下的實驗處理（表一：其中每日澆水200毫升為水分充足狀態）。 這些玉米在實驗進行的第八天時雌花序成熟，並進行人工授粉（實驗中隔離雌花序，以避免天然授粉干擾實驗結果）。在實驗期間，定時測量子房的澱粉含量，來代表子房發育過程中其養分的變化；並測量子房烘乾後的重量，來代表整個果實的發育情形，所得結果分別是圖(一)及圖(二)。根據此結果回答37.～38.題。 表一

    圖(一) 圖(二)'
