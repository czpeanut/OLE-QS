  group_stem: 【閱讀一】 含羞草、葉下珠、鐵掃帚等植物，白天張開葉子、晚上閉合葉子，進行著「睡眠運動」。這是因為在葉柄或小葉柄的基部，也就是葉枕的部位，裡面有一種特殊的運動細胞，這種細胞吸水膨脹後葉子會張開，排水萎縮後葉子會閉合，按照生物時鐘以一定的週期進行。 幾百年來植物體內控制葉子開合的生理活性物質一直是個謎，直到日本生物學家上田實首次將它們成功分離出來，即「安眠物質」和「興奮物質」。它們是兩種作用相反的物質，「安眠物質」可以促使葉子閉合，「興奮物質」可以促使葉子張開，所以葉子最後的開合便取決於兩種物質濃度的平衡結果。有趣的是，每種植物有各自的生理活性物質，自己的生理活性物質對其他種植物無效，即含羞草的活性物質對葉下珠沒有反應。 葉下珠的安眠物質為「配糖體」（glycoside），白天生物時鐘使「β－葡萄糖酐酶」（β－glucosidase）活化，便催化配糖體水解成「葡萄糖」和「糖酐配基」（aglycon），於是安眠物質濃度降低，葉子張開；到了晚上，葡萄糖再度和醣酐配基結合，於是安眠物質濃度升高，葉子閉合。鐵掃帚的機制和葉下珠相反，鐵掃帚的興奮物質為配糖體，夜晚時興奮物質被水解葡萄糖和糖酐配基，葉子閉合；白天時興奮物質濃度再度升高，葉子張開。 生物時鐘在特定的時間會活化β－葡萄糖酐酶，促使配糖體水解，造成兩種活性物質濃度的平衡發生變化，因而引發睡眠運動。此兩種生理活性物質會直接作用在前述的運動細胞上，於是便造成葉子的開合。【改編自牛頓雜誌237期P.16～21】 請根據上文回答下列問題：
