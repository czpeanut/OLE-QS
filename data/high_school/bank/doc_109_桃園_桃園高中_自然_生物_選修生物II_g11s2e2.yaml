  section: 1
  number: 15
  type: single
  page: 2
  stem: 請問何種細胞中，你可以同時找到木質素、半纖維素和纖維素？
  options:
  - label: A
    content: 根尖分生細胞
  - label: B
    content: 水蘊草表皮細胞
  - label: C
    content: 保衛細胞
  - label: D
    content: 厚壁細胞
  group_stem: <u>第15.題為題組</u> 全球石油的存量估計將於35年至50年內耗盡，因此各國都在極力研發「生質能」以確保能源供給無虞。纖維素（cellulose）為生質能的原料之一。纖維素大量存在於植物細胞壁且不被人體所利用，因此被認為是最符合經濟效益與環保規範的生質能原料。但是，細胞壁中除了纖維素，還有其他物質，例如木質素（lignin）與半纖維素（hemicellulose）。木質素會降低纖維素的分離，使其能源使用效率降低。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
