  section: 2
  number: 18
  type: multiple
  page: 3
  stem: 學校欲改善某塊地的土壤問題，於是將廚餘埋在土壤中做為有機肥，幾天後發現植物出現了凋萎的現象。請問下列哪些是造成這個現象的可能原因？
  options:
  - label: A
    content: 廚餘太鹹了，導致土壤中滲透壓太低，植物失水而死
  - label: B
    content: 土壤中微生物進行發酵作用溫度上升，導致植物的根壞死
  - label: C
    content: 廚餘中的有機物太多，根進行主動運輸吸收這些養分，耗費過多的能量而死
  - label: D
    content: 土壤中的微生物分解廚餘時消耗土壤中的氧氣，植物的根缺氧而死
  - label: E
    content: 廚餘使有害病源菌孳生感染植物，植物的根無法正常運作
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
