  stem: 假設三條直線$L_{1}$：x－2y＋3＝0，$L_{2}$：2x＋3y＝0，$L_{3}$：ax－y－1＝0，若$L_{1}$ , $L_{2}$ , $L_{3}$不能圍成三角形，試求a之值。
  options:
  - label: A
    content: $\frac{1}{2}$
  - label: B
    content: $-\frac{1}{2}$
  - label: C
    content: $-\frac{2}{3}$
  - label: D
    content: $-\frac{13}{9}$
  - label: E
    content: $\frac{7}{4}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '若$L_{3}$//$L_{1}$，則斜率$m_{3}$＝a＝$m_{1}$＝$\frac{1}{2}$ 若$L_{3}$//$L_{2}$，則斜率$m_{3}$＝a＝$m_{2}$＝$-\frac{2}{3}$ 若$L_{1}$ , $L_{2}$ , $L_{3}$ 交於一點，$\begin{cases}L_{1} : x-2y+3=0 \\ L_{2} : 2x+3y=0\end{cases}$ ⇒ ( x , y )＝$(-\frac{9}{7} , \frac{6}{7} )$，代入$L_{3}$＝$-\frac{9}{7}a-\frac{6}{7}-1$＝0 ⇒ a＝$-\frac{13}{9}$ 故選(A)(C)(D)。'
- id: doc_113_台中_興大附中_數學_g10s1e2_s2_6
  section: 2
