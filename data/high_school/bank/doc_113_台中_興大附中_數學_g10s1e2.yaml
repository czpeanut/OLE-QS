  stem: 若三次函數y＝f (x)＝$x^{3}$＋$6x^{2}$＋3x＋2＝a( x＋1 )$^{3}$＋b( x＋1 )$^{2}$＋c( x＋1 )＋d，其中a , b , c , d為實數，則下列哪些選項為真？
  options:
  - label: A
    content: a＋b＋c＋d＝－3
  - label: B
    content: (－1 , d ) 為y＝f (x) 的對稱中心
  - label: C
    content: f (－0.99)＝3.94
  - label: D
    content: y＝f (2) 在x＝－1附近之近似直線為y＝－6x－2
  - label: E
    content: 當 | x | 值很大時，y＝f (x) 近似於y＝$x^{3}$
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (1) f (0)＝a＋b＋c＋d＝2 (2) $\begin{matrix}\begin{matrix}1 & + 6 & + 3 & + 2 \\ & - 1 & - 5 & + 2\end{matrix}\begin{matrix}-1 \\ \end{matrix} \\ \begin{matrix}1 & + 5 & - 2\end{matrix} \begin{matrix}+ 4\end{matrix} \begin{matrix}\cdots d\end{matrix} \\ \begin{matrix} & - 1 & - 4\end{matrix} \\ \begin{matrix}1 & + 4\end{matrix} \begin{matrix}-6\end{matrix} \cdots c \\ \begin{matrix} & - 1\end{matrix} \\ a\cdots 1 \begin{matrix}+ 3\end{matrix} \cdots b\end{matrix}$ ∴ f (x)＝( x＋1 )$^{3}$＋3( x＋1 )$^{2}$－6( x＋1 )＋4 ∵ b≠0 ∴ (－1 , d ) 不是對稱中心 (3) f (－0.99)＝(－0.99＋1 )$^{3}$＋3(－0.99＋1 )$^{2}$－6(－0.99＋1 )＋4 ＝0.000001＋0.0003－0.06＋4 ＝3.940301 (4) y＝f (x) 在x＝－1附近的近似直線為 y＝c( x＋1 )＋d ＝－6( x＋1 )＋4 ＝－6x－2 (5) 即y＝f (x) 的廣域特徵，故當 | x | 很大時，y＝f (x) 近似於y＝$x^{3}$。 故選(D)(E)。
