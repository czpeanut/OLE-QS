  stem: 若直線L：$\frac{x}{a}$＋$\frac{y}{b}$＝1通過 (－3 , 2 ) 且和兩坐標軸所圍的三角形面積為$\frac{3}{2}$。 (1) a×b可能為哪些可能值？( 2分 ) (2) 試求所有滿足敘述之直線L，並寫出該直線的x截距與y截距。( 8分 )
  explanation: '(1) 直線L與x軸和y軸分別交於A( a , 0 ) 和B( 0 , b )，設O( 0 , 0 ) 由△OAB面積＝$\frac{1}{2}|ab| =\frac{3}{2}$ ⇒ | ab |＝3 ∴ ab＝3或－3

    (2)將點 (－3 , 2 )代入$\frac{x}{a}+\frac{y}{b}$＝1 ⇒$\frac{-3}{a}+\frac{2}{b}$＝1 $\therefore b$＝$\frac{2}{1+\frac{3}{a}}$＝$\frac{2a}{a+3}$ 方法一：若ab＝3 ⇒ ab＝$\frac{2a^{2}}{a+3}$＝3 ⇒ $2a^{2}$＝3a＋9 ⇒ $2a^{2}$－3a－9＝0 ⇒ ( 2a＋3 ) ( a－3 )＝0 ∴ a＝$-\frac{3}{2}$或3 ① 當a＝$\frac{-3}{2}$時，b＝－2，即L的x截距為$\frac{-3}{2}$，y截距為－2 ② 當a＝3時，b＝1，即L的x截距為3，y截距為1

    方法二：若ab＝－3 ⇒ ab＝$\frac{2a^{2}}{a+3}$＝－3 ⇒ $2a^{2}$＝－3a－9 ⇒ $2a^{2}$＋3a＋9＝0 判別式$3^{2}$－4×2×9＜0 ∴無解。'
