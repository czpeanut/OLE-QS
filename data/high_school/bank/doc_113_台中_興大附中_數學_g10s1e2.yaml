- id: doc_113_台中_興大附中_數學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設f (x) 為一多項式，其奇數項係數和為2，偶數項係數和為6，求f (x) 除以$x^{2}$－1的餘式。
  options:
  - label: A
    content: x＋7
  - label: B
    content: 2x－8
  - label: C
    content: 2x＋6
  - label: D
    content: －3x＋1
  - label: E
    content: －x＋3
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: $\begin{cases}奇數項係數和=\frac{f(1)-f(-1)}{2}=2 \\ 偶數項係數和=\frac{f(1)+f(-1)}{2}=6\end{cases}$ ⇒ $\begin{cases}f(1)=8 \\ f(-1)=4\end{cases}$ 設f (x)除以$x^{2}$－1的商式為Q(x)，餘式為ax＋b，即f (x)＝( $x^{2}$－1 )．Q(x)＋ax＋b 則$\begin{cases}f(1)=a+b=8 \\ f(-1)=-a+b=4\end{cases}$ ⇒ $\begin{cases}a = 2 \\ b = 6\end{cases}$ 故餘式為2x＋6。故選(C)。
