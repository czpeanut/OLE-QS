  stem: 設k為實數，若二次函數y＝$k^{2}x^{2}$＋3x－5k的圖形在y＝$4x^{2}$＋3x－1的圖形下方且不相交，試求下列哪些k值可滿足此條 件。
  options:
  - label: A
    content: $-\sqrt{2}$
  - label: B
    content: $-\frac{7}{10}$
  - label: C
    content: $\frac{4}{3}$
  - label: D
    content: '2'
  - label: E
    content: $\sqrt{7}$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: ( $k^{2}x^{2}$＋3x－5k )－( $4x^{2}$＋3x－1 ) 恆負 ⇒ ( $k^{2}$－4 )$x^{2}$－( 5k－1 )＜0 ①若$k^{2}$－4 $\neq$0，二次函數y＝( $k^{2}$－4 )$x^{2}$－( 5k－1 ) 的圖形在x軸下方，故開口向下且判別式＜0 $\begin{cases}k^{2}-4 < 0 \\ ( k^{2}-4 ) ( 5k-1 ) < 0\end{cases}$ ⇒ $\begin{cases}k^{2}-4 < 0 \\ 5k-1 > 0\end{cases}$ ⇒ $\begin{cases}-2 <k < 0 \\ k > \frac{1}{5}\end{cases}$ ⇒ $\frac{1}{5}$＜k＜0 ②若$k^{2}$－4＝0，則－( 5k－1 )＜0 ⇒ $\begin{cases}k^{2}-4 < 0 \\ 5k-1 > 0\end{cases}$ ⇒ k＝2 故選(C)(D)。
- id: doc_113_台中_興大附中_數學_g10s1e2_s2_7
  section: 2
