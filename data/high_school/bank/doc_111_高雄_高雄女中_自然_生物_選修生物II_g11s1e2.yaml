- id: doc_111_高雄_高雄女中_自然_生物_選修生物II_g11s1e2_s3_35
  section: 3
  number: 35
  type: single
  page: 4
  stem: 閱讀完上面短文後，請判斷下列敘述何者正確？
  options:
  - label: A
    content: 若有植物長期位於光飽和點下時，將無法合成有機養分，必定死亡
  - label: B
    content: 處於光飽和點的植物，碳反應消耗的$CO_{2}$與呼吸作用產生的量相等
  - label: C
    content: 光飽和點代表光合作用的效率趨於飽和，可用附圖的A點表示
  - label: D
    content: 對植物而言，至少必須大於B點的光照強度，才能累積有機養分
  group_stem: '光合作用的能量來自於光能，故而光的強度會影響光合作用的效率。一般可以使用植物消耗的$CO_{2}$量來衡量光合作用的效率。若將光強度（以光通量表示）與植物消耗的$CO_{2}$量的關條作圖，表示如附圖。光合作用進行時，固碳反應會消耗$CO_{2}$，然而呼吸作用會產生$CO_{2}$，當固碳反應消耗的量與呼吸作用產生的量相等時，我們稱之為光補償點（LCP）。而隨著光強度逐漸增加，光合作用的效率會從一開始的直線上升，轉而趨於平緩，而達到穩定，此時我們則稱之為光飽和點（LSP）。

    若長期處於光補償點以下，植物終將死亡，所以光補償點反映了植物處於弱光下的適應能力。「陰性」植物具有較低的光補償點，通常約小於20 μmol．$m^{－2}$．$S^{－1}$，而「陽性」植物具有較高的光補償點，約於50～100 μmol．$m^{－2}$．$S^{－1}$之間。與光補償點相反，光飽和點反映出植物在強光環境下的適應能力，研究顯示：「陰性」植物的光飽和點約為700 μmol．$m^{－2}$．$S^{－1}$，「陽性」植物的光飽和點約為1300 μmol．$m^{－2}$．$S^{－1}$。'
  shared_asset: g3_35_44
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
