  stem: '請根據附圖，判斷下列對於甲、乙兩植物的敘述何者正確？

    閱讀三

    植物在行光合作用的過程中，光反應所產生的化合物會立即被用於進行固碳反應，將能量轉換合成醣類，所謂的固碳反應是將$CO_{2}$從空氣中固定，進而轉換成為醣類，是自然界中物質循環的重要過程。大部分的植物以卡爾文循環進行固碳作用，其特點是會先產生一個三碳化合物，這樣的植物稱為$C_{3}$植物，其固碳作用的步驟為：(1)固碳：以五碳化合物固定$CO_{2}$，形成2個三碳化合物。(2)還原：將三碳化合物轉換為醣類。(3)再生：再次形成五碳化合物以利進行下一次固碳。

    而某些植物在演化過程中為了抵抗乾旱等問題，演化出不同的固碳型式，例如：$C_{4}$植物及CAM植物，$C_{4}$植物在固碳的過程中，葉肉細胞會先固定$CO_{2}$形成四碳化合物，再將其送至維管束鞘細胞進行卡爾文循環，這樣的方法可以在氣孔暫時關閉，$CO_{2}$濃度低峙，增加固碳作用效率。而CAM植物通常生長在沙漠等環境，會利用夜晚將$CO_{2}$固定成為有機酸儲存在液泡中，待日間光線充足時再將有機酸釋放，進行卡爾文循環產生醣類。根據上文及下圖(一)、(二)、(三)，回答下列問題：

    圖(一) 圖(二) 圖(三)'
  options:
