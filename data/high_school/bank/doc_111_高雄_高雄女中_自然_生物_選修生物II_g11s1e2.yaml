    閱讀四

    人體儲存熟量的物質，主要的形式包含醣類、脂質與蛋白質。透過呼吸運動中，吸氣的氧氣含量與呼氣的二氧化碳含量的變化，可知生物體正在以什麼物質為主要提供能量的代謝對象。這樣的計算方式稱為呼吸商，呼吸商＝釋放二氧化碳量/消耗氧氣量。從葡萄糖氧化的化學反應式為例。

    $C_{6}H_{12}O_{6}$＋6 $O_{2}$ → 6 $CO_{2}$＋6 $H_{2}$O，當人體純粹以葡萄糖為能量來源時，產出的二氮化碳與消耗的氧應該相等，此時換算而得的呼吸商＝1，當以脂肪為主要代謝能量來源時，因為脂肪化學分子中含氧元素少，吸收的氧氣用在將碳與氫元素氧化，但只有在氧化碳的結果可以獲得二氧化碳，因此以脂肪為主要代謝物質時，呼吸商會較低。

    某生上網收集在有氧呼吸條件，三種主要有機物代謝的資料，並整理如附表：

