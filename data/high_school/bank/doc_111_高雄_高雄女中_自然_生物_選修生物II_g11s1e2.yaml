- id: doc_111_高雄_高雄女中_自然_生物_選修生物II_g11s1e2_s3_32
  section: 3
  number: 32
  type: single
  page: 4
  stem: 關於本文，下列敘述何者<u>有誤</u>？
  options:
  - label: A
    content: 綠葉的顏色主要是來自於葉綠素
  - label: B
    content: 植物細胞內色素比例：葉綠素＞類胡蘿蔔素＞花青素
  - label: C
    content: 葉片轉紅、轉黃，必然落葉死亡
  - label: D
    content: 紅葉轉綠，可能是因為葉綠素重新合成累積
  group_stem: '植物的葉片通常是綠色的，這是因為植物細胞內的葉綠素比例最高，可達65％，其次是類胡蘿蔔素約占29％，花青素約占6％，一般而言，當環境因素使得葉片進行光合作用的功能降低，會產生落葉。落葉前，葉綠素大量分解，使葉片顏色轉變，就會顯現出黃、紅、棕等多樣的色彩。

    某些植物季節轉換時會出現明顯的黃葉，像是銀杏、無患子。黃葉的色澤來自於葉片內所含的類胡蘿蔔素。類胡蘿蔔素是脂溶性的，廣泛存在於植物細胞的葉綠體膜上或雜色體之中。

    落葉闊葉樹種則是通常會產生紅葉，像是楓樹、薯豆。紅葉的紅色來自於花青素。花青素的顏色取決於溶液的pH值，在酸性環境中，花青素呈現紅色，在鹼性環境中則呈現藍紫色。研究顯示，植物合成花青素的代謝途徑與醣類代謝相關，細胞內醣類的累積有助於花青素的生成。此外，花青素也受到溫度的影響，高溫環境下的花青素不易累積，容易降解，而在低溫情況下，植物較容易累積花青素。有趣的是，部分杉樹的葉片在寒冬時會轉為枯黃或紅色，春季時又會重新回復為綠色，所以葉片轉紅不見得就會凋零落葉。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  tags:
