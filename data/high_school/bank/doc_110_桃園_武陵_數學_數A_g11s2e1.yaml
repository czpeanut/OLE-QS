  stem: 空間中三相異平面$E_{1}$、$E_{2}$、$E_{3}$，其中$E_{1}$與$E_{3}$交於$L_{1}$，$E_{2}$與$E_{3}$交於$L_{2}$，下列敘述何者正確？
  options:
  - label: A
    content: $L_{1}$與$L_{2}$不可能歪斜
  - label: B
    content: 若$L_{1}$與$L_{2}$相交於一點，則$E_{1}$與$E_{2}$必相交於一線
  - label: C
    content: 若$L_{1}$與$L_{2}$相交於一點且$E_{1}$與$E_{2}$相交於一線，則此線必與$E_{3}$垂直
  - label: D
    content: 若$L_{1}$與$L_{2}$平行，則$E_{1}$與$E_{2}$必相交於一線
  - label: E
    content: 若$L_{1}$與$L_{2}$平行且$E_{1}$與$E_{2}$相交於一線，則此線必與$E_{3}$平行
  answer:
