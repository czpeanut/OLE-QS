- id: doc_109_台中_興大附中_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 空間中有三條直線 $L_{1}$：$x-2=\frac{y-1}{2}=\frac{z-3}{3}$，$L_{2}$：$\begin{cases}x-2y+2z=3 \\ x+y+z=0\end{cases}$，$L_{3}$：$\begin{cases}x=-2+t \\ y=2-t \\ z=6-2t\end{cases}$， t 為實數。下列敘述哪些是正確的？
  options:
  - label: A
    content: $L_{1}$ 的方向向量為（0，2，3）
  - label: B
    content: $L_{1}$ 與 $L_{2}$ 的方向向量互相垂直
  - label: C
    content: $L_{2}$ 交 xz 平面於點（－3，0，3）
  - label: D
    content: $L_{2}$ 與 $L_{3}$ 兩直線交於一點
  - label: E
    content: $L_{1}$、$L_{2}$、$L_{3}$ 無法決定出一平面
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵$L_{1}$：$\frac{x-2}{1}=\frac{y-1}{2}=\frac{z-3}{3}$ ∴$L_{1}$ 的方向向量為（1，2，3）

    (B) ╳：$L_{2}$：$\begin{cases}E_{1} : 1 \cdot x-2y+2z=3 \\ E_{2} : 1 \cdot x+1 \cdot y+1 \cdot z=0\end{cases}$ ∴$\vec{n_{1}}$＝（1，－2，2），$\vec{n_{2}}$＝（1，1，1）

    $\vec{n_{1}}\times \vec{n_{2}}$＝（1，－2，2）×（1，1，1）＝$\left( \left| \begin{matrix}-2 & 2 \\ 1 & 1\end{matrix} \right| , \left| \begin{matrix}2 & 1 \\ 1 & 1\end{matrix} \right| , \left| \begin{matrix}1 & -2 \\ 1 & 1\end{matrix} \right| \right)$

    ＝（－4，1，3）

    ∴取$\vec{L_{2}}$＝（－4，1，3）

    ∴$\vec{L_{1}} \cdot \vec{L_{2}}$＝（1，2，3）．（－4，1，3）＝1×（－4）＋2×1＋3×3＝－4＋2＋9≠0

    ∴$\vec{L_{1}}\perp ＼\vec{L_{2}}$

    (C) ○：$L_{2}$：$\begin{cases}x-2y+2z=3 \\ x+y+z=0\end{cases}$，令 x＝0 得$\begin{cases}y-z=-\frac{3}{2}\cdots \cdots \cdots \cdots \cdots ① \\ y+z=0 \cdots \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①＋②得$2y=-\frac{3}{2}$ ∴$y=-\frac{3}{4}$，$z=\frac{3}{4}$

    得 $L_{2}$ 上一點$P\left( 0 , -\frac{3}{4} , \frac{3}{4} \right)$

    令 $L_{2}$：$\begin{cases}x=0-4s \\ y=-\frac{3}{4}+s \\ z=\frac{3}{4}+3s\end{cases}$，s ∈ R 代入 xz 平面（y＝0） ∴$-\frac{3}{4}+s=0$ ∴$s=\frac{3}{4}$

    ∴$L_{2}$ 交 xz 平面於$\left( -4\times \frac{3}{4} , -\frac{3}{4}+\frac{3}{4} , \frac{3}{4}+3\times \frac{3}{4} \right)$＝（－3，0，3）

    (D) ○：∵$L_{2}$：$\begin{cases}x=-4s \\ y=-\frac{3}{4}+s \\ z=\frac{3}{4}+3s\end{cases}$，s ∈ R，$L_{3}$：$\begin{cases}x=-2+t \\ y=2-t \\ z=6-2t\end{cases}$，t ∈ R

    ∴$\begin{cases}-4s=-2+t \\ -\frac{3}{4}+s=2-t \\ \frac{3}{4}+3s=6-2t\end{cases}$ ∴$\begin{cases}4s+t=2 \\ s+t=\frac{11}{4}\end{cases}$ ∴$s=-\frac{1}{4}$，t＝3

    ∴$L_{2}$，$L_{3}$ 相交於點（1，－1，0）

    (E) ╳：∵$\vec{L_{2}}$＝（－4，1，3），$\vec{L_{3}}$＝（1，－1，－2）

    ∴$\vec{L_{2}}\times \vec{L_{3}}$＝（－4，1，3）×（1，－1，－2）

    ＝$\left( \left| \begin{matrix}1 & 3 \\ -1 & -2\end{matrix} \right| , \left| \begin{matrix}3 & -4 \\ -2 & 1\end{matrix} \right| , \left| \begin{matrix}-4 & 1 \\ 1 & -1\end{matrix} \right| \right)$＝（1，－5，3）

    ∴$L_{2}$，$L_{3}$ 決定的平面 E：1．x－5y＋3z＝k，又過 $L_{3}$ 上的點（－2，2，6）

    ∴k＝－2－10＋18＝6 ∴E：x－5y＋3z＝6

    ∵$L_{1}$：$\frac{x-2}{1}=\frac{y-1}{2}=\frac{z-3}{3}$過 Q （2，1，3）代入 E：2－5×1＋3×3＝6 ∴Q ∈ E

    又$\vec{L_{1}} \cdot \vec{n}$＝（1，2，3）．（1，－5，3）

    ＝1×1＋2×（－5）＋3×3＝0

    ∴$\vec{L_{1}}$⊥$\vec{n}$

    ∴$L_{1}$ 落在平面 E 上 ∴$L_{1}$，$L_{2}$，$L_{3}$ 共平面 E：x－5y＋3z＝6

    故選(C)(D)'
