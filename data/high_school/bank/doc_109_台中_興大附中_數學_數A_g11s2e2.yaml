- id: doc_109_台中_興大附中_數學_數A_g11s2e2_s2_15
  section: 2
  number: 15
  type: fill
  page: 3
  stem: '2020 年初，世界各地爆發了傳染病「新冠肺炎 （COVID－19）」，其可能致死以及對感染者會產生無法回復的後遺症，因而造成人民恐慌，各國相繼研發新冠肺炎的快篩檢測試劑，希望能快速正確檢驗疑似感染者體內是否真的存在病毒。

    |  |  | 檢測者 |  |

    | --- | --- | --- | --- |

    |  |  | 感染病毒 | 非感染病毒 |

    | 採檢 結果 | 陽性 | 真陽性 | 偽陽性 |

    |  | 陰性 | 偽陰性 | 真陰性 |

    目前生產的快篩檢驗試劑，其檢測的準確率有其極限，仍有「偽陽性」與「偽陰性」的可能，若檢測正確率不高，會造成大規模的「無感染者誤判確診、已感染者被錯放」的嚴重後果。在醫檢學上，常以「敏感性」與「特異性」來衡量檢測的準確度，敏感性是感染者中採檢陽性的比例，也可稱為「真陽性」的比例；特異性是非感染者中採檢陰性的比例，一般簡稱為「真陰性」的比例。檢測者是否為感染者與接受試劑檢測後的採檢結果關係如附表。

    現在有一款 T 牌快篩試劑，檢驗結果為「真陽性」的機率有 90 ％，檢驗結果為「真陰性」的機率有 80 ％。

    已知在太平洋群島上的某海島，島內有 1 ％的 COVID－19 感染者。現在島上的居民 Zedkaia 因公務要出國，因此前往醫院用 T 牌快篩試劑進行檢測。第一次快篩結果為陽性，但 Zedkaia 不相信，因為他已經長達兩個月都在家裡辦公，隔天，Zedkaia 進行第二次快篩結果為陰性。最終拿到檢查報告得以出國。

    試問 Zedkaia 沒有感染 COVID－19 的機率為＿＿＿＿。'
  answer:
  - $\frac{176}{177}$
