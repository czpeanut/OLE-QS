- id: doc_109_台中_興大附中_數學_數A_g11s2e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設 A 與 B 為獨立事件，且$P(A)=\frac{1}{2}$，$P(B)=\frac{1}{3}$。下列哪些選項是正確的？
  options:
  - label: A
    content: P（A∩B）＝$\frac{5}{6}$
  - label: B
    content: P（B｜A）＝$\frac{1}{3}$
  - label: C
    content: P（A｜B）＝$\frac{1}{3}$
  - label: D
    content: P（B｜A'）＝$\frac{1}{3}$
  - label: E
    content: P（B'｜A'）＝$\frac{2}{3}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵A，B 為獨立事件 ∴P（A∩B）＝P(A)×P(B)＝$\frac{1}{2}\times \frac{1}{3}=\frac{1}{6}$

    (B) ○：P（B｜A）＝$\frac{P (A\cap B)}{P (A)}$＝$\frac{\frac{1}{6}}{\frac{1}{2}}=\frac{2}{6}=\frac{1}{3}$

    (C) ╳：P（A｜B）＝$\frac{P (A\cap B)}{P (B)}$＝$\frac{\frac{1}{6}}{\frac{1}{3}}=\frac{3}{6}=\frac{1}{2}$

    (D) ○：P（B｜A''）＝$\frac{P (A''\cap B)}{P (A'')}=\frac{P (B)-P (A\cap B)}{1-P (A)}=\frac{\frac{1}{3}-\frac{1}{6}}{1-\frac{1}{2}}=\frac{\frac{1}{6}}{\frac{1}{2}}=\frac{2}{6}=\frac{1}{3}$

    (E) ○：P（B''｜A''）＝$\frac{P (A''\cap B'')}{P (A'')}=\frac{1-P (A\cup B)}{1-P (A)}=\frac{1-(P (A)+P (B)-P (A\cap B))}{1-P (A)}$

    ＝$\frac{1-\frac{1}{2}-\frac{1}{3}+\frac{1}{6}}{1-\frac{1}{2}}=\frac{\frac{6-3-2+1}{6}}{\frac{1}{2}}=\frac{2}{3}$

    故選(B)(D)(E)'
