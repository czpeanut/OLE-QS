  stem: '<u>彌豆子</u>在化學實驗室做分壓定律的實驗，實驗裝置如附圖： (1) 已知實驗室溫度為t℃，大氣壓力為1大氣壓。一開始<u>彌豆子</u>在玻璃管P下方置一玻璃球Q，內含乙醚a克，且U形管左、右管水銀液面高度相等。 現利用玻璃管P擊破玻璃球，乙醚經過一段時間後會完全氣化，則最後達到平衡時，U形管左、右管水銀液面高度哪邊較高？左右兩邊相差多少公分？ （1.乙醚分子量為b，錐形瓶的體積為V mL，理想氣體常數用R代替； 2.玻璃球Q、玻璃管P及U形管體積均可忽略；3.答案列式即可。）

    (2) <u>彌豆子</u>進行該實驗時，不慎打翻了乙醚，他想到哥哥<u>炭治郎</u>之前跟他提到的實驗室安全規範，揮發性液體的濃度在空氣中需低於一定量，否則容易引起氣爆，此濃度稱為爆炸下限。 已知乙醚的爆炸下限為莫耳分率0.02，若該實驗室長3m、寬4.1m、高2m，實驗室溫度為27℃，則<u>彌豆子</u>需打翻多少莫耳的乙醚才會引起氣爆？ （1.假設打翻的乙醚皆會氣化且均勻分散在實驗室中；2.理想氣體常數R＝0.082 atm‧L／mole‧K； 3.假設實驗室內其他物質的體積皆可忽略：例如<u>彌豆子</u>、分壓裝置體積等。）'
