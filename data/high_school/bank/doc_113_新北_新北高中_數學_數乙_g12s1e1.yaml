  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵（x＋2）（x－3）≥ 0 ⇒ x ≥ 3 或 x ≤－2

    ∴函數 $f_{1}$（x）的定義域為 E

    (B) ╳：∵（x＋2）（x－3）≠0 ⇒ x≠－2 且 x≠3

    ∴函數 $f_{2}$（x）的定義域不為 C

    (C) ○：∵（x＋2）（x－3）＞0 ⇒ x＞3 或 x＜－2

    ∴函數 $f_{3}$（x）的定義域為 D

    (D) ╳：∵（x＋2）（x－3）＞0 ⇒ x＞3 或 x＜－2

    ∴函數 $f_{4}$（x）的定義域為 D

    (E) ╳：∵x 可為任意實數

    ∴函數 $f_{5}$（x）的定義域為 A

    故選(C)'
