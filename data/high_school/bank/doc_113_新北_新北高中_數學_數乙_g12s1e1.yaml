    ＝6＋0＝6

    (B) ○：$\lim_{x\rightarrow 5} \frac{f(x)}{3(x-5)}$＝$\frac{1}{3}$．$\lim_{x\rightarrow 5} \frac{f(x)}{x-5}$＝$\frac{1}{3}$×6＝2

    (C) ○：$\lim_{x\rightarrow 5} \left( x \cdot \frac{f(x)}{x-5} \right)$＝$(\lim_{x\rightarrow 5} x)$．$\left( \lim_{x\rightarrow 5} \frac{f(x)}{x-5} \right)$＝5×6＝30

    (D) ╳：$\lim_{x\rightarrow 5} \frac{f(x)}{(x-5)^{2}}$＝$\left( \lim_{x\rightarrow 5} \frac{1}{x-5} \right)$．$\left( \lim_{x\rightarrow 5} \frac{f(x)}{x-5} \right)$

