  stem: 設集合 A＝｛x∣x 為任意實數｝，B＝｛x∣－2 ≤ x ≤ 3｝，C＝｛x∣－2＜x＜3｝，D＝｛x∣x＜－2 或 x＞3｝，E＝｛x∣x ≤ －2 或 x ≥ 3｝，底下為五個函數與其定義域的配對，哪個選項是正確的？
  options:
  - label: A
    content: 函數 $f_{1}$（x）＝$\sqrt{(x+2)(x-3)}$的定義域為 B
  - label: B
    content: 函數 $f_{2}$（x）＝$\frac{1}{(x+2)(x-3)}$的定義域為 C
  - label: C
    content: 函數 $f_{3}$（x）＝$\frac{1}{\sqrt{(x+2)(x-3)}}$的定義域為 D
  - label: D
    content: 函數 $f_{4}$（x）＝log〔（x＋2）（x－3）〕的定義域為 A
  - label: E
    content: 函數 $f_{5}$（x）＝$5^{（x＋2）（x－3）}$的定義域為 E
  answer:
