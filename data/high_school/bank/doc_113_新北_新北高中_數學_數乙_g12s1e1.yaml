  section: 3
  number: 3
  type: multiple
  page: 3
  stem: 若 a、b 為實數且$\lim_{x\rightarrow 2}\frac{2x^{2}+ax+b}{x^{2}-x-2}$＝$\frac{5}{3}$，則下列選項哪些是正確的？
  options:
  - label: A
    content: x－2 是 $2x^{2}$＋ax＋b 的因式
  - label: B
    content: 2a＋b＝8
  - label: C
    content: 當 x≠2 時，$\frac{2x^{2}+ax+b}{x^{2}-x-2}$＝$\frac{2x+1}{x+1}$
  - label: D
    content: a＝3
  - label: E
    content: b＝2
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵$\lim_{x\rightarrow 2} \frac{2x^{2}+ax+b}{x^{2}-x-2}$極限值存在

    又 $x^{2}$－x－2＝（x－2）（x＋1），且$\lim_{x\rightarrow 2} (x^{2}-x-2)$＝0

    ∴x－2 是 $2x^{2}$＋ax＋b 的因式

    (B) ╳：∵x－2 是 $2x^{2}$＋ax＋b 的因式，令 f（x）＝$2x^{2}$＋ax＋b

    ∴f(2)＝8＋2a＋b＝0 ⇒ 2a＋b＝－8

    (C) ○(D)╳：$\lim_{x\rightarrow 2} \frac{2x^{2}+ax+b}{x^{2}-x-2}$＝$\lim_{x\rightarrow 2} \frac{(x-2)〔2x+(a+4)〕}{(x-2)(x+1)}$＝$\frac{5}{3}$

    ⇒$\frac{4+(a+4)}{3}$＝$\frac{5}{3}$⇒ a＝－3

    ∴當 x≠2 時，$\frac{2x^{2}+ax+b}{x^{2}-x-2}$＝$\frac{2x+1}{x+1}$

    (E) ╳：∵2a＋b＝－8，且 a＝－3 ∴b＝－2

    故選(A)(C)'
