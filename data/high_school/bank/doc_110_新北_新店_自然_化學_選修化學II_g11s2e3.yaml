  stem: 已知2 M(g)＋2 N(g) → X(g)＋2 Y(g)$^{ }$為一不可逆反應，M(g)$^{ }$及N(g)$^{ }$的起始分壓分別為300 mmHg及200 mmHg。反應初速率是起始速率N(g)$^{ }$反應掉一半（100 mmHg）時速率的4.5倍。下列何項反應速率定律式與此觀察最吻合？
  options:
  - label: A
    content: r＝$kP_{M}^{2}P_{N}$
  - label: B
    content: r＝$kP_{M}P_{N}^{2}$
  - label: C
    content: r＝$kP_{M}P_{N}$
  - label: D
    content: r＝$kP_{M}^{2}P_{N}^{1/2}$
  - label: E
    content: r＝$kP_{M}^{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 當N反應掉一半： $\frac{\Delta [D]}{\Delta t}$ 此時$P_{M2}$＝200 mmHg、$P_{N2}$＝100 mmHg。 一開始$P_{M1}$＝300 mmHg、$P_{N1}$＝200 mmHg。 故可找尋($\frac{300}{200}$)$^{x}$($\frac{200}{100}$)$^{y}$＝4.5的選項，可得(A)為答案（x＝2、y＝1）。
