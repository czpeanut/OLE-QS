- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列有關影響反應速率的因素之敘述，何者正確？
  options:
  - label: A
    content: 對於所有的化學反應而言，包含有酶當催化劑的反應，只要溫度愈高，反應速率一定愈快
  - label: B
    content: 生物體內的催化劑稱為酵素，pH值愈大，會使酵素的催化效果愈好
  - label: C
    content: 催化劑可加快反應速率的主因為分子動能分布曲線右移，使超過低限能的分子數增加
  - label: D
    content: 反應速率和催化劑的濃度無關，只和催化劑的種類有關
  - label: E
    content: 生物體內的酶只能催化特定的反應，如澱粉酶只能幫助消化澱粉
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)酶為蛋白質，溫度過高可能會被破壞，需在適當溫度方可催化；(B)酶為蛋白質，需在適當pH值下方可催化；(C)主要是因為降低活化能，動能分布曲線不移動；(D)催化劑濃度越高，催化效果越好，反應速率越快。
- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 下列關於碰撞學說的敘述，何者正確？
  options:
  - label: A
    content: 只要粒子互相碰撞就會發生化學反應
  - label: B
    content: 粒子具有足夠的能量就能發生化學反應
  - label: C
    content: 反應物粒子即使能量不足，但碰撞位向正確者也可發生反應
  - label: D
    content: 發生碰撞的反應物粒子須有足夠能量及正確碰撞位向才能發生反應
  - label: E
    content: 粒子具有足夠能量，位向稍有偏差一樣可反應
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)需能量充足、位向正確；(B)需位向正確；(C)能量須高於活化能；(E)需位向正確。
- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 已知NO(g)＋$Cl_{2}$(g)＋83 kJ → NOCl(g)＋Cl(g)，若逆反應之活化能為2 kJ，則下列敘述何者正確？（1 cal＝4.18 J）
  options:
  - label: A
    content: 逆反應之ΔH＝＋83 kJ
  - label: B
    content: 此反應之活化能約為20 kcal
  - label: C
    content: 溫度升高，則逆反應速率減慢
  - label: D
    content: 反應物之平均位能高於生成物
  - label: E
    content: 此反應之活化能約為85 kcal
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: ΔH＝$E_{a正}$－$E_{a逆}$，故83＝$E_{a正}$－2，$E_{a正}$＝85 kJ。 (A)正反應的ΔH＝83 kJ，故逆反應應為－83 kJ；(B)為85 kJ，相當於20 kcal；(C)溫度升高，正逆反應速率都增加；(D)因為吸熱反應，故生成物的位能較高；(E)為85 kJ。
- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_12
  section: 1
