  stem: 2 A＋B → 2 C＋3 D，下列選項為在四種不同條件下的反應速率，則該反應進行得最快的條件是：
  options:
  - label: A
    content: $r_{A}$＝0.15 M．$min^{－1}$
  - label: B
    content: $r_{B}$＝0.2 M．$min^{－1}$
  - label: C
    content: $r_{C}$＝0.45 M．$min^{－1}$
  - label: D
    content: $r_{D}$＝0.6 M．$min^{－1}$
  - label: E
    content: $r_{D}$＝0.01 M $sec^{－1}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 將各物質反應速率除以係數：(A) 0.075 M‧$min^{－1}$；(B) 0.2 M‧$min^{－1}$；(C) 0.225 M‧$min^{－1}$；(D) 0.2 M‧$min^{－1}$；(E)要先將sec換成min，再除以係數得到0.2 M‧$min^{－1}$。(C)最大。
- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 反應$N_{2}$(g)＋3 $H_{2}$(g) → 2 $NH_{3}$(g)$^{ }$其反應速率定律式r＝k [$N_{2}$] [$H_{2}$]，若$N_{2}$的初莫耳數為5 mol，$H_{2}$為3 mol時的反應速率為a，則於定溫定容下加入8 mol的Ar，則反應速率變為
  options:
  - label: A
    content: $\frac{1}{4}$a
  - label: B
    content: $\frac{1}{2}$a
  - label: C
    content: a
  - label: D
    content: 2a
  - label: E
    content: 4a
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 因為定溫、「定容」，故體積不變、反應物濃度也不變，則反應速率不變。
- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 有關反應速率常數k值之敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 反應物濃度改變時，k值亦不同
  - label: B
    content: k值隨催化劑改變
  - label: C
    content: 不同的化學反應之k值不同
  - label: D
    content: 當其他條件相同時，k值愈大，反應速率愈大
  - label: E
    content: 溫度愈高，k愈大
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) k值不受濃度影響，只受溫度、本性、催化劑等因素影響。
