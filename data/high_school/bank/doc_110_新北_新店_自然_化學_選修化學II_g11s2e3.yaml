- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某反應之速率常數k＝0.02 $mol^{－1}$．L．$s^{－1}$，則此反應之級數？
  options:
  - label: A
    content: '0'
  - label: B
    content: '1'
  - label: C
    content: '2'
  - label: D
    content: '3'
  - label: E
    content: '4'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 假設為n級反應，則速率定律式可假設為r＝k[A]$^{n}$。則k的單位為$M^{(1－n)}$‧$s^{－1}$。此題中單位為$M^{－1}$‧$S^{－1}$，故可知n＝2，為二級反應。
- id: doc_110_新北_新店_自然_化學_選修化學II_g11s2e3_s1_6
  section: 1
