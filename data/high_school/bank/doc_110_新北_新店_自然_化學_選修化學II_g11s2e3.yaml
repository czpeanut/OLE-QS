  options:
  - label: A
    content: 可直接由此反應式判斷反應速率R＝k[$N_{2}$][$H_{2}$]$^{3}$
  - label: B
    content: 屬放熱反應，故升高溫度會降低反應速率
  - label: C
    content: 定容下，可由壓力變化來測定反應速率
  - label: D
    content: 此反應使用鐵粉作催化劑，為一勻相催化反應
  - label: E
    content: 可觀察顏色來判斷反應速率
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)速率定律式須由實驗決定；(B)升高溫度會同時增加正逆反應速率；(C)正確，因反應過程中分子數量會變少，故壓力也會下降；(D)鐵粉為固體，此反應中的反應物、產物均為氣體，故為非勻相催化；(E)錯誤，反應物、產物都沒有顏色。
