  answer_status: verified
  answer_source: answer_key
  explanation: (A)正確，因超越低限能的分子最多（面積最大）；(B)正確，低限能最高（最右邊）；(C)正確，活化能越高，加入催化劑效果越明顯；(D)錯誤，升高溫度會影響的是動能分布曲線（右移），而非低限能；(E)正確，活化能越高，反應速率對溫度的變化越靈敏。
