  stem: '臺灣在實施 40 多年的 9 年國民義務教育後，於 2014 年開始實施 12 年國教，有幾位同學因國民教育延長的政策，討論學校教育對於社會階層化的影響。

    小天：我覺得學校教育依據個人的能力，讓大家在公平機會的競爭下，被選擇和分配到各種社會階層上，使大家各司其職、發揮所長。

    小華：我不認為學校教育造成社會的階層化分工以及經濟收入差異，是由個人努力或能力決定，家庭階級背景更決定個人受教育的機會和社會階層的分工。

    小英：我覺得學校教育反應出的是主流文化的價值，整體環境對中上階層的學生有利，應多關注較低階層學生的學習與心態，避免貼標籤。

    小敏：但我認為學校教育都在灌輸資本主義中能力與收入相符合的概念，使勞工階級的社會大眾安於其位，所以我覺得學校教育無法改變社會既存的不平等現象。

    請問根據討論的觀點，下列判斷何者正確？'
  options:
  - label: A
    content: 小天的觀點屬於衝突論
  - label: B
    content: 小華的觀點屬於功能結構論
  - label: C
    content: 小英的觀點屬於符號互動論
  - label: D
    content: 小敏對學校教育的功能抱持比較正面的態度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 小天：屬於「功能結構論」。小華、小敏：屬於「衝突論」。(D)小敏對學校教育的功能抱持較負面的看法。
