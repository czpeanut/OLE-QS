  stem: 對於「藍領移工」的不平等現象，我國政府也投入各方面努力希望加消除。下列何種政策作法，將無法落實？
  options:
  - label: A
    content: 將外勞一詞從法規中刪除，不論國籍統稱為「移工」
  - label: B
    content: 在法規上給予移工與本國籍勞工相同的基本薪酬保障
  - label: C
    content: 不分國籍，保障公民參政權
  - label: D
    content: 透過教育及宣導，強調職業不分貴賤、文化不分優劣
  group_stem: '移工也會因為不同的專業而有不同的勞動權益和薪資對待。一般而言，工人分作白領和藍領兩個階級：「白領」是提供腦力勞動來獲得報酬的工人；「藍領」則是指以提供體力勞動來獲得報酬的工人。臺灣的《就業服務法》就將在臺就業的外國人劃分為「白領移工」與「藍領移工」，白領移工是指《就業服務法》第 46 條第 1 項第 1 款至第 6 款，包括管理者階層、補習班外籍老師、演藝工作者、運動員等。「藍領移工」是指《就業服務法》第 46 條第 1 項第 8 款至第 11 款，像是漁工、外籍看護工，以及廠工都屬於藍領移工，而此類移工不僅不得自由轉換雇主、具有工作年限，連聘僱流程也較為繁複。

    移工能夠從事的工作可以分作兩大類：「社福移工」以及「產業移工」。社福移工主要分為家庭幫傭及看護，其中外籍看護又因為聘用雇主的身分不同，分為「家庭看護」（雇主為一般家庭）及「機構看護」（雇主為安養院、長照中心或醫療院所等等）。其中，此三類占社福移工比例分別為：家庭幫傭 0.64 ％、家庭看護 92 ％、機構看護 6.80 ％。三種看起來很相似卻又不同的工作名稱，其實工作內容上還是有些差異：「家庭幫傭」主要是負責洗衣、煮飯、打掃家裡、帶小孩……等等常見的家務工作；而「家庭看護」以及「機構看護」，工作內容則是照顧重大失能患者的日常生活。在法規制度上，只有「機構看護」受到《勞基法》的保障，薪資符合最低基本薪資標準$25,250。而出海捕魚的「漁工」聘僱為雙軌制。因為聘僱的地點差別（或更簡單的說，他上船的地點差異），而分作「境內聘僱」漁工和「境外聘僱」漁工。「境內聘僱」就是從事近海漁撈的體力工作，屬於勞動部管轄，並享有《勞基法》保障，基本薪資也是以$25,250 計算。

    「境外聘僱」依據遠洋漁業條例及「境外僱用非我國籍船員許可及管理辦法」，從事遠洋漁業工作，屬於農委會漁業署管轄，不受《勞基法》保障。根據境外聘僱法規定的最低工資為每月 450 美金，相當於約新臺幣 1 萬 3000 元；且規定外籍船員每日休息時間不應低於 10 小時，也就是即使工作 14 小時也不違法。相較境內聘僱漁工更難以追蹤工作狀況和環境，導致臺灣遠洋漁業頻傳外籍漁工薪資剋扣、工時過長、身分證件遭扣留、仲介強迫簽剝削契約等事情頻傳。（資料來源：https://one-forty.org/tw/blog/migrant-statistics-in-taiwan）'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)參政權需具備我國國民身分與相關法定條件，故仍有一定的限制。
