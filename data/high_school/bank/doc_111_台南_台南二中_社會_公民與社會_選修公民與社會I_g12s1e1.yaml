- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 4
  stem: 社會階層化是指一個社會中的各群體，按照他們擁有的社會資源不同，區分為各種不同等級的狀態，甚至會在世代間延續下去。這種階層化現象，在世界各國都普遍存在，只是差距程度不一，因此許多國家藉由推動相關政策以縮小其差距。以下這些是可以縮小差距的政策，請問哪些是我國實施的政策？(甲)高級中等以上學校，應保障原住民學生入學及就學機會(乙)原住民族通過母語認證的高中生，升學考試得加重計分(丙)讓偏遠的高中生有更多機會進入大學而推動的繁星計畫(丁)結婚應以書面為之，並應由雙方當事人向戶政機關登記(戊)政府將贈與稅和遺產稅稅率由 50 ％調降為 10 ％單一稅率
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (丙)(丁)(戊)
  - label: C
    content: (甲)(丙)(丁)
  - label: D
    content: (乙)(丙)(戊)
  answer:
