questions:
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 社會不平等經常展現在性別、族群、身心障礙和區域面向。在臺灣關於這些面向的不平等，下列何者正確？
  options:
  - label: A
    content: 性別不平等問題已透過立法方式得到解決
  - label: B
    content: 對新住民家庭的歧視，顯示出族群不平等
  - label: C
    content: 設置六都能有效減少城鄉間的區域不平等
  - label: D
    content: 殘補式的社會福利制度顯示出身心障礙者的權益已經獲得極大改善
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)立法尚未能完全解決性別不平等問題。(C)設置六都後，因直轄市與縣市資源不同，反而易強化區域不平等。(D)殘補式社會福利制度：指社會福利制度只扮演補償性供給的角色，當家庭或市場失去功能時，政府才介入滿足個人之基本需求，因此僅部分改善身心障礙者的權益。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 社會階層是指人們在社會中依據其所擁有的社會資源來分等列級的方式；而社會流動是指個人的地位從一個社會階層轉到另一個社會階層的現象。下列有關社會流動的敘述何者正確？
  options:
  - label: A
    content: 財富、權力與聲望是影響社會階層形成的主要三種因素
  - label: B
    content: 當一個人由富商變為攤販時，這是一種結構重組流動
  - label: C
    content: 婚配一定是一種水平社會流動
  - label: D
    content: 王老師從臺南二中調動到北一女中是屬於代間流動
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)由富商變攤販屬於「垂直向下」流動。(C)婚配不一定為水平流動。(D)個人調校屬於「代內」流動。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據我國社會中的不平等以及不平等的成因，請問下列敘述何者配對正確？
  options:
  - label: A
    content: 國際移工面臨婚配歧視以及法律歧視問題
  - label: B
    content: 新移民女性面臨性別種族的交織性歧視
  - label: C
    content: 身心障礙者從小學就面臨入學困難等問題
  - label: D
    content: 原住民因飲食習慣不好面臨平均壽命較低問題
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國際移工未必會面臨婚配與法律歧視的問題，法律保障其相關人權。(C)我國小學／中學為全民義務教育，不會有入學困難的問題。(D)選項敘述為族群偏見，與題目提及的社會不平等較無關。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 社會流動是指個人從社會階層的某一位置移到另一位置的現象。請問下列有關「社會流動」的相關敘述，何者正確？
  options:
  - label: A
    content: 在開放社會中，個人的先賦地位如個人出生就被賦予的地位等並非全無影響力
  - label: B
    content: 在開放社會中，先賦地位對個人社會流動的影響力較封閉社會來得明顯
  - label: C
    content: 在封閉社會中，不同社會階層間的界線較為彈性，社會流動較頻繁發生
  - label: D
    content: 「富不過三代」這一句諺語，可以用來形容封閉社會中的社會流動情況
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)在開放社會中，先賦地位的影響力可能較封閉社會來得小。(C)社會流動頻繁以及社會階層間的界線較彈性為「開放社會」的特色。(D)「開放社會」才有社會流動的可能。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '社會階層化存在於每個社會中，對於社會階層化的兩種看法，瑞凡做了一比較表如下，請問哪一選項是完全正確無誤的？

    | 選項 | 功能論 | 衝突論 |

    | --- | --- | --- |

    | (A) | 階層化反映社會上共享的社會價值 | 階層化反映社會上弱勢團體的價值 |

    | (B) | 階層化可提高個人努力的誘因 | 階層化會阻礙個人才能發揮 |

    | (C) | 權力不平等造成職位報酬差異 | 職位的報酬差異反映工作價值 |

    | (D) | 階層化普遍存在，是必須且無可避免 | 階層化非普遍存在，非必須且可避免 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)功能論主張社會依賴各種不同功能的分工來維持社會的穩定運作，因此有各種不同的職業和工作來發揮其各自的功能，應是反映社會上「分工」的社會價值；衝突論指出社會不平等阻礙了個人發揮才能的機會，將降低社會的生產力，因此階層化無法反映弱勢群體的價值。(C)表格兩者敘述相反。(D)兩個理論皆認為階層化普遍存在，但功能論認為是必要且無可避免，衝突論認為非必要且可避免。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《銀行轉型未來式：Bank 3.0》的作者 Brett King 點出未來商業銀行的挑戰──在行動科技的普及下，金融服務全面開放，不再是銀行的專利，銀行應該更重視虛實整合和社群經營。隨著網路銀行及行動支付等科技發展，「銀行行員」這個職業也漸漸消失中。以上提及的產業趨勢與挑戰，與何種社會流動的類別最具直接關聯？
  options:
  - label: A
    content: 垂直流動
  - label: B
    content: 水平流動
  - label: C
    content: 結構流動
  - label: D
    content: 代間流動
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹敘述為「社會結構改變」造成的現象。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 社會流動指個人在階層裡向上、向下或水平的流動情形，通常是以經濟、社會地位、聲望作為主要區隔的因素。下列哪一個現象，可以稱為「水平社會流動」？
  options:
  - label: A
    content: 臺南市某市議員當選為立法委員
  - label: B
    content: 小胖從沒沒無名的學生變成網紅
  - label: C
    content: 由便利超商的店員變成店長
  - label: D
    content: 在臺北市的水電工轉職到臺南市當水電工
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)皆為「垂直向上」流動。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '下表呈現東亞三國的「家庭所得五等分位差距倍數」的歷年變化數值，此差距倍數係指最高 20 ％家庭所得為最低 20 ％家庭所得之倍數。以下對於表中資訊的詮釋，何者正確？

    | 年度 | 我國 | 日本 | 南韓 |

    | --- | --- | --- | --- |

    | 2008 | 6.05 | 6.07 | 5.71 |

    | 2009 | 6.34 | 6.25 | 5.75 |

    | 2010 | 6.19 | 6.22 | 5.66 |

    | 2011 | 6.17 | 6.24 | 5.73 |

    | 2012 | 6.13 | 6.26 | 5.54 |

    | 2013 | 6.08 | 6.12 | 5.43 |

    | 2014 | 6.05 | 6.43 | 5.41 |

    | 2015 | 6.06 | 6.30 | 5.11 |

    | 2016 | 6.08 | 6.31 | 5.45 |'
  options:
  - label: A
    content: 南韓的家戶所得差距最小，顯示政府致力於消弭貧富差距
  - label: B
    content: 日本家戶所得差距始終是三國中最大，階層差異日益顯著
  - label: C
    content: 我國的家戶所得差距一度超越其他兩國，但後來漸趨縮小
  - label: D
    content: 三個國家的貧窮家戶數，都約為富有家戶的五到六倍左右
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)家戶所得差距最小，但仍有 5 倍左右，且並非逐年減少，無法判斷政府是否致力於消弭貧富差距。(B) 2009 年時我國倍數為最大。(D)表格數據並非指家戶數。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 在臺灣或美國社會職業聲望表顯示，大學教授和醫生均享有優渥的薪水與高社會地位。請問下列何者符合功能論者對此社會現象提出的說法？
  options:
  - label: A
    content: 凡是具備良好家庭教育的人，往往比普遍人更容易當上醫師或教授
  - label: B
    content: 醫師或教授職業未必有良好能力，而是其生活環境擁有較多社會資源
  - label: C
    content: 醫師或教授專業工作是社會重要角色，需要高薪和高地位吸引有能力的人
  - label: D
    content: 醫師或教授的職業高薪和高地位，是資優生為捍衛自身利益訂出的原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)指的是先賦地位。(B)功能論認為醫師與教授是因具有良好能力，才能享有優渥薪水與高社會地位。(D)此為「衝突論」的論述。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 社會學家艾瑞克．萊特將階級區分為四種類型，分別為資本家、自營作業者、專業管理人員和非技術工人，若依此類型與馬克思提出的階級相比較，下列敘述何者較為恰當？
  options:
  - label: A
    content: 萊特的階級劃分比馬克思多了中產階級，但都以生產工具有無作為標準
  - label: B
    content: 萊特對於階級劃分的界線比馬克思清楚，且中產階級也會剝削無產階級
  - label: C
    content: 萊特的階級是從階級的功能來區分，而非從馬克思階級剝削的角度來看
  - label: D
    content: 萊特階級分類中的非技術工人，與馬克思沒有生產工具的無產階級相同
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)萊特延續馬克思的觀點，階級之間是存在著剝削關係，而且掌握生產工具與否仍是重大的社會分歧，而不只看個人的職業類別或是收入差異。萊特所帶來的理論突破即是將是否掌握稀有技術（專業能力）與是否掌握權威位置帶入，就算沒有擁有生產工具，但是專家與技術工人（擁有稀有技術），或是經理與領班（擁有權威位置），仍是享有比無產階級（無技術工人）更優渥的物質生活條件。(B)劃分方式不同，無法比較何者較為清楚。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 《做工的人》是 2020 年的臺灣電視劇集，改編自作家林立青的同名散文集。這部影集是以鐵工阿祈為主角，阿祈父親經營的鐵工廠輝煌好幾年，讓生活優渥的阿祈與弟弟阿欽從小在工地裡玩耍成長。但隨著生意競爭，家道中落，父親臥病在床之後，兄弟倆的生活大不如前，使得阿祈一直懷念過去美好的時光。阿祈長大後也成為專業的鐵工師傅，但他仍寄望自己能夠靠旁門左道來快速發財。根據前述，《做工的人》的劇情中描述阿祈經歷下列何種社會流動類型？
  options:
  - label: A
    content: 代內向上流動
  - label: B
    content: 代間向下流動
  - label: C
    content: 代間向上流動
  - label: D
    content: 代內向下流動
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 鐵工廠由輝煌時期，到逐漸家道中落，阿祈父親原為鐵工廠老闆，阿祈則為鐵工師傅，屬於「代間向下」流動。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
