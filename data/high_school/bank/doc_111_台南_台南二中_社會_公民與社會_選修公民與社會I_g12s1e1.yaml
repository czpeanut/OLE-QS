  stem: '下表為我國高、低所得家庭 18 ～ 23 歲人口受高等教育比率概況，依表中數據所示，下列解讀何者最為正確？

    | 年度 | 全體家庭 | 18 ～ 23 歲人口受高等教育比率依可支配所得五等分位 |  |  |  |  |

    | --- | --- | --- | --- | --- | --- | --- |

    |  |  | 第一分位組 （最低所得組） | 第二組 | 第三組 | 第四組 | 第五分位組 （最高所得組） |

    | 80 | 31.1 | 23.0 | 26.6 | 29.0 | 30.5 | 36.7 |

    | 85 | 41.6 | 30.8 | 35.1 | 38.3 | 42.7 | 48.2 |

    | 90 | 55.0 | 39.9 | 46.4 | 51.7 | 55.5 | 64.4 |

    | 95 | 67.1 | 57.6 | 58.8 | 63.0 | 67.3 | 76.1 |

    | 100 | 76.3 | 58.8 | 68.7 | 74.1 | 77.9 | 84.0 |

    | 單位：％、資料來源：行政院主計總處家庭收支調查報告 |  |  |  |  |  |  |'
  options:
  - label: A
    content: 社會資本不平等不利於社會階層的流動
  - label: B
    content: 教育資源分配不均將影響高等教育品質
  - label: C
    content: 高等教育擴張有助改善社會階層的複製
  - label: D
    content: 家庭所得分配不均導致文化資本的落差
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
