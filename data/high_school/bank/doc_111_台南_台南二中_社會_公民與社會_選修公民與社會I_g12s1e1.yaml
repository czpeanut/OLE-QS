  stem: 「國語能力是一種語言資本，有利於職業地位的取得。在本質上，語言使用是權力關係的展現，因此語言資本的獲得與分配，本身就是一個不平等的社會階層面向。本文發現：國語在臺灣已經有非常穩固的市場價值。就個人的語言供給來說，國語愈流利的人職業地位愈高。就工作的語言需求而言，使用不同語言的工作在職業地位上有清楚的階序：閩南語的工作領域是一個『壞』的勞動市場，使用國語的工作領域則是一個『好』的勞動市場。」上述內容擷取自國內學者的研究論文，由該內容推測該研究最可能以何種觀點探討社會階層議題？
  options:
  - label: A
    content: 功能論觀點
  - label: B
    content: 衝突論觀點
  - label: C
    content: 種族主義觀點
  - label: D
    content: 符號互動論觀點
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹強調語言使用是權力關係的展現，國語在臺灣具有穩固的市場價值。閩南語的工作領域是一個「壞」的勞動市場，而使用國語的工作領域則是一個「好」的勞動市場，可推斷該內容是探討「符號互動論」。符號包含：語言、文字、表情、肢體等生活上的各式表徵。符號互動論認為：人們透過使用各式符號的互動過程，會慢慢建構出對於符號的共同理解。且符號互動論強調：人們在符號層次的互動過程，「語言」在自我及社會的形成過程中占有重要地位，並主張人們會將習得的各種象徵符號與意義運用於思考能力上。
- id: doc_111_台南_台南二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_20
  section: 1
