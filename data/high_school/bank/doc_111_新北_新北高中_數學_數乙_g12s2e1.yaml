  section: 2
  number: 5
  type: multiple
  page: 3
  stem: 投擲一枚不均勻硬幣，出現正面的機率為$\frac{3}{4}$，出現反面的機率為$\frac{1}{4}$。今擲此硬幣 5 次，若 X 表示出現正面的次數，則下列敘述哪些正確？
  options:
  - label: A
    content: X＝1 的機率為$\frac{15}{512}$
  - label: B
    content: X＝2 的機率小於 X＝3 的機率
  - label: C
    content: X＝3 的機率最大
  - label: D
    content: X 的期望值為$\frac{15}{4}$
  - label: E
    content: X 的標準差為$\frac{\sqrt{15}}{4}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：P（X＝1）＝$C_{1}^{5} \left( \frac{3}{4} \right) ^{1} \left( \frac{1}{4} \right) ^{4}$＝$\frac{15}{1024}$

    (B)○：∵P（X＝2）＝$C_{2}^{5} \left( \frac{3}{4} \right) ^{2} \left( \frac{1}{4} \right) ^{3}$＝$\frac{90}{1024}$

    P（X＝3）＝$C_{3}^{5} \left( \frac{3}{4} \right) ^{3} \left( \frac{1}{4} \right) ^{2}$＝$\frac{270}{1024}$

    ∴P（X＝2）＜P（X＝3）

    (C)╳：P（X＝4）＝$C_{4}^{5} \left( \frac{3}{4} \right) ^{4} \left( \frac{1}{4} \right) ^{1}$＝$\frac{405}{1024}$

    P（X＝5）＝$C_{5}^{5} \left( \frac{3}{4} \right) ^{5} \left( \frac{1}{4} \right) ^{0}$＝$\frac{243}{1024}$

    ∴可知 P（X＝4）為最大

    (D)○：E（X）＝$5\times \frac{3}{4}$＝$\frac{15}{4}$

    (E)○：σ（X）＝$\sqrt{Var( X )}$＝$\sqrt{5\times \frac{3}{4}\times \frac{1}{4}}$＝$\frac{\sqrt{15}}{4}$

    故選(B)(D)(E)'
