    (B)○：Var（X）＝E（$X^{2}$）－〔E（X）〕$^{2}$＝100－$6^{2}$＝64

    (C)╳

    (D)╳：$Var \left( \frac{X}{8}+ 3 \right)$＝$Var \left( \frac{1}{8}X+ 3 \right)$

    ＝$\left( \frac{1}{8} \right) ^{2}Var( X )$＝$\frac{1}{64}\times 64$＝1

    (E)╳：∵Var（－2X＋3）＝（－2）$^{2}$Var（X）＝4×64＝256

    ∴σ（－2X＋3）＝$\sqrt{Var( -2X+ 3 )}$＝$\sqrt{256}$＝16

