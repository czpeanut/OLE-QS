- id: doc_111_新北_新北高中_數學_數乙_g12s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 擲一顆公正的骰子 2 次，令隨機變數 X 表示出現的點數和，則下列哪些正確？
  options:
  - label: A
    content: P（X＝5）＝$\frac{1}{9}$
  - label: B
    content: P（X＝8）＝$\frac{5}{36}$
  - label: C
    content: P（5＜X＜10）＝$\frac{5}{9}$
  - label: D
    content: P（X ≤ 6）＝$\frac{5}{12}$
  - label: E
    content: P（X＞10）＝$\frac{1}{12}$
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：P（X＝5）＝$\left( \frac{1}{6}\times \frac{1}{6} \right) \times 2$＋$\left( \frac{1}{6}\times \frac{1}{6} \right) \times 2$＝$\frac{1}{9}$

    (B)○：P（X＝8）＝$\left( \frac{1}{6}\times \frac{1}{6} \right) \times 2$＋$\left( \frac{1}{6}\times \frac{1}{6} \right) \times 2$＋$\frac{1}{6}\times \frac{1}{6}$＝$\frac{5}{36}$

    (C)○：P（5＜X＜10）＝P（X＝6）＋P（X＝7）＋P（X＝8）＋P（X＝9）

    ＝$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 + \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 +\frac{1}{6}\times \frac{1}{6} \right]$

    ＋$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 + \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 + \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 \right]$

    ＋$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 + \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 +\frac{1}{6}\times \frac{1}{6} \right]$

    ＋$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 + \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 \right]$＝$\frac{5}{9}$

    (D)○：P（X ≤ 6）＝P（X＝2）＋P（X＝3）＋P（X＝4）＋P（X＝5）＋P（X＝6）

    ＝$\left( \frac{1}{6}\times \frac{1}{6} \right)$＋$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 \right]$

    ＋$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 +\frac{1}{6}\times \frac{1}{6} \right]$＋$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 + \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 \right]$

    ＋$\left[ \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 + \left( \frac{1}{6}\times \frac{1}{6} \right) \times 2 +\frac{1}{6}\times \frac{1}{6} \right]$＝$\frac{5}{12}$

    (E)○：P（X＞10）＝P（X＝11）＋P（X＝12）

    ＝$\left( \frac{1}{6}\times \frac{1}{6} \right) \times 2$＋$\left( \frac{1}{6}\times \frac{1}{6} \right)$＝$\frac{1}{12}$

    故選(A)(B)(C)(D)(E)'
