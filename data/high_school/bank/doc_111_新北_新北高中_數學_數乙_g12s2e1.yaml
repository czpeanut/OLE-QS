  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵鋪色區域面積為 2

    ∴$\int_{3}^{5} f ( x )dx$＝－2

    (B)○：$\int_{0}^{5} f ( x )dx$＝$\int_{0}^{3} f ( x )dx+\int_{3}^{5} f ( x )dx$＝4

    $\Rightarrow\int_{0}^{3} f ( x )dx +( -2 )$＝4

    $\Rightarrow\int_{0}^{3} f ( x )dx$＝6

    (C)╳：$\int_{3}^{5} -3f ( x )dx$＝$( -3 ) \int_{3}^{5} f ( x )dx$＝（－3）×（－2）＝6

    (D)○：$\int_{0}^{5} ( f ( x )+ 1 )dx$＝$\int_{0}^{5} f ( x )dx +\int_{0}^{5} 1dx$

    ＝$\left. 4 +x \right| _{0}^{5}$＝9

    (E)╳：∵$\int_{0}^{3} f ( x )dx$＝6 且鋪色區域面積為 2

    ∴函數 f（x）圖形在閉區間 [ 0，5 ] 與 x 軸所圍成區域面積為 6＋2＝8

    故選(B)(D)'
