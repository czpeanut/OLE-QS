  stem: '如右圖是多項式函數 f（x）的圖形在閉區間 [ 0，5 ] 與 x 軸所圍成

    區域，設鋪色部分的面積為 2，且知$\int_{0}^{5} f ( x )dx$＝4，試選出正確

    的選項。'
  options:
  - label: A
    content: $\int_{3}^{5} f ( x )dx$＝2
  - label: B
    content: $\int_{0}^{3} f ( x )dx$＝6
  - label: C
    content: $\int_{3}^{5} -3f ( x )dx$＝－6
  - label: D
    content: $\int_{0}^{5} ( f ( x )+ 1 )dx$＝9
  - label: E
    content: 函數 f（x）圖形在閉區間 [ 0，5 ] 與 x 軸所圍成區域面積為 4
  assets:
  - key: s2_3_f1
    kind: figure
