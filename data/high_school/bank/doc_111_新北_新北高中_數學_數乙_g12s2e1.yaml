  stem: 下列各選項中，哪些隨機變數 X 的機率分布是二項分布？
  options:
  - label: A
    content: 擲 1 枚均勻硬幣 6 次，X 為出現正面的次數
  - label: B
    content: 擲 1 顆公正骰子 6 次，X 為出現點數的總和
  - label: C
    content: 袋中有紅球與白球各 5 顆，從袋中每次取出一球，取後不放回，共取球 5 次，X 為取到紅球的次數
  - label: D
    content: 袋中有紅球與白球各 5 顆，從袋中每次取出一球，取後放回，共取球 5 次，X 為取到紅球的次數
  - label: E
    content: 從 30 位學生中選出 10 人，調查每人對自主學習的表現是否滿意，X 為表示滿意的人數
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵擲 1 枚均勻硬幣，出現正面之機率為$\frac{1}{2}$

    ∴X～B$\left( 6 , \frac{1}{2} \right)$為二項分布

    (D)○：∵從袋中每次取一球，取後放回

    每次可取到紅球的機率為$\frac{1}{2}$

    ∴X～B$\left( 5 , \frac{1}{2} \right)$為二項分布

    故選(A)(D)'
