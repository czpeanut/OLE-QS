  stem: 定積分$\int_{-1}^{1} x ( 4 - 6x )dx$之值為何？
  options:
  - label: A
    content: －4
  - label: B
    content: －2
  - label: C
    content: '0'
    asset:
      key: s1_1_optC
      file: doc_111_新北_新北高中_數學_數乙_g12s2e1/s1_1_optC.png
      crop:
        page: 1
        rect:
        - 475.15
        - 259.55
        - 564.3
        - 325.1
  - label: D
    content: '2'
  - label: E
    content: '4'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{-1}^{1} x ( 4 - 6x )dx$

    ＝$\int_{-1}^{1} ( 4x - 6x^{2} )dx$

    ＝$4\int_{-1}^{1} xdx - 6\int_{-1}^{1} x^{2}dx$

    ＝$\left. 4 \left( \frac{1}{2}x^{2} \right) \right| _{-1}^{1}-\left. 6 \left( \frac{1}{3}x^{3} \right) \right| _{-1}^{1}$

    ＝0－4＝－4

    故選(A)'
