- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 疫情初期，許多人大量採購各項物資囤積於家中。某超市為了阻止民眾過量購買乾洗手液，推出新的規則：「乾洗手液購買1瓶的價格為80元，若購買第2瓶以上，價格則為1,000元」請問該超市運用何種原理減少民眾搶購？
  options:
  - label: A
    content: 提高售價以降低民眾的願付價格
  - label: B
    content: 運用需求法則減少民眾的需求量
  - label: C
    content: 提高民眾的願付價格以減少需求
  - label: D
    content: 消除民眾對供貨不足的預期心理
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 匈牙利詩人裴多菲曾寫下：「生命誠可貴，愛情價更高，若為自由故，兩者皆可拋。」請問，對於裴多菲而言，選擇自由的機會成本為何?
  options:
  - label: A
    content: 零
  - label: B
    content: 生命
  - label: C
    content: 愛情
  - label: D
    content: 生命加愛情
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 附表為某農夫所有的生產組合，該農夫正在思考來年的生產組合該如何配置。請問：下列敘述何者正確？
  options:
