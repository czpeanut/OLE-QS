- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 一名家境窮困的單親菲律賓小男孩，在麥當勞旁的街道上席地而坐，借光苦讀。他的身影被人拍照上傳，引發廣大迴響，各界援助紛紛湧入。假若在外界的幫忙下，小男孩的媽媽買了一部小餐車，並獲得志工擔任助手，他獨立構思了菜單，採買蔬菜、肉品等食材烹煮小吃，再前往合適的地點銷售。請問下列生產要素的配對，何者正確？
  options:
  - label: A
    content: 小男孩媽媽經營小吃事業的心思屬於勞動
  - label: B
    content: 由蔬菜、肉品所烹製的小吃，是自然資源
  - label: C
    content: 志工擔任助手幫忙煮菜，是提供企業家精神
  - label: D
    content: 小餐車屬於人造的生產工具，因此是實體資本
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 小庭於下班時間決定搭UBER回家，用手機app預約叫車後出現如右圖般的畫面。請問，下列敘述何者正確？
  options:
  - label: A
    content: 車資上漲的原因，可能是因為愈來愈多人加入UBER的駕駛者行列所致
  - label: B
    content: 下班時間可能想要搭車通勤的人數眾多，故app上顯示「需求量增加」
  - label: C
    content: 小庭若選搭「精緻優步」，他心中的願付價格較選搭「尊崇優步」者高
  - label: D
    content: 此app的設計者，可能在經濟學的概念上需要調整，應為「需求」提升
