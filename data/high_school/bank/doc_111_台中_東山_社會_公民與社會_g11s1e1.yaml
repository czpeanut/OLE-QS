  section: 1
  number: 19
  type: single
  page: 2
  stem: 義大利是橄欖的主要產地，近年卻出現春熱、夏涼、秋雨多的異常氣候，不僅水患頻傳，更助長病菌和果蠅快速繁殖，導致橄欖價格翻漲。若以橄欖為主原料之橄欖油的需求不變，上述情形可能使橄欖油市場的均衡價量如何變動？
  options:
  - label: A
    content: 價格上升，數量減少
  - label: B
    content: 價格上升，數量增加
  - label: C
    content: 價格下降，數量減少
  - label: D
    content: 價格下降，數量增加
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 阿北提供第1箱蘋果的成本為800元、第2箱為1,000元、第3箱為1,500元，假設市場均衡價格為每箱2,000元，則他提供3箱蘋果的生產者剩餘為多少元？
  options:
  - label: A
    content: 2,000
  - label: B
    content: 2,700
  - label: C
    content: 3,300
