questions:
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某新款智慧型手機上市引起排隊購買潮。若甲心中最高願意支付3,000元託人排隊代買，經與有意代買之乙、丙商討，最後由乙收取甲代買費用1,000元，為甲購得此手機。請問以下敘述何者較為正確？
  options:
  - label: A
    content: 甲對於排隊的願付價格為1,000元
  - label: B
    content: 丙排隊的供給價格高於4,000元
  - label: C
    content: 乙代為排隊的機會成本高於1,000元
  - label: D
    content: 甲排隊的消費者剩餘為2,000元
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 中秋假期，民眾總會購買月餅來應景一下。但有網友指出，於中秋節當天去某大型量販店購買月餅，發現店家以半價優惠求售。此事一出，讓之前以原價購買的網友們抱怨連連，直呼「被騙了！」。若從經濟學的角度來看，有關此事件的推論，下列何者正確？
  options:
  - label: A
    content: 此月餅的所有製作成本，一定等於半價
  - label: B
    content: 月餅廠商的願售價格可能會比半價還低
  - label: C
    content: 中秋節前，民眾對月餅的願付價格較低
  - label: D
    content: 降價求售是為了增加民眾對月餅的需求
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 近日全球疫情緩和，各國邊境逐漸開放，讓民眾可以恢復正常的交通和往來。不過後疫情時代，許多產業也面臨挑戰，讓政府在開放與管制之間躊躇不前。請問疫情緩和後，有關下列各項產業的供需變化何者正確？
  options:
  - label: A
    content: 機場服務人員大舉召工，為了能迅速紓解大量的旅運需求
  - label: B
    content: 民眾大量採買防疫物資，海上貨運的塞港情形將更加嚴重
  - label: C
    content: 民眾為預防確診大量就醫，使醫療資源與耗材的需求增加
  - label: D
    content: 防疫旅館的供給增加，是因為業者看準商機以備不時之需
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 俄羅斯先前宣布將無限期關閉通往德國的天然氣供應管道，試圖透過能源來反擊歐洲的制裁，其中最受到影響的是能源的短缺，已嚴重威脅到許多金屬生產商。包含鋅，鋁等金屬都受到巨大的衝擊，若歐洲沒有即時因應這樣的反制，很可能在各式產業鏈上都會陸續崩壞。根據上述資訊，歐洲再來最可能面臨何種困境？
  options:
  - label: A
    content: 歐洲大陸增加對天然氣的供給，試圖抗衡俄羅斯能源制裁
  - label: B
    content: 歐洲因有充沛的替代能源，因此對於天然氣需求大幅減少
  - label: C
    content: 多家煉鋁廠因生產成本暴增而倒閉，產業供應鏈愈趨蕭條
  - label: D
    content: 金屬品價格因成本飆升而飆漲，民眾對於其需求大幅下降
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年來政府大力推行減塑政策，除使用環保杯購買飲料可享有5至10元的折抵外，臺北市更是預計在12月推動「禁用一次性塑膠杯」政策。若以經濟學的概念來看，此政策對於想喝飲料的民眾，其對於環保杯的需求會造成什麼影響？
  options:
  - label: A
    content: 喝飲料需要購買環保杯，故對環保杯需求下降
  - label: B
    content: 需要購買環保杯才省錢，對環保杯需求量下降
  - label: C
    content: 喝飲料可以更省錢，故對環保杯的需求量上升
  - label: D
    content: 喝飲料需要搭配環保杯，故對環保杯需求上升
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 地理老師的講義上有一張如右圖般的「農業區域專業化過程圖」，呈現原本自給自足的甲、乙兩城，在交通運輸革新促成時空收斂、雙方出現交易活動之後，轉而專業化生產的結果。請問由此可斷定下列何者正確？
  options:
  - label: A
    content: 乙城對豬、米的生產力高於甲城
  - label: B
    content: 乙城具有生產豬、米的比較利益
  - label: C
    content: 甲城具有生產魚、菜的絕對利益
  - label: D
    content: 甲城生產魚的機會成本高於乙城
