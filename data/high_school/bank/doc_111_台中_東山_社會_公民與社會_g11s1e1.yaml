- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 炎炎夏日，民眾喜歡喝檸檬汁和吃挫冰消暑。若民眾多飲用檸檬汁會少吃挫冰；而吃挫冰時多會搭配煉乳。請問，當挫冰價格上漲時，將會產生下列何種變化？
  options:
  - label: A
    content: 挫冰的供給增加
  - label: B
    content: 煉乳的需求下降
  - label: C
    content: 檸檬汁的需求量增加
  - label: D
    content: 挫冰的銷售量增加
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 臺灣在1950年代出口香蕉與鳳梨，1960年代出口雨傘與鞋類，1970年代則出口小型家電，從1980年代至今，則以高科技與石化產品為出口大宗。請問這一連串的改變，表現出一國參與全球經濟活動的何種情形？
  options:
  - label: A
    content: 參與國際分工不利於農業發展
  - label: B
    content: 國際分工的比較利益會變動
  - label: C
    content: 所有權的保障日益完整
  - label: D
    content: 各國經濟更為相互依賴
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 樂透頭獎上看10億，同學們針對此事進行討論。甲：「如果我中了，我要買豪宅。」；乙：「如果我中獎，就可以買超多我最愛的古著衣物，而且無需考慮價格了。」；丙：「你的品味真怪，居然喜歡舊衣服，如果是我，一定要買很多新衣服來展現我的品味。」
  options:
  - label: A
    content: 對甲來說，豪宅屬於季芬財，價格越高，需求量越高
  - label: B
    content: 正常財與劣等財的區分因人而異，沒有絕對的標準
  - label: C
    content: 乙中獎後對古著衣物的需求量會增加
  - label: D
    content: 對丙而言，古著衣物屬於正常財
- id: doc_111_台中_東山_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 右圖為市場經濟活動流程圖。假設因疫情導致消費人潮大減，許多「＿＿＿＿」為了節省人事成本，選擇採行無薪假制度或推動裁員政策，衝擊了「＿＿＿＿」（指某個市場）的需求。請問上述兩個引號中的內容，應該分別對應又途中的何處？
  options:
  - label: A
    content: 乙丁
  - label: B
    content: 丙丁
  - label: C
    content: 甲乙
  - label: D
    content: 甲丙
