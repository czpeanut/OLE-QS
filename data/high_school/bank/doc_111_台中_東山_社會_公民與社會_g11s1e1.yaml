  stem: 英文俗話中常說「An apple a day keeps the doctor away」，指蘋果中富含維生素，每天吃一顆有助於增強抵抗力。請問下列哪個事件會讓蘋果的需求線向右移？
  options:
  - label: A
    content: 氣候適宜使蘋果的產量增加
  - label: B
