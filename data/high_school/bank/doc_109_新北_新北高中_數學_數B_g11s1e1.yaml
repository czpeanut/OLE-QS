- id: doc_109_新北_新北高中_數學_數B_g11s1e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 2
  stem: '設 sinθ＝$-\frac{3}{5}$，且θ為第三象限角，試求下列各值：

    (1) sin（π＋θ）＝＿＿＿＿。

    (2)$\cos \left( \frac{\pi}{2}+\theta \right)$＝＿＿＿＿。'
  answer:
  - (1)$\frac{3}{5}$；(2)$\frac{3}{5}$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) sin（π＋θ）＝－sinθ＝$\frac{3}{5}$

    (2) cos$\left( \frac{\pi}{2}+\theta \right)$＝－sinθ＝$\frac{3}{5}$'
- id: doc_109_新北_新北高中_數學_數B_g11s1e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: '試問：(1)$-\frac{4}{3}$π＝＿＿＿＿度。

    (2) 正五邊形的每一內角是 108°，相當於＿＿＿＿弳。'
  answer:
  - (1)－240；(2)$\frac{3\pi}{5}$
  answer_status: verified
  answer_source: answer_key
  explanation: 'π（弳）＝180°

    (1)$-\frac{4}{3}$π（弳）＝$\left( -\frac{4}{3} \right)$．180°＝－240°

    (2) 108°＝108×$\frac{\pi}{180}$（弳）＝$\frac{3\pi}{5}$（弳）'
