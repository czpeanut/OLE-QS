  section: 1
  number: 18
  type: single
  page: 2
  stem: 房東阿明在家經營網拍，月收入30,000元，如今因故須將房子的其它房間出租，有四個學生分別願意以每個月5,000元、4,500、4,000、3,500元等價格訂定契約。如果阿明以4,000元租給第三位學生，並放棄了原本的網拍工作，則阿明的機會成本是多少？
