- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 所有經濟問題均與資源稀少性有關。下列有關「稀少性」的敘述，何者正確？
  options:
  - label: A
    content: 若資源不具稀少性，我們就不需要買那麼多衣服
  - label: B
    content: 若資源不具稀少性，我們就可以生產各種想要的商品
  - label: C
    content: 因為資源具稀少性，你在吃到飽的火鍋店會不停地吃
  - label: D
    content: 因為資源具稀少性，世界首富也可能買不到棒球賽門票
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 受到網路上流傳的外送員月入10-18萬新聞吸引，上班族小城決定放棄70,000的月收入，花10,000元購買各式裝備投入外送行業，但第一個月每天工時長達13小時，收入卻只有35,000元，且必須自行吸收2000元的油錢及1000元的手機費。請問：小城成為外送員的第一個月，所付出的機會成本為多少？
  options:
  - label: A
    content: 13,000元
  - label: B
    content: 48,000元
  - label: C
    content: 70,000元
  - label: D
    content: 83,000元
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 知名包子店因應過年排隊人潮，除了給出過年加班一天薪水5000元的福利讓員工自願加班外，亦多聘雇5名工讀生以應付年節排隊人潮。請問：此時生產可能線的變化與何種情形相似？
  options:
  - label: A
    content: 餿水油事件爆發後，民眾拒買月餅
  - label: B
    content: 嚴重特殊傳染性肺炎(COVID-19)蔓延全球，民眾搶購口罩
  - label: C
    content: 電動車生產線自動化，提高生產量
  - label: D
    content: 非洲豬瘟爆發，禽類製品銷量增加
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 在廖鴻基的短文《海島》中主角是島村中的魚販、海村中的漁人，無法體會彼此工作難處的他們總是因魚價爭執，有一天島村魚販決定自己投入捕魚工作，海村漁人決定自己投入賣魚工作，但兩人最終以失敗收場。請問：何者可能為兩人生產力之情形？
  options:
  - label: A
    content: 島村魚販具有捕魚之比較利益
  - label: B
    content: 兩個人皆具有賣魚之比較利益
  - label: C
    content: 原本的分工合乎比較利益法則
  - label: D
    content: 海村漁人賣魚是為了比較利益
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 小芸媽媽給了小芸200元買「參考書」，這200元除了用來買參考書之外，小芸的另一個選擇則是買價值200元的「髮夾」並且回去接受「媽媽的責罵」。幾經一番掙扎之後，小芸仍決定照媽媽的意思買了參考書。請問：小芸買書的機會成本為何？
  options:
  - label: A
    content: 只有髮夾
  - label: B
    content: 只有媽媽的責罵
  - label: C
    content: 髮夾與媽媽的責罵
  - label: D
    content: 參考書
