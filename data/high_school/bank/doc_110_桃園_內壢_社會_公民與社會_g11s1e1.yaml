  section: 1
  number: 19
  type: single
  page: 2
  stem: 美美畢業於中文系，本身熱愛文學創作和商業行銷。如果美美去國文補習班上班，年薪40萬元；而寫書的版稅年薪30萬元，而如果去民營公司從事行銷工作則年薪50萬元。請問：如果美美選擇當作家寫書銷售，該行為的機會成本為多少？
