questions:
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某新款智慧型手機上市引起排隊購買潮。若此手機售價為10,000，甲心中最高願意支付3,000元託人排隊代買，經與有意代買之乙、丙商討，最後由乙收取甲代買費用1,000元，為甲購得此手機。請問：以下有關機會成本的設算，何者正確？
  options:
  - label: A
    content: 甲購買此智慧型手機的機會成本為13,000元
  - label: B
    content: 乙為人排隊代買手機之機會成本為2,000元
  - label: C
    content: 丙為人排隊代買手機之機會成本大於4,000元
  - label: D
    content: 甲自己排隊買手機之機會成本至少高於3,000元
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某一時期，英國國王下令關閉修道院，沒收教會財產，將其土地出售給富人，不僅獲得巨大利益，也調整政教關係。請問：如果依據現代法律保障財產的理念，評論該時期英國國王沒收財產的事件，下列評論何者最適當？
  options:
  - label: A
    content: 財產權的保障對象為自然人，教會非屬自然人，不是財產權的保障對象
  - label: B
    content: 英王沒收教會財產，此沒收行為讓英王與教會構成債權債務之法律關係
  - label: C
    content: 基於物權法定主義原則，若國家制定法律，英王可以合法沒收教會財產
  - label: D
    content: 依所有權社會化原則，英王須為公益目的且必要時，才可取得教會財產
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 《民法》親屬編有關婚姻關係中，夫妻間財產分配的制度，下列敘述何者正確？
  options:
  - label: A
    content: 共同財產制夫妻財產得分別管理處分
  - label: B
    content: 採約定財產制在離婚後因財務各自獨立，不會產生財產清算的問題
  - label: C
    content: 夫妻間無約定財產制時依法定財產制
  - label: D
    content: 分別財產制中，夫妻雙方可主張特有財產
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 高中生小筠即將遇到國慶日放假一天，他有以下三個選擇來度過國慶日：(甲)幫家人賣國慶文創商品，可以賺到300元的酬勞；(乙)跟閨蜜一起去烤肉，花費650元；(丙)在家追劇俗女養成日記2。假設小筠是個評量標準只用金錢衡量的人，有關小筠做選擇的機會成本，下列何者正確？
  options:
  - label: A
    content: 選擇乙方案的機會成本是950元
  - label: B
    content: 選擇乙方案與丙方案的機會成本是一樣的
  - label: C
    content: 選擇甲的外顯機會成本是650元
  - label: D
    content: 選擇丙方案的機會成本是350元
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 阿春有500萬元，如果選擇將錢拿去外幣，每年可獲得2萬的利息。如果選擇投資飲料店，需要考慮每個月人事與店租的成本50萬元，但每年可賺1000萬元的營收。請問：阿春選擇開店每年的外顯成本為多少錢？
  options:
  - label: A
    content: 50萬元
  - label: B
    content: 500萬元
  - label: C
    content: 60萬元
  - label: D
    content: 600萬元
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在國外，許多名人會與另一半簽訂「婚前協議書」，約定將來離婚後的財產分配情形。同樣的情形在國内，這樣的「婚前協議書」卻是無效的。依據我國民法的相關規定，下列哪一種說法可解釋「婚前協議書」無效的原因？
  options:
  - label: A
    content: 未結婚即談離婚，婚前協議書違反「結婚以永久共同生活為目標」的善良風俗
  - label: B
    content: 婚前協議書造成一方無法主張剩餘財產差額分配請求權，違反定型化契約規定
  - label: C
    content: 雙方當事人不一定以書面方式約定，與「契約必須有一定型式」的規定相違背
  - label: D
    content: 婚前協議書沒有讓當事人有三十日審閱期間的規定，將嚴重侵害當事人的權益
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 年近四十的嘉玲最近終於要結婚了，於是她在某購物網站上選購一些需要的用品，以下是他購買的商品：(甲)量身訂做的新娘婚紗(乙)婚禮小物(例如小吊飾娃娃或者筷架)(丙)黃金項鍊(丁)新鮮的捧花(戊)喜帖，請問以上那些商品，嘉玲可以主張退貨？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 丁戊
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: Global Mall桃園A19宣布試營運，號稱有百貨最大攀岩館，成功帶動周邊房價的商機，小英於是即刻與該屋主簽定買賣契約，過了五日，小英向該屋主請求房屋過戶時，豈料該屋主居然已經將房屋賣給小武並完成所有權移轉登記。請問：關於上述情形。下列何者最為正確？
  options:
  - label: A
    content: 小英已跟該屋主簽定買賣契約，故房屋所有權應歸屬於小英
  - label: B
    content: 交易市場講求利潤極大化，因此小武當然取得房屋所有權
  - label: C
    content: 所有權因具有優先性，故小武合法取得該屋
  - label: D
    content: 小英沒有購屋成功，也無法請求賠償
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 志明與春嬌育有大花，中花，小花與迷你花四個女孩，一家和樂融融，但好景不常，因為新冠肺炎的感染，春嬌就過世了，隔了幾年志明後娶了寶珠，又生了一子綠葉。某日，志明不幸車禍身亡，留下遺產1800萬。請根據上上描述，回答下列問題：請問志明死亡後，繼承人與應繼分的敘述，何者正確？
  options:
  - label: A
    content: 小花為繼承人，應繼份為360萬元
  - label: B
    content: 迷你花為繼承人，特留分為180萬元
  - label: C
    content: 大花為長姐，可以優先分配較多的遺產
  - label: D
    content: 寶珠的特留分為150萬元
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 承上題，若志明因重男輕女特別疼愛綠葉，特立遺囑將全部財產留給獨子，其繼承關係，下列何者正確？
  options:
  - label: A
    content: 小花可以主張志明去世前一年的房屋贈與為列遺債
  - label: B
    content: 春嬌的孩子可主張當然繼承，先分900萬元
  - label: C
    content: 中花厭倦爭奪家產，決定採概括繼承
  - label: D
    content: 扣除所有人主張的特留分與中花的拋棄繼承，綠葉最後可得到900萬元
