  type: single
  page: 4
  stem: 吳德是位殷實的商人，因長期在外經商無嫁娶，家中僅留有年邁父母與兩個哥哥與一位弟弟，於2019年初不幸因一場車禍喪命，生前留下了900億元之龐大遺產。請問：以我國現行《民法》規定，下列有關於繼承的敘述何者正確？
  options:
  - label: A
    content: 財產將由兄弟三人與父母均分
  - label: B
    content: 若依據法定繼承順位，父母應優先取得繼承權
  - label: C
    content: 若由父母繼承遺產，父母將各取得450億元
  - label: D
    content: 若吳某父母過世後，財產將全數由兄弟代位繼承
  - label: E
    content: 若吳某遺囑書寫全數捐給社會福利機構，父母與兄弟仍可取得特留分的權利
