  stem: 大谷翔平為一高人氣的大聯盟球星，估計在取得自由球員身分後，於年底投入自由球員市場。某東區球隊提出2年2,000萬美元的合約，某西區球隊則提出2年1,500萬美元的合約。請問：大谷翔平選擇加入該西區球隊的機會成本為何？
