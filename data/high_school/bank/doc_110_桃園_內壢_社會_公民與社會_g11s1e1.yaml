  section: 1
  number: 11
  type: calc
  page: 1
  stem: 近年來臺灣南部吹起一陣茶農紛紛轉行種咖啡的風潮，也願意逐漸提升的咖啡豆品質，使其在臺灣的咖啡市場佔有一席之地。假設有一農夫想嘗試逐漸轉行種咖啡，何者可能為其生產可能線？
