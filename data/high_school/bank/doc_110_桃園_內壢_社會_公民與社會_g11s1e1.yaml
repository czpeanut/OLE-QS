  type: single
  page: 4
  stem: 軒宇的房子剛好坐落在他人土地的正中間，每次都只能經由周圍土地外出。結果有天回來，發現整塊土地周圍都被築起圍牆，讓他不得其門而路。他找上地主，地主表示不想要他人隨意進人，而且這是他的土地，他當然可以這樣做。請問：如果從所有權社會化的觀點，會有哪些考量？
  options:
  - label: A
    content: 地主擁有直接支配性，應以土地所有權人優先
  - label: B
    content: 所有權神聖不可侵犯，地主權益不容因此受限
  - label: C
    content: 軒宇進出是必要需求，應與地主權益相互衡平
  - label: D
    content: 即便地主想要蓋圍牆，也應先向政府取得建照
  - label: E
    content: 所有權並非無限上綱，不能以損害他人為目的
- id: doc_110_桃園_內壢_社會_公民與社會_g11s1e1_s3_45
  section: 3
