- id: doc_112_台北_松山_數學_數乙_g12s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 已知函數 f（x）＝$\begin{cases}x^{2}-4x , x\geq 1 \\ px+q , x<1\end{cases}$，若 f（x）在 x＝1 處導數存在，試選出正確的選項。
  options:
  - label: A
    content: f（x）在 x＝1 處連續
  - label: B
    content: p＝－2
  - label: C
    content: q＝1
  - label: D
    content: f（x）在 x＝2 有最小值－4
  - label: E
    content: f（x）在 x＝3 凹口向上
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵f（x）在 x＝1 處導數存在，即 f（x）在 x＝1 可微分

    ∴f（x）在 x＝1 處連續

    (B) ○：f''（x）＝$\begin{cases}2x-4 ,x\geq 1 \\ p ,x<1\end{cases}$

    f''(1)＝－2＝p

    (C) ╳：f(1)＝$1^{2}$－4×1＝（－2）×1＋q ⇒ q＝－1

    (D) ○：當 x$\geq$1 時，f''（x）＝2x－4

    令 2x－4＝0 ⇒ x＝2

    ∴f（x）在 x＝2 時有最小值 f(2)＝－4

    (E) ○：當 x$\geq$1 時，f''（x）＝2x－4，f"（x）＝2

    ∵f"(3)＞0 ∴f（x）在 x＝3 時凹口向上

    故選(A)(B)(D)(E)'
