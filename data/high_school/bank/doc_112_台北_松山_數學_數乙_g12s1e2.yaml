  stem: 如右圖，設三次函數 f（x）圖形的反曲點為（2，2），在 x＝0 時，為函數的極小值。請選出正確的選項。
  options:
  - label: A
    content: f'(0)＝0
  - label: B
    content: f"(0)＝0
  - label: C
    content: f'(2)＞0
  - label: D
    content: f"(2)＞0
  - label: E
    content: f'(4)＞0
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_112_台北_松山_數學_數乙_g12s1e2/s2_2_f1.png
    crop:
      page: 1
      rect:
      - 474.25
      - 688.25
      - 563.9
      - 753.4
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵f''(0)表 x＝0 時之切線斜率 ∴f''(0)＝0

    (B) ╳：∵f（x）為三次函數且（0，0）並非反曲點 ∴f"(0)≠0

    (C) ○：∵f''(2)表 x＝2 時之切線斜率 ∴f''(2)＞0

    (D) ╳：∵（2，2）為反曲點 ∴f"(2)＝0

    (E) ╳：由圖可知，在 x＝4 時，為函數的極大值 ∴f''(4)＝0

    故選(A)(C)'
