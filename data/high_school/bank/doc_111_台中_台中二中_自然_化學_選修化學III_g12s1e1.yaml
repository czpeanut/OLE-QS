  stem: $Ag_{2}CrO_{4}$的$K_{sp}$＝4´$10^{－12}$，AgCl的$K_{sp}$＝$10^{－10}$，一溶液含有0.1 M的$Cl^{－}$及0.01 M的$CrO_{4}^{2－}$，則逐漸滴入濃$AgNO_{3}$溶液，下列各項敘述何者正確？
  options:
  - label: A
    content: 先產生白色沉澱
  - label: B
    content: 剛出現紅色沉澱時[$Ag^{＋}$]＝2´$10^{－5}$ M
  - label: C
    content: 剛出現紅色沉澱時[$Cl^{－}$]＝5´$10^{－6}$ M
  - label: D
    content: 先產生紅色沉澱
  - label: E
    content: 剛出現紅色沉澱時溶液中的$Cl^{－}$剩下原來$Cl^{－}$的5´$10^{－2}$%
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: Q＞$K_{sp}$ → 會沉澱。又AgCl的Q＝[$Ag^{＋}$][$Cl^{－}$]、$Ag_{2}CrO_{4}$的Q＝[$Ag^{＋}$]$^{2}$[$CrO_{4}^{2－}$]，因[$Cl^{－}$]＝0.1 M、[$CrO_{4}^{2－}$]＝0.01 M。則當[$Ag^{＋}$][$Cl^{－}$]＞$10^{－10}$時，即[$Ag^{＋}$]＞$10^{－9}$ M時，AgCl會發生沉澱。另當[$Ag^{＋}$]$^{2}$[$CrO_{4}^{2－}$]＞4×$10^{－12}$，即[$Ag^{＋}$]＞2×$10^{－5}$ M時，$Ag_{2}CrO_{4}$會發生沉澱。故AgCl的白色沉澱會先發生，再來才是$Ag_{2}CrO_{4}$的紅色沉澱。恰好出現紅色沉澱時，因[$Ag^{＋}$]約等於2×$10^{－5}$ M，此時因AgCl已經產生沉澱，故對於AgCl而言，其Q＝$K_{sp}$。則2×$10^{－5}$×[$Cl^{－}$]＝$10^{－10}$，[$Cl^{－}$]＝5×$10^{－6}$，此時剩餘的量為原本的$\frac{5\times 10^{-6}}{0.1}$×100%＝5×$10^{－3}$%。故選(A)(B)(C)。
