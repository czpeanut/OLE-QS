  stem: $N_{2}O_{4}$(g) $\rightleftharpoons2NO_{2}$(g)反應、0℃達到平衡時，[$NO_{2}$]：[$N_{2}O_{4}$]＝1：59， 25℃時，[$NO_{2}$]：[$N_{2}O_{4}$]＝1：1.77，下列何者為正確的敘述？
  options:
  - label: A
    content: 在0℃時K＝$\frac{1}{59}$
  - label: B
    content: 在0℃時K＝59
  - label: C
    content: 在25℃時K＝1.77
  - label: D
    content: 在25℃時K＝$\frac{1}{1.77}$
  - label: E
    content: 以上皆錯
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $K_{c}$＝$\frac{[NO_{2}]^{2}}{[N_{2}O_{4}]}$，但不代表在0℃時，$K_{c}$＝$\frac{1}{59}$、在25℃時，$K_{c}$＝$\frac{1}{1.77}$。原因是題目中給的是兩者的比例，但不是各自的濃度。故答案為(E)。
