  stem: 已知$CaSO_{4}$之$K_{sp}$＝2.0×$10^{－5}$，$SrSO_{4}$之$K_{sp}$＝7.5×$10^{－7}$，今一溶有相同濃度（0.020 M）的$Ca^{2＋}$及$Sr^{2＋}$的溶液中，分別加入等體積而濃度不同的下列各$Na_{2}SO_{4}$水溶液，何者可使溶液中$Sr^{2＋}$發生沉澱而$Ca^{2＋}$不發生沉澱？
  options:
  - label: A
    content: 5.0×$10^{－2}$
  - label: B
    content: 1.0×$10^{－3}$
  - label: C
    content: 1.0×$10^{－4}$
  - label: D
    content: 5.0×$10^{－5}$
  - label: E
    content: 1.0×$10^{－6}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: Q＞$K_{sp}$ → 會沉澱。又$CaSO_{4}$的Q＝[$Ca^{2＋}$][$SO_{4}^{2－}$]、$SrSO_{4}$的Q＝[$Sr^{2＋}$][$SO_{4}^{2－}$]，等體積加入硫酸根後，濃度減半，[$Ca^{2＋}$]＝[$Sr^{2＋}$]＝0.010 M，假設加入的硫酸鈉濃度＝x，則硫酸根濃度在稀釋後變為$\frac{x}{2}$。當Q＞$K_{sp}$，即0.010×$\frac{x}{2}$＞$K_{sp}$，則會發生沉澱。若要使溶液中$Sr^{2＋}$發生沉澱而$Ca^{2＋}$不發生沉澱，即2×$10^{－5}$＞0.010×$\frac{x}{2}$＞7.5×$10^{－7}$，得4×$10^{－3}$＞x＞1.5×$10^{－4}$。故選(B)。
