- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若A＋B$\rightleftharpoons$C，$K_{C}$＝4，2A＋D$\rightleftharpoons$C，$K_{C}$＝6，則C＋D$\rightleftharpoons$2B，$K_{C}$＝？
  options:
  - label: A
    content: '0.38'
  - label: B
    content: '0.67'
  - label: C
    content: '1.5'
  - label: D
    content: '2.7'
  - label: E
    content: 以上皆非
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 式(1)：A＋B ⇌ C，$K_{c}$＝4 式(2)：2A＋D ⇌ C，$K_{c}$＝6 式(2)－式(1)×2可得C＋D ⇌ 2B ⇒ $K_{c}$＝$\frac{6}{4^{2}}$＝$\frac{3}{8}$。故選(A)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 若自固體溶於純水中以達平衡，則下列溶度積之表示法何者<u>錯誤</u>？
  options:
  - label: A
    content: $CH_{3}$COOAg之$K_{sp}$＝[$Ag^{+}$]$^{2}$
  - label: B
    content: $Hg_{2}Cl_{2}$之$K_{sp}$＝[$Cl^{－}$]$^{4}$
  - label: C
    content: $MgNH_{4}PO_{4}$之$K_{sp}$＝[$Mg^{2+}$]$^{3}$
  - label: D
    content: Mg(OH)$_{2}$之$K_{sp}$＝$\frac{1}{2}$[$OH^{－}$]$^{3}$
  - label: E
    content: 以上正確
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $CH_{3}$COOAg ⇌ $CH_{3}COO^{－}$＋$Ag^{＋}$，若解離s，則[$CH_{3}COO^{－}$]＝s、[$Ag^{＋}$]＝s，$K_{sp}$＝[$CH_{3}COO^{－}$][$Ag^{＋}$]＝$s^{2}$＝[$Ag^{＋}$]$^{2}$； (B) $Hg_{2}Cl_{2}$ ⇌ $Hg_{2}^{2＋}$＋$2Cl^{－}$，若解離s，則[$Hg_{2}^{2＋}$]＝s、[$Cl^{－}$]＝2s，$K_{sp}$＝[$Hg_{2}^{2＋}$][$Cl^{－}$]$^{2}$＝$4s^{3}$＝$\frac{1}{2}$[$Cl^{－}$]$^{3}$； (C) $MgNH_{4}PO_{4}$ ⇌ $Mg^{2＋}$＋$NH_{4}^{＋}$＋$PO_{4}^{3－}$，若解離s，則[$Mg^{2＋}$]＝s、[$NH_{4}^{＋}$]＝s、[$PO_{4}^{3－}$]＝s，$K_{sp}$＝[$Mg^{2＋}$][$NH_{4}^{＋}$][$PO_{4}^{3－}$]＝$s^{3}$＝[$Mg^{2＋}$]$^{3}$； (D) Mg(OH)$_{2}$ ⇌ $Mg^{2＋}$＋$2OH^{－}$，若解離s，則[$Mg^{2＋}$]＝s、[$OH^{－}$]＝2s，$K_{sp}$＝[$Mg^{2＋}$][$OH^{－}$]$^{2}$＝$4s^{3}$＝$\frac{1}{2}$[$OH^{－}$]$^{3}$。故選(B)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有關酸鹼學說的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 阿瑞尼斯酸鹼學說認為，鹼是能在水中產生$OH^{－}$者
  - label: B
    content: 在水溶液中布-洛酸鹼學說的酸不一定可以讓石蕊試紙呈現紅色
  - label: C
    content: 布-洛鹼在25℃水中時pH必大於7
  - label: D
    content: 阿瑞尼斯酸鹼學說認為，酸是能在水溶液中可產生$H^{＋}$者
  - label: E
    content: 布-洛酸鹼學說認為在酸鹼反應中，接受質子者為鹼
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)布-洛鹼指的是能接收氫離子的物質，不一定pH＞7。故選(C)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 於25℃時$CaF_{2}$(s)在下列哪一種溶液中之溶解度最小？
  options:
  - label: A
    content: 0.1 M HCl溶液
  - label: B
    content: 0.2 M HCl溶液
  - label: C
    content: 純水
  - label: D
    content: 0.1 M Ca($NO_{3}$)$_{2}$溶液
  - label: E
    content: 0.1 M NaF溶液
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $CaF_{2}$ ⇌ $Ca^{2＋}$＋$2F^{－}$，$K_{sp}$＝[$Ca^{2＋}$][$F^{－}$]$^{2}$，加入$F^{－}$同離子效應最為顯著。故選(E)。
- id: doc_111_台中_台中二中_自然_化學_選修化學III_g12s1e1_s1_5
