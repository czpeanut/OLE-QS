- id: doc_111_高雄_鳳山_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設△ABC 為直角三角形，已知 0°＜∠A＜45°，∠C＝90°，且兩內角 A，B 滿足 cosA cosB＋sinA sinB＋sinA cosA＝$\frac{6}{5}$，則 tanA 之值為何？
  options:
  - label: A
    content: '0'
  - label: B
    content: $\frac{1}{2}$
  - label: C
    content: $\frac{3}{5}$
  - label: D
    content: '1'
  - label: E
    content: $\frac{6}{5}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '∠C＝90°$\Rightarrow$∠A＋∠B＝90°$\Rightarrow$∠B＝90°－∠A

    $\Rightarrow$cosB＝cos（90°－∠A）＝sinA，sinB＝sin（90°－∠A）＝cosA

    ∴$\frac{6}{5}$＝cosA <u>cosB</u>＋sinA <u>sinB</u>＋sinA cosA

    ＝cosA <u>sinA</u>＋sinA <u>cosA</u>＋sinA cosA

    ＝3 sinA cosA

    $\Rightarrow$sinA cosA＝$\frac{2}{5}\Rightarrow$2 sinA cosA＝$\frac{4}{5}\Rightarrow$sin2A＝$\frac{4}{5}$

    ∵0°＜∠A＜45°$\Rightarrow$0°＜2∠A＜90°

    ∴cos2A＝$\frac{3}{5}\Rightarrow$tan2A＝$\frac{\sin 2A}{\cos 2A}$＝$\frac{\frac{4}{5}}{\frac{3}{5}}$＝$\frac{4}{3}$

    $\Rightarrow\frac{4}{3}$＝$\frac{2\tan A}{1 - \tan ^{2}A}$

    $\Rightarrow$2－2 $tan^{2}$A＝3 tanA

    $\Rightarrow$2 $tan^{2}$A＋3 tanA－2＝0

    $\Rightarrow$（2 tanA－1）（tanA＋2）＝0

    $\Rightarrow$tanA＝$\frac{1}{2}$或－2（不合）

    $\Rightarrow$tanA＝$\frac{1}{2}$，故選(B)'
