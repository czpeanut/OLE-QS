  type: fill
  page: 2
  stem: 設α為銳角，若$\cos \left( \alpha + \frac{\pi}{6} \right)$＝$\frac{4}{5}$，則$\sin \left( 2\alpha + \frac{\pi}{12} \right)$的值為＿＿＿＿。
  answer:
  - $\frac{17\sqrt{2}}{50}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\cos \left( \alpha + \frac{\pi}{6} \right)$＝$\frac{4}{5}$＞0，又 0＜α＜$\frac{\pi}{2}\Rightarrow\frac{\pi}{6}$＜$\alpha + \frac{\pi}{6}$＜$\frac{2\pi}{3}$

    ∴$\frac{\pi}{6}$＜$\alpha + \frac{\pi}{6}$＜$\frac{\pi}{2}\Rightarrow\frac{\pi}{3}$＜$2\left( \alpha + \frac{\pi}{6} \right)$＜π

    $\cos \left[ 2\left( \alpha + \frac{\pi}{6} \right) \right]$＝$2\cos ^{2}\left( \alpha + \frac{\pi}{6} \right) - 1$＝$2 \times \left( \frac{4}{5} \right) ^{2} - 1$＝$\frac{7}{25}$＞0

    ∴$\frac{\pi}{3}$＜$2\left( \alpha + \frac{\pi}{6} \right)$＜$\frac{\pi}{2}\Rightarrow2\left( \alpha + \frac{\pi}{6} \right)$為第一象限角

    ∴$\sin \left[ 2\left( \alpha + \frac{\pi}{6} \right) \right]$＝$\sqrt{1 - \cos ^{2}\left[ 2\left( \alpha + \frac{\pi}{6} \right) \right]}$

    ＝$\sqrt{1 - \left( \frac{7}{25} \right) ^{2}}$＝$\frac{24}{25}$

    ∴$\sin \left( 2\alpha + \frac{\pi}{12} \right)$＝$\sin \left[ 2\left( \alpha + \frac{\pi}{6} \right) - \frac{3\pi}{12} \right]$

    ＝$\sin \left[ 2\left( \alpha + \frac{\pi}{6} \right) \right] \cos \frac{\pi}{4} - \cos \left[ 2\left( \alpha + \frac{\pi}{6} \right) \right] \sin \frac{\pi}{4}$

    ＝$\frac{24}{25} \times \frac{\sqrt{2}}{2} - \frac{7}{25} \times \frac{\sqrt{2}}{2}$

    ＝$\frac{17\sqrt{2}}{50}$'
