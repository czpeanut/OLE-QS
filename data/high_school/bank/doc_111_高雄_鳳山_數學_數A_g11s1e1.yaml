  type: multiple
  page: 2
  stem: 右圖可以是下列哪些函數的部分圖形？
  options:
  - label: A
    content: y＝$\sin \left( x - \frac{3\pi}{4} \right)$
  - label: B
    content: y＝$\sin \left( x + \frac{3\pi}{4} \right)$
  - label: C
    content: y＝$\sin \left( x + \frac{5\pi}{4} \right)$
  - label: D
    content: y＝$\cos \left( x - \frac{5\pi}{4} \right)$
  - label: E
    content: y＝$\cos \left( 2x + \frac{3\pi}{4} \right)$
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_111_高雄_鳳山_數學_數A_g11s1e1/s2_2_f1.png
    crop:
      page: 2
      rect:
      - 388.1
      - 324.6
      - 564.3
      - 397.5
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：圖形表示由 y＝sinx $\xrightarrow[\frac{3\pi}{4} 單位]{向右平移}$ y＝$\sin \left( x - \frac{3\pi}{4} \right)$

    (B)╳：y＝$\sin \left( x + \frac{3\pi}{4} \right)$代表由 y＝sinx 向左平移$\frac{3\pi}{4}$單位所形成的圖形

    (C)○：由(A) y＝$\sin \left( x - \frac{3\pi}{4} \right)$＝$\sin \left[ \left( x - \frac{3\pi}{4} \right) + 2\pi \right]$＝$\sin \left( x + \frac{5\pi}{4} \right)$

    (D)○：由(A) y＝$\sin \left( x - \frac{3\pi}{4} \right)$＝$\cos \left[ \frac{\pi}{2} - \left( x - \frac{3\pi}{4} \right) \right]$＝$\cos \left( \frac{5\pi}{4} - x \right)$＝$\cos \left( x - \frac{5\pi}{4} \right)$

    (E)╳：y＝$\cos \left( 2x + \frac{3\pi}{4} \right)$的週期為$\frac{2\pi}{│ 2 │}$＝π與圖形中的週期 2π不同

    故選(A)(C)(D)'
