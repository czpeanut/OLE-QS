  answer_status: verified
  answer_source: answer_key
  explanation: '$(123 - 22\sqrt{2})\pi$＝$\frac{1}{2} \cdot r^{2} \cdot \theta$＝$\frac{1}{2} \cdot r^{2} \cdot \frac{\pi}{2}$

    $\Rightarrowr^{2}$＝$4 \times (123 - 22\sqrt{2})$＝$492 - 88\sqrt{2}\approx$492－88×1.414＝367.568

    ∵$19^{2}$＝361，$20^{2}$＝400

    ∴r 之值最接近 19，故選(D)'
