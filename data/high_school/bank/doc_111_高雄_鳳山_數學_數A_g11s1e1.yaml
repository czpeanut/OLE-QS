- id: doc_111_高雄_鳳山_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 若坐標平面上，有一標準位置角θ，其終邊上有一點為 P（x，－8），且 tanθ＝$\frac{24}{7}$，請選出正確的選項。
  options:
  - label: A
    content: x＝$- \frac{3}{7}$
  - label: B
    content: $\sin \theta$＝$- \frac{24}{25}$
  - label: C
    content: $\sin \frac{\theta}{2}$＝$\frac{4}{5}$
  - label: D
    content: $\sin 2\theta$＝$\frac{336}{625}$
  - label: E
    content: $\sin \frac{\theta}{2}+\cos \frac{\theta}{2}$＝$\frac{1}{5}$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵O（0，0），P（x，－8），tanθ＝$\frac{24}{7}$＝$\frac{- 8}{x}$

    ∴24x＝－56$\Rightarrow$x＝$- \frac{7}{3}$

    (B)○：∵r＝$\overline{OP}$＝$\sqrt{x^{2} + 8^{2}}$＝$\sqrt{\left( - \frac{7}{3} \right) ^{2} + \left( \frac{24}{3} \right) ^{2}}$＝$\frac{25}{3}$

    ∴$\sin \theta$＝$\frac{y}{r}$＝$\frac{- 8}{\frac{25}{3}}$＝$- \frac{24}{25}$

    (C)╳：∵cosθ＝$\frac{x}{r}$＝$\frac{- \frac{7}{3}}{\frac{25}{3}}$＝$- \frac{7}{25}$，$\sin \theta$＝$- \frac{24}{25}$

    ∴360°n＋180°＜θ＜360°n＋270°，n 為正整數

    ∴180°n＋90°＜$\frac{\theta}{2}$＜180°n＋135°

    若 n＝0，則 90°＜$\frac{\theta}{2}$＜135°

    ∴$\sin \frac{\theta}{2}$＝$\sqrt{\frac{1 - \cos \theta}{2}}$＝$\sqrt{\frac{1 - \left( - \frac{7}{25} \right)}{2}}$＝$\sqrt{\frac{16}{25}}$＝$\frac{4}{5}$

    若 n＝1，則 270°＜$\frac{\theta}{2}$＜315°

    ∴$\sin \frac{\theta}{2}$＝$- \sqrt{\frac{1 - \cos \theta}{2}}$＝$- \sqrt{\frac{1 - \left( - \frac{7}{25} \right)}{2}}$＝$- \sqrt{\frac{16}{25}}$＝$- \frac{4}{5}$

    (D)○：∵sin2θ＝$2\sin \theta \cos \theta$＝$2 \times \left( - \frac{24}{25} \right) \times \left( - \frac{7}{25} \right)$＝$\frac{336}{625}$

    (E)╳：若$\frac{\theta}{2}$為第二象限角，則$\sin \frac{\theta}{2}$＝$\frac{4}{5}$，$\cos \frac{\theta}{2}$＝$- \frac{3}{5}\Rightarrow\sin \frac{\theta}{2} + \cos \frac{\theta}{2}$＝$\frac{4}{5} + \left( - \frac{3}{5} \right)$＝$\frac{1}{5}$

    若$\frac{\theta}{2}$為第四象限角，則$\sin \frac{\theta}{2}$＝$- \frac{4}{5}$，$\cos \frac{\theta}{2}$＝$\frac{3}{5}\Rightarrow\sin \frac{\theta}{2} + \cos \frac{\theta}{2}$＝$\left( - \frac{4}{5} \right) + \frac{3}{5}$＝$- \frac{1}{5}$

    故選(B)(D)'
