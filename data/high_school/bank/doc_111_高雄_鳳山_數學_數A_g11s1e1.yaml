    ∵對稱軸為 x＝$\frac{\pi}{4}$

    ∴將 x＝$\frac{\pi}{4}$代入$\Rightarrowa\sin \frac{\pi}{4}-b\cos \frac{\pi}{4}$＝$\pm \sqrt{a^{2} + b^{2}}$

    $\Rightarrowa \cdot \frac{1}{\sqrt{2}} - b \cdot \frac{1}{\sqrt{2}}$＝$\pm \sqrt{a^{2} + b^{2}}$

