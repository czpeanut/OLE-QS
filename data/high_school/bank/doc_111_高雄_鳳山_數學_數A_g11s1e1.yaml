  stem: 設 a＝sin（2.7π），則下列哪一個選項是正確的？
  options:
  - label: A
    content: －1＜a$\leq- \frac{\sqrt{3}}{2}$
  - label: B
    content: $- \frac{\sqrt{3}}{2}$＜a$\leq$0
  - label: C
    content: 0＜a$\leq\frac{1}{2}$
  - label: D
    content: $\frac{1}{2}$＜a$\leq\frac{\sqrt{3}}{2}$
  - label: E
    content: $\frac{\sqrt{3}}{2}$＜a$\leq$1
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＝sin（2.7π）＝sin（2.7π－2π）

    ＝sin（0.7π）＝sin（0.7×180°）

    ＝sin126°＝sin（180°－54°）

    ＝sin54°

    ∵sin30°＜sin54°＜sin60°

    ∴$\frac{1}{2}$＜a$\leq\frac{\sqrt{3}}{2}$，故選(D)'
