  explanation: '$\begin{cases}L_{1} : x - 2y + 3 = 0 \\ L_{2} : 2x - y - 2 = 0\end{cases}\Rightarrow\begin{cases}L_{1} : y = \frac{1}{2}x + \frac{3}{2} \\ L_{2} : y = 2x - 2\end{cases}$

