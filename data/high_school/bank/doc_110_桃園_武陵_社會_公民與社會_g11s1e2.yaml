  section: 1
  number: 13
  type: single
  page: 2
  stem: 行政院環境保護署已於今年10月預告修正「溫室氣體減量及管理法」為「氣候變遷因應法」，除將2050淨零排放目標入法外，本次增訂對國内排放源、 高碳含量進口產品徵收碳費，以維持台灣產業競争力，並強化排放管制，及執行溫室氣體减量措施者核予減量額度等。環保署說，草案中並新增徵收碳費規定，分階段實施，碳費徵收所得則專款專用於減碳工作，同時配合抵換額度交易，健全碳定價制度，也已規劃鼓勵產業進行自願減量。請問碳費政策可能之目的為何？
