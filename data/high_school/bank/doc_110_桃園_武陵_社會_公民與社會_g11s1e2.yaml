  stem: 歐盟制定減少排放溫室氣體的「碳排放貿易制度」，限制企業的二氧化碳排放量，讓企業減少排放量。假若企業的排放量低於規定的配額，則可儲存或售出；若排放量高於規定的配額，就會遭受罰款，或是得購買其他企業未達配額的排放量。此制度已經讓許多企業願意研發環保技術以降低生產成本。請問歐盟此一制度是採取哪一種做法來處理企業所產生的外部成本？
