  - label: C
    content: 澎湖的地價因離島博奕條例之施行而急揚；但公投沒過使得地價下滑
  - label: D
    content: 研究指出蒜頭有益健康影響消費者偏好使得蒜價高漲；農民因此搶種蒜頭，價格回跌
