  stem: 新冠肺炎蔓延全球，引起各國關注，並建立防範機制。國內口罩因需求增加造成價格上揚，引發社會議論，政府因此協調廠商緊急調度資源，24小時生產線不停工，供給增加才使得口罩價格回穩。下列何者價格上升而後回跌的供需變動原因與上述口罩的例子一樣？
