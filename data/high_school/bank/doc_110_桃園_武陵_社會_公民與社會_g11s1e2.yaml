  stem: 下列敘述何者最可能是醫材價格上限政策所導致的正面或負面效果？
  options:
  - label: A
    content: 依照使用者付費精神，價格上限政策不會影響廠商提供的品質
  - label: B
    content: 價格上限政策實施後，醫材價格太高，民眾不願選擇自付醫材
  - label: C
    content: 政府介入干預自費醫材價格起因是為了保障廠商能賺到錢
  - label: D
    content: 政府決策過程不夠周延，未充分和醫界溝通，醫材價格上限過於粗略
  group_stem: ◎2020年健保署6月8日公告將對健保自付差額醫材制定價格上限，原定8月上路，然而公告一出，引發醫界強力反彈。衛福部長陳時中6月13日緊急滅火，決定先溝通、暫緩實施。7月24日，健保署宣布廢止價格上限計畫，政策提出前後為期不到兩個月。 關於健保自付差額醫材制定價格上限政策細節如下： 首先，醫療器材依給付方式分為3種：1.全自費：健保不給付任何費用，價格由各院所自定，民眾須負擔所有費用。2.健保全額給付：健保核定價格並負擔所有費用，民眾使用此種醫材不須付任何費用。3.健保差額給付：部分醫材價格高昂，健保僅給付部分費用，差額由民眾自行負擔。 其中8大類自付差額醫材中，使用人數最多的品項是「人工水晶體」，去年約有9萬人次使用。價差最大的是「生物組織心臟瓣膜」中的「無縫線整組瓣膜」，醫療院所收費從26萬元到42萬元，價差高達16萬元。若以健保署原定價格上限來看，受影響最大者是「人工髖關節」，最多需降價13萬元。由此可見，原定政策若上路，對病患、醫療院所，以及整個醫材市場影響廣泛。下表為支持和反對此項政策的論點： 雖然衛福部收回成命，不對健保自付差額特材訂定收費上限，但還有許多問題未解決，例如多高的價格才算是極端值？健保署要不要管、怎麼管理收取極端值的醫療院所？改版後的比價網是否便於民眾運用及理解，需要國人持續關注。
