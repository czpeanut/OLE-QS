  - label: A
    content: 提供廠商經濟誘因，研發減少碳排放量的生產科技，以增加生產成本
  - label: B
    content: 政府為鼓勵致力於改良汙染生產設備的廠商，可以退税方式給予補貼
  - label: C
    content: 為解決經濟成長帶來的外部效果：將外部成本內部化，減少環境汙染
  - label: D
    content: 從汙染者身上取到的稅收，可用來提高國內薪水階級民眾的稅賦負擔
