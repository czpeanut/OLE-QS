  stem: 設 0°$\leq$θ$\leq$180°，且 sinθ－cosθ＝$\sqrt{2}\sin 2022^{^{\circ}}$，則 θ＝＿＿＿＿度。
  explanation: 'sin2022°＝sin（2022°－360°×5）＝sin222°＝sin（180°＋42°）＝－sin42°

    $\Rightarrow$sinθ－cosθ＝$\sqrt{2} (- \sin 42^{^{\circ}})$

    $\Rightarrow\sin \theta \times \frac{1}{\sqrt{2}} - \cos \theta \times \frac{1}{\sqrt{2}}$＝sin（－42°）

    $\Rightarrow$sinθcos45°－cosθsin45°＝sin（－42°）

    $\Rightarrow$sin（θ－45°）＝sin（－42°）

    ∵0°$\leq$θ$\leq$180°

    $\Rightarrow$θ－45°＝－42°

    $\Rightarrow$θ＝3°'
