- id: doc_111_台中_興大附中_數學_數A_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列選項中，哪一個的值最小？
  options:
  - label: A
    content: 2 sin20° cos20°
  - label: B
    content: $cos^{2}$35°－$sin^{2}$35°
  - label: C
    content: 2 $cos^{2}$40°－1
  - label: D
    content: 2 $sin^{2}$70°－1
  - label: E
    content: $\frac{2\tan 25^{^{\circ}}}{1 - \tan ^{2}25^{^{\circ}}}$
  explanation: '(A) 2 sin20°cos20°＝sin（2×20°）＝sin40°＜1

    (B) $cos^{2}$35°－$sin^{2}$35°＝cos（2×35°）＝cos70°＝sin20°＜1

    (C) 2 $cos^{2}$40°－1＝cos（2×40°）＝cos80°＝sin10°＜1

    (D) 2 $sin^{2}$70°－1＝－（1－2 $sin^{2}$70°）＝－cos（2×70°）

    ＝－cos（90°＋50°）＝－（－sin50°）

    ＝sin50°＜1

    (E)$\frac{2\tan 25^{^{\circ}}}{1 - \tan ^{2}25^{^{\circ}}}$＝tan（2×25°）＝tan50°＞tan45°＝1

    因此，最小的值為 sin10°，故選(C)'
- id: doc_111_台中_興大附中_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設θ$_{1}$，θ$_{2}$，θ$_{3}$，θ$_{4}$ 分別為第一、二、三、四象限角，且都介於 0 與 2π之間。已知｜sinθ$_{1}$｜＝｜sinθ$_{2}$｜＝｜sinθ$_{3}$｜＝｜sinθ$_{4}$｜＝$\frac{3}{4}$，請問下列哪些選項是正確的？
  options:
  - label: A
    content: θ$_{1}$＞$\frac{\pi}{4}$
  - label: B
    content: θ$_{1}$＋θ$_{2}$＝π
  - label: C
    content: cosθ$_{2}$＝$- \frac{\sqrt{7}}{4}$
  - label: D
    content: sinθ$_{3}$＝$\frac{3}{4}$
  - label: E
    content: cosθ$_{4}$＝$- \frac{\sqrt{7}}{4}$
  explanation: '(A)○：∵θ$_{1}$ 為第一象限角

    ∴sinθ$_{1}$＞0

    又｜sinθ$_{1}$｜＝$\frac{3}{4}$

    $\Rightarrow$sinθ$_{1}$＝$\frac{3}{4}$＞$\frac{\sqrt{2}}{2}$＝$\sin \frac{\pi}{4}$

    $\Rightarrow$θ$_{1}$＞$\frac{\pi}{4}$

    (B)○：θ$_{2}$ 為第二象限角，又｜sinθ$_{2}$｜＝$\frac{3}{4}$

    $\Rightarrow\frac{3}{4}$＝sinθ$_{2}$＝sinθ$_{1}$

    $\Rightarrow$θ$_{1}$＋θ$_{2}$＝π

    (C)○：承(B)，cosθ$_{2}$＝$- \sqrt{1 - \sin ^{2}\theta _{2}}$＝$- \sqrt{1 - \left( \frac{3}{4} \right) ^{2}}$＝$- \sqrt{1 - \frac{9}{16}}$＝$- \sqrt{\frac{7}{16}}$＝$- \frac{\sqrt{7}}{4}$

    (D)╳：θ$_{3}$ 為第三象限角，又｜sinθ$_{3}$｜＝$\frac{3}{4}$

    $\Rightarrow$sinθ$_{3}$＝$- \frac{3}{4}$

    (E)╳：∵θ$_{4}$ 為第四象限角

    ∴cosθ$_{4}$＝$\sqrt{1 - \sin ^{2}\theta _{4}}$＝$\sqrt{1 - \left( - \frac{3}{4} \right) ^{2}}$＝$\sqrt{1 - \frac{9}{16}}$＝$\sqrt{\frac{7}{16}}$＝$\frac{\sqrt{7}}{4}$

    故選(A)(B)(C)'
- id: doc_111_台中_興大附中_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 如右圖為函數 f（x）＝a sin（bx＋c）＋d 的部分圖形，其中 a，b＞0，0$\leq$c$\leq$π，下列各選項哪些正確？
  options:
  - label: A
    content: 週期為π
  - label: B
    content: a＋b＝$2 + \sqrt{2}$
  - label: C
    content: c＝$\frac{\pi}{8}$
  - label: D
    content: d＝1
  - label: E
    content: f（x）亦可表為 a cos（bx－c）＋d
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_111_台中_興大附中_數學_數A_g11s1e1/s2_2_f1.png
    crop:
      page: 2
      rect:
      - 455.85
      - 50.85
      - 564.25
      - 141.25
  explanation: '(A)○：週期為$2\left( \frac{5\pi}{8} - \frac{\pi}{8} \right)$＝$2 \times \frac{4\pi}{8}$＝π

    (B)○：－1$\leq$sin（bx＋c）$\leq$1

    $\Rightarrow\begin{cases}a \times 1 + d = 1 + \sqrt{2} \ldots \ldots \ldots \ldots \ldots ① \\ a \times (- 1) + d = 1 - \sqrt{2}\ldots \ldots \ldots ②\end{cases}$

    由①＋②得 2d＝2$\Rightarrow$d＝1

    由①－②得 2a＝$2\sqrt{2}\Rightarrow$a＝$\sqrt{2}$

    又週期為π＝$\frac{2\pi}{│ b │}$＝$\frac{2\pi}{b}$

    ∴b＝2

    故 a＋b＝$2 + \sqrt{2}$

    (C)╳：∵f（x）＝$\sqrt{2}\sin (2x + c) + 1$，將 x＝$\frac{\pi}{8}$代入得$\sqrt{2}\sin \left( 2 \cdot \frac{\pi}{8} + c \right) + 1$＝$1 + \sqrt{2}$

    $\Rightarrow\sin \left( \frac{\pi}{4} + c \right)$＝1＝$\sin \frac{2\pi}{4}$

    $\Rightarrow$c＝$\frac{\pi}{4}$

    (D)○：由(B)知 d＝1

    (E)○：f（x）＝$\sqrt{2}\sin \left( 2x + \frac{\pi}{4} \right) + 1$＝$\sqrt{2}\cos \left[ \frac{\pi}{2} - \left( 2x + \frac{\pi}{4} \right) \right] + 1$

    ＝$\sqrt{2}\cos \left( - 2x + \frac{\pi}{4} \right) + 1$＝$\sqrt{2}\cos \left( 2x - \frac{\pi}{4} \right) + 1$

    ＝a cos（bx－c）＋d

    故選(A)(B)(D)(E)'
- id: doc_111_台中_興大附中_數學_數A_g11s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 下列哪些選項的值等於$\frac{1}{2}$？
  options:
  - label: A
    content: 2 sin75° cos75°
  - label: B
    content: sin17° cos103°＋cos17° sin103°
  - label: C
    content: $\frac{1}{\sqrt{2}}(\cos 15^{^{\circ}} - \cos 75^{^{\circ}})$
  - label: D
    content: $\sqrt{\frac{1 - \cos 420^{^{\circ}}}{2}}$
  - label: E
    content: 1－2 $cos^{2}$150°
  explanation: '(A)○：2 sin75° cos75°＝sin（2×75°）＝sin150°＝sin（180°－30°）＝sin30°＝$\frac{1}{2}$

    (B)╳：sin17° cos103°＋cos17° sin103°＝sin（17°＋103°）＝sin120°＝sin60°＝$\frac{\sqrt{3}}{2}$

    (C)○：$\frac{1}{\sqrt{2}}(\cos 15^{^{\circ}} - \cos 75^{^{\circ}})$＝$\sin 75^{^{\circ}} \times \frac{1}{\sqrt{2}} - \cos 75^{^{\circ}} \times \frac{1}{\sqrt{2}}$

    ＝sin75° cos45°－cos75° sin45°

    ＝sin（75°－45°）＝sin30°

    ＝$\frac{1}{2}$

    (D)○：$\sqrt{\frac{1 - \cos 420^{^{\circ}}}{2}}$＝$\sqrt{\frac{1 - (1 - 2\sin ^{2}210^{^{\circ}})}{2}}$＝$\sqrt{\sin ^{2}210^{^{\circ}}}$

    ＝｜sin210°｜＝｜sin（180°＋30°）｜

    ＝｜－sin30°｜＝$\frac{1}{2}$

    (E)╳：1－2 $cos^{2}$150°＝1－2 $cos^{2}$30°＝$1 - 2 \times \left( \frac{\sqrt{3}}{2} \right) ^{2}$＝$1 - 2 \times \frac{3}{4}$＝$- \frac{1}{2}$

    故選(A)(C)(D)'
