  stem: 設$- \frac{\pi}{2}\leq$x$\leq\frac{\pi}{2}$，$\frac{3\pi}{2}\leq$y$\leq\frac{5\pi}{2}$且 sinx cosy＝$- \frac{1}{4}$，cosx siny＝$- \frac{3}{4}$，則 x＋y 為＿＿＿＿。
  explanation: '∵$- \frac{\pi}{2}\leq$x$\leq\frac{\pi}{2}$，$\frac{3\pi}{2}\leq$y$\leq\frac{5\pi}{2}\Rightarrow- \frac{\pi}{2} + \frac{3\pi}{2}\leq$x＋y$\leq\frac{\pi}{2} + \frac{5\pi}{2}\Rightarrow$π$\leq$x＋y$\leq$3π

    ∵sin（x＋y）＝sinx cosy＋cosx siny＝$- \frac{1}{4} + \left( - \frac{3}{4} \right)$＝－1$\Rightarrow$x＋y＝$\frac{3\pi}{2}$'
- id: doc_111_台中_興大附中_數學_數A_g11s1e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 試求方程式 sinx＋cos2x＝0 在π＜x＜3π的範圍中的所有實根和為＿＿＿＿。
  explanation: 'sinx＋cos2x＝sinx＋（1－2 $sin^{2}$x）＝0$\Rightarrow$2 $sin^{2}$x－sinx－1＝0

    $\Rightarrow$（2 sinx＋1）（sinx－1）＝0

    $\Rightarrow$sinx＝$- \frac{1}{2}$或 sinx＝1

    又π＜x＜3π

    ∴x＝$\frac{7\pi}{6}$，$\frac{11\pi}{6}$或 x＝$\frac{5\pi}{2}$ ∴實根和為$\frac{7\pi}{6} + \frac{11\pi}{6} + \frac{5\pi}{2}$＝$3\pi + \frac{5\pi}{2}$＝$\frac{11\pi}{2}$'
