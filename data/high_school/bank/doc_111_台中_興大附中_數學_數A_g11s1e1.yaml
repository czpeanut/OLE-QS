  stem: 已知 a＝sin5，試選出正確的選項。
  options:
  - label: A
    content: －1＜a＜$- \frac{1}{2}$
  - label: B
    content: $- \frac{1}{2}$＜a＜0
  - label: C
    content: 0＜a＜$\frac{1}{2}$
  - label: D
    content: $\frac{1}{2}$＜a＜$\frac{\sqrt{2}}{2}$
  - label: E
    content: $\frac{\sqrt{2}}{2}$＜a＜1
  explanation: 'a＝sin5$\approx$sin（5×57.3°）＝sin286.5°＝sin（360°－73.5°）＝－sin73.5°

    sin30°＜sin73.5°＜sin90°

    $\Rightarrow\frac{1}{2}$＜sin73.5°＜1

    $\Rightarrow- \frac{1}{2}$＞－sin73.5°＞－1

    $\Rightarrow$－1＜a＜$- \frac{1}{2}$

    故選(A)'
