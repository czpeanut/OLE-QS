  stem: 假定有許多勞工團體對於《勞動基準法》的部分修正條文不滿，認為其損害勞工權益，進而發起公投要求廢除新修訂的相關條文；有某勞工團體主張，新法涉及 60 多萬的外籍移工福祉，他們也應有參與公投的權利，不應被排除在外。該團體認為，任何《勞基法》的規定都是不分國籍直接衝擊所有的勞動者，雖然目前法律還不允許外籍人士參加公投，但可藉此項呼籲行動讓政府、社會大眾看見移工的意見，而且歐盟各國已有先例，允許非國籍人士擁有部分參政權。下列哪項說法最能詮釋上述勞工團體的主張？
  options:
  - label: A
    content: 各國應該不分國籍族群，讓人們享有相同的參政權以發展全球公民意識
  - label: B
    content: 我國政府對重要國際人權公約內容已經進行國內法制化，應當積極落實
  - label: C
    content: 公民投票具有直接民主和主權在民的實踐意義，全體住民皆有參與權利
  - label: D
    content: 權益受到新政策制訂影響的人們，均應能夠享有參與制訂該政策的權利
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)參政權應屬於具國籍者之公民擁有。(B)聯合國九大公約目前僅國內法化六個公約，並非全部皆國內法制化。(C)投票權應屬於具國籍者之公民擁有。
