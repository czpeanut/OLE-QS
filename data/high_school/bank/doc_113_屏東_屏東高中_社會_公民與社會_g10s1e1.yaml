  stem: 依照目前臺海兩岸的現況，對我國而言，出現領土與統治權的落差。按我國現行的《憲法》、《憲法增修條文》等相關大法，以下敘述何者正確？
  options:
  - label: A
    content: 我國目前主權所及地區，《憲法》上稱為「中華民國自由地區」
  - label: B
    content: 我國目前統治權所及地區，僅限於中華民國臺灣省管轄地區
  - label: C
    content: 大法官解釋認為我國領土的範疇應由全國人民透過公投決定之
  - label: D
    content: 我國領土除臺澎金馬以外，《憲法增修條文》稱為「大陸地區」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是《憲法增修條文》稱為自由地區。(B)還有包含金門縣及連江縣的馬祖。(C)應是《憲法增修條文》所揭示。
  tags:
