  answer_status: verified
  answer_source: answer_key
  explanation: '(B)此為保障新住民之健康權及生存權，並非使其融入社會之做法。(C)此應為無差別待遇之做法。(D)此為保障新住民之健康權及生存權，並非使新住民建立其國家認同。

    41.1991 年，聯合國在巴黎召開一次各國官方人權機構的代表會議，依各國之經驗，確立「關於促進和保護人權的國家機構的地位的原則」。(D)《巴黎原則》要求國家人權機構在法律、成員資格、運作、政策和資源控制方面具有獨立性。

    42.(A)(B)(D)皆非目前政府所施行的政策或法令。(C)成立客家委員會為現行政策，為正解。

    43.(A)國際特赦組織為非政府組織。(B)是落實政府保障各種基本人權，不僅侷限於參政權。(D)此為非政府組織「自由之家」的成立目的，並非國際特赦組織。

    44.下列投票年齡，屬於參政權之爭取，與(C)公民投票皆屬參政權。(A)紓困方案屬於社會權之範疇。(B)原住民狩獵文化保障屬於多元文化權集體人權之範疇。(D)社會安全網屬於社會權。

