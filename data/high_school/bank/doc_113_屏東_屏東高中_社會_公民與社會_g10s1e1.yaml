  stem: 《國家語言發展法》明訂政府捐助從事傳播的財團法人應提供國家語言多元服務，並得設立各國家語言廣播、電視專屬頻道及各種形式通訊傳播服務，賦予公廣集團設置「臺語專屬頻道」之法源依據，此外也要求政府對於面臨傳承危機的國家語言，應優先推動其傳承、復振及發展等特別保障措施。請問上述主要涉及公民身分的何種權利內涵？
