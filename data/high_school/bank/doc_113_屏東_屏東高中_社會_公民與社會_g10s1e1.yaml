  stem: 1992 年立法院修正《刑法》 100 條「意圖破壞國體、竊據國土或以非法之方法變更國憲、顛覆政府，而著手實行者……」內亂罪後，讓箝制人民言論的狀況解套，對臺灣社會民主化影響很大。請問此作為與下列何項所保障的公民權利類型相同？
  options:
  - label: A
    content: 第三次修憲，奠定總統副總統直接民選的法源
  - label: B
    content: 國家推動全民健康保險，保障全體國民的健康
  - label: C
    content: 給予失業者失業救助金、就業輔導等經濟協助
  - label: D
    content: 修改《集會遊行法》，取消現行許可制改為報備制
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文保障的公民權利為意見表達自由權，與(D)集會自由皆為自由權。(A)為參政權。(B)健康權為社會權之範疇。(C)社會救助、工作權也屬社會權之範疇。
