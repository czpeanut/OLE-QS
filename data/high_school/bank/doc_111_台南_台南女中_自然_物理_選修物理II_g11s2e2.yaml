  answer_source: answer_key
  explanation: '小球從 A 點落下到 B 點，位移 h＝2 m，因此，小球的重力位能變化為

    Δ$U_{重}$＝mgh＝2 kg×10 m∕$s^{2}$×2 m＝40 J（重力位能減少 40 J）

    彈簧的原長為 1.5 m，當小球到達 B 點時，彈簧被拉長到 2 m，因此彈簧的伸長量為

    Δx＝2 m－1.5 m＝0.5 m

    彈簧的彈性位能為 $U_{彈}$＝$\frac{1}{2}$k（Δx）$^{2}$＝$\frac{1}{2}$×120 N∕m×（0.5）$^{2}$＝$\frac{1}{2}$×120×0.25＝15 J

    因此，彈簧的彈性位能為 15 J。

    根據力學能守恆，重力位能的減少會轉化為小球的動能與彈簧的彈性位能。

    Δ$U_{重}$＝$U_{彈}$＋$K_{B}$ ⇒ 40 J＝15 J＋$K_{B}$ ⇒ $K_{B}$＝40 J－15 J＝25 J ⇒ $K_{B}$＝$\frac{1}{2}mv_{B}^{2}$ ⇒ 25＝$\frac{1}{2}$×2×$v_{B}^{2}$

    ⇒ 25＝$v_{B}^{2}$ ⇒ $v_{B}$＝$\sqrt{25}$＝5（m∕s）

    小球在 B 點的速率為 5 m∕s，故選(A)。'
