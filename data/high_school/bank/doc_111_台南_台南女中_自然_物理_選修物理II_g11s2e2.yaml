- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 一物體質量 10 kg，施一水平力 F 使物體靜止於光滑的斜面上，斜面底角 α＝37°，若斜面向左等速移動 10 m（物體相對靜止於斜面上），則水平力 F 作功為多少 J？（重力加速度量值為 10 m∕$s^{2}$）
  options:
  - label: A
    content: '0'
  - label: B
    content: '360'
  - label: C
    content: '450'
  - label: D
    content: '480'
  - label: E
    content: '750'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)水平力 F 分解為兩個方向的分力：

    ①平行於斜面的分力 $F_{//}$＝F cosθ。

    ②垂直於斜面的分力 $F_{⊥}$＝F sinθ。

    (2)重力 mg 可以分解為兩個分量：

    ①沿斜面方向的分力 mg sinθ，此力試圖使物體下滑。

    ②垂直於斜面的分力 mg cosθ。

    (3)要使物體保持相對於斜面靜止，水平力的平行分力 F cosθ 需平衡重力沿斜面方向的分力 mg sinθ：

    F cosθ＝mg sinθ

    ⇒ F＝$\frac{mg\sin \theta}{\cos \theta}$

    ⇒ F＝$\frac{10\times 10\times \sin 37^{^{\circ}}}{\cos 37^{^{\circ}}}$

    ⇒ F＝$\frac{100\times 0.6}{0.8}$＝$\frac{60}{0.8}$＝75（N）

    (4)水平力所作的功：W＝F×d

    ⇒ W＝75×10＝750（J）

    水平力所作的功為 750 J，故選(E)。'
