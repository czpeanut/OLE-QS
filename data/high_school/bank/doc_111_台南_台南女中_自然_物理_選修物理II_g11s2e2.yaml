    content: '10'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '相機作自由落體運動，其初速度向上，重力加速度向下，要知道著地前的速度，需使用運動學方程式：$v^{2}$＝$v_{0}^{2}$＋2gh

    (1) $v_{0}$＝－10 m∕s（向上）

    (2) g＝10 m∕$s^{2}$（向下）

    (3) h＝40 m

    代入數據：$v^{2}$＝（－10）$^{2}$＋2×10×40＝100＋800＝900

    v＝$\sqrt{900}$＝30（m∕s）

    相機著地前的瞬間速度為 30 m∕s，故選(C)。'
