  answer_status: verified
  answer_source: answer_key
  explanation: '(A)在物體到達半圓軌道的最高點 E 時，若不離開軌道，物體需有足夠的速度使其在最高點時能夠產生必要的向心力，因此使用能量守恆律與力平衡來解釋。

    能量守恆律：物體從 A 點滑下來的過程中，力學能守恆，假設初始點 A 的重力位能轉化為在 E 點的動能與位能。

    在最高點 E，物體的重力位能為 mg（2R），如果物體不離開軌道，需有向心力維持圓周運動。求 $\frac{1}{2}mv_{E}^{2}$＝mgR，其中，$v_{E }$是物體在 E 點的速率。

    力平衡：在最高點 E，物體所受的重力需等於提供向心力的正向力 mg＝$\frac{mv_{E}^{2}}{R}$

    從能量守恆來看，A 到 E 的重力位能變化 mgh＝mg（2R）＋$\frac{1}{2}mv_{E}^{2}$

    代入$\frac{1}{2}mv_{E}^{2}$＝$\frac{1}{2}$mgR，得到 mgh＝mg（2R）＋$\frac{1}{2}$mgR＝mg（$\frac{5}{2}$R），所以，為到達最高點而不離開軌道，h 的最小值為 h＝$\frac{5}{2}$R。

    (B)使用能量守恆計算物體到達 E 點的速率。

    (1)初始的重力位能為 mgh＝mg（4R）。

    (2)在 E 點的總能量由位能與動能組成：

    mg（4R）＝mg（2R）＋$\frac{1}{2}mv_{E}^{2}$ ⇒ mg（4R）－mg（2R）＝$\frac{1}{2}mv_{E}^{2}$ ⇒ 2mgR＝$\frac{1}{2}mv_{E}^{2}$

    ⇒ $v_{E}^{2}$＝4gR ⇒ $v_{E}$＝2$\sqrt{gR}$

    (C)當物體到達 E 點時，它的速度 $v_{E}$＝2$\sqrt{gR}$，此時它的運動方向是水平的，並且它將沿著水平方向拋射，使用水平拋射運動公式計算物體落地的距離：

    (1)水平方向的速度為 $v_{E}$＝2$\sqrt{gR}$。

    (2)垂直方向的初速度為 0，運動距離為 2R。

    (3)物體從 E 點落到地面的時間 t：2R＝$\frac{1}{2}gt^{2}$ ⇒ t＝$\sqrt{\frac{4R}{g}}$

    (4)水平方向的位移 x＝$v_{E}$t＝2$\sqrt{gR}$×$\sqrt{\frac{4R}{g}}$＝4R

    因此，物體落地點到 C 點的距離為 4R，而不是 2R。

    (D)在 E 點，物體的向心力是由重力與正向力共同提供，根據前面計算，物體在 E 點的速度為 $v_{E}$＝2$\sqrt{gR}$，因此向心力為 $F_{向心}$＝$\frac{mv_{E}^{2}}{R}$＝$\frac{m(2\sqrt{gR})^{2}}{R}$＝$\frac{4mgR}{R}$＝4mg

    此時的重力是 mg，所以正向力 N 為 $F_{向心}$－mg＝4mg－mg＝3mg

    (E)物體通過 E 點時的向心加速度為 $a_{向心}$＝$\frac{v_{E}^{2}}{R}$＝$\frac{(2\sqrt{gR})^{2}}{R}$＝4g，因此，物體通過 E 點時的加速度應該為 4g，而不是 3g。'
