  stem: 某選手由架上挺舉質量為 100 kg 的槓鈴，垂直挺舉過程中，槓鈴垂直速度隨時間的關係曲線如下圖所示（速度向上為正），圖中甲～壬為挺舉過程中的某些特定時刻，下列有關槓鈴力學能的敘述，哪些正確？
