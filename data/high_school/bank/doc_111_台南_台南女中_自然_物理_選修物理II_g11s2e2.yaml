  stem: 如右圖所示，以輕繩繫住的小球，繞一水平軸在一鉛垂面作順時針、半徑固定的圓周運動，O 點為其圓心，SQ 弧線與 QP 弧線等長，相對 Q 點而言，若忽略空氣阻力，則下列有關小球的角動量與小球所受之力矩的敘述，哪些正確？
  options:
  - label: A
    content: 繩上的張力不影響小球的角動量
  - label: B
    content: 小球角動量的方向在 S 點時與在 P 點時同向
  - label: C
    content: 小球角動量的量值在 S 點時大於在 P 點時
  - label: D
    content: 小球所受的重力力矩，在 S 點時比在 P 點時為大
  - label: E
    content: 小球角動量隨時間改變率的量值，在 S 點時比在 Q 點時為大
