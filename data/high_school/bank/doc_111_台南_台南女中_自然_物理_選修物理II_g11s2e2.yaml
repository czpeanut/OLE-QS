        - 413.4
  - label: E
    content: 4mgh
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s1_1_f1.png
    crop:
      page: 1
