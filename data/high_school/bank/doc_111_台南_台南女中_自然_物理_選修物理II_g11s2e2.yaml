  answer_status: verified
  answer_source: answer_key
  explanation: '(A)在 P 點與 S 點重力皆會對 Q 點造成力矩，因此會影響小球的角動量。

    (B)根據右手定則，角動量的方向取決於小球的旋轉方向。題目說明小球作順時針方向的圓周運動，因此無論在 S 點或 P 點，小球的角動量方向都是指向紙面內（或垂直於圓周平面的方向）。所以，小球角動量的方向在 S 點與 P 點時一致。

    (C)小球在 S 點時的速度比在 P 點時大，因為重力在 S 點處提供更大的切向加速度，這會使小球的速率在 S 點增大，而角動量量值與小球的線速度成正比，因此小球在 S 點的角動量量值會大於在 P 點時的角動量。

    (D)小球在 S 點與 P 點所受的重力相同，但是 S 點力臂較長，因此力矩較大。

    (E)τ×Δt＝ΔL，τ＝$\frac{ ΔL }{Δt}$（角動量的時變率），Q 點力通過支點，無力矩，因此 S 點較大。'
