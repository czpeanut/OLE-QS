  stem: 王君搭乘熱氣球在廣闊無風的平原上空觀賞風景，熱氣球以等速度 10 m∕s 鉛直上升時，王君不小心使相機從離地高度為 40 m 處離手，而讓相機自由落體，若不計空氣阻力並取重力加速度為 10 m∕$s^{2}$，則相機著地前瞬間的速度量值約為多少 m∕s？
  options:
