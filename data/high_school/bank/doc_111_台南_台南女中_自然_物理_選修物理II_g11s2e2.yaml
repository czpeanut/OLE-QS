  answer_status: verified
  answer_source: answer_key
  explanation: '(A)木塊的動能增加量應該是由繩子張力 T 作的正功與摩擦力 f 作的負功之差，而不是重力 $M_{2}$g 與張力 T 的和。

    (B)正確表達木塊的動能增加量，張力作正功，摩擦力作負功。

    (C)吊桶的動能應該是由重力 $M_{2}$g 作的功減去張力 T 作的功，與摩擦力無關，因為摩擦力僅作用在木塊上。

    (D) $K_{1}$ 與 $K_{2}$ 探討的是系統總動能，因此對於系統（$M_{1}$＋$M_{2}$）來說繩子張力 T 為內力，不需加入方程式計算。

    (E)木塊與吊桶的總動能應該是重力作的總功（$M_{2}$g）減去摩擦力 f 作的功，符合能量守恆的原理。'
