- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s2_17
  section: 2
  number: 17
  type: multiple
  page: 4
  stem: 在傾斜角為 θ＝53° 的斜面底端，有一質量為 m＝5 kg 的木塊，以初速 $v_{0}$＝11 m∕s 沿著斜面上衝，當木塊到達最高點後，又循著原來的路徑下滑回起點，已知斜面與木塊間的動摩擦係數為 μ$_{k}$＝$\frac{1}{2}$，令重力加速度量值為 10 m∕$s^{2}$，則下列敘述哪些正確？
  options:
  - label: A
    content: 木塊沿斜面上滑時的加速度量值為 10 m∕$s^{2}$
  - label: B
    content: 木塊沿斜面下滑時的加速度量值為 3 m∕$s^{2}$
  - label: C
    content: 木塊可沿斜面上滑 5 m
  - label: D
    content: 全程合力作功－165 J
  - label: E
    content: 當木塊滑回起點時的速率為 $\sqrt{55}$m∕s
  assets:
  - key: s2_17_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s2_17_f1.png
    crop:
      page: 4
      rect:
      - 487.65
      - 528.65
      - 565.1
      - 613.6
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)木塊沿斜面上滑時的加速度，受到的力有：

    (1)重力的分力 mg sinθ，方向向下，沿著斜面。

    (2)摩擦力 $f_{k}$＝μ$_{k}$mg cosθ，方向向下，也沿著斜面。

    木塊的總加速度 $a_{上}$ 由這兩個力決定，可以用牛頓第二運動定律來計算：

    $a_{上}$＝g sinθ＋μ$_{k}$g cosθ⇒ $a_{上}$＝10×sin53°＋$\frac{1}{2}$×10×cos53°

    根據 sin53°≒0.8、cos53°≒0.6 ⇒ $a_{上}$＝10×0.8＋$\frac{1}{2}$×10×0.6＝8＋3＝11（m∕$s^{2}$）

    (B)木塊下滑時，重力分力 mg sinθ 仍然作用向下，但摩擦力方向向上，與木塊運動方向相反，因此木塊的加速度變為 $a_{下}$＝g sinθ－μ$_{k}$g cosθ ⇒ $a_{下}$＝10×0.8－$\frac{1}{2}$×10×0.6＝8－3＝5（m∕$s^{2}$）

    (C)木塊上滑的最大位移，用能量守恆的觀點來分析，木塊上滑時，初始的動能將被重力位能與摩擦力消耗。能量守恆方程式：$\frac{1}{2}mv_{0}^{2}$＝mgh＋$f_{k}$×d，其中 h＝d sinθ，摩擦力的功為

    $f_{k}$＝μ$_{k}$mg cosθ

    總能量方程式變為$\frac{1}{2}mv_{0}^{2}$＝mgd sinθ＋μ$_{k}$mg cosθ×d

    ⇒$\frac{1}{2}$×5×$11^{2}$＝5×10×d×0.8＋$\frac{1}{2}$×5×10×0.6×d

    ⇒ 302.5＝40d＋15d

    ⇒ 302.5＝55d

    ⇒ d＝5.5（m）

    (D)合力作功，在整個過程中，合力對木塊的總功為動能的改變，初始動能為

    $K_{初}$＝$\frac{1}{2}mv_{0}^{2}$＝$\frac{1}{2}$×5×$11^{2}$＝302.5（J）

    當木塊回到原點時，速度會減少，最後的動能為 $K_{末}$＝$\frac{1}{2}mv_{末}^{2}$，合力作的功等於木塊能量的變化，因此合力作功為 $W_{合}$＝$K_{末}$－$K_{初}$，合力作的總功是－165 J，可以從摩擦力的作功與位移計算得到。

    (E)木塊滑回起點時，根據能量守恆：$\frac{1}{2}mv_{末}^{2}$＝$K_{初}$－$W_{摩擦}$

    合力作的總功是－165 J

    ∴$\frac{1}{2}mv_{末}^{2}$＝302.5－165 ⇒$\frac{1}{2}$×5×$v_{末}^{2}$＝137.5 ⇒ $v_{末}^{2}$＝$\frac{137.5\times 2}{5}$＝55 ⇒ $v_{末}$＝$\sqrt{55}$（m∕s）'
