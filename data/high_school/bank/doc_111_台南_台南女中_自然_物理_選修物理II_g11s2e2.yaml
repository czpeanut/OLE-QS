  stem: 如右圖所示，原長為 1.5 m，彈簧的力常數為 k＝120 N∕m 的輕彈簧，2 kg 的球，球原來在與轉軸 O 等高的 A 點，此時彈簧保持原長，若此彈簧全長為 2 m，設重力加速度 g＝10 m∕$s^{2}$，則此時球的速率為多少 m∕s？
  options:
  - label: A
    content: '5'
  - label: B
    content: '4'
  - label: C
    content: $\sqrt{15}$
  - label: D
    content: '3'
  - label: E
    content: $2\sqrt{2}$
  assets:
  - key: s1_14_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s1_14_f1.png
