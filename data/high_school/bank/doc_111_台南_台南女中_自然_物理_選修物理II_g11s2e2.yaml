- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某斜坡的斜角為 θ（已知 sinθ＝0.02），某卡車能以 18 km∕h 的速率等速上坡行駛，阻力大小為車重的 0.03 倍，設上、下坡的阻力大小相同，則該車以相同的馬力行駛下此斜坡時，其等速行駛的速率為多少 km∕h？
  options:
  - label: A
    content: '36'
  - label: B
    content: '54'
  - label: C
    content: '72'
  - label: D
    content: '90'
  - label: E
    content: '108'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '上坡時的受力分析：

    當卡車以等速 $v_{上}$ 上坡時，外力與阻力、重力的分量相平衡。

    阻力大小：$F_{阻}$＝0.03mg

    重力沿斜面的分量：$F_{重}$＝mg sinθ

    上坡時，卡車需要驅動力來克服阻力與重力分量：$F_{上}$＝$F_{阻}$＋$F_{重}$＝0.03mg＋mg sinθ

    代入 sinθ＝0.02 ⇒ $F_{上}$＝0.03mg＋0.02mg＝0.05mg

    ∴上坡時需要的驅動力是 0.05mg

    馬力是功率，功率 P 與力和速度的關係為 P＝F×v

    上坡時，卡車的功率為 P＝$F_{上}$×$v_{上}$＝0.05mg×$v_{上}$

    代入上坡速度 $v_{上}$＝18 km∕h＝5 m∕s ⇒ P＝0.05mg×5＝0.25mg（m∕s）

    下坡時，卡車受力有所不同，此時重力分量與阻力方向相反，因此下坡時的驅動力應克服阻力並抵消部分重力的分量：$F_{下}$＝$F_{重}$－$F_{阻}$＝mg sinθ－0.03mg

    代入 sinθ＝0.02 ⇒ $F_{下}$＝0.02mg－0.03mg＝－0.01mg

    因為重力分量幫助車輛下坡，驅動力只需克服這些力的差值。

    下坡時，功率 P 仍然相同，因此有 P＝$F_{下}$×$v_{下}$

    代入功率 P＝0.25mg 與 $F_{下}$＝－0.01mg ⇒ 0.25mg＝0.01mg×$v_{下}$

    解出下坡速率 $v_{下}$：$v_{下}$＝$\frac{0.25mg}{0.01mg}$＝25（m∕s）

    將單位轉換成 km∕h：$v_{下}$＝25×3.6＝90（km∕h）

    下坡時，卡車的等速行駛速率為 90 km∕h，故選(D)。'
