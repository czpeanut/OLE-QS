- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s2_16
  section: 2
  number: 16
  type: multiple
  page: 4
  stem: 某質量 m 的行星以橢圓軌道繞太陽運轉，如右圖所示。行星在甲、乙、丙三處與太陽的距離分別為 $r_{1}$、$r_{2}$、$r_{3}$，速率分別為 $v_{1}$、$v_{2}$、$v_{3}$，其中甲為近日點、乙為遠日點，速度皆與行星和太陽的連線垂直，而丙處速度與行星和太陽連線的夾角為 θ，若以太陽為參考點，下列哪些正確？
  options:
  - label: A
    content: 在任意時刻，太陽的重力對行星產生的力矩均相等
  - label: B
    content: 在甲處的速率 $v_{1}$ 與在乙處的速率 $v_{2 }$之關係為 $v_{1}$：$v_{2}$＝$r_{2}$：$r_{1}$
  - label: C
    content: 在甲處的角速度 ω$_{甲}$ 與在乙處的角速度 ω$_{乙}$ 之關係為 ω$_{甲}$：ω$_{乙}$＝$r_{1}$：$r_{2}$
  - label: D
    content: 在丙處的角動量為 $r_{3}mv_{3}$ cosθ
  - label: E
    content: 在任意時刻，行星角動量的時變率均為 0
  assets:
  - key: s2_16_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s2_16_f1.png
    crop:
      page: 4
      rect:
      - 387.8
      - 331.55
      - 565.1
      - 424.05
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)因為太陽對行星的引力方向始終沿著行星與太陽的連線，因此在任何時刻，行星所受的力矩為 0。這是因為引力不會對行星產生使其繞太陽旋轉的力矩，這也是行星的角動量為常數的原因。

    (B)根據角動量守恆，行星的角動量 L 為 $mr_{1}v_{1}$＝$mr_{2}v_{2}$，解出速率之間的關係為 $v_{1}$：$v_{2}$＝$r_{2}$：$r_{1}$。

    (C)角速度 ω 與速率 v 的關係為 ω＝$\frac{v}{r}$

    根據角動量守恆 $v_{1}r_{1}$＝$v_{2}r_{2}$，因此可以推導出角速度與半徑成反比，即

    ω$_{甲}$：ω$_{乙}$＝$\frac{v_{1}}{r_{1}}$：$\frac{v_{2}}{r_{2}}$＝$\frac{r_{2}}{r_{1}}$，故角速度應為 ω$_{甲}$：ω$_{乙}$＝$r_{2}$：$r_{1}$。

    (D)在丙處，由於行星的速度與太陽的連線有夾角 θ，因此角動量的計算應為 $L_{丙}$＝$mr_{3}v_{3}$ sinθ

    因此，角動量應與 sinθ 相關，而不是 cosθ。

    (E)根據角動量守恆，行星繞太陽運行的過程中，角動量始終保持不變，因此角動量的時變率（角動量隨時間的變化率）為 0。'
