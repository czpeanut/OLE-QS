  page: 1
  stem: 如右圖，滑輪、繩子質量不計，忽略一切阻力，A 的質量為 4m、B 的質量 m，B 靜置於地面、A 離地面 h 高度釋放，當 A、B 等高時，重力對 A、B 所作的總功為何？
  options:
  - label: A
    content: $\frac{2}{3}$mgh
  - label: B
    content: mgh
  - label: C
    content: 3mgh
  - label: D
    content: $\frac{7}{3}$mgh
    asset:
      key: s1_1_optD
      file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s1_1_optD.png
