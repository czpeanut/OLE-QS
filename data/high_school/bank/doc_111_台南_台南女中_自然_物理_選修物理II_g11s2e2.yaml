  section: 2
  number: 18
  type: multiple
  page: 4
  stem: 如右圖所示，吊桶以長度不變的細繩繞過光滑定滑輪，連接到水平桌面上質量為 $M_{1 }$的木塊，今緩慢將微量細砂加入吊桶，直到吊桶與細砂的總質量為 $M_{2}$、木塊開始滑動為止，已知木塊水平移動且不轉動、受到動摩擦力的量值固定為 f，重力加速度量值為 g，且繩上各點的張力恆沿著繩子方向作用、量值均為 T。當木塊由靜止開始，向左滑動的距離為 s 時，木塊的動能為 $K_{1}$，吊桶與細砂的總動能為 $K_{2}$，則下列等式哪些正確？
  options:
  - label: A
    content: $K_{1}$＝（$M_{2}$g＋T）s
  - label: B
    content: $K_{1}$＝（T－f）s
  - label: C
    content: $K_{2}$＝（$M_{2}$g＋T－f）s
  - label: D
    content: $K_{1}$＋$K_{2}$＝（$M_{2}$g－f－T）s
  - label: E
    content: $K_{1}$＋$K_{2}$＝（$M_{2}$g－f）s
