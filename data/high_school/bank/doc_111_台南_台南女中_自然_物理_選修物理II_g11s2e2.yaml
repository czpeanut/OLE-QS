- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 考慮可視為質點的甲、乙兩原子，甲固定於原點，乙只在 x 軸上運動，乙受甲的原子力 F 只與距離 x 有關，且 F 以沿＋x 方向為正，F 與 x 的關係，在 2.2×$10^{－10}$ m ≤ x ≤ 5.0×$10^{－10}$ m 間如右圖所示，乙由靜止自 P 點開始移動，假設乙除原子力 F 外不受其他外力作用，則下列敘述何者正確？
  options:
  - label: A
    content: 乙原子到達 Q 點時，位能最小
  - label: B
    content: 乙原子到達 R 點時，動能最大
  - label: C
    content: 乙原子由 Q 點到 R 點，F 作功朝－x 方向
  - label: D
    content: 乙原子到達 R 點後便靜止於該處
  - label: E
    content: F 為非保守力
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s1_5_f1.png
    crop:
      page: 2
      rect:
      - 390.0
      - 78.2
      - 565.1
      - 154.35
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)根據題目描述，乙原子受力 F 與位置 x 有關，當乙原子在 x 軸上運動時，若受力 F 的大小變為 0 或力的方向變為相反時，表示系統在該點處於平衡狀態。此時，系統的位能最小，因此，當乙到達 Q 點時，位能最小，因為這是原子間的穩定平衡位置。

    (B)乙原子在 Q 點時位能最小，此時動能應最大，如果乙原子繼續運動到 R 點，受力可能使其減速，因此，乙原子的動能不一定在 R 點最大。

    (C)乙原子從 Q 點到 R 點，受力的方向會朝－x 方向，因此功為能量，沒有方向。

    (D)乙原子到達 R 點時，仍然受到原子間的作用力 F，因此不會靜止於該處，除非 F＝0 或系統達到平衡狀態，否則乙原子將繼續運動。

    (E)原子間作用力是典型的保守力，因為它與位置有關，且作功可以通過位能來描述，因此，F 應是保守力。'
