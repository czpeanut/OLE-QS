- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 如右圖，一固定曲面內壁為光滑面（曲面半徑為 R），AO 為半徑，今將一物自 A 由靜止釋放，物體由 B 飛出，若不計空氣阻力，則此物最高離地面高度為何？
  options:
  - label: A
    content: R
  - label: B
    content: R（1－sinθ）
  - label: C
    content: R $cos^{2}$θ
  - label: D
    content: R $sin^{2}$θ
  - label: E
    content: R（1－$cos^{3}$θ）
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s1_8_f1.png
    crop:
      page: 2
      rect:
      - 446.55
      - 404.45
      - 565.1
      - 467.75
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '因為曲面光滑，系統的力學能守恆，在 A 點，物體的初始重力位能將轉化為物體在 B 點的動能與剩餘的重力位能。

    (1)在 A 點，物體的重力位能為 $U_{A}$＝mgR（物體位於距離地面高度為 R 的位置）。

    (2)在 B 點，物體的重力位能為 $U_{B}$＝mgR（1－cosθ）（物體在 B 點的位置比 A 點低，高度為 R（1－cosθ）。

    (3)物體在 B 點的動能為 $K_{B}$＝$\frac{1}{2}mv_{B}^{2}$

    根據能量守恆定律，A 點的總力學能等於 B 點的總力學能：

    mgR＝mgR（1－cosθ）＋$\frac{1}{2}mv_{B}^{2}$ ⇒ mgR cosθ＝$\frac{1}{2}mv_{B}^{2}$

    解出物體在 B 點的速度：$v_{B}^{2}$＝2gR cosθ ⇒ $v_{B}$＝$\sqrt{2gR\cos \theta}$

    當物體從 B 點飛出後，進行斜拋運動，將物體的速度分解為垂直與水平方向的分量。

    垂直速度分量 $v_{By}$＝$v_{B}$ sinθ＝$\sqrt{2gR\cos \theta}\sin \theta$

    飛出後，物體在垂直方向作自由上拋運動，可以利用垂直運動的最高點條件來計算物體上升的最大高度。物體的垂直運動最高點發生在垂直速度 $v_{By}$ 變為零的位置，根據自由落體運動的公式，物體的最大上升高度 $h_{max}$＝$\frac{v_{By}^{2}}{2g}$＝$\frac{(\sqrt{2gR\cos \theta}\sin \theta )^{2}}{2g}$＝$\frac{2gR\cos \theta \times \sin ^{2}\theta}{2g}$＝R cosθ×$sin^{2}$θ

    物體飛行過程中的總最高離地的高度是物體在 B 點的垂直高度 R（1－cosθ）加上垂直上拋時的最大上升高度 $h_{總}$＝R（1－cosθ）＋R cosθ×$sin^{2}$θ⇒ $h_{總}$＝R（1－$cos^{3}$θ）

    物體飛出後能達到的最高離地高度為 R（1－$cos^{3}$θ），故選(E)。'
