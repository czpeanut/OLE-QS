- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 一條長為 R 的繩子綁住一石塊，讓石塊一開始在鉛直面上作圓周運動，石塊的位置可由石塊—圓心連線與水平線夾角 θ 表示，如右圖所示，若石塊在最低處的速率改為$\sqrt{\frac{22gR}{5}}$，g 為重力加速度，則石塊轉到何處時，會脫離圓形虛線的軌跡？（已知 sin37°＝0.6）
  options:
  - label: A
    content: θ＝30°
  - label: B
    content: θ＝37°
  - label: C
    content: θ＝45°
  - label: D
    content: θ＝53°
  - label: E
    content: θ＝60°
  assets:
  - key: s1_10_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s1_10_f1.png
    crop:
      page: 3
      rect:
      - 475.7
      - 79.55
      - 565.1
      - 181.75
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)能量守恆定律：

    由於石塊在光滑圓周上運動，運動過程中力學能守恆，石塊的總力學能應在最低點與任意角度 θ 處相等。

    ①在最低點，石塊的總能量為動能：$E_{min}$＝$\frac{1}{2}mv_{min}^{2}$

    代入 $v_{min}^{2}$＝$\frac{22gR}{5}$，則 $E_{min}$＝$\frac{1}{2}$m×$\frac{22gR}{5}$＝$\frac{11}{5}$mgR

    ②在任意角度 θ 處，石塊的總能量包括動能與重力位能，此時的重力位能應為 mgR（1＋sinθ），因為石塊的高度相對於最低點，$E_{θ}$＝$\frac{1}{2}mv_{θ}^{2}$＋mgR（1＋sinθ），根據能量守恆：$E_{min}$＝$E_{θ}$

    ⇒$\frac{11}{5}$mgR＝$\frac{1}{2}mv_{θ}^{2}$＋mgR（1＋sinθ）

    ⇒$\frac{11}{5}$gR＝$\frac{1}{2}v_{θ}^{2}$＋gR（1＋sinθ）

    ⇒$\frac{11}{5}$gR＝$\frac{1}{2}v_{θ}^{2}$＋gR＋gR sinθ

    ⇒$\frac{11}{5}$gR－gR＝$\frac{1}{2}v_{θ}^{2}$＋gR sinθ

    ⇒$\frac{6}{5}$gR＝$\frac{1}{2}v_{θ}^{2}$＋gR sinθ ……………①

    (2)脫離條件：

    石塊脫離圓軌道的條件是當繩子的張力為零時，石塊的向心力完全由重力的徑向分量提供，重力的徑向分量是 mg sinθ，因此脫離條件是$\frac{mv_{\theta}^{2}}{R}$＝mg sinθ⇒ $v_{θ}^{2}$＝gR sinθ ……………②

    (3)將②代入①可得$\frac{6}{5}$gR＝$\frac{1}{2}$gR sinθ＋gR sinθ

    ⇒$\frac{6}{5}$gR＝$\frac{3}{2}$gR sinθ

    ⇒$\frac{6}{5}$＝$\frac{3}{2}$sinθ

    ⇒ sinθ＝$\frac{6}{5}$×$\frac{2}{3}$＝$\frac{12}{15}$＝0.8

    根據 sinθ＝0.8，可以查表或使用計算器求出 θ≒53°

    石塊在 θ＝53° 時脫離圓形軌跡，故選(D)。'
