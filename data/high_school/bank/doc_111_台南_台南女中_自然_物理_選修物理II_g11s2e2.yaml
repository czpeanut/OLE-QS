  stem: 如右圖，AB 為一斜面，BC 為一水平面，CDE 為一半徑為 R 的鉛直半圓軌道面，設所有接觸面皆無摩擦力，一質量為 m 的物體，自 A 點由靜止自由下滑，則下列敘述哪些正確？（重力加速度為 g，假設物體體積極小）
  options:
  - label: A
    content: 欲使物體運動至半圓軌道的最高點 E 而中途不離開軌道面，高度 h 的最小值為 $\frac{5}{2}$R
  - label: B
    content: 若 h＝4R，當物體運動至 E 點時的速率為 $2\sqrt{gR}$
  - label: C
    content: 承(B)，物體自 E 點離開軌道面後，落至 BC 水平面的 F 點，則其落點與 C 點的距離為 2R
  - label: D
    content: 承(B)，物體通過 E 點瞬間的正向力量值為 3mg
  - label: E
    content: 承(B)，物體通過 E 點瞬間的加速度量值為 3g
  assets:
  - key: s2_20_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s2_20_f1.png
    crop:
