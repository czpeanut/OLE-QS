  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)系統運動分析：

    ① A 物體從初始高度 h 處釋放，由於滑輪系統，A 與 B 會以相同的速度移動。

    ②動滑輪 B 接觸地面，當系統運動時，B 向上移動，A 向下移動。

    ③當 A 與 B 等高時，A 向下移動 $\frac{2h}{3}$ 的距離（因為 B 是動滑輪，當 B 向上移動距離 x 時，A 向下移動 2x），而 B 向上移動 $\frac{h}{3}$。

    (2)重力對 A 的功：

    ① A 向下移動的距離為 $\frac{2h}{3}$。

    ②重力對 A 作的功為 $W_{A}$＝$m_{A}gd_{A}$＝4m×g×$\frac{2h}{3}$＝$\frac{8mgh}{3}$

    其中 $m_{A}$＝4m，且 $d_{A}$＝$\frac{2h}{3}$

    (3)重力對 B 的功：

    ① B 向上移動的距離為 $\frac{h}{3}$。

    ②重力對 B 作的功為 $W_{B}$＝－$m_{B}gd_{B}$＝－m×g×$\frac{h}{3}$＝－$\frac{mgh}{3}$

    其中負號代表 B 向上移動，與重力方向相反。

    (4)總功計算：重力對 A 與 B 的總功為兩者之和：

    $W_{總}$＝$W_{A}$＋$W_{B}$＝2mgh－$\frac{8mgh}{3}$＋（－$\frac{mgh}{3}$）＝$\frac{7}{3}$mgh，故選(D)。'
