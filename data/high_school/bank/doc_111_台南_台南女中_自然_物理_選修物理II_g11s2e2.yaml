  stem: '如右圖所示，一質量為 m 的物體以一沿斜面方向向上的初速度 v＝$\sqrt{gL}$在由傾角為 60°、長度為 L 且固定不動的斜面最低點 P 出發。現對此物體施加量值不變、方向始終沿斜面方向向上的力 F，使物體沿斜面運動到達斜面長度 $\frac{L}{2}$ 的 Q 點，在 Q 點時立即撤去外力 F，設物體與斜面的動摩擦係數為 μ$_{k}$、重力加速度為 g，請回答下列問題：

    (1)若小物體位於 P 點時的動能為 $K_{P}$、抵達 Q 點時的動能為 $K_{Q}$、抵達 R 時的動能為 $K_{R}$，要使物體能夠到達斜面最高點 R 的條件為何？（以 $K_{P}$、$K_{Q}$、$K_{R }$作答）（2 分）

    答：＿＿＿＿＿＿＿＿＿＿。

    (2)若物體能夠到達斜面最高點 R，則外力 F、重力、動摩擦力對物體作功分別為何？（以 μ$_{k}$、F、mg、L 作答）（各 1 分）

    答：＿＿＿＿＿＿＿＿＿＿。

    (3)若要使物體能夠到達斜面最高點 R，則外力 F 的量值最少需為多少 mg？（需詳列計算過程與理論依據，僅寫答案不計分）（4 分）

    答：＿＿＿＿＿＿＿＿＿＿。

    ～試題結束～'
  assets:
  - key: s3_22_f1
    kind: figure
    file: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2/s3_22_f1.png
    crop:
