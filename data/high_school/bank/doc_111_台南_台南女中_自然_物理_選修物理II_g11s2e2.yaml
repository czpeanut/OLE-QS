- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s2_19
  section: 2
  number: 19
  type: multiple
  page: 5
  stem: 一物體自地面射出，初速為 $v_{0}$，仰角為 θ$_{0}$，不計空氣阻力，考慮重力對該物作功的功率，則下列敘述哪些正確？
  options:
  - label: A
    content: 在最高點時，瞬時功率為 $mgv_{0}$ cosθ$_{0}$
  - label: B
    content: 落地瞬間，瞬時功率為 $mgv_{0}$ cosθ$_{0}$
  - label: C
    content: 由最高點下降至地面過程中的平均功率為$\frac{1}{2}mgv_{0}$ sinθ$_{0}$
  - label: D
    content: 由起點上升至最高點過程中的平均功率為$\frac{1}{2}mgv_{0}$ sinθ$_{0}$
  - label: E
    content: 全程的平均功率為 0
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)在最高點時，物體的速度方向是水平的，因此垂直方向上沒有運動分量，重力與速度的方向垂直，因此功率為零，在最高點的瞬時功率應該為零，而非 $mgv_{0}$ cosθ$_{0}$。

    (B)物體落地後，速度方向與水平線夾角為θ$_{0}$，因此重力與速度夾角為 90°－θ$_{0}$，瞬時功率為重力與速度的內積 mg．$v_{0}$ cos（90°－θ$_{0}$）＝$mgv_{0}$ sinθ$_{0}$。

    (C)在下降過程中，重力沿垂直方向對物體作功，速度的垂直分量與重力方向一致，根據能量守恆，物體下落的過程中，動能增量等於重力作的功，而平均功率等於總功除以時間。

    (D)從起點上升到最高點的過程中，重力與物體的垂直速度方向相反，重力作負功，此過程中的平均功率不應該是正值。

    (E)重力是保守力，對物體在拋射全程中作的總功等於零，雖然上升過程重力作負功，下降過程重力作正功，但兩者抵消。因此，整個運動過程中重力的平均功率為零。'
