  section: 1
  number: 12
  type: single
  page: 3
  stem: 一質量可忽略的理想彈簧左端固定於牆上，其彈性常數為 k，如右圖所示，一質量為 m 的木塊，以初速率 v 向左滑行於水平面上，在正面擠壓彈簧後與彈簧保持接觸，直到被向右彈回，兩者分離，若木塊與水平面間有摩擦力時，木塊與彈簧系統的力學能會持續減少，在有摩擦力的情況下，下列敘述何者正確？
