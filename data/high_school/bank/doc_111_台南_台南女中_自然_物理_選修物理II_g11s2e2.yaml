  explanation: '(A)此 v-t 圖顯示出的是速度與時間的關係，從辛時刻到壬時刻為正向的位移關係，所以壬時刻的高度比辛時刻的高度來得高。

    (B)庚時刻與戊時刻的速度為零，動能相同，因為戊時刻到庚時刻經歷為負向的位移，所以位能降低，總力學能下降，因此庚時刻小於戊時刻。

    (C)由丙時刻到戊時刻為正向位移，戊時刻到己時刻雖然為負向位移，但槓鈴的位能為先增加後減少。

    (D)由己時刻到庚時刻的過程，負向速度量值減少，動能減少。

