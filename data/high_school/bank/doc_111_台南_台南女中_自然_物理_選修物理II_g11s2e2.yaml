- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 一砲彈沿水平向右飛行的某一瞬間，其動能為 K，此時突然爆炸成質量相等的兩塊，其中一塊沿水平向左的方向飛出，其動能 2K，則另一塊的動能為何？
  options:
  - label: A
    content: '0'
  - label: B
    content: K
  - label: C
    content: 2K
  - label: D
    content: 4K
  - label: E
    content: 8K
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由於爆炸過程中沒有外力作用，系統總動量守恆。

    爆炸前，砲彈的動量為 $p_{初}$＝mv

    爆炸後，兩塊質量相等，動量守恆表達為 mv＝$\frac{m}{2}$（－$v_{1}$）＋$\frac{m}{2}$×$v_{2}$

    其中，第一塊質量 $\frac{m}{2}$，速度為 $v_{1}$，且沿水平向左運動，速度為負；第二塊質量一樣為 $\frac{m}{2}$，速度為 $v_{2}$。計算第一塊的速度 $v_{1}$：已知第一塊的動能為 2K，動能公式為$\frac{1}{2}$×$\frac{m}{2}$×$v_{1}^{2}$＝2K

    解出 $v_{1}$：$v_{1}^{2}$＝$\frac{8K}{m}$⇒ $v_{1}$＝$\sqrt{\frac{8K}{m}}$

    根據動量守恆：mv＝$\frac{m}{2}$（－$\sqrt{\frac{8K}{m}}$）＋$\frac{m}{2}$×$v_{2}$

    解方程式：v＝－$\frac{1}{2}\sqrt{\frac{8K}{m}}$＋$\frac{1}{2}v_{2}$ ⇒ 2v＝－$\sqrt{\frac{8K}{m}}$＋$v_{2}$ ⇒ $v_{2}$＝2v＋$\sqrt{\frac{8K}{m}}$

    爆炸前，砲彈總動能為 K，因此 K＝$\frac{1}{2}mv^{2}$ ⇒ $v^{2}$＝$\frac{2K}{m}$⇒ v＝$\sqrt{\frac{2K}{m}}$

    代入 $v_{2}$ 的方程式：$v_{2}$＝2$\sqrt{\frac{2K}{m}}$＋$\sqrt{\frac{8K}{m}}$＝2$\sqrt{\frac{2K}{m}}$＋2$\sqrt{\frac{2K}{m}}$＝4$\sqrt{\frac{2K}{m}}$

    第二塊的動能為 $E_{動，第二塊}$＝$\frac{1}{2}$×$\frac{m}{2}$×$v_{2}^{2}$＝$\frac{1}{4}$m×$v_{2}^{2}$

    代入 $v_{2}^{2}$＝16×$\frac{2K}{m}$＝$\frac{32K}{m}$⇒ $E_{動，第二塊}$＝$\frac{1}{4}$m×$\frac{32K}{m}$＝8K

    另一塊的動能為 8K，故選(E)。'
