- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 飛機於長程水平飛行時，其用來平衡重力的上升力可近似為 $F_{上}$＝αρ$v^{2}$，v 為飛行速率、ρ 為空氣密度、α 為相關常數，若飛機此時所受的空氣阻力可假設為 $F_{阻}$＝βρv，β 為常數。已知空氣密度 ρ 會隨著飛行高度的增加而變小，假設某一高空航線的空氣密度 ρ 為另一低空的 $\frac{1}{4}$，僅考慮上述主要效應，並忽略浮力，若同一飛機維持固定的高度，水平飛行相同的航程，則在該高空與低空航線因阻力所消耗的能量之比值為何？
  options:
  - label: A
    content: $\frac{1}{2}$
  - label: B
    content: $\frac{1}{2\sqrt{2}}$
  - label: C
    content: $\frac{1}{\sqrt{2}}$
  - label: D
    content: '1'
  - label: E
    content: $\sqrt{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '由於飛機在兩條航線上都進行水平飛行，飛機的上升力 $F_{上}$ 用來平衡飛機的重力，$F_{上}$＝重力＝mg。

    而上升力的公式為 $F_{上}$＝αρ$v^{2}$

    因此，可以得到飛行速率 v 與空氣密度 ρ 的關係：mg＝αρ$v^{2}$

    解此方程式找出 v 與 ρ 的關係：v＝$\sqrt{\frac{mg}{\alpha \rho}}$

    假設低空航線的速率為 $v_{低}$，高空航線的速率為 $v_{高}$，它們分別滿足下列關係：

    $v_{低}$＝$\sqrt{\frac{mg}{\alpha \rho _{低}}}$

    $v_{高}$＝$\sqrt{\frac{mg}{\alpha \rho _{高}}}$＝$\sqrt{\frac{mg}{\alpha \times \frac{1}{4}\rho _{低}}}$＝$2\sqrt{\frac{mg}{\alpha \rho _{低}}}$＝$2v_{低}$

    所以，高空的飛行速率 $v_{高}$ 是低空飛行速率 $v_{低}$ 的兩倍。

    空氣阻力的公式為：$F_{阻}$＝βρv

    在低空時，空氣阻力為：$F_{阻，低}$＝βρ$_{低}v_{低}$

    在高空時，空氣阻力為：$F_{阻，高}$＝βρ$_{高}v_{高}$＝β×$\frac{1}{4}$ρ$_{低}$×$2v_{低}$＝$\frac{1}{2}$βρ$_{低}v_{低}$

    因此，高空的空氣阻力是低空阻力的一半：$F_{阻，高}$＝$\frac{1}{2}F_{阻，低}$

    飛機在固定航程中，因空氣阻力消耗的能量與阻力 $F_{阻}$ 和航程 d 的乘積成正比：E＝$F_{阻}$×d

    因此，高空與低空航線因空氣阻力所消耗的能量比為$\frac{E_{高}}{E_{低}}$＝$\frac{F_{阻,高}\times d}{F_{阻,低}\times d}$＝$\frac{1}{2}$，故選(A)。'
