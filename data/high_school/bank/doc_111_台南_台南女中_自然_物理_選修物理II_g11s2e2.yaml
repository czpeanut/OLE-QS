- id: doc_111_台南_台南女中_自然_物理_選修物理II_g11s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 一物體在光滑水平面上作簡諧運動，當其位移為振幅$\frac{3}{4}$時，速率為 v，則此物體通過位移為零的平衡點時之速率為多少 v？
  options:
  - label: A
    content: $\sqrt{7}$
  - label: B
    content: $\frac{16}{9}$
  - label: C
    content: $\sqrt{3}$
  - label: D
    content: $\frac{2\sqrt{3}}{3}$
  - label: E
    content: $\frac{4\sqrt{7}}{7}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由於總能量是守恆的，系統的總能量 $E_{總}$ 可表示為 $E_{總}$＝$\frac{1}{2}kA^{2}$，其中 A 是振幅。位移為 $\frac{3}{4}$ 振幅時的能量分布：當物體的位移為 x＝$\frac{3}{4}$A 時，物體的速率為 v。此時，系統的總能量由動能與位能組成：$E_{總}$＝$\frac{1}{2}mv^{2}$＋$\frac{1}{2}$k（$\frac{3}{4}$A）$^{2}$＝$\frac{1}{2}mv^{2}$＋$\frac{1}{2}$k×$\frac{9}{16}A^{2}$

    ∵總能量 $E_{總}$＝$\frac{1}{2}kA^{2}$

    ∴$\frac{1}{2}kA^{2}$＝$\frac{1}{2}mv^{2}$＋$\frac{1}{2}$k×$\frac{9}{16}A^{2}$

    ⇒$\frac{1}{2}kA^{2}$－$\frac{1}{2}$k×$\frac{9}{16}A^{2}$＝$\frac{1}{2}mv^{2}$

    ⇒$\frac{1}{2}kA^{2}$（1－$\frac{9}{16}$）＝$\frac{1}{2}mv^{2}$

    ⇒$\frac{1}{2}kA^{2}$×$\frac{7}{16}$＝$\frac{1}{2}mv^{2}$

    ⇒ $kA^{2}$×$\frac{7}{16}$＝$mv^{2}$

    當物體通過平衡點（x＝0）時，所有的位能轉化為動能，系統的總能量為 $E_{總}$＝$\frac{1}{2}mv_{max}^{2}$

    其中 $v_{max}$ 是物體在平衡點時的最大速度，因此 $\frac{1}{2}kA^{2}$＝$\frac{1}{2}mv_{max}^{2}$ ⇒ $kA^{2}$＝$mv_{max}^{2}$

    由 $v_{max}$ 與 v 的關係，可得

    $\begin{cases}kA^{2}=mv_{\max}^{2} \ kA^{2}\times \frac{7}{16}=mv^{2}\end{cases}$⇒$\frac{v_{\max}^{2}}{v^{2}}$＝$\frac{kA^{2}}{kA^{2}\times \frac{7}{16}}$＝$\frac{16}{7}$⇒$\frac{v_{\max}}{v}$＝$\frac{4}{\sqrt{7}}$⇒ $v_{max}$＝$\frac{4\sqrt{7}}{\sqrt{7}\times \sqrt{7}}$＝$\frac{4\sqrt{7}}{7}$（v）

    物體通過平衡點時的速率為$\frac{4\sqrt{7}}{7}$v，故選(E)。'
