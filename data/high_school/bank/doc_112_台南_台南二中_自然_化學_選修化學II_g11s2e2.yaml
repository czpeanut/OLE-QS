  explanation: (A)(B)離子化合物比熔點時，比較離子鍵的大小。U＝$\frac{kQ_{1}Q_{2}}{d}$，其中k為常數，$Q_{1}Q_{2}$為陰、陽離子的電荷量，d則為離子鍵長，由此式可知當$Q_{1}Q_{2}$乘積越大、鍵長越短時，離子鍵的鍵能會越強。(A)中$Na^{＋}$、$F^{－}$的電荷為＋1、－1，CaO的電荷為＋2、－2，故CaO離子鍵較強；(B)中$F^{－}$半徑較$Cl^{－}$小，故NaF離子鍵較強；(C) $SiO_{2}$為網狀固體熔化需破壞共價鍵，$CO_{2}$為分子物質，熔化僅需破壞凡得瓦力；(D)同族元素原子序越大、金屬鍵越弱、熔點越低；(E)同週期元素原子序越大、金屬鍵越強、熔點越高。故選(B)(C)(E)。
