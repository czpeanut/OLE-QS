  stem: X與Y為週期表中前三週期的兩個元素，已知X為IA族的元素，而Y為VIA族的元素。則下列有關X與Y的敘述何者正確？
  options:
  - label: A
    content: X的原子半徑一定大於Y的原子半徑
  - label: B
    content: X與Y形成的共價化合物中，其組成的所有原子皆滿足八隅體的電子組態
  - label: C
    content: X與Y結合的化學鍵均無方向性
  - label: D
    content: 由X和Y組成的化合物中，X和Y的原子個數比不可能是1：1
  - label: E
    content: $X_{2}$Y可為離子化合物，也可能是共價化合物
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不一定，有可能X的殼層數比Y少；(B)若形成共價化合物，代表X為H，則H周圍不滿足八隅體；(C)若X為H、Y為O，則形成$H_{2}$O，共價鍵具有方向性；(D)有可能，例如$H_{2}O_{2}$；(E)有可能為$Na_{2}$O、$H_{2}$O，前者為離子化合物，後者為共價化合物。故選(E)。
