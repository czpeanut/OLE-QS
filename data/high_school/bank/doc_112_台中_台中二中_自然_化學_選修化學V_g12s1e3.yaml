    content: 鹼性電池的陽極半反應與乾電池相同
  - label: B
    content: 鹼性電池輸出電流較碳鋅電池大
  - label: C
    content: 一次鋰電池的陰極為二氧化錳，而電解質是溶於水中的$LiClO_{4}$
  - label: D
    content: 鉛蓄電池充電時的陽極為Pb，而陰極為$PbO_{2}$
  - label: E
