  answer_status: verified
  answer_source: answer_key
  explanation: (A)皆為Zn，但鹼性乾電池的Zn氧化之後形成的$Zn^{2＋}$離子容易與鹼性物質沉澱；(B)鹼性乾電池所提供的電流較大較穩定；(C)一次鋰電池不使用水作為溶劑，否則鋰金屬碰到水會爆炸；(D)鉛蓄電池充電時，Pb極發生$PbSO_{4}$ → Pb的還原反應，為陰極，而$PbO_{2}$極則發生$PbSO_{4}$ → $PbO_{2}$的氧化反應，為陽極；(E)石墨只是導電用。故選(B)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s2_19
  section: 2
  number: 19
  type: multiple
  page: 2
  stem: 鋰離子電池當對鋰離子電池進行充電時，電池的【甲】上的鋰離子經過電解液運動到【乙】，而作為此電極的石墨呈層狀結構，它有很多微孔，到達的鋰離子就嵌入到石墨層的微孔中，嵌入的鋰離子愈多，充電容量就愈高。同理當電池進行放電時，嵌在石墨層中的鋰離子脫出，又運動回到【丙】。回到此極的鋰離子愈多，放電容量就愈高。由此可看出，在鋰離子電池的充放電過程中，鋰離子在兩極間來回奔跑。所以專家們又給了鋰離子電池一個可愛的名字：【丁】。關於上述空格中，應填入的答案為下列何者？
  options:
  - label: A
    content: 【甲】為正極
  - label: B
    content: 【乙】為正極
  - label: C
    content: 【丙】為正極
  - label: D
    content: 【丙】為負極
  - label: E
    content: 【丁】為搖椅式電池
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 充電時，電子流進負極(陰極)，此時$Li^{＋}$離子也往負極移動以維持電性中和。故【甲】為正極、【乙】為負極。放電則反之，故【丙】為正極，【丁】正確。故選(A)(C)(E)。
