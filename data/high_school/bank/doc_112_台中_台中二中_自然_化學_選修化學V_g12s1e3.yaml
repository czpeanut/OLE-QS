  explanation: '(1)草酸根氧化時C－C鍵結會斷裂，故活化能大，加熱反應速率才足夠。 (2)達當量點時，還原劑用盡，此時多餘的$MnO_{4}^{－}$則可呈現紫色於溶液中。 (3)氧化還原滴定：5×C×25＝2×0.05×25，可得過錳酸鉀濃度C＝0.02 M。

