    【步驟二】取某一含$Fe^{2＋}$之試料1.00克溶於30毫升水中，加入稀硫酸30毫升，以【步驟一】之$KMnO_{4}$水溶液滴定，加入10.0毫升恰達當量點。

    回答下列問題：

