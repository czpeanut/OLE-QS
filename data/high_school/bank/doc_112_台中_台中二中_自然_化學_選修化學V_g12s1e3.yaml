  page: 2
  stem: 某鉛蓄電池在電池放電時，若陽極放出1莫耳電子，回答下列問題： （莫耳質量：$H_{2}SO_{4}$＝98，Pb＝207，$PbO_{2}$＝239，$PbSO_{4}$＝303） (1)寫出在放電時，陰極的半反應式。 (2)陽極的重量增加或減少多少克？（注意！要寫<u>增加</u>或<u>減少</u>）
  answer:
  - $PbO_{2}$＋$2e^{－}$＋$SO_{4}^{2－}$＋$4H^{＋}$ → $PbSO_{4}$＋$2H_{2}$O；(2)增加48 g
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 陰極發生還原反應，產物為$PbSO_{4}$。

    ①先寫出反應物與產物：$PbO_{2}$ → $PbSO_{4}$ ②計算氧化數變化：Pb：＋4 → ＋2，故得到兩個電子：$PbO_{2}$＋$2e^{－}$→ $PbSO_{4}$ ③必須有一個硫酸根，故須有4個$H^{＋}$平衡電荷：$PbO_{2}$＋$2e^{－}$＋$SO_{4}^{2－}$＋$4H^{＋}$ → $PbSO_{4}$ ④以$H_{2}$O平衡原子數：$PbO_{2}$＋$2e^{－}$＋$SO_{4}^{2－}$＋$4H^{＋}$ → $PbSO_{4}$＋$2H_{2}$O

    (2)陽極半反應：Pb＋$SO_{4}^{2－}$ → $PbSO_{4}$＋$2e^{－}$，放出1 mol電子則有0.5 mol的Pb → $PbSO_{4}$，故增加48 g。'
