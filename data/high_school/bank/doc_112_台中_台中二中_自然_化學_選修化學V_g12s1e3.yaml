questions:
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關質子交換膜型氫氧燃料電池的敘述，哪些正確？
  options:
  - label: A
    content: 可以充電，反覆使用
  - label: B
    content: 陰、陽電極均含有鉑
  - label: C
    content: 使用時，在陽極通入氧氣
  - label: D
    content: 每消耗1莫耳氧氣，亦有1莫耳氫氣反應
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)不可充電，但可補充燃料；(C)陽極氧化，通入氫氣；(D)反應式：$2H_{2}$＋$O_{2}$ → $2H_{2}$O，莫耳數比不為1：1。故選(B)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關碳鋅電池（乾電池）的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 以碳棒為陽極
  - label: B
    content: 陽極反應Zn → $Zn^{2＋}$＋$2e^{－}$
  - label: C
    content: $MnO_{2}$可除去碳棒表面附著的氫氣
  - label: D
    content: 放電時，$MnO_{2}$中的Mn氧化數由＋4 → ＋3
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)陽極發生氧化，材質為Zn。故選(A)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列何種電池在放電過程中，陰、陽極的重量均<u>不改變</u>？
  options:
  - label: A
    content: 鹼性乾電池
  - label: B
    content: 鉛蓄電池
  - label: C
    content: 氫氧燃料電池
  - label: D
    content: 一次鋰電池
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)陽極氧化Zn → $Zn^{2＋}$，重量減少，陰極還原$2MnO_{2}$ → $Mn_{2}O_{3}$，重量也減少；(B)陽極氧化Pb → $PbSO_{4}$，重量增加，陰極還原$PbO_{2}$ → $PbSO_{4}$，重量增加；(C)燃料電池電極為固體，只負責作為導電使用，故重量不變；(E)陽極氧化Li → $Li^{＋}$，重量減少，陰極還原$MnO_{2}$ → $LiMnO_{2}$，重量增加。故選(C)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列何者為氧化還原反應？
  options:
  - label: A
    content: $2HgCl_{2}$＋$SnCl_{2}$ → $Hg_{2}Cl_{2}$＋$SnCl_{4}$
  - label: B
    content: $CaCO_{3}$＋2HCl → $CaCl_{2}^{ }$＋$CO_{2}$＋$H_{2}$O
  - label: C
    content: $2CrO_{4}^{2－}$＋$2H^{＋}$ → $Cr_{2}O_{7}^{2－}$＋$H_{2}$O
  - label: D
    content: NaCl＋$AgNO_{3}$ → AgCl＋$NaNO_{3}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) Hg氧化數＋2 → ＋1，Sn氧化數＋2 → ＋4，為氧化還原反應；(B)(C)(D)無氧化數變化，不為氧化還原反應。故選(A)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 進行氧化還原滴定操作，下列何者<u>不是</u>反應的必要條件？
  options:
  - label: A
    content: 反應要能完全
  - label: B
    content: 反應速率不能太慢
  - label: C
    content: 要有明顯的顏色改變作為滴定完成的訊號
  - label: D
    content: 一定要加入指示劑以確定滴定終點
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)不一定要加指示劑，過錳酸鉀本身就有顏色變化，則不需要。故選(D)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列有關「碘滴定法」的各項性質敘述，何者正確？
  options:
  - label: A
    content: 碘滴定是利用碘離子與澱粉結合形成藍色物質之特性，作為滴定終點之判斷
  - label: B
    content: 直接滴定時，標準液為KI溶液
  - label: C
    content: 間接滴定時，需要使用標準液$Na_{2}S_{2}O_{3}$(aq)
  - label: D
    content: 深藍色消失時，即達直接滴定的滴定終點
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為碘分子；(B)直接滴定是以$I_{2}$（$I_{3}^{－}$）滴定還原劑；(C)(D)間接碘滴定先使用$I^{－}$將氧化劑還原，$I^{－}$被氧化成$I_{2}$，再將$I_{2}$與$Na_{2}S_{2}O_{3}$反應變回$I^{－}$，計算$Na_{2}S_{2}O_{3}$用量即可推算氧化劑量。故選(C)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 用已知濃度的酸性過錳酸鉀溶液滴定未知濃度的草酸溶液時，下列敘述何者正確？
  options:
  - label: A
    content: 若過錳酸鉀溶液以鹽酸酸化，則求出的草酸溶液濃度比實際值小
  - label: B
    content: 若過錳酸鉀溶液以硝酸酸化，則求出的草酸溶液濃度比實際值大
  - label: C
    content: 若過錳酸鉀溶液以稀硫酸酸化，則求出的草酸溶液濃度最接近實際值
  - label: D
    content: 進行滴定時，須將草酸溶液加熱，且溫度愈高愈好
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)以鹽酸酸化，$Cl^{－}$會被氧化而消耗掉部分的過錳酸鉀，如此便會用掉更多的過錳酸鉀，導致算出的濃度偏高；(B)以硝酸酸化，$NO_{3}^{－}$會作為氧化劑，如此便會用掉較少的過錳酸鉀，導致算出的濃度偏低；(D)溫度過高，草酸根會分解成碳酸根、一氧化碳。故選(C)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 設$2X^{－}$＋$Y_{2}$ → $2Y^{－}$＋$X_{2}$；$2X^{－}$＋$Z_{2}$ → $2Z^{－}$＋$X_{2}$；$2Z^{－}$＋$Y_{2}$ → 無反應；$2V^{－}$＋$Z_{2}$ → 無反應，上列還原劑強度之順序（由強至弱）為何？
  options:
  - label: A
    content: $X^{－}$＞$Y^{－}$＞$Z^{－}$＞$V^{－}$
  - label: B
    content: $Z^{－}$＞$V^{－}$＞$Y^{－}$＞$X^{－}$
  - label: C
    content: $V^{－}$＞$Z^{－}$＞$Y^{－}$＞$X^{－}$
  - label: D
    content: $V_{2}$＞$Z_{2}$＞$Y_{2}$＞$X_{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 比較還原力即比較向左、向右反應各自被氧化的物質。若反應利於向右，故左方的還原劑＞右方的還原劑，若不反應則反之。故可得還原劑強度：$X^{－}$＞$Y^{－}$、$X^{－}$＞$Z^{－}$、$Y^{－}$＞$Z^{－}$、$Z^{－}$＞$V^{－}$。故選(A)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列有關氧化數的敘述，何者正確？
  options:
  - label: A
    content: 金屬的氧化數必為正值，非金屬的氧化數必為負值
  - label: B
    content: 氧化數增加，表示該物質當氧化劑
  - label: C
    content: 若元素的平均氧化數為分數，表示此元素必有兩種（或以上）不同的氧化數
  - label: D
    content: 在化合物中，若某元素的氧化數為＋2，則該元素必帶有＋2電荷
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)非金屬氧化數可為正，例如$H_{2}$O中H為＋1；(B)氧化數增加代表發生氧化反應，本身為還原劑；(D)氧化數為假想電荷，不能代表該電荷必然的存在。故選(C)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 某非金屬元素X，其最高氧化數的氧化物之分子式為$XO_{3}$，則其最低氧化數的氫化物之分子式為何？
  options:
  - label: A
    content: XH
  - label: B
    content: $XH_{2}$
  - label: C
    content: $XH_{3}$
  - label: D
    content: $XH_{4}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $XO_{3}$中O氧化數＝－2，則X氧化數＝＋6。代表其為6A族元素，則最低氧化數＝族數－8＝－2，與H形成$XH_{2}$型態的化合物。故選(B)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 磷在鹼性溶液中，可發生自身氧化還原反應：$P_{4}$＋$OH^{－}$＋$H_{2}$O → $PH_{3}$＋$H_{2}PO_{2}^{－}$（未平衡），當完全反應時，所有磷中，當氧化劑者占所有磷的莫耳分率為多少？
  options:
  - label: A
    content: $\frac{2}{3}$
  - label: B
    content: $\frac{1}{4}$
  - label: C
    content: $\frac{1}{3}$
  - label: D
    content: $\frac{3}{4}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: P氧化數：$P_{4}$(0) → $PH_{3}$(－3)＋$H_{2}PO_{2}^{－}$(＋1)，故$PH_{3}$、$H_{2}PO_{2}^{－}$兩者係數比＝1：3。平衡後反應式：$P_{4}$＋$3OH^{－}$＋$3H_{2}$O → $PH_{3}$＋$3H_{2}PO_{2}^{－}$，作為氧化劑（被還原）者為$PH_{3}$，占$\frac{1}{4}$。故選(B)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 在Zn＋$HNO_{3}$ → Zn($NO_{3}$)$_{2}$＋$NH_{4}NO_{3}$＋$H_{2}$O反應中，被還原的$HNO_{3}$占所有$HNO_{3}$的比例為何？
  options:
  - label: A
    content: $\frac{1}{2}$
  - label: B
    content: $\frac{1}{4}$
  - label: C
    content: $\frac{1}{9}$
  - label: D
    content: $\frac{1}{10}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: Zn氧化（0 →＋2）、硝酸還原（＋5 →－3），故Zn：$NH_{4}NO_{3}$兩者係數比＝4：1。其餘物質係數再由原子不滅可得，4Zn＋$10HNO_{3}$ → 4Zn($NO_{3}$)$_{2}$＋$NH_{4}NO_{3}$＋$3H_{2}$O，被還原的$HNO_{3}$，占$\frac{1}{10}$。故選(D)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 在酸鹼反應中，草酸（$H_{2}C_{2}O_{4}$）為酸，在氧化還原反應中，草酸可以作為還原劑。已知某 $H_{2}C_{2}O_{4}$ 溶液 20 mL，以0.1 M NaOH溶液20 mL滴定達當量點。而在酸性條件下，該$H_{2}C_{2}O_{4}$溶液25 mL，以$KMnO_{4}$溶液25 mL滴定達當量點。此$KMnO_{4}$溶液的濃度為多少M？
  options:
  - label: A
    content: '0.005'
  - label: B
    content: '0.008'
  - label: C
    content: '0.01'
  - label: D
    content: '0.02'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 酸鹼滴定：2×C×20＝1×0.1×20，可得草酸濃度C＝0.05 M；氧化還原滴定：5×X×25＝2×0.05×25，可得過錳酸鉀濃度C＝0.02 M。故選(D)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 在500 mg $MnO_{2}$不純試樣中加入0.2 M酸性的$Fe^{2＋}$溶液40 mL，再以0.1 M二鉻酸鉀溶液進行反滴定，結果用去 $K_{2}Cr_{2}O_{7}$(aq) 10 mL，則該試樣中$MnO_{2}$所占的重量百分率為何？（式量：$MnO_{2}$＝87）
  options:
  - label: A
    content: 17.4％
  - label: B
    content: 34.5％
  - label: C
    content: 43.5％
  - label: D
    content: 52.5％
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 氧化劑總得電子數＝還原劑總失電子數，可得（$MnO_{2}$莫耳數）×2＋（$K_{2}Cr_{2}O_{7}$莫耳數）×6＝（$Fe^{2＋}$莫耳數）×1，進一步得（$MnO_{2}$莫耳數）×2＋0.1×0.01×6＝0.2×0.04×1，得$MnO_{2}$＝0.001 mol＝0.087 g＝87 mg。純度＝$\frac{87}{500}$×100％＝17.4％。故選(A)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 溴水(含$Br_{2}$) 2克與過量 KI 的酸性溶液反應，生成的碘再以標準濃度的$Na_{2}S_{2}O_{3}$溶液滴定，達當量點時共用去 0.3 M $Na_{2}S_{2}O_{3}$溶液40 mL，則原來溴水中含$Br_{2}$多少克？（原子量：Br＝80）
  options:
  - label: A
    content: '0.2'
  - label: B
    content: '0.4'
  - label: C
    content: '0.8'
  - label: D
    content: '0.96'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 間接碘滴定頭尾，碘離子並無消耗與生成，故$Br_{2}$得電子數＝$S_{2}O_{3}^{2－}$失電子數。則（$Br_{2}$莫耳數）×2＝（$S_{2}O_{3}^{2－}$莫耳數）×1，可得（$Br_{2}$莫耳數）×2＝0.3×0.04×1，得$Br_{2}$＝0.006 mol＝0.96 g。故選(D)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s2_16
  section: 2
  number: 16
  type: multiple
  page: 2
  stem: 當溶液之pH值變小時，下列各氧化劑中，哪些的氧化力會增強？
  options:
  - label: A
    content: $Cl_{2}$
  - label: B
    content: $K_{2}Cr_{2}O_{7}$
  - label: C
    content: $Fe^{3＋}$
  - label: D
    content: $KMnO_{4}$
  - label: E
    content: $H_{2}O_{2}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 寫出半反應式：(A) $Cl_{2}$＋$2e^{－}$ → $2Cl^{－}$；(B) $Cr_{2}O_{7}^{2－}$＋$14H^{＋}$＋$6e^{－}$ → $2Cr^{3＋}$＋$7H_{2}$O；(C) $Fe^{3＋}$＋$e^{－}$ → $Fe^{2＋}$； (D) $MnO_{4}^{－}$＋$8H^{＋}$＋$5e^{－}$ → $Mn^{2＋}$＋$4H_{2}$O；(E) $H_{2}O_{2}$＋$2H^{＋}$＋$2e^{－}$ → $2H_{2}$O，選出反應式左方有$H^{＋}$者。故選(B)(D)(E)。
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s2_17
  section: 2
  number: 17
  type: multiple
  page: 2
  stem: 小翰設計一個簡單的電池，放一鉻片於含有1.00 M Cr($NO_{3}$)$_{3}$ 溶液中，於另一含1.00 M $AgNO_{3}$ 溶液之燒杯中放入銀片，並以鹽橋連接兩燒杯中的溶液，如右圖所示。下列敘述何者正確？ （原子量：Cr＝52，Ag＝108）
  options:
  - label: A
    content: 鉻片為負極，銀片為正極
  - label: B
    content: 外線路之電子移動方向為由陽極移向陰極
  - label: C
    content: 溶液中的陽離子向鉻片方向移動
  - label: D
