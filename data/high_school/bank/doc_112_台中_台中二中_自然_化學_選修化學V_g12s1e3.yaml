  stem: 以氧化數法平衡下列反應式：（全對才給分）$Cr_{2}O_{7}^{2－}$＋$SO_{3}^{2－}$＋$H^{＋ }$→
  answer:
  - $Cr_{2}O_{7}^{2－}$＋$3SO_{3}^{2－}$＋$8H^{＋}$ → $2Cr^{3＋}$＋$3SO_{4}^{2－}$＋$4H_{2}$O
  answer_status: verified
  answer_source: answer_key
  explanation: '①先寫出產物：$Cr_{2}O_{7}^{2－}$＋$SO_{3}^{2－}$＋$H^{＋}$ → $Cr^{3＋}$＋$SO_{4}^{2－}$

    ②計算氧化數變化，Cr：＋6 → ＋3（有兩個Cr），S：＋4 → ＋6，則$Cr_{2}O_{7}^{2－}$：$SO_{3}^{2－}$係數比＝1：3， 即$Cr_{2}O_{7}^{2－}$＋$3SO_{3}^{2－}$＋$H^{＋}$ → $2Cr^{3＋}$＋$3SO_{4}^{2－}$

    ③以$H^{＋}$平衡電荷：$Cr_{2}O_{7}^{2－}$＋$3SO_{3}^{2－}$＋$8H^{＋}$ →$2Cr^{3＋}$＋$3SO_{4}^{2－}$

    ④以$H_{2}$O平衡原子數：$Cr_{2}O_{7}^{2－}$＋$3SO_{3}^{2－}$＋$8H^{＋}$ → $2Cr^{3＋}$＋$3SO_{4}^{2－}$＋$4H_{2}$O'
- id: doc_112_台中_台中二中_自然_化學_選修化學V_g12s1e3_s3_3
  section: 3
  number: 3
