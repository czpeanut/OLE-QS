  group_stem: 一隻貓怎麼能同時是死的又是活的？這是奥地利物理學家薛丁格在1935年提出的反問。在這之前，許多理論物理學家與數學家已經解答了量子力學的細節問題。主要的兩位理論提出者是波耳和海森堡，他們在哥本哈根共同研究，成果是後來大家所稱的「哥本哈根詮釋」。然而，薛丁格認為把哥本哈根詮釋應用於日常宏觀物體，會產生一些問題。 波耳和海森堡提出一項稱為量子疊加（quantum superposition）的理論。若一個粒子或光子可以處在兩種狀態（或位置）的其中一種，在實際觀察它之前，是無法知道這個粒子到底是處於哪一個狀態的；此時，疊加理論描述這個粒子兩種狀態同時存在。然而在觀察的當下，系統不再處於兩種不同狀態，而會塌縮為其中一種。所以只有觀察者才能決定粒子是在其中哪一種狀態。薛丁格不喜歡量子疊加這種想法，於是他以思想實驗點出其中的弔詭之處。 想像一隻貓被關進一個封閉的鋼製箱裡。箱內裝置有少許的放射性物質，一台蓋革計數器和一個裝有致命氰化氫的燒瓶。假使放射性物質中的一個原子發生了衰變，偵測到衰變的蓋革計數器會啟動繼電器，導致箱內的榔頭打破這個含氰化氫的燒瓶，釋放毒氣，然後殺死貓。放射性原子完全不可預測，在箱內的放射性原子也許下一秒鐘就發生衰變，也許過一年都不會。因此既然沒有人知道箱子裡的狀況為何，也就沒有人知道半小時後這個原子是否已經衰變。根據量子疊加理論，此時這個原子既處於完整狀態，也處於衰變狀態。不過這也代表貓既是死的也是活的，直到觀察者打開箱子一探究竟為止。薛丁格認為生死需要由觀察者決定相當不合理，在真實世界，量子疊加理論顯得荒謬可笑。 有些人認為這隻貓本身就是觀察者，牠知道原子是否衰變。波耳則認為不一定需要有一位觀察者存在，他認為蓋革計數器的記錄即可呈現原子是否衰變，蓋革計數器就是一位觀察者，因此在任何人打開蓋子之前，這隻貓早就已經決定生或死了。不過這種想法並未獲得薛丁格與愛因斯坦的認同。 其他科學家也提出許多不同的量子力學詮釋，例如1957年艾弗雷特提出「多世界詮釋」，認為宇宙的數量很龐大，每一件可能發生的事都已經發生了，不是發生在這個宇宙，就是在發生在別的宇宙。這個理論解釋，當薛丁格的箱子一被打開，觀察者、這隻貓和宇宙立即一分為二，在某個宇宙，觀察者看到一隻活貓，而在另一個宇宙，觀察者看到一隻死貓。但這兩個不同宇宙中的相同觀察者再也不會相遇或交流了。從此以後，大家對於這個思想實驗不斷爭論，薛丁格的貓已變得世界知名，牠是量子力學界最受歡迎的動物。改寫自《薛丁格的貓：50個改變歷史的物理學實驗》，作者Adam H. Davis 請根據上文敘述及課堂所學知識，回答以下問題：
