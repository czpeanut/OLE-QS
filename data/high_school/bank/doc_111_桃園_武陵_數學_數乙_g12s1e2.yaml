- id: doc_111_桃園_武陵_數學_數乙_g12s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設實係數三次函數 $f(x) = ax^3+bx^2+cx+d$ 嚴格遞減，且其圖形的反曲點在 $y$ 軸右側、與 $y$ 軸交於正向，請選出正確的選項。
  options:
  - label: A
    content: a > 0
  - label: B
    content: b > 0
  - label: C
    content: c > 0
  - label: D
    content: d > 0
  - label: E
    content: $b^{2}$－3ac > 0
  tags:
    unit:
      code: MA-Y1-2-2
      book: 選修數學乙（上）
      chapter: 微分
      title: 函數性質的判定
      std: true
    textbook: 選修數學乙（上） 函數性質的判定
    pattern:
      key: MA-Y1-2-2:T03
      name: 凹向性、反曲點與係數判別
    labeled_by: agent
    label_confidence: high
    label_note: 題目敘述「其圖形如右」但缺少附圖，無法判別反曲點位置及y截距等係數b、c、d之正負
    fixed_by: agent
    fix_note: （人工修正：補充反曲點與 y 截距位置條件取代缺圖，補齊答案與解析）
  difficulty: 3
  explanation: 因三次函數嚴格遞減，故 $a < 0$ 且 $f'(x) = 3ax^2+2bx+c \le 0$ 恆成立，即 $b^2-3ac \le 0$（(A)(E) 均錯）。反曲點橫坐標 $-\frac{b}{3a} > 0$ 且 $a<0$，故 $b > 0$（(B) 正確）。又 $b^2-3ac \le 0$ 且 $a<0$ 得 $c \le \frac{b^2}{3a} < 0$（(C) 錯）。與 $y$ 軸交於正向得 $f(0) = d > 0$（(D) 正確）。選 (B)(D)。
  answer_status: ai_generated
  answer_source: agent
  answer:
  - B
  - D
