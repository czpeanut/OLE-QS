    content: 動脈硬化和飲食相關，和血管細胞老化無關
  group_stem: ◎ 人會老化是因為細胞會老化，其中一項重要的原因是細胞分裂的次數有其極限。正常情況下，年輕的細胞發生細胞損傷或死亡時，周圍的細胞會繼續分裂來填補其空位；若細胞已老化達到分裂極限，而無法産生新細胞來填補其空位時，就會引發其他的生理疾病產生。 細胞分裂的能力，由染色體尾端一段稱為「端粒」的DNA片段來控制。端粒是一段由鹼基序列「TTAGGG」重複單位排列形成的片段，新生兒的細胞約重複2000次以上，但隨著細胞分裂的次數增加，端粒的長度便變短，當短到某個程度時，細胞就不再分裂。 有一種酵素稱為「端粒酶」，它擁有與端粒DNA鹼基重複單位互補的RNA鹼基序列，可以延長端粒的DNA鹼基序列，故得以延長細胞的分裂次數，在人類的DNA中具有「端粒酶」基因，但研究發現，除了在生殖細胞、幹細胞和少數細胞的端粒酶基因是處於開啟的狀態之外，其他部位細胞的端粒酶基因都是處於關閉的狀態。 科學家利用端粒酶基因及促進細胞增殖的病毒基因培養細胞，讓原本只能分裂65次的細胞，居然分裂了200次還不老化，當然這些細胞若受傷，還是會死亡。由於癌細胞是利用端粒酶，讓自己獲得無限增殖的能力，研究者將這些不老化的細胞移植至實驗小鼠體内現，發現這些細胞並未癌化，故與癌細胞不同。如能將不老化細胞取代血管的老化細胞，則可能預防動脈硬化等血管疾病，此發現對於未來醫療應用，有著可觀的影響。 請依據上文回答第39～41題：
