- id: doc_110_嘉義_永慶_自然_生物_g10s1e2_s3_37
  section: 3
  number: 37
  type: single
  page: 3
  stem: 下列與杭丁頓舞蹈症相關的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 若父母皆正常，則子女得病機率0%
  - label: B
    content: 若父母一方帶有一個異常基因，子女得病機率50%
  - label: C
    content: 患病機率與性別無關
  - label: D
    content: 若父母皆有病，子女女得病機率100%
  group_stem: 杭丁頓氏舞蹈症（Huntington’s Discase）是一種腦部退化疾病，屬於體染色體顯性遺傳疾病。該疾病是因第4對染色體上基因的CAG三核苷酸重複出現次數過多，正常人的CAG序列重複的數目少於26個，但所有此症患者的CAG重複目均大於37個，而且CAG重複的數目和此症的發病年齡成反比，亦即重複的數目愈多發病的年齡愈早，患者大多在40歲左右發病。由於基因產物的異常，使得腦部和運動有關的神經一直處於興奮狀態而無法被抑制，因此會產生手足不協調的不自主運動、臉部輕微抽搐、坐立不安等動作，隨著病情的惡化接著會出現齒口不清、吞嚥困難、失禁智力退化及憂鬱易怒等症狀。1872年，英國醫師喬治杭丁頓（Jorge Huntington）發表的相關報告，讓世人對此疾病有深入的認識，但目前尚無有效的治療藥物。 請依據上文及背景知識回答第37、38題：
  answer:
  - D
