- id: doc_110_嘉義_永慶_自然_生物_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有關<u>孟德爾</u>的遺傳實驗，下列敘述何者正確？
  options:
  - label: A
    content: 如果<u>孟德爾</u>所選擇之種子顏色基因與種子形狀基因正好在同一條染色體上，則這兩種性狀雜交的子代就無法遵循「獨立分配律」
  - label: B
    content: 如果<u>孟德爾</u>取任一第二子代（$F_{2}$）的圓形種子與皺皮種子的豌豆進行交配，則所產生的後代圓形種子與皺皮種子的數量比必定趨近1：1
  - label: C
    content: <u>孟德爾</u>的實驗结果之所以能符合分離律，主要由於豌豆植株在自然狀態下為異花授粉
  - label: D
    content: 僅豌豆的遺傳性狀符合孟德爾遺傳定律
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
