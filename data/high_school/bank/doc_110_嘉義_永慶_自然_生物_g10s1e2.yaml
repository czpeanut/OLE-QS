  stem: 下列何者屬於<u>孟德爾</u>的獨立分配律？
  options:
  - label: A
    content: 一種遺傳性狀由一對等位基因控制，控制一種性狀的基因有顯、隱性之分
  - label: B
    content: 當顯、性等位基因組合在一起，只有顯性的表徵可以表現出來
  - label: C
    content: 減數分裂形成配子時，控制一種性狀的等位基因必互相分離至不同的配子中
  - label: D
    content: 減數分裂形成配子時，非等位基因會隨機組合至同一配子中
  answer:
  - D
