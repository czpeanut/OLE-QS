  stem: 以下為當時擔任福建巡撫劉銘傳與擔任道臺職務的劉璈的資料： 資料一：「法人之役，劉銘傳治軍臺北，而劉璈駐南，皆有經國之才。使璈不以罪去，輔佐巡撫，以經理臺疆，南北俱舉，必有可觀。而銘傳竟不能容之。非才之難，而所以用之者實難，有以哉。」 資料二：「臺灣三百年間，吏才不少；而能立長治之策者，厥為兩人；曰陳參軍永華，曰劉巡撫銘傳，是皆有大勳勞於國家者也。」 資料三：詩人對劉銘傳評論「自古眾志方成城，不聞鐵車（火車）與敵戰。又況勞民復傷財，民窮財盡滋內息。」 我們如何理解這三段資料？
