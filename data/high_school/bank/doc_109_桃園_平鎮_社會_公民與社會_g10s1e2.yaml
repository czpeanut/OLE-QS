  group_stem: '【資料一】 針對同性婚姻議題，大法官於2017年5月24日作出釋字第748號解釋，解釋理由中指出，<u>憲法明定「中華民國人民，無分男女、宗教、種族、階級、黨派」禁止任意差別對待的事由，認定民法親屬編婚姻限制同性得為經營共同生活之目的，成立具親密性、排他性的永久結合關係，有違憲法保障●●權，宣告違憲</u>，並要求有關機關在兩年內修正或制定相關法律，若立法屆時未完成，同志得依《民法》規定至戶政機關辦結婚登記。此外，現行《民法》婚姻章未規定異性二人結婚必須「具有生育能力」，繁衍後代不是婚姻不可或缺的要素，若依「同性的兩人無法自然繁衍後代，同婚合法化將降低國內生育率」限制同婚，也是不合理的差別待遇。【資料來源：王宏舜（2017年5月25日）。大法官釋憲：限制同婚違憲。聯合報。取自：http://udn.com/news/story/10966/2483662】

    【資料二】 為何反對同性婚姻，發起愛家公投之下一代幸福聯盟網站提出的其中一項理由是少子化問題，網站明載「同性婚姻不具自然生育的可能性，不利於臺灣的家庭延續與人口發展」。對於「少子化」控訴，段宜康列出各國從2000年至今的生育率列表打臉，表示排在臺灣前面的20多國都是同性婚姻已合法化的國家。全世界最早同性婚姻合法化的荷蘭則是一直維持得差不多，反觀臺灣，從2000年到現在同性婚姻都不合法，但生育率下降了30%以上。「同婚合不合法，跟生育率有必然關係嗎？」段宜康批。 但除生育率外，反同婚團體也提出其他疑慮，例如「同性婚姻不符合未成年子女的最佳利益」、「歐洲人權法院未作出定論，臺灣不應成為華人地區第一隻白老鼠」等。不難發現的是對於同婚議題，雙方各有立場，但面對如此具爭議性的議題，應該如何進行對話與溝通，並將政策或法案做到盡善盡美，是臺灣人民共同的期待也是我們必須好好學習的課題。【資料來源：謝孟穎（2018年11月4日）《平權公投辯論》同婚合法化會加劇少子化？段宜康打臉：台灣現在生育率就遠低於同婚國家！。風傳媒。取自：https://www.storm.mg/article/593932?page=1】【資料來源：下一代幸福聯盟。維護家庭價值、反對同性婚姻入法。取自：https://taiwanfarily.com/related-posts/article02】'
