- id: doc_110_台北_松山_數學_數甲_g12s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 某高中英文單字比賽，試卷題目有 50 題，每道題目都是 4 選 1 的單選題，答對 1 題得 2 分，答錯不倒扣。今某生每題都從 4 個選項中隨機選 1 個答案作答，設隨機變數 X 為該生答對的題數，隨機變數 Y 為該生的試卷分數。試選出正確的選項。
  options:
  - label: A
    content: P（X＝24）＞P（X＝25）
  - label: B
    content: P（X＝2）＝P（Y＝1）
  - label: C
    content: E（X）＝10
  - label: D
    content: E（Y）＝2E（X）
  - label: E
    content: Var（Y）＝2Var（X）
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵P（X＝k）＝$C_{k}^{50} \left( \frac{1}{4} \right) ^{k} \left( \frac{3}{4} \right) ^{50 -k}$

    ∵E（X）＝np＝$50\times \frac{1}{4}$＝12.5

    ∴k 愈接近 12.5 時，P（X＝k）愈大

    ∴P（X＝24）＞P（X＝25）

    (B)╳：∵答對 1 題得 2 分

    ∴P（X＝2）＝P（得到 4 分）＝P（Y＝4）

    (C)╳：∵E（X）＝np＝$50\times \frac{1}{4}$＝12.5

    (D)○：∵Y＝2X ∴E（Y）＝E（2X）＝2E（X）

    (E)╳：∵Y＝2X ∴Var（Y）＝Var（2X）＝$2^{2}$×Var（X）＝4Var（X）

    故選(A)(D)'
