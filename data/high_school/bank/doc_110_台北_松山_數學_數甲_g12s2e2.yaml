- id: doc_110_台北_松山_數學_數甲_g12s2e2_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: '一袋中有編號 1 號球 1 顆、2 號球 2 顆、3 號球 4 顆、4 號球 2 顆、5 號球 1 顆，每顆球被抽出的機會相等。今隨機從袋中抽出 1 球，設隨機變數 X 為抽出的號碼，則：

    (1) 期望值 E（X）＝＿＿＿＿。

    (2) 標準差$\sqrt{Var(X)}$＝＿＿＿＿。'
  answer:
  - (1) 3；(2)$\frac{\sqrt{30}}{5}$
  answer_status: verified
  answer_source: answer_key
  explanation: '球：①②②③③③③④④⑤

    (1) E（X）＝$\frac{1}{10}\times 1 +\frac{2}{10}\times 2 +\frac{4}{10}\times 3 +\frac{2}{10}\times 4 +\frac{1}{10}\times 5$＝$\frac{1 + 4 + 12 + 8 + 5}{10}$＝$\frac{30}{10}$＝3

    (2) Var（X）＝$(1 - 3)^{2}\times \frac{1}{10}+(2 - 3)^{2}\times \frac{2}{10}+(3 - 3)^{2}\times \frac{4}{10}+(4 - 3)^{2}\times \frac{2}{10}+(5 - 3)^{2}\times \frac{1}{10}$

    ＝$\frac{6}{5}$

    ∴$\sqrt{Var(X)} = \sqrt{\frac{6}{5}} =\frac{\sqrt{30}}{5}$

    〈另解〉

    ∵E（$X^{2}$）＝$\frac{1}{10}\times 1^{2}+\frac{2}{10}\times 2^{2}+\frac{4}{10}\times 3^{2}+\frac{2}{10}\times 4^{2}+\frac{1}{10}\times 5^{2}$＝$\frac{1 + 8 + 36 + 32 + 25}{10}$＝$\frac{102}{10}$＝$\frac{51}{5}$

    ∵$\sqrt{Var(X)}$＝$\sqrt{E(X^{2})-(E(X))^{2}}$＝$\sqrt{\frac{51}{5}- 3^{2}}$＝$\sqrt{\frac{51 - 45}{5}}$＝$\sqrt{\frac{6}{5}}$＝$\frac{\sqrt{30}}{5}$'
