- id: doc_110_台北_松山_數學_數甲_g12s2e2_s3_5
  section: 3
  number: 5
  type: fill
  page: 3
  stem: 依據過往數據統計，某生罰球命中率為 0.6。今連續罰球 20 球，每次進球與否不互相影響，則罰球進球數的期望值為＿＿＿＿。
  explanation: '令罰球進球數為隨機變數 X

    ∵X～B（n，p）＝B（20，0.6）

