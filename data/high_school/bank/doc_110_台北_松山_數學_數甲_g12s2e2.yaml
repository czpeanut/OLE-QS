  stem: 為慶祝學校全中運榮獲佳績，合作社推出折扣優惠，只要消費滿 100 元就可以從摸彩箱中抽出 1 張彩券決定折扣數，每張彩券被抽出的機會相等。今摸彩箱中已經放入 4 張彩券，分別為 1 張 5 折、1 張 75 折、2 張 9 折。設隨機變數 X 為消費 100 元的顧客在折扣後需要支付的金額（元），若合作社想再加入 1 張彩券使得 X 的期望值等於 78 元，則所加入的那張彩券所代表的折扣數為＿＿＿＿折。
