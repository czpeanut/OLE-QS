- id: doc_110_台北_松山_數學_數甲_g12s2e2_s3_6
  section: 3
  number: 6
  type: fill
  page: 3
  stem: '夜市遊戲射飛鏢，玩家花 10 元可得到 5 支飛鏢，依照玩家射中水球球數給獎，每支飛鏢最多射中 1 顆水球。已知某人射中水球的機率為$\frac{3}{4}$，則：

    (1) 5 支飛鏢中，射中＿＿＿＿顆水球，機率最大。

    (2) 至少射中 1 顆水球的機率為＿＿＿＿。'
  explanation: '設射中水球的球數為隨機變數 X

    ∴X～B（n，p）＝$B\left( 5 , \frac{3}{4} \right)$

    (1)∵E（X）＝np＝$5\times \frac{3}{4}$＝$\frac{15}{4}$＝3.75

    ∴射中 4 顆水球的機率最大

    (2)∵P（X＝0）＋P（X＝1）＋P（X＝2）＋P（X＝3）＋P（X＝4）＋P（X＝5）＝1

    ∴P（X＝0）＋P（X$\geq$1）＝1

    $\Rightarrow$P（X$\geq$1）＝1－P（X＝0）＝$1 -\left( \frac{1}{4} \right) ^{5}$＝$1 -\frac{1}{1024}$＝$\frac{1023}{1024}$'
- id: doc_110_台北_松山_數學_數甲_g12s2e2_s3_7
  section: 3
  number: 7
  type: fill
  page: 3
  stem: 有一機器人從數線的原點出發。今同時擲兩枚硬幣，出現兩枚正面，則機器人向右前進 1 單位（＋1），若出現一正一反或兩枚反面，則機器人向左前進 1 單位（－1）。今連續投擲兩枚硬幣 4 次，機器人停留在坐標 2 的機率為＿＿＿＿。
  explanation: '設機器人向右走 x 次，向左走 y 次

    ∵$\begin{cases}x\times 1+y\times (- 1)= 2\cdots \cdots \cdots \cdots \cdots ① \\ x +y = 4 \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①＋②得 2x＝6

    ∴x＝3，y＝1

    ∴p＝$C_{3}^{4}\times \left( \frac{1}{4} \right) ^{3}\times \left( \frac{3}{4} \right) ^{1}$＝$4\times \frac{1}{4^{3}}\times \frac{3}{4}$＝$\frac{3}{64}$'
- id: doc_110_台北_松山_數學_數甲_g12s2e2_s3_8
  section: 3
  number: 8
  type: fill
  page: 3
  stem: 設隨機變數 X 是二項分布，即 X～B（n，p），且期望值 E（2X）＝16，變異數 Var（－3X＋2）＝54，則數對（n，p）＝＿＿＿＿。
  explanation: '∵16＝E（2X）＝2．E（X）＝2×np ∴np＝8 ………………………………①

    又 54＝Var（－3X＋2）＝（－3）$^{2}$×Var（X）＝9×np×（1－p） ……………②

    由①代入②得 6＝8×（1－p）

    ∴1－p＝$\frac{3}{4}\Rightarrow$p＝$\frac{1}{4}$代入①

    ∴$n\times \frac{1}{4}$＝8$\Rightarrow$n＝32

    故數對（n，p）＝$\left( 32 , \frac{1}{4} \right)$'
