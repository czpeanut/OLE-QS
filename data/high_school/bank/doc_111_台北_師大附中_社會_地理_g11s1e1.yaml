  stem: 資料一中的洋流、景觀與現象分別為何？（一格 1 分，共 3 分）
  group_stem: '資料一：澳洲東北部在 2019 年 2 月因豪雨成災，造成包括昆士蘭在內多處地區，尤其以唐斯維災情最嚴重（如右圖所示）。夾帶著泥沙等沉積物的洪水進入海洋，正循著 洋流影響附近的海域內，引發絕美景色 生態危機。2022 年 8 月，世界氣象組織宣布太平洋連續第三年出現「 現象」，並且將持續至年底，預估北半球冬、南半球夏天可能將再現異常天候，澳洲新南威爾斯省已發出警告近年夏天可能再度面臨漫長豪雨的暴洪季節。

    資料二：印度洋偶極（Indian Ocean Dipole, IOD）是指印度洋熱帶區域西側與東側之間的海洋表面溫度差異持續變化的現象，當西印度洋的海表溫較暖而東印度洋較冷時，印度洋偶極處於正相位。反之，則處於負相位。IOD 處於正相位時，澳洲冬季與春季部分地區的降雨量會減少，且澳洲南部的氣溫會高於平均。反之，通常當 IOD 處於負相位時，澳洲冬季與春季部分地區的降雨量會高於氣候平均值。

    資料三：澳洲 2019 ～ 2020 年野火是澳洲近年來最嚴重的野火事件。自 2017 年以來長期的乾燥環境，加上強勁的風，建構易燃的環境，野火季提早到來，雷擊和各種因素造成同時有多處起火點，導致火勢難以撲滅，持續延燒數個月，內陸地區的高溫火苗不斷竄燒往沿海地帶，其中以新南威爾斯省由於最為嚴重。大火讓很多動物接近滅絕或者已經滅絕，即使是倖存下來的動物，無論是逃脫還是留在原處，也可能死於脫水或飢餓。在南澳洲沿海的袋鼠島以獨特的動物種類而聞名，島上成千上萬的袋鼠和無尾熊在大火中喪失，專家們對島上瀕臨絕種的物種表示擔憂，同時，成千上萬的農場動物也死在大火中。

    參考資料一～資料三。請問：'
