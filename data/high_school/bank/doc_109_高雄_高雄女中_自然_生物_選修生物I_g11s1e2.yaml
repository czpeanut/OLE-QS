  type: single
  page: 1
  stem: 有關「肺炎雙球菌對鼠的影響」的敘述，下列何者<u>不正確</u>？
  options:
  - label: A
    content: 平滑型注射入鼠體易引起鼠死亡，粗糙型注射入鼠體則不易引起鼠死亡
  - label: B
    content: 將平滑型（有莢膜）菌體與以熱處理過的粗糙型菌體一同注射入鼠體，鼠易死亡
  - label: C
    content: 格里夫茲推論：死亡的平滑型肺炎雙球菌具某種物質，可使粗糙型肺炎雙球菌所產生的後代之遺傳性狀改變為平滑型肺炎雙球菌
  - label: D
    content: 現已知該遺傳性狀的改變是由有性生殖所引起的
