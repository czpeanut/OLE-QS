  page: 1
  stem: 附圖的甲位置具有環狀的粒線體DNA，是目前遺傳疾病、親源關係鑑定的重要工具。柯南在某個火災現場發現一具屍體A，經過檢測後，找到其毛囊細胞的粒線體中具有一段特殊的DNA序列。請問此段DNA序列還可能在哪些細胞中發現？（多選題）
  options:
  - label: A
    content: 屍體A的神經細胞
  - label: B
    content: 屍體A父親的精細胞
  - label: C
    content: 屍體A母親的卵細胞
  - label: D
    content: 屍體A哥哥的肌肉細胞
  - label: E
    content: 屍體A爺爺的皮膜細胞
  group_stem: 附圖為粒線體的示意圖，請回答下列問題：
