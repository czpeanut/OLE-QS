  stem: 下列有關鈉鉀幫浦（$Na^{＋}$／$K^{＋}$pump）之敘述，何者正確？
  options:
  - label: A
    content: 存在於所有的真核細胞
  - label: B
    content: 在細胞膜上的位置是固定不動的
  - label: C
    content: 運作時需要靠ATP水解提供能量
  - label: D
    content: 每運行一次可將3個鈉離子送入細胞內，並將2個鉀離子排出細胞外
- id: doc_109_高雄_高雄女中_自然_生物_選修生物I_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 木質醋酸菌（Gluconacetobacter xylinus）為一種細菌，可利用椰子汁中的醣類，在有氧氣的狀態下產生醋酸與細菌纖維素，細菌纖維素聚集成纖維網，可用來避免其他雜菌的汙染與干擾，並降低紫外線的殺菌作用，時間久了產生厚厚的物質，也就是椰果。關於木質醋酸菌製造椰果的過程，下列敘述何者正確？
  options:
  - label: A
    content: 會產生ATP
  - label: B
    content: 屬於一種有氧的發酵作用
  - label: C
    content: 細菌纖維素會干擾木質醋酸菌菌體之生長
  - label: D
    content: 在木質醋酸菌的粒線體中發生
- id: doc_109_高雄_高雄女中_自然_生物_選修生物I_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 比較酵母菌與人類的骨骼肌細胞在缺氧狀態下的生理反應，下列敘述何者正確？
  options:
  - label: A
    content: 皆可在粒線體基質中產生$NAD^{＋}$
  - label: B
    content: 皆可在粒線體基質中產生乙醯輔酶A
  - label: C
    content: 皆可在細胞質中產生丙酮酸
  - label: D
    content: 皆可在細胞質中產生二氧化碳
- id: doc_109_高雄_高雄女中_自然_生物_選修生物I_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 粒線體為真核細胞中重要的能量工廠，透過行有氧呼吸可獲得大量的ATP。下列有關於粒線體構造及有氧呼吸的敘述，哪些正確？
  options:
  - label: A
    content: 具有雙層膜，內、外膜皆平滑
  - label: B
    content: 丙酮酸在甲中被合成
  - label: C
    content: 乙為粒線體內膜，成分為磷脂質
  - label: D
    content: 丙為粒線體外膜，$FADH_{2}$丙的膜上產生
  - label: E
    content: $O_{2}$必須參與在粒線體內進行的呼吸作用
  group_stem: 附圖為粒線體的示意圖，請回答下列問題：
