- id: doc_109_高雄_高雄女中_自然_生物_選修生物I_g11s1e2_s2_43
  section: 2
  number: 43
  type: multiple
  page: 7
  stem: 有關揭祕囊泡運輸的三位科學家，他們的貢獻分別為何？（多選）
  options:
  - label: A
    content: 羅斯曼發現蛋白質複合物可以使得囊泡與目的地的生物膜相互融合
  - label: B
    content: 蘇德霍夫的研究揭示鈣離子是如何調控這整個過程
  - label: C
    content: 薛克曼研究如何將神經傳遞物質從一個神經細胞傳遞到另一個
  - label: D
    content: 薛克曼發現神經傳遞物質在細胞中存在的位置
  - label: E
    content: 蘇德霍夫發現鈣離子的濃度與神經傳遞的過程有關
  group_stem: 細胞是構成生命的基本單位。在這個複雜的生命單位中，每一分每一秒都在生產及運輸維繫生命基本功能所需要的各種蛋白質。2013年十月諾貝爾醫學獎委員會宣布，這個生物醫學界最高榮譽的獎項，由三位科學家共享，表彰他們對細胞運輸機制的發現。 在1970年代，科學家對於蛋白質輸送機制不了解，僅止於猜測的階段，薛克曼博士認為單細胞的酵母菌應該也需要運輸維繫它生長所需要的蛋白質，所以瞭解酵母菌如何運送蛋白質或許可以用來解釋高等生物細胞運送的機制。他發現，在篩選出來一系列輸送蛋白質過程有所缺失的酵母菌中，有些突變株會在細胞內特定地點累積「囊胞（vesjcles）」。接著，薛克曼博士開始針對這些蛋白輸送發生突變的酵母菌菌株進行基因的選殖，這一系列的發現，是當今生物醫學對囊胞傳遞機制了解的開始。如同薛克曼博士原本的臆測，這些參與在囊胞傳遞的基因，的確在人類細胞中存在著它們的同源基因，而且也運用同樣的邏輯參與著囊胞傳遞。 藉由「囊胞」來傳遞的人類蛋白質又如何能夠精準地送往該去的地點呢？羅斯曼博士在1980到1990年之間研究哺乳動物細胞的囊胞傳遞系統，他發現了特定的蛋白質聚合體可以指導囊胞選定正確的胞器進行作用，接著囊胞才會接著與目標胞器的膜進行融合。囊胞與目標胞器上分別坐落著這些辨識蛋白質叫做SNARE，辨識確認後所形成的這些蛋白質聚合體會開始改變結構，就好像拉鍊般的緊密結合，運用這股力量將兩邊的膜越拉越近最後融合在一起。 接著要談的是細胞在輸送蛋白質的時機。蘇德霍夫博士是神經生物學家，他有興趣的問題是神經細胞彼此如何溝通。神經傳導物質被包裹在特定的囊胞中，釋放的機制跟薛克曼博士和羅斯曼博士發現的囊胞傳遞機制基本上採用相同的邏輯，但是神經傳導物質的釋放會借由訊息來傳給下一個細胞，其中一個重要的訊息就是鈣離子的濃度。蘇德霍夫博士的研究闡釋了鈣離子如何進入細胞，進而調控攜帶神經傳導物質的囊胞與細胞膜融合，對細胞運用囊胞傳遞的時空調控提供了基本概念。 因囊胞傳遞機制出問題所導致的人類疾病相當多，一般來說大多與色素減退，細胞免疫及神經系統異常疾病有關。以參與細胞內囊胞生成的蛋白為例，COPII的變異會造成膠原沈著缺陷的罕見邊傳性疾病CLSD（Cranio-Lenticulo-Sutural Dysplasia）或乳糜微粒駐留病（Chylomicron retention disease），另一種稱為AP3的囊胞變異會造成一種和白化症相關的遺傳性疾病HPS（Hermansky-Pudlak
    syndrome），參與囊胞融合機制的蛋白如Rab27功能受損，會造成第二型格里塞利綜合症，有免疫系統和皮膚色素和毛髮減退等問題，SNARE蛋白的突變則多與神經方面的疾病有關。除此之外，細胞內運輸的問題也出現在其它多重病因造成的疾病上，比如說有部份的第二型糖尿病的成因是源自胰島素的接受器Glut4在運輸上出現問題所導致，又如早發性家族遺傳的阿茲海莫症病人是因為APP（amyIoid precursor protein）蛋白無法有效率地從內質網這個胞器輸出，以致於累積在內質網所導致。此外，有些特定細胞在運送物質是有方向性的．這種所謂極性運輸若調節出現問題，則常會造成腎小管細胞、肝細胞、和內耳細胞的異常突出等。 （本文節錄自：臺灣癌症防治網http://web.teef.org.tw/lib/addon.php?act=post&id=3481）
