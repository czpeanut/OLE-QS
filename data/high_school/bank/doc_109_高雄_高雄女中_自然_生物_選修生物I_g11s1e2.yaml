    content: 呼吸作用產生的ATP可以在粒線體中長期儲存
  - label: D
    content: 生化合成與主動運輸所消耗的能量直接來自ATP
  - label: E
    content: 生化合成過程中，可以將其他生物的脂肪變成人體的脂肪，並不需要經過任何型態轉變、能量消耗
