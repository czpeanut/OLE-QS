- id: doc_109_高雄_高雄女中_自然_生物_選修生物I_g11s1e2_s2_41
  section: 2
  number: 41
  type: single
  page: 6
  stem: 由附圖A可知將類囊體照光處理時，浸液中的pH值會上升。可推測光合作用的電子傳遞鏈進行時，$H^{＋}$會累積在何處？
  options:
  - label: A
    content: 粒線體的膜間腔
  - label: B
    content: 葉綠體基質
  - label: C
    content: 類囊體腔
  - label: D
    content: 葉綠體內膜
  group_stem: '粒線體內膜與葉絲體類囊體膜都是利用膜上的電子傳遞鏈，形成膜兩側的質子濃度梯度，再利用化學滲透的機制形成ATP。粒線體內膜最終的電子由氧氣來接收，故此過程稱為氧化磷酸化；葉綠體類囊體膜需照光提供能量來源，故此過程稱為光合磷酸化。1963年A. Jagendorf發現照光的類囊體膜會吸收浸液中的質子，使浸液中pH增加（附圖A）。1966年更進一步設計一個簡單有趣的實驗（附圖B），證明類囊體膜在缺乏光能下，也能利用質子濃度差趨使ATP形成。他的實驗方法如下：先分離出類囊體，將其放置於pH＝4的酸性溶液中，待膜內外酸鹼度平衡後，再將類囊體移至pH＝8的溶液中，藉此建立類囊體膜兩側的質子濃度梯度。之後在黑暗中加入ADP和Pi，結果溶液中馬上產生了大量的ATP。

    (A)發現 (B)實驗過程'
  shared_asset: g2_41_42
