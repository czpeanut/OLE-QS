  stem: 下列有關細胞能量的使用敘述，哪些正確？
  options:
  - label: A
    content: 葡萄糖、脂質、蛋白質含有很多能量，可以直接提供細胞進行生理活動，如囊泡運輸
  - label: B
    content: 若想將葡萄糖中的能量完全釋出，必須透過電子傳遞鏈慢慢釋放能量
