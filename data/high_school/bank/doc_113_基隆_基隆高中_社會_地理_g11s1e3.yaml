- id: doc_113_基隆_基隆高中_社會_地理_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 1994 年開啟《北美自由貿易協定》後，美墨邊境便陸續出現由兩國共同運行的「雙子城」工業區，例如艾帕索－華雷斯邊境經濟合作區，長久下來已建立起緊密的分工體系，亦吸引各國企業競相進駐。請根據兩國所擁有的優勢判斷，在墨西哥投資設廠的企業大多會是何種類型的產業？
  options:
  - label: A
    content: 高耗能產業如煉鋁、電鍍
  - label: B
    content: 原料導向產業如水泥、鋼鐵
  - label: C
    content: 技術密集型如生物科技、航太
  - label: D
    content: 勞力密集型如成衣、電子裝配
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '墨西哥的最大優勢為勞力眾多、工資低廉，適合發展勞力密集型產業。故選(D)。

    13.100°W 為南北向，因此應為雨量分界。(C)此為美國 500 mm 雨量分界，以西進入乾燥氣候。

    14.三角貿易起點為自歐洲輸出珠寶、槍砲→西非輸出勞力→中美洲資源輸回歐洲。故選(A)。

    15.阿茲特克為(C)墨西哥北部的古印第安文明所在。

    16.開採雨林會造成森林呼吸作用降低、土壤沖蝕，但不會造成(丙)大規模降水狀態改變；且熱帶雨林區降水量高，並不會造成乾燥地區過度灌溉的(丁)土壤鹽鹼化。

    17.(C)中南美洲國家多位在低緯地區，沿海氣候溼熱，因此重要城市多分布在氣候涼爽的高地上。

    18.南美洲西岸瀕太平洋，為環太平洋火山地震帶的一部分，因此多火山地形、地勢崎嶇、地震頻繁。故選(C)。

    19.中美洲東側的加勒比海有 3 大島群──大安地列斯（陸沉島）、小安地列斯（火山島）、巴哈馬群島（珊瑚礁島），合稱西印度群島。(A)巴哈馬群島因由珊瑚礁島組成，平均海拔最低，故最易受淹水災衝擊。

    20.文中提及溼度相當高的空氣，主因為(C)沿海有秘魯涼流流經，低空空氣水氣充足。

    21.南美洲西岸瀕太平洋，為環太平洋火山地震帶的一部分，多地震、火山，板塊碰撞形成安地斯山脈，富含金、銅等礦產資源。故選(B)。

    22.文中提及印第安人為躲避西班牙人而逃入山中，而南美洲超過 4,000 公尺的高山為(B)安地斯山。

    23.(D)麥士蒂索人為中南美洲原住民印第安人與歐洲白人的混血。

    24.背倚安地斯山、被西班牙殖民、有狹長國美譽的國家為(D)智利。

    25.(C)(甲)麥士蒂索人為中南美洲原住民印第安人與歐洲白人的混血；(丙)巴西嘉年華為融入天主教與非洲的文化；(丁)森巴舞為由當初自非洲如安哥拉、剛果等地引進的大量黑奴所帶入。

    26.(A)殖民國家對中南美殖民地最大的影響為「大地主制」，將土地權利掌握在少數地主（白人）手上，造成貧富差距極大；獨立後經濟仍以殖民時期的熱帶栽培業、礦產出口為主，形成依賴式經濟，需大量進口糧食與工業產品，資金難以累積。

    27.(B)在全球化下，國際產業分工核心區掌握關鍵技術，獲利豐厚；邊陲區負責加工組裝，利潤微薄，加大貧富差距，因此有反全球化浪潮產生。

    28.全球分工之後，中國成為世界工廠，世界製造重心幾乎都在中國，而(A) COVID-19 疫情造成生產斷鍊，影響全球甚鉅。

    29.全球分工的最佳區位選擇，即是運用(B)比較利益原則進行分工。

    30.(B)雪梨位在 151°E（東 10 區），比臺灣（東 8 區）早 2 個小時，因此要收看實況轉播煙火應在臺灣晚上 10 點準時收看。'
