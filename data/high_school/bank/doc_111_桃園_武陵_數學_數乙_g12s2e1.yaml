- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s1_1
  section: 1
  number: 1
  type: calc
  page: 1
  stem: 若實係數三次多項式函數 f（x）滿足 f（1＋2i）＝0，則函數 y＝f（x）的圖形與 x 軸恰有一個交點。
  answer:
  - ○
  answer_status: verified
  answer_source: answer_key
  explanation: '○：根據虛根成對定理，實係數三次方程式有一根為 1＋2i

    則另一虛根為 1－2i，第三根必為實根

    ∴函數 y＝f（x）的圖形與 x 軸恰有一個交點'
- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s1_2
  section: 1
  number: 2
  type: calc
  page: 1
  stem: '若三次方程式 f（x）＝$x^{3}$＋$bx^{2}$＋cx＋d＝0 的三個根為－2，3，2i，則方程式

    f（$x^{2}$）＝0 有四個實根。'
  answer:
  - ╳
  answer_status: verified
  answer_source: answer_key
  explanation: '╳：∵三次方程式的三個根為－2，3，2i

    ∴有三個一次因式為 x＋2，x－3，x－2i

    $\Rightarrow$f（x）＝（x＋2）（x－3）（x－2i）

    而 f（$x^{2}$）＝（$x^{2}$＋2）（$x^{2}$－3）（$x^{2}$－2i）

    可知 f（$x^{2}$）＝0 有 2 個實根，x＝$\pm \sqrt{3}$'
