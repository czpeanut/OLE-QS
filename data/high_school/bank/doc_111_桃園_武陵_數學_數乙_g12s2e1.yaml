- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s2_9
  section: 2
  number: 9
  type: fill
  page: 1
  stem: '設 m 為實數，α、β為方程式$x^{2}- 2\sqrt{3} x +m$＝0 的兩個虛根，且

    ｜α－β｜＝1，則 m 的值為＿＿＿＿。'
  answer:
  - $\frac{13}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵方程式$x^{2}- 2\sqrt{3} x +m$＝0 為實係數方程式

    根據虛根成對定理

    設 α＝a＋bi，β＝a－bi，其中 a，b 為實數

    則兩根之和為α＋β＝2a＝$2\sqrt{3}\Rightarrow$a＝$\sqrt{3}$

    ｜α－β｜＝｜（a＋bi）－（a－bi）｜＝｜2bi｜＝｜2b｜＝1$\Rightarrow$b＝$\pm \frac{1}{2}$

    故兩根分別為$\sqrt{3} +\frac{1}{2}i$及$\sqrt{3} -\frac{1}{2}i$

    而兩根之積為αβ＝m＝$\left( \sqrt{3} +\frac{1}{2}i \right) \left( \sqrt{3} -\frac{1}{2}i \right)$＝$\frac{13}{4}$'
- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s2_10
