- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s2_4
  section: 2
  number: 4
  type: fill
  page: 1
  stem: 已知複數 z 滿足 $z^{2}$＝5＋12i，則 z＝＿＿＿＿。
  answer:
  - 3＋2i 或－3－2i
  answer_status: verified
  answer_source: answer_key
  explanation: '設複數 z＝a＋bi，其中 a，b 為實數

    $z^{2}$＝（a＋bi）$^{2}$＝（$a^{2}$－$b^{2}$）＋（2ab）i＝5＋12i

    $\Rightarrow\begin{cases}a^{2}-b^{2} = 5 \ldots \ldots \ldots \ldots \ldots ① \\ 2ab = 12 \ldots \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由②得 b＝$\frac{6}{a}$代回①

    得$a^{2}- \left( \frac{6}{a} \right) ^{2}$＝5$\Rightarrowa^{2}-\frac{36}{a^{2}}$＝5$\Rightarrowa^{4}$－$5a^{2}$－36＝0

    $\Rightarrow$（$a^{2}$＋4）（$a^{2}$－9）＝0$\Rightarrowa^{2}$＝9$\Rightarrow$a＝± 3

    ①若 a＝3，則 b＝2

    ②若 a＝－3，則 b＝－2

    故 z＝3＋2i 或－3－2i'
- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s2_5
  section: 2
  number: 5
  type: fill
  page: 1
  stem: 若α為方程式 $x^{3}$－$6x^{2}$＋3x＋12＝0 的一個根，且 n＜α＜n＋1，其中 n 為整數，則 n 的最小值為＿＿＿＿。
  answer:
  - －2
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝$x^{3}$－$6x^{2}$＋3x＋12

    f（－2）＝－8－24－6＋12＝－26＜0

    f（－1）＝－1－6－3＋12＝2＞0

    f(0)＝12＞0

    f(1)＝1－6＋3＋12＝10＞0

    f(2)＝8－24＋6＋12＝2＞0

    f(3)＝27－54＋9＋12＝－6＜0

    f(4)＝64－96＋12＋12＝－8＜0

    f(5)＝125－150＋15＋12＝2＞0

    ∵f（－2）．f（－1）＜0，f(2)．f(3)＜0，f(4)．f(5)＜0

    根據勘根定理及代數基本定理可知此方程式三個根分別在（－2，－1），（2，3），（4，5）

    ∴n 的最小值為－2'
