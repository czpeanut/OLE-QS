- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: '設α、β為方程式 $x^{2}$＋4x＋9＝0 的兩根，試求：

    (1) α$^{2}$＋β$^{2}$＝＿＿＿＿。

    (2) $( \sqrt{\alpha} - \sqrt{\beta} )^{2}$＝＿＿＿＿。'
  answer:
  - (1) －2；(2) 2
  answer_status: verified
  answer_source: answer_key
  explanation: '∵α、β為方程式 $x^{2}$＋4x＋9＝0 的兩根

    ∴α＋β＝－4，α．β＝9，其中α＜0 且β＜0

    (1) α$^{2}$＋β$^{2}$＝（α＋β）$^{2}$－2αβ＝（－4）$^{2}$－2×9＝－2

    (2) $( \sqrt{\alpha} - \sqrt{\beta} )^{2}$＝$( \sqrt{\alpha} )^{2}- 2 \cdot \sqrt{\alpha} \cdot \sqrt{\beta} +( \sqrt{\beta} )^{2}$

    ＝$\alpha +\beta + 2\sqrt{\alpha \beta}$

    ＝－4＋2×3＝2'
