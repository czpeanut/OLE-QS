  stem: '某公司生產 A、B 兩種商品，均以同型的箱子裝運，其中 A 商品每箱重 30 公斤，B 商品每箱重 10 公斤。公司出貨時，每趟貨車最多只能運送 100 箱，最大載重為 1200 公斤。若 A 商品每箱的利潤為 1500 元，B 商品每箱的利潤為 1000 元。設公司調配運送時，每趟貨車裡的 A 商品為 x 箱，B 商品為 y 箱。

