- id: doc_111_桃園_武陵_數學_數乙_g12s2e1_s2_7
  section: 2
  number: 7
  type: fill
  page: 1
  stem: 已知複數$\frac{z}{z - 2}$是純虛數，則複數 z 在複數平面形成的圖形，以 x，y 表示為＿＿＿＿。
  answer:
  - （x－1）$^{2}$＋$y^{2}$＝1，且 y≠0
  answer_status: verified
  answer_source: answer_key
  explanation: '設 z＝a＋bi，其中 a，b 為實數

    則$\frac{z}{z - 2}$＝$\frac{a +bi}{( a - 2 )+bi}$×$\frac{( a - 2 )-bi}{( a - 2 )-bi}$＝$\frac{( a^{2}- 2a +b^{2} )+( -2b )i}{( a - 2 )^{2}+b^{2}}$為純虛數

    ①實部為 0：$\frac{a^{2}- 2a +b^{2}}{( a - 2 )^{2}+b^{2}}$＝0$\Rightarrowa^{2}$－2a＋$b^{2}$＝0

    $\Rightarrow$（a－1）$^{2}$＋$b^{2}$＝1

    ②虛部不為 0：$\frac{-2b}{( a - 2 )^{2}+b^{2}}$≠0$\Rightarrow$b≠0

    故其軌跡方程式為（x－1）$^{2}$＋$y^{2}$＝1，且 y≠0'
