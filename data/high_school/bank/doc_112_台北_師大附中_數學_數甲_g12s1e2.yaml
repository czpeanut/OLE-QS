  stem: '已知函數 f（x）＝$\begin{cases}ax +b , x\geq 1 \\ x^{3} , x < 1\end{cases}$，若在 x＝1 處有導數，則

    (1) 數對（a，b）＝＿＿＿＿。

    (2) $\int_{-1}^{3} f ( x )dx$＝＿＿＿＿。'
  answer:
  - (1)（3，－2）；(2) 8
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ∵f（x）在 x＝1 處有導數 ∴f（x）在 x＝1 處連續

    $\Rightarrow\lim_{x \rightarrow 1^{-}} f ( x )$＝$\lim_{x \rightarrow 1^{+}} f ( x )\Rightarrow$a＋b＝1

    又$\lim_{x \rightarrow 1^{-}} \frac{x^{3}-( a +b )}{x-1}$＝$\lim_{x \rightarrow 1^{+}} \frac{ax +b -( a +b )}{x-1}$

    $\Rightarrow\lim_{x \rightarrow 1^{-}} \frac{x^{3}- 1}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{a ( x - 1 )}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{-}} ( x^{2}+x + 1 )$＝$\lim_{x \rightarrow 1^{+}} a\Rightarrow$a＝3

    ∴b＝1－3＝－2

    故數對（a，b）＝（3，－2）

    (2) $\int_{-1}^{3} f ( x )dx$＝$\int_{-1}^{1} f ( x )dx$＋$\int_{1}^{3} f ( x )dx$

    ＝$\int_{-1}^{1} x^{3}dx$＋$\int_{1}^{3} ( 3x - 2 )dx$＝$\left. \frac{1}{4}x^{4} \right| _{-1}^{1}$＋$\left. \left( \frac{3}{2}x^{2}- 2x \right) \right| _{1}^{3}$

    ＝$\left( \frac{1}{4}-\frac{1}{4} \right)$＋$\left( \frac{27}{2}- 6 -\frac{3}{2}+ 2 \right)$＝8'
