  stem: '已知 a，b，c 皆為實數，若兩曲線Γ$_{1}$：y＝$x^{2}$＋ax＋b，Γ$_{2}$：y＝－$x^{3}$＋c 都通過點 A（－1，2），且以 A 點為切點，則兩曲線在 A 點有共同的切線 L：y＝mx＋k，求

