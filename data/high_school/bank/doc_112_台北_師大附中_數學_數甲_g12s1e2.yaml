- id: doc_112_台北_師大附中_數學_數甲_g12s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 選出下列函數哪些在 x＝0 處導數存在？
  options:
  - label: A
    content: f（x）＝｜x｜
  - label: B
    content: f（x）＝｜$x^{3}$｜
  - label: C
    content: f（x）＝｜x（x＋1）｜
  - label: D
    content: f（x）＝$\left[ x -\frac{1}{2} \right]$，其中 [ x ] 表 x 之高斯記號
  - label: E
    content: f（x）＝$\begin{cases}x^{2} , x\leq 0 \\ x^{4}+ 1 , x > 0\end{cases}$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\lim_{x \rightarrow 0^{+}} \frac{| x |- 0}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{x - 0}{x - 0}$＝1

    $\lim_{x \rightarrow 0^{-}} \frac{| x |- 0}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{-x - 0}{x - 0}$＝－1

    ∴在 x＝0 處導數不存在

    (B)○：$\lim_{x \rightarrow 0^{+}} \frac{| x^{3} |- 0}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{x^{3}- 0}{x - 0}$＝0

    $\lim_{x \rightarrow 0^{-}} \frac{| x^{3} |- 0}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{-x^{3}- 0}{x - 0}$＝0

    ∴在 x＝0 處導數存在

    (C)╳：$\lim_{x \rightarrow 0^{+}} \frac{| x ( x + 1 ) |- 0}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{x ( x + 1 )- 0}{x - 0}$＝1

    $\lim_{x \rightarrow 0^{-}} \frac{| x ( x + 1 ) |- 0}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{-x ( x + 1 )- 0}{x - 0}$＝－1

    ∴在 x＝0 處導數不存在

    (D)○：$\lim_{x \rightarrow 0^{+}} \frac{\left[ x -\frac{1}{2} \right] -( -1 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{-1 -( -1 )}{x}$＝0

    $\lim_{x \rightarrow 0^{-}} \frac{\left[ x -\frac{1}{2} \right] -( -1 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{-1 -( -1 )}{x}$＝0

    ∴在 x＝0 處導數存在

    (E)╳：f（x）在 x＝0 不連續

    ∴f（x）在 x＝0 處導數不存在

    故選(B)(D)'
