  stem: 已知函數 f（x）＝$2x^{3}$－$3x^{2}$－12x＋6，選出下列正確的敘述。
  options:
  - label: A
    content: 當－2 ≤ x ≤ 1 時，f（x）是遞增函數
  - label: B
    content: 當 1 ≤ x ≤ 2 時，f（x）是遞減函數
  - label: C
    content: 當 x＝1 時，f（x）有極大值為－7
  - label: D
    content: 當$x\leq -\frac{1}{2}$時，y＝f（x）圖形的凹口向下
  - label: E
    content: 當$x\geq -\frac{1}{2}$時，y＝f（x）圖形的凹口向上
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$6x^{2}$－6x－12＝6（x＋1）（x－2）＝0$\Rightarrow$x＝－1 或 2

    f''''（x）＝12x－6＝0$\Rightarrow$x＝$\frac{1}{2}$

    依 f''（x）、f''''（x）正負製表如下

    $\frac{1}{2}$

    故選(B)(D)'
