  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ∵Γ$_{2}$ 通過點 A（－1，2） ∴2＝－（－1）$^{3}$＋c$\Rightarrow$c＝1，即Γ$_{2}$：y＝－$x^{3}$＋1

    又Γ$_{1}$、Γ$_{2}$ 以 A 點為切點的切線斜率相同

    ∴2（－1）＋a＝－3（－1）$^{2}\Rightarrow$a－2＝－3$\Rightarrow$a＝－1

    ∵Γ$_{1}$ 通過點 A（－1，2）

    ∴2＝（－1）$^{2}$－（－1）＋b$\Rightarrow$b＝0

    故得序組（a，b，c）＝（－1，0，1）

    (2) 由(1)可知切線為 L：y－2＝－3（－1）$^{2}$（x－（－1））

    $\Rightarrow$y－2＝－3（x＋1）$\Rightarrow$y＝－3x－1

    故數對（m，k）＝（－3，－1）'
