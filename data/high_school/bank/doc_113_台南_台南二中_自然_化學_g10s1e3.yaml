- id: doc_113_台南_台南二中_自然_化學_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 湖泊中的溶氧量是量度水體品質的一個重要指標，水質愈純淨、溶氧愈達飽和，愈適合多種水生動物生存。已知某湖泊中的溶氧量為 80 mg／L，假設湖水密度為 1.0 g／$cm^{3}$，則該湖泊所含氧氣的體積莫耳濃度為多少 M？
  options:
  - label: A
    content: '0.00001'
  - label: B
    content: '0.0025'
  - label: C
    content: '0.002'
  - label: D
    content: '0.016'
  - label: E
    content: '0.00125'
  group_stem: 第5～6題為題組
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 濃度＝80 mg／L，可假設一公升溶液中有80 mg的氧氣，相當於$\frac{0.08}{32}$＝0.0025 mol。故體積莫耳濃度＝0.0025 M，故選(B)。
