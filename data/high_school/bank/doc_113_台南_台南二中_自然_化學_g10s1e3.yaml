  - label: C
    content: '800'
  - label: D
    content: '810'
  - label: E
    content: '880'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 稀釋後溶液體積＝1000 mL，重量＝1100 g。故 10％ 的水溶液中共有 110 g 的溶質、990 g 的溶劑。在原本的 50％ 溶液中，需取 220 g 的濃溶液（當中有 110 g 溶質、110 g 溶劑），再加入 $1100 - 220 = 880\text{ g}$ 的水。故選(E)。
