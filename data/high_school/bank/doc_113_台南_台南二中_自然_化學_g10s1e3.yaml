  - label: A
    content: 通電後可以看到類似豆花的結塊
  - label: B
    content: 使用濾紙可過濾出蛋白質
  - label: C
    content: 以雷射筆照射可觀察到布朗運動
  - label: D
    content: 加入砂糖可看到類似豆花的結塊
  - label: E
    content: 久置後可以在杯底看到類似豆花的結塊
