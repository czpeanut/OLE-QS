  page: 1
  stem: 下列關於溶液性質的敘述，何者正確？
  options:
  - label: A
    content: 濃度98％的硫酸溶液中，水為溶劑
  - label: B
    content: 硫酸銅溶液，有固定的沸點
  - label: C
    content: 空氣為氣態溶液，氧氣為溶劑
  - label: D
    content: 黃銅可將其成分中的金視為溶劑，銅視為溶質
  - label: E
    content: 將鐵粉加入水中，充分攪拌後，所得的混合物可稱為膠體溶液
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)溶液沒有固定的沸點；(C)非水溶液中，量多者為溶劑；(D)黃銅為銅與鋅的合金；(E)鐵粉並未溶於水，不屬於溶液。故選(A)。
