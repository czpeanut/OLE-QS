- id: doc_113_台南_台南二中_自然_化學_g10s1e3_s2_26
  section: 2
  number: 26
  type: multiple
  page: 3
  stem: 從實驗室取出一瓶濃硫酸（$H_{2}SO_{4}$），在瓶外的標籤上有下列的資訊： ①重量百分率濃度為 98％、②密度為 1.84 g／$cm^{3}$、③分子量為 98。 若要配製密度為 1.4 g／$cm^{3}$、體積莫耳濃度為 4.6 M 的硫酸溶液 400 毫升，則哪些敘述正確？
  options:
  - label: A
    content: 原來瓶中濃硫酸濃度為18.4 M
  - label: B
    content: 相當於濃度為980000 ppm
  - label: C
    content: 取濃度98％的濃硫酸100毫升加入300公克蒸餾水中，稀釋成硫酸溶液400毫升
  - label: D
    content: 配製硫酸溶液時，需將硫酸緩緩加入水中
  - label: E
    content: 稀釋後重量百分濃度約24.5％
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)假設原溶液體積 1 L，重量＝1840 g，含 $1840\times 0.98\text{ g}$ 硫酸，相當於 $\frac{1840\times 0.98}{98} = 18.4\text{ mol}$，濃度為 18.4 M，正確；(B) 1％＝10000 ppm，98％＝980000 ppm，正確；(C)應將 100 mL 濃硫酸緩緩加入少量蒸餾水中冷卻後，再加水定容至 400 mL，不可直接加 300 g 水；(D)稀釋濃硫酸須將酸緩緩加入水中，正確；(E)稀釋後溶液總重 $= 400\times 1.4 = 560\text{ g}$，重量百分濃度 $= \frac{1.84\times 98}{560}\times 100\% = 32.2\%$。故選(A)(B)(D)。
  tags:
    unit:
      code: CH-1-3-2
