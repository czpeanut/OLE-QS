- id: doc_113_台南_台南二中_自然_化學_g10s1e3_s2_27
  section: 2
  number: 27
  type: multiple
  page: 3
  stem: 附表中為20°C與30°C時，碳酸鉀與醋酸銀在水中的溶解度（溶質克數／100克水） 請根據表中數據，判斷下列敘述哪些正確？
  options:
  - label: A
    content: 碳酸鉀溶於水是放熱反應
  - label: B
    content: 醋酸銀溶於水時，水溶液溫度下降
  - label: C
    content: 由表中數據可得知，60°C時碳酸鉀和醋酸銀在100克水中的溶解度分別為1.13克和16.5克
  - label: D
    content: 在30°C時，將碳酸鉀飽和水溶液100克，降溫至20°C時，最多還可以溶入0.1克碳酸鉀
  - label: E
    content: 在30°C時，將醋酸銀飽和水溶液1120克，降溫至20°C時，最多會有15克醋酸銀析出
  assets:
  - key: s2_27_f1
    kind: figure
    file: doc_113_台南_台南二中_自然_化學_g10s1e3/s2_27_f1.png
    crop:
      page: 3
      rect:
      - 53.1
      - 167.85
      - 398.1
      - 234.75
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)碳酸鉀溶解度隨溫上升而下降，故為放熱反應無誤；(B)醋酸銀溶解度隨溫度上升而增加，故為吸熱反應，水溶液溫度會下降無誤；(C)溶解度曲線不為斜直線，無法計算60℃時的溶解度；(D)如果是在30℃下的101.43 g飽和水溶液（內有100 g水、1.43 g碳酸鉀），降溫後就可多溶解0.1 g的溶質，故如果只有100 g的溶液，則不可能溶解題目所說的0.1 g碳酸鉀；(E)30℃下溶解度為$\frac{12 g溶質}{100 g水}$。故1120 g的溶液中有120 g的溶質與1000 g的水。20℃下溶解度為$\frac{10.5 g溶質}{100 g水}$，假設析出x g的溶質，則可列式得到：$\frac{10.5}{100}$＝$\frac{120-x}{1000}$，可得x＝15。故選(A)(B)(E)。
