    content: 取5.0毫升的12.0M HCl(aq)加入95.0毫升蒸餾水
  - label: B
    content: 取10.0毫升的12.0M HCl(aq)加入90.0毫升蒸餾水
  - label: C
    content: 取10.0毫升的12.0 MHCl(aq)，以蒸餾水稀釋成100.0毫升溶液
  - label: D
    content: 取5.0毫升的12.0 M HCl(aq)，以蒸餾水稀釋成100.0毫升溶液
  - label: E
    content: 取1.0毫升的12.0 M HCl(aq)，以蒸餾水稀釋成100.0毫升溶液
  group_stem: 第8～9題為題組
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從12.0 M稀釋成1.20 M，代表濃度稀釋十倍，即體積須為原本的10倍。其中(B)不適合，因為體積不具有加成性，故混合後不一定為100 mL。故選(C)。
