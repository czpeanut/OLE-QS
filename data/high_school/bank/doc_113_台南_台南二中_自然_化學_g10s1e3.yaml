  stem: 下列關於膠體溶液的敘述，何者正確？
  options:
  - label: A
    content: 可利用過濾將膠體粒子與溶劑分開
  - label: B
    content: 霧、空氣均為常見的膠體溶液
  - label: C
    content: 溶質粒徑在$10^{－9}$～$10^{－6}$ m的粒子所構成的溶液，稱為膠體溶液
  - label: D
    content: 陽光射人充滿灰塵的房間可見到一條發亮光帶，此為布朗運動
  - label: E
    content: 硝酸鉛和碘化鉀水溶液混合，會產生黃色碘化鉛沉澱物，此為膠體溶液的凝聚現象
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)膠體粒子的粒徑不夠大，無法被過濾分離；(B)空氣不是膠體溶液；(D)此為廷得耳效應；(E)此為沉澱反應，不是凝聚現象。故選(C)。
