  stem: 將五水合硫酸銅晶體（$CuSO_{4}$‧$5H_{2}$O）250克溶於750克的水中，則此溶液重量百分率濃度為若干？（$CuSO_{4}$‧$5H_{2}$O＝250）
  options:
  - label: A
    content: 33.3％
  - label: B
    content: 25％
  - label: C
    content: 16％
  - label: D
    content: 9％
  - label: E
    content: 3.5％
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: $CuSO_{4}$‧$5H_{2}$O中$CuSO_{4}$的質量占比為$\frac{160}{250}$，$H_{2}$O的質量占比為$\frac{90}{250}$。故250 g的$CuSO_{4}$‧$5H_{2}$O中共有160 g的硫酸銅、90 g的水。故形成的溶液＝$\frac{160}{1000}$×100％＝16％。故選(C)。
