- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 若想製備pH＝9的緩衝沖溶液，使用下列哪種混合溶液最合適？
  options:
  - label: A
    content: 二甲胺和氯化二甲銨（二甲胺$K_{b}$＝5.9×$10^{－4}$）
  - label: B
    content: 苯胺和氯化苯銨（苯胺$K_{b}$＝4.3×$10^{－10}$）
  - label: C
    content: 醋酸和醋酸鈉（醋酸$K_{a}$＝1.8×$10^{－5}$）
  - label: D
    content: 氨和氯化銨（氨$K_{b}$＝1.8×$10^{－5}$）
  - label: E
    content: 磷酸和磷酸二氫鉀（磷酸$K_{a_{1}}$＝7.11×$10^{－3}$、$K_{a_{2}}$＝6.32×$10^{－8}$、$K_{a_{3}}$＝4.49×$10^{－13}$）
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 選擇$K_{a}$與[$H^{＋}$]接近的系統，可使共軛酸鹼對（HA、$A^{－}$）含量較接近，系統的緩衝效果較佳。本系統pH＝9，即pOH＝5，故選擇$K_{a}$數值接近$10^{－9}$或$K_{b}$數值接近$10^{－5}$者即為最佳選擇。故選(D)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_14
