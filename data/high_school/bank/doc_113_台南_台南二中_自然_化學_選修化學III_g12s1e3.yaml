  explanation: (A)應為HCN(g)，HCN(aq)為氫氰酸；(B)應為$H_{2}$S(aq)，$H_{2}$S(g)為硫化氫；(D)為硫酸；(E)應為HCl(aq)，HCl(g)為氯化氫。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 已知酸性強度大小順序為：HBr＞HF＞$CH_{3}$COOH＞$H_{2}$O＞$NH_{3}$，何者與氫離子結合之趨勢最小？
  options:
  - label: A
    content: $Br^{－}$
  - label: B
    content: $F^{－}$
  - label: C
    content: $CH_{2}COO^{－}$
  - label: D
    content: $OH^{－}$
  - label: E
    content: $NH_{2}^{－}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 酸性越強，其共軛鹼越弱，與氫離子結合的趨勢越小。故選(A)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 取60毫升0.10 M醋酸（$CH_{3}$COOH）和30毫升0.10 M氫氧化鈉（NaOH），混合均勻後，試問混合溶液的pH約為多少？（$CH_{3}$COOH的$K_{a}$＝2.0×$10^{－5}$；log2＝0.3）
  options:
  - label: A
    content: '2.7'
  - label: B
    content: '3.7'
  - label: C
    content: '4.7'
  - label: D
    content: '5.7'
  - label: E
    content: '6.7'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 加入的氫氧化鈉莫耳數為醋酸的莫耳數的一半，故有一半的醋酸會被中和成醋酸根。則此系統中[$CH_{3}$COOH]：[$CH_{3}COO^{－}$]＝1：1，則[$H^{＋}$]＝$K_{a}$，pH＝$pK_{a}$＝5－log2＝0.3。故選(C)。
