  stem: 以0.10 M的NaOH溶液滴定某單質子弱酸的滴定曲線如附圖所示。橫軸為加入NaOH的毫升數，縱軸為溶液的pH值。試問下列何者正確？（甲基紅變色範圍pH＝4.2～6.3）
  options:
  - label: A
    content: 在滴定過程中，當加人0.10M的NaOH溶液50 mL時，所得的溶液具有最佳的緩衝能力
  - label: B
    content: 此單質子弱酸的解離常數（$K_{a}$）約為1.0×$10^{－4}$
  - label: C
    content: 此弱酸的濃度為1.0×$10^{－4}$ M
  - label: D
    content: 此實驗最好選用甲基澄做指示劑
  - label: E
    content: 此滴定反應為吸熱反應
  assets:
  - key: s1_14_f1
    kind: figure
    file: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3/s1_14_f1.png
    crop:
      page: 2
      rect:
      - 54.9
      - 77.8
      - 227.4
      - 213.6
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)加入5.0 mL時曲線平緩，且加入的NaOH量剛好為當量點的一半，故屬於緩衝溶液；(B)半當量點（$V_{NaOH}$＝5 mL）處pH＝6，故$K_{a}$＝$10^{－6}$；(C)不知道此弱酸的初始體積為多少故無法計算濃度；(D)甲基橙的變色範圍在酸性範圍，故不適用於此實驗；(E)酸鹼中和為放熱反應。故選(A)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列四種鹽類的0.1 M水溶液，(a) KCl、(b) $K_{2}CO_{3}$、(c) $KHSO_{4}$、(d) $KHCO_{3}$，其pH值由低而高的順序為何？
  options:
  - label: A
    content: b＜a＜c＜d
  - label: B
    content: a＜b＜d＜c
  - label: C
    content: d＜c＜b＜a
  - label: D
    content: c＜a＜d＜b (B) c＜a＜b＜d
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 強酸的陰離子、強鹼的陽離子在水中都不水解，呈現中性。故本題中會有酸鹼性的離子就只有$CO_{3}^{2－}$、$HSO_{4}^{－}$、$HCO_{3}^{－}$。又$HSO_{4}^{－}$為酸性的陰離子（酸性的酸式鹽）、$HCO_{3}^{－}$為鹼性的陰離子（鹼性的酸式鹽），$CO_{3}^{2－}$為$HCO_{3}^{－}$的共軛鹼故pH會更高。可得pH：c＜a＜d＜b。故選(D)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 硫酸水溶液有以下化學平衡：（$K_{a_{1}}$極大；$K_{a_{2}}$＝1.2×$10^{－2}$） $H_{2}SO_{4}$ $\rightleftharpoons$ $H^{＋}$＋$HSO_{4}^{－}$ $\rightleftharpoons$ $H^{＋}$＋$SO_{4}^{2－}$；$H_{2}$O $\rightleftharpoons$ $H^{＋}$＋$OH^{－}$ 於0.05 M硫酸溶液中，下列各離子濃度間的關係，何者正確？
  options:
  - label: A
    content: pH＝1
  - label: B
    content: '[$H^{＋}$]＝2[$SO_{4}^{2－}$]'
  - label: C
    content: '[$H^{＋}$]＝[$HSO_{4}^{－}$]＋2[$SO_{4}^{2－}$]＋[$OH^{－}$]'
  - label: D
    content: '[$H^{＋}$]＝[$HSO_{4}^{－}$]＋[$SO_{4}^{2－}$]'
  - label: E
    content: 3[$H^{＋}$]＝[$HSO_{4}^{－}$]＋[$SO_{4}^{2－}$]＋[$OH^{－}$]
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 溶液中正電荷總量＝負電荷總量，故選(C)。 ※[$SO_{4}^{2－}$]前方係數要乘以2，因為一個硫酸根離子身上有兩個負電荷，故電荷量會是濃度的兩倍。另外，(A)選項不可能正確，因為第二個氫不會完全解離！
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列有關緩沖溶液的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 緩衝溶液是弱酸及其鹽或弱鹼及其鹽的混合溶液
  - label: B
    content: 大多數的酶催化反應不需在緩衝溶液中進行
  - label: C
    content: 緩衝溶液的pH值不會因為加入少量的強酸或強鹼而發生大幅度的變化
  - label: D
    content: 緩衝溶液是利用同離子效應的原理
  - label: E
    content: 人類的血液是一種鹼性緩衝溶液
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 酶的主要成分為蛋白質，蛋白質對於pH變化極為敏感，故需要在緩衝溶液中進行。故選(B)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 於1 atm、25℃時，將2.45升的HCl(g)完全溶於水中，形成500 mL的水溶液，則下列敘述，何者正確？（水的$K_{w}$＝1.0×$10^{－14}$；log2＝0.3）
  options:
  - label: A
    content: 最初HCl(g)有0.10莫耳
  - label: B
    content: '[$H^{＋}$]＝0.1 M'
  - label: C
    content: '[$OH^{－}$]＝5.0×$10^{－13}$ M'
  - label: D
    content: '[$Cl^{－}$]＝0.10 M'
  - label: E
    content: pH＝1
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)(E) NTP下2.45 L的氣體＝0.1 mol，故此系統中HCl莫耳數＝0.1 mol、溶液體積＝0.5 L，故水溶液濃度＝0.2 M、pH＝1－log2＝0.7。再由$K_{w}$＝[$H^{＋}$][$OH^{－}$]可得[$OH^{－}$]＝5×$10^{－14}$ M。故選(A)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 下列有關離子在水溶液中之酸鹼性的敘述，何者<u>錯誤</u>？（$H_{2}SO_{3}K_{a_{1}}$＝1.4×$10^{－2}$，$K_{a_{2}}$＝6.5×$10^{－8}$；$H_{2}C_{2}O_{4}K_{a_{1}}$＝5.6×$10^{－2}$、$K_{a_{2}}$＝5.4×$10^{－5}$）
  options:
  - label: A
    content: $CH_{3}COO^{－}$、$CN^{－}$、$F^{－}$均為鹼性陰離子
  - label: B
    content: $Na^{＋}$、$Sr^{2＋}$、$Ba^{2＋}$皆為中性陽離子
  - label: C
    content: $Fe^{2＋}$、$Cu^{2＋}$、$K^{＋}$皆為酸性陽離子
  - label: D
    content: $Cl^{－}$、$ClO_{4}^{－}$、$NO_{3}^{－}$皆為中性雞子
  - label: E
    content: $HSO_{3}^{－}$、$HC_{2}O_{4}^{－}$兩者為酸性陰離子
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)三者皆為弱酸的陰離子，水解後呈鹼性；(B)三者皆為強鹼的陽離子，不水解呈中性；(C) $Fe^{2＋}$、$Cu^{2＋}$為弱鹼的陽離子，水解後呈酸性；(D)三者皆為強酸的陰離子，不水解呈中性；(E)兩者皆為酸性的酸式鹽。故選(C)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 在40℃時，若純水之[$H^{＋}$]＝2.0×$10^{－7}$ M，則某水溶液的$\frac{[H^{+}]}{[OH^{-}]}$＝25，則此溶液的[$H^{＋}$]為何？
  options:
  - label: A
    content: 1.0×$10^{－3}$
  - label: B
    content: 1.0×$10^{－4}$
  - label: C
    content: 1.0×$10^{－5}$
  - label: D
    content: 1.0×$10^{－6}$
  - label: E
    content: 1.0×$10^{－8}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 此溫度下$K_{w}$＝[$H^{＋}$][$OH^{－}$]＝4×$10^{－14}$。可假設[$OH^{－}$]＝x、[$H^{＋}$]＝25x，可得$25x^{2}$＝4×$10^{－14}$，x＝4×$10^{－8}$，則[$OH^{－}$]＝x＝4×$10^{－8}$ M，[$H^{＋}$]＝25x＝$10^{－6}$ M。故選(D)
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s2_21
  section: 2
  number: 21
  type: multiple
  page: 2
  stem: 下列混合液，哪些可作為緩沖溶液？
  options:
  - label: A
    content: $CH_{3}$COOH(an)（過量）＋NaOH(aq)
  - label: B
    content: $CH_{3}$COONa(an)＋$CH_{3}$COOH(aq)
  - label: C
    content: HCl(an)＋NaOH(an)
  - label: D
    content: HCl(ag)（過量）
  - label: E
    content: $CH_{3}$COOH(en)（通量）＋HCl(ag)
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 溶液中成分為弱酸及其鹽或弱鹼及其鹽的組合即可形成緩衝溶液。配製方法包含①直接將弱酸及其鹽或弱鹼及其鹽的組合加入水中、②取多量的弱酸＋少量的強鹼、③取多量的弱鹼＋少量的弱酸。故選(A)(B)(D)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s2_22
  section: 2
  number: 22
  type: multiple
  page: 2
  stem: 用已標定之氫氧化鈉溶液滴定未知濃度的鹽酸溶液實驗時，有關下列操作情形，測得結果與實際含量比較，哪些不會降低實驗準確度？
  options:
  - label: A
    content: 將標準鹼液濃度稀釋成一半
  - label: B
    content: 在洗滌滴定管時，只用蒸餾水沖洗乾淨，即裝入了標準液
  - label: C
    content: 在洗滌錐形瓶時，只用蒸餾水沖洗乾淨，即裝人一定體積的待測液
  - label: D
    content: 在錐形瓶中加入約2～3 mL的指示劑
  - label: E
    content: 將標準NaOH(aq)留置桌上，等待隔日再繼續滴定，以確認實驗結果
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)標準鹼濃度稀釋一半後，計算時即使用新的濃度進行計算即可，並不影響結果；(B)滴定管未潤洗，則裡面所盛裝的溶液濃度會比原本預期的低而影響結果；(C)錐形瓶不可用標準液潤洗，否則無法知道其中加入的溶液體積精確值；(D)指示劑也是酸鹼物質，只需要加入2～3滴即可，加入太多也會參與酸鹼反應；(E) NaOH會吸收空氣中的二氧化碳而潮解，進而影響其濃度。故選(A)(C)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s2_23
  section: 2
  number: 23
  type: multiple
  page: 2
  stem: 水的解離$H_{2}$O(l) $\rightleftharpoons$ $H^{＋}$(aq)＋$OH^{－}$為吸熱反應，其離子積常數$K_{w}$在25℃時為1.0×$10^{－14}$，則下列敘述哪些<u>錯誤</u>？
  options:
  - label: A
    content: 在80℃時，純水之[$H^{＋}$]＝[$OH^{－}$]
  - label: B
    content: 在80℃時，鹼性溶液的$K_{w}$＝[$H^{＋}$][$OH^{－}$]＝1.0×$10^{－14}$
  - label: C
    content: 在10℃時，[$H^{＋}$]＝1.0×$10^{－7}$ M的溶液為酸性
  - label: D
    content: 在10℃時，某水溶液的[$OH^{－}$]＝1.0×$10^{－7}$ M，則此溶液之[$H^{＋}$]＜1.0×$10^{－7}$ M
  - label: E
    content: 純水中，10℃的[$H^{＋}$]大於80℃的[$H^{＋}$]
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)溫度升高，$K_{w}$變大＞$10^{－14}$，但純水依然為中性，[$H^{＋}$]＝[$OH^{－}$]；(C)溫度降低，$K_{w}$變小＜$10^{－14}$，[$H^{＋}$]＝[$OH^{－}$]＜$10^{－7}$ M，若某水溶液[$H^{＋}$]＝$10^{－7}$ M＞中性水溶液的[$H^{＋}$]，則此溶液為酸性；(D)因$K_{w}$＝[$H^{＋}$][$OH^{－}$]＜$10^{－14}$，故當[$OH^{－}$]＝$10^{－7}$ M，則[$H^{＋}$]＜$10^{－7}$ M；(E)由以上敘述可得知，在80℃的[$H^{＋}$]＞$10^{－7}$ M較10℃時[$H^{＋}$]＜$10^{－7}$ M大。故選(B)(E)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s2_24
  section: 2
  number: 24
  type: multiple
  page: 2
  stem: 依據布-洛酸鹼學說的觀念，下列哪些屬於兩性物質？
  options:
  - label: A
    content: $H_{2}$O
  - label: B
    content: $H_{2}O^{＋}$
  - label: C
    content: $HPO_{4}^{2－}$
  - label: D
    content: $HCO_{3}^{－}$
  - label: E
    content: $NH_{4}^{＋}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 具有可解離的$H^{＋}$、也可接受$H^{＋}$，即為兩性酸鹼物質。(B)不行，不存在$H_{4}O^{2＋}$（$H_{3}O^{＋}$、$H^{＋}$皆為陽離子無法相吸）；(E)不行，因為無法再接受更多的$H^{＋}$（沒有lp了）。故選(A)(C)(D)。
