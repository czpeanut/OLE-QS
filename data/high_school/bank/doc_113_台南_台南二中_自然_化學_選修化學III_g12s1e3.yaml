questions:
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列何者<u>不為</u>多質子酸？
  options:
  - label: A
    content: 碳酸
  - label: B
    content: 硝酸
  - label: C
    content: 硫酸
  - label: D
    content: 磷酸
  - label: E
    content: 氫硫酸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 硝酸（$HNO_{3}$）中只有一個可解離的$H^{＋}$，故為單質子酸。故選(C)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 知1.0 M某弱酸溶液中之日濃度與1×$10^{－3}$ M HCI(aq)中之$H^{＋}$濃度相等，則該弱酸之解離常數（$K_{a}$）為多少？
  options:
  - label: A
    content: $10^{－2}$
  - label: B
    content: $10^{－3}$
  - label: C
    content: $10^{－4}$
  - label: D
    content: $10^{－5}$
  - label: E
    content: $10^{－6}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 弱酸解離方程式（單位皆為M）： $\rightleftharpoons$ 可得$\frac{x^{2}}{1.0 - x}$＝$K_{a}$。又x＝$10^{－3}$，因1.0≫x，則可得1.0－x≒1，解得$K_{a}$＝$10^{－6}$。故選(E)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知在37℃時，磷酸之$K_{a_{1}}$＝7.5×$10^{－3}$，$K_{a_{2}}$＝6×$10^{－8}$，$K_{a_{3}}$＝4.8×$10^{－13}$，人體内血液系統緩衝溶液之pH值為7.40，則維持血液pH值最好的組成與濃度比例為何？（log2＝0.3）
  options:
  - label: A
    content: $\frac{[H_{3}PO_{4}]}{[H_{2}PO_{4}^{-}]}$＝$\frac{1}{20000}$
  - label: B
    content: $\frac{[H_{2}PO_{4}^{-}]}{[HPO_{4}^{2-}]}$＝$\frac{2}{3}$
  - label: C
    content: $\frac{[H_{2}PO_{4}^{-}]}{[HPO_{4}^{2-}]}$＝$\frac{1}{10}$
  - label: D
    content: $\frac{[HPO_{4}^{2-}]}{[PO_{4}^{3-}]}$＝$\frac{2}{3}$
  - label: E
    content: $\frac{[HPO_{4}^{2-}]}{[PO_{4}^{3-}]}$＝$\frac{3}{2}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: pH＝7.40＝8－0.6，故可知[$H^{＋}$]＝4×$10^{－8}$ M，選擇$K_{a}$與[$H^{＋}$]接近的系統，可使共軛酸鹼對（HA、$A^{－}$）含量較接近，系統的緩衝效果較佳。因此本系統應選擇$H_{2}PO_{4}^{－}$、$HPO_{4}^{2－}$的組合，由$K_{a_{2}}$定義可知：$K_{a_{2}}$＝$\frac{[H^{+}][HPO_{4}^{2-}]}{[H_{2}PO_{4}^{-}]}$，帶入後可得到$\frac{[HPO_{4}^{2-}]}{[H_{2}PO_{4}^{-}]}$×4×$10^{－8}$＝6×$10^{－8}$，得$\frac{[HPO_{4}^{2-}]}{[H_{2}PO_{4}^{-}]}$＝1.5。故選(B)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關鹽的分類敘述，何者正確？
  options:
  - label: A
    content: 酸式鹽水溶液一定酸性
  - label: B
    content: $NaHCO_{3}$屬於正鹽
  - label: C
    content: $CH_{3}$COONa屬於鹼式鹽
  - label: D
    content: 正鹽的水溶液必為中性
  - label: E
    content: KAl($SO_{4}$)$_{2 }12H_{2}$O屬於複鹽
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)不一定，例如$NaHCO_{3}$就是鹼性的酸式鹽；(C)(D) $CH_{3}$COONa為鹼性的正鹽。故選(E)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列哪一選項所列的物質不互為共軛酸鹼對？
  options:
  - label: A
    content: $H_{2}$O，$H_{3}O^{＋}$
  - label: B
    content: $HCO_{3}^{－}$，$CO_{3}^{2－}$
  - label: C
    content: $NH_{3}$，$NH_{4}^{＋}$
  - label: D
    content: $OH^{－}$，$H_{3}O^{＋}$
  - label: E
    content: $NO_{3}^{－}$，$HNO_{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 僅相差一個$H^{＋}$者為共軛酸鹼對，故選(D)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 張同學以0.100 M的NaOH水溶液滴定未知濃度的50.0 mL鹽酸溶液甲，當滴入48.0 mL的NaOH溶液時，發覺忘了加入酚酞指示劑。待加入指示劑後，發現溶液已呈現桃紅色。於是進行反滴定，先加人5.0 mL的0.100 M鹽酸溶液後，再滴人2.0 mL的NaOH溶液，即達到滴定終點，則此鹽酸溶液甲的濃度（M）為何？
  options:
  - label: A
    content: '0.090'
  - label: B
    content: '0.103'
  - label: C
    content: '0.156'
  - label: D
    content: '0.186'
  - label: E
    content: '0.206'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 酸總莫耳數＝鹼總莫耳數：（本題中皆為一元酸鹼） 0.100(M)×0.0050(L)＋C(M)×0.0500(L)＝0.100(M)×(0.0480＋0.0020)(L)，計算可得C＝0.090 M。故選(A)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 將0.408 g的鄰苯二甲酸氫鉀（KHP，式量＝204）溶於25 mL水中，以NaOH(aq)滴定，用去了20 mL的NaOH(ag)才達當量點，再以此NaOH(aq)滴定25 mL的HCI(aq)，用去NaOH(aq) 50 mL達當量點，則此HCl(aq)之濃度為多少M？
  options:
  - label: A
    content: '0.1'
  - label: B
    content: '0.2'
  - label: C
    content: '0.3'
  - label: D
    content: '0.4'
  - label: E
    content: '0.5'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: （本題中皆為一元酸鹼） (1) KHP（酸）總莫耳數＝鹼總莫耳數： $\frac{0.408}{204}$＝$C_{B}$(M)×0.02(L)，計算可得C＝0.10 M。 (2) HCl總莫耳數＝NaOH總莫耳數： $C_{A}$(M)×0.025(L)＝0.1(M)×0.05(L)，計算可得C＝0.2 M。 故選(B)。
- id: doc_113_台南_台南二中_自然_化學_選修化學III_g12s1e3_s1_8
  section: 1
