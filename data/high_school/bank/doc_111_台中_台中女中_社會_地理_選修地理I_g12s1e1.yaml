  stem: 近年來，政府積極投入資源，結合在地力量，讓更多人了解媽祖遶境文化全貌，並與觀光活動結合，吸引遊客前來體驗。遊客常沿途拍照留念，不過若要區分照片分別在哪個行政區內拍攝，需要先取得這些行政區的面資料，並將照片內隱含的拍攝位置資訊轉換成 GIS 的經緯度坐標的點資料後，透過 GIS 分析步驟，才能將所有照片有效區分。依據題文，遊客操作下列哪個 GIS 分析步驟能最直接得到所需資訊？
