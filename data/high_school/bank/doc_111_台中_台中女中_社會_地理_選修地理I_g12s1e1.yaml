  stem: 在嚴重特殊傳染性肺炎（COVID-19）疫情下，自國外入境的臺灣民眾，需配合「電子圍籬智慧監控系統」的列管，進行居家檢疫。疾管署每天會發送列管者的手機號碼給電信業者，業者再將手機定位上傳至電子平臺，當列管者離開系統劃定的基地範圍，系統就會自動發送「告警簡訊」給當事人及第一線監控單位。此種防疫方式主要結合下列哪些地理技術？(甲)遙測（RS）(乙)全球定位系統（GPS）(丙)地理資訊系統（GIS）(丁)數值地形模型（DTM）
