  - label: A
    content: 套疊照片的點資料與各行政區的面資料
  - label: B
    content: 計算照片點資料與各行政區的最近距離
  - label: C
    content: 計算照片點位的視域範圍後，套疊各行政區的面資料
  - label: D
    content: 照片點資料環域分析後的圖層，套疊各行政區的面資料
