  stem: 軍國主義是指一個國家準備戰爭意圖強烈，令國家內政治經濟及教育文化等各領域均從屬於軍事價值思想下，發展軍事工業、強迫人民當兵、實行獨裁，發動侵略等壯大國家的行為。1921年皇太子裕仁（即後來的昭和天皇）攝政，明治時代元老重臣如伊藤博文等大部份身故，日本的政界貪污醜聞、舞弊、干涉選舉等事件常常發生，軍部不滿政黨政治的運作，右翼分子反對親西方政策，首相在1918到1932年間頻繁更換；右翼分子甚至拿「尊皇討奸」為號，公開刺殺首相原敬、濱口雄幸及犬養毅。
    日本自明治維新以來實施全面徵兵，軍人多半來自保守的農村，看到米價上漲、通貨膨脹，認定政府政策偏袒富人；民主政治以及政黨派系就是國家積弱的禍首。傳統武士道信奉追求忠貞愛國，效忠天皇，而非政黨政客。當時極端民族主義者建議廢除民主政治，把實體歸還給天皇；日本人民是大和民族的子民，比世界各民族優秀，理應統治他們。於是，推動軍國主義的政治團體林立，像黑龍會、在鄉軍人協會、櫻花會及血盟團等。
    一戰後西方列強推行保護主義，日本經濟衰退，對外貿易赤字，股票下跌，銀行出現債務危機；1923年發生了關東大地震，使原來倒退的經濟更加雪上加霜。失業人數高達300萬。在人口壓力下，軍國主義者提倡以軍事擴張的方式，開拓市場，在亞洲建立一個由日本支配的「生存空間」。
    根據上文，日本軍國主義興盛的原因很多，下列何者說法<u>較不恰當</u>？
  options:
  - label: A
    content: 大和民族優越感，應擴張版圖並統治亞洲民族
  - label: B
    content: 軍部與右派不滿政黨政治與親西方政策
  - label: C
    content: 關稅壁壘使日本經濟衰退，加上關東大地震、失業人數不斷攀高
  - label: D
    content: 中國長期的衰敗乃促成日本右派勢力崛起的主因
