  stem: 「中國數千年來，立國之根本，在於道德。惟此孔子之道，互古常新。近自國體變更，無識之徒誤解平等自由，逾越範圍，蕩然無守，綱常淪棄，人欲橫流，幾成為土匪禽獸之國。幸天心厭亂，大難削平。本大總統躬膺重任，早作夜思，以為政體雖取革新，而體俗要當保守。」關於這段文字，下列解讀何者較為適當？(甲)大難指辛亥革命；(乙)文中可見溥儀有復古尊孔之意；(丙)國體變更指君主政體變為民主共和；(丁)文中顯露袁世凱為其帝制作安排的野心。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丙
  - label: D
    content: 甲丁
