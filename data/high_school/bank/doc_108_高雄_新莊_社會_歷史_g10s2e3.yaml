  stem: 陳爸爸出生於高雄，幼年時就讀於當地的公學校，後來轉到東京求學。有一天，他看到報上登出某地新成立的政府因與日本關係密切，急需日語教學人才；由於他的語言較無問題，願意應徵，也立刻被錄用。他從東京火車站出發，兩天就到達該地，在當地中學教了好幾年日語，晚上還兼差，教當地官員及家眷日語。直到第二次世界大戰結束之後，他才回到臺灣。陳爸爸這幾年的教學生涯最可能是在哪裡度過？
