  type: single
  page: 2
  stem: 有學者說：「周恩來曾經說過：『侵略中國的日本，是中共崛起大陸的恩人。』他這話只吐露了中共四十年間國際關係史的三分之一。餘下的三分之二，我以為再分一半：一半的恩人，應該提到1946年6月以後，大批武裝中共部隊的□；後一半的恩人，應該提到1945年12月以後變更對華政策的□。」文中的兩個□，依序應填人何者？
