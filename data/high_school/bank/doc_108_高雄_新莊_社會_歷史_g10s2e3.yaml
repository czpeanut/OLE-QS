  - label: B
    content: 北韓；美國
  - label: C
    content: 美國；蘇聯
  - label: D
    content: 蘇聯；美國
- id: doc_108_高雄_新莊_社會_歷史_g10s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「乾隆二十二年（1757年），清廷下令封鎖全國對外口岸，僅保留＊作為對外通商港口。當時在＊進行貿易的包括花旗國（美國）、紅毛國（英國）、雙鷹國（奧地利帝國）、單鷹國（普魯士）、黃旗國（丹麥）等國商人。雖還是得以有貨物流通，但這種貿易形式讓當時勢力最大的英國相當不滿，因為在中國經商必須受諸多嚴格限制，＊當局和朝廷常常互相推卸責任……。」請問關於上文敘述下列何者正確？
  options:
  - label: A
    content: 英國要求開港是因應工業化的需要，急於尋找煤鐵的原料供給國
  - label: B
    content: 英國對貿易形式不滿是由於想與朝廷官方平等往來均不得其門而入
  - label: C
    content: 中國對外商的嚴格限制包括禁止向外商輸出茶葉、絲綢及瓷器
  - label: D
    content: ＊應為廣州。清朝開放廣州做為通商口岸，代表中國已承認與他國間的平等關係
- id: doc_108_高雄_新莊_社會_歷史_g10s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「這個時代」女性所面臨的問題固然細小，卻也是非常實際的。他們為可以不裹腳而感到高興，可不裹腳就要受教育，不然就找不到丈夫。小腳可以找一個老思想的丈夫，受過教育的大腳可以找個新思想的丈夫。請問：「這個時代」可能是？
  options:
  - label: A
    content: 1890年代
  - label: B
    content: 1900年代
  - label: C
    content: 1920年代
  - label: D
    content: 1940年代
- id: doc_108_高雄_新莊_社會_歷史_g10s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 明治初期的一位農民說：「老百姓發起暴動，是為了要求減低錢糧稅收，但內部抗爭造成的犧牲太大，與其如此，何不努力改良農業以增加收穫呢？」根據這位農民的說法推論，下列何者可能為當時的社會背景？
  options:
  - label: A
    content: 列強大量往日本傾銷生產過剩之糧食作物，日本農業受到打擊，導致農民發起暴動
  - label: B
    content: 政府為了支持工業化政策，將農業歲入視為財政的主要供應來源，造成農民反抗
  - label: C
    content: 日本將從中國獲得的大筆賠款全數用於培植工業，引發農民強烈不滿
  - label: D
    content: 政府出兵西伯利亞，將糧食集結前線，造成農民恐慌，引起一連串暴動
- id: doc_108_高雄_新莊_社會_歷史_g10s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 1920年代初，第三國際派遣曾在爪哇從事共產活動的馬林到中國。馬林在桂林會見孫中山，相談甚歡。適逢香港發生反帝國主義的海員大罷工，孫中山表明支持，馬林認為雙方有合作基礎。他也理解中共當時只有黨員數百人，而國民黨有徒眾數十萬，但組織鬆散，容易操控。不過，孫中山已表明不容許國民黨之外另造革命中心。根據上文，為了與國民黨含作，蘇聯代表馬林會向當時中共總書記陳獨秀，提出怎樣的建議？
  options:
  - label: A
    content: 聯合東南亞共產黨，在莫斯科的指揮下，奪取香港
  - label: B
    content: 遊說國民黨，共同加入以蘇聯為首的國際反帝聯盟
  - label: C
    content: 與國民黨合作，以對等的地位，組成抗日統一戰線
  - label: D
    content: 中共黨員以個人身分加入國民黨，認同反帝反軍閥
- id: doc_108_高雄_新莊_社會_歷史_g10s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有本新書的簡介如下：「這場戰爭是東北亞乃至世界近現代史上非常關鍵的歷史事件，……以往的主流說法認為，這是為了抵抗□對遠東地區的入侵而不得不為的一場戰役；日本代表亞洲黃種人打敗了入侵的白人帝國，是一場正義的、主導未來的戰爭。」關於這場戰爭的描述，下列何者正確？
  options:
  - label: A
    content: 這場戰爭的戰場在朝鮮境內
  - label: B
    content: 日本在這場戰爭中大量徵調臺灣軍伕協助作戰
  - label: C
    content: 這場戰爭為日後的太平洋戰爭埋下伏筆
  - label: D
    content: 這場戰爭使日本順利擺脫吞併朝鮮的絆腳石
- id: doc_108_高雄_新莊_社會_歷史_g10s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 一篇發表於《申報》的文章描述清末民初中國學術思想的發展：「這個運動有兩個要點與那些白話報或字母的運動絕不相同。第一，這個運動沒有『他們』、『我們』的區別。白話並不單是『開通民智』的工具，白話乃是創造中國文學的唯一工具。……第二，這個運動老老實實的攻擊古文的權威，認他做『死文學』。……在建設的方面，有兩件事可記，第一，是白話詩的試驗。……第二，是歐洲新文學的提倡。」從文中該運動強調的不同點來看，此運動帶有怎樣的性質？
  options:
  - label: A
    content: 全民性、託古改制
  - label: B
    content: 全民性、反對傳統
  - label: C
    content: 階級性、託古改制
