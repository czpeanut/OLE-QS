  stem: 「明末耶穌會傳教士利瑪竇來華傳教，知悉中國人對他攜來的西洋物件，尤其是世界地圖，很感興趣。於是，利瑪竇就畫了一幅地圖送給知府王泮。利瑪竇了解中國自視為天朝，居於世界中心，因而為了取悅中國人，就把中國從偏東移到中央。王泮收到地圖後，複製很多幅作為贈送高官和同僚的禮物，受贈者都很喜歡。」有關利瑪竇在華傳教策略的敘述，以下何者合於史實？
  options:
  - label: A
    content: 誇大中國國際地位以取得人民的信任，以利於向廣大人民宣教
  - label: B
    content: 打扮成洋僧成功取得中國人民的信任，有利其在華的傳教
  - label: C
    content: 討好士大夫，順利說 服皇帝教會是唯一能改造中國政治的有利武器
  - label: D
    content: 以當時先進的西方科技知識結交士大 夫，以利傳教
