  page: 1
  stem: 良友畫報為1920年代中國的大型攝影畫報，右圖是1935年一張畫報封面。以下四人對這 張封面照的解讀何者較為恰當？
  options:
  - label: A
    content: 甲：婦女也能出現在畫刊封面大方展現自己，可見民初社會風氣已較為開放
  - label: B
    content: 乙： 傳統觀念開始改變，女子不再追求知書達禮，雜誌模特兒成為職業首選
  - label: C
    content: 丙：圖中女性 身穿中式旗袍，反映時人對西方文化、服飾仍然抱持抗拒態度
  - label: D
    content: 丁：受到中西文化交流 的影響，崇洋媚外風氣盛行，西式服裝打扮成為主流
