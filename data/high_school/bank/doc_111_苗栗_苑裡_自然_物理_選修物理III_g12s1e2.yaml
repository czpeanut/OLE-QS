  - label: D
    content: 從白色與透明條紋的規律性，可以推測微波爐裡的電磁波波源在圓盤中央
  - label: E
    content: 若要從賞驗結果推算光速，需要微波爐的電磁波頻率及測量兩透明條紋或是白色條紋間距
