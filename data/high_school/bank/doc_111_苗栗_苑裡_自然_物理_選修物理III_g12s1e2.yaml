  stem: 某同學對力學波和電磁波進行類比，總結出下列內容，其中何者<u>錯誤</u>？
  options:
  - label: A
    content: 力學波的頻率、波長和波速三者滿足的關係，對電磁波也適用
  - label: B
    content: 力學波和電磁波都能產生干涉和繞射現象
  - label: C
    content: 力學波的傳播依賴於介質，而電磁波可以在真空中傳播
  - label: D
    content: 力學波既有橫波又有縱波，而電磁波只有縱波
