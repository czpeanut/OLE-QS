  stem: '社會權是 20 世紀初期為因應社會經濟居於劣勢者之特殊需要，以解決資本主義高度發展後所帶來的社 會矛盾和弊害，要求國家或是公權力必須積極作為的人權概念。請問下列何者是我國落實社會權的作為？

