  stem: 國籍法修正施行2年多來，已有502位新住民因歸化條件放寬順利成為中華民國國人，另有133位殊勳或高專人才歸化取得國籍，內政部會持續為想要成為台灣人的外國人，提供更加友善便捷的服務。請問：下列有關國籍法修正內容的敘述，何者正確？
  options:
  - label: A
    content: 修法後，新住民無須放棄原有國籍，皆能歸化成為中華民國人
  - label: B
    content: 因受家暴離婚未再婚、喪偶後未再婚的新住民，申請歸化合法居留期間由6年降至4年
  - label: C
    content: 修法後婚姻移民的配偶在申請歸化時不再需要提出財力證明
  - label: D
    content: 修法後外國人得在成功歸化，取得國籍後的一年內，再提出放棄原有國籍證明
  - label: E
