  number: 12
  type: single
  page: 2
  stem: '老師在看<u>珈佳</u>的公民與社會科筆記時，發現有地方寫錯了。請問：是下咧哪一項<u>出錯</u>呢？

    | (A) | 自由之家 | 採用「政治權利與公民參與」的標準來評估各國的民主程度 |

    | --- | --- | --- |

    | (B) | 人權觀察 | 關注愛滋病患者、同性戀及童工之權利 |

    | (C) | 無國界記者 | 致力推進新聞自由，避免新聞工作者受迫害 |

    | (D) | 國際特赦組織 | 提及兩公約對思想、良心及宗教自由的權利保護，因此要求無條件地釋放良心犯 |'
  options:
  - label: A
    content: (A)
  - label: B
    content: (B)
  - label: C
    content: (C)
  - label: D
    content: (D)
