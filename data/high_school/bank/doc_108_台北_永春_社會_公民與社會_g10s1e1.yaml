  group_stem: '(二)台東布農族原住民王光祿2013年以撿到的現代獵槍，射殺保育類野生動物長鬃山羊和山羌各1隻供家人食用，違反原住民只能用自製獵槍打獵、獵物限用學術及祭典用途的規定，遭判刑3年半確定。<u>(甲)本案經法律扶助基金會向最高檢察署聲請非常上訴獲准並暫緩執行</u>。最高法院合議庭法官認為，(乙)<u>現行法律對原住民狩獵的規定，不符《兩公約》中對原住民保障，且違反《憲法》維護原住民傳統意旨，裁定停止審判，聲請大法官解釋</u>，這是最高法院首度聲請大法官解釋。

    最高法院指出，關於原住民打獵的相關規定既都未確實依據《原住民族基本法》檢討修正，且不符合《兩公約》揭示應事先與原民部落諮商，獲得其同意，和分享科技之惠的尊重、雙贏理念，也違反《憲法增修條文》肯定多元文化、維護原住民傳統及促進其自治發展的意旨。'
