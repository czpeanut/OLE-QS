  section: 1
  number: 6
  type: single
  page: 1
  stem: 近日，外交部長<u>吳釗燮</u>舉行記者會宣布，我國即日起與吉里巴斯斷交。這是繼索羅門群島後，我國接連與吉里巴斯斷交，一周內發生兩起斷交事件，震驚全國，目前邦交國僅剩下15個。總統強調：「現在距離總統大選只剩下一百多天，這也是中國在這個時刻密集打擊我們的原因，但我要告訴我們所有的同胞，我們如果在這裡選擇放棄堅持的話，那我們世世代代的臺灣人就不會有主權，不會有自由，不會有民主，我們將會一無所有。」根據上述兩岸關係，請問：關於我國主權之敘述何者正確？
  options:
  - label: A
    content: 兩岸的分裂分治，造成事實主權的不穩定
  - label: B
    content: 邦交國的減少顯示法理主權受到嚴重挑戰
  - label: C
    content: 我國因主權問題，造成統治的正當性缺乏
  - label: D
    content: 目前我國主權範圍含自由地區與大陸地區
