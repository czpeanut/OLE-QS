  number: 1
  type: single
  page: 1
  stem: 原住民族委員會已於今年八月公告明年原住民族歲時祭儀放假日，包含16族、19種祭典可於原住民族歲時祭儀期間放假一天；若勞工在期間都沒有休假，雇主應給予加班費或補休一天。更表示，無論是軍、公、教、勞工或學生，只要具有原住民身分，都可以在所屬族群歲時祭儀期間放假一天，以阿美族豐年祭為例，原訂歲時祭儀期間為7月1日至9月30日，族人得依實際舉辦日期擇一天放假。請問：「歲時祭儀假」的實施，讓原住民族能請假返鄉參加族人年度最重要的祭典節，是屬於何項人權的保障？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 生存權
  - label: C
    content: 文化權
  - label: D
    content: 和平權
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 承上題，依瓦薩克( Karel Vasak)所提之三代人權說來判斷，第一題所欲保護之權益與下列選項何者屬同一代人權？
  options:
  - label: A
    content: 馬拉拉為巴基斯坦的女孩爭取接受教育的權利
  - label: B
    content: 鄭南榕為爭取辦報發表意見之可能而選擇自焚
  - label: C
    content: 芝加哥奧黑爾機場員工因工資過低而計劃罷工
  - label: D
    content: 達賴喇嘛為爭取西藏能獨立自治而奔走於國際
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 1948年聯合國大會公布《世界人權宣言》後，又於1966年通過《公民與政治權利國際公約》及《經濟、社會與文化權利國際公約》，此三份文件合稱為「國際人權憲章」。關於上述的「國際人權憲章」，下列敘述何者正確？
  options:
  - label: A
    content: 世界人權宣言及兩公約對簽署國皆具有強制性的法律約束力
  - label: B
    content: 我國非聯合國會員因此迄今未簽署並推動兩公約的權利保障
  - label: C
    content: 公民與政治權利國際公約的規範內容較著重於保障第二代人權
  - label: D
    content: 經濟、社會與文化權利國際公約的權利性質大多屬於積極人權
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 近年來，許多先進民主國家政府信任度持續下滑，有學者指出傳統代議民主國家強調依法行政的形式「合法性」（legality），而忽略人民實際感受與回應的實質「正當性」（legitimacy）。下列敘述何者乃是強調「正當性」更高於「合法性」的現象？
  options:
  - label: A
    content: 市長因鄰縣受災時未搶救而造成嚴重傷亡，引爆民怨提前下臺
  - label: B
    content: 張三違規右轉被罰而心生不滿，欲聯合相同經驗民眾上街遊行
  - label: C
    content: 夜市居民網路舉發少數攤販違規營業，獲得眾多網友按讚支持
  - label: D
    content: 現任首長要求檢調單位監聽敵對陣營候選人，以利其競選連任。(103學測)
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國國籍取得之途徑採「折衷主義」。請問：下列何人<u>無法</u>取得中華民國國籍？
  options:
  - label: A
    content: 李先生是中華民國國民，女兒小聆是在日本留學時出生
  - label: B
    content: 豪豪的父母是美國人，選擇在美麗的台灣生下他
  - label: C
    content: 寶寶出生時被丟棄在台大醫院門口，不知道父母是何人
  - label: D
    content: 張教授夫婦是中華民國國民，在美國留學期間生了兒子小賢
