  number: 7
  type: single
  page: 1
  stem: 護照是主權國家發給本國國民得以出入國境和國外旅行、居住的身分證明與國籍證明。請問：以下關於我國護照之說明何者正確？
  options:
  - label: A
    content: 只要擁有我國護照，便可不需取得簽證進出任何國家
  - label: B
    content: 我國所發行的護照，僅可入境與我國有邦交關係國家
  - label: C
    content: 在海外若不幸弄丟護照，即無法求助大使館或領事館
  - label: D
    content: 根據簽證自由度指數，我國護照的被接受度高於中國
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 針對行政院推出《勞基法》「一例一休」再修法，包括鬆綁7休1、提高加班工時及工時帳戶等彈性政策等，經濟系教授指出《勞基法》違憲，《勞基法》中的「例假」規定勞工在特殊情況下才能工作，但政府無權規定勞動者不能工作。另一位教授指出，立法通過的「一例一休」是進步的立法，來保障勞動者身體健康。請問：關於上述兩位教授的敘述何者正確？
  options:
  - label: A
    content: 由上述可知，我國人權的發展已從個人走向集體層面
  - label: B
    content: 兩位教授提出的權利，皆強調自由、平等等公民人權
  - label: C
    content: 政府透過保護勞動者身體健康，為保障勞動者生存權
  - label: D
    content: 政府無權規定勞動者是否工作，是侵害自由權的表現
