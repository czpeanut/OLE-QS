  group_stem: '(五)荷蘭禁止民眾在公共場合穿戴覆蓋臉部面紗，包括罩住全身與臉部的罩袍或罩住臉部的尼卡布，這項對穆斯林女性實施、具爭議性的禁令於近日生效。人口約1700萬的荷蘭，估計有200至400名女性穿戴罩袍（burqa）或尼卡布（niqab）。荷蘭針對這個議題的政治討論超過 10 年，立法機構 2018 年 6 月通過這項法案。內政部發聲明表示：「從現在起，教育設施、公共機構和建築物，以及醫院和公共運輸，禁止民眾穿戴覆蓋臉部衣物。」大家在公開場合必須能被他人辨認，所以這項禁令也適用遮蓋臉部的安全帽或頭套，違者將處以150歐元（約新台幣5200元）罰款。

    28歲的史畢納（Anne Spillner）告訴法新社：「荒謬。我認為這很荒謬。你應該尊重彼此的價值觀，我認為這是他們所想到最愚蠢的規定。」

    21歲、拒絕透露姓氏的哈希納（Hasnaa）表示，人們「應該有想穿什麼的自由，透過我們的外觀去表達自己」。但67歲、同樣拒絕透露姓氏的薩斯基亞（Saskia）表示贊成這項禁令，「因為你不能看見（罩袍）背後的人。如果有人從頭遮到腳並遮住他們的臉，那就是一個威脅」。(中央社,2019/8/2)'
