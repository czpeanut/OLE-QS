- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 所謂集會自由乃是「多數人為達共同目的所為一時之結合，實為表達言論自由的一種方式」，我國之集會遊行法經多次修正，野草莓學運後，2014年3月再次作出釋字718號，說明「緊急性與偶發性」的集會遊行，若主管機關執意以「許可制」作為申請之方式，便違反憲法第14條保障人民有集會自由之意旨及第23條比例原則，應自中華民國104年1月1日起失其效力。下列何者可能為釋字718號的主要意涵？
  options:
  - label: A
    content: 確實保障個人可以享有組成新社團之自由
  - label: B
    content: 在任何時候申請集會遊行均改採事後報備制
  - label: C
    content: 落實言論自由之真義，防止其他形式之侵害
  - label: D
    content: 集會遊行可能造成將來不確定之損害故應明訂禁止
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 請問關於正當性與合法性概念之敘述下列何者正確？
  options:
  - label: A
    content: 布吉納法索總統龔保雷因企圖修憲延長任期，遭到該國民眾強烈反彈而遭軍方施壓倉促下台，顯示其統治權雖有正當性但欠缺合法性
  - label: B
    content: 烏克蘭總統亞努科維奇因其親俄政策遭到國內民眾強烈反對而辭職，顯示其統治權雖有合法性但已失去正當性
  - label: C
    content: 南鐵東移拆遷案引發民怨並對政府激烈抗爭，顯示此案雖有正當性但欠缺合法性
  - label: D
    content: 日本首相安倍晉三針對其延後調漲消費稅的政策，為了解民意是否認同而解散國會提前改選，顯示其統治權已不具正當性及合法性
