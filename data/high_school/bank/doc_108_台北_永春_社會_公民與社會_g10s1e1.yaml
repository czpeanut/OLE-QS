  group_stem: '(三)墨西哥原為實施單一國籍制的國家。然而考量國內政治、經濟及社會環境之變遷，眾多墨國國民為生計移居他國(主要為美國，為嘉惠數百萬居留國外因害怕喪失墨西哥國籍不敢歸化他國之墨西哥國民，墨國政府於1997年修正《墨西哥憲法》第30條有關國籍之規定，成為承認雙重國籍之國家，並於1998年修改《國籍法》。《墨西哥憲法》第30條規定，墨西哥國籍因出生或歸化取得：

    A.生為墨西哥國民者：(1)凡在共和國內出生者，不論其父母之國籍為何。(2)在國外出生者，其父母均為在國內出生之墨西哥國民，或其父為在國內出生之墨西哥國民，或其母為在國內出生之墨西哥國民。 (3)在國外出生者，其父母均為歸化之墨西哥國民，或其父為在歸化之墨西哥國民，或其母為歸化之墨西哥國民。 (4)在墨西哥之軍事或商業船艦或航空器上出生者。

    B.歸化為墨西哥國民者：(1)外國人自外交部取得歸化證書者。(2)外國女士或男士與墨西哥男性或女性國民結婚、在國內設有住所且符合法定之其他要件者。'
