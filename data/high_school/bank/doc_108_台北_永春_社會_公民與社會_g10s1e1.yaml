  stem: '<u>小</u>薇在上完「人與人權」一課後，對人權的演進還是不太了解，因此他上網查詢資料，並整理成如下表格，但只有一項資料完全填對，請問下列哪一項資料是正確的？

    |  | 第一代 | 第二代 | 第三代 |

    | --- | --- | --- | --- |

    | (A)興起背景 | 工業革命與地理大發現 | 對於君權神授說的抵抗 | 世界大戰與全球化 |

    | (B)爭取權利 | 自由與公民政治權利 | 和平生存與永續發展 | 經濟社會與文化權利 |

    | (C)權利性質 | 消極人權 | 集體人權 | 新興人權 |

    | (D)主要權利 | 自由權與參政權 | 工作、醫療、教育等權利 | 和平生存、合作發展、環境權等 |'
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s2_18
  section: 2
  number: 18
  type: single
  page: 2
  stem: 上文中，(甲)劃線處提及臺灣人民要入境中國大陸，必須辦理「臺胞證」才能入境。關於出入境臺灣與中國大陸無法使用護照，下列何者為最可能的理由？
  options:
  - label: A
    content: 臺灣與中國大陸政府體制不同，因此必須額外申請證件
  - label: B
    content: 臺灣法理上主權包含大陸地區，因此不承認其政府主權
  - label: C
    content: 中國大陸擁有臺灣地區之主權，因此以臺胞證控管入境
  - label: D
    content: 中國大陸不承認臺灣政府主權，因此否認中華民國護照
  group_stem: '(一)因言論和文章經常批評中國時事、讓中國政府相當頭痛的獨立部落客周曙光，與台灣配偶結婚後來臺已超過6年，2018年5月他成功申請中華民國身分證，特別挑在6月4日，前往申請中華民國護照。<u>周曙光也說，(甲)拿到護照後若下次要回中國探望老家的父母，得換拿台胞證了。 </u>

    1971年出生，綽號佐拉的周曙光，在中國時常因評論時事，挑戰中共敏感新聞審查，被外媒稱做「中國公民記者第一人」，2011年他和臺灣籍妻子在中國登記結婚後，同年10月搬到臺灣居住，國人大多對他陌生，但了解他的故事後都很佩服。

    來臺已7年，<u>周曙光表示(乙)在中國最羨慕的就是臺灣民選制度，所以未來也想要體驗一下真正的民主，未來希望在花蓮瑞穗鄉選個里長來看看。他提到：「我希望能夠更進一步去了解台灣的選舉，然後寫出來，讓更多中國的人有能夠結社結黨的能力。」</u>但依《兩岸人民關係條例》規定，外籍配偶必須定居超過10年才有被選舉權，周曙光今年來臺定居第7年，還無法登記參選，目前還是只能靠寫部落格對外發表意見。'
