  stem: 聯合國在1948年簽署《世界人權宣言》，人權成為普世價值，受到各國法律的保障。下列關於人權的敘述何者正確？
  options:
  - label: A
    content: 人權是人人享有的權利，其概念是固定的，並不會隨著時代發展不斷擴充
  - label: B
    content: 人權的實踐在有些事件中會出現衝突的現象，造成群體之間的爭執與糾紛
  - label: C
    content: 在聯合國及人權團體的監督下，各國家對於人權保障的落實程度大致相同
  - label: D
    content: 政府保障基本人權是為普世價值，即使是共產黨統治的極權國家也不例外
  - label: E
    content: 現行人權實踐的範圍，除了針對個人權利之外，並且包含集體權利的存在。(107指考)
