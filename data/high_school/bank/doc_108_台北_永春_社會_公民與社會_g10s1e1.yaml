  stem: 傅榆一句：「我希望我們的國家，可以被當成獨立的個體來看待，這是我做為臺灣人最大的願望。」後有涂們：「很高興來中國臺灣擔任頒獎嘉賓」，引發金馬獎統獨爭議。其實不論是傅榆還是涂們，本質上他們同樣秉持何種信念發表以上的言論？
  options:
  - label: A
    content: 國家認同
  - label: B
    content: 民族自決
  - label: C
    content: 統獨意識
  - label: D
    content: 權利保障
  group_stem: '(四)第55屆金馬獎最佳紀錄片得主「我們的青春，在台灣」導演傅榆得獎致詞表示：「希望我們的國家可以被當成真正獨立的個體來看待」。這段被化約解讀成「臺獨」的言論，讓現場中國藝人個個自危。2017年榮獲金馬獎影帝、曾親眼見證「血觀音」電影臺灣導演<u>楊雅喆</u>上臺拉出「沒有人是局外人」；涂們致詞趕緊說：「中國臺灣」；鞏俐取消上台頒獎也被引申為「無言抗議」。

    華人電影界盛事再次挑動兩岸敏感神經，中國入口網站直撥到傅榆致詞後，畫面突然中斷。事後有香港媒體報導，嚴查管制言論的中共廣電總局、中宣部、網信辦等部門，曾通告各媒體要篩選金馬獎相關新聞及資訊。在新浪微博，不少中國網民轉貼傅榆致詞片段，儘管馬上遭刪除，但網民仍然持續討論。截至本篇新聞發稿，新浪微博「鞏俐拒絕頒獎」新聞有258萬筆搜索、其餘「中國一個都不能少」、「陶晶瑩」也都上了熱搜前5名。

    (中央社,2018年12月26日,取自http://www.cna.com.tw/news/amov/201811180104.aspx)'
