  stem: 雅典是最早的民主政體，且實行直接民主制，公民能直接參加對立法和行政議案的投票，為希臘文明的發展做出了巨大的貢獻。請問：下列對於雅典民主制度的敘述，何者正確？
  options:
  - label: A
    content: 雅典除奴隸外皆可參與公共事務，為普遍人權的起源
  - label: B
    content: 公民能輪流擔任官職，並參與公民大會商討公共事務
  - label: C
    content: 雅典的公民除享有權利，且須盡義務及具備一定能力
  - label: D
