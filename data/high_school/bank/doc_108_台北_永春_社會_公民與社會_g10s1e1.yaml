  page: 1
  stem: '承上題，我國民眾對台灣前途發展呈現統、獨等不同的立場，主要原因最可

    能為下列何者？'
  options:
  - label: A
    content: 國內傳播媒體的報導，影響民眾選擇的趨向
  - label: B
    content: 兩岸分列分治的事實，導致國家認同的歧異
  - label: C
    content: 國內省籍情結的激化，形成文化認同的隔閡
  - label: D
    content: 兩岸政經體制的差異，造成主權認定的模糊
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 下列對於現代國家與現代國家構成要件的描述何者正確？
  options:
  - label: A
    content: 現代國家有別於傳統的封建與帝國型態，都是所謂的民族國家(nation-state)
  - label: B
    content: 中國大陸雖然也有選舉，但是因為它的選舉被認為被操控且無政黨競爭的性質，所以政府的正當性迭遭質疑
  - label: C
    content: 我國的國籍法採屬地主義為主，美國採取的是屬人主義為主，所以兩地常常出現所謂雙 重國籍的問題，引發政壇的糾紛
  - label: D
    content: 台北駐美代表處(Taipei Economic and Cultural Representative Office in the U. S.)屬於我國的境外領土，我國在館舍範圍內可以行使主權
- id: doc_108_台北_永春_社會_公民與社會_g10s1e1_s1_12
