  type: multiple
  page: 2
  stem: '因疫情因素，松山高中 32 週年校慶園遊會鼓勵班級攤位轉型，其中以套圈圈最為常見。

    遊戲規則如下：

    (1)遊戲場域將寶特瓶排成九宮格狀且兩個相鄰的寶特瓶中心相距 20 公分。

    (2)將不同大小的圓圈套進裝滿水的寶特瓶即可得分。

    已知寶特瓶瓶身的半徑為 3 公分；有 2 種不同大小的圈圈，半徑分別為 5 公分、7 公分。

    現今將遊戲場地坐標化，如圖(二)。設中間的寶特瓶中心坐標為 $O_{1}$（0，0），其相鄰有 4 個寶特瓶，其中 2 個寶特瓶坐標分別為 $O_{2}$（20，0）、$O_{3}$（0，20）。下列為落地後的圈圈方程式，何者恰好會套中寶特瓶？

    註：若圈圈落地後的方程式為 $x^{2}$＋$y^{2}$＝49，則可套中方程式為 $x^{2}$＋$y^{2}$＝9 的寶特瓶，如圖(三)。'
  options:
