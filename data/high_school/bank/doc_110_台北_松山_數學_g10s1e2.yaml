- id: doc_110_台北_松山_數學_g10s1e2_s1_3
  section: 1
  number: 3
  type: calc
  page: 1
  stem: 已知 A（－1，0）、B（3，4），滿足$\overline{PA}$：$\overline{PB}$＝2：3 的圖形為一個圓。
  answer:
  - ○
  answer_status: verified
  answer_source: answer_key
  explanation: '○：令 P（x，y）

    ∵3$\overline{PA}$＝2$\overline{PB}$

    ∴9$\overline{PA}^{2}$＝4$\overline{PB}^{2}$

    ⇒ 9（（x＋1）$^{2}$＋$y^{2}$）＝4（（x－3）$^{2}$＋（y－4）$^{2}$）

    ⇒ $9x^{2}$＋$9y^{2}$＋18x＋9＝$4x^{2}$＋$4y^{2}$－24x－32y＋100

    ⇒ $5x^{2}$＋$5y^{2}$＋42x＋32y＝91

    ⇒$5\left( x^{2}+\frac{42}{5}x +\frac{441}{25} \right) +5\left( y^{2}+\frac{32}{5}y +\frac{256}{25} \right)$＝$91 +\frac{441}{5}+\frac{256}{5}$

    ⇒$5\left( x +\frac{21}{5} \right) ^{2}+5\left( y +\frac{16}{5} \right) ^{2}$＝$\frac{1152}{5}$

    ⇒$\left( x +\frac{21}{5} \right) ^{2}+\left( y +\frac{16}{5} \right) ^{2}$＝$\frac{1152}{25}$為一圓'
