  stem: 中國繪畫在畫面感上的追求與西方藝術「自然寫實」不同。以范寬的<u>谿山行旅圖</u>為例，文人畫家將山水畫呈現於畫布上，以平行線的構圖方式，層層描繪呈現山巒的風貌，表現理學中君尊臣卑的思想。這種將畫作加入文人的思想與哲學觀念的方式，除了講求形似以外，更進一步將文人畫家腦內理想的哲學倫理展現在觀賞者的眼前。而這正是中國文人作為藝術家時在寫實與寫意之間的取捨。請問有關這段文章，下列解讀何者正確？
