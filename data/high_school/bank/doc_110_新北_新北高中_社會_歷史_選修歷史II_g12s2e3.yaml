- id: doc_110_新北_新北高中_社會_歷史_選修歷史II_g12s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 工業革命之後，人們對於地球的資源需求量更高也造成更多破壞，有鑑於此，各國開始約束彼此對環境的汙染，例如：1997年管制溫室氣體排放的<u>京都議定書</u>及 及1975年提倡保護野生動植物交易的<u>華盛頓公約</u>。這些公約讓永續觀念得以彰顯，但在開發以及環保之間如何平衡，公約是否能遵守則是未來應該重視的事情。請問關於這段文字下列何者正確？
  options:
  - label: A
    content: 根據條約人類從二十世紀後半才開始大規模汙染環境
  - label: B
    content: 歷經工業革命、環保意識抬頭，如今人類早已進入了與環境永續發展的階段
  - label: C
