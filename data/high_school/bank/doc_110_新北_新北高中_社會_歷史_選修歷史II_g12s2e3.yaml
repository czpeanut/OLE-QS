  stem: 有學者指出游牧民族南下進犯，不單是為了征服，而是因為「生存問題」。當全球氣候異常，北方越來越冷的時候，原本逐水草而居的游牧民族沒有足夠糧食，故他們必須南下。西晉時期正是全球氣候為寒冷的時期，因此外族的入侵除了當時中國政局不穩之外，氣候也應該納入原因之一。以下有關題幹的推論，何者正確？
  options:
  - label: A
    content: 南北朝游牧民族之所以向中原侵襲是因為其兵強馬壯
