- id: doc_110_新北_新北高中_社會_歷史_選修歷史II_g12s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 石油資源在現代越來越重要，掌握石油即是掌握權勢與金源。諸多科學研究指出，亞洲蘊含石油量占全世界石油量的一半，尤其是波斯灣地區蘊藏豐富的石油，於是波斯灣地區成為兵家必爭之地。其中，阿富汗本身的地理位置成為美國看中的目標，然而面對當地塔利班政權的反對，美國認為唯有防堵他們的勢力，才能確保從中東國家穩定的輸入石油。因此美國與其他國家，特別是G8（八工業國家）多次在各國大會中討論如何因應塔利班問題。2001年的九一一事件發生後，美國打著消除恐怖主義的旗幟，派兵攻打阿富汗，這些發生在中東的戰爭造成兩方大量傷亡，拖垮美國經濟，也重創當地社會。2016年川普當選之際，當時民眾普遍對於阿富汗戰爭感到反感，於是川普與塔利班談判，協定撤軍。2021年，拜登擔任總統時，美軍宣告撤出阿富汗地區。在這之後，塔利班再度崛起，阿富汗終究籠罩在戰亂中。美國為何會派兵進入波斯灣？
  options:
  - label: A
    content: 開啟第三次世界大戰
  - label: B
    content: 削弱俄羅斯的共產勢力
  - label: C
    content: 掌握中東石油資源
  - label: D
    content: 打擊塔利班政權
