  stem: 熱帶雨林具有林木密集、動植物種類多元的特性，被視為是減緩溫室效應、保護生物多樣性的重要場域。但根據一個非營利性新聞組織的報導，2018年時巴西雨林消失面積達三百三十萬英畝，剛果民主共和國一百一十萬英畝，印尼則達八十三萬英畝。巴西身為全球雨林分布最廣的國家，為了追求經濟發展一再破壞雨林。巴西執政者卻認為已開發國家在碳排放和全球暖化上要負最大責任，巴西並無義務為保護全球環境犧牲自身經濟發展，但只要富裕國家提供金援，巴西就會減少開發。但有鑑於巴西政府過去不佳的信用，西方國家主張該國必須先展示具體成果，才能再談援助問題。關於上文，我們可如何解讀？
