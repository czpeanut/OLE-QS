  stem: 二十一世紀初期，由於石油價格高漲，科學家致力投入生質燃油的研究，一來可以降低石油的使用，二來期待能減少二氧化碳的排放。於是2007年美國將全國三分之一的玉米用製造生質燃料，歐盟也訂出生質燃料要占燃料供應的比例百分之十的計畫。但這些作為後來遭到聯合國的反對，因為生殖燃油的使用導致當時某項危機。根據題幹，請問上述的「危機」應是以下何者？
