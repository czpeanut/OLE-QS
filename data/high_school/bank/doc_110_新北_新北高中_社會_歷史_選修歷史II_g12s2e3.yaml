  stem: 某學者對於臺灣石化業如此評價：「自中油一輕完工後，石化業成為帶動各種製造業的火車頭，至2000年，還有將近兩兆的年產值，同時帶動其他產業值將近八兆及三十多萬的就業人口；然而，雲林癌症村的出現、2010年六輕大火、2014年高雄氣爆等事件不斷出現，也造成臺灣不可抹的傷害。所以，石化業是個雙面刃，我們開創了未來也確實割傷了自己，因此在存廢石化的議題上，也確實需要在這兩刃之間謹慎評估。」請問學者口中的「兩刃之間」應該是指？
