  stem: 十九世紀中葉掌握俄亥州煉油廠的洛克斐勒發現石油，賺取了巨大的財富。接著他將影響力轉入鐵路業，由於鐵路業競爭激烈，洛克斐勒龐大的石油運輸需求不僅能讓他以低價運送旗下「標準石油公司」的產品，還能分得其他石油業者付給鐵路業者的運輸費用。於是獨立的油業公司逐一倒閉，不少業者選擇將公司賣給了標準石油，這使得洛克斐勒掌握美國近九成的煉油工業。有些人士對於這樣的現象憂心忡忡，要求政府立法規範，保障小型企業的生存空間。經過多年爭論，才終於通過各項相關法案。根據上述，下列何者描述正確？
