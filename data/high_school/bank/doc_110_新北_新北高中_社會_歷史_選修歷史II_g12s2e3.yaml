  stem: 現代越來越多企業標榜「綠能」，綠能是指在產生能量的過程中，對環境相對友善又能夠低排放溫室氣體的能源，其中最常見的有：太陽能、風力發電、水力發電、生質能源以地熱能。透過這些綠能，在經濟發展的過程當中，可以稍微取代傳統火力發電（燃燒煤炭、石油或天然氣）。然而要發展綠能並不是一件簡單的事情，以太陽能和風力發電為例、依靠自然而產生的能量可能面臨天氣不穩定的情況，例如陰天或者風速不夠用於發電，再加上，想要發展綠能，必須有高效率的能量轉換工具、才能彌補傳統火力發電所能供給的能源，而購置或研發太陽能板等綠能發電器材又會是一筆龐大的預算，這也使得目前世界上大多數國家仍然繼續使用火力發電。請問，關於題幹下列何者敘述，較為適當？
  options:
  - label: A
    content: 綠能雖然有助於環境永續，然而目前的科技發展尚不足以取代火力發電所帶來的能源產出
  - label: B
    content: 由於綠能並不能完全無溫室氣體的排放，所以各國也沒有迫切將火力發電轉換為綠能的需求
  - label: C
    content: 綠能不論是環境友善程度以及能源供給穩定度皆高於傳統火力發電
  - label: D
