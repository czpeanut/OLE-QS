  stem: 這個地方的巨大建築過去除了是神廟之外，還是觀測星象的地點。祭司透過在此夜觀星象，發展出一套精密的曆法。有的建築內甚至還存有巨大地下積水溶洞，形成長達三百多公里的渠道。這些水道用途為何？又通往何處？學界目前尚未討論出共識；然而，這個曾經繁榮一時的文明由於過度開發，土地負擔不起日益增加的人口，最後消失在歷史之中，其著名的建築甚至已被茂密的雨林掩蓋。請問這可能是在說明哪一個文明？
