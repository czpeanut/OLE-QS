  explanation: '(B)(C)溶液 B 為未飽和溶液，依溶解度曲線圖可知要配製飽和溶液可以透過以下三種方法

    ①降溫（要達飽和溶液的濃度較低）、②同溫時加入溶質、③蒸發減少溶劑量。

    (D)溶液 C 已經為飽和溶液，加熱後因溶解度提升，會變為未飽和溶液。

    (E)溶液 D 為過飽和溶液，加入溶質會使過量的溶質析出，而達到飽和溶液。'
