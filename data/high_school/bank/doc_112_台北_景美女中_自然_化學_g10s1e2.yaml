  - label: D
    content: $Q_{2}$＞$Q_{1}$＞$Q_{3}$
  - label: E
    content: $Q_{3}$＞$Q_{1}$＞$Q_{2}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 反應皆為乙醇燃燒，為放熱反應（熱含量：反應物＞生成物），因係數相同（反應數量相同），能量變化僅需考慮物質狀態。又熱含量大小：氣態(g)＞液態(l)，故 $Q_{3}$＞$Q_{1}$＞$Q_{2}$。
