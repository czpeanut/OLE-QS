- id: doc_112_台北_景美女中_自然_化學_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: '已知氮氣與氧氣的反應如下：

    $N_{2}$(g)＋$2O_{2}$(g) → $2NO_{2}$(g)，ΔH＝＋67.7 kJ

    試問(甲)～(戊)的敘述，有幾種可由上述反應式獲得？

    (甲)反應物與產物的狀態 (乙)反應速率的快慢 (丙)反應時涉及的能量變化 (丁)反應時涉及的莫耳數變化比 (戊)反應最終時，反應物與產物的莫耳數比'
  options:
  - label: A
    content: '5'
  - label: B
    content: '4'
  - label: C
    content: '3'
  - label: D
    content: '2'
  - label: E
    content: '1'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '上述反應式可知(甲)(丙)(丁)

    (甲)由反應式可得知，反應物與產物均為氣態；(乙)由反應式無法得知反應速率的快慢；

    (丙)由反應式可得知，反應為吸熱反應；(丁)由應式可得知，消耗 1 莫耳 $N_{2}$ 與 2 莫耳 $O_{2}$ 可生成 2 莫耳 $NO_{2}$；(戊)由反應式無法得知反應最終時，反應物與產物的莫耳數比。'
