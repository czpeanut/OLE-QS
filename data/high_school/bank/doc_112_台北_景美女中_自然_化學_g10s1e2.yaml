  explanation: '(A)不可將氫氧化鈉直接倒入容量瓶中，理由除了氫氧化鈉可能會沾附在容量瓶的瓶身之外，氫氧化鈉溶解的過程會產生大量的熱，在安全的考量上應先在燒杯中以蒸餾水溶解。

    (B) 0.4 g 氫氧化鈉為$\frac{0.4g}{40g/mol}$＝0.01 mol，因溶液為 1000 mL＝1 L，故體積莫耳濃度 $C_{M}$＝$\frac{0.01mol}{1L}$＝0.01 M

    (C)若溶液量不足 1 L，則濃度應大於 0.01 M。

    (D)因溶液密度為 1 g/mL，則其百萬分點濃度 $C_{ppm}$ 為$\frac{0.4g}{1000g}$×$10^{6}$ ppm＝400 ppm

    (E)安全吸球的操作順序應為 A（排氣閥）→ S（吸液閥）→ E（排液閥）。'
