- id: doc_112_台北_景美女中_自然_化學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關化學式的敘述，何者正確？
  options:
  - label: A
    content: 兩物質的分子式相同，則其化學性質亦相同
  - label: B
    content: 由分子式可得知物質的性質
  - label: C
    content: 兩物質的簡式相同，則其分子式亦相同
  - label: D
    content: 分子式的原子總數恆多於實驗式的原子總數
  - label: E
    content: 分子式相同，但因結構式不同，稱為同分異構物
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)同分異構物的化性不同。(B)示性式或結構式才可得知物質的性質。(C)不一定。(D)分子式亦可和實驗式相同，例如：二氧化碳 $CO_{2}$ 的分子式與簡式就相同。
