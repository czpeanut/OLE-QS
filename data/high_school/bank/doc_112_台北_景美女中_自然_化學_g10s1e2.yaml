  - label: D
    content: 0.1 莫耳三氧化二鐵
  - label: E
    content: 1 atm、25 ℃時，2.45 升氧氣
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '可將數量統一換成氧原子的莫耳數判斷。

