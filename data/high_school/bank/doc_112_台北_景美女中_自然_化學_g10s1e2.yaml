- id: doc_112_台北_景美女中_自然_化學_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '當太空人在太空飛行期間，氧氣的供給量是相當重要的，若在常溫下，太空人平均每小時需要 24.5 L 的氧氣做使用（相當於 32 克的氧氣）。若有一種超氧化鉀（$KO_{2}$）充填在呼吸面罩中，透過太空員的呼吸與其發生反應，反應式如下：

    $KO_{2}$＋$CO_{2}$＋$H_{2}$O → $KHCO_{3}$＋$O_{2}$（未平衡）

    反應釋放的氧氣供呼吸使用，若此面罩中的超氧化鉀有 284 克，不考慮其他因素，試問完全反應最多可提供太空員使用多久？（$KO_{2}$ 式量＝71）'
  options:
  - label: A
    content: 0.5 小時
  - label: B
    content: 1.0 小時
  - label: C
    content: 2.0 小時
  - label: D
    content: 3.0 小時
  - label: E
    content: 4.0 小時
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '平衡反應式 $4KO_{2}$＋$4CO_{2}$＋$2H_{2}$O → $4KHCO_{3}$＋$3O_{2}$

    $KO_{2}$ 莫耳數為$\frac{284}{71}$＝4（莫耳），得知可產生氧氣 3 莫耳，又由題意可知 1 莫耳氧氣可供給 1.0 小時，故可提供約 3.0 小時使用。'
