- id: doc_112_台北_景美女中_自然_化學_g10s1e2_s1_25
  section: 1
  number: 25
  type: single
  page: 4
  stem: '小蘇打粉（碳酸氫鈉）是家家戶必備的居家萬用神器，用途廣泛，具有去汙與除臭的效果。小蘇打粉必須溶於水才能發揮去汙及除臭的效果，維持粉末狀的功效只有摩砂。小蘇打粉（碳酸氫鈉）的溶解度與溶解曲線圖如下表與右圖所示。若使用小蘇打水進行清潔，下列關於其配製的操作，何者正確？

    | 溫度（℃） | 20 | 25 | 30 | 35 | 40 | 45 | 50 | 55 | 60 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 溶解度 （g∕100 g 水） | 9.6 | 10.35 | 11.10 | 11.90 | 12.70 | 13.55 | 14.45 | 15.45 | 16.40 |'
  options:
  - label: A
    content: 配製重量百分率濃度 20％ 的小蘇打水，可在 25 ℃ 時利用 100 g 的水加入 25 g 碳酸氫鈉粉末
  - label: B
    content: 於 40 ℃ 時 100 g 水中加入 17.56 g 的小蘇打粉，可配製成重量百分率濃度 15％ 的小蘇打過飽和溶液
  - label: C
    content: 於 50 ℃ 配好的重量百分率濃度為 10％ 的小蘇打水，降溫至 35 ℃ 時，會有白色粉末沉澱析出
  - label: D
    content: 欲使 50 ℃、500 g 的重量百分率濃度為 10％ 小蘇打水達飽和，需再加入約 15 g 的小蘇打粉末
  - label: E
    content: 由溶解度曲線可以推測出小蘇打粉溶於水的過程為放熱反應
  assets:
  - key: s1_25_f1
    kind: figure
    file: doc_112_台北_景美女中_自然_化學_g10s1e2/s1_25_f1.png
    crop:
      page: 4
      rect:
      - 446.35
      - 510.55
      - 564.0
      - 613.6
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)依題意，25 ℃時的飽和溶液的重量百分率濃度 W％＝$\frac{10.35}{10.35+100}$×100％＝9.38％，故 100 g 的水加人 25 g 碳酸氫鈉粉末，不會完全溶解。

    (B) 40 ℃時，飽和溶液的重量百分率濃度 W％＝$\frac{12.7}{12.7+100}$×100％＝11.27％

    (C) 35 ℃時，飽和溶液的重量百分率濃度 W％＝$\frac{11.9}{11.9+100}$×100％＝10.63％，此濃度大於 10％，故不會有固體析出。

    (D) 500 g 的重量百分率濃度為 10％，可知碳酸氫鈉有 500×10％＝50（g），水有 450 g

    欲在 50 ℃達飽和，加入溶質為 X g則濃度為$\frac{W_{溶質}}{W_{溶劑}}$＝$\frac{50+X}{450}$＝$\frac{14.45}{100}$（50 ℃時的溶解度），則 X 約為 15 g。

    (E)由於溫度愈高，溶解度愈大，可判斷溶解過程為吸熱反應。'
- id: doc_112_台北_景美女中_自然_化學_g10s1e2_s2_26
  section: 2
  number: 26
  type: multiple
  page: 5
  stem: 下列關於乙炔 $C_{2}H_{2}$ 與苯 $C_{6}H_{6}$ 的比較，哪些正確？（應選 3 項）
  options:
  - label: A
    content: 兩者的分子量相同
  - label: B
    content: 兩者的質量百分比相同
  - label: C
    content: 等重時，兩者所含的原子數相同
  - label: D
    content: 等莫耳時，兩者的重量比為 1：3
  - label: E
    content: 等莫耳時，兩者的分子個數比為 1：3
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)分子式不同，故分子量不同。

    (B)兩者的實驗式均為 CH。實驗式相同的化合物，必有相同的質量百分比。

    $C_{2}H_{2}$ 的質量百分比：C 占$\frac{12\times 2}{12\times 2+1\times 2}$＝$\frac{12}{12+1}$，H 占$\frac{1\times 2}{12\times 2+1\times 2}$＝$\frac{1}{12+1}$

    $C_{6}H_{6}$ 的質量百分比：C 占$\frac{12\times 6}{12\times 6+1\times 6}$＝$\frac{12}{12+1}$，H 占$\frac{1\times 6}{12\times 6+1\times 6}$＝$\frac{1}{12+1}$

    故兩者的質量百分比相同。

    (C)因兩者的質量百分比相同，故等重時，兩者所含的原子數相同。

    (D)重量比＝（莫耳數×分子量）的比

    ＝1×（12×2＋1×2）：1×（12×6＋1×6）＝1：3

    (E)兩者等莫耳數，則分子個數相同。'
