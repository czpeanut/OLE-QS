  stem: '某次酸鹼滴定實驗需配製氫氧化鈉溶液的步驟如下：

    步驟一：取 100 mL 的燒杯，將秤取的氫氧化鈉 0.4 g 倒入，加入適量的蒸餾水攪拌至完全溶解

    步驟二：將步驟一的溶液倒入 1000 mL 的容量瓶，並加入蒸餾水至刻線，蓋上蓋子搖晃溶液至均勻混合

    試問有關配製流程的敘述，有哪些正確？（NaOH 式量＝40；應選 2 項）'
  options:
  - label: A
    content: 步驟一可以簡化流程，不使用燒杯，直接將氫氧化鈉顆粒倒入容量瓶再加蒸餾水至刻度線
  - label: B
    content: 上述配製完後的氫氧化鈉溶液，其體積莫耳濃度為 0.1 M
  - label: C
    content: 若步驟二所加入的蒸餾水未補至刻線，其濃度值大於 0.01 M
  - label: D
    content: 配製完後的氫氧化鈉溶液，若密度為 1g/mL，則其百萬分點濃度為 400 ppm
  - label: E
    content: 若進一步要稀釋氫氧化鈉溶液，會使用右方器材，右方器材稱為安全吸球，其操作順序為 A → E → S
