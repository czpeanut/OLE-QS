    content: '220'
  group_stem: <u>第1.～3.題為題組</u> 地震學家發震波的波速在地下某些深度有急遽改變的現象，推測這是因為上下兩層岩石的組成物質不同所致，此界面後來稱為莫氏不連續面，其上為地，其下為地函，其深度在每的地點都不同。 從莫氏不連續面往下，地震波波速原本維持定值，但卻在某個深處範圍出現了震波波速下降的情形。後來將這個深度範圍命名為軟流圈。在軟流圈之上的範圍稱為岩石圈。軟流圈以下的地函部分，地震波的波速隨著深度增加而變快。 附圖是從地表到500公里深度的S波波速變化圖，根據上文及附圖回答問題：
