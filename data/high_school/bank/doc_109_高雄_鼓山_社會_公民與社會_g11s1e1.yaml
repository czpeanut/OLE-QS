  - label: C
    content: 當科技公司消除不需要的東西後，可能導致服務變差，經濟縮小是必然的
  - label: D
    content: 現代人希望的是價格能夠降低，不在乎服務品質，因此公司可以降低成本
  group_stem: ◎在「你的幸福不是這個指數」中寫到下面兩段故事： 故事一：當作者進入到Spotify辦公室時，需要自己先印安全識別，再自行進入辦公室，在找到受訪者佩吉前，看到辦公室有自助飲料冰箱、遊戲室，而佩吉的辦公室在走廊不起眼的角落。訪問中，佩吉提到：GDP的計算看不到便利性，少去了一些不必要的東西與成本，反而讓大家都獲利。因此，儘管GDP萎縮但福祉卻增加。 故事二：作者提到Airbnb的設計，若你想要出國旅遊，你可以在Airbnb上訂購民宿，而出國的這段時間，你也可以將房子透過Airbnb平臺出租出去，讓資產都被充分利用，此時我們的家都成為了旅館，旅館就不需要蓋這麼多，但這些對經濟並不是件好事，因為不需要再蓋旅館，且住宿費用降低了。
