    content: 契約自由為人民的基本權利保障，民主社會不應任意剝奪
  group_stem: ◎青峰與恩師著作權之爭 青峰：已無必要和解 歌手青峰的前經紀人林暐哲，不滿青峰將詞曲版權移轉、公開演唱有版權的音樂著作，控告青峰違反《著作權法》，檢方起訴青峰及相關法人。臺北地院開庭時，青峰出庭否認犯罪，法官問青峰是否有和解可能，青峰認為已無必要，他說相信法官會有正確的判斷，「我到現在還不明白為何我需要站在這裡。」 起訴書指出，青峰2008年與林暐哲音樂社簽訂版權授權合約，約定2008年至2014年簽約期間，青峰所創作的詞曲等音樂著作，專屬授權林瑋哲音樂社，如果未於合約屆滿前3個月前以書面方式提出反對，合約自動延長1年。青峰2018年10月以存證信函通知林暐哲不續約，林暐哲2019年4月以存證信函告知青峰因未在合約屆滿前3個月前反對，合約仍有效；不過青峰卻於2019年4月公開演唱授權的音樂著作，違反《著作權法》。 青峰的委任律師認為，檢察官所用來起訴青峰的《著作權法》有違反《憲法》比例原則之虞，其有向臺北地院聲請停止審判與釋憲之必要，委任律師稱日後將再遞狀聲請停止審判、以表相關意見。 （節錄自青峰與恩師為著作權法院見「不明白為何站在法院？」，聯合報系）
