  group_stem: ◎新聞一：新聞報導指出近來頻傳醫療機構遭駭客入侵事件。2018年8月臺北市衛生局發現兩百多萬位市民資料遭竊，駭客IP來自上海，日前又有五十多所醫療機構遭大規模攻擊，病歷資料遭駭客加密無法閱讀，並威脅若不支付具有購買網路遊戲點數的虛擬貨幣就要把資料銷毀。 新聞二：為因應大量的醫療申報資料，並邁向精準審查的目標，中央健康保險署運用人工智慧（AI）科技：最近自行成功開發自然語言處理（Natural Language Processing，NLP）模型，透過電腦針對放射診斷（如電腦斷層）的檢查報告進行自動化判讀，協助審查作業的精準化及效率化，並透過資訊回饋與醫界共同合作，減少不必要的檢查，以更好的醫療品質照顧全民健康。
