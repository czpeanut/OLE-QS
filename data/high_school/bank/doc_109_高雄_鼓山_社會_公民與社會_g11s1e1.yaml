- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: GDP是一個各國最常使用的經濟指標。請問：下列何者的變化對GDP的計算將造成影響？
  options:
  - label: A
    content: 產品品質愈來愈進步
  - label: B
    content: 產品數量愈來愈增加
  - label: C
    content: 人民休閒時間愈來愈多
  - label: D
    content: 資源回收量愈來愈高
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某政治人物日前接受媒體訪問時，以「鳳凰都飛走了，進來一大堆雞」比喻我國勞動力外流、而靠引進外國移工的現象，反映出我國在全球化下面臨什麼問題？
  options:
  - label: A
    content: 國際競爭力低
  - label: B
    content: 環境意識不足
  - label: C
    content: 人才外流嚴重
  - label: D
    content: 本土文化流失
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 國民所得是一個總量的概念，若用「支出面法」計算國民所得，請問：下列敘述何者正確？
  options:
  - label: A
    content: 陸客曉明來臺旅遊的消費不計入我國的GDP
  - label: B
    content: 公民老師購入號稱「德國小鋼砲」千萬名車對我國GDP並無幫助
  - label: C
    content: 馬利歐家的自有住宅，因不提供租賃服務，故無創造GDP之價值
  - label: D
    content: 敏鎬公司今年售出去年度庫存的液晶螢幕產品總價800萬元，應計入今年度的GDP
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 資訊倫理通常會有四大議題：隱私權（privacy）、正確性（accuracy）、所有權（property）、使用權（accessibility）。下列敘述何者與正確性相符？
  options:
  - label: A
    content: 不扭曲或隱瞞社會大眾所關切的資訊
  - label: B
    content: 學生做課堂報告，在製作投影片時，基於合理使用，下載網路照片
  - label: C
    content: 經濟至上，利用學校資訊科技來圖自己利益
  - label: D
    content: 待人如己，樂於幫助他人，有群體意識
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國技術人才的外流，是經濟發展一大隱憂。有報導指出：「隨著寬頻網路普及，以及新網路平臺陸續出現，網路教學近年又掀起一股新熱潮，吸引美國加州矽谷創投業，將資金投入有如雨後春筍般冒出的教育科技新創公司。」下列敘述中，何者呼應報導敘述，又可解決人才流失問題？
  options:
  - label: A
    content: 政府限制人民出國工作，僅開放短暫旅遊
  - label: B
    content: 利用網路科技，健全我國教育、在職訓練、研究發展等資源
  - label: C
    content: 以法令強制驅逐全球化之下帶來的移工，用本國勞工即可
  - label: D
    content: 網際網路讓社會互動成本提高，技術人才外流可藉由網路進行跨國工作
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 近來日韓貿易戰白熱化，日本與韓國把對方從白色名單中去除，未來日本或韓國要出口到他國，就無法與白色名單上的其他國一樣享有寬鬆待遇。請問：為因應貿易戰，日韓雙方可能採取的措施為何？
  options:
  - label: A
    content: 將戰場擴及亞洲市場，以降低對兩國的傷害
  - label: B
    content: 透過WTO進行磋商，以達成兩國間的共識
  - label: C
    content: 兩國都將對方除名，無法尋求爭端解決機制
  - label: D
    content: 民間所有廠商可能會開始囤積零件以及產品
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列為黑貓國去年各項產品或勞務的生產或交易情形，請問：何項價值可計入黑貓國當年的GNI中？
  options:
  - label: A
    content: 黑貓包子店大量購入麵粉的成本花費
  - label: B
    content: 黑貓國外交官駐白狗國大使館的薪水
  - label: C
    content: 美國女神卡卡來黑貓國辦演唱會酬勞
  - label: D
    content: 流動攤販販賣蔥油餅和豆漿等的收入
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 根據某產業公會研究的投資中國2011大陸投資環境與風險調查發現：由重慶、成都和西安所組成的「西三角」這一兩年開始崛起，區域綜合經濟發展成長數速度十分驚人，直追沿海地區，有機會成為下一個中國經濟發展的中心。中國是世界注目的發展中國家，請問：就全球化的角度，中國可能出現的分工之利為何？
  options:
  - label: A
    content: 資本投入尖端科技的研發
  - label: B
    content: 可以提升生產技術
  - label: C
    content: 環境資源受重視 (B)減少貧富差距
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 調查發現，通勤時間與壓力和煩惱成正比。財富管理軟體Addepar和臉書Facebook等多家公司開始提供員工租金補助、頭款津貼和找房子服務，鼓勵員工住得離辦公室近一點。因著受惠得以省時參與團的Addepar員工表示：「休閒活動讓我消除壓力，並增加我的創造力。」上述顯示以國民所得衡量經濟福祉有何缺點？
  options:
  - label: A
    content: 忽略生活品質價值
  - label: B
    content: 忽略地下經濟活動
  - label: C
    content: 忽略負產品的問題
  - label: D
    content: 無法呈現未經市場交易的活動
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 臺北大巨蛋興建案，因施工需要必須遷移附近樹齡高達4、50年的路樹，護樹團體與大巨蛋承包商某建設公司工程人員發生激烈衝突，該建設公司老闆表示「無法理解護樹團體的主張，到底經濟重要還是樹重要，你們覺得樹很美，我覺得很醜啊……」，某政論節目名嘴引用綠色GDP（GGDP）來評論，下列說法何者正確？
  options:
  - label: A
    content: 該老闆的主張偏向追求GDP的成長，忽略永續發展的觀念
  - label: B
    content: GGDP可賦予自然生態具體的市場價格，可精準衡量
  - label: C
    content: Green GDP＝GDP＋自然資源消耗及環境品質變化
  - label: D
    content: 環境公害問題使得GDP被低估
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 1992年在里約熱內盧所召開的地球高峰會議提出「二十一世紀議程」架構，在不破壞環境的前提下，該決議強調改善並維持生活品質，尤其是全球貧民的生活品質。此觀念是推動下列何者的重要動力？
  options:
  - label: A
    content: 綠色消費
  - label: B
    content: 資源回收
  - label: C
    content: 永續發展
  - label: D
    content: 計畫經濟
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 嘉義某蛋捲業者，由於堅持手工製造，加上香酥口感，逐漸獲得市場肯定。因為限量供應，且市場銷路廣，許多人利用網路購物的方式，寧願多等兩星期，也要買到蛋捲，蛋捲黃牛每天向固定排隊買蛋捲的老人家，以135元收購，再以170元轉賣給顧客；還有人直接設攤，銷售剛買來的蛋捲。一個熱門的蛋捲業者居然衍生出許多種交易形式，堪稱另類的蛋捲奇蹟。由新聞中所提及的蛋捲交易行為，下列敘述哪一項是正確的？
  options:
  - label: A
    content: 消費者以網路購買蛋捲，屬於通訊交易
  - label: B
    content: 蛋捲黃牛向老人家收購蛋捲的行為即是訪問交易
  - label: C
    content: 老人家購買的蛋捲，適用7日猶豫期規定
  - label: D
    content: 攤販的轉賣行為影響該業者的獲利，為違法行為
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 香港反送中行動，與過去的社會運動發起方式有許多的不同。行動沒有特定的領袖，去中心化的社會抗爭完全經由網路的媒合，讓這些自發性的行動持續不斷的在香港展開，包含資源的補給，以及集結地點皆透過網路傳遞資訊。請問：該抗爭顯示了資通訊科技帶來的何種影響？
  options:
  - label: A
    content: 資通訊科技讓人民能在家就參與社會運動，不須走上街頭
  - label: B
    content: 資通訊科技增加了人民參與公共事務的機會
  - label: C
    content: 參與公共事務僅限於都市，鄉村人民無法參與，造成了城鄉不平等
  - label: D
    content: 香港反送中行動是第一個透過網路串連成功的社會運動
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 目前就讀於龍騰中學二年級的小蘋對臺灣參與國際組織相當關心，在新聞報導上看到：外交部指出，政府加入聯合國一再受挫，評估之後決定將目標轉向爭取及參與聯合國專門機構，今年以《聯合國氣候變化綱要公約》（UNFCCC）及「國際民航組織（ICAO）為優先推動目標。請問：我國加入國際組織受挫的原因為何？
  options:
  - label: A
    content: 領土面積太小，不符合申請資格
  - label: B
    content: 經公民投票後，未獲得全民同意的基礎
  - label: C
    content: 中共極力在國際舞臺上杯葛與打壓我國
  - label: D
    content: 西方國家強權，打壓我國國際發展
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 資訊倫理通常會有四大議題：隱私權（privacy）、正確性（accuracy）、所有權（property）、使用權（accessibility）。人們在使用網路時，不可恣意妄為，必須遵守著資訊倫理。請問：下列何種作為違反了資訊倫理？
  options:
  - label: A
    content: 電腦裝設良好的防毒措施
  - label: B
    content: 不非法盜拷資料
  - label: C
    content: 重要資料加密及備份
  - label: D
    content: 破解他人設定的電腦密碼
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列有關《消費者保護法》中「定型化契約」之敘述，何者正確？
  options:
  - label: A
    content: 定型化契約條款如有疑義時，應為有利企業經營者之解釋
  - label: B
    content: 訂立定型化契約前，無須提供消費者審閱的時間
  - label: C
    content: 定型化契約是企業經營者單方面預先擬訂的契約條款，往往對消費者有利 (B)定型化契約條款違反誠信原則，對消費者顯失公平者，無效
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 為維護公平消費機制，並保障消費者的權益，依《消費者保護法》規定：「消費者對所收受之商品不願買受時，得於收受商品後7日內，退回商品或以書面通知企業經營者解除買賣契約，毋須說明理由及負擔任何費用或價款。但通訊交易有合理例外情事者，不在此限。」下列何者交易行為，可受到前項規範的保障？
  options:
  - label: A
    content: 阿榮在實體店面以分期付款方式購買皮製沙發
  - label: B
    content: 小茜向有線電視購物頻道訂購吸塵器
  - label: C
    content: 小偉在百貨公司專櫃購買到有瑕疵的西裝褲
  - label: D
    content: 阿孝在蝦皮上購買客製手機殼
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 樂樂和朋友正在討論有關限制契約自由的合理性，他主張資訊不對稱會對契約的當事人造成不利影響，因此限制契約自由是合理的措施。請問：下列何者最可能是他舉出的案例？
  options:
  - label: A
    content: 僱主訂單超量，要求員工超時加班，否則就要予以開除
  - label: B
    content: 網購買家取貨時，才發現實體產品與網站圖片有所出入
  - label: C
    content: 雇主認為勞動力廉價，刻意壓低薪資造成貧富差距擴大
  - label: D
    content: 在沒有規範的情況下，債權人強迫債務人簽署賣身契約
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 臺灣自古就以茂盛的林木著稱，而1,500～2,500公尺海拔帶，更充滿著許多高等級的紅檜巨木。然而根據林務局的官方資料記載，從日治時期一直到1989年間，大量的珍貴樹木遭到大量砍伐，在1949年後，樹木更是遭到嚴重砍伐。請問：依上述內容，如此的伐木行為是忽略何項觀念？
  options:
  - label: A
    content: 永續發展
  - label: B
    content: 綠色經濟
  - label: C
    content: 企業的社會責任
  - label: D
    content: 分散風險
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 為保障創作人的權利，我國對於著作權有許多保障。但基於增進公共利益的考量，《著作權法》亦授予一般大眾在特定情況下，可以合理使用他人著作的權利。下列敘述中，哪些情況即是「合理使用」他人著作？
  options:
  - label: A
    content: 公立高中教師為上課需要，播放他人已公開影片中的部分內容
  - label: B
    content: 合法設立的補習班為上課需要，將書商提供的參考書複印三分之一本
  - label: C
    content: 大學教授為編製上課講義，要求影印店老闆影印全本原文書
  - label: D
    content: 網路業者為服務讀者，擅自將他人已公開的著作放於網路上供人免費瀏覽
- id: doc_109_高雄_鼓山_社會_公民與社會_g11s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 有位醫師曾指出：「透過機器人及導航技術，讓外科醫師得以改善精準度、標準化手術流程並減少學習曲線。」依據上文，對於生物科技的影響，下列敘述何者正確？
  options:
  - label: A
    content: 透過機器人及導航系統未來醫院的外科醫師需求將會減少
  - label: B
