  stem: 由拉馬納森的發言可知，面對氣候變遷應優先從何處著手？
  options:
  - label: A
    content: 培養全球公民意識
  - label: B
    content: 學習適應氣候變化
  - label: C
    content: 停止開發環境資源
  - label: D
    content: 國家採取實質作為
  group_stem: ◎在馬德里召開的全球氣候會議（COP25）舉世矚目，唐獎永續發展獎得主維拉布哈德蘭．拉馬納森（Veerabhadran Ramanathan）也密切關注最新發展，並指出各國缺乏積極作為的主因在於，即便有充足的科學證據佐證，大眾仍未體認到環境與氣候變遷所帶來的風險，因此應從基礎教育著手，培養下一代「氣候的捍衛者」。 諾貝爾和平獎共同得主、聯合國政府間氣候變化事業委員會（IPCC）前副主席莫漢．芒納星河（Mohan Munasinghe）亦在專題演講中指出，2012年時我們耗用了1.5個地球的資源，到2030年時我們將耗用兩個地球；其中全球最有錢的20％族群消費了地球85％的資源，窮人不是問題的創造者，卻在這段過度消耗地球資源的趨勢中受害最深。
