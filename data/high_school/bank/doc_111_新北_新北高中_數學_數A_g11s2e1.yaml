- id: doc_111_新北_新北高中_數學_數A_g11s2e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 關於空間中點、線、面的關係，請選出正確的選項。
  options:
  - label: A
    content: 過平面E外一點P，恰有一平面垂直平面E
  - label: B
    content: 過平面E外一點P，有無限多條直線與平面E平行
  - label: C
    content: 相異兩直線$L_{1}$與直線$L_{2}$若不相交，則$L_{1}$與$L_{2}$可能平行或歪斜
  - label: D
    content: 若相異兩直線$L_{1}$、$L_{2}$都與平面E平行，則必有$L_{1 }$// $L_{2}$
  - label: E
    content: 直線$L_{1}$在平面$E_{1}$上，直線$L_{2}$在平面$E_{2}$上，若$E_{1}$ // $E_{2}$，則$L_{1}$ // $L_{2}$
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：過平面E外一點P，恰有一直線垂直平面E，但空間中有無限多個平面包含此直線，且這無限多個平面皆垂直平 面E。 (B) ○：過平面E外一點P，恰有一平面與平面E平行，而此平面上過P點的每一條直線 ( 有無限多條 ) 皆與平面E 平行。 (C) ○：空間中相異兩直線$L_{1}$與直線$L_{2}$的關係有三種： (1) 相交於一點 (2) 平行 (3) 歪斜。 (D) ×：可能相交或歪斜。 (E) ×：可能歪斜。 故選(B)(C)。
- id: doc_111_新北_新北高中_數學_數A_g11s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 設空間中三向量$\vec{a}$,$\vec{b}$,$\vec{c}$可張成一個平行六面體，試問下列哪些敘述恆正確？
  options:
  - label: A
    content: $|\vec{a}\times \vec{b}|$表示以$\vec{a}$,$\vec{b}$所張成的平行四邊形面積
  - label: B
    content: $\vec{a}\times \vec{b}=\vec{b}\times \vec{a}$
  - label: C
    content: $|(\vec{a}\times \vec{b}) \cdot \vec{c} | = |(\vec{b}\times \vec{c}) \cdot \vec{a} |$
  - label: D
    content: $(\vec{a} \cdot \vec{b}) \cdot \vec{c}=\vec{a} \cdot (\vec{b} \cdot \vec{c})$
  - label: E
    content: $| (\vec{b}\times \vec{c}) \cdot \vec{a} |$表示以$\vec{a}$,$\vec{b}$,$\vec{c}$所張成平行六面體的體積
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：$\vec{a}$×$\vec{b}$的大小即是以$\vec{a}$,$\vec{b}$所張成的平行四邊形面積。 (B) ×：舉反例，令$\vec{a}$＝( 1 , 1 , 0 ) ,$\vec{b}$＝( 0 , 1 , 1 )，則$\vec{a}$×$\vec{b}$＝( 1 ,－1 , 1 )， $\vec{b}$×$\vec{a}$＝(－1 , 1 ,－1 )，故$\vec{a}$×$\vec{b}$≠$\vec{b}$×$\vec{a}$。 (C) (E) ○：| ($\vec{a}$×$\vec{b}$)．$\vec{c}$ | , | ($\vec{b}$×$\vec{c}$)．$\vec{a}$ | 都是表示以$\vec{a}$,$\vec{b}$,$\vec{c}$所張成的平行六面體的體積。 (D) ×：向量的內積不具有結合律。 故選(A)(C)(E)。
