  stem: 歷史上的殖民政權，都會鼓勵移民以助政府開墾、經商，並擴大勢力。在臺灣歷史上，(甲)時期以耕牛、農具和貸款為誘因，大量招募人民開荒，種植水稻及製作砂糖；(乙)時期也給予耕地、房屋、旅費的優惠，還協助醫療、教育等機構建立，並設有特殊行政機構管理，建立移民村。請問文中的甲、乙是？
