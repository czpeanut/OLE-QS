  stem: 請閱讀下列文獻： 資料一：朱景英曾在乾隆年間任臺灣府海防兼南路理番同知，後將見聞寫成《海東札記》，其中有平埔族群取姓名方式轉變的記載：「番以父名為姓，以祖名為名。如祖名甲，父名乙，即呼曰乙礁巴甲。……前學政就番字加水旁，姓以潘者，今則張、王、劉、李，自為姓者多矣。」 資料二：唐贊袞在其《臺陽見聞錄》著作中記載了官方賜姓平埔族群的由來：「初，熟番有名無姓，既准與試，以無姓不可列榜；其巡臺掌學政，就番字加水三點為潘字，命姓潘，故諸番多潘姓。」 (1) 請問哪一段文字，敘述了平埔族群原本取姓名的原則？ (2) 請根據上述文字，說明為何平埔族群接受以潘為姓氏？
  answer:
  - (1)以父名為姓，以祖名為名；(2)官方賜姓，無姓不可列榜（無姓氏無法考取功名）
  answer_status: verified
  answer_source: answer_key
