  - label: A
    content: 甲：荷蘭時期、乙：日治時期
  - label: B
    content: 甲：清領前期、乙：清領後期
  - label: C
    content: 甲：荷蘭時期、乙：鄭氏時期
  - label: D
    content: 甲：荷蘭時期、乙：中華民國時期
  answer:
