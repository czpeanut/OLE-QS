  stem: 清代學者姚瑩《東槎紀略，埔里社紀略》云：「昔蘭人之法，合數十佃為一結，通力合作，以曉事而貲多者為之首，名曰小結首。合數十小結中舉一富強有力、公正服眾者為之首，名曰大結首。」針對姚瑩的記述，兩位學者分別提出說法： 學者甲：「荷蘭人對於當時移入之十萬漢人，成立所謂『結首制度』。〈埔里社紀略〉記述其制度。」 學者乙：「依據姚瑩所述之『蘭人之法的小結首大結首制』，來論述結首制為荷蘭人在臺之土地拓墾制度是不對的，而是噶瑪蘭人的拓墾結首制度。……噶瑪蘭及臺灣的舊志，多簡稱噶瑪蘭人或地區為蘭人、蘭地，而稱荷蘭人為荷蘭人或紅毛人，或紅夷。」 閱讀上述資料，回答下列問題： (1) 學者甲和學者乙對「結首制」的起源，解釋有何不同？。 (2) 學者乙不支持學者甲的說法，主要的理由為何？
  answer:
  - (1)甲認為是荷蘭人管理漢人的制度；乙認為是噶瑪蘭人的拓墾制度；(2)臺灣舊志稱噶瑪蘭人為蘭人；稱荷蘭人為紅毛人、紅夷
  answer_status: verified
  answer_source: answer_key
