- id: doc_108_台中_文華_社會_歷史_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 義大利史學家克羅齊曾說：「一切歷史都是當代史。」學者朱光潛闡述這句話：「沒有一個過去史真正是歷史，如果它不引起現實的思索，打動現實的興趣，和現實的心靈生活打成一片。過去史在我的現時思想活動中才能復甦，才獲得它的歷史性。所以一切歷史都必是現時史……著重歷史的現時性，其實就是著重歷史與生活的聯貫。」 關於上文，應該如何理解？
  options:
  - label: A
    content: 過去的歷史經過許多歷史家解讀後，會呈現大家認可的正確答案
  - label: B
    content: 不同時間的不同史學家，受時代影響，會對歷史有不同的解讀
  - label: C
    content: 歷史可以像數理知識一樣，獲得真正的答案
  - label: D
    content: 歷史只是記錄過去發生的事情，無法以現在的時空環境來解讀
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_108_台中_文華_社會_歷史_g10s1e1_s1_2
  section: 1
