  page: 1
  stem: 以下是兩則與原住民有關的地名資料： 資料一：「鄒族人在過去稱「阿里山」為「剝松皮之地」。因為很早以前，阿里山是黑松巨木遍布的地方，而鄒族人外出打獵時往往深夜返回，就會在此剝松皮採集松油來點燃火把作為照明用。」 資料二：「高雄的那瑪夏區曾被稱為三民鄉，名稱源自於當地被改名的三個村落：民族、民權、民生；而後原住民自我意識抬頭後，改回那瑪夏，那瑪夏是一位少年的名稱，他為了拯救全族的性命，因而不幸犧牲，也是族人一直以來對當地楠梓仙溪的稱呼。」 上述兩段資料，共同呈現出何種意義？
  options:
  - label: A
    content: 原住民地名的命名，與其生活方式的改變有關
  - label: B
    content: 原住民對土地的命名，隱含著與漢人的衝突與合作
  - label: C
    content: 原住民對土地命名的意涵與其生活、故事有關
  - label: D
    content: 兩則文獻都可看出統治對原住民的同化主義
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
