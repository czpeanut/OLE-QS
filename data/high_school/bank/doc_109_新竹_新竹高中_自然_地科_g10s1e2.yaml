- id: doc_109_新竹_新竹高中_自然_地科_g10s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 3
  stem: '<u>北安納托利亞</u>斷層位於何種板塊邊界？

    《往內還有更深的一層》2021年初最新的研究指出，地球的内核可再分為兩層。

    地球内部的層狀主要構造可以細分為富含矽的地殼、岩石圈、軟流圈、橄欖岩質的上部地函、過渡帶、下部地函、液體鐵鎳外核和固體鐵線内核。地殼下的物質難以取得，科學家主要根據火山噴發的物質和地震波來推斷，並依此計算出溫度超過5,000℃的內核僅占地球總體積百分之一。 2021年三月，<u>澳洲</u>科學家團隊用另一種搜索算法分析數十年來收集的地震波傳播時間數據，重新計算數千種內核模型，證明地球內核再分為2個物質成分不同的層。位在地球中心的內地核裡，還有一個「最內層核心」（Innermost core）。新模型指出有合物質使地震波更平行於地球的旋轉軸，而固態鐵鎳内核結構有變化，表示有一條新的邊界線，可能是地球歷史上2個獨立降溫事件造成。發現鐵結構的細微變化是極為困難的一個過程，代表距今45億年前、地球演化最一開始的時間，發生了至今未知的事件。這些新發現可以解釋為什麼一些實驗證據與當前的地球結構模型對不上，研究團隊目前正在開發另一種新算法，希望可以讓新研究數據的結論更加有力。 20世紀兩位地球物理學家以地震波發現地球内部存在不連續面，利用兩種不同地震波在地球內部傳遞，如a模型與b模型，且中央II區的b模型地震波無法穿透。'
  options:
