  stem: 錯動性板塊邊界無張力也擠壓力，無造山運動也少有火山活動。在錯動性板塊邊界上會看到轉形斷層連接兩個不同的板塊邊界。轉形斷層連接不同板塊邊界類型有三種：(1)連接中洋脊與中洋脊（<u>聖安德里斯</u>斷層-<u>太平洋</u>板塊v.s.<u>北美洲</u>板塊）、(2)連接中洋脊與海溝（<u>死海</u>斷層-<u>阿拉伯</u>板塊v.s.<u>歐亞</u>板塊）、(3)連接海溝與海溝（<u>阿爾卑斯</u>斷層-<u>太平洋</u>板塊v.s.<u>印澳</u>板塊）。請畫出此三個轉形斷層的錯動方式。
