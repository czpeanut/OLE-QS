  group_stem: 2021年3月21日綜合報導。<u>冰島</u>擁有冰川、極光等天然美景以及獨特的火山地形，是熱門的觀光景點。但今年的3月19日靠近<u>冰島</u>首都<u>雷克雅維克</u>的Fagradalsfjall火山在沉寂數百年後再度噴發，歷經兩天後才逐漸平息。這幾個禮拜以來，<u>冰島</u>大大小小的地震從沒停過，有記錄的地震就發生5萬多次，並且有多處火山傳出噴發的消息。 已經歷800年沒有噴發過的Fagradalsfjall火山，表面上出現數條裂縫，小規模的熔岩噴泉把天空映照成了橘紅色。但噴發規模很小，居民應該不需要擔心安全。2010年，艾雅法拉冰蓋（Eyjafjalajok）下的火山噴發，大量的火山灰被噴入大氣層中，造成<u>歐洲</u>航班因視線與懸浮粒子而必須暫停。這次的Fagradalsfjall火山噴發沒有這麼多火山灰，沒有對外界造成明顯影響，但火山噴發的區域是一對外界開放的觀光景點，而噴發洩漏的二氧化硫體帶有毒性，當局仍建議附近居民儘量待在室內並保持門窗緊閉。
