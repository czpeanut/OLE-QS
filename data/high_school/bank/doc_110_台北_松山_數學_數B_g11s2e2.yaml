  stem: '每次打開Netflix想追劇時，常收到來自系統的推薦，提醒你有一部新上檔的影集，96%適合你，這其中的適合度到底是如何產生的呢？這也是Netflix成功的祕訣：「推薦引擎，更勝搜尋引擎。」
    推薦引擎的運作原理說明：分析A、B兩部影集，根據看過這兩部影集的用戶數據來統計對影集的喜好程度，並將數據整理如下表：

    |  | 喜歡影集A | 不喜歡影集A |

    | --- | --- | --- |

    | 喜歡影集B | 63% | 9% |

    | 不喜歡影集B | 7% | 21% |

    若你是一個喜歡影集A的用戶，根據上表你也會喜歡影集B的機率為$\frac{63\%}{63\%+7\%}$＝90% 透過這樣的大數據分析，系統可以透過您過往的觀看回饋來推薦適合你的影集，達到推薦引擎帶來所希望的精準行銷效果。
