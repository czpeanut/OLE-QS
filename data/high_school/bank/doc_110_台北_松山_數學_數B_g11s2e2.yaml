- id: doc_110_台北_松山_數學_數B_g11s2e2_s1_3
  section: 1
  number: 3
  type: calc
  page: 1
  stem: 保險公司把投保竊盗險的住宅分為A、B兩級，其所占比率分別為60%、40%·。過去一年A、B兩級住宅遭竊的比率分別為15%、5%。據此，公司推估未來一年A、B兩級住宅被竊的機率分別為0.15、0.05。今A級住宅中的20%經過改善，重新推估這些改善過的住宅未來一年被竊的機率會降為0.03；而其他住宅被竊機率不變。根據以上資料，試選出正確的選項。
    (1)全體投保的住宅中，過去一年遭竊的比率為12% (2)過去一年遭竊的投保住宅中，A級所占的比率超過90% (3)推估未來一年，改善過的A級住宅的被竊機率為原來的$\frac{1}{5}$
    (4)經改善後，推估未來一年被竊機率，全體投保的A級住宅會小於全體投保的B級住宅 (5)經改善後，推估未來一年全體投保的住宅被竊機率小於0.11
  answer:
  - (3)(5)
  answer_status: verified
  answer_source: answer_key
- id: doc_110_台北_松山_數學_數B_g11s2e2_s1_4
  section: 1
  number: 4
  type: calc
  page: 1
  stem: 籤筒的5支籤中1支有獎，甲、乙與丙三人依序各抽一支籤，且抽完後不放回，每支籤被抽到的機率均等，則下列哪些敘述正確？ (1)甲、乙都沒中獎的機率為0.6
    (2)甲、乙與丙都沒中獎的機率為0.4 (3)已知甲、乙有人中獎的條件下，甲中獎的機率比乙中獎的機率大 (4)已知甲沒中獎的條件下，乙中獎的機率為0.25
    (5)甲、乙與丙三人中，甲中獎的機率最大
  answer:
  - (1)(2)(4)
  answer_status: verified
  answer_source: answer_key
  explanation: (1)○：$\frac{4}{5}$×$\frac{3}{4}$=0.6。 (2)○：$\frac{4}{5}$×$\frac{3}{4}$×$\frac{2}{3}$=0.4。
    (3)×：P(甲中｜甲、乙有人中) ＝$\frac{\frac{1}{5}\times \frac{4}{4}}{1-\frac{4}{5}\times \frac{3}{4}}$＝$\frac{1}{2}$。
    P(乙中｜甲、乙有人中) ＝$\frac{\frac{4}{5}\times \frac{1}{4}}{1-\frac{4}{5}\times \frac{3}{4}}$＝$\frac{1}{2}$。
    ∴相等 (4)○：P(乙中｜甲沒中) ＝$\frac{\frac{4}{5}\times \frac{1}{4}}{\frac{4}{5}}$＝$\frac{1}{4}$＝0.25。
    (5)×：每人中獎的機率都是$\frac{1}{5}$。 故選(1)(2)(4)。
