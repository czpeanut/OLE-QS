  stem: 某超級搖滾天團來臺開演唱會，在此天團的臉書粉絲社團成員中，有$\frac{3}{4}$的人會參加北部場演會，有$\frac{2}{3}$的人會參加南部場演唱會，有$\frac{1}{2}$的人兩場都會參加。今由此天團的臉書粉絲社團成員中任選一人，試回答下列問題：
    (1)已知此人會參加北部場演唱會，求他也會參加南部場演唱會的機率。 (2)已知此人不會參加南部場演唱會，求他也不會參加北部場演唱會的機率。
  answer:
  - (1)$\frac{2}{3}$ (2)$\frac{1}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: (1)P(南｜北)＝$\frac{\frac{1}{2}}{\frac{3}{4}}$＝$\frac{2}{3}$。 (2)P(不北｜不南)＝$\frac{P(不南且不北)}{P(不南)}$
    ＝$\frac{1-P(南或北)}{1-P(南)}$＝$\frac{1-P(\frac{2}{3}+\frac{3}{4}-\frac{1}{2})}{1-\frac{2}{3}}$＝$\frac{1}{4}$。
