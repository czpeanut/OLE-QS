- id: doc_110_台北_松山_數學_數B_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設A，B為樣本空間中的兩事件，請選出正確的選項。
  options:
  - label: '1'
    content: 若A'與B'為獨立事件，則A與B為獨立事件
  - label: '2'
    content: 若A≠φ且P(B|A)＝P(B)，則A與B為獨立事件
  - label: '3'
    content: P(A∪B)＝P(A)+P(B)－P(A)P(B)
  - label: '4'
    content: 若A＝φ，則A與B為獨立事件
  - label: '5'
    content: 若A與B為互斥事件，則A與B為獨立事件
  explanation: (1)○。 (2)○。 (3)×：P(A∪B)＝P(A)＋P(B)－P(A∩B)。 (4)○：A＝φ ⇒ P(A∩B)＝0＝P(A)P(B)。
    (5)×：A、B互拆 ⇒ P(A∩B)＝0， 但P(A)P(B)不一定等於0。 故選(1)(2)(4)。
