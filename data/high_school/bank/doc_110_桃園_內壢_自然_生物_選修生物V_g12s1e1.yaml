  section: 4
  number: 43
  type: single
  page: 4
  stem: 下列何者<u>不涉及</u>提供產糖真菌養分的來源？
  options:
  - label: A
    content: 植物
  - label: B
    content: 鏈黴菌
  - label: C
    content: 克氏菌
  - label: D
    content: 切葉蟻
  group_stem: 在美洲热帶森林中，切葉蟻因為會在蟻巢中「豢養」能產生糖的真菌而闻名。切葉蟻將植物葉片切成小塊带回巢穴中，經咀嚼後讓它成為一種特殊真菌的養分來源，形成一處「真菌農場」，而切葉蟻會將新生的菌絲餵養其幼蟲。切葉蟻的存在，不僅會促進植物新葉生長，也會加速養分循環。而在近幾年的研究中，科學家們發現細菌在這個「切葉蟻一植物一真菌」間也扮演了十分重要的角色。卡麥隆•·庫瑞博士首先發現在切葉蟻的背上，生長著一種鏈黴菌，這種細菌會產生一種抗生素，抑制其他種真菌的生長。若切葉蟻將「真菌農場」棄之不顧，則會生長出各式不同的雜類真菌。在最近的研究中，科學家們又發現在美洲切葉蟻巢中，還有另一種共生細菌一克氏菌，此菌能幫助固定空氣中的氮。克氏菌生長在「真菌農場」內所固定下來的氮，可以為真菌所吸收，進而被切葉蟻所利用。依本文所述及相關知識。
  answer:
  - B
