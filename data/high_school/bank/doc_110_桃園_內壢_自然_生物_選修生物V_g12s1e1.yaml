  group_stem: 有一天，一架飛碟在地球的上空失事，一個大頭的綠色小矮人沒帶降落傘就掉到一座島嶼，啪啪啪·····弄斷了好多樹枝，碰!終於落到地面，原來是茂密的森林外星人得死裡逃生，他拍拍屁股站了起來，走著走著正好遇到森林中的你，他用語言翻譯器向你詢問了一些問題。他自豪地說：「我200萬年前就開始記錄這個島嶼，第一次來的時候整座島嶼都是火山熔岩冷卻而成的岩石，什麼生物也沒有，後來連續幾次到訪，發現環境中主要的生物有很大的變動，在不同時期分別有蘚苔類、多年生草本、喬木、一年生草本、灌木、地衣為主的各種不同植被景觀」，但是他接著卻露出靦腆的表情，手裡拿出一本泛黃的本子，由於年代久遠，装訂的線已經鬆脫，而且僅有月份而沒有記載年代，所以他要麻煩你幫他整理一下這份紀錄。
