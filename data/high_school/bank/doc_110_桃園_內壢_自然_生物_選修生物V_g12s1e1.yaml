  group_stem: 在美洲熱帶森林中，切葉蟻因為會在蟻巢中「豢養」能產生糖的真菌而聞名。切葉蟻將植物葉片切成小塊帶回巢穴中，經咀嚼後讓它成為一種特殊真菌的養分來源，形成一處「真菌農場」，而切葉蟻會將新生的菌絲餵養其幼蟲。切葉蟻的存在，不僅會促進植物新葉生長，也會加速養分循環。而在近幾年的研究中，科學家們發現細菌在這個「切葉蟻－植物－真菌」間也扮演了十分重要的角色。卡麥隆·庫瑞博士首先發現在切葉蟻的背上，生長著一種鏈黴菌，這種細菌會產生一種抗生素，抑制其他種真菌的生長。若切葉蟻將「真菌農場」棄之不顧，則會生長出各式不同的雜類真菌。
