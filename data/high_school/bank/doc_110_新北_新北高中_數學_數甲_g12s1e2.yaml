  stem: 坐標平面上方程式$\frac{x^{2}}{A}$＋$\frac{y^{2}}{B}$＝1，A，B＞0的圖形與$\frac{x^{2}}{16}$－$\frac{y^{2}}{9}$＝1的圖形共有幾個交點？
  options:
  - label: A
    content: 可能沒有交點
  - label: B
    content: 若非沒有交點，則必為 4 個交點
  - label: C
    content: 若 $A>B$，且 $B=9$ 時，則沒有交點
  - label: D
    content: 若 $A>B$，且 $B\ge 16$ 時，有 4 個交點
