  stem: 將橢圓Γ：$\frac{x^{2}}{25}$＋$\frac{y^{2}}{9}$＝1以原點為中心逆時針旋轉60°，所得的新橢圓Γ′ 的方程式為＿＿＿＿。
  answer:
