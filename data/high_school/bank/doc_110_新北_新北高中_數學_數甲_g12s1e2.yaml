  stem: 若拋物線y＝$ax^{2}$＋bx＋c之圖形如下圖，試問下列選項何者正確？
  options:
  - label: A
    content: a＞0
  - label: B
    content: b＞0
  - label: C
    content: c＞0
  - label: D
    content: $b^{2}$－4ac＞0
  - label: E
    content: a－b＋c＞0
  assets:
  - key: s2_4_f1
    kind: figure
    file: doc_110_新北_新北高中_數學_數甲_g12s1e2/s2_4_f1.png
    crop:
      page: 1
      rect:
      - 296.15
      - 710.8
      - 432.35
      - 830.7
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $y=ax^{2}+bx+c$。 (A) $\because$開口向上 $\therefore a>0\therefore$正確 (B) 對稱軸 $x=-\frac{b}{2a}>0\therefore b<0\therefore$錯誤 (C) $x=0$代入得$y=c$，點$(0,c)$在y軸負向 $\therefore$錯誤 (D) $\because$交$x$軸兩點交點 $\therefore D=b^{2}-4ac>0\therefore$正確 (E) $x=-1$代入 $y=a-b+c$，點$(-1,a-b+c)$在x軸上方 $\therefore a-b+c>0\therefore$正確 ∴選項(A)(D)(E) 正確
- id: doc_110_新北_新北高中_數學_數甲_g12s1e2_s2_5
  section: 2
  number: 5
  type: multiple
  page: 1
  stem: 已知等軸雙曲線Γ的一條漸近線為x－y＝0，中心坐標為 ( 1 , 1 )，且焦點 ( 3 , 0 )，試問下列敘述哪些是正確的？
  options:
  - label: A
    content: Γ的兩條漸近線互相垂直
  - label: B
    content: x＋y＝0為Γ的另一條漸近線
  - label: C
    content: 點 (－1 , 2 ) 在Γ上
  - label: D
    content: 點 (－1 , 4 ) 在Γ上
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: $\because \Gamma$是等軸雙曲線，一條漸近線是$x-y=0$，設另一條漸近線為$x+y=t(1,1)$代入，得$t=2\therefore x+y-2=0$ 設雙曲線方程式為$(x-y)(x+y-2)=k$， $(3,0)$代入，$3\times 1=k$，$k=3\Rightarrow (x-y)(x+y-2)=3$。 (A) $\because \Gamma$是等軸 ∴漸近線互相垂直 ∴正確 (B) 設另一條漸近線為$x+y=2$ ∴錯誤 (C) $(-1,2)$代入$(-1-2)(-1+2-2)=-3\times (-1)=3$ ∴在 $\Gamma$上 ∴正確 (D) $(-1,4)$代入$(-1-4)(-1+4-2)=-5\times 1=-5\neq 3$ ∴不在 $\Gamma$上 ∴錯誤 ∴選項(A)(C) 正確。
