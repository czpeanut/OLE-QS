  stem: $3^{50}$－1 是＿＿＿＿位數。（已知 $10^{0.3010}$ ≈ 2，$10^{0.4771}$ ≈ 3）
  answer:
  - '24'
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$3^{n}$ 的尾數依序為 3、9、7、1、3、9、7、1、……（n 為正整數）

    依 3，9，7，1 的順序，每 4 個一循環

    ∵$50 = 4\times 12 + 2$

    ∴$3^{50}$ 的尾數為 9，減 1 不影響位數

    ⇒ $3^{50}$－1 ≈ $3^{50}$ ≈（$10^{0.4771}$）$^{50}$

    ＝$10^{23.855}$＝$10^{0.855}$×$10^{23}$

    故所求為 24 位數'
