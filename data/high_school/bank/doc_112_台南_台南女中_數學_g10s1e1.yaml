  stem: 已知 $a^{2x}$＝$\sqrt{5-\sqrt{24}}$，求$\frac{a^{3x}+a^{-3x}}{a^{x}+a^{-x}}$的值為＿＿＿＿。
  answer:
  - $2\sqrt{3} - 1$
  answer_status: verified
  answer_source: answer_key
  explanation: '$a^{2x}$＝$\sqrt{5-\sqrt{24}}$＝$\sqrt{5-2\sqrt{6}}$＝$\sqrt{3}$－$\sqrt{2}$

    $\frac{a^{3x}+a^{-3x}}{a^{x}+a^{-x}}$＝$\frac{(a^{x}+a^{-x})(a^{2x}- 1+a^{-2x})}{a^{x}+a^{-x}}$＝$a^{2x}$－1＋$a^{－2x}$

    ＝$\sqrt{3}$－$\sqrt{2}$－1＋$\frac{1}{\sqrt{3} -\sqrt{2}}$＝$\sqrt{3}$－$\sqrt{2}$－1＋$\sqrt{3}$＋$\sqrt{2}$

    ＝2$\sqrt{3}$－1

    〈另解〉

    $a^{2x}$＝$\sqrt{5-\sqrt{24}}$＝$\sqrt{5-2\sqrt{6}}$＝$\sqrt{3}$－$\sqrt{2}$

    $\frac{a^{3x}+a^{-3x}}{a^{x}+a^{-x}}$＝$\frac{a^{4x}+a^{-2x}}{a^{2x}+ 1}$＝$\frac{(\sqrt{3} -\sqrt{2})^{2}+\frac{1}{\sqrt{3}-\sqrt{2}}}{\sqrt{3} -\sqrt{2} + 1}$

    ＝$\frac{5-2\sqrt{6} +\sqrt{3} +\sqrt{2}}{\sqrt{3} -\sqrt{2} + 1}$

    ＝$\frac{2\sqrt{3} (\sqrt{3} -\sqrt{2} + 1)-(\sqrt{3} -\sqrt{2} + 1)}{\sqrt{3} -\sqrt{2} + 1}$＝$2\sqrt{3}$－1'
