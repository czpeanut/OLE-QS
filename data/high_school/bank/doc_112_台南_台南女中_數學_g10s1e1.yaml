  stem: 一臺搬運貨物的無人車可以透過遠端操作，在一條筆直的工作軌道上移動。已知無人車的訊號發射站設置在工作軌道上的$A\left( \frac{8}{3} \right)$及$B\left( \frac{16}{3} \right)$兩點，由發射站到無人車的距離和若超過 14，則訊號強度會太差而無法控制無人車。令無人車的位置為 C（x），則可控制無人車的實數 x 值最大範圍為何？
