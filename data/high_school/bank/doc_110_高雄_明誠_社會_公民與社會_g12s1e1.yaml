- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 政府推動具有公共利益的政策，有時可能面臨「鄰避放應」。關於鄰避放應的敘述，下列何者正確？
  options:
  - label: A
    content: 居民為了爭取興建新建設而導致衝突的現象
  - label: B
    content: 主因通常是拒絕或抵抗具有生存危機等建設而起
  - label: C
    content: 政府相關單位應依法行政，強制執行
  - label: D
    content: 因鄰避情緒而發起的抗爭，通常會引起大眾的憐憫與惻隱之心
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 1955年，美國蒙哥馬利市(甲)一名黑人女士Rosa Parks搭乘公車，(乙)她故意坐在白人專屬的位置，(丙)並且拒絕讓座給一位白人乘客，最後(丁)她自願接受逮捕。由於該名女士的勇敢行動，因而促使美國黑人發動民權運動，即是美國「公民不服從」運動的典型例子。而該名女士的哪種行動最符合「公民不服從」運動的真義？
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (丙)(丁)
  - label: C
    content: (甲)(丙)
  - label: D
    content: (乙)(丙)(丁)
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 2013年5月，臺灣漁民遭到菲律賓公務船射殺，我國政府要求菲律賓必須以「政府」身分道歉，但是菲律賓以「一個中國」為由，表示菲律賓駐臺辦事處是對臺事務的最高單位，駐臺代表已經出面向漁民致歉。此舉引發我國官方啟動制裁措施之外，部分網友至白宮網站發表一篇連署文，促請美國政府採取必要措施以捍衛公道。上述菲律賓政府以「一個中國」做為回應，突顯兩岸關係存在哪種難題？
  options:
  - label: A
    content: 缺乏治權
  - label: B
    content: 主權爭議
  - label: C
    content: 飛彈威脅
  - label: D
    content: 產業外移
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 某些政治人物曾提到「公民投票可以深化民主、鞏固人權」，不過另一種看法則是「公民投票不是萬靈丹，雖然其具有價值，但是亦充滿迷思的危險性，而且是高度危險，例如真正民主必須具備公民投票才是理想之論述。」關於公民投票的認知，下列何者正確？
  options:
  - label: A
    content: 一定可以化解政黨纷爭與社會歧見
  - label: B
    content: 能夠反覆的溝通、協商，以提高決策品質
  - label: C
    content: 能夠提供多元的選擇方案，讓民眾擁有充分的辯論空間
  - label: D
    content: 由各國的實踐經驗可發現，其容易成為政客或特定團體操弄人民的工具
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 印度的假期是依據印度曆或穆斯林曆，某些節慶在放假前一天由印度教祭司或伊斯蘭教教士觀察天象，再通告政府決定是否放假，因此每年的假期時間不固定。外資企業經理人認為此種放假文化，正是在印度營運的必要成本，除了自行吸收成本之外，同時保持尊重態度，因為文化並沒有好壞之分。請問外資企業經理人的說法符合哪種觀點？
  options:
  - label: A
    content: 文化相對論
  - label: B
    content: 我族中心主義
  - label: C
    content: 文化同化政策
  - label: D
    content: 社會達爾文主義
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 當代民主國家最主要的類型是符合多元政體概念的自由式民主，亦是許多已開發國家的政治形式。下列何者符合自由式民主的概念？(甲)公民以投票決定主政者 (乙)公民具有政治參與的權利 (丙)公民資格與古希臘雅典相同(丁)公民具有監督政府的權力
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (乙)(丙)(丁)
  - label: C
    content: (甲)(乙)(丁)
  - label: D
    content: (甲)(丙)(丁)
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 關島無法成為聯合國的會員國，主因是其缺乏哪一項國家構成要素？
  options:
  - label: A
    content: 效能的政府
  - label: B
    content: 絕對的主權
  - label: C
    content: 眾多的人民
  - label: D
    content: 足夠的土地
  group_stem: 1898年美國與西班牙戰爭之後，關島成為美國的殖民地。第二次世界大戰期間，關島遭到日本占領，直到1944年7月，美軍收復關島。目前聯合國仍將關島列為美國的非自治領土，雖然該島居民屬於美國公民，但是其部分權利受到限制，並無法參與美國選舉，且其國會議員亦無法參與立法表決。 關島總督Hon. Eddie Calvo希望改變現狀，主張舉行自決公民投票，讓該島居民擁有表態的機會，其提出獨立、成為美國的一州和維持現狀三個選項，而該名總督主要是支持成為美國的一州。
