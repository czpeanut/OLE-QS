  group_stem: 加泰隆尼亞是西班牙的自治區之一，首府為巴塞隆納，全境面積約32,108平方公里，人口約752萬人，占西班牙總人口約16.2%，是自治區中經濟較為發達的地區。2017年10月1日舉行獨立公投，決定加泰隆尼亞是否脫離西班牙而獨立。根據報導表示，當時43%的投票率下，有92.7%的選票支持「加泰獨立」，然其結果卻因「違反西班牙憲法」，而不被馬德里政府、或世界任一國家所承認。但是多數加泰隆尼亞人民認為，加語是塑造居民對當地文化的認同，不必有血緣認證也能成為加泰隆尼亞人，進而產生強烈歸屬感與認同感。
