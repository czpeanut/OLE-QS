- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 隨著國際油價高漲，臺灣民眾苦不堪言，批評與攻擊中油公司的「浮動油價」制度。而立法院質詢過程，某政黨立法委員以演戲方式，表達對此制度的不滿。此種做法突顯出政黨的哪種功能？
  options:
  - label: A
