  group_stem: 1898年美國與西班牙戰爭之後，關島成為美國的殖民地。第二次世界大戰期間，關島遭到日本占領，直到1944年7月，美軍收復關島。目前聯合國仍將關島列為美國的非自治領土，雖然該島居民屬於美國公民，但是其部分權利受到限制，並無法參與美國選舉，且其國會議員亦無法參與立法表決。 關島總督Hon. Eddie Calvo希望改變現狀，主張舉行自決公民投票，讓該島居民擁有表態的機會，其提出獨立、成為美國的一州和維持現狀三個選項，而該名總督主要是支持成為美國的一州。
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 我國為了尊重原住民族的權益，關於維護原住民族語言方面，採取哪種具體的積極作為？
  options:
  - label: A
    content: 將原住民族正名為山胞
  - label: B
    content: 將原住民族語言列為官方語言之一
  - label: C
    content: 所有國小學生皆必須學習原住民族語言
  - label: D
    content: 原住民電視臺播放原住民族語言新聞
  group_stem: 我國修憲時，於《憲法增修條文》第10條明文規定原住民族的相關權利與保障，彰顯我國對於原住民族人權的重視。
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 我國陸續訂定《原住民族教育法》、《原住民族工作權保障法》、《原住民族基本法》等法律，以保障原住民族的教育權、工作權、自治權，即是為了達成哪種目的？
  options:
  - label: A
    content: 維繫原住民族在社會結構的低劣關係
  - label: B
    content: 促進原住民族的生存發展、共存的族群關係
  - label: C
    content: 發展成為社會的新主流文化與新的既得利益者
  - label: D
    content: 箝制原住民族的資源，使其無法與漢人公平競争
  group_stem: 我國修憲時，於《憲法增修條文》第10條明文規定原住民族的相關權利與保障，彰顯我國對於原住民族人權的重視。
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 該紀錄片是透過影片紀錄進而思考「服從」教育的問題。而公民不服從所採取的作為，具有哪種特性？
  options:
  - label: A
    content: 暴力
  - label: B
