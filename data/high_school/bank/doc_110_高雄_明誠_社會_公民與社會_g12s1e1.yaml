questions:
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 兩岸關係錯綜複雜，稍有不慎可能引發難以收拾的局面，因此我國對中國政策必須謹慎思考。關於我國對中國政策，下列敘述何者正確？
  options:
  - label: A
    content: 依據《憲法》授權，立法機關得訂定兩岸事務的法律
  - label: B
    content: 《反分裂國家法》是我國對中國政策的主要依據
  - label: C
    content: 國家安全比經濟利益更為重要，因此以國家安全為主
  - label: D
    content: 和平統一是我國對中國政策的原則
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 大眾傳播理論之中，有關「自媒體」的定義為「因著網際網路技術，個人可向不特定的大多數或者特定的個人傳遞規範性及非規範資訊的新媒體的總稱」，其中「規範性資訊」是指自媒體傳播的訊息必須符合公益並強調「應然」的訊息，而不是實然的訊息。下列哪一項新聞報導是傳遞「規範性資訊」？
  options:
  - label: A
    content: 民眾注射疫苗造成身體不適
  - label: B
    content: 疫苗研發必須投入大量資金
  - label: C
    content: 疫苗預防功能仍有積極作用
  - label: D
    content: 國內與國外疫苗功效完全相同
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 我國總統大選期間，不同政黨各自推派候選人並拜票造勢，積極爭取多數選民的支持，期盼取得執政機會。關於我國總統的職權，下列何者正確？
  options:
  - label: A
    content: 統率全國陸海空軍，為三軍統帥
  - label: B
    content: 遭遇緊急危難或應付財政經濟上重大變故，得發布緊急命令，經行政院追認後生效
  - label: C
    content: 總統與行政部門制定法規之後，公布法律、發布命令
  - label: D
    content: 對政策錯誤的行政官員行使特赦
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 媒體在公共領域之中扮演舉足輕重的角色。關於媒體與公共領域之間的關係，下列敘述何者正確？
  options:
  - label: A
    content: 媒體並未提供辯論空間給予民眾
  - label: B
    content: 公共領域之中，媒體扮演報導、評論事實、設定議題等角色
  - label: C
    content: 新聞自由是研判言論自由的唯一指標
  - label: D
    content: 平面媒體設置「民眾投書」專欄只是附加服務，並不是公共論壇的展現
