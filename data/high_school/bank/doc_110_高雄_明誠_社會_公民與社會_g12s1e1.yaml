  type: single
  page: 1
  stem: 依據世界衛生組織的定義，高齡化社會是指65歲以上的老年人口占全體人口比例超過7%。附表為臺灣、日本、泰國與新加坡於2000～2006年65歲以上人口占全體人口比例。根據表格數據判斷，下列述何者正確？(甲)高齡化現象為四個國家的共通趨勢 (乙)臺灣比新加坡更早邁入高齡化社會 (丙)泰國於2004年邁入高齡化社會 (丁)臺灣是最亟需擴大社會福利服務的國家 (戊)日本高齡化社會與其經濟力強大相關
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (乙)(戊)
  - label: C
    content: (丙)(丁)
  - label: D
    content: (甲)(戊)
