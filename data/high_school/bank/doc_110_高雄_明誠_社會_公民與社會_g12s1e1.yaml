  - label: D
    content: 組織和監督政府
- id: doc_110_高雄_明誠_社會_公民與社會_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 各地慶祝新年的特色不同，華人是高掛燈籠、歐美是布置聖誕燈飾，而柬埔寨則是門前懸掛竹框編制的星型燈籠，畫上不同生肖圖案與賀語。新年第一天，每個家戶準備供品並燒香點燭，全家團聚迎接新年仙女下凡。第二天，人人前往佛寺誦經祈福，並攜帶自製美食供奉，如蝦仁絞肉炒冬粉、滷豬腳筍絲等。最後一天進行浴佛儀式，以求未來一年能夠平安順利。柬埔寨的過年方式與其他地區不一樣，可以推論文化具有哪種特色？
  options:
  - label: A
    content: 文化是在特定歷史時空而形成的行為模式與思考體系
  - label: B
    content: 柬埔寨的過年活動皆與宗教相關，可見宗教是影響文化的唯一因素
  - label: C
    content: 文化可以進行比較，柬埔寨的過年方式比其他地區更有意義
  - label: D
    content: 華人、歐美與柬埔寨之間應維持傳统文化，減少彼此的接觸
