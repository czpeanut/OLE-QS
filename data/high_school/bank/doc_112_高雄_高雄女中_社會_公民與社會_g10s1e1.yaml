  stem: 阿德從課本上瞭解到「民族國家」是由一群具有相近血緣、語言、文化等的人來組成國家。請問以下阿德對民族國家的相關推論，何者「錯誤」？
  options:
  - label: A
    content: 民族國家人民同質性高，較不會出現壓迫特定族群的現象
