  stem: 立法院於 2019 年 5 月 17 日通過《司法院釋字第 748 號解釋施行法》，我國成為亞洲第一個同性婚姻合法化的國家。相同性別的二人，只要年滿 18 歲，就可以向戶政機關辦理結婚登記。除此之外，也通過「繼親收養」條文，同性伴侶可收養對方的親生子女。法案三讀通過後，不少網友恭喜同志朋友獲得社會祝福。但亦有人認為，在還沒有達到社會共識的前提下即草率通過法案，有違多數民意。請問若從多元身分認同與國家攻策之關係而言，下列何者最適合詮釋同性婚姻合法化的意涵？
  options:
  - label: A
    content: 我國尚未透過立法來肯認同志群體的存在
  - label: B
    content: 相同性別二人的婚姻自由得到平等的保障
  - label: C
    content: 同性婚姻合法化後可以消除對同志的歧視
  - label: D
    content: 相同性別二人得到結婚與收養子女的特權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從上文中可得知，我國透過釋憲、立法等法律程序保障同性伴侶的權益。(C)雖然已有立法保障，但對同性伴侶的歧視存在於社會大眾的想法與概念中，難以跟隨立法腳步立刻消除。(D)非特權，而是與不同性別結婚、收養子女享有同等權利。
