  stem: 我國第一首被禁的歌曲，是發行於 1934 年末的〈街頭的流浪〉，歌詞中提到「頭家無趁錢，轉來食家己」（老闆沒賺錢，回來吃自己），描述失業男子在街頭遊蕩。當時統治臺灣的日本政府不贊同曲中對於社會問題的負面描繪，而查禁該首僅發行一個多月的歌曲。請問當時日本政府的做法，可能侵犯下列人民的何項權利？
  options:
  - label: A
    content: 政治權，因為歌詞為表達政治意見而遭禁
  - label: B
    content: 社會權，因為歌詞描寫實際社會狀況而遭禁
  - label: C
    content: 自由權，因為人民寫歌來表達想法的自由受限
  - label: D
    content: 文化權，因為人民寫歌呈現庶民文化卻遭禁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)人民透過言論、寫作、作詞作曲等創作皆是自由權中的表達自由，日本政府對於歌曲中的描繪感到不妥而禁止，有侵犯人民自由權的疑慮。
