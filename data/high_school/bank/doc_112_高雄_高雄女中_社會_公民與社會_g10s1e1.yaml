  page: 1
  stem: 聯合國是維護人權的重要政府間國際組織，以下關於聯合國的敘述何者正確？
  options:
  - label: A
    content: 聯合國制定世界自由度報告，監督各國是否履行《公民與政治權利國際公約》
  - label: B
    content: 聯合國人權理事會監督會員國的人權狀況，必要時可以出動軍隊或經濟制裁
  - label: C
    content: 聯合國安全理事會負責制定國際人權公約，並製作人權狀況調查委員會報告
  - label: D
    content: 聯合國制定 9 大國際人權公約，例如《消除對婦女一切形式歧視公約》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 聯合國制定的 9 大國際人權公約中，除了兩公約外，尚有《消除對婦女一切形式歧視公約》、《消除一切形式種族歧視國際公約》、《兒童權利公約》等。(A)《全球自由度報告》（Freedom in the World）是一份由自由之家所發布的重要年度調查和報告，以衡量全世界每個國家和地區的民主、人權、公民自由、言論自由、公民權利和政治權利程度，並非由聯合國所發布。(B)(C)兩者理事會的職權應對調。
