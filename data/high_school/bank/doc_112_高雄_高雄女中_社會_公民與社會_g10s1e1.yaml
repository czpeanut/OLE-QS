  stem: 對工時以及薪資待遇不滿，許多空服員紛紛呼籲地勤一起加入工會，希望工會成員出席表決並投下支持罷工的一票，達到合法罷工要件。請問上述事件所關心的權利客體，與下列何者最相近？
  options:
  - label: A
    content: 野草莓學運，爭取人民舉辦集會遊行，不用先徵得政府同意
  - label: B
    content: 《國民年金法》規定，只要繳納保費並年滿 65 歲，就可請領老年給付
  - label: C
    content: 立委提案修正《姓名條例》，主張原住民可用母語文字登記姓名
  - label: D
    content: 野合合學運要求政府召開國是會議，全面改選中央民意代表
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 社會權是指憲法為確保個人在社會中享有健全生活的基本條件，所賦予個人的各種權利類型的保障，包括生存權、工作權、受教育權、受健康照顧之權、環境權及文化權等。題文中為空服員爭取工作待遇，與(B)選項請領老年給付相同。(A)此為爭取自由權。(C)爭取用母語文字登記姓名是欲維護人格權。(D)要求改選中央民意代表為參政權。
