  stem: 兩公約第三次國家報告的國際審查會議於 2022 年 5 月於臺北登場，行政院長蘇貞昌在會中表示，目前聯合國 9 大核心人權公約中，有 5 部在臺灣已國內法化並實際使用中，臺灣不但成為亞洲第一個立法保障同性婚姻的國家、照顧弱勢族群，消除歧視與不平等，也將在保障外籍漁工、數位人權及環境人權等方面持續努力中。請問人權公約在臺灣運作的狀況為下列何者？
  options:
  - label: A
    content: 我國主要是透過條約的簽署及批准，將人權公約國內法化
  - label: B
    content: 因採輪流審查制，2023 年輪到我國赴聯合國進行審查
  - label: C
    content: 《消除一切種族歧視國際公約》在臺灣尚未國內法化
  - label: D
    content: 人權公約國內法化後，有助於與國際接軌以加入聯合國
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因我國並非聯合國的成員國，無法與會員國一樣簽署條約。我國透過立法院的三讀程序，制定施行法將人權公約賦予國內法地位。(C)《消除一切種族歧視國際公約》已在我國國內法化。(D)人權公約國內法化後，有助於與國際接軌並宣告對人權的維護，但並非以此條件加入聯合國。
