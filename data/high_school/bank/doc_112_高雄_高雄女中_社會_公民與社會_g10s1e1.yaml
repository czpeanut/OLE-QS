  type: single
  page: 2
  stem: 在我國，大家幫「國家」慶生的方式有所不同，也因此常引發爭議。有些人會在 10 月 10 日發文祝「『臺灣』生日快樂」；有些人也會在同一天發文祝「『中華民國』生日快樂」，但會強調「臺灣只是地名，中華民國才是國名」；甚至有些人會在 10 月 1 日當天發文幫祖國「中國」慶生。下列何者最能夠詮釋此一現象？
  options:
  - label: A
    content: 我國國定假日在法律上界定不夠明確
  - label: B
    content: 中華人民共和國打壓我國國際參與空間
  - label: C
    content: 在 10∕1 慶祝者支持中華民國統一兩岸
  - label: D
    content: 即使國慶日相同仍可能有不同國家認同
  answer:
  - D
