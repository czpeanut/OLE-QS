- id: doc_112_高雄_高雄女中_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 公民身分的概念最早可回溯至兩千多年前的古希臘雅典，經過學者不斷擴充其內涵與數次流血抗爭，才能發展至今日的局面。請問下列關於公民身分的發展歷史，何項敘述正確？
  options:
  - label: A
    content: 雅典的公民僅限於雙親都是雅典公民，且出生於雅典的成年人
  - label: B
    content: 洛克主張每個人都有天賦的權利，且他人不能加以侵犯和剝奪
  - label: C
    content: 啟蒙運動帶動對君主專制的反抗使成年有財產男性逐漸成為權利主體
  - label: D
    content: 美國〈獨立宣言〉提及，選舉權不得因種族、膚色或曾是奴隸而被否定
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)希臘雅典公民不包括婦女、窮人、奴隸以及居住在雅典的外國人，並非所有成年人都有。(C)啟蒙運動影響美國獨立運動與法國大革命，帶動對君主專制的反抗，以及以成年有財產男性為主體逐漸走向普及。(D)美國到了內戰結束後批准美國憲法第十四修正案中，其第二款則明確地規定年滿 21 歲的男性擁有選舉權；然後 1870 年批准的第十五修正案給予了不分種族、膚色的美國公民選舉權。
