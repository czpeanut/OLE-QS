- id: doc_112_台北_明倫_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 陳火泉《道》：「青楠悲哀地想：『菊是菊。花是櫻。牡丹終究不是花是！能大呼天皇陛下萬歲而死的只有皇軍，貢獻一身殉國的只有皇國臣民，我等島人畢竟不是皇民嗎？啊，終究不是人嗎？』……故事最後，青楠決定加入志願兵行列，以血換血的宗教性儀式換取日本人的身分認同，唯有以臺灣人血肉之死，才能完成與大和精神的合流。」根據上文判斷，這篇小說最有可能發布在哪一年？
  options:
  - label: A
    content: 1896 年
  - label: B
    content: 1918 年
  - label: C
    content: 1931 年
  - label: D
    content: 1943 年
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 這篇小說內容在鼓舞青年加入志願兵行列，為天皇貢獻盡忠，是日治時期典型的皇民文學作品，時間在 1937 年後，故答案為(D)。
