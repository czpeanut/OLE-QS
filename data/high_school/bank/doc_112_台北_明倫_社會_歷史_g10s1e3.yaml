  stem: 「臺灣宋江陣大都流傳於嘉南平原以南的農村，並以臺南市、高雄市居多。早期是農村子弟學習武藝的活動，日治時代因高壓統治，發展為以宗教活動、酬神娛人的武術表演性陣頭。國府來臺後，在戒嚴時代發展空間受到限制，宋江陣則附著於廟宇，成為神佛駕前的藝陣。有關於其陣型與名稱，學界比較同意的說去是師法戚繼光的『鴛鴦陣』演變衍化而來，名稱則由水滸傳而來。」根據上文及所學，何者正確？
  options:
  - label: A
    content: 宋江陣做為迎神賽會的活動從清代就開始了
  - label: B
    content: 戒嚴時代的宗教活動受到限制，是因為宗教信仰與官方不合所致
  - label: C
    content: 宋江陣流傳在南部為主的原因，是因為南部的宗教信仰較為虔誠
  - label: D
    content: 宋江陣在操演過程中常會有音樂伴奏，主要是以北管的西皮派為主
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國府來臺後的戒嚴時代。(B)宗教活動陣頭通常帶有武術性質，因此在戒嚴時代受到限制，與宗教信仰本身較無關係。(C)應是南部較早開發的緣故。
