- id: doc_112_台北_明倫_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 臺灣曾經在 1930 年代及 1970 年代分別有過二、三級產業產值超越第一級產業的情況，但學者通常認為 1930 年代的代表性不足，不足以說明臺灣進入工商業社會。這是因為什麼？
  options:
  - label: A
    content: 學者不承認日治時期的發展較中華民國時期佳
  - label: B
    content: 日治時期的農業產值過低，不成比例
