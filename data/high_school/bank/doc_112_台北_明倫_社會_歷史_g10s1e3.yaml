- id: doc_112_台北_明倫_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 雍正初年，張達京與岸裡社土官潘敦仔訂立墾約，教化平埔族原住民耕作，且著手開發埤圳。雍正 10 年張達京再與岸裡社番訂立墾約，並邀同漢人秦登鑑等共同組成「六館業戶」，擴大埤圳的開發。六館業戶的開墾對於漢人入墾在各該區域後來的發展，實有巨大的影響。請依上述內容，判斷下列敘述何者「錯誤」？
  options:
  - label: A
    content: 這份契約為「割地換水」墾約
  - label: B
    content: 這份契約的簽訂，象徵著漢人勢力進入臺灣中部地區
  - label: C
    content: 同時，也象徵著中部地區由巴則海族岸裡社獨大
  - label: D
    content: 這樣的開墾模式，也見於臺北的瑠公圳
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(D)臺北瑠公圳為郭錫瑠糾集漢人墾戶共同修築，因涉及泰雅族人活動範圍而屢遭破壞，為解決原漢衝突，郭錫瑠因此與泰雅族女子通婚，此開墾模式與中部的貓霧捒圳完全不同。

    6.1930 年代的臺灣的經濟政策為「農業南洋，工業臺灣」，但當時配合南進基地化政策，臺灣的工業發展重點在軍需工業，與民生經濟無關，(D)為正解。

    7.從「肥料貴」一句，可推知此時實施(D)肥料換穀，農民必須以稻穀與政府交換肥料，但實則是一種「變相加稅」的作法。

    8.(D)蔣渭水高速公路通稱國道五號，2018 年才完工啟用，非十大建設的重要交通設施。

    9.題文中提到「他們」既能進行走私貿易，又能在中國大陸進行情報蒐集工作，故最可能的答案為(D)鄭氏時期的山五商與海五商。

    10.題文所述為日治時期臺灣美術發展的情形，其中(B)陳進為「臺展三少年」之一。(A)清代。(C)為「渡海三家」之一，以水墨畫見長。(D)創作「現代水墨」。

    11.表格數據顯示，此時期臺灣出口以農產品為主，其中糖出口量甚至遠高於米；進口商品中紡織品占最大宗，但也有機械與鋼鐵製品，因此推斷為(A)日治時期，由於臺地產的在來米不為日本市場所接受，故米的出口遠不如糖。

    12.(A)為正解。(B)(D)私田多為鄭氏官員率眾開墾，又稱文武官田。(C)營盤田為軍隊自行屯墾。

    13.耕地面積、自耕地面積、農戶戶數等數字變化最明顯的年代為 1953 年，當年政府推行(D)耕者有其田，使自耕農民人數大增。

    14.從「政府推廣麵食政策」一句，即可推知此時為美援（1951 ～ 1965）的時代，因此答案為(A)。(B)戰後初期的土地改革。(C) 1970 年代的十大建設。(D) 1980 年代。

    15.在白色恐怖的思想禁錮下，知識分子積極引進並模仿歐美文學作品，如意識流小說、存在主義小說等，統稱為(C)現代文學。(A)日治時期。(B)戰後初前。(D) 1970 年代的文學主流。

    16.題文所述為嘉南大圳，故答案為(A)。(B)甘蔗應改為稻米。(C)嘉南平原水利灌溉不佳。(D) 1970 年代第二次進口替代時期的措施。

    17.選項中唯一產於日本的重要商品為(A)白銀。(B)產自中國大陸。(C)日本無法以軍火在中國大陸換取農產品。(D)產自南洋。

    18.貿易條約中，某公司提供臺灣國王軍火商品，由此可推斷臺灣國王為自稱「東寧國主」的鄭經，治臺期間與英國東印度公司簽有通商條約，(A)為正解。

    19.(A)從「政府以為簡法」一句，可推知(A)為正確答案。(B)大租戶向政府繳交正供，小租戶則向大租戶繳交大租。(C)小租戶擁有「永佃權」，大租戶不能將土地轉給其他人耕作。(D)臺灣土地有「一田多主」現象，多為民間自行開墾，非政府刻意規劃。

    20.1930 年代滿洲國成立，日本以優厚條件鼓勵臺灣人前往協助開發與管理，因此答案為(D)哈爾濱。(A)(C)位於東南亞，與廣告中的「冰天雪地」不符。(B)北海道非獨立的國家，也不是臺灣重要的貿易對象。

    21.(A)(B)(D)皆為固有的宗教或教派，僅(C)一貫道原被政府視為邪教查禁，至 1987 年才合法化。

    22.1960 年代晚期，臺灣的出口擴張成效頗豐，許多小工廠接了外國訂單卻又人手不足，為加速經濟發展並持續擴大外銷，因此政府於(D) 1972 年提出「客廳即工廠」口號，鼓勵家庭代工。

    23.乾隆年間，臺灣府的考生比較容易考上科舉，是由於清廷針對臺灣考生設有保障名額，但也因此吸引許多考生「冒籍應試」，故答案為(D)。

    24.1950 年代第一次進口替代時期，臺灣開始發展本土的民生輕工業，以紡織業為大宗，當時我國進口主要來自美國（美援），出口的農產品則主要銷往日本，(D)為正解。

    25.日治時期，臺灣的支出遠大於收入，對日本帝國造成不小的財政負擔。1905 年後，臺灣開始能財政自主的主要原因是專賣制度的收入，尤其是鴉片，答案為(A)。(B)之後臺地依然有抗日勢力，推行武裝抗日。(C)後藤新平的土地調查有助於增加土地稅收，但收入不及專賣制度。(D)日俄戰爭後，並無大量資金輸入臺灣。

    26.從此公司在臺灣島內與南洋地區的工作內容，可推知為日治時期為推動南進政策而成立的(D)臺灣拓殖株式會社。

    27.(D)《糖業改良意見書》於 1901 年提出，米糖相剋於 1920 年代後才出現，總督府解決米糖相剋的方法，是在嘉南平原採取分區供水，約束農民作物的選擇。

    28.(A)「塹郊」應是指新竹當地商人的組成，非貿易對象區域。(B)題文僅提到塹郊的商業發展，並未說明其成為地方領導階層。(C)為正解。(D)塹郊成立之時尚未開港通商，其貿易對象也以兩岸為主。

    29.(A)贌社制度並非原住民原有的制度。(B)漢人為荷人的協力者，荷人不可能促成漢人與原住民族群和諧。(D)贌社制度並非漢人的要求。

    30.(A)進口與出口的數量都有明顯的增加，可見對外貿易成長快速。(B)表格中無法判讀出口區域為何。(C) 1880 年代後出口遠大於進口，因此是出超。(D)為正解。

    31.兩位候選人政見的「共同點」都是要開拓國際貿易市場，此舉與(D) 1980 年代經濟自由化、國際化的目標相同。

    32.從政見內容來看，陳小妤的選區應是高雄，曾大荳的選區為臺中，錯誤的選項為(B)，米糖相剋最嚴重區域為嘉南平原，並非高雄。

    33.兩首歌謠都是女子離開故鄉到城市當女工度日，應是臺灣開始發展工業的階段，吸引許多青年自農村到城市謀生，因此答案為(D)。

    34.從書中記載，此時期臺灣的貿易範圍「上通日本，下及東南亞」，從商品中有銅熕、倭刀、盔甲等武器與永曆（南明桂王年號）錢，即可判斷為(B)鄭氏時期。

    35.《光陰的故事》描述市井小民的生活，反映時代變遷與社會現實，為 1980 年代(D)新浪潮電影的代表。

    36.臺灣為日本的殖民地，在殖民體系下，總督府的各項經濟措施，皆以母國的需求為主，(C)為正解。(A)日本非缺乏統治經驗，而是殖民經驗，所有的措施皆為穩定投資環境以獲利。(B)題文所述多為第一階段無方針主義時期的措施，與內地延長主義無關。(D) 1930 年代後，與題文時間不符。

    37.長崎為日本鎖國時期唯一的對外口岸，當時能夠往來長崎與臺灣的為(B)荷蘭人。(A)無法至日本貿易。(C)重在軍火貿易。(D)日治時期的砂糖取自臺灣，非南洋。

    38.渡海三家為自中國大陸遷來臺灣的 3 位山水墨畫名家，在「去日本化，再中國化」的政策下，中國水墨畫受到政府獎勵提倡為「國畫」，成為繪畫的主流，(A)為正解。

    39.(甲)為 1970 年代的鄉土文學，(乙)為戰後初期的戰鬥文學，(丙)為日治時期的新文學；(丁)為 1960 年代的現代文學，依年代順序排列為(C)丙乙丁甲。

    40.(A)東寧王國以漢人宗教信仰取代基督宗教。(B)以長老教會為主。(C)為正解。(D)部分部落與地區可見到基督宗教與傳統文化融合的現象。'
