  stem: 當〈燒肉粽〉這首歌隨著電影巡迴臺灣登臺演唱，成為大街小巷大家朗朗上口的名曲，卻因一句歌詞「自悲自嘆歹命人」，遭認定為「唱衰政府」，遭列禁歌。郭金發為了顧飯碗，把「自悲自嘆歹命人」改成「想起細漢真活動」，將節奏改為輕快重唱出版，而逃過禁唱的命運。請問有關上述內容何者「錯誤」？
  options:
  - label: A
    content: 這件事情可能發生在 1970 年代
  - label: B
    content: 1960 年代，受到政府遷臺的影響，主要的流行歌曲是反共愛國歌曲，因此這類鄉土歌曲會被查禁
  - label: C
    content: 1970 年代開始，校園民歌風起，寫作貼近生活的歌曲
  - label: D
    content: 面對審查制度的刁難，唱片公司或創作者常用更換歌詞、節奏的方法，來蒙混過關
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)戒嚴時期確實獎勵反共愛國歌曲，但被查禁的歌曲皆有特殊理由，如違反國策、內容荒誕、靡靡之音、為匪宣傳、時代反應錯誤等，並非鄉土歌曲就會被查禁。
