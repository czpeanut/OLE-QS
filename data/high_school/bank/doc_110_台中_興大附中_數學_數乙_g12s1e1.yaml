  type: single
  page: 2
  stem: 目前國際間使用芮氏地震規模來表示地震強度。設 I 為芮氏地震規模 r 時震央所釋放出來的能量，則 I 與 r 的關係如下：logI＝r＋0.2。發明原子彈後，我們常把地震所釋放的能量和一顆原子彈爆炸後所釋放的能量做比較。已知芮氏地震規模 5.8 的地震，其震央所釋放出來的能量，約為一顆原子彈爆炸後所釋放的能量，則芮氏地震規模 7.3 的地震，震央所釋放能量約為幾顆原子彈爆炸後所釋放的能量？（已知 log2 $\approx$ 0.3010，log3 $\approx$ 0.4771）
  options:
  - label: A
    content: '64'
  - label: B
    content: '56'
  - label: C
    content: '48'
  - label: D
    content: '40'
  - label: E
    content: '32'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '設規模 5.8 的地震所釋放之能量為 $I_{1}$

    規模 7.3 的地震所釋放之能量為 $I_{2}$

    則$\log \frac{I_{2}}{I_{1}}$＝$logI_{2}$－$logI_{1}$

    ＝（7.3＋0.2）－（5.8＋0.2）＝1.5＝$\frac{3}{2}$

    ⇒$\frac{I_{2}}{I_{1}}$＝$10^{\frac{3}{2}}$＝$\sqrt{1000}$，又 31＜$\sqrt{1000}$＜32

    故選(E)'
