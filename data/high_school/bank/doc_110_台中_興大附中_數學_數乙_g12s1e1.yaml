  type: single
  page: 1
  stem: 設 n 為自然數，若多項式（2＋x）$^{n}$＝$a_{n}x^{n}$＋$a_{n－1}x^{n－1}$＋$a_{n－2}x^{n－2}$＋……＋$a_{1}$x＋$a_{0}$，令各項係數的總和為 $A_{n}$，偶次項係數的總和為 $B_{n}$，則$\lim_{n\rightarrow \infty} \frac{2A_{n}-5B_{n}}{3A_{n}-2B_{n}}$＝？
  options:
  - label: A
    content: －3
  - label: B
    content: －2
  - label: C
    content: $-\frac{1}{2}$
  - label: D
    content: $-\frac{1}{4}$
  - label: E
    content: 不存在
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '各項係數和 $A_{n}$＝（2＋1）$^{n}$＝$3^{n}$

    偶次項係數和 $B_{n}$＝$\frac{(2+1)^{n}+(2-1)^{n}}{2}$＝$\frac{3^{n}+1}{2}$

    $\lim_{n\rightarrow \infty} \frac{2A_{n}-5B_{n}}{3A_{n}-2B_{n}}$＝$\lim_{n\rightarrow \infty} \frac{2\times 3^{n}-\frac{5}{2}\times 3^{n}-\frac{5}{2}}{3\times 3^{n}-3^{n}-1}$＝$\lim_{n\rightarrow \infty} \frac{-\frac{1}{2}\times 3^{n}-\frac{5}{2}}{2\times 3^{n}-1}$＝$\lim_{n\rightarrow \infty} \frac{-\frac{1}{2}-\frac{5}{2\times 3^{n}}}{2-\frac{1}{3^{n}}}$＝$-\frac{1}{4}$

    故選(D)'
