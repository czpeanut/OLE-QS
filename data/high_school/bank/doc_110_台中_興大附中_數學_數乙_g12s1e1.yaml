- id: doc_110_台中_興大附中_數學_數乙_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 有一個無窮等比級數，其各項總和為 28，各項平方總和為 112，若其首項為 a 且公比為 r，則數對（a，r）＝？
  options:
  - label: A
    content: $\left( 7 , \frac{3}{4} \right)$
  - label: B
    content: $\left( 6 , \frac{2}{3} \right)$
  - label: C
    content: $\left( 12 , \frac{2}{3} \right)$
  - label: D
    content: $\left( 8 , \frac{3}{5} \right)$
  - label: E
    content: $\left( 10 , \frac{1}{3} \right)$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '各項總和為 a＋ar＋$ar^{2}$＋……＝$\frac{a}{1-r}$＝28 ………………………①

    各項平方總和為 $a^{2}$＋$a^{2}r^{2}$＋$a^{2}r^{4}$＋……＝$\frac{a^{2}}{1-r^{2}}$＝112 ……………②

    $\frac{②}{①}$得$\frac{a}{1+r}$＝4 ⇒ a＝4（1＋r）代入①

    $\frac{4(1+r)}{1-r}$＝28 ⇒ 4＋4r＝28－28r ⇒ 32r＝24 ⇒ r＝$\frac{3}{4}$代回①

    $\frac{a}{1-\frac{3}{4}}$＝28 ⇒ a＝7

    ∴數對（a，r）＝$\left( 7 , \frac{3}{4} \right)$

    故選(A)'
