- id: doc_110_台中_興大附中_數學_數乙_g12s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 3
  stem: 若〈$a_{n}$〉，〈$b_{n}$〉，〈$c_{n}$〉為三數列，則下列敘述何者正確？
  options:
  - label: A
    content: 若〈$a_{n}$〉各項均為正數，且$\lim_{n\rightarrow \infty} a_{n}$存在，則$\lim_{n\rightarrow \infty} a_{n}$為正數
  - label: B
    content: 若$\lim_{n\rightarrow \infty} a_{n}$＝0，則無窮級數$\sum_{n=1}^{\infty} a_{n}$收斂
  - label: C
    content: 若〈$a_{n}$〉＝$\left\langle \left( \frac{2\pi}{7} \right) ^{n} \right\rangle$，則無窮級數$\sum_{n=1}^{\infty} a_{n}$收斂
  - label: D
    content: 若〈$a_{n}$〉收斂到 0，則數列〈$a_{n}^{2}$〉亦收斂到 0
  - label: E
    content: 若 $a_{n}$ ≤ $b_{n}$ ≤ $c_{n}$ 對所有自然數 n 都成立，且〈$a_{n}$〉、〈$c_{n}$〉極限皆存在，則〈$b_{n}$〉的極限亦存在
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：若〈$a_{n}$〉＝$\left\langle \frac{1}{n} \right\rangle$

    $\lim_{n\rightarrow \infty} a_{n}$＝$\lim_{n\rightarrow \infty} \frac{1}{n}$＝0 極限值存在，但其非正數

    (B) ╳：若 $a_{n}$＝$\frac{1}{n}$，$\lim_{n\rightarrow \infty} \frac{1}{n}$＝0，但$\sum_{n=1}^{\infty} \frac{1}{n}$為發散

    (C) ○：∵－1＜r＝$\frac{2\pi}{7}$＜1

    ∴收斂

    (D) ○

    (E) ╳：若 $a_{n}$＝－2＋$\frac{1}{n}$，$b_{n}$＝（－1）$^{n}$，$c_{n}$＝2＋$\frac{1}{n}$

    而$\lim_{n\rightarrow \infty} a_{n}$＝$\lim_{n\rightarrow \infty} \left( -2+\frac{1}{n} \right)$＝－2

    $\lim_{n\rightarrow \infty} c_{n}$＝$\lim_{n\rightarrow \infty} \left( 2+\frac{1}{n} \right)$＝2

    但$\lim_{n\rightarrow \infty} b_{n}$＝$\lim_{n\rightarrow \infty} (-1)^{n}$極限不存在

    故選(C)(D)'
