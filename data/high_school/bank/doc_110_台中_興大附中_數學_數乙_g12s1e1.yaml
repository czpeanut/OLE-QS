- id: doc_110_台中_興大附中_數學_數乙_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 3
  stem: 下列式子，哪些是正確的？
  options:
  - label: A
    content: $\lim_{n\rightarrow \infty} \frac{3^{n}+2^{n}}{6^{n}}$＝0
  - label: B
    content: $\lim_{n\rightarrow \infty} \frac{3n^{2}-2n+7}{n^{2}-3n+5}$＝3
  - label: C
    content: $\sum_{n=1}^{\infty} \left( \frac{3}{5} \right) ^{n}=\frac{3}{2}$
  - label: D
    content: $\lim_{n\rightarrow \infty} \frac{(-1)^{n}+1^{n}}{2}$＝0
  - label: E
    content: $\sum_{n=1}^{\infty} \frac{1}{n}$＝0
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\lim_{n\rightarrow \infty} \frac{3^{n}+2^{n}}{6^{n}}$＝$\lim_{n\rightarrow \infty} \frac{\left( \frac{3}{6} \right) ^{n}+\left( \frac{2}{6} \right) ^{n}}{1}$＝0

    (B) ○：$\lim_{n\rightarrow \infty} \frac{3n^{2}-2n+7}{n^{2}-3n+5}$＝$\lim_{n\rightarrow \infty} \frac{3-\frac{2}{n}+\frac{7}{n^{2}}}{1-\frac{3}{n}+\frac{5}{n^{2}}}$＝3

    (C) ○：$\sum_{n=1}^{\infty} \left( \frac{3}{5} \right) ^{n}$＝$\frac{3}{5}+\left( \frac{3}{5} \right) ^{2}+\cdots \cdots$＝$\frac{\frac{3}{5}}{1-\frac{3}{5}}$＝$\frac{3}{2}$

    (D) ╳：若 n 是奇數，$\frac{(-1)^{n}+1^{n}}{2}$＝0

    若 n 是偶數，$\frac{(-1)^{n}+1^{n}}{2}$＝1

    故$\lim_{n\rightarrow \infty} \frac{(-1)^{n}+1^{n}}{2}$不存在

    (E) ╳：$\sum_{n=1}^{\infty} \frac{1}{n}$＝1＋$\frac{1}{2}$＋$\frac{1}{3}$＋……為發散

    故選(A)(B)(C)'
