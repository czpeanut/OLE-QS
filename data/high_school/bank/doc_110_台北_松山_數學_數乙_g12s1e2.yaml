  stem: 下列敘述何者正確？
  options:
  - label: A
    content: 若$\lim_{x\rightarrow a}$f (x) 存在，則$\lim_{x\rightarrow a^{-}}$f (x)＝$\lim_{x\rightarrow a^{+}}$f (x)
  - label: B
    content: 若$\lim_{x\rightarrow a^{-}}$f (x) 存在且$\lim_{x\rightarrow a^{+}}$f (x) 存在，則$\lim_{x\rightarrow a}$f (x) 存在
  - label: C
    content: 若f (x) 和g (x) 在x＝a均連續，則合成函數 ( f。g) (x) 在x＝a連續
  - label: D
    content: 若f (x) 為一連續函數且f (a)＝0，則$\lim_{x\rightarrow a}\frac{f(x)}{x-a}$存在
  - label: E
    content: 若f (x) 在x＝a有定義且$\lim_{x\rightarrow a}$f (x)＝f (a)，則f (x) 在x＝a連續
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
