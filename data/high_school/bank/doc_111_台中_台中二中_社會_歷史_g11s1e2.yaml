questions:
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某書指出：「每個人，只要他不違反正義法則，就可以完全自由地以自己的方式追求自身利益、完全自由地以自己的勤奮和資本，與任何階層者的勤奮和資本相競爭。君主就完全免除了一種職責：監督私人的勤奮，並將它引導到最適合社會利益的工作上。」因為自我利益就是個人經濟活動的動機，國家的福利只不過是國民個人利益的總和。請問這是何人的理念？
  options:
  - label: A
    content: 伏爾泰
  - label: B
    content: 狄德羅
  - label: C
    content: 孟德斯鳩
  - label: D
    content: 亞當斯密
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 某書主張每個人可以自由地追求自身的利益，君主可完全免除監督的職責，因此可推知為(D)亞當斯密的《國富論》，支持自由競爭，反對國家貿易保護政策。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 科學家利用科學方法探究自然運行的法則與定律，他們相信上帝創造世界後就不再介入宇宙的運行，接著認為人類社會也能如自然世界般，探究出最佳系統，並開始提出各種理論，試圖建構出最好的社會藍圖。從上述的敘述中，最早出現於何時？
  options:
  - label: A
    content: 中古時期
  - label: B
    content: 文藝復興時期
  - label: C
    content: 科學革命時期
  - label: D
    content: 啟蒙運動時期
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「機械宇宙論」為牛頓所提出，主張宇宙如同巨型的機械，依循著一定的自然法則運轉，至(D)啟蒙運動時期，哲士們相信人類社會也如自然世界般，受到未知的自然規律操控，並企圖以理性去檢討並改善政治與社會。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在一幅以維納斯為主題的教堂壁畫中，藝術家以人的形象為底本，利用活潑的光影及線條，將希臘神話故事生動的表現出來。這幅畫最可能完成於何時何地？
  options:
  - label: A
    content: 5 世紀的雅典
  - label: B
    content: 10 世紀的羅馬
  - label: C
    content: 13 世紀的巴黎
  - label: D
    content: 15 世紀的米蘭
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述的作品符合文藝復興時期的藝術風格，因此這幅畫最可能出現於(D) 15 世紀的米蘭。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 學者說：「三十年戰爭（1618 ～ 1648 年）是羅馬教會對抗改革的最後行動，也是影響近代歐洲甚大的一場戰爭，它的原因相當複雜，有宗教的爭端、國際利益的衝突、領土的野心、經濟的貪婪，也有政治上的仇恨。最終，統一的理想幻滅，領土的邊界更為清楚，宗教信仰成為了他國內政不容干涉。」根據引文，可以如何解釋三十年戰爭？
  options:
  - label: A
    content: 結束了歐洲一統教會的理想，各國並立與宗教分歧成為並存的現象
  - label: B
    content: 抗議教派（新教）成為了歐洲普世性的信仰派系，羅馬公教地位一落千丈
  - label: C
    content: 由於法國獲得最後勝利，羅馬教會獲得支持而重新宰制歐洲
  - label: D
    content: 宗教問題並未獲得完全解決，各邦國統治者仍須依照羅馬教會規定決定其信仰
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)羅馬公教地位並未一落千丈。(C)羅馬教會已無法重新宰制歐洲。(D)使新教合法化，各邦國的宗教得以自主。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 馬丁路德發動宗教改革，後來建立新的教會，他的神學思想主張「因信得救」，應是受到下列哪一段文字的啟發？
  options:
  - label: A
    content: 「虛心的人有福了，因為天國是他們的。哀痛的人有福了，因為他們必得安慰。……」（《新約馬太福音》）
  - label: B
    content: 「我告訴你，你是彼得，是磐石；在這磐石上，我要建立我的教會。……我要給你天國的鑰匙……」（《新約馬太福音》）
  - label: C
    content: 「福音顯示上帝使人跟祂和好的道路，這道路是起於信而止於信。正如聖經所說的：『藉著信而跟上帝和好的人，一定得到真性命』」（《新約羅馬人書》）
  - label: D
    content: 「太初，上帝創造宇宙，大地混沌，沒有秩序。……上帝命令：『要有光。』光就出現」（《舊約創世記》）
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)提到與上帝和好的道路「起於信而止於信」，因此使馬丁．路德有了「因信得救」的想法。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 宗教自由是指一個人可以在社會中自由選擇其宗教信仰，和在這個社會中公開參加該宗教信仰的儀式，而不必擔心受社會的迫害或歧視。宗教自由也包括根據自己的判斷放棄或改變自己宗教信仰的自由。請問下列哪一時期擁有宗教自由？
  options:
  - label: A
    content: 3 世紀時的羅馬
  - label: B
    content: 7 世紀時的君士坦丁堡
  - label: C
    content: 13 世紀時的巴黎
  - label: D
    content: 18 世紀時的神聖羅馬帝國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 三十年戰爭使新教合法化，歐洲國家不再以宗教為藉口發動戰爭；此外，啟蒙運動的哲士也肯定自由的重要，強調寬容的精神，因此擁有宗教自由的時期應是(D) 18 世紀時的神聖羅馬帝國。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 伽利略曾說：「上帝在《聖經》中所欲啟示人類的，是如何上天堂，不是天體如何運行。」下列對於這段話的解讀，何者最為合理？
  options:
  - label: A
    content: 伽利略認為如何上天堂遠比天體運行重要
  - label: B
    content: 伽利略認為宗教與科學研究不該混為一談
  - label: C
    content: 伽利略認為《聖經》中的錯誤必須以科學來修正
  - label: D
    content: 伽利略認為宗教是一種不科學的迷信
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 科學革命初期發展階段，教會是科學研究最大的阻礙，伽利略更是深受其害，因此控訴教會該主導的是神學救贖，而不是干預科學研究，(B)為正解。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 孟德斯鳩批判法國的專制制度，認為少數人阻礙法國人合理運用自然法則，違反法國的國情。他主張法國應向英格蘭學習，採用民主制度，為後來的法國大革命設計藍圖。請問下列何者是孟德斯鳩主要的理念？
  options:
  - label: A
    content: 政府應遵守社會契約
  - label: B
    content: 提出三權分立的思想
  - label: C
    content: 強調天賦人權的觀念
  - label: D
    content: 自由放任的經濟政策
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 孟德斯鳩主張(B)三權分立且彼此制衡。(A)盧梭。(C)洛克。(D)亞當斯密。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 馬丁路德在日耳曼地區得到部分地方諸侯的支持，使得路德派可以在此發展，而這些地方諸侯除了宗教因素支持馬丁．路德外，還因為什麼原因支持馬丁路德？
  options:
  - label: A
    content: 不滿教宗長期干預日耳曼地區的政治
  - label: B
    content: 想要擺脫法國的控制
  - label: C
    content: 想要在此建立統一強大的帝國
  - label: D
    content: 希望馬丁路德成為他們的政教領袖
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 宗教改革其實亦是政治革命，在民族國家興起後，歐洲各國逐漸從封建走向中央集權，主權觀念高漲，使得各國政府皆欲脫離教廷或神聖羅馬帝國的控制，因而支持改革教會的訴求，日耳曼諸侯支持馬丁．路德即是一例，(A)為正解。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 德國哲學家恩格斯曾評價一位文藝復興的文人，說：「中世紀封建的終結和現代資本主義紀元的開端，是以一位大人物為標誌的，這位人物就是義大利人□□，他是中世紀最後一位詩人，同時又是新時代最初一位詩人。」請問恩格斯所指的是
  options:
  - label: A
    content: 但丁
  - label: B
    content: 薄伽丘
  - label: C
    content: 佩脫拉克
  - label: D
    content: 馬基維利
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)但丁用佛羅倫斯方言創作《神曲》，但其內容又大量引用《聖經》與古希臘、羅馬作品，崇尚中世紀的基督教精神與道德，故而被視為中世紀與近代的過渡代表。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 15 世紀初期，佛羅倫斯銀行業者麥第奇家族蒐集抄本，設立圖書館供學者利用，並資助學者研究。拜占庭帝國亡國後，不少希臘學者落腳佛羅倫斯。除佛羅倫斯外，米蘭、那不勒斯等地均有富商受到風氣影響，熱衷文藝活動。根據前文可說明哪項條件促成文藝復興的發展？
  options:
  - label: A
    content: 拜占庭帝國學者的支持
  - label: B
    content: 義大利有眾多史蹟文物
  - label: C
    content: 商業活動的興盛
  - label: D
    content: 活版印刷術的發明
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中提到佛羅倫斯銀行業者麥第奇家族，以及米蘭與那不勒斯等地的富商對學者、文藝活動的贊助，可知文藝復興的發展與(C)商業活動的興盛相關。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 18 世紀美國獨立革命的直接導火線為何？
  options:
  - label: A
    content: 英國屢在海外征戰，國庫空虛，向北美殖民地人民推行新稅
  - label: B
    content: 英國本土與北美殖民地人民宗教信仰歧異
  - label: C
    content: 英國規定北美殖民地運銷歐洲的貨物，必須由英船載運，並先至英國納稅
  - label: D
    content: 英國對北美殖民地人民實施政治壓迫
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 英國在七年戰爭中擊敗法國，但為解決戰爭造成的財政困難，轉而向北美殖民地立法開徵新稅，更加強管制北美的貿易，引發殖民地人民發動抗爭，最終變成獨立革命，(A)為正解。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 下列何者「非」為法國大革命期間國民會議所作之改革？
  options:
  - label: A
    content: 廢除封建制度，取消貴族特權
  - label: B
    content: 發表〈人權宣言〉，保障人民自由平等權利
  - label: C
    content: 沒收教會財產
  - label: D
    content: 制定憲法，廢除君主制，行共和政體
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)此為國民公會的作為。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 美國〈獨立宣言〉是世界上重要的人權法案，其內容幾乎濃縮了 17、18 世紀民主思潮中重要的主張，下列何人思想主張並「不」包含在其中？
  options:
  - label: A
    content: 洛克
  - label: B
    content: 盧梭
  - label: C
    content: 傑佛遜
  - label: D
    content: 孟德斯鳩
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 美國〈獨立宣言〉裡包含天賦人權、主權在民、人民有革命權等主張，但並未有(D)孟德斯鳩的三權分立理論，此理論首見於 1787 年完成的《聯邦憲法》。
- id: doc_111_台中_台中二中_社會_歷史_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 加拿大國會於 2006 年 11 月 27 日通過以法語為主的魁北克省為加拿大聯邦的「國中之國」。請問加拿大這個國家，國內主要語系為英語及法語；造成此現象的歷史背景應為以下何者？
  options:
  - label: A
    content: 英西戰爭（1588）
  - label: B
    content: 三十年宗教戰爭（1618 ～ 1648）
  - label: C
    content: 七年戰爭（1756 ～ 1763）
  - label: D
    content: 美國獨立戰爭（1776 ～ 1781）
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 加拿大原為法國的殖民地，但在(C)七年戰爭失敗後轉讓給英國，其中魁北克的移民不肯放棄辛苦拓墾的成果，於是在加拿大境內形成一個法語區。
