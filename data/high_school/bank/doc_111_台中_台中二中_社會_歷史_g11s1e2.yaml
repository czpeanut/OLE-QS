  stem: 以上兩則都出自於同一個學者的學說，這位學者是誰？
  group_stem: '閱讀資料後回答下列問題。

    資料一：當立法權和行政權集中在同一個人或同一個機關之手，自由便不復存在了；因為人們害怕這個國王或議會制定暴虐的法律，……如果司法權不與立法權和行政權分立，自由也就不存在了……如果司法權與行政權合而為一，法官便將握有壓迫者的力量。

    資料二：政治上的自由是公共自由，要保障公共自由，就應該避免把權力單獨委託給一個人、幾個人或少數人。因為一切有權力的人都容易濫用權力……要防止濫用權力，就必須用權力來約束權力，形成一種能聯合各種權力的政治制度，……。'
  answer:
  - 孟德斯鳩
  answer_status: verified
  answer_source: answer_key
