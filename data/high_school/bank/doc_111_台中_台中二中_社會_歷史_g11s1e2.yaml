  stem: 1889 年法國為慶祝大革命一百週年，於巴黎舉辦世界博覽會，並且完成艾菲爾鐵塔。這些活動可以反映當時法國人的哪種心態？
  options:
  - label: A
    content: 推崇笛卡兒及其主張的科學方法
  - label: B
    content: 紀念路易十四及其在海外之擴張
  - label: C
    content: 歌頌「革命之子」拿破崙的成就
  - label: D
    content: 肯定啟蒙政治思想及工業革命
  answer:
