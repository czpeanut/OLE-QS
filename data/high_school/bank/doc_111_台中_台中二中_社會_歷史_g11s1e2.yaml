    資料二：英國史家梅藍德（F．Maitland）描述：「最初，領主在某一年偶然不需要某一項勞役，就徵收一便士或半便士，以代替一次或一天的勞役。之後，領主逐漸習慣每年徵收定額的現金，以取代一定項目的勞役，但仍保留隨時得恢復勞役的權利。最後，雙方達成協定，允諾農民支付定額的現金，以取代一切勞役。」

