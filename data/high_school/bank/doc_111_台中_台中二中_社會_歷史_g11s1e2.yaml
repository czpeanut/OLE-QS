  stem: 文中的「王座」與「聖壇」所指分別為何階級？
  group_stem: 有位歷史學家曾說：「在 18 世紀法國的王座和聖壇通常被認為是一個同盟，他們的同時倒臺成為他們的內部聯繫的最終證據。」請問：
  answer:
  - 貴族、教士
  answer_status: verified
  answer_source: answer_key
  explanation: '、42. 18 世紀的法國社會階級分明，「王座」與「聖壇」代表貴族與教士階級，享有各種特權與優勢，壓迫第三階級，最終在法國大革命後被取消所有的封建特權。

    43.資料一論述立法權、行政權、司法權三者互相牽制的必要性，可推知此學者為主張三權分立的孟德斯鳩。

    44.兩則資料皆強調權力互相制衡的重要性，目的在防止政府或個人專制濫權，造成壓迫。

    45.、46.獨立戰爭後，美國於 1781 年根據《邦聯條例》成立邦聯政府，採取傾向地方分治的邦聯制，故而造成題文中英國為駐美大使的困擾。直到 1789 年才依據《聯邦憲法》成立聯邦政府，確立中央與地方政府的主從關係，解決國家差點分裂的危機。

    47.漫畫中跨坐在法國、義大利的人為拿破崙，曾經在歐陸稱雄，僅有英國能持續與之相抗衡。

    48.拿破崙為了對付英國，聯合歐陸各國對英國進行經濟封鎖，卻反遭英國以優勢海軍封鎖歐陸港口，重創歐洲的經濟。'
