- id: doc_110_高雄_三民_數學_數乙_g12s1e2_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 下列關於函數敘述哪些正確？
  options:
  - label: A
    content: f (x)＝$\begin{cases}1 ,x\geq 4 \\ 0 ,x<4\end{cases}$，$\lim_{x\rightarrow 4}$f (x) 不存在
  - label: B
    content: $\lim_{x\rightarrow 0}$x [x] 存在
  - label: C
    content: f (x)＝$\begin{cases}x+2 ,x\neq 2 \\ 4 ,x=2\end{cases}$，$\lim_{x\rightarrow 1}$f (x) 不存在
  - label: D
    content: $\lim_{x\rightarrow 3}\frac{x^{2}-9}{x-3}$存在
  - label: E
    content: $\lim_{x\rightarrow 2}\frac{[x]}{x}$存在
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：$\lim_{x\rightarrow 4^{-}}$f (x)＝0≠1＝$\lim_{x\rightarrow 4^{+}}$f (x)，故$\lim_{x\rightarrow 4}$f (x) 不存在。 (B) ○：$\lim_{x\rightarrow 0^{-}}$x [x]＝0×(－1 )＝0，$\lim_{x\rightarrow 0^{+}}$x [x]＝0×0＝0， 由$\lim_{x\rightarrow 0^{-}}$x [x]＝$\lim_{x\rightarrow 0^{+}}$x [x]＝0，得$\lim_{x\rightarrow 0}$x [x]＝0存在。 (C) ×：$\lim_{x\rightarrow 1}$f (x)＝$\lim_{x\rightarrow 1}$( x＋2 )＝3。 (D) ○：$\lim_{x\rightarrow 3}\frac{x^{2}-9}{x-3}$＝$\lim_{x\rightarrow 3}$( x＋3 )＝6。 (E) ×：$\lim_{x\rightarrow 2^{-}}\frac{[x]}{x}$＝$\frac{1}{2}$，$\lim_{x\rightarrow 2^{+}}\frac{[x]}{x}$＝$\frac{2}{2}$＝1 因$\lim_{x\rightarrow 2^{-}}\frac{[x]}{x}$≠$\lim_{x\rightarrow 2^{+}}\frac{[x]}{x}$，故$\lim_{x\rightarrow 2}\frac{[x]}{x}$不存在。 故選(A)(B)(D)。
