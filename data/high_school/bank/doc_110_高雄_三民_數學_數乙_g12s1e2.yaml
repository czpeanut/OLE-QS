  stem: 下列何者函數的定義域是「全部實數所成的集合」？
  options:
  - label: A
    content: f (x)＝$x^{2}$－5x＋6
  - label: B
    content: g (x)＝| x |
  - label: C
    content: c (x)＝$\frac{1}{x^{2}+x+1}$
  - label: D
    content: k (x)＝tan x
  - label: E
    content: h (x)＝log x
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (D) k (x)＝tan x的定義域為 { x∈R | x≠nπ＋$\frac{\pi}{2}$，n∈Z }。 (E) h (x)＝log x的定義域為 { x∈R | x＞0 }。 故選(A)(B)(C)。
- id: doc_110_高雄_三民_數學_數乙_g12s1e2_s1_2
  section: 1
