  type: multiple
  page: 1
  stem: 高斯符號 [ k ] 表示小於或等於k的最大整數，則下列敘述哪些正確？
  options:
  - label: A
    content: '[2.5]＝3'
  - label: B
    content: '[0.99]＝1'
  - label: C
    content: '[－1.6]＝－2'
  - label: D
    content: 若 [ k ]＝－1，則－1 ≤ k＜0
  - label: E
    content: 若 [ k ]＝3，則3＜k＜4
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：[2.5]＝2。 (B) ×：[0.99]＝0。 (C) ○：[－1.6]＝－2。 (D) ○：若 [k]＝－1，則－1 ≤ k＜－1＋1，即－1 ≤ k＜0。 (E) ×：若 [k]＝3，則3 ≤ k＜3＋1，則3 ≤ k＜4。 故選(C)(D)。
