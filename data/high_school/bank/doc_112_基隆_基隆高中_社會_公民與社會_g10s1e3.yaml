  stem: 「2023 年世界新聞媒體年會」在臺舉行，近千名媒體界領袖來臺與會，共同關注「媒體自由」、「選舉假新聞」等議題。現代社會的媒體是蓬勃發展的領域，具有蒐集與傳達訊息給予社會大眾的自由。關於「媒體自由」的敘述，下列何者正確？
