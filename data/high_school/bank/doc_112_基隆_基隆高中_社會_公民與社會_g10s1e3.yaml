  type: single
  page: 1
  stem: 德國總統為間接選舉產生，人民先選出聯邦議會的議員之後，再交由聯邦議會選舉產生，通常由德高望重的人擔任。聯邦議會又可分成由人民直選產生的眾議院，以及依各邦人口比例分配，保留給各邦的參議院，兩院共計 598 席。聯邦議會的議員選舉則採「單一選區兩票制」，第一張票選人，由得票數最高者獲選；第二張票選政黨，依政黨得票率分配「整個議院」的政黨比例。請根據上文的描述判斷，若與我國的選舉制度相比較，下列何者論述為對？
  options:
  - label: A
    content: 總統的產生方式與我國相似，皆為人民選舉國會議員後再間接選出
  - label: B
    content: 議會選舉時人民可以領兩張選票的形式與我國相同，一票投人一票投政黨
  - label: C
    content: 聯邦議會的政黨得票門檻與我國相同，目的為增加小黨所獲得的席次
  - label: D
    content: 聯邦議會的參議院與我國區域立委相似，皆為保障弱勢群體而設立
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 我國立法院的立法委員產生方式一樣為單一選區兩票制。(A)我國總統由人民直選產生。(C)德國採取聯立制、我國採取並立制，且設有 5 ％的政黨門檻，因此相較於德國，我國不利於小黨。
