- id: doc_112_基隆_基隆高中_社會_公民與社會_g10s1e3_s2_38
  section: 2
  number: 38
  type: single
  page: 9
  stem: 從立法院的席次分配判斷，我國曾經發生幾次「朝小野大」的情形？
  options:
  - label: A
    content: 一次
  - label: B
    content: 二次
  - label: C
    content: 三次
  - label: D
    content: 四次
  group_stem: '選區制度可以影響政黨候選人的當選席次，進而影響國會生態與政府決策模式。許多學者皆有提出研究分析，其中最著名的是杜瓦傑法則（Duverger’s law）。其提出的假設包括：①單一選區一輪投票相對多數決制，有助於兩黨政治的維持，如美國、英國。②單一選區兩輪投票多數決制，容易形成數量眾多、結構鬆散的多數黨體制，為了贏得勝選，各個政黨相互依賴，形成多黨聯盟，如法國。③比例代表制容易形成穩定的多黨制，如以色列。

    觀察附表我國國會的席次分配，可以發現選區制度、立法委員人數對於各政黨的國會席次均有較顯著的影響。

    | 年分（年） | 國會總席次 | 選區制度 | 各政黨國會席次 | 總統黨籍 |

    | --- | --- | --- | --- | --- |

    | 1992 | 161 席 | 複數選區一票制 | 國民黨獲得過半席次 | 國民黨 |

    | 1995 | 164 席 | 複數選區一票制 | 國民黨獲得過半席次 | 國民黨 |

    | 1998 | 225 席 | 複數選區一票制 | 國民黨獲得過半席次 | 國民黨 |

    | 2001、2004 | 225 席 | 複數選區一票制 | 沒有任一政黨獲得過半席次 | 民進黨 |

    | 2008、2012 | 113 席 | 單一選區二票制 | 國民黨獲得過半席次 | 國民黨 |

    | 2016 | 113 席 | 單一選區二票制 | 民進黨獲得過半席次 | 民進黨 |'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 朝小野大的狀況為在野黨席次多於執政黨，且執政黨席次未過半。在 2001、2004 年兩屆中，民進黨為執政黨，但國會中民進黨未過半的情況，故選(B)。
