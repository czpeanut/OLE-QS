  stem: 我國地方民意代表選舉，選民只能選投一位候選人，而每個候選人皆不得將自身選票轉讓給其他候選人，且各個選區的當選人名額皆不相同，此種選舉制度可能出現下列何種情況？
  options:
  - label: A
    content: 容易導致贏者全拿的現象，使得民意未能充分反映
  - label: B
    content: 當選者的民意基礎差距過大，有代表性不足的疑慮
  - label: C
    content: 容易出現棄保效應，使得小黨較難以獲得選民青睞
  - label: D
    content: 落選者得票數總和高於當選者，正當性可能被質疑
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 地方民意代表多採取複數選區制，一次當選多位的條件下，第一名當選者與最後一位當選者可能得票數差距大，其民意基礎有所落差。(A)(C)贏者全拿與棄保效應的現象主要出現在單一選區制，例如區域立委。(D)較易在單一選區制中發生，落選者的票數總和高於最高票者，產生當選者代表性的質疑。
