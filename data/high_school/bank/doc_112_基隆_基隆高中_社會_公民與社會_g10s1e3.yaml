  section: 1
  number: 6
  type: single
  page: 1
  stem: 選舉制度的不同，造成選舉結果也會有所不同。請問在不同選舉制度中，政黨大小與所獲得國會席次多寡的比較，下列何者正確？
  options:
  - label: A
    content: 單一選區相對多數決制較有利於小黨
  - label: B
    content: 複數選區相對多數決制較有利於大黨
  - label: C
    content: 聯立制較有利於大黨
  - label: D
    content: 比例代表制較有利於小黨
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)單一選區需爭取最高票才能當選，應是有利於大黨。(B)複數選區在當選多位的情況下有利於小黨。(C)聯立制是將政黨得票率分配總席次，扣除區域立委的席次後得到不分區立委的席次數量。在區域立委上較有利的大黨，不分區立委能分配的席次較少，故有利於小黨。
