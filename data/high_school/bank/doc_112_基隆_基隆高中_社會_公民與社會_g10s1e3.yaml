  stem: 22 歲居住在宜蘭縣三星鄉的少女周紫瑜，想要參選公職人員，但她不知道該怎麼選，身邊的好友給了些建議，請問下列何人的建議是正確的？
  options:
  - label: A
    content: 今年先從最基層的里長做起，累積人脈、民意後再往中央政府邁進
  - label: B
    content: 如果你要選立委，區域立委的席次比較多，不過一定要有政黨提名
  - label: C
    content: 如果你要選鄉長，則應該要與其他候選人聯合競選，以提升曝光度
  - label: D
    content: 以選舉制度設計來說，競選鄉民代表，應該會比競選鄉長來的容易
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)周女想參選公職人員可建議從年齡門檻較低、與生活範圍高度連結的里長開始選，再循序漸進參選鄉民代表、鄉長、市議員等。(B)區域立委採單一選區制，每一個選區僅有最高票者當選，挑戰較大，大黨推薦的候選人勝選機率較高，但是參選立委並無強制政黨推薦的規定。(C)鄉長僅當選一位，大多不會採取聯合競選的策略；聯合競選的策略多用在複數選區，例如縣市議員選舉。
