  section: 1
  number: 11
  type: single
  page: 2
  stem: 大法官第 748 號解釋認定《民法》中有關婚姻規定，沒有使相同性別之二人可成立具有親密性及排他性之永久結合關係，違背憲法所保障的人權，另 2018 年公投案中，通過了「《民法》婚姻應限於一男一女之結合」、「制定《民法》以外之同婚專法」兩案，而 2019 年 5 月 17 日，立法院三讀通過《司法院釋字第 748 號解釋施行法》，使臺灣同性戀伴侶結婚有法源依據。請問就我國大法官解釋保障人權、同性婚姻公投與立法院制定同婚專法結果之說明，下列何者正確？
  options:
  - label: A
    content: 公投結果為全國人民直接民主之展現，其效力應高於大法官解釋
  - label: B
    content: 公投結果對立法機關產生實質拘束力，但仍不得牴觸大法官解釋
  - label: C
    content: 立法機關制定同婚專法違反公投結果，亦違反大法官解釋之意旨
  - label: D
    content: 立法機關制定同婚專法無違反公投結果，表決結果僅具諮詢性質
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
