  stem: '某國舉行國會大選，其中一選區有六位參選人，附表為該選區得票率結果。某政治學者據此撰文評論其選舉制度問題，下列何者可能是該學者提出的問題？

    | 候選人 | 丁丁 | 迪西 | 拉拉 | 小波 | 阿美 | 媱媱 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 得票率 | 18 ％ | 16 ％ | 17 ％ | 12 ％ | 19 ％ | 18 ％ |'
  options:
  - label: A
    content: 若當選者僅一人，小黨林立，國會議事討論法案時將較無效率
  - label: B
    content: 若當選者僅一人，當選者得票率不高時將出現代表性不足之疑慮
  - label: C
    content: 若當選者有四人，候選人為獲多數選民支持其政見將較為中立
  - label: D
    content: 若當選者有四人，選舉結果容易導致得票率與席次率嚴重偏差
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 當採取單一選區相對多數制時，得票率 19 ％的阿美贏得席次，但得票率連 1∕5 都沒有，可能有代表性不足的疑慮。(A)若該選區由阿美當選，僅表示該選區各候選人競爭激烈，也無法代表國會中將會小黨林立。(C)若採複數選區制，候選人不需為了爭取最高票而設立中立政見爭取支持，可能會出現偏激的言論。(D)得票率與席次率產生偏差的現象可能出現在單一選區制或設立高門檻的比例代表制中。
  tags:
    unit:
      code: CI-1-4-2
      book: 公民與社會1 民主與人權
      chapter: 民主治理與公民參與
      title: 定期選舉
