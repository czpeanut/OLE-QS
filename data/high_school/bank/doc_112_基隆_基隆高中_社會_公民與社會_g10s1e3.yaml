  stem: 關於選舉制度的比較，下列敘述何者正確？(甲)單一選區因每個選區僅選出一位當選人，因此有利於大黨(乙)比例代表制容易因選區劃分不公平，進而影響選舉結果(丙)複數選區相對多數決制的候選人經常會提出較偏激的政見，以吸引部分選民的支持，理論上比較容易出現賄選(丁)複數選區選出一位以上的當選人，有利於小黨或無黨籍人士(戊)相對多數決制的缺點是得票率與席次的比例不一致，當選者存有代表性不足的疑慮(己)採用比例代表制能夠使政黨獲得之席次與政黨得票率符合一致性。
