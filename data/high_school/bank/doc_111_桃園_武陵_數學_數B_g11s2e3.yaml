- id: doc_111_桃園_武陵_數學_數B_g11s2e3_s3_9
  section: 3
  number: 9
  type: fill
  page: 2
  stem: 如右圖為一電路圖，已加 A、B、C 三個開關能通電的機率分別為$\frac{1}{2}$、$\frac{1}{3}$、$\frac{1}{5}$，且三者獨立運作、功能互不影響，試求電流能由 L 流通到 R 的機率為＿＿＿＿。
  assets:
  - key: s3_9_f1
    kind: figure
    file: doc_111_桃園_武陵_數學_數B_g11s2e3/s3_9_f1.png
    crop:
      page: 2
      rect:
      - 460.2
      - 420.2
      - 563.25
      - 495.85
  answer:
  - $\frac{1}{3}$
  answer_status: verified
  answer_source: answer_key
  explanation: 'P（通過上方）＝$\frac{1}{2}\times \frac{1}{3}$＝$\frac{1}{6}$

    P（通過下方）＝$\frac{1}{5}$

    P（通過上方或通過下方）

    ＝P（通過上方）＋P（通過下方）－P（通過上方且通過下方）

    ＝$\frac{1}{6}$＋$\frac{1}{5}$－$\frac{1}{6}$×$\frac{1}{5}$＝$\frac{5 + 6 - 1}{30}$＝$\frac{1}{3}$

