- id: doc_111_桃園_武陵_數學_數B_g11s2e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: （ ）袋中有 3 顆白球、4 顆紅球，今自袋中隨機取球，設每顆球被取到的機率都相等，則下列敘述何者正確？
  options:
  - label: A
    content: 一次取兩球，恰為一白球一紅球的機率為$\frac{2}{7}$
  - label: B
    content: 一次取兩球，取後不放回，共取 2 次，則第一次與第二次皆取到一白球一紅球的機率為$\frac{12}{35}$
  - label: C
    content: 一次取一球，取後不放回，共取 5 次，則第 5 次取得白球的機率為$\frac{3}{7}$
  - label: D
    content: 一次取一球，取後不放回，共取三次，在第三次取到白球的條件下，第二次取到白球的機率為$\frac{1}{3}$
  - label: E
    content: 一次取一球，取後不放回，共取 7 次，則在第四次取到白球的條件下，第七次取到白球的機率為$\frac{1}{3}$
- id: doc_111_桃園_武陵_數學_數B_g11s2e3_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 設 A，B 為獨立事件，且 P(A)＝$\frac{1}{4}$，P（A∪B）＝$\frac{2}{3}$，則 P（B'∣A）＝＿＿＿＿。
  answer:
  - $\frac{4}{9}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵A，B 為獨立事件

    ∴P（A∩B）＝P(A)×P(B)

    P（A∪B）＝P(A)＋P(B)－P（A∩B）

    ＝P(A)＋P(B)－P(A)×P(B)

    ⇒$\frac{2}{3}$＝$\frac{1}{4}$＋P(B)－$\frac{1}{4}$P(B)

    ⇒ P(B)＝$\frac{5}{9}$

    故 P（B''∣A）＝P（B''）＝1－P(B)＝1－$\frac{5}{9}$＝$\frac{4}{9}$'
