  answer_status: verified
  answer_source: answer_key
  explanation: '○：P(A)×P（B∣A）×P（C∣A∩B）

    ＝P(A)×$\frac{P (A\cap B )}{P (A )}$×$\frac{P (A\cap B\cap C )}{P (A \cap B)}$＝P（A∩B∩C）'
