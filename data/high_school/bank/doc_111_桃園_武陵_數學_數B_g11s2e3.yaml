- id: doc_111_桃園_武陵_數學_數B_g11s2e3_s3_6
  section: 3
  number: 6
  type: fill
  page: 2
  stem: 凱凱打靶的命中率為$\frac{2}{3}$，且每次射擊的結果互不影響。凱凱對靶面連續射擊 n 次，若靶至少被命中一次的機率大於 0.999，則 n 的最小值為＿＿＿＿。
  answer:
  - '7'
  answer_status: verified
  answer_source: answer_key
  explanation: '所求 1－$\left( \frac{1}{3} \right) ^{n}$＞0.999

    ⇒$\frac{1}{1000}$＞$\frac{1}{3^{n}}$

    ⇒ $3^{n}$＞1000

    又 $3^{6}$＝729，$3^{7}$＝2187

    故 n 的最小值為 7'
