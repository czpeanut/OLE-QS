- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 宬譯發現大多數公共廁所提供的免費衛生紙消耗的速度總是異常快速，甚至偶爾可見有人將衛生紙全部取走的情形。關於此一情況之相關解釋何者正確？
  options:
  - label: A
    content: 衛生紙消耗快速，可推論此時資源使用效率最佳
  - label: B
    content: 衛生紙改為付費提供，可清楚劃分債權避免浪費
  - label: C
    content: 由此可推論自備衛生紙之使用者之用量相對免費衛生紙較少
  - label: D
    content: 公共廁所提供的免費衛生紙使用沒有限制，因此不具稀少性
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)公廁衛生紙消耗快速是因為其為公共財，免費可以使用，反倒造成浪費，此時資源為無效率利用。(B)應是清楚取得所有權，為使用者付費的概念。(D)衛生紙使用會減損，並非取之不竭、用之不盡，因此仍具有稀少性。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 筠珊在路上逛街時，遇到 A 化妝品公司的推銷員向她推銷保養品，推銷員講得一口舌燦蓮花，筠珊一不小心就被推銷員的話術迷惑，答應以信用卡方式付款購買。等到當天回家試用後，筠珊發現效果不如預期，於是立即向
    A 化妝品公司要求退貨，但公司的客服表示，產品既已開封就不可退貨。下列有關買賣契約效力之敘述，何者正確？
  options:
  - label: A
    content: 保養品的效果屬消費者主觀感受，若以此理由退貨對商家顯失公平
  - label: B
    content: 依據私法自治原則，筠珊簽訂契約之後即不得反悔退貨，必須付款
  - label: C
    content: 此交易行為雖有猶豫期的保障，但已拆封之商品屬於合理例外情事
  - label: D
    content: 為落實契約正義，保護消費者權益，筠珊可不遵守契約並要求退貨
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文情境屬於訪問交易，依照《消費者保護法》第 2 條第 11 款的規定是指企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所訂立之契約。(A)(B)因為為訪問交易，可享有
    7 天猶豫期。(C)(D)依據《消費者保護法》第 19 條第 1 項及《消費者保護法施行細則》第 17 條之規定，通訊交易或訪問交易之消費者，得於收受商品後
    7 日內通知業者解除契約，無須說明理由或負擔任何費用或對價。而此產品並非合理例外情事，消費者因檢查之必要拆封商品，解除權不消滅，(D)為正解。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 附圖是房東甲（房屋所有權人）和房客乙的對話。依據對話內容，從《民法》債權和物權的特性分析，下列何者正確？
  options:
  - label: A
    content: 租約到期後，甲得請求乙返還房屋
  - label: B
    content: 甲將房屋出租，即喪失房屋所有權
  - label: C
    content: 乙積欠租金，侵害甲的租金所有權
  - label: D
    content: 丙為新承租人，可要求乙搬離甲屋
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 240.6
      - 425.25
      - 443.5
      - 601.55
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)出租為債權，不影響甲的所有權。(C)乙為債務不履行之情形，應是侵害甲的債權。(D)僅房屋所有權人有權要求乙搬離該房屋。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 小美烘焙坊是專門做可頌和貝果的店，右圖為可頌與貝果的生產可能曲線。請問生產第二個可頌與第三個可頌的機會成本分別是幾顆貝果？
  options:
  - label: A
    content: 10，8
  - label: B
    content: 8，5
  - label: C
    content: 2，3
    asset:
      key: s1_4_optC
      file: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1/s1_4_optC.png
      crop:
        page: 1
        rect:
        - 428.65
        - 664.45
        - 564.3
        - 777.25
  - label: D
    content: 1，2
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 生產第二個可頌的機會成本為 10－8＝2 個貝果；而生產第三個可頌的機會成本為 8－5＝3 個貝果，故選(C)。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: '浩宇基於創業理想開了一家鹹酥雞店，在生產技術及資源不變的情況下，將資源充分利用後，最多可以炸出 40 片雞排或 100 份魷魚，其生產量組合為下表，請依其性質判斷下列何者正確？

    |  | 甲 | 乙 | 丙 | 丁 | 戊 |

    | --- | --- | --- | --- | --- | --- |

    | 雞排（片） | 0 | 10 | 20 | 30 | 40 |

    | 魷魚（份） | 100 | 90 | 70 | 40 | 0 |'
  options:
  - label: A
    content: 每增加一單位雞排的機會成本都相同
  - label: B
    content: 浩宇老闆選擇炸雞排的話就不能炸魷魚
  - label: C
    content: 乙組合的總數量大於丙組合，可推論乙效率較丙高
  - label: D
    content: 若魷魚價格上漲，浩宇老闆可能會選擇甲組合生產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從每增加一單位雞排時，魷魚減少的數量可看出機會成本遞增。(B)可以同時炸雞排和魷魚。(C)生產組合皆為有效率的組合，乙丙的效率一樣。(D)因為魷魚價格上漲，老闆基於理性自利，會選擇有利可圖的組合生產，而選擇多生產魷魚，為正解。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 偶像天團開演唱會除了吸引歌迷搶購門票外，因演唱會所發行的周邊商品，也總是吸引大批粉絲熬夜排隊搶購。甚至還有無法熬夜的粉絲願意付出 2,000 元的「排隊代買」費用請他人代買周邊商品。若以「機會成本」的角度分析上述現象，以下推論何者正確？
  options:
  - label: A
    content: 該名粉絲請代買者代買周邊商品的外顯成本低於 2,000 元
  - label: B
    content: 該名粉絲自己排隊購買周邊商品的機會成本高於 2,000 元
  - label: C
    content: 代買者為他人排隊購買周邊商品的外顯成本高於 2,000 元
  - label: D
    content: 代買者為他人排隊購買周邊商品的機會成本高於 2,000 元
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是機會成本高於 2,000 元。(C)(D)應是機會成本低於 2,000 元。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 柏廷與前妻育有一對龍鳳胎小帥與小美，柏廷遺囑將其名下僅有的所有財產留給兒子小帥。柏廷過世後，其女小美認為父親重男輕女，不服遺囑內容，向法院提起訴訟。若該遺囑符合成立要件，針對此一繼承爭議，下列敘述何者正確？
  options:
  - label: A
    content: 遺囑明顯重男輕女，法院應判決房屋由柏廷的兒女均分
  - label: B
    content: 柏廷的前妻為當然繼承人，有權與其子女共同繼承財產
  - label: C
    content: 遺囑違反《民法》規定，其女小美有權繼承部分的財產
  - label: D
    content: 柏廷為屋主，依法可預立遺囑全權決定房屋所有權歸屬
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)小帥與小美皆為法定繼承人，雖然遺囑敘明要將遺產留給小帥，但小美仍可以獲得特留分，(C)為正解。(B)題文敘明為前妻，代表已非配偶，無法繼承遺產。(D)為保障繼承人之繼承權，遺囑不能違反特留分之規定。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '附表為三芝與埔里兩地區每年全力生產櫻花茶與筊白筍的生產力，根據表格資訊判斷，兩地若進行專業分工後交易，最可能產生何種結果？

    |  | 三芝 | 埔里 |

    | --- | --- | --- |

    | 櫻花茶 | 5,000 斤 | 2,400 斤 |

    | 筊白筍 | 4,000 斤 | 3,000 斤 |'
  options:
  - label: A
    content: 三芝可專心生產櫻花茶，再用 2,000 斤櫻花茶和埔里交換 1,800 斤筊白筍
  - label: B
    content: 三芝可專心生產櫻花茶，再用 2,000 斤櫻花茶和埔里交換 1,500 斤筊白筍
  - label: C
    content: 埔里可專心生產櫻花茶，再用 1,000 斤櫻花茶和三芝交換 1,500 斤筊白筍
  - label: D
    content: 埔里可專心生產櫻花茶，再用 1,000 斤櫻花茶和三芝交換 1,200 斤筊白筍
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 附圖為甲、乙兩人正從事汽車買賣，依據圖示與我國相關法律，試判斷下列何項敘述最為恰當？
  options:
  - label: A
    content: 汽車買賣屬於特種交易，消費者擁有 7 日的猶豫期
  - label: B
    content: 汽車業者與消費者訂定買賣契約，即發生債之關係
  - label: C
    content: 為避免糾紛，汽車所有權轉移需完成登記始生效力
  - label: D
    content: 附圖中右側為汽車的債權人，左側為汽車的債務人
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)在《消費者保護法》中所稱「特種交易」，包括以下 3 種交易型態：通訊交易、訪問交易、分期付款買賣，故此種汽車買賣不屬之。(C)汽車為動產，動產的交付移轉才生效力。(D)從給付標的物來看，右側賣家乙為汽車的債務人，左側買家甲為汽車的債權人。
  assets:
