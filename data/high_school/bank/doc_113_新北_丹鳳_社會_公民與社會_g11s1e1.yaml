  explanation: 依據《消費者保護法》，在網路上買東西，除合理例外情事，只要是商家對顧客就享有 7 日內退貨權利。而《消保法》規範的「消費關係」，指的是「消費者」與「企業經營者」之間因商品或服務產生的法律關係，所以只要對方是「企業經營者」（例如：賣家為
