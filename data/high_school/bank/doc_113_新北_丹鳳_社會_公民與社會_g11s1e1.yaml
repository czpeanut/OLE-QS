  stem: '下表為廣志和美冴婚姻關係消滅時，雙方所擁有的財產清冊。若雙方婚後未登記約定財產制，兩人的財產應如何分配？

    |  | 廣志 | 美冴 |

    | --- | --- | --- |

    | 婚前財產 | 存款 200 萬元 | 存款 100 萬元 |

    | 婚後財產 | 父親書面贈與房屋（價值 1,500 萬元） 租金所得 100 萬元 | 工作所得 500 萬元 因車禍獲得之慰撫金 100 萬元 |'
  options:
  - label: A
    content: 夫妻各自取回自己的財產，因此沒有財產分配的問題
  - label: B
    content: 除特有財產外，共同財產的部分由夫妻雙方各得一半
  - label: C
    content: 剩餘財產較少的廣志，可行使剩餘財產差額分配請求權
  - label: D
    content: 總財產較少的美冴，可以行使剩餘財產差額分配請求權
  group_stem: 廣志和美冴原為一對相愛的戀人，兩人結婚後育有一子一女為小新和小葵，但廣志婚後因獲得父親銀之介贈與他的房產，因此決定將房子出租維生。身為包租公的廣志整日遊手好閒，流連賭場，導致家庭失和、夫妻離異。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 法定財產制之管理權原由夫妻之一方擔任者，不論婚前或婚後財產，所有權由夫妻分別所有，各自管理、使用、收益（例如出租）及處分（例如變賣）。如有負債，亦各自負清償責任。夫妻離婚或法定財產制消滅時，婚後財產扣除與婚姻貢獻無關者（包括繼承、贈與及慰撫金）為剩餘財產，應予平分。(A)婚後財產有財產分配的問題。(B)應是婚後財產扣除與婚姻貢獻無關者（包括繼承、贈與及慰撫金）為剩餘財產，應予平分。(C)(D)因為廣志的婚後財產為
    100 萬元；美冴的婚後財產為 400 萬元，因此剩餘財產較少的廣志，可行使剩餘財產差額分配請求權，答案為(C)。
