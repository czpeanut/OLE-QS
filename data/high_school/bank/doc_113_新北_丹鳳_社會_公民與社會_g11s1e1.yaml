- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 秉閎在早餐店買了一份鐵板麵，按標價結帳後，繼續留在店內等候餐點製作時，發現另一位帥哥顧客也買了一份鐵板麵，早餐店阿姨卻熱情的給予他半價優惠。秉閎即向阿姨表達不滿，認為自己未受到公平待遇。關於秉閎與早餐店阿姨的這筆交易的法律評論，下列敘述何者正確？
  options:
  - label: A
    content: 同一家店就同一商品以不同價格販售，違反《消費者保護法》的規定
  - label: B
    content: 依照《消費者保護法》，秉閎可以主張店家的資訊不透明，要求解約
  - label: C
    content: 依照契約自由原則，秉閎可以未經阿姨的同意，逕行廢止該買賣契約
  - label: D
    content: 依照契約自由原則，早餐店有權利選擇要跟哪些顧客達成優惠的交易
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 行政院公平交易委員會曾作出說明：「『差別待遇』係指就同一商品或服務，以不同之價格或價格以外之條件出售給同一競爭階層不同之購買者而言，在一般商業交易，『差別待遇』屬常見，惟是否違反《公平交易法》第
    19 條第 2 款規定，應考量市場情況、成本差異、交易數額、信用風險等因素判斷有無正當理由暨是否會妨礙公平競爭。」故(D)為正確敘述。(A)題幹之情形應不違反《消保法》。(B)差別待遇是依據契約自由原則而成立，不屬於資訊不透明之情形。(C)廢止契約應雙方同意。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: '哲誌婚前用自己的名字買下一棟豪宅，準備要跟女友結婚，但他看到新聞中，某藝人結婚二十多年面臨婚姻觸礁、委任律師處理離婚程序與小孩監護權的問題，尤其是針對離婚時夫妻財產分配的爭議，不禁讓哲誌陷入思考，此時哲誌的朋友也開始七嘴八舌的給建議，以下四位朋友的建議，何者符合現行法律規定？

    丞凱：我建議不要用法定財產制，因為要是離婚，目前你名下的豪宅要讓出一半喔。

    宇濤：用法定財產制基本上不會錯啦，只不過你的豪宅婚後就變成夫妻共有共管喔。

    芷妘：法定財產制可考慮，畢竟婚後財產各自管，只是要去法院書面登記比較麻煩。

    奕鋐：要是離婚，法定財產制也只平均分配剩餘婚後財產，豪宅還是你的，別擔心。'
  options:
  - label: A
    content: 丞凱
  - label: B
    content: 宇濤
  - label: C
    content: 芷妘
  - label: D
    content: 奕鋐
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)哲誌的豪宅為婚前財產，可以不用列入婚後剩餘財產之分配，丞凱說法有誤。(B)法定財產制之管理權原由夫妻之一方擔任者，不論婚前或婚後財產，所有權由夫妻分別所有，各自管理、使用、收益（例如出租）及處分（例如變賣）。所以哲誌的豪宅無需共同管理，宇濤說法有誤。(C)法定財產制無需至法院登記，芷妘說法有誤。(D)奕鋐的說法正確。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 阿智終身未婚，膝下無子女，且父母過世多年，晚年全靠印尼籍看護 Mary 照料生活起居，而他也將 Mary 視如己出。2024 年阿智因癌症往生，他在生前曾立下遺囑，要把全部的遺產留給悉心照顧他的看護
    Mary，但此舉卻引發兩名弟弟的不滿。關於上述案例，下列敘述何者符合我國法律規定？
  options:
  - label: A
    content: 基於尊重當事人生前遺囑決定，兩名弟弟並無繼承的權利
  - label: B
    content: 印尼籍的 Mary 不具中華民國國籍，因此無法繼承阿智遺產
  - label: C
    content: 雖然阿智將遺產全留給 Mary，但兩名弟弟仍可主張特留分
  - label: D
