  stem: 行政院消保處表示，提供 Youbike 自行車出租給他人使用者，或風景區租借等自行車租賃，都適用交通部公告的「自行車租賃定型化契約應記載及不得記載事項」。有關自行車租賃之定型化契約的規定，下列敘述何者正確？
  options:
  - label: A
    content: 在某程度上限制了締約之自由，簽訂後即不可修改契約內容
  - label: B
    content: 契約內容違反主管機關公告之應記載及不得記載事項者無效
  - label: C
    content: 為了保障業者的相關權益，業者不應該給予消費者審閱期間
  - label: D
    content: 訂約雙方若對契約條款內容有疑義，應做成有利業者之解釋
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)定型化契約中之個別磋商條款，依照《消費者保護法》第 2 條規定，是指契約當事人個別磋商而合意之契約條款。換言之，個別磋商條款是一種經過契約雙方當事人磋商後的約定，與定型化契約條款並未經過雙方磋商的情形不同。(C)《消費者保護法》第
    11-1 條規定：「企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。企業經營者以定型化契約條款使消費者拋棄前項權利者，無效。」(D)為保障在磋商上居於劣勢而常不能就定型化契約條款為充分思慮的消費者利益，《消費者保護法》遂於第
    11 條第 2 項明文規定：「定型化契約條款如有疑義時，應為有利於消費者之解釋。」作為個案解釋的依據。
