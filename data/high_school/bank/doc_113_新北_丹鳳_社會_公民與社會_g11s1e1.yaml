  stem: 海仁與賢祐結婚後，兩人便約定海仁以工作所得支付家庭開支，賢祐辭職在家料理家務與育兒。海仁與賢祐於婚後並未特別約定財產制度。關於兩人婚姻中的財產關係，下列何者最符合我國《民法》的規定及其立法精神？
  options:
  - label: A
    content: 因夫妻須共享財產，故依法海仁與賢祐都應該將自己婚後財產改為與配偶共有
  - label: B
    content: 海仁與賢祐在婚後應仍各自擁有自己的婚前財產，以確保夫妻兩人的權益平等
  - label: C
    content: 因海仁負責支付家庭開支，若賢祐至百貨公司購物積欠卡債，海仁須代為償還
  - label: D
    content: 因賢祐專職料理家務無工作所得，基於性別平等，海仁薪資所得應與賢祐均分
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 兩人無特別約定，則採法定財產制。法定財產制之管理權原由夫妻之一方擔任者，不論婚前或婚後財產，所有權由夫妻分別所有，各自管理、使用、收益（例如出租）及處分（例如變賣），如有負債，亦各自負清償責任，故選(B)。(A)兩人無需共享財產，也不用共有財產。(C)夫妻債務各自清償。(D)薪資為婚後所得，也各自管理、使用、收益及處分，並無均分的規定。
