  stem: 他因為在一場戰爭受傷失去了一位當戰士的資格，而後在治療期間念了《耶穌傳》、《聖人言行》，決心步上聖人的後塵而出了一本《神操》，在經過多年的神學院的學習，並與幾位志同道合的朋友前往羅馬，1534年受到教宗的認可成立了一個組織，請問這個組織有何理念？
