    就穆斯林個人而言，吉哈德基本上是信仰理念落實的奮鬥（Struggle）；而若就伊斯蘭Ummah（社群）而言，吉哈德的執行是為了國家與信仰者生命存續的奮鬥，若需要用到武力或暴力，則是防衛性而非侵略性的行為。

    西方學者往往視伍麥亞朝哈里發以吉哈德為名，用武力對外擴張帝國疆域。阿拔斯朝時期基本上伊斯蘭帝國疆域已底定，鮮少對外擴張。這兩朝代期間除了對外的征戰，內部亦有不大不小的衝突與戰爭。就中世紀宗教學者的界定，穆斯林社群的內戰是否可以吉哈德視之呢？歷史學家有不同的評斷，端視主戰者或戰爭性質；然而，史實指出，基本上內戰皆是政治利益衝突之戰，而且什葉與遜尼穆斯林社群之間的武力衝突，其出發點更是在捍衛各自在伊斯蘭的正統性與法統。古蘭經文的鼓勵吉哈德，作用是為了對抗偽信者（Kafir）或異教徒的壓迫，因此什葉與遜尼正統性之爭不應解釋為吉哈德；而這種信仰者相互殘殺乃背離神的正道，應受到譴責的。

    吉哈德（Jihad）若要依西方的翻譯Holy War轉成中文「聖戰」，則必須視情境。歐洲十字軍東征伊斯蘭世界即打著「聖戰」的口號。面對歐洲基督宗教徒暴力的入侵，穆斯林也相應以吉哈德為號召，廣招大軍對抗之；然而伊斯蘭世界與基督宗教世界的軍事衝突，不全然可以聖戰看待，例如在奧米雅王朝與阿拔斯王朝對拜占庭的開戰則不是吉哈德，因為那是基於經濟與政治利益的武力活動，即使穆斯林歷史家宣稱是為了推動伊斯蘭的吉哈德。阿拔斯王朝之後，伊斯蘭世界的政治舞臺為傭兵軍事政權所掌控，各軍閥政權之間征戰不止，這些戰爭並不能稱之為「聖戰」或吉哈德，那是版圖擴張之戰，而非為信仰理念捍衛的戰爭。

