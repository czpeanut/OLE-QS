  stem: 有一雙狹縫裝置，其狹縫間距為d，屏幕與雙狹縫平行、距離為L，以一束綠色雷射光經空氣垂直射入雙狹縫，在屏幕上相鄰兩亮紋間距為$x_{1}$。若改在平靜的水中進行上述實驗，其餘條件皆相同，在屏幕上相鄰兩亮紋間距為$x_{2}$，則$\frac{x_{2}}{x_{1}}$之值為何？（已知水的折射率為$\frac{4}{3}$）
  options:
  - label: A
    content: $\frac{3}{2}$
  - label: B
    content: $\frac{4}{3}$
