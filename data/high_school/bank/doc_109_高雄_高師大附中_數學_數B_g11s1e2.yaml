  stem: '■<u>大雄</u>將 10 萬元存入銀行，銀行的年利率是 4 ％，每年複利一次，設存了 n 年的本利和為 f（n）萬元，經過了 k 年之後本利和會超過 20 萬元，試回答下列問題：

    (1) 試以 n 表示 f（n）。（2 分）

    (2) 用一個不等式來描述“經過了 k 年之後本利和會超過 20 萬元。”（2 分）

    (3) 求 k 的最小值等於多少？（k 用整數來表示）（4 分）

    （已知 log2＝0.3010，log1.04＝0.0170）'
