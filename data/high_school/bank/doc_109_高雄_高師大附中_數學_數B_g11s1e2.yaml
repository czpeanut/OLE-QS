  type: fill
  page: 3
  stem: '聲音的強度是用每平方公尺多少瓦特（W／$m^{2}$）來衡量，一般人能感覺出聲音的最小強度為 $I_{0}$＝$10^{－12}$（W／$m^{2}$）；當測得的聲音強度為 I（W／$m^{2}$）時，所產生的噪音分貝數為 d，其關係式為 d（I）＝$10 \log \frac{I}{I_{0}}$，試回答下列問題：

    (1) 一隻蚊子振動翅膀測得的聲音強度為 $10^{－12}$（W／$m^{2}$），則其產生的噪音為＿＿＿＿分貝。

    (2) 汽車製造廠測試發現，某新車以每小時 60 公里速度行駛時，會產生 80 分貝的噪音， 則此時汽車的聲音強度是＿＿＿＿（W／$m^{2}$）。

    (3) 已知一支瓦斯汽笛獨鳴，測得的聲量為 70 分貝。假設聲音發出的聲音強度是可加成的，例如，2 支瓦斯汽笛同時發聲所發出的聲音強度是 1 支瓦斯汽笛發出聲音強度的 2 倍。 現有若干支瓦斯汽笛齊鳴，測得的噪音為 100 分貝。則共有＿＿＿＿支瓦斯汽笛齊鳴。'
