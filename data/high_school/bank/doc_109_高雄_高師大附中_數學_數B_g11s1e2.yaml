  stem: 設 x，y 為正實數，已知 $log_{7}$x＝5.6，$log_{7}$y＝2.3，則 $log_{7}$（$x^{2}$＋y）最接近的整數為
  options:
  - label: A
    content: '10'
  - label: B
    content: '11'
  - label: C
    content: '12'
  - label: D
    content: '13'
  - label: E
    content: '14'
  explanation: '$\begin{cases}\log _{7}x =5.6 \\ \log _{7}y =2.3\end{cases}$ ⇒ $\begin{cases}x =7^{5.6} \\ y =7^{2.3}\end{cases}$

    ∴$log_{7}$（$x^{2}$＋y）＝$log_{7}$（（$7^{5.6}$）$^{2}$＋$7^{2.3}$）＝$log_{7}$（$7^{11.2}$＋$7^{2.3}$）≈ $log_{7}7^{11.2}$＝11.2

    故選(B)'
