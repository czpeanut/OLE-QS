- id: doc_109_台中_台中二中_數學_數A_g11s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設 a 為實數，下列有關二元一次聯立方程式$\begin{cases}3x + ( 4 - a ) y = 8 - a \\ ( 4 - a ) x + 3y = 6 + a\end{cases}$的敘述，哪些是正確的？
  options:
  - label: A
    content: 不論 a 為何值，此聯立方程式必有解
  - label: B
    content: 若此聯立方程式有無限多解，則 a＝1
  - label: C
    content: 若此聯立方程式有唯一解，此解可表示為（x，y）＝$\left( - \frac{a}{a - 7} , \frac{a - 14}{a - 7} \right)$
  - label: D
    content: 當 a＝6 時，此聯立方程式有唯一解（x，y）＝（－6，8）
  - label: E
    content: 當 a＝7 時，此聯立方程式在坐標平面上的圖形為兩平行直線
  explanation: '由克拉瑪公式知

    Δ＝$\left| \begin{matrix}3 & 4 - a \\ 4 - a & 3\end{matrix} \right|$＝9－（4－a）$^{2}$＝－$a^{2}$＋8a－7＝－（a－7）（a－1）

    Δ$_{x}$＝$\left| \begin{matrix}8 - a & 4 - a \\ 6 + a & 3\end{matrix} \right|$＝3（8－a）－（6＋a）（4－a）＝$a^{2}$－a＝a（a－1）

    Δ$_{y}$＝$\left| \begin{matrix}3 & 8 - a \\ 4 - a & 6 + a\end{matrix} \right|$＝3（6＋a）－（4－a）（8－a）＝－$a^{2}$＋15a－14＝－（a－1）（a－14）

    當Δ≠0，即 a≠7 且 a≠1 時，此聯立方程式有唯一解$\left( - \frac{a}{a - 7} , \frac{a - 14}{a - 7} \right)$

    當Δ＝Δ$_{x}$＝Δ$_{y}$＝0，即 a＝1 時，此聯立方程式有無限多解

    當Δ＝0，但Δ$_{x}$，Δ$_{y}$ 不全為 0，即 a＝7 時，此聯立方程式無解

    (A)╳：由上述得知，a＝7 時無解

    (B)○；(C)○

    (D)╳：∵a＝6≠1 且 a≠7 ∴有唯一解$\left( - \frac{6}{6 - 7} , \frac{6 - 14}{6 - 7} \right)$＝（6，8）

    (E)○：a＝7 時無解，故圖形為兩平行直線

    故選(B)(C)(E)'
