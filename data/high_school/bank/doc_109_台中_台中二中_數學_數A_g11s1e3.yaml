  stem: 若$| \vec{a} | = | \vec{b} | = 2$，且$| 3\vec{a} - \vec{b} | = 5$，則$| \vec{a} + t\vec{b} |$的最小值為＿＿＿＿。
  explanation: '因$| 3\vec{a} - \vec{b} | = 5$，且$| \vec{a} | = | \vec{b} | = 2$

    可得$| 3\vec{a} - \vec{b} | ^{2} = 25$

    $\Rightarrow9 | \vec{a} | ^{2} - 6\vec{a} \cdot \vec{b} + | \vec{b} | ^{2} = 25$

    $\Rightarrow9\times 4- 6\vec{a} \cdot \vec{b} + 4= 25\Rightarrow\vec{a} \cdot \vec{b} = \frac{5}{2}$

    因此$| \vec{a} + t\vec{b} | ^{2}$＝$| \vec{a} | ^{2} + 2t\vec{a} \cdot \vec{b} + t^{2} | \vec{b} | ^{2}$

    ＝4＋2t×$\frac{5}{2}$＋$4t^{2}$

    ＝$4 \left[ t^{2} + \frac{5}{4}t + \left( \frac{5}{8} \right) ^{2} \right] + 4 - \frac{25}{16}$

    ＝$4 \left( t + \frac{5}{8} \right) ^{2} + \frac{39}{16}$

    故當$t = - \frac{5}{8}$時，$| \vec{a} + t\vec{b} |$的最小值為$\sqrt{\frac{39}{16}} = \frac{\sqrt{39}}{4}$'
