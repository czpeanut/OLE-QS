- id: doc_109_高雄_三民_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: '設 a，b，c，d 都是實數。請問下列哪些敘述是正確的？【複選題】

    $■答$：＿＿＿＿。'
  options:
  - label: A
    content: 若$\frac{b}{a}> 1$，則 b＞a
  - label: B
    content: $\sqrt{a^{2}} =a$
  - label: C
    content: $\frac{a +b}{2}\geq \sqrt{ab}$
  - label: D
    content: 若 a 是有理數，b 是無理數，則$\frac{a}{b}$有可能是有理數
  - label: E
    content: 若$\frac{b}{a}>\frac{d}{c}$且 ac＜0，則 bc＜ad
  explanation: '(A)╳：$\frac{b}{a}> 1\Rightarrow\begin{cases}b >a , a > 0 \\ b <a , a < 0\end{cases}$，故不成立

    (B)╳：$\sqrt{a^{2}}$＝｜a｜＝$\begin{cases}a , a > 0 \\ -a , a < 0\end{cases}$，故不成立

    (C)╳：當 a、b 為非負實數時，$\frac{a +b}{2}\geq \sqrt{ab}$才能成立

    (D)○：當 a＝0 時，又 b 為無理數，故 b 不為 0，則$\frac{a}{b}$＝0 為有理數

    (E)○：$\frac{b}{a}>\frac{d}{c}$且 ac＜0$\Rightarrow\frac{b}{a}\times ac <\frac{d}{c}\times ac\Rightarrow$bc＜ad

    故選(D)(E)'
  tags:
    unit:
      code: MA-1-1-1
