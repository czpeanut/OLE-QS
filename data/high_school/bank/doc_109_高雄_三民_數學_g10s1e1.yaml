  page: 1
  stem: 小於$\sqrt{8+\sqrt{55}} -\sqrt{8-\sqrt{55}}$的正整數共有＿＿＿＿個。
  explanation: '$(\sqrt{8+\sqrt{55}} -\sqrt{8-\sqrt{55}} )^{2}$

    ＝$(\sqrt{8+\sqrt{55}} )^{2}-2 (\sqrt{8+\sqrt{55}} \sqrt{8-\sqrt{55}} )+(\sqrt{8-\sqrt{55}} )^{2}$

    ＝$8+\sqrt{55} -2 (\sqrt{8^{2}-(\sqrt{55} )^{2}} )+8-\sqrt{55}$

    ＝16－2×3＝10

    $\Rightarrow\sqrt{8+\sqrt{55}} -\sqrt{8-\sqrt{55}} =\sqrt{10}\approx$3.16

    ∴比$\sqrt{8+\sqrt{55}} -\sqrt{8-\sqrt{55}}$小的正整數共有 3 個'
