- id: doc_110_台中_興大附中_數學_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知新冠肺炎病毒直徑大約是 120 nm（奈米），而 1 奈米等於 $10^{－7}$ 公分。頭髮的直徑為 5×$10^{－3}$ 公分，請問頭髮的直徑為新冠肺炎病毒的直徑的多少倍？請選出最接近的選項。
  options:
  - label: A
    content: '200'
  - label: B
    content: '400'
  - label: C
    content: '600'
  - label: D
    content: '800'
  - label: E
    content: '1000'
  explanation: '$\frac{5\times 10^{-3}}{120\times 10^{-7}}$＝$\frac{5}{1.2}\times 10^{2}$＝$4. 1\overline{6}\times 10^{2}$，最接近 400

    故選(B)'
- id: doc_110_台中_興大附中_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設 a 是無理數$5 +\sqrt{32}$的小數部分，則下列哪一個選項是$\sqrt{2}$的小數部分？
  options:
  - label: A
    content: a
  - label: B
    content: 4a－3
  - label: C
    content: $\frac{a - 5}{4}$
  - label: D
    content: $\frac{a}{4}$
  - label: E
    content: $\frac{a + 1}{4}$
  explanation: '$5 +\sqrt{32}$＝$5 + 4\sqrt{2}\approx$5＋4×1.414＝10.656，整數部分為 10

    故 a＝$5 + 4\sqrt{2} - 10$＝$4\sqrt{2} - 5$

    整理上式得$\sqrt{2}$＝$\frac{a + 5}{4}$

    又$\sqrt{2}$之整數部分為 1 ⇒$\sqrt{2}$的小數部分為$\sqrt{2} - 1$＝$\frac{a + 5}{4}- 1$＝$\frac{a + 1}{4}$

    故選(E)'
- id: doc_110_台中_興大附中_數學_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 設 a、b 為實數，若∣ax＋4∣≤ b 之解為－5 ≤ x ≤ 9，則 a＋b 之值為下列何者？
  options:
  - label: A
    content: －4
  - label: B
    content: '0'
  - label: C
    content: '4'
  - label: D
    content: '8'
  - label: E
    content: '12'
  explanation: '－5 ≤ x ≤ 9 ⇒－7 ≤ x－2 ≤ 7 ⇒∣x－2∣≤ 7

    同乘以∣－2∣⇒∣－2∣∣x－2∣≤∣－2∣×7 ⇒∣－2x＋4∣≤ 14

    得 a＝－2，b＝14 ⇒ a＋b＝12

    故選(E)'
- id: doc_110_台中_興大附中_數學_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 設 x 為正實數，且 $x^{2}$－3x－1＝0，則 $x^{3}$＋$x^{2}$＋$x^{－2}$－$x^{－3}$ 之值為下列何者？
  options:
  - label: A
    content: '39'
  - label: B
    content: '43'
  - label: C
    content: '47'
  - label: D
    content: '51'
  - label: E
    content: '55'
  explanation: '∵x≠0

    ∴$x^{2}$－3x－1＝0 ⇒$x - 3 -\frac{1}{x}$＝0，得 x－$x^{－1}$＝3

    ⇒（x－$x^{－1}$）$^{2}$＝9 ⇒ $x^{2}$＋$x^{－2}$＝11

    又 $x^{3}$－$x^{－3}$＝（x－$x^{－1}$）（$x^{2}$＋1＋$x^{－2}$）＝3×（11＋1）＝36

    所求為 11＋36＝47

    故選(C)'
