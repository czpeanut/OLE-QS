  stem: 化簡$\frac{(\sqrt{8})^{-2}}{(\sqrt{16})^{3}}\times \frac{(\sqrt{2})^{2}}{(-\sqrt{32})^{-4}}$＝＿＿＿＿。
  explanation: '$\frac{(\sqrt{8})^{-2}}{(\sqrt{16})^{3}}\times \frac{(\sqrt{2} )^{2}}{(-\sqrt{32})^{-4}}$＝$\frac{\left( (2^{3})^{\frac{1}{2}} \right) ^{-2}}{(2^{2})^{3}}\times \frac{2}{\left( - (2^{5})^{\frac{1}{2}} \right) ^{-4}}$＝$\frac{2^{-3}}{2^{6}}\times \frac{2}{(-1)^{-4}\times 2^{-10}}$

    ＝$2^{－3＋1－6－（－10）}$×$\frac{1}{(-1)^{4}}$＝$2^{2}$＝4'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 設 $a^{2x}$＝4，求$\frac{a^{x}-a^{-x}}{a^{3x}+a^{-5x}}$＝＿＿＿＿。
  explanation: '∵$a^{2x}$＝4 ∴$a^{－2x}$＝$\frac{1}{4}$，$a^{4x}$＝$4^{2}$＝16，$a^{－4x}$＝$\frac{1}{16}$

    得$\frac{a^{x}-a^{-x}}{a^{3x}+a^{-5x}}$＝$\frac{a^{x}-a^{-x}}{a^{3x}+a^{-5x}}\times \frac{a^{x}}{a^{x}}$＝$\frac{a^{2x}- 1}{a^{4x}+a^{-4x}}$ ＝$\frac{4 - 1}{16 +\frac{1}{16}}$＝$\frac{48}{257}$'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 設 a＝$\frac{\sqrt{5} + 1}{\sqrt{5} - 1}$，b＝$\frac{\sqrt{5} - 1}{\sqrt{5} + 1}$，試求 $a^{3}$＋$b^{3}$ 之值為＿＿＿＿。
  explanation: 'a＋b＝$\frac{\sqrt{5} + 1}{\sqrt{5} - 1}+\frac{\sqrt{5} - 1}{\sqrt{5} + 1}$＝$\frac{(\sqrt{5} + 1)^{2}+ (\sqrt{5} - 1)^{2}}{(\sqrt{5} - 1) (\sqrt{5} + 1)}$＝$\frac{6 + 2\sqrt{5} + 6 - 2\sqrt{5}}{4}$＝3

    ab＝$\frac{\sqrt{5} + 1}{\sqrt{5} - 1}\times \frac{\sqrt{5} - 1}{\sqrt{5} + 1}$＝1

    $a^{2}$＋$b^{2}$＝（a＋b）$^{2}$－2ab＝$3^{2}$－2×1＝7

    故 $a^{3}$＋$b^{3}$＝（a＋b）（$a^{2}$－ab＋$b^{2}$）＝3×（7－1）＝18'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_4
  section: 3
  number: 4
  type: fill
  page: 2
  stem: 已知 x＝log（1.9），求 $10^{x＋1}$＋3×$10^{－x－1}$＝＿＿＿＿。
  explanation: 'x＝log1.9 ⇒ $10^{x}$＝1.9

    故 $10^{x＋1}$＋3×$10^{－x－1}$＝10×$10^{x}$＋3×$10^{－x}$×$10^{－1}$

    ＝$10\times 1.9 + 3\times \frac{1}{1.9}\times \frac{1}{10}$＝$19 +\frac{3}{19}$＝$\frac{364}{19}$'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_5
  section: 3
  number: 5
  type: fill
  page: 2
  stem: 放射性物質的半衰期 T 定義為每經過時間 T，該物質質量會衰退成原來的一半。今有甲、乙兩種物質，開始記錄時甲物質的質量是乙物質質量的兩倍，而已知甲的半衰期為 15 小時，且經過 60 小時後，甲物質質量是乙物質質量的 8 倍。試求乙物質的半衰期是＿＿＿＿小時。
  explanation: '設開始時乙物質質量為 M，半衰期為 T

    且開始時甲物質質量為 2M

    得$2M\times \left( \frac{1}{2} \right) ^{\frac{60}{15}}$＝$8\times M\times \left( \frac{1}{2} \right) ^{\frac{60}{T}}$

    ⇒$2\times \left( \frac{1}{2} \right) ^{4}$＝$2^{3}\times \left( \frac{1}{2} \right) ^{\frac{60}{T}}$⇒$\left( \frac{1}{2} \right) ^{6}$＝$\left( \frac{1}{2} \right) ^{\frac{60}{T}}$

    ⇒ 6＝$\frac{60}{T}$⇒ T＝10

    故乙物質的半衰期是 10 小時'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_6
  section: 3
  number: 6
  type: fill
  page: 3
  stem: 設 x、y 為整數，且滿足$x + y\sqrt{11 - 6\sqrt{2}}$＝$x\sqrt{18 + 8\sqrt{2}} + 6$，則數對（x，y）＝＿＿＿＿。
  explanation: '$x +y\sqrt{11 - 6\sqrt{2}}$＝$x\sqrt{18 + 8\sqrt{2}} + 6$

    ⇒$x +y\sqrt{11 - 2\sqrt{18}}$＝$x\sqrt{18 + 2\sqrt{32}} + 6$

    ⇒ x＋y（3－$\sqrt{2}$）＝x（4＋$\sqrt{2}$）＋6

    ⇒ x＋3y＋（－y）$\sqrt{2}$＝（4x＋6）＋$x\sqrt{2}$

    ∵x、y 為整數

    ∴$\begin{cases}x + 3y = 4x + 6 \\ -y = x\end{cases}$

    得數對（x，y）＝（－1，1）'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_7
  section: 3
  number: 7
  type: fill
  page: 3
  stem: x＞－3，求$\frac{x^{2}+ 3x + 1}{x + 3}$的最小值為＿＿＿＿。
  explanation: '$\frac{x^{2}+ 3x + 1}{x + 3}$＝$\frac{x^{2}+ 3x}{x + 3}+\frac{1}{x + 3}$＝$x +\frac{1}{x + 3}$＝$(x + 3) +\frac{1}{x + 3}- 3$

    ∵x＞－3 ⇒ x＋3＞0

    ∴由算幾不等式得知，$(x + 3) +\frac{1}{x + 3}$≥ $2\sqrt{(x + 3)\times \frac{1}{x + 3}}$＝2

    故$\frac{x^{2}+ 3x + 1}{x + 3}$的最小值為 2－3＝－1'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_8
  section: 3
  number: 8
  type: fill
  page: 3
  stem: 將（2＋1）（$2^{2}$＋1）（$2^{4}$＋1）（$2^{8}$＋1）（$2^{16}$＋1）（$2^{32}$＋1）全部乘開後為＿＿＿＿位數字。
  explanation: '（2＋1）（$2^{2}$＋1）（$2^{4}$＋1）（$2^{8}$＋1）（$2^{16}$＋1）（$2^{32}$＋1）

    ＝（2－1）（2＋1）（$2^{2}$＋1）（$2^{4}$＋1）（$2^{8}$＋1）（$2^{16}$＋1）（$2^{32}$＋1）

    ＝（$2^{2}$－1）（$2^{2}$＋1）（$2^{4}$＋1）（$2^{8}$＋1）（$2^{16}$＋1）（$2^{32}$＋1）

    ＝……＝$2^{64}$－1

    ∵$2^{64}$ 的個位數為 6 ∴$2^{64}$－1 和 $2^{64}$ 位數相同

    又 $2^{64}\approx$（$10^{0.3010}$）$^{64}$＝$10^{19.264}$＝$10^{0.264}$×$10^{19}$

    得 $2^{64}$ 為 20 位數，故原式亦為 20 位數'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_9
  section: 3
  number: 9
  type: fill
  page: 3
  stem: 化簡$\frac{6^{\frac{1}{6}}}{6^{\frac{1}{6}}+\sqrt{6}}+\frac{6^{\frac{2}{6}}}{6^{\frac{2}{6}}+\sqrt{6}}+\frac{6^{\frac{3}{6}}}{6^{\frac{3}{6}}+\sqrt{6}}+\frac{6^{\frac{4}{6}}}{6^{\frac{4}{6}}+\sqrt{6}}+\frac{6^{\frac{5}{6}}}{6^{\frac{5}{6}}+\sqrt{6}}$＝＿＿＿＿。
  explanation: '$\frac{6^{\frac{1}{6}}}{6^{\frac{1}{6}}+\sqrt{6}}$＝$\frac{6^{\frac{1}{6}}}{6^{\frac{1}{6}}+6^{\frac{3}{6}}}\times \frac{6^{\frac{2}{6}}}{6^{\frac{2}{6}}}$＝$\frac{6^{\frac{3}{6}}}{6^{\frac{3}{6}}+6^{\frac{5}{6}}}$＝$\frac{\sqrt{6}}{\sqrt{6} + 6^{\frac{5}{6}}}$

    得$\frac{6^{\frac{1}{6}}}{6^{\frac{1}{6}}+\sqrt{6}}+\frac{6^{\frac{5}{6}}}{6^{\frac{5}{6}}+\sqrt{6}}$＝$\frac{\sqrt{6}}{6^{\frac{5}{6}}+\sqrt{6}}+\frac{6^{\frac{5}{6}}}{6^{\frac{5}{6}}+\sqrt{6}}$＝1

    同理，$\frac{6^{\frac{2}{6}}}{6^{\frac{2}{6}}+\sqrt{6}}+\frac{6^{\frac{4}{6}}}{6^{\frac{4}{6}}+\sqrt{6}}$＝1，又$\frac{6^{\frac{3}{6}}}{6^{\frac{3}{6}}+\sqrt{6}}$＝$\frac{\sqrt{6}}{2\sqrt{6}}$＝$\frac{1}{2}$

    故原式化簡得 1＋1＋$\frac{1}{2}$＝$\frac{5}{2}$'
- id: doc_110_台中_興大附中_數學_g10s1e1_s3_10
  section: 3
  number: 10
  type: fill
  page: 3
  stem: 某種傳染病的感染率定義為：感染率 I（t）＝$\frac{1}{1 + a\times 7^{-bt}}$，其中 t 表時間（週），a，b 為常數。若此種傳染病在某城市蔓延，已知剛開始（即 t＝0）時，有 2 ％的人口被傳染；而經過 3 週後（即 t＝3）有 12. 5％的人口被傳染。則＿＿＿＿週後，該城市的人口被傳染過該傳染病的比例達 87.5 ％。
  explanation: 'I(0)＝$\frac{1}{1 + a}$＝$\frac{2}{100}$⇒ a＝49 ⇒ I（t）＝$\frac{1}{1 + 49\times 7^{-bt}}$

    又 I(3)＝$\frac{1}{1 + 49\times 7^{-3b}}$＝$\frac{12.5}{100}$＝$\frac{1}{8}$⇒ 49×$7^{－3b}$＝7 ⇒－3b＋2＝1 ⇒ b＝$\frac{1}{3}$

    解$\frac{1}{1 + 49\times 7^{-\frac{1}{3}t}}$＝87.5 ％＝$\frac{7}{8}$⇒ 8＝$7 + 343\times 7^{-\frac{1}{3}t}$⇒ $7^{－3}$＝$7^{-\frac{1}{3}t}$

    故 t＝9

    即 9 週後，該城市的人口被傳染過該傳染病的比例達 87.5 ％'
