- id: doc_110_台中_興大附中_數學_g10s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 數線上有 A、B、P 三點，坐標分別是 a、b、x，已知 a＜b，且 3∣x－a∣＝4∣x－b∣，試選出正確的選項。
  options:
  - label: A
    content: P 在$\overline{AB}$之間
  - label: B
    content: $\overline{PA}$：$\overline{PB}$＝4：3
  - label: C
    content: 5 ∣x－a∣＝∣a－b∣
  - label: D
    content: x＞$\frac{a + b}{2}$
  - label: E
    content: x＝$\frac{4a + 3b}{7}$
  explanation: '3 ∣x－a∣＝4 ∣x－b∣⇒∣x－a∣：∣x－b∣＝4：3 ⇒$\overline{PA}$：$\overline{PB}$＝4：3

    ① 若 P 在$\overline{AB}$之間⇒ x＝$\frac{3a + 4b}{7}$；

    ② 若 P 在$\overline{AB}$外⇒ x＝4b－3a

    (A)╳：不一定

    (B)○

    (C)╳：若 P 在$\overline{AB}$之間⇒$\overline{PA}$：$\overline{AB}$＝4：7 ⇒ 7 ∣x－a∣＝4 ∣a－b∣

    (D)○：①$\frac{3a + 4b}{7}-\frac{a + b}{2}$＝$\frac{b - a}{14}$＞0；

    ②$4b - 3a -\frac{a + b}{2}$＝$\frac{7b - 7a}{2}$＝$\frac{7}{2}(b - a)$＞0

    (E)╳：x 可能為 4b－3a 或$\frac{3a + 4b}{7}$

    故選(B)(D)'
