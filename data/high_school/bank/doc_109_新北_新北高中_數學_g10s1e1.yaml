  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 天文學中常用的天文單位（縮寫符號為 AU），是指地球到太陽的平均距離，約為 1.496 億公里。若已知月亮距離地球約為 3.84×$10^{5}$ 公里，且光速約為 3.0×$10^{8}$ 公尺／秒，則下列哪些選項是正確的？
  options:
  - label: A
    content: 1 天文單位＝1.5×$10^{8}$ 公里（取 2 位有效數字並以科學記號表示）
  - label: B
    content: 1 天文單位＝1.496×$10^{8}$ 公里（取 3 位有效數字並以科學記號表示）
  - label: C
    content: 太陽光從太陽到地球的時間約為 8 分鐘（四捨五入取整數）
  - label: D
    content: 月球到地球的距離小於 0.004 AU
  - label: E
    content: 理論上，若太空船以光速前進，則從地球到達月球的時間不用 2 秒
  explanation: '(A)○：1 天文單位$\approx$1.496×$10^{8}$ 公里$\approx$1.5×$10^{8}$ 公里

    (B)╳：1 天文單位$\approx$1.496×$10^{8}$ 公里$\approx$1.50×$10^{8}$ 公里

    (C)○：$\frac{1.496\times 10^{8} (公里)}{3.0\times 10^{8} (公尺/秒)}$＝498.6……秒＝8.31……分$\approx$8 分鐘

    (D)○：$\frac{3.84\times 10^{5}}{1.496\times 10^{8}}$＝0.0025……（AU）＜0.004（AU）

    (E)○：$\frac{3.84\times 10^{5} (公里)}{3.0\times 10^{8} (公尺/秒)}$＝1.28（秒）＜2（秒）

    故選(A)(C)(D)(E)'
