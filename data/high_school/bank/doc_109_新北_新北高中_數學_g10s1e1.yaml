  stem: '「萊克多巴胺」為乙型受體素類（在畜牧界俗稱為瘦肉精）之動物飼料添加物，以增加牛、豬體重及改善飼料效率，提高瘦肉比率。衛福部於 101 年修正「動物用藥殘留標準」，將牛肌肉之萊克多巴胺最大殘留容許量（MRL）訂為 0.01 ppm，其他肉品則未訂定，即不得檢出。

    依據世界衛生組織聯合食品添加物專家委員會（JECFA, 2004）的報告指出萊克多巴胺於動物體中可迅速經由尿液或排泄物代謝，在人類血漿中之半衰期約 4 小時。

    資料來源—食藥署「108 食用肉品暴露萊克多巴胺之健康風險評估報告」

    請依上文中的資訊回答下列問題：

    (1) 所謂的 ppm 即百萬分率（Parts Per Million），定義為 100 萬分之 1。依照標準所示，每公斤的牛肌肉檢驗出萊克多巴胺最大殘留容許量為多少微克（$10^{－6}$ 克）？（不考慮精準度是否四捨五入）（單選）

    (2) 血漿「半衰期」指的是藥物在生物體內濃度下降一半所需要的時間。當殘留的藥物濃度為原來的$\frac{1}{64}$時，可認定為代謝完成。試問一般人食用含萊克多巴胺的豬肉需多少小時可代謝完成？'
  options:
