  stem: 行政院資通安全處處長簡宏偉表示，<u>我國防疫電子圍籬的定位沒有透過GPS，是採用基地台訊號，也看不到訊息內容</u>。請依據上文及我國規範判斷下列何者<u>錯誤</u>？
