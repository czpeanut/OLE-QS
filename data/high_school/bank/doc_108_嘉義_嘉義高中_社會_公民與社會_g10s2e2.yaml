  - label: A
    content: 有權利，根據我國「刑法」規定，未滿十八歲的犯罪嫌疑人受到「兒童與少年保護法」的特別保護，故比成年人可能受到更大的基本權利的保障
  - label: B
    content: 有權利，因為是憲法所賦予的基本權利，我國國民一體適用。如果是為了教育的必要而有所限制，仍然要符合憲法比例原則的要求
  - label: C
    content: 沒有權利，因為青少年仍然依賴法定監護人的保護，法定監護人享有對青少年進行管束、教誨的最高權力，故而可以對其基本權利進行任意限縮
  - label: D
    content: 沒有權利，因為學校對在學的青少年學生有保護與教育的責任，為了能對於青少年發揮教育的功能，學校可以單方面訂立規範，限制學生的行為
