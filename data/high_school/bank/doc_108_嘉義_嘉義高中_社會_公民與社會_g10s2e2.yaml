  stem: 立法院司法及法制委員會2020/4/9邀請司法院、法務部、衛福部及行政院資通安全處等機關代表，就「政府以資訊國安為由採用電子監控系統並追蹤手機，是否侵犯自由人權與侵害隱私？應如何確立合理明確的法律界限？」進行報告並備詢。衛福部次長薛瑞元表示，確實通知書內容未更新，並未通知居家檢疫或隔離者的手機會被定位，會儘速修正。請問下列敘述何者正確？
  options:
  - label: A
    content: 為防疫需求監控手機定位，以保障人權而言不一定要告知被監控人
  - label: B
    content: 限制受隔離或檢疫者的自由權及隱私權，合憲要件須符合平等原則
  - label: C
    content: 「明確的法律界限」是指欲達成目的採取的手段不可逾越必要程度
  - label: D
    content: 衛福部修正通知書上載明手機會被政府定位是為符合公開正當程序
  group_stem: 節錄（數位疾病監控的倫理與規範） 《科學》學術期刊2020/5/11 作者：史丹佛大學 王智弘；蜜雪兒‧梅洛 反思一：運用數據是否侵犯隱私權？ 雖然比起商業調查或學術研究，大部分流行病學對於新資料來源的運用，並沒有牽涉到個人隱私，但利用手機定位和簡訊資料，仍超乎許多民主國家人民過去所習慣的隱私權。 王智弘和梅洛建議，在使用AI技術和演算法來預測疫情、進行風險分級時，應使用非辨識性的個資，降低疑慮。即使用到具辨識度的個資進行演算，例如支付寶的健康辨識系統，也要有申訴機制，同時為風險分級設定時效，提供民眾多一層保障。 反思二：使用個資前是否取得同意？ 使用個資前，先取得人民的同意，是尊重個人自主性的展現。政府想透過手機紀錄追蹤接觸者，有三種徵求同意的選項，包括自願加入、預設默許，或是強制，而不同國家做了不同的選擇。 到底政府該採用哪一種徵求同意的選項？王智弘和梅洛發現，有證明顯示「預設默許」是限制性較低的方案。 …雖然在政府信任度低的國家，手機追蹤App窒礙難行，但王智弘和梅格建議政府在「強制」之前，可先進行「預設默許」選項，並讓官員對大眾進行簡單易懂的說明。「而且，手機追蹤須有退出機制，一旦疫情趨緩，就要中止個資的使用。」
