- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 臺灣各地的廟宇不僅是重要的文化資產，也是認識歷史發展的絕佳素材，可以藉此看出一地的人群發展以及生活樣態。下列是出自幾處台灣著名廟宇的對聯： 甲：（左聯
    望重朝庭進士勤王扶社稷 右聯 功垂邦國代天巡狩護舟神） 乙：（左聯 開閩建德威靈顯聖 右聯 漳郡功成傳仁稱王） 丙：（左聯 神眾費婆心寰海群生蒙后德 右聯
    我曾抱佛腳瓣相此日答洪恩） 丁：（左聯 本是負耒荷鋤已得嘉名榮一字 右聯 即此忠肝義膽方能血食耀春秋） 清代台灣開發史上，有所謂「三年一小反，五年一大亂」，這當中三大民變往往讓統治當局苦惱不已，因而看準漢人族群的内部差異，利用族群間的矛盾進行分化，例如以閩人制粵人、以泉人制漳人。請問上列哪一廟宇的對聯最能顯現國家與地方人民之間的協力關係？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
