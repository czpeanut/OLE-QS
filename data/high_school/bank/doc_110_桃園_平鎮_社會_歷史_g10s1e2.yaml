- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_1
  section: 1
  number: 1
  type: calc
  page: 1
  stem: 1920年代，臺灣出現許多社會運動團體，分合不一，有聯合亦有競爭，也各有不同的訴求與目標，啟蒙大眾之餘，對殖民政府進行各種理性的抗爭，如臺灣文化協會、臺灣民眾黨、臺灣農民組合等。但1930年代多數社運團體均沉寂下來，主要原因最可能是：
    (A)日臺的差別待遇逐漸改善，社運團體無新的訴求 (A)經濟好轉人民生活改善，對社會和政治較不關心 (C)地方自治實施臺人獲參政權，社運團體訴求達成 (D)日本軍國主義抬頭，當局大舉整肅禁止相關活動
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 小明所使用的資料如下：「惟是臺灣疆土，荷鄭大清經營締造二百餘年，今須自立為國，感念列聖舊恩，仍應恭奉正朔，遙作屏藩，氣脈相通，無異中土，照常嚴備，不可稍涉疏虞。」請間小明所研究的歷史研究主題應是什麼？
  options:
  - label: A
    content: 臺灣民主國的起滅
  - label: B
    content: 劉銘傳來臺的起因
  - label: C
    content: 沈葆楨在臺灣的建設
  - label: D
    content: 施琅攻臺
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 圖(一）、圖(二)分別是臺灣兩個時期的部分行政區點陣圖，請問由圖(一)到圖(二)的變遷，反映出臺灣的歷史進入了什麼新階段？
