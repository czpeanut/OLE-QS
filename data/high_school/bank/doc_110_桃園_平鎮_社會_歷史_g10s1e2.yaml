- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 日本統治時期，臺灣總督府解散臺灣某一結社，依據的理由是：「這種以民族運動為中心，附帶採行階级鬥爭的政治結社，若當局再予寬容，將違反我臺灣統治的根本方針，並有妨礙内臺融和，甚至嚴重影響到維持本島統治之虞。」從理由内容來看，這最可能是解散下列哪個團體？
  options:
  - label: A
    content: 臺灣民眾黨
  - label: B
    content: 臺灣文化協會
  - label: C
    content: 臺灣農民組合
  - label: D
    content: 臺灣地方自治聯盟
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 戶籍是官府管理社會的重要憑藉。某個時期的戶籍制度普及至每一個人，而戶籍資料裡除了姓名、年齡、居住或遷移等纪錄外，也紀錄著與本人有關的各項記事，諸如「本籍與族稱、屬於哪個保甲、是否吸食鴉片」。這份戶籍資料最可能出現在何時何地？
  options:
  - label: A
    content: 1830，臺南
  - label: B
    content: 1860，臺南
  - label: C
    content: 1910，臺南
  - label: D
    content: 1950，臺南
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 1949年10月，共軍集中船隻對金門發動攻擊，遭守軍擊退。1950年3月，共軍又集结大批兵力，用類似「萬船齊發戰術」進攻海南島，迫使當地國軍撒守；5月底更攻佔廣東萬山群島。共軍原本預定隨後再度對金門發動攻擊，但没多久就取消這項計畫。最可能的原因是：
  options:
  - label: A
    content: 共軍軍備及船隻有限，己經無法再負擔長期作戰
  - label: B
    content: 共軍顧忌金門兵力強大，寧可保持戰果故而避戰
  - label: C
    content: 韓戰爆發，美國宣布派遣第七艦隊協助臺灣防務
  - label: D
    content: 台灣實施戒嚴，共軍乃轉以心戰策略來瓦解國軍
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 學者將日治台灣時期的社會運動分為三類：第一類運動基本上是「體制內改革」，該運動肯定日本在台的統治，與日本當局的關係較為緩和。第二類運動站在台灣人的民族立場，積極教育台灣人，喚起台灣人的民族自覺，與日本當局的關係較第一類緊張。第三類運動站在中下階層的立場，與日本資本家及本土買辦階级門爭，抗爭性最為強力。下列選項何者可依序作為這三類運動的代表？
  options:
  - label: A
    content: 台灣文化協會、新文協、台灣農民組合
  - label: B
    content: 台灣民眾黨、新文協、台灣工友總聯盟
  - label: C
    content: 台灣地方自治聯盟、台灣文化協會、台灣共產黨
  - label: D
    content: 台灣文化協會、台灣地方自治聯盟、台灣農民組合
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 一部小說中有以下一段情節：「太明開始對教育有了懷疑了。最少是對教有方法有所懷疑。想起來有很多不能了解的。比如小學校不用體罰，也能提高教育的效果：為什麼公學校不能那樣？小學校按照學則辦理，為什麼公學校把重點放在農業教育？」請問：這部小說所說的是什麼時代、什麼地方的事？
  options:
  - label: A
    content: 滿清時代，福建
  - label: B
    content: 日治時代，臺灣
  - label: C
    content: 1945年以後，臺灣
  - label: D
    content: 二十世紀初，香港
