  section: 1
  number: 19
  type: single
  page: 2
  stem: 明娟在某資料中看到「10月24日，在今天臺中公園北門樓舉行基隆、打狗間縱貫鐵路開通儀式……通車這一天，早晨7點整貴賓專車由臺北驛開出，於中午12點5分抵達。」請間：這應該發生在何時？
  options:
  - label: A
    content: 1893年
  - label: B
    content: 1908年
  - label: C
    content: 1943年
  - label: D
    content: 1971年
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 某位詩人感嘆：「奴隸生涯抱恨多，横暴蠻威奈若何」，希望同胞不要做「賤民」，想號召「六百萬民齊崛起，誓將熱血為義死」，以期「同心來復舊山河」。這位詩人感嘆的背景為何？
  options:
  - label: A
    content: 荷蘭統治臺灣時期，漢人對荷蘭苛政不滿
  - label: B
    content: 鄭成功欲將臺灣作為「反清復明」的基地
  - label: C
    content: 康熙時因政府高壓手段而引發朱一貴事件
  - label: D
    content: 日本治臺時期，臺人不滿日本的差別待遇
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 日本统治時期某一抗爭活動，日本當局認為此抗爭不僅是政治運動，實含有民族運動的成分。但當時的左派人士卻批評此抗爭是脫離群眾，只是士紳階級的政治運動，歷史學者指出此抗爭的意涵具有自治理想，且深層底蘊隱含民族運動的終極目標。此抗爭活動應是：
  options:
  - label: A
    content: 西來庵事件
  - label: B
    content: 二林蔗農事件
