  section: 1
  number: 10
  type: single
  page: 1
  stem: 有位人士回億：「國際局勢逆轉，我們擔憂國家前途，因此我們辦雜誌、集結黨外力量，壯大聲勢，期望藉由選舉，跟執政者要求自由、民主、人權，雖然最後我們失敗被逮捕，但經由公開審判，國際及臺灣社會更了解臺灣的困境，加速日後臺灣的政治民主化。」這段回憶所指為何？
  options:
  - label: A
    content: 二二八事件
  - label: B
    content: 保釣運動
  - label: C
    content: 退出聯合國
  - label: D
    content: 美麗島事件
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某—時期，有人指出：「台灣物產豐富，有硫磺、蔗糖、鹿皮，原來缺少布帛，現也不虞匱乏」，建議政府善加防守。只要將内地的部分軍隊移防台灣，便可確保台灣及澎湖兩地，以確保東南數省之安全。這種想法的背景是：
  options:
  - label: A
    content: 鄭成功被清軍打敗，轉移到台灣的構想
  - label: B
    content: 施琅攻下台灣之後強化台灣防務的建議
  - label: C
    content: 劉銘傳於台灣建省之後有關軍備的設計
  - label: D
    content: 甲午戰爭後日軍希望在台灣殖民的想法
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 資料一：「海涅哟 / 在台灣的舊街鎮裡 / 有一位想念你的 / 可憐的詩人 / 那位詩人 / 是無名的詩人 / 在光復的陰翳下哭泣的 / 不歌唱的詩人」─龍瑛宗〈海涅喲〉
    資料二：「一個轉換國籍與語言的作家，彷彿死了一次，……。在殖民地轉換國籍與語言，因為是『被動的他者』，這樣的作家被強迫改造成另一種人，會經歷一段相當長、類似死亡的黑暗時期，有些人熬過去就能重生，熬不過去只能成為前朝『遺民』，那是另一種死亡。」─周芬伶，《龍瑛宗傳》
    根據上述資料判斷，作家龍瑛宗面臨的處境是什歷？
  options:
  - label: A
    content: 1930年代文壇提倡台灣話文運動
  - label: B
    content: 日本殖民統治時期的皇民化運動
  - label: C
    content: 行政長官公署強力推動國語教育
  - label: D
    content: 1990年代政府推行鄉土母語教育
