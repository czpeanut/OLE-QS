  stem: 有關日本統治臺灣的統治政策與方針，下列敘述哪些正確？
  options:
  - label: A
    content: 日本統治臺灣，雖將君主立憲體制帶入臺灣，但本質上仍是殖民統治，日本國會授予總督行政權之外的立法權
  - label: B
    content: 統治之初，除以武力鎮壓各地反抗外，亦採漸進原則，沿用舊慣、籠絡臺人，消弭反抗
  - label: C
    content: 一次大戰後，由於民族自決盛行，日本總督為避免原住民族自主意識高漲，乃高唱「内地延長主義」，並開啟五年理蕃計畫積極管理山區原住民
  - label: D
    content: 日本治台期間依序頒布過《六三法》、《法三號》、《三一法》作為總督治臺法源，其中以《六三法》授予總督的權力最大
  - label: E
    content: 因應太平洋戰爭的爆發，日本為消滅臺人的民族意議，開啟「皇民化運動」，並實施志願兵制度
