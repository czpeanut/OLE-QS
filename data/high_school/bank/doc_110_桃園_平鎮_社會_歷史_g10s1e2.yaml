  group_stem: ◎資料一：1899年台灣總督府醫學校校長山口秀高曾云：「有人說：『日本人教育土人，啟發土人，讓它們變得聰明，是一項錯誤政策。』我們認為這種言論，很有可能是來自英國人統治印度，對印度人政策的錯誤看法。這些想法是假設教育台灣人，使他們更聦明，則可能會像菲律賓、緬甸的反抗精神一樣，人民必會產生獨立思想，群起反抗政府。」
    資料二：後藤新平在明治36年(1903)曾公開發表以下言論：「為了預防像過去盡力於智育開發的荷蘭或印度般的惡果，他們未曾深思熟慮，徒以教育為善事而廣開學校，本身已造成殖民政策的錯誤。而終使原欲用以斬人的名刀，反而成為自己切腹的利刃。」
