  stem: 台灣地名來源多元，有原住民使用的地名，也有西班牙、荷蘭時期的命名，政權更替時也可能出現新地名，例如打狗變成高雄。1946年，政府在嘉義山區新設吳鳳鄉，以紀念十八世紀清朝通事吳鳳。有關吳鳳的故事，說法不一。最早，吳鳳是清朝負責傳達官命、收繳稅餉和分配差役的通事；日本治台後，總督府為加強山地部落的管理，另立官職取代通事，並將吳鳳塑造成「捨身取義」、感化原住民的角色；戰後，政府承襲這種「吳鳳神話」，以其名設鄉。1980年代，在原民族抗議及社會反省與討論後，將吳鳳鄉正名為阿里山鄉。請問：總督府在山地部落另立官職取代通事，此官職具體身分是？
