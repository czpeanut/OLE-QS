- id: doc_109_嘉義_永慶_自然_地科_g10s1e2_s2_47
  section: 2
  number: 47
  type: multiple
  page: 5
  stem: 所謂的循環經濟，是利用改良產品設計過程、提升可維條性、零件再利用率、有效回收技術等，減少開採原料的環境衝擊。下列何者<u>不屬於</u>循環經濟的產業模式？（應選兩項）
  options:
  - label: A
    content: 液化天然氣廠的廢棄冷排水供給漁塭換水與降溫
  - label: B
    content: 捷運沿線增設機車停車場
  - label: C
    content: 大量發展快時尚產品與用過即丟
  - label: D
    content: 廠商提供維修保養的售後服務
  - label: E
    content: 寶特瓶回收描紗製世足球衣
  group_stem: 隨著地球資源的耗竭，各大企業由線型經濟轉型為循環經濟。國際諮詢顧問公司Accenture將循環經濟歸納為五種商業模式，包括循環供應、資源回收、產品全命延續、共享平台與產品即服務等，簡單介紹如下： (一)循環供應：指以可完全再生、可回收的資源為基礎，逐步降低稀少資源的利用。 (二)資源回收：在產品生命週期將結束時，透過創新回收，將廢棄品轉換為有價值的產品，讓產品價值永續循環。 (三)產品生命延續：延長企業產品的生命週期，透過維修與保養等方式，可減少電子廢棄物產生。 (四)共享平台：連結產品用戶的協作平台，透過共享模式的建置，推廣使用率較低的產品，並創造用戶價值。 (五)產品即服務：透過租賃與付費使用的方式，取代傳統「買即擁有」觀念，對廠商而言，也有開發長壽商品的誘因。循環經濟的新商業模式，提供人類永續發展的新希望。（參考自葉芳瑜（2018，8月26日）。循環經濟五模式打造零廢棄。經濟日報）
