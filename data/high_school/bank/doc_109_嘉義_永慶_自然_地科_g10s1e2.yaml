  stem: 永續發展必須在不超過「環境承載力」之條件下，可持續滿足現在與未來世代之需求，且所採取之措施可為社會接受、符合經濟效益及工程技術可行。以水資源為例，「環境承載力」是指可以供給的最大水資源。現代社會為因應乾旱事件或未來水資源短缺，往往採行以下措施：甲、蓋水庫或攔河堰；乙、推行節約用水；丙、推行雨水儲集與廢汙水回收；丁、蓋海水淡化廠；戊、抽取地下水。從永續發展的觀點，下列敘述哪些正確？
