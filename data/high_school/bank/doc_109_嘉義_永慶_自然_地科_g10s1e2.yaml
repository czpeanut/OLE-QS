  group_stem: 太陽系中，因行星有各自的公轉軌道與速率，因此常能觀測到許多因相對位置不同而產生的天文現象，例如：金星凌日。「凌」在天文學上為觀測到一個天體從另一個天體前方經過，遮蔽掉後方天體一小部分的一種天文事件。 金星凌日的現象與日食的現象類似，都是天體從太陽盤面前經過的現象。行星與太陽之間相對位置不同時，亦有不同的名稱，公金星為例，金星位於太陽與地球軌道之間，稱為內行星。內行星與太陽位於同一方向時，稱為「合」。內行在太陽地球之間稱為「下合」，太陽在內行星與地球之間稱為「上合」。
