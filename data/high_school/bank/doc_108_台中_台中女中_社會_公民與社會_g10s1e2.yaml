  stem: 美國總統公投前對魁北克問題的談話，就國際法而論正是「主權是否得到國際承認很重要」的表態，尋求公投欲求獨立的魁北克與下列何者處境最相似？
  options:
  - label: A
    content: 1999年8月30日，在澳洲等地區的支持與聯合國維和部隊的監督下舉行了全民公投，絕大多數的東帝汶人投票同意從印尼獨立。2002年5月20日0時獨立，2002年9月27日正式加入聯合國，成為第191個聯合國會員國
  - label: B
    content: 2017年西班牙總理在加泰隆尼亞獨立公投前訪美，當著川普的面譴責北韓危險挑釁，川普則對西班牙配合聯合國安理會制裁北韓，大表讚賞。川普表示：「西班牙是個偉大的國家，應該繼續維持統一」
  - label: C
    content: 2014年克里米亞公投脫離烏克蘭共和國加入俄羅斯聯邦，投票率83.1％當中97.47％贊成，次日，俄羅斯總統普丁簽署命令承認克里米亞共和國成為一個獨立和主權國家。
