  group_stem: ◎ 閱讀下文之後請回答問題： 以下摘自2019年11月11日出刊的商業週刊第1669期報導柏林圍牆倒榻30年後的德國現況： 「右派的暴力分子正在危及我們的民主，」德國聯邦刑事局局長穆恩克（Holger MUnch）指出：極端政治燒起的暴力在上升，去年一年，德國有7,701件與排外相關的犯罪、1,258件針對行政官員與議員的刑案。···……煽動仇恨政治的大本營－－德國另類選擇黨（AfD）共同黨主席莫爾騰（Jorg Meuthen）接受《報導者》專訪。58歲的他從政不過5年，已是德國主要反對黨領導人、歐盟12國極右政黨聯盟的核心成員。德國另類選擇黨已是德國第三大黨，剛過的秋天，它在東部三大邦地方選舉更創下三連勝，竄升為東部第二大黨，打敗梅克爾所屬的基督教民主黨（以下簡稱基民黨），重組德東的政治板塊。…… 從2015年的百萬難民潮開始，本是邊緣小黨的它，抓住人們仇恨與恐懼的情緒，把排外與憤怒的種子順著社交網路撒進人們心裡；2016年歐洲接連發生恐攻，讓種子發芽，把「梅克爾叛徒」的形象與恐攻相連；2017年起的國會大選，他們與國際「接軌」，引進美國政治公關的知識與技術，從此穩坐德國政壇在社交網路上的霸主地位。靠著一則又一則貼文，他們開始在選民心裡建起隱形的仇恨之牆，圈粉、建牆、吸票、得權，「AfD正在為現代政治的成功方程式，創造原型。」長年追蹤德國極右派發展的德國《時代報》記者亨利克（Henrik Merker）觀察道。成功方程式的代價是社會撕裂跟鮮血，這樣的「勝選」，是民主國家的勝利嗎？…… 1分鐘認識德國另類選擇黨（AfD） ．2013年由經濟學家盧克（Bernd Lucke）創立，隔年便贏得歐洲議會席次。 ．2017年更於國會選舉取得12.6％票數，成為德國國會第三大黨。 ．它是二戰後第一個成功打進國會的極右政黨，現任主席為58歲的莫爾騰（Jorg Meuthen）。 ．該黨5大爭議主張：反伊斯蘭、反歐洲統合、反多元價值（如反墮胎和同婚）、反移民、反環保。
