    content: 2019年8月香港街頭反送中警民衝突嚴重，中華民國總統蔡英文表示：希望香港當局可以跟香港人民，能夠坐下來溝通，能夠對話，也能夠誠心來面對香港人民對自由民主的期待
  group_stem: ◎ 閱讀下文之後請回答問題： 加拿大的魁北克省在歷史上曾是法國殖民地，民眾亦大多講法語言！與說英語言的加拿大其他地區有顯著的不同。 1967年法國總統戴高樂在蒙特婁世博會期間訪問加拿大，在蒙特婁市政廳出乎意料的發表了魁北克自由萬歲 ( Vive Quebec Libre ) 的演講，激起了法裔居民對自己文化和語言言的自豪感，魁北克獨立運動開始成為魁北克的主流民意。此次演講導致法加關係陷入低谷，而戴高樂也因此被加拿大政府列為不受歡迎人士而提前結束訪問返回巴黎。此後法國政府經常庇護魁北克獨立人士，2008年時任法國總統薩科齊才宣布法國政府不再支持魁北克獨立。 1995年10月30日，魁北克繼1980年代獨立公投失敗後再次舉行是否獨立的公民投票，美國總統柯林頓於公投前發表講話：魁北克獨立是魁省人的內政，但結合加拿大、美國及墨西哥三國的北美自由貿易協議，只能有這三個國家，沒有第四個國家的可能性。變相警告魁北克即使獨立，經濟上亦不會獲美國優惠。此話一出，民情出現微妙逆轉，公投結果反對獨立一派僅以50.6％的得票險勝獨立派。 摘自：維基百科
