  stem: 美國獨立建國初期於1778年通過《邦聯條例》，後因邦聯體制無法處理獨立建國初期的內外交迫，於是在1787年改通過《聯邦憲法》。邦聯國家的中央政府近乎虛擬無實櫂，聯邦國家則於《憲法》中加強中央政府各項實權，同時又保持各地方政府自主空間，只要不牴觸《聯邦憲法》，各地方自有各州（邦、省）憲法。請問：下列何者接近美制？
