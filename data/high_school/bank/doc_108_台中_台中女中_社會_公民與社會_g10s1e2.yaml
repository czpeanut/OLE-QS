- id: doc_108_台中_台中女中_社會_公民與社會_g10s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 政治學者李帕特提出「協商式民主」，用來解決多數決的缺失。請問：在政治上無法經由何者實現？
  options:
  - label: A
    content: 與少數族群組成聯合政府
  - label: B
    content: 議會選舉採比例代表制
  - label: C
    content: 表決要絕對多數才通過
  - label: D
    content: 實施區域自治
  group_stem: '◎閱讀下文之後請回答問題： 協商民主（英語：Deliberative Democracy）或譯作「審議民主」，意指不同的主體透過平等的對話、充分的溝通以及理性的討論，共同參與公共決策以及公共治理的民主形式。協商民主強調在多元社會背景下，以公共利益為目標，通過公民普遍參與，就決策和立法等公共事務達成共識。作為一種新型民主現論範式，協商民主興起於20世紀後半葉的西方國家的政治學者對傳統西方選舉民主帶來的種種問題和弊端的反思。 學者李帕特 ( Arend Li加hart ) 分析奧地利、比利時、瑞士和荷蘭政治系統，歸納出協商民主理論；在社會上不同階級、地域、文化等所產生的分裂，被所屬陣營納入系統之中，形成「柱狀化」( 英語：Pillarisation；荷蘭語：Verzuiling ) 結構稱「柱狀體」( 英語：Pillar；荷蘭語：Zuil )，以此結構為前提的聯合政權內，各陣營進行「協調的政治 ( politics of accommodation )。具有以下特徵： ．大聯合內閣，納入各柱狀體的菁英 ．比例性，國會及公共資源等依比例分配之 ．區域自治，創立個體意識及允許不同文化共同體的法律 ．相互否決權，各群體共識仍需多數決，少數群體有權否決，但也會被其他群體回報否決阻撓

    以協商民主為基礎進而推展出「共識民主」( Consensus democracy ) 理論。

    摘自：維基百科'
  answer:
  - C
