  stem: 聯合國在1948年通過《世界人權宣言》，第一條開宗明義宣示「人人生而自由，在尊嚴和權利上一律平等」，成為史上第一份表述全體人類共同且平等適用權利的文件，作為所有國家及人民努力實現普世人權的標準。請問下列關於人權的敘述何者正確？
  options:
  - label: A
    content: 人權的實現須關切不同生活處境群體之所需，以維護實質平等
  - label: B
    content: 政府保障基本人權為各國的普世價值，即使是極權國家也不例外
  - label: C
    content: 在聯合國的監督下，世界各國對於人權保障的落實程度大致相同
  - label: D
    content: 人權是人人享有的權利，其概念是固定的，不會隨著時代發展而擴充
