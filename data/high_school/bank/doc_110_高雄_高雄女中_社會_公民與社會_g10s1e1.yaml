  stem: 2018年12月，中國生物學家宣佈為兩名嬰兒改造了基因，使她們將來可能具有天然抵抗愛滋病的能力。消息一出引發全球爭議，醫學界和科學界譴責其違背醫學道德倫理，中國官方對其馬上立案調查。2019年底，中國官方認定這起事件為「為追逐個人名利」而組織的違法人類胚胎基因編輯活動，中國的法院對該生物學家判刑三年。基因編輯可以通過刪除或改變胚胎中麻煩的編碼來避免一系列遺傳性疾病。但專家擔心，改變胚胎的基因組可能會造成意想不到的傷害，不僅對個體有傷害，而且對繼承這些相同變化的子孫後代都會造成傷害。針對專家的看法，請問我們應該如何理解上述基因科技所引發的爭議？
  options:
  - label: A
    content: 若特定生技公司壟斷基因市場，將造成社會動盪
  - label: B
    content: 基因科技若被氾濫運用，整體社會將會道德淪喪
  - label: C
    content: 在人口爆炸的此刻，該科技會造成政府財政負擔
  - label: D
    content: 雖能滿足部分民眾的期待，卻無法評估後續影響
