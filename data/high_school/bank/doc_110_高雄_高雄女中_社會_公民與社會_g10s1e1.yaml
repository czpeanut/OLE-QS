  stem: 公民身分的概念源自於兩千多年前的古希臘雅典城邦，符合資格的公民可進行投票選出執政者及決定公共事務等政治活動。請問下列關於公民身分的敘述，何者正確？
  options:
  - label: A
    content: 在現今的我國，只要年滿20歲者即為公民，不需要符合其他的條件
  - label: B
    content: 古希臘雅典城邦符合出生於當地、成年、有一定財產者，具公民身分
  - label: C
    content: 符合法定身分資格而能享有權利並承擔義務的國民，必為該國的公民
  - label: D
    content: 古希臘雅典城邦的權利主體已從特殊走向普遍，城邦主權為公民擁有
