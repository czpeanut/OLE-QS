  stem: 信奉伊斯蘭教的羅興亞人長期受到緬甸政府和當地占多數的佛教徒迫害，幾乎每年都有大批的羅興亞人乘船偷渡，他們企圖逃往孟加拉、泰國、印尼、馬來西亞。2017年緬甸爆發大清洗，造成將近100萬名的羅興亞人被迫逃至孟加拉的難民營。BBC採訪住在難民營的羅興亞人，他們說：「即使把整個孟加拉都給了我們，我們也不會想留在這邊，如果可以的話，我們很想回去。」顯示其對孟加拉並無國家認同。請問下列關於國家認同的敘述，何者正確？
  options:
  - label: A
    content: 血緣及文化是人民對於國家認同必備的基礎
  - label: B
    content: 國家認同指的是個人認為自己歸屬於哪一個政治共同體
  - label: C
    content: 不被國際承認的主權國家，其人民對國家不具有國家認同
  - label: D
    content: 國家認同是區分政黨傾向的工具，可使人民對國家產生歸屬感
  tags:
