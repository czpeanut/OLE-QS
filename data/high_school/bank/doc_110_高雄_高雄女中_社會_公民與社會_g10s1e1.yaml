  stem: 根據上文，請問下列敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 童婚為玻璃天花板現象，影響女性地位
  - label: B
    content: 資料二顯示，童婚在印度屬於主流文化
  - label: C
    content: 童婚為性別歧視，會阻礙女性自我實現
  - label: D
    content: 童婚可能因平等價值觀念的提升而改變
  group_stem: ●資料一 今年3月8日國際婦女節，根據聯合國兒童基金會公布的一份新分析報告，疫情對於若干國家的婦女造成嚴重影響，在今後10年期間，童婚可能會增加1000萬例。這份研究報告「2019 冠狀病毒疾病（COVID-19）：對反童婚進展的威脅」指出：「因疫情導致學校停課、經濟壓力、社福機構停擺、懷孕與父母身故，使得最弱勢少女處於益增的童婚風險中。」 目前全球約有6億5000萬童婚婦女，當中約有半數在孟加拉、巴西、衣索比亞、印度或奈及利亞。過去10年，全球少女童婚的比例已減少15%，從幾乎每4人中就有1人降至每5人中1人，不過這項進展如今面臨威脅。 ●資料二 印度農村由於窮困及需要人力耕作，且為保護女子貞潔，盛行早早就把女兒出嫁的童婚。印度目前法定的最低結婚年齡，女子為18歲，男子為21歲。雖然印度政府立法禁止童婚，但根據2015到2016年進行的全國家庭健康調查，印度20到24歲女性中，有26.8%是在18歲以前就被迫嫁人，又以西孟加拉省和比哈省的比例最高，分別是40.7%和39.1%。 印度國家人委員會成員辛哈指出，儘管政府2006年制定了「禁止童婚法」，2015年和2016年分別僅立案登記 293件和326件童婚，但實際上，印度平均每天約有3600場涉及童婚的婚禮舉行，低立案率顯示印度社會普遍認可童婚。
