  group_stem: 今年4月8日，美麗華開發公司突然宣布即將在5月8日進行企業分割，並且在新、舊雇主都是同一人的狀況下，以《企業併購法》賦予新雇主的「商定留用權」，不予留用13名員工，其中包括8名工會成員及工會理事長；同時將留用的員工分別分配至美麗華開發及3家子公司，使每家公司皆少於法定工會籌組的門檻30人，成為第一家企圖以《企業併購法》瓦解工會的公司。 針對美麗華高爾夫球場以併購之名、解僱多名工會幹部成員一案，新北市勞工局5月起召開勞資調解會議，但未能調解成功，為了保衛「甲」及工會組織，工會發起罷工投票，44名會員中有29人同意，並於5月11日凌晨無預警發動罷工。但在罷工的第三天，便遇上了covid-19本土疫情的大爆發。球場因為疫情因素停業，資方不必面對來自使用者的壓力、虧損也暫時止血，罷工行動難以對資方造成壓力，演變成一場方長期對峙的耐力戰。 日前歷時105天的罷工於落幕，勞資雙方簽署協議書，原先被公司不予留任的工會會員勞工全部復職，雙方相互撤回告訴，終止一切司法、裁決及行政爭議程序。
