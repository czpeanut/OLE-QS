  stem: 由於現代國家的公民常由多元群體所組成，除了以國籍代表個人歸屬於某個國家外，還包含不同性別、族群、宗教、域、文化、性傾向等，使每位公民都可能同時擁有多元的群體身分，以及對此身分的認同感。請問下列關於身分認同的敘述，何者錯誤？
  options:
  - label: A
    content: 身分認同常成為區分群體差異、建立我群意識的精神基礎
  - label: B
    content: 民主國家不需要透過政策的制定來保障人民的多元身分認同
  - label: C
    content: 指一群具有相同群體身分及共享特定文化傳統、生活方式的人
  - label: D
    content: 多元身分認同能否被肯認及平等保障，將影響國家認同的形成
