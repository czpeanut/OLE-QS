  stem: 我國是以憲法為基礎的憲政主義國家，《中華民國憲法》第一條規定：「中華民國基於三民主義，為民有民治民享之民主共和國。」並在政府擁有治權的權力架構下，形成一個符合民主正當性的國家。請問下列關於國家與政府之比較何者正確？
