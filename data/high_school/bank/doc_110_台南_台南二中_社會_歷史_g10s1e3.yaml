  group_stem: 請閱讀資料並回答下列問題： 資料一：他到任後發現臺灣的隱田很多且存在大、小租問題，使土地所有權雜亂，田賦徵收無法落實，因此在臺北、臺南設清賦總局，清丈田畝，同時發給小租戶丈單，欲確立由小租戶繳納正供，但彰化因大租戶抗議清丈不公而引起民變，影響土地改革政策方向，只得採取「減四留六」政策，並重定賦則。 資料二：政府下令「地主得保留其出租耕地裡的中等水田3甲、旱地6甲，超過規定的私有出租耕地則由政府以按價購買方式徵收」，三成以水泥、紙業、農林及工礦四家公營事業公司股票補償，七成發實物債券 資料三：政府於土地調查後首先進行大租權的整理，並公告「大租歸戶冊」，要求地主親自確認資料的正確性，有異議者可申請複查，成功讓大租權獨立於所有權之外，確立小租戶的土地所有權。
