  section: 1
  number: 19
  type: single
  page: 2
  stem: 資料一、資料二是臺灣兩位關心文學發展的學者提出的論點，以下何者分析較為適當？
  options:
  - label: A
    content: 這兩則資料應是二戰後針對臺灣文學界發出的意見
  - label: B
    content: 兩則資料的背景，是保守派不滿歐美藝術思潮進入臺灣
  - label: C
    content: 兩者立論不同，資料一捍衛傳統漢文學，資料二主張發展新文學
  - label: D
    content: 資料一中的「學子」與資料二中的「諸君」是指同一群人
  group_stem: 請閱讀資料並回答下列問題： 資料一：「今之學子，口未讀六藝之書，目未接百家之論，耳未聆離騷樂府之音，而囂囂然曰：『漢文可廢！』甚而提倡新文學，鼓吹新體詩，秕糠故籍，自命時髦，吾不知其所謂新者何在？其所謂新者，持西人小說戲劇之餘，丐其一滴沾沾自喜，是誠陷井之蛙，不足以語汪洋之海也噫。」 資料二：「諸君怎的不讀些有用的書來實際應用於社會，而每日只知道做些似是而非的詩，來做詩韻合解的奴隸，或講什麼八股文章替先人保存臭味。想出出風頭、竟然自稱詩翁、詩伯，鬧個不休。」 資料三：「臺灣並不是沒有受了中國文學革命或其他的影響而已覺醒的人，但大多數的人，對於文學革命的意義還沒有瞭然明白。我不敢以文學革命的大將自居，不過是做一個導路小卒，引率文學革命軍到臺灣來，並替它呐喊助攻罷了。」
