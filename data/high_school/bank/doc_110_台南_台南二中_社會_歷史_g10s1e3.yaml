  stem: 臺灣文學自二戰後，風格多變，根據以上三則資料，下列敘述哪些正確？
  options:
  - label: A
    content: 資料一創辦的雜誌是《現代文學》
  - label: B
    content: 資料一「轉向内在、心靈方面的探索」指走向關懷鄉土的路線
  - label: C
    content: 白先勇的《臺北人》是資料一的代表作之一
  - label: D
    content: 資料二完全是對資料三反動而產生
  - label: E
    content: 資料三的作品背景是國民政府在國共内戰中失敗逃到臺灣
  group_stem: 請閱讀資料並回答下列問題： 資料一：這位在臺大就讀的學子跟一群志同道合的同伴創辨雜誌，以「橫向移植」的方式把存在主義、意識流、超現實主義等西方思潮引進國内，他們大多是中國來臺第二代作家，未能接受上一代的文學傳統，也不了解臺灣的新文學運動，故轉向内在、心靈方面的探索。 資料二：陳映真、黃春明、王禎和、楊青矗等人帶動了某種文學的風潮，他們寫實地描繪臺灣中下階層人民的悲慘生活，於是在文壇上掀起討論寫作方向和路線的熱潮。現代主義作家彭歌、余光中點名批判陳映真、王拓、尉天驄等作家的文學為共產黨的「工農兵文學」，引發臺灣文學史上的大辯論。 資料三：此時的作家心靈充滿沮喪和仇根，反映這種心境的文學自然對中共政權充滿憤怒和仇怨，這種文學因而成為政策的附庸，令人生厭的八股文學，斤斤計較於意識型態的鬥爭，作品縈繞著作家在中國的舒適生活，與臺灣民眾的現實生活完全脫節。
