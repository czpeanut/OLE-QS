  stem: 《跳舞時代》片名取自當時同名的流行歌，是一部以臺灣某時期音樂發展過程為背景的紀錄片，描述原本保守的臺灣，因為流行音樂的風潮興起，帶動都會女性流行「跳舞」，也跟著鼓吹自由戀愛、解放纒足等新潮思維。後來由於國家政策與世界局勢變化，臺灣的流行歌漸漸被軍歌、政府宣傳曲給代替，「跳舞時代」也因此畫下句點。請問這部電影所選定的背景應該是？
  options:
  - label: A
    content: 1900年代
  - label: B
    content: 1930年代
  - label: C
    content: 1950年代
  - label: D
    content: 1980年代
