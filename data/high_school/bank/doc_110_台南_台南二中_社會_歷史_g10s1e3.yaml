- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 一段清代的文獻中如此描述臺灣：「臺灣僻在東南隅，地勢最下，其去中州最遠。故氣候與漳泉已不相同。大約暑多於寒，恆十之七。鍾鼎之家，獸炭、貂裘無所用之；細民無衣、無褐，亦可卒歲。」請問可以如何理解這段資料？
  options:
  - label: A
    content: 中國大陸來臺的官員、文人，會以家鄉相關事物來對比臺灣風土
  - label: B
    content: 作者最初不知臺灣氣候溼熱，結果帶來禦寒的衣服、物資都不適用
  - label: C
    content: 從文獻中可得知獸炭、貂裘等臺灣特有物產，對後人研究頗有助益
  - label: D
    content: 作者對於臺灣整體認識不深，對於氣候、人文的描述多有錯誤
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
