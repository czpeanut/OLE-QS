- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 清代有段關於臺灣的史料提及：「此地之煖（ㄋㄨㄢˇ，同暖）甚於内地，然一年之耕種，僅只一次收穫。總因多風少雨，播種插秧，每有愆（ㄑㄧㄢ）期（誤期），故十年難必有五年之獲。不謂爾民弗計於此，偶見上年糖價稍長，唯利是驅，舊歲種蔗，已三倍於昔；今歲種蔗，竟十倍於舊年。」關於這段話，反映了臺灣農業的哪一個現象？
  options:
  - label: A
    content: 蔗糖為主要的外銷產品
  - label: B
    content: 稻米因氣候暖化而歉收
  - label: C
    content: 農業高度商品化
  - label: D
    content: 勞動力嚴重缺乏
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一名學者在研究總督府政策對臺灣現有經濟型態的影響時，指出：「為動員日本私人資本企業一同開發臺灣資源，殖民政府一手承擔起耗費鉅資的基本建設，並著手建設一個便利工商企業經營的現代市場經濟，以為母國資本來臺鋪路。殖民初期的財經政策因此環繞在商品化本地的生產與交換上。」請問下列哪一項政策屬於該名學者提到的「商品化本地的生產」範疇？
  options:
  - label: A
    content: 展開土地改革，取消「一田多主」制度，以增加田地賦稅
  - label: B
    content: 進行大規模的森林調查並宣告歸於國有，以掌握臺灣可用山林資源
  - label: C
    content: 農業試驗場進行品種改良以及興建嘉南大圳等以提升水稻產量
  - label: D
    content: 引進度量衡制度，為市場確立统一的交易單位
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 喜歡看童話故事的阿紫在爺爺的舊書櫃裡找到一本伊索寓言，裡面有一篇驢和蚱蜢的故事提及：「有一隻驢羨慕蚱蜢美妙的聲音，便問蚱蜢都吃什麼來保持喉嚨？蚱蜢說吃露水，驢子也跟著只吃露水，最後驢子就餓死了。騙人的共匪，正如蚱蜢騙驢子一樣，記住，只有蠢如驢子的人才會相信共匪，上他的當。」阿禁覺得這跟他平常看到的故事書不太一樣，請間這本書的出版年代與哪一選項中所述之歷史情境發生的時間點最為接近？
  options:
  - label: A
    content: 描寫現實社會情況文學之興起
  - label: B
    content: 舉辨臺陽美展以跟官方對抗
  - label: C
    content: 宜蘭歌仔戲開始發展，並在戲院演出
  - label: D
    content: 孩童穿著以美援麵粉袋縫成的褲子
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 學者提到十六、十七世紀的臺灣地位，認為：政治易主，東亞貿易的架構也重回十六世紀中期的傳統秩序。中國北方貿易，從寧波、南京前往日本：南方貿易，則從廈門、廣州前往東南亞，臺灣再次被置於東亞貿易的主要路線之外。從以上的論述可以推出怎麼樣的論斷？
  options:
  - label: A
    content: 臺灣成為東亞海域轉口貿易的基地
  - label: B
    content: 文中的「政治易主」是指臺灣進入鄭氏政權
  - label: C
    content: 臺灣地位自此變成大清帝國的邊陲
  - label: D
    content: 臺灣保有國際貿易以及對日貿易的優勢
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 小梅在做清代臺灣史的報告時，其内容摘要為：一是臺灣和中國大陸間「區域分工」頻繁，造成商業貿易在臺灣特別發達；二是商業貿易日趨頻繁，漳、泉商賈彼此競爭激烈，遂依祖籍、宗族團結共謀利益；三是清廷對臺灣限制糧運，福建兵糧，由臺補給，食糧的配運，都需有船團的組織及管理。就摘要來看，這份報告的主題應該是？
  options:
  - label: A
    content: 行郊形成的背景
  - label: B
    content: 開港通商後的影響
  - label: C
    content: 東亞貿易的概況
  - label: D
    content: 漳泉移民的競爭
