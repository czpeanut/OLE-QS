  group_stem: 請閱讀資料並回答下列問題： 出生彰化鹿港的日治時期詩文作家洪棄生曾於〈鹿港乘桴記〉寫道：「樓閣萬家，街衢對峙，有亭翼然。亙二、三里，直如弦、平如砥，暑行不汗身、雨行不濡履。一水通津，出海之涘，估帆葉葉，潮汐下上，去來如龍，貨舶相望；而店前可以驅車、店後可以繁榜者，昔之鹿港也。……。蓋鹿港扼南北之中，其海口去閩南之泉州，僅隔一海峽而遙。閩南、浙、粵之貨，每由鹿港運輸而入；而臺北、臺南所需之貨，恆由鹿港輸出。乃至臺灣土產之輸於閩、粤者，亦靡不以鹿港為中樞。蓋藏既富，絃誦興焉；故黌序之士相望於道，而春秋試之貢於京師、注名仕籍者，歲有其人，非猶夫以學校聚奴隸者也。」
