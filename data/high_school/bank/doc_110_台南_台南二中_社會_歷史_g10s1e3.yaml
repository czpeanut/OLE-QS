questions:
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 以下是十七世紀時，兩大商業集團的協商過程： 甲：「我方願意提供某作物三成產量，用來換取諸位軍事物資的供給。」 乙：「這樣恐怕不夠，我等要求加入鹿皮，並且要協助我們在東北亞建立更穩定的貿易點，考量到你們目前的處境，這筆交易應該還是公平。」 請問下列敘述何者正確？
  options:
  - label: A
    content: 甲方為鄭氏政權，提供的作物為香料和稻米
  - label: B
    content: 乙方為英國東印度公司，想藉此與日本通商
  - label: C
    content: 甲方當時正為了如何攻取荷蘭人占領的臺灣而煩惱
  - label: D
    content: 乙方建立據點的目的未能達成是因中國介人
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「河南勇」或有人稱為「廣勇」，是臺灣民主國敗亡後，失去領導者的一群散兵，傳言這些士兵從府庫搶了不少庫銀。史料記載：「適臺北潰勇走依之；甫過桃仔園中壢，粵民團勇始聞臺北失守，見廣勇金帛纍纍，於是沿途截殺，軍械衣服洗搶一空……廣勇遭殺者数百餘人。」後人將河南勇的骨骸收葬後立廟祭祀，其中之一便是新竹市金山面河南公墓（義勇忠祠），請問此廟與下列哪一寺廟的祭祀型態最為接近？
  options:
  - label: A
    content: 三重蘇府王爺廟
  - label: B
    content: 大甲鎮瀾宫
  - label: C
    content: 萬華百姓公廟
  - label: D
    content: 艋舺龍山寺
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 臺北艋舺青山宮〈沿革記略〉提到：「（清）咸豐4年，福建惠安縣漁民奉其故鄉青山廟靈安尊王像至艋舺（今萬華），由大溪口登岸，經舊街（今西園路），神輿突不能舉，公議擲筊問神卜地，於此建小廟奉祀。時適淡北瘟疫流行，死亡相繼，凡至廟中求神庇佑者皆無恙，於是善信日增。」從上述碑文判斷，這座廟宇供奉的主神是？
  options:
  - label: A
    content: 王爺
  - label: B
    content: 媽祖
  - label: C
    content: 土地公
  - label: D
    content: 義民爺
- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 附表為臺灣地方政府有關水利設施的記錄，請問水利設施數量迅速增加的原因為何？
  options:
  - label: A
    content: 為了廣開蔗田增加糖出口，因而興建水利設施
  - label: B
    content: 為搭配屯田制而廣泛興建水利設施
  - label: C
    content: 因稻米的市場行情價較佳，故民間開始投資水利設施
  - label: D
    content: 霧峰林家與板橋林家為了栽種茶樹、樟腦，而大力開發水利設施
