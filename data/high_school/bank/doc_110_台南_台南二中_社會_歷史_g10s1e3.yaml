  type: single
  page: 2
  stem: 「屏東車城福安宮是全臺灣最大的土地公廟，據當地的耆老表示，士地公可能在荷治時期就已經在車城落腳，保佑當地人的日常生活。在清代林爽文事件時，福康安為了平定動亂，率清軍來土地公廟祈求保佑，結果順利戰勝，因此請乾隆皇帝賜官帽、官服，並改名福安宮。事蹟傳開後，四處都有分靈出去的土地公廟，擴大了車城福安宮的信仰範圍。」請問上述資料可作為臺灣宗教的何種例證？
