- id: doc_110_台南_台南二中_社會_歷史_g10s1e3_s3_42
  section: 3
  number: 42
  type: calc
  page: 5
  stem: 文中指出日本統治臺灣初期，約七成的經費來自於母國的補助，可見臺灣成為日本財政上的包袱，1897年日本國會甚至出現「是否要將臺灣以一億日圓賣給法國」的言論，此一論述稱為？（1分）
  group_stem: '請閱讀資料並回答下列問題： 日本統治臺灣之初，每年維持軍隊與政府統治機關的經費需要1,000萬日圓，其中700萬日圓是來自本國的補助。在有限的預算範圍内，1898年上任的兒玉總督與後藤民政長官，開始規劃振興資本主義經濟之發展。首先是由政府推動設立新式製糖會社：此外，殖民地中央金融機關的臺灣銀行，也在官方主導下設立。 臺灣銀行設立的目的就是開發臺灣的財富，並將業務範圍擴張到華南與南洋等地區，成為促進日本與這些地區商業貿易的金融機關。此外，根據當時官方資料亦可看出，臺灣是被規劃為日本往南發展的根據地，由以上經營臺灣的型態與預期目標可知，日本統治臺灣這塊殖民地，並非基於資本發展階段的内在需求，亦即，日本是先採取政治與軍事之行動，再發展實質的帝國主義式的經濟擴張。

    資料出處：何義麟，《矢内原忠雄及其《帝國主義下的臺灣》》（臺北：五南，2011） 買32~33'
