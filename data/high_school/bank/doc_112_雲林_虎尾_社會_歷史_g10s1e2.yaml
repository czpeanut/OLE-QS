questions:
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 19 世紀末一則涉及臺灣的議和條約規定：「本約批准互換之後，限二年之內，日本准中國讓與地方人民願遷居讓與地方之外者，任便變賣所有產業，退去界外，但限滿之後尚未遷徙者，酌宜視為日本臣民。」關於上述條約內容，下列敘述何者正確？
  options:
  - label: A
    content: 此條約是《中日臺北和約》
  - label: B
    content: 條約簽訂是因中國戰敗將臺灣割給日本
  - label: C
    content: 期限兩年內未遷出臺灣者視同中國國民
  - label: D
    content: 當時約有 30 ％臺灣人口遷回中國大陸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從日本准許在兩年內，中國讓與地方人民能遷居界外一事，即可推知此為 1895 年的《馬關條約》。「中國讓與地方」為臺灣，臺人於兩年內可自由遷徙離臺，若期滿仍未遷徙者，則視同自願成為日本臣民，當時離臺者僅占臺灣人口不及 0.3 ％，影響不大。正確答案為(B)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '附表為 1910 年到 1940 年間臺灣人口的統計資料。表中丙、丁代表的族群分別是

    | 年分 | 甲族群（萬） | 比率％ | 乙族群（萬） | 比率％ | 丙族群（萬） | 比率％ | 丁族群（萬） | 比率％ | 總計 （萬） |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1910 | 306 | 92.9 | 1.48 | 0.4 | 12.2 | 3.7 | 9.8 | 3.0 | 329.9 |

    | 1920 | 343 | 91.4 | 2.48 | 0.7 | 13.0 | 3.5 | 16.6 | 4.4 | 375.7 |

    | 1930 | 425 | 91.0 | 4.66 | 1.0 | 14.0 | 3.0 | 23.2 | 5.0 | 467.9 |

    | 1940 | 552 | 90.9 | 4.61 | 0.8 | 15.8 | 2.6 | 34.6 | 5.7 | 607.7 |'
  options:
  - label: A
    content: 丙為臺灣人、丁為原住民
  - label: B
    content: 丙為外國人、丁為臺灣人
  - label: C
    content: 丙為日本人、丁為外國人
  - label: D
    content: 丙為原住民、丁為日本人
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 甲比率最高，為臺灣人；乙比率最少，可能為外國人；丙人數無明顯變化，為原住民；丁於 1920 年後人數開始大增，應為日本人。因此(D)為正解。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '資料一：1917 年一則報導：內地富豪久原氏，將於南洋之波羅洲，經營護謨（橡膠）產業……因人夫缺乏，著手殊難，欲就內地募集，恐氣候不佳，於往者無益；以臺灣之氣候，與該處不甚懸殊，爰欲於本島募集前往，……其所欲募之人夫數，先按 30 名；又欲招約 30 名有相當學識、精通國語者，往為事務員，給予厚資。

    資料二：英領北婆羅洲久原農園，曩募第一回渡航臺灣勞動者，嗣知其一般強健，性行純樸，勸勉耐勞，因思更募第二次渡航者。……或人錯會北婆羅洲之位置，屬南洋熱帶圈內，暑氣酷暑前次渡航之人有多數病死者，實則不然，現皆健全活動。

    關於上述兩段資料，下列何者正確？'
  options:
  - label: A
    content: 從資料一可知由臺灣前往南洋的移民只能從事勞力工作
  - label: B
    content: 由資料二可知當時已有臺灣人因經濟活動而往南洋遷移
  - label: C
    content: 發布二次招募公告是因臺人死亡率過多造成人手空缺
  - label: D
    content: 由兩則資料可知臺灣人主要是因為氣候相近而移民東南亞
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)也有招募有學識、精通國語的事務員。(B)為正解。(C)因臺灣勞動者好用，才想再招募第二次。(D)應是日本資本家認為臺灣與東南亞氣候相近，才想招募臺灣人；臺灣人應是為了謀生而接受招募。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 根據研究，1915 ～ 1934 年間，臺灣的殖民政府為補助臺灣人、日本人在東南亞的多種生意、農業計畫、企業，撥發不少款項。例如：1915 年臺灣總督府撥款 3,500 日圓給「南亞興農組合」，以鼓勵臺灣人移民東南亞。1930 年代初期，愈來愈多臺灣人被招募到南洋，協助管理日本人投資的事業。當時至海外求職的臺灣人，以○在荷屬印尼發展最佳。○是下列何人？
  options:
  - label: A
    content: 周里觀
  - label: B
    content: 謝雪紅
  - label: C
    content: 李友邦
  - label: D
    content: 黃朝琴
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 移居荷屬印尼的臺灣人是(A)周里觀。(B)臺灣共產黨的創立者。(C)(D)日治時期前往中國大陸組織義勇隊抗日者。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 學者分析日本在臺施行日人移民政策考量時，認為「<u>甲地</u>農業尚不發達，但可設立普通行政區，鼓勵本國農民移入，是為『移住型殖民地』；<u>乙地</u>功能完整，適合本國資本家進駐與設立普通行政區，是為『投資型殖民地』；<u>丙地</u>著重在掌握、開發當地資源，設立特別行政區，逐漸將住民同化，是為『封鎖型殖民地』。」請問上述引文中甲、乙、丙 3 地分別為何？
  options:
  - label: A
    content: 西部、東部、山地
  - label: B
    content: 山地、西部、東部
  - label: C
    content: 東部、山地、西部
  - label: D
    content: 東部、西部、山地
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 甲地鼓勵日本農民移入，為東部地區；乙地適合資本家進駐，為西部地區；丙地可逐漸將住民同化，應為山地。故正確答案為(D)。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 根據研究，1931 ～ 1945 年間，估計有 5,000 臺灣人住在滿洲，其中除了南滿鐵道株式會社的工程師、技師，大部分是年輕醫生、老師及他們的家眷。某人出身於新竹，一生之中多次更換國籍。1932 年滿洲國成立後，即成為上述這 5,000 人的一份子，甚至擔任滿洲國的外交部總長，二戰後被逮捕，後於中國過世。請問某人是誰？
  options:
  - label: A
    content: 謝介石
  - label: B
    content: 鍾理和
  - label: C
    content: 鍾臺妹
  - label: D
    content: 彭華英
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 曾擔任滿洲國外交部總長的臺灣人是(A)謝介石。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 有移民的記錄如下：「當年，我懷抱著雄心壯志離開故鄉，想在這裡開創一番成就。只是沒想到，抵達時所見的景象卻是如此：這裡連一條稱得上『路』的通道都沒有，田地也未經整頓，雜草叢生。在這裡能吃的食物也很少，只有生味噌、在來米這樣的粗食，生活非常艱苦，還常常受到蕃人的攻擊，想要在這裡立足，實在比想像中艱困許多。」依據你的判斷，這位移民抵達的是
  options:
  - label: A
    content: 1895 年的打狗
  - label: B
    content: 1900 年的噶瑪蘭
  - label: C
    content: 1910 年的花蓮
  - label: D
    content: 1935 年的臺東
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「在來米的粗食」、「受到蕃人的攻擊」等句，可判斷為日本來臺灣東部開墾的移民生活，答案為(C)。(A)(B)非日本移民村的設置地點，(D) 1920 年代已有蓬萊米，與題文不符。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 全臺各地有不少以「大陳新村」為名的眷村，是政府安排給大陳義胞們的居所。請問這些大陳義胞來臺的背景與身分為何？
  options:
  - label: A
    content: 1945 年負責接收臺灣的公務人員
  - label: B
    content: 1949 年從泰緬遷臺的雲南難民
  - label: C
    content: 1955 年第一次臺海危機時來臺的沿海島民
  - label: D
    content: 1958 年第二次臺海危機時移防臺灣的軍眷
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「大陳新村」的設置，乃為安置 1955 年一江山島戰役後自大陳島遷臺的居民，此戰役也被稱為第一次臺海危機，(C)為正解。(D) 1958 年八二三砲戰被稱為第二次臺海危機，當時沒有移防臺灣的軍眷。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 二二八事件造成省籍的衝突及對立，而「本省人」和「外省人」的稱呼，是從臺灣重回中國統治後，請問劃分本省及外省的主要原因為何？
  options:
  - label: A
    content: 1684 年，清廷將臺灣收歸版圖
  - label: B
    content: 1885 年，臺灣建省之時
  - label: C
    content: 1912 年，中華民國政府成立
  - label: D
    content: 1945 年，國民政府開始統治臺灣
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 今日本省及外省的區隔，係從(D) 1945 年國民政府開始統治臺灣後，自中國大陸來臺者皆稱外省人。(A)當時臺灣隸屬福建省。(B)臺灣漢人多來自福建，不會明顯的區分本省與外省。(C)此時臺灣為日本殖民地，不隸屬中華民國。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 小光同學在圖書館看到一本小說，小說的內容主要是以國民政府時期下的臺灣為故事題材，為了制衡共產黨勢力的擴張，執政者不得不採取必要的軍事手段，然計畫趕不上變化，此後也造成部分國軍與人民被犧牲，成為一群短暫被遺忘的人們。小說作者柏楊對於這本著作留下這樣的註解：「政府犯過的罪惡錯誤可以理解，可以原諒，但不能重來。」請問柏楊所謂「被遺忘的人」，應是指何人？
  options:
  - label: A
    content: 泰北孤軍
  - label: B
    content: 大陳島和一江山軍民
  - label: C
    content: 白色恐怖受害者
  - label: D
    content: 二二八事件被清鄉者
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文的關鍵線索是國共內戰與「被犧牲的國軍與人民」、「被遺忘的人」，可推知這本小說是柏楊的《異域》，描述的是滯留在異國的(A)泰北孤軍的故事。(B)被遷來臺灣，並非被遺忘的人。(C)(D)與國共內戰無關。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 臺灣在某一時期，因資金外移與引進國際移工課題，衝擊本國勞動力就業市場，影響了臺灣籍勞工既有的工作權益。此外，臺灣女性對於婚姻自主權日益高漲，政策開放下，經濟力較薄弱的男性則開始對外尋求婚配對象。請問此應為臺灣哪一時期的社會現象？
  options:
  - label: A
    content: 1970 年代，退出聯合國之際
  - label: B
    content: 1990 年代，經濟面臨轉型
  - label: C
    content: 1950 年代，韓戰爆發時期
  - label: D
    content: 1980 年代，解除戒嚴時期
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣因全民教育程度提升、產業結構轉變及勞工基本薪資增加，致使產業面臨低技術勞力不足問題，故自 1989 年起，正式引進第一批低技術外籍移工。於此同時，外籍婚配對象也大量增加，答案以(B)較適合。
- id: doc_112_雲林_虎尾_社會_歷史_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 某校歷史課程進行「歷史考察」學習時，要求同學事先蒐集族譜、臺灣總督府旅券（護照）、同鄉會名簿等史料，並進入內政部網站閱讀人口和戶口調查資料。該「歷史考察」的主題最可能是
  options:
  - label: A
    content: 人群的移動與交流
  - label: B
    content: 國家的建立與形塑
  - label: C
    content: 文化的類型與變遷
  - label: D
    content: 宗教的起源與傳播
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '族譜是記載家族到個人變遷與移動傳承的紀錄，旅券也與人群移動有關，再加上「同鄉會名簿」，可知該歷史考察主題應與(A)人群移動後的交流觀察有關。此外，從內政部的人口和戶口調查資料也可看出個人戶籍地遷移的狀況。(B)(C)(D) 3 者皆與人口或戶口調查工作無關。

    13.1949 年正值(A)國共內戰將結束，國民黨軍隊戰敗，中國大陸即將失守的消息使人心惶惶，因此造成逃難潮。

    14.張光明的先人於晚清時期來到臺灣，至第 4 代已被視為本省閩南族群；同宗族的張讓則於 1949 年才隨政府軍來臺，兩人語言、血統與風俗習慣應沒有不同，最大的不同即是(C)來臺時間不同。

    15.(A)在兩岸對峙情勢下，臺灣軍費不可能年成長率下滑那麼多。(B)美國自 1960 年代起，一直是臺灣最大的出口國，外匯不可能在 1960 年代開始下滑。(C)自開始工業化發展後，出生率逐漸下降，但臺灣總人口數仍持續上升，是為正解。(D)手機時代來臨後，電話總數應下降。

    16.1987 年政府解嚴後，同年即開放返鄉探親，答案為(B) 1980 年代。

    17.這個族群需要申請工作證件，主要從事機械性勞動或長輩照護，再加上「潑水節」與「開齋日」等關鍵詞，即可推知此族群為來臺工作的國際移工，因此答案為(B)。

    18.澎湖自元朝已納入中國大陸版圖，自然受中國政權保護；(A)臺灣當時不在明朝的主權範圍之內，因此明朝很「慷慨」的默許荷人前往發展。(B)(C)(D)與史實不符。

    19.(A)(B)中華民國領土主權未及於中國大陸地區，兩者皆非事實。(C)除了臺灣，尚有澎湖、金門、馬祖等諸島。(D)為正解。

    20.鄭成功以東都稱臺灣，設一府二縣；鄭經改東都為東寧，並改縣為州。從題文中的東寧、天興州等地名，可判斷為(B)鄭經治臺時期的行政區劃。

    21.(A)晚清臺灣建省後，不再與金馬同隸福建省。(B)日本並未領有金馬地區。(C)為正解。(D)中華民國於 1949 年後已實質統治臺澎金馬。

    22.(甲) 1958 年；(乙) 1949 年；(丙) 1955 年，3 者時間依序為(B)乙丙甲。

    23.題文所述為 1958 年的金門(D)八二三砲戰，也是國府遷臺後兩岸最大的軍事衝突。(A) 1949 年，阻止中共拿下金門。(B)(C)位於浙江省，與金門無關。

    24.1979 年美國與我國斷交後，其國會即通過(C)《臺灣關係法》以與臺灣維持實質關係，為使臺灣有足以自我防禦能力而提供我國防衛性武器。

    25.從「兩岸相隔後首度的正式對談」、「海基會與海協會的事務性會談」等線索，可判斷為(B) 1993 年在新加坡舉行的辜汪會談。

    26.(甲) 1950 年底；(乙) 1979 年；(丙) 1954 年；(丁) 1971 年，因此按時間先後順序為(C)甲丙丁乙。

    27.表格中臺灣地區的數據逐漸減少，中國大陸則大幅增加，正確答案為(D)，反映 1971 年臺灣退出聯合國後，兩岸邦交國的變化。(A)鄧小平於 1978 年才掌政，不可能於 1971 年已超越臺灣。(B)在兩岸對峙的情況下，臺灣軍力不可能進行數量的縮編。(C)在中共極權統治下，中國大陸的民間抗爭數量不可能如此多。

    28.從臺灣變成世界孤兒的說法，可推知指(C) 1971 年退出聯合國，臺灣自此不再是「中國」政權代表，在外交上也愈來愈孤立。

    29.資料一的《開羅宣言》類似新聞公報性質，不具國際條約的效力；資料二的《舊金山和約》雖是國際條約，卻未指出臺灣及澎湖群島的主權歸屬，因此(D)出現臺灣地位未定論說法。(A)《舊金山和約》之前，兩岸早已分治。(B)《舊金山和約》使美國撤出，日本重獲獨立自主地位。(C)並未確認臺澎主權的歸屬。

    30.1996 年正值(B)臺灣舉辦首次總統直選，中共因此對臺近海試射飛彈，形成第 3 次臺海危機。(A) 1970 年代初期。(C) 2000 年。(D) 1999 年。

    31.全臺報時系統於(C) 1910 年代初前完成，自此公私立機構皆依照標準時間作息，養成守時的習慣。

    32.(A)為正解。(B)採漸禁政策。(C)逐步推動各項公共衛生措施，降低死亡率。(D)八田與一的建設。

    33.從每班平均人數與平均每人教育經費的投入，可看出總督府對待公學校學生與小學校學生的差別待遇，(D)為正解。(A)(B)(C) 3 者皆無法從表格資料看出。

    34.這種社會風俗造成走路不穩，甚至上船、過橋都需要人牽扶，可判斷為女子(D)纏裹小腳。

    35.題文可看出總督府並未對鴉片吸食嚴禁或放任，但是限制吸食者的資格，期讓吸食人口逐漸減少，甚至自然消滅，因此其手段為(C)漸禁與專賣制度。

    36.題文所述相關整頓環境與公共衛生的工作，為日治時期的作為，因此「他」最可能是(C)後藤新平。

    37.「漢文欄目都消失了」表示已進入皇民化運動時期，即 1937 ～ 1945 年，答案為(C)。

    38.從表中可知，出生率大致穩定增加，死亡率則有較明顯的下降，最主要的原因應與(D)衛生醫療的改善有關。(A)(C)與死亡率下降無關。(B)臺灣為日本殖民地，經濟談不上繁榮與富庶。

    39.資料一從「天興、萬年二州」可知為鄭氏時期，資料二從「習紅毛字」可知為荷治時期，資料三的教育目標可推知為國民政府時期，因此時間先後順序為(C)資料二→資料一→資料三。

    40.日治時期的「國語」即日語，從政治上來說，是被敵人給同化；從文化來說，能從日文教科書中學得近代文明與知識，因此知識分子才會產生愛恨交錯的複雜情結。(B)的作法較符合題意。(A)(C)(D)的作法比較偏向保留漢文字與漢文化。'
