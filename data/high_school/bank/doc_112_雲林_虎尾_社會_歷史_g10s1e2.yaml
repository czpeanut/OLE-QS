  stem: 某人對臺灣發表文告說：「我們希望雙方儘快實現通航通郵，以利雙方同胞直接接觸，互通訊息，探親訪友，旅遊參觀，進行學術、文化、體育、工藝觀摩。……臺灣和祖國大陸，在經濟上本來是一個整體。這些年來，經濟聯繫不幸中斷。現在，祖國的建設正在蓬勃發展，我們也希望臺灣的經濟日趨繁榮。我們相互之間完全應當發展貿易，互通有無，進行經濟交流。這是相互的需要，對任何一方都有利而無害。」解讀以上文告，下列敘述何者正確？
