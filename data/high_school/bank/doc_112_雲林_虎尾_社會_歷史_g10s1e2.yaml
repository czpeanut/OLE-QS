  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 從文告的用字遣詞可推知為中國大陸方面對臺灣的喊話，此人提出兩岸能「三通」與「四流」的建議，因此可判斷為鄧小平，(C)(D)(E)為正解。(A) 1980 年代。(B)鄧小平的《告臺灣同胞書》。
