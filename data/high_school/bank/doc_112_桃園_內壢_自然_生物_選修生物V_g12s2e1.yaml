  group_stem: 生態學裡，一族群用以避免掠食者或寄生者攻擊的所有可能方式，統稱為「避難所」或「庇護」（refuges）。在沒有任何避難所，且族群無遷入與遷出時，獵物會迅速被掠食者消滅；獵物消失後，掠食者缺乏食物來源，也隨之滅亡。若有避難所，但族群仍無遷入與遷出時，掠食者只能捕捉到部分獵物；掠食者捕捉不到獵物後，掠食者的族群便會滅亡，而獵物族群在無掠食者的情況下，族群大小逐漸增加。如果有避難所，而且族群可遷入與遷出時，掠食者與獵物的族群大小會呈現如課本所述的規律波動現象。而避難所有很多種形式，如獵物可以挖洞穴、爬樹、飛到空中或潛入水中躲避陸地上的掠食者；有些獵物族群利用數量極大的群居生活方式來作為庇護，一方面可以嚇阻掠食者，一方面可以減低個體被捕食的機率；而獵物的體型大小也可以作為庇護，如蚌的體型愈大，被海星捕食的機會愈低；此外，還有非常多不同形式的避難所或庇護，可以使一族群避免被天敵攻擊。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
