- id: doc_112_桃園_內壢_自然_生物_選修生物V_g12s2e1_s3_49
  section: 3
  number: 49
  type: single
  page: 6
  stem: 同樣種類不同巢的蜜瓶蟻在野外相遇，有些採取強勢進攻策略，有些採取投降後偷生卵策略，日後兩類型螞蟻發生生殖隔離，此過程為：
  options:
  - label: A
    content: 異域種化
  - label: B
    content: 同域種化
  - label: C
    content: 競爭排斥
  - label: D
    content: 輻射適應
  group_stem: '在野外可以發現不同種的螞蟻生活在一起，這樣的現象稱為「社會性寄生」，指的是像胡蜂、蜜蜂或螞蟻等社會性昆蟲寄生於其他的社會性昆蟲中。社會性寄生物種的演化有可能源自物種內的遺傳差異，例如美洲沙漠的蜜瓶蟻，同樣種類不同巢的蜜瓶在野外相遇時，若其中一方武力顯著強勢時，將會大舉進攻，殺死弱勢方的蟻后與成熟工蟻，並帶走對方的幼蟲、蛹及年輕的工蟻回到自己的巢內，成為自己巢中的奴隸；然而有時候，弱勢的蜜瓶蟻會採取另一種投降的策略，會向強勢的一方投降並加入其蟻巢，爾後在強勢的蟻巢中偷偷生下自己的卵，日後取代整個蟻巢。使用這樣的投降策略的蜜瓶沒有喪失照顧幼蟲與建立蟻巢的能力。投降又偷生的行為與強勢到處征戰的行為來自於自身遺傳的差異，當這樣的差異愈來愈大，而在日後發生了生殖隔離，便漸漸演化成兩種不同的物種。

    另一種寄生行為稱為暫時社會性寄生。例如山毛蟻屬中的某些螞蟻，在婚飛結束後，不會建立蟻巢，而是侵入別種螞蟻的蟻巢，殺掉對方的蟻后，取代成為新的蟻后並產下自己的卵，漸漸地整個蟻巢被寄生的山毛蟻給取代，暫時社會性寄生的螞蟻仍可產生正常工蟻以維持蟻巢的正常生活。

    還有一種極致的寄生行為，可在寄食寄生家蟻觀察到。這種螞蟻更進一步地失去了工蟻階層，牠們只能藉由寄生在宿主蟻后身上，利用宿主螞蟻來餵養自己並產下後代，後代也都必須倚靠宿主蟻巢的工蟻來照顧，完全沒有辦法獨自生活，成為真正的外寄生蟲。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
