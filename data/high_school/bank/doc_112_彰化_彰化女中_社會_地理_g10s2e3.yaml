  explanation: '從圖中等高線判讀：右側為高山（等高線數值高且密集），河流從右側往左側流，地勢逐漸開展（等高線數值低且寬鬆）。由此判斷此為山腳下常見的(C)山麓沖積扇地形。

    41.1985 ～ 1989 年間，因日幣被迫升值致使日本出口產品變得昂貴，加上課徵關稅對於日本製造的出口產品衝擊嚴重(甲)。日本政府為協助日本企業度過難關便給予低利貸款，原希冀協助日本企業不會因出口獲利減少而資金週轉不靈，但低利政策反而使得大量熱錢被借貸出來流入投資市場，導致日本房市與股市大漲卻沒實質經濟成長支撐，此即為日本泡沫經濟的背景因素之一(丁)。故選(B)。

    42.(丁)對九州自然環境與利用進行整體區域的評估，包括水資源分布、水資源利用對環境生態的影響等。此針對單一區域進行綜合空間與生態觀點的研究又被稱為區域傳統。故選(D)。

    43.此企業旗下子公司眾多，說明其經營規模大，得控制許多零組件生產的成本而創造獲利。此種因企業規模大而帶來的經濟效益，被稱為(B)規模經濟。

    44.規模小的企業在資源與成本上皆難以與大企業抗衡，此將使得韓國的企業生態出現大者恆大，掌握資源的大企業將壟斷資源而加大社會中的貧富差距(乙)。此外，當國家過度依賴數個大企業的發展時，當企業出走時將掏空國家大多數的就業機會及經濟發展命脈，此時將出現當地產業空洞化現象(甲)。故選(A)。

    45.各國貿易往來關稅降低將使得進口商品價格降低，有利於依賴原物料進口的韓國企業降低生產成本(丙)；出口商品也會因關係夥伴國家的關稅減免而降低售價，有利於韓國出口商品的競爭力(丁)；此外，當各國商品得自由貿易往來時，將使得各國較無競爭力的產業被淘汰或被迫轉型提高競爭力，進而留下附加價值較高的產業(甲)。故選(A)。

    46.(D)首爾位於漢江下游沖積平原，因地勢平坦及鄰近水源，自古以來便成為人口聚集地。

    47.(B)韓國政府扶植大財閥使得大企業規模發展愈來愈大，雖然有助於財閥企業轉型，卻因掌握大部分資源，反而造成當地中小型企業沒有發展空間。故使得韓國社會出現貧富差距愈來愈大的現象。

    48.文中所提「高齡化」及「低出生率」推論其人口結構將呈現幼年人口縮減、高齡人口膨脹的(C)縮減型金字塔圖。

    49.(A)從圖中可知：東亞、東南亞、北亞、南亞、西亞、歐洲（西歐與北歐為主）、非洲（南非與埃及）、南美巴西及澳洲為此組織的創始會員國。

    50.(D)甲為新疆地區的重要都市（推測為新疆首府烏魯木齊），該地地處溫帶乾燥氣候區，在發展經濟的過程中，需要解決用水需求量增加但降雨量稀少的問題。'
