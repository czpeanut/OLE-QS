  stem: 臺灣自 17 世紀起開始與世界接軌，先後受到不同文化的洗禮，現今的生活中存在著多元文化的色彩。下列有關臺灣文化景觀的說明，哪些最為合理？(甲)臺鐵「普悠瑪」列車是以臺東西拉雅族語來命名(乙)新北三峽老街的街屋有巴洛克風格紋飾，為荷西時代所留下的建築(丙)臺中大甲鎮瀾宮媽祖遶境活動是由漢人的宗教祭典發展而來(丁)花蓮瑞穗、池上、關山等地名是日本殖民時所留下的地名(戊)燒餅、油條、牛肉麵等美食是隨戰後中國軍民來臺所帶入
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲丁戊
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)普悠瑪稱號源於臺東卑南族，原意為部落首領所在地，延伸有集合團結之意涵；(乙)三峽老街街屋建於日治時期，其建築特色屬於閩南建築，如亭仔腳、女兒牆、狹長屋身等。然建築立面的巴洛克式的雕花裝飾則受日治影響，反映當時日本西化運動的時代特色；(丙)媽祖信仰源於中國閩粵移民，大甲鎮瀾宮的媽祖神像於清雍正時期從湄洲天后宮恭請來臺供奉；(丁)日治時期有規模的鼓勵日人移臺開墾，當時在臺灣東部地區建立了許多日人移民聚落並為該地重新命名，包括瑞穗、關山、池上等；(戊)軍民隨著國民黨撤退來臺時，許多習慣北方麵食的軍眷在取得美援麵粉時，便將中國北方的家鄉麵食透過街邊小食或餐館的方式推廣至臺灣社會。故選(D)。
