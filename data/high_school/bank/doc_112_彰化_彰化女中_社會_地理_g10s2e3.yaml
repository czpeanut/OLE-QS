  - label: C
    content: 熱蘭遮堡—沙洲；台江內海—灣澳
  - label: D
    content: 熱蘭遮堡—海蝕洞；台江內海—海蝕門
  group_stem: '臺南市著名觀光景點「安平古堡」於 2022 年更名為「熱蘭遮堡」掀起民眾熱議。為此文化部在官方臉書說明，「臺灣城殘蹟（安平古堡殘蹟）」與「熱蘭遮城城垣暨城內建築遺構（圖(一)）」兩處國定古蹟均為 1624 年荷蘭人興建於鯤鯓上的熱蘭遮堡（圖(三)）遺構，是荷蘭人在臺灣本島留下最古老的城堡之一；而改稱「熱蘭遮堡」，是依原文或現代英文 Fort Zeelandia 名稱中的「Fort」指防禦功能的「堡壘」翻譯，若依歷史學家連橫譯為「城」則會更有城市（city）之意，較適合府城、安平鎮使用。

    1662 年鄭成功攻臺後遷居此處，因為鄭成功受南明永曆帝封為延平王，此地也有了「王城」的稱呼，同時也將周圍區域依照故鄉命名「安平」。清代以後因為主要政治中心移到較內陸的臺南府城內，年久失修，直到日治時期在此處以西式洋樓與燈塔的風格重新建造為「安平海關宿舍」，也就是今日我們熟知的安平古堡（圖(二)）。今日的「安平古堡園區」同時呈現出荷蘭到戰後民國時代不同的歷史痕跡，也是臺灣多元文化不斷融合、堆疊之成果的最佳見證。請問：'
  shared_asset: g2_27_29
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 文中提及熱蘭遮堡建於鯤鯓，亦即臺灣沿海沙岸常見的沙洲地形；從台江「內海」地名及圖示推論，此為被沙洲陸地環繞而與外海相隔的潟湖地形。故選(B)。
