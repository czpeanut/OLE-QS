  stem: '資料一：1940 年，英國首相邱吉爾在倫敦發表演說：「昔日總有人想藉機入侵英國，而許多歐陸霸主都曾懷有這類癡心妄想……我們要在海灘作戰，我們要在登陸點作戰，我們要在田野和街頭作戰，我們要在山區作戰，我們絕不投降！」

    資料二：1943 年納粹德國親衛隊隊長希姆萊在波蘭發表演講：「如果在每個城市、在炸彈襲擊，……還有人藏於我們之中，祕密破壞與伺機煽動，局勢將會變得非常艱難……我們有道德權利，我們有責任替我們的人民服務，去屠殺可能會殺死我們的人。」

    (1)資料二中希姆萊的演講想達成什麼效果？'
  options:
  - label: A
    content: 對波蘭實施恐怖統治，恐嚇其居民
  - label: B
    content: 達成恐嚇敵軍的效果，打擊其士氣
  - label: C
    content: 合理化納粹德國發起戰爭的行為
  - label: D
    content: 合理化納粹德國屠殺猶太人的理由
  group_stem: '(2)在變法人士對慈禧太后的攻擊中，哪一項屬於性別偏見？我們應該如何看待過去史家對慈禧太后此一評價？

    | 性別偏見（勾選一項） | 如何看待歷史評價（40 字以內） |

    | --- | --- |

    | □迷戀權位 □奢侈浪費 □牝雞司晨 |  |'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)納粹德國在二戰中以滅絕猶太人為主要目標，而希姆萊在演講中強調「有人藏於我們之中」、「去屠殺可能會殺死我們的人」，便是在隱射猶太人會殺死我們，因此要先下手為強，故答案選(D)。

    (2)邱吉爾在演講中指出「我們要在海灘作戰，我們要在登陸點作戰，我們要在田野和街頭作戰，我們要在山區作戰，我們絕不投降」，其中都是使用「我們」，因此可推知是在跟英國人民呼籲，要在各個地方持續作戰，絕不投降，便是在鼓勵人民一同奮戰防止敵軍入侵。希姆萊將屠殺對象設定為「可能會殺死我們的人」，加上「藏在我們之中」，因此不會是敵國而是猶太人，且這樣作是「替我們的人民服務」，代表他是在跟國內人群呼籲，要避免被殺害只能先殺害可能會殺害我們的人。'
