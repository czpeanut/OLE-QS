      - 388.2
      - 338.65
      - 564.3
      - 461.5
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 附圖中女性的鐵鍊代表著傳統女性被要求在家中照顧家人的職責，並且被拒絕擁有選舉權，而拒絕女性擁有參政權的原因，就是認為女性只能在家照顧家人或從事紡織業，也就是傳統社會中身為女性該有的工作分配，不能夠跨越到屬於男性的政治場域，故答案選(C)。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 一位官員在會議上發表談話：「各位本島人（臺人）能活躍於支那四百餘州。在南方、菲律賓、其他地方握有經濟力的華僑諸君，更能不經通譯，自由自在地交談。不僅如此，還能融入各種土人夥伴當中，……本島人能夠發揮民族性，以在本島所受的知識予以指導、與之合作而確立共榮圈。」請問這位官員發表談話的目的為何？
  options:
  - label: A
    content: 以民族主義號召臺人來協助中國抗日
  - label: B
    content: 動員臺人協助日軍並拉攏華僑
  - label: C
    content: 拉攏華僑來抵抗日本入侵
  - label: D
    content: 鼓勵種族仇恨以削弱中國戰力
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)這場談話的內容是鼓勵臺灣人，與中國各地以及東南亞各地的華僑能積極接觸、鼓勵這些華僑加入日本在 1940 年代所提出的「大東亞共榮圈」，因此可知當時在日本殖民下的臺灣人，被日本動員去拉攏華僑支持大東亞共榮圈的政策。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e3_s1_5
  section: 1
