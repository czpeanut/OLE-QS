  page: 1
  stem: 附圖為某一時期的美國雜誌內頁，圖中央的男子左手以金錢誘使流浪者進入投票所投票；右手則虛浮於憂愁的女人旁，該位女性陷於鐵鍊中，旁邊繪有女性照顧家人、遭到逮捕，以及從事紡織業的示意圖，下方則配有「『你』應該待在家裡照顧孩子」、「女人應有選舉權嗎？不，他們會干擾現有的制度」等警語。請問附圖展現女性在爭取基本權益上遇到的何種問題？
  options:
  - label: A
    content: 受限於社會傳統性別角色的分工概念
  - label: B
    content: 教育程度偏低而遭拒於公共事務之外
  - label: C
    content: 工作效率不佳而遭剝奪選舉權
  - label: D
    content: 兩次大戰的勞動貢獻不重視
