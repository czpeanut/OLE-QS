  stem: '慈禧太后作為清末政治局勢的關鍵人物，留下的歷史評價卻十分負面，長年被套上「禍國殃民」的罪名，但是慈禧太后能掌權將近半個世紀，絕對是有相當的政治能力的。有些人將慈禧太后視為清朝改革的阻礙，但維新派本身也有其問題所在，他們缺乏政治歷練又過於躁進，這也是造成改革失敗的原因之。歷史其實是有許多面向的，清朝國力的積弱不振加上「牝雞司晨」的偏見，在清末改革派及革命派的大力宣傳下，慈禧太后成為了眾矢之的，負面形象深植人心。

    (1)下列關於不同身分對於慈禧太后可能的評價，以及背後考量的敘述，哪些是合理的？'
  options:
  - label: A
    content: 維新派對慈禧的負面評價，是因中國在甲午戰爭戰敗
  - label: B
    content: 革命派對慈禧的負面評價，是因為雙方政治立場對立
  - label: C
    content: 中華民國對慈禧的正面評價，在於確立政權的正當性
  - label: D
    content: 中共對慈禧的正面評價，在於同樣提升了女性權益
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)(A)應該是因為慈禧推動戊戌政變，造成戊戌變法失敗。(C)中華民國應會給予負面評價，以證明推翻清朝為正確之舉，才能確立政權正當性。(D)中共給予慈禧的評價應為負面的，且以政治立場而言，中共也不會以女性權益提升為主要考量。

    (2)「牝雞司晨」源自於《尚書》中提到「牝雞司晨，惟家之索」，指的便母雞在清晨鳴叫，這個家庭便要破敗，比喻女性掌權，會導致家破人亡，並作為女性干政的負面評論，因此這是非常具有性別偏見的負面評論。另外，從題文的內容可以看出，慈禧太后的負面評價與「清朝國力的積弱不振」加上「女主干政的偏見」有關，又受到「清末改革派及革命派的大力宣傳」，才會深植人心，因此會出現負面評價並非單一原因，而是有諸多因素導致而成。'
