  stem: '資料一：某項資料指出，英國在 1939 年末開始實施石油的配給制，到了 1942 年中，許多食物皆採取定量配給制，甚至擴及到衣服、鞋子、燃料、肥皂等民生用品。

    資料二： 附圖為美國某個時期的宣傳海報，圖中人物手持乾淨光滑的盤子，上方附有標語「將盤子舔乾淨」，下方標示「不要浪費食物」。

    根據上述，請問我們如何解讀兩則資料？'
  options:
  - label: A
    content: 資料一背景為德國用潛水艇攻擊英國令其斷糧
  - label: B
    content: 資料二展現戰爭後惡性通膨與物資上漲現象
  - label: C
    content: 資料顯示兩國因物資短缺而變成社會主義國家
  - label: D
    content: 兩則資料顯示戰爭時期政府取計畫經濟模式
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e3/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 435.35
      - 629.9
      - 563.6
      - 806.0
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)資料一的時間為第二次世界大戰期間，因此是德國對英國進行大轟炸導致英國物資短缺，需要採行配給制度。(B)應該是戰爭時期物資不足，應該要減少浪費。(C)並未因此變成社會主義國家，只是因為戰爭時期國家會採取計畫經濟的模式加以管制。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 女性權利爭取運動歷經多次波瀾，其訴求包含有：(甲)生育權、墮胎權、薪資平等；(乙)選舉權、參政權、受教育權；(丙)終止性別暴力、性別角色多樣化、性傾向自主選擇等。依你的歷史認知，這些訴求依時間發展順序，正確的選項為何？
  options:
  - label: A
    content: (乙)(甲)(丙)
  - label: B
    content: (甲)(乙)(丙)
  - label: C
    content: (乙)(丙)(甲)
  - label: D
    content: (丙)(甲)(乙)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '女性爭取權利的運動發展乃是 19 ～ 20 世紀初爭取參政權、受教育權；到了 1960 年代爭取生育權、墮胎權、薪資平等，1980 年代第三波女性運動爭取終止性別暴力、性別角色多樣化、性傾向自主選擇等權利，故應選(A)(乙)(甲)(丙)。

    7.1975 年西班牙政府轉變成民主政權後，不處理威權時期的問題，是朝野的共識。2007 年通過《歷史記憶法》後，才要求政府道歉並賠償威權時期的受害者，恢復其名譽與權利，故答案選(B)。(D)此協會為德國設立。

    8.(A)母親應該「自愛身體」，才能帶來兒女的健康，因此是先從愛自己的身體做起。(C)清末甲午戰爭後，因受到瓜分之禍的影響，再加上嚴復引進優勝劣敗的社會達爾文主義的觀念，讓中國知識分子有了救亡圖存的迫切感，並將女性納入其中，主張興女學、廢纏足，才能孕育出身強體健的下一代，故資料一所述的情形在清末時期就已出現，而資料二「共和國母親」的觀念應該在中華民國建立後方被提出的觀念。(D)應為 19 世紀末以後。

    9.題文的兩則資料，都是描寫女性形象對戰爭或社會帶來影響的宣傳。資料一中所提到的送水者莫利的故事，雖非單指某一個特定對象，但「仍鼓勵軍隊士氣」；資料二中秋瑾的烈士形象則帶動革命風潮，因此可看出在戰爭期間或革命期間，關於女性故事的塑造與宣傳下，會達到一定撼動人心的效果，故答案選(C)。

    10.(D)從題目的圖片可看出士兵眼睛都纏上繃帶，代表眼睛受到損傷，但身體四肢卻完好如初，若是遭遇飛機轟炸、坦克、機槍的攻擊，不可能身體四肢無損，只有毒氣施放會造成失明的現象。

    11.從題目的圖片與新聞報導可看出，戰場包括香港、中南半島、東非、北非與歐洲，而只有第二次世界大戰參與戰爭的地區才如此廣泛，因此可知題文所描述的是英國招募其自治領與殖民地的人民參與戰爭，故答案選(D)。

    12.題文提到「茶會」、「……牛油和乳酪，大多來自紐西蘭或加拿大」，而人民日常飲食的習慣以乳製品、咖啡與茶、肉類與鱈魚為主，便可推測應該以歐洲國家為主。當時物資不夠，因此在戰爭期間，有許多乳製品來自紐西蘭與加拿大，而這兩個國家以往為英國的殖民地，後來陸續成為自治領，在戰爭期間也是會對進行英國支援，故答案選(B)。

    13.(B)臺灣因屬於日本殖民地，因此在二戰後期，成為同盟國軍隊轟炸的對象，而在太平洋戰場上與日軍為敵，對日本發動主要攻勢者便是美國。

    14.(A)史塔西為東德時期的特務機構，監控許多東德人民的生活，並將檔案保留下來，因此等到東西德合併後，德國進行轉型正義，將史塔西保存的檔案公開讓受害者知曉，便是一種公開真相的做法，讓受害者知道真相，才有辦法進行和解，更進一步杜絕未來有類似的情事發生。

    15.根據圖中的線索，移出區域包含波蘭、捷克、東普魯士地區、法國等，這些地區恰好都是納粹德國時期，向外擴張併吞或占領的地區。1945 年德國戰敗投降後，同盟國（蘇聯）主導各國邊界重劃，這些占領地區的德國人與德裔人士被迫遷回德國，故答案應為(C)。(A) 1871 年德意志帝國建立，取得法國亞爾薩斯與洛林兩地，反而是居住在這兩地的法國人遷回法國。(B)第一次世界大戰到納粹時期，「東普魯士」地區一直是德國的版圖。因此，理論上無須移民也適用經濟重建方案。(D) 1990 年的法國不是共產政權。

    16.(C)「鬼畜英美」是太平洋戰爭爆發後，由於美、日為敵國，因此日本在戰爭宣傳上常常用此種詞句咒罵敵軍，而臺灣在二戰期間仍屬日本的殖民地，故人民受到日本戰時宣傳的影響，便會有相同的輿論產生。

    17.(乙)佛朗哥為法西斯政權，因此不會推行人道主義，反而要恢復過往的傳統社會，將避孕、墮胎、離婚、同性戀等行為視為違法；(丁)應改為天主教；答案選(C)。

    18.(C)題幹所提到的這些城市，都曾在二戰期間被敵軍大規模轟炸，同盟國對柏林、東京、臺北等地轟炸，軸心國則是對倫敦、重慶等地轟炸。

    19.(A)經濟大恐慌為一戰結束後，於 1929 年發生，爾後也造成納粹的崛起。(B)選項關鍵字都與第一次世界大戰有關。(D)雖然平權運動與石油的爭奪在二戰之後發生，但計畫經濟在二戰前便已出現，二戰後的西歐並未有推行計畫經濟的政策，故不選。

    20.根據題幹內容，這應該是在 1920 年代左右臺灣發展的女權運動。(B)當時臺灣人民被日本殖民，無法參與修法。(C)《婦女新知》雜誌創辦於 1987 年。(D)當時女性爭取參政權並非是主流意見。

    21.該圖為美國發行的海報，而圖中鼓勵人民休息一天的人是日本士兵，加上刻意將日本士兵的形象醜陋化，可知美國發行這張海報的目的，是鼓勵人民不要休息，持續勤奮地工作或參與戰事，不要被敵人給迷惑，故答案選(B)。

    22.題文提及「兩萬名的臺灣青年」、「派遣至新幾內亞、菲律賓和印尼等地，擔任各種任務」等字句可知，應是協助戰場後勤的軍伕，而非親自上戰場的士兵，故答案為(D)。(A)神風特攻隊於 1944 年 10 月才出現，成員以日本人為主，臺灣人不多。(B)臺灣特別志願兵：陸軍從 1942 年開始到到 1945 年止，約 5,500 餘人參加；而 1943 年公布海軍特別志願兵制度，至 1945 年約 11,000 餘人參加，兩者的人數均未超過兩萬名。(C)臺灣少年工多前往日本本土工廠工作，而非南洋。

    23.從題文的資料內容可知當時歐洲工業發展正開始繁榮，且社會主義也盛行，工會組織日漸強大，代表應該是 19 世紀中葉以後的事，加上當時還有奧匈帝國，因此是一戰結束前，故答案選(B)。

    24.(A)德國總理的言論內容可看出，德國對於過往納粹政權的殘暴統治加以批評並進行反省，且「人們有義務協助青年理解」，代表就是要將過往的錯誤糾正，並且教導青年不要重蹈覆轍，屬於釐清真相並反思歷史的範疇，符合轉型正義的精神。

    25.資料一中阿根廷的總統阿方辛上臺後，原本要追究過往軍政時期的罪刑，但「造成依舊手握軍權的軍事將領們的不滿」，因此只好頒布特赦，而南非國民會議想要調查政府濫權，但「軍方和白人政府堅持，若未來必須面對司法追訴，他們將不願交出權力」，因此為了讓政權和平轉移，只好排除懲罰加害者，可知從威權體制轉型到民主政治的過程中，因為有許多官員與公務人員、軍人並未因此而下臺，但這些都曾是威權時期的加害者，若貿然懲處這些成員，有可能會造成反彈，或是無法移轉政權，因此這些國家最終只好妥協以完成政權和平轉移。

    26.(A)選項並非此學者分析的主旨。(B)並非「只是宣傳部門成功」還有包含其他戰略、經濟能力等原因。(D) CPI 於戰爭時期成立。

    27.從老師解說的內容可得知，戰爭在這位女孩身上除了是身體上的傷害外，還有在戰爭結束之後，仍持續存在的陰影，這些痛苦的回憶並非在戰爭結束後就可以輕易擺脫與遺忘。

    28.(B)在戰爭前便已經有許多女性得以接受教育。(C)從題幹可看出因為戰爭缺乏人力，故有許多女性從事看護助手或到國外工作等，因此代表有機會離開家中，就業機會增加。(D)從題幹無法看出。

    29.德國在二戰時期是納粹政權，為法西斯主義，強調領袖至上、國家至上，並且認為透過戰爭可以彰顯民族榮耀與獲得偉大民族的生存空間，因此(B)(甲)(丁)(戊)符合德國納粹政權的立場。(乙)二戰時期的德國不會強調和平；(丙)標語提及「向反法西斯作出貢獻的人民致敬」，故不可能是支持法西斯主義的納粹政權；(己)法西斯主義要維護的是自身民族與國家，不是世界正義。

    30.(A)防彈少年團為南韓的偶像團體，因此在韓戰時，是與北韓為敵，與美國為友，而中國當時在毛澤東的領導下，發起抗美援朝運動，幫助北韓對抗南韓與美國，因此雙方立場不同，自然會發生爭端。

    31.(A)由於伊麗莎白一世在位時，男性在政治上仍是居於主導地位，因此主要爭取的對象應該也包含廣大的男性。(B)無法從他們形象塑造的內容得知他們在乎的是宗教或是經濟。(C)統治者的形象塑造並非誠實的呈現，而是經過刻意修整，符合社會主流的期待。

    32.巴布狄倫是 1960 年代美國著名的歌手，其歌曲作品多為表達反越戰的立場，而從歌詞中也可看出，「你們」指的應該是政府，欺騙人民可以贏得戰爭，但實際上卻是一灘汙穢，展現出他對戰爭與政府的控訴。

    33.(A)英法百年戰爭時期，法國快要被英國打敗時，聖女貞德於奧爾良的鄉村出現，並率領法國軍隊對抗英國，且連連取勝，但她最後遭到俘虜，並被英格蘭審判處死，貞德的事蹟鼓舞了法國人，使法國最終取得勝利。

    34.聖女貞德的事蹟，後來成為法蘭西的精神象徵，在國家遭受威脅時，便會利用貞德的精神，來號召法蘭西人民，所以 19 世紀到兩次的世界大戰，法國都會以貞德為名，凝聚人民的向心力，共同抗戰，故答案選(A)。(B)在父權社會下認為貞德是受到上帝眷顧的個案，並非代表全體女性都有如同貞德般的能力。(C)仍然存在對女巫處以火刑。(D)法國的女子教育最早開始於 16 世紀的宗教改革。

    35.(C) 1980 年代以後的第三波婦女運動，關注黑人與第三世界的女性權利，另外還有性別多元與包容差異等內涵。根據題幹的內容，白人的嬰兒被抱在黑人婦女懷中哺乳，引發社會討論，認為這是對於黑人女性的傷害，重新再現過往種族不對等的社會現象。

    36.(D)因為過往第一波與第二波的婦女運動，多半都以白人女性的權益為主，然而身為有色人種或第三世界的婦女，不僅因性別被壓迫，還會因膚色、種族而被雙重壓迫，這是前兩波女性運動忽略不談的部分，而 1980 年代後，則開始被重視。

    37.在二戰期間，美國參戰，但因美國本土並未成為戰場，平民死亡人數必定是最低的，因此乙國可能為美國；而中國在 1937 年就展開對日抗戰，且整個中國從東北到華南都淪為戰場，因此死亡人數必定最多，因此甲國應該為中國，故答案選(A)。

    38.波蘭在二戰開始不久後便被德國打敗，國土遭德、蘇瓜分，在經過希特勒設立集中營實行大規模的種族滅絕計畫，德國在波蘭境內屠殺的猶太人，總人數超過 300 萬，將近 90 ％的波蘭裔猶太人幾乎慘遭殺害，因此波蘭雖然軍事人員死傷人數不多，但平民的死亡人數卻是相當可觀。

    39.資料二為《刑法．一百條》的內容，然而中華民國政府在臺灣開始實行威權統治時，通過《懲治叛亂條例》當中的〈第二條第一項〉，便是將《刑法．一百條》的內容加重，處以死刑，因此成為白色恐怖時期政府剷除異己的最佳工具，故答案選(C)。

    40.(D)野百合學運後，總統召開國是會議、廢除萬年國會，也廢除《動員戡亂時期臨時條款》，並進行中央民意代的全面改選，緊接著在 1990 年代的臺灣，廢除威權時期的惡法，甚至開放了省長、直轄市長與總統的全民直選，這些都能彰顯出臺灣政治環境的改變，而人民在法律上也漸漸獲得應有的權利。'
