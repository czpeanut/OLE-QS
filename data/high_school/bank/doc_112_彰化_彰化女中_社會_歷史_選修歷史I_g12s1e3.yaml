- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 民初，中國上海《申報》刊載了一篇文章：「昔日女子能文者少，今日女子入學堂者多。昔日女子多柔順之氣，今日女子多英爽之氣。昔日女子謹守閨中羞不見客，今日女子靴聲橐橐（步履聲），馬路中疾行如飛。昔日女子主中饋惟酒食是議（供膳諸事），今日女子結隊成軍，頗有鐵血主義。」這篇文章的主旨與下列何者有關？
  options:
  - label: A
    content: 西方文化入侵，婦德面臨危機
  - label: B
    content: 女性走出家庭，至前線保家衛國
  - label: C
    content: 女性意識抬頭，男性權威受到挑戰
  - label: D
    content: 提倡進步思想，批判傳統歷史文化
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 文章中指出今日女子「多英爽之氣、「靴聲橐橐（步履聲），馬路中疾行如飛」、「結隊成軍，頗有鐵血主義」都顯示出女子從軍的威武英姿。(A)(C)文章中對今日女子的改變抱持正面態度，並非認為傳統婦德面臨危機，或男性權威受到挑戰。(D)題文內容沒有明確批判傳統歷史文化的評論。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 歷史上某日，某國的皇儲在塞拉耶佛訪問時遭到刺殺身亡，加上當時國際上的兩大軍事陣營的結盟牽扯，因而演變成大規模戰事。「兩大軍事陣營」所指為何？
  options:
  - label: A
    content: 同盟國與軸心國
  - label: B
    content: 同盟國與協約國
  - label: C
    content: 法國與反法陣營
  - label: D
    content: 民主集團與共產集團
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)題幹所述為第一次世界大戰（歐戰）爆發的背景，而當時參戰的國家為同盟國與協約國。
- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e3_s1_3
  section: 1
