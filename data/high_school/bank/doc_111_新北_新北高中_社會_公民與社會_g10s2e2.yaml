  stem: 《人類免疫缺乏病毒傳染防治及感染者權益保障條例》規定：「感染者之人格與合法權益應受尊重及保障，不得予以歧視，拒絕其就學、就醫、就業、安養、居住或予其他不公平之待遇，相關權益保障辦法，由中央主管機關會商中央各目的事業主管機關訂定之。」請問依照此法規，小智可以如何主張自己的權益？
  options:
