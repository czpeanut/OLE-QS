  answer_status: verified
  answer_source: answer_key
  explanation: (乙)題文提到臺鐵「因為引起侵犯人權的疑慮，緊急宣布不會啟動人臉辨識的功能。對此臺鐵認為各界對於人臉辨識功能及適法性仍有疑慮，將不使用此項功能」，可知臺鐵並非認為沒有法律問題。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 下課時同學針對此一案件發表看法，以下哪位同學的發言較為正確？
  options:
  - label: A
    content: 甲：「我國《憲法》第 14 條明訂結社自由的保障，包括黑幫組織」
  - label: B
    content: 乙：「結社行為由成員自主決定，也較能發揮主權在民的精神」
  - label: C
    content: 丙：「結社自由是為了讓人民的意見集中，但並非各種結社都應保障」
  - label: D
    content: 丁：「主管機關應事先審查人民之政治主張，才能杜絕黑幫成立」
  group_stem: 2021 年 9 月我國發生一起住處開槍及丟擲土製手榴彈燒車案件，犯案的黑幫小弟甲男到乙女的母親家作案，犯案後 1 小時即攜槍投案，到案時態度淡定，向警方表明要僱用律師保障法律權益。整個過程是典型的黑幫警示報復及投案 SOP，警方表示：本案後續將追查甲男相關資訊，以揪出隱身幕後的人士及組織。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)黑幫組織影響社會秩序，並不包含在結社自由當中。(B)主權在民指的是國家主權屬於全體國民，與結社自由無關。(D)民主政府不會事先審查人民的主張，這是屬於言論自由的保護，與杜絕黑幫成立無關。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 民主國家雖尊重人民的結社自由，但也並非毫無限制。上述題文中這類結社被限制結社自由最有可能的原因為下列何者？
  options:
  - label: A
    content: 避免影響公序良俗
  - label: B
    content: 增進公共利益
  - label: C
    content: 避免緊急危難
  - label: D
    content: 避免政黨危害民主憲政發展
  group_stem: 2021 年 9 月我國發生一起住處開槍及丟擲土製手榴彈燒車案件，犯案的黑幫小弟甲男到乙女的母親家作案，犯案後 1 小時即攜槍投案，到案時態度淡定，向警方表明要僱用律師保障法律權益。整個過程是典型的黑幫警示報復及投案 SOP，警方表示：本案後續將追查甲男相關資訊，以揪出隱身幕後的人士及組織。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 黑幫不受結社自由的保護，主要是因為其影響了公共秩序與善良風俗，故選(A)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 關於司機對於臺北市交通警察大隊的行政處分，認為違法或不當，以致損害其權利或利益，其救濟權利的做法下列何者正確？
  options:
  - label: A
    content: 可向臺北地方法院行政訴訟庭提起訴願
  - label: B
    content: 訴願不服，可向最高行政法院提起行政訴訟
  - label: C
    content: 做處分的機關如果認為處分並無不當時，可送交上級機關審查
  - label: D
    content: 訴願的目的是透過司法機關的審查，行政處分可自行撤銷或變更原處分
  group_stem: 臺北市一名司機和機車騎士發生車禍，事後為向騎士求償，便向臺北市交通警察大隊申請調閱道路交通事故調查報告表及筆錄，卻被警方以文件含有雙方隱私資料為由拒絕，司機因此提起訴願，卻遭駁回，但司機不放棄，轉而提起行政訴訟，臺北高等行政法院認為，車禍調查卷宗並非法律規定不能公開的政府資訊，因此判警方敗訴，應讓司機閱覽相關卷宗。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是對做出處分的機關提出，做處分的機關如果認為處分並無不當時，可送交上級機關審查。(B)此屬於交通裁決事件，依據《行政訴訟法》的修法，自 2023 年 8 月 15 日起，應向高等行政法院地方行政訴訟庭提出行政訴訟。(D)訴願是透過行政機關的審查，非司法機關。
