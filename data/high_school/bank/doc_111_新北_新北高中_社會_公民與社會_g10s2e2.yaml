  stem: 法律保留原則，又稱「積極依法行政原則」。主要目的在於限制行政機關的行政行為，以避免人民權益遭受國家不法侵害。請問下列有關於主管機關所為的行政行為，下列何者須受到此原則的規範？
  options:
  - label: A
    content: 警察針對特定路段違停車輛進行開單
  - label: B
    content: 警方針對特定路段的汽車駕駛人攔停施以酒測
  - label: C
    content: 徵收土地公告期滿，主管機關來函限期遷移或拆除
  - label: D
    content: 政府透過電視廣告向民眾宣導預防流行性感冒的基本觀念
  - label: E
    content: 某國立大學在網站上公布各系所的招生簡章
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (D)宣導並無限制人民的權利與義務，與法律保留原則無關。(E)公布招生簡章，並沒有限制人民的權利與義務，與法律保留原則無關。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s2_48
  section: 2
  number: 48
  type: multiple
