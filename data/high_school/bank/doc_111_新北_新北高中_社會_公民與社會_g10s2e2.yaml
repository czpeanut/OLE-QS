  stem: 訴願制度是配合行政訴訟制度而設計，人民提起訴願時，訴願書先送交原處分機關，原處分機關得撤銷或變更原處分，或是寫答辯書連同人民訴願書一起送交上級機關。請問此制度的主要目的，在於下列何者？
