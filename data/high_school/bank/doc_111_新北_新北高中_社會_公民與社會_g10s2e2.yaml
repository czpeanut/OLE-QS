  - label: C
    content: 賦予原處分機關，有權利拒絕人民提出訴願的申請
  - label: D
    content: 透過分層負責機制，授權原處分機構決定訴願結果
  group_stem: 當人民權利遭受到公權力之違法侵害時，能尋求行政救濟途徑，主張並維護自己依法應享有之權利，而公務員了解依法行政的重要性、行政救濟的制度，當面臨人民請求行政救濟時，能有效因應處理。
  answer:
