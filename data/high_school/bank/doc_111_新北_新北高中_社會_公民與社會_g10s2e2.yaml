  stem: 「違憲審查機制」會依據釋憲的聲請者不同，而其所需具備的聲請要件有所不同，下列案例中的釋憲聲請，何者與上述文中所需具備的釋憲聲請要件相同？
  options:
  - label: A
    content: 人權協會等多組團體，因認為法規限制欠稅人出境的制度違憲，而聲請釋憲
  - label: B
    content: 臺北市府民政局，因認為法律限制同性婚姻者的合法保障違憲，而聲請釋憲
  - label: C
    content: 立法委員，因認為國民身分證換發時須強迫按捺指紋建檔違憲，而聲請釋憲
  - label: D
    content: 法院法官，因審理原住民獵人違法狩獵案時認為相關條例違憲，而聲請釋憲
  group_stem: 「憲政主義」的精神在於透過憲法保障人民基本權利與限制政府權力，當人民所應受憲法保障的權利受到不當侵害時，「違憲審查機制」就提供了人民最終而有效的救濟途徑；以〈司法院釋字第 684 號解釋〉為例，起因三起學生權益受損事件：(1)陳姓某碩士生因申請跨學院選修課程，被校方以非該院學程學生而否決其申請；(2)蔡姓某碩士生因申請張貼支持特定某政治人物海報，但遭校方否准於學校公告欄上張貼；(3)龍姓某技術學院學生，因認為期末考教授批改試題不公，而導致其無法如期畢業；三者皆經申訴、訴願後提起行政訴訟，卻受法院以不合法為由駁回聲請，因此分別聲請釋憲，而大法官釋憲表示：當大學侵害學生的權利，政府應依照《憲法》賦予人民有權利即有救濟之意旨，允許學生可尋求合法救濟途徑。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 釋憲的申請，可由個人或法人、行政機關執行職務時、立法委員修法立法時、法官審理案件時，若認為有牴觸憲法的疑義，可暫停先聲請釋憲。故本題題文為個人聲請，與法人同屬人民權益受侵犯時提出，故選(A)。(B)行政機關聲請。(C)立法委員聲請。(D)法官聲請。
