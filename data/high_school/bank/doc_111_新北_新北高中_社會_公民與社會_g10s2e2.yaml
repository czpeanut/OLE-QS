- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 依據題文內容，第二段畫底線處應當為何種限制基本人權應遵循之原則？
  options:
  - label: A
    content: 明確性原則
  - label: B
    content: 法律保留原則
  - label: C
    content: 法律優越原則
  - label: D
    content: 比例原則
  group_stem: '<u>第 1.～3. 題為題組</u>

    2019 年 11 月 5 日，臺鐵宣布在豐原站試辦「智慧型影像監控系統工程」，並使用人臉辨識系統，主要是為了警務用安全名單（黑名單）、人員異常停留或逗留、跨越月臺區警示線、火警偵測等安全目的。隔日，即因為引起侵犯人權的疑慮，緊急宣布不會啟動人臉辨識的功能。對此臺鐵認為各界對於人臉辨識功能及適法性仍有疑慮，將不使用此項功能，並已協調鐵道局及鐵警局取消其中人臉辨識功能及安全特殊名單（警務用），以確保民眾基本權利不受侵害。

    法界一般認為人臉辨識系統為了安全理由，拍攝人們公共場所走動沒有隱私問題，但人臉資料若再搭配上其他個人資料，可以拼湊出一個人的生活習慣，該方法有可能過度侵害基本人權。而車站屬公共場所，為維護公眾安全利益，臺鐵此舉是否侵害基本人權，是否符合＿＿＿原則是關鍵。

    針對臺鐵作法，民眾普遍認為如果是基於安全理由尚可接受，更何況只要「不犯法」就沒有事了。但在歐美國家十分重視基本人權，美國加州已於 108 年 10 月，立法禁止警方在值勤時大量蒐集的人臉影像，運用於人臉辨識系統，作為犯罪偵察工具，避免侵犯基本人權。而歐洲機場也有人臉辨識系統，但只要旅客一登機，或者 24 小時候，系統就會自動銷毀人臉資料，不另做其他用途。

    人臉辨識系統確實有機會提升安全性，校園內如果採用也可以進一步提升校園的安全性，但蒐集來的資料，卻有可能受到不法的使用，進一步侵犯基本人權，這點也是目前最大的爭議點之一，蒐集來的人臉資料如何被利用，以及被運用的範圍與程度，應當是人臉辨識系統的最大癥結點。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)題文提到，該方法可能會「過度」侵害基本人權，可推論應當是違反比例原則。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 依據題文，臺鐵取消人臉辨識系統功能的主要原因是，下列何種衝突所導致？
  options:
  - label: A
    content: 社會秩序與自由權
  - label: B
    content: 國家安全與自由權
  - label: C
    content: 國家安全與隱私權
  - label: D
    content: 社會秩序與隱私權
  group_stem: '<u>第 1.～3. 題為題組</u>

    2019 年 11 月 5 日，臺鐵宣布在豐原站試辦「智慧型影像監控系統工程」，並使用人臉辨識系統，主要是為了警務用安全名單（黑名單）、人員異常停留或逗留、跨越月臺區警示線、火警偵測等安全目的。隔日，即因為引起侵犯人權的疑慮，緊急宣布不會啟動人臉辨識的功能。對此臺鐵認為各界對於人臉辨識功能及適法性仍有疑慮，將不使用此項功能，並已協調鐵道局及鐵警局取消其中人臉辨識功能及安全特殊名單（警務用），以確保民眾基本權利不受侵害。

    法界一般認為人臉辨識系統為了安全理由，拍攝人們公共場所走動沒有隱私問題，但人臉資料若再搭配上其他個人資料，可以拼湊出一個人的生活習慣，該方法有可能過度侵害基本人權。而車站屬公共場所，為維護公眾安全利益，臺鐵此舉是否侵害基本人權，是否符合＿＿＿原則是關鍵。

    針對臺鐵作法，民眾普遍認為如果是基於安全理由尚可接受，更何況只要「不犯法」就沒有事了。但在歐美國家十分重視基本人權，美國加州已於 108 年 10 月，立法禁止警方在值勤時大量蒐集的人臉影像，運用於人臉辨識系統，作為犯罪偵察工具，避免侵犯基本人權。而歐洲機場也有人臉辨識系統，但只要旅客一登機，或者 24 小時候，系統就會自動銷毀人臉資料，不另做其他用途。

    人臉辨識系統確實有機會提升安全性，校園內如果採用也可以進一步提升校園的安全性，但蒐集來的資料，卻有可能受到不法的使用，進一步侵犯基本人權，這點也是目前最大的爭議點之一，蒐集來的人臉資料如何被利用，以及被運用的範圍與程度，應當是人臉辨識系統的最大癥結點。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文可知，臺鐵引進人臉辨識系統是為了維護社會秩序，但也產生了隱私權的疑慮，故答案選(D)。(A)此處與自由權無關。(B)此處與國家安全、自由權無關。(C)與國家安全無關。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 臺鐵為公家機關，針對臺鐵試圖使用人臉辨識系統的相關敘述，下列哪些正確？(甲)臺鐵是基於《憲法》第 23 條的正當目的下，試圖使用人臉辨識系統；(乙)臺鐵認為使用人臉辨識系統沒有法律上的問題，但人民仍有疑慮；(丙)臺鐵在為了維護安全的目的下，手段似乎不太為部分人民所接受；(丁)若是為了維護安全，應當還有其他的方法可以採行無須使用此法；(戊)手段與目的之間不相稱，是臺鐵遭受質疑的另外一個重要之原因
  options:
  - label: A
    content: (甲)(乙)(丙)(戊)
  - label: B
    content: (甲)(乙)(丙)(丁)
  - label: C
    content: (乙)(丙)(丁)(戊)
  - label: D
    content: (甲)(丙)(丁)(戊)
