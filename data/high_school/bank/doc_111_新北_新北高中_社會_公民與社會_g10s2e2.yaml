  group_stem: 臺北市一名司機和機車騎士發生車禍，事後為向騎士求償，便向臺北市交通警察大隊申請調閱道路交通事故調查報告表及筆錄，卻被警方以文件含有雙方隱私資料為由拒絕，司機因此提起訴願，卻遭駁回，但司機不放棄，轉而提起行政訴訟，臺北高等行政法院認為，車禍調查卷宗並非法律規定不能公開的政府資訊，因此判警方敗訴，應讓司機閱覽相關卷宗。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)閱覽卷宗不得出借攜出。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 大量使用塑膠吸管所造成的健康與海洋生態破壞問題讓人擔憂。假定某國的民意強烈要求政府應立刻大幅度限制塑膠吸管的使用，且依據現行法律，主管機關已有充分法律授權可發布命令、訂定實施細則與開始日期，以管制塑膠吸管使用；但該機關卻認為茲事體大，仍依循該國法律對制訂行政命令的過程，預先將草案公告周知，並依法舉辦聽證，廣納各界意見，再審慎決定規定內容。請問若該國行政法的原理原則與我國相同，則其主管機關訂定行政命令的過程，最適宜用哪項法律原則說明？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 正當程序
  - label: C
    content: 信賴保護原則
  - label: D
    content: 誠信原則
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到「該機關卻認為茲事體大，仍依循該國法律對制訂行政命令的過程，預先將草案公告周知，並依法舉辦聽證，廣納各界意見，再審慎決定規定內容。」可知屬於正當程序的法律原則，故選(B)。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 根據題文，關於國家公權力是否得以限制人民之基本人權，以下何者正確？
  options:
  - label: A
    content: 《憲法》應維護人之人性尊嚴，不得以任何形式限制基本人權
  - label: B
    content: 若具有正當目的，可以使用各種手段限制犯罪者的自由權
  - label: C
    content: 強制工作限制受處分人的自由，是刑罰自由刑的其一手段
  - label: D
    content: 若要限制人的基本權利，不應以極大損害換取較小的利益
  group_stem: '強制工作是刑罰之外另外附加的一種「保安處分」，根據《刑法》第 90 條規定「有犯罪之習慣或因遊蕩或懶惰成習而犯罪者，於刑之執行前，令入勞動場所，強制工作。」相關規定意謂上述犯罪者，除了須入監服刑，法官尚可宣告犯罪者在入監前執行強制工作，期間為三年，必要時還可延長至四年半。而《組織犯罪防制條例》、《竊盜犯贓物犯保安處分條例》也都有強制工作之相關規定。目前執行強制工作的場所，男性是在臺東泰源技能訓練所，女性則是在高雄女子監獄技能訓練及自營工場，這兩個執行場所都是法務部矯正署所屬矯正機關，皆有收容一般受刑人。部分受處分人及律師認為強制工作有侵害《憲法》所保障之人性尊嚴、人身自由與一罪二罰的疑慮，因此提出釋憲申請，司法院大法官為「強制工作」釋憲案，於 2021 年 10 月 12 日在憲法法庭舉行言詞辯論，並於 12 月 10 日宣示釋憲結果。

    日前各技能訓練所對於強制工作受處分人之執行方式，與一般受刑人無異。受刑人與強制工作受處分人是收容於同一個矯正機關，都要強制性工作或參與作業，強制工作與徒刑於此並無明顯區隔，不但與保安處分性質不符，更使強制工作處分形同延長對受處分人的刑期。於強制工作處分期間，受處分人不僅人身自由受到限制，強制工作因所能提供的工作種類有限，更不可能依受處分人的意志自由選擇，這種職業自由的禁止或剝奪，更是侵害人格發展自由，進而違反人性尊嚴。

    就保安處分中強制工作的性質與目的來看，是藉由強制工作來矯正犯罪行為人。但其將「遊蕩或懶惰成習」當作是犯罪原因的思考邏輯，是以為當人願意勤奮工作時，便不會去犯罪。如果立法者的邏輯是「能工作＝不犯罪」，那麼解決犯罪問題的最佳方法應該是提高就業率才對，強制工作並不一定能夠達其目的。綜合考量強制工作的法律規範及實務現況後，該制度是否符合比例原則也是一大爭議點。強制工作的執行方式是剝奪人身自由，且帶有強制性質手段，<u>若說目的是為了矯治犯罪人，立法者就必須提出強制工作手段對於欲達成的目的間，是有必要且有效的堅強理由，如此才得以通過比例原則的檢驗</u>。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 屬於比例原則的概念，故選(D)。(A)國家可依法限制部分人權，例如：題文即提到保安處分中的強制工作。(B)並非是具有正當性即可使用各種手段限制犯罪者的自由，仍須依據相關法律原則，例如：比例原則。(C)依據題文可知，強制工作屬於保安處分，並非是刑罰中的自由刑。
