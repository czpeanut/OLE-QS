  stem: 臺灣目前以《司法院釋字第七四八號解釋施行法》保障同性的婚姻權利，但若為跨國婚姻，只能與同婚通過的國家公民結婚，來自中國大陸以及香港、澳門則無法結婚。請問受此限制影響的情侶捍衛基本權利之理由與何者「相同」？
  options:
  - label: A
    content: 母親爭取對孩子的親權之行使與父親相同
  - label: B
    content: 原住民族劃分傳統領域保存自身多元文化
  - label: C
    content: 人民有權拒絕警方未具備正當理由之臨檢
  - label: D
    content: 高中生可以因不滿學校處分提出行政訴訟
  - label: E
    content: 陸籍新移民要求取得國籍年限同其他國家
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文可知，此應為平等權的議題。(B)屬於文化權。(C)屬於人身自由。(D)屬於訴訟權。
- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s2_49
  section: 2
  number: 49
  type: multiple
  page: 10
  stem: 甲就讀某公立高中，因為學習成績不佳，經常被老師訓斥其將來沒有出息。某次期末考試時，一位老師指控甲作弊，當天經由校長裁處給予甲記一次大過處分。就本事件所涉及的校園人權問題，下列敘述哪些是正確的？
  options:
  - label: A
    content: 學校老師訓斥甲沒有出息的言行，涉及侵害甲的人格權利
  - label: B
    content: 甲若作弊被依校規處罰，校方亦應給甲申訴及答辯的機會
  - label: C
    content: 老師不會故意汙衊學生，若罪證確鑿則無申訴與答辯必要
  - label: D
    content: 甲遭受記過處分，依大法官釋憲結果可提起行政爭訟救濟
  - label: E
    content: 該高中對甲記過處分屬於行政指導，故甲可以提行政救濟
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (C)老師並非聖人，仍有可能犯錯。(D)應當先在校內對學生獎懲委員會提出申訴。(E)對學生單方面的行政行為，屬於行政處分非行政指導。
