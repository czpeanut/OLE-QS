- id: doc_111_新北_新北高中_社會_公民與社會_g10s2e2_s1_31
  section: 1
  number: 31
  type: single
  page: 7
  stem: 請問上文中(甲)應填入哪一個一般原理原則較適合？
  options:
  - label: A
    content: 平等原則
  - label: B
    content: 信賴保護原則
  - label: C
    content: 比例原則
  - label: D
    content: 明確性原則
  group_stem: '國家發展委員會的公共政策網路參與平臺，讓許多民眾可以將創意見解或政策建言，透過附議過程形成點子，協力擴大政府的施政效能，2017 年年底有網友提案要求「禁止中國五星旗在臺灣公開懸掛、展示、陳列」，提案指認為中國大陸不承認和接受臺灣是一個主權獨立國家，也從不放棄分裂臺灣國土，但臺灣卻沒有太多積極作為，對於五星旗的存在有無危機意識，可能會出現中國統戰臺灣的效果，因此要求增設《刑法》條文分裂國土外患內亂罪，禁止五星旗公開懸掛、展示、陳列。

    法務部對此回應，言論自由有實現自我、溝通意見、追求真理、滿足人民知的權利，形成公意，促進各種合理的政治及社會活動之功能，乃維持民主多元社會正常發展不可或缺之機制（司法院釋字第 509 號解釋參照），其以法律加以限制者，自應符合(甲)之要求。再者，分裂國土係政治概念，不僅欠缺明確、客觀可辨之概念外延，更亦隨執法者之政治偏好，乃至政治情勢變遷而改變其內涵，以其為法律概念，實難為受規範之一般人民可以理解或預見，有違(乙)的要求。若是強行增訂，則自由權利遭受侵奪的人民因司法機關無權解釋，以致於救濟無門，或法律因立法從嚴，執法從寬，導致欠缺實效性，而淪為具文。（引用自：公共政策網絡參與平臺）'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到「法務部對此回應，言論自由有實現自我、溝通意見、追求真理、滿足人民知的權利，形成公意，促進各種合理的政治及社會活動之功能，乃維持民主多元社會正常發展不可或缺之機制（司法院釋字第 509 號解釋參照），其以法律加以限制者，自應符合(甲)之要求。」，可知應為基本權利與限制程度的考量，屬於比例原則，故選(C)。
