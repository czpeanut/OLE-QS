  explanation: '二次函數 y＝$ax^{2}$－bx＝x（ax－b）和 x 軸交於（0，0）與$\left( \frac{b}{a} , 0 \right)$

    (A)╳：－1＜$\frac{b}{a}$＜0

    $\Rightarrowy = \left( \frac{a}{b} \right) ^{x}$圖形不合

    (B)╳：0＜$\frac{b}{a}$＜1$\Rightarrow\frac{a}{b}$＞1

    $\Rightarrowy = \left( \frac{a}{b} \right) ^{x}$圖形不合

    (C)╳：－1＜$\frac{b}{a}$＜0

    $\Rightarrowy = \left( \frac{a}{b} \right) ^{x}$圖形不合

    (D)○：0＜$\frac{b}{a}$＜1$\Rightarrow\frac{a}{b}$＞1

    $\Rightarrowy = \left( \frac{a}{b} \right) ^{x}$圖形合

    (E)╳：－1＜$\frac{b}{a}$＜0

    $\Rightarrowy = \left( \frac{a}{b} \right) ^{x}$圖形不合

    故選(D)'
