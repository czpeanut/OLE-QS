  stem: log2$\approx$0.3010，log3$\approx$0.4771，log7$\approx$0.8451，$\left( \frac{5}{6} \right) ^{1000}$小數點後第α位開始出現不為 0 的數字，且第一個不為 0 的數字為β；$\left( \frac{6}{5} \right) ^{1000}$的整數部分有 p 位，且整數部分之最高位數字為 q，下列敘述何者正確？
  options:
  - label: A
    content: α＝80
  - label: B
    content: p＝79
  - label: C
    content: β＝1
  - label: D
    content: q＝1
  - label: E
    content: α＋β＝p＋q
  explanation: '$\log \left( \frac{5}{6} \right) ^{1000}$＝$1000\log \frac{5}{2\times 3}$＝1000（log5－log2－log3）

    ＝1000（1－2 log2－log3）$\approx$1000×（1－2×0.3010－0.4771）

    ＝－79.1＝－80＋0.9

    得第 80 位開始出現不為 0 的數，又 log8＝3 log2$\approx$3×0.3010＝0.9030

    則 log7＜0.9＜log8

    $\Rightarrow$第一個不為 0 的數字為 7

    $\Rightarrow$α＝80，β＝7

    而$\log \left( \frac{6}{5} \right) ^{1000}$＝$1000\log \frac{6}{5}\approx$79.1＝79＋0.1

    得整數部分為 80 位數，又 0＝log1＜0.1＜log2

    $\Rightarrow$最高位數字為 1

    $\Rightarrow$p＝80，q＝1

    故選(A)(D)'
