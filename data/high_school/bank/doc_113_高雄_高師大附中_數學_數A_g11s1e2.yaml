  stem: 方程式$\log _{4}x -\log _{x}8 +\frac{5}{4}= 0$的解為 x＝＿＿＿＿。
  explanation: '令 t＝$log_{2}$x，則 $log_{x}$2＝$\frac{\log 2}{\log x}$＝$\frac{1}{\frac{\log x}{\log 2}}$＝$\frac{1}{\log _{2}x}$＝$\frac{1}{t}$

    又 $log_{4}$x＝$\frac{\log x}{\log 4}$＝$\frac{\log x}{2\log 2}$＝$\frac{1}{2}\log _{2}x$＝$\frac{1}{2}t$， $log_{x}$8＝$\frac{\log 8}{\log x}$＝$\frac{3\log 2}{\log x}$＝3 $log_{x}$2＝$\frac{3}{t}$

    得$\log _{4}x -\log _{x}8 +\frac{5}{4}= 0$

    $\Rightarrow\frac{1}{2}t -\frac{3}{t}+\frac{5}{4}= 0$

    $\Rightarrow2t^{2}$－12＋5t＝0

    $\Rightarrow$（2t－3）（t＋4）＝0

    $\Rightarrow$t＝$\frac{3}{2}$或－4

    $\Rightarrowlog_{2}$x＝$\frac{3}{2}$或－4$\Rightarrow$x＝$2^{\frac{3}{2}}$＝$2\sqrt{2}$或 x＝$2^{－4}$＝$\frac{1}{16}$

    故 x＝$2\sqrt{2}$或$\frac{1}{16}$'
