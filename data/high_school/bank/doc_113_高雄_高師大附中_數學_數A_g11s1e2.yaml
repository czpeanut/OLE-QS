  stem: 一病患接受全身麻醉注射。已知麻醉藥劑在人體中，每 1 小時會代謝體內剩餘藥劑的 10 ％，且當體內藥劑少於原先注射藥劑的 30 ％時，人體就不會有麻醉藥劑的危險。請問病患在接受注射後最少應觀察＿＿＿＿小時，才能保證沒有麻醉藥劑的危險？（已知 log3$\approx$0.4771，無條件進位取至整數）
