  stem: 令坐標平面上滿足 y＝logx 的點（x，y）所成的圖形為Γ，試問滿足下列哪些關係式的（x，y）所成的圖形與Γ 完全相同？
  options:
  - label: A
    content: y＋5＝log（5x）
  - label: B
    content: 5y＝$logx^{5}$
  - label: C
    content: 4y＝$logx^{4}$
  - label: D
    content: 2y－2＝$\log \left( \frac{x}{10} \right) ^{2}$
  - label: E
    content: $x^{3}$＝$10^{3y}$
  explanation: '(A)╳：y＋5＝log5x$\Rightarrow$y＝logx＋log5－5，為Γ 圖形平移

    (B)○：5y＝$logx^{5}\Rightarrow$5y＝5 logx$\Rightarrow$y＝logx，和Γ 圖形完全相同

    (C)╳：4y＝$logx^{4}\Rightarrow$4y＝4 log∣x∣$\Rightarrow$y＝log∣x∣，和Γ 圖形不同

    (D)╳：2y－2＝$\log \left( \frac{x}{10} \right) ^{2}\Rightarrow$2y－2＝$2\log \left| \frac{x}{10} \right|$

    $\Rightarrow$y－1＝log∣x∣－log10

    $\Rightarrow$y＝log∣x∣，和Γ 圖形不同

    (E)○：$x^{3}$＝$10^{3y}\Rightarrowlogx^{3}$＝$log10^{3y}\Rightarrow$3 logx＝3y$\Rightarrow$y＝logx，和Γ 圖形相同

    故選(B)(E)'
