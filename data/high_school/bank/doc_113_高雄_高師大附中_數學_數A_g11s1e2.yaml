  explanation: '設 P（$x_{1}$，3），Q（$x_{2}$，12）代入$y = \left( \frac{1}{2} \right) ^{x}$

    $\Rightarrow\begin{cases}\left( \frac{1}{2} \right) ^{x_{1}}= 3 \cdots \cdots \cdots \cdots \cdots ① \\ \left( \frac{1}{2} \right) ^{x_{2}}= 12\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

