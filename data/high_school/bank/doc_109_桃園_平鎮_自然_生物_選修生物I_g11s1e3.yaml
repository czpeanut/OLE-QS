  group_stem: ◎閱讀一 生命力源於能量！所有生物體的活動，如細菌的泳動、人的閱讀，均需若干能量的投入。生物體能量收支以ATP為「通貨」；在細胞質中每一個ATP代表12 kcal／mole glucose（大卡／1莫耳葡萄糖）。地球演化初期的生物圈，其異營生物體以糖解作用將葡萄糖氧化為丙酮酸之類的化合物，可獲得2個ATP。然而，1莫耳的葡萄糖其化學鍵所蘊含的能量約為686 kcal。目前生態系內含的物種通常相當多且複雜，系統生態學者將物種依其在生態系中能階的高低加以歸類，分為生產者、消費者、清除者和分解者。生產者中的生物體其能源可自無機環境中逕行擷取，故稱為自營性；其餘各營養階層的能量都取自自營生物，稱之為異營生物。假設在一草原生態系中，青草—植食性動物—肉食性動物形成三營養階層食物鏈，植食消費者只以糖解的方式獲得能量，而肉食消費者掠食植食性動物後，亦僅以糖解為能量的取得方式，則估計整個生態系只有0.12％源於生產者的能量可供肉食動物運用於其活動中。此草原上肉食動物的組成及生物量將遠不及目前非洲草原上豐富。 生物體的細胞可行有氧呼吸，以產生進一步的氧化代謝，在演化過程中是一項大突破。有氧呼吸的能量轉換率在細胞內達到52～63％，如此一來便有足夠的能量保留在生態系內，以建立充足的食物鏈，維持生態系的動態平衡。但是即使有氧呼吸提高細胞運用能源物資（如葡萄糖的利用效率，在生態系的營養階層間進行能量轉換，仍有約2／3的量逸出系統。此一現象直接影響生態系中的營養階層數。大部分的生態系只有三個營養階層，少數達到四層。例如：在非洲的草原上，青草—羚羊—獅的食物鏈代表一個三營養階層的生態系，若將人介入以形成青草—羚羊—獅—人的四營養階層系統將非常不容易。這是因為獅的生物量不足以提供人的利用，使人達成恆定且相當大的族群水準。若人另擇途徑，中途截取青草（菜）或羚羊以補足能量，維持一個相當的族群水準，那麼所謂的「四營養階層」系統便名存實亡了。
