  stem: 已知點（a，b）是指數函數 y＝$3^{x}$ 圖形上的任一點，則下列哪些選項中的點也會在此 y＝$3^{x}$ 的圖形上？
  options:
  - label: A
    content: （3a，3b）
  - label: B
    content: （a＋1，3b）
  - label: C
    content: （3a，b＋1）
  - label: D
    content: $\left( a - 2 , \frac{b}{9} \right)$
  - label: E
    content: $\left( \frac{a}{3} , b - 1 \right)$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'b＝$3^{a}$

    (A) ╳：3b＝$3^{3a}$ ⇒ b＝$3^{3a－1}$，不成立

    (B) ○：3b＝$3^{a＋1}$ ⇒ b＝$3^{a}$，成立

    (C) ╳：b＋1＝$3^{3a}$ ⇒ b＝$3^{3a}$－1，不成立

    (D) ○：$\frac{b}{9}$＝$3^{a－2}$ ⇒ b＝$3^{a}$，成立

    (E) ╳：b－1＝$3^{\frac{a}{3}}$ ⇒ b＝$3^{\frac{a}{3}}$＋1，不成立

    故選(B)(D)'
