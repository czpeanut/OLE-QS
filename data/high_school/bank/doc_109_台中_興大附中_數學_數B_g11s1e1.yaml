  stem: 設－π$\leq$x$\leq$2π，求函數 y＝3 sin$\left( 2x + \frac{\pi}{3} \right)$的圖形與 x 軸有＿＿＿＿個交點。
  answer:
  - '6'
  answer_status: verified
  answer_source: answer_key
  explanation: '－π$\leq$x$\leq$2π時

    y＝3 sin（2x）與 x 軸交於 7 點

    ⇒ y＝3 sin$\left( 2x + \frac{\pi}{3} \right)$與 x 軸交於 6 點

    〈另解〉

    解 y＝3 sin（2x＋60°）＝0

    ⇒ sin（2x＋60°）＝0

    由－180°$\leq$x$\leq$360° ⇒ －300°$\leq$2x＋60°$\leq$780°

    ∴2x＋60°＝180°．k，k＝－1，0，……，4

    表示圖形與 x 軸有 6 個交點'
