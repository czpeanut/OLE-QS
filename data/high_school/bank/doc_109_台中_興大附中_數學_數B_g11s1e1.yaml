  explanation: '設張開角度為θ

    $\frac{\theta}{2\pi -\theta}$＝$\frac{A_{1}}{A_{2}}$＝$\frac{\sqrt{5} - 1}{2}$

    ⇒ 2θ＝2π（$\sqrt{5}$－1）－（$\sqrt{5}$－1）θ

    ⇒ ［2＋（$\sqrt{5}$－1）］θ＝2π（$\sqrt{5}$－1）

    ⇒ （$\sqrt{5}$＋1）θ＝2π（$\sqrt{5}$－1）

    ∴θ＝2π．$\frac{\sqrt{5} - 1}{\sqrt{5} + 1}$＝2π．$\frac{(\sqrt{5} - 1)^{2}}{4}$＝2π．$\frac{6 - 2\sqrt{5}}{4}$＝（3－$\sqrt{5}$）π'
