- id: doc_109_台中_興大附中_數學_數B_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 關於廣義角θ＝－10，則下列哪些選項是正確的？
  options:
  - label: A
    content: θ的最小正同界角為 4π－10
  - label: B
    content: sinθ＜0
  - label: C
    content: tan（－θ）＞0
  - label: D
    content: sin（π－θ）＞0
  - label: E
    content: cos（π＋θ）＞0
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：－10＋2π×2＝－10＋4π介於 0～2π之間

    為－10 的最小正同界角

    (B) ╳：－10＋4π$\approx$－10＋4（3.14）＝2.56

    介於$\frac{\pi}{2}$～π之間，為第二象限角

    ∴sin（－10）＞0

    (C) ○：－θ＝10 為第三象限角（由(B)）

    ∴tan（－θ）＞0

    (D) ○：π＋（－θ）為第一象限角（由(C)）

    ∴sin（π－θ）＞0

    (E) ○：π＋θ為第四象限角（由(B)）

    ∴cos（π＋θ）＞0

    故選(A)(C)(D)(E)'
