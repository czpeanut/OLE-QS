  stem: 美國獨立革命時，潘恩出版《常識》，主張建立共和。根據當時的歷史背景與時代潮流，潘恩可能會提出哪一項論點來支持他的主張？
  options:
  - label: A
    content: 英國人曾經為了爭奪王位，陷入三十年戰爭
  - label: B
    content: 民族主義浪潮正席捲歐洲，美洲不能置身事外
  - label: C
    content: 「君權至上」的觀點與天賦人權是相矛盾的
  - label: D
    content: 歐洲的君主制早已過時，梅特涅下臺便是明證
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 《常識》於 1776 年 1 月出版，其除了系統性地論證了殖民地獨立的合理性和必要性外，亦反映了 17 ～ 18 世紀歐洲啟蒙運動在政治哲學思想上的發展。潘恩在書中強烈批判君主制的弊病，及其對自然權利的侵害，因此他認為共和制是殖民地獨立後最應該採行的政體。(A)三十年戰爭的起因主要為神聖羅馬帝國境內的新舊教與族群衝突。(B)(D)歐洲民族主義浪潮與梅特涅體系的垮臺發生於 18 世紀末期至 19 世紀中期，晚於美國獨立革命。
