  explanation: '(A)從題目敘述中可發現，媒體會基於其政治立場選擇報導的方向。(B)當時多數媒體採取支持張伯倫的立場，因此合理化「避戰」的意圖。(D)當時並未出現媒體轉向支持工黨的現象。

    43.1944 年，美軍於雷伊泰島戰役後取得在菲律賓群島周邊的制海、制空權，並開始對日本於東南亞的控制區進行空襲打擊行動，臺灣做為日本南向基地，亦為美軍打擊行動的範圍內，故答案選(B)。(A)(C)盧溝橋事變發生於 1937 年，珍珠港事件爆發於 1941 年，與題目時間不符。(D)從地理區位來看，蘇聯並無法搶先接收臺灣，美國亦無必要因此進行空襲。

    44.除了教科書以中國史為主體的問題外，由於中華民國空軍亦曾參與對臺空襲的行動。根據研究，戰後中華民國政府基於「強化中國歷史延續」、「反共抗俄」等需求下，強化、移植「對日抗戰」時期的空襲記憶，也使得許多「戰後世代」的臺灣人出現「日機襲臺」的戰爭記憶。

    45.、46.1977 年，西班牙政府頒布《大赦法》。當時由內戰後首次普選組成的蘇瓦雷斯政府，為了維持政局穩定，而積極向左、右各派菁英進行政治斡旋、協商，並確立了維持中間溫和路線的民主體制。而蘇瓦雷斯政府所頒布的《大赦法》限制了對內戰與佛朗哥獨裁時期的真相調查行為，亦未對舊時代的官僚、軍方進行究責，僅對 1976 年遭到逮捕、判刑的政治犯進行赦免。《大赦法》的頒布雖有其時空背景，但隨著民主政治的發展亦常為人詬病。2000 年由西班牙受難遺族成立的「恢復歷史記憶協會」開始以民間的力量重新審視並調查那段「不能說的歷史」，後才促成西班牙政府於 2007 年修訂《歷史記憶法》，正式由官方進行轉型正義的工作。

    47.林布蘭為 17 世紀初期的荷蘭畫家，是荷蘭黃金時代的代表人物。〈耶穌基督講道〉一畫中，反映基督教《福音書》所強調，透過聽道回歸純真的理念，也顯現當時新教徒回歸《聖經》與人性的思想。由此可判斷，林布蘭的畫作主要反映(B)丙、丁新教盛行地區的信仰觀念。

    48.1453 年後，巴爾幹半島地區即由信奉伊斯蘭教的鄂圖曼土耳其帝國所統治，並延續至 19 世紀初期。

    49.、50.本題為測驗學生的閱讀理解能力，從題目中「現代醫學上大量抗生素的使用，也造成病毒產生耐藥性，使人類的健康不斷受到新的威脅」，可得知資料基於「過度依賴抗生素導致病毒產生耐藥性」的原因，而呼籲大眾應「停止使用抗生素治療」。'
