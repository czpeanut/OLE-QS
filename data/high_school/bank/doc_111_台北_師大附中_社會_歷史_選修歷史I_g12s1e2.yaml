  stem: 近代以來，歐洲國家為減輕國內人口及社會壓力，紛紛在海外尋求殖民地。這些殖民地除了作為國內人民移民之用，還是原料供應地和國內工業產品的市場。下列哪一組國家或地區屬於此類殖民地？
  options:
  - label: A
    content: 香港、加拿大
  - label: B
    content: 香港、馬來亞
  - label: C
    content: 加拿大、澳大利亞
  - label: D
    content: 印度、馬來亞
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 馬來亞、香港與印度過去作為英國殖民地，其主要皆為英國提供商貿功能，雖有少量英國移民，但主要為政、商目的，並未使英國減輕國內人口壓力。因此較符合題目的描述為加拿大、澳大利亞，故答案選(C)。
