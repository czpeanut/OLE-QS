- id: doc_111_台北_師大附中_社會_歷史_選修歷史I_g12s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 俄國總統普亭於 9 月 30 日簽署條約，將烏克蘭東部與南部四個州納為俄國領土。數小時後，烏克蘭國防部在官方推特宣布，澤倫斯基總統已簽署文件，正式申請加入某一國際組織，以獲得更多、更直接的支援。請問烏克蘭申請加入的國際組織為何？
  options:
  - label: A
    content: 聯合國
  - label: B
    content: 歐洲聯盟
  - label: C
    content: 北大西洋公約組織
  - label: D
    content: 華沙公約組織
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '烏克蘭與俄羅斯戰爭最直接的導火線，為烏克蘭於近年積極爭取正式加入北大西洋公約組織（NATO）。俄羅斯認為烏克蘭加入北約組織，會使其國防受到威脅，且近年俄羅斯亦欲重新建立其於舊蘇聯地區的領導者地位；而烏克蘭則在烏東衝突升溫，及克里米亞問題後，積極尋求北約組織的支持，以抵禦俄羅斯的逐步進逼，因而導致 2022 年戰爭的爆發。

    16.1931 年的西方社會，正遭逢經濟大恐慌後的蕭條問題，湯恩比的評論主要乃針對以資本主義為核心的西方社會制度進行反思。(A)德國納粹黨於 1932 年才贏得國會大選並掌握政權。(B)英、法姑息主義的風氣，約自 1931 年國際聯盟未對日本發動九一八事變採取任何作為起，延續整個 1930 年代。(D)蘇聯新經濟政策由列寧、布哈林主導。

    17.社會主義於 19 世紀的發展正處於理論、思想的建構，以及部分社會性實驗的階段，當時的社會主義者，因其對社會、經濟的理念不同，而發展出許多的派別，但共同特色皆源於對工業革命後，資本主義私有制產生的不平等問題進行反思，以及對下層階級的關懷意識。(A)並非所有社會主義者皆主張建立社會主義政黨，例如部分烏托邦社會主義者，投入建立公有社會組織的實驗與發展。(B)此為馬克思主義的特色。(C)此為蘇聯模式的社會主義特色。

    18.英國歷史學家霍布斯邦將 1875 ～ 1914 年定義為「帝國的年代」，他認為在這一段期間，以工業發展、資本主義為核心的西方帝國，透過蓬勃的經濟、科學與文化發展，將其經濟與軍事上的霸權轉化為有系統的征伐、兼併與統治，並種下後續的革命、衝突與大戰的因子，故答案選(B)。

    19.(A)由資料中可得知，「奧斯威辛審判」是由德國檢察官主動發起。(B)(C)「紐倫堡大審」究責的主要對象為納粹高層，「奧斯威辛審判」則是針對集中營中的中下階層責任者進行究責。

    20.1970 年 12 月 7 日，西德總理布蘭特（Willy Brandt）前往華沙猶太隔離區敬獻花圈致意，並於紀念碑前下跪默哀，被視為代表德國政府正式對過去的暴行進行反省，亦促使之後德國與東歐各國、以色列關係得以改善。故答案選(C)。(A)宣傳日耳曼民族主義與轉型正義無關。(B)無名烈士墓的紀念對象為在二戰期間戰死的軍人，與轉型正義無關。(D)奧斯維辛集中營位於波蘭境內，1947 年由波蘭國會將其立為納粹大屠殺博物館。

    21.比利時人民在 19 世紀民族主義風潮、法國七月革命以及經濟問題等影響下，於 1830 年發動獨立革命，並在英、法二國的支持下成功脫離荷蘭聯合王國的統治，故答案選(A)。(B)英國於 1832 年通過的「國會改革法案」中，雖放寬選民財產資格的限制，但仍規定須負擔相當稅額者才擁有投票權，因此並非所有中產階級男子皆獲得參政權。(C)雖然英國於 1830 年即開始興建鐵路，但自比利時於 1835 年興建鐵路後，歐陸國家才陸續有鐵路系統出現，因此史瑞克不可能於 1830 年代搭乘火車旅遊歐洲各地。(D)拿破崙於 1815 年滑鐵盧之役戰敗後，即被英國流放至聖赫勒拿島，並於 1821 年去世。

    22.(A)洛克為英國人。(B)雖然啟蒙時代盛行的思想為自然權利與對君權神授論的批判，並促進共和體制的發展，但並非所有啟蒙哲士皆認為「共和」制度為最理想的政體，例如孟德斯鳩即曾批判共和制容易因暴民式的狂熱，讓制度無效化並進而趨向獨裁。(D)科學革命對自然知識的探討，為啟蒙運動提供發展基礎。

    23.題目中的主張，主要為李嘉圖等學者發展出的「工資鐵律」學說，亦反映工業革命後，多數英國資本家對經濟生產和勞動待遇的態度。當時的資本家以此做為壓低生產成本的合理化論調，並為社會主義者所批評。故答案選(D)。

    24.題目引文主要反映馬來西亞華人移民觀點下的發展歷程，現今馬來西亞的國土範圍，主要建立於英國殖民時期，二次大戰期間曾短暫被日本占領，1957 年「馬來亞聯合邦」正式脫離英國獨立，1963 年與新加坡、沙巴、沙勞越等自治領合併建立馬來西亞聯邦。菲律賓、臺灣並非由英國統治，而香港並未在日本人離開後即建立獨立國家，故答案選(A)。

    25.(B)煙（菸）草的原生地為美洲。(C)棉花在亞洲、美洲與非洲的熱帶、亞熱帶地區皆有原生種。(D)胡椒被認為原產於南印度，並於古埃及、古希臘和古羅馬的紀錄中皆可發現胡椒的身影，15 世紀前流通於歐洲、中東與北非市場的胡椒，基本上皆為印度所生產，至 16 世紀才開始在馬達加斯加與東南亞等地區種植。

    26.根據生態史的研究，野生森林的覆蓋率通常與人口成長呈反比關係，而 14 世紀後期森林重返英格蘭大地，即反映人口大規模衰減的現象。從時間點推算，諾曼人征服發生於 1066 年；十字軍運動為 11 ～ 13 世紀；海權戰爭發生於 17 世紀。由此判斷最可能與黑死病的流行有關，故答案選(C)。

    27.從資料甲、乙的敘述中，可發現伊斯蘭世界引進的外來知識，像醫學、天文、化學、物理、地理與軍事等，皆較具實用取向，並會排除如文學、歷史、哲學等可能在政治上有疑慮的知識。由此可判斷，其態度通常為有選擇性：具有實用價值者。

    28.由題目提及的「收集古代抄本」、「考訂、校勘，以回復古書原樣」、「摹仿古拉丁文，以之寫作」、「富商和權貴資助學者與藝術家的創作，展現文化品味」等特徵，可判斷此為 14 世紀文藝復興時期的時代特色，故答案選(C)。

    29.西元 726 年，拜占庭帝國人民不滿教會過於豪奢、及政教相爭的背景下，皇帝李奧三世頒布法令要求簡化宗教儀式，取消聖像崇拜，由此開啟了「聖像破壞運動」的風潮，故答案選(C)。

    30.(B)資料乙中的法律改革並未提及平民抗爭，而是由官員主導。(C)鄭國子產的改革，動機是為維繫國家勞動力。(D)羅馬與鄭國貴族並未在法律改革後喪失政治實力。

    31.(B)(C)(D)選項的時間點，皆為記錄以忽必烈為首的蒙古政權，取代南宋成為中原朝代「元」的歷程，相較之下，1206 年成吉斯汗建立蒙古國的歷程則較能反映出以蒙古為中心的歷史觀點，故答案選(A)。

    32.(B)(C)(D)選項的時間點，皆為記錄以忽必烈為首的蒙古政權，取代南宋成為中原朝代「元」的歷程。然而題文特別描述「1279 年，陸秀夫背負兒皇帝，跳海而亡，南宋正式滅亡」，因此能反映以中國為中心的歷史觀點，故答案選(D)。

    33.根據學者研究，在蒙古帝國的體制下，促成繁榮的長距離貿易的因素有：由政府保障貿易安全、道路驛站系統的暢通、度量衡標準化與舊「關稅壁壘」被打破，故答案選(A)。

    34.由附圖的蒙古海運路線圖中，可發現在蒙古帝國的體制下，過去由穆斯林占有優勢的印度洋航線，被納入帝國的體系之中。而這樣的發展，也帶動了當時中國自東非輸入象牙、犀角與香料，並向東非出口絲綢、瓷器的商品物流模式，故答案選(B)。

    35.印度洋航線在 15 世紀前，主要由阿拉伯人為主的穆斯林商人所掌握，而在蒙古帝國興起後，印度洋航線被納入帝國的體系之中。但蒙古帝國基本上是尊重商人間的互相競爭，因此蒙古商人在當時的主要競爭者仍為阿拉伯人。

    36.印度半島周邊海域的季風、洋流特性：夏季盛行西南季風，並會帶動洋流向東流；冬季盛行東北季風，並會帶動洋流向西流。因此如欲從朋加剌往臥亞方向航行，最適合的時間應為盛冬季節的一月，故答案選(A)。

    37.從資料甲：「他們蔑視神殿、對神像啐唾沫，譏諷我們拜神的儀式，不把祭司放在眼裡」；資料乙：「他們拋棄祖宗所創宗教和典禮，蔑視古代習俗」等描述，可得知當時羅馬人敵視基督徒的主要原因為背棄傳統宗教的態度。

    38.乙國前往亞洲海域貿易的船隻數量，於 1600 ～ 1649 年間即成為三國間數量最多者，並於 1700 ～ 1749 年間達到高峰後衰退。此變化趨勢與荷蘭聯合東印度公司的發展歷程相符，因此乙國應為(A)荷蘭。(B)英國應為亞洲貿易的後起之秀「丙國」。(C)葡萄牙於 16 世紀初期開始發展向亞洲擴張，為早期歐亞貿易的霸主之一，後逐漸被荷蘭、英國所取代，因此應為「甲國」。

    39.伊比利半島曾先後被古希臘人、迦太基人所占據，也曾經是迦太基人在布匿克戰爭的據點，但第二次布匿克戰爭後，伊比利半島成為戰勝的羅馬人之領土。8 世紀前期，來自北非的穆斯林柏柏人（歐洲人稱其為摩爾人，帶貶意）征服伊比利半島，並建立數個穆斯林政權，與北方基督教王國相峙至 14 世紀。14 ～ 15 世紀穆斯林勢力衰退，葡萄牙王國、西班牙王國陸續擴張，並於 1492 年將穆斯林勢力驅逐出伊比利半島，故答案選(A)。

    40.從題文中可發現，該歷史學者強調馬丁路德發起宗教改革運動前，歐洲各地傳教士已相繼對教會的教義解釋與權威性提出挑戰，由此可判斷其用意主要為應從教會改革傳統理解路德的崛起，故答案選(B)。(A)(C)從題文中可得知，宗教改革運動於 15 世紀初期即已開始醞釀，且有其發展脈絡。(D)題文中並未討論歷史發展的必然性與偶然性。'
