  page: 1
  stem: 「為達到成功的協商與轉型，轉型的條件不僅需要過去受害者的同意，也需要那些會被一個『基於自由與平等的民主社會』威脅到的人的首肯。如果新憲法沒有杜絕復仇與報復持續發生的可能，那麼，可能會受到新憲法秩序威脅的人就不可能支持新憲法……正是基於這樣的考量，參與憲法協商的人幾經思考之後，做了一個重大的決定，我們需要了解而非復仇，需要修復而非報復，需要共生而非尋找代罪羔羊。」上文為南非憲法法官的紀錄，請問我們應如何解讀其要旨較為適當？
  options:
  - label: A
    content: 他主張制定非報復形式的法律，換得自由與平等的社會
  - label: B
    content: 他認為法律的制定需要被害與加害者雙方首肯
  - label: C
    content: 他主張召開憲法協商會議，尋求解決被害者心頭永遠的仇恨
  - label: D
    content: 他認為杜絕報復的最佳解方是持續修改憲法
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題目引文中，可以發現參與憲法協商者，認為新憲法與轉型正義最重要的目標是維持一個自由、平等的社會，由此必須確保所有人都能支持、遵守新憲法架構下的社會秩序。因此南非社會最終選擇的轉型正義路線，是一條追求理解、修復與共生的路線，故答案選(A)。(B)新憲法的制定並非需要被害者與加害者的首肯，而是要確保新憲法秩序的維持。(C)召開憲法協商會議的目的並非尋求解決被害者的仇恨，而是找出能夠貫徹自由、平等精神的最佳途徑。(D)從引文中可得知，他認為應該維持新憲法的穩定性，而非持續修改。
