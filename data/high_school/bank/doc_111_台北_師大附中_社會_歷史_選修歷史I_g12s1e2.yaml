  answer_source: answer_key
  explanation: 題文中提及該國外交政策的目標為「創造分裂的歐洲」，如以近代西歐國際關係發展判斷，歐洲的分裂對英國的發展最為有利，選項中亦只有英國多次介入歐陸各國戰爭；題文中荷、西八十年戰爭（1568 ～ 1648）時美國尚未建國；而俄羅斯帝國於 18 世紀後才逐漸崛起，近代瑞士則於 1815 年維也納會議後才獨立，並成為永久中立國，故答案選(B)。
