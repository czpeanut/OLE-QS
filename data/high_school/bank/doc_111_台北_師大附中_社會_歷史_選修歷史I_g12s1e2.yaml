  stem: 1915 ～ 1917 年間，鄂圖曼土耳其帝國對其領土內的亞美尼亞人進行種族屠殺，估計受害者達 150 萬人。儘管土耳其當局至今仍拒絕承認這是一次『官方發起」的預謀性屠殺，但亞美尼亞、俄羅斯和其他多數西方國家皆認為亞美尼亞大屠殺是一樁可與「猶太人大屠殺」相提並論的種族滅絕行為。關於此一歷史悲劇的發生，我們應有何種認知？
  options:
  - label: A
    content: 聯合國當時應即時制止此事的發生
  - label: B
    content: 聲援亞美尼亞屠殺的國家皆面臨過類似的歷史事件
  - label: C
    content: 過去的鄂圖曼土耳其官方發起屠殺，不應由今日的土耳其共和國政府致歉
  - label: D
    content: 種族滅絕與屠殺罪刑已納入聯合國的國際罪刑之中，不論哪一個政權都不應再犯
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 聯合國於 1948 年 12 月舉行的大會中，通過第 260 A 號《防止及懲治滅絕種族罪公約》決議案，針對種族滅絕與屠殺行為做出明確定義、規範與相應刑責。(A)亞美尼亞大屠殺期間（1915 ～ 1917），尚未出現聯合國組織。(B)由題目敘述並無法確認，對亞美尼亞屠殺事件進行聲援的國家「皆」面臨過類似的歷史事件。(C)亞美尼亞屠殺事件雖為鄂圖曼土耳其時期所發生，但作為承繼政權的土耳其共和國，有責任為此事件做出相應作為。
