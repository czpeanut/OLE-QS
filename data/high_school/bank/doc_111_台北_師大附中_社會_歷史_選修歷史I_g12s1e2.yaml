  section: 1
  number: 30
  type: single
  page: 5
  stem: '以下是兩則古代法律形成的資料：

    資料甲：公元前 5 世紀中葉，經過平民長期抗爭，羅馬元老院接受公民大會決議，整理羅馬法律，刻在銅板上，公諸社會，是為《十二表法》。《十二表法》以明文規範，保護公民的私有財產和相關權利，也限制貴族的若干權力。

    資料乙：公元前 6 世紀後半，鄭國小國寡民，在齊、秦、晉、楚等大國夾縫中求生存。官員子產為保護平民，以維繫國家勞動力，決定將法令形諸文字，鑄於鼎上，公布於民，以保障其權益。

    比較上述兩則資料，選出正確選項'
  options:
  - label: A
    content: 兩者的共同特色，乃是法律的成文化與透明化
  - label: B
    content: 兩者皆是因為平民的抗爭，而導致法律的改革
  - label: C
    content: 鄭國子產的改革，目的是為了實踐正義的理想
  - label: D
    content: 羅馬與鄭國貴族都在法律改革後喪失政治實力
  answer:
  - A
