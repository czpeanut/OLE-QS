  section: 1
  number: 31
  type: single
  page: 6
  stem: 學者對元朝開始之年有不同看法，反映出蒙古中心與中國中心兩種不同觀點。題文第一段提到四個年代，哪個年代最能代表蒙古中心？
  options:
  - label: A
    content: 1206 年
  - label: B
    content: 1271 年
  - label: C
    content: 1276 年
  - label: D
    content: 1279 年
  group_stem: '13 世紀，蒙古高原的游牧人群崛起並迅速擴張，建立起橫跨歐亞的陸上帝國。西元 1206 年，成吉思汗統一蒙古各部，建立蒙古國；1271 年，忽必烈以「元」為國號，定都大都；1276 年，忽必烈攻占南宋首都臨安；1279 年，陸秀夫背負兒皇帝，跳海而亡，南宋正式滅亡。

    蒙元史的研究有蒙古中心與中國中心兩種學術觀點，前者將元視為蒙古帝國的組成之一，後者則視其為中國歷代王朝之一。近來蒙古中心的學者指出，蒙古人原本是高原上的游牧人群，但在忽必烈滅南宋，接收其海上船隊後，進一步將勢力伸向海洋，連接起歐亞的內陸世界與海洋世界，成為人類史上首次同時控制陸、海的巨大帝國。在蒙古統治下，歐、亞之間出現了大規模的人群移動、物品交換與技術交流。除了海洋貿易，忽必烈也重視內陸水運，下令拓寬黃河與長江之間原有的運河，並在南方開鑿新運河，讓船運成為帝國內糧食運輸的主力。沉船是了解古代航運的重要材料。1975 年韓國新安外海曾發現一艘 14 世紀上半的沉船，出水銅錢、胡椒、景德鎮陶瓷等。有些貨品還標註貨主名號，如日本京都佛寺「東福寺」，是 13 世紀海洋貿易的見證。'
  shared_asset: g1_31_36
  answer:
  - A
  answer_status: verified
