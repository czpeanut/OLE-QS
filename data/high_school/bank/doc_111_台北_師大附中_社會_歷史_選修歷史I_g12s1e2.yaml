  group_stem: '費里茲．鮑爾是一位知名的德國檢察官，他曾針對德國在第二次世界大戰的失敗說：「我不要求世人可憐德國，因為我知道，德國人未來數十年必須努力彌補錯誤，才有可能獲得尊重與同情。」戰後的「紐倫堡審判」，起訴了納粹德國的政治、軍事、司法和經濟領導人，並嚴予判刑，此舉被視為彌補錯誤的一部分。然而，更多西德人民關注的焦點卻放在經濟重建、原諒與共生，因為在納粹掌權期間，太多人曾與納粹合作或其本身就是黨員，對他們而言，遺忘歷史才讓他們免於面對譴責，不用回首那段不堪的過往。

    1962 年，一份官方文件交到了費里茲．鮑爾的手中，其內容詳載奧斯威辛集中營中囚犯和射殺囚犯的黨衛軍名單。費里茲．鮑爾利用這份資料，開啟了長達兩年的「奧斯威辛審判」。在審判中，他一口氣起訴了 22 名集中營的看守人員。和「紐倫堡審判」不同的是，「奧斯威辛審判」起訴的都是集中營裡的小人物，而非決策者，但這場審判確立了一個重要的精神，即是：「凡是知曉、參與過這場謀殺機器的人，就是參與謀殺的共犯」。「奧斯威辛審判」受到媒體注目而廣泛報導的結果，讓戰後出生的年輕一代重新了解納粹暴行，要求追查戰犯的責任，這股力量也開枝散葉，促使德國政府展開更多道歉、賠償、教育等程序，並延續至今。'
