- id: doc_108_花蓮_花蓮女中_國文_g10s1e1_s2_41
  section: 2
  number: 41
  type: multiple
  page: 5
  stem: 關於本文的結構與內容，敘述正確的是：
  options:
  - label: A
    content: 首段自言有收藏的習慣，且這些物件都有見證回憶的功用
  - label: B
    content: 第二段敘述可以日日見到象徵成長階段的物件便能感到安心
  - label: C
    content: 第三段說明作者只保存精美的物品來象徵各國階段美好的回憶
  - label: D
    content: 接著說明入住新家將物件各安其所的秩序，是對新居產生認同的元素
  - label: E
    content: 最後一段抒發對於房間裡每一象徵記憶之物件，珍而重之的情感
  group_stem: 閱讀下列文字，回答41-42題。 近幾年屢次搬遷，發現隨身物事日漸沈重繁多。於是物件去取之間，頗費心力。留下的那些，當然是自認重要的。即便在租賃來的空間裡，亦要好好收存，以為懷念之憑藉。我一直堅信所有事物必須有家可回，一切的記憶才能算數。 或許這一點都不奇怪，年紀越長越是擔心記憶的錯失，或是從前肯認的事物就此崩壞，被時光摧毀殆盡。所以戀物成癖，無法戒除。高雄的老家後院裡，有一廢棄不用的大冷凍櫃，裡頭收藏了我國、高中時期讀的書籍以及文具用品。當初也不曉得怎會那麼剛好，多出這麼一件龐大又堅實的東西供我作收納用。時間好似被封鎖於其中，十多年過去我只知道它一直在著，這便叫我安心。裡頭不是什麼金銀首飾，卻是專屬於我成長經驗的時光寶盒。 即使甚少返鄉長住，家人還是為我保留一個獨立的房間。高中畢業後便離家在外的我，每一想及那個小小天地，心下就有了定靜之感。半透明塑膠收納箱很突兀的置放於牆角，與室內其他物件不甚搭軋。那是剛上大學時買的，隨著我在大學宿舍裡凡三遷。後來我將醜醜的大學服、一批手札、幾枚紀念章收入，闔上箱蓋，仔細扣住。這樣我才能夠以為，記憶已經井然有序，在其所當在，便不致氾濫成災。 住入新的家屋，我喜歡小小的世界收容該存在的每一事物。每一個櫥櫃、抽屜，讓細小事物各安其位。一盆赭紅色的蘭花兀自把花瓣一一打開，彷彿是杜詩在我眼前輕輕告訴：「易識浮生理，難教一物違。」我相信，美好的秩序將會帶著我走進未來。《空間詩學》這麼辯證如其所是的那些：「房間裡的私祕感，變成了我們的私祕感。相關的是，私祕空間變得如此靜謐、如此單純，房間裡的所有寂靜都被定位，聚集了起來。」 原本空蕩蕩的新居，油漆氣味逐漸消散，可以預期的是物件會日漸擁擠，各自佔據一角。有緣來作伴的，我就善待、收藏。長久以來，對易碎品如玻璃陶瓷又愛又怕，如今可以安心一些了。我有一整個櫃子可以用來安置它們。或得之於人，或親力購來，每一物件都有故事好說。這所有事物的房間，一切，要小心輕放。（節選自凌性傑〈所有事物的房間〉──讀〈項脊軒志〉）
  tags:
    unit:
      code: ZH-1-14-4
      book: 國文1（必修）
