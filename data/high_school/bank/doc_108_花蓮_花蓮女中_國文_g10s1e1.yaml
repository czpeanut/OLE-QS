  section: 1
  number: 33
  type: single
  page: 4
  stem: 依據上文的說法，對抗年華老去最有效的方法是：
  options:
  - label: A
    content: 保持心靈上的年輕，樂觀面對生命的每一個階段
  - label: B
    content: 持之以恆的梳妝打扮，極力隱藏上出現的一兩根白髮
  - label: C
    content: 每年秋天來了，盡力忽視地上的落葉，並期待春天到來
  - label: D
    content: 提早揣摩老去的心境，寫些老氣橫秋的句子，以防範未然
  group_stem: 閱讀下列文字，回答33-34題。 梧桐樹上飄下了片片黃葉，有幾人能不慨嘆一聲「又是秋天了」？人過了中年，第一次在自己頭上發現一兩根白髮的時候，心情也很難保持平靜。落葉告訴我們「一年容易」，白髮象徵著老之將至。這都是惹人感傷，無可奈何的現象，可是這種現象又豈能避免呢？「美人自古如名將，不許人間見白頭。」可見女人先天愛美的心，總不願頭上早早出現白髮。可是白髮卻像秋霜冬雪，遲早總要飄落下來的，誰又能保持一輩子的青春年少呢？ 你越是怕容顏老去，你的心情反而越老得快。尼采說的：「許多人的心靈先老，許多人的精神先老，有些人年輕時就老了。但是遲到的青春是持久的青春。」這話是值得我們深思的。 記得我二十多歲時，就學著寫老氣橫秋的句子：「不記秋歸早晚，但覺愁添兩鬢，此恨幾人同。」老師曾笑我說：「不要無病呻吟，年事長大有何可悲？只要能保持健康愉快的心情，人就會永遠年輕的。」如今年歲真的長大了，頭上的白髮已不只一兩根了，才真正體味到中年也有中年的樂趣。因為中年人的心比較的沉靜、悠閒。許多年輕時候使我哭過，使我笑過的事情，如今回想起來，都別有一番雋永的滋味。從前許多想不通的世事人情，如今也看得雲淡風輕，提得起也放得下了。生命是豐富的，如能永久保持「花落春猶在」的樂觀心理，由中年而漸入老年，又未始不是一樣有情趣，有意義呢？（琦君〈白髮〉）
