  section: 1
  number: 25
  type: single
  page: 3
  stem: 下列關於〈站在高崗上：讀師說〉的說明，請選出<u>錯誤</u>的選項：
  options:
  - label: A
    content: 韓愈在〈師說〉文末寫「余嘉其能行古道，作〈師說〉以貽之」句中的「其」指的是李蟠
  - label: B
    content: 「一封朝秦九重天，夕貶潮陽路八千」是指韓愈因為上審諫迎佛骨，觸怒憲宗，因此被貶潮州的事件
  - label: C
    content: 文中提到「士大夫恥於從師問學的心態」可以從〈師說〉「士大夫之族，曰師、曰弟子云者，則群眾而笑之」看出
  - label: D
    content: 文中提到老師的責任在於「傳道、授業、解惑」，是指從六朝以來所尊崇的佛老之道，想要恢復先秦百家爭鳴，思想多元的盛況
  group_stem: 閱讀下列文字，回答25-26題。 德宗貞元十八年（西元802年），十七歲的少年李蟠不顧當時的社會風氣，求學古文於韓愈，韓愈「嘉其能行古道」，寫下了〈師說〉這篇文章相贈，文中引經據典，批判了士大夫恥於從師問學的心態。當時韓愈三十五歲，在國子盛任四門博士仕途雖不順遂，但提攜後進不遺餘力，當時學子多投奔在他門下，經過他的指點獎掖，往往知名，隔年李蟠中舉，韓愈轉任監察御史，卻因上書批評宮市而觸怒德宗，貶為陽山縣令，從此宦海浮沉，屢經播遷。 這是前中年期的韓愈，一心以復興儒學為己任，他以為老師的責任在於「傳道、授業、解惑」，是先王之教的仁義道德。他所要對抗的是六朝以來尊崇佛老的風氣，想要恢復的是兩漢以上儒者稱師的傳統，期望能輔佐明王，開創事功。但孜孜矻矻十餘年，終究累了。憲宗元和八年，他四十六歲，重新回到國子監教授學生，他在〈進學解〉裡假借學生的口吻這麼說自己：「公不見信於人，私不見助於友。跋前躓後，動輒得咎。暫為御史，遂竄南夷。三為博士，冗不見治，命與仇謀，取敗幾時。冬暖而兒號寒，頭童齒豁，竟死何裨！」 雖然他說「投閒置散，乃分之宜」，然而性格決定命運，或許他早就預見了未來。元和十四年，他上書諫迎佛骨，觸怒憲宗，於是「一封朝奏九重天，夕貶潮陽路八千」，遷謫南荒。直至穆宗即位，才召韓愈回師，重入國子監繼續教育工作。這時韓愈已經五十多歲，離他人生的終點五十七歲，只剩下幾個年頭了。 我一直以為自己居住在時間凝滯的國土之上，然而許多年過去了，許多事也過去了，我才瞭解這世界並不存在靜止、單純、完美，日中則昃，月盈則缺，最好的時光從來只是一瞬間。當三十五歲的韓愈反覆申說從師問學的重要，他是多麼相信這一切啊！柳宗元這麼評論這件事：「今之世，不聞有師，有，輒譁笑之，以為狂人。獨韓愈奮不顧流俗，犯笑侮，收召後學，作〈師說〉，因抗顏而為師。世果群怪聚罵，指目牽引，而增與為言辭。愈以是得狂名。──〈答韋中立論師道書〉」原來當時的人們也不信服他這一套，稱他是狂人。（節選出吳岱穎〈站在高崗上〉：讀〈師說〉）
