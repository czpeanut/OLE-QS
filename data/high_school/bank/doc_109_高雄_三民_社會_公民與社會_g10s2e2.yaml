  section: 2
  number: 41
  type: single
  page: 6
  stem: 當人們的飲食觀念改變，在關心環保的考量下減少對傳統肉品的需求轉而提升植物肉的消費。因此植物肉為傳統肉類的<u> (甲) </u>將成為未來的趨勢。請問(甲)應是：
  options:
  - label: A
    content: 互補品
  - label: B
    content: 劣等財
  - label: C
    content: 正常財
  - label: D
    content: 替代品
  group_stem: 題組二 由於世界人口呈幾何級數方式增加，連帶使得食物需求的總量也勢必跟著提升。以肉類的需求為例，因為從畜牧生產的過程中會產生的汙染與環境的破壞甚鉅，因此農產科技專家便投入研究對環境侵害較少的「植物肉」（Plant-based Meat，PBM）來取代對真正肉類的消費需求。目前市場上已研發出來的仿製肉類替代食品，可分為植物肉、細胞培養肉、蛋白質替代製品等三類。 人類目前研究品種改良或基因改造等技術已相當成熟，科學家們藉由提高生產數量和效率，全力因應解決人類未來食短缺的問題。但是過程中尚需量兼顧生產永續性、減輕環境衝擊及產量提高的三贏目標，因此發展肉類替代食品的動機也隨之被激發出來了，藉此機會推出新的「產品」也可以滿足一下消費者的多樣化需求。 所以，對此一個全新的食品「類型」的發展，我們相信它將不會只是一時的潮流而已。在口感幾乎仿真的條件下，消費者將來可以選擇食用一般肉類或是肉類替代食品，並且也能兼顧所產生的環保爭議。而一般傳統肉品業者，則必須面對如何迎合善變的消費者，以及如將生產成本控制低於植物肉等的種種挑戰了。請依據上述內，回答下列問題：
