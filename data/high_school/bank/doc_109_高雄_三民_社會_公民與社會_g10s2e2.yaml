  stem: 隨著民主法治觀念的散播，財產權保障的觀念已是多數民主國家的憲政價值，受到《憲法》和法律的充分障，如所有權、債權和智慧財產權等皆囊括其中。不過根據我國法律，一方面尊重私有財權，另一方面亦需劃定私人之間財產權行使的界限。請問：有關所有權及智慧財產權的敘述，下列何者最為正確？
