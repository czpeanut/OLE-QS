  group_stem: 曉華上網搜尋清廷對臺灣的統治政策時，看到以下兩則資料：「臺灣屬海外地方，無甚關係；因從未響化，肆行騷擾，濱海居民迄無寧日，故興師進剿。……海賊乃疥癬之疾，臺灣僅彈丸之地，得之無所加，不得無所損」、「海外丸泥，不足為中國之廣，裸體文身，不足共守。日費天府金錢而無益，不如徙其人而空其地矣」。請問：
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '康熙時施琅攻打鄭氏政權，得以收復臺灣，因此海賊是指鄭氏政權。

    41. 資料參考自後藤新平的「政治生物學原則」之論點。從內容中可以看出後藤新平認為必須了解臺灣的社會習俗、制度，因此主張應「以科學方法調查當地之舊慣制度，採順應民情之措施」。

    42. 後藤新平認為不可以貿然將文明國家（日本）之制度實行於未開化之地（臺灣），即是以特殊方式進行統治，可見是殖民特殊統治方針。

    44. 從「改朝換代」後的政權不重視海權，以禁海令逃避沿海貿易的需求可知，此為元朝至明朝之際（清朝海禁為對付鄭氏集團，非倭寇侵擾），而倭寇成為沿海主控者，除商業貿易外，需備有武裝以對抗官府查緝。

    45. 就所提供資料，很難判讀當時臺人普遍心理，僅能得知有少數人不願為日本人，因而離臺灣而去。

    46. 朝鮮半島在1910年、滿洲在1932年、新加坡則於1942年受日本統治。

    47. 劉銘傳因清法戰爭而於1884年奉命來臺督辦軍務，故選(D)。

    48. 資料一肯定劉銘傳對近代臺灣建設的影響，認為其成就可比擬鄭成功，但並未指兩人建設項目相同；資料二則認為劉銘傳雖有現代化措施，但成效不算成功，臺灣要到日治時期才真正進入現代化，故選(D)。

    49. 兩則資料皆是評論劉銘傳對臺政策，故選(A)。

    50. 資料中提到當時有一府三縣：臺灣縣、鳳山縣、諸羅縣，可知是清治時期，而且是雍正元年（增設彰化縣、淡水廳）之前的情形，故選(B)。

