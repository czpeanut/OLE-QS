  stem: 某時期的人口結構特色為：在臺灣約有一萬至一萬一千名漢人，從事捕鹿、種植稻穀和甘蔗，以及捕魚活動。到了1660年代初，臺灣的漢人增加到3、5萬，當然，就人口結構來看，相較於南島民族的原住民族，此時來到臺灣的漢人還是少數民族。當時全島原住民族人數約在15~20萬之間，所以漢人仍是少數。該時期應為下列何者？
  options:
  - label: A
    content: 荷治時期
  - label: B
    content: 清治後期
  - label: C
    content: 日治時期
  - label: D
    content: 中華民國時期
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '荷治時期雖有部分漢人來臺開墾，但人數尚不多，鄭氏時期以後帶來大量漢人軍民，漢人才逐漸成為主流族群。

    4. 來臺移民本就以男性居多，故人口比例失衡，導致漢人女子過少，無家無業的漢人男性增加。且在此狀態下，漢人常娶平埔族女性為妻，因而造成平埔族男性至老無妻的現象。

    5. (A)是沈葆楨；(B)主張者是丁日昌，推動建造完成者是劉銘傳；(D)是沈葆楨。

    8. 邵友濂接任巡撫。由於清廷無力提供資源繼續建設，邵友濂財源不足，故以整頓吏治為主。

    9. 從「同治以後，有業可執。……。率趨於都市，以取成倍之利」之句，可知失業率下降對人民生計改善甚大，械鬥風氣因此漸消，而根據時間推測此種改變應與開港有關。

    10. 丁：人口最多，應為臺北；乙：臺南為臺灣最早開發的城市，晚清亦有開港，日治時一直維持人口第二多；丙：高雄作為臺灣南部集散中心，並有通向南洋的地利之便而受日人重視，隨著高雄港之建設，其地位愈形重要，人口亦快速增加；甲：臺中在四個都市中人口應最少。

    12. 臺灣的眷村料理起源於思鄉之情，由中國各省菜色融合臺灣料理而成，因此眷村料理與料理的原鄉會有一定程度上的不同。

    13. (A)不完全是先來後到的結果；(B)與原鄉的生活習慣有關；(D)與族群遷徙的結果密切相關。

    15. 此標語為國民黨政權落敗要反攻大陸的口號，故選(C)。

    16. 國民所得增加與經濟轉型，導致國人進入勞動密集產業的意願降低，因而使臺灣面臨製造產業缺工之情形。

    17. 眷村菜色多與當時生活與經濟環境相關。將食材做成滷味能延長保存期限且加熱即可食用，是當時眷村媽媽們鍾愛的料理。

    19. 異域描寫的是1949年國共內戰後駐守雲南、緬甸邊境的孤軍，孤軍處境因為此書才為大眾所知。

    21. 從報告文本中可看出是描述移工在異鄉的工作與生活，故選(B)。

    22. 亞太經合會不是以主權國家為單位，而是以關稅協定區為單位作為會員。

    24. 文中提到該港位置偏北且受東北信風影響，再加上「日後殖產興業」可知此港的建設和殖民經濟資源的輸出有關，綜合地理位置和政策解讀，故接近殖民母國的(C)基隆港為最佳選。

    25. (B)並未協助臺人自治獨立；(C)派任文官總督；(D)日本並未刻意利用漢人鎮壓原住民族。

    26. 1943年開羅宣言發表後，政府認為收回臺灣指日可待，便在翌年4月成立臺灣調查委員會。題意所指文件即臺灣接管計畫綱要，計十六項八十二條，由前述機構擬定，旨在規劃日本投降後，政府接收臺灣的步驟與程序。

    27. 1853年因艋舺經濟利益引發漳泉械鬥，同安人失敗後轉往大稻埕發展。後來大稻埕成茶葉製造加工中心與集散地，洋行皆在此設立據點。

    28. (A)高山族亦會經營粗放農業；(C)生番為完全不受官府治理的原住民；(D)金廣福這種類型的合作實為少數案例。

    29. 由題幹中的「生味噌」及「在來米」可知移民應為日本人，日治時期，日本為紓解本國人口壓力與鞏固在臺政權，推動日人移民到臺灣東部，第一座官營移民村為1910年在花蓮所建的吉野村，該村原先是阿美族七腳川社的居住地，故選(C)。(A)(B)時間與題幹不符；(D)1930年代官營移民村的建置以西部為主。

    30. 族譜記載家族成員姓名、嫁娶婚配、子嗣、生卒年，也有家訓、家傳、祠堂墳墓與族人的光榮記錄，宗族成員的狀態及交流情形一目瞭然；臺灣總督府旅券是當時出國須向國家申請的護照，記載申請人的基本資料、欲前行的地點以及目的，可看出人群動態的移動情形；同鄉會名簿記載移民地同鄉成員的姓名以及活動記錄，可看出人群移動及交流的情形；戶口調查資料則是某一時間點的人口統計資料，便於國家掌握人口移動，可從人口變化研析人口移動的原因。綜合上述，族譜、總督府旅券、同鄉會名簿、戶口調查資料皆可看出人群移動及交流的情形，故選(A)。逐一檢視選項，(B)族譜、同鄉會名簿為民間撰寫其團體活動的記錄，和國家建立及統治形塑較無直接關聯；(C)無法從總督府旅券、戶口調查資料看出文化類型及變遷；(D)相關資料和宗教較無相關，故不選。

    31. (丙)改縣為州是鄭經時代。

    32. (A)臺灣開山撫番事業始於沈葆楨；(B)清廷理番政策轉變始於牡丹社事件後；(C)劉銘傳時期更擴大開山撫番之事業；(D)從文中「薙髮」的管制、「戶口」的建立可知清廷積極掌控原住民族生活。

    33. (A)馬關條約簽訂後，紳民共推巡撫唐景崧為總統，成立臺灣民主國，設議院建號永清，並以藍底黃虎旗為國旗；(C)桃竹苗等地在客籍士紳吳湯興、姜紹祖等人領導下組建義軍抵抗日本接收；(D)清廷簽署馬關條約後，日本平定臺灣全島，此時抗日以游擊為主；(B)日軍登陸後臺北城陷入混亂，士紳辜顯榮等人開城門請日軍入城，並於臺北進行使政儀式，故(B)為正解。

    34. (D)乙未抗日期間，抗日軍在行動上以回歸清朝為主。

    35. 該制度為第三任臺灣總督乃木希典所設立之三段警備制，以有效鎮壓臺灣抗日活動，並避免軍隊、憲兵與警察間權責不清。

    36. 該法令原則上使日本法律適用於臺灣，而且限制總督的律令制定權，可知是指「法三號」，當時日本因民族自決風潮，進入大正民主時期，並調整治臺方針，推動內地延長主義。'
