  stem: '◎明清時期來臺者可以歸為一個時期，稱為移墾時期或移民時期都可以，日本投降後(1945~1952)再度有許多漢人從大陸來到臺灣，在臺灣史上可以說是時間最短、湧進最多漢人的時期，可以稱為逃難時期或撤退時期；將這兩個階段，簡單做一個比較：

    一、明中葉後陸續有漢人到臺灣移墾，清初期移民人數更多，這批移墾者大部分是屬於經濟性的移民，也就是說大部分是因為經濟或生存的原因來到臺灣，這批來自閩粵的移民具有濃厚的經濟取向，以謀求經濟利潤或希圖改善其生活狀況為主。他們大半趨利而來，重財之風較盛，雖然當時渡海的環境險惡，仍千辛萬苦自願而來…… 戰後外省人來臺原因則大部分是政治因素或戰亂因素來到臺灣，也就是避難的因素居多，這批人有些是公務人員及其眷屬，隨著政府遷移避居；軍人則隨著軍隊撤退來臺；也有部分對於共產黨的經濟政策與宗教政策沒有信心，為避免戰火的波及而來避難，這批移民者大部分都不是自願而來，他們對臺灣也沒有特別印象，多數是隨工作地點移動。

    二、男女比例方面，明清的移民由於是移墾性質，移居者男性多於女性，青壯男子多而婦女少，社會上婚姻困難，男女結婚的年齡相距懸殊。 戰後來臺外省人的男性比例大於女性，因此必須對外找尋對象，由於一般士兵教育不高，加上期盼很快回到大陸，並沒有立即結婚的準備，晚婚者多……。

    三、明清時期的移民以農民、漁民和勞動人口為主。一般而言，教育程度不高，根據光緒三十一年底的統計，移民的職業比，農業占75.3%，公務員及自由業僅占1.4%，這批移民者到臺灣大部分從事開墾工作。 戰後的移民者各階層都有，除軍公教人員及其眷屬外，移民分子較為複雜，教育程度高，有學者指出，這批移居臺灣者，與國共內戰初期蘇北人遷居上海極為類似，大多是地主、商人和學生。工作方面從事農、漁、牧者較少。

    四、明清時期移民，由於大多數來自福建（閩南）及廣東（客家）兩省，因此地緣關係較濃；此外，由於移民者互為引介，有部分宗親的血緣關係。而1949年前後的移民，軍隊以蔣的嫡系部隊為主，省籍較為分散，各省都有…… 此外，由於政府為安置來臺的軍人及其眷屬，興建許多眷村，形成特殊的眷村文化，無形之中也形成另一種追憶與認同。

    五、移民的時間，早期大陸移民從明末到清中葉，大約二百餘年，時間較久。1945年前後的移民則因戰亂的關係集中在1948～1953年之間，其中又以1949年為最多。……這批渡海來臺的移民者不會使用島上通行的福佬話(河洛話)或客家語，無法與當地居民流暢的溝通，過客的心態使他們一開始並沒有認真學習河洛語，長期以來的互不了解一開始並未改善。 請根據文章完成下表，歸納明清與戰後移民，在動機、性別、職業、省籍、來臺時間的比較。

