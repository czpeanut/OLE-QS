  stem: 有X、Y、Z、W四種元素，它們均為短週期元素（第二或第三週期元素），且在週期表中的相關位置如右圖。已知Y、Z、W三種元素的質子數之和為41，則元素X其核外的電子分布，在L（n=2）層的電子數電子有幾個？
  options:
  - label: A
    content: '6'
  - label: B
    content: '5'
  - label: C
    content: '4'
  - label: D
    content: '3'
  - label: E
    content: '2'
  assets:
