      rect:
      - 580.35
      - 494.5
      - 689.1
      - 535.3
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 第二、第三週期的元素，每相差一個週期則原子序+8。故我們可假設原子序：X＝A、Y＝A＋1、Z＝A＋9、W＝A＋10。故Y、Z、W者的原子序總和＝3A＋20＝41，可得A＝7。因此可知（X，Y，Z，W）＝（N，O，S，Cl）。X為N，其電子排列為（2，5）。故選(B)。
