  type: single
  page: 1
  stem: 下列關於元素與化合物的相關敘述，何者正確？
  options:
  - label: A
    content: 純物質的組成與性質沒有固定
  - label: B
    content: 由不同元素組成之物質必為混合物
  - label: C
    content: 能以物理方法由混合物中分離出純物質
  - label: D
    content: 能以化學方法再分解出其它物質，稱為元素
  - label: E
    content: 外觀看來為單一相之均勻混合物又稱為溶液，具有一定的組成與性質
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)純物質有固定的組成與性質；(B)不一定，也有可能為化合物；(D)稱為化合物；(E)均勻混合物的組成與性質不固定。故選(C)。
