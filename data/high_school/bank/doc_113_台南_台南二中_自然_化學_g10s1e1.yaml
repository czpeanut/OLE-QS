  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知25℃、1 atm下，2 L的甲氣體和3 L的$CH_{4}$質量比為5：4，則甲氣體可能為下列何者？
  options:
  - label: A
    content: Ne
  - label: B
    content: $NH_{3}$
  - label: C
    content: 'NO'
  - label: D
    content: $CO_{2}$
  - label: E
    content: Cl
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 體積比＝2：3即莫耳數比＝2：3。故莫耳數比＝2：3＝$\frac{5}{M}$：$\frac{4}{16}$，可得M＝30，選擇分子量為30的氣體。(A) 4；(B) 17；(C) 30；(D) 44；(E) 71。故選(C)。
