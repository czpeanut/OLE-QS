  page: 1
  stem: 關於化學基本定律的敘述，下列何者正確？
  options:
  - label: A
    content: 同溫、同壓下，同體積之各種物質含有同數的分子
  - label: B
    content: 原子說可以解釋定比定律、倍比定律及氣體化合體積定律
  - label: C
    content: $O_{2}$、$O_{3}$可以說明倍比定律
  - label: D
    content: 氣體化合體積定律是指在同狀況下各種氣體反應物消耗量與生成氣體產物的體積呈現簡單整數比
  - label: E
    content: 倍比定律的內容是組成一個化合物的原子間，其質量比恆為定值
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)須為氣體才遵守此定律（亞佛加厥定律）；(B)無法解釋氣體化合體積定律；(C)須為由兩種元素組成的化合物才能說明倍比定律；(E)倍比定律是指由兩種元素組成的多種化合物之間，當其中一種元素重量相等時，另一種元素的重量呈簡單整數比。故選(D)。
  tags:
