  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 全班的平均數為$\frac{20\times 50+40\times 80}{60}$＝$\frac{4200}{60}$＝70

    (2) 令 A 組 20 人的成績為 $x_{1}$，$x_{2}$，……，$x_{20}$

    B 組 40 人的成績為 $x_{21}$，$x_{22}$，……，$x_{60}$

    則$\begin{cases}\frac{x_{1}^{2}+x_{2}^{2}+\ldots \ldots +x_{20}^{2}}{20}-50^{2}=10^{2} \\ \frac{x_{21}^{2}+x_{22}^{2}+\ldots \ldots +x_{60}^{2}}{40}-80^{2}=5^{2}\end{cases}$ ⇒ $\begin{cases}x_{1}^{2}+x_{2}^{2}+\ldots \ldots +x_{20}^{2}=52000 \\ x_{21}^{2}+x_{22}^{2}+\ldots \ldots +x_{60}^{2}=257000\end{cases}$

    故全班的標準差為$\sqrt{\frac{x_{1}^{2}+x_{2}^{2}+\ldots \ldots +x_{60}^{2}}{60}-70^{2}}$＝$\sqrt{\frac{309000}{60}-4900}$＝$\sqrt{250}$＝$5\sqrt{10}$'
