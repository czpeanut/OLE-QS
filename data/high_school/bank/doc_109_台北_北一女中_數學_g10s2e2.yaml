  stem: '某班學生共 60 人，分 A、B 兩組參加數學競試，各組人數、平均及標準差如右表，則：

    | 組別 | 人數 | 平均 | 標準差 |

    | --- | --- | --- | --- |

    | A | 20 | 50 | 10 |

    | B | 40 | 80 | 5 |

    (1) 全班的平均數為＿＿＿＿。

