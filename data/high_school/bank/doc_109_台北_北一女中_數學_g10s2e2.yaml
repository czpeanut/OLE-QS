  stem: '在機器學習的實務中，對於未分群的資料進行分群是一件重要的課題，其中最基本的方法就是 K-means 分群法（K-means Clustering），透過疊代最佳化的技術，反覆更新群體的中心點和群體資料，以降低誤差函數值，當目標的誤差函數值不再下降，群體中心不再變動，即完成分群。設今一群體中有 10 筆一維數據

    （$x_{1}$，$x_{2}$，$x_{3}$，$x_{4}$，$x_{5}$，$x_{6}$，$x_{7}$，$x_{8}$，$x_{9}$，$x_{10}$）＝（30，40，40，40，50，50，50，50，60，70），K-means 常用的群體中心點即為使（$x_{1}$－p）$^{2}$＋（$x_{2}$－p）$^{2}$＋（$x_{3}$－p）$^{2}$＋……＋（$x_{10}$－p）$^{2}$ 有最小值的實數 p，則：

    (1) p＝＿＿＿＿。

    (2) 這 10 筆一維數據（$x_{1}$，$x_{2}$，$x_{3}$，$x_{4}$，$x_{5}$，$x_{6}$，$x_{7}$，$x_{8}$，$x_{9}$，$x_{10}$）＝（30，40，40，40，50，50，50，50，60，70）的標準差為＿＿＿＿。'
  answer:
  - (1) 48；(2) $2\sqrt{29}$
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝（$x_{1}$－x）$^{2}$＋（$x_{2}$－x）$^{2}$＋……＋（$x_{10}$－x）$^{2}$

    ＝$10x^{2}$－2（$x_{1}$＋$x_{2}$＋……＋$x_{10}$）x＋（$x_{1}^{2}$＋$x_{2}^{2}$＋……＋$x_{10}^{2}$）

    ＝10（$x^{2}$－2μ$_{x}$×x＋μ$_{x}^{2}$）＋（$x_{1}^{2}$＋$x_{2}^{2}$＋……＋$x_{10}^{2}$）－10μ$_{x}^{2}$

    ＝10（x－μ$_{x}$）$^{2}$＋10σ$_{x}^{2}$

    (1) 當 x＝μ$_{x}$＝$\frac{1}{10} (30+40+40+40+50+50+50+50+60+70)$＝48 時

    f（x）有最小值

    故 p＝48

    (2) f(48)＝（－18）$^{2}$＋（－8）$^{2}$＋（－8）$^{2}$＋（－8）$^{2}$＋$2^{2}$＋$2^{2}$＋$2^{2}$＋$2^{2}$＋$12^{2}$＋$22^{2}$＝10σ$_{x}^{2}$

    ⇒ 10σ$_{x}^{2}$＝324＋64×3＋4×4＋144＋484

    ⇒ 10σ$_{x}^{2}$＝1160

    ⇒ σ$_{x}^{2}$＝116

    ⇒ $\sigma _{x}=2\sqrt{29}$'
