  answer_status: verified
  answer_source: answer_key
  explanation: '$a_{2}$＝$\frac{1}{2-a_{1}}$＝$\frac{1}{2-\frac{1}{3}}$＝$\frac{3}{5}$

    $a_{3}$＝$\frac{1}{2-a_{2}}$＝$\frac{1}{2-\frac{3}{5}}$＝$\frac{5}{7}$，……，$a_{n}=\frac{2n-1}{2n+1}$

    $| a_{n}-1 | < \frac{1}{200}$

    ⇒ $\frac{2}{2n+1} < \frac{1}{200}$

