- id: doc_109_台北_北一女中_數學_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有一項數為偶數的等比數列，其首項為 5，奇數項和為 1705，偶數項和為 3410，則其項數為何？
  options:
  - label: A
    content: '6'
  - label: B
    content: '8'
  - label: C
    content: '10'
  - label: D
    content: '12'
  - label: E
    content: '14'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '令公比 r，

    則前 n 項為 5，5r，$5r^{2}$，……，$5r^{n-1}$

    $\begin{cases}5+5r^{2}+\ldots \ldots +5r^{n-2}=1705 \ldots \ldots \ldots \ldots \ldots ① \\ 5r+5r^{3}+\ldots \ldots +5r^{n-1}=3410\ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    $\frac{②}{①}$得 r＝2

    故 1705＋3410＝$5+5\times 2+5\times 2^{2}+\ldots \ldots +5\times 2^{n-1}$＝$\frac{5 (2^{n}-1)}{2-1}$

    ⇒ 5（$2^{n}$－1）＝5115

    ⇒ $2^{n}$＝1024 ⇒ n＝10

    故選(C)'
