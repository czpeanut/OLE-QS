  stem: 若$\frac{1}{1\times 2\times 3}+\frac{1}{2\times 3\times 4}+\frac{1}{3\times 4\times 5}+\ldots \ldots +\frac{1}{n (n+1) (n+2)}=\frac{11}{45}$，則自然數 n＝？
  options:
  - label: A
    content: '5'
  - label: B
    content: '6'
  - label: C
    content: '7'
  - label: D
    content: '8'
  - label: E
    content: '9'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{1}{1\times 2\times 3}+\frac{1}{2\times 3\times 4}+\ldots \ldots +\frac{1}{n (n+1) (n+2)}$

    ＝$\frac{1}{2} \left[ \left( \frac{1}{1\times 2}-\frac{1}{2\times 3} \right) + \left( \frac{1}{2\times 3}-\frac{1}{3\times 4} \right) +\ldots \ldots +\left( \frac{1}{n (n+1)}-\frac{1}{(n+1) (n+2)} \right) \right]$

    ＝$\frac{1}{2} \left( \frac{1}{2}-\frac{1}{(n+1) (n+2)} \right) =\frac{11}{45}$

    ⇒ $\frac{1}{(n+1) (n+2)}=\frac{1}{2}-\frac{22}{45}=\frac{1}{90}$

    ⇒ （n＋1）（n＋2）＝90

    ⇒ $n^{2}$＋3n－88＝0

    ⇒ （n－8）（n＋11）＝0

    ⇒ n＝8 或－11（不合）

    故選(D)'
