  stem: 若原有 10 筆數據 $x_{1}$，$x_{2}$，……，$x_{10}$，其平均數為 40，標準差為 10，將原始數據線性調整後得 $y_{i}$，$y_{i}$＝－$2x_{i}$＋5，將原始數據 $x_{i}$ 標準化後得數據 $z_{i}$，下列敘述哪些正確？
  options:
  - label: A
    content: $x_{1}$＋$x_{2}$＋……＋$x_{10}$＝400
  - label: B
    content: $z_{1}$＋$z_{2}$＋……＋$z_{10}$＝0
  - label: C
    content: $z_{1}^{2}$＋$z_{2}^{2}$＋……＋$z_{10}^{2}$＝10
  - label: D
    content: y 的平均數為－75
  - label: E
    content: y 的標準差為－20
  answer:
  - A
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵$x_{1}$，$x_{2}$，……，$x_{10}$ 平均為 40

    ∴$\frac{x_{1}+x_{2}+\ldots \ldots +x_{10}}{10}=40$

    ⇒ $x_{1}$＋$x_{2}$＋……＋$x_{10}$＝400

    (B)(C) ○：∵$z_{1}$，$z_{2}$，……，$z_{10}$ 為標準化數據

    ∴$z_{1}$，$z_{2}$，……，$z_{10}$ 平均為 0，標準差為 1

    $\begin{cases}\frac{z_{1}+z_{2}+\ldots \ldots +z_{10}}{10}=0 \\ \frac{z_{1}^{2}+z_{2}^{2}+\ldots \ldots +z_{10}^{2}}{10}-0^{2}=1\end{cases}$ ⇒ $\begin{cases}z_{1}+z_{2}+\ldots \ldots +z_{10}=0 \\ z_{1}^{2}+z_{2}^{2}+\ldots \ldots +z_{10}^{2}=10\end{cases}$

    (D) ○ (E) ╳：∵$y_{i}$＝－$2x_{i}$＋5

    ∴μ$_{y}$＝－2μ$_{x}$＋5＝－75，σ$_{y}$＝∣－2∣σ$_{x}$＝20

    故選(A)(B)(C)(D)'
