  page: 1
  stem: 下列關於人體呼吸構造的敘述，何者正確？
  options:
  - label: A
    content: 會厭軟骨位於咽，吞嚥時會向下壓
  - label: B
    content: 鼻腔與口腔之間由軟顎與硬顎分隔，軟顎在前，硬顎在後
  - label: C
    content: 氣管壁具有硬骨可維持其形狀
  - label: D
    content: 肺泡間富含彈性纖維與肌肉，能主動調節肺部體積
