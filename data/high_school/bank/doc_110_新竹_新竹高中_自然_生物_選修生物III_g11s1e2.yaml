- id: doc_110_新竹_新竹高中_自然_生物_選修生物III_g11s1e2_s3_43
  section: 3
  number: 43
  type: single
  page: 6
  stem: 根據附圖的結構，請判斷四氫大麻酚具有下列何種官能基？（圖中 或 代表凸出或凹入的單鍵，線段轉角或尾端皆為C，且每個C需接滿4個鍵，未接滿4個C代表將鍵結的H省略。）
  options:
  - label: A
    content: 醚基
  - label: B
    content: 酮基
  - label: C
    content: 醛基
  - label: D
    content: 酯基
  group_stem: '四氫大麻酚（Tetrhydrocannabinl, THV, 附圖）是從大麻（Cannabis sativa）中萃取出的主要神經活性物質，科學家在研究四氫大麻酚的神經後機制時，發現人體內具有可與四氫大麻酚結合的受體；$CB_{1}$與$CB_{2}$。$CB_{1}$廣泛分布於中樞與神經系統，$CB_{2}$則表現在免疫系統。$CB_{1}$位於突觸前細胞膜上，而人體也能產生部分的內源性大麻素。當$CB_{1}$被神經細胞本身產生的內源性大麻素或個體攝入的四大麻酚結合時，會抑制一種名為GABA（γ-Aminobutyric acid，4-氨基丁酸）的神經傳導物質得出，GABA原先會促進突觸後神經元$Cl^{－}$通道開啟，使$Cl_{－}$擴散入細胞。.

    長期使用含四氫大麻酚的藥物，會引起神經可塑性的變化，進而改變發育中的神經新生和成體的學習與記憶能力。值得一提的是，反對大麻開放使用最強而有利的論證，就是長期吸食大麻酚也會造成學習與記憶的衰退，進而影響到工作上的表現，推論這主要是四氫大麻酚在腦部持續刺激$CB_{1}$的結果。此外，四氫大麻酚也會透過$CB_{1}$和$CB_{2}$的作用降低痛神經的活性，進而減緩個體的疼痛感。'
  shared_asset: g3_43_46
  tags:
    labeled_by: agent
    label_confidence: high
    label_note: 跨科有機化學官能基判斷題，非生物科課綱單元
  difficulty: 2
