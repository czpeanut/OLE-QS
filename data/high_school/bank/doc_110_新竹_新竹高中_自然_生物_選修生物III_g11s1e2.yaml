  group_stem: 血管收縮素轉化酶抑制物（angiotensin-converting enzyme inhibitor，ACEi）是一類群常用降血壓藥物，主要機制是阻斷血管收縮素原轉換成具生理活性的血管收縮素。一群奈及利亞研究者在研究藥時發現過去有使用洛神花（Hibiscus sabdarjfa）降血壓的案例，遂想比較洛神花萃取物與ACEi對血壓調降的療效。研究者先將高血壓患者分為甲、乙、丙三組，每一組最少有25位受試者，分別施打安慰劑（甲組，利用黑醋栗果汁充當與洛神花顏色相符的安慰劑，其對血壓無影響）、利欣諾普（乙組，lisinopri，一種常用的ACEi）與洛神花萃取物（丙組）對不同組高血壓患者進行雙盲測試，進行為期四週的研究（Baseline表示），每日早餐前服用一劑藥物，並檢測各種生理狀態，結果如附圖一～附圖四所示。圖中標註a或＊表示其與安慰劑組具有顯著差異，標註數量愈多代表顯著性愈高。
