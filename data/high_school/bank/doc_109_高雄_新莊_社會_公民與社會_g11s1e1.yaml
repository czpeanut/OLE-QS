  stem: 2020年6月，歷經23年努力，我國終於獲得世界動物衛生組織認可為口蹄疫非疫區，可以出口生鮮豬肉，首要海外市場鎖定新加坡及港澳。業界人士表示，加拿大、美國、丹麥等國的養豬業規模大、現代化程度高，其生產的冷凍豬肉行銷全球，連我國都大量進口；相較之下，冷凍廠商不會選擇使用臺灣豬肉出口，因為成本太高。根據上文推論，下列我國與他國的對照，何者最為正確？
