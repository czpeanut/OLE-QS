  section: 1
  number: 9
  type: single
  page: 1
  stem: 傅利曼《世界是平的》一書，強調無國界的供應鏈帶動全球分工與貿易的興盛。開發中國家，因為低廉的人力及土地成本，專心發展「低端製造」，而歐美先進國家則專注在「微笑線」的兩端，賺取原創設計與市場行銷豐厚的利潤。但發生疫情後，全球分工、供應鏈經濟都要重新考量。因為醫療、衛生等防疫的「低端製造」，變得十分重要。因此我們看到時尚精品業的古馳、普拉達、聖羅蘭等加入製造口罩、防護衣行列，迪奧、嬌蘭等化妝品廠商投入生產乾洗手，通用、特斯拉等汽車製造商改做呼吸器。請問若以「比較利益法則」來分析上文內容，何者敘述正確？
  options:
  - label: A
    content: 國際間專業分工較不利於歐美先進國家
  - label: B
    content: 歐美技術衰退又開始製造口罩等商品
  - label: C
    content: 此改變證明開發中國已自有絕對利益
  - label: D
    content: 歐美現階段製造低端商品機會成本較低
