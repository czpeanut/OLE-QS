  stem: 小楷和米莉一人出一半的錢，一起買了一臺汽車共用，後來小楷因為手頭緊，想賣車換錢，但米莉比較希望出租汽車收取租金。請問依照所有權的特性來看，下列何者是上述事件的可能發展？
