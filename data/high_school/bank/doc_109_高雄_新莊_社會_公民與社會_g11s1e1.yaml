  section: 1
  number: 6
  type: single
  page: 1
  stem: 阿洪參加喜宴時遇到國中同學小溫，問起對方工作的狀況。小溫說，自己負責待在工廠的控制室裡，監督機器運作有無異常狀況需要排除，由於這些機器的檢修挺專門的，他最初花了不少時間才上手，不過現在已經駕輕就熟。他覺得雖然工作的待遇很好，現在每天上班也像是去吹冷氣，但有時還是會懷疑要是離開了這間工廠，自己還有沒有競爭力。請問小溫的情況反映了專業分工的什麼問題？
  options:
