- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小艾擔任高中學生會會長，根據相關規定，她得以學生會會長身分，出席校務會議為學生發聲，並擁有表決權。小艾認為這些規定和實踐，展現校園民主精神，因此從未缺席且積極參與。前述校園民主的實踐，與下列哪項政府落實民主治理的理念最相近？
  options:
  - label: A
    content: 某女校在招收男學生前，學生會要求召開校務會議聽取學生意見
  - label: B
    content: 某高中校長決定與大學合併前，提出意見書分析通過與否的利弊
  - label: C
    content: 教育主管機關建置校務資訊公開之平臺，公布某校的新生註冊率
  - label: D
    content: 某校校長因為校園霸凌的事件，受邀至議會接受議員的監督質詢
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 民主治理是由「民主」與「治理」所結合的新觀念。民主意指多數決或主權在民；治理則是政府及民間共同合作解決社會問題的過程。選項中唯有(A)是聽取不同人的意見，符合民主治理的定義。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 民主治理有一項重要的核心概念為課責（accountability）。其概念包含政府應扮演具強制力的負責機構，以及政府需對本身行為或政策，向人民提出解釋、說明與回覆。根據上述課責的敘述，下列何者正確？
  options:
  - label: A
    content: 勞動部發生霸凌事件後，勞動部長主動請辭下臺是負起法律責任
  - label: B
    content: 立法院凍結觀光署觀光發展基金預算，屬於內部課責方式的展現
  - label: C
    content: 班班有鮮乳政策，因為各界反彈，而宣布停止辦理屬「回應性」
  - label: D
    content: 依《政府資訊公開法》規定，縣政府應該被動公開科技園區設廠計畫
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為政治責任。(B)屬於外部課責。(C)回應性是行政人員必須回應社會多元的價值，亦即應熟悉民眾不同的問題與需求，並透過公共政策予以解決，為正解。(D)政府應該主動公開設廠計畫。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 潮州鎮公所曾於公共政策網路參與平臺中，提出「公民審議─潮州鎮老街假日散步地圖（活化建基路老街）」之參與式預算計畫，下圖為入選的 4 個提案。關於參與式預算的敘述，下列何者正確？
  options:
  - label: A
    content: 4 個提案皆由鎮公所所提出，再由人民投票表決預算使用方式
  - label: B
    content: 4 案總票數呈現出，在地居民踴躍參與投票，政策代表性充足
  - label: C
    content: 為了避免預算延宕，提案之後無需公開討論，應立即投票表決
  - label: D
    content: 由下而上的公民參與，以公私協力的審議精神來實踐民主治理
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 169.55
      - 463.65
      - 514.55
      - 637.75
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「參與式預算」是由公民來決定一部分公共預算支出的優先順序，亦即由住民和社區群體代表，以正式或非正式會議共同討論各類攸關民眾生活的公共預算支出優先順序，並可藉由提出計畫，並且投票等方式來決定，答案為(D)。(A)應是皆由人民提案。(B)從票數無法得知人口數，而無法得知是否踴躍參與投票。(C)參與式預算強調民眾共同參與，提案後須經公開討論才能投票表決。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 2023 年 5 月間，臺灣爆發一系列#MeToo 事件，許多曾經的受害者藉著這樣的社會氛圍，紛紛出面公開自己的遭遇，除了帶起民眾廣泛討論外，也引發社會各界對於現行性平三法的檢討聲浪。在社會強大輿論壓力下，行政院與立法院隨即推進修法，於同年 7 月間三讀修正現行「性平三法」，修法包括擴大性平三法適用範圍、改善申訴制度、加重處罰等，並於 2024 年 3 月 8 號婦女節施行。輿論壓力不僅使相關議題受到關注，更使政府火速修訂相關法律。從民主治理角度而言，下列何項分析符合題文的敘述？
  options:
  - label: A
    content: 國會修訂法律與否，必須端看社會輿論壓力的程度而定
  - label: B
    content: 內部課責只能仰賴國會修改或制定法律，達到權責相符
  - label: C
    content: 輿論能對政府產生監督的效果，使政府負起應有的責任
  - label: D
    content: 輿論壓力是所有民主課責制度中，最重要且有效的手段
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應看法律是否能符合社會變遷所需。(B)內部課責機制乃內在於行政系統之課責，而非來自立法部門。(D)輿論僅是課責的一種方式，並非最重要且有效的手段。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 高鐵南延屏東，過去共評估「左營方案」與「高雄方案」，行政院長近期宣布將採用高雄方案，以兼顧行車安全、高鐵運量以及高雄的南北平衡發展，並承諾工程會將對民眾及環境的衝擊縮至最小。政府邀請專業人士擔任環評委員，是典型的專家參與治理，也是民主治理中避免行政專斷問題發生的方式之一。不過，此治理方式仍有不完美之處，下列何者最可能為專家參與治理的特色？
  options:
  - label: A
    content: 政策可行性較為低落
  - label: B
    content: 政治統治的方法之一
  - label: C
    content: 由專家承擔政策成敗
  - label: D
    content: 提升資源使用的效率
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 專家對於議題都較為熟悉且具有專業知識，因此邀請專家參與治理，可以使決策及資源利用更具有效率，答案為(D)。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 某位網紅發布熱門影片，質疑媒體亂象，引起熱烈討論。對此，某位政治人物表示，媒體屬於第四權，應該獨立、公正與客觀，「但為什麼大家都能輕易說出各家媒體的政治傾向？」下列新聞事件的報導，何者才是媒體真正捍衛民眾「知的權利」、扮演「第四權」角色的表現？
  options:
  - label: A
    content: 因應高齡社會，學者投書媒體廢除「巴氏量表」
  - label: B
    content: 知名速食店春節連休 5 天，新聞瘋傳呼籲民眾別撲空
  - label: C
    content: 某里長為慶祝我國奪得冠軍，在市場旁邊發放鹹酥雞
  - label: D
    content: 名嘴在檢察官起訴前，詳實報導民代賄賂的犯案細節
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「媒體」為民主政治中行政權、立法權、司法權以外的「第四權」。在民主的社會中，媒體的新聞自由協助人民監督政府，防止政府濫權。(A)媒體讓民眾了解專家的立場，並揭露資訊，為正解。(B)(C)(D)皆非由媒體所主導產生的結果。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 1918 年爆發的「西班牙流感」，曾造成全球數千萬人死亡。該疫情早在 1918 年春天，即在大戰的西線戰場出現，只是當時許多國家正值戰事，進行媒體審查，隱匿本國及軍隊的疫情，但西班牙因未參戰也沒有媒體審查限制當地疫情報導，在其他國家大量轉載西班牙的新聞下，導致世人誤以為該次流感是從西班牙開始。後來研究發現，流感第一個病例於 1918 年春天出現在美國堪薩斯城的軍營，隨後因美國參戰而傳播至歐陸。某生發現至今仍有很多人誤以為西班牙流感起源於西班牙，為探究此種以訛傳訛、持續發生的認知錯誤問題，該生最適合使用下列哪個概念展開探究？
  options:
  - label: A
    content: 媒體競爭
  - label: B
    content: 媒體壟斷
  - label: C
    content: 媒體再現
  - label: D
    content: 媒體監督
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 西班牙流感是因為媒體錯誤報導而產生的結果，此屬於(C)媒體再現導致的結果。媒體再現涉及媒體組織的操作，在政治議題上尤為明顯，媒體選擇讓誰發言，讓哪些訊息被呈現，並且透過記者與主播對事件進行詮釋，這樣的再現方式決定了能被我們接觸到的「真實」。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '下表為媒體常用的各種置入性行銷之方式，下列有關置入性行銷的討論，何者正確？

    | 報紙專題 | 以「廣編特輯」或專欄設計 |

    | --- | --- |

    | 電視新聞 | 以報導或專題方式呈現（現場連線或跑馬燈訊息） |

    | 戲劇節目 | 主角對話中帶出產品優點並宣揚 |

    | 電影 | 主角使用某產品或持續出現品牌 LOGO |

    | 歌手 MV | 歌手代言產品，在 MV 中露出增加曝光 |

    | 網路部落格 | 邀請版主體驗並撰寫感想 |

    | 線上遊戲 | 將任務與商品結合，增加玩家印象 |'
  options:
  - label: A
    content: 置入性行銷僅限於商業性物品的推銷，政府不會置入政策宣導
  - label: B
    content: 僅會增加閱聽者的相關印象，並無法增加廠商商品的銷售收入
  - label: C
    content: 置入性行銷除了讓訊息過於單一，亦引導公共意見的討論方案
  - label: D
    content: 知名網路部落客撰寫使用心得文，皆是真實體驗後的感受心得
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)政府也會在媒體中置入政策宣導。(B)民眾看到置入的商品，也會引起購買的慾望，而增加商品的銷售收入。(C)此置入性行銷會帶來的影響，為正解。(D)部落客撰寫心得文有收取廠商的好處，因此可能有誇大功效或盡量推銷商品優點的情形。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 某新聞臺做出以下報導：「『颱風天出遊遭掉落外牆砸車』新聞，經當事人反映後，發覺原始內文有誤，一家人出門並非『出遊』。此報導造成觀眾混淆、也對當事人家屬有所冒犯，特此致歉。原報導已調整並移除錯誤內容，同時也製作另一則新聞報導。今後將更善盡新聞把關及精確報導之責。」該報導是行使媒體近用權中的何者？
  options:
  - label: A
    content: 第四權
  - label: B
    content: 使用權
  - label: C
    content: 更正權
  - label: D
    content: 答辯權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 發現報導內容有誤後更正，此為媒體接近權中的(C)更正權。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: '某國媒體報導，該國原住民族罹患心理疾病比率、自殺率、平均壽命與全國之比較，如右表。該報導在未詳查原住民族生活困境的情形下，即宣稱這是因為原住民族不注重身心健康，例如偏好高脂肪、高甜度垃圾食物所致。類似此種缺乏同理與理解的報導，最可能引導社會大眾對原住民個人或民族形成何種更加不利的社會印象？

    |  | 原住民族 | 全國 |

    | --- | --- | --- |

    | 罹患心理疾病比率（％） | 14.2 | 9.0 |

    | 自殺率（人／每 10 萬人） | 15.7 | 8.8 |'
  options:
  - label: A
    content: 原住民個人常缺少改變傳統習慣的意願
  - label: B
    content: 原住民個人缺少為自己健康負責的態度
  - label: C
    content: 原住民族缺少傳統飲食文化的知識傳承
  - label: D
    content: 原住民族缺少改變現代生活步調的策略
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「報導推論該國原住民的自殺率與心理疾病比率都位居全國高位，顯現原住民不注重身心健康。」可知報導將原住民族的犯罪與心理疾病歸咎於其民族性的個人原因，使自身陷於罹患心理疾病與自殺，而非制定性或結構的問題，容易強化(B)原住民個人缺少為自己負責的意願與態度的刻板印象。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 網路平臺或社群網站通常會蒐集、記錄使用者的數位足跡（包含瀏覽紀錄、搜尋關鍵詞、社群媒體活動等）。若使用者缺乏警覺，讓過多的個人資訊暴露於網路，資訊安全便容易受到威脅。關於科技媒體應用相關敘述，下列何者正確？
  options:
  - label: A
    content: 公民老師轉貼的消息必然正確，無須再經過網路查證即可以公開分享於社群平臺
  - label: B
    content: 由於網路演算法的影響，社群平臺會產生同溫層效應，民眾會接收到多元的資訊
  - label: C
    content: 臉書小編發文時，會主動揣摩民眾感興趣的議題，此即稱為「新聞室的社會化」
  - label: D
    content: 公民可依據《個人資訊保護法》監督社群網站資料的使用是否違反蒐集資料的目的
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)這是錯誤認知，每個人所說的訊息可能都帶有自己的觀點，不能一味接受。(B)同溫層會使民眾接收到單一的資訊。(C)此為回聲室效應。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 下圖為國家通訊傳播委員會（NCC）官網新聞稿專區的畫面節錄，請問下列關於 NCC 的敘述，何者正確？
  options:
  - label: A
    content: 其職責為監督媒體錯誤報導的民間團體
  - label: B
    content: 製作適合少數群體需求節目的公共媒體
  - label: C
    content: 透過監督政府施政以行使媒體的第四權
  - label: D
