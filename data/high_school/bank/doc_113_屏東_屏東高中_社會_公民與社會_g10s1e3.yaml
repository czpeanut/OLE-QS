  group_stem: '為因應我國民眾廣泛應用資訊設備及網路表達對時事及公共政策的看法，國家發展委員會參考美國白宮網站“We the People”，於 2015 年建置「公共政策網路參與平臺」，作為全民參與公共事務的常設管道，並於成案後要求權責機關於規定時間內處理及回應。

    然而，有網友卻提案廢除此一平臺。不少附議者認為，事實上能成案而順利推動，或具有建設性的提案屈指可數，質疑此平臺並非政府傾聽民意之處，反而被當成民意背書的工具；再者，以「國高中上課時間改為 9：30 到 5：00」此一提案為例，附議者的分布如圖所示（共 10,296 人附議），明顯集中在特定區域'
