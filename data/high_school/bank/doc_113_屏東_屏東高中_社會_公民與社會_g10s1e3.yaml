  explanation: (A)這樣不利多元文化之交流與理解。(B)此為可以促進多元文化及文化平等之做法，為正解。(C)對於人權議題不能以公投決定，因為弱勢者在人數上通常較少，公投對其不利。(D)可以開設官方語言課程，但不用強迫其一定要上，這反倒有同化之疑慮，不利於族群平等。
- id: doc_113_屏東_屏東高中_社會_公民與社會_g10s1e3_s2_35
  section: 2
  number: 35
  type: multiple
  page: 8
  stem: 媒體傳播的內容可能無意識或有意識地採用某種意識型態進行編寫及產製，再傳播給閱聽人，因此並非完整而客觀地直接反射社會現實，甚至產生媒體再現不平等的問題。下列哪些新聞標題就有這樣的現象？
  options:
  - label: A
    content: 人口普查專員拜訪原住民家庭，先喝一杯再填表
  - label: B
