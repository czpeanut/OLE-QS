  stem: 美國哈佛大學和北卡羅萊納大學數 10 年來將學生族裔背景作為入學錄取考量因素，給予非裔和拉丁裔優於白人和亞裔的入學優勢，目的除了保障特定族群的就學權、扭轉弱勢階級，也提升大學校園教育的多元性。然而以學生族裔背景作為入學錄取考量因素，究竟是保障特定族群的合理差別待遇，還是涉及對於非受保障族群的反向歧視、違反人人平等，一直存在爭議，也有相關的訴訟案在進行。2023 年 6 月 29 日，美國聯邦最高法院裁決結果出爐，大法官以 6：3 判決兩校平權措施違憲。大法官在意見書指出，雖然平權措施立意良善，然而學校著重將族裔背景作為檢驗標準，而非申請者個人能力、經歷等條件，如此以「保障特定族裔來追求多樣性」的招生計劃，反而無可避免地涉及種族歧視。2025 年初，美國連鎖速食龍頭麥當勞宣布將取消部分多元化政策，成為 2023 年最高法院裁定大學不得依據「平權措施」招生後，重新思考相關政策的最新一家「反覺醒」美國企業。下列有關此案的分析何者正確？
  options:
  - label: A
    content: 根據聯邦最高法院判決的判決，其更為重視形式平等
  - label: B
    content: 早期依學生族裔背景做考量，是為了實現齊頭式平等
  - label: C
    content: 為了實現立足點的平等，應該支持大法官的判決結果
  - label: D
    content: 大法官認為此入學之規定符合形式平等所追求之原則
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)聯邦最高法院判決兩校平權措施違憲，顯示其更重視無差別對待的形式平等，為正解。(B)為積極型的差別待遇，是為實現立足點平等。(C)大法官的判決結果認為保障特定族裔的招生計劃，反倒會造成種族歧視，因此應實施無差別對待的形式平等。(D)大法官的判決結果認為保障特定族裔的招生計劃，違反形式平等，反倒會造成種族歧視。
