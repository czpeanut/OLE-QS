  stem: 下列哪一敘述符合大法官解釋文中的觀點？
  options:
  - label: A
    content: 無差別對待看似公平，但可能對弱勢群體造成更加不利的結果
  - label: B
    content: 政府於採用合理差別對待政策時，也需在受影響者間取得平衡
  - label: C
    content: 基於憲法保障人民的工作權，立法者不得因任何理由加以限制
  - label: D
    content: 只有先落實形式上平等，才能達成扶助弱勢進而促成實質平等
  group_stem: '司法院於 2008 年公布「大法官釋字第 649 號解釋」，認定《身心障礙者保護法》（後修正為《身心障礙者權益保障法》）第 46 條第 1 項，按摩業專由視障者從事之規定與《憲法》第 7 條平等權、第 15 條工作權及第 23 條比例原則之意旨不符，宣告違憲。

    解釋文中指出，由於視障者在成長、行動、學習、受教育等方面之諸多障礙，在工作的選擇上比一般人少，使其弱勢的地位不易改變。根據我國《憲法》第 155 條及《憲法增修條文》第 10 條第 7 項規定也明白揭示，國家有扶助弱勢之義務。因此，立法者基於保障視障者工作權之目的，加上衡量視障者長久以來多以按摩業為生，制定保障視障者的優惠性差別待遇，具備憲法上重要的公共利益。

    此外，《憲法》第 15 條規定人民之工作權應予保障，人民有從事工作及選擇職業之自由，立法者若要對此加以限制，除了須具備重要公共利益外，限制的手段也不得對人民造成過度的限制，且與目的之間具備實質的關聯，才符合憲法對平等權的保障。然而，立法者僅允許視障者從事按摩業，使得非視障者（非視障之身心障礙者也在禁止之列）必須轉行或失業，也無法促進社會整體發展，顯然與視障者的就業利益不相當。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從解釋文「立法之目的仍須該規定所追求之目的為重要公共利益，所採禁止非視障者從事按摩業之手段，須對非視障者之權利並未造成過度限制，且有助於視障者工作權之維護，而與目的間有實質關聯者，方符合平等權之保障。」最相符的敘述為(B)政府於採取合理差別對待政策時，也需在受影響者間取得平衡。
