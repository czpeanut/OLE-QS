  group_stem: 近年來當有災害發生，例如：地震、大雷雨或重大疫情等，國家通訊傳播委員會（NCC）會透過電信業者即時傳送相關防災簡訊（災防告警訊息）到民眾手機，使民眾能在第一時間掌握訊息與應變。不過有網友上網發文表示，當身邊的人手機警報聲大作，自己的手機卻毫無動靜，自嘲為被國家遺忘並認證的「國家級邊緣人」。由 NCC 網站公告可知，非所有手機都支援此項功能，這項服務可能會受限於民眾的手機型號，以及是否為 4G 服務（第四代行動通訊技術）。
  answer:
