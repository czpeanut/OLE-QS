  group_stem: '108 新課綱將 7 國東南亞新住民語言納入國小「必選」，讓臺灣開創全球先例，卻也引發部分家長質疑，認為東南亞語列為必選，會排擠英文學習、動搖中文地位。反彈聲浪不只針對英文學習，還有家長表示，母語應該跟媽媽學就好，另外在網路論壇也有網友稱東南亞語言為「土人語」，顯示民眾對「我族」意識被挑戰的焦慮。

    母親來自越南，也是新課綱課審委員唯一跨國婚姻子女的劉小姐表示，「看到很多人說教母語是媽媽的責任，但新住民家庭過去 20 年受到很多歧視，不管是生活或語言，我們基本上不會被鼓勵要學媽媽的話。」從小到大同儕之間，在路上聽到外籍移工對話，會模仿、會訕笑，「在這樣的情境下，小朋友會害怕使用那個語言，那並不是家人個別能扭轉的，是整個社會氛圍要改變。」'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
