  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 媒體再現指透過新聞鏡頭拍攝、文字記者撰稿、新聞價值排序、編輯主管篩選等一連串的過程，將社會事件或人物重現於媒體世界中。(A)(B)(C)(D)皆是媒體針對特定群體加深刻板印象之情形，具有媒體再現不平等之情形。(E)看不出有針對特定群體之歧視情形，不屬於媒體再現不平等的問題。
