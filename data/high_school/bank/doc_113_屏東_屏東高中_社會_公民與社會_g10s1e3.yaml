  - label: C
    content: 顏值贏很大，10 大美女議員候選人中有 7 人當選
  - label: D
    content: 伊斯蘭開齋節，眾多印尼移工占據車站大廳惹怨
  - label: E
    content: 居家隔離檢疫者犧牲小我，指揮中心呼籲勿歧視
  answer:
