  stem: 唐太宗下令大臣修《氏族志》，欲排定各姓氏等級。編成之後，太宗不滿意，指示重修時只需根據現在的官爵等第區分等級。修訂版將各姓氏分成九等級，以皇室為首，外戚次之。高宗時，宰相李義府門第寒微，想與山東世族結親被拒，乃上告高宗。唐高宗因此下令，山東世族「七姓十家不得自為婚」。唐代修訂《氏族志》發布「禁婚令」，最主要目的是
  options:
  - label: A
    content: 擔憂世族通婚，聲氣相通，壟斷科舉考試制度
  - label: B
    content: 避免傳統世族透過聯姻結盟，禁婚壓抑其社會地位
  - label: C
    content: 禁止世族近親通婚，避免造成人倫與社會關係混淆
  - label: D
    content: 擔心世族通婚，擴大土地兼併，造成農民流離失所
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 魏晉以來的「九品官人法」，形成以世家大族為核心的門閥政治。出身關隴集團的李唐皇室，在門第上竟不如山東世族，因此唐太宗要求「根據現在的官爵等第區分等級」，且「以皇室為首，外戚次之」。唐高宗又規定「七姓十家不得自為婚」，顯示朝廷欲透過壓抑世族地位，打破長久以來的門閥政治，故答案為(B)。(A)科舉考試不以門第為標準，世族難以壟斷。(C)禁婚是為防止世族聯姻壯大勢力，並非出於人倫道德的考量。(D)朝廷打壓世族勢力與地位，與土地兼併無關。
