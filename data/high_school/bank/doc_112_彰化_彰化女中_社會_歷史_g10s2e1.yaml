- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 有一春秋霸者進兵洛陽郊外，周天子恐慌，遣人前往勞軍，霸者得意之際竟問起周鼎大小輕重，對曰：「成王定鼎于郟鄏，卜世三十，卜年七百。天所命也，周德雖衰，天命未改，鼎之輕重未可問也。」此霸者動機為何？
  options:
  - label: A
    content: 擺脫周王室的束縛成為獨立自主的國家
  - label: B
    content: 想取代周天子成為天下共主
  - label: C
    content: 只想知道周王室鼎的輕重
  - label: D
    content: 脅迫周王室向他納貢
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從「成王定鼎……周德雖衰，天命未改，鼎之輕重未可問也」，可見鼎是周的王權象徵，周朝晚期有霸者想問周鼎大小輕重，顯示其非單純想知道鼎的輕重，而是欲取周而代之，故答案為(B)。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 以下內容節錄自朝鮮文學家朴趾源的著作《熱河日記》：「昔倭人覆我疆域，我神宗皇帝提天下之師東援之。竭帑銀以供師旅，復我三都，還我八路。我祖宗無國而有國，我百姓得免雕題卉服之俗，恩在肌髓，萬世永賴，皆吾上國之恩也。」請問這段文字提到哪段歷史，為何作者對「上國」這般感念？
  options:
  - label: A
    content: 壬辰之役，免於失國之恨
  - label: B
    content: 丁卯戰爭，驅逐入侵金人
  - label: C
    content: 清軍入關，成為清朝藩屬
  - label: D
    content: 甲午戰爭，擺脫日本殖民
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「昔倭人覆我疆域，我神宗皇帝提天下之師東援之」，即可推知為豐臣秀吉侵略朝鮮，明神宗應朝鮮請求出兵援助的壬辰之役，答案為(A)。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 西元 1696 年，越南後黎朝皇帝下詔：「自清帝入中國，剃髮短衣，一守滿洲故習。宋明衣冠禮俗為之蕩然。北商往來日久，國人亦有效之者。乃嚴飭北人籍我國者，言語衣服，一遵國俗。……沿邊之民，亦不得效其聲音衣服，違者罪之。」請就此道命令，判斷以下描述何者正確？
  options:
  - label: A
    content: 雖然中國和越南的互動緊密，但越南人不曾效仿中國人的衣著
  - label: B
    content: 若中國人入籍後黎，他們仍可保留自身文化傳統，不用換上當地服飾
  - label: C
    content: 當時皇帝因自詡傳承了中國宋、明朝的禮儀文化，而抗拒清女真的衣著
  - label: D
    content: 越南社會風氣自由，政府不會嚴厲規定人民的衣冠禮俗
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從「北商往來日久，國人亦有效之者」，可知越南也有人民受中國商人影響。(B)從「嚴飭北人籍我國者，言語衣服，一遵國俗」，可知入籍的中國人必須遵守該國習俗。(C)為正解。(D)詔書內容顯見後黎朝政府對人民的衣冠禮俗規範甚嚴。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '以下資料皆出自於唐代。

    資料一：「（韓愈的兄婿）遇方士柳泌，從受藥法，服之往往下血，比四年，病益急，乃死。」

    資料二：「（唐武宗）重方士，頗服食修攝，親受法籙。至是藥躁，喜怒失常，疾既篤，旬日不能言。」

    資料三：「退之（韓愈）服硫磺，一病訖不痊。」

    分析這些資料的共同主題，以下何者最為恰當？'
  options:
  - label: A
    content: 傳統醫學的特色
  - label: B
    content: 佛教傳布的弊端
  - label: C
    content: 道教煉丹的弊害
  - label: D
    content: 學術思想的發展
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一提到韓愈的兄婿服用方士的藥法後而早死；資料二說明唐武宗信任方士，服食丹藥後導致情緒失調；資料三提及韓愈服食硫磺後，一病不起。綜合三者，皆在說明煉丹服藥後的負面結果，因此(C)的分析最適宜。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某段秦代的史料有如下內容：「某某人有家屋一棟二室，各有入口，室皆瓦蓋，設有木造的門，種有桑樹十株。妻某在逃，成年女兒某，未婚，未成年男子某，身高六尺五寸，雄犬一隻。」關於此一史料，下列解讀何者正確？
  options:
  - label: A
    content: 從這鉅細靡遺的資料來看，證明秦朝愛護人民
  - label: B
    content: 此段資料反映秦代對於地方的控制已十分深入而完整
  - label: C
    content: 這些資料的取得，有賴封建制度下諸侯對地方的控管
  - label: D
    content: 這是秦代以來提倡黃老之學，讓人民休養生息的成果
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這段鉅細靡遺的資料出自《睡虎地秦簡》，為秦代的戶籍資料，答案為(B)。(A)應是政府對地方的控制，與愛護人民無關。(C)此時實施中央集權的郡縣制度。(D)秦代政治以法家學說為主。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 研討會上，學者爭論清朝前期成功統治帝國的原因，有兩類解釋：第一類認為是統治者在不同地區，包括新疆、西藏、蒙古、關內，因地制宜，採取不同統治策略，形成一多民族帝國。第二類認為是統治者採取漢化政策，才能以少數民族身分入主中原。我們應如何理解這兩種歷史解釋？
  options:
  - label: A
    content: 第一類解釋的證據：實施八旗制度、西南地區實行改土歸流
  - label: B
    content: 第二類解釋的證據：動員學者編纂《四庫全書》、開科取士
  - label: C
    content: 第一類學者採取多元主義觀點，完全是錯誤的，不具學術意義
  - label: D
    content: 第二類學者是站在華夏中心主義，立場相對正確，解釋較可靠
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)「改土歸流」係廢除各地的世襲「土官」，改由中央派任「流官」治理，以加強朝廷統治，與第一類解釋不符。(B)為正解。(C)(D)兩種解釋是以不同角度說明清朝的統治方式，皆有其具體立論與學術意涵。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 唐代科舉考試時，考生應試之前，常把已所作詩文投獻給可能的閱卷官員，具有影響力之人士等等，不僅以求取榮譽提升知名度，也提醒閱卷者多加關心與注意。請問由此科考時的特殊現象可知：
  options:
  - label: A
    content: 此現象是科考的一環，先由社會評價做一次篩選再進行考試
  - label: B
    content: 科考取才方式雖客觀，但唐代時制度尚未成熟仍有取巧方式
  - label: C
    content: 此現象反映了科考完全是看家世背景
  - label: D
    content: 可知科考是由地方辦理的考試，故考生須尋求地方官員支持，容易造成地方割據
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 唐代為科舉考試初發展階段，因此考試的公平性與客觀性尚未嚴謹，才有考生投機取巧試圖影響考試結果，故答案為(B)。(A)(C)科舉考試自隋代創立以來，即不重社會評價、家世背景等，考試選才強調個人才幹。(D)科考中舉者多至朝廷任官，因此能加強士人對中央的向心力。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 一位學者說：「郡縣之法，已在秦先。秦之所滅者六國爾，非盡滅三代之所封也。則分之為郡，分之為縣，俾（使）才可長民者，皆居民上，以盡其才而治民之紀，亦何為而非天下之公乎？」由此可知，以下正確的是
  options:
  - label: A
    content: 秦才有設置郡、縣
  - label: B
    content: 郡縣是三代以來的制度
  - label: C
    content: 郡縣制以有才能的官員來治理地方
  - label: D
    content: 秦滅六國阻礙了郡縣的發展
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由「郡縣之法，已在秦先」，可知郡縣制在秦國前已經出現。(B)郡縣是東周才出現的制度。(D)秦滅六國後，在中央集權體制下推行郡縣制。
