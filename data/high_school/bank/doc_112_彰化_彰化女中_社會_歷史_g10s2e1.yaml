- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 以下是關於某族群制度的敘述：「繼我而為君者，毋令強勢之人為之。此等人一為國君，恐倚強恃勢，獲罪於天也。且一人之識見，能及眾人智慮耶？爾八人可為八固山之王。如是同心幹國，可無失矣。八固山王，爾等中有才德、能受諫者，可繼我之位。若不納諫，不遵道，可更擇有德者立之。」請問依上文所述，下列判斷何者正確？
  options:
  - label: A
    content: 由「獲罪於天也」可得知該族群講求「天命」作為正統依據，只有漢族群才有天命觀念，此應為漢族群推舉領袖的制度
  - label: B
    content: 由「有才德、能受諫者，可繼我之位」推測該族群採用推選決定領袖，為游牧族群常用方式，有可能為游牧族群推舉領袖的制度
  - label: C
    content: 由「毋令強勢之人為之」可知該民族講求和諧、寬容的統治方式，而游牧族群民風剽悍，故非游牧族群制度
  - label: D
    content: 由「同心幹國，可無失矣」推測該族群以共識方式處理政事，與漢族群在歷史上一向都是極權統治的特性不符，故非漢人制度
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文資料為清太祖建立八旗制度的相關說法，從「繼我而為君者……有才德、能受諫者，可繼我之位」的說法，可推知其應為游牧政權推選領袖的做法，與漢人的繼統方式不同，(B)為正解。(A)游牧民族也講究天命，非漢人獨有。(C)清太祖提出對繼任領袖的條件，與游牧族群的民風無關。(D)漢族群在上古時期也曾發展出共主制度，後才逐漸發展出中央集權政體，迄明朝廢相後才形成極權統治。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「佛、道兩教之所以能成為中國最重要的兩大宗教，主要是因其深入民間，與常民生活相結合。讓百姓能在信仰的同時，除了人心的歸屬安定外，也能獲得生活上實質的支持。例如行善的觀念，佛教講究善惡因果，認為其會影響死後的審判，積善者可受佛接引。而道教也認可行善的重要性，如《太上感應篇》等勸善書籍強調行善的重要。這種行善價值觀的形成，有助於民間社會秩序的穩定。同時基於行善目的所衍生出來佛道兩者的慈善組織，在醫療、社會救助、公共建設上也多有幫助，轉為對人民生活的實質支持。」請問上述資料所講述的主題是
  options:
  - label: A
    content: 善惡終有報有助於統一
  - label: B
    content: 佛道對經濟發展的改善
  - label: C
    content: 政府軍事的不足
  - label: D
    content: 宗教思想對社會價值觀與秩序的影響
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文以行善為例，說明佛、道兩教的行善觀念所形成的價值觀，有助於民間社會秩序的穩定，衍生出來的慈善組織更是對人民生活有實質的支持，故答案為(D)。(A)(B)(C)在題文中並未提到相關論述。
