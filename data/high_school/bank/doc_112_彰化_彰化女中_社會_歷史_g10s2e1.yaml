- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 有一段資料記載：「群僚舉士者，或以頑魯應茂才，以桀逆應至孝，以貪饕應廉吏，以狡猾應方正，以諛諂應直言，……名實不相副，求貢不相稱。富者乘其材（財）力，貴者阻其勢要，以錢多為賢，以剛強為上。凡在位所以多非其人，而官廳所以數亂荒也。」請問這段資料在批評哪一制度？
  options:
  - label: A
    content: 封建制度
  - label: B
    content: 察舉制度
  - label: C
    content: 九品官人法
  - label: D
    content: 科舉制度
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料記載的選才方法，當時被「舉士」的人才包括茂才、至孝、廉吏、方正、直言等項目，但皆已出現名實不相符的現象，因此可推知是批評東漢(B)察舉制度已出現的弊端。
- id: doc_112_彰化_彰化女中_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 附圖示意的是中國歷史上某時期的某種制度，試判斷該制度最早實行於何時？
  options:
  - label: A
    content: 戰國時期
  - label: B
