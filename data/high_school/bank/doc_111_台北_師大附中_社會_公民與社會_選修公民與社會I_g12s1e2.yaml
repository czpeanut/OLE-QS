- id: doc_111_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 6
  stem: 依據題文，下列關於各央行政策的敘述何者正確？
  options:
  - label: A
    content: 美國聯準會透過增加購買債券刺激景氣
  - label: B
    content: 南韓央行採取課徵囤房稅用來抑制房價
  - label: C
    content: 美國聯準會縮減購債可鼓勵投資與消費
  - label: D
    content: 我國央行仍維持低利率的寬鬆貨幣政策
  group_stem: '2021 年 COVID-19 疫情爆發之際，因全球供應鏈緊縮，相關的成本上升轉嫁給消費者，反映到國內運輸、糧食至家庭用品價格上漲，揚升的通貨膨脹率促使各國央行開始重新檢視其貨幣政策。

    美國聯準會宣布將要開始縮減購債，於 2022 ～ 2023 年升息。南韓則因通膨率上升速度超乎預期，加上房價飆升、家庭負債惡化，該國央行遂宣布要將利率從 0.5 ％上調至 0.75 ％，此為該國近 3 年來首次升息，也使南韓成為疫情時代第一個升息的亞洲主要經濟體。全球數據網站（Numbeo）資料願示，自 2017 年以來，南韓房價上漲 50 ％以上，居高不下的房地產價格，是造成民怨的主因之一。為了穩定房價，南韓政府已採取超過 20 項政策，包含對擁有多套房產者開徵「囤房稅」，或對一年內房屋買賣課徵更高稅率，但 2021 年 7 月該國房價年增率達到 14.3 ％，創 2002 年來的新高。

    而我國是否跟進升息？中央銀行總裁則表示，臺灣屬於小型開放的經濟體，全球經濟的變動使我國難置身事外，屆時央行會針對整體經濟情勢，考量到國際變化及國內通膨、防疫情況，再做決定。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 根據題幹推斷，各國應採行「緊縮貨幣政策」。(A)屬於「寬鬆」貨幣政策。(B)屬於「財政政策」。(C)縮減購債主要是降低市場熱度，而非鼓勵投資與消費。
