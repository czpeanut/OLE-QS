- id: doc_111_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 為改善女性從政的困境，許多國家在各種公職選舉訂定女性保障名額。許多人認為統計顯示女性失業率低於男性，故現今女性就業並無不利，無須保障。但丁學者持反對意見，他主張應重視女性勞動參與率較男性低，僅看失業率無法完整掌握女性參與勞動市場的不利之處。下列導致失業率變動的原因，何者最符合丁學者分析就業問題時所使用到的概念？〔111 分科〕
  options:
  - label: A
    content: 大學入學機會增加，許多人選擇升學，24 歲以下年輕人失業率下降
  - label: B
    content: 因薪資上漲，廠商引進更多機器設備取代勞動力，引發失業率上升
  - label: C
    content: 產業轉型使生產力提升，高科技業勞動需求因而上升，失業率下降
  - label: D
    content: 移工引進人數上升，本地部分勞工的就業機會受排擠，失業率上升
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「失業率」的計算是指失業者占「勞動力」之比率，勞動力包含「就業及失業人口」；而所謂「非勞動力」則是指 15 歲以上不屬於勞動力之民間人口，包括因求學或準備升學、料理家務等原因，而未工作或未找工作者（亦包含怯志工作者）。在我國傳統文化影響下，因料理家務而成為「非勞動力」者多為女性，因此丁學者認為應重視女性勞動參與率較男性低，僅看失業率無法完整掌握女性參與勞動市場的不利之處，因為失業率的計算並未囊括「非勞動力」者在內。承前述之理由，當選擇升學者人數變多，表示這些大學生和女性家務勞者同樣被列入「非勞動力」，進而使 24 歲以下年輕人的失業率數字下降，故選(A)。(B)機器設備取代勞動力，將導致失業人口增加，並非影響「非勞動力」人口，因此不符丁學者論述所使用的概念。(C)高科技業勞動需求上升，將導致就業人口增加，失業人口減少，並非影響「非勞動力」人口，因此不符丁學者論述所使用的概念。(D)本地部分勞工的就業機會因引進移工而被排擠，將導致失業人口增加，並非影響「非勞動力」人口，因此不符丁學者論述所使用的概念。
  tags:
