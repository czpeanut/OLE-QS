- id: doc_111_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '假設某國的一般家庭每年只購買高麗菜和高麗菜水餃兩種商品，該國統計資料如下表所示。依據表中資料，可於設定基期年後計算各年度的消費者物價指數。以下敘述何者正確？〔107 指考〕

    | 年度 | 高麗菜單價 | 消費數量 | 高麗菜水餃單價 | 消費數量 |

    | --- | --- | --- | --- | --- |

    | 2014 | 40 | 90 | 6 | 800 |

    | 2015 | 20 | 100 | 3 | 1000 |

    | 2016 | 40 | 80 | 6 | 900 |

    | 2017 | 60 | 50 | 9 | 500 |'
  options:
  - label: A
    content: 以 2016 年為基期，2017 年消費數量雖然較少，但該年的物價指數高於 2016 年
  - label: B
    content: 以 2017 年為基期，2015 年消費數量只要增加，該年物價指數可能高於 2017 年
  - label: C
    content: 2015 至 2017 年兩種商品單價年增金額相同，故此三年的物價指數成長率皆同
  - label: D
    content: 以 2014 年為基期，2014 年和 2016 年兩種商品單價雖相同，但物價指數卻不同
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)以 2017 年為基期，計算物價指數時，以 2017 年的消費數量為準，並不考慮 2015 年的消費數量。2015 年兩種商品的價格均低於 2017 年，因此其物價指數低於 2017 年。(C)以 2014 年為基期，2015 年、2016 年為 100 ％、2017 年為 50 ％。(D) 2014 年和 2016 年兩種商品的單價相同，依據公式計算，物價指數也會相同。
