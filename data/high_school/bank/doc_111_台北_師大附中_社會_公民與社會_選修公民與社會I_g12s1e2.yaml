  type: calc
  page: 12
  stem: '「阿姨我不想努力了。」這句話是 2021 年網路流行用語，用於形容躺平族的心聲，在高物價、高房價、低薪的時代，躺平族過著「放棄努力向上」的生活，不買房、不買車、不婚、不生，過著低物慾的生活。其中「全躺平」更象徵著完全不出門工作、也不想找工作，花父母親的積蓄消極過生活。全躺平族小珍表示，近年就業環境不佳，公司多半想找有經驗的人，自己即使非常努力仍無法找到理想的工作，乾脆全躺平。請問假設其他條件不變，小珍的轉變對我國的失業率有什麼影響？請勾選正確答案，並運用失業率的公式說明原因。（共 4 分）

    | 對失業率的影響（請勾選一項，2 分） | 運用失業率公式說明原因（2 分） |

    | --- | --- |

    | □失業率上升 □失業率下降 □失業率不變 |  |'
  answer:
  - ✓失業率下降；失業率＝失業人口／勞動人口 躺平族的性質屬於「怯志工作者」（為非勞動力人口），因此不計入失業人口，反而造成失業率下降
  answer_status: verified
  answer_source: answer_key
  explanation: '失業率＝失業人口／勞動人口

    躺平族的性質屬於「怯志工作者」（其沒有尋找工作的意願，成為非勞動力人口），當一國失業問題嚴重且長期未獲改善時，會產生怯志工作者。是指因長期找不到工作而放棄尋找工作者，依照現行勞動統計，將不被計入失業人口中，且不被計入勞動力中，而是改列於非勞動力。因此失業人口會減少且勞動力隨之減少，重新計算的失業率會下降。

    44.2021 年 1 至 6 月的景氣皆為紅燈（熱絡），廠商樂觀看待經濟前景，因此固定投資上升、勞動需求上升、工資也隨之上升。由於勞動需求增加，因此 LD 線右移。'
