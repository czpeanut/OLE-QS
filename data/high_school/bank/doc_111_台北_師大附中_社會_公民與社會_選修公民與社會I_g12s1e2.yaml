  stem: 減稅與否影響著廠商固定投資的意願，某總統大選在即，雙方候選人針對「對企業增稅／減稅」的議題上交鋒，甲候選人主張減稅，上任第一年已推動減稅法案，使國內經濟蓬勃發展。乙候選人批評減稅政策雖有涵蓋中產階級，但最大的受惠者仍是企業，因此乙主張對年收入超過一定金額的企業及個人加稅。以下說明何者正確？
  options:
  - label: A
    content: 若甲候選人當選，則同樣的借款數額下，廠商願意支付的利率會提高
  - label: B
    content: 資金供給不變的情況下，若由甲當選，可貸資金市場的需求量會增加
  - label: C
    content: 若由乙候選人當選，利率上漲儲蓄增加，可貸資金市場的供給線右移
  - label: D
    content: 假設資金供給不變，乙候選人當選將使可貸資金市場的均衡利率上漲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)甲候選人主張對企業減稅，廠商對於資金的需求會增加，此時利率應會提高。(B)應是資金需求增加。(C)乙候選人主張一定程度的加稅，將導致可貸資金市場的需求減少，利率降低。(D)如果對企業及個人加稅，資金需求將會下降，導致均衡利率下降。
