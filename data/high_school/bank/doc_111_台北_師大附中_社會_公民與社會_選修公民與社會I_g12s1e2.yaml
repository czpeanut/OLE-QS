  group_stem: 今年初基本工資上調到 25,250 元，原本理論預測調高基本工資會引發失業，但臺灣今年面對的卻是缺工潮來襲。論者認為這是因為全球半導體短缺，臺灣相關產業的人才需求旺盛，間接吸走了其他產業的人力，加上疫情後有些人選擇離開職場，各行各業突然都缺人。請問：〔111 分科〕
  answer:
