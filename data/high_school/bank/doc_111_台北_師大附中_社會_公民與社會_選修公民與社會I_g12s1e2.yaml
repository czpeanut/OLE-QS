  stem: 下列何者最能正確描繪題文所述近來臺灣勞動市場狀況？（單選，2 分）
  options:
  - label: A
    content: 臺灣受惠於全球半導體短缺，因而使結構性失業人口大幅減少
  - label: B
    content: 缺工引發換工潮，會出現一些摩擦性失業，但循環性失業減少
