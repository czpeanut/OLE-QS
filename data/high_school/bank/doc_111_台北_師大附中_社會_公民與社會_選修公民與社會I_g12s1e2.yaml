  stem: 俄烏戰爭發生後，俄羅斯面對西方國家經濟制裁，盧布一度大幅貶值。俄國央行在今年 2 月底調升利率，由原本 9.5 ％一口氣調升至 20 ％。下列何者最能解釋俄國央行所採取之政策原理及目的？〔111 分科〕
