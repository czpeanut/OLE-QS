- id: doc_111_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 面對疫情和原物料（食材、油價、運費等）大漲，雙重壓力夾擊，有些餐廳與小吃店只能調漲價格因應，而民眾外食的開銷也愈來愈高。根據我國行政院主計總處的物價指數權重計算方式，以消費的七大類來看，最高的是居住、食物類，權重占比都超過 25 ％；而教育娛樂、交通／通訊類，占比也同樣超過 15 ％。根據上文與下圖的資料判斷，多間餐飲與小吃店宣布因應成本上漲必須調漲餐飲價格 5 ％，是否意謂物價膨脹呢？
  options:
  - label: A
    content: 外食價上漲只有持續一、二年，沒有長期維持此趨勢，非物價膨脹
  - label: B
    content: 圖表顯示食物類上漲，其他產品的價格則微幅上漲，所以是物價膨脹
  - label: C
    content: 食物類價格只占物價 25 ％，其他商品可能價跌，故未必是物價膨脹
  - label: D
    content: 食物類價格雖然上漲，但是其漲價幅度不夠大，不能算是物價膨脹
