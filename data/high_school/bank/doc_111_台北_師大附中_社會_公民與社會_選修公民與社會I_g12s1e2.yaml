  stem: 關於上述兩則新聞，下列敘述何者正確？
  options:
  - label: A
    content: 文中資料一的實質薪資已計入年終獎金、加班費等收入
  - label: B
    content: 依(甲)所述，第一季名目經常性薪資已考慮通貨膨脹因素
  - label: C
    content: 依(乙)第一季實質總薪資為歷年最高，故資料一內容錯誤
  - label: D
    content: 據資料二，企業在非經常性薪資調薪幅度較經常性薪資大
  group_stem: '資料一：實質薪資倒退 16 年《聯合報》

    行政院主計總處日前發布 2018 年 3 月薪資統計，全體受僱員工經常性薪資平均 40,812 元，年增 2.59 ％，連續四個月突破 2 ％，顯示薪資水準持續上揚；但若計入物價上漲影響，今年第 1 季「實質經常性薪資」依舊未及 2001 年的水準。

    資料二：行政院主計處新聞稿

    薪資統計的總薪資係指廠商支付給員工的工作報酬，包括經常性薪資（含本薪、按月津貼等，即一般慣稱之「月薪」）及非經常性薪資（年終獎金、年節獎金、紅利、績效獎金及加班費等），有關報載「第一季實質薪資不及 17 年前水準」，其所指的薪資僅為扣除物價因素後的實質「經常性薪資」。

    近年來經濟好轉，企業調薪轉趨積極，(甲)2018 年 1 至 3 月工業及服務業全體受僱員工平均名目經常性薪資突破 4 萬元，為 40,679 元，年增 2.71 ％，為近 18 年同期最高，在扣除物價變動因素後，實質經常性薪資為 38,132 元（年增 1.14 ％）。若加計年終獎金、績效獎金及加班費等非經常性薪資後，1 至 3 月平均名目總薪資繼 2017 年同期年增 2.38 ％後，2018 年增率再增為 4.67 ％，(乙)在扣除物價變動因素後，2018 年 1 至 3 月平均實質總薪資為 59,852 元，為歷年同期最高，年增率 3.07 ％。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一提及的實質薪資僅限於「經常性薪資」。(B)名目薪資並沒有考慮到通貨膨脹或物價。(C)(D)(乙)所提為扣除物價變動因素的實質總薪資，資料一為實質經常性薪資，中間有非經常性薪資的差異，顯示非經常性薪資的調薪幅度應大於經常性薪資，主因可能是廠商調薪情況改變，傾向依個人表現給付獎金，取代一視同仁的調薪所致。
