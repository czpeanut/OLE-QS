- id: doc_111_台北_師大附中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 有鑑於物價持續上漲，我國勞動部欲以調高基本工資的方式，減輕通貨膨脹對勞工生活水準的影響。請問由勞動市場供需理論看，以下有關基本工資政策的影響，何者正確？〔參考試卷〕
  options:
  - label: A
    content: 勞動市場中怯志工作者人數將增加
  - label: B
    content: 對所有勞工都帶來有利的就業保障
  - label: C
    content: 調高基本工資可有效提升實質薪資
  - label: D
    content: 整體市場所僱用的勞工人數會減少
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 設定基本工資的做法可視為政府的一種價格下限管制，會導致勞動市場成交數量減少，故選(D)。(A)調高基本工資可能促使「勞動供給上升」。(B)調高基本工資可能促使「勞動需求下降」，導致失業人口增加。(C)是否有效提升實質薪資，需視物價而定。
