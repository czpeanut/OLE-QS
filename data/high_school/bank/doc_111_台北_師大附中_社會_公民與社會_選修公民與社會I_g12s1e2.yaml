  stem: 右圖為 IMF 統計主要幾個已開發國家經濟數據變化（變化由左至右，左邊的點為 2019 年，右邊為 2020 年）。面對疫情部分行業（例如旅遊業或酒店業）受隔離防疫措施影響，因此日本、德國採用了「下崗」計畫，即停工但職位保留，停薪停職這段時間並不是被裁員，而是在家領救濟金，等待景氣復甦後再回職位上班，政府針對願意參與下崗計畫而非直接裁員的企業，給低利貸款與紓困補助，降低失業的衝擊。依題文與下圖，下列敘述何者正確？
