  section: 1
  number: 4
  type: single
  page: 2
  stem: 小華把自己放在銀行的存款一萬元借給小明一年，約定利率 5 ％，預計一年後賺取 500 元的利息。一年過去，小明如期償還本金與利息 500 元，這年的通貨膨脹率為 8 ％，這筆借貸對兩人產生何種影響？
  options:
  - label: A
    content: 小明為債權人，受到通貨膨脹影響一年後還 10,500 元的購買力較低
  - label: B
    content: 一年前約定的 5 ％為名目利率，受通膨影響一年後實質利率高於 5 ％
  - label: C
    content: 一年後雖然受到通貨膨脹影響，小華仍享有 3 ％的實質利率不算虧損
  - label: D
    content: 小華與小明此次借貸反映了通貨膨脹對分配的影響，較有利債務人
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)小明為債權人，通貨膨脹對其有利。(C)小華為債務人，相較而言通貨膨脹對其不利。(D)通貨膨脹分配之下，對債權人較有利。
  tags:
