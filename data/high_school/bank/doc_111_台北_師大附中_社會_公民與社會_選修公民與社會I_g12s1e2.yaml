  options:
  - label: A
    content: 因應 1970 年代第一次石油危機之衝擊，推動十大建設
  - label: B
    content: 因應 2008 年全球金融風暴，於 2009 年對國民發放消費券
  - label: C
    content: 因應 2020 年疫情影響，以國家安定基金進場股票市場護盤
  - label: D
    content: 因應農曆新年市場對資金的需求，於公開市場買進政府公債
  group_stem: 2008 年全球金融風暴後，因美國貨幣當局已將利率調降至趨於零之低點，讓傳統以改變利率達到調節經濟之措施無法繼續施展，因此改採量化寬鬆政策，作為提振經濟之措施。此政策由美國貨幣當局買入企業發行的債券開始，當由市場購入企業發行的債券後，等同把資金挹注進入金融體系，提高銀行將資金貸放給企業與個人之意願，以刺激投資與消費，進而達到提振經濟之目標。美國並非量化寬鬆措施的發明者，日本為最早實行量化寬鬆政策的國家。至目前為止，量化寬鬆亦是日本政府採用的政策，例如 2019 年 4 月，日本中央銀行就提及考慮採取額外的量化寬鬆措施，此舉讓日本股票市場股價指數在當日出現上揚變化。除日本外，歐洲央行也採量化寬鬆因應金融風暴之衝擊。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 量化寬鬆政策主要是增加市場的貨幣供給，在我國主要由中央銀行主導，常見方式為降低存款準備率、降低重貼現率，公開市場操作買進政府發行的公債與定期存單等金融商品，故選(D)。(A)(B)屬於「財政政策」。(C)屬於「經濟政策」，而不是指貨幣政策。
