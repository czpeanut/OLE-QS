  answer_status: verified
  answer_source: answer_key
  explanation: 題文敘述因全球半導體短缺，臺灣相關產業的人才需求旺盛，加上疫情後有些人選擇離開職場，顯示缺工引發換工潮，而因疫情造成景氣衰退導致的「循環性失業」會減少；「摩擦性失業」則是指人們在尋找工作或轉換工作過程中所產生的短期失業現象，故應選(B)。(A)「結構性失業」是指因為經濟結構改變，導致產生失業的現象，例如：因經濟發展或產業外移，導致勞工失業的現象。(C)疫情應會導致失業情形增加，勞動參與率逐漸下降，另外，工資上漲係為政府調漲基本工資所致，與勞動參與率升降無關。(D)從題文無法判斷提高基本工資是否有助於廠商將生產設備改為自動化，仍需視生產設備自動化的成本與勞動成本孰高孰低而定。
