  stem: '俄羅斯和烏克蘭都是全球重要的糧食生產國，分別輸出全世界第二和第一的葵花油，第二和第六位的大麥，第十和第六位的玉米，以及 30 ％的小麥。烏俄戰爭重挫兩國的農業生產和輸出，導致全球糧食價高漲。同時，俄羅斯亦是能源大國，在天然氣和原油輸出中，分列全世界第一及第二，每日出口全球 14 ％的天然氣以及近 500 萬桶原油。烏克蘭則是俄羅斯天然氣出口歐洲的重要管道。西方的制裁，俄羅斯的報復，烏克蘭的殘破，嚴重影響俄羅斯天然氣出口，致使全球天然氣價格大漲。然而，糧食與天然氣價格雙雙上漲，使得原物料價格居高不下，進而造成通貨膨脹的情形。請問受烏俄戰爭影響形成通貨膨漲的原因屬於下列何者？請勾選一項，繪圖並說明理由。（以 $S_{1}$ 或 $D_{1}$ 標示，並以箭頭標明移動方向）（共 5 分）

