- id: doc_111_台中_興大附中_數學_數A_g11s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 坐標空間中 O 為原點，點 P 在第一卦限且$\overline{OP}$＝1。已知直線 OP 與 x 軸有一夾角為 45°，且 P 點到 y 軸的距離為$\frac{\sqrt{6}}{3}$。試選出點 P 的 z 坐標。
  options:
  - label: A
    content: $\frac{1}{2}$
  - label: B
    content: $\frac{\sqrt{2}}{4}$
  - label: C
    content: $\frac{\sqrt{3}}{3}$
  - label: D
    content: $\frac{\sqrt{6}}{6}$
  - label: E
    content: $\frac{\sqrt{3}}{6}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設 P 點坐標（x，y，z）

    $\begin{cases}\sqrt{x^{2}+y^{2}+z^{2}}=1 \\ x=\sqrt{y^{2}+z^{2}} \\ \sqrt{x^{2}+z^{2}}=\frac{\sqrt{6}}{3}\end{cases}$⇒$\begin{cases}x^{2}+y^{2}+z^{2}=1 \\ x^{2}=y^{2}+z^{2} \\ x^{2}+z^{2}=\frac{2}{3}\end{cases}$⇒ $x^{2}$＝$\frac{1}{2}$，$z^{2}$＝$\frac{1}{6}$ ∴z＝$\pm \sqrt{\frac{1}{6}}$（負不合）

    故選(D)'
