- id: doc_111_台中_興大附中_數學_數A_g11s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設一四面體 S－ABC 的底面△ABC 不是等邊三角形，但是其三個側面與底面的夾角均相同，若頂點 S 在底面的投影點 O 落在△ABC 的內部，則 O 點必定是△ABC 的
  options:
  - label: A
    content: 垂心
  - label: B
    content: 內心
  - label: C
    content: 外心
  - label: D
    content: 重心
  - label: E
    content: 無法確定
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '過 O 作$\overline{OD}$垂直$\overline{AB}$，由三垂線定理，得$\overline{SD}$⊥$\overline{AB}$

    過 O 作$\overline{OE}$垂直$\overline{BC}$，由三垂線定理，得$\overline{SE}$⊥$\overline{BC}$

    過 O 作$\overline{OF}$垂直$\overline{AC}$，由三垂線定理，得$\overline{SF}$⊥$\overline{AC}$

    又三個側面與底面的夾角相同，即∠SDO＝∠SEO＝∠SFO

    則△SDO ≅ △SEO ≅ △SFO（AAS 全等） ∴$\overline{OD}$＝$\overline{OE}$＝$\overline{OF}$，因此 O 為內心

    故選(B)'
