- id: doc_111_台中_興大附中_數學_數A_g11s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設$\vec{a}$與$\vec{b}$為空間中之兩向量，且$\vec{a}$與$\vec{b}$皆非零向量，若$\vec{a}$與$\vec{b}$皆落在一平面 E 上，則下列何者正確？
  options:
  - label: A
    content: $\vec{a} \cdot \vec{b}$＝$\vec{b} \cdot \vec{a}$
  - label: B
    content: $\vec{a} \times \vec{b}$＝$\vec{b} \times \vec{a}$
  - label: C
    content: $(\vec{a} \times \vec{b}) \cdot \vec{a}$＝0
  - label: D
    content: $\vec{a} \times \vec{b}$與$\vec{a}$及$\vec{b}$落在同一平面 E 上
  - label: E
    content: $\vec{a}$與$\vec{b}$所張成之平行四邊形面積為$\vec{a} \times \vec{b}$
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：內積有交換律，即$\vec{a} \cdot \vec{b}$＝$\vec{b} \cdot \vec{a}$

    (B) ╳：外積沒有交換律，$\vec{a}\times \vec{b}$＝$-(\vec{b}\times \vec{a})$

    (C) ○：$\vec{a}\times \vec{b}$為$\vec{a}$，$\vec{b}$的公垂向量 ∴$(\vec{a}\times \vec{b}) \cdot \vec{a}$＝0

    (D) ╳：$\vec{a}\times \vec{b}$為$\vec{a}$，$\vec{b}$的公垂向量 ∴$(\vec{a}\times \vec{b})$⊥平面 E

    (E) ╳：$\vec{a}$與$\vec{b}$所張成之平行四邊形面積為$| \vec{a}\times \vec{b} |$

    故選(A)(C)'
