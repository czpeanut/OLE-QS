  stem: 柯南的研究內容中，對於我國全民健康保險制度的敘述何者正確？
  options:
  - label: A
    content: 屬於一種自助人助，但風險各自承擔的社會保險制度
  - label: B
    content: 全民健保是以公權力強制人民應納保的社會救助制度
  - label: C
    content: 每個人所享用的醫療品質是依據繳納的保費金額而異
  - label: D
    content: 依據投保人之所得採取分級付費制度，符合量能原則
  group_stem: '高中生柯南選擇以我國全民健保制度的演變作為自主學習的研究主題，探討自 1995 年開始實施的全民健保制度（一代健保）以及 2013 年實施的二代健保之制度內容與問題，並將之整理為以下表格：

    |  | 一代健保 | 二代健保 |

    | --- | --- | --- |

    | (甲)投保條件 | 久居國外者只要曾有加保紀錄，返國後馬上可投保就醫、享受給付 | 久居國外者須兩年內有加保紀錄，返國後才可加保，加保等待期延長為六個月 |

    | (乙)（受僱者）繳費基礎 | 一般保費：以經常性薪資為主 | 一般保費（經常性薪資）＋補充保費（股票股利所得、年終獎金、租金、利息……） |

    | (丙)詐領保險 | 醫療院所詐領保險給付及醫藥費用者，處以所詐領金額之 2 倍罰鍰 | 醫療院所詐領保險給付及醫藥費用者，加重罰鍰至所詐領金額之 20 倍 |

    | (丁)不當就醫 | 無相關規定 | 對多次重複就醫或過度使用醫療資源者加重其自付額度……等 |'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 全民健保的保費係依據投保人之所得，採取分級付費制度，每人繳交費用不同，符合量能原則，故選(D)。(A)屬風險共同承擔。(B)全民健保是強制的社會保險，非社會救助。(C)每個人所享用的醫療品質是相同的。
