- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '神奈川縣舉行青年議會改選，其中，神奈川中城的第二選區（簡稱中二選區）各政黨候選人得票情形如下表所示。有關神奈川縣議會中二選區的選舉制度之敘述，下列何者正確？

    | 號次 | 候選人姓名 | 黨籍 | 得票數 |

    | --- | --- | --- | --- |

    | 1 | 櫻木花道 | 湘北黨 | 48,487 |

    | 2 | 仙道彰 | 陵南黨 | 94,321 |

    | 3 | 藤真健司 | 翔陽黨 | 54,088 |

    | 4 | 流川楓 | 湘北黨 | 89,484 |

    | 5 | 牧紳一 | 海南黨 | 88,252 |

    | 6 | 赤木晴子（女） | 湘北黨 | 52,099 |'
  options:
  - label: A
    content: 若該選區當選者只有仙道彰一人，所採選制應為單一選區絕對多數決制
  - label: B
    content: 若當選者依序為仙道彰、流川楓及藤真健司，所採選制應為比例代表制
  - label: C
    content: 無論採取何種選制，唯一女性候選人赤木晴子皆能因婦女保障名額當選
  - label: D
    content: 湘北黨同時提名三位候選人，可推測其選制不是單一選區相對多數決制
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由於湘北黨同時提名三位候選人，可知是投人，且當選人應超過 2 人以上，故可推測其選制不是單一選區相對多數決制，故選(D)。(A)若該選區當選者只有仙道彰一人，因為得票未過半，所採選制應為單一選區相對多數決制。(B)因為投人，所以不會是比例代表制（投黨）。(C)唯一女性候選人赤木晴子能否因當選，要看選舉制度而定。
