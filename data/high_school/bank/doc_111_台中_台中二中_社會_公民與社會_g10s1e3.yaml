- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e3_s2_50
  section: 2
  number: 50
  type: multiple
  page: 10
  stem: 「合法性」（legality）乃民主國家的統治強調依法而治，其在積極面上要求行政行為必須有法律依據；而在消極面上要求行政行為不得牴觸法律。然而，法律可能只是反應執政者或是少數精英的利益，甚至違反公平正義原則時，則該統治行為不具「正當性」（legitimacy）。一般而言，當政府具合法性但不具有正當性時，人民比較不願守法或遵從國家的治理，下列何種方式，有助於政府取得「正當性」？
  options:
  - label: A
    content: 發動修憲行動，讓國家運作合乎人民需求
  - label: B
    content: 聲請司法院大法官釋憲，解決憲政的爭議
  - label: C
    content: 民眾採取司法訴訟向國家求償，爭取權益
  - label: D
    content: 透過選舉產生政黨輪替，表達人民的意志
  - label: E
    content: 透過公民投票，讓人民自主性的表達聲音
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 正當性是政府被民眾所認可的程度，因此(A)(B)(D)(E)可以反應民意。(C)民眾採取司法訴訟向國家求償，屬於權利救濟，不一定可以提升人民對政府的認同。
