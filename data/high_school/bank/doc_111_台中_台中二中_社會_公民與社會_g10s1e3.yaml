  stem: 志願結社的蓬勃發展已成為當代臺灣多元社會的特徵，透過志願結社，可以形成關心公共事務的社會文化，這正是民主政治蓬勃發展的基礎。下列關於「志願結社」的敘述，何者最為正確？
  options:
  - label: A
    content: 為民間所發起，但並不包含與政治關係密切的政黨
