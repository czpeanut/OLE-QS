  stem: 自 1990 年代民主化之後，我國立法院的政黨生態逐漸由一黨獨大制走向多黨制，近年來則轉變為兩黨制。我國立法院政黨生態由多黨制轉變為兩黨制的最主要原因為何？
  options:
  - label: A
    content: 選舉制度的改變
  - label: B
    content: 社會大眾厭惡小黨
  - label: C
    content: 政府體制的調整
  - label: D
    content: 社會分歧的兩極化
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從 2005 年立法院修憲案通過後，立委選舉制度由「複數選區單記非讓渡選票制」改為「單一選區制兩票制」，同時重新劃分選區，立法院的政黨生態逐漸由一黨獨大制走向多黨制，近年來則轉變為兩黨制，故選(A)。
