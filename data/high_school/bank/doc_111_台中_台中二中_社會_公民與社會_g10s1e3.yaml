- id: doc_111_台中_台中二中_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '「安西王國」是個內閣制國家，有五個主要政黨，本次國會大選選舉結果如下表。依表中資訊判斷，下列有關其聯合內閣組成之敘述何者正確？

    | 政黨名稱 | 櫻木派 | 赤木派 | 流川派 | 三井派 | 晴子派 |

    | --- | --- | --- | --- | --- | --- |

    | 國會席次 | 8 | 21 | 26 | 12 | 33 |'
  options:
  - label: A
    content: 櫻木派所獲得的席次過少，沒有參與組織聯合內閣的機會
  - label: B
    content: 流川派若不想與過多政黨分享組閣權，只能與晴子派合作
  - label: C
    content: 櫻木、赤木、三井等黨若組聯合內閣，可獲國會穩定多數
  - label: D
    content: 赤木、流川兩黨若想合作組閣，一定要得到晴子派的支持
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「安西王國」國會共 100 席，但選舉結果沒有任何一個黨過半，因此需組織聯合內閣，先由最大黨晴子派組閣，若要以最少的黨組合，則晴子派可與赤木派或流川派合作，故選(B)。(A)櫻木派雖然席次少，但仍有參與組織聯合內閣的機會。(C)櫻木、赤木、三井三黨共 41 席，未超過半數。(D)赤木、流川兩黨若想合作組閣，已有 47 席，所以可以與其他小黨合作組閣。
  tags:
    unit:
      code: CI-1-5-1
      book: 公民與社會1 民主與人權
      chapter: 政府組成與運作
      title: 政府體制
