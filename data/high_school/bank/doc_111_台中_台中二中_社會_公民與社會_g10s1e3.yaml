  stem: '資料 1：愛美通訊社報導：「策劃重大恐怖事件的中東恐怖組織領袖遭美國情報人員擊斃，對美國威望的提升以及未來的全球戰略均有重大意義……」。

    資料 2：粉紅新聞網報導：「恐怖攻擊事件發生時，美國曾經譴責中東國家是暴力分子，現在自己卻以暗殺的恐怖手段結束這位英雄的生命，令人遺憾……」。

    針對上述報導，下列何者是兩家媒體對此事件做出迥異報導的最主要原因？'
  options:
  - label: A
    content: 各家媒體本就有其不同的立場
  - label: B
    content: 為擴大自家媒體的市場占有率
  - label: C
    content: 為追求輿論的平衡而刻意不同
  - label: D
    content: 所有報導向來都無法呈現真相
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由兩則資料可以看出兩家媒體對同一事件的報導內容不同，顯見立場有差異，故選(A)。
  tags:
