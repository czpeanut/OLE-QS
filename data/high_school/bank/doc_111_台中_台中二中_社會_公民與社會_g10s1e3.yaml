  - label: C
    content: 強調公民直接參與公共事務，對政府採取抗爭立場
  - label: D
    content: 強調非營利的性質，但仍可採取企業性經營或活動
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 志願結社強調非營利的性質，但為了獲取經費以從事公益，仍可採取企業性經營或收費，故選(D)。(A)為民間所發起，包含政黨和利益團體。(B)結社不一定要向政府正式立案登記，但未立案登記不能從事某些行為。(C)強調公民直接參與公共事務，但不一定對政府採取抗爭立場。
