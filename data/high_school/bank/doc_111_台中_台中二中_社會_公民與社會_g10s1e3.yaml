  section: 1
  number: 5
  type: single
  page: 1
  stem: 人民組成利益團體是參與政治的途徑之一，也是建構公民社會的重要基礎。有關「利益團體」的運作，下列敘述何者正確？
  options:
  - label: A
    content: 主要透過推舉公職候選人的方式，影響政府政策的制定
  - label: B
    content: 經常利用各種傳播媒介倡議其主張，藉以形成輿論力量
  - label: C
    content: 僅關注成員自身利益，其訴求必然與公共利益有所衝突
  - label: D
    content: 進行遊說活動時，必須遵守公務人員行政中立法的規範
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 利益團體會利用各種傳播媒介倡議其主張，藉以形成輿論力量，故選(B)。(A)政黨主要透過推舉公職候選人的方式，影響政府政策的制定。(C)利益團體的訴求不一定與公共利益有所衝突。(D)行遊說活動時，必須遵守《遊說法》的規範。
