  stem: 「比例代表制」是由各政黨將其推薦的候選人編列一張名單，供選民做選擇，選民投票的對象為政黨。請問下列關於比例代表制（Proportional Representatve）的敘述何者正確？
  options:
  - label: A
    content: 只適用於小選區，只要得到一定的支持即可獲得席位
  - label: B
    content: 不論得票多少，各政黨都可以依照得票比例分配席次
  - label: C
    content: 無黨支持的候選人亦可參加選舉，較能充分反映民意
  - label: D
    content: 可能造成小黨林立，政見分歧大，增加政局的不穩定
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「比例代表制」是投黨，依各黨得票率分配席次，故可以反應多元民意，但也可能造成小黨林立，故選(D)。(A)小選區即單一選區，是投人。(B)比例代表制會有政黨門檻限制，若得票率太低，仍無法分配席次。(C)無黨支持的候選人無法參加選舉。
