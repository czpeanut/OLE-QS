  stem: 我國全民健康保險制度（全民健保）多年來有著高度的政策滿意度，也受到國際肯定，下列關於這項制度的敘述何者正確？
  options:
  - label: A
    content: 全民健保的主要目的在於保障國民的基本生活與健康
  - label: B
    content: 全民健保制度具有社會互助以及風險共同承擔的意義
  - label: C
    content: 全民健保以全民為對象，採被保險人平均付費，具有落實社會公平的作用
  - label: D
    content: 全民健保的保費由被保險人、雇主及政府分擔，保費收入尚足以收支平衡
  group_stem: 我國衛福部健保署公布 2019 年藥費申報統計，所有藥品申報金額首次突破 2,000 億元。不過，消費者文教基金會指出，每年有將近 5 億顆、總重約 193 公噸的藥物遭國人丟棄；環保署亦在汙水處理廠檢測出二十幾種以上的藥物，研判是民眾將不用的藥物丟入馬桶或水槽，導致水源汙染。中華民國藥師公會全聯會也表示，許多昂貴藥物常原封不動放到過期，最後才拿去藥局回收。上述現象在於部分民眾不聽從醫藥人員的衛教指示，拒絕吃藥或自行減少藥量，導致療效不佳，回診時醫生便加重藥量；另外，病患看診時可能仍有藥物沒用完，但醫師卻重複開立同樣的處方箋，種種原因皆使棄置不用的藥物愈來愈多。試問：
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 只要是社會保險皆具有社會互助以及風險共同承擔的意義，故選(B)。(A)全民健保的主要目的在於保障國民的基本健康與醫療，非生活的保障。(C)全民健保以全民為對象，依被保險人的所得不同，繳交不同的費用。(D)全民健保的保費收入不足以收支平衡，故有赤字。
