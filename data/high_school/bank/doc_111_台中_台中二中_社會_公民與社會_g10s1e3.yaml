  stem: 從文中描述的「推行國語」過程，最能看出何種意涵？
  options:
  - label: A
    content: 維護文化的多樣性
  - label: B
    content: 塑造文化位階
  - label: C
    content: 消除我族中心思維
  - label: D
    content: 實行種族歧視
  group_stem: '下表為某學者整理研究我國語言政策演變的歷史軌跡，試回答以下問題：

    | 年代 | 政策演變 |

    | --- | --- |

    | 1946 年 | 國民政府成立「國語推行委員會」，減少日語、臺語和客語的使用，進行語言統一運動。臺灣因此成為全中國國語推行最成功的地方 |

    | 1958 年 | 臺灣省政府推行「說國語運動」，強調說國語才是愛國，在學校必須講國語，電影院禁播方言、外語電影 |

    | 1973 年 | 教育部公布「國語推行辦法」，嚴格禁止使用方言，使用方言者會被罰錢、體罰、掛狗牌等處罰 |

    | 1970 年代 | 電視《雲州大儒俠》布袋戲收視率曾高達 97 ％，遭新聞局以「妨害農工正常作息」，在 583 集後停播這個閩南語節目。新聞局也減少臺語節目的時數，也禁播方言歌曲，逐漸讓電視變為全國語節目 |

    | 1993 年 | 教育部將母語教育列入中小學課程，以選修方式修習本土語言 |

    | 2001 年 | 教育部正式實施九年一貫課程，將鄉土語言納入正式課程之中 |

    | 2018 年 | 立法院通過《國家語言發展法》，保障各族群固有語言的發展與傳承 |'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 文中描述的「推行國語」過程，顯示執政者對於和自己不同文化位階者進行優劣排比，而產生階層化現象，以國語的位階最高，答案選(B)。
