  stem: 下面四個雙曲線中，何者是等軸雙曲線？
  options:
  - label: A
    content: $x^{2}$－$y^{2}$＝1
  - label: B
    content: $4x^{2}$－$3y^{2}$＝1
  - label: C
    content: －$5x^{2}$＋$5y^{2}$＝15
  - label: D
    content: －$3x^{2}$＋$3y^{2}$＝－12
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$x^{2}$－$y^{2}$＝1$\Rightarrow\frac{x^{2}}{1}-\frac{y^{2}}{1}= 1$

    (B)╳：$4x^{2}$－$3y^{2}$＝1$\Rightarrow\frac{x^{2}}{\frac{1}{4}}-\frac{y^{2}}{\frac{1}{3}}= 1$

    (C)○：－$5x^{2}$＋$5y^{2}$＝15$\Rightarrow-\frac{x^{2}}{3}+\frac{y^{2}}{3}= 1$

    (D)○：－$3x^{2}$＋$3y^{2}$＝－12$\Rightarrow\frac{x^{2}}{4}-\frac{y^{2}}{4}= 1$

    故選(A)(C)(D)'
