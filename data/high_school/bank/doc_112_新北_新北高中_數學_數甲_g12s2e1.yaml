- id: doc_112_新北_新北高中_數學_數甲_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: ∣3x－5∣＝$\sqrt{(x - 1)^{2} +(y + 2)^{2}}$的圖形為何者？
  options:
  - label: A
    content: 雙曲線
  - label: B
    content: 橢圓
  - label: C
    content: 拋物線
  - label: D
    content: 圓
  - label: E
    content: 線段
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '∣3x－5∣＝$\sqrt{(x - 1)^{2} +(y + 2)^{2}}\Rightarrow$∣3x－5∣$^{2}$＝（x－1）$^{2}$＋（y＋2）$^{2}$

    $\Rightarrow8 \left( x -\frac{7}{4} \right) ^{2} -(y + 2)^{2} =\frac{1}{2}\Rightarrow\frac{\left( x -\frac{7}{4} \right) ^{2}}{1}-\frac{(y + 2)^{2}}{8}=\frac{1}{16}$為一雙曲線方程式

    故選(A)'
- id: doc_112_新北_新北高中_數學_數甲_g12s2e1_s1_6
  section: 1
