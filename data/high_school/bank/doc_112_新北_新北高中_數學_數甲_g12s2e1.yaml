- id: doc_112_新北_新北高中_數學_數甲_g12s2e1_s3_4
  section: 3
  number: 4
  type: fill
  page: 4
  stem: 在拋物線 $y^{2}$＝16x 上與直線 4x－3y＋24＝0 距離最短的點坐標為 ＿＿＿＿，此時距離為＿＿＿＿。
  answer:
  - $\left( \frac{9}{4} , 6 \right)$；3
  answer_status: verified
  answer_source: answer_key
  explanation: '設拋物線上滿足條件之點坐標為$\left( \frac{a^{2}}{16} , a \right)$

    則其與直線 4x－3y＋24＝0 的距離為$\frac{\left| 4\times \frac{a^{2}}{16}- 3a + 24 \right|}{\sqrt{4^{2} +(- 3)^{2}}}$＝$\frac{\left| \frac{1}{4}a^{2} - 3a + 24 \right|}{5}$

    ∵$\frac{1}{4}a^{2} - 3a + 24$的最高次項係數大於 0 且判別式$(- 3)^{2} - 4\times \frac{1}{4}\times 24$＜0

    ∴$\frac{1}{4}a^{2} - 3a + 24$恆正

    則$\frac{\left| \frac{1}{4}a^{2} - 3a + 24 \right|}{5}$＝$\frac{1}{5} \left( \frac{1}{4}a^{2} - 3a + 24 \right)$

    ＝$\frac{1}{20} (a^{2} - 12a + 96)$＝$\frac{1}{20} 〔(a - 6)^{2} + 60〕$

    ＝$\frac{1}{20} (a - 6)^{2} + 3\geq$3

    當 a＝6 時有最短距離，此點坐標為$\left( \frac{9}{4} , 6 \right)$，最短距離為 3'
