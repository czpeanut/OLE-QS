  stem: 如右圖，一雙曲線兩焦點 $F_{1}$，$F_{2}$，貫軸長為 12，A，B 為雙曲線上兩點，若$\overline{AB}$過 $F_{1}$ 且$\overline{AB}$＝8，試求△$ABF_{2}$ 的周長為下列何者？
  options:
  - label: A
    content: '20'
  - label: B
    content: '28'
  - label: C
    content: '32'
  - label: D
    content: '40'
  - label: E
    content: '45'
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_112_新北_新北高中_數學_數甲_g12s2e1/s1_6_f1.png
    crop:
      page: 2
      rect:
      - 453.4
      - 49.7
      - 564.3
      - 126.85
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '根據雙曲線的定義，可知

    $\begin{cases}∣ \overline{AF_{2}} - \overline{AF_{1}} ∣= 12 \\ ∣ \overline{BF_{2}} - \overline{BF_{1}} ∣= 12\end{cases}\Rightarrow\begin{cases}\overline{AF_{2}} - \overline{AF_{1}} = 12\cdots \cdots \cdots \cdots \cdots ① \\ \overline{BF_{2}} - \overline{BF_{1}} = 12 \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    ①＋②得$\overline{AF_{2}} + \overline{BF_{2}} -(\overline{AF_{1}} + \overline{BF_{1}})= 24$

    $\Rightarrow\overline{AF_{2}} + \overline{BF_{2}} - \overline{AB} = 24\Rightarrow\overline{AF_{2}} + \overline{BF_{2}} = 32$

    故△$ABF_{2}$ 的周長為 32＋8＝40

    故選(D)'
