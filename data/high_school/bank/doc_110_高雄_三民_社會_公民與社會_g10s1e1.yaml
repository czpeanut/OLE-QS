  stem: 《高級中等教育法》第25條明訂，校務會議應用經選舉產生之學生代表參與，然而並未訂定比例下限，導致實務上多數學校只有1至3名代表，於會議中面對百位師長，比例相當懸殊，難以反映學生的聲音及意見。教育部國民教育署於2020年8月發函全國高級中等學校，修正《高級中等學校校務會議組織及運作要點》，增設「學生代表人數不得少於全體會議人數之百分之八」，也是高中首度設立校務會議學生代表的比例保障。然而，教育部今日之函文僅有行政指導的「建議」性質，教育部預計於下個會期送出《高級中學教育法》修法草案，正式在《高級中學教育法》中明訂學生代表席次不得少於百分之八。（4%）
