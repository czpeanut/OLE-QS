  page: 5
  stem: 十幾年前臺灣薪資有一段呈現凍漲的狀態，導致許多退休老年人的月退甚至比年輕人月薪還高，以薪資為保費徵收基礎的健保，繼續讓受薪青貧族扛起保費負擔。根據勞動部統計，臺灣15至64歲勞動參與率，2020年只剩下59.2%，遠低於日本的76.9%與韓國的69.4%，且60至64歲的勞動參與率只剩下37.84%。臺灣人早退休的狀況，讓繳納的健保費連帶受影響，長遠來看繳費人將愈來愈少。臺灣2025年將邁入超高齡社會，每五人就有一人超過65歲，退休人口比就業人口多，又有嚴重的少子化問題，目前的保費重擔將落在相對低薪又人口較少的年輕世代上。（6%）
