  - label: C
    content: 金恩博士發表〈我有一個夢〉演說後，白人與非裔便能互相尊重
  - label: D
    content: 非裔依據《獨立宣言》，實現了他們的自由權及追求幸福的權利
  group_stem: 第91屆奥斯卡獎最佳影片《幸福綠皮書》，片名的「綠皮書」是取自是 1936年美國政府印製給非裔駕駛的旅遊指南《黑人司機綠皮書》（The Negro Motorist Green Book），此書發行了30年，内容記載著全美國哪些商店、餐廳、旅館是對非裔人士友善的，以及哪些城鎮或區域禁止非裔人士晚上外出活動。1876年，美國南部各州及邊境各州制定了《吉姆克勞法》（Jim Crow laws），針對有色人種尤其是非裔美國人實行種族隔離制度。1945年以後，非裔美國人的民權意識抬頭，開始抵制這個歧視性的法律，直到1964年通過《民權法案》、1965年通過《選舉權法案》，禁止法律上訂定任何形式的種族隔離和歧視政策，《吉姆克勞法》才走入歴史。不過這僅止於「法律」層面，直到今日，美國社會仍存在種族歧視問題。
