  group_stem: '說明：第1題至第4題，每題有5個選項，其中只有一個是正確或最適當的選項，請畫記在答案卡之「選擇（填）題答案區」。各題答對者，得5分；答錯、未作答或畫記多於一個選項者，該題以零分計算。

    <u>1-3題為題組</u>

    地震發生時，若震源很靠近地面，可以視地震波是從震央往外擴散，利用地震波到達 不同測站的時間差，就可以定位出地震源。

    如右圖，若<u>臺中</u>A與<u>臺北</u>B先後測得地震，則可分別於<u>臺中</u>與<u>臺北</u>的測站作等間距 同心圓，其中間距為地震波到A、B兩地的時間差所能傳遞的距離，那麼圖上黑點到兩 測站的時間差都相等，皆有可能是震央位置。將所有可能震央位置連起來，會是某種 曲線Γ的一部分。試回答下列問題。'
  shared_asset: g1_1_3
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
