  explanation: 'A＝$\frac{1}{2}$（（A＋B）＋（A－B））＝$\frac{1}{2}\left( \left[ \begin{matrix}0 & 2 \\ 3 & 3\end{matrix} \right] +\left[ \begin{matrix}2 & 2 \\ 3 & 5\end{matrix} \right] \right)$＝$\left[ \begin{matrix}1 & 2 \\ 3 & 4\end{matrix} \right]$

