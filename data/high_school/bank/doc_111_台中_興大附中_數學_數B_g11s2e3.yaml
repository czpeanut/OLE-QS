  stem: '英文字母共有 26 個，所以我們可以將 a、b、c、……、z 編成 01、02、……、26 等 26 個號碼，並以行矩陣表示，如$\left[ \begin{matrix}0 \\ 1\end{matrix} \right]$代表 a、$\left[ \begin{matrix}0 \\ 2\end{matrix} \right]$代表 b、……、$\left[ \begin{matrix}2 \\ 6\end{matrix} \right]$代表 z。使用時，先將單字編為號碼，再以矩陣 X 表示此單字。例如，“dog”的編碼是 04，15，07，可用矩陣 X＝$\left[ \begin{matrix}0 & 1 & 0 \\ 4 & 5 & 7\end{matrix} \right]$表示，接著用矩陣運算加密後，再傳送出去。若小強與小志以此方式傳送訊息，並約定用方陣 A＝$\left[ \begin{matrix}0 & -3 \\ 2 & 1\end{matrix} \right]$加密，例如 AX＝$\left[ \begin{matrix}0 & -3 \\ 2 & 1\end{matrix} \right] \left[ \begin{matrix}0 & 1 & 0 \\ 4 & 5 & 7\end{matrix} \right]$＝$\left[ \begin{matrix}-12 & -15 & -21 \\ 4 & 7 & 7\end{matrix} \right]$，表示小志的原始訊息為 dog 而小強收到的訊息矩陣為$\left[ \begin{matrix}-12 & -15 & -21 \\ 4 & 7 & 7\end{matrix} \right]$。若小強收到小志傳來的訊息（加密後）矩陣為$\left[ \begin{matrix}-6 & -3 & -21 \\ 4 & 1 & 7\end{matrix} \right]$，則小志的原始訊息為何？

    $■答$：＿＿＿＿。'
  options:
  - label: A
    content: leg
  - label: B
    content: tag
  - label: C
    content: log
  - label: D
    content: lag
  - label: E
    content: bag
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設小志的原始訊息為矩陣 Y

    $\left[ \begin{matrix}0 & -3 \\ 2 & 1\end{matrix} \right] Y$＝$\left[ \begin{matrix}-6 & -3 & -21 \\ 4 & 1 & 7\end{matrix} \right]$⇒ Y＝$\left[ \begin{matrix}0 & -3 \\ 2 & 1\end{matrix} \right] ^{-1}\left[ \begin{matrix}-6 & -3 & -21 \\ 4 & 1 & 7\end{matrix} \right]$

    ＝$\frac{1}{6}\left[ \begin{matrix}1 & 3 \\ -2 & 0\end{matrix} \right] \left[ \begin{matrix}-6 & -3 & -21 \\ 4 & 1 & 7\end{matrix} \right]$

    ＝$\frac{1}{6}\left[ \begin{matrix}6 & 0 & 0 \\ 12 & 6 & 42\end{matrix} \right]$＝$\left[ \begin{matrix}1 & 0 & 0 \\ 2 & 1 & 7\end{matrix} \right]$

    故選(D)'
