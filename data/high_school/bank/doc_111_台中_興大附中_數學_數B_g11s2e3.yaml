  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 以下哪些 a 值可以使$\left[ \begin{matrix}a + 1 & -4 \\ -2 & a + 3\end{matrix} \right]$有乘法反方陣？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: －3
  - label: D
    content: '4'
  - label: E
    content: －5
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '因為有乘法反方陣，則

    （a＋1）（a＋3）－（－4）（－2）＝$a^{2}$＋4a－5

    ＝（a－1）（a＋5）≠0

    ⇒ a≠1 或－5

    故選(B)(C)(D)'
