  stem: 設 n 為正整數，符號$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{n}$代表矩陣$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right]$自乘 n 次，令$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{100}$＝$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$，試求 b＝＿＿＿＿。
  answer:
  - －100
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{2}$＝$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] \left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}1 & -2 \\ 0 & 1\end{matrix} \right]$

    $\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{3}$＝$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{2}\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}1 & -2 \\ 0 & 1\end{matrix} \right] \left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}-1 & 3 \\ 0 & -1\end{matrix} \right]$

    $\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{4}$＝$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{3}\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}-1 & 3 \\ 0 & -1\end{matrix} \right] \left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}1 & -4 \\ 0 & 1\end{matrix} \right]$

    以此類推$\left[ \begin{matrix}-1 & 1 \\ 0 & -1\end{matrix} \right] ^{100}$＝$\left[ \begin{matrix}1 & -100 \\ 0 & 1\end{matrix} \right]$

    故 b＝－100'
