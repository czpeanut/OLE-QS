  stem: '某大學數學系所中，兩位考生的各項成績如下表所示：

    | 考試比例 同學 | 學測成績 20 ％ | 筆試 30 ％ | 面試 ？ | 歷程檔案 ？ |

    | --- | --- | --- | --- | --- |

    | 小星 | 60 | 90 | 80 | 80 |

    | 小天 | 50 | 70 | 70 | 90 |

    系所成績的採計方式中面試與歷程檔案比例未知，但已知兩人最後的成績分別為 79 分及 71 分，可利用矩陣乘法表成$\left[ \begin{matrix}60 & 90 & 80 & 80 \\ 50 & 70 & 70 & 90\end{matrix} \right] \left[ \begin{matrix}0.2 \\ 0.3 \\ x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}79 \\ 71\end{matrix} \right]$，試問歷程檔案占的比例為 ＿＿＿＿％。'
  answer:
  - '25'
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left[ \begin{matrix}60 & 90 & 80 & 80 \\ 50 & 70 & 70 & 90\end{matrix} \right] \left[ \begin{matrix}0.2 \\ 0.3 \\ x \\ y\end{matrix} \right]$＝$\left[ \begin{matrix}79 \\ 71\end{matrix} \right]$

    ⇒$\begin{cases}12 + 27 + 80x + 80y = 79 \\ 10 + 21 + 70x + 90y = 71\end{cases}$

    ⇒$\begin{cases}80x + 80y = 40 \\ 70x + 90y = 40\end{cases}$⇒$\begin{cases}2x + 2y = 1 \\ 7x + 9y = 4\end{cases}$

