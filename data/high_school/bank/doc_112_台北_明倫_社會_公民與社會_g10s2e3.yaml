  type: single
  page: 2
  stem: 小皮同學就讀國中時，被校方依「行為不檢、不服管教」等理由記了八支警告，他升上高中後，擔心紀錄會影響他往後升學求職，故提起「確認行政處分無效」的行政訴訟。小皮與家長指控：校方沒有讓學生表達意見就懲處；<u>且導師向校方申請記四支警告，但校方卻記八支警告，前後內容不符</u>。一審法院判小皮敗訴，小皮不服上訴，二審法院亦認定一審判決無誤。同學們討論此案件，以下的說法何者最符合我國相關法律的規定？
  options:
  - label: A
    content: 小皮必須要先完成校內的行政救濟程序後，才能提起行政訴訟
  - label: B
    content: 學校記了八支警告，給予小皮作為警惕，屬於給付的行政處分
  - label: C
    content: 畫線處敘述違反信賴保護原則，政府應保護小皮對導師的信賴
  - label: D
    content: 依三級二審制度，訴訟順序是：高等行政法院、最高行政法院
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正確程序。(B)記警告屬於干預的行政處分。(C)記警告的數量有所出入，應是違反誠實信用原則。(D)記警告應是屬於輕微的行政處分，採用簡易行政訴訟程序：一審在高等行政法院地方行政訴訟庭；二審在高等行政法院高等行政訴訟庭。
