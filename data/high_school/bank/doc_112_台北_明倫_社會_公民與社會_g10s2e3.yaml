  stem: 小華一家五口住在某市一棟老舊公寓裡，某日市政府將小華家公寓劃入住宅都市更新案的範圍，並且核定建商對該地區所提出的都市更新計畫案，准予實施。小華一家人如不服市政府的核定，希望進行救濟，其救濟途徑的屬性與下列何者最相似？
