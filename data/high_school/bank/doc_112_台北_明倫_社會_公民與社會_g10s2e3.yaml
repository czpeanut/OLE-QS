  stem: '某國立大學一位大學生小賴，反對校方的英語畢業門檻制度（畢業門檻為全民英檢中高級初試通過、多益測驗 600 分以上等，若檢定未達標準，只要再修「英語文進修課程」也可以畢業）。小賴認為英語能力僅交給校外機構檢核，學校並沒有提供相關的教育，質疑英語畢業門檻制度的合理性與必要性，進而拒絕繳交多益證書。校方審核畢業資格時，認定小賴不符合畢業門檻，因此賴性學生尚未取得畢業證書。消息在網路上披露後，該校的幾名學生針對此則事件留言討論如下：

    阿中：為什麼有些學校沒設置英語畢業門檻，本校就要考英語檢定才能畢業，英語不好真吃虧……。

    阿華：英語畢業門檻根本無法達到確保學生英語能力的目的呀，只要再付一點學分費一樣可以畢業。

    阿民：學校又沒有提供學生英檢中高級、多益 600 的教學，為什麼能夠以此為畢業考核標準呢？

    阿國：法律授權各大學得自行訂定有關取得學位之資格條件，不爽不要來念啊！

    學生會會長：學生會正在爭取在校務會議上廢除本校的英語畢業門檻制度。

    小賴如不服學校的決定，希望進行救濟，要求該校核發畢業證書，若小賴對初步救濟結果仍不滿，請問他是否可以繼續提出行政爭訟程序？'
