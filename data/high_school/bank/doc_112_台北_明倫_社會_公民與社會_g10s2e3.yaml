  stem: 16 歲學生甲涉嫌性侵害，新聞報導後，群情激憤；有人找出甲的個資公布在網路上，從而該市警察局要求刪文。乙明知甲並非高官丙的小孩，卻在網路上指稱「甲是丙的小孩，因而丙下令警察要求網友刪文」，也號召群眾到丙住家抗議；抗議過程中，乙誤將丙珍愛的花瓶打碎。丙因乙侵害其名譽並破壞花瓶，向法院提起訴訟。請問從人權保障的觀點，評論本案與甲有關的情節，下列敘述何者最適切？
  options:
  - label: A
    content: 甲如遭判刑確定，該項犯罪紀錄未來應加以塗銷
  - label: B
    content: 為揭弊而揭露甲的個資，並未侵犯甲之隱私權利
  - label: C
    content: 警察局為維護甲的隱私要求刪文，無須法律依據
  - label: D
    content: 隱私應受保障，但因甲自身違法，無法要求賠償
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依據《少年事件處理法》，少年在受轉介處分執行完畢兩年後，或保護處分、刑罰執行完畢或赦免後經過三年，會塗銷少年前科紀錄，以保護少年避免標籤化並有機會回歸正軌生活，為正解。(B)公布個資已侵害他人隱私權。(C)要求甲刪文須依法行政，以避免侵害人權。(D)甲違法與甲享有隱私權保障是兩件事，無法混為一談，甲仍可請求相關賠償。
