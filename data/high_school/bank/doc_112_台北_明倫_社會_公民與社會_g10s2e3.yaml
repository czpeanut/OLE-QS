  stem: 2023 年政界、學術界、演藝界爆出多起性騷震撼彈，堪稱是臺版的#MeToo 事件。多位被害人出面控訴多年前遭遇肢體、言語騷擾，甚至被偷拍私密畫面。有鑑於此，立法院通過《性騷擾防治法》修法，明定意圖性騷擾者，處 2 年以下有期徒刑、拘役或併科新臺幣 10 萬元以下【甲】；利用權勢或機會犯之者，加重其刑至 1∕2，並規範性騷擾事件發生時被害人未成年者，得於成年後 3 年內提出申訴。請問下列敘述何者正確？
  options:
  - label: A
    content: 修正《性騷擾防治法》，由法律授權司法機關懲處加害人
  - label: B
    content: 因《性騷擾防治法》屬行政法規，上述的【甲】應為罰鍰
  - label: C
    content: 政府透過立法保障人民不受騷擾，此為給付的行政行為
  - label: D
    content: 立法院基於信賴保護原則，讓人民有安心的工作環境
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《性騷擾防治法》本為行政法，修法後部分條文有刑罰，將由司法機關懲處加害人，為正解。(B)從前述有期徒刑、拘役來看，此屬於刑罰範疇，因此【甲】應為「罰金」。(C)此事規範性騷擾相關行為及其罰則，屬於干預的行政行為。(D)信賴保護原則是指行政機關做出行政行為應遵循的行政法原則，並非立法機關立法時應遵循的原則。
