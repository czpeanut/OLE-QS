  stem: 相較於若干國家的民主化經驗，我國在威權轉型過程中相當平和順利。下列關於我國威權轉型的各項事件，發生時間的先後順序為何？(甲)國會全面改選；(乙)第一次修憲；(丙)民進黨宣布成立；(丁)宣布解除戒嚴；(戊)廢除國民大會；(己)第一次總統直選；(庚)首次的政黨輪替
  options:
  - label: A
    content: (丙)→(乙)→(甲)→(丁)→(庚)→(己)→(戊)
