  answer_status: verified
  answer_source: answer_key
  explanation: (甲)國會全面改選為 1992 年；(乙)第一次修憲為 1991 年；(丙)民進黨宣布成立為 1986 年；(丁)宣布解除戒嚴為 1987 年；(戊)廢除國民大會為 2005 年第七次修憲結果；(己)第一次總統直選為 1996 年；(庚)首次的政黨輪替為 2000 年。答案選(B)。
