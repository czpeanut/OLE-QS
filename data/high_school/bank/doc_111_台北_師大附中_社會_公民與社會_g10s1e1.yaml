  stem: 英國在 2016 年 6 月 23 日公投選擇脫離歐盟，隨後英國政府與歐盟陸續開啟多場談判，內容包含未來貿易關係、公民權及「分手費」等重要議題。其中就公民權議題，雙方協議會讓兩地公民權利獲得保障。因為根據《歐洲聯盟條約》規定，歐盟公民得以在其所居住的其他歐盟國家行使與該國公民相同的選舉權與被選舉權，以及向歐洲議會請願的權利。在這種形態下，對傳統主權國家產生什麼影響？
  options:
  - label: A
    content: 人民以直接民主的形式影響政府政策將成常態
  - label: B
    content: 「人民」不再是主權國家組成必須具備的要素
  - label: C
    content: 各國人民間在政治權利上的衝突將較以往頻繁
  - label: D
    content: 對內最高且對外不容干涉的特性逐漸受到挑戰
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文提及《歐洲聯盟條約》規定，歐盟公民得以在其所居住的其他歐盟國家行使與該國公民相同的選舉權與被選舉權，由此顯示歐盟成員國的主權對內最高且對外不容干涉的特性逐漸受到挑戰，故選(D)。
