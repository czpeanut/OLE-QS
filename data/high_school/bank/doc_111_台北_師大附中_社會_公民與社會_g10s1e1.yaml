  type: multiple
  page: 12
  stem: 聯合國於 1993 年通過「巴黎原則」，鼓勵會員國設立國家級人權機構，以確保國際人權標準能獲得實踐。各國設立機構名稱不一，但常以國家人權委員會統稱。而我國依據《兩公約》的內容，訂立國內施行法，並制定審查制度，以改善我國人權制度與現況。請問下列關於我國審查機制與專責機構的敘述，何者正確？
  options:
  - label: A
    content: 我國審查委員會之專家角色僅為審查，其組成仍缺乏制度性規定
  - label: B
    content: 我國於監察院設置國家人權委員會做為我國促進人權的專責機構
  - label: C
    content: 國家人權委員會擁有獨立運作、行使調查、提出人權報告的權力
  - label: D
    content: 國家人權委員會除審查外，亦有監督行政、立法部門執行之權力
  - label: E
    content: 聯合國審查委員會檢視我國政府之國家報告，並提出結論性建議
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 立法院通過《監察院國家人權委員會組織法》，監察院下設「國家人權委員會」，讓人權委員處理與調查涉及酷刑、侵害人權或各種歧視案件、對政府提出建議與報告、撰提重要人權專案報告等，監督政府落實執行國際人權義務，故(B)(C)正確。(E)我國非聯合國會員國，因此由政府邀請國際專家擔任審查委員，並由這些審查委員所組成的審查會議，檢視政府單位提出之國家報告，以及聽取民間團體的影子報告，故(E)正確。
