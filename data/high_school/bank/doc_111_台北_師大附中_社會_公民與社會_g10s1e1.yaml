  section: 1
  number: 4
  type: single
  page: 1
  stem: 某國有「童婚」傳統，許多未滿 15 歲少女成為父母財產，被迫結婚而失去受教育機會。近年來國際人權團體批評此傳統剝奪女孩受教權，違反國際人權公約，因此屢向該國施壓，要求立法禁止，卻遭到該國政府反彈，呼籲外界應尊重其傳統文化。從人權保障觀點檢視前述國際人權團體的作為，下列何項看法最適當？
  options:
  - label: A
    content: 人權公約尊重各國傳統，但童婚現象違反基本人權，超越文化尊重原則
  - label: B
    content: 人權團體雖然追求基本人權保障，但仍應尊重各國主權不可干涉內政
  - label: C
    content: 舊式文化與進步的人權精神有違，不符世界的價值潮流，必須加以破除
  - label: D
    content: 人權團體雖秉持普世價值，仍須尊重各國國情，接受社會的文化差異
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題目要求從人權保障觀點檢視，由於「童婚」剝奪女孩受教權，超越文化尊重原則，故(A)的看法最適當。
