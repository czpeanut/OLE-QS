- id: doc_111_台北_師大附中_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 我國是以憲法為基礎的憲政主義國家，然而在國際政治上，我國的國家地位卻未能普遍被世界各國所承認，主要與我國的「主權」爭議有關。關於我國現行法規對「主權」的規範，下列何者正確？
  options:
  - label: A
    content: 對領土範圍採取直接列舉，明列臺灣、澎湖、金門與馬祖等地為我國領土
  - label: B
    content: 在《憲法增修條文》中將所謂的「依其固有之疆域」，改稱為「自由地區」
  - label: C
