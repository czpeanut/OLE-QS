  - label: B
    content: 政府查禁〈革命〉一曲違反比例原則，改採罰款手段才符合法治
  - label: C
    content: 1970 年代以後查禁歌曲改由新聞局負責，顯示已經轉向人權保障原則
  - label: D
    content: 1980 年代多數歌曲通過審查可能是自我思想審查，人權侵害未必減少
  group_stem: 許多國家可能基於某些理由查禁流行歌曲。以臺灣為例，1930 年代開始流行以福佬系民謠為創作題材，當時西門町與大稻埕有許多收費不低的音樂廳，傳唱這些歌謠。但部分歌謠後來遭政府以過於寫實、動搖民心為由，予以查禁。1950 年代左右，行政院依據《戒嚴法》訂定《臺灣省戒嚴期間新聞雜誌圖書管理辦法》，開始管制流行文化，主要由警備總司令部執行歌曲查禁。如披頭四樂團演唱之〈革命〉便因「內容欠妥，混淆視聽，危害社會治安」遭禁。至 1970 年代，查禁業務改由新聞局負責，據統計，當時約有六分之一的歌曲因未通過審查而禁唱。到了 1980 年代，絕大多數歌曲都通過審查，禁唱歌曲大幅減少。面對審查制度，音樂人仍勇於透過流行樂曲批判現狀。曾有外國歌手唱道：「這是最好的年代，所以人民不需要自由」而遭到禁播。有樂評指出，該歌詞字面上說政府讓經濟成長率翻升，表示統治萬能，所以人民也就不需要自由，但實際是諷刺該政府，試圖以經濟成果遮掩其威權統治事實。像這類具批判性的樂曲，多屬非主流文化，常被忽視；但也有作品廣受歡迎，甚至在特定時期帶動反叛精神。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)雖然當時警總查禁流行歌曲，係依法律來實施，但戒嚴時的法律並未符合公益動機與比例原則。(B)(C)(D)查禁歌曲，即是對人民進行思想審查，侵犯人民的言論自由，因此不管由什麼機關查禁，或是改由罰款手段，都違反法治國原則，故選(D)。
