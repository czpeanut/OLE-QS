  stem: 聯合國人權理事會共有 47 席，2018 年 10 月改選其中 18 席，任期自 2019 ～ 2022 年。由於只有 18 國參選，結果近年來人權狀況備受爭議的菲律賓、喀麥隆、巴林、索馬利亞、孟加拉和厄利垂亞等國，全部順利當選。試問此次改選結果可能造成人權理事會何種功能被質疑？
  options:
  - label: A
    content: 協調與整合聯合國各機關人權工作的成效
  - label: B
    content: 監督並要求侵犯人權之國家改善的公信力
  - label: C
    content: 針對各項人權公約設立專責機構的可能性
  - label: D
    content: 定期審議各締約國的人權報告及個人申訴
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由於人權理事會當選的席次，是人權狀況備受爭議的菲律賓、喀麥隆、巴林、索馬利亞、孟加拉和厄利垂亞等國，若由這些國家來進行人民調查與監督，恐將受到公信力的質疑，故選(B)。
