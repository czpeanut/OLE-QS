  stem: 自臺灣疫情爆發以來，國人安全一直是我國政府優先考量。當時考量病毒發源地的地緣關係，及中國長時間下的資訊不透明，致使政府無法評估中國疫情各地的狀況，因此 2020 年初政府規定「陸配子女若無中華民國國籍，不得申請來臺」，且只有符合「在中國無人照顧」及「未成年」兩個條件以專案申請才能入境。然而有學者提到因我國已將《兒童權利公約》國內法化，根據公約第 10 條提及「兒童或其父母為團聚而離開締約國，應有義務以積極人道方式處理之」，試問下列敘述何者最為適切？
  options:
  - label: A
    content: 為遵守《兒童權利公約》保障其健康權，應開放陸籍子女入境
  - label: B
    content: 邊境政策是針對非本國籍人士，並沒有侵害自由權的疑慮
  - label: C
    content: 防疫措施因應各國邊境管制不同，主權展現應優先於人權
  - label: D
    content: 即使陸籍子女非我國的國民，其基本人權也應該予以保障
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 我國已將《兒童權利公約》國內法化，依公約第 10 條提及「兒童或其父母為團聚而離開締約國，應有義務以積極人道方式處理之」，因此，即使陸籍子女非我國的國民，其基本人權也應該予以保障，故選(D)。
