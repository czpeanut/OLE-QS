  type: single
  page: 2
  stem: 「自由之家」（freedom house）是國際非政府組織，旨在監督全球自由度和宣導民主與人權。每年會針對全球「政治權利」與「公民自由」兩個指標，進行自由程度評分，並分成「自由」、「部分自由」、「不自由」三種程度。而「2021 年全球自由度調查報告」中，臺灣整體分數較前一年提升，拿下 94 分，在亞洲僅次於日本。但臺灣早在 1996 年前，曾被評比為「部分自由」國家，請問以下推論何者較為合適？
  options:
  - label: A
    content: 1996 年後臺灣民主轉型成功，公民自由與政治權利每年皆有持續進步
  - label: B
    content: 1990 年代左右政府積極保障人民自由與政治權，故整體分數開始提高
  - label: C
    content: 臺灣本身已經歷 3 次政權和平移轉，表示在「公民權利」上表現優異
  - label: D
    content: 2021 年因應新冠疫情，我國政府積極對外捐贈口罩，故獲得較高成績
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 我國《憲法》本來就有保障自由與政治權，但因動員勘亂時期而使人權受到限制，1987 年解嚴以後，1990 年代開啟一連串的修憲改革，人民自由與政治權逐漸落實，故(B)正確。(A) 1996 年臺灣首次總統直選，經 2000 年和 2008 年兩次政黨輪替後，臺灣民主轉型成功。(C)臺灣經歷 3 次政權和平移轉，表示民主轉型成功。(D)捐贈口罩與自由民主沒有必然關係。
