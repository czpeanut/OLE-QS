  stem: 'T細胞的細胞膜有受體A可與癌細胞表面上的配體A結合，表現出抗癌性；而嗜中性白血球亦具有相同的配體A可與之結合，而改變T細胞的抗癌性。科家將小鼠嗜中性白血球收集與處理，將與［腫瘤組織培養後的上清液］作用後的嗜中性白血球稱為TCN，而與［正常組織培養後的上清液］作用的則稱為N，並將TCN及N進行如下表所示的實驗處理。科學家讓小鼠產生腫瘤後，以每五隻一組來注射不同處理的細胞，並在24天後觀測每隻小鼠腫瘤大小（如右下圖）。依以上資訊及所習得知識，回答下列問題。

