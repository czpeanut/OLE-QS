- id: doc_110_桃園_武陵_自然_生物_選修生物III_g12s1e1_s3_46
  section: 3
  number: 46
  type: single
  page: 6
  stem: 有關EpCAM的生理作用機制，下列敘述何者正確？（單選）
  options:
  - label: A
    content: EpCAM可直接與PD-LI結合，進而導致腫瘤增生
  - label: B
    content: PD-L1表現量降低，可降低免疫細胞殺死癌細胞的能力
  - label: C
    content: EpAb2-6與EpCAM結合，可增加PD-L1的表現量
  - label: D
    content: EpCAM的功能與穩定PD-LI的表現量有關
  group_stem: 細胞膜會黏附一些功能性的蛋白質，EpCAM即是一種此型的膜蛋白。EpCAM易在上皮組織和惡性腫瘤細胞中大量表現，相關研究證實EpCAM的功能與細胞黏附、遷移、增殖、分化及腫瘤的發生等有關。中央研究院的研究團隊發現，此種蛋白會透過訊息傳遞以穩定另一種蛋白質PD-L1，而PD-L1的功能是讓腫瘤細胞逃過身體免疫系統的監控，進而導致癌症惡化。研究團隊研發出一種單株抗體（EpAb2-6），此抗體可準確辨認出癌細胞上的EpCAM，並與EpCAM產生中和性反應，能抑制EpCAM的功能及降低癌細胞中PD-LI蛋白的表現量，促使腫瘤細胞凋亡及活化T細胞將癌細胞殺死的能力。在大腸癌的動物實驗中，EpAb2-6有效的抑制腫瘤增長並提升小鼠的存活率。而在肺癌的動物實驗中，則是使用了EpAb2-6和PD-L1抗體Atezol izumab的「聯合療法」，實驗結果證實也能抑制腫瘤的生長。上述的重要發現，讓研究學者能深入了解EpCAM促使癌症惡化的分子機制，亦提供了未來臨床上治療EpCAM過量表現的癌症，另一種結合免疫療法的新策略。 實驗證明，這種中和性抗體EpAb2-6可以結合多種癌細胞的EpCAM，也可抑制腫瘤的生長與轉移，使小鼠壽命延長。研究者表示：「EpCAM在多種癌細胞很常見，如大腸癌、肺癌、口腔癌及胰臓癌等，因此，這項研究成果未來將被廣泛應用在各種癌症診斷與治療。」所以，中和性抗體EpAb2-6具有極大的發展潛力，可在癌症診斷、標靶治療及造影上大量應用。根據上文所述及相關知識，回答下列問題：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 文中：EpCAM會透過訊息傳遞以穩定另一種蛋白質PD-L1
