  stem: 人類第21對染色體上有一A基因，此基因有A1、A2、A3和A4四種等位基因。有一唐氏症患者的基因型為A1A3A3，而其母親的基因型是A1A2；父親的基因型是A2A3，則此唐氏症患者染色體異常的原因，是由於在下列哪一分裂期發生染色體無分離現象？
