  stem: 有關NETs的敘述，下列哪些正確？（多選）
  options:
  - label: A
    content: 形成NETs的嗜中性白血球仍可存活
  - label: B
    content: 活性氧自由基的累積參與NETs的形成
  - label: C
    content: 具有特定形狀
  - label: D
    content: 形成過程中，會造成細胞核瓦解
  - label: E
    content: 細胞核是組成NETs的唯一成分來源
  group_stem: 長久以來，科學界普遍認為嗜中性白血球是藉由胞吞作用與釋放其顆粒構造（granule）內可殺死細菌的胜肽（抗菌胜肽），以清除入侵的微生物。然而近年來，科學家發現新的免疫機制，稱之為嗜中性白血球胞外網狀物（NETs，neutrophil extracellular traps）。NETs的形成與作用方式簡述如下：當嗜中性白血球上的受體（receptor）接收到外來刺激後，細胞內會產生大量的活性氧自由基。當細胞內累積這些活性氧自由基時，其核膜結構及細胞質中的顆粒構造變得不穩定。接著，細胞核與顆粒構造的膜完整性開始喪失，細胞核物質與鬆散的基因體DNA逐漸充斥在整個細胞中，並與其顆粒構造內的抗菌胜肽融合在一起。最後，細胞變圓並收縮以吐出NETS。NETs具有不固定性的鬆散細胞核染色質DNA，如同漁網般抓住細胞周圍的微生物，而NETs上的其他物質則可殺死微生物。在某些特定的情況下，NETS清除外來微生物的效率高於先前我們所知的胞吞作用。根據上文所述及相關知識，回答下列問題：
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (C)不固定性 (E)還有抗菌胜肽
