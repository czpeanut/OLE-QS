  - label: C
    content: 皆具有棘狀蛋白
  - label: D
    content: 皆具有相的受體結合域
  - label: E
    content: 可激發人體產生相同的抗體
  group_stem: 冠狀病毒因其套膜的棘狀蛋白在電子顯微鏡下看起來像是皇冠周圍的凸起裝飾而得名，棘狀蛋白是冠狀病毒能感染宿主細胞的關鍵。許多病毒在感染宿主細胞之前，病毒表面的醣蛋白需要經過宿主細胞的蛋白酶切割後，才能裡應外合、進入宿主細胞內。新冠病毒（SARS-CoV-2）表面的棘狀蛋白形態像撲克牌花色裡的梅花，頂端的梅花三瓣還戴了遮陽帽，藉由棘狀蛋白的胺基末端與大量醣基化修飾，將自己隱藏起來，以躲過宿主免疫系統的攻擊。但如何把梅花三瓣藏妥，又同時可以有效結合宿主細胞表面的受體呢？首先是前蛋白轉化酶（furin）切掉棘狀蛋白的遮陽帽，將棘狀蛋白的受體結合域露出，才能與宿主細胞的受體ACE2結合；其次是另一種蛋白酶TMPRSS2（transmembrane protease serine 2）再次切割與受體結合的棘狀蛋白，讓病毒可以成功與宿主細胞膜融合，侵入宿主細胞內。科學家發現，SARS-CoV-2的受體結合域與受體ACE2結合的親和力，要比SARS病毒（SARS-CoV）強上許多，又能巧妙的隱藏起來，大大增加了SARS-CoV-2的感染成功率，這個差異正是新冠病毒能引起全球大爆發的關鍵之一。根據上文所述及相關知識，回答下列問題：
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (D)未說明 (E)不同抗體
