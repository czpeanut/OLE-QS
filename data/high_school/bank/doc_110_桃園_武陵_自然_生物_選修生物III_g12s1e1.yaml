- id: doc_110_桃園_武陵_自然_生物_選修生物III_g12s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 若此為新冠病毒快篩檢測試劑，下列敘述何者正確？
  options:
  - label: A
    content: 此檢測法主要是以新冠病毒RNA為抗原做為檢測標的物
  - label: B
    content: 暴露在最外側的新冠病毒棘蛋白不適合做為檢測標的物
  - label: C
    content: 測試線甲中的抗體無法識別膠體金抗體所結合的新冠病毒抗原
  - label: D
    content: 即使膠體金抗體沒有與新冠病毒抗原結合，仍可與測試線乙中的抗體結合
  group_stem: 常見的快篩檢測試劑是應用免疫層析原理如－A。當將檢體加至檢體區後，檢體內的分子會藉由毛細現象往右方吸收區移動。膠體金抗體區中的抗體（圖中用Y形表示）已與紅紫色膠體金鍵結（圖中用圓形表示），如檢體中具有可結合的抗原，即可形成「抗原－膠體金抗體結合物」。此結合物以及未與抗原結合的膠體金抗體可繼續往右側流動，並分別與右方測試線甲與測試線乙上不同的抗體結合，而呈現如下圖－B的檢測結果。
  shared_asset: g1_15_16
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)棘蛋白 (B)可以 (C) 可以
- id: doc_110_桃園_武陵_自然_生物_選修生物III_g12s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 承上題，若檢測後不論在測試線甲或是測試線乙皆未呈現出訊號，則下列推測，何者最合理？
  options:
  - label: A
    content: 此檢測失敗，因此無法進行是否感染的判斷
  - label: B
    content: 病毒RNA被破壞，因此無法獲得應有訊號
  - label: C
    content: 病毒帶原量過低，因此無法成功檢測出病毒的存在
  - label: D
    content: 病毒發生突變，因此無法被此試劑的膠體金抗體所辨識
  group_stem: 常見的快篩檢測試劑是應用免疫層析原理如－A。當將檢體加至檢體區後，檢體內的分子會藉由毛細現象往右方吸收區移動。膠體金抗體區中的抗體（圖中用Y形表示）已與紅紫色膠體金鍵結（圖中用圓形表示），如檢體中具有可結合的抗原，即可形成「抗原－膠體金抗體結合物」。此結合物以及未與抗原結合的膠體金抗體可繼續往右側流動，並分別與右方測試線甲與測試線乙上不同的抗體結合，而呈現如下圖－B的檢測結果。
  shared_asset: g1_15_16
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 測試線乙為對照組，若都沒出現訊號，表示試劑有問題，無法判斷
