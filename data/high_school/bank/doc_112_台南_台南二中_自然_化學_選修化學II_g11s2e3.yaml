  stem: 將某液體加入滴定管中，並小心控制其流量，使液體緩慢流出。再將帶負電的塑膠棒靠近緩慢流出的液體，結果發現液體會發生偏移現象，而靠近塑膠棒。則下列哪一個不可能為滴定管中的液體？
  options:
  - label: A
    content: $C_{2}H_{5}$OH
  - label: B
    content: 順-1,2-二氯乙烯
  - label: C
    content: $C_{6}H_{6}$（苯）
  - label: D
    content: $CH_{2}Cl_{2}$
  - label: E
    content: $CH_{3}$COOH
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 594.75
      - 100.25
      - 686.65
      - 225.65
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此實驗是利用分子本身電荷分布不均（極性）來進行的，故完全不具有極性的苯即為答案。故選(C)。
