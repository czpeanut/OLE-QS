  stem: 某化學反應式為：X＋Y→P＋Q，化學反應路徑描述如附圖所示。已知其反應速率定律式為：$r=\frac{\Delta [P]}{\Delta t}=k [X][Y]$。下列有關此反應的敘述，哪一個正確？
  options:
  - label: A
    content: 此反應為一級反應
  - label: B
    content: 逆向反應的活化能為a
  - label: C
    content: 此化學反應為放熱反應，反應熱ΔH＝b
  - label: D
    content: 由化學反應式即可推知反應速率定律式為k[X][Y]
  - label: E
    content: 將反應物X與Y的初始濃度增為原來的兩倍，則反應速率為原來的四倍
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3/s1_7_f1.png
    crop:
      page: 2
      rect:
      - 517.05
      - 46.75
      - 670.95
      - 149.15
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) X一級、Y一級，共二級；(B)為a－b；(C)為吸熱反應；(D)由反應式無法得知，需搭配圖確認為單步驟反應方可得知。故選(E)。
