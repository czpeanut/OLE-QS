- id: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 已知某反應的反應速率r＝k[P]$^{m}$[Q]$^{n}$，且k的單位為$M^{－3}s^{－1}$，當[P]不變時，[Q]減為原來的一半，r亦變為原來的一半，則數對(m，n)的值為：
  options:
  - label: A
    content: (2，2)
  - label: B
    content: (1，2)
  - label: C
    content: (2，1)
  - label: D
    content: (1，1)
  - label: E
