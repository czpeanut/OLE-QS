- id: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 已知碳酸鈣與鹽酸之反應為二級反應。若將邊長10 cm正立方體碳酸鈣與2 M鹽酸反應之反應速率為r。今將碳酸鈣切成每邊長5 cm的正立方體與4 M鹽酸反應之反應速率應為：
  options:
  - label: A
    content: 8r
  - label: B
    content: 2r
  - label: C
    content: $\frac{5}{4}$r
  - label: D
    content: r
  - label: E
    content: $\frac{r}{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 邊長切一半，反應速率兩倍。濃度加倍，反應速率四倍，共變為原本的八倍。故選(A)。
- id: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 催化劑在化工領域上應用非常廣泛。尤其是在非均相催化反應系更顯重要。下列反應中，何者<u>不是</u>非均相催化反應？
  options:
  - label: A
    content: 黑色二氧化錳固體催化雙氧水分解
  - label: B
    content: 鎳催化乙烯氫化為乙烷
  - label: C
    content: 金屬氧化物五氧化二釩催化$SO_{2}$氣體再氧化生成$SO_{3}$
  - label: D
    content: 銅幣在硝酸汞溶液中變銀色
  - label: E
    content: 哈柏法用鐵催化製氨
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D) Cu＋Hg($NO_{3}$)$_{2}$ → Cu($NO_{3}$)$_{2}$＋Hg，非催化反應。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 正電子放射斷層攝影是先進的癌症診斷技術之一。目前使用的放射性藥劑是含有$^{18}$F的氟代去氧葡萄糖，半衰期約為2小時。若從加速器製得的藥劑，運送至醫院所需時間為12小時，當醫院需要含有1.0毫克$^{18}$F的氟代去氧葡萄糖的藥劑，則從製造端運送出的藥劑至少需含有$^{18}$F的氟代去氧葡萄糖若干毫克？
  options:
  - label: A
    content: '64'
  - label: B
    content: '32'
  - label: C
    content: '16'
  - label: D
    content: '12'
  - label: E
    content: '4'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 運送過程需12小時，即6個半衰期。若醫院需要1 mg，設一開始需要x mg，則可得x×(0.5)$^{6}$＝1，可得x＝64。故選(A)。
