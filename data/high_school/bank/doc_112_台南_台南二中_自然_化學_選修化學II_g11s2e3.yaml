- id: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 某生在100℃、2升之定體積的容器內進行化學反應，發現X、Y和Z之莫耳數隨時間變化如附圖。試問下列選項何者正確？
  options:
  - label: A
    content: 反應式可表示為4X＋2Y→Z
  - label: B
    content: 第0～50秒內，X的消耗速率為－4×$10^{－3}$ M/s
  - label: C
    content: 第0～50秒內，Z的生成速率為6×$10^{－3}$ M/s
  - label: D
    content: 第0～50秒內，Y、Z之間的反應速率關係為：$\frac{3}{2}\times \frac{\Delta [Z]}{\Delta t}=-\frac{\Delta [Y]}{\Delta t}$
  - label: E
    content: 第0～50秒內，X、Z的反應速率比為4：3
  assets:
  - key: s1_15_f1
    kind: figure
    file: doc_112_台南_台南二中_自然_化學_選修化學II_g11s2e3/s1_15_f1.png
    crop:
      page: 2
      rect:
      - 490.55
      - 817.75
      - 684.45
      - 985.0
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由三物質反應過程中的變化量可知方程式為4X＋2Y→3Z；(B) 0～50秒內X的量從0.6 mol變為0.2 mol，體積為2 L，則消耗速率為$\frac{0.6-0.2}{2\times 50}$＝0.004 M／s（沒有負號）；(C)由係數比可知Z的生成速率為0.003 M/s；(D) $R_{Y}$：$R_{Z}$＝2：3，故此關係式不正確；(E)係數比＝4：3，正確。故選(E)。
