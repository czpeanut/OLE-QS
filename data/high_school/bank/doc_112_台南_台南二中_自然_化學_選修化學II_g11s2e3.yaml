  answer_status: verified
  answer_source: answer_key
  explanation: '[Q]減半，速率減半，代表此反應對Q而言為一級反應，n＝1。又k的單位＝$M^{(1－m－n)}s^{－1}$，則可知m＝3。故選(E)。'
