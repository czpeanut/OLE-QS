  section: 2
  number: 3
  type: fill
  page: 1
  stem: 已知實數 a，b 滿足$\int_{0}^{1} (3x^{2}+ax+b) dx =1$，$\int_{2}^{3} (3x^{2}+ax+b) dx =11$，求數對（a，b）＝ ＿＿＿＿。
  answer:
  - （－4，2）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\int_{0}^{1} (3x^{2}+ax+b)dx$＝1

    ⇒$\left. \left( x^{3}+\frac{a}{2}x^{2}+bx \right) \right| _{0}^{1}$＝1 ⇒$1+\frac{a}{2}+b=1$

    ⇒ a＋2b＝0 …………………①

    $\int_{2}^{3} (3x^{2}+ax+b)dx$＝11

    ⇒$\left. \left( x^{3}+\frac{a}{2}x^{2}+bx \right) \right| _{2}^{3}$＝11 ⇒$27+\frac{9}{2}a+3b-(8+2a+2b)$＝11

    ⇒ 5a＋2b＝－16 ……………②

    由①、②得 a＝－4，b＝2

    故數對（a，b）＝（－4，2）'
