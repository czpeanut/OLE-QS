  stem: '設函數 f（x）是定義在[0，1]上的遞增連續函數，且 f(0)＝0，f(1)＝1。經濟學家將這類函數的圖形統稱為羅倫茲曲線，並常使用它們來測度「所得分配不均」的程度。例如 f（0.2）＝0.15 表示 20 ％最低所得者的總所得占全部總所得的 15 ％。除此之外，與羅倫茲曲線相關的吉尼係數（Gini coefficient）也可以用來測度所得分配不均程度，其定義如下：

    吉尼係數＝2×（R 的面積），

    其中 R 代表右圖中被羅倫茲曲線 y＝f（x）割出的鋪色區域。吉尼係數愈大表示所得分配愈不平均；反之，係數愈小則分配愈平均。已知某一國家的所得分配符合羅倫茲曲線$y=\frac{13}{15}x^{2}+\frac{2}{15}x$，試回答下列問題：

    (1) 使用羅倫茲曲線，求這國家 30 ％最低所得者的總所得占全部總所得的百分比為＿＿＿＿。

    (2) 求此國家的吉尼係數為＿＿＿＿。'
  assets:
  - key: s2_9_f1
    kind: figure
    file: doc_110_台南_台南二中_數學_數乙_g12s1e3/s2_9_f1.png
    crop:
      page: 2
      rect:
      - 457.0
      - 479.65
      - 564.3
      - 579.35
  answer:
  - (1) 11.8 ％；(2) $\frac{13}{45}$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) f（x）＝$\frac{13}{15}x^{2}+\frac{2}{15}x$

    f（0.3）＝$\frac{13}{15}$×（0.3）$^{2}$＋$\frac{2}{15}$×0.3＝0.118 ∴所求為 11.8 ％

    (2) 吉尼係數＝$2\times \left( \frac{1}{2}\times 1\times 1-\int_{0}^{1} f(x)dx \right)$

    ＝$2\times \left( \frac{1}{2}-\frac{1}{15}\int_{0}^{1} (13x^{2}+2x)dx \right)$

    ＝$1-\frac{2}{15}\left. \left( \frac{13}{3}x^{3}+x^{2} \right) \right| _{0}^{1}$

    ＝$1-\frac{2}{15}\times \left( \frac{13}{3}+1 \right)$＝$\frac{13}{45}$'
