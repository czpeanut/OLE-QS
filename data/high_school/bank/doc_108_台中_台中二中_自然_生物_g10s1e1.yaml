- id: doc_108_台中_台中二中_自然_生物_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 呼吸商數(RQ)是指生物體在同一時間內，釋放二氧化碳與吸收氧氣的體積之比或莫耳數之比。通常醣類的呼吸商數約為1.0，脂肪約為0.7，蛋白質約為0.82。科學家測定了四種植物種子萌發時的呼吸商數：富含澱粉的種子為1.0、小麥種子為0.95、亞麻種子為0.64、蕎麥種子為0.48。若四種種子萌發時的耗氧速率相等，試問下列何種植物種子萌發時釋放二氧化碳的速率最高？
  options:
  - label: A
    content: 含澱粉種子
  - label: B
    content: 小麥種子
  - label: C
    content: 亞麻種子
  - label: D
    content: 蕎麥種子
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: BI-1-1-2
      book: 生物（全）
      chapter: 細胞的構造、能量與分裂
      title: 細胞及能量
      std: true
    textbook: 生物（全） 細胞及能量
    pattern:
      key: BI-1-1-2:T08
      name: 細胞呼吸速率與呼吸商數分析
    labeled_by: agent
    label_confidence: high
    label_note: 題幹僅提供呼吸商數(RQ)而未提供氣體交換速率數據，嚴格而言無法直接推算呼吸速率
    fixed_by: agent
    fix_note: （人工修正：補充耗氧速率相等條件並調整問法為釋放CO2速率，附解析）
  difficulty: 3
  explanation: 呼吸商數(RQ)＝釋放CO2速率／吸收O2速率。在耗氧速率相同的情況下，RQ值愈高，代表釋放CO2的速率愈高。四者中以含澱粉種子的RQ＝1.0最高，故選(A)。
