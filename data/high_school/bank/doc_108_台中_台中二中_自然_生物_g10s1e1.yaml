- id: doc_108_台中_台中二中_自然_生物_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 脊椎動物具有紅血球的演化優勢，對於攜帶氧氣的效率可以提高，尤其哺乳類的雙凹圓盤狀紅血球，更是有其奧妙之處。除了可以增加表面積和體積的比值，有利於細胞內外氣體的交換之外，其內並無細胞核和粒線體的構造，這讓紅血球更容易彎曲得以通過極細的微血管，並且通過之後又可以迅速恢復原狀。更有甚者，無核又無粒線體的紅血球，有利於攜帶更多的氧氣分子，但是這也使得紅血球的壽命有限。因此，必須由骨髓當中的造血幹細胞持續的細胞分裂，並且分化為紅血球來補充。關於紅血球，下列敘述何者較為正確？
  options:
  - label: A
    content: 紅血球的細胞膜具有專門運輸氧氣的蛋白質，有利於氧氣通過細胞膜
  - label: B
    content: 細胞核是細胞的生命中樞，紅血球因無法製造結構蛋白質等物質，所以壽命不長
  - label: C
    content: 紅血球之粒線體可以執行有氧呼吸和發酵作用，是細胞的能量工廠
  - label: D
    content: 紅血球是從骨髓中的幹細胞分化而來，分化是指核苷酸序列會發生改變
  - label: E
    content: 原核細胞也跟紅血球一樣不具很多構造，例如：原核細胞不具核糖體
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
