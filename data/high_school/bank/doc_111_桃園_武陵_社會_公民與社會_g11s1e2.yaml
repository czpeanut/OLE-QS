  type: single
  page: 1
  stem: 百貨公司每年都會舉行為期數天的週年慶，這段期間内展場眾多商品都有豐富的折扣優惠，往往吸引大批人潮前來撿好康。像是某些中高價位的衣服，週年慶時只要平日價格的四到八成。請問下列何者較符合對這種「同商品、不同價」情形的說明？
  options:
  - label: A
    content: 週年慶的商品皆已推出一段時間，因技術進步而壓低成本
  - label: B
    content: 週年慶的低價顯示平日的交易都是業者獲利，消費者受害
  - label: C
    content: 週年慶和平日的消費者對同一產品可能有不同的願付價格
  - label: D
    content: 週年慶時人潮增加，產品的需求增加，價格應該上漲才對
