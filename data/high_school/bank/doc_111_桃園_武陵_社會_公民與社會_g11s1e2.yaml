  stem: 業者制定差別定價，使銷貨收入的面積極大化，比單一定價可賺取更多利潤。依據區隔消費族群的程度，分為「第一級」：廠商知道每個消費者需求，收取消費者最高願付價格，利潤最高。「第二級」：消費者選擇業者制定的價格進行消費，利潤次之（飛機票）。「第三級」：業者直接區分消費者而制定價格，利潤最低（公車票)。根據差別定價內容，下列敘述何者說明正確？
  options:
  - label: A
    content: 差別訂價是為了提高消費者願付價格讓買的人變多
  - label: B
    content: 針對不同的顧客採用相同的價格可賺取更多錢
  - label: C
    content: 所有消費者對任一相同商品的願付價格都相同
  - label: D
    content: 持學生證可以購買便宜的學生票就是差別訂價
