  section: 2
  number: 34
  type: multiple
  page: 5
  stem: <u>阿武</u>欲出售自己珍藏多年的知名韓團簽名海報，因此將此海報放至網路市場上公開競標，最後<u>小陵</u>以價格500元得標，然而在<u>阿武</u>將海報寄出前，其好友<u>大源</u>表示自己願以450元的現金與之購買，<u>阿武</u>便念在兩人多年的交情下，將海報以450元的價格售予<u>大源</u>。有關上述，下列敘述哪些正確？
  options:
