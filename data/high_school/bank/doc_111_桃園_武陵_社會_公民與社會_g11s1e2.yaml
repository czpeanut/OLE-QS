  stem: '請回答依據上題的情況下，生產效率會產生什麼變化？（2分）

    ◎缺蛋危機 缺蛋原因1：去年飼料貴3成、蛋價卻跌谷底，雞農減養埋下蛋荒地雷 雞蛋是臺灣人重要的民生物資，2020年最新統計，雞蛋產量飆上10年新高，年產量81.7億顆，每人一年平均消費347顆蛋。然而，2021年5月中旬臺灣COVID-19疫情爆發，<u>餐廳、夜市、麵包店一夕之間關門，需求降低</u>，促使產地蛋價直跌，已經跌破農民成本，甚至出現「堵蛋」情況，也就是供給大於需求，蛋商不收蛋。2021年9月底，產地蛋價因COVID-19疫情跌到低點每台斤23.5元。經過短短4個月，2022年1月蛋價已經到34.5元，大漲3成，而農曆年前因消費者需求增加，開始出現「蛋荒」。 但2022開年以來的蛋荒卻沒有讓雞農賺大錢，因為過去半年他們早已被高漲的飼料價格重擊。飼料已漲了9次，臺灣的黃豆、玉米9成仰賴進口，在COVID-19疫情影響下，<u>全世界原物料和航運費用大漲</u>，近兩年來，不斷飆升的飼料成本，連帶讓一台斤雞蛋生產成本高達33元。更糟的是，產地蛋價又被農委會要求凍漲在34.5元，產蛋效率較差的農民早就賠錢了。「內外夾擊」─飼料大漲、<u>蛋價下跌</u>，許多農民面對看不見盡頭的疫情，只能減養降低損失。 缺蛋原因2：禽流感疫情嚴重，蛋農不願通報以避全面撲殺 由於雞農在COVID-19疫情影響下減養，等到進入秋冬雞蛋使用旺季，尤其春節前烘焙業需求大增時，卻又因禽流感疫情肆虐，雞農更面臨無雞可養的窘境，讓缺蛋情况雪上加霜。雞蛋產地價格從1月被農委會要求凍漲在每台斤34.5元後，直到缺蛋荒風暴愈演愈烈，農委會才在2月提出「穩定雞蛋生產推動獎勵措施」，預計花費1億元，對雞農補助每台斤雞蛋3元，並補貼蛋中雞每隻生產成本25元。又臨時宣布調整凍漲天花板，隔日雞蛋盤價漲2元到36.5元。'
