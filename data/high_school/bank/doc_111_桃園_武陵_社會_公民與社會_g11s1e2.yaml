  section: 1
  number: 29
  type: single
  page: 4
  stem: 透過文章內容，租屋糾紛與需要注意的權益，下列何者正確
  options:
  - label: A
    content: 房東未經房客同意進入租屋時，可能會觸犯刑法
  - label: B
    content: 房東有直接支配性，帶人看房不須經過房客同意
  - label: C
    content: 房東可與房客簽約時要求與房客交往以折抵房租
  - label: D
    content: 房屋所有權屬於房東，房客不須理會房屋毀損
  group_stem: ◎房客某一天他接獲房東通知，房東竟然把房子賣掉了！新屋主一來便叫房客把行李收拾好，兩天内搬出去。這種情況顯然對租屋者不公平，在多數情況下會選擇租屋的人是較弱勢、難以購置房產的人，而出租房屋的人則是相對有資產，或甚至是擁有多處房產的人。因此《民法》有一個特別規定，指在租賃期間，房東若將房屋出售給第三人，其租賃契約對買受人仍屬有效，也就是說新屋主必須承擔原屋主跟承租人的租賃契約，即買賣不破租賃的制度。 此外，租賃糾紛也常出現在將房屋出租後，房東又擅自以備用鑰匙進入房客租屋處。以不動座的房屋而言，當所有權人將房屋出租後，雖然仍擁有該房屋的所有權，可以進行處分，但所有權中的管理、控制（使用權），將根據《民法》轉移至房客身上，房客擁有使用該房屋的權利。因此，在租約尚未到期之前，所有權人進入租屋處，無論是要帶人看房、進行修繕、拿取物品等，皆須經過房客同意，若未經同意便擅入，恐構成無故入他人住宅罪。房客對於租屋處的使用權也必須依循《民法》善良管理人的規定，一旦房客違反法規，所有權人可向房客請求損害賠償。 租賃糾紛甚至可能發生在房客間，若房客租的是非獨立的套房或雅房，往往就會與房東或其他住戶共享客廳與廚房等公共區域。若大家對公共區域的整潔、物品與食物的所有權，又或是深夜時分高歌的吵鬧等問題，產生不同意見，就很可能發生爭執。
