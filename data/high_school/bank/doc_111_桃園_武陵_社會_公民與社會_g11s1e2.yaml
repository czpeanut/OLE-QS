  stem: 隨著本土新冠肺炎疫情升溫，染疫人數屢創新高，連帶許多民眾也被匡列隔離，除了口罩、酒精等防疫物資及民眾日常所需的民生用品外，「防疫保單」也成為民眾談論的話題。有關我國國內的防疫保單市場，染疫人數創新高，造成鉅額保費理賠，下列哪些是可能的市場變動？
