  stem: 加拿大極端大雨以致馬鈴薯供給大減。由於馬鈴薯在北美是主食，在亞洲不過是點心，故出口商暫緩供應冷凍薯條到亞洲市場。日本國內也生產馬鈴薯，但成本太高，速食店因此祭出薯條限購。臺灣也出現薯條缺貨，店家則推出地瓜薯條因應。前述薯條缺貨的現象可作為以下哪些推論的佐證？
