  stem: 年滿15歲的小虎在飲料店打工，跟老闆約定報酬和工作時間，也得到父母同意，工作愉快。某晚勞工局執行勞動檢查時，發現小虎逾時夜間工作，將老闆移送法辦。此事件涉及勞動法規，下列何者正確？
