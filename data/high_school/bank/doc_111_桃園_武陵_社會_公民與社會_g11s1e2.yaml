  section: 1
  number: 11
  type: single
  page: 2
  stem: 關於死前脫產，有些人會鑽法律漏洞，知道自己即將不久於世，就把財產移轉給配偶或小孩，或是其他第三人，讓債權人無法對遺產求償，也就是所謂的「脫產」，債權人相關權利何者<u>錯誤</u>？
  options:
  - label: A
    content: 債權人可以主張《民法》規定「債務人所為之無償行為，有害及債權者」，合法追討此債務
  - label: B
    content: 《民法》規定繼承人在繼承開始前2年內被繼承人受有財產贈與者，債權人可就該財產求償
  - label: C
    content: 債務人將財產移轉給他人之行為，雙方知道不是單純贈與，債權人可以主張該移轉行為無效
  - label: D
    content: 依《民法》規定，採所謂「概括繼承的有限責任」，對被繼承人的債權人負所有清償責任
