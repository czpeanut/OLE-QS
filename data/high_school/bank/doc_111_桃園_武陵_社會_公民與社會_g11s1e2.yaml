  stem: 甲在網路向乙公司購買球鞋，收到後發現顏色與電腦螢幕顯示不同，故聯絡乙欲退貨退款。乙表示「網站有明顯標示『貨物售出，恕不退貨，僅能依同等價額換貨』」，但甲堅持退貨退錢。關於甲乙間交易的權利義務，下列敘述何者最適切？
  options:
  - label: A
    content: 球鞋顏色與螢幕顯示不同屬貨品瑕疵，甲有權主張的是減少價金
  - label: B
    content: 乙在網站的標示是網路交易的特別約定，故甲不能主張退錢退貨
  - label: C
    content: 甲符合網路交易的退貨規定，可不附理由且無須證明貨品有瑕疵
