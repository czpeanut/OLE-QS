- id: doc_111_桃園_武陵_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 早期繼承的規定是負無限清償責任的概括繼承，也就是繼承權人一旦沒有拋棄繼承，那麼所有被繼承人財產上的權利義務都一併承受。2009年修法後，改採有限清償模式的「限定繼承」，如果被繼承人的債務超過遺產，超過的部分就不由繼承權人承擔。如此雖有利繼承人，避免父債子還的問題，卻也讓債權人的權利受到損害。對此法律上設有哪一項規定，以保障被繼承人的債權人？
  options:
  - label: A
    content: 要求債權人陳報被繼承人的債務清冊
  - label: B
    content: 要求被繼承人生前自行陳報財產清冊
  - label: C
    content: 要求繼承人必定以自己的財產補足被繼承人的債務缺口
  - label: D
    content: 要求繼承人須依法向法院陳報財產清冊以確認遺產債務
  tags:
    unit:
      code: CI-3-1-4
      book: 公民與社會3 選擇與永續
      chapter: 契約自由與財產權保障
      title: 繼承財產規範
      std: true
    textbook: 公民與社會3 選擇與永續 繼承財產規範
    labeled_by: agent
    label_confidence: high
