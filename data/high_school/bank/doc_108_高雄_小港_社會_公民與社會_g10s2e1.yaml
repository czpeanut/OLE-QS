  stem: 白色恐怖時期的臺灣，政府透過《懲治叛亂條例》和《刑法》第一百條，做出監聽、郵件檢查、鼓勵民眾相互檢舉等行為，使得許多人民因為閱讀書籍、探視親友等小事而遭刑求喪失性命。在解嚴後，即便政治情勢已較以往明朗，法律規範也改變了，但仍流傳著「每個臺灣人心中都有個小警總」這句俚語，意味著人民依舊沒辦法擺脫過往警備總部帶來的價值灌輸，因此恐懼涉及政治，轉而追求物質與現實功利。請問對於上述社會控制的描述，那些選項正確？
