  stem: 新德里空氣充滿許多工業廢氣，卻很少有人戴口罩。民眾說：「最便宜的口罩要臺幣38元，而戴上口罩與人社交令人感到尷尬，況且我並不覺得空污有嚴重到需要戴口罩。雖然學校因空污已緊急停課多天了。」為了民眾健康，政府發放了500萬個免費口罩，企業也將口罩送給員工，即便如此，戴口罩的人仍很少。根據上述判斷，下列何者正確？
  options:
  - label: A
    content: 政府發放免費口罩給民眾使用，是以非金錢的負向誘因促使其增加戴口罩的行為
  - label: B
    content: 從不戴口罩的原因可知，政府若調降口罩價格將能使民眾戴口罩
  - label: C
    content: 從新德里的空污狀況可判斷，製造空污的廠商其私人成本大於社會成本
  - label: D
    content: 如果想民眾都戴上口罩，可能要從金錢與非金錢的誘因來促其改變
  answer:
  - D
