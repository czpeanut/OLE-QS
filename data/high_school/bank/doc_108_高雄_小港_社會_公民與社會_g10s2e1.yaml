  section: 1
  number: 30
  type: single
  page: 4
  stem: 依上文所述，貨物稅應如何轉變，其目的才明確？
  options:
  - label: A
    content: 所有貨物均須課徵一致稅，無論是否為奢侈品
  - label: B
    content: 針對貨物所造成的外部性來調整其課徵的稅率
  - label: C
    content: 因課稅不公平，故應廢除貨物稅才算符合目的
  - label: D
    content: 只要是透過市場上買賣的物品皆須課徵貨物稅
  group_stem: 貨物稅一直以來被質疑，是其目的不夠明確。當初課稅的原因，是針對數量易掌握的產品課徵；也有些產品因是奢侈品而被課徵。但現今，有些產品已非奢侈品卻仍繼續課稅，也有近似奢侈品卻未被課稅的。如：電影機要課稅而顯示器不課稅，導致商家不是賣電視機，而是賣顯示器送選臺器，買回去裝在一起就變成免課貨物稅的電視。被課稅的業者當然藉此要求廢除貨物稅。 從國家整體觀之，我國稅收占GDP的比例，已是高所得國家最低，且財政赤字並不低，因此各種稅目都不宜隨便減，貨物稅再不理想，也應用更理想的取代，不是廢除。社會上某行為會使行為人以外之人負擔成本，那麼須對這類行為適度課稅，讓行為人減少此類行為。我國不少貨物稅目恰好具有此功能，但卻很有限，不夠完整。因此可用此高度來規劃貨物稅轉型。外部成本高的產品應加課稅，而稅率明顯高於其外部成本的產品，則逐漸調降稅率，這才是稅改正途。
  answer:
  - B
