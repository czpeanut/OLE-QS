- id: doc_112_新北_新北高中_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: '請閱讀下列資料：

    資料一：這個組織以「實現政治的、經濟的、社會的自由」為目標，以「確立民本政治、建設合理的經濟組織、改廢社會之缺陷」為 3 大綱要。

    資料二：這個組織曾反對政府的諸多措施，以「反對鴉片新特許運動」和「霧社事件殘害原住民」通電國際聯盟，引起國際注意，使當局相當難堪。

    資料三：這個組織的先聲提出新綱領為「特以合法手段擁護無產階級之利益」，所附加之「援助發展農民運動、勞動運動及社會團體」成為新政策。

    請問這個組織最可能是下列何者？'
  options:
  - label: A
    content: 新文化協會
  - label: B
    content: 臺灣農民組合
  - label: C
    content: 臺灣民眾黨
  - label: D
    content: 臺灣地方自治聯盟
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一為(C)臺灣民眾黨的黨綱，為日治時期第一個合法的政黨組織。資料二為這個組織曾經的作為，但從資料三可看出該組織到後期已漸趨激進，於 1931 年為總督府強制解散。
