- id: doc_112_新北_新北高中_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「二二八事件後，行政長官公署改為省政府，派文官魏道明取代陳儀。震懾於軍事威力，很多知識分子不敢涉入政治，由於二二八事件的捕殺，造成臺灣民主政治的一大斷層，不少社會菁英轉而從事工商業，造就臺灣的經濟突飛猛進。一些參與二二八事件者或受難者家屬，因痛恨國民黨而出走海外的香港、日本等國，從事臺獨運動，形成一股海外勢力，美國是臺獨大本營。影響最重大的，則是省籍對立，許多臺灣人將二二八悲劇歸之於外省人的報復，因而在婚姻、就業上排斥外省人，省籍問題深深影響臺灣社會。」二二八事件對臺灣影響深遠，根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 二二八事件後改派文官，臺灣從此展開民主政治
  - label: B
    content: 臺灣戰後經濟快速發展，部分原因與二二八事件的發生有關
  - label: C
    content: 美國是臺獨分子唯一活動地
  - label: D
    content: 至今省籍情結已經完全消失於臺灣社會
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由於國共內戰局勢惡化，不久改派陳誠來臺，1949 年開始進入戒嚴時期。(B)許多社會菁英從此忌憚從政，轉而從事工商業，故為正解。(C)尚有香港、日本等地。(D)迄今臺灣社會仍有省籍情結問題。
