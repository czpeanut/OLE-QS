  type: single
  page: 1
  stem: 林獻堂在臺灣光復慶祝大會擔任主席，開會致辭說道：「我等由今天上午 10 時，日代表安藤利吉簽降完畢時止，經已光復解放，此後同胞務須同心努力來建設理想之新臺灣，同時我等須念及此次勝利，實由於此次抗戰合於正義仁道之理想。對於此次之勝利，除感激我們偉大領袖蔣委員長之德勳外，亦感謝盟軍之仗義執戈，拔刀相助。」請問林獻堂對臺灣光復表達何種看法？
  options:
  - label: A
    content: 滿懷驚喜，應聽從蔣的領導
  - label: B
    content: 苦盡甘來，應澈底驅除日人
  - label: C
    content: 達成理想，應努力維持現狀
  - label: D
    content: 充滿感謝，但仍須努力建設
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 林獻堂的致辭中感謝蔣與盟軍解放臺灣，同時提出「此後同胞務須同心努力來建設理想之新臺灣」，因此答案為(D)。
