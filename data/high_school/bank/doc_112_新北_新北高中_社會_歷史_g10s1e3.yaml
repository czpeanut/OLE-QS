- id: doc_112_新北_新北高中_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 自 1972 年政府推動加速農村建設 9 項措施後，在經費上雖持續增加，但以整個國家經濟成長來看，在農業部門上的預算還是偏低。不只農業公共投資興建不足、農業生產成本不足、農民與非農民所得差距日漸拉大，農產品更常在貿易談判中被當作祭品。在國外農產品不斷湧進之下，政府卻無法提出相對的保護農業政策，遂有 1988 年 5 月 20 日雲林縣農民權益促進會率領南部 10 縣市農民北上示威遊行的舉動，請問下列何者是此次農民運動最主要的訴求？
  options:
  - label: A
    content: 政府應正視臺灣農產品受到全球化衝擊的問題
  - label: B
    content: 政府應協助農民適量生產，並提高收購價格
  - label: C
    content: 政府應解決農產品被財團操縱價格的問題
  - label: D
    content: 政府應該解決農地違建的問題
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '「國外農產品不斷湧進」是因為在經濟自由化、國際化的政策下，臺灣加入一些經濟貿易組織，臺灣精耕細作的農業方式受到國外低價農產品輸入的衝擊，故有 1988 年 5 月 20 日的農民大遊行，此次農民運動的主要訴求應為(A)。

    7.3 則資料的社會運動，分別訴求原住民、無住屋者與農民的權益，因此答案為(A)。(B)臺灣於 1990 年申請，至 2002 年才正式加入，時間與資料不符。(C) 1991 年才終止動員戡亂。(D) 1960 年代臺灣經濟起飛，與資料時間不符。

    8.題文所述為臺灣早期實施「報禁」的現象，管控報紙出版與(A)實施戒嚴有關。

    9.從「美利堅合眾國政府承認中國的立場」、「中美關係正常化」可得知，美國欲與中華人民共和國建交，因此答案為(A)。

    10.從「我們辦雜誌、集結黨外力量」到「公開審判」，可知此事與(D)美麗島事件有關，題文中的「國際局勢逆轉」指美國與中華人民共和國建交。

    11.國際聯盟成立與民族自決的尊重，為第一次世界大戰後(B) 1920 年代的國際大事與風潮。

    12.《舊金山和約》為第二次世界大戰後的對日和約，但由於兩岸分治使「中國」代表有爭議，所以臺灣與中共皆無法出席，中共也因此發出聲明抗議，答案為(B)。(A)第二次世界大戰後並未嚴懲戰敗國，《舊金山和約》未嚴懲日本並非特例。(C)和約中並未規定臺、澎交給中華民國。(D)翌年美國支持日本代表到臺灣另簽訂《中日和約》，顯見國際上後來應支持臺灣歸屬中華民國。

    13.(A)北部於 1860 年代前已開發。(B)南部並未因此而沒落。(C)為正解。(D)法國侵擾北臺灣，非南部。

    14.臺灣煤炭產於基隆一帶，基隆也因此惹來外患戰事，可判斷這場戰爭為(D) 1884 年中法戰爭。(A)英軍曾入侵基隆，但此時二沙灣砲臺才初建，並非德國工程師所設計。(B)戰火未直接涉及臺灣。(C)日軍自琅嶠登陸，環境條件與題文所述不符。

    15.這位「阿罩霧三少爺」甲為林獻堂，建議甲走議會路線自保的乙為梁啟超，因此答案為(B)。

    16.(A)早期政治社會運動由知識分子所領導。(B)此時的知識菁英多在日本留學。(C)為正解。(D)多數臺灣人並不支持共產主義。

    17.歌曲創作與(C)出版有關。

    18.選項中僅(D)城門與孔廟為清代官方建築的遺留。(A)西式建築。(B)日治時期才開始的建築，今日多已改建。(C)多為清代私人建築，非官方建築。

    19.從其認為「協議會員又純屬官選，自不能代表民意」，可推知此團體主張協議會員應由選舉產生，應為臺灣地方自治聯盟，(A)為正解。(B)林獻堂為此團體成員。(C)臺灣人並無選舉權。(D)協議會並不能代表民意。

    20.滬尾於清法戰爭中曾遭到敵軍襲擊，因此「外敵」指的是(B)法國。

    21.資料一提到逐年減少對臺軍售，為 1982 年《八一七公報》；資料二承認臺灣是中國大陸的一部分，為 1972 年的《上海公報》；資料三強調中華人民共和國政府是中國大陸唯一合法政府，為 1978 年的《建交公報》，因此(A)為正確答案。(B)美國意圖聯中制蘇。(C)對臺軍售只是減少，並未停止。(D)臺灣的國際地位大受打擊。

    22.(A)《中美共同防禦條約》於 1954 年簽訂。(B) 1958 年發生金門八二三砲戰。(C)為正解。(D)與史實不符。

    23.從臺日生分開、日籍學生占大多數，可知臺日之間的差別待遇，(B)為正解。(A)(D)中學已有臺日生共學，可知已是內地延長主義時期，非領臺初期的階段。(C)臺日學生仍存在差別待遇。

    24.(A)為正解。(B)荷蘭聯合東印度公司派遣「長官」來臺。(C)東印度公司的職員皆為白人。(D)與史實不符。

    25.從「美軍未爆彈」即可推知故事背景為(D) 1940 年代二戰末期美軍轟炸臺灣之時。

    26.從「繼續推動議會設置請願運動」一句，可推知題文所述的「大逮捕」為 1923 年的(C)治警事件。

    27.1936 ～ 1942 年為日治皇民化運動時期，寺廟減少與神像遭破壞，皆因總督府欲推行神道教信仰之故，因此答案為(D)。

    28.「薙髮結辮」為清朝人民的打扮，鄭經則主張「仿朝鮮稱臣納貢」，代表其不想成為清朝子民，而是成為像朝鮮一般的國家，(B)為正解。

    29.兩則資料皆與金門八二三砲戰有關，(C)為正解。

    30.(D)撤廢《六三法》讓臺灣能與日本本土處於相同的體制，但有反對者認為同化主義會抹煞臺灣的獨特性，將使臺灣更難脫離日本而獨立，因此轉為主張殖民地自治，改以設置臺灣議會為訴求而展開請願運動。

    31.「麥卡錫主義」煽動全美的反共運動，取締共產黨匪諜，形成「紅色恐怖」，影響到臺灣國民政府也強化取締左翼人士，滿街皆能看到「保密防諜」的標語，形成「白色恐怖」，答案為(B)。

    32.這段臺灣俗諺提到火車與「四點五分」，與衛生觀念、工業化、教育體制無關，因此答案為(D)。

    33.從此官員針對臺灣的評論，可知其認為臺灣乃未開發之地，朝廷毋需將之納入中國大陸版圖，因此可推知為施琅攻占臺灣之後，康熙朝廷上的「臺灣棄留之議」，故選(B)。

    34.從「又是臺灣人獨享」、「日本人也應該分些這福氣才是」來看，臺灣民眾黨反對保甲制度的理由為(C)造成臺日之間的差別統治。

    35.1930 年代日本軍國主義氣氛瀰漫，政府當時對人民集會、結社與言論管控更趨嚴格，1931 年總督府開始嚴加取締人民的政治活動，因此許多日漸左傾的社運團體面臨打擊而結束，(D)為正解。

    36.(A)劉銘傳已建成基隆到臺北段，邵友濂則往南興築到新竹。(B)當時的縱貫鐵路南達高雄。(C) 1908 年為無方針主義時期，非皇民化時期。

    37.從「文化啟蒙團體」一句，即可判斷該組織為(A)臺灣文化協會。

    38.(A)皇民化時期，臺灣傳統戲曲遭到禁止，僅能演出皇民劇。(B)為正解。(C)(D)傳統戲曲受到多元文化的尊重，依然大受歡迎，甚至受邀到國外演出。

    39.這些標題顯示臺灣戒嚴時期的民主運動，從抗爭到解嚴、結束動員戡亂時期的經過，因此比較適切且完整的標題為(D)臺灣的民主化進程。

    40.國民政府遷臺後，多次修改(B)《動員戡亂時期臨時條款》，使得總統得連選連任，不受《憲法》約束連任一次的限制。

    41.(A)臺灣經濟起飛為 1960 年代，1970 年代為第二次進口替代期。(B)布袋戲等傳統戲曲表演，對白並非粗俗無文。(C)戲偶間的打鬥與社會善良風俗無關，為推託之詞。(D)為正解。

    42.(A)韓戰爆發後，杜魯門唯恐共產勢力藉此擴張，因此派出第七艦隊協防臺灣海峽，使臺灣國民黨政權轉危為安。

    43.(B)(甲)(丙)(丁)為正確的敘述。(乙)白色恐怖時期的受害者雖以本省人士為多，亦有外省人士受害。

    44.從「在臺內地人實有尊重人種、充分保護本島人生命財產之必要」一句，可知正確答案為(B)。(A)(C)日本應尊重臺灣人。(D)他認為日本不能擔負全亞洲的責任，認為該與中國大陸協力合作才能抵抗歐美。

    45.資料敘述的暴動事件發生於桃園縣，且與投票有關，因此可推知為 1977 年的(B)中壢事件，導火線為選舉舞弊事件。

    46.(A)為正解。(B)(C)當年選舉使黨外士氣大振，民眾對於政治也日趨關注。(D)應是美麗島事件。

    47.從「敬愛的農工無產市民」一句，可推知此時的臺灣文化協會已是 1927 年改組後的「新文協」，其傳單內容訴求農工無產階級的運動，可知其主導的意識型態為(D)社會主義。

    48.(A)應是臺灣民眾黨。(B)雷震主導的是「自由中國」案，與美麗島事件無關。(C)為正解。(D)民主進步黨於 1986 年成立，當時仍是非法政黨。

    49.冷戰期間，美國為防堵共產勢力擴張，因此於聯合國的「中國代表權問題」上力挺臺灣政權，使中共無法進入聯合國。但 1955 年萬隆亞非會議後，中共在第三世界中影響力日大，1960 年代加入聯合國的第三世界國家增多，因此才愈來愈多國家反對擱置案。正確答案為(A)。(B)許多第三世界國家支持中華人民共和國，與美國出兵越南無直接關係。(C) 1971 年後。(D) 1979 年後。

    50.從題文來看，6 位被害日籍教師來臺教學乃配合總督府的「普及日語」政策，此也是芝山岩學堂的教學目標，因此答案為(A)。(B)(C)題文中並未看到普及日語以外的其他教學目標。(D)培養皇民精神為 1930 年代的教學目標。'
