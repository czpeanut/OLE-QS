  stem: 有一個團體的經費來源，主要是靠基金會董事們的捐獻，成員多為中產階級商人、專業技術人員、大學教授等，他們對於產品品質、安全與價格的講求極為重視，多年來採取比較、試驗、調查、申訴、訴訟等方式，處理了許多關於食品衛生、商品標示、價格計算等問題。請問該團體是從事哪一種社會運動？
