  stem: 巴塔哥尼亞高原位於阿根廷南部和一小部分的智利境內，擁有如莫雷諾冰河的酷冷景觀，也有廣大荒蕪的沙漠，亦有麥哲倫企鵝的分布。造成該高原氣溫低於同緯度地區的原因，最可能為下列何者？
  options:
  - label: A
    content: 位於西風背風側
  - label: B
    content: 福克蘭洋流流經
  - label: C
    content: I.T.C.Z 季節性移動
  - label: D
    content: 極圈低壓全年籠罩
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 南美洲巴塔哥尼亞高原屬於溫帶沙漠，乾燥成因為背西風與福克蘭寒流流經。其中福克蘭寒流除了使巴塔哥尼亞沙漠不易對流外，因寒流性質亦使此地氣溫較同緯度地區低，故選(B)。
