  explanation: (D) 1950 年後，美國都市的中心商業區因輕工業、商業活動擴張，使富人生活環境惡化；再加上時遇美國政府積極興建高速公路與快速道路，因此富人多移居至都市外圍的郊區居住，使郊區化快速發展。
