  answer_status: verified
  answer_source: answer_key
  explanation: 陽光帶工業區包含墨西哥灣沿岸的美墨邊境、加州等地的石化、航太、觀光產業，以及與墨西哥合作的勞力密集產業。(C)鋼鐵業為東北部工業帶的主要產業。
