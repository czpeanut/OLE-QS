  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 北美洲北部哈德孫灣為大陸冰河中心，五大湖即冰蝕平原上的冰蝕湖，五大湖向南則依序出現冰磧平原、風積黃土區、河流沖積平原，故選(A)。
