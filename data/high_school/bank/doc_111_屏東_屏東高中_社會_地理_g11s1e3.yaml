  stem: '南美洲介於大西洋及太平洋之間，然而東西兩岸的地形特色差距甚大。請問下表有關該地區東西兩岸地形的特色比較，何者正確？

    |  | (A) | (B) | (C) | (D) |

    | --- | --- | --- | --- | --- |

    | 東岸 | 地勢較高 | 地形崎嶇 | 古老地塊 | 地震頻繁 |

    | 西岸 | 地勢較低 | 地形平坦 | 新褶曲板塊 | 地殼穩定 |'
  options:
  - label: A
    content: 東岸：地勢較高；西岸：地勢較低
  - label: B
    content: 東岸：地形崎嶇；西岸：地形平坦
  - label: C
    content: 東岸：古老地塊；西岸：新褶曲板塊
  - label: D
    content: 東岸：地震頻繁；西岸：地殼穩定
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(D)南美洲西岸為安地斯山脈，為新褶曲高山且位於環太平洋地震帶。東岸則多為古老高原或平原，地殼穩定，故選(C)。
