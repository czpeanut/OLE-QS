  stem: 中國自 2002 年加入世界貿易組織後，東北農民就面臨進口穀物的競爭壓力，其中本地大豆的產地價格經常高於進口大豆的到岸價格，且水分含量較高而出油率較低，因此造成滯銷現象，嚴重影響東北農業發展。請問下列哪國近年大量墾伐森林，闢為耕地，生產大豆外銷到中國等國家？
  options:
  - label: A
    content: 美國
  - label: B
    content: 巴西
  - label: C
    content: 馬來西亞
  - label: D
    content: 波蘭
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 巴西境內亞馬孫雨林區昔日因採礦、開發放牧肉牛區而受破壞，近日則因中美貿易戰，中國轉向美國以外國家收購大豆，因此巴西擴大開發雨林區種植大豆，故選(B)。
