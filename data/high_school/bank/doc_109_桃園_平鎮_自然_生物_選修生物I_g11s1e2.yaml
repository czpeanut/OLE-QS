- id: doc_109_桃園_平鎮_自然_生物_選修生物I_g11s1e2_s3_31
  section: 3
  number: 31
  type: multiple
  page: 3
  stem: 下列有關細胞計畫性死亡與病毒感染的敘述，哪些正確？（多選）
  options:
  - label: A
    content: 是動物防禦機制的一種
  - label: B
    content: 能殺死入侵病毒
  - label: C
    content: 是病毒增殖的策略
  - label: D
    content: 致病性強的病毒易引起細胞進行計劃性死亡
  - label: E
    content: 對病毒具自然選汰的作用
  group_stem: ◎閱讀一 細胞計劃性死亡（Apoptosis），又稱之為細胞自殺作用，是我們對抗病毒感染的重要防禦機制。病毒是絕對細胞內寄生體。病毒一旦侵入細胞，便立刻主導細胞的生化工廠合成本身所需的物質，並複製出大量的子病毒。科學家發現被病毒感染的細胞會在病毒大量增殖前，啟動自殺機制提早結束生命以限制病毒增殖。 細胞計畫性死亡可藉外生反應路徑或者是內生反應路徑達成。在內生路徑中，細胞內的感應分子（如p53蛋白質）會將死亡訊號傳遞至粒線體，最後不僅破壞粒線體也使細胞死亡；而在外生路徑中，細胞膜上的死亡訊號受體被來自細胞外的死亡訊號分子（如TNF蛋白質）活化後，也會啟動細胞自殺反應，不過本反應不經粒線體，而是直接活化細胞質中的酵素以瓦解細胞。外生路徑中的死亡訊號分子的來源有多種，例如當我們的自然殺手細胞發現病毒蹤跡時，就會釋出TNF以促使病毒感染的細胞自殺死亡。無論是外生或內生路徑，最後都是使細胞產生同樣的蛋白酶和核酸酶以崩解細胞的結構及DNA。 由細胞的提早死亡，以致於病毒無法完成其複製作用。病毒為了求生存，必然會與細胞爭奪細胞死亡機制的掌控權。所以說細胞計劃性死亡對病毒產生了選汰壓力。有致病力的病毒通常都能阻止細胞自殺，而且每種病毒都有其獨特的策略。藉由研究病毒抑制細胞自殺的策略，使我們能進一步瞭解細胞計畫性死亡的複雜反應路徑。
