    content: 脂質的代謝
  - label: B
    content: 雄性激素的合成
  - label: C
    content: 肝糖的分解
  - label: D
    content: 卵的製造
  group_stem: ◎閱讀二 內質網為一由膜所圍成的連續性網狀構造。平滑內質網可增加藥物的溶解度，以加速藥物的代謝；小腸絨毛上皮細胞於大量吸收脂肪後，其細胞中的平滑內質網會顯著增加，表示平滑內質網與脂肪的代謝有關；在腎上腺皮質、睪丸的間質細胞及卵巢的黃體細胞中均發現發達的內質網，顯示平滑內質網與固醇類激素的合成關係密切。除外，肝細胞內與肝糖接合在一起的平滑內質網，與肝糖的合成及分解有關。 細胞分泌的蛋白質幾乎都是由附著在粗糙內質網表面的核糖體所製造，如胰島中的β細胞會分泌胰島素至血液中。核糖體製造多肽（由多個胺基酸形成的鏈狀構造）的過程中，多肽會穿過內質網上的小孔進入內質網內部，內質網上有一些特殊分子，可以幫助醣類與蛋白質形成共價鍵，而產生所謂的酶蛋白，其鍵結的酶類通常是寡醣。
