- id: doc_113_新北_新北高中_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 選出所有$\frac{\pi}{5}$弳的同界角？
  options:
  - label: A
    content: $\frac{6\pi}{5}$弳
  - label: B
    content: $-\frac{9\pi}{5}$弳
  - label: C
    content: $\frac{11\pi}{5}$弳
  - label: D
    content: －36°
  - label: E
    content: 324°
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '同界角相差 2π（或 360°）的整數倍

    又$\frac{\pi}{5}$弳＝$\frac{\pi}{5}$．$\left( \frac{180}{\pi} \right) ^{^{\circ}}$＝36°

    (A) ╳：$\frac{6\pi}{5}$－$\frac{\pi}{5}$＝π不為 2π的整數倍

    (B) ○：$-\frac{9\pi}{5}$－$\frac{\pi}{5}$＝－2π

    (C) ○：$\frac{11\pi}{5}$－$\frac{\pi}{5}$＝2π

    (D) ╳：－36°－36°＝－72° 不為 360° 的整數倍

    (E) ╳：324°－36°＝288° 不為 360° 的整數倍

    故選(B)(C)'
