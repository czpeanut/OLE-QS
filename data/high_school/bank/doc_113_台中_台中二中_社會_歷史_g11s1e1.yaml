questions:
- id: doc_113_台中_台中二中_社會_歷史_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 此人被馬克思稱為古代最偉大的思想家、被恩格斯稱為「最博學的人」、被黑格爾稱為「其是從來最多才最淵博的科學天才之一──他是一個在歷史上無與倫比的人」。以上，依你所學判斷，此人最可能是指下列哪一歷史人物？
  options:
  - label: A
    content: 蘇格拉底
  - label: B
    content: 亞里斯多德
  - label: C
    content: 泰利斯
  - label: D
    content: 柏拉圖
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 亞里斯多德影響西方哲學、政治學、科學等多個領域。他涉獵範圍極廣，包括邏輯、倫理、物理、生物、政治等，並奠定了科學方法論，在多個學科都有重大貢獻。
- id: doc_113_台中_台中二中_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 宋仲基在研究基督教時，看到一段文字：「每週的第一天定為『主日』，規定無論是誰都不能在這一天發動軍事進攻，否則就遭到上帝的遺棄，並且成為整個歐洲社會的公敵。此說明基督教化的法律逐漸在歐洲社會推行，一種新的法律思想和法制觀念，也就這樣慢慢形成了。」請問這段文字所敘述的應是指下列何時何地？
  options:
  - label: A
    content: 4 世紀的耶路撒冷
  - label: B
    content: 8 世紀的君士坦丁
  - label: C
    content: 10 世紀的巴黎
  - label: D
    content: 16 世紀的倫敦
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 基督教化的法律思想與法制觀念在歐洲社會形成，最早應是在中古基督教會勢力最盛時期，因此答案為(C)。(A)耶路撒冷位於西亞巴勒斯坦、(B)君士坦丁堡位於東歐，兩者皆不受基督教會的控制。(D)歐洲基督教世界早已形成，16 世紀宗教改革後，羅馬教會在英國勢力已衰。
- id: doc_113_台中_台中二中_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下圖所顯示的是歐洲 600 年的某一種情況，請問根據圖的內容來看，所表達的是下列哪一議題？
  options:
  - label: A
    content: 查理曼大帝的野心
  - label: B
    content: 基督教信仰地區的分布
  - label: C
    content: 羅馬帝國的版圖
  - label: D
    content: 日耳曼蠻族建立王國之區域
