  answer_status: verified
  answer_source: answer_key
  explanation: (A)查理曼並非西元 600 年之君王。(C)西元 600 年羅馬帝國早已不存在。(D)日耳曼蠻族建立的王國並未擴及東歐、西亞與北非。
- id: doc_113_台中_台中二中_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「他」問教宗：「國王不理政事，宮相應該怎麼辦？」當時教宗急需強有力的支持，於是表示「誰為法蘭克操勞，誰就是它的主人」。這個回答正合「他」的心意。而這段對話，也跟梵諦岡的由來有所淵源。請問文中的「他」是指誰？
  options:
  - label: A
    content: 克洛維
  - label: B
    content: 丕平
  - label: C
    content: 查理曼
  - label: D
    content: 鄂圖一世
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知「他」本是一位宮相，受到教宗的默許與支持而成為法蘭克王國的新王，因此為加洛林王朝的創建者丕平。
- id: doc_113_台中_台中二中_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 他們經過四、五百年的涵孕，已經融入歐洲的族群，成為歐洲文明體系的新成分。現在，這一批原來是外族的人群，已是歐洲的主人；他們必須面對新的挑戰者：……保加利亞人、波蘭人……，當然，還有更強悍的阿拉伯人。請問文中所指的「這一批原來是外族的人群」所指的是
  options:
  - label: A
    content: 斯拉夫人
  - label: B
    content: 匈牙利人
  - label: C
    content: 維京人
  - label: D
    content: 日耳曼人
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文判斷，「這一批原來是外族的人群」進入歐洲已經過四、五百年，並且成為歐洲的主人，由其最大的敵人為「強悍的阿拉伯人」可推知時間應為西元 8、9 世紀，此時主宰歐洲的族群為日耳曼人。(A)(B)分布於東歐地區，(C)分布於北歐地區，以上三者皆未曾在中世紀時主宰歐洲大陸。
- id: doc_113_台中_台中二中_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 他們的哲學在本質上屬於科學和唯物的，他們探討物理世界的本質。他們相信，萬物皆可分割成原始物質，從自然現象來探究宇宙構成的原因。請問此論點最早興起於何地？
  options:
  - label: A
    content: 希臘半島
  - label: B
    content: 埃及的亞歷山卓
  - label: C
    content: 小亞細亞
  - label: D
    content: 克里特島
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 最早開始探討萬物的根源的哲學，應是西元前 6 世紀米利都學派的泰利斯，米利都位於小亞細亞的愛奧尼亞地區，為地中海東西貿易交界處，經濟條件優越，文化交流頻繁，因此成為西方哲學的發源地。
- id: doc_113_台中_台中二中_社會_歷史_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 許倬雲先生在其著作《史海巡航》中，以西元 800 年作為歐洲一個斷代的開始。他認為這個時候因為被加冕為「皇帝」而出現的「帝國」，可解釋為第二個歐洲，有別於已被一批一批蠻族入侵衝散的第一個羅馬建立的歐洲秩序。請問其所指的「帝國」應是
  options:
  - label: A
    content: 拜占庭帝國
  - label: B
    content: 查理曼帝國
  - label: C
    content: 神聖羅馬帝國
  - label: D
    content: 查士丁尼帝國
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '西元 800 年被教宗加冕為「羅馬人的皇帝」是法蘭克王國的查理曼，其統一西歐大部分地區，建立查理曼帝國，被視為羅馬帝國正統的延續。

    8.8 月英文 August 發音近似「奧古斯都」，可見是為了紀念曾被元老院奉上「奧古斯都」尊號的屋大維。

    9.14 世紀初的政教衝突代表事件為「亞維農之囚」，教宗被強迫移駐在法國南部的亞維農，從此教宗的廢立全由法王掌控，因此答案為(A)法蘭西。

    10.從對話的臺詞裡，可看出這個城邦實施民主政治，即使一般人民也能有機會擔任公職，最可能為雅典的民主政治，因此答案為(A)。(B)從臺詞的敘述，應該是諷刺而非懷念。(C)文藝復興時期的義大利政治並非民主。(D)中古歐洲自治城市的統治者為新興的中產階級，出生卑賤又目不識丁者不可能有機會擔任公職。

    11.歐洲印刷術起源自日耳曼地區，至 1500 年時，印刷術城鎮已遍布歐洲各地，但明顯可見密度較高的地區，除了日耳曼地區外，當屬義大利中北部地區，當地同時也是文藝復興的重鎮。兩個地區皆鄰近東方而商業經濟發達，故選(B)。(A)此時歐洲各國皆走向君主集權，無法判斷與印刷術的關聯性。(C)此時東方文化輸入有限，對歐洲影響並不明顯。(D)印刷術發達地區為舊教國家，馬丁路德即利用印刷術來傳播新思想，因此無法以印刷術發達與否來論證教會對新思想的打壓。

    12.由「帝國在崛起為中東的陸上霸主」一句，可得知此帝國發源於西亞地區，因此答案為(A)波斯帝國。(B)(C)(D)三者皆為歐洲的帝國。

    13.西元前 5 世紀希臘城邦林立，彼此體制差異甚大，因此哲學家討論的重心逐漸從對自然世界的解釋轉向現實人生與社會的探究。另外，雅典的蘇格拉底開始關注道德、倫理、政治與人類行為等問題，而不是僅僅探討自然界的運行規律，他的思考方式影響後來的柏拉圖和亞里斯多德，奠定西方哲學的人文轉向，故選(B)。

    14.此一史事為波希戰爭，波斯帝國為中央集權政體，橫跨歐亞非三洲的版圖使其志得意滿，意欲往巴爾幹半島進一步擴張。希臘為眾多小城邦所組成的聯軍，實施民主政治的雅典為聯軍的主要領袖，在成功擊敗波斯帝國後，雅典也因此進入黃金盛世時期。(A)東征對象的國家皆為君主國家，不符合「民主與極權之戰」。(B)希臘諸城邦的內戰，雖然雅典與斯巴達符合「民主與極權之戰」，但內戰之後希臘世界衰微，隨即被馬其頓所征服，不符合「黃金盛世的展開」。(D)邁錫尼等諸城邦聯合攻打特洛伊，不符合「民主與極權之戰」。

    15.題文中的「與其說」部分皆是完成句，明確表達說話者的目的與指示；「不如說」部分則是疑問句，顯然是給予受話者思考的空間，而非明確下指令。這樣的說話技巧明顯受到蘇格拉底的產婆法教學方式所影響，用一連串相關的問題去激發學生思考，在不斷的反問與反詰中，使學生不知不覺的修正觀念而接受他的思想影響。

    16.題文所述為 8 ～ 9 世紀拜占庭帝國的「聖像破壞運動」，下令教會不得供奉及崇拜聖像，並焚毀大量宗教圖像與文物。此舉引發東、西方基督徒的反彈，帝國境內因此人民暴動、社會動盪，羅馬教宗也於此時公開表態支持聖像，加深了東、西方教會的裂痕，成為日後 11 世紀教會分裂的遠因，故選(B)。(A)(C)(D)三者皆為 5 世紀的史事，與題文無關。

    17.從詩文來看，詩人自認為身處在一個黑暗的時代，但期待將有「昔日榮光」的光明時代來臨，因此最可能為推崇古希臘羅馬文化的文藝復興時期，人文學者承自中世紀的動亂後，追求嚮往上古的古典文化與精神，答案為(D)。(A)(B)(C)時代的學者，對於過去並沒有明顯的嚮往。

    18.辯士學派認為知識來自個人感官經驗，不同的人對事物的認識可能不同，他們主張沒有普遍適用的真理，只在特定情境下有效，道德來自人為規範，而非天賦或固定不變的標準。(A)主張追求快樂與內心平靜，與知識來源的討論無關。(B)研究宇宙的根本原理，如水、氣、無限，與道德問題無關。(C)亞里斯多德重視邏輯推理與經驗結合，而非單靠感官。

    19.這場曠日持久的戰爭造成嚴重的傷害，更使「城邦的統治基礎搖搖欲墜」，因此可推知為伯羅奔尼撒戰爭，希臘城邦之間的內戰重創長久以來的文明，不久即被北方的馬其頓征服，故選(A)。(B)伯羅奔尼撒戰爭是希臘內戰，與波斯帝國的擴張無關，且波希戰爭的結果，雅典因此進入黃金盛世。(C)小亞細亞的希臘城邦未因此戰而脫離，仍受希臘影響。(D)伯羅奔尼撒戰爭發生在公元前 5 世紀，羅馬共和國衰落則在公元前 1 世紀，與題文的時代不符。

    20.題文所述應是中古時期修道院裡修士的生活狀況，4 世紀初隱修運動在歐洲興起，6 世紀後普遍奉行義大利修士本篤所訂立的「本篤清規」，標舉安貧、貞潔、服從等三大戒律，因此最符合的時地應是(D) 8 世紀的義大利。

    21.《理想國》主張「由明智具有哲學才能與理性的貴族」組成最高階級，選項中僅羅馬皇帝奧里略為斯多噶派哲學的代表，最符合《理想國》的主張。

    22.根據題文所述，這位學者重視「感官經驗」先於「概念」，可推知為亞里斯多德對其老師柏拉圖論點的反駁。亞里斯多德主張透過感官體驗獲得知識，而非柏拉圖的「理念論」，「吾愛吾師，吾更愛真理」表達亞里斯多德雖尊敬老師柏拉圖，但更追求真理，故選(D)。(A)蘇格拉底。(B)刺殺凱撒的布魯圖斯。(C)辯士學派的普羅泰哥拉斯。

    23.(A)保羅積極向非猶太人傳教，因此被稱為「外邦人的使徒」。

    24.從新頒布的主張可知羅馬教宗的權勢大為提升，從教宗「可以回覆或罷免主教」、「可以不經宗教大會就任免主教」來看，其主要目的應是反對君主對教會事務的干涉，羅馬教宗能全權主導教會的人事任命。(A)題文重點在強化教宗權力，而非教會內部的改革。(C) 11 世紀的東西教會大分裂（1054 年）已發生，但這些主張針對的是世俗君主，而非東正教。(D)題文主張確實提升教宗的權威，但其主要目的是對抗世俗君主對教會的干涉，而非單純強調羅馬主教高於其他地區。

    25.「卡諾沙之行」為 11 世紀的俗人授職衝突事件的結果，被逐出教會的神聖羅馬帝國皇帝亨利四世向教宗認罪懺悔，以解決自身的政治危機，故選(D)。

    26.羅馬法律受到斯多噶學派的影響，相信宇宙是理性的展現，人類必須順應自然的規律行事，因此法學家提出以理性為基準的「自然法」作為法律最高原則，故選(C)。

    27.從題文可以看出荷蘭人、英國人與瑞典人相較於義大利人的生活，明顯受到基督教信仰的影響較深，顯見文藝復興在義大利與北區的發展重點並不一致，因此答案為(C)。(A)北方基督教仍受人文主義影響，並非神祕主義。(B)題文中沒有提到義大利文藝復興的衰落原因，只是描述義大利人的開朗性格，與北方人形成對比。(D)文章雖然提到北方人較嚴肅、重視靈魂，但沒有討論修道院的發展。

    28.在第三次布匿克戰爭（B.C.146）擊敗迦太基後，羅馬徹底控制西地中海，成為地中海的霸主。(A)羅馬進入全盛期是在帝國時期（1 ～ 2 世紀），而布匿克戰爭結束時（B.C.146），羅馬仍處於共和時期，尚未進入帝國的黃金時代。(C)羅馬的內戰與凱撒的崛起發生在布匿克戰爭結束約一個世紀之後（B.C.49 ～ 44），與征服迦太基沒有直接關聯。(D)君士坦丁堡是在西元 4 世紀初建立，與布匿克戰爭無關。

    29.資料一追求快樂，尤其是「心靈的寧靜」，因此是希臘化時代出現的伊比鳩魯學派；資料二主張要順服宇宙的規律與命運的安排，才能達到至善，因此是希臘化時代出現的斯多噶學派。正確答案為(D)。

    30.題文所述皆為 6 世紀拜占庭帝國查士丁尼的事蹟，故選(B)。(A)破壞聖像運動發生在 8 ～ 9 世紀，主要是李奧三世發起的，不是查士丁尼的作為。(C) 6 世紀時伊斯蘭教尚未興起，查士丁尼一世不可能抵擋。(D) 325 年由君士坦丁主持，與查士丁尼無關。

    31.「禍根」的英文俚語與蘋果有關係，加上「沒人相信的預言者」，顯見這個故事應與特洛伊戰爭有關，根據「荷馬史詩」的記載，戰爭之初即是三位希臘女神在爭奪一顆金蘋果，後來竟禍延到人間，衍生出一場神人大戰。(A) 14 世紀，薄伽丘的《十日談》，屬於文藝復興時期的小說，與特洛伊戰爭無關。(B) 14 世紀，但丁的《神曲》，講述地獄、煉獄與天堂的旅程，與特洛伊神話無關。(D)希羅多德的作品，記錄波希戰爭和當時的歷史，其撰寫的題材並非來自特洛伊戰爭。

    32.哥德式的建築風格為歐洲中世紀後期的代表，其外觀特徵為尖塔、尖拱與彩繪玻璃窗，單從形狀來看，尖頭長形的玉米棒與哥德式建築特徵最近似，故選(D)。

    33.歐文、傅立葉屬於烏托邦社會主義的代表人物，因此其概念源於(C)《烏托邦》一書。'
