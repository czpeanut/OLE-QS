- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 四位同學分別就其了解的伊斯蘭文化發表意見，請間哪個同學的說法正確？
  options:
  - label: A
    content: 小彬：「蒙兀兒帝國與鄂圖曼帝國的衰弱，皆與統治者採行宗教迫害的政策有關。」
  - label: B
    content: 小青：「穆斯林商人擅於長程貿易，中古時期的貿易路線自亞洲橫跨到非洲，也一併將伊斯蘭信仰傳播到各地。」
  - label: C
    content: 小亞：「13世紀中葉，蒙古西征時攻陷巴格達，伊斯蘭信仰在西亞、中亞地區一度失去影響力。」
  - label: D
    content: 小傑：「哈里發是伊斯蘭宗教及世俗的最高統治者稱號，意為繼承者，即真主阿拉的繼承者。」
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_24
  section: 1
  number: 24
