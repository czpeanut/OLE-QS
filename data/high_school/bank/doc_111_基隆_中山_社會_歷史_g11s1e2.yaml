  stem: 兩位學者談到吉哈德（為落實信仰理念與國家存續的奮鬥，以防衛為前提之下，所採取武力或暴力的方式）。甲學者說：「《古蘭經》提到，應學以致用盡力傳播伊斯蘭教。對於異教徒及偽信者，用自己的口舌來宣傳和反駁，這才是吉哈德。」乙學者說：「奥米亞王朝向來以吉哈德為名，用武力對外擴張帝國疆域，阿拉伯帝國疆域才得以擴大。」關於上述，以下哪個解讀較為合理？
  options:
  - label: A
    content: 甲著眼於導火線因素，乙著眼於背景因素
  - label: B
    content: 甲著眼於《古蘭經》，乙著眼於後世王朝作法
  - label: C
    content: 甲著眼於表層因素，乙則著眼於深層因素
  - label: D
