  section: 1
  number: 16
  type: single
  page: 2
  stem: 「穆斯林只承認世上有一至高無上、無形無像的真主，他們對印度教活潑繽紛的想像力，如神祗有好多手，甚至有動物的頭，一定氣得七竅生煙。」根據上文，穆斯林與印度教徒的差異是：
  options:
  - label: A
    content: 君主集權
  - label: B
    content: 政教合ー
  - label: C
    content: 偶像崇拜
  - label: D
    content: 服飾穿著
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 1774年《解體新書》翻譯出版。這本書的作者杉田玄白等人是在一次觀摩了人體解剖後，將其與荷蘭書籍《解剖學圖譜》一一對比，才發現很多源自東方的醫學理論是不符合實際的。受到巨大衝擊的這些人決定要把荷蘭的醫書翻譯過來，為日本做出一份貢獻。請問有關以上的文字，下列敘述何者正確？
  options:
  - label: A
    content: 此種學問被稱為蘭學
  - label: B
    content: 當時引進的學間，僅有醫學
  - label: C
    content: 荷蘭人是受到日本幕府的邀請，進入政府傳播知識
  - label: D
    content: 當時的日本人非常排斥荷蘭人帶來的學識
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 部分英國人主張革除印度社會的陋習，如廢除種姓制度、允許寡婦嫁人及傳播基督教等，他們認為這些「文明的行為」可以糾正印度社會的「蒙昧落後」，加速印度的現代化。這些英國人可以被歸類為下列何者？
  options:
  - label: A
    content: 保守主義的反對者
  - label: B
    content: 帝國主義的反對者
  - label: C
    content: 社會達爾文主義的支持者
  - label: D
    content: 社會主義的支持者
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 16世紀，屬克里奧人階級的墨西哥詩人德拉薩，寫下一首詩表達心中的不滿：「西班牙，你對那些新來乍到的人，是仁慈的母親，而待我們卻像刻薄的後母。你慷慨賜予他們珍寶，留給我們的卻是困苦和惆悵。」請問詩中「那些新來乍到的人」，是指社會上的哪一階級？
  options:
  - label: A
    content: 半島人
  - label: B
    content: 克里奥人
  - label: C
    content: 西非黑人
  - label: D
    content: 麥士蒂索人
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 英國曾經被稱為日不落帝國，也就是在海外擁有非常多的殖民地，綜觀英國殖民史的發展，下列敘述何者正確？
  options:
  - label: A
    content: 英國是歐洲最早開始海外探險的國家
  - label: B
    content: 成立東印度公司來負責海外貿易
  - label: C
    content: 17世紀後期英國通過航海法，牽制西班牙
  - label: D
    content: 在七年戰爭中擊敗荷蘭，確立了英國在海上發展的地位
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 塞希爾‧羅德斯因為南非的鑽石礦而變得富有，之後投入政壇，積極倡導從開羅到好望角的2C鐵路計畫（即「非洲縱貫計畫」）。羅德期最可能是哪一國人？
  options:
  - label: A
    content: 英國
  - label: B
    content: 法國
  - label: C
    content: 德國
  - label: D
    content: 比利時
