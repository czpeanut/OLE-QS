- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s2_53
  section: 2
  number: 53
  type: calc
  page: 5
  stem: '「教宗當下被咖啡的特殊醇香所吸引，立刻決定信徒們可以喝此飲」，依課堂所學，十七世紀的教宗是否還擁有號令全歐的權力？請任舉一個國家或地區，說明教宗權力於該國家的影響力（非選擇題，50字内）

    ※請閱讀下列資料後回答問題：

    西元七世紀中葉起，將近一百年內，阿拉伯人勢力版圖擴張取得驚人的成果，穆斯林征服了大部分的古羅馬世界，甚至整個古波斯帝國。學者嘗試剖析背後的驅策動力以及特殊的環境形勢，發現了幾個重要的事實。首先，伊斯蘭教早期擴張跟宗教聖戰並沒有直接關聯，因為阿拉伯征服者並沒有強迫其他民族改信阿拉，而且由於阿拉伯人所徵收的稅額，相較原來統治的拜占庭人和波斯人低，穆斯林的征服行動其實是大受人民愛戴的，尤其是拜占庭帝國統治下的敘利亞和埃及（異端的基督教徒）。但是，信眾聽從哈里發的指示，凝聚了阿拉伯人的士氣和信心，也帶領阿拉伯軍隊跨出原來的半島邊界，產生一種「替天行道」的宗教狂熱感。其次，對戰利品和新財富的企盼，也促使阿拉伯人離開沙漠，且愈走愈遠。比較特別的是，穆斯林向外擴展的時候，剛好兩個主要的競爭對手─拜占庭和波斯，由於彼此間長期的兵戎相見，國力嚴重耗損，根本無法抵禦穆斯林這股新興勢力，伊斯蘭教也因此迅速奠立基礎。

    資料出處：改寫自PhilipLeeRalph等著、文從蘇等譯，《世界文明史（前篇）：從史前時代到前近代》（臺北：五南，2009），頁311'
