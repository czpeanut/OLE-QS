  stem: 根據資料描述，咖啡應是在下列哪一時代傳入歐洲？
  options:
  - label: A
    content: 歐洲上古時期希臘哲學發展
  - label: B
    content: 歐洲中古初期蠻族爭搶地盤
  - label: C
    content: 歐洲近代發展至大航海時代
  - label: D
    content: 歐洲現代發展物聯網的時代
  group_stem: 十七世紀初，咖啡由威尼斯商人引進至歐洲時，受到宗教人士的嚴厲批判。何以如此？因咖啡當時已經是伊斯蘭信徒的常見飲品，宗教人士認為是因為伊斯蘭信徒不能喝基督信仰的聖飲（葡萄酒，伊斯蘭教規禁止飲酒)，所以魔鬼（撒旦）就讓他們喝咖啡。簡而言之，基督信仰者不應該喝「魔鬼」的飲品─也就是咖啡。至於是否要禁止咖啡傳入歐洲？自然是由基督信仰的最高教長─教宗─來定奪。據說當時威尼斯商人準備了幾款咖啡給教宗品嚐，教宗當下被咖啡的特殊醇香所吸引，立刻決定信徒們可以喝此飲品。半個世紀後，無論是在英國，抑或荷蘭各地，都出現了專賣咖啡的餐館，咖啡已成為歐美大眾文化的一部分，直到今日，咖啡文化也持續不斷地擴展到世界各地。 資料出處：改寫自湯姆·斯丹迪奇著、吳平等譯，《歷史六瓶裝啤酒、葡萄酒、烈酒、咖啡、茶與可口可樂的文明史》(臺北：聯經，2006年），頁135～136
