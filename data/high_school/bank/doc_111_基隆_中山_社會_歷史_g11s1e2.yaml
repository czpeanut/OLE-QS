questions:
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 柏林西非會議中，確定了瓜分「黑暗大陸」的原則。在這個原則之下，短短幾年的時間，比歐洲面積更大的非洲，就被歐洲列強瓜分殆盡。講問這項原則，應是下列何者？
  options:
  - label: A
    content: 正統原則
  - label: B
    content: 補償原則
  - label: C
    content: 民族自決原則
  - label: D
    content: 有效占領原則
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「1602年，荷蘭東印度公司成立，擁有荷蘭當局所給予對東方貿易的特權。該公司曾以印尼為據點，經營南洋、東亞貿易將近二百年。」上述内容最適合用來說明下列何者？
  options:
  - label: A
    content: 海外拓殖的發展
  - label: B
    content: 法國大革命的影響
  - label: C
    content: 伊斯蘭世界的擴張
  - label: D
    content: 西歐封建制度的形成
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「這些儀式為信徒們提供了一種特別強有力的社會紐帶。他們一起祈禱、齋戒，一起為不太幸運的弟兄們承擔責任：富人和窮人、黃種人、白種人一起去朝覲。其信仰還對虔誠信眾生活的各個方面，如風俗和衛生、結婚和離婚、商業和政治、犯罪及懲罰、和平與戰爭等皆予以指導。」請問上述這種情形，可能發生在何時何地？
  options:
  - label: A
    content: 8世紀中的麥加
  - label: B
    content: 9世紀末的羅馬
  - label: C
    content: 10世紀初的君士坦丁堡
  - label: D
    content: 11世紀末的威尼新
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 伊斯蘭曆的12月稱為巡禮月，每年都有超過2百萬人聚集在麥加，由繞行7次卡巴天房揭開活動序幕，藉此聚集人群，産生「伊期蘭一體」的歸屬意識。請問上述内容與五功中的何者有關？
  options:
  - label: A
    content: 禮功
  - label: B
    content: 齋功
  - label: C
    content: 課功
  - label: D
    content: 朝功
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 當時，某國勢力強盛，其國王統治的領土包括部分西歐、南歐與中歐，還擁有横跨兩大洋的廣闊殖民地，甚至奪取太平洋西岸島鏈中的一些島嶼，因此被譽為「16世紀的日不落國」。它從殖民地攫取大量的金、銀，一度成為歐洲首富之國。這個國家為何？
  options:
  - label: A
    content: 法國
  - label: B
    content: 葡萄牙
  - label: C
    content: 英格蘭
  - label: D
    content: 西班牙
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有關大航海時代西方殖民者在臺灣與中南美洲的統治，下列敘述何者正確？
  options:
  - label: A
    content: 皆征服當地古老的王國
  - label: B
    content: 皆積極發展毛皮貿易
  - label: C
    content: 皆帶入疾病導致原住民大量死亡
  - label: D
    content: 都有引進外來勞動力開發殖民地
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 16世紀開始，「某國」崛起，並不斷派宣教師前往鄰近的鄂圖曼帝國傳播什葉派的主張，甚至在安那托利亞中西部引發大規模叛亂，直接威脅鄂圖曼帝國的統治，致使鄂圖曼帝國開始對什葉派進行鎮壓，以強化自身的統治。請問上文中的「某國」應為下列何者？
  options:
  - label: A
    content: 蒙兀兒帝國
  - label: B
    content: 薩法維帝國
  - label: C
    content: 帖木兒帝國
  - label: D
    content: 神聖羅馬帝國
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「天花、麻疹和流行性感冒等疾病首次隨歐洲征服者傳達至此，在第一波天花疫情，至少半數的墨西哥與秘魯原住民病死，無力抵抗歐洲人的攻略。征服這些地區『神奇的勝利』主要是病毒的勝利，所以病毒是新世界真正的征服者。」上文所述該地區原住民發生的情況，最可能與下列何者有密切關係？
  options:
  - label: A
    content: 西班牙人入侵美洲時所造成的傷害
  - label: B
    content: 葡萄牙派遣達伽馬海外拓展的手段
  - label: C
    content: 英國人殖民北美洲時導致的變動
  - label: D
    content: 法國發布《人權宣言》的時代背景
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在印度蒙兀兒帝國時期，○○推行宗教寛容政策，鼓動印、回通婚，自己並娶印度公主為妻，以促進不同民族的和諧相處，還選用優秀的印度教徒擔任高級官員，使社會安定，成為印度史上的盛世。請問○○應是下列哪一位？
  options:
  - label: A
    content: 帖木兒
  - label: B
    content: 阿克巴
  - label: C
    content: 巴卑爾
  - label: D
    content: 奥朗吉布
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 1258年，一支凶猛的軍隊攻克伊斯蘭帝國的首都巴格達。哈里發被裹進地毯後遭士兵縱馬踏死，昔日繁華的帝國幾乎成了廢墟。請問攻克巴格達的軍隊是下列何者？
  options:
  - label: A
    content: 十字軍
  - label: B
    content: 蒙古人
  - label: C
    content: 塞爾柱突厥人
  - label: D
    content: 鄂圖曼突厥人
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 19世紀以來，西方各國競相擴張海外勢力，爭奪殖民地，使列強間的外交關係更為緊張，讓20世紀的國際局勢陷入難以化解的對立，進而導致第一次世界大戰的爆發。請問根據上述內容，促使一次大戰爆發的主因為何？
  options:
  - label: A
    content: 歐洲列強相互結盟，使對立的關係愈演愈烈
  - label: B
    content: 各國因意識形態不同而分裂，彼此互相較勁
  - label: C
    content: 過度姑息養奸，導致獨裁者坐大並向外擴張
  - label: D
    content: 各地的反殖民運動風起雲湧，激化國際衝突
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 1898年美國戰艦緬因號在哈瓦那被炸沉，《新聞報》在未作任何調查的情況下斷言是「某國」所為，並在報紙上公開懸賞5萬美金徵求犯罪證據：此舉引起各報效仿，美國國内人聲沸騰，要求政府對「某國」宣戰。戰後美國取得波多黎各、關島和菲律賓。請問「某國」是哪一個國家？
  options:
  - label: A
    content: 西班牙
  - label: B
    content: 葡萄牙
  - label: C
    content: 英國
  - label: D
    content: 法國
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 西方史家稱都爾戰役（732年）是改變歐洲命運的戰役，他們說：「倘若阿拉伯人在這一戰役中獲勝，那麼今天我們在巴黎和倫敦看到的都是清真寺，而不是這些大教堂：我們在牛津和其他學術中心聽到的，會是《古蘭經》而不是《聖經》的闡述。」請問此戰功是指法蘭克人成功抵擋下列何者對歐洲的侵略？
  options:
  - label: A
    content: 鄂圖曼帝國
  - label: B
    content: 阿拔斯王朝
  - label: C
    content: 奥米亞王朝
  - label: D
    content: 塞爾柱蘇丹國
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 美洲原住民用毛皮製品交換歐洲殖民者帶來的馬匹與武器，戰鬥力如虎添翼。此外，隨著殖民者人數不斷增加，侵犯到美洲原住民的領地，雙方的火拼因而更加激烈。上述資料的主旨為何？
  options:
  - label: A
    content: 美洲原住民西化的過程
  - label: B
    content: 馬匹與武器加速美洲原住民的滅亡
  - label: C
    content: 美洲原住民戰爭型態與規模的改變
  - label: D
    content: 歐洲人引進的物產改變了美洲原住民的游牧型態
- id: doc_111_基隆_中山_社會_歷史_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 附圖是元帝國與四大汗國的分布圖。請問哪兩個國家最可能改信伊斯蘭教？
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 乙丙
