  group_stem: '下列文章改寫自Care Online照護線上《多囊腎不治療10年就洗腎？治療、照護關鍵醫師圖文解說》，請閱讀以下文章並回答問題。

    <u>臺灣</u>洗腎患者數量驚人，根據健康保險署最新統計，已超過9.2萬人，因此<u>臺灣</u>被稱為「洗腎王國」。然而，約有10％的洗腎患者實際上是患有自體顯性多囊性腎臟病（ADPKD）這種遺傳性疾病，導致腎功能急劇下降而需要接受洗腎治療。

    ADPKD，簡稱「多囊腎」，過去無法直接治療，患者只能多喝水以減少抗利尿激素分泌，或者通過控制血壓和飲食減緩併發症的影響。然而，現在有口服藥物可以直接抑制抗利尿激素的分泌，穩定用藥可以有效抑制水泡的生長，有望幫助患者延緩腎功能的惡化，打破了50歲就需要接受洗腎治療的預期。

    多囊腎患者的腎小管「？」發生蛋白質變異，導致正常的腎臟組織被充滿水分且無法正常運作的囊腫取代，腎功能急劇下降，腎臟體積增大，損害正常腎實質，最終導致腎功能衰退。

    早期治療多囊腎對於保存腎功能至關重要，多囊腎患者現在可以使用口服藥物來延緩水泡擴大和多囊腎惡化的速度，因此，如果出現不明原因的高血壓、血尿、或腎結石，應儘早接受相關檢查。早期治療可以使洗腎治療的時間延長7年或以上。了解多囊腎並積極採取預防措施對於保護腎功能至關重要。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
