    維生素$B_{12}$是一種重要的營養素，它的吸收過程相當複雜，並且受到年齡的影響。胃、胰臟和小腸是參與維生素$B_{12}$吸收的器官。大約有50％的維生素$B_{12}$來自食物，它與食物蛋白質結合，經攝食後到達胃部。在胃部，胃液和胃蛋白酶幫助釋放維生素$B_{12}$並與胃中的R蛋白（haptocorrin）結合，形成$B_{12}$-haptocorrin複合物，再一起運送到小腸，在小腸中，R蛋白被分解，釋放維生素$B_{12}$，然後與胃壁細胞所分泌的內在因子（intrinsic factor , IF）結合。內在因子和維生素$B_{12}$的複合物被迴腸黏膜細胞的受體辨識後吸收，並進入血液循環，整個過程需要約3到4小時。

    被吸收的維生素$B_{12}$由血漿鍵結蛋白－轉鈷胺（transcobalamin , TC）運輸，其中約80％由轉鈷胺素II（TC-II）運輸，它將維生素$B_{12}$運送到各組織中。肝臟可以吸收約50％的維生素$B_{12}$，其餘部分被轉運到其他組織。健康成年人的肝臟平均每克含有約1µg的維生素$B_{12}$，總體來看，成人的平均維生素$B_{12}$含量約在0.6至3.9 mg之間。

    如果缺乏內在因子，就無法吸收維生素$B_{12}$，而如果維生素$B_{12}$被排泄到糞便中，它就無法再循環。因此，缺乏內在因子的人比素食者或攝取不足的人更容易出現$B_{12}$缺乏症狀，這可能導致神經損傷和貧血等嚴重後果。在攝取大量維生素$B_{12}$時，多餘的維生素$B_{12}$會從尿液排出，但通常只有在注射大量維生素$B_{12}$時才會發生這種情況。此外，過多的維生素$B_{12}$也可能排泄到糞便中，主要來自未被吸收的食物部分、膽汁中的維生素$B_{12}$、細胞剝落、腸胃道分泌、腸道細菌合成的維生 素$B_{12}$以及其他流失方式。研究表明，每天排泄的維生素$B_{12}$約佔總體含量的0.1至0.2％，而惡性貧血患者可能排泄0.2％的維生素$B_{12}$。'
  answer:
  - A
