    ∵f(1)＝2，f''(1)＝3，f''（x）＝2ax－5

    ∴$\begin{cases}a - 5 +b = 2 \\ 2a - 5 = 3\end{cases}\Rightarrow\begin{cases}a = 4 \\ b = 3\end{cases}$

    故 a＋b＋c＋m＝4＋3＋2＋3＝12'
