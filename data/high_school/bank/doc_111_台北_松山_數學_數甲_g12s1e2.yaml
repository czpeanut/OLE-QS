- id: doc_111_台北_松山_數學_數甲_g12s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些函數在 x＝0 處可微分？
  options:
  - label: A
    content: $f_{1}$（x）＝∣x∣
  - label: B
    content: $f_{2}$（x）＝x∣x∣
  - label: C
    content: $f_{3}$（x）＝$\sqrt{x}$
  - label: D
    content: $f_{4}$（x）＝x [ x ]（[ ] 為高斯符號）
  - label: E
    content: $f_{5}$（x）＝$\sqrt{1-x^{2}}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\lim_{x \rightarrow 0^{+}} \frac{f_{1} ( x )-f_{1} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{| x |}{x}$＝$\lim_{x \rightarrow 0^{+}} \frac{x}{x}$＝1

    $\lim_{x \rightarrow 0^{-}} \frac{f_{1} ( x )-f_{1} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{| x |}{x}$＝$\lim_{x \rightarrow 0^{-}} \frac{-x}{x}$＝－1

    ∵$\lim_{x \rightarrow 0^{+}} \frac{f_{1} ( x )-f_{1} ( 0 )}{x - 0}$≠$\lim_{x \rightarrow 0^{-}} \frac{f_{1} ( x )-f_{1} ( 0 )}{x - 0}$

    ∴$f_{1}$（x）在 x＝0 處不可微分

    (B)○：$\lim_{x \rightarrow 0^{+}} \frac{f_{2} ( x )-f_{2} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{x | x |}{x}$＝$\lim_{x \rightarrow 0^{+}} \frac{x^{2}}{x}$＝0

    $\lim_{x \rightarrow 0^{-}} \frac{f_{2} ( x )-f_{2} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{x | x |}{x}$＝$\lim_{x \rightarrow 0^{-}} \frac{-x^{2}}{x}$＝0

    ∵$\lim_{x \rightarrow 0^{+}} \frac{f_{2} ( x )-f_{2} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{f_{2} ( x )-f_{2} ( 0 )}{x - 0}$

    ∴$f_{2}$（x）在 x＝0 處可微分

    (C)╳：$\lim_{x \rightarrow 0} \frac{f_{3} ( x )-f_{3} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0} \frac{\sqrt{x}}{x}$＝$\lim_{x \rightarrow 0} \frac{1}{\sqrt{x}}$不存在

    $\Rightarrowf_{3}$（x）在 x＝0 處不可微分

    (D)╳：$\lim_{x \rightarrow 0^{+}} \frac{f_{4} ( x )-f_{4} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{+}} \frac{x [ x ]}{x}$＝$\lim_{x \rightarrow 0^{+}} \frac{0}{x}$＝0

    $\lim_{x \rightarrow 0^{-}} \frac{f_{4} ( x )-f_{4} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0^{-}} \frac{x [ x ]}{x}$＝$\lim_{x \rightarrow 0^{-}} \frac{-x}{x}$＝－1

    ∵$\lim_{x \rightarrow 0^{+}} \frac{f_{4} ( x )-f_{4} ( 0 )}{x - 0}$≠$\lim_{x \rightarrow 0^{-}} \frac{f_{4} ( x )-f_{4} ( 0 )}{x - 0}$

    ∴$f_{4}$（x）在 x＝0 處不可微分

    (E)○：$\lim_{x \rightarrow 0} \frac{f_{5} ( x )-f_{5} ( 0 )}{x - 0}$＝$\lim_{x \rightarrow 0} \frac{\sqrt{1-x^{2}} - 1}{x}$

    ＝$\lim_{x \rightarrow 0} \left( \frac{\sqrt{1-x^{2}} - 1}{x}\times \frac{\sqrt{1-x^{2}} + 1}{\sqrt{1-x^{2}} + 1} \right)$

    ＝$\lim_{x \rightarrow 0} \frac{-x^{2}}{x ( \sqrt{1-x^{2}} + 1 )}$＝$\lim_{x \rightarrow 0} \frac{-x}{\sqrt{1-x^{2}} + 1}$＝0

    $\Rightarrowf_{5}$（x）在 x＝0 處可微分

    故選(B)(E)'
