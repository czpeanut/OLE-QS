- id: doc_111_台北_松山_數學_數甲_g12s1e2_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 'f（x）為一實係數多項式函數，滿足 f（x）＋$2\int_{0}^{1} f ( x )dx$－$2x^{3}$－$6x^{2}$＋4＝0，試求：

    (1) f（x）＝＿＿＿＿。

    (2) 若 f（x）在 x＝－1 附近的一次近似為 y＝ax＋b，則數對（a，b）＝＿＿＿＿。'
  answer:
  - (1) $2x^{3}$＋$6x^{2}$－3；(2) （－6，－5）
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 令 a＝$\int_{0}^{1} f ( x )dx$，則 f（x）＋2a－$2x^{3}$－$6x^{2}$＋4＝0

    兩邊積分得

    $\int_{0}^{1} ( f ( x )+ 2a - 2x^{3}- 6x^{2}+ 4 )dx$＝$\int_{0}^{1} 0dx$＝0

    $\Rightarrow\int_{0}^{1} f ( x )dx$＋$\left. \left( 2ax - \frac{1}{2}x^{4}- 2x^{3}+ 4x \right) \right| _{0}^{1}$＝0

    $\Rightarrow$a＋2a－$\frac{1}{2}$－2＋4＝0$\Rightarrow$3a＝$-\frac{3}{2}\Rightarrow$a＝$-\frac{1}{2}$

    代回原式得 f（x）＋2×$\left( -\frac{1}{2} \right)$－$2x^{3}$－$6x^{2}$＋4＝0

    $\Rightarrow$f（x）＝$2x^{3}$＋$6x^{2}$－3

    (2) f''（x）＝$6x^{2}$＋12x

    f''（－1）＝－6，f（－1）＝1，即 y＝f（x）的圖形過（－1，1）

    故在 x＝－1 附近的一次近似為 y＝－6x－5

    $\Rightarrow$數對（a，b）＝（－6，－5）'
