- id: doc_111_台北_松山_數學_數甲_g12s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設函數 y＝f（x）＝$x^{2}$ 與 y＝0、x＝1 及 x＝2 所圍的區域為 R。將區間 [ 1，2 ] 等分為 n 等分，區域 R 的下和為 $L_{n}$，上和為 $U_{n}$，請選出正確選項。
  options:
  - label: A
    content: $L_{2}$＝$\frac{13}{8}$
  - label: B
    content: $U_{4}$＝$\frac{43}{32}$
  - label: C
    content: $U_{32}\leqU_{64}$
  - label: D
    content: $L_{18}\geqL_{36}$
  - label: E
    content: 區域 R 面積為$\frac{7}{3}$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$U_{n}$＝$\sum_{k =1}^{n} \left( \frac{1}{n} \right) \left( 1 +\frac{k}{n} \right) ^{2}$，$L_{n}$＝$\sum_{k = 0}^{n -1} \left( \frac{1}{n} \right) \left( 1 +\frac{k}{n} \right) ^{2}$

    (A)○：$L_{2}$＝$\sum_{k = 0}^{1} \left( \frac{1}{2} \right) \left( 1 +\frac{k}{2} \right) ^{2}$＝$\frac{1}{2} \left[ 1^{2}+ \left( \frac{3}{2} \right) ^{2} \right]$＝$\frac{1}{2}$×$\frac{13}{4}$＝$\frac{13}{8}$

    (B)╳：$U_{4}$＝$\sum_{k = 1}^{4} \left( \frac{1}{4} \right) \left( 1 +\frac{k}{4} \right) ^{2}$＝$\frac{1}{4} \left[ \left( \frac{5}{4} \right) ^{2}+ \left( \frac{6}{4} \right) ^{2}+ \left( \frac{7}{4} \right) ^{2}+ \left( \frac{8}{4} \right) ^{2} \right]$＝$\frac{1}{4}$×$\frac{174}{16}$＝$\frac{87}{32}$

    (C)╳：∵n 愈大，$U_{n}$ 愈小

    ∴$U_{32}\geqU_{64}$

    (D)╳：∵n 愈大，$L_{n}$ 愈大

    ∴$L_{18}\leqL_{36}$

    (E)○：區域 R 的面積為$\lim_{n \rightarrow \infty} U_{n}$＝$\int_{1}^{2} x^{2}dx$＝$\left. \frac{1}{3}x^{3} \right| _{1}^{2}$＝$\frac{8}{3}$－$\frac{1}{3}$＝$\frac{7}{3}$

    故選(A)(E)'
