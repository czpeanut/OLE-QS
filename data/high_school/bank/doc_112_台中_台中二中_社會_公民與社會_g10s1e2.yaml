- id: doc_112_台中_台中二中_社會_公民與社會_g10s1e2_s3_42
  section: 3
  number: 42
  type: single
  page: 11
  stem: 我國關於外籍勞工的權利保障問題，下列敘述何者較為適切？
  options:
  - label: A
    content: 憲法保障國民基本人權，故非本國國民不得享有
  - label: B
    content: 外籍勞工不具我國公民身分，但仍享有基本人權
  - label: C
    content: 我國制定公約施行法，應落實《經社文公約》的施行
  - label: D
    content: 外籍勞工的權利保障應該依據其母國的法律規定
  group_stem: '據報導，我國受少子化、高齡化影響，照護產業嚴重缺工，長照人力供不應求。<u>然而從事照護的外籍移工卻不在我國《勞動基準法》的適用範圍內，沒有休假及基本薪資的保障，有違國際公約規定。</u>因此，在嚴重缺工及缺乏相對福利保障的情況下，外籍移工多選擇赴日、韓工作，而此舉更讓缺工問題陷入惡性循環。

    除了《勞基法》問題之外，臺灣二十幾年來外籍移工遭仲介剝削也是造成缺工的因素之一。通常外籍移工欲至我國工作，須收取一筆仲介費，若以越南為例，通常仲介費約莫 18 萬元新臺幣左右，且移工到臺灣後每月還要繳交仲介服務費，三年約要繳 6 萬元新臺幣，而該筆仲介費間接造成移工赴臺的成本上升，使得部分移工寧願在本國工作也不願出國。

    為解決上述問題，部分勞工團體宣布發起「模擬移工公投」，主張國家制定的政策以及法律規範的不只是具有「公民」身分的人，而是影響所有在國家內生活、勞動的人。勞工團體表示：移工對自身相關的政策制定上，卻沒有參與的權利。是否為公民不應該成為享有權利的框架，尤其在與移工息息相關的政策，他們應該享有參與、發表看法的權利，只要移工能有效參與公共政策討論，不受勞動法規保障的情形將有機會解決。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)題文中敘及，勞工團體主張國家制定的政策及法律規範的不只是具有「公民」身分的人，即使外籍移工並非本國籍，不具有公民參政權利，但對於基本人權的保障應不分國籍。
