  stem: 2022 年 11 月，美國期中選舉結果抵定，共和黨以些微優勢取得眾議院控制權，參議院掌控權則由總統拜登所屬的民主黨守住。關於美國政府體制中行政權與立法權的敘述，下列何者正確？
  options:
  - label: A
    content: 行政官員可以直接提出法律草案交由議會表決
  - label: B
    content: 當行政與立法權分立時能以不信任案解決爭端
  - label: C
    content: 總統提出覆議案使法案失效的機率仍高
  - label: D
    content: 總統仍可以直接任命同黨者擔任國務卿
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 美國體制上為總統制，行政與立法權分立、相互制衡。對於國會提出的法案，行政機關認為窒礙難行時，可由總統提出覆議案，國會須有 2∕3 的絕對多數再行通過。(A)若行政官員想提出修法的草案，需仰賴同黨籍的國會議員提出。(B)不信任案的制度存在於內閣制。(D)國務卿的職權等同外交部長，其任命方式由總統在參議院的建議和同意下任命。
