  stem: 今年 9 月巴西進口雞蛋議題在國內延燒，迫於輿論壓力及立委質疑，農業部部長陳吉仲遂召開記者會鞠躬道歉並釐清進口雞蛋爭議，強調「絕對不會戀棧，也不會迴避責任」，當晚便透過臉書發文表示已向行政院院長請辭獲准。關於本案網友意見兩極，請問下列何位網友的評論較符合憲政民主精神？
  options:
  - label: A
    content: 佑鈞：進口巴西雞蛋的爭議多，部長本應下臺負起法律責任
  - label: B
    content: 蕙晴：官員施政受輿論監督及譴責，是負起政治責任的表現
  - label: C
    content: 安琪：輿論沸騰下，負責相關業務之官員受人身攻擊被罵活該
  - label: D
    content: 馨妤：民主治理強調從上到下的統治，人民有權對其課予責任
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 憲法主義主張透過憲法來規範政府權力行使範圍、限制政府權力。政府依憲法行使有限權力，並負起相應的責任，以達權責相符；人民的基本權利受憲法保障，並不受政府非法的侵犯。(A)部長下臺應是負政治責任。(C)即使人民具有言論自由，但對於官員的監督不應以人身攻擊來進行。(D)民主治理強調彼此為互動合作的夥伴關係。
