  stem: 我國主權所及範圍乃依據《憲法》第 4 條「依其固有之疆域」及《憲法增修條文》第 11 條「大陸地區、自由地區」之規定。關於我國主權在憲法上之爭議，下列敘述何者正確？
  options:
  - label: A
    content: 大陸地區為我國事實主權行使的地區
  - label: B
    content: 「依其固有之疆域」是屬於列舉規定
  - label: C
    content: 大法官解釋認為領土應該讓自由地區公民投票表決
  - label: D
    content: 我國目前統治所及地包括臺灣省及部分福建省地區
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 《憲法》與《憲法增修條文》中對於我國主權並未明確定義統治權在於臺澎金馬地區，而是以「大陸地區、自由地區」規定之。(A)大陸地區為法理主權的地區。(B)應是屬於概括規定。(C)領土變更案由立法院提案後，交由公民複決。
