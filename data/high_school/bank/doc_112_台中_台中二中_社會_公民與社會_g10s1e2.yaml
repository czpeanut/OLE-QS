  stem: 2024 年 1 月我國將舉行總統大選，某候選人主張我國應改採內閣制，若當選將逐步推動修憲，改善現有政府體制的缺點。請問下列何者最有可能是該候選人會提出的改革方案？
  options:
  - label: A
    content: 取消副署制度，民選總統負完全責任
  - label: B
    content: 立法委員可同時兼任行政院部會首長
  - label: C
    content: 行政院院長改由人民直接選舉選出
  - label: D
    content: 提高行政院移請立法院覆議的門檻
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 內閣制是將行政權與立法權聯立的制度，若候選人要推動修憲，現今臺灣的雙首長制中，上述兩權的制衡關係取自於總統制，以分立制衡的方式。故候選人可能提出該方案，讓臺灣政體更趨近內閣制。(A)副署制度存在於內閣制中，候選人不會提出取消的方案。(C)行政院長應由立法院（國會）中的多數黨黨魁擔任。(D)覆議制度存在於總統制中。
