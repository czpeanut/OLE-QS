  stem: 臺中干城營區被我國國家人權博物館列為二二八時期的不義遺址。根據二二八受害者的口述歷史與檔案審訊筆錄記載，干城營區內的軍營、馬廄和馬飼料調合場等地，<u>曾作為拘禁政治異議者之牢房，並曾以電擊等酷刑取供。</u>請問上述底線部分主要涉及侵害的公民身分權利內涵為何？
