  stem: 女性割禮是針對 5 歲至 14 歲的女生將私密處外部部分割除的手術，以抑制女性的性快感。直至今日，這項傳統在許多非洲國家仍相當盛行。由於割禮手術過程都沒有麻醉，又缺乏消毒與照護，因此容易引發感染、敗血症甚至死亡。2020 年 5 月非洲國家蘇丹正式立法禁止「割禮」，違者將處以 3 年有期徒刑或罰金。然而，有女性團體指出，當今蘇丹社會還是普遍認為女童必須經過割禮才「嫁得出去」，這項傳統很難因為一條法律就消失。關於女性割禮的禁令，下列何者詮釋最適當？
  options:
  - label: A
    content: 蘇丹透過立法讓女性獲得普遍的公民身分
  - label: B
    content: 蘇丹透過立法促使女性兒童權益有所提升
  - label: C
    content: 透過國際組織的推動促使蘇丹實現普遍人權
  - label: D
    content: 以法律讓女性的集體發展人權可以獲得保障
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)當中提及蘇丹政府欲透過立法來禁止違反女童人權的習俗，而非賦予公民身分。(C)應是蘇丹政府的立法機關以立法的方式，希望達到維護女童權利的目標，並無國際組織介入。(D)集體發展人權為指依環境或種族所主張的自治權或自決權，與題文敘述不相符。
