  explanation: 聯合國設立人權理事會，做為全球人權的專責機構。人權理事會主要透過會談來協商國際人權標準與解決人權侵害事件，會定期評估會員國的人權狀況。(B)應是國際特赦組織。(C)應是自由之家每年度重要的調查與報告。(D)《各國人權報告》是美國國務院每年向美國國會提交的關於美國以外國家和地區年度人權狀況報告。
