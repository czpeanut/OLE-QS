  stem: 1948 年聯合國大會表法通過《世界人權宣言》，是第一份表述所有人類都應享有權利的文件。關於該宣言及聯合國，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: 該宣言包括公民的政治權力，並納入社會、經濟、文化、生存權
  - label: B
    content: 該宣言確保聯合國的會員國皆受國際法約束而不得任意侵害人權
  - label: C
    content: 該宣言肯認人權的普世價值，促進各國對人權的普遍尊重
  - label: D
    content: 除《世界人權宣言》外，聯合國亦設立條約機構及人權理事會
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《世界人權宣言》並無強制性，僅具宣導性質，故無法具備國際法的約束力，(B)選項錯誤。該宣言將人權精神條文化，能夠促進各國對人權的尊重與追求。
