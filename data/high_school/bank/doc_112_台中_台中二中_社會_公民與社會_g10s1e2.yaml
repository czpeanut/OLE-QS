  stem: 105 年及 106 年各地方政府禁止檢出萊克多巴胺之權限，其屬性與下列何者最為相似？
  options:
  - label: A
    content: 高雄捷運延伸到臺南的發展計畫
  - label: B
    content: 中二中協助教育部辦理教育會考
  - label: C
    content: 市政府推動社會住宅輔導轉型計畫
  - label: D
    content: 地方戶政事務所辦理戶籍登記作業
  group_stem: '嘉義市議會、臺中市議會、臺北市議會跟臺南市議會於 105 年至 106 年間，陸續規定市內販售之豬肉及豬肉製品皆不得驗出萊克多巴胺（俗稱瘦肉精）。然而，中央衛福部於 110 年設立新的萊克多巴胺殘留標準後，遂宣告地方政府已通過的自治條例無效，為此各地方議會分別向大法官聲請釋憲，欲釐清中央與地方權限劃分之爭議。

    2022 年 5 月 13 日，大法官於憲法法庭作出 111 年憲判字第 6 號判決，其結論如下：

    一、進口肉品及其產製品殘留乙型受體素之安全容許量標準，屬中央立法事項。

    二、衛生福利部就聲請人嘉義市議會，行政院就聲請人臺北市議會、臺南市議會、臺中市議會及桃園市議會，函告其所通過之各該自治條例無效或不予核定部分，並未逾越憲法賦予中央監督地方自治之權限範圍，均屬合憲。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中為地方政府的自治事項，與(C)相同。(A)此為跨區域自治事項。(B)學校協助辦理大考，應為上級機關的委辦事項。(D)地方的戶政機關辦理相關業務，如戶籍登記、國民身分證等，皆是行政院內政部交由地方政府的委辦事項。
