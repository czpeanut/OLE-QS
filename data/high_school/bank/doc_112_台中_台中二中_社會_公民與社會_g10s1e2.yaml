  answer_status: verified
  answer_source: answer_key
  explanation: (A)國會可對總理（首相）提出不信任案，一旦通過，需內閣總辭，此為內閣制設計。(C)總統制的制度中，並無行政院長、首相或總理的職位，也無須副署，副署為內閣制中的設計。(E)內閣制中內閣須對國會負責，接受質詢，此為內閣制設計。
