- id: doc_111_台北_北一女中_數學_數A_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 在坐標平面上，設點 $P_{k}$＝$\left( k , \sin \frac{k\pi}{2} \right)$，其中 k 為自然數，試問下列哪些敘述是正確的？
  options:
  - label: A
    content: $\vec{P_{1}P_{2}}$＝（－1，1）
  - label: B
    content: $\vec{P_{2}P_{4}}=\vec{P_{4}P_{6}}$
  - label: C
    content: $\vec{P_{1}P_{3}} \cdot \vec{P_{3}P_{4}}$＞0
  - label: D
    content: $\vec{P_{5}P_{6}}= 0.5\vec{P_{1}P_{3}}$
  - label: E
    content: △$P_{1}P_{3}P_{6}$ 面積的值等於 4
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'k＝1～6 代入得

    $P_{1}$（1，1），$P_{2}$（2，0），$P_{3}$（3，－1），$P_{4}$（4，0），$P_{5}$（5，1），$P_{6}$（6，0）

    (A)╳：$\vec{P_{1}P_{2}}$＝（1，－1）

    (B)○：$\vec{P_{2}P_{4}}=(2 , 0)=\vec{P_{4}P_{6}}$

    (C)╳：$\vec{P_{1}P_{3}}$＝（2，－2），$\vec{P_{3}P_{4}}$＝（1，1）

    $\vec{P_{1}P_{3}} \cdot \vec{P_{3}P_{4}}$＝2－2＝0

    (D)○：$\vec{P_{5}P_{6}}$＝（1，－1），$\vec{P_{1}P_{3}}$＝（2，－2）

    $\Rightarrow\vec{P_{5}P_{6}}= 0.5\vec{P_{1}P_{3}}$

    (E)○：$\vec{P_{1}P_{3}}$＝（2，－2），$\vec{P_{1}P_{6}}$＝（5，－1）

    △$P_{1}P_{3}P_{6}$ 面積＝$\frac{1}{2} ∣ \left| \begin{matrix}2 & 5 \\ - 2 & - 1\end{matrix} \right| ∣$

    ＝$\frac{1}{2} ∣ 2\times (- 1)-(- 2) \times 5 ∣$＝4

    故選(B)(D)(E)'
