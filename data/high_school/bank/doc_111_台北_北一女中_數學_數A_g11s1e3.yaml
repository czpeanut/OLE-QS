- id: doc_111_台北_北一女中_數學_數A_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '在△ABC 中，設點 P 及點 Q 在$\overline{BC}$上，且$\overline{BP} : \overline{CP}$＝2：1，$\overline{BQ} : \overline{CQ}$＝7：4。已知$\vec{AP}$＝$a\vec{AB}+b\vec{AC}$，$\vec{AQ}$＝$c\vec{AB}+d\vec{AC}$，其中 a，b，c，d 為實數，試問下列敘述何者正確？'
  options:
  - label: A
    content: b＞d＞c＞a
  - label: B
    content: a＞c＞d＞b
  - label: C
    content: d＞b＞a＞c
  - label: D
    content: b＞c＞d＞a
  - label: E
    content: d＞b＞c＞a
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '由分點公式可知

    $\vec{AP}=\frac{1}{3}\vec{AB}+\frac{2}{3}\vec{AC}$，$\vec{AQ}=\frac{4}{11}\vec{AB}+\frac{7}{11}\vec{AC}$

    故$a =\frac{1}{3}=\frac{11}{33}$，$b =\frac{2}{3}=\frac{22}{33}$，$c =\frac{4}{11}=\frac{12}{33}$，$d =\frac{7}{11}=\frac{21}{33}$

    ∵$\frac{22}{33}$＞$\frac{21}{33}$＞$\frac{12}{33}$＞$\frac{11}{33}\Rightarrow\frac{2}{3}$＞$\frac{7}{11}$＞$\frac{4}{11}$＞$\frac{1}{3}$

    ∴b＞d＞c＞a

    故選(A)'
