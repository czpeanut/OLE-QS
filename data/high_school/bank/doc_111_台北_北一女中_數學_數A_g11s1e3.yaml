  - label: B
    content: 點 B 在第二象限
  - label: C
    content: 點 B 在第三象限
  - label: D
    content: 點 B 在第四象限
  - label: E
    content: 點 B 位於坐標軸上
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'B 點坐標為

    （$log_{0.2}$7，$2^{－0.5}$）＋（$log_{5}$2，－$0.7^{－1}$）＝（$log_{0.2}$7＋$log_{5}$2，$2^{－0.5}$－$0.7^{－1}$）

    ∵$log_{0.2}$7＋$log_{5}$2＝$\log _{\frac{1}{5}}7 +\log _{5}2$

    ＝－$log_{5}$7＋$log_{5}$2＜0

    且 $2^{－0.5}$－（0.7）$^{－1}$＝$\frac{1}{\sqrt{2}}-\frac{1}{0.7}$＜0

    ∴B 在第三象限

    故選(C)'
