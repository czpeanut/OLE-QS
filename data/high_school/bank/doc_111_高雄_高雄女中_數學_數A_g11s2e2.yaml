- id: doc_111_高雄_高雄女中_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 空間中有兩條直線分別為 $L_{1}$：$\frac{x-3}{1}=\frac{y-7}{2}=\frac{z+8}{-2}$與 $L_{2}$：$\frac{x}{2}=\frac{y-1}{-3}=\frac{2+z}{-6}$，下列敘述哪些正確？
  options:
  - label: A
    content: $L_{1}$ 與 $L_{2}$ 為兩條不共平面的歪斜線
  - label: B
    content: $L_{1}$ 與 $L_{2}$ 為兩條共平面的相交直線
  - label: C
    content: $L_{1}$ 與 $L_{2}$ 的交點為（0，1，－2）
  - label: D
    content: 若 $L_{1}$ 與 $L_{2}$ 的夾角為 θ，則 cosθ＝$\pm \frac{8}{21}$
  - label: E
    content: 包含 $L_{1}$ 與 $L_{2}$ 的平面方程式為 18x－2y＋7z＝16
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '整理 $L_{2}$：$\frac{x}{2}=\frac{y-1}{-3}=\frac{z+2}{-6}$

    ∴$L_{1}$ 方向向量為$\vec{v_{1}}$＝（1，2，－2），$L_{2}$ 方向向量為$\vec{v_{2}}$＝（2，－3，－6）

    (A) ╳：∵$\vec{v_{1}}$不平行$\vec{v_{2}}$

    ∴$L_{1}$，$L_{2}$ 為相交或歪斜

    設 $L_{1}$：$\begin{cases}x=3+t \\ y=7+2t \\ z=-8-2t\end{cases}$，t ∈ R，$L_{2}$：$\begin{cases}x=2s \\ y=1-3s \\ z=-2-6s\end{cases}$，s ∈ R

    若兩線有交點，則存在 t、s 使得

    $\begin{cases}3+t=2s \\ 7+2t=1-3s \\ -8-2t=-2-6s\end{cases}$

    ⇒$\begin{cases}t-2s=-3 \\ 2t+3s=-6 \\ t-3s=-3\end{cases}$⇒$\begin{cases}t=-3 \\ s=0\end{cases}$

    故兩線相交，且交於（0，1，－2）

    (B) ○：同(A)

    (C) ○：同(A)

    (D) ○：cosθ＝$\pm \frac{\vec{v_{1}} \cdot \vec{v_{2}}}{| \vec{v_{1}} | | \vec{v_{2}} |}=\pm \frac{2-6+12}{3 \cdot 7}=\pm \frac{8}{21}$

    (E) ╳：$\vec{v_{1}}$×$\vec{v_{2}}$＝（－18，2，－7）//（18，－2，7）

    且平面上過（0，1，－2）

    所求平面方程式為 18x－2y＋7z＝－16

    故選(B)(C)(D)'
