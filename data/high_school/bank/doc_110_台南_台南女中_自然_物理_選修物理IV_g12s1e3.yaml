  type: single
  page: 2
  stem: 密閉的金屬空瓶內裝有氦氣，瓶內外的溫度皆為室溫，壓力皆為一大氣壓，將該瓶置入冰水中數分鐘，若可忽略金屬瓶內部體積的改變，則下列敘述何者正確？
  options:
  - label: A
    content: 置入水中後，瓶內氣體的壓力變大
  - label: B
    content: 置入水中後，瓶內氣體的分子數變少
  - label: C
    content: 置入水中前，瓶內氣體分子的平均動能較大
  - label: D
    content: 置入水中後，瓶內氣體分子的總動能變大
  - label: E
    content: 置入水中前後，瓶內氣體分子的總動能不變 【修改自 108.學測】
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)當溫度降低，體積與分子數目不變時，氣壓會變小。

    (B)容器密閉，分子總數不變。

    (C)(D)(E)瓶內氣體溫度下降後，分子平均動能變小，故總動能變小。'
  tags:
