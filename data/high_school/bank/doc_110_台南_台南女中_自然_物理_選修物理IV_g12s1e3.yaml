      title: 天體運動
      std: true
    textbook: 物理（全） 天體運動
    pattern:
      key: PH-1-2-4:T09
      name: 萬有引力與行星表面重力比較
    labeled_by: agent
    label_confidence: high
  difficulty: 2
- id: doc_110_台南_台南女中_自然_物理_選修物理IV_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 物體自高處落下時，除了受到重力之外，還有空氣阻力。某同學觀測一小物體自高處落下，其速度 v 與時間 t 的關係如右圖，下列有關小物體運動的敘述，何者正確？
  options:
  - label: A
    content: 小物體的加速度量值愈來愈小
  - label: B
    content: 在 t＝1.4 s 時，小物體所受空氣阻力的量值為零
  - label: C
    content: 在落下的過程中，小物體所受空氣阻力的量值為一定值
  - label: D
    content: 小物體所受空氣阻力的量值與速率無關
  - label: E
    content: 在 t＝2.0 s 時，小物體所受重力量值為零 【修改自 102.學測】
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_110_台南_台南女中_自然_物理_選修物理IV_g12s1e3/s1_6_f1.png
    crop:
      page: 2
      rect:
      - 404.7
      - 330.95
      - 565.1
      - 431.85
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)加速度愈來愈小，在 1.2 s 後的加速度為零。

    (B)在 1.4 s 時的加速度為零，代表小物體所受的空氣阻力量值會等於物體的重量。

    (C)(D) 0 ～ 1.2 s 期間加速度愈來愈小，代表空氣阻力愈來愈大，故阻力非定值，1.2 s 後的阻力才是定值。

    (E)小物體所受重力仍為 mg。'
