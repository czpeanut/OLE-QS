  answer_status: verified
  answer_source: answer_key
  explanation: '(A)小球移動與電場同方向，故小球帶正電。

    (B)(C)(D)(E)$\frac{電力}{重力}$＝$\frac{qe}{mg}$＝tanθ⇒ q$\propto$tanθ、$\frac{1}{m}\propto$tanθ、$\frac{1}{g}\propto$tanθ、繩長與 tanθ無關。'
