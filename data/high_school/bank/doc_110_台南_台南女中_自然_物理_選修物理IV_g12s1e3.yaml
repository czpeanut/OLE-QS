  stem: 下圖為噴墨式印表機的運作示意圖，其中充電單元控制墨滴的帶電量 q，進而控制墨滴在紙面上降落的位置，若墨滴產生器產生的每一墨滴，其質量與速度皆相同，則下列敘述何者正確？
  options:
  - label: A
    content: 墨滴穿過電場的時間隨其所帶電量 q 不同而改變
  - label: B
    content: 若 q 加倍，則離開電場瞬間的側位移 y 變為 4 倍
  - label: C
    content: 若 E 加倍，則墨滴在穿過電場後，動能加倍
  - label: D
    content: 由圖可知，墨滴應帶負電
  - label: E
    content: 若 q 加倍，則墨滴在穿過電場後，動能加倍
