  stem: 帶電量 q 的質點，質量為 m，用一根絕緣繩將質點懸掛起來，並加上 一水平均勻電場 E，如右圖所示，重力加速度量值為 g，絕緣繩與鉛 直線的夾角為θ，下列敘述何者正確？
  options:
  - label: A
    content: 小球帶負電
  - label: B
    content: 若將質點的質量與電量均加倍，則θ不變
  - label: C
    content: 若質點的電量加倍，則θ值亦加倍
  - label: D
    content: 當絕緣繩的長度加倍時，則 tanθ值加倍
  - label: E
    content: 若重力加速度減半，則 tanθ值不變
  answer:
