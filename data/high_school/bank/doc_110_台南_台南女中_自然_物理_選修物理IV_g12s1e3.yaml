- id: doc_110_台南_台南女中_自然_物理_選修物理IV_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 某星球的平均密度與半徑，分別為地球的 100 倍與 0.1 倍，則此星球表面的重力加速度量值約為地球表面重力加速度量值的幾倍？
  options:
  - label: A
    content: '0.010'
  - label: B
    content: '0.10'
  - label: C
    content: '1.0'
  - label: D
    content: '10'
  - label: E
    content: 100 【修改自 110.學測】
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設星球質量為 M、半徑為 R、密度為ρ，已知球的體積 V＝$\frac{4}{3}$π$R^{3}$

    ⇒星球的質量 M＝ρV＝ρ×$\frac{4}{3}$π$R^{3}$＝$\frac{4}{3}$πρ$R^{3}$

    ⇒星球表面的重力加速度 g＝$\frac{GM}{R^{2}}$＝$\frac{G\times \frac{4}{3}\pi \rho R^{3}}{R^{2}}$＝$\frac{4}{3}$πρGR$\propto$ρR

    ⇒$\frac{g_{星}}{g_{地}}$＝$\frac{\rho _{星}R_{星}}{\rho _{地}R_{地}}$＝$\frac{0.10\times 100}{1.0\times 1.0}$＝10'
  tags:
    unit:
      code: PH-1-2-4
