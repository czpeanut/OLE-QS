- id: doc_110_台南_台南女中_自然_物理_選修物理IV_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 下列為各力對物體作功的敘述，何者正確？
  options:
  - label: A
    content: 已知地球繞太陽作橢圓軌道運動，由近日點至遠日點的過程中，重力對地球不作功
  - label: B
    content: 一顆球由地面鉛直上拋至最高點過程中，重力對球作正功
  - label: C
    content: 一顆皮球自同一高度靜止釋放到著地期間，不考慮空氣阻力與考慮空氣阻力作用下，重力對皮球作功均相同
  - label: D
    content: 一人沿半徑 r 的光滑圓形軌道，施一定大小的力推一皮箱，經過一個圓周，此人對皮箱作功為 0
  - label: E
    content: 坐雲霄飛車時，軌道的正向力對飛車作正功
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)由功能定理可知，地球由近日點至遠日點的過程中，因動能變小，故重力對地球作負功。

    (B)上升過程，因重力與位移反向，故重力作負功。

    (C)無論是否有空氣阻力，只要位移相同，重力作功均相同。

    (D)推力對皮箱作功 W＝F（2πr）≠0

    (E)因軌道的正向力與瞬時位移垂直，故正向力不作功。'
  tags:
