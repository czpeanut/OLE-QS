questions:
- id: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 材質與半徑完全相同的兩金屬分別帶有電量2Q及6Q，兩球間的距離遠大於其半徑，且兩球間的靜電作用力為F。今將兩球接觸後再將它們放回原來位置，假設過程中兩球上的總電荷守恆，則兩球間的靜電作用力為若干？
  options:
  - label: A
    content: $\frac{3}{2}$F
  - label: B
    content: $\frac{9}{8}$F
  - label: C
    content: $\frac{5}{4}$F
  - label: D
    content: $\frac{3}{4}$F
  - label: E
    content: $\frac{4}{3}$F
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 接觸後電量Q'＝$\frac{2Q+6Q}{2}$＝4Q。 F'＝$\frac{kQ'^{2}}{r^{2}}$＝$\frac{16kQ}{r^{2}}$ F＝$\frac{k \cdot 2Q \cdot 6Q}{r^{2}}$＝$\frac{12kQ}{r^{2}}$ ⇒ F'＝$\frac{4}{3}$F 故選(E)。
- id: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 如圖所示，半徑為r的圓形載流線圈中，通有逆時針方向的電流I，真空中的磁導率為μ$_{0}$，則在此線圈之中心軸上，在圓心O處之磁場為
  options:
  - label: A
    content: $\frac{\mu _{0}I^{2}}{3r}$↓
  - label: B
    content: $\frac{\mu _{0}I}{2\pi r}$↑
  - label: C
    content: $\frac{\mu _{0}I}{2r}$↑
  - label: D
    content: $\frac{\mu _{0}I}{r^{2}}$↓
  - label: E
    content: '0'
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3/s1_7_f1.png
    crop:
      page: 1
      rect:
      - 606.8
      - 855.55
      - 689.0
      - 901.75
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 環心處磁場：B＝$\frac{\mu _{0}I}{2r}$，安培右手定則判定方向向上。故選(C)。
- id: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 有5種粒子以相同之速度垂直進入均勻磁場B，其軌跡如圖所示。設此5種粒子為：碳原子（$^{12}$C），氧離子（$^{16}O^{2－}$），鈉離子（$^{23}Na^{＋}$），鈣離子（$^{40}Ca^{2＋}$）及氯離子（$^{19}F^{－}$）。若不考慮重力因素，則圖中1、2、3、4及5之示意軌跡分別代表
  options:
  - label: A
    content: $^{40}Ca^{2＋}$，$^{23}Na^{＋}$，$^{12}$C，$^{16}O^{2－}$及$^{19}F^{－}$
  - label: B
    content: $^{23}Na^{＋}$，$^{40}Ca^{2＋}$，$^{12}$C，$^{16}O^{2－}$及$^{19}F^{－}$
  - label: C
    content: $^{16}O^{2－}$，$^{19}F^{－}$，$^{12}$C，$^{23}Na^{＋}$及$^{40}Ca^{2＋}$
  - label: D
    content: $^{23}Na^{＋}$，$^{40}Ca^{2＋}$，$^{12}$C，$^{19}F^{－}$及$^{16}O^{2－}$
  - label: E
    content: $^{40}Ca^{2＋}$，$^{23}Na^{＋}$，$^{12}$C，$^{19}F^{－}$及$^{16}O^{2－}$
  assets:
  - key: s1_8_f1
    kind: figure
    file: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3/s1_8_f1.png
    crop:
      page: 2
      rect:
      - 550.4
      - 64.0
      - 689.0
      - 117.2
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 根據右手開掌定則，正電荷向左偏，負電荷向右偏，電中性元素不偏移，圓半徑r＝$\frac{mv}{qB}\propto \frac{m}{q}$ $^{23}Na^{＋}$ ⇒ $\frac{23}{1}$＝23；$^{40}Ca^{＋}$ ⇒ $\frac{40}{2}$＝20；$^{16}O^{2－}$ ⇒ $\frac{16}{2}$＝8；$^{35}Cl^{－}$ ⇒ $\frac{35}{1}$＝35 判斷結果：①：$^{23}Na^{＋}$；②：$^{40}Ca^{2＋}$；③：$^{12}$C；④：$^{16}O^{2－}$；⑤：$^{35}Cl^{－}$。 故選(B)。
- id: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 如圖，半徑r的小金屬球殼A帶電＋2q；半徑2r的大金屬球殼B帶電－q，二球心重合，庫侖常數為k，下列敘述何者正確？
