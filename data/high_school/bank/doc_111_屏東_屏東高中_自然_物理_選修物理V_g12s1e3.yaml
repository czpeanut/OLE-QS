- id: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 如圖所示，通有電流I的導線，其經原點時有長度Δl的一小段直導線與x軸重合，請問下列有關這小段直線在圖中A至F等六個不同位置產生的磁場量值的敘述，哪些是正確的？ 此六個點均位於xy面上，其坐標分別為 A：（5 , 0）、B：（0 , 5）、C：（－5 , 0）、D：（0 , －5）、E：（3 , 4）、F：（6 , 8）
  options:
  - label: A
    content: A的磁場量值大於B的磁場
  - label: B
    content: B的磁場量值為D的2倍
  - label: C
    content: C的磁場大於B的磁場
  - label: D
    content: B的磁場量值大於F的磁場
  - label: E
    content: E的磁場量值為F的1／4倍
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_111_屏東_屏東高中_自然_物理_選修物理V_g12s1e3/s1_12_f1.png
    crop:
      page: 2
      rect:
      - 589.05
      - 511.05
      - 689.0
      - 609.9
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: ΔB＝$\frac{\mu _{0}}{4\pi} \cdot \frac{I \cdot \Delta \ell \cdot \sin \theta}{r^{2}}$ A、C兩點之θ＝0°，故磁場為零 (A) A點磁場量值小於B點磁場。 (B)ΔB$\propto \frac{\sin \theta}{r^{2}}$ B、D點之θ＝90°，且r＝5（m） 故磁場量值相等。 (C) C點磁場量值小於B點磁場。 (D)ΔB$\propto \frac{\sin \theta}{r^{2}}$ Δ$B_{B}$：Δ$B_{F}$＝$\frac{\sin 90^{\circ}}{5^{2}}$：$\frac{\sin 53^{\circ}}{10^{2}}$＝$\frac{1}{25}$：$\frac{1}{125}$ B點磁場量值大於F點磁場。 (E)ΔB$\propto \frac{\sin \theta}{r^{2}}$ E、F點之θ＝53°，故ΔB$\propto \frac{1}{r^{2}}$ Δ$B_{E}$：Δ$B_{F}$＝$\frac{1}{5^{2}}$：$\frac{1}{10^{2}}$＝4：1 故選(D)。
