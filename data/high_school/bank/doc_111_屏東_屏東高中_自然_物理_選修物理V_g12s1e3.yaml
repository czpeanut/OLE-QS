      - 587.85
      - 167.8
      - 682.95
      - 276.85
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $E_{0}$＝0；(C)$E=\frac{kq}{(5r)^{2}}=\frac{kq}{25r^{2}}$；(D)$V=\frac{2kq}{r}+(-\frac{kq}{2r})=\frac{3kq}{2r}$；(E)$V=\frac{kq}{5r}$。故選(B)。
