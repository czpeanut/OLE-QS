  group_stem: ']（素養題） 曾有人主張用鐘擺的方法來確定標準長度，然而地球表面各處的重力有輕微的不同，會影響鐘擺的測量。 法國科學院認為要確保基本單位恆定不變，應以自然的物理量為基礎，在1791年<u>以子午線（經線）上從地球赤道到北極點的距離的千萬分之一來作為標準長度的定義（參考下圖）</u>。為此法國科學院指派了一支勘測隊，測定子午線的弧長，這次勘測從1792年持續到1799年，長達7年之久。 地球不規則的表面並不是完美的球形，但法國還是在1793年採納了這次測量的結果來確定標準公尺的長度。日後人們發現，由於誤算了地球的扁率而錯算了弧長，第一個存檔公尺原器的長度比子午線定義的公尺少0.2公釐。但這個長度還是被當作了標準。當最後結果出來後，選取了最接近測量計算結果的鉑金棒作為公尺原器（Mètre des Archives），並於1799年6月22日存放在國家檔案館內。 1889年在首屆國際度量衡大會召開時用鉑銥合金（90％的鉑和10％的銥）製造了一個新的公尺原器，並規定在冰的熔點溫度時所測量到的國際公尺原器上兩道刻度之間的距離為「1公尺」。1960年國際度量衡大會曾經改用氪原子發出的光定義標準公尺；最新的公尺的定義，1983年國際度量衡大會重新制定，以光在真空中行進299,792,458分之1秒的距離為標準公尺。'
