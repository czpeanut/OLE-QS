  stem: （素養題） 《科學》（Science）雜誌把微中子質量列為2001年科學最重要的發現之一。太陽內部的核融合反應原理：第一步是質子和質子的高速碰撞，當兩者夠接近時，強核力與弱核力就會發揮功用，讓兩個質子轉變成氘原子核（核內存在一個質子、一個中子），並同時產生微中子與正電子。事實上，我們每個人每秒鐘，大約會被50兆個微中子穿透過身體，那麼為何我們身體沒有破洞呢？主要是微中子與其他物質的交互作用極弱，因此你不會察覺被微中子穿透。 由於微中子不帶電，只會經由弱核力和重力與其他粒子發生作用，因此它們實際上能夠自由穿透物質，而且要探測簡直難上加難。實驗物理學家研究太陽微中子，也就是因為太陽中核反應所產生的微中子，得到明確的數據可以證明微中子其實帶有很小的質量。請根據前文回答下列問題： 藉由質子和質子的高速碰撞，當兩者夠接近時，強核力就會發揮功用，試問強核力在這過程主要是擔任何種角色？
  options:
  - label: A
    content: 克服兩個質子之間的庫侖靜電斥力
  - label: B
    content: 突破原子核薄膜的阻力
  - label: C
    content: 使質子衰變，變成中子的作用力
  - label: D
    content: 使中子衰變，變成質子的作用力
  - label: E
    content: 克服兩個質子之間的重力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
