- id: doc_109_嘉義_嘉義女中_數學_數A_g11s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 已知坐標空間中有一點 P（3，1，－2），直線 L：$\frac{x+1}{a}=\frac{y-2}{b}=\frac{z-3}{c}$及平面 E：3x－y＋2z＝k，則下列敘述哪些為真？
  options:
  - label: A
    content: 若點 P 在平面 E 上，則 k＝12
  - label: B
    content: 若直線 L 與平面 E 恰有一交點，則 3a－b＋2c≠0
  - label: C
    content: 若直線 L 在平面 E 上，則 k＝1
  - label: D
    content: 若直線 L 垂直平面 E，則 2b＋c＝0
  - label: E
    content: 若直線 L 平行平面 E，則 3a－b＋2c≠0
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：若點 P（3，1，－2）在平面 E 上，將 P（3，1，－2）代入 E：3x－y＋2z＝k

    ∴k＝3×3－1＋2×（－2）＝4

    (B) ○：若直線 L 與平面 E 恰有一交點，則 L$//＼$E ∴$\vec{L} \cdot \vec{n}\neq 0$

    ∴（a，b，c）．（3，－1，2）≠0 ∴3a－b＋2c≠0

    (C) ○：若直線 L 在平面 E 上，因為 L 過點 Q（－1，2，3），則 Q（－1，2，3）必在平面

    E：3x－y＋2z＝k 上

    ∴k＝3×（－1）－2＋2×3＝－3－2＋6＝1

    (D) ○：若直線 L 垂直平面 E，則$\vec{L}$//$\vec{n}$ ∴（a，b，c）//（3，－1，2）

    ∴$\frac{b}{-1}=\frac{c}{2}$ ∴2b＝－c ∴2b＋c＝0

    (E) ╳：若直線 L 平行平面 E，則$\vec{L}$⊥$\vec{n}$ ∴$\vec{L}$．$\vec{n}$＝0

    ∴（a，b，c）．（3，－1，2）＝0 ∴3a－b＋2c＝0

    故選(B)(C)(D)'
- id: doc_109_嘉義_嘉義女中_數學_數A_g11s2e2_s2_3
  section: 2
  number: 3
  type: multiple
