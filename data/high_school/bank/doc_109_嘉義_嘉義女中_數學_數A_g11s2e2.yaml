  options:
  - label: A
    content: $\frac{1}{6}$
  - label: B
    content: $\frac{1}{3}$
  - label: C
    content: $\frac{1}{5}$
  - label: D
    content: $\frac{2}{3}$
  - label: E
    content: $\frac{5}{6}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＋b＝8：（2，6），（3，5），（4，4），（5，3），（6，2）

    a＋b＝8 且 b＝3：（5，3）

    ∴P（b＝3｜a＋b＝8）＝$\frac{n (a+b=8 且 b=3)}{n (a+b=8)}$＝$\frac{1}{5}$

    故選(C)'
