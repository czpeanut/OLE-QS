  stem: 符號 P(C)代表事件 C 發生的機率，符號 P（C｜D）代表在事件 D 發生的條件下，事件 C 發生的機率。今設 A，B 為樣本空間中的兩個事件，且 A，B 互為獨立事件，已知 P
  options:
  - label: A
    content: ＝P
  - label: B
    content: ＝0.6。請選出正確的選項：(A) P（A∪B）＝0.84(B) P（A ∩ B）＝0.3
  - label: C
    content: P（A｜B）＝0.6
  - label: D
    content: P（A｜B）＝P（B｜A）
  - label: E
    content: A，B 是互斥事件
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵A，B 互為獨立事件 ∴P（A ∩ B）＝P(A)×P(B)＝0.6×0.6＝0.36

    ∴P（A∪B）＝P(A)＋P(B)－P（A ∩ B）＝0.6＋0.6－0.36＝0.84

    (B) ╳：由(A)知 P（A ∩ B）＝0.36

    (C) ○：P（A｜B）＝$\frac{P (A \cap B)}{P (B)}=\frac{P (A)\times P (B)}{P (B)}$＝P(A)＝0.6

    (D) ○：∵P（A｜B）＝$\frac{P (A \cap B)}{P (B)}=\frac{P (A)\times P (B)}{P (B)}$＝P(A)＝0.6

    又 P（B｜A）＝$\frac{P (B \cap A)}{P (A)}=\frac{P (B)\times P (A)}{P (A)}$＝P(B)＝0.6

    ∴P（A｜B）＝P（B｜A）

    (E) ╳：∵P（A ∩ B）＝0.36≠0 ∴A ∩ B≠∅ ∴A，B 非互斥事件

    故選(A)(C)(D)'
- id: doc_109_嘉義_嘉義女中_數學_數A_g11s2e2_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 坐標空間中有一平面 P 過（0，0，0），（1，2，3）及（－1，2，3）三點。試選出正確的選項：
  options:
  - label: A
    content: 向量（0，2，3）與平面 P 垂直
  - label: B
    content: 平面 P 與 xy 平面平行
  - label: C
    content: 點（0，4，6）在平面 P 上
  - label: D
    content: 平面 P 包含 x 軸
  - label: E
    content: 點（1，1，1）到平面 P 的距離是$\frac{4}{13}\sqrt{13}$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：令 O（0，0，0），A（1，2，3），B（－1，2，3）

    ∴$\vec{OA}=(1 , 2 , 3)$，$\vec{OB}=(-1 , 2 , 3)$

    $\vec{OA}\times \vec{OB}$＝（1，2，3）×（－1，2，3）

    ＝$\left( \left| \begin{matrix}2 & 3 \\ 2 & 3\end{matrix} \right| , \left| \begin{matrix}3 & 1 \\ 3 & -1\end{matrix} \right| , \left| \begin{matrix}1 & 2 \\ -1 & 2\end{matrix} \right| \right)$

    ＝（0，－6，4）＝－2（0，3，－2）

    ∴取平面 P 的法向量$\vec{n_{1}}=(0 , 3 , -2)$

    令平面 P：0．x＋3y－2z＝k 過（0，0，0） ∴k＝0

    ∴P：0．x＋3y－2z＝0

    ∵（0，2，3）．（0，3，－2）＝0×0＋2×3＋3×（－2）＝0

    ∴向量（0，2，3）⊥$\vec{n_{1}}$ ∴向量（0，2，3）與平面 P 平行

    (B) ╳：∵xy 平面：0．x＋0．y＋1．z＝0 ∴$\vec{n_{2}}=(0 , 0 , 1)$

    ∵$\vec{n_{1}}=(0 , 3 , -2)//＼(0 , 0 , 1)=\vec{n_{2}}$

    ∴平面 P 與 xy 平面相交成一直線

    (C) ○：將（0，4，6）代入 0．x＋3y－2z＝0×0＋3×4－2×6＝0

    ∴（0，4，6）在平面 P 上

    (D) ○：x 軸上的點參數式為$\begin{cases}x=t \\ y=0 \\ z=0\end{cases}$，t ∈ R

    代入 0．x＋3y－2z＝0×t＋3×0－2×0＝0，恆成立

    ∴平面 P 包含 x 軸

    (E) ╳：令 Q（1，1，1）

    ∴d（Q，平面 P）＝$\frac{│ 0\times 1+3\times 1-2\times 1 │}{\sqrt{0^{2}+3^{2}+(-2)^{2}}}$＝$\frac{│ 0+3-2 │}{\sqrt{0+9+4}}$＝$\frac{1}{\sqrt{13}}$＝$\frac{1}{13}\sqrt{13}$

    故選(C)(D)'
