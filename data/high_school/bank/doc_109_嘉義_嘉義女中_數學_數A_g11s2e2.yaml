- id: doc_109_嘉義_嘉義女中_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 坐標空間中有兩直線 $L_{1}$：$\frac{x-3}{2}=\frac{y-2}{-1}=\frac{z-1}{-4}$，$L_{2}$：2x＝3y＝6z，則 $L_{1}$ 與 $L_{2}$ 之關係為何？
  options:
  - label: A
    content: 兩平行線
  - label: B
    content: 兩重合直線
  - label: C
    content: 兩歪斜線
  - label: D
    content: 交於一點且互相垂直的兩直線
  - label: E
    content: 交於一點但不垂直的兩直線
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $L_{1}$：$\frac{x-3}{2}=\frac{y-2}{-1}=\frac{z-1}{-4}=t$

    ∴$\begin{cases}x=2t+3 \\ y=-t+2 \\ z=-4t+1\end{cases}$，t ∈ R

    令 $L_{2}$：2x＝3y＝6z＝s

    ∴$\begin{cases}x=\frac{s}{2} \\ y=\frac{s}{3} \\ z=\frac{s}{6}\end{cases}$，s ∈ R

    ∴$\begin{cases}2t+3=\frac{s}{2} \\ -t+2=\frac{s}{3}\end{cases}$ ∴$\begin{cases}4t-s=-6 \cdots \cdots \cdots \cdots \cdots ① \\ -3t-s=-6 \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①－②得 7t＝0 ∴t＝0，s＝6

    t＝0 代入 ∴（x，y，z）＝（3，2，1）

    s＝6 代入 ∴（x，y，z）＝（3，2，1）

    ∴$L_{1}$，$L_{2}$ 相交於點（3，2，1）

    又$\vec{L_{1}}=(2 , -1 , -4)$，$L_{2}$：$\frac{x}{\frac{1}{2}}=\frac{y}{\frac{1}{3}}=\frac{z}{\frac{1}{6}}$ ∴$\vec{L_{2}}=\left( \frac{1}{2} , \frac{1}{3} , \frac{1}{6} \right)$

    ∵$\vec{L_{1}} \cdot \vec{L_{2}}$＝（2，－1，－4）．$\left( \frac{1}{2} , \frac{1}{3} , \frac{1}{6} \right)$

    ＝$2\times \frac{1}{2}+(-1)\times \frac{1}{3}+(-4)\times \frac{1}{6}$＝$1-\frac{1}{3}-\frac{2}{3}$＝0

    ∴$\vec{L_{1}}$⊥$\vec{L_{2}}$

    ∴$L_{1}$，$L_{2}$ 為交於一點且互相垂直的兩直線

    故選(D)'
