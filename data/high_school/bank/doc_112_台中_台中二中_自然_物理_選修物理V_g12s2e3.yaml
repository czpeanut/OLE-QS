  stem: 某生用電子作雙狹縫干涉實驗，在狹縫後的螢幕上有電子偵測器，每次電子在垂直入射雙狹縫後，會撞擊偵測器顯示出一亮點。用許多電子逐一重覆上述步驟後，統計螢幕上各處偵測器所顯示的亮點數目，可以得到類似光波的干涉條紋。在螢幕上有甲、乙、丙三點，甲點與乙點分別位於兩個狹縫的正後方，丙點為甲乙之中點。下列敘述哪些正確？
