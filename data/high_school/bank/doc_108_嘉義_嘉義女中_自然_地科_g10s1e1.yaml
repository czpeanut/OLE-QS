- id: doc_108_嘉義_嘉義女中_自然_地科_g10s1e1_s1_49
  section: 1
  number: 49
  type: single
  page: 7
  stem: 目前火星上的水，主要以何種狀態存在？
  options:
  - label: A
    content: 固態
  - label: B
    content: 液態
  - label: C
    content: 氣態
  - label: D
    content: 三種狀態均分
  group_stem: ◎ 火星最令人感興趣的是有關水的問題，根據海盜號探測船所傳回的照片顯示，火星上有許多流水侵蝕過的地形，但是目前調查顯示，火星上大部分的水是以冰的型態存在南北兩極的極冠中。 火星表面的氣壓是1／150大氣壓，其主要成分是二氧化碳，占96%，水蒸氣只占0.01％而已，這些水蒸氣如果凝結成水， 舖蓋在火星表面，則厚度只有0.01公尺，實在稀少。因此，科學家懷疑，火星的地底下可能有相當數量的水存在。含有二氧化碳及水蒸氣的大氣具有「溫室效應」，火星的氣溫如果因為溫室效應而升高，極冠和地下的二氧化碳及水便會蒸發，使得大氣更為濃厚，導致溫室效應更加顯著；但是，相反地，如果溫室效應不強的話，氣溫便會下降，使得大氣中的二氧化碳及水蒸氣凍結在極冠或地下，因此，大氣變得更稀薄，導致溫室效應更形微弱。當然，現在火星的溫室效應相當微弱。【改寫自《牛頓雜誌》第102期〈太陽系新發現〉】
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
