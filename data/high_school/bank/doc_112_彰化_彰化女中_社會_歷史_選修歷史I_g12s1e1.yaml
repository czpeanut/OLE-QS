  stem: 阿明到紐西蘭旅遊時，參觀蒂帕帕國家博物館，他在裡面看到毛利人的相關文物與說明，裡面提到「村寨（Pa）」是毛利人傳統的居住型態，請問阿明會在這裡看到有關「村寨」的哪種說明？
