  stem: '資料一：基督教在創設初期是屬於下層民眾的宗教，信徒多為貧民、手工業者、奴隸或半自由人。這時基督教的思想具有較強烈的反抗意識，反對羅馬統治、仇視富人，同時對婦女抱著較強烈的同情與尊重的態度。耶穌對婦女的態度，表現基督教創始之初的平等主義思想。

    資料二：隨著基督教的發展，許多上層社會的婦女加入基督教，她們奢華的生活引發了虔誠教徒對教會秩序和純樸生活的焦慮；而基督教祕密傳教的特點，也使羅馬人對基督徒產生亂倫等偏見。使徒保羅為了消除民眾對基督教的誤解，對婦女的態度便深陷矛盾之中，一方面繼承耶穌對男女靈魂平等救贖的思想並有所延續，另一方面又更注重用符合猶太和希臘羅馬傳統的道德和倫理規範來約束女性，不僅把人類背負原罪的元凶歸於女性（夏娃），更將女性置於順從的地位。

