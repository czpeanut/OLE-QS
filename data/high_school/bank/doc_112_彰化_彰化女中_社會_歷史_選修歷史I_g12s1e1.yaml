  type: single
  page: 1
  stem: 一位記者報導某一族群的移民困境：「15 萬人試圖偷渡前往美國，其中大多數都在貧窮及幫派鬥爭中掙扎。溺死、交通事故、凍死或者從懸崖跌落……偷渡者在跋山涉水的途中遭遇形形色色的困難。販毒集團控制移民路線，非法移民則會面臨更多人禍，包括被劫持、勒索、折磨或者被迫為奴以及娼妓等等。」請問記者所報導的族群是
  options:
  - label: A
    content: 華裔移民
  - label: B
    content: 非裔移民
  - label: C
    content: 印度裔移民
  - label: D
    content: 拉丁裔移民
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)從「大多數都在貧窮及幫派鬥爭中掙扎。溺死、交通事故、凍死或者從懸崖跌落」等，代表這些移民本來居住的所在相當多黑幫互鬥，加上偷渡到美國的途中，還要翻山越嶺，而華裔、非裔、印度裔的移民若要到達美洲只會搭船，不太可能會有交通事故、從懸崖跌落的情況，因而可推測報導中的現象主要是拉丁裔（如墨西哥、哥倫比亞等國）面臨的困境。
