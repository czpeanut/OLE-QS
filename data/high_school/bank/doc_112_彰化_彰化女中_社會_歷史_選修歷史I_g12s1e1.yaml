- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 從中古到近代，與封建制度緊密相連的家族親屬網絡逐漸疏離，歐洲的家庭結構逐漸從大家庭轉變到以核心家庭為主。中古西歐在莊園制度下，諸侯、領主與貴族的婚姻安排與政治和經濟利益高度相關。為了保有家族的優勢地位，通常雙方親屬會形成網絡，以家族利益為優先考量。但至中古晚期，隨著封建制度逐漸解體，因此出現下述何種新發展？
  options:
  - label: A
    content: 家族需要緊密親屬關係維護共同利益
  - label: B
    content: 夫妻各有生活空間及孩童由僕從照料
  - label: C
    content: 夫妻關係重要性提升及旁系親屬影響力下降
  - label: D
    content: 家庭關係以領土為中心並由大家族共同維持
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹一開始便提到，從中古到近代，歐洲的家庭結構逐漸從「大家庭轉變到以核心家庭為主」，故原本家庭關係以整個家族的利益為優先，轉變到以自身的小家庭為主要考量，而(A)(D)的敘述應該都是以整體大家族的為主要考量下的狀況，故不選；(B)若是走向核心家庭，夫妻間對小孩的照料應該會轉變為親力親為，而非像以往都由奴僕照料。故(C)為正解。
