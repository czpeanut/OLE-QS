- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e1_s1_31
  section: 1
  number: 31
  type: single
  page: 7
  stem: 學者指出：在 1820 年代，南、北美洲的白人共約 1,200 萬，黑人則是 600 萬。然而，在之前幾個世紀，全部移入的人口大約是 200 萬白人及超過 1,000 萬的黑人。這組數據可以支持哪個論點？
  options:
  - label: A
    content: 拉丁美洲獨立建國排斥非裔
  - label: B
    content: 奴隸在南北美洲的處境艱困
  - label: C
    content: 奴隸橫渡大西洋時充滿危險
  - label: D
    content: 大量非裔返回非洲獨立建國
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '幾個世紀前，移入美洲的黑人數量遠超過白人，但在 1820 年的白人數量卻是黑人的兩倍，代表移入的黑人死亡率很高，顯示這些黑奴的處境相當艱困，故選(B)。(D)非洲獨立建國是在第二次世界大戰後。

    32.19 世紀中末葉以來，中國許多華工移往海外，其中前往美國的華工眾多，由於太平洋鐵路工程險峻，白人勞工參與意願不高，加上華工的薪資低廉，忍耐與配合度高，故鐵路工程多聘用華工，但由於移入美國的華工人數漸多，且搶走許多美國人民的工作機會，因而造成美國的排華風潮，使得政府於 1882 年通過《排華法案》。

    33.(A)都同樣對女性的身體與心靈造成傷害。(B)女性穿著緊束的束胸，以及能夠展現曲線的服裝，是為了符合社會期望的高雅風格，但移動卻相當不便。相對於女裝，同個時代的男裝則是以簡潔的三件式套裝為主，代表能力、積極與效率。這樣的對比，反映當時「男主外、女主內」的社會角色，可知穿著與社會對性別的期待和建構有直接關聯。(C)題幹中可看出一戰後便開始改變了。

    34.關鍵為「以免種姓遭受破壞」，可見這個地區應該是種姓制度盛行的印度。

    35.題目附圖的功過格中，「無邪念時刻自持」、「苦守節操」、「遭強暴誓死自全」等都是無量功，而「陷身失節」是無量過，這些都是圍繞著女子「是否守貞」來做判斷，且功與過都是無量的，與「不勤職業」（勤勞）一日過，「怨夫交謫」（順從）百過、「與人苟接言語」（端莊）十過等相比，可看出作者最為重視「貞節」。

    36.(A)應是西班牙。(C)荷蘭也成立東印度公司，並在亞洲取得取得許多貿易據點，有「海上馬車伕」之稱，當時的國際金融中心應為阿姆斯特丹。(D)物價革命是因為流入白銀增加，而造成物價上漲的情況，一開始美洲白銀流入歐洲市場，引發物價革命；且同時因為與亞洲貿易，導致大量白銀流入亞洲，因此亞洲也出現物價革命的現象。

    37.題文的關鍵是「將災禍怪罪為特定群體」，而歐洲在近代出現獵殺女巫的現象，認為社會的戰爭、疾病與災禍都與女巫有關，此一行為符合題文所述的內容，故選(C)。

    38.資料一指出印第安人都是「殘忍的野蠻人」，所以「放手讓他們掌管自己的土地就意味著保持一片未被開發的荒野」；資料二則認為美利堅的西拓運動是「文明女神」帶來的光明，顯示出美國人認為不能由野蠻的原住民放任土地蠻荒，需要拓殖隊帶來文明的進步，故選(B)。

    39.關鍵為題幹中指出「出嫁的女兒連結了兩個家庭，並因此擴張家庭的社會關係網絡……而媽祖進香儀式也同樣連結了兩個廟宇，促成區域性廟宇的聯繫網絡。」可見在臺灣社會中，結婚一事也代表著社會關係的擴大，故選(A)。(B)從題文中無法看出。(C)並未具主導地位。(D)媽祖其實並未結婚，但因為社會中的女神崇拜往往也會投射出社會對性別的期待，故會有此說。

    40.(A)林爽文相當依賴金姑的法力，代表女祭司的話語可以影響政局發展。(B)從題幹可推知金娘為西拉雅族中的祭司，所信仰的神明應該為西拉雅族的祖靈而非觀音菩薩。(D)西拉雅族的祭司以女性為主。'
