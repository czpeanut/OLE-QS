  stem: 澳洲曾經推動「原住民白化政策」。政府將原住民部落裡的小孩強行帶走，交給白人父母領養，宣稱是為了「保護澳洲下一代幼苗」，造成「失竊的一代」。請問這樣的作法，與紐西蘭殖民政府的哪一項政策接近？
