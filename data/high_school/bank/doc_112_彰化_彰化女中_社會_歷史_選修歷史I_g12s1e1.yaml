  - label: A
    content: 部落自主權
  - label: B
    content: 土地資源權
  - label: C
    content: 族語復振
  - label: D
    content: 文物回歸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 塔拉那基山被賦予法律人格一事，意味著塔拉納基山將「自己擁有自己」，而不為任何人所有，未來有人濫用或破壞塔拉納基山林的話，就等同是對整個部落造成傷害，此即「中立化土地所有權」的概念，與毛利人的價值觀息息相關，認為人並非自然的主人，而是屬於世界與自然的一部分。由此可知，紐西蘭此舉等同於讓土地資源權回歸到自然本身，故選(B)。
