  stem: 阿傑在參觀臺北三級古蹟黃氏節孝坊後覺得十分疑惑，為何節孝坊和貞節牌坊都是褒揚女性，卻沒有守貞夫和孝子牌坊呢？請問阿傑注意到了「守貞」的哪種現象？
