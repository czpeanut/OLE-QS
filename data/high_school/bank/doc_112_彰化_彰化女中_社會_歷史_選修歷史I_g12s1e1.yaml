  page: 1
  stem: 毛利傳統文化中相當重視文身，儘管此一技藝因為殖民的關係逐漸失傳，但近年願意文身的毛利人也逐漸增加，慢慢找回被遺忘的文化。請問文身在毛利文化的功能，下列敘述何者正確？
  options:
  - label: A
    content: 用來威嚇敵人展現戰功
  - label: B
    content: 可藉此辨認身分與所屬部族
  - label: C
    content: 作為藝術審美的創作
  - label: D
    content: 用來區分職業和專長
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 對毛利人來說，文身是神聖尊貴的象徵，其圖案具有象徵意義，代表不同的身分地位，也能反映出其所屬的部落族群，故選(B)。
