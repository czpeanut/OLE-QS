- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 美國國內的不同族裔移民，除了帶來強大的經濟動力之外，也使社會呈現多元樣貌，然而多元族裔與文化的現象並非總是受到支持。美國近年來從過去「熔爐論」的主張，逐漸轉變為「多元文化主義」的觀點，有關此一轉變，下列敘述何者正確？
  options:
  - label: A
    content: 熔爐論主張各族裔移民保留各自文化
  - label: B
    content: 1960 年代民權運動後，刺激熔爐論的誕生
  - label: C
    content: 兩種論點皆主張各文化應融合為一
  - label: D
    content: 大沙拉碗被用來比喻多元文化主義
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)熔爐論強調文化融合，往往會造成強勢人群的文化成主流，少數族裔的文化遭到不同程度的忽略。(B) 1960 年代，多元文化主義抬頭，熔爐論逐漸被取代。(C)沙拉碗代表多元文化主義，強調多元差異，彼此互相尊重、包容並對不同文化進行保留，而非合而為一。
  tags:
    unit:
      code: HI-S1-2-1
      book: 選修歷史I 族群、性別與國家的歷史
      chapter: 原住民、移民與殖民
      title: 移民與殖民
      std: true
