- id: doc_112_彰化_彰化女中_社會_歷史_選修歷史I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: Eduardo Galeano 在他的《拉丁美洲：被切開的血管》中寫了這段話：「1492 年起，美洲原住民發現原來他們是印第安人（印度人），發現他們住在美國，發現他們沒穿衣服，發現『原罪』的概念，發現他們必須對從另一個世界來的國王和王國忠誠，發現他們必須信仰來自另一片天空的神，這位神發明了罪惡感和衣服，這位神會把崇拜太陽、月亮、地球和雨的人們活活燒死。」請問從上文來看，作者是如何看待海外探險帶來的影響？
  options:
  - label: A
    content: 移民者帶領美洲原住民走向文明化
  - label: B
    content: 文化交流下使原住民大開眼界
  - label: C
    content: 原住民飽受殖民者的奴役與帶來的疾病肆虐
  - label: D
    content: 原住民的傳統生活與文化遭受抹滅
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文的敘述可以看出是在諷刺經歷大航海時代後的美洲，被來自大西洋彼端的歐洲人侵略與征服下，「發現」不同的宗教信仰、政治領袖，而從「發現他們住在美國、發現他們沒穿衣服，神會把崇拜太陽、月亮、地球和雨的人們活活燒死。」以上描述都可看到，在歐洲的侵略下，美洲原住民被迫否定自身的生活與信仰，以及對自身土地的稱呼，一切都必須以歐洲人的立場看待自己原本的社會，故選(D)。
