- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 將下列固體溶於純水中達到平衡，則各物質的溶度積表示法，何者<u>錯誤</u>？
  options:
  - label: A
    content: Al(OH)$_{3}$(s)之$K_{sp}$＝27[$Al^{3＋}$]$^{4}$
  - label: B
    content: $MgCO_{3}$(s)之$K_{sp}$＝[$CO_{3}^{2－}$]$^{2}$
  - label: C
    content: $MgNH_{4}PO_{4}$(s)之$K_{sp}$＝[$NH_{4}^{＋}$]$^{3}$
  - label: D
    content: $CaCl_{2}$(s)之$K_{sp}$＝$\frac{ 1 }{ 2 }$[$Cl^{－}$]$^{3}$
  - label: E
    content: Mg(OH)$_{2}$(s)之$K_{sp}$＝[$Mg^{2＋}$]$^{3}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '附表是硝酸銀、硝酸鉛、硝酸鋇、硝酸鎳等四種溶液分別與氯化鈉、硫酸鈉、硫化鈉等三種溶液作用的結果。 （所有溶液的濃度都是0.01 M） 有一溶液含$Ag^{＋}$、$Pb^{2＋}$、$Ni^{2＋}$三種離子各0.01 M，若使用均為0.01 M的NaCl、$Na_{2}SO_{4}$、$Ns_{2}$S溶液作為試劑，使$Ag^{＋}$、 $Pb^{2＋}$、$Ni^{2＋}$分離，則滴加試劑的順序應為下列何者？

    |  | $AgNO_{3}$ | Pb($NO_{3}$)$_{2}$ | Ba($NO_{3}$)$_{2}$ | Ni($NO_{3}$)$_{2}$ |

    | --- | --- | --- | --- | --- |

    | NaCl | 白色沉澱 | 白色沉澱 | － | － |

    | $Na_{2}SO_{4}$ | － | 白色沉澱 | 白色沉澱 | － |

    | $Na_{2}$S | 黑色沉澱 | 黑色沉澱 | － | 黑色沉澱 |

    | （－表示無沉澱） |  |  |  |  |'
  options:
  - label: A
    content: NaCl、$Na_{2}SO_{4}$、$Ns_{2}$S
  - label: B
    content: $Ns_{2}$S、NaCl、$Na_{2}SO_{4}$
  - label: C
    content: NaCl、$Ns_{2}$S、$Na_{2}SO_{4}$
  - label: D
    content: $Na_{2}SO_{4}$、$Ns_{2}$S、NaCl
  - label: E
    content: $Na_{2}SO_{4}$、NaCl、$Ns_{2}$S
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 首先加入$SO_{4}^{2-}$，產生$PbSO_{4}$沉澱；再加入$Cl^{-}$，產生AgCl沉澱；最後加入$S^{2-}$，產生NiS沉澱。故選(E)。
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列有關物質導電性的敘述，何者正確？
  options:
  - label: A
    content: 金屬及電解質的導電方式相同，皆為利用可移動的自由電子而導電
  - label: B
    content: 氨（$NH_{3}$）是分子化合物，其水溶液不具導電性
  - label: C
    content: 離子化合物都是電解質，其固態、熔融態及水溶液皆可導電
  - label: D
    content: 氯化氫（HCl）為分子化合物，其液態不導電
  - label: E
    content: 分子化合物皆為非電解質
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)金屬以自由電子導電，電解質以陰陽離子導電；(B)氨為鹼性物質，水溶液可導電；(C)離子化合物於固態無法導電；(D)正確；(E)酸、鹼仍為電解質。故選(D)。
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 已知下列各溶液的濃度均為0.1 M，則兩溶液等體積混合後，何組仍能以高濃度共存？（假設體積具有加成性）
  options:
  - label: A
    content: NaCl、Pb($NO_{3}$)$_{2}$
  - label: B
    content: $Na_{2}$S、Zn($NO_{3}$)$_{2}$
  - label: C
    content: $NH_{4}$Cl、$Na_{2}SO_{4}$
  - label: D
    content: $BaCl_{2}$、$K_{2}CrO_{4}$
  - label: E
    content: $MgCl_{2}$、$K_{2}CO_{3}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)產生$PbCl_{2}$沉澱；(B)產生ZnS沉澱；(C)不反應；(D)產生$BaCrO_{4}$沉澱；(E)產生$MgCO_{3}$沉澱。故選(C)。
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列有關解離說與電解質敘述，何者<u>有誤</u>？
  options:
  - label: A
    content: 石墨會導電所以屬於電解質
  - label: B
    content: 電解質解離後陽離子的莫耳總數與陰離子的莫耳總數不一定相等
  - label: C
    content: 電解質在溶液中陽離子的總電量與陰離子的總電量必相等
  - label: D
    content: 陰離子帶負電，陽離子帶正電
  - label: E
    content: 電解質的導電方式是藉由陰、陽離子的移動
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)電解質需於水溶液中或熔融狀態可導電者，方可稱為電解質。石墨是於固態導電，但不溶於水，故不可稱為電解質。故選(A)。
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s3_2
  section: 3
  number: 2
  type: calc
  page: 3
  stem: 已知25℃時，$Ag_{2}CrO_{4}$(s)之$K_{sp}$＝4×$10^{－11}$，求$Ag_{2}CrO_{4}$(s)在0.1 M $K_{2}CrO_{4}$水溶液中的溶解度為多少M？（4分）
  answer:
  - $10^{-5}$ M
  answer_status: verified
  answer_source: answer_key
