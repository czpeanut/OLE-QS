- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列何組溶液加入鹽酸（HCl）後，兩種離子都會產生沉澱反應？
  options:
  - label: A
    content: $Hg^{2＋}$、$Fe^{3＋}$
  - label: B
    content: $Pb^{2＋}$、$Ag^{－}$
  - label: C
    content: $Al^{3＋}$、$Hg_{2}^{2＋}$
  - label: D
    content: $Fe^{2＋}$、$Al^{3＋}$
  - label: E
    content: $Al^{3＋}$、$Cu^{2＋}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 可與$Cl^{-}$產生沉澱的陽離子：$Ag^{+}$、$Pb^{2+}$、$Cu^{+}$、$Hg_{2}^{2+}$、$Tl^{+}$。故選(B)。
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 定溫下，將$PbF_{2}$固體溶於水中，測得其溶解度為2×$10^{－3}$ M，則$PbF_{2}$在此溫度下的$K_{sp}$值應為多少？（已知$PbF_{2}$＝245）
  options:
  - label: A
    content: 1.6×$10^{－6}$
  - label: B
    content: 3.2×$10^{－6}$
  - label: C
    content: 1.6×$10^{－8}$
  - label: D
    content: 3.2×$10^{－8}$
  - label: E
    content: 1.6×$10^{－10}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 若某一可逆反應的平衡常數K值極大，則可說明該可逆反應易出現何種現象？
  options:
  - label: A
    content: 逆向反應速率很快
  - label: B
    content: 平衡的位置趨向生成物
  - label: C
    content: 正向反應速率很快
  - label: D
    content: 平衡的位置趨向反應物
  - label: E
    content: 該反應的活化能很高
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: K值越大，反應越向右，即正反應趨勢越大，反應趨向生成物。故選(B)。
- id: doc_110_屏東_屏東高中_自然_化學_選修化學III_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 同溫時，將鉻酸銀固體溶於下列何者中，其溶解度最低？（已知鉻酸銀的$K_{sp}$為1.12×$10^{－12}$）
  options:
  - label: A
    content: 0.1 M硝酸銀水溶液
  - label: B
    content: 0.01 M硝酸銀水溶液
  - label: C
    content: 0.1 M鉻酸銀水溶液
  - label: D
    content: 0.1 M硝酸鈉水溶液
  - label: E
    content: 純水
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 鉻酸銀化學式為$Ag_{2}CrO_{4}$，可微量解離成$2Ag^{+}$＋$CrO_{4}^{2-}$。加入同離子可使其溶解度降低，其中$Ag^{+}$的係數較大，同離子效應較明顯，故選(B)。
