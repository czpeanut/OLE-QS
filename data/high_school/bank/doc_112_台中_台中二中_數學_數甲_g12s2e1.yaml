  stem: 試計算$\left( \frac{\sqrt{2}}{1 +i} \right) ^{20}+ \left( \frac{\sqrt{2}}{1 -i} \right) ^{20}$＝＿＿＿＿。
  explanation: '$\frac{\sqrt{2}}{1 +i}$＝$\frac{\sqrt{2}}{1 +i}\times \frac{1 -i}{1 -i}$＝$\frac{\sqrt{2} (1 -i)}{2}$＝$\frac{\sqrt{2}}{2} (1 -i)$

    $\frac{\sqrt{2}}{1 -i}$＝$\frac{\sqrt{2}}{1 -i}\times \frac{1 +i}{1 +i}$＝$\frac{\sqrt{2} (1 +i)}{2}$＝$\frac{\sqrt{2}}{2} (1 +i)$

    $\Rightarrow\left( \frac{\sqrt{2}}{1 +i} \right) ^{20}+ \left( \frac{\sqrt{2}}{1 -i} \right) ^{20}$＝$\left[ \frac{\sqrt{2}}{2} (1 -i) \right] ^{20}+ \left[ \frac{\sqrt{2}}{2} (1 +i) \right] ^{20}$＝$\left( \frac{\sqrt{2}}{2} \right) ^{20} \cdot 〔(1 -i)^{20} +(1 +i)^{20}〕$

    ∵（1－i）$^{2}$＝－2i

    （1－i）$^{4}$＝（－2i）$^{2}$＝－4

    （1－i）$^{20}$＝（－4）$^{5}$＝－$2^{10}$

    （1＋i）$^{2}$＝2i

    （1＋i）$^{4}$＝（2i）$^{2}$＝－4

    （1＋i）$^{20}$＝（－4）$^{5}$＝－$2^{10}$

    所求即為$\left( \frac{\sqrt{2}}{2} \right) ^{20} \cdot (- 2^{10} - 2^{10})$＝$2^{－10}$．（－$2^{11}$）＝－2'
