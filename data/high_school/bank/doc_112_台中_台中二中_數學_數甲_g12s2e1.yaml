  stem: 甲、乙二人同解實係數一元二次方程式 $x^{2}$＋ax＋b＝0，若甲算錯判別式得二根 3，1（其餘過程均正確），乙看錯 x 項係數得二根為 4，－2（其餘過程均正確），則原方程式的解為 ＿＿＿＿。
  explanation: '以 x＝4，－2 為根的方程式為（x－4）（x＋2）＝0

    $\Rightarrowx^{2}$－2x－8＝0

    ∵乙看錯 x 項係數 ∴$x^{2}$ 項、常數項係數是正確的

    以 x＝3，1 為根的方程式為（x－3）（x－1）＝0

    $\Rightarrowx^{2}$－4x＋3＝0

    ∵甲算錯判別式 D ∴$x^{2}$ 項、x 項係數是正確的

    說明：若方程式 $ax^{2}$＋bx＋c＝0 有兩根α、β，則α＋β＝$\frac{-b + \sqrt{D}}{2a}+\frac{-b - \sqrt{D}}{2a}$＝$-\frac{b}{a}$，由此可知兩根和不受判別式對錯影響，因此只算錯判別式，$x^{2}$ 項及 x 項係數仍是正確的

    由上述可知，正確的一元二次方程式為 $x^{2}$－4x－8＝0

    故原方程式的解為 x＝$\frac{4\pm 4\sqrt{3}}{2}$＝$2\pm 2\sqrt{3}$'
