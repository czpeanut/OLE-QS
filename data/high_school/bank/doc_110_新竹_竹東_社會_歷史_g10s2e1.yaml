questions:
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某則「徵婚啟事」刊登之後在社會間引起廣泛討論，其內容為：「第一、是不纏足；天足。第二、是識字的、第三、是男子不得娶妾，不能娶姨太太。第四、如果丈夫先死，那麼妻子可以改嫁。第五、意見不合可以離婚。」請問此徵婚啟事最可能刊登於哪一時期的報紙上？
  options:
  - label: A
    content: 自強運動期間
  - label: B
    content: 一次大戰期間
  - label: C
    content: 新文化運動期間
  - label: D
    content: 二次大戰期間
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 華人移居海外，第一代因為離開長期生活的家鄉，通常都會對家鄉有著較強烈的情感，但二代以後，由於自小生長在海外，對原鄉觀念逐漸淡薄，因此海外對他們來說才是他們的故鄉。這種認同的轉變可以從許多地方觀察到，例如：開始參政、身後處理方式的轉變、積極融入當地社會等。請問，下列哪些敘述可看出從「他鄉變故鄉」的轉變？
  options:
  - label: A
    content: 只想做生意賺錢並寄回家鄉，對當地沒有情感
  - label: B
    content: 只願意在唐人街活動，不願參加其他社區活動
  - label: C
    content: 只過傳統中國節日，並與中國人談論家鄉故事
  - label: D
    content: 積極參與當地議會選舉，從事該地區政治活動
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 竹東高中的圖書館希望同學嘗試蒐集資料，以便在日後校慶會上策展。主題方向與「南宋高宗時代的南遷漢人」事蹟相關，呈現的口號創意活潑為原則。請判讀下列主題，推斷哪一組的口號較符合歷史情境？
  options:
  - label: A
    content: 「南京」生活好「好玩」，欽宗徽宗攜美女同遊
  - label: B
    content: 天堂臨安，吃得到的家鄉味：包子饅頭麵食店
  - label: C
    content: 北漂青年的往南計畫，跟著女真人進攻蒙古國
  - label: D
    content: 「蒙會種」：讓蒙古人教你學最先進的農耕技術
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 十五至十六世紀間，某王國曾興建一座大型的宮殿，此建築物分為三部分：正殿為國王舉行各種典禮和議政的場所；北殿專為接待中國的冊封使之用：南殿自十七世紀初期開始，用來接待日本薩摩藩官員。該宮殿最可能位於：
  options:
  - label: A
    content: 朝鮮
  - label: B
    content: 暹羅
  - label: C
    content: 越南
  - label: D
    content: 琉球
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1937～1941年，日本國內的工業成長達15%，其中重化工業的成長更為明顯。請問促成當時重化工業明顯成長的主因為何？
  options:
  - label: A
    content: 適逢經濟大恐慌、亟力振興工業
  - label: B
    content: 因發現油田、石油量產大增
  - label: C
    content: 因應戰爭、軍需工業擴大需求
  - label: D
    content: 擴展國際貿易、因應外銷需求
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 中國歷史上有一個時代，在建國初期，便確立士兵由各地平民抽調而成，他們「出則為兵，入則為民」、「無事耕種，有事徵調」，必須世代為兵，不得隨意離開。這種兵制因士兵被派駐守在首都及其附近，軍士及其家屬就成為首都移民的大宗。請問根據上述，這是何種兵制？
  options:
  - label: A
    content: 明代衛所兵制
  - label: B
    content: 宋代募兵制
  - label: C
    content: 清代八旗兵制
  - label: D
    content: 唐代府兵制
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 「（清朝政府）及到庚子年鬧出了漫天大禍，才曉得一味守舊萬萬不可，稍稍行了些皮毛新政。其實何曾行過？不過借此掩飾國民的耳目，討討洋人的喜歡罷了，不但沒有放了一線光明，那黑暗反倒加了幾倍。」從以上敘述可知這反映了清末部分知識分子的何種看法？
  options:
  - label: A
    content: 知識分子逐漸遠離政治避免殺身之禍
  - label: B
    content: 開始認同革命是解決問題的唯一出路
  - label: C
    content: 傾向於在體制內實行改革的變法運動
  - label: D
    content: 知識分子認為洋人可以協助解決困局
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 旅遊手冊寫到：「這座城市的港口接收了大量荷蘭輸入的蠶絲與砂糖，前者是初期主要輸入品，後來日本自製蠶絲增加後，輸入品以砂糖取代，尤其東印度公司所在的現在印尼產砂糖大受歡迎，其他輸入品包含玻璃、歐洲陶瓷器、藥物、金屬、書籍等。現在這座城市的名產蛋糕（カステラ）底部的砂糖，就是其飲食文化受到貿易影響的象徵。1624年所創立的「福砂屋」更是至今前往遊玩的旅客必逛的。請問文中的城市指得是？
  options:
  - label: A
    content: 廣島
  - label: B
    content: 京都
  - label: C
    content: 大阪
  - label: D
    content: 長崎
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 鴉片戰爭以後，清朝陸續被迫開放通商口岸，而這些新興的工業城市吸引大批農村小鎮人口的湧入，形成新移民浪潮。如○○在50年左右，人口大幅增加了112萬人，不愧為中國近代第一大城。請問○○最有可能是哪一個城市？
  options:
  - label: A
    content: 天津
  - label: B
    content: 淡水
  - label: C
    content: 上海
  - label: D
    content: 廈門
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 某位傳教士來到中國傳教，為求教義可以在中國生根，乃揉合佛教與儒家經典於內。如天主之辨，則解釋為天主降生西土，並附會六經中上帝之說，以合西方天主在中國的身分。又將西方教義的天堂地域觀與佛教結合，如此一來，中國人就容易接受教義了。請問根據上文，這位傳教士來中國時最容易遇到下列哪一皇帝？
  options:
  - label: A
    content: 明太祖
  - label: B
    content: 明神宗
  - label: C
    content: 清世宗
  - label: D
    content: 清高宗
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「他族逼處，故土新歸」，1884年新疆建省，定名新疆省。「新疆」一詞正式成為特指中國西域地區的專有名詞，沿用至今。請問下列哪位歷史人物曾協助中國政權控制新疆地區？
  options:
  - label: A
    content: 左宗棠
  - label: B
    content: 蔡元培
  - label: C
    content: 孫中山
  - label: D
    content: 李鴻章
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「孔子與憲法，渺不相涉者也。吾今於此標題，寧非怪誕之尤？然於怪誕標題之前，久已有怪誕事實之發見。……怪誕之事實者，何也？則憲法草案中規定『國民教育以孔子之道為修身大本』之事是也。」關於這段文稿，以下何者的解讀正確？
  options:
  - label: A
    content: 文章應該出現於新文化運動時期
  - label: B
    content: 內容反映了李鴻章的思想
  - label: C
    content: 作者為戊戌變法的先驅
  - label: D
    content: 作者認為中國未有憲法之基礎
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 以下兩則是與美國的日本移民相關的資料： 資料一：《紳士條約》表面上滿足了美日雙方的要求，一方面，加州反日民眾的躁動情緒得以安撫，他們認為有了這個協定，日本移民就不會洶湧而來；日本政府則認為條約是雙方商談的結果，並未損及顏面。但實際上，條約讓日本移民問題更為複雜，大部分移民美國的第一代都是單身男性，在簽訂條約後一部份人選擇返回家鄉，一部分人選擇把妻兒帶到美國，而另一部份未結婚又不想回日本的移民開始利用「照片新娘」組成家庭，使得在美國的日本移民反而增加。 資料二：一名日裔美國人，在自己的雜貨店前掛起「我是美國人」的牌子，不過這家店很快就因為店主人被送進拘留所而關門。 請問資料一與資料二有何關聯？
  options:
  - label: A
    content: 資料一與資料二同時，是《紳士條約》頒布後產生的效應
  - label: B
    content: 資料二與資料一無關，美國對亞裔族群向來都採歧視政策
  - label: C
    content: 資料二較資料一更晚，珍珠港事變使美國更排斥日本移民
  - label: D
    content: 資料二較資料一更早，是日本移民美國早期被歧視的歷史
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 三一運動發生於1919年，由朝鮮國內天道教、基督教、佛教的領袖所計畫與策動，包括許多知名民族主義宗教領袖。他們發表獨立宣言書，宣告國際「朝鮮為獨立的國家」。關於三一運動的敘述下列何者為是？
  options:
  - label: A
    content: 主張透過暴力手段取得朝鮮獨立地位
  - label: B
    content: 此運動受一戰之後國際民族自決風潮的鼓舞
  - label: C
    content: 由撰寫「朝鮮亡國史」的潘佩珠領導
  - label: D
    content: 由運動領袖可知這是一場追求宗教治國的運動
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 根據資料顯示，1870到1930年美國華人人口統計，其總人口在19世紀末至20世紀初一度大減，下列關於華裔人口減少的原因為何？
  options:
  - label: A
    content: 華人因落葉歸根的心態，大量返回中國
  - label: B
    content: 清朝政府限制華工移至美國等地區工作
  - label: C
    content: 《排華法案》通過，限制華工移入美國
  - label: D
    content: 美國人口增加勞動力充足，已不需華工
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 19世紀的中國曾經出現奇怪的現象，某個組織規定團員男女七日內宜穿紅色衣褲，並沿街喊唱：「婦女不梳頭，砍去洋人頭，婦女不裹腳，殺盡洋人笑呵呵。」請問文中組織最有可能是下列何者？
  options:
  - label: A
    content: 義和團民
  - label: B
    content: 立憲仕紳
  - label: C
    content: 革命黨員
  - label: D
    content: 太平天國
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 清朝中葉後，有不少華工前往美國，當時美國為何有召募大批華工的需求？
  options:
  - label: A
    content: 西部拓荒過程中，招募中國人對抗印地安人
  - label: B
    content: 南北戰爭時大量黑奴死亡，造成勞動力不足
  - label: C
    content: 南北戰爭爆發後，招募華工往南方建築堡壘
  - label: D
    content: 美國解放黑奴後，需要新的勞動力從事建設
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 京城因某勢力入侵而失守，導致君臣奔逃在外。君王召集大臣商議在何處定都的時候，大臣紛紛提出建議，有的說：「願陛下西幸巴蜀，用陜右之兵，留重臣使鎮江南，撫淮甸，破敵人之計，回天下之心，是為上策。」有的說：「東南形勢莫重於建康，實為中興根本，且使人主（國君）居此，北望中原，常懷憤惕，不敢暇逸。而臨安僻在一隅，內則易生玩肆，外則不足以號召遠近，系中原之心。請臨建康，撫三軍，以圖恢復」但國君最後既未至巴蜀，亦未定都建康。請問這是什麼情勢下發生的動亂？
  options:
  - label: A
    content: 永嘉之亂晉室南渡
  - label: B
    content: 唐玄宗時安史之亂
  - label: C
    content: 靖康之難高宗南渡
  - label: D
    content: 宋徽宗時方臘變亂
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 清末，李鴻章支持劉銘傳倡議，其詞曰：「處今日各國皆有鐵路之時，而中國獨無，譬猶居中古以後而棄舟車，其動輒於後人也必矣。」但更多人「群相批駭」，責罵其兩人「其欲破壞列祖列宗之成法以亂天下」，而且宣言鐵路「行之外夷則行，行之中國則不可」。請問：上述爭議發生於哪一場變革之時？
  options:
  - label: A
    content: 自強運動
  - label: B
    content: 庚子後新政
  - label: C
    content: 戊戌變法
  - label: D
    content: 立憲運動
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 光是1897到1907年間，日本就為夏威夷甘蔗園提供了超過十二萬名勞工。日本人會前往夏威夷，與當時日本經濟惡化及天皇為開發工業而徵收高額稅收有關，農民無法承受經濟上的衝擊，轉而移往夏威夷工作，尋找一條活路。根據上文資料，下列敘述何者正確？
  options:
  - label: A
    content: 文中所說的時間應是第一次世界大戰
  - label: B
    content: 文中的天皇應是推動維新的昭和天皇
  - label: C
    content: 文中天皇徵收稅金是為了侵略東南亞
  - label: D
    content: 文中可知經濟是日本移民的重要因素
- id: doc_110_新竹_竹東_社會_歷史_g10s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 日本思想家福澤諭吉認為：「汲取歐洲文明，須先其難而後其易。先變革人心，然後改政令，後達於物質。能照此順序，雖困難終能成功。」從其論點來看，當時中、日兩國遭遇西方勢力入侵的態度與因應之道。下列敘述何者正確？
  options:
  - label: A
    content: 日本明治天皇因受到武士支持，所以可改革迅速
  - label: B
