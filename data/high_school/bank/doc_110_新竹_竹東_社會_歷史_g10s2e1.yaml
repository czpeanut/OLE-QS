  stem: 根據資料一的內容，妖貓作祟與數十年前的楊貴妃之死息息相關，請問導致楊貴妃死亡的事件是下列哪一場動亂？
  options:
  - label: A
    content: 永嘉之亂
  - label: B
    content: 安史之亂
  - label: C
    content: 靖康之難
  - label: D
    content: 靖難之變
  group_stem: ◎資料一：「妖貓傳」是中國導演陳凱歌根據日本小說改編的電影。故事發生在中唐時期的長安城，白居易當時在京城擔任起居郎，並為日後作品蒐集素材。此時長安城內接連發生離奇的命案，連當時皇帝唐德宗也難逃厄運。遠渡重洋而來的日本僧人空海發現這些離奇事件都與一隻神出鬼沒的妖貓有關。於是，白居易與空海展開調查。根據李白的〈清平調〉：「雲想衣裳花想容，春風拂檻露華濃」，以及來自日本而後在中國任官的阿部仲麻呂（晁衡）生前所留下的日記，白居易與空海發現妖貓作祟與數十年前傾國傾城的楊貴妃之死息息相關，兩人一同見證了大唐帝國曾有的榮光，也揭開當年隱瞞至今的陰謀。 資料二：電影中的空海與阿部仲麻呂，都是真實的歷史人物。空海前來中國求法，後成為日本密宗始祖，並根據中國漢字草書創日文平假名；阿部仲麻呂為日本遣唐使使節團成員，後在中國任官，甚至取漢名「晁衡」。
