  stem: 題幹當中的香港罷工其實受到中國廣州國民黨政府的介入，配合當時的時間，請問最有可能的罷工背景為何？
  options:
  - label: A
    content: 為支持光緒皇帝主導下的維新變法
  - label: B
    content: 為響應同盟會發動革命的海外活動
  - label: C
    content: 結合一次大戰後的反帝國主義浪潮
  - label: D
    content: 配合國民黨政府對日本的抗日行動
  group_stem: ◎郭春秧，曾經名列印尼「四大糖王」之一，日後他去了臺灣，又成為呼風喚雨的商界大佬，進入中晚年，事業版圖更擴展到香港等地。郭春秧的父親郭河北早逝，1877年，18歲的郭春秋遠渡重洋，投奔在印尼的叔叔，學習貿易經營。到印尼後，郭春秧在叔叔開辦的糖廠幫忙。一戰時，糖價暴跌，但郭春秧卻大量買進，戰爭結束後糖價迅速回升。正因為他經營的遠見和前瞻，一度躍居爪哇四大糖王之列。為了考察糖業市場，郭春秧於清末登上臺灣島，由於嗅覺到種茶的商機，決定獨立創業，在臺灣落腳經營茶葉。1921年，郭春秧投資位於香港北角發電廠邊的一片天地，欲圖通過填海造地，興建糖廠，卻遇上香港爆發「省港大罷工」，局勢不穩，加上國際糖價波動很厲害，持續下跌，無奈之下，郭春秋被迫改變主意，將新開發的天地改爲地產開發項目，並興建樓房收租。日後，港英當局將新開發天地其中的一條街，命名為「春秧街」
