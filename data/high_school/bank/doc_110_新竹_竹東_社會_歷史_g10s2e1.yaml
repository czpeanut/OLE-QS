  group_stem: ◎我們的國家一直深受宗主國的影響，只學中國歷史，這是因為自古以來我們自己沒有國文（字），只能借助於他人的語言、文字而學，而致自身無任何特色……19世紀，我們最後一個王朝—阮福映建立阮氏政權，是受法國的扶助而成立，因此法國人得以獲得在本國自由傳教和經商的權利。法國人通過嚴密的分級管理制度，使教會的影響深入最基層的教徒之中，有的村落甚至完全天主教化。但之後繼位的明命、紹治、嗣德等諸位君主，卻尊孔崇儒，並採取鎮壓天主教的措施。1858年，法國當地禁教、殘殺教徒為藉口發動侵略戰爭，並在1885年後，開啟了為期近百年的殖民統治，進行資源的掠奪。法國為了方便統治我們國家，以羅馬拼音做為官方語言，雖然引進現代化的基礎建設，卻未積極提升我們國民的教育文化水準。
