    content: 此時的日本已入侵中國，戰爭爆發，皆因知識分子提倡日本應該與東亞國家結盟
  group_stem: ◎「德川幕府第八代將軍吉宗，鑒於幕府財政入不敷出，開始大力推行許多新政策。其中為解決封建經濟的停滯，因而重視實用的學問，不但解除部分禁書令，亦准許輸入中國人翻譯與基督教無相關之西方科技圖書，如《幾何原本》、《泰西水法》、《職方外紀》等書，促成日後「蘭學」的發展。……而蘭學的興起，使日本與西歐文明世界開始接觸，累積許多關於西方科學及工業新知，奠定日本近代化基礎，同時亦提高了一般人對世界情勢的認識。其後，一群接受洋學之士，對於幕府專制政權和處理『黑船事件」方式表示不滿，有志之士除了批評幕府的鎖國政策，並主張實用經濟，藉政治、兵制的西化運動改革來統治世界。……19世紀末，日本有位知識分子著文如下：『日本雖位於亞細亞之東，但日本國民精神已脫離亞細亞的頑固守舊，邁向西洋文明之風，但不幸的是，鄰近有兩個硬把自己關在房間內的國家，皆不思改進之道，也因此，我國與其等待鄰國的開明，不如脫離其行列與西洋文明國共進退，而對待那兩國，只要模仿西洋人對他們的態度即可，不必特別予以同情。』」
