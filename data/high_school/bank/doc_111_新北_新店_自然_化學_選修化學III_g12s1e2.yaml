- id: doc_111_新北_新店_自然_化學_選修化學III_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 在<u>等濃度</u>的鹽酸與氨水以<u>等體積</u>混合後，溶液中各物種濃度關係何者正確？
  options:
  - label: A
    content: '[$NH_{4}^{＋}$]＝[$Cl^{－}$]'
  - label: B
    content: '[$H^{＋}$]＝[$OH^{－}$]'
  - label: C
    content: '[$H^{＋}$]＞$\sqrt{K_{w}}$＞[$OH^{－}$]'
  - label: D
    content: '[$NH_{3}$]＝[$NH_{4}^{＋}$]'
  - label: E
    content: '[$OH^{－}$]＝[$NH_{4}^{＋}$]＋[$H^{＋}$]'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 等濃度的鹽酸與氨水等體積混合：$NH_{3}$(aq)＋HCl(aq) → $NH_{4}^{＋}$(aq)＋$Cl^{－}$(aq)。又$NH_{4}^{＋}$於水中會水解產生少量的$NH_{3}$(aq)與$H^{＋}$(aq)，故溶液會呈現弱酸性。 (A)錯誤，因$NH_{4}^{＋}$會少量水解；(B)錯誤，因$NH_{4}^{＋}$會少量水解產生$H^{＋}$；(C)正確，溶液呈現弱酸性；(D)錯誤，$NH_{4}^{＋}$只會少量水解，故仍是多數；(E)溶液中尚有$Cl^{－}$存在，故應為：[$Cl^{－}$]＋[$OH^{－}$]＝[$H^{＋}$]＋[$NH_{4}^{＋}$]。故選(C)。
  tags:
