  stem: 某單質子酸（HA）在不同比例之[$A^{－}$]／[HA]水溶液中的pH值右圖，此弱酸（HA）之$K_{a}$值為何？
  options:
  - label: A
    content: 5×$10^{－6}$
  - label: B
    content: 2×$10^{－5}$
  - label: C
    content: 2×$10^{－4}$
  - label: D
    content: 5×$10^{－4}$
  - label: E
    content: 1×$10^{－5}$
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_111_新北_新店_自然_化學_選修化學III_g12s1e2/s1_6_f1.png
