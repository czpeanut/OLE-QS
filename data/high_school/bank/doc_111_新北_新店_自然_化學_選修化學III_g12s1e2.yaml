  stem: 濃度為0.1 M的單質子酸HA水溶液，在常溫下測得其pH＝1，則下列敘述哪些正確？
  options:
  - label: A
    content: 在阿瑞尼斯酸鹼理論中，HA為弱酸
  - label: B
    content: 根據布-洛酸鹼理論，HA與水的反應時將$H^{＋}$傳遞給$H_{2}$O，故$H_{2}$O為鹼性物質
  - label: C
    content: 根據布-洛酸鹼理論，$A^{－}$之鹼性比$OH^{－}$強
  - label: D
    content: 根據布-洛酸鹼理論，標準狀態下，$H_{2}CO_{3}$易與$A^{－}$反應生成HA與$HCO_{3}^{－}$
  - label: E
    content: $H_{2}$O可在部分反應中釋放$H^{＋}$，又可在其他反應中獲得$H^{＋}$，像這樣的物質即為布-洛酸鹼理論中的兩性酸鹼物質
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 0.1 M的酸，可解離出0.1 M的$H^{＋}$，為完全解離，可推測其為強酸；(B)正確，強酸的酸性比水強，會將$H^{＋}$傳遞給水；(C)錯誤，越強的酸，其共軛鹼為越弱的鹼；(D)錯誤，$H_{2}CO_{3}$為弱酸，無法把$H^{＋}$傳遞給$A^{－}$；(E)正確。故選(B)(E)。
