  stem: 有兩杯體積均為100 mL的水溶液，甲為pH＝3的鹽酸，乙為pH＝3的醋酸，各加入<u>足量</u>鎂金屬進行反應，反應產生氫氣，下列敘述何者正確？
  options:
  - label: A
    content: 原溶液中[$H^{＋}$]濃度，甲＞乙
  - label: B
    content: 最初，溶液中兩種酸濃度相等
  - label: C
    content: 甲乙產生的氫氣量相同
  - label: D
    content: 乙產生的氫氣較多
  - label: E
    content: 剛放入鎂時，生成氣體的速率，甲＝乙
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 兩者[$H^{＋}$]＝$10^{－3}$ M，但鹽酸為強酸、醋酸為弱酸，故可知鹽酸濃度＝$10^{－3}$ M、醋酸濃度＞$10^{－3}$ M。(A)應相等；(B)醋酸較大；(C)因醋酸濃度較高，可參與反應之$H^{＋}$更多，故醋酸較多；(D)正確；(E)因$H^{＋}$濃度相同，故正確。故選(D)。
