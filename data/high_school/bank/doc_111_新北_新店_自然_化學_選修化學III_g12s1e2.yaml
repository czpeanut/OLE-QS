- id: doc_111_新北_新店_自然_化學_選修化學III_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 下列哪一選項中的各個化合物，溶於水後<u>皆呈鹼性</u>？
  options:
  - label: A
    content: $NH_{4}$Cl、Cu($NO_{3}$)$_{2}$、$C_{2}H_{5}$OH
  - label: B
    content: $NH_{4}$CI、KCl、$NaHCO_{3}$
  - label: C
    content: Cu($NO_{3}$)$_{2}$、NaF、$C_{2}H_{5}$OH
  - label: D
    content: NaF、$K_{2}CO_{3}$、$NaHCO_{3}$
  - label: E
    content: KCl、Cu($NO_{3}$)$_{2}$、$K_{2}CO_{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 強酸的陰離子（$Cl^{－}$、$NO_{3}^{－}$…等）以及強鹼的陽離子（$Na^{＋}$、$K^{＋}$…等）溶於水中不水解，為中性，其餘的陰離子會水解呈鹼性、陽離子會水解呈酸性。另外，$HCO_{3}^{－}$為鹼性的酸式鹽，$C_{2}H_{5}$OH不解離呈中性。 (A)酸性、酸性、中性；(B)酸性、中性、鹼性；(C)酸性、鹼性、中性；(D)皆為鹼性；(E)中性、酸性、鹼性。故選(D)。
