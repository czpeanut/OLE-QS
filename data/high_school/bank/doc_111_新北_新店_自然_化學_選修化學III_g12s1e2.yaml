  answer_source: answer_key
  explanation: 當$\frac{[A^{-}]}{[HA]}$＝2時，pH＝5，即[$H^{＋}$]＝$10^{－5}$ M。由$K_{a}$的定義可得：$K_{a}$＝$\frac{[H^{+}][A^{-}]}{[HA]}$＝2×$10^{－5}$。故選(B)。
