  - label: A
    content: $H_{2}CO_{3}$
  - label: B
    content: HCI
  - label: C
    content: $HNO_{3}$
  - label: D
    content: $CH_{3}$COOH
  - label: E
    content: $H_{2}SO_{4}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)(D)皆為一元酸，(A)(E)為二元酸，故與等量的氫氧化鈉中和後，(A)、(E)仍有可解離的氫離子。又(E)為強酸、(A)為弱酸，故(E)的pH值最低。
