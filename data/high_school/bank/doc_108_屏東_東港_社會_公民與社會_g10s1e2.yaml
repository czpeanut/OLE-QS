  group_stem: ◎ 題組：2018年11月24日，我國舉辦4年1次的「九合一選舉」，共包含直轄市長、縣市長、直轄市議員、縣市識員、鄉鎮市民代表、村里長、直轄市原住民區長和區民代表等9種地方公職人員；除此之外，還合併舉辦10個公投案的投票。有些選民表示，一次選這麼多公職，又有那麼多公投案，實在令人眼花繚亂，根本沒有時問好好詳細研究；有人甚至覺得太麻煩，打算不去投票，讓其他人去煩惱就好。
