- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 表內閣制國家共有10個行政區，各行政區的國會議員選舉投票結果如下表所示。如果該國國會總共有20個席次，政黨代表與地方選區席次各半，並且各自計算；其中，選民可以投2票，1票投給政黨，1票投給選區候選人。
  options:
  - label: A
    content: 甲黨可以與任一政黨結盟，都能組成過半多數政府
  - label: B
    content: 丙黨可在甲乙政黨間，扮演關鍵角色爭取組閣利益
  - label: C
    content: 乙黨擁有穩定過半的多數支持，可以單獨組成政府
  - label: D
    content: 丁黨是國會中席次最少的政黨，沒有機會加入內閣
