  group_stem: ◎ 題組：1812年美國麻薩諸塞州州長傑利（Elbridge Gerry）進行所謂的的不規則選區劃分，將在野黨州議員的鐵票選區劃得四分五裂，猶如蠑螈（salamander）的變形蟲一樣，而有助於執政黨州議員增加的席次，從而被批評為「只顧所屬黨派私利的選區劃分」。所以，有人就將這種不公平的選區劃分稱為「傑利蠑螈」(gerrymandering)，也就是州長Gerry和salamander兩字合組而成。
