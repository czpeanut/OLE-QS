- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 某縣最近為了要不要蓋石化工業區而引發爭論，有些人贊成，認為可以帶來工作機會、提振經濟發展；有些人則反對，認為會汙染環境、影響健康。根據幾家媒體民調，支持工業區與反對工業區的該縣選民，比例大約是35%：65%。某甲要爭取該縣某公職，其競選團隊觀察其他候選人的立場後，決定全力支持石化工業區進駐，他們估計如此將能獲得勝選所需的票數。請問某甲應該是競選下列哪個職務？
  options:
  - label: A
    content: 縣長
  - label: B
    content: 縣議員
  - label: C
    content: 該縣的區域立委
  - label: D
    content: 全國不分區立委
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 某生撰寫研究報告：題目為：「黨政運作之總統制與內閣制初探」，以下是其論文中的部分觀點：請選出正確論點的組合？(甲)總統制比內閣制來得民主，因為總統有公民直選，總理（首相）卻是由國會多數黨領袖擔任、(乙)實行總統制的國家政局較為穩定，且可避免形成總統獨裁、(丙)通常總統制的國家，國會無權倒閣，總統也不能解散國會、(丁)我國總統有權解散國會，此權力偏向內閣制國家體制
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
