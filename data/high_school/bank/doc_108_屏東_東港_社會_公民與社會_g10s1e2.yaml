- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 有關弱勢群體與差別待遇的敘述，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: 有差別待遇就不平等
  - label: B
    content: 政治哲學家羅爾斯（John Rawls）曾指出平等是社會正義的首要原則
  - label: C
    content: 平等原則應包括每個門都能獲得同等之自由；讓社會中最弱勢的人獲得最多的支持與照顧
  - label: D
    content: 照顧弱勢團體不是一種施捨，也不是一種基於同情悲憫之心而進行的慈善服務
  - label: E
    content: 保障個人尊嚴是人權的根本意涵
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 為了避免行政權兼考試權會造成徇私用人，以及立法權兼監察權會造成國會專制，我國政府體制上採五權分利，職責分公、各司其職。關於我國中央組織的職權及運作，下列敘述何者正確？
  options:
  - label: A
    content: 行政院掌理各種國家考試，及公務人員的任用考核事項
  - label: B
    content: 司法院設公務員懲戒委員會，專司審理正副總統彈劾案
  - label: C
    content: 立法院以政黨及民意為歸屬，行使質詢、議決法律案
  - label: D
    content: 監察院負責監察事項，對公務人員行使糾舉、糾正權
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 一位民初的政治領袖以教育事項為例，解釋我國中央政府與地方政府權限劃分的概念。他寫道：「權之性質，不當以中央或地方為對象，而當以權之性質為對象。例如軍事外交，宜統一不宜分啟，此權之遺屬於中央者也。教育、衛生，隨地方情形而異，此權之遺屬於地方者也。更分析以言，……同一教育也，濱海之區，宜重水產，山谷之地宜側重礦業或林業，是故宜予以地方措施之自由；然學制，義務教育年限，中央不能不為劃一範圍，是中央亦不能不過問教育事業矣。」從上述內容可知，就教育事項而言，我國中央政府及地方政府權責分配，下列敘述何者正確？
  options:
  - label: A
    content: 由中央政府就全國統一事權，興辦各級學校
  - label: B
    content: 由地方政府依民情需要規劃及安排升學管道
  - label: C
    content: 中央執掌升學制度，學習內容則由地方規劃
  - label: D
    content: 由中央問查民意後，交由地方政府規劃辦理
