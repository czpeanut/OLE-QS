- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s2_40
  section: 2
  number: 40
  type: multiple
  page: 5
  stem: 2019年印度舉行下議院大選，這場包含9億選民、7個階段、耗時39天的民主大選，被《經濟學人》形容是「一隻笨重的大象跋涉在史詩般的旅途中」。號稱全球最大民主國家的印度，採取議會內閣制，這次的大選是要選出印度下議院的543席議員。從4月11日開始，印度大選會經過7個階段分區選舉一路選到5月19日，最後在5月23日公布選舉結果。這場耗時39天的大選跟9億選民息息相關，畢竟，要讓每位選民都能行使選舉權並不簡單，尤其印度是個幅員遼闊的國家，選民們說著22種官方語言，方言更是難以計數，再加上有上千萬人不識字，這些都要考慮進去。關於上述，請問下列敘述何者正確？
  options:
  - label: A
    content: 政黨得取得過半數的席次，若是單一政黨做不到，那不同政黨聯合起來掌握過半席次組成聯合政府也一樣有效
  - label: B
    content: 政黨得取得過半數的席次，若是單一政黨做不到，就須有第一大黨與第二大黨聯合起來掌握過半席次組成聯合政府
  - label: C
    content: 在國會裡獲得過半的政黨通常有其黨魁擔任經理，他可挑選國會議員擔任各部會首長組成內閣推行政策
  - label: D
    content: 國會多數黨或政黨聯盟向實權元首總統提名總理人選，由總統任命總理
  - label: E
    content: 因行政權與立法權融合，內閣閣員同時也是國會議員，能貫徹執政黨的意志和法案通過的效率
