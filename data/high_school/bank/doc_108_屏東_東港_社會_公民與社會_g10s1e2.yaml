- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 政黨的目的之一是透過公關選舉以獲得政權，但不同的選舉制度也會形塑不同的政黨生態。依據我國各項公職人員的選舉，以下選舉和者最有利於小黨的存在？
