  options:
  - label: A
    content: 自治事項
  - label: B
    content: 委辦事項
  - label: C
    content: 中央專屬事項
  - label: D
    content: 公同辦理事項
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 寵寵國國會議員「愛寵兒」因推動動保議題不遺餘力，受到國人的肯定，政府的領導人因此三顧茅廬，希望能夠請他擔任最高動保機關的首長，然而該議員考慮再三還是放棄了這個機會，理由是他必須辭去國會議員的職務。請問：寵寵國的政府體制屬於哪一種類型？
  options:
  - label: A
    content: 行政與立法合一的內閣制
  - label: B
    content: 行政與立法分權的內閣制
  - label: C
    content: 行政與立法分權的總統制
  - label: D
    content: 行政與立法合一的總統制
