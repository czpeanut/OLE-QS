  stem: 根據上文，反對者所指稱「美國總同違規避國會規範而發布緊急狀態的舉動，恐違背美國憲政精神」，是因為此舉與美國下列何種憲政設計的精神「相左」？
  options:
  - label: A
    content: 主權在民
  - label: B
    content: 權利分立
  - label: C
    content: 人人平等
  - label: D
    content: 司法獨立
  group_stem: ◎ 題組：美國聯邦政府因為華府朝野對「美墨圍牆」的預算談判破裂而進入「停擺」：民意機關未能通過足夠的預算，美國政府被迫關閉一些政府機構，暫停提供「非必要服務」，並要求政府僱員配合休假，以減少工資支出，估計將影響70萬個公務員家庭。國際金融分析機構標準普爾公司估計，美國聯邦政府停擺將嚴重打及消費者及投資者信心，恐造成超過60億美元的經濟損失。 對此，川普總統不惜發布行政命令，宣布美國南部邊境進入「國家緊急狀態」，以便繞過國會規範，直接動用軍方及州政府人力和經費。反對者表示，「透過發布緊急狀態，挪用地方州政府及軍方的合法分配款項，不僅會造成州政府原先預定進行的數項計畫擱置，以行政命令繞過國會立法權的舉動也違背美國憲政精神」。
