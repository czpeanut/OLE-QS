- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 比例代表制是歐洲各國選局國會議員時常見的選舉制度一之，下列關於比例代表之說明，何者<u>錯誤</u>？
  options:
  - label: A
    content: 各政黨能推出專業、弱勢代表、各社團、意見領袖等國會議員名單，吸引政黨票、有助於各族群的政治參與
  - label: B
    content: 通常會設立分配席次的門檻，以保證小黨的席次
  - label: C
    content: 採用該制度的國家較易發展成多黨制的政黨體系
  - label: D
    content: 該制度當選的國會議員喪失黨籍時，直接由名單上下一位政黨推薦人選遞補
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_20
