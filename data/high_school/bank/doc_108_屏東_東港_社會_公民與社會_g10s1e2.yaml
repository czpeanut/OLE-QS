- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 以色列於今年9月17日的選舉中，由原總理納坦雅胡的「聯合黨」與保守派拿下國會55席（總席次120席），優先獲得組閣權。由於沒有其他政黨想加入納坦雅胡的聯盟，只好找對手「藍白聯盟」（33席）的甘茲協商，希望能組成大聯合政府，但甘茲始終都拒絕提案。若沒有辦法找到足夠多的盟友跨越阻隔門檻61席，以色列將會陷入近1年來沒有中央政府的困境。下列敘述有關以色列的政府體制，何者正確？
  options:
  - label: A
    content: 以色列的總統為實權元首，掌握行政權
  - label: B
    content: 以色列的內閣擁有法案提案權
  - label: C
    content: 以色列並無機制解決政治僵局
  - label: D
    content: 若總理認為國會通過的法案窒礙難行，可行使否決權，請國會重新審議
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 英國首相強森，為了阻止國會對他的脫歐決策作出實質干預與限制，以「邀請女王發表演說」為藉口，促請女王下令國會休會五個星期，引發爭議。請問國會最有可能採取和項措施來反智強森？
  options:
  - label: A
    content: 向監察機關檢局，彈劾首相
  - label: B
    content: 要求女王下令解散國會
  - label: C
    content: 發起民眾聯屬罷免首相
  - label: D
    content: 發起不信任投票
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有關民主國家政府體制的敘述何者正確？
  options:
  - label: A
    content: 德仁天皇登基，安倍晉三高喊「天皇陛下萬歲！萬歲！晚歲！」是因為天皇有實際權力，他必須展現效忠的心
  - label: B
    content: 歐巴馬總統為了健保法案，不僅親自說服議員，甚至親上火線，接受電視媒體專訪，大力推銷健保法案，是因為美國總統並無法案提案權，只能轉而爭取議員、民意的支持
  - label: C
    content: 蔡英文政府修正勞動基準法、一例一休導致勞資雙方不甚滿意、2018九合一選舉綁公投產生的問題接連發生，立法院進而向總統提出不信任案
  - label: D
    content: 美國總統川普每年需到國會被質詢，做施政報告
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 4位同學於公民課結束後，討論總統制與內閣制的優缺點比較，請問誰的發言內容為總統制的優點
  options:
  - label: A
    content: 東尼：總統與議員都有民意基礎，意見對立不易化解
  - label: B
    content: 崐寶：國會具有倒閣權，內閣具有解散權，可化解政治僵局
  - label: C
    content: 澤澤：元首與議員有固定任期，政府與國會相對較穩定
  - label: D
    content: 諭哥：行政、立法融合，政府執政有效率
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在民主國家中，人民可透過選舉將民意反映於政府的組成之上，這種做法也適用於地方自治，請問下列哪個政府職位，不是遵循以上作法產生？
  options:
  - label: A
    content: 嘉義市長
  - label: B
    content: 臺南市新營區區長
  - label: C
    content: 東港鎮鎮民代表
  - label: D
    content: 高雄市那瑪夏區區長
- id: doc_108_屏東_東港_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 根據（地方制度法），我國地方政府可分成三個層級，試問下列哪些地方政府是屬於相同層級之政府組織？(甲)新北市、(乙)屏東縣、(丙)花蓮縣花蓮市、(丁)東港鎮、(戊)新北市烏來區
  options:
  - label: A
