  stem: 為因應婦女團長期爭取的增加女廁數量議題，內政部（建築技術規則建築設備編）規定，新設電影院、戲院、車站、航空站、學校等人潮多的公共場所，男女馬桶數比例從原本一比二提高到一比五。此政策可以呈現出下列哪些觀點？
  options:
