  stem: 安安買到當前熱銷的手機，開心的拿給同學欣賞，同學疑似太過興奮不慎讓手機墜落到地上，螢幕當場碎裂。試問安安可如何主張自己的權利？
  options:
  - label: A
    content: 同學須負責修復安安的手機，另外還要賠償安安精神慰撫金
  - label: B
    content: 同學須負責修復安安的手機，若無法修復則按市價賠償金錢
  - label: C
    content: 同學因故意或過失不法侵害安安對手機的身分權，故須賠償
  - label: D
    content: 同學故意背於善良風俗侵害安安用手機的人格權，故須賠償
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)安安無法主張精神慰撫金。(B)負賠償責任的人，原則上是以回復原狀作為賠償的方法，也就是要回復到損害發生前的原狀；例外才可以金錢賠償，為正解。(C)(D)手機損壞應是侵害財產權。
