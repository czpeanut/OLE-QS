  stem: 原《刑法》第 239 條規定：「有配偶而與人通姦者，處 1 年以下有期徒刑。其相姦者亦同。」司法院大法官會議作出《司法院釋字第 791 號解釋》，認定通姦罪規定違憲立即失效。關於有配偶者外遇所可能面臨的法律責任，下列敘述何者正確？
  options:
  - label: A
    content: 雖然通姦除罪，被害配偶仍可基於精神受創請求剩餘財產差額分配
  - label: B
    content: 對通姦者處有期徒刑以致罪責不相當，若易科罰金則符合比例原則
  - label: C
    content: 大法官認定通姦罪違憲即表示通姦合法化，通姦者無須負法律責任
  - label: D
    content: 雖然通姦除罪，被害配偶仍可基於身分權受侵害為由請求損害賠償
  answer:
