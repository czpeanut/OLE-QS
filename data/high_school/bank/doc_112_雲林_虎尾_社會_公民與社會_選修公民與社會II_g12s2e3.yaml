  stem: 某國政府為避免暴力及色情的電玩遊戲影響兒童及青少年的身心健康，國會制定《遊戲軟體管理條例》，規定所有電玩遊戲一律不得出現全裸畫面、表達性暗示、攻擊、殺戮等畫面，違反相關規定的業者將處以罰鍰。以憲法保障人權的角度評析此法律規定，下列何者正確？
  options:
  - label: A
    content: 此規定合理，因為限制電玩遊戲不得出現暴力及色情元素之措施具法律依據
  - label: B
    content: 此規定合理，因為限制電玩遊戲不得出現暴力及色情元素能夠有效保障兒少
  - label: C
    content: 此規定不合理，因為色情與暴力對兒少的影響有所差異，應該分別予以規範
  - label: D
    content: 此規定不合理，因為比起全面禁止，將遊戲軟體進行分級亦可達到相同目的
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文，「規定所有電玩遊戲一律不得出現全裸畫面、表達性暗示、攻擊、殺戮等畫面」，不分情節輕重，一律禁止，違反比例原則，此規定並不合理，答案為(C)。
