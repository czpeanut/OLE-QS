  - label: C
    content: 記者工作權與人民遷徙自由
  - label: D
    content: 公共監督與商業利益
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「新聞採訪者於有事實足認特定事件屬大眾所關切並具一定公益性之事務，而具有新聞價值」此為新聞自由；而「保護個人之行動自由、免於身心傷害之身體權、及於公共場域中得合理期待不受侵擾之自由與個人資料自主權」可知此案涉及新聞自由與隱私權之爭議，答案(A)。
