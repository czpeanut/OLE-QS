  stem: 新冠病毒肺炎疫情爆發一年仍未歇，衛福部提出新一波防疫措施，要求未檢附陰性證明之國人不得搭機返臺，但有立委質疑此專案有違憲之虞。指揮中心進一步說明，該專案是依《傳染病防治法》第 58 條第 1 項第 2 款規定，旅客搭機時應配合出示 COVID-19 核酸檢驗報告；並依同法第 17 條第 1 項、第 59 條第 1 項、第 3 項及《港埠檢疫規則》第 24 條規定，請航空公司於境外旅客登機前檢查該項檢驗報告，其法源依據明確，符合【甲】原則。請問上述應填入以下何項？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 法律保留原則
  - label: C
    content: 法律優位原則
  - label: D
    content: 誠實信用原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文，「……依《傳染病防治法》第 58 條第 1 項第 2 款規定……其法源依據明確」，可知其符合(C)法律優位原則。法律優位（或優越）原則，是指一切行政活動都不能夠牴觸現行有效的法律，而此處的「法律」指的是立法院通過、總統公布的法律。
