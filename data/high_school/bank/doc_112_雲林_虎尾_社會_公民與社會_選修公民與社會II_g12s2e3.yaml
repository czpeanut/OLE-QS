  stem: (甲) 1999 年以前，《刑法》將與「性」有關的犯罪規定在「妨害風化罪章」，其目的是保護社會法益；該年《刑法》修正改列於「妨害性自主罪章」，保護的是個人法益。(乙)大法官在以往認為通姦罪與《憲法》第 23 條比例原則之規定尚無違背，認為婚姻與家庭應受憲法制度性保障，但 2020 年後則將通姦罪除罪化，著重於個人權益的保障。關於上述兩段法律的變遷，以下敘述何者正確？
