  explanation: (A)(C)(D)是屬於公務員的侵害責任，即《國家賠償法》第 2 條第 2 項規定：「公務員於執行職務行使公權力時，因故意或過失不法侵害人民自由或權利者，國家應負損害賠償責任。公務員怠於執行職務，致人民自由或權利遭受損害者亦同。」而(B)是屬於公有公共設施的侵害責任，即《國家賠償法》第 3 條第 1 項規定：「公共設施因設置或管理有欠缺，致人民生命、身體、人身自由或財產受損害者，國家應負損害賠償責任」，與其他三項的國家賠償性質不同。
