  stem: 學校舉辦大隊接力比賽，高三生阿超為了替班上爭取榮譽，在彎道欲超過前方對手，沒想到超車不慎絆倒了對手，導致該名同學手臂與腳踝受傷，眼鏡也有破損。請問該名同學可以向阿超請求下列哪些費用？(甲)重新配眼鏡的費用；(乙)醫療費用；(丙)精神慰撫金；(丁)休息一周無法打工的損失
  options:
  - label: A
    content: (甲)(乙)(丙)
  - label: B
    content: (乙)(丙)(丁)
  - label: C
    content: (甲)(丙)(丁)
  - label: D
    content: (甲)(乙)(丙)(丁)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 依據《民法》第 216 條：「損害賠償，除法律另有規定或契約另有訂定外，應以填補債權人所受損害及所失利益為限。依通常情形，或依已定之計畫、設備或其他特別情事，可得預期之利益，視為所失利益。」因此(甲)(乙)(丙)(丁)皆屬之，答案為(D)。
