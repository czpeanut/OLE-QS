  stem: 某私立高中校規明定：「學生不得在校內舉辦政治活動，違反者記小過；情節重大者，記大過或予以退學。」該校學生甲與同學深感氣候變化問題影響未來世代生活甚鉅，某日合作舉辦「抗議全球暖化」快閃活動，由甲演說三分鐘，抗議全球暖化問題造成之危害。事後，校方認定該活動具政治性，將甲與舉辦活動之其他同學各記小過乙次。關於甲就此能否提出法律救濟，下列敘述何者最適當？
  options:
  - label: A
    content: 遭學校記過並非受國家公權力侵害，故甲僅能在校內進行申訴
  - label: B
    content: 甲被私校記過，因權利受到侵害故得依行政爭訟管道提起救濟
  - label: C
    content: 記過未使甲喪失學生身分，並非受教權遭侵害故無法行政救濟
  - label: D
