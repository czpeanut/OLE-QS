  stem: 來自越南的移工阿紅，透過仲介來到臺灣為雇主看護失能長輩。仲介說，為了讓雇主安心，防止他們逃跑，要他們把護照跟居留證都交給雇主保管。某日，阿紅覺得沒有證件造成生活上許多不方便，於是告知雇主要拿回護照跟居留證，但雇主卻把影本給她，不願歸還正本。對於雇主保管阿紅證件不願歸還的行為，下列敘述何者較為正確？
