  stem: 民眾針對下列哪一種行政行為得提起訴願？
  options:
  - label: A
    content: 市政府推動垃圾不落地造成民眾生活不便
  - label: B
    content: 鄉公所在社區廣場擺放聖誕樹影響公眾進出
