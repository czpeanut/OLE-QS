  stem: 陳大哥將小貨車暫停在路邊紅線區卸貨，造成後方機車女騎士閃避不及撞上，導致身上多處擦傷，機車車頭毀損。請問女騎士受有「財產上損害」時，損害賠償之範圍為何？
