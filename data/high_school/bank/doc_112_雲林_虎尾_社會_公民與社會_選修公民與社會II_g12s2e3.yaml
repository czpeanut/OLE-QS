  stem: 小鐘是某國立大學的大三學生，某節上課小鐘自顧自的講起電話，經授課老師制止後，小鐘還是依然我行我素，因此，授課教師依照校規記小鐘一支小過。小鐘若不服授課教師的處分，可以透過哪一種管道來提起救濟？
  options:
  - label: A
    content: 可向學校單位提起抗告
  - label: B
    content: 可向學校單位提起行政訴訟
  - label: C
    content: 可向地方法院提起行政訴訟
  - label: D
    content: 可向教育部提起訴願
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 對於「大學生」來說，除了退學這種會剝奪學生受教育的處分之外，大學對於大學生作出的任何處分，只要是侵害大學生的基本權利，大學生除了依循校內救濟管道之外，也能對此提起訴願與行政訴訟。答案為(D)。
