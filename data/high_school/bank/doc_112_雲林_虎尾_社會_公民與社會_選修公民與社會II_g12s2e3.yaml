  answer_status: verified
  answer_source: answer_key
  explanation: 依照《訴願法》之規定，人民對於中央或地方機關之行政處分，認為違法或不當，致損害其權利或利益者，得依本法提起訴願。(A)(B)應該以請願或陳情方式改變政策。(C)天氣預報的對象並未特定，且相對人無法拒絕，應屬事實行為中的觀念通知，意即國家透過天氣預報進行政策性、建議性意見的宣達，本身不具任何法律效果。(D)禁漁令會使捕魚者影響其生活或執業收入，屬於行政處分，若不服可提起訴願，為正解。
