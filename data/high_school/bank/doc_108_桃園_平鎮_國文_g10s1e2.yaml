- id: doc_108_桃園_平鎮_國文_g10s1e2_s2_20
  section: 2
  number: 20
  type: single
  page: 3
  stem: 依據上文，下列敘述何者正確：
  options:
  - label: A
    content: 「負」是「勝」的反義，可見隈研吾對追求經濟至上的社會風氣的反思
  - label: B
    content: 為避免與藤本壯介的建築理念混淆，隈研吾出版《負ける建築》
  - label: C
    content: 隈研吾重視本土文化美學觀，對20世紀後的當代建築皆不以為然
  - label: D
    content: 對於建築核心價值的思考，隈研吾提倡追求全球化後的一致樣貌
  group_stem: 閱讀下文，回答20-21題。 2004年隈研吾出版《負ける建築》一書後，臺日媒體習慣稱他為「負建築大師」。就原文而言，這裡的「負」取其輪、敗北之意，「負ける建築」也就是「勝つ建築」的反義，他認為建築進入20世紀以後，世界各國紛紛以建築萬度作為人類文明和商業發展的標竿，愈高愈好的社會氛圍，加上造型古怪突顯其地標性意義等，容易使人忽略建築存在的核心價值，因比隈研吾提倡在地取材、因地制宜及延續當地傳統等方式，以此詮釋建築該有的文化樣貌。 他相信，建築的意義並非在自然環境中標新立異，而是退居後端、突顯自然環境與地形地貌的美好，呈現低調且隱於環境之內的弱姿態，因此臺灣媒體也習慣將之稱為「弱建築」，但此詞容易與藤本壯介提出的弱建築理論混淆，因此以「負建築」形容隈氏建築思維會更為精確。 隈研吾負建築理念來自日本第二次世界大戰後經濟迅速復甦的反思，商業至上、生活西化等社會變遷，持續加速風土傳統的流失，因此他時常緊扣日本在地文化、傳統木造建築及其「千鳥」棒卯結構等元素，呈現當代建築與日本文化的優美融合，也代表在地建築師意圖復興母國建築美學的願意。（〈隈研吾的建築理念〉）
