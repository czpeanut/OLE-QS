  group_stem: 閱讀下文，回答22-24題。 １ 先妣周孺人，弘治元年二月十一日生。年十六來歸。踰年生女淑靜。淑靜者，大姊也。期而生有光。又期而生女子殤一人，期而不育者一人。又踰年生有尚，姙十二月。踰年生淑順。一歲又生有功。 ２ 有功之生也，孺人比乳他子加健。然數顰蹙顧諸婢曰：「吾為多子苦！」老嫗以杯水盛二螺進，曰：「飲此後，姙不數矣。」孺人舉之盡，喑不能言。 ３ 正德八年五月二十三日，孺人卒。諸兒見家人泣，則隨之泣，然猶以為母寢也。傷哉！於是家人延畫工畫，出二子，命之曰：「鼻以上畫有光，鼻以下畫大姊。」以二子肖母也。 ４ 孺人諱桂。外曾祖諱明；外祖諱行，太學生；母何氏。世居吳家橋，去縣城東南三十里。由千墩浦而南直橋，並小港以東，居人環聚，盡周氏也。外祖與其三兄皆以貲雄，敦尚簡實，與人姁姁說村中語，見子弟甥姪無不愛。 ５ 孺人之吳家橋，則治木棉，入城，則緝纑。燈火熒熒，每至夜分。外祖不二日使人問遺。孺人不憂米鹽，乃勞苦若不謀夕。冬月罏火炭屑，使婢子為團，累累暴階下。室靡棄物，家無閒人。兒女大者攀衣，小者乳抱，手中紉綴不輟，戶內灑然。<u>遇僮奴有恩，雖至箠楚，皆不忍有後言</u>。吳家橋歲致魚、蟹、餅餌，率人人得食。家中人聞吳家橋人至，皆喜。 ６ 有光七歲，／(甲)從兄輒留；有光意戀戀，不得留也。／(乙)與從兄有嘉入學。每陰風細雨，／(丙)即熟讀，無一字齟齬，／(丁)孺人中夜覺寢，促有光暗誦《孝經》，／乃喜。 ７ 孺人卒，母何孺人亦卒。周氏家有羊狗之痾，舅母卒，四姨歸顧氏又卒，死三十人而定，惟外祖與二舅存。 ８ 孺人死十一年，大姊歸王三接，孺人所許聘者也。十二年，有光補學官弟子。十六年而有婦，孺人所聘者也。期而抱女，撫愛之，益念孺人。中夜與其婦泣，追惟一二，彷彿如昨，餘則茫然矣。世乃有無母之人，天乎！痛哉！（歸有光〈先妣事略〉）
