  stem: 下列有關孔子的論述，何者正確：
  options:
  - label: A
    content: 孔子曾言「君子有三戒」，其中「戒之在鬥」是指血氣方剛之時
  - label: B
    content: 「君子之於天下，無適也，無莫也」，此句是指君子對於天下環境有適合與不適合者
  - label: C
    content: 「道之以政，齊之以刑，民免而無恥。」，其中「民免而無恥」意謂：人民只求避免刑罰，但沒有羞恥之心
  - label: D
    content: 子曰：「視其所以，觀其所由，察其所安，人焉廋哉？人焉廋哉？」，孔子之言意謂：察人善惡之法可從「學識、品德、言談」三方面著手去觀察
  - label: E
    content: 由孔子有次與子貢的對話中，可知孔子心目中的士有三個等級。其中達到治國層次的是：行己有恥，使於四方，不辱君命
