  stem: 下列文句所呈現的生活樣態，與愛因斯坦所稱「豬欄的理想」<u>相去最遠</u>的選項是：
  options:
  - label: A
    content: 飽食終日，無所用心，難矣哉
  - label: B
    content: 志於道，據於德，依於仁，游於藝
  - label: C
    content: 不有博奕者乎？為之，猶賢乎已
  - label: D
    content: 飲食男女，人之大欲存焉
  group_stem: 閱讀下文，回答25-27題。 人生的三種目的或意義 有人認為，人活著就是為了享樂，滿足自然所賦予的各種欲望。孔子說：「飲食男女，人之大欲存焉。」自然欲望的滿足當然重要，但如果僅止於此，那跟動物似乎就沒有兩樣。而且，滿足自然欲望所獲得的快樂為時都相當短暫，很快祝會感到空虛，如果你想繼續有滿足感，通常需要比上一次更大的刺激才能得到同樣的快樂。這樣的人生，只會讓人愈來愈覺得空虛與無聊。 人在飲食男女之後，總會想再做些什麼。子曰：「飽食終日，無所用心，難矣哉！不有博奕者乎？為之，猶賢乎已。」孔子認為即使是牌戲、下棋等活動，也比什麼都不做來得好。但不管做什麼，重要的是要有所「用心」──把心思放在那上頭。它們包括從上學讀書、上班工作到假日登山、禮佛、打太極拳、研究昆蟲等等，各式各樣的活動形成了人在文明社會裡的主要生活內容。如果這些活動能符合你的興趣，又能發揮妳的才藝，那你就會有愉悅的滿足感，它們比感官的滿足來得持久，而且能讓你覺得生命有所成長、感到充實並獲得某種尊嚴。 但這顯然也不是孔子想要的人生。當學生子路問他「人生的志願」時，孔子回答：「老者安之，朋友信之，少者懷之。」這表示孔子不以「獨善其身」為滿足，他還想要「兼濟天下」，走出自我，將自己融入一個更大的群體中，讓世人共享安和樂利的生活，這樣才能使他的生命得到最豐富、最有價值與最大的意義。 孔子與愛因斯坦殊途同歸 愛因斯坦曾說：「每個人都有一定的理想，這種理想決定他努力和判斷的方向。在這個意義上，我從來不把安逸和享樂看做是生活本身的目的──我把它稱為『豬欄的理想』。照亮我的道路，並且不斷給予我新的勇氣去正視生活理想的是善、美、真。」在追求真、善、美的過程中，愛因斯坦進一步指出：「只有為別人而活的生命才是值得的」、「只有獻身於社會，才能找出實際上短暫而又有風險的生命意義」。 孔子不只想獻身於社會，而且跟愛因斯坦一樣是在追求真、善、美。在他心中，理想的人生是要「志於道，據於德，依於仁，游於藝。」其中「志於道」──以追求真理為志業，代表了求真（理）；「據於德，依於仁」──以德和仁為立身處世的依據，代表了求善（獨善其身又兼濟天下）；而「游於藝」──優遊於藝術的領域，則代表了求美。孔子的理想人生跟愛因斯坦不僅殊途同歸，而且還說得似乎比他更具體而明白。（王溢嘉〈真善美：給生命一個豐華的意義〉）
