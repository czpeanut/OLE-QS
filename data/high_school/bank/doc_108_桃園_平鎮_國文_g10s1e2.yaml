    content: 我大清早起，／站在人家屋角上啞啞的啼。／人家討嫌我，說我不吉利；／我不能呢呢喃喃討人家的歡喜！／／天寒風緊，無枝可棲。。／我整日裡飛去飛回，整日裡又寒又飢
  - label: C
    content: 我心愛的雨景也多著呀；／春夜春夢時窗前的浙瀝；／急雨點打上蕉葉的聲音；／霧一般拂著人臉的雨絲；／從電光中潑下來的雷雨──
  - label: D
    content: 我攀登了萬仞的高岡，／荊棘扎爛了我的衣裳，／我向縹渺的雲天外望──上帝，我望不見你！／／我向堅厚的地殼裡掏，／搗毀了蛇龍們的老巢，／在無底的深潭裡我叫──／上帝，我聽不到你！
  - label: E
    content: 依舊是月圓時，／依舊是空山，靜夜；／我獨自月下歸來，／這淒涼如何能解！／翠微山上的一陣松濤／驚破了空山的寂靜。／山風吹亂了窗紙上的松痕，／吹不散我心頭的人影
