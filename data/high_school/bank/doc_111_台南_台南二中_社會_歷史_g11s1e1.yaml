  stem: 米開朗基羅在羅馬一間教堂中所雕刻的「摩西像」，被認為是其傑作之一。然而米開朗基羅的摩西，其頭上卻長了一雙角，這其實是當時的圖像傳統：摩西頭上長著角。這個傳統源於耶柔米在 4 世紀末所翻譯的拉丁文「武加大譯本」中的錯譯。《聖經》中描述摩西從西奈山下來時，臉上發出榮光，而「發出榮光」的希伯來文「qeren」也有「長角」的意思，因此耶柔米在從希伯來文翻譯成拉丁文時，便譯為摩西臉上長了角。請問根據以上所述，下列何者正確？
