- id: doc_111_台南_台南二中_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列哪項改革的施行，有助於雅典民主政治的鞏固？
  options:
  - label: A
    content: 公布《十二表法》，成文法典的出現奠定法治的基礎
  - label: B
    content: 陶片流放制使公民得以表決處置可能破壞民主之人
  - label: C
    content: 設立護民官，監督公民大會的運作
  - label: D
    content: 選拔兩位執政官，避免政權專斷，亦可權力制衡
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)為正解。(A)(C)(D)三者皆為羅馬共和時期的作為。

    4.15 世紀，日耳曼的古騰堡發明了金屬活字印刷術，使知識的傳播更加迅速且便利，(C)為正解。(D)科學革命開啟於 16 世紀中葉。

    5.18 世紀啟蒙運動的核心思想為理性主義，當時的哲士以理性檢討傳統的一切教條，尋求改進政治與社會，(A)為正解。(B)科學革命時代的特色。(C)尊崇理性主義，非人文主義。(D)當時的改革重點仍偏重中產階級，對底層大眾既同情又恐懼。

    6.從要求舉止合宜、學習各項知識以便參與社交，可推知為(C)文藝復興時期的特色。

    7.羅馬主教地位原與各地主教相同，但因羅馬城是帝國的首都，當地主教本就由德高望重之人擔任，5 世紀時曾成功解除外族攻入羅馬城的危機，更是大幅提升其政治地位，加上(B)「彼得磐石說」的理論，羅馬主教因而被視為教會的領袖。(A)羅馬主教並非由皇帝兼任，而是聽命於皇帝。(C)並無此事。(D)第一任羅馬主教是彼得。

    8.新教牧師認為的「危險的地區」應為舊教勢力區域，選項中(B)法國、義大利為信仰舊教的地區。瑞士、荷蘭為新教地區。

    9.兩則資料為 11 世紀「俗人授職衝突」事件中，神聖羅馬帝國皇帝與羅馬教宗互相指責與罷黜對方的說法，(B)為正解。(A)資料一中的「我」為神聖羅馬帝國皇帝亨利四世。(C)查理曼被教宗加冕為 800 年的事，與此事件無關。(D)東西教會大分裂與此事無關。

    10.(乙)此時的教會可說是科學研究的最大阻力；(丁)伽利略的研究與科學機構無關，但日後各國紛紛設置科學機構，確實有助科學研究的發展。

    11.(A)由「現在你和你從埃及所領出來的百姓」一句，可推知□□為摩西。(B)為正解。(C)「流著奶與蜜之地」是巴勒斯坦。(D)資料為耶穌誕生之前，應出自《舊約聖經》。

    12.從戰爭路線由巴勒斯坦到埃及，又轉回敘利亞再到東方，可能為上古亞歷山大的東征路線，其造成的影響為(A)。(B)亞歷山大建立專制的帝國，非民主政治。(C)此帝國隨亞歷山大驟逝而分裂瓦解。(D)並無此事。

    13.羅馬帝國第一次以「武力」征服世界，建立歐洲史上版圖最大的帝國；羅馬帝國第二次以宗教征服世界，此宗教即基督教信仰；羅馬帝國第三次征服世界的「乙」，最可能為法律，自《十二表法》、《羅馬法》到日後的《查士丁尼法典》，持續影響日後歐陸國家的法律觀念，(D)為正解。羅馬的民權成就不高，史詩、藝術、美學成就雖高，但不足以影響世界。

    14.資料一為歸納法的步驟，資料二為演繹法的步驟，兩者皆為科學革命時期的科學研究方法，(D)為正解。

    15.(D)《西發里亞條約》使新教合法化，因此歐洲各國不再以宗教為藉口發動戰爭。

    16.此位統治者在 19 歲那年即平定國家動亂，而後又獲元老院選為執政官，卻聲稱「拒絕獨裁」，因此應為結束獨裁政權、開啟帝國時期的(C)羅馬皇帝屋大維。

    17.(B)資料一強調人都需要神的指引，故為中世紀的基督徒；資料二主張「上帝自動將拯救賜予信仰祂的人」，應為相信「因信得救」的路德教徒；資料三重視每個人的獨特性，因此為人文主義者。

    18.(A)最早發生在義大利半島。(B)此時貶抑哥德式教堂，崇尚古羅馬式風格的教堂。(C)已有許多方言文學作品。

    19.宗教家表示「人人都可以成為教士」，降低過去教會的權威；畫家的作品中，天神與凡人女子準備幽會，更是拉近神人之間的距離。綜合兩者，皆反映出宗教權威褪色、人文精神昂揚的特點，(A)為正解。

    20.題文中想要阻止雅典人控制其聯盟的□□應為斯巴達，為了阻止雅典人的霸權，他們亦組成聯盟與雅典人開戰，此戰爭即是(B)伯羅奔尼撒戰爭，為希臘諸城邦的內戰。

    21.阻止雅典人霸權的□□人為(C)斯巴達人。

    22.(A)耶柔米將希伯來文的《聖經》翻譯錯誤，造成後世對摩西有錯誤的認知。(B)為正解。(C)(D)並無此事。

    23.嚴復形容這本書的內容包羅萬象，可推知應為狄德羅所編輯的《百科全書》，(B)為正解。(A)蒐集全天下的各種知識，非只有歐洲政治體制的介紹。(D)由文中「越二十年而始成」，可知此書並非很短的時間編輯完成。

    24.題文為(D)喀爾文所主張的「預選說」。

    25.在共和體制下，羅馬公民為理論上國家的權力來源，元老院係由貴族與退任的執政官所組成的立法機構，兩者同為國家權力最重要的元素，因此反映羅馬政治權力運作最重要的精神為(A)制衡。絕大多數的羅馬公民並沒有實質的政治權力，因此不選(B)或(C)。

    26.(C)文藝復興時期崇尚古希臘、羅馬的文化，因此推崇當時的學者，並追求全方位的人文教育，造就博學的通才。

    27.在題文所述的背景下，西元前 450 年編成(A)《十二表法》，為羅馬最早的成文法，也是日後羅馬法治的基礎。

    28.(B)此時日耳曼人尚未入侵羅馬帝國。(C)(D)並無此事。

    29.佩脫拉克追求「屬於人的光榮」，反映出文藝復興時期的人文主義思想，以人為本，不再以追求宗教的救贖為唯一目標，(A)為正解。(B)宗教改革時期。(C)此時社會雖然關心現世，但不反對關心基督教信仰。(D)此時重視培養通才的人文教育。

    30.(C)拜占庭帝國位於希臘文化起源區，因此以繼承古希臘文化為榮，(A)(B)(D)三者則以傳承羅馬的拉丁文化為主。

    31.牛頓所信仰的上帝，是遵循自然法則規律的上帝，因此後來發展為(B)自然神論。

    32.(C)為正解。(A)(B)當時歐洲婦女多無受教育機會與公共領域的社交活動，沙龍主持人為出身高貴的婦女，非一般婦女。(D)沙龍為上流社會的社交場所，下層階級民眾無法涉足。

    33.從英格蘭國王宣告境內「無論是教士或俗人」皆應向國王「表示最高的服從」來看，可推知此國王為創建英格蘭國教的亨利八世，(A)為正解。(B)起因於教會不同意英王離婚。(C)英格蘭保留諸多天主教傳統，絕非最創新的教派。(D)之後的英王迫害境內的清教徒。

    34.(C)基督教會並無武力，無法成為抵抗日耳曼民族入侵的防護牆。

    35.從羅馬的開國神話延續希臘伊里亞德的故事，可知應是(A)羅馬沿襲了希臘的神話與文化。(B)羅馬人與希臘人並非同源同族。(C)希臘文明影響了羅馬文化。(D)希臘文明影響了亞歷山大。

    36.(D)(丁)政教關係：希臘正教→政教合一；羅馬公教→政教分離。

    37.這位學者主張地球繞日，同時相信行星運行軌道為正圓形，因此為(C)哥白尼。

    38.(D)聖保羅首先向猶太人以外的族群傳教，因此被稱為「外邦人使徒」。

    39.(C)啟蒙運動時期相信宇宙與人類社會皆存在自然法則，因此認為政府無需干預經濟活動，一切由市場機制決定。

    40.(A)牛頓為科學革命的集大成者，與其他三位先驅者的影響不同。(B)巫術、占星術等並未消失。(C)此時的科學家皆欲藉由科學研究以彰顯上帝的威能，非質疑批判基督宗教信仰。(D)為正解。

    41.資料二中提到大量修士遠赴海外傳教的修會是耶穌會，其創辦人是羅耀拉。

    42.(乙)耶穌會是在宗教改革後，為挽回流失的舊教信徒而成立；(丁)資料四的國王為英王亨利八世，由於想要離婚不成，最後脫離教會另立新的教派；(戊)「預選說」為喀爾文教派的主張。

    43.三十年戰爭起因於波西米亞地區改信喀爾文教派，欲脫離信仰天主教的神聖羅馬帝國遭拒，最後從內戰演變成歐洲的大戰。資料二的耶穌會屬於天主教，代表神聖羅馬帝國的教派；資料五為喀爾文教派的主張，代表波西米亞地區的教派。資料一、資料三皆為馬丁路德的主張。

    44.資料一的哲學家強調腦中三角形的觀念永恆不變，因此為重視觀念論的柏拉圖。資料二重視感官經驗，應為亞里斯多德。

    45.資料三強調宇宙理性與人類遵循美德行事，應為斯多噶學派，選項中(丙)即為斯多噶學派的主張。(甲)研究萬物起源，為西元前 6 世紀希臘哲學的特色；(乙)為蘇格拉底的主張；(丁)為伊比鳩魯學派的主張。

    46.提出「水是萬物的本源」主張的哲學家為泰利斯，被尊為「哲學之父」。

    47.由「中世紀探討天上的國和來生的福祉」，文藝復興時期「將重心擴及到世俗生活，關注人的生活與道德行為」，可知這種轉變是(B)思考方式的轉變。

    48.從「文藝復興時期的人開始將重心擴及到世俗生活，關注人的生活與道德行為」、「中世紀學者運用古代資料來證實基督教神學理論，人文學者則透過古典文獻來探討現世的問題」、「文藝復興時期人們進而肯定自我的力量，同時更加敬重神，調和了理性與信仰」、「文藝復興時期人們依舊虔誠，只是對於人、對於世界的理解，具備了更多世俗取向」等句皆可呈現文藝復興時期和中世紀的差異。

    49.十字軍東征後，隨著商業復甦與城市興起，為了保護自身利益，城市的手工業者和商人因此建立行會（guild，基爾特），類似今日的同業公會。

    50.城市的市民階級對培養子弟有教育的需求，因此由教師或學生行會，再改組發展成為大學。'
