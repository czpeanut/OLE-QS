  stem: 一份文書指出：「政府曾發布命令，教導大家崇敬諸神，卻使基督教徒陷於危險和苦難之中，甚至有人喪失性命，許多人至今不能公開參加他們的宗教活動。我們應本著寬大宗旨，開恩處理這件事。今後，他們可以自由表達想法，不受干擾的自由集會，但得尊敬法律和政府。」這份文書是
  options:
  - label: A
    content: 君士坦丁發布的《米蘭詔令》
  - label: B
    content: 馬丁路德提出的〈九十五條論綱〉
  - label: C
    content: 查士丁尼頒行的《查士丁尼法典》
  - label: D
    content: 《西伐利亞（西發里亞）條約》的簽署內容
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 過去基督教徒陷於危險和苦難，今後則「可以自由表達想法，不受干擾的自由集會」，可推知基督教已獲合法化，故而這份文書應為(A)君士坦丁所發布的《米蘭詔令》。
