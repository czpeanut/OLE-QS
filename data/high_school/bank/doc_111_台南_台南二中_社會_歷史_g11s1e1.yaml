    資料三：「宇宙是個有機的整體，為一種宇宙理性所支配；人類，由於他們身上所有合理性的美德，能夠主導自己的生活，與宇宙的合理性一致，不管命運如何，都能發揚勇敢、節儉、正義與中庸的美德。」

    資料四：這位哲學家「大膽地罷黜了神，以不具人格的元素取代神的位置。他尋找的是永恆的物質與普遍的原因，他提出一個新問題：『是什麼造就出這世界？』……他作為第一個尋找自然界基本構成元素的『物理學家』留名於世，他提出一個簡單的答案，認為『水是萬物的本源』。」'
