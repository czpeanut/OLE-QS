  stem: '請問資料四的哲學家是誰？

    三、「文藝復興」是指 1350 ～ 1550 年間以義大利為中心並且傳播至北方的一連串新文化、思想、藝術運動。「文藝復興」一詞的原意是「再生」，指的是古典文化再生，這是由於人們重新認識希臘、羅馬文化，使人文學者從古希臘羅馬文學汲取養分，再進一步重新認識自己生活的時代。中世紀探討天上的國和來生的福祉；而文藝復興時期的人開始將重心擴及到世俗生活，關注人的生活與道德行為。但是這個轉變是一段漫長漸進的過程，這並不代表人從此摒棄了上帝。那麼文藝復興時期究竟和中世紀有何不同？以學術研究為例，中世紀學者運用古代資料來證實基督教神學理論，人文學者則透過古典文獻來探討現世的問題。透過古代學問增長知識後，人們進而肯定自我的力量，同時更加敬重神，調和了理性與信仰。文藝復興時期人們依舊虔誠，只是對於人、對於世界的理解，具備了更多世俗取向。'
