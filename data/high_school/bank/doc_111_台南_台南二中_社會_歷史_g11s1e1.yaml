  section: 3
  number: 41
  type: calc
  page: 9
  stem: 資料二中提到的修會培育了大量的修士遠赴海外傳教，對中國於明末清初中西文化交流有著極大貢獻，請問此組織的創辦人是誰？
  group_stem: '資料一：當錢投入錢櫃叮噹作響時，增加的只是貪婪愛財的欲望，而不是靈魂升天。……信徒得救一不靠教宗，二不靠聖禮，只有靠終生悔改，才是基督的正道。

    資料二：這是個 16 世紀時成立的一個修會，在宗教生活形式上有所革新，強調順從，特別是順從教宗，主張靈活，准許會士在世界各地參加各種活動。

    資料三：16 世紀初，某位後來將歐洲基督教世界攪得天翻地覆的教士自述其得道經過：最後，由於上帝的慈悲，在我日以繼夜地冥思苦想時，我注意到這一句話：「如經上所記：『義人必因信得生。』因為神的義，正在這福音上顯明出來。」（《羅馬書》1：17）在此，我開始了解：上帝的正義，是指藉著上帝的一項禮物，亦即信，而得到真性命。因此這句話的意思是：福音揭示了上帝的正義，但這是被動的正義，慈悲的上帝藉著信為我們赦罪……我即刻感到獲得了新生，甚至覺得已通過敞開的大門，進入天國了。

    資料四：16 世紀歐洲某國王發表一本叫《維護聖禮》的書，被當時的某位宗教人士罵為「笨驢」，教宗卻賜封他為「信仰的維護者」；但過了幾年後，他卻以「年幼被迫與寡嫂結婚，此種婚姻自始即不合法」為理由，請求教宗批准他與王后離婚，但教宗卻採取拖延政策，遲遲不肯批准。

    資料五：如果上帝啟示獲利的機會，則選民必須遵循上帝的召命而用心追求。人雖然不可為私利而致富，但是可以為上帝勞動而致富。'
