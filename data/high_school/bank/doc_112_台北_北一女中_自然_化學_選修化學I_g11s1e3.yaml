  stem: 已知在 80 ℃ 時，純 A 之平衡蒸氣壓為 300 mmHg，純 B 之平衡蒸氣壓為 100 mmHg。有一由 1 mol A 和 3 mol B 混合所成的理想溶液，若將此混合溶液第一次加熱至 80 ℃，所生成之混合蒸氣甲，全部收集冷卻為液體。所得冷卻液體第二次加熱至 80 ℃，所生成之混合蒸氣乙，同樣全部收集冷卻為液體。最後液體中 B 之莫耳分率為若干？
  options:
  - label: A
    content: '0.25'
  - label: B
    content: '0.33'
  - label: C
    content: '0.50'
  - label: D
    content: '0.67'
  - label: E
    content: '0.75'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '第一次汽化：$P_{A}$＝$P_{A}^{°}$×$X_{A}$＝300×$\frac{1}{4}$＝75（mmHg）

    $P_{B}$＝$P_{B}^{°}$×$X_{B}$＝100×$\frac{3}{4}$＝75（mmHg）

    第二次汽化：$P_{A}$＝$P_{A}^{°}$×$X_{A}$＝300×$\frac{1}{2}$＝150（mmHg）

    $P_{B}$＝$P_{B}^{°}$×$X_{B}$＝100×$\frac{1}{2}$＝50（mmHg）

    所求 $X_{B}$＝$\frac{50}{150+50}$＝0.25'
