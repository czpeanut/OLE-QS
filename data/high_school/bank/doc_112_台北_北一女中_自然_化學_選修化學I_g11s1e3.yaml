  - label: B
    content: '189'
  - label: C
    content: '949'
  - label: D
    content: '806'
  - label: E
    content: 1566 mmHg
  group_stem: '萃取技術（Extraction）是將兩不互溶溶劑置放於分液漏斗中，並且加入欲分離之混合物，之後搖晃液體使其均勻混合，利用溶解度差異進行物質分離的技術。萃取時，搖晃液體應伴隨著開閉轉閥進行洩壓（如附圖），否則密閉空間中累積過多溶劑蒸氣，加上開口處手掌壓的不夠緊，其中的液體因為氣壓太大很容易往外噴出，十分危險。

    理論上，兩種不互溶的液體，其蒸氣壓的表現，直接對應於該溫度之個別蒸氣壓，且青蒿素為低極性物質，假設完全溶於有機溶劑中。且已知水的飽和蒸汽壓於 30 ℃ 至 40 ℃ 區間內大約具有線性關係，可使用內插法求出不同溫度所對應到之水的飽和蒸汽壓。

    某日林姓教師陪同小綠同學在實驗室進行有機物合成研究，小綠將 72 克水與 74 克乙醚（分子量＝74）混合於分液漏斗中，並加入藥物萃取其中的青蒿素（分子量＝282）進行萃取，經分離後共得到青蒿素 28.2 克。

    ▲上圖為水、乙醇、氯仿和乙醚不同溫度對應到的飽和蒸氣壓數據

