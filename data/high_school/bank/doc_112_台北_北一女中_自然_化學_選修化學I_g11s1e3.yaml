  type: single
  page: 1
  stem: '某天在課堂上，老師向同學解說影響凡特何夫因數（Van''t Hoff factor，i）的因素，並提供給同學以下數據讓同學看看數據間是否具有關連性，試問下列同學何者推論<u>有誤</u>？（m 為重量莫耳濃度的單位）

    | 凡特何夫因數 i |  |  |  |

    | --- | --- | --- | --- |

    | 化合物 | 0.100 m | 0.0100 m | 0.00100 m |

    | 蔗糖 | 1.00 | 1.00 | 1.00 |

    | NaCl | 1.87 | 1.94 | 1.97 |

    | $K_{2}SO_{4}$ | 2.32 | 2.70 | 2.84 |

    | $MgSO_{4}$ | 1.21 | 1.53 | 1.82 |'
  options:
  - label: A
    content: 小綠綠：由數據可知，因為蔗糖是非電解質溶質，所以凡特何夫因數為 1
  - label: B
    content: 小小綠：我發現不同濃度 NaCl 的凡特何夫因數普遍比 $MgSO_{4}$ 來的大，是因為 $MgSO_{4}$ 的離子鍵強度大於 NaCl，導致 $MgSO_{4}$ 不易解離
  - label: C
    content: 迷你綠：老師說 NaCl 的凡特何夫因數理論值是 2，我認為應是在說假設 NaCl 在水中完全解離的狀況
  - label: D
    content: 微米綠：隨著重量莫耳濃度愈小，同一物質對應到的凡特何夫因數愈大，是因為濃度愈小解離度愈小所致
  - label: E
    content: 奈米綠：同樣濃度 $K_{2}SO_{4}$ 的凡特何夫因數比 NaCl 大，背後的原因應該是 $K_{2}SO_{4}$ 在水中可以解離出更多離子
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)濃度愈小，解離度愈大。
