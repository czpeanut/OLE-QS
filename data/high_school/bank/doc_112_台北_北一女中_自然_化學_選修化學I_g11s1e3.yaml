  section: 1
  number: 2
  type: single
  page: 1
  stem: 甲、乙、丙、丁四個燒杯盛裝不同濃度的硝酸鉀溶液。甲杯濃度為 3 M，比重為 1.1；乙杯濃度為 3 m；丙杯重量百分率濃度為 30.3％；丁杯溶質莫耳分率為 0.3。下列各瓶的濃度大小次序，何者正確？（式量：硝酸＝101）
  options:
  - label: A
    content: 甲＞乙＞丙＞丁
  - label: B
    content: 丙＞丁＞甲＞乙
  - label: C
    content: 乙＞甲＞丙＞丁
  - label: D
    content: 丁＞乙＞甲＞丙
  - label: E
    content: 丁＞丙＞甲＞乙
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '甲：3 M＝$\frac{3mol}{1L}$

    a％＝$\frac{3mol\times 101\frac{g}{mol}}{1L\times \frac{1000mL}{1L}\times \frac{1.1g}{1mL}}$×100％

    乙：3 m＝$\frac{3mol}{1kgH_{2}O}$

    b％＝$\frac{3mol\times 101\frac{g}{mol}}{1kg\times \frac{1000g}{1kg}+3mol\times 101\frac{g}{mol}}$×100％

    丙：30.3％

    丁：x＝0.3＝$\frac{3}{7+3}$

    c％＝$\frac{3mol\times \frac{101g}{1mol}}{3mol\times \frac{101g}{1mol}+7mol\times \frac{18g}{1mol}}$×100％

    因溶質克數相同（分子），分母愈大，濃度愈小

    $\Rightarrow$丁＞丙＞甲＞乙'
