- id: doc_111_苗栗_苑裡_社會_公民與社會_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: <u>新竹縣</u>某男子於2014年3月在<u>湖口鄉</u>一家餐廳吃飯，因車擋到人家門口且停紅線，被警方要求移車，移車前他告知警方有喝酒，但移車後卻遭警方酒測，酒測值0.18 mg/L，被罰1萬9500元，吊扣駕照一年，並要參加道安講習，該男認為員警陷人於不義，經向監理所陳述意見提出異議後，仍不服其裁決，而向新竹地方法院提起行政訴訟，獲得撤銷。新竹地院表示，警察處理違規停車時，顯然已發現車主身上有酒氣，知道其有飲酒，就不該要求駕車。依警察職權行使法第8條第1項規定，警察對已發生危害或判斷易生危害時，得予以攔停或要求酒測，所稱「易生危害」，是駕駛自主所造成，但該名男子「易生危害」的情況，是因為信賴員警而配合要求移車所致，警方舉發行為已違反行政程序法第8條的原則，因此撤銷原處分。請問：行政程序法第8條的原則係下列何者？
  options:
  - label: A
    content: 誠實信用
  - label: B
    content: 程序從新
  - label: C
    content: 實體從舊
  - label: D
    content: 分配正義
- id: doc_111_苗栗_苑裡_社會_公民與社會_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 業者在網路上誤將所賣筆電標價錯誤，原價應是18500元，卻誤標價為1850元，買方A男、B男各於凌晨購買3台、6台，若買方主張其權利之行使，非但該業者將受損失甚鉅（誤標之售價為實際售價之一成，亦即若依誤標售價出售系爭商品，業者受有實際售價九成之損失），買方亦將藉此取得甚多利益（即以顯不相當之一成價格購買系爭商品），且買方於網路下單訂購之初，即明顯知悉其嗣後權利行使，將造成該業者重大損失。請問：買方最可能違反下列何種原則？
  options:
  - label: A
    content: 法治國原則與民主國原則
  - label: B
    content: 歷史解釋與目的解釋
  - label: C
    content: 誠實信用與禁止權利濫用
  - label: D
    content: 程序從新原則
- id: doc_111_苗栗_苑裡_社會_公民與社會_g11s1e1_s2_17
  section: 2
  number: 17
  type: single
  page: 2
  stem: 依據本文，沉沒成本的機會成本會是下列何者？
  options:
  - label: A
    content: 等於零
  - label: B
    content: 已經投資了時間、金錢或部分資源
  - label: C
    content: 眼前的成本和機會
  - label: D
    content: 還可能再回收的成本
  group_stem: (一)公民老師上課時曾說到，所謂的沉沒成本，就是已經付出，不能再回收，不能再選擇的。而沉沒成本卻常使人產生一種謬誤的效應。<u>卡內基梅隆大學</u>商學院助理教授<u>奥利沃拉</u>（Christopher Olivola）說：「沉沒成本效應是一種普遍傾向，指人持續努力做一件事、進行消費或追求一個選項，因為他們已經投資了時間、金錢或部分資源在裡面。」「這種效應成了謬誤，因為它逼得你去做讓你不快樂或不值得的事。」。「你怎麼做都無法取回失去的金錢，就算做讓你不快樂的事也無法讓你的錢回來，還會讓你更糟。」重點是，你在做關於一項計畫或投資的決策時，不應該把沉沒成本納入決定考量。這些成本已經離你而去，你的決定應該以眼前及未來的成本和機會為基礎。（本文大部分節錄自天下雜誌官網/別讓沉沒成本謬誤毀了你的決定/發布日：2018-8-23/編譯：樂羽嘉）
