  stem: 下列何者符合大法官的觀點？
  options:
  - label: A
    content: 基於憲法保障人民工作權的意旨，立法者不得因任何理由限制工作權
  - label: B
    content: 只有先落實合理的差別待遇才能促成無差別對待
  - label: C
    content: 無差別對待似乎公平，但可能對特定群體產生更不利的結果
  - label: D
    content: 對處境不利者，政府應採用合理的差別待遇政策以達到實質平等。（請以2B鉛筆畫記在答案卡）
  group_stem: 大法官會議釋字第649號解釋其中重要爭點即：按摩業僅專由視障者從事的規定，是否違反憲法平等權。在解釋文中，大法官首先肯定在約30年前為提升視障者經濟地位及社會地位而按摩業僅專由視障者從事的規定，此係合理的差別對待。但是又認為：系爭規定施行近三十年，仍未能大幅改善視障者之經濟與社會地位，從而其差別對待已不合理，有違憲法第七條保障平等權之意旨。是以《身心障礙者權益保障法》非視覺障礙者不得從事按摩業的規定，係違反憲法平等權。
