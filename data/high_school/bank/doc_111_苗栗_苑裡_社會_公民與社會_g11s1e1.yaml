  group_stem: (五)我國立法院理論上是以委員會審查為中心，依據立法委員之不同專業，分別擔任不同專業委員會之委員，以避免浪費立法資源。所以，理論上，委員會審查結論具專業而少被推翻，但實際運作上，專業委員會審查結論，未必受到全體立法委員的尊重。個別委員的堅持，或是黨團協商，常常就能將委員會討論結論棄置不顧，多有辛苦白做工之情形。（資料來源：著作權筆記官網/甚麼是三讀程序/著者：章忠信） 關於我國立法程序，請回答下列問題：
