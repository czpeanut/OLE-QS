  stem: 下列何者符合John Rawls「正義論」兩原則的「第1原則」？
  options:
  - label: A
    content: 無分性別、年齡、能力、地域、族群及其他條件任何人均得接受教育
  - label: B
    content: 學測考試延長視障者作答時間
  - label: C
    content: 地方民意代表婦女保障名額制度
  - label: D
    content: 老農津貼制度
  group_stem: (四)「正義論」作者John Rawls認為，在實際的社會中，我們是被迫降臨到這個世界，並非自願加入這個社會體系，以致於發現自己早已處在某種特定地位，而這個地位深深影響著我們的人生前途。假定我們願意使用原初位置的方式進入協商與討論，John Rawls相信，我們最後會選出一個基於平等互惠的正義原則。在原初位置的假想設定下，最後會選他所謂的兩條正義原則：第1原則：同樣主張獲得完全適當且平等的基本自由。第2原則：社會與經濟的不平等必須要滿足兩個條件才能成立：(a)職務與地位，應該基於機會的公平平等條件向所有人開放。(b)在最大程度上增進最不利者的利益。（主要編著者：長榮大學應用哲學系助理教授劉俊麟）
