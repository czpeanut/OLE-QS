  stem: 法國學者Thomas Piketty所著《二十一世紀資本論》關鍵論述是：如果政府放任市場自由運作，那麼三、四十年後社會上將近九成的資本都會集中在最富有的百分之十富豪手中。長此以往，社會終將因為財富與所得分配太過不均而產生動亂。(資料主要來源：新新聞官網/朱敬一教你如何懂《二十一世紀資本論》)，為避免貧富差距擴大，政府對社會資源的分配需要作何種考量？
  options:
  - label: A
    content: 經濟效率
  - label: B
    content: 成本效益
  - label: C
    content: 公平
  - label: D
    content: 環境永續
