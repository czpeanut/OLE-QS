  stem: 某甲與A電信公司尚有1年5個月4G月繳799元不限速吃到飽的合約，若於現在提早解約，將支付違約金9000元，但在此時B電信公司破天荒地推出4G不限速吃到飽月繳399元方案，引爆申辦熱潮，某甲決定與A公司解約，攜碼跳槽至B公司，排隊約2小時，終於申辦成功。請問：某甲此舉是否符合經濟學理性人的基本假設？
