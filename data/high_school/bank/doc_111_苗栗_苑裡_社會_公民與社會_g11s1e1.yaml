  stem: 就「修復式正義」的實施内容，主要係落實下列何者？
  options:
  - label: A
    content: 環境正義
  - label: B
    content: 居住正義
  - label: C
    content: 分配正義
  - label: D
    content: 匡正正義
  group_stem: (三)我國少年犯罪原則上適用《少年事件處理法》處理，而例外時，情節重大者才適用《刑事訴訟法》的程序。《少年事件處理法》已開始著重並朝「修復式正義」的方向修法並實施。有關「修復式正義」的理念最早是緣起於紐西蘭處理少年犯的審判方式，藉由加害人、被害人、雙方家族、社區居民共同參與社區審判會議、面對面坦誠溝通、維護加害人尊嚴、保障被害人權益、修補社會關係並減低再犯率，企圖從根本之道來解決少年犯的問題，避免今目的少年犯淪為明日的成人犯。除了紐西蘭外，許多先進國家，例如澳洲、加拿大、美國、日本、德國等國，對於少年的刑事司法制度也紛紛引用了「修復式正義」的作法。（主要資料來源：臺灣博碩士論文知識加值系統/我國少年司法體系執行修復式正義之研究/著者：簡吉照）
