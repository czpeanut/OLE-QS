  group_stem: (一)公民老師上課時曾說到，所謂的沉沒成本，就是已經付出，不能再回收，不能再選擇的。而沉沒成本卻常使人產生一種謬誤的效應。<u>卡內基梅隆大學</u>商學院助理教授<u>奥利沃拉</u>（Christopher Olivola）說：「沉沒成本效應是一種普遍傾向，指人持續努力做一件事、進行消費或追求一個選項，因為他們已經投資了時間、金錢或部分資源在裡面。」「這種效應成了謬誤，因為它逼得你去做讓你不快樂或不值得的事。」。「你怎麼做都無法取回失去的金錢，就算做讓你不快樂的事也無法讓你的錢回來，還會讓你更糟。」重點是，你在做關於一項計畫或投資的決策時，不應該把沉沒成本納入決定考量。這些成本已經離你而去，你的決定應該以眼前及未來的成本和機會為基礎。（本文大部分節錄自天下雜誌官網/別讓沉沒成本謬誤毀了你的決定/發布日：2018-8-23/編譯：樂羽嘉）
