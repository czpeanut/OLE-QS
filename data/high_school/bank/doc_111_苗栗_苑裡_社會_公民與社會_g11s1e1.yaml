  stem: 《原住民族基本法》第21條第1項規定：「政府或私人於原住民族土地或部落及其周邊一定範圍內之公有土地從事土地開發、資源利用、生態保育及學術研究，應諮商並取得原住民族或部落同意或參與，原住民得分享相關利益。」臺北高等行政法院因業者申請礦權展延時，未依《原住民族基本法》第21條第1項規定諮商並取得部落同意或參與，因此撤銷經濟部給予的採礦許可。法院會撤銷的原因最可能是業者與經濟部違反下列何者？
