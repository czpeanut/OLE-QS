  stem: 酒駕處以有期徒刑的規定，與下列何者的誘因類型相同？
  options:
  - label: A
    content: 政府對汰舊換新或新購電動機車將給予補助
  - label: B
    content: 垃圾費隨袋徵收，對未使用專用垃圾袋者，將處以罰鍰
  - label: C
    content: 政府發放振興券以活絡經濟
  - label: D
    content: 違反兒童與少年福利與權益保障法規定依法公布姓名
  group_stem: (二)關於酒駕，我國於1968年開始規定處以罰鍰，在1975年、1986年、1996年三次加重罰鍰，1999年吐氣酒精濃度逾0.55 mg/L者，將被移送處以刑罰。2001年再次提高罰鍰，2007年亦再次加重刑罰。2011年修法規定，因酒駕致人於死者，處1年以上7年以下有期徒刑；致重傷者，處6個月以上5年以下有期徒刑。2013年進一步加重刑責：因酒駕致人於死者，處3年以上10年以下有期徒刑；致重傷者，處1年以上7年以下有期徒刑。2019年亦再加重行政罰、刑罰與相關措施。此係政府以政策作為誘因來影響人民行為，以維持交通與社會秩序。
