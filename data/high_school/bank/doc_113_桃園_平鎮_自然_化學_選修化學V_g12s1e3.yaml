  - label: B
    content: $\frac{5}{3}$
  - label: C
    content: $\frac{5}{6}$
  - label: D
    content: $\frac{6}{5}$
  - label: E
    content: $\frac{3}{5}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 過錳酸鉀作為氧化劑，產物為$Mn^{2＋}$，氧化數變化：＋7→＋2，共吸收5個電子；二鉻酸鉀作為氧化劑，產物為$2Cr^{3＋}$，氧化數變化：2×（＋6→＋3），共吸收6個電子。因兩者濃度相等，故在滴定實驗中要氧化等量的還原劑，需要的體積比＝6：5。故選(D)。
