  section: 2
  number: 19
  type: multiple
  page: 2
  stem: 今有未知濃度的NaClO溶液30毫升，將其酸化後加入過量的KI，並加入少許的澱粉，再將混合溶液以0.1 M的$Na_{2}S_{2}O_{3}$溶液滴定，達滴定終點時共耗去30毫升。下列有關此實驗過程的敘述，哪些正確？【提示：$ClO^{－}$ → $Cl^{－}$，$I^{－}$ → $I_{2}$，$S_{2}O_{3}^{2－}$ → $S_{4}O_{6}^{2－}$】
  options:
  - label: A
    content: 澱粉作為指示劑
  - label: B
    content: 達滴定終點時，溶液呈藍色
  - label: C
    content: 該實驗在鹼性環境中也仍可判定滴定終點
  - label: D
    content: '[NaClO]＝0.025 M'
  - label: E
    content: '[NaClO]＝0.05 M'
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 間接碘滴定中，碘只是擔任電子的傳遞者，整個反應中發生氧化的是$S_{2}O_{3}^{2－}$ → $S_{4}O_{6}^{2－}$，每個$S_{2}O_{3}^{2－}$氧化失去1個電子、發生還原的是$ClO^{－}$ → $Cl^{－}$，每個$ClO^{－}$還原得到2個電子。其實驗流程為：①先將氧化劑加入錐形瓶中，②在錐形瓶中加入過量的KI，將氧化劑完全還原並生成$I_{3}^{－}$，③以$Na_{2}S_{2}O_{3}$滴定所生成的$I_{2}$，由深褐色轉至淡黃色時加入澱粉指示劑（此時錐形瓶中溶液應為藍色），④繼續滴定至溶液呈無色。因此(A)正確；(B)應為無色；(C)鹼性環境中碘會自身氧化還原故不適合；(D)(E)得失電子數相等： 0.1(M)×0.030(L)×1（每個$S_{2}O_{3}^{2－}$氧化失去的電子數）＝C(M)×0.030(L)×2（每個$ClO^{－}$還原得到的電子數量），可得過$ClO^{－}$濃度＝0.05 M。故選(A)(E)。
