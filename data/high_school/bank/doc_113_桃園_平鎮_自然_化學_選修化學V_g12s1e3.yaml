  section: 2
  number: 18
  type: multiple
  page: 2
  stem: 將一顆市售維他命C（分子式$C_{6}H_{8}O_{6}$，分子量＝176）加水使其完全溶解，配製成100 mL溶液，取此溶液20 mL置入一錐形瓶中，加入適量的澱粉液作為指示劑，需用10 mL的0.10 M碘液滴定，達到滴定終點，維他命C與碘的化學反應式如下：$C_{6}H_{8}O_{6}$(aq)＋$I_{2}$(aq) → $C_{6}H_{6}O_{6}$(aq)＋$2H^{＋}$(aq)＋$2I^{－}$(aq) 下列敘述，哪些正確？
  options:
  - label: A
    content: 滴定終點時錐形瓶內溶液的pH值下降
  - label: B
    content: 反應中，碘為還原劑
  - label: C
    content: 反應中每莫耳維他命C分子釋出2莫耳電子
  - label: D
    content: 當藍色不再消失，表示錐形瓶中溶液含有少許過量的碘
  - label: E
    content: 此顆市售維他命C中約含有880 mg的維他命C
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)產物有$H^{＋}$，故pH值下降；(B)$I_{2}$＋$2e^{－}$ → $2I^{－}$，被還原故為氧化劑；(C)得電子數＝失電子數，$I_{2}$得到2個電子故維他命C失去2個電子；(D)當維他命C用完，多餘的$I_{2}$會無法被反應掉而呈現藍色，此時即滴定終點；(E)由方程式可得知參與反應的維他命C莫耳數＝$I_{2}$莫耳數，故參與反應的維他命C莫耳數＝0.1×0.010＝0.0010 mol，其質量則為0.0010×176＝0.176 g。又此實驗是自100 mL中取20 mL進行滴定，故原本的維他命C錠中有0.176×5＝0.88 g的維他命C，即880 mg。故選(A)(C)(D)(E)。
