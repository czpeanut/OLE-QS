  stem: 氫氧燃料電池是太空飛行的重要能量來源，燃料電池是以氫與氧為反應物，氫氣在鎮（Ni）極與$OH^{－}$反應，氧氣在氧化鎳（NiO）極與水反應，反應的淨產物是水，氫氧化鉀水溶液為電解液。根據化學電池的原理，下列有關此電池的敘述，何者正確？
