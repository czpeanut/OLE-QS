  stem: 碘（$I_{2}$）在鹼性溶液中不安定，會進行自身氧化還原反應：$I_{2}$＋$OH^{－}$ → $I^{－}$＋$IO_{3}^{－}$＋$H_{2}$O（未平衡），試問$I_{2}$作為還原劑者占全部參與反應之$I_{2}$的比例為何？
  options:
  - label: A
    content: $\frac{1}{6}$
  - label: B
    content: $\frac{2}{6}$
  - label: C
    content: $\frac{3}{6}$
  - label: D
    content: $\frac{4}{6}$
  - label: E
    content: $\frac{5}{6}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 發生氧化：$I_{2}$→$IO_{3}^{－}$，氧化數（0 → ＋5），發生還原：$I_{2}$→$I^{－}$，氧化數（0 → －1）。考慮得失電子相等，發生氧化的碘與發生還原的碘數量＝1：5，因為自身氧化還原反應，故係數寫在產物上較不會不小心搞錯。故可在$IO_{3}^{－}$、的係數加上1、$I^{－}$的係數加上5： 可得方程式： $aI_{2}$＋$bOH^{－}$ → $5I^{－}$＋$IO_{3}^{－}$＋$cH_{2}$O 再由I原子不滅可得a＝3、由電荷不滅可得b＝6、由H原子不滅可得c＝3，原方程式：$3I_{2}$＋$6OH^{－}$ → $5I^{－}$＋$IO_{3}^{－}$＋$3H_{2}$O共有6個碘原子，其中作為還原劑者氧化成$IO_{3}^{－}$，故為$\frac{1}{6}$。故選(A)。
