  stem: 有一電化電池，一個電極為鋅棒，浸在200毫升的1 M硫酸鋅中；另一電極為銀棒，浸在200毫升的1 M硝酸銀中，以安培計連接二電極，並以鹽橋插入兩溶液。關於此電化電池之敘述，哪些正確？（原子量：Zn＝65.4，Ag＝108）
