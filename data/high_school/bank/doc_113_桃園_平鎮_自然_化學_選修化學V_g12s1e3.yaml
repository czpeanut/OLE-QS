- id: doc_113_桃園_平鎮_自然_化學_選修化學V_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: $Cr^{3＋}$在酸性溶液中穩定，不易被氧化，但在鹼性溶液中，$Cr^{3＋}$有較強的還原性，易被氧化成$CrO_{4}^{2－}$離子。今有一漂白水含$ClO^{－}$，放入Cr (OH)$_{3}$固體後產生反應：a $ClO^{－}$＋b Cr (OH)$_{3}$＋c 甲 → d $Cl^{－}$＋e $CrO_{4}^{2－}$＋f 乙(未平衡)，其中a～f為最簡整數比時的係數，而甲、乙為平衡時所需加入的粒子，下列敘述何者正確？
  options:
  - label: A
    content: 甲為$H_{2}$O
  - label: B
    content: 乙為$H^{＋}$
  - label: C
    content: a＋b＋c＝d＋e＋f
  - label: D
    content: 係數總合＝16
  - label: E
    content: a＋c＝d＋2 e
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 發生氧化：Cr(OH)$_{3}$→$CrO_{4}^{2－}$，氧化數（＋3 → ＋6）發生還原：$ClO^{－}$→$Cl^{－}$，氧化數（＋1 → －1）。由電子相等，可在Cr(OH)$_{3}$、$CrO_{4}^{2－}$的係數加上2、$ClO^{－}$、$Cl^{－}$的係數加上3。 可得方程式： $3ClO^{－}$＋2Cr(OH)$_{3}$＋c甲 → $3Cl^{－}$＋$2CrO_{4}^{2－}$＋f乙（未平衡） 為了平衡電荷需要使用環境中的$OH^{－}$離子，故甲為$OH^{－}$、c＝4 接著平衡原子數，可得知乙為$H_{2}$O、f＝5。 方程式為： $3ClO^{－}$＋2Cr(OH)$_{3}$＋$4OH^{－}$ → $3Cl^{－}$＋$2CrO_{4}^{2－}$＋$5H_{2}$O。故選(E)。
