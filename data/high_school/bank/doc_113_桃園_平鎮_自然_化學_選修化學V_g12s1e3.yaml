  stem: 步驟2中隔水加熱至70℃之目的為何？（2分）
  group_stem: '某日<u>小盧</u>整理實驗桌時，發現一瓶未加蓋的水合硫酸鐵（II）($FeSO_{4}$．$7H_{2}$O)，其中已部分晶體變為黃褐色。經詢問老師，得知是因為部分鐵（II）離子被氧化所致。於是<u>小盧</u>決定進行氧化還原滴定實驗分析這瓶試藥中鐵（II）離子的含量。

    實驗過程如下：

    步驟1：將待標定的過錳酸鉀溶液加入潤洗過的滴定管中，排除尖端氣泡後，記錄讀數為1.00 mL。

    步驟2：精確稱量0.134克草酸鈉（式量134），置於錐形瓶中，加入2.00 M的硫酸25.00 mL及70.00 mL蒸餾水，隔水加熱至70℃。

    步驟3：趁熱將錐形瓶移至滴定管下方，以過錳酸鉀溶液滴定，不時搖晃錐形瓶使溶液混合均勻，直到溶液呈現「……色」不再褪色為止，記錄滴定管中的刻度讀數為9.00 mL。

    步驟4：稱取水合硫酸鐵（II）試樣2.00 g，配製成25.00 mL的水溶液，並置於另一錐形瓶中，然後加入2.00 M硫酸25.00 mL及70.00 mL蒸餾水，混合均勻。再以標定後的過錳酸鉀溶液滴定，此時滴定管中最初刻度讀數為9.00 mL，滴定直到錐形瓶中的溶液呈現「……色」不再褪色為止，記錄滴定管中的刻度讀數為29.00 mL。

    根據以上實驗步驟與數據回答下列問題：'
