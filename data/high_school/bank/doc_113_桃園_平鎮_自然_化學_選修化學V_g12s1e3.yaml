  stem: '請根據以下現象描述回答問題

    (1)人體血紅蛋白中含有$Fe^{2＋}$，如果誤食亞硝酸鹽，會使人中毒，因為亞硝酸鹽會使$Fe^{2＋}$轉變成$Fe^{3＋}$，生成高鐵血紅蛋白而喪失與$O_{2}$結合的能力。服用維生素C就可緩解亞硝酸鹽的中毒。

    (2)某些食品包裝內常放有一小包脫氧劑，用來防止或減緩食物的氧化，其原理是利用鐵粉的氧化消耗氧氣，以降低密封包裝內的氧氣濃度。

    根據以上內容判斷維生素C和鐵粉的功用分別為何？'
  options:
  - label: A
    content: 氧化劑：還原劑
  - label: B
    content: 還原劑：氧化劑
  - label: C
    content: 還原劑：還原劑
  - label: D
    content: 氧化劑：氧化劑
  - label: E
    content: 還原劑：乾燥劑
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 原文提及「亞硝酸鹽會使$Fe^{2＋}$轉變成$Fe^{3＋}$，而維生素C可緩解亞硝酸鹽的中毒」，代表維生素C為氧化劑、亞硝酸鹽為還原劑；「利用鐵粉的氧化消耗氧氣」，代表鐵粉作為還原劑使用。故選(C)。
