  answer_source: answer_key
  explanation: (A)氧氣被氫氣（還原劑）還原、氫氣被氧氣（氧化劑）氧化；(B)陽極發生氧化反應、陰極發生還原反應；(C)在外電路是由負極(陽極)向正極（陰極）移動，題幹提到氫氣(發生氧化反應)是在鎳（Ni）極，故鎳極為陽極、氧化鎳為陰極，電子由Ni→NiO；(D)氫氧燃料電池的全反應式為$2H_{2}$＋$O_{2}$ → $2H_{2}$O，會產生更多水，故溶液中KOH濃度會下降，pH也會下降；(E)效率比一般電池還高。故選(D)。
