  group_stem: '明崇禎年間，著名的地理學家、文學家徐霞客，縱遊舉國南北，跋涉至許多人煙罕至的荒野地區，並留下遊記，為中國早期地景研究重要之作。他曾耗時 3 年在中國西南一帶石灰岩地形區詳加踏查，並其遊記中有幾段紀錄：

    其一、滇遊日記：「三里，逾岡之東，……屏峙西北。東北又有一山，橫排於兩界缺處，而猶遠不睹羅平城，……路依西界北行，遙望東界遙峰下，(甲)<u>峭峰離立，分行競穎</u>，復見粵西面目。蓋此叢立之峰，西南始於此，東北盡於道州，磅礡數千里，為西南奇勝……」二水同出於西門外白蠟山麓龍潭中，(乙)<u>分流城東南而各墜地穴</u>，亦一奇也。……。有水自白蠟麓龍潭出，名魯彝河，東環城，南出魯彝橋，而東入地穴。其北有分流小水亦如之……羅莊山，在城東南六十里。其山參差森列，(丙)<u>下多卓錐拔筍之岫</u>，粵西石山之發軔也」

    其二、粵西日記：「峰轉溪回，始見真仙洞門，穹然東北高懸，溪流從中北出，前有大石梁二道駢圈溪上。越梁而西，乃南向入洞焉。洞門圓迥，如半月高穹，中剜一山之半。其內水陸平分，北半高崖平敞，南半回流中貫。由北畔陸崖入數丈，崖疊而起，中壁橫拓，複分二道。壁之西有竅南入，而僧棲倚之；壁之東南，溯溪岸入其奧扃，則(丁)<u>巨柱中懸，上綴珠旒寶絡，下環白象、青牛</u>，稍後則老君危然，鬚眉皓潔，晏坐而對之，皆玉乳之所融結，而洞之所以得名也。其後則堂皇忽嬙，曲戶旋分，千門萬牖，乳態愈極繽紛，以無炬未及入。其下則溪匯為淵，前趨峽壁，激石轟雷。」

