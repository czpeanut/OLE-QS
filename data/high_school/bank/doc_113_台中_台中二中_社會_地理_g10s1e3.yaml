- id: doc_113_台中_台中二中_社會_地理_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 續上題，假設上述 4 種地形為同一時期冰河所造成，則其出現位置按冰河上游至下游排序，下列何者合理？
  options:
  - label: A
    content: 甲丙乙丁
  - label: B
    content: 乙丙甲丁
  - label: C
    content: 丙甲乙丁
  - label: D
    content: 丙乙丁甲
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(C)(丙)羊背石：冰蝕→(甲)鼓丘：冰磧→(乙)蛇丘：冰河底部融水沉積→(丁)外洗扇：冰河完全融成水的堆積物。

    11.7 月均溫 20 幾度、1 月＜0°，應位於(B)溫帶。

    12.(A) 7 月山頂仍為 22°左右。(B) 7 月氣溫在低海拔的遞減率斜率較陡（變化較快）。(D) 500 公尺以上 7 月的溫度變化較多。

    13.縱沙丘為風向與沙丘走向垂直，故答案選(D)。

    14.10 公尺海拔為 28 ℃，2,310 公尺為飽和點，2,310 公尺前均為乾空氣計算，氣溫遞減為（28－23）×1 ℃＝5 ℃，2,310 ～ 2,610 公尺以溼空氣計算，氣溫再降 3×0.6 ℃，山頂約為(B) 3 ℃。

    15.(D)鞍部因地勢較低，入夜之後較溫暖（氣溫較①高），形成②低壓，山區較冷形成高壓，所以吹③山風。

    16.(D)上游山洪暴發會導致氾濫，泥沙大量流入下游、出海口，增加陸化的速度。

    17.(B)左圖顯示，20 ℃的氣溫位於較熱的北方，屬南半球，且 7 月為冬季，與同緯度地區相比，甲地較冷，因此為陸地；右圖顯示，20 ℃的氣溫位於較熱的南方，屬北半球，且 7 月為夏季，與同緯度地區相比，丁地較熱，因此為陸地。

    18.丙：臺灣東岸多海崖，也為平直海岸線；丁：東北部才多岬灣。

    19.(甲)愈高緯科氏力愈大；(乙)因地球西向東轉，北半球科氏力向右旋、南半球向左旋。

    20.圖中地形均分布在乾燥氣候區，研判應為風成地形，故答案選(C)。

    21.行星風系完全成立需要：①地軸不傾斜②無海陸差異③無高低差。故答案選(B)。

    22.(乙)端磧為冰河最後完全融化的界線，X 區仍為冰磧，淘選度差；(丙)蛇丘也在 X 區出現。

    23.冷鋒抵達，代表受⑤高壓影響，風力會較③強勁。

    24.(甲)蘆洲為河中洲；(乙)艋舺為獨木舟之意；(戊)三層形容的是河階。

    25.(C) 6 月為鋒面雨—乙，9 月為颱風雨—丁。甲為對流雨，丙為地形雨。

    26.(B)墾丁為裙礁，珊瑚礁緊貼陸地— A；東沙環礁為珊瑚礁圍繞礁湖，中央無陸地— D。

    27.梅雨鋒面為南方暖空氣與北方冷空氣接觸所形成的鋒面雨，愈北暖空氣愈晚抵達，(D)日本九州最北。

    28.此化學式為石灰岩還原堆積下來的地形，應為洞穴內的沉積作用，故答案選(D)(乙)(丁)。

    29.圖中數值 d 最大（北方高溫）為南半球，同緯度線剖面彎曲處中央水溫較低，因此應為涼流往低緯地區流動。故答案選(A)。

    30.(C)秘魯涼流符合南半球的涼流條件。

    31.該地終年高溫多雨應為雨林植被，樹種豐富，土壤養分差。故答案選(B)(乙)(丁)。

    32.(D)沙頸岬地形中的甲島稱為(丙)陸連島，乙的部分稱為(戊)連島沙洲。

    33.(A)沙頸岬地形中的島是沿海山丘受沉水作用形成孤島後，因洋流或沿岸流堆積形成沙洲，將孤島與陸地相連。

    34.此海岩有受蝕洞穿，稱為(B)海蝕門。

    35.由暴雨、突破日降水量歷史極值等特徵可知，此為描述短時間內的降水量，故答案選(C)③降水強度。

    36.降水變率公式為：∣某年降水量－過去長期平均∣／過去長期平均×100 ％；∣480－370∣／370×100 ％＝(B) 30 ％。故答案選(B)。

    37.(甲)甲區為雨林氣候，降水為熱對流雨；(乙)丁區為乾燥氣候，降水變率較乙大。

    38.冰河谷形成的瀑布稱為(A)懸谷。

    39.已知為冰蝕地形，所以題圖應為羊背石，冰河來向為緩坡，因此冰河向題圖左邊移動，故答案選(B) ←。

    40.此區動物原居南半球，在南半球進入冬季（乾季時），會往北方的 I.T.C.Z. 區尋求水源，故答案選(A)。

    41.此區為乾溼季節分明的熱帶莽原氣候，故答案選(B)。

    42.(D)南半球的乾季為北半球的夏季，因此幾內亞灣吹西南風，進入雨季。

    43.(C)甲為潮差的範圍即為②潮間帶或稱③前濱區。

    44.河流出海口的輸沙會受南寮漁港阻擋的影響，無法往南輸送，(D)丁區受蝕後退最為嚴重。

    45.4 地中僅有乙為低壓帶，(B)甲丙丁均為高壓下沉氣流。

    46.(C)此時為冬季，出現強烈大陸冷高壓時即為寒流南下。

    47.(A)南半球因陸地比例相對少，因此氣壓線大致呈現連續性分布；北半球因明顯海陸分布，同緯度會造成不同氣壓。

    48.(C)(乙)高溫多雨、豐厚石灰岩，(丙)富節理、地形相對平坦，(丁)地下水位低、最底有不透水層的條件最適合發育石灰岩地形。

    49.(A)為錐丘。(B)為殘丘。(C)為滲穴。(D)為漥盆。(丙)卓錐拔筍形容山勢高峭，為(A)錐丘。

    50.題文中(甲)為殘丘、(乙)為漥盆、(丙)為錐丘、(丁)為石柱，僅有(D)(丁)為堆積作用所形成的地形。'
