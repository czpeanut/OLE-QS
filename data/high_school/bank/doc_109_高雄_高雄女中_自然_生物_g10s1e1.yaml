  group_stem: ＿＿＿科學家發現，一種海蛞蝓能夠通過攝食來“盜取＂藻類的基因，因而能像植物一樣從陽光中獲得能量。這種海蛞蝓名為綠葉海天牛（Elysia chlorotica），是一種腹足綱海天牛科的動物。它們能將藻類的基因整合到自己的染色體內，從而獲得光合作用的能力。這意味著，它們可以利用太陽能將$CO_{2}$和水轉化為營養物質。生物學家西德尼•皮爾斯（Sidney Pierce）教授說：「這些基因使綠葉海天牛可以依賴陽光來提供營養。因此，如果食物來源發生問題，在找到可食用藻類之前它們也不會餓死。在未來的醫療應用中，這種自然發生的基因轉移非常具有啟發性。」 在開始食用藻類之前，幼年綠葉海天牛的身體呈現棕紅色。綠葉海天牛能夠將藻類的葉綠體整合到自己的細胞中，從而呈現出亮綠色。綠葉海天牛吞食一種學名為Vaucheria litorea的藻類，並將其葉綠體整合到自己消化系統的細胞中。之後，綠葉海天牛利用這些葉綠體為自己生產醣類，時間最長可達9個月。這些被吸收的葉綠體為何能維持如此長的時間呢？答案目前還不得知。皮爾斯教授及其同事對綠葉海天牛的DNA進行了分析，發現它們將來自藻類的一個基因整合到了自己的染色體中。利用這個基因，綠葉海天牛可以對損傷的葉綠體進行修復，並保持其功能運轉正常。
