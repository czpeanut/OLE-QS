  stem: 巴拉刈是一種常用來做為除草劑的強氧化劑，可抑制光反應電子傳遞的過程。對人來說，巴拉刈也是劇毒，如果進入細胞會產生大量的過氧化物。下列敘述何者正確？
  options:
  - label: A
    content: 植物在噴灑巴拉刈後仍可持續進行固碳反應
  - label: B
    content: 巴拉刈分解後產生氧使細胞加速受損
  - label: C
    content: 巴拉刈以吸收電子方式干擾電子傳遞過程
  - label: D
    content: 巴拉刈在葉綠體的作用位置主要在基質
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
