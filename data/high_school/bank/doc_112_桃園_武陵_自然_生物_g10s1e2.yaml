  stem: 一般正常人的紅血球為雙凹圓盤形，但若其中一等位基因S發生突變，則會成為鐮形血球帶因者，鐮形血球帶因者在正常情形下，不影響紅血球攜氧的情形，但若缺氧時則會有所影響；而若兩等位基因S均發生突變，則所有紅血球均為鐮形血球，容易早夭。依據上文知識判斷，下列哪一種性狀遺傳與上述案例類似？
