- id: doc_112_桃園_武陵_自然_生物_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 細胞分裂的方式除了有絲分裂與減數分裂外，2022年<u>自然雜誌</u>刊登<u>臺灣</u>科學家<u>陳振輝</u>的新發現：斑馬魚表皮細胞會進行「無合成分裂（asynthetic
    fission）。斑馬魚有兩層表皮細胞，位於下層的表皮幹細胞可如一般體細胞進行分裂，但位於上層已分化細胞竟然可以無需進行染色體的複製，直接分裂產生四個細胞，根據研究團隊判斷，此舉目的應為更快速的擴展表面積。目前此現象僅在斑馬魚幼魚觀察到，其他生物或部位是否有這樣的分裂方式，仍待進一步的研究。關於上文，下列敘述何者正確？
  options:
  - label: A
    content: 文中提到的三種細胞分裂，最終產生的細胞數目、細胞中染色體含量皆不相同
  - label: B
    content: 無合成分裂產生的新細胞皆不具遺傳物質
  - label: C
    content: 無合成分裂仍需涉及染色體的平均分配，因此有紡錘絲的參與
  - label: D
    content: 表皮幹細胞的分化潛能已受限制，只會分化為表皮細胞
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_112_桃園_武陵_自然_生物_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 誘導型多功能幹細胞（iPSCs）已成功應用在再生醫學上，2019年<u>日本</u>醫療團隊將誘導型多功能幹細胞特化的眼角膜移植至失明的女性患者，使其恢復視力，締造全球應用於視力的首例。下列有關幹細胞的敘述，何者正確？
  options:
  - label: A
    content: 人類造血幹細胞和全潛能幹細胞皆能特化成不同組織的細胞
  - label: B
    content: 誘導型多功能幹細胞不僅可特化成眼角膜細胞，也可分化成其他組織細胞
  - label: C
    content: 幹細胞分化成特定組織細胞後，可再受刺激變回原來的幹細胞
  - label: D
    content: 成人體内也有多功能幹細胞的存在
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
