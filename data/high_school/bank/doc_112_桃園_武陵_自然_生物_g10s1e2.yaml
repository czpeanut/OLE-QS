  stem: 下列有關血紅素蛋白的基因敘述，哪些正確？（多選）
  options:
  - label: A
    content: 若在理想情況下，單位時間内α鏈與β鏈表現量比值為2
  - label: B
    content: 精子形成過程中，α鏈基因與β鏈基因符合獨立分配律
  - label: C
    content: 正常體細胞中，可表現的血紅素蛋白等位基因共有4個
  - label: D
    content: 表現β鏈蛋白的遺傳模式是屬於單基因遺傳
  - label: E
    content: 在α地中海貧血症中，患者的隱性等位基因會表現異常α鏈蛋白
  group_stem: 正常血紅素蛋白具有4個蛋白質鏈，分別是2個α鏈和2個β鏈，若基因變異，造成任一條蛋白鏈的缺失或减少，導致血紅素蛋白量降低與紅血球細胞功能降低，進而造成地中海貧血症。地中海貧血症是最常見的血紅素蛋白異常的隱性遺傳性疾病，此疾病主要有兩型，α地中海貧血症和β地中海貧血症，如下表。
    正常體細胞具有兩對等位基因皆可獨立表現，用來製造足夠的α鏈蛋白，兩對基因皆位於第16對染色體上；另有一對等位基因位於第11對染色體上，可製造足夠的β鏈蛋白。在α地中海貧血症中，血紅素蛋白的α鏈產生的量不足，因此形成僅含有β鏈的血紅素蛋白四聚體。在β地中海貧血症中，血紅素蛋白的β鏈產生的量不足，使得α鏈形成不溶性聚集體（亦可稱α聚集體），其在未成熟的紅血球細胞內沉澱，並阻止其分化為成熟細胞。在正常個體細胞中，α鏈的等位基因數量較β鏈的等位基因多，預計會產生過量的α鏈進而形成α聚集體。然而，α聚集體不存在於正常個體的細胞中。研究發現紅血球中有一種大小約11kDa的蛋白，稱為α血紅素穩定蛋白（AHSP），揭示維持正常可溶性α鏈的一種機制。該蛋白質在合成時可與α鏈形成可溶性複合物，確保α鏈產生時可以正確折疊。分析AHSP和α鏈形成複合物的晶體，其結構顯示AHSP的位置即是β鏈與α鏈結合的位置。而當β鏈表現量足夠時，β鏈蛋白可取代AHSP，形成完整且具血紅素蛋白。請根據上文，回答下列問題：
  shared_asset: g3_43_45
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
