  stem: 野生型果蠅的身體為棕色。數月前在實驗室保存的野生型果蠅族群中，發現了一隻黄色身體的雄果蠅。將此黃身雄果蠅與棕身雌果蠅交配，所得的F1子代皆為棕身。再將這些棕身的F1果蠅互相交配，所得的F2子代中雌果蠅仍然都是棕色身體，但雄果蠅卻有一半是黃色身體。將F2中的黃身雄果蠅與棕身雌果蠅交配，有一半的交配組合所得的F3子代都是棕身，但另一半的交配組合所得的F3子代則無論雌雄，都是黃身和棕身各占一半。根據此實驗結果推論，則下列各項救述，哪些正確？
