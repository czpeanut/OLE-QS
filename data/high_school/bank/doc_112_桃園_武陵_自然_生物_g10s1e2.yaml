  stem: 根據文章敘述，下列何者正確？（單選）
  options:
  - label: A
    content: 蜂后的染色體套數為單套
  - label: B
    content: 蜂姐的染色體套數為雙套
  - label: C
    content: 雄而不事的惰蜂染色體為單套
  - label: D
    content: 「採花釀蜜者」的染色體套數為單套
  group_stem: 1897年<u>嚴復</u>譯自<u>托馬斯．亨利．赫胥黎</u>的《天演論》提及：「夫蜂有后，蜂王雌故曰后。其民雄者惰，而操作者半雌。採花釀蜜者皆雌而不交不孕，其雄不事事，俗誤為雌，呼曰蜂姐。一壺之内，計口而禀，各致其職。」。
    1845年<u>波蘭</u>牧師<u>約翰．德清宗</u>提出，雄蜂無父且由未受精的卵直接發育，雌蜂才是從受精卵發育而來。後來的研究證實，雄蜂的基因數量為雌蜂的一半。然此之後150年來，科學家一直不知道控制蜜蜂性別的基因為何。直至2003年，<u>德國</u>科學家<u>馬丁．比耶</u>等人分離出一種稱為互補性決定子（簡稱CSD）的蜜蜂基因，CSD的套數可決定蜜蜂性別：雙套為雌，單套為雄。若受精卵的CSD具有兩個不同型的等位基因時，兩個等位基因皆被活化合力製造出一種具有活性的蛋白質，能誘使受精卵發育成雌性；雌蜂則會按蜜蜂家族的需求進一步發育成工蜂或新蜂后。但是帶有一對同型CSD的受精卵，發育後的個體會被工蜂移除。由於未受精的卵僅有一個等位基因CSD，無法合成有活性的蛋白質，因此卵成熟後育為雄。雄蜂體型較工蜂大，食量也大，因此工蜂會根據繁殖的需要和食物的多寡來決定雄蜂去留。依上文及所習得的知識，回答下列問題。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
