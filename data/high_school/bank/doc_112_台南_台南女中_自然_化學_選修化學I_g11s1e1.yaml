  stem: 若卡計內原有 50 mL 的 0.50 M 鹽酸，在同溫下加入 40 mL 的 0.50 M 氫氧化鈉溶液，待溶液完全混合後，測得溫度上升了 3.2 ℃，則鹽酸與氫氧化鈉溶液的莫耳中和熱約為多少 kJ/mol？
  options:
