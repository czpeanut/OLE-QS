  answer_source: answer_key
  explanation: '由題意：開口端較低知 $P_{gas}$＝$P_{大氣}$－Δh＝760－40＝720（mmHg）

    又閉口式壓力計水銀面高度差即為氣體壓力即 720（mmHg）

    ∴選(B)'
