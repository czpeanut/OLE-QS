  stem: 在大氣壓力為 1 atm 時，將某定量的氮氣，以開口式壓力計測量其壓力，觀察到開口端的水銀面較閉口端低 40 mm，若改以閉口式壓力計測量，則兩端水銀面高度差為多少 mm？
  options:
