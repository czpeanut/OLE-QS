    content: '27'
  - label: B
    content: '48'
  - label: C
    content: '56'
  - label: D
    content: '60'
  - label: E
    content: '64'
  group_stem: 一般化學實驗室常用的簡易式卡計是由兩個保麗龍杯套疊放入燒杯中，將其加蓋密封，並插入溫度計及玻棒所組成。今以此卡計進行以下有關反應熱的實驗，假設卡計本身所吸收的熱量忽略不計，混合溶液的體積具有加成性，且所有水溶液之密度及比熱均與水相同，分別為 1.0 g/mL 及 4.2 J/g．℃，回答下列問題：（原子量：K＝39，N＝14，O＝16，Na＝23，Cl＝35.5，H＝1）
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '生成水的莫耳數＝$n_{NaOH}$＝0.5×$\frac{40}{1000}$＝2×$10^{－2}$（mol）

    溶液重（m）＝（50＋40）×1＝90（g）

    由 ΔH＝msΔt＝90×4.2×3.2＝1209.6（J）＝1.2096（kJ）

    $\Rightarrow$莫耳中和熱＝$\frac{1.2096}{2\times 10^{-2}}$≒60（kJ）

    ∴選(D)'
- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s2_14
  section: 2
  number: 14
  type: multiple
