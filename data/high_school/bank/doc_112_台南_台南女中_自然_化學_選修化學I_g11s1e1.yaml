- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知某液體的密度為 0.75 g/$cm^{3}$，在壓力為 660 mmHg 的高山上，約可撐起多少公尺的液柱高度？（水銀密度為 13.6 g/$cm^{3}$）
  options:
  - label: A
    content: '11.3'
  - label: B
    content: '12.0'
  - label: C
    content: '13.8'
  - label: D
    content: '14.3'
  - label: E
    content: '15.3'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '大氣壓力＝液體高度×液體密度，在同一地點以不同液體測量，所得壓力相同

    即 $h_{1}d_{1}$＝$h_{2}d_{2}$

    $\Rightarrow$660 mmHg×13.6 g/$cm^{3}$＝$h_{某液}$（mm 某液）×0.75 g/$cm^{3}$

    ∴$h_{某液}$＝11968 mm＝1196.8 cm≒12.0 m

    ∴選(B)'
