  stem: 在定壓下，對體積固定的開口容器中的空氣加熱，使其溫度由 27 ℃ 上升至 127 ℃，則留在容器內的空氣佔原有空氣的比率有多少 ％？
  options:
  - label: A
    content: '25.0'
  - label: B
    content: '33.3'
  - label: C
    content: '66.7'
  - label: D
    content: '75'
  - label: E
    content: '80'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設留在容器內的比率有 x％，則逸出比率為（100－x）％

    又由逸出率＝$\frac{T_{2}-T_{1}}{T_{2}}$×100％

    （100－x）％＝$\frac{400-300}{400}$×100％，解得 x＝75

    ∴選(D)'
