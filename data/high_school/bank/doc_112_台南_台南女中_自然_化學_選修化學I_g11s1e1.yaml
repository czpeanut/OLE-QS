  stem: 下列有關氧化數的敘述，哪些正確？
  options:
  - label: A
    content: KH 與 $H_{2}O_{2}$ 中的 H 原子之氧化數相同
  - label: B
    content: $KMnO_{4}$ 中，Mn 的氧化數為＋7
  - label: C
    content: $NH_{4}NO_{3}$ 中兩個 N 原子的氧化數相同
  - label: D
    content: $OF_{2}$ 中的氧原子之氧化數為＋2
  - label: E
    content: $Fe_{3}O_{4}$ 中 Fe 原子的平均氧化數為＋$\frac{8}{3}$，因 Fe 在此化合物中有＋2 與＋4 二種氧化數
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) KH：H＝－1，$H_{2}O_{2}$：H＝＋1

    (C) $NH_{4}NO_{3}$ → $NH_{4}^{＋}$＋$NO_{3}^{－}$

    $NH_{4}^{＋}$：N＝－3；$NO_{3}^{－}$：N＝＋5

    (E)鐵離子有 $Fe^{2＋}$ 與 $Fe^{3＋}$ 兩種，氧化數分別為＋2 與＋3。'
