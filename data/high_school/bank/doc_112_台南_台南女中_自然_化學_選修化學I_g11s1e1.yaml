- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 疊氮化鈉化學式 $NaN_{3}$，為無色晶體，常溫下穩定：在撞擊下會進行爆炸性分解，生成氮氣和鈉。汽車的安全氣囊可以利用疊氮化鈉在汽車接受到撞擊時，在相當短暫的時間內，大量製造氮氣，填充氣囊以達到緩衝撞擊的用途，進而減少車內人員受到撞擊所帶來的傷害。若氣囊中裝有 65.0 克的 $NaN_{3}$，當其完全分解時，在 1 atm、25 ℃（NTP）下，安全氣囊會膨脹至大約多少升的體積？（原子量：N＝14，Na＝23）
  options:
  - label: A
    content: '22.4'
  - label: B
    content: '24.5'
  - label: C
    content: '33.6'
  - label: D
    content: '36.8'
  - label: E
    content: '49.0'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 甲烷（$CH_{4}$）和乙烷（$C_{2}H_{6}$）的混成氣體在 STP 下體積為 11.2 L，且其平均分子量為 27.2，若甲烷和乙烷的莫耳燃燒熱分別為－900 kJ、－1600 kJ，則當此混合氣體完全燃燒時，將放出多少 kJ 的熱量？（原子量：C＝12，H＝1）
  options:
  - label: A
    content: '520'
  - label: B
    content: '590'
  - label: C
    content: '660'
  - label: D
    content: '730'
  - label: E
    content: '1250'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設甲烷有 x mol，乙烷有 y mol，又 $CH_{4}$＝12＋1×4＝16，$C_{2}H_{6}$＝12×2＋1×6＝30

    則 x＋y＝$\frac{11.2}{22.4}$＝0.5（mol）……………①

    另由$\overline{M}$＝$M_{1}X_{1}$＋$M_{2}X_{2}$

    27.2＝16×$\frac{x}{x+y}$＋30×$\frac{y}{x+y}$

    $\Rightarrow$27.2x＋27.2y＝16x＋30y

    $\Rightarrow$11.2x＝2.8y

    $\Rightarrow$y＝4x 代入①中，解得：x＝0.1，y＝0.4

    ∴放出熱量＝900×0.1＋1600×0.4＝90＋640＝730（kJ）

    ∴選(D)'
- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知二氧化碳、水及丙烷（$C_{3}H_{8}$(g)）之標準莫耳生成熱分別為 Δ$H_{1}$、Δ$H_{2}$、Δ$H_{3}$，則丙烷的標準莫耳燃燒熱為何？
  options:
