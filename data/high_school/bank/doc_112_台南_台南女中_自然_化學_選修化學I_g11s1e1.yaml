- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 一理想氣體在容器內壓力為 650 mmHg，將一部分氣體抽出後，壓力減為 600 mmHg，被抽出的氣體在 1 atm 時占有體積為 100 mL，則該容器的容積為多少 mL？
  options:
  - label: A
    content: '2.0'
  - label: B
    content: '125'
  - label: C
    content: '152'
  - label: D
    content: '1520'
  - label: E
    content: '1900'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設容器的體積為 x mL

    由題意知被抽出的氣體在 x mL 的容器內，其壓力為 650－600＝50（mmHg）

    即$\begin{cases}P_{1}=50mmHg \ V_{1}=xmL\end{cases}$

    又$\begin{cases}P_{2}=1atm=760mmHg \ V_{2}=100mL\end{cases}$

    由 $P_{1}V_{1}$＝$P_{2}V_{2}\Rightarrow$50×x＝760×100 解得 x＝1520（mL）

    ∴選(D)'
- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列有關理想氣體性質的敘述，何者正確？
  options:
  - label: A
    content: 分子間無作用力，氣體分子自身質量為零
  - label: B
    content: 其行為能遵守 PV＝nRT
  - label: C
    content: 當溫度愈低、壓力愈大時，真實氣體的性質愈接近理想氣體
  - label: D
    content: 極易液化
  - label: E
    content: 水蒸氣的性質比甲烷接近理想氣體
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)理想氣體分子質量不為零。

    (C)真實氣體在高溫、低壓時的性質較接近理想氣體。

    (D)理想氣體分子間沒有引力，不會液化。

    (E)水在常溫為液態，甲烷是氣態，即分子間引力：水＞甲烷 ∴甲烷較接近理想氣體。

    ∴選(B)'
