- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 若卡計內原有 100 mL 蒸餾水，當加入 3.03 g 的硝酸鉀固體後，測得溫度上升了 2.50 ℃，假設溶液體積仍保持 100 mL，則硝酸鉀的莫耳溶解熱約為多少 kJ/mol？
  options:
  - label: A
    content: '1050'
  - label: B
    content: '525'
  - label: C
    content: '52.5'
  - label: D
    content: '48.6'
  - label: E
    content: '35.0'
  group_stem: 一般化學實驗室常用的簡易式卡計是由兩個保麗龍杯套疊放入燒杯中，將其加蓋密封，並插入溫度計及玻棒所組成。今以此卡計進行以下有關反應熱的實驗，假設卡計本身所吸收的熱量忽略不計，混合溶液的體積具有加成性，且所有水溶液之密度及比熱均與水相同，分別為 1.0 g/mL 及 4.2 J/g．℃，回答下列問題：（原子量：K＝39，N＝14，O＝16，Na＝23，Cl＝35.5，H＝1）
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '式量＝$KNO_{3}$＝39＋14＋16×3＝101

    溶液重（m）＝100×1＝100（g）

    由 ΔH＝msΔt＝100×4.2×2.5＝1050（J）＝1.050（kJ）

    $\RightarrowKNO_{3}$ 的莫耳溶解熱＝$\frac{1.050}{\frac{3.03}{101}}$＝$\frac{1.050}{0.03}$＝35.0（kJ）

    ∴選(E)'
- id: doc_112_台南_台南女中_自然_化學_選修化學I_g11s1e1_s1_13
  section: 1
