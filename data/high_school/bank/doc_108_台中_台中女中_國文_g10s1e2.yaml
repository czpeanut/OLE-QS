  stem: 閱讀下文，選出敘述正確的選項： 陶淵明是古代士大夫的一個精神家園，通過他我體察到古代許多士大夫的心靈。蘇東坡得東林寺大字本陶集，不願一口氣讀完，他「每體中不佳，輒取讀，不過一篇，惟恐讀盡後，無以自遣耳。」我研究陶淵明的心情跟蘇東坡有近似之處。 研究陶淵明，是我聆聽他的心聲，與他對話、交朋友的過程。我對陶淵明有這樣一個基本的看法，就是他一方面延續魏晉詩歌的古樸作風，而進入更加純熟的境地，像一座里程碑，標誌古樸詩歌所能達到的高度；另一方面他又是一位創新的先鋒，他成功地將「自然」提升為一種美的至境，使詩歌和日常生活相結合，並且開創了田園詩這種新的體裁。他的清高、耿介、灑脫、恬淡、真率、淳厚、善良，還有他的幽默，他對人生所做的哲學思考，連同他的作品一起，為後世的士大夫構築了一個巢，構築了一個精神家園，一方面可以提醒他們和虛偽醜惡劃清界限，另一方面也可以使他們得到休息和逃避。所以在中國，特別是宋代以後，知識分子對陶淵明有強烈的認同感。蘇東坡開始寫和陶詩，後來形成風氣和傳統，有許多著名文人都寫過和陶詩。取他詩文中的詞語作典故，或作自己的齋號的也很多。所以我說陶淵明已經成為中國文化的一個符號，代表中國文化一部分精粹的東西。誇大一點說，懂得了陶淵明就懂得了中國古代士大夫精神世界的一半。 （袁行霈〈博採、精鑒、深味、妙悟：中國詩歌藝術研究〉）
