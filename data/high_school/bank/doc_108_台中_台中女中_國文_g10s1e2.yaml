  stem: 根據上文，選出不符合作者想法的選項：
  options:
  - label: A
    content: 科舉成就與倫理親情產生衝突時，往往以犧牲後者為代價
  - label: B
    content: 引用《西廂記》的例子，旨在說明科舉違背了正常的人情
  - label: C
    content: 為了高中科舉，男人的負心應該被讚揚
  - label: D
    content: 古代讀書人的偽君子習氣，來自於面子與裡子都要兼顧
  group_stem: 閱讀下文，回答19─20題。 科舉既然把讀書當作手段，把做官當作目的，文化學和政治學上的人性內核也就被抽離；科舉的成敗關及家族倫理的全部榮譽，於是家族倫理的親情牽累也就必須顧全大局，暫時割捨，奉獻給那種沒有期限的苦讀、別離、期待。一來二去，科舉便與正常人情格格不入，上文所引一系列家庭悲劇，皆是例證。那些不敢回家的讀書人，可以置年邁的雙親於不顧，可以將新婚的妻子扔鄉間，只怕面子不好看，這樣做開始是出於無奈，但在這種無奈中必然也會滋生出矯情和自私。《西廂記》雖然描摹了張生一旦科舉高中，終於與鶯鶯門當戶對地結合的遠景，卻也冷靜地估計到此間希望的渺茫，因此為張生別離愛人去參加科舉考試的那個場景，動用了最為悲涼的詞句：「曉來誰染霜林醉？總是離人淚！」然而《西廂記》長久被目為不經的淫書，只有鐵石心腸地癡想金榜的男人才被充分讚揚。鐵石心腸不要感情，卻並不排斥肉慾，那位王泠然開口向老朋友提的要求，第一項就是要一個女人。俗諺謂「 」，也是這個意思。要肉慾而不要感情，又把不要感情妝扮得堂而皇之，這便是矯情中的矯情，中國書生中的偽君子習氣，也大多由此而生。在我看來，科舉制度對社會生活的損害，也是從它離間普通的倫常人情開始的。一種制度，倘若勢必要以損害多方面的正常人情為代價，那麼它就不會長久是一種良性的社會存在。終有一天，要嘛因它而阻礙社會的健康發展，要嘛由健康發展的社會來戰勝它，別無他途。同樣，一批與正常人情相背逆的人，哪怕是萬人矚目的成功者，也無以真正地自立歷史，並面對後代。應該說，這是科舉制度在中國書生身上留下的又一遺憾。（余秋雨《山居筆記‧十萬進士》）
