  group_stem: 閱讀下列文字，回答16─18題。 甲 丁肇中在諾貝爾晚宴上刻意以華語致詞，內容不長，但有深意，其中一段是：「中國有一句古話：『勞心者治人，勞力者治於人。』這種落後的思想，對在發展中國家的青年們有很大的害處。由於這種思想，很多發展中國家的學生都傾向於理論的研究，而避免實驗工作。事實上，自然科學理論不能離開實驗的基礎，特別物理學是從實驗產生的。」丁肇中希望由於他獲獎能夠促使發展中國家的學生「注意實驗的重要性」。 丁肇中成長於傳統社會，何以能夠避開他所言「落伍思想」的影響？其實他在密西根大學攻讀博士期間，也一度想鑽研理論物理，但由於受到該校一位老師的啟發，才下定決心投入實驗。這位老師是理論物理學家烏倫貝克（George Uhlenbeck），以提出電子自旋概念聞名。丁肇中在選擇研究方向舉棋不定之際，就教烏倫貝克教授，他對丁肇中說，和普通的理論學家相比，普通的實驗學家對於科學的用處更大；在理論物理領域，能做出有用研究的人很少，但是實驗工作多少都能有些價值。這番話點醒了丁肇中。 對於理論與實驗的關係，法國數學大師龐卡赫（Henri Poincare）有過這樣的闡述：「科學是建立在事實之上，就好像房子是用石頭所建造，但是就如同房子不僅是一堆石頭而已，僅有一堆事實也不是科學。」龐卡赫所點出的即是實驗學家蒐集了很多關於大自然的「事實」，但是如果沒有人把這些事實組織起來，成為有系統的知識，這些事實也不會有太大意義。以龐卡赫的石頭比喻來說，烏倫貝克的看法可解釋成你如果有本事設計出漂亮的房子，去做無妨，如果不行，就當個搬石頭的工人，因為這樣也有貢獻。 不過烏倫貝克並沒有全面性評價各種理論工作的意義，他似乎只強調了愛因斯坦相對論這種等級的理論，難怪他會說「能做出有用（理論性）研究的人很少」。然而眾多驗證性、計算性、試探性的理論工作，也是科學進展中所不能缺少的，就好比固然一棟建築的整體設計理念最為根本，但是每個房間的細部規劃也都是必要工作。（高涌泉〈實驗學家vs.理論學家〉） 乙 孟子曰：且一人之身，而百工之所為備。如必自為而後用之，是率天下而路也。故曰：或勞心，或勞力；勞心者治人，勞力者治於人；治於人者食人，治人者食於人，天下之通義也。（《孟子‧滕文公上》) 丙 父親教會我如何觀看萬物。有一天我正在玩「特快拖車」——是一輛邊緣有圍欄的小拖車，可以讓小孩拉著跑來跑去。圍欄裡有顆球，拉著拖車跑時，我注意到球在動。所以我跑去跟父親說：「爸！我注意到一件好玩的事。當我突然拉動車子的時候，球會往後滾，而當我突然停下來時，球居然往前滾了。」我問道：「為什麼啊？」父親說：「沒有人知道。一般來說，萬物都傾向保持原來運動的狀況：動者恆動，靜者恆靜，這樣的特性稱為慣性。但沒人真正知道為什麼會這樣。」 我很小就明白，父親不會隨便抓個名稱搪塞我，他很清楚「知道某樣東西的名稱」跟「了解某樣東西」是完全不同的。他繼續說：「如果你觀察得更仔細，就會發現球並沒有往後滾。由於你拖著車往前跑，球看起來像是往後滾，事實上，摩擦力讓小球稍稍向前呢！」所以我回到小拖車旁，把球放好，拉著拖車向前跑，看看父親說的是否正確。確實如此，相對於地面來說，球果真往前動了一些，但由於拖車向前移動，因此球看起來像是滾到後頭去了。父親就是用各式各樣的例證引導我，沒有任何壓力，只有生動有趣的討論，這才能得到深刻的領悟。（費曼〈發現事理的樂趣〉）
