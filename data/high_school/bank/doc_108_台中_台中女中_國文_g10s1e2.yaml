  stem: 閱讀下文，周進逛貢院時「一頭撞在號板上」的主要原因是： 昔周進無事，閒著街上走走。看見紛紛的工匠，都說是修理貢院；周進跟到貢院門口，想挨進去看……雜貨行主人指道：「這是『天』字號了，你自進去看看。」周進一進了號，見兩塊號板擺的齊齊整整；不覺眼睛裡一陣酸酸的，長嘆一聲，一頭撞在號板上，直殭殭不醒人事。眾人多慌了，只道一時中了惡。行主人道：「想是這貢院裡久沒有人到，陰氣重了，故此周客人中了惡。」金有餘道：「賢東！我扶著他，你且去到做工的那裡借口開水來灌他一灌。」行主人應諾，取了水來，三四個客人一齊扶著，灌了下去，扶著立了起來。周進看著號板，又是一頭撞將去；這回不死了，放聲大哭起來，眾人勸著不住。周進也不聽見，只管伏著號板，哭個不住；一號哭過，又哭到二號，三號；滿地打滾，哭了又哭，哭的眾人心裡都悽慘起來。 眾人七手八腳，將他扛擡了出來，貢院前一個茶棚子裡坐下，勸他吃了一碗茶；猶自索鼻涕，彈眼淚，傷心不止。內中一個客人道：「周客人有甚心事，為甚到了這裡這等大哭起來，卻是哭得利害？」金有餘道：「列位老客有所不知，我這舍舅，本來原不是生意人；因他苦讀了幾十年的書，秀才也不曾做得一個，今日看見貢院，就不覺傷心起來。」自因這一句話道著周進的真心事，於是不顧眾人，又放聲大哭起來。 （節錄自《儒林外史》第二回）
