  stem: 「在戊戌變法中眾多改革項目中，廢除八股考試的變革，因為牽連到全國各地眾多科舉考生的前途利益，為最受爭議的項目，所遭受的阻力也是最大。至於裁撤綠營，命旗人自謀生計，勢必導致眾多滿人的既得利益喪失，引來滿漢之間的嫌隙對立，使滿人官員更為痛恨猜忌。康有為之弟康廣仁即提出質疑『規模太廣，志氣太銳，包攬太多，同志太孤，舉措太大，當大，當此排者、忌者、擠者，乃衢塞巷，而上又無權，安能有成？」請就上文立場判斷，戊戌變法失敗最主要的原因為何？
  options:
  - label: A
    content: 改革項目不切實際，難以達成
  - label: B
    content: 改革急躁，並未顧及保守派利益
  - label: C
    content: 慈禧太后居中阻撓，引起對立
  - label: D
    content: 康梁二人無能，光緒帝無經驗，難以實行
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從康廣仁的質疑中，可以看出戊戊變法的內容規模太廣、項目太多，導致影響太多人前途利益而受到排擠，加上皇帝又無實權，終究難逃失敗命運，因此答案為(B)。(A)項目太多，並非不切實際。(C)(D)題文中並無相關的說法。
