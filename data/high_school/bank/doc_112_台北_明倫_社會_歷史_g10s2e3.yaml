  stem: 17 世紀，耶穌會鄧玉函與明人王徵合作譯寫《遠西奇器圖說》，論及物理的力學原理。時人曾批評：「末流之學」。王徵答辯：「學原不問精粗，總期有濟於世人；亦不問中西，總期不違於天。茲所錄者，雖屬技藝末務，而實有益於民生日用、國家興作甚急也！」18 世紀末，清初《四庫全書》則稱：「俱極誇其法之神妙，大都荒誕恣肆，不足究詰（深入研究）。然其制器之巧，實為甲於古今。寸有所長，自宜節取。」就上文推斷，明清時的人們對於西方科學具有什麼樣的態度？
  options:
  - label: A
    content: 值得多加研究，應多接觸
  - label: B
    content: 末流之學，毫無可取之處
  - label: C
    content: 認為不切實際，看看就好
  - label: D
    content: 重視科技的實用性，對於原理並無太大興趣
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文顯示明末清初西學傳入中國，當時被批評為「末流之學」，但王徵與《四庫全面》皆稱讚西方人的「技藝末務」與「制器之巧」，可知較著重在西方的科技實務，因此答案為(D)。
