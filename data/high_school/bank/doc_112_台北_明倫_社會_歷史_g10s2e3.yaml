  stem: 嘉永 6 年（西元 1853 年），正在東京灣捕魚的漁民被嚇壞了，他們看到四艘鐵甲大船緩緩駛入浦賀海面，其中兩艘有著高聳的煙囟，拖著長長的黑煙，濃得海風都吹不散。不久後，由艦長培里（Matthenw Perry）為代表的美國與江戶幕府的談判即將展開，當時主要負責翻譯的日本人為堀達之助。但在談判開始前，卻因為語言問題而出現阻礙。請就你的歷史知識判斷，後來雙方的談判時最有可能是以什麼語言進行的？
  options:
  - label: A
    content: 英語
  - label: B
    content: 日語
  - label: C
    content: 荷蘭語
  - label: D
    content: 漢語
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為日本史的黑船事件，美國欲以武力強行打開日本門戶，由於日本已鎖國長達兩百年之久，國內唯一出現的西洋語言為荷蘭語，因此在日、美雙方皆沒有通曉對方語言的翻譯人員情況下，(C)荷蘭語即可能成為當時談判時使用的語言。
