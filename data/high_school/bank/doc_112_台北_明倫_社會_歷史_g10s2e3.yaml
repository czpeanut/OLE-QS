  section: 1
  number: 14
  type: single
  page: 3
  stem: 憶均是民國初年受過新式教育的年輕人，也對新文化運動的理念非常認同。某天文思泉湧之下，洋洋灑灑寫了一大篇的文章，描述他對於建設中國的進步理念與具體作風。請問憶均應該將這篇文章的初稿投給哪個刊物呢？
  options:
  - label: A
    content: 《大公報》
  - label: B
    content: 《新青年》
  - label: C
    content: 《藍星》
  - label: D
    content: 《民國日報》
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '新文化運動期間最重要的刊物為陳獨秀所創辦的(B)《新青年》。

    15.1966 年為中國文化大革命的開始，許多青年學生組成紅衛兵，忙著到處鬥爭「破四舊」；接著，毛澤東重新掌權後，又鼓勵知識分子「下鄉改造」，因此答案為(C)。(A) 1951 ～ 1952 年的三反五反運動。(B) 1958 年的三面紅旗運動。(D) 1989 年六四事件的背景。

    16.從法庭審判報導內文，可推知此人暗殺了伊藤博文，因此是大韓帝國的(D)安重根。

    17.高雄鳳山陸軍軍官學校的前身為黃埔軍校，為 1924 年(A)聯俄容共期間，在蘇聯的支持下成立的軍校，用以培養中國國民黨黨軍。

    18.顧孟餘於 1928 年南京國民政府成立後，擔任鐵道部長一職，開始對中國的鐵路系統進行整頓，為加快中國的鐵路建設，甚至不惜發行鐵路公債、籌集築路基金，獲得明顯的成效，答案為(D)十年建設期間。

    19.(A)為蔣中正國民政府所在地、(B)為日軍占領區，兩者皆不可能為美軍運輸盟軍物資的駐紮地點，(D)於 1920 年代已脫離中國而獨立，長期受到蘇聯控制，亦不可能。因此，史迪威最可能駐紮的地點為(C)緬甸，美國援助中國的物資則經由滇緬公路輸送到重慶大後方。

    20.題文所述為原子彈爆炸後的慘況，可從天空下著黑色的雨水來判斷，由於原子彈爆炸後產生的高溫讓人無法接近原爆區，等到數日降溫後才能進入找尋親人蹤跡，因此到處可見已經長蛆與焚燒過後的屍體，答案為(D) 1945 年的廣島。

    21.粵漢鐵路指廣州到漢口之間的鐵路，途經廣東、湖南、湖北三省，從蔣中正通電對象有高級軍官來看，此時應處於戰亂期間，最可能的答案為(B)。(A)北伐初期與(C)聯俄容共期間，中國國民黨僅占有廣州，無法掌控粵漢鐵路。(D)粵漢鐵路位於中國南方，與東北的九一八事變難有運輸的連結。

    22.從題文可知，美國與中共皆有參與這場戰爭，但反戰的杜魯門總統與持支持繼續作戰的麥克阿瑟有所衝突，於是麥克阿瑟被撤職而結束軍旅生涯，因此答案為(A)韓戰。(B)(D)中共並未參戰。(C)麥克阿瑟為太平洋戰區統帥，並未於戰時被解職。

    23.題文所述發生於經濟大蕭條前，大眾文化興盛、經濟富裕繁榮的景象，明顯為已經現代化的城市，(A)(C)兩地在當時尚未能有如此發展，(D)為經濟大恐慌時期，與題文不符，因此答案為(B) 1920 年代的東京。

    24.東南亞公約組織有 8 個成員國，其中僅泰國與菲律賓位於東南亞，因此該組織不受到其他東南亞國家的支持，已於 1977 年撤銷。因此答案為(C)。

    25.題文中提到「為當時帝王繪製一幅幅員遼闊的地圖」，應是指康熙年間的《皇輿全覽圖》，可見約翰‧宇彬抵達中國應是在(B)明末清初。

    26.(D)耶穌會為舊教團體，在傳播西學時不得違反天主教教義，因此哥白尼的日心說不可能被傳入中國。

    27.(A)自強運動多由地方督撫推動執行，缺乏通盤的規劃。(C)自強運動為器物層的改革，明治維新則是走向君主立憲的制度層改革。(D)日本並非一直富強，在受到經濟大恐慌波及後，只能走向軍國主義對外侵略。

    28.《越南亡國史》為(C)潘佩珠的著作，期以文化啟蒙方式喚起越南人民的民族主義。

    29.第二次世界大戰期間，歐陸在 1940 年後即為納粹德國所控制，因此與日本達成合作協議的法國，應是由德國扶植的傀儡政權，因此(D)為正解。

    30.(B)越南政府視境內擁有強大政治經濟影響力的華人為威脅，沒收其產業並支持排華運動。

    31.(C)資料二僅提供條約世紀的年代，並未多加評論其影響。

    32.1954 年簽訂《中美共同防禦條約》，已有部分美軍駐紮在臺灣，1960 年代(B)越戰期間，更有大批美軍來臺灣短期渡假。

    33.資料一為歐洲的區域統合組織，資料二為北美洲的區域統合，資料三為亞洲與太平洋區域國家的經濟合作組織，三者皆為個別區域性的經濟合作組織，因此答案為(A)經濟走向區域集團化。(B)應是區域合作。(C)三則資料並未提及不同區域的經濟體交流情況。(D)三則資料無法判斷政治如何影響區域經濟體的形成。

    34.(B)北美與紐澳地區並未包含在內。(C)中國人口眾多，不可能勞力短缺；藉由此計畫在沿線地區投資，能增加更多盟友。(D)冷戰已結束，美國不再顧慮共產主義擴張問題。

    35.從讚揚白話、攻擊古文的權威、提倡歐洲新文學等，即可推知與(A)新文化運動有關。

    36.題文中主張白話文運動「沒有『他們』、『我們』的區別」，此即全民性；「攻擊古文的權威」即是反對傳統，因此答案為(B)。

    37.(D)資料三所調查對象侷限於巴布亞紐幾內亞境內，不代表臺灣居民沒有被動員到其他國家或地區參與戰鬥任務。

    38.(A)殖民地人民通常擔任非戰鬥任務。(B)題文資料並未提到賠償問題。(C)從資料二無法判斷日本軍方是否故意作此安排。

    39.從 1885 年、抵抗外國勢力、中國文化的影響逐漸被削弱等，可推知這個國家應是越南，因此正確答案為(A)(E)。(B)應是越南的「勤王運動」。(C)題文的君王為阮朝咸宜帝。(D)□□應是指法國。【註】(A)選項中的「文紳運動」為 1874 年起由士大夫發起的反法運動，但題文標出 1885 年，可見本題應是由咸宜帝發出《勤王詔》的「勤王運動」。

    40.(C)「過去的輝煌」指的是在 1950 年代土地改革之前，當時的李永固是地主階級。(E) 1978 年鄧小平掌政後，即放棄過去的鬥爭路線，推行改革開放政策。

    41.(A)主張「不可使中夏有西洋人」、(D)反問「安有去堯舜之聖君而採用天主教曆」，可見兩者皆反對西洋傳教士與其引進的西洋曆法。

    42.(D)應是資料二的論點。(E)兩則資料都指出辛亥革命的局限性，認為三民主義並未完全實現。

    43.從日記記載的事件來看，主人翁曾經歷對日戰爭、逃難遷移至大後方、抗戰勝利，中年後則在文化大革命時期殞命，因此(A)(B)(D)為正解。(C)兩人留在大陸歷經文革，並未遷居臺灣。(E)題文提到佑珊在文革不久後即過世，不可能參與 1989 年的六四天安門學運。

    44.在中共支持下，1975 年(E)柬埔寨建立共產政權，實施恐怖統治，大量人民因政治迫害或糧食短缺而喪生。由於柬埔寨多次侵犯越南邊境而爆發柬越戰爭，後由越軍推翻「紅色高棉」，改成立傀儡政權，直到 1989 年才撤出。

    45.題文所述的國家欲入侵東南亞，於是在 1941 年先癱瘓盟軍之太平洋軍事港灣，但最後仍輸掉了戰爭，因此可推知為(B)日本在二次大戰的軍事行動。

