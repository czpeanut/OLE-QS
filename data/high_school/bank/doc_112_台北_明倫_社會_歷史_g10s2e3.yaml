  stem: 他主張以「天主」稱呼天主教的「神」，但他亦認為天主教的「神」早已存在於中國的思想之中，因為中國傳統的「天」和「上帝」本質上與天主教所說的「唯一真神」並無分別。而祭祀祖先與孔子，這些只屬追思先人與緬懷哲人的儀式，與信仰並無甚麼干涉，只要不摻入許願、崇拜、祈禱等成分，本質上並沒有違反天主教教義。請問這個「他」是誰？
