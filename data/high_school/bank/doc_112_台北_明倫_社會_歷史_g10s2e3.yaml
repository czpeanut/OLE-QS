  stem: 以下擷取自故事 Studio 文章：「日、滿二國協議在 1937 年廢除日本人在滿洲的治外法權，日本人也轉讓出在滿鐵附屬地的行政權。日本同意廢除在滿洲的治外法權，指在表現日本不讓盟邦受當年日本嚐過的苦的形象，做為表現日、滿友好的絕佳機會。同時，也有描繪日本、滿洲再加上「支那」的三國友好明信片。在「日滿支町議會的表演會」這張明信片裡，站在舞台上的是拿著各自國旗的三個孩子。「支那」的孩子高舉的國旗並不是蔣介石重慶政府的國旗，而是 1940 年成立的，汪精衛南京國民政府的國旗。」請問我們該如何解讀上文？
  options:
  - label: A
    content: 日廢除與滿洲國的不平等條約，表示兩者平等，互相友好
  - label: B
    content: 此舉符合滿州國皇帝宣統提出的「五族協和，王道樂土」觀念
  - label: C
    content: 明信片上所繪製的是南京國民政府而非重慶國民政府，係因汪精衛屬於親共勢力之故
  - label: D
    content: 此日滿交流只是日本單方面想像與描繪，「日滿友好」不過是虛假的偽裝，事實上滿洲國仍受日本支配
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)題文所述的所有舉措僅是營造日、滿、支那等族群平等的形象，實則滿洲國仍受日本支配。(C)汪精衛為日本扶植的親日政府。
  tags:
    unit:
      code: HI-2-6-1
