  stem: 中國宣布新一波自貿區設立名單，在山東、江蘇、廣西、河北、雲南、黑龍江新設六個自由貿易試驗區，中國商務部強調，六省新設自貿區各具特色、各有側重。請問雲南自貿區可能「側重」於哪一方面？
