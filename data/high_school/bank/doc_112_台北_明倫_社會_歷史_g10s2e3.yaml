  stem: '資料一：辛亥革命以意圖推翻滿清開始，以袁世凱獲取政權結束。綜觀這一個過程，大部分革命志士所要求的只是民族的獨立，部分兼求民權的普遍，少部分兼注意民生問題的解決。……。辛亥革命所完成的是民族主義中的排滿和民權主義中的排皇，民生主義（即社會主義）則毫無成就。

    資料二：他（孫中山）的多數追隨者僅致力於推翻滿人，建立共和國，而很少有人關注民主重建與解決民生這些更重要的任務。……至於三民主義，他們完全拋棄了民權主義和民生主義，而只接受了民族主義的部分內容，即反對滿洲異族統治的民族主義。他們並未意識到在民國建立後，必須繼續進行反對帝國主義的抗爭。他們也無視孫中山三階段的革命方略，而只是樂於同遺老遺少合作，並優待廢帝，這些都為以後軍閥割據及復辟帝制的企圖鋪平了道路。

    解讀以上兩段資料，下列敘述哪些正確？'
