  stem: 19 世紀時，(甲)國普設的斥和碑碑文上寫著：「洋夷侵犯，非戰則和、主和賣國」，象徵著他們曾多次退敵致勝。但過了不久，(乙)國與其簽訂條約時則稱：「該碑雖非直接指我國人，但違背交誼修好之宗旨，毀此無可非議」。石碑大多被撤。請問，(甲)、(乙)兩國分別為：
  options:
  - label: A
    content: 日本；朝鮮
  - label: B
    content: 清帝國；日本
  - label: C
    content: 朝鮮；日本
  - label: D
    content: 清帝國；俄國
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 斥和碑為朝鮮興宣大院君攝政時所設，採取「鎖國排外」政策，拒絕列強開港通商的要求；但在 1870 年代，日本以武力迫使朝鮮簽訂《江華條約》開港通商，各地的斥和碑大多被撤廢。因此(甲)、(乙)兩國分別為(C)朝鮮、日本。
