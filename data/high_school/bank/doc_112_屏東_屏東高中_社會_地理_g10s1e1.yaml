- id: doc_112_屏東_屏東高中_社會_地理_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 一群高中師生利用暑假進行地理考察，原本要攜帶甲圖外出，但甲圖為一幅底邊長 60 公分的地圖，攜帶不易，故將之縮小為 7.5 公分的乙圖。若乙圖比例尺為 1：20,000，則甲圖的比例尺為何？
  options:
  - label: A
    content: 1：2,000
  - label: B
    content: 1：2,500
  - label: C
    content: 1：5,000
  - label: D
    content: 1：160,000
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 甲圖的底邊長約為乙圖底邊長的 8 倍，由題目知乙圖比例尺為 1：20,000，則甲圖的比例尺應為(B) 1：200,00×8＝1：2,500。
- id: doc_112_屏東_屏東高中_社會_地理_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 金門國家公園有許多獅子形象的石雕，居民用以鎮風剋煞，稱為石獅爺。某生欲至該國家公園附近的一個聚落，探究「石獅爺設立位置與盛行風向的關係」，過程中包括田野調查、位置測量、資料蒐集等。若該生要獲得較具科學性的成果，除利用 GPS 工具外，還適合透過下列哪 3 項資料作為支持此探究主題的材料？(甲)耆老訪談紀錄(乙)遊客問卷結果(丙)聚落內部測繪圖（比例尺 1／1,000）(丁)聚落分布圖（比例尺 1／400,000）(戊)聚落附近測站的氣候數據(己)田野調查當天的風向風速計測量數據
  options:
  - label: A
    content: 甲丙戊
  - label: B
    content: 甲丁己
  - label: C
    content: 乙丙己
  - label: D
    content: 乙丁戊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)該生探究主題為「石獅爺設立位置與盛行風向的關係」，因此會需要詳細的石獅爺分布圖，(丙)聚落內部測繪圖可提供此資訊；石獅爺的設立若與盛行風向相關，則需搜集此地長時間的風向資料，因此需要(戊)聚落附近測站的氣候數據；此外，石獅爺設立的年代可能較早，因此(甲)訪問當地耆老也是可釐清設立因素的方式。
