    | 乙 | 研究西太平洋颱風的路徑 |

    | 丙 | 觀察全球暖化現象的影響 |

    | 丁 | 繪製臺灣各縣市外籍配偶分布圖 |

    | 戊 | 找出臺北 101 大樓在臺北市的位置 |'
