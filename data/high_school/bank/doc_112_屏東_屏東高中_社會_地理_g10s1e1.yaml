    content: 調查繪製土地退化的分布區域
  - label: B
    content: 判釋衛星影像上的土地退化區域
  - label: C
    content: 訪談農民於當地灌溉、施肥、除蟲等耕作方式
  - label: D
    content: 蒐集人口、農產、雨量、氣溫等區域背景資料
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 地理學的生態傳統強調人與環境間的因果關係，(C)探討農民耕作方式對土地地力的影響屬之。
