  explanation: '橫麥卡托二度分帶坐標代表某地與坐標原點的距離，表示法為（東距值，北距值），而坐標原點位於東經 121°往西 250,000 公尺與赤道的交點，因此(甲) 227 為與坐標原點的距離；(丙)應位於西側。

    19.(甲)應為較省時；(戊)全球皆可涵蓋。

    20.(丙)登革熱病媒蚊無法用衛星影像監測；(戊) 1900 年尚未有衛星影像的技術。

    21.「屏東高中」屬於文字類的屬性資料，因此在 Google 地圖中查詢屏東高中屬於(B)屬性查詢。

    22.(乙)、(丁)皆上、下應交換。

    23.環域分析乃以點、線、面的現象為中心，劃設出特定距離的範圍，(D)不屬於此類。

    24.(B)①②屬於(甲)環域分析，同時將①②與③④的結果取交集則為(丁)疊圖分析。

    25.(C)將 2 張以上的圖層進行疊圖分析，需符合三大原則：比例尺相同、坐標系統相同、投影系統相同。

    26.由圖(一)可知，圖上 100 公里及 300 公里的等距線間有 2 個間隔，故間距值為 100，乙島位於第二圈等距線上，因此距離甲島 200 公里遠；由圖(二)可知乙島在甲島的 30°方位角上，故選(A)。

    27.圖中心為北極，最外圈緯圈為赤道，甲位於 30°緯圈，乙位於 60°緯圈，又甲、乙同在 0°經線上，因此甲在乙的(B)南方。

    28.等高線呈 V 字形，且 V 的尖端指向低處代表為山脊。(A)甲乙間有山脊。(C)乙丁間有山脊。(D)丙丁間有山脊。

    29.圖為橫麥卡托圓柱投影地圖，特性為高緯嚴重放大，故(A)應改為＜。(B)應改為＜，因實際地球上的經距愈往高緯愈短。(C)應改為＞，因實際地球上的緯距愈往高緯愈長。'
