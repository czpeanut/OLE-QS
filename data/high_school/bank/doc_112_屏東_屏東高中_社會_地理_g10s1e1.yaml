  - label: A
    content: 空間分析
  - label: B
    content: 生態分析
  - label: C
    content: 區域複合體分析
  - label: D
    content: 生態傳統
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 環境影響評估乃在特定空間範圍內針對某建設對當地環境產生的影響所做的評估分析，同時具有空間及生態傳統的特性，即屬於(C)區域複合體分析。
