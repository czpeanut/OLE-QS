  stem: 在下列地理專題研究之中，哪 2 個專題較偏重於空間傳統？(甲)臺南市便利商店區位分析(乙)臺中捷運路線之規劃(丙)臺灣西部沿海地層下陷與養殖漁業之關係(丁)核電廠廢水對周遭海域生態之影響
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
