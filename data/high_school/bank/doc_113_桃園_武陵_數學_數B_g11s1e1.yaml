  stem: 若將一杯飲料從冰箱裡拿出來到室溫為T的房間，其溫度變化可用以下的公式表示： f (t)＝T＋( f (0)－T )×$10^{－kt}$，其中f (t)為飲料在拿出來後t分鐘後的溫度，k為一個常數。 現在室溫T＝30℃，有杯飲料剛從冰箱拿出來時，溫度為5℃，則
  options:
  - label: A
    content: 此杯飲料的溫度與時間的關係可表達成f (t)＝30－25×$10^{－kt}$
  - label: B
    content: 若10分鐘後，f (10)＝15，則$10^{－10k}$＝0.6
  - label: C
    content: 承(B)，再十分鐘後，飲料的溫度為25℃
  - label: D
    content: 承(B)之數據，飲料從拿出來後開始算起，50分鐘後的溫度已大於29℃
  - label: E
    content: 依此公式計算，飲料的溫度永遠到達不了30℃
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：f (t)＝T＋( f (0)－T )×$10^{-k t}$， f (t)＝30＋(5－30)×$10^{-k t}$＝30－25×$10^{-k t}$。 (B) ○：f (10)＝15 ⇒ 30－25×$10^{-10k}$＝15 ⇒ 25×$10^{-10k}$＝15 ⇒ $10^{-10k}$＝$\frac{15}{25}$＝$\frac{3}{5}$＝0.6。 (C) ×：f (20)＝30－25×$10^{-20k}$＝30－25×($10^{-10k}$)$^{2}$ ＝30－25×$0.6^{2}$＝21。 (D) ×：30－25×$10^{-50k}$＝30－25×($10^{-10k}$)$^{5}$ ＝30－25×$0.6^{5}$＝28.056＜29。 (E) ○：f (t)＝30－25×$10^{-k t}$＜30－25×0＝30。 故選(A)(B)(E)。
