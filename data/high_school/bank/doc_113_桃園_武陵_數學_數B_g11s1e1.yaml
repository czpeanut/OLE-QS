  stem: 設x為實數，則$(\frac{1}{4})^{-\frac{1}{2}x^{2}+x}$有最<u> 甲 </u>（填大或小）值，且此極值是<u> 乙 </u>。則(甲 , 乙)＝＿＿＿＿。
  answer:
  - (小,$\frac{1}{2}$)
  answer_status: verified
  answer_source: answer_key
  explanation: $(\frac{1}{4})^{-\frac{1}{2}x^{2}+x}=(\frac{1}{4})^{-\frac{1}{2}(x-1)^{2}+\frac{1}{2}}$， 當x＝1時，－$\frac{1}{2}$( x－1 )$^{2}$＋$\frac{1}{2}$有最大值$\frac{1}{2}$ ∴ $(\frac{1}{4})^{-\frac{1}{2}(x-1)^{2}+\frac{1}{2}}\geq (\frac{1}{4})^{\frac{1}{2}}=\frac{1}{2}$⇒ 有最小值$\frac{1}{2}$ ∴ (甲 , 乙)＝(小 , $\frac{1}{2}$)
