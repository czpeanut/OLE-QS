- id: doc_111_桃園_武陵_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設 $log_{2}$3＝a，$log_{3}$5＝b，選出正確的選項。
  options:
  - label: A
    content: $log_{2}$5＝ab
  - label: B
    content: $log_{5}$2＝$\frac{1}{ab}$
  - label: C
    content: $log_{2}$10＝1＋ab
  - label: D
    content: $log_{2}$6＝2a
  - label: E
    content: $log_{6}$5＝$\frac{b}{1+a}$
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：ab＝$log_{2}$3×$log_{3}$5＝$\frac{\log 3}{\log 2}$×$\frac{\log 5}{\log 3}$

    ＝$\frac{\log 5}{\log 2}$＝$log_{2}$5

    (B) ○：由(A)，$\frac{1}{ab}$＝$\frac{\log 2}{\log 5}$＝$log_{5}$2

    (C) ○：$log_{2}$10＝$\frac{\log 10}{\log 2}$＝$\frac{\log (2\times 5)}{\log 2}$＝$\frac{\log 2+\log 5}{\log 2}$

    ＝1＋$log_{2}$5＝1＋ab

    (D) ╳：$log_{2}$6＝$\frac{\log 6}{\log 2}$＝$\frac{\log (2\times 3)}{\log 2}$＝$\frac{\log 2+\log 3}{\log 2}$

    ＝1＋$log_{2}$3＝1＋a

    (E) ╳：$log_{6}$5＝$\frac{\log 5}{\log 6}$＝$\frac{\frac{\log 5}{\log 2}}{\frac{\log 6}{\log 2}}$＝$\frac{\log _{2}5}{\log _{2}6}$＝$\frac{ab}{1+a}$

    故選(A)(B)(C)'
- id: doc_111_桃園_武陵_數學_數B_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 觀察圖(一)與圖(二)，選出正確的選項。
  options:
  - label: A
    content: 函數 y＝$10^{x}$、y＝x、y＝$x^{2}$ 的圖形皆為由左而右逐漸上升
  - label: B
    content: $10^{x}$＝x 有實數解
  - label: C
    content: $10^{x}$＝$x^{2}$ 有實數解
  - label: D
    content: $10^{x}$＞x 恆成立
  - label: E
    content: 當 x＞0 時，$10^{x}$＞$x^{2}$ 恆成立
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_111_桃園_武陵_數學_數B_g11s1e1/s2_2_f1.png
    crop:
      page: 1
      rect:
      - 182.6
      - 569.2
      - 300.8
      - 691.25
  - key: s2_2_f2
    kind: figure
    file: doc_111_桃園_武陵_數學_數B_g11s1e1/s2_2_f2.png
    crop:
      page: 1
      rect:
      - 337.4
      - 569.2
      - 450.8
      - 690.3
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：y＝$x^{2}$ 的圖形在 x＜0 時，由左而右逐漸下降

    (B) ╳：如題圖(一)，y＝$10^{x}$ 與 y＝x 的圖形無交點

    (C) ○：如題圖(二)，y＝$10^{x}$ 與 y＝$x^{2}$ 的圖形有 1 個交點，即 $10^{x}$＝$x^{2}$ 有實數解

    (D) ○：如題圖(一)，y＝$10^{x}$ 的圖形恆在 y＝x 圖形的上方，即 $10^{x}$＞x 恆成立

    (E) ○：如題圖(二)，當 x＞0 時，y＝$10^{x}$ 的圖形恆在 y＝$x^{2}$ 圖形的上方

    即當 x＞0 時，$10^{x}$＞$x^{2}$ 恆成立

    故選(C)(D)(E)'
