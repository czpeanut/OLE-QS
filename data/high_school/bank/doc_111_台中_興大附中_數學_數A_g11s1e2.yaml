- id: doc_111_台中_興大附中_數學_數A_g11s1e2_s2_6
  section: 2
  number: 6
  type: multiple
  page: 1
  stem: '發生地震時，因為距離與地形在週遭各地所感受到的震度是不同的，因此每次地震發生時，會利用儀器觀測得到的地動加速度 PGA（$\text{cm}/\text{sec}^2$）與地動速度 PGV（$\text{cm}/\text{sec}$），換算得到不同地區的地震震度等級，一般是採用整數表示。從 2020 年 1 月 1 日起，中央氣象局採用新的地震震度分級，將原來的 5 級與 6 級，再分成 5 弱、5 強、6 弱、6 強，如下表：

    | 舊制 | 0級 | 1級 | 2級 | 3級 | 4級 |

    | --- | --- | --- | --- | --- | --- |

    | 新制 | 0級 | 1級 | 2級 | 3級 | 4級 |

    | I值 | $0 \le I < 0.5$ | $0.5 \le I < 1.5$ | $1.5 \le I < 2.5$ | $2.5 \le I < 3.5$ | $3.5 \le I < 4.5$ |

    | 舊制 | 5級 |  | 6級 |  | 7級 |

    | --- | --- | --- | --- | --- | --- |

    | 新制 | 5弱 | 5強 | 6弱 | 6強 | 7級 |

    | I值 | $4.5 \le I < 5.0$ | $5.0 \le I < 5.5$ | $5.5 \le I < 6.0$ | $6.0 \le I < 6.5$ | $6.5 \le I$ |

    0～4 級依據地表強震儀觀測 PGA 決定，使用公式 $I_1 = 2.00\times\log(\text{PGA})+0.7$…①；5～7 級依據地表強震儀觀測 PGV 決定，使用公式 $I_2 = 2.14\times\log(\text{PGV})+1.89$…②，地震震度先以 PGA 換算，當計算震度 5 度以上時，改以 PGV 進行計算，但若計算 PGV 震度小於 4 級時，將震度定為 4 級。根據上述資料，下列哪些地區的地震資料其強度會被中央氣象局公告為 6 強？'
  options:
  - label: A
    content: PGA＝50，PGV＝70
  - label: B
    content: PGA＝100，PGV＝50
  - label: C
    content: PGA＝500，PGV＝100
  - label: D
    content: PGA＝1000，PGV＝90
  - label: E
    content: PGA＝700，PGV＝200
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $I_{1}$＝2.00×log 50＋0.7＝2.00×1.699＋0.7＝4.098（4級） (B) $I_{1}$＝2×log 100＋0.7＝4.7 $I_{2}$＝2.14×log 50＋1.89＝5.52586（6弱） (C) $I_{1}$＝2×log 500＋0.7＝2×2.699＋0.7＝6.098 $I_{2}$＝2.14×log 100＋1.89＝6.17（6強） (D) $I_{1}$＝2×log 1000＋0.7＝6.7 $I_{2}$＝2.14×log 90＋1.89＝2.14 ( 1＋0.9542 )＋1.89 ＝6.071988（6強） (E) $I_{1}$＝2×log 700＋0.7＝2×2.8451＋0.7＝6.39 $I_{2}$＝2.14×log 200＋1.89＝2.14×2.301＋1.89＝6.81414（7級） 故選(C)(D)。
  tags:
    unit:
      code: MA-A3-2-2
      book: 數學3A
