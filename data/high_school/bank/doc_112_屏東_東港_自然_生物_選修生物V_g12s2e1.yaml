- id: doc_112_屏東_東港_自然_生物_選修生物V_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在育種的過程中，科學家常將帶有不同特徵的作物反覆雜交，產生大量變異的子代後，從中選擇特定特徵的子代進行繁殖，培育成新的品系。根據以上的描述，何者正確？
  options:
  - label: A
    content: 作物可雜交，代表沒有生殖隔離的屏障
  - label: B
    content: 育種產生新品系作物的過程屬於異域種化
  - label: C
    content: 育種的傳統過程類似天擇，但由人為選定，故稱為人擇
  - label: D
    content: 雜交作物的過程因不牽涉基因重組，故能成功繁殖
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_112_屏東_東港_自然_生物_選修生物V_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 演化的動力來自遺傳變異，而遺傳變異主要由突變而來，下列有關遺傳變異與突變的敘述，何者正確？
  options:
  - label: A
    content: 天擇的方向會決定突變的方向
  - label: B
    content: 突變才能產生新的等位基因
  - label: C
    content: 突變的基因較容易適應環境
  - label: D
    content: 突變的基因可幫天擇的性狀做選擇
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
