- id: doc_109_台北_北一女中_數學_數A_g11s2e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設 O 為原點，$\vec{a}=\vec{OA}$，$\vec{b}=\vec{OB}$，其中 A（3，1，t），B（s，2，1），且$\vec{c}=2\vec{a}+\vec{b}$，試問下列敘述哪些是正確的？
  options:
  - label: A
    content: 若$│ \vec{b} │ =3$，則 s＝2
  - label: B
    content: 若點 B 在 yz 平面上，且$\vec{a}\perp \vec{b}$，則 t＝2
  - label: C
    content: $\vec{c} \cdot (\vec{a}\times \vec{b})=0$
  - label: D
    content: 若 s＝t＝1，則$\vec{a}\times \vec{b}=(1 , 2 , -5)$
  - label: E
    content: 若$\vec{c}// (\vec{a}+3\vec{b})$，則$\vec{c}// (\vec{a}-3\vec{b})$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵$│ \vec{b} │ =3$ ∴$\sqrt{s^{2}+2^{2}+1^{2}}=3$⇒ $s^{2}$＋5＝9 ⇒ s＝± 2

    (B) ╳：∵B 在 yz 平面上 ∴B（s，2，1）＝B（0，2，1）

    又 A（3，1，t）且$\vec{a}\perp \vec{b}$

    則$\vec{a} \cdot \vec{b}$＝$\vec{OA} \cdot \vec{OB}$＝（3，1，t）．（0，2，1）＝0＋2＋t＝0 ⇒ t＝－2

    (C) ○：∵$\vec{a}\perp (\vec{a}\times \vec{b})$且$\vec{b}\perp (\vec{a}\times \vec{b})$

    ∴$\vec{a} \cdot (\vec{a}\times \vec{b})$＝$\vec{b} \cdot (\vec{a}\times \vec{b})=0$

    則$\vec{c} \cdot (\vec{a}\times \vec{b})=(2\vec{a}+\vec{b}) \cdot (\vec{a}\times \vec{b})$＝$2\vec{a} \cdot (\vec{a}\times \vec{b})+\vec{b} \cdot (\vec{a}\times \vec{b})$

    ＝0＋0＝0

    (D) ╳：∵s＝t＝1 ∴A（3，1，1），B（1，2，1）

    則$\vec{a}\times \vec{b}$＝$\vec{OA}\times \vec{OB}$＝（3，1，1）×（1，2，1）＝$\left( \left| \begin{matrix}1 & 1 \\ 2 & 1\end{matrix} \right| , \left| \begin{matrix}1 & 3 \\ 1 & 1\end{matrix} \right| , \left| \begin{matrix}3 & 1 \\ 1 & 2\end{matrix} \right| \right)$

    ＝（－1，－2，5）

    (E) ○：∵$\vec{c}=2\vec{a}+\vec{b}$＝2（3，1，t）＋（s，2，1）＝（s＋6，4，2t＋1）

    又$\vec{a}+3\vec{b}$＝（3，1，t）＋3（s，2，1）＝（3s＋3，7，t＋3）

    若$\vec{c}// (\vec{a}+3\vec{b})$，則$\frac{s+6}{3s+3}=\frac{4}{7}=\frac{2t+1}{t+3}$，解得 s＝6，t＝$\frac{1}{2}$

    ∴$\vec{c}$＝（s＋6，4，2t＋1）＝（12，4，2）＝2（6，2，1）

    $\vec{a}-3\vec{b}$＝（－3s＋3，－5，t－3）＝$\left( -15 , -5 , -\frac{5}{2} \right)$＝$-\frac{5}{2}(6 , 2 , 1)$

    得$\vec{c}// (\vec{a}-3\vec{b})$

    故選(C)(E)'
