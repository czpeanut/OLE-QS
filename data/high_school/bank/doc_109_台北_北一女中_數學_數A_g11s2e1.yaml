- id: doc_109_台北_北一女中_數學_數A_g11s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 設向量$\vec{u}=(2 , -1 , 2)$，$\vec{v}=(-1 , 2 , 2)$，試問下列敘述哪些是正確的？
  options:
  - label: A
    content: $\vec{u} \cdot \vec{v}=0$
  - label: B
    content: $\vec{u}-\vec{v}=(-3 , 3 , 0)$
  - label: C
    content: 若$\vec{w}=\vec{u}-\vec{v}$，則$\vec{u}\times \vec{w}=\vec{v}\times \vec{w}$
  - label: D
    content: 找不到向量$\vec{w}$使得$\vec{u}\times \vec{w}=\vec{v}$
  - label: E
    content: 可找到非零向量$\vec{w}$使得$\vec{u} \cdot \vec{w}=\vec{v} \cdot \vec{w}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\vec{u} \cdot \vec{v}$＝（2，－1，2）．（－1，2，2）＝2×（－1）＋（－1）×2＋2×2

    ＝－2－2＋4＝0

    (B) ╳：$\vec{u}-\vec{v}$＝（2，－1，2）－（－1，2，2）＝（2＋1，－1－2，2－2）＝（3，－3，0）

    (C) ○：$\vec{u}\times \vec{w}$＝（2，－1，2）×（3，－3，0）

    ＝$\left( \left| \begin{matrix}-1 & 2 \\ -3 & 0\end{matrix} \right| , \left| \begin{matrix}2 & 2 \\ 0 & 3\end{matrix} \right| , \left| \begin{matrix}2 & -1 \\ 3 & -3\end{matrix} \right| \right)$

    ＝（6，6，－3）

    $\vec{v}\times \vec{w}$＝（－1，2，2）×（3，－3，0）

    ＝$\left( \left| \begin{matrix}2 & 2 \\ -3 & 0\end{matrix} \right| , \left| \begin{matrix}2 & -1 \\ 0 & 3\end{matrix} \right| , \left| \begin{matrix}-1 & 2 \\ 3 & -3\end{matrix} \right| \right)$

    ＝（6，6，－3）

    ∴$\vec{u}\times \vec{w}=\vec{v}\times \vec{w}$

    (D) ╳：令$\vec{w}=(a , b , c)$且$\vec{u}\times \vec{w}=\vec{v}$

    即（2，－1，2）×（a，b，c）＝（－1，2，2）

    ⇒$\left( \left| \begin{matrix}-1 & 2 \\ b & c\end{matrix} \right| , \left| \begin{matrix}2 & 2 \\ c & a\end{matrix} \right| , \left| \begin{matrix}2 & -1 \\ a & b\end{matrix} \right| \right) =(-1 , 2 , 2)$

    ⇒（－c－2b，2a－2c，2b＋a）＝（－1，2，2）

    ∴$\begin{cases}-c-2b =-1 \cdots \cdots \cdots \cdots \cdots ① \\ 2a-2c =2 \cdots \cdots \cdots \cdots \cdots \cdots ② \\ 2b+a =2 \cdots \cdots \cdots \cdots \cdots \cdots ③\end{cases}$

    由①＋③得 a－c＝1，與②同義，故方程組有無限多解

    例如：$\vec{w}=(2 , 0 , 1)$為其一解

    (E) ○：∵$\vec{u} \cdot \vec{w}=\vec{v} \cdot \vec{w}$

    取$\vec{w}=\vec{u}\times \vec{v}$

    ＝$\left( \left| \begin{matrix}-1 & 2 \\ 2 & 2\end{matrix} \right| , \left| \begin{matrix}2 & 2 \\ 2 & -1\end{matrix} \right| , \left| \begin{matrix}2 & -1 \\ -1 & 2\end{matrix} \right| \right)$

    ＝（－6，－6，3）

    此時$\vec{w}\perp \vec{u}$且$\vec{w}\perp \vec{v}$

    即$\vec{u} \cdot \vec{w}=\vec{v} \cdot \vec{w}=0$

    故選(A)(C)(E)'
