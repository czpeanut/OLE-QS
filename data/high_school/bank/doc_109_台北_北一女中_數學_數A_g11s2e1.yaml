- id: doc_109_台北_北一女中_數學_數A_g11s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 在空間中，試問下列敘述哪些是正確的？
  options:
  - label: A
    content: 若給定相異三點，則恰有一平面通過此三點
  - label: B
    content: 若直線 AB 與直線 CD 不垂直，則$\vec{AB}$與$\vec{CD}$不垂直
  - label: C
    content: 過已知直線上一點，恰有一條直線垂直此直線
  - label: D
    content: 過已知直線外一點，恰有一條直線平行此直線
  - label: E
    content: 若兩相異平面 $E_{1}$，$E_{2 }$交於一直線 L，且平面 E 與直線 L 垂直，則平面 E 分別與 $E_{1}$，$E_{2 }$垂直
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：應為不共線的相異三點，則恰有一平面通過此三點

    (B) ╳：雖然$\overset{\leftarrow \rightarrow}{AB}$，$\overset{\leftarrow \rightarrow}{CD}$不垂直，但是向量可以平移，所以$\vec{AB}$與$\vec{CD}$可能垂直

    (C) ╳：應為無限多條直線

    (D) ○：過已知直線外一點的直線，若此直線與原直線平行，則兩直線在同一平面上，故恰有一條直線滿足

    (E) ○：因為平面 E 與直線 L 垂直，則$\vec{L}$為平面 E 的法向量，又直線 L 在 $E_{1 }$上，則平面 E 與平面 $E_{1 }$垂直；同理，平面 E 與平面 $E_{2 }$垂直

    故選(D)(E)'
