  type: single
  page: 1
  stem: 在阿拉伯地區以前的宗教中，人們往往信仰多神祗，而在伊斯蘭的教義裡，阿拉唯一的真神，為此，穆罕默德受到麥加城中信奉多神教的部落排斥。同時，因為伊斯蘭教義中存在人人平等、施捨濟貧等主張，大大損害貴族和富豪的利益。看著伊斯蘭教在平民中越來越受歡迎，麥加貴族非常著急，開始謀畫迫害穆罕默德，受到威脅的穆罕默德只能將信徒帶往麥迪那，建立第一個伊斯蘭教政權，並發展自己的武力。在麥迪那經營五年之後，穆罕默德以「聖戰」為口號進行動員，宣佈：「為伊斯蘭教而戰，就是為真主而戰；為聖戰而死的人，可升天堂。」因此激起士兵們的鬥志，讓穆罕默德以武力衛教為口號進攻麥加。進入麥加後，穆罕默德採取了比在麥迪那更激烈的措施—改建神殿，鏟去克爾白神殿（傳統阿拉伯部落的神廟)供奉的所有神祇，僅保留真主阿拉，並將其定為穆斯林朝聖的地點。至此，穆罕默德終於建立起一個集軍、政、宗教大權於一身的神權國家。有學者將伊斯蘭教的產生視為一場「穆罕默德的革命」，請問題幹哪些字句和延伸理解可佐證這個論點？
  options:
  - label: A
    content: 「伊斯蘭的教義中，阿拉是唯一的真神」：穆罕默德首創一神教信仰，帶一場宗教上的革命
  - label: B
    content: 「伊斯蘭教義中存在著人人平等、施捨濟貧等主張」：穆罕默德爭取平民的權益，抵抗貴族的壓迫，對於促進社會進步有正向作用
  - label: C
    content: 「穆罕默德以武力衛教為口號進攻麥加」：這個武力奪權的過程在伊斯蘭教被稱為「聖遷」
  - label: D
    content: 「鏟去克爾白神殿供奉的所有神祇，僅保留真主阿拉，並將其定為穆斯林朝聖的地點：穆罕默德鼓勵對真主阿拉的偶像崇拜，並要求信徒盡可能前往麥加朝聖
