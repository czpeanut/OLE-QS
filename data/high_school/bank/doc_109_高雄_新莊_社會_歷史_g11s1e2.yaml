  stem: 擁有450清真寺的伊斯坦堡橫跨歐亞兩洲，曾經被種族和宗教相異的兩大帝國統治過。伊斯蘭教的諺語「《古蘭經》誕生在麥加，讀者在埃及，珍藏在伊斯坦堡。」完工西元六世紀、屹立約1500年之久的聖索菲亞，一直被當成征服者的勝利象徵。1453年甲帝國君王，外號法提赫（Fatih）的穆罕默德二世滅了東羅馬帝國，首次將聖索菲亞變成清真寺。聖索菲亞的建築結合基督教（耶穌賜福鑲嵌壁畫）與伊斯蘭教（阿拉真主的大圓頂祭壇），過去在東羅馬國時代是教堂，在甲帝國時卻成了清真寺。據外電報導，土耳其現任總統厄爾多安執意將列為世界遺產的聖索菲亞大教堂（Hagia Sophia）正式改為清真寺，開放讓穆斯林祈禱，讓這一歷史古蹟躍上了國際各大媒體的重要版面。2020年7月，土耳其政府出新聞稿，宣布因國家最高行政法院判決1934年的政府決議無效，因此棟建築此後將即刻「恢復」為清真寺，由土耳其宗教事務局接管，供穆斯林使用。關於這個重要的世界文化遺産的敘述，以下論述何者正確？
