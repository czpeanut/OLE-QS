  stem: 食物史是世界史課題之一，牽動著人類彼此間的關係。十八、十九世紀歐洲飲用咖啡人口大增，商人因此尋求海外殖民地栽植咖啡樹。1860年一本暢銷小說描寫亞洲某殖民地景況：政府強迫農人在自己土地上種咖啡樹，收成的咖啡豆只准賣給政府，否則會受罰，價錢也由政府定，當地人所得款項很少，這些措施常造成饑荒。但海邊一艘艘待航的船隻上面滿載讓荷蘭富有的豆子。文中描寫的殖民地最可能是：
