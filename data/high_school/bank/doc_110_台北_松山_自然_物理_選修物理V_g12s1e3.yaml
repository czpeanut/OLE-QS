- id: doc_110_台北_松山_自然_物理_選修物理V_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 若磁鐵棒原來作自由落體運動，當它通過螺線管線圈時，其運動狀態將依下列哪種情況發生改變？
  options:
  - label: A
    content: 接近線圈時速度變小，離開線圈時速度也變小
  - label: B
    content: 接近線圈和離開線圈時，其加速度都小於g
  - label: C
    content: 接近線圈時作減速運動，離開線圈時作加速運動
  - label: D
    content: 接近線圈時加速度小於g，離開線圈時作加速大於g
  - label: E
    content: 接近線圈時加速度大於g，離開線圈時作加速小於g
  group_stem: '如右圖所示，一磁鐵棒從一螺線管上方穿過螺線管的過程中，如螺線管兩端接上一微安培計，設重力加

    速度為g。試回答下列各題：'
  shared_asset: g1_5_12
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 不論接近還是遠離，皆會產生阻止磁鐵棒運動的磁力；接近時，有斥力向上，但合力向下，所以加速度小於g；遠離時，有吸力向上，但合力向下，所以加速度還是小於g，但由於過程中，合力均向下，所以加速度、速度同向，因此速率還是會變快。答案選(B)。
