- id: doc_112_台中_台中二中_社會_地理_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 由於大型百貨公司能吸引眾多消費者，故近年來許多小型零售業者選擇在百貨公司周邊的位置展店，藉此提高店家的曝光率與能見度，因而帶動整體商業活動的蓬勃發展，也吸引更多消費者前來消費，替商家創造出持續發展的商機。上述的現象，較適合用下列哪 2 個概念說明？
  options:
  - label: A
    content: 聚集經濟、商閾縮小
  - label: B
    content: 規模經濟、商品圈縮小
  - label: C
    content: 聚集經濟、商品圈擴大
  - label: D
    content: 規模經濟、商閾擴大
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「商品圈擴大」：百貨公司相較其他小型零售業而言屬於高級中地，擁有較大的商品圈，亦即擁有更廣大範圍的消費者來源。因此，當小型零售業設址鄰近百貨公司時，將能與更高級中地共享商品圈，造成其商品圈擴大之效；「聚集經濟」：當各式零售業聚集在同一區域時，不僅會匯集各方消費者，還會因此帶動交通路線匯集及更多零售業聚集之效，形成商圈而達到匯聚消費者效益。故選(C)。
