- id: doc_112_台中_台中二中_社會_地理_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 為避免都市過度發展，造成擁擠及公共設施不足的問題，都市計畫區訂定各使用分區的建蔽率與容積率，以規範土地開發密度。在一塊土地上，若規定的容積率為 100 ％，建蔽率＜40 ％，基地面積為 1,000 平方公尺，則下列設計何者符合規範？
  options:
  - label: A
    content: 2 層樓的房屋，每層樓板面積 500 平方公尺
  - label: B
    content: 4 層樓的房屋，每層樓板面積 250 平方公尺
  - label: C
    content: 5 層樓的房屋，每層樓板面積 300 平方公尺
  - label: D
    content: 10 層樓的房屋，每層樓板面積 120 平方公尺
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 建蔽率＝建築面積÷基地面積；容積率＝總樓板面積÷基地面積，依上述公式計算規定容積率 100 ％，建蔽率＜40 ％的 1,000 $m^{2}$ 的基地，則每層樓板面積需在 1,000 $m^{2}$ × 40 ％＝400 $m^{2}$ 以下，總樓板面積需在 1,000 $m^{2}$ × 100 ％＝1,000 $m^{2}$ 以下，僅有(B)符合題幹規定。
