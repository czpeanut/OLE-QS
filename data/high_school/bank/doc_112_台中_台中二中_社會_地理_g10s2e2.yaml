  explanation: 生活圈的概念係指居民得以便利取得各式生活服務的範圍，包括行政、消費、就業機會、醫療、教育、糧食、水電及休閒等。臺灣依地理位置劃分各區生活圈，圈內包含不同等級的都市提供居民不同等級的生活服務，不僅可滿足居民生活所需，亦可減少居民跨區遷移達到人口平均分布之效。依此即可將生活圈內的各級都市視為各級中地，進而依據提供服務等級及各項地理條件規劃各自服務商品圈，亦即形成臺灣各區域的生活圈。故選(A)甲。
