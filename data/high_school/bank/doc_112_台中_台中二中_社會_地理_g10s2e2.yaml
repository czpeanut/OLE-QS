  explanation: 甲圖同心圓模式中的 1 為中心商業區；2 為過渡帶。(B) 2 區因鄰近中心商業區，使得該地居住品質不佳，包括吵雜及建物老舊等都市問題，當都市人口逐漸移往郊區過程中，該地則因低落的居住品質而吸引低收入人口進住，使得該地易出現貧窮及犯罪等社會問題。臺中鄰近火車站地區與圖中 2 區一樣，在人口外移到新興重劃區後，該區居住人口逐漸外移，原有商業活動亦隨之沒落，現因房價下滑而成為新移民或移工聚集地區，該地的居住品質因此下滑。
