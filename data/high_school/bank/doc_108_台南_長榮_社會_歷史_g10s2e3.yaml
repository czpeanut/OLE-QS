  section: 1
  number: 11
  type: single
  page: 1
  stem: 19世紀中晚期，法式長棍麵包傳入某地區後，當地人把麵包對半剖開，抹上豬肝醬、美乃滋與鮮味露等，再夾入豬肉凍或火腿、小黃瓜、醃蘿蔔絲、青木瓜和香菜、辣椒等配料，結合了酸甜香辣鹹多種滋味，成為在地特色三明治。請問此地區為下列何者？
  options:
  - label: A
    content: 印尼
  - label: B
    content: 越南
  - label: C
    content: 緬甸
  - label: D
    content: 菲律賓
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 蔣中正在日記中記載：最近，中共代表向美國表示，中共必須重視莫斯科的意見，美國想調解國共關係，必須先徵求俄國同意。此段記載最可能出現於何時？
  options:
  - label: A
    content: 1924年國民黨實施聯俄容共之際
  - label: B
    content: 1937年七七盧溝橋事變爆發之後
  - label: C
    content: 1946年二次大戰後中國發生內戰
  - label: D
    content: 1958年中共發動八二三砲戰之前
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 1862年，德川幕府派官員到上海考察，隨行一位藩士寫下《遊清五錄》，描述當時上海的情形：「歐羅巴諸邦商船軍艦數千艘停泊江上，桅檣林立，填滿津口；陸上則有諸邦商館，粉壁千尺，殆如城郭，其雄大壯偉，筆紙難以表述。」另一方面他也觀察到：「中國人到處被外國人牽制著。……與其說上海是中國人的土地，還不如說是英法兩國的殖民地。……雖然說我們是日本人，但對於這樣的局面也應該關心留意。因為這不僅是中國之事。」他指出中國受侵略的根源是國策失誤：「當權者只知守舊……沒有製造軍艦大砲在戰區裡抵禦敵人，才造成如此衰敗的結果。」這位日本人寫此書的目的最可能是：
  options:
  - label: A
    content: 日本已是先進國家，自認為是高級文化代表，故多批評
  - label: B
    content: 日本也相當落後，看到中國情況，希望能避免重蹈覆轍
  - label: C
    content: 日本自以為遠較中國富強，希望也能效法列強瓜分中國
  - label: D
    content: 日本自知無法抵抗列強，主張閉關自守，拒列強於境外
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 明治維新幾項重要改革，包括：廢藩置縣、廢止身分制、廢刀令等。請問這些改革的主要目的為何？
  options:
  - label: A
    content: 建立人人平等的共治社會
  - label: B
    content: 鞏固封建加強對地方控制
  - label: C
    content: 推動中央集權的君主政體
  - label: D
    content: 以國家之力培養私人企業
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 某年，中國發生重大事件，引起蘇聯關切：《消息報》指出該事件將打擊中國反日力量的團結；《真理報》更認為該事件將造成中國分裂，使日本進一步侵略中國。此一重大事件為何？
  options:
  - label: A
    content: 甲午戰爭，日本要求中國割讓遼東半島及臺灣
  - label: B
    content: 袁世凱稱帝，日本提出二十一條要求作為交換
  - label: C
    content: 五四運動，學生認為政府對日軟弱，主張抗日
  - label: D
    content: 西安事變，張學良要求停止剿共，以共同抗日
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 在日常生活中，本地人繼續使用本國語言彼此交談，有些商家，特別是賣中藥的商家，仍使用漢字為商品打廣告，不過到了1930年代，大多數的商家已經改用羅馬字母的國語字了。請問此地最可能為何處？
  options:
  - label: A
    content: 日本
  - label: B
    content: 朝鮮
  - label: C
    content: 越南
  - label: D
    content: 中國
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 明治維新以來，日本積極追求西化，甚至出現「脫亞入歐論」。但某一時期，日本思想界風向出現變化，主張要「批判近代性與西方文化」，強調在文化戰爭中反抗西方，不要屈膝於西方之文化理想中。當時，報紙刊登一首詩：「我立於義與生命／彼立於利；我可說捍衛正義／彼可說利之侵略；當彼藐視四方。／我則打造大東亞家庭」，反映知識界的反西方思潮。這個時期是：
  options:
  - label: A
    content: 明治維新時期，文化界抗拒西方思潮
  - label: B
    content: 大正民主時期，文化界擔憂文化失序
  - label: C
    content: 二次大戰期間，思想界配合戰爭目標
  - label: D
    content: 盟軍占領時期，知識界抗拒美國文化
