  stem: 中共與北韓金氏家族關係密切，有其淵源，主要是派兵參加「韓戰」。1950年6月北韓軍隊南下，攻陷漢城（首爾），並向南推進；9月，以美軍為主力的聯合國軍隊登陸仁川，乘勢反攻，跨越北緯38度線，直抵鴨綠江邊。此時，毛澤東雖十分猶豫，仍決定派「人民志願軍」援助金日成政府，10月底成功伏擊美軍。麥克阿瑟也未料到中共會派軍參戰，甚至還希望在11月感恩節前統一全韓，結束戰事。此後雙方展開幾次重大戰役，互有勝負，在北緯38度線上拉鋸，形成長期對峙之勢，直到1953年7月才簽訂和平協定。下列哪些是有關中共參加韓戰的合理敘述？
  options:
  - label: A
    content: 中共以人民志願軍名義參戰，即不願與美國全面為敵
  - label: B
    content: 冷戰局勢下，美國支持的統一韓國，毛澤東深感威脅
  - label: C
    content: 中共志願軍能夠攻下漢城，美軍過於輕敵是重要因素
  - label: D
    content: 志願軍能對抗美軍，蘇聯派正規軍介入應是主要因素
  - label: E
    content: 志願軍雖然多，不能致勝，在於武器上與美軍有落差
