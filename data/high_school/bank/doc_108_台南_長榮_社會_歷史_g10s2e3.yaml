- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 辛亥革命結束中國長達兩千多年的帝制時代，建立東亞第一個民主共和國，但民初的共和體制卻飽受各方勢力挑戰，請問下列哪些事件屬之？(甲)總統制與內閣制的交替；(乙)袁氏竊國稱帝；(丙)軍閥割據；(丁)新文化運動；(戊)五四運動
  options:
  - label: A
    content: 甲丁戊
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁戊
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 珍珠港事件後，日軍席捲東南亞，新加坡當地華僑被迫組成游擊隊抗日，直到新加坡淪陷後，部分成員仍持續與日軍作戰，類似的抗日行動在東南亞各地也不斷上演。請問日軍侵略東南亞所造成影響為何？
  options:
  - label: A
    content: 東南亞的殖民母國與日本合作打壓抗日行動
  - label: B
    content: 胡志明領導的越南獨立同盟會採取聯法抗日的戰略
  - label: C
    content: 殖民母國的敗退，給予當地民族主義領袖尋求獨立建國的契機
  - label: D
    content: 日軍掠奪當地物資，擴充軍備，組織高砂義勇軍前往中國作戰
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 19世紀中葉，大院君命令全國各地紛紛建立寫有「洋夷侵犯，非戰則和，主和賣國」12個漢字的「斥和碑」。史書記載「洋夷之侵犯我境，極為痛惋矣。……而以若數千年禮義之邦，豈可與犬羊相和乎？雖幾年相持，必痛絕乃已。」根據以上資料判斷，當時大院君採行哪一政策？
  options:
  - label: A
    content: 開放貿易
  - label: B
    content: 朝貢貿易
  - label: C
    content: 鎖國排外
  - label: D
    content: 脫亞入歐
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 主張征韓論的西鄉隆盛辭官後，大久保利通和西鄉從道希望藉由發動一次軍事征討活動，以安撫國內沸騰的征韓情緒。他們認為：若實行征韓，或許會招致俄國出兵，但若是征討某地，依照所謂生番乃化外之民的說法，即便出兵也不至於侵犯到鄰國主權。如此一來，便可以為征韓論者降溫。請問上文中的某地是下列哪一地區？
  options:
  - label: A
    content: 東北
  - label: B
    content: 山東
  - label: C
    content: 琉球
  - label: D
    content: 臺灣
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 鄧小平上臺後，宣布必須在思想政治上堅持「四項基本原則」，即堅持「社會主義道路」、「無產階級專政」、「共產黨的領導」及「馬列主義、毛澤東思想」。關於鄧小平的政策，下列敘述何者正確？
  options:
  - label: A
    content: 仍然以階級鬥爭作為施政主軸
  - label: B
    content: 在天安門學運遭到鎮壓，是因學生們要求經濟上的完全開放
  - label: C
    content: 面對國際的經濟封鎖，鄧小平及中國官方不作任何回應
  - label: D
    content: 為確保共產政權的唯一統治，維持政左經右路線
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在某一條約中規定大日本帝國擁有以下權利：接受大韓帝國的要求將韓國併入大日本帝國；保障舊大韓帝國皇帝與皇族的尊嚴與權益及經濟開銷；對於有勳功的朝鮮人賜爵賜勳；保護朝鮮人的生命與財產並增進其福祉；可以將對新制度認同、又具相當能力的朝鮮人用為帝國官吏。請問在此條約簽訂後，朝鮮有何改變？
  options:
  - label: A
    content: 韓人享有獨立自治權
  - label: B
    content: 朝鮮現代化建設受挫
  - label: C
    content: 朝鮮與日本和平共處
  - label: D
    content: 警察深入社會各層面
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 學者主張：「婦女解放尤賴婦女自己解放起，解放第一步，是打破賢妻良母主義，改以人的教育。女性醒悟『女人首先是人』，繼而走出家庭，迎向社會，從經濟、生活、精神上贏得獨立自主。」請問這種婦女解放見解的出現，與下列哪個事件關係最密切？
  options:
  - label: A
    content: 自強運動
  - label: B
    content: 辛亥革命
  - label: C
    content: 五四運動
  - label: D
    content: 戊戌變法
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 韓國史料記載：「當日參加集會的志士，在漢城塔城公園和平集會，手舉太極旗，宣讀《獨立宣言書》，高喊大韓獨立萬歲，政府卻動員軍隊鎮壓示威群眾，造成民眾傷亡。」有關此事件的敘述，下列何者正確？
  options:
  - label: A
    content: 時值二戰期間，國內興起反戰思想
  - label: B
    content: 凝聚民族主義的力量，為韓國史上著名的三一運動
  - label: C
    content: 日本以「協助朝鮮獨立」為由干涉朝鮮改革，引發民怨
  - label: D
    content: 日本隨後宣布併吞朝鮮，打壓朝鮮民族意識
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 一名工人回憶道：「在礦坑採礦時，頭上礦燈的電池硫酸經常滲漏，皮膚因而多次被灼傷，日本監工每日只發兩個黑饅頭，無菜無肉，在暗無天日下被奴役兩年，最終患上夜盲症。」請問上述情形的發生與下列何事有關？
  options:
  - label: A
    content: 二戰期間，日本在朝鮮實施的戰時體制
  - label: B
    content: 高砂義勇隊在南洋服役時遭遇的困境
  - label: C
    content: 國府為了抵禦外敵，動員勞工採礦
  - label: D
    content: 日軍在華北執行「燒光、殺光、搶光」的三光政策
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 一位歐洲軍官寫信回家，描述在北京的見聞：公園裡還躺著許多屍體，軍隊則駐紮在皇宮中。他可以看到許多稀世珍寶，其中有一尊身著金袍的玉佛，可惜玉佛無法保障中華帝國的安危。他明天即將隨軍隊撤離北京，帶回各種戰利品。這封信描述的最可能是何時的情況？
  options:
  - label: A
    content: 清軍入關時
  - label: B
    content: 太平天國時
  - label: C
    content: 八國聯軍時
  - label: D
    content: 辛亥革命時
