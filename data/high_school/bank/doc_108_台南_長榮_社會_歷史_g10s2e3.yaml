- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 在印尼共產主義運動的發展史上，曾受到3次毀滅性打擊。第一次是1926年的起義遭荷蘭殖民政府鎮壓；第二次是1948年與政府爭奪獨立革命領導權失敗；第三次是1960年代九三○事件後，遭到甲政府的大屠殺。請問甲為何者？
  options:
  - label: A
    content: 蘇卡諾
  - label: B
    content: 波帕
  - label: C
    content: 蘇哈托
  - label: D
    content: 胡志明
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 與洪秀全齊名的太平天國首領楊秀清，出身廣西，世代以燒炭種山為業，父母去世後，離家流浪，與人結夥護送洋貨，交結不少兩廣江湖豪客。後來因失業回到家鄉，仍作燒炭工人。楊秀清此時的「失業」，與某一城市的開港有關。這一城市應是：
  options:
  - label: A
    content: 廣州
  - label: B
    content: 上海
  - label: C
    content: 天津
  - label: D
    content: 南京
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 朝鮮為了迎接中國的大臣，曾在漢城（今首爾）建有「迎恩門」。某事件後，朝鮮改革派拆除迎恩門，在原址改建一座「獨立門」，象徵朝鮮脫離中國而獨立。請問某事件應是？
  options:
  - label: A
    content: 江華島事件
  - label: B
    content: 甲午戰爭
  - label: C
    content: 日俄戰爭
  - label: D
    content: 日韓合併
- id: doc_108_台南_長榮_社會_歷史_g10s2e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 「這場戰爭是驗收自強運動的時候了……清朝的問題不能只用外族一詞就交代過去。問題顯然在帝制政體本身……帝制政府結構上不可能成為近代化的中央統治力。」依據上述資料，下列說明何者正確？
