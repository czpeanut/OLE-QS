  group_stem: 明治維新後，最受打擊的莫過於某個階層，其特權與俸祿被取消，因此對新政府感到不滿。在征韓論被擱置後，下野的西鄉隆盛在地方結黨，彈劾政府；板垣退助則提出《民選議院設立建言》，攻擊政府的專制。西鄉隆盛在西南戰爭中與政府對抗，政府獲勝後，板垣退助等人開啟自由民權運動與政黨政治的先聲。 日本的自由民權運動主要分兩派：一派以板垣退助為代表，主張法國式的激進改革；另一派以大隈重信為代表，主張英國式的穩健改革。他們除了譴責政府是薩長藩獨占的體制外，還主張讓民眾參與政治。
