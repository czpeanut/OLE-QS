  - label: A
    content: 著重明暗對比的技法，提升觀看者的感官享受
  - label: B
    content: 借助光與色的變化來表現畫家在瞬間捕捉到的景象
  - label: C
    content: 強調寫意的傳統，抒發繪畫者面對自然時的內在感受
  - label: D
    content: 注重和諧勻稱，強調畫面黃金比例的配置
