- id: doc_112_台北_景美女中_自然_化學_選修化學V_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 下列有關第一列過渡元素之敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 第一列過渡元素皆為金屬，為電及熱之良導體
  - label: B
    content: 第一列過渡元素的化合物有些具有特殊顏色，例如：硝酸銅呈紅色
  - label: C
    content: 多數第一列過渡元素之電子組態具有未滿之 d 軌域
  - label: D
    content: 多數第一列過渡元素化合物大都具有不只一種氧化數
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)硝酸銅應呈藍色。

