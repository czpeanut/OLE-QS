  type: single
  page: 1
  stem: 下列關於氮氣與含氮化合物的敘述，何者正確？
  options:
  - label: A
    content: 氮氣的化性不活潑，可充入食品及化學藥品中，以避免變質
  - label: B
    content: 氮氣與水可生成分子間氫鍵，故氮氣易溶於水
  - label: C
    content: $HNO_{3}$ 的性質穩定，常儲存於無色透明的玻璃瓶中
  - label: D
    content: 奧士華法製硝酸的原料是 $N_{2}$(g) 及 $O_{2}$(g)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)氮氣為非極性分子，且無法與水生成分子間氫鍵，對水溶解度不大。

    (C)硝酸照光易分解：$4HNO_{3}$(aq) → $4NO_{2}$(g)＋$O_{2}$(g)＋$2H_{2}$O(l)，所以應儲存於棕色瓶。

    (D)奧士華法製硝酸的原料是 $NH_{3}$(g) 與 $O_{2}$(g)。'
