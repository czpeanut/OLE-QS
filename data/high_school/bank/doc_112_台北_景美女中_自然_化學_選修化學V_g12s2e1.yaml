  type: single
  page: 1
  stem: 下列關於氧與臭氧的敘述，何者正確？
  options:
  - label: A
    content: 同溫同壓下，氧氣的密度比臭氧高
  - label: B
    content: 氧與臭氧均為非極性分子
  - label: C
    content: 在相同溫度壓力下，臭氧的沸點低於氧氣
  - label: D
    content: 臭氧可使碘化鉀-澱粉試紙呈藍色
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)同溫、同壓下，臭氧的密度比氧氣高。因理想氣體方程式：PM＝dRT，因此 d µ M，即氣體分子量愈大，密度愈高。

    (B)臭氧為角形（彎曲形）分子，故為極性分子。

    (C)臭氧分子量比氧氣大，凡得瓦力（分散力）也較大；此外，臭氧分子間具有極性分子間的偶極－偶極力，但氧氣分子間則為較弱的分散力，因此同溫、同壓下臭氧的沸點比氧氣高。

    (D) 2KI(aq)＋$O_{3}$(g)＋$H_{2}$O(l) → $I_{2}$(s)＋$O_{2}$(g)＋2KOH(aq)，因氧化力：$O_{3}$＞$O_{2}$，故向右為自發性氧化還原反應，生成的 $I_{2}$ 遇澱粉呈藍色。'
