  stem: 下列有關鋁與含鋁化合物的敘述，何者正確？
  options:
  - label: A
    content: 鋁的價電子組態為 $3s^{2}3p^{6}3d^{3}$，故易形成＋3 價的離子
  - label: B
    content: Al(OH)$_{3}$(s) 屬於兩性物質，可溶於氨水中
  - label: C
    content: 鋁之比重輕，僅鐵之 $\frac{1}{3}$，故純鋁適合用作飛機材料
  - label: D
    content: 鋁之活性大，易氧化成氧化鋁，且結構緻密，可防止內層的鋁金屬氧化而鏽蝕的功能
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)鋁的價電子組態為 $3s^{2}3p^{1}$，故易形成＋3 價的離子。

    (B) Al(OH)$_{3}$(s) 屬於兩性物質，可溶於強鹼中，但氨水為弱鹼，因此 Al(OH)$_{3}$(s) 無法溶於其中。

    (C)鋁雖輕，但純鋁較軟，經處理過製成強度較高的鋁合金，才能作為飛機的材料。'
