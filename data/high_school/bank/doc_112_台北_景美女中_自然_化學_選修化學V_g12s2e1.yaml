  stem: 矽是重要的半導體材料，下列有關矽與含矽化合物的敘述，何者正確？
  options:
  - label: A
    content: 矽的結構與石墨相似，以 $sp^{2}$ 鍵結為平面的共價網狀固體
  - label: B
    content: 純矽的導電性隨溫度升高而增大，加入適當雜質也可增大其導電性
  - label: C
    content: 玻璃中的二氧化矽成分可被強酸溶解，因此不適合盛裝鹽酸等強酸性溶液
  - label: D
    content: 若於矽中加入微量 13 族元素，如硼，則成 N 型半導體
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)矽的結構與鑽石相似，以 $sp^{3}$ 鍵結為三度空間的共價網狀固體。

    (C)玻璃中的二氧化矽成分可被強鹼溶解：$SiO_{2}$(s)＋2NaOH(aq) → $Na_{2}SiO_{3}$(aq)＋$H_{2}$O(l)，因此不適合盛裝鹼性溶液。

    (D)若於矽中加入微量 13 族元素，如硼，則成 P 型半導體。'
