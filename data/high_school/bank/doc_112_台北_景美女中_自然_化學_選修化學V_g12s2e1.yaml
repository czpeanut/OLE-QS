- id: doc_112_台北_景美女中_自然_化學_選修化學V_g12s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '未知物甲進行元素定性分析後，發現其中僅含 C、H、O 三元素，後續針對未知物甲進行下列實驗：

    實驗一：取未知物甲 3.0 克置於純氧中完全燃燒，讓產物分別通過含無水過氯酸鎂之吸收管、氫氧化鈉吸收管，結果過氯酸鎂吸收管重量增加 1.8 克，氫氧化鈉吸收管重量增加 4.4 克。

    實驗二：取 1.8 克未知物甲加水配製成 100 mL 的水溶液，確認該水溶液無法導電，且於 27 ℃ 時測得該水溶液滲透壓為 0.492 atm。（R＝0.082 L atm $K^{－1}$ $mol^{－1}$，0.082×300＝24.6）

    請依據上述兩個實驗所得之數據，判斷下列敘述何者正確？（原子量：C＝12、H＝1、O＝16）'
  options:
  - label: A
    content: 實驗式為 $C_{2}H_{4}$O
  - label: B
    content: 分子式為 $C_{30}H_{60}O_{30}$
  - label: C
    content: 進行元素定量分析時，氫氧化鈉吸收管也可擺置於過氯酸鎂吸收管之前
  - label: D
    content: 進行元素定量分析時，有機化合物中氧元素質量，相當於燃燒產物中，二氧化碳與水所含氧元素質量總和
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)由實驗一未知物中，$W_{C}$＝4.4×$\frac{12}{44}$＝1.2（g），$W_{H}$＝1.8×$\frac{2}{18}$＝0.2（g），而 $W_{O}$＝3.0－$W_{C}$－$W_{H}$＝3.0－1.2－0.2＝1.6（g）。此未知物中 C、H、O 原子個數比 C：H：O＝$\frac{1.2}{12}$：$\frac{0.2}{1}$：$\frac{1.6}{16}$＝1：2：1，可得未知物之實驗式為 $CH_{2}$O，式量＝1×12＋2×1＋1×16＝30。

    (B)由實驗二滲透壓 π＝（$iC_{M}$）RT，而水溶液不導電，因此未知物不解離，i＝1，故 0.492＝$\frac{\frac{1.8}{M}}{0.1}$×0.082×300，解得 M＝900。n＝$\frac{900}{30}$＝30，因此分子式＝實驗式×30＝$CH_{2}$O×30＝$C_{30}H_{60}O_{30}$。

    (C)因為氫氧化鈉會吸收 $CO_{2}$ 與 $H_{2}$O，所以如果放置在過氯酸鎂吸收管前，會同時吸收 $CO_{2}$ 與 $H_{2}$O，導致無法獨立測量 $CO_{2}$ 與 $H_{2}$O 的生成質量。

    (D)燃燒產物的元素總和會連同燃燒時，空氣中消耗的氧也併入計算，因此待測物中的氧元素質量，應在燃燒前秤試樣（或樣品）重，再扣除碳、氫質量求得。'
