  stem: 下列有關氫的敘述，何者正確？
  options:
  - label: A
    content: 氫氣採用向上排氣集氣法收集
  - label: B
    content: 氫氣是燃料電池的陰極反應物
  - label: C
    content: 氫與活潑金屬反應會產生金屬氫化物，金屬氫化物溶於水可產生氫氣
  - label: D
    content: 氫氣與非金屬元素形成的化合物，原子間大多以離子鍵互相連結
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)氫氣為非極性分子，難溶於水，所以採用排水集氣法收集。

    (B)燃料電池中 $H_{2}$(g) 被氧化，因此氫氣應填充於陽極作為燃料。

    (D)氫氣與非金屬元素形成的化合物，原子間大多以共價鍵互相連結。'
