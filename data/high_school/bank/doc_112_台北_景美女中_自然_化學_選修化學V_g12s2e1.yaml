  stem: 下列有關鈉與鎂的敘述，何者正確？
  options:
  - label: A
    content: 鈉的質地柔軟、密度小，是不同於一般金屬的特性
  - label: B
    content: 實驗廢棄的鈉金屬，應以硝酸或硫酸等強酸完全作用完畢再丟棄
  - label: C
    content: 鎂帶不慎點燃，可以 $CO_{2}$ 滅火
  - label: D
    content: 室溫時，鎂易與水作用產生氫氧化物及氫氣
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)實驗廢棄的鈉金屬，應使用乙醇反應後再排入水槽。

    (C)鎂帶在 $CO_{2}$ 中仍可燃燒：2Mg(s)＋$CO_{2}$(g) → 2MgO(s)＋C(s)。

    (D)鎂在常溫下無法與水反應，但鎂可與熱水進行以下反應：Mg(s)＋$2H_{2}$O(l) → Mg(OH)$_{2}$(aq)＋$H_{2}$(g)。'
