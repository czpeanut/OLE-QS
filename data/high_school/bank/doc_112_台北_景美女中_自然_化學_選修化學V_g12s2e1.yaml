- id: doc_112_台北_景美女中_自然_化學_選修化學V_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 工業上以索耳未法製備碳酸鈉的流程如下：石灰石（$CaCO_{3}$）加熱分解產生氣體甲，將氣體甲與氨氣通入飽和物質乙水溶液中析出碳酸氫鈉，加熱碳酸氫鈉得碳酸鈉；副產物 $NH_{4}Cl$ 與 $Ca(OH)_{2}$ 反應可回收氣體丙循環使用。依據該流程，判斷下列何者正確？
  options:
  - label: A
    content: 物質甲為 CO(g)
  - label: B
    content: 物質乙為 HCl(aq)
  - label: C
    content: 物質丙為 $NH_{3}$(g)
  - label: D
    content: Ca(OH)$_{2}$ 與 $NH_{4}$Cl 進行的反應屬於氧化還原反應
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_112_台北_景美女中_自然_化學_選修化學V_g12s2e1/s1_7_f1.png
    crop:
      page: 1
      rect:
      - 123.1
      - 664.1
      - 495.0
      - 786.15
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)化合物甲的生成反應：$CaCO_{3}$(s) $\xrightarrow{\triangle}$ CaO(s)＋$CO_{2}$(g)，故化合物甲為 $CO_{2}$(g)。

    (B)生成碳酸氫鈉的主要反應：$CO_{2}$(g)＋$NH_{3}$(g)＋$H_{2}$O(l)＋NaCl(aq) → $NaHCO_{3}$(aq)＋$NH_{4}$Cl(aq)，由此反應推測，乙應為 NaCl(aq)。

    (C)(D)化合物丙的生成反應：$2NH_{4}$Cl(aq)＋Ca(OH)$_{2}$(s) → $CaCl_{2}$(s)＋$2NH_{3}$(g)＋$2H_{2}$O(l)，故化合物丙為 $NH_{3}$(g)，且此反應並非氧化還原反應。'
