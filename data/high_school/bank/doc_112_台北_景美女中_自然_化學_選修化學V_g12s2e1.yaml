  stem: 血紅素中依靠血基質負責結合氧氣，關於血基質的相關敘述，何者正確？
  options:
  - label: A
    content: 中心離子為 $Fe^{3＋}$
  - label: B
    content: 未與 $O_{2}$(g) 結合的血基質中，以含氮的雜環為四牙配基與中心離子形成錯合物，其中心離子之配位數為 4
  - label: C
    content: 血基質中心離子與氧結合後，形成中心離子的配位數仍為 4，但呈紅色的配位化合物
  - label: D
    content: 葉綠素結構類似血基質，但葉綠素以 $Fe^{2＋}$ 為中心離子，含氮的雜環為四牙配基形成的錯合物
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)血基質的中心離子為 $Fe^{2＋}$。

    (C)與 $O_{2}$(g) 結合的血基質中，中心離子之配位數為 6。

    (D)葉綠素以 $Mg^{2＋}$ 為中心離子。'
