- id: doc_110_新竹_竹東_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 給定兩多項式f (x) 與g (x)，下列選項哪些正確？
  options:
  - label: A
    content: 若 $\deg(f(x)) = \deg(g(x)) = m$，則 $\deg(f(x)+g(x)) = m$
  - label: B
    content: 若 $\deg(f(x)) = m$，$\deg(g(x)) = n$，則 $\deg(f(x)\times g(x)) = m+n$
  - label: C
    content: 若 $g(x)\neq 0$，則 $\deg(f(x)\times g(x)) > \deg(f(x))$
  - label: D
    content: 已知 $g(x)\neq 0$，若 $f(x)$ 除以 $g(x)$，會得到唯一的商式 $q(x)$ 及餘式 $r(x)$ 且 $f(x)=g(x)\times q(x)+r(x)$，其中 $\deg(r(x)) < \deg(g(x))$ 或是 $r(x)=0$
  - label: E
    content: 已知 $f(x)$ 除以 $g(x)$ 的商式為 $q(x)$，餘式為 $r(x)$，則 $\deg(q(x))$ 存在，且 $\deg(f(x)) = \deg(g(x))+\deg(q(x))$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 舉反例， f (x)＝$x^{2}$＋1，g (x)＝－$x^{2}$＋x， ⇒ deg f (x)＝deg g (x)=2，但deg ( f (x)＋g (x) )≠2， 故錯誤。 (B) 根據指數律，故正確。 (C) 舉反例， g (x)＝2，f (x)＝$x^{2}$ ⇒ deg ( f (x)．g (x) )＝2，deg f (x)＝2， 故錯誤。 (D) 根據除法原理， f (x)＝g (x)．q (x)＋r (x)，其中deg r (x)＜deg g (x) 或r (x)＝0， 故正確。 (E) 舉反例， f (x)＝2，g (x)＝$x^{2}$， ⇒ f (x)＝g (x)．q (x)＋r (x) ⇒ 2＝$x^{2}$．0＋2 ( q (x)＝0無次數可言，deg ( g (x) ) 不存在 )， 故錯誤。 故選(B)(D)。
  tags:
    unit:
      code: MA-1-3-1
      book: 數學1（必修）
      chapter: 多項式函數
      title: 多項式的除法原理
      std: true
    textbook: 數學1（必修） 多項式的除法原理
    pattern:
      key: MA-1-3-1:T01
      name: 多項式定義與係數次數判別
    labeled_by: agent
    label_confidence: high
    label_note: 選項(B)「deg(g(x))=m」誤植（依結論 m+n 應為 n）
    fixed_by: agent
    fix_note: （人工修正：修正選項 B 誤植與亂碼，修正選項 D 餘式次數條件）
  difficulty: 2
