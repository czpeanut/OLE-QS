- id: doc_110_新竹_竹東_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 給定兩多項式f (x) 與g (x)，下列選項哪些正確？
  options:
  - label: A
    content: 若deg ( f (x) )＝deg ( g (x) )＝m，則deg ( f (x)＋g (x) )＝m
  - label: B
    content: 若deg ( f (x) )＝m，deg ( g (x) )＝m，則deg ( f (x)×g (x) )＝m＋n
  - label: C
    content: 若g (x)≠0，則deg ( f (x)×g (x) )＞deg ( f (x) )
  - label: D
    content: 已知g (x)≠0，若f (x) 除以g (x)，會得到唯一的商式q (x) 及餘式r (x) 且f (x)＝g (x)×q (x)＋r (x)，其中 deg ( r (x) )＜deg ( q (x) ) 或是r (x)＝0
  - label: E
    content: 已知f (x) 除以g (x) 的商式為q (x)，餘式為r (x)，則deg ( q (x) )存在，且deg ( f (x) )＝deg ( g (x) )＋deg ( q (x) )
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 舉反例， f (x)＝$x^{2}$＋1，g (x)＝－$x^{2}$＋x， ⇒ deg f (x)＝deg g (x)=2，但deg ( f (x)＋g (x) )≠2， 故錯誤。 (B) 根據指數律，故正確。 (C) 舉反例， g (x)＝2，f (x)＝$x^{2}$ ⇒ deg ( f (x)．g (x) )＝2，deg f (x)＝2， 故錯誤。 (D) 根據除法原理， f (x)＝g (x)．q (x)＋r (x)，其中deg r (x)＜deg g (x) 或r (x)＝0， 故正確。 (E) 舉反例， f (x)＝2，g (x)＝$x^{2}$， ⇒ f (x)＝g (x)．q (x)＋r (x) ⇒ 2＝$x^{2}$．0＋2 ( q (x)＝0無次數可言，deg ( g (x) ) 不存在 )， 故錯誤。 故選(B)(D)。
