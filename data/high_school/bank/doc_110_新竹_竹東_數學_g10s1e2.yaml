  stem: 已知多項式f (x) 除以多項式g (x) 的商式為q (x)，餘式為r (x)，下列選項哪些正確？
  options:
  - label: A
    content: f (x) 除以3 g (x) 的商式為$\frac{1}{3}$q (x)
  - label: B
    content: f (x) 除以g (x) 的餘式為r (x)
  - label: C
    content: 3 f (x) 除以g (x) 的商式為$\frac{1}{3}$q (x)
  - label: D
    content: 3 f (x) 除以g (x) 的餘式為r (x)
  - label: E
    content: x f (x) 除以g (x) 的商式為x q (x)
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: f (x)＝g (x)．q (x)＋r (x)， (A) f (x)＝( 3g (x) )．($\frac{1}{3}$q (x) )＋r (x)，故正確。 (B) 正確。 (C) 3f (x)＝3g (x) q (x)＋3r (x)，3f (x)＝g (x)．( 3q (x) )＋3r (x)，故錯誤。 (D) 承(C)，餘式為3r (x)，故錯誤。 (E) xf (x)＝xg (x)．q (x)＋xr (x)，xf (x)＝g (x)．( xq (x) )＋xr (x)， 因為xr (x) 之次數可能等於g (x)， 因此必須再除一次，所以商式未必為xq (x)，故錯誤。 故選(A)(B)。
