  explanation: 開口向下，y＝$ax^{2}$＋bx＋c，故a＜0， 頂點－$\frac{b}{2a}$＝$\frac{5+(-3)}{2}$ ⇒ b＝－2a，b＞0， 與y軸點 ( 0 , c )，c＞0， 又y＝0，兩相異實根 ⇒ $b^{2}$－4ac＞0， (A) 錯誤。 (B) 正確。 (C) 正確。 (D) f (－1 )＝a－b＋c＞0，故正確。 (E) f (1)＝a＋b＋c＞0，又b＞0，c＞0， 故a＋5b＋25c＝( a＋b＋c )＋4b＋24c＞0，故正確。 故選(B)(C)(D)(E)。
