  stem: 若多項式函數y＝( a＋2 ) $x^{4}$＋$bx^{3}$＋$cx^{2}$＋dx＋e的圖形向右平移2單位後，與y＝$x^{3}$－2x的圖形重合，則a－b＋c－d＋e的值為下列何者？
  options:
  - label: A
    content: －3
  - label: B
    content: －5
  - label: C
    content: －7
  - label: D
    content: －15
  - label: E
    content: －23
  explanation: 相當於y＝$x^{3}$－2x向左平移2單位， 得y＝( x＋2 )$^{3}$－2 ( x＋2 )＝$x^{3}$＋$6x^{2}$＋10x＋4， 比較係數 ⇒ $\begin{cases}a=-2 \\ b=1 \\ c=6 \\ d=10 \\ e=4\end{cases}$， 原式＝a－b＋c－d＋e＝－2－1＋6－10＋4＝－3， 故選(A)。
