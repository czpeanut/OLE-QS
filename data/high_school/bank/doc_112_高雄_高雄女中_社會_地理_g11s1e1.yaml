  stem: 文中提到東協以不干涉內政回應羅興亞議題，不僅如此，東協強調合作的基礎是確保民族利益優先的原則，保證成員國地位的絕對平等，因此東協採取共識決、不干涉內政等原則。請問下列有關「東協共識決」的敘述何者正確？
