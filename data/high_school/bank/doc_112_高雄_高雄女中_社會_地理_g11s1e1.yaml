  stem: 印度羽球選手辛度在 2021 年東奧羽球女子單打摘下銅牌，然而，印度人最關心的不是她的戰績和專業表現，而是她的出身、她的「種姓」。「辛度種姓」此一關鍵詞，近日在印度的搜尋量飆升，印度媒體《Scoop Whoop》以此為題感嘆：這就是 2021 年的印度嗎？（Newtalk 新聞）請問下列關於印度種姓制度的敘述，何者正確？
