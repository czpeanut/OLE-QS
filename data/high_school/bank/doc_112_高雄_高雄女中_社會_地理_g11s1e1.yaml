- id: doc_112_高雄_高雄女中_社會_地理_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 東南亞擁有豐富的農林礦資源，加上優越的地理位置，現在的首都前身多半是受殖民而興起的港埠型都市，如雅加達、馬尼拉，請問此現象反映出下列何種區域特色？
  options:
  - label: A
    content: 漁業興盛，人口多分布於沿海
  - label: B
    content: 初級原料物產地多位於沿海地區
  - label: C
    content: 資源豐富且穩定出口，不易受國際影響
  - label: D
    content: 出口導向為其經濟重心
  group_stem: '<u>第 1.、2. 題為題組</u>

    印尼國會於 2022／1／18 通過一項法案，將首都從雅加達遷至婆羅洲東加里曼丹省（East Kalimantan），而新首都將被命名為「努山塔拉」（Nusantara）。預計 2024 年開始分階段遷都，新首都位於婆羅洲東加里曼丹省兩縣境內，具有天災風險低、位處印尼群島中心等五大優勢，而舊都雅加達將持續發展經濟，成為區域及全球的商業中心（關鍵評論 The News Lens）。請問：'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)西方殖民國家殖民東南亞期間，為了能大量運輸當地農林礦原物料出口，積極建設沿海港口都市及連結內陸產地的交通路線。沿海港口因此成為貨物吞吐集散地，基礎建設發展快速外，出口貿易產業也帶動沿海都市工商業發展及大量就業機會，故使其成為當地現代化發展快速重心。殖民時期結束後，東南亞各國產業尚無法快速升級，且在全球分工影響下，東南亞各國仍以生產初級原料或勞力密集型產業加工為主。因此，出口貿易仍成為東南亞各國經濟重心，原本的港埠都市便仍維持其政經重心的地位。
  tags:
    unit:
      code: GE-3-1-2
      book: 地理3
