  - label: C
    content: 網友翻出辛度的父母為跨種姓婚姻，若按照種姓制度，結婚後兩人的種姓將以低種姓者為主，如：吠舍跨種姓與首陀羅結婚，兩人的種姓將一同變為首陀羅
  - label: D
    content: 種姓制度雖嚴格，但可透過後天的努力提升至高種姓
  explanation: (A)種姓制度僅有前 4 個階級，賤民甚至被視為比人更低下。(B)種姓制度使得印度人民難以團結抵抗外侮（參考資料 http://www.hindustanlaw.com/xw_view.asp?id=347）。(C)傳統上跨種姓結婚，兩人都會淪為賤民。(D)種姓制度是世襲的，要透過現世努力盡本分將業力消散，輪迴後才可能出身到高種姓。
