  stem: 新加坡屬於熱帶雨林氣候，終年高溫多雨，但統計顯示其冬季（11 月至隔年 1 月）降水量明顯多於夏季，造成此現象的原因與下列何者有關？
  options:
  - label: A
    content: 夏季時西南季風挾帶的水氣被蘇門答臘島地形阻擋
  - label: B
    content: 夏季時 I.T.C.Z. 南移，副熱帶高壓帶籠罩，影響降水
  - label: C
    content: 冬季 I.T.C.Z. 北移，對流作用興盛
  - label: D
    content: 冬季時此區依然炎熱，海面上易產生熱帶氣旋，帶來降水
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)新加坡位於赤道地區，隨著行星風系季移，夏季時因太陽直射北回歸線，間熱帶輻合區（又稱 I.T.C.Z.）北移，東南信風跨越赤道轉成西南風，但受蘇門答臘高山（火山島）阻擋海上水氣，夏季降水量較為稀少；冬季時則因 I.T.C.Z. 南移，東北信風直接影響新加坡，加上一年四季的高溫對流，使得新加坡每年 11 月到 1 月成為一年降水最為豐沛的區間。(D)新加坡地處赤道，科氏力弱而不易產生氣旋。
