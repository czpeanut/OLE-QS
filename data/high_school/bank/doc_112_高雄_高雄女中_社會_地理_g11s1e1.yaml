  stem: 印尼首都雅加達位處爪哇島，與即將遷都的婆羅洲島，其島嶼成因分別為何？
  options:
  - label: A
    content: 皆為沉水作用之大陸島
  - label: B
    content: 皆為板塊擠壓之火山島
  - label: C
    content: 爪哇島─大陸島、婆羅洲島─火山島
  - label: D
    content: 爪哇島─火山島、婆羅洲島─大陸島
  group_stem: '<u>第 1.、2. 題為題組</u>

    印尼國會於 2022／1／18 通過一項法案，將首都從雅加達遷至婆羅洲東加里曼丹省（East Kalimantan），而新首都將被命名為「努山塔拉」（Nusantara）。預計 2024 年開始分階段遷都，新首都位於婆羅洲東加里曼丹省兩縣境內，具有天災風險低、位處印尼群島中心等五大優勢，而舊都雅加達將持續發展經濟，成為區域及全球的商業中心（關鍵評論 The News Lens）。請問：'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 爪哇島位於印澳板塊與歐亞板塊交界，屬於火山島；婆羅洲島位於中南半島、馬來半島南下延伸的古老陸塊，因陸地下沉（沉水作用）與歐亞大陸分離，屬於大陸島。故選(D)。
