  stem: 印尼政府積極遷都的原因不外乎：首都雅加達人口過度集中，人民生活品質不佳；經濟發展過度集中，區域發展不均；氣候變遷導致雅加達被預估成為全世界下沉最快的城市。請問雅加達有大量人口聚集的原因為何？
  options:
  - label: A
    content: 地形破碎，平原狹小，沿海平原成為主要的人口聚集區
  - label: B
    content: 位處地勢低平的河口三角洲，有良好的條件，聚集大量人口
  - label: C
    content: 經濟發展快速，工作機會多，配合印尼政府政策而吸引大量外籍移工
  - label: D
    content: 除爪哇島外，其他境內主要島嶼多位於熱帶氣旋發生路徑，災害多，不宜人居
  group_stem: '<u>第 1.、2. 題為題組</u>

    印尼國會於 2022／1／18 通過一項法案，將首都從雅加達遷至婆羅洲東加里曼丹省（East Kalimantan），而新首都將被命名為「努山塔拉」（Nusantara）。預計 2024 年開始分階段遷都，新首都位於婆羅洲東加里曼丹省兩縣境內，具有天災風險低、位處印尼群島中心等五大優勢，而舊都雅加達將持續發展經濟，成為區域及全球的商業中心（關鍵評論 The News Lens）。請問：'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)印尼境內約有 17,000 多個島嶼，其面積與數量為世界之最，堪稱為世界第一的島嶼國家。其中首都雅加達位於爪哇島北部沿海地區。因受板塊擠壓影響，島上地形以高山（火山）、丘陵為主，北部沿海平原則成為較適宜農業與交通發展區域，促使雅加達成為爪哇島上人口聚集地。
