  stem: 文中提及的風暴，其氣壓梯度及風向模式最可能為右圖甲～丁何者？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: 「地中海颶風」（Medicanes）是具有熱帶氣旋性質的地中海風暴，每年生成次數不多但高溫與溼氣會使其威力增強。9 月初生成的丹尼爾風暴侵襲保加利亞、希臘與土耳其，造成嚴重災情，也導致利比亞的兩座大壩崩潰，洪水湧入城市德納，預計超過 2,300 人罹難。利比亞長期處於內戰之中，面對風災，該國的沿海地區毫無準備。德納市副市長馬德魯德承認，自 2002 年以來，大壩就沒有維護。請問：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 氣旋指的是低氣壓中心，氣流由外（高壓）向內（低壓）旋轉。北半球受科氏力向右影響，故發生在地中海的風暴，其氣壓梯度與風向模式為逆時針向內旋轉的氣旋，故選(A)甲。
