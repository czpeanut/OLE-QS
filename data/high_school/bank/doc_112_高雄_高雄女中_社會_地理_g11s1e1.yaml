  stem: 西方占星術最早起源於蘇美人、加爾底雅人等西亞古文明，他們利用觀察天體運動和相對位置來分析性格或對應人類生活走向。時至今日，十二星座、水星逆行等仍是人們茶餘飯後的熱門話題。西亞能夠成為占星術發源地的原因，和該地的何種自然條件較為相關？
  options:
  - label: A
    content: 水源充足土壤肥沃
  - label: B
    content: 副熱帶高氣壓籠罩
  - label: C
    content: 處板塊交界帶地震頻仍
  - label: D
    content: 作物生長季與雨季不符
  group_stem: '<u>第 1.、2. 題為題組</u>

    印尼國會於 2022／1／18 通過一項法案，將首都從雅加達遷至婆羅洲東加里曼丹省（East Kalimantan），而新首都將被命名為「努山塔拉」（Nusantara）。預計 2024 年開始分階段遷都，新首都位於婆羅洲東加里曼丹省兩縣境內，具有天災風險低、位處印尼群島中心等五大優勢，而舊都雅加達將持續發展經濟，成為區域及全球的商業中心（關鍵評論 The News Lens）。請問：'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 觀察天體運動需要長日數的晴朗天氣條件。(B)西亞地區位於北回歸線通過地區，屬於副熱帶高壓長年籠罩範圍。副熱帶高壓屬於氣流下沉區，不易形成對流雲系，降水機率及降水量稀少，為西亞地區帶來晴朗無雲的夜間觀星條件。
