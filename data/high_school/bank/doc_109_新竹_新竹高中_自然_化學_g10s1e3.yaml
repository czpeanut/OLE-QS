  stem: 許多家電用品中含有光觸媒及奈米銀等裝置，以達抗菌的目的。光觸媒殺菌原理是奈米尺寸二氧化鈦具有半導體的性質，以紫外線照射能激發電子從價帶躍遷至導帶，因而產生電子－電洞對。電洞會和二氧化鈦表面上的水分子反應生成氧化性很高的氫氧自由基，電子則會和氧分子結合形成超氧離子，活潑的氫氧自由基和超氧離子可以把有機物分解，變為二氧化碳和水，因而達到淨化效果；奈米銀的抗菌原理是奈米化的銀在潮溼環境中會釋放出帶正電的銀離子，當銀離子接觸到帶負電的細菌細胞後，會因為銀離子與其蛋白質上的硫醇基結合，刺穿細胞壁與細胞膜外表，進一步使細菌細胞因蛋白質變性，而無法呼吸、代謝和繁殖，直至死亡，達到滅菌效果。下列何者正確？
  options:
  - label: A
    content: 奈米銀可視為一種奈米光觸媒
  - label: B
    content: 修正液成分含有二氧化鈦，故其具有殺菌功效
  - label: C
    content: 配戴銀戒指無法達到抗菌的目的
  - label: D
    content: 光觸媒殺菌後質量減少，家電中的二氧化鈦需視使用頻率換新
  - label: E
    content: 光觸媒的殺菌過程屬於氧化還原反應
