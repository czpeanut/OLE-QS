  stem: 有關溶解度的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 攪拌無法增加固體對水的溶解度
  - label: B
    content: 定溫定壓下，某物質的飽和溶液之體積莫耳濃度為定值
  - label: C
    content: 氣體在水中的溶解度，均隨溫度升高而下降
  - label: D
    content: 氧氣在水中的溶解度隨其壓力增加而增加
  - label: E
    content: 已知硝酸鉀的溶解度隨溫度上升而增加，當其溶於水中時水溶液溫度會上升
