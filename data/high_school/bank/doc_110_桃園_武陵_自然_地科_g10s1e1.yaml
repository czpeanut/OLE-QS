  stem: 恆星表示近似黑體。依據黑體輻射，任何有溫度的物體都會自行放射各種不同波長的電磁波，其輻射強度與波長、表面溫度的關係如圖所示。波長400～700奈米屬於可見光，且表面溫度越高的物體，輻射強度最強波段的電磁波越趨近短波。根據以上敘述與右圖，判斷以下選項何者<u>錯誤</u>？
