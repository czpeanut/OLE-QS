- id: doc_110_桃園_武陵_自然_地科_g10s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 4
  stem: 聯合國大會宣布2015年為「國際光之年」，世界各國紛紛展開推廣活動，希望大眾了解「光科技」的重要性。想要了解光的特性，首先要認識電磁波光譜。電磁波可依其頻率的高低或波長的長短來劃分。將波長由長到短排列，則分別為無線電波、微波、紅外線、可見光、紫外線、X射線及伽瑪射線，而波長愈長的能量愈低。人眼可見到的只有可見光，其波長約介於380～750 nm。 高效率藍光發光二極體（LED）的發明，促使明亮省電的可見光光源得以實現，因而獲頒2014年物理諾貝爾獎。此外，由於雷射光是單一波長的光源，易聚光為極細且強的光束，因此雷射的發明對現代科技應用貢獻甚多。 演化使生物與光呈現多樣化的關係。動物以視覺感應光，偵測週遭環境，植物以生化反應從光中提取能量，但只有少數物種主動發光。會發光的生物體通常發冷光，此冷光不同於白熱光。螢火蟲是在陸地上發黃光的生物，雙鞭毛蟲（又稱甲藻）則在夜間發藍綠光，使海水閃放藍綠光。 天文觀測是以接收宇宙中天體所發出的光為主，科學家透過觀測恆星、星系所發出的光，得以研究恆星演化、宇宙起源等問題。光速雖然快，但在浩瀚的宇宙中，許多天體發出的光仍須傳遞很久才會抵達地球。 我們對宇宙中天體所發出的光了解愈多，愈能認識這些天體。下列有關天體所發出光線的敘述，何者正確？
  options:
  - label: A
    content: 當我們觀賞星空，看見仙女座M31，顯示M31現在的外貌
  - label: B
