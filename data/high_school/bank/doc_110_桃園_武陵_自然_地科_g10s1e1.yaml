  - label: C
    content: 恆星的顏色愈偏紅，表示其年齡愈老
  - label: D
    content: 恆星的溫度愈高，絕對星等愈大
  - label: E
    content: 依據天體看起來的明亮程度，就可以判斷天體距離地球的遠近
  answer:
  - B
