  group_stem: （1格2分，共4分）： 資料一：1660年，英國通過一項法案，要求某些殖民地生產的貨物，如菸草、棉花、染料、糖，只能輸往英國。法案並規定，美洲船隻自英國以外的歐洲國家駛返殖民地時，途中必須停靠英國港口，繳交貨物稅。 資料二：1763年的戰爭結束後，英法簽訂《巴黎條約》，法國割讓加拿大與其在俄亥俄的領地給英國，北美洲成為英國獨霸的局面，殖民地不再面臨外患，但這也使英國成為列強的眾矢之的，時時須戒備著其他殖民國家的報復。……這場戰爭英國雖然獲勝，但政府卻負債累累，因此對殖民地人民嚴加徵稅，並且相繼推行各種新稅，結果引起人民強烈的不滿。 資料三：1765年英國下令所有殖民地的印刷品，例如法律文件、商業契約、報章雜誌……等都要貼一分或五十元不等的印花稅，此舉引起人民強烈不滿。……波士頓律師奧堤斯高唱：『沒有徵詢人民意見的稅賦即是暴政。』此說甚得當地人心：罷市、罷工……等抗議活動風起雲湧。這些問題的發生成為美國獨立革命的導火線。
