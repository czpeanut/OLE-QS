  group_stem: 以下有關法國歷史的資料，請閱讀後回答第36.～40.題（1格2分，共10格，20分）。 1536年喀爾文移居日內瓦創立喀爾文派後，積極傳教，特別是他的母國法蘭西，至十六世紀中已有近十分之一的法國人改宗，多為城市中產階級與工人、小商人及部分農民、下層教士，這些法國的喀爾文派信徒被稱為胡格諾派（Huguenot）。1547-1559年法王亨利二世在位，因亨利為虔誠的天主教徒，皇室信仰天主教，他採取嚴厲態度下詔各地的官員對被教會判為異端的人進行懲罰，無須審查也不允許上訴。法國新舊兩派的對抗因此越演越烈。 亨利二世駕崩後，從法蘭西斯二世到查理九世期間（1560-1574），都由他們的母親──凱薩琳（Catherine de’Medici）太后掌權攝政。太后致力於調和宗教矛盾以鞏固政權。然而，宗教改革以來，新舊教衝突成為國際間的角力，動輒得咎；另一方面境內新舊教雙方的貴族卻藉戰爭擴大地方權力，弱化王室的權威，特別是篤信舊教的貴族──吉斯（Guise）家族的吉斯公爵，並同時兼任天主在法國的吉斯樞機主教，且長期掌控朝政。面對內外隱憂，凱薩琳太后既不讓胡格諾派信徒占上風，也不完全擊垮他們，以制衡吉斯家族的控制。查理九世在位期間，太后將長女伊莉莎白嫁給信仰舊教的西班牙國王腓力二世，第二個女兒瑪格麗特嫁給當時信仰胡格諾派的那瓦爾國王亨利．波旁；亨利．波旁的祖先為法王後代，因此當時他也具有法蘭西王位第三順序繼承人的資格。太后因而允許胡格諾派領袖德科利尼（Gaspard de Coligny）返回宮廷。後世學者認為可能在德科利尼的影響下查理九世顯出親政的意圖，太后因而密謀策劃暗殺德科利尼，引起一場大屠殺。 屠殺發生於法王查理九世的妹妹瑪格麗特與亨利．波旁婚禮五天後，即1572年8月24日晚間，耶穌十二使徒「聖巴托羅繆」（Saint-Barthelemy）紀念日前夜。法王在太后影響下甚至親自下詔全數殺害新教徒及其領袖（包括德科利尼）。隨後，對於胡格諾派的屠殺更擴散至巴黎市郊及附近城鎮，持續數週之久。估計死亡數目約從一萬人至七萬人之間。這場大屠殺也標誌著法國宗教戰爭的轉捩點。胡格諾派的政治勢力因為損失大量遺族領袖躑躅不前，並且導致許多原先的新教溫和派因仇恨而漸趨激進化，從而引爆法國國內的第四次宗教戰爭。史家稱為聖巴托羅繆節大屠殺（Massacre de la Saint-Barthelemy）。 查理九世逝世後，凱撒琳太后第三個兒子安茹公爵繼位為法王亨利三世。亨利三世修正亨利二世的宗教政策，在位期間（1574-1589）溫和寬容對待國內胡格諾派信徒。1585-1589年發生了「三亨利戰爭」。極端舊教領袖的吉斯公爵亨利，不滿亨利三世的政策，與西班牙結盟，領導天主教派神聖聯盟入侵巴黎，藉口掃除胡格諾派，威脅王權，迫使亨利三世接受聯盟強加的條款（如讓信仰天主教的人選為王位繼承人、赦免吉斯公爵並任命其為王國元帥等）。亨利三世最終忍無可忍，於1588年冬派人暗殺了入侵巴黎的吉斯公爵亨利。由於吉斯家族在政治上仍有不小的影響力，馬耶那公爵──夏爾．吉斯繼任為新的領導人與王國大統帥，並在巴黎議會的支持下，廢黜國王亨利三世，擁立另一位信仰天主教的傀儡國王繼位為「查理十世」。逃亡的亨利三世與納瓦爾國王亨利．波旁聯合，一同進攻巴黎討伐吉斯家族及其政治集團。戲劇性的轉折在1589年8月，亨利三世屯兵巴黎西南郊時被吉斯家族的刺客刺殺身亡。臨死時，亨利三世指定把王位傳給納瓦爾的亨利．波旁，即日後的法王亨利四世，波旁王朝於焉誕生。亨利四世即位後，於1593年改信天主教，1589年頒佈《南特詔令》以保障法國新教徒信仰及從政的自由，有的史家因而稱亨利四世為「好國王」。 從1560-1589年期間，上述的這些狀況，對當時的法國造成了嚴重的破壞。據估計當時約三百萬民眾死於戰亂及戰爭帶來的饑荒和瘟疫，有學者認為僅次於造成八百萬人喪生的三十年戰爭。
