questions:
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2022 年 10 月中國人民代表大會召開之前，在北京有人掛起了布條寫著：「不要核酸要吃飯，不要文革要改革。不要封城要自由，不要領袖要選票，不要謊言要尊嚴，不做奴才做公民。」請問「不要領袖要選票」的呼籲，是期待執政者可以落實下列哪一個符合「憲政主義」的原則？
  options:
  - label: A
    content: 人民主權原則
  - label: B
    content: 法治國原則
  - label: C
    content: 權力分立原則
  - label: D
    content: 違憲審查原則
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「不要領袖要選票」意味著人民希望能獲得參政選舉的權利，以定期改選的制度落實民主精神，故選(A)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 責任政治是民主政治的基本原則之一，尤其常被用於檢驗行政權擁有者的作為。責任政治的內涵分為政治責任和法律責任，且兩者在民主政治中的意義並不相同。關於責任政治的敘述，下列何者正確？
  options:
  - label: A
    content: 行政院院長因多項政策不受民眾支持，導致民調滿意度低落而辭職下臺，是為了負起法律責任
  - label: B
    content: 當行政官員有違法濫權之情事，監察院的彈劾能使其承擔政治責任
  - label: C
    content: 行政首長表現不佳，人民在下次選舉可以用選票使其承擔政治責任
  - label: D
    content: 在政府中，沒有決策權的事務官必須承擔政治責任
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 責任政治包括政治責任、法律責任。前者雖未違法但政策失敗，則須負起政治責任，甚至辭職下臺。後者則是施政違法則必須接受法律的制裁，負起在法律上應負之責任。(A)應為政治責任。(B)行政官員違法之情事，受彈劾後主要承擔法律責任。(D)應為政務官承擔政治責任。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「有限政府」是民主國家憲政主義的意涵中，最核心的概念之一；而「有限政府」也可以就「政府角色的演進」來分析，是政府角色演進過程中的一個重要階段。下列對「有限政府」的敘述，請選出正確的：(甲)就「憲政主義」的觀點而言，有限政府主張節制政府的權力，防止統治者專制，使政府職能、權力與運作方式皆受到憲法及法律的限制；(乙)就「憲政主義」的觀點而言，有限政府主張將國家公權力分散於不同的機關中，使分立機關產生制衡作用，以防止政府因權力過度集中而不當侵害人權；(丙)就「政府角色的演進」而言，行政部門的工作與人民生活息息相關，因此政府的資源以行政部門為優先，無形中便限制其他政府部門的發展；(丁)就「政府角色的演進」而言，有限政府是指「管得愈少的政府愈優秀」，政府存在的目的在於做好：保衛國家安全、維護社會秩序等基本工作；(戊)不論是從「憲政主義」的觀點，或是站在「政府角色的演進」的立場來看，皆與保障人權的核心觀念息息相關。
  options:
  - label: A
    content: (甲)(乙)(丙)(丁)
  - label: B
    content: (甲)(乙)(丁)(戊)
  - label: C
    content: (甲)(丙)(丁)(戊)
  - label: D
    content: (乙)(丙)(丁)(戊)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 有限政府又稱為「小政府」，指統治最少的政府就是最好的政府。政府權力受到約束，不得干涉人民未授權之事項。(丙)雖然行政部門因與人民密切相關，但各部門之間的職權有所區分，各自負責職權範圍，不會因行政部門而受到限制。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 高雄與彰化地院法官及五名累犯受刑人認為《刑法》第 47 條規定 5 年內再犯有期徒刑的累犯者，應加重本刑至 1∕2，恐違《憲法》的罪刑相當（比例）、平等、法律明確性等原則，因而聲請大法官釋憲。大法官對此做出第 775 號解釋，宣告法令部分違憲，並限相關機關 2 年內修法，期間法官審案時應依本解釋作成判決。根據上文分析政府權力的運作，下列敘述何者正確？
  options:
  - label: A
    content: 中央對地方的制衡
  - label: B
    content: 司法對立法的制衡
  - label: C
    content: 行政對立法的制衡
  - label: D
    content: 司法對行政的制衡
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)題文中可得知，《刑法》中對於累犯的刑責違反比例原則，故大法官作出違憲解釋，並訂出兩年期限修法，此為司法與立法權的制衡關係。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 2005 年德國大選結果，基督教聯盟得票率為 35.2 ％，獲得 225 個國會席次，社民黨 34.3 ％，獲得 222 席，兩黨皆未過半，無法單獨組閣。後來，兩黨達成協定，在新內閣中各擁有 8 個席位，平分秋色。類似此種憲政運作方式，一般稱為
  options:
  - label: A
    content: 兩黨制
  - label: B
    content: 內閣制
  - label: C
    content: 雙首長制
  - label: D
    content: 聯合政府制
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 憲政運作制度中，最常用以分類的為內閣制、總統制與雙首長制，從題文中可得知，內閣由國會中籌組，也因無單一政黨獨立過半，因而組合聯合政府。(A)此為政黨的類型。(D)並無此政體。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 請判斷下列敘述何者屬於「內閣制」的特徵？
  options:
  - label: A
    content: 國家元首統而不治，具有維繫國家的作用
  - label: B
    content: 人民直接選出國家元首，賦予民意基礎，讓國家元首擁有較大的決策空間
  - label: C
    content: 對內閣而言，國會是制衡機構，能夠避免權力濫用
  - label: D
    content: 最高行政首長具有固定任期，擁有解散國會與覆議之權限
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)內閣制的元首可能世襲或是民選，但主要居於虛位元首地位，統而不治。(C)對內閣而言，行政與立法權為聯立，相互制衡為總統制中的設計。(D)內閣制中，最高首長的任期並無固定保障。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 下列對於內閣制國家元首的敘述，請選出<u>錯誤</u>的
  options:
  - label: A
    content: 內閣制的國家元首是虛位元首，扮演「統而不治」的角色
  - label: B
    content: 內閣制的國家元首雖然是虛位元首，但是如：公布法令、任命首相等重要工作，只能由國家元首來做
  - label: C
    content: 內閣制的國家元首也可以是部分實權的元首，和內閣首相分享部分的行政決策權
  - label: D
    content: 內閣制的國家元首可以「選舉」方式產生，如德國、義大利
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)選項的描述應為雙首長制。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 在內閣制的國家，當國會針對內閣的某項政策質疑，進而提出「不信任案」，並經國會議員決議通過，此時，內閣可以選擇「解散國會」。請問內閣解散國會最重要的政治意義為何？
  options:
  - label: A
    content: 將有爭議的政策交給人民決定
  - label: B
    content: 利用解散國會來懲罰反對黨在國會中的不當言論
  - label: C
    content: 利用解散國會、重新選舉國會議員，來懲罰跑票的執政黨國會議員
  - label: D
    content: 利用重新選舉國會議員的方式來增強執政黨的實力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文中敘及，當國會針對內閣的政策產生質疑，進而提出不信任案後，一旦不信任案成立、解散國會後，國會大選也是檢視選民對於政策的贊成與否進行選擇。若是支持該政策，則支持政策的政黨或國會議員則會較多人當選。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 英國內閣的提案，皆須獲得英國國會的同意，表現出國會至上原則，最主要的原因是
  options:
  - label: A
    content: 國會議員由人民選出，代表全國人民，國會同意即全國人民同意
  - label: B
    content: 內閣成員皆來自於國會，故內閣的所有作為，皆應得國會同意
  - label: C
    content: 英國的內閣制採取三權分立並互相制衡的原則，故內閣的提案，皆須獲得英國國會的同意
  - label: D
    content: 英國的內閣制，行政立法兩權融合於國會，所以內閣的提案，皆須獲得國會的同意
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 內閣制中，內閣須對國會負責，國會則會運用質詢、預算審查、法案審議等方式來監督內閣，故選(D)。(A)雖然國會議員由人民選出可代表人民心聲，但國會通過的議案不代表全國人民同意。(B)內閣成員由國會議員兼任。(C)此為總統制特色。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 2019 年時任英國首相強生在「英國該如何脫歐」這項議題上，未能與國會取得共識，因此憤而提前解散國會，隨後舉行了四年來英國的第三場國會大選，最終結果由強生領導的保守黨拿下 365 席，比上次大選多出 48 席，且取得席次過半的執政優勢，使他有望在數週內實現脫歐。請問強生解散國會，進行國會改選的最主要目的為何？
  options:
  - label: A
    content: 爭取選民對脫歐政策的支持
  - label: B
    content: 掃除在野黨在政壇的影響力
  - label: C
    content: 改善國會中一黨獨大的弊端
  - label: D
    content: 承擔責任政治中的法律責任
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 強生因提出「英國該如何脫歐」的議題未受到國會的支持，因此將此議題交付給全民決定而解散國會，大選結果，強生所屬的保守黨大勝，有助於強生對於脫歐議題的決策，故選(A)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 下列對美國總統制的敘述，請選出正確的
  options:
  - label: A
    content: 現任總統拜登，是美國經由人民直接選舉產生的民主黨籍總統
  - label: B
    content: 布林肯是美國現任的國務卿，美國國務卿的地位相當於內閣制中的內閣首相
  - label: C
    content: 拜登提名布林肯為國務卿，須經參議院同意後，再任命之
  - label: D
    content: 拜登公布法令，必要時得經國務卿的副署
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)美國總統應為間接選舉產生。(B)美國國務卿的地位類似於外交部部長。(D)副署制度存在於內閣制中。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 美國總統行使覆議否決權將法案退回國會，若國會以 2∕3 多數維持原法案，美國總統可以如何處理？
  options:
  - label: A
    content: 宣布解散國會
  - label: B
    content: 再次行使否決權
  - label: C
    content: 無條件接受並公布
  - label: D
    content: 宣布內閣總辭
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 美國總統制的制度設計中，行政與立法兩權分立且制衡，當國會通過的法案，行政部門認為窒礙難行時，總統可行使否決權。可能產生兩種結果，第一、國會再次以 2∕3 的絕對多數通過，則總統只能接受並公布。第二、國會未能再此通過，則該法案遭到否決。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 美國的總統制有一缺點：當總統與國會針對同一件事情意見相左，雙方又各自堅持己見時，僵局會持續下去無法獲得解決。這是因為
  options:
  - label: A
    content: 各部會首長不能由國會議員兼任
  - label: B
    content: 總統和各部會首長不對國會負責，不須出席國會接受國會議員的質詢
  - label: C
    content: 國會不能對總統提不信任案，總統不能解散國會
  - label: D
    content: 美國的總統制規定，當總統與國會有意見間相左時，由聯邦最高法院首席法官出面協調之
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 美國的體制為總統制，歷史上也發生過多次總統與國會意見相左、僵持不下呈現僵局的局面。主因為，總統制的制度中並無可對行政首長提出不信任案、解散國會等的設計，因此造就陷入僵持的狀況，故選(C)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 在美國的總統制，下列有關其立法權與行政權制衡關係之敘述，何者「不正確」？
  options:
  - label: A
    content: 總統得運用咨文權來影響民意，使國會讓步
  - label: B
    content: 總統可以運用覆議否決權來反制國會所通過的法案
  - label: C
    content: 國會可以透過法案議決和預算審核來牽制總統
  - label: D
    content: 國會可對總統進行不信任投票，予以罷免或解職
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)此為內閣制的設計。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 在美國的總統制中，司法對行政、立法的制衡是表現在
  options:
  - label: A
    content: 法院可以對貪汙、受賄的國會議員及政府官員定罪、判刑，使其接受應得之懲罰
  - label: B
    content: 美國總統、國會議長就職宣誓時，皆由美國的聯邦最高法院法官監誓
  - label: C
    content: 法院可以對不適任的國會議員、政府官員提出彈劾案，使其去職
  - label: D
    content: 司法違憲審查制度
  answer:
