  section: 1
  number: 4
  type: single
  page: 2
  stem: 將各為 1.0 莫耳的 Ba(OH)$_{2}$、NaOH、$BaSO_{4}$ 及 $Na_{2}SO_{4}$ 固體，分別置入 1.0 升的水中。試問哪一個溶液之蒸氣壓最高？
  options:
  - label: A
    content: Ba(OH)$_{2}$
  - label: B
    content: NaOH
  - label: C
    content: $BaSO_{4}$
  - label: D
    content: $Na_{2}SO_{4}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 若強電解質完全解離，則 Ba(OH)$_{2}$：i＝3、NaOH：i＝2、$Na_{2}SO_{4}$：i＝3，但 $BaSO_{4}$ 難溶於水，故蒸氣壓下降量最少，蒸氣壓最高。
