- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 假設苯和甲苯互溶形成理想溶液，在 25 ℃ 時，苯的飽和蒸氣壓為 96 mmHg，甲苯的飽和蒸氣壓為 30 mmHg。若取 1 莫耳的苯與 2 莫耳的甲苯混合，下列敘述何者正確？
  options:
  - label: A
    content: 苯之正常沸點較甲苯高
  - label: B
    content: 此溶液的飽和蒸氣壓為 42 mmHg
  - label: C
    content: 蒸氣中甲苯分壓為 20 mmHg
  - label: D
    content: 溶液中苯和甲苯之分子間沒有作用力
  - label: E
    content: 該溶液為理想溶液，故液面上蒸氣相中苯的莫耳分率與溶液中相同
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)甲苯沸點較高。(B)利用拉午耳定律 $P_{液}$＝$P_{A}^{°}X_{A}$＋$P_{B}^{°}X_{B}$＝96×$\frac{1}{3}$＋30×$\frac{2}{3}$＝52（mmHg）。(D)溶液中苯和甲苯之分子間仍然有作用力。(E)液面上蒸氣相中苯的莫耳分率應大於溶液中苯的莫耳分率。
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 附圖為在 25 ℃ 時，A 與 B 混合時所成之理想溶液的蒸氣壓，$X_{A}$、$X_{B}$ 表混合液中 A、B 之莫耳分率。當 $X_{A}$＝0.4 之溶液，其蒸氣壓為多少 mmHg？
  options:
  - label: A
    content: '100'
  - label: B
    content: '110'
