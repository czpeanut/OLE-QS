  stem: 二揮發性液體甲和乙混合可形成理想溶液，且液面上的蒸氣為理想氣體。若 50 ℃ 時，測得該溶液的蒸氣壓為 400 mmHg，而在蒸氣中甲的莫耳分率為 0.25，在溶液中甲的莫耳分率為 0.40，則在 50 ℃ 狀態下，下列敘述何者正確？
  options:
  - label: A
    content: 純甲的蒸氣壓為 100 mmHg
  - label: B
    content: 純甲的蒸氣壓為 250 mmHg
  - label: C
    content: 純乙的蒸氣壓為 300 mmHg
  - label: D
    content: 純乙的蒸氣壓為 400 mmHg
  - label: E
    content: 蒸氣中甲的蒸氣壓為 300 mmHg
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(B)(E)蒸氣相中甲蒸氣的分壓＝純甲蒸氣壓×液相中甲的莫耳分率（拉午耳定律）＝溶液的蒸氣總壓×蒸氣相中甲的莫耳分率（道耳頓分壓定律）

    ∴$P_{甲}$＝400×0.25＝100＝$P_{甲}^{°}$×0.4，解得 $P_{甲}^{°}$＝250 mmHg。

    (C)(D) $P_{乙}$＝$P_{s}$－$P_{甲}$＝400－100＝300（mmHg）；300＝$P_{乙}^{°}$×（1－0.4） ∴$P_{乙}^{°}$＝500 mmHg'
