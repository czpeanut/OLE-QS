  answer_source: answer_key
  explanation: 由題圖可知，$P_{A}^{°}$＝150 mmHg；$P_{B}^{°}$＝100 mmHg；當 $X_{A}$＝0.4，$X_{B}$＝1－$X_{A}$＝0.6，由拉午耳定律 P＝$P_{A}$＋$P_{B}$＝$P_{A}^{°}X_{A}$＋$P_{B}^{°}X_{B}$，代入 P＝0.4×150＋0.6×100＝120（mmHg）。
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 溶解 1.00 克葡萄糖於 100 克水所形成溶液的凝固點為－0.103 ℃，若在此溶液中再加入葡萄糖 2.00 克所形成溶液的凝固點為多少 ℃？
  options:
  - label: A
    content: 0.309 ℃
  - label: B
    content: －0.0520 ℃
  - label: C
    content: －0.206 ℃
  - label: D
    content: －0.309 ℃
  - label: E
    content: －0.412 ℃
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 溶解的葡萄糖由 1.00 克變為 3.00 克，凝固點下降量變為 3 倍，即 0.103×3.00＝0.309（℃），故凝固點為－0.309 ℃。
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 水溶液含 $Ag^{＋}$、$Mg^{2＋}$、$Ba^{2＋}$ 及 $Ni^{2＋}$ 四種陽離子各 0.01 M。若以 NaOH、NaCl、$Na_{2}SO_{4}$ 及 $Na_{2}$S 溶液作為試劑使之分離，則下列滴加四種試劑的先後順序中，哪一項可達到分離的目的？
  options:
  - label: A
    content: NaOH；NaCl；$Na_{2}SO_{4}$；$Na_{2}$S
  - label: B
    content: $Na_{2}$S；NaOH；NaCl；$Na_{2}SO_{4}$
  - label: C
    content: $Na_{2}SO_{4}$；$Na_{2}$S；NaOH；NaCl
  - label: D
    content: NaCl；$Na_{2}SO_{4}$；NaOH；$Na_{2}$S
  - label: E
    content: NaCl；$Na_{2}SO_{4}$；$Na_{2}$S；NaOH
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 水溶液含 $Ag^{＋}$、$Mg^{2＋}$、$Ba^{2＋}$ 及 $Ni^{2＋}$ 四種陽離子先後順序加 NaCl、$Na_{2}SO_{4}$、$Na_{2}$S、NaOH，一次只有一種沉澱物，依序產生沉澱物 AgCl、$BaSO_{4}$、NiS、Mg(OH)$_{2}$ 而可達到分離的目的。
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 有 1.0 升水溶液中含 5.0 克的血紅素，27 ℃ 時之滲透壓為 1.80×$10^{－3}$ atm，則血紅素的平均分子量約為多少？
  options:
  - label: A
    content: '25000'
  - label: B
    content: '28000'
  - label: C
    content: '43000'
  - label: D
    content: '56000'
  - label: E
    content: '68000'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 有 1.0 升水溶液中含 5.0 克的血紅素，27 ℃ 時之滲透壓為 1.80×$10^{－3}$ atm，由 πV＝$\frac{W}{M}$RT，1.80×$10^{－3}$×1.0＝$\frac{5.0}{M}$×0.082×（273＋27），解 M≒68000。
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 已知在常溫常壓下，每升水可溶解純氧 a 克，及純氮 b 克，試問若是 1 atm 下的空氣與水長期接觸，每升水中可溶解空氣多少克？
  options:
  - label: A
    content: a＋b
  - label: B
    content: 0.2a＋0.8b
  - label: C
    content: 0.8a＋0.2b
  - label: D
    content: 0.1a＋0.1b
  - label: E
    content: 0.9a＋0.9b
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 在 1 atm 空氣中含有 0.2 atm 氧氣與 0.8 atm 氮氣，因此可溶解 0.2a＋0.8b。
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 已知在 50 ℃ 時，純 A、B 的飽和蒸氣壓分別為 680、1000 mmHg，若利用此兩液體組成的理想溶液，其正常沸點恰好為 50 ℃，求 50 ℃ 時此理想溶液之 B 的莫耳分率為何？
  options:
  - label: A
    content: '0.4'
  - label: B
    content: '0.25'
  - label: C
    content: '0.6'
  - label: D
    content: '0.5'
  - label: E
    content: '0.75'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '正常沸點恰好為 50 ℃，意即 50 ℃ 其液體飽和蒸氣壓恰好為 1 atm＝760 mmHg。

    根據拉午耳定律：P＝$P_{A}^{°}X_{A}$＋$P_{B}^{°}X_{B}$

    760＝680×$X_{A}$＋1000×$X_{B}$＝680×（1－$X_{B}$）＋$1000X_{B}$，$X_{B}$＝0.25。'
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 海水淡化的其中一種方法，即是利用海水凝固時析出的冰不含溶質。現有一杯 0.15 mol 葡萄糖溶於 1 公斤水中，於－0.279 ℃ 開始凝固，進行凝固 15 分鐘後，凝固點下降至－0.372 ℃，請問此時共析出多少克的冰？
  options:
  - label: A
    content: '100'
  - label: B
    content: '150'
  - label: C
    content: '200'
  - label: D
    content: '250'
  - label: E
    content: '300'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '凝固點下降度數與定量溶劑中溶質的數目（莫耳數）相關，根據題意 0.279：0.372＝

    $\frac{0.15莫耳}{1公斤}$：$\frac{0.15莫耳}{X公斤}$，X＝0.75（公斤）。故析出的冰為 1－0.75＝0.25（公斤）＝250 克。'
- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 人體血液之平均滲透壓為 7.7 atm，在 37 ℃ 的血液中，若只注射生理食鹽水溶液，應選用下列何種濃度的生理食鹽水溶液？
  options:
  - label: A
    content: 0.10 M
  - label: B
