- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 2
  stem: 附圖中之粗黑曲線代表空氣中所含水氣的飽和曲線，試問圖中甲點空氣的相對溼度較接近下列哪一百分比？
  options:
  - label: A
    content: 10％
  - label: B
    content: 20％
  - label: C
    content: 30％
  - label: D
    content: 40％
  - label: E
    content: 50％
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e3/s1_3_f1.png
    crop:
      page: 2
      rect:
      - 201.7
      - 85.4
      - 416.4
      - 205.05
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 甲點為 40 ℃，飽和水蒸氣量為 50 克∕立方公尺，而甲點之水氣含量約為 10 克∕立方公尺，故相對溼度為$\frac{10}{50}$×100％＝20％。
