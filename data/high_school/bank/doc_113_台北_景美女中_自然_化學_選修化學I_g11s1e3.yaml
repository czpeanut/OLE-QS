  answer_status: verified
  answer_source: answer_key
  explanation: '(A)因為苯（$C_{6}H_{6}$）的分子量較甲苯（$C_{7}H_{8}$）小，故苯分子間引力較甲苯為小，即苯的沸點較低，蒸氣壓較大，故 b＜a。

    (B) P＝$P_{1}^{°}X_{1}$＋$P_{2}^{°}X_{2}$＝0.5a＋0.5b＝$\frac{a+b}{2}$

    (C)理想溶液混合前、後熱量沒有變化，ΔH＝0

    (D)苯和甲苯分子間的作用力與苯或甲苯單獨存在的作用力相同，並非沒有作用力。

    (E)理想溶液混合前、後體積沒有變化。'
