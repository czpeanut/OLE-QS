  answer_source: answer_key
  explanation: '題幹中提及該衛星的解析度為 1.5 公尺，故一個網格的面積為 2.25 平方公尺。(C)耕地旁的農民在影像中的面積遠小於 2.25 平方公尺，因此無法被清楚地呈現出來。

    27.4,900×2.25 平方公尺＝11,025 平方公尺，故選(D)。

    28.(A)由圖②可見上盤相對往下，下盤相對往上，為正斷層，並且在中央形成地塹。

    29.(A)斷層線為線資料，適合以精密的向量模式建立斷層線分布圖。而斷層的名稱、長度等文字、數字屬於屬性資料，必須再建立屬性資料表來連接空間資料。

    30.以山仔腳斷層 2 公里劃設特定範圍屬於(B)環域分析。

    31.文中提及「曾經有海水倒灌的大湖」，因此若工地裡的岩層出現(D)適合半鹹水環境的大型貝類化石，則可證明這裡曾被海水覆蓋。

    32.圖中甲的下方有和平島（位於基隆），可知(A)甲為基隆。

    33.由圖中大屯山、基隆在圖的下方，可知(D)下方為北方。

    34.由文中底線處提及「青埔人討論公共議題的重要平臺」可知為(A)公眾參與的概念。

    35.(A)為西拉雅族的文化特色。(B)為澎湖的地景。(C)為阿里山的地景。

    36.「適地性服務」，指以使用者所在位置為基礎進行空間分析，提供使用者相關的商業服務，故提供消費者位置附近的餐廳屬之。

