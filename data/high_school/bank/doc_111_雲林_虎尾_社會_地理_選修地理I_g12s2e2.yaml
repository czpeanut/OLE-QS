  group_stem: 開放街圖人道救援小組（HOT）繪製重大災區的大比例尺圖時，經常使用衛星影像作為基礎資料。而衛星影像解析度的定義是指衛星影像的像素對應到地表的正方形範圍的「邊長」，如衛星影像解析度為 1.5 公尺。請問：
