  type: single
  page: 1
  stem: 地圖在概括化的影響下，其圖資內容通常具有下列哪項特性？
  options:
  - label: A
    content: 地圖上未標示，即代表該地不存在此地理現象
  - label: B
    content: 部分資料的呈現會被犧牲，但能讓地圖更加便於閱讀
  - label: C
    content: 不同等級的交通要道，皆以同樣粗細的線條標示
  - label: D
    content: 等高線屬於重要地形的標示，因此不會納入概括化的過程
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 概括化指繪製地圖時針對地表現象進行取捨的過程，故選(B)。(A)位在地圖上顯示的資料可能是被省略而非不存在。(C)不同等級的交通要道通常會用不同粗細來表達其重要性。(D)在小比例尺地圖中等高線的間距會較大，藉此簡化、概括此處的地勢變化。
