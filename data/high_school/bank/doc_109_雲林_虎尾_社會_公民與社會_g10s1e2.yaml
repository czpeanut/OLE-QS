  - label: D
    content: 否，應選擇侵害更低的手段達到空汙防制
  group_stem: ◎ 根據學術界研究分析，造成空氣汙染的PM2.5由「人為活動產生」就佔了95%，其中前三大的排放來源，分別是大型汙染源（火力發電廠、燃燒汽柴油的工廠），柴油車輛的排氣與汽機車活動，燃燒枝、稻草、金紙及廢棄物。政府除加強宣導「消滅PM2.5」活動，更要求環保單位人員加強查緝汙染源，以維護民眾健康。 此外，日前立法院初審通過《空氣污染防制法》修正草案，其中讓環保署可加嚴老舊車輛排氣標準及授權縣市政府可劃設空氣品質維護區禁止老舊車輛通行等相關條文，引起二行程車主不滿，號召數千輛機車在凱道抗議、舉行「全國二行程、凱道大會師」大型車聚。環保署指出，移動源汙染物（汽機車等）的排放位置與高度，往往就在民眾日常活動範圍，若排放相同量的汙染物，移動源排出的汙染物對民眾呼吸濃度貢獻及對人體健康影響其實往往都高於多數固宇汙染源（工廠等）。
