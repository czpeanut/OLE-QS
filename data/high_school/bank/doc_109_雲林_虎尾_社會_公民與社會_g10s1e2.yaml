  stem: 題幹中敘述「行政法」並未加上書名號《 》，但是在提到《民法》、《刑法》時，則有書名號的符號。請問，為何「行政法」法規範不加書名號？
  options:
  - label: A
    content: 因為行政法只是命令而非法律
  - label: B
    content: 因為行政法的法律並非立法院三讀通過
  - label: C
    content: 因為行政法不是保障人民權利為中心的法律
  - label: D
    content: 因為行政法並非單一的法律名稱
  group_stem: ◎ 生活在現代法治社會的人們，日常生活中主畏受到行政法與《民法》的保障與約束。前者規範國家（特別是行政機關）對人民的管理與照顧的依據；後者則是規範人民之間權利與義務。由此可知，行政法與《民法》與人民日常生活息息相關。譬如一個新生命的誕生，須依照行政法規定辦理出生登記。但新生兒的姓氏是隨父還是隨母、該如何命名，則必須符合《民法》的相關規定；當一個人終老離世時，死亡登記須依行政法辦理。遺產的分配歸屬則依《民法》規定。
