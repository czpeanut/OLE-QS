  group_stem: ◎ 2019是六四天安門事件30週年，英國推出影集「中美共同體」（Chimerica），重現天安門廣場著名的「場克人」畫面，出身臺灣的旅英演員于懷傑參與演出。Chimerica取自China和America的合體字，改編自英國劇作家寇克伍德（Lucy Kirkwood）2013年創作的舞臺刻，影集片頭強調「改編自真實事件」，片中穿插當年真實的新聞報導與紀錄畫面。故事描述的主角是美國攝影記者伯杰（Lee Berger），1989年他在北京目睹抗議民眾遭到軍方開槍鎮壓，也捕捉到最為廣泛流傳的「坦克人」（Tank Man）照片。 于懷傑透露，其實刻組裡有1名幕後剪輯師自中國，<u>雖然已經在英國落地生根，但還是害怕會對家人帶來負面影響，因此以假名參與此劇</u>。據他了解，「中美共同體」舞臺劇過去曾想在香港演出，但後來不了了之，亞洲地區目前只有日本曾經上演。（節選自央廣〈英劇重現天安門事件 臺灣演員于懷傑參演〉）
