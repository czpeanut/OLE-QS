  group_stem: ◎ 2020年6月30日，中國人大常委會全體通過《中華人民共和國香港特別行政區維護國家安全法》（簡稱香港《國安法》）條文。該法案從生成到生效共花費41天，制訂的過程完全不公開，條文細節則在最後一天的最後一小時公布，隨後正式生效。 學者視《國安法》為中國針對反送中運動的具體反制，法條擴大中央、港府與港警權力，新增4項罪行：「分裂國家罪」、「顛覆政權罪」、「恐怖活動罪」以及「勾結外國或境外勢力危害國家安全罪」，過去一年反送中運動常見的口號「光復香港，時代革命」，或揮舞旗幟，都構成「顛覆政權罪」，最高可判終身監禁，以限制人民表現自由。且該法案讓中國得以行政指揮司法，國安公署有執行司法權，並允許祕密、送中審判，其影響範圍遍及全球，被視為香港一國兩制的終結。
