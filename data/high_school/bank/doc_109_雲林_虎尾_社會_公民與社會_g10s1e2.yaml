  stem: 《司法院釋字第400號解釋理由書》中指出：「《憲法》第15條關於人民財產權應予保障之規定，旨在確保個人依財產之存續狀態行使其自由使用、收益及處分之權能，<u>並免於遭受公權力或第三人之侵害</u>，俾能實現個人自由、發展人格及維護尊嚴。」劃線部分要求國家提供的協助，與下列何者相同？
