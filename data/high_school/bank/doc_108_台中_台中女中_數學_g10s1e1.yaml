  stem: 物理學家費曼先生提過一則有趣的故事：「給你一顆橘子及一把刀，將橘子切成薄片，有辦法讓薄片薄到足以蓋著整個地球表面嗎？」費曼利用這道問題來檢驗學生是數學思考還是物理考量。假設在數學思考的前提下，想用一片面積為30平方公分的正方形橘子皮蓋住整個地球表面，做法如下：先將橘子皮切成原來厚度一半的2片薄片，此為第一步；再將這2片薄片都切成原來厚度一半的2片，得到4片薄片，此為第二步；再將這4片都切成原來厚度一半的2片更薄的薄片，得到8片薄片，此為第三步；依此類推。已知地球表面積約為5.1×$10^{7}$平方公里，則至少應進行＿＿＿＿步操作，才可使這些薄片能蓋滿整個地球表面。 （參考數據：$2^{20}$ ≈ 1.05×$10^{6}$，$2^{30}$ ≈ 1.07×$10^{9}$，$2^{40}$ ≈ 1.10×$10^{12}$，$2^{50}$ ≈ 1.13×$10^{15}$）
  answer:
  - '54'
  answer_status: verified
  answer_source: answer_key
