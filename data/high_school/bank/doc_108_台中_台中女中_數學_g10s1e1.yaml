  stem: 設a、b、c都為實數，則下列各敘述哪些是正確的？
  options:
  - label: A
    content: 若$a^{7}$為有理數且$a^{9}$為有理數，則a必為有理數
  - label: B
    content: 若$a^{2}$＋$b^{2}$、$b^{2}$＋$c^{2}$、$c^{2}$＋$a^{2}$都為有理數，則a、b、c都為有理數
  - label: C
    content: 若a、b為相異的有理數，則在a、b之間必有至少一個無理數
  - label: D
    content: 若$a^{2}$＋$b^{2}$＋$c^{2}$＋ab＋bc＋ca＝0，則$a^{2}$＋$b^{2}$＋$c^{2}$－2ab－2bc＋2ca＝0
  - label: E
    content: 若已知$c^{0}$＝1成立，則$c^{-\frac{2}{3}}$＝$\frac{1}{\sqrt[3]{c^{2}}}$成立
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
