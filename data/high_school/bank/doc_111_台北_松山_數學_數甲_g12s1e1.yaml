  stem: 'Cantor Set 康托爾集在拓樸學中是一個非常有名的例子，其製作的步驟如下圖所示：

    Step 1：給定 [ 0，1 ] 閉區間。

    Step 2：挖掉中間的三分之一開區間$\left( \frac{1}{3} , \frac{2}{3} \right)$，留下兩條線段：$\left[ 0 , \frac{1}{3} \right]$∪$\left[ \frac{2}{3} , 1 \right]$。

    Step 3：再將現有的兩個閉區間$\left[ 0 , \frac{1}{3} \right]$、$\left[ \frac{2}{3} , 1 \right]$，各挖掉中間的三分之一開區間$\left( \frac{1}{9} , \frac{2}{9} \right)$、$\left( \frac{7}{9} , \frac{8}{9} \right)$，留下四條線段：$\left[ 0 , \frac{1}{9} \right]$∪$\left[ \frac{2}{9} , \frac{1}{3} \right]$∪$\left[ \frac{2}{3} , \frac{7}{9} \right]$∪$\left[ \frac{8}{9} , 1 \right]$。

    依此步驟一直進行下去，最後所成的集合即為「Cantor Set」，其圖形稱為「碎形」。

    求 Cantor Set「挖掉的總長度」為＿＿＿＿。'
