- id: doc_111_台北_松山_數學_數甲_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關循環小數的敘述中，請選出「錯誤」的選項。
  options:
  - label: A
    content: $0.\overline{2}$＋$0.\overline{8}$＝$0.\overline{3}$＋$0.\overline{7}$
  - label: B
    content: $0.\overline{5}$＋$0.\overline{5}$＝$1.\overline{1}$
  - label: C
    content: $0.\overline{7}$＋$0.\overline{2}$＝1
  - label: D
    content: $0.\overline{25}$＋$0.\overline{75}$＝$1.\overline{1}$
  - label: E
    content: $0.4\overline{9}$＝0.5
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$0.\overline{2}$＋$0.\overline{8}$＝（0.2＋0.02＋0.002＋……）＋（0.8＋0.08＋0.008＋……）

    ＝$\frac{0.2}{1 - 0.1}$＋$\frac{0.8}{1 - 0.1}$＝$\frac{2}{9}$＋$\frac{8}{9}$＝$\frac{10}{9}$

    $0.\overline{3}$＋$0.\overline{7}$＝（0.3＋0.03＋0.003＋……）＋（0.7＋0.07＋0.007＋……）

    ＝$\frac{0.3}{1 - 0.1}$＋$\frac{0.7}{1 - 0.1}$＝$\frac{3}{9}$＋$\frac{7}{9}$＝$\frac{10}{9}$

    (B)○：$0.\overline{5}$＋$0.\overline{5}$＝2（0.5＋0.05＋0.005＋……）＝2×$\frac{0.5}{1 - 0.1}$＝2×$\frac{5}{9}$＝$\frac{10}{9}$

    $1.\overline{1}$＝1＋（0.1＋0.01＋0.001＋……）＝1＋$\frac{0.1}{1 - 0.1}$＝1＋$\frac{1}{9}$＝$\frac{10}{9}$

    (C)○：由(A)，$0.\overline{7}$＋$0.\overline{2}$＝$\frac{7}{9}$＋$\frac{2}{9}$＝1

    (D)╳：$0.\overline{25}$＋$0.\overline{75}$＝（0.25＋0.0025＋0.000025＋……）＋（0.75＋0.0075＋0.000075＋……）

    ＝$\frac{0.25}{1 - 0.01}$＋$\frac{0.75}{1 - 0.01}$＝$\frac{25}{99}$＋$\frac{75}{99}$＝$\frac{100}{99}$

    由(B)，$1.\overline{1}$＝$\frac{10}{9}$，不相等

    (E)○：$0.4\overline{9}$＝0.4＋（0.09＋0.009＋0.0009＋……）＝$\frac{2}{5}$＋$\frac{0.09}{1 - 0.1}$＝$\frac{2}{5}$＋$\frac{1}{10}$＝$\frac{1}{2}$＝0.5

    故選(D)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 對於任意實數 x，以 [ x ] 表示「不大於 x 的最大整數」，我們稱 [ ] 為高斯符號，稱函數 y＝[ x ] 為高斯函數，求$\lim_{x \rightarrow 0.5} \frac{[ 2x ]}{x}$的極限值為下列何者？
  options:
  - label: A
    content: －1
  - label: B
    content: '0'
  - label: C
    content: '1'
  - label: D
    content: '2'
  - label: E
    content: 不存在
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow 0.5^{+}} \frac{[ 2x ]}{x}$＝$\lim_{x \rightarrow 0.5^{+}} \frac{1}{x}$＝2

    $\lim_{x \rightarrow 0.5^{-}} \frac{[ 2x ]}{x}$＝$\lim_{x \rightarrow 0.5^{-}} \frac{0}{x}$＝0

    得$\lim_{x \rightarrow 0.5} \frac{[ 2x ]}{x}$不存在，故選(E)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知函數 f（x）＝x×π$^{x}$ 為連續函數。若在正整數 k 與 k＋1 間有一實數 c 滿足 f（c）＝π$^{10}$，則 k 的值為下列何者？
  options:
  - label: A
    content: '7'
  - label: B
    content: '8'
  - label: C
    content: '9'
  - label: D
    content: '10'
  - label: E
    content: '11'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '已知 k×π$^{k}$＜π$^{10}$＜（k＋1）×π$^{k＋1}$

    又 8×π$^{8}$＜π$^{2}$×π$^{8}$＝π$^{10}$

    9×π$^{9}$＞π×π$^{9}$＝π$^{10}$

    取 k＝8，故選(B)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 判斷下列各無窮數列，何者收斂到 0？
  options:
  - label: A
    content: $\left\langle \frac{n^{2}+n + 1}{1000n^{2}} \right\rangle$
  - label: B
    content: $\left\langle \frac{( -1 )^{n}}{n^{2}} \right\rangle$
  - label: C
    content: $\langle \sqrt{n + 1} - \sqrt{n} \rangle$
  - label: D
    content: $\left\langle \left( -\frac{1}{\pi} \right) ^{n} \right\rangle$
  - label: E
    content: $\left\langle \frac{10^{n}+11^{n}}{9^{n}+10^{n +1000}} \right\rangle$
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\lim_{n \rightarrow \infty} \frac{n^{2}+n + 1}{1000n^{2}}$＝$\frac{1}{1000}$

    (B)○：$\lim_{n \rightarrow \infty} \frac{( -1 )^{n}}{n^{2}}$＝0

    (C)○：$\lim_{n \rightarrow \infty} ( \sqrt{n + 1} - \sqrt{n} )$＝$\lim_{n \rightarrow \infty} \frac{1}{\sqrt{n + 1} + \sqrt{n}}$＝0

    (D)○：$\lim_{n \rightarrow \infty} \left( -\frac{1}{\pi} \right) ^{n}$＝0

    (E)╳：$\lim_{n \rightarrow \infty} \frac{10^{n}+11^{n}}{9^{n}+1{0^{n}}^{+1000}}$＝$\lim_{n \rightarrow \infty} \frac{\left( \frac{10}{11} \right) ^{n}+ 1}{\left( \frac{9}{11} \right) ^{n}+ 10^{1000} \left( \frac{10}{11} \right) ^{n}}$，不存在

    故選(B)(C)(D)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 坐標平面上，x 坐標與 y 坐標皆為整數的點稱為「格子點」。設 k、n 均為正整數，已知當 x$\geq$0，y$\geq$0 時，滿足 x＋2y＝4k 的格子點（x，y）的數目為 $a_{k}$，令 $S_{n}$＝$\sum_{k =1}^{n} a_{k}$，下列敘述何者正確？
  options:
  - label: A
    content: $a_{1}$＝3
  - label: B
    content: $a_{k}$＝2k＋1
  - label: C
    content: $S_{n}$＝$n^{2}$＋n
  - label: D
    content: $\lim_{n \rightarrow \infty} \frac{a_{n}}{n}$＝1
  - label: E
    content: $\lim_{n \rightarrow \infty} \frac{S_{n}}{n^{3}}$＝0
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝0，1，2，……，2k 時皆為格子點，故 $a_{k}$＝2k＋1

    (A)○：$a_{1}$＝2×1＋1＝3

    (B)○

    (C)╳：$S_{n}$＝$\sum_{k =1}^{n} a_{k}$＝$\sum_{k =1}^{n} ( 2k + 1 )$＝$2 ( \sum_{k =1}^{n} k )$＋$\sum_{k =1}^{n} 1$

    ＝2×$\frac{n ( n + 1 )}{2}$＋n＝$n^{2}$＋2n

    (D)╳：$\lim_{n \rightarrow \infty} \frac{a_{n}}{n}$＝$\lim_{n \rightarrow \infty} \frac{2n + 1}{n}$＝2

    (E)○：$\lim_{n \rightarrow \infty} \frac{S_{n}}{n^{3}}$＝$\lim_{n \rightarrow \infty} \frac{n^{2}+ 2n}{n^{3}}$＝0

    故選(A)(B)(E)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 假設兩數列〈$a_{n}$〉、〈$b_{n}$〉，對所有正整數 n 都滿足 $b_{n}$＋$\frac{2n}{n + 1}$＜$a_{n}$＜$3b_{n}$。已知$\lim_{n \rightarrow \infty} a_{n}$＝3，下列敘述何者正確？
  options:
  - label: A
    content: $b_{n}$＞$\frac{n}{n + 1}$
  - label: B
    content: $b_{n}$＜3－$\frac{2n}{n + 1}$
  - label: C
    content: 數列〈$b_{n}$〉有可能發散
  - label: D
    content: $a_{100000}$＜3.1
  - label: E
    content: $a_{100000}$＞2.9
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵$b_{n}$＋$\frac{2n}{n + 1}$＜$3b_{n}$ ∴$\frac{n}{n + 1}$＜$b_{n}$

    (B)╳：不一定，若 $a_{n}$＝3＋$\frac{3}{n + 1}$ 則$\lim_{n \rightarrow \infty} a_{n}$＝3

    但 $b_{1}$＋$\frac{2\times 1}{1+1}$＜3＋$\frac{3}{1+1}$＜$3b_{1}$

    $\Rightarrowb_{1}$＋1＜$\frac{9}{2}$＜$3b_{1}$

    $\Rightarrow\frac{3}{2}$＜$b_{1}$＜$\frac{7}{2}$

    無法保證 $b_{1}$＜3－$\frac{2\times 1}{1+1}$＝2

    (C)╳：∵$\frac{a_{n}}{3}$＜$b_{n}$＜$a_{n}$－$\frac{2n}{n + 1}$且$\lim_{n \rightarrow \infty} \frac{a_{n}}{3}$＝$\lim_{n \rightarrow \infty} \left( a_{n}-\frac{2n}{n + 1} \right)$＝1

    ∴$\lim_{n \rightarrow \infty} b_{n}$＝1

    (D)╳(E)○：∵$b_{n}$＞$\frac{n}{n + 1}$

    ∴$b_{100000}$＞$\frac{100000}{100001}$

    $\Rightarrowa_{100000}$＞$b_{100000}$＋$\frac{2\times 100000}{100001}$＞$\frac{300000}{100001}$＝2.99……

    無法保證 $a_{100000}$＜3.1

    但可保證 $a_{100000}$＞2.9

    故選(A)(E)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: '設三函數 f（x）＝$\frac{1 -x}{| x - 1 |}$，g（x）＝$\begin{cases}\frac{x^{2}- 1}{x - 1} , 當 x\neq 1 \\ 0 , 當 x = 1\end{cases}$，h（x）＝$( x - 1 ) \cos \frac{1}{x - 1}$，下

    列敘述何者正確？'
  options:
  - label: A
    content: 右極限$\lim_{x \rightarrow 1^{+}} f ( x )$＝1
  - label: B
    content: $\lim_{x \rightarrow 1} f ( x )$不存在
  - label: C
    content: $\lim_{x \rightarrow 1} g ( x )$＝1
  - label: D
    content: g（x）在 x＝1 處不連續
  - label: E
    content: $\lim_{x \rightarrow 1} h ( x )$＝1
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\lim_{x \rightarrow 1^{+}} f ( x )$＝$\lim_{x \rightarrow 1^{+}} \frac{1 - x}{| x - 1 |}$＝$\lim_{x \rightarrow 1^{+}} \frac{1 - x}{x - 1}$＝－1

    (B)○：$\lim_{x \rightarrow 1^{-}} f ( x )$＝$\lim_{x \rightarrow 1^{-}} \frac{1 -x}{| x - 1 |}$＝$\lim_{x \rightarrow 1^{-}} \frac{1 -x}{1 -x}$＝1

    ∵$\lim_{x \rightarrow 1^{+}} f ( x )$≠$\lim_{x \rightarrow 1^{-}} f ( x )$ ∴$\lim_{x \rightarrow 1} f ( x )$不存在

    (C)╳：$\lim_{x \rightarrow 1} g ( x )$＝$\lim_{x \rightarrow 1} \frac{x^{2}- 1}{x - 1}$＝$\lim_{x \rightarrow 1} ( x + 1 )$＝2

    (D)○：∵$\lim_{x \rightarrow 1} g ( x )$≠g(1) ∴g（x）在 x＝1 處不連續

    (E)╳：∵－1$\leq\cos \frac{1}{x - 1}\leq$1

    ∴－｜x－1｜$\leq( x - 1 ) \cos \frac{1}{x - 1}\leq$｜x－1｜

    又$\lim_{x \rightarrow 1} ( -| x - 1 | )$＝$\lim_{x \rightarrow 1} | x - 1 |$＝0

    故$\lim_{x \rightarrow 1} h ( x )$＝$\lim_{x \rightarrow 1} ( x - 1 ) \cos \frac{1}{x - 1}$＝0

    故選(B)(D)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s2_5
  section: 2
  number: 5
  type: multiple
  page: 2
  stem: '已知 e＝$\lim_{n \rightarrow \infty} \left( 1+\frac{1}{n} \right) ^{n}\approx$2.71828，以 e 為底數的對數函數可記作 ln x，即 $log_{e}$x＝lnx。

    設 f（x）＝$e^{x}$，g（x）＝lnx，h（x）＝x－1，k（x）＝ex，下列敘述何者正確？'
  options:
  - label: A
    content: f（x）定義域為所有實數 R
  - label: B
    content: g（x）的值域為｛y｜y$\in$R，y$\geq$0｝
  - label: C
    content: （f。g）（x）＝x
  - label: D
    content: （g。h）（x）的圖形是 g（x）的圖形向左平移 1 單位
  - label: E
    content: （f。h）（x）與（g。k）（x）互為反函數
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵f（x）＝$e^{x}$ 為指數函數 ∴定義域為所有實數 R

    (B)╳：應為所有實數 R

    (C)○：（f。g）（x）＝f（g（x））＝$e^{lnx}$＝x

    (D)╳：（g。h）（x）＝g（h（x））＝ln（x－1），為 g（x）的圖形向右平移 1 單位

    (E)○：（f。h）（x）＝f（h（x））＝$e^{x－1}$

    （g。k）（x）＝g（k（x））＝ln（ex）＝lne＋lnx＝1＋lnx

    若（α，β）在 y＝f（h（x））的圖形上，即β＝$e^{α－1}$

    $\Rightarrow$α－1＝lnβ$\Rightarrow$α＝1＋lnβ

    $\Rightarrow$（β，α）在 y＝g（k（x））的圖形上

    故（f。h）（x）和（g。k）（x）互為反函數

    故選(A)(C)(E)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s2_6
  section: 2
  number: 6
  type: multiple
  page: 3
  stem: 當函數 f（x）對所有 x 均滿足 f（－x）＝－f（x），稱 f（x）為奇函數；當函數 f（x）對所有 x 均滿足 f（－x）＝f（x）時，稱 f（x）為偶函數。已知 $f_{1}$（x）＝$5x^{3}$＋7， $f_{2}$（x）＝｜sinx｜，$f_{3}$（x）＝x＋｜x｜，$f_{4}$（x）＝$2^{x}$＋$2^{－x}$，$f_{5}$（x）＝$2^{x}$－$2^{－x}$，下列敘述何者正確？
  options:
  - label: A
    content: $f_{1}$（x）為奇函數
  - label: B
    content: $f_{2}$（x）為偶函數
  - label: C
    content: $f_{3}$（x）不是奇函數，也不是偶函數
  - label: D
    content: $f_{4}$（x）的函數圖形對稱於 y 軸
  - label: E
    content: $f_{5}$（x）為偶函數
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$f_{1}$（－x）＝5（－x）$^{3}$＋7＝－$5x^{3}$＋7≠－f（x）

    (B)○：$f_{2}$（－x）＝｜sin（－x）｜＝｜－sinx｜＝｜sinx｜＝$f_{2}$（x）

    (C)○：$f_{3}$（－x）＝－x＋｜－x｜＝－x＋｜x｜≠$f_{3}$（x）

    且 $f_{3}$（－x）≠－$f_{3}$（x）

    (D)○：∵$f_{4}$（－x）＝$2^{－x}$＋$2^{x}$＝$f_{4}$（x）

    ∴$f_{4}$（x）的函數圖形對稱於 y 軸

    (E)╳：$f_{5}$（－x）＝$2^{－x}$－$2^{x}$≠$f_{5}$（x）

    故選(B)(C)(D)'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 3
  stem: 已知三次多項式 f（x）滿足$\lim_{x \rightarrow 1} \frac{f ( x )}{x - 1}$＝4，$\lim_{x \rightarrow -1} \frac{f ( x )}{x + 1}$＝6，求$\lim_{x \rightarrow 0} f ( x )$＝＿＿＿＿。
  answer:
  - $\frac{1}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '由兩個極限存在可知 f(1)＝f（－1）＝0

    可設 f（x）＝（ax＋b）（x－1）（x＋1）

    $\lim_{x \rightarrow 1} \frac{( ax +b ) ( x - 1 ) ( x + 1 )}{x - 1}$＝$\lim_{x \rightarrow 1} 〔 ( ax +b ) ( x + 1 ) 〕$＝2（a＋b）＝4

    $\Rightarrow$a＋b＝2 ……………①

    $\lim_{x \rightarrow -1} \frac{( ax +b ) ( x - 1 ) ( x + 1 )}{x + 1}$＝$\lim_{x \rightarrow -1} 〔 ( ax +b ) ( x - 1 ) 〕$＝－2（－a＋b）＝6

    $\Rightarrow$a－b＝3 ……………②

    由①、②可知 a＝$\frac{5}{2}$，b＝$-\frac{1}{2}$

    故$\lim_{x \rightarrow 0} f ( x )$＝$\lim_{x \rightarrow 0} \left[ \left( \frac{5}{2}x -\frac{1}{2} \right) ( x - 1 ) ( x + 1 ) \right]$＝$\left( -\frac{1}{2} \right)$×（－1）×1＝$\frac{1}{2}$'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 3
  stem: '求下列各極限值：

    (1) $\lim_{x \rightarrow 4} \left( \frac{x}{4}+\frac{\sqrt{x} - 2}{x - 4} \right)$＝＿＿＿＿。

    (2) $\lim_{x \rightarrow 1} \left( \frac{| x^{2}- 5x - 1 |}{| x |- 1}-\frac{5}{x - 1} \right)$＝＿＿＿＿。'
  answer:
  - (1) $\frac{5}{4}$；(2) 3
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $\lim_{x \rightarrow 4} \left( \frac{x}{4}+\frac{\sqrt{x} - 2}{x - 4} \right)$＝$\lim_{x \rightarrow 4} \left( \frac{x}{4}+\frac{\sqrt{x} - 2}{( \sqrt{x} + 2 ) ( \sqrt{x} - 2 )} \right)$

    ＝$\lim_{x \rightarrow 4} \left( \frac{x}{4}+\frac{1}{\sqrt{x} + 2} \right)$＝$\lim_{x \rightarrow 4} \frac{x}{4}$＋$\lim_{x \rightarrow 4} \frac{1}{\sqrt{x} + 2}$＝1＋$\frac{1}{4}$＝$\frac{5}{4}$

    (2) ∵當 x → 1 時，$x^{2}$－5x－1＜0，x＞0

    ∴$\lim_{x \rightarrow 1} \left( \frac{| x^{2}- 5x - 1 |}{| x |- 1}-\frac{5}{x - 1} \right)$＝$\lim_{x \rightarrow 1} \left( \frac{-x^{2}+ 5x + 1}{x - 1}-\frac{5}{x - 1} \right)$＝$\lim_{x \rightarrow 1} \frac{-x^{2}+ 5x - 4}{x - 1}$

    ＝$\lim_{x \rightarrow 1} \frac{-( x - 1 ) ( x - 4 )}{x - 1}$＝$\lim_{x \rightarrow 1} 〔 -( x - 4 ) 〕$＝3'
- id: doc_111_台北_松山_數學_數甲_g12s1e1_s3_3
  section: 3
