  explanation: '設第 k 次挖完後挖掉的總長度為 $a_{k}$

    $a_{1}$＝0

    $a_{2}$＝$\frac{1}{3}$

    $a_{3}$＝$\frac{1}{3}$＋$\frac{2}{3}$×$\frac{1}{3}$

    $a_{4}$＝$\frac{1}{3}$＋$\frac{2}{3}$×$\frac{1}{3}$＋$\left( \frac{2}{3} \right) ^{2}$×$\frac{1}{3}$

    ……

    $a_{n}$＝$\frac{1}{3}$＋$\frac{2}{3}$×$\frac{1}{3}$＋$\left( \frac{2}{3} \right) ^{2}$×$\frac{1}{3}$＋……＋$\left( \frac{2}{3} \right) ^{n - 2}$×$\frac{1}{3}$

    ＝$\frac{1}{3} \left[ 1+\frac{2}{3}+ \left( \frac{2}{3} \right) ^{2}+\ldots \ldots + \left( \frac{2}{3} \right) ^{n - 2} \right]$

    故挖掉的總長度為$\lim_{n \rightarrow \infty} a_{n}$＝$\frac{1}{3}$×$\frac{1}{1 -\frac{2}{3}}$＝1'
