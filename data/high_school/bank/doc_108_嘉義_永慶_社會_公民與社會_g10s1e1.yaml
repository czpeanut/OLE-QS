  - label: C
    content: 法律責任
  - label: D
    content: 政治責任
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 2018年5月間，中國政府對36家國外航空公司致函施壓，限時要求航空公司網站必須在1個月內將「臺灣」名稱加註「中國」，目前已有20家航空公司配合，將臺灣列為中國的一部分，上述消息在國際之間引起關注批評，也反映出臺灣在兩岸關係上存在何種難題？
  options:
  - label: A
    content: 缺乏治權
  - label: B
    content: 主權爭議
  - label: C
    content: 飛安評價
  - label: D
    content: 產業外移
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 香港人在過去30年共有三波移民海外的浪潮。第一波是1989年中國天安門事件後，加上港人對於回歸中國的一國兩制有疑慮；第二波為香港回歸前兩年；第三波則是2010年之後，中國放寬國人旅遊香港，帶來高房價等社會問題，激化中港矛盾，以及收緊港人的言論自由尺度。前兩波因為臺灣剛解嚴，民主化剛起步，港人對臺灣民主沒信心，故多半移民至英國、加拿大等地，但在2014年香港爭取真普選失敗與最近的反送中運動後，民主的臺灣便成為第三波移民首選。上述現象可看出影響港人國家認同的主因應該是？
  options:
  - label: A
    content: 民族血緣連結
  - label: B
    content: 歷史文化傳統
  - label: C
    content: 政治社會體制
  - label: D
    content: 經濟發展程度
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 我國《憲法》第2條明訂，「中華民國主權屬於國民全體」，代表我國是「主權在民」的國家。下列哪一項作為明白顯示我國人民以直接民主方式呈現此種理念？
  options:
  - label: A
    content: 各縣市議員皆由人民直接選出
  - label: B
    content: 人民選出立法委員制定相關法律保障人民利益
  - label: C
    content: 政府召開司法改革國是會議回應人民訴求司法改革
  - label: D
    content: 人民以公民投票否決政府同意日本核災區食品進口 註直接民主：在這種體制中，每一個公民直接參與政策的制定
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 2018年底有兩項關乎民生議題的公投案，分別是「反空汙一逐年降低火力發電」以及「反核食－禁止日本核災食品進口」，提案者呼籲大家踴躍投票支持，才有機會確保國民及後代子孫的健康存續。請問：上述呼籲所反映的公民權利間發展關係應該是下列何者？
  options:
  - label: A
    content: 以自由權影饗社會權的實現
  - label: B
    content: 藉參政權促成社會權的落實
  - label: C
    content: 以自由權影響文化權的實踐
  - label: D
    content: 藉參政權促成文化權的開展
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 新北市議員在市政總質詢時，關切新北市政府的財政問題，新北市長則在議會答詢時指出，中央的財源再不按照標準給，新北市3年就會破產。請問：「新北市」作為權利主體，其屬性與何者最為相近？
  options:
  - label: A
    content: 臺灣省
  - label: B
    content: 高雄市茂林區
  - label: C
    content: 董氏基金會
  - label: D
    content: 嘉義縣東川里
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 2015年有班華航班機從桃園機場起飛，原定降落洛杉磯，途中我國孕婦驚險產女，該名婦人在飛機上突然羊水破裂，所幸剛好有醫生幫忙接生才有驚無險，，女嬰國籍問題也成為關注焦點，該名婦人昨晚回台後被帶回偵訊，釐清遣返原因。航警局刑大偵二隊長陳秀子表示，女嬰已確認獲美國籍，且暫由美國州政府照顧；阿拉斯加州官員表示，在國際領空出生且入境當地的嬰兒，可取得當地出生證明。（整理自ETtoday新聞雲）。請問依題意女嬰可取得美國籍的原因是？
  options:
  - label: A
    content: 美國為屬人主義
  - label: B
    content: 女嬰可以透過歸化成為美國人
  - label: C
    content: 女嬰的媽媽是美國人因此可以取得美國籍
  - label: D
    content: 美國為屬地主義
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 福利國家是指政府透過各項社會福利措施，來照顧人民生活以促進全民福祉。請問：下列何種政策作為最符合其概念？
  options:
  - label: A
    content: 修法將參與公民投票的年齡資格下調至18歲
  - label: B
    content: 擴大施打公費疫苗以提升國民的流感保護能力
  - label: C
    content: 讓勞動市場自由運作不加干預以提升經濟效率
  - label: D
    content: 大幅提高各項免稅額度以減輕民眾的租稅負擔
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 美國總統川普就任後，為兌現他的美墨邊境圍牆政見而編列鉅額預算，但美國國會拒絕批准此項預算，使川普的政見受阻。請問：上述現象最符合何種概念？
  options:
  - label: A
    content: 有限政府
  - label: B
    content: 依法行政
  - label: C
    content: 正當程序
  - label: D
    content: 責任政治
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 以前屬於部落的祭祀廣場、聚會所等土地，都不能登記所有權，因此變成國有土地。此外。屏東縣來義鄉排灣族的傳統文化「五年祭」，排灣旅部落居然無法申請為保存者，反而由民間團體申請為保存者。請問：上述現象的起因最可能是部落欠缺什麼要素？
  options:
  - label: A
    content: 權利能力
  - label: B
    content: 民意支持
  - label: C
    content: 權利意識
  - label: D
    content: 領導人物
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 我國為民主國家，以憲法來界定政府權力、人民的義務以及政府的組織，關於憲政主義，何者正確？
  options:
  - label: A
    content: 若大法官宣告法律違反憲法，則大法官可以另訂其他法律取代違憲的法律
  - label: B
    content: 立法院可以指揮檢察官調查官員貪汙案
  - label: C
    content: 行政院依法行政，如果認為有法律不符合時代且無法滿足人民需求，可以提出法律修正案送立法院修法
  - label: D
    content: 基於分權制衡，立法院可以對總統提出不信任案使總統下臺
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 2020年即將在日本舉辦的東京奧運，盼以「臺灣」而非「中華臺北」名義參加，因此臺日兩地都在街頭進行「正名」連署，日本已經連署超過十萬份，讓臺灣以「Taiwan」名義參與國際性的奧運賽事。請問：我國必須使用「中華臺北」名義參與奧運，而無法使用中華民國或臺灣之名，下列哪個選項可以說明這種現象？
  options:
  - label: A
    content: 欠缺完整的領土
  - label: B
    content: 欠缺國際上的合法主權
  - label: C
    content: 欠缺國際上的事實主權
  - label: D
    content: 欠缺國家認同
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 就讀長庚大學的跨性別女學生小雯被校方以「身份證性別尚未更改」為由，拒絕讓她搬進女生宿舍，更在後續和校方面談期間，遭學務長、總教官等高層用言語歧視，且無視小雯已受賀爾蒙治療，有醫療診斷證明其女性身份等事實，她因此受到極大壓力而休學。（整理自公民行動影音紀錄資料庫）。針對學校的行為，試問小雯有何救濟管道？
  options:
  - label: A
    content: 因未涉及學生身份改變因此僅能向校方申訴
  - label: B
    content: 向校方申訴反應不恰當，並可直接提起行政訴訟
  - label: C
    content: 直接向教育部訴願，若訴願結果不滿意則可提起行政訴訟
  - label: D
    content: 可先向校內提起申訴，若不滿意結果可以提起訴願，並可以再提出行政訴訟
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 子瑜為完成公民時事報告，上網搜尋到的資料如下：「亞洲第一！立法院三讀通過《司法院釋字第748號解釋施行法》，保障同性戀者的婚姻自由。」根據上述資料，請問：最適合的報告結論為何？
  options:
  - label: A
    content: 以政策保障多元身分將有助於消除對特定群體的偏見或歧視
  - label: B
    content: 給予弱勢群體特權方能改善其地位並彰顯實質平等精神
  - label: C
    content: 立法保障同婚權益反而會造成社會對同性戀者的偏見或歧視
  - label: D
    content: 透過法律制度對處境不利者提供的權益保障
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 法人有公法人私法人區分，地方自治團體屬於公法人的一種，2018年我國舉行九合一選舉，選出多位地方自治團體的首長與民意代表。請問：下列關於地方自治團體的敘述，何者正確？
  options:
  - label: A
    content: 北市士林區是公法人的一種
  - label: B
    content: 新北市烏來區具備公法人責格
  - label: C
    content: 村、里也是公法人
  - label: D
    content: 臺灣省雖然精省，仍屬公法人之一
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 為期17天的長榮空服員罷工，終於在7月6日第三次協商會議後，勞資雙方簽署團體協約，畫下休止符。總結這場台灣航空史上最多空服員參與、歷時最長、影響航班與旅客數最多的罷工行動，儘管工會的訴求，資方多半沒有答應，但空服員的薪資持遇及與公司高層建立溝通管道等方面，仍進一步獲得改善；長榮也守住底線，未讓提高日支費的訴求闖關成功，避免人事成本膨脹。《整理自商周頭條》。根據敘述，下列何者正確？
  options:
  - label: A
    content: 罷工權是規範在團體協約法中所賦予的權利(
  - label: B
    content: 空服員可以透過組織、參與工會與公司進行協商
  - label: C
    content: 長榮空服員罷工是種公民不服從的行動
  - label: D
    content: 空服員若不滿資方協商可向立法院提案並修改法規
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 知名網路節目「木曜四超玩」，拍攝一日系列曾到「國家運動訓練中心」取材，而會成立此機關，是因應公共事務的龐大與複雜性，原本由政府組織負貴的公共事務經執行後被普遍認為不適合再以政府組織繼續運作，而牽涉的公共層面又不適合以財團形式為之，請問此機關稱為？
  options:
  - label: A
    content: 財團法人
  - label: B
    content: 營利社團法人
  - label: C
    content: 非營利社團法人
  - label: D
    content: 行政法人
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 2014年8月31日，中國人大常委會通過香港2017年行政長官普選決議，由於選舉人名單須經過提名委員會半數的同意， 引發「假普選」的疑慮，進而爆發香港「雨傘運動」。上述雨傘運動主要是爭取哪一代人權保障？
  options:
  - label: A
    content: 第一代人權，又稱為集體人權
  - label: B
