  stem: 台中知名燒烤店在粉專宣布2020年總統大選投票日特別公休一天，一部分的原因是勞動部提醒2020年總統投票日，具有選舉權的勞工都可放假一天，如果勞工出來上班，<u>雇主需依照勞工的假別給予加班費</u>。請問依畫線處：國家保障勞工的權益是哪一種人權？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 參政權
  - label: C
    content: 社會權
  - label: D
    content: 文化權
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 暑假時阿椒與家人到歐洲自助旅行，當他們停留在一些大都市，如柏林、巴黎、布魯塞爾等，對迎面走來的行人，有時無法立刻分辨是哪一個國家的國民。此時如果要正確無誤的辨識對方的國籍，下列哪一種方法最正確？
  options:
  - label: A
    content: 對方使用的語言
  - label: B
    content: 對方使用的貨幣
  - label: C
    content: 對方的臉型髮色
  - label: D
    content: 對方使用的護照
- id: doc_108_嘉義_永慶_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 上公民課慧慧老師請同學比較「國家」與「政府」的差異，哪一位同學的分析正確？
  options:
  - label: A
    content: 霖霖：主權國家是當前最重要的國家型態；政府則是國際政治體系的主要角色
  - label: B
    content: 依依：國家的權力分為行政、立法、考試三權；政府權力具有排他性與最高性(
  - label: C
    content: 貳貳：國家的存續不會隨政府的更換而改變；政府的存續隨選舉的結果而更迭
  - label: D
    content: 姍姍：政府的效率能力影響國家的國際承認：國家的地位高低影響著政府效能
