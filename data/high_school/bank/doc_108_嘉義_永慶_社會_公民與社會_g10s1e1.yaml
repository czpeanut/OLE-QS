  number: 4
  type: single
  page: 1
  stem: 臺鐵鹿姓局長因普悠瑪案請辭獲准，行政院表示，為了民眾行的安全，臺鐵的改革勢在必行，為了展現改革的決心，新任交通部臺灣鐵路管理局局長由現任交通部政務次長接任，其並辭去次長一職。請問：前臺鐵局長因普悠瑪案請辭，是負起何種責任？
  options:
  - label: A
    content: 行政責任
  - label: B
