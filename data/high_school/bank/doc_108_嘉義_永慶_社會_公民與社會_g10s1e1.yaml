  stem: 上述人口普查與公民身分的關聯應該是下列何者？
  options:
  - label: A
    content: 普查反而使得擁有公民身分者減少
  - label: B
    content: 人口普查會讓擁有公民身分者增加
  - label: C
    content: 調查公民身分反倒會妨礙人口普查
  - label: D
    content: 詢問公民身分有助於落實人口普查
  group_stem: (一) 美國10年一度的人口普查將於2020年4月1日開始，川普政府計畫在調查表上，增加詢問「是否為美國公民身分」引發疑慮，因為可能導致非法移民不願或是不敢參加普查，造成人口統計失準，也會影響美國選區版圖劃分時，每個州在眾議院的席位數量，以及聯邦資金分配，勢必衝擊到如紐約州、加州等擁有大量移民的區域，而華府最高法院的9名大法官正在考慮，是否要調整人口普查的設計，在裡頭加上此項會引發爭議的問題。 人口普查最主要目的是統計人數，至於移民人口數據，不論合法或是非法，每年由美國社區調查負責；目前美國7％的人口，大約2,200萬人不是美國公民，其中半數為無證移民。然而美國商務部長羅斯認為這樣並不夠，為了幫助政府能更好地執行保護少數群體政治權的《投票權利法》，打算在人口普查中，恢復近70年前審視公民身分的問題，但這項政策遭到3個聯邦法院裁定，達反《行政程序法》，以及憲法規定要統計所有人的要求；也有反對人士認為，公民身分問題可能導致非法移民不願參加人口普查，讓蒐集來的數據變得不準確，影響層面廣泛。
