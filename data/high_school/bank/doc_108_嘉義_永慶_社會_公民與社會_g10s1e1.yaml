  stem: ( 事件一 ) 美國參議院外交委員會，在美國時間25日通過「台北法案」( TAIPEI Act )，希望藉此協助台灣鞏固邦交，不過中國的打壓手段仍是不間斷，美國國防部印太事務助理部長薛瑞福 ( Randall Schriver ) 就警告，兩個位於太平洋的台灣邦交國，帛琉及馬紹爾群島，也都面臨放棄台灣、轉向中國的壓力。( 整理自民視新聞網 )。 ( 事件二 ) 2019年世界衛生大會於5月20日到28日在瑞士日內瓦舉行。我國在2016年總統蔡英文上任後，因中國打壓， 至今已有2年未收到WHA邀請函，2016年的邀請函上則是被加註一中原則。有媒體引述世界衛生組織發言人林德梅耶 ( Christian Lindmeier ) 說法指出，今年若沒有「兩岸諒解」( cross-strait understanding )，不用期待台灣能獲得WHA邀請函，外界解讀此意味台灣今年要獲邀出席WHA大會機率恐怕不高。( 整理自自由時報 )。 ＊依題文所敘述的國際事件，對台灣拓展國際參與的哪項努力，會產生最不利的影響？請先勾選一項，再說明理由。
