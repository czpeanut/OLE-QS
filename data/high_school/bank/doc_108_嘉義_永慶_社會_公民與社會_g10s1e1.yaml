  stem: 就上文呈現的國際局勢，何者描述最為貼切？
  options:
  - label: A
    content: 中美主權對外獨立不容WTO加以干涉
  - label: B
    content: WTO對於中美主權的影響力遭受挑戰
  - label: C
    content: 中美主權高於WTO權威故而不受約束
  - label: D
    content: WTO仍強勢干預中美主權及貿易決定
  group_stem: (三) 美國川普政府對總值2500億美元的進口中國產品課稅，以迫使中國接受美國要求，改革美方認為中國在保護智慧財產權、技術轉移、產業補助與市場開放等方面的不公平政策。此外川普也砲轟世界貿易組織 ( WTO )，宣稱美國的貿易政策不會聽從這個國際機構指揮，並為動用關稅來對中國施壓的作法辯護。 美國貿易代表署草擬一份報告，概述白宮2019年的貿易施政方針，提及美國將持續透過設於瑞士的WTO，對他們視為不公平的作法提出桃戰。然而報告又說：「美國仍是一個獨立國家，我們的貿易政策是在華府而非日內瓦制定。我們不會讓WTO上訴機構與爭端解決機制 ( DSB ) 強迫美國接受我們從未同意的義務約束。」 根據WTO的規定，成員國一旦發生貿易糾紛，應透過WTO的DSB進行仲裁，最近在中國兩度要求下，DSB已同意成立專家小組，檢討美國總統川普對價位2,500億美元的中國商品加徵關稅的決定。中國代表在WTO會議上表示，美國實施的關稅「公然違反美國在WTO協議中的義務，並對這個多邊貿易體系構成系統性挑戰」。美國代表則是抨擊中國要求WTO調查「完全是惺惺作態」，中國也對「超過1千億美元的美國出口商品施加歧視性關稅」。
