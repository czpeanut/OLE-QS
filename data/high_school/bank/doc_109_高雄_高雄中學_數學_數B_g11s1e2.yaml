  stem: 若 f（x，y）＝$\left| \begin{matrix}x & 1-y \\ 3+y & 2x-3\end{matrix} \right|$，則 f（x，y）之最小值為＿＿＿＿。
  answer:
  - $-\frac{41}{8}$
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x，y）＝x（2x－3）－（1－y）（3＋y）

    ＝（$2x^{2}$－3x）－（－$y^{2}$－2y＋3）

    ＝$2x^{2}$－3x＋$y^{2}$＋2y－3

    ＝$2 \left( x^{2}-\frac{3}{2}x+\frac{9}{16} \right)$＋（$y^{2}$＋2y＋1）－$\frac{9}{8}$－1－3

    ＝$2 \left( x-\frac{3}{4} \right) ^{2}$＋（y＋1）$^{2}$－$\frac{41}{8}$

    當$(x , y) = \left( \frac{3}{4} , -1 \right)$時，有最小值$-\frac{41}{8}$'
