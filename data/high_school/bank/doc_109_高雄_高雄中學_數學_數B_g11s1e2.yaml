- id: doc_109_高雄_高雄中學_數學_數B_g11s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 坐標平面上，A（x，y）點在曲線Γ：$x^{2}$＋$4y^{2}$＝5 上，可使 x＋y 為最小值的 A（x，y）為點 $A_{1}$、可使 x＋y 為最大值的 A（x，y）為點 $A_{2}$，試選出正確的選項。
  options:
  - label: A
    content: （$x^{2}$＋$4y^{2}$）$\left( 1+\frac{1}{4} \right)$ ≤ （x＋y）$^{2}$
  - label: B
    content: x＋y 的最小值為$-\frac{5}{2}$
  - label: C
    content: 點 $A_{1}$、點 $A_{2}$ 到直線 L：x＋y＝0 等距離
  - label: D
    content: 點 $A_{1}$、點 $A_{2}$ 都在直線 x－4y＝0 上
  - label: E
    content: ｜x＋y＋1｜的最小值為$\frac{3}{2}$
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ×：由柯西不等式 $[x^2+(2y)^2][1^2+(\frac{1}{2})^2] \ge (x+y)^2$。

    (B) ○：$5\cdot\frac{5}{4} \ge (x+y)^2 \Rightarrow -\frac{5}{2} \le x+y \le \frac{5}{2}$，最小值為 $-\frac{5}{2}$。

    (C) ○：$A_1$ 在 $x+y=-\frac{5}{2}$ 上，$A_2$ 在 $x+y=\frac{5}{2}$ 上，兩者到 $x+y=0$ 距離均為 $\frac{5}{2\sqrt{2}}$。

    (D) ○：等號成立時 $\frac{x}{1} = \frac{2y}{1/2} \Rightarrow x - 4y = 0$。

    (E) ×：因 $-\frac{5}{2} \le x+y \le \frac{5}{2}$，$-\frac{3}{2} \le x+y+1 \le \frac{7}{2}$，故 $|x+y+1|$ 最小值為 $0$。選 (B)(C)(D)。'
