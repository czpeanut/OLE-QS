- id: doc_109_高雄_高雄中學_數學_數B_g11s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 坐標平面上，A（x，y）點在曲線Γ：$x^{2}$＋$4y^{2}$＝5 上，可使 x＋y 為最小值的 A（x，y）為點 $A_{1}$、可使 x＋y 為最大值的 A（x，y）為點 $A_{2}$，試選出正確的選項。
  options:
  - label: A
    content: （$x^{2}$＋$4y^{2}$）$\left( 1+\frac{1}{4} \right)$ ≤ （x＋y）$^{2}$
  - label: B
    content: x＋y 的最小值為$-\frac{5}{2}$
  - label: C
    content: 點 $A_{1}$、點 $A_{2}$ 到直線 L：x＋y＝0 等距離
  - label: D
    content: 點 $A_{1}$、點 $A_{2}$ 都在直線 x－4y＝0 上
  - label: E
    content: ｜x＋y＋1｜的最小值為$\frac{3}{2}$
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：由柯西不等式：

    ［$x^{2}$＋（2y）$^{2}$］$\left[ 1^{2}+\left( \frac{1}{2} \right) ^{2} \right]$ ≥ （x＋y）$^{2}$

    (B) ○：由上式，5．$\frac{5}{4}$ ≥ （x＋y）$^{2}$

    ⇒ －$\frac{5}{2}$ ≤ x＋y ≤ $\frac{5}{2}$

    檢驗等號成立，$\begin{cases}\frac{x}{1}=\frac{2y}{\frac{1}{2}} \\ x+y =-\frac{5}{2}\end{cases}\Rightarrow \begin{cases}x=-2 \\ y =-\frac{1}{2}\end{cases}$，故最小值為－$\frac{5}{2}$

    (C) ○：$A_{1}$ 在 x＋y＝－$\frac{5}{2}$上，$A_{2}$ 在 x＋y＝$\frac{5}{2}$上，

    故 $A_{1}$、$A_{2}$ 到 x＋y＝0 等距離

    (D) ○：可解聯立$\begin{cases}\frac{x}{1}=\frac{2y}{\frac{1}{2}} \\ x+y =\frac{5}{2}\end{cases}\Rightarrow \begin{cases}x=2 \\ y =\frac{1}{2}\end{cases}$，得$A_{2}\left( 2 , \frac{1}{2} \right)$

    故$A_{1}\left( -2 , -\frac{1}{2} \right)$、$A_{2}\left( 2 , \frac{1}{2} \right)$皆在 x－4y＝0 上

    (E) ╳：x＋y＝－1 時，｜x＋y＋1｜有最小值 0

    故選(B)(C)(D)'
