  stem: 試問下列哪些選項是正確的？
  options:
  - label: A
    content: 將 6 本不同的數學課本全部任意分給小英、小德、小昌三人，其方法數為 $6^{3}$
  - label: B
    content: 將 6 本不同的數學課本全部分給小英、小德、小昌三人且小英至少得 1 本，其方法數為 665
  - label: C
    content: 將 6 本不同的數學課本全部分給小英、小德、小昌三人且小英至少得 1 本，其方法數為$C_{1}^{6}$×$3^{5}$
  - label: D
    content: 將 6 本不同的數學課本全部分給小英、小德、小昌三人且小英恰得 1 本，其方法數為$C_{1}^{6}$×$5^{2}$
  - label: E
    content: 將 6 本不同的數學課本全部分給小英、小德、小昌三人，已知有一人得 3 本、有一人得 2 本、有一人得 1 本，其方法數為$C_{3}^{6}$×$C_{2}^{3}$×$C_{1}^{1}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
