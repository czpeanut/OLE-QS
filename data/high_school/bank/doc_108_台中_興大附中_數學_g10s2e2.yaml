  stem: 招呼站現在停了$A$、$B$、$C$三輛計程車，每車限載四人(不含司機)，今同時有七人一起至招呼站搭計程車， 已知七人全上車。在不考慮做在車內位置的情形下，請選出正確選項。
  options:
  - label: A
    content: 搭乘方法共有$3^{7}$種
  - label: B
    content: 若$A$車載客3人，$B$車載客2人，$C$車載客2人，則搭乘方法共有$C_{3}^{7}C_{2}^{4}C_{2}^{2}$種
  - label: C
    content: 若此七人按照3、2、2人數搭乘，共有$\frac{C_{3}^{7}C_{2}^{4}C_{2}^{2}}{2！}\times 3！$種搭乘方法
  - label: D
    content: 若此七人有一對情侶，此對情侶自行坐一部車，共有90種搭乘方法
  - label: E
    content: 若限定每車至少要載一人，共有1890種搭乘方法
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
