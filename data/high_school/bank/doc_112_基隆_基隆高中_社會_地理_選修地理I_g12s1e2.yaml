  group_stem: '臺灣擁有豐富的自然及人文、生態環境，故陸續成立多座國家公園以保護這些珍貴的資源，包含墾丁、玉山、陽明山、太魯閣、雪霸、金門、東沙環礁、台江以及澎湖南方四島國家公園，各國家公園環境特色與保育對象不一。下表中Ⅰ～Ⅳ為本島 4 座國家公園：墾丁、陽明山、太魯閣和台江國家公園（未依序排列）的橫麥卡托二度分帶（TM2）坐標。請問：（第 33. 題 4 分，第 34. 題 6 分）

