    | N 坐標（m） | 2544844 | 2427868 | 2784815 | 2672604 |'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: E 坐標愈大愈東邊，N 坐標愈大愈北邊。因此可推知Ⅰ為台江國家公園（最西）、Ⅱ為墾丁國家公園（最南）、Ⅲ為陽明山國家公園（最北）、Ⅳ為太魯閣國家公園（最東）。行程活動提及「立霧溪」、「中橫公路」，可知為(D)Ⅳ太魯閣國家公園。
