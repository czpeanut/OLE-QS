- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 幾何空間與社會空間皆屬人生活的重要場域。下列哪 2 者屬於社會空間的描述？(甲)桃園國際機場占地 1,223 公頃(乙)虎頭山公園距離武陵高中 5.3 公里(丙)中壢區仁海宮與平鎮區褒忠祠共領中壢區、平鎮區和楊梅區十三庄祭祀圈(丁)桃園市中壢區居民稱呼自己為「中壢人」而非「桃園人」
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 乙丙
  - label: D
    content: 甲丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)社會空間乃依據人際關係所呈現的社會互動範圍，(丙)祭祀圈以及(丁)地方認同都屬於社會空間。(甲)(乙)為幾何空間。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下圖是以北極點「庚」為中心的地圖，圖中放射線線段為經線，同心圓線為緯線。依圖判斷，下列哪項空間描述的內容最為妥適？
  options:
  - label: A
    content: 庚位於丙的正東方
  - label: B
    content: 辛位於壬的 N45°W
  - label: C
    content: 甲在辛的北方
  - label: D
    content: 己位於庚的 180°
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 239.5
      - 322.25
      - 444.6
      - 522.3
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)庚為北極，地球上所有的點都位於北極的南方。(A)應為北方。(B)應為東方（北偏東 90 度）。(C)甲在辛的東方。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 地圖設計須符合幾項基本原則，包含主題的明確性、資料的分類分級、符號的選擇、地圖的配置，才能成為一張能讓使用者易於辨識的好地圖。下列何者為較適當的地圖設計原則？
  options:
  - label: A
    content: 面狀符號通常會以框線的粗細表示不同類別的資料
  - label: B
    content: 地圖的配置只影響美觀，並不會影響地圖的易讀性
  - label: C
    content: 將資料等量分級，可能會造成有些組別資料太少
  - label: D
    content: 比例尺愈小的地圖，內容概括化程度要愈高，以免出現過多細節影響判讀
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應改為線狀符號。(B)會影響易讀性。(C)等量分級即每組數量相同，因此不會有部分組別資料太少的問題。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 熱區地圖可以呈現一地理現象的集中趨勢，下列何者最適合以此類型地圖來呈現？
  options:
  - label: A
    content: 納莉颱風累積雨量
  - label: B
    content: 全臺灣數值高程模型
  - label: C
    content: 高雄市苓雅區的便利商店
  - label: D
    content: 全臺灣各縣市年平均溫度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 熱區圖可將點資料的分布狀態以連續現象呈現，因此(C)便利商店的分布即為點資料。(A)(D)適合等值線圖。(B)數值高程模型通常以網格資料呈現。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 地理資料的來源，包括第一手的現地測量資料，以及二手的文獻與統計資料、地圖與影像資料。下列對於地理資料的敘述，何者正確？
  options:
  - label: A
    content: 衛星影像除了可見光影像外，也常包含其他波段，可幫助分辨地物的類型
  - label: B
    content: 以 GNSS 定位工具獲取的 GPX 檔案可記錄移動路徑的軌跡，但成本高，一般人不易操作
  - label: C
    content: 來自臺灣方志網中的鄉鎮市區統計資料表格，可利用疊圖分析將資料匯入 GIS 圖層當中
  - label: D
    content: 日治時期的測繪技術屬山水圖繪方式，因此要避免以臺灣堡圖進行一地土地利用變遷的分析
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B) GNSS 的技術已普及，成本不高。(C)應適用資料連結。(D)日治時期的製圖已現代化，有坐標系統、投影系統與比例尺，因此可以做疊圖分析。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 空間資料中的面資料，可分為離散型與連續型 2 種。下列哪些資料屬於連續型資料？(甲)臺北市的行道樹數量與分布(乙)全球糧食危機等級與分布(丙)全臺空氣品質狀況(丁)臺灣年降水量分布(戊)宜蘭縣地下水位高度
  options:
  - label: A
    content: 甲乙丁
  - label: B
    content: 甲丙丁
  - label: C
    content: 丙丁戊
  - label: D
    content: 乙丁戊
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)(丙)空氣品質、(丁)年降水量與(戊)地下水位皆是連續性資料。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 近年有許多大型晚會利用無人機表演取代煙火，除了帶來創新的展演模式，對於環境永續更是友善。此外，無人機可搭載一般數位相機拍攝地面影像，且操作便利，適合即時研究調查。下列哪項研究，最適合使用無人機進行攝影調查？
  options:
  - label: A
    content: 登革熱確診病例的分布
  - label: B
    content: 高雄港百年來的景觀變化
  - label: C
    content: 估算參與抗議示威遊行的人數
  - label: D
    content: 全臺灣山區的保育類動物分布調查
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)登革熱確診病例無法用無人機拍攝出來。(B)無人機是新的技術，因此無法做「百年來」的景觀變化研究。(D)山區的保育動物需要人員長時間的觀察與記錄，較難以遙測影像拍攝。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 公眾參與式地理資訊系統（PPGIS）是由公民和政府共同使用各種 GIS 軟體或資料，進行公共事務的討論與決策。下列哪個事件或議題最符合「PPGIS」的基本定義？
  options:
  - label: A
    content: 社區民眾與守望相助隊討論社區安全死角後，繪製成地圖要求派出所加強巡邏
  - label: B
    content: 香港反送中運動中，示威民眾開發 App 以網路地圖即時回報、顯示港警的動向
  - label: C
    content: 海地發生地震後，世界各地圖客（mapper）使用開放街圖網站編輯救災用地圖圖資
  - label: D
    content: 天下雜誌彙整經濟部與環保署資料，發表違章農地工廠線上地圖提供大眾檢視
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) PPGIS 強調由下而上，以高度民眾參與的方式繪製社群所需的地圖，並以此地圖提供給政府請求改善現況。(B)(C)(D)為群眾製圖。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 「路殺社」是一群關心動物的人們組成的社團，號召民眾將被汽車輾斃的動物拍照上傳並記錄位置。經過將近 10 年的資料收集，發現路殺現象大多發生於都市或淺山地區，這些資料也被運用於生物棲地調查和生物多樣性評估等學術研究。路殺社的行動方案最適合用下列哪些概念加以解釋？(甲)公民科學(乙)智慧城市(丙)自發性地理資訊(丁)公眾參與式地理資訊系統
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丁
  - label: D
    content: 丙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)「公民科學」指參考一般民眾蒐集的相關數據所做的學術研究；「自發性地理資訊」指民眾利用網路及定位工具，主動或被動上傳位置資料。因此民眾上傳並記錄路殺地點，並以此延伸出生物棲地調查研究，屬於(甲)公民科學與(丙)自發性地理資訊。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 若要展現苗栗縣各鄉鎮每人平均薪資所得的空間資料，最適合以下列何種統計地圖呈現？
  options:
  - label: A
    content: 點子圖
  - label: B
    content: 面量圖
  - label: C
    content: 等值線圖
  - label: D
    content: 分層設色圖
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)面量圖適合用在有明確邊界的情況下，比較各區數值的大小差異。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 零售業和服務業在進行選址時，通常會收集人潮流動的數據、與大眾交通工具的距離、同業競爭家數等，以確保獲利。下圖為研究者以德國東南部的弗賴拉辛（Freilassing）車站為核心，模擬從該車站向外步行 5 分鐘、10 分鐘與 15 分鐘的範圍，以作為車站商圈範圍規劃的參考。若要獲得圖中的空間範圍，最適合運用哪項空間分析？
  options:
  - label: A
    content: 地形分析
  - label: B
    content: 疊圖分析
  - label: C
    content: 環域分析
  - label: D
    content: 服務區分析
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2/s1_11_f1.png
    crop:
      page: 2
      rect:
      - 239.4
      - 619.0
      - 444.7
      - 799.1
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 該圖是以車站為中心，向外步行 5 分鐘、10 分鐘的範圍，屬於路網分析中的(D)服務區分析。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 請問下列何者為分析一地土壤液化潛勢所需要的圖資？(甲)活動斷層分布(乙)地下水位高度(丙)土壤質地(丁)順向坡分布
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 土壤液化容易出現在地下水位高處，且容易在地震後發生液化現象，又土壤質地的大小會影響土壤的保水性，因此土壤液化潛勢需要(A)(甲)(乙)(丙)。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 下列哪些 App 應用會使用到適地性服務（LBS）技術？(甲) Uber Eats 搜尋鄰近提供外送服務的店家(乙)口罩地圖即時提供附近藥局口罩數量查詢(丙)利用 Agoda 旅宿預訂，尋找距離 1 公里內的民宿(丁) Qibla 羅盤尋找朝向麥加禮拜的方向
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 甲丙丁
  - label: D
    content: 乙丙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 適地性服務指以消費者所在的位置資訊，提供其就近的商品或服務。(丁)僅為方位的查詢。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 青青推著輪椅帶母親出門，常苦於尋找可用的廁所，因此架設一個電子地圖網路平臺，讓民眾一起在平臺中標註可提供如廁服務的地點，並註明是否具備無障礙設施與衛生評級。上述架設網路平臺蒐集資料的作法，最符合下列哪個概念？
  options:
  - label: A
    content: 公民科學
  - label: B
    content: 群眾製圖
  - label: C
    content: 自願性地理資訊
  - label: D
    content: 公眾參與式地理資訊系統
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中提及「讓民眾一起在平臺中標註可提供如廁服務的地點」可知為(B)群眾製圖。
- id: doc_112_基隆_基隆高中_社會_地理_選修地理I_g12s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 在冬季至春季之間，中國西北與蒙古一帶，時常有大量細顆粒的揚塵被帶至高空，受西風氣流向東傳，引發東亞等國的空氣汙染，稱之為沙塵暴。若某生想要研究生成沙塵暴來源地的環境特徵，最適合使用下列哪些圖資？(甲)衛星影像(乙)工廠分布圖(丙)土地利用圖(丁)數值地形模型
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '中國的沙塵暴主要來自西北、北部和東北三處沙漠化的地區，通常是因為過度放牧導致土地退化，因此適合使用(A)(甲)衛星影像圖及(丙)土地利用圖作為圖資。

    16.15：30 時汙染物濃度較高之處位於北部，23：30 則移動至西南部，因此當天應該是(A)吹東北風將北部汙染物質往南部吹送。

    17.經濟發展程度較高地區較容易有糧食浪費的問題，因此選(C)韓國。

    18.(A)社會經濟資料服務平臺是以「最小統計區」作為人口分布的統計單元。(C)依據內文 Google 地圖可以檢視「特定地點人潮資訊」，但無法檢視「捷運站進出站人數」。(D)應改為環域分析。

    19.該圖是利用手機使用者的定位資料計算出的人潮流量，亦即手機使用者主動或被動上傳位置資料的(D)自發性地理資訊。

    20.1960 年代印度實施農業的綠色革命，主要內容為：使用品改種子、大規模灌溉系統、使用化肥與農藥，故選(D)(丙)(丁)。

    21.(C)吃當季與在地的食材可減少從國外運送至國內的糧食數量，因此可以(乙)降低食物里程進而(丁)減少能源耗費。

    22.「糧食危機」指有人無法獲得足夠食物，當中以「饑荒」糧食嚴重短缺最為嚴重。(B)造成糧食短缺的原因為：(甲)區域衝突戰爭導致良田荒廢、(丁)經濟衰退使糧食價格上升、(戊)氣候變遷使糧食產量下降等。

    23.依據圖例，圖中澳洲、美國、中國都是「種植基改作物」的地區，日本則是「未種植基改作物」，因此最有可能從(D)日本進口非基改大豆。

    24.(A)南美洲的農業區位沒有靠近主要市場。(B)多數採取粗放耕種，勞力成本較低。(D)作物種類較為單一。

    25.依據題幹，糧食損失是甲～乙的步驟，漠南非洲、南亞與東南亞這 2 個區域在糧食損失占比較大，而這些區域發展程度較低，平均每人獲得的糧食量較低，因此(D)平均每人攝取熱量也會較低。

    26.文中提及「因規格、外觀不符合市場標準而被淘汰的農產品」，因此選(A)甲丙丁。

    27.此為平面地圖，因此是(B)二維空間。

    28.(D)依據圖中箭頭顯示，大福漁港站發車的車子是向右、向上再向左行駛，因此是逆時針。

    29.由文中提及「大氣環流穩定」、「不利空氣汙染物擴散」可知臺灣當時的天氣系統應為(B)高氣壓。

    30.臺灣的空氣汙染來源分為境內汙染物和境外汙染物，前者主要是國內的火力電廠、汽車或製造業廢氣所致，後者則主要為中國北部製造業的汙染物。由 29.題可知當天的高壓中心在太平洋上，應為夏季。冬季吹東北季時才容易將中國華北汙染物帶至臺灣，故選(C)。

    31.圖中住宅竊盜的地點以地址呈現，若要展示在地圖上需先經過(B)地理編碼對應到空間坐標，才能將竊盜案地點顯示在地圖上。

    32.(C)熱區地圖是將點資料轉換成連續性的分布狀態，可得知該資料在空間中的分布趨勢。'
