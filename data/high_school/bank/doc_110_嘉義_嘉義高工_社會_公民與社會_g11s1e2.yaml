    labeled_by: agent
    label_confidence: high
    label_note: 選項B有亂碼（「費者剩餘」應為「消費者剩餘」）
    fixed_by: agent
    fix_note: （人工修正：修補選項D錯字「福祉」，補齊解答與解析）
