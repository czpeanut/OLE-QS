  type: single
  page: 1
  stem: 市場經濟制度的支持者主張，當資源配置所產生的經濟福祉最大化時，則此配置方式具有經濟效率。關於經濟效率、消費者剩餘與生產者剩餘等概念，以下敘述何者「錯誤」？
