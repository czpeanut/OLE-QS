  stem: 已知隨機變數X之期望值E(X)＝3，E($X^{2}$)＝25，試選出正確的選項。
  options:
  - label: A
    content: σ(X)＝4
  - label: B
    content: Var(X)＝E($X^{2}$)＝25
  - label: C
    content: E (－5X＋3)＝－12
  - label: D
    content: σ (－5X＋3)＝－20
  - label: E
    content: σ ( 2X＋5 )＝13
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：σ (X)＝$\sqrt{E(X^{2})-(E(X))^{2}}$＝$\sqrt{25-3^{2}}$＝4。 (B) ×：Var(X)＝E($X^{2}$)－(E(X))$^{2}$＝25－$3^{2}$＝16。 (C) ○：E (－5X＋3 )＝－5E(X)＋3＝－5×3＋3＝－12。 (D) ×：σ(－5X＋3 )＝｜－5｜σ(X)＝5×4＝20。 (E) ×：σ ( 2X＋5 )＝2σ (X)＝2×4＝8。 故選(A)(C)。
