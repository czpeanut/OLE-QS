  stem: 投擲一枚不均勻硬幣，出現正面的機率為$\frac{3}{4}$，出現反面的機率為$\frac{1}{4}$。今丟擲此硬幣5次，若X表示出現正面的次數，則下列敘述何者正確？
  options:
  - label: A
    content: X＝1的機率為$\frac{15}{512}$
  - label: B
    content: X＝2的機率小於X＝3的機率
  - label: C
    content: X＝3的機率最大
