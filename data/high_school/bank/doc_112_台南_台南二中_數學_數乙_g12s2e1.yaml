    content: X的期望值為$\frac{15}{4}$
  - label: E
    content: X的標準差為$\frac{\sqrt{15}}{4}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 此為X～B ( 5 , $\frac{3}{4}$ ) (A) ×：P ( X＝1 )＝$C_{1}^{5}\cdot \frac{3}{4}\cdot ( \frac{1}{4} )^{4}$＝$\frac{15}{1024}$。 (B) ○：P ( X＝2 )＝$C_{2}^{5}\cdot ( \frac{3}{4} )^{2}\cdot ( \frac{1}{4} )^{3}$＝10．$\frac{9}{4^{5}}$ P ( X＝3 )＝$C_{3}^{5}\cdot ( \frac{3}{4} )^{3}\cdot ( \frac{1}{4} )^{2}$＝10．$\frac{27}{4^{5}}$ ∴ P ( X＝2 )＜P ( X＝3 )。 (C) ×：考慮X＝( n＋1 )．P＝( 5＋1 )×$\frac{3}{4}$＝$\frac{9}{2}$ ∴ P ( X＝4 ) 機率最大 事實上，P ( X＝4 )＝$C_{4}^{5}\cdot ( \frac{3}{4} )^{4}\cdot ( \frac{1}{4} )$＝$\frac{405}{4^{5}}$＞P ( X＝3 )＝$\frac{270}{4^{5}}$。 (D) ○：E (X)＝np＝5×$\frac{3}{4}$＝$\frac{15}{4}$。 (E) ○：σ (X)＝$\sqrt{np ( 1-p )}$＝$\sqrt{5\times \frac{3}{4}\times \frac{1}{4}}$＝$\frac{\sqrt{15}}{4}$。 故選(B)(D)(E)。
