  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：反例：a＝1＋i，b＝i－1 a＋bi＝1＋i＋i ( i－1 )＝1＋i－1－i＝0。 (B) ○：c＋di＝5＋2i ∵ c，d∈R ∴ c＝5，d＝2。 (C) ×：反例：a＝1，b＝i，$1^{2}$＋$i^{2}$＝1－1＝0。 (D) ○：∵ c＞d ∴ d－c＜0，$\sqrt{( d-c )}$＝$\sqrt{( c-d ) (-1 )}$＝$\sqrt{c-d}$．i。 (E) ○：bi＝0，b．i．i＝0．i ⇒ －b＝0 ⇒ b＝0。 故選(B)(D)(E)。
