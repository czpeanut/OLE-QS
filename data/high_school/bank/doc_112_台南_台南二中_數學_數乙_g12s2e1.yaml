  stem: 關於複數的運算和性質，試選出正確的選項。
  options:
  - label: A
    content: $\sqrt{- 7}$×$\sqrt{- 2}$＝$\sqrt{14}$
  - label: B
    content: $\frac{\sqrt{- 7}}{\sqrt{2}}$＝$\frac{\sqrt{7}}{\sqrt{- 2}}$
  - label: C
    content: '| 10＋2i | ＞ | 3＋2i |'
  - label: D
    content: 10＋2i ＞ 3＋2i
  - label: E
    content: $\sqrt{- 7}$×$\sqrt{- 2}$×$\sqrt{- 3}$＝－$\sqrt{- 42}$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：$\sqrt{-7}$×$\sqrt{-2}$＝$\sqrt{7}$i×$\sqrt{2}$i＝$\sqrt{14}i^{2}$＝－$\sqrt{14}$。 (B) ×：$\frac{\sqrt{-7}}{\sqrt{2}}$＝$\frac{\sqrt{7}}{\sqrt{2}}$i，$\frac{\sqrt{7}}{\sqrt{-2}}$＝$\frac{\sqrt{7}}{\sqrt{2} i}$＝－$\frac{\sqrt{7}}{\sqrt{2}}$i ∴$\frac{\sqrt{-7}}{\sqrt{2}}$≠$\frac{\sqrt{7}}{\sqrt{-2}}$。 (C) ○：｜10＋2i｜＝$\sqrt{10^{2}+2^{2}}$＝$\sqrt{104}$，｜3＋2i｜＝$\sqrt{3^{2}+2^{2}}$＝$\sqrt{13}$ ∴｜10＋2i｜＞｜3＋2i｜。 (D) ×：10＋2i＞3＋2i，錯，複數不能比大小。 (E) ○：$\sqrt{-7}$×$\sqrt{-2}$×$\sqrt{-3}$＝$\sqrt{7}$i．$\sqrt{2}$i．$\sqrt{3}$i＝$\sqrt{42}i^{3}$＝－$\sqrt{42}$i，－$\sqrt{-42}$＝－$\sqrt{42}$i ∴$\sqrt{-7}$×$\sqrt{-2}$×$\sqrt{-3}$＝－$\sqrt{-42}$。 故選(C)(E)。
