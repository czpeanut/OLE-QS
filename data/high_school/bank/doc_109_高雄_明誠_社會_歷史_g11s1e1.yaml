  stem: '八世紀時羅馬教會希望得到法蘭克人支持。在矮子丕平時，兩者結盟的條件成熟。西元751年教宗查克里亞斯已同意丕平取得王號。教宗史蒂芬二世於西元753年親自赴高盧訪問丕平，雙方締結同盟。在丕平擊敗倫巴底人後，丕平將取得的義大利中部等地，交付羅馬教宗，此即為「丕平的捐贈」，時在西元756年，被認為教宗國成立之年。矮子丕平的兒子查理曼，於西元774年加冕為倫巴底人的王，又於西元800年加冕為羅馬皇帝。 後來教廷為了強化其塵世間的統治地位，又提出<u>君士坦丁的捐贈</u>，指出西元315年羅馬皇帝君士坦丁已簽署諭令，將羅馬城、義大利和西部諸省都贈給了教宗及他之後的伯多祿的繼承人。此一詔令在十一〜十五世紀一直屢屢被提及，如十一世紀的教宗里奥九世致君士坦丁主教信件中，已經將之視為真實文件引用了。不過，此一文件在文藝復興時代為人文學者瓦拉考證其為偽作，因文件中包含甚多八世紀的語法及修辭。

