  stem: ★一本有關文藝復興的書中介紹：「中古時期已有許多因素為文藝復興立下豐厚基礎，六世紀以來修道院對於文物的保存有助於知識的累積，十二到十四世紀之間修道院或是大學中的修士、學者對古代知識的傳抄、講授也有助於文化的交流和存續。十五世紀活版印刷術出現之後，文化的傳播更加快速，刺激文藝復興的蓬勃發展。」由上所述可判斷十五世紀以前的文化保存、流傳方式主要為何？
