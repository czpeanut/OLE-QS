- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '下表關於向量與網格模式之應用狀況，何者最適合？

    |  | (A)精準地籍圖建檔 | (B)下水道規劃 | (C)空氣汙染監測 | (D)影像處理 |

    | --- | --- | --- | --- | --- |

    | 向量模式 |  |  | ˇ |  |

    | 網格模式 | ˇ | ˇ |  | ˇ |'
  options:
  - label: A
    content: 精準地籍圖建檔（網格模式：ˇ）
  - label: B
    content: 下水道規劃（網格模式：ˇ）
  - label: C
    content: 空氣汙染監測（向量模式：ˇ）
  - label: D
    content: 影像處理（網格模式：ˇ）
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)影像檔的儲存與處理皆使用網格模式。(A)地籍圖與(B)下水道規劃需要精準定位，適合使用向量資料儲存。(C)空氣汙染的分布無明顯邊界，適合使用網格模式儲存。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 常用之地理資訊的分析方法有：(甲)地勢分析(乙)環域分析(丙)視域分析(丁)疊圖分析。若臺北市警局欲實施以各分局派出所為中心的 50 公尺距離，配合各道路的路口、巷弄的位置，做為防搶勤務人員配置的依據，則採取哪些分析較合適？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丁
  - label: C
    content: 丙丁
  - label: D
    content: 甲丙
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)題幹中描述，以各分局「為中心的 50 公尺距離」屬於(乙)環域分析，「配合各道路的路口、巷弄的位置」為(丁)疊圖分析。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小華從中央災害應變中心找到的資料有：(甲)道路圖(乙)空照圖(丙)照片拍攝位置圖(丁)災區土地利用分析圖(戊)斷層分布圖。其中適合以「向量模式」表現的有哪 3 項？
  options:
  - label: A
    content: 甲丙丁
  - label: B
    content: 甲丙戊
  - label: C
    content: 甲丁戊
  - label: D
    content: 丙丁戊
  answer:
  - A
  - B
  - C
  - D
  review_note: 解答卷：本題送分
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)道路圖、(丙)相片拍攝位置圖、(丁)災區土地利用分布圖、(戊)斷層分布圖皆可使用向量模式儲存與展示。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「目前部分房屋仲介業將街道資料電腦化，並且結合所仲介房屋的基本資料，讓消費者在電腦螢幕前能夠利用簡單的操作介面，以拖曳地圖、圈選區域或捷運站，或是設定想購買房屋的各種條件，如(甲)<u>屋型、價位</u>等，電腦即可依照消費者需求，篩選出合適的房屋，並結合(乙)<u>地圖</u>以及(丙)<u>房屋內部影像</u>，供消費者在家即可了解(丁)<u>房屋的位置</u>及屋況等訊息。」敘述中，屬於「屬性資料」的項目為何？
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(甲)房屋的屋型、價位與(丙)內部的影像，不包含空間資訊，屬於屬性資料。(乙)與(丁)的資料中包含位置資訊，為空間資料。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 若要利用地理資訊系統繪製出臺灣三度空間地形圖，應使用下列哪二種空間資料儲存方式及進行何種空間分析？(甲)向量模式(乙)網格模式(丙)最佳路徑分析(丁)環域分析(戊)地勢分析(己)疊圖分析
  options:
  - label: A
    content: 甲丁
  - label: B
    content: 乙戊
  - label: C
    content: 乙丙
  - label: D
    content: 甲戊
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(乙) GIS 利用網格模式儲存並分析地表的高程（三維）資訊，例如數值地形模型；(戊)地勢（地形）分析是 GIS 當中，用來分析地形高程的重要功能。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: (乙)劃線部分的敘述是指可以利用何種功能？
  options:
  - label: A
    content: 空間查詢
  - label: B
    content: 最佳路徑分析
  - label: C
    content: 環域分析
  - label: D
    content: 疊圖分析
  group_stem: 美國北卡羅來納州的溫薩市，當市內一地火災警報響起，火災地點會透過無線電傳到消防車上的電腦，消防人員以(甲)技術呈現到達目的地的最佳路徑，到達現場前，消防員可在電腦螢幕上以(乙)<u>方式了解災區附近的消防栓分布位置</u>以及各消防栓的水容量，同時也可得知災區的建築物平面圖、緊急出口、水管、瓦斯管線等(丙)儲存資料，如此便可及時判斷須緊急疏散的地區以及救災的先後順序。請問：
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)利用電腦查詢並顯示災區周遭的消防栓位置，應為空間查詢。(B)最佳路徑分析為查詢兩地之間交通時間最短的路徑，應為題組題幹中的(甲)。(C)環域分析是以一地為中心，劃設周圍一定範圍的區域。(D)疊圖分析是將多張同一地、比例尺、投影方法相同的地圖交疊，進行的分析。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: (丙)的儲存模式具有下列哪一項特徵？
  options:
  - label: A
    content: 輸入資料少、省時
  - label: B
    content: 適合衛星影像的處理
  - label: C
    content: 具備高精確度，適合路網分析
  - label: D
    content: 適合地表分布呈現連續狀態的現象
  group_stem: 美國北卡羅來納州的溫薩市，當市內一地火災警報響起，火災地點會透過無線電傳到消防車上的電腦，消防人員以(甲)技術呈現到達目的地的最佳路徑，到達現場前，消防員可在電腦螢幕上以(乙)<u>方式了解災區附近的消防栓分布位置</u>以及各消防栓的水容量，同時也可得知災區的建築物平面圖、緊急出口、水管、瓦斯管線等(丙)儲存資料，如此便可及時判斷須緊急疏散的地區以及救災的先後順序。請問：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)向量資料的定位精度高，為道路、管線常用的資料儲存方式，也常用作路網分析（最佳路徑分析）的資料。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某學校長方形操場面積 40,000 平方公尺，需要幾個像元才能完全涵蓋？
  options:
  - label: A
    content: 4,000
  - label: B
    content: 10,000
  - label: C
    content: 20,000
  - label: D
    content: 40,000
  group_stem: 遙測衛星影像的解析度代表一個像元（pixel）涵蓋地面範圍的邊長，於 2003 年底升空的中華衛星二號，其影像解析度可達 2 公尺。請問：
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 一格像元的解析度為 2 公尺 × 2 公尺，可以涵蓋 4 平方公尺的地表，某學校操場面積為 40,000 平方公尺，則以 40,000 平方公尺／4 平方公尺＝(B) 10,000 個像元。
- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 目前普遍使用的法國 SPOT 衛星（解析度 10 公尺），其資料量為華衛二號資料的幾倍？
  options:
  - label: A
    content: 25 倍
  - label: B
    content: 4 倍
  - label: C
    content: 0.25 倍
  - label: D
    content: 0.04 倍
  group_stem: 遙測衛星影像的解析度代表一個像元（pixel）涵蓋地面範圍的邊長，於 2003 年底升空的中華衛星二號，其影像解析度可達 2 公尺。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 華衛二號的解析度為 2 公尺 × 2 公尺，法國 SPOT 衛星解析度為 10 公尺 × 10 公尺，以一個像元大小計算，華衛二號為 4 平方公尺，SPOT 衛星為 100 平方公尺，故 SPOT 衛星的資料量應為華衛二號的(D) 0.04 倍。
