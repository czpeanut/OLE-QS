  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)甲地為軟硬岩互層的地質構造，當軟岩快速被侵蝕崩塌後，會形成陡峭的崖壁，而硬岩因侵蝕速度較慢，會形成較緩的坡面，最後發育出單面山地形。
