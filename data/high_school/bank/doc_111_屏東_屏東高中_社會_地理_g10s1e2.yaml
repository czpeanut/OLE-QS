- id: doc_111_屏東_屏東高中_社會_地理_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: GIS 中，空間資料經數位化後，可以以向量或網格模式儲存。請問以下敘述何者「錯誤」？
  options:
  - label: A
    content: 向量模式中，以點坐標（X，Y）來表示
  - label: B
    content: 網格模式是由許多規則排列的小方格（grids）表示。方格愈小，表示資料解析度愈小
  - label: C
    content: 水電、瓦斯管線分布，多採向量模式儲存
  - label: D
    content: 對具有連續特性的實體，以網格模式較適用
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)網格模式是由許多小方格表示，方格愈小，則解析度愈高，資料量愈大，看得愈清楚，例如：Worldview 衛星的解析度為每格 30 公分 × 30 公分，可以看到很細部的地表狀態，SPOT 衛星的解析度為 10 公尺 × 10 公尺，則無法看到細部的地表狀態。
