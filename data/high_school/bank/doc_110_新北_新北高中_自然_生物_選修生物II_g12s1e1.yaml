  stem: 若於實驗中，逐步減少土壤中離子濃度的添加，則可將此曲線往左延伸製圖，請問依此方法進行的話，該曲線是否會通過原點？原因為何？
  options:
  - label: A
    content: 會；因沒有添加離子，則沒有根壓
  - label: B
    content: 會；雖然沒有添加離子，但還是有根壓
  - label: C
    content: 不會；因沒有添加離子，則沒有根壓
  - label: D
    content: 不會；雖然沒有添加離子，但還是有根壓
  group_stem: 根壓，為植物推動木質部中水溶液往上運輸的動力之一，測量根壓的方式為剪斷靠近地面的莖部，並用橡皮管與玻璃管連結如圖(I)，剛開始時管內液面會有一上升高度（$h^{a}$），此時因根壓持續作用，故液面會逐漸上升至某一高度後（$h^{b}$）便不再上升了，而液面差（$h^{b}$－$h^{a}$）的壓力即為根壓。 根壓的形成，主要是由植物根部藉由主動運輸的方式提升滲透壓，引起水分滲透進入根部，形成推擠的壓力。由此可知，滲透壓為影響根壓的關鍵因子，而滲透壓主要是由離子濃度來決定，然而我們很好奇土壤離子濃度與根壓兩者關係為何？因此，我們藉由控制土壤中的離子濃度，來觀察根壓的大小，藉此推論兩者的關係，結果如圖(II)。請依內容說明，回答以下問題。
  shared_asset: g3_58_60
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 未於土壤中添加離子時，根部細胞與土壤間亦具有滲透壓差。
