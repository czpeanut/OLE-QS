  stem: 以前在台灣高中以下的學生，若因為學校教育或管理時受到不妥當或是違法侵害時，本來只能循校內申訴管道進行救濟。2019年10月25日，大法官做出釋字第784號解釋：本於憲法第16條保障人民訴訟權之意旨，各級學校學生認其權利因學校之教育或管理等公權力措施而遭受侵害時，即使非屬退學或類此之處分，亦得按相關措施之性質，依法提起相應之行政爭訟程序以為救濟，無特別限制之必要。請問上述改革落實了憲法保障人民的何種權益？
