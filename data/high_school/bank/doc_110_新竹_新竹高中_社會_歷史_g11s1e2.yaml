  group_stem: ◎資料一：我們的聚餐，顧名思義，就知道它的目的，它的希臘文名字是指「愛」。……坐定後，大家先禱告。他們吃飯，吃飽為止；他們喝酒，盡量而飲。他們宴飲，卻常記得還要通宵敬拜天主；他們談話，但亦知道天主就在聆聽。……如果它真是像一些非法的聚會，那麼，它就應該被視為非法的；如果他真像某些秘密社團一樣被人指責，那麼，它就應該被禁止。可是，我們曾經為了要對付誰而聚會呢？我們聚會時如此，散會後亦是如此；我們團體如此，個人亦是如此，不傷人，不害人。 資料二：你處理被告基督徒的方式是很正確的；……不應搜捕這班人；如果他們受人檢舉而證明屬實，則理應受罰；但應有這個限制；如被告否認為基督徒，而以崇拜我們的神來證明，他既悔過，就應免罪，雖然過去或有嫌疑。無名控告不能用為證據來反對任何人，否則，將開啟一個危險的先例，不適合我們時代的精神。
