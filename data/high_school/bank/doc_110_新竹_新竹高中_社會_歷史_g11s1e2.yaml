- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「當時天主教使用的《聖經》多半為拉丁文，只有神父與熟悉拉丁文的讀者才可以理解，所以馬丁‧路德必須要將《聖經》譯為德文，使能讀德文者皆可直接了解《聖經》，不必仰賴「聖品人」的解說。路德譯經非常嚴謹，在翻譯經文時，字斟句酌，力求合乎原文，但並不死譯，無論增一字或減一字，務求凸顯經意。」根據以上短文，我們可以判斷馬丁‧路德掀起的宗教改革，可能有什麼樣的情形或影響？
  options:
  - label: A
    content: 路德傳教的區域應該以義大利地區為主
  - label: B
    content: 路德的翻譯新增了他對神學的大量見解
  - label: C
    content: 宗教改革的結果促使拉丁文流傳更廣泛
  - label: D
    content: 路德教派的流行應能帶動當地的識字率
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「美國立國的成功，雖有其地理環境、歷史及國際處境的理由，但重要的是其□制度。□的落實在於統治權分屬中央與州政府：屬於中央的權力，諸如鑄幣、宣戰等；有些權力為州政府所保留，如控制州內貿易、設立選舉資格等。也有共享權力，包括支援教育、推動法令等。」上文為討論美國立國制度的特點，請問根據文意與歷史知識，□應填入下列何者？
  options:
  - label: A
    content: 三權分立
  - label: B
    content: 聯邦主義
  - label: C
    content: 選舉投票
  - label: D
    content: 人權保障
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有人如此解釋伊斯蘭曆元年的意義：「遷徙在穆斯林的歷史中佔有如此榮耀的地位是因為它標誌著穆斯林社群─烏瑪（the Umma）的誕生，在遷徙前穆罕默德只是一個擁有個體追隨者的傳道者，但遷徙之後他成了社群共同體的領導人，烏瑪的意義就在於要建立一個社會來代替穆罕默德童年時各自為政的社會……改信伊斯蘭教意味著加入一個精神性的社會計劃：建立一個公正平等的社群。」請問文章所述的遷徙之後的地點是指何地？而伊斯蘭五功的哪一項較有助於實踐烏瑪的意義？
  options:
  - label: A
    content: 麥加，禮
  - label: B
    content: 麥地那，課
  - label: C
    content: 耶路撒冷，朝
  - label: D
    content: 巴格達，齋
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一封來自東方的信規劃著在亞洲貿易的內容： ˙固佳拉特（印度西部）的布匹，可以拿來在蘇門答臘（印尼西部大島）的海岸交換胡椒與黃金； ˙印度西部海岸的銀幣（rials）與棉貨，可以拿來在萬丹（印尼爪哇島西部）交換胡椒； ˙可以用印度南部的檀香木、胡椒與銀幣來交換中國商品與中國的黃金； ˙可以藉由中國的商品把白銀從日本弄出來； ˙用來自科羅曼德爾海岸（印度半島東南部）的布匹以交易香辛料、其他商品與來自中國的黃金； ˙以來自蘇拉特（印度西部大城）的布匹交易香辛料、其他商品及銀幣； ˙以來自阿拉伯的銀幣交換香辛料及其他形形色色的小東西。 所有這一切都不用我們出錢即可辦到，只要有船！ 根據上文內容，這應是出自何時何人的書寫？
  options:
  - label: A
    content: 七世紀，阿拉伯的穆斯林商人
  - label: B
    content: 十五世紀，葡萄牙在澳門總督
  - label: C
    content: 十七世紀，荷蘭東印度的總督
  - label: D
    content: 十九世紀，法屬印度支那總督
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 十九世紀某位重要的思想家提出：「在過去的各個歷史時代，我們幾乎到處都可以看到社會完全劃分為各個不同的等級，看到社會地位分成的多種多樣的層次。但是，我們的時代，資產階級時代，卻有一個特點：它使階級對立簡單化了。整個社會日益分裂為兩大敵對的陣營；資產階級和無產階級。」請問該思想家對於改造世界的看法為何？
  options:
  - label: A
    content: 須用暴力推翻現存的社會制度達成目的
  - label: B
    content: 相信透過教育人類能夠以合作取代競爭
  - label: C
    content: 型塑民族的共同意識以消弭階級的對立
  - label: D
    content: 認為可在自由民主憲政下實現社會主義
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 資料一：我一直想作一個神學家，但長久以來心中始終深感不安，現在我總算能安身立命了，因為我終於了解在我的天文學研究中，上帝的偉大力量其實已展現無遺。 資料二：太陽、行星、衛星組成最美麗的系統，這樣的系統只能為理性與強大的「存有」（Being，意指上帝）所孕育，並受其統治。……而為了避免恆星系統因為重力而相互吸引撞擊，「存有」已經將這些恆星系統，相互區隔在極大的距離之外了。……所有人類在不同時空與地點所發現的多樣自然之物，都從「存有」的思想與意志衍生而來。 上文是科學革命時期兩位科學家的看法。請綜合兩則資料，說明兩位學者的共同看法？
  options:
  - label: A
    content: 在科學與神學產生衝突時，應以科學事實為依歸
  - label: B
    content: 科學家逐漸脫離神學束縛，建立起科學的無神論
  - label: C
    content: 藉由自然科學的研究，得以理解上帝造物的偉大
  - label: D
    content: 科學為神學的婢女，應該以神學為基礎解釋科學
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 資料一：「水乃世界萬物之源。」 資料二：「人、神、自然本為一體，神是宇宙靈魂與智慧，理性滲透整個宇宙。人的理性來自神的理性，所以順著理性，人生目的便是追求最高道德與心靈寧靜。」 資料三：「世界分為真實的感官界與超越感官外的觀念世界，人所追求的是善的最高觀念。」 資料四：「世上萬事萬物都要有另一個事物作為它的原因。那麼必然存在一個最初的原因，這個原因就是上帝。」 以上有四段分屬不同時代的哲學，依照它們所代表的時代排序，何者正確？
  options:
  - label: A
    content: 三→一→四→二
  - label: B
    content: 三→二→一→四
  - label: C
    content: 一→三→二→四
  - label: D
    content: 一→二→三→四
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 資料一：國王亨利，致書偽教宗、假修士之希爾德布朗。這是你應得的稱呼，因為你不論掌何職守，其結果都不是榮譽或幸福，而是混亂。……你甚至以罷免來威脅，好像我們是從你手取得的，又好像帝國和王國是操於你的手、而非來自天主的。……我亨利，藉天主聖寵而為國王，偕同所有主教，對你說：「滾下來，滾下來；讓你遺臭萬年！」 資料二：我決心悔過，我許諾在一切事上服從宗座，和你教宗格列哥里；我決心悔過，並賠償宗座及你所受榮譽上的損失。 以上兩則資料是神聖羅馬帝國皇帝（亨利四世）致教宗（格列哥里）的書信，請推測從資料一到資料二中間發生什麼事情？
  options:
  - label: A
    content: 教廷響應教會的改革，脫離皇帝控制
  - label: B
    content: 教廷開除皇帝的教籍，貴族支持教廷
  - label: C
    content: 皇帝罷黜教宗的職位，貴族支持皇帝
  - label: D
    content: 皇帝支持教廷的正統，實現政教合作
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 資料一：天選之人不能確定自己將會得救，但天選之人在社會上負擔重責大任，在工作上有傑出表現，在世間的榮耀是來自天命，如果人能奮發努力、篤信基督、服從教會領導、認真祈禱與行善，並在工作上有所成就，就是「天選之人的外在跡象」，所以信徒應該專一虔誠、勤儉致富，鄙視浪費與懶散。 資料二：我日以繼夜地思索『上帝的義』問題，直到我看出它與「義人必因信得生」的關係，上帝通過恩典和憐憫使我們因信稱義。我立時感到自己已得重生，樂園的門大開，讓我進入。《聖經》的一切話語有了新意義，從前『上帝的義』令我聞而生厭，現在它使我在更大的愛中有說不出的甜蜜。 以上兩段資料是十六世紀歐洲的宗教家對基督信仰的看法，請問資料一、二依序代表了哪兩種派別？
  options:
  - label: A
    content: 喀爾文教派；路德教派
  - label: B
    content: 路德教派；喀爾文教派
  - label: C
    content: 喀爾文教派；英國國教
  - label: D
    content: 英國國教；路德教派
