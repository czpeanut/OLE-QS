- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「在<u>希臘</u>人中，皇位既然已虛懸，而竊據皇權者又為一婦人，<u>教宗</u>、所有參與會議人士，以及全體基督教民等，一致公認<u>法蘭克王</u>既已統治歷代京畿羅馬、義大利諸城、高盧、日耳曼等地，理應被立為皇帝。全能天主既以如此疆域置其權下，他們都一致承認，藉天主助佑，並應全體基督教民之請，他得此<u>首位</u>極為合適……。」上面是一份關於天主教歷史的材料，關於該史料的解讀，下列何者正確？
  options:
  - label: A
    content: 希臘人是指東羅馬帝國
  - label: B
    content: 教宗是與皇帝發生衝突的格列哥里七世
  - label: C
    content: 法蘭克王是指矮子丕平
  - label: D
    content: 首位所指的是神聖羅馬帝國的皇帝
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 資料一：此部法典保障了私有財產權與契約自由，對過失責任也詳加規範，甚至保障長期以來受到迫害的猶太人。 資料二：該憲法特色為確立三權分立，行政權由國王負責，立法權由立法會議負責，司法權由各級法院負責，並以《人權宣言》為憲法序言。 資料三：該領袖提到「如果和平時期民主政府的泉源是美德，那麼革命時期的泉源應該同時是美德和恐怖；沒有恐怖的美德無異於自取滅亡，而沒有美德的恐怖即顯軟弱無力。恐怖實與迅速、嚴厲、不打折扣的正義無異，等於是美德的發揮。恐怖並不是一個特殊原則，而是民主的普遍性原則應用到國家最迫切的情況中所造成的結果。」 以上三則資料為討論法國大革命不同時期的史料，請說明資料一、二、三所討論的時期為何？
  options:
  - label: A
    content: 拿破崙執政；國民會議；國民公會
  - label: B
    content: 拿破崙執政；三級會議；國民會議
  - label: C
    content: 國民會議；三級會議；拿破崙執政
  - label: D
    content: 國民公會；國民會議；拿破崙執政
- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 貝卡利亞：「君權和法律，他們往往是一份份少量私人自由的總合。然而，有誰願意把對自己的生死予奪大權奉予別人操使呢？每個人在對自由做最小犠牲時怎麼會把冠於一切財富之首的生命也搭進去呢？」 盧梭：「社會契約的目的是保障契約各方的生存。為了這一目的，人也就必須有相應的手段。……。刑事犯罪的死刑也能以相同的理由來看待。為了不成為謀殺的受害者，每個人就必須同意，一旦他自己成了謀殺犯，他就得償命。這遠不再是放棄生命了，而是他認為這是使生命更安全的方法。」 根據以上兩位啟蒙哲士對死刑以及社會契約的看法，請選出最合適的解釋？
  options:
  - label: A
    content: 貝卡利亞認為生命是財富之首，要保障人民生命權死刑為必要之惡
  - label: B
