- id: doc_110_新竹_新竹高中_社會_歷史_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「我們的目的是謀求眾生的幸福。我們的原則是：所有的成年人，權利一律平等；隨著體力和智力而改變的義務，也一律平等。在工作和娛樂中通力合作，財產共有。言論和行動自由。真誠的行為、善良的舉止、交往有禮貌、工作有秩序。身體健康、追求知識。要勤儉，要物盡其用。要遵守法律。」上文為近代歐洲某位思想家所提出的宣言，請問作者最有可能是誰？
  options:
  - label: A
    content: 洛克
  - label: B
    content: 歐文
  - label: C
    content: 馬克思
  - label: D
    content: 亞當‧斯密
