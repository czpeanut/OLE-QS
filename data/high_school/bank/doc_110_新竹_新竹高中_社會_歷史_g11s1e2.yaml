  stem: 「工業革命前的土地制度，農民只能分別在許多分散的小塊土地進行耕作。這些土地採用落後的三圃制耕作技術，每三年就要休耕一年，休耕的土地作為公共牧場供家畜使用，畝產低，土地浪費嚴重。但由於敞地制土地犬牙交錯互相連在一起，單獨小塊土地無法改變耕作方式。比如若自己的土地不打算休耕，但也無法避免由於旁邊的土地休耕後家畜對其的踐踏。圈地運動雖然對許多農民來說並不公平，許多農民被迫分得更貧瘠的土地，也無資本採用新的耕作技術，同時失去了休耕的公共土地放牧家畜的好處。但是土地集中後可以進行徹底的技術改良，生產更多的糧食供養更多的人口，尤其是可以為紡織工業生產大量的羊毛。按馬克思主義觀點，不少失去土地的農民，為工業革命提供了大量的勞動力，成為了工廠的工人，也為新產生的工人階級埋下了伏筆。」上文探討了英國的圈地運動發展與影響，下列選項哪些正確？
