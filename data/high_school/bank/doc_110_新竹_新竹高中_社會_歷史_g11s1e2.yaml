  stem: 下列是歐洲中世紀修毛布工人的行會章程，請閱讀完文獻後，回答行會具有哪些內容或特色？ ◆任何從事修毛布業者，必須加入聖如連兄弟會，繳付一切規費，並遵守兄弟所定的規則。 ◆任何人，不得做修毛布師傅，除非在城中住滿一年又一天，使人能夠知道他是否來自一個好地方……。 ◆如果師傅、日工或學徒，沒有阿拉斯基爾特職員的許可，而在城中工作，應付罰緩40金元。 ◆為維持手工的優良，非些毛布工不得做師傅；布商不得在自己店中剪裁不屬於自己生產的布匹，除非他亦是修毛布工，因為布商不能是師傅。 ◆如有本會兄弟為他人利益欺騙自己會友者，應停止其營業一年又一天。 ◆師傅如不付日工其應得之工資，則應付罰鍰5金元。 ◆為保證工作優良，學徒在半年內不得剪裁布邊。
