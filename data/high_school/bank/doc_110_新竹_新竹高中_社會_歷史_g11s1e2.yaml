  stem: 「十七世紀之前，大部分英國人穿的衣服多是厚重又不排汗的毛衣，故輕巧、鮮艷又排汗的印度棉織品輸入後，立刻大受歡迎，那些有身分地位的人，個個把印度毛毯穿在身上。1721年，英國由富商階級操控的國會立法禁止印度棉布進口，但可以合法進口原棉加工成棉布，然而由於技術不足導致品質不佳，市占率很低。1730年代以後，英國的紡織技術才有了飛躍式的進步，包括：飛梭的發明加快織布的速度，珍妮紡紗機與水力紡紗機等提高紡紗的效率。紡車機械化的結果，英國棉布不只變得與印度棉布品質一致，還更為便宜、細緻。十八世紀，印度原是全世界最大的棉織品出口國，但到了十九世紀初，英國的棉製品即占了對印度出口的一半以上，印度反成為英國第二大的棉製品市場，主客地位易位。此外，紡織業也從倚賴專業技能的工人，轉為僅需能夠操控機械的工人。紡織業改革的成功引發一連串的連鎖效應，這種現象在蒸汽機更廣泛應用於機器生產後，更普遍見於其他的生產部門，標誌著機械製造業時代的來臨。」上文是學者對工業革命的分析，請根據文章與歷史知識，說明下列哪些解讀正確？
