  stem: 文章內提及石墨層與層間是以「凡德瓦力」連結，此凡德瓦力屬於基本交互作用的哪一種？
  options:
  - label: A
    content: 萬有引力
  - label: B
    content: 正向力
  - label: C
    content: 強核力
  - label: D
    content: 弱核力
  - label: E
    content: 電磁力
  group_stem: 2010年諾貝爾物理獎的主角是碳─極薄的石墨片，厚度僅一原子，稱之為「石墨烯」。石墨與鑽石皆由碳元素所組成，但因為結構的排列不同，導致其性質有很大的差異，屬於「同素異形體」。其中，鑽石為網狀的立體結構；石墨具有層狀的平面結構，如下圖所示。每層中碳原子都排列成蜂窩狀晶體結構，層內原子間距0.142 nm，層間距0.335 nm。層內每個碳原子間以強度較強的共價鍵連結著另外三個碳原子，排列方式呈蜂巢式的多個六邊形；而每層間則由微弱的凡德瓦力彼此束縛。由於單層碳原子的石墨烯具有導電、堅硬、密實，且透明等性質，有機會在科技上有良好的應用。2010年諾貝爾物理獎得主<u>蓋姆</u>和<u>諾沃謝洛夫</u>取得石墨烯的方式為：利用膠帶黏在石墨兩側，再將其撕開，藉此破壞層與層間的凡德瓦力，重複多次後，便能得到單層原子的石墨烯。
  shared_asset: g1_19_20
