- id: doc_110_台南_台南二中_自然_生物_選修生物I_g10s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 細胞衰老的原因之一與細胞DNA複製後，DNA端粒變短有關，此種衰老方式稱為複製衰老。若幹細胞每次進行分裂後，其染色體DNA都會縮短的話，則DNA末端的某些正常基因會從子細胞消失，細胞就可能會老化甚至死亡。但這個情況不一定會發生，因為幹細胞中具有活性的端粒酶，可以催化端粒的延長，使得DNA末端恢復原有的長度。端粒酶在人類的胚胎幹細胞或癌細胞中活性最佳，因此其端粒的長度最長，可以無限制地進行細胞分裂，而一般的成體幹細胞大約分裂20～50次後，便會因為端粒的縮短，影響到正常的基因，細胞便會衰老。根據此文的敘述，下列哪個細胞的端粒可能<u>最短</u>？
  options:
  - label: A
    content: 癌細胞
  - label: B
    content: 受精卵
  - label: C
    content: 造血幹細胞
  - label: D
    content: 神經細胞
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)具有端粒酶 (C)尚未分化，端粒較分化完成的(D)神經細胞長
  tags:
