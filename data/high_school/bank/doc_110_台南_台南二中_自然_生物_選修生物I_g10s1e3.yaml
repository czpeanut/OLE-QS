  section: 1
  number: 13
  type: single
  page: 1
  stem: 下列關於呼吸作用的敘述，何者正確？
  options:
  - label: A
    content: 發酵作用是一種無氧呼吸，當人體肌肉細胞缺乏氧氣時會以無氧的酒精發酵取得能量
  - label: B
    content: 無氧呼吸和有氧呼吸最大的差別是在電子傳遞鏈，無氧呼吸的最終電子接收者不為氧
  - label: C
    content: 糖解作用僅能在無氧的環境下於細胞質液中進行
  - label: D
    content: 原核生物因為缺乏粒線體，不能夠行有氧呼吸，僅能透過無氧途徑取得ATP
  - label: E
    content: 呼吸作用所產生ATP能夠被利用在主動運輸、肌肉收縮以及分解大分子上
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)人體肌肉細胞缺氧時行乳酸發酵；(B)正確；(C)有氧與無氧環境下皆可進行糖解作用；(D)好氧原核生物可於細胞膜進行電子傳遞鏈行有氧呼吸；(E)ATP主要供合成大分子（同化代謝），分解大分子為放能反應。故選(B)。
