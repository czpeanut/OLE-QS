  stem: 根據文意，生熱素（Thermogenin）使下列哪個有氧呼吸的階段無法順利進行？
  options:
  - label: A
    content: 糖解作用
  - label: B
    content: 丙酮酸→乙醯輔酶A
  - label: C
    content: 克氏循環
  - label: D
    content: 氧化磷酸化
  group_stem: 多數哺乳類的新生兒身上具有一種脂肪細胞稱為棕色脂肪，相較身上用來儲存脂肪的脂肪細胞則稱為白色脂肪，此種棕色脂肪細胞傾向將脂肪氧化後形成熱能，而非ATP，藉此維持新生兒的體溫。為什麼此種脂肪細胞呈現棕色？是由於細胞內包含大量的粒線體，粒線體中的多種細胞色素（Cytochromes）會大量吸收可見光。棕色脂肪中的粒線體功能如同其他細胞中的粒線體一般，此外，他們還多了一種特殊的蛋白稱為生熱素（Thermogenin）或稱非偶合蛋白（uncoupling protein），此蛋白如同一種載體蛋白會將累積在膜間腔的氫離子直接送回粒線體基質，藉此產生熱能。某些冬眠的生物也會藉此來提供冬眠期所需要的熱能。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 會減少氧化磷酸化過程中流過ATP合成酶的氫離子
