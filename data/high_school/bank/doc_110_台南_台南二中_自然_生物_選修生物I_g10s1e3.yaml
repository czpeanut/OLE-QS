  group_stem: 人類乳突病毒（human papillomavirus，縮寫HPV）與生殖器官病變息息相關，包括子宮頸癌前病變、子宮頸癌、尖形溼疣 ─ 俗稱的「菜花」等，它也與身體其他部位的腫瘤，如外陰、肛門、陰莖與口咽部的鱗狀上皮細胞癌、皮膚疣、復發性呼吸道乳突瘤等有關。目前已知HPV病毒型約有100種，其中40種會引起肛門及生殖道感染。 感染生殖道的HPV可分兩大類型：一是與侵襲性子宮頸癌、外生殖器癌相關的高致癌性病毒型；另一是導致生殖器疣及良性子宮頸病變的低致癌性病毒型。根據民國94國健局臺灣地區HPV流行病學計畫的研究結果顯示，女性的HPV感染盛行率約15％，其中HPV-16與HPV-18是最常見的高致癌性病毒型，其盛行率在子宮頸癌病例中占70％，HPV-6與HPV-11則是最常的低致癌性病毒型，造成約90％的生殖器疣。 以HPV-18為例，它的結構可分為兩個功能區：晚發性蛋白與早發性蛋白。晚發性蛋白包含L1及L2，是HPV外殼的主要成分早發性蛋白則由6個基因片段（E1、E2、E4、E5、E6及E7）組成，負責調控病毒的複製、轉錄及細胞的癌化過程。在與癌症相關的HPV中，E6與E7基因產物會分別造成腫瘤抑制蛋白p53分解及與腫瘤抑制蛋白Rb結合，而兩者均干擾正常細胞複製的周期，使其抑制細胞增殖的功能喪失，進而導致細胞大量增生。 （文章改自科技大觀園 ─ 人類乳突病毒與子宮頸癌／許耿福著）
