- id: doc_110_台南_台南二中_自然_生物_選修生物I_g10s1e3_s3_32
  section: 3
  number: 32
  type: single
  page: 4
  stem: 請問文中提到的細胞色素氧化酶位於患者何處？
  options:
  - label: A
    content: 粒線體外膜
  - label: B
    content: 粒線體內膜
  - label: C
    content: 細胞膜
  - label: D
    content: 粒線體基質
  group_stem: 氛化氫（HCN）是一種無色氣體，帶有淡淡的苦杏仁味，存在於參天巨木和日常的水果及糧食作物，如杏仁或樹薯等，或是某些動物也可在特殊情況下會產生用來驅敵，例如馬陸或是群聚的蝗蟲等。在中國宮廷劇或偵探題材的戲劇中，若死者嘴巴聞到淡淡苦杏仁味，主角常會馬上推論出是因為氰化物造成的中毒。 氰化氫造成中毒的生理原因是透過影響細胞內的呼吸作用造成細胞死亡，其進入生物體後分解出具有毒性的氰離子（$CN^{－}$），抑制細胞內電子傳遞鏈中的多種酵素，其中細胞色素氧化酶對氰化物最為敏感。其與電子傳遞中的細胞色素氧化酶結合，會導致這種酶失去活性，而使得電子無法和此物質結合，而無法進行磷酸化作用以產生水和大量ATP。並導致檸檬酸循環的產物「甲」大量累積，且反應物「乙」大量缺乏而使檸檬酸循環無法持續進行，最終導致細胞無法以有氧呼吸產生能量，只能進行發酵作用，發酵作用的產物「丙」會大量累積，產物「丙」會進入血液中造成血液的pH值大幅下降，而影響許多生化代謝反應所需的酶結構和活性，造成代謝性酸中毒。 一般氰離子（CN）會最先在血液中發揮作用，所以紅血球會先大量死亡，之後又隨著血液進到心臟中，造成心肌死亡而心臟停止跳動。而人體內需氧量大的組織，例如：腦和肝臟無法由發酵作用支撐存活，這些重要的器官的細胞快速死亡，可解釋為何患者吸服後，不需等到代謝性酸中毒造影響，即很快昏迷。氰化氫對細胞色素氧化酶的破壞是不可逆的，故所有需要有氧呼吸產生ATP而存活的細胞皆會受到影響，即使痊癒後，大部分中毒者的腦和心臟一般都已受到永久性傷害。
  shared_asset: g3_32_34
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 電子傳遞鏈的成員位於粒線體內膜上
