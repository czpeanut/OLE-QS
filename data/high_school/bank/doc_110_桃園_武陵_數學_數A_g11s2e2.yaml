    $\Rightarrow 12=\sqrt{6} \cdot \sqrt{a^{2}+b^{2}+c^{2}}\Rightarrow a^{2}+b^{2}+c^{2}=24$

    ∴$4t^{2}$＋$t^{2}$＋$t^{2}$＝24 ⇒ $6t^{2}$＝24 ⇒ $t^{2}$＝4 ⇒ t＝± 2

    故 abc＝$2t^{3}$＝± 16'
