- id: doc_110_桃園_武陵_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 空間坐標系中有一平面 E 過 O（0，0，0）、A（－2，1，2）、B（2，2，1）三點，試選出正確的選項。
  options:
  - label: A
    content: 平面 E 與平面 x－2y＋2z＝1 平行
  - label: B
    content: 平面 E 與平面 2x＋y－2z＝10 的銳夾角小於 60°
  - label: C
    content: 點 P（3，1，1）到平面 E 的距離為 1
  - label: D
    content: 直線 L：$\frac{x}{1}=\frac{y-1}{-2}=\frac{z-2}{2}$與平面 E 平行
  - label: E
    content: 若點 Q（3，－2，1）至平面 E 的投影點為（a，b，c），則 $a^{2}$＋$b^{2}$＋$c^{2}$＝5
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{OA}$＝（－2，1，2），$\vec{OB}$＝（2，2，1）

    $\vec{n_{E}}$//$\vec{OA}$×$\vec{OB}$＝（－3，6，－6）//（1，－2，2）

    故 E：x－2y＋2z＝0

    (A) ○：明顯為真

    (B) ╳：令 F：2x＋y－2z＝10，$\vec{n_{F}}=(2 , 1 , -2)$

    令兩法向量夾角為 θ

    則 cosθ＝$\pm \frac{\vec{n_{E}} \cdot \vec{n_{F}}}{| \vec{n_{E}} | | \vec{n_{F}} |}=\pm \frac{2-2-4}{3 \cdot 3}=\pm \frac{-4}{9}$

    銳夾角之 cos 值為$\frac{4}{9}$，小於 cos60°＝$\frac{1}{2}$

    ⇒ 銳夾角＞60°

    (C) ○：d（P，E）＝$\frac{| 3-2\times 1+2\times 1 |}{\sqrt{1^{2}+(-2)^{2}+2^{2}}}=\frac{3}{3}=1$

    (D) ╳：直線方向向量$\vec{L}=(1 , -2 , 2)$

    ∵$\vec{n_{E}} \cdot \vec{L}=(1 , -2 , 2) \cdot (1 , -2 , 2)=9\neq 0$

    ∴直線 L 與平面 E 不平行

    (E) ○：令 Q 到平面 E 上的投影點 R＝（3，－2，1）＋t（1，－2，2）＝（3＋t，－2－2t，1＋2t）

    ∵R 在 E 上

    ∴（3＋t）－2（－2－2t）＋2（1＋2t）＝0 ⇒ t＝－1

    ⇒ R（2，0，－1）

    故 $a^{2}$＋$b^{2}$＋$c^{2}$＝$2^{2}$＋$0^{2}$＋（－1）$^{2}$＝5

    故選(A)(C)(E)'
- id: doc_110_桃園_武陵_數學_數A_g11s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 關於方程組$\begin{cases}x-y-z=3 \\ x+y+3z=1 \\ 5x+y+az=b\end{cases}$的解，下列哪些選項是正確的？
  options:
  - label: A
    content: 若方程組有解，則 a≠7
  - label: B
    content: 若 a＝6，則方程組恰一組解
  - label: C
    content: 若方程組無解，則 b≠9
  - label: D
    content: 若 b≠9，則方程組無解
  - label: E
    content: 若方程組有無限多組解，則行列式$\left| \begin{matrix}1 & -1 & -1 \\ 1 & 1 & 3 \\ 5 & 1 & a\end{matrix} \right| =0$
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}x-y-z=3 \cdots \cdots \cdots \cdots \cdots ① \\ x+y+3z=1 \cdots \cdots \cdots \cdots \cdots ② \\ 5x+y+az=b\cdots \cdots \cdots \cdots \cdots ③\end{cases}$

    $\begin{cases}①+②: 2x+2z=4 \\ ①+③: 6x+(a-1)z=(b+3)\end{cases}\Rightarrow \begin{cases}x+z=2 \\ 6x+(a-1)z=(b+3)\end{cases}$

    若$\frac{1}{6}\neq \frac{1}{a-1}$⇒ a≠7，恰一組解

    若$\frac{1}{6}=\frac{1}{a-1}=\frac{2}{b+3}$⇒ a＝7，b＝9，無限多組解

    若$\frac{1}{6}=\frac{1}{a-1}\neq \frac{2}{b+3}$⇒ a＝7，b≠9，無解

    (A) ╳：不一定，可能（a，b）＝（7，9）

    (B) ○：∵a≠7

    ∴恰一組解

    (C) ○：由以上可知 b≠9

    (D) ╳：不一定，若 a≠7，b≠9 時，則方程組恰一組解

    (E) ○：$\left| \begin{matrix}1 & -1 & -1 \\ 1 & 1 & 3 \\ 5 & 1 & a\end{matrix} \right| =2a-14=0\Rightarrow a=7$

    由以上可知為真

    故選(B)(C)(E)'
- id: doc_110_桃園_武陵_數學_數A_g11s2e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 空間中有一直線 L：$\begin{cases}x=1+5t \\ y=2 \\ z=3-3t\end{cases}$，t ∈ R，則下列有關直線 L 的敘述，哪些是正確的？
  options:
  - label: A
    content: L 與 zx 平面平行
  - label: B
    content: L 與 yz 平面垂直
  - label: C
    content: L 與 y 軸平行
  - label: D
    content: L 與 z 軸互為歪斜線
  - label: E
    content: 直線$\begin{cases}3x+y+5z=20 \\ y=2\end{cases}$與 L 為同一條直線
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$E_{zx}$：y＝0，$\vec{n_{zx}}$＝（0，1，0）

    $\vec{L}$＝（5，0，－3），L 上有一點 A（1，2，3）

    ∵$\vec{n_{zx}} \cdot \vec{L}=0$且 A 不在 $E_{zx}$ 上

    ∴L 與 zx 平面平行

    (B) ╳：$E_{yz}$：x＝0，$\vec{n_{yz}}=(1 , 0 , 0)$

    ∵$\vec{n_{yz}} \cdot \vec{L}=5$

    ∴L 與 yz 平面交一點

    (C) ╳：$\vec{L_{y}}$＝（0，1，0）$//＼\vec{L}$

    故 L 不與 y 軸平行

    (D) ○：z 軸：$\begin{cases}x=0 \\ y=0 \\ z=s\end{cases}$，s ∈ R

    ∵$\vec{L_{z}}=(0 , 0 , 1)//＼\vec{L}$

    ∴L 與 z 軸為相交或歪斜

    計算$\begin{cases}1+5t=0 \\ 2=0 \\ 3-3t=s\end{cases}$無解，故兩線歪斜

    (E) ○：∵L 在 3x＋y＋5z＝20 上，亦在 y＝2 上

    且 3x＋y＋5z＝20 和 y＝2 交一線

    ∴$\begin{cases}3x+y+5z=20 \\ y=2\end{cases}$與 L 為同一直線

    故選(A)(D)(E)'
