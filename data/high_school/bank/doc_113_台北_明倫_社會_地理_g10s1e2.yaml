  explanation: 河階地形為河流因回春作用重新下切（侵蝕基準下移），舊河床形成相對抬升的地形，愈高的河階面愈古老。(C)高位河階因近水源、平坦、肥沃又不會水患（已相對抬升，侵蝕基準相對下移），容易形成聚落的位置，湧泉會發生在階崖結束的位置。
