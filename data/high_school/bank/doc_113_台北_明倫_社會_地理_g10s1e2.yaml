- id: doc_113_台北_明倫_社會_地理_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 郁永河在《裨海紀遊》中提到「……又陟一小巔，覺履底漸熱，視草色萎黃無生意；望前山半麓，白氣縷縷……，導人指曰：『是硫穴也。』」就上述可知郁永河當時所在地區可能在哪裡？
  options:
  - label: A
    content: 臺北陽明山
  - label: B
    content: 臺南關子嶺
  - label: C
    content: 嘉義阿里山
  - label: D
    content: 南投日月潭
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題目中提及「履底漸熱、白氣（熱氣）、硫穴」可知描述的應為火山地形，臺灣有噴出型的火山地形應為(A)臺北陽明山。
- id: doc_113_台北_明倫_社會_地理_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '冰磧平原和外洗平原 2 種地形，下列哪些敘述正確？

    |  | (甲)作用力 | (乙)組成顆粒 | (丙)分布位置 | (丁)土地利用 |

    | --- | --- | --- | --- | --- |

    | 冰磧平原 | 冰水堆積 | 大小成層分布 | 以端磧為界，往冰河上游分布 | 土壤相對淺薄，不利農業 |

    | 外洗平原 | 冰河直接堆積 | 大小混雜，缺乏層理 | 以端磧為界，往冰河下游分布 | 土壤相對肥沃，利於農業 |'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙丁
  - label: D
    content: 丙丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)(乙) 2 項描述，互相交換後即為正確描述。外洗平原為冰水沉積，具備淘選度，沃度較高。
- id: doc_113_台北_明倫_社會_地理_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在計算工程的「挖方」與「填方」，或是分析低窪區潛在的「水患」分布，應以哪一種分析方法為佳？
  options:
  - label: A
    content: 疊圖分析
  - label: B
    content: 地形分析
  - label: C
    content: 路網分析
  - label: D
    content: 環域分析
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 挖方、填方為計算立體的容量，需使用到 Z 坐標，屬於(B)地形（地勢）分析。
- id: doc_113_台北_明倫_社會_地理_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 某生於寒假之見聞：「在斯洛維尼亞，其地面上滿布著陷阱──石溝、豎井、落水洞、乾谷與奇形的山峰，而地底下更隱藏著巨大而奇特的洞穴，岩洞中處處可見千姿百態的奇石世界，它們有的像山間竹筍、叢生的蘑菇，有的則像下垂的冰柱，更甚者像擎天的大柱……。」請問某生的推論：(甲)此地的氣候為溫暖潮溼(乙)地表與洞穴地形主要是受外營力作用(丙)與黃土成因相似，物理風化盛行(丁)古代此地應是淺海(戊)若欲發展農業注意排水問題。正確的有哪些？
  options:
  - label: A
    content: 甲乙丁
  - label: B
    content: 甲丁戊
  - label: C
    content: 乙丙戊
  - label: D
    content: 丙丁戊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由斯洛維尼亞、石溝……等描述，可知應為石灰岩地形，盛行於溫暖潮溼、(丙)化學風化盛行，因多溶洞、漏水嚴重，(戊)應注意灌溉問題。
