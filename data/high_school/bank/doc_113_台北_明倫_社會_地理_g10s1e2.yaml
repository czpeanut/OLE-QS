  stem: 地形作用可分成「內營力」和「外營力」，下列哪些屬於「外營力」作用？(甲)日本阿蘇火山噴發出火山灰(乙)太魯閣峽谷受立霧溪侵蝕而加深(丙)東非大裂谷不斷擴張(丁)嘉義沿海外傘頂洲受沿岸流影響往內陸移動(戊)南投信義鄉豐丘村土石流災情
  options:
