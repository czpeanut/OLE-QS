  answer:
  - (1) 甲；(2) 基隆山；(3) 二氧化矽
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)龜山島為酸性火山，甲正確。

    (2)基隆山為無噴發的火山類型。

