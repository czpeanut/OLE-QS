  stem: '常用之地理資訊分析方法有：(甲)地形分析(乙)環域分析(丙)路網分析(丁)疊圖分析(戊)查詢等。請問：

    (1) 探討全球氣候變遷導致的海水面上升，並模擬上升 10 公尺可能淹沒的地區，應以哪一種分析方法？

    (2) 欲分析臺南七股地區 1915 ～ 1975 年海岸線變遷狀況，應使用哪一種分析方法？

    (3) 臺灣在 921 地震後規劃斷層兩側 50 公尺為「禁建區」，為快速取得正確的禁止開發範圍，可利用哪一項功能？'
  answer:
  - (1)(甲)。
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)要模擬海平面上升，可以(甲)地形分析中的功能進行 Z 坐標調整來模擬。

    (2)海岸線變遷可以不同年度的海岸線衛星影像加以(丁)疊圖分析。

    (3)以斷層線為中心，劃設 50 公尺的禁建區可使用(乙)環域分析畫設出範圍。'
