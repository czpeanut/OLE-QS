- id: doc_112_台中_興大附中_數學_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設二次函數 f（x）＝$kx^{2}$＋8x＋（k＋6），不論 x 是任何實數，f（x）的值恆正，則實數 k 的範圍為
  options:
  - label: A
    content: k＜－6
  - label: B
    content: k＞2
  - label: C
    content: －6＜k＜2
  - label: D
    content: k＜－6 或 k＞2
  - label: E
    content: 任意實數
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}判別式 = 8^{2}-4 \cdot k \cdot (k+6) < 0 \\ 開口:k > 0\end{cases}$⇒$\begin{cases}(k-2) (k+8)> 0 \\ k> 0\end{cases}$⇒$\begin{cases}k <-8 或 k > 2 \\ k > 0\end{cases}$ ∴k＞2

    故選(B)'
- id: doc_112_台中_興大附中_數學_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 當－2 ≤ x ≤ 1 時，二次函數 y＝－（x－m）$^{2}$＋$m^{2}$＋1 有最大值 4，則實數 m 的值為
  options:
  - label: A
    content: $-\frac{7}{4}$
  - label: B
    content: $\sqrt{3}$或－$\sqrt{3}$
  - label: C
    content: 2 或$\sqrt{3}$或－$\sqrt{3}$
  - label: D
    content: 2 或－$\sqrt{3}$
  - label: E
    content: 2 或－$\sqrt{3}$或$-\frac{7}{4}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '①若－2 ≤ m ≤ 1，則最大值為 f（m）＝$m^{2}$＋1＝4 ⇒ m＝±$\sqrt{3}$ ∴m＝－$\sqrt{3}$

    ②若 m＜－2，則最大值為 f（－2）＝－（－2－m）$^{2}$＋$m^{2}$＋1＝4 ⇒ m＝$-\frac{7}{4}$ ∴不合

    ③若 m＞1，則最大值為 f(1)＝－（1－m）$^{2}$＋$m^{2}$＋1＝4 ⇒ m＝2 ∴m＝2

    由①、②、③得 m＝2 或－$\sqrt{3}$

    故選(D)'
- id: doc_112_台中_興大附中_數學_g10s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 二次函數 y＝$ax^{2}$＋bx＋c 的部分圖形如右，且通過（－1，0），對稱軸為 x＝2，請選出正確的選項。
  options:
  - label: A
    content: a＋c＝b
  - label: B
    content: 3a＋b＝0
  - label: C
    content: 25a＋5b＋c＞0
  - label: D
    content: 8a＋b＋c＞0
  - label: E
    content: 若圖形與 y 軸交點、頂點及（2，0）形成直角三角形，則 a＝－$\frac{1}{\sqrt{5}}$
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_112_台中_興大附中_數學_g10s1e3/s2_1_f1.png
    crop:
      page: 1
      rect:
      - 465.4
      - 480.25
      - 564.3
      - 576.9
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由對稱軸為 x＝2 可知，圖形與 x 軸的另一交點為（5，0）

    f（x）＝$ax^{2}$＋bx＋c＝a（x＋1）（x－5），a＜0

    (A) ○：f（－1）＝a－b＋c＝0 ⇒ a＋c＝b

    (B) ╳：對稱軸 x＝$-\frac{b}{2a}$＝2 ⇒ 4a＋b＝0

    (C) ╳：f(5)＝25a＋5b＋c＝0

    (D) ○：由(A)、(B)，b＝－4a，c＝b－a＝－4a－a＝－5a ⇒ 8a＋b＋c＝－a＞0

    (E) ○：f（x）＝$ax^{2}$＋bx＋c＝$ax^{2}$－4ax－5a，與 y 軸的交點為（0，－5a），頂點為（2，－9a）

    由 y 軸交點處為直角

    ⇒$\frac{(-9a)- (-5a)}{2-0}$×$\frac{0 -(-5a)}{2-0}$＝－1 ⇒（－4a）×5a＝－4 ⇒ a＝±$\frac{1}{\sqrt{5}}$（正不合）

    故選(A)(D)(E)'
