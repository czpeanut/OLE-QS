    content: 無次數
  group_stem: f（x）為一多項式，已知對於任意實數 x，皆使 x．f（x）．f（1－x）＋$x^{3}$＋100 ≥ 0 恆成立。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '設 f（x）＝$ax^{n}$＋$bx^{n－1}$＋…… ⇒ f（1－x）＝a（1－x）$^{n}$＋b（1－x）$^{n－1}$＋……

    故 x．f（x）．f（1－x）的次數 1＋n＋n＝2n＋1 必為奇數

    若 x．f（x）．f（1－x）＋$x^{3}$＋100 為 k 次函數，且 k 為奇數，

    則 x．f（x）．f（1－x）＋$x^{3}$＋100 的值有正有負

    因此次數 2n＋1＝3，使得 x．f（x）．f（1－x）＋$x^{3}$＋100 為二次函數

    ∴f（x）＝ax＋b 為一次函數

    故選(A)'
