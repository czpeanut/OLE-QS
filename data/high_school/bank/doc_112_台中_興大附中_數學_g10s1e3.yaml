  answer:
  - '6'
  answer_status: verified
  answer_source: answer_key
  explanation: '、3. x．f（x）．f（1－x）＋$x^{3}$＋100＝x（ax＋b）（a（1－x）＋b）＋$x^{3}$＋100

    ＝（－$a^{2}x^{3}$＋$a^{2}x^{2}$＋b（a＋b）x）＋$x^{3}$＋100

    ＝（1－$a^{2}$）$x^{3}$＋$a^{2}x^{2}$＋b（a＋b）x＋100 為二次函數

    ⇒ 1－$a^{2}$＝0 ⇒ a＝± 1

    ① a＝1 時，f（x）＝x＋b，

    則 x．f（x）．f（1－x）＋$x^{3}$＋100＝$x^{2}$＋b（b＋1）x＋100 ≥ 0 恆成立

    ⇒判別式＝（b（b＋1））$^{2}$－4．1．100 ≤ 0 ⇒－20 ≤ b（b＋1）≤ 20

    分段討論

    ❶－20 ≤ $b^{2}$＋b ⇒ $b^{2}$＋b＋20 ≥ 0，判別式＝1－4×1×20＜0 ∴恆正

    ❷$b^{2}$＋b ≤ 20 ⇒ $b^{2}$＋b－20 ≤ 0 ⇒（b－4）（b＋5）≤ 0 ⇒－5 ≤ b ≤ 4

    由❶、❷得－5 ≤ b ≤ 4

    ∴f(2)＝2＋b 的最大值為 6，最小值為－3

    ② a＝－1 時，f（x）＝－x＋b，

    則 x．f（x）．f（1－x）＋$x^{3}$＋100＝$x^{2}$＋b（b－1）x＋100 ≥ 0 恆成立

    ⇒判別式（b（b－1））$^{2}$－4．1．100 ≤ 0 ⇒－20 ≤ b（b－1）≤ 20

    分段討論

    ❶－20 ≤ $b^{2}$－b ⇒ $b^{2}$－b＋20 ≥ 0，判別式＝（－1）$^{2}$－4×1×20＜0 ∴恆正

    ❷$b^{2}$－b ≤ 20 ⇒ $b^{2}$－b－20 ≤ 0 ⇒（b－5）（b＋4）≤ 0 ⇒－4 ≤ b ≤ 5

    由❶、❷得－4 ≤ b ≤ 5

    ∴f(2)＝－2＋b 的最大值為 3，最小值為－6

    故 f(2)的最大可能值為 6，最小可能值為－6'
