  group_stem: '資料一：越南春捲可以說是越南的「招牌菜」。米紙攤在手掌上，然後依次放上生菜、香花菜、米粉、青瓜……等，包裹好後沾上調配好的魚露吃……。越式春捲的作法和○○國春捲差不多，裡面的餡材料也相當多，所不同的是，越式春捲是以薄如紙的米皮作外皮，可炸食，另有一款可生食名叫「沙律捲」餡料全熟，沾魚露或蝦醬食即可。（王宏仁著，《東南亞文化教學參考手冊》，臺北市：教育部編印，2006 年，頁 205）

    資料二：泰國人的米食、掛面、豆豉、乾肉、臘腸、醃魚以及就餐用的羹匙等等，都和○○國的有許多共同之處。加上泰國又是亞洲三大米倉之一，順理成章的，米食便成了泰國人生活中的主食。'
