  section: 1
  number: 18
  type: single
  page: 4
  stem: '資料一：他世居天竺。其父因商賈移於交阯。年十餘歲時二親並亡，以至性居憂，服闋出家。厲行甚峻。……時孫權已制江左，而佛教未行，赤烏十年初達建業，營立茅茨設像行道。」

    資料二：「有司奏曰，有胡人入境自稱沙門，容服非恆，事應驗察，權曰，吾聞漢明夢神，號稱為佛，彼之所事，豈其遺風耶，即召之詰問，權大嗟服。即為建塔以始有佛寺，故曰建初寺。」

    請問上述兩段資料是敘述下列何人的事蹟？'
  options:
  - label: A
    content: 弓月君
  - label: B
    content: 康僧會
  - label: C
    content: 衛滿
  - label: D
    content: 徐福
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '兩則資料所敘述為(B)康僧會的事蹟，是三國時代第一位到孫吳弘法的佛教僧人。(A)《日本書紀》記載古代從朝鮮半島遷居日本的人物。(C)西元前 2 世紀衛滿朝鮮的創建者。(D)《史記》記載為秦始皇東渡尋訪仙者的方士。

    19.1870 年代明治維新後，日本基於國防因素而將(A)北海道全境納入自身領土，並實施屯田兵制。(B)(D)此時尚非日本的統治勢力範圍，不可能有許多日本人移民當地。(C)為海外的經濟性移民，不需從事軍事訓練。

    20.(A)為正解。(B) 19 世紀中葉《中英法北京條約》簽署後。(C)指華人被當成豬對待，非從事養豬業。(D)主要是東南亞及美洲為多。

    21.題文所述為日本針對中國東北移民推行的「大陸花嫁」政策，正確答案為(D)。(A)結婚對象為在滿洲的日本男子。(B)新娘來自日本，非中國女子。(C)這些女性及其孩童至戰後才遷回日本，但有不少女性及孩童被拋棄在滿洲。

    22.(A)北洋女醫學堂為第一所公辦的護理學校。(B)應為福澤諭吉。(C)應是津田梅子。

    23.唐宋以後，阿拉伯人開始主導世界的海上貿易，成為東西貿易交流的重要媒介，答案為(D)。(A)佛教盛行的時間更早，且與經濟貿易無關。(B)(C)與史實不符。

    24.16 世紀日本與朝鮮的戰爭為(B)豐臣秀吉所發動，朝鮮向中國明政權求援，順利擊退日軍。

    25.地理大發現後，菲律賓不久即成為(C)西班牙人的殖民地，因此將天主教信仰引進當地。

    26.從題文詞彙的拼音來看，無論茶、豆腐或頭家的發音，都與閩南語近似，因此可推知這個移民族群應來自中國的福建省，故正確答案為(A)。

    27.(A)鎖國期間，朝鮮與琉球使節團仍持續與德川幕府有所往來，可見「鎖國」並非未與中國發展正式關係的真正理由。(C)與史實不符。(D)日本過去曾與中國有封貢關係，並非自古以來就輕視中國。

    28.(C)朱舜水為明朝遺民，明亡後移居日本。(A)唐朝揚州高僧，後赴日弘法。(B)制定《黃檗清規》的日本高僧。(D)朝鮮出身的日本陶工，開創日本「有田燒」。

    29.山區本是老虎生長的地區，但近代以來，山區虎患盛行，甚至華南虎瀕臨滅絕，原因是人口繁衍增加，因此土地開發危及到老虎的棲息地，故答案為(C)。

    30.兩則資料皆反映在戰爭期間，華僑為了支持救國大業，協助募款購置飛機外，甚至還為祖國當兵奉獻，因此正確答案為(C)。

    31.從資料二得知○○從 1842 年後成為殖民地，可以推知為《南京條約》後割讓的(B)香港。(A)(C)為中國的港口，並非殖民地。(D) 16 世紀已是西班牙的殖民地，同時也並非華工往世界各地的轉運站。

    32.馬來亞當地居民以馬來裔為主，是為甲族群；乙族群人數增加快速，應為因應海外移民風潮而來的華裔人口；丙族群人數最少，但也穩定成長，可能為英國殖民體系內的印度裔，故答案為(A)。

    33.從「現經沈葆楨等奏……渡臺各例禁，一律弛禁」，可知此時經過牡丹社事件後，已經開山撫番、廢除渡臺禁令，(C)提到「應暫弛海禁，招徠臺米」，明顯為救援內地糧荒而非治臺配套措施，故選(B)不選(C)。

    34.東洋的「紅毛番」指荷蘭人所占領的臺灣地區，因此可推知此時為 17 世紀的(C)明末。

    35.題文所述為 16 世紀後大航海時代的遠洋貿易情形，西班牙透過貿易交換方式，經由馬尼拉將大量美洲白銀流入中國，因此答案為(C)。

    36.日本僧人雖然與中國人語言不通，卻能「筆言」，原因是日本當時尚未使用片假名、平假名，從「搭著新羅船回日本」一句，可推知這位日本僧人來中國的時間應是(C)唐代。

    37.從葡萄乾、景教、火祆祠、摩尼寺等線索，可判讀這座古城應位於唐代的西域地區， (A)(B)(C)皆非屬於唐代疆域範圍內，因此答案為(D)新疆。

    38.資料一明顯對海外移民有不屑之意，資料二則允許華民可以合法立約出洋承工，是因為英法聯軍後簽訂的《北京條約》，清廷被迫開放移民政策，因此答案為(B)。

    39.清代政府實施海禁以遏止的「這個政權」為(D)臺灣鄭氏，因此在臺灣納入清版圖後，即解除海禁令。

    40.「甲必丹」制度主要為歐洲殖民者在東南亞地區推行，(D)美國加州並未施行過。

    41.根據題文所述，「厝仔制度」為英國殖民者控制華工的方法，選項中僅(C)馬來西亞為英國的殖民地，是為正解。

    42.題文資料顯示，匈奴發生饑荒而使得社會經濟破產，故而衍生內亂與戰爭，因此是天荒造成的人禍，(A)(C)可刪除，(B)傳染病少有人畜共通情形，因此選(D)不選(B)。

    43.題文顯示前朝遷入的異族與原居民不斷發生衝突，指東漢開始開放五胡進入中原而造成的胡漢衝突，是為日後永嘉之禍的背景；地方上宗族勢力漸有凌逼中央的趨勢，即世族門閥權勢凌駕皇權之意，因此這個朝代為(B)西晉。(A)(C)(D)三者不符合「前朝遷徙進入國境內的異族」條件。

    44.(A)(C)劇情並非虛構，許多朝鮮勞工慘遭虐待。(B)戰時日本曾哄騙朝鮮勞工前往戰地採礦，並無大規模假勞工真當兵的情形。(D)為正解。

    45.從「我們高等種族可以為了我們的高等文明而自由生活、自由繁衍」一句，可知排華者認為華人是低等種族與低等文化，將威脅到白人的高等文明，因此答案為(D)。

    46.辣椒、玉米原產地在美洲，地理大發現後才傳入舊大陸，明中葉時歐洲人經由海上貿易而輾轉入中國，最合理的說法應為(D)。(A)(B)未與歐洲人有往來。(C)以傳教、傳播西學為主，較不可能引進新物種推廣。

    47.推動臺灣糖業改良、發展新式製糖業的日本人是(B)新渡戶稻造。(A)兒玉源太郎時期的民政長官，主張生物學統治論。(C)在臺灣改良蓬萊米的日本人。(D)札幌農學校第一任校長，有「少年們，要胸懷大志！」名言。

    48.(A)為正解。(B)移民以從事農業為主。(C)移民村的規模通常很小。(D) 1930 年代後，配合南進政策，移民村往臺灣西部發展。

    49.北宋末年發生(D)靖康之難，大量北方人隨著宋室南渡到臨安，因此杭州城內才會出現「汴音」。(A)西晉晚期。(B)唐中葉。(C)東漢晚期。

    50.兩則資料顯示這個地方的租界遠較中國其他地區繁榮，因此應為(A)開港通商後的上海。(B)英國屬地，沒有租界。(C)未開放通商，沒有租界。(D)較晚開放通商，因此不如上海繁榮。

    51.題文所述為(C)隱元隆琦的事蹟，其制定的《黃檗清規》對日本各宗派的戒律影響甚大。(A)唐時的新羅高僧。(B)唐時中國高僧。(D)明亡後東渡日本的文史學者。

