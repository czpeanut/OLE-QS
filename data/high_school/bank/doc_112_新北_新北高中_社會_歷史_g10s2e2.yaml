  stem: 1908 年，美國羅斯福總統與日本簽署了《紳士協約》，限制日本移民，條約中規定只有「非勞工」及「先前的僑民」、「僑民的父母、妻子與子女」、「定居的農業專家」等身分能夠移民美國；美國政府會確保日本學童不受歧視法規的侵擾。然而，此條約的效果十分有限，日裔移民仍維持一定的數量，女性移民比例更是大幅上升。請問根據上文敘述，下列推斷何者正確？
  options:
  - label: A
    content: 條約中規定只有「非勞工」才能移民，是美國想將產業轉型到第三級產業
  - label: B
    content: 美國政府為了保障本國勞工的工作權判，訂此協約來禁止日本的各類移民
  - label: C
    content: 「照片新娘」符合「僑民妻子」的條件，可利用家屬身分鑽條約的漏洞
  - label: D
    content: 「紳士協約」較《排華法案》規定嚴苛，使得華人取代日裔移民的地位
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 受到《排華法案》的牽累，在美的日本移民亦受到排擠，此「紳士協約」即是限制移民身分資格以減少日本移民數量，女性移民增加則是多以「僑民的妻子」身分進入美國，因此正確答案為(C)。(A)欲減少日本移民數量，與產業轉型無關。(B)「非勞工」身分的各類移民仍可到美國。(D)華人與日裔移民皆遭美國社會排擠。
