- id: doc_112_新北_新北高中_社會_歷史_g10s2e2_s1_57
  section: 1
  number: 57
  type: single
  page: 10
  stem: 資料一提到，在美國華埠婦女地位反而不如在中國的原因可能是
  options:
  - label: A
    content: 華埠長期受幫派、會館所操控，販賣並奴役婦女
  - label: B
    content: 美國社會對移民婦女充滿敵意，常刻意排擠歧視
  - label: C
    content: 華埠與外界隔絕，對傳統的改變還不如在中國多
  - label: D
    content: 美國社會雖然強調多元與包容，但對於移民例外
  group_stem: '資料一：某位學者研究：一位來自廣東的李太太，原先是在中國擔任圖書館員，她說：「在同年齡的婦女中，我算是少數幸運者之一，能受到高等教育。但為了順從傳統價值觀，表現得溫文儒雅，因為，高學歷會找不到丈夫，見解也多，我總要壓抑自己的獨立見解和才智。我不指望自己的處境有多大的變化，因為我已習慣了；但我確實希望我的孩子們能生活在不那麼受壓抑的、自由的世界。我原本想在美國對性別的歧視會少些，婦女可以多享受一些權利。但是在華埠，情況卻更糟！」（改寫自：陳靜瑜，《美國族群史》，頁 320。國立編譯館，2006）

    資料二：但是和很多移民群體不同，華人群體被排除在入籍之外。受到經濟衰退、勞工糾紛與白人至上文化影響，美國西部的反華暴力事件幾年來持續上升，最終導致 1882 年通過的《排華法案》，不得入籍也是其中的一部分。1892 年，該法案又被延長生效年限，並要求所有華人在政府登記，除非他們能證明自己的合法居留身分（要求有至少一名白人證人的證詞），否則便有可能被驅逐出境。一位參議員斷言，政府有權利「就像我們對待印第安人那樣，把他們隔離在一個區域或一塊保留地之中，讓他們沒法出來毒害我們的人民。」這個說法頗能反映議會的態度。（改寫自：〈華裔移民的故事：從暗處來到聚光燈下〉，《紐約時報》中文網 https://cn. nytimes. com/culture/20160624/30chinese/zh-hant/(2019.08.11)）'
  answer:
  - C
