    資料三：為生活所迫，漢人衝破清朝禁令，成批到關外從事開墾。乾隆六年，奉天各屬新編人口僅有一萬三千八百餘人，到乾隆四十六年，就增加到三十九萬餘人。雍正初年，奉天各屬旗地、民田共八萬五千三百餘頃，到乾隆四十五年間就增加到十五萬六千七百餘頃。其他吉林、黑龍江等地的人口和墾田數也有明顯增長。（改寫自：鄭天挺等著，《清史》，臺北：昭明出版社，1999 年 9 月出版，頁 422）'
  answer:
  - C
