  stem: 1860 年以後，前往西歐的華人人數甚少。然而某一時期，英國與法國亦因為勞動力短缺而招募 15 萬名以上的華工。赴西歐的華工主要從事搬運貨物、建造營房、挖掘戰壕、裝填沙袋、鋪設鐵路、修建公路等工作。請問這一時期是下列何時？
