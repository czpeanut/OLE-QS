  stem: 張翎在其作品《金山》的序言裡說明了創作這部長篇小說的緣由：「我發現了那些三三兩兩地埋在野草之中，裹著鳥糞和青苔的墓碑。我撥開沒膝的野草，有些費勁地認出了墓碑上被歲月侵蝕得漸漸模糊起來的字跡。雖然是英文，從拼法上可以看出是廣東語發音的中國名字。有幾塊墓碑上尚存留著邊角殘缺的照片，是一張張被南中國的太陽磨礪得黧黑粗糙的臉、高顴骨、深眼窩，看不出悲喜、也看不出年齡。」請問這篇小說所指涉的歷史背景為何？
  options:
  - label: A
    content: 17 世紀中葉，華南地區的漢人為躲避異族統治而舉家移民至菲律賓
  - label: B
    content: 18 世紀前半，清代解除海禁後華南民眾移民至東南亞從事商業貿易
  - label: C
    content: 19 世紀後半，清末華人因原鄉謀生不易而遠赴北美洲淘金、修鐵路
  - label: D
    content: 20 世紀中葉，不願生活在被赤化後的中國而搬遷到鄰近的星馬地區
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從序言得知墓主來自中國廣東，但墓碑以英文書寫，因此該地為使用英文的國家，因此(C)為正解。(A) 17 世紀中葉的菲律賓為西班牙的殖民地，不使用英文。(B)清代解除海禁後，對移民仍有諸多限制，閩粵移民偷渡至東南亞亦從事拓墾、採礦為主。(D)中國廣東距離星馬地區稍遠，非鄰近地區，且不可能人數多到能同時在當地形成「三三兩兩」的墓地區域。
