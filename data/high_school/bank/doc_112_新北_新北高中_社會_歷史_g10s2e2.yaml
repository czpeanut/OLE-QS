- id: doc_112_新北_新北高中_社會_歷史_g10s2e2_s1_53
  section: 1
  number: 53
  type: single
  page: 9
  stem: 根據以上資料與相關知識，臺灣人與日本人民族衝突和緩的原因是
  options:
  - label: A
    content: 日本殖民同化政策的成功
  - label: B
    content: 日本政府推動皇民化運動
  - label: C
    content: 太平洋戰爭爆發，移民村勞動力短缺
  - label: D
    content: 以上皆是
  group_stem: '日本移民村建設的主旨，便是成立一「示範農村」，不與臺灣人混居。所以移民村代表著典型的日本文化和民族，自成一個封閉區域；和村外的本土文化、臺灣人隔閡對立。初期一些日本移民的高姿態和移民指導員的過分保護，使臺灣人、日本人常有衝突，總督府規劃的官營移民村，是一個在經濟上、社會上都自給自足的農村，雖然村落周遭沒有莿竹或圍牆環繞，界定出一個封閉空間，但是移民村的社會機能使其發展為內向性的聚落，移民活動的空間充其量只在各個移民村連成的範圍內，和鄰近臺灣人村落往來十分有限。在移民村剛成立的前幾年，日本移民對自己的空間領域感很強，對無意中踏入移民村範圍的臺灣人都嚴厲驅離，臺灣人進入村內，除非事先通報，或村民僱來開溝修路，否則視如小偷。

    當時臺灣人並不會刻意到移民村走動，由於移民村耕地廣闊又與臺灣人的耕地接鄰，因此以牛誤吃移民稻苗發生的糾紛最常見。這些瑣事常造成族群間的糾紛，有賴中介者調解，中介者往往是雜貨店商人。另外臺灣人和日本人的待遇也不同，差別待遇讓臺灣人不平於胸中，敢怒不敢言。倒是小孩子束縛較小，有時與移民的小孩打群架互相叫罵；臺灣小孩罵日本小孩為「蝙蝠」（非鳥非獸，仗勢欺人），移民則回以「清國奴」。臺灣人背地裡稱日本人「四腳仔」（禽獸）、「日本狗」；日本人視臺灣人為三等國民。民族之間仇視、衝突的情況，在早期相當嚴重。民族之間的衝突和對立，等到移民逐漸僱用臺灣人耕種或招佃以後，才慢慢消弭。（題文改寫自：張素玢，《未竟的殖民――日本在臺移民村》第三節，臺北：衛城）'
  answer:
  - C
