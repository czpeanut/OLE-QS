- id: doc_112_新北_新北高中_社會_歷史_g10s2e2_s1_59
  section: 1
  number: 59
  type: single
  page: 11
  stem: 資料一中清代雍正乾隆禁止漢人前往開墾內蒙的真正原因是
  options:
  - label: A
    content: 漢人勢力壯大妨礙蒙人生計
  - label: B
    content: 怕破壞內蒙水土保持
  - label: C
    content: 違背蒙漢民族隔離政策
  - label: D
    content: 預防漢人引進俄人勢力開發內蒙
  group_stem: '資料一：雍正時看到蒙漢各族人民安居相處，一起事農，違背民族隔離政策，就深以為患，便提出：「民人（漢人）、蒙古雜居一處，亦屬無益」，「恐滋事端」，復令禁止察哈爾地方的招民開墾。到乾隆十四年，清政府嚴令禁墾。禁令宣布：「喀喇沁、土默特、敖漢、翁牛特等旗以及察哈爾八旗，嗣后將客留民人居住。增墾地畝者嚴令禁止。」清政府在禁墾理由上，是講：「若仍令招民墾種，有礙牧業，致妨蒙古生計。」（改寫自：陳文勝，李現臣，〈清代的漢族移民與蒙古族農業探討〉錄自《蒙古大學學報》，蒙古呼和浩特：蒙古學學院出版，2003 年 11 月出版，頁 28）

    資料二：為了保證軍糧的供應，清代在新疆辦起軍屯和民屯。由於軍屯、民屯互相交錯，為軍屯而興建的水利，對民屯也帶來好處。另外，因屯墾的需要，也輸入了生產工具和生產技術。內地來的大批移民不僅補充了當地勞動力的不足，更重要的是帶來中原先進的技術，迅速改變當地的農業面貌。（改寫自：鄭天挺等著，《清史》，臺北：昭明出版社，1999 年 9 月出版，頁 424）

    資料三：為生活所迫，漢人衝破清朝禁令，成批到關外從事開墾。乾隆六年，奉天各屬新編人口僅有一萬三千八百餘人，到乾隆四十六年，就增加到三十九萬餘人。雍正初年，奉天各屬旗地、民田共八萬五千三百餘頃，到乾隆四十五年間就增加到十五萬六千七百餘頃。其他吉林、黑龍江等地的人口和墾田數也有明顯增長。（改寫自：鄭天挺等著，《清史》，臺北：昭明出版社，1999 年 9 月出版，頁 422）'
  answer:
  - C
