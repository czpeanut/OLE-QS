  section: 1
  number: 64
  type: single
  page: 12
  stem: 根據上述資料，我們可以將之做為哪一篇小論文的相關資料呢？
  options:
  - label: A
    content: 唐朝軍事擴張史
  - label: B
    content: 唐朝人種遷徙史
  - label: C
    content: 唐朝城市發展史
  - label: D
    content: 唐朝國際關係史
  group_stem: '資料一：唐朝前期的武功興盛，國際交通非常便利，外族降附與來華經商或求學的人相當多，尤其是因戰爭被唐朝所俘虜而強迫遷至中國的，自貞觀四年至天寶四載間，總數到達一百七十萬人以上，包括有突厥、鐵勒、高麗、吐蕃、党項、吐谷渾等外族。

    資料二：唐朝時，來華經商的外族有波斯、大食、西域人士等，聚集在廣州、揚州等地，其中揚州最為繁盛；此外，新羅與崑崙人則多為國人用為奴隸。帝國西部的益州（今成都），因為位於唐朝、吐蕃、南詔三國的要衝，乃是西部最大的都會。'
