  stem: 一位近代地理學家在綜論四川人口地理結構時說：「雖然清代以前的本地人後裔還能在西南及西部少數地方找到，但相對來說數量很少。四川東部、西部和南部以湖廣籍為主，河南、安徽和江蘇籍，主要在南部各縣，相當多的陝西、甘肅籍在北部和西部某些縣分，廣東、福建、江蘇和浙江籍則主要住在成都和重慶等大城市。」這種人口地理結構的形成，主要的因素是
  options:
  - label: A
    content: 從順治到道光年間，各省過剩人口不斷移入四川
