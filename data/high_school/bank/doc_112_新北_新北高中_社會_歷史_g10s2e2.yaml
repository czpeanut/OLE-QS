  stem: 中國人常說多子多孫多福氣，添丁總是喜事一樁，可舉家歡慶的大事。不過有時為了逃避政府規定的徭役，常會有隱匿實際人口數虛報假數據。但隨著政策的改變，特別是某項稅制改革以後，百姓就不需要再隱匿人口了。請問這項新稅制應是下列何者？
