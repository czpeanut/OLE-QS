    53.根據題文資料，早期日本移民與臺灣人的民族衝突和緩是在移民逐漸僱用臺灣人耕種或招佃以後，但日本移民來臺本就是以農業開墾為主，會僱用臺灣人耕種則表示日本移民勞動力不足，因此最可能的原因就是戰爭所造成，故答案選(C)。

    54.最早的移民村皆設於臺灣東部的花蓮，因此答案為(D)豐田。

    55.越南文化深受中國影響，因此春捲與中國春捲的做法近似；資料二泰國的飲食內容亦與中國雷同，因此答案為(D)。(A)(B)並無春捲之類的飲食。(C)歷史上，越南、泰國與日本並無交集。

    56.(A)(B)由中國傳入的是中國化佛教。(C)○○國為中國，非日本。

    57.(A)(B)與史實不符。(C)為正解。(D)資料僅提到排華，並針對所有的移民。

    58.兩則資料說明華工在美國生存的艱難處境，因此答案選(B)較(C)為佳。

    59.資料一提及雍正看到蒙漢各族安居相處，因「違背民族隔離政策」而深感不安，因此可知答案為(C)。

    60.資料二一開頭就提到「為了保證軍糧的供應」，因此辦理軍屯和民屯，故(A)為正解。

    61.資料三提及「為生活所迫，漢人衝破清朝禁令，成批到關外從事開墾」，即是東北人口不斷增加的原因，因此答案為(C)。

    62.甲為 1897 年，乙為 1930 年代九一八事變後，丙為 1940 年代中葉二戰後期，丁為 1910 年為日本併吞後，因此依時間先後順序為(C)甲丁乙丙。

    63.乙提到的國家計畫，指的是受日本政府動員至中國東北拓墾，正確答案為(C)。(A) 1931 年九一八事變後。(B)「大陸花嫁」是針對日本移民，非朝鮮移民。(D)應是滿洲拓殖株式會社。

    64.兩則資料皆提供唐朝時，旅居在中國境內的外族人士與聚居地相關訊息，因此答案為(D)唐朝國際關係史。

    65.(A)源自中國本土。(C)(D)漢代張騫通西域後傳入。

    66.(A)為正解。(B)國際交通便利，無需派遣使節開通西域路線。(C)夷夏之防觀念淡薄，能懷柔遠人。(D)海上貿易發達，以阿拉伯商人最重要。

    67.棉花自宋代引進後，經元代黃道婆改良紡織技術後，明代的棉織業發展已經超過傳統的絲織業，題文所述即明代棉織業的分工流程，並形成產銷棉布的專業化市鎮，因此答案為(D)。

    68.就棉布的生產而言，棉花產地與棉布生產、銷售的地點不同，因此最符合的概念為(A)空間分工。(B)此時尚未為大型企業能將整個產銷流程垂直整合。(C)題文敘述不符合人力資本累積的概念。(D)題文敘述僅見城鄉分工，無法判斷是否有供需互補情形。

    69.題文所描述的戰爭應為第二次世界大戰，當時拓殖會社招募移民要前往的「新成立政權」應是(C)東北地區的滿洲國。

    70.二戰結束後，搶先進入中國東北接受日本投降的是(B)蘇聯部隊。'
