  answer_status: verified
  answer_source: answer_key
  explanation: 題文顯示四川的人口結構以外來移入人口居多，尤其是在清代以後，最主要的原因是明末清初的動亂，尤其流寇張獻忠屠蜀而人口銳減，因此清初政府以免除賦稅方式獎勵移民，從江西、湖南、湖北等地地移入開墾荒地，因此而「湖廣填四川」之說，(A)為正解。
