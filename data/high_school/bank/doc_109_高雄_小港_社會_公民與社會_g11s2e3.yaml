questions:
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關《勞基法》中基本勞動條件的規定，下列敘述何者正確？
  options:
  - label: A
    content: 「一例一休」指一週有兩天的休假，但都可以依雇主要求彈性調整為加班
  - label: B
    content: 強制一週有一天不能加班的假日，在於保障勞工享有必要的文化休閒生活
  - label: C
    content: 基本工資的規定將使雇主人力成本增加，因此對經濟成長僅具有負面影響
  - label: D
    content: 因為有每週最高工時的規定，勞工在任何情況下都不能加班超過四十小時
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 為尊重個人意志與經濟自由，國家多採取「私法自治」原則，並主要以「契約自由」來實現。然而，為調和締約雙方不對等的情形，國家會訂定各種限制以貫徹「契約正義」。以下制度設計何者最為體現此種內涵？
  options:
  - label: A
    content: 《勞動基準法》中規定，工資應當由勞雇雙方議定之
  - label: B
    content: 《消費者保護法》規定，企業得選擇訂立定型化契約
  - label: C
    content: 《自來水法》中規定，自來水公司不可任意拒絕供水
  - label: D
    content: 《民法》規定，契約原則上得以書面或口頭方式訂立
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 依據交通部的規定，若旅行社與消費者簽訂國外旅遊契約，應至少給予一日的契約審閱期間。以下關於此種審閱期間的敘述何者正確？
  options:
  - label: A
    content: 審閱期間的規定在使旅行社能充分考量訂約後可能負擔的風險與成本
  - label: B
    content: 審閱期間的規定在使主管機關能夠有時間充分審查契約是否平等互惠
  - label: C
    content: 審閱期間的規定僅具參考意義，若出團在即旅行社可不必遵守該規定
  - label: D
    content: 若消費者當場已經完整閱讀和理解旅遊契約，即可逕行與旅行社簽約
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 小花在網路書店購買喜歡的披頭四的唱片與寫真集且已匯款，但是收到貨品當下發現自己已經有一樣的寫真集了，拆封唱片後又發現書店誤寄成五月天的唱片。以下敘述何者正確？
  options:
  - label: A
    content: 因唱片易於拷貝，行政院規定若拆封即不適用七日猶豫期，故小花不可退貨
  - label: B
    content: 因小花出於過失未於購買時發現已有同本寫真集，小花不能以此為由退貨
  - label: C
    content: 依民法與消保法規定，無論是寫真集還是唱片，小花都可以向書店要求退貨
  - label: D
    content: 若網站公告所有商品都不適用七日猶豫期，小花下單即為同意，故不可退貨
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: A公司計畫將其商用大樓的空間出租，於是事先擬定了定型化契約供簽約之用。以下敘述何者正確？
  options:
  - label: A
    content: 甲要租用2樓作為個人工作室，因僅為租賃關係，故不受《消保法》保障
  - label: B
    content: 乙要租用3樓為倉儲空間，可與A公司個別磋商定型化契約中的內容
  - label: C
    content: 丙公司要承租4樓辦公空間，因非消費者，故不能與A公司個別磋商
  - label: D
    content: 丁公司租下5樓後如因租賃關係涉訟，法院對契約應為有利丁的解釋
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小陳與妻子小芳結婚前約定採取法定夫妻財產制。婚後小芳生下小孩，小陳為了照顧好家庭，衡量雙方收入後，決定辭職在家帶小孩和負責家務。以下敘述何者正確？
  options:
  - label: A
    content: 小陳與小芳婚前已約定好採取法定財產制，婚後即無法再更改為共同財產制
  - label: B
    content: 小陳除了可向小芳請求家庭生活費用，雙方可協議自由處分金作為家務的回報
  - label: C
    content: 小芳拒絕再提供家庭生活費用，仍有自己存款的小陳無法向法院提起訴訟請求
  - label: D
    content: 若兩人離婚，小陳可向小芳請求兩人全部財產差額的一半作為負擔家務的補償
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小曼與小文結婚後，小曼的父母贈與小曼價值800萬的房產一間，小曼婚後努力工作，加上房產婚後財產累積了1600萬，但也因為經營生意負擔200萬元債務。小文是一名上班族每年可存100萬元。三年後小曼與小文離婚。其結婚時未約定夫妻財產制。以下敘述何者正確？
  options:
  - label: A
    content: 小文可以向小曼請求550萬元之剩餘財產差額
  - label: B
    content: 小文可以向小曼請求250萬元之剩餘財產差額
  - label: C
    content: 小文可以向小曼請求150萬元之剩餘財產差額
  - label: D
    content: 小文可以向小曼請求100萬元之剩餘財產差額
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 請問法定夫妻財產制中，有關其制度以及剩餘財產差額分配請求權，下列何者正確？
  options:
  - label: A
    content: 該制度就是為了保障婚姻關係經濟弱勢的一方
  - label: B
    content: 法定財產制關係存續中，才可以請求差額分配
  - label: C
    content: 法定制度，就算約定其他分產方法也不得牴觸
  - label: D
    content: 請求完差額分配後，雙方財產會相同以達平等
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 王先生去世後留下遺產600萬元，且並未留下遺囑。他與妻子並未有任何兒女，家人也僅剩下王先生的祖母和其過世哥哥的兒子小可。關於他的遺產該如何分配，以下敘述何者正確？
  options:
  - label: A
    content: 王先生的妻子可分得遺產400萬元，其祖母可分得遺產200萬元
  - label: B
    content: 因王先生無子女，其妻子為當然繼承人，將繼承王先生全部遺產
  - label: C
    content: 王先生祖母為第二順位繼承人，將繼承王先生的遺產共300萬元
  - label: D
    content: 王先生的哥哥因已過世而無法繼承，故將由其兒子小可代位繼承
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 甲生前創立公司，累積財富60億元，其配偶乙、父親丙、大兒子丁、女兒戊、過世的小兒子的3名子女己、庚、辛開始清算甲生前遺產，準備進行分配。不過就在分配過程中，女兒戊就出車禍過世，留下其配偶與兒子。應如何分配甲的遺產？
  options:
  - label: A
    content: 配偶乙為當然繼承人，將與甲父丙和甲的子女們一起平均分配遺產
  - label: B
    content: 配偶乙將與甲各直系卑親屬平分遺產，故每人將分得10億元的財產
  - label: C
    content: 小兒子的3名子女將可代位繼承甲的遺產，各可分得5億元的財產
  - label: D
    content: 女兒戊去世後，其兒子即代位繼承甲的遺產，可分得15億元的財產
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 陳女士曾購買價值1200萬元的房產一間，留下存款100萬元，債務900萬元，在過世前5個月時知道自己來日不多，又生怕丈夫與兒子還不起債務致使房子被拍賣，遂將房產贈與其丈夫。下列敘述何者正確？
  options:
  - label: A
    content: 我國繼承制度採概括繼承制度，陳女士的丈夫與兒子須聲明拋棄繼承
  - label: B
    content: 因陳女士已將該房產贈與其丈夫，故該房產即不會視為遺產的一部分
  - label: C
    content: 由於生前2年內的贈與仍屬應繼財產，故丈夫與兒子仍可繼承該房產
  - label: D
    content: 縱使未經拋棄繼承，丈夫與兒子仍無需以自己財產清償陳女士的債務
