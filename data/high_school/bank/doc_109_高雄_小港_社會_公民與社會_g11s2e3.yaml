- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s2_33
  section: 2
  number: 33
  type: single
  page: 4
  stem: 若印度政府禁止進口中國產品作為抵制，而中國決定將爭議訴諸WTO，雙方提出的攻防的論點，請問何種說法最符合WTO的規範？
  options:
  - label: A
    content: 中國：印度禁止中國產品進口，違反了最惠國待遇原則
  - label: B
    content: 印度：中國產品價格較低，對印度廠商構成不公平競爭
  - label: C
    content: 中國：印度的做法對印度廠商有利，違反國民待遇原則
  - label: D
    content: 印度：印度屬於開發中國家，對中國產品應該漸進開放
  group_stem: (二) 中國及印度在邊境爭議區域發生衝突，印度出現抵制中國產品的呼聲。對此，印度著名經濟、政治評論家莫漢‧古魯斯瓦米受訪時指出，印度抵制中國產品既荒謬又不切實際。 首先，印度政府不可能抵制中國產品，因為那會違反WTO的規範。其次，若呼籲民間發起抵制，效果恐怕也不大，因為中國手機的價格只有韓國三星、臺灣HTC或者日本SONY的一半。再者，印度有23％的進口來自中國，當中國受到疫情打擊時，印度所有的汽車製造活動都放緩了；此外，中國境內的廠商可以適用相當低的勞動及環保標準，包含超時工作及污染排放，進而壓低產品價格；但若印度要以國貨取代這些進口，價格勢必大漲。相較之下，中國並不依賴印度的東西。 古魯斯瓦米進一步說明，印度和中國在1990年的人均GDP差不多，但中國從2000年起拉開差距，每4-5年就翻倍成長。而印度近年的經濟成長動能，部分即是來自與中國的競爭、向中國學習及進口。除非印度妥善制定長期發展計畫並加以落實，否則印度的經濟並不具備抵制中國的本錢。
