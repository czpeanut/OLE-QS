    content: 小怪：感覺不錯喔，但是我想幫外公插秧
  - label: C
    content: 阿喜：我也想到社福機構當志工服務大家
  - label: D
    content: 小萍：我媽媽叫我要好好打掃家裡各角落
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 假設某一農場從國外進口1萬元的仔豬，把牠們養大後賣給農產運銷公司，得款10萬元。農產公司把這批毛豬加工製成香腸，賣給百貨公司，得款16萬元。百貨公司再將這批香腸分裝販售，得款30萬元。請問這個生產流程對於GDP的貢獻是多少？
  options:
  - label: A
    content: 56萬元
  - label: B
    content: 55萬元
  - label: C
    content: 29萬元
  - label: D
    content: 30萬元
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 以下何者「不會」列入GDP的計算中？
  options:
  - label: A
    content: 從藝術拍賣場以5千萬元標得國畫大師的遺作
  - label: B
    content: 付給慶宜證券的12萬元股票買賣手續費
  - label: C
    content: 農夫小陳食用自種之米糧，估計價值5千元
  - label: D
    content: 國泰建設賣了一間價值1千萬元的新建公寓
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 請問下列何種情形，會使消費者購買羽絨外套的交易成本減少？
  options:
  - label: A
    content: 各家廠商換季出清，羽絨外套全面打折
  - label: B
    content: 暖冬出現，羽絨外套的消費者偏好減少
  - label: C
    content: 網購平台發達，供人迅速比較價格及款式
  - label: D
    content: 羽絨外套擴大進口，導致國內的價格下跌
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 假設澳洲與奧地利之間出現下列情形，請問何者「違反」WTO的國民待遇原則？
  options:
  - label: A
    content: 奧地利產品輸入澳洲必須繳交關稅，但澳洲本土產品卻不用繳交關稅
  - label: B
    content: 奧地利規定本土食品須標示成分，進口食品則還須標示反式脂肪含量
  - label: C
    content: 奧地利對澳洲農產品課徵關稅，澳洲對奧地利農產品卻沒有課徵關稅
  - label: D
    content: 澳洲規定境內的奧地利國民不得任職於國防相關的高度敏感性產業
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 某國自甲、乙兩國進口汽車之關稅原本分別為25％、40％，當三國均加入世界貿易組織後，某國對甲、乙兩國進口汽車之關稅均訂為25％。根據上述，下列何者正確？
  options:
  - label: A
    content: 對乙國的關稅調降至25％，符合最惠國待遇原則
  - label: B
    content: 對甲國的關稅維持不變，符合國民待遇原則
  - label: C
    content: 對不同國家課以相同關稅，符合國民待遇原則
  - label: D
    content: 甲國原本適用較低之關稅，符合最惠國待遇原則
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 小球與小果交往多年後結婚，兩人未約定婚姻財產制。經雙方商討後，小果決定放棄他原本的工作全心操持家務，小球則是在婚後事業蒸蒸日上，不過，也因天天應酬導致夫妻感情生變，兩人在結婚數年後離婚。以下是兩人離婚爭執時的對話，何者對於夫妻財產制有正確的觀念？
  options:
  - label: A
    content: 小球：既然每月有給你自由處分金，離婚後就可以不用再分財產給你
  - label: B
    content: 小果：你結婚前買的房子，離婚後我也是可以要求轉讓一半的所有權
  - label: C
    content: 小球：我結婚後買的高檔名錶是我的特有財產，不宜計算在婚後財產
  - label: D
    content: 小果：我爸媽去世後我所繼承的大筆遺產，離婚後完全不用跟你分配
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 知名藝人日前與先生簽字離婚，在節目上分享離婚經歷。說自己結婚後從演藝圈退出，專心項夫教子，但與先生漸行漸遠，最後決定離婚。蔚萊跟學校朋友討論這個新聞，請問下列敘述何者正確？
  options:
  - label: A
    content: 蔚萊：還好政府有強制要求有工作的一方要給沒工作的一方自由處分金
  - label: B
    content: 小銘：自由處分金好像只能用在家庭的開銷支出上，跟零用錢不太相似
  - label: C
    content: 大方：雖然有規定剩餘財產分配制度，但這個好像夫妻有去登記才適用
  - label: D
    content: 正正：還有一個婚後財產報告的義務，主要是避免分配請求權受到侵害
- id: doc_109_高雄_小港_社會_公民與社會_g11s2e3_s1_21
  section: 1
  number: 21
