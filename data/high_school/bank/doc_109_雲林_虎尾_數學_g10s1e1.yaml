  - label: B
    content: $\sqrt{5}$與$\sqrt{6}$之間有無窮多個有理數
  - label: C
    content: 5與6之間有無窮多個無理數
  - label: D
    content: a、b為實數，若a＋b$\sqrt{2}$＝0，則a、b均為零
  - label: E
    content: 不等式 | x |＞5的解用區間符號可表為 [－∞,－5 ]∪[ 5 , ∞]
