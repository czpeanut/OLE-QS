  stem: 「俄羅斯西伯利亞有大片的永凍層，幾萬年來不曾融化。但近來由於人們大量燃燒化石燃料，造成溫室效應，天氣愈來愈熱，數萬年不曾融化的冰凍層竟然破天荒開始融解。冰變成了水，原來堅硬的土壤開始軟化、下陷，接著樹木倒塌，深藏地底的冰楔都曝露出來。西伯利亞的永凍層也是世界最大的泥煤田，若任由融化，所釋放出的沼氣不但有毒，還可能使得全球溫室效應更趨嚴重。永凍層融解還導致原本平坦的路面下陷、崎嶇難行，湖泊數量增加，當地建築物的牆壁嚴重龜裂，民眾賴以維生的漁獲量大大減少……」請問此報導的內容側重於地理學中的哪項傳統？
  options:
  - label: A
    content: 空間傳統
  - label: B
    content: 生態傳統
  - label: C
    content: 區域傳統
  - label: D
    content: 地球科學
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文敘述永凍土融化在各方面的影響，為因果關係的討論，因此是(B)生態傳統。
