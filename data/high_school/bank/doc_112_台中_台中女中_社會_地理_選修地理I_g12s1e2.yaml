- id: doc_112_台中_台中女中_社會_地理_選修地理I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 臺灣地圖常見坐標表示方法為經緯度與 TM 2 投影坐標。今有 2 個點的 TM 2 坐標為甲（248500 , 2585000）、乙（340000 , 2767000），以及另外 2 個點的坐標為丙（121°E , 23.6°N）、丁（121.6°E , 24.5°N），這 4 點位置由西到東排列順序為何？
  options:
  - label: A
    content: 甲丙乙丁
  - label: B
    content: 甲丙丁乙
  - label: C
    content: 丙甲丁乙
  - label: D
    content: 丙甲乙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '①由經緯度坐標可知丙在丁的西方。

    ② TM 2 坐標的 Y 軸在東經 121 度西方 250,000 公尺，乙的 X 值為 340,000，一度緯距約 110 公里，（340,000－250,000 公尺）／110 公里＝0.81 度，即大約位在東經 121.8 度的位置，因此丙、丁在乙的東方。

    ③ TM 2 坐標的 X 值愈大則愈東，因此甲在乙的西方。

    綜合以上①～③點，由西到東排列應為：(B)甲丙丁乙。'
