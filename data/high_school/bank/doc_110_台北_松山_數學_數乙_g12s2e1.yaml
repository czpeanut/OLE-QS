- id: doc_110_台北_松山_數學_數乙_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若方程式 $x^{2}$－3x＋k＝0 有兩個共軛虛根，則實數 k 可以為哪一個數？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
    asset:
      key: s1_1_optC
      file: doc_110_台北_松山_數學_數乙_g12s2e1/s1_1_optC.png
      crop:
        page: 1
        rect:
        - 462.4
        - 263.4
        - 564.3
        - 365.3
  - label: D
    content: －1
  - label: E
    content: －2
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∵方程式 $x^{2}$－3x＋k＝0 有兩個共軛虛根

    ∴判別式為（－3）$^{2}$－4×1×k＜0$\Rightarrowk > \frac{9}{4}$

    故選(C)'
- id: doc_110_台北_松山_數學_數乙_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 複數平面上，若 $z_{1}$，$z_{2}$ 所對應的點位置，如右圖所示，則 $z_{2}$－$z_{1}$ 所對應的點位置，最可能是哪一個位置？
  options:
  - label: A
    content: A
  - label: B
    content: B
  - label: C
    content: C
  - label: D
    content: D
  - label: E
    content: E
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_110_台北_松山_數學_數乙_g12s2e1/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 445.9
      - 392.25
      - 564.3
      - 493.05
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $z_{1}$＝a＋bi，$z_{2}$＝c＋di，其中 a，b，c，d 為實數

    $\Rightarrowz_{2}$－$z_{1}$＝（c－a）＋（d－b）i

    ∵a＜c＜0 且 b＞0＞d

    ∴c－a＞0，d－b＜0，又 d－b＜d

    故選(D)'
