  stem: '某公司招聘員工，共有 1600 人參加筆試。筆試場地借用學校的教室，該校可使用的大教室有 50 間，每間可容納 40 人，每間租金 500 元；小教室有 40 間，每間可容納 20 人，每間租金 200 元，考慮監考人員的限制，筆試教室總數不能超過 55 間。設租借大教室 x 間，小教室 y 間，試依下列步驟，求最節省場地租金的租借方式。

