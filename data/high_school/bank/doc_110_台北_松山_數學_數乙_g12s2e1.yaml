- id: doc_110_台北_松山_數學_數乙_g12s2e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 2
  stem: '已知一個線性規劃問題的可行解區域為四邊形 ABCD 及其內部，頂 點分別為 A（0，6），B（8，12），C（11，3），D（4，1），如右圖。若目標函數 P＝ax＋by＋8（a，b 為實數）在四邊形 ABCD 的邊界上一點（9，9）有最大值 80。試求：

    (1) 數對（a，b）＝＿＿＿＿。

    (2) P＝ax＋by＋8 的最小值為＿＿＿＿。'
  assets:
  - key: s3_1_f1
    kind: figure
    file: doc_110_台北_松山_數學_數乙_g12s2e1/s3_1_f1.png
    crop:
      page: 2
      rect:
      - 442.15
      - 198.05
      - 564.3
      - 271.45
  answer:
  - (1)（6，2）；(2) 20
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) ∵（9，9）在$\overline{BC}$上

    由平行線法可知目標函數 P 在點（9，9），B（8，12），C（11，3）的值皆為 80

    $\Rightarrow\begin{cases}9a + 9b + 8 = 80 \\ 8a + 12b + 8 = 80\end{cases}$

    解得 a＝6，b＝2，故數對（a，b）＝（6，2）

    (2) 承(1)，目標函數 P＝6x＋2y＋8

    由平行線法可知，最小值發生在 A（0，6），故最小值為 2×6＋8＝20'
- id: doc_110_台北_松山_數學_數乙_g12s2e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 化簡$\overline{3i + 2} +\frac{3 - 4i}{1 + 2i}$＝＿＿＿＿。
  answer:
  - 1－5i
  answer_status: verified
  answer_source: answer_key
  explanation: '$\overline{3i + 2} +\frac{3 - 4i}{1 + 2i}$＝$( 2 - 3i )+\frac{3 - 4i}{1 + 2i}\times \frac{1 - 2i}{1 - 2i}$

    ＝$( 2 - 3i )+\frac{3 - 6i - 4i - 8}{5}$＝$( 2 - 3i )+\frac{- 5 - 10i}{5}$＝1－5i'
- id: doc_110_台北_松山_數學_數乙_g12s2e1_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 已知 z 為複數且（1＋i）z＋（2－3i）$\overline{z}$＝1－8i，則 z＝＿＿＿＿。
  answer:
  - 3＋2i
  answer_status: verified
  answer_source: answer_key
  explanation: '設 z＝a＋bi

    （1＋i）（a＋bi）＋（2－3i）（a－bi）＝1－8i

    $\Rightarrow$（a－b）＋（a＋b）i＋（2a－3b）＋（－3a－2b）i＝1－8i

    $\Rightarrow$（3a－4b）＋（－2a－b）i＝1－8i

    解$\begin{cases}3a - 4b = 1 \\ -2a -b =-8\end{cases}$，可得 a＝3，b＝2 ∴z＝3＋2i'
