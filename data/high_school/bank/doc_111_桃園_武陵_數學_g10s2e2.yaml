- id: doc_111_桃園_武陵_數學_g10s2e2_s1_1
  section: 1
  number: 1
  type: fill
  page: 1
  stem: '設有甲、乙、丙、丁、戊等 5 人排成一列，試求下列的排法數：

    (1) 甲乙相鄰且丙丁不相鄰的排法有＿＿＿＿種。

    (2) 甲不排首且乙不排末的排法有＿＿＿＿種。

    (3) 甲在乙左方，且丙在丁左方的排法有＿＿＿＿種。（左方不一定相鄰）

    (4) 甲恰與乙丙兩人中的某一人相鄰的排法有＿＿＿＿種。'
  answer:
  - (1) 24；(2) 78；(3) 30；(4) 72
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) n（甲乙相鄰）－n（甲乙相鄰且丙丁相鄰）

    ＝4！×2！－3！×2！×2！＝48－24＝24（種）

    (2) n（全部）－n（甲排首）－n（乙排末）＋n（甲排首且乙排末）

    ＝5！－4！－4！＋3！＝120－24－24＋6＝78（種）

    (3) 將甲乙視為相同物，丙丁視為相同物

    所求有$\frac{5 ！}{2 ！ 2 ！}$＝30（種）

    (4) n（甲乙相鄰）＋n（甲丙相鄰）－2×n（甲乙且甲丙相鄰）

    ＝4！×2！＋4！×2！－2×（2×3！）＝48＋48－24＝72（種）'
- id: doc_111_桃園_武陵_數學_g10s2e2_s1_2
  section: 1
  number: 2
  type: fill
  page: 1
  stem: 若$\left( x^{2}-\frac{a}{x} \right) ^{8}$的展開式中，$x^{7}$ 項的係數為－448，則常數 a＝＿＿＿＿。
  answer:
  - '2'
  answer_status: verified
  answer_source: answer_key
  explanation: '展開後一般項為 $C_{k}^{8} (x^{2})^{8-k}\left( -\frac{a}{x} \right) ^{k}$＝$C_{k}^{8} (-a)^{k}x^{16-3k}$

    ⇒ 16－3k＝7 ⇒ k＝3

    得 $C_{3}^{8}$×（－a）$^{3}$＝－448

    ⇒ －$56a^{3}$＝－448 ⇒ $a^{3}$＝8 ⇒ a＝2'
