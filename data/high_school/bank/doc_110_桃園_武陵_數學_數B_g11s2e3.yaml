  stem: '設 P(A)＝$\frac{3}{8}$，P（A∪B）＝$\frac{3}{4}$，P（B''）＝$\frac{1}{3}$，試求：

    (1) P（A∩B）＝＿＿＿＿。

    (2) P（A｜B）＝＿＿＿＿。'
  answer:
