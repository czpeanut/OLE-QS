- id: doc_110_桃園_武陵_數學_數B_g11s2e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: '下課時間，同學在聊天

    <u>小楷</u>說：『世界盃棒球賽中，球評判斷本場比賽中華隊獲勝機率 6 成、日本隊 4 成。』

    <u>小勛</u>說：『氣象預報：當天會下雨的機率有 90 ％。』

    <u>小穎</u>說：『我看比賽百分之百要延期了啦。』則下列何者正確？'
  options:
  - label: A
    content: <u>小楷</u>說的是主觀機率
  - label: B
    content: <u>小楷</u>說的是客觀機率
  - label: C
    content: <u>小勛</u>說的是主觀機率
  - label: D
    content: <u>小勛</u>說的是客觀機率
  - label: E
    content: <u>小穎</u>說的是客觀機率
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：球評無提出數據佐證，故為主觀機率

    (B)╳：同(A)

    (C)╳：氣象預報來自科學計算，故為客觀機率

    (D)○：同(C)

    (E)╳：無提出數據佐證，故為主觀機率

    故選(A)(D)'
- id: doc_110_桃園_武陵_數學_數B_g11s2e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 袋中有 3 顆白球、7 顆紅球，今自袋中隨機取球，設每顆球被取到的機率都相等，一次取一球，取後不放回，則下列敘述何者正確？
  options:
  - label: A
    content: 取兩次後，恰為一白球一紅球的機率為$\frac{7}{15}$
  - label: B
    content: 第二次取到的是紅球的機率為$\frac{2}{3}$
  - label: C
    content: 第一次取到白球的條件下，則第二次取到的是白球的機率為$\frac{2}{9}$
  - label: D
    content: 第一次取到白球的條件下，則第三次取到的是白球的機率為$\frac{2}{9}$
  - label: E
    content: 第二次取到白球的條件下，則第一次取到的是白球的機率為$\frac{1}{3}$
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\frac{3}{10}\times \frac{7}{9}+\frac{7}{10}\times \frac{3}{9}$＝$\frac{7}{15}$

    (B)╳：$\frac{7}{10}\times \frac{6}{9}+\frac{3}{10}\times \frac{7}{9}$＝$\frac{7}{10}$

    (C)○：$\frac{\frac{3}{10}\times \frac{2}{9}}{\frac{3}{10}}$＝$\frac{2}{9}$

    (D)○：P（第三次白｜第一次白）

    ＝P（第二次白｜第一次白）＝$\frac{2}{9}$

    (E)╳：$\frac{\frac{3}{10}\times \frac{2}{9}}{\frac{7}{10}\times \frac{3}{9}+\frac{3}{10}\times
    \frac{2}{9}}$＝$\frac{2}{9}$

    故選(A)(C)(D)'
- id: doc_110_桃園_武陵_數學_數B_g11s2e3_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設 A、B 為樣本空間 S 中的兩事件，P
  options:
  - label: A
    content: ＝$\frac{1}{3}$，P（A∪B）＝$\frac{2}{3}$，則下列何者正確？(A) P
  - label: B
    content: 的最大值為$\frac{1}{3}$(B)若 A、B 為獨立事件，則 P(B)＝$\frac{1}{2}$
  - label: C
    content: 若 A、B 為獨立事件，則 P（A｜B）＝$\frac{1}{3}$
  - label: D
    content: 若 A、B 為互斥事件，則 P（A∩B）＝$\frac{1}{6}$
  - label: E
    content: 若 A、B 為互斥事件，則 P（B｜A'）＝$\frac{1}{3}$
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：當 A$\subseteq$B，則 P(B)＝P（A∪B）＝$\frac{2}{3}$

    (B)○：若 A，B 獨立，P（A∩B）＝P(A)×P(B)

    則 P（A∪B）＝P(A)＋P(B)－P(A)×P(B)

    ⇒$\frac{2}{3}$＝$\frac{1}{3}$＋P(B)－$\frac{1}{3}$P(B)

    ⇒ P(B)＝$\frac{1}{2}$

    (C)○：P（A｜B）＝P(A)＝$\frac{1}{3}$

    (D)╳：若 A，B 互斥，P（A∩B）＝0

    (E)╳：P（A∪B）＝P(A)＋P(B)－P（A∩B）

    ⇒$\frac{2}{3}$＝$\frac{1}{3}$＋P(B)－0

    ⇒ P(B)＝$\frac{1}{3}$

    又 P（B｜A''）＝$\frac{P (B\cap A'' )}{P (A'' )}$＝$\frac{P (B ) - P (A\cap B )}{\frac{2}{3}}$

    ＝$\frac{\frac{1}{3}-0}{\frac{2}{3}}$＝$\frac{1}{2}$

    故選(B)(C)'
