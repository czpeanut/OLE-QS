  group_stem: 全球電影 DVD 租借龍頭的百視達（Blockbuster），原在全美擁有近萬家分店，是許多家庭週末電影租片時必訪之處，2019 上半年宣告僅剩 1 家門市，並於 2010 年宣布破產……此與近年網飛（Netflix）等網路串流平臺崛起，以線上月租方式讓用戶觀片，透過演算法主動推薦用戶喜愛的影集或電影的出現攸關。然，2019 年第 2 季，網飛在美國訂閱數罕見下降 13 ％，同年 8 月，同業中哥倫比亞廣播集團（CBS）和美國第 3 大傳媒公司維亞康姆（Viacom）併為「ViacomCBS」，成為網飛的最新挑戰者。競爭白熱化的串流影音市場，從併購到燒錢做節目，後起之秀來勢洶洶，未來市場誰是贏家還不可知。請問：
