  page: 1
  stem: 傳統上，鮮乳因產品特性，酪農業的牧場多緊鄰消費市場，但今日，臺灣大賣場也能買到美國進口的鮮乳，在未開封情況下能保存 70 天，英國甚至有超市取消鮮奶的有效期限標示，請顧客自行以嗅覺判斷。請問形成上述改變的原因，何者最合理？
