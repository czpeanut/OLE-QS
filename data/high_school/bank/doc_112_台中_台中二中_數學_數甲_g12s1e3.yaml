  stem: 若 f（x）＝$\int_{1}^{x} ( 3t^{2}+4t-7 )dt$，則下列哪些選項是方程式 f'（x）＝0 的解？
  options:
  - label: A
    content: －4
  - label: B
    content: '4'
  - label: C
    content: －1
  - label: D
    content: '1'
  - label: E
    content: '0'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '由微積分基本定理知 f''（x）＝$3x^{2}$＋4x－7

    f''（x）＝$3x^{2}$＋4x－7＝（3x＋7）（x－1）＝0

    $\Rightarrow$x＝$-\frac{7}{3}$或 1

