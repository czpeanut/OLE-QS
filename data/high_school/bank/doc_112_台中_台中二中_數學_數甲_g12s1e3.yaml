- id: doc_112_台中_台中二中_數學_數甲_g12s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 3
  stem: 已知$\int_{1}^{4} f ( x )dx$＝－6，則下列選項哪些是正確的？
  options:
  - label: A
    content: $\int_{2}^{8} f ( x )dx$＝－12
  - label: B
    content: $\int_{1}^{4} | f( x ) |dx$＝6
  - label: C
    content: $\int_{1}^{4} 3f ( x )dx$＝－18
  - label: D
    content: $\int_{1}^{4} f ( 3x )dx$＝－2
  - label: E
    content: $\int_{1}^{4} ( f ( x )+5 )dx$＝9
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：反例：令 f（x）＝2x－7$\Rightarrow\int_{1}^{4} ( 2x - 7 )dx$＝$\left. ( x^{2}- 7x ) \right| _{1}^{4}$＝－6

    但$\int_{2}^{8} f ( x )dx$＝$\int_{2}^{8} ( 2x - 7 )dx$＝$\left. ( x^{2}-7x ) \right| _{2}^{8}$＝18≠－12

    (B)╳：反例同(A)，$\int_{1}^{4} | f ( x ) |dx$＝$\int_{1}^{3.5} ( -2x + 7 )dx+\int_{3.5}^{4} ( 2x - 7 )dx$≠6

    (C)○：$\int_{1}^{4} 3f ( x )dx$＝$3\int_{1}^{4} f ( x )dx$＝3×（－6）＝－18

    (D)╳：反例同(A)，$\int_{1}^{4} f ( 3x )dx$＝$\int_{1}^{4} ( 6x - 7 )dx$＝$\left. ( 3x^{2}- 7x ) \right| _{1}^{4}$＝24≠－2

    (E)○：$\int_{1}^{4} ( f ( x )+ 5 )dx$＝$\int_{1}^{4} f ( x )dx +\int_{1}^{4} 5dx$＝$\left. -6 + 5x \right| _{1}^{4}$＝－6＋15＝9

    故選(C)(E)'
