- id: doc_112_台中_台中二中_數學_數甲_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 已知多項式函數 f（x）的導函數 f'（x）＝$9x^{2}$－8x＋7，且 y＝f（x）的圖形通過點 （1，4），則下列哪一個選項是正確的？
  options:
  - label: A
    content: f(2)＝10
  - label: B
    content: f(2)＝20
  - label: C
    content: f(2)＝30
  - label: D
    content: f(2)＝40
  - label: E
    content: f(2)＝50
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f''（x）＝$9x^{2}$－8x＋7

    ∴令 f（x）＝$3x^{3}$－$4x^{2}$＋7x＋C

    又 f(1)＝4$\Rightarrow$3－4＋7＋C＝4$\Rightarrow$C＝－2

    得 f（x）＝$3x^{3}$－$4x^{2}$＋7x－2

    f(2)＝3×8－4×4＋7×2－2＝20

    故選(B)'
