- id: doc_112_台中_台中二中_數學_數甲_g12s1e3_s2_5
  section: 2
  number: 5
  type: multiple
  page: 3
  stem: '設 b 為實數，f（x）為 5 次實係數多項式且最高次項係數為 a。若

    $\int_{b}^{x} f ( t )dt$＝（$x^{2}$＋2x＋2）$^{3}$－1，則下列哪些選項是正確的？'
  options:
  - label: A
    content: a＝3
  - label: B
    content: a＝5
  - label: C
    content: b＝－1
  - label: D
    content: b＝－2
  - label: E
    content: f（x）的常數項為 24
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳(B)╳：由微積分基本定理知 $( \int_{b}^{x} f ( t )dt ) ''$＝（（$x^{2}$＋2x＋2）$^{3}$－1）''

    $\Rightarrow$f（x）＝3（$x^{2}$＋2x＋2）$^{2}$×（2x＋2）

    $\Rightarrow$a＝3×2＝6

    (C)○(D)╳：令 x＝b 代入$\Rightarrow\int_{b}^{b} f ( t )dt$＝（$b^{2}$＋2b＋2）$^{3}$－1

    $\Rightarrow$（$b^{2}$＋2b＋2）$^{3}$＝1$\Rightarrowb^{2}$＋2b＋2＝1$\Rightarrowb^{2}$＋2b＋1＝0$\Rightarrow$b＝－1

    (E)○：承(A)，常數項為 3×$2^{2}$×2＝24

    故選(C)(E)'
