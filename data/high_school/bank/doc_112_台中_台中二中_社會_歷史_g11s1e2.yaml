  explanation: '(1)資料一中，A 國沿著非洲海岸線往東方探險，是為葡萄牙；B 國向西向航行，是為西班牙。資料三，C 國於 17 世紀有「海上馬車夫」之稱，是為荷蘭。

    (2)渡渡鳥與象鳥位於非洲東岸的馬達加斯加島及模里西斯島，地理大發現後，位於歐洲人往東航行必經的路線上，此路線當時為葡萄牙所壟斷。

    (3)「教皇子午線」將葡萄牙與西班牙的海洋範圍畫出界線，當時兩國的目標皆是東方，「教皇子午線」以東則是給予最先航行的葡萄牙，因此答案為(A)。(B)兩國與「教皇子午線」的距離差不多。(C)(D) 15 世紀尚未占有海外殖民地，亦未開始工業革命，兩國經濟與工業實力相當。

