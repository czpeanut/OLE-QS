  stem: '閱讀下面三則資料，回答下列問題。

    【資料一】：15 世紀後期，A 國、B 國積極開拓新貿易航線，是歐洲最早從事海外探險的國家。A 國人率先沿非洲海岸探險來到東方，而 B 國人則往西航行偶遇一片新天地。1494 年，兩國在教宗主持下，簽署《托德西拉條約》（Treaty of Tordesillas），以大西洋約西經 46 度半的子午線為中線，劃分海洋作為勢力範圍，此線又稱「教皇子午線」。

    【資料二】：《國家地理雜誌》曾刊出研究發現：「……在早期，馬達加斯加及東邊的模里西斯島上有著奇特的象鳥（Elephant Bird）與渡渡鳥（Bodo Bird），這些鳥類的特徵是體型非常高大，可長到 3 公尺高，體重甚至達半公噸，因此不會飛……不過這種巨鳥後來都滅絕了……，時至今日模里西斯的國徽上仍保留了渡渡鳥的形象。……」。

    【資料三】：三十年戰爭結束後簽訂《西發里亞和約》，肯定主權平等的原則，各國可依照自身利益，與他國進行宣戰、媾和、締約，歐洲逐漸形成「列國制度」。近代國際秩序的維繫，主要是根據「均勢」原則。由於歐洲列國林立，主要國家實力相當，各國為免他國過於強大，威脅到本國利益，乃進行合縱連橫，以形成「制衡」力量。如當西班牙強盛時，法國即處心積慮予以打擊；而當法國變成強權時，英國隨即聯合 C 國與之抗衡。《西發里亞和約》簽訂後，各國相繼設立「外交部」、「常駐大使」。C 國學者格勞秀士有鑑於三十年戰爭死傷慘重，於是著有《戰爭與和平法律論》，把國際法系統化，賦予其哲學基礎（自然法），並呼籲在戰爭中要遵守人道主義原則，保護婦女兒童，寬待戰俘。早期的國際法中，許多規定都與戰爭行為有關，包括中立條款，規定戰爭時中立國不可受到侵害；交戰規定，交戰國可以互換俘虜；海事規定，規定公海航行自由、領海範圍與海軍禮節等，這些規定對 C 國最有利，因此 17 世紀的 C 國有「海上馬車夫」之稱。

    (1)請問資料一、三中的 A 國、B 國與 C 國，分別指何國家？

    (2)就以上資料及你的歷史思維分析，是哪個國家發現與捕殺，造成日後渡渡鳥與象鳥滅絕的？（請寫國名）

    (3)據上，15 世紀的海洋以「教皇子午線」劃分，其最主要原則是

    (4)「教皇子午線」劃分海洋的決議，應該會在哪一年被終止？（請寫年代）'
  options:
  - label: A
