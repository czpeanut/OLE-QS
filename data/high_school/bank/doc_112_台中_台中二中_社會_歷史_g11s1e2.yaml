  stem: 大航海時代以後，西印度群島大量生產蔗糖，銷往歐洲各國成為民生必需品。但 19 世紀初，歐陸糖價突漲，影響民生至鉅。試問導致當時糖價上漲的主因為何？
  options:
  - label: A
    content: 鄂圖曼土耳其帝國橫阻歐亞交通，造成歐洲蔗糖短缺
  - label: B
    content: 工業革命後，美國人口大幅成長，蔗糖消耗遽增，使歐洲供應短缺
  - label: C
    content: 拿破崙戰爭時，英法相互對抗封鎖，導致蔗糖供應短缺
  - label: D
    content: 中南美洲尋求獨立時，實施蔗糖禁運作為手段對抗歐陸強國，供應因而短缺
