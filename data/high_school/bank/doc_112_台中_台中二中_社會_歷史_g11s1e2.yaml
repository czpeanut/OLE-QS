- id: doc_112_台中_台中二中_社會_歷史_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '資料一：此後人類世界將進入一個新紀元，……而這也是盎格魯．薩克遜民族的勝利時代。

    資料二：歐洲列強都在中國燒殺擄掠，他們的行為簡直像歐洲中古時代的蠻人。……所有的白人似乎都瘋狂的以暴力去爭取他們各自的利益，絲毫沒有基督徒的精神。

    資料三：使用武力才能破壞那些早已摧殘非洲內陸數百年的野蠻習慣、奴隸制度及迷信風俗；……就長程發展上看來，當地居民的文明和生活將大有改善。

    根據以上資料判斷，下列敘述何者正確？'
  options:
  - label: A
    content: 這三則資料都是將西方列強帝國主義侵略合理化的說法
  - label: B
    content: 資料一與資料二的主張可說是典型的社會達爾文主義觀點
  - label: C
    content: 資料三的論點盛行於 18 世紀末期
  - label: D
    content: 資料二的觀念代表知識分子對西方本位立場的批判
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)資料二譴責列強帝國主義的侵略行為。(B)應是資料一與資料三的主張。(C)歐洲列強對非洲內陸的侵略，盛行於 19 世紀末期。(D)為正解。

    10.1600 ～ 1700 年間，日耳曼曾經歷過三十年戰爭，使國力大為衰退，因此人口並未出現成長，(A)為正解。(B)日耳曼為陸權國家，沒有海外殖民地。(C)此時尚未啟蒙運動。(D)日耳曼地區新舊教皆盛行，且宗教與人口成長停滯無關。

    11.這位牧師為新教人士，因此所謂的「危險的地區」應為信仰舊教的國家，故答案為(A)。瑞士、英國、荷蘭為信仰新教的國家。

    12.從題文來看，此人來自信仰天主教的君主專制國家，(A)(C)(D)三國皆非天主教廷勢盛的國家，因此他是(B)法國的狄德羅。

    13.從資料二可以看出，自由主義思潮認為「擁有財產的人才是具有理性的人，而理性是人參與政治的原因」，因此過去公民選舉權有財產限制的原因為(D)。

    14.從「我生的是家雞，路德卻孵出變種的野雞」一句，顯見伊拉斯莫斯雖提出改革教會的想法，但並不贊同馬丁．路德另立教派的作法，因此舊教耶穌會的作法應比較符合他的主張，答案為(B)。

    15.題文所稱的法國君王為路易．腓力，其於 1830 年七月革命後出任國王，但因始終維護資產階級利益而遭民眾唾棄，於 1848 年(C)二月革命時被推翻政權。

    16.根據日誌記載，此人要到古巴島尋求珍寶、黃金與香料，可見他相信古巴島為盛產香料的「東方」，因此「某人」為(B)哥倫布，堅信他所到之處皆位於亞洲。

    17.維多利亞女王正式加冕為印度帝國女皇，代表印度與英國領土相同，都直轄於維多利亞女王，非只是宗主國與藩屬的關係，故選(B)。

    18.(A)義大利統一後稱為義大利王國。(B)義大利統一運動精神領袖是伊曼紐二世，日耳曼統一的精神領袖是威廉一世。(C)義大利曾經借助法國，日耳曼則在普法戰爭後完成統一。

    19.這本手稿應是傳教士以羅馬拼音字母書寫原住民語言，用以翻譯《聖經》傳教，由於《聖經》原文是西班牙文，因此該地應為西班牙的殖民地，答案為(A)。(B)葡萄牙。(C)荷蘭。(D)西班牙雖曾殖民過臺灣北部，但納瓦特爾語非北臺灣原住民的語言。

    20.從「解釋教義須遵循教廷及聖經」一句，可知此為舊教團體，因此答案為(A)。(B)(C)為喀爾文派的支派。(D)源自英格蘭國教會。

    21.從「一位駐美大使，還是十三位駐美大使」一句，顯示此時英國已經承認美國獨立，但當時美國仍採取邦聯制政體。美、英於 1783 年簽訂《巴黎和約》承認美國獨立，美國則於 1787 年通過《聯邦憲法》，改採聯邦制政體，因此題文所稱的年代應是(B) 1783 年。

    22.從上古希臘羅馬時期至文藝復興，歐洲的政經重心一直在地中海的巴爾幹半島、義大利半島，但自(C)新航路發現後迄今，歐洲的政經重心已轉變成大西洋沿岸的葡、西、荷、英、法等國家。

    23.法國人民對拿破崙的熱愛，是基於民族主義的熱情，但拿破崙對歐洲其他國家的侵略，同樣是傷害他國人民的民族情感，因此答案為(D)民族主義。

    24.根據題意判斷，15 世紀末以前在歐洲未曾發現梅毒，而歐洲最早感染梅毒者為西班牙士兵，由於西班牙無法向東方航行，因此梅毒應該來自西方的美洲，(C)為正解。

    25.香料產地在東南亞，過去義大利以其地利之便能取得東方的香料，但在 15 世紀鄂圖曼帝國建立後，香料交易開始受到阻撓；16 世紀後，葡萄牙直接往東方航行，壟斷航線與香料貿易，因此能夠提供給義大利商隊的香料自然更少，因此選(B)不選(A)。(C)香料產地並未轉移。(D)歐洲人並未找到替代品。

    26.(A)根據題文敘述，顯見「以印治印」的成效不彰。(B)東印度公司並未真正尊重印度傳統及宗教信仰。(C)從題文可看出，東印度公司並未採取同化政策。

    27.啟蒙運動前，基督教會在歐洲勢盛，甚至成為科學革命的強大阻力；啟蒙運動後，哲士信仰尊重自然法則的上帝，開始攻訐製造迷信的教會，尤其是(A)伏爾泰，終身追求思想與信仰的自由。

    28.19 世紀非洲大獵期間，(D)衣索比亞曾擊敗義大利的入侵而獲得獨立地位，卻在二戰前夕再被義大利侵略，直到二戰後才重獲獨立地位。(A)(B)英國的殖民地，未受到法西斯國家侵略。(C)由美國解放的黑奴所建，未曾受到歐洲殖民國家侵略。

    29.(A)為正解。(B)上古時期，羅馬帝國已統治北非。(C)比利時開發剛果盆地，帶動非洲大獵風潮。(D) 1914 年非洲尚有兩個獨立的國家。

    30.(A)即使沒有面對面的互動也可以。(B)為正解。(C)血緣關係並非唯一，還包括能共享特定文化。(D)民族主義的共同體確實存在。

    31.題文內容描述童工在工廠受虐的情景，這本書應是狄更斯的小說(D)《孤雛淚》。(A)以 16 世紀的英國為原型，(B)提出自由主義經濟學說，(C)柏拉圖的政治學說，三者內容皆與題文無關。

    32.從「工人階級和全體人民掌握國家政權」一句，即可推知此為社會主義者提出的政治理想，社會主義為工業革命後出現的新思潮，目的在解決當時的貧富不均與勞資嚴重對立的問題，(A)為正解。

    33.(A)第一次分裂在 11 世紀。

    34.從這位政治人物的政治觀點來看，其反對社會契約，認為保持體制的穩定與維持現狀，才是對國家最有利的作法，因此可判斷此人為反對啟蒙思想的保守主義者，應是(A)梅特涅。

