  stem: 1792 年 8 ～ 9 月期間，普、奧兩國聯軍入侵法國，占領隆維和凡爾登兩個要塞後，繼續向巴黎邁進，形勢十分危急。法國在 9 月間派出一支人數約 6 萬人的志願軍，鬥志高昂終於擊退普奧聯軍。請問普奧聯軍進攻法國的主因為何？
