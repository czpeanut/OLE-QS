- id: doc_112_台北_北一女中_自然_化學_選修化學III_g12s1e1_s2_21
  section: 2
  number: 21
  type: multiple
  page: 3
  stem: 已知 $K_{a}$ 值如下：$H_{2}$A：4.4×$10^{－7}$，$HA^{－}$：4.7×$10^{－11}$；$H_{2}$X：1.7×$10^{－2}$，$HX^{－}$：6.2×$10^{－8}$；$H_{2}$Y：1.0×$10^{－7}$，$HY^{－}$：1.3×$10^{－13}$，則下列哪些水溶液呈酸性？
  options:
  - label: A
    content: NaHA
  - label: B
    content: NaHX
  - label: C
    content: $Na_{2}$X
  - label: D
    content: NaHY
  - label: E
    content: $H_{2}$Y
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(C) $Na^{＋}$ 不水解，呈中性，僅 $X^{2－}$ 水解，$K_{b}$＝$\frac{10^{-14}}{6.2\times 10^{-8}}$呈鹼性。

    (E) $H_{2}$Y 為酸，呈酸性。

    (A)(B)(D)為酸式鹽

    以 NaHA 為例：

    若 $H_{2}$A 的 $K_{a}$2＞$H_{2}$A 的$\frac{K_{w}}{K_{a_{1}}}\Rightarrow$酸性

    若 $H_{2}$A 的 $K_{a}$2＜$H_{2}$A 的$\frac{K_{w}}{K_{a_{1}}}\Rightarrow$鹼性。'
- id: doc_112_台北_北一女中_自然_化學_選修化學III_g12s1e1_s2_23
  section: 2
  number: 23
  type: multiple
  page: 3
  stem: 下列有關強酸、弱酸、$K_{w}$ 與 pH 值的關係，何者正確？
  options:
  - label: A
    content: 25 ℃ 時，pH＝3 的鹽酸初濃度和 pH＝3 的醋酸初濃度相等
  - label: B
    content: 25 ℃ 和 50 ℃ 時，皆為 1×$10^{－3}$ M 氫氧化鈉水溶液 pH 值相等
  - label: C
    content: 25 ℃ 時，1×$10^{－7}$ mol 的氯化氫氣體溶於 1 L 水，溶液 [$H^{＋}$]＝1.6×$10^{－7}$ M
  - label: D
    content: 40 ℃ 時，pH＝1 的鹽酸和 pH＝1 的醋酸水溶液分別以水稀釋為原來的 10 倍，所得溶液之 pH 值醋酸低於鹽酸
  - label: E
    content: 40 ℃ 時，純水的 pH＜7
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) $CH_{3}$COOH 為弱酸，欲得到相同 pH 值，弱酸 $C_{0}$ 應更多。

    (B) $K_{w}$ 不同，[$OH^{－}$] 同，[$H^{＋}$] 不同。

    (C) $\begin{cases}電荷守恆\Rightarrow [H^{+}]=[Cl^{-}]+[OH^{-}] \ 在25℃時\Rightarrow [H^{+}][OH^{-}]=10^{-14}=K_{w}\end{cases}$

    [$Cl^{－}$]＝$10^{－7}$，設 [$OH^{－}$]＝x$\Rightarrow$[$H^{＋}$]＝$10^{－7}$＋x

    $\Rightarrow$[$H^{＋}$]＝1.6×$10^{－7}$。

    (D) $CH_{3}$COOH 會解離更多 $H^{＋}$。

    (E) $K_{w}$＞$10^{－14}\Rightarrow$pH＝pOH＜7。'
- id: doc_112_台北_北一女中_自然_化學_選修化學III_g12s1e1_s2_24
  section: 2
  number: 24
  type: multiple
