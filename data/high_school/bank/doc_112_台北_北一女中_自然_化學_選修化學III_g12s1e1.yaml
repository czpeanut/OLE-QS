  stem: 已知某二質子酸（$H_{2}$A）的 $K_{a}$1 和 $K_{a}$2，分別為 1.0×$10^{－3}$ 與 4.0×$10^{－7}$。在 0.1 M 的此二質子酸溶液中，下列各粒子的濃度，何者正確？
  options:
  - label: A
    content: '[$H_{2}$A]＝0.1 M'
  - label: B
    content: '[$H^{＋}$]＝0.01 M'
  - label: C
    content: '[$H^{＋}$]＝[$HA^{－}$]＋[$A^{2－}$]＋[$OH^{－}$]'
  - label: D
    content: '[$A^{2－}$]＝4.0×$10^{－7}$ M'
  - label: E
    content: 0.1 M＝[$H_{2}$A]＋[$HA^{－}$]＋[$A^{2－}$]
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$C_{0}$ 未大於 1000 $K_{a}$1

    $K_{a}$2＝$\frac{[H^{+}][A^{2-}]}{[HA^{-}]}$＝$\frac{(x+y)y}{x-y}$≒y＝[$A^{2－}$]＝4×$10^{－7}$

    (A) [$H_{2}$A]＝0.1－x ∴[$H_{2}$A]＜0.1。

    (B) [$H^{＋}$]＝x＋y＞x，x＝0.01 ∴[$H^{＋}$]≠0.01。

    (C) [$H^{＋}$]＝[$HA^{－}$]＋2[$A^{2－}$]＋[$OH^{－}$]。'
