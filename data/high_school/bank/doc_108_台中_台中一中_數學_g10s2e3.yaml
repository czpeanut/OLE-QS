  page: 1
  stem: 操場上有一支旗竿，旗竿底部的點設為A，若A點與地面三點B、C、D依序形成矩形ABCD，則下列哪些選項是正確的？
  options:
  - label: A
    content: 已知B、C、D三點分別觀測旗竿頂部的仰角，可求得旗竿的高度
  - label: B
    content: 已知A、B兩點的距離與A、C兩點的距離，可求得旗竿的高度
  - label: C
    content: 已知A、B兩點的距離與B點觀測旗竿頂部的仰角，可求得旗竿的高度
  - label: D
    content: 已知C、D兩點的距離與∠ACD的角度，以及D點觀測旗竿頂部的仰角，可求得旗竿的高度
  - label: E
    content: 已知B、D兩點的距離與C點觀測旗竿頂部的仰角，可求得旗竿的高度 註：各選項中知道仰角或角度都視為知道其三角比的值
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
