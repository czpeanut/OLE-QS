  stem: 電視節目舉辦抽獎活動：有5張卡片分別標示1仟元、2仟元、3仟元、4仟元、5仟元（每種金額各有1張）。遊戲規則是參賽者一次選取3張卡片，其中金額最大與最小的2張卡片上的金額加總即為參賽者的獎金，請選出所有正確的選項。
  options:
  - label: A
    content: 參賽者得到獎金的金額有6種可能
  - label: B
    content: 所有獎金金額中機率最大者為6仟元
  - label: C
    content: 得到6仟元的機率為0.3
  - label: D
    content: 參賽者玩此遊戲一次獲得獎金的期望值為6仟元
  - label: E
    content: 如果這個遊戲改為選取的3張卡片中，金額的中位數做為參賽者的獎金，則玩此遊戲一次獲得獎金的期望值為3仟元
