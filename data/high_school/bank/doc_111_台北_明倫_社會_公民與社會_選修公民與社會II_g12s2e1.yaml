- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s2_39
  section: 2
  number: 39
  type: multiple
  page: 11
  stem: 中國的政治制度，根據中華人民共和國的憲法規範，中國的政治運作有一定的制度與規範，但由於中國特殊的黨政結構及基本國策，導致實際執行面與憲法有所牴觸，試問下列有關中國政府制度的敘述，何者正確？
  options:
  - label: A
