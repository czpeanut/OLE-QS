  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)顯示新聞媒體已受政治力量的操控。(B)因記者需通過習思想的考試才能獲得記者證，可見黨對新聞從業者的控制，為正確敘述。(C)中國的新聞審查制度如下：黨的宣傳部主要職能是對思想、文化、新聞、出版等意識型態領域進行路線掌管、導向控制和政策協調，具體的新聞業務監管，則主要由政府行政體系的新聞審查部門完成，即從中央政府到省到市的各級新聞出版局、廣播電影電視局和新聞辦公室。故非由紀律檢查委員會從事此工作。(D)民主集中制為「個人服從組織，少數服從多數，下級服從上級，全黨服從中央」，為正確敘述。(E)從題文可見黨意凌駕媒體自由，為正確敘述。
