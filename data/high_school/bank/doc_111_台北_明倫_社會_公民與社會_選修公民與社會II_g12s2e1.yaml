  section: 1
  number: 34
  type: single
  page: 10
  stem: RCEP 是亞太地區近年重要的經濟結盟，關於 RCEP 的敘述，何者正確？
  options:
  - label: A
    content: 成員以東南亞國家國協為基礎，加上我國、日本、韓國、澳洲及紐西蘭
  - label: B
    content: 其結盟目的與北大西洋公約組織相近
  - label: C
    content: 目標是共同決定經濟、貿易、貨幣、政治等事務
  - label: D
    content: 為促進區域經濟整合的自由貿易協定
  group_stem: 中國、日本、南韓、紐西蘭、澳洲以及東協十國於 2020 年 11 月簽署《區域全面經濟夥伴協定》（RCEP），RCEP 是由中國所主導，全球最大的「自由貿易協定」，涵蓋約 21 億人口，經濟規模達 23 兆美元，約占全球 GDP 的三成。雖然印度是 RCEP 原始談判國之一，但在 2019 年退出 RCEP 協商，主要是擔心中國廉價農產品大舉輸入。而在不久的將來，這 15 個彼此將給予關稅優惠甚至零關稅，對臺灣的傳統產業（例如：石化、鋼鐵、機械、紡織等）造成衝擊。請問：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
