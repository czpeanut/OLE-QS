questions:
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 柏拉圖的「治國猶如海上行船」將國家的治理，比喻成在大海中駕船，如果想安然抵達目的地，就必須將船交給真正的航海家操控，唯有專業技術才能勝任。根據柏拉圖的這個比喻，請問他的看法最為符合下列何種民主理論？
  options:
  - label: A
    content: 以投票為中心的審議民主理論
  - label: B
    content: 以投票為中心的代議民主理論
  - label: C
    content: 以討論為中心的代議民主理論
  - label: D
    content: 以討論為中心的審議民主理論
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 以真正的航海家來比喻政治菁英，此為提倡菁英民主理論的主張，強調政治經驗與重視政治程序。主張菁英是民主國家真正的決策者，國家應交由人民選出的專業菁英來治理，而民主政治只是民眾透過定期選舉，選擇領導者的過程，故應為(B)以投票為中心的代議民主理論。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 現任中國領導人習近平，於 2013 年 3 月當選為中國國家主席和國家中央軍委主席，請問關於中國國家主席之敘述下列何者正確？
  options:
  - label: A
    content: 憲法上屬實權元首，但實際政治權力掌握於總理
  - label: B
    content: 通常身兼國務院總理、共產黨中央政治局總書記
  - label: C
    content: 於憲法設計上，政治權力凌駕於全國人大之上
  - label: D
    content: 國家主席之選舉、罷免須經過全國人大表決同意
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應為虛位元首，實際政治權力掌握者為總書記。(B)國務院總理另有其人。(C)全國人大為中國政治的最高權力系統。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 廢除死刑推動聯盟於 2017 年開始進行「全民作伙參詳」計畫，計畫名中的「參詳」取自臺語，意思是「商量、交換意見」，也是公民審議的重要精神。下列敘述何者符合「審議式民主」理論的觀點？
  options:
  - label: A
    content: 人人無法積極、理性的參與討論，透過審議民主亦無法培養、增強公民的政治美德與能力
  - label: B
    content: 多數大眾是知識不足且不理性的，所以由人民選出的立法委員代替人民來決定死刑存廢的問題較適當
  - label: C
    content: 人民應該參與各種組織及舉行社會運動來影響政府決策，政府也應廣納各方意見
  - label: D
    content: 透過公民會議，討論「死刑存廢應該考慮的因素」、「廢除或維持死刑的配套措施」以建立社會共識
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「審議式民主」指稱公民就一項政策或議題，經過深思熟慮後，與不同意見者們進行理性對話，在相互推理、辯論和論爭後，得出共同可以接受的意見的一種民主形式，以討論和協商為核心。(A)此敘述不屬於任何民主理論的觀點。(B)應為代議民主之觀點。(C)應為多元民主理論之觀點。(D)公民會議為審議民主的一種形式，故為正解。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 美國流傳一句話：「民主是兩隻狼和一隻羊投票決定午餐吃什麼，而自由就是一隻武裝的羊反對這次投票。」雖然民主政治強調「人民當家做主」或「主權在民」，但亦有學者認為人性必非是全然理性，人多就容易失去理性，淪為暴民政治。有時多數的群眾與暴民是一線之隔，這時候如果還是要求要遵守下列哪一個民主原則時，最容易導致情況失控？
  options:
  - label: A
    content: 要求少數服從多數決定
  - label: B
    content: 強調法治，人民與政府均須守法
  - label: C
    content: 提倡菁英政治，由民意代表制定決策
  - label: D
    content: 遵循社會正義，照顧弱勢族群
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹「人多就容易失去理性，淪為暴民政治」，認為只有多數意見及表決仍是不足的，可以推敲出一味遵循要求少數服從多數決定，最容易產生此種情形，故選(A)。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 第二次世界大戰後，美蘇兩強的對峙，基本上被認為是一種權力均衡的政治運作。請問下列哪一個事件，同樣可以如此看待？
  options:
  - label: A
    content: 伊斯蘭教的激進分子為反制美國的新帝國主義，發動恐怖攻擊，挾持飛機衝撞紐約世貿中心和五角大廈
  - label: B
    content: 美國以推翻海珊政權、摧毀毀滅性武器及提供人道救援等原因，和英國聯合出兵伊拉克
  - label: C
    content: 聯合國安理會設置 5 位常任理事國，並擁有對非程序性事項決議的否決權
  - label: D
    content: 在 2018 年的北韓─美國高峰會，時任美國總統川普就要求北韓應一次完成非核化
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 中國共產黨中央組織權力體系為金字塔型，請將下列組織或職位(甲)全國代表大會(乙)中央政治局(丙)中央委員會(丁)總書記(戊)中央政治局常務委員會。權力由低到高的順序排列為何？
  options:
  - label: A
    content: (甲)(乙)(丙)(丁)(戊)
  - label: B
    content: (甲)(丙)(乙)(戊)(丁)
  - label: C
    content: (乙)(丙)(丁)(戊)(甲)
  - label: D
    content: (丁)(戊)(丙)(乙)(甲)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 3
  stem: 2013 年，因陸軍下士冤死案，39 位互不相識的網友組成「公民 1985 行動聯盟」，發動白衫軍運動，希望喚起臺灣的公民意識，一起為社會上不公不義的事發聲。該聯盟在凱達格蘭大道上舉辦遊行活動，要求查明事件的真相、還給家屬公道及正視軍中人權問題。聯盟成員表示：「我們行使合法的公民權利」，同時該聯盟也將成立「公民覺醒」網站，設置公投、服貿等議題專區供大家討論、辯論。下列關於上文敘述，何者「不正確」？
  options:
  - label: A
    content: 「白衫軍運動」是公民不服從的具體表現
  - label: B
    content: 「公民覺醒」網站的設置有助於形成公民社會
  - label: C
    content: 社會資本的累積有助於該聯盟的組成及發展
  - label: D
    content: 「公民 1985 行動聯盟」可視為公民的志願結社
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 「老大哥」是英國左翼作家喬治．歐威爾反烏托邦小說《一九八四》中的恐怖統治集權人物，隱喻社會中無處不在的祕密警察和思想監控：每一個聲音都是有人聽到的；每一個動作，除非在黑暗中，都是有人仔細觀察的。儘管書中自始至終沒有真正出現這號人物，也無法確信他是否真正存在，但人民堅信他存在，他的存在也是權力的象徵，某學者直指喬治．歐威爾筆下的「老大哥」已在中國成為活生生的事實。請問該名學者提出上述論點的佐證可能為何？
  options:
  - label: A
    content: 中國對少數民族的治理政策日趨強硬，將使其相對剝奪感升高
  - label: B
    content: 企業與商人愈攀附中共幹部或政府官員，愈能順利賺取財富
  - label: C
    content: 建立社會信用制度，將行為分數與社會福利或獎懲掛勾，成為政府控制社會的手段
  - label: D
    content: 改革開放前中國實行計畫經濟，民眾消費須有商品購買憑證
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: 國際上如有領土爭議、國籍認定等問題，可以訴請設於海牙的國際法院裁決，以解決國際紛爭。關於國際法院的敘述，何者正確？
  options:
  - label: A
    content: 審理各國最高法院交付審判的案件
  - label: B
    content: 由國家或政府間國際組織提交法律爭端案件
  - label: C
    content: 國際法院裁決可以強制當事國履行
  - label: D
    content: 以國際法為依據處理國家間爭議
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 布洛克（Bulloch）和達維斯（Darwish）在《水的戰爭》一書中說道：「世界上有 214 個國際河流和湖泊流域，其中 155 個是兩個國家共有的，36 個是三個國家共有的，23 個是多達十幾個國家共有的。」沒有任何法律規定這些國際河流應該如何被分配利用，流域內的國家各自宣稱有利用、蓄水、分流甚至汙染境內河流的權利，而倒楣的下游國家往往必須承擔因上游國家築壩攔水或汙染水源的後果。請問這本書的內容認為造成國際衝突的原因為何？
  options:
  - label: A
    content: 族群衝突
  - label: B
    content: 文明衝突
  - label: C
    content: 資源衝突
  - label: D
    content: 領土爭議
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 「在民主基礎上的集中，在集中指導下的民主。只有這個制度，才既能表現廣泛的民主，使各級人民代表大會有高度的權力；又能集中處理國事，使各級政府能集中地處理被各級人民代表大會所委託的一切事務，並保障人民的一切必要的民主活動」，這是中國共產黨根據毛澤東思想而落實的制度，關於此制度的敘述，何者為是？
  options:
  - label: A
    content: 基本原則：個人服從組織、少數服從多數、下級服從上級、全黨服從百姓
  - label: B
    content: 中國共產黨黨員與組織要無條件地執行黨代表大會或黨內指導機關的決議
  - label: C
    content: 國家主席位居中國共產黨的權力頂端，是中華人民共和國實質政治領導人
  - label: D
    content: 中央政治局委員由上一級中央政治局常務委員選出，屬於金字塔分層架構
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 4
  stem: '小凱因不滿老師指派寒假作業，影響寒假休閒時間，於是脅迫部分同學拒繳。當老師要求同學繳交作業時，小凱與老師有了以下對話：

    小凱：老師，我們在進行公民不服從。

    老師：為什麼呢？

    小凱：因為寒假是休息的時間，還要寫作業，太不人道了！

    老師：這可不是公民不服從喔！因為公民不服從是＿＿＿＿。

    上文畫線處應填入下列哪些？(甲)有意識地拒絕服從，同學並非出於個人意願而拒繳(乙)採取暴力行為的違法行動，拒繳作業是和平的行為(丙)因法律侵害個人權益而起，寒假作業是課程的一種，並非額外負擔(丁)應該是最後的手段，先前你並未和老師討論'
  options:
  - label: A
    content: (甲)(丙)
  - label: B
    content: (甲)(丁)
  - label: C
    content: (乙)(丙)
  - label: D
    content: (乙)(丁)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 4
  stem: 全球化學者羅森諾認為：「全球治理是沒有政府的治理，世界各國相互依賴而形成一套規則與秩序。」以 2020 年起影響全球的 COVID-19 疫情而言，下列哪一項措施能展現全球治理的精神？
  options:
  - label: A
    content: 政府大力扶植國內生技醫藥產業，提供疫苗研發補助，希望盡快提升國內疫苗接種比率
  - label: B
    content: 政府對於疫情嚴重國家發布旅遊警示，提醒國人如非必要切勿前往
  - label: C
    content: G7 國家和歐盟國家分享疫苗資源給聯合國兒童基金會以支持 COVAX 計畫，分發疫苗給貧窮國家
  - label: D
    content: 各國政府盤點國內醫療量能，制定邊境檢疫政策防堵疫情擴散至國內社區
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 4
  stem: 七十七國集團在 1964 年成立，當時有 77 個開發中國家在聯合國貿易發展會議上發表〈日內瓦聯合宣言〉，要求調整國際經濟結構、貧窮與飢餓問題。這些國家位在亞洲大陸、南洋地區、阿拉伯半島、拉丁美洲等地。關於七十七國集團的敘述，下列何者最為正確？
  options:
  - label: A
    content: 藉由軍事結盟對抗已開發國家
  - label: B
    content: 與北方國家存在文明衝突
  - label: C
    content: 受益於世界自由貿易體系
  - label: D
    content: 開發中國家試圖團結，對抗已開發國家
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_15
  section: 1
  number: 15
