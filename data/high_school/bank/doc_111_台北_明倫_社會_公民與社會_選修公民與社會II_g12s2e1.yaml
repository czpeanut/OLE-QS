  - label: B
    content: 中國的元首為國家主席，其具有政治實權的元首
  - label: C
    content: 最高人民檢察院的職權為依法審理與裁決刑事與民事案件
  - label: D
    content: 中國國務院是全國人民代表大會的執行機構
  - label: E
    content: 中國共產黨總書記是全中國最有權力的人
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (B)國家主席為虛位元首。(C)此應是最高人民法院的職權。(D)中國國務院為中央行政執行機構，是最高國家行政機關，為正確敘述。(E)中國共產黨的權力核心為總書記，為正確敘述。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s2_40
  section: 2
  number: 40
  type: multiple
  page: 11
  stem: 「為了避免現代政治的最壞危險，『民主的熱愛者』……他們必須放棄『人民』對一切政治問題都持有合理意見之觀念；人民只能通過直接影響或選舉出反映他們意志的『代表』……身為選民的人民可以在領袖團體之間定期做出抉擇……這是最合適的民主模式。」下列選項的敘述，何者符合上述文字的內容？
  options:
  - label: A
    content: 民主政治是指一套透過競爭產生領導人的程序
  - label: B
    content: 大眾的普遍參與是可能且是必要的
  - label: C
    content: 民主體制下的民眾實際參與決策的機會並不多，菁英分子的影響力較大
  - label: D
    content: 在決策的實質面，在任何體制下民眾可以完全參與
  - label: E
    content: 菁英藉競爭，爭取人民的選票，進而掌握決策權力
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹敘述，可看出此主張認為應定期選出代議士，並藉由其參與政府事務，故偏向菁英民主理論，強調政治經驗與重視政治程序。主張菁英是民主國家真正的決策者，民主政治只是民眾透過定期選舉，選擇領導者的過程，故應選(A)(C)(E)。(B)(D)不強調全體參與，民眾只要定期投票選出代議士即可。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s2_41
  section: 2
  number: 41
  type: multiple
  page: 11
  stem: 審議式民主理論是近年興起的民主理論，其主要論點為提倡民主的實踐，試問下列敘述，何者可以說是展現了審議式民主的精神？
  options:
  - label: A
    content: 衛生福利部中央健康保險署邀請公民，針對是否要調漲健保費進行討論，並且納入公民共識意見作為政策參考
  - label: B
    content: 針對老舊公寓、社區是否要全面改建，地方政府責成都市計畫單位與居民們進行長時期的溝通與討論
  - label: C
    content: 針對是否要推行十二年國教，教育部舉辦一系列跨部會座談會，邀請政府相關部會首長共同研擬政策
  - label: D
    content: 針對「中山路」是否要改名，市政府設置一個網站，讓市民共同討論並舉辦新路名的徵選活動
  - label: E
    content: 是否要開放代理孕母合法化，衛生福利部廣蒐各大醫療機構的建議後，在立法院大會開會前提出修正草案
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 審議式民主指稱公民就一項政策或議題，經過深思熟慮後，與不同意見者進行理性對話，在相互推理、辯論和論爭後，得出共同可以接受的意見的一種民主形式，以討論和協商為核心。(A)邀請公民討論，展現審議民主之精神。(B)計畫單位與居民進行長時間的溝通與討論，符合審議民主的精神。(C)跨部會座談會是由行政部門官員參與，並未與民眾展開溝通討論，不符合審議民主的精神。(D)此網站提供促進民眾討論的平臺，符合審議民主的精神。(E)僅蒐集建議，並未讓彼此對話及溝通，不符合審議民主之精神。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s2_42
  section: 2
  number: 42
  type: multiple
  page: 11
  stem: 杭廷頓教授認為未來世界的國際秩序問題，將根源於不同民族間之文化、宗教或信仰習俗的衝突。此項論點，贊成者有之，批評者也不少。其中，最著名的學者薩伊德，就批評這種「文明衝突論」草率的將龐大的群體擬人化為「西方」與「伊斯蘭」兩大陣營，變成「製造敵人的文化」。如果從文化層面來看，批評的觀點是基於下列哪些理由？
  options:
  - label: A
    content: 文化普世性價值，適用全世界
  - label: B
    content: 文化具有多元性，無法以單一標準判斷優劣
  - label: C
    content: 文化可以區分為主流文化與次文化，西方為主流文化、伊斯蘭為次文化
  - label: D
    content: 文化累積性，累積的愈久其文明價值愈高
  - label: E
    content: 文明衝突論只重視不同文明、宗教間的衝突，過度簡化國際衝突發生的原因
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)文化有其特殊性，未必全世界都適用。(B)此為批評者的觀點，認為杭廷頓的理論，有將不同文化優劣排序的意涵，為正確敘述。(C)(D)將文化作出區別，為批評者所反對。(E)杭廷頓將世界衝突簡化為文化及宗教帶來的影響，有過度簡化國際衝突的發生原因，為正確敘述。
- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s2_43
  section: 2
  number: 43
