- id: doc_111_台北_明倫_社會_公民與社會_選修公民與社會II_g12s2e1_s1_29
  section: 1
  number: 29
  type: single
  page: 9
  stem: 根據題文，IRA 的行為屬於下列何者？
  options:
  - label: A
    content: 協調貧富差距的國際衝突
  - label: B
    content: 調查危害國際和平的事件
  - label: C
    content: 仲裁跨國貿易的產品紛爭
  - label: D
    content: 爭取政府忽略的社會權益
  group_stem: '資料一：「國際權利倡導者」（International Rights Advocates，簡稱 IRA）曾對雀巢、好時等生產巧克力的大廠提出控告，理由是這些食品大廠的巧克力來源，部分來自非法童工種植、採收。在非洲的象牙海岸是可可種植區，該國境內的可可莊園引入鄰近國家的童工，以低薪、超時、類似囚禁的方式，迫使童工付出勞力。據報導，國際勞工組織、聯合國兒童基金會也有相關報告，揭露發生在象牙海岸的事。

    資料二：IRA 在 2019 年底控告科技大廠，如特斯拉、蘋果等 5 間公司取得的鋰電池，其原料鈷礦取自剛果民主共和國境內的礦場，但該礦場招僱許多童工採礦，除了低薪，童工工作過程也發生身亡或重傷的事故。IRA 主張，這些科技大廠有能力監督供應商、甚至拒絕採購「血電池」，卻因成本低廉而放任礦場壓榨童工。事件爆發後，部分鋰電池供應商改採不含鈷礦的電池。

    資料三：特斯拉公司發布消息，其新款電動車將採用不含鈷礦的「磷酸鋰鐵電池」，新型的電池將使電動車售價下降 1 成。這種新型、不含鈷的電池主要成分是鎳，雖然鎳的價格遠比鈷來得低，但鎳的生產過程會使用大量煤炭，部分地區的工廠會將酸洗後的廢棄物排放到深海。也曾發生排放過程的管路破裂，導致近岸海洋遭受汙染，當地政府必須禁漁一陣子。

    根據上述三項資料。請問：'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
