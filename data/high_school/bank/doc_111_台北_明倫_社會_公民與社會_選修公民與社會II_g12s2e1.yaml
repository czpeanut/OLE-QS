  stem: 2019 年起，中共中宣部透過以中共總書記習近平發言為主的「學習強國」手機 App，對全國新聞編採人員展開線上培訓考試，記者必須通過包括「習思想」等內容的考試，才能申領新版記者證。題目列舉如下：「Q1：習近平總書記在黨的新聞輿論工作座談會的講話中強調，黨對新聞事業的領導主要體現在什麼方面的領導？A1：政治思想。Q2：黨的新聞輿論工作堅持黨性原則，最根本的是堅持黨性原則，最根本的是堅持黨對哪一方面的領導？A2：黨對新聞輿論工作的領導。Q3：習近平強調，新聞輿論的基本方針是什麼？A3：團結穩定、正面宣傳。」從新的媒體工作者領證制度，印證了中國何種政治制度或特色？
  options:
  - label: A
    content: 新聞媒體獨立自主，商業與政治力量無法介入
  - label: B
    content: 黨藉由黨國體制貫穿並滲透於國家與社會之中
  - label: C
    content: 紀律檢查委員會作新聞內容之審查與品質控管
  - label: D
    content: 施行個人服從組織、全黨服從中央的民主集中制
  - label: E
    content: 堅持正確政治方向，強調黨意凌駕一切的原則
  answer:
