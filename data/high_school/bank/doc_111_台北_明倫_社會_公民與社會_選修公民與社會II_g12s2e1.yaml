  group_stem: 根據新華社報導，第十三屆全國人大第一次會議在人民大會堂舉行，決定國務院總理為李克強、中央軍事委員會副主席為許其亮、國家監察委員會主任為楊曉渡，最高人民法院院長為周強、最高人民檢察院檢察長為張軍。中共中央總書記、國家主席、中央軍委主席習近平在閉幕會上發表重要講話。他表示：「這次大會選舉我繼續擔任中華人民共和國主席，我對各位代表和全國各族人民給予我的信任，表示衷心的感謝。擔任中華人民共和國主席這一崇高職務，使命光榮，責任重大。我將一如既往，忠實履行憲法賦予的職責，忠於祖國，忠於人民，恪盡職守，竭盡全力，勤勉工作，赤誠奉獻，做人民的勤務員，接受人民監督，絕不辜負各位代表和全國各族人民的信任和重托。」請問：
