  group_stem: 新聞報導：「臺北地方法院於 2017 年 3 月 31 日就 2014 年引爆太陽花學運的 318 占領立法院案宣判，黃某、蔡某等 22 名被告均無罪。判決重要理由之一是以公民不服從概念宣判無罪。然而檢方不服上訴，臺灣高等法院二審仍判無罪。高院表示，立法委員以前揭粗糙之方式，將服貿議題逕送交院會存查，已引起社會大眾議論，而被告關注服貿議題已有相當期間，是其等就此議題，自非滋事生端；再者，其等亦已明確對在場民眾表達何以發起以占領立法院方式，表達反對黑箱服貿之緣由，且其等上開言論，並非口水論戰，而是確有所本，故被告當日主觀上是為表達其等政治訴求，並尋求在場民眾以進入立法院之方式反應人民對於服貿協議以前揭方式送交表決之不滿，實在難以認為那些人當日是基於煽惑別人去犯『侵入住宅』的犯罪意圖而去做這件事，是其等既欠缺主觀犯意，自難以《刑法》第 153 條煽惑他人罪相繩。法院也透過判決指出警察在當天解散集會遊行的命令違反(乙)原則，當天蔡某所在現場的群眾集會並無口角衝突或暴力事件，秩序尚屬和平，但警察卻在 45 分鐘內密集舉牌 4 次，每次只隔 10 至 20 分鐘，不讓在場民眾有充分表達對於服貿協議相關的重大訴求。」請問：
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
