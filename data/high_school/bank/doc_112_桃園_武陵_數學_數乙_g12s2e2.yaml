- id: doc_112_桃園_武陵_數學_數乙_g12s2e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 從裝有3顆白球及2顆紅球的袋中取球，隨機變數X表示被取出的紅球總數，則下列敘述正確的有？
  options:
  - label: A
    content: 若從袋中一次取出3顆球，則P ( X ≤ 2 )＝1
  - label: B
    content: 若從袋中一次取出3顆球，則P ( X＝1 )＝0.4
  - label: C
    content: 若從袋中依次取一球，取後放回，共取5次，則X所有可能取值為0 , 1 , 2 , 3 , 4 , 5
  - label: D
    content: 若從袋中依次取一球，取後放回，共取5次，則P ( X＝0 )＝0
  - label: E
    content: 若從袋中依次取一球，取後放回，共取5次，則P ( X＝2 )＝( 0.4 )$^{2}$ ( 0.6 )$^{3}$
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：P ( X ≤ 2 )＝P ( X＝0 )＋P ( X＝1 )＋P ( X＝2 ) ＝$\frac{C_{3}^{3}}{C_{3}^{5}}$＋$\frac{C_{2}^{3}C_{1}^{2}}{C_{3}^{5}}$＋$\frac{C_{1}^{3}C_{2}^{2}}{C_{3}^{5}}$＝$\frac{1+6+3}{10}$＝1。 (B) ×：P ( X＝1 )＝$\frac{C_{2}^{3}C_{1}^{2}}{C_{3}^{5}}$＝$\frac{3}{5}$。 (C) ○。 (D) ×：P ( X＝0 )＝($\frac{3}{5}$)$^{5}$≠0。 (E) ×：P ( X＝2 )＝$C_{2}^{5}(\frac{2}{5})^{2}(\frac{3}{5})^{3}$。 故選(A)(C)。
