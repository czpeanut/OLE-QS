  stem: 1910年，「此地」成為日本殖民地後，便展開八年的土地調查事業。此調查令要求土地所有人必須提出申告，其土地所有權才能得到認可，如未申告的土地便歸日本所有，因此許多延遲申告或是村莊、宗族所擁有的公有地，都因無人申告而成為日本的土地。調查結束後，日本成為最大的地主，並將土地轉售給「甲」，吸引日本移民來此，而多數的當地農民則淪落為零細的小農，耕作權遭到剝奪。請根據上述資料，選出下列合適的選項
  options:
  - label: A
    content: 當時失去土地的小農可能會前往中國東北地區發展
  - label: B
    content: 「甲」指的是南滿洲鐵道株式會社
  - label: C
