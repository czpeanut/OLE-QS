  type: single
  page: 1
  stem: 有一均勻材質的木箱立於粗糙地面（靜摩擦係數為 0.2），小明欲拉動或推動此木箱，共有四種施力方式：$F_{1}$ 為水平向右拉、$F_{2}$ 為水平向右推、$F_{3}$ 為與水平面夾 30° 角斜向右下推、$F_{4}$ 為與水平面夾 30° 角斜向右上拉。則以這四種方式恰拉動或推動木箱時的施力大小順序為何？
  options:
  - label: A
    content: $F_{3}$＞$F_{1}$＝$F_{2}$＞$F_{4}$
  - label: B
    content: $F_{3}$＞$F_{1}$＞$F_{2}$＞$F_{4}$
  - label: C
    content: $F_{4}$＞$F_{1}$＝$F_{2}$＞$F_{3}$
  - label: D
    content: $F_{4}$＞$F_{1}$＞$F_{2}$＞$F_{3}$
  - label: E
    content: $F_{1}$＝$F_{2}$＞$F_{4}$＞$F_{3}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: PH-1-2-3
      book: 物理（全）
      chapter: 物體的運動
      title: 生活中常見的力
      std: true
    textbook: 物理（全） 生活中常見的力
    pattern:
      key: PH-1-2-3:T04
      name: 斜向施力與最大靜摩擦比較
    labeled_by: agent
    label_confidence: high
    label_note: 缺圖（無附圖檔案，題幹提及箭頭代表施力方向，無法判斷F1~F4方向）
    fixed_by: agent
    fix_note: （人工修正：補充四種施力方向文字條件（免附圖）並補全解析）
  difficulty: 3
  explanation: $F_{1}$ 與 $F_{2}$ 均為水平施力，正向力等於物重 $mg$，故 $F_{1}＝F_{2}＝\mu_{s}mg$；$F_{3}$ 斜向下推會增加正向力，所需施力最大；$F_{4}$ 斜向上拉會減少正向力，所需施力最小。因此 $F_{3}＞F_{1}＝F_{2}＞F_{4}$。故選(A)。
