  section: 2
  number: 21
  type: multiple
  page: 2
  stem: 電力線的觀念首先由法拉第引入，為描述電場的一種想像曲線，用以表示電場之分佈；其製作方法係將可動正電荷置於電場中，將其沿著所受電力的方向連續移動之軌跡。下列關於電力線之敘述哪些正確？
  options:
  - label: A
    content: 電力線的切向方向表示正電荷運動的方向
  - label: B
    content: 電力線必須是平滑的封閉曲線
  - label: C
    content: 點電荷周圍發出或終止的電力線密度，正比於其電量大小
  - label: D
    content: 帶靜電導體內部無電力線
  - label: E
    content: 電力線為相互平行的直線時，此電力線描述的電場為均勻電場
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)錯誤，電力線的切向方向為正電荷的受力方向，不一定為運動方向；(B)錯誤，電力線不會是封閉曲線，封閉曲線是可以回到原發射的曲線，但電力線由高電位射向低電位，不會射回高電位；(C)正確，電力線數正比於電量；(D)正確，靜電導體内部如果有電力線，則內部的電子將受電力移動到表面達平衡；(E)錯誤，電力線為相互平行的直線僅能說明此處電場方向相同，但如果這些電力線密度並非處處相同，則電場量值不同。答案選(C)(D)(E)。
