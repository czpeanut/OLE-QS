  explanation: (A)(B)達靜電平衡，兩球電位相同，電位比為1：1；(C)(D)電位相同，$\frac{ kQ_{甲} }{ R }$＝$\frac{ kQ_{乙} }{ r }$，$\frac{ Q_{甲} }{ Q_{乙} }$＝$\frac{ R }{ r }$且$Q_{甲}$＋$Q_{乙}$＝Q＋q，所以甲的帶電量$Q_{甲}$＝（Q＋q）×$\frac{ R }{ R＋r }$；(E)甲的電位V'＝$\frac{ kQ_{甲} }{ R }$＝$\frac{ k }{ R }$×（Q＋q）×$\frac{ R }{ R＋r }$＝$\frac{ k（Q＋q）}{ R＋r }$＝$\frac{ RV_{1}＋rV_{2} }{ R＋r }$。答案選(C)。
