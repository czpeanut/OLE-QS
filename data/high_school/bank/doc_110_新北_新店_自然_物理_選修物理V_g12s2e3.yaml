- id: doc_110_新北_新店_自然_物理_選修物理V_g12s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「汞」一種在室溫下呈現液體狀態的金屬。汞的密度很大，而且導電性良好，但導熱性很差，這點與其他金屬不同。如果取27個相同汞球，其表面電位皆為V，則合併成一球後，此合成球表面電位為何？（已知球的體積公式$\frac{ 4 }{ 3 }$π$r^{3}$）
  options:
  - label: A
    content: 1V
  - label: B
    content: 2V
  - label: C
    content: 3V
  - label: D
    content: 9V
  - label: E
    content: 27V
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (1)假設每一個汞球的半徑為r、電量為Q，球的位V＝$\frac{ kQ }{ r }$，所以Q＝$\frac{ V×r }{ k }$。 (2)合併後的半徑為R，體積守恆：27×$\frac{ 4 }{ 3 }$π$r^{3}$＝$\frac{ 4 }{ 3 }$π$R^{3}$，R＝3r。 (3)根據電量守恆：27×$\frac{ V×r }{ k }$＝$\frac{ V'×3r }{ k }$，V'＝9V。答案選(D)。
