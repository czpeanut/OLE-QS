  stem: 現代產品開發日新月異，生產過程也逐漸精進，常常會有產品生產速度高過需求速度的現象，如果不想些辦法，許多產品就有可能賣不出去。於是商人想到幾種解決方式。其一便是創造流行，把消費品當成流行產品，特別以「要用更好的」方式鼓勵消費；而另一種方式，則是快速生產便宜但不耐用的產品，以使產品壽命縮短。請問下列所舉之例何者最符合上文的說法？
