  stem: 依據題文訊息判斷，2021 年 5 月爆發的 COVID-19 疫情，對當年遭疫情波及而面臨求職困難的應屆畢業生而言，面臨的是什麼類型的失業？又對臺灣的勞動市場造成什麼影響？
  options:
  - label: A
    content: 循環性失業，市場平均工資將降低
  - label: B
    content: 摩擦生失業，勞動需求線會往左移
  - label: C
    content: 循環性失業，勞動供給線會往右移
  - label: D
    content: 摩擦性失業，市場平均工資會提高
  group_stem: '最近幾年，臺灣青年的失業率不斷上升，2021 年 5 月爆發 COVID-19 疫情，使內需產業受到嚴重衝擊、業務緊縮或歇業，連帶影響應屆畢業生面臨求職困難。據統計，2021 年 20 至 24 歲的年輕人失業率高達 13.41 ％，創下十年來新高。然而，同樣也是這幾年，許多產業卻出現嚴重的「缺工」問題。例如：許多營建業與製造業的老闆表示，就算祭出高薪還是找不到好用的年輕人，許多技術型勞工都只剩下老人，必須外聘移工來填補人力空缺。

    有些人認為，這是因為臺灣的「技職教育崩壞」，導致現在的企業主招不到能用的年輕技術人才，甚至直接指出這是臺灣產業的重大危機。對以前的學生來說，國中畢業的選擇很單純：如果想念書、想考大學的人，就去念高中；如果想學一技之長、想早點出來工作，就去念高職、專科。但隨著臺灣的產業轉型、廣設大學和少子女化等等原因綜合之下，選擇「升學」的人愈來愈多，比起念完高職就出來工作，多數人還是會選擇繼續讀書，至少先拿個文憑再來決定未來出路。在這種「升學至上」的風氣下，高職除了培育學生的技術能力，還要輔導學生進入大學或科大，讓高職教育陷入兩難。

    另一方面，高職或科大的職業類學科的課程也存在很嚴重的「學用落差」問題。對業界來說，他們想要的是畢業後可以馬上投入產線的「即戰力」，但這些高職或科大畢業生卻往往不符合條件。因此，明明每年有許多受過技職訓練的畢業生，卻仍存在缺工問題。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由疫情造成的失業，為全球景氣不佳產生的失業屬於循環性失業，加上畢業季會使得勞動力的供給增加，但需求減少，會使平均工資下降，故選(A)。
