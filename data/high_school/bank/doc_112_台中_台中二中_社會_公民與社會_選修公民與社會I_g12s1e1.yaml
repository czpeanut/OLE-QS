  answer_status: verified
  answer_source: answer_key
  explanation: 從題文可看出廠商創造商機的訴求為「品質佳」及「替換無法使用的舊產品」。(A)二手商品交換會降低消費，不符合題文。(B)此為品質佳及好好享受的訴求，符合題文。(C)此為降價促銷吸引買氣，與題文不符。(D)鼓勵別過度消費並非廠商的訴求，與題文不符。
