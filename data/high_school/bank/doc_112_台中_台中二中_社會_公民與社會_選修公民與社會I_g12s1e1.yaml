  stem: 阿文近期想投入文創產業，但苦於缺乏租金較低的店面而遲遲無法開業，小君認為，政府應該用低於行情的租金提供更多工作空間，讓小資的文創者也有機會發展。但已在文創產業工作一陣子的前輩阿和卻指出，如果此做法要有效果，政府勢必得訂定篩選承租者資格的完善辦法。請問阿和這樣說的原因為何？
