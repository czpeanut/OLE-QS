  stem: 文磊下班後在餐桌上與家人分享鄰居最近的工作遭遇，下列四位鄰居誰的遭遇會使失業率上升？
  options:
  - label: A
    content: 雨萱感嘆求職困難，畢業後雖想找工作但最後放棄找工作
  - label: B
    content: 詮勝常上網分享擔任家庭主夫的心得，最近成為專欄作家
  - label: C
    content: 韻如剛結束當宅女的生活，試圖應徵一份公司企劃的工作
  - label: D
    content: 子維志願役到期後不再續簽，決定回家裡的觀光農場幫忙
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 失業率為失業人口占勞動人口的比例。(A)雨萱為怯志工作者，由失業人口轉為非勞動力，會使失業率下降。(B)詮勝為非勞動力轉為勞動力，失業率降低。(C)韻如從非勞動力成為勞動力，若其找不到工作會使失業率上升，為正解。(D)回家裡的觀光農場幫忙，為就業人口，不會使失業率上升。
