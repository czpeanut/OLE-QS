  stem: 某國總統大選在即，雙方候選人針對「對企業增稅／減稅」議題的意見南轅北轍。候選人 A 主張減稅，並承諾上任後即推動 6 年 4 兆的減稅法案，雖然政策說明中強調中產階級也能受惠，但最大受惠者仍然是企業；候選人 B 則主張對年收入超過 50 萬的企業及個人加稅，並計畫將個人所得稅率從 38 ％調高至 40 ％。假設企業的投資意願會受到此政策影響，則以下說明何者最有可能？
  options:
  - label: A
    content: 若廠商看好候選人 A 當選，則同樣的借款數額下，廠商願意支付的利率將會提高
  - label: B
    content: 若廠商看好候選人 B 當選，代表看好該國經濟成長，用於投資的借貸金額會增加
  - label: C
    content: 在資金供給不變的情況下，若廠商看好候選人 A 當選，在可貸資金市場的需求線應會左移
  - label: D
    content: 在資金供給不變的情況下，若廠商看好候選人 B 當選，在可貸資金市場的需求線應會右移
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)候選人 A 的減稅法案，會使廠商更願意投資，願意負擔較高的利率，為正解。(B)候選人 B 主張所得高者，稅率提到更高，因此可能不看好該國經濟成長，不然恐要支付更高的稅金。(C)廠商看好候選人 A 會增加可貸資金的需求，需求線向右移。(D)廠商看好候選人 B，為避免支付較高的稅金，會減少可貸資金的需求，需求線向左移。
