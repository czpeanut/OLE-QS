questions:
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 《國民年金法》明訂，消費者物價指數（CPI）年增率累計逾 5 ％時，月投保金額將在隔年依該指數成長率調整。由於老年年金給付是根據月投保金額來計算，所以未來給付額度也會跟著增加。另外，法有明定自 2012 年 1 月 1 日起，每 4 年將依照消費者物價指數成長率，調高老年年金給付金額。也就是說，物價漲多少，年金給付就增加多少。請問這樣的法規規定最有可能的原因是下列何者？
  options:
  - label: A
    content: 讓媒體擴大渲染政府德政
  - label: B
    content: 促進重分配改善貧富差距
  - label: C
    content: 讓領取年金實質所得不變
  - label: D
    content: 提振經濟成長及復甦景氣
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 老年年金給付會隨著消費者物價指數的年增率增加而增加，目的是為了使老年年金的請領者仍可享有同樣的實質購買力，因此答案為(C)讓領取年金實質所得不變。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 1970 年代，孟加拉當地爆發饑荒，諾貝爾和平獎得主尤努斯（Muhammad Yunus）發現，只要向婦女提供小額借款，她們自能活用這筆款項，購入農作物或原材料做小生意，紓緩一家捱飢抵餓的困境。但這群婦女因為太窮無法獲得銀行貸款，只好借高利貸，往往得不償失。尤努斯因而創辦鄉村銀行（Grameen Bank），提供較低利率的貸款給這些婦女，讓她們也能透過工作累積財富。請問鄉村銀行能發揮可貸資金市場的何種功能？
  options:
  - label: A
    content: 幫助所得較低的年輕人提高消費水準
  - label: B
    content: 避免資金有餘者發生資金閒置的問題
  - label: C
    content: 幫助需要資金的生產者提高自身所得
  - label: D
    content: 讓所得較高的人在退休後有更多財富
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「鄉村銀行提供較低利率的貸款給這些婦女，讓她們也能透過工作累積財富」，可得知此銀行的功能是為了讓需要資金的人能以較低成本獲取資金，除可從中獲取所得、累積財富，也避免因無法借款做生意而使經濟陷入更大的困境，故選(C)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 痛苦指數（Misery index）是由通貨膨脹率與失業率加總而得，指數愈高代表民眾的生活愈痛苦。2016 年上半年我國的痛苦指數約為 5.4 ％，創下近 4 年最高，也超過韓、星、日等亞洲鄰國。根據上文推斷，下列哪一種情況的痛苦指數最高？
  options:
  - label: A
    content: 通貨膨脹率下降、失業率增加
  - label: B
    content: 通貨膨脹率升高、失業率下降
  - label: C
    content: 通貨膨脹率與失業率均下降
  - label: D
    content: 通貨膨脹率與失業率均增加
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 痛苦指數是由通膨率與失業率加總而得，因此當兩個指數皆為成長時，痛苦指數最高，故選(D)。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 政府觀察到某一產品的供需變化如右圖所示。請問下列哪一項政府政策，目的在解決圖中所觀察到的價格下跌問題？
  options:
  - label: A
    content: 行政院宣布高鐵南伸屏東計畫啟動，希望促進南部交通運輸便利
  - label: B
    content: 交通部推出國內自由行優惠行程，鼓勵國人秋冬多規劃國內旅遊
  - label: C
    content: 農委會依據農產品的產量監控系統，呼籲農民不要再搶種高麗菜
  - label: D
    content: 經濟部宣布釋出更多廠房用地，以因應臺商回流造成的地價攀升
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 426.35
      - 520.4
      - 563.9
      - 655.7
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 供需圖為供給增加，導致價格下降，因此須找出可以解決供給過多的情形，使供給減少的政策。(A)高鐵南伸會使國人更願意搭高鐵，會促使需求增加。(B)鼓勵國人旅遊，會使需求增加。(C)呼籲農民不要搶種高麗菜，會使供給減少，可減緩價格過低或下降的情形，為正解。(D)釋出廠房用地會使供給增加，使價格下降。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '某國 2017 至 2020 年的「消費者物價指數」和「通貨膨脹率」如下表所示（以 2017 年為基期）。請問下列選項的敘述何者「錯誤」？

    | 年分 | 2017 | 2018 | 2019 | 2020 |

    | --- | --- | --- | --- | --- |

    | 消費者物價指數 | 100 | 102.38 | 102.75 | 102.67 |

    | 通貨膨脹率（％） | 1.01 ％ | 2.38 ％ | 0.36 ％ | －0.08 ％ |'
  options:
  - label: A
    content: 若要購買相同數量的商品，在 2019 年需花費最多金錢
  - label: B
    content: 若將基期年改為 2018 年，則各年通貨膨脹率均會下降
  - label: C
    content: 從表中資訊可推估，2016 年的消費者物價指數約為 99
  - label: D
    content: 2020 年的資訊顯示，當年的整體生活成本較前一年下降
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因為基期相同，2019 年的 CPI 最高，所以 2019 年花最多錢，為正確敘述。(B)若將基期年改為 2018 年，2019 年的通膨率仍會增加，因為 2019 年仍較 2018 年的 CPI 高，故為錯誤敘述。(C)從 2017 年的通膨率為 1.01 ％，可回推 2016 年的 CPI 約為 99，為正確敘述。(D)因為通膨率為負值，所以生活成本較前一年下降，為正確敘述。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 一般市場上瓶裝水的價格均比花生等堅果便宜，但在美國的酒吧中，一瓶 500c.c.的瓶裝水售價高達 5 美元，花生等堅果卻免費任人取用。請問以經濟學分析此現象最合理的解釋為何？
  options:
  - label: A
    content: 堅果和酒水是供給上的互補品，提供免費堅果給顧客，顧客就更有機會買酒
  - label: B
    content: 酒吧中瓶裝水的價格愈高，酒吧的利潤就會愈多，所以將瓶裝水設定為高價
  - label: C
    content: 酒吧將水定高價，是希望顧客可以增加對啤酒的需求，此時水和酒是替代品
  - label: D
    content: 花生等堅果是消費者比較不喜歡吃的產品，所以酒吧就只好免費提供給顧客
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應該為需求上的互補品，會搭配一起食用。(B)(C)主要原因是希望顧客多買酒而非水，所以將瓶裝水定為高價，水和酒為消費上的替代品。(D)一般而言，堅果類免費未必是消費者不喜歡吃的食物，反而是與營業策略有關，例如可增加消費者購買酒或水的欲望。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 有鑑於物價持續上漲，我國勞動部欲以調高基本工資的方式，減輕通貨膨脹對勞工生活水準的影響。由勞動市場供需理論來看，以下有關基本工資政策的影響，何者正確？
  options:
  - label: A
    content: 勞動市場中怯志工作者人數將增加
  - label: B
    content: 對所有勞工都帶來有利的就業保障
  - label: C
    content: 調高基本工資可有效提升實質薪資
  - label: D
    content: 整體市場所僱用的勞工人數會減少
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)提高基本工資會讓勞動市場中願意投入勞動市場的人數增加，因此會使怯志工作者人數減少。(B)(D)並非有利於所有勞工，因工資增加會使成本增加，可能會造成失業人口增加，因此所僱用的勞工數會減少。(C)需考量通貨膨脹率，提高工資並不一定會提升實質薪資。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 各國疫情趨緩，陸續解除居民的旅遊管制，商家與旅遊業逐漸重新開業，推估各國景氣將開始復甦。其中出遊用車數量增加，也帶動汽車產業和觀光產業率先發展，促使廠商須添購機器設備與重整相關軟硬體設施，進而影響資金流動、景氣變化與利率的改變。請問若其他條件不變，依據上述內容，以下何者敘述正確？
  options:
  - label: A
    content: 廠商若看好景氣復甦，且有意願向銀行借貸投資，則使資金供給增加
  - label: B
    content: 廠商若有意願投資，在資金供給不變而資金需求增加下將使利率上升
  - label: C
    content: 針對上述景氣回溫的狀況，汽車產業可能會降低對於固定投資的意願
  - label: D
    content: 題目中提及的汽車產業與觀光產業，其資金需求增加，將使利率下降
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應是使資金需求增加。(B)資金供給不變而需求增加，會使利率上升，為正確敘述。(C)景氣回溫，廠商應該會提升對於固定投資的意願。(D)資金需求增加，會使利率上升。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 小瑛、小真為追求環保想購買電動機車，但一臺要 7 萬元，實在「高攀不起」；小麗告訴她們，政府最近每臺補助 3 萬，等同只要花 4 萬就行了。小瑛聽了高興地說可以下手了，小真則仍感嘆買不了。請問下列相關敘述，何者正確？
  options:
  - label: A
    content: 小瑛對此電動機車的願付價格應該介於 4 萬元到 7 萬元之間
  - label: B
    content: 小真的願付價格因為政府補助而提高，但仍沒有達到 4 萬元
  - label: C
    content: 政府補助後，小瑛購買電動機車能獲得 3 萬元的消費者剩餘
  - label: D
    content: 補助後，小瑛花 4 萬元就能買電動機車，故其願付價格降低
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)小瑛說 4 萬可以下手了，表示其願付價格在 4 ～ 7 萬元之間，為正解。(B)願付價格並不會因為政府補助而增加。(C)一開始電動機車為 7 萬元，小瑛無法負擔，所以補助後，購買電動機車的消費者剩餘應該低於 3 萬元。(D)願付價格應該沒有改變。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 智英擁有高學歷且曾具豐富的廣告行銷獲獎資歷，卻因家庭而辭去工作長達 7 年，近期想重返職場、二度就業，但時代與科技變遷快速，行銷策略、科技媒體、社群操作等方式已不同以往，不到 10 年已經換了新的世代。智英發現她幾乎是因為無法熟悉運用新軟體而無法錄取。請問智英的情況屬於何種失業類型？
  options:
  - label: A
    content: 因社群媒體轉型快速，有關產業及公司宣告破產而導致景氣低迷的循環性失業
  - label: B
    content: 因行銷軟體策略與產業技術已有所改變，無法滿足廠商業務需求的結構性失業
  - label: C
    content: 因畢業與年後轉職潮所產生的勞動力激增，導致無法完全媒合產業的自然失業
  - label: D
    content: 因社交軟體日益更新，導致產業結構變化勞工必須不斷進修學習的摩擦性失業
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為結構性失業。(B)產業技術改變，所造成的失業為結構性失業，為正解。(C)轉職產生的失業為摩擦性失業。(D)產業結構改變為結構性失業。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 第一次世界大戰結束，戰勝國要求德國負擔價值 10 萬噸黃金的鉅額賠款，德國政府遂大量印製紙鈔（德國馬克）支付。下列何種場景「最不可能」在當時的德國境內出現？
  options:
  - label: A
    content: 珠寶、房地產的銷售數量大幅上升
  - label: B
    content: 街頭散落大疊紙鈔，路人卻視而不見
  - label: C
    content: 到餐廳消費的人會在點餐後馬上結帳
  - label: D
    content: 大批民眾突然湧向銀行想要存入現金
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 大量印製紙鈔會導致通貨膨脹，會使人民不想持有貨幣，想轉換成其他資產、趕快支付或購買物品，因此(A)(B)(C)皆為正確敘述。(D)為錯誤敘述，民眾不想持有貨幣，也不會想把現金存入銀行，因為貶值的速度很快。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
