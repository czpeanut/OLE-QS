  answer_status: verified
  answer_source: answer_key
  explanation: (A)賑災投入的工程支出會計入 GDP 的投資支出（I），使 GDP 上升。(B)災害會減少民眾的消費，減少 GDP 的消費支出(C)，使 GDP 下降，為正解。(C)影響出口，應該會使 GDP 下降。(D)在國際貿易的體系中，一國發生事件皆會影響到全國的貿易。
- id: doc_112_台中_台中二中_社會_公民與社會_選修公民與社會I_g12s1e1_s1_14
