  stem: 臺股 2020 年繳出好成績，2021 年來持續創高，日均量突破 3,000 億元。阿翔受到這一波股市表現不錯的吸引，首度開戶投資。然而好友阿龍提醒雖然股市上揚，但物價也持續上升了好一段時間。請問當通貨膨脹較為嚴重時，下列哪項敘述可能是阿龍給股市新鮮人阿翔的建議？
  options:
  - label: A
    content: 因名目利率上升，不如多增加存款至商業銀行
  - label: B
    content: 轉投資具有保值性的財產，如房地產或貴金屬
  - label: C
    content: 股市上揚時風險正低，適合多借貸投入股票市場
  - label: D
    content: 買入更多長期債券，能因利率提高獲得更多利息
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)通膨嚴重時，名目利率常會被通膨吃掉，實質購買力下降，不建議將錢存到銀行。(B)投資保值性資產，可稍微抑制通膨帶來的影響，為正解。(C)股票上揚風險也更高，應該更謹慎投資。(D)因為通膨嚴重，購買長期債券的高利率也會受通膨影響，而使報酬率下降。
