  type: single
  page: 2
  stem: 數量級在物理中是用來估計物理量的大小，以$10^{n}$表示，n為整數的冪次。一個物理量之數值若以科學記號表示成a×$10^{n}$ （1 ≤ a ＜10，n為整數），其數量級除了由整數的冪次n決定外，還需考慮a之大小： (1)當a＜$\sqrt{10}$ ≈ 3.16時，將a視為$10^{0}$，故其數量級為$10^{n}$ (2)當a ≥ $\sqrt{10}$ ≈ 3.16時，將a視為$10^{1}$，故其數量級為$10^{n＋1}$ 例如：真空中的光速c＝3×$10^{8}$，其數量級為$10^{8}$；亞佛加厥常數$N_{0}$＝6×$10^{23}$，其數量級為$24^{10}$。若以物理「數量級」的觀點，甲、乙、丙、丁四人按照下列身價，有幾個人有資格稱為「千萬」富翁： (甲)身價1200萬；(乙)身價600萬；(丙)身價350萬；(丁)身價100萬
