- id: doc_109_屏東_屏東高中_自然_物理_選修物理II_g11s2e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 3
  stem: (1) 何謂總動量守恆？ (2) 如果物體水平方向有外力作用，鉛直無外力作用，則水平方向動量＿＿＿；鉛直方向動量＿＿＿（回答守恆或不守恆） (3) 利用前面的觀念，質量為M（不含砲彈）之砲車靜止於光滑水平面上，以仰角θ、初速v，發射出質量為m之砲彈，則砲車後退之速度為＿＿＿。
