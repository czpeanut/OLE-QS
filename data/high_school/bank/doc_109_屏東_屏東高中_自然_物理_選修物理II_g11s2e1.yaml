- id: doc_109_屏東_屏東高中_自然_物理_選修物理II_g11s2e1_s1_24
  section: 1
  number: 24
  type: fill
  page: 3
  stem: 當我們必須利用螺絲或者螺帽來將一些精密的儀器鎖緊時，說明書上通常都會載明必須以特定量值的力矩來旋緊螺絲。這樣做的原因是，若力矩不足，則螺絲容量鬆脫，而若力矩過大，則螺絲之螺紋容易變形，甚至於螺絲會斷裂。扭矩扳手（附圖）便是因應這個需求而發明的：在將螺絲旋緊的時同，只要對照扳手上的刻度便可知道當時力矩的量值。 在更換汽車輪胎後，我們也必須利用扭矩扳手來將螺絲適度地旋緊。手握扳手處與螺絲的距離為45公分，手施力40公斤重且施力的方向和扳手把柄的夾角為60°時（如附圖所示），試求扭矩扳手上之讀數約為＿＿＿公斤重．公尺？（可能會用到的數學。$\sqrt{ 2 }＝$1.41，$\sqrt{ 3 }＝$1.73）
