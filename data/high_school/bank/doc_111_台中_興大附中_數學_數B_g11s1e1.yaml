- id: doc_111_台中_興大附中_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列選項哪些是正確的？
  options:
  - label: A
    content: sin1＞0.5
  - label: B
    content: sin2＞sin1
  - label: C
    content: sin1＞cos1
  - label: D
    content: sin1＞tan1
  - label: E
    content: $-\frac{1}{2}$＜cos2＜0
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：sin1$\approx$sin57°＞sin30°＝$\frac{1}{2}$

    (B) ○：sin2$\approx$sin114°＝sin66°

    sin1$\approx$sin57°

    ⇒ sin2＞sin1

    (C) ○：∵45°＜1 弳$\approx$57°＜90°

    ∴sin1＞cos1

    (D) ╳：∵0＜cos1＜1

    ∴tan1＝$\frac{\sin 1}{\cos 1}$＞sin1

    (E) ○：cos2$\approx$cos114°

    ∵cos120°＜cos114°＜cos90°

    ∴－$\frac{1}{2}$＜cos2＜0

    故選(A)(B)(C)(E)'
