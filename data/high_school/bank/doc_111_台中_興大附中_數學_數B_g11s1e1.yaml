  stem: 設 a＞0 且 a≠1，又 x 為實數，則對於 y＝$a^{x}$ 的圖形，下列敘述何者正確？
  options:
  - label: A
    content: y＝$a^{x}$ 之圖形由左而右逐漸上升
  - label: B
    content: y＝$a^{x}$ 之圖形恆過點（0，1）
  - label: C
    content: 對任意相異實數 $x_{1}$，$x_{2}$，恆有$\frac{a^{x_{1}}+a^{x_{2}}}{2}$＞$a^{\frac{x_{1}+x_{2}}{2}}$
  - label: D
    content: y＝$a^{x}$ 之圖形與 y＝－$a^{x}$ 之圖形對稱於 y 軸
  - label: E
    content: y＝$a^{x}$ 之圖形與直線 y＝2 恰有一交點
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
