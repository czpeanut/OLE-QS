  stem: 半導體行業按照摩爾定律已發展了半個多世紀，對二十世紀後半葉的世界經濟增長做出了貢獻，並帶來科技創新、社會改革、提高了生產效率。個人電腦、網際網路、智慧型手機等技術改善和創新都離不開摩爾定律的延續。摩爾定律由 Intel 創始人之一<u>戈登．摩爾</u>所提出：積體電路上可容納的電晶體數目約每隔 2 年會增加 1 倍。而 Intel 執行長<u>大衛．豪斯</u>則提出：每 18 個月晶片的效能會提高 1 倍（即電晶體數目加倍）。若依照<u>摩爾</u>的數據預估，現在積體電路上可容納的電晶體數目約是 30 年前的 $2^{m}$ 倍；依照<u>豪斯</u>的數據預估，現在積體電路上可容納的電晶體數目約是 30 年前的 $2^{n}$ 倍，則數對（m，n）＝＿＿＿＿。
