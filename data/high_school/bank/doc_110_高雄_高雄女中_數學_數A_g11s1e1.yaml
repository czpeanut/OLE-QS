  explanation: 因為sin$\frac{2\pi}{3}$＝$\frac{\sqrt{3}}{2}$＜sinθ＜1＝sin$\frac{\pi}{2}$， 所以$\frac{\pi}{2}$＋2kπ＜θ＜$\frac{2\pi}{3}$＋2kπ，k ∈ Z ⇒ $\frac{\pi}{3}$＋$\frac{4k\pi}{3}$＜$\frac{2\theta}{3}$＜$\frac{4\pi}{9}$＋$\frac{4k\pi}{3}$， (i) k＝0代入 ⇒ $\frac{\pi}{3}$＜$\frac{2\theta}{3}$＜$\frac{4\pi}{9}$，所以$\frac{2\theta}{3}$為第一象限角。 (ii) k＝1代入 ⇒ $\frac{5\pi}{3}$＜$\frac{2\theta}{3}$＜$\frac{16\pi}{9}$，所以$\frac{2\theta}{3}$為第四象限角。 (iii) k＝2代入 ⇒ 3π＜$\frac{2\theta}{3}$＜$\frac{28\pi}{9}$，所以$\frac{2\theta}{3}$為第三象限角。 故選(A)(C)(D)。
