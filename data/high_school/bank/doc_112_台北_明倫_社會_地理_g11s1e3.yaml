  page: 1
  stem: 歐洲結盟最初只有 6 個會員國，後來歷經數次擴張到現在成為世界三大經濟體之一的歐洲聯盟，人口超過 5 億，於世界經濟中扮演重要地位，若依其加入成員的位置來看，其擴張的先後順序應是如何？
  options:
  - label: A
    content: 北→南→西→東
  - label: B
    content: 西→南→北→東
  - label: C
    content: 西→東→南→北
  - label: D
    content: 南→西→北→東
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 歐盟最早是由德法義荷比盧六國於 1965 年成立的歐洲共同體，在不同年代加入依序如下：荷蘭、比利時、盧森堡、法國、德國、義大利（1967）→丹麥、愛爾蘭→希臘→西班牙、葡萄牙→瑞典、芬蘭、奧地利→賽普勒斯、愛沙尼亞、拉脫維亞、立陶宛、波蘭、捷克、斯洛伐克、匈牙利、馬爾他、斯洛維尼亞→羅馬尼亞、保加利亞→克羅埃西亞。如上所述，從進程來看，依序是向(B)西→南→北→東擴張。
