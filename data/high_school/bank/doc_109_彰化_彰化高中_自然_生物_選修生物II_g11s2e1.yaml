- id: doc_109_彰化_彰化高中_自然_生物_選修生物II_g11s2e1_s3_39
  section: 3
  number: 39
  type: single
  page: 4
  stem: 根據上文敘述，RNA的成分中，能吸收紫外光的是下列何者？（單選）
  options:
  - label: A
    content: 醣類
  - label: B
    content: 磷酸基
  - label: C
    content: 含氮鹼基
  - label: D
    content: 三種成分皆可
  group_stem: '紫外光以往被認為會妨礙長鏈有機分子的形成，然而 RNA 的特定成分能吸收紫外光而作為「保護者」，因此具有比其他分子更高的優勢。一項新的研究發現，紫外光可能是生命起源的關鍵。研究顯示紫外光其實協助挑選出足以擔任生命的分子種子。

    地球上的生命是三十七億年前演化出來的，當時並沒有臭氧層的保護來擋掉紫外光，因此當時紫外光的強度是現在的上百倍。RNA 的核苷酸是由三種成分構成—醣類、磷酸基和含氮鹼基，德國 Osnabrück Univ 的生物物理學家 Armen Mulkidjanian 等人認為鹼基可以有效地化解掉紫外光的傷害，並保護構成骨架的醣類和磷酸。他們將不同有機分子的光化學資料輸入到一個電腦模式中，模擬紫外光對穩定性的效應。結果發現：在強紫外光下，RNA 比其他分子更可能形成長鏈。紫外光甚至還可能促進 RNA 的聚合化，在相當稀有的偶發機率下，受紫外光照射到的 RNA，可能被激化而能和其他分子作用，因而形成鏈狀。這結果使對紫外光阻礙生命演化的觀點，轉變為紫外光是推動整個過程的選擇因素。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
