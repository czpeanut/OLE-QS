  stem: 清代醫家吳謙在其編著中介紹四種預防天花的種痘法：(1)痘衣法：把痘瘡患者的內衣給接種者穿上,以引起感染。(2)痘漿法：採取痘瘡的泡漿，用棉花蘸塞被接種者的鼻孔。(3)旱苗法：把痘痂陰乾研末，以銀管吹入法。(4)水苗法：把痘痂研細並用水調勻，用棉花蘸染塞入鼻孔。請問上述醫療手段，原理與下列何者最為接近？
