  section: 1
  number: 12
  type: single
  page: 2
  stem: 資料一：英國人認為鐵路具有教化印度殖民地人民的作用。鐵路可以讓他們建立守時的習慣，還可以帶他們出去「見世面」，進而讓他們變得積極進取。此外，英國人還相信，搭乘火車可以讓不同種姓的印度人接觸彼此，鬆動當地的種姓制度。 資料二：學者認為，鐵路、電報、蒸汽船可以破壞亞洲專制制度，改善生產模式，讓亞洲人進入一個較高的發展階段。其中，他特別強調鐵路的作用。由於鐵路具有工業火車頭的角色，他視鐵路為復興印度的必要科技。根據兩則資料，下列何者正確？
  options:
  - label: A
    content: 資料一證明英國殖民印度純粹是為了使當地進步
  - label: B
