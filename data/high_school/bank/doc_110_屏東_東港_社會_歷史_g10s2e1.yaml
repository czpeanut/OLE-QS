  stem: 日本幕府時代，有一幕府為了鞏固政權，曾建立「幕藩體制」，要求接受幕府封地的各「藩」(大名)家庭成員必須住在首都，大名則在首都和領地兩地隔年輪住，以便控制。以下有關該幕府之敘述，何者正確？
