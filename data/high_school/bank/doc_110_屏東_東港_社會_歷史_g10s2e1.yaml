questions:
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 漢初法律規定，國家按人民的爵等賜予田土和居宅；北魏至唐初也都有政府頒授土地給成年人的相關法令。這些作法的共通目的最可能是：
  options:
  - label: A
    content: 擴大國家賦稅來源
  - label: B
    content: 實現均富社會理想
  - label: C
    content: 強化社會救濟效果
  - label: D
    content: 促進農耕技術改良
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 西元958年，高麗模仿中國任用官吏的國家考試制度，選拔具有學問的儒學學者為官吏，以抑制開國功臣系的武臣，期能強化王權，建立新的官僚秩序。請問高麗實施的制度為何？
  options:
  - label: A
    content: 科舉制
  - label: B
    content: 世官制
  - label: C
    content: 九品官人制
  - label: D
    content: 抽籤制
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 西漢時期災異頻仍，每當災害發生，皇帝常常下詔罪己，根據歷史學家黃仁宇的統計，《漢書》中記載頒布罪己詔多達33次之多，這反映了下列哪一思想的流行？
  options:
  - label: A
    content: 尊王攘夷
  - label: B
    content: 獨尊儒術
  - label: C
    content: 天人感應
  - label: D
    content: 無為而治
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 資料一：各部門直接對皇帝負責，彼此不相統屬，全然聽命於皇帝。 資料二：在缺乏制衡的條件下，一旦君主荒怠，權臣自然應運而生。 資料三：宦官在皇帝授權下，掌握批閱公文的權力。
    若給此三段資料下一標題，何者較為合適？
  options:
  - label: A
    content: 宋代君權的擴張
  - label: B
    content: 官僚制度的腐敗
  - label: C
    content: 明朝廢相的影響
  - label: D
    content: 至尊皇權的式微
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 學者討論中國歷史上的某個朝代時，有人認為當時皇權專制盛行，社會停滯，思想僵化，可說是一個「黑暗時代」。但有學者不同意這種說法，主張當時商品經濟繁榮，類似今日資本主義的情況；出版事業發達，學術流通快速；知識分子還常常組織社團，發表對時事的意見。這些學者討論的是哪個朝代？
  options:
  - label: A
    content: 唐代
  - label: B
    content: 宋代
  - label: C
    content: 元代
  - label: D
    content: 明代
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 中國歷史上某一時期，士人和小吏要在仕途上求發展，多以孝廉為階梯。學者指出，此時孝廉以家貲豐厚，累世仕宦，研讀經書，曉習律令，且經過地方吏職歷練的，占大多數；來自貧寒之家，但才德兼備的，則很少。這一時期最可能是：
  options:
  - label: A
    content: 東漢
  - label: B
    content: 東晉
  - label: C
    content: 北周
  - label: D
    content: 北宋
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 唐太宗下令大臣修《氏族志》，欲排定各姓氏等級。編成之後，太宗不滿意，指示重修時只需根據現在的官爵等第區分等級。修訂版將各姓氏分成九等級，以皇室為首，外戚次之。高宗時，宰相李義府門第寒微，想與山東士族結親被拒，乃上告高宗。唐高宗因此下令，山東士族「七姓十家不得自為婚」。唐代修訂《氏族志》、發布「禁婚令」，最主要目的是：
  options:
  - label: A
    content: 擔憂士族通婚，聲氣相通，壟斷科舉考試晉身管道
  - label: B
    content: 避免傳統士族透過聯姻結盟，禁婚壓抑其社會地位
  - label: C
    content: 禁止士族近親通婚，避免造成人倫與社會關係混淆
  - label: D
    content: 擔心士族通婚，擴大土地兼併，造成農民流離失所
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 在中國某個朝代中，皇帝頒下詔書，一個官員反對這個命令，並在詔書上寫下他的看法。其他官員趕忙勸阻，認為這對皇帝不敬，但這位官員表示這是法律賦予他的職責。皇帝知道此事後，非但沒有責備，反而嘉許他能防範詔敕可能發生的錯誤。這個故事最可能發生在何時？
  options:
  - label: A
    content: 兩漢
  - label: B
    content: 隋唐
  - label: C
    content: 兩宋
  - label: D
    content: 明清
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 日本德川幕府常藉外交手段來強化政權的合法性，鞏固統治地位。1607年到1811年，朝鮮派遣12次通信使到日本；1610年到1850年，琉球也派了21次使節團。使節團主要是恭賀將軍繼位或世子出生，各地大名目睹其豐厚的賀禮，聽到祝賀德川一統天下的頌辭，自然心悅誠服。不過，德川幕府卻從未與中國發展正式關係，最可能的原因是：
  options:
  - label: A
    content: 幕府實施「鎖國」政策，拒與中國建立關係
  - label: B
    content: 幕府拒絕奉行朝貢體制，不願接受天朝秩序
  - label: C
    content: 幕府的財政發生困難，無法負擔沉重的賀禮
  - label: D
    content: 日本自古以文明開化自居，對中國向來輕視
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 殷中興之主盤庚遷都時，遭到舉國上下反對，直到他召集氏族領袖宣示：「我夜裡夢到先王囑託，告知找了一處祥和安樂的好地方。如果你們反對，就是反對先王的在天之靈。」之後才獲成功。請問我們該如何解讀上述文字？
  options:
  - label: A
    content: 盤庚透過武力高壓方式完成遷都
  - label: B
    content: 商族相信商王具備通天的能力，權力來自上天賦予
  - label: C
    content: 盤庚時期政局不穩定，商王沒有任何實權
  - label: D
    content: 商王重視民意，已具備「天命靡常」的觀念
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 根據《漢書》記載，漢武帝時期任用一些親信、侍從(如尚書)擔任「大司馬、左右前後將軍、侍中、常侍、散騎」，組成宮中的決策中樞，相對於丞相以下至六百石官員則形成「外朝」。漢武帝此舉的作用為何？
  options:
  - label: A
    content: 強化皇權
  - label: B
    content: 開創三省六部制
  - label: C
    content: 擴大相權
  - label: D
    content: 確立選才制度
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 法國孟德斯鳩說：「中國沒有世襲的官吏和貴族，皇帝通過科舉等途徑選拔官吏。凡是具有真才實學的人，不論出身如何，都有經過科舉考試成為官吏的機會。」這段言論揭示
  options:
  - label: A
    content: 世襲制維護了特權等級的利益
  - label: B
    content: 察舉制有利於選拔各種各類人才
  - label: C
    content: 九品官人制打破了門第的界限
  - label: D
    content: 科舉制為知識分子提供參政機會
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 有一個朝代在建立政權之後，便進行分封，每次封建都是版圖之擴充，一方面可以對舊地加強統治，另一方面又可以把同姓諸侯分封到新擴占的領土，所以「分封」乃是一種侵略性的武裝移民。請問文中所述是指哪一朝代？
  options:
  - label: A
    content: 西周
  - label: B
    content: 西漢
  - label: C
    content: 西晉
  - label: D
    content: 明代
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 秦始皇採行了「五德終始說」中的「五德相勝」，自認為秦為水德，取代周的火德而有天下，並建立了一套繁雜的宮室、宗廟、陵寢、輿服以及相關的禮儀典章，藉此以強調皇帝至尊的權威地位。請問秦始皇採行「五德終始說」的主要目的為？
  options:
  - label: A
    content: 為實施中央集權統治
  - label: B
    content: 為進行神權統治
  - label: C
    content: 為推展封建制度
  - label: D
    content: 確立其政權的合理性
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 小新在科普文章中看到一個圖表，如附圖。試問關於此圖表的解讀下列何者正確？
  options:
  - label: A
    content: 此為周代中央與地方的封建關係，甲為中央，乙為地方
  - label: B
    content: 此為宋代中央與地方的權力關係，甲為地方，乙為中央
  - label: C
    content: 此為中國歷代君權與相權的消長，甲為君權，乙為相權
  - label: D
    content: 此為中國歷代外戚與宦官的鬥爭，甲為宦官，乙為外戚
