- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_34
  section: 1
  number: 34
  type: single
  page: 3
  stem: 請問歷史老師是在講述哪一朝代的賦稅制度？
  options:
  - label: A
    content: 漢代
  - label: B
    content: 魏晉
  - label: C
    content: 唐代
  - label: D
    content: 宋代
  group_stem: ◎歷史老師說這個賦稅制度是以土地財產的多少，來確定繳納稅額的多寡。換言之，財產多的稅重，財產少的稅輕，過去以人丁為標準的稅法，從此改變成以財產為標準了。而且不再有全國統一的稅額，而改用攤派的辦法，繳稅時除依地稅為基礎之部分為穀、粟外，其依戶稅為基礎之部分則為錢。既以錢為定稅之標準，則應徵錢。在計算稅額時，雖皆折為錢數計算，但實行徵稅時，又復由錢數折合為絹帛，人民納稅仍須用絹帛。然絹帛之比價，輕重時有變動，定稅時是物重錢輕，其後是物輕鏡重。
