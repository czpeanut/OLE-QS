  stem: 從上述資料可以得知傳統中國的君權仍受到不同力量的約束，請問其中哪一筆資料所描述的力量，最容易遭到君王所反抗？
  options:
  - label: A
    content: 資料一
  - label: B
    content: 資料二
  - label: C
    content: 資料三
  - label: D
    content: 以上皆是
  group_stem: ◎資料一：「使用暴力一直是統治者對於百姓和官吏獨有的特權，但是他們不能只靠強力統治，因此需要儒士的協助，以表現他時時懷著行乎仁、止乎禮的心。」
    資料二：「竊以為遠稽古訓，不若近事之可徵；上嘉先王，不如家法之易守。……唐憲宗讀貞觀政要，竦幕(敬慕)不能终卷：宋仁宗命侍臣讀三朝寶訓及祖宗聖政錄。前史書之，皆為盛事。」
    資料三：「此制度畢竟只是傳統政治體系中的一部機器，它本身在很大的程度上仍是受君權操縱。它只能要求操縱者遵守機器運行的合理軌道，但是卻無力阻止操縱者運用這部機器去達成甚至是相當不合理的任務。」
