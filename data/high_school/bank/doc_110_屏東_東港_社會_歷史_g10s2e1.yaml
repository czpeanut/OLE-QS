  stem: 1975年出土的秦代「睡虎地秦簡」寫著：「某某人有家屋一棟二室，各有入口，室皆瓦蓋，設有木造的門，種有桑樹十株。妻某在逃，成年女兒某，未婚，未成年男子某，身高六尺五寸，雄犬一隻。」關於此一史料的解讀，下列何者正確？
