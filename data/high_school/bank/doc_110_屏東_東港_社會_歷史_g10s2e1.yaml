  stem: 儒家思想與漢字雖然是日本、朝鮮與越南的共同文化基礎，但在歷史變遷過程中，逐漸發展出屬於自己的文化特質： 資料一：長期以來，當地政府高官主要都是使用漢字與文言文，但卻聲稱「我國歷史是一部中國侵略史」，11世紀以後開始創造屬於自己的文字，二次大戰後全面推動羅馬拼音文字。現今城市裡雖然還留有孔廟與中文字跡，但人民已不識中文。
    資料二：人們對孔子非常尊崇，但在祭孔典禮時有的身穿明代儒服，有的身著當地古代服裝，有的身穿神道服裝，有的甚至直接穿現代禮服，可見這是一個文化包容性極強的國家。
    資料三：這是個民族性強悍的國家，雖然使用中國的漢字，但在15世紀創立一套本國語音文字系統。二次大戰後，為了脫離中國化的影響，開始實施「去漢字化」。 關於上述資料，下列哪些敘述是正確的？
  options:
  - label: A
    content: 資料一是越南
  - label: B
    content: 資料二是朝鮮
  - label: C
    content: 資料三是日本
  - label: D
    content: 資料一與資料三所述的國家至今仍在大多數場合使用中國文字
  - label: E
    content: 資料一與資料三所述的國家皆曾經是中國的藩屬國
