  group_stem: ◎董仲舒曾經有過以下的言論：「古者稅民不過什一，其求易共；使民不過三日，其力易足。民財內足以養老盡孝，外足以事上共稅，下足以畜妻子極愛，故民說從上。至秦則不然，用商鞅之法，改帝王之制，除井田，民得賣買，富者田連仟伯，貧者亡立錐之地。又顓川澤之利，管山林之饒，荒淫越制，踰侈以相高；邑有人君之尊，里有公侯之富，小民安得不困？」
