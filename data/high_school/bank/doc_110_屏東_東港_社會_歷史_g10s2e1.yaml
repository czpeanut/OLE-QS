- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 有學者認為某項稅制的推行是受限於戶籍散亂，舊有的賦稅制度難以推行的緣故，而新的稅制大量增加了稅收，採取貨幣計稅的方式有助於商業的推展，此一變革被視為從實物經濟趨向貨幣經濟的一大轉變。請問此一稅制最可能為何？
  options:
  - label: A
    content: 北魏的租庸調法
  - label: B
    content: 唐代的兩稅法
  - label: C
    content: 明代的一條鞭法
  - label: D
    content: 清代的攤丁入地
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 歷史老師上課時羅列了以下資料： 《漢書•高帝紀》：「呂后與審食其謀曰：『諸將故與帝為編戶民，北面為臣，心常鞅鞅(不愉快)。』」師古注曰：「編戶者，言列次名籍也。」
    《漢書•梅福傳》稱：「孔氏子孫，不免編戶。」師古注曰：「列為庶人也。」 《史記•平准書》：「齊民無蓋藏。」注引如淳說：「齊，等也，無有貴賤，謂之齊民，若今言平民矣。
    請問針對上述資料的內容，下列敘述何者正確？
  options:
  - label: A
    content: 以上資料的內容在於批評編戶齊民的施政
  - label: B
    content: 說明編戶齊民對人民一體對待的特色
  - label: C
    content: 齊民指賤民，意思是只有貧窮的百姓會被編納入戶
  - label: D
    content: 編戶齊民之下，人的獨特性喪失，因此容易逃避國家徵稅
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 小岳的課堂筆記寫著：「幕藩體制、參覲交代、庶民文化盛行、蘭學」等重點，請問這最有可能與哪一個時期的日本歷史有關？
  options:
  - label: A
    content: 鎌倉幕府
  - label: B
    content: 室町幕府
  - label: C
    content: 戰國時代
  - label: D
    content: 江戶幕府
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 新羅統一朝鮮半島後，便積極吸收中國文化，除派遣子弟至長安留學，其文字、曆法、律令制度、服飾等也盡循中國形式，因此被當時的中國皇帝稱讚為「君子國」。請問這位中國皇帝最可能是何人？
  options:
  - label: A
    content: 秦始皇
  - label: B
    content: 漢武帝
  - label: C
    content: 唐玄宗
  - label: D
    content: 宋太祖
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 有一史書上記載：「□□，總括一州之賦役，量地計丁，丁糧畢輪於官，一歲之役，官為僉募，力差則計其工食之貨，量為增減，銀差則計其交納之費，加以增枆。凡額辦、派辦、京庫歲需與存留供億諸費，以及土貢方物，悉併一條。皆計畝徵銀折辦於官，故謂之□□。」意即將各省的田賦、丁稅、徭役，以及各項雜稅，合併計算為一個總額，然後以該省的田畝總數平均攤分，歸納在田賦之中；其原則為「役歸於地」、「按畝徵收」。請問上文內容應是出自哪一史書的何種稅制？
  options:
  - label: A
    content: 《舊唐書•食貨志》的租庸調法
  - label: B
    content: 《新唐書•食貨志》的兩稅法
  - label: C
    content: 《宋史•食貨志》的青苗法
  - label: D
    content: 《明史•食貨志》的一條鞭法
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 歷史學者杜正勝指出：「國、邑、或」三個字都有□形，而□□形是中國早期國家形成的重要象徵，試問這個「□形」象徵什麼？
  options:
  - label: A
    content: 四合院：定居村落的建築形式
  - label: B
    content: 城牆：政治與軍事功能兼具的城邦
  - label: C
    content: 口發命令：氏族聯盟領袖
  - label: D
    content: 孔方兄：古代貨幣經濟
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 某地圖書館藏有一份手抄本，抄錄清乾隆皇帝登基前與父親雍正皇帝唱和的詩作。根據學者考證，清朝藩屬派遣使臣到北京覲見時，需與皇帝賦詩唱和，上述手抄本乃供使臣揣摩練習之用。這位使臣最可能來自：
  options:
  - label: A
    content: 日本
  - label: B
    content: 臺灣
  - label: C
    content: 暹邏
  - label: D
    content: 琉球
- id: doc_110_屏東_東港_社會_歷史_g10s2e1_s1_23
  section: 1
  number: 23
