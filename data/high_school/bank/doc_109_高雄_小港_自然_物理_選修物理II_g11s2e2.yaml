  section: 2
  number: 29
  type: multiple
  page: 3
  stem: 考慮一雨滴由高空墜落，在落地前一段時間，雨滴會等速墜落，可簡化為雨滴所受空氣阻力與重力達成平衡所致。假設當雨滴等速墜落時，雨滴只受重力mg與空氣阻力f作用。此二力對雨滴的作功分別為$W_{g}$、$W_{f}$，而雨滴和地球間的重力位能變化為ΔU，雨滴的動能變化為ΔK。則雨滴在等速墜落的過程中，下列敘述何者正確？
  options:
  - label: A
    content: $W_{g}$＝－ΔU
  - label: B
    content: $W_{g}$＋$W_{f}$＝0
  - label: C
    content: $W_{f}$＝ΔK
  - label: D
    content: $W_{g}$＝$W_{f}$
  - label: E
    content: 此過程雨滴與地球系統力學能守恆
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
