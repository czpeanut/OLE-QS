- id: doc_113_台中_興大附中_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 在△ABC 中，若∠A 與∠B 均為銳角，且 sinA＝$\frac{3}{5}$，sinB＝$\frac{7}{25}$，$\overline{AB}$＝4，則下列選項哪些正確？
  options:
  - label: A
    content: cosC＝$-\frac{3}{5}$
  - label: B
    content: cosC＝$\frac{4}{5}$
  - label: C
    content: △ABC 為銳角三角形
  - label: D
    content: $\overline{AC}$＞2
  - label: E
    content: △ABC 面積為$\frac{42}{25}$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '∵∠A，∠B 均為銳角

    ∴cosA＝$\frac{4}{5}$，cosB＝$\frac{24}{25}$

    (A)○：∵∠A＋∠B＋∠C＝π

    cosC＝－cos（A＋B）

    ＝－（cosAcosB－sinAsinB）

    ＝$- \left( \frac{4}{5}\times \frac{24}{25}-\frac{3}{5}\times \frac{7}{25} \right)$

    ＝$-\frac{75}{125}$＝$-\frac{3}{5}$

    (B)╳：同(A)

    (C)╳：∵cosC＜0

    ∴∠C＞90°$\Rightarrow$△ABC 為鈍角三角形

    (D)╳：承(A)，sinC＝$\frac{4}{5}$

    由正弦定理知

    $\frac{\overline{AC}}{\sin B}=\frac{\overline{AB}}{\sin C}\Rightarrow\frac{\overline{AC}}{\frac{7}{25}}=\frac{4}{\frac{4}{5}}$

    $\Rightarrow\frac{4}{5}\overline{AC} = 4\times \frac{7}{25}\Rightarrow\overline{AC} =\frac{7}{5}$＜2

    (E)○：△ABC 面積＝$\frac{1}{2}\times \overline{AB}\times \overline{AC}\times \sin A$＝$\frac{1}{2}\times 4\times \frac{7}{5}\times \frac{3}{5}$＝$\frac{42}{25}$

    故選(A)(E)'
