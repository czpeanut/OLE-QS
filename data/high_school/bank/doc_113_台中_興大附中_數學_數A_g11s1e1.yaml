- id: doc_113_台中_興大附中_數學_數A_g11s1e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 右圖為函數 y＝f（x）＝2 sin（bx－c）＋1 的部分圖形，其中實數 b＞0，0＜c＜$\frac{\pi}{2}$，且圖形上 A、B 兩點坐標分別為$\left( \frac{\pi}{6} , 1 \right)$與$\left( \frac{2\pi}{3} , 1 \right)$。Bao 上課說：「若將 y＝2 sinx＋1 圖形先經由水平伸縮$\frac{1}{b}$倍，再向右平移 h 單位後，就會和 y＝f（x）圖形重合。」但 Ting 因手機震動分神沒聽清楚，請幫他寫出數對（b，h）＝＿＿＿＿。
  assets:
  - key: s3_2_f1
    kind: figure
    file: doc_113_台中_興大附中_數學_數A_g11s1e1/s3_2_f1.png
    crop:
      page: 2
      rect:
      - 431.25
      - 730.95
      - 564.25
      - 820.1
  answer:
  - $\left( 2 , \frac{\pi}{6} \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{2\pi}{b}= 2\times \left( \frac{2\pi}{3}-\frac{\pi}{6} \right)\Rightarrow\frac{2\pi}{b}=\pi\Rightarrow$b＝2

    又$\left( \frac{\pi}{6} , 1 \right)$代入 y＝f（x）得$\sin \left( 2\times \frac{\pi}{6}-c \right)$＝0$\Rightarrow$c＝$\frac{\pi}{3}$

    $\Rightarrow$y＝f（x）＝$2\sin \left( 2x -\frac{\pi}{3} \right) + 1$＝$2\sin \left( 2 \left( x -\frac{\pi}{6} \right) \right) + 1$

    則 y＝2 sinx＋1 圖形先水平伸縮$\frac{1}{2}$倍，再向右平移$\frac{\pi}{6}$單位，就會和 y＝f（x）圖形重合

    故數對（b，h）＝$\left( 2 , \frac{\pi}{6} \right)$'
