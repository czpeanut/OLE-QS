  stem: 試問方程式$∣ \sin 2x ∣ =\frac{x}{2\pi}$有多少個實數解？
  options:
  - label: A
    content: 5 個
  - label: B
    content: 6 個
  - label: C
    content: 7 個
  - label: D
    content: 8 個
  - label: E
    content: 9 個
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_113_台中_興大附中_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列各選項中，哪一個值最大？
  options:
  - label: A
    content: sin1cos2－cos1sin2
  - label: B
    content: sin1＋cos1
  - label: C
    content: $\frac{\tan 1 +\tan 2}{1 -\tan 1\tan 2}$
  - label: D
    content: cos1cos2－sin1sin2
  - label: E
    content: 1－2 $sin^{2}$1
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) sin1cos2－cos1sin2＝sin（1－2）＝sin（－1）

    (B) sin1＋cos1＝$\sqrt{2} \left( \frac{\sqrt{2}}{2}\sin 1 +\frac{\sqrt{2}}{2}\cos 1 \right)$＝$\sqrt{2}\sin \left( 1 +\frac{\pi}{4} \right)$

    (C) $\frac{\tan 1 +\tan 2}{1 -\tan 1\tan 2}$＝tan（1＋2）＝tan3

    (D) cos1cos2－sin1sin2＝cos（1＋2）＝cos3

    (E) 1－2 $sin^{2}$1＝cos2

    又 1 弳$\approx$57°，2 弳$\approx$114°，3 弳$\approx$171°

    ∴(A)(C)(D)(E)均小於 0

    故選(B)'
