  explanation: '資料三中代表 1880 年代臺灣建省，臺北為臨時省會而有了新城牆與衙門，加以劉銘傳推行的自強新政產品—電燈，(A)為正解。海關與外國顧問為 1860 年代已有，街道出現的時間更早。

    44.3 則資料所提到的臺北為全臺第二大城，當時臺灣第一大城為南臺灣最早開發的城市，即今日臺南。

    45.日本明治維新後第一次海外出兵行動，為 1874 年的牡丹社事件，曾一度短暫占領南臺灣。

    46.牡丹社事件後，清廷意識到臺灣生番地的重要性而開始積極治臺；另一方面，雙方簽訂條約中有「保民義舉」一句，使日本宣稱清廷已承認日本擁有琉球的宗主權，並於 1879 年將之改名為沖繩縣，帶給清國政府的暗示是「清帝國已經失去其扮演東亞國際社會中心的角色地位」，從此埋下了日、清對立的宿怨關係。

    47.日軍在牡丹社事件中死亡人數多達 426 人，但戰死者僅 33 人，可見造成日軍死亡的主要原因是惡劣的環境條件與疾疫等，故而日治臺灣時的首要工作應是(B)推行公共衛生，改善生活環境。

    48.兩則資料皆與皇民化政策有關，開始時間約 1937 年，答案為(C)。

    49.1937 年時盧溝橋事變後，中日戰爭正式爆發。

    50.(A)(C)已行之有年，(B) 1941 年後初等學校改稱，3 者與了解日語人數突然大量增加無直接相關，因此最可能是總督府在 1943 年推行(D)義務教育，強迫入學的結果。'
