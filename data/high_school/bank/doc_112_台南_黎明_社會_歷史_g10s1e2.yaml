- id: doc_112_台南_黎明_社會_歷史_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 「政府統治方針本於『臺灣為帝國領土之一部』，我們應啟發臺人智能德操，使其感受朝廷一視同仁的美意，希望醇化臺人，使其與內地人融洽相處，進而使臺灣與內地無異。」請問上文最可能出自哪一位臺灣總督？
  options:
  - label: A
    content: 1895 年接收臺灣，鎮壓抗日的樺山資紀
  - label: B
    content: 1902 年肅清「臺地匪亂」的兒玉源太郎
  - label: C
    content: 1919 年結束軍事統治的文官總督田健治郎
  - label: D
    content: 1936 年推動臺灣進入戰時體制的小林躋造
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從「臺灣為帝國領土之一部」、「使臺灣與內地無異」，可判斷其統治方針為「內地延長主義」的同化政策，答案為(C) 1919 年的田健治郎。(A)(B)為特殊統治時期。(D)皇民化時期。
- id: doc_112_台南_黎明_社會_歷史_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 承上題，下列何者可視為此統治方針的體現？
  options:
  - label: A
    content: 《匪徒招降策》
  - label: B
    content: 《六三法》
  - label: C
    content: 《三一法》
  - label: D
    content: 《法三號》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(B)(C)為特殊統治時期的法令。(D)規定日本本土法律適用於臺灣，符合「內地延長主義」政策。

    16.1902 ～ 1933 年為日治時期，1902 ～ 1903 年乙占比約 99 ％，卻於 1912 ～ 1913 年後被甲取代，剩下不到 20 ％，之後比例更少，選項中較符合此一趨勢者為(B)新式糖廠、舊式糖廍。(A)應是在 1860 年代已出現明顯消長。(C)(D) 1902 ～ 1903 年時，臺灣的傳統私塾或是蕃人部落的比例，不可能如此高。

    17.資料一認為劃地分防造成「各使意氣、不相支援」而失敗，資料二說明臺灣民主國兵力組成分子來自各省而難以指揮，兵員多臨時招募而訓練不足，各省兵勇彼此衝突，也與臺灣土勇不合。綜合兩者，臺灣民主國失敗的主因為(D)無法統合。

    18.從「應自內地大舉移民開發富源」一句，可知日本人大量移民臺灣的主要目的是(A)殖產興利。

    19.福澤諭吉認為「自蠻民手中褫奪野蠻事業」再交由日本人「文明」經營，即可有驚人獲利，選項中僅鐵路為日本占領之前臺灣已有的建設，答案為(B)。

    20.附圖顯示臺灣文化協會舉辦演講活動時，受到警察的監控，(A)(B)(D)皆為正確的解讀。(C) 1927 年改組後，連溫卿等人改走激進路線，稱為「新文協」。

    21.1935 年的電力總產能較之前倍增，與日月潭水力發電廠完工有關，此乃配合(B)南進政策，經濟政策改為「農業南洋，工業臺灣」後，為發展臺灣工業需求而規劃的建設。

    22.題文說明清代前期設置的隘勇制度，經劉銘傳改革後形成隘勇線，再被日本人沿用修正以對付高山族，因此(C)較符合題文主旨。

    23.日治初期的隘勇線，原只是與原住民居住的山地區域或附近山腰做一明顯界線切割，但在(B)佐久間左馬太總督時進行「五年理蕃計畫」，以軍隊將隘勇線推進，對原住民施以鎮壓。

    24.圖中顯示臺灣南北各開放一通商口岸，其導因事件為(A)英法聯軍後，簽訂《天津條約》、《北京條約》的規定。

    25.甲強調臺灣是四省之要害，絕不可棄，是為施琅對康熙之議；乙強調「外患暫平」，不可輕忽臺灣，故為沈葆楨建議積極治臺；丙欲使臺地之財足供臺地之用，應為劉銘傳，(A)為正解。

    26.從「大明慈悲國」、「倭賊到臺二十有年已滿」，可推知此民變為 1915 年噍吧哖事件，(A)(B)(D)皆為正確的敘述，僅(C)須修正，統治者動用毒氣進行鎮壓的是 1930 年霧社事件。

    27.1920 年代，(D)蓬萊米研發成功後，由於獲利較高而使農民搶種，因此形成「米糖相剋」。(A) 1930 年才完工，(B)(C)與糖業發展有關，和農民搶種稻米無關。

    28.(A)清領時期水圳多位於中北部，因此水田也多集中在北部，是為正解。(B)修築水圳可減少看天田，提高農業產量。(C)南部發展糖業與原料取得有關，非勞動力。(D)稻米產地與運輸成本無關。

    29.(D) 1923 年爆發「治警事件」，蔣渭水、蔡培火等多名菁英被逮判刑，自然使欲響應者有所忌憚。

    30.請願運動的內容，要求在臺灣設立具備立法與預算審查權的議會，目標使殖民地能自治，答案為(B)。

    31.1930 年代，日本軍國主義高漲，政府當局對人民集會、結社與言論管控更趨嚴格，因此請願運動難以持續，(C)為正解。(A)(B)(D)並無此事。

    32.臺灣人想要設置議會以自治，儘管多次請願，但(A)日本政府持反對態度，加以中日局勢逐漸緊張，遭總督府打壓而被迫停止。

    33.(B)資料二提到少部分成績很差的日本學生，無法進入一中就到二中，而這是臺灣學生絕不可能的待遇。

    34.甲族群人數最多，應為臺灣人；乙族群人數最少，可能為外國人；丙族群的人數不多，且一直維持穩定數字，故為原住民；丁族群的人數在 1920 年代後有明顯成長趨勢，應該是日本人。正確答案為(D)。

    35.日治時期被稱為「大人」，對百姓的生活處處都管，能掌握百姓的生殺大權者為(C)警察。(A)為臺灣最高統治者，不會直接管理百姓。(B)(D)為臺灣人，雖是警察的協力者，但不致於掌握百姓的生殺大權。

    36.從「臺灣省」可判知此時為劉銘傳來臺後，(B)為正解。(A)臺灣開港後，馬雅各於 1865 年成立的看西街醫館。(C)(D)日治時期的建設成果。

    37.圖左的臺灣設有 2 個府，圖右的臺灣出現 3 個府，顯示已經建省，可推知此時已經過(C)清法戰爭。

    38.從「國民學校」、朝會升旗唱歌頌日本皇室的國歌等，即可判斷為皇民化運動時期的情景，由於國民學校乃於 1941 年後的初等教育名稱，加上讓臺灣人唱〈隨軍征海歌〉，可見此時應在太平洋戰爭之後，總督府開始徵召臺人從軍，答案應選(D) 1940 年代。

    39.(A) 1920 年代尚為「農業臺灣，工業日本」時期，工業產品應來自日本。

    40.(A)這場選舉在 1935 年舉行，非 1920 年代。'
