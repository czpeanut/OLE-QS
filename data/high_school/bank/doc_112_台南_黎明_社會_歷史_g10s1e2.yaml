    資料三：日治初期，以公學校推廣日語的成效有限，1910 年起，政府鼓勵各地社會領導階層組織國語普及會，以民間團體推廣日語。皇民化時期，總督府大量增設「國語講習所」，1937 年全面禁止報紙的漢文版及學校的漢文課，透過對本土語言的壓制，扭轉殖民地人民的身分及國家認同。到了 1943 年，臺灣人已有 80 ％是所謂的「國語解者」。政策看似頗具成效，但臺人始終未澈底放棄臺語，日語無法成為社會的生活語言。無可否認的是，日語是當代臺灣人吸收現代知識的主要工具。'
  shared_asset: g2_48_50
  answer:
  - 中日戰爭
