- id: doc_109_台中_立人_數學_數A_g11s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 關於向量概念，下列敘述何者正確？
  options:
  - label: A
    content: 若$\vec{a} \cdot \vec{b}=0$，則$\vec{a}$，$\vec{b}$至少有一為$\vec{0}$
  - label: B
    content: 若 $|\vec{a}|=|\vec{b}|$，則$\vec{a}=\vec{b}$或$\vec{a}=-\vec{b}$
  - label: C
    content: $\vec{a}$，$\vec{b}$兩者均非$\vec{0}$，也不平行，則同一平面的任何向量$\vec{c}$均可化成$\vec{a}$，$\vec{b}$的線性組合，即$\vec{c}=x\vec{a}+y\vec{b}$，x，y 為實數
  - label: D
    content: $|\vec{a} \cdot \vec{b}|=|\vec{a}||\vec{b}|$
  - label: E
    content: $|\vec{a}|+|\vec{b}|\geq |\vec{a} +\vec{b}|$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵$\vec{a} \cdot \vec{b}=|\vec{a}| \cdot |\vec{b}| \cdot \cos \theta = 0$

    ∴$|\vec{a}|= 0$ 或 $|\vec{b}|= 0$ 或 cosθ＝0

    ∴$\vec{a}= \vec{0}$或$\vec{b}= \vec{0}$或$\vec{a}$⊥$\vec{b}$

    (B) ╳：∵$|\vec{a}|=|\vec{b}|$ ∴$\vec{a}$，$\vec{b}$的長度相等，與$\vec{a}$，$\vec{b}$之間的方向無關

    (C) ○：∵$\vec{a}\neq \vec{0}$，$\vec{b}\neq \vec{0}$，且$\vec{a}//\vec{b}\$

    ∴$x\vec{a}+y\vec{b}$可以表示成同一平面上的任何向量，即任何同一平面上的向量$\vec{c}$均可用$x\vec{a}+y\vec{b}$表示，且（x，y）恰有一解

    (D) ╳：∵$|\vec{a} \cdot \vec{b}|=| |\vec{a}| \times |\vec{b}| \times \cos \theta |$＝$|\vec{a}|\times |\vec{b}| \times | \cos \theta |$

    (E) ○：設$\vec{a}$，$\vec{b}$之夾角為θ

    ∵$(|\vec{a}|+|\vec{b}|)^{2}-|\vec{a}+\vec{b}|^{2}$

    ＝$|\vec{a}|^{2}+2 |\vec{a}|\times |\vec{b}|+|\vec{b}|^{2}-(\vec{a}+\vec{b})\cdot (\vec{a}+\vec{b})$

    ＝$|\vec{a}|^{2}+2 |\vec{a}|\times |\vec{b}|+|\vec{b}|^{2}-(|\vec{a}|^{2}+2\vec{a} \cdot \vec{b}+|\vec{b}|^{2})$

    ＝$2 |\vec{a}|\times |\vec{b}|-2|\vec{a}|\times |\vec{b}|\times \cos \theta$

    ＝$2|\vec{a}|\times |\vec{b}| \times (1-\cos \theta )$ ≥ 0

    ∴$(|\vec{a}|+|\vec{b}|)^{2}\geq |\vec{a}+\vec{b}|^{2}$

    又$|\vec{a}|+|\vec{b}|\geq 0$ 且$|\vec{a}+\vec{b}|\geq 0$

    ∴$|\vec{a}|+|\vec{b}|\geq |\vec{a} +\vec{b}|$

    故選(C)(E)'
