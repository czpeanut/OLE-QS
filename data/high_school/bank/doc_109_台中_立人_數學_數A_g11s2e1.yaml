- id: doc_109_台中_立人_數學_數A_g11s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 關於空間概念，下列敘述何者正確？
  options:
  - label: A
    content: 垂直同一直線的兩相異直線必互相平行
  - label: B
    content: 垂直同一平面的兩相異直線必互相平行
  - label: C
    content: 平行同一直線的兩相異直線必互相平行
  - label: D
    content: 平行同一平面的兩相異直線必互相平行
  - label: E
    content: 平行同一直線的兩相異平面必互相平行
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：垂直同一直線的兩相異直線可能平行或歪斜

    (B) ○：若$\vec{L_{1}}$⊥E，$\vec{L_{2}}$⊥E，則$\vec{L_{1}}$，$\vec{L_{2}}$為 E 之法向量 ∵$L_{1}$≠$L_{2}$ ∴$L_{1}$ // $L_{2}$

    (C) ○：若 $L_{1}$ // L，則 $L_{1}$，L 共平面，又 $L_{2}$ // L，則 $L_{2}$，L 共平面

    ∴$L_{1}$，L，$L_{2}$ 共平面或 $L_{1}$，L，$L_{2}$ 為兩兩平面的交線，即三平面形成三角柱 ∴$L_{1}$ // $L_{2}$

    (D) ╳：平行同一平面的兩相異直線可能平行或相交一點或歪斜

    (E) ╳：平行同一直線的兩相異平面可能平行或相交成一直線

    故選(B)(C)'
