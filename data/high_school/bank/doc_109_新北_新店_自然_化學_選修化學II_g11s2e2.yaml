  page: 3
  stem: '秒錶反應或稱碘鐘反應，為探究反應速率的經典實驗。其實驗操作如下： （$Na_{2}S_{2}O_{5}$＝190；$KIO_{3}$＝214）

    【步驟1】取0.428 g $KIO_{3}$加蒸餾水配成100 mL之溶液（標示為溶液A）。 另取0.190 g $Na_{2}S_{2}O_{5}$、0.5 mL 0.10 M $H_{2}SO_{4(aq)}$及0.40克澱粉加蒸餾水配成100 mL之溶液（標示為溶液B）

    【步驟2】依附表的成分混合，並記錄溶液由無色變為藍色所需的時間，實驗結果數據如附表：

    根據上述實驗數據回答下列問題： (1) 寫出$Na_{2}S_{2}O_{5}$固體與水反應之反應式。 (2) 計算在【步驟2】甲試管中$HSO_{3}^{－}$的消失速率為何？ (3) 在測量反應速率的秒錶反應實驗中，準備的兩個反應溶液如下：下列敘述，哪些正確？ 溶液A：碘酸鉀（$KIO_{3}$） 溶液B：亞硫酸氫鈉（$NaHSO_{3}$）、硫酸、澱粉，實驗中相關的離子反應式如下： $IO_{3}^{－}$(aq)＋$3HSO_{3}^{－}$(aq) → $I^{－}$(aq)＋$3SO_{4}^{2－}$(aq)＋$3H^{＋}$(aq) 式(1) $IO_{3}^{－}$(aq)＋$5I^{－}$(aq)＋$6H^{＋}$(aq) → $3I_{2}$(s)＋$3H_{2}$O(l) 式(2) $I_{2}$(s)＋$HSO_{3}^{－}$(aq)＋$H_{2}$O(l) → $2I^{－}$(aq)＋$SO_{4}^{2－}$(aq)＋$3H^{＋}$(aq) 式(3)'
  options:
  - label: A
    content: 當溶液A與溶液B混合時，要盡量避免搖晃混合溶液，以免干擾反應速率的測量
  - label: B
    content: 本實驗所測量的是亞硫酸氫根離子之消耗速率
  - label: C
    content: 當溶液A與溶液B混合後，碘酸鉀的濃度恰好等於亞硫酸氫鈉濃度的三分之一時，就可觀察到溶液的變色， 其他比例則否
