  type: single
  page: 3
  stem: 自 2002 年以來，消費者的行為因疫情而逐漸產生變化，線上購物逐漸普及化，Y 世代（25 ～ 39 歲）月平均消費金額為 3,801 元，56 歲以上民眾購買力也不低，月平均消費金額為 3,512 元；網購盛行也產生許多消費爭議。針對網購，目前我國相關的法律規範為何？
  options:
  - label: A
    content: 消費者在退貨時，須說明理由並負擔退貨的運費
  - label: B
    content: 消費者在收受商品 7 日內，皆可無條件解約並退回產品，不限商品種類
  - label: C
    content: 在向網購業者下單前，消費者擁有 30 日以內的契約審閱期
  - label: D
    content: 私人內衣褲、生鮮食品並不享有 7 日猶豫期
  answer:
