- id: doc_111_台中_台中二中_社會_公民與社會_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 某知名網路百貨把原價 2,580 元的長褲，錯標成 1 元，致使一名消費者誤認為促銷活動，立即購買 2 件長褲，並線上刷卡付費。事後，業者坦承標價錯誤，片面解除該訂單並拒絕出貨，讓消費者直呼不合理。消保官表示，此案消費者非惡意大量訂購，業者應依約出貨。關於消費者透過網際網路購買商品的行為，下列敘述何者正確？
  options:
  - label: A
    content: 屬於新型態的買賣行為，受《公平交易法》的保障
  - label: B
    content: 屬於消費者未能檢視商品而與商家所為之訪問交易
  - label: C
    content: 消費者不滿意該商品，可於收受商品後 7 日內退還
  - label: D
    content: 若消費者不滿意商品欲退貨，須說明理由並付郵資
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為通訊交易，屬《消費者保護法》規定特種交易，消費者有 7 日猶豫期，可於 7 日內無條件退貨，無須說明理由或付郵資，故(C)正確。
  tags:
