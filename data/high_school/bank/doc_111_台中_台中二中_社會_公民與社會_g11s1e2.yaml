  section: 3
  number: 45
  type: multiple
  page: 8
  stem: 臺北市中山區的行天宮是全臺數一數二香客絡繹不絕的聖地，但是香客參拜之後焚燒的金紙儼然成為了附近居民的惡夢，因此行天宮成為全臺第一個率先禁香的廟宇，除去大香爐及供桌，鼓勵信眾以「道德心香」代替香線，以「虔誠心」代替供品。下列哪些觀點符合上述意旨並期望降低爭議？
  options:
  - label: A
    content: 臺北市政府提供補助金額給龍山寺，以空調過濾系統優化周遭空氣品質並降低香爐數量
  - label: B
    content: 臺北市政府介入行天宮禁焚香燒紙的規範，以降低廟宇的內部成本
  - label: C
    content: 臺北市對行天宮課徵空氣乾淨稅，依據香客數量來決定稅額高低
  - label: D
    content: 將空氣乾淨權設定給行天宮或居民，由雙方協商爭議處理方式
  - label: E
    content: 臺北市政府對前往參拜的香客課徵定額稅率並以其他建設回饋附近居民，此舉提高附近居民的外部成本
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)臺北市政府提供補助，可以產生外部效益；(C)臺北市若依據香客數量來決定稅額高低，是一種使用者付費的做法；(D)將空氣乾淨權設定給行天宮或居民，屬產權的界定，可以降低雙方協商的交易成本，故(A)(C)(D)正確。(B)臺北市政府介入行天宮禁焚香燒紙的規範，以降低廟宇的內部成本。(E)回饋附近居民，可降低外部成本。
