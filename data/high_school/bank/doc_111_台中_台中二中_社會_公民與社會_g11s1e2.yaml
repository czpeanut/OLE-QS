  stem: 小吳逛街發現櫥窗裡有個看對眼的公仔，馬上拿到櫃臺結帳，店長讓其檢查確認後，就用原本的盒子包裝好，並交給小吳。但小吳回家後發現朋友寄來一個一模一樣的公仔，於是隔天帶著未拆封的公仔到購買的那間店辦理退貨，並要求退回所付金額。店長告訴小吳，櫃臺貼著「本店小本經營，商品一經售出，概不退換」告示，因此不願意退錢。請問從《民法》及《消費者保護法》審視，商品一經售出，概不退換」告示，因此不願意退錢。請問：從《民法》及《消費者保護法》審視，下列有關小吳及店長主張的敘述，哪一項最合理？
  options:
  - label: A
    content: 小吳沒有打開公仔包裝，店長應該同意讓小吳無條件退貨
  - label: B
    content: 小吳在購買後 7 天內就拿回店面，店長應該讓小吳退貨
  - label: C
    content: 小吳應該在購買超過 7 天後，再拿回店面跟店家要求退貨
  - label: D
    content: 小吳購買的公仔除非有瑕疵，店長才有義務同意退貨
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 在實體商店購買東西，不屬於《消費者保護法》的特種買賣，消費者沒有 7 日猶豫期。因此，除非依《民法》買賣規定，商品有瑕疵時，消費者可以求店家負起責任，故選(D)。
