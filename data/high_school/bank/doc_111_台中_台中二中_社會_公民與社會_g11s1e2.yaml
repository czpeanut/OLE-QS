- id: doc_111_台中_台中二中_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '小安研究某國財產制度，蒐集該國某年遺產繼承統計資料（附表）。她推論造成男女數據差異的成因，除與該國傳統社會觀念有關，與其民法繼承法律的規定亦有關聯。下列該國繼承制度所採取的原理原則，何者與表中數據所呈現之性別差異最為相關？

    | 所有法定繼承人之性別比 |  | 法定繼承人中實際取得遺產者之性別比 |  |

    | --- | --- | --- | --- |

    | 男 | 女 | 男 | 女 |

    | 64 ％ | 30 ％ | 72 ％ | 28 ％ |'
  options:
  - label: A
    content: 民法繼承法律在繼承權利方面採取性別平權的原則
  - label: B
    content: 准許被繼承人在生前以遺囑自由處置一定範圍財產
  - label: C
    content: 以特定親屬繼承為原則，並以配偶為當然的繼承人
  - label: D
    content: 繼承人償還被繼承人的債務，以繼承所得遺產為限
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由於法律准許被繼承人在生前以遺囑自由處置一定範圍財產，因此可能指定的繼承人多為男性，故(B)正確。(A)民法繼承條文規範在繼承權利方面採取性別平權的原則，但表中呈現卻是實際上男女繼承比例不同，故可知法律規定不是關鍵因素。(C)法定繼承人是男女平等的，應不致造成表中現象。(D)為限定繼承原則，與表中現象無關。
