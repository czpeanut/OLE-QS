  page: 1
  stem: 如果夫妻認為法定財產制不符合雙方的需求，夫妻於結婚前後，也可以書面契約的方式約定雙方間的財產關係，稱為「約定財產制」。下列關於約定財產制的說明，何者正確？
  options:
  - label: A
    content: 此約定只要經過書面簽約，手續就已完備，不需經法院
  - label: B
    content: 約定「共同財產制」是指夫妻各自的財產及所得，包括特有財產，皆合併為雙方共有，共同管理
  - label: C
    content: 約定「分別財產制」是指不分婚前或婚後，夫妻各自保有其財產的所有權，彼此互不干涉
  - label: D
    content: 約定一經成立，夫妻就必須秉持誠信執行，不能更改
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)約定財產制除了書面簽約，還要去法院登記。(B)特有財產不在「共同財產制」的共同財產範圍內。(D)財產制約定成立後，夫妻雙方同意仍能更改。
