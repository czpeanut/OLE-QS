- id: doc_111_台中_台中二中_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在現代社會中大量充斥著各種「定型化契約」，因而可以更有效率地達成交易。對於此種契約的敘述，以下何者<u>有誤</u>？
  options:
  - label: A
    content: 《公平交易法》規定此類契約之訂立應本平等互惠之原則
  - label: B
    content: 此類契約如有疑義時應為「有利於消費者」之解釋
  - label: C
    content: 此類契約之訂定應給消費者 30 日以內之審閱期間
  - label: D
    content: 此類契約若違反誠信原則而對消費者顯失公平者，無效
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「定型化契約」為《消費者保護法》的規範，故(A)錯誤。
