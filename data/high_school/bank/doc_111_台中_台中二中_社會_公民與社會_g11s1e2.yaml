  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)(D)《消費者保護法》規定特種交易，消費者有 7 日猶豫期，故(D)正確。(A)消費者在退貨時，不須要說明理由，也不用負擔退貨的運費
