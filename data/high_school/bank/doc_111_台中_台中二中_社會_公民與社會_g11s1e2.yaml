  stem: 新聞報導指出，2022 年基本工資再調漲，月薪從 2021 年的 24,000 元，調漲至 25,250 元；時薪則從 160 元調高至 168 元。關於《勞動基準法》中工資與基本工資之規定，下列何者正確？
