  section: 1
  number: 9
  type: single
  page: 3
  stem: 現代社會的商業行為興盛，各種形式的買賣、交易層出不窮，為了能夠快速達成交易，各行各業紛紛制定「定型化契約」來節省交易時間。下列關於定型化契約的敘述何者正確？
  options:
  - label: A
    content: 網拍業者在網頁上註明「本公司保留是否出貨的權利」，是一種定型化契約
  - label: B
    content: 定型化契約是一種由業者單方所擬定，提供給特定消費者簽訂的契約
  - label: C
    content: 《消費者保護法》規定，消費者在簽訂定型化契約前，可要求以審閱期換取優惠
  - label: D
    content: 若買賣雙方因定型化契約而產生消費爭議，法律應優先保護業者的權益
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「定型化契約」不以書面紙本為限，廣告、看版等都算，故(A)正確。(B)定型化契約是一種由業者單方所擬定，但非只供特定消費者簽訂的契約。(C)審閱期是《消費者保護法》對定型化契約的強制規定，消費者不可以用審閱期換取優惠。(D)若買賣雙方因定型化契約爭議，法律應做有利消費者的解釋。
  tags:
