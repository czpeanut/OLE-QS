  stem: 所有權是指權利人（所有權人）原則上可以自由的使用、收益、處分自己的東西（標的物），並且排除他人干涉的權利。日常生活中，可透過買賣或贈與取得所有權，下列關於所有權的轉移說明，何者正確？
  options:
  - label: A
    content: 契約簽訂後，立刻擁有所有權，可自由處分該標的物
  - label: B
    content: 阿偉承諾要送小婷手機作為生日禮物，小婷立即取得手機的所有權
  - label: C
    content: 不論贈與或買賣動產，都還要加上「交付」才會轉移所有權
  - label: D
    content: 不動產的交易只要付款完畢，就能取得所有權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)動產交易須交付才完成所有權的移轉，故(C)正確。(B)阿偉要把手機交給小婷，小婷才得到手機的所有權。
