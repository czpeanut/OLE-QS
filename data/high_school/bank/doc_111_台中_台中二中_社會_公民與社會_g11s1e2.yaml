  stem: 根據《勞動基準法》，工資由勞雇雙方議定之，但不得低於法定基本工資。關於《勞動基準法》的規定，是對於以下《民法》中何種原則的限制？
  options:
  - label: A
    content: 誠信原則
  - label: B
    content: 契約自由
  - label: C
    content: 過失責任
