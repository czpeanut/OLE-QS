- id: doc_110_桃園_武陵_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: calc
  page: 1
  stem: '■在平面幾何中，任意給定一個三角形，它的重心（三中線交點）、外心（三邊中垂線交點）與垂心（三邊高或高的延長線交點）都會落在同一條直線上，這條直線就稱為此三角形的「尤拉線」。現在我們給定一個三角形，讓同學來驗證此事。

    設 A（－4，1）、B（4，5）、C（5，－2）為坐標平面上三點，試回答下列問題：

    (1)求△ABC 的重心坐標。（2 分）

    (2)求△ABC 的外心坐標。（6 分）

    (3)求△ABC 的垂心坐標。（6 分）

    (4)證明此△ABC 的重心、外心及垂心在同一條直線上。（3 分）'
  explanation: '設 L 之 x 截距為 a，y 截距為 b，其中 a，b＞0 ⇒ L：$\frac{x}{a}+\frac{y}{b}$＝1

    又 L 通過（2，3）得$\frac{2}{a}+\frac{3}{b}$＝1

    由$\frac{1}{2}ab$＝16 ⇒ ab＝32 ⇒ b＝$\frac{32}{a}$

    將 b＝$\frac{32}{a}$代入$\frac{2}{a}+\frac{3}{b}$＝1 ⇒$\frac{2}{a}+\frac{3}{32}a$＝1 ⇒ $3a^{2}$－32a＋64＝0

    ⇒（3a－8）（a－8）＝0 ⇒ a＝$\frac{8}{3}$或 8 ⇒ b＝12 或 4

    故直線 L 的方程式為$\frac{3x}{8}+\frac{y}{12}$＝1 或$\frac{x}{8}+\frac{y}{4}$＝1'
