  explanation: '(A) log248＝log2.48×$10^{2}$＝2＋log2.48

    尾數為 log2.48

    (B) log284＝log2.84×$10^{2}$＝2＋log2.84

    尾數為 log2.84

    (C)$\log \frac{1}{248}$＝－log2.48×$10^{2}$＝－（2＋log2.48）＝－3＋（1－log2.48）

    尾數為 1－log2.48

    (D) log24800000＝log2.48×$10^{7}$＝7＋log2.48

    尾數為 log2.48

    (E)$2 + \log \frac{62}{25}$＝2＋log2.48

    尾數為 log2.48

    因此，尾數相同的選項有(A)(D)(E)，故選(A)(D)(E)'
