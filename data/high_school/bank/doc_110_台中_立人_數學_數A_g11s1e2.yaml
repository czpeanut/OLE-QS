- id: doc_110_台中_立人_數學_數A_g11s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 測量聲音大小的分貝（d）與聲音強度（I）有下列關係式：d（I）＝$10 \times \log \frac{I}{I_{0}}$，其中 $I_{0}$＝$10^{－12}$（瓦特／平方公尺）為人類能聽到的最低聲音強度。如果一般人的交談音量約為 60 分貝，請選出正確的選項：（已知 log2$\approx$0.3010）
  options:
  - label: A
    content: 分貝增加 10 時，聲音強度增加為原來的 10 倍
  - label: B
    content: 分貝增加 100 時，聲音強度增加為原來的 100 倍
  - label: C
    content: 處於聲音強度 I＝2×$10^{－5}$（瓦特／平方公尺）的立人高中教室，其聲音介於 75 到 80 分貝
  - label: D
    content: 跨年演唱會中測得聲音約為 120 分貝，此跨年演唱會聲音強度是一般人交談聲音強度的 $10^{6}$ 倍
  - label: E
    content: 當 100 個人同時以一般人的交談音量發聲時，被測得的聲音約為 100 分貝（設 n 個人的聲音強度是一個人的 n 倍）
  explanation: '(A)○：$\begin{cases}d(I) = 10 \times \log \frac{I}{I_{0}} \ldots \ldots ① \\ d(I'') = 10 \times \log \frac{I''}{I_{0}}\ldots \ldots ②\end{cases}$

    由②－①得 d（I''）－d（I）＝$10 \times \log \frac{I''}{I_{0}} - 10 \times \log \frac{I}{I_{0}}$

    $\Rightarrow$10＝$10\left( \log \frac{I''}{I_{0}} - \log \frac{I}{I_{0}} \right)$

    $\Rightarrow$1＝$\log \left( \frac{I''}{I_{0}} \times \frac{I_{0}}{I} \right)$＝$\log \frac{I''}{I}$

    $\Rightarrow\frac{I''}{I}$＝$10^{1}$＝10（倍）

    (B)╳：$\begin{cases}d(I) = 10 \times \log \frac{I}{I_{0}} \ldots \ldots ① \\ d(I'') = 10 \times \log \frac{I''}{I_{0}}\ldots \ldots ②\end{cases}$

    由②－①得 d（I''）－d（I）＝$10 \times \log \frac{I''}{I_{0}} - 10 \times \log \frac{I}{I_{0}}$

    $\Rightarrow$100＝$10\left( \log \frac{I''}{I_{0}} - \log \frac{I}{I_{0}} \right)$

    $\Rightarrow$10＝$\log \left( \frac{I''}{I_{0}} \times \frac{I_{0}}{I} \right)$＝$\log \frac{I''}{I}$

    $\Rightarrow\frac{I''}{I}$＝$10^{10}$（倍）

    (C)╳：d（I）＝$10 \times \log \frac{2 \times 10^{- 5}}{10^{- 12}}$

    ＝10×log（2×$10^{7}$）

    ＝10（log2＋$log10^{7}$）$\approx$10×（0.3010＋7）

    ＝10×7.301

    ＝73.01（分貝）

    (D)○：$\begin{cases}60 = 10 \times \log \frac{I}{I_{0}} \ldots \ldots ① \\ 120 = 10 \times \log \frac{I''}{I_{0}}\ldots \ldots ②\end{cases}$

    由②－①得 60＝$10 \times \log \frac{I''}{I_{0}} - 10 \times \log \frac{I}{I_{0}}$＝$10\left( \log \frac{I''}{I_{0}} - \log \frac{I}{I_{0}} \right)$

    $\Rightarrow$6＝$\log \frac{I''}{I_{0}} - \log \frac{I}{I_{0}}$＝$\log \left( \frac{I''}{I_{0}} \times \frac{I_{0}}{I} \right)$＝$\log \frac{I''}{I}$

    $\Rightarrow\frac{I''}{I}$＝$10^{6}$（倍）

    (E)╳：d（100I）＝$10 \times \log \frac{100I}{I_{0}}$

    ＝$10\left( \log 100 + \log \frac{I}{I_{0}} \right)$

    ＝$10\left( 2 + \log \frac{I}{I_{0}} \right)$

    ＝$20 + 10 \times \log \frac{I}{I_{0}}$

    ＝20＋60＝80（分貝）

    故選(A)(D)'
