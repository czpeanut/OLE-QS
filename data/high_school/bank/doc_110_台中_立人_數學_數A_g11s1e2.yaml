- id: doc_110_台中_立人_數學_數A_g11s1e2_s3_3
  section: 3
  number: 3
  type: calc
  page: 2
  stem: 心理學家常用數學模型 $L(t) = a(1 - 10^{-bt})$ 來描述學生經過 $t$ 週的學習之後所得的成果，其中常數 $a$、$b$ 會與學生及學習的科目有關。若大雄一週可以背熟 $100$ 個英文單字，兩週可以背熟 $199$ 個英文單字，則 $a$ 的值為何？（5 分）
  tags:
    unit:
      code: MA-A3-2-1
      book: 數學3A
      chapter: 指數與對數函數
      title: 指數函數
      std: true
    textbook: 數學3A 指數函數
    pattern:
      key: MA-A3-2-1:T05
      name: 指數成長衰減與生活建模
    labeled_by: agent
    label_confidence: high
    label_note: group_stem為前題「《老師，你會不會回來？》」題幹，與本題學習曲線模型無關
    fixed_by: agent
    fix_note: （人工修正：移除誤植的前題 group_stem 並補齊答案與解析）
  difficulty: 3
  explanation: 依題意 $a(1-10^{-b}) = 100$ 且 $a(1-10^{-2b}) = 199$。兩式相除得 $1 + 10^{-b} = 1.99 \Rightarrow 10^{-b} = 0.99$，代回第一式得 $a(1 - 0.99) = 100 \Rightarrow a = 10000$。
  answer_status: ai_generated
  answer_source: agent
  answer:
  - '10000'
