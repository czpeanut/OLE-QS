  group_stem: '穆罕默德12歲時隨叔父到不同地方經商，曾遠赴敘利亞、巴勒斯坦等地；25歲時，受麥加遺孀僱用，並與之結婚。因為四處經商之故，他看見並接觸了許許多多的文化，形成之後創立宗教的背源。 伊斯蘭史家曾經這樣描述穆罕默德的經歷：有一次洪水爆發，摧毀了天房，當地各氏族首領爭相要將巨大的黑石放回，最終是透過穆罕默德建議，讓所有首領合力將石頭重新安置回原處，此事件令穆罕默德受到當地的尊崇。

    穆罕默德40歲時，在山洞冥思。有次感應到天使傳來的訊息，宣稱他是真主揀選的使者與最後先知，不識字的他在天使的引領下，誦讀出伊斯蘭最重要的經典。他將這件事告知擔任基督僧侶的妻子堂兄，妻子堂兄同樣相信穆罕默德就是耶穌預言的先知。

    613年開始，穆罕默德展開傳道，但當地人多嗤之以鼻，僅有少數人成為追隨者，像是弱勢且未能獲得保護的外邦人士。不過，随著穆斯林人數的增加，穆罕默德的宣教事業讓當地權貴們感受到統治面臨威脅，他們試圖以利益與名望，甚至暗殺的方式，想讓穆罕默德放棄傳教工作，然而都失敗了。於是他們將迫害的對象轉向穆斯林。在615年、622年，穆罕默德曾多次帶領穆斯林信眾離開創教地，遠赴其他地方躲避迫害。歷經在外多年的宣教事業後，最後穆罕默德成功返回出生地、創教地，並成功改變了當地的宗教信仰。'
