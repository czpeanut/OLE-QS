  group_stem: '資料一：荷馬在《伊里亞德》中把阿瑞斯(希臘神話的戰神)說成是英雄時代的一名好戰的武士。他肝火旺盛，尚武好門，一聽到戰鼓聲就手舞足蹈，一聞到血腥味就心醉神迷。戕戮撕殺是他的家常便飯。哪裡有鏖戰，他就立即衝向那裡，不問青紅皂白就砍殺起來。

    資料二：西元前2世纪，大加圖曾說：「好好飼養你的牲畜，每年要向瑪爾斯‧西爾瓦諾斯奉獻。」後來，隨著羅馬帝國的擴張，瑪爾斯成為了戰爭的象徵(羅馬神話的戰神)。瑪爾斯同時也被認為是羅馬城建造者羅穆盧斯的父親，因此他也是羅馬人的祖先。'
