questions:
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 周代的哪一種制度，在諸侯覲見、天子宴會、諸侯互見、大夫出使他國及鄉大夫宴飲長老賢者等用以調整內部各種關係時，都缺不了它？
  options:
  - label: A
    content: 禮樂制度
  - label: B
    content: 宗法制度
  - label: C
    content: 封建制度
  - label: D
    content: 井田制度
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 韓國歷史上的朝鮮王朝，建立於十四世紀後期，延續至二十世紀初，約為中國的明清時代。關於朝鮮王朝的歷史特點，請問下列說明何者正確？
  options:
  - label: A
    content: 曾模仿漢字的楷書偏旁與草書，創製諺文
  - label: B
    content: 由於強調文化主體性，不再仿效中國典制
  - label: C
    content: 由名為「兩班」的高階官僚掌握重要權力
  - label: D
    content: 中國長期在其境內置都護府進行羈縻管理
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某一時期中國某個城市裡的漢人，發現這座城市裡的占領者多數為信仰基督教的客家人，奇特的裝扮與口音，大腳的女人，怪異的程度不下於洋人與滿人。且統治者自稱天王，管制市場，依據性別、職業讓百姓分館而居，甚至意欲施行嚴格規範人民行為模式的法典。試問：這是哪一座城市？
  options:
  - label: A
    content: 北京
  - label: B
    content: 南京
  - label: C
    content: 長安
  - label: D
    content: 洛陽
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「唐朝建立後，為了抬高李姓的地位……唐太宗曾說：『今李家據國，李老在前』，明確表示要對道教給予優先考慮。而武則天要『變唐為周』當女皇，奪取李姓的政權，便反其道而行之，針鋒相對地採取了『興佛抑道』的政策。」此段資料主旨應為下列何者？
  options:
  - label: A
    content: 唐朝統治者的宗教政策始終優先尊崇道教
  - label: B
    content: 唐太宗為了獨尊老子，而有滅佛舉動
  - label: C
    content: 獨尊儒術才是治國的最佳選擇
  - label: D
    content: 唐朝統治者很懂得善用宗教
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 學者指出：在西周封建制度下，同姓集團授予封土，賜之以氏。當時，姓、氏是統治階級的特權，「貴者有氏，賤者有名無氏」。到戰國時代以後，姓氏的分野逐漸泯除，平民逐漸獲得姓氏。平民得姓一事與下列哪個趨勢的關係最直接？
  options:
  - label: A
    content: 賦役制度的變化
  - label: B
    content: 以孝道治天下
  - label: C
    content: 郡縣制度的發展
  - label: D
    content: 皇帝制度的形成
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 中國古代帝王的典型形象是：「一手捧著儒家經典，宣示教化；一手高舉法家利劍，厲行專制。」這種帝王的典型是從哪一個朝代開始的？
  options:
  - label: A
    content: 秦代
  - label: B
    content: 漢代
  - label: C
    content: 唐代
  - label: D
    content: 宋代
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 白居易〈思舊〉：「……退之（韓愈）服硫磺，一病訖不痊。微之（元稹）鍊秋石，未老身溘然。牧之（杜牧）得丹缺，終日斷腥羶。崔君（崔玄亮）誇藥力，經冬不衣綿。或疾或暴夭，悉不過中年。唯予不服食，老命反遲延。」造成白居易所述之狀況，下列敘述何者較為貼切？
  options:
  - label: A
    content: 唐朝尊崇道教，設置慈幼局照顧病弱
  - label: B
    content: 玄宗設道舉，加強對中醫藥的研究
  - label: C
    content: 上層社會迷信道教煉丹以求長生
  - label: D
    content: 上層社會追求修仙，藉由外力讓自己早日成仙，因此活不過中年
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 某地洪水為患，消息上報朝廷後，皇帝一方面交待工部盡速搶修潰決的堤防，勿使水患繼續擴大；另一方面責成戶部盡速調度糧食，運往災區，賑濟災民。幕僚根據皇帝之意，寫成詔書，經皇帝確認無誤後，直接送至工部、戶部等單位執行。這是哪個時期的制度？
  options:
  - label: A
    content: 秦漢
  - label: B
    content: 隋唐
  - label: C
    content: 宋元
  - label: D
    content: 明清
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 資料一：「汝（指卑彌呼）所在踰遠，乃遣使貢獻，是汝之忠孝，我（魏明帝曹叡）甚哀汝。今以汝為親魏倭王，假金印紫綬，裝封付帶方（州郡名稱）太守假授汝。」
    資料二：「日本曾多次遣使至隋朝，其中有次由小野妹子擔任遣隋使，該次小野妹子代天皇遞給隋煬帝的國書中寫道『日出處天子致書日沒處天子無恙』，讓隋煬帝極度憤怒。」
    請問我們可以如何解釋這兩則與日本相關的資料？
  options:
  - label: A
    content: 日本遣使至中國的目的均是為了挑釁中國皇帝
  - label: B
    content: 日本統治者自稱天子，顯示日本欲脫離與中國的冊封關係
  - label: C
    content: 隋煬帝憤怒的原因實為日本統治者要求被冊封為天子，欲取得跟中國皇帝平等的地位
  - label: D
    content: 卑彌呼被三國魏王冊封為親魏倭王，由於其被封為王，與中國天子間是平等的關係而非君臣關係
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 一位大臣向皇帝建議降低賦稅，指出這項稅法實施之初，一匹絹合四千錢，所以，稅額萬錢的人家只要繳納絹二匹半；現在一匹絹合八百錢，這戶人家竟要繳納十二匹絹。根據該大臣的說法，這是關於哪個稅法的討論？
  options:
  - label: A
    content: 春秋戰國／初稅畝
  - label: B
    content: 唐／租庸調法
  - label: C
    content: 唐／兩稅法
  - label: D
    content: 明／一條鞭法
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 資料一：「出家破家，無父無母，斷嗣絕子，大不孝也。」資料二：「佛教運用人們關心的生死輪迴之觀念，來教人修行以脫離生死。而如果本來就無輪迴，生死聽憑自然，如此一來，平常人就會安於自身的本分以用心工作、在上位者就會安於自然而始終如一！佛教認為的問題，自然就不成為問題了。」請問上述資料說明佛教在中國面臨何種問題？
  options:
  - label: A
    content: 對經濟發展的好壞
  - label: B
    content: 靈魂存在與否的討論
  - label: C
    content: 是否有土地所有權
  - label: D
    content: 與中國文化的衝突
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 某一本傳記這樣評論某位政治人物：「他為求國家轉弱為強，推動很多項新政策，以增加政府財政收入為重要目標，但許多保守大臣認為該政策違反祖宗法度而加以反對，此外，他又因急於求成，朝令夕改，且固執己見，不納諫言，使新政的實施與原意有很大的距離，並且引起持續數十年的黨爭，朝政因而敗壞。」請問：這是下列哪一位政治人物的介紹？
  options:
  - label: A
    content: 張居正
  - label: B
    content: 王安石
  - label: C
    content: 楊炎
  - label: D
    content: 劉勰
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 某一時期，周天子因財政困難，必須派遣大臣向諸侯要求金援。齊、晉兩國也經常派遣使臣朝覲周天子，以提高自己的地位；原本與周天子關係最密切的魯國反而漸漸疏遠。這種現象最可能的原因是：
  options:
  - label: A
    content: 周人滅商，始建國家，但基礎不穩
  - label: B
    content: 西周末年，外族常入侵，政局惡化
  - label: C
    content: 春秋時代，周王室衰微，霸主興起
  - label: D
    content: 戰國時期，大國崛起，戰爭頗頻繁
- id: doc_109_台南_北門_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 隋文帝楊堅開皇十年（590年）下詔：「凡是軍人可悉屬州縣，墾田籍帳，一與民同」，成為「兵農合一」的制度，平時府兵耕地種田，並在折衝將軍領導下進行日常訓練，出征時要自備兵器和糧餉。但是到了唐高宗、武則天當政時，府兵日漸腐化，逃兵日多，到玄宗時改為募兵。請問：什麼因素導致府兵制的崩壞？
  options:
  - label: A
    content: 因為需要自備兵器、糧餉，使得府兵負擔過重
  - label: B
    content: 因為人口日多，原有土地制度被破壞，使府兵無力承擔
  - label: C
    content: 因為天可汗體系下，對外戰爭過多，逃兵嚴重
  - label: D
    content: 因為科舉制度日漸興盛，使府兵轉向科舉考試
