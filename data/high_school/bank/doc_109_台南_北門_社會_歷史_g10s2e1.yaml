  stem: 史家王國維〈殷周制度論〉討論周代嫡長制度建立的起源：「不立弟而立子的制度，實際上是從周朝開始。當武王去世，天下尚未安定，國家需要年長者為王，周公幫助武王戰勝殷紂，功勞最大，因此無論功德還是年齡，按照傳統，周公繼武王即位，不能說不合適。但周公卻寧可擔任攝政，決意擁立成王，何以故？原來周公擁立成王，是為了維護正統；攝政，是為了處理危局。從此以後，父死子繼，成為歷代君王不變的制度。不傳弟而傳子，是為了平息糾紛。兄弟間的親情比不上父子，弟弟對兄長的尊重又不如父親，所以兄弟之間經常不免發生爭位。特別是當所有的弟弟都傳完之後，那麼以後應該立誰為繼位者呢？是立兄之子呢？還是立弟之子呢？從理論上說，自然應該立兄之子；但實際上，往往是立弟之子，這就是商朝有九世之亂的原因。而周朝傳子制度，就是為了糾正此弊端而設立。如果在各個兒子中任選一個而立之，而該人又可任意傳給他想傳的人，那麼糾紛一定會更多，反而不如商代的兄弟相傳，按年齡即位的方法更有次序。如果繼承人的決定，是根據與生俱來的名分，政治就能得到安定，但是如果是根據人意，很可能就會有紛爭。所以後世從天子到諸侯，傳位制度採用立子和立嫡，都是根據天生的標準而不根據個人的意思，是為了求得安定，防止紛爭。」根據文本內容，周代傳子立嫡，主要的原因為何？
  options:
  - label: A
    content: 選出優秀繼承人
  - label: B
    content: 凝聚異姓的諸侯
  - label: C
    content: 平息繼承的紛爭
  - label: D
