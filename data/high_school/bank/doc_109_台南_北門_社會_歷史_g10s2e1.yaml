  group_stem: ◎有關封建與郡縣孰優孰劣的問題，歷代學者多有爭論，以下兩則資料，請閱讀後回答問題。 資料一：《史記》記載秦始皇統一天下後，與丞相王綰、大臣李斯等人，討論要採用什麼制度來統治天下。首先是丞相王綰的意見：「秦國剛滅六國不久，燕、楚、齊等國距離秦根據地關中較遠，如果不置諸侯王，則不易治理，請求始皇將諸皇子分封到這些地區實施統治。」以下是李斯的意見：「古代周文王、周武王分封了很多子弟跟同姓親戚，可是後來關係逐漸疏遠後，這些諸侯就像仇人一樣互相攻擊。到最後諸侯間彼此的征戰，連周天子也無法阻止。現在天下有幸仰賴陛下的神威獲得統一，如果都置郡縣，只要賜以俸祿就很容易控制皇子、功臣們。如果天下的人沒有不同的意見，就是讓天下安寧的好方法。現階段如果要分封諸侯，反會造成治理上的不便。」始皇最後定奪：「天下如此紛亂不安，最主要是有諸侯王之間的爭擾，幸好祖先庇佑，我今天統一了天下，如果再用封建，其實是再設各方兵力，這樣要求天下安寧，不是一件困難的事嗎？」
    資料二：柳宗元《封建論》：真正開始將公道實現於天下，就是秦朝的制度呀。因為要讓天下獲得安定的統治，就要靠適當的人才。並且將賢能的人居於上位，不肖的人在下面接受管理，才能讓天下安寧。而所謂的封建制度，其實只是讓後代用繼承的方式來治理。這種單靠血緣關係繼承統治的制度，在上面的統治者真的都很賢能嗎？下面受到統治的人真的都是不肖的嗎？在這種制度下，百姓生活能否安寧，是很難預料的啊。
