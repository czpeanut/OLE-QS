  stem: 東晉葛洪《抱朴子．外篇》自敘：「內篇已講述神仙藥方、鬼怪、養身延年、禳邪卻禍等事情；外篇講述人間得失、世事的善惡得失」，並主張「想要求仙，必定以忠孝和仁信為根本，若德行不修，而只專研方術，仍然不得長生。」葛洪的論述成功使知識分子接受道教，並為道教建立了一套修練成仙的方法。從上述資料判斷，知識分子接受道教的關鍵為何？
