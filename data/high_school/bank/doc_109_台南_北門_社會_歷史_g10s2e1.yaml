  stem: 這場亂事明白昭示清朝已步入了衰退期。亂事起於湖北、陝西、四川三省交界處，進而波及河南、甘肅兩省，前後經歷了十年，直到1805年才被平定。這場亂事是以個別無力的農民為主要構成分子，以宗教凝聚民心，從性質上來說是清朝第一次以農民為主體的大亂。請問：這場亂事是以哪一宗教凝聚群眾？
