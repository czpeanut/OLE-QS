  stem: 水是生物體內含量最多的物質，關於水的特性與對生物影響何者敘述正確？
  options:
  - label: A
    content: 水的溫度維持具有相對穩定性，藉此可以運輸物質
  - label: B
    content: 水進出動物細胞的膜必須不造成細胞形變，細胞才能穩定行使功能
  - label: C
    content: 水的附著力使植物維管束內的水分形成一連續水柱
  - label: D
    content: 水具有極性能溶極性物質，因此讓許多生理反應得以進行
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)藉此可以穩定環境溫度 (B)只要維持動態的平衡即可，適度的細胞形變跟細胞的生理功能相關 (C)連續水柱主要和水的內聚力有關
