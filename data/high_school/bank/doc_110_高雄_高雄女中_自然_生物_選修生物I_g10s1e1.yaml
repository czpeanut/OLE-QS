  group_stem: 蛋白酶體系統於細胞質及細胞核中，負責分解生命週期短的蛋白質，其分解蛋白質的酵素活性區域局限在系統構造的內部。被分解物須通過蛋白酶體兩端的開口，才能進入內部而被水解。由於蛋白酶體兩端開口大小的限制，只有三度空間結構先被破壞的多肽鏈，才是蛋白酶體的受質。蛋白質複合體受到體積的限制，無法進入蛋白酶體的內部，其分解經溶體系統來執行。 溶體是由生物膜圍繞而成的胞器，在溶體内含有大量的水解酵素，可分解進入溶體的各種受質，這些受質包含蛋白質單體、蛋白質複合體乃至於整個胞器。目前已知蛋白質複合體可經由兩種不同的運送途徑進入溶體，一是透過溶體膜內陷，將附著在溶體表面的受質帶入溶體內；另外一個機制則是在細胞質內進行自噬作用，將蛋白複合體或胞器包裹成雙層膜的細胞自噬體，溶體與自噬體融合後再將內含物分解。依據上文內容和習得的知識，回答下列題目：
