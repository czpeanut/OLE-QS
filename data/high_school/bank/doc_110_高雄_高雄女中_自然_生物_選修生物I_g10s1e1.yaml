  stem: '【水孔蛋白】 水對於生物體十分重要，儘管水分子極小，可以利用簡單擴散的方式緩慢穿過細胞膜，但對於某些組織來說，水分子必須實現快速跨膜的運移。20世紀後期，彼得．格雷．阿格雷（Peter Agre）發現了位在紅血球細胞膜上，分子量為28000的通道蛋白$CHIP_{28}$（channel-forming inergral protein），後來進一步證實功能為水的通道。因此，阿格雷正式將$CHIP_{28}$命名為AQP1（Aquaporin1），即水孔蛋白。直至今日已有超過200種水孔蛋白被發現，從細菌、植物到動物，水孔蛋白廣泛存在所有細胞的細胞膜上，僅哺乳動物細胞膜上就具有十多種水孔蛋白，如AQP1位於紅血球、腎或肺的細胞膜上；AQP7位於脂肪組織、腎或睪丸的細胞膜上。水孔蛋白對於細胞的滲透壓及生理調節十分重要，如腎臟形成尿液、唾液與眼淚的形成；植物細胞的水孔蛋白在種子的萌發、氣孔的開閉過程中也扮演了調節水分快速跨膜的轉運功能。阿格雷因此獲得2003年的諾貝爾化學獎。 AQP1水孔蛋白是由四個單體所組成的四聚體，每個單體都具有6個跨膜的α螺旋組成，各自形成一個供水分子移動的中央孔，孔的直徑稍大於水分子，約0.28 nm、長約2 nm。中央孔具有僅能運輸水的專一性，這種特性與跨膜區的胺基酸序列Asn-Pro-Ala（NPA）有關，容許水以每秒十億個水分子的速率快速進出細胞。值得一提的是，有些水孔蛋白對物質的通透性不僅局限於水分子，如AQP7對甘油也有通透性，以下為阿格雷研究$CHIP_{28}$的功能時所進行的實驗設計，請根據所學過的生物學知識，回答下列題目：

    組別一：將具有$CHIP_{28}$的非洲爪蟾（Xenopus）卵母細胞置於低張溶液中。 組別二：將不具有$CHIP_{28}$的非洲爪蟾（Xenopus）卵母細於低張溶液中。 組別三：將具有$CHIP_{28}$人造膜置於低張溶液中。（結果與實驗一相同） 組別四：將不具有$CHIP_{28}$人造膜置低張溶液中。（結果與實驗二相同） 實驗結果：下表是各組別達平衡後細胞形態的照片。請回答下列相關問題。

    題組4-5題 雄女學生從相同的水域取得數隻草履蟲，進一步觀察處在原生環境下與置於不溶液中其伸縮泡的收縮次數，如附表。假如草履蟲皆具相同的條件，則此四種溶液對於草履蟲而言為何種液？（等張或高張或低張溶液）'
