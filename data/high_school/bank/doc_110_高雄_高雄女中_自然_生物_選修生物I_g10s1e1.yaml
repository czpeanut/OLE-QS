  group_stem: 在細胞凋亡的研究中，常使用到兩種不同的染劑，分别是Annexin V和碘化丙啶（propidium iodide，Pl）。Annexin V是一種會結合到磷脂絲胺酸（phosphatidylserines，PS，一種特殊的磷脂質）的特殊蛋白質，在正常細胞中，PS固定在細胞膜的脂雙層內層，因此Annexin V不會附著在細胞上。在早期凋亡過程中，PS會開始暴露在脂雙層外層，若藉由帶綠色螢光標記的Annexin V（FITC-labeled Annexin V）便可附著在它們之上，並將細胞表面染成綠色。 當細胞發生壞死或細胞凋亡晚期時，碘化丙啶才會進入細胞中將内容物染成紅色。藉由Annexin V和Pl將細胞染色後再利用一種名為流式細胞儀的機器去偵測細胞帶有的螢光顏色，便可藉有顏色區分成四種不同狀態的細胞，分別為活細胞、細胞壞死、細胞凋亡早期以及細胞凋亡晚期。
