    content: $\lim_{n\rightarrow \infty} \frac{a_{n}}{b_{n}}$不存在
  - label: B
    content: $\lim_{n\rightarrow \infty} \frac{c_{n}}{b_{n}}$不存在
  - label: C
    content: $\lim_{n\rightarrow \infty} \frac{d_{n}}{c_{n}}$不存在
  - label: D
    content: $\lim_{n\rightarrow \infty} \frac{c_{n}}{d_{n}}$不存在
  - label: E
    content: $\lim_{n\rightarrow \infty}$($b_{n}$．$d_{n}$)＝0
