  stem: 函數f (x)＝$\sqrt{x}+\frac{1}{\sqrt{x}}$、g(x)＝$\sqrt{x}-\frac{1}{\sqrt{x}}$的定義域皆為正實數，函數h (x)＝|x|的定義域為實數，試選出敘述正確的選項。
  options:
  - label: A
    content: f (x) 的值域為{y$\in$R | y ≥ 2}
  - label: B
    content: (f－g)(x) 為一對一函數
  - label: C
    content: ($\frac{f}{g}$)(x) 的定義域為{x$\in$R | x≠1}
  - label: D
    content: (f。h)(x) 的定義域為{x$\in$R | x≠0}
  - label: E
    content: (f。h)(x) 在其定義域內為偶函數
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) x＞0：f (x)＝$\sqrt{x}+\frac{1}{\sqrt{x}}$ ≥ $2\sqrt{\sqrt{x} \cdot \frac{1}{\sqrt{x}}}$＝2。 (B) ( f－g)(x)＝f (x)－g (x)＝$\frac{2}{\sqrt{x}}$為一對一函數。 (C) $(\frac{f}{g})(x)=\frac{f(x)}{g(x)}\Rightarrow$g (x)≠0$\Rightarrow$x≠1 定義域為{x | x＞0，但x≠1}。 (D) ( f。h)(x)＝f ( h(x) )＝$\sqrt{| x |}+\frac{1}{\sqrt{| x |}}$ 定義域為{x$\in$R| x≠0}。 (E) ( f。h)(－x)＝$\sqrt{| -x |}+\frac{1}{\sqrt{| -x |}}$＝( f。h)(x) 為偶函數。 選(A)(B)(D)(E)。
