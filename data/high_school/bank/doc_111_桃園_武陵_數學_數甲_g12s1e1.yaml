  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○。 (B) ×：例如$b_{n}$＝$\frac{1}{n}$，$c_{n}$＝$\frac{1}{n^{2}}\lim_{n\rightarrow \infty} \frac{c_{n}}{b_{n}}=\lim_{n\rightarrow \infty} \frac{1}{n}=0$。 (C) ○。 (D) ×：例如$c_{n}$＝$\frac{1}{n}$，$d_{n}$＝n $\lim_{n\rightarrow \infty} \frac{c_{n}}{d_{n}}=\lim_{n\rightarrow \infty} \frac{1}{n^{2}}=0$。 (E) ×：例如$b_{n}$＝$\frac{1}{n}$，$d_{n}$＝$n^{2}$ $\lim_{n\rightarrow \infty}$($b_{n}$．$d_{n}$)＝$\lim_{n\rightarrow \infty}$n＝$\infty$( 不存在 )。 故選(A)(C)。
