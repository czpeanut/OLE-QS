  stem: 下列無窮級數何者收斂？（[ ]為高斯符號）
  options:
  - label: A
    content: $\sum_{k=1}^{\infty} \frac{1}{1+2+\ldots +k}$
  - label: B
    content: $\sum_{k=1}^{\infty} \frac{1}{\sqrt{k}+\sqrt{k+1}}$
  - label: C
    content: $0.\overline{9}$＋($0.\overline{9}$)$^{2}$＋($0.\overline{9}$)$^{3}$＋…＋($0.\overline{9}$)$^{n}$＋…
  - label: D
    content: 1－1＋2－2＋3－3＋4－4＋…＋(－1)$^{n－1}$．[$\frac{n+1}{2}$]＋…
  - label: E
    content: 1－1＋$\frac{1}{2}$－$\frac{1}{2}$＋$\frac{1}{3}$－$\frac{1}{3}$＋$\frac{1}{4}$－$\frac{1}{4}$＋…＋(－1)$^{n－1}$．$\frac{1}{\left[ \frac{n+1}{2} \right]}$＋…
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 原式＝$\lim_{n\rightarrow \infty} \sum_{k=1}^{n} \frac{1}{1+2+\ldots +k}=\lim_{n\rightarrow \infty} \sum_{k=1}^{n} \frac{2}{k(k+1)}=\lim_{n\rightarrow \infty} \sum_{k=1}^{n} 2(\frac{1}{k}-\frac{1}{k+1})=\lim_{n\rightarrow \infty} 2(1-\frac{1}{n+1})=2$。 (B) 原式＝$\lim_{n\rightarrow \infty} \sum_{k=1}^{n} \frac{1}{\sqrt{k}+\sqrt{k+1}}=\lim_{n\rightarrow \infty} \sum_{k=1}^{n} (\sqrt{k+1}-\sqrt{k})=\lim_{n\rightarrow \infty} (\sqrt{n+1}-1)=\infty$( 不存在 )。 (C) $0.\overline{9}=\frac{9}{9}=1$ 原式＝1＋1＋1＋…＝$\infty$( 不存在 )。 (D) 首n項和$S_{n}$ $S_{2K}$＝0，$S_{2K－1}$＝K$\Rightarrow \lim_{n\rightarrow \infty}S_{n}$不存在。 (E) 首n項和$S_{n}$ $S_{2K}$＝0，$S_{2K－1}$＝$\frac{1}{k}\Rightarrow \lim_{n\rightarrow \infty}S_{n}$＝0。 故選(A)(E)。
