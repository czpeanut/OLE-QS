- id: doc_112_台中_台中二中_數學_數甲_g12s1e1_s1_5
  section: 1
  number: 5
  type: multiple
  page: 2
  stem: 假設兩數列〈$a_{n}$〉、〈$b_{n}$〉，對所有正整數 n 都滿足$b_{n}+\frac{4n - 1}{n} < a_{n} < 3b_{n}$。已知$\lim_{n \rightarrow \infty} a_{n}$＝6，試選出正確的選項。
  options:
  - label: A
    content: $b_{n} < 6 -\frac{4n - 1}{n}$
  - label: B
    content: $b_{n} > \frac{4n - 1}{2n}$
  - label: C
    content: 數列〈$b_{n}$〉有可能發散
  - label: D
    content: $a_{10000}$＜6.1
  - label: E
    content: $a_{10000}$＞5.9
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：不一定，反例：若 $a_{n}$＝$6 +\frac{3}{n}$，則$\lim_{n \rightarrow \infty} a_{n}$＝6

    但$b_{1}+\frac{4\times 1 - 1}{1} < 6 +\frac{3}{1} < 3b_{1}$

    $\Rightarrowb_{1}$＋3＜9＜$3b_{1}$

    $\Rightarrow$3＜$b_{1}$＜6

    此時 $b_{1}$＜$6 -\frac{4\times 1 - 1}{1}$＝3 不成立

    (B)○：∵$b_{n}+\frac{4n - 1}{n} < 3b_{n}$

    ∴$\frac{4n - 1}{n} < 2b_{n}\Rightarrow\frac{4n - 1}{2n} < b_{n}$

    (C)╳：∵$\frac{4n - 1}{2n} < b_{n} < a_{n}-\frac{4n - 1}{n}$

    且$\lim_{n \rightarrow \infty} \frac{4n - 1}{2n}$＝$\lim_{n \rightarrow \infty} \left( a_{n}-\frac{4n - 1}{n} \right)$＝2

    ∴$\lim_{n \rightarrow \infty} b_{n}$＝2

    (D)╳(E)○：$a_{n}$＞$b_{n}+\frac{4n - 1}{n}$＞$\frac{4n - 1}{2n}+\frac{4n - 1}{n}$＝$\frac{12n - 3}{2n}$＝$6 -\frac{3}{2n}$

    $\Rightarrowa_{10000}$＞$6 -\frac{3}{20000}$＞5.9

    但無法保證 $a_{10000}$＜6.1

    故選(B)(E)'
