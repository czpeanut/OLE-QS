- id: doc_112_台中_台中二中_數學_數甲_g12s1e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 2
  stem: '求下列各極限值，若極限不存在，請寫「不存在」。

    (1) $\lim_{n \rightarrow \infty} ( \sqrt{n^{2}-n + 1} - \sqrt{n^{2}+ 3n + 2} )$＝＿＿＿＿。

    (2) $\lim_{n \rightarrow \infty} \frac{\left[ \frac{n}{3} \right]}{n}$＝＿＿＿＿。（[ ] 表示高斯函數）

    (3) $\lim_{x \rightarrow 0} \left( \frac{x - 3}{x}-\frac{5x + 6}{x^{2}- 2x} \right)$＝＿＿＿＿。

    (4) $\lim_{x \rightarrow 1} \frac{| x^{2}- 3x + 2 |-| x - 1 |}{x - 1}$＝＿＿＿＿。

    (5) $\lim_{x \rightarrow 0} \frac{1}{x} \left( \frac{3}{\sqrt{9-x}}-\frac{1}{\sqrt{1-x}} \right)$＝＿＿＿＿。'
  answer:
  - (1) －2；(2) $\frac{1}{3}$；(3) 5；(4) 0；(5) $-\frac{4}{9}$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $\lim_{n \rightarrow \infty} ( \sqrt{n^{2}-n + 1} - \sqrt{n^{2}+ 3n + 2} )$

    ＝$\lim_{n \rightarrow \infty} \left( ( \sqrt{n^{2}-n + 1} - \sqrt{n^{2}+ 3n + 2} ) \right.$×$\left. \frac{\sqrt{n^{2}-n + 1} + \sqrt{n^{2}+3n + 2}}{\sqrt{n^{2}-n + 1} + \sqrt{n^{2}+3n + 2}} \right)$

    ＝$\lim_{n \rightarrow \infty} \frac{( n^{2}-n + 1 )-( n^{2}+ 3n + 2 )}{\sqrt{n^{2}-n + 1} + \sqrt{n^{2}+ 3n + 2}}$

    ＝$\lim_{n \rightarrow \infty} \frac{-4n - 1}{\sqrt{n^{2}-n + 1} + \sqrt{n^{2}+ 3n + 2}}$

    ＝$\lim_{n \rightarrow \infty} \frac{-4 -\frac{1}{n}}{\sqrt{1 -\frac{1}{n}+\frac{1}{n^{2}}} + \sqrt{1 +\frac{3}{n}+\frac{2}{n^{2}}}}$＝－2

    (2) ∵$\frac{n}{3}- 1 < \left[ \frac{n}{3} \right] \leq \frac{n}{3}$

    ∴$\frac{\frac{n}{3}- 1}{n} < \frac{\left[ \frac{n}{3} \right]}{n}\leq \frac{\frac{n}{3}}{n}$

    又$\lim_{n \rightarrow \infty} \frac{\frac{n}{3}- 1}{n}$＝$\lim_{n \rightarrow \infty} \frac{\frac{n}{3}}{n}$＝$\frac{1}{3}$

    故$\lim_{n \rightarrow \infty} \frac{\left[ \frac{n}{3} \right]}{n}$＝$\frac{1}{3}$

    (3) $\lim_{x \rightarrow 0} \left( \frac{x - 3}{x}-\frac{5x + 6}{x^{2}- 2x} \right)$

    ＝$\lim_{x \rightarrow 0} \frac{( x - 3 ) ( x - 2 )- 5x - 6}{x ( x - 2 )}$

    ＝$\lim_{x \rightarrow 0} \frac{x^{2}- 10x}{x ( x - 2 )}$

    ＝$\lim_{x \rightarrow 0} \frac{x - 10}{x - 2}$＝$\frac{-10}{-2}$＝5

    (4) $\lim_{x \rightarrow 1^{+}} \frac{| x^{2}- 3x + 2 |-| x - 1 |}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{| ( x - 1 ) ( x - 2 ) |-| x - 1 |}{x - 1}$

    ＝$\lim_{x \rightarrow 1^{+}} \frac{-( x^{2}- 3x + 2 )-( x - 1 )}{x - 1}$

    ＝$\lim_{x \rightarrow 1^{+}} \frac{-x^{2}+ 2x - 1}{x - 1}$＝$\lim_{x \rightarrow 1^{+}} \frac{-( x - 1 )^{2}}{x - 1}$

    ＝$\lim_{x \rightarrow 1^{+}} ( -( x - 1 ) )$＝0

    $\lim_{x \rightarrow 1^{-}} \frac{| x^{2}- 3x + 2 |-| x - 1 |}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{| ( x - 1 ) ( x - 2 ) |-| x - 1 |}{x - 1}$

    ＝$\lim_{x \rightarrow 1^{-}} \frac{( x^{2}- 3x + 2 )+( x - 1 )}{x - 1}$

    ＝$\lim_{x \rightarrow 1^{-}} \frac{x^{2}- 2x + 1}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{( x - 1 )^{2}}{x - 1}$

    ＝$\lim_{x \rightarrow 1^{-}} ( x - 1 )$＝0

    ∵$\lim_{x \rightarrow 1^{+}} \frac{| x^{2}- 3x + 2 |-| x - 1 |}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{| x^{2}- 3x + 2 |-| x - 1 |}{x - 1}$＝0

    ∴$\lim_{x \rightarrow 1} \frac{| x^{2}- 3x + 2 |-| x - 1 |}{x - 1}$＝0

    (5) $\lim_{x \rightarrow 0} \frac{1}{x} \left( \frac{3}{\sqrt{9-x}}-\frac{1}{\sqrt{1-x}} \right)$

    ＝$\lim_{x \rightarrow 0} \left( \frac{1}{x} \cdot \frac{3\sqrt{1-x} - \sqrt{9-x}}{\sqrt{9-x} \cdot \sqrt{1-x}} \right)$

    ＝$\lim_{x \rightarrow 0} \left( \frac{1}{x} \cdot \frac{\sqrt{9-9x} - \sqrt{9-x}}{\sqrt{9-x} \cdot \sqrt{1-x}} \cdot \frac{\sqrt{9-9x} + \sqrt{9-x}}{\sqrt{9-9x} + \sqrt{9-x}} \right)$

    ＝$\lim_{x \rightarrow 0} \left( \frac{1}{x} \cdot \frac{9-9x -( 9-x )}{\sqrt{9-x} \cdot \sqrt{1-x} ( \sqrt{9-9x} + \sqrt{9-x} )} \right)$

    ＝$\lim_{x \rightarrow 0} \left( \frac{1}{x} \cdot \frac{-8x}{\sqrt{9-x} \cdot \sqrt{1-x} ( \sqrt{9-9x} + \sqrt{9-x} )} \right)$

    ＝$\lim_{x \rightarrow 0} \frac{-8}{\sqrt{9-x} \cdot \sqrt{1-x} ( \sqrt{9-9x} + \sqrt{9-x} )}$

    ＝$\frac{-8}{3\times 1\times ( 3 + 3 )}$＝$-\frac{8}{18}$＝$-\frac{4}{9}$'
