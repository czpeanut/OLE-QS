- id: doc_112_台中_台中二中_數學_數甲_g12s1e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設 f（x）＝tanx，g（x）＝$x \cdot \sin \frac{1}{x}$，下列哪些是正確的敘述？
  options:
  - label: A
    content: 函數 f（x）的定義域為所有實數
  - label: B
    content: 函數 g（x）在所有實數上連續
  - label: C
    content: $\lim_{x \rightarrow 0} f ( x )$存在
  - label: D
    content: $\lim_{x \rightarrow 1} g ( x )$存在
  - label: E
    content: $\lim_{x \rightarrow 0} g ( x )$不存在
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：在 x＝$\frac{2k + 1}{2}\pi$，$k\in ℤ$時，無定義

    (B)╳：g（x）在 x＝0 無定義，因此在 x＝0 處必不連續

    (C)○：$\lim_{x \rightarrow 0} f ( x )$＝$\lim_{x \rightarrow 0} \tan x$＝tan0＝0

    (D)○：$\lim_{x \rightarrow 1} g ( x )$＝$\lim_{x \rightarrow 1} x \cdot \sin \frac{1}{x}$＝1．sin1＝sin1

    (E)╳：∵$-| x |\leq x \cdot \sin \frac{1}{x}\leq | x |$

    且$\lim_{x \rightarrow 0} ( -| x | )$＝$\lim_{x \rightarrow 0} | x |$＝0

    ∴$\lim_{x \rightarrow 0} x \cdot \sin \frac{1}{x}$＝0

    故選(C)(D)'
