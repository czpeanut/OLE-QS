- id: doc_112_台中_台中二中_數學_數甲_g12s1e1_s1_4
  section: 1
  number: 4
  type: multiple
  page: 2
  stem: 設 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋6，已知$\lim_{x \rightarrow 2} \frac{f ( x )}{x - 2}$＝－5，$\lim_{x \rightarrow 3} \frac{f ( x )}{x - 3}$＝7，且$\lim_{x \rightarrow -1} \frac{f ( x )+k}{x + 1}$為收斂，試選出下列正確的選項。
  options:
  - label: A
    content: a＝3
  - label: B
    content: b＝－9
  - label: C
    content: c＝7
  - label: D
    content: k＝－12
  - label: E
    content: a＋b＋c＋k＝12
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意可知 f（x）有 x－2，x－3 的因式，

    故可令 f（x）＝（mx＋n）（x－2）（x－3）

    ∵f(0)＝6 ∴n（－2）（－3）＝6$\Rightarrow$n＝1

    得 f（x）＝（mx＋1）（x－2）（x－3）

    ∵$\lim_{x \rightarrow 2} \frac{f ( x )}{x - 2}$＝$\lim_{x \rightarrow 2} ( ( mx + 1 ) ( x - 3 ) )$＝（2m＋1）（－1）＝－5

    ∴m＝2

    得 f（x）＝（2x＋1）（x－2）（x－3）＝$2x^{3}$－$9x^{2}$＋7x＋6

    故 a＝2，b＝－9，c＝7

    (A)╳：a＝2

    (B)○

    (C)○

    (D)╳：若$\lim_{x \rightarrow -1} \frac{f ( x )+k}{x + 1}$收斂，則 f（－1）＋k＝0

    即－2－9－7＋6＋k＝0$\Rightarrow$k＝12

    (E)○：a＋b＋c＋k＝2－9＋7＋12＝12

    故選(B)(C)(E)'
