  explanation: '$a_{n}$ ≤ $\frac{1}{n} \left( \frac{2}{\sqrt{3n^{2}+1}}+\frac{4}{\sqrt{3n^{2}+1}}+\ldots \ldots +\frac{2n}{\sqrt{3n^{2}+1}} \right)$

