- id: doc_112_台中_台中二中_數學_數甲_g12s1e1_s2_6
  section: 2
  number: 6
  type: fill
  page: 3
  stem: 已知實數 a，b 滿足$\lim_{n \rightarrow \infty} \left( \frac{1^{2}+ 2^{2}+\ldots \ldots +n^{2}}{n^{2}}-an \right)$＝b，試求數對（a，b）＝＿＿＿＿。
  answer:
  - $\left( \frac{1}{3} , \frac{1}{2} \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{n \rightarrow \infty} \left( \frac{1^{2}+2^{2}+\ldots \ldots +n^{2}}{n^{2}}-an \right)$

    ＝$\lim_{n \rightarrow \infty} \left( \frac{\frac{n ( n + 1 ) ( 2n + 1 )}{6}}{n^{2}}-an \right)$

    ＝$\lim_{n \rightarrow \infty} \left( \frac{2n^{2}+ 3n + 1}{6n}-an \right)$

    ＝$\lim_{n \rightarrow \infty} \left( \left( \frac{1}{3}-a \right) n +\frac{1}{2}+\frac{1}{6n} \right)$＝b

    若極限存在，則 a＝$\frac{1}{3}$

    且 b＝$\lim_{n \rightarrow \infty} \left( \frac{1}{2}+\frac{1}{6n} \right)$＝$\frac{1}{2}$

    故數對（a，b）＝$\left( \frac{1}{3} , \frac{1}{2} \right)$'
