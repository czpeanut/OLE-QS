- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_11
  section: 2
  number: 11
  type: fill
  page: 1
  stem: '甲與乙兩人對打電競比賽，約定先贏得3局者獲勝，假設甲每局的勝率為$\frac{1}{3}$，且每局必分勝負，試回答下列問題：

    (1) 試問甲在比完第三局時恰贏得第一局的機率為何？

    (2) 若「恰比賽三局且乙獲勝」的機率為a，「恰比賽四局且乙獲勝」的機率為b，「恰比賽五局且乙獲勝」的機率為c，試比較a，b，c的大小。'
  answer:
  - (1) $\frac{4}{27}$；(2) a=b>c
  answer_status: verified
  answer_source: answer_key
  explanation: (1) 1, 2, 3 乙乙甲$\rightarrow \frac{2}{3}\times \frac{2}{3}\times \frac{1}{3}=\frac{4}{27}$。 (2) $a:\frac{2}{3}\times \frac{2}{3}\times \frac{2}{3}=\frac{8}{27}$。 $b:前三局乙甲乙排列,第四局乙勝:\frac{3!}{2!}\times (\frac{2}{3})^{3}\times \frac{1}{3}=\frac{8}{27}$。 $c:前四局乙甲甲乙排列,第五局乙勝:\frac{4!}{2!2!}\times (\frac{2}{3})^{3}\times (\frac{1}{3})^{2}=\frac{16}{81}$。 $\therefore a=b>c$
