- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 甲、乙二人比賽桌球，不得和局，若每局甲獲勝的機率為$\frac{3}{5}$，今規定先勝3局者可得獎金1000元。進行至甲勝2局、乙勝1局時，因故中止比賽，現以成績分配獎金，則甲應分得獎金多少元？
  options:
  - label: A
    content: '200'
  - label: B
    content: '600'
  - label: C
    content: '720'
  - label: D
    content: '840'
  - label: E
    content: '960'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 政府海關檢驗進口貨櫃中的牛肉含有瘦肉精的情況，若各件肉品含有過量瘦肉精與否是相互獨立的，依過去經驗：一件進口牛肉含有過量瘦肉精的機率為p；設X為n件進口牛肉中含有過量瘦肉精的件數，若已知期望值E (X)＝2，標準差σ為$\frac{2\sqrt{3}}{3}$，依規定若有2件或2件以上含有過量瘦肉精，則需要整批沒收銷毀，求此n件進口牛肉整批不被銷毀的機率為
  options:
  - label: A
    content: $\frac{1}{729}$
  - label: B
    content: $\frac{4}{729}$
  - label: C
    content: $\frac{10}{729}$
  - label: D
    content: $\frac{156}{729}$
  - label: E
    content: $\frac{256}{729}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $E(X)=np=2$，$\sigma ^{2}=np(1-p)=\frac{4\times 3}{9}=\frac{4}{3}$， 兩式相除⇒$\frac{np(1-p)}{np}=\frac{\frac{4}{3}}{2}=\frac{2}{3}$，$1-p=\frac{2}{3}$，$p=\frac{1}{3}\therefore n=6\begin{matrix}P(不被銷毀)=P(1件不含過量)+P(都沒有) \\ =C_{1}^{6}\times (\frac{2}{3})^{5}(\frac{1}{3})+(\frac{2}{3})^{6}=\frac{192}{729}+\frac{64}{729}=\frac{256}{729}\end{matrix}$，故選(E)。
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 二項分布X～B ( 20 , 0.8 )，試問X為多少時，機率最大？
  answer:
  - '16'
  answer_status: verified
  answer_source: answer_key
  explanation: 二項分布的機率最大處發生在期望值 $\therefore E(X)=np=20\times 0.8=16$(元)。
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 某次數學測驗共有16題單選題，每題有5個選項，某生完全憑猜測作答，每題都有作答，試求其答對題數的標準差。
  answer:
  - '1.6'
  answer_status: verified
  answer_source: answer_key
  explanation: $\sigma (X)=\sqrt{np(1-p)}=\sqrt{16\times \frac{1}{5}\times \frac{4}{5}}=\frac{8}{5}=1.6$。
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: 一袋中有8個球，其中3個球上標記10，5個球上標記6，試問：從袋中任取4球，求數字和的期望值。
  answer:
