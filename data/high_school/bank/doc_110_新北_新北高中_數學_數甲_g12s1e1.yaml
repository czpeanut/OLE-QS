  stem: 設X為隨機變數，且y＝$\frac{2}{3}$X＋10，已知E (X)＝6，Var (X)＝0.9，試求Var (Y)。
  answer:
  - '0.4'
  answer_status: verified
  answer_source: answer_key
  explanation: $E(X)=6,Var(x)=0.9$，$Var(Y)=Var(\frac{2}{3}X+10)=\frac{4}{9}Var(X)=\frac{4}{9}\times 0.9=0.4$。
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_7
  section: 2
  number: 7
  type: fill
  page: 1
  stem: 已知某公司員工支持某項政策的機率為0.35，若公司打算暗中調查員工是否贊同該項政策，試問：預期至少需要調查多少人後，才會出現第一位贊同者？
  answer:
  - $\frac{20}{7}$
  answer_status: verified
  answer_source: answer_key
  explanation: 'X: 1 2 3 …. $P$: $P(1-P)P(1-P)^{2}P$ ….. $E(X)=P+2(1-P)P+3(1-P)^{2}P+...(1-P)E(X)=(1-P)P+2(1-P)^{2}P+3(1-P)^{3}P+...$ 兩式相減 $PE(X)=P+(1-P)P+(1-P)^{2}P+...E(X)=1+(1-P)+(1-P)^{2}+...=\frac{1}{1-(1-P)}=\frac{1}{P}X\sim B(n,\frac{7}{20})$，$E(X)=n\times \frac{7}{20}=1,n=\frac{20}{7}$。'
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_8
  section: 2
  number: 8
  type: fill
  page: 1
  stem: 同時擲出3個均勻骰子，設出現三個點數為相異奇數的事件為A，將此試驗連做12次，若事件A發生了X次，試求E (X)。
  answer:
  - $\frac{1}{3}$
  answer_status: verified
  answer_source: answer_key
  explanation: 三個均勻骰子中，樣本空間共$6\times 6\times 6=216$， 出現三個點數為相異奇數的情形數為1點,3點,5點排列，共$3!=6\therefore P(A)=\frac{6}{216}=\frac{1}{36}$，又$n=12\therefore E(X)=np=12\times \frac{1}{36}=\frac{1}{3}$
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_9
  section: 2
  number: 9
  type: fill
  page: 1
  stem: 袋中有紅色代幣4枚、綠色代幣7枚以及藍色代幣若干枚，每一枚紅色、綠色、藍色代幣分別可兌換30元、20元及10元，現從袋中取出代幣1枚或2枚，每一枚代幣被取出的機率均等。設隨機變數Ｘ代表取出1枚代幣可兌換的金額 ( 單位：元 )；隨機變數Y代表取出2枚代幣可兌換的金額 ( 單位：元 )。 已知X的期望值為20，試問：(1) 藍色代幣有多少枚？(2) P ( Y ≤ 30 ) 的值？
  answer:
  - (1) 4；(2) $\frac{34}{105}$
  answer_status: verified
  answer_source: answer_key
  explanation: (1) 設藍色代幣有$x$枚 $\therefore E(X)=\frac{4}{x+11}\times 30+\frac{7}{x+11}\times 20+\frac{x}{x+11}\times 10=\frac{120+140+10x}{x+11}=20\therefore x=4$ (2) $P(Y\leq 30)=\frac{C_{1}^{7}C_{1}^{4}+C_{2}^{4}}{C_{2}^{15}}=\frac{34}{105}$。
