  explanation: $E(X)=\frac{10\times 3+6\times 5}{8}\times 4=30$。
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_4
  section: 2
  number: 4
  type: fill
  page: 1
  stem: 隨機變數X～G (p)，若X的變異數Var (X)＝6，試求X＝3的機率？
  answer:
  - $\frac{4}{27}$
  answer_status: verified
  answer_source: answer_key
  explanation: $Var(X)=\frac{1-p}{p^{2}}=6$，$6p^{2}+p-1=0$，$(3p-1)(2p+1)=0$，$p=\frac{1}{3}$或$-\frac{1}{2}(不合)\therefore X\sim G(\frac{1}{3})$，$P(X=3)=(\frac{2}{3})^{2}\times (\frac{1}{3})=\frac{4}{27}$
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_5
  section: 2
  number: 5
  type: fill
  page: 1
  stem: 摸彩箱裝有若干編號為1，2，…，8的彩球，其中各種編號的彩球數目可能不同。今從中隨機摸取一球，每球被取到的機會相同，依據所取球的號數給予若干報酬。現有甲、乙兩案：甲案為當摸得彩球的號數為k時，其所獲報酬同為k元；乙案為當摸得彩球的號數為k時，其所獲得報酬為9-k(k=1 , 2 ,…, 10元)。 已知：若依甲案，每摸取一球的期望值為$\frac{64}{11}$元，則依乙案，每摸取一球的期望值為多少元？
  answer:
  - $\frac{35}{11}$
  answer_status: verified
  answer_source: answer_key
  explanation: 設取到 $k$ 號球的機率$P_{k}$，則$P_{1}+P_{2}+..+P_{8}=1$，$E_{甲}=\sum_{k=1}^{8} k\times P_{k}=\frac{64}{11}$， 故$E_{乙}=\sum_{k=1}^{8} (9-k)\times P_{k}=9\sum_{k=1}^{8} \times P_{k}-\sum_{k=1}^{8} k\times P_{k}=9\times 1-\frac{64}{11}=\frac{35}{11}$。
- id: doc_110_新北_新北高中_數學_數甲_g12s1e1_s2_6
  section: 2
  number: 6
