  group_stem: 單一選區兩票制又稱混合制，此指混合了投給候選人的多數代表制及投給政黨的比例代表制，而不同的計票方式會帶來不同的席次分配結果。計票方式主要分為聯合制及並立制：採取聯立制，其總席次是依照政黨票的得票率來決定，再做分配，只要扣除區域立委席次，即可得到不分區席次；採取並立制的總席次則是分別將區域立委席次亏不分區立委席次的結果相加。因此，若為小黨，會盡可能希望透過提高政黨票得票率來增加在國會的總席次。 木矅國國會共200席，採取單一選區兩票制，設有政黨門檻5％。以下為木矅國的最近一次大選的投票結果，請根據附圖表回答下列問題：
