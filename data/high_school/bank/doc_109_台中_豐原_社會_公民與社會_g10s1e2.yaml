  stem: 根據資料一，政府雖然有依法行政提前預告，但因命令內容爭議過大，且預告期間過短，<u>使民眾無法得到充分資訊，而引發各界質疑，認為過程有瑕疵</u>，導致正當性不足。由以上敘述可告，政府的作為可能<u>違反</u>何種正義原則？
  group_stem: '蔡英文總統於今年8月28日下宣布擴大開放美豬美牛，隨後行政院食品安全辦公室交書面報告說明之所以要開放含萊劑美豬以及30個月齡以上的美國牛肉進口，是「為了要排除過去阻擋台美雙邊貿易的障礙」。此議題引發的實安疑慮在我國掀起廣泛討論，請閱讀以下資料並回答44-48問題。

    ☆資料一：此擴大開放牛豬進口屬於「行政命令」，不須經立法院審查，不過預告時間僅有7天，<u>相較於一般法案或行政命令預告基本起跳時間30天，7天被外界抨擊是突襲、沒有誠意溝通</u>。在野黨提出《行政程序法》修法草案，未來行政命令除非情況特殊，應至少公告周知60日，以利收集民意。

    ☆資料二：農利會<u>在預告後第5天收到許多民眾抗議</u>，指稱8月28日的預告只說明萊克多巴胺可以使用在牛和豬隻，似乎暗指國內也開放使用萊克多巴胺（乙型受體素），因此<u>農委會9月1日特別開記者表示</u>，正式公告時會修正用詞，乙型受體表為禁止國內製造、調齊、輸入、輸出販賣或陳列之藥品，牛及豬隻於國外使用萊克多巴胺，不在規範之列。此案例正顯示預告期有收集民意的效用。

    ☆資料三：明年起所有豬肉及其製品在販售場所、餐飲場所都需要清楚標示原料產地。臺灣豬證明標章11月起開放100％使用國家豬肉店家、業者申請，<u>業者可在「臺灣豬證明標章申請網」線上辦理，只要使用工商憑證或自然人憑證，進行身份確認、填寫店家資料、同意使用切結契約書、上傳肉品來源證明資料等4個步驟，即可完成申請程序</u>。

    ☆資料四：由在野黨立委林為洲針對爭議提出「<u>你是否同意</u>政府應全面禁止進口含有瘦肉精（萊克多巴胺等乙型受體素）豬隻之肉品、內臟及其相關產制品？」公投案因通過第一階段連署已送交中選會，並於11月6日舉行聽證，釐清本案是否符合《公投法》之規定。

    ☆資料五：消基會祕書長吳榮達喊出行動口號：「我有一張口可以拒吃來豬，<u>我有一張選票可以拒投政黨</u>。」要求全民抵制。民間反瘦內精聯盟李建誠了表示，為了守護食安與民主價值，預計在11月22日號召全國反萊豬團體及消費者走上街頭，對於政府棄守食安防線表達最強列的抗議。

