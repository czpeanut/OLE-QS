  stem: 請問〈貼文一〉川普的這段話的意涵為何？
  options:
  - label: A
    content: 提高關稅，可以讓美國生產者更有機會可以賣出商品到世界各國
  - label: B
    content: 美國課高關稅，可以讓原本到國外投資的美商公司回到美國設廠
  - label: C
    content: 這些過去敲竹槓的國家必須降低關稅，才有機會能夠到美國投資
  - label: D
    content: 若其他國家要出口商品到美國，可以準備一個存錢罐，捐給美國
  group_stem: '面對中美貿易戰，川普曾在推特貼文。

    〈貼文一〉：「如果你是其他國家多年來一直敲竹槓的大存錢罐，那麼關稅是一個極好的談判工具，也是一個大的收入源。最重要的是，它是非常有力的方式，能讓公司來美國，並讓那些離開我們到其他國家的公司回家。」

    〈貼文二〉：中國除了貶值貨幣（其他國家可以花較少的錢買到中國商品）和補貼公司，以減少25%關稅的影響。到目前為止，對美國消費者影響不大，而受關稅影響的公司將搬遷到美國。'
