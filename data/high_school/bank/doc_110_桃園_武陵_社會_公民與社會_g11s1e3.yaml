- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 根據上文關於免責聲明，指記載業者對活動產生的風險不負責任的聲明書、同意書或契約，可能表示參加活動簽署人自願拋棄對業者求償權，或免除業者應負擔責任。何者敘述正確？
  options:
  - label: A
    content: 如果簽署人具有完全行為能力而自願簽署，對於活動中發生的危險與損害，須自行負責，無法向業者索取賠償
  - label: B
    content: 如業者執意訂立違反「定型化契約應記載及不得記載事項」的免責條款，依消保法規定，此條款沒法律效力
  - label: C
    content: 定型化契約應記載或不得記載事項僅供業者參考，依照契約自由可自由決定是否遵守
  - label: D
    content: 如果免責聲明的契約中訂有預先免除故意或重大過失責任的條款，則契約該條款有效
  group_stem: '◎戶外活動中的免責聲明

    參加泛舟、溯溪、攀岩或其他具有高危險性的活動，有些業者會要求活動參與者簽署「免責聲明」。這種類似生死狀的檔，是否簽了就必須一切自負其責，而業者一點責任也沒有嗎？例如「本人同意免除甲方一切責任」、「本人願承擔發生之所有風險，甲方概不負責」等條款。如果有以下幾種情況，免責條款可能就沒有法律效力，業者仍應該就活動中發生的危險，對活動參與者負責：

    1.法律強制或禁止規定：定型化契約應記載或不得記載事項

    依照消費者保護法第17條第1項規定，我國針對各式消費活動訂有「定型化契約應記載或不得記載事項」，要求業者與消費者訂立契約時，應該有的基本條款(應記載事項)，以及不能有的條款(不得記載事項)。在特定活動中，不得記載事項就限制業者不能隨意訂立免責條款。像是熱氣球搭乘活動，交通部公告的「自由氣球乘客載運定型化契約應記載及不得記載事項」中，不得記載事項第6點就規定，不可以在契約上寫著類似「只要乘客違反使用須知、禁制標誌或管理人員之指示，活動主辦單位或業者概不負賠償責任」的條款。

    2.法律強制或禁止規定：業者有故意、重大過失責任

    民法第222條規定，故意或重大過失責任，不可以預先免除。如果契約訂有預先免除故意或重大過失責任的條款，該條款將因違反法律規定而無效。

    3.有失公平情況

    消費者保護法第12條第1項規定，定型化契約條款如果違「xx原則」，對消費者顯失公平的話，該條款無效；民法第247條之1也規定，定型化契約如果有減免定型化契約制定者的責任、加重他方責任、使他方拋棄或限制權利或造成他方重大不利影響的條款，使得這個契約顯失公平的話，這個條款無效。(改寫自法律好朋友)'
