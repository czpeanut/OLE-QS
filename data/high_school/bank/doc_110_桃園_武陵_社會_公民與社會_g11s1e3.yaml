  section: 2
  number: 41
  type: multiple
  page: 6
  stem: 在私法自治與契約自由原則下，原則上政府不會介入，但國家可能必須對於傳統契約自由的原則加以修正，對於勞工、消費者等提供適當的法律保護，以保障在契約上的實質正義，也就是「契約正義」，下列何者屬於此種情況？
  options:
  - label: A
    content: 勞工有違反勞雇契約，或不遵守雙方訂定的工作規則，雇主須符合勞基法「情節重大」才能解僱
  - label: B
    content: 勞基法規定，原則上只要雇主在正常的工作時間以外，延長勞工的工作時間，就應該依照延長的時間給予「加班費」
  - label: C
    content: 針對臺灣線上遊戲轉蛋法提案，經濟部已啟動修改「網路連線遊戲服務定型化契約應記載及不得記載事項」程式，力拼端出草案
  - label: D
    content: 「勞工保險被保險人因執行職務而致傷病審查準則」規定「上、下班，在適當時間，從日常居住所往返上班地點」發生事故導致傷害，視為職業災害，若致勞工死亡、殘廢、傷害或罹患疾病，即可依勞基法請求職災補償
  - label: E
    content: 勞動基準法勞雇契約符合特定條件(專業培訓並負擔培訓費用、用合理補償來換取最低服務年限的要求)才能要求最低服務年限
