  - label: C
    content: 短期出國、旅遊或開會者，因主要經濟利益中心位於國外，屬本國常住居民
  - label: D
    content: 台積電公司外派員工三個月至美國廠準備生產半導體月薪10萬臺幣，屬本國常住居民
  - label: E
    content: 來自印度的馬沙被公司派到臺灣工作六個月，月薪20萬臺幣，屬於本國非常住居民
