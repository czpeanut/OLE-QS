questions:
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: GDP計算有一些侷限，無法反映真正的經濟福祉，導致GDP可能被高估、低估或無法估計，請問下列哪項會產生因GDP不列入計算而造成「低估」的情況？
  options:
  - label: A
    content: 販賣毒品與賭博
  - label: B
    content: 監獄人滿為患而擴建
  - label: C
    content: 高工時過勞情況
  - label: D
    content: 環境的污染與破壞生態
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '小武在網站下載四個國家某年以支出面衡量的國內生產毛額，卻發現資料有缺漏，出現「***」的亂碼(如表)。根據表中資料，小武作出哪項推論才正確？

    | 項目   國家 | 民間消費 | 投資 | 政府支出 | 淨出口 | GDP |

    | --- | --- | --- | --- | --- | --- |

    | 甲國 | 5000 | 100 | 300 | *** | 5300 |

    | 乙國 | 4000 | 500 | 800 | 150 | *** |

    | 丙國 | 3000 | 800 | *** | -300 | 3700 |

    | 丁國 | 4400 | *** | 100 | -400 | 5000 |'
  options:
  - label: A
    content: 甲國的出口量大於進口量
  - label: B
    content: 乙國國內生產毛額排最後
  - label: C
    content: 丙國的政府支出是排第三
  - label: D
    content: 丁國的投資總額排名第二
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 宋朝時期國內經濟蓬勃發展。長江流域及其以南的地區，農業、手工業興盛，是當時中國的經濟重心，科學技術如造船、指南針等也有長足的進步，海上貿易發達。宋朝和南洋群島及中南半島的交趾、占城、暹羅、柬埔寨等地，發展成「南海貿易體系」。根據《宋會要》和《諸蕃志》記載，當時主要的貿易商品有香料、藥材、瓷器、絲織品、漆器等。請問從貿易管制與開放的角度思考，若宋朝時期中國「封鎖」南海貿易體系，將對宋朝「國內」瓷器和絲織品等手工業商品市場、香料等原物料市場的消費者輿生產者，造成什麼直接影響？
  options:
  - label: A
    content: 有利手工業市場生產者、不利原物料市場消費者
  - label: B
    content: 有利手工業市場消費者、有利原物料市場生產者
  - label: C
    content: 不利手工業市場消費者、不利原物料市場生產者
  - label: D
    content: 不利手工業市場生產者、有利原物料市場消費者
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某公司設立於美國，經營特點是零庫存，透過網際網路接受訂貨、即時生產(Just in Time)，不經過中盤商而由公司直銷到消費者手中。一位外文系畢業的臺灣女孩加入此公司，因受重用成為產品開發部門總監，現長期旅居美國，管理臺美研發團隊。根據題文，臺灣女孩所得收入分別對臺灣與美國的國內生產毛額(GDP)與國民所得毛額(GNI)有何影響？
  options:
  - label: A
    content: 使臺灣GDP與美國GNI上升
  - label: B
    content: 使臺灣GDP與臺灣GNI上升
  - label: C
    content: 使美國GDP與美國GNI上升
  - label: D
    content: 使美國GDP與臺灣GNI上升
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某公司因景氣不佳，要求員工減薪，但員工認為該公司並未虧損，不應減薪。該公司工會出面與老闆協商，老闆出示員工受雇時簽訂的契約，契約記載員工不能授權給工會代替其談判薪資，且不可以罷工，因此拒絕與工會協商，該工會乃發動罷工。此事件涉及的勞動權利，下列敘述何者正確？
  options:
  - label: A
    content: 契約條款明訂員工不能授權工會進行薪資談判，工會談判行為無效
  - label: B
    content: 基於私法自治原則，工會的罷工行為因為明確違反勞動契約而無效
  - label: C
    content: 罷工常會造成勞資雙方損失，因此該公司的契約對於勞方並非不利
  - label: D
    content: 該公司與員工簽訂的契約內容違反勞動相關法規，其契約因而無效
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 為刺激景氣提振經濟，政府推出低利貸款鼓勵民間消費與廠商投資，而政府本身也積極投入公共建設與都市更新。請問下列因低利貸款與政府措施而帶動之經濟活動，對國內生產毛額(GDP)影響的敘述何者最為正確？
  options:
  - label: A
    content: 家戶單位因低利誘因加購二手屋的支出皆計入GDP
  - label: B
    content: 企業因擴建廠房而添購全新設備的支出不計入GDP
  - label: C
    content: 政府成功推動都市更新使老屋翻新有助於提振GDP
  - label: D
    content: 政府動支預算修繕維護各級道路並無助於提高GDP
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 依據《嚴重特殊傳染性肺炎防治及紓困振興特別條例》規定，若因執行防治工作感染導致傷病、身心障礙或死亡，政府應給予各項給付補助或子女教育費用。前述政府補助屬於哪種政府支出？
  options:
  - label: A
    content: 消費性支出
  - label: B
    content: 投資性支出
  - label: C
    content: 移轉性支出
  - label: D
    content: 債務利息支出
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 因疫情影響，政府為振興經濟，提振民間消費及促進國內需求，發放「振興券」。關於振興券政策，排除振興券印製發放、兌付、宣導等費用，專指振興券由人民進行消費部分，對應到國內生產毛額GDP=C+I+G+(X-M)，請問是否計入GDP中？屬於何種類型？
  options:
  - label: A
    content: 計入，民間消費支出
  - label: B
    content: 計入，民間與政府投資支出
  - label: C
    content: 計入，政府消費支出
  - label: D
    content: 不計入
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 民國111年基本工資調漲，月薪從新台幣2萬4000元調升至2萬5250元、時薪從160元調升至168元，預估有245萬名勞工受惠。另外，經濟部推動基本工資補貼與業者共體時艱，但也要求事業能夠肩負社會責任，保障員工及兼顧消費者權益；如補貼期間有違反基本工資規定而遭裁罰者，或經公平會、法務部等查獲有不法哄抬物價、囤貨居奇等行為，經濟部將追回補貼款。請問由勞動市場供需理論看，以下有關基本工資政策的影響，何者正確？
  options:
  - label: A
    content: 是一種的價格上限政策以保障供給者
  - label: B
    content: 所有勞工都帶來有利的就業保障
  - label: C
    content: 單純以消費者物價指數作為調整依據
  - label: D
    content: 整體市場所雇用的勞工人數會減少
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 甲、乙、丙三國均加入世界貿易組織(WTO)之後，啟動的雙邊貿易協定如下：甲國先與乙國協商腳踏車關稅稅率為5%，後與丙國重新協商腳踏車關稅稅率為4%；於同一時間，乙國對丙國的腳踏車關稅降為3%，丙國對乙國的腳踏車關稅調整為6%。最後，甲國對於乙、丙兩國所訂定的腳踏車進口關稅稅率應為多少，方能符合WTO的關稅規範？
  options:
  - label: A
    content: 3%
  - label: B
    content: 4%
  - label: C
    content: 5%
  - label: D
    content: 6%
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「故意過失」和「因果關係」二者有時難以證明，往往成為訴訟勝負的關鍵，因此在某些情況下，立法者透過「無過失責任」來保護不利處境者。下列事件何者不符合上述說明的情況？
  options:
  - label: A
    content: 買的衣服殘留化學藥劑，沾染皮膚造成潰爛
  - label: B
    content: 工廠排放廢水，附近居民因此得到特殊疾病
  - label: C
    content: 新買的手機爆炸，導致傢俱完全毀損
  - label: D
    content: 房屋仲介者刻意隱瞞輻射屋，消費者不知情而購買
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 去年甲25歲，和大學同學乙結婚，經由雙方家長同意，未到行政機關登記，而是以公開場合舉行盛大的婚禮。婚後兩人幸福美滿，育有一子丙並收養一女丁，父母健在，但甲卻在今年26歲生日當天墜機身亡。試問下列選項何者正確？
  options:
  - label: A
    content: 甲死後，丁因是法定血親故沒有繼承權
  - label: B
    content: 甲與乙以公開場合舉行婚禮，其婚姻有效
  - label: C
    content: 甲死後，依法定只有丙和丁擁有繼承權
  - label: D
    content: 子女繼承財產後，父母也可繼承遺產
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 父母早逝、沒有妻小的成年獨子甲與年邁祖母相依為命。某日甲駕車不小心撞傷路人乙，造成乙身受重傷，約定賠償100萬元。一週後，甲因病身故，只留下存款10萬元，乙只好轉向甲的祖母求償。關於上述賠償，下列選項何者正確？
  options:
  - label: A
    content: 乙向祖母求償100萬元，祖母須清償全額
  - label: B
    content: 若祖母未拋棄繼承，須負10萬元的清償責任
  - label: C
    content: 祖母為法定繼承人，但甲的求償於法無據
  - label: D
    content: 肇事的人是甲，祖母沒有賠償義務
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 甲和乙是夫妻，他們結婚後並沒有約定要採取何種財產制。甲發現乙同時和丙及丁發生婚外性行為，甲決定與乙離婚。清查彼此的財產後，發現甲有婚前財產300萬，婚後財產800萬，負債200萬，乙則有婚前財產800萬，婚後財產600萬，100萬的債務。請問如果乙想要行使剩餘財產差額分配請求權，一般狀況乙可以請求分配多少財產？
  options:
  - label: A
    content: 0元
  - label: B
    content: 50萬
  - label: C
    content: 100萬
  - label: D
    content: 200萬
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 假設某一農場從國外進口1萬元的小豬仔，把牠們養大後賣給農產運銷公司，得款10萬元。農產公司把這批毛豬加工製成香腸，賣給百貨公司，得款16萬元。百貨公司再將這批香腸分裝販售，得款30萬元。請問這個生產流程對於GDP的貢獻是多少？
  options:
  - label: A
    content: 56萬元
  - label: B
    content: 55萬元
  - label: C
    content: 30萬元
  - label: D
    content: 29萬元
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 世界貿易組織(WTO)主旨是降低關稅、解除貿易障礙、促使自由貿易，WTO根據不歧視原則等，建立其貿易制度，下列有關此原則的內涵敘述，哪些正確？
  options:
  - label: A
    content: 自由貿易是指解除各種貿易障礙、促進專業分工，專指關稅障礙部分
  - label: B
    content: 允許開發中國家在貿易自由化時程中採漸進開放原則，避免過度衝擊
  - label: C
    content: 國民待遇是指所有會員國對其他會員之相同貨品給予同等優惠待遇
  - label: D
    content: 最惠國待遇是指對其他會員進口貨品給予不低於本國相同貨品待遇
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: '某種水果的市場供需資料，請問：若進行此種水果的國際貿易，則兩國之間的國際均衡價格可能為何？

    | 價格(元/每公斤) |  | 10,000 | 8,000 | 6,000 | 4,000 | 2,000 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 甲國 | 供給量(公斤) | 45 | 43 | 39 | 33 | 25 |

    |  | 需求量(公斤) | 2 | 6 | 20 | 24 | 25 |

    | 乙國 | 供給量(公斤) | 17 | 15 | 12 | 8 | 3 |

    |  | 需求量(公斤) | 1 | 6 | 12 | 17 | 25 |'
  options:
  - label: A
    content: 8,000元
  - label: B
    content: 6,000元
  - label: C
    content: 4,000元
  - label: D
    content: 2,000元
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 有關甲積欠夜店逾百萬元債務清償問題，下列敘述何者正確？
  options:
  - label: A
    content: 縱甲出走，夜店債主不可以甲為被告，請求法院裁判甲清償債務
  - label: B
    content: 夜店債主向甲索討未果，不可基於夫妻關係轉向甲妻請求清償債務
  - label: C
    content: 夜店債主向甲索討未果，可至甲妻小吃店取走值錢財物以抵償債務
  - label: D
    content: 夜店債主得以俗稱「父債子還」為由，請求甲之子女替父清償債務
  group_stem: 甲婚前生活奢華，積欠夜店逾百萬元債務多年不還，且在欠債時結婚，與妻未依法約定夫妻財產制，婚後共生一子兩女，其中長子經商有成，長女已出嫁，麼女未滿20歲。之後甲為了躲債離家出走，其妻則經營小吃店維生。
- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 甲離家出走不久即遭車禍身亡，有關甲婚前積欠夜店逾百萬元債務是否仍存在，以及是否該由其家人清償的問題，下列敘述何者正確？
  options:
  - label: A
    content: 積欠夜店債務由甲妻與長子長女負清償責任，未成年的麼女不必負責
  - label: B
