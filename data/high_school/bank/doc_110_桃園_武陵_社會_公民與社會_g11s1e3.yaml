  type: single
  page: 2
  stem: 請問旅客變更權，旅遊開始前改由第三人參加旅遊，保障旅客合理的權利，且旅遊營業人（例如旅行社)沒有正當理由，不可以拒絕，如果不符合法令規定或有不適於旅遊等正當理由可以拒絕，此凸顯何種概念？
  options:
  - label: A
    content: 契約自由
  - label: B
    content: 所有權絕對
  - label: C
    content: 私法自治原則
  - label: D
    content: 契約正義
  group_stem: '旅客的變更權—旅遊開始前改由第三人參加旅遊

    例如：A參加B旅行社的北非旅行團。旅遊開始之前，A因病、公事或甚至僅心情不佳，可改由親朋好友或其他第三人參加該團旅遊；B旅行社如沒有正當理由，不可以拒絕。

    依民法第514條之4第1項規定，在旅遊開始之前，旅客不能參加，可以變更由第三人參加旅遊。旅遊營業人(例如旅行社)沒有正當理由，不可以拒絕。旅遊營業人的「正當理由」，包括不符合法令規定或有不適於旅遊等情形，例如第三人沒有護照，或是以老年人代替青年人從事高危險的旅遊等。至於要在旅遊開始前多久變更，屬於定型化契約的應記載事項，依照當事人各個定型化契約的約定。如果因為改由第三人參加使費用增加時，旅遊營業人可以請求第三人支付增加的費用。(取自法律百科)'
