  stem: 上文提到同性婚姻透過收養產生親子關係，下列有關親子關係間的建立，何者敘述正確？
  options:
  - label: A
    content: 女嬰肉肉是同志喵喵的婚生子女，故屬於法定(擬制)血親
  - label: B
    content: 婚姻期間出生之小孩為婚生子女，不可改變其身分
  - label: C
    content: 因有撫育事實，即為任意認領的表示，視為婚生子女
  - label: D
    content: 「先有後婚」不能透過準正方式，視為婚生子女
  group_stem: '同性婚姻配偶成功收養配偶養女

    同志「圍圍」在婚前收養女嬰「肉肉」，但因法律規定，其配偶「喵喵」無法成為肉肉法律上的家人，兩人提起訴訟，法院近日裁定許可喵喵的收養聲請，全臺首個同志雙親無血緣收養家庭誕生。臺灣同婚專法過關後，同志雖得以辦理結婚登記，但在收養權利上仍有部分權利與異性戀者不同，依照現行收養規定，單身同志可以收養小孩，但結婚後，養子女卻無法被同性配偶收養，在法律上只能是陌生人。

    同婚團體彩虹平權大平臺今天在臉書貼文指出，大平臺協助3對有類似情況的同性配偶提起訴訟，圍圍與喵喵是其中一對，雖然同婚專法第20條有規定「一方收養他方之親生子女」時準用民法收養相關規定，但參照立法理由「鑑於成立第二條關係之雙方當事人有共同經營生活事實，為保障同性關係之一方親生子女之權益，應許他方得為繼親收養」，養子女的權益也應該要被納入，與親生子女擁有相同保障。法院在考量案件中孩子的最佳利益後，裁定喵喵可以正式收養他們兩人的女兒，但這個裁定的效果只對訴訟的當事人成立，沒有通案的法律效力，呼籲政府修法解決同志收養家庭的困境。

    獲得法院消息後，圍圍與喵喵也在臉書粉絲專頁貼文指出，「雖然我們這一案開了先例，但也僅適用個案」，因為三個案件，一審的結果不一樣，而這不一致的見解與裁定，更證明修法及釋憲的必要性。貼文也提到，「這也更證明，同志收養家庭的孩子，不應依家長的認同，或是是否親生，而有不公平的對待仍有許多的家，仍需要即刻修法，才能結婚，才能共同收養，才能擁有共同親權。」（取自中央社）'
