- id: doc_110_桃園_武陵_社會_公民與社會_g11s1e3_s1_35
  section: 1
  number: 35
  type: single
  page: 5
  stem: 關於上文，下列敘述何者正確？
  options:
  - label: A
    content: 「甲」指的是損賠賠償
  - label: B
    content: 「乙」指的是過失責任
  - label: C
    content: 「丙」指的是刑法
  - label: D
    content: 第二段「」畫線內容體現誠信原則
  group_stem: '◎不實廣告法律責任

    A從小到大外型一直圓滾滾，因為無法控制想吃美食的慾望，無法瘦下來。某日A看到網路廣告號稱食用產品後，保證在2個禮拜內瘦10公斤，A購買並食用後發現沒有效果。請問，A針對上述的不實廣告，有什麼法律上救濟方法？

    「企業經營者在銷售商品的廣告中，應描述商品真實效能，不能有誇大或不實情形，故消費者保護法第22條明文要求企業經營者銷售予消費者的商品與服務，品質不能低於銷售廣告的內容。

    實務上曾發生建商在預售屋的銷售廣告上，號稱並保證預售屋純屬住宅區，消費者相信廣告而購買，但房屋蓋好後，消費者卻發現房屋根本不可作為一般住宅使用，跟銷售廣告內容完全不一樣。此時建商即違反消費者保護法第22條的規定，消費者得依消費者保護法第51條向建商請求損害賠償，視具體個案中的廠商是故意或過失，而應賠償1到5倍的「甲」予消費者。

    如果企業經營者委託其他媒體經營者刊登或報導廣告，當媒體經營者知悉廣告內容與真實情形不符時，媒體經營者依法需與企業經營者負「乙」。

    消費者保護法是立法者為保護消費者權益而設的特別規定，屬於「丙」的特別法，因此，當消費者保護法的規定比「丙」更有利於消費者時，消費者可選擇主張消費者保護法以獲得更周全有利的保護。(取自法律百科)'
