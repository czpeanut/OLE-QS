  stem: 以下是某位泰雅族人的日記： 我叫做PisuiCiyo，Pisui是我的名字，Ciyo是我爸爸的名字。我能用自己的真正名字得感謝過去發起正名運動、爭取權益的人們。最近我的第一個孩子要出生了，但我太太不是原住民，我們對孩子的名字意見不同。我覺得，如果他的名字不符合《原住民身分法》的規定，他就沒有原住民的身分，這樣以後上學或就業，族裡的傳統祭典他都不能放假，只能自己請假，找工作也不是用《原住民族工作權益保障法》。我該怎麼辦呢?有朋友覺得應該上網連署請立委修法，只是會不會這樣又被批評是要爭取特權?請問關於這位泰雅族人煩惱的相關敘述，何者正確?
