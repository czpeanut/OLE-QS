  group_stem: '(五)某高中生於2020年底在「公共政策網路參與平台」提案將國高中上課時間改為9時30分到下午5時，並迅速通過附議門檻成案，附議人數在截止前達到1萬296人。教育部日前召開公聽會，多數發言的學生都主張，可先廢除早自習，或開放早自習自主參加，讓學生獲得充足睡眠。

