  stem: 根據紀田順一郎所著《近代事物起源事典》，德川幕府掌權的江戶時代，日本人幾乎不吃牛肉。明治維新後，天皇派人出國考察歐洲各國強盛的原因，其中一項結論是，洋人吃牛肉才有身強體健。因此天皇於1871年起為全民表率喝起牛奶，第二年就連牛肉也吞下肚了。從此之後，日本年輕人將吃牛肉視為文明的表徵，開始流行各項牛肉料理。但當時日本的老人家看到子孫吃牛肉，彷彿犯了心靈不潔之罪，趕快到神龕上香懺悔謝罪。請問關於明治維新時期日本吃食牛肉的文化，下列敘述何者正確？
