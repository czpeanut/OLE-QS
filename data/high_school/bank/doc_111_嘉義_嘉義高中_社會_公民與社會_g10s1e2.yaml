- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e2_s2_48
  section: 2
  number: 48
  type: single
  page: 6
  stem: 從媒體識讀角度檢視，選文中衛生棉廣告呈現月經之方式，最主要存在下列何項爭議？
  options:
  - label: A
    content: 廣告形塑低收與中低收入戶女性買不起衛生棉的既定刻板印象
  - label: B
    content: 廣告商未能善盡查證責任，在廣告中傳遞錯誤的月經醫學知識
  - label: C
    content: 廣告以隱晦遮掩的方式呈現月經，可能形成社會對月經的污名
  - label: D
    content: 廣告商對月經貧窮問題持特定立場，使立委提出修法加以改革
  group_stem: '(六)月經貧窮(PeriodPoverty)是指女性無法負擔生理用品費用，導致月經期間無法上學，減損受教育機會，因而在健康、教育、工作等各層面身處劣勢的現象。然而，月經貧窮的爭議並非僅發生在低度開發國家，根據國際組織的調查顯示，英國有百分之十的女性完全無法負擔生理用品，因為許多歐洲國家將女性生理用品視為「奢侈品」，需要課徵較高額的稅率。不過，在許多人的倡議之下，不少國家的政府開始著手推行相關的政策。

    第一種改革方向便是取消對女性生理用品課稅。最近幾年，有越來越多歐洲國家開始將女性生理用品列為「生活必需品」，與其他必需品一樣僅課徵5%的消費稅，也有部分國家已將月經用品列為免稅用品範圍，例如愛爾蘭、肯亞、加拿大、澳洲、馬來西亞與印度等。第二種改革方向，則是由學校免費為女學生提供生理用品，包括英國、印度、紐西蘭等國家都有這樣的政策，2020年11月，蘇格蘭議會甚至以全數同意的壓倒性票數通過《生理期用品免費供應法》(以下簡稱法案甲)，宣布地方政府將全面免費供應女性生理用品。

    我國立委則於同年5月提案修法(以下稱法案乙)，規定地方政府須對低收與中低收入戶女性提供生理用品補助。同年10月，立委亦提案修改《加值型及非加值型營業稅法》，將衛生棉、棉條、護墊、月亮杯等生理用品列入免營業稅清單，目前已一讀通過。'
