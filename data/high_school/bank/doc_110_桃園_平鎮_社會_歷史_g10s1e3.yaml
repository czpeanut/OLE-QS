- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 近年臺海兩岸都在積極開拓對外貿易，現今兩岸雙方都已是下列哪個國際組織的成員，且兩岸也被其要求必須完全開放國内市場，以走向國際化、自由化？
  options:
  - label: A
    content: 聯合國(UN)
  - label: B
