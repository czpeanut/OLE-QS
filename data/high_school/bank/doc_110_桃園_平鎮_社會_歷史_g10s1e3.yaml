- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 日本治臺後，隨著國際市場需求的改變，甲物的重要性大增──原因在於日本常以大量外匯購買○物，如今可改從臺灣進口。總督府為此給予日商優惠，使日資來臺興建新式工廠，使臺灣農業走向新舊並存型態。○物是？
  options:
  - label: A
    content: 蔗糖
  - label: B
    content: 樟腦
  - label: C
    content: 茶葉
  - label: D
    content: 蓬萊米
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 日本治臺期間，曾特別成立一項機構。此項機構的成立，除了首次將近代金融制度引進臺灣成為日本在臺灣發展資本主義的「基礎工程」，更可「開發臺灣富源，謀求經濟發展……同時逐漸為我國人（日本人）在臺灣辦理事業給予方便」，請判斷此項機構為何？
  options:
  - label: A
    content: 專賣局
  - label: B
    content: 臺灣銀行
  - label: C
    content: 農民信用合作社
  - label: D
    content: 郵局
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 這是臺灣戰後經濟出現的第二波外資湧入潮，無論投資的件數與金額都顯著的增加，此時的臺灣無論在人才與生產技術方面都到達足以吸引外資來從事跨國分工，終於跳脫所謂「夕陽產業』的外資投資型態。根據上述内容，此時期臺灣經濟發展的特色應為
  options:
  - label: A
    content: 此時期政府鑑於國内產業無法與外資競爭的考量下，決定對於原料及機器設備課徵相當高的貨物稅與關稅
  - label: B
    content: 此時期政府為加速鼓勵外資投資臺灣，決定制定「獎勵投資條例」來取代已實行三十多年的「促進產業升級條例」
  - label: C
    content: 此時期政府開始對應的政策，推動「自由化」與「國際化」：如加入國際經濟組織，「資本自由化」與「開放服務業給外商」等政策推波助瀾
  - label: D
    content: 此時期政府所扶持的重點產業為重工業，如石化業等，以吸引外資進人臺灣
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 國際經濟的景氣與否，常影響臺灣的經濟前景，例如民國六十二年及民國六十四年世界經濟先後亮燈衰退，臺灣也面臨產業出走，出口大幅衰退的嚴峻考驗。針對這段歷史下列敘述何者符合事實？
  options:
  - label: A
    content: 政府設置「新竹科學園區」，解決了當時的困境
  - label: B
    content: 當時行政院院長蔣經國，採行的因應政策是擴大公共投資
  - label: C
    content: 受到兩伊戰爭的影響，雙方皆以提高油價為手段，造成能源危機的衝擊
  - label: D
    content: 因為美國與中共往來，無法再對臺灣提供「美援」
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 吳濁流短篇作品《三八淚》中，描述一位辛苦賺錢、捨不得花用，也從未注意物價與幣值波動的牛皮哥，原以為錢是越存越多，背了一大箱舊臺幣，結果只換得四十元的震撼，據此内容判斷這篇故事的時代背景？
  options:
  - label: A
    content: 日本在臺灣確立殖民體系時期
  - label: B
    content: 第二次世界大戰時期
  - label: C
    content: 政府在國共内戰末期準備遷臺
  - label: D
    content: 1970年代石油危機造成的衝擊
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 附圖是1868～1895年臺灣甲、乙兩大國際港口質易出口值的比較圖，可以看出甲港雖然發展初期不如乙港，但1880年代後超越了乙港。請問甲港、乙港分別為哪個港口？
  options:
  - label: A
    content: 甲：淡水、乙：鹿港
  - label: B
    content: 甲：淡水、乙：打狗
  - label: C
    content: 甲：打狗、乙：淡水
  - label: D
    content: 甲：鹿港、乙：打狗
