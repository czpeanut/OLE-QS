  stem: 文中提及「全世界年輕人喝的都是可口可樂，唱的都是英文歌，請問我們自己的歌在哪裡？」就你的歷史理解，當時可能是什麼原因造成臺灣年輕人風靡英文歌曲、喝可口可樂的主要原因？
  options:
  - label: A
    content: 韓戰之後，美軍駐臺，順勢帶入西方文化，舉凡文學、歌曲、思想等，興起一股西化的風潮
  - label: B
    content: 由於二戰結束，政府因為反對日本文化，故積極推動西化運動以取代之
  - label: C
    content: 冷戰時期，由於歐美和蘇聯進行文化抵抗，藉由輸入西方主流文化，潛移默化以抵抗共產勢力
  - label: D
    content: 蔣中正採取親美抗共的外交政策，積極導入關於美國文化的相關事物進入臺灣
