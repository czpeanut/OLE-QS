  - label: C
    content: 歐洲聯盟(EU)
  - label: D
    content: 亞太經濟合作會議(APEC)
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 根據統計，1920年代後期，臺灣的稻米年平均產量比前期增加了近16萬公噸，但同時期臺灣人每年每人稻米平均消費量卻下降了約七公斤。此現象顯示的事實是
  options:
  - label: A
    content: 臺人的消費行為出現轉變
  - label: B
    content: 臺灣的經濟發展出現衰退
  - label: C
    content: 因為美援，政府鼓勵多吃麵少吃米
  - label: D
    content: 臺農將稻米銷日以換取利潤
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 在二次大戰結束前，甲是臺灣最重要的國策公司，它推行日本帝國主義的國家政策。是殖民經濟中心。戰後，甲像蒸氣一樣消失不見了。事實上甲成立於1936年，最初幾年，集中經營臺灣的事業，大部分與農業與土地開發有關。太平洋戰爭開始後，事無開始擴展至東南亞及南支那等地。請間：甲是指哪一個機構？
  options:
  - label: A
    content: 臺灣銀行
  - label: B
    content: 臺灣拓殖株式會社
  - label: C
    content: 臺灣電力公司
  - label: D
    content: 臺灣菸酒公賣局
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 「甲國」商人派了兩艘船，載著東南亞等地的貨物及禮物，首度來到臺灣。鄭經盛大款待「甲國」商人，回贈禮物。雙方洽商顯得相當愉快，之後，訂定臨時通商協議。鄭經要求「甲國」商人一年付五百銀元，租用商館，為了鼓勵「甲國」商人將臺灣商品出口到國外，出口可以免稅，進口商品賣出後要繳3%稅。請問；「甲國」是
  options:
  - label: A
    content: 法國
  - label: B
    content: 荷蘭
  - label: C
    content: 西班牙
  - label: D
    content: 英國
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 爺爺說：「早期臺灣的水利設施十分簡單，使用年限都不長，灌溉面積也不大，因此多數的田地仍是屬於聽天由命的『看天田』耕作方式，但後來有一個外國人興築了一個水利工程，啟用後可灌溉十五萬甲農地，改變了當地原本『看天田』，的耕作型態，是當時東亞最大的水利工程。」爺爺指的是哪一個工程？
  options:
  - label: A
    content: 嘉南大圳
  - label: B
    content: 桃園大圳
  - label: C
    content: 八堡圳
  - label: D
    content: 曹公圳
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: EMU100型自強號是臺灣鐵路局為因應鐵路電氣化，向英國購買的第一代電聯車組。請問：「鐵路電氣化」是臺灣哪一階段的經濟政策之一？
  options:
  - label: A
    content: 第一次進口替代時期
  - label: B
    content: 出口擴張時期
  - label: C
    content: 第二次進口替代時期
  - label: D
    content: 產業外移與產業升級
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 〈孤女的願望〉一曲寫實地描述當代人的生活與願望，歌詞中唱著：「請問路頭的田庄阿伯啊！人家說臺北繁華都市，是對叨去……我想要來去臺北做女工打拼赚錢……」由現代眼光來看，非常能反映當時的社會變遷。請間：此曲創作的年代是何時？
  options:
  - label: A
    content: 1940-1950年代
  - label: B
    content: 1960-1970年代
  - label: C
    content: 1980-1990年代
  - label: D
    content: 2000-2010年代
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 根據大湖鄉誌中的記載，大湖自開港以來數百年，列入「名人」名單共有42人，其中因樟腦產業致富者就占了14人，……樟腦產業使客家人的社經地位因此提升，這種現象全臺皆然。請問：此現象形成的背景為何？
  options:
  - label: A
    content: 頂下郊拼中，客家人協助官方平亂，清廷特予客家人樟腦專賣權
  - label: B
    content: 清代前期，由於客家人勇猛善戰，配合官方擊退高山族，因此獲得樟腦開發權
  - label: C
    content: 開港通商後，茶及樟腦的需求增加，促進山區開發，客家人社經地位因此提升
  - label: D
    content: 清治前期實施劃界封山，不准閩南人進入山區，但對客家人並無限制，使客家人得以掌握樟腦利權
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「本藩已手闢草昧，與爾文武各官，及名鎮大小將領，官兵家眷，盡來胥宇，總必創建田宅等項，以遺子孫計，但一勞永逸，當以己力經營，不准混侵土民及百姓現耕物業」。關於這段史料的說明，下列何者符合史實？
  options:
  - label: A
    content: 此為顏思齊、鄭芝龍來臺開墾之初對其部屬所發布的政令
  - label: B
    content: 此為鄭成功來臺後對土地拓墾事宜所頒布的宣諭
  - label: C
    content: 按照當時的拓墾制度，土地可分為王田、官田與營盤田
  - label: D
    content: 當時的農業特別重視茶葉的生產，以便大量外銷充裕財政收入
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 臺灣文學研究學者葉石濤教授談到某位文學家時寫道：「□□的文學，簡單一句話說，就是反抗的文學……他出現時，小說的形式才宣告完成。」這位為窮人看病不收錢的「彰化媽祖婆」堅持用漢文完成臺灣的新文學，因而有「臺灣新文學之父」的美譽。請間：文中的□□應填入下列何者？
  options:
  - label: A
    content: 蔣渭水
  - label: B
    content: 江文也
  - label: C
    content: 賴和
  - label: D
    content: 黃土水
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 2
