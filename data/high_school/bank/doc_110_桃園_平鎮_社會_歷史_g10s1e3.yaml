  stem: 關於臺灣自荷治時期以來的土地開墾情形，下列敘述何者正確？
  options:
  - label: A
    content: 荷人以優厚條件招募漢人來臺開墾，並且始終善待開墾者，使土地開墾大增
  - label: B
    content: 鄭氏在臺灣行軍屯、官民開墾，不但解決糧食問題，開墾範圍面積更為增加
  - label: C
