  stem: 在李雙澤的宣傳鼓舞之下，此時期的臺灣社會正開始流傳哪一類別的歌曲？
  options:
  - label: A
    content: 唱自己的歌，校園民歐
  - label: B
    content: 反共抗俄，英勇愛國歌曲
  - label: C
    content: 反威權體制，原住民族部落歌
  - label: D
    content: 鄉土情懷，懷舊閩南語歌
  group_stem: ◎一位名叫李雙澤的有志青年，於1975年淡江大學民謠演唱會上，代替音樂大師胡德夫上場，看到當時所有演出者唱著西洋歌曲，心中已按捺不住情緒。等到他上場時，他先擲破一瓶可口可樂，接著大聲對臺下群眾說：「我從菲律賓到臺灣，到美國，到西班牙，全世界年輕人喝的都是可口可樂，唱的都是英文歌，請問我們自己的歌在哪裡？」過去他的作品《美麗島》與《少年中國》，送交審核都未通過，《美麗島》因曾為黨外人士傳唱而被判定有臺獨意識，《少年中國》則由於被統派人士傳唱而判定親共。請問：
