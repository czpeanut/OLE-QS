questions:
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 一位臺灣長官上奏皇帝時說道：「漳泉内地没有戶籍的人民，無田可耕、無工可僱、無食可覓，一旦到了臺灣，上可以致富，下可以溫飽，一切農工商賈以及百藝之末，按照工資、生產商品等酬勞，都比内地超過好幾倍。」此一史料最適合用來描述臺灣哪一時期的發展？
  options:
  - label: A
    content: 荷治時期引進漢人開墾王田
  - label: B
    content: 鄭氏時期官民積極開發土地
  - label: C
    content: 臺灣開港後的經濟轉變
  - label: D
    content: 清治初期原鄉移民的拉力
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 日本為達到「農業臺灣，工業日本」的經濟政策，其措施下列何者正確？
  options:
  - label: A
    content: 首先完成日月潭水庫，作為當地灌溉用水
  - label: B
    content: 稻米採原料採取區域制，必須賣給總督府指定的廠商
  - label: C
    content: 積極推動新品種，新技術改良的綠色革命
  - label: D
    content: 要求民間出資興修水利及嘉南大圳
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 史家黃富三認為：「臺灣一進入歷史時期、即躍入以貿易為導向的海洋文明體系……由○○充當『首動者』角色，貿易竟成了日後臺灣歷史與社會發展的持續性特色。」請問：○○中應填入哪一個勢力？
  options:
  - label: A
    content: 鄭成功
  - label: B
    content: 荷蘭
  - label: C
    content: 西班牙
  - label: D
    content: 日本
- id: doc_110_桃園_平鎮_社會_歷史_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 施琅〈邊患宜靖疏〉謂：「伏思賊黨盤據臺灣，沃野千里，糧食匪缺，上通日本，下達呂宋、廣南等處，火藥軍器之需，平帛服用之物，貿易備具。」可見鄭成功能整軍經武，與滿清抗衡，主要是靠下列何者？
  options:
  - label: A
    content: 軍力強大
  - label: B
    content: 海上貿易
  - label: C
    content: 人才濟濟
  - label: D
    content: 當地原民族為其助力
