  stem: 今日許多高科技電子產品的製造廠商採取先接訂單再製造的「即時生產模式」，避免大量庫存，同時提高企業在研發與行銷上的投資，以追求產品功能或型態樣式的持續創新，藉助媒體與網路管道的大量宣傳，推陳出新以吸引消費者購買產品。上述研發、製造與行銷策略的採用，與下列哪項因素的關係最為密切？
