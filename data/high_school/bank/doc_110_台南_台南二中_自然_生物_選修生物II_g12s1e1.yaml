  stem: 如附圖：「將一株充分澆水的盆栽植物（如向日葵），於距離土壤表面約10公分處將莖切斷，在莖的切口處密合接上一條直徑約與莖同樣大小的透明橡皮管，管中裝有適量的染料溶液，橡皮管另一端再接上一支有刻度的玻璃管，染料溶液的液面與玻璃管下方的刻度齊。澆水使土壤保持適當溼度，數小時之後，玻璃管中的液面就會逐漸上升。」試問此液面的上升，是由何種作用所導致的？
  options:
  - label: A
    content: 根壓
  - label: B
    content: 光合作用
  - label: C
    content: 毛細作用
  - label: D
    content: 蒸散作用
