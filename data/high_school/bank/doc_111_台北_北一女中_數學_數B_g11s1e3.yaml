  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：反例：$\vec{a}$＝（1，0），$\vec{b}$＝（2，0），$\vec{c}$＝（0，1）

    則找不到 x，y 使得$\vec{c}$＝x$\vec{a}$＋y$\vec{b}$

    (B)╳：反例：$\vec{a}$＝（1，0），$\vec{b}$＝（2，0）⇒$\vec{a}$＋$\vec{b}$＝（3，0）

    ⇒∣$\vec{a}$＋$\vec{b}$∣＝3＝∣$\vec{a}$∣＋∣$\vec{b}$∣

    (C)○：∣$\vec{a}$＋$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋2$\vec{a}$．$\vec{b}$＋∣$\vec{b}$∣$^{2}$

    又∣$\vec{a}$＋$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$＋∣$\vec{b}$∣$^{2}$

    ⇒ 2$\vec{a}$．$\vec{b}$＝0 ⇒$\vec{a}$⊥$\vec{b}$

    (D)╳：反例：$\vec{a}$＝（1，0），$\vec{b}$＝（0，1），$\vec{c}$＝（0，2）

    ⇒$\vec{a}$．$\vec{b}$＝$\vec{a}$．$\vec{c}$＝0，但$\vec{b}$≠$\vec{c}$

    (E)╳：∣$\vec{a}$－2$\vec{b}$∣$^{2}$＝∣$\vec{a}$∣$^{2}$－4$\vec{a}$．$\vec{b}$＋4∣$\vec{b}$∣$^{2}$

    ≠∣$\vec{a}$∣$^{2}$－4∣$\vec{a}$∣∣$\vec{b}$∣＋∣$\vec{b}$∣$^{2}$

    故選(C)'
