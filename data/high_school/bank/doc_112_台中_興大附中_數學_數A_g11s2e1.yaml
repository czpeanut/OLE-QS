- id: doc_112_台中_興大附中_數學_數A_g11s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小延參加短距離徑賽以蹲踞式起跑，當聽到裁判下達預備口令時，逐漸抬起臀部，讓身體重心向前上方移動，使後腿部的髖關節在點 A（0，1，2＋$\sqrt{3}$），且後腳膝關節在點 O（0，0，0），同時後腳踝關節在點 B（0，－2－$\sqrt{3}$，－1），參考如右圖所示。此時∠BOA 等於多少度？
  options:
  - label: A
    content: 105°
  - label: B
    content: 120°
  - label: C
    content: 135°
  - label: D
    content: 150°
  - label: E
    content: 以上皆非
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_112_台中_興大附中_數學_數A_g11s2e1/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 414.4
      - 131.6
      - 564.3
      - 235.45
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 'cos∠BOA＝$\frac{\vec{OA} \cdot \vec{OB}}{| \vec{OA} | | \vec{OB} |}$＝$\frac{(0 , 1 , 2+\sqrt{3}) \cdot (0 , -2-\sqrt{3} , -1)}{\sqrt{0^{2}+1^{2}+(2+\sqrt{3})^{2}}\sqrt{0^{2}+(-2-\sqrt{3})^{2}+(-1)^{2}}}$

    ＝$\frac{-4-2\sqrt{3}}{8+4\sqrt{3}}$＝$-\frac{1}{2}$

    ∴∠BOA＝120°

    故選(B)'
