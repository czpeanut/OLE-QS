  section: 4
  number: 1
  type: calc
  page: 4
  stem: '■ 如右圖所示，金字塔 A-BCDE，其中底面是邊長為 2 的一個正方形，四個斜面皆為相同大小的等腰三角形（其腰長皆為 3）。若點 A 在平面 BCDE 的投影點為 H，試回答下列問題。

