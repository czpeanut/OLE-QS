  options:
  - label: A
    content: 甲乙丙中獎機率一樣，但丁中獎的機率不同於甲乙丙的中獎機率
  - label: B
    content: 只有乙中獎的機率為$\frac{3}{7}$
  - label: C
    content: 甲中獎且乙中獎的事件的機率為$\frac{1}{7}$
  - label: D
    content: 甲中獎的事件與乙中獎的事件為獨立事件
  - label: E
    content: 在甲中獎的條件下，丙也中獎的條件機率為$\frac{1}{7}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)╳，P(甲中)＝$\frac{C_{1}^{3}}{C_{1}^{7}}=\frac{3}{7}$，P(乙中)＝$\frac{C_{1}^{3}\cdot P_{1}^{6}}{P_{3}^{7}}=\frac{3}{7}$，P(丙中)＝$\frac{C_{1}^{3}\cdot P_{2}^{6}}{P_{3}^{7}}=\frac{3}{7}$，P(丁中)＝$\frac{C_{1}^{3}\cdot P_{3}^{6}}{P_{4}^{7}}=\frac{3}{7}$ 每人中獎機率一樣 (B)╳ (C)○，P(甲中，乙中)＝$\frac{C_{1}^{3}\cdot C_{1}^{2}}{P_{2}^{7}}=\frac{1}{7}$ (D)╳，P(甲中，乙中)≠P(甲中)·P(乙中) (E)╳，P(丙中$^{ }$|$^{ }$甲中)＝$\frac{\frac{C_{1}^{3}\cdot C_{1}^{2}\cdot P_{1}^{5}}{P_{3}^{7}}}{\frac{3}{7}}=\frac{1}{3}$ 另：甲乙丙中機率＝$\frac{C_{1}^{2}\cdot P_{1}^{5}}{P_{2}^{6}}=\frac{1}{3}$ 故選(C)。
