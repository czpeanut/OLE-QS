  section: 1
  number: 18
  type: single
  page: 2
  stem: 臺灣的瘧疾防治是項大工程，總督府時期即有系統的管制，戰後則借助外國團隊的資源與經驗投入研究，終於在1965年根除這項傳染病。請問下列對臺灣撲瘧的描述何者正確？
  options:
  - label: A
    content: DDT殺蟲劑被運用在撲滅病媒
  - label: B
    content: 外國團隊指的是美國與日本兩國的援助
  - label: C
    content: 二戰後臺灣的瘧疾死亡率逐年下降
  - label: D
    content: 臺灣最終藉由疫苗終結瘧疾的傳播
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 資料一：「後世稱華佗為外科始祖，他以自創的麻沸散為病人麻醉，接著將其患部切除再縫合。與現代醫學的手術概念相似。」資料二：「中國『身體髮膚，不敢毀傷』的全屍文化，不易對人體有精密的認識。當西洋醫學傳入中國，中國人宣揚西醫以外科見長，中醫內科獨勝乃順理成章。最近有人想要發揚中國醫學潛藏的幽光，然而涉及胸腹腔大體解剖的外科史料，幾乎都屬於神話傳說，不能太當真。大手術需有相應的麻醉、消炎和器具方才可能。」綜合上述兩份資料所要表達的訊息與下列哪一選項最為接近？
  options:
  - label: A
    content: 中國醫學發展在華佗過世後趨於停滯
  - label: B
    content: 東漢時期中國醫學領先世界其他地區
  - label: C
    content: 華佗開刀的記載可能摻雜誇大的部分
  - label: D
    content: 由於醫者可以救人性命，故中國的解剖醫學受到傳統文化的提倡
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 電視是二十世紀經濟繁榮的象徵之一，關於電視的發明與影響下列敘述何者符合史實？
  options:
  - label: A
    content: 逐漸取代電影成為家庭的主要娛樂
  - label: B
    content: 電視的出現導致廣播逐漸銷聲匿跡
  - label: C
    content: 1950年代的電視已經是全球性商品
  - label: D
    content: 電視屬於大眾文化因此不受政治干預
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 下列何者是日本醫學受傳統中醫所產生的影響？
  options:
  - label: A
    content: 設置完整制度的中醫醫院
  - label: B
