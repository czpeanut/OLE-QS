  stem: 以下是一本醫學史著作中擷取的一段敘述：在1880年代通過甲運河的船隻總噸位當中，乙國船隻就占了百分之八十。乙在1875年取得甲運河的主要股權與控制權，並且希望完全廢除檢疫制度，代之以對船隻的醫學檢查。……乙國人理解到，實施任何的檢疫制度都會妨礙運河的自由通行，而如果不能確保來自印度與澳洲的船隻自由通行，乙國政府預計投資高達八百萬金額的運河價值將會急遽減少。請問關於這段敘述，下列選項何者正確？
