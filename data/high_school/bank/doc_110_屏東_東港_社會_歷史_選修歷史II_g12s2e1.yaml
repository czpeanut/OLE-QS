  stem: 某書中提及哥倫布登上美洲，描寫到「最重要的是一趟航行裡，對世界帶來的巨大變化反映在生物、政治、社會等各種面向。例如美洲作物傳播至世界其他地區後養育了大量人口，或是西方世界的疾病對美洲人口造成的衝擊，跟以往只著眼於歐洲為主的歷史有相當不一樣的觀點。」從這些文字可理解這段文字所要強調的重點為何？
  options:
  - label: A
    content: 文化多樣性觀點
  - label: B
    content: 以美洲原住民族為主體的歷史觀
  - label: C
    content: 結合文獻與考古資料的歷史解釋
  - label: D
    content: 以西方開拓角度書寫的歷史觀點
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某時期發展「皇漢醫道復活運動」，企圖爭取逐漸遭到政府消極處理的漢醫合法地位，請問應是？
  options:
  - label: A
    content: 荷治時期
  - label: B
    content: 清治後期
  - label: C
    content: 日治時期
  - label: D
    content: 戰後臺灣
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 中國東北在1910年爆發嚴重的鼠疫，當時的醫生伍連德解剖染疫死者，得知鼠疫是藉由飛沫傳播鼠疫桿菌而致病後，立刻關閉所有往東北的鐵路，並設計中間隔有吸水藥棉的雙層紗布口罩讓當地民眾戴上，成功使死亡率大幅下降。請問下列對伍連德防疫措施的理解何者正確？
  options:
  - label: A
    content: 首次引入西方的防疫措施
  - label: B
    content: 中國首次推展公共衛生政策
  - label: C
    content: 藉由禮教常規穩定疫情
  - label: D
    content: 受瘴氣論影響致力環境清潔
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 日本法學家曾在1917年發表一段文章於<u>日本於歐洲戰亂的地位</u>，他認為從這次大戰中得到的最佳教訓就是，光是眾多的人口和富饒的金錢，無法保證能夠取得戰爭的最終勝利，日本國內必須能夠對戰備、物資自給自足，他更提到以當時日本的情況，肯定完全無法因應之後的戰爭。因為日本國內不產鐵，煤炭的產量也少，難以生產戰爭所需要的裝備用品。所以當務之急就是，確保充分的鐵和煤炭量，並建立軍需品獨立制度和經濟組織。請問下列關於這段文字的理解，何者正確？
  options:
  - label: A
    content: 文中所指的「大戰」為第二次世界大戰
  - label: B
    content: 在二十世紀，能源的供應左右國力強弱
  - label: C
    content: 上文顯示軍需品自給自足的基礎是人口
  - label: D
    content: 不同時代戰勝的關鍵都在於人口與財富
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 十九世紀帝國主義擴張，西方列強透過達爾文的學說理論，衍伸出社會達爾文主義，藉此合理化自身的擴張侵略，宣稱是符合自然法則的行為。根據你的歷史知識，達爾文理論的何種特色成為列強侵略的依據？
  options:
  - label: A
    content: 提出遺傳模式，證明民族的強弱差別是因為遺傳導致
  - label: B
    content: 細胞構成組織、器官與個體，人類也應該團結合作才能共榮
  - label: C
    content: 身為強者，有義務保護群體中的弱小同伴不被其他國家侵略
  - label: D
    content: 天擇概念、適者生存，歐洲人種優越才能征服其他地方
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 從西漢時期的<u>邸報</u>，古羅馬的<u>每日紀事</u>到1622年英國的<u>新聞周刊</u>以及十九世紀以後上海的申報、臺灣的<u>臺灣日日新報</u>來看，報刊的發展具有下列何種特徵？
  options:
  - label: A
    content: 報業從民間興盛開始，而後逐漸受到政府的重視
  - label: B
    content: 印刷術和自動排版的發明，使報紙得以大量產製
  - label: C
    content: 報刊的美觀漸受重視故多是單張印刷、手寫的內容
  - label: D
    content: 商業廣告的出現象徵報紙漸與傳達政令的功能脫離
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 驛傳制度在清朝歷經了強化與衰敗，下列關於這項制度在此時期的特徵何者為是？
  options:
  - label: A
    content: 因為是官方管道故皆以蒙古人擔任相關官員
  - label: B
    content: 雍正開始嚴格規定只有軍國大事才能使用驛站
  - label: C
    content: 設軍機處後詔令經兵部傳發驛站使傳播更有效率
  - label: D
    content: 清中葉後對通訊的需求減少是此制度崩壞的原因
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 玉米在中國之相關記錄如下。資料一：「玉米自西方循陸路來到中國，作為突厥人的貢品，最早記錄為1555年。」資料二：「玉米搭乘貨船走海路到中國福建，奧古斯丁修會會士提到1577年見到當地農民種植玉米。」關於上述兩則資料，下列選項何者正確？
  options:
  - label: A
    content: 根據兩則資料所提及的時間點，玉米在明朝時已經傳入中國
  - label: B
    content: 資料一與資料二時間略有差異，且傳播途徑亦不相同，故其中必有一為假
  - label: C
    content: 資料一所提及之突厥人，應是元朝遺民遷徙後形成之新民族
  - label: D
    content: 資料二所提及之海路，應是麥哲倫自美洲橫越太平洋之航海路徑
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 人類在十七世紀開始了對電的研究，電在之後的幾個世紀中扮演重要角色，下列關於電的歷史，何者為是？
  options:
  - label: A
    content: 富蘭克林收集到電後成功儲存在電池中
  - label: B
    content: 愛迪生發明電燈的那一年被視為「電的元年」
  - label: C
    content: 法拉第的發明是將電能轉換成機械能
  - label: D
    content: 西屋公司在英國建立第一座發電廠
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 資料一：1804年黑人起義建立海地共和國之前，聖多明尼克是全球最大的咖啡和蔗糖產地，而在咖啡的新產區中，維持最久的是荷蘭殖民的爪哇。資料二：十九世紀中葉，由於咖啡的需求上升，導致委內瑞拉的可可產業衰敗。透過二則資料以及你對大航海時代之後貿易發展的理解，下列何者正確？
  options:
  - label: A
    content: 題幹提及歐洲殖民國家將歐陸原生作物引入到更適合種植的區域
  - label: B
    content: 題幹的三種作物生產中心轉移的原因不盡相同
  - label: C
    content: 咖啡與甘蔗彼此具有競爭性
  - label: D
    content: 共有殖民地才有種植咖啡、可可
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 十八世紀法國孟格菲兄弟首次成功將熱氣球升空開始，人類亟欲飛上天空，直到二十世紀才有突破性的發展，下列關於這段歷史的敘述何者正確？
  options:
  - label: A
    content: 飛機一開始即運用在運送旅客上
  - label: B
    content: 飛船曾加入一戰的作戰行列
  - label: C
    content: 一戰時飛機用於載運炸彈
  - label: D
    content: 一戰後噴射客機的出現即是航空業興盛之始
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 資料一：認識動植物的出現和分布狀況之後，接下來人才有能力決定人要對環境形成什麼影響。資料二：班克斯爵士認為，南半球大多數地方要比北半球同緯度冷十度左右，所以他認為澳洲雪梨附近的博特尼灣應該要像法國南部的土魯斯一樣氣候宜人，便在當地種植起柑橘、石榴、杏桃和蜜桃。關於兩則資料的理解，何者正確？
  options:
  - label: A
    content: 從資料一的敘述可以推論人藉由觀察並了解如何改變環境以培育物種
  - label: B
    content: 資料二所述之水果，生長條件相對惡劣
  - label: C
    content: 兩則資料都提到殖民者由於科技發展，移植了合乎舊世界生長條件的農作物
  - label: D
    content: 兩則資料的出發點皆為要先判環境的條件
- id: doc_110_屏東_東港_社會_歷史_選修歷史II_g12s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 學者主張「可馴化的動物是有局限的」，在這個理論基礎下，美洲因為可以馴化的動物不多，所以大航海時代後，歐洲人為滿足自己的生活需求，大量引入已馴化的物種至美洲導致該地環境發生變化。與此同時，從歐洲引入已馴化物種，也增加美洲的生物基因庫。請問：根據以上敘述，我們可以有何推論？
  options:
  - label: A
    content: 美洲並沒有原生的可馴化動物
  - label: B
    content: 歐洲人為提高生物多樣性而引進物種到美洲
  - label: C
    content: 歐洲引入美洲的物種可能改變美洲的地貌
  - label: D
    content: 動物會適應新環境，故物種交換對動物而言沒有難度
