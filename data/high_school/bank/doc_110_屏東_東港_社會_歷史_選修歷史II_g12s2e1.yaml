  section: 1
  number: 16
  type: single
  page: 2
  stem: 葛洪<u>肘後方</u>和陶弘景<u>本草經集注</u>是在何時傳入韓國並與本土醫學融合成「東醫」？
  options:
  - label: A
    content: 先秦
  - label: B
