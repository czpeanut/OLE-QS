  stem: 1950到1960年代，因為高產量的稻米種子被廣泛在印度栽種，而大幅提高單位產量，稱作「綠色革命」。然而，這些「奇蹟的種子」高度倚賴化學肥料、大量灌溉，導致一些地區因為過度開發水源而使地下水位下降、土壤鹽鹼化，無法耕作，化肥農藥也汙染河水。綠色革命提倡的大規模單一化栽培，也導致生態系統的破壞。不僅如此，由於種子、農耕機械、肥料都需要大量資金，讓印度實施綠色革命最成功的旁遮普地區，農民的負債率與破產比率遠高於其他省。在綠色革命過程中，貧窮與缺少耕地的農民，占全部印度農民的四分之三，這些人卻被政府拋到腦後。這些都證明所謂綠色革命，不過是讓有錢的都市消費者在超市裡有更便宜的選擇而已。請問：上文作者對綠色革命的態度為何？
  options:
  - label: A
    content: 闡述綠色革命的優缺點來呼籲可能發生的後果
  - label: B
    content: 批判綠色革命背後隱含的巨大代價與黑暗面
  - label: C
    content: 批評綠色革命是殖民以及帝國主義的延續
  - label: D
    content: 透過農民艱苦不易的過程彰顯綠色革命的偉大
