  section: 1
  number: 17
  type: single
  page: 2
  stem: 漢代人們認為瘟疫的產生與超自然力量有關，此想法衍生什麼樣的防疫措施？
  options:
  - label: A
    content: 加強公共衛生
  - label: B
    content: 配戴裝滿香草的面具
  - label: C
    content: 請巫者舉辦儀式
  - label: D
