  stem: 以下為一段近年針對基因改造食品的論述：某位科學家在1999年時，餵食基改玉米花粉給蝴蝶幼蟲，四天之後一半的幼蟲死亡，對照組是餵食非基改的玉米花粉，結果全數存活。兩年後，這項研究受到許多研究公開駁斥其結果。2007年，另一位科學家提出基因改造玉米會破壞環境生態，也受到學界鋪天蓋地的批評。針對這種項象，請問我們可以如何理解？
