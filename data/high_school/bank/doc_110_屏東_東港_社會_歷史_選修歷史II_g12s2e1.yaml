  page: 2
  stem: 下列關於玉米的敘述，何者正確？
  options:
  - label: A
    content: 玉米原產地為非洲，後由西班牙人引進歐洲
  - label: B
    content: 中國古代曾稱呼其為苞穀，但因其美味而價格不斐故沒有廣泛流傳
  - label: C
    content: 玉米產量高卻不容易生長，需要良好的培養環境
  - label: D
    content: 古代馬雅人以玉米為主食，並有祈求玉米豐收的玉米神
