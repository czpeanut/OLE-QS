  stem: 已知點 P（1，0）為二次函數 f（x）＝$x^{2}$＋4x－1 圖形外一點，則過 P 點的切線方程式為 ＿＿＿＿。（有兩解）
  answer:
  - 2x－y－2＝0 及 10x－y－10＝0
  answer_status: verified
  answer_source: answer_key
  explanation: '設切點為 A（a，$a^{2}$＋4a－1）

    f''（x）＝2x＋4 ⇒ f''（a）＝2a＋4

    以 A 點為切點且過 P 點的切線斜率為$\frac{a^{2}+4a-1-0}{a-1}$＝2a＋4

    ⇒ $a^{2}$＋4a－1＝$2a^{2}$＋2a－4

    ⇒ $a^{2}$－2a－3＝0

    ⇒（a＋1）（a－3）＝0

    ⇒ a＝－1 或 3

    ∴可知切點為（－1，－4）或（3，20）且其切線斜率為 f''（－1）＝2，f''(3)＝10

    故所求切線方程式為 y－（－4）＝2（x－（－1））及 y－20＝10（x－3）

    化簡可得 2x－y－2＝0 及 10x－y－10＝0'
