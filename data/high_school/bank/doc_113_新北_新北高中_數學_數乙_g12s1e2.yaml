- id: doc_113_新北_新北高中_數學_數乙_g12s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 下列敘述何者正確：
  options:
  - label: A
    content: 若 f''（α）＝0，則點（α，f（α））必為反曲點
  - label: B
    content: 已知 f（x）為三次多項式函數，若 f''（α）＝0，則點（α，f（α））必為反曲點
  - label: C
    content: 若 f'（α）＝0，則點（α，f（α））不一定為極值發生的點
  - label: D
    content: 若函數 f（x）在 x＝c 處是連續的，則函數 f（x）在 x＝c 處的導數存在
  - label: E
    content: 若函數 f（x）在 x＝c 處的導數存在，則函數 f（x）在 x＝c 是連續的
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：令 f（x）＝$x^{4}$，f''（x）＝$4x^{3}$，f''''（x）＝$12x^{2}$

    f''''(0)＝0，但當 x≠0 時，f''''（x）＞0，均為凹口向上

    故（0，f(0)）不是 f（x）圖形的反曲點

    (B) ○：因為 f（x）為三次多項式函數，且 f''''（α）＝0，所以點（α，f（α））為 f（x）的反曲點

    (C) ○：舉例：令 f（x）＝$x^{3}$，f''（x）＝$3x^{2}$

    f''(0)＝0，但在 x＝0 處並無極值

    (D) ╳：反例：f（x）＝∣x∣在 x＝0 處連續，但在 x＝0 處的導數不存在

    (E) ○

    故選(B)(C)(E)'
