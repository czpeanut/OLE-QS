  stem: 設ψ＝$\frac{1+\sqrt{5}}{2}$，下列敘述哪些正確？
  options:
  - label: A
    content: 一個矩形如果截掉以寬為邊長的正方形後，所剩的矩形與原矩形相似，則此原矩形的長寬比為ψ
  - label: B
    content: 將一條線段分成兩段不等長的線段，如果「較長線段與較短線段的比值」等於「整條線段與較長線段的比值」，則此比值為ψ
  - label: C
    content: 如果a，b，c三個正數依序成等比，且滿足a＝b＋c，則公比為ψ
  - label: D
    content: 等腰三角形△ABC，D在$\overline{AB}$上，若頂角∠BAC＝360°，且$\overline{BC}$＝$\overline{CD}$＝1，則$\overline{BD}$＝ψ
  - label: E
    content: ψ＝1＋$\frac{1}{\phi}$＝1＋$\frac{1}{1+\frac{1}{\phi}}$
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
