  stem: 假設空間中二直線$L_{1}$、$L_{2}$，其中$L_{1}$的方向向量為$\overrightarrow{u_{1}}$、$L_{2}$的方向向量為$\overrightarrow{u_{2}}$，空間中二平面$E_{1}$、$E_{2}$，其中$E_{1}$的法向量為$\overrightarrow{n_{1}}$、$E_{2}$的法向量為$\overrightarrow{n_{2}}$，則下列哪些選項正確？
  options:
  - label: A
    content: 若$\overrightarrow{u_{1}}$．$\overrightarrow{u_{2}}$＝0，則$L_{1}$和$L_{2}$垂直
  - label: B
    content: 若$\overrightarrow{n_{1}}$．$\overrightarrow{n_{2}}$＝0，則$E_{1}$和$E_{2}$垂直
  - label: C
    content: 若$\overrightarrow{u_{1}}$平行$\overrightarrow{u_{2}}$，則$L_{1}$和$L_{2}$垂直
  - label: D
    content: 若$\overrightarrow{n_{1}}$平行$\overrightarrow{n_{2}}$，則$E_{1}$和$E_{2}$平行
  - label: E
    content: 若$L_{1}$、$L_{2}$互為歪斜，則$\overrightarrow{u_{1}}$．$\overrightarrow{u_{2}}$可能為0
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)×，$\overrightarrow{u_{1}}$．$\overrightarrow{u_{2}}$＝0 $\Rightarrow$ $L_{1}$和$L_{2}$交於一點且互相垂直或$L_{1}$和$L_{2}$歪斜 (B)○，$\overrightarrow{n_{1}}$．$\overrightarrow{n_{2}}$＝0 $\Rightarrow$ $E_{1}$⊥$E_{2}$ (C)×，$\overrightarrow{u_{1}}$//$\overrightarrow{u_{2}}\Rightarrow$ $L_{1}$ // $L_{2}$或$L_{1}$＝$L_{2}$ (D)×，$\overrightarrow{n_{1}}$//$\overrightarrow{n_{2}}$＝0 $\Rightarrow$ $E_{1}$ // $E_{2}$或$E_{1}$＝$E_{2}$ (E)○，$L_{1}$、$L_{2}$歪斜 $\Rightarrow\overrightarrow{u_{1}}$、$\overrightarrow{u_{2}}$不平行 $\Rightarrow\overrightarrow{u_{1}}$．$\overrightarrow{u_{2}}$可能為0 選(B)(E)
