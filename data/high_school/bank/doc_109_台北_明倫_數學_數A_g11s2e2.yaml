  stem: 甲、乙、丙、丁、戊五個人一同參加抽獎活動，現在依照甲乙丙丁戊的順序依序抽獎，輪到抽獎的人有一次抽獎機會，已知抽獎箱內有7張獎券，其中三張為中獎，另外四張為銘謝惠謝，抽後不放回，活動直到三張中獎券都被抽中為止。則下列哪些選項正確？
  options:
  - label: A
    content: 丙中獎的機率為$\frac{3}{7}$
  - label: B
    content: 甲乙丙丁戊中獎的機率均相同
  - label: C
    content: 甲中獎的事件和丙中獎的事件為獨立事件
  - label: D
    content: 在甲中獎的條件下，丙也中獎的條件機率為$\frac{1}{7}$
  - label: E
    content: 在甲乙均中獎的條件下，<u>丁也可以抽獎</u>的條件機率為$\frac{3}{5}$
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)○，P ( 丙中 )＝$\frac{(6\cdot 5)\cdot 3}{7\cdot 6\cdot 5}=\frac{3}{7}$ (B)○，作法同(A)，機率＝$\frac{3}{7}$ (C)×，P ( 甲中且丙中 )＝$\frac{3\times (5)\times 2}{7\cdot 6\cdot 5}$＝$\frac{1}{7}$≠P ( 甲中 )×P ( 丙中 ) ∴不是獨立事件 (D)×，P ( 丙中 | 甲中 )＝$\frac{(5)\times 2}{6\times 5}$＝$\frac{1}{3}$ (E)×，甲、乙均中獎時，剩下5張，其中一張中獎。丁也可以抽獎，就是丙沒抽中，所求條件機率＝$\frac{4}{5}$ 選(A)(B) ［註］（活動直到三張中獎券都被抽中為止）（輪到抽獎的人有一次抽獎機會）。語意有缺失：該是（輪到抽獎的人有一次抽獎機會，但當三張中獎券都被抽中就停止）。
