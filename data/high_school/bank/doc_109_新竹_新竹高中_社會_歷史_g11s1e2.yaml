  stem: 對於十六世紀科隆地區宗教改革的狀況有如下的描寫： 資料一：在科隆這個自治市中最主要的是市政委員會，負責處理宣戰、對外條約、公共財務等。市政委員會經選舉產生，任期一年，且不可連選連任。 資料二：市民對於這個城市中龐大的教會人口感到不安，十六世紀時，科隆也興起反教士運動，城市中的教士貪婪、私德敗壞，又不需要負起對城市的義務以及繳稅，有時還尋求市政委員會的保護，引起不少民怨。 資料三：作為重要的天主教城市，神聖羅馬帝國皇帝希望將科隆當成他與新教對抗的重要堡壘。而天主教的大主教也希望能夠加深對科隆的掌握，羅馬教宗也希望能夠控制科隆，牽制勢力龐大的科隆大主教，其他的新教勢力更想將新教推行到科隆。 資料四：1536年科隆大主教企圖在轄區內針對教士腐敗問題推動改革，他引進新教的方式，卻激起了市政委員會聯合區內教士、傳統大學勢力進行抵制。後來，大主教被罷黜。 綜合以上四則資料的描寫，對於在科隆的「宗教改革」，何者理解最適當？
  options:
  - label: A
    content: 市民認為不論是引進新宗教思想或是革除舊教，都不能違反自治的價值
  - label: B
    content: 反教士運動就是宗教改革的一環，強調對於舊教改革與改信新教的行動
  - label: C
    content: 神聖羅馬帝國的皇帝總是聯合教宗抵抗轄區內教區大主教的勢力與擴張
  - label: D
    content: 地區大主教最有力的合作對像是教宗與篤信天主教的神聖羅馬帝國皇帝
  tags:
    unit:
      code: HI-3-2-1
