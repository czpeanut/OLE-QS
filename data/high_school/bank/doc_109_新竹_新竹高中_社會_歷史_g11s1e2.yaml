  stem: 關於馬丁路德對於歷史發展的影響有如下評價： 資料一：他的學識固然豐富地令人難以置信，但他也能夠跟一般老百姓溝通，有辦法掌握他們的用語，這是頗不尋常的事情。他是礦工的兒子，而且他非常熟悉日常口頭語言的使用方式，他給聖經帶來了盎然生機。 資料二：他按照一般人民講話的方式來寫，每當他寫出一個句子的時候，就會考慮活生生的人們是否真的會說出這樣的東西來隨著他編輯文字的次數越多，文字就越發顯的渾然天成和接近真實生活。 資料三：由於他生活的薩克森位於日爾曼地區中部偏東的位置，這裡恰巧是不同德語方言的交會地，因此他以薩克森官話為範本，將低地德語和高地德語加以整合，找到兩者之間的平衡點。 資料四：德文所使用的成語和單字往往都可以回溯到路德。整部德意志文學史乃是以路德的語言為基礎，此外有許多慣用語是他創造的，或是因為他而膽炙人口。 綜合上述資料，下列對於路德事蹟的解釋，適當的有哪些？
  options:
  - label: A
    content: 地方母語版的《聖經》有助於人民貼近上帝，將信仰與個人日常生活緊密連結
  - label: B
    content: 藉由日爾曼地區語言整合，神聖羅馬帝國境內邦國關係緊密，有助於皇帝集權
  - label: C
    content: 路德整合了通俗日爾曼語翻譯聖經，擴大人民對其思想的支援，成功抨擊教會
  - label: D
    content: 因信仰帶動地方母語的文字化，有助於個人教育需求的提升，進而提高識字率
  - label: E
    content: 打破方言隔閡，整合了日爾曼地區的語言，有助於日後德意志民族概念的形成
