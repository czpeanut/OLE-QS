  group_stem: '資料一：1848 年，加利福尼亞發現金礦而引發了淘金熱。為了解決勞動力嚴重不足的問題，美國資本家開始在中國東南沿海招募華工。加之鴉片戰爭後，中國戰火連綿，老百姓內外交困，生活難以為繼，不得不鋌而走險遠赴重洋到美國淘金，成為華工。但是，由於當時美國西部處於高度無政府狀態，加上美國本來就存在種族歧視等原因，華人很快就受到歧視和迫害。但正是隨著第一條橫貫北美大陸的鐵路建成通車，大批勞動力從東部湧入西部。以工價低廉、任勞任怨著稱，是白人工人求職過程中的主要競爭者。政客為討好選民，迎合社會上的排華氛圍，1882 年美國國會通過《排華法案》。

