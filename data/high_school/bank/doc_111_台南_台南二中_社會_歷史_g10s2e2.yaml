  stem: 「倭寇」是對由漢人及日本人組成的各海盜勢力之總稱，時常騷擾中國東南沿海，對沿岸的城市及往來的商船進行劫掠，一直是明代海防的憂患，官方難以澈底清剿。明朝將領戚繼光（1528～1588 年）奉命清剿倭寇，他招募浙江的農民進行訓練，組織軍隊。這支軍隊被稱為「戚家軍」，紀律嚴明，於對抗東南沿海倭寇的戰役中多次獲勝。根據上述內容，下列哪些正確？
  options:
  - label: A
    content: 戚家軍具有地方防衛組織的性質
  - label: B
    content: 戚家軍藉由興築塢堡抵禦倭寇入侵
  - label: C
    content: 戚家軍為地方豪族宗主號召民眾所組成
  - label: D
    content: 戚家軍為血緣組織
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 戚家軍為招募浙江農民訓練而成，屬於鄉勇，答案為(A)。(B)塢堡為上古華北地區的防禦組織。(C)戚繼光並非地方豪族宗主。(D)戚家軍的組成為浙江農民，非血緣組織。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 「明清時中國商業貿易興盛，出現許多以同鄉及宗族關係結合的商幫，如晉商。晉商發跡地為位於華北地區的山西，透過運輸軍糧給明朝的邊防駐軍來取得鹽引，獲得合法販賣食鹽的權利，藉由賣鹽賺取龐大利益而崛起，在華北地區占有優勢。除了以賣鹽為主力外，也販賣茶、米、人參等商品。隨著勢力的擴張，晉商在較大的城市設立會館，提供來自同鄉的商人聯繫感情、融資、協調價格、運銷貨物等作用。」下列對於題幹的分析何者最為合理？
  options:
  - label: A
    content: 商幫在特定區域占有優勢與地理因素無關
  - label: B
    content: 來自各地的同業商人在會館中協商價格以壟斷市場
  - label: C
    content: 晉商販賣的物品多樣，無主要的交易商品
  - label: D
    content: 晉商會館是基於同鄉意識組成，有團結同鄉商人的作用
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)商幫的發展有其地理因素。(B)會館聚集的是同鄉商人，非同業商人。(C)晉商以賣鹽為主力。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 甲學者認為宗族透過恢復古代宗法家庭制度，修纂族譜、興建祠堂，以凝聚宗族意識。祠堂一方面用來祭祖、慎終追遠，一方面又以祖先的血緣紐帶來連結族人；乙學者則認為宋代宗族體制與其說是敬宗收族，不如說是基層權力網絡的重新組合，宋代在經濟社會上發生重大轉變，加以新型選才制度的確立，使傳統權力結構發生重大變革，宗族組織則成為支持其延續利益的網絡。有關上文的理解，下列何者最為恰當？
  options:
  - label: A
    content: 乙學者較強調國家力量對宗族出現的影響力
  - label: B
    content: 兩位學者均強調宗族得以幫助族人，使族人貴族身分得以延續
  - label: C
    content: 甲學者強調宗族的精神連結，乙學者強調宗族的實質利益
  - label: D
    content: 新型選才制度促使世家大族得以長期掌握政治實力
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
