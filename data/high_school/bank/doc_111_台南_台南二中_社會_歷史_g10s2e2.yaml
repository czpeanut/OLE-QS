- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '資料一：唐德宗的時候因為藩鎮叛亂，長安被包圍，缺糧超過十天，當糧船沿運河抵達的消息傳來時，唐德宗感動的對太子高呼：「米已至陝，吾父子得生矣。」

    資料二：宋太宗淳化二年（991 年），汴渠決堤，太宗親督河工修理，曰：「東京養兵數十萬，居人百萬家，天下轉漕，仰給在此一渠，朕安得不顧！」

    如果要利用兩則資料，作為近代以前中國社會發展的說明，則下列何者最為適合？'
  options:
  - label: A
    content: 用來說明糧食生產的技術演變
  - label: B
    content: 用來分析唐宋時期對運河的依賴
  - label: C
    content: 作為專業市鎮出現的重要史料
  - label: D
    content: 作為國防政策下移民的研究依據
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一提到晚唐藩鎮叛亂時，長安的糧食須靠運河自南運送；資料二提及宋太宗說過，東京養兵與百姓，全部仰賴汴河渠道的轉漕。兩則資料皆說明運河漕運對國家政權的重要性，(B)為正解。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 唐宋時期，隨著南海貿易的興盛，外國船隻停靠的貿易港也逐漸從廣州向北延伸到福建和長江流域。繼廣州之後，泉州、明州（今寧波）也發展成大商港。外國商船將香料、珊瑚、瑪瑙、寶石、象牙、藥材等商品輸往中國，並購買大量中國產品運回。請問唐宋時期從南海來華貿易的外國商人，下列何者為數最多？
  options:
  - label: A
    content: 印度人
  - label: B
    content: 馬來人
  - label: C
    content: 義大利人
  - label: D
    content: 阿拉伯人
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 地理大發現前，長期掌控東西海路貿易的族群是阿拉伯人，故(D)為正解。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 右圖為 1885 年美國《窩斯比畫報》（The Wasp）刊出一幅名為〈當心這隻華人老虎〉的漫畫，請問這幅漫畫顯示當時美國對華人的何種心態？
  options:
  - label: A
    content: 因華人不信基督教而生的宗教憂慮
  - label: B
    content: 華人移民漸多後成為優勢族群
  - label: C
    content: 對華人競爭工作機會的失業焦慮感
  - label: D
    content: 認為中國透過來美華人滲透美國
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_111_台南_台南二中_社會_歷史_g10s2e2/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 359.6
      - 372.25
      - 564.8
      - 506.0
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 漫畫裡呈現出各種職業的人都受到華人老虎的欺壓，因此答案為(C)。(B)華人移民再多，也不可能在美國成為優勢族群，故不選。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '下表為 1890 年到 1940 年美國的華人與日本人之數量比較，請問對此表的解讀何者正確？

    | 人口數／年分 | 美國本土華人 | 美國本土日人 | 夏威夷華人 | 夏威夷日人 |

    | --- | --- | --- | --- | --- |

    | 1890 | 107,488 | 2,039 | 15,301 | 約 30,000 |

    | 1900 | 89,863 | 24,326 | 25,767 | 約 61,111 |

    | 1910 | 71,531 | 72,157 | 21,674 | 約 79,675 |

    | 1920 | 61,639 | 111,010 | 23,507 | 約 109,274 |

    | 1930 | 74,956 | 138,834 | 27,179 | 約 139,631 |

    | 1940 | 76,560 | 126,948 | 28,774 | 約 157,905 |'
  options:
  - label: A
    content: 美國本土華人數量減少，是因為加州的淘金熱潮消退所致
  - label: B
    content: 美國本土日人在 19 世紀末期的增長，是填補了華工空缺
  - label: C
    content: 日人大規模往夏威夷尋找工作機會是受到經濟大恐慌影響
  - label: D
    content: 因日本對移民政策的積極，使日人移民海外始終占有優勢
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)主要是《排華法案》的緣故。(C) 1890 年尚未經濟大恐慌。(D)起初是華工較占優勢，日人則是在《排華法案》後才有取代華工的趨勢。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 此為一學者對族譜作為史料的看法：「余治中國史學……深覺中國所謂正史與方志，其載述往往僅能及於朝廷之實施與制度之創立、地方之建置、財記之豐歉、人物之得失、邊民之入居，如是而已。而於各族姓之遷移轉徙，與各民族之混合同化，則仍不能不於各姓之譜乘求之。」關於此段看法，我們可以推論出下列哪段敘述？
  options:
  - label: A
    content: 正史與方志只記載財政大事，族譜可以取代正史與方志
  - label: B
    content: 正史與方志不能了解當時人民的生活疾苦，而族譜可以
  - label: C
    content: 族譜可提供正史與方志無法提供之訊息，使研究更完整
  - label: D
    content: 族譜可用來了解族群遷徙，但無法了解族群發展的歷史
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 這位學者感嘆中國的正史與方志裡，對各族姓的遷移轉徙、各民族之混合同化記載幾乎闕無，這些須從族譜記載才能得知，因此選(C)。(A)族譜無法取代正史與方志。(B)正史與方志亦記載百姓的生活疾苦。(D)族譜更能了族群發展的歷史。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 宋代的海上貿易非常發達，繼承了唐朝興起的路線，再加上新的航海知識與技術，讓遠洋的過程更不容易受到風浪的影響，也能明確知道位置與方向，這使得當時的貿易路線甚至可以到達現在的東非沿岸以及伊比利半島，除此之外，南宋定都於臨安，儘管位置有利於海上貿易，但由於仍有繳交歲幣給金國以及蒙古的需求，故相當鼓勵貿易以賺取資金，主要輸入的商品是香料、藥材以及寶石等貴重物，而輸出的則是絲綢以及瓷器。請問根據題幹，下列何者敘述正確？
  options:
  - label: A
    content: 新的航海技術可能是造船技術進步以及運用指南針
  - label: B
    content: 宋代獎勵貿易的原因是因為想和外國有更多交流
  - label: C
    content: 從輸入的物品是香料來判斷該交易地點可能是歐洲
  - label: D
    content: 宋代航海技術進步是因為中國當時開始注重工業的發展
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)因為有繳交歲幣給金國及蒙古的財政需求，故鼓勵貿易以賺取資金。(C)香料產於東南亞。(D)此時仍是以農立國的時期，並未開始注意工業的發展，航海技術進步應是長期經驗的累積。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 華人在美國的「六大公司」於 1876 年發布了一則公告：「華人本來想到這裡待個二、三年，賺點錢後就回家。誰想過會碰到重重困難，一天沒工作就沒得吃。正因為如此，儘管工資很低，華人還是被迫每天工作，過著窮困的生活，也沒辦法返回祖國……有人說，六大公司買了許多中國佬，進口到美國來。怎麼會有這麼誇張的傳言？我們六大公司每年都寫信回國，勸同胞們別來這國家，但沒有人理會我們的勸阻。」請問華人在美國的六大公司，成立的目的應為何？
  options:
  - label: A
    content: 從事華人移工的買賣事業
  - label: B
    content: 作為華人移工與白人雇主之間的中間商
  - label: C
    content: 由白人成立協助華人學習當地語言
  - label: D
    content: 協助生活困難的華人
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「六大公司」是由華人所組成的，由其說明美國華人生活很窮困，勸阻同胞們別到美國的舉動來看，應非從事華工的買賣與仲介工作，最可能是協助生活困難的華人，故(D)為正解。
- id: doc_111_台南_台南二中_社會_歷史_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 以下是一篇回憶錄：「還記得小時候，爸爸指著海的對岸說，那是我們真正的祖國。爸爸小時候因為殖民政府的要求，跟著爺爺來到新的祖國，被迫從事粗重的工作，卻沒有得到應有的對待與尊重。後來有一天，大戰打完，真正的祖國也獨立，看似可以回歸故鄉時爸爸卻說自己早已習慣這邊的生活。沒有重新適應的勇氣了……看著太陽旗下他落寞的身影，當時的我卻私自竊喜不必因此重新學習別的語言。」請問關於這段文字下列選項何者正確？
  options:
  - label: A
    content: 文中真正的祖國在甲午戰爭之後不久就被殖民
  - label: B
    content: 從題幹可判斷回憶錄的作者應該是用韓文書寫
  - label: C
    content: 描寫出國民黨老兵受到臺灣新政府迫害的辛酸
  - label: D
    content: 作者父親得知共產黨建國，雖想回歸故土卻沒有心力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「大戰打完，真正的祖國也獨立」、「太陽旗」等字句，推知作者真正的祖國應是日本的殖民地――朝鮮，但因父親已習慣在日本的生活，故不打算回到朝鮮，才讓作者私自竊喜不必重新學習別的語言，(A)為正解。(B)從題文來看，作者應是用日文書寫。(C)(D)與題文所述不符。
