- id: doc_111_台北_松山_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 關於下列敘述，試選出正確的選項。
  options:
  - label: A
    content: $\frac{\pi}{3}$＝$\frac{7\pi}{3}$
  - label: B
    content: sin$\frac{\pi}{3}$＝sin$\frac{7\pi}{3}$
  - label: C
    content: cos$\frac{\pi}{3}$＝cos$\frac{7\pi}{3}$
  - label: D
    content: sin（π＋1）＝sin1
  - label: E
    content: cos（π－3）＝cos（3－π）
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$\frac{\pi}{3}$和$\frac{7\pi}{3}$為同界角，但值不相等

    (B) ○：sin$\frac{\pi}{3}$＝sin$\frac{7\pi}{3}$＝$\frac{\sqrt{3}}{2}$

    (C) ○：cos$\frac{\pi}{3}$＝cos$\frac{7\pi}{3}$＝$\frac{1}{2}$

    (D) ╳：sin（π＋1）＝－sin1

    (E) ○：cos（π－3）＝cos（－（3－π））＝cos（3－π）

    故選(B)(C)(E)'
- id: doc_111_台北_松山_數學_數B_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 試選出與函數 y＝sin$\left( 2x-\frac{\pi}{3} \right)$週期相同的函數。
  options:
  - label: A
    content: y＝sin2x－$\frac{\pi}{3}$
  - label: B
    content: y＝2 sin$\left( x-\frac{\pi}{6} \right)$
  - label: C
    content: y＝2 sin$\left( x-\frac{\pi}{3} \right)$－1
  - label: D
    content: y＝$\sqrt{2} \sin \left( 2x-\frac{\pi}{3} \right)$
  - label: E
    content: y＝$\frac{1}{2} \sin \left( 4x-\frac{2\pi}{3} \right)$
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$\sin \left( 2x-\frac{\pi}{3} \right)$的週期為$\frac{2\pi}{2}$＝π

    (A) ○：週期為$\frac{2\pi}{2}$＝π

    (B) ╳：週期為 2π

    (C) ╳：週期為 2π

    (D) ○：週期為$\frac{2\pi}{2}$＝π

    (E) ╳：週期為$\frac{2\pi}{4}$＝$\frac{\pi}{2}$

    故選(A)(D)'
