- id: doc_111_台北_松山_數學_數B_g11s1e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 設θ為第三象限角，sinθ＝$-\frac{3}{5}$，則 cos（π－θ）＝＿＿＿＿。
  answer:
  - $\frac{4}{5}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵θ為第三象限角且 sinθ＝$-\frac{3}{5}$

    ∴cosθ＝$-\frac{4}{5}$

    故 cos（π－θ）＝－cosθ＝$-\left( -\frac{4}{5} \right)$＝$\frac{4}{5}$'
