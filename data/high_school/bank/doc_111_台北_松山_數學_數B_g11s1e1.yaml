- id: doc_111_台北_松山_數學_數B_g11s1e1_s4_1
  section: 4
  number: 1
  type: calc
  page: 3
  stem: '潮汐是地球上的海洋表面受到太陽和月球的萬有引力作用引起的漲落現象。下表是某港口一天中海水漲落的紀錄表：

    | 時間 t（小時） | 0 | 3 | 6 | 9 | 12 | 15 | 18 | 21 | 24 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 水深 y（公尺） | 12 | 10 | 8 | 10 | 12 | 10 | 8 | 10 | 12 |

    (1) 試以時間 t（小時）為橫軸，水深 y（公尺）為縱軸，將紀錄表數據描繪在坐標平面上，並以正弦曲線連接。（6 分）

    (2) 若以函數 y＝a sin（bt＋c）＋d，其中 a＞0，b＞0，0＜c＜2π描述水深與時間的關係，試求序組（a，b，c，d）。（4 分）'
