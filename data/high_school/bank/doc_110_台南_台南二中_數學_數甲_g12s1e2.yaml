  stem: 已知函數f (x)＝$2x^{3}$－$3x^{2}$＋6x＋10，則下列哪些選項是正確的？
  options:
  - label: A
    content: 函數f (x) 在x＝1附近的一次估計為6x＋15
  - label: B
    content: f ( 0.99 ) 的值四捨五入至小數第二位為14.94
  - label: C
    content: y＝f (x) 圖形的對稱中心為 ( $\frac{1}{2}$ , $\frac{-15}{2}$ )
  - label: D
    content: 若點 ( r , s ) 在y＝f (x) 的圖形上，則點 ( 1－r , 25－s ) 也在y＝f (x) 的圖形上
  - label: E
    content: 函數y＝f (x) 的圖形與任一水平直線恰有一交點
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：f ‘(x)＝$6x^{2}$－6x＋6，f ‘(1)＝6，又f (1)＝15， 故函數f (x)在x＝1附近的一次估計為， g (x)＝f (1)＋f ‘(1) ( x－1 )，即g (x)＝15＋6 ( x－1 )，亦即g (x)＝6x＋9。 (B) ○：f (0.99)$\approx$g (0.99 )＝6×0.99＋9＝14.94。 (C) ×：－$\frac{b}{3a}$＝－$\frac{-3}{6}$＝$\frac{1}{2}$，y＝f (x)圖形的對稱中心為( $\frac{1}{2}$, f ($\frac{1}{2}$) )，即( $\frac{1}{2}$ , $\frac{25}{2}$ )。 (D) ○：因y＝f (x)圖形的對稱中心為( $\frac{1}{2}$ , $\frac{25}{2}$ )， 故若點( r , s )在y＝f (x)的圖形，則點( $\frac{1}{2}$×2－r , $\frac{25}{2}$×2－s )， 即( 1－r , 25－s )也在y＝f (x)的圖形上。 (E) ○：f ‘(x)＝$6x^{2}$－6x＋6＝6 ( x－$\frac{1}{2}$)$^{2}$＋$\frac{9}{2}$恆大於0， 故f (x)在R上為嚴格遞增函數，所以y＝f (x)的圖形與任一水平直線恰有一交點。 故選(B)(D)(E)。
