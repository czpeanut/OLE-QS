- id: doc_110_苗栗_苑裡_數學_數乙_g12s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 關於函數極限與連續的敘述，試選出正確的選項。
  options:
  - label: A
    content: 若$\lim_{x\rightarrow a^{-}} f(x)$與$\lim_{x\rightarrow a^{+}} f(x)$存在，則$\lim_{x\rightarrow a} f(x)$存在
  - label: B
    content: 若$\lim_{x\rightarrow a} f(x)$存在，則$\lim_{x\rightarrow a^{-}} f(x)$與$\lim_{x\rightarrow a^{+}} f(x)$皆存在
  - label: C
    content: 若$\lim_{x\rightarrow a} f(x)$存在，則 f（x）在 x＝a 連續
  - label: D
    content: 若 f（x）在 x＝a 連續，則$\lim_{x\rightarrow a} f(x)$存在
  - label: E
    content: 若$\lim_{x\rightarrow a} f(x)$與 f（a）皆存在，則$\lim_{x\rightarrow a} f(x)$＝f（a）
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：若$\lim_{x\rightarrow a^{-}} f(x)$≠$\lim_{x\rightarrow a^{+}} f(x)$，則$\lim_{x\rightarrow a} f(x)$不存在

    (B) ○

    (C) ╳：需加上$\lim_{x\rightarrow a} f(x)$＝f（a）之條件方可連續

    (D) ○

    (E) ╳：極限值不一定等於函數值

    故選(B)(D)'
  tags:
