- id: doc_111_新北_新北高中_數學_數乙_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 試求函數 f（x）＝$\frac{\sqrt{-x^{2}-5x+6}}{x+1}$的定義域中有幾個整數值？
  options:
  - label: A
    content: '4'
  - label: B
    content: '5'
  - label: C
    content: '6'
  - label: D
    content: '7'
  - label: E
    content: '8'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)－$x^{2}$－5x＋6 ≥ 0

    ⇒ $x^{2}$＋5x－6 ≤ 0

    ⇒（x＋6）（x－1）≤ 0

    ⇒－6 ≤ x ≤ 1

    (2) x＋1≠0

    ⇒ x≠－1

    由(1) 、(2) 知，－6 ≤ x ≤ 1，但 x≠－1

    ∴定義域中之整數為－6，－5，－4，－3，－2，0，1，共 7 個

    故選(D)'
- id: doc_111_新北_新北高中_數學_數乙_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設 a，b 為循環小數，a＝$0.\overline{12}$，b＝$0.\overline{01}$，則 a－b 的值是下列哪一個選項？
  options:
  - label: A
    content: '0.11'
  - label: B
    content: '0.1111'
  - label: C
    content: $\frac{1}{9}$
  - label: D
    content: $\frac{10}{99}$
  - label: E
    content: $\frac{100}{999}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '設 a＝$0.\overline{12}$ ……………①

    100a＝$12.\overline{12}$ ……………②

    ②－①得 99a＝12 ⇒ a＝$\frac{12}{99}$

    b＝$0.\overline{01}$ ………………③

    100b＝$1.\overline{01}$ ……………④

    ④－③得 99b＝1 ⇒ b＝$\frac{1}{99}$

    ∴a－b＝$\frac{12}{99}-\frac{1}{99}$＝$\frac{11}{99}=\frac{1}{9}$

    故選(C)'
- id: doc_111_新北_新北高中_數學_數乙_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 已知函數 f（x）＝$x^{2}$＋3，g（x）＝cosx，h（x）＝｜x｜，k（x）＝$\frac{x}{│ x │}$，選出正確的選項。
  options:
  - label: A
    content: f（x）為偶函數
  - label: B
    content: f（x）的圖形對稱於 x 軸
  - label: C
    content: g（x）的圖形對稱於 y 軸
  - label: D
    content: h（x）的圖形對稱於 x 軸
  - label: E
    content: k（x）的圖形對稱於原點
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵f（－x）＝（－x）$^{2}$＋3＝$x^{2}$＋3＝f（x）

    ∴f（x）為偶函數

    (B) ╳：f（x）為偶函數，其圖形對稱於 y 軸

    (C) ○：∵g（－x）＝cos（－x）＝cosx＝g（x）

    ∴g（x）為偶函數，其圖形對稱於 y 軸

    (D) ╳：h（x）的圖形對稱於 y 軸

    (E) ○：∵k（－x）＝$\frac{-x}{│ -x │}=\frac{-x}{│ x │}$＝－k（x）

    ∴k（x）為奇函數，對稱於原點

    故選(A)(C)(E)'
- id: doc_111_新北_新北高中_數學_數乙_g12s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 選出正確的選項。
  options:
  - label: A
    content: 若數列〈$a_{n}$〉，〈$b_{n}$〉均為收斂數列，則〈$a_{n}$＋$b_{n}$〉為收斂數列
  - label: B
    content: 若〈$a_{n}$＋$b_{n}$〉為收斂數列，則〈$a_{n}$〉，〈$b_{n}$〉均為收斂數列
  - label: C
    content: 若數列〈$a_{n}$〉收斂於 0，則數列〈$a_{n}^{2}$〉收斂於 0
  - label: D
    content: 若數列〈$a_{n}^{2}$〉收斂於 1，則數列〈$a_{n}$〉收斂於 1
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○

    (B) ╳：若〈$a_{n}$〉＝〈n〉，〈$b_{n}$〉＝〈－n〉

    則〈$a_{n}$＋$b_{n}$〉為收斂數列，但〈$a_{n}$〉、〈$b_{n}$〉為發散數列

    (C) ○

    (D) ╳：若〈$a_{n}$〉：1，－1，1，－1，1，－1，……

    〈$a_{n}^{2}$〉：1，1，1，1，1，1，……

    則〈$a_{n}^{2}$〉收斂於 1，但〈$a_{n}$〉為發散數列

    故選(A)(C)'
- id: doc_111_新北_新北高中_數學_數乙_g12s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 1
  stem: 下列選項哪些是正確的？
  options:
  - label: A
    content: $0.20\overline{21}$＝$\frac{2001}{9900}$
  - label: B
    content: $\sum_{n=1}^{\infty} \left( \frac{\pi}{4} \right) ^{n}$收斂
  - label: C
    content: $\lim_{n\rightarrow \infty} \frac{1+(-1)^{n}}{n}$存在
  - label: D
    content: $\sum_{n=1}^{\infty} \left( \frac{3}{2} \right) ^{n-1}$＝$\frac{1}{1-\frac{3}{2}}$
  - label: E
    content: $\lim_{n\rightarrow \infty} \frac{{2^{n}}^{+2}+{3^{2n}}^{+1}}{5^{n}+{8^{n}}^{-2}}$存在
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$0.20\overline{21}$＝$\frac{2021-20}{9900}$＝$\frac{2001}{9900}$

    (B) ○：∵－1＜$\frac{\pi}{4}$＜1 ∴$\sum_{n=1}^{\infty} \left( \frac{\pi}{4} \right)^{n}$收斂

    (C) ○

    (D) ╳：r＝$\frac{3}{2}$ ≥ 1，則此級數發散，無法求和

    (E) ╳：$\lim_{n\rightarrow \infty} \frac{{2^{n}}^{+2}+{3^{2n}}^{+1}}{5^{n}+{8^{n}}^{-2}}$＝$\lim_{n\rightarrow \infty} \frac{\frac{{2^{n}}^{+2}}{{8^{2n}}^{+1}}+\frac{{3^{2n}}^{+1}}{{8^{2n}}^{+1}}}{\frac{5^{n}}{{8^{2n}}^{+1}}+\frac{{8^{n}}^{-2}}{{8^{2n}}^{+1}}}$＝$\lim_{n\rightarrow \infty} \frac{\left( \frac{1}{2} \right) {^{5n}}^{+1}+\left( \frac{3}{8} \right) ^{2n+1}}{\left( \frac{5}{8} \right) ^{n}\times \frac{1}{{8^{n}}^{+1}}+\left( \frac{1}{8} \right) {^{n}}^{+3}}$

    ∴極限不存在

    故選(A)(B)(C)'
