- id: doc_111_新北_新北高中_數學_數乙_g12s1e1_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 已知三次多項式 f（x）滿足$\lim_{x\rightarrow 1} \frac{f(x)}{x-1}=1$且$\lim_{x\rightarrow 2} \frac{f(x)}{x-2}=3$，求$\lim_{x\rightarrow 3} \frac{f(x)}{x+1}$＝＿＿＿＿。
  answer:
  - $\frac{7}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$\lim_{x\rightarrow 1} \frac{f(x)}{x-1}$＝1 且$\lim_{x\rightarrow 2} \frac{f(x)}{x-2}$＝3

    ∴x－1，x－2 為 f（x）的一次因式

    ⇒ f(1)＝f(2)＝0

    設 f（x）＝（x－1）（x－2）（ax＋b）

    $\lim_{x\rightarrow 1} \frac{(x-1)(x-2)(ax+b)}{x-1}$＝$\lim_{x\rightarrow 1} ((x-2)(ax+b))$＝1 ⇒ a＋b＝－1 ……………①

    $\lim_{x\rightarrow 2} \frac{(x-1)(x-2)(ax+b)}{x-2}$＝$\lim_{x\rightarrow 2} ((x-1)(ax+b))$＝3 ⇒ 2a＋b＝3 ………………②

    由①、②得 a＝4，b＝－5，故 f（x）＝（x－1）（x－2）（4x－5）

    所求為$\lim_{x\rightarrow 3} \frac{f(x)}{x+1}$＝$\lim_{x\rightarrow 3} \frac{(x-1)(x-2)(4x-5)}{x+1}$＝$\frac{7}{2}$'
