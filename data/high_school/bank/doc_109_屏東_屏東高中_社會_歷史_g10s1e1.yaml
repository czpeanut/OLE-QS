  stem: 有關臺灣原住民族的分類敘述，下列何者正確？
  options:
  - label: A
    content: 在外來勢力進入前，臺灣原住民自成世界，過著無文字的生活，也因族群已有明確的民族觀念，故部落之間常有衝突或訂盟的關係
  - label: B
    content: 清廷統治臺灣時，基於統治的方便性，將臺灣原住民依照文化、語言與傳統分成熟番、化番及生番
  - label: C
    content: 日本政府首次對臺灣原往民進行人類學研究，學者鳥居龍藏深入臺灣山區進行踏查，其踏查成果成為了日後原住民分類的雛型
  - label: D
    content: 戰後政府延續日本的分類，改稱高山族或是山地同胞，然平埔族卻因長期和漢人相處已失去文化特質，造成日後難以在法律上取得原住民族身分
