- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在25℃、1 atm的條件下，關於pH值的敘述何者正確？（原子量：Na＝23、O＝16、H＝1）
  options:
  - label: A
    content: 純水的pH值是0
  - label: B
    content: 酸性溶液的pH值永遠是正值
  - label: C
    content: 取0.4克的氫氧化鈉，加水配製成1升的水溶液，此溶液中的[$H^{+}$]＝1.0 × $10^{−12}$ M
  - label: D
    content: 承(C)，若將溶液稀釋為5升時，則$K_{w}$會變大
  - label: E
    content: 鹼性溶液的pH值代表溶液中的氫氧離子濃度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為7；(B)不一定，若濃度＞1 M，則pH就會小於0；(C) [$OH^{-}$]＝0.4/40＝0.01 M＝$10^{-2}$ M，故pOH＝2、pH＝12；(D) $K_{w}$只隨溫度而變；(E) pH值永遠代表氫離子濃度，不管溶液的酸鹼性。故選(C)。
