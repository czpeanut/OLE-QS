  section: 1
  number: 18
  type: single
  page: 2
  stem: 同溫下，體積莫耳濃度皆為0.1 M的下列各水溶液，何者的pH值最小？
  options:
  - label: A
    content: $CH_{3}$COOH（$K_{a}$＝1.8 × $10^{−5}$）
  - label: B
    content: HCN（$K_{a}$＝4.9 × $10^{−10}$）
