  answer_source: answer_key
  explanation: 兩性物質：可接收$H^{+}$也可解離出$H^{+}$的物質。(A)無法接收$H^{+}$；(B)無法解離$H^{+}$；(D) 無法解離$H^{+}$。故選(C)(E)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s2_22
  section: 2
  number: 22
  type: multiple
  page: 2
  stem: 已知布－洛酸的酸性強度：$HNO_{3}$＞$H_{3}O^{+}$＞$H_{2}SO_{3}$＞$H_{3}PO_{4}$＞HF＞$HNO_{2}$＞$H_{2}CO_{3}$＞$H_{2}$S＞$NH_{4}^{+}$＞$H_{2}$O，請判斷下列哪些反應的濃度平衡常數（$K_{c}$）＞1？
  options:
  - label: A
    content: $H_{2}PO_{4}^{−}$(aq)＋$H_{2}CO_{3}$(aq)$\rightleftharpoonsHCO_{3}^{−}$(aq)＋$H_{3}PO_{4}$(aq)
  - label: B
    content: $HNO_{3}$(aq)＋$NO_{2}^{−}$(aq)$\rightleftharpoonsNO_{3}^{−}$(aq)＋$HNO_{2}$(aq)
  - label: C
    content: $HS^{−}$(aq)＋$H_{3}O^{+}$(aq)$\rightleftharpoonsH_{2}$S(aq)＋$H_{2}$O(l)
  - label: D
    content: HF(aq)＋$NH_{3}$(aq)$\rightleftharpoonsF^{−}$(aq)＋$NH_{4}^{+}$(aq)
  - label: E
    content: $2HSO_{3}^{−}$(aq)$\rightleftharpoonsH_{2}SO_{3}$(aq)＋$SO_{3}^{2−}$(aq)
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)酸性：$H_{3}PO_{4}$＞$H_{2}CO_{3}$，平衡向左，K＜1；(B)酸性：$HNO_{3}$＞$HNO_{2}$，平衡向右，K＞1；(C)酸性：$H_{3}O^{+}$＞$H_{2}$S，平衡向右，K＞1；(D)酸性：HF＞$NH_{4}^{+}$，平衡向右，K＞1；(E)酸性：$HSO_{3}^{-}$＞$H_{2}SO_{3}$，平衡向左，K < 1。故選(B)(C)(D)。
