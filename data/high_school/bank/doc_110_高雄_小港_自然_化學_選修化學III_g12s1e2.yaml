  stem: 關於阿瑞尼斯酸鹼的定義以及對電解質性質的敘述，下列哪些正確？
  options:
  - label: A
    content: 酸性物質溶解在水中可以解離出氫離子
  - label: B
    content: 鹼性物質必定為離子化合物，如氫氧化鈉
  - label: C
    content: 鹽類物質必定為離子化合物
  - label: D
    content: 溶液中的陽離子數目與陰離子數目必相等
  - label: E
    content: 一般來說，水溶液皆為電中性
