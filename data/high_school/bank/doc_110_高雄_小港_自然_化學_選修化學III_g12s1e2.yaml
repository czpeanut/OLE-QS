  page: 1
  stem: 水在下列哪一反應中作為布－洛酸？
  options:
  - label: A
    content: $H_{2}$S(aq)＋$H_{2}$O(l)$\rightleftharpoonsHS^{−}$(aq)＋$H_{3}O^{+}$(aq)
  - label: B
    content: HCOOH(aq)＋$OH^{−}$(aq)$\rightleftharpoonsHCOO^{−}$(aq)＋$H_{2}$O(l)
  - label: C
    content: $NH_{4}^{+}$(aq)＋$H_{2}$O(l)$\rightleftharpoonsNH_{3}$(aq)＋$H_{3}O^{+}$(aq)
  - label: D
    content: $HCO_{3}^{−}$(aq)＋$H_{3}O^{+}$(aq)$\rightleftharpoonsH_{2}CO_{3}$(aq)＋$H_{2}$O(l)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 布洛酸，代表在溶液中會丟出氫離子。以水而言，丟出氫離子的產物為$OH^{－}$，故選(B)。
