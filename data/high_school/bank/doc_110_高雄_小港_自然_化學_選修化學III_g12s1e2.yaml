- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 同溫下，下列何種陰離子與$H^{+}$結合的趨勢最大？（$K_{a}$值$HNO_{2}$＝5.1 × $10^{−4}$、$H_{2}$S＝1.0 × $10^{−7}$、$CH_{3}$COOH＝2.0 × $10^{−5}$及HCN＝1.0 × $10^{−10}$）
  options:
  - label: A
    content: $Cl^{−}$
  - label: B
    content: $HS^{−}$
  - label: C
    content: $CH_{3}COO^{−}$
  - label: D
    content: $CN^{−}$
  - label: E
    content: $NO_{2}^{−}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 越弱的酸，其共軛鹼為越強的共軛鹼，與$H^{+}$結合的傾向越強。故選(D)的$CN^{－}$。故選(D)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '附表是數種酸鹼指示劑的變色範圍： 以下敘述何者為正確？

    | 指示劑 | 酸型顏色 | 變色範圍 | 鹼型顏色 |

    | --- | --- | --- | --- |

    | 甲基紅 | 紅 | 4.2～6.3 | 黃 |

    | 溴瑞香草酚藍 | 黃 | 6.0～7.6 | 藍 |

    | 石蕊 | 紅 | 4.5～8.3 | 藍 |

    | 酚酞 | ① | 8.2～10.0 | ② |'
  options:
  - label: A
    content: 酸鹼指示劑是一種有機強酸或有機強鹼
  - label: B
    content: 空格①應填入紅色
  - label: C
    content: 空格②應填入黃色
  - label: D
    content: 若水溶液的pH＝10.0，加入甲基紅會呈現紅色
  - label: E
    content: 若水溶液的pH＝10.0，加入石蕊和酚酞各一滴，水溶液會呈現紫色
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)弱酸或弱鹼；(B)無色；(C)粉紅色；(D)黃色；(E)石蕊呈藍色、酚酞呈粉紅色，混合在一起則為紫色。故選(E)。
