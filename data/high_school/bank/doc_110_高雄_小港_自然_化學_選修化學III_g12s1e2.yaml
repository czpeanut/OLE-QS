    content: $CN^{−}$為鹼性陰離子
  - label: C
    content: $Na^{+}$與$CN^{−}$皆易水解
  - label: D
    content: $Na^{+}$與$CN^{−}$皆不易水解
  - label: E
    content: $Na^{+}$易水解而$CN^{−}$不易水解
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $Na^{+}$為強鹼的陽離子，不水解；$CN^{-}$為弱酸的陰離子，水解產生$OH^{-}$。故選(B)。
