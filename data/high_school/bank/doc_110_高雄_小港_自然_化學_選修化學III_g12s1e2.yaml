- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s2_24
  section: 2
  number: 24
  type: multiple
  page: 2
  stem: 純水在25℃時的$K_{w}$＝1.0 × $10^{−14}$，而在60℃時的$K_{w}$＝1.0 × $10^{−13}$。有關溫度與$K_{w}$之間的關係，下列敘述哪些正確？
  options:
  - label: A
    content: $H_{2}$O(l)$\rightleftharpoonsH^{+}$(aq)＋$OH^{−}$(aq)是屬於放熱反應
  - label: B
    content: 在60℃時，pH＝7.0的溶液呈鹼性
  - label: C
    content: 在60℃、pH＝2.0的溶液與在25℃、pH＝2.0的溶液，具有相同的[$H^{+}$]
  - label: D
    content: 在60℃、pH＝2.0的溶液與在25℃、pH＝2.0的溶液，具有相同的[$OH^{−}$]
  - label: E
    content: 在100℃時，$pK_{w}$＞13.0
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)溫度升高，$K_{w}$值（＝[$H^{+}$][$OH^{-}$]）增加，代表解離量增加，平衡向右移動，故此反應為吸熱反應；$(B)_{60}$ $^{o}$C時中性的水溶液因[$H^{+}$]＝[$OH^{-}$]，故由$K_{w}$＝[$H^{+}$][$OH^{-}$]，[$H^{+}$]＝[$OH^{-}$]＝$10^{-6.5}$ M，pH＝6.5，故pH＝7.0的水溶液為鹼性；(C)正確，pH＝2.0就代表[$H^{+}$]＝$10^{-2}$ M；(D)錯誤，因為[$H^{+}$]相同，又$K_{w}$不同，故[$OH^{-}$]不同；(E)溫度更高，$K_{w}$也就越大，則$pK_{w}$（＝-$logK_{w}$）會越來越小，故會小於13。故選(B)(C)。
