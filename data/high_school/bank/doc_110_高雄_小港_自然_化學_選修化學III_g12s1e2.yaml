- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s2_26
  section: 2
  number: 26
  type: multiple
  page: 2
  stem: 下列哪幾組溶液組成具有緩衝溶液的性質？
  options:
  - label: A
    content: 0.1 M、50.0 mL的$CH_{3}$COOH＋0.1 M、50.0 mL的$CH_{3}$COONa
  - label: B
    content: 0.2 M、20.0 mL的$CH_{3}$COOH＋0.1 M、50.0 mL的NaOH
  - label: C
    content: 0.2 M、50.0 mL的$CH_{3}$COONa＋0.1 M、100.0 mL的HCl
  - label: D
    content: 0.5 M、10.0 mL的$NH_{3}$＋0.5 M、10.0 mL的$NH_{4}$Cl
  - label: E
    content: 0.5 M、30.0 mL的$NH_{4}$Cl＋0.4 M、40.0 mL的NaOH
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 緩衝溶液的組成：莫耳數接近的弱酸+弱酸鹽 or 弱鹼+弱鹼鹽。(A)(D)符合；(B)氫氧化鈉莫耳數＞醋酸莫耳數，故醋酸將完全被中和，溶液中幾乎不會有醋酸，無緩衝效果；(C)與(B)同理，兩者莫耳數相等，故溶液中幾乎不存在醋酸根；(E)與(B)同理，氫氧化鈉莫耳數＞銨根莫耳數，故銨根將完全被中和，溶液中幾乎不會有銨根，無緩衝效果。故選(A)(D)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s2_27
  section: 2
  number: 27
  type: multiple
  page: 3
  stem: 取0.10莫耳的苯甲酸（$C_{6}H_{5}$COOH，$K_{a}$＝4.0 × $10^{−6}$）與0.20莫耳的苯甲酸鈉配製成1.0升的溶液，則下列對於該溶液之敘述，哪些正確？（log 2＝0.3）
  options:
  - label: A
    content: 加50.0毫升的水於該溶液中，溶液之pH值為5.7
  - label: B
    content: 加50.0毫升的水於該溶液中，溶液中苯甲酸的解離常數變大
  - label: C
    content: 加碳酸鈉於該溶液中，溶液之pH值變小
  - label: D
    content: 加0.10莫耳氯化氫於該溶液中，溶液之[$H^{+}$]＝8.0 × $10^{−6}$ M
  - label: E
    content: 加0.20莫耳氫氧化鈉於該溶液中，溶液之pH值為12.0
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '[$C_{6}H_{5}$COOH]＝0.1 M、[$C_{6}H_{5}COO^{-}$]＝0.2 M，$K_{a}$＝4×$10^{-6}$。[$H^{+}$]＝$K_{a}$×$\frac{ [C_{6}H_{5}COOH] }{ [C_{6}H_{5}COO^{－}] }$＝2×$10^{-6}$，pH＝6－log2＝5.7。 （此為緩衝溶液的pH值） (A)加入少量水，pH不變，正確；(B)加水不影響$K_{a}$值；(C)加入少量鹼，pH值小幅增加；(D)加入0.1 mol的$H^{+}$，[$C_{6}H_{5}$COOH]＝0.1+0.1＝0.2 M、[$C_{6}H_{5}COO^{-}$]＝0.2-0.1＝0.1 M，[$H^{+}$]＝$K_{a}$×$\frac{ [C_{6}H_{5}COOH] }{ [C_{6}H_{5}COO^{－}] }$＝8×$10^{-6}$；(E)加入0.2 mol的NaOH，其中0.1 mol將苯甲酸中和，另0.1 mol則溶在水中，故[$OH^{-}$]＝0.1 M，pOH＝1，pH＝13。故選(A)(D)。'
