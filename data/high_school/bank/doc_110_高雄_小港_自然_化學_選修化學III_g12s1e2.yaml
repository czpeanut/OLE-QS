- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 將常溫的純水加熱至某一溫度時，[$H^{+}$]變為8.0 × $10^{−7}$ M。則下列敘述哪些正確？
  options:
  - label: A
    content: 此時純水呈酸性
  - label: B
    content: 此時溶液的[$OH^{−}$]為2.0 × $10^{−8}$ M
  - label: C
    content: 水的離子積變大
  - label: D
    content: 水的離子積不變
  - label: E
    content: 水的解離度變小
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)純水必呈中性；(B) [$H^{+}$]增加，故[$OH^{-}$]也增加(兩者會相同，因為是中性的溶液)；[$H^{+}$]增加，故[$OH^{-}$]也增加，因此$K_{w}$增加；(D)錯誤；(E) [$H^{+}$]增加、[$OH^{－}$]也增加，故解離的量變多了。故選(C)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 在25℃、1 atm下，鹽酸水溶液之pH值為5.0。取溶液1.0毫升稀釋到1.0升，求pH值應接近多少？
  options:
  - label: A
    content: '8.0'
  - label: B
    content: '7.0'
  - label: C
    content: '6.0'
  - label: D
    content: '5.0'
  - label: E
    content: '4.0'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: pH＝5，代表[$H^{+}$]＝$10^{-5}$ M，稀釋一千倍代表[$H^{+}$]＝$10^{-8}$ M，濃度很低，故接近中性水溶液。故選(B)。
- id: doc_110_高雄_小港_自然_化學_選修化學III_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 人體的血液為一緩衝溶液，當血液pH值低於7.35時，容易引起酸中毒，高於7.45時，則易引起鹼中毒。兩者均可能使酵素的反應趨緩甚至停止作用，而造成病變或死亡。因此人體血液的pH值可利用$HCO_{3}^{−}$與$H_{2}CO_{3}$的平衡系統調控，當pH值維持在7.4時，即[$H_{3}O^{+}$]＝4.0 × $10^{−8}$ M時，血液中$\frac{[\mathrm{H}_{2}\mathrm{CO}_{3}]}{[\mathrm{HCO}_{3}^{-}]}$的比值最接近下列何者？（已知$H_{2}CO_{3}$的$K_{a1}$＝4.3 × $10^{−7}$、$K_{a2}$＝5.6 × $10^{−11}$）
  options:
  - label: A
    content: 7.1 × $10^{−4}$
  - label: B
    content: 1.00 × $10^{−4}$
  - label: C
    content: '11.0'
  - label: D
    content: '0.093'
  - label: E
    content: 2.5 × $10^{3}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 已知pH＝7.4，[$H^{＋}$]＝4×$10^{-8}$（M）人體血液的緩衝系統中， [$H^{+}$]＝$K_{a1}$×$\frac{ [H_{2}CO_{3}] }{ [HCO_{3}^{－}] }$，4×$10^{-8}$＝4.3×$10^{-7}$×$\frac{ [H_{2}CO_{3}] }{ [HCO_{3}^{－}] }$，則$\frac{ [H_{2}CO_{3}] }{ [HCO_{3}^{－}] }$＝0.093。故選(D)。
