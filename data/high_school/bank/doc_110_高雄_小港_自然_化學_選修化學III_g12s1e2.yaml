  explanation: '[$H^{+}$]＝$\sqrt{ c_{0}k_{a} }$，故$K_{a}$越大、[$H^{+}$]越大、pH值越小。故選(D)。(只看$Ka_{1}$即可，因$K_{a1}$ >> $K_{a2}$)'
