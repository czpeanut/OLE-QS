    | f (x) | 2 | －1 | 1 | －3 |'
  options:
  - label: A
    content: 五實根
  - label: B
    content: 四實根一虛根
  - label: C
    content: 三實根兩虚根
  - label: D
    content: 無實根
  - label: E
    content: 無法判斷
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由表中知f (x) 在 ( 0 , 1 ) , ( 1 , 2 ) , ( 2 , 3 )之間有實根，但f (3)＝－3＜0， 且首項係數為正，必有某個大於3的數字α， 使得f (α)＞0， 則可找到一個比3大的實根， 可知f (x)＝0有5個實根， 故選(A)。
