  section: 1
  number: 8
  type: single
  page: 1
  stem: 小敏對地形景觀做分類，她將海蝕柱、火山頸、石灰岩殘丘歸為同一類，將海蝕洞、火山錐、滲穴、岩溝歸為同一類，可見她的地形分類依據最可能是？
  options:
  - label: A
    content: 作用時間
  - label: B
    content: 岩層軟硬
  - label: C
    content: 岩層排列
  - label: D
    content: 營力種類
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '海蝕柱、火山頸、石灰岩殘丘為侵蝕作用末期所出現的特徵，而海蝕洞、火山錐、滲穴、岩溝則是侵蝕作用初期。

    9.5、6 月主要為梅雨；7、8、9 月主要為颱風帶來的降雨。

    10.甲乙丙為離水海岸特徵，丁沙頸岬為沉水堆積地形。

    11.臺南冬季受較寒冷的中國沿岸流影響，而臺東為暖溼黑潮。

    12.(甲)沙質沙漠→風積作用；(乙)礫漠→風蝕；（吹蝕）作用(丙)岩漠→風蝕（吹蝕）作用；(丁)黃土原→風積作用。

    13.荷蘭位處北半球的西風帶，風車葉面朝向迎風處，轉動力量最大，北半球西風帶風向偏西南，故風車應面向西南方以獲取最大動能，故選(C)。

    14.(甲)隨著高度的上升，氣溫會下降，因此高度和氣溫成反比；(乙)相同高度下氣溫和氣壓為反比關係；(丙)隨著高度的上升，氣壓會下降，因此為反比關係；(丁)年溫差不僅跟緯度相關，還跟其他因素有關。緯度與年溫差沒有明顯的反比關係。

    15.(甲)南半球平均氣溫線隨緯度增高而下降成反比，而降水量曲線則有高低起伏；(乙)北半球平均氣溫線隨緯度增高而下降成反比，但降水量曲線則有高低起伏；(丙)雪線指終年積雪不融的下限，緯度 45 度以上地區，平均氣溫愈低，雪線就愈低。

    16.(B)開發人工措施，如修築水庫、攔砂壩等，會導致河川輸沙量減少，進而影響沙源的補充。(A)河川上游種植檳榔樹可能會破壞水土保持使沙源增多。(C)(D)禁止下游河川地開採建築砂石及砍伐原始林木改種植高山蔬菜與水果，雖然能夠減緩沙源減少的問題，但是其對沙源的影響不如開發措施來得大。

    17.題幹指的是北緯 0°～ 30°大陸東岸以及北緯 30°～ 60°的大陸西岸，故選丙己。

    18.水平距離一樣，壓力差最大者，風力最強，故選(A)。

    19.由於歐亞大陸東岸是親潮（寒流），西岸是北大西洋暖流，故東側溫度較西側低。而距海比較近的地方均溫較高，為距海遠近之因素所致，故選(B)(乙)(丙)。

    20.瓶中信隨著北太平洋環流而流經宜蘭。順序為(丁)親潮→(戊)北太平洋暖流→(乙)加利福尼亞涼流→(丙)赤道洋流→(甲)黑潮。

    21.突堤效應為堤前堆積，堤後侵蝕，故乙地堆積作用將比過去明顯。

    22.東非沿海受到(甲)行星風帶的季節移動影響，夏季為西南風、冬季為東北風；阿拉伯半島及南亞則因為(丙)大範圍海陸性質的差異，夏季為西南風、冬季為東北風。(乙)洋流系統無季節交替的現象；(丁)聖嬰和反聖嬰現象的交替，主要影響雨量與氣溫，非地方風系。

    23.1 月北半球陸地相對低溫。甲為南半球陸地，乙為南半球海洋；丙為北半球陸地，丁為北半球海洋。

    24.西非季風氣候區夏季吹溼熱的西南季風，冬季自撒哈拉沙漠吹來的東北季風。(A)(B) 1 月時低壓在南半球非洲陸地。(D)在撒哈拉沙漠的應為低壓非高壓。

    25.甲為南半球低壓，低壓為氣旋，氣流輻合向上，多陰雨天氣；乙為北半球高壓，高壓為反氣旋，氣流輻散向下，多晴朗天氣。

    26.在太平洋上，熱帶陽光下加熱赤道的海水往西到達菲律賓後，便往北向日本流去（黑潮），到達日本後轉東，洋流便被西風吹向東，流向加拿大西岸，稱為北太平洋暖流。到達北美洲西岸後，分為南、北兩支，往南方流動的稱為加利福尼亞涼流；往北方流動者，為阿拉斯加暖流，最後會合來自北極海的洋流形成親潮。北半球都是順時針方向旋轉，在南半球則相反，呈逆時針方向。但因南半球中高緯度的海洋較開闊，加上南極匯入的融冰，使西風漂流水溫低，為寒流性質，並因極地為南極洲陸地，洋流不會流至極地。

    27.此種地形為新月丘。(A)汕為濱外沙洲。(C)(D)多分布於物理風化較強盛之乾燥氣候區，地表缺乏水源。

    28.新月丘多分布於乾燥氣候區。

    29.新月丘凹處背風向，故為東南風。

    30.圖中為岩岸可以看到的地形，故選(A)新北市。(B)臺中市。(C)屏東縣。(D)嘉義縣皆以沙岸為主，除屏東縣南部恆春半島多珊瑚礁地形。

    31.順序應為丙海蝕洞侵蝕到穿透岬角形成甲海蝕門，最終頂端垮下，形成乙海蝕柱。

    32.戊為海蝕崖，為原先海蝕崖底部經海蝕形成海蝕凹壁後凹壁頂部之撐不住而崩壞而形成。

    33.(B)不是所有冰河地形海拔皆高，如冰磧平原。(A)(C)為 U 型谷特徵。(D)即冰斗湖。

    34.(A)面向湖泊開口的左、右及後側皆屬於流域的分水嶺，但並非角峰。(B)屬於冰河上游的冰斗湖，屬於冰蝕湖。(D)在今日全球暖化日益顯著之後，冰河及高山積雪融化的速度加快，故類似甲處的冰斗湖將愈來愈「多」。

    35.(C)圖中乙處位於冰河主流與支流的交會處，因支流侵蝕力不及主流，故兩者所形成的 U 型谷規模與相對高度亦有不同，故形成高度的落差而出現瀑布。

    36.因冰河的下游累積的冰雪量比較多且厚重，側蝕會更明顯，圖下（東方）U 型谷寬度較圖上（西方）寬，故為(D)由西向東流。

    37.圖 a 為谷灣，為沉水作用海面上升使原本海岸附近海水入侵，山谷變成海灣而成。圖 b 為峽灣，屬沉水海岸為昔日冰河侵蝕而成之 U 型谷被海水侵入而成。

    38.(A)因港口附近多為丘陵或山地地形，腹地通常不大。(C)峽灣為冰蝕地形的一種，土壤貧瘠。(D)多岩岸地形。

    39.(A)美國加州海岸無峽灣。

    40.(D)圖 b（62°N，5°E）所在處為大陸西岸的挪威，此處有南向北流的北大西洋暖流流經。

    41.(A)大崙→沙丘。(B)內海→潟湖。(C)鯤鯓→濱外沙洲。(D)三層→河階。

    42.(C)潮埔為介於高、低潮濱線之間，由細泥堆積成的地形。

    43.(甲)是要特別得知外傘頂洲，無須臺灣各工業區面積的數據；(丙)因主要是看外傘頂洲與北邊興建的六輕之關聯，與外傘頂洲附近之產業隨時間變化的數據無關；(丁)比較適合拿來佐證的是「各式防治外傘頂洲被侵蝕的措施」是否確實有對外傘頂洲面積造成影響，而非題幹所想佐證之「推測近年外傘頂洲面積消減主要由北邊興建的六輕造成」。

    44.兩者結果差距如此大的原因是時間因素，例如(甲)拍攝年分不同以及漲退潮時(丙)潮汐造成的海平面高度不同而導致外傘頂洲露出水面的範圍不同。(乙)照片拍攝角度不同、(丁)衛星偵測到的電磁波波段不同、(戊)拍攝照片的衛星軌道高度不同應只會造成圖片解析度或其他品質上的差異，不會導致外傘頂洲的實際位置改變。

    45.甲：對流雨；乙：鋒面雨；丙：地形雨；丁：氣旋雨（颱風雨）。「清明時節雨紛紛」、「黃梅時節家家雨」指的是冷鋒、滯留鋒所帶來的鋒面雨。

    46.記載內容主要敘述對流雨雨時短、強度大之特性。故選(A)甲。

    47.颱風雨短時間可降下超多雨量，降雨強度大，易致災。

    48.由亞洲陸地為高壓以及間熱帶輻合帶（I.T.C.Z.）位於南半球之線索可以得知為北半球冬季。

    49.此處靠近極地，為副極地低壓帶／極圈氣旋帶。

    50.推論一：間熱帶輻合帶會隨著太陽直射而在南北回歸線之間移動。推論二：間熱帶輻合帶在大陸上向高緯彎曲為正確，因為陸地增溫較快。推論三：間熱帶輻合帶為南北半球信風的交會帶。推論四：間熱帶輻合帶通過的地區大多為溼潤區。

    51.龜尾是海中的沙礫經沿岸流搬運沉積，而形成的沙嘴。

    52.(C)冬季時因東北季風的吹拂，龜尾向南偏，夏季時則因西南季風吹拂而向北偏。

    53.(甲)小琉球→珊瑚礁島；(乙)基隆嶼、(丁)蘭嶼、(戊)綠島→火山島；(丙)金門→大陸島。故選(D)(乙)(丁)(戊)。'
