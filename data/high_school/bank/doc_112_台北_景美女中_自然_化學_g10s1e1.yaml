- id: doc_112_台北_景美女中_自然_化學_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 自然界存在的物質大多為混合物，但在實際需求上常需要對混合物進行分離、純化。下列有關各種常見分離方法的敘述，何者正確？
  options:
  - label: A
    content: 蒸餾：利用混合物中各成分沸點不同，加熱使混合物中沸點較高的成分先汽化，而後使其蒸氣冷卻，即可收集到液態純物質
  - label: B
    content: 傾析：藉由小心傾斜容器，將液體倒出，留下密度小的難溶固體
  - label: C
    content: 過濾：可用於分離固體與液體，通常在混合物流動的路徑上，置入濾網或濾紙，利用顆粒大小的差異，使液體流過，而固體被攔下
  - label: D
    content: 層析：利用不同物質對固定相附著力的差異來分離物質，通常使用分液漏斗來操作
  - label: E
    content: 乾餾：通常會將混合物放入蒸發皿，透過加熱將沸點不同的物質分離
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)蒸餾：沸點較低的成分先汽化，最後不一定收集到純物質。

    (B)傾析：液體倒出，留下密度大的難溶性固體。

    (D)分液漏斗為萃取時使用的器材，而層析通常是使用濾紙和 TLC 片。

    (E)此方法為加熱蒸發結晶。'
