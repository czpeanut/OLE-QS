- id: doc_112_台北_景美女中_自然_化學_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 萃取是實驗室中用以分離物質常用的操作，今有一含碘的水溶液，欲以萃取法將碘自水中分離出來，所採用的萃取溶劑應具有下列哪一特性？
  options:
  - label: A
    content: 溶劑與水互溶，且該溶劑必須具有揮發性
  - label: B
    content: 溶劑與水互溶，且該溶劑需與碘反應
  - label: C
    content: 溶劑與水互溶，且該溶劑必須具有顏色
  - label: D
    content: 溶劑與水不互溶，且該溶劑的密度必須大於水的密度，以便收集
  - label: E
    content: 溶劑與水不互溶，且碘在該溶劑的溶解度需大於在水中的溶解度
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '萃取溶劑必須符合下列兩條件：

    (1)與混合物的溶液不互溶；(2)欲分離的物質在該溶劑的溶解度需大於在原溶液中的溶解度。'
