  stem: 一般市場上瓶裝水的價格均比花生等堅果便宜，但在美國的酒吧中，一瓶 500c.c. 的瓶裝水售價高達 5 美元，花生等堅果卻免費任人取用。請問以經濟學分析此現象最合理的解釋為何？
  options:
  - label: A
    content: 因為酒吧可以向原料廠商以低價大量購買花生等堅果，所以可免費提供堅果
  - label: B
    content: 酒吧中瓶裝水的價格愈高，酒吧的利潤就會愈多，所以將瓶裝水設定為高價
  - label: C
    content: 酒吧將水定高價，是希望顧客可以增加對啤酒的需求，此時水和酒是替代品
  - label: D
    content: 花生等堅果是消費者比較不喜歡吃的產品，所以酒吧就只好免費提供給顧客
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 酒吧市場的酒和水為替代品，若水的價格提高，消費者將會轉而購買酒類，故選(C)。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_18
