  stem: 臺灣居民早期消費能力常以「一碗魯肉飯和蘿蔔湯的年代」來形容，經過數十年打拚與經濟發展，今日才有能力享用披薩與炸雞等美食。請問改變這種消費型態的主要因素與下列何種情境是相同的？
  options:
