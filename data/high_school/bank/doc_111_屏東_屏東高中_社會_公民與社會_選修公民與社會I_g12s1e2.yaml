  explanation: 實質薪資＝（計算期之名目薪資÷計算期之消費者物價指數）×100，因此 2022 年雨萱的實質薪資是 30000÷103×100＝29126，1998 年雨萱的實質薪資是 20000÷84×100＝23809，故選(D)。(A)應衡量「實質所得」而非物價水準。(B)題幹提及兩個年度的 CPI，因此可以比較物價水準。(C)應考量「物價指數」。
