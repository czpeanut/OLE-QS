  stem: 生活在 2022 年的雨萱是在公司上班的 OL（辦公室女職員），月薪新臺幣 3 萬元（2022 年的 CPI＝103）。某天，雨萱靈魂穿越到 1998 年，成為另一個和自己長得一模一樣的女孩名叫韻如。化身為韻如的雨萱在唱片行打工，月薪新臺幣 2 萬元（1998 年的 CPI＝84）。請問 2022 年的雨萱與 1998 年化身成韻如的雨萱，誰的薪水可以購買較多的商品？
  options:
  - label: A
