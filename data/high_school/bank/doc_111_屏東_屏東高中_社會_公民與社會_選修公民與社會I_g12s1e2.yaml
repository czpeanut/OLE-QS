- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 騰騰是一名大學生，為賺取生活所需而到某公司擔任工讀生。老闆規定騰騰每天必須工作 10 小時，不得支領加班費，但可週休二日。騰騰可依下列何者的規定，主張自己的權利？
  options:
  - label: A
    content: 《公平交易法》
  - label: B
    content: 《勞動基準法》
  - label: C
    content: 《消費者保護法》
  - label: D
    content: 《民法》
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 《勞動基準法》第 30 條規定，勞工正常工作時間，每日不得超過八小時，每週不得超過四十小時。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 約定的共同財產制是指雙方結婚後，原先各自的財產及婚後產生的財產都會變成共同所有，但有一些「特有財產」可以維持個別所有。下列何者屬於「特有財產」？
  options:
  - label: A
    content: 婚前買的電視
  - label: B
    content: 婚前買的手機
  - label: C
    content: 婚後買的電鍋
  - label: D
    content: 婚後買的冷氣
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 選項的各項物品當中，僅「手機」屬於可個別所有的特有財產。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 依據我國現行法律規定，「繼承」這個法律事實的開始，是指被繼承人發生哪一件事情，繼承才會開始？
  options:
  - label: A
    content: 出生
  - label: B
    content: 死亡
  - label: C
    content: 滿 65 歲
  - label: D
    content: 訂定遺囑
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 我國《民法》關於繼承之規定，採取當然繼承主義，於被繼承人「死亡」（即繼承開始）時，其財產上之一切權利義務，由繼承人當然承受，毋須為任何意思表示。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 臺灣魔術方塊多項盲解紀錄保持人洪啟倫，2018 年在遮眼的情況下，以 24.80 秒鐘完成魔術方塊盲解，刷新紀錄，他將獨特的魔術方塊盲解公式等影片上傳 YouTube，但 2020 年一位黃姓男子採用該拆解公式並錄製影片上傳，讓洪男認為著作權遭侵犯，多次向黃男要求回應，但黃男沒有理會，最後直到提告後，雙方才和解。關於題文所牽涉到的著作權概念，下列敘何者正確？
  options:
  - label: A
    content: 洪男非魔術方塊的發明者，因此無權對黃男提告
  - label: B
    content: 影片是透過 YouTube 公開，因此無著作權之保障
  - label: C
    content: 黃男可主張自己的影片為「合理使用」避免侵權
  - label: D
    content: 洪男的影片被擅自重製，可主張智慧財產權受損
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)洪男為影片的創作者，其著作權受到侵害得提起告訴。(B)即使是上傳至 YouTube，同樣享有著作權的保障。(C)此舉並非合理使用之範疇。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 當所有權被侵害或有被侵害的可能時，《民法》訂有相關規範加以保護。如果阿豪買了新手機帶去學校炫耀，被小傑趁大家不注意時，自行拿去把玩、更改手機密碼，更賣掉他準備以 3,000 元賣給員員的虛擬寶物，甚至在操作時不慎滑落，摔破手機螢幕。請問根據我國法律，下列敘述何者正確？
  options:
  - label: A
    content: 要求賠償虛擬寶物的損失屬於所有物返還請求權
  - label: B
    content: 阿豪根據所有權妨害除去請求權要求恢復原密碼
  - label: C
    content: 若得知小傑有預謀偷拿手機，即可要求損害賠償
  - label: D
    content: 在本例中的損害賠償責任，應賠阿豪一全新手機
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)屬於「損失補償」。(C)應有「偷竊事實」才能要求。(D)尚包括「虛擬寶物」的損失賠償。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 小又與小柔相約一起去桃園球場看陳金鋒引退棒球賽。而棒球場為了應付眾多球迷到場，球場中的商家特別準備多於平時的周邊商品數量，並加聘臨時工讀生，以滿足到場球迷的需求。請問「增加商品數量」、「加聘工讀生人手」分別是屬於圖中的哪兩部分？
  options:
  - label: A
    content: 乙、丁
  - label: B
    content: 丙、丁
  - label: C
    content: 甲、丙
  - label: D
    content: 甲、乙
