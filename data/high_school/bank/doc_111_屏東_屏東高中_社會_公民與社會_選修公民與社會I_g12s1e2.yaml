- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_29
  section: 1
  number: 29
  type: single
  page: 6
  stem: 關於購買力平價指數的敘述，下列何者「有誤」？
  options:
  - label: A
    content: 購買力平價指數可反映各國間財貨與勞務代表性與品質的差距
  - label: B
    content: 購買力平價指數以人均的名目 GDP 作比較計算
  - label: C
    content: 需同時計算兩國財貨和勞務的產量與價格
  - label: D
    content: 大麥克指數與購買力平價指數的原理類似
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 購買力指的是人們支付貨幣購買商品或服務的能力，而購買力平價指的是不同國家間相同的一籃子財貨與服務的相對價格，即貨幣的相對購買力。(A)該指數並無法得知各國間的品質差異。(D)大麥克指數（the Big Mac index）是用來衡量不同貨幣相對於美元的價值差距，其以購買力平價為基礎，認為各國的匯率會自行調整，直到一籃子商品在不同國家的售價相同。
