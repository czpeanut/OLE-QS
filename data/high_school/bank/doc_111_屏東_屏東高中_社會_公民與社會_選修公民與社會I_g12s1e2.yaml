    content: 跨年夜位於市府廣場的超商湧入大量人潮
  - label: B
    content: 端午節將至，市場上的蛋黃竟然賣到缺貨
  - label: C
    content: 老爸找到工作後，我們就能夠到餐廳用餐
  - label: D
    content: 據說下週汽油漲價，週末加油的車輛增多
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹提及「打拚與經濟發展……才有能力享用」，亦即須有付出才有所得，符合(C)選項之情境。
