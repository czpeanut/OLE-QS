  stem: 某連鎖蔬食餐廳即將在一個人口不多的小鎮開幕，試營運期間，每天下午 2、3 點餐廳門口的人潮依舊絡繹不絕，小鎮難得的景象引起當地媒體關注。下列取自記者採訪內容的敘述，何者最符合「需求法則」？
