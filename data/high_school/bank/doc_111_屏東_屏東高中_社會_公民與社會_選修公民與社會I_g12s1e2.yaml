  stem: 某酒廠以候選人為主題推出紀念酒，決定生產 60 萬瓶，但上市兩週後卻接連跌價兩次，甚至因買氣疲軟，還打算繼續降價。大盤酒商指出，原本每瓶建議售價為 850 元，1 週後降價為 800 元，再過 1 週只好再降到 760 元，這樣的情形相當罕見。請問上文中紀念酒不斷跌價的現象，與下列何者較相似？
  options:
  - label: A
    content: 新北市某重劃區空屋過多，使房屋成交價格不斷下降
  - label: B
    content: 交通部推行夜市 50 元抵用券，花蓮東大門夜市人潮大增，為全臺最大受益者
  - label: C
    content: 厚奶茶熱潮退去，進貨量大減
  - label: D
    content: 政府推出只租不賣的社會住宅，使得周邊地區房價下跌
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題幹可推斷應是供給大於需求（超額供給）所致，與(A)供給過剩類似。(B)為需求增加，與題幹情形並沒有關聯。(C)需求減少，供給減少。(D)社會住宅與周邊地區房屋互為替代品。
