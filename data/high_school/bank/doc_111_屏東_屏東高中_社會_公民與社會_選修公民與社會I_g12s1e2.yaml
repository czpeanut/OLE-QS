      - 615.15
      - 564.3
      - 788.7
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 丙：投入生產力；丁：購買商品。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 依據世界經濟論壇（WEF）的報告，就現今機器人和 3D 列印技術的發展，對全球超過七百萬個就業機會造成威脅，我們可以推論機器人與就業機會之間的關係，與下列哪些產品間關係的描述是相同的？
  options:
  - label: A
    content: 鉛筆與橡皮擦
  - label: B
    content: 百事可樂與可口可樂
  - label: C
    content: 牙刷與牙膏
  - label: D
    content: 汽車與輪胎
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 機器人與就業機會為「替代關係」，故與(B)選項的產品關係相同。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 為因應高房價，某地方政府推出「包租代管」政策，鼓勵屋主將空閒房屋提供出來，由政府協助招租、租賃房屋管理。包租代管政策廣泛落實後，在需求不變的情況下，可能對租屋市場產生什麼影響？
  options:
  - label: A
    content: 屋主選擇將空閒房屋放著不租，租屋價格維持高位
  - label: B
    content: 屋主預期未來房價上漲，提前將空閒房屋賣出
  - label: C
    content: 住客更難獲得租屋資訊，租賃需求減少
  - label: D
    content: 租房選擇變多，壓低整體租屋價格
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹為「政府干預」手段，可能壓低整體租屋價格，故選(D)。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 2019 年底開始，非洲東部的肯亞、衣索比亞以及索馬利亞等國遭到數十億的蝗蟲侵襲，大量蝗蟲把作物吃光，使許多國家陷入了嚴重的糧食危機。上述事件會如何影響東非國家糧食作物的供需？
  options:
  - label: A
    content: 需求線左移
  - label: B
    content: 需求線右移
  - label: C
    content: 供給線右移
  - label: D
    content: 供給線左移
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 大量蝗蟲把作物吃光，將會影響糧食供給（供給線左移），故選(D)。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 小吳逛街發現櫥窗裡有個看對眼的公仔，馬上拿到櫃臺結帳，店長讓其檢查確認後，就用原本的盒子包裝好，並交給小吳。但小吳回家後發現朋友寄來一個一模一樣的公仔，於是隔天帶著未拆封的公仔到購買的那間店辦理退貨，並要求退回所付金額。店長告訴小吳，櫃臺貼著「本店小本經營，商品一經售出，概不退換」告示，因此不願意退錢。請問從《民法》及《消費者保護法》審視，下列有關小吳及店長主張的敘述，哪一項最合理？
  options:
  - label: A
    content: 小吳沒有打開公仔包裝，店長應該同意讓小吳無條件退貨
  - label: B
    content: 小吳在購買後 7 天內就拿回店面，店長應該讓小吳退貨
  - label: C
    content: 小吳應該在購買超過 7 天後，再拿回店面跟店家要求退貨
  - label: D
    content: 小吳購買的公仔除非有瑕疵，店長才有義務同意退貨
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 消費者得於 7 日無條件退換貨的僅限於特種買賣（通訊與訪問交易），並不包含實體店面。在實體店面購買時，僅於所購商品有瑕疵時，業者才有退換貨之義務。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 隆隆和琪琪結婚後，買了一層公寓，頭期款由雙方各付一半，剩下每個月的房貸由隆隆支付，這間房屋的產權全部登記在琪琪名下。隆隆和琪琪沒有特別約定夫妻財產制，從法定財產制的角度來看，下列何者正確？
  options:
  - label: A
    content: 這間房屋為琪琪和隆隆共同持有
  - label: B
    content: 這間房屋要賣出，需由琪琪和隆隆兩人同意
  - label: C
    content: 隆隆負責每個月房貸支付，如兩人離婚，隆隆可以優先取得這間房屋的所有權
  - label: D
    content: 如兩人離婚，隆隆可以要求取得房屋的部分權利
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)該房屋的產權登記在琪琪名下，故琪琪擁有所有權，得自行處分該房屋。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 小天是家中長子，父母在一場意外中離開，小天剛成年就擔起照顧三名弟妹的責任，也因為拉拔弟妹長大，小天始終未婚無子。小天去世後留下 300 萬遺產，弟弟小明、未婚的妹妹小晴、已結婚的妹妹小雨分別可以分到多少遺產？
  options:
  - label: A
    content: 小明 300 萬、小晴 0 元、小雨 0 元
  - label: B
    content: 小明 50 萬、小晴 50 萬、小雨 50 萬
  - label: C
    content: 小明 150 萬、小晴 150 萬、小雨 0 元
  - label: D
    content: 小明 100 萬、小晴 100 萬、小雨 100 萬
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 小天未婚無子，父母也已亡故，因此其遺產將由三位兄弟姐妹均分。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 財政部國庫署 2022 年 1 月時表示，2021 年無人繼承的遺產剩餘，合計金額達 5,653 萬元。其中，最大筆為 1,222 萬元。國庫署表示，根據規定，無人繼承的遺產，在公示催告期滿後，經清償債權並交付遺贈物後，如有剩餘，就要歸屬國庫。根據國庫署的公告判斷，以下哪些同學的解讀是「錯誤」的？
  options:
  - label: A
    content: 保仁：國庫署處理這些無人繼承的遺產，主要依據《民法》的法律規定
  - label: B
    content: 柏仁：會遺留 1,222 萬元無人繼承，可能是那個人已沒有後代或親屬了
  - label: C
    content: 建州：這些遺產無人繼承，可能是因為那個人生前已經辦理了拋棄繼承
  - label: D
    content: 麗華：1,222 萬元無人繼承，可能那個人生前未立下遺囑指定繼承人
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)拋棄繼承為「繼承人」的權利。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 德科家有父母、弟弟、妻子、兒子、媳婦和孫子等八人，他早早立下了遺囑，後來有天德科因為交通事故身亡。依據我國遺產繼承制度，下列有關敘述何者最為正確？
  options:
  - label: A
    content: 德科身亡後，血親繼承人的第一順位必然為兒子，與妻子共享繼承權
  - label: B
    content: 即使德科在遺囑裡將遺產全留給父母，妻子仍然可依法保留其特留分
  - label: C
    content: 德科的兒子拋棄繼承其遺產，依法定繼承之規則，由德科的父母繼承
  - label: D
    content: 若德科的兒子在得法定應繼分前死亡，則遺產可以由孫子為代位繼承
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因立有遺囑，故兒子未必是第一順位繼承人。(C)因立有遺囑，未必是由父母繼承。(D)因立有遺囑，故並非應繼分，而是特留分。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 王先生去年因景氣不佳而遭到公司資遣，今年景氣回溫，王先生到藍海公司去應徵技術員，請問王先生到藍海公司應徵工作的歷程，符合下列哪個概念？
  options:
  - label: A
    content: 產品市場的供給
  - label: B
    content: 產品市場的需求
  - label: C
    content: 生產要素市場的供給
  - label: D
    content: 生產要素市場的需求
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 王先生為生產要素市場的「勞動力」供給。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 下列何者，會造成蘋果需求量的變動？
  options:
  - label: A
    content: 香蕉價格上漲
  - label: B
    content: 天候異常的影響
  - label: C
    content: 進口大量外國蘋果
  - label: D
    content: 蘋果的售價不斷攀升
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 產品本身的「價格」改變將會影響「需求量」的改變。(A)替代品價格變動，影響蘋果需求而非需求量。(B)天候因素變動應是造成供給變動。(C)進口大量蘋果是供給變動。
- id: doc_111_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_17
  section: 1
