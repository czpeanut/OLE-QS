  stem: 下圖為 1950 年代以來，中國北京某種天氣現象每天平均日數分布圖。該天氣現象最可能為下列何者？
  options:
  - label: A
    content: 降雪
  - label: B
    content: 豪雨
  - label: C
    content: 焚風
  - label: D
    content: 沙塵暴
