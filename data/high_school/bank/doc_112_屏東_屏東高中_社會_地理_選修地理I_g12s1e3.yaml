questions:
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若要調查瑠公圳三大圳道的坡度百分比、坡向、坡形，需藉由何種地理資料來進行分析？
  options:
  - label: A
    content: DTM
  - label: B
    content: GNSS
  - label: C
    content: VGI
  - label: D
    content: WGS
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) DTM 為數值地形模型，可利用（X，Y）坐標的空間資料再加屬性資料的高度坐標，做出 3D 的地形分析。(B) GNSS 為衛星定位系統。(C) VGI 為自願者地理資訊。(D) WGS 為世界大地測量系統。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 西元 1894 年，英國倫敦霍亂大爆發，John Snow 醫生在蒐集水井的位置、霍亂感染者住家的位置後，歸納出病源來自於受汙染的水源，因而被視為現代流行病學之父。Snow 醫生當時的空間分析方法，屬於下列現今 GIS 的何種分析概念？
  options:
  - label: A
    content: 環域分析
  - label: B
    content: 疊圖分析
  - label: C
    content: 網路分析
  - label: D
    content: 空間查詢
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)蒐集水井位置的分布圖以及病患的住家分布，加以疊圖分析，做出兩者高度相關的結論。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 韌性城市是指面對災害時，城市具有足夠的災害容受力、恢復力，確保都市在面對未來極端氣候時的韌性。若按照其概念，下列哪項指標會與韌性程度高低成正相關？
  options:
  - label: A
    content: 土石流潛勢溪流數
  - label: B
    content: 公共設施用地面積
  - label: C
    content: 人口密度
  - label: D
    content: 二、三級產業比例
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹中提及足夠的「災害容受力、恢復力」應與(B)公共設施密度（如滯洪池、避難公園）成正比，與(A)(C)(D)相對成反比（如：人口密度越高，承受災害能量較低）。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 透過 GIS 把史料上的地點圖像化後的六堆聚落分布圖，透過六堆聚落與周遭河流、地下水等自然環境的關係討論，發現六堆聚落不需擔憂水資源匱乏，享有豐富的資源，成為強大的勢力聚落。請問六堆聚落聚集在河道出谷口的地下水豐富地區，請推論該地為下列何種河流地形？
  options:
  - label: A
    content: 峽谷
  - label: B
    content: 三角洲
  - label: C
    content: 氾濫平原
  - label: D
    content: 沖積扇
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題目中提及：「六堆聚落不需擔憂水資源匱乏、位在河道出谷口的地下水豐富地區」，由此條件可知六堆應位在出山口的(D)沖積扇。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 1931 年倫敦地鐵員工 Harry Beck 為解決地鐵路線太過複雜、一般民眾不易理解的難題，採用拓撲地圖概念設計出一種簡化的地鐵路網圖，後來為各國捷運地圖所仿效，這種路線網圖可以精確的表達下列哪些站與站間的關係？(甲)距離(乙)方位角(丙)前後順序(丁)路線交會節點(戊)車站面積大小
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 丙丁
  - label: C
    content: 丁戊
  - label: D
    content: 甲戊
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 拓撲地圖僅呈現各路線的正確交會點、站名正確、站點前後順序正確，方向、距離等都不正確。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 傳統紙本的文史資料及現代數值地圖資料皆能協助文史探究。下列關於傳統紙本、現代數值地圖資料呈現與處理特性描述，何者敘述「有誤」？
  options:
  - label: A
    content: 數值地圖利於以電腦系統管理與分析
  - label: B
    content: 航空照片相較紙本地圖更能即時反映地表變動
  - label: C
    content: 現代地圖相較古地圖，更能建構早期居民生活空間
  - label: D
    content: 衛星影像適合進行全球環境監測
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)古地圖雖不具備現代化的比例尺，距離感不夠正確，但寫景式的畫法，能呈現出接近過去地表的樣貌，較現代地圖寫實，又稱為山水式畫法。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 工作坊式的 PPGIS 能強化民眾對議題的認識，並增進參與意願，但仍有其限制。關於下列工作坊式 PPGIS 的操作限制，何者敘述「有誤」？
  options:
  - label: A
    content: 工作坊須於固定時間、空間進行討論
  - label: B
    content: 參與者的匿名特性使意見資料正確性受質疑
  - label: C
    content: 參與者表達能力強弱不一，可能造成少數人壟斷建議
  - label: D
    content: 會議主持者身分或語言與當地居民有落差，無法引導居民表達意見
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)工作坊式的 PPGIS，參與學員應都有經過報名程序，不會有匿名資料正確度的疑慮。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 面量圖原理是假設其地理現象平均分布在界限明確的區域中，故又稱區域密度圖。在下列研究主題中，哪項最適合以面量圖呈現？
  options:
  - label: A
    content: 臺灣地區的人均機車量
  - label: B
    content: 臺灣地區的都市分布
  - label: C
    content: 臺灣地區的懸浮微粒濃度
  - label: D
    content: 臺灣地區的溫度高低
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)面量圖適合呈現行政邊界清晰的資料量、且該區域內該資料視為均質（不適合漸變的資料屬性），以臺灣行政區為單位，呈現出人均機車數量別，適合與他國比較。(B)都市分布為點資料，無法以平均分布的狀態呈現。(C)空氣懸浮濃度、(D)溫度適合以漸變等值線呈現空間分布。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 臺灣投入相當多的資金與技術，研發許多附加價值高的水果，像是蓮霧、鳳梨、香蕉、釋迦、葡萄。透過地理資訊系統，並且整合農業區的數據，可以比對土壤、平均降水量、平均氣溫等，得以評估使用多少灌溉水量、肥料投入，更能有效地使用農地，進而產出更優質的水果。這種型態的農業發展，最符合以下何種？
  options:
  - label: A
    content: 精準農業
  - label: B
    content: 生態農業
  - label: C
    content: 觀光農業
  - label: D
    content: 自給農業
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 以 GIS 系統精確調查、記錄每個農業區的細部條件，種植過程中能因地制宜，給予最適合的肥料、水分等，稱為(A)精準農業（科技農業的一環）。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: YouBike 2.0 公共自行車車身搭載「智慧車機」取代原停車柱租借的功能，民眾可透過下載「YouBike 微笑單車 2.0 官方版」App，就能掃碼借車，其運行方式仰賴不少 GIS 或 3S 的整合功能。請問關於 YouBike 微笑單車 2.0App 上地圖資料的應用，下列敘述何者正確？
  options:
  - label: A
    content: YouBike 租借站位置採網格模式儲存
  - label: B
    content: 想查看距離自己最近的 YouBike 租借站，可利用地勢分析
  - label: C
    content: 欲規劃到 YouBike 租借站的移動路徑，可採環域分析
  - label: D
    content: 藉由屬性查詢可得知某租借站可停、可借之車輛數
  explanation: 此題的選項有誤，部分描述不符合 GIS 或 3S 技術的實際應用，且選項內容不清楚或不適用於 YouBike 系統，故無解。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: Google Maps 能透過交通監測，呈現即時的交通流量，告知使用者目前各路段為通暢或塞車，供使用者做交通路線的選擇。而背後交通監測的資料很大部分是來自使用 Google 相關 App 的民眾無形中貢獻出的資料，藉以讓 Google 系統再分析出交通流量。Google 能收集到使用者的交通資料，係仰賴下列何種技術？
  options:
  - label: A
    content: GIS
  - label: B
    content: GPS
    asset:
      key: s1_12_optB
      file: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3/s1_12_optB.png
      crop:
        page: 2
        rect:
        - 420.05
        - 416.6
        - 564.3
        - 543.35
  - label: C
    content: RS
  - label: D
    content: PPGIS
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)交通監測主要是分析每個使用 Google App 的用戶，其 GPS 停留在該路段的時間與過去平均時間相較，得知當地是否有交通延遲的現象。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_14
  section: 1
  number: 14
  type: single
