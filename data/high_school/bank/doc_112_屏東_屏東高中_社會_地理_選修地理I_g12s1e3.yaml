- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 2020 年，嚴重特殊傳染性肺炎（COVID-19）肆虐全球，政府快速徵召各地口罩的原料生產及製造廠商，建立口罩生產線，組成口罩生產國家隊。此外，權責機關掌握口罩數量安排分送至健保特約藥局後以實名制販售。民眾透過 GIS 口罩地圖可以掌握特約藥局的分布位置及口罩存量，決定去哪裡購買口罩。右圖是販售口罩的健保藥局分布及路網地圖，各藥局皆供應無虞。某人運用 GIS 分析功能選取住家附近可購買口罩的藥局，請問第一種功能建議至乙藥局購買，第二種功能建議至丁藥局購買，這是分析運用 GIS 的哪一項分析功能？
  options:
  - label: A
    content: 路徑、環域分析
  - label: B
    content: 疊圖、路徑分析
  - label: C
    content: 環域、路徑分析
  - label: D
    content: 路徑、疊圖分析
  assets:
  - key: s1_15_f1
    kind: figure
    file: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3/s1_15_f1.png
    crop:
      page: 2
      rect:
      - 384.95
      - 637.4
      - 564.3
      - 789.2
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)住家位置與丁藥局直線距離最近，但是其實無路可前往，因此應為環域分析（只考慮絕對距離）所做出來的分析；乙藥局才是最佳路徑之下最快能抵達的藥局。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: '「與國家公園有約活動：海拔超過 1,500 公尺的新竹縣司馬庫斯，為國家公園周邊鄰近部落，部落中的司立富步道大約有 20 棵巨木，其中有十大巨木中的神木，周長約 20 公尺，樹齡約在 2,500 年。國家公園管理處邀您一起來體驗不同的森林浴，享受沉浸在巨木群中的另類感受。」請問上文中的國家公園，其 TM2 坐標應為下表中何者？

    ▼臺灣本島 6 座國家公園管理處 TM2 坐標

    |  | X 坐標 | Y 坐標 |

    | --- | --- | --- |

    | 甲 | 305216 | 2783145 |

    | 乙 | 227404 | 2427884 |

    | 丙 | 163091 | 2543768 |

    | 丁 | 237676 | 2704896 |

    | 戊 | 234746 | 2634355 |

    | 己 | 313167 | 2672604 |'
  options:
  - label: A
    content: 甲
  - label: B
    content: 丙
  - label: C
    content: 丁
  - label: D
    content: 己
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 表中為臺灣本島 6 個國家公園坐標，甲：Y 坐標最大，為最北的陽明山國家公園；乙：Y 坐標最小，為最南的墾丁國家公園；丙：X 坐標最小，代表最西側為台江國家公園。再將丁戊己做比較，其中戊：Y 坐標最小，為嘉義的玉山國家公園；己：X 坐標 313 相對偏東，應為太魯閣國家公園；丁：X 坐標 237 偏西，為雪霸國家公園。故答案選(C)丁。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 承上題，司馬庫斯 PPGIS 工作坊的成果除能提供政府環境資源管理、釐清部落傳統領域與國有地範圍外，還能達到何種效益？
  options:
  - label: A
    content: 記錄司馬庫斯聯外道路的位置
  - label: B
    content: 彙整司馬庫斯教堂、鄰近學校等設施資訊
  - label: C
    content: 蒐集部落附近野生動植物的物種
  - label: D
    content: 讓部落的年輕世代與父祖輩世代透過 PPGIS 進行培力與對話
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D) PPGIS 提供科技平臺與民眾參與，能讓部落中年輕世代與長老有一個新的傳承與溝通平臺。
- id: doc_112_屏東_屏東高中_社會_地理_選修地理I_g12s1e3_s1_18
  section: 1
  number: 18
