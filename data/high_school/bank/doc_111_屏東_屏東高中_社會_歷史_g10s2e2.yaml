  stem: 明代長期實施海禁，使沿海居民難有正規出路，不得不冒險從事「走私貿易」，直到何時明朝才逐漸解除海禁？
  options:
  - label: A
    content: 鄭氏據守的臺灣納入版圖後
  - label: B
    content: 鴉片戰爭訂《南京條約》後
  - label: C
    content: 倭寇之禍稍平息後
  - label: D
    content: 平定太平天國之後
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 明初為防倭寇而實施海禁，至明中葉倭寇之禍稍平息後，才稍微鬆綁海禁令，(C)為正解。(A)為清代解除海禁的時間。
