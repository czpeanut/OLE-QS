  stem: 六鎮之亂後，北魏分裂為東魏與西魏，最終西魏――北周勝出的關鍵因素為何？
  options:
  - label: A
    content: 固守胡人傳統，以其強大武力統一北方
  - label: B
    content: 排除胡人守舊勢力，重用漢人力行漢化改革
  - label: C
    content: 致力發展農業，經濟實力遠勝東魏――北齊
  - label: D
    content: 整合胡漢，借重關隴集團之力完成統一
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)西魏宇文泰結合關中地區的漢人與鮮卑勢力，形成胡漢融合的關隴集團。(C)東魏――北齊有東海漁鹽之利，經濟實力遠勝西魏――北周。
