  stem: 吉田是一位在 1920 年代移民到美國定居的日籍人士，請問他和當時其他赴美的日人在 1940 年代太平洋戰爭爆發後，最有可能會經歷下列何種情況？
  options:
  - label: A
    content: 被美國政府遣送返回日本
  - label: B
    content: 遭到強制遷移與集中管理
  - label: C
    content: 美國公民的身分被取消
  - label: D
    content: 被強制離境前往其他國家
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 在太平洋戰爭期間，美國唯恐境內日籍人士成為間諜，因此凍結境內日僑的銀行帳戶，甚至將之強制遷移與集中管理，(B)為正解。
