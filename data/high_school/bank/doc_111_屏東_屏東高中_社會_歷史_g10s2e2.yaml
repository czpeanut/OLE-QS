  stem: '資料一：朕聽聞三代以前，國家並未有佛教出現，一直到漢、魏之後，佛才日漸興起，在不自覺間耗損了國力。興築佛教寺院，使信徒疲於奔命，還奪取信徒的錢財，以戒律限制違背人倫常規。……佛教寺廟富麗，猶如宮殿一般，晉宋齊梁，國力衰敗皆是因佛教過盛的關係。今拆四千六百多所寺廟，命令二十六萬五百名僧尼還俗為平民，拆修行所四萬多處，收回肥沃土地數千萬頃。

