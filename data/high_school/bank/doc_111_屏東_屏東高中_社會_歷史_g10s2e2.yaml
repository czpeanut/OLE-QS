  stem: 魏晉南北朝時期，道教因為提供服食丹藥與追求長生的方術，深受上層階級青睞。請問煉丹術對於中國文化產生何種影響？
  options:
  - label: A
    content: 佛道一家親，共榮發展
  - label: B
    content: 促進中國草藥礦物學
  - label: C
    content: 確立長生不老的典故
  - label: D
    content: 建立《道德經》神聖地位
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 煉丹術原為道士追求長生不死的丹方，雖然目標沒有達成，但在提煉丹藥的過程中能了解各種藥草與礦物的特性與功效，有助於中國醫藥學的發展，(B)為正解。
