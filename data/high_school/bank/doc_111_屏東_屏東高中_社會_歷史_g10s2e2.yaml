- id: doc_111_屏東_屏東高中_社會_歷史_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 一篇文告指出：「賊人焚燒學宮，破壞孔子神主牌，所到之處，佛寺、道觀、城隍廟、社稷壇，均遭焚燬。所以號召有識之士起來討伐。」這篇文告提到的「賊」，最可能是指
  options:
  - label: A
    content: 東漢末年黃巾之亂
  - label: B
    content: 元末的白蓮教徒
  - label: C
    content: 清末的太平天國
  - label: D
    content: 清末西北及西南的回變
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '賊人所到之處破壞廟宇，連同孔廟與孔子神主牌也遭焚毀，由此可知此「賊人」即是清末的太平天國，答案為(C)。

    7.19 世紀移居東南亞的漢人移民，多配合殖民政府的經濟需求而從事熱帶作物栽種與開採礦物，答案為(B)。

    8.從「彌勒降生」、「明王出世」的口號，可推知此為白蓮教的活動。白蓮教在元末引發紅巾之亂，朱元璋早期亦曾經加入該組織，又退出改以民族革命為號召，最終推翻元朝，(A)為正解。

    9. 1950 年代美國已無《排華法案》，移民美國的華人移民多經濟移民或專業移民，因此較易融入在地社會且多取得美國籍，答案為(C)。(A)(B)(D)為 19 世紀初代華人移民的遭遇與心態。

    10.印度佛教僧人並無葷素的禁忌，中國漢傳佛教原承襲此制，但在魏晉南北朝時期梁武帝規定素食戒律後，茹素成為定制，答案為(C)。

    11.(A)多來自浙江、江蘇、江西和福建、廣東。(C)到日本的華人多從事通事或貿易。(D)這些華商多來自中國東南沿海地區，並無回民起事。

    12.所謂的「落葉歸根」指長年旅居異地之人能返回家鄉或是死後能歸葬鄉里，因此(A)舉動符合。

    13.外國商人從中國購買的自是傳統高級奢侈品瓷器、絲綢，(D)為正解。(A)蔗糖、樟腦產自臺灣。(B)香料產自南洋。(C)產自臺灣。

    14.(A)道教與佛教為多神信仰，非一神教。(B)佛教曾遭大力打壓，道教並無。(C)儒釋道三教至明代才合一，且僅儒家思想才是中國哲學思想的核心。

    15.西方列強在東南亞殖民時期，華人常扮演統治者的協力工作者，尤其在經濟貿易方面，印尼的華人即是如此，因此被印尼住民視為經濟掠奪者而排擠，(D)為正解。

    16.「苦力」即契約勞工，在英法聯軍後得以合法出海工作，填補西方國家廢除奴隸貿易後不足的勞動力，(B)為正解。(A)清朝並未鼓勵苦力貿易。(C)華人移民成為開發殖民地的重要勞動力。(D)並無此事。

    17.(A)女真人亦創造自己的文字。(B)契丹人與女真人並未嚴格禁止與漢族通婚，但也未普遍通婚。(D)金朝亦實施二元統治，並未平等對待女真人及漢人。

    18.清末知識分子傾向前往距離較近的日本留學，除了花費較少外，日本變法成功成為亞洲強國的經驗，自然也成為年輕士子傾慕嚮往的對象，因此答案為(C)。

    19.題文所述應是一戰期間前往歐洲的華工經歷，中國在 1917 年參戰後即採「以工代兵」政策，大量華工被送往歐洲協助軍需相關工作，(C)為正解。

    20.「改土歸流」是廢除自元以來的土司政策，廢除當地土官職務，改由中央派流官到西南各少數民族區域治理。此政策實施後引起地方反彈，但在強力鎮壓之後，有利於漢人前往開墾與交流，(C)為正解。

    21.題幹說明黃河中、下游雖然市鎮數量很多，但已經開始衰退；長江三角洲的市鎮數量少，但貿易額很大，顯見江南正在發展中，經濟重心尚未南移完成。(A)重心仍偏北方，(C)(D)經濟重心已完全在南方，因此(B)為正解。

    22.日本「封建制度的廢除，以及身分制度的瓦解」，皆在明治維新之後，因此答案為(B)。(A)(D) 1930 年代，(C) 1914 年，時間與題文不符。

    23.美洲引進的作物有馬鈴薯、番薯與玉米，(D)為正解。

    24.(B)仍保留部分中國文化，但生活習慣、語言則與當地族群結合。(C)華人多仍信仰道教、佛教等傳統宗教。(D)明清政府視海外華人為天朝棄民。

    25.中國史上特別將道教提升至國教地位的朝代為唐代，主要是因為李唐王室自詡為老子李耳的後裔，欲利用道教來加強政治管控，答案為(C)。

    26.「新金山」之名稱乃是相對於「舊金山」，在澳洲墨爾本發現金礦前，更早的淘金熱潮是在美國加州，(B)為正解。

    27.東干族源自陜甘回民的移徙，在陜甘回變後為躲避官兵的追擊，輾轉逃至中亞一帶，(B)為正解。(A)(C)(D)東干族來自陜西、甘肅，在文化上仍保留原鄉陜甘的傳統。

    28.從史料記載中的「呂宋」一地，可推知此為西班牙在菲律賓屠殺華人，(B)為正解。

    29.在宣揚佛法的文章裡，以中國之儒家思想或道家無為理論去比附佛教觀念，可推知此時應是佛教初傳入中土，故借用中國固有的思想與觀念解說佛理，讓中國人更容易接受佛教信仰，(A)為正解。

    30.明治政府提倡移墾北海道以減輕本州的人口壓力，尤其為安置許多在明治維新後失去身分的中下層武士，在北海道實施屯田兵制，鼓勵這些沒落的武士前往開墾，答案為(B)。

    31.現代川劇以四川燈戲為基礎，融合了浙江、湖南、蘇州等地的戲曲、舞蹈等而成，可見應是在「湖廣填四川」的時期，即(D)明清。

    32.題文所述為永嘉之禍五胡亂華前的廷議，有識之士建議朝廷將中原內部的胡人全徙往邊地，但不被朝廷所採納。首先起事的匈奴，係於東漢光武帝時開放降漢後移居中原的南匈奴，答案為(B)。

    33.兩地華商會館裡的帆船模型相同，應是兩地會館的華商來自相同的原鄉，答案為(A)。(B)會館為華商所建，為漢人。(C)中越與新加坡兩地距離不近，文化與傳統差異甚大。(D)兩百多年前的中國有海禁，統治者不可能贈禮給東南亞的華商。

    34.題文所述的條約應是 1876 年的《江華條約》，使日本勢力正式進入朝鮮。當時朝鮮王朝無力應付來自日本和歐美列強的壓力，朝內又政爭不斷，加上天災頻繁造成糧食短缺、人民生活困難，有些人民選擇向外遷徙以謀生機，以移往中國東北或中俄邊境為多，(B)為正解。

    35.資料一的皇帝下詔命令大臣斷北語，否則降黜開罰；資料二則將拓拔之姓改為元，皇帝亦賜自代南遷的功臣舊漢姓。兩則資料皆在說明北魏孝文帝的漢化政策內容，答案為(A)。

    36.北魏太武帝、北周武帝、唐武宗毀佛的原因不盡相同，但三則資料分別提及「閱其財產」、「貪逐財食」、「收充兩稅戶」、「收膏腴上田數千萬頃」等，可知皆從經濟角度出發去論述，答案為(D)。

    37.資料一的皇帝認為佛教過盛將使國力衰敗，故而下令毀佛；資料二提及日本明治政府排佛以確立神道教國教地位。綜合兩者，選(A)，不選(D)。(B)(C)兩則資料皆看不出要端正儒教傳統或是支持道教勢力。

    38.附圖顯示為元朝的民族政策，至於其文化政策則以維持多元文化為主，答案為(C)。

    39.(B)明清初期皆實施海禁政策，因此東南地區對外貿易頓時跌入谷底。

    40.甲箭頭往海外，為明清後的人口移動方向；乙箭頭只向南移，為北宋末年靖康之難後的人口移動；丙箭頭除了南移，亦有向西北移動者，為西晉末年永嘉之亂後的人口移動，因此依序為丙→乙→甲，答案為(D)。

    41.日本移民到南美洲主要從事農業開墾工作，因此(B)為正解。(A)兩地氣候與自然環境差異甚大。(C)(D)並無此事。

    42.漫畫呈現出各行業的人皆受到華人老虎的欺壓，可知其想表現的是被華工搶走工作的焦慮感，(B)為正解。

    43.道教信仰用功過格來做道德規範，儒生和士大夫也同樣持修，佛教亦以之塑造民眾品格與倫理思想，因此(D)的解讀較為適切。(A)功過格推行善舉，非清靜無為。(B)(C)功過格最早為道教計算成仙的功德量之用，無關乎佛教的輪迴轉世，也與儒家的忠孝觀念無關。

    44.二戰期間，日本政府確實曾招募大量朝鮮勞工到軍艦島採礦，居住在衛生不佳的環境裡，成為不少朝鮮人的一段痛苦記憶，(D)為正解。'
