  stem: 美國現任聯邦運輸部長趙小蘭，在小布希擔任總統時即任命她為政府勞工部長，在川普當選總統後，這首位出生臺灣的女性部長的身分再次被拿來檢視。就趙小蘭的經歷而言，她應該是下列哪一種華人類型？
  options:
  - label: A
    content: 華商
  - label: B
    content: 華工
  - label: C
    content: 華僑
  - label: D
    content: 華裔
  answer:
  - C
  - D
  review_note: 解答卷：(C)或(D)皆給分
  answer_status: verified
  answer_source: answer_key
  explanation: 趙小蘭出生於臺灣，小學時才隨家人移居到美國，就一般定義而言即是「華僑」；同時，在美國的臺灣裔人士亦被歸屬於「華裔」，因此(C)與(D)皆為正解。
