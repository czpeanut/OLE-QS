  group_stem: 雞肉絲菇，又被稱為「雷公菇」或「雞樅菌」，是一種味道鮮美、老一輩的臺灣人經常採食的野生大型菇類。然而，很少人知道雞肉絲菇其實是白蟻的共生菌，與俗稱大水蟻的臺灣土白蟻（Odontotermes formosanus）有著絕對共生的關係。臺灣土白蟻與雞肉絲菇之間的互動就像農夫和他們栽培的作物，互相依賴，少了對方的幫助便無法生存。臺灣土白蟻巢內有各種不同大小、年齡與階級的個體，主要分放蟻王、蟻后、幼蟲、小工蟻、大工蟻及兵蟻。蟻王和蟻后負責生殖、兵蟻負責防衛蟻巢，而大小工蟻則負責「栽培」雞肉絲菇。臺灣土白蟻的大工蟻會在野外收集各種的枯枝落葉、樹皮或木材，並將這些材料搬運回白蟻在地下的巢穴，堆放在蟻巢內的巢腔（chamber）裡，此行為如人類將糧食儲存在毅倉之中。小工蟻會先吞食雞肉絲菇的無性孢子，咀嚼並吞下這些儲存的粗糙植物材料，雞肉絲菇的無性孢子與植物材料會在白蟻的腸道裡被均勻地混合，在經過一個小時的短暫消化後排出。小工蟻會將排出的混合物堆疊建造成一個具有許多孔隙的半圓形球體，此構造稱為「菌圃（fungus garden）」，雞肉絲菇的菌絲會在新鮮的菌圃材料中迅速生長，約1～2天內，就可觀察到菌圃表面布滿細微的白色菌絲。除此之外，菌圃上會產生許多無性孢子小球，為乳白色水滴型的構造，而每個孢子小球都有一條細小的梗連接到菌圃上雞肉絲菇的菌絲；由於孢子小球會逐漸生長變大，因此菌圃上會觀察到各種大小的孢子小球，直徑最大可達一毫米（mm），不使用顯微鏡也可直接觀察到。孢子小球就像是白蟻地下農場中的果實，每個孢子小球都包含真菌的營養與無數個微小的無性孢子，就像是果肉與種子，是白蟻取得雞肉絲菇無性孢子的主要的來源。試根據上文回答下列問題：
  answer:
  - B
  answer_status: verified
