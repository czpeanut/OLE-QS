- id: doc_110_台中_立人_自然_生物_選修生物V_g12s1e3_s3_23
  section: 3
  number: 23
  type: multiple
  page: 3
  stem: 採用捕捉撲殺移除的方式，處理流浪犬貓的問題，最終往往無法真正減少流浪犬貓的數量，主要的原因是（應選3項）
  options:
  - label: A
    content: 環境負荷量餘裕增加，還可以大量繁殖
  - label: B
    content: 高死亡率會引高出生率
  - label: C
    content: 社區民眾大量野放寵物
  - label: D
    content: 有外部新個體遷入
  - label: E
    content: 流浪動物太多，撲殺移除緩不濟急
  group_stem: 寵物與人類的關係，有超過萬年的歷史，人口愈來愈多的同時，龍物的數量也跟著上升，流浪動物的數量也是增加。自2003至2015年為止，臺灣每年都有至少8萬隻流浪貓狗進入收容所，流浪中的可能還有數萬隻，這些流浪動物的來源可能是飼主棄養、自由放養犬貓的後代，以流浪犬貓的後代，雖然有「動物保護法」的施行，但是流浪犬貓問題始終沒有辦法被解決，政府過去以「通報、捕捉、收容、撲殺」的被動模式處理既有的流浪太貓，對於未被捕捉的貓狗卻毫無對策，放任其在外不斷繁殖，因此出現生生不息、源源不斷、怎麼抓都抓不完的奇怪現象。TNR是Trap（誘捕）、Neuter（絕育）、Retur（放回原地）的縮寫，人們企圖用比較人道的方式管理，減少流浪犬貓的數量，早在 2012年之前就在歐洲經過實驗獲得成效。傳統捕捉撲殺移除的方式，無法全數捕捉動物，反倒會引發高死亡率與高出生率的循環，而且一日移除後，留下的生活空間，又會有新的個體進入，這種循環，在社區的具體表現就是叫春、打架與跳蚤傳播。除了人道問題外，最主要的難處在於無法解決社區生活品質的要求，使用TNR方式控制社動物數量的主要關鍵，在於計算出環境負荷量後，確保每隻動物都失去繁殖能力但健康存活，同時要逐步擴大作區域，確保尚未結紮的動物不易尋找繁殖對象。於是執行TNR的區域一旦擴大，經過流浪動物的生命期後，將大幅減少；社區的動物因為失去繁殖的動力，也較容易融入社區生活。
  answer:
