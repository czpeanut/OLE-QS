  group_stem: 許多含氯化合物、戴奧辛、DDT……等，以及畜牧業經常使用於動物身上的生長激素或化學藥品，這些化學物質進入動物或人體後，會干擾賀爾蒙（激素）的作用，引起內分泌系統失調，稱之為「環境賀爾蒙」。環境賀爾蒙不是生物體本身所產生的物質，而是由外在環境進入生物體內，影響了生物體內正常賀爾蒙的運送、調節、受器結合、訊號產生、細胞代謝反應等，其作用機制可能透過環境賀爾蒙分子模仿、強化或拮抗生物體內正常賀爾蒙的作用。科學家發現當今許多動物雄性的比例過低，全球的男嬰出生率有遂年下滑的跡象，女性的第二性徽出現的年齡逐漸降低，男性精液中的精子密度降低，雄性個體雌性化，而造成這些問題的主要原因，極有可能就是環境賀爾蒙。依據上文及習得的知識，回答下列問題。
