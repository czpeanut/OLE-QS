  stem: 根據你對本文的理解，下列敘述何者正確？
  options:
  - label: A
    content: <u>懷特豪斯</u>發現在AENP不具象牙的公象占絕大比例
  - label: B
    content: SLNP與AENP不具象牙的母象比例增加，均受到非法盜獵的影響
  - label: C
    content: 可推測SLNP的環境內營養資源不足，使不具象牙的母象比例升高
  - label: D
    content: 可推測AENP的象群曾經損失部分遺傳多樣性
  group_stem: 大象分為非洲象屬及亞洲象屬，亞洲象僅公象具有象牙，而非洲象則公母智具。非法獵取象牙使得平均象牙長度縮小且不具象牙的個體數增加。1995年，<u>傑曼</u>（H. Jachmann）在<u>中非尚比亞</u>的南盧安瓜國家公園（South Luangwa National Park，簡稱SLNP）進行一項研究，他發現當地的象群在 1969至1989年間，族群中不具象牙（tuskless）的母象比例由10.5%上升至38.2%，<u>傑曼</u>認為其原因可能來自於當地的非法捕獵猖獗：狩獵大象獲取象牙對象群形成一種選汰壓力，而不具象牙的個體在族群中得以倖存，進而改變了族群內的基因組成。然而，<u>懷特豪斯</u>（Anna M. Whitehouse）在2001年針對南非艾多大象國家公園（Addo Elephant National Park，簡稱AENP）的象群進行類似的研究，有新的發現，他觀察174頭母象中有98%的比例不具象牙。<u>懷特豪斯</u>檢驗了四種可能造成母象不具象牙的假說：1.天擇的結果（當地的植被環境並不需要象牙）、2.非法捕獵對象群形成選汰壓力、3.當地的營養缺乏使象牙無法正常生長、4.可能來自於遺傳漂變及近親交配。進一步研究的結果排除了上述的1～3點假說，而且歷史紀錄顯示AENP的象群是由僅有11頭象的小族群繁衍而來。假說4獲得各種證據的支持。依據本文回答下列問題：
  answer:
  - D
