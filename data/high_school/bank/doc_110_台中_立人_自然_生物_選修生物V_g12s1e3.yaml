- id: doc_110_台中_立人_自然_生物_選修生物V_g12s1e3_s3_30
  section: 3
  number: 30
  type: single
  page: 4
  stem: 根據本文的描述，下列哪一個敘述正確？
  options:
  - label: A
    content: MVP是用來預測瀕危物種的滅絕時間
  - label: B
    content: 合理推論MVP應為一個固定值，適用於所有物種
  - label: C
    content: 評估一個族群現狀是否安全，可使用MVP作為保育方針的參考
  - label: D
    content: IUCN在評估瀕危生物族群的標準，與<u>夏佛</u>定義的MVP完全相同
  group_stem: 瀕危物種的族群一般很小，經常因為基因漂變、近親繁造成遺傳多樣性流失，因而降低物種的適應力，而終至滅絕。因此最小存活族群（Minimum Viable Populatio稱MVP）概念的提出，正是科學家用以評估一個物種是否可以自然延續的指標。MVP通常透過電腦模擬及計算後得，且計算過程必須考慮該族群的統計資料，包括亡率、族群大小、棲地需求等。<u>夏佛</u>（Mark L. Shaffer）在1981年曾經提出關於MVP的定義：在可預期的因子的影響之下（International Union for Conservation of Nature and Natural Resourccs，簡稱1UCN）也利用類似MVP的概念，並加人了世代週期的概念，將物種的瀕危程度加以分級。譬如易受傷害（Vulnerable）等級為：該族群在100年內滅絕的機率大於10%，瀕危（endangered）等級為：該族詳在20年或5個世代內，滅絕的機率大於20%。嚴重瀕危（Critically endangered）等級為：該族群在10年或3個世代內，滅絕的機率大於50%。透過這些量化的指標，在擬定保育策略上或是評估物種遭受滅絕的程度，能提供更為具體的參考。依據本文回答下列各題：
