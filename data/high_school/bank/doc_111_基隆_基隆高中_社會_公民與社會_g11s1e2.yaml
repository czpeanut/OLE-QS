  stem: 在新加坡購買一輛汽車的總價格大致相當於美國大城市中等價位住房的水準，原因是在該國買車需要先獲得政府限量發行的『擁車證』，期限為10年，目的在控制道路壅塞的狀況。新加坡政府決定擁車證數量後，透過市場進行競標拍賣，一張擁車證高達7萬美元（約210萬新台幣），使汽車價格在短短三年時間裡就激增了10倍。關於該政策下列選項何者正確？
