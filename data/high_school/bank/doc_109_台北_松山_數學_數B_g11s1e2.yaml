  stem: '聲音的強度是用每平方公尺多少瓦特 ( W／$m^{2}$ ) 來衡量，一般人能感覺出聲音的最小強度為$I_{0}$＝$10^{－12}$ ( W／$m^{2}$ )。當測得的聲音強度為I ( W／$m^{2}$ ) 時，所產生的噪音分貝數d為d ( I )＝10．log$\frac{I}{I_{0}}$。

    (1) 琵琶行中提到「大弦嘈嘈如急雨，小弦切切如私語。」已知落雨聲約為55分貝，悄悄話約為25分貝，試問：落雨聲的聲音強度為悄悄話聲音強度的幾倍？

    (2) 今有某機車製造公司聲稱研發新款電動機車的引擎產生的噪音強度只有一般機車的$\frac{1}{2}$，若該款電動機車與一般機車所產生的噪音分別為a，b分貝，則關於a，b的關係下列哪一選項正確？(單選)'
