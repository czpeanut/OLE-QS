  explanation: '$\frac{1}{100}\leq(\sqrt{10} )^{x}\leq$1000

    ⇒ $10^{－2}\leq10^{\frac{x}{2}}\leq10^{3}$

    ⇒ －2$\leq\frac{x}{2}\leq$3

    ⇒ －4$\leq$x$\leq$6

    $4.9^{a}$＋$27^{－a}$＝$9^{\log _{3}2}+27^{-\log _{3}2}$

    ＝$(3^{2})^{\log _{3}2}+(3^{3})^{-\log _{3}2}$

    ＝$(3^{\log _{3}2})^{2}+(3^{\log _{3}2})^{-3}$

    ＝$2^{2}$＋$2^{－3}$＝4＋$\frac{1}{8}$＝$\frac{33}{8}$

    5.∵$3^{\log _{3}2}$＝2

    ∴$3^{a}$＝2

    ∵$8^{\log _{8}9}$＝9＝$3^{2}$

    ∴$(8^{\log _{8}9})^{a}$＝（$3^{2}$）$^{a}$＝（$3^{a}$）$^{2}$＝4

    ⇒ $( (2^{3})^{\log _{8}9})^{a}$＝$2^{2}$

