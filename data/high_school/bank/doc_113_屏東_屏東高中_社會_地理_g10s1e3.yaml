  stem: 下圖為歐亞大陸沿著北緯 52°所繪製的 1 月及 7 月月均溫圖。從此圖可以合理判斷出下列哪些資訊？(甲)愈往內陸，年溫差愈大(乙)高度為年溫差主要影響因素(丙)倫敦冬天溫暖與暖流有關(丁)內陸冬天寒冷與西風有關
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_113_屏東_屏東高中_社會_地理_g10s1e3/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 194.75
      - 253.2
      - 489.35
      - 400.7
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(甲)由圖上數據可知內陸溫差達 37 ℃，沿海僅 13 ℃；(丙)倫敦冬季均溫為 3.5 ℃，主因為暖流與西風調節。
- id: doc_113_屏東_屏東高中_社會_地理_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 日本每年冬春交接之際，時常面臨「X」所帶來的狂風暴雨，有時甚至是暴雪肆虐，造成日本空中、陸地交通出現混亂。日本曾一度打算在氣象用語上以「炸彈」稱呼它，形容它猶如炸彈般的威力，但顧慮「炸彈」會引起不舒服的觀感，後來決定以「春之嵐」來形容。「X」主要是活躍在中緯度地區的天氣系統，除了日本，在亞洲大陸東部，朝鮮半島每年 2 ～ 4 月間冷暖鋒交會時，均容易受其影響。請問下列何者降雨類型與「X」所造成的降雨最類似？
  options:
  - label: A
    content: 狂飆怒號，轉覺灼體，風過後，木葉焦萎如熟，俗謂之麒麟颶
  - label: B
    content: 夏秋紅日當空，片雲乍起，傾盆立至
  - label: C
    content: 六月十九，無風，水也吼
  - label: D
    content: 江南每歲三四月，霪雨不止，而物霉腐
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 文中「春之嵐」、「2 ～ 4 月冷暖交鋒」研判應為季節交替之際的鋒面雨（氣旋雨），與(D)一致。(A)(C)為颱風雨。(B)為對流雨。
