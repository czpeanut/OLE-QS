  section: 2
  number: 33
  type: single
  page: 6
  stem: 哪個都市最可能位於北回歸線至北緯 35°之間的亞洲東岸地區？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁。（改寫）
  group_stem: 下圖為 4 個都市的氣溫雨量分布圖。請問：
  shared_asset: g2_33_34
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '亞洲北回歸線～ 35°N，應為副熱帶季風氣候，冬溫＞0 ℃，全年乾季不顯著，故答案選(A)甲。

    34.30° ～ 40°大陸西岸為夏乾冬雨的溫帶地中海型氣候，故答案選(C)丙。

    35.嘉義山腳下應為熱帶森林往高海拔形成溫帶林再到草原，故答案選(C)丙。

    36.北非地區為熱帶沙漠植被，故答案選(B)乙。

    37.(C)幾內亞灣—大西洋側為廣大海域，因此溫度較低。

    38.(D)信風帶南北向季節移動時，因跨越赤道，因此風向會因跨越半球科氏力改變而改變；東南信風偏移至北半球時轉向成西南風。

    39.臺北、臺中多日有雨又值 5 月中旬，研判為梅雨季節造成的(B)鋒面滯留。

    40.5 月春季的鋒面為南方暖空氣所導致，鋒面會北移，24 日時全臺幾乎無雨，因此鋒面應已至北方的(B)東海。

    41.(A)西南季風強勁時，臺東地區易生焚風，5／15 時臺東高溫達 30.6°，此日西南季風最強。

    42.7 月均溫在 15 ℃上下、1 月均溫在 5 ℃上下，應為年溫差小、冬季不冷的(C)溫帶海洋性氣候。

    43.(C)海洋性主要與海洋調節（暖流）、西風有關，地形影響相對小。

    44.此地夏乾熱冬雨，為溫帶地中海型氣候，故答案選(D)。(A)(C)為海洋性氣候。(B)為夏雨型暖溫帶氣候。

    45.溫帶地中海型氣候區代表植被為低矮灌木，故答案選(C)。

    46.(D)愈往中心氣壓值變高，為高壓中心，氣流下沉、天氣晴朗。

    47.(甲)南半球的高壓為下沉氣流，順時針輻散；(丁)氣流旋出，科氏力左偏。

    48.(B)冬季、北方南下為高壓冷乾的鋒面。

    49.(B)冷鋒通過後，氣壓繼續升高、冷空氣籠罩，氣溫下降，因壓差形成強風，風向易產生變化。

    50.臺灣位處低緯，因此缺乏暖鋒系統，故答案選(A)冷鋒、滯留鋒。'
