  - label: C
    content: 極圈氣旋
  - label: D
    content: 極地東風
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)信風帶南北向季節移動時，因跨越赤道，因此風向會因跨越半球科氏力改變而改變；東南信風偏移至北半球時轉向成西南風。
