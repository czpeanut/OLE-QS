  explanation: '臺灣東北部冬季降水主因為冬季季風造成的(C)地形雨。(A)為氣旋雨。(B)為鋒面雨。(D)為颱風雨。

    13.20 ℃在南方（較熱），代表此地為北半球，依水平線判斷此時陸地較冷，所以此時為北半球的冬天，陸地散熱快，故答案選(B)。

    14.(C)莽原在 5 月前後正值乾季末期，又因進入夏季升溫迅速，成為一年之中最熱的時間點。

    15.全年溫差小、有雨，秋冬季節雨量更多，研判此地為溫帶海洋性氣候，故答案選(D)。(A)為雨林。(B)為灌木。(C)為莽原。

    16.副熱帶季風氣候全年相對暖溼、乾季不顯著，與(B)夏雨型暖溫帶氣候特徵類似。

    17.全年各月最高溫均在 12 ～ 14 時，溫度均為 18 ～ 20 ℃，代表此地緯度相當低（無年溫差），但赤道附近平均溫度不會這麼低，應為熱帶高地，平均溫度相對較低。勉強選(A)赤道可以，但不夠正確。

    18.颱風中心在東北部時，西側環流（西南風）越過山脈形成下沉氣流，應出現在臺灣東偏南部，故答案選(B)臺東。（註：此題沒有絕對位置，易有爭議）

    19.廍為舊糖廠，多出現在南部溫暖潮溼的地區，故答案選(A)。

    20.a 為沙漠，b 為過渡植被，c 為苔原或寒原，d 為最高溫多雨的雨林，e 為溫帶林，f 為寒帶針葉林。故答案選(A)。

    21.圖中 A、B 兩地水平距離一致、壓差值愈大，風力愈大，故答案選(A)。

    22.a 為山腳下氣壓較 b 高；b 地遇到降水，代表 b 為水氣飽和點，過 b 點氣溫垂直遞減率以溼空氣計算；c 為最高點、空氣稀薄；往 e 地為背風側、乾空氣下沉增溫，e 最高溫；b → c（溼空氣）與 c → d（乾空氣）海拔差相等（假設相差 X 百公尺），但溫差相差 3.5 ℃，0.35X＝3.5 ℃，X＝10 百公尺，即為 1,000 公尺。故答案選(D)。

    23.要揚帆出海需要借助陸風，入夜之後陸地散熱快，形成高壓，故答案選(A)。

    24.北半球的低壓系統為逆時針旋入的輻合氣流，故答案選(A)甲。'
