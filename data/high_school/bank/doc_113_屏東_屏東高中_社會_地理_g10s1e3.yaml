- id: doc_113_屏東_屏東高中_社會_地理_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某地年平均降水量為 2,500 毫米，而某一年降水量為 1,500 毫米，則該年年降水量變率為何？
  options:
  - label: A
    content: 30 ％
  - label: B
    content: 40 ％
  - label: C
    content: 50 ％
  - label: D
    content: 60 ％
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 降水變率公式為：∣某年降水量－過去長期平均∣／過去長期平均×100 ％；∣1,500－2,500∣／2,500×100 ％＝40 ％。故答案選(B)。
- id: doc_113_屏東_屏東高中_社會_地理_g10s1e3_s1_5
  section: 1
