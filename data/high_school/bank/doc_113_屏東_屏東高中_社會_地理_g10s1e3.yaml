  stem: 英國報紙報導：「1952 年 12 月 5 日至 9 日，一連幾天空氣幾乎靜止不動。從家庭和工廠排出的煙塵，消散不去且愈積愈多，形成毒霧。在這期間，整個倫敦地區有 400 多人死亡，毒霧消散後的 2 個月，陸續仍有 8,000 多人死亡。」引發該事件的原因，可能和當時倫敦地區出現哪個天氣現象有關？
  options:
  - label: A
    content: 鋒面滯留
  - label: B
    content: 寒流侵襲
  - label: C
    content: 氣旋過境
  - label: D
    content: 高壓籠罩
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)煙霧為上升氣流，但若遇高壓籠罩，則會使空氣無法對流上去，籠罩在盆地上方。
