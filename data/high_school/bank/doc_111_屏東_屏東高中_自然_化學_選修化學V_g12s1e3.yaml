questions:
- id: doc_111_屏東_屏東高中_自然_化學_選修化學V_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 氯化次氯酸鈣（Ca(OCl)Cl）中，2個氯原子的氧化數分別為何？
  options:
  - label: A
    content: 均為－1
  - label: B
    content: 均為＋1
  - label: C
    content: 分別為＋1，－1
  - label: D
    content: 分別為＋3，－1
  - label: E
    content: 均為＋3
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: $Ca^{2＋}$中，Ca＝＋2，$OCl^{－}$中，因O＝－2，故Cl＝＋1，$Cl^{－}$中Cl＝－1。故選(C)。
- id: doc_111_屏東_屏東高中_自然_化學_選修化學V_g12s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列哪一項為氧化遺原反應？
  options:
  - label: A
    content: $NH_{3}$(g)＋HCl(g) → $NH_{4}$Cl(s)
  - label: B
    content: $BaCl_{2}$(aq)＋$Na_{2}SO_{4}$(aq) → $BaSO_{4}$(s)＋2 NaCl(aq)
  - label: C
    content: $CaCO_{3}$(s) $\xrightarrow{\Delta}$ CaO(s)＋$CO_{2}$(g)
  - label: D
    content: $_{92}^{235}$U＋$_{0}^{1}$n → $_{56}^{141}$Ba＋$_{36}^{92}$Kr＋3$_{0}^{1}$n
  - label: E
    content: Zn(s)＋$CuSO_{4}$(aq) → $ZnSO_{4}$(aq)＋Cu(s)
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為酸鹼反應，氧化數無變化；(B)為沉澱反應，氧化數無變化；(C)為分解反應，氧化數無變化；(D)為核反應；(E) Zn氧化數：0 → ＋2；Cu氧化數：＋2 → 0。故選(E)。
- id: doc_111_屏東_屏東高中_自然_化學_選修化學V_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列哪些反應不屬於自身氧化還原反應？
  options:
  - label: A
    content: 3 $Cl_{2}$＋6 $OH^{－}$ → 5 $Cl^{－}$＋$ClO_{3}^{－}$＋3 $H_{2}$O
  - label: B
    content: 2 CuCl → Cu＋$CuCl_{2}$
  - label: C
    content: 3 $ClO^{－}$ → $ClO_{3}^{－}$＋2 $Cl^{－}$
  - label: D
    content: $P_{4}$＋3 $OH^{－}$＋3 $H_{2}$O → 3 $H_{2}PO_{2}^{－}$＋$PH_{3}$
  - label: E
    content: S＋2 $H_{2}SO_{4}$ → 3 $SO_{2}$＋2 $H_{2}$O
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) Cl氧化數：0 → －1、＋5；(B) Cu氧化數：＋1 → 0、＋2；(C) Cl氧化數：＋1 → ＋5、－1；(D) P氧化數：0 → ＋1、－3；(E) S氧化數：0、＋6 → ＋4。故選(E)。
- id: doc_111_屏東_屏東高中_自然_化學_選修化學V_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 已知25.0 mL的$Fe^{2＋}$(aq) 0.100 M可與50.0 mL $KMnO_{4}$(aq)在酸性條件下恰完全反應，請問溶液中$KMnO_{4}$初始濃度為何？
  options:
  - label: A
    content: '0.0125'
  - label: B
    content: '0.01'
  - label: C
    content: '0.005'
  - label: D
    content: '0.002'
  - label: E
    content: '0.001'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由得電子數＝失電子數，可得到：($Fe^{2＋}$莫耳數)×1＝($MnO_{4}^{－}$莫耳數)×5，進一步列式：0.100×0.025×1＝C×0.050×5，得到C＝0.01。故選(B)。
- id: doc_111_屏東_屏東高中_自然_化學_選修化學V_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在酸性條件下，某硫酸亞錫溶液10毫升與0.04 M $KMnO_{4}$ 5毫升混合，因$MnO_{4}^{－}$過量，故溶液應呈紫色；再加入0.10 M硫酸亞鐵溶液5毫升後，恰使溶液之紫色消失，而呈現淡粉紅色。試求原有硫酸亞錫l升溶液中約含硫酸亞錫多少克？（原子量：Sn＝119，S＝32）
  options:
  - label: A
    content: '4.38'
  - label: B
    content: '5.38'
  - label: C
    content: '6.38'
  - label: D
    content: '7.38'
  - label: E
    content: '8.56'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由得電子數＝失電子數，可得到：($Fe^{2＋}$莫耳數)×1＋($Sn^{2＋}$莫耳數)×2＝($MnO_{4}^{－}$莫耳數)×5，進一步列式：0.10×0.005×1＋C×0.010×2＝0.04×0.005×5，可得C＝0.025 M。故一公升溶液中有0.025 mol的$SnSO_{4}$＝5.38 g。故選(B)。
