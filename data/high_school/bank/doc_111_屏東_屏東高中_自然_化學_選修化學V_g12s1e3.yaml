  stem: 下列反應皆為利於向右的反應（亦可稱為向右自發反應） ① $H_{2}SO_{3}$＋$I_{2}$＋$H_{2}$O → 2 HI＋$H_{2}SO_{4}$ ② 2 $FeCl_{3}$＋2 HI → 2 $FeCl_{2}$＋2 HCl＋$I_{2}$ ③ 3 $FeCl_{2}$＋4 $HNO_{3}$ → 2 $FeCl_{3}$＋NO＋$2H_{2}$O＋Fe($NO_{3}$)$_{3}$ 試排出有關物質還原力由大到小的順序？
  options:
  - label: A
    content: $H_{2}SO_{3}$＞$1^{－}$＞$Fe^{2＋}$＞NO
  - label: B
    content: $I^{－}$＞$Fe^{2＋}$＞$H_{2}SO_{3}$＞NO
  - label: C
