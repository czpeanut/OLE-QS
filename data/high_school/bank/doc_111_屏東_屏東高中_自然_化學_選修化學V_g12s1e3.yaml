  - label: D
    content: NO＞$Fe^{2＋}$＞$H_{2}SO_{3}$＞$1^{－}$
  - label: E
    content: $H_{2}SO_{3}$＞$Fe^{2＋}$＞$1^{－}$＞NO
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 還原力→還原其他物質的能力→自己被氧化的能力。 由式(1)，可得知還原力$H_{2}SO_{3}$（式左方被氧化者）＞HI（式右方被氧化者） 由式(2)，可得知還原力HI（式左方被氧化者）＞$FeCl_{2}$（式右方被氧化者） 由式(3)，可得知還原力$FeCl_{2}$（式左方被氧化者）＞NO（式右方被氧化者） 故選(A)。
