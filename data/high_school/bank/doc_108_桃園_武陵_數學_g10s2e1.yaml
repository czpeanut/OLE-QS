- id: doc_108_桃園_武陵_數學_g10s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: '下列有五組數值資料，每組各有 6 筆，則關於各個統計量的敘述，下列哪些正確？

    甲：2，3，4，5，6，7

    乙：9，8，7，6，5，4

    丙：4，9，16，25，36，49

    丁：$\sqrt{2}$，$\sqrt{3}$，$\sqrt{4}$，$\sqrt{5}$，$\sqrt{6}$，$\sqrt{7}$

    戊：－4，－6，－8，－10，－12，－14'
  options:
  - label: A
    content: 考慮標準差σ，則σ$_{甲}$＝σ$_{乙}$
  - label: B
    content: 考慮算術平均數μ，則μ$_{丙}$＝（μ$_{甲}$）$^{2}$
  - label: C
    content: 考慮第 1 四分位數 $Q_{1}$，則五組數值中最大者為 $Q_{1丙}$
  - label: D
    content: 考慮中位數 Me，則五組數值中最小者為 $Me_{丁}$
  - label: E
    content: 考慮第 67 百分位數的計算方法得到 $P_{67}$，則 $P_{67戊}$＝－12
  answer:
  - A
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵乙＝甲＋2 ∴σ$_{甲}$＝σ$_{乙}$

    (B) ╳：$\mu _{丙}=\frac{139}{6}\neq \left( \frac{9}{2} \right) ^{2}=(\mu _{甲})^{2}$

    (C) ○：∵$Q_{1甲}$＝3，$Q_{1乙}$＝5，$Q_{1丙}$＝9，$Q_{1丁}$＝$\sqrt{3}$，$Q_{1戊}$＝－12 ∴$Q_{1丙}$ 最大

    (D) ╳：∵$Me_{甲}$＝4.5，$Me_{乙}$＝6.5，$Me_{丙}$＝20.5，$Me_{丁}$＝$\frac{\sqrt{4}+\sqrt{5}}{2}$，$Me_{戊}$＝－9

    ∴$Me_{戊}$最小

    (E) ╳：6×0.67＝4.02 ⇒ $P_{67戊}$為由小到大的第 5 個數值，即 $P_{67戊}$＝－6

    故選(A)(C)'
