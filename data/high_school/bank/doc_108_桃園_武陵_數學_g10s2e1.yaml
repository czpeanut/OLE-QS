- id: doc_108_桃園_武陵_數學_g10s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: '<u>小玲</u>看到有報導說：「人的心情會與氣溫呈現正相關」。<u>小玲</u>因此找了 2000 人做調查，想知道<u>臺灣</u>人是否也有這種傾向。她將心情量化後的數字命名為心情指數，利用 0 分至 100 分評分，數值愈高表示愈開心。調查後，<u>小玲</u>將氣溫（攝氏）與心情指數的數據分別以 X、Y 表示，得到相關係數為 0.0314，Y 對 X 的迴歸直線為 Y＝4X－20；另外，氣溫若改為華氏溫標，則以 F 變量表示之。試問下列的推論，哪些是正確的？

    $\left( 註 : 攝氏和華氏溫標的單位換算公式 : 華氏=\frac{9}{5}\times 攝氏+32 \right)$'
  options:
  - label: A
    content: 若將 X、Y 數據標準化後分別得到 X'、Y'，則 Y' 對 X' 的迴歸直線斜率有可能大 於 1
  - label: B
    content: 利用迴歸直線我們可以預測當氣溫達到攝氏 35 度，心情指數會達到 120 分
  - label: C
    content: F 與 Y 的相關係數為 0.0314
  - label: D
    content: 設 X 中的第 40 百分位數為 $P_{40}$，則$\left( \frac{9}{5}\times P_{40}+32 \right)$必為 F 中的第 40 百分位數
  - label: E
    content: 這次調查的結果，是適合利用迴歸直線去預測數值
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：∵標準化後迴歸直線斜率為相關係數

    ∴Y'' 對 X'' 的迴歸直線斜率為 0.0314

    (B) ╳：y＝4×35－20＝120＞100，超過上限

    (C) ○：∵$\frac{9}{5}\times 1 > 0$ ∴相關係數不變

    (D) ○：線性變換不影響數據相對位置

    (E) ╳：∵相關係數接近 0 ∴不適用

    故選(C)(D)'
