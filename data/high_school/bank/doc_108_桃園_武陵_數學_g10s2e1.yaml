- id: doc_108_桃園_武陵_數學_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列級數的總和中，何者<u>有誤</u>？
  options:
  - label: A
    content: 1＋2＋3＋……＋20＝210
  - label: B
    content: $1^{3}$＋$2^{3}$＋$3^{3}$＋……＋$20^{3}$＝$210^{2}$
  - label: C
    content: 1＋3＋5＋……＋419＝$210^{2}$
  - label: D
    content: $1^{2}$＋$3^{2}$＋$5^{2}$＋……＋$19^{2}$＝$11^{3}$－$1^{3}$
  - label: E
    content: $7^{2}$＋$8^{2}$＋$9^{2}$＋……＋$20^{2}$＝$14^{3}$＋$5^{2}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 1＋2＋……＋20＝$\frac{20\times 21}{2}$＝210＝右式

    (B) $1^{3}$＋$2^{3}$＋……＋$20^{3}$＝$\left( \frac{20\times 21}{2} \right) ^{2}$＝$210^{2}$＝右式

    (C)項數為$\frac{419-1}{2}+1$＝210，1＋3＋5＋……＋419＝$\frac{(1+419)\times 210}{2}$＝$210^{2}$＝右式

    (D) $1^{2}$＋$3^{2}$＋……＋$19^{2}$＝（$1^{2}$＋$2^{2}$＋……＋$19^{2}$）－（$2^{2}$＋$4^{2}$＋……＋$18^{2}$）

    ＝（$1^{2}$＋$2^{2}$＋……＋$19^{2}$）－4（$1^{2}$＋$2^{2}$＋……＋$9^{2}$）

    ＝$\frac{19\times 20\times 39}{6}-4\times \frac{9\times 10\times 19}{6}$

    ＝$\frac{19\times 20}{6} (39-18)$＝$\frac{19\times 20\times 21}{6}$＝1330

    ＝$11^{3}$－$1^{3}$＝右式

    (E) $7^{2}$＋$8^{2}$＋……＋$20^{2}$＝（$1^{2}$＋$2^{2}$＋……＋$20^{2}$）－（$1^{2}$＋$2^{2}$＋……＋$6^{2}$）

    ＝$\frac{20\times 21\times 41}{6}-\frac{6\times 7\times 13}{6}$＝2870－91＝2779

    又 $14^{3}$＋$5^{2}$＝2769 ⇒ 左式≠右式

    故選(E)'
