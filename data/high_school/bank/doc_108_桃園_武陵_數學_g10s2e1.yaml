- id: doc_108_桃園_武陵_數學_g10s2e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設方程式 $x^{3}$＋$3x^{2}$＋（2m－1）x－3n＝0 之三根成等差，$x^{3}$＋（2n－7）$x^{2}$＋mx－8＝0 之三根成等比，請選出正確的敘述。
  options:
  - label: A
    content: m＝6
  - label: B
    content: n＝5
  - label: C
    content: $x^{3}$＋$3x^{2}$＋mx＋（n－4）＝0 之三根中最大者為－1
  - label: D
    content: $x^{3}$＋$3nx^{2}$＋（3m－3）x－8＝0 之三根中最大者為 2
  - label: E
    content: $x^{3}$＋（2n－7）$x^{2}$＋mx－8＝0 之三根成等比，公比可能為$\frac{1}{2}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '∵$x^{3}$＋$3x^{2}$＋（2m－1）x－3n＝0 三根成等差

    ∴對稱中心為一根 ⇒ x＝$-\frac{3}{3\times 1}$＝－1 為一根 ⇒ 2－（2m－1）－3n＝0 ⇒ 2m＋3n＝3 ……①

    又 $x^{3}$＋（2n－7）$x^{2}$＋mx－8＝0 三根成等比

    故令三根為$\frac{a}{r}$，a，ar ⇒ $x^{3}$＋（2n－7）$x^{2}$＋mx－8＝$\left( x-\frac{a}{r} \right) (x-a) (x-ar)$

    展開比較係數得

    $-\frac{a}{r}\times a\times ar =-8$ ⇒ $a^{3}$＝8 ⇒ a＝2

    $-\frac{2}{r}-2-2r =2n-7$ ⇒ $2n =-\frac{2}{r}-2r+5$ …………………………………………………………②

    $\frac{4}{r}+4r+4=m$ ………………………………………………………………………………………③

    將②、③代入①得$2 \left( \frac{4}{r}+4r+4 \right) +\frac{3}{2} \left( -\frac{2}{r}-2r+5 \right) =3$ ⇒ $\frac{5}{r}+5r+\frac{25}{2}=0$

    ⇒ $2r^{2}$＋5r＋2＝0 ⇒ （2r＋1）（r＋2）＝0 ⇒ $r =-\frac{1}{2}或-2$

    代回②、③得 m＝－6，n＝5

    (A) ╳

    (B) ○

    (C) ╳：x＝－1 代入得

    －1＋3＋6＋1≠0，不合，不為一根

    (D) ╳：x＝2 代入得

    8＋60＋（－21）×2－8≠0，不合，不為一根

    (E) ╳：原式為 $x^{3}$＋$3x^{2}$－6x－8＝0 ⇒ （x＋1）（$x^{2}$＋2x－8）＝0

    ⇒ （x＋1）（x＋4）（x－2）＝0 ⇒ x＝－1 或－4 或 2

    故三根不成等比

    故選(B)'
