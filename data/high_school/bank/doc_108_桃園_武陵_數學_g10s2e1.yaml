  stem: '<u>小偉</u>參加大胃王比賽，在限時半小時內，全體選手的成績如右表。<u>小偉</u>比賽時分別可以吃下 48 碗蕎麥麵和 22 條壽司捲，試問，以整體大胃王比賽的參賽者來說，<u>小偉</u>的表現如何？

    |  | 算術平均數 | 標準差 |

    | --- | --- | --- |

    | 蕎麥麵 | 90 碗 | 15 碗 |

    | 壽司捲 | 40 條 | 10 條 |'
  options:
  - label: A
    content: 吃蕎麥麵的實力比較高，因為 48＞22
  - label: B
    content: 吃壽司捲的實力比較高，因為 48－90＜22－40
  - label: C
    content: 吃蕎麥麵的實力比較高，因為$\frac{90-48}{15} > \frac{40-22}{10}$
  - label: D
    content: 吃壽司捲的實力比較高，因為$\frac{48-90}{15} < \frac{22-40}{10}$
  - label: E
    content: 一定有人吃了 132 碗以上的蕎麥麵
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '根據標準化數據，$\frac{x_{i}-\mu}{\sigma}$愈大表示表現較優秀

    又$\frac{48-90}{15} < \frac{22-40}{10}$，故選(D)'
