  stem: 如下圖所示，將一揚聲器置於一管狀物的一端開口處，連續改變揚聲器發出的聲頻，發現當頻率為 200 Hz、300 Hz、400 Hz 時都會產生共鳴，關於此管狀物的敘述，下列何者可能正確？
  options:
  - label: A
    content: 另一端為閉口，基頻為 100 Hz
  - label: B
    content: 另一端為閉口，基頻為 200 Hz
  - label: C
    content: 另一端為開口，基頻為 100 Hz
  - label: D
    content: 另一端為開口，基頻為 200 Hz
  - label: E
    content: 另一端可以為開口，也可以為閉口
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_112_屏東_潮州_自然_物理_選修物理III_g12s2e2/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 250.45
      - 588.5
      - 410.9
      - 616.0
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 若為單開口端的空氣管，則駐波頻率比必為奇數（如1：3：5：7），但題目中頻率為 2：3：4，故必為雙開口端，因此可排除(A)(B)(E)，另外，基頻必為 200、300、400 的公因數，因此(D)選項也可排除，故選(C)。
  tags:
