- id: doc_112_屏東_潮州_自然_物理_選修物理III_g12s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: A、B 兩共鳴管，A 兩端開口，B 一端封閉，已知 A 的第 4 諧音與 B 的第 2 泛音頻率相同，則 A 與 B 的管長比值為何？
  options:
  - label: A
    content: $\frac{3}{4}$
  - label: B
    content: $\frac{4}{3}$
  - label: C
    content: $\frac{6}{7}$
  - label: D
    content: $\frac{5}{6}$
  - label: E
    content: $\frac{8}{5}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '設 A 管長 $L_{1}$、B 管長 $L_{2}$、空氣中聲速 v，若 A 管為雙開口，則第 4 諧音波長λ$_{A}$＝$\frac{L_{1}}{2}$，而 B 管為單開口，則第 2 泛音波長λ$_{B}$＝$\frac{4L_{2}}{5}$，又已知 A 的第 4 諧音頻率 $f_{A}$＝B 的第 2 泛音頻率 $f_{B}$

    ⇒$\frac{v}{\lambda _{A}}$＝$\frac{v}{\lambda _{B}}$ ⇒λ$_{A}$＝λ$_{B}$ ⇒$\frac{L_{1}}{2}$＝$\frac{4L_{2}}{5}$ ⇒$\frac{L_{1}}{L_{2}}$＝$\frac{8}{5}$'
  tags:
    unit:
      code: PH-S3-2-2
      book: 選修物理III 波動、光及聲音
      chapter: 聲波
      title: 基音與泛音
