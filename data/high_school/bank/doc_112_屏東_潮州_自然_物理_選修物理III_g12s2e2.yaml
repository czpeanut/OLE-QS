      name: 開管與閉管諧音泛音頻率比較
    labeled_by: agent
    label_confidence: high
  difficulty: 3
- id: doc_112_屏東_潮州_自然_物理_選修物理III_g12s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在「氣柱的共鳴」實驗中，若測得第一次共鳴時的空氣柱長度為 29.3 cm，第二次共鳴時的空氣柱長度為 85.2 cm，設常溫下空氣中的聲速為 340 m∕s，則音叉的頻率約為多少 Hz？
  options:
  - label: A
    content: '174'
  - label: B
    content: '304'
  - label: C
    content: '290'
  - label: D
    content: '919'
  - label: E
    content: '487'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '「氣柱的共鳴」實驗中，兩共鳴點間距離＝$\frac{1}{2}$（聲波波長λ）

    ∴85.2－29.3＝$\frac{1}{2}\lambda$⇒λ＝111.8（cm）＝1.118（m）

    故音叉頻率 f＝$\frac{v}{\lambda}$＝$\frac{340}{1.118}$≒304.11（Hz）'
  tags:
    unit:
      code: PH-S3-2-3
      book: 選修物理III 波動、光及聲音
      chapter: 聲波
      title: 聲音的共振
      std: true
    textbook: 選修物理III 波動、光及聲音 聲音的共振
    pattern:
      key: PH-S3-2-3:T12
      name: 氣柱共鳴非整數數據近似頻率估算
    labeled_by: agent
    label_confidence: high
  difficulty: 2
- id: doc_112_屏東_潮州_自然_物理_選修物理III_g12s2e2_s1_4
  section: 1
