- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s3_39
  section: 3
  number: 39
  type: single
  page: 5
  stem: 有關文章的敘述，何者正確？
  options:
  - label: A
    content: 螞蟻糞堆常混雜食物殘渣與同伴遺體
  - label: B
    content: 蜜蜂會排便於蜂巢外，有所謂的排遺飛翔行為
  - label: C
    content: 切葉蟻會利用糞便做為培養細菌的肥料
  - label: D
    content: 螞蟻無法用氣味劃分領域、分別敵我
  group_stem: '許多社會性昆蟲和我們一樣愛乾淨，演化出維護環境衛生的行為。蜜蜂會排遺飛翔，就是排便在蜂巢外；切葉蟻，利用糞便來培養真菌食物。螞蟻超級講究衛生，一般會把同伴的遺體移出巢外，也把食物殘渣和廢棄物放置於垃圾房。

    <u>德國</u>生物學家<u>恰奇克斯</u>（Tomer J. Czaczkes）發現，飼養的黑花園蟻，在居住的白石膏巢內某些角落有深色斑點，逐在21個蟻群的食物中添加人工色素，結果，深色斑點轉為紅色和藍色，因為螞蟻糞堆沒有食物殘渣、屍體或其他垃圾，<u>恰奇克斯</u>和同事推論這些域域如人類的「廁所」。

    蟻科這麼講究巢內衛生，黑花園蟻卻不到巢外排便，可能是利用糞便作為防禦、劃分領域、築巢材料、鹽份來源。<u>恰奇克斯</u>認為還有一個理由，「螞蟻是用氣味分別敵我。新生的螞蟻去廁所薰陶後，就記住自家的氣味。」有待更多的研究來了解答案究竟為何。

    （資料來源：引自科學人2015年第160期6月號）'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)同伴遺體移出巢外；(C)培養真菌；(D)用氣味分辨敵我。故選(B)。
