- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 關於人體血液循環的敘述，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: 體循環可讓組織細胞與血液進行養分、廢物及氣體的交換
  - label: B
    content: 肺循環可讓血液與肺泡進行氣體的交換
  - label: C
    content: 肺循環可讓血液與肺部組織細胞進行養分及廢物的交換
  - label: D
    content: 心臟的冠狀循環與消化系統的門脈循環，亦屬於體循環
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 肺循環是讓外界空氣與體內進行交換，非與肺部組織細胞進行交換。故選(C)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 下列有關人體血液循環與淋巴循環系統的連接關係之敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 右腳的淋巴由左淋巴總管流入血管中
  - label: B
    content: 左鎖骨下靜脈連接左心房
  - label: C
    content: 左手的淋巴進入心臟時會先進入右心房
  - label: D
    content: 胸管連接左鎖骨下靜脈
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)左右鎖骨下的靜脈均進入右心房。故選(B)。
