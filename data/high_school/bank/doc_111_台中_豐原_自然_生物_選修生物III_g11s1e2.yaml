- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s3_36
  section: 3
  number: 36
  type: single
  page: 4
  stem: 關於血紅素代謝的敘述，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: 胺基酸和鐵質可被回收
  - label: B
    content: 膽紅素具有組織毒性
  - label: C
    content: 經肝臟處理後出現於膽汁中
  - label: D
    content: 尿膽素原大部分隨尿液排除
  group_stem: '當紅血球衰老崩解時，血紅素被逐步分解為胺基酸、鐵質和膽紅素。胺基酸和鐵質可被回收作為重新製造血紅素的原料。膽紅素經肝細胞處理以後，隨著膽汁經膽管排泄到腸道，在腸道內被細菌分解並產生尿膽素原；其中的一部分被腸壁再吸收而回到肝臟，由尿液過濾排出；而大部分的尿膽素原則隨糞便排出體外。糞便的黃顏色，主要即來自尿膽素原。

    膽紅素對所有的組織細胞皆具有毒性，血清中出現過量的膽紅素時，膽紅素會沉積於組織中（如皮膚、鞏膜、軟組織及器官），呈現黃中帶綠的顏色，此即稱為黃疸。

    新生兒的黃疸可分為生理性及病理性黃疸，生理性黃疸大部份會自然痊癒，而病理性黃疸可能是因為膽色素過多、膽色素排泄不良等原因而造成。其中核黃疸為膽紅素沉積於腦組織中並破壞腦細胞，造成病人會出現不可逆的神經退化或壞死的症狀，如學習障礙、腦性麻痺等。

    當大量肝細胞被破壞時，膽紅素的結合和排泄受到影響，造成肝細胞性黃疸。常見的原因如急性肝炎病毒感染、藥物中毒或酒精性肝炎等。血漿中的游離型膽紅素及結合型膽紅素同時增加（游離型膽紅素與膽紅素總量的比值約在三○～六○％）；尿液中的結合型膽紅素及尿膽素原也會大量增加，因而造成病人的尿液呈現茶褐色。

    膽道中如果有結石或腫瘤，可引起膽道的機械性阻塞，膽汁無法排泄，導致血清中的膽紅素含量增加，此種情形稱為阻塞性黃疸。血漿中的結合型膽紅素上升的比例比較大（游離型膽紅素與膽紅素總量的比值小於三○％）。因膽紅素不能進入腸道，因此也無法生成尿膽素原，糞便變成灰土色，尿中的尿膽素原呈陰性反應。

    溶血性黃疸的原因，為紅血球大量被破壞而引起，如敗血症、不良輸血反應或溶血性貧血。肝細胞無力即時處理遽然暴增的大量膽紅素，因而造成黃疸。血漿中的游離型膽紅素上升的比例比較高（游離型膽紅素與膽紅素總量的比值大於八○％）。此時，尿中的尿膽素原檢查呈強陽性反應。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 隨糞便排出。故選(D)。
