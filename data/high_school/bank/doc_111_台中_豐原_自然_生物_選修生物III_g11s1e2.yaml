- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列關於人體神經組織的敘述，哪項是正確的？
  options:
  - label: A
    content: 神經膠細胞可以形成髓鞘協助神經訊號的傳遞
  - label: B
    content: 樹突細胞負責神經訊號傳入，軸突細胞負責神經訊號傳出
  - label: C
    content: 神經膠細胞可接續神經元傳遞神經衝動
  - label: D
    content: 神經元除了傳遞神經衝動，還可以抵抗病原體
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)樹突軸突為神經纖維非細胞；(C)神經膠細胞無法傳遞衝動；(D)神經元無法抵抗病原體。故選(A)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列有關結締組織的敘述，何者正確？
  options:
  - label: A
    content: 硬骨組織中細胞呈同心圓排列，其中無血管通過
  - label: B
    content: 軟骨的細胞間質中含有大量鈣鹽和磷鹽
  - label: C
    content: 韌帶屬於緻密織維結締組織
  - label: D
    content: 肌腱屬於疏鬆纖維結締組織
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)有血管神經通過，稱為哈維氏管；(B)硬骨的細胞間質才含有大量鈣鹽及磷鹽，軟骨含有較多的膠原蛋白；(C)屬緻密纖維結締組織。故選(C)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關動物上皮（皮膜）組織的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 由單層或多層排列緊密的細胞組成
  - label: B
    content: 小腸的上皮組織具有消化、吸收的功能
  - label: C
    content: 是構成汗腺的主要成員
  - label: D
    content: 其功能是將組成器官中的不同組織緊密的連結在一起
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 此為結締組織的功能。故選(D)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 心搏是由節律點發出電訊號而開始，根據附圖，請問從節律點發出訊號起，心搏變化的順序如何？ 甲 乙 丙
  options:
  - label: A
    content: 甲→乙→丙
  - label: B
    content: 丙→甲→乙
  - label: C
    content: 乙→丙→甲
  - label: D
    content: 丙→乙→甲
  assets:
  - key: s1_5_f1
    kind: figure
    file: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2/s1_5_f1.png
    crop:
      page: 1
      rect:
      - 54.9
      - 401.8
      - 146.0
      - 492.9
  - key: s1_5_f2
    kind: figure
    file: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2/s1_5_f2.png
    crop:
      page: 1
      rect:
      - 199.6
      - 401.8
      - 290.7
      - 492.9
  - key: s1_5_f3
    kind: figure
    file: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2/s1_5_f3.png
    crop:
      page: 1
      rect:
      - 140.1
      - 402.5
      - 205.5
      - 492.9
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 節律點位在右心房，所以收縮順序為心房收縮→心室收縮→心房心室舒張。故選(A)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列何處<u>不具有</u>瓣膜？
  options:
  - label: A
    content: 肺動脈與右心室相通處
  - label: B
    content: 左心房與左心室之間
  - label: C
    content: 下大靜脈內
  - label: D
    content: 肺靜脈與左心房相通處
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 瓣膜主要位在心室動脈之間、心房心室之間及靜脈。故選(D)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 有關心臟內血液流動的敘述，下列何者正確？
  options:
  - label: A
    content: 當心房收縮時，血液會自心房流入動脈
  - label: B
    content: 當心室收縮時，血液會自心室流入靜脈
  - label: C
    content: 當心室舒張時，半月瓣會關閉，防止動脈內的血液逆流回心臟
  - label: D
    content: 當心房舒張時，房室瓣會關閉，防止心房內的血液逆流回心室
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)自心房流入心室；(B)心室流入動脈；(D)心室舒張時，房室瓣會關閉防止心室血液逆流回心房。故選(C)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 關於微血管網附近的血流調節狀況，何者正確？
  options:
  - label: A
    content: 運動時，流經骨骼肌血量會減少，流經消化道的血量會增加
  - label: B
    content: 微血管前小動脈括約肌收縮時，該處微血管將有更多血流入
  - label: C
    content: 透過微血管網的血流調節，可使全身每條微血管均充滿血液
  - label: D
    content: 血流在微血管內的流動，屬於間歇性的輸送
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)流經骨骼肌的血量會增加，消化道的血量會減少；(B)微血管血量會減少；(C)無法使全身微血管均充滿血液。故選(D)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 下列有關血壓調節的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 血壓調節中樞位於延腦，可發出神經訊號由自律神經影響血壓
  - label: B
    content: 由壓力受器偵測到血壓變化情形後，傳遞訊息，而引起反射性的調節
  - label: C
    content: 最主要的壓力受器分布於頸動脈和主動脈內
  - label: D
    content: 抗利尿素促進水的再吸收，提高血壓
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)血壓調節中樞在下視丘。故選(A)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 關於人體的冠狀循環，其血液流動的途徑為何？
  options:
  - label: A
    content: 左心室→大動脈→冠狀動脈→微血管→冠狀靜脈→右心房
  - label: B
    content: 右心室→冠狀動脈→微血管→冠狀靜脈→上大靜脈→左心房
  - label: C
    content: 右心室→大動脈→冠狀動脈→微血管→冠狀靜脈→左心房
  - label: D
    content: 左心室→冠狀動脈→微血管→冠狀靜脈→上大靜脈→右心房
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 冠狀循環的入口在主動脈基部，冠狀靜脈匯聚後直接進入右心房。故選(A)。
- id: doc_111_台中_豐原_自然_生物_選修生物III_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 藍嬰症是嬰兒出生後，心臟中膈未完全將左右心分隔，造成嬰兒全身皮膚呈藍紫色的先天性心臟病，試推論引起嬰兒全身藍紫色的原因為何？
  options:
  - label: A
    content: 心室的血液易逆流回心房，造成血液循環效率下降
  - label: B
    content: 心室收縮時不易將血液送至動脈
  - label: C
    content: 靜脈血不易回流，導致心臟的血液輸出量下降
  - label: D
    content: 左心的充氧血和右心的減氧血混合
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 心臟中膈可將心臟分成左心及右心。故選(D)。
