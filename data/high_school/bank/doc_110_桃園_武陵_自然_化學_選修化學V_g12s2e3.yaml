  stem: 將兩個半電池分別接於標準氫半電池時，形成兩組電化電池，經一段時間後，測得A金屬重量增加，B金屬重量減輕，半反應如下： $A^{2＋}_{(aq)}$＋$2e^{－}$→A(s) 標準還原電位＝E°$_{A}$(V)，$B^{2＋}_{(aq)}$＋$2e^{－}$→B(S) 標準還原電位＝E°$_{B}$(V)， 有關上述反應的敘述何者正確？
