  stem: 依據遺書內容，在不考慮阿民父親與陳阿姨婚後剩餘財產差額分配的情況下，有關阿民父親遺產的分配，下列敘述何者較為正確？
  options:
  - label: A
    content: 遺書內容已侵犯了妹妹繼承的特留分，故妹妹可要求重新分配
  - label: B
    content: 陳阿姨為父親的配偶，為遺產的第一順位繼承人
  - label: C
    content: 阿民父親留下遺書，是依據我國民法的「遺囑自由原則」
  - label: D
    content: 妹妹最終分配到的遺產，應該至少為父親總遺產價值的1/4
  group_stem: '阿民在父親的告別式前，和妹妹在父親書房裡找到一封遺書，內容如下：

    我的兒子阿民：

    當你看到這封信，就代表老爸不在人世了，我這一生最遺憾的，莫過於你盼了這麼多年，我依舊無法給你一個完整的家庭。你媽媽和我的問題，是家裡最大的不幸；而處理感情的問題，則是我人格中最大的缺陷！這也是老爸給你的最後一道功課，別像老爸一樣離婚，希望你能走出不一樣的人生。

    老爸能留給你的不多，家裡的祖地價值800萬，就全給你了。另外銀行裡還有存款700萬，你和妹妹各拿一半去吧！至於我在臺北的小套房，就留給你們口中的『陳阿姨』了，雖然你們兄妹不認同我們的婚姻，但這些年來全多虧他照料我，相信你們都看在眼裡，這300萬的小套房我能留給陳阿姨唯一的東西了……希望你們能尊重老爸的決定。

    愛你的爸爸 筆'
