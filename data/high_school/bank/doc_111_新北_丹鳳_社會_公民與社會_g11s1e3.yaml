- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某國自甲、乙兩國進口汽車之關稅原本分別為25%、40%，當三國均加入世界貿易組織後，某國對甲、乙兩國進口汽車之關稅均訂為25%。根據上述，下列敘述何者正確？
  options:
  - label: A
    content: 對甲國的關稅維持不變，符合國民待遇原則
  - label: B
    content: 對乙國的關稅調降至25%，符合最惠國待遇原則
  - label: C
    content: 甲國原本適用較低之關稅，符合最惠國待遇原則
  - label: D
    content: 對不同國家課以相同關稅，符合國民待遇原則
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 囊括全球五成的挪威鮭魚市場，近年面臨蘇格蘭、加拿大、智利鮭魚的競爭，因此挪威廠商持續精進管理模式，並引進自動疫苗機、自動切片機，以供應用藥量最少的鮭魚，藉此維持高於他國的市場售價。請問根據上文，國際貿易日漸開放對挪威的鮭魚出口帶來何種影響？(甲)降價促銷以擴大市占率(乙)加強品質以吸引消費者(丙)限制出口數量使得物以稀為貴(丁)加速科技發明創新以增進獲利
  options:
  - label: A
    content: 甲丙
  - label: B
    content: 乙丙
  - label: C
    content: 甲乙
  - label: D
    content: 乙丁
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2016年台南大地震時，維冠建設所建造的維冠大樓倒塌，造成115人死亡，104人受傷。經查維冠大樓因建商結構計算、繪製建築設計圖及施工、監造等錯誤，才導致倒塌發生，154位罹難者家屬與受災戶因而透過消基會提起團體訴訟求償。請問關於判決的可能結果，下列敘述何者正確？
  options:
  - label: A
    content: 罹難者家屬除了能依據《民法》請求賠償，因為損害重大，還能主張《消保法》的懲罰性賠償
  - label: B
    content: 地震造成房屋倒塌在所難免，難認維冠大樓未符合合理期待的安全性
  - label: C
    content: 建造公司僅參與建造，未負責設計，不需要負擔連帶責任
  - label: D
    content: 事件源於建築師、監造的個人疏失，故受害者僅得依《民法》侵權行為求償
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 澳洲的人均排碳量高居全球前幾名，但澳洲政府卻於2014年取消碳稅，並放棄成立碳權市場。當時的澳洲總理表示，此舉每年能為澳洲每戶家庭省下澳幣550元，同時也有利於GDP的成長。請問上述內容反映國民所得指標的何種問題？
  options:
  - label: A
    content: 民眾存錢不利於提高國民所得，花錢才有幫助
  - label: B
    content: GDP不計入地下經濟，造成碳權市場產值遭到忽略
  - label: C
    content: 碳稅提高廠商生產成本，也使得國民所得提高
  - label: D
    content: 碳稅能減少外部成本，國民所得卻不會因此增加
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 父母健在、沒有妻小的獨子小明，由於小明的父母在國外工作，因此小明與年邁祖母同住，由小明負責照顧祖母的生活起居。某日小明駕車不小心撞傷路人小蓉，造成小蓉身受重傷，約定賠償50萬元。一週後，小明因病身故，未留下遺囑，只留下存款10萬元，小蓉只好轉向小明的祖母求償。關於上述賠償，下列選項何者正確？
  options:
  - label: A
    content: 肇事者是小明，因此只有小明有賠償義務，小蓉不可向小明的祖母求償
  - label: B
    content: 即使小明的祖母未依法拋棄繼承，也只須對小蓉負10萬元賠償責任
  - label: C
    content: 除非小明的祖母依法拋棄繼承，否則小蓉可以向他求償50萬元
  - label: D
    content: 小明的祖母並非小明的遺產繼承人，所以小蓉的求償於法無據
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 拜技術進步與全球分工所賜，現代的平板電腦不僅輕薄短小、功能強大，且每臺要價還不到1990年電腦的1/3。試若分析上述內容，下列推論何者最為適當？
  options:
  - label: A
    content: 1990年的電腦生產力是現代的3倍左右
  - label: B
    content: GDP不考量產品品質，恐低估生活福祉
  - label: C
    content: GDP忽略了家務勞動及志工服務的產值
  - label: D
    content: GDP的變動與技術進步呈現反向的關係
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 2022年12月台積電位在美國亞利桑那州鳳凰城的新廠已經正式開機。目前台積電遇到最大的困難在於工程人才的尋覓，由於難以在美國找到剛畢業的工程人才，因此大多從臺灣母公司外派，並調高薪資以符合美國生活水準。請問大批臺籍工程師外派美國，對我國2023年第一季（1月到3月）的國內生產毛額（GDP）、國民所得毛額（GNI）將造成何種影響？
  options:
  - label: A
    content: GDP和GNI皆上升
  - label: B
    content: GDP上升、GNI則下降
  - label: C
    content: GDP下降、GNI則上升
  - label: D
    content: GDP和GNI皆下降
