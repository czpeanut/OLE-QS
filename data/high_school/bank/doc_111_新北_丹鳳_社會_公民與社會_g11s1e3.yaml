- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 環保組織「全球見證」（Global Witness）點名全世界最大的林木進口國與消費國「中國」，囊括進口了全世界2/3的熱帶原木，除提供其龐大的內需市場外，也加工出口至歐美、日韓等國。如過去幾年來，臺灣的南太友邦「索羅門群島」，在中國的大量需求下，非法濫伐現象急遽惡化，砍伐率遠超乎維持永續發展的上限將近20倍。關於上文林木國際貿易的分析，下列何者「錯誤」？
  options:
  - label: A
    content: 在林木國際貿易，中國產生無謂損失；索國增加社會福利
  - label: B
    content: 中國出口加工木材製品，能增加生產者剩餘
  - label: C
    content: 中國在進口林木原料、出口加工木材製品上，都能增加社會福利
  - label: D
    content: 歐美、日韓進口加工木材製品，將會減少其生產者剩餘，卻能增加社會福利
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 若匈牙利的人口不變，則匈牙利同時出現上文畫線處(甲)、(乙)、(丙)三種情況時，該國最可能出現下列何種變化？
  options:
  - label: A
    content: 人均國內生產毛額提高
  - label: B
    content: 人均國內生產毛額降低
  - label: C
    content: 勞工全體獲得的工資總額提高
  - label: D
    content: 社會上所得分配更為平均
  group_stem: '匈牙利勞工工會發現，國內從汽車、鋼鐵到機械等產業全都積極自動化，這種情形也反映在數據上：匈牙利在2019年的<u>(甲)國內生產毛額相較於前一年增加了將近5%</u>，但是<u>(乙)製造業卻減少了2萬3千個工作機會</u>，出現6年來的首次減少。

    根據人力資源公司的觀察，匈牙利西部的工廠正逐步減少員工人數，而東部新建的工廠則屬於高度自動化的類型，估計製造業中將有數十萬個工作機遭機器取代。此種趨勢的根源在於，許多產品的價格持續下降，<u>(丙)工資卻不斷上漲</u>，企業希望對抗節節上升的勞動成本，因此加強自動化勢在必行。

    不過，自動化並不意味著機器與勞工陷入對立的關係，因為廠商藉助自動化降低成本，才得以獲利生存，否則恐怕被迫關閉工廠，產生更嚴重的失業問題。'
- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 若從支出面來看，匈牙利廠商推行自動化的做法，將直接增加匈牙利國內生產毛額中的哪個項目？
  options:
  - label: A
    content: 淨出口
  - label: B
    content: 投資支出
  - label: C
    content: 民間消費支出
  - label: D
    content: 政府消費支出
  group_stem: '匈牙利勞工工會發現，國內從汽車、鋼鐵到機械等產業全都積極自動化，這種情形也反映在數據上：匈牙利在2019年的<u>(甲)國內生產毛額相較於前一年增加了將近5%</u>，但是<u>(乙)製造業卻減少了2萬3千個工作機會</u>，出現6年來的首次減少。

    根據人力資源公司的觀察，匈牙利西部的工廠正逐步減少員工人數，而東部新建的工廠則屬於高度自動化的類型，估計製造業中將有數十萬個工作機遭機器取代。此種趨勢的根源在於，許多產品的價格持續下降，<u>(丙)工資卻不斷上漲</u>，企業希望對抗節節上升的勞動成本，因此加強自動化勢在必行。

    不過，自動化並不意味著機器與勞工陷入對立的關係，因為廠商藉助自動化降低成本，才得以獲利生存，否則恐怕被迫關閉工廠，產生更嚴重的失業問題。'
