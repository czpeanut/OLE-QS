- id: doc_111_新北_丹鳳_社會_公民與社會_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 若詩詩根據資料整理對研究主題進行總結，下列何者最可能為其結論？
  options:
  - label: A
    content: 我國的勞動檢查制度已使勞方得以和資方訂定平等互惠的合約
  - label: B
    content: 政府以公權力介入勞資關係，使勞動市場產生失業問題
  - label: C
    content: 在現行法律規範下，勞資雙方仍經常發生權力不對等的情形
  - label: D
    content: 勞動檢查制度課予企業經營者更高責任，使經濟效率降低
  group_stem: '下文為公共議題探究課程中，詩詩蒐集到的「臺灣勞動市場現況」報告整理：

    為確保勞動法令的落實，我國設有「勞動條件」與「職業安全衛生」兩種勞動檢查制度，前者主要針對勞工的薪資、工時、休假等勞動條件檢核；後者則是對工作場域是否設置防止職業災害的措施進行調查。

    根據勞動部「違法勞動法令事業單位查詢系統」的資料顯示，業者違反《勞動基準法》的情形，以第24條「未依法給付加班費」及第32條「迫使勞工加班超時工作」最為嚴重，前兩大違規事項都是加班相關的問題，全國件數總計皆高達近8000件、裁罰金額均達數千萬元。'
