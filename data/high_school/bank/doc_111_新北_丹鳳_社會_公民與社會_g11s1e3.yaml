  stem: 請問自由貿易協定（FTA）之簽訂，排除了WTO哪項原則之適用性？ (A)多邊談判原則 (C)國民待遇原則 (C)最惠國待遇原則 (D)關稅原則
  group_stem: '世界貿易組織（WTO）允許會員國之間簽訂自由貿易協定（FTA），在不提高對外貿易壁壘的前提之下，FTA締約會員國之間可以進一步降低關稅與消除貿易壁壘。例如區域全面經濟夥伴關係協定（RCEP）是由東南亞國家協會（ASEAN）十國發起，中國、日本、韓國、澳洲、紐西蘭等五國共同參加。

    RCEP於2020年11月正式簽署，對臺灣的影響主要在於「中國」和「東南亞國協」是我國前2大主要出口地區。<u>在RCEP生效之後，台灣對於RCEP成員國的出口，將面對比中國、日本、南韓等競爭對手更高的關稅貿易障礙</u>。'
