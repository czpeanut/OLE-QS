  stem: 現代社會對於家庭的概念有別於傳統夫妻與子女的型態，愈來愈多伴侶以共同生活為前提，卻不走入婚姻。但是，依我國現行《民法》規定，只有婚姻才具法律上之效力。請問有關結婚後衍生的法律效力，下列選項哪些正確？
