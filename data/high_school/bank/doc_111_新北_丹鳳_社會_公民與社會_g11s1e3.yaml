  stem: 十九世紀前期，商人阿寶從寧波來艋舺採購樟腦，計畫運回浙江、上海銷售，同時也運來綢緞、布帛等貨品來臺銷售。請問阿寶的貿易行為，對上述地區的樟腦市場與布帛市場有何影響？
