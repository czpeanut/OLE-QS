  stem: 對於定型化契約的敘述，下列何者正確？
  options:
  - label: A
    content: 定型化契約是業者與消費者間雙方協議後所共同訂定的契約
  - label: B
    content: 定型化契約因為已經過雙方同意，若對消費者若有失公平，仍然要遵守
  - label: C
    content: 定型化契約是指須透過書面文字的方式，經雙方簽名同意形成的契約條款
  - label: D
    content: 定型化契約在簽約前應給予消費者30天以內合理的審閱期
  group_stem: '據統計2022年上半年瘦身美容糾紛高達709件，多數是因為業者資訊不完整，許多消費者在被強迫推銷之下，購買美容產品，或是被不肖業者以話術引誘簽訂具有陷阱的美容契約。

    因此，行政院消保處審議通過「美容定型化契約應記載及不得記載事項」，明定業者應清楚揭露詢問事項，包括美容項目、金額、效果分析，以及為實施美容所購產品的內容、效用、數量、價格等資訊，並須明定解除或終止契約事由的退費計算。業者若違法，最高可處50萬元罰鍰，且可按次處罰，預計將於2023年7月上路。'
