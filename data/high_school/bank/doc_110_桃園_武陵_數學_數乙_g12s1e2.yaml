  page: 1
  stem: 在函數 f（x）＝$x^{3}$－x 的圖形上，已知以點 P 為切點的切線斜率為 11，則 P 點的坐標可為 ＿＿＿＿。（有兩解）
  answer:
  - （2，6）或（－2，－6）
  answer_status: verified
  answer_source: answer_key
  explanation: '設 P 點坐標為（a，$a^{3}$－a）

    f''（x）＝$3x^{2}$－1

    通過 P 點的切線斜率為 f''（a）＝$3a^{2}$－1＝11 ⇒ $3a^{2}$＝12 ⇒ $a^{2}$＝4 ⇒ a＝± 2

    ∴P 點坐標可為（2，6）或（－2，－6）'
