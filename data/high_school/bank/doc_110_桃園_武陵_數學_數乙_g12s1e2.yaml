  type: fill
  page: 1
  stem: 已知函數 f（x）＝$x^{3}$－$6ax^{2}$＋7x＋b 的圖形上所有切點的斜率中，以切點 P（2，2）為切點的切線斜率最小，求數對（a，b）＝＿＿＿＿。
  answer:
  - （1，4）
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$3x^{2}$－12ax＋7＝3（x－2a）$^{2}$＋7－$12a^{2}$

    ∵P（2，2）為切點時之切線斜率最小

    ∴2a＝2 ⇒ a＝1

    又 P（2，2）在函數 f（x）圖形上

    ⇒ f(2)＝8－24＋14＋b＝2 ⇒ b＝4

    故數對（a，b）＝（1，4）'
