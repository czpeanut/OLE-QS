- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 關於函數 f（x）＝$x^{3}$－$6x^{2}$－36x＋90，下列選項何者正確？
  options:
  - label: A
    content: f（x）在區間[2，6]上是遞減函數
  - label: B
    content: f（x）在區間[－2，2]上是遞增函數
  - label: C
    content: f（x）在區間（2，∞）的圖形為凹口向上
  - label: D
    content: f（x）在區間（－2，2）的圖形為凹口向上
  - label: E
    content: f（x）圖形的反曲點為（2，2）
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 已知某款平板賣出 x 臺的利潤函數為 P（x）＝0.$02x^{3}$＋500x（元），選出正確的選項。
  options:
  - label: A
    content: P'（x）＝0.$06x^{2}$＋500
  - label: B
    content: P'(60)＝716
  - label: C
    content: P(61)－P(60)近似於 716
  - label: D
    content: 賣出第 61 臺所增加的利潤約為 716 元
  answer:
  - A
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：P''（x）＝0.02．3．$x^{2}$＋500＝0.$06x^{2}$＋500

    (B) ○：P''(60)＝0.06×$60^{2}$＋500＝716

    (C)(D) ○：賣出第 61 臺所增加的利潤為 P(61)－P(60)

    ∵P(61)－P(60) ≈ P''(60)

    又 P''(60)＝$\lim_{x\rightarrow 60} \frac{P(x)-P(60)}{x-60}$

    ≈ $\lim_{x\rightarrow 60} \frac{0.02x^{3}+500x-34320}{x-60}$

    ＝$\lim_{x\rightarrow 60} (0.02x^{2}+1.2x+572)$

    ＝716

    故選(A)(B)(C)(D)'
- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: '已知 f（x）＝$x^{3}$－$2x^{2}$＋5，求：

    (1) $\lim_{x\rightarrow 2} \frac{f(x)-f(2)}{x-2}$＝＿＿＿＿。

    (2) $\lim_{x\rightarrow 2} \frac{f ''(x)-f ''(2)}{x-2}$＝＿＿＿＿。'
  answer:
  - (1) 4；(2) 8
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$3x^{2}$－4x

    (1)$\lim_{x\rightarrow 2} \frac{f(x)-f(2)}{x-2}$＝f''(2)＝3×$2^{2}$－4×2＝4

    (2)$\lim_{x\rightarrow 2} \frac{f ''(x)-f ''(2)}{x-2}$＝$\lim_{x\rightarrow 2} \frac{3x^{2}-4x-4}{x-2}$

    ＝$\lim_{x\rightarrow 2} (3x+2)$＝8'
- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 在函數 f（x）＝$x^{3}$－4x－1 的圖形上，以點 A（2，－1）為切點的切線方程式為＿＿＿＿。
  answer:
  - 8x－y＝17
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$3x^{2}$－4

    f''(2)＝3×$2^{2}$－4＝8

    ∴以點 A（2，－1）為切點的切線方程式為 y＋1＝8（x－2）⇒ 8x－y＝17'
- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: 設 f（x）＝$x^{3}$＋$kx^{2}$＋3x＋1，在整條實數線 R 上為嚴格遞增函數，求 k 的範圍為＿＿＿＿。
  answer:
  - －3 ≤ k ≤ 3
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）為嚴格遞增函數

    ∴f''（x）＝$3x^{2}$＋2kx＋3 ≥ 0

    判別式＝（2k）$^{2}$－4×3×3 ≤ 0

    ⇒ $4k^{2}$－36 ≤ 0

    ⇒ $k^{2}$－9 ≤ 0

    ⇒ $k^{2}$ ≤ 9

    ∴－3 ≤ k ≤ 3'
