- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s2_8
  section: 2
  number: 8
  type: fill
  page: 1
  stem: 已知 P（－1，3）為三次函數 f（x）＝$x^{3}$＋$ax^{2}$＋bx＋c 圖形的反曲點，且以 P 點為切點的切線斜率為 2，求序組（a，b，c）＝＿＿＿＿。
  answer:
  - （3，5，6）
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$3x^{2}$＋2ax＋b

    f''''（x）＝6x＋2a

    ∵P（－1，3）為 f（x）的反曲點

    ∴f（－1）＝－1＋a－b＋c＝3

    f''''（－1）＝－6＋2a＝0 ⇒ a＝3

    又以 P 點為切點的切線斜率為 2

    ∴f''（－1）＝3－2a＋b＝2 ⇒ b＝5

    而 c＝6，故序組（a，b，c）＝（3，5，6）'
- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s2_9
  section: 2
