- id: doc_110_桃園_武陵_數學_數乙_g12s1e2_s2_11
  section: 2
  number: 11
  type: fill
  page: 1
  stem: 已知三次函數 f（x）在 x＝0 處有極小值 1，且此函數圖形在點（－1，3）與直線 y＝－3x 相切，則 f（x）＝＿＿＿＿。
  answer:
  - $x^{3}$＋$3x^{2}$＋1
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）在 x＝0 處有極小值 1

    ∴f(0)＝1 且 f''(0)＝0

    設 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋1

    f''（x）＝$3ax^{2}$＋2bx＋c

    f''(0)＝c＝0

    ⇒ f（x）＝$ax^{3}$＋$bx^{2}$＋1

    ∵直線 y＝－3x 之斜率為－3

    ∴f''（－1）＝3a－2b＝－3

    又點（－1，3）在三次函數 f（x）圖形上

    f（－1）＝－a＋b＋1＝3 ⇒ a－b＝－2

    $\begin{cases}3a-2b=-3 \\ a-b=-2\end{cases}$⇒解得 a＝1，b＝3

    ∴f（x）＝$x^{3}$＋$3x^{2}$＋1'
