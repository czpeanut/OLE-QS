- id: doc_109_台中_台中女中_數學_數B_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 兩千多年前<u>希臘</u>藝術家用大理石雕刻《米羅的維納斯》，如右圖。現為<u>法國巴黎</u>的<u>羅浮宮</u>博物館的三大館藏之一。古<u>希臘</u>的藝術家們認為勻稱協調的美可以用適當的數字比例呈現出來。依照<u>歐幾里德</u>這位幾何學大師的說法，就是把一條線段分成兩段，其中長線段和短線段的比恰等於完整線段和長線段的比。而<u>維納斯</u>雕像的肚臍到腳底距離（相當於長線段）與頭頂到肚臍距離（相當於短線段）幾乎符合這樣的比例。堪稱具有勻稱比例的完美雕像。長線段與短線段的比值最接近下列哪一個數字？（參考數據：$\sqrt{5}$ ≈ 2.236）
  options:
  - label: A
    content: $\frac{7}{4}$
  - label: B
    content: $\frac{8}{5}$
  - label: C
    content: $\frac{9}{6}$
  - label: D
    content: $\frac{10}{7}$
  - label: E
    content: $\frac{11}{8}$
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_109_台中_台中女中_數學_數B_g11s1e3/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 508.25
      - 273.95
      - 557.55
      - 416.15
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '設長線段 x，短線段 1

    ⇒ x：1＝（x＋1）：x

    ⇒ x．x＝1．（x＋1）

    ⇒ $x^{2}$－x－1＝0

    ⇒ x＝$\frac{1\pm \sqrt{5}}{2}$（負不合）

    ∴$\frac{長線段}{短線段}=\frac{x}{1}$＝x＝$\frac{1+\sqrt{5}}{2}$ ≈ $\frac{1+2.236}{2}$＝1.618 ≈ $\frac{8}{5}$

    故選(B)'
- id: doc_109_台中_台中女中_數學_數B_g11s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 平面上，若對於任意給定的非零向量$\vec{v}$，皆能找到一組實數 x、y，使得$\vec{v}$可寫成 x$\vec{a}$＋y$\vec{b}$的型態，則下列哪些選項的向量$\vec{a}$與$\vec{b}$可滿足上述條件？
  options:
  - label: A
    content: $\vec{a}$＝（1，0），$\vec{b}$＝（0，1）
  - label: B
    content: $\vec{a}$＝（1，1），$\vec{b}$＝（1，2）
  - label: C
    content: $\vec{a}$＝（1，1），$\vec{b}$＝（2，2）
  - label: D
    content: $\vec{a}$＝（3，2），$\vec{b}$＝（－3，－2）
  - label: E
    content: $\vec{a}$＝（3，2），$\vec{b}$＝（2，－3）
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: $\vec{a}//＼\vec{b}$即可，故選(A)(B)(E)
- id: doc_109_台中_台中女中_數學_數B_g11s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 設兩直線 $L_{1}$：2x＋y＝6 與 $L_{2}$ 的其中一個夾角為θ（0°＜θ＜90°），已知 $L_{2}$ 會平行向量（－1，7），則下列哪些選項是正確的？
  options:
  - label: A
    content: $L_{1}$ 會平行向量（2，1）
  - label: B
    content: $L_{1}$ 會垂直向量（6，3）
  - label: C
    content: （－1，7）為 $L_{2}$ 的一個法向量
  - label: D
    content: （7，1）為 $L_{2}$ 的方向向量
  - label: E
    content: cosθ＝$\frac{3}{\sqrt{10}}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$L_{1}$：2x＋y＝6 的法向量為$\vec{n}_{1}$＝（2，1），方向向量為$\vec{\ell}_{1}$＝（1，－2）

    $L_{2}$ 的方向向量為$\vec{\ell}_{2}$＝（－1，7），法向量為$\vec{n}_{2}$＝（7，1）

    (A) ╳：$\vec{\ell}_{1}$＝（1，－2）$//＼$（2，1）

    (B) ○：（6，3）//$\vec{n}_{1}$＝（2，1） ∴$L_{1}$ 會垂直向量（6，3）

    (C) ╳：（－1，7）為 $L_{2}$ 方向向量

    (D) ╳：（7，1）為 $L_{2}$ 法向量

    (E) ○：cosθ＝$\frac{\vec{n}_{1} \cdot \vec{n}_{2}}{| \vec{n}_{1} | | \vec{n}_{2} |}$＝$\frac{(2 , 1) \cdot (7 , 1)}{\sqrt{5}\sqrt{50}}$＝$\frac{15}{5\sqrt{10}}$＝$\frac{3}{\sqrt{10}}$

    故選(B)(E)'
