  stem: 重複執行伯努力試驗n次，已知成功次數的期望值為150次，成功次數的標準差為10次，則這個伯努力試驗應最有可能為下列哪一個選項？
  options:
  - label: A
    content: 擲一公正骰子，以1或6點為成功，其他點數為失敗
  - label: B
    content: 擲一公正骰子，以1或6點為失敗，其他點數為成功
  - label: C
    content: 擲一公正骰子，以奇數點為成功，偶數點為失敗
  - label: D
    content: 擲一公正骰子，以1點為成功，其他點數為失敗
  - label: E
    content: 擲一公正骰子，以1點為失敗，其他點數為成功
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 可知$\begin{cases}np=150 \\ np(1-p)=100\end{cases}\Rightarrow$ 1－p＝$\frac{2}{3}\Rightarrow$ p＝$\frac{1}{3}$，即成功的機率為$\frac{1}{3}$，故選(A)。
