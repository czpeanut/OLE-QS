  stem: 甲、乙、丙三人進行「黑白黑白我勝利」的猜拳遊戲，每人每次出拳為手心或手背。現在規定甲與另外兩人不同者則甲獲勝且遊戲終止，否則繼續下一局比賽。已知每次出拳都為獨立事件，隨機出拳，直到甲第一次勝利為止。舉例：第一次出拳三人都出手背，則繼續第二次出拳；第二次出拳為乙、丙兩人出手背，甲出手心，則甲獲勝並停止遊戲。求停止遊戲所需次數的標準差為下列哪一個選項？
  options:
  - label: A
    content: $\sqrt{6}$
  - label: B
    content: $2\sqrt{2}$
  - label: C
    content: $2\sqrt{3}$
  - label: D
    content: $2\sqrt{6}$
  - label: E
    content: '3'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 設隨機變數X表示所需次數，可知X～G (P)，其中P＝$\frac{C_{1}^{2}}{2^{3}}$＝$\frac{1}{4}$ 所以標準差δ＝$\sqrt{\frac{1-P}{P^{2}}}$＝$\sqrt{\frac{1-\frac{1}{4}}{\frac{1}{16}}}$＝$\sqrt{12}$＝$2\sqrt{3}$，故選(C)。
