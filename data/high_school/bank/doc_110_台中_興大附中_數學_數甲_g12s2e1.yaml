  stem: 設ω＝cos$\frac{2\pi}{5}$＋i sin$\frac{2\pi}{5}$，請選出正確的選項。
  options:
  - label: A
    content: $\overline{\omega ^{10}}$＝1
  - label: B
    content: (1－ω)(1－ω$^{2}$)(1－ω$^{3}$)(1－ω$^{4}$)＝5
  - label: C
    content: $\frac{1}{1-\omega}$＋$\frac{1}{1-\omega ^{2}}$＋$\frac{1}{1-\omega ^{3}}$＋$\frac{1}{1-\omega ^{4}}$＝2
  - label: D
    content: 1＋ω＋ω$^{2}$＋ω$^{3}$＋…＋ω$^{2022}$＝1＋ω＋ω$^{2}$＋ω$^{3}$
  - label: E
    content: cos$\frac{2\pi}{5}$＋cos$\frac{4\pi}{5}$＋cos$\frac{6\pi}{5}$＋cos$\frac{8\pi}{5}$＝1
  explanation: (A) ○：ω$^{10}$＝(cos$\frac{2\pi}{5}$＋i sin$\frac{2\pi}{5}$)$^{10}$＝cso4π＋i sin4π＝1 $\Rightarrow\overline{\omega ^{10}}$＝1 (B) ○：因為1，ω，ω$^{2}$，ω$^{3}$，ω$^{4}$為$z^{5}$＝1的五個根， 所以$z^{5}$－1＝(z－1)(z－ω)(z－ω$^{2}$)(z－ω$^{3}$)(z－ω$^{4}$)＝(z－1)($z^{4}$＋$z^{3}$＋$z^{2}$＋z＋1) $\Rightarrow$ (z－ω)(z－ω$^{2}$)(z－ω$^{3}$)(z－ω$^{4}$)＝$z^{4}$＋$z^{3}$＋$z^{2}$＋z＋1 $\Rightarrow$ (1－ω)(1－ω$^{2}$)(1－ω$^{3}$)(1－ω$^{4}$)＝1＋1＋1＋1＋1＝5 (C) ○：可知ω$^{5}$＝1 $\Rightarrow\frac{1}{1-\omega}$＋$\frac{1}{1-\omega ^{2}}$＋$\frac{1}{1-\omega ^{3}}$＋$\frac{1}{1-\omega ^{4}}$＝($\frac{1}{1-\omega}$＋$\frac{1}{1-\omega ^{4}}$)＋($\frac{1}{1-\omega ^{2}}$＋$\frac{1}{1-\omega ^{3}}$) ＝$\frac{2-\omega -\omega ^{4}}{\omega ^{5}-\omega ^{4}-\omega +1}$＋$\frac{2-\omega ^{2}-\omega ^{3}}{\omega ^{5}-\omega ^{3}-\omega ^{2}+1}$＝$\frac{2-\omega -\omega ^{4}}{2-\omega -\omega ^{4}}$＋$\frac{2-\omega ^{2}-\omega ^{3}}{2-\omega ^{2}-\omega ^{3}}$＝1＋1＝2 (D) ×：可知1＋ω＋ω$^{2}$＋ω$^{3}$＋ω$^{4}$＝0 $\Rightarrow$ 1＋ω＋ω$^{2}$＋…＋ω$^{2022}$＝1＋ω＋ω$^{2}$ (E) ×：0＝1＋ω＋ω$^{2}$＋ω$^{3}$＋ω$^{4}$＝1＋(cos$\frac{2\pi}{5}$＋i sin$\frac{2\pi}{5}$)＋(cos$\frac{4\pi}{5}$＋isin$\frac{4\pi}{5}$)＋(cos$\frac{6\pi}{5}$＋isin$\frac{6\pi}{5}$)＋(cos$\frac{8\pi}{5}$＋isin$\frac{8\pi}{5}$) ＝(1＋cos$\frac{2\pi}{5}$＋cos$\frac{4\pi}{5}$＋cos$\frac{6\pi}{5}$＋cos$\frac{8\pi}{5}$)＋i (sin$\frac{2\pi}{5}$＋isin$\frac{4\pi}{5}$＋isin$\frac{6\pi}{5}$＋isin$\frac{8\pi}{5}$) $\Rightarrow$ cos$\frac{2\pi}{5}$＋cos$\frac{4\pi}{5}$＋cos$\frac{6\pi}{5}$＋cos$\frac{8\pi}{5}$＝－1 故選(A)(B)(C)。
