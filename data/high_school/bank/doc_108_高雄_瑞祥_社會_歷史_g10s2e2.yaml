questions:
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 「宇文泰重用蘇綽，制定計賬、戶籍等制度；獎勵清廉，嚴禁貪汙，建議裁減官員，進行屯田，又作〈六條詔書〉，宇文泰完全採納，令百官誦習。州刺史郡守縣官不通六條及計賬法，不許做官。西魏政治顯然比東魏政治好一些，＿＿＿＿。」在空格處，應該接著的是哪句話最為適宜？
  options:
  - label: A
    content: 宇文泰選取身體強健的農民組成府兵
  - label: B
    content: 西魏後來成為北周，東魏後來成為北齊
  - label: C
    content: 到孝文帝時進行大規模的華化運動
  - label: D
    content: 宇文氏的政權從此趨於鞏固
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 從魏晉南北朝時期起，中國醫書對瘧疾的記載較多且有相當清楚的認識。出現這種醫學知識的主要背景為何？
  options:
  - label: A
    content: 三國以來，中印雙方來往頻繁，行商客旅將瘧疾傳入中國
  - label: B
    content: 西晉末年，華北居民大量南徙，在溼熱環境中感染者日眾
  - label: C
    content: 南北朝時，南北往來頻繁，游牧民族免疫力弱，感染者眾
  - label: D
    content: 北朝之時，胡族入居中原，將北亞草原特殊疾病傳入中國
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 《史記》有〈河渠書〉，《漢書》有〈溝洫志〉，主要針對黃河患害的嚴重而寫的。但是，《後漢書》到新、舊《唐書》都沒有〈河渠書〉或〈溝洫志〉等篇章。學者歸因於黃河基本上安流無事，無需專闢一篇。請問此一時期黃河安流的最可能原因是什麼？
  options:
  - label: A
    content: 北方朝廷政治清明，治理黃河成效顯著
  - label: B
    content: 北方胡人政權重用漢人，不乏水利專家
  - label: C
    content: 黃河中游西側農業大為進步，水利發達
  - label: D
    content: 黃河中游西側多屬胡人居處，變農為牧
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 王元規是太原人，父親過世後，母親帶他回娘家。當地一位富豪，欲將女兒嫁給他。母親考慮自己的貧困處境，有意結此親事，當時才十二歲的王元規卻哭著說：「古人講究門當戶對，我們不能因為暫時住在這裡，就不顧身分。」母親覺得有道理，就婉拒了這門親事。這則故事反映出什麼樣的社會觀念？
  options:
  - label: A
    content: 這應是發生在西漢初年，反映當時的門第觀念
  - label: B
    content: 當時的世家子弟年紀雖幼，卻可自己決定婚事
  - label: C
    content: 地方富豪有意與高門子弟聯姻，提高社會地位
  - label: D
    content: 當時女性地位高漲，子女的婚姻全由母親決定
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 《元史．泰不華傳》記載：「泰不華字兼善，伯牙台氏，父塔不台，歷仕台州錄事判官，遂居於台。家貧好讀書，年十七，江浙鄉試第一，明年至治元年，進士及第。至正元年，泰不華除（擔任）紹興路總管，行鄉飲酒禮，教民興讓，越俗大化。」下列論述或論著，何者最有可能引以上文字作為證據？
  options:
  - label: A
    content: 〈元初州縣多世襲〉
  - label: B
    content: 《元西域人華化考》
  - label: C
    content: 〈色目人隨便居住〉
  - label: D
    content: 《元典章校補》
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 王曰：「有人說：遼以信佛而衰弱，金以崇儒而亡國，有這回事嗎？」對曰：「遼國的事我不知道。金國的事我親身參與。金的宰相中雖有一二位儒臣，其他都是武將貴爵出身。而儒臣任相很少參與軍國大計。其他以儒術任職的官員為數不多，只不過經手一些行政事務，國家存亡有其應該負責的人，與儒術無關。」王聽了很同意。這段君臣對話中的「王」，應是何人？
  options:
  - label: A
    content: 耶律阿保機
  - label: B
    content: 完顏阿骨打
  - label: C
    content: 忽必烈
  - label: D
    content: 努爾哈赤
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 一篇文章提到：「朱元璋建立明朝以後，實行海禁政策，嚴禁民眾出海貿易。」又說：「徽州、東南沿海一帶山多地少，民以商為生。中日貿易，雙方商人獲利，民亦有生路。當百姓無以為生時，商人就變為海盜，百姓則從海盜之事。」下列哪種說法最符合上文的旨意？
  options:
  - label: A
    content: 明太祖為了恢復生產，獎勵農耕，實施海禁政策，阻止勞動力外流
  - label: B
    content: 中國向以天朝自居，自給自足，不假外人，海上貿易僅限朝貢國家
  - label: C
    content: 元代以來，阿拉伯商人控制南海貿易，影響中國，故實施海禁政策
  - label: D
    content: 東南沿海居民習於海洋貿易，海禁斷絕貿易機會，故只好鋌而走險
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 外族攻入都城，俘擄太上皇、皇帝與皇室數千人北遷。一位愛國詩人述及此事，寫下：「少年嬉笑老人悲，尚記二帝蒙塵時。嗚呼！國君之仇通百世，無人按劍決大議。」此詩寫於何時？詩人要表達的意旨為何？
  options:
  - label: A
    content: 南宋，痛切檢討徽、欽二帝被女真擄去原因
  - label: B
    content: 南明，唐王與桂王被擄，只有老臣感到悲傷
  - label: C
    content: 南宋，以二帝被擄為恥，朝中乏人挽救為羞
  - label: D
    content: 南明，號召大臣按劍決議，救回唐、桂二君
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 兩位士族出身的文人，回憶了時代和家族出路。甲文人雖然看到戰亂使其家族前途未卜，但他相信，如果他的子弟想要出任為官，應該不會有什麼問題。乙文人對於士人家族的前途同樣感到渺茫，但他所處的時代，官員們幾乎不可能為其後代子孫的仕途提供庇護。請問，甲、乙兩位文人最可能分屬於哪一朝代？
  options:
  - label: A
    content: 秦朝、唐朝
  - label: B
    content: 元朝、清朝
  - label: C
    content: 魏晉、宋朝
  - label: D
    content: 漢朝、唐朝
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 教科書描述某一古都：「這個城市的人口大約一百萬，外國人可能占了三分之一。城內圍隔成一百多個坊，除了皇城、中央官署外，還有東、西兩個市場。如果有機會拜訪這座城市，你會因為眾多的佛寺而感到震驚。宴會上常可看到外國女子組成的樂隊，坐在駱駝背負的平臺上表演，演奏著類似吉他的琵琶。」這最可能是哪一座都城？
  options:
  - label: A
    content: 東漢的洛陽
  - label: B
    content: 唐朝的長安
  - label: C
    content: 北宋的汴京
  - label: D
    content: 清朝的北京
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 某次，中國政府派兵前往國外，全軍包括軍官與士兵等，共約28000人，並設置醫官、醫士、通譯、買辦等職官。拜訪了30多個國家和地區，途中曾與某國發生衝突，指揮官帶領官兵破城，生擒該國國王及家屬，送回京師。這是
  options:
  - label: A
    content: 漢代，張騫出使西域
  - label: B
    content: 宋代，富弼出使漠南
  - label: C
    content: 明代，鄭和出使南洋
  - label: D
    content: 民國，國軍前往滇緬
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 一些人評價清末中國的「某一個事件」，認為它是中國史上規模最大的戰爭，且它的發生促成了劇烈的人群移動、城市人口結構變化等。試問「某一個事件」所指為何？
  options:
  - label: A
    content: 捻亂
  - label: B
    content: 回變
  - label: C
    content: 太平天國
  - label: D
    content: 義和團運動
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 相傳著名的浪漫派詩人李白樣貌不像漢人，卻仍受到唐玄宗與楊貴妃的器重，下列何項推測最合理？
  options:
  - label: A
    content: 有可能：唐代皇帝姓李，所以特別重視姓李的人
  - label: B
    content: 不可能：李白才能優秀，故破例以外族身分受器重
  - label: C
    content: 有可能：唐代許多皇帝對任用外族採取開放的態度
  - label: D
    content: 不可能：唐代統治者對夷夏之防十分嚴密
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 下列哪項措施是導致北魏政權分裂的原因之一？
  options:
  - label: A
    content: 禁止異族通婚
  - label: B
    content: 遷都洛陽
  - label: C
    content: 僑州享有免除賦稅的特權
  - label: D
    content: 粟特族的叛亂
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 東晉初年，政府為收容南渡人士，設立許多僑州郡縣，作為權宜之計。時日一久，僑州郡縣的問題浮現，為解決此弊害，乃有「土斷法」的實施。有關「土斷法」的敘述，下列何者正確？
  options:
  - label: A
    content: 土斷法是將流寓與在地人士分別編入不同戶籍，以示區別
  - label: B
    content: 土斷法可以容許僑州郡縣人士免稅、免役
  - label: C
    content: 土斷法消弭了南遷與在地人士的隔閡
  - label: D
    content: 土斷法是一種允許占田的土地制度
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 某學者分析：東晉初年，北方士族紛紛逃亡南下，南方在地豪族往往對其抱以懷疑、輕視的態度，其中義興周氏、吳興沈氏的實力最為強大。東晉政府一方面對他們極盡籠絡，爭取支持；另一方面透過加強、提升江南朱、張、顧、陸四姓勢力，來打擊周、沈二氏。請問這些東晉政府用來打擊周、沈二氏的江南四姓士族，稱為什麼？
  options:
  - label: A
    content: 郡姓
  - label: B
    content: 國姓
  - label: C
    content: 吳姓
  - label: D
    content: 僑姓
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 學者指出某個朝代鑒於前朝之弊病，於是「嚴華、夷之防，重文、武之別，裁抑王室貴族之奢淫，讓受教育、講道理的讀書人為社會之中堅。」請問學者所說的是哪一個朝代？
  options:
  - label: A
    content: 唐
  - label: B
    content: 宋
  - label: C
    content: 元
  - label: D
    content: 隋
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 兩宋時期雖然因為對外戰爭的失敗，屢被迫訂立屈辱條約，但因為夷夏之防觀念甚嚴，所以從未施行下列哪一種方式來換取和平？
  options:
  - label: A
    content: 與他國約為兄弟
  - label: B
    content: 歲幣
  - label: C
    content: 和親
  - label: D
    content: 榷場貿易互市
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 清廷將臺灣收入版圖後，開放人民出海貿易，但仍將長期滯留海外者貼上「不忠不孝之人所為」的政治標籤。請問其主要原因為何？
  options:
  - label: A
    content: 清朝並未成立收取關稅的機構，海外貿易一律視為逃稅
  - label: B
    content: 國內人口成長遲緩，朝廷不希望人民長期滯留海外
  - label: C
    content: 基於國防安全考量，認為海外華商可能與「番夷」勾結
  - label: D
    content: 朝廷對於人口移民政策始終保持消極態度
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_20
  section: 1
  number: 20
  type: calc
  page: 2
  stem: 4世紀初，華北的胡人劉淵、石勒趁晉宗室內訌之際起事，「五胡亂華」之局於是展開。請問上文中的「晉宗室內訌」是指？ (C)三監之禍 (B)七國之亂 (C)八王之亂 (D)靖難之役
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 東晉初期，南渡後的晉室及僑姓士族，為穩定東晉政權，極力籠絡原居於江南的吳姓士族，逐漸形成以僑姓為主、吳姓為輔的政治格局。請問下列哪些姓氏是當時「僑姓士族」的代表？
  options:
  - label: A
    content: 袁、蕭
  - label: B
    content: 王、朱
  - label: C
    content: 顧、陸
  - label: D
    content: 張、謝
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 西元3到8世紀，「粟特人」利用龐大的商隊，掌握從中亞撒馬爾罕與長安之間，甚至於更遠的東北邊境地帶之貿易活動。下列有關「粟特人」的敘述，何者正確？
  options:
  - label: A
    content: 從隋唐到宋代，皆設有「薩保府」管理之
  - label: B
    content: 宗教上信仰景教（基督教）
  - label: C
    content: 語言上使用印度語的變體，並借用古敘利亞或摩尼字母來標音
  - label: D
    content: 安祿山以粟特人領袖的身分，發動安史之亂
- id: doc_108_高雄_瑞祥_社會_歷史_g10s2e2_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 南宋政權建立後，在政治上曾出現地域性的差異，其特點為何？
  options:
  - label: A
    content: 金人主軍、漢人主政
  - label: B
    content: 漢人主軍、金人主政
