  stem: 「居天地之中者曰中國，居天地之偏者曰四夷。四夷外也。中國內也。……東方曰夷，被髮文身，有不火食者矣。南方曰蠻，雕題（紋面）交趾（盤腿），有不火食者。西方曰戎，被髮衣皮，有粒食（以穀物為食）者。北方曰狄，毛衣穴居，有不粒食者。」上述文字為北宋時代學者的作品節錄，其透露出怎樣的意識？
  options:
  - label: A
    content: 認為四夷文化程度高於中國
  - label: B
    content: 突顯出兼容並蓄的民族觀點
  - label: C
    content: 對中國以外的民族採取歧視
  - label: D
    content: 希望能引入四方的飲食習慣
