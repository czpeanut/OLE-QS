  stem: 已知 k 為整數，若一元二次方程式 $x^{2}$＋kx－2k＝0 沒有實根，則 k 共有幾個？
  options:
  - label: A
    content: 9 個
  - label: B
    content: 7 個
  - label: C
    content: 6 個
  - label: D
    content: 2 個
  - label: E
    content: 無限多個
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '∵方程式 $x^{2}$＋kx－2k＝0 沒有實根

    ∴判別式 $k^{2}$－4×1×（－2k）＜0$\Rightarrowk^{2}$＋8k＜0$\Rightarrow$k（k＋8）＜0$\Rightarrow$－8＜k＜0

    又因 k 為整數 ∴k＝－7、－6、－5、－4、－3、－2、－1，共 7 個

    故選(B)'
