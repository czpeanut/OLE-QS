  type: multiple
  page: 2
  stem: 設 f（x）為三次實係數多項式，且複數 i＋1 為方程式 f（x）＝0 的一根。選出正確的選項？
  options:
  - label: A
    content: f（i－1）＝0
  - label: B
    content: f（3＋2i）≠0
  - label: C
    content: 方程式 f（x）＝0 沒有實根
  - label: D
    content: f（x）＝3 的圖形與 x 軸必有交點
  - label: E
    content: 多項式 f（x）可被 $x^{2}$－2x＋2 整除
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳(B)○：∵1＋i 為實係數方程式 f（x）＝0 之一根 ∴1－i 為其另一根，即 f（1－i）＝0

    又∵f（x）＝0 為三次方程式，複數 1＋i、1－i 為其複數根 ∴另一根必為實根

    因此 f（i－1）≠0，f（3＋2i）≠0

    (C)╳：方程式 f（x）＝0 有一實根

    (D)○：∵f（x）－3＝0 為三次實係數方程式

    ∴其可能為 1 實根、2 共軛虛根或 3 實根

    因此 f（x）＝3 的圖形與 x 軸必有交點

    (E)○：∵以 1＋i、1－i 為根的二次實係數方程式為

    〔x－（1＋i）〕〔x－（1－i）〕＝$x^{2}$－2x＋2＝0

    ∴多項式 f（x）可被 $x^{2}$－2x＋2 整除

    故選(B)(D)(E)'
