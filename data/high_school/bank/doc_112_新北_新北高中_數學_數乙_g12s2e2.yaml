  explanation: '(1) ∵三次函數 f（x）過點（－1，0）、（1，0），且與 x 軸相切於（1，0）

    ∴設 f（x）＝a（x－1）$^{2}$（x＋1）

    又因其過點（0，1）

    ∴f(0)＝a×1×1＝1$\Rightarrow$a＝1

    故 f（x）＝（x－1）$^{2}$（x＋1）＝$x^{3}$－$x^{2}$－x＋1

    (2) g（x）＝（$x^{3}$－$x^{2}$－x＋1）－1＝$x^{3}$－$x^{2}$－x

    ＝x（$x^{2}$－x－1）＝0

    方程式 g（x）＝0 的解為 x＝0 或 x＝$\frac{1\pm \sqrt{5}}{2}$，其中有 1 個正根、1 個負根

    故數對（m，n）＝（1，1）'
