  section: 3
  number: 4
  type: fill
  page: 2
  stem: 試求複數 3＋4i 的平方根為＿＿＿＿。
  answer:
  - 2＋i 或－2－i
  answer_status: verified
  answer_source: answer_key
  explanation: '設 a＋bi 為複數 3＋4i 的平方根，且 a，b 為實數

    則（a＋bi）$^{2}$＝3＋4i

    （$a^{2}$－$b^{2}$）＋（2ab）i＝3＋4i

    $\Rightarrow\begin{cases}a^{2}-b^{2} = 3 \ldots \ldots \ldots \ldots \ldots ① \\ 2ab = 4 \ldots \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由②式得 b＝$\frac{2}{a}$，代入第①式

    $a^{2}- \left( \frac{2}{a} \right) ^{2}$＝3

    $\Rightarrowa^{2}-\frac{4}{a^{2}}$＝3

    $\Rightarrowa^{4}$－$3a^{2}$－4＝0

    $\Rightarrow$（$a^{2}$＋1）（$a^{2}$－4）＝0

    $\Rightarrow$a＝± i（不合）或 a＝± 2

    代回②可得：

    若 a＝2，則 b＝1

    若 a＝－2，則 b＝－1

    ∴所求為 2＋i 或－2－i'
