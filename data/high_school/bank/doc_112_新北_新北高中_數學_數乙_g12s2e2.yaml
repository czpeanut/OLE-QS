- id: doc_112_新北_新北高中_數學_數乙_g12s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 設α，β為方程式 $x^{2}$＋4x＋1＝0 的兩根，選出正確的選項？
  options:
  - label: A
    content: α＋β＝4
  - label: B
    content: αβ＝1
  - label: C
    content: α，β為共軛複數
  - label: D
    content: α－β＝$2\sqrt{3}$
  - label: E
    content: $( \sqrt{\alpha} + \sqrt{\beta} )^{2}$＝－2
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳(B)○：由根與係數的關係知

    $\begin{cases}\alpha +\beta =\frac{-4}{1}=-4 \\ \alpha \beta =\frac{1}{1}= 1\end{cases}$，其中α＜0，β＜0

    (C)╳：∵判別式為 $4^{2}$－4×1×1＞0 ∴α，β為兩相異實根

    (D)╳：（α＋β）$^{2}$＝16

    $\Rightarrow$α$^{2}$＋β$^{2}$＋2×1＝16$\Rightarrow$α$^{2}$＋β$^{2}$＝14

    （α－β）$^{2}$＝α$^{2}$＋β$^{2}$－2αβ＝14－2×1＝12

    ∴α－β＝$\pm 2\sqrt{3}$

    (E)╳：$( \sqrt{\alpha} + \sqrt{\beta} )^{2}$＝α＋β－$2\sqrt{\alpha \beta}$＝－4－2＝－6

    故選(B)'
