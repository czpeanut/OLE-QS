  stem: 已知四次實係數多項式 f（x）滿足$f ( \sqrt{2} -i )$＝0，試問函數 y＝f（x）的圖形與 x 軸可能有幾個交點？
  options:
  - label: A
    content: 0 個
  - label: B
    content: 1 個
  - label: C
    content: 2 個
  - label: D
    content: 3 個
  - label: E
    content: 條件不足無法確定
  answer:
  - A
  - B
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）＝0 為四次實係數多項式方程式，且$f ( \sqrt{2} -i )$＝0

    ∴由虛根成對定理知$f ( \sqrt{2} +i )$＝0

    因此 f（x）＝0 可能為兩相異實根兩虛根或兩相等實根兩虛根或四虛根

    $\Rightarrow$y＝f（x）的圖形與 x 軸可能有 2 個或 1 個或 0 個交點

    故選(A)(B)(C)'
