  stem: 就讀九信小學一年級的小華，對於其鄰座大明的新髮型很好奇，趁著午休時間、大明不注意時以牙籤撩撥大明頭髮，卻不慎刺傷大明頭皮使其受傷。但小華卻沒有受到法律的制裁，理由何在？
  options:
  - label: A
    content: 我國法律規定，讓人受傷僅有民事賠償，不會受到刑責處罰
  - label: B
    content: 小華屬未成年人，依法應由其法定代理人代為擔負刑事責任
  - label: C
    content: 依《刑法》規定而言，小華未滿 14 歲，屬無責任能力人，依法律規定而不罰
  - label: D
    content: 依《民法》規定而言，因小華未滿 20 歲，屬限制行為能力人，其法律效力未定
  answer:
