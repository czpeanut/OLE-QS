  stem: 立法院於民國 98 年 1 月三讀通過廢止了實施多年的《檢肅流氓條例》。法務部所提出的廢止理由說明指出，該法的不當規定包括：欺壓善良、品行惡劣、遊蕩無賴定義模糊；限制被移送人對證人之對質、詰問權與閱卷權；對未達犯罪程度之流氓行為施以感訓處分等。請問上述不當規定涉及違反下列哪些原則？(甲)罪刑法定(乙)公開審理(丙)比例原則(丁)正當程序(戊)無罪推定
