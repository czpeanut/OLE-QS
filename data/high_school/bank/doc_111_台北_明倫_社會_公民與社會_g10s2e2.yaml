  page: 1
  stem: 在所有殺人的犯罪案件中，如果為了分析方便，可以分成兩類：「令人髮指」與「令人同情」。針對「令人髮指」的殺人案件，法律的制裁必定人人叫好；可是審理「令人同情」的妻子不堪長期受虐，某日夜晚趁丈夫熟睡而將其殺害案件，下列哪一項判決兼顧「法律正義」與「社會期盼」？（參考《刑法》第 271 條：殺人者，處死刑、無期徒刑或十年以上有期徒刑）
  options:
  - label: A
    content: 有罪，判處死刑，褫奪公權終身
  - label: B
    content: 有罪，但情有可原，免刑，當庭釋放
  - label: C
    content: 有罪，屬正當防衛，判處十年有期徒刑
  - label: D
    content: 有罪，因不堪長期受虐，減輕為五年有期徒刑
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 在法律正義上，違反《刑法》，就應當受《刑法》之處罰。但在社會期盼上，認為其情可憫，應當可依法給予減刑，故選(D)。(A)完全依法審判，不予減刑，無視社會期盼。(B)當庭釋放，不用負起刑事責任，此僅顧及社會期盼，而無法律正義。(C)正當防衛是為了抵抗當下的危險，而做的自保措施，此處非屬於正當防衛。
  tags:
