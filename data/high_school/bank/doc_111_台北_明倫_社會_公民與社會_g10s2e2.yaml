  stem: 少年由於身心尚未完全成熟，加上社會歷練不足，遭遇衝突難免行為衝動，而有觸犯法規命令之事。為不影響因一時錯誤而造成「烙印」結果，符合下列哪一項條件者，可以「塗銷」前科紀錄？
  options:
  - label: A
    content: 張三風經少年法院轉介至「少年學園」福利機構安置完畢已滿一年
  - label: B
    content: 梅超鳳經少年法院裁定接受彰化輔育院感化教育完畢已滿二年
  - label: C
