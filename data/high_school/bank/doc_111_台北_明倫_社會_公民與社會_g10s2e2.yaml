  stem: 有關法律優越原則與法律保留原則的敘述，下列何者正確？(甲)法律優越原則是指一切行政行為均不得與法律相牴觸，亦即法律對行政行為有控制作用(乙)法律保留原則係指下級規範不得牴觸上級規範(丙)法律優越原則係指若無法律明文規定或授權，行政機關即不能合法的作成行政行為(丁)當駕駛人紅燈右轉時，交通警察對該違規者開處罰單，必須有法律規定或授權，這是法律保留原則的要求(戊)若財政部自行訂定行政規則，免除所有國民繳納所得稅，即與《所得稅法》相牴觸，則該行政規則之規定無效，此屬於法律優越原則
  options:
  - label: A
