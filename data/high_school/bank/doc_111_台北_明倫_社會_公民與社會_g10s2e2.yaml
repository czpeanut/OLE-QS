  stem: 針對犯罪行為的發現之一的「告訴」，《刑法》又將其分為「告訴乃論」與「非告訴乃論」兩種。公民與社會課的老師詢問同學兩者的差異，哪一位同學解釋正確？
  options:
  - label: A
    content: 柯鎮：告訴乃論之罪的刑罰較重；非告訴乃論之罪的刑罰較輕
  - label: B
    content: 王神：告訴乃論之罪要向法院告訴；非告訴乃論之罪要向偵查機關告訴
  - label: C
    content: 南希：告訴乃論之罪可和解撤回告訴；非告訴乃論之罪無法原諒撤回告訴
  - label: D
    content: 韓寶：告訴乃論之罪是自訴；非告訴乃論之罪是公訴
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)一般來說應當是告訴乃論的罪比較輕，非告訴乃論之罪比較重。(B)告訴乃論之罪可向檢察機關或法院提出告訴；非告訴乃論之罪除了告訴之外，也可由第三人告發或其他方法讓檢察官知悉，便會開始進行偵查程序。(D)公訴為檢察官偵查結束後，起訴犯罪嫌疑人，稱為公訴。
