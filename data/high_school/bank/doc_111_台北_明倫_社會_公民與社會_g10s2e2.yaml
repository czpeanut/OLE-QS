  stem: 隨著外在社會環境的變遷，法律同時也會跟進修訂內容。為因應科技發展、電腦使用之頻繁，我國《刑法》於 2003 年增訂「妨害電腦使用罪」，規範相關犯罪行為。透過修法，網際網路衍生出的盜用、入侵等問題正式明文規定為犯罪行為，而非適用過去竊盜罪的定義，可稱之為□□。請根據上文，下列何者為□□正確的敘述？
  options:
  - label: A
    content: 除罪化，要求法律不得溯及既往
  - label: B
    content: 除罪化，且必須遵守從舊從輕原則
  - label: C
    content: 入罪化；要求法律不得類推適用
  - label: D
    content: 入罪化；必須符合習慣法的適用
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)將過去刑法沒有處罰的行為納入《刑法》，屬於入罪化。同時罪刑法定主義要求法律必須明確、不得溯及既往、禁止類推適用、禁止習慣法等。(D)不得適用習慣法。
