  answer_status: verified
  answer_source: answer_key
  explanation: 公法人為具有公法上權利能力，負擔公法上義務的法人團體，目前公法人的類型有國家、地方自治團體，及其他公法人，例如：農田水利會，故選(C)。(A)高雄市政府為行政機關，非地方自治團體。(B)為社團法人。(D)為學校，非地方自治團體；公立學校應屬行政機關，私立學校應屬財團法人。
