  answer_status: verified
  answer_source: answer_key
  explanation: 題文提到，小華為小學一年級，可知其為無責任能力人，《刑法》上的行為不罰，故選(C)。(A)讓人受傷，觸犯《刑法》傷害罪。(B)不會由法定代理人代為負責刑事責任。(D)傷人行為屬於《刑法》範疇。
