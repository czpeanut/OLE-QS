- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某立法委員欲連署提出《民法》修正案，降低繼承制度中特留分的比例，試問下列何者最可能是該立法委員推動修法的原因？
  options:
  - label: A
    content: 為了保障繼承人不致因繼承大筆債務而使生活陷入因境
  - label: B
    content: 為了保障被繼承人生前的意願及其自由處分財產的權利
  - label: C
    content: 為了避免被繼承人生前規避債務，使其債權人求償無門
  - label: D
    content: 為了避免法定繼承人因被繼承人死亡而使生活陷入困境
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 特留分原本是保障繼承人的生活，避免因為遺囑，而導致完全分不到遺產而使生活陷入困頓，但因為時代變遷，立委提出修法要降低特留分的保障，主要是為了保障被繼承人的生前意願，故本題選(B)。(A)目前以限定繼承為主，原則上不會繼承大筆債務使生活陷入困頓。(C)特留分規定主要是保障法定繼承人，與規避債務無關。(D)此為當時設立特留分的原因之一。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 新聞報導指出，2024 年基本工資將再調漲，月薪從 2023 年的 26,400 元，調漲至 27,470 元；時薪則從 176 元調高至 183 元。關於《勞動基準法》中工資與基本工資之規定，下列何者較為正確？
  options:
  - label: A
    content: 為保障勞工權益與促進經濟發展，政府每年皆會微幅調漲基本工資
  - label: B
    content: 勞工可組織工會，並透過工會與資方協力，要求政府調高基本工資
  - label: C
    content: 基於私法自治的精神，勞資雙方磋商後約定的薪資不受《勞基法》約束
  - label: D
    content: 基本工資之規定限制了契約自由，乃是為平衡勞資雙方間的不對等
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)並非是每年皆會調漲基本工資，而是召開會議審議。(B)資方通常與勞方立場不同，調高基本工資會使資方利潤減少，資方通常不會支持調漲基本工資。(C)不得違反《勞基法》規定，屬於對契約自由的限制。故本題選(D)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 大雄與小夫對種植水果相當有興趣，他們都有種植蘋果及芭樂，其生產可能曲線如右圖所示。從圖形中判斷，下列敘述何者最為適當？
  options:
  - label: A
    content: 不論是大雄還是小夫的生產可能曲線，都具有機會成本遞增的概念
  - label: B
    content: 若大雄與小夫要分工，依據絕對利益原則，小夫應較適合種芭樂
  - label: C
    content: 大雄雖在種植蘋果上具有比較利益，但在種植芭樂上則具有絕對利益
  - label: D
    content: 大雄與小夫分工合作，則兩人都應生產 E 點的生產可能組合
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 378.7
      - 373.5
      - 564.3
      - 525.3
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)兩者 PPC 皆為直線，故皆為機會成本不變。(C)大雄在種植芭樂上並無絕對利益。(D)依據絕對利益的法則，大雄應當生產蘋果、小夫應當生產芭樂。故本題選(B)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 原本甲、丙兩國均由乙國進口晶片，但乙國國內發生嚴重洪災後，甲、乙兩國轉而向丙國進口晶片。關於甲、乙、丙三國生產晶片的比較利益，以下何者正確？
  options:
  - label: A
    content: 洪災發生前，甲國最具有比較利益
  - label: B
    content: 洪災發生前，丙國最具有比較利益
  - label: C
    content: 洪災發生後，乙國最具有比較利益
  - label: D
    content: 洪災發生後，丙國最具有比較利益
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)洪災發生前，向乙國進口晶片，可知最具比較利益應當為乙國。(C)洪災發生後轉向丙國進口晶片，可知此時丙國最具有比較利益。故本題選(D)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 甲跟乙簽訂房屋買賣契約，並收了乙 10 萬元訂金。兩天後，甲又跟丙簽訂同一間房屋的買賣契約，由於丙一次付清房款，所以甲立刻辦理房屋移轉登記給丙。當乙知悉此事，遂要求丙返還房屋。試問下列效述何者較為正確？
  options:
  - label: A
    content: 基於所有權直接支配性，甲如何處理房屋是甲的權利
  - label: B
    content: 基於所有權絕對性，乙得要求丙返還房屋
  - label: C
    content: 基於所有權排他性，房屋所有權人有乙和丙
  - label: D
    content: 基於所有權優先性，房屋所有權人只有丙
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由題文可知，所有權已移轉至丙，甲對於房屋並沒有直接支配權。(B)(C)由題文得知交易並未完成，乙並無房屋所有權，但乙得請求甲加倍返還訂金。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 某國生產稻米與汽車兩項產品，其生產可能曲線如右圖所示。因為技術進步使得生產可能曲線從原本的 $PPC_{1}$ 變成 $PPC_{2}$。下列哪個敘述最為正確？
  options:
  - label: A
    content: 丁點在技術進步前具有生產效率，在技術進步後則不具生產效率
  - label: B
    content: 在技術進步之前，若稻米漲價，最佳生產組合會由丙點移到甲點
  - label: C
    content: 在技術進步前，乙點不具生產效率，甲點及丙點則都有生產效率
  - label: D
    content: 不論是技術變動之前或之後，乙點及戊點皆為無法達成的生產組合
  assets:
  - key: s1_6_f1
    kind: figure
    file: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1/s1_6_f1.png
    crop:
      page: 2
      rect:
      - 395.6
      - 51.4
      - 564.3
      - 191.3
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)丁點在技術進步前，為當時 PPC 外的點，為當時無法達到的生產組合。(B)稻米漲價，其他條件不變之下，代表利潤應當會較多，生產組合應當會由甲移到丙。(D)戊點才是都無法達到的產品組合。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 小花工作多年後，終於在新北市買了一間新房子，她為了布置家裡，親自到美滿家具行選購家具，約定送貨日期並完成付款後離去。但當家具送達新房子後，小花覺得自己太衝動，認為應該請設計師來設計居家空間才對。因此以「猶豫期」的規定，向家具行要求退貨，遭家具行拒絕。請問依據我國相關法律的規定，下列哪一項述較為適當？
  options:
  - label: A
    content: 店家應基於《消費者保護法》中「瑕疵擔保責任」的規定同意小花退貨
  - label: B
    content: 小花的家具是在家具行購買，因此不適用《消費者保護法》的猶豫期保障
  - label: C
    content: 店家拒絕退貨的行為，對消費者顯失公平，違反《消費者保護法》的規定
  - label: D
    content: 《消保法》中規範的猶豫期「合理例外情事」並無包含家具，因此小花可主張退貨
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此案例可以看到產品並無瑕疵，店家無須負擔瑕疵擔保責任。(C)由題文可知並無顯失公平的情事。(D)實體店家購買，並無猶豫期的保障。故本題選(B)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 知名藝人日前與先生簽字離婚，在節目上分享離婚經歷。說自己結婚後與先生漸行漸遠，最後決定離婚。蔚萊跟學校朋友討論這個新聞，請問下列何者的敘述較符合我國現行的法規制度？
  options:
  - label: A
    content: 蔚萊：還好政府有強制要求有工作的一方要給沒工作的一方自由處分金
  - label: B
    content: 小銘：自由處分金好像只能用在家庭的開銷支出上，跟零用錢不太相似
  - label: C
    content: 大方：雖然有規定剩餘財產分配制度，但這個好像夫妻有去登記才適用
  - label: D
    content: 正正：還有一個婚後財產報告的義務，主要是避免分配請求權受到侵害
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)自由處分金並無此規定與要求。(B)自由處分金為專供配偶自行運用，並非只能運用在家庭生活支出。(C)剩餘財產差額分配制度為法定財產制，無須至法院登記。(D)正解。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '下表是某間科技公司在生產不同產品時的生產組合配置表，這些生產組合都位於這間公司的生產可能曲線的線上。由此來看，下列哪個說法最為正確？

    | 生產組合 | A 組合 | B 組合 | C 組合 | D 組合 | E 組合 | F 組合 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 手機（千支） | 0 | 6 | 11 | 15 | 18 | 20 |

    | 平板電腦（千臺） | 5 | 4 | 3 | 2 | 1 | 0 |'
  options:
  - label: A
    content: 手機增產的機會成本不會遞增，因此每次增產，平板電腦都減少 1 千臺
  - label: B
    content: 若生產 6 千支手機時，平板電腦僅生產 3 千臺，代表資源可能遭到閒置
  - label: C
    content: A 組合沒有生產手機，F 組合沒有生產平板電腦，兩組合都不具生產效率
  - label: D
    content: 若生產 2 千 5 百臺平板電腦時，該公司最多可同時生產 1 萬 5 千支手機
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A) A 至 B 組合，平均每支手機的機會成本為 1∕6，一直到 E 至 F 組合，平均每支手機的機會成本為 1∕2，可知機會成本遞增。(B) 6 千支手機依據產品組合可知應可生產 4 千臺平板電腦，若只生產 3 千臺平板可知應有資源遭到閒置。(C)只要是 PPC 線上的產品組合，都是最有效率的，只是取捨的問題。(D)由表可知，若生產 2,500 臺平板，生產組合位於 C、D 之間，每支手機約可生產 1,300 臺。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 阿明平日努力工作，賺錢養家餬口，年長的雙親、妻子與兩個小孩都與他感情很好。某日他外出購物，竟遭到酒駕人士追撞，當場死亡，而阿明生前沒有立遺囑，家人們悲慟不已。請問接下來的情況，何者正確？
  options:
  - label: A
    content: 阿明的法定繼承人必須去辦理遺產繼承，否則無法繼承遺產
  - label: B
    content: 妻子會繼承得比女兒與兒子多，此為我國法定繼承的規定
  - label: C
    content: 依據《民法》規定，阿明的雙親可主張特留分而繼承阿明的遺產
  - label: D
    content: 回歸法定繼承原則，理論上妻子與兩個小孩可以平分遺產
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)我國為當然繼承主義，無須辦理繼承。(B)依據《民法》規定，妻子與兒女將平分遺產。(C)血親繼承當中已有直系血親卑親屬，阿明的父母親依據有前無後的原則，並無繼承權。(D)正解。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 小光曾摘述某篇專文的敘述做為延伸探究的佐證：「砂糖曾經是臺灣重要的對外貿易商品，17 世紀荷蘭人就已開啟臺日的蔗糖貿易，道光年間臺灣糖銷路減少價格下跌，糖商虧本歇業，放棄種蔗而轉種地瓜的農民也增加。一直到約 1860 年左右糖價漸漸好轉，各地農民又競相投入甘蔗種植，投入製糖的工人也增加。」請問下列何者最可能是小光的探究的主題？
  options:
  - label: A
    content: 價格誘因對資源分配的影響
  - label: B
    content: 成本效益分析下的政府決策
  - label: C
    content: 市場經濟制度下的風險管理
  - label: D
    content: 生產技術改變下的生產可能
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，由種植甘蔗轉為種植地瓜又轉而種植甘蔗，是因為價格的因素，因此本題選(A)。(B)題文並無提到成本效益分析。(C)此處並非是風險管理，而是價格因素。(D)此處與生產技術改變無關。
