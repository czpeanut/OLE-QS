  stem: 早期，繼承的規定是負無限清償責任的概括繼承，也就是繼承權人一旦沒有拋棄繼承，那麼所有被繼承人財產上的權利義務都一併承受。2009 年修法後，改採有限清償模式的「限定繼承」，如果被繼承人的債務超過遺產，超過的部分就不由繼承權人承擔。如此雖有利繼承人，避免父債子還的問題，卻也讓債權人的權利受到損害。對此，法律上設有哪一項規定，以保障被繼承人的債權人？
