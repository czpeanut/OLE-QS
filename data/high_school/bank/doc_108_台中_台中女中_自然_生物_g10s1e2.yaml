  stem: 根據本文，請問蠶豆症疾病的原因為何？（單選）
  options:
  - label: A
    content: 體染色體隱性遺傳疾病
  - label: B
    content: 體染色體顯性遺傳疾病
  - label: C
    content: 性染色體隱性遺傳疾病
  - label: D
    content: 與遺傳無關，因飲食造成
  group_stem: '蠶豆症又名G6PD缺乏症，因為患者體內缺少一種稱為G6PD的酵素活性。此種酵素是人體內用來生產參與抗氧化反應中，一種重要物質NADPH的酵素。G6PD的基因位於X染色體上，擁有變異G6PD基因的同型合子個體，不僅在食用蠶豆時會有溶血的危險，在使用一些奎寧類藥物時，也會有溶血的情形發生。

    在<u>臺灣</u>的客家族群中，G6PD缺失的基因出現的頻率相當高，很多的客家人為此缺失基因的攜帶者，所以G6PD酵素的活性檢測是以列入<u>臺灣</u>地區新生兒基因篩檢的正規項目中。當父母雙方的家族成員中有蠶豆症的病史者時，最好在進行生育計畫前進行遺傳諮商，了解此種疾病的成因與應注意事項。 （資料來源：東吳大學網路講義http：//microbiology.scu.edu.tw/lifescience）'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
