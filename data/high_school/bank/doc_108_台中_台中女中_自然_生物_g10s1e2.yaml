- id: doc_108_台中_台中女中_自然_生物_g10s1e2_s3_36
  section: 3
  number: 36
  type: single
  page: 4
  stem: 本文主要在強調下列何種概念？
  options:
  - label: A
    content: 細胞老化與染色體套數的關係
  - label: B
    content: 肝細胞具有多套染色體的現象及意義
  - label: C
    content: 小鼠及人類肝細胞的差異
  - label: D
    content: 肝細胞如何使染色體套數增加的方式
  group_stem: '科學家發現幾乎所有哺乳類動物的肝臟中，同時具有單核與雙核的肝細胞，且其細胞核中的染色體套數，除了一般體細胞的二倍體（2n）外，還常有四倍體（4n）、八倍體（8n）、十六倍體（16n）或更多的多倍體細胞核。在一般的細胞中，若染色體套數過度增加（advanced polyploidy），常代表該細胞處於衰老或極度分化的狀態，但肝細胞的「多倍體化（polyploidization）」卻是正常的現象。例如：在剛出生的小鼠體內，其肝細胞全數皆為二倍體細胞，在斷奶後部分肝細胞開始進行多倍體化，當成長為成鼠時，只剩10%肝細胞為二倍體細胞，70%的肝細胞為四倍體細胞，20%的肝細胞為八倍體細胞，而在多倍體細胞中（一個細胞所含的染色體超過兩套），20～30%的細胞為雙核細胞（具兩個2n或兩個4n的細胞核）。雙核細胞可能是行細胞分裂時，沒形成收縮環（contractile ring），而無法完成細胞質分裂（cytokinesis），最後產生了雙核二倍體（2 × 2n）細胞。人類的多倍體肝細胞比例較小鼠低，成人肝細胞中約有20～30%為多倍體細胞。

    無論是多核或多倍體細胞，其細胞內所含的染色體含量比一般單核二倍體細胞多，可透過數量較多的基因經轉錄與轉譯，產生更多量的蛋白質產物，例如：更大量的酵素，可增加該細胞生理代謝的效率，進而可使細胞質量與體積增加，另一方面，增加細胞內基因的數量，可降低因基因突變而造成損害的機率；多倍體就像是具有許多基因備胎，當部分基因突變而失去功能，仍有多餘的基因可以運作；例如：肝細胞在進行解毒作用時（detoxification）可能產生大量過氧化物與其他代謝產物，這些物質可能引發細胞死亡或基因突變，導致肝細胞轉變成癌細胞，而多倍體細胞的染色體數目較多，就可作為備胎而保護細胞免於死亡或癌化。〈摘錄自科學教育月刊〉'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
