questions:
- id: doc_111_新北_新北高中_數學_數甲_g12s1e2_s1_1
  section: 1
  number: 1
  type: calc
  page: 1
  stem: '對於多項式函數 f（x），下列敘述對的打「○」，錯的打「╳」。

    (1)（ ）若 f（x）為三次函數，則必定找得到一實數 a，使得 f''''（a）＝0。

    (2)（ ）若對於任意實數 x，f''（x）$\geq$0 恆成立，則函數 f（x）沒有極值。

    (3)（ ）若 f''(2)＝0，則 f（x）在 x＝2 處有極值。

    (4)（ ）在區間 [ 1，8 ] 中，f（x）必有最大值與最小值。

    (5)（ ）若 f''''(5)＝0，則（5，f(5)）為 f（x）的反曲點。'
  answer:
  - (1)○；(2)╳；(3)╳；(4)○；(5)╳
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)○：f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d$\Rightarrow$f''（x）＝$3ax^{2}$＋2bx＋c$\Rightarrow$f''''（x）＝6ax＋2b

    必有 x＝$-\frac{2b}{6a}$＝$-\frac{b}{3a}$，使得 f''''（x）＝0

    (2)╳：設 f（x）＝k$\Rightarrow$f''（x）＝0$\geq$0 恆成立，但 f（x）的極值為 k

    (3)╳：設 f（x）＝（x－2）$^{3}$，f''（x）＝3（x－2）$^{2}$

    $\Rightarrow$f''(2)＝0，但 x＝2 處不為極值

    (4)○：由極值定理知，連續函數 f（x）在閉區間 [ a，b ] 必有最大值與最小值

    (5)╳：設 f（x）＝（x－5）$^{4}$，f''''(5)＝0，但（5，f(5)）不為反曲點'
  tags:
    unit:
      code: MA-J1-2-2
      book: 選修數學甲（上）
      chapter: 微分
