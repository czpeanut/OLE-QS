- id: doc_111_新北_新北高中_數學_數甲_g12s1e2_s1_2
  section: 1
  number: 2
  type: calc
  page: 1
  stem: '設三次函數 $f(x) = ax^3+bx^2+cx+d$ 的圖形當 $x \to \infty$ 時趨向 $+\infty$（$a>0$），圖形有兩個極值點，反曲點在 $y$ 軸左側，與 $y$ 軸交於負向，且在 $x=0$ 處的切線斜率為負。下列敘述對的打「○」，錯的打「╳」。

    (1)（ ）$b$ 為正數。

    (2)（ ）$c$ 為正數。

    (3)（ ）$d$ 為正數。

    (4)（ ）$b^2 - 3ac > 0$。

    (5)（ ）$f(x)$ 沒有通過原點的切線。'
  answer:
  - (1)○；(2)╳；(3)╳；(4)○；(5)╳
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: MA-J1-2-2
      book: 選修數學甲（上）
      chapter: 微分
      title: 函數性質的判定
      std: true
    textbook: 選修數學甲（上） 函數性質的判定
    pattern:
      key: MA-J1-2-2:T02
      name: 反曲點與圖形對稱中心
    labeled_by: agent
    label_confidence: high
    label_note: 題目提及「圖形如右」但缺附圖，無法作答
    fixed_by: agent
    fix_note: （人工修正：補充三次函數圖形特徵取代缺圖並補齊解析）
  difficulty: 3
  explanation: (1) ○：反曲點 $x = -\frac{b}{3a} < 0$ 且 $a>0$，故 $b>0$。(2) ×：$f'(0) = c < 0$。(3) ×：$f(0) = d < 0$。(4) ○：有兩相異極值點故 $f'(x)=3ax^2+2bx+c=0$ 判別式大於 0，即 $b^2-3ac>0$。(5) ×：過原點切線條件 $2at^3+bt^2-d=0$ 為三次方程式，必至少有一實根。
