  group_stem: '(一)請閱讀下列資料後回答問題： 資料一：『明朝第一清官海瑞，一生主張「要天下治安，必須行井田制，其次應行限田制，再其次也應行均稅制」。他做過一任浙江淳安縣知縣，做過半年應天十府巡撫。(海)瑞本著均稅的主張，在知縣巡撫任上創行一條鞭法。所謂一條鞭，就是清丈地畝，按畝徵銀，令田主缴納一定數量的銀，所有田賦差役各種雜費包括在内，官募人充役，不再攤派。這種辦法，對無田貧民確有利益。』 資料二：『張居正積極推廣在某些地方試行並取得成效的一條鞭法，後來更下令在全國推廣。他改革的出發點，是為了簡便賦役徵收，加強對賦役的控制和徵收，具有政府財政上的意義。一條鞭法把以往繁雜的賦役名目刪繁就簡，合為一則，這實際上又把萬曆以前的各種合法與不合法的加徵雜派都變成了正稅，雖然一條鞭法均平了賦稅和簡化了手續，但雜派變成正稅，實際上又為以後的加稅製造了機會。』

    資料出處：范文瀾著，《中國通史簡編》：傅衣凌編，《明史新編》'
