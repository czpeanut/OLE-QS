- id: doc_110_高雄_高雄中學_自然_物理_選修物理II_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: '氣體間的化學反應要生成，必須氣體分子間發生碰撞，除此之外，為保證反應能發生，還需分子具有足夠大的動能，才能破壤原先分子的化學鍵，原子重新排列組合成新的分子。反應分子需要使化學反應發生時須具有的最低動能被稱為活化能（$E_{a}$）。以氧氣（$O_{2}$）和氮氣（$N_{2}$）化合成一氧化氮（NO）的反應為例，如果一個$O_{2}$分子和一個$N_{2}$分子具有的總動能低於活化能，即使此兩分子發生碰撞，它們不可能將原先分子拆開，不能重新組合成NO，只能彼此彈開。在此碰撞過程中，能量可能由一個分子轉移到另一個分子，但化學反應不會發生。但如果它們具有足夠大的能量，也就是總動能高於活化能時，那麼這化學反應就可能會發生，但並不一定發生。這是因為不同的碰撞角度，可以被分子吸收的動能不同，造成雖然總動能高於活化能，化學反應仍不一定發生。

    化學反應的速率會受溫度的影響，這與氣體分子速率分布會受溫度影響有關。氣體在較高溫時，分子的平均動能較高，分子碰撞具有超過活化能的比例也較大。而且當溫度升高時，分子方均根速率也會增加，在單位時間內氣體分子碰撞次數隨之增加。這就造成在較高溫度時反應速率較高。

    下列敘述中，哪一個為正確的選項？'
  options:
  - label: A
    content: 在相同溫度時，同一種類之氣體分子皆具有相同動能
  - label: B
    content: 溫度升高後，各種速率之氣體分子數目均增加
  - label: C
    content: 只要兩分子的總動能大於化學反應的活化能，兩分子發生碰撞時，化學反應必定會發生
  - label: D
    content: 溫度很高時，所有分子的動能均足以克服活化能
  - label: E
    content: 溫度愈高，分子碰撞具有超過活化能的比例也愈大
  group_stem: '<u>第1-2題為題組</u>

