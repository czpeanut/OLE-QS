  stem: 平面坐標上，下列哪個不等式組為右圖中陰影部分（含邊界）？
  options:
  - label: A
    content: $\begin{cases}2x\geq y \\ 4x+5y\geq 18 \\ 3x-7y\geq 11\end{cases}$
  - label: B
    content: $\begin{cases}2x\geq y \\ 4x+5y\leq 18 \\ 3x-7y\leq 11\end{cases}$
  - label: C
    content: $\begin{cases}2x\leq y \\ 4x+5y\geq 18 \\ 3x-7y\geq 11\end{cases}$
  - label: D
    content: $\begin{cases}2x\leq y \\ 4x+5y\geq 18 \\ 3x-7y\leq 11\end{cases}$
  - label: E
    content: $\begin{cases}2x\leq y \\ 4x+5y\leq 18 \\ 3x-7y\geq 11\end{cases}$
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_112_雲林_虎尾_數學_g10s1e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 570.0
      - 116.2
      - 675.6
      - 215.65
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 因為陰影的部分於2x＝y的右半平面 ( 含邊界 )，4x＋5y＝18的左半平面 ( 含邊界 )，3x－7y＝11的左半平面 ( 含邊界 )，所以$\begin{cases}2x\geq y \\ 4x+5y\leq 18 \\ 3x-7y\leq 11\end{cases}$，故選(B)。
- id: doc_112_雲林_虎尾_數學_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 過點P (－3 , 5 ) 作圓$x^{2}$＋$y^{2}$＝34的切線，求切線？
  options:
  - label: A
    content: 3x＋5y＋34＝0
  - label: B
    content: 3x－5y－34＝0
  - label: C
    content: 3x－5y＋34＝0
  - label: D
    content: 3x＋5y－34＝0
  - label: E
    content: 不只一條
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '設圓心為M ( 0 , 0 )，過點P的切線為L，因為 (－3 )$^{2}$＋$5^{2}$＝34，所以P點位於圓上，又$m_{\overrightarrow{MP}}$＝－$\frac{5}{3}$， 所以$m_{L}$＝$\frac{3}{5}$ ⇒ L: y－5＝$\frac{3}{5}$( x＋3 ) ⇒ 3x－5y＋34＝0，故選(C)。'
- id: doc_112_雲林_虎尾_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 下列敘述哪些正確？
  options:
  - label: A
    content: 直線3x＋2y＋6＝0的斜率為負數
  - label: B
    content: 直線3x＋2y＋6＝0的y截距為3
  - label: C
    content: 將直線3x＋2y－5＝0鉛直向上平移1單位後可得直線：3x＋2 ( y＋1 )－5＝0
  - label: D
    content: 將直線：3x＋2y－5＝0水平向右平移1單位後可得直線：3 ( x－1 )＋2y－5＝0
  - label: E
    content: 三直線$L_{1}$：y＝$\frac{1}{3}$x＋$\frac{2}{3}$，$L_{2}$：x＋2y－3＝0，$L_{3}$：( y－1 )＝－3 ( x－1 ) 可圍成一個直角三角形
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：3x＋2y＋6＝0的斜率為$\frac{-3}{2} < 0$。 (B) ×：x＝0代入3x＋2y＋6＝0 ⇒ y＝－3，即y截距為－3。 (C) ×：將3x＋2y－5＝0向上平移1單位可得3x＋2 ( y－1 )－5＝0。 (D) ○：正確。 (E) ×：因為$L_{1}$, $L_{2}$, $L_{3}$交點於一點 ( 1 , 1 )，所以無法圍成三角形。 故選(A)(B)。
