  stem: 三次多項式函數f (x)＝$ax^{3}$＋$bx^{2}$＋cx＋d圖形的對稱中心為A (－1 , 5 )，局部看y＝f (x) 在x＝－1的圖形近似於直線 y＝2x＋7，廣域看y＝f (x) 的圖形會很接近y＝－$3x^{3}$的圖形，試求a＋b＋c＋d＝＿＿＿＿。
  answer:
  - －15
  answer_status: verified
  answer_source: answer_key
  explanation: 對稱中心 (－1 , 5 )， 設f (x)＝$ax^{3}$＋$bx^{2}$＋cx＋d＝a ( x＋1 )$^{3}$＋p ( x＋1 )＋5， 由題意知$\begin{cases}p (x+1)+5=2x+7 \\ a=-3\end{cases}$ ⇒ $\begin{cases}a =-3 \\ p =2\end{cases}$ 故f (x)＝$ax^{3}$＋$bx^{2}$＋cx＋d＝－3 ( x＋1 )$^{3}$＋2 ( x＋1 )＋5， 令x＝1 ⇒ a＋b＋c＋d＝－24＋4＋5＝－15。
