- id: doc_113_屏東_屏東高中_自然_物理_選修物理III_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 平靜的湖面上常可看到湖邊建築或樹木的美麗倒影，但在有浪的海面上卻只能看到海浪的起伏，而看不到岸邊物體的倒影，其原因為下列何者？
  options:
  - label: A
    content: 浪濤洶湧，容易造成色散
  - label: B
    content: 海水中含有鹽分，造成折射
  - label: C
    content: 海面遼闊無邊，容易使岸邊物體的影像全部透射入海中
  - label: D
    content: 海水折射率大於純水的折射率，造成全反射
  - label: E
    content: 海浪使海面不平坦，造成漫反射（漫射）
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_113_屏東_屏東高中_自然_物理_選修物理III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 游泳時戴上泳鏡，在水中可看清景物；若不戴泳鏡，即使是視力正常的人在水中，所看到的景物也模糊不清。不戴泳鏡時，無法看清水中景物的主要原因為下列哪一項？
  options:
  - label: A
    content: 在水中瞳孔會縮小，使進入眼睛的光線不足
  - label: B
    content: 在水中時，不戴泳鏡會比較緊張，無法集中精神
  - label: C
    content: 水分子會碰撞射向眼睛的光，使進入眼睛的光線不足
  - label: D
    content: 與光在空氣中傳播的情形相比，光在水中的傳播速率更接近光在眼睛內的傳播速率
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
