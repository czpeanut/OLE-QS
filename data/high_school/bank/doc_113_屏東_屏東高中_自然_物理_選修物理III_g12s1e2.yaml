  section: 3
  number: 31
  type: single
  page: 4
  stem: 力學常用的因次：[長度]＝L、[質量]＝M、[時間]＝T。則根據反氣泡中的空氣層厚度d的公式，溶液的黏度$\eta$的因次為何？
  options:
  - label: A
    content: $ML^{－1}T^{－1}$
  - label: B
    content: $LT^{－2}$
  - label: C
    content: $MT^{－2}$
  - label: D
    content: $MLT^{－2}$
  group_stem: '子瑜以燒杯、洗碗精、水、吸管、黏度計進行「反氣泡」實驗，整理報告時，寫出「反氣泡」形成的理論：含界面活性劑的水溶液由高處落下，靠近水面時，疏水端排斥水，使液滴與水面間夾一層空氣，隨著液滴下沉，此空氣層便包覆液滴隨之下沉，如圖所示。

    子瑜上網搜尋影響反氣泡中的空氣層厚度的因素，她查到關係式為：d＝$\frac{3\eta v}{r(\rho _{\ell}-\rho _{a})g}$，其中d為空氣層厚度、$\rho _{\ell}$為溶液的密度、$\rho _{a}$為反氣泡的氣體密度、$\eta$為溶液的黏度、r為反氣泡半徑、v為液滴碰觸液面時的速度、g為重力加速度'
  shared_asset: g3_31_32
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
