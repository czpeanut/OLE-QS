  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 設各項都是實數的等差數列 $a_{1}$，$a_{2}$，$a_{3}$，……之公差為正實數α。試選出正確的選項。
  options:
  - label: A
    content: 若 $b_{n}$＝－$a_{n}$，則 $b_{1}$＞$b_{2}$＞$b_{3}$＞……
  - label: B
    content: 若 $c_{n}$＝$a_{n}^{2}$，則 $c_{1}$＜$c_{2}$＜$c_{3}$＜……
  - label: C
    content: 若 $d_{n}$＝$a_{n}$＋$a_{n＋1}$，則 $d_{1}$，$d_{2}$，$d_{3}$，……是公差為α的等差數列
  - label: D
    content: 若 $e_{n}$＝$a_{n}$＋n，則 $e_{1}$，$e_{2}$，$e_{3}$，……是公差為α＋1 的等差數列
  - label: E
    content: 若 $f_{n}$ 為 $a_{1}$，$a_{2}$，……，$a_{n}$ 的算術平均數，則 $f_{1}$，$f_{2}$，$f_{3}$，……是公差為α的等差數列
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵α＞0 ∴$a_{1}$＜$a_{2}$＜$a_{3}$＜……

    又 $b_{n}$＝－$a_{n}$ ⇒ $b_{1}$＞$b_{2}$＞$b_{3}$＞……

    (B) ╳：反例：設 $a_{1}$＝－3，$a_{2}$＝－1，$a_{3}$＝1 ⇒ $c_{1}$＝9＞$c_{2}$＝1

    (C) ╳：$d_{n＋1}$－$d_{n}$＝（$a_{n＋1}$＋$a_{n＋2}$）－（$a_{n}$＋$a_{n＋1}$）＝$a_{n＋2}$－$a_{n}$＝2α

    得 $d_{1}$，$d_{2}$，$d_{3}$，……，是公差為 2α的等差數列

    (D) ○：$e_{n＋1}$－$e_{n}$＝（$a_{n＋1}$＋n＋1）－（$a_{n}$＋n）＝$a_{n＋1}$－$a_{n}$＋1＝α＋1

    得 $e_{1}$，$e_{2}$，$e_{3}$，……，是公差為α＋1 的等差數列

    (E) ╳：$f_{n}$＝$\frac{n 〔2a_{1}+(n -1) \alpha 〕}{2n}$＝$\frac{2a_{1}+(n -1) \alpha}{2}$

    ⇒ $f_{n＋1}$－$f_{n}$＝$\frac{2a_{1}+n\alpha}{2}$－$\frac{2a_{1}+(n -1) \alpha}{2}$＝$\frac{\alpha}{2}$

    得 $f_{1}$，$f_{2}$，$f_{3}$ 是公差為$\frac{\alpha}{2}$的等差數列

    故選(A)(D)'
