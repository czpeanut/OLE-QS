  explanation: '∵1＋2＋……＋$2^{k}$＝$\frac{1\times (2^{k+1}-1)}{2-1}$＝$2^{k＋1}$－1

    ∴$S_{n}$＝（$2^{1}$－1）＋（$2^{2}$－1）＋（$2^{3}$－1）＋……＋（$2^{n＋1}$－1）

    ＝（2＋$2^{2}$＋……＋$2^{n＋1}$）－（n＋1）

    ＝$\frac{2\times (2^{n+1}-1)}{2-1}$－（n＋1）＝$2^{n＋2}$－n－3

    故 $S_{10}$＝$2^{12}$－13＝4083'
