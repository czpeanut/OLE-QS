- id: doc_112_台中_興大附中_數學_g10s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 高一甲班有 50 位學生，期末考數學與英文兩科考試，皆有 25 格填空，每格 4 分，改完後統計發現數學成績最高分 80 分，全班平均 52 分，全距 68 分，中位數為 60 分，後來老師決定改變計分方式，每格以 5 分計算，由於英文成績表現理想，因此老師不改變計分方式，且調整前數學與英文成績的相關係數為 0.87，則下列哪些是正確的？
  options:
  - label: A
    content: 調整後的數學成績平均為 65 分
  - label: B
    content: 調整後的數學成績全距為 85 分
  - label: C
    content: 調整後的數學成績的中位數不變
  - label: D
    content: 調整後的數學成績標準差不變
  - label: E
    content: 調整後的數學與英文成績的相關係數比 0.87 大
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '令 x、y 分別表示調整前的數學、英文成績，x''、y'' 分別表示調整後的數學、英文成績

    調整前數學成績最高分為 80 分，調整後為 80×$\frac{5}{4}$＝100 分，未超過滿分

    ⇒ x''＝$\frac{5}{4}x$，y''＝y

    (A) ○：μ$_{x''}$＝$\frac{5}{4}$μ$_{x}$＝$\frac{5}{4}$×52＝65

    (B) ○：調整後數學全距為$\frac{5}{4}$×68＝85

    (C) ╳：調整後的中位數＝$\frac{5}{4}$×調整前的中位數＝$\frac{5}{4}$×60＝75

    (D) ╳：σ$_{x''}$＝$\frac{5}{4}$σ$_{x}$

    (E) ╳：∵$\frac{5}{4}$×1＞0 ∴調整後相關係數不變

    故選(A)(B)'
