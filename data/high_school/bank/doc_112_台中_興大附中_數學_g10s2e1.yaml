- id: doc_112_台中_興大附中_數學_g10s2e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: '觀察下列四組數據

    A：1，2，3，4，5；

    B：99，99，100，100，101，101，102，102，103，103；

    C：1，3，5，7，9；

    D：1，4，9，16，25；

    其標準差分別為σ$_{A}$，σ$_{B}$，σ$_{C}$，σ$_{D}$，下列哪些正確？'
  options:
  - label: A
    content: σ$_{B}$＝2σ$_{A}$
  - label: B
    content: σ$_{C}$＝2σ$_{B}$
  - label: C
    content: σ$_{D}$＝σ$_{A}^{2}$
  - label: D
    content: σ$_{D}$＝σ$_{C}$
  - label: E
    content: σ$_{D}$＞σ$_{A}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '令 B''：99，100，101，102，103 ⇒σ$_{B''}$＝σ$_{B}$

    又 B''＝98＋A ⇒σ$_{A}$＝σ$_{B''}$，得σ$_{A}$＝σ$_{B}$

    C＝2A－1 ⇒σ$_{C}$＝2σ$_{A}$＝2σ$_{B}$

    數據 D 的離散程度大於 A、C，得σ$_{D}$＞σ$_{A}$ 及σ$_{D}$＞σ$_{C}$

    μ$_{A}$＝$\frac{1+2+3+4+5}{5}=3$，μ$_{D}$＝$\frac{1+4+9+16+25}{5}=11$

    σ$_{A}$＝$\frac{1}{5} 〔(1-3)^{2}+(2-3)^{2}+(3-3)^{2}+(4-3)^{2}+(5-3)^{2}〕$＝$\frac{10}{5}$＝2 ⇒ σ$_{A}^{2}$＝4

    σ$_{D}$＝$\frac{1}{5} 〔(1-11)^{2}+(4-11)^{2}+(9-11)^{2}+(16-11)^{2}+(25-11)^{2}〕=\frac{372}{5}$

    ∴σ$_{D}$≠σ$_{A}^{2}$

    故選(B)(E)'
