  page: 1
  stem: 歐洲某區域傳統景觀為：「在一望無際的平原中，田疇連綿不斷。每戶農家都把田地分成 3 塊，以人力輔以牛隻及簡單工具耕種，在細小的田地以耕種和畜牧維生，田塊多為長條形，分別栽種小麥、燕麥、大麥，或放牧牲畜；農民大多集居於田疇中央的聚落。」有關該區域的敘述，何者正確？
  options:
  - label: A
    content: 最可能出現在溫帶海洋性氣候區
  - label: B
    content: 分成 3 塊的目的是降低生產風險
  - label: C
    content: 田地呈長條形是為了便於施肥
  - label: D
    content: 因為治安不佳，農民集居共同禦盜
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)溫帶大陸氣候區多進行混合農業，田分 3 塊可降低生產風險，一塊種小麥、一塊種飼料作物、一塊休耕做為畜牧區。
