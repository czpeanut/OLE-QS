    31.4 國均為東歐國家，主要為(C)多瑙河的流域範圍。

    32.東歐國家人均所得低，工資水平也較低，適合做為歐盟地區的(B)生產基地。

    33.測站 A 最高溫＜10℃，應為苔原氣候─戊；測站 B 年溫差小，終年有雨，為溫帶海洋性氣候─甲；測站 C 夏乾冬雨，為溫帶地中海型氣候─乙；測站 D 夏熱有雨，冬溫＜0℃，為溫帶大陸性氣候─丙。故選(D)。

    34.(A)甲：溫帶海洋性氣候因暖流及西風調節，冬溫較同緯度高，屬於正偏差地區。

    35.地衣即為(D)戊：苔原氣候區植被。

    36.照片中作物為棉花，適宜在高溫處生長，故僅以氣溫考量，則圖中(A) 1 緯度最低最適合。

    37.藍香蕉為自英國往荷比盧、法國、德國延伸至義大利北部，皆為文化悠久的國家，故選(B)。(A)(C)(D)英國已脫離歐盟，且未加入申根區，也沒發行歐元。

    38.(A)黃金香蕉則為濱地中海地區範圍，屬於陽光帶。

    39.(B)(甲)專案補助與(丙)邊界合作區，均是為縮小區域差距所進行的經濟政策。

    40.法國國旗為(B)藍、白、紅 3 色，分別代表「自由、平等、博愛」。

    41.(A)羅馬尼亞原本就不在申根區裡。

