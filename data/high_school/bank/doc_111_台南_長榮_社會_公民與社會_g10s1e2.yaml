  stem: 請問：據三案的投票内容與结果，列敘何者正确？
  options:
  - label: A
    content: 皆屬於全國性公投，且全國性公或人民團體提出
  - label: B
    content: 核養綠性為立法原的創制：性平教育為重大政策的複决
  - label: C
    content: 顯示公投通意票大於不同意票，且總投票率須過半
  - label: D
    content: 投案利通過後，目前仍無法強制要求政府落實公投之結果
  group_stem: '(一)我國公投雖從2004年開始實施，為提高投票率，全國性公投皆與選舉日舉辦，但過去公投因門檻過高經常無法順利通過，被戲稱「烏籠公投」。因此《公民投票法》在2017年底修法通過，修法後第一次公投就綁著九合一大選，一共有十個提案，最後結果中央選舉委員公告投票結果。以下是其中三案的投票內容與結果。

    此次公投十个提案一共通過七个提案，比屆公投通過的總數多，有學者分析是《公投法》將過去鳥麓綁，例如：提案、連署及通過門檻降低，投票年齡下降至十八歲等。不過也衍伸很多問題，如公投提案、投綁大選時間過少，致開票與投票同時進行的爭議、死人連署爭等，還有待政府去探討解决答下列問題：'
  shared_asset: g2_45_46
