questions:
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 據臺北市都發局公布資訊顯示，東明社會住宅基地前身為臺肥出租國宅，為臺北市首個由出租國宅完成改建的案例，地點鄰近「三鐵共構」的南港車站，附近還有南港行政中心、北部流行音樂中心，以及兩所小學，整體生活機能便利。關於上述提到的社會住宅，下列敘述何者正確?
  options:
  - label: A
    content: 政府興建只租不售的住宅，租金較便宜
  - label: B
    content: 提供租屋者急難救助金，縮減貧富差距
  - label: C
    content: 為社會保險的一種，可促使所得重分配
  - label: D
    content: 主要針對在職勞動者，給予一次性補貼
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 利比亞強人格達費是個獨裁者，靠著親信掌握軍政大權，鐵腕統治利比亞42年，直到2011年內戰爆發，敗給獲得北約支持的反對勢力並喪生。不過，格達費遭推翻之後，利比亞的局勢陷入動盪，甚至爆發第二次內戰，許多利比亞人試圖逃到歐洲生活；有些利比亞人則懷念起格達費主政時期，認為當時的經濟狀況相對富裕、穩定。請問：下列關於民主國家與非民主國家的敘述,何者正確？
  options:
  - label: A
    content: 非民主國家有專業官僚負責行政,民主國家則沒有
  - label: B
    content: 民主國家需要人民參與，非民主國家則統治人民
  - label: C
    content: 非民主國家的政局較穩定，政府施政也較有效率
  - label: D
    content: 非民主國家雖然會箝制自由，但會保障公民權利
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 選舉就是指人民基於自由意志，依法選出一個或少數人擔任政府職位的一種過程。選舉所蘊涵的功能，下列何者正確(甲)具體落實自由權；（乙)體現主權在民；(丙)是公民與人民公僕締結「政治契約」的方式；(丁)實踐責任政治。
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 甲乙丁
  - label: D
    content: 甲乙丙丁
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列何者為社會福利的基本目的？
  options:
  - label: A
    content: 增進國力
  - label: B
    content: 滿足人民「從搖籃到墳墓」歷程中的社會福利與社會政策
  - label: C
    content: 保障每個人基本工作權
  - label: D
    content: 對於民意有求必應
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 太陽花學運後，在退出立法院後由林飛帆等人組織成立「島國前進」，其組織的宗旨如此寫道：「經歷過2014年春天，我們清楚認識到臺灣代議民主在現行體制下的殘破不堪，於是開始寄望以直接民權的落實來矯正、補充代議政治的不足。」請問：該組織的成立宗旨反映出何種意涵？
  options:
  - label: A
    content: 公民投票制度中民眾可以透過創制立法原則實現直接投票原則
  - label: B
    content: 島國前近所寄望的直接民權即是想藉由公民投票制度具體化
  - label: C
    content: 現行代議政治的不足是因無法直接由民意決定出代議士的缺失
  - label: D
    content: 直接民權的展現可以藉由罷免不適任公職人員的制度達到實現
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 我國社會保險制度源自1950年代開辦勞工保險，隨後推動公務人員保險、農民健康保險、就業保險、全民健康保險、國民年金等。請問：依據上述社會保險的發展過程，下列敘述何者正確？
  options:
  - label: A
    content: 現今社會保險制度是依據特定職業類別來劃分
  - label: B
    content: 保險保障對象從特定對象逐漸擴大至所有國民
  - label: C
    content: 社會保險大多以維持被保險人的老年生活為主
  - label: D
    content: 保費由被保險人給付走向國家、雇主共同承擔
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 總統蔡英文於8月28日宣布開放萊克多巴胺美豬進口，表示只要依行政命令就可以開放美萊豬進口，經過這幾年謹慎評估，她已責成相關部門，在保障國人健康前提下，訂定進口豬肉萊克多巴胺的安全容許值，並放寬30月齡以上美國牛肉進口。對此，在野黨立委主張，依《行政程序法》規定，訂定法規命令及行政規則,特別是涉及人民高度關注的議題，政府以舉行(1)以廣泛收集意見，目的是讓法規命令更周延。遇到爭議性大、或一時無法取得共識的法規命令，即使行政機關避談(1)，最起碼也應舉行(2)，而且更應該多次舉行。(1)與(2)雖然同屬為廣納公眾意見的機制，但相較於(2)(1)規定較為嚴謹;包括主持人選任、會議進行過程等皆有明文規定,至於(2)則無嚴格程序規定:(1)的結果對於相關政府決策具有一定拘束力，而(2)结果則無任何強制拘束效力(2020年)。關於前文指稱的(1)(2)，應為下列哪一種組合？
  options:
  - label: A
    content: 公聽會,說明會
  - label: B
    content: 聽證會、說明會
  - label: C
    content: 公聽會、聽證會
  - label: D
    content: 聽證會、公聽會
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 2019立委補選落幕，以新北市第三選區和臺南市第二選區選情最為人民關注，此兩席最终皆由民進黨拿下，但臺南市民進黨當選者僅獲得47%的票數，與第二名僅有3%差距，外界認為民進黨不算大勝。請問：關於此次立委補選的敘述，下列何者正確？
  options:
  - label: A
    content: 若以當選門檻區分，此選舉為絕對多數制
  - label: B
    content: 若以選舉名額區分,此選舉為單一選區制
  - label: C
    content: 此選舉制度將有利小黨及無黨獨立參選人
  - label: D
    content: 當選的區域立委任期為四年，得連選連任
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 新北市汐止區某食品公司在2019年5月3日發生70多名越南移工集體「罷工」事件，抗議公司苛扣工資和工時過長原本經新北市勞工局介入，獲得公司承諾補償4千多萬工資以及改善工作條件，但事後卻爆出僅少數人領到錢該公司更以「罷工造成訂單減少」、「業務緊縮」為由，無預警地將5名參與罷工的移工解僱。20日晚間移工再度發起罷工，並在21日由移工團體陪同前往新北市政府，要求勞工局協助處理。勞工局表示，除了要求該公司履行協議，把補償工資全數匯入移工帳戶外，也承諾會嚴格檢視是否有雇主宣稱的業務緊縮、訂單銳減等情形，同時也呼籲移工亦應循正常管道解決爭議。前文提及越南移工集體「罷工」的行動,支持與反對方各有不同主張。下列何者是支持方最能支持自己立場的論點？
  options:
  - label: A
    content: 工資待遇屬契約自由,若不滿意應以更換工作來改善
  - label: B
    content: 移工如果遭遇勞資糾紛，應依正常管道來解決爭議
  - label: C
    content: 移工需透過集體行動才能獲得團體聲援與政府介入
  - label: D
    content: 無論本國或外國勞工，都應該享有相同的公民權利
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 杏花村美麗風景吸引愈來愈多的觀光人潮，既有的公路已不足因應交通流量。當地政府提出三種交通發展備選方案。由於第一輪投票各方案未能超過半數，村民針對第一輪結果之前二名的方案再次進行第二輪投票，最後乙案獲得過半支持。請問：此時採二輪投票，主要基於下列何項考量？
  options:
  - label: A
    content: 相對多數治理
  - label: B
    content: 改善權力制衡
  - label: C
    content: 強化決策正當性
  - label: D
    content: 實現草根民主
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 2020年健保署統計我國健保短絀達負257億元。預估2021年將要再次調整健保費率，專家推測可能與民眾常有「大醫院比小醫院好」、「打針打點滴比吃藥有效」、「多逛幾家醫院、多看幾個醫生，病好的比較快」等錯誤觀念。請問：會出現健保短細現象可能的原因為何？
  options:
  - label: A
    content: 醫療資源不公平分配
  - label: B
    content: 醫療資源使用無效率
  - label: C
    content: 醫療分級制度的落實
  - label: D
    content: 未落實全民共同承擔
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「傑利蠑螈」(Gerrymandering）是指美國在1812年時，執政黨為獲得較多國會之議席，授權麻州州長傑利將選區劃分成如蠑螈般的形狀，最後雖獲得較少總票數却仍可獲得較多的席次。這種情形最容易出現在何種選舉制度？
  options:
  - label: A
    content: 單一選區絕對多數決制
  - label: B
    content: 複數選區相對多數決制
  - label: C
    content: 單一選區相多決制
  - label: D
    content: 比例代表制
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 第7次修憲將我國立法委員的選舉方式改為單一選區兩票制，這樣的作法將對臺灣地區的政黨政治造成何種影響？
  options:
  - label: A
    content: 小黨易失去競爭力
  - label: B
    content: 有助於不同理念政黨的興起
  - label: C
    content: 臺灣地區將走向多黨制的發展模式
  - label: D
    content: 目前的主要政黨可能因此式微
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 貧富差距的拉大，使M型社會的現象日益明顯。如果政府要採取社會安全措施，以减輕貧富差距的擴大，下列哪一項措施有助於達此一目標？
  options:
  - label: A
    content: 針對富人短期買賣房地產獲得高利潤者，課徵奢侈稅
  - label: B
    content: 補助菁英出國接受高等教育，回國後培養高科技產業
  - label: C
    content: 補助科技業的生產與研發，創造我國更高的產業價值
  - label: D
    content: 廢除國民年金，以減輕經濟弱勢族群繳納保費的負擔
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 依《社會救助法》第15條之1，各縣市政府評估低收入戶及中低收入戶需求，自行辦理或結合民間資源，辦理教育投資、就業自立、資產累積、社區產業、以及其他創新、多元模式之脫貧措施。關於脫貧措施的敘述，何者正確？
  options:
  - label: A
    content: 幫助中低收入戶脫貧無助於實現人性尊嚴
  - label: B
    content: 教育不包含在我國社會福利政策領綱內涵
  - label: C
    content: 脫貧的目的是希望人民能有基本生活保障
  - label: D
    content: 脫貧措施是讓政府替中低收入戶承擔風險
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 「政府再造」的意義是要引進現代企業的經營理念，重新調整政府的功能，以及重新定位政府的角色。請問：下列對「政府再造」的敘述，何者正確？
  options:
  - label: A
    content: 擴大政府組織結構，形成大有為政府
  - label: B
    content: 調整中央與地方政府關係，權力集中，中央方便管理地方
  - label: C
    content: 強調政府領導觀念，人民服從國家領導
  - label: D
    content: 政府應該與民間建立夥伴關係，盡量解除不必要的管制，著重市場機能運作
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 美國總統大選採「選舉人團制」，選舉過程大致可分兩階段，第一是由人民將選票投給各州的選舉人，第二階段再由選舉人投給總統。除少數州外，當某候選人在第一階段取得該州勝利時，就獲得該州所有的選舉人票。根據上述，請問：美國總統選舉較接近下列何種制度？
  options:
  - label: A
    content: 絕對多數制
  - label: B
    content: 選擇投票制
  - label: C
    content: 間接選舉
  - label: D
    content: 比例代表制
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 下列對我國選舉資格的敘述何者正確？
  options:
  - label: A
    content: 領有身分證的國民都能投票
  - label: B
    content: 總統、副總統選舉，選舉人須居住滿四個月
  - label: C
    content: 一般選民是依照實際居住地點來進行區域投票
  - label: D
    content: 經法院監護宣告者,不能行使投票權
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有位民眾這樣形容他的國家與政治狀況：「我們的政府像是拼裝車一樣，人們透過選舉挑選了一大堆的零件，但這些零件的廠牌很多樣化，政府就這樣拼組了起來。這部拼裝車，三不五時就因為不同廠牌零件的相互排斥而拋錨，必須要整個拆掉再重新挑選零件，重新組裝。重組之後還是一部拼裝車，只是組成的零件換了一些。」請問：有關其國家的政治之推論，何者正確？
  options:
  - label: A
    content: 該國的政黨較不易出現極端主張
  - label: B
    content: 該國係採取總統制的政府體制
  - label: C
    content: 該國的國會議員選舉為單一選區相對多數決制
  - label: D
    content: 該國的責任政治較難落實
- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
