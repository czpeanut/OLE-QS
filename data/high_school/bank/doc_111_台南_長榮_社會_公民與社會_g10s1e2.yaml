  stem: 我國為提高公共服務品質，秉持「民間能做，政府不做；地方能做，中央不做」的精神，其中為達到政府精組織之目標，政府作出改革，重新調整政府角色與功能。請問：下列做法的敘述何者正確？
  options:
  - label: A
    content: 教育部將國立臺灣科學教育館交給臺北市教育局管理經營
