- id: doc_111_台南_長榮_社會_公民與社會_g10s1e2_s2_47
  section: 2
  number: 47
  type: single
  page: 5
  stem: 從青銀共居政策的實施方式與内涵看，下列分析何者最正確？
  options:
  - label: A
    content: 青銀共居指政府提供人共居
  - label: B
    content: 青銀共居由政府主導辦理，預防老人獨居受傷
  - label: C
    content: 青銀共居結合多數人力量，共同分擔危難責任
  - label: D
    content: 青銀共居與民間合作推動，落實社會福利政策
  group_stem: (二)政府為使人民均能有所居，除了建設國民住宅，近年也開始進行「青銀共居」方案。政府整合民間閒置居住空間，嘗試透過跨世代的居住共享方案，為高齡者、青年找出可能的新生活選項。新北市政府於2017年與民間共生公寓合作，進行了全臺第一場青銀共居的實驗，並於2018年3月由10位申請者開始正式共居生活。臺北市政府亦與民間長照中心受託經營之老人公寓及大學合作，學生只要定時陪伴長者，不論打麻將、下棋，還是教他們網購、用臉書等等，每月服務滿20小時，就可以用月租3千元入住老人公寓。 在高齡化、少子化與高房價的時代，高齡者獨居以及青年蝸居的現象屡見不鮮。青銀共居提供給長輩與青年另一種居住生活型態。在長照措施尚未足夠密集的現代，青年可就近陪伴長辈，教長辈們使用現代科技、網路應用；長輩們也能把豐富寶貴的人生開歷，透過自然互傳承給共居的青年，彼此在生活中共同成長，如大家庭般互助相伴。有論者認為，青銀共居可以使青年與老年人彼此更加了解。有助從世代對立到世融合。
