  stem: 關於青銀共居政策永續發展時會遇到的情況，下列分析何者正確？
  options:
  - label: A
    content: 青年與老人為不同部門的權責，個別承辦可達到專業分工的效果
  - label: B
    content: 青銀共居係因高齡少子化而起，其效果會因實際執行狀況而不同
  - label: C
    content: 為確保青銀共居政策有效實施，應全部由政府提供房舍以及管理
  - label: D
    content: 青銀共居政策實施後若獲好評，可以訓練青年照護技能取代長照
