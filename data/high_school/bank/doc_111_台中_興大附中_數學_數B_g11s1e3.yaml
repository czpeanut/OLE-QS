  stem: '根據國際標準化組織（ISO）的規定，A 系列紙張的「寬長比」都是 1：$\sqrt{2}$，而且將 A0 紙張的長邊對半裁切可以得到 2 張 A1 紙張，將 A1 紙張的長邊對半裁切可以得到 2 張 A2 紙張，以此類推。而 B 系列紙張的長（或寬）是「編號相同」與「前一號」

    的 A 系列紙張長（或寬）的幾何平均。例如：B2 紙張的長＝$\sqrt{\mathrm{A} 2 的長\times \mathrm{A} 1 的長}$， B4 紙張的寬＝$\sqrt{\mathrm{A} 4 的寬\times \mathrm{A} 3 的寬}$。試求 B3 紙張與 A2 紙張的面積比值為何？'
