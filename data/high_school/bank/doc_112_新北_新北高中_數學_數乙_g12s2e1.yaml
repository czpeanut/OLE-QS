- id: doc_112_新北_新北高中_數學_數乙_g12s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列敘述何者正確？
  options:
  - label: A
    content: $\sqrt{3} \sqrt{-5}$＝$\sqrt{( 3 ) ( -5 )}$
  - label: B
    content: $\sqrt{-3} \sqrt{-5}$＝$\sqrt{( -3 ) ( -5 )}$
  - label: C
    content: $\frac{\sqrt{3}}{\sqrt{-5}}$＝$\sqrt{\frac{3}{-5}}$
  - label: D
    content: 若 a，b 為複數，則 $a^{2}$＋$b^{2}$＝0，可推得 a＝b＝0
  - label: E
    content: 若 x＋4i＝2＋yi，則 x＝2 且 y＝4
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○

    (B)╳：左式＝$\sqrt{-3} \cdot \sqrt{-5}$＝$\sqrt{3} i \cdot \sqrt{5} i$＝$-\sqrt{15}$，右式＝$\sqrt{(
    -3 ) ( -5 )}$＝$\sqrt{15}$

    ∴左式≠右式

    (C)╳：左式＝$\frac{\sqrt{3}}{\sqrt{-5}}$＝$\frac{\sqrt{3}}{\sqrt{5} i}$＝$-\frac{\sqrt{3}}{\sqrt{5}}i$，右式＝$\sqrt{\frac{3}{5}}
    i$

    ∴左式≠右式

    (D)╳：反例：若 a＝1，b＝i，則 $a^{2}$＋$b^{2}$＝0，但 a≠b

    (E)╳：反例：若 x＝2＋i，y＝5，則 x＋4i＝2＋yi，但 x≠2 且 y≠4

    故選(A)'
