  stem: '試求下列各式的值：

    (1)$\left| \frac{( -4 + 3i )^{2}}{( 2 +i ) ( 2 -i )} \right|$＝＿＿＿＿。

    (2)$| ( 3 + 4i )^{4} ( -1 -\sqrt{3} i )^{2} |$＝＿＿＿＿。'
  answer:
  - (1) 5；(2) 2500
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)$\left| \frac{( -4 + 3i )^{2}}{( 2 +i ) ( 2 -i )} \right|$＝$\frac{|
    -4 + 3i |^{2}}{| 2 +i | \cdot | 2 -i |}$＝$\frac{25}{\sqrt{5}\times \sqrt{5}}$＝5

    (2)$| ( 3 + 4i )^{4} ( -1 -\sqrt{3} i )^{2} |$＝$| 3 + 4i |^{4} \cdot | -1 - \sqrt{3}
    i |^{2}$＝$5^{4}$×$2^{2}$＝2500'
