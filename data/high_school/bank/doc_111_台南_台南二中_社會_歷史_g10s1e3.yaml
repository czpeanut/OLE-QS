questions:
- id: doc_111_台南_台南二中_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 中國大陸於 1980 年代在深圳、珠海、廈門、汕頭等地設置經濟特區，這些地區現已成為重要工商業城市。而經濟特區的概念，實為複製臺灣某時期的經驗，試問下列何者為是？
  options:
  - label: A
    content: 1950 年代：土地改革
  - label: B
    content: 1960 年代：加工出口區
  - label: C
    content: 1970 年代：十大建設
  - label: D
    content: 1980 年代：科學園區
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '所謂「經濟特區」，其實即是加工出口區的概念，此為(B) 1960 年代出口擴張時期的重要措施。

    2.1950 年代，臺灣經濟處在進口替代階段，當時依賴美援發展民生輕工業，再加工農產品出口到日本；1970 年代第二次進口替代階段，臺灣改為發展重工業，主要由日本進口原料、零件，再加工出口到美國。因此甲、乙兩地分別為(A)日本、美國。

    3.從「上年所收額租，作為十成，以四成貼與小租戶完糧，實收六成即向小租戶收完……丈單、錢糧俱歸小租戶經手」等敘述，即可推知此為劉銘傳所推行的「減四留六」政策，欲以小租戶為土地所有權人，(B)為正解。(A)丈單由小租戶留存。(C)名義上的土地所有權也歸小租戶。(D)由於土地清丈不公，大租戶施九緞等人才會聚眾抗官。

    4.題幹為〈保衛大臺灣歌〉的歌詞，從「打倒蘇聯強盜，消滅共匪漢奸」即可看出其屬於(A)反共文學。

    5.從「甲給予乙土地所有權」、「乙要繳稅給官府」兩句，推斷甲是官府，乙是墾戶（大租戶）；「乙保障丙的土地經營權」，故丙為佃戶（小租戶），擁有永佃權；丁有土地耕作權，並繳納田租最多，為現耕佃農，因此答案為(C)。(A)甲是官府，乙是墾戶。(B)從題目來看，土地所有權歸屬於乙。(D)此為墾首制。

    6.(D)應改為「總督府購買大租戶的業主權，使小租戶成為土地所有人」。

    7.糖廠的製糖原料為甘蔗，因此要求農民「以甘蔗折價繳納」水費，實則可以掌握更多的原料，因此(B)為正解。(A)(C)(D)日治時期糖廠對蔗農多所剝削，諸項措施不可能是配合農民需要或是為農民著想。

    8.從這位臺灣作家的說法，可知其寫作立場同情底層社會，甚至帶有社會主義思想，因此最可能為(B)日治時期的楊逵。(A)為清代開臺進士，應不懂社會主義思想。(C)為現代主義文學作家。(D)為懷鄉文學作家。

    9.陳澄波擅長畫西洋油畫，而非東洋膠彩畫，答案選(A)不選(B)。(C)(D)從此幅畫作來看，應屬寫實主義風格，而非現代主義，此外也與傳統水墨畫的寫意精神不符。

    10.(D)中日戰爭爆發後，臺灣人沉浮於中國、日本之間，而出現身分認同的錯亂與無奈，《亞細亞的孤兒》正是作者對皇民化運動的抗議。

    11.1950 年代為進口替代時期，臺灣大量出口農產品及農產加工品，賺取的外匯再轉而投資民生工業，答案選(C)。(A)(B)這兩個年代為日治時期，殖民政府無法保障臺灣本身糧食充足。(D) 1970 年代在能源危機衝擊下，臺灣以發展十大建設等重工業為主。

    12.1960 年代，由於本土市場飽和的困境，加上越戰的補給與美援的停止，給予臺灣經濟自主發展的機會，開始轉向出口擴張。從美籍顧問建議應「以獎勵本國人及外資投資（工業生產）為重要方向」，可知答案為(A)。(B)主要在開拓新市場，非資金不足問題。(C) 1958 年後兩岸衝突趨緩，無此需求。(D)以降低關稅、減免租稅方式來吸引外資，故無法利用此政策增加稅收。

    13.題幹所述的「素人畫家」為 1970 年代寫實主義的代表畫家(B)洪通，可惜當時的熱潮僅是曇花一現，並未持續太久。(A)(C)(D)為日治時期正式習藝的代表性畫家，並非「素人」。

    14.政府強制收購蓬萊米，收購價格比市場價格低，但又高於在來米價，如此控制價格自然是為了確保獲利與數量，(C)為正解。(A)應是減少臺灣人搶食要外銷的蓬萊米。(B)收購價格比市價低，農民權益受損。(D)此政策目的是在戰時體制下，為強化米穀等重要物資控管為主。

    15.(B)臺灣人多以甘藷為主食，從甘藷種植面積、單位產量的成長，可見生活日益困苦。(C)獲利者為資本家，農民生活並未改善。(D)資料中無法看出日本對臺灣重工業的投資情形，也與現今科技產業無關。

    16.題幹所述為皇民化運動時期，總督府欲以神道教取代臺人的傳統民間信仰，故推行「正廳改正」與「寺廟整理」運動，答案為(D)。

    17.資料一提到政府收購稻穀的價格低，但肥料價格高，兩者是「不等價交換」，可知此政策使農民受損；資料二主張政府管制糧食對國民經濟「會有貢獻」，持肯定態度。綜合兩者說法，(B)為正解。

    18.1984 年仍為戒嚴時期，政府在沒收、查扣出版物的數量高居不下，足見其管控力道加大，最可能的原因為(B)。(A) 1987 年解除戒嚴後才逐漸鬆綁，此圖並未失真。(C)黨外運動雖受到壓制，但勢力逐漸壯大。(D)世界局勢的主流政治為民主自由政體，國際輿論不可能支持對出版物嚴加控制的政權。

    19.從題幹來看，荷蘭人既已築城澎湖再「要求互市」，自然是與中國沿海城市互市，故(A)為正解。(B)前者許互市，後者不許互市，做法並不一致。(C)題幹並未提到此一訊息。(D)商周祚給皇帝的報告中僅提到荷蘭人遵命遷徙至遠方，並未同意荷蘭人到臺灣築城互市。

    20.歌謠裡提到臺灣有四通八達的公路與縱貫南北的鐵道，雖在日治時期已建成，但當時不可能「家家戶戶吃得飽」，加上「不管長住和初到」一句代表有新加入的族群，因此最可能為戰後國民政府時期，(C)為正解。

    21.這件改變臺灣命運的事件為韓戰，美國重新恢復對臺的軍事與經濟援助，尤其第七艦隊協防臺灣海峽，使臺灣暫時免於中國的武力威脅，(B)為正解。(A) 1945 年、(C) 1958 年，兩者時間不符。(D)臺灣並未參與越戰。

    22.從題幹「戰機停滿……隨時準備升空，迎擊入侵的敵機」，可知此時應有戰爭，且該基地政權與美軍亦有合作，因此答案為(C)。自《中美共同防禦條約》簽訂後，美國與臺灣即有軍事合作，故在越戰期間成為美軍渡假勝地。(A)此時受孤立主義影響，美國不會介入其他地區的戰事。(B)當時上海為日軍所占領，不會有美方戰機。(D)此時《中美共同防禦條約》已失效，美國戰機不會駐紮在臺南。

    23.這位作家以「工農兵文藝」來批評該文藝作品，顯見被批評者必定是以工農階層為創作主體，關懷社會底層生活，因此(A)為正解。(B)為現代主義的意識流小說。(C)為戰後初期的反共文學特色。(D) 1980 年代解嚴後的文藝之特色。

    24.(A)應是清治時期。(C)鳳山縣位於臺灣南部。(D)此文件為官府發給的開墾執照，非僅是通知書而已。

    25.清治時期，水稻是重要的農作物，為提升稻米產量，各地陸續興建水利設施，因此(C)為正解。(A) 18 世紀為清治前期，當時政府採消極治臺政策，水利建設多由民間主導。(B)開闢水利設施是為種植水稻。(D)當時並非耕地不足，而是水源不穩定。

    26.屏東車城的土地公廟，在受到政府褒揚後即四處分靈，使信仰範圍擴大，因此(B)為正解。(A)土地公的角色與功能並未轉變。(C)題幹並未提到此項特徵。(D)祭祀圈與信仰圈的擴大為定居社會的特徵。

    27.題幹顯示此一事件係針對外省人、中國人的仇恨行為，因此應為(A)二二八事件初期的情景。

    28.(A)「郊」為清治時期開港通商前，從事兩岸對渡貿易的商業組織。(B)郊為民間組織。(D)郊輸出的商品以米、糖為大宗；樟腦、茶葉、糖為開港通商後的三大出口商品。

    29.下淡水溪為高屏溪的舊稱，資料提到「糖貨之利上資江浙」，可知此時應為臺灣與大陸兩岸區域分工互補的(B)清代初期。

    30.這份雜誌的立場反共，因此接受戒嚴的狀態，從「組黨」與「十一年」的線索來看，這份雜誌應為(B)《自由中國》，是雷震隨蔣介石來臺後所創辦，原配合反共復國政策，後改為追求建立民主政體、行內閣制等。1960 年雷震因籌組中國民主黨而被當局以「為匪宣傳」、「知匪不報」等罪名逮捕，雜誌社因此被迫關門。

    31.這位批評者反對臺灣地方自治聯盟的原因，是因為臺灣地方自治聯盟代表地主資產階級的利益，無視底層工農小市民的生死，因此這位批評者最能認同的應是(C) 1970 年代關懷臺灣底層社會的鄉土文學。

    32.18 世紀末為乾隆年間，此時臺灣為移墾社會，經濟也是以兩岸區域分工為主，因此當時的情況應為(D)。(A)荷治時期，時間不符合。(B) 19 世紀中葉開港通商後的情形。(C)臺北設府為 19 世紀後期，且瑠公圳並非在臺北府設置後才開鑿。

    33.附圖可看出臺灣在轉口貿易上扮演重要角色，此時從日本與東南亞輸入臺灣的商品以銀為主，因此應為(A)荷蘭時期的對外貿易圖。(B)輸入臺灣的商品應以軍需品為主。(C)兩岸區域互補，無國際貿易。(D)不重轉口貿易，且臺灣出口以茶、糖、樟腦為大宗。

    34.從此評論來看，三七五減租為美國在東亞地區推動的土地改革之一環，且政治性超越經濟性目的，因此答案應選(A)防堵共產勢力在東亞擴張。(B)(C)(D)三者皆為經濟性目的，與題幹所述不符。

    35.由「送瘟」、「造木為船」等線索來看，此民間信仰應為與瘟疫有關的(C)王爺信仰，有送王船的習俗。'
