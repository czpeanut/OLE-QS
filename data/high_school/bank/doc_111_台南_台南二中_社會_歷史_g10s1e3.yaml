  stem: '資料一： 臺灣農民主要栽種的蓬萊米需要大量肥料，而當時主要的化學肥料，如尿素和液態氨，都是國家的獨占事業。藉由肥料換穀來控制農民，讓農民無法自由販賣穀物。而政府收購稻穀的價格低，但肥料價格高，可以說是不等價交換。

