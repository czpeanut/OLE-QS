  group_stem: '請閱讀以下兩則資料，並回答問題：

    資料一： 馬偕在臺灣除了對漢人傳教以外，也開始對平埔族群傳教。他在宜蘭地區傳教期間，曾經促成許多噶瑪蘭族人接受基督教信仰。後來有的噶瑪蘭族人還以「偕」作為本身的漢姓，以紀念馬偕。此外，馬偕在淡水設立的女子學堂，有不少學生也是平埔族群的女性。……馬偕還曾前往花蓮地區阿美族的部落，對當地族人進行傳教活動。

    資料二：姬望是太魯閣族有名的女宣教士，又有「臺灣原住民族信仰之母」的美譽。由於她曾在太魯閣族與日本人之間擔任協調，曾獲得官方信任。她在 1924 年時成為基督徒，後來又前往淡水的婦女聖經學校就讀，學成後返回故鄉對族人傳播基督教信仰。雖然因為官方政策的影響，遇到許多困難與挑戰，甚至經常還須選擇森林與岩洞作為宣教與禮拜的地點。然而，她的努力對基督教信仰在太魯閣族間的發展，仍做出重要貢獻。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)長老教會與天主教傳教士於清治時期已開始重視對原住民族的宣教活動。(B)清朝官府並未禁止傳教士的醫療、教育工作。(D)日本總督府禁止傳教士向原住民族傳教。
