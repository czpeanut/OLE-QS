  stem: 大緯帶著女兒均均去紐西蘭旅遊，下列哪個描述最可能是他們接觸到毛利人文化時所發生的情況？
  options:
  - label: A
    content: 他們在路上看到穿著樹皮衣的毛利人
  - label: B
    content: 毛利人邀請他們進行紋面
  - label: C
    content: 在路上看到許多毛利人穿著傳統祭祀服飾
  - label: D
    content: 他們可以看到男性老者歷經歲月滄桑的臉以及充滿特色的紋面
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)毛利族傳統服飾主要以亞麻、皮革製成，且現今的日常穿著已現代化，因此在路上不會看到穿著樹皮衣的毛利人。(B)「紋面」為毛利族重要的文化資產，其象徵自身的身分與家族，因此並不會邀請外族人進行文面。(C)傳統祭祀服飾僅會在重要的場合與祭典中穿著。
- id: doc_111_台北_明倫_社會_歷史_選修歷史I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在十七世紀以前毛利人在紐西蘭過著與世無爭的生活，直到歐洲列強開始在海上探險及貿易獲得巨大利益之後，1642 年已掌控印尼的□□□□派遣塔斯曼出航尋找南方大陸，他在該年 12 月 19 日欲登陸紐西蘭北島，遇上語言不通的毛利人，雙方誤解彼此下起衝突，在四名船員被殺害後，塔斯曼立即駛離此地，沒有再回來過。請問根據上述資料，空格內應填入下列何者？
  options:
  - label: A
    content: 英屬東印度公司
  - label: B
    content: 荷蘭聯合東印度公司
  - label: C
    content: 西班牙王國
  - label: D
    content: 葡萄牙王國
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '塔斯曼（Abel Tasman）為荷蘭籍商人、探險家，其於 1630 年代起受僱於荷蘭聯合東印度公司，並在 1642、1644 年兩度向南遠航，並發現塔斯馬尼亞島、紐西蘭、東加和斐濟等地。從題幹敘述中「1642 年已掌控印尼」的線索，可判斷空格內應為「荷蘭聯合東印度公司」。

    3.1840 ～ 1850 年代，英國人透過《懷唐伊條約》中優先購地權，以低價大量購買紐西蘭土地，引起許多毛利部落的不滿。1854 年一些反對英國人購地的毛利部落，打破過去各部落獨立的狀態，共同推舉 Pōtatau Te Wherowhero 為首任毛利國王，企圖對英國移民的購地活動進行反抗，史稱「國王運動」。

    4.臺灣原住民族自 1980 年代開啟一系列的原住民權利運動，並發表《臺灣原住民族權利宣言》後，終於在 2005 年促使政府通過《原住民族基本法》，對原住民族的基本權利進行法律的保障。《原住民族基本法》第 21 條規定：「政府或私人於原住民族土地或部落及其周邊一定範圍內之公有土地從事土地開發、資源利用、生態保育及學術研究，應諮商並取得原住民族或部落同意或參與……。」由此可判斷此題正確選項為(A)。

    5.(A)(B)(C)選項的案例，皆為將原住民族文化的元素進行商業包裝後，做為觀光商品販售，其並不一定會促進族人認同族群價值，甚至會將原住民文化「標籤化」，並可能出現「誤用」的風險。

    6.(B)語言巢的教學目標，著重在透過語言與日常生活的實踐，使幼童得以「內化」傳統文化與價值觀，因此並未先發展文化知識課程。(C)(D)語言巢的理念是透過家庭、社區與學校創造出自然的沉浸式文化環境，而非將幼童送至住宿學校教育，或是在主流學校輔以母語課程學習。

    7.第二次世界大戰期間，因大規模徵調人民從軍，較可能出現如題幹敘述中大城市工業生產勞動力空缺的現象，因此(C)選項較符合題幹情境。(A)南北戰爭時，有些美國原住民族，例如切諾基人（Cherokee Nation）曾分裂為二支不同立場的原住民部隊，分別加入聯邦軍與邦聯軍。從題幹敘述中可得知當事者發覺自己因族群與「白人」不同，而受到差異化的待遇，因此(B)(D)選項不符合此情境。

    8.為了解決殖民地男女失衡、人口減少的問題，法國國王路易十四曾於 1663 ～ 1673 年間，陸續於巴黎、魯昂等地招募貧苦無依的孤女、寡婦，前往法國於北美洲的殖民地新法蘭西開墾定居、結婚，而一切旅費開銷皆由國王資助，因此這些前往新大陸的女性移民又被稱為「國王的女兒」（Filles du Roi）。(A)(B)從題幹敘述中「法國國王曾贊助近千名法國女性」可判斷這些女性應不是來自非洲的奴隸。(C)受到宗教迫害前往美洲的移民為來自英國的清教徒。

    9.此題在測驗學生的閱讀理解能力，從題目敘述中可得知，胡安娜是為了自我實現並且避免婚姻，而進入修道院成為修女。由此可判斷當時的修道院，具有讓女性逃避社會約束的功能，但並非等於女子的高等學校，故答案選(B)。

    10.1754 ～ 1763 年間爆發的「七年戰爭」，為 18 世紀歐洲列強間為了貿易與殖民地利益所進行的大規模衝突。戰爭後，法國、西班牙與英國簽訂的《巴黎和約》，使英國獲得絕大部分加拿大新法蘭西、西屬佛羅里達的殖民地主權，以及一些位於加勒比島嶼、塞內加爾的殖民地，並且取得在印度與法國貿易戰之間的絕對優勢，成為七年戰爭最大的受益者，然而卻也促成 1770 年代法國於美國獨立戰爭中，選擇協助殖民地軍隊攻擊英國海軍的因果。而北美殖民地人民，則透過獨立戰爭在 1776 年建立美國。因此正確選項為(B)。

    11.題幹敘述之衝突被稱為梅塔卡姆戰爭（Metacom''s War，或是菲利普國王戰爭 King Philip '' s War），其起因於新英格蘭殖民地的移民對原住民族土地的侵占問題。由於這場戰爭由移民軍獲勝，剩餘原住民被迫遷離原居地。(A)小巨角戰役發生於 1876 年，其背景為 19 世紀的西進運動與淘金熱，對西部蘇族部落生活空間造成的破壞，進而引發的衝突。(B)從題幹敘述中可判斷這場衝突起因於土地問題。(D)當時尚未進入西進拓殖運動時期。

    12.16、17 世紀的大西洋三角貿易，其主要由歐洲輸出武器、日用品至非洲，於非洲交換奴隸後運往美洲，再將美洲的馬鈴薯、菸草與玉米等貨品輸回歐洲。因此正確選項為(A)甲非洲、乙美洲、丙歐洲。

    13.(A)從題幹敘述中可判斷，該名當事者應為 16、17 世紀大西洋三角貿易中，被當作奴隸運往美洲的非洲人。(B)當事者被抓僅是為了他可以提供勞動力，而非手工藝技術。(D)他所說的「種田」所指的比較可能是種植棉花。

    14.1866 年，不滿帝國體制的墨西哥人民展開反抗行動；美國雖因奉行門羅主義，早就不滿法國扶植的墨西哥帝國，但因南北戰爭方於 1865 年結束，因此前期並無餘力干涉墨西哥問題。遲自 1867 年才派遣美國軍隊抵達美墨邊境，對法國施加壓力，並向墨西哥的共和派提供補給，故答案選(D)。(B)美西戰爭發生於 1898 年，主要為解決古巴與菲律賓獨立問題。

    15.地圖中，「甲地」大致為美國獨立建國時的領土，主要為原英國殖民地；「乙地」原為法屬路易斯安那，1803 年拿破崙在牽制英國的戰略考量下，將該地賣給美國，這個事件也被稱為「路易斯安那購地（Louisiana Purchase）」；「己地」當時原為西屬佛羅里達，1819 年西班牙將該地售予美國，以換取美國承認西班牙在德克薩斯的權益；「戊地」原為墨西哥領地，然而德克薩斯人在 1836 年宣布獨立後，與墨西哥持續在邊界問題上發生戰爭，1845 年在美國對邊界問題作出承諾後，德克薩斯共和國宣布併入美國成為第 28 州，而這個問題也引發了美墨戰爭；1847 年美墨戰爭在美國取得勝利的狀態下結束，墨西哥於 1848 年被迫讓出「丁地」的主權，美國則向墨西哥支付 1,825 萬美元作為補償；「丙地」早期稱為哥倫比亞地區，19 世紀前期為美國與英國在競爭的關係下共同經營，1846 年美、英簽訂條約後劃入美國領土。因此正確選項為(D)。

    16.美西戰爭發生於 1898 年，起因為解決古巴與菲律賓獨立問題，然而美國在戰勝西班牙並簽訂《巴黎和約》後，原為西班牙殖民地的菲律賓、波多黎各，被轉為美國所有，而古巴則成為美國的保護國，自此美國的勢力正式從北美洲，深入拉丁美洲和太平洋與亞洲。故答案選(B)。

    17.從題文中可判斷，促使這群移民移動的推力，為母國的經濟不佳所導致的貧窮問題，而貧窮與經濟問題則多與中南美洲政治局勢的動盪相關；拉力則是美國強大的經濟誘因，因此較可能的選項為(C)推力─政治動盪。

    18.本題判斷的關鍵點有二，其一為這群移工主要於 1860 年代來到美國修築北美太平洋鐵路，其二則是 1882 年的「限制入境法案」。從此二點可判斷，這群移工應為來自中國廣東一帶的華工，而 1882 年法案則是《排華法案》。

    19.(A)二戰期間與戰後初期，由於美國本土未受戰火波及，因此接納了許多受到戰爭影響的移民，另因受惠於經濟發展，美國政府才於 1960 年代修改移民限制。(C)二戰後的移民潮帶來的多元特色，才影響美國社會開始思考種族與文化的多元性，進而刺激民權運動的風潮。(D)申請制並非像配額制得以從根源篩選移民，因此相較之下更具公平性。

    20.從題幹敘述中可得知，美國《移民法》的識字測驗規定，主要是針對大量的東南歐移民，因此(A)(C)為錯誤選項；(D)從題目敘述中無法確認識字測驗是否成功篩選移民，因此較符合題意的選項為(B)。

    21.(A)(B)「布朗訴托彼卡教育局案」雖然引起部分白人不滿，並多於南方出現不同程度的抗爭，但並未因此爆發全國性的內亂。(C)由於此案上訴至最高法院並判決隔離教育違憲，因此在此案判決後教育場所的種族隔離制度便不復存。

    22.目前學界將「定居農業社會」定義為舊石器社會轉入新石器社會的重要指標，因此可從題目中「較繁重、密集的農業取代女人的園藝，計畫性耕耘及土地開墾取代隨意播種」的敘述，判斷此兩性關係變化的時期出現於(B)新石器時代早期。

    23.西周宗法制度除了訂定以血緣關係作為繼承基礎，更以「嫡長子」作為繼承權位、財產的制度核心，而女性也因此被排除於繼承制度之外。故答案選(C)。

    24.從題文中「女性終其一生都要在父親、丈夫以及孩子的監護下度過，也不能單獨與異性相處，以免種姓遭受破壞」，可判斷此為傳統印度社會為維護種姓制度的運作，透過剝奪女性權利，以避免種姓限制被打破的規範。

    25.1890 年代，安全自行車的出現，促使美國女權運動者弗朗西斯．威拉德（Frances Willard）透過自行車的騎乘，反思自由移動與服裝之間的關係，並助長了服裝改革運動（理性服飾運動，the Rational Dress Movement）風潮，對騎乘自行車較為方便的燈籠褲亦成為當時女性服飾的一種流行。另一位女權運動者蘇珊．安東尼（Susan B.Anthony）也曾表示：「自行車比世界上任何東西都可以帶來解放，騎自行車可以給予一種自由與獨立的感覺。」故答案選(B)。

    26.(A)從題幹敘述中，可判斷西蒙．波娃主張女性應透過工作，獲得獨立經濟基礎，進而擺脫性別的歧視與不平等。(C)從敘述中可得知，西蒙．波娃除了批評男性的性別歧視外，亦批判女性應為長期的被動、屈服與不反抗負責。(D)從敘述中可得知，西蒙．波娃認為不論男性或女性，在性別不平等的問題中皆有責任。

    27.(B)選項與題意無關。(C)《女誡》主要是針對女性的道德、倫理與理想狀態提出意見，並未規範學會《女誡》者才能替丈夫持家。(D)從題目的評論中可得知，《女誡》的理念事實上降低了中國女性的社會地位。

    28.題目引文中所敘述的女性服飾風潮，出現於 16、17 世紀的英國社會，當時的宮廷與貴族女性，多流行兼男性軍裝風格的大布列夾衣、搭配長裙的穿著。而這樣的現象，也引來許多對此感到不以為然的男性文人的批評，甚至在 1620 年代引發關於「男裝女性」的文學論戰，故答案選(A)。

    29.從題目敘述中可觀察到，水療團體與女權團體雖然動機不同，但二個團體皆主張應透過去除服裝的束縛，達到解放女性身體的目標，故答案選(C)。(D)水療團體是基於治療觀念提倡去除服裝束縛，並非為提倡女權運動。

    30.此題為測驗學生的閱讀理解能力，從引文中「在羅馬世界，有不少洗衣婦、女圖書館員、女醫生……」的敘述，可判斷其所舉的例子是為了反駁「職業婦女是二十世紀才出現的獨有現象」這個觀點，故答案選(C)。

    31.18 世紀末，法國社會因中產階級與貴族、教會之間的矛盾激化，引爆了大革命的浪潮。在經歷一陣政局動盪後，中產階級逐漸取得社會領導權。也在此背景下，出現題目提及的「中產階級透過消費……並藉由流行服飾體驗階級晉升」的流行文化現象，故答案選(B)。

    32.從題目敘述中，可得知早期進入工作場合的女性，雖與男性的工作內容無所區別，但在勞動報酬與型態中卻出現性別差異的現象。由此可判斷(C)男女同樣工種，但資方給予不同酬，較符合題意。

    33.從題目敘述中，可得知南方蠶絲業的興盛，除了提供女性就業機會外，亦促使女性透過工作獲得經濟自主性，不必仰賴原生家庭或是必須出嫁，故答案選(B)。(D)這些職業女性是因為經濟獨立因而可選擇終生不嫁，並非為維持原生家庭的經濟收入。

    34.此題是在測驗學生的閱讀理解能力，從題目內容中可得知，影響德蕾莎修女轉向服務貧苦者的關鍵原因，是看見二戰後印度內部宗教衝突產生大量的窮困百姓。由此可推斷其開始轉向的年代，最可能為(C) 1940 年代。

    35.從題目敘述中「出身平民、百姓的守護神、得到歷代君主的敕封」等關鍵點文句中，可判斷此位女神應為媽祖娘娘，故答案選(D)。(A)關於註生娘娘的源由未有定論，但其專掌生育，與題意不符。(B)王母信仰出自《山海經》，有學者認為王母信仰反映古代中國人的日月崇拜，因此與題目敘述不符。(C)嫘祖形象來自上古神話，其被認為是女媧氏的孫媳、黃帝正妻，因發明養蠶而有「嫘祖始蠶」的說法。

    36.題文提及 15 世紀天主教以《女巫之槌》來檢核判斷女巫，卻未有檢核男性是否為巫師的標準；及被指控為巫師的男女比例落差，可得知西方宗教對於女性有偏見，故答案選(B)。(D)根據研究，宗教改革時期正是獵巫風潮的高峰，且不論新、舊教徒皆競相獵巫。

    37.女媧信仰源於中國上古神話，因神話中傳說女媧曾透過摶土造人，其人體蛇身的原始意義也與生殖有關，所以被視為人類對生殖崇拜的具體投射。(A)民族崇拜多以黃帝為指標。(B)女媧信仰與神話事實上是反映出多神信仰觀。(D)女媧信仰源於中國上古神話，此與祖靈信仰無關。

    38.從題目中「十七世紀」、「臺灣西南地區」、「部落中……她的地位非常崇敬，她會扮演人與神明之間的溝通角色」等關鍵文句，可判斷此段敘述是西拉雅族「尪姨」的記載。(A)馬賽族（巴賽族）主要分布於現今的淡水、臺北、基隆、貢寮一帶。(C)(D)皆為男姓。

    39.根據題幹敘述，獵殺女巫的風潮是當時歐洲教會為了鞏固權力，而將對於災禍的無能為力，轉嫁給老病無依的女性，並藉此增加社會控制。由此可判斷正確選項為(C)。

    40.從題幹敘述中「脫離黑暗時代」，可得知女性受教權被剝奪，是源自於中古時期女修道院運動的衰弱；而「由男人掌控知識的文法學校與大學機構」、「新知識熱潮」，則是文藝復興時期的時代特色之一。由此可判斷正確選項為(D)。

    41.此題為測驗學生對於伊斯蘭文化相關議題的理解。(B)(C)根據研究，《古蘭經》中規範女性穿著遮蔽身體特徵的衣物，其動機源於七世紀阿拉伯半島的蓄奴風氣。伊斯蘭經典透過宗教規範，強化穆斯林女性的身分辨識，免於被誤認為女奴而遭遇危害；而男性在衣著、性別禮節上亦有所規範。因此《古蘭經》中的規範並非基於性別歧視，且亦非認為女體不潔；男性亦受到經典的規範。(D)法國的布基尼禁令議題，事實上是牽涉宗教與性別文化的差異，甚至有宗教歧視的意味存在，因而引來爭議。

    42.從資料二的相關規範中，可以判斷加州政府對華人移工態度轉變，源自於擔憂大量華人移工湧入後，白人原有的工作機會與經濟優勢受到衝擊，因此透過針對性的法律，限制華人移工的相關權利。而這樣的風潮也影響後續《排華法案》的成形，故答案選(B)。

    43.此題在測驗學生的閱讀理解能力，從題幹敘述中可得知，高種姓寡婦在種姓制度的框架下，無法透過工作經濟自立，甚至變成夫家的經濟負擔，因此經濟問題事實上是加重寡婦困境的關鍵因素。(B)從題文敘述中可發現，高種姓寡婦所面臨的困境事實上比低種姓寡婦還嚴峻。(C)從題文敘述中可得知，寡婦仍可在克里希納神廟獲得救濟。(D)娘家亦未對寡婦提供援助。

    44.中國傳統社會中的分家現象，最主要與朝廷的賦役制度相關。如一般百姓未分家，需負擔的賦役責任也會隨著人丁比例而提高，因此也促使普遍分家的現象出現，故答案選(A)。(B)從題目敘述中可得知，政府是順應社會風氣而調整政策，並非主動推行分家政策。(C)中國傳統社會仍以農業生產為主體。'
