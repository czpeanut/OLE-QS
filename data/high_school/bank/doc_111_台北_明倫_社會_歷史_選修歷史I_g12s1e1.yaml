  group_stem: '「歐洲王室或貴族家宅的僕從、基爾特等團體中的學徒，會藉由身上穿著的制服來展現他們的認同與從屬性的社會地位，在這些社會關係中，制服如同『授職』中所授予的衣服，是一種記號，並且具備把各別的身體連結在一起的力量，這樣的力量也表現在丈夫與妻子之間。

    以中古世紀以來的義大利婚俗為例，女方必須準備以金錢為主的嫁妝，而男方則負責裝修新房，並準備嫁妝回禮。男方的回禮以新娘穿戴的衣物和飾品為主，並且要為新娘從家中帶來的金錢和物品，製作精緻的木櫃，在婚禮遊行隊中展示。這些回禮必須在婚禮舉行之前準備好，而且新婚一年之內，丈夫仍然需要提供妻子衣飾。在這些禮俗中，新郎負責著裝扮新娘，他必須與裁縫、布商、工匠商商討服裝、櫥櫃乃至新房的設計。在這幾項禮俗中，可以發現皆是男性角色在『覆蓋』女性：他讓新娘穿上他的衣服、戴上他的珠寶，同時也在空間上住進他準備的房間內。新娘的身體完全由男方的衣物與住屋所包裹，而且這些衣物與住屋的所有權仍屬於丈夫（新娘的身體也是）。這是男方在婚禮中的責任，也是一種權力，建立了授衣者（丈夫）與穿衣者（妻子）之間的上下尊卑。

    廣義而言，歐洲中古社會的授職與制服體系，也是透過服裝連結所有社會關係：君與臣、領主與附庸、主人與僕從、師父與學徒、丈夫與妻子、父親與子女，以及共同的同僚和友伴。因此服裝既是作為建立交換者彼此之間的情感與忠誠的禮物；也同時標記彼此各應擔負的責任與角色。」'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 此題為測驗學生的閱讀理解能力，從文章資料「歐洲王室或貴族家宅的僕從、基爾特等團體中的學徒，會藉由身上穿著的制服來展現他們的認同與從屬性的社會地位，在這些社會關係中，制服如同授職中所授予的衣服……」的敘述，即可得知服飾乃是歐洲中古社會用以區分、標記個體身分的重要標誌物。故答案選(A)。
