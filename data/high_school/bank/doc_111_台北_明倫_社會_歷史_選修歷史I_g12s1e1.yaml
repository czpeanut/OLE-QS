    51.1915 年後中國社會興起的「新文化運動」，不僅帶動了文學、藝術、教育與思想上的革新，亦促進女性運動的發展，以及逐漸打破傳統社會框架對女性身體、權利與思想的限制，因此資料二提及的「摩登女性」形象，與新文化運動最有關聯。

    52.(A)「纏足」風氣雖自北宋始，但與理學的發展並無關聯，且僅流行於中上階層的社會；而中國開始大規模流行纏足，始於明初。

    53.從文章資料中「長久以來，中國婦女由於囿於傳統的婦德教育，文才多遭到歛抑……」的敘述，可判斷該學者認為明代以前中國女性文學作品傳世甚少的原因，是因為受限於中國傳統社會對於婦德的要求，因此正確選項為(B)。

    54.明代中後期商品經濟日益繁榮的重要原因，來自於朝廷的稅制變革，以及十六世紀以降全球海上貿易的盛行。稅制變革促使農民開始種植糧食作物以外，如棉花等經濟作物，並在全球貿易盛行的背景下，帶動手工紡織業、陶瓷業等經濟產業的發展，貨品生產也出現區域分工的現象，商品經濟繁榮，民間經濟提升，亦促使女性投入經濟生產、社會地位提升。因此正確選項為(D)。'
