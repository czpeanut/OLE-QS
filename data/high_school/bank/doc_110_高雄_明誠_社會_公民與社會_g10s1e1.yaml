  group_stem: '(一)《憲法增修條文》提及：國家肯定多元文化，並積極維護發展原住民族語言及文化，顯現我國已將關於原住民族文化上的相關權利寫入憲法中，請依據課堂上所學關於權利發展的觀念，在答題卷的表格中勾選正確的選項，並解釋勾選的理由（限60字以內）

    (二)2021年在金球獎上一連獲得最佳影片和最佳導演的趙婷，原本得獎後被中國影迷視為「祖國之光」，她執導的《游牧人生》也敲定在中國上檔。不過，日前這部電影海報遭中國電影網站撤下，顯然上映日已遙遙無期，主因應該是趙婷2013年接受美國電影雜誌「電影製作人」採訪時曾說道：「在我成長的年代，中國是個充斥謊言的國家，我小時候吸收的資訊，最後發覺都是假的。」2020年，她接受澳洲媒體採也直言：「現在我的國家是美國」。隨著趙婷在影壇愈受關注，以及她開始獲獎，這些過去的受訪内容已遭刪除，但仍被中國網友掀出，撻伐趙婷對於自己身份的認同，因而掀起中國網民的民族主義情結。之前中國官媒包括央視、新華社等都稱趙婷為「中國女導演」，但不少網友糾正她是「華裔導演」，甚至辱罵她是「叛徒」，反彈聲浪開始不斷湧現。'
