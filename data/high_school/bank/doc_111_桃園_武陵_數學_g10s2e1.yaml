- id: doc_111_桃園_武陵_數學_g10s2e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設數列〈$a_{n}$〉的首項 $a_{1}$＝100，請選出正確的選項。
  options:
  - label: A
    content: 若〈$a_{n}$〉為等差數列且 $a_{112}$＞10，則 $a_{2023}$＞10
  - label: B
    content: 若〈$a_{n}$〉為等差數列且 $a_{112}$＜10，則 $a_{2023}$＜10
  - label: C
    content: 若〈$a_{n}$〉為等比數列且 $a_{2023}$＞0，則 $a_{112}$＞0
  - label: D
    content: 若〈$a_{n}$〉為等比數列且 $a_{112}$＜0，則 $a_{2023}$＜0
  - label: E
    content: 若〈$a_{n}$〉為等比數列，則 $a_{400}$÷$a_{300}$＝（$a_{40}$÷$a_{30}$）$^{10}$
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$a_{1}$＝100，取 $a_{112}$＝11 ⇒ 公差 d＝$-\frac{89}{111}$

    則 $a_{2023}$＝$a_{112}$＋（2023－112）d＝11＋1911×$\left( -\frac{89}{111} \right)$＜0

    (B) ○：$a_{1}$＝100，$a_{112}$＜10 ⇒ 公差 d＜0 ∴$a_{2023}$＜$a_{112}$＜10

    (C) ╳：$a_{1}$＝100，取 $a_{2023}$＝100 ⇒ 公比 r＝$\pm 1$，令 r＝－1，則 $a_{112}$＝－100＜0

    (D) ╳：$a_{1}$＝100，取 $a_{112}$＝－100 ⇒ 公比 r＝－1，則 $a_{2023}$＝100＞0

    (E) ○：$a_{400}$÷$a_{300}$＝$r^{100}$，$a_{40}$÷$a_{30}$＝$r^{10}$ ∴$a_{400}$÷$a_{300}$＝（$a_{40}$÷$a_{30}$）$^{10}$

    故選(B)(E)'
