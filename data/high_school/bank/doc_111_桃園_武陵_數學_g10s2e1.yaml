  stem: 設有五數成等差數列，其和是 20，積是 208，則此數列的公差可能的值為＿＿＿＿。
  answer:
  - $\pm \sqrt{3}$，$\pm \sqrt{17}$
  answer_status: verified
  answer_source: answer_key
  explanation: '設五數為 a－2d，a－d，a，a＋d，a＋2d

    $\begin{cases}(a-2d) + (a-d) +a+ (a+d) + (a+2d)=20 \\ (a-2d) (a-d)a (a+d) (a+2d)=208\end{cases}$

    ⇒ $\begin{cases}5a =20\ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots \ldots ① \\ a (a^{2}-d^{2}) (a^{2}-4d^{2})=208 \ldots \ldots \ldots \ldots \ldots ②\end{cases}$

    由①得 a＝4

    代入②得 4（$4^{2}$－$d^{2}$）（$4^{2}$－$4d^{2}$）＝208

    ⇒ （16－$d^{2}$）（4－$d^{2}$）＝13

    ⇒ $d^{4}$－$20d^{2}$＋51＝0 ⇒ （$d^{2}$－3）（$d^{2}$－17）＝0

    ⇒ $d^{2}$＝3 或 17 ⇒ d＝$\pm \sqrt{3}$或$\pm \sqrt{17}$

    故此數列的公差可能的值為$\pm \sqrt{3}$，$\pm \sqrt{17}$'
