- id: doc_111_桃園_武陵_數學_g10s2e1_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 設數列〈$a_{n}$〉滿足「$a_{1}$＝2 且對任意正整數 n，$a_{n＋2}$＝$2a_{n}$－$a_{n＋1}$ 恆成立」，當 $a_{2}$ 為下列哪些選項中的值時，能使數列〈$a_{n}$〉的前六項均為正數？
  options:
  - label: A
    content: $\frac{20}{11}$
  - label: B
    content: '2'
  - label: C
    content: $\frac{23}{11}$
  - label: D
    content: $\frac{11}{5}$
  - label: E
    content: $\frac{13}{5}$
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$a_{1}$＝2，$a_{2}$＝$\frac{20}{11}$

    $a_{3}$＝$2a_{1}$－$a_{2}$＝$2\times 2-\frac{20}{11}=\frac{24}{11}$

    $a_{4}$＝$2a_{2}$－$a_{3}$＝$2\times \frac{20}{11}-\frac{24}{11}=\frac{16}{11}$

    $a_{5}$＝$2a_{3}$－$a_{4}$＝$2\times \frac{24}{11}-\frac{16}{11}=\frac{32}{11}$

    $a_{6}$＝$2a_{4}$－$a_{5}$＝$2\times \frac{16}{11}-\frac{32}{11}=0$

    (B) ○：$a_{1}$＝2，$a_{2}$＝2

    $a_{3}$＝$2a_{1}$－$a_{2}$＝2×2－2＝2

    $a_{4}$＝$2a_{2}$－$a_{3}$＝2

    $a_{5}$＝$2a_{3}$－$a_{4}$＝2

    $a_{6}$＝$2a_{4}$－$a_{5}$＝2

    (C) ○：$a_{1}$＝2，$a_{2}$＝$\frac{23}{11}$

    $a_{3}$＝$2a_{1}$－$a_{2}$＝2×2－$\frac{23}{11}$＝$\frac{21}{11}$

    $a_{4}$＝$2a_{2}$－$a_{3}$＝$2\times \frac{23}{11}-\frac{21}{11}=\frac{25}{11}$

    $a_{5}$＝$2a_{3}$－$a_{4}$＝$2\times \frac{21}{11}-\frac{25}{11}=\frac{17}{11}$

    $a_{6}$＝$2a_{4}$－$a_{5}$＝$2\times \frac{25}{11}-\frac{17}{11}=\frac{33}{11}$

    (D) ○：$a_{1}$＝2，$a_{2}$＝$\frac{11}{5}$

    $a_{3}$＝$2a_{1}$－$a_{2}$＝$2\times 2-\frac{11}{5}=\frac{9}{5}$

    $a_{4}$＝$2a_{2}$－$a_{3}$＝$2\times \frac{11}{5}-\frac{9}{5}=\frac{13}{5}$

    $a_{5}$＝$2a_{3}$－$a_{4}$＝$2\times \frac{9}{5}-\frac{13}{5}=1$

    $a_{6}$＝$2a_{4}$－$a_{5}$＝$2\times \frac{13}{5}-1=\frac{21}{5}$

    (E) ╳：$a_{1}$＝2，$a_{2}$＝$\frac{13}{5}$

    $a_{3}$＝$2a_{1}$－$a_{2}$＝$2\times 2-\frac{13}{5}=\frac{7}{5}$

    $a_{4}$＝$2a_{2}$－$a_{3}$＝$2\times \frac{13}{5}-\frac{7}{5}=\frac{19}{5}$

    $a_{5}$＝$2a_{3}$－$a_{4}$＝$2\times \frac{7}{5}-\frac{19}{5}=-1$

    故選(B)(C)(D)'
