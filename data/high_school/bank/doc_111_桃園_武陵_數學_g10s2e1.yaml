- id: doc_111_桃園_武陵_數學_g10s2e1_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: '已知 x、y 的 5 筆數據如右表，且 y 對 x 的迴歸直線為$y =\frac{1}{2}x+3$，則：

    | x | 1 | 2 | 2 | 3 | 2 |

    | --- | --- | --- | --- | --- | --- |

    | y | 3 | 2 | 1 | a | 10 |

    (1) 數據 x 的變異數為＿＿＿＿。

    (2) 數據 y 的標準差為＿＿＿＿。'
  answer:
  - (1) $\frac{2}{5}$；(2) $\sqrt{10}$
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $\mu _{x}=\frac{1+2+2+3+2}{5}$＝2

    故數據 x 的變異數為 $\frac{(x_{1}-\mu _{x})^{2}+(x_{2}-\mu _{x})^{2}+(x_{3}-\mu _{x})^{2}+(x_{4}-\mu _{x})^{2}+(x_{5}-\mu _{x})^{2}}{5}$ ＝$\frac{x_{1}^{2}+x_{2}^{2}+x_{3}^{2}+x_{4}^{2}+x_{5}^{2}}{5}-\mu _{x}^{2}$＝$\frac{1^{2}+2^{2}+2^{2}+3^{2}+2^{2}}{5}-2^{2}$＝$\frac{22}{5}-4=\frac{2}{5}$

    (2) $\mu _{y}=\frac{3+2+1+a+10}{5}=\frac{a+16}{5}$，又μ$_{x}$＝2

    代入$y =\frac{1}{2}x+3$得$\frac{a+16}{5}$＝$\frac{1}{2}\times 2+3$ ⇒ a＝4，得μ$_{y}$＝4

    故數據 y 的標準差為$\sqrt{\frac{3^{2}+2^{2}+1^{2}+4^{2}+10^{2}}{5}-4^{2}}$＝$\sqrt{\frac{130}{5}-16} =\sqrt{10}$'
