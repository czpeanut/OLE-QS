- id: doc_111_桃園_武陵_數學_g10s2e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 設有一組成等差的數據 X：1，4，7，……，298，請選出正確的選項。
  options:
  - label: A
    content: 數據 X 的第 25 百分位數為 76
  - label: B
    content: 數據 X 的中位數大於或等於算術平均數
  - label: C
    content: 若將數據 X 的每筆數據都開根號，將使整體數據的標準差變小
  - label: D
    content: 若新增一筆數據，其值恰為數據 X 的算術平均數，將使整體數據的標準差變大
  - label: E
    content: 若刪除數據 X 中的第一筆數據，將使整體數據的標準差變小
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '等差的數據 X：1，4，7，……，298，共有$\frac{298-1}{3}+1$＝100 個數

    (A) ╳：100×25 ％＝25，表 $P_{25}$ 為第 25 個數

    ∴$P_{25}$＝1＋（25－1）×3＝73

    (B) ○：等差數列 $a_{1}$，$a_{2}$，……，$a_{100}$ 的中位數為$\frac{a_{50}+a_{51}}{2}$

    算術平均數為$\frac{a_{1}+a_{100}}{2}$，又 $a_{50}$＋$a_{51}$＝$a_{1}$＋$a_{100}$

    ∴中位數＝算術平均數

    (C) ○：$\sqrt{1} , \sqrt{4} , \sqrt{7} , \ldots \ldots , \sqrt{298}$相鄰兩項的差都變小

    ∴標準差變小

    (D) ╳：$\sigma _{X}=\sqrt{\frac{1}{100} 〔 (x_{1}-\mu _{X})^{2}+(x_{2}-\mu _{X})^{2}+\ldots \ldots +(x_{100}-\mu _{X})^{2} 〕}$

    $\sigma _{X}''=\sqrt{\frac{1}{101} 〔 (x_{1}-\mu _{X})^{2}+(x_{2}-\mu _{X})^{2}+\ldots \ldots +(x_{100}-\mu _{X})^{2}+(\mu _{X} -\mu _{X})^{2} 〕}$

    ∴σ$_{X}$''＜σ$_{X}$

    (E) ○：刪除第一筆數據使資料更集中 ∴標準差變小

    故選(B)(C)(E)'
