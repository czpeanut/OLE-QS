  stem: '已知複數 $z_{1}$＝1－2i，$z_{2}$＝3＋4i，試求下列各值：（(1)～(3)須以 a＋bi 形式表示）

    (1) $z_{1}$＋$z_{2}$＝＿＿＿＿。

    (2) $z_{1}$．$z_{2}$＝＿＿＿＿。

    (3) $\frac{z_{1}}{z_{2}}$＝＿＿＿＿。

    (4)∣$z_{1}^{2}$∣＝＿＿＿＿。'
  answer:
  - (1) 4＋2i；(2) 11－2i；(3) $-\frac{1}{5}-\frac{2}{5}i$；(4) 5
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $z_{1}$＋$z_{2}$＝（1－2i）＋（3＋4i）＝4＋2i

    (2) $z_{1}$．$z_{2}$＝（1－2i）．（3＋4i）＝3＋4i－6i＋8＝11－2i

    (3) $\frac{z_{1}}{z_{2}}$＝$\frac{1 - 2i}{3 + 4i}\times \frac{3 - 4i}{3 - 4i}$＝$\frac{3 - 4i - 6i - 8}{25}$＝$-\frac{1}{5}-\frac{2}{5}i$

    (4) ∵$z_{1}^{2}$＝（1－2i）$^{2}$＝1－4i－4＝－3－4i

    ∴∣$z_{1}^{2}$∣＝$\sqrt{( -3 )^{2}+( -4 )^{2}}$＝5'
