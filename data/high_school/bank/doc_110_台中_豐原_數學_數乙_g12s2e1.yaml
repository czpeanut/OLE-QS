    (1) $z \cdot \overline{z}$＝＿＿＿＿。（答案以 k 表示）

    (2) 若$\frac{1}{z}$的虛部為$\frac{1}{4}$，則 k＝＿＿＿＿。'
  answer:
  - (1) 4＋$k^{2}$；(2) －2
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 設 z＝2＋ki

    則$z \cdot \overline{z}$＝（2＋ki）（2－ki）＝4＋$k^{2}$

    (2) $\frac{1}{z}$＝$\frac{1}{2 +ki}\times \frac{2 -ki}{2 -ki}$＝$\frac{2 -ki}{4 +k^{2}}$，其虛部為$\frac{-k}{4 +k^{2}}$

    而$\frac{-k}{4 +k^{2}}$＝$\frac{1}{4}\Rightarrow$k＝－2'
