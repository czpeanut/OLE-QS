    II.世界上存在兩個國家：甲國與乙國，兩個國家各有2千名勞工。假設甲國與乙國只生產手機與電腦兩種商品，其中，甲國屬於已開發國家，甲國的每名勞工每天可生產10支手機或5台筆記型電腦（簡稱為筆電）；乙國則屬於發展中國家，乙國的每名勞工每天可生產3支手機或1台筆電。 然而隨著國際戰爭的開打，參戰國甲國原物料進口困難且人口減少，使得甲國的每名勞工每天只可生產8支手機。雖然甲國在手機產業技術沒有進步。但甲國某位經濟學者分析後認為，甲國與乙國仍可專業分工後再進行交易，如此一來將增加兩國手機與筆電的產量，也將提高兩國整體的經濟福祉。'
