  stem: f（x）為三次實係數多項式，若 1－i 為方程式 f（x）＝0 的一根，則下列敘述哪些正確？
  options:
  - label: A
    content: f（1＋i）＝0
  - label: B
    content: f（2＋i）≠0
  - label: C
    content: 沒有實數 x 滿足 f（$x^{3}$）＝x
  - label: D
    content: 沒有實數 x 滿足 f（$x^{5}$）＝0
  explanation: '(A)○：∵f（x）＝0 為一實係數多項式方程式，且 1－i 為方程式 f（x）＝0 的一根

    ∴1＋i 為其另一根

    故 f（1＋i）＝0

    (B)○：承(A) ∵第三根必為實根

    ∴f（2＋i）≠0

    (C)╳：方程式 f（$x^{3}$）－x＝0 為九次實係數多項式方程式，其至少有一實根

    (D)╳：方程式 f（$x^{5}$）＝0 為十五次實係數多項式方程式，其至少有一實根

    故選(A)(B)'
