- id: doc_112_新北_新北高中_數學_數甲_g12s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 如右圖，複數 z 在複數平面上對應的點 P 在單位圓 O 的內部，試問下列哪一個點最有可能是複數$\frac{1}{z^{2}}$所對應的點？
  options:
  - label: A
    content: A
  - label: B
    content: B
  - label: C
    content: C
  - label: D
    content: D
  - label: E
    content: E
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_112_新北_新北高中_數學_數甲_g12s2e2/s1_1_f1.png
    crop:
      page: 1
      rect:
      - 476.6
      - 127.8
      - 563.9
      - 213.2
  explanation: '令 z＝r（cosθ＋i sinθ）

    ∵P（z）在圓內

    ∴0＜r＜1，且 135°＜θ＜180°

    $\frac{1}{z^{2}}$＝$\frac{1}{r^{2} (\cos 2\theta +i\sin 2\theta )}$＝$\frac{1}{r^{2}} (\cos 2\theta -i\sin 2\theta )$＝$\frac{1}{r^{2}} 〔\cos (- 2\theta )+i\sin (- 2\theta )〕$

    又$\frac{1}{r^{2}}$＞1 且－360°＜－2θ＜－270°

    ∴複數$\frac{1}{z^{2}}$所對應的點在單位圓 O 的外部，且在第一象限

    故選(B)

    【另解】

    設複數 z＝a＋bi，其中－1＜a＜0，0＜b＜1 且∣a∣＞∣b∣

    $z^{2}$＝（a＋bi）$^{2}$＝（$a^{2}$－$b^{2}$）＋（2ab）i

    $\frac{1}{z^{2}}$＝$\frac{1}{(a^{2} -b^{2})+(2ab)i}$＝$\frac{a^{2} -b^{2}}{(a^{2} +b^{2})^{2}}+\frac{- 2ab}{(a^{2} +b^{2})^{2}}i$，其中

    ∵∣a∣＞∣b∣ ∴$a^{2}$－$b^{2}$＞0，－2ab＞0

    可知其對應的點位於第一象限

    故選(B)'
