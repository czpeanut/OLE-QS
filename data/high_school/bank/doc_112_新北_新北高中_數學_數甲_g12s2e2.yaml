  stem: 令 z＝$1 + \sqrt{3}i$，關於 z，$z^{2}$，$z^{3}$ 三點在複數平面上所形成的三角形面積是 ＿＿＿＿。
  explanation: 'z＝$1 + \sqrt{3}i$＝$2 \left( \frac{1}{2}+\frac{\sqrt{3}}{2}i \right)$＝2（cos60°＋i sin60°）

    $z^{2}$＝〔2（cos60°＋i sin60°）〕$^{2}$＝4（cos120°＋i sin120°）＝$- 2 + 2\sqrt{3}i$

    $z^{3}$＝〔2（cos60°＋i sin60°）〕$^{3}$＝8（cos180°＋i sin180°）＝－8

    設此三點在直角坐標平面分別表示為$A (1 , \sqrt{3})$，$B (- 2 , 2\sqrt{3})$，C（－8，0）

    則$\vec{AB}=(- 3 , \sqrt{3})$，$\vec{AC}=(- 9 , - \sqrt{3})$

    故所求為$\frac{1}{2} ∣ \left| \begin{matrix}- 3 & - 9 \\ \sqrt{3} & - \sqrt{3}\end{matrix} \right| ∣ = 6\sqrt{3}$'
