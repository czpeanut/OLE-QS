  stem: 設 a，b ∈ R，複數 $z_{1}$＝a＋i，$z_{2}$＝2－bi，若∣$z_{1}$∣＝2∣$z_{2}$∣，$\frac{z_{1}}{z_{2}}$的主輻角為π，試求數對（a，b）＝＿＿＿＿。
  explanation: '∵∣$z_{1}$∣＝2∣$z_{2}$∣$\Rightarrow\frac{∣ z_{1} ∣}{∣ z_{2} ∣}$＝$\left| \frac{z_{1}}{z_{2}} \right|$＝2，且$\frac{z_{1}}{z_{2}}$的主輻角為π

    ∴$\frac{z_{1}}{z_{2}}$＝2（cosπ＋i sinπ）＝－2

    $\frac{z_{1}}{z_{2}}$＝$\frac{a +i}{2 -bi}$＝－2

    $\Rightarrow$a＋i＝－4＋2bi

    ∵a，b 為實數

    ∴a＝－4，b＝$\frac{1}{2}$

    故數對（a，b）＝$\left( - 4 , \frac{1}{2} \right)$'
