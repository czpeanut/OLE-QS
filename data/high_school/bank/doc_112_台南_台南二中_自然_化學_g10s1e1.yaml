    content: $X_{2}$Y
  - label: D
    content: $X_{2}Y_{2}$
  - label: E
    content: $X_{3}Y_{4}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 假設乙分子式為$X_{a}Y_{b}$，則：$X_{3}$＋$3X_{a}Y_{b}$ → 2丙，則丙的表示式為X$_{\frac{3a+3}{2}}$Y$_{\frac{3b}{2}}$。又原子不可分割，且原子總數不超過6，故可得(a,b)＝(1,2)、(1,4)或(3,2)。故選(B)。
