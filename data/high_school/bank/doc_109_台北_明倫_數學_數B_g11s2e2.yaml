  explanation: $A^{2}A^{3}$＝$A^{5}$ ⇒ $A^{2}$＝$A^{5}$ ( $A^{3}$ )$^{－1}$＝$\left[ \begin{matrix}8 & 5 \\ 5 & 3\end{matrix} \right] \left[ \begin{matrix}3 & 2 \\ 2 & 1\end{matrix} \right] ^{-1}$＝－$\left[ \begin{matrix}8 & 5 \\ 5 & 3\end{matrix} \right] \left[ \begin{matrix}1 & -2 \\ -2 & 3\end{matrix} \right]$＝－$\left[ \begin{matrix}-2 & -1 \\ -1 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}2 & 1 \\ 1 & 1\end{matrix} \right]$ ⇒ $A^{4}$＝$\left[ \begin{matrix}2 & 1 \\ 1 & 1\end{matrix} \right] \left[ \begin{matrix}2 & 1 \\ 1 & 1\end{matrix} \right]$＝$\left[ \begin{matrix}5 & 3 \\ 3 & 2\end{matrix} \right]$
- id: doc_109_台北_明倫_數學_數B_g11s2e2_s3_5
  section: 3
  number: 5
  type: fill
  page: 1
  stem: 經實驗證實，每一隻好菌1秒可以吃掉一隻壞菌並增生為原來的兩倍，但同時間內剩餘的壞菌每1秒亦會繁殖為原來的兩倍。例如：現有1隻好菌、10隻壞菌，1秒後好菌變成2隻、壞菌18隻，2秒後好菌有4隻、壞菌32隻，以此類推。設n秒後好菌數以$a_{n}$表之，壞菌數以$b_{n}$表示，且設$\left[ \begin{matrix}a_{n+1} \\ b_{n+1}\end{matrix} \right] =\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right] \left[ \begin{matrix}a_{n} \\ b_{n}\end{matrix} \right]$，試求矩陣$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$。
  answer:
  - $\left[ \begin{matrix}2 & 0 \\ -2 & 2\end{matrix} \right]$
  answer_status: verified
  answer_source: answer_key
  explanation: 依題意可知$\begin{cases}a_{n+1}=2a_{n} \\ b_{n+1}=2(b_{n}-a_{n})\end{cases}$ ⇒ $\left[ \begin{matrix}a_{n+1} \\ b_{n+1}\end{matrix} \right] =\left[ \begin{matrix}2 & 0 \\ -2 & 2\end{matrix} \right] \left[ \begin{matrix}a_{n} \\ b_{n}\end{matrix} \right]$，故$\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right] =\left[ \begin{matrix}2 & 0 \\ -2 & 2\end{matrix} \right]$
- id: doc_109_台北_明倫_數學_數B_g11s2e2_s4_1
  section: 4
  number: 1
  type: calc
  page: 2
  stem: 設x，c為實數，方陣A＝$\left[ \begin{matrix}3 & 2 \\ -2 & x\end{matrix} \right]$、B＝$\left[ \begin{matrix}3 & -2 \\ 2 & x\end{matrix} \right]$。已知A的反方陣恰好是B的c倍（其中c≠0），則 (1) 試以x來表示A的反方陣。 (2) 求數對 ( x , c )。
