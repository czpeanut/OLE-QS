  stem: 已知A為二階方陣，滿足$A^{3}$＝$\left[ \begin{matrix}3 & 2 \\ 2 & 1\end{matrix} \right]$且$A^{5}$＝$\left[ \begin{matrix}8 & 5 \\ 5 & 3\end{matrix} \right]$，試求矩陣$A^{4}$。
