- id: doc_109_台北_明倫_數學_數B_g11s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 設A＝$\left[ \begin{matrix}3 & 2 \\ 1 & 1\end{matrix} \right]$，B＝$\left[ \begin{matrix}2 & 6 \\ 3 & k\end{matrix} \right]$，若 ( A＋B )$^{2}$＝$A^{2}$＋2AB＋$B^{2}$，則k值為下列哪一選項？
  options:
  - label: A
    content: －6
  - label: B
    content: －5
  - label: C
    content: －4
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 因為 ( A＋B )$^{2}$＝$A^{2}$＋2AB＋$B^{2}$，所以AB＝BA ⇒ $\left[ \begin{matrix}3 & 2 \\ 1 & 1\end{matrix} \right] \left[ \begin{matrix}2 & 6 \\ 3 & k\end{matrix} \right] =\left[ \begin{matrix}2 & 6 \\ 3 & k\end{matrix} \right] \left[ \begin{matrix}3 & 2 \\ 1 & 1\end{matrix} \right]$ ⇒ $\left[ \begin{matrix}12 & 18+2k \\ 5 & 6+k\end{matrix} \right] =\left[ \begin{matrix}12 & 10 \\ 9+k & 6+k\end{matrix} \right]$ ⇒ $\begin{cases}18+2k=10 \\ 5=9+k\Rightarrow k=-4\end{cases}$，故選(C)
