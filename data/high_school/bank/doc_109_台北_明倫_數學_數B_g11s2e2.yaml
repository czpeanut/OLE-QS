  answer_source: answer_key
  explanation: $A^{2}$＝$\left[ \begin{matrix}0 & -1 \\ 1 & -1\end{matrix} \right] \left[ \begin{matrix}0 & -1 \\ 1 & -1\end{matrix} \right] =\left[ \begin{matrix}-1 & 1 \\ -1 & 0\end{matrix} \right]$ ⇒ $A^{3}$＝$\left[ \begin{matrix}-1 & 1 \\ -1 & 0\end{matrix} \right] \left[ \begin{matrix}0 & -1 \\ 1 & -1\end{matrix} \right] =\left[ \begin{matrix}1 & 0 \\ 0 & 1\end{matrix} \right]$＝Ｉ ⇒ $A^{101}$＝( $A^{3}$ )$^{33}A^{2}$＝$I^{33}A^{2}$＝$A^{2}$＝$\left[ \begin{matrix}-1 & 1 \\ -1 & 0\end{matrix} \right] =\left[ \begin{matrix}a & b \\ c & d\end{matrix} \right]$ ⇒ b＝1，故選(D)
