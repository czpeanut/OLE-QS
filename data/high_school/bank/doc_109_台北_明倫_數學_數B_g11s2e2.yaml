- id: doc_109_台北_明倫_數學_數B_g11s2e2_s3_2
  section: 3
  number: 2
  type: fill
  page: 1
  stem: 已知A、B均為二階方陣，若A－B＝$\left[ \begin{matrix}-2 & 0 \\ 3 & 3\end{matrix} \right]$且A＋B＝$\left[ \begin{matrix}2 & 2 \\ 1 & 3\end{matrix} \right]$，試求矩陣$A^{2}$－$B^{2}$。
  answer:
  - $\left[ \begin{matrix}-1 & 1 \\ 8 & 12\end{matrix} \right]$
  answer_status: verified
  answer_source: answer_key
  explanation: A＝$\frac{1}{2}$( ( A－B )＋( A＋B ) )＝$\frac{1}{2}(\left[ \begin{matrix}-2 & 0 \\ 3 & 3\end{matrix} \right] +\left[ \begin{matrix}2 & 2 \\ 1 & 3\end{matrix} \right] )=\frac{1}{2}\left[ \begin{matrix}0 & 2 \\ 4 & 6\end{matrix} \right] =\left[ \begin{matrix}0 & 1 \\ 2 & 3\end{matrix} \right]$， B＝$\frac{1}{2}$( ( A＋B )－( A－B ) )＝$\frac{1}{2}-(\left[ \begin{matrix}2 & 2 \\ 1 & 3\end{matrix} \right] -\left[ \begin{matrix}-2 & 0 \\ 3 & 3\end{matrix} \right] )=\frac{1}{2}\left[ \begin{matrix}4 & 2 \\ -2 & 0\end{matrix} \right] =\left[ \begin{matrix}2 & 1 \\ -1 & 0\end{matrix} \right]$ ⇒ $A^{2}$＝$\left[ \begin{matrix}0 & 1 \\ 2 & 3\end{matrix} \right] \left[ \begin{matrix}0 & 1 \\ 2 & 3\end{matrix} \right]$＝$\left[ \begin{matrix}2 & 3 \\ 6 & 11\end{matrix} \right]$，$B^{2}$＝$\left[ \begin{matrix}2 & 1 \\ -1 & 0\end{matrix} \right] \left[ \begin{matrix}2 & 1 \\ -1 & 0\end{matrix} \right]$＝$\left[ \begin{matrix}3 & 2 \\ -2 & -1\end{matrix} \right]$ ⇒ $A^{2}$－$B^{2}$＝$\left[ \begin{matrix}2
    & 3 \\ 6 & 11\end{matrix} \right]$－$\left[ \begin{matrix}3 & 2 \\ -2 & -1\end{matrix} \right]$＝$\left[ \begin{matrix}-1 & 1 \\ 8 & 12\end{matrix} \right]$
