- id: doc_110_高雄_三民_自然_生物_g10s1e1_s3_42
  section: 3
  number: 42
  type: single
  page: 5
  stem: 囊泡膜主要由什麼成分構成？
  options:
  - label: A
    content: 磷脂質＋三酸甘油酯
  - label: B
    content: 磷脂質＋蛋白質
  - label: C
    content: 三酸甘油酯＋蛋白質
  - label: D
    content: 磷脂質＋三甘油酯＋蛋白質
  group_stem: ◎ 城市間有公路系统來運輸，人的器官之間有心血管系統在協助運輸，那細胞內呢？是只要擴散就好，還是也需要有運輸的工具呢？ 細胞膜選擇性地讓物質進出細胞，以利細胞內生理作用正常進行，然而特定胞器製造出來的蛋白質與物質，因為分子大而多數不能直接通過膜，須由單層膜的囊泡，將物質包裹在囊泡內或是鑲嵌在囊泡膜上，透過融入特定的膜胞器或細胞膜來進行運輸。 囊泡運輸的物質有兩類，其一為囊泡膜上的膜蛋白和脂類分子，主要用於信號傳遞或細胞中膜成分的新陳代謝；其二為囊泡的內含物，包括荷蒙、酵素、胰島素、神經傳導物質等，在細胞內膜系統的胞器之間執行特定功能，或經分泌到細胞外後調節其他細胞的功能。 整體來說胞器就好比是工廠，製作出很多的「分子貨物」，而囊泡就是運輸的交通工具，穿梭在細胞內運送物質。一旦囊泡運輸機制出了狀況，則整個細胞內就會失序大亂，引發經紊亂、免疫系統紊亂、糖尿病等問題。 【資料參考：李芳仁（2014）細胞生命的重要基礎：囊泡運輸研究。臺大校友雙月刊，93】
  shared_asset: g3_42_44
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
