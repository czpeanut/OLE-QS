  stem: 根據以上資訊判斷，騰騰在跑步時頭痛的原因最可能與以下何者相同？
  options:
  - label: A
    content: 登山時，因氣壓降低所引起的輕微高山症
  - label: B
    content: 因乳酸發酵，由腦細胞所產生的乳酸累積引起頭部不適
  - label: C
    content: 長時間緊盯電腦螢幕
  - label: D
    content: 因酒精發酵，由腦細胞所產生的酒精累積引起頭部不適
  group_stem: '◎ <u>騰騰</u>在接受了體適能測驗的1600 m跑走測驗後，不僅頭痛、小腿痠痛，更氣喘如牛久久不能說話。他決定痛定思痛，用「科學」的方式讓自己為下一次的體適能測驗做好準備。騰騰上網找了一些有關健身的資料後，開始分析自己在測驗當天身體可能發生了什麼事。 資料A：《跑步都是有氧運動？》 不常跑步的人，剛開始跑較長距離（800 m以上）的慢跑時，常在中途感到頭部脹痛、小腿開始變痠、甚至是嚴重到無法邁開步伐。 這是因為當身體在激烈運動時，血液裡頭的氧氣含量降低，使得肌肉細胞無法僅以有氧呼吸供給能量，而開始進行發酵作用（LT1）。而血氧過低導致腦中氧氣不足而引起頭痛，同時身體進行發酵作用的副產物開始累積（LT2）導致痠痛甚至是無法動彈。因此，我們可以透過監測血液中，其副產物的濃度來評估運動的激烈程度。附圖為人體在不同運動強度下，副產物濃度在血液中的變化。 資料B：《跑步這樣練》 人類跑步時可能會進行有氧以及無氧的運動，所以當想要訓練跑步的能力時，可以從以下幾種方式進行。 1.提升心肺功能，讓更大量的氧氣進入血液之中，將無氧運動的發生時機延緩。 2.提升身體的無氣運動副產物的代謝能力，以多次全速跑步的間歇訓練提升肌肉的耐受度。

    於LT1「有氧閾值」時：身體所產生的ATP絕大部分來自呼吸作用。於LT2「無氧閾值」時：身體所產生的ATP已有相當的一部分來自發酵作用，但身體排除副產物與副產物產生的速率達到平衡。'
  shared_asset: g3_47_48
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
