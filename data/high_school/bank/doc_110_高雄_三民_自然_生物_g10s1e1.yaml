  - label: D
    content: 高基氏體
  group_stem: ◎ 阿茲海默症（Alzheimer' sdisease，簡稱為AD）是最普遍的失智症類型，且通常在老年時期發生。患者一般在初期病徵發生的十年內死亡。 AD形成原因有許多，一般認為主要原因是腦內的β-類澱粉蛋白（β-amyloid, Aβ）累積。β-類澱粉蛋白是類澱粉前驅蛋白（amyloid precursor protein）受到β-分泌酶（beta-secretase）與γ-分泌酶（gamma-secretase）裁切後形成，通常會進一步分解，但在阿茲海默症患者體內，β-類澱粉蛋白會堆積在神經元周遭，最後導致細胞死亡、大腦退化，一直以來，多數科家認為β-類澱粉蛋白是AD的主要病因。 近年來，數十項研究顯示，AD患者體內有大量類唐氏症的細胞。俄羅斯研究人員在2009年發表的研究指出，阿茲海默症患者腦中的神經元有高達15%多一條第21號染色體。科學家透過小鼠研究發現：當正常細胞接觸到β-類澱粉蛋白，在細胞分裂時容易出錯而製造更多擁有三條第21號染色體的細胞，隨之產生更多斑塊。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
