  stem: 下列有關文中所提及離子濃度，總量的敘述，何者正確？
  options:
  - label: A
    content: 靜止狀態的骨骼中，細胞質液的$Ca^{2＋}$濃度明顯高於肌漿網中
  - label: B
    content: 和靜止狀態相比較，收縮循環時細胞質液中$Ca^{2＋}$總量可增加數十倍以上
  - label: C
    content: 附圖，所測得細胞質液的pH值，在通入定量氧氣後，約降至7.6
  - label: D
    content: 正常有氧呼吸時，膜間腔的$H^{＋}$濃度較粒線體基質高，約為後者的7.8／6.8倍
  group_stem: ◎ 在使用吸入性麻醉劑和去極化神經肌肉阻斷劑進行麻醉的過程中，約有25萬分之一至萬分之一的機率會誘發「惡性高熱（malignant hyperthermia）」：體溫急遽升高（每5分鐘升高1-2℃，可超過42℃）、肌肉強直（myotonic dystrophy）、心跳呼吸加速、高血鉀、横紋肌溶解等症狀。若未經過適當處置，致死率高達八成，是患者和醫療人員的噩夢。 常造成體溫急遽升高和肌肉強直的直接因素是$Ca^{2＋}$的分布不當和細胞能量代謝異常，而正常有氧呼吸時，亦涉及$H^{＋}$在粒線體的分布、移動。 骨骼肌組織的$Ca^{2＋}$分布可分為：細胞外、細胞質液和肌漿網（sarcoplasmic reticulum，骨骼肌細胞內特化的內質網）三部分。静止狀態的骨骼肌細胞中，細胞質液的$Ca^{2＋}$濃度為0.1～0.2 mM，肌漿網內平時即儲存大量$Ca^{2＋}$（4～6 mM），肌漿網膜上的蘭諾定受體（ryanodine receptors）控制$Ca^{2＋}$的釋出。當神經衝動傳至骨骼肌時，$Ca^{2＋}$經蘭諾定受體釋出，使細胞質液的$Ca^{2＋}$濃度達10 mM以上，骨骼肌細胞進入收縮循環，即是肌肉收縮。維持收縮循環需要的ATP和夠高濃度的$Ca^{2＋}$，肌漿網膜上蛋白質可藉主動運輸回收$Ca^{2＋}$調節濃度。 多達70%的「惡性高熱」患者，蘭諾定受體具有缺陷，被誘發「惡性高熱」時，缺陷的蘭諾定受體造成細胞質液中持續維持高濃度$Ca^{2＋}$，收縮循環無法停止、持續消耗ATP。 目前治療「惡性高熱」的藥物：單挫林（Dantrolene）可抑制蘭諾定受體，有效降低惡性高熱的死亡率降至5%以下。 有氧呼吸時的粒線體，除了氧的需求外，也有明顯$H^{＋}$分布的變化：早期學者分離出具有活性的粒線體，先置於無氧的溶液中，又因粒體外膜對$H^{＋}$通透性高，在溶液中測量pH值，可得知粒線體膜間腔（Intermembrane Space，粒線體內外膜之間）的$H^{＋}$移動趨勢。附圖為在原先無氧溶液中，通入定量氧氣後（附圖中箭頭所指），溶液中pH值變化情形。（近期學者設計實驗測$H^{＋}$的分布情形：正常有氧呼吸時，細胞質液pH：7.6，膜間腔pH：6.8，粒線體基質pH：7.8。）
  shared_asset: g3_45_46
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
