      - 737.35
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)減少產物濃度，則逆反應速率應變慢。

    (B)增大反應物濃度的瞬間，正反應速率變快，逆反應則不變。

    (C)化學平衡時，正反應速率和逆反應速率應相等。

    (D)平衡狀態不同，反應物濃度會改變。

    (E)定溫下，平衡常數不變。'
