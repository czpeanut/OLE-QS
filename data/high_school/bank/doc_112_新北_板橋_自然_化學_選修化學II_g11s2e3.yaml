  number: 4
  type: single
  page: 1
  stem: AgCl 與 $Ag_{2}CrO_{4}$ 的溶度積分別為 1.8×$10^{－10}$ 與 2.5×$10^{－12}$。某溶液含 0.1 M $Cl^{－}$ 與 0.1 M $CrO_{4}^{2－}$，若欲利用離子沉澱法滴定分離 $Cl^{－}$ 與 $CrO_{4}^{2－}$ 離子（設滴定時溶液體積沒變化），則平衡時 [$Ag^{＋}$] 的理想濃度應為多少？
  options:
  - label: A
    content: '[$Ag^{＋}$]＜2.5×$10^{－12}$ M'
  - label: B
    content: 1.8×$10^{－10}$ M ≥ [$Ag^{＋}$]＞2.5×$10^{－12}$ M
  - label: C
    content: 5.0×$10^{－6}$ M ≥ [$Ag^{＋}$]＞1.8×$10^{－9}$ M
  - label: D
    content: '[$Ag^{＋}$]＞5.0×$10^{－6}$ M'
  - label: E
    content: '[$Ag^{＋}$]＝2.0×$10^{－4}$ M'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'AgCl 沉澱所需 [$Ag^{＋}$]：

    1.8×$10^{－10}$＝0.1×[$Ag^{＋}$] ⇒ [$Ag^{＋}$]＝1.8×$10^{－9}$ M

    $Ag_{2}CrO_{4}$ 沉澱所需 [$Ag^{＋}$]

    2.5×$10^{－12}$＝0.1×[$Ag^{＋}$]$^{2}$ ⇒ [$Ag^{＋}$]＝5.0×$10^{－6}$ M'
- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 實驗桌上有一杯蔗糖水溶液和一杯食鹽水溶液。下列實驗操作，何者不適合用來分辨這兩種溶液？
  options:
  - label: A
    content: 測導電度
  - label: B
    content: 比較焰色反應
  - label: C
    content: 測 pH 值
  - label: D
    content: 添加硝酸銀水溶液檢驗
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)食鹽為電解質其水溶液可導電，蔗糖則否。

    (B)食鹽中的某些金屬離子具有獨特的焰色，例如：鈉的焰色為黃色，蔗糖則不具特殊焰色。

    (C)兩者皆為中性，無法以測 pH 值分辨。

    (D)食鹽水與硝酸銀反應可生成白色氯化銀沉澱物，蔗糖則否。'
