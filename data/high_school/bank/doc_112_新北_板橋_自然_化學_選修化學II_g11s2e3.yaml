- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關平衡與平衡常數 K 值之敘述，何者正確？
  options:
  - label: A
    content: K 值大，表示正反應速率快
  - label: B
    content: K 值大，表示反應為放熱反應
  - label: C
    content: K 值大，表示正反應速率常數 k 很大
  - label: D
    content: 平衡時正、逆反應速率常數相等
  - label: E
    content: 平衡時，正、逆反應仍在進行
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)平衡常數與反應速率無直接關係。

    (B)平衡常數與反應熱無關。

    (C)平衡常數與正反應速率常數無直接關係。

    (D)平衡時正、逆反應速率相等。

    (E)化學平衡屬於動平衡，正、逆反應仍在進行。'
- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 在定溫時，下列何種狀態不屬於平衡狀態？
  options:
  - label: A
    content: 密閉寶特瓶中有半瓶水與水蒸氣
  - label: B
    content: 石門水庫的水位保持不變
  - label: C
    content: 飽和碘酒溶液中存在固態碘
  - label: D
    content: 製造氨氣，反應瓶內壓力保持不變
  - label: E
    content: 氯化銀溶液中，氯離子濃度保持不變，且固態氯化銀質量不變
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)密閉寶特瓶中氣、液相達平衡。

    (B)水庫不是密閉系統，不屬於平衡狀態。

    (C)溶液中碘的沉澱與溶解達平衡。

    (D)壓力保持不變，則系統中正、逆反應速率相等。

    (E)系統中物質的量不變，則已達平衡。'
- id: doc_112_新北_板橋_自然_化學_選修化學II_g11s2e3_s1_4
