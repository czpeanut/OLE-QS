  stem: 瑞士的工會發起公投案，希望能將基本時薪調高到全球最高水準的22瑞士法郎（相當於新臺幣700多元），以因應當地的高昂物價，維持勞工的基本生活開銷。不過，該案最後以懸殊的票數差距遭到否決。請問瑞士人否決該案最可能的理由為何？
  options:
  - label: A
    content: 瑞士人幾乎全都是企業主，不樂見基本時薪調高
  - label: B
    content: 基本時薪提高雖能保障弱勢，但會傷害其他勞工
  - label: C
    content: 會造成瑞士的勞動市場供過於求，工作機會減少
  - label: D
    content: 政府制定基本時薪將會限制勞資雙方的契約自由
