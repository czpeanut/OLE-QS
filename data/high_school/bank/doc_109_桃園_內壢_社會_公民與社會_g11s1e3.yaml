- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2020年6月底，臺灣汽車貨運暨倉儲業產業工會公布近幾年違反《勞動基準法》的貨運業者，其中高達50多家未依法給付加班費，甚至有些業者漠視勞工超時工作現象。工會認為，單純開罰對這些企業不痛不癢，中央相關部門應提出具體可保護勞工的作法。依我國現行相關法律規定，下列選項何者正確？
  options:
  - label: A
    content: 文中所述的中央相關部門為行政院消費者保護會
  - label: B
    content: 業者應落實契約自由，加班費應依員工效率而定
  - label: C
    content: 為落實工作平等，所有行業皆應限制相同的工時
  - label: D
    content: 若開罰金額小於業者付的加班費，違規現象將難以改善
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 每年暑假期間都會有許多學生打工賺取生活費用，因此各地勞工局都會針對飲料店、加油站、便利商店等熱門打工行業，就工資、工時、休息、例休假等規定啟動專案勞檢。而2020年的暑假，又因新冠肺炎疫情的影響，相較全職勞工較為弱勢的部分工時勞工，可能會優先被減班或解僱。有關上文之描述，下列敘述何者正確？
  options:
  - label: A
    content: 工讀生由於打工期短，不須遵守《勞動基準法》規定
  - label: B
    content: 工讀生每日工時不得超過8小時，薪水僅得領最低薪資
  - label: C
    content: 因疫情導致勞動市場出現供不應求，迫使工讀生被減班
  - label: D
    content: 勞工局的專案勞檢目的為維持契約正義、避免資方剝削
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 手機應用程式的消費糾紛層出不窮，例如之前很紅的變臉「FaceApp」也暗藏陷阱：雖可免費試用3天，但如果沒在訂閱期結束前24小時取消訂閱，就會自動續訂，並收取990元的年費。試問相關單位採取下列何種措施，「最無助於」減少消費者「被自動續約」的情形發生？
  options:
  - label: A
    content: 與業者溝通將試用期間延長至7天
  - label: B
    content: 加強宣導申訴管道與救濟行為
  - label: C
    content: 強制業者於定型化契約中揭露資訊
  - label: D
    content: 針對特種交易加強關注與追蹤
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 據報載，小Y在戴藍牙耳機講電話時，突然砰一聲當場被耳機炸傷耳朵，送醫時好幾處傷口止不住血，而這款耳機是在「橘子公司」的經銷商店所購買的。有關該新聞之描述，依我國《消費者保護法》之規定，下列選項何者較為正確？
  options:
  - label: A
    content: 該耳機是在實體商店購買，因此得以享有無過失責任的賠償
  - label: B
    content: 小Y須有廠商「製造過失」的證明，橘子公司才須進行賠償
  - label: C
    content: 若經證明廠商有重大過失，以橘子公司須填補小Y損害為原則
  - label: D
    content: 耳機設計者可能也須連帶賠償，是因為雙方之間資訊不對等
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小王跟國華的妻子發生性行為被抓到之後，在國華暴力的脅迫下簽了和解書，和解金額高達1千萬元。小王的律師表示，該案和解金額是天價，不符合一般和解金的價格，將透過相關法律撤銷該和解書，避免國華獅子大開口。有關以上個案，下列敘述何者較為正確？
  options:
  - label: A
    content: 小王的律師可用趁他人之急迫為由，撤銷或減輕國華的和解金
  - label: B
    content: 由於小王的行為違法，依據契約自由的精神，和解金可任意訂定
  - label: C
    content: 律師所稱欲採進一步行為的相關法律依據，應為《公平交易法》
  - label: D
    content: 雙方針對和解金額多寡的爭議，應透過簽訂定型化契約解決
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 大法官在2020年5月做出釋字第791號，宣告通姦除罪化，但有人指出，「如果夫妻婚後其中一方沒工作、名下亦無財產，卻背叛他方，受害的配偶恐怕不敢主張離婚。」下列哪個選項，最適合說明此現象？
  options:
  - label: A
    content: 受害配偶請求民事賠償，強制執行會因對方無財產而沒有結果
  - label: B
    content: 民事賠償的強制執行效力不若刑事上易科罰金
  - label: C
    content: 若為法定財產制，請求裁判離婚可能反被出軌者行使剩餘財產分配請求權索討婚後財產
  - label: D
    content: 若為法定財產制，請求裁判離婚後反須付給出軌者大量慰撫金
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 《消費者保護法》在2015年6月經立法院三讀通過修正後，規定通訊交易於合理例外的情況下可以排除7日猶豫期。下列情形皆發生於交易成立後7日之內，何者是屬於「通訊交易」，且依據相關準則「無法退貨」？
  options:
  - label: A
    content: 小美在百貨公司購買修改後的衣服，回家後發現還是不符
  - label: B
    content: 小麗在蛋糕店鋪購買網路人氣冠軍蛋糕，食用後不合胃口
  - label: C
    content: 阿南在網路商店購買電動刮鬍刀，試用後覺得不順想退貨
  - label: D
    content: 阿民在網路商店購買昂貴的筆電，檢查之後發現顏色不對
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 臺東一名婦人，因乳癌必須切除半邊乳房，他擔心未來丈夫不再愛他而拒絕手術，但他的丈夫與他簽訂「愛情契約」，保證永遠愛他，若拋棄他就須將收入的一半都給他。幾年後，婦人的丈夫移情別戀，他持著當時的契約提起告訴，最後法官判丈夫日後都要將薪水的一半給他。請問上述新聞表現出《民法》的哪項原則？
  options:
  - label: A
    content: 契約自由
  - label: B
    content: 誠信原則
  - label: C
    content: 過失責任
  - label: D
    content: 所有權保障
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 隨著疫情趨緩，行政院在2020年夏季推出振興三倍券，必須在2020年底前使用完畢。對此，消費者文教基金會表示，三倍券應依法律之規定，若在期限前未使用完畢，應退全額現金。請問，下列何者是消費者文教基金會所提及的法律規定？
  options:
  - label: A
    content: 《公平交易法》有關結合行為之規定
  - label: B
    content: 《消費者保護法》有關定型化契約之規定
  - label: C
    content: 《公平交易法》有關聯合行為之規定
  - label: D
    content: 《消費者保護法》有關特種交易之規定
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 小安在超商當店員，簽訂勞動契約時，公司與他約定「每日加班不得超過2小時，若加班僅能擇日補休，不提供加班費」。小安回去查了勞基法，瞭解到「一日總工時（正常工時及加班延長工時）不得超過12小時」，「勞工每次加班後雇主應給付加班費，除非勞工有意選擇以補休代替該次加班費」，以下敘述何者正確？
  options:
  - label: A
    content: 契約中約定一日總工時不可以超過十小時，此約定因優於勞基法而無效
  - label: B
    content: 補休優於加班費，小安與超商的契約可優於勞基法，故可約定僅能補休
  - label: C
    content: 勞基法是勞工享受權益的最高標準，勞雇雙方自可依契約自由另為約定
  - label: D
    content: 超商與小安關於僅能補休、不提供加班費的約定，因違反勞基法而無效
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 小球與小果交往多年後結婚，兩人未約定婚姻財產制。經雙方商討後，小果決定放棄他原本的工作全心操持家務，小球則是在婚後事業蒸蒸日上，不過，也因天天應酬導致夫妻感情生變，兩人在結婚數年後離婚。以下是兩人離婚爭執時的對話，何者對於夫妻財產制有正確的觀念？
  options:
  - label: A
    content: 小球：既然每月有給你自由處分金，離婚後就可以不用再分財產給你
  - label: B
    content: 小果：你結婚前買的房子，離婚後我也是可以要求轉讓一半的所有權
  - label: C
    content: 小球：我結婚後買的高檔名錶是我的特有財產，不宜計算在婚後財產
  - label: D
    content: 小果：我爸媽去世後我所繼承的大筆遺產，離婚後完全不用跟你分配
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 表格為小芳與阿邦婚前、婚後的財產總表。假設除表列之外皆無其他財產與負債，雙方也就最高可請求金額進行分配，請問雙方離婚之後，財產的分配過程或結果為何？
  options:
  - label: A
    content: 小芳可向阿邦請求50萬元
  - label: B
    content: 阿邦可向小芳請求25萬元
  - label: C
    content: 小芳離婚後總財產為275萬元
  - label: D
    content: 阿邦離婚後淨財產為275萬元
