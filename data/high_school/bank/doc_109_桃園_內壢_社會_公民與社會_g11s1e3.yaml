  stem: 世界貿易組織（WTO）允許會員國之間簽訂自由貿易協定（FTA），在不提高對外貿易壁壘的前提之下，FTA締約會員國之間可以進一步降低關稅與消除貿易壁壘。請問FTA之簽訂排除了WTO哪項原則之適用性？
  options:
  - label: A
    content: 多邊談判原則
  - label: B
    content: 公平競爭原則
  - label: C
    content: 國民待遇原則
  - label: D
    content: 最惠國待遇原則
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_42
  section: 1
  number: 42
  type: single
  page: 5
  stem: 美國認為印度補貼鋼鐵產品，遂針對印度調高進口關稅，遭到印度上訴WTO。WTO經過2年調查後，認定美國違規，導致印度貿易收入因為不公平的待遇而減少。請問下列相關敘述何者正確？
  options:
  - label: A
    content: 進口產品相當便宜時，調高關稅才能維持公平競爭
  - label: B
    content: 美國調高關稅有利自身業者，故違反國民待遇原則
  - label: C
    content: 美國調高關稅不利印度，但能提高美國的經濟福祉及就業率
  - label: D
    content: 美國必須服從WTO的裁決結果，以避免遭到懲罰
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_43
  section: 1
  number: 43
  type: single
  page: 5
  stem: 雖然俄羅斯已在2012年加入WTO，但當地進口汽車仍受限頗多，而且進口車每輛須繳交700美元的「廢棄處理費用」。若俄羅斯與美國協商後，同意進口美國車可減免20％的廢棄處理費用，請問根據WTO的相關協議，其他WTO會員國出口汽車到俄羅斯時，每輛須繳交多少美元的廢棄處理費用？
  options:
  - label: A
    content: '140'
  - label: B
    content: '420'
  - label: C
    content: '560'
  - label: D
    content: '700'
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_44
