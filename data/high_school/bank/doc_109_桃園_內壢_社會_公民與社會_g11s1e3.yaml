- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_45
  section: 1
  number: 45
  type: single
  page: 5
  stem: 對中國大陸水泥反傾銷一案，嘉泥副總王立心表示，若財政部對中國大陸進口水泥作出反傾銷稅的最終判決，嘉泥將把進貨廠商由原先的中國海螺水泥改為國內的臺泥、亞泥。請問下列敘述何者「錯誤」？
  options:
  - label: A
    content: 我國可以限制中國大陸的水泥進口配額
  - label: B
    content: 我國對進口水泥採取配額限制，會遭到國內水泥廠商的反對
  - label: C
    content: 若中國大陸對水泥出口補貼造成我國廠商受害，我國可課徵反傾銷稅
  - label: D
    content: 嘉泥考慮更改進貨廠商，主要因為反傾銷稅會增加進口中國大陸水泥的成本
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s2_46
  section: 2
  number: 46
  type: multiple
  page: 5
  stem: 某公司因景氣不佳，要求員工減薪。員工認為該公司並未虧損，不應減薪。該公司工會出面與老闆協商，老闆出示員工受雇時簽訂的契約，契約記載員工不能授權給工會代替其談判薪資，且不可以罷工，因此拒絕與工會協商，該工會乃發動罷工。此事件涉及的勞動權利，下列敘述哪些正確？
  options:
  - label: A
    content: 罷工常會造成勞資雙方損失，因此該公司的契約對於勞方並非不利
  - label: B
    content: 勞資雙方因為經濟實力不平等，應該有工會協助勞工進行薪資協商
  - label: C
    content: 基於私法自治原則，工會的罷工行為因為明確違反勞動契約而無效
  - label: D
    content: 契約條款明訂員工不能授權工會進行薪資談判，工會談判行為無效
  - label: E
    content: 該公司與員工簽訂的契約內容違反勞動相關法規，其契約因而無效
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s2_47
  section: 2
  number: 47
  type: multiple
  page: 5
  stem: 將一國國內生產毛額（GDP）除以該國的總人口數，即為平均每人國內生產毛額（平均每人GDP），用來代表一國人民的經濟福祉。但是，人民的經濟福祉不應只由享有的商品或服務價值來衡量，所以聯合國和世界銀行推出綠色國民所得，盡可能納入更多衡量指標，作為經濟福祉指標的修正。在其他條件不變下，下列何者將提高平均每人GDP？
  options:
  - label: A
    content: 人口成長率增加
  - label: B
    content: 移轉性支出增加
  - label: C
    content: 經濟成長率增加
  - label: D
    content: 平均工資提高
  - label: E
    content: 環境品質提昇
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s2_48
  section: 2
  number: 48
  type: multiple
  page: 5
  stem: 大圓國地方首長開心對外宣布，外國菸商將到當地設立工廠，開始生產香菸販售之後，連同出口的部分，一年將可以為國家創造數千萬元的GDP，對國家帶來重大貢獻。數個民間團體反對這項計畫，批評外國菸廠的「貢獻」並沒有該首長所說的GDP數字那麼多。請問下列哪些可能是民間團體所持的理由？
  options:
  - label: A
    content: 出口的香菸屬於國外的消費，不計入大園國的GDP
  - label: B
    content: 工廠屬外國菸商所有，其產出不計入大園國的GDP
  - label: C
    content: 工廠生產香菸所帶來的環境汙染，並不會計入GDP
  - label: D
    content: 計算GDP時，不考量香菸對消費者健康造成的影響
  - label: E
    content: 香菸有爭議性，屬於地下經濟，其產值不計入GDP
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s2_49
  section: 2
  number: 49
  type: multiple
  page: 6
  stem: 若國際食用油市場有甲乙丙三國，甲乙兩國每年都從國進口食用油，但甲乙兩國間並無食用油貿易。乙國發生假油事件，使其國產食用油銷售量慘跌，並使得由丙國進口數量大增，導致丙國食用油的國內及出口價格攀升。根據以上條件，有關三國食用油市場消費者與生產者剩餘和社會福祉的變動，下列敘述哪些正確？
  options:
  - label: A
    content: 甲國消費者剩餘上升
  - label: B
    content: 甲國生產者剩餘上升
  - label: C
    content: 乙國生產者剩餘下降
  - label: D
    content: 丙國消費者剩餘下降
  - label: E
    content: 兩國的社會福祉下降
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s2_50
  section: 2
  number: 50
  type: multiple
  page: 6
  stem: '某甲因婚期將至，於是親自到家具行選購多套家具，商定送貨日期並完成付款後就離去，但隔日家具送達後，某甲心生後悔，於是以「猶豫期」的規定，向店家要求退貨，但店家拒絕。請依我國相關法律的規定，分析下列敘述何者正確？

    【知識補給站】

    民法修正案三讀離婚後財產分配法官得依家事勞動等調整

    2020／12／30'
  options:
  - label: A
    content: 此買賣消費行為，適用《消費者保護法》的規定，因此有猶豫期的保障
  - label: B
    content: 店家拒絕退貨的行為，對消費者顯失公平，違反《消費者保護法》的規定
  - label: C
    content: 某甲的家具是在家具行購買，因此不適用《消費者保護法》的猶豫期保障
  - label: D
    content: 此消費行為不屬《消費者保護法》中定型化契約的規範，店家可拒絕退貨
  - label: E
    content: 店家應基於《消費者保護法》中「無過失責任主義」的精神同意某甲退貨
