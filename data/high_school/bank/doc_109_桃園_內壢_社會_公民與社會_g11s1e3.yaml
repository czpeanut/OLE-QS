- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 羅密歐與祝英台結婚，婚後育有一子文財與一女文英，文財又與麗娘結婚生有一子悟空與一女如花，文英未婚。某天羅密歐與文財一起出國辦事，想不到發生空難同時死亡，請問羅密歐的遺產繼承人為何？
  options:
  - label: A
    content: 羅密歐的子女文財與文英，以及其配偶祝英台
  - label: B
    content: 羅文財的子女悟空與如花、祝英台、羅文英及麗娘
  - label: C
    content: 羅文英及祝英台，而羅文財的應繼分由其子女悟空與如花與其配偶麗娘共同代位繼承
  - label: D
    content: 羅文英及祝英台，而羅文財的應繼分由其子女悟空與如花代位繼承
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 劉富貴事業有成，但後來子女均遠居他國，老婆也跟他離婚。他晚年多病纏身，只能依賴外籍看護小桃照顧，為了感謝小桃，他請律師當見證，立下遺囑將遺產都給小桃。後來劉富貴過世，子女四人回國爭產，請問小桃在法律上最後可以得到多少財產？
  options:
  - label: A
    content: 1／8
  - label: B
    content: 1／5
  - label: C
    content: 1／4
  - label: D
    content: 1／2
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 小雅是個單親媽媽，獨力撫養女兒佳佳長大成人。某日佳佳的生父阿榮出現在母女倆面前，表示想與小雅復合、讓佳佳認祖歸宗。在母女倆還在猶豫是否接受阿榮之時，阿榮就因為事故意外死亡。當債主找上門的時候，母女倆才知道阿榮積欠大筆債務。請問下列敘述何者正確？
  options:
  - label: A
    content: 因為阿榮已經承認佳佳是自己的小孩，所以佳佳因準正成了阿榮的婚生子女
  - label: B
    content: 如果佳佳是阿榮唯一的血親，則佳佳和媽媽小雅必須繼承阿榮的債務
  - label: C
    content: 如果佳佳認為無法償還阿榮積欠的債務，可以向法院提出拋棄繼承
  - label: D
    content: 如果佳佳逾期未向法院提出拋棄繼承，則必須以自己的財產償還阿榮的欠債
- id: doc_109_桃園_內壢_社會_公民與社會_g11s1e3_s1_18
  section: 1
  number: 18
