  stem: <u>小愛</u>想要模仿電影《讓愛傳出去》中的主角小男孩改變世界的方法，首先她先幫助 3 個人，並希望他們將這份心意傳遞出去，每個人再去另外幫助 3 個人。由上可知，經過 1 次「傳愛」，共有 3 個人受到幫助；經過 2 次「傳愛」，共有 12 個人（3＋9）受到幫助；經過 3 次「傳愛」，共有 39 個人（3＋9＋27）受到幫助，假設沒有人重複受到幫助，請問至少要經過幾次「傳愛」，才能讓受幫助的總人數達到 1000 萬人以上？
  options:
  - label: A
    content: '15'
  - label: B
    content: '18'
  - label: C
    content: '21'
  - label: D
    content: '24'
  - label: E
    content: '27'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '設至少經過 n 次

    ⇒ 3＋$3^{2}$＋$3^{3}$＋……＋$3^{n}$＞10000000 ⇒ $\frac{3 \cdot (3^{n}-1)}{3-1}$＞$10^{7}$

    ⇒ $\log \frac{3 (3^{n}-1)}{2}$＞$log10^{7}$ ⇒ log3＋log（$3^{n}$－1）－log2＞7

    ⇒ log（$3^{n}$－1）＞6.8239，又 log（$3^{n}$－1）近似於 $log3^{n}$＝n log3

    ⇒ n＞$\frac{6.8239}{0.4771}$ ≈ 14.3 ⇒ 至少 15 次

    故選(A)'
