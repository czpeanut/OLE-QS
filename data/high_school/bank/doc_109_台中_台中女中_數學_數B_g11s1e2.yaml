- id: doc_109_台中_台中女中_數學_數B_g11s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 通常用 pH 值（氫離子濃度指數）來表示水溶液的酸鹼度量，其計算公式為 pH＝－log[$H^{＋}$]，其中[$H^{＋}$]為氫離子濃度。在 25℃時，酸性溶液的 pH 值小於 7； 中性溶液的 pH 值等於 7；鹼性溶液的 pH 值大於 7。然而，水中除了氫離子外還有氫氧離子（$OH^{－}$），我們同樣可以定義 pOH＝－log[$OH^{－}$]，其中[$OH^{－}$]為氫氧離子濃度。已知在 25℃時，任何水溶液中 $K_{w}$＝[$H^{＋}$]．[$OH^{－}$]＝$10^{－14}$，其中 $K_{w}$ 稱為水的離子積常數。試問在 25℃的環境下，下列敘述哪些是正確的？
  options:
  - label: A
    content: pH 值與 pOH 值的總和為定值 14
  - label: B
    content: 某溶液的 pOH 值為 5，則該溶液應為酸性溶液
  - label: C
    content: 甲、乙兩溶液的 pOH 值分別為 12 和 10，則甲溶液氫離子（$H^{＋}$）濃度應為乙溶液氫離子濃度的 100 倍
  - label: D
    content: 取等量的同種水溶液，其 pH 值分別為 4 和 6，則混合後的水溶液其 pH 值應為 5
  - label: E
    content: pH 值為 3 的醋酸、pH 值為 5 的咖啡、及 pH 值為 7 的純水，三者的氫離子濃度[$H^{＋}$]應成等比數列
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$logK_{w}$＝log（[$H^{＋}$]．[$OH^{－}$]）＝$log10^{－14}$

    ⇒ log[$H^{＋}$]＋log[$OH^{－}$]＝－14

    ⇒ －log[$H^{＋}$]＋（－log[$OH^{－}$]）＝14 ⇒ pH＋pOH＝14

    (B) ╳：承(A)，pH＋pOH＝14 ⇒ 某溶液 pH 值為 14－5＝9

    故為鹼性溶液

    (C) ○：$pH_{甲}$＝2，$pH_{乙}$＝4 ⇒ [$H^{＋}$]$_{甲}$＝$10^{－2}$，[$H^{＋}$]$_{乙}$＝$10^{－4}$

    ∴$\frac{[\mathrm{H}^{+}]_{甲}}{[\mathrm{H}^{+}]_{乙}}$＝$10^{2}$＝100

    (D) ╳：混合後氫離子濃度應為$\frac{10^{-4}+10^{-6}}{2}$＝5.05×$10^{－5}$，而非 $10^{－5}$

    故混合後 pH 值不為 5

    (E) ○：由(C)知，[$H^{＋}$]$_{醋}$＝$10^{－3}$，[$H^{＋}$]$_{咖}$＝$10^{－5}$，[$H^{＋}$]$_{水}$＝$10^{－7}$

    故為等比數列

    故選(A)(C)(E)'
