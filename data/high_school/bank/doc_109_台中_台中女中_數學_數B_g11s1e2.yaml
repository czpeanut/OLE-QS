  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$a^{－x＋h}$－k＝$\left( \frac{1}{a} \right) ^{x-h}$－k

    ①∵遞減 ∴0＜$\frac{1}{a}$＜1 ⇒ a＞1

    ②漸近線為 y＝－k＞0 ⇒ k＜0

    ③ x＝0 代入 ⇒ $\left( \frac{1}{a} \right) ^{-h}$－k＜1 ⇒ $\left( \frac{1}{a} \right) ^{-h}$＜1＋k＜1＝$\left( \frac{1}{a} \right) ^{0}$ ⇒ －h＞0 ⇒ h＜0

    故選(E)'
