  stem: 函數 y＝f（x）＝$a^{－x＋h}$－k 的部分圖形如右，則下列選項何者正確？
  options:
  - label: A
    content: 0＜a＜1，h＞0，k＞0
  - label: B
    content: 0＜a＜1，h＜0，k＜0
  - label: C
    content: 0＜a＜1，h＞0，k＜0
  - label: D
    content: a＞1，h＞0，k＞0
  - label: E
    content: a＞1，h＜0，k＜0
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_109_台中_台中女中_數學_數B_g11s1e2/s1_2_f1.png
