  stem: 已知 A（a，f（a））、B（b，f（b））為函數 y＝f（x）圖形上相異兩點，且滿足$f \left( \frac{a+b}{2} \right) \geq \frac{f(a)+f(b)}{2}$，則下列哪些選項可為滿足題意敘述的函數 f（x）？
  options:
  - label: A
    content: $2^{－x}$
  - label: B
    content: －$2^{x}$
  - label: C
    content: logx
  - label: D
    content: －$log_{0.2}$x
  - label: E
    content: $log2^{x}$
  answer:
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝f（x）滿足$f \left( \frac{a+b}{2} \right)$ ≥ $\frac{f (a)+f (b)}{2}$之圖形為凹口向下或為一直線

    (A) ╳：y＝$2^{－x}$＝$\left( \frac{1}{2} \right) ^{x}$ ⇒ 凹口向上

    (B) ○：y＝－$2^{x}$ 和 y＝$2^{x}$ 對稱於 x 軸 ⇒ 凹口向下

    (C) ○：y＝logx ⇒ 凹口向下

    (D) ○：y＝－$log_{0.2}$x＝$-\log _{\frac{1}{5}}x$＝$log_{5}$x ⇒ 凹口向下

    (E) ○：y＝$log2^{x}$＝x．log2 為一直線

    故選(B)(C)(D)(E)'
