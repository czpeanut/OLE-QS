questions:
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 阿翰最近花了 20,000 元把家中的空房間整理了一下，打算出租賺取租金。阿翰原來想開價租金為 6,000 元，剛好有花花、小扣兩位同學都很想租下這個房間，花花願意再加價 500 元租屋，而小扣不願意再加價，所以最後由花花租下阿翰的房間。請問有關三人機會成本的說明，何者正確？
  options:
  - label: A
    content: 阿翰願意提供空房間出租的機會成本為 0
  - label: B
    content: 花花願意租屋之機會成本大於等於 6,500 元
  - label: C
    content: 小扣願意租屋的機會成本小於等於 6,000 元
  - label: D
    content: 阿翰選擇租給小扣的機會成本小於租給花花
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)阿翰願意提供空房間出租的機會成本至少有 20,000 元的外顯成本，機會成本不可能為 0。(B)機會成本小於 6,500 元，花花才會選擇租屋。(D)選擇以 6,000 元租給小扣的機會成本為 6,500，高於租給花花的機會成本 6,000。故本題選(C)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 政府在做分配資源時，往往要考量是要為多數人謀取福利的政策「效率」，還是為少數人達到「公平」。以下是政府在疫情期間所做出的幾項政策，請問何項政策的目的與其他三項「不同」？
  options:
  - label: A
    content: 政府發放五倍券，每人享有 5,000 的額度以刺激消費
  - label: B
    content: 各地方政府為鼓勵民眾施打疫苗，祭出高額的優惠禮券
  - label: C
    content: 持健保卡民眾依身分證單雙號，可至藥局購買家用快篩試劑
  - label: D
    content: 針對製造業和服務業勞工非自願失業，可申請就業獎勵津貼
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)(C)皆為「效率」問題。(D)為協助處境不利群體的「公平」問題。故本題選(D)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據媒體報導，我國政府在 2018 ～ 2022 年投入高達 2,500 億提出「少子女化對策計畫」，要解決出生人口過少的問題，但實際上總生率由 1.40 人下降至 0.98 人，自該計畫推動後，至今尚未能反轉出生人口及總生育率長期下滑趨勢，砸大錢的政策並未見效。請問下列何者較「不符合」對此政策計畫的說明？
  options:
  - label: A
    content: 該計畫是提供正向誘因鼓勵民眾生養子女
  - label: B
    content: 該計畫誘因已有效達成政府欲解決的問題
  - label: C
    content: 該計畫提供的誘因目前無法達到干預效果
  - label: D
    content: 該計畫需進行調整以便政策誘因發揮效果
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，該計畫並沒有達成原先的目的，故本題選(B)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某國的全國人口總數為 10,000 人，15 歲以上民間人口 8,000 人，就業人口數為 3,400 人，失業人口數為 600 人，軍人總數為 640 人，監管人口為 160 人。以下敘述哪項正確？
  options:
  - label: A
    content: 勞動參與率為 0.50 ％
  - label: B
    content: 勞動參與率為 0.425 ％
  - label: C
    content: 勞動參與率為 0.464 ％
  - label: D
    content: 該國有 2,000 人未滿 15 歲，故非勞動力人口共有 2,000 人
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 勞動參與率（％）＝勞動力÷15 歲以上民間人口×100 ％＝（就業者＋失業者）÷15 歲以上民間人口×100 ％，可知本題勞動參與率＝（3,400＋600）÷8,000×100 ％＝50 ％，故本題選(A)。(D)非勞動力應有 8,000－（3,400＋600）＝4,000（人）。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 近年來環保、減塑意識抬頭，不少人在外用餐會自備餐具，減少資源浪費，環保署也在 2022 年 7 月時推動自備飲料杯政策，以優惠 5 元的方式帶動全民做環保，因而掀起一陣「5 塊潮」。請問此項政策的誘因，與下列何者的政策效果相同？
  options:
  - label: A
    content: 經濟部推動節能補助方案，購買節能家電補助 3,000 元
  - label: B
    content: 內政部表揚節能績優機關，公開頒獎給節電最多的機關
  - label: C
    content: 環保署規畫針對碳排 2.5 萬噸以上排碳大戶，徵收碳費
  - label: D
    content: 地方環保局對任意棄置垃圾家具、亂丟菸蒂者提高罰鍰
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知「五塊潮」屬於正向金錢誘因。(A)正向金錢誘因。(B)正向非金錢誘因。(C)(D)負向金錢誘因。故本題選(A)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《消費者保護法》第 2 條對於定型化契約的定義：「指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約。」關於定型化契約的敘述，下列何者正確？
  options:
  - label: A
    content: 消費者可用「個別磋商條款」與商家協商，改變原本定型化契約
  - label: B
    content: 定型化契約是企業與消費者雙方共同商議後，才擬定的消費契約
  - label: C
    content: 發生消費糾紛而簽訂的「和解契約」也是定型化契約的一種類型
  - label: D
    content: 定型化契約為企業預先擬定的契約，應給消費者 30 天「猶豫期間」
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)是由企業為了與不特定人訂約而單方面擬定的契約。(C)和解契約為雙方共同討論的契約，並非是定型化契約。(D)應當為「審閱期間」。故本題選(A)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 在蝦皮、PChome、MOMO 等網路購物平臺消費，成為現代重要的消費購物模式，而網路購物平臺與消費者之間的消費模式，下列說法何者最為正確？
  options:
  - label: A
    content: 電子商務就如同是電子化的超級市場，提供多種生產要素供消費者選購
  - label: B
    content: 蝦皮或 PChome 等扮演廠商的角色，但同時也提供平臺讓買賣雙方交易
  - label: C
    content: 電商平臺支付薪資給網路賣家，故網路賣家屬生產要素市場中的供給者
  - label: D
    content: 外送員可按件計酬自行決定工作時間，扮演生產要素市場中的廠商角色
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是「產品」，而非生產要素。(B)應當是扮演「產品市場」的角色。(D)外送員提供外送服務，屬於生產要素。故本題選(C)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 儘管 2023 年 COVID-19 疫情尚未完全結束，但由於各國幾乎都開放了邊境，各國航空公司的班機亦已經逐步恢復載客。不過，消費者卻發現航空旅遊出現幾個現象，包括飛機減少、航班減班以及機票漲價，過去可以搭乘廉價航空四處旅遊的樣貌已不復存在。換言之，疫情導致搭機旅遊比以往更加奢侈，而昂貴的機票可能使某些遊客選擇在國內旅遊。根據上文判斷，下列敘述何者正確？
  options:
  - label: A
    content: 國內旅遊與國外旅遊可能是消費上的互補品
  - label: B
    content: 機票價格上漲將使消費者對出國的需求下降
  - label: C
    content: 飛機減少與航班減班將使客機的供給量減少
  - label: D
    content: 消費者對出國偏好減少將使機票需求量減少
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由題文可知國外旅遊與國內旅遊應當為替代品。(C)此為本身價格以外因素的影響，屬於「供給」減少。(D)此為本身價格以外因素的影響，屬於「需求」減少。故本題選(B)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 很多商品的價格不變時，消費者願意購買的數量卻改變了，此種價格不變，消費者願意購買數量的變化稱為「需求的變動」。例如：小佑在大學時都喝即溶咖啡，但出社會上班後，則開始購買較昂貴的現煮咖啡，並減少飲用即溶咖啡。請問下列哪一個「造成需求變動的原因」與上述例子相同？
  options:
  - label: A
    content: 運動休閒風潮的興起，帶動運動服裝的購買
  - label: B
    content: 天氣變冷了，連帶使泡麵的購買量也增加了
  - label: C
    content: 消費者對於自行開車出遊的意願，隨油價提高而降低
  - label: D
    content: 升上主管之後，選擇購買汽車的意願比機車提高許多
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，從喝即溶咖啡到購買較昂貴的現煮咖啡，主要是因為收入增加。為劣等財與正常財的關係，因此(A)屬於偏好提高需求。(B)同樣屬於偏好提升需求。(C)為相關產品的影響。(D)升上主管之後薪水應當提升，因此偏好購買汽車取代機車，此屬於劣等財與正常財的關係，故本題選(D)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 經濟學是當資源具有稀少性且有多元用途時，如何做出資源配置的決策，即選擇的課題。請問下列何者能代表資源「稀少性」的問題？
  options:
  - label: A
    content: 陽光、空氣等財貨不需要支付代價就能取得，仍必須面臨選擇
  - label: B
    content: 全球首富因為擁有全世界最多資源，所以不會面臨稀少性問題
  - label: C
    content: 石油是必須支付代價才能取得的財貨，可無限制滿足人的需求
  - label: D
    content: 相對於人們無窮的欲望而言，資源永遠不足，所以人們必須選擇
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)陽光、空氣一般被認為不具有稀少性。(B)稀少性是個人主觀的感受，有錢人同樣可能會感受到稀少性的問題。(C)石油為不可更新資源，非可無限制滿足人們需求。(D)正解。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 生產可能線是廠商在生產兩種產品時，最大可能組合的生產軌跡，而畫出的圖形可能是曲線或是直線。請問有關生產可能線的說明下列何者正確？
  options:
  - label: A
    content: 生產可能線畫出來的斜率為正，代表兩種產品間的正向關係
  - label: B
    content: 生產可能線代表生產兩種產品的取捨關係，斜率即機會成本
  - label: C
    content: 生產可能線若為曲線，代表生產某產品的機會成本維持不變
  - label: D
    content: 生產可能線若為直線，代表生產某產品的機會成本隨之遞減
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)生產可能線的斜率為負。(C)生產可能線為曲線代表機會成本為遞增或遞減。(D)直線為機會成本不變。故本題選(B)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 知名咖啡店推出了長達一個月的回饋活動，為了吸引買氣，消費者只要符合身分證字號 0、1 兩個數字，來店點一杯美式咖啡，就能獲得買一送一優惠。依照上文敘述，下列何項推論正確？
  options:
  - label: A
    content: 買一送一的活動，將使業者虧損而離開市場
  - label: B
    content: 該業者的行為，將使市場上的咖啡供給增加
  - label: C
    content: 買一送一造成咖啡價格下跌，使需求量增加
  - label: D
    content: 該活動促使該店增添曝光度，促成需求線上點的變動
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由題文無法得知是否會使業者虧損。(B)買一送一活動，等於是半價促銷，會增加消費者的「需求量」。(C)正解。(D)增加曝光度為本身價格以外的變化，將會使得「需求」增加，需求線向右移動。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 新聞報導，日本四大啤酒製造商從 2022 年 10 月起調漲啤酒出貨價格，預料零售價格將上漲 4 ～ 13 ％，不少民眾紛紛趕在漲價前以箱為單位搶購啤酒。若其他條件不變，對於此現象，下列哪一說明最合理？
  options:
  - label: A
    content: 此與生產者的預期心理有關，將使價格上漲
  - label: B
    content: 此為啤酒需求量的增加，將導致價格的上揚
  - label: C
    content: 因為消費者的預期心理，將導致需求的增加
  - label: D
    content: 民眾將會改購買其他替代性商品來平抑物價
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應當是與消費者預期心理有關。(B)此與消費者預期心理有關，屬於「需求」的增加。(C)正解。(D)並無法從題文得知。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 4
  stem: 根據世界衛生組織（WHO）的研究證實，提高菸稅、菸捐及菸價的做法，是能預防青少年吸菸最有效的政策。也就是透過「以價制量」，促成吸菸者決定戒菸或減少吸菸頻率，以及使得菸商成本因菸稅、菸捐提高而減少出貨。據此我國推動《菸害防制法》的修法，希望提高香菸捐 20 元。上述香菸捐對香菸市場的價量變化，若其他條件不變，下列敘述何者最為可能？
  options:
  - label: A
    content: 供給變動使價格改變，導致需求量變動
  - label: B
    content: 供給變動引起數量改變，導致需求的變動
  - label: C
    content: 供給量變動使價格改變，導致需求量變動
  - label: D
    content: 供給量變動引起數量改變，導致需求變動
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，菸商會因為菸捐的提高使成本上升而減少出貨，「供給」減少，在需求不變之下，供給減少將導致均衡價格上升，而消費者因為香菸的價格上升而減少購買，屬於「需求量」的減少，故本題選(A)。
- id: doc_112_高雄_三民_社會_公民與社會_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 4
