  group_stem: '為推動減塑行動，迎向零塑消費的時代，環保署（現為環境部）規定自 2022 年 7 月 1 日起，四大類管制對象：連鎖飲料店、便利商店、速食店及超級市場，只要消費者自備環保杯購買飲品，就需補貼至少 5 元的價差優惠！

    當中與民眾生活最為密切的就屬便利商店，許多上班族每早都會去買一杯咖啡。從前自備環保杯折扣 3 元，現在加碼到 5 元，由於折扣有感，民眾自備杯子的意願大為增加。全家超商也表示，新規定上路後，頭兩天自備環保杯的人數大約從過去的 6 ％提升到 10 ％左右。<u>也有消費者表示，原本都買罐裝咖啡，現在會考慮改自備環保杯買現煮咖啡。</u>

    隨著環保意識抬頭，各式各樣的環保杯也紛紛上市。例如全家推出自有品牌的「無塑植纖杯」，使用了 100 ％可完全自然分解的「竹纖維」和「植物澱粉」製作；而 7-ELEVEN 則是經常與知名卡通、插畫合作推出聯名環保杯，吸引粉絲購買。如今優惠大增，想必環保杯市場又會再熱鬧起來。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)環保杯裝現煮咖啡，折扣後價格低於消費者願付價格，消費者將會購買。(B)題文提到自備環保杯，等於現煮咖啡降價提高購買率，可知現煮咖啡應當為正常財。(C)此為金錢的正向誘因。(D)由題文看不出消費者喜好，僅可知消費者會因為價格而改變購買行為。故本題選(A)。
