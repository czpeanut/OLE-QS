  group_stem: '各國渴望經濟復甦，加上疫苗施打率提升，丹麥、荷蘭、瑞典等國於 2022 年 2 月率先解除防疫措施，採行「與病毒共存」政策。2022 年 3 月起，日本、韓國、新加坡、香港、菲律賓、法國、澳洲、加拿大、紐西蘭、巴西、英國也陸續解封。與此同時，中國政府卻採取嚴格清零政策，隔離期間各類封控現場的人道災難事件頻傳，中國政府的考量究竟是什麼呢？

    觀點 1：清零下的上海

    2022 年 3 月 28 日，中國政府宣布以黃浦江為界，對上海實施分區「封城」防疫措施。就企業而言，由於人員流動受限，面臨停產危機；就 2,500 萬居民而言，則是面臨停診、無法就醫、食物與日常用品供應短缺、群體情緒低落等「次生災害」。《紐約時報》在 2022 年 5 月 24 日刊文直指，清零政策使中國 80 後年輕一輩成為最不幸的一代，民眾收入下降、失業人數提升，生活繞著頻繁的核酸檢測打轉，專制氣氛滲透個人生活，年輕一代「潤學」潮流加速中。上海是中國經濟的發電機，《中新社》報導封城兩周的經濟成本超過 1,500 億人民幣，預估上海經濟損失占 GDP 的 20 ％，也讓今年中國的經濟成長目標極有可能落空。

    觀點 2：假使選擇共存

    上海復旦大學發表於《自然醫學》（Nature Medicine）的研究指出，倘若中國沒有大規模檢測和嚴格的封控等限制措施，依據當前疫苗接種所致的免疫水準，不足以預防會衝垮重症醫護能量的 Omicron 變異株疫情潮。

    世界衛生組織公共衛生緊急計畫執行主任萊恩（Mike Ryan）這段話值得深思：「我們必須平衡控制措施對社會和經濟造成的影響，拿捏分寸並非總是易事。然而，任何對抗 COVID-19 疫情的措施，都應該展現出對個人和人權的尊重」。封閉管控 2 個月的上海，宣布 2022 年 6 月 1 日零時起「有限制的解封」，儘管官方表示「上海要以超常規力度搶救經濟」，但上海民眾短期內仍難以全面恢復正常生活，經濟能量也需要時間回溫，同時又要避免疫情於解封後再度逆襲，只能說嚴峻的挑戰尚未結束。'
