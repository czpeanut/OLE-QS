  stem: 根據上文有關臺北市政府勞動局對事業機關裁處的原因，可判斷出《勞動基準法》規範的契約性質，何者說明正確？
  options:
  - label: A
    content: 屬於完全的契約自由，只要是雙方合意的內容，皆擁有其法律的效力
  - label: B
    content: 屬於部分的契約自由，若是雇主選擇私下訂約，則可迴避法律的監督
  - label: C
    content: 屬於限制的契約自由，允許雙方在門檻之上，簽訂對勞工更優渥條款
  - label: D
    content: 屬於契約自由的限制，雖勞動屬於私領域，但政府完全主導契約內容。 $答$：
  group_stem: '臺北市勞動局公布 2023 年 2 月違反《勞動基準法》裁罰結果，共有 60 家事業單位遭到裁處，總罰鍰金額為 727 萬元。勞動局表示，違反《勞動基準法》裁罰的事業單位中，主要違法態樣前五名分別為：工資未全額給付、未依法給付平日延長工時工資、延長工作時間超過法令規定、未依法給付休息日工作之工資，以及未逐日記載出勤紀錄至分鐘為止，總體而言，都是因為事業單位並未依法給付勞動契約中規定的工資，或未依法定工時計算工資而違法。

    依據《勞動基準法》的規定，法定工時為一週 40 小時，在正常情況下，每天上班 8 小時，加班不能超過 4 小時，一週中有一日為例假日，另一日為休息日，例假日不能加班，即使勞工主動想加班都不准，否則雇主違法。而休息日允許勞工加班，可依雙方意願提供規定的加班費與加班時數，至於工作地點在法規中則沒有相關規定。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)屬於契約正義對契約自由的限制。(B)私下訂約同樣不能違反《勞基法》。(C)正解。(D)政府是規範最低標準，並非是完全由政府主導。故本題選(C)。
