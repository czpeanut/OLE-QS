- id: doc_110_台北_松山_數學_數乙_g12s2e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: '一池塘有鯉魚數隻，池塘主人說池塘裡雄鯉魚數量占 4 成。今某人從池塘中捕撈 10 隻鯉魚，設隨機變數 X 為雄鯉魚的數量（雄鯉魚數量占池塘總魚量 4 成），其機率分布表如下。若在顯著水準α＝0.05 下，試選出正確的選項。

    | X | 0 | 1 | 2 | 3 | 4 | 5 |

    | --- | --- | --- | --- | --- | --- | --- |

    | P | 0.006047 | 0.040311 | 0.120932 | 0.214991 | 0.250823 | 0.200658 |

    | X | 6 | 7 | 8 | 9 | 10 |  |

    | P | 0.111477 | 0.042467 | 0.010617 | 0.001573 | 0.000105 |  |

    （四捨五入至小數點後第 6 位）'
  options:
  - label: A
    content: X～B（10，0.4）
  - label: B
    content: P（X＝1）＝$C_{1}^{10} ( 0.4 )^{1} ( 0.6 )^{9}$
  - label: C
    content: 拒絕域為$X\leq 1$
  - label: D
    content: 若捕撈 10 隻鯉魚中，有 1 隻雄鯉魚，則接受主人宣稱雄鯉魚數量占 4 成
  - label: E
    content: 若捕撈 10 隻鯉魚中，有 7 隻雄鯉魚，則接受主人宣稱雄鯉魚數量占 4 成
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵共捕撈 10 隻鯉魚，且其宣稱池塘裡雄鯉魚占 4 成

    ∴X～B（10，0.4）

    (B)○：P（X＝1）＝$C_{1}^{10} ( 0.4 )^{1} ( 0.6 )^{9}$

    (C)╳：當隨機變數 X 的取值在 X＜1 時

    機率總和約為$0.006047 < \frac{\alpha}{2}$＝0.025

    而 X＞7 時，機率總和約為 0.010617＋0.001573＋0.000105＝$0.012295 < \frac{\alpha}{2}$＝0.025

    故拒絕域為 X＜1 或 X＞7

    (D)○：∵10 隻鯉魚中，有 1 隻雄鯉魚

    X＝1 未落在拒絕域內

    ∴接受此說法

    (E)○：∵10 隻鯉魚中，有 7 隻雄鯉魚

    X＝7 未落在拒絕域內

    ∴接受此說法

    故選(A)(B)(D)(E)'
