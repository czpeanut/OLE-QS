- id: doc_110_台北_松山_數學_數乙_g12s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 某高中英文單字比賽，試卷題目有 50 題，每道題目都是 4 選 1 的單選題，答對 1 題得 2 分，答錯不倒扣。今某生每題都從 4 個選項中隨機選 1 個答案作答，設隨機變數 X 為該生答對的題數，隨機變數 Y 為該生的試卷分數。試選出正確的選項。
  options:
  - label: A
    content: P（X＝24）＞P（X＝25）
  - label: B
    content: P（X＝2）＝P（Y＝1）
  - label: C
    content: E（X）＝10
  - label: D
    content: E（Y）＝2E（X）
  - label: E
    content: Var（Y）＝2Var（X）
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意可知，某生每題答對率為$\frac{1}{4}$，答錯率為$\frac{3}{4}$

    (A)○：∵P（X＝24）＝$C_{24}^{50} \left( \frac{1}{4} \right) ^{24} \left( \frac{3}{4} \right) ^{26}$

    P（X＝25）＝$C_{25}^{50} \left( \frac{1}{4} \right) ^{25} \left( \frac{3}{4} \right) ^{25}$

    ∴P（X＝24）＞P（X＝25）

    (B)╳：∵P（X＝2）＝$C_{2}^{50} \left( \frac{1}{4} \right) ^{2} \left( \frac{3}{4} \right) ^{48}$

    P（Y＝1）＝0

    ∴P（X＝2）≠P（Y＝1）

    (C)╳：∵X～B$\left( 50 , \frac{1}{4} \right)$

    ∴E（X）＝$50\times \frac{1}{4}$＝$\frac{25}{2}$（題）

    (D)○：E（Y）＝E（2X）＝2E（X）＝$\frac{25}{2}\times 2$＝25（分）

    (E)╳：Var（Y）＝Var（2X）＝$2^{2}$．Var（X）＝4Var（X）

    故選(A)(D)'
