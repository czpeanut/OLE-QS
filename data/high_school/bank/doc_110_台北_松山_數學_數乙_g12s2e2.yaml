- id: doc_110_台北_松山_數學_數乙_g12s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '設隨機變數 X 可能的值為 1、2、3、4，且其機率質量函數

    P（X＝k）＝$\begin{cases}a , k = 1 \\ \frac{1}{k^{2}} , k = 2 , 3 , 4\end{cases}$，試選出 a 的值。'
  options:
  - label: A
    content: $\frac{7}{16}$
  - label: B
    content: $\frac{9}{16}$
  - label: C
    content: $\frac{1}{25}$
  - label: D
    content: $\frac{61}{144}$
  - label: E
    content: $\frac{83}{144}$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'P（X＝1）＝a

    P（X＝2）＝$\frac{1}{2^{2}}$＝$\frac{1}{4}$

    P（X＝3）＝$\frac{1}{3^{2}}$＝$\frac{1}{9}$

    P（X＝4）＝$\frac{1}{4^{2}}$＝$\frac{1}{16}$

    $a +\frac{1}{4}+\frac{1}{9}+\frac{1}{16}$＝1

    $\Rightarrow$a＝$\frac{83}{144}$，故選(E)'
