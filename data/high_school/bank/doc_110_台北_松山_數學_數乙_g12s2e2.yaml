- id: doc_110_台北_松山_數學_數乙_g12s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知某工廠生產的產品中，不良品的機率為 0.2。今隨機抽樣 23 件產品，隨機變數 X 為不良品的件數，若 P（X＝k）表示不良品為 k 件的機率，試問下列哪一個機率最大？
  options:
  - label: A
    content: P（X＝4）
  - label: B
    content: P（X＝4.6）
  - label: C
    content: P（X＝5）
  - label: D
    content: P（X＝6）
  - label: E
    content: P（X＝7）
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) P（X＝4）＝$C_{4}^{23} ( 0.2 )^{4} ( 0.8 )^{19}$＝$C_{4}^{23}\times \frac{4^{19}}{5^{23}}$

    (B) P（X＝4.6）＝0

    (C) P（X＝5）＝$C_{5}^{23} ( 0.2 )^{5} ( 0.8 )^{18}$＝$C_{5}^{23}\times \frac{4^{18}}{5^{23}}$

    (D) P（X＝6）＝$C_{6}^{23} ( 0.2 )^{6} ( 0.8 )^{17}$＝$C_{6}^{23}\times \frac{4^{17}}{5^{23}}$

    (E) P（X＝7）＝$C_{7}^{23} ( 0.2 )^{7} ( 0.8 )^{16}$＝$C_{7}^{23}\times \frac{4^{16}}{5^{23}}$

    ∵$C_{4}^{23}\times \frac{4^{19}}{5^{23}}$＞$C_{5}^{23}\times \frac{4^{18}}{5^{23}}$＞$C_{6}^{23}\times \frac{4^{17}}{5^{23}}$＞$C_{7}^{23}\times \frac{4^{16}}{5^{23}}$

    故選(A)'
