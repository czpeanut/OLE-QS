  type: single
  page: 1
  stem: '設隨機變數 X 的機率分布表如下，其中 a，b 為實數，且期望值 E（X）＝3，試選出數對（a，b）。

    | X | 1 | 2 | 3 | 4 | 5 |

    | --- | --- | --- | --- | --- | --- |

    | P | a | b | 0.4 | b | 0.2 |'
  options:
  - label: A
    content: （0.1，0.2）
  - label: B
    content: （0.2，0.1）
  - label: C
    content: （0.4，0.4）
  - label: D
    content: （0.4，0.6）
  - label: E
    content: （0.6，0.4）
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '機率總和為 a＋b＋0.4＋b＋0.2＝1$\Rightarrow$a＋2b＝0.4 …………①

    E（X）＝1×a＋2×b＋3×0.4＋4×b＋5×0.2＝3

    $\Rightarrow$a＋6b＝0.8 …………………………………………………②

    由①、②可得數對（a，b）＝（0.2，0.1）

    故選(B)'
