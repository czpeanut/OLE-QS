  stem: 政府近來注意到勞工低薪問題，並呼籲企業可以調薪，被企業老闆反駁，認為政府干預勞工薪資有違市場機制；但現行的《勞基法》則設有最低薪資的規定。針對雙方截然不同的立場，判斷何種說法較為正確？
