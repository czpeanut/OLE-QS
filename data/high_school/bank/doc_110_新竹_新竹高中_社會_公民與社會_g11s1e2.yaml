  stem: 江宏傑和福原愛婚變傳了2個月，江宏傑已向高雄法院訴請離婚，女方也傳出已經聘好律師，準備打跨國官司而兩人婚後在台南、高雄的房屋產權各半：結婚後代言費約500到600 萬，4年粗估進帳2.6億，福原愛婚後收入仍大於江宏傑2.4倍。請問：對於他們夫妻之間的相關財產關係該如何運作，下列何者正確？
