  stem: 有網友分享開雞排攤的心得，建議有意者要研發獨家的炸粉、口味，「讓客人覺得你家的雞排就是不一樣，不是隨便哪家雞排都能取代的」，如此客群才比較多且穩定。另也建議增賣薯條、甜不辣等周邊商品以及去油解膩的飲料，雖然準備起來比較麻煩，但是客人買雞排時常會順手添購，而有些人來買這些東西時也會順便買雞排。此外，多一些品項也便於不定期針對其中一、兩種推出降價優惠，進而帶動雞排及其他品項的銷售。根據上文，下列推論何者最為正確？
  options:
  - label: A
    content: 雞排店是生產者，推出降價的優惠乃是運用需求法則來刺激需求增加
  - label: B
    content: 文中的周邊商品是雞排的替代品，因為準備它們會壓縮準備雞排的時間
  - label: C
    content: 研發獨家的炸粉、口味，能減少自家雞排變成別家雞排替代品的可能性
  - label: D
    content: 對去油解膩的飲料推出降價優惠可帶動雞排的銷售，因此是雞排的互補品
