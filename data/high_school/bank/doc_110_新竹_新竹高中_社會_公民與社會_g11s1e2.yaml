  section: 1
  number: 12
  type: single
  page: 2
  stem: 所謂「定型化契約」是指企業經營者為與不特定多數消費者訂立同類契約之用，所提出預先擬定之契約條款。請問下列敘述何者「錯誤」？
  options:
  - label: A
    content: 契約須以書面方式呈現，而電視購物所揭示之文宣不構成契約
  - label: B
    content: 基於平等互惠原則，企業應提供消費者三十日內之合理審閱期
  - label: C
    content: 基於契約自由原則，定型化契約仍得由雙方增訂個別磋商條款
  - label: D
    content: 契約條款未經記載於定型化契約中者，應向消費者明示其內容
