    content: 老師在課堂中播放自己去DVD出租店租來的家用版《你的名字》整部電影
  - label: C
    content: 因為教授指定之原文書相當昂貴，大學生基於學習所需，影印整本原文書籍
  - label: D
    content: 小明在網路上看到一篇動人心弦的故事，整篇複製到個人網誌中供大家閱讀
  tags:
