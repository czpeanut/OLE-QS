  type: single
  page: 2
  stem: 「大同大同國貨好…」這首傳唱近40年的大同之歌是四、五年級生的童年回憶，其原創者李守成無條件讓大同公司前董事長林挺生將原歌調中的「三洋」改成「大同」，並略做修改後使用。後因大同公司於民國57年間向内政部登記成為著作權人，但卻拒絕給付合理費用給李守成，遂引發糾紛，最後台北地院判決李守成敗訴，著作權屬大同公司所有。下列相關敘述何者「正確」？
  options:
  - label: A
    content: 現行《著作權法》規定，著作完成後必須申請登記，始能享有該權
  - label: B
    content: 林挺生將原歌詞略做修改之權，是屬於可以轉讓的著作人格權範疇
  - label: C
    content: 林挺生可以主張僅有口頭承諾，不符契約成立要件而拒絕給付費用
  - label: D
    content: 大同公司可將該歌曲授權他人，經改編歌詞後作為商業用廣告歌曲
