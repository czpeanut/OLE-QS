- id: doc_109_台南_台南二中_自然_生物_g10s2e1_s3_33
  section: 3
  number: 33
  type: single
  page: 4
  stem: 細胞質內鈣離子主要存於下列何種構造？
  options:
  - label: A
    content: 核糖體
  - label: B
    content: 粒線體
  - label: C
    content: 高基氏體
  - label: D
    content: 內質網
  group_stem: '細胞內的內質網是細胞儲存鈣離子的主要胞器，其內鈣離子濃度約1 mM（細胞質的鈣離子濃度約100 nM），內質網可釋出鈣離子來調節許多細胞的功能。細胞的能量工廠「粒線體」與內質網的位置相近，可攝取大量的鈣，也具有儲存鈣離子的功能，可透過與內質網等胞器進行協同作用，控制細胞中鈣離子濃度的動態平衡。鈣離子對粒線體也是不可或缺，粒線體產生能量的過程也需要鈣離子的參與，研究發現只要阻斷內質網釋出鈣離子，也會干擾粒線體的正常功能，細胞會因此出現能量不足的狀態。

    當細胞處於能量不足的狀態下，正常細胞會先盡量降低代謝作用，並減緩各種非緊急的活動（如細胞分裂過程，會因為能量不足而暫停），若這樣的應變仍無法撐過逆境，細胞會啟動自噬作用，透過消化自身的部份胞器盡可能的求生。然而，癌細胞因為代謝速度比一般細胞更快，在遭遇因粒線體無法運作所造成的能量缺乏危機時，就算啟動自噬作用，仍無法即時提供能量，也造就了一般細胞仍能生存的情況下，癌細胞就已大量死亡的差別。肌醇三磷酸受體（IP3R）是一種穿膜蛋白，也是使內質網釋出鈣離子的主要因素。研究發現，經由影響IP3R的作用，可改變癌細胞上的鈣離子調控，進而達到抑制或促進癌細胞的功用。

    （參考資料：Huang, E., Shen, Y. and Chen, C. (2016). Mitochondria: Target for the Develop of Anti-inflammatory Drugs. J Chin Med, 27(1), p.22.）'
  answer:
  - D
  answer_status: verified
