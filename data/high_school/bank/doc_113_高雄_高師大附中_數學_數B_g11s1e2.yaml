  stem: 某銀行推出一項投資商品，內容為每年繳9700元，共繳10次，10年後一次領回100000元。銀行宣稱其投資報酬率為$\frac{100000-9700\times 10}{9700\times 10}\approx$3.09％，大於銀行的定存利率2％。 (1) 若每年存入銀行9700元作複利定存，年利率2％，每年計息一次，試問10年後可領回本利和多少元？（四捨五入取 至整數位）（已知$1.02^{10}\approx$1.22）（7分） (2) 試以投資報酬率評估此投資產品是否值得購買。（3分，請寫出原因，否則不予計分）
  answer:
  - (1) 108834元；(2) 不值得購買
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 9700×( 1＋2％ )$^{10}$＋9700×( 1＋2％ )$^{9}$＋…＋9700×( 1＋2％ )

    ＝$\frac{9700\times 1.02\cdot \left( 1.02^{10}-1 \right)}{1.02-1}$＝$\frac{9700\times 1.02\cdot \left( 1.22-1 \right)}{0.02}$＝108834 (元)。 (2) $\frac{108834-9700\times 10}{9700\times 10}\approx$12.2％＞3.09％ ∴ 不值得購買'
