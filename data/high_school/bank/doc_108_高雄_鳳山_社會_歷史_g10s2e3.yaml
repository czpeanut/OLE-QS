  stem: 明治維新時期，日本經歷多次政治變革：1868年，幕府將軍「大政奉還」；1869年，地方「奉還版籍」；1871年，實施「廢藩置縣」政策；到了1885年，仿效歐洲內閣制，以「總理大臣」統率行政部會，直接向天皇負責。這種變動反映日本明治時代政治發展趨勢是：
