  stem: 下圖為2024年，日本即將進行貨幣改版，萬元紙鈔的參考樣本。戰後，日本的萬元紙鈔從聖德太子到福澤諭吉，再到此版本的澀澤榮一，都是日本史上重要的人物。澀澤榮一成立了日本第一國立銀行，也成立了東京證交所，堪稱為日本的資本主義之父。在「銀元與刀」的策略下，其重要程度可想而知。請問：澀澤榮一引進西方資本主義，進行財政革新的時候，可能是下列哪一時期？
  options:
  - label: A
    content: 1820年代
  - label: B
    content: 1870年代
  - label: C
    content: 1940年代
  - label: D
    content: 1960年代
