  stem: '《時代雜誌》是一份於1923年開始在美國出版的新聞雜誌，時代雜誌的封面具有象徵意義，代表著當時國內外事務各方面的重要發展。而觀看過往的時代雜誌封面，可見到許多中國重要人物的面孔，這些人在當時的時空下被放置於時代雜誌的封面，代表此人對當時的中國局勢有著相當重要的影響性。請問：當時時代雜誌為何要選這些人作為封面？或他們在當時分別有什麼重要的事蹟表現，足以影響中國或區域的歷史發展？

    | Ａ | Ｂ | Ｃ | Ｄ |

    | --- | --- | --- | --- |

    |  |  |  |  |

    | 1927/04/04 | 1934/03/05 | 1979/01/01 | 1989/06/19 |

    | CONQUEROR | MANCHUKUO: Orchid Emperor | Visionary of a New China | The Wrath of Deng |'
  options:
  - label: A
    content: 蔣中正征服了整個中國，成為了中國新一代領導人
  - label: B
