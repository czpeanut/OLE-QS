- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 閱讀以下資料，回答下面選項，何者為是？ 資料一：「第一號有4條，是關於日本接收山東省內舊德國權利、並擴展築路權、定居權和通商權的要求。第二號有7條，要求將日本在關東州租借地、南滿鐵路、安奉和吉長鐵路的權益再展期99年，以及日本人在內蒙東部和南滿的開礦、定居、通商權利。第三號有2條，要求日本獨占漢陽、大冶、萍鄉的煤鐵事業。第四號要求中國不將沿海口岸和島嶼割讓他國。第五號有7條，要求中國政府聘用日人擔任軍事和財政顧問，且日本顧問需多於他國顧問的總數。中國警察由中日合辦或聘用日本顧問。中國軍隊所需的軍械器材由日華合辦的軍械廠供應，或向日本採購。湖南、湖北、浙江、江西、福建等省鐵路建造權利交與日本。承認日本在中國各地醫院、寺院、學校的土地所有權，並承認日本的『布教權』。」 資料二：「1915年1月至4月期間，北洋政府外交部一方面同日本談判，一方面暗中逐步將條約的部分內容向報界洩露，希望獲得英美兩國支援抗衡日本。當美、英、法三國駐日大使向日本政府提出質詢時，日本外務省既不便公然抵賴，又不敢全部公開，於是只承認了第一、二號的11條。2月9日，日本外相加藤高明又向美國駐日大使格思類承認了第三、四號的存在，卻對性質最惡劣的第五號七條加以隱瞞。在美方越來越嚴厲的追問下，加藤高明才於同月21日向格思類承認了第五號的存在，但辯稱這只是日本的『希望』而非要求。」
  options:
  - label: A
    content: 日本要求「布教權」是基於對神道教的熱情，想讓神道教成為世界性宗教
  - label: B
    content: 日本與朝鮮簽訂「江華條約」迫使朝鮮開國、開港通商
  - label: C
    content: 日本要求接收山東權利，政府迫於學運壓力，不敢簽約
  - label: D
    content: 美國希望日本能保持中國領土、主權完整，維持門戶開放政策
- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有一個文章批判當時的政治：「在昔哲后，正宜撤懸避殿之時，今獨何心，乃有<u>上號勸進之舉</u>？夫果未熟而摘之，實傷其根；孕未滿而催之，實戕其母。吾疇昔所言，中國前途一線之希望，萬一以非時之故，而從茲一蹶，則倡論之人，雖九死何以謝天下？願公等慎思之。詩曰：「民亦勞止，汔可小息。」自辛亥（宣統三年，1911年）八月迄今未盈四年，<u>忽而滿洲立憲，忽而五族共和，忽而臨時總統，忽而正式總統，忽而制定約法，忽而修改約法，忽而召集國會，忽而解散國會，忽而內閣制，忽而總統制，忽而任期總統，忽而終身總統，忽而以約法暫代憲法，忽而催促制定憲法</u>。大抵一制度之頒行之平均不盈半年，旋即有反對之新制度起而摧翻之，使全國民彷徨迷惑，莫知適從，政府威信，掃地盡矣。今日對內對外之要圖，其可以論列者不知凡幾。公等欲盡將順匡救之職，何事不足以自效？何苦無風鼓浪，興妖作怪，徒淆民視聽，而詒國家以無窮之戚也！」請問：該文章的主旨下列何者最適合？
  options:
  - label: A
    content: 主張不要隨意更動制度，才不會使人民無所適從
  - label: B
    content: 建立起適合的制度，以建立政府的威信
  - label: C
    content: 主張建立君主立憲制
  - label: D
    content: 反對袁世凱稱帝
- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_3
