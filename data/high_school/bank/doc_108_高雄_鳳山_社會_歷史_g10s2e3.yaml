- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_40
  section: 1
  number: 40
  type: single
  page: 9
  stem: 日本總督府開發朝鮮半島的目的，是進口該地的農產品，以及作為日本工業產品的出口市場。為了避免對日本公司造成威脅，總督府頒布了《公司法》，規定在朝鮮新成立的企業都必須得到官方認可。該法案主要是針對朝鮮的本土公司，由於取得認可極為不易，1910-1918年間，總督府僅發出105張執照，其中將近有90％是發給日本人成立的公司。此外，總督府還對朝鮮進行土地調查，不承認未擁有正式檔案的土地所有權，使得東洋拓殖株式會社以及日本人所屬的農村合作社得到許多新的土地，而許多朝鮮人民則淪為佃農，生活急遽惡化。 總督府的種種政策，使得朝鮮人民的不滿逐漸高漲。最終，1919年前國王高宗的猝死，激起了民眾運動，將一百多萬來自各行各業的朝鮮人民團結一起，抗議殖民統治，走向街頭展開爭取獨立的運動。日本當局先採取鎮壓的方式，許多抗議的民眾入獄或死亡，因而引發世界各地的關切。 請問：根據資料，朝鮮農村地區人民生活急遽惡化的主要原因為何？
  options:
  - label: A
    content: 血腥鎮壓
  - label: B
    content: 土地調查
  - label: C
    content: 受殖民統治
  - label: D
    content: 不准買賣
