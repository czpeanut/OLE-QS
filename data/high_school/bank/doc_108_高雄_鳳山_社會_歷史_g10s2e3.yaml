- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 以下兩筆資料，閱讀後，請依據史實回答，下列何者正確？ 資料一：「想我滿蒙各地，厲在遠陲，開國綿遠，徵諸往籍。分併可稽。地質膏腴，民風樸茂，迨經開放，生聚日繁，物產豐饒，實為奧府。乃自辛亥革命，共和國成立以來，東省軍閥，乘中原變亂之機，攫取政權，據三省為己有。貅貔相繼，竟將廿年，狼厲貪婪，驕奢淫佚：罔顧民生之休戚，一惟私利之是圖！」 資料二：「今者幸假手鄰師，驅茲醜類，舉連年軍閥盤踞，秕政萃聚之地，一旦廓而清之，此天予我滿蒙之民蘇息之良機，吾人所當奮然興起，邁往無前，以圖更始者耳。惟是內顧中原，自改革以還，初則群雄角逐，爭戰頻年，近則一黨專橫，把持國政，何曰民生？實置於死，何曰民權？惟利是專，何曰民族，但知有黨，即日天下為公，又曰以黨治國，矛盾乖謬，自欺欺人，種種詐偽，不勝究詰。……比來內閧迭起，疆土分崩，黨且不能自存，國何能顧？於是赤匪橫行，災祲薦告，毒痡海內，民怨沸騰，無不痛心疾首於政體之不良，而追思襄昔政治清明之會，直如唐虞三代之遠不可幾及，此我各友邦共所目睹而同深感歎者也。」
  options:
  - label: A
    content: 資料一指控日本竊佔東三省
  - label: B
    content: 這文章應該是出自張學良的陣營
  - label: C
    content: 共產黨竊佔東北，一黨專橫把持國政
  - label: D
    content: 溥儀在日本擁戴下復辟
