  stem: 以下兩筆資料是胡適在不同時間對五四運動的評論，請問：下列選項何者正確？ 資料一：胡適引用尼采的話說：「現今時代是一個『重新估定一切價值』的時代」，例如：鴉片，以前是待客上選，現在則成為戕害人民的毒物；又如康有為的評價，人、事、物不變，估價的人變了，價值也變了；孔教是重新估定孔教的價值；貞操只是重新估定貞操的道德在現在社會的價值；文學評論、戲劇等等亦是如此。 資料二：五四的錯誤主要不在反傳統這一方面，在於他未能建立起接受西方文化的正確態度，未能瞭解文化再造不在形式而在精神，「全盤西化」的偏激口號也過於損傷民族自尊心。最根本的原因在於我們對自己的不瞭解，所以一會兒自傲自大，以學習西方為恥辱，一會兒又自卑自賤，恨不能立刻變成白種民族。
  options:
