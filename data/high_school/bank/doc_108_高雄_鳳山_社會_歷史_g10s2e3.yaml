  stem: 下列為關於中國某次運動的資料，請於閱讀後回答問題。 資料一：「我發現我上次把這裡的示威遊行比做我國內一般大學裡男生的宿舍打鬥，對這的學生說來有欠公平。整個示威遊行是經過了細心的計畫，並且比他們預定的時間還要提早結束，原因是有一個政黨也要遊行示威。他們的運動，如果在同一個時候，會給誤認是被政黨利用。他們要以學生身分獨立採取行動。想想我們國內十四歲以上的孩子，而這裡的學生負起一個大清除改革運動的領導責任，並且使得商界和各界人士感到慚愧而來加入他們的運動。這實在是一個了不起的國家。」 資料二：「我們起初討論國家的危機，大家都同意造成問題的原因是腐敗和不公平。所以我們作學生的應該奮鬥，讓全世界看到『強權絕對不是公理』。我們一直考慮，尋求我們對政府的腐化和對□□主義不滿的辦法。最後的結論是惟一立刻能夠做的是召集北京的學生，舉行一次大遊行。凡我國民當有覺悟，一致協力對外，以保危局。」請問：資料二中「□□主義」，□□應可填入下列何者？
  options:
  - label: A
    content: 極權
  - label: B
    content: 共產
  - label: C
    content: 帝國
  - label: D
    content: 民族
