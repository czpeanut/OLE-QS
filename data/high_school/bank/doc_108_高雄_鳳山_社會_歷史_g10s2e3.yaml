  stem: 《大人的日本史》一書中提到：「開宗明義來說，甲午戰爭原來就不是為臺灣而戰的。戰爭的導火線是朝鮮內部爆發農民叛亂，清廷應朝鮮政府請求趕來協助，而同時日本則藉口保護海外國民貿然出兵，兩支嫌隙已深的清、日軍隊，最後在朝鮮半島上打了起來，根本搞不清楚誰是案件始作俑者。甲午戰爭後，中日簽署《馬關條約》以平息爭議，臺灣只不過是眾多議題之一。探究《馬關條約》內容，第一條寫的不是「臺灣割讓」，而是「朝鮮獨立」。十九世紀末的朝鮮，夾在清廷、日本與俄羅斯幾個大國間，由於還有其他歐洲勢力虎視眈眈、躍躍欲試，朝鮮半島長期處在強敵環伺下生存。為了謀生路，朝鮮政府往往必須聯合次要敵人，打擊主要敵人。但是，次要敵人是誰，主要敵人又是誰？連認知敵人，朝鮮官員與讀書人都有不同的想怯，國內政治派系鬥爭也逐漸白熱化。選邊站時，有人主張聯合日本，有人堅持向中國求助。……儘管日本節節進逼，當時朝鮮在位的國王高宗仍試圖力挽狂瀾。在閔妃暗殺事件之後兩年，他變更國名為「大韓帝國」，也讓自己順理成章變作韓國史上首位皇帝。既然甲午戰爭裡清廷被證明軍事力量不如人，高宗也很快轉向俄羅斯尋求援助，以共同抵禦日本勢力。只是誰都沒想到，不到十年時間，俄羅斯也與日本爆發了戰爭，結果俄羅斯竟然戰敗，朝鮮的靠山又一次垮臺。」 請問：綜合資料文意；日本透過《馬關條約》要求朝鮮「獨立」，真正的意思可能是下列何者？
  options:
  - label: A
    content: 不承認中國是朝鮮的宗主國
  - label: B
    content: 向朝鮮示好求朝日共存共榮
  - label: C
    content: 警告歐洲勢力不要染指東亞
  - label: D
    content: 鼓勵臺灣人民脫離清廷統治
- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 8
  stem: 「古代越南深受中國文化影響，官方文書一直使用漢字，但越南當地以越語為主要語言，而日常生活使用的越語無法以漢字來記錄表達。因此十三世紀之後，開始發展仿用漢字所創製的本地文書「字喃」。但官方文書和上層文人仍使用漢字作為書寫工具，「字喃」僅流行於民間少數文人。 十七世紀之後，進入越南傳教的基督教傳教士，為了自身學習越語以及傳教的便利，開始利用羅馬字拼寫越語，逐漸發展出系統的越南羅馬字，但僅有教會內部使用。十九世紀法國殖民越南之後，為了讓越南民眾熟悉羅馬字母，進而學習法語，極力推廣越南羅馬字。法國也希望越南羅馬字能取代漢字，進而切斷越南與清朝的連結。羅馬字走出了教會，影響一般人。但當時的民族主義者將越南羅馬字視為西方帝國主義入侵的象徵，刻意抗拒。許多上層文人仍口說越語，手寫漢字。 二十世紀的越南民族主義者認為「字喃」雖具民族特色，但複雜難學。相較之下羅馬字較易學習。可以改善越南遍地文盲的現象，也可教育啟迪民眾，讓越南有能力反抗法國的殖民統治，並擺脫中國的影響，發展越南自身的文化。1945年胡志明宜布越南獨立之後，正式宣布羅馬字是越南唯一的官方文字，並進一步將越南羅馬字置入國家基礎教育之中。自此，羅馬字正式成為「國語字」。」 請問：關於上述文字敘述，下列何者正確？
  options:
  - label: A
    content: 越南羅馬字成為越南國語字的最主要原因是法國殖民
  - label: B
    content: 十九世紀時認為羅馬字容易學，可以普及教育，進而發展自身文化
  - label: C
    content: 字喃的使用有助於提升民族情緒。發明後，即受到大眾熱列歡迎與學習
  - label: D
    content: 漢字最後被「越南羅馬字」所取代的原因是法國殖民時期、越南建國之後，官方刻意去除
