  stem: 甲午戰爭之後，「中學為體，西學為用」成為流行用語，在新式學堂及學會均以其作為辦學及創會的口號，然而新式學堂及學會的教學內容與發展目標，卻偏重於西學或新學。形成此一現象的原因，最可能是因為新式學堂及學會的創辦人：
  options:
