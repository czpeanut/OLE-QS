- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 他出生於一個貧苦學者的家庭，從小受其父親的影響而成長為一名愛國知識份子。當法國殖民主義侵母國時，年輕的他號召一些愛國青年組成學生軍反抗法國的入侵，但是該國終究敗於法國精良的武裝。成泰十二年（1900年），他參加鄉試，考中解元。1904年5月成立了維新會，次年為了尋求資金和武器的援助而來到日本。1905年至1908年居留日本期間，他認識了中國維新運動領袖梁啟超，也認識了孫中山和章太炎等人，而梁啟超和孫中山的思想也啟發其思路。之後他撰寫許多文章祕密散佈回越南，鼓勵母國人民從法國殖民統治中解放出來。結果他被迫離開日本先到中國廣州，再轉往到暹羅（泰國），1912年幾月又來到廣州。後來他在當地見到辛亥革命成功，於是改組越南維新會而成為越南光復會，這是模仿孫中山的革命組織所重新創建的團體。1925年6月30日他被出賣，在上海遭到法國特務祕密拘捕，被控叛逆罪，並在順化終身軟禁直到逝世。請問：文中的他，應該是下列何人？
  options:
  - label: A
    content: 坂本龍馬
  - label: B
    content: 西鄉隆盛
  - label: C
    content: 胡志明
  - label: D
    content: 潘佩珠
- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 閱讀以下三筆資料，下列敘述何者正確？ 資料一：「亞洲主義」的觀念並不是全新的論點。早從十九世紀開始，就有一群日本知識分子，開始強調以中國和日本等東洋文化的優越性。他們認為，西方不過在物質文明上暫時領先，東洋精神傳統仍是無可取代。這樣的想法，從一九二○年代之後似乎越來越具有說服力，尤其當時歐洲剛剛打過第一次世界大戰，顯得陰霾罩頂，問題重重。 資料二：「亞洲主義」不只引起日本國內的討論，也吸引了其他國家的知識分子。一九二四年十一月二十八日，當時擔任中國國民黨總理的孫中山，在日本的神戶發表了名為「大亞細亞主義」的演講。他說，西方文明強調的是霸道，東洋文化的核心則是王道；他更強調，幾年前日本打敗俄羅斯，證明東洋文明就要覺醒。 資料三：這種種百花齊放的思想，經歷不過十多年，竟然開始陸續遭到政府的壓制。許一多批評政府的作家和思想家被逮捕入獄，作品也遭到查禁。時代變化，軍國主義擡頭，就連像亞洲主義這樣的思想，後來也不幸成為日本對外侵犯的正當化藉口。
  options:
  - label: A
    content: 亞洲主義，就是一種「體用」、「本末」的概念，中國、朝鮮都有過討論
  - label: B
    content: 孫中山相信亞洲主義，也支援加入大東亞共榮圈，反抗西方殖民侵略
  - label: C
    content: 二次大戰後，西方世界開始反省，也進入西方文明走向衰頹的質疑風氣
  - label: D
    content: 不僅日本左派團體受到軍國主義興起而遭取締，臺灣多數團體也遭取締
- id: doc_108_高雄_鳳山_社會_歷史_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: '下文是岑岑暑假參觀博物餡時，看到的一份兩國簽署的條約內容，下列對此條約與兩國間關係的敘述，何者正確？

    韓國皇帝陛下及日本國皇帝陛下顧念兩國間之特殊而親密之關係，欲增進相互幸福，永久確保東洋和平。為達此目的，確信不如合併韓國與日本國者，兩國間茲決定締結合併條約。為此韓國皇帝陛下以內閣總理大臣李完用、日本國皇帝陛下以統監子爵寺內正毅，仍各任命其為全權委員。右列全權委員，會同協議，協定左開諸條： 第一條：韓國皇帝陛下將關於韓國全部一切統治權，完全且永久讓與日本國皇帝陛下。 第二條：日本國皇帝陛下受諾其前條揭載之讓與，且承諾全然合併韓國於日本帝國。 第三條：日本國皇帝陛下對韓國皇帝陛下、太皇帝陛下、皇太子殿下併其后妃及後裔，各應其地位，使享有相當之尊稱、威嚴及名譽，且約供給十分之歲費以保持之。 第四條：日本國皇帝陛下對前條以外之韓國皇族及後裔，各使享有相當之名譽及待遇，且約供與必要之資金以維持之。 第五條：日本國皇帝陛下認以有勳功之韓人而應特為表彰者，授以榮爵，且與恩金。 第六條：日本國政府以前記合併之結果，擔任全然韓國之施政，對遵守該地施行法規之韓人之身體及財產予以十分之保護，且圖增進其福利。 第七條：日本國政府對誠意忠實尊重新制度之韓人且有相當資格者，其於事情所許之範圍，登用為在韓國之帝國官吏。 第八條：本條約經韓國皇帝陛下及日本國皇帝陛下之裁可，自公佈日施行之。

    隆熙四年八月二十二日 內閣總理大臣 李完用

    明治四十三年八月二十二日 統監子爵 寺內正毅'
  options:
  - label: A
    content: 韓國與日本合併之後，即成為日本的士族
  - label: B
    content: 自古以來，雙方衝突多，合併以後可以促進區域和平
  - label: C
    content: 伊藤博文遭暗殺後，使日方加速併吞韓國
  - label: D
    content: 兩國合併以後，日本仍尊重韓國，有自己的議會與外交權
