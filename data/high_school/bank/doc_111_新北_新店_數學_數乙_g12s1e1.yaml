- id: doc_111_新北_新店_數學_數乙_g12s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列選項的敘述哪些正確？
  options:
  - label: A
    content: $\sum_{n=1}^{4} n=\sum_{i=0}^{3} (i+1)=\sum_{k=0}^{\infty} 5 \cdot \left( \frac{1}{2} \right) ^{k}$
  - label: B
    content: 若$\lim_{n\rightarrow \infty} a_{n}=1$，則$\lim_{n\rightarrow \infty} a_{2n}=1$
  - label: C
    content: 已知〈$a_{n}$〉為收斂數列、〈$b_{n}$〉為發散數列，則$\left\langle \frac{a_{n}}{b_{n}} \right\rangle$必為收斂數列
  - label: D
    content: 無窮數列〈$x^{n}$〉的收斂條件為－1＜x＜1
  - label: E
    content: 若函數 f（x）在 x＝3 連續，則$\lim_{x\rightarrow 3^{+}} f(x)=\lim_{x\rightarrow 3^{-}} f(x)$
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\sum_{n=1}^{4} n$＝1＋2＋3＋4＝10

    $\sum_{i=0}^{3} (i+1)$＝1＋2＋3＋4＝10

    $\sum_{k=0}^{\infty} 5 \cdot \left( \frac{1}{2} \right) ^{k}$＝$5\left( \left( \frac{1}{2} \right) ^{0}+\left( \frac{1}{2} \right) ^{1}+\left( \frac{1}{2} \right) ^{2}+\cdots \cdots \right)$＝5×$\frac{1}{1-\frac{1}{2}}$＝10

    (B) ○

    (C) ╳：若〈$a_{n}$〉＝〈$1^{n}$〉，〈$b_{n}$〉＝〈（－1）$^{n}$〉

    則$\left\langle \frac{a_{n}}{b_{n}} \right\rangle$＝〈（－1）$^{n}$〉為發散數列

    (D) ╳：收斂條件應為－1＜x ≤ 1

    (E) ○

    故選(A)(B)(E)'
