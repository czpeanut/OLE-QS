  stem: 關於函數的敘述，下列選項哪些正確？
  options:
  - label: A
    content: f（x）＝$\frac{1}{x}$與 g（x）＝$\frac{1}{│ x │}$的定義域相同
  - label: B
    content: f（x）＝$\sqrt{x^{2}+4x-5}$的值域為{ y ∈ R│y ≥ 0 }
  - label: C
    content: f（x）＝$x^{5}$－2 是奇函數
  - label: D
    content: f（x）＝cosx 與 g（x）＝5 都是偶函數
  - label: E
    content: 若 f（x）＝x＋1，g（x）＝2x，則（g。f）（x）＝2x＋1
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：定義域皆為{ x│x≠0 }

    (B) ○

    (C) ╳：f（－x）＝（－x）$^{5}$－2＝－$x^{5}$－2≠－f（x）

    ∴f（x）＝$x^{5}$－2 不是奇函數

    (D)○：∵f（－x）＝cos（－x）＝cosx＝f（x）

    g（－x）＝5＝g（x）

    ∴f（x）＝cosx 和 g（x）＝5 都是偶函數

    (E) ╳：（g。f）（x）＝g（x＋1）＝2（x＋1）＝2x＋2

    故選(A)(B)(D)'
