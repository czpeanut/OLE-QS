  stem: '已知數列〈$c_{n}$〉滿足以下性質：

    甲：$c_{n}$ ≤ $\frac{4n^{2}}{2n^{2}+1}$；乙：$c_{n}$ ≤ 2；丙：$c_{n}$ ≥ $\frac{2n}{n+1}$；丁：$c_{n}$ ≤ 2n＋8。

    使用下列何者可以求出$\lim_{n\rightarrow \infty} c_{n}$的值？'
  options:
  - label: A
    content: 甲與乙
  - label: B
    content: 乙與丙
  - label: C
    content: 丙與丁
  - label: D
    content: 甲與丙
  - label: E
    content: 乙與丁
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{n\rightarrow \infty} \frac{4n^{2}}{2n^{2}+1}$＝$\lim_{n\rightarrow \infty} \frac{4}{2+\frac{1}{n^{2}}}$＝2

    $\lim_{n\rightarrow \infty} \frac{2n}{n+1}$＝$\lim_{n\rightarrow \infty} \frac{2}{1+\frac{1}{n}}$＝2

    ∴乙和丙，甲和丙可求出$\lim_{n\rightarrow \infty} c_{n}$的值

    故選(B)(D)'
