- id: doc_111_新北_新店_數學_數乙_g12s1e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 2
  stem: '下列各極限若存在，請算出「極限值」，否則請寫「不存在」：

    (1)$\lim_{n\rightarrow \infty} \left( 3+\frac{316}{n} \right)$＝＿＿＿＿。

    (2)$\lim_{n\rightarrow \infty} \frac{3^{n}+7^{n}}{{7^{n}}^{+1}}$＝＿＿＿＿。

    (3)$\lim_{n\rightarrow \infty} \left( \frac{n^{2}+1}{2n-1}-\frac{n^{2}-1}{2n+1} \right)$＝＿＿＿＿。

    (4)$\lim_{x\rightarrow 0} \frac{│ x │}{x}$＝＿＿＿＿。

    (5)$\lim_{x\rightarrow -3} \frac{x^{2}+2x-3}{3+x}$＝＿＿＿＿。

    (6)$\lim_{x\rightarrow -1} \frac{2x^{2}-x+3}{x^{2}+2x+1}$＝＿＿＿＿。'
  answer:
  - (1) 3；(2)$\frac{1}{7}$；(3)$\frac{1}{2}$；(4)不存在；(5)－4；(6) 不存在
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)$\lim_{n\rightarrow \infty} \left( 3+\frac{316}{n} \right)$＝3

    (2)$\lim_{n\rightarrow \infty} \frac{3^{n}+7^{n}}{{7^{n}}^{+1}}$＝$\lim_{n\rightarrow \infty} \frac{\left( \frac{3}{7} \right) ^{n}+1}{7}$＝$\frac{1}{7}$

    (3)$\lim_{n\rightarrow \infty} \left( \frac{n^{2}+1}{2n-1}-\frac{n^{2}-1}{2n+1} \right)$＝$\lim_{n\rightarrow \infty} \frac{2n^{2}+4n}{4n^{2}-1}$＝$\lim_{n\rightarrow \infty} \frac{2+\frac{4}{n}}{4-\frac{1}{n^{2}}}$＝$\frac{1}{2}$

    (4)$\lim_{x\rightarrow 0^{-}} \frac{│ x │}{x}$＝$\lim_{x\rightarrow 0^{-}} \frac{-x}{x}$＝－1

    $\lim_{x\rightarrow 0^{+}} \frac{│ x │}{x}$＝$\lim_{x\rightarrow 0^{+}} \frac{x}{x}$＝1

    ∵$\lim_{x\rightarrow 0^{-}} \frac{│ x │}{x}$≠$\lim_{x\rightarrow 0^{+}} \frac{│ x │}{x}$

    ∴此極限不存在

    (5)$\lim_{x\rightarrow -3} \frac{x^{2}+2x-3}{3+x}$＝$\lim_{x\rightarrow -3} \frac{(x-1)(x+3)}{3+x}$＝$\lim_{x\rightarrow -3} (x-1)$＝－4

    (6)$\lim_{x\rightarrow -1} \frac{2x^{2}-x+3}{x^{2}+2x+1}$＝$\lim_{x\rightarrow -1} \left( 2+\frac{-5x+1}{x^{2}+2x+1} \right)$，此極限不存在'
