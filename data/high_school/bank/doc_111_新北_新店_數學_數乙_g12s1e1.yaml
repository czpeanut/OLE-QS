  explanation: '∵$\lim_{x\rightarrow -1} \frac{f(x)}{x+1}$＝－2，$\lim_{x\rightarrow 1} \frac{f(x)}{x-1}$＝10

    ∴f（－1）＝0 且 f(1)＝0

    設 f（x）＝（x＋1）（x－1）（ax＋b）

    $\lim_{x\rightarrow -1} \frac{f(x)}{x+1}$＝$\lim_{x\rightarrow -1}$（（x－1）（ax＋b））＝2a－2b＝－2 ⇒ a－b＝－1………①

    $\lim_{x\rightarrow 1} \frac{f(x)}{x-1}$＝$\lim_{x\rightarrow 1}$（（x＋1）（ax＋b））＝2a＋2b＝10 ⇒ a＋b＝5 ……………②

    由①、②得 a＝2，b＝3 ∴f（x）＝（x＋1）（x－1）（2x＋3）

    故$\lim_{x\rightarrow 0} \frac{f(x)}{x-2}$＝$\lim_{x\rightarrow 0} \frac{(x+1)(x-1)(2x+3)}{x-2}$＝$\frac{3}{2}$'
