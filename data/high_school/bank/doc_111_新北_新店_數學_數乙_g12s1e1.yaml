- id: doc_111_新北_新店_數學_數乙_g12s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列選項中的無窮數列哪些是收斂的？
  options:
  - label: A
    content: $\left\langle \left( \frac{\sqrt{5}}{2} \right) ^{n} \right\rangle$
  - label: B
    content: 〈（－1）$^{n}$〉
  - label: C
    content: 〈（$0.\overline{3}$＋$0.\overline{7}$）$^{n}$〉
  - label: D
    content: 〈$\sqrt[n]{309}$〉
  - label: E
    content: $\left\langle \frac{(-1)^{n}}{n^{2}} \right\rangle$
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：公比 r＝$\frac{\sqrt{5}}{2}$

    ∵│r│＞1 ∴數列$\left\langle \left( \frac{\sqrt{5}}{2} \right) ^{n} \right\rangle$發散

    (B) ╳：∵公比 r＝－1 ∴數列〈（－1）$^{n}$〉發散

    (C) ╳：$0.\overline{3} +0.\overline{7} =\frac{3}{9}+\frac{7}{9}=\frac{10}{9}$

    公比 r＝$\frac{10}{9}$

    ∵│r│＞1 ∴數列〈（$0.\overline{3} +0.\overline{7}$）$^{n}$〉發散

    (D) ○：$\lim_{n\rightarrow \infty} \sqrt[n]{309}$＝$\lim_{n\rightarrow \infty} 309^{\frac{1}{n}}$＝1

    (E) ○：$\lim_{n\rightarrow \infty} \frac{(-1)^{n}}{n^{2}}$＝0

    故選(D)(E)'
