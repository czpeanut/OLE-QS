  stem: 在 2020 年東京奧運宣傳影片中，超級瑪利歐從東京（35.6°N，139°E）穿越地心後，從地球的另一個端點鑽出來，請問該端點將會最接近下列哪一個城市？
  options:
  - label: A
    content: 智利聖地牙哥（33.45°S，70.66°W）
  - label: B
    content: 奧克蘭（36°S，147°E）
