  stem: 2009 年 8 月的莫拉克風災，是臺灣近 50 年來的大水患，在沿海與山區均造成了莫大的災害。舊高雄縣甲仙鄉的小林村，那瑪夏鄉的民族村，發生了嚴重的山崩、土石流。其中，小林村因北側之獻肚山發生驚人之山崩，因而造成幾近滅村，400 餘人被土石掩埋，災情最為慘重；倖存之居民在政府及民間協助下，考量距離與安全性，選擇在其西南方之杉林村復村。請問上述「復村地點的選擇考量」，乃採用地理學中的何種分析方法進行？
