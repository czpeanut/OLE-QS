  answer_source: answer_key
  explanation: 討論如下： (i) x ≥ $\frac{1}{2}$時，( x＋3 )－( 2x－1 )＝－x＋1 ⇒ 0x＝－3 ∴ 無解 (ii) －3＜x＜$\frac{1}{2}$時，( x＋3 )－( 1－2x )＝－x＋1 ⇒ 4x＝－1 ⇒ x＝$\frac{- 1}{4}$。 (iii) x ≤ －3時，(－x－3 )－( 1－2x )＝－x＋1 ⇒ 2x＝5 ⇒ x＝$\frac{5}{2}$( 不合 )。 故所求為$-\frac{1}{4}$。
