  stem: <u>全糖高中</u>的校園生態豐富，自由的環境孕育出獨一無二的原生種—黑特猴；為保護此類獨特的珍稀物種，校方對共進行了初步的統計及研究，發現黑特猴的數量可以用數學模式：M (t)＝a ( 1－$10^{－bt}$ ) 來描述猴群數量的變化，其中M (t) 為猴子數量，t為經過的時間（以月為單位），a、b為常數。已知自校方進行調查之始，資料顯示一個月後有60隻黑特猴，三個月後有105隻黑特猴，依此數學模式，試問兩個月時，校園裡黑特猴的數量共有＿＿＿＿隻。
