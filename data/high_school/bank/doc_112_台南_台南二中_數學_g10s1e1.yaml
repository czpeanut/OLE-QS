  answer_status: verified
  answer_source: answer_key
  explanation: 可得$\begin{cases}M(1)=a ( 1-10^{-b} )=60\cdots \cdots ① \\ M(3)=a ( 1-10^{-3b} )=105 \cdots ②\end{cases}$，$\frac{②}{①}=\frac{1-1{0^{-}}^{3b}}{1-10^{-b}}=\frac{105}{60}=\frac{7}{4}$ ⇒ 1＋$10^{－b}$＋$10^{－2b}$＝$\frac{7}{4}$ ⇒ 4．($10^{－b}$)$^{2}$＋4．$10^{－b}$－3＝0 ⇒ 3( 2．$10^{－b}$＋3 )( 2．$10^{－b}$－1 )＝0 ⇒ $10^{－b}$＝$\frac{1}{2}$代入① ⇒ a＝120， 所以M (2)＝a ( 1－$10^{－2b}$ )＝120 ( 1－($\frac{1}{2}$)$^{2}$ )＝120×$\frac{3}{4}$＝90， 故所求為90隻。
