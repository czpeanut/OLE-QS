  - label: B
    content: $\sqrt{5}+\sqrt{3}>\sqrt{6}+\sqrt{2}$
  - label: C
    content: $\frac{1}{7\times 10^{8}}$的科學記號表示為$7^{－1}$×$10^{－8}$
  - label: D
    content: $2^{\frac{1}{2}}>3^{\frac{1}{3}}$
  - label: E
    content: 已知a、b為實數且a＜b，則a＜$\frac{2a+7b}{10}$＜$\frac{2a+7b}{9}$＜b
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)×：$\sqrt{x^{2}+\frac{1}{x^{2}}+2}$＝$\sqrt{( x+\frac{1}{x} )^{2}}$＝|$x+\frac{1}{x}$|。 (B)○：($\sqrt{5}+\sqrt{3}$)$^{2}$＝8＋$2\sqrt{15}$，($\sqrt{6}+\sqrt{2}$)$^{2}$＝8＋$2\sqrt{12}$ ⇒ $\sqrt{5}+\sqrt{3}$＞$\sqrt{6}+\sqrt{2}$。 (C)×：因為0＜$7^{－1}$＜1，所以$7^{－1}$×$10^{－8}$不為科學記號。 (D)×：$2^{\frac{1}{2}}=( 2^{3} )^{\frac{1}{6}}=\sqrt[6]{8}$，$3^{\frac{1}{3}}=( 3^{2} )^{\frac{1}{6}}=\sqrt[6]{9}$ ⇒ $2^{\frac{1}{2}} < 3^{\frac{1}{3}}$。 (E)×：反例：a＝－1，b＝0 ⇒ 2a＋7b＝－2 ⇒ $\frac{2a+7b}{10}=\frac{- 2}{10}$＞$\frac{- 2}{9}=\frac{2a+7b}{9}$。 故選(A)(B)(D)。
