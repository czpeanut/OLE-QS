  stem: '人類的五感為『視／聽／嗅／味／觸覺』，且都與對數有所關聯。德國科學家韋伯與費克納先後發現「韋伯-費克納定律：人類對任何刺激的反應。與這些刺激強度的對數成正比。」，而其中『聽覺』的韋伯-費克納方程式為：

    s＝10×$log_{10}$ w

    其中w為音強度（單位：W/$m^{2}$），s為儀器或耳朵接收到的感受（單位：分貝）<u>阿豹</u>在模擬考時，被窗外一群缺乏同理心、持續大聲吱吱叫的黑特猴吵到理智斷線，下課忿而拿起儀器一量！儀器顯示猴群叫聲為30分貝，則其聲音強度為 ＿＿＿＿W/$m^{2}$。'
  answer:
