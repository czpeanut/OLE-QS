    content: $\sum_{n =1}^{\infty} 1^{n}$
  - label: D
    content: $\left\langle \frac{1}{n} \right\rangle$
  - label: E
    content: $\sum_{n =1}^{\infty} \frac{1}{n}$
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
