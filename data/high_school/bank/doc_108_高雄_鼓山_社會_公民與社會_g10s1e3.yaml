  group_stem: 社會規範的功能之一是社會控制（social control），而社會控制是社會對其成員的行為進行指導、制裁和約束。又可分為外在控制與內在控制。前者是要求社會成員必須接受控制者提出的行為模式，一旦違反可能受到權力的嚴厲懲處；後者是社會或組織成員用內化的價值規範約束和指導自己行為的過程，也就是社會成員自我願意遵守。由此可知，外在控制可以使社會成員體會到社會環境壓力約束其行為，使其不敢違反社會規範；內在控制則著重在行為者本身的控制力量。
