  group_stem: 生活在現代法治社會的人們，日常生活中主要受到行政法與《民法》的保障與約束。前者規範國家（特別是行政機關）對人民的管理與照顧的依據；後者則是規範人民之間權利與義務。由此可知，行政法與《民法》與人民日常生活息息相關。譬如一個新生命的誕生，須依照行政法規定辦理出生登記。但新生兒的姓氏是隨父還是隨母、該如何命名，則必須符合《民法》的相關規定；當一個人終老離世時，死亡登記須依行政法辦理。遺產的分配歸屬則依《民法》規定。
