  stem: 我國升學考試有原住民族加分制度，長年下來民間有不同意見。然而考察制度緣起與內涵，發現原來加分制度是為了加強對原住民族的同化，而今則有補償作用及希望透過母語檢定加強發展族群文化之目的；此外，原住民族名額為外加名額，並非占有一般生名額。不過有反對者指出，原住民族中也存在著階級差異，現有制度並未衡酌階級的影響。關於上述討論，何種說法較為合理？
