  stem: 下列分析大法官解釋文，哪一號解釋是在闡釋「實質正當」精神？
  options:
  - label: A
    content: 《司法院釋字第409號解釋》：「徵收土地究對人民財產權發生嚴重影響，法律就徵收之各項要件，自應詳加規定」
  - label: B
    content: 《司法院釋字第462號解釋》：「評審過程中必要時應予申請人以書面或口頭辯明之機會」
  - label: C
    content: 《司法院釋字第488號解釋》：「應予相對人、利害關係人等有陳述意見等廣義『聽證權』之機會」
  - label: D
    content: 《司法院釋字第641號解釋》：「本法施行前專賣之米酒，應依原專賣價格出售。超過原專賣價格出售者，應處每瓶新臺幣二千元之罰鍰」
  group_stem: 「正當行政程序」原則來自「正當法律程序」原則，後者又源自1215年的英國大憲章中規定，「任何自由人除非受到合法審判，否則不受逮捕、拘禁、扣押、權利或財產之剝奪、法外放置、放逐、或用其他方法遭受地位之剝奪」，目的是在防止國王恣意行使權力。之後，美國憲法的正當法律程序原則，實務運用上，又將此原則分為「程序正當」與「實質正當」。「程序正當」原則的目的在確保國家權力行使之程序公平，也就是若以國家公權力限制人民的「生命、自由或財產」時，應遵循種程序方為正當之問題。至於我國的「正當法律程序」概念明定在憲法第8條，「對人民身體之自由應予保障。除現行犯之逮捕由法律另定外，非經司法或警察機關依法定程序，不得逮捕拘禁。非由法院法定程序，不得審問處罰。非依法定程序之逮捕、拘禁、審問、處罰，得拒絕之」。
  answer:
  - B
