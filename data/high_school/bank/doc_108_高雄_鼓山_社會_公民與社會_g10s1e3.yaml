  stem: 有學者對何謂「行政」作了如下定義：「行政是指立於法律之下，除司法及監察之外的國家作用，而考試亦包含在行政之內。」人民日常生活的各個層面，均會受到國家行政的影響。試問下列何者是行政機關依行政法執行或完成的行為？
