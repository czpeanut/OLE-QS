  stem: 孔子曾說過：「民無信不立」，意思就是：「如果對人民沒有了誠信，那麼人民對國家也不再信任，這樣國家就不能立足。」而這也正是行政法中「信賴保護原則」的基本精神之一。請問：下列敘述何者最符合信賴保護原則的內涵？
