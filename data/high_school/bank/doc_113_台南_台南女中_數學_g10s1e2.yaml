- id: doc_113_台南_台南女中_數學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若坐標平面上三直線 $L_{1}$：x＋3y－1＝0，$L_{2}$：x－y＋3＝0，$L_{3}$：2x＋ay＋1＝0 不能圍成一個三角形，則 a 的所有可能的值的總和為多少？
  options:
  - label: A
    content: －2
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '7'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}x+3y-1 = 0 \\ x -y+3 = 0\end{cases}$⇒（x，y）＝（－2，1）

    即 $L_{1}$ 與 $L_{2}$ 交於點 A（－2，1）

    $L_{1}$ 之斜率為 $m_{1}$＝$-\frac{1}{3}$

    $L_{2}$ 之斜率為 $m_{2}$＝1

    若 a＝0，則 $L_{3}$：2x＋1＝0，此時 $L_{3}$ 不過點 A（－2，1）

    因此若 a＝0，則 $L_{1}$，$L_{2}$，$L_{3}$ 會圍成一個三角形

    若 a≠0，則 $L_{3}$ 之斜率為 $m_{3}$＝$-\frac{2}{a}$

    $L_{1}$，$L_{2}$，$L_{3}$ 不能圍成一個三角形

    ⇒ $L_{3}$//$L_{1}$ 或 $L_{3}$//$L_{2}$ 或 $L_{3}$ 過點 A

    $L_{3}$//$L_{1}$ ⇒$-\frac{2}{a}$＝$-\frac{1}{3}$⇒ a＝6

    $L_{3}$//$L_{2}$ ⇒$-\frac{2}{a}$＝1 ⇒ a＝－2

    $L_{3}$ 過點 A ⇒'
- id: doc_113_台南_台南女中_數學_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 已知過三點（0，1），（0，6），（3，0）的圓方程式為 $x^{2}$＋$y^{2}$＋dx＋ey＋f＝0，求 d＋e＋f＝？
  options:
  - label: A
    content: －5
  - label: B
    content: －6
  - label: C
    content: －7
  - label: D
    content: －8
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '（－2）＋a．1＋1＝0 ⇒ a＝3

    a 的所有可能的值之總和為 6＋（－2）＋3＝7

    故選(D)

    2.圓 $x^{2}$＋$y^{2}$＋dx＋ey＋f＝0 過三點（0，1），（0，6），（3，0）

    因此$\begin{cases}0^{2}+1^{2}+d\times 0+e\times 1+f=0 \cdots \cdots \cdots \cdots \cdots \cdots ① \\ 0^{2}+6^{2}+d\times 0+e\times 6+f=0 \cdots \cdots \cdots \cdots \cdots \cdots ② \\ 3^{2}+0^{2}+d\times 3+e\times 0+f=0 \cdots \cdots \cdots \cdots \cdots \cdots ③\end{cases}$

    ②－①得 35＋5e＝0 ⇒ e＝－7 ……………④

    ④代入①得 f＝6 ……………………………⑤

    ⑤代入③得 d＝－5

    因此 d＋e＋f＝（－5）＋（－7）＋6＝－6

    故選(B)'
- id: doc_113_台南_台南女中_數學_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列哪一個選項中的兩點均在給定直線的同一個半平面？
  options:
  - label: A
    content: （3，5）、（1，3），$L_{1}$：2x－y＝0
  - label: B
    content: （0，0）、（3，－2），$L_{2}$：x－y＋1＝0
  - label: C
    content: （－3，1）、（1，3），$L_{3}$：3x－y＋1＝0
  - label: D
    content: （0，3）、（－4，0），$L_{4}$：3x－y＋5＝0
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：（2×3－5）（2×1－3）＝－1＜0

    表兩點不在 $L_{1}$ 之同一個半平面

    (B) ○：（0－0＋1）（3－（－2）＋1）＝6＞0

    表兩點在 $L_{2}$ 之同一個半平面

    (C) ╳：（3×（－3）－1＋1）（3×1－3＋1）＝－9＜0

    表兩點不在 $L_{3}$ 之同一個半平面

    (D) ╳：（3×0－3＋5）（3×（－4）－0＋5）＝－14＜0

    表兩點不在 $L_{4}$ 之同一個半平面

    故選(B)'
- id: doc_113_台南_台南女中_數學_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 設 $L_{1}$：6x＋（2a－1）y＝8，$L_{2}$：（a＋2）x＋（a＋3）y＝－3，若 $L_{1}$//$L_{2}$，且 a 不是整數，則 a 的值為何？
  options:
  - label: A
    content: $-\frac{5}{2}$
  - label: B
    content: $-\frac{7}{2}$
  - label: C
    content: $-\frac{9}{2}$
  - label: D
    content: $-\frac{11}{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 'a 不是整數，因此 a＋2≠0 且 a＋3≠0

    ∵$L_{1}$//$L_{2}$ ∴$\frac{6}{a+2}$＝$\frac{2a-1}{a+3}$≠$\frac{8}{-3}$

    ⇒ 6（a＋3）＝（a＋2）（2a－1）

    ⇒ $2a^{2}$－3a－20＝0

    ⇒（a－4）（2a＋5）＝0

    ⇒ a＝$-\frac{5}{2}$（a＝4 不合，因為 a 不是整數）

    故選(A)'
