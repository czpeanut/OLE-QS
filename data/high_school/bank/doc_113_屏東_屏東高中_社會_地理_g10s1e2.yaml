  page: 1
  stem: 《徐霞客遊記》是中國明代著名地理學家、旅遊家徐霞客的旅遊日記，也是世界上研究喀斯特地形最早的一本書。徐霞客（1587 ～ 1641 年）根據自己的親身經歷用日記體裁撰寫記錄廣西、貴州和雲南一帶的石灰岩地形，並且提供歷史地理學研究許多重要資料。英國科技史專家李約瑟評價道：「他的遊記讀來並不像是 17 世紀的學者所寫的東西，倒像是一部 20 世紀的野外勘察紀錄。」徐霞客在遊記中盛讚「玉華洞」：「弘含奇瑰，……眩巧爭奇，遍布幽奧」。請問徐霞客可能在洞穴裡見到哪些地形而有此讚嘆？(甲)鐘乳石(乙)錐丘(丙)滲穴(丁)石筍
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 丙丁
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題目中已提及遊記記錄的是石灰岩地形，(甲)(丁)為石灰岩洞內可能出現的地形，(乙)(丙)為地表地形。故答案選(B)(甲)(丁)。
