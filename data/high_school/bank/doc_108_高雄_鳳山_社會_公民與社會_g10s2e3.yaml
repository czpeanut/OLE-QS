- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_39
  section: 1
  number: 39
  type: single
  page: 6
  stem: 除了原住民族傳統智慧創作外，在歷史上，原住民族曾遭受到許多不公平的對待，例如土地遭到巧取豪奪，因為政府政策而導致文化、語言的衰微。為匡正歷史上的不正義，如今政府推動了許多制度，鼓勵並且保障原住民族傳統文化的復興。下列敘述都是有關原住民族傳統文化、土地的保障措施或是困境，何者與上文第一段的議題相同？
  options:
  - label: A
    content: 電影《冰雪奇緣2》以原住民族薩米族的傳說為背景，找該族人擔任電影顧問
  - label: B
    content: 《原住民族權利宣言》宣誓，各國應保障原住民族自主決定的權利參與制度設計的過程
  - label: C
    content: 二戰過後，政府制定法律要求原住民族也要依照「漢人姓名」自訂姓名
  - label: D
    content: 美國在1887年強迫美洲原住民族遷入保留地，使其離開原先居住的土地
  group_stem: 外交部自2011年開始實行國際青年大使交流計畫，希望藉此將臺灣的文化藝術、公共衛生美食等特色與國際交流，但在2013年卻發生即將出訪的青年大使在不瞭解原住民族文化特色的情況下，將原住民族的傳統服裝用錯誤的方式穿戴、使用不正確的方式展現傳統舞蹈，引起濫用傷害原住民族傳統文化的爭議。最後青年大使虛心接受指教並盡力改正錯誤，但也再次引起國內對於原住民族文化保障議題關注。依據聯合國通過的《原住民族權利宣言》，各國應該通過與原住民族共同制定的有效機制對未事先獲得他們自由知情同意，或在違反其法律、傳統和習俗的情況下拿走的原住民族文化、知識、宗教和精神財產，予以補償，包括歸還原物。 因而《原住民族依生活慣俗採取森林產物規則》在2019年7月生效，未來森林葉花果這類副產物，基於自用採集免申請；而原住民族基於傳統祭儀、生命禮俗以及公共使用的林木需求，也可由部落或者社區組織以年度為單位提案，經主管機關核准後自主管使用。部落、原住民族團體提案時，須同時提出採取森林產物之自主管理機制或公約，未來原住民族部落成為公法人後主管機關或國、公有林土地管理機關可依據本規則委託部落公法人，辦理採取林產物查驗工作，落實部落自主管理；此外，受理機關應協助提案人辦理本規則相關提案事項。
