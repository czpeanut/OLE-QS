  group_stem: 2019年5月中旬時，中部地區發生一樁槍擊命案，主嫌是6歲的陳男與16歲的李姓少年，持槍對茶藝館內掃射，正在茶藝館內喝茶的史姓男子中彈身亡，與案情毫無關聯也在品茗的一對夫婦遭到波及，但並無大礙，這對夫婦事後回想仍驚恐不已。兩名犯嫌於事發後逃逸，檢警獲報可能已經偷渡到東南亞國家躲藏，承辦的警局表示，全案已依殺人、槍砲罪嫌函送地檢署偵辦，<u>基於(甲)原則</u>，暫不對特定案情說明內容。據了解，兩位嫌犯在作案後不久就已採偷渡方式離開臺灣，警方已通報刑事局國際科請該他國警方協助尋人。日後檢警向社會各界說明的資料中指出陳男與遭槍擊的史姓死者是兒時玩伴，至於李姓少年國中期間就展現逞凶鬥狠性格，還曾經接受感化教育。本案是電話詐騙集團因分贓不均而導致殺人，涉及金額高達3億新臺幣。警方已經將全案蒐證到的具體犯罪事證，依殺人、槍砲、《少年事件處理法》罪嫌，將兩人函送地檢署偵辦而李姓少年還另涉妨害自由案，已遭法院發布協尋，全案起訴後若二人未到案，將發布通緝協尋。
