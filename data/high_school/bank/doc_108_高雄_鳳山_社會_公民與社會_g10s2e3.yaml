  stem: 《憲法》第20條雖已明文規定人民有依法律服兵役的義務，不過近年國防部積極推動募兵制，想要取代現行的一般徵兵制。假設在現行《憲法》未修正的情形下，國防部推動募兵制一事，下列敘述何者正確？
  options:
  - label: A
    content: 國防事務為《憲法》賦予總統的職權，總統主持國家安全會議決議通過實施募兵制，並無違憲疑慮
  - label: B
    content: 國防部隸屬行政院會議決議通過實施募兵制，即可立刻實行
  - label: C
    content: 依大法官釋字第490號解釋，兵役事務屬立法政策，因此立法者在兵役事務範圍內，享有自由立法之空間，不受《憲法》第20條拘束
  - label: D
    content: 依《憲法》第20條及釋字第490號解釋，雖然《憲法》規定人民有依法律服兵役的義務，但是反面來說，只要立法者在合乎《憲法》要求的範圍內，以法律規定實施募兵制，亦不違反《憲法》
  group_stem: 請閱讀下列兩則資料後，回答下列問題： 資料一： 我國《憲法》第7條：「中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。」第20條：「人民有依法律服兵役之義務。」《兵役法》第1條：「中華民國男子依法皆有服兵役之義務。」 資料二： 司法院大法官釋字第490號解釋：「人民有依法律服兵役之義務，為《憲法》第20條所明定。…立法者鑑於男女生理上之差異及因此種差異所生之社會生活功能角色之不同，於《兵役法》第1條規定：『中華民國男子依法皆有服兵役之義務』，係為實踐國家目的及憲法上人民之基本義務而為之規定，原屬立法政策之考量……復次，服兵役之義務，並無違反人性尊嚴亦未動搖《憲法》價值體系之基礎，且為大多數國家之法律所明定，更為保護人民，防衛國家之安全所必需，與《憲法》第7條平等原則及第13條宗教信仰自由之保障，並無牴觸。」
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_26
  section: 1
  number: 26
  type: single
  page: 5
  stem: 依據上開解釋，下列敘述何者<u>「錯誤」</u>？
  options:
  - label: A
    content: 關於《憲法》有明文規定的事項立法者縱然可以進行相關立法加以規定，但是立法內容不可與《憲法》規定牴觸
  - label: B
    content: 憲法所規定之事項跟法律保留事項都是憲法下應遵守的原理原則，在法位階的效力是相等的
  - label: C
    content: 我國《憲法》第8條人身自由的保障屬於憲法所規定之事項
  - label: D
    content: 我國不論刑事、行政都要受到《憲法》第8條規定的法定程序規範
  group_stem: 請依據下列解釋以及對《憲法》概念的理解來回答下列各題： 資料一： 司法院大法官釋字第588號解釋：「……人身自由乃人民行使其《憲法》上各項自由權利所不可或缺之前提，《憲法》第8條第1項規定所稱『法定程序』，係指凡限制人民身體自由之處置，不問其是否屬於刑事被告之身分，除須有法律之依據外，尚須分別踐行必要之司法程序或其他正當法律程序，始得為之。此項程序固屬《憲法》保留之範疇，縱係立法機關亦不得制定法律而遽予剝奪。」 資料二： 司法院大法官釋字第664號解釋：「……依上開第26條第2款及第42條第1項第4款規定，使經常逃學或逃家而未觸犯刑罰法律之虞少年，收容於司法執行機構或受司法矯治之感化教育，與保護少年最佳利益之意旨已有未符。而上開規定對經常逃學或逃家之虞犯少年施以收容處置或感化教育處分，均涉及對虞犯少年於一定期間內拘束其人身自由於一定之處所，而屬《憲法》第8條第1項所規定之『拘禁』，對人身自由影響甚鉅，其限制是否符合《憲法》第23條規定，應採嚴格標準予以審查。……是《少年事件處理法》第26條第2款及第42條第1項第4款規定，就限經常逃學或逃家虞犯少年人身自由部分，不符《憲法》第23條之比例原則，亦與《憲法》第22條保障少年人格權，國家應以其最佳利益採取必要保護措施，使其身心健全發展之意旨有違。」
