  stem: 請問支持者主張較接近下列哪一個觀點？
  options:
  - label: A
    content: 應報理論
  - label: B
    content: 刑法謙抑原則
  - label: C
    content: 從輕原則
  - label: D
    content: 罪刑法定原則
  group_stem: 2020年5月29日司法院大法官會議做出釋字第791號解釋，認定刑法第239條通姦罪以及刑事訴訟法第239條但書「對於配偶撤回告訴者，其效力不及於相姦人」違反了比例原則，宣告違憲，台灣不再用刑罰懲罰婚姻不忠。通姦罪原是基於保障家庭與婚姻生活的圓滿，以及配偶間互負忠貞義務之立法目的，遂以《刑法》處罰有配偶之人與第三人之通姦行為，但配偶對於通姦之配偶撤回告訴者，其效力不及於第三人。隨著社會變遷通姦罪除罪化的議題正反意見一直爭論不下。 有支持者認為通姦罪無法守護家庭，刑罰亦無法修復感情裂痕，故國家公權力不應涉入私人問題況且，除罪化不表示無法透過法律懲治或者防止配偶外遇，而是將私人問題回歸民事處理，由配偶向外遇方及第三者依《民法》侵害配偶權，求償精神慰撫金。 反對者則認為通姦罪是藉由刑罰達到慰撫遭背叛配偶的功能，而非用以維繫婚姻。再者民事損害賠償與刑事刑罰權目的不同，不能僅以受害人得提起民事損害賠償或或者訴請離婚，即認為無規範之必要性，且相關民事判決金額普遍不高，導致遭背叛的配偶於情感以及物質上，皆無法獲得合情理的補償。 實務上常發生妻子因情感或經濟因素原諒出軌丈夫，卻利用通姦罪讓第三者接受社會公審，獨自背負妨害家庭的前科惡名，通姦罪儼然已成為懲治報復的武器，違反立法原意。2017年，司改國是會議因此建議，若短時間內無法廢除通姦罪，至少應刪除單獨對配偶撤告的規定。
