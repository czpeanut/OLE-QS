  stem: 大陞因為跟女性友人關係密切，遭到妻子告訴通姦罪，目前法院正審理中。如果在審理過程中，立法院通過關於通姦罪的《刑法》的修法，法院應該如何適用法條呢？
  options:
  - label: A
    content: 如果立法院免除通姦罪的罪責，依據不溯及既往原則，法院仍應依舊法審判
  - label: B
    content: 如果立法院加重通姦罪的罪責，依據罪刑法定原則，法院應該適用新的規定
  - label: C
    content: 如果立法院將通姦罪刑責改為唯一死刑，依據從舊原則，法院應依舊法審判
  - label: D
    content: 如果立法院減輕通姦罪的罪責，法官仍可依自由心證，判處較重的刑事處罰
