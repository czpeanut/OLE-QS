  stem: 依據上開解釋以及《憲法》第8條規定，下列哪些事項因涉及人身自由的拘束，而須要法院訊問後同意才能執行？(甲)依《民法》離婚後對子女監護權及會面權的裁定；(乙)行政執行法規定，對不繳納怠金的義務人執行拘提、管收；(丙)《刑事訴訟法》為了保全證據、防止串供對被告所為的羈押；(丁)《少年事件處理法》對虞犯少年施以收容處置的處分。
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 甲乙丁
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲丙丁
  group_stem: 請依據下列解釋以及對《憲法》概念的理解來回答下列各題： 資料一： 司法院大法官釋字第588號解釋：「……人身自由乃人民行使其《憲法》上各項自由權利所不可或缺之前提，《憲法》第8條第1項規定所稱『法定程序』，係指凡限制人民身體自由之處置，不問其是否屬於刑事被告之身分，除須有法律之依據外，尚須分別踐行必要之司法程序或其他正當法律程序，始得為之。此項程序固屬《憲法》保留之範疇，縱係立法機關亦不得制定法律而遽予剝奪。」 資料二： 司法院大法官釋字第664號解釋：「……依上開第26條第2款及第42條第1項第4款規定，使經常逃學或逃家而未觸犯刑罰法律之虞少年，收容於司法執行機構或受司法矯治之感化教育，與保護少年最佳利益之意旨已有未符。而上開規定對經常逃學或逃家之虞犯少年施以收容處置或感化教育處分，均涉及對虞犯少年於一定期間內拘束其人身自由於一定之處所，而屬《憲法》第8條第1項所規定之『拘禁』，對人身自由影響甚鉅，其限制是否符合《憲法》第23條規定，應採嚴格標準予以審查。……是《少年事件處理法》第26條第2款及第42條第1項第4款規定，就限經常逃學或逃家虞犯少年人身自由部分，不符《憲法》第23條之比例原則，亦與《憲法》第22條保障少年人格權，國家應以其最佳利益採取必要保護措施，使其身心健全發展之意旨有違。」
