  group_stem: 2014年臺灣發生「太陽花學運」，抗議民眾從立法院轉進行政院，事後爆發驅離濺血的事件臺北地方法院於2019年10月一審宣判，臺北市警察局應賠償原告14個人共新臺幣111萬元。法院判決理由為：「行政院院區及周邊是《集會遊行法》所定集會遊行之『禁制區』，然於禁制區之非法集會，於強制驅離時，仍應依現場情形決定如何使用警械。原告之傷害係因警察執勤過當而施以暴力所致，原告請求賠償應屬有理。」
