- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: '以下為某政府網站的Q&A，請問關於政府資訊之規範，以下哪一種說法較為正確？

    Q：只要是政府資訊，都可以取得嗎？有沒有限制？ A：政府資訊的公開必須兼顧國家機密，程序正義與民眾個人權利。因此舉凡國家機密影響民眾個人權益，例如隱私權、著作權、營業祕密，或與政府執行公權力相關的程序正義，例如檢調取締、專業考試等，依據《資訊公開法》規定，政府單位可以拒絕公開前開資訊，詳細的限制請參考《資訊公開法》第18條。政府在訂定《資訊公開法》時，了解資訊公開與限制互為消長，因此對於限制採表列方式，不在限制範圍之資訊，依法不得拒絕民眾申請。'
  options:
  - label: A
    content: 政府資訊公開必須兼顧國家機密，故以被動公開為原則
  - label: B
    content: 僅有檢調取締、專業考試，政府單位可以拒絕公開資訊
  - label: C
    content: 限制採表列方式，不在限制範圍之資訊，民眾不得申請
  - label: D
    content: 政府資訊公開增進人民對公共事務之了解、信賴及監督
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 敞純擔任市長時，常到其妻子資穎所經營的餐廳召開市政會議，事後並以市政府公費報帳總金額達10萬元。由於敞純與資穎是夫妻關係，資穎經營的餐廳若與市政府交易，將會有利益衝突之虞，但是敞純仍批准到該餐廳消費，因此違法而遭監察院處以罰鍰。根據上述推論，監察院開罰的理由最可能是基於下列何者？
  options:
  - label: A
    content: 公務員未依法適時迴避
  - label: B
    content: 非特約餐廳，產生組織不合法
  - label: C
    content: 未進行公開招標，違反資訊公開
  - label: D
    content: 未告知其妻不得接待市府，違反受告知權
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 老師上課詢問同學為何《刑法》的犯罪行為要以在「行為時」有《刑法》明文規定為限而不能回溯適用於發生在生效日之前的行為。以下有四位同學回答，哪一位同學的解釋正確？
  options:
  - label: A
    content: 苡琴：《刑法》的「禁止溯及既往」原則可以保證人民安心自由行動，不必擔心政府在行為後羅織罪名
  - label: B
    content: 庭葦：《刑法》的「禁止溯及既往」原則可以方便法官審理案件，因為法官已經熟悉舊法的內容與精神
  - label: C
    content: 凱誠：《刑法》當中的「禁止溯及既往」原則可以幫助檢察官提起公訴、追訴犯罪、找尋證據，有利偵辦案件
  - label: D
    content: 子晴：《刑法》的「禁止溯及既往」原則可減輕立法員工作的壓力，不必趕著修改或制定新的法律
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 陳進興殺害白曉燕案，其兇殘手法造成社會震驚，雖然陳進興曾表示悔意，但社會大眾當時仍然希望能夠有更嚴厲的刑罰來處置犯人，以安慰受害者家屬的情緒。也有人認為治亂世用重典，應該殺雞儆猴，重罰犯人讓其他意欲犯罪的歹徒心生恐懼。請問：上述兩種對於犯罪的觀點有何差異？
  options:
  - label: A
    content: 前者是應報理論，後者屬於預防理論
  - label: B
    content: 前者是預防理論，後者屬於應報理論
  - label: C
    content: 兩者都是應報理論
  - label: D
    content: 兩者都是預防理論
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 權勝與家勳在捷運站交易海洛因磚時，警察即一擁而上，將權勝與家勳制在地，並在家勳身上搜出兩塊海洛因磚，事後並經家勳的證詞，另搜得海洛因磚20塊。海洛因屬於我國規定之一級毒品，依據《毒品危害防制條例》規定：「製造、運輸、販賣第一級毒品者，處死刑或無期徒刑；處無期徒刑者，得併科新臺幣2千萬元下罰金。」而一審法官最後對家勳宣判無期徒刑，請問下列敘述何者正確？
  options:
  - label: A
    content: 法官對家勳宣判無期徒刑，但也可以對家勳宣告緩刑
  - label: B
    content: 家勳可以在宣判後抗告
  - label: C
    content: 如果家勳沒有錢請律師，政府可以為家勳指派公設辯護人為其辯護
  - label: D
    content: 若家勳不服法院之宣判，應向高等法院之檢察署提起上訴
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 總統及立委參選人須繳交20萬元至1,500萬元的保證金，高額保證金恐成投入政治的重要門檻。有網友在公共政策網路參與平臺提案，應大幅降低選舉保證金，避免選舉淪為「有錢人」專利。但也有立委表示，適當的選舉保證金，能避免一般人將參選當作遊戲。關於前述選舉保證金調降與否的論辯，下列相關敘述哪個正確？
  options:
  - label: A
    content: 投入選舉是屬於《憲法》參政權的保障
  - label: B
    content: 以法律限制人民投入選舉，不須符合比例原則
  - label: C
    content: 設置保證金門檻是為了符合男女參政權平等的保障
  - label: D
    content: 《憲法》並沒有保障參與選舉的權利，僅保障投票權
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 2019年經濟部能源局針對「計算再生能源電能費率」議題舉辦聽證會，希望透過程序上的陳述與言詞辯論，能制定更符合經濟與公共利益的決策，請問上述行政程序，與下列哪個作為屬於同一個原則？
  options:
  - label: A
    content: 行政機關做出申誡處分之前，需讓當事人有陳述意見機會
  - label: B
    content: 教師甄試上若有熟識考生的教師評審，需自行提出迴避
  - label: C
    content: 校務會議若無學生代表，做出之決議基於組織不法而無效
  - label: D
    content: NCC定期上網公告媒體之審查報告，讓民眾充分檢視其作為
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 因涉嫌高雄直播主之亂遭到羈押的直播主連某，不服地方法院延長羈押裁定，提起抗告11月29日高雄高分院分案審理，合議庭於12月2日下午裁定抗告駁回。因為抗告人在羈押中，攸關人身自由保障，就應妥適迅速審理，合議庭在收案第4天作出裁定，並非未審先判，更不能將妥速審判任意指為輕率裁判。請問有關此羈押案的說明，下列敘述哪個正確？
  options:
  - label: A
    content: 地方法院聲請延長羈押，代表被告有罪的確定判決
  - label: B
    content: 高等法院駁回抗告是為民主程序
  - label: C
    content: 羈押程序是被告經檢察官訊問，依自由心證做出裁定
  - label: D
    content: 被告律師不服地院裁定向高院提出抗告是行使訴訟權
