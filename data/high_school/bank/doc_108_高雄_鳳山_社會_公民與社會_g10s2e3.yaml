  - label: D
    content: 雙方當事人願意和解接受習慣法
  group_stem: 早期農業社會對女性要求嚴格、男性則較為寬鬆，如果已婚男性與未婚女人打情罵俏，會被視為風流、多情；反之若是已婚女性主動與男人眉來眼去，則被視為不守婦道。而為懲罰「紅杏出牆」的女性與引誘他人配偶的男性，「洗門風」的習俗於焉誕生。也就是對於滲入其事的男女雙方，有的要求準備金紙、炮燭到受欺辱的人的家中拜祖先；有的要當事人端一盤檳榔，在路口請人享用；有的甚至要求請歌仔戲班到廟口表演，表示公開道歉。
