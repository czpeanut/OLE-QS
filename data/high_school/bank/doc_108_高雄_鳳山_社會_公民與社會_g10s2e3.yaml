- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2019年大法官做出第784號解釋，指出應保障各級學校學生的訴訟權，若學生權利遭受侵害，不限退學等處分，只要程度夠嚴重就能提起行政訴訟，若實「有權利就有救濟」的精神。請問關於上述行政救濟的敘述，下列敘述何者正確？
  options:
  - label: A
    content: 若學生在學校受到不當處分，便可立即提出行政訴訟
  - label: B
    content: 若校內申訴不成，需向原處分或上級機關提出行政訴訟
  - label: C
    content: 採三級二審前，上述案件以地方法院行政庭為第一審
  - label: D
    content: 訴訟前多有訴願程序，主要是讓行政機關能針對處分進行內部審查
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「下一代幸福聯盟」公民行動總召日前在臉書貼文，聲稱公投位階高於《憲法》，應依據婚姻平權公投案的決議，不可制定專法保障同性伴侶之婚姻，但遭受許多法律學者駁斥認為這是法律的基本原則，《公民投票法》在位階上屬法律，低於憲法（釋字第48號），請問這些法律學者的觀點是類似於何項法律原則？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 法律優越原則
  - label: C
    content: 信賴保護原則
  - label: D
    content: 不當聯結禁止原則
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 黃姓男子擔任詐欺集團之「車手頭」，帶領手下收款，觸犯刑度一年至七年徒刑的「行使偽造公文書罪」，臺中地院雖認定黃男犯罪危害非輕，卻逕自減刑輕判他九月徒刑。臺中地檢署強調「黃男沒有減刑理由，竟判得比共犯還輕」而提起上訴；臺中高分院認為一審量刑不當，撤銷原判決後，加重改判黃男徒刑一年四月。請問有關此判決相關說明，下列敘述何者正確？
  options:
  - label: A
    content: 地院法官逕自減刑較最低刑度還低，可能違反罪刑法定原則
  - label: B
    content: 地院法官依其自由心證，決定減刑輕判，符合刑法謙抑的思想
  - label: C
    content: 地檢署上訴台中高等分院，由多名法官合議審理確保審判公正
  - label: D
    content: 我國刑法採絕對不定期刑，容許法官因個案差異自訂上下限
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 基隆有多項毒品、槍砲前科的詹姓男子，去年11月凌晨在工寮被警方查獲1支改造手槍10顆子彈，當場將男子起訴送辦。詹男否認持有，還咬定警方無票搜索。法院認為警方違法搜索，查緝過程中，員警並未詢問詹男是否同意搜索，事後才補行被告簽名、捺印，取得被告同意，認定扣案槍彈不具證據能力，判詹男無罪。請問有關此案件的說明，下列敘述何者正確？
  options:
  - label: A
    content: 警方在搜索前應先向檢察官聲請搜索票，才符合正當法律程序
  - label: B
    content: 若非法取得的證據，在審判時必須採取證據排除法則
  - label: C
    content: 警方雖然未取得搜索票，但確實查獲手槍和子彈可做為有力證據
  - label: D
    content: 犯罪偵查的過程應符合正當法律程序，才能保障被害人的人權
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 2010年臺中市發生槍擊命案，開槍者是未成年的廖姓少年，廖男遭重判30年，寫下少年犯罪判刑最重紀錄。黑幫常利用少年犯可減刑的法律誘因，養成「少年槍手」，可見少年遭黑幫利用的問題，十年來未見改變。有關少年犯罪的說明，下列敘述何者正確？
  options:
  - label: A
    content: 廖姓少年犯殺人案時應是由少年調查官向少年法院起訴
  - label: B
    content: 少年法院認為少年犯行重大，可依法判處死刑或無期徒刑
  - label: C
    content: 為避免少年遭到標籤化，並且給予其改過自新的機會，少年法院會通知相關機關塗銷少年前科資料
  - label: D
    content: 少年法庭在審理少年刑事案件時須符合公開審理的程序
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《舌尖上的東協》書評：「這本書的出現，恰巧彌補了臺灣對東南亞食材、民族植物科學知識的空缺。作者胖胖樹以文圖並茂的街巷食材圖鑑，詳細記錄風行臺灣的東南亞菜餚與民族植物，喚醒讀者對於南洋美食的熱情。不知讀者是否發現，過去十幾年內鄉間的家常麵店，悄然隨著社會結構而轉變？曾經偏鄉乃至淺山鄉間，某些提供果腹的家常乾麵、意麵、大滷麵、粄條店，曾幾何時已逐漸被越南河粉跟印泰小店取代？希望讀者能更加包容、同理，甚至融合創造出臺灣多元文化上的新境地。」請問根據此段文意，何者敘述正確？
  options:
  - label: A
    content: 《舌尖上的東協》主要是提醒大家不要忘了臺灣的本土美食
  - label: B
    content: 許多小吃店被越南河粉取代，表示各種文化間是無法並存的
  - label: C
    content: 對於南洋食物的包容、同理，屬於我國《憲法》列舉式權利保障
  - label: D
    content: 對於飲食文化之差異，應該予以平等對待，屬於多元文化權範疇
- id: doc_108_高雄_鳳山_社會_公民與社會_g10s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 附圖為2014年內政部警政署依照集會遊行之活動性質區分的比例圖，顯示我國集會遊行以政治性質為最高。2018年曾有某位高雄市長候選人於接受媒體訪問時表示，近2、30年來高雄被意識型態纏得喘不過氣，為了讓高雄能全力拚經濟，因此如果當選高雄市長，將禁止一切政治性及意識型態的集會遊行。對該候選人之言論，有律師於媒體專欄指出，「禁止上街論」嚴重踐踏言論自由憲法價值，大開民主倒車，違反大法官釋字第718號解釋理由書所揭示：「《憲法》第14條規定人民有集會之自由，旨在保障人民以集體行動方式和平表達意見，與社會各界進行溝通對話，以形成或改變公共意見，並影響、監督政策或法律之制定，係本於主權在民理念，為實施民主政治以促進思辯、尊重差異，實現憲法兼容並蓄精神之重要基本人權」之意涵。請問就人民權益保障而言針對上述言論，以下何人發言較為正確？
  options:
  - label: A
    content: 臣修：意識型態耗損社會成本，限制政治性集會合乎公益
  - label: B
    content: 相尹：若對集會遊行進行實質審查，將使政府有濫權之可能
  - label: C
    content: 伯軒：市長規範集會許可乃依法行政，屬地方自治的範疇
  - label: D
    content: 奇華：集會自由是民主之基礎，不應該以任何理由限制之
