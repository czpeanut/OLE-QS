  - label: C
    content: 我國限制工會組成人數具有正當理由，限制的標準也有必要性
  - label: D
    content: 要求組成工會應公開徵求會員，是限制結社自由的例子
  group_stem: 加拿大的安大略省制定了「124號法案」，限制未來3年所有公共部門雇員的年薪增幅不得超過1％，引起了其工會不滿。他們認為這條法案對自由的集體談判持粗魯態度，且不尊重每個有經驗的談判者，因為工會最有能力反映財政和工作場所優先事項和事實，並進行談判謀求達成協議。因此數個工會聯合發起訴訟，認為該法案侵害了他們在《憲法》上的權利，應該被廢除。
