- id: doc_109_台南_台南二中_數學_數A_g11s2e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 給定直線 $L_{1}$：$x-1=\frac{y-3}{7}=\frac{z+2}{-3}$，直線 $L_{2}$：$\begin{cases}3x+y+z=4 \\ x-y+z=2\end{cases}$，平面 E：x－y－2z＝2，請選出正確的選項：
  options:
  - label: A
    content: 直線 $L_{1}$ 與直線 $L_{2}$ 的方向向量互相垂直
  - label: B
    content: 直線 $L_{1}$ 和平面 E 平行，沒有交點
  - label: C
    content: 直線 $L_{2}$ 和平面 E 垂直
  - label: D
    content: 有一個平面同時包含直線 $L_{1}$ 與直線 $L_{2}$
  - label: E
    content: 設直線 L 與直線 $L_{1}$、$L_{2}$ 均垂直，則向量$\vec{\alpha}$＝（17，1，8）可以是 L 的一個方向向量
  group_stem: 【說明】每題至少有一個選項是正確的，每題答對得 5 分，答錯不倒扣，未作答者不給分。只錯 1 個選項者得 3 分，錯兩個選項者得 1 分，錯 3 個或 3 個以上者不給分。
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$L_{1}$：$\frac{x-1}{1}=\frac{y-3}{7}=\frac{z+2}{-3}$ ∴$\vec{L_{1}}$＝（1，7，－3）

    $L_{2}$：$\begin{cases}E_{1} : 3x+y+z=4 \\ E_{2} : x-y+z=2\end{cases}$ ∴$\vec{n_{1}}$＝（3，1，1），$\vec{n_{2}}$＝（1，－1，1）

    $\vec{n_{1}}\times \vec{n_{2}}$＝（3，1，1）×（1，－1，1）

    ＝$\left( \left| \begin{matrix}1 & 1 \\ -1 & 1\end{matrix} \right| , \left| \begin{matrix}1 & 3 \\ 1 & 1\end{matrix} \right| , \left| \begin{matrix}3 & 1 \\ 1 & -1\end{matrix} \right| \right)$

    ＝（2，－2，－4）＝2（1，－1，－2）

    ∴取$\vec{L_{2}}$＝（1，－1，－2）

    ∵$\vec{L_{1}} \cdot \vec{L_{2}}$＝（1，7，－3）．（1，－1，－2）＝1－7＋6＝0 ∴$\vec{L_{1}}$⊥$\vec{L_{2}}$

    (B) ╳：令 $L_{1}$：$\frac{x-1}{1}=\frac{y-3}{7}=\frac{z+2}{-3}=t$

    ∴$\begin{cases}x=t+1 \\ y=7t+3 \\ z=-3t-2\end{cases}$，t ∈ R

    代入 E：x－y－2z＝2

    ∴（t＋1）－（7t＋3）－2（－3t－2）＝2

    ∴t－7t＋6t＋1－3＋4＝2

    ∴0．t＝0，即 t ∈ R，有無限多組解 ∴$L_{1}$ 落在平面 E 上

    (C) ○：∵$\vec{L_{2}}$＝（1，－1，－2）

    E：x－y－2z＝2 ∴$\vec{n_{E}}$＝（1，－1，－2）//$\vec{L_{2}}$

    ∴$L_{2}$⊥E

    (D) ╳：$L_{1}$：$\begin{cases}x=t+1 \\ y=7t+3 \\ z=-3t-2\end{cases}$，t ∈ R

    $L_{2}$：$\begin{cases}3x+y+z=4 \\ x-y+z=2\end{cases}$

    令 x＝s ∴$\begin{cases}y+z=-3s+4 \cdots \cdots \cdots \cdots \cdots ① \\ -y+z=-s+2 \cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由①－②得 2y＝－2s＋2 ∴y＝－s＋1

    由①＋②得 2z＝－4s＋6 ∴z＝－2s＋3

    ∴$L_{2}$：$\begin{cases}x=s \\ y=-s+1 \\ z=-2s+3\end{cases}$，s ∈ R

    試著解 $L_{1}$，$L_{2}$ 之交點 ∴$\begin{cases}x=t+1=s \\ y=7t+3=-s+1\end{cases}$

    ∴$\begin{cases}t-s=-1 \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots ③ \\ 7t+s=-2 \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots \cdots ④\end{cases}$

    由③＋④得 8t＝－3 ∴$t=-\frac{3}{8}$代入③

    ∴$-\frac{3}{8}-s=-1$ ∴$s=\frac{5}{8}$分別代入 $L_{1}$，$L_{2}$

    得$\begin{cases}z=-3t-2=-3\times \left( -\frac{3}{8} \right) -2=-\frac{7}{8} \\ z=-2s+3=-2\times \frac{5}{8}+3=\frac{14}{8}\end{cases}$

    ∴$L_{1}$，$L_{2}$ 不相交，因此，不可能有一個平面同時包含 $L_{1}$ 與 $L_{2}$

    (E) ○：$\vec{L_{1}}$＝（1，7，－3），$\vec{L_{2}}$＝（1，－1，－2）

    $\vec{L_{1}}\times \vec{L_{2}}$＝（1，7，－3）×（1，－1，－2）

    ＝$\left( \left| \begin{matrix}7 & -3 \\ -1 & -2\end{matrix} \right| , \left| \begin{matrix}-3 & 1 \\ -2 & 1\end{matrix} \right| , \left| \begin{matrix}1 & 7 \\ 1 & -1\end{matrix} \right| \right)$

    ＝（－17，－1，－8）＝－（17，1，8）

    ∵L⊥$L_{1}$，L⊥$L_{2}$

    ∴L 的一個方向向量可為$\vec{\alpha}$＝（17，1，8）

    故選(A)(C)(E)'
