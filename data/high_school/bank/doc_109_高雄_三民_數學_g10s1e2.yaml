- id: doc_109_高雄_三民_數學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列敘述何者正確？$■答$：＿＿＿＿。
  options:
  - label: A
    content: $\sqrt{5}x -6$為一個 x 的多項式
  - label: B
    content: 多項式 f（x）＝$x^{2021}$＋4 除以 x＋1 的餘式為 3
  - label: C
    content: 若多項式 f（x）＝$ax^{4}$＋$bx^{3}$＋$cx^{2}$＋dx＋e，則 deg（f（x））＝4
  - label: D
    content: 若多項式 f（x）除以$x -\frac{1}{2}$的商式為 2Q（x），則 f（x）除以 2x－1 的商式為 Q（x）
  - label: E
    content: 設多項式 f（x）＝$x^{3}$－4x＋2 與 g（x）＝（x－1）（x－2）（x＋1）＋a（x－1）（x－2）＋b（x－2）＋c 相等， 則 a＋b＋c＝－1
  explanation: '(A)○：

    (B)○：f（x）＝$x^{2021}$＋4 除以 x＋1 的餘式為 f（－1）＝3

    (C)╳：deg f（x）$\leq$4 或 f（x）＝0 沒有次數

    (D)○：f（x）＝$\left( x -\frac{1}{2} \right)$（2Q（x））＋r＝（2x－1）Q（x）＋r

    $\Rightarrow$f（x）除以 2x－1 的商式為 Q（x）

    (E)╳：$x^{3}$－4x＋2＝（x－1）（x－2）（x＋1）＋a（x－1）（x－2）＋b（x－2）＋c

    $\Rightarrow$x＝2 代入 2＝c

    x＝1 代入－1＝－b＋2$\Rightarrow$b＝3

    x＝0 代入 2＝2＋2a－6＋2$\Rightarrow$a＝2

    $\Rightarrow$a＋b＋c＝2＋3＋2＝7

    故選(A)(B)(D)'
- id: doc_109_高雄_三民_數學_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列何者是多項式 f（x）＝$2x^{4}$＋$5x^{3}$＋$3x^{2}$＋x－2 的因式？$■答$：＿＿＿＿。
  options:
  - label: A
    content: x＋1
  - label: B
    content: x－3
  - label: C
    content: 2x＋1
  - label: D
    content: x＋2
  - label: E
    content: 2x－1
  explanation: '(A)╳：f（－1）＝－3≠0$\Rightarrow$（x＋1）不是其因式

    (B)╳：f(3)＝325≠0$\Rightarrow$（x－3）不是其因式

    (C)╳：$f \left( -\frac{1}{2} \right) =-\frac{9}{4}\neq 0\Rightarrow$（2x＋1）不是其因式

    (D)○：f（－2）＝0$\Rightarrow$（x＋2）是其因式

    (E)○：$f \left( \frac{1}{2} \right) = 0\Rightarrow$（2x－1）是其因式

    故選(D)(E)'
- id: doc_109_高雄_三民_數學_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知多項式 f（x）除以 $x^{2}$－x－2 之餘式為 18x＋9。試選出正確的選項。$■答$：＿＿＿＿。
  options:
  - label: A
    content: f(2)＝45
  - label: B
    content: f(1)＝27
  - label: C
    content: f（x）可能為一次式
  - label: D
    content: f（x）可能為 $4x^{4}$＋$2x^{3}$－8x－3
  - label: E
    content: f（x）可能為 $4x^{4}$＋$2x^{3}$－$8x^{2}$－3
  explanation: '設商式為 Q（x）

    $\Rightarrow$f（x）＝（$x^{2}$－x－2）Q（x）＋（18x＋9）

    ＝（x－2）（x＋1）Q（x）＋（18x＋9）

    (A)○：f(2)＝0＋18×2＋9＝45

    (B)╳：f(1)＝－2×Q(1)＋27 不一定等於 27

    (C)○：當 Q（x）＝0 時，f（x）＝18x＋9 為一次式

    (D)╳：令 g（x）＝$4x^{4}$＋$2x^{3}$－8x－3

    $\Rightarrow$g(2)＝61≠f(2)

    $\Rightarrow$f（x）不可能為 g（x）

    (E)○：根據除法原理，得 $4x^{4}$＋$2x^{3}$－$8x^{2}$－3＝（$x^{2}$－x－2）（$4x^{2}$＋6x＋6）＋18x＋9

    故 f（x）可能為 $4x^{4}$＋$2x^{3}$－$8x^{2}$－3

    故選(A)(C)(E)'
- id: doc_109_高雄_三民_數學_g10s1e2_s1_4
  section: 1
  number: 4
  type: fill
  page: 1
  stem: 設三次多項式 f（x）滿足 f(1)＝f(2)＝0，且 f(0)＝2，f（－1）＝－6，則 f（x）＝＿＿＿＿。（可不用乘開）
  explanation: '設三次多項式 f（x）＝（x－1）（x－2）（ax＋b）

    又$\begin{cases}f (0)=2 \\ f (-1)=-6\end{cases}\Rightarrow\begin{cases}b =1 \\ -a +b =-1\end{cases}$

    $\Rightarrow$a＝2，b＝1

    $\Rightarrow$f（x）＝（x－1）（x－2）（2x＋1）'
- id: doc_109_高雄_三民_數學_g10s1e2_s1_5
  section: 1
  number: 5
  type: fill
  page: 1
  stem: 設多項式 f（x）除以 $x^{2}$＋x－2 的餘式為 3x＋1，除以 $x^{2}$＋x－6 的餘式為 x－1，則 f（x）除以 $x^{2}$＋2x－3 的餘式為＿＿＿＿。
  explanation: '設 f（x）＝（$x^{2}$＋x－2）$Q_{1}$（x）＋（3x＋1）＝（x＋2）（x－1）$Q_{1}$（x）＋（3x＋1）

    ＝（$x^{2}$＋x－6）$Q_{2}$（x）＋（x－1）＝（x＋3）（x－2）$Q_{2}$（x）＋（x－1）

    ＝（$x^{2}$＋2x－3）Q（x）＋（ax＋b）＝（x＋3）（x－1）Q（x）＋（ax＋b）

    x＝1$\Rightarrow$f(1)＝4＝a＋b

    x＝－3$\Rightarrow$f（－3）＝－4＝－3a＋b

    $\Rightarrow$a＝2，b＝2

    $\Rightarrow$所求餘式為 2x＋2'
- id: doc_109_高雄_三民_數學_g10s1e2_s1_6
  section: 1
  number: 6
  type: fill
  page: 1
  stem: 若多項式（x＋2）f（x）除以 $x^{2}$＋x＋1 的餘式為 7x＋5，則 f（x）除以 $x^{2}$＋x＋1 的餘式為 ＿＿＿＿。
  explanation: '設 f（x）＝（$x^{2}$＋x＋1）Q（x）＋（ax＋b）

    $\Rightarrow$（x＋2）f（x）＝（$x^{2}$＋x＋1）（x＋2）Q（x）＋（x＋2）（ax＋b）

    ＝（$x^{2}$＋x＋1）（x＋2）Q（x）＋a（$x^{2}$＋x＋1）＋（7x＋5）

    $\Rightarrow$（x＋2）（ax＋b）＝a（$x^{2}$＋x＋1）＋（7x＋5）

    $\Rightarrowax^{2}$＋（2a＋b）x＋2b＝$ax^{2}$＋（a＋7）x＋（a＋5）

    $\Rightarrow\begin{cases}2a +b =a +7 \\ 2b =a +5\end{cases}\Rightarrow\begin{cases}a +b =7 \\ a -2b =-5\end{cases}\Rightarrow\begin{cases}a =3 \\ b =4\end{cases}$

    所求餘式為 3x＋4'
