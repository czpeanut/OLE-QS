  stem: 請問，柏林圍牆之興建，與下列何者事件或情況有關？
  options:
  - label: A
    content: 古巴飛彈危機後
  - label: B
    content: 大量東德人民試圖藉由西柏林前往西德
  - label: C
    content: 美軍全數退出越南戰爭後
  - label: D
    content: 蘇聯政權瓦解後
  group_stem: ◎1991年年底，德國開始審判兩位執法人員，指控他們於1984年守衛柏林圍牆期間，開槍擊斃試圖翻越圍牆的民眾。法庭在這次的審判過程中，援引法律賦予衛兵使用强力的方式阻止逃亡者，但也提及東德法律也有規定「必須盡可能不危害生命」。因此，法庭認為，射擊逃亡者的腿部，應該比較符合兩德法律都同樣規定的「適當的措施」。因此，即使根據東德法律，衛兵射殺逃亡者的行為仍然犯了「過度使用權威」的罪行。
    法官指出，「上級的命令」不能當作赦免、或合理化犯罪行為的藉口。可是，兩位衛兵在當時的情境下，難以獨立自主行動。「引導他們犯罪行為的因素並非自私自利、或罪惡的動機，而是當時他們所無法影響的環境，包括分裂德國在政治和軍事上的對抗，以及東德特殊的政治情境。」
