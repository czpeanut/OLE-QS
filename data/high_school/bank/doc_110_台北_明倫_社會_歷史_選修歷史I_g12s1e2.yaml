  stem: 1895年臺灣人面對日本帝國的侵略，基於保家衛國的需求而與之對抗，逐漸形成臺灣人民的一體感，而在日本統治下，受到日本統治臺灣的差別性待遇、臺籍菁英的權利争取等，更加強化所謂的臺灣意識。但有一個不可忽視的事實，在當時臺灣人的心靈中，很多人存在著一個想像中的祖國，一種想像的漢族血缘關係，因而在日本投降結束第二次世界大戰時，許多臺灣政治菁英和民眾基本上都在期待「祖國」的接收。請問：上述題幹主旨說明了下列何者？
