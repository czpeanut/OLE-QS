  stem: 施正鋒教授曾針對轉型正義的研究議題提出三個面向的分析，如附圖所示。李登輝前總統曾以國家元首的身分向受害者及其家屬致歉，並在行政院成立「研究二二八事件小組」研究事件真相，該小組將調查結果整理出版了二二八事件研究報告，對於二二八事件有詳盡而不偏頗的敘述。政府方面則於2018年通過二二八事件處理及賠償條例，專用於「處理賠償事宜，落實歷史教育，釐清相關責任歸屬，使國民了解事件真相，撫平歷史傷痛，促進族群融合。」請問關於二二八事件的處理方式較符合附圖中哪一種轉型正義的面向？
  options:
  - label: A
    content: 修復式正義
  - label: B
    content: 分配式正義
  - label: C
    content: 處罰式正義
  - label: D
    content: 以上皆非
