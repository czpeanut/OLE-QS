  stem: 2015年是第二次世界大戰結束的七十周年，中、日、韓各國都有不同的紀念活動，而臺灣則出現兩場具不同代表性的紀念活動，其一是由國民黨執政政府所舉辦的「抗日戰爭勝利七十周年」紀念活動；另一場則由民間團體發起，以1945年5月31日臺北受美軍空襲的「臺北大空襲七十周年」紀念活動。學者認為這兩種紀念活動背後反映了不同的二戰經驗，也凸顯出臺灣不同戰爭記憶共存相互競争與對抗的狀況。請問造成這種分歧的主要原因是下列何者？
