  - label: D
    content: 皆反映了對納粹政權犯下戰爭罪刑的檢討與反省
  group_stem: '◎費里茲．鮑爾是德國一位知名的檢察官，面臨二戰中德國的失敗時他曾說：「我不要求世人可憐德國，因為我知道，德國人未來數十年必須努力彌補錯誤，才有可能獲得尊重與同情。」戰後德國立即展開「紐倫堡審判」，對納粹德國在政治、軍事、司法和經濟領導人員起訴和判刑就是彌補錯誤的一部分。然而，更多西德人民關注的焦點是放在經濟重建、原諒與共生，因為在納粹掌權期間，太多人曾與納粹合作或本身就是黨員，對他們而言，遺忘歷史才讓他們免於面對譴責，不用回首那段不堪的過往。

    1962年一份詳載奥斯威辛集中營囚犯和射殺囚犯黨衛軍名單的官方文件交到了費里茲．鮑爾的手中，他利用這份資料開啟了長達兩年的「奥斯威辛審判」。在審判中，費里茲．鮑爾一口氣起訴了22名集中營的看守人員，和「紐倫堡審判」的起訴對象不同，「奥斯威辛審判」起訴的都是集中營裡的小人物，而非決策者，但這場審判確立了一個重要的精神，即是──「凡是知曉、參與過這場謀殺機器的人，就是參與謀殺的共犯」。「奥斯威辛審判」受到媒體注目而廣泛報導的結果，讓戰後出生的年輕一代重新了解納粹暴行，要求追查戰犯的責任，這股力量也開枝散葉，促使德國政府展開更多道歉、賠償、教育等程序，綿延至今。'
