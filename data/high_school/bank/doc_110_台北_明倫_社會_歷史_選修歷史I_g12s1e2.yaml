  stem: 資料一：南韓全斗煥夥同盧泰愚，派兵包圍了陸軍總司令，取得最高軍權。隔年四月，全斗煥自任中央情報部長，掌握實際權力，大學生對此反感不滿，紛紛抗議示威，並對政府提出「解除非常戒嚴」、「保障言論自由」、「全斗煥下臺」等訴求。全斗煥眼見事態嚴重，政府決議全國擴大實施非常戒嚴令，並禁止所有政治活動、嚴禁誹謗前現任總統，以及強制所有大學停課等。
    資料二：面對光州大學生的示威，全斗煥選擇派遣空降特戰部隊進行鎮壓，毆打多名學生，更有人親眼看到親人遭到軍隊開槍射殺身亡，憤怒的光州市民再也按捺不住心中悲憤，開始襲擊警察署與後備部隊的槍械庫，甚至還一度把戒嚴軍趕出了光州市區。
    資料三：美國國務院發表了「不能坐視韓國的無秩序和混亂」的聲明，這被當時韓國官方視為美國正式容許韓國當局以軍隊鎮壓光州的信號。因此在當天凌晨，數千名的軍人開著坦克車進軍光州，隨即包圍了全羅南道廳，並展開強勢攻擊。
    上述三則資料闡述的南韓在1980年代所發生的「光州事件」，請問，有關上述資料在閱讀後的相關敘述，下列論述何者正確？
