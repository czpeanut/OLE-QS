  group_stem: ◎1946年馬丁．尼莫拉於二戰後以德文寫了的一首名為<u>起初他們</u>的懺悔詩，寓意當時許多德國人屈服於納粹勢力，漠視納粹肅清一批又一批的無辜受難者，詩文內容如下：
    「起初，納粹抓共產黨人的時候，我沉默了，因為我不是共產黨人。 當他們抓社會民主主義者的時候，我沉默了，因為我不是社會民主主義者。 當他們抓工會成員的時候，我沉默了，因為我不是工會成員。
    當他們抓猶太人的時候，我沉默了，因為我不是猶太人。 最後當他們來抓我時，再也沒有人站起來為我說話了。」 1937年時馬丁．尼莫拉被捕入獄，直到戰爭末期才被釋放。請問：
