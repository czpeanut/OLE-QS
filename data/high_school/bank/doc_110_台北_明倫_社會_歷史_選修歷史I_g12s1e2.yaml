  stem: 近日來新聞報導指出，荷蘭國會在2021年2月25日通過一項不具約束力的動議，認定中國共產黨對待新疆維吾爾族的穆斯林的方式，就是違反聯合國協議中的種族滅絕罪。請問：若根據此報導，下列何者符合中國政府對維吾爾人的方式？
  options:
  - label: A
    content: 女性被強制裝上節育器、被迫服用避孕藥或注射某種疫苗
  - label: B
    content: 每天需要高唱中國愛國歌曲，並收看國家主席的採訪節目
  - label: C
    content: 要求人們閱讀並背誦國家主席語錄集，不及格者將受罰
  - label: D
    content: 要求學習中國法律和漢語，強制改變他們的傳統生活方式
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 捷克於1991年通過<u>除垢法</u>（Lustration Law），規定曾在威權政府中任職於情治系統、特務機構的情治人員、線民，或前共產黨某層级以上之黨工，五年內不得於政府、學術部門、公營企業中擔任某個層級以上之職位。此法頒布後，引發許多學者民眾批評是「以道德十字軍來包裝政治權力鬥争。」請問，此批評最可能闡述下列哪一項觀點？
  options:
  - label: A
    content: 政府藉著宗教十字軍之力量打壓百姓
  - label: B
    content: 民眾可能喪失對新民主政府之信任
  - label: C
    content: 政府體制內政治權力的鬥争不復存在
  - label: D
    content: 曾任黨工者勢必無法勝任民主政府之職缺
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 知名的漫威英雄「美國隊長」創設於1941年、在當時的社會氛圍下大受歡迎。他原是一位滿腔熱忱、一心為國家效力的青年，希望藉由從軍幫助國家。在接受政府的改造計畫之後，他身穿紅、白、藍三色星條服裝，以高大挺拔、英勇正直的形象出現，代表美國與邪惡勢力戰鬥，儼然成為美國精神的象徵，也成為陪伴許多美國人長大的英雄角色。有關「美國隊長」的創立歷史，下列分析何者正確？
  options:
  - label: A
    content: 為美國戰爭宣傳的一環，藉此獲得英國的同情與支援
  - label: B
    content: 顯示戰爭時期美國政府對文化產業的控制力大幅增強
  - label: C
    content: 藉此角色側面描寫戰火的殘酷，喚起人民的反戰心理
  - label: D
    content: 呈現二戰時期英美國家捍衛民主、對抗納粹的價值觀
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 立法院於2016年陸續通過了不當黨產處理條例以及促進轉型正義條例，行政院並分別於2016年8月、2018年5月，成立了「不當黨產處理委員會」和「促進轉型正義委員會」。請問，關於上述兩個委員會的相關職責，下列何者論述正確？
  options:
  - label: A
    content: 前者負責威權時期「不當取得財產之調查、返還、追徵、權利回復」
  - label: B
    content: 後者負責「不當取得財產之調查、返還」並運用於檔案公告之經費
  - label: C
    content: 前者負責「嚴懲威權體制下不當侵占行為之執行者」
  - label: D
    content: 後者負責「改革司法、還原歷史真相並加速族群融合」
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 「為達成成功的協商與轉型，轉型的條件不僅需要過去的受害者的同意，也需要那些會被一個『基於自由與平等的民主社會』給威脅到的人的首肯。如果新憲法沒有杜絕復仇與報復持續發生的可能，那麼，可能會受到新憲法秩序威脅的人就不可能支持新憲法……正是基於這樣的考量，參與憲法協商的人幾經思考之後做了一個重大的決定，我們需要了解而非復仇，需要修復而非報復，需要共生而非尋找代罪羔羊。」題幹為南非憲法法官的判決紀錄，請問，此段言論能使我們如何看待轉型正義在南非的實踐與發展？
  options:
  - label: A
    content: 主張非報復形式的法律制定換得自由與平等的社會
  - label: B
    content: 法律的制定需要被害與加害者雙方首肯
  - label: C
    content: 憲法協商會議在尋求解決被害者心頭永遠的仇恨
  - label: D
    content: 杜絕報復發生的最佳解方是持續修改憲法
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 2021年2月，緬甸國家領袖翁山蘇姬突遭軍方逮捕，幾天後部分網路社交平臺在緬甸的服務器運作受到限制，軍方對外宣稱是為了確保穩定而限制部分媒體的使用。此事件很快受到國際媒體的關注，輿論紛紛認為此次政變將使緬甸民主改革中斷。一位居民回憶起軍政府統治時期：「那是個對內面臨獨裁、對外受到國際經濟制裁，人們普遍貧困的年代，如今的場景讓人感覺似曾相似，很多人都還記得在監控下的沉默生活。」有關題幹中緬甸民主改革期間的政治局勢變化，下列分析何者正確？
  options:
  - label: A
    content: 民主化已是國際承認的政治主導原則
  - label: B
    content: 軍政府時期才能保障和平與自由
  - label: C
    content: 政治環境的動盪使民主自由不易發展
  - label: D
    content: 經濟較落後的地區容易發生軍事政變
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 一戰初期，各國人民強烈擁護政府的參戰立場，此時意識型態的宣傳並不激烈。然而經過一、二年後，未能有任一陣營獲得關鍵性的勝利，戰事陷入僵局，進入無止盡的壕溝戰和綿長的戰線，使人們感到挫折，開始對為何而戰產生疑問，此時政府便決定重視宣傳戰。根據上文所述，宣傳戰在一戰中後期受到重視的原因為何？
  options:
  - label: A
    content: 希望藉此取得關鍵戰役的勝利
  - label: B
    content: 為了塑造戰爭的必要性和合理性
  - label: C
    content: 為了盡快結束戰爭、降低傷亡
  - label: D
    content: 能幫助政府維持戰時社會秩序
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 「新政權接手後，安撫保守勢力成為棘手的課題，讓保守勢力不會以武力等方式影響選舉承諾所以接受了保守勢力的訴求，而新興的民主派、自由派也有默契地未對保守勢力的訴求提出抗議，使雙方在協商、妥協中，達成『選擇性的遺忘』的共識。」請問此段敘述應是指下列何者的歷史背景？
  options:
  - label: A
    content: 法國頒布人權與公民宣言
  - label: B
    content: 希特勒執政時國會通過授權法
  - label: C
    content: 西班牙政府頒布大赦法
  - label: D
    content: 臺灣立法院通過促進轉型正義條例
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 二戰期間，捷克受納粹德國所控制，捷克的掌權者透過媒體強化歷史上英國與法國人對捷克人的出賣，以將自己與納粹德國的合作予以正當化。戰爭結束後，捷克斯洛伐克的共產政黨也一再強調由於西方國家在歷史上曾經有過出賣捷克的紀錄，因此主張戰後捷克斯洛伐克應該要在政策上靠向蘇聯而非歐美，隨著捷克斯洛伐克的共產黨取得了該國的統治權，這個說法也成為了捷克斯洛伐克唯一認可的歷史觀點，這樣的史觀直到1989年東歐共産政權面臨垮臺危機後，才再度被拿出來進行討論。上文主旨在說明歷史記憶的何特性？
  options:
  - label: A
    content: 因角色不同而有所影響，如士兵和平民的記憶不同
  - label: B
    content: 因政治因素而有所影響，如政權轉換可能改變對歷史記憶的說法
  - label: C
    content: 因階級不同而有所影響，如將領和士兵的記憶不同
  - label: D
    content: 因國別而有所影響，捷克的歷史記憶和蘇聯的歷史記憶不同
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 一位美術館解說員說道：「『格爾尼卡』是畢卡索的作品之一，這幅使用黑、白、灰色調，描繪遭受西班牙內戰摧殘的城市，畫中死去的士兵、小孩、著火的房子等帶給人身歷其境的壓抑和恐懼感。」下列何者對於這幅畫作的理解較為恰當？
  options:
  - label: A
    content: 小民：可藉由這件藝術作品感受畫家對戰爭的省思
  - label: B
    content: 小高：戰爭的痛苦與創傷難以用抽象的方式來傳達
  - label: C
    content: 小陽：戰爭過於殘酷導致畫家藉由畫作來脫離現實
  - label: D
    content: 小山：畫家在戰時藉畫作來諷刺時局、針砭時政
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 1991年德國設立史塔西檔案局，專責管理、復原德政權留下的數千萬份監控檔案，並供當事人調閱涉及本人的檔案，檔案局局長對此表示：「打開傷口是復原的第一步。」請問從追求轉型正義的觀點來看，下列何者最能詮釋題幹中史塔西檔案局的作為？
  options:
  - label: A
    content: 公開真相是和過去和解的先決條件
  - label: B
    content: 使民眾理解東德設立史塔西的正當性
  - label: C
    content: 透過民間團體反思種族歧視的歷史
  - label: D
    content: 公開檢討東德施加國家暴力的加害者
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 美國參戰後，和德軍第一場的較量地點在法國的一處森林裡，這場戰役對美國而言，是自南北戰争結束後，首次投入的大規模戰役。戰役結束後，一名陣亡德軍士兵的日記被現，裡面寫到：「美國大兵殘酷狠毒，但凡能夠移動的東西都在他們的殺戮之列。」請問根據上述資料，關於這場戰役的理解下列何者正確？
  options:
  - label: A
    content: 這場戰役指的是第一次世界大戰，士兵的日記反映的是個別士兵對戰場的觀感
  - label: B
    content: 這場戰役指的是第一次世界大戰，士兵的日記說明了美軍在各參戰國家中犯下最殘酷的暴行
  - label: C
    content: 這場戰役指的是第二次世界大戰，士兵的日記反映的是個別士兵對戰場的觀感
  - label: D
    content: 這場戰役指的是第二次世界大戰，士兵的日記說明了美軍在各參戰國家中犯下最殘酷的暴行
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 1976年至1983年是阿根廷政府統治時期，當時政府以「國家安全」為由，嚴禁所有的政治活動，且軍隊沿街抓捕、打壓知識分子。1977年開始有一群女性在五月廣場集結，她們是「被失蹤者」的母親或祖母，尋找軍政府時期失蹤的兒女下落，至今許多人仍不明白這些失縱者何時、為何被消失。請問根據題幹，下列敘述何者正確？
  options:
  - label: A
    content: 這些失蹤兒女應是「史塔西」組織下的受害者
  - label: B
    content: 可知阿根廷軍政府行政治迫害、違反人權之事
  - label: C
    content: 政府頒布大赦法使得這些母親的訴求未得回應
  - label: D
    content: 顯示現代民主國家侵害人權的事件也時有所聞
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 2015年南非和英國的大學生相繼發起「羅德必須倒」運動，爭議人物羅德相信盎格魯．撒克遜人終成偉業，十九世紀隨英國人來到非洲開採鑽石，成為礦產大亨，並擔任開普殖民地的總理；他也設立「羅德獎學金」，資助各國的菁英生免費到牛津大學進修。許多支持者以撤除希特勒銅像的例子來聲援該運動，而反對者則認為歷史紀錄皆須被保留，有人則認為羅德僅是時代的產物。請問下列對題幹的理解何者正確？
  options:
  - label: A
    content: 人物銅像的拆除爭議與種族歧視問題是討論轉型正義的重要課題
  - label: B
    content: 「羅德必須倒」的支持者抨擊共產主義對人權的迫害
  - label: C
    content: 主張銅像保留者認為時代觀點雖有別，不過有一共同不變的價值
  - label: D
    content: 主張銅像保留者雖持有不同意見，總歸皆支持白人至上主義
- id: doc_110_台北_明倫_社會_歷史_選修歷史I_g12s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
