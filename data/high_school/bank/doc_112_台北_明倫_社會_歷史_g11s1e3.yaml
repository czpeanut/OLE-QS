  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)(E)為正解。(B)獨立後的非洲國家，大多按照原殖民母國的模式，採用內閣制或多黨制；但內閣制成效不彰，多黨制則往往造成政局混亂、動盪，軍事政變和內戰層出不窮，政權更迭頻繁。
