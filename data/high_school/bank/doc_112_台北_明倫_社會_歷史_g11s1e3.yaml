- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 據統計，二次世界大戰期間德國平民死亡約 117 萬人，占該國 1939 年總人口 1.6 ％；蘇聯平民死亡約 1400 萬人，占該國 1939 年總人口 7.3 ％。蘇聯平民死亡人數與比率均遠多於德國的原因為何？
  options:
  - label: A
    content: 納粹黨在東歐多處設立大型滅絕營，用毒氣殺害當地人
  - label: B
    content: 為對付全球反共產勢力，大量的蘇聯士兵駐防東歐國家
  - label: C
    content: 德、義、日軸心國武器優越，超過蘇聯、英、美同盟國
  - label: D
    content: 蘇聯是主要戰場，戰火摧殘人命外，還有缺糧饑荒問題
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)第二次世界大戰，蘇聯是主要戰場之一，尤其是 1941 年後的德蘇戰爭，造成大量人員傷亡，此是蘇聯平民死亡人數比德國多的原因。(A)(B)(C)與史實不符。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 聯合水果公司（United Fruit Company）成立於 1899 年，在拉美獨裁者的支持下，控制拉美香蕉產銷超過一世紀。其創建者米諾爾．基斯（Minor Keith，1848 ～ 1929）在瓜地馬拉作家的小說中化身為「綠色教宗」，米諾爾．基斯曾表示：「我們有碼頭、鐵路、土地、大樓、水源，（當地）流通的是美元，講的是英語，空中飄揚的是美國國旗。這一切的種種，都是為了香蕉！這就是美國在加勒比、巴拿馬運河、尼加拉瓜的歷史，更是（美國）海軍陸戰隊、裝甲艦和刺刀的歷史。」請問以上文字說明美國如何操控中南美洲？
  options:
  - label: A
    content: 與歐洲合作，共同控制中南美洲
  - label: B
    content: 利用經濟合作的方式，使中南美洲與美國合作
  - label: C
    content: 利用軍事占領中南美洲的土地，建立殖民地
  - label: D
    content: 利用軍事與經濟的雙重力量控制中南美洲
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 小說中，中南美洲當地充滿美國以強大的資本建設的交通、建築等，當地的歷史更是美國海軍陸戰隊、裝甲艦和刺刀的歷史，可知美國係(D)利用軍事與經濟的雙重力量控制中南美洲。(A)題文中並未提到與歐洲合作。(B)是利用軍事、經濟力量操控，而非經濟合作。(C)美國並未在當地建立殖民地，且未提及經濟部分。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在西方國家，「他」一般被看作是一位詩人，而很少被看作一位哲學家，但在其母國則兩者皆是，因他的詩中含有深刻的宗教和哲學的見解。對他本人來說，他的詩是他奉獻給神的禮物，而他本人是神的求婚者。他的詩在其母國享有史詩的地位。他本人被許多族人看作是一個聖人，他也是第一位獲得諾貝爾文學獎的非歐洲人。請問「他」是誰？
  options:
  - label: A
    content: 甘地
  - label: B
    content: 泰戈爾
  - label: C
    content: 李文斯頓
  - label: D
    content: 西蒙．波娃
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這位詩人是第一位獲得諾貝爾獎的非歐洲人，排除(C)與(D)，(A)是政治家，很少被視為詩人或是哲學家，因此答案為(B)泰戈爾。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 電影《亞果出任務》改編自 1979 年伊朗爆發革命的人質危機。當時巴勒維國王被伊朗人民推翻，而此時被流放在外 15 年的神職人員返回伊朗重新統治。巴勒維在下臺後赴美國治療，也接受美國的政治庇護。宗教學生得知巴勒維逃離的消息後極度不滿，鼓動部分伊朗民眾對美國大使館進行抗議示威，要求美國立刻將巴勒維引渡。請問上述指的宗教學生應是何種主義的支持者？
  options:
  - label: A
    content: 伊斯蘭傳統主義
  - label: B
    content: 世俗主義
  - label: C
    content: 伊斯蘭現任主義
  - label: D
    content: 西化主義
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 巴勒維國王因為親美、世俗化而被伊朗人民推翻，革命後的伊朗由流放在外 15 年的神職人員返回統治，宗教學生也要求美國必須將巴勒維引渡回到伊朗接受審判，可見得其支持(A)伊斯蘭傳統主義。(B)(C)(D)三者皆為巴勒維的作為，也是巴勒維政權被推翻的原因。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在電影《好萊塢的黑名單》中，道爾頓是好萊塢才氣縱橫、在電影圈能呼風喚雨的大編劇，後來遭人檢舉與誣陷是共產主義分子，被列為「黑名單」，當時有十位被捲入風波的劇作家與導演，因為態度強硬不願提供證詞給「非美活動調查委員會」，集體被好萊塢封殺。請問當時的背景為何？
  options:
  - label: A
    content: 一戰時，同盟國與協約國的互相對抗
  - label: B
    content: 戰間期，法西斯主義與共產主義的對抗
  - label: C
    content: 二戰時，盟軍對於軸心國的對抗
  - label: D
    content: 二戰後，冷戰下的意識型態之爭
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 電影描述的是美國 1950 年代初期的麥卡錫主義盛行時期，為防止共產主義的滲透，煽動全國性反共運動，許多人因此遭到政府的調查與迫害，答案為(D)。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 《戰血染征袍》是一部改編自真人真事的電影，片中描述 1879 年英國籍的查德中尉所屬的遠征軍遭到當地最為善戰的土著進攻。請問本片拍攝背景應是指哪一場戰役？
  options:
  - label: A
    content: 印度反英兵變
  - label: B
    content: 祖魯戰爭
  - label: C
    content: 七星期戰爭
  - label: D
    content: 英法蘇丹對峙
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B) 1879 年英國在南非與祖魯王國戰爭，為英國在南非殖民統治歷史的指標性事件。(A) 1857 年。(C) 1866 年普奧戰爭。(D) 1898 年法紹達衝突，兩國爭奪非洲殖民地。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 有一國家稱呼某一場戰爭為「祖國解放戰爭」：「卑鄙的敵國趁著戰爭結束瓜分我們的國土建立傀儡政權，所以在民族主義的領導與盟邦出兵協助下，我國幾乎收復全部國土，可惜因為卑鄙敵國再次引入外國勢力干涉而功敗垂成。」請問這國家以及其所稱呼的「祖國解放戰爭」，應為下列何者？
  options:
  - label: A
    content: 北越，越戰
  - label: B
    content: 北韓，韓戰
  - label: C
    content: 東德，柏林危機
  - label: D
    content: 中國，國共內戰
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文來看，這場「祖國解放戰爭」原可以統一，但受到外國勢力干涉而功敗垂成，導致祖國依然分裂的情勢，因此答案為(B)，由於韓戰受到各國勢力的介入，今日南北韓依然為分裂對峙局面。(A)越戰後，越南完成統一。(C)柏林危機並非發生戰爭。(D)國共內戰的雙方並非任何國家在中國所建立的傀儡政權，就中國立場而言，在臺灣的國民黨政權也非因為外國勢力介入才立足臺灣。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 雖然東南亞殖民地獨立的過程不盡相同，但是都有共同重要的先決條件，就是第二次世界大戰。除了泰國之外，戰爭前夕的東南亞幾乎都是殖民地。對各殖民母國而言，這些殖民地單純代表可觀的經濟價值。請問有關東南亞殖民地與母國的敘述配對，下列哪一個配對是<u>錯誤</u>的？
  options:
  - label: A
    content: 荷蘭：印度尼西亞
  - label: B
    content: 法國：緬甸
  - label: C
    content: 英國：馬來西亞
  - label: D
    content: 美國：菲律賓
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B)英國：緬甸。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 學者認為當前某一區域的混亂是因為「先有伊比利人的無知、英國人的貪婪以及美國的自私，讓本地捲入共產主義的威脅，一度還成為冷戰對抗的第一線。這邊又因為自然資源豐富，人民得承擔全球化的經濟剝削。」這個地方是
  options:
  - label: A
    content: 西亞
  - label: B
    content: 東歐
  - label: C
    content: 非洲北部
  - label: D
    content: 拉丁美洲
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「伊比利人的無知、英國人的貪婪以及美國的自私」一句，顯示此地區曾經受到西班牙、英國與美國的宰制，因此答案為(D)拉丁美洲。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 1930 年代後期，英國採取「姑息政策」以因應希特勒在歐洲的擴張。但當時亦有論者不以為然，並評論說：「採取姑息政策太過天真了，因為＿＿＿＿。」以下哪一段話最適合承接在這句評論之後，且最能說明此一評論的理由？
  options:
  - label: A
    content: 希特勒早就提及他打算征服東歐
  - label: B
    content: 希特勒本打算要去對抗共產主義
  - label: C
    content: 它讓英國有時間重整不足的軍備
  - label: D
    content: 它確實有效遏阻納粹主義的擴張
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由於希特勒早在其自傳《我的奮鬥》裡已有征服東歐的打算，因此英國的「姑息政策」根本無法阻止希特勒的野心，(A)為正解。(B)歐洲國家本就想利用法西斯政權去對抗共產主義，此並非論者評論英國太天真的理由。(C)此為正面的話，非對英國太過天真的評論，況且英國採取姑息政策即是無意與德國作戰。(D)姑息政策無法有效遏阻納粹主義的擴張，反而助長其侵略的氣焰。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 右圖是某一改革運動的宣傳畫報，圖中寫著「農民、勞工、學生團結起來」。運動的主要訴求為思想、行動的解放與自由。這場運動最有可能是何者？
  options:
  - label: A
    content: 印度的不合作運動
  - label: B
    content: 東歐的民主化運動
  - label: C
    content: 非裔美國人民權運動
  - label: D
    content: 法國巴黎學生運動
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_112_台北_明倫_社會_歷史_g11s1e3/s1_11_f1.png
    crop:
      page: 2
      rect:
      - 464.5
      - 406.9
      - 564.3
      - 554.5
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 圖中宣傳為「農民、勞工與學生」的團結，但追求的是思想與行動的解放與自由，並非共產主義國家的階級煽動，因此最可能為(D)法國巴黎學生運動。(A)對抗英國的經濟侵略，(B)以推翻共產極權為訴求，(C)消除歧視，要求各方面的平等權利，三者運動的訴求都不是思想、行動的解放與自由。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 關於第二次世界大戰後非洲局勢的演變，下列敘述何者正確？
  options:
  - label: A
    content: 在聯合國主導下，依據各民族文化差異與區域分布劃分國界，各民族紛紛獨立
  - label: B
    content: 在美國強勢主導下，以武力圍堵蘇聯，共產勢力未能進入非洲地區
  - label: C
    content: 即使已經獨立，西方殖民時期的種族隔離政策卻依然實行於非洲部分國家，引發衝突與抗爭
  - label: D
    content: 蘇聯建立「第三世界」，以非洲國家為基地用以進行全世界的共產主義革命
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)多數國家以武力革命方式獨立，受到當年列強擅自劃分疆界的影響，各國獨立後仍陷入種族與文化衝突所引發的動盪中。(B)共產勢力早已進入非洲地區，美、蘇的冷戰對立使非洲更加動盪。(C)為正解。(D)「第三世界」即不願與美、蘇結盟。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 二次大戰之前，德、日、義成立「軸心國家」，標榜以「柏林─羅馬─東京」為□□軸心；但是事實上卻是為日後發動侵略戰爭做準備。請問□□應填入
  options:
  - label: A
    content: 反共
  - label: B
    content: 共產國際
  - label: C
    content: 光榮帝國再現
  - label: D
    content: 極權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 三個軸心國家皆奉行法西斯主義，反對蘇維埃共產主義，因此 1940 年德、日、義三國外交代表在柏林簽訂同盟條約，以(A)反共為軸心，實則相約發動侵略戰爭。
- id: doc_112_台北_明倫_社會_歷史_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 學者論述某次革命時說：「當時，大多數國家的政治人物，都咒罵這一革命及其建立的制度，認為它是某種可怕的、邪惡的東西。相反地，這些國家中的許多偉大作家、激情的革命者和自由主義者，則像迎接曙光般地歡迎這個革命，甚至根據類似理念組成政黨。」這個革命最可能是
  options:
  - label: A
    content: 1789 年法國大革命
  - label: B
    content: 1917 年俄國革命
  - label: C
    content: 1959 年古巴革命
  - label: D
    content: 2010 年茉莉花革命
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
