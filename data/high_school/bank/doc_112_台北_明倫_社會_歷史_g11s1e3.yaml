    18.1813 年歐洲最大的事件為拿破崙戰爭的尾聲，當時甲乙兩國敵對；1900 年代為第一次大戰之前軍事壁壘對立，甲乙兩國卻是同一陣營，選項中符合此條件的國家組合為(B)法國、英國，拿破崙戰爭期間。兩國對立，但在 1900 年代，兩國同為協約國陣營。(A) 1813 年德國尚未統一建國，當時的普魯士與奧國合作反法。(C) 1813 年英俄普奧合作對拿破崙發動解放戰爭。(D) 1813 年與 1900 年代，普魯士或德國皆與法國敵對。

