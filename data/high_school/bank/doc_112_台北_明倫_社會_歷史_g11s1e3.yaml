  explanation: 從兩大軍事集團的關係圖來看，甲為義大利、丁為法，兩國在非洲有殖民地衝突問題；乙為德國、戊為英國，兩國有世界市場問題；丙為奧國、己為俄國，兩國在巴爾幹半島有勢力衝突。正確答案為(B)(C)(D)。(A)乙、丁、戊分別為德國、法國、英國。(E)後來加入協約國的是義大利，鄂圖曼帝國加入同盟國。
