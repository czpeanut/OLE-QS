  stem: 二戰後，非洲各地陸續脫離殖民母國獨立，卻普遍面臨種族與文化衝突的困境，究其原因，下列相關敘述何者正確？
  options:
  - label: A
    content: 西方瓜分非洲的過程中，大多根據自身利益而劃定界限，忽略各族群傳統或生活聚落的差異
  - label: B
    content: 獨立後的非洲各國，多半推行民主政治，易淪為多數暴力
  - label: C
    content: 非洲獨立後，仍有國家實施種族隔離政策，族群間的歧視進一步引發衝突
  - label: D
    content: 美蘇兩強於冷戰時期，分別支持非洲一些部落或政府，因此加深了部族間的敵對
  - label: E
    content: 獨立後的非洲國家因缺乏有經驗的行政人才，因此常面臨糧食短缺、經濟落後等情況
