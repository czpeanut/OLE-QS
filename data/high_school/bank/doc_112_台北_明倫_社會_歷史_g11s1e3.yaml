  group_stem: '資料一：過去 20 年來，西方有一個運動正如火如荼地展開：以「公平貿易」取代「自由貿易」。具體主張是幫助第三世界發展，並發動所謂的「倫理消費」，鼓吹消費者在市場上選擇公平貿易的產品。

    資料二：全球化基本上是建立在貿易自由化之上，但這種作法多少會損害國家權威，打破領土的限制。再者，全球化也依賴網路等高科技，可能產生網路犯罪、恐怖主義及非法交易等問題。面對這些危機，需要各國一起面對，如設置國際聯繫網絡、互相協助或進行跨國合作防治等。'
