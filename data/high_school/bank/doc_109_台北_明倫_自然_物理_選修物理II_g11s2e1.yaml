  section: 1
  number: 4
  type: single
  page: 1
  stem: 如圖所示，OP為一均勻木棒，可繞通過O點的水平軸轉動。若以水平拉力作用於P點，將木棒從鉛直下懸的狀態（θ＝0°）緩慢地拉起，但θ＜90°，若在拉起的過程中，水平拉力的大小維持不變，則其相對於轉軸O的力臂、力矩將隨θ之漸增而作何種變化？
  options:
  - label: A
    content: 力臂、力矩皆不變
  - label: B
    content: 力臂變長，力矩變小
  - label: C
    content: 力臂變短，力矩變小
  - label: D
    content: 力臂變短，力矩變大
  - label: E
    content: 力臂、力矩皆變大
