  section: 1
  number: 6
  type: single
  page: 1
  stem: 質量60公斤的阿明和阿珍在共乘一質量為40公斤之小船，小船長度3公尺。物理很強的阿明欲知阿珍現重多少，於是由右端和位於左端的阿珍交換位置，發現船竟然左行了1公尺，阿明瞬間昏倒。試問阿珍現重多少公斤？
  options:
  - label: A
    content: 小於50公斤
  - label: B
    content: 50～80公斤
  - label: C
    content: 80～l00公斤
  - label: D
    content: 100～120公斤
  - label: E
    content: 120公斤以上
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
