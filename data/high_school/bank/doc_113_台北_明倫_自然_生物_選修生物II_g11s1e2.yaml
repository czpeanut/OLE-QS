  section: 1
  number: 9
  type: single
  page: 2
  stem: 根據目前多數科學家的研究，推論地球上原始生物演化的重要過程包括：(甲) DNA 分子成為遺傳物質，遺傳訊息可進行轉錄與轉譯。(乙)小分子有機物聚合形成大分子有機物。(丙)大氣成分化合產生胺基酸、嘧啶與嘌呤等小分子有機物。(丁) RNA 具有功能性，能催化化學反應的進行。上述演化過程發生的先後順序為何？
  options:
  - label: A
    content: 丙→乙→丁→甲
  - label: B
    content: 丙→甲→丁→乙
  - label: C
    content: 丙→甲→乙→丁
  - label: D
    content: 丙→丁→甲→乙
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 地球上原始生物演化的發生，先從海中具有小分子有機物開始，接著小分子有機物聚合形成大分子有機物，然後必須要有遺傳物質的出現，最先出現的遺傳物質極有可能為 RNA，因其具有能記錄遺傳訊息的功能，又具有催化的能力，有機會能夠複製自己，最後穩定的 DNA 出現，取代了不穩定的 RNA 成為遺傳物質，使遺傳訊息能進行轉錄與轉譯。
  tags:
