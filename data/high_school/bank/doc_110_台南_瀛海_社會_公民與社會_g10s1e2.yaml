- id: doc_110_台南_瀛海_社會_公民與社會_g10s1e2_s2_7
  section: 2
  number: 7
  type: single
  page: 1
  stem: 根據上述，以下何種概念最適合說明我國對「外勞」一詞的看法？
  options:
  - label: A
    content: 種族歧視
  - label: B
    content: 文化衝突
  - label: C
    content: 恩給施捨
  - label: D
    content: 多元文化
  group_stem: (一)「外勞」一詞的出現，約在80年代後期，隨後也成為政策法令中的官方用語。純就字面上的意義，此詞彙應該涵蓋所有非中華民國籍的勞工。然而，其言外之意具有特定的階段與種族意涵，指的是來自東南亞低度發展國家的低階藍領勞工。換句話說，所謂的「外籍」並不包含所有的外國人。來自歐美與日本等高度發展國家的白領工作者，並不在指稱之列。 把東南亞「外勞」視為低劣的他者，獨立於較為籠統、中性的「外國人」範疇，即是「階層化的他者」概念。「外國人」的指涉對象主要來自西方先進國家的白領勞工，雖是族群他者，卻被認為具文化與經濟上的優越性。
  tags:
    unit:
      code: CI-1-7-1
      book: 公民與社會1 民主與人權
      chapter: 文化與社會規範
      title: 族群文化
      std: true
    textbook: 公民與社會1 民主與人權 族群文化
    labeled_by: agent
    label_confidence: high
