  - label: C
    content: 石化工業難以與現代生活切割
  - label: D
    content: 石油的發現與應用，促成第二次工業革命
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)題文中並未提及。(B)一次性能源會有短缺的問題，其燃燒後的產物則造成嚴重的環境汙染。(D)石油早在上古時期已經發現，第二次工業革命後使石油需求量上升。
