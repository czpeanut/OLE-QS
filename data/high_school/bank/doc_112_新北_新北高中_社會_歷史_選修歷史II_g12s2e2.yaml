  stem: '以下 2 則是關於蘇美文明的資料：

    資料一：許多學者認為，由於蘇美人引取幼發拉底河與底格里斯河的水資源進行灌溉，在日積月累的灌溉下，鹽分滲入土壤後降低土壤的沃度，造成蘇美地區的耕地農產量不斷下滑。

    資料二：蘇美人建立了以塔廟為中心的社會組織，能組織且動員勞動力和控制水利，使他們能夠在美索不達米亞生存繁衍。

    根據這 2 則資料，可以得出哪一項推論？'
  options:
  - label: A
    content: 蘇美文明衰亡主因為自然因素影響所造成
  - label: B
    content: 蘇美文明的興衰與人工灌溉系統息息相關
  - label: C
    content: 蘇美人採用人工灌溉來解決土壤肥沃問題
  - label: D
    content: 蘇美文明衰亡主因是外敵入侵，與農業無關
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料二說明蘇美人能控制水利，所以能夠在美索不達米亞生存繁衍；資料一說明蘇美人的水利灌溉，長期使土壤沃度降低，造成農產量下滑。綜合兩者，可知蘇美文明的興衰發展與人工灌溉系統息息相關，答案為(B)。(A)與人工灌溉系統有關。(C)人工灌溉造成土壤沃度降低。(D)題文中並未提及外敵入敵。
