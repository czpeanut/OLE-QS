  stem: 梅花鹿原本是臺灣很常見的動物，原住民族在捕獵之後也會將鹿皮等部位再製成其他物品與漢人交易。然而荷蘭人治臺後，鹿皮變成重要的貿易品，荷蘭東印度公司想要把鹿皮掌握在自己手裡，所以招募許多漢人一同狩獵。漢人與原住民不同，採用大量陷阱捕獵鹿群，一時之間鹿群大量減少，而隨著鹿群的減少，原住民對此表達極度的不滿，因為他們賴以為生的資源也消失殆盡。請問關於這段敘述下列何者正確？
