  stem: 「元代趙孟頫曾提到：『石如飛白木如籀，寫竹還於八法通』（八法：書法寫字技巧），這代表將書法結合繪畫，除了形狀之外，還追求書法的運筆之法。畫家不僅需要懂得繪畫，更要懂得書法，兩相結合之下讓畫面的意境層次更加深遠。這也是文人畫的內涵與旨趣。」請問有關題幹敘述，下列何者推論正確？
  options:
  - label: A
    content: 「寫竹還於八法通」意指學習繪畫前應先學會書法技巧
  - label: B
    content: 題幹指出書法能傳遞比繪畫更多元的意境
  - label: C
    content: 作者認為書法與繪畫兩者相同，都是以筆法描繪更深遠的意境
  - label: D
    content: 書法被當作繪畫來欣賞，爾後成為中國藝術界的主流創作
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)趙孟頫以書法入畫，兩者無先後關係。(B)主張書法與繪畫兩者結合更佳。(D)書法藝術並未成為中國藝術界的主流創作。
  tags:
    unit:
      code: HI-S2-5-2
      book: 選修歷史II 科技、環境與藝術的歷史
