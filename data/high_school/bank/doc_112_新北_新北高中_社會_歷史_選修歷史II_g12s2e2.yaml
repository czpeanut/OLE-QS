  stem: '資料一：電力的發明與應用帶起了第二次工業革命，動力革新的同時也帶起石化產業的發展，德國機械工程師發明了用內燃機運作的汽車，則讓石油的需求量急速上升。除了動力之外，方便使用的塑膠製品、用來造橋鋪路的瀝青，乃至於衣服、化妝品、清潔用品等等，隨處都能見到石化產品的蹤跡，石油已深入到我們的日常當中。

    資料二：石油屬於一次性能源，其燃燒所產生的二氧化碳，會使得臭氧層被破壞、酸雨、土壤酸鹼化以及海洋汙染，而這些問題的來源卻難以解決。

    根據上述 2 則資料，下列解釋何者正確？'
