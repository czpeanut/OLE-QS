  stem: 臺灣歷史上某官方報告指出：「我們堅信如果這些人每天接受學校的教導或宗教集會，以我們淨化的生活為榜樣，他們將會文明化」；「講道後，他們的頭目在我們面前宣布不再猥褻或通姦；婦女懷孕不再墮胎；一夫多妻或一妻多夫是可恥的；不宜裸體，不要像野獸。所有的人都以尊敬、謙卑的方式傾聽這些話」。關於上述內容，下列解釋何者最恰當？
  options:
  - label: A
    content: 背景應為荷治時期，宗教教化改變原住民的風俗習慣
  - label: B
    content: 背景應為日治時期，學校教育改變原住民的風俗習慣
  - label: C
    content: 背景應為荷治時期，宗教教化提升原住民的文化內涵
  - label: D
    content: 背景應為日治時期，學校教育提升原住民的文化內涵
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從官方報告內容來看，當時統治者欲以宗教信仰教化臺灣的原住民族，改變其風俗習慣，由於日本總督府限制對臺灣原住民的傳教活動，因此可推知此時應為荷治時期，(A)為正解。
