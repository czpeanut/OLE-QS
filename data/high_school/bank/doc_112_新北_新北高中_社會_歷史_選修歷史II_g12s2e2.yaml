  stem: 隨著科技日新月異，電子產品增加，然而電子廢棄物也隨之增加，如何處理成為一大難題。許多已開發國家會將垃圾倒至開發中國家，使得當地環境受到汙染。西方國家通常會將垃圾運至亞洲，例如：印度、越南等地；或是運往非洲國家，例如：迦納、海牙等，其中迦納受電子廢棄物所害最深。迦納每年處理大量廢棄物獲益良多，然而其土壤、水都被重金屬所汙染。當地工人處理數以萬計的廢棄物，大部分工人都是孩童，他們會將可再度利用的物品帶走，並砸毀或燃燒無法再利用的產品。這些電子廢棄物即使經過處理，仍含有有毒物質例如戴奧辛，若過度接觸會造成神經的壞死。根據上述資料下列何者正確？
