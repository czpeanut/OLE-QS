    ⇒$\vec{BC}$＝$\vec{AC}-\vec{AB}$＝（3，3，0）

    又$\vec{AD}$＝$2\vec{BC}$＝（6，6，0）

    故 D（－2＋6，0＋6，－1＋0）＝（4，6，－1）'
- id: doc_111_台北_北一女中_數學_數A_g11s2e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 空間中一長方體 ABCD－EFGH 如右圖，其中三個頂點的坐標為 A（1，2，－2）、B（2，4，0）、C（6，6，－4），且長方體體積為 54，則點 H 的坐標為＿＿＿＿。
  assets:
  - key: s3_2_f1
    kind: figure
    file: doc_111_台北_北一女中_數學_數A_g11s2e1/s3_2_f1.png
    crop:
      page: 2
      rect:
      - 480.1
      - 557.3
      - 575.35
      - 636.5
  answer:
  - （7，2，－5）
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{BA}$＝（－1，－2，－2），$| \vec{BA} |$＝$\sqrt{(-1)^{2}+(-2)^{2}+(-2)^{2}}$＝3

    $\vec{BC}$＝（4，2，－4），$| \vec{BC} |$＝$\sqrt{4^{2}+2^{2}+(-4)^{2}}$＝6

    ∵$| \vec{BA} | \times | \vec{BC} | \times | \vec{BF} |$＝3×6×$| \vec{BF} |$＝54 ∴$| \vec{BF} |$＝3

    又$\vec{BF}$//$\vec{BA}$×$\vec{BC}$＝（12，－12，6），且$| \vec{BF} |$＝3，$| \vec{BA}\times \vec{BC} |$＝18

    ⇒$\vec{BF}$＝$\frac{1}{6}\vec{BA}$×$\vec{BC}$＝（2，－2，1）（依右手法則取正）

    且$\vec{BH}$＝$\vec{BA}+\vec{BC}+\vec{BF}$＝（5，－2，－5）

    故 H（2＋5，4－2，0－5）＝（7，2，－5）'
