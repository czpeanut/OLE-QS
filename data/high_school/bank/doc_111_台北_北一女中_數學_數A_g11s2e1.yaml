- id: doc_111_台北_北一女中_數學_數A_g11s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 空間中三點 A（2，－4，5）、B（－1，－2，9）、C（6，8，2），則下列選項中，哪些是正確的？
  options:
  - label: A
    content: $\vec{AB}$＝（1，－6，14）
  - label: B
    content: $| \vec{AC} |$＝13
  - label: C
    content: cos∠BAC＝$\frac{4}{13\sqrt{29}}$
  - label: D
    content: △ABC 面積為$\frac{13\sqrt{29}}{2}$
  - label: E
    content: 若$\vec{AP}$＝$2\vec{AB}$＋$\vec{AC}$，則 P 的坐標為（－2，16，5）
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：$\vec{AB}$＝（－3，2，4）

    (B) ○：$\vec{AC}$＝（4，12，－3）⇒$| \vec{AC} |$＝$\sqrt{16+144+9}$＝13

    (C) ╳：cos∠BAC＝$\frac{\vec{AB} \cdot \vec{AC}}{| \vec{AB} | | \vec{AC} |}=\frac{-12+24-12}{\sqrt{29}\times 13}$＝0

    (D) ○：由(C)知，∠BAC＝90°

    ⇒ 面積＝$\frac{1}{2}\overline{AB}\times \overline{AC}$＝$\frac{13\sqrt{29}}{2}$

    (E) ╳：$\vec{AP}$＝$2\vec{AB}+\vec{AC}$＝（－2，16，5）

    ⇒ P（0，12，10）

    故選(B)(D)'
