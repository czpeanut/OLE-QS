- id: doc_108_新北_新北高中_自然_地科_g10s1e1_s2_40
  section: 2
  number: 40
  type: single
  page: 6
  stem: 關於地震預測和地震預警的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 地震預警是指在地震發生後，地表面強烈振動之前發布警訊
  - label: B
    content: 目前地震預測的研究包含地殼形變、電離層電子濃度、地下水水位變化等
  - label: C
    content: 任何地區均可在災害型震波抵達前發布預警
  - label: D
    content: 可利用地震預警讓高鐵停駛減少災害
  group_stem: 2018年2月6日，<u>花蓮</u>發生苪氏規模6.4的地震，有人不理會氣象局勸導，公開違法預測說一週內會再發生大規模地震造成民眾恐慌，最後氣象局依據氣象法開罰20萬元。地震真的不能預測嗎？地震預測和地震預警又有什麼不同呢？ 地震預測是指在地震發生之前，能夠明確地指出地震發生的時間、地點、規模、震度或可能造成之地震災害等資訊。目前全球不同領域已積極投入各項地震預測相關研究，範圍涵括監測全球衛星定位系統之地殼形變、電離層電子濃度、地下水水位、地磁變化、地層應變、地震波速度與地震活動度等項目，截至目前為止，地震預測技術仍在試驗及研發階段，無法準確預測地震。 地震預警 ( 強震預警系統 ) 是一套可迅速偵地震並藉由震災區之預估發布警訊的系統。該系統能在大地震發生後，地表面強烈振動之前，爭取地震能量傳遞的數秒乃至數十秒的時間，對某些重要公共設施 ( 如捷運系統、高速鐵路、醫院等 )，發出強震警訊，使其能有所因應，以降低震災。 強震預警系統除了快速偵測地震外，還能評估可能的災區做為預警的範圍。氣象局利用高密度即時地震網中，靠近震央少部分地震站，最早收錄到的早期破壞較小震波訊號 ( P波 )，快速演算出震央資訊，推估各地之預估震度與災害性震波 ( S波 ) 到達時問，並以無線電波快速對外通報，如此將可示警距離震央較遠的地區，於破壞性震波抵達前提早應變。〔參考資料：中央氣象局〕
  shared_asset: g2_40_41
  answer:
  - C
