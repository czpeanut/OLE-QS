  stem: 目前用於地函岩石的定年法為錸 ( $^{187}$Re )－鋨 ( $^{187}$Os ) 同位素定年系統，已知由錸 ( $^{187}$Re ) 放射性衰變至鋨 ( $^{187}$Os ) 的半衰期為420億年，若在Tuzo與Jason中測得母元素質量變成原來的93%，則根據參考公式，Tuzo與Jason的年代約為多少？( 1og 2＝0.3，1og 93＝1 .97 ) 參考公式：$\frac{衰變後的母元素質量}{ 衰變前的母元素質量 }$＝( $\frac{1}{ 2 }$ )$^{t/420}$，其中t為所經歷的時問
