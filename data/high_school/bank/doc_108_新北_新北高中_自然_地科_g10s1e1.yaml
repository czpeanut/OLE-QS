  group_stem: 地球物理學家在90年代末發現地球深處有兩塊很大的震波低速帶，分別位於太平洋與非洲的下方約2500-2900公里深處，稱它們為「大型橫波低速帶」( Large Low Shear Velocity Province，簡稱LLSVP )，還為他們各自取了綽號：Tuzo與Jason。 許多源自地核與地函邊界的岩漿作用，都在LLSVP範圍的邊緣發生，<u>夏威夷</u>與<u>冰島</u>火山等熱點火山就是例子。這些熱點火山的岩漿帶著來自LLSVP的物質來到地表，經過少許岩漿結晶分異作用後，噴發出地表形成火山岩，因此成分與地函物質相近。 地質界對於這兩個震波低速帶的本質有許多爭論，比較流行的說法認為他們是板塊墳場：曾經在地球表面的板塊在板塊交界處隱沒到下方的地函，沈入地球深處並堆積在地核與地函邊界上。但是近期一個<u>美國</u>與<u>法國</u>的地球化學團隊就分析並統整了世界各地這些火山岩的氦同位素組成，發現他們的同位素特徵並不像是曾經在地表、受過地表作用的板塊物質，反而像是自從地球生成以來，從未被板塊作用打擾的原始成分。 地質學家可以透過許多手段來得知地表下發生什麼事，除了使用震波之外，還有許多與化學相關的手段，例如常用來定年的「鈾／合」比。但是也有不少指標並不是拿來定年的，例如$^{4}$He / $^{3}$He比。天然穩定的氦同位素有$^{3}$He與$^{4}$He兩種，當中$^{3}$He是在宇宙形成時就存在的，其含量在地球形成後就不太會變動。研究顯示，與近地表的岩石相比，地底那些從未接觸過空氣的岩石有較多的$^{3}$He同位素，所以有較多$^{3}$He同位素的岩石被認為是來自地函的岩石。 我們已知氦同位素$^{3}$He和$^{4}$He的比值是火山熔岩來源的重要指標。<u>夏威夷</u>火山釋放出的氦氣比從中洋脊釋放出的氦氣更富含$^{3}$He，而從中洋脊釋放的氦氣確定來自於上部地函，<u>夏威夷</u>火山的熱柱顯然來自於更深的地方。從熱柱和中洋脊間的氦同位素比例差異，顯示出整個地函的熱對流並非均勻的，而是存在著非常明顯的柱體。
