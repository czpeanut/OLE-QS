  stem: '籃球員戴維斯(QuincyDavis)在2013年歸化中華民國國籍並放棄美國國籍，當時內政部引用《國籍法》第6條規定，認定其對國家有特殊貢獻者，不受居留5年等限制受理申請，在各方單位的協助之下，順利入籍。戴维斯曾接受媒體訪問時表示，臺灣有世界上最好的健保系统、臺北的捷運乾淨又準時，最重要的是有良好的治安，這些都是他在美國不曾感受到的。成為臺灣人後，「讓我感受到身為人該有的樣子」，因為臺灣人不會單憑膚色來看待一個人。

    上文中戴维斯申請歸化我國國籍，應該是建立在哪一種認同上?請在答案卷上勾選一項認同原因(3分)並摘錄文本說明判斷的依據(2分)'
