    九合一大選於2018年底登場，<u>同時也因為(丙)法門檻下修</u>，出現許多公民投票的議題與大選同一日舉行投票，其中包含了立專法派的「愛家公投」與修民法派的「平權公投」，結果愛家公投提出的「民法婚姻應該限定在一男一女的結合」以及「同性婚姻應該以民法婚姻規定以外之其他形式來保障」兩項公民投票案通過。最後，2019年5月，立法院三讀通過《司法院釋字第七四八號解釋施行法》，我國成為亞洲第一個同性婚姻合法化的國家。'
