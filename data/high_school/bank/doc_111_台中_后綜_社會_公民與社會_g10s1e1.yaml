  stem: 駐香港官員與陸委會將簽署一中承諾書視為矮化國格之舉，最可能的原因為何？
  options:
  - label: A
    content: 臺灣經歷多個不同政權的統治，造成多元族群間爭奪國家主權
  - label: B
    content: 日本戰敗後，中共主張臺灣為其固有領土，具有統治的正當性
  - label: C
    content: 自中共建國且兩岸分治後，在各項政策、經貿上失去合作契機
  - label: D
    content: 我國憲法對於領土沒有列舉疆域，造成國際地位存在灰色地帶
  group_stem: '(四)臺灣駐香港辦事處6位派駐人員簽證在2021年6月21日到期，香港政府日前發函要求須簽「一個中國承諾書」，否則限6月21日離港，駐港官員全員拒簽矮化國格文件，代理處長林振宙等7位官員於20日提前離港，僅留7月簽證才到期的經濟部官員倪伯真一人，堅守崗位。

    臺灣駐港最高機構以「臺北經濟文化辦事處」名義運作，實際單位為陸委會，服務包括核發簽證，為我國在港國民換發護照，辦理赴臺留學、定居，提供緊急支援。

    對官員離港一事，陸委會表示，臺港本於互惠互利原則互設辦事處，且一切活動遵守法令，未逾越業務功能範疇。陸委會批評，中共及港府以「一中承諾書」設置障礙，影響香港辦事處人員的輪調及正常運作，片面違反2011年雙方換文內容，要對臺港關係及民眾權益受損負起所有責任，並向中共喊話：「只要能在所謂的民主對等，和平對話的原則之下，隨時都能開啟交流互動。」'
