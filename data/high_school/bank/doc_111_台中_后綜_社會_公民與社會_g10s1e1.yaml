  stem: 根據上文第二段畫線處，大法官認為《民法》沒有保障同性別二人結婚之權利，違反了哪兩項權利?請在答案欄中寫出甲、乙的名稱。(各2分)
  group_stem: '《公民與政治權利國際公約及經濟社會文化權利國際公約施行法》於2009年公布施行，政府於2016年公布第二次國際人權報告，並於2017年1月邀請來自不同國家的人權專家來臺進行「兩公約國家人權報告第二次國際審查」。會後，審查委員共提出78點結論性建議給我國政府。其中，審查委員特別關注同性婚姻等議題。審查委員十分樂見我國政府推動婚姻平權，把同性婚姻納入《民法》中，成為消彌性別歧視、性別不平等的亞洲先鋒。

    2017年3月，大法官召開了憲法法庭，進行同性婚姻釋憲案的辯論，並在5月公布釋憲結果。根據《司法院釋字第748號解釋》，《民法》沒有保障同性別二人結婚之權利，違反了<u>《憲法》中的(甲)權與(乙)權</u>，並要求立法院應該要在兩年內以任何立法的形式補足同性伴侶的權利。釋字第748號解釋雖然確立了我國同性婚姻合法化將在兩年內完成，不過也開啟了「修民法」與「立專法」來保障同性伴侶權益的爭論。

    九合一大選於2018年底登場，<u>同時也因為(丙)法門檻下修</u>，出現許多公民投票的議題與大選同一日舉行投票，其中包含了立專法派的「愛家公投」與修民法派的「平權公投」，結果愛家公投提出的「民法婚姻應該限定在一男一女的結合」以及「同性婚姻應該以民法婚姻規定以外之其他形式來保障」兩項公民投票案通過。最後，2019年5月，立法院三讀通過《司法院釋字第七四八號解釋施行法》，我國成為亞洲第一個同性婚姻合法化的國家。'
