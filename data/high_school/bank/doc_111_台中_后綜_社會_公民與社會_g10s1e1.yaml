questions:
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 國際社會上，對於公約締約國而言，不僅代表締約國同意該公約內容，簽署後更有遵守的義務。請問：下列何者屬於保障一般群體的國際人權公約？
  options:
  - label: A
    content: 消除對婦女一切形式歧視公約
  - label: B
    content: 兒童權利公約
  - label: C
    content: 經濟社會文化權利國際公約
  - label: D
    content: 身心障礙者權利公約
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 首度改編國產電玩的電影《返校》於2019年9月上映，劇情描述翠華中學美術老師兼任輔導教師張明暉在校內儲藏室創辦了讀書會閱讀「禁書」，成員包括音樂老師殷翠涵、學生魏仲廷等人。不過，當時國民黨政府以防止共產主義滲透等理由頒布《戒嚴令》，路上隨處可見「保密防諜，人人有責」、「嚴禁組黨結社」等標語及廣播，組織地下讀書會甚至可能構成「叛亂罪」。依據上述訊息判斷，《戒嚴令》限制了張明暉等人的何種公民權利？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 文化權
  - label: C
    content: 參政權
  - label: D
    content: 社會權
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 1988年11月，由巴勒斯坦解放組織主控的巴解民族會議，在阿爾及利亞首都阿爾泰吉爾(Algiers)開會，正式宣布於約旦河西岸加薩走廊建立「巴勒斯坦國」，以耶路撒冷為首都，並呼籲召開中東和平國際會議。宣言中要求以色列撤回1967年的疆界，將耶路撒冷歸還給巴勒斯坦，同時表明巴勒斯坦願意遵守聯合國第242號及38號決議，並獲得70餘國的承認。事實上巴勒斯坦至今尚未建立完整的國家，由上述的事實推測，主要是因為它還缺少國家的哪個構成要素？
  options:
  - label: A
    content: 領土
  - label: B
    content: 人民
  - label: C
    content: 主權
  - label: D
    content: 政府
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 現代民主國家議會都擁有最高立法權，而其行使得當與否，<u>最終決定權還是歸屬於人民</u>，當議會的行為違反人民的信託，人民可以透過選舉更換代表。請問：上文中劃線部分說明下列哪一個民主概念？
  options:
  - label: A
    content: 三權分立
  - label: B
    content: 直接民權
  - label: C
    content: 國家認同
  - label: D
    content: 主權在民
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 全球化使得不同的國家或區域的人口、企業以及政府之間的互動與整合趨於頻繁與密切，然而我國卻因兩岸特殊的關係，在國際事務參與或互動上產生障礙。下列關於我國參與國際社會的現況，何者正確？
  options:
  - label: A
    content: 在參與非聯合國體系組織時皆能使用國家身分
  - label: B
    content: 「一中原則」是我國參與國際事務的主要障礙
  - label: C
    content: 以「中華臺北」名稱加入世界貿易組織(WTO)
  - label: D
    content: 目前僅得以觀察員的身分受邀世界衛生大會(WHA)
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 日前某臺灣法律學者因入籍中國，並在南京登記戶籍，隨後我國內政部移民署依法廢止其在臺灣的戶籍。由於兩岸處於分裂分治的狀態，因此根據我國法律規定，臺灣地區人民不得在大陸地區設有戶籍或領用大陸地區護照。然而該學者認為除籍使他喪失公民權、不能請領退休金及無法參加健保，將對移民署提告。上述所提及之法律，最可能為下列何者？
  options:
  - label: A
    content: 《臺灣關係法》
  - label: B
    content: 《中國民國憲法》
  - label: C
    content: 《香港澳門關係條例》
  - label: D
    content: 《臺灣地區與大陸地區人民關係條例》
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 2018年底法國展開一系列的「黃背心運動」。示威人士最初是抗議燃料稅不斷飆漲而走上街頭，參與活動者皆穿黃背心，故稱為「黃背心運動」，最終馬克宏政府作出讓步，凍結提高燃料稅的計畫6個月，然而運動訴求擴大到要求「調漲基本工資」且抗議行動已演變成廣泛的反馬克宏運動。請問：黃背心運動所訴求的調高基本薪資，與我國《憲法》規定的哪一項權利有關？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 社會權
  - label: C
    content: 參政權
  - label: D
    content: 文化權
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 領土是每一個主權國家構成的必備要素，請問：關於我國對於領土的規定與解釋，何者敘述為正確？
  options:
  - label: A
    content: 我國領空範圍為玉山主峰往天空延伸12英里計算
  - label: B
    content: 我國至今無法成為各重要國際組織的會員國，主因是將中國列為我國疆域所致
  - label: C
    content: 依照《憲法增修條文》的精神，我國疆域包含自由地區與大陸地區
  - label: D
    content: 若要對於我國領土進行變更，無須透過公民複決，由政黨協商後即生效力
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 憲法是國家的根本大法，我國亦以《中華民國憲法》及其增修條文為立國基礎，關於我國《憲法》規範與變遷，下列敘述何者正確？
  options:
  - label: A
    content: 憲法中明定我國是民主的共和國體制，且國家主權屬於中央政府
  - label: B
    content: 我國修憲採公民投票複決方式，並直接修改憲法本文
  - label: C
    content: 為使憲法更符合國家政治現狀，將目前治權不及的領土範圍刪除
  - label: D
    content: 修憲後人民得定期改選行政首長與民意代表，更能落實主權在民
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 我國海釣船疑因越界進入日本海域，而遭日艦拖帶，我國海巡隊員登海釣船了解時，遭日警壓制在地。請問：下列相關敘述何者正確？
  options:
  - label: A
    content: 海巡署的海巡隊員，必須具備我國國籍
  - label: B
    content: 海岸線向外延伸200海浬，為各國的領海
  - label: C
    content: 主權所及的範圍為領土，僅包括領海與領陸兩種
  - label: D
    content: 我國透過外交系统向日本提出嚴正抗議，顯示我國主權已受國際認可
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 臺東縣馬蘭國小校長認為臺東縣是本土語言別最多的縣市，不同的語言背後蘊含著不同的文化資產。學校可透過母語商店、母語廣播、校埕說古、米食教學、親子文化等文化體驗活動，將本土語言結合生活文化，讓學生經由接觸、體驗到喜愛，領略到臺灣文化之美。請問：下列何者與題幹同為實踐多元文化權？
  options:
  - label: A
    content: 為讓大家有共同語言及增加族群團結，強迫客家人、原住民學習閩南語
  - label: B
    content: 文化部藉由社區總體營造計畫，將社區文化融入當地居民生活
  - label: C
    content: 飲食不屬於文化的一種，若無法確定製造過程衛生，應避免推廣到國外
  - label: D
    content: 立法對於東南亞來臺歸化的新移民，要求就讀夜間補校以早日適應臺灣生活
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 2018年底有兩項關乎民生議題的公投案，分別是「反空汙－逐年降低火力發電」以及「反核食－禁止日本核災食品進口」，提案者呼籲大家踴躍投票支持，才有機會確保國民及後代子孫的健康存續。請問：上述呼籲所反映的公民權利間發展關係應該是下列何者？
  options:
  - label: A
    content: 以自由權影響社會權的實現
  - label: B
    content: 藉參政權促成社會權的落實
  - label: C
    content: 以自由權影響文化權的實踐
  - label: D
    content: 藉參政權促成文化權的開展
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 政府於2019年制定《國家語言發展法》，並將國家語言(如客家語、原住民語、閩南語、臺灣手語等)列為國民教育階段部定課程。為此，教育部召開課程審議會，2021年1月9日會中做成決議，於國中教育階段七、八年級將本土語言列為部定必修，九年級列為選修，最快預計於111學年度實施；高中教育階段則尚未定案，有待後續研議。下列何者最有可能是此決議的目的？
  options:
  - label: A
    content: 尊重多元文化並促進國家語言之傳承及發展
  - label: B
    content: 鼓勵在家學習母語以充分利用學校教育資源
  - label: C
    content: 保障各族群的學生皆能擁有平等的受教育權
  - label: D
    content: 培養我國學生具備多語專長以提升其競爭力
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 頓內茨和盧甘斯克位於烏克蘭東部，緊鄰俄羅斯，俄語人口偏多。2014年，頓內茨與盧甘斯克自行辦理公投，要求脫離烏克蘭獨立，公投結果兩地都以80%以上的高票通過獨立，成立頓內茨共和國與盧甘斯克共和國，由俄國支持的分離主義分子治理，但未獲西方國家及聯合國承認。不過俄羅斯總統普丁在2019年簽署行政命令，讓上述兩地的居民能在提出申請的3個月內輕易獲得俄國護照，請問：此舉對俄烏兩國的意義，該如何評析最為恰當？
  options:
  - label: A
    content: 俄羅斯在其領土內行使主權應當不容他國勢力干涉
  - label: B
    content: 烏克蘭的領土及主權完整性受俄國挑戰而陷入危機
  - label: C
    content: 俄羅斯的主權地位高於烏國故干涉其內政尚屬合理
  - label: D
    content: 烏克蘭已無權力賦予公投地區的人民各項權利義務
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 香港人在過去30年共有三波移民海外的浪潮。第一波是1989年中國天安門事件後，加上港人對於回歸中國的一國兩制有疑慮；第二波為香港回歸前兩年；第三波則是2010年之後，中國放寬國人旅遊香港，帶來高房價等社會問題，激化中港矛盾，以及收緊港人的言論自由尺度。前兩波因為臺灣剛解嚴，民主化剛起步，港人對臺灣民主沒信心，故多半移民至英國、加拿大等地，但在2014年香港爭取真普選失敗後，民主的臺灣便成為第三波移民首選。上述現象可看出影響香港人國家認同的主因應該是？
  options:
  - label: A
    content: 民族血緣連結
  - label: B
    content: 歷史文化傳統
  - label: C
    content: 政治社會體制
  - label: D
    content: 經濟發展程度
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 我國在2018年11月24日依《公民投票法》舉行多案全國性公民投票，其中第12案達到法定通過門檻，依當時多數民意及2017年5月的司法院大法官第748號解釋之意旨，提出《司法院釋字第748號解釋施行法》草案，並於同年5月17日立院三讀通過，使同性婚姻合法化。由此例可見國家與人民之間具有什麼關係？
  options:
  - label: A
    content: 人民基於國民主權，可藉直接民主影響國家政策
  - label: B
    content: 擁有國籍的人民依法具享受權利及負擔義務資格
  - label: C
    content: 國家應以公權力措施約束人民，以維護社會秩序
  - label: D
    content: 國家應立法界定人民身分，以確立其權利與義務
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 我國某航空公司空服員為要求合理的勞動條件而發動罷工，最終成功迫使資方讓步，也帶動後續的機師罷工及其他航空公司的勞權抗爭。請問：上述呈現的公民權利發展面向，最近似於何者？
  options:
  - label: A
    content: 為維護民族固有的狩獵傳統而至立法院前遊行抗議
  - label: B
    content: 爭取讓18歲青年擁有投票資格以促進其公共參與
  - label: C
    content: 因應人口高齡化現象故要求政府健全長期照護機制
  - label: D
    content: 婦女團體呼籲政府應對同工不同酬現象提出改善
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 所謂「弱國無外交」，我國自1971年退出聯合國以後，外交友邦銳減，下列何者<u>不是</u>我國突破外交困境的因應之道與具體措施？
  options:
  - label: A
    content: 對國際社會主要以正式外交的方式突破中共封鎖
  - label: B
    content: 對國際社會提供人道救援
  - label: C
    content: 爭取參加國際間的非政府組織
  - label: D
    content: 爭取主辦國際會議，並爭取與無邦交國建交與復交
- id: doc_111_台中_后綜_社會_公民與社會_g10s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 我國人民身分認同的趨勢分布變化如圖，下列分析何者最為適切？
  options:
  - label: A
    content: 認為自己是中國人的比例從來沒有增加過
  - label: B
    content: 臺灣人認同後來居上目前已成為國內主流
  - label: C
    content: 無反應者沒有國族身分認同問題但比例低
  - label: D
