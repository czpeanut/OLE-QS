      - 479.1
      - 295.95
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)圖中並無原住民族的薪資資料，故無法推論。(B)因為女性的薪資水準較男性為低，因此需工作更長時間才能獲得與男性相同的薪水，為正解。(C)資料無法看出職業類別，因此無法得知是否為性別職業區隔所造成。(D)女性的薪資水準較低，因此更難以透過薪資儲蓄。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 3
  stem: 「秋鬥」是一種社會運動，以爭取勞工權益為目標，由勞工團體舉辦號召民眾以遊行方式進行，遊行沿途高喊口號爭取權益，關於上述社會運動的敘述，請問下列何者推論正確？
  options:
  - label: A
    content: 此敘述的社會運動是指面對違背個人良心的法律時，有意識地拒絕服從
  - label: B
    content: 社會運動往往透過示威遊行、靜坐抗議等體制內的方式來進行
  - label: C
    content: 此敘述的社會運動是由運動組織進行領導，透過組織集中資源有效應用而形成
  - label: D
    content: 科技力量打破社會運動對政黨的依賴
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)選項敘述為公民不服從的定義，並非社會運動。(B)示威遊行、靜坐抗議為體制外的方式。(C)勞工團體為運動組織，每年的秋鬥由此進行組織及領導，為正解。(D)科技雖可讓社會運動產生新的形式，但仍無法完全脫離對政黨的依賴，例如可遊說立法院黨團提案修改法律等。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 3
  stem: A 市鐵路地下化工程，引發土地徵收爭議，拆遷戶組成「反對 A 市鐵路地下化自救會」向市政府進行抗議。假設你是 A 市政府的市府顧問，根據此事件爭議，請問你會提出下列何項做法有助於減少民眾對政府公共政策的反彃？
  options:
  - label: A
    content: 賦予政府最高的權限，公權力的行使不允許受到質疑
  - label: B
    content: 讓權益受到犧牲人數達到最少，政策集中規劃在人口最少的地方實施
  - label: C
    content: 讓市場機制自由運作，政府不要推動任何公共政策
  - label: D
    content: 政策執行前進行環境評估、汙染監控及鼓勵民眾參與
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此做法忽視人民的聲音，無助於減少民眾反彈。(B)仍然有民眾因政策而犧牲，沒有兼顧少數人的聲音。(C)此作為過於消極，也不符合現代民眾對於政府角色落實公共利益的期待。(D)此做法讓民眾參與政府決策，並遵循程序正義，藉由爭取民眾認同最為可行，為正解。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 根據內政部公布統計數據公告，截止民國 109 年我國已有 372 個政黨合法立案。政黨與一般壓力團體或社會團體之間有何不同？
  options:
  - label: A
    content: 參與選舉以掌握政治上權力
  - label: B
    content: 著重在政黨自身利益的表達
  - label: C
    content: 透過體制外的方式影響政策
  - label: D
    content: 發揮監督與影響政府的能力
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 政黨與一般社會團體最大的差別，在於政黨會推派候選人參選，以取得執政權，故選(A)。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 近年來勞動意識提升，各種勞工團體常以走上街頭示威遊行的方式從事社會運動，希望能提升工資、縮減工時，讓勞工權益能更受保障，但有時也會跟警察發生衝突，甚至採取罷工行為。對於上述內容，請問選項中的推論敘述何者正確？
  options:
  - label: A
    content: 罷工是屬於最激烈的革命式社會運動
  - label: B
    content: 社會運動多採取體制外的策略，目的在喚起政府及民眾的關注
  - label: C
    content: 罷工會影響多數社會大眾的權益或是社會運作，政府應立法禁止
  - label: D
    content: 勞工團體是為了保障勞工權益，故屬於營利之志願結社
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)革命才是最激烈的社會運動。(B)社會運動常藉體制外的做法，促使民眾關注，為正解。(C)罷工為勞工合法的勞動權，政府應該保障而非禁止。(D)應屬於非營利的志願結社。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 某夜市商圈居民不滿商圈快速擴展，帶來了油煙、汙染、髒亂，噪音乃至治安上的問題，居民不堪其擾，組成自救會並上街遊行、舉辦公聽會表達訴求，要求店家離開商圈；商圈業者也自組自救會，號召業者守護商圈。關於上述兩個自救會的特性何者正確？
  options:
  - label: A
    content: 居民自救會成員必須認同維護生活品質的目標，凝聚向心力
  - label: B
    content: 自救會是由政府指揮居民及業者組成，由上而下的社會運動
  - label: C
    content: 商圈業者自救會目的在於留在商圈從事營利，屬於財團法人
  - label: D
    content: 居民自救會透過遊說、公聽會阻止社會變革，是激進的行為
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)自救會上街遊行是民眾自發性組成，屬於由下而上的社會運動。(C)自救會與財團法人無涉；財團法人是指以從事公益為目的，由捐助人捐助一定財產，經主管機關許可，並向法院登記之私法人。(D)遊說、舉辦公聽會為溫和型的社會運動方式。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 4
  stem: 某沿海城鎮居民抗議 A 公司設立大型風力發電機，帶來嚴重噪音，居民成立了反對自救會。其後部分居民於是集資創辦了相關雜誌，自救會轉型為正式組織，進行環境復耕，宣導友善農法；另一部分居民則持續關注環保，教育、農業等議題，成立有明確利益目標的壓力團體。根據前述報導內容，請問下列有關壓力團體的敘述，何者較為正確？
  options:
  - label: A
    content: 會利用各種方式影響政府決策，妨礙國家進步發展
  - label: B
    content: 多數強調自利性的目的，欠缺公益性之社會性宗旨
  - label: C
    content: 可以透過正式與非正式管道，表達意見並影響決策
