    32.(A)依表中資料顯示，2020 年的總產出明顯低於 2019 年。(B)使用實質 GDP 計算會較為準確。(C)影響 GDP 的高低可從民間消費、投資、政府支出及出口等面向來討論，而非物價的波動，且物價波動應該消除。

    33.(A)因為房地產價格漲幅高於薪資所得上漲幅度，所以可推論年輕世代靠個人累積的經濟資本可能較上一代少，為正解。(B)無法得知是否高於國際平均水準。(C)(D)從高教育程度父母對子女的職業地位與所得的影響有上升趨勢，仍可看出部分年輕世代的經濟及資本，仍受其父母所影響。

    34.(A)(D)為功能論的論點。(B)並非由於階級鬥爭，而是掌握權力的人鞏固自身權力而產生階層。(C)此為衝突論觀點，為正解。

    35.(A)(C)個人行為並非社會運動。(B)此為政策宣導，並非社會運動。(D)由眾人組成（民間發起），有訴求目標且有具體行為，符合社會運動的要素。

    36.公民不服從泛指公民認為現有的法律具有道德上的瑕疵以及不公平性，出於守護更高的理念，而採取不合作和非暴力的抗議、違法行為，並接受因為不合作運動違規而遭受到法律的制裁。(A)並非基於公益。(B)並非基於公益，且非公開行為。(C)陳情、請願屬於體制內行為，非公民不服從。(D)是為抗議議會立法自肥，此為公益，而做出違法行為，符合公民不服從的定義。

    37.(A)政二代也屬於階級複製。(B)從題幹可知，階級複製也會發生在民主社會。(C)仍必須透過選舉，故並非完全如選項所述，仍有自身努力的因素，只是家族可以支持並給予其部分的競爭資源。

    38.(A)並非依照習癖，而是使用的權利。(B)廁所的使用權為基本人權，人人皆應享有。(D)此與社會安全網無關，而是未落實人權的保障。

    39.水平流動可以指一個人的職位工作變動，但是所得與聲望沒有改變的情形；換言之，指流動後的社會地位無差別的現象，通常是轉換工作職業或個人的遷移等所造成的流動。(A)(C)為向上流動。(B)皆為店員，屬於水平流動，為正解。(D)此與流動無關。

    40.(A)並非一定使用違法的方式。(B)政府是否須接受意見，應視其是否符合公益及施政方針等考量。(C)有些社會運動僅主張某些人的訴求，可能侵害其他群體的權益，未必是對處境不利者有保障。

    41.從文中所述得知安倍從政是繼承父業，因此可說明(A)家庭背景對自身的社會地位具有影響力。(B)未提及大學教育的重要性。(C)僅從個人的生涯無法推論整體社會的現象。(D)文中並未提及社會資本的豐厚才能當選。

    42.(A)為功能論觀點。(B)為衝突論觀點。(D)僅為衝突論觀點。

    43.(A)原住民運動是長久以來醞釀，並透過逐步修法獲得相關權利，與累積一定程度的不滿情緒之社會運動較不相同，也並未使用大量的資源動員。(C)此為爭取勞動權益，與政治改革無關。(D)此為個人歧視行為，與社會運動中的資源剝奪無關。

    44.(B)理組學生認為此種社會分工合理，故支持功能論。(C)(D)應是功能論的觀點。

    45.(A)政二代應是「政治權力分配」透過家庭環境再製的最佳說明。(C)只從政壇的現象無法推論至其他社會狀況，因此不能判斷總流動率。(D)此與選舉制度關聯性較低，應是社會結構的影響。

    46.(A)此為功能論的觀點。(B)階級間權力支配的論述，為衝突論觀點。(C)民眾期待政府能立法規範避免政治資源分配的不平等，此乃衝突論的主張，為正解。(D)此為衝突論的觀點。

    47.(A)物價已上漲的情況下，發放三倍券可能促使通膨更嚴重。(B)顧客少去 IKEA，該店仍須印製菜單，無法降低菜單成本。(C)通膨會使民眾降低消費意願，廠商也會衡量其生產成本，故為正解。(D)此為過度推論，從題文無法判斷。

    48.印製目錄的成本為交易成本，與(A)討論價格、(B)處理客訴、(D)廣告宣傳相同。(C)原物料成本為產品成本的一種，不屬於交易成本。（本題答案，學校開放(A)(B)(D)皆可選）

    49.(A)少女遭販賣並非現代勞務關係的型態，且此為違法行為。(B)此並非所得不平等，而是原住民少女受到性別歧視，被勞動剝削和壓迫，並且沒有職業選擇自由。(C)因為原住民少女被迫從事性交易，顯示其更弱勢的問題，為正解。(D)無法提升家族社會地位，反而可能會使家族蒙上負面名聲。

    50.「新社會運動」一詞是一種社會運動理論，試圖描述自 20 世紀 60 年代中期以來（即後工業經濟中）在各個西方社會中出現的一系列新運動，此運動的出現也為受壓迫者對自己的生活採取新的詮釋方式，而建立新的世界觀。新社會運動關注與人權相關的問題（例如：同性戀權利、性別平權及和平主義），而不是經濟福祉等物質主義性質的問題。此文是關於人權及民族平等有關的社會運動，屬於此種理論之類型，故選(D)。'
