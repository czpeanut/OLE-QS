- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '終局之戰時，薩諾斯與史塔克對於社會群體的概念各有自己的觀點，下列內容為雙方在對戰時交鋒的對話。各自提出關於學校教育對社會階層化的影響。請根據下列兩人對話觀點，判斷何者選項為正確？

    史塔克：我覺得學校教育依據個人的能力，讓大家在公平機會的競爭下，被選擇和分配到各種社會階層上，使大家各司其職、發揮所長。

    薩諾斯：我不認為學校教育造成社會的階層化分工以及經濟收入差異，是由個人努力或能力所決定的。家庭階級背景更決定了個人受教育的機會和社會階層的分工。

    史塔克： 可是我覺得學校教育可以突破社會階層的界線，促成社會流動的現象，而消除社會不平等。

    薩諾斯： 但我認為學校教育都在灌輸資本主義中能力與收入相符合的概念，使勞工階級的社會大眾安於其位，所以我覺得學校教育無法改變社會既存的不平等現象。'
  options:
  - label: A
    content: 史塔克的觀點屬於結構功能論
  - label: B
    content: 史塔克的觀點屬於衝突論
  - label: C
    content: 薩諾斯的觀點屬於結構功能論
  - label: D
    content: 薩諾斯對學校教育的功能抱持比較正面的態度
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 史塔克的觀點為結構功能論，認為社會階層的存在有助於社會穩定；而薩諾斯的觀點為衝突論，因此對學校的教育功能採取負面的態度。故本題選(A)。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '下二表為 2022 年考剎國與河鴿國兩國依「五分位數法」將全國家庭依所得多寡排序後，再將全部戶數分為五等分的資料。請根據資料判斷下列何者敘述最為符合 2020 年兩國的社會現象？

    | ▼考剎國 |  |

    | --- | --- |

    | 家戶五等分位組 | 家戶年所得 |

    | 第一分位組（最低所得組） | 350,000 元 |

    | 第二分位組 | 520,000 元 |

    | 第三分位組 | 700,000 元 |

    | 第四分位組 | 980,000 元 |

    | 第五分位組（最高所得組） | 1,500,000 元 |

    | ▼河鴿國 |  |

    | --- | --- |

    | 家戶五等分位組 | 家戶年所得 |

    | 第一分位組（最低所得組） | 250,000 元 |

    | 第二分位組 | 470,000 元 |

    | 第三分位組 | 880,000 元 |

    | 第四分位組 | 1,000,000 元 |

    | 第五分位組（最高所得組） | 1,800,000 元 |'
  options:
  - label: A
    content: 考剎國最高 20 ％家庭所得組為最低 20 ％家庭組的 5.3 倍
  - label: B
    content: 考剎國的經濟不平等現象較河鴿國為嚴重
  - label: C
    content: 河鴿國最高 20 ％家庭所得組為最低 20 ％家庭組的 7.2 倍
  - label: D
    content: 河鴿國最高所得組與最低所得組的倍數較小，表示所得分配較平均
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應約為 4.3 倍。(B)考剎國的最高 20 ％家庭所得組為最低 20 ％家庭所得組是 4.3 倍，而河鴿國的最高 20 ％家庭所得組為最低 20 ％家庭所得組是 7.2 倍，因此應為河鴿國的經濟不平等現象較為嚴重。(D)應是考剎國的所得分配較為平均。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 2
  stem: 喵喵喵專題報導指出，在中國星巴克咖啡被視為一種時尚跟品味的象徵，其咖啡售價更是榮登全球最貴，以中杯拿鐵為例，美國一杯要價 98 元新臺幣，占一般民眾千分之一的月薪；而中國一杯則要價 130 元新臺幣，占一般民眾百分之一的月薪，但是星巴克還是生意興隆，不斷在中國擴展分店。請問依據上述報導可以作出什麼推論？
  options:
  - label: A
    content: 中國人民的文化資本在增加
  - label: B
    content: 中國的權力菁英人數多於美國
  - label: C
    content: 中國認為美國文化位階較高
  - label: D
    content: 中國人民間的貧富差距頗大
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文可看出星巴克象徵品味，而在中國一杯拿鐵占民眾百分之一的月薪，仍然生意興隆，顯示中國的貧富差距頗大，應選(D)。(A)(B)(C)無法從題文得知。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 「潤學」是一個源於中國的流行語，「潤」指的是逃跑、跑路—為了規避中共官方的敏感詞審查，網民使用與英文「run」同音。2022 年疫情中國封城及各種中國政府嚴格不許的影響下，許多人都想潤，然而大部分能順利的多半是有錢人。在相關富豪調查報告中指出，近半數的富豪其財富是來自繼承或是原本即擔任黨重要職位人士，都是「二代」、「三代」。起因為在經濟發展時期，第一代在傳統行業或重要職位上早就取得先機地位，因而致富，但近年經濟成長趨緩後，發達機會早已被占滿，極少數人是由於新興行業上，特別是 IT、網路等，獲得少有的發達機會。關於上述，請問下列何者敘述推論正確？
  options:
  - label: A
    content: 中國的第一代富豪多由資訊產業致富
  - label: B
    content: 中國的社會流動具有結構流動的特色
  - label: C
    content: 「二代」、「三代」屬於代間流動
  - label: D
    content: 階級複製使中國人不再可能白手起家
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)第一代致富是由於傳統行業或擔任重要職位，非來自資訊產業。(B)中國的結構流動現象較少，階級複製的現象較為嚴重。(C)二代、三代指的是不同世代間的位階流動，稱為代間流動，為正解。(D)白手起家仍有可能，只是可能性較低。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 據國際貨幣基金（IMF）2020 年公布數據顯示，臺灣以美元計價的人均 GDP 為 27,371 美元，排名 28；但若以購買力平價指數（PPP 指數）調整後計算的人均 GDP，卻高達 54,841 美元，不僅價差高出一倍，排名也晉升至第 10 名。請問產生此現象的原因為何？
  options:
  - label: A
    content: 臺幣的幣值被高估
  - label: B
    content: 臺灣的物價偏低
  - label: C
    content: 臺灣人口數較少
  - label: D
    content: 跨國間因幣值不同，無法做比較
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 購買力平價指數指的是物價調整後的情形，臺灣的人均 GDP 會提高，顯示出臺灣的物價較其他國家低，故選(B)。
- id: doc_112_台北_明倫_社會_公民與社會_選修公民與社會I_g12s1e1_s1_7
