  page: 1
  stem: 疫情結束，<u>小綠</u>再度恢復商務旅行模式往返<u>臺北</u>—<u>上海</u>兩地，已知<u>臺北</u>位在北緯 25° 東經 121°，<u>上海</u>位在北緯 31° 東經 121°。假設地球為一球體，半徑 6400 公里，已知航空公司會依據飛行距離作為哩程點數，乘客累積搭乘的哩程可做為日後的優惠點數，哩程點數是依英哩計算，1 英哩$\approx$1.6 公里，若<u>小綠</u>直飛（最短距離）往返<u>臺北</u>—<u>上海</u>一次，累積的哩程數最接近下列哪一個數？
  options:
  - label: A
    content: '360'
  - label: B
    content: '480'
  - label: C
    content: '600'
  - label: D
    content: '720'
  - label: E
    content: '840'
  answer:
