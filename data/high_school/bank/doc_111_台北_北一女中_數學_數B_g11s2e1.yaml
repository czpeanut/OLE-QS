  stem: 有關空間中的點、直線與平面之敘述，試選出所有正確的選項。
  options:
  - label: A
    content: 三相異直線 $L_{1}$、$L_{2}$、$L_{3}$，若 $L_{1}$、$L_{2}$ 皆與 $L_{3}$ 垂直，則直線 $L_{1}$、$L_{2}$ 平行
  - label: B
    content: 直線 $L_{1}$、$L_{2}$ 分別位於兩平行平面 $E_{1}$、$E_{2}$ 上，則 $L_{1}$ 平行 $L_{2}$
  - label: C
    content: 相異兩平面 E，F 交於一線 L，若 L 垂直一平面 G，則 E，F 均垂直於 G
  - label: D
    content: 若直線 L 交平面 E 於一點 P，且 L 不垂直 E，則平面 E 上恰有一直線過點 P 且與 L 垂直
  - label: E
    content: 若 A，B 為兩定點，則滿足 $\overline{PA}$＝$\overline{PB}$ 的所有動點 P 軌跡為一條直線
