  type: single
  page: 1
  stem: '假設地球是球體，球面上穿過球心到地球另一端的相對點互稱為對蹠點。若<u>小綠</u>目前位在北緯 25° 東經 121°，她想搭乘飛機到其對蹠點位置（南緯 25° 西經 59°），試比較下列三種飛行距離的大小。

    A：沿著東經 121° 線往南飛到赤道後，再沿著赤道往西飛到西經 59° 線，再往南飛到南緯 25° 線。

    B：沿著東經 121° 線往南飛到南緯 25° 線，再沿著南緯 25° 線往西飛到西經 59° 線。

    C：沿著東經 121° 線往南飛到南極，再沿著西經 59° 線往北飛到南緯 25° 線。'
  options:
  - label: A
    content: A＜B＜C
  - label: B
    content: B＜A＜C
  - label: C
    content: B＜C＜A
  - label: D
    content: C＜A＜B
  - label: E
    content: C＜B＜A
  answer:
