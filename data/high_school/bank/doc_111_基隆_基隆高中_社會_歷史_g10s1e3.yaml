  page: 1
  stem: 在臺灣的商業活動中，逐漸形成以大商人為中心，專事聚貨、採辦、分售的商業集團，這種商業集團一般由數十個或上百個商號組成，成為臺灣地區貿易商的組織──郊。有關這種郊的組織在臺灣的發展，下列敘述何者正確？
  options:
  - label: A
    content: 郊商除了貿易外，亦從事社會公益
  - label: B
    content: 當時郊商從事的是國際貿易
  - label: C
    content: 在郊商主導下，與日本、中國自由貿易
  - label: D
    content: 郊的名稱全以貿易地來命名
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)(C)郊商從事臺灣與大陸之間的兩岸貿易，而非國際貿易。(D)亦有以商品名稱命名者，如米郊、糖郊。
