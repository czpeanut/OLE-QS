- id: doc_111_基隆_基隆高中_社會_歷史_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 學校圖書館門口放著一疊展覽宣傳單，傳單封面有一份文件寫到：「據陳賴章稟稱，竊照臺灣荒地現奉憲行勸墾。章查上淡水大佳臘地方，有荒埔一所，東至雷厘、秀朗，西至八里坌、干豆外，南至興直山腳內，北至大浪泵溝，四至並無妨礙民番地界。現在招佃開墾，合情稟叩金批，准給單示，以便報墾陞科。」請問這場展覽的主題最可能是下列何者？
  options:
  - label: A
    content: 開墾文書特展
  - label: B
    content: 歷史上的臺灣地理大觀
  - label: C
    content: 郊商風華
  - label: D
    content: 「正港」的年代
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '文件為陳賴章墾號向諸羅縣官府申請土地開墾的墾照，因此(A)最符合主題。

    10.17 世紀後期，英國東印度公司與臺灣鄭氏政權有所往來並設有商館，當時的「臺灣國王」為(D)鄭經。

    11.(B)糖業改良乃為保護日本資本家利益，壓榨蔗農。(C)臺灣糖業由日本資本家壟斷，臺籍資本家難以介入。(D) 1920 年代以前尚未有「米糖相剋」問題。

    12.(C) 1905 年日本在臺灣推動第一次人口普查，調查內容如題幹所述之詳盡，使總督府更能掌控各項資訊與管理。

    13.(A)為清治後期開港後西洋傳入的建築。(B)日治時期的建築。(C)清治時期的建築，但多為民間所建。

    14.題幹所述為(C)後藤新平的「生物學統治原理」，其反對同化政策，為理解臺灣人而推行基礎調查工作，再擬定統治方針。

    15.(A)臺灣為殖民地，所有的建設與資源皆配合母國的需求而調整，非真正為了臺灣好。(C)所述雖為事實，但並不符合「國族」立場。(D)清治後期已開始推動臺灣的近代化建設。

    16.1930 年代中期，日本開始推行南進政策，經過臺北帝國大學及熱帶產業調查會等的研究與調查後，決定將經濟發展政策轉為「工業臺灣，農業南洋」，臺灣也因應日本對外擴張而逐步進入軍需工業時代，答案選(A)。(B) 1941 年。(C) 1919 年後興起。(D) 1919 年。

    17.兩則資料說明總督府在臺灣實施全面性的經濟統制，尤其資料二發展以煉鋁為重點的重工業，可推知應為戰爭時期的經濟政策，故答案為(C)。(A)「米糖相剋」是因稻米獲利高，農民轉作稻米，使米增糖減，此與資料一中的「米穀不足」不符。(B)煉鋁、化學、水泥等為軍需相關的重工業，非民生工業。(D)日本剛接收臺灣時，並未發生資料一的情形。

