  stem: 劉銘傳在一份奏摺裡說：「全臺物產，餉源所繫，實以茶、鹽、樟腦為大宗。鹽釐（金）各局，臺北較多。臺南，陸路則阻大溪，水程則須大海；公牘往返，動逾旬時，自係鞭長莫及。」請問下列相關敘述，何者為是？
  options:
  - label: A
    content: 全臺物產之大宗應為茶、糖、樟腦
  - label: B
    content: 反映出劉銘傳已將臺灣省會設於臺北府
  - label: C
    content: 臺南因淤積水淺，不適合開港通商
  - label: D
    content: 反映經濟重心逐漸北移，臺北漸成經濟、政治中心
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)奏摺裡提到的全臺物產之大宗為茶、鹽、樟腦。(B)劉銘傳將省會設於中部，臺北府為臨時省會，故政府機關多集中在此。(C)奏摺裡未提及。
