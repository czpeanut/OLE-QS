  stem: 張達京曉番語，識番情，值疫癘流行，乃以醫術行於其間，活人無數。土官阿莫稱其才德，以女妻之，人稱「番駙馬」。雍正元年（1723）任岸裡五社總通事。自是力田起家，擁資巨萬。旋與土官潘敦仔訂立墾約，以開墾今葫蘆墩之野。雍正十年十一月立「張振萬」墾號，邀同秦登鑑、姚德心、廖朝孔、江又金、陳周文等組為六館業戶，而以張振萬為首，與岸裡等四社土官商議，由六館業戶備出工本，募工開築樸仔籬口大埤之水圳，分與四社灌溉，換取東南勢之旱埔地，招佃開墾。圳成，引大甲溪水，遍溉岸裡等社，凡千餘甲，家乃愈富。上文的標題為何最為貼切？
  options:
  - label: A
    content: 六館業戶潘敦仔的奮鬥人生
  - label: B
    content: 割地換水的番駙馬
  - label: C
    content: 官民合作的金廣福公館
  - label: D
    content: 清治土地開墾與八堡圳
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹所述為張達京與六館業戶開墾臺中盆地，並與岸裡社等原住民合作開鑿貓霧捒圳的經過，因此(B)標題最為適切。
