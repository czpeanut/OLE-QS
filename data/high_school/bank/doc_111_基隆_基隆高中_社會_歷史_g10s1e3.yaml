- id: doc_111_基隆_基隆高中_社會_歷史_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 偌閔在一本書中讀到：「樟腦本來在民間只是一種藥方，後來因為無煙火藥、賽璐珞的市場看好，這些產品的原料樟腦因此需求遽增，使得這項製造業興盛起來。在 1880 年代，整個地球上有一半的樟腦都產自臺灣。」他對樟腦產業這項不可思議的成就產生好奇，向班上同學詢問樟腦在臺灣的發展，請問何者的回答比較恰當？
  options:
  - label: A
    content: 世柏：樟腦不只外銷，也改變臺灣島內的社會結構，有些家族如霧峰林家便因此躍升為臺灣重要的大家族
  - label: B
    content: 東二：不只外銷哦，樟腦還透過郊商大量賣到中國內地，成為清朝自強運動工業發展的重要原料
  - label: C
    content: 直哉：因為清代「正口」對渡制度的影響，樟腦若要銷往中國，必須從北部八里坌出口，銷往海峽對岸的五虎門、蚶江等指定口岸
  - label: D
    content: 晉騰：樟腦產於臺灣崇山峻嶺，因設有漢番界線，漢人完全無法進入開墾
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)中國自強運動拓展樟腦產業以外銷，並非發展相關工業。(C)臺灣開港通商後，兩岸港埠互通便利，對渡限制已無意義。(D)漢人經常越界開墾，使原漢衝突再度升溫。
