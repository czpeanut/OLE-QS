- id: doc_111_基隆_基隆高中_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 清時有一政策內容如下：「自光緒十四年起，按照上年所收額租，作為十成，以四成貼與小租戶完糧，實收六成即向小租戶收完，仍令小租戶轉向佃人，將大、小各租一併全收，以昭公允。惟丈單、錢糧俱歸小租戶經手，大租戶無可執憑，將來時遠年湮，恐無稽考，易啟爭端，仍准大租戶隨時照章開明田糧租額，報縣立案，由官核明，另給印單為憑，以昭信守」，關於此政策的敘述，下列何者正確？
  options:
  - label: A
    content: 政府清查土地後的丈單由大租戶留存以為憑證
  - label: B
    content: 由於實施不公，引發中部小租戶施九緞聚眾抗官
  - label: C
    content: 實施後大租戶無田租，僅名義上擁有土地所有權
  - label: D
    content: 該項政策推動後，政府改向小租戶收取所有田租
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由文中「（額租）以四成貼與小租戶完糧，實收六成即向小租戶收完……丈單、錢糧俱歸小租戶經手，大租戶無可執憑」的說明，可推知此為劉銘傳所推行的「減四留六」政策，(D)為正解。(A)文中已提到丈單歸小租戶經手，大租戶無可執憑。(B)由於土地清丈不公，引起大租戶施九緞等人抗官。(C)名義上的土地所有權也歸小租戶。
