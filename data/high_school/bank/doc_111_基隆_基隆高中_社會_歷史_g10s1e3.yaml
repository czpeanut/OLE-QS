    20.(B)清治前期，臺灣僅能與中國大陸進行區域分工經濟，出口本地的米、糖等農產品，再進口民生手工業用品等。

    21.作者的感言提到美洲原住民的處境，也回應了其居住部落的苦難歷史，推測這位作者的作品應是關注原住民部落生活的困境，(A)為正解。

