  group_stem: '以下是臺灣歷史上文學界立場不同之兩派人士的論點，請分析兩派之爭議，並回答下列問題：

    甲方：工農兵的生活應該關懷，工農兵的形象應該描繪，然則社會百業，何以獨舉工農兵而排其他？工農兵文藝工作者拋給國內廣大作家的帽子，「奴性」、「優越感」、「崇洋媚外」、「殖民地文學」，凡不適合廣大群眾鬥爭要求的藝術，每位作家都分到一頂。

    乙方：鄉土文學的書寫對象，不應只有所謂的農村文學，也應該包括描寫都市生活為主的社會寫實文學，建議以寫實主義文學的稱謂來取代鄉土文學這個標誌。'
  answer:
