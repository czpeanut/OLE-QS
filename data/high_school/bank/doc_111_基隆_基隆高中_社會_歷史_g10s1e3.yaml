  stem: 某時期的臺商在中國大陸出售商品之後，以部分獲利購買絲綢、布疋等較輕且不占船艙的物品運回臺灣。為了確保航行安全，有時也會裝載磚瓦、石料等建材，讓帆船吃水較深，以增加船隻的穩定度。某時期是
