    23.1951 年推行的「公地放領」政策，係將政府官有的「公地」放領給農民耕作，當時國民政府所擁有的土地，主要係自日人產業接收而來，答案為(D)。

    24.1953 年的「耕者有其田」規定地主僅能持有六甲旱田或三甲水田，多餘的土地必須釋出，政府以 70 ％實物債券及 30 ％四大公營事業股票補償地主，使少數地主轉而投資工業，故答案選(D)。

    25.(D)臺灣於 2002 年才加入 WTO，因此此選項並非戰後經濟發展卓然有成的因素。

    26.1970 年代爆發石油危機，造成全球經濟不景氣，臺灣又遭逢退出聯合國、與美國斷交等外交困境，使民間投資意願低落，出口大幅銳減，答案選(C)。

    27.越戰的時間主要在 1960 年代，此時臺灣經濟發展正值(B)出口擴張階段，加上《中美共同防禦條約》的協議，臺灣成為美軍的重要補給站。

    28.發展高科技、高附加價值的產業，興建科學工業園區，此為 1980 年代產業升級與國際化、自由化階段的重要措施，答案選(D)。

    29.美援的時間為 1951 ～ 1965 年，因此其能促進民營企業的發展成果，應為(B)第一次進口替代時期，臺灣曾借助美援發展本土民生工業。

