- id: doc_113_新北_新北高中_自然_物理_選修物理III_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 如圖4所示的長直光纖，柱芯為玻璃，外層以折射率較玻璃為低的介質包覆。若光線自光纖左端進入，與中心軸的夾角為θ，則下列有關此光線傳遞方式的敘述，何者正確？
  options:
  - label: A
    content: 不論θ為何，光線都不會發生全反射
  - label: B
    content: 不論θ為何，光線都會發生全反射
  - label: C
    content: θ夠小時，光線才會發生全反射
  - label: D
    content: θ夠大時，光線才會發生全反射
  group_stem: 波由波速較慢的介質，入射到波速較快的介質中時，一般都會因折射而偏向，使得折射角大於入射角；當入射角超過一臨界角時，甚至會產生「全反射」，使光線全部反射回到波速較慢的介質中。就光波而言，波速愈快的介質，其折射率愈小。 能使波沿著特定通道傳遞的裝置稱為「波導」，例如光纖。光纖常為細長圓柱體，其各層介質的折射率n（r）隨著離中心軸的距離r變大而遞減，如圖1所示，故外層介質的折射率$n_{2}$大於空氣折射率$n_{o}$，但小於柱芯折射率n（r）。光線由光纖左端進入後，由於連續的折射，會如圖2所示在光纖中心軸附近沿著來回彎曲的路線，向右前進。 在海中，聲速會隨海水深度而變，因此聲音在特定的海水深度範圍內，可藉由折射而不停的改變方向，沿著水平方向前進（類似圖2中的光線沿著光纖中心軸來回彎曲，迂迴前進），形成波導，使海中的聲音可以傳得很遠，此波導稱為「深海聲波道」。 在空氣中，聲速只與空氣溫度有關，但在海水中，聲遠主要由溫度與壓力決定，溫度愈高或壓力愈大，聲速就愈快。在深度超過1 km的深海區，海水溫度幾乎不隨深度而變，故聲速只與壓力有關。圖3為海中聲速與深度的關係圖。
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_113_新北_新北高中_自然_物理_選修物理III_g12s1e2/s1_3_f1.png
