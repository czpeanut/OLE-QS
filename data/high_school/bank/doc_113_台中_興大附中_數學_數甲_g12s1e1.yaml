  answer_source: answer_key
  explanation: '設$\overline{AB}$＝$a_{1}$，則$\overline{A_{1}B}$＝$\frac{1}{4}a_{1}$，$\overline{BB_{1}}$＝$\frac{3}{4}a_{1}$

    故$\overline{A_{1}B_{1}}^{2}$＝$\left( \frac{1}{4}a_{1} \right) ^{2}+ \left( \frac{3}{4}a_{1} \right) ^{2}- 2\times \frac{1}{4}a_{1}\times \frac{3}{4}a_{1}\times \cos 60^{^{\circ}}$

    ＝$\frac{7}{16}a_{1}^{2}$

    $\Rightarrow$△ABC 面積為$\frac{\sqrt{3}}{4}a_{1}^{2}$，△$A_{1}B_{1}C_{1}$ 面積為$\frac{\sqrt{3}}{4}\times \frac{7}{16}\times a_{1}^{2}$，……

    可知△$A_{1}B_{1}C_{1}$ 面積＝$\frac{7}{16}\triangle ABC 面積$

    故總和為$\frac{\frac{\sqrt{3}}{4}a_{1}^{2}}{1 -\frac{7}{16}}$＝$100\sqrt{3}$

    $\Rightarrowa_{1}$＝15'
