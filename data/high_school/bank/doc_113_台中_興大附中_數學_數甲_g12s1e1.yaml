- id: doc_113_台中_興大附中_數學_數甲_g12s1e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 2
  stem: 設函數 f（x）＝$\begin{cases}x^{2}+ 3x +a , x\geq 1 \\ bx + 1 , x < 1\end{cases}$在 x＝1 處連續且可微分，則數對（a，b）＝＿＿＿＿。
  answer:
  - （2，5）
  answer_status: verified
  answer_source: answer_key
  explanation: '由 f（x）在 x＝1 連續可知

    1＋3＋a＝b＋1$\Rightarrow$a＝b－3

    由 f（x）在 x＝1 可微分可知

    $\lim_{x \rightarrow 1^{+}} \frac{f ( x )-f ( 1 )}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{f ( x )-f ( 1 )}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{+}} \frac{( x^{2}+ 3x +a )-( a + 4 )}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{( bx + 1 )-( a + 4 )}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{+}} \frac{x^{2}+ 3x - 4}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{bx -a - 3}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{bx - b}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{+}} \frac{( x - 1 ) ( x + 4 )}{x - 1}$＝$\lim_{x \rightarrow 1^{-}} \frac{b ( x - 1 )}{x - 1}$

    $\Rightarrow\lim_{x \rightarrow 1^{+}} ( x + 4 )$＝$\lim_{x \rightarrow 1^{-}} b$

    $\Rightarrow$5＝b，代回得 a＝2

    故數對（a，b）＝（2，5）'
