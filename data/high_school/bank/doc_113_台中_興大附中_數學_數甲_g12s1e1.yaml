- id: doc_113_台中_興大附中_數學_數甲_g12s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 請問下列哪些極限存在？（其中 [ x ] 表示高斯函數）
  options:
  - label: A
    content: $\lim_{x \rightarrow 0} x \sin \frac{1}{x}$
  - label: B
    content: $\lim_{x \rightarrow 0} x^{2} \cos \frac{1}{x^{2}}$
  - label: C
    content: $\lim_{n \rightarrow 0} ( 1 +n )^{\frac{1}{n}}$
  - label: D
    content: $\lim_{x \rightarrow 3} ( x - [ x ] )$
  - label: E
    content: $\lim_{x \rightarrow 3} [ x - [ x ] ]$
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵$-| x |\leq x \sin \frac{1}{x}\leq | x |$，且$\lim_{x \rightarrow 0} ( -| x | )$＝$\lim_{x \rightarrow 0} | x |$＝0

    ∴由夾擠定理可知$\lim_{x \rightarrow 0} x \sin \frac{1}{x}$＝0

    (B)○：∵$-x^{2}\leq x^{2}\cos \frac{1}{x^{2}}\leq x^{2}$，且$\lim_{x \rightarrow 0} ( -x^{2} )$＝$\lim_{x \rightarrow 0} x^{2}$＝0

    ∴由夾擠定理可知$\lim_{x \rightarrow 0} x^{2}\cos \frac{1}{x^{2}}$＝0

    (C)○：令 t＝$\frac{1}{n}$，則

    $\lim_{n \rightarrow 0} ( 1 +n )^{\frac{1}{n}}$＝$\lim_{t \rightarrow \infty} \left( 1 +\frac{1}{t} \right) ^{t}$＝e，極限存在

    (D)╳：∵$\lim_{x \rightarrow 3^{+}} ( x - [ x ] )$＝0，$\lim_{x \rightarrow 3^{-}} ( x - [ x ] )$＝1

    ∴$\lim_{x \rightarrow 3} ( x - [ x ] )$不存在

    (E)○：∵$\lim_{x \rightarrow 3^{+}} [ x - [ x ] ]$＝0，$\lim_{x \rightarrow 3^{-}} [ x - [ x ] ]$＝0

    ∴$\lim_{x \rightarrow 3} [ x - [ x ] ]$＝0

    故選(A)(B)(C)(E)'
