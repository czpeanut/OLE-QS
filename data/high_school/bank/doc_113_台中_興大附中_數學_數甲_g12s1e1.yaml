- id: doc_113_台中_興大附中_數學_數甲_g12s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 有一無窮等比級數和之收斂值為正數 S，且第二項為 2，則 S 的最小值為何？
  options:
  - label: A
    content: $\sqrt{17}$
  - label: B
    content: $\frac{1 + \sqrt{17}}{2}$
  - label: C
    content: '8'
  - label: D
    content: '6'
  - label: E
    content: '4'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '設首項 $a_{1}$，公比 r，－1＜r＜1，r≠0

    則$\begin{cases}a_{2}=a_{1}r = 2 \\ S =\frac{a_{1}}{1 -r}\end{cases}$

    將 $a_{1}$＝$\frac{2}{r}$代入得 S＝$\frac{\frac{2}{r}}{1 -r}$＝$\frac{2}{-r^{2}+r}$＝$\frac{2}{- \left( r^{2}-r +\frac{1}{4} \right) +\frac{1}{4}}$＝$\frac{2}{- \left( r -\frac{1}{2} \right) ^{2}+\frac{1}{4}}$

    當 r＝$\frac{1}{2}$時，S＝$\frac{2}{\frac{1}{4}}$＝8 為最小正數值

    故選(C)'
