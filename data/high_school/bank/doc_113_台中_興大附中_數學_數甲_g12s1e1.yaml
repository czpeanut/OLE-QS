- id: doc_113_台中_興大附中_數學_數甲_g12s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 請問下列哪些選項正確？
  options:
  - label: A
    content: 無窮數列$\left\langle \frac{( -1 )^{n} \cdot 100}{n} \right\rangle$為收斂數列
  - label: B
    content: 若無窮數列〈$a_{n}$〉及〈$b_{n}$〉均為收斂數列，且對於任意正整數 n 皆滿足 $a_{n}$＜$b_{n}$，則$\lim_{n \rightarrow \infty} a_{n} < \lim_{n \rightarrow \infty} b_{n}$
  - label: C
    content: 若無窮數列〈$a_{n}$〉及〈$b_{n}$〉均為發散數列，則數列〈$a_{n}$×$b_{n}$〉必為發散
  - label: D
    content: 若無窮數列〈$a_{n}$〉收斂但〈$b_{n}$〉發散，則數列〈$a_{n}$－$b_{n}$〉必為發散
  - label: E
    content: 對於任意正整數 n，如果 0 ≤ $a_{n}$ ≤ $b_{n}$，且$\sum_{n =1}^{\infty} b_{n}$發散，則$\sum_{n =1}^{\infty} a_{n}$也發散
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：當 n →∞，$\frac{( -1 )^{n} \cdot 100}{n}$→ 0

    故$\left\langle \frac{( -1 )^{n} \cdot 100}{n} \right\rangle$為收斂數列

    (B)╳：不一定，反例：$a_{n}$＝$1 -\frac{1}{n}$，$b_{n}$＝$1 -\frac{1}{2n}$，

    則對於任意正整數 n 皆滿足 $a_{n}$＜$b_{n}$

    但$\lim_{n \rightarrow \infty} a_{n}$＝$\lim_{n \rightarrow \infty} b_{n}$＝1

    (C)╳：不一定，反例：$a_{n}$＝（－1）$^{n}$，$b_{n}$＝（－1）$^{n}$，

    則〈$a_{n}$〉，〈$b_{n}$〉皆為發散數列

    但對於任意正整數 n 皆滿足 $a_{n}$×$b_{n}$＝1

    故數列〈$a_{n}$．$b_{n}$〉為收斂

    (D)○：若〈$a_{n}$－$b_{n}$〉收斂

    則〈$b_{n}$〉＝〈$a_{n}$－（$a_{n}$－$b_{n}$）〉亦收斂，矛盾

    故數列〈$a_{n}$－$b_{n}$〉必為發散

    (E)╳：不一定，反例：對於任意正整數 n 皆滿足 $a_{n}$＝$\frac{1}{2^{n}}$，$b_{n}$＝n

    則 0 ≤ $a_{n}$ ≤ $b_{n}$ 且$\sum_{n =1}^{\infty} b_{n}$發散

    但$\sum_{n =1}^{\infty} a_{n}$＝$\frac{\frac{1}{2}}{1 -\frac{1}{2}}$＝1 收斂

    故選(A)(D)'
