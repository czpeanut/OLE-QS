  stem: 試求$\lim_{x \rightarrow 5} \frac{( x - 6 )^{50}- 1}{x - 5}$＝？
  options:
  - label: A
    content: '100'
  - label: B
    content: －100
  - label: C
    content: '50'
  - label: D
    content: －50
  - label: E
    content: '1'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow 5} \frac{( x - 6 )^{50}- 1}{x - 5}$

    ＝$\lim_{x \rightarrow 5} \frac{( x - 5 - 1 )^{50}- 1}{x - 5}$

    ＝$\lim_{x \rightarrow 5} \frac{C_{0}^{50} ( x - 5 )^{50}-C_{1}^{50} ( x - 5 )^{49}+\ldots \ldots -C_{49}^{50} ( x-5 )^{1}+C_{50}^{50} \cdot 1 - 1}{x - 5}$

    ＝$\lim_{x \rightarrow 5} ( C_{0}^{50} ( x - 5 )^{49}-C_{1}^{50} ( x - 5 )^{48}+\ldots \ldots +C_{48}^{50} ( x-5 )^{1}-C_{49}^{50} )$

    ＝$-C_{49}^{50}$＝－50

    故選(D)'
