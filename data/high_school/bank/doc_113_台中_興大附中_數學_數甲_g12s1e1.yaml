  stem: 設有一正三角形△ABC，依序將三邊以 3：1 分段，再連接各分點得正三角形△$A_{1}B_{1}C_{1}$；再將新做出的△$A_{1}B_{1}C_{1}$ 三邊按順序以 3：1 分段，連接各分點得正三角形△$A_{2}B_{2}C_{2}$；……，依此規則做出無窮多個正三角形。若所有正三角形△ABC，△$A_{1}B_{1}C_{1}$，△$A_{2}B_{2}C_{2}$，……的面積和為 $100\sqrt{3}$，則正三角形△ABC 之邊長為＿＿＿＿。
  answer:
