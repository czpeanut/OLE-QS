    content: '3'
  - label: B
    content: '2'
  - label: C
    content: '1'
  - label: D
    content: '0'
  - label: E
    content: 不存在
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x \rightarrow \infty} ( \sqrt{4x^{2}+ 12x} - 2x )$＝$\lim_{x \rightarrow \infty} ( \sqrt{4x^{2}+ 12x} - 2x )\times \frac{\sqrt{4x^{2}+ 12x} + 2x}{\sqrt{4x^{2}+ 12x} + 2x}$

    ＝$\lim_{x \rightarrow \infty} \frac{4x^{2}+ 12x - 4x^{2}}{\sqrt{4x^{2}+ 12x} + 2x}$＝$\lim_{x \rightarrow \infty} \frac{12x}{\sqrt{4x^{2}+ 12x} + 2x}$

    ＝$\frac{12}{2 + 2}$＝3

    故選(A)'
