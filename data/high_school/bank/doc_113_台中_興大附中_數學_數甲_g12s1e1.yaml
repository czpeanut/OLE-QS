  stem: 設 f（x）為一多項式，且$\lim_{x \rightarrow \infty} \frac{f ( x )- 3x^{3}}{x^{2}+x - 6}$＝1，$\lim_{x \rightarrow 2} \frac{f ( x )}{x^{2}+x - 6}$＝6，求$\lim_{x \rightarrow 1} f ( x )$＝＿＿＿＿。
  answer:
  - －14
  answer_status: verified
  answer_source: answer_key
  explanation: '由$\lim_{x \rightarrow \infty} \frac{f ( x )- 3x^{3}}{x^{2}+x - 6}$＝1 可知 f（x）＝$3x^{3}$＋$x^{2}$＋ax＋b

    又$\lim_{x \rightarrow 2} \frac{f ( x )}{x^{2}+x - 6}$＝$\lim_{x \rightarrow 2} \frac{f ( x )}{( x - 2 ) ( x + 3 )}$極限存在

    可知 f(2)＝0

    $\Rightarrow$24＋4＋2a＋b＝0

    $\Rightarrow$2a＋b＝－28

    b＝－28－2a 代入得 f（x）＝$3x^{3}$＋$x^{2}$＋ax－2a－28＝（x－2）（$3x^{2}$＋7x＋（a＋14））

    6＝$\lim_{x \rightarrow 2} \frac{f ( x )}{( x - 2 ) ( x + 3 )}$

    ＝$\lim_{x \rightarrow 2} \frac{( x - 2 ) ( 3x^{2}+ 7x +( a + 14 ) )}{( x - 2 ) ( x + 3 )}$＝$\lim_{x \rightarrow 2} \frac{3x^{2}+ 7x +a + 14}{x + 3}$＝$\frac{12 + 14 +a + 14}{5}$＝$\frac{a + 40}{5}$

    $\Rightarrow$a＋40＝30$\Rightarrow$a＝－10，代回得 b＝－8

    故$\lim_{x \rightarrow 1} f ( x )$＝$\lim_{x \rightarrow 1} ( 3x^{3}+x^{2}- 10x - 8 )$＝3＋1－10－8＝－14'
