- id: doc_112_彰化_員林_自然_化學_g10s1e2_s3_30
  section: 3
  number: 30
  type: single
  page: 5
  stem: 溫室效應是全球暖化的主要原因之一，大氣中能夠吸熱的氣體稱為溫室氣體，尤其是碳化合物，如二氧化碳、甲烷等，不但吸熱效率高而且也因人類活動而持續攀升中。大氣中的二氧化碳有多種來源，包括：化石燃料的燃燒、碳酸鹽受熱、動植物的呼吸作用、酵母菌發酵以及火山爆發等。極地環境對於暖化極為敏感，因為只要溫度稍高於冰點，水就從固相轉變為液相，整個極地環境賴以維繫的冰與凍土，就開始瓦解。封存於冰與凍土中大量的碳，也將會以二氧化碳或甲烷等溫室氣體形式大量釋出；此外，有機物如長毛象等動植物遺體，不僅因升溫而露出或解凍，亦將被微生物分解而釋放出大量溫室氣體。極地因暖化解凍釋出的溫室氣體，雖不在早期溫室效應危害的預估之中，但因其量大而且是個惡性循環，大大的增強了溫室效應對全球環境的危害程度與速率。下列哪些反應是大氣中產生二氧化碳的主要化學反應？
  options:
  - label: A
    content: $CaCO_{3}$(s) → CaO(s)＋$CO_{2}$(g)
  - label: B
