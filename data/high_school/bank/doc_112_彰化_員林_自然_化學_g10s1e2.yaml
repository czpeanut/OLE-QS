  stem: 已知蔗糖加水分解後會得到果糖和葡萄糖；葡萄糖經過酒精發酵後可得到乙醇和二氧化碳。今取蔗糖 1.71 克，溶於水後，加酵母使其發酵。假設只考慮蔗糖變為酒精的發酵，且蔗糖的發酵只完成 50％，則在此發酵過程中，所產生的二氧化碳在標準狀態下總共有幾毫升？（原子量：C＝12，H＝1，O＝16；標準狀態下，1 莫耳氣體體積為 22.4 升）
