  stem: '下列物質與用途的配對，有幾項是<u>錯誤的</u>？

    ①青黴素—抗生素；②氫氧化鋁—長效型胃藥；③乙醯胺基酚—止痛消炎劑；

    ④氧化鎂—速效型胃藥；⑤阿斯匹靈—止痛消炎劑；⑥長鏈烷基苯磺酸鈉—天然清潔劑。'
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '①青黴素—抗生素； 正確。

    ②氫氧化鋁—長效型胃藥； 正確。

    ③乙醯胺基酚—止痛消炎劑； 正確。

    ④氧化鎂—速效型胃藥； 錯誤，應為長效型胃藥。

