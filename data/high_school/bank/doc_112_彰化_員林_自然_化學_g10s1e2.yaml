  stem: 某生想利用右圖的燃燒分析實驗裝置，推導出某一僅含碳、氫、氧三種元素化合物的實驗式。實驗中利用丙、丁兩支吸收管，其中一支填充過氯酸鎂，另一支填充氫氧化鈉。稱量兩支吸收管燃燒前後重量差，即可分別算出生成的水及二氧化碳重量，進而求出各元素之重量百分率，最後求得實驗式。為了使未知化合物燃燒完全，通常需使用氧化銅。下列針對右圖的實驗裝置中甲、乙、丙及丁處所應放置的物質及其功用的敘述，哪些正確？
