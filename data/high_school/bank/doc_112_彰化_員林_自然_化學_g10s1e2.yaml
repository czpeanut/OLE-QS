  type: single
  page: 1
  stem: 從路易斯電子點式或路易斯結構中均可發現 H、$NH_{2}$、$CH_{3}$、OH 等粒子，都帶有單電子；利用共價鍵鍵結原理，預測在上述每一種粒子各有若干的情況下，可組成幾種穩定的結構？
  options:
  - label: A
    content: '6'
  - label: B
    content: '7'
  - label: C
    content: '8'
  - label: D
    content: '9'
  - label: E
    content: '10'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '以 A、B、C、D 分別表示 ‧H、‧$NH_{2}$、‧$CH_{3}$、‧OH 等含有 1 個未成對電子的自由基，利用共價鍵鍵結原理，可知當兩個帶有未成對電子的粒子靠近，共用價電子便可形成共價鍵、放出能量、形成穩定的結構。所以可能形成的穩定結構有：

    同種粒子結合：A－A、B－B、C－C、D－D

    異種粒子結合：A－B、A－C、A－D、B－C、B－D、C－D

    共有 10 種。'
