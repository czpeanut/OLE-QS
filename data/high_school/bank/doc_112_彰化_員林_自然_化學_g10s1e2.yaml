- id: doc_112_彰化_員林_自然_化學_g10s1e2_s2_17
  section: 2
  number: 17
  type: multiple
  page: 3
  stem: 陳老師在化學計量的單元，談到莫耳時，有學生問陳老師：「在網上看到『莫耳日』，那是什麼？」陳老師說：「莫耳日是一個流傳於北美化學家當中的非正式節日，通常在每年的 10 月 23 日上午六時零二分到下午六時零二分之間慶祝這個節日」。課後有五位學生（A～E），對此莫耳日以及與莫耳相關的資訊甚感興趣，討論了一番。試問哪些學生說的話正確？
  options:
  - label: A
    content: 莫耳日是紀念北美一位偉大的華裔化學家莫耳（Mole）而設立的
  - label: B
    content: 莫耳是表示計數的一種單位，與 1「打」原子筆的「打」之概念相同
  - label: C
    content: 於 10 月 23 日的 6 時 02 分慶祝莫耳日，是與亞佛加厥數有關
  - label: D
    content: 亞佛加厥數定義了國際單位制基本單位之一的莫耳
  - label: E
    content: 1 莫耳物質中所含電子的總數等於亞佛加厥數
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)錯誤；莫耳 mole 為數量的單位。

    (C)正確；具有亞佛加厥數（$N_{A}$）個粒子為 1 莫耳，亞佛加厥數 $N_{A}$≒6.02×$10^{23}$，即 1 莫耳的粒子數約為 6.02×$10^{23}$。

    (D)正確；國際單位制基本單位（SI 基本單位）有長度、質量、時間、電流、絕對溫度、莫耳、光強度。

    (E)錯誤；1 莫耳單電子粒子（如 $_{1}$H、$_{2}He^{＋}$、……）中所含電子的總數等於亞佛加厥數，1 莫耳多電子粒子（如 $H_{2}$、$H_{2}$O、……）中所含電子的總數會大於亞佛加厥數。'
