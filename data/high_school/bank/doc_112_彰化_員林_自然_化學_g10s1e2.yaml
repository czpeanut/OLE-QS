questions:
- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列有關氯化鈉晶體的敘述，何者正確？
  options:
  - label: A
    content: NaCl 分子是氯化鈉晶體的最小單位
  - label: B
    content: 晶體中 $Na^{＋}$ 與 $Cl^{－}$ 的電子數，恰好一樣多
  - label: C
    content: 晶體中的 $Na^{＋}$ 與 $Cl^{－}$ 均擁有惰性氣體原子的電子數目
  - label: D
    content: 氯化鈉晶體中異電荷離子的靜電引力恰等於同電荷離子的靜電斥力，故十分穩定
  - label: E
    content: 氯化鈉晶體以 $Na^{＋}$ 或 $Cl^{－}$ 為中心的單元結構中，應該會有不同的密度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)錯誤；氯化鈉是離子晶體，不存在 NaCl 分子，NaCl 晶體中最小單位為 $Na^{＋}Cl^{－}$ 離子對。

    (B)錯誤；$_{11}Na^{＋}$ 電子排法 (2,8) 與 $_{10}$Ne 有相同電子數；$_{17}Cl^{－}$ 電子排法 (2,8,8) 與 $_{18}$Ar 有相同電子數。

    (D)錯誤；氯化鈉晶體中 $Na^{＋}$ 與 $Cl^{－}$ 交錯排列堆積，所以異性電荷相距較近，引力較大，而同性電荷相距較遠，斥力較小。

    (E)錯誤；因為氯化鈉晶體是 $Na^{＋}$ 與 $Cl^{－}$ 交錯排列堆積，形成巨大的延伸結構，所以無論以 $Na^{＋}$ 或 $Cl^{－}$ 為中心的單元結構中，都具有相同的密度。'
- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關 $H_{2}$O、$CO_{2}$、$SiO_{2}$、MgO、Ca、Si、$Br_{2}$ 等 7 種物質，其在常溫、常壓下的性質與構造的敘述，何者正確？
  options:
  - label: A
    content: 有 1 個物質為液體
  - label: B
    content: 有 2 個物質為氣體
  - label: C
    content: 有 3 個物質為固體
  - label: D
    content: 有 2 個物質為網狀固體
  - label: E
    content: 有 5 個分子固體
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '常溫 25 ℃、常壓 1 atm 下

    (A)錯誤；液體有 $H_{2}$O、$Br_{2}$。

    (B)錯誤；氣體有 $CO_{2}$。

    (C)錯誤；固體有 $SiO_{2}$、MgO、Ca、Si。

    (D)正確；網狀固體有 $SiO_{2}$、Si。

    (E)錯誤；沒有分子固體。'
- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 右圖是殺蟲劑芬普尼的結構，其中六員環、五員環的折點為 C，H 原子未畫出，請問共有幾對孤對電子？
  options:
  - label: A
    content: '29'
  - label: B
    content: '30'
  - label: C
    content: '31'
  - label: D
    content: '32'
  - label: E
    content: '33'
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_112_彰化_員林_自然_化學_g10s1e2/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 444.75
      - 346.8
      - 563.9
      - 438.6
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '依共價鍵結原理、八隅體法則：

    4A 族原子的鍵結，無孤對電子；5A 族原子的鍵結，1 對孤對電子；6A 族原子的鍵結，2 對孤對電子；7A 族原子的鍵結：3 對孤對電子；若鍵結原子符合八隅體法則，則無孤對電子。

    殺蟲劑芬普尼的分子結構中，共有 8 個 7A 族原子（6 個 F、2 個 Cl）、2 個 6A 族原子（1 個 O、1 個 S，S 原子已滿足八隅體）、4 個 5A 族的 N 原子，所以孤電子對共有：8×3＋1×2＋4×1＝30（對）'
- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 超導體為具有零電阻及反磁性的物質，以 $Y_{2}O_{3}$、$BaCO_{3}$ 及 CuO 為原料，經研磨燒結可合成一高溫超導物質 $YBa_{2}Cu_{3}O_{x}$。現欲合成 0.50 莫耳此高溫超導物，依化學劑量比例，需取 $Y_{2}O_{3}$、$BaCO_{3}$ 及 CuO 的莫耳數分別為：
  options:
  - label: A
    content: 0.25，1.0，1.5
  - label: B
    content: 0.25，0.50，1.5
  - label: C
    content: 0.50，1.0，1.5
  - label: D
    content: 1.0，0.25，0.17
  - label: E
    content: 0.50，0.50，0.50
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '假設原料 $Y_{2}O_{3}$、$BaCO_{3}$ 及 CuO 各有 a、b、c 莫耳反應生成 0.50 莫耳之高溫超導物 $YBa_{2}Cu_{3}O_{x}$，依原子不滅：

    Y 原子：2×a＝0.5×1，a＝0.25

    Ba 原子：1×b＝0.5×2，b＝1.0

    Cu 原子： 1×c＝0.5×3，c＝1.5'
- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_5
  section: 1
