- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '麩胺酸與氫氧化鈉反應，可得麩胺酸鈉（味精）。工業上係利用微生物將醣類轉換成麩胺酸，其反應式如下：

    $C_{12}H_{22}O_{11}$＋$3O_{2}$＋$2NH_{3}$ → 2CH($NH_{2}$)($CH_{2}$)$_{2}$(COOH)COOH＋$2CO_{2}$＋$5H_{2}$O

    則上列反應式的原子使用效率最接近下列哪一數值？（原子量：N＝14，H＝1， C＝12，O＝16）'
  options:
  - label: A
    content: '72'
  - label: B
    content: '32'
  - label: C
    content: '42'
  - label: D
    content: '52'
  - label: E
    content: '62'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '莫耳質量（g/mol）：

    $C_{12}H_{22}O_{11}$＝342，$O_{2}$＝32，$NH_{3}$＝17，CH($NH_{2}$)($CH_{2}$)$_{2}$(COOH)COOH＝147

    所求：原子使用效率＝$\frac{2\times 147}{1\times 342+3\times 32+2\times 17}$×100％≒62％'
- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 已知加熱硝酸鉀，可得一金屬氧化物、一氧化氮以及氧氣，質量約減少 53.5％。加熱硝酸鉀分解的平衡方程式中，最簡單的整係數總和為：（原子量：K＝39，O＝16，N＝14）
  options:
  - label: A
    content: '11'
  - label: B
    content: '12'
  - label: C
    content: '13'
  - label: D
    content: '14'
  - label: E
    content: '15'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '莫耳質量（g/mol）：$KNO_{3}$＝101，NO＝30，$O_{2}$＝32

    加熱硝酸鉀 $KNO_{3}$，可得一金屬氧化物（應為 $K_{2}$O）、NO、$O_{2}$

    平衡方程式應為 $4KNO_{3}$(s) $\xrightarrow{\triangle}$ $2K_{2}$O(s)＋4NO(g)＋$3O_{2}$(g)

    整係數總和：4＋2＋4＋3＝13

    驗證質量損失率：生成 NO、$O_{2}$ 逸散到大氣，所以質量減少$\frac{4\times 30+3\times 32}{4\times 101}$×100％≒53.5％'
- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_15
  section: 1
