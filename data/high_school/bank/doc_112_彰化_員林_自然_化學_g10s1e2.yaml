- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列基本觀念，何項<u>錯誤</u>？
  options:
  - label: A
    content: 非金屬元素只能形成共價分子物質、共價網狀固體
  - label: B
    content: 合金中可能有非金屬元素
  - label: C
    content: 遵守電中性原理，物質結構中有陽離子不一定有陰離子
  - label: D
    content: 實驗式相同，可能是不同物質
  - label: E
    content: 合成清潔劑在含 $Ca^{2＋}$ 或 $Mg^{2＋}$ 的水體中，不會影響去汙效果
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)錯誤；可能形成含 $NH_{4}^{＋}$ 的離子化合物，如 $NH_{4}$Cl、($NH_{4}$)$_{2}SO_{4}$。

    (B)正確；生鐵亦為合金，含有大約 5％ 的碳。

    (C)正確；金屬晶體中藉由金屬陽離子和自由電子的庫侖靜電吸引力，形成金屬鍵，所以物質結構中有陽離子不一定有陰離子。

    (D)正確；如實驗式 $CH_{2}$O，可能是 $C_{2}H_{4}O_{2}$ 的乙酸（醋酸）或甲酸甲酯。

    (E)正確；合成清潔劑在含 $Ca^{2＋}$ 或 $Mg^{2＋}$ 的硬水中，不影響去汙效果。'
