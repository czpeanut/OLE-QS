- id: doc_112_彰化_員林_自然_化學_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 食品中的蛋白質含量，可由測定其氮元素的含量來間接推算。臺灣在 97 年 9 月間發生的「毒奶」風波，係不肖廠商在奶粉中添加三聚氰胺 $C_{3}H_{6}N_{6}$，以造成蛋白質含量較高的假象所導致。假設正常奶粉中的蛋白質，其平均含氮量約 16.6％，則三聚氰胺的含氮量約為正常奶粉中蛋白質平均含氮量的幾倍？（原子量：C＝12，H＝1，N＝14）
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '5'
  - label: E
    content: '6'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '三聚氰胺 $C_{3}H_{6}N_{6}$，分子量為 126，所以 N％＝$\frac{14\times 6}{126}$×100％≒66.7％

    所求：$\frac{66.7％}{16.6％}$≒4'
