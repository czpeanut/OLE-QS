  group_stem: 【閱讀二】 早期科學家發現植物開花是由某種植物激素控制，但卻一直不清楚該激素為何，而稱這種假想的激素為開花素（florigen）。20世紀科學家對開花素的發現有了突破性的進展。1930年代科學家對短日照植物的菸草分別進行長日照（短黑暗）與短日照（長黑暗）處理，再將長日照處理的菸草嫁接至短日照處理的菸草上，結果使長日照處理的菸草開花，暗示了開花素可藉由維管束運送至莖頂的分生組織，促使其分化為花芽。到了20世紀末，科學家又以長日照的阿拉伯芥為材料，進行分子生理實驗，發現當阿拉伯芥處於長日照條件下，轉錄因子CO蛋白會累積在葉脈並會活化葉肉細胞中的FT基因的啟動子（promoter），使其轉錄為mRNA，並在葉脈的伴細胞進行轉譯。合成後的FT蛋白藉由內質網上的FTIP1蛋白協助運送到篩管細胞內，再藉由韌皮部運輸至莖頂，與莖頂的FD蛋白結合形成FT-FD複合體。 FD的基因表現在莖頂，但它的表現不會受到日照長短和CO蛋白的影響。FT-FD複合體也是轉錄因子，會活化在頂芽細胞內的下游基因如API的表現，並協同$SOC_{1}$及其他基因的表現，啟動開花的程序。長日照下，$SOC_{1}$的表現量會上升，並啟動頂芽分生組織的LFY基因，LFY活化則啟動花芽的發育。若$SOC_{1}$基因發生突變不表現，即使FT蛋白大量表現也不開花，證明$SOC_{1}$也是植物開花的重要訊號之一。因FT在植物體內可以藉由韌皮部進行長距離移動並擔任開花的訊息因子，故科學家認為FT可能就是尋找已久的開花素。依本文所述及相關知識，回答下列各題：
  explanation: (A)CO蛋白是累積在葉脈；(B)FD基因表現在莖頂；(D)活化頂芽細胞內的下游基因。故選(C)(E)。
