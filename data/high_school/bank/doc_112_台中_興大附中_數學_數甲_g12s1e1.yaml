  stem: 下列關於極限與導數的敘述哪些是正確的？ (1)$\lim_{x \rightarrow 0} \frac{\cos x}{x} = 0$ (2)$\lim_{x \rightarrow 0} \frac{| x |}{x} = 0$ (3)$\lim_{x \rightarrow 0} x^{2} \cos \frac{1}{x} = 0$ (4)若f (x)＝x | x |，則f ′(0)＝0 (5)若f (x)＝[ x ]，則f ′($\sqrt{2}$)＝0
  explanation: (1) $\lim_{x \rightarrow 0} \cos x = 1$，$\lim_{x \rightarrow 0} x = 0$ ⇒ $\lim_{x \rightarrow 0} \frac{\cos x}{x}$不存在。 (2) $\lim_{x \rightarrow 0^{+}} \frac{| x |}{x} = \lim_{x \rightarrow 0^{+}} 1 = 1$，$\lim_{x \rightarrow 0^{-}} \frac{| x |}{x} = \lim_{x \rightarrow 0^{-}} ( - 1 ) = - 1$ ∴$\lim_{x \rightarrow 0} \frac{| x |}{x}$不存在。 (3) $- 1 \leq \cos\frac{1}{x} \leq 1$ ⇒ $- x^{2} \leq x^{2}\cos\frac{1}{x} \leq x^{2}$ ∴$\lim_{x \rightarrow 0} x^{2} \cos \frac{1}{x} = 0$ (4) f ′(0)＝$\lim_{x \rightarrow 0} \frac{f (x) - f (0)}{x - 0}$＝$\lim_{x \rightarrow 0} | x |$＝0。 (5) 當1＜x＜2時，f (x)＝[$^{ }x^{ }$]＝1 ⇒ f ′($\sqrt{2}$)＝0。 故選(3)(4)(5)。
