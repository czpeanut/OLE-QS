  section: 1
  number: 22
  type: single
  page: 3
  stem: 關於太陽系來的危險訪客，下列敘述何者為真？
  options:
  - label: A
    content: 隕石或流星主要來自太陽系的小行星及彗星
  - label: B
    content: 隕石與宇宙塵埃在墜落地球的過程中與高能帶電粒子聚集處（范艾倫帶）摩擦生熱產生火光形成流星
  - label: C
    content: 若地球沒有磁場，就不會有流星形成
  - label: D
    content: 由於天文觀測研究無助於人類經濟活動，對於太陽系內的小行星無需加以建檔追蹤
