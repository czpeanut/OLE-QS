  stem: 昆蟲馬氏管的功能與人體哪一構造最相近？（由入球小動脈、腎絲球、腎小管三個中選一個回答。）
  group_stem: '恆定（homeostasis）是生理學重要的觀念，是指生物體內的一切生理活動，都是為了維持一個穩定的內在環境而存在。對人類來說，這個內在環境指的是包括血液在內的所有細胞外液，需要維持穩定狀態，包括體溫、滲透度、酸鹼值、離子濃度、氧分壓、葡萄糖濃度等。對昆蟲而言， 維持水分恆定性最大的挑戰是水分的缺乏。因為體型小，其表面積與體積的比值大，水分容易由體表散失，也會在呼吸時由氣孔散失，還有少量的水會由肛門排出。

    昆蟲維持體內水、電解質、酸鹼值及含氮廢物濃度等體液恆定的主要構造是馬氏管及後腸。馬氏管為由一層細胞構成之管狀構造，近端由中、後腸交接處長出，遠端為盲管狀無開口，浸泡於血體腔。馬氏管近端及遠端的功能不同，各種離子、水及含氮廢物由遠端進入馬氏管管腔；在近端處，水及特定離子（如$K^{＋}$、$Cl^{－}$）會被再吸收回到血體腔，馬氏管內液體流到與消化道交接處稱為第一道尿液，再流經後腸藉由再吸收作用形成第二道尿液後排出體外。

    圖一、昆蟲排泄構造與過程示意圖'
