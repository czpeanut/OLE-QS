    我們進入低壓缺氧的高海拔環境後，高度上升的速度，超過身體適應的能力時，所產生之身體不舒服症狀的總稱為高海拔疾病，即俗稱之「高山症」。一般來說，超過2440公尺的高度則可能發生高山肺水腫，超過2750公尺的高度即可能發生高山腦水腫，急性高山病則是到3000公尺以上高山旅遊常見的病況。登山前，可以準備氧氣筒（瓶）或攜帶式加壓袋、避免劇烈的活動、保持體溫、避免吸菸、喝酒或服用鎮靜劑，也要避免吃容易產氣的食物（豆類或碳酸飲料）。而登山時，應注意上升的速度，讓身體有足夠的時間去適應高度的變化，則可以減輕或避免高山症的發生。

    另外，登山前也可了解相關藥物的作用，做為緊急救命使用。一種是丹木斯，常用於預防及治療高山症，是一種能加速腎臟$HCO_{3}^{－}$的排除進而刺激呼吸頻率升高，提升動脈血氧的藥物。另一種是PDE-5抑制劑能抑制血管平滑肌細胞分解環單磷酸鳥苷（cGMP），減少鈣離子進入平滑肌細胞，進而促進平滑肌舒張，促進血管擴張及氣體交換，而減輕高山肺高壓。'
  answer:
  - A
  answer_status: verified
