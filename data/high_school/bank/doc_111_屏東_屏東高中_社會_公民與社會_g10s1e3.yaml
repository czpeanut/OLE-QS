  section: 1
  number: 6
  type: single
  page: 2
  stem: 共和黨出身的美國前總統小布希執政後期，在野的民主黨奪下了國會過半數的席次，因而導致嚴重的行政立法僵局，連續幾個月美國竟沒有任何一條國會通過的法令能正式生效。因為民主黨推動的法案多次受到小布希和共和黨議員的杯葛，使得共和黨議員被民主黨議員諷為聽命於小布希總統的「橡皮圖章」。從美國憲政體制來看，請問造成法案難以通過的原因為何？
  options:
  - label: A
    content: 共和黨議員聯合其他小黨議員以控制國會
