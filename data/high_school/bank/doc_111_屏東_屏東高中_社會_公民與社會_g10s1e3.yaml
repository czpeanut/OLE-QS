  - label: C
    content: 美國國會根本無法制衡由民意產生的總統
  - label: D
    content: 總統行使覆議權來否決國會已通過的法案
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 美國總統與國會多數分屬不同政黨而發生衝突時，由於各自對選民負責，且有任期保障，又缺乏不信任案與解散國會的機制，容易出現政治僵局，影響施政效率。題幹所述即為總統以覆議否決國會通過的法案，故選(D)。(A)民主黨已過半，共和黨無法聯合其他小黨控制國會。(B)總統制無解散國會權力。(C)題幹即為制衡的表現。
