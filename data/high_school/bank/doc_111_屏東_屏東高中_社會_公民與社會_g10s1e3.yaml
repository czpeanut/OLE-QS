  stem: 英國歷史學家艾克頓爵士說：「權力傾向腐化，絕對的權力就絕對會腐化。」因此，近代民權思想家如孟德斯鳩等人，大多主張「分權制衡」，以防執政者腐敗濫權。請問所謂分權，分的是什麼權？
  options:
  - label: A
    content: 主權
  - label: B
    content: 民權
  - label: C
    content: 治權
  - label: D
    content: 政權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 分權制衡是指中央政府的統治權力劃分，故選(C)。(A)主權是一種排他的、自我管理的政治權力，即為「自主自決」的最高權威。(B)民權是人民的參政權。(D)政權在政府、政治和外交領域是指國家的政體的統治體制，或者特定的行政管理當局。
