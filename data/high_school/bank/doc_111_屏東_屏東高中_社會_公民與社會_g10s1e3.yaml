  section: 1
  number: 11
  type: single
  page: 3
  stem: 政府體制的設計猶如一本電影劇本，如果你希望這個國家多一點英雄主義的色彩，你可能會選擇(甲)制；如果你希望這個國家能更強調共識，而希望避免造成一人濫權的可能，你可能會選擇(乙)制。下列有關於(甲)制與(乙)制之敘述，何者正確？
  options:
  - label: A
    content: (甲)制中，掌握行政與立法權力的人可以是同一人，體現權力融合
  - label: B
    content: (甲)制中，若立法權與行政權產生爭議，最終可訴諸於民意，提早改選
  - label: C
    content: (乙)制中，立法權擁有牽制行政權的立法否決權（Veto）
  - label: D
    content: (乙)制中，若行政權的運作無法獲得立法權的信任，立法權可進行不信任投票
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)制是總統制，因為總統是國家元首與最高行政首長；(乙)制是內閣制，有不信任投票的機制，故選(D)。(A)總統制是權力分立。(B)總統制沒有提早改選的設計。(C)內閣制沒有否決權。
