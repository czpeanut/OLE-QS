  stem: 國家元首是一個國家的象徵，但是否具有實權，每個國家都不一樣。對於現在的英國國王而言，下列哪些事情是他可以做到的？(甲)接待外賓，並設國宴款待；(乙)不需首相呈請即可主動解散國會；(丙)拒絕任命國會多數黨黨魁成為首相；(丁)簽署的法案須經內閣副署始可生效
