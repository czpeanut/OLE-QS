  section: 1
  number: 9
  type: single
  page: 2
  stem: 強哥上公民課認真聽講，但是其中討論到內閣制決定閣揆的方式，他感到非常困惑，於是請教公民老師，請問下列有關公民老師的講解，何者正確？
  options:
  - label: A
    content: 內閣制的閣揆一定是由國會議員內部互選產生
  - label: B
    content: 國會有超過 3 個政黨存在，便必然是聯合內閣
  - label: C
    content: 若一政黨在國會擁有過半席次，便能單獨組閣
  - label: D
    content: 一黨內閣的國家，其政黨體系常為一黨獨大制
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 內閣制的運作方式：由人民選出國會議員掌握立法權，再由國會中獲得過半數席次的政黨黨魁出面組成內閣，掌握行政權，並向國會負責的制度。若國會選舉後沒有任何一黨獲得過半席次，通常是由獲得最多席次的政黨，聯合其他小黨組成聯合內閣，以取得執政權，故選(C)。(A)閣揆是多數黨黨魁。(B)聯合內閣與否要看有沒有一黨獲得過半席次。(D)一黨內閣不是因為一黨獨大。
