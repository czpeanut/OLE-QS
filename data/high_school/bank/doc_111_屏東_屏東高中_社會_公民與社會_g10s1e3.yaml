  stem: 有人說，英國的內閣就像「連字符號」或「鈕釦」一樣，把行政權和立法權連結在一起。請問英國的何種憲政制度直接體現了這種「行政立法合一」的精神？
  options:
  - label: A
    content: 最高行政首長由直接民選產生
  - label: B
    content: 不信任投票以及解散國會制度
  - label: C
    content: 內閣的閣員同時兼任國會議員
  - label: D
    content: 元首發布的法令需由閣揆副署
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 在內閣制下，內閣閣員同時由國會議員兼任，展現行政與立法合一的精神，兩者之間有高度的依存性，行政權存在的正當性來自國會的信任，故選(C)。
