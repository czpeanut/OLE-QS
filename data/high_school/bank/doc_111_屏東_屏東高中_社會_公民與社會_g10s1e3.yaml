    content: 內閣制內閣任期有彈性，政治衝突可經倒閣或解散國會後重新訴諸民意
  - label: B
    content: 美國政府官員得在國會列席接受議員對其政策的質詢
  - label: C
    content: 國會多數與美國總統為不同政黨時，易形成總統有權無責
  - label: D
