- id: doc_111_屏東_屏東高中_社會_公民與社會_g10s1e3_s1_27
  section: 1
  number: 27
  type: single
  page: 5
  stem: 有一種社會安全制度是結合多數人力量，共同分擔其損害責任，以眾人的經濟力量補償少數人所受不幸之損失。一旦風險發生，民眾就能取得一定額度的給付。請問下列關於該制度的相關敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 最早開立該項制度的人是德國首相俾斯麥
  - label: B
    content: 該制度是由政府透過稅收來分配相關費用
  - label: C
    content: 該制度以法令強制要求人民納保
  - label: D
    content: 該制度給付方式未必繳得愈多保障就愈多
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)題文所述為社會保險，由國家強制人民參與各種保險，預先為各種疾病、身心傷害、失能、失業、職業災害、老年與死亡等社會風險做準備，財源來自於保費支付。

    28.1601 年的《伊莉莎白濟貧法》承認解決貧困問題是政府應盡的責任，堪稱世界上最早的社會保障法，標誌著社會救助制度的建立，故選(C)。

    29.(A)全民健保不是儲蓄，不能領錢。(C)(D)保費依所得而有差異，但享有一樣的醫療服務。

    30.(B) 1601 年的《伊莉莎白濟貧法》承認解決貧困問題是政府應盡的責任，是世界上最早的社會安全開端。(C) 1935 年美國羅斯福總統所簽署的《社會安全法案》是一種由政府提供的「有限的」福利政策法案，旨在保障國民經濟生活之安全。(D)德國《勞工疾病保險法》是一種社會保險。

    31.社會保險具有使用者付費、強制性、風險分散等概念，故選(D)。(A)(B)社會保險是強制保險。(C)社會保險由政府負責。

    32.針對特定群體而採取的福利措施，與(A)相符。(B)為社會救助。(C)為勞工保險。(D)屬社會保險。

    33.我國受人口老化影響，全球化及產業外移的衝擊而導致貧富差距擴大，也需要更多社會安全支出來因應，財務問題引發債留子孫的世代正義爭論，故選(B)。(A)保障人數增加。(C)(D)完成適用於「老人、兒少、身心障礙者」不同群體的福利、特定群體需要的社會救助與扶助，以及普遍適用的全民健康保險等立法工作，建構出制度式的社會安全體系福利。

    34.社會投資主張社會政策的重心應放事前的預防，解決青年失業與婦女就業等問題，提升家庭因應社會風險與扶養家中老年人口的能力，故選(B)(乙)(丙)。(甲)(丁)不是預防措施。

    35.(A)為價格管制。(B)青年租屋補助是為了落實居住人權的保障，屬社會福利的範圍，為正解。(C)財稅政策。(D)方便稅務稽核。

    36.社會安全制度主要是為了解決或預防社會生活中的各類風險，保障人民的生活水準，故選(D)。(A)社會保險須由政府、雇主、受保險人所繳交的保費出資。(B)社會安全制度的發展，最開始是為了解決「貧窮」問題，逐步擴大成社會保險、社會救助與社會津貼等不同的社會安全制度，故不限於失業者的救濟。(C)政府對社會福利政策的支出，須經國會同意。

    37.國民年金保險屬「柔性強制」，意即符合條件者，被規定要按時繳納保費，逾期未繳納者，勞工局會以書面限期，命其「配偶」繳清欠費，逾期未繳納者若沒有正當理由會有罰鍰，但若無配偶者，就不會有任何罰責，故選(A)。(B)(D) 25 ～ 65 歲的國民「未被其他社會保險納保」的無收入者，須加入國民年金保險。(C)一般民眾被保險人自付 45 ％，政府負擔 55 ％。

    38.社會保險是一種繳費式福利，社會津貼則以政府財政支付，故選(A)。(B)兩者皆政府承辦。(C)無法比較。(D)社會保險參與人數較多。

    39.社會控制是約束、調整與限制社會群體或個人行為的手段，以確保其行為符合社會規範，故選(A)。(B)每個人的宗教信仰不同，故宗教非所有人的共同規範。(C)社會規範可約束外在行為與內心。(D)違反法律要承擔法律責任。

    40.當一個社會傾向將不同文化給予優／劣、進步／落後、優雅／粗俗等不同評價，就形成文化位階，評價常隱含對特定群體的偏見與歧視，導致排斥與隔離的情形，故選(A)。

    41.題幹呈現我族中心主義的思維，衣索比亞人認為自己的文化優於某些族群，進而以自身的文化觀點來詮釋、貶抑其他黑人文化，故選(B)。(A)膚色是是天生的，不是後天的，故非文化。(C)我族中心主義可以表現在性別、年齡、種族等不同面向。(D)衣索比亞人認為自己不是黑人的後裔。

    42.我族中心主義認為自己的文化優於某些族群，進而以自身的文化觀點來詮釋、貶抑其他文化，故選(A)。(B)我族中心的相反是「文化相對論」。(C)當我族中心的思維持續蔓延，就可能形成對特定族群的偏見與歧視。(D)我族中心的思維導致族群間的摩擦與衝突。

    43.(甲)(乙)是我族中心的想法，民主國家的多數決用於少數族群，容易形成多數暴力。(丙)(丁)(戊)為多元文化主義的觀點，強調處於主流文化的群體必須肯定少數或處境不利群體的次文化，給予較多的資源維護其文化認同，保障文化的存續，故選(C)。

    44.多元文化主義的觀點，強調處於主流文化的群體必須肯定少數或處境不利群體的次文化，給予較多的資源維護其文化認同，保障文化的存續，故選(C)。(A)沒有超然的標準，每個文化皆有價值，無須判斷。(B)反對文化同化。(D)鼓勵文化交流。

    45.(A)不扶養父母，違反《民法》。(B)不扶養父母，要負法律責任。(D)此修法是將孝順的道德思維，變成法律，即「道德法律化」。

    46.正確性在避免不正確的資訊或病毒在網路傳播，故選(A)。

    47.題幹所述造成祕密被看光光，即個人資料外洩，故選(B)。(A)(C)題幹未提及假訊息、電子垃圾。(D)「資訊近用」方面的數位落差是指「資訊通信技術的接近使用機會上的差異」。

    48.人類是群居的動物，需要透過各種社會規範來約束行為，避免發生紛爭與衝突而影響社會穩定與安全，即維護社會秩序，故選(D)。

    49.《人工生殖法》涉及生命倫理中對生命的尊重原則，故選(B)。(A)資訊倫理是與資訊利用和資訊科技相關的價值觀。(C)專業倫理是專業團體針對其專業特性發展出來的道德價值觀與行為規範，是在該專業領域裡工作的理想指南，提供專業人士在遇到專業方面的倫理道德問題時做正確抉擇的依據。(D)科技倫理是指科技創新活動中人與社會、人與自然和人與人關係的思想與行為準則，它規定了科技工作者及其共同體應恪守的價值觀念、社會責任和行為規範。

    50.總統制國家，國會可透過人事同意權、條約批准權、預算審查權、人事調查權、彈劾等制衡行政權，故選(A)。(B)為總統的權力。(C)總統制沒有倒閣權。(D)總統制沒有法案副署權。'
