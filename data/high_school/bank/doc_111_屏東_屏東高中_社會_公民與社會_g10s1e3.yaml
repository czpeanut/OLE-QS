  stem: 2014 年 4 月時，日本政府將消費稅自 5 ％調升至 8 ％，致消費者與企業支出轉趨保守，日本經濟再陷衰退，使得「安倍經濟學」遭受各方質疑。安倍晉三遂於 11 月要求解散國會、重新改選，並宣布延後一年半增加消費稅至 10 ％。12 月國會改選結果，安倍領導的執政聯盟贏得三分之二席次，獲得壓倒性勝利。預料安倍將繼續推動「安倍經濟學」的各項政策。請問安倍於任期結束前先行解散國會，進行國會改選的最主要目的為何？
