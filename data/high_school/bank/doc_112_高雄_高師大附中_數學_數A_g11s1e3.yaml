- id: doc_112_高雄_高師大附中_數學_數A_g11s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 已知坐標平面上三點 A（1，0）、B（6，－5）、C（2，－3），下列哪些選項正確？
  options:
  - label: A
    content: $\vec{AB}$＝（－5，5）
  - label: B
    content: $\vec{AB} \cdot \vec{AC}= 20$
  - label: C
    content: $\cos \angle BAC =\frac{2\sqrt{5}}{5}$
  - label: D
    content: $\vec{AB}$在$\vec{AC}$的正射影（2，－2）
  - label: E
    content: B 點在直線 AC 的投影點坐標為（3，－6）
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\vec{AB}$＝（5，－5）

    (B)○：$\vec{AB} \cdot \vec{AC}$＝（5，－5）．（1，－3）＝5×1＋（－5）×（－3）＝20

    (C)○：cos∠BAC＝$\frac{\vec{AB} \cdot \vec{AC}}{∣ \vec{AB} ∣∣ \vec{AC} ∣}$＝$\frac{20}{\sqrt{5^{2} +(- 5)^{2}}\sqrt{1^{2} +(- 3)^{2}}}$

    ＝$\frac{20}{5\sqrt{2}\times \sqrt{10}}$＝$\frac{\sqrt{20}}{5}$＝$\frac{2\sqrt{5}}{5}$

    (D)╳：$\left( \frac{\vec{AB} \cdot \vec{AC}}{∣ \vec{AC} ∣^{2}} \right) \vec{AC}$＝$\frac{20}{(\sqrt{10})^{2}} (1 , - 3)$＝2（1，－3）＝（2，－6）

    (E)○：設 B 點在直線 AC 的投影點坐標為 D（x，y）

    承(D)，$\vec{AD}$＝（x，y）－（1，0）＝（x－1，y）＝（2，－6）

    $\Rightarrow$x＝3，y＝－6

    $\Rightarrow$D（3，－6）

    故選(B)(C)(E)'
- id: doc_112_高雄_高師大附中_數學_數A_g11s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 給定二元一次方程組$\begin{cases}a_{1}x +b_{1}y +c_{1} = 0 \\ a_{2}x +b_{2}y +c_{2} = 0\end{cases}$，請選出正確的選項。
  options:
  - label: A
    content: 若$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| \neq 0$，則此方程組必有解
  - label: B
    content: 若 $c_{1}$＝$c_{2}$＝0，則此方程組至少有一組解
  - label: C
    content: 若$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| = 0$，且 $c_{1}$≠0，$c_{2}$≠0，則此方程組無解
  - label: D
    content: 若$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| = 0$，且 $c_{1}$＝$c_{2}$＝0，則此方程組必有無限多組解
  - label: E
    content: 若$\left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right| = 0$，則此方程組無解
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}a_{1}x +b_{1}y =-c_{1} \\ a_{2}x +b_{2}y =-c_{2}\end{cases}$，$\Delta = \left| \begin{matrix}a_{1} & b_{1} \\ a_{2} & b_{2}\end{matrix} \right|$，$\Delta _{x} = \left| \begin{matrix}-c_{1} & b_{1} \\ -c_{2} & b_{2}\end{matrix} \right|$，$\Delta _{y} = \left| \begin{matrix}a_{1} & -c_{1} \\ a_{2} & -c_{2}\end{matrix} \right|$

    (A)○：恰有一解，$x =\frac{\Delta _{x}}{\Delta}$，$y =\frac{\Delta _{y}}{\Delta}$

    (B)○：至少有一組解 x＝0，y＝0

    (C)╳：$\begin{cases}x + y + 1 = 0 \\ x + y + 1 = 0\end{cases}$，有無限多組解

    (D)○：Δ＝Δ$_{x}$＝Δ$_{y}$＝0，有無限多組解

    (E)╳：可能$\begin{cases}x + y + 1 = 0 \\ x + y + 1 = 0\end{cases}$無限多組解，或$\begin{cases}x + y = 0 \\ x + y + 1 = 0\end{cases}$無解

    故選(A)(B)(D)'
