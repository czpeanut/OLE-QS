- id: doc_112_高雄_高師大附中_數學_數A_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列各組向量中，哪一組滿足$∣ \vec{a} \cdot \vec{b} ∣ = ∣ \vec{a} ∣∣ \vec{b} ∣$且$∣ \vec{a}+\vec{b} ∣ = ∣ \vec{a} ∣+∣ \vec{b} ∣$？
  options:
  - label: A
    content: $\vec{a}$＝（2，－3），$\vec{b}$＝（3，4）
  - label: B
    content: $\vec{a}$＝（2，－3），$\vec{b}$＝（3，2）
  - label: C
    content: $\vec{a}$＝（2，－3），$\vec{b}$＝（－3，2）
  - label: D
    content: $\vec{a}$＝（2，－3），$\vec{b}$＝（－4，6）
  - label: E
    content: $\vec{a}$＝（2，－3），$\vec{b}$＝（6，－9）
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$∣ \vec{a} \cdot \vec{b} ∣$＝$∣ ∣ \vec{a} ∣∣ \vec{b} ∣ \cos \theta ∣$＝$∣ \vec{a} ∣∣ \vec{b} ∣$

    $\Rightarrow$∣cosθ∣＝1

    $\Rightarrow$θ＝0° 或 180°

    又$∣ \vec{a}+\vec{b} ∣$＝$∣ \vec{a} ∣+∣ \vec{b} ∣$

    ∴θ＝0°，即$\vec{a}$//$\vec{b}$且$\vec{a}$，$\vec{b}$同向

    故選(E)'
- id: doc_112_高雄_高師大附中_數學_數A_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 如右圖，ABCDEF 為一六邊形，設$a =\vec{AB} \cdot \vec{AB}$，$b =\vec{AB} \cdot \vec{AC}$，$c =\vec{AB} \cdot \vec{AD}$，$d =\vec{AB} \cdot \vec{AE}$，$e =\vec{AB} \cdot \vec{AF}$，則下列何者正確？
  options:
  - label: A
    content: a＞b＞c＞d＞e
  - label: B
    content: b＞c＞a＞d＞e
  - label: C
    content: b＞a＞c＞d＞e
  - label: D
    content: a＞b＞c＞e＞d
  - label: E
    content: b＞a＞c＞e＞d
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_112_高雄_高師大附中_數學_數A_g11s1e3/s1_2_f1.png
    crop:
      page: 1
      rect:
      - 466.8
      - 372.35
      - 564.3
      - 452.55
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＝$\vec{AB} \cdot \vec{AB}$＝$∣ \vec{AB} ∣(∣ \vec{AB} ∣ \cos 0^{^{\circ}})$

    b＝$\vec{AB} \cdot \vec{AC}$＝$∣ \vec{AB} ∣(∣ \vec{AC} ∣ \cos \angle CAB)$

    c＝$\vec{AB} \cdot \vec{AD}$＝$∣ \vec{AB} ∣(∣ \vec{AD} ∣ \cos \angle DAB)$

    d＝$\vec{AB} \cdot \vec{AE}$＝$∣ \vec{AB} ∣(∣ \vec{AE} ∣ \cos \angle EAB)$

    e＝$\vec{AB} \cdot \vec{AF}$＝$∣ \vec{AB} ∣(∣ \vec{AF} ∣ \cos \angle FAB)$

    由題圖可知

    $∣ \vec{AC} ∣ \cos \angle CAB$＞$∣ \vec{AB} ∣ \cos 0^{^{\circ}}$＞$∣ \vec{AD} ∣ \cos \angle DAB$＞$∣ \vec{AE} ∣ \cos \angle EAB$＞$∣ \vec{AF} ∣ \cos \angle FAB$

    ∴b＞a＞c＞d＞e

    故選(C)'
