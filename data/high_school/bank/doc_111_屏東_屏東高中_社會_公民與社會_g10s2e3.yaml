  stem: 老師在公民課提問：「在治安欠佳的年代，執政者或社會大眾易有『治亂世用重典』的想法，相信運用法律的強制力，高度管制規範一切行為，使違反者遭到重罰，可以達到嚇阻犯罪的效果。然而事實上嚴刑峻罰未必能遏止犯罪，這是因為什麼原因？」大雄說：「因為處罰還不夠重，所以犯罪者並不害怕。」技安說：「因為執法不力，讓許多犯罪者逍遙法外。」靜香說：「輕罪重罪若皆重罰，則將無法遏阻重大犯罪發生。」阿福說：「因為法官輕判，所以無法達到遏阻效果。」請問誰的說法較為正確？
  options:
  - label: A
    content: 靜香
  - label: B
    content: 阿福
  - label: C
    content: 大雄
  - label: D
    content: 技安
  answer:
