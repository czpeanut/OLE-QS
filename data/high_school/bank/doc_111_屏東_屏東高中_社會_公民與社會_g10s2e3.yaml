  stem: 我國《刑法》第 325 條規定：「意圖為自己或第三人不法之所有，而搶奪他人之動產者，處六月以上五年以下有期徒刑。」法官必須依此法條量刑，不得處罰超出法條規定之內容。請問這是強調何種原則？
  options:
  - label: A
    content: 罪刑法定
  - label: B
    content: 一罪不二罰
  - label: C
    content: 不溯及既往
  - label: D
