  stem: 立法院於 2015 年 12 月修正通過《食品安全衛生管理法》，不但將罰金額度提高 10 倍，且可「一事一罰」，累罰無上限，但仍無法處罰 2014 年餿水油事件的違法者。依上所述判斷，應是在說明下列何者的概念？
  options:
  - label: A
    content: 習慣法的禁止
  - label: B
    content: 不溯及既往
  - label: C
    content: 絕對不定期刑的禁止
  - label: D
    content: 禁止類推適用
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 2015 年完成修法，但仍然無法處罰 2014 年發生的事件，可知無法溯及既往。故本題選(B)。(A)習慣法的禁止指處罰必須當時有法令的明文規定，不可使用當地的習慣。(C)絕對不定期刑的禁止指《刑法》須明訂刑責。(D)禁止類推適用指必須當時有法令的明文規定，不可類推。
