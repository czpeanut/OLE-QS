  explanation: 老師提到，嚴刑峻罰未必能遏止犯罪，故本題選(A)。(B)題文中並無提到法官輕判，而是嚴刑峻罰。(C)大雄說還不夠重，與題文不符。(D)題文中並無提到執法不力。
