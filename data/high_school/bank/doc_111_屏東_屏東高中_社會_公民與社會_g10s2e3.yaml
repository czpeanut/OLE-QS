  stem: 我國《刑法》第 2 條規定：「行為後法律有變更者，適用行為時之法律。但行為後之法律有利於行為人者，適用最有利於行為人之法律。」以上條文內容最能體現何種精神？
  options:
  - label: A
    content: 無罪推定
  - label: B
    content: 從舊從輕
  - label: C
    content: 刑期無刑
  - label: D
    content: 罪疑唯輕
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 原則上以行為時之法律規定罰之，但如果新法較輕，會改用新法，屬於從舊從輕原則，故本題選(B)。(A)無罪推定指在法院未判決之前，皆應認為犯罪嫌疑人無罪。(C)刑期無刑為有刑法，但希望不要用到刑法，為刑法謙抑原則的展現。(D)罪疑唯輕為如果對犯罪行為人是否犯罪有疑惑，應當以輕的為主。
