  stem: 近年網路直播平臺興起，帶動了有別以往傳統媒體之表現。而正因直播具「即時性互動」的特性，使之幾乎無所不在、無所不播。例如商家透過網路直播購物節目、藝人運用直播與粉絲互動，或網友分享日常生活起居，甚至連自殺跳樓現場皆有人直播。請問下列選項何者正確？
  options:
  - label: A
    content: 因直播是自己自行錄製媒體之分享行為，故無侵權問題
  - label: B
    content: 臉書直播時演唱時下流行歌，並未涉及違反《著作權法》
  - label: C
    content: 網路直播電影畫面，因時間僅有 15 分鐘，故仍屬著作權之「合理使用」範圍
