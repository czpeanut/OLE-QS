  answer_status: verified
  answer_source: answer_key
  explanation: 法官以法條量刑，不得超出法條規定之內容，屬於罪刑法定的概念，故選(A)。(B)一罪不二罰指同一個犯罪行為，不會受到兩次處罰。(C)不溯及既往指法令只會適用於生效後的事件，不會追溯到之前的事件。(D)禁止類推適用指必須當時有法令的明文規定，不可類推。
