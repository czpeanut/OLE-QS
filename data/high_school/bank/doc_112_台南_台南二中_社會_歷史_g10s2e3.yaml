- id: doc_112_台南_台南二中_社會_歷史_g10s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 19 世紀中葉開始，東亞各國逐漸與西方各國產生交流，西方將較為現代的事物帶入東亞各國，促使現代化城市的興起，也形塑了當時候的都市生活型態，請問下列敘述何者正確？
  options:
  - label: A
    content: 當時的新疆現代化的設施如電器早已普及
  - label: B
    content: 當時上海夜晚並不繁華，仍然是破舊的小漁村
  - label: C
    content: 當時現代化的地點與西方勢力範圍幾乎一致
  - label: D
    content: 引入西方星期制，人們開始流行現在的週休二日
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)新疆位於中國最西端，引進現代化設施的時間相對沿海地區晚。(B)上海受到租界影響，各項西方現代化的設施皆比其他城市早，已非破舊的小漁村。(D) 1912 年中華民國建立後方實施星期制，當時尚無週休二日的觀念。

    3.1943 年為二戰後期，從參與會議的國家元首來看，當時日本的「大東亞共榮圈」應收到一定的成效，因此答案為(B)。(A)「民族自決」為一戰後的思潮，二戰後的日本不以此為號召。(C)此時還不到戰末關鍵，還不會反省戰爭帶來的傷害。(D)世界仍是重歐輕亞的局勢，戰後亦不可能以東亞國際聯盟來主導維護世界和平。

    4.(A)從「只是應戰，而不是求戰」的態度，可知其並不積極應戰。(B)從衝突地點在北平的盧溝橋，可推知與盧溝橋七七事變有關。(D)中國東北在 1931 年後已受日本控制，翌年成立滿洲國，中國已無法在當地駐軍。

    5.(B)美國並非亞洲的開發中國家、(C)「發展自衛隊」並非經濟建設，兩者皆不符合亞銀的申請援助條件。(D)韓戰時，亞銀尚未成立。

    6.(A)利瑪竇的傳教方式以吸引上層官紳為目的，不會幫助農民以招徠信徒。(C)引介西學給中國的皇帝與官紳，達到傳教目的。(D)在「藉儒傳教」的策略下，利瑪竇改做中國儒生打扮，並自認為「西儒」。

    7.(D)中國並非白銀生產國，走私鴉片造成大量白銀輸出，對國計民生皆造成重大影響。

    8.(A)主張「經右政左」，政治並未鬆綁。(B)「南巡談話」在 1992 年。(D)經濟上採取「改革開放」政策，與過去的計畫經濟不同。

    9.兩則資料皆提到朝鮮受國際上民族自決風潮影響日，鼓動國內外的反日獨立風潮，因此答案為(A)。(B)三一獨立運動的背景，並非影響。(C)兩則資料皆未提及日本的殖民政策內容。(D)資料僅提到前因，並未談及後果。

    10.從官方指出此事件被肅清的對象為「敵對勢力分子」，可推知為(B)鎮壓反革命運動，掃蕩國民黨員與異議分子以消弭反抗力量。(A)對象為地主階級。(C)為第二次五年計畫經濟，並非肅清運動。(D)原是要批鬥並清除黨內走資派人士，最後演變成一場大災難。

    11.1950 年代乙丙結盟、與甲對立；1960 年代乙丙關係緊張，甲丙關係卻於此時和緩；1970 年代甲乙竟然合作、與丙對立。從中、美、蘇三國的關係來看，甲、乙、丙三國依序應是(B)美、中、蘇，1960 年代的美、蘇關係和緩，被稱為冷戰的「低盪」時期。

    12.(B)中國積極與東協國家經濟合作，並未退出。(C)東協為東南亞國家自發性組成的區域統合，並非美國推動。(D)東協十加三係指加入中、韓、日，且未討論東亞共同體相關議題。

    13.根據兩則資料，此時清廷面臨海上外患與新疆失守的局勢，因此在朝廷掀起海防與塞防的論爭，故正確答案為(A)，當時正值日軍侵臺危機。(B)資料一為海防論，主張加強海防。(C)應是日軍侵臺的牡丹社事件。(D)資料二為塞防論，強調「備邊於西北」的重要性。

    14.從暴動者攻入日本公使館來看，可知日本勢力已伸入朝鮮，引起群眾不滿，故答案為(A)。(B)朝鮮於 1910 年才成為日本的殖民地。(C)甲午戰爭於 1894 年爆發，題文所述事件並非其導火線。(D)朝鮮為中國的藩屬，自然有權派軍隊進入朝鮮鎮壓。

    15.題文所述應為(D)九一八事件的後續處理，甲、乙兩國分別為中國與日本，中國向國際聯盟申請仲裁調解，但日本不願接受國際聯盟的調查結果，甚至最後退出國際聯盟。

    16.從清高宗的敕諭中，可以看出中國自認天朝物產豐盈，本就無需與外夷貿易，而是將各「蕞爾小邦」的必需之物，「加恩體恤」的賞賜，足見當時仍以傳統的天朝上國心態看待英使的貿易請求，因此正確答案為(C)。(A)中國無與英國貿易的需要性。(B)此時英商仍需透過洋行與中國進行貿易。(D)在天朝上國體制下，中國與英國的貿易為上對下關係，並非平行進行。

    17.(A)「大東亞共榮圈」為太平洋戰爭時期的政策。(C)對日抗戰時，中國的應戰策略。(D)九一九事變後，國民政府的應對態度。

    18.題文所述為中央勢弱、地方群雄割據情形，割據勢力之間甚至會有聯合的現象，符合此情況的答案為(B)民國初年的軍閥政治，如北方的直系與皖系就曾合作操控北京政府。(A)東南互保是與各國簽訂非戰協定，並非地方割據勢力。(C)重慶與南京皆自認為中央政府，與題文所述不符。(D)臺海兩岸皆自認為正統政權，與題文所述不符。

    19.1950 年代的中國正全面推行土地改革、鎮壓反革命、三反五反等社會主義改革運動，許多人在這波階級鬥爭中喪命，因此答案為(A)。(B) 1980 年代。(C) 1940 年代。(D) 1930 年代。

    20.資料一應為朝鮮三一運動的宣言；資料二為《江華島條約》的內容，使日本勢力開始進入朝鮮，綜合兩者，正確解讀為(B)。(A)脫亞入歐論為日本的維新政策，與朝鮮獨立無關。(C)日本以武力迫使朝鮮簽訂。(D)資料一的獨立運動失敗，資料二則使朝鮮被迫開港通商。

    21.題文所述為日本的「大東亞共榮圈」的理論主張，強調團結東亞國家以對抗西方帝國主義國家，其合作的對象並不包括共產主義勢力的(C)延安蘇維埃政權。

    22.(A)鴉片戰爭後，中國僅開放五口通商，並未全面通商。(B)中國並沒有成為英國的殖民地。(C)「不名譽」的原因是因為以鴉片糾紛為導火線。

    23.題文指出有「挑戰」而陷入危機後，再做出「回應」來面對，因此符合這個理論敘述應為(C)。(A)(B)敘述中，中國政權並未面臨「挑戰」。(D)僅有「挑戰」，沒有任何「回應」的說明。

    24.(A)甲制度為幕藩體制，天皇無權，因此並非君主專制，而是封建統治。(C)明治維新在黑船事件、結束鎖國之後。(D)明治新政採徵兵制並建立新式軍隊，取代傳統武士軍團。

    25.從大眾高喊「外爭主權，內除國賊」、民族主義高漲、反軍閥與反帝國主義的浪潮興起、人民注意到參與公共事務的重要性等相關政治的敘述，可知題文主要在描述五四運動使(D)人民政治意識提升。

    26.題文顯示在冷戰對立期間，小國為求自保而選擇保持中立、避免捲入超級大國之間的爭鬥，因此可推知為第三世界國家的不結盟運動，故答案為(D) 1955 年召開的萬隆會議，追求亞、非兩洲的區域和平與國際合作。(A)(B)(C)三者實際操控者仍為西方大國。

    27.(B)從「已然能關照到國家體制的各個層面」，可知已是制度層面的改革。(C)從「主要推行者缺乏實務經驗」一句，可推知為戊戌變法，庚子新政的推行者如袁世凱、張之洞等人，皆有行政經歷。(D)應是甲午戰爭失敗的刺激。

    28.(A)受日本殖民控制的是朝鮮。(B)「新文化運動」應改為「五四運動」。(D)「國賊」指將山東權利讓予日本的政府官員。

    29.題文提到「移民南方島嶼」、「走向南方的島嶼」，可知應為日本主張的南進政策，自 1930 年代開始鼓吹移民南洋，二戰期間更發展成「大東亞共榮圈」體制，因此答案為(B)。

    30.資料一的學生運動遭到大規模軍警鎮壓，應為六四天安門事件；資料二評論中國的民主運動失敗，但並不看好共產國家未來的形勢發展，應為臺灣方面對六四天安門事件的看法，因此答案為(D)。(A)資料一反對學生運動。(B)僅資料一視學生運動為「反革命暴亂」，為中國官方說法。(C)兩者皆是對六四天安門事件的評論。

    31.題文說明日本從甲午戰爭後國際地位提升，逐漸發展成軍國主義思想，而後走向帝國主義向外侵略的大致過程，因此最適宜的答案為(C)。

    32.潘佩珠的著作批判阮朝守舊而喪國，同時又痛斥勾結殖民主義的越南人，加上大量使用的「國家」與「國民」等字詞，可知他希望能喚起越南人的民族主義，恢復越南獨立自主的地位，因此答案為(C)。(A)反對與法國合作。(B)(D)題文中並未提到。

    33.(A)使用越南語的白話體書寫，主要讀者為越南民眾。(C)文章創作時，日本尚未對越南有軍事征伐舉動。(D)強調越南曾是征服占族的勝利者，應是提升越南人的民族自尊心，而非向外擴張。

    34.從資料三可知，此事件攸關俄國對日作戰的條件談判，因此答案為(A)《雅爾達密約》。

    35.1943 年的《雅爾達密約》同意蘇聯在戰勝日本後，能保障其在中國東北的諸多利權，因此在日本投降後，蘇聯軍隊隨即進人中國東北，接收日本關東軍留下的設備與武器，(D)為正解。(A)事件前，蘇聯已於 1941 年與德國開戰。(B)東條英機下臺係因日本在南洋的戰事失敗，與《雅爾達密約》無關。(C)發生於 1919 年。

    36.資料一指責殖民者打開大門迎接日寇，因此是越南的胡志明所建政權；資料二為大韓民國首任總統李承晚的經歷，因此答案為(A)。(B)乙國為南韓，在韓戰中與中共陣營敵對。(C)甲國在二次大戰後，再度淪為法國殖民地，扶植阮朝傀儡政權。(D)甲為越南民主共和國，乙為大韓民國。

    37.越南民主共和國為共產政權，屬於蘇聯陣營；大韓民國為美國所扶持政權，屬於美國陣營，(D)為正解。

    38.此事件使中蘇兩國爆發軍事衝突，可知為 1969 年的珍寶島事件，答案為(D)。(A) 1971 年。(B) 1953 年赫魯雪夫上臺後。(C)中國參加 1955 年萬隆會議，即有意藉由第三世界的勢力以與蘇聯抗衡。

    39.(C)聯合國於 1945 年二戰後成立，與珍寶島事件無關。

    40.1970 年代在自己國家展開大屠殺的共產政權應是(C)柬埔寨的波帕，在中共支持下取得政權，推行共產公社制度與恐怖統治，被稱為「紅色高棉」。

    41.1970 年代中蘇關係勢如水火，其起因為 1953 年史達林去世後，蘇聯新領導人赫魯雪夫批判史達林的暴行，政治上「去史達林化」，引起毛澤東的不滿，雙方關係日益惡化，因此答案為(B)。

    42.這個港口為經濟特區，各國外商皆可前來貿易但又受到諸多限制，因此可推知為開港通商前(D)廣州，當時外商貿易僅能透過指定的洋行為中介，無法自由貿易。

    43.鴉片戰爭前，清廷將對外貿易侷限於廣州一地，並對外商活動設下諸多限制，實乃出於天朝上國的心態，因此答案為(A)。(B)當時外商的重點在獲取白銀，而非土地。(C)此時視外國為蕞爾之邦，並不擔心對方船堅砲利。(D)限制貿易地點是為方便管理。

    44.從「由總理衙門印製出版」一句，可知當時為自強運動期間，因此答案為(A)。(B)(D)為甲午戰爭後的情形。(C)民初新化運動時期的現象。

    45.題文指出《萬國公法》能使中國人民了解西方世界和現代法律概念，傳至日本後又成為日本外交家與西方列強外交斡旋的重要工具，可知坂本龍馬對《萬國公法》的讚揚應為(B)。(A)應是了解西方世界並學習其法律概念，可與外國有更好的溝通和談判。(C)(D)從題文看不出有此種想法。

    46.(A)日本先侵略中國，太平洋戰爭後才入侵東南亞。(C)日本於 1933 年退出國際聯盟，當時尚未入侵東南亞。(D)早在太平洋戰爭之前，日本已有南進的野心。

    47.(B)國防圈涵蓋太平洋的大部分，顯示其侵略野心，之後即發動珍珠港事變，將構想變成現實。(C)國防圈包含東南亞與大洋洲、澳洲，多為西方列強殖民地，直接衝擊列強勢力範圍。(D)日美主要交戰地點為太平洋諸島，臺灣僅在後期才為美軍空襲轟炸。

    48.珍寶島位於烏蘇里江的中蘇邊界，為圖中的(B)乙區域。

    49.(D)戰役爆發後，中國人民向蘇聯駐北京大使館遞交抗議信，可見中、蘇並未斷交。

    50.從「中國將東北領土的喪失視之為列強掠奪中國領土、藐視中國主權之百年國恥的結果」，可知除了領土的糾紛外，還有中國民族主義升高的因素，故答案為(C)。'
