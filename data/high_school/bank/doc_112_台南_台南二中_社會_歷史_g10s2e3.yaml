  - label: D
    content: 志士主張反滿革命，四處起義烽火
  group_stem: 丁韙良是美國長老會傳教士，1850 年便來到中國傳教。傳教之餘翻譯《萬國公法》，此書包括了大量的西方現代化概念，因此受到恭親王奕訢的賞識，並由總理衙門印製出版。此書的出版，使中國人民開始了解西方世界和現代法律概念，甚至替中國解決一件國際糾紛，使中國了解國際律法是有利於外交與統治。後來，《萬國公法》傳到日本，成為日本外交家與西方列強外交斡旋的重要工具，對此，政治家坂本龍馬更提出「長劍不如短刀，短刀不如手槍，手槍不如《萬國公法》」的說法，讚揚《萬國公法》。
  answer:
