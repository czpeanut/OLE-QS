  group_stem: '清末以來，俄國利用英法聯軍攻打中國之際，要求簽訂《璦琿條約》、《北京條約》等，將原本以外興安嶺、額爾古納河為界的兩國，改以黑龍江、烏蘇里江為界，中國因而失去廣大領土。1951 年時，甫建國的中國，正值內政外交百廢待舉，極度仰賴蘇聯之際，中國簽署了一份協定，由蘇聯掌管黑、烏兩條河流。但隨時空轉變，兩國關係逐步惡化，在國土疆域上的對峙亦日趨緊繃。中國將東北領土的喪失視之為列強掠奪中國領土、藐視中國主權之百年國恥的結果；更令中國人氣結的是，即使中國曾對蘇聯「一邊倒」，蘇聯仍堅守「帝國主義」時期的政策，未對中國相對釋出較多的善意。1950 年代末期，中國三番兩次要求對「不平等」的邊界重啟協商，但蘇聯總是一口回絕。

    1966 年，紅衛兵高喊打倒「走資派」、「打倒修正主義」的口號，對「帝國主義」的炮火更加猛烈，中、蘇頻繁在邊界巡邏，衝突不斷，在 1964 年到 1969 年間短短五年間，已發生四千起「意外」事件。這些意外大都循著一種固定模式：一方派出巡邏隊，另一方就抗議侵犯邊界，然後經由你來我往，雙方便各自撤退。死傷雖不大，但雙方關係已勢同水火，隨時有引爆可能。

    1968 年 12 月底，中、蘇士兵在國界的一個名叫珍寶島的淤泥攤手持棍棒交戰，這場交戰並未依循往例在幾日後無疾而終，反而一路延燒到隔年新年，傷亡人數日增。1969 年 3 月 2 日，中國調派武警進駐珍寶島。蘇聯提出抗議，中國武裝警開槍反擊。兩週後，兩國再度於珍寶島激戰，這回雙方配備重砲、裝甲車，造成更多傷亡。就在東北陷入戰火的同時，北京亦不平靜，中國人民試圖向蘇聯大使館遞交抗議書，但蘇聯館方拒不接受。結果，中國人民將抗議書丟過蘇聯大使館圍牆，蘇聯又把抗議書丟回來，兩國宣傳充斥著情緒性語言。'
