  stem: 18、19 世紀之交，某個東亞城市的書肆裡，既可找到傳統漢醫《傷寒論》、《黃帝內經》的註疏，也可買到荷蘭人醫學著作《內科選要》的在地譯本。這座東亞城市最可能是：
  options:
  - label: A
    content: 朝鮮的漢城
  - label: B
    content: 日本的江戶
  - label: C
    content: 清國的蘇州
  - label: D
    content: 越南的河內
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文顯示這個東亞城市除了深受中國文化影響外，同時亦有荷蘭人傳入的西方文化流傳，可推知應是鎖國時代的日本，因此答案為(B)日本的江戶。
