- id: doc_110_高雄_高雄中學_數學_數A_g11s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 右圖為函數y＝a sin ( bx＋c )＋d的部分圖形，其中b＞0，－$\frac{\pi}{2}$ ≤ c ≤ $\frac{\pi}{2}$， A＝($\frac{1}{2}$ , 0 )，B＝($\frac{7}{6}$ , 0 )，則下列哪些選項正確？
  options:
  - label: A
    content: a＝2
  - label: B
    content: y＝a sin ( bx＋c )＋d的週期為2
  - label: C
    content: c＝$\frac{\pi}{3}$
  - label: D
    content: 此函數圖形對稱於直線x＝$\frac{23}{6}$
  - label: E
    content: 將函數y＝a sin bx＋d水平右移$\frac{\pi}{3}$單位可得y＝a sin ( bx＋c )＋d
  assets:
  - key: s1_2_f1
    kind: figure
    file: doc_110_高雄_高雄中學_數學_數A_g11s1e1/s1_2_f1.png
    crop:
      page: 1
