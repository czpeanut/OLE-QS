- id: doc_110_高雄_高雄中學_數學_數A_g11s1e1_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設0＜θ＜$\frac{\pi}{2}$，若sinθ－cosθ＝$\frac{1}{2}$，則下列哪些選項正確？
  options:
  - label: A
    content: sin 2θ＝$\frac{3}{4}$
  - label: B
    content: cos 2θ＝±$\frac{\sqrt{7}}{4}$
  - label: C
    content: sinθ＋cosθ＝$\frac{\sqrt{7}}{2}$
  - label: D
    content: tan$\frac{\theta}{2}$＝－2＋$\sqrt{7}$
  - label: E
    content: 已cos (θ－$\frac{\pi}{2}$)＝$\frac{\sqrt{7}+1}{4}$
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：( sinθ－cosθ)$^{2}$＝1－sin 2θ＝$\frac{1}{4}$ ⇒ cos 2θ＝$\frac{3}{4}$。 (B) ×：因為0＜θ＜$\frac{\pi}{2}$且sinθ＞cosθ，所以$\frac{\pi}{4}$＜θ＜$\frac{\pi}{2}$ ⇒ $\frac{\pi}{2}$＜2θ＜π ⇒ cosθ＝－$\frac{\sqrt{7}}{4}$。 (C) ○：( sinθ＋cosθ)$^{2}$＝1＋sinθ＝1＋$\frac{3}{4}$＝$\frac{7}{4}$ ⇒ sinθ＋cosθ＝$\frac{\sqrt{7}}{2}$。 (D) ○：解$\begin{cases}\sin \theta -\cos \theta =\frac{1}{2} \\ \sin \theta +\cos \theta =\frac{\sqrt{7}}{2}\end{cases}$ ⇒ $\begin{cases}\sin \theta =\frac{1+\sqrt{7}}{4} \\ \cos \theta =\frac{\sqrt{7}-1}{4}\end{cases}$， 又$\frac{\pi}{8}$＜$\frac{\theta}{2}$＜$\frac{\pi}{4}$，所以sin$\frac{\theta}{2}$＝$\sqrt{\frac{1-\cos \theta}{2}}$，cos$\frac{\theta}{2}$＝$\sqrt{\frac{1+\cos \theta}{2}}$， ⇒ tan$\frac{\theta}{2}$＝$\frac{\sin \frac{\theta}{2}}{\cos \frac{\theta}{2}}$＝$\sqrt{\frac{1-\cos \theta}{1+\cos \theta}}$＝$\sqrt{\frac{1-\frac{\sqrt{7}-1}{4}}{1+\frac{\sqrt{7}+1}{4}}}$＝$\sqrt{\frac{5-\sqrt{7}}{3+\sqrt{7}}}$＝$\sqrt{11-4\sqrt{7}}$＝$\sqrt{11-2\sqrt{28}}$＝$\sqrt{7}$－2。 (E) ○：cos (θ－$\frac{\pi}{2}$)＝sin (π－θ)＝sinθ＝$\frac{1+\sqrt{7}}{4}$。 故選(A)(C)(D)(E)。
  tags:
