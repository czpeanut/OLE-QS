  stem: 關於下列函數週期的判斷，哪些選項正確？
  options:
  - label: A
    content: f (x)＝sin (－2x＋5 )－1的週期為π
  - label: B
    content: f (x)＝( 2 sin x＋cos x ) ( sin x－2 cos x ) 的週期為π
  - label: C
    content: f (x)＝| tan x＋cot x ) | 的週期為π
  - label: D
    content: f (x)＝$sin^{3}$ x－$\frac{3}{4}$sin x的週期為2π
  - label: E
    content: f (x)＝$tan^{2}$ x＋100 tan x＋5π的週期為π
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：週期為$\frac{2\pi}{|-2|}$＝π。 (B) ○：f (x)＝( 2 sin x＋cos x ) ( sin x－2 cos x )＝2 $sin^{2}$ x－2 $cos^{2}$ x－3 sin x cos x ＝－2 cos 2x－$\frac{3}{2}$sin 2x＝$\frac{3}{2}$sin ( 2x＋ψ)， 所以週期為$\frac{2\pi}{2}$＝π。 (C) ×：f ( x＋$\frac{\pi}{2}$)＝| tan ( x＋$\frac{\pi}{2}$)＋cot ( x＋$\frac{\pi}{2}$) |＝| cot (－x )＋tan (－x ) | ＝|－cot x－tan x |＝| tan x＋cot x |＝f (x)， 所以週期為$\frac{\pi}{2}$。 (D) ×：f (x)＝$sin^{3}$ x－$\frac{3}{4}$sin x＝－$\frac{1}{4}$(－$sin^{3}$ x＋3 sin x )＝－$\frac{1}{4}$sin 3x，所以週期為$\frac{2\pi}{3}$。 (E) ○：f ( x＋π)＝$tan^{2}$ ( x＋π)＋100 tan ( x＋π)＋5π＝$tan^{2}$ x＋100 tan x＋5π＝f (x)， 所以週期為π。 故選(A)(B)(E)。
