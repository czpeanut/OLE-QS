  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：a＝$\frac{1-(-3)}{2}$＝2。 (B) ○：承(A)可知，d＝－1， ⇒ y＝2 sin ( bx＋c )－1， ⇒ $\begin{cases}2\sin (\frac{b}{2}+c)-1=0 \\ 2\sin (\frac{7b}{b}+c)-1=0\end{cases}$ ⇒ $\begin{cases}\sin (\frac{b}{2}+c)=\frac{1}{2} \\ \sin (\frac{7b}{b}+c)=\frac{1}{2}\end{cases}$ ⇒ $\begin{cases}\frac{b}{2}+c=\frac{\pi}{6} \\ \frac{7b}{b}+c=\frac{5\pi}{6}\end{cases}$ ⇒ $\frac{2b}{3}$＝$\frac{2\pi}{3}$ ⇒ b＝π， 所以週期為$\frac{2\pi}{\pi}$＝2。 (C) ×：承(B)可得，$\frac{\pi}{2}$＋c＝$\frac{\pi}{6}$ ⇒ c＝－$\frac{\pi}{3}$。 (D) ○：承(C)可知，y＝2 sin (πx－$\frac{\pi}{3}$)－1， 將x＝$\frac{23}{6}$代入可得y＝2 sin ($\frac{23\pi}{6}$－$\frac{\pi}{3}$)－1＝2 sin$\frac{7\pi}{2}$－1＝－3， 所以圖形對稱直線x＝$\frac{23}{6}$。 (E) ×：因為y＝2 sin (πx－$\frac{\pi}{3}$)－1＝2 sin (π( x－$\frac{1}{3}$) )－1， 所以將y＝a sin bx＋d水平右移$\frac{1}{3}$單位可得y＝a sin ( bx＋c )＋d。 故選(A)(B)(D)。
