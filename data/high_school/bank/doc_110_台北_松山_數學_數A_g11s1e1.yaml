- id: doc_110_台北_松山_數學_數A_g11s1e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 關於△ABC 的敘述，請選出正確的選項：
  options:
  - label: A
    content: 若 $sin^{2}$A＋$sin^{2}$B＞$sin^{2}$C，則△ABC 必為銳角三角形
  - label: B
    content: 若 $sin^{2}$A＋$sin^{2}$B＜$sin^{2}$C，則△ABC 必為鈍角三角形
  - label: C
    content: 若 cosAcosB＞sinAsinB，則△ABC 必為鈍角三角形
  - label: D
    content: 若 tanAtanB＞1，則△ABC 必為銳角三角形
  - label: E
    content: 若 0＜tanAtanB＜1，則△ABC 必為鈍角三角形
  answer:
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：$\frac{a}{\sin A}$＝$\frac{b}{\sin B}$＝$\frac{c}{\sin C}$＝2R$\Rightarrow\begin{cases}\sin A = \frac{a}{2R} \\ \sin B = \frac{b}{2R} \\ \sin C = \frac{c}{2R}\end{cases}$

    $sin^{2}$A＋$sin^{2}$B＞$sin^{2}$C$\Rightarrow\left( \frac{a}{2R} \right) ^{2} + \left( \frac{b}{2R} \right) ^{2} > \left( \frac{c}{2R} \right) ^{2}$

    $\Rightarrowa^{2}$＋$b^{2}$＞$c^{2}$

    $\Rightarrowa^{2}$＋$b^{2}$－$c^{2}$＞0

    ∴cosC＝$\frac{a^{2}+b^{2}-c^{2}}{2ab}$＞0$\Rightarrow$0°＜∠C＜90°

    △ABC 未必為銳角三角形

    (B)○：$sin^{2}$A＋$sin^{2}$B＜$sin^{2}$C$\Rightarrowa^{2}$＋$b^{2}$＜$c^{2}\Rightarrowa^{2}$＋$b^{2}$－$c^{2}$＜0

    ∴cosC＜0$\Rightarrow$90°＜∠C＜180°

    ∴△ABC 必為鈍角三角形

    (C)○：cosAcosB＞sinAsinB$\Rightarrow$cosAcosB－sinAsinB＞0

    $\Rightarrow$cos（A＋B）＞0

    $\Rightarrow$cos（180°－∠C）＞0

    $\Rightarrow$0°＜180°－∠C＜90°

    $\Rightarrow$90°＜∠C＜180°

    ∴△ABC 必為鈍角三角形

    (D)○：tanAtanB＞1$\Rightarrow\frac{\sin A}{\cos A} \times \frac{\sin B}{\cos B}$＞1

    $\Rightarrow$sinAsinB＞cosAcosB

    $\Rightarrow$cosAcosB－sinAsinB＜0

    $\Rightarrow$cos（A＋B）＜0

    ∴90°＜∠A＋∠B＜180°$\Rightarrow$90°＜180°－∠C＜180°$\Rightarrow$0°＜∠C＜90°

    又 tanAtanB＞1$\Rightarrow$tanA＜0 且 tanB＜0（不合）或 tanA＞0 且 tanB＞0

    $\Rightarrow$0°＜∠A，∠B＜90°

    ∴△ABC 必為銳角三角形

    (E)○：∵0＜tanAtanB ∴tanA＞0 且 tanB＞0$\Rightarrow$0°＜∠A，∠B＜90°

    又 tanAtanB＜1$\Rightarrow\frac{\sin A}{\cos A} \times \frac{\sin B}{\cos B}$＜1$\Rightarrow$sinAsinB＜cosAcosB

    $\Rightarrow$cosAcosB－sinAsinB＞0

    ∴cos（A＋B）＞0$\Rightarrow$0°＜∠A＋∠B＜90°$\Rightarrow$0°＜180°－∠C＜90°

    $\Rightarrow$90°＜∠C＜180°

    ∴∠C 為鈍角$\Rightarrow$△ABC 必為鈍角三角形

    故選(B)(C)(D)(E)'
