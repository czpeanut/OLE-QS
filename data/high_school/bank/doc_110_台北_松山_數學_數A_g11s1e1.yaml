  answer:
  - '3'
  answer_status: verified
  answer_source: answer_key
  explanation: '∵A＋B＋C＝π

    ∴A＋B＝π－C

    ∴tan（A＋B）＝tan（π－C）

    $\Rightarrow\frac{\tan A + \tan B}{1 - \tan A\tan B}$＝－tanC

    $\Rightarrow$tanA＋tanB＋tanC＝tanA tanB tanC

    又 tanA，tanB，tanC 成等差

    $\Rightarrow$tanA＋tanC＝2 tanB 代入上式

    ∴3 tanB＝tanA tanB tanC

    ∴tanA tanC＝3'
