- id: doc_110_台北_松山_數學_數A_g11s1e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: △ABC 中，cosA＝$- \frac{3}{5}$，cosB＝$\frac{24}{25}$，且$\overline{AC}$＝7，下列敘述何者正確？
  options:
  - label: A
    content: cosC＝$- \frac{4}{5}$
  - label: B
    content: sinC＝$\frac{3}{5}$
  - label: C
    content: $\tan \frac{C}{2}$＝$\frac{1}{3}$
  - label: D
    content: △ABC 周長為 37
  - label: E
    content: △ABC 面積為 42
  answer:
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵$\cos A = - \frac{3}{5}$，$\cos B = \frac{24}{25}$

    $\Rightarrow\sin A = \frac{4}{5}$，$\sin B = \frac{7}{25}$

    ∴cosC＝cos〔180°－（A＋B）〕＝－cos（A＋B）

    ＝－（cosAcosB－sinAsinB）

    ＝sinAsinB－cosAcosB

    ＝$\frac{4}{5} \times \frac{7}{25} - \left( - \frac{3}{5} \right) \times \frac{24}{25}$＝$\frac{100}{125}$＝$\frac{4}{5}$

    (B)○：∵cosC＝$\frac{4}{5}$ ∴sinC＝$\sqrt{1 - \cos ^{2}C}$＝$\sqrt{1 - \left( \frac{4}{5} \right) ^{2}}$＝$\frac{3}{5}$

    (C)○：∵$\tan \frac{C}{2}$＝$\frac{\sin \frac{C}{2}}{\cos \frac{C}{2}} \times \frac{2\sin \frac{C}{2}}{2\sin \frac{C}{2}}$＝$\frac{1 - \cos \left( 2 \times \frac{C}{2} \right)}{\sin \left( 2 \times \frac{C}{2} \right)}$＝$\frac{1 - \frac{4}{5}}{\frac{3}{5}}$＝$\frac{1}{3}$

    (D)╳：∵$\overline{AC}$＝7＝b，利用正弦定理

    ∴$\frac{a}{\sin A}$＝$\frac{b}{\sin B}$＝$\frac{c}{\sin C}\Rightarrow\frac{a}{\frac{4}{5}}$＝$\frac{7}{\frac{7}{25}}$＝$\frac{c}{\frac{3}{5}}\Rightarrow\begin{cases}a = 25 \times \frac{4}{5} = 20 \\ c = 25 \times \frac{3}{5} = 15\end{cases}$

    ∴周長＝$\overline{AB}$＋$\overline{BC}$＋$\overline{CA}$＝c＋a＋b＝15＋20＋7＝42

    (E)○：△ABC 面積為$\frac{1}{2}ab\sin C$＝$\frac{1}{2} \times 20 \times 7 \times \frac{3}{5}$＝42

    故選(B)(C)(E)'
