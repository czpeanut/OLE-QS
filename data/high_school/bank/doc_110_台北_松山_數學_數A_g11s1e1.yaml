- id: doc_110_台北_松山_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 關於函數 f（x）＝$\sqrt{3}\sin x + \cos x$圖形的敘述，下列選項何者正確？
  options:
  - label: A
    content: 振幅為 2
  - label: B
    content: 週期為π
  - label: C
    content: 與 y 軸恰相交於一點
  - label: D
    content: 對稱於原點
  - label: E
    content: 對稱於直線 x＝$\frac{\pi}{3}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵y＝f（x）＝$\sqrt{3}\sin x + \cos x$＝$2\left( \sin x \cdot \frac{\sqrt{3}}{2} + \cos x \cdot \frac{1}{2} \right)$＝$2\sin \left( x + \frac{\pi}{6} \right)$，振幅為 2

    (B)╳：週期＝2π

    (C)○：令 x＝0 ∴y＝$2\sin \left( 0 + \frac{\pi}{6} \right)$＝$2 \times \frac{1}{2}$＝1 ∴與 y 軸相交於（0，1）

    (D)╳：∵f（－x）＝$\sqrt{3}\sin (-x) + \cos (-x)$＝$- \sqrt{3}\sin x + \cos x$≠$- \sqrt{3}\sin x - \cos x$＝－f（x）

    ∴圖形不會對稱原點

    (E)○：$f\left( \frac{\pi}{3} \right)$＝$2\sin \left( \frac{\pi}{3} + \frac{\pi}{6} \right)$＝$2\sin \frac{\pi}{2}$＝2×1＝2 為波峰

    ∴y＝f（x）對稱直線 x＝$\frac{\pi}{3}$

    故選(A)(C)(E)'
