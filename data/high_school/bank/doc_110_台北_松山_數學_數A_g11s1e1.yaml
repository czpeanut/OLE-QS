    b＝2 sin35°cos35°＝sin（2×35°）＝sin70°＞sin45°＝$\frac{\sqrt{2}}{2}$

    c＝2 $sin^{2}$68°－1＝－（1－2 $sin^{2}$68°）＝－cos（2×68°）＝－cos136°＝－cos（90°＋46°）

    ＝sin46°＞sin45°＞$\frac{\sqrt{2}}{2}$

    d＝$\sqrt{\frac{1 - \cos 86^{^{\circ}}}{2}}$＝$\sqrt{\frac{2\sin ^{2}43^{^{\circ}}}{2}}$＝sin43°＜sin45°＝$\frac{\sqrt{2}}{2}$

