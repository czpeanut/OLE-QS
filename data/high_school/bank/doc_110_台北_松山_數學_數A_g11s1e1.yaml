- id: doc_110_台北_松山_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: y＝sin2x 的圖形可以經由下列哪些函數的圖形平移後而得？
  options:
  - label: A
    content: y＝－sin2x
  - label: B
    content: y＝cos2x
  - label: C
    content: y＝sin（x＋2）
  - label: D
    content: y＝－cos2x＋1
  - label: E
    content: y＝$2\sin 2\left( x - \frac{\pi}{3} \right) + 1$
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵y＝－sin2x＝sin（－2x）＝sin（π＋2x）＝$\sin \left[ 2\left( x + \frac{\pi}{2} \right) \right]$

    ∴y＝sin2x $\xrightarrow[\frac{\pi}{2}單位]{向左平移}$ y＝$\sin \left[ 2\left( x + \frac{\pi}{2} \right) \right]$

    (B)○：∵y＝cos2x＝cos（－2x）＝$\sin \left[ \frac{\pi}{2} - (- 2x) \right]$＝$\sin \left( 2x + \frac{\pi}{2} \right)$＝$\sin \left[ 2\left( x + \frac{\pi}{4} \right) \right]$

    ∴y＝sin2x $\xrightarrow[\frac{\pi}{4}單位]{向左平移}$ y＝$\sin \left[ 2\left( x + \frac{\pi}{4} \right) \right]$

    (C)╳：∵y＝sin2x 的週期＝$\frac{2\pi}{\left| 2 \right|}$＝π，而 y＝sin（x＋2）的週期＝2π

    ∴y＝sin2x 無法平移至 y＝sin（x＋2）

    (D)○：∵y＝－cos2x＋1＝$- \sin \left( \frac{\pi}{2} - 2x \right) + 1$＝$\sin \left( 2x - \frac{\pi}{2} \right) + 1$

    ＝$\sin \left( 2x + \frac{3\pi}{2} \right) + 1$＝$\sin \left[ 2\left( x + \frac{3\pi}{4} \right) \right] + 1$

    ∴y＝sin2x $\xrightarrow[\frac{3\pi}{4}單位]{向左平移}$ y＝$\sin \left[ 2\left( x + \frac{3\pi}{4} \right) \right]\xrightarrow[1單位]{向上平移}$ y＝$\sin \left[ 2\left( x + \frac{3\pi}{4} \right) \right]$＋1

    (E)╳：∵y＝sin2x 的振幅為 1，而 y＝$2\sin \left[ 2\left( x - \frac{\pi}{3} \right) \right]$＋1 的振幅為 2

    ∴y＝sin2x 無法平移至 y＝$2\sin \left[ 2\left( x - \frac{\pi}{3} \right) \right]$＋1

    故選(A)(B)(D)'
