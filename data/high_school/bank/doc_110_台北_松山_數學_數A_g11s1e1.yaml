  - label: D
    content: a＞c＞b＞d
  - label: E
    content: a＞b＞c＞d
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '∵1 弳$\approx$57.3°

    a＝cos1$\approx$cos57.3°＝sin32.7°＞0

    b＝cos2$\approx$cos114.6°＝cos（90°＋24.6°）＝－sin24.6°＜0

    c＝cos（3－π）＝cos（π－3）$\approx$cos（180°－171.9°）＝cos8.1°＝sin81.9°＞0

    d＝$\sin \left( 1 + \frac{7\pi}{2} \right)$＝$\sin \left( 1 + \frac{3\pi}{2} \right)\approx$sin（57.3°＋270°）＝sin（57.3°－90°）＝－sin（90°－57.3°）

    ＝－sin32.7°＜0

    ∴由大至小分別為 c＞a＞b＞d，故選(B)'
