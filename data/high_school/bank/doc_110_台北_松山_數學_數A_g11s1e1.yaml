- id: doc_110_台北_松山_數學_數A_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 廣義角θ為第二象限角，且 sinθ＝$\frac{3}{5}$，試問下列選項何者正確？
  options:
  - label: A
    content: cosθ＝$\frac{4}{5}$
  - label: B
    content: tanθ＝$\pm \frac{3}{4}$
  - label: C
    content: $\sin \frac{\theta}{2}$＝$- \frac{3\sqrt{10}}{10}$
  - label: D
    content: $\cos \frac{\theta}{2}$＝$\frac{\sqrt{10}}{10}$
  - label: E
    content: $\tan \frac{\theta}{2}$＝3
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：∵θ為第二象限角，sinθ＝$\frac{3}{5}$

    ∴cosθ＝$- \sqrt{1 - \sin ^{2}\theta}$＝$- \sqrt{1 - \left( \frac{3}{5} \right) ^{2}}$＝$- \sqrt{\frac{16}{25}}$＝$- \frac{4}{5}$

    (B)╳：tanθ＝$\frac{\sin \theta}{\cos \theta}$＝$\frac{\frac{3}{5}}{- \frac{4}{5}}$＝$- \frac{3}{4}$

    (C)╳：∵θ為第二象限角

    ∴360°n＋90°＜θ＜360°n＋180°

    $\Rightarrow$180°n＋45°＜$\frac{\theta}{2}$＜180°n＋90°

    若 n＝0，則 45°＜$\frac{\theta}{2}$＜90° ∴$\frac{\theta}{2}$為第一象限角

    若 n＝1，則 225°＜$\frac{\theta}{2}$＜270° ∴$\frac{\theta}{2}$為第三象限角

    ∴$\sin \frac{\theta}{2}$＝$\pm \sqrt{\frac{1 - \cos \theta}{2}}$＝$\pm \sqrt{\frac{1 + \frac{4}{5}}{2}}$＝$\pm \sqrt{\frac{9}{10}}$＝$\pm \frac{3\sqrt{10}}{10}$

    (D)╳：$\cos \frac{\theta}{2}$＝$\pm \sqrt{\frac{1 + \cos \theta}{2}}$＝$\pm \sqrt{\frac{1 + \left( - \frac{4}{5} \right)}{2}}$＝$\pm \sqrt{\frac{1}{10}}$＝$\pm \frac{\sqrt{10}}{10}$

    (E)○：$\tan \frac{\theta}{2}$＝$\frac{\sin \frac{\theta}{2}}{\cos \frac{\theta}{2}} \times \frac{2\sin \frac{\theta}{2}}{2\sin \frac{\theta}{2}}$＝$\frac{1 - \cos \theta}{\sin \theta}$＝$\frac{1 - \left( - \frac{4}{5} \right)}{\frac{3}{5}}$＝$\frac{\frac{9}{5}}{\frac{3}{5}}$＝3

    故選(E)'
