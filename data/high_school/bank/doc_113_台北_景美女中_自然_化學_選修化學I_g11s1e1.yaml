  stem: 下列有關反應熱之敘述，何者正確？
  options:
  - label: A
    content: 反應熱為分子熱含量變化的表現
  - label: B
    content: 反應熱的標準狀態是 0 ℃、1 atm，符號記作 H °
  - label: C
    content: 同一可逆反應中，正反應和逆反應之反應熱大小相等，符號相同
  - label: D
    content: 如果反應熱為正值，則為吸熱反應，該反應不可能發生
  - label: E
    content: 反應熱和起始狀態、最終狀態以及物質變化的途徑有關
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B)反應熱的標準狀態是 25 ℃、1 atm，記為 ΔH °。

    (C)同一可逆反應中，正反應和逆反應之反應熱大小相等，符號相反。

    (D) ΔH＞0 為吸熱反應，自然情況下，吸熱與放熱的反應都可能發生。

    (E)反應熱與反應物、產物的溫度、壓力、狀態及位能有關，與反應途徑無關；亦即反應熱與起始狀態、最終狀態有關，而與反應路徑無關。'
