- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e1_s2_26
  section: 2
  number: 26
  type: multiple
  page: 5
  stem: 液態水的莫耳生成熱為－285.8 kJ，水的莫耳汽化熱為 44 kJ，2 mol 液態過氧化氫分解成氧氣與液態水時，放出 196.4 kJ 的能量，則下列敘述哪些正確？
  options:
  - label: A
    content: 當 1 g 的液態過氧化氫分解成氧氣和液態水時，可放出 2.89 kJ 的能量
  - label: B
    content: 液態過氧化氫的莫耳生成熱為－187.6 kJ
  - label: C
    content: 當 2 mol 氫完全燃燒時，可放出 285.8 kJ 的能量
  - label: D
    content: 液態過氧化氫分解為水及氧氣的熱化學反應式，ΔH 應為負值
  - label: E
    content: 當 1 g 氫氣完全燃燒生成水蒸氣時，可放出 142.9 kJ 的能量
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '依題意知：$H_{2}$(g)＋$\frac{1}{2}O_{2}$(g) → $H_{2}$O(l) ΔH＝－285.8 kJ ………①

    $H_{2}$O(l) → $H_{2}$O(g) ΔH＝＋44 kJ……………………②

    $2H_{2}O_{2}$(l) → $2H_{2}$O(l)＋$O_{2}$(g) ΔH＝－196.4 kJ ……③

    (A)$\frac{1}{34}$×$\frac{196.4}{2}$＝2.89（kJ）

    (B)由式③反應熱（ΔH）＝（生生）－（反生）代入

    －196.4＝（－285.8）×2－（$H_{2}O_{2}$ 莫耳生成熱）×2

    ∴$H_{2}O_{2}$ 之莫耳生成熱＝－187.6 kJ

    (C)由式①ΔH＝（$H_{2}$(g) 莫耳燃燒熱）×2＝（－285.8）×2＝－571.6（kJ）。

    (D)放熱反應 ΔH 為負值。

    (E)將式①＋式②得 $H_{2}$(g)＋$\frac{1}{2}O_{2}$(g) → $H_{2}$O(g) ΔH＝－241.8 kJ

    ∴1 g $H_{2}$(g) 完全燃燒產生水蒸氣時，放熱 241.8×$\frac{1}{2}$＝120.9（kJ）。'
