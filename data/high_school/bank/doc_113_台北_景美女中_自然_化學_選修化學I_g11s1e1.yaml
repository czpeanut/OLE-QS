- id: doc_113_台北_景美女中_自然_化學_選修化學I_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '為了遏制地球暖化日趨嚴重，世界各國政府分別訂定相關政策，某些國家研擬開徵碳排放稅之方式來抑制國內產生更多的溫室氣體。若你是一名工廠老闆，想讓工廠降低碳排放稅的繳交，同時又能夠提供足夠的能量，下列五種燃料，會選擇哪一種？

    | 選 項 | 燃 料 | 分子量 | 莫耳燃燒熱（kJ/mol） |

    | --- | --- | --- | --- |

    | A | 甲烷（$CH_{4}$） | 16 | －890 |

    | B | 乙烷（$C_{2}H_{6}$） | 30 | －1560 |

    | C | 丙烷（$C_{3}H_{8}$） | 44 | －2220 |

    | D | 丁烷（$C_{4}H_{10}$） | 58 | －2880 |

    | E | 戊烷（$C_{5}H_{12}$） | 72 | －3500 |'
  options:
  - label: A
    content: A
  - label: B
    content: B
  - label: C
    content: C
  - label: D
    content: D
  - label: E
    content: E
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '假設皆產生熱量為 x，則各自所產生的 $CO_{2}$ 莫耳數為：

    (A) $\frac{x}{890}$×1。(B) $\frac{x}{1560}$×2。(C) $\frac{x}{2220}$×3。(D) $\frac{x}{2880}$×4。(E) $\frac{x}{3500}$×5。

    故(A)＜(B)＜(C)＜(D)＜(E)。'
