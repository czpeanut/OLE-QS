  stem: '在 25 ℃、1 atm 下，已知下列各熱化學方程式：

    ① $H_{2}$O(l) → $H_{2}$O(g) ΔH＝＋44 kJ……；

    ② $2H_{2}$(g)＋$O_{2}$(g) → $2H_{2}$O(l) ΔH＝－572 kJ……；

    ③ C(s)＋$2H_{2}$(g) → $CH_{4}$(g) ΔH＝－75 kJ……；

    ④ C(s)＋$O_{2}$(g) → $CO_{2}$(g) ΔH＝－394 kJ……，

    則在該溫度及壓力下，將 1 莫耳甲烷完全氧化，生成水蒸氣和二氧化碳的反應熱 （ΔH）為多少 kJ？'
  options:
  - label: A
    content: －561
  - label: B
    content: －605
  - label: C
    content: －803
  - label: D
    content: －891
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)先將式①②合併：②＋①×2 得

    $2H_{2}$(g)＋$O_{2}$(g) → $2H_{2}$O(g) ΔH＝（－572）＋2×(44)＝－484（kJ）

    故 $H_{2}$O(g) 之莫耳生成熱＝－242 kJ

    (2)甲烷氧化： $CH_{4}$(g)＋$2O_{2}$(g) → $CO_{2}$(g)＋$2H_{2}$O(g)

    莫耳生成熱：－75 0 －394 －242

    由 ΔH＝生生－反生＝［（－394）×1＋（－242）×2］－［（－75）×1＋0×2］＝－803（kJ）'
