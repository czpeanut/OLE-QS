- id: doc_109_新竹_新竹高中_自然_生物_g10s2e2_s4_41
  section: 4
  number: 41
  type: single
  page: 4
  stem: 若有一男性罹患甲型血友病，則關於此男性的家族遺傳推論，下列何者正確？
  options:
  - label: A
    content: 其母親必為甲型血友病患者
  - label: B
    content: 其女兒必為甲型血友病患者
  - label: C
    content: 致病基因遺傳自父親
  - label: D
    content: 致病基因可能遺傳自外公或外婆
  group_stem: 凝血是指血液由液體狀態轉換為固體的過程，正常人體血液中，肝臓會不斷產生不具活性的凝血酶原，當出現傷口時，受傷的訊息會使一連串的凝血因子蛋白被活化，使得凝血酶原活化為有活性的凝血酶，凝血酶再將血液中的血纖維蛋白活化，與血球組合在一起，成為血餅（血塊）。血友病泛指人體血液中缺乏部分凝血因子蛋白，導致無法凝血的疾病，使病人傷口不易癒合、易瘀青、腦出血與關節積血。根據患者缺乏的凝血因子類型，主要可分為甲型、乙型與丙型三種，甲型缺乏第八因子，乙型缺乏第九因子，而丙型缺乏第十一因子。大多數患者為甲型與乙型，丙型極為罕見，甲型與乙型均為X染色體隱性遺傳，丙型則為體染色體遺傳，目前血友病沒有可根治的治療方式，但可籍由補充凝因子來預防或治療出血狀況，這些凝血因子可能是由健康人體血清中分離出來，或是由基因工程產生，但長期使用凝血因子為藥物治療下可能造成病患對凝血因子產生抗體，抗體會與施打進入體内的凝血因子相接，使凝血因子失去作用，因此，可使用部分替代產品如豬的第八因子。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
