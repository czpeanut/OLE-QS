  stem: 若二元二次方程式 $x^{2}$＋$y^{2}$＋4x＋ky＋k＋3＝0 的圖形為一個點，則 k＝？
  options:
  - label: A
    content: '2'
  - label: B
    content: '1'
  - label: C
    content: －1
  - label: D
    content: －2
  - label: E
    content: $\frac{-1\pm \sqrt{3}}{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$x^{2}$＋$y^{2}$＋4x＋ky＋k＋3＝0 ⇒（x＋2）$^{2}$＋$\left( y+\frac{k}{2} \right) ^{2}$＝－k－3＋$2^{2}$＋$\left( \frac{k}{2} \right) ^{2}$

    ∵圖形為一個點

    ∴－k－3＋4＋$\frac{k^{2}}{4}$＝0 ⇒ $k^{2}$－4k＋4＝0

    ⇒（k－2）$^{2}$＝0 ⇒ k＝2

    故選(A)'
