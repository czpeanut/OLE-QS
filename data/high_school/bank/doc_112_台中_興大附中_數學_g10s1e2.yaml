- id: doc_112_台中_興大附中_數學_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 在坐標平面上，直線 L 過點 P（－3，6）且與圓 C：（x＋1）$^{2}$＋（y－4）$^{2}$＝3 相交於點 A、點 B，當弦長$\overline{AB}$有最大值 k 時，此時直線 L 的斜率為 m，則 k＋m＝？
  options:
  - label: A
    content: $2\sqrt{3}$＋1
  - label: B
    content: $2\sqrt{3}$－1
  - label: C
    content: '7'
  - label: D
    content: '5'
  - label: E
    content: $\frac{7}{2}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '（x＋1）$^{2}$＋（y－4）$^{2}$＝3 表圓心（－1，4），半徑為$\sqrt{3}$的圓

    當$\overline{AB}$為直徑時，表示弦長$\overline{AB}$有最大值$2\sqrt{3}$⇒ k＝$2\sqrt{3}$

    此時圓心（－1，4）為直線 L 上一點

    又直線 L 過點 P（－3，6）

    ∴m＝$\frac{4-6}{-1-(-3)}$＝－1 ⇒ k＋m＝$2\sqrt{3}$－1

    故選(B)'
