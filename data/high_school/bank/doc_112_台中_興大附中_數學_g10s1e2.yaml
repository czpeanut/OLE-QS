- id: doc_112_台中_興大附中_數學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 在坐標平面上，A（－1，3），B（5，7），下列何者為$\overline{AB}$的中垂線方程式？
  options:
  - label: A
    content: 2x－3y＋11＝0
  - label: B
    content: 2x＋3y－19＝0
  - label: C
    content: 3x－2y＋4＝0
  - label: D
    content: 3x＋2y－16＝0
  - label: E
    content: 3x＋2y－3＝0
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 L 為$\overline{AB}$的中垂線，且$\overset{\leftarrow \rightarrow}{AB}$、直線 L 的斜率分別為 $m_{AB}$、$m_{L}$

    ∵$m_{AB}$＝$\frac{7-3}{5-(-1)}=\frac{2}{3}$

    又 L$\perp\overset{\leftarrow \rightarrow}{AB}$⇒ $m_{L}$．$m_{AB}$＝－1

    ∴$m_{L}$＝$-\frac{3}{2}$

    又$\overline{AB}$中點（2，5）為 L 上一點

    ⇒ L：y－5＝$-\frac{3}{2}$（x－2）⇒ 3x＋2y－16＝0

    故選(D)'
