- id: doc_112_台中_興大附中_數學_g10s1e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 在坐標平面上，下列哪些選項正確？
  options:
  - label: A
    content: 直線 4x＋3＝0 的斜率為 4
  - label: B
    content: 直線 2x＋6y＋5＝0 的斜率為$\frac{1}{3}$
  - label: C
    content: （2，4）、（6，3）、（14，1）三點在同一直線上
  - label: D
    content: 直線 3x＋y＋2＝0 與直線 x＋3y＋5＝0 互相垂直
  - label: E
    content: 恰通過第一、第四象限的直線，其斜率為 0
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：直線 4x＋3＝0 的斜率不存在

    (B) ╳：直線 2x＋6y＋5＝0 的斜率為$-\frac{2}{6}=-\frac{1}{3}$

    (C) ○：令 A（2，4），B（6，3），C（14，1）

    ∵$m_{AB}$＝$\frac{3 - 4}{6 - 2}$＝$\frac{1 - 3}{14 - 6}$＝$m_{BC}$ ∴三點共線

    (D) ╳：直線 3x＋y＋2＝0 的斜率為$-\frac{3}{1}$＝－3

    直線 x＋3y＋5＝0 的斜率為$-\frac{1}{3}$

    ∵－3×$\left( -\frac{1}{3} \right)$≠－1 ∴兩直線非互相垂直

    (E) ╳：反例：直線 x－2＝0 恰通過第一、第四象限，但其斜率不存在

    （$■註$：恰通過第一、第二象限的直線斜率方為 0）

    故選(C)'
