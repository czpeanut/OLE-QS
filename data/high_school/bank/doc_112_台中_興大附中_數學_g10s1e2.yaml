- id: doc_112_台中_興大附中_數學_g10s1e2_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 在坐標平面上，直線 L 的方程式為 kx＋y＝4＋k，其中 k 為實數。下列哪些選項正確？
  options:
  - label: A
    content: 不論 k 為何值，直線 L 恆過點（1，4）
  - label: B
    content: 直線 L 的斜率為 k
  - label: C
    content: 直線 L 的 y 截距為 4＋k
  - label: D
    content: 若 $kx_{0}$＋$y_{0}$＞4＋k，則不論 k 為何值，點（$x_{0}$，$y_{0}$）與點（1，3）在 L 的異側
  - label: E
    content: 若 L 與兩坐標軸所圍的三角形面積為 4，則滿足條件之直線 L 有 2 條
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：（1，4）代入左式得 k＋4 恆等於右式 ⇒ 直線 L 恆過點（1，4）

    (B) ╳：直線 L 的斜率為$-\frac{k}{1}$＝－k

    (C) ○：將 x＝0 代入得 y＝4＋k ⇒ L 的 y 截距為 4＋k

    (D) ○：$kx_{0}$＋$y_{0}$＞4＋k ⇒ $kx_{0}$＋$y_{0}$－4－k＞0

    ∵〔k＋3－（4＋k）〕×〔$kx_{0}$＋$y_{0}$－（4＋k）〕＝（－1）×（$kx_{0}$＋$y_{0}$－4－k）＜0

    ∴點（$x_{0}$，$y_{0}$）與點（1，3）在 L 的異側

    (E) ○：當 k＝0 時，L 為水平線，無法與兩坐標軸圍成三角形

    當 k≠0 時，y＝0 代入得 kx＝4＋k ⇒ x＝$\frac{4+k}{k}$⇒ L 的 x 截距為$\frac{4+k}{k}$

    承(C)，L 的 y 截距為 4＋k ⇒ 三角形面積為$\frac{1}{2}\times \left| \frac{4+k}{k} \right| \times \left| 4+k \right|$＝4 ⇒$\frac{| 4+k | ^{2}}{| k |}$＝8

    ⇒∣4＋k∣$^{2}$＝8∣k∣，有下列兩種狀況：

    ① 當 k＞0 時，$k^{2}$＋8k＋16＝8k ⇒ $k^{2}$＝－16，無解

    ② 當 k＜0 時，$k^{2}$＋8k＋16＝－8k ⇒ $k^{2}$＋16k＋16＝0

    ⇒ k＝$\frac{-16\pm \sqrt{256 - 64}}{2}$＝－8 ±$4\sqrt{3}$

    ∴此時 k 有兩解

    由①、② 得，滿足條件之直線 L 有 2 條

    故選(A)(C)(D)(E)'
