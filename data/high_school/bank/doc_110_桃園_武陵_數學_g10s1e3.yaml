  stem: 二次函數 y＝f（x）＝$ax^{2}$＋bx＋c 在下列哪些條件下，其頂點會落在第三象限內？
  options:
  - label: A
    content: a＜0，b＞0，$b^{2}$－4ac＞0
  - label: B
    content: a＜0，b＜0，$b^{2}$－4ac＜0
  - label: C
    content: a＞0，b＞0，c＜0
  - label: D
    content: a＞0，b＜0，c＜0
  - label: E
    content: a＜0，b＞0，c＞0
  answer:
  - B
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_110_桃園_武陵_數學_g10s1e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 設 f（x）為次數不小於三次之多項式，以（x－a）（x－b）、（x－b）（x－c）、 （x－c）（x－a）除 f（x）之餘式分別為 3x－1、x＋1、2x＋3，則下列哪些選項是正確的？
  options:
  - label: A
    content: a＜0
  - label: B
    content: b＞0
  - label: C
    content: c＞0
  - label: D
    content: a＋b－c＝3
  - label: E
    content: a＋b＋c＝3
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝（x－a）（x－b）$Q_{1}$（x）＋（3x－1）……………①

    ＝（x－b）（x－c）$Q_{2}$（x）＋（x＋1） ……………②

    ＝（x－c）（x－a）$Q_{3}$（x）＋（2x＋3）……………③

    由①、③得 f（a）＝3a－1＝2a＋3 ⇒ a＝4

    由①、②得 f（b）＝3b－1＝b＋1 ⇒ b＝1

    由②、③得 f（c）＝c＋1＝2c＋3 ⇒ c＝－2

    故選(B)(E)'
