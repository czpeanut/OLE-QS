  stem: 已知聯立不等式$\begin{cases}-x^{2}+ 5x - b\leq 0 \\ x^{2}+ ax - 4 < 0\end{cases}$的解為－1＜x ≤ 2 或 3 ≤ x＜4，求數對（a，b）＝＿＿＿＿。
  answer:
  - （－3，6）
  answer_status: verified
  answer_source: answer_key
  explanation: '① 由 x ≤ 2 及 3 ≤ x ⇒（x－2）（x－3）≥ 0 ⇒ $x^{2}$－5x＋6 ≥ 0 ⇒－$x^{2}$＋5x－6 ≤ 0

    與－$x^{2}$＋5x－b ≤ 0 同義 ∴b＝6

    ② 由－1＜x 及 x＜4 ⇒（x＋1）（x－4）＜0 ⇒ $x^{2}$－3x－4＜0

    與 $x^{2}$＋ax－4＜0 同義 ∴a＝－3

    所求數對（a，b）＝（－3，6）'
