- id: doc_110_桃園_武陵_數學_g10s1e3_s2_5
  section: 2
  number: 5
  type: fill
  page: 1
  stem: 若 f（x）＝$ax^{2}$＋3bx－7 在 x＝3 時有最大值$\frac{-2}{a}$，則 ab＝＿＿＿＿。
  answer:
  - －2
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$ax^{2}$＋3bx－7＝a（x－3）$^{2}$＋$\frac{-2}{a}$，且 a＜0

    ⇒ $ax^{2}$＋3bx－7＝a（$x^{2}$－6x＋9）＋$\frac{-2}{a}$

    ⇒$\begin{cases}3b =-6a \cdots \cdots \cdots \cdots \cdots ① \\ -7 =9a +\frac{-2}{a}\cdots \cdots \cdots \cdots \cdots ②\end{cases}$

    由②得－7a＝$9a^{2}$－2 ⇒ $9a^{2}$＋7a－2＝0

    ⇒（a＋1）（9a－2）＝0 ⇒ a＝－1 或$\frac{2}{9}$（不合）

    代入①得 b＝－2a＝2

    ∴ab＝（－1）(2)＝－2'
- id: doc_110_桃園_武陵_數學_g10s1e3_s2_6
  section: 2
