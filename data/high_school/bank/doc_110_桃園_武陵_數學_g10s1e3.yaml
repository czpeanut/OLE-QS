  stem: 若 deg f（x）≥ 3，已知 f（x）有 x＋1 的因式，且 f（x）除以 $x^{2}$＋x＋1 的餘式為 5x－3，則 2 f（x）－5 除以（x＋1）（$x^{2}$＋x＋1）的餘式為＿＿＿＿。
  explanation: 'f（x）＝（x＋1）$Q_{1}$（x） ……………………………………………………………①

    ＝（$x^{2}$＋x＋1）$Q_{2}$（x）＋（5x－3）

    設 f（x）＝（x＋1）（$x^{2}$＋x＋1）$Q_{3}$（x）＋a（$x^{2}$＋x＋1）＋（5x－3）……………②

    由①、②得 f（－1）＝0＝a－8 ⇒ a＝8

    ∴f（x）＝（x＋1）（$x^{2}$＋x＋1）$Q_{3}$（x）＋8（$x^{2}$＋x＋1）＋（5x－3）

    ⇒ 2f（x）－5＝2〔（x＋1）（$x^{2}$＋x＋1）$Q_{3}$（x）＋8（$x^{2}$＋x＋1）＋（5x－3）〕－5

