questions:
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: '我國《民法》有幾項條文將於明年(民國112年1月1日)施行，包含有：

    §12滿十八歲為成年。

    §13未滿七歲之未成年人，無行為能力。滿七歲以上之未成年人，有限制行為能力。

    $973男女未滿十七歲者，不得訂定婚約。

    $980男女未滿十八歲者，不得結婚。

    請問以上修改的條文，主要擴張了18歲以上未滿20歲者的何種權利？'
  options:
  - label: A
    content: 自由權
  - label: B
    content: 政治權
  - label: C
    content: 社會權
  - label: D
    content: 文化權
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 聯合國大會於1948年通過了《世界人權宣言》又於1966年通過《公民與政治權利國際公約》及《經濟社會與文化權利國際公約》，關於上述三份文件，下列敘述何者正確？
  options:
  - label: A
    content: 因我國非聯合國會員，故我國未簽署及推動兩公約的相關權利保障事務
  - label: B
    content: 《世界人權宣言》及兩公約對締約國皆具有強制性的法律約束力
  - label: C
    content: 《公民與政治權利國際公約》的規範內容強調國家應積極提供人民良好的生活環境
  - label: D
    content: 《世界人權宣言》及兩公約合稱為「國際人權法典」或「國際人權憲章」
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 我國國籍取得之途徑採「折衷主義」。請問，下列何人尚<u>無法</u>取得我國國籍？
  options:
  - label: A
    content: 寶寶出生時被遺棄在嘉義市聖馬醫院，不知道父母是誰
  - label: B
    content: 李先生是我國國民，女兒小花為他與英國人一同生下的
  - label: C
    content: 儒儒的父母是美國人，選擇在美麗的台灣將他生下
  - label: D
    content: 小英原是泰國人，後被我國國民收養，已申請歸化完成
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 於今年11月26日，我國將舉行九合一大選及十八歲公民權的修憲複決案，此為我國政治上很大的突破，以下關於我國民主化的發展，何者正確？
  options:
  - label: A
    content: 於民國81年，修正《刑法》§100，保障集會遊行自由
  - label: B
    content: 於民國85年，第一次直選總統，由李登輝先生當選
  - label: C
    content: 於民國92年，公布施行《公民投票法》，落實了選舉、罷免等權利
  - label: D
    content: 我國目前已達Huntington所言之民主鞏固，他認為一國要達三次以上政黨輪替，才算是真正的民主國家
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國人民李明哲先生，現為文山社區大學的員工，李明哲關注中國人權與中國民主運動，多年來支持中國大陸公民社會組織和行動者，因得知在中國大陸的朋友有閱讀人權、近代史相關書籍的需求而曾自費寄贈文學與社會科學類書籍。而李明哲先生於2017年3月入境中國大陸時被捕，後遭中國大陸當局起訴，並判處5年有期徒刑，目前已於2022年4月被釋放回台。以下相關敘述，何者正確？
  options:
  - label: A
    content: 中國大陸目前在《中華民國憲法增修條文》中，屬於「自由地區」
  - label: B
    content: 我國之事實主權目前及於「大陸地區」及「自由地區」
  - label: C
    content: 李明哲先生為堅持政治信念而被捕之政治良心犯
  - label: D
    content: 目前所有我國人民都認為兩岸間維持現狀是最好的選擇
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 自2020年起，為因應COVID-19疫情以來，我國政府常以管控出入境為一控制疫情之重要手段，請問我國政府得以限制出入境之對象，是基於以下哪一理由？
  options:
  - label: A
    content: 擁有警察及軍隊之武力
  - label: B
    content: 具有對內最高的統治權力
  - label: C
    content: 因清廉得以讓國內外人民信賴
  - label: D
    content: 因獲國際組織授權而有權管理
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 一國政府治理國家時，若能同時具備合法性與正當性，國家的運作將能更為順利，以下關於統治的合法性和正當性的敘述，何者正確？
  options:
  - label: A
    content: 合法性為政府的作為受到人民的接受及認可
  - label: B
    content: 正當性為政府的作為合乎法律的規定及要求
  - label: C
    content: 我國於動員戡亂時期，中央民代並未定期改選，但其是依據《中華民國憲法》和《動員戡亂時期臨時條款》來運作的，故符合統治的合法性。
  - label: D
    content: 我國於動員戡亂時期，中央民代並未定期改選，但其是依據《中華民國憲法》和《動員戡亂時期臨時條款》來運作的，故符合統治的正當性
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 我國並非聯合國的會員國，無法成為國際人權公約的締約國·故我國常利用其他方法來落實相關的主張。請選出正確的選項：(甲)邀請聯合國人權事務高級專員來台個別審查(乙)將國際人權公約國內法化(丙)建立在地的報告審查機制(丁)落實國內各項法規以符合公約規範
  options:
  - label: A
    content: 甲乙丙丁
  - label: B
    content: 甲乙丙
  - label: C
    content: 乙丙丁
  - label: D
    content: 甲乙丁
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 關於現代主權國家的發展，以下敘述何者正確？
  options:
  - label: A
    content: 起源於16世紀的亞洲
  - label: B
    content: 因《西發里亞條約》而被確立
  - label: C
    content: 由人民主權轉為君主主權
  - label: D
    content: 主權概念為「對內獨立，對外最高」
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 聯合國致力於促進普世人權的實現，請問下列敘述何者正確？
  options:
  - label: A
    content: 聯合國安全理事會針對會員國的人權狀況進行調查，處理各地違反人權的危機
  - label: B
    content: 舉行各種活動來聲援人權受侵害者，如寫信馬拉松
  - label: C
    content: 每年皆會發表《世界自由調查報告》
  - label: D
    content: 通過《巴黎原則》，鼓勵各國政府設立超然獨立的國家人權委員會
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 我國憲法明文規定：「中華民國人民，無分男女、宗教、種族、階級、黨派·在法律上一律平等。」，而其實具有公民身分的權利主體並非一開始便是人人平等，以下關於權利主體的演變，何者正確？
  options:
  - label: A
    content: 公民身分起源於古希臘斯巴達城邦，為直接民主制
  - label: B
    content: 一開始的公民身分具有種族、性別、財產等限制
  - label: C
    content: 由法國思想家盧梭提出「自然權利說」，以對抗君權神授思想
  - label: D
    content: 公民身分的權利主體由具普遍性演變為具特殊性
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: '公民權利內涵的演變擁有其時代發展的脈絡，針對下表，請選出甲、乙、丙、丁、戊、己正確的對應內容。

    | 興起背景 | 甲 | 乙 | 丙 |

    | --- | --- | --- | --- |

    | 權利類型 | 丁 | 戊 | 己 |

    | 權利內涵 | 自由權、平等權、参政權 | 生存權、工作權、教育權 | 多元文化權、和平權、環境權 |'
  options:
  - label: A
    content: 甲：17-18世紀為對抗統治者不當干預，而發展出天賦人權思想；戊：消極人權
  - label: B
    content: 乙：18世紀因工業革命帶來的貧富差距，導致人們開始重視社會權；己：積極人權
  - label: C
    content: 丙：20世紀因少數族群面臨文化滅絕之危機，開始強調對於少數群體之保障
  - label: D
    content: 丁：指政府應積極提供人民良好的生活環境之各項權利
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 我國憲法及《中華民國憲法增修條文》中列有許多關於社會權及文化權之內容，請選出正確之選項。
  options:
  - label: A
    content: 國家應推行全民健康保險、國民年金保險
  - label: B
    content: 國家應重視社會救助、福利服務、國民就業、社會保險及醫療保健等社會福利工作，對於社會救助和國民就業等救濟性支出應優先編列
  - label: C
    content: 將「原住民族」稱之為「山胞」
  - label: D
    content: 我國憲法是採取直接修改憲法本文之修憲方式
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 於現代民主國家而言，公民身分常是國家認同的基礎，請選出符合的選項。
  options:
  - label: A
    content: 我國蔡英文總統：「台灣在幾十年前歷經民主化，從那時起，我們不斷努力鞏固民主，民主及其價值已成為我們身份認同不可或缺的一部分。」
  - label: B
    content: 緬甸民族主義者於20世紀初期流行著口號｢民族、語言、宗教!」聲明欲保護多數人的語言和宗教，也表明了緬甸社會運作的三大主軸，以對抗殖民者
  - label: C
    content: 日本人民共享了許多特定的傳統和文化，例如旅遊文化亦提升了「身為日本人」的共性，對於國家認同的形成具有重要意義
  - label: D
    content: 尤太人基於相信他們有著相同的血緣、民族及宗教，最後成功建國
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 以下關於主權國家的構成要素，哪一敘述正確？
  options:
  - label: A
    content: 構成要素有四，包含有主權、軍隊、人民及領土
  - label: B
    content: 一國的主權可能有兩個以上，視情況而定
  - label: C
    content: 一國的人民為擁有政治權的人們
  - label: D
    content: 一國的領土包含有領海、領陸及領空，為管轄權之範圍
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 請問上文中的○○應該是誰？
  options:
  - label: A
    content: 英國思想家Locke
  - label: B
    content: 美國學者Anderson
  - label: C
    content: 加拿大學者Taylor
  - label: D
    content: 第16任美國總統Lincon
  group_stem: '在正式進入論證之前，○○先為「民族」這個概念提出了一個充滿創意的定義：「它是一種想像的政治共同體──並且，它是被想像為本質上是有限的，同時也享有主權的共同體。」這個主觀主義的定義聰明地迴避了尋找民族的「客觀特徵」的濫仗，直指集體認同的「認知」面向──「想像」不是「捏造」，而是形成任何群體認同所不可或缺的認知過程，因此「想像的共同體」這個名稱指涉的不是什麼「虛假意識」的產物，而是一種社會、心理學上的「社會事實」。這個主觀/認知主義的定義界定了○○以後整個論證的基調，也就是要探究「民族」此種特殊的政治想像(認知)成為可能的條件與歷史過程。

    資料來源：https：//whogovernstw.org/'
- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 關於我國對於國際人權公約的報告審查機制，以下步驟請選出完全正確的選項。 步驟1：由政府提出國家報告；非政府組織提出影子報告步驟 2：審查委員會(由國內專家組成)提出問題清單步驟 3：政府就問題清單提出回應；非政府組織則回應步驟 4：審查委員會展開審查，並與政府及非政府組織討論步驟 5：專家發表結論性意見，具有強制力步驟 6：每4～5年進行一次審查，政府需作出前次結論的追蹤報告
  options:
  - label: A
    content: 步驟1、4、6
  - label: B
    content: 步驟1、2、4、6
  - label: C
    content: 步驟1、3、4、6
  - label: D
    content: 步驟1、4、5、6
