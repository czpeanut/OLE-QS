    content: 政府權力若來自被治者的同意，便可以保障人民幸福
  group_stem: (六)老1776年美國的《獨立宣言》是西方民主理論演進歷史上的重要文獻。在其〈前言〉中有以下一段文字：「……我們認為下面這些真理是不言而喻的：造物者創造了平等的個人，並賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利。為了保障這些權利，人們才在他們之間建立政府，而政府之正當權力，則來自被統治者的同意。任何形式的政府，只要破壞上述目的，人民就有權利改變或廢除它，並建立新政府；新政府賴以奠基的原則，得以組織權力的方式，都要最大可能地增進民眾的安全和幸福……」。
