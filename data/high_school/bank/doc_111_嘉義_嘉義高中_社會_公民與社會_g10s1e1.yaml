- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s2_49
  section: 2
  number: 49
  type: single
  page: 6
  stem: 請問上文中伊朗人民與政府的衝突核心為何？
  options:
  - label: A
    content: 民生經濟問題
  - label: B
    content: 信仰伊斯蘭教
  - label: C
    content: 強制性頭巾規定
  - label: D
    content: 醫療環境問題
  group_stem: '(九)伊朗80多個城鎮連日爆發反頭巾示威，不分男女老少都走上街頭。網路流傳的影片顯示，婦女在公共場合摘下頭巾，挑釁地揮舞著；她們披頭散髮，把頭巾扔進火堆，得到人群的歡呼。

    13日，首都德黑蘭22歲女子阿米尼(Mahsa Amini)因為違反頭巾法而被道德警察逮捕。16日，她離奇死亡，疑似拘留時遭毆打，當局卻宣稱她的死因與心臟病有關。年輕女孩只因頭巾沒戴好就慘死，伊朗民眾悲憤不已。連續好幾天，該國男人和女人上街要求「正義、自由、不要強制頭巾」，面對安全部隊的暴力鎮壓，他們共同死守街頭，甚至呼籲推翻這個伊斯蘭共和國政府。

    總統堅持女性應戴頭巾的態度很明確。在紐約參加聯合國大會的伊朗總統萊希(Ebrahim Raisi)，原預計要首度於美國本土接受媒體專訪，但由於他堅持要求女記者、CNN資深記者阿曼普爾(Christiane Amanpour)必須戴上頭巾，所以阿曼普爾決定取消專訪。

    伊朗政府正面臨來自國內外的執政壓力。但一些專家認為伊朗不太可能從此放棄伊斯蘭共和國最顯著的象徵──強制性頭巾規定。

    資料來源：風傳媒'
