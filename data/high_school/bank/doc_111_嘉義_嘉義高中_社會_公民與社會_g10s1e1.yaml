  group_stem: '原住民身分法第4條第2項規定：「原住民與非原住民結婚所生子女，從具原住民身分之父或母之姓或原住民傳統名字者，取得原住民身分。」中華民國97年12月3日修正公布同法第8條準用第4條第2項規定部分，暨110年1月27日修正公布同法第8條準用第4條第2項規定部分，違反憲法保障原住民身分認同權及平等權之意旨，均違憲。相關機關應於本判決宣示之日起2年內，依本判決意旨修正之。逾期未完成修法者，上開原住民身分法第4條第2項及110年1月27日修正公布同法第8條準用第4條第2項規定部分失效，原住民與非原住民結婚所生子女，取得原住民身分，並得辦理原住民身分及民族別登記。

