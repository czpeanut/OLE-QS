  group_stem: '在正式進入論證之前，○○先為「民族」這個概念提出了一個充滿創意的定義：「它是一種想像的政治共同體──並且，它是被想像為本質上是有限的，同時也享有主權的共同體。」這個主觀主義的定義聰明地迴避了尋找民族的「客觀特徵」的濫仗，直指集體認同的「認知」面向──「想像」不是「捏造」，而是形成任何群體認同所不可或缺的認知過程，因此「想像的共同體」這個名稱指涉的不是什麼「虛假意識」的產物，而是一種社會、心理學上的「社會事實」。這個主觀/認知主義的定義界定了○○以後整個論證的基調，也就是要探究「民族」此種特殊的政治想像(認知)成為可能的條件與歷史過程。

