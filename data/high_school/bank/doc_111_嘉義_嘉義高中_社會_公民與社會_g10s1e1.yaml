- id: doc_111_嘉義_嘉義高中_社會_公民與社會_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 台灣有許多公民自發性成立的非營利組織，已推動多項重大法律修正，促進人權落實，其重要成果包括犯罪嫌疑人人權以及集會遊行權保障等。以下對於公民組織的行動及其與人權保障的相關敘述何者正確？
  options:
  - label: A
    content: 人權保障為我國憲法核心內容，公民組織的介入顯示台灣的民主尚未鞏固
  - label: B
    content: 僅仰賴政府可能無法善盡人權保障，故需公民組織參與並推動相關立法及政策
  - label: C
    content: 公民組織關注人權的行動僅限於國內議題，無法涉及國際間人權事務保障
  - label: D
    content: 當公民組織推動人權法案未獲民眾支持時，表示該法案並不符合憲法宗旨
