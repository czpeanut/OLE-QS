  section: 2
  number: 32
  type: single
  page: 4
  stem: 聯合國難民事務高級專員蘭迪表示，應為世界各地難民和避難民眾提供更有力的支援。請問，各國政府及國際組織，針對需要協助的人們，給予受難者支援，如給予醫療、糧食、庇護等資源，屬於下列哪一行為的體現？
  options:
  - label: A
    content: 人道干預
  - label: B
    content: 人道救援
  - label: C
    content: 倡議人權
  - label: D
    content: 監督各國政府
  group_stem: '(二)聯合國難民署每年發布一次《全球趨勢報告》，並反映前一年的狀況。截止2021年底，共8,930萬人因衝突、暴力、恐懼受迫害和人權被侵犯而被迫逃離家園，較前一年增加690萬人，創下歷史新高。其中，難民輸出最多的國家及人數分別為：持續處於內戰狀態的中東國家敘利亞680萬人、政局長期混亂的南美國家委內瑞拉460萬人、去年由伊斯蘭主義組織塔利班掌握政權的阿富汗270萬人。

    此外，聯合國難民署還表示，加上今年2月俄羅斯入侵烏克蘭後逃離至他國的難民人數，全球流亡國外的難民和境內避難民眾的總數已超過1億人。

    聯合國難民事務高級專員格蘭迪(Filippo Grandi)對此表達強烈擔憂。他表示，應為包括烏克蘭在內的世界各地難民和避難民眾提供更有力的支援，並呼籲國際社會進一步加強相關合作。

    資料來源：https：//www3.nhk.or.jp/nhkworld/'
