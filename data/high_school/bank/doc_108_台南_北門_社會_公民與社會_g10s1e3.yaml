  stem: 蔡英文總統2016年上任後，推動轉型正義為其施政重點。其中，針對原住民族過往受到執者的迫害與歧視，蔡總統是第一個以國家元首身分向原住民族道歉的總統，並責成總統府成立原住民族歷史正義與轉型正義委員會，親任召集人。請問：促進原住民轉型正義有什麼意義？
  options:
  - label: A
    content: 消除大眾對其執政的疑慮
  - label: B
    content: 承認過去主流文化的壓迫
  - label: C
    content: 減少原住民族絕對剝奪感
  - label: D
    content: 回復原住民族昔日的光榮
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: 社會中擁有較多資源和權力者會將一個社會中不同的生活品味加以排序，形成文化位階現象。下列針對「文化位階」的敘述，何者「不」正確？
  options:
  - label: A
    content: 優勢團體將其他團體的文化界定為較差，以便維繫自己的優勢地位
  - label: B
    content: 透過文化位階使得各文化按照優劣程度進行區別，有助於文化交流
  - label: C
    content: 媒體常以既有的立場報導某些文化活動，並給予文化位階高低排序
  - label: D
    content: 對於和自己不同文化位階者給予不公平的對待，就會造成歧視現象
