- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 資訊爆炸的現代社會，大眾往往是透過媒體來認識世界，媒體決定了我們認知到世界與看待事物的觀點與角度，因此媒體對於閱聽大眾具有廣泛的影響力及重要性。下列何者是媒體發揮上述影響力的主因？
  options:
  - label: A
    content: 媒體對新聞事件的報導與評論通常既正確且客觀
  - label: B
    content: 媒體可經由其報導來設定公眾討論和關注的議題
  - label: C
    content: 自由的媒體保障人民享有公平且充分的言論自由
  - label: D
    content: 媒體為執政者宣導政策，是政府與人民間的橋梁
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 媒體會影響閱聽人的認知，「置入性行銷」的運作即是透過這個原理，以期達到行銷效果。請問下列何者屬於置入性行銷？(甲)媒體在未經證實下，便報導某種香料可根治過敏的效能；(乙)體育主播在作報導時，手裡拿著某品牌的籃球作為道具；(丙)某週刊深入報導高中多元化入學的實施狀況及各種爭議；(丁)電影中男女主角不論室內室外，皆戴某品牌的太陽眼鏡。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丙
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 我國《預算法》第61條之1規定：「基於行政中立、維護新聞自由及人民權益，政府各機關暨公營事業、政府捐助基金50％以上成立之財團法人及政府轉投資資本50％以上事業，編列預算辦理政策宣導，應明確標示其為廣告且揭示辦理或贊助機關、單位名稱。」請問此條文的目的應為何？
  options:
  - label: A
    content: 限制民間企業將產品或服務置入媒體
  - label: B
    content: 規範政府相關單位不得將廣告新聞化
  - label: C
    content: 政府機關應以中立立場維護新聞自由
  - label: D
    content: 伸張新聞自由攸關人民權益不可侵害
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在非洲豬瘟期間，傳出中國大陸感染非洲豬瘟的豬隻漂至金門，媒體得知後立刻採訪政府與相關人士，並將採訪內容經過篩選、過濾、潤飾後，轉為民眾易理解的報導，此過程突顯媒體的何項功能？
  options:
  - label: A
    content: 守門人角色
  - label: B
    content: 凝聚共識
  - label: C
    content: 評論曲直
  - label: D
    content: 媒體自律
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國大法官會議於釋字364號解釋文中，宣示每個人都有平等接近和使用媒體的權利。現在媒體界愈來愈重視《憲法》所賦予人民的權利，例如播報新聞節目的同時會在螢幕下方打上「當事人澄清專線0800-×××-×××」，使電視台可以更正錯誤的報導。請問這是憲法所賦予人民的哪一個權利？
  options:
  - label: A
    content: 知的權利
  - label: B
    content: 媒體使用權
  - label: C
    content: 媒體更正權
  - label: D
    content: 媒體答辯權
