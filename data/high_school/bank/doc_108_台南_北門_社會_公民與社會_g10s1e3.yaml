- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_34
  section: 1
  number: 34
  type: single
  page: 4
  stem: 在尼泊爾有一特有的文化現象「活女神制度」，由3到7歲的處女經過嚴苛的篩選過程脫穎而出，便可以成為被眾人景仰的童女神。一但被選為童女神必須放棄童年生活，不能輕易流露感情，也不能進行教育與同儕相處。人權組織提出此制度可能使兒童與婦女人權遭受侵害，儘管如此卻是尼泊爾不可或缺的存在。請從人權角度詮釋活女神制度是否應該廢除？
  options:
  - label: A
    content: 不應該，各國文化應受到絕對的保障，儘管是人權組織也不應干涉
  - label: B
    content: 不應該，人權組織的介入已違反多元文化主義的精神
  - label: C
    content: 應該，活女神制度太過於傳統不能與時俱進，因此應該廢除
  - label: D
    content: 應該，各國文化雖應受到尊重，但活女神制度恐違人權，已非尊重文化的界線
