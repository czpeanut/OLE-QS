  stem: 有鑑於原住民在國有林地採集植物，若未申請將會受罰。農業委員會與原住民族委員會頒布《原住民族依生活慣谷採取森林產物規則》，認為原住民族基於傳統文化、祭儀及非營利自用等生活慣俗，可在國有林地合法採取野生植物、菌類等森林產物。而條文中最大的特色是採取副產物自用免申請，除了少數受保護的植物以外，可自由採取森林野菜、野果、野草，只要帶著原住民身分證明文件備查即可，這也象徵未來「原住民族利用森林資源除罪化」邁出關鍵一步。請問乾條文保障原住民族的哪些權利？
  options:
  - label: A
    content: 平等權
  - label: B
    content: 文化權
  - label: C
    content: 生存權
  - label: D
    content: 自由權
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s2_1
  section: 2
  number: 1
  type: single
  page: 5
  stem: 下列哪一個現象最適於解釋上述英國、美國與法國國情發展的共同現象？
  options:
  - label: A
    content: 經濟衝突導致國家主權概念出現
  - label: B
    content: 跨國人權保障引發國家危機意識
  - label: C
    content: 大國利益與南北經濟衝突的糾結
  - label: D
    content: 國家利益與全球化趨勢間的對抗
  group_stem: '(一) 近年英國某些政治人物及民眾，不滿歐盟主導的區域整合所衍生的跨國移民與跨國就業問題，並批評歐洲政府及議會決策專斷，主張取回國家自主權；後來以公民投票通過脫離歐盟。而美國現任總統川普上任後，亦對多邊貿易組織與協定抱持懷疑態度，強調美國優先，受到不少民意支持；法國總統大選候選人瑪琳‧雷朋（Marine Le Pen）喊出「法國優先、反移民、脫歐」口號，這些經濟大國趨向貿易保護主義的作法，似乎違背了貿易全球化的潮流。事實上，全球化與反全球化的優劣利弊仍未有定論，更應視各國的發展背景與經貿情勢而定。 反全球化是種複雜的社會運動，主要訴求在經濟正義、環境保護、基本人權等議題，它結合全球各地工會組織、環境保護組織、反戰團體，甚至新自由主義者、性別平等主義者、無政府主義者也都依附於此運動中，他們動機多元，參與者涉及不同階層和許多行業，發展十分迅速，領域非常廣泛，其實這些人並不是反對全球化本身，而是反對經濟全球化帶來的弊端，本質上他們是反對資本主義全球化。 反全球化運動敲響了全球化的警鐘，它揭示的種種問題（諸如全球正義與生態環保），已造成各國政府和國際間反省跟重視。然而，反全球化跟全球化一樣，也是一把雙面刃，其作用有利的一面，也有不利的一面。從發展的視角看，全球領袖應理性思考下列3點：

    (1)貿易規則與發展需求間的不和諧，工業國家應牢記自己走過的發展歷程，要為發展中國家制定他們自己制度和迎頭趕上的戰略留下空間。

    (2)全球不宜過度吹噓貿易開放的好處，各國不一定能依靠貿易自由化來實現高速經濟成長，但這也不是說貿易保護會比貿易自由化優越。

    (3)民主、合理、公正的全球治理是必要的、迫切的。全球必須建立一套自願基礎促進發展的規則和標準，順應各國環境的貿易規則必須靈活。'
