  stem: '根據題文，全球化與反全球化的利弊仍未有定論，然而，反全球化運動敲響了全球化的警鐘，請根據題文所描述關於全球化與反全球化的論述。

    (二) 勞動基準法修正條文於2018年3月1日實施以來，因為許多容有鬆綁空間之處，勞基法皆要求需集體勞資協商同意。也就是若有工會必須工會同意，無工會者則需經勞資會議同意後，才可實施。 事實上，因為臺灣工會組織率低落，因此此次勞基法修正案，一方面是加重了勞資會議的重要性，二方面主管機關也一再強調，勞資會議務必合法召開。 然而在實際上，常由於勞資雙方對於勞動法令不熟悉，資方只管走完程序，細節不深究；而勞方也不清楚實際的規定為何與紅線在哪，往往只能順著主管意思而同意。 因此新法實施以來，透過很多朋友反應，我們已陸續聽到，以往沒有勞資會議、或只有紙本會議記錄的事業單位，有不少真的已由勞方選舉出勞方代表，也真的召開實際的勞資會議。然而，目的則是，「開一次會，把該通過的都通過」。提到勞資會議，以往在人們的想像中，多是認為反正勞資不對等，就算有開勞資會議也是資方說了算。此外，許多批評也指出，「勞資會議是開假的」，但就算是開真的呢？結果就會不同嗎？'
