- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 文中有關電視台對原住民族的負面報導，下列何項解讀可以說明此現象？
  options:
  - label: A
    content: 經由新聞媒體的傳播，更加遽文化歧視現象
  - label: B
    content: 原住民族文化相較於漢人文化，本來就較為劣等
  - label: C
    content: 媒體從業人員從文化相對論觀點，來報導新聞事件
  - label: D
    content: 因漢民族與原住民族文化品味的差異，形成文化位階
  group_stem: 某家新聞台曾經以「米酒降價，原住民又喝起紅標了」作為新聞標題，不經意地將酗酒者與原住民劃上等號。不僅如此，還有一家電視台，於報導政府派員到原住民家庭進行訪視時，竟出現「原住民見面先乾杯」的新聞畫面，又再度對社會大眾傳達「原住民族以飲酒為日常習慣」的刻板印象。
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 如果我們是文中的媒體從業人員，應如何審視原住民族文化？
  options:
  - label: A
    content: 多跟原住民交流互動，使其適應漢人的生活方式
  - label: B
    content: 以自身的生活觀點，來報導原住民族的傳統文化
  - label: C
    content: 為避免引發爭議，盡量減少播報原住民族的新聞
  - label: D
    content: 以尊重、包容、平等的心態，看待原住民族文化
  group_stem: 某家新聞台曾經以「米酒降價，原住民又喝起紅標了」作為新聞標題，不經意地將酗酒者與原住民劃上等號。不僅如此，還有一家電視台，於報導政府派員到原住民家庭進行訪視時，竟出現「原住民見面先乾杯」的新聞畫面，又再度對社會大眾傳達「原住民族以飲酒為日常習慣」的刻板印象。
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 四位學生在討論媒體近用權可能造成的不公平現象： 平平：媒體近用權應該是民主國家每個人都享有的基本權利。 安安：對啊，可是會不會有些群體沒有辦法享有同樣的媒體近用權呢？ 樂樂：＿＿＿＿ 請問下列何者是樂槳最可能的回答？
  options:
  - label: A
    content: 當然有可能！媒體近用權只保障社經地位較高的人！
  - label: B
    content: 當然不可能，媒體近用權可說是基本的公民權利哩！
  - label: C
    content: 當然有可能！社會處境不利族群通常也比較沒有辦法落實媒體近用權呢！
  - label: D
    content: 當然不可能，人們不論居住在何地，媒體近用權的實際使用都是相同的！
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 1986年，英國《衛報》推出名為「觀點」的廣告片。影片一開始，以正面角度拍攝一名光頭青年，快步跑離一輛駛向他的汽車，影片旁白說：「從一個觀點看一件事，就會產生一種印象」；然後，改以背面角度拍攝光頭青年的背影，只見他衝向走在前面的一名商人，似乎要攻擊他，或者要搶走他的公事包，這時旁白說：「從另一個觀點看，又會產生另一種截然不同的印象」；最後，影片改從上方角度，往下拍攝這個場景，只見一大堆建築材料高懸在半空中，在商人頭頂上劇烈搖晃，失去了控制，這名青年及時把商人拉到一旁，救了他一命，此時旁白說：「唯有綜觀全域，才能完全明白這是怎麼一回事」。這支廣告很有說服力，許多英國觀眾認為唯有《衛報》能如實呈現世界的全貌。請問若從新聞產製的流程分析該則廣告的拍攝手法，及民眾對《衛報》的形象認知，下列何者為正確的分析觀點？
  options:
  - label: A
    content: 《衛報》的守門人平衡的兼顧了新聞價值與媒體經營者的立場
  - label: B
    content: 《衛報》的新聞製作透過平衡各方立場避免新聞室社會化的可能
  - label: C
    content: 閱聽人選擇閱讀《衛報》時可以省去謹慎檢視資訊真偽的心力
  - label: D
    content: 閱聽人可以善用「媒體接近權」參與《衛報》的新聞編寫
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 近年來自媒體迅速發展，成為大眾媒體之外一股新的輿論力量。請問自媒體具有哪些特性？(甲)補充大眾媒體的不足；(乙)實現媒體接近使權；(丙)傳送正確即時的訊息；(丁)提供立場客觀的報導。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丁
  - label: D
    content: 乙丁
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 現在許多政治人物除了依靠新聞與報章雜誌的報導外，也都會經營自己的社群媒體，來達到與民眾互動的目的。請問下列何種作法與上述概念相近？
  options:
  - label: A
    content: 行政院透過官方網站宣導政令
  - label: B
    content: 插畫家馬克透過臉書分享心得
  - label: C
    content: 樂田麵包屋透過臉書放置商品
  - label: D
    content: 鴻海集團透過新聞增加知名度
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 某些專家學者研究：「比起新聞與報章雜誌的製作成本，現在不論是政治人物還是民間團體欲透過網路傳媒來發表自己的意見，所支出的費用少之又少，並且又有辦法吸引到大批民眾關注」。請問會造成上述現象的主要原因可能為何？
  options:
  - label: A
    content: 電視雜誌漸漸不再被這個世代的人接受
  - label: B
    content: 電視雜誌的編輯者不懂現在的需求趨勢
  - label: C
    content: 科技的發展讓網路世界快速與便捷
  - label: D
    content: 政治人物與民間團體才是社會中的支幹
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 2019年菲律賓期中選舉結果出乎意料之外，總統杜特蒂支持的候選人大獲全勝，幾乎囊括所有的參議員席次，不僅與選前數間大學學生會的模擬投票結果大相逕庭，引發菲律賓眾多大學生的「崩潰潮」。受高等教育的大學生，往往都會成為社會的反指標，有人覺得那是社群媒體所塑造出來的同溫層假象，讓年輕人因此錯估了情勢。也有人認為是菲律賓這幾年來不斷有社群媒體散競選團隊，指責該團隊透過公關公司在社群媒體上面操作假新聞的惡習。請問年輕人與主流民意產生落差的原因最有可布的假新聞造神，並惡意抹黑、抹紅異議性團體，才會導致社會輿論嚴重分歧的結果。其中，不少人將矛頭指向杜特蒂能為何？
  options:
  - label: A
    content: 能使用科技的機構或國家更有權力控制傳播的模式與通道
  - label: B
    content: 選舉時，年輕人接觸的網路新聞多半聚焦在候選人的外貌
  - label: C
    content: 受高等教育的大學生呈現數位落差導致媒體使用機會減少
  - label: D
    content: 大學生的財力與能力不夠無法買足廣告宣傳以拉高支持率
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 2016年希拉蕊獲得民主黨提名為總統候選人，這是美國建國240年以來，主要政黨首度提名女性成為總統候選人，希拉蕊發表演說提到：女性參政的天花板終於被撞出最大的一道裂縫，她為所有的美國人感到開心，這表示「藩籬被打破了，只有天空才能侷限我們」。她也鼓助大家繼續努力，直到1.6億名美國女性都能獲得應得的機會，並呼籲那些認為女性應該與男性同工同酬的選民加入他的陣營。關於希拉蕊的演說內容，下列何者為正確理解？
  options:
  - label: A
    content: 達到男女同工同酬的哪一天便可以打破玻璃天花板
  - label: B
    content: 玻璃天花板只會出現在職場，政治領域不適合使用此名詞
  - label: C
    content: 因為社會中對女性的期待，導致玻璃天花板的形成
  - label: D
    content: 希拉蕊的訴求只對女性有吸引力，故他未能贏得總統選舉
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 從勞動的概念與種類分析茱莉亞羅勃茲在《奇蹟男孩》所飾演的母親一角，下列說明何者正確？
  options:
  - label: A
    content: 擔任兒子的家教老師有助於女性勞動參與率的提升
  - label: B
    content: 擔任生活照顧者、包辦日常家事皆屬於再生產勞動
  - label: C
    content: 家務勞動女性化是因為女性天生就適合擔任照顧者
  - label: D
    content: 可聘僱女傭減輕負擔並改變家務勞動女性化的現象
  group_stem: 電影《奇蹟男孩》中茱莉亞羅勃茲所飾演的母親伊莎貝爾，為了基因缺陷導致臉部殘缺的兒子奧古斯特，放棄碩士學業，在家裡擔任生活照顧者，包辦所有家事，同時也是兒子的家教老師，直到孩子上學，在校狀況穩定後，才又重拾碩士論文，延續自己未完的夢想。歐文威爾森飾演父親納特，除了賺錢養家外，當子女有任何問題需要協助時亦會及時的給予與支持。
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 請依電影中父母雙方各自承擔的市場性勞動與家務勞動的意義，判斷下列說明何者正確？
  options:
  - label: A
    content: 市場性勞動與家務勞動皆為有支薪的生產性活動
  - label: B
    content: 家務勞動的付出遠不及於市場性勞動的實質報酬
  - label: C
    content: 市場性勞動與家務勞動兩者報酬有異但相互為用
  - label: D
    content: 從事家務勞動的機會成本較低時會選擇進入職場
