  stem: 「這些新貧階級不同於以往傳統的老弱殘疾、無工作又無恆產的舊貧階級，而是一群中壯年有工作能力的家庭生計算擔者，因為失業或不穩定就業，使家庭經濟陷入困境。新貧階級原本多為中產階級，擁有房產成為他們無法獲得經濟補助的主要障礙。」上述為某位學者對新貧階級的說明，請問下列何者是最有助於新貧階級脫離生活困境的合理作法？
  options:
  - label: A
    content: 強制新貧階級繳交國民年金，以免老後貧窮
  - label: B
    content: 鼓勵企業多僱用新貧階級，使其收入能穩定
  - label: C
    content: 降低其全民健保自付額以保障其醫療保健權
  - label: D
    content: 放寬《社會救助法》對低收入戶的認定標準
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_28
  section: 1
  number: 28
  type: single
  page: 4
  stem: 實質平等的意義在於，考量不同人之間的差異，給予合理的差別對待，以促進公平正義。請問下列哪個做法符合實質平等的概念？
  options:
  - label: A
    content: 社會保險要求收入較高者繳納較多保費，收入較低者的保費則較低
  - label: B
    content: 不論是窮人或富人，只要面臨了生育這種事件，都能請領社會福利
  - label: C
    content: 政府為了獲得足夠的選民支持，給予特定群體更為優渥的社會福利
  - label: D
    content: 政府提高社會救助的請領標準，以縮減政府的支出，降低財政負擔
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_29
  section: 1
  number: 29
  type: single
  page: 4
  stem: 約翰生於19世紀末的德國，約翰的父親因為長期在化學工廠工作導致罹患職業病，卻無法從雇主方獲得賠償，加上當時的勞工問題層出不窮，於是德國首相俾斯麥便開辦社會保險，成為世界各國開辦社會保險的先驅，約翰長大成人後進入工廠工作也因此受惠。請問下列有關社會保險的敘述，何者正確？
  options:
  - label: A
    content: 約翰加入社會保險需要自行負擔部分保費，故社會保險不屬於社會安全制度的一環
  - label: B
    content: 約翰萬一被雇主解僱，約翰無法從社會保險得到生活保障
  - label: C
    content: 約翰參加社會保險，除了自行負擔保費外，其餘保費由雇主與國家分擔
  - label: D
    content: 約翰在工廠因表現良好升為廠長，薪資已經超過加入社會保險的最高限制，故約翰必須退保
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_30
  section: 1
  number: 30
  type: single
  page: 4
  stem: 2017年的經濟合作暨發展組織（OECD）研究報告顯示，法國是OECD國家中退休年齡最低的國家，也是65歲以上民眾可支配收入最高的國家。這樣的優渥的退休條件讓法國國債占GDP（國內生產毛額）比率接近100％，雖然如此，法國依然保持已經超過50年的「社會福利支出占GDP比率最高的OECD國家」的紀錄。法國總統馬克宏就任以來，一直希望藉由大幅整頓國家的退休金制度，以減低法國的財務赤字，這樣的政策獲得超過八成民眾的支持，即使馬克宏的支持率隨著黃背心運動已下滑許多，但支持退休金改革的民眾仍達66％。請問法國民眾之所以支持退休金改革的原因應該為何？
  options:
  - label: A
    content: 推動社會福利措施時需考慮國家的財政狀況，方能謀取國民的最大幸福
  - label: B
    content: 減少對退休人口的社會福利照顧，便可以確實增加法國的國內生產毛額
  - label: C
    content: 因為貪腐的政府未能實現政府的效能，政府無法保障民眾享有分配正義
  - label: D
    content: 法國65歲以上民眾可支配收入高，不再需要國家社會福利制度的保障
