  stem: 某公司原本是國營企業，後來因為政府推動民營化而轉為私人經營。該公司的員工抗議員工利益在民營化過程中一再被忽略，不僅工資凍漲，工時也拉長，遂發起罷工運動，引發媒體關注。其中有媒體刊登的罷工訴求有誤，並指稱罷工者「自私自利」，遭罷工者要求更正、平衡報導。下列對於該事件的討論，何者最為正確？
  options:
  - label: A
    content: 要求媒體更正、平衡報導，是行使媒體近用權的使用權
  - label: B
    content: 民營化後的勞動條件惡化，顯示個體勞動權不再受保障
  - label: C
    content: 罷工影響社會大眾甚鉅，政府應致力修法提高罷工門檻
  - label: D
    content: 罷工是一種社會運動，有助於民眾聚焦、討論社會問題
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_22
  section: 1
  number: 22
  type: single
  page: 3
  stem: 知名客運公司在國道失控翻覆造成多人死傷的意外令人心痛。針對此一事件高雄市政府勞工局對客運公司進行勞動檢查發現，肇事司機最近1週出勤紀錄透露出，客運公司有3項違規事件，包括：勞工連續出勤超過6天，未依規定給予勞工每7天至少有2天的休息，1日為例假，1日為休息日；輪班勞工更換班次時，未使勞工至少有連續11小時休息；勞工1天內連續出勤時間超過12小時。該客運公司被處以高額罰鍰以示警告。針對此一事件，下列敘述何者正確？
  options:
  - label: A
    content: 高雄市政府勞工局是依據《職業安全衛生法》對客運公司進行勞動檢查
  - label: B
    content: 高雄市政府勞工局是以《勞動基準法》判定肇事司機的出勤紀錄中的違規事件
  - label: C
    content: 連續出勤、未給例假及休息時間等均侵犯了司機的集體勞動權
  - label: D
    content: 文中事件可以看出《勞動基準法》能夠妥善降低此類過勞事件
- id: doc_108_台南_北門_社會_公民與社會_g10s1e3_s1_23
  section: 1
  number: 23
  type: single
  page: 3
  stem: 小華閱讀資料1之後，腦中冒出了幾個推論，請問哪個最為正確？
  options:
  - label: A
    content: 工會可根據《勞基法》對工時的規範，要求華航不得調高工時上限
  - label: B
    content: 華航要求旗下空服員簽署的協定，屬於工會與資方簽訂的團體協約
  - label: C
    content: 工會發動罷工的權利，在我國是受到《勞資爭議處理法》所保障的
  - label: D
    content: 空服員對工時縮短感到不滿，因此訴求應該包括讓空服員值勤更久
  group_stem: 中華航空公司（簡稱華航）的員工為了爭取工作權利，近年來曾發動兩起引發關注的罷工事件，分別是2016年的空服員罷工（資料1），以及2019年的機師罷工（資料2），而兩次皆引發社會關注，最終也獲得資方回應。請根據下述報導回答問題： 資料1：「工時」是這次大罷工的導火線。華航調整了空服員的工時計算方式，即使空服員花的時間一如過往，但每趟航班工時將少算80分鐘；根據民航局規定，空勤組員每執行1次工時8小時以下的任務，須至少有10小時休息；8至12小時，至少休息12小時；12至16小時，至少休息24小時。如今工時縮短，一些班次可能正好跌破「門檻」，使得最低休息時間變短，公司可以提前再排任務，形同每月工時上限從174小時調高到220小時。此外，華航近年也要求新進空服員簽署一份協定，同意每月工時上限調為220小時，同時要求資深員工也跟進簽署……。雖然華航表示不會機剋扣休息，但發起罷工的空服員職業工會認為只要簽了，一位空服員的確有可能受命上220小時的班，恐面臨嚴重的健康風險。 資料2：機師工會的第一個訴求是改善疲勞航班，希望長程航班8小時以上能派出3位機師、12小時以上派出4位機師共同駕駛，以維護飛航安全。但華航認為這會大幅提高人事成本，嚴重影響競爭力。第二個訴求為「副駕駛升訓制度透明化，保障國籍機師工作權」，工會認為現行制度的排序分數不公開，且會因主管喜好而改變選訓結果。華航對此只表示：「制度完善，沒有黑箱問題，無須改善。」工會表示華航資方對他們的訴求都沒有正面回應，談判未果，因而走向罷工一途。
