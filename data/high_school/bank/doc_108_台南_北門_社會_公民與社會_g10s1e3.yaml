    (1)貿易規則與發展需求間的不和諧，工業國家應牢記自己走過的發展歷程，要為發展中國家制定他們自己制度和迎頭趕上的戰略留下空間。

    (2)全球不宜過度吹噓貿易開放的好處，各國不一定能依靠貿易自由化來實現高速經濟成長，但這也不是說貿易保護會比貿易自由化優越。

    (3)民主、合理、公正的全球治理是必要的、迫切的。全球必須建立一套自願基礎促進發展的規則和標準，順應各國環境的貿易規則必須靈活。'
