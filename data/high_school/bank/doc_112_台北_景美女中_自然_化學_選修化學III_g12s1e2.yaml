  stem: '25 ℃，1 atm 下，二氧化碳為微溶於水的氣體，對水的溶解度為 1.45 g/L，若溶於水後的二氧化碳皆形成碳酸，碳酸為二質子弱酸，其解離反應為：

    | $H_{2}CO_{3}$ |  | $H^{＋}$＋$HCO_{3}^{－}$ | $K_{a}$1 |

    | --- | --- | --- | --- |

    | $HCO_{3}^{－}$ |  | $H^{＋}$＋$CO_{3}^{2－}$ | $K_{a}$2 |

    則下列敘述何者<u>錯誤</u>？'
  options:
  - label: A
    content: 碳酸的體積莫耳濃度約為 0.033 M
  - label: B
    content: $K_{a}$1＞$K_{a}$2
  - label: C
    content: 溶液中的濃度為 [$HCO_{3}^{－}$]＞[$CO_{3}^{2－}$]
  - label: D
    content: 溶於 1 L 水中 $CO_{2}$ 莫耳數＝[$H_{2}CO_{3}$]＋[$HCO_{3}^{－}$]＋2[$CO_{3}^{2－}$]
  - label: E
    content: '[$H^{＋}$]＝[$HCO_{3}^{－}$]＋2[$CO_{3}^{2－}$]＋[$OH^{－}$]'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
