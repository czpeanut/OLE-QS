- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 有關酸鹼的敘述，何者正確？
  options:
  - label: A
    content: 0.1 M $HClO_{4}$(aq) 的 [$H^{＋}$] 大於 0.1 M HCl(aq) 的 [$H^{＋}$]
  - label: B
    content: 依阿瑞尼斯酸鹼學說，凡分子具有 OH 者為鹼
  - label: C
    content: 溶解度大的酸，稱為強酸
  - label: D
    content: 解離度小的酸，稱為弱酸
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)兩者均為強酸，在水中完全解離，所以 [$H^{＋}$] 均為 0.1 M。

    (B)在水中可解離出 $OH^{－}$ 的物質，才為阿瑞尼斯的鹼。

    (C)解離度大的酸，稱為強酸。'
- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列酸中，何者為二質子酸且化學式正確？
  options:
  - label: A
    content: 異次磷酸：$H_{3}PO_{2}$
  - label: B
    content: 異亞磷酸：$H_{3}PO_{3}$
  - label: C
    content: 碳酸：$H_{2}C_{2}O_{4}$
  - label: D
    content: 硫酸：$H_{2}SO_{3}$
  - label: E
    content: 醋酸：$CH_{3}$COOH
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)異次磷酸：$H_{3}PO_{2}$，為單質子酸。

    (C)乙二酸：$H_{2}C_{2}O_{4}$，為二質子酸。

    (D)亞硫酸：$H_{2}SO_{3}$，為二質子酸。

    (E)醋酸：$CH_{3}$COOH，為單質子酸。'
- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關 pH 值的敘述，何者正確？
  options:
  - label: A
    content: 25 ℃時，pH＝3 的鹽酸濃度和 pH＝3 的醋酸濃度相等
  - label: B
    content: 25 ℃時，1×$10^{－3}$ M 氫氧化鈉水溶液的 pH 值和 50 ℃時，1×$10^{－3}$ M 氫氧化鈉水溶液的 pH 值相等
  - label: C
    content: 25 ℃時，1×$10^{－8}$ M 的鹽酸，其 pH＝8
  - label: D
    content: 25 ℃時，pH＝3 的鹽酸和 pH＝3 的醋酸水溶液分別以水稀釋為原來的 10 倍，所得溶液之 pH 值為醋酸低於鹽酸
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)相同 pH 值的強酸與弱酸，弱酸的濃度較大。

    (B)因為 $K_{w}$ 值會受溫度影響，雖然 pOH 值相等，但 pH 值不同。

    (C)在 25 ℃時，1×$10^{－8}$ M 的鹽酸，其 pH 值略小於 7，需考慮水自解離出來的 $H^{＋}$。

    (D)等體積的溶液稀釋，弱酸 pH 值變化較強酸小。'
- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 純水冷卻至某溫度時，pH 值變為 7.5。下列敘述何者正確？
  options:
  - label: A
    content: 其離子積常數為 1×$10^{－14}$
  - label: B
    content: 此時 pOH 值為 6.5
  - label: C
    content: 水的解離百分比變小
  - label: D
    content: 若加入少量鹽酸於該純水中，則溶液的 pOH 值會變小
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)(B)純水：pH＝7.5$\Rightarrow$[$H^{＋}$]＝$10^{－7.5}$ M＝[$OH^{－}$]$\Rightarrow$[$H^{＋}$][$OH^{－}$]＝$10^{－15}$，所以 pOH＝7.5。

    (C)水的解離為吸熱反應，溫度降低，解離百分比變小。

    (D)加入鹽酸，溶液變酸性，所以 pOH 值會變大。'
