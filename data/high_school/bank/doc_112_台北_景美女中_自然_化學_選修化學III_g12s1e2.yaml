- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 100 毫升緩衝液中含 0.1 M $CH_{3}$COOH 與 0.2 M $CH_{3}$COONa，下列何者已超出此溶液之緩衝能力？（原子量：N＝14，Na＝23）
  options:
  - label: A
    content: 加入 0.1 M 30 毫升 Ca(OH)$_{2}$
  - label: B
    content: 加入 0.01 莫耳 $HNO_{3}$
  - label: C
    content: 加入 0.16 克 NaOH
  - label: D
    content: 加入 0.1 M 300 毫升 HCl
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '此緩衝液中，$CH_{3}$COOH＝0.1×0.1＝0.01（莫耳），則加入鹼提供的 $OH^{－}$ 不可超過 0.01 莫耳。

    此緩衝液中，$CH_{3}$COONa＝0.2×0.1＝0.02（莫耳），則加入酸提供的 $H^{＋}$ 不可超過 0.02 莫耳。

    (A)可提供 $OH^{－}$：0.1×2×0.03＝0.006（莫耳）。

    (B)可提供 $H^{＋}$ 0.01 莫耳。

    (C)可提供 $OH^{－}$：$\frac{0.16}{40}$＝0.004（莫耳）。

    (D)可提供 $H^{＋}$：0.1×0.3＝0.03（莫耳）。故選(D)。'
- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 下列何組物質若以適當比例混合，最適合用於保持水溶液的 pH 值穩定在 7 的附近？
  options:
  - label: A
    content: $H_{2}CO_{3}$、$NaHCO_{3}$（$H_{2}CO_{3}$ 之 $K_{a}$1＝4×$10^{－7}$、$K_{a}$2＝4.7×$10^{－11}$）
  - label: B
    content: HF、NaF（HF 之 $K_{a}$＝6.4×$10^{－4}$）
  - label: C
    content: NaHS、$Na_{2}$S（$H_{2}$S 之 $K_{a}$1＝1×$10^{－7}$、$K_{a}$2＝3×$10^{－13}$）
  - label: D
    content: $H_{2}C_{2}O_{4}$、$NaHC_{2}O_{4}$（$H_{2}C_{2}O_{4}$ 之 $K_{a}$1＝6×$10^{－2}$、$K_{a}$2＝5×$10^{－5}$）
  - label: E
    content: $NH_{4}$Cl、$NH_{3}$ （$NH_{3}$ 之 $K_{b}$＝2×$10^{－5}$）
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 緩衝溶液中，當共軛酸鹼對濃度相等時$\Rightarrow$pH＝$pK_{a}$，此時緩衝效果最好；(A) pH＝$pK_{a}$1＝7－log4。(B) pH＝$pK_{a}$＝4－log6.4。(C) pH＝$pK_{a}$2＝13－log3。(D) pH＝$pK_{a}$1＝2－log6。(E) pOH＝$pK_{b}$＝5－log2；其中(A)的 pH 值最接近 7。
- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_17
