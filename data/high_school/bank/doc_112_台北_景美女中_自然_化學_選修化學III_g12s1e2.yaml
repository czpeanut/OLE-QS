- id: doc_112_台北_景美女中_自然_化學_選修化學III_g12s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 4
  stem: 取四份 50 毫升 0.1 M 的弱酸 HA（$K_{a}$＝1.0×$10^{－4}$），以 0.1 M NaOH 滴定，再分別加入(甲) 0 毫升、(乙) 25 毫升、(丙) 50 毫升、(丁) 60 毫升的 0.1 M NaOH 後，停止滴定。下列有關此四種滴定後之水溶液的敘述，何者<u>不正確</u>？
  options:
  - label: A
    content: 溶液(丙)呈弱鹼性
  - label: B
    content: 溶液(乙)的 pH 值為 4
  - label: C
    content: 此四種溶液中，溶液(丙)所含 HA 的平衡濃度最小
  - label: D
    content: 將溶液(甲)與溶液(丙)混合，其 pH 值等於溶液(乙)的 pH 值
  - label: E
    content: 將此四種溶液分別以純水稀釋 10 倍，其 pH 值變化最小的是溶液(乙)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)弱酸的鈉鹽呈鹼性。

