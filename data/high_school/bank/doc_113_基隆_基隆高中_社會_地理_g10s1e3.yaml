  stem: 古時在臺南鹿耳門及澎湖之間，有船隻巧妙運用風向往返兩地運送生活物資，每日黃昏自澎湖運送魚貨到臺南，待隔夜清晨運送其他物資返回澎湖。請問古人巧妙運用的風系為何？
