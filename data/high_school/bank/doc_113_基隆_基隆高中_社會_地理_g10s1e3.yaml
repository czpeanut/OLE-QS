  stem: 在行星風系理論中，60°N 為副極地低壓帶，但北半球冬季時的副極地低壓帶只維持在海洋上，同緯度的內陸為強大的高壓中心。造成此現象的差異，主要受到下列哪項因素的影響？
  options:
  - label: A
    content: 海面比較容易受日照增溫，形成低壓
  - label: B
    content: 風帶季移使副極地低壓帶移至海面上
  - label: C
    content: 陸地降溫較快，地表低溫形成高壓帶
  - label: D
    content: 赤道低壓帶北移，使得高壓勢力受阻
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)因海陸差異，造成氣壓帶不連續，60°的海洋上為副極地低壓帶，但陸地側因冬季散熱快，會形成高壓。
