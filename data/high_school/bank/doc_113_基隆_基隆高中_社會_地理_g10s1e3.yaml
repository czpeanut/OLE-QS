  type: single
  page: 1
  stem: 歸納全球的降水季節分布約略可分為 4 種：全年有雨、全年乾旱、夏雨冬乾、夏乾冬雨。請問下列哪一組的降水季節分布最為相同？
  options:
  - label: A
    content: 熱帶雨林、熱帶季風
  - label: B
    content: 溫帶地中海型、熱帶莽原
  - label: C
    content: 熱帶季風、溫帶大陸性
  - label: D
    content: 熱帶莽原、夏雨型暖溫帶氣候
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 熱帶雨林氣候為全年有雨，溫帶地中海型氣候為冬雨，夏雨型暖溫帶為乾季不顯著；其餘均是夏雨為主，故答案選(C)。
