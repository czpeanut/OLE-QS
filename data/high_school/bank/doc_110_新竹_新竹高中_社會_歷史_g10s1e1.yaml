  stem: 1853年，同安人對於三邑人霸占碼頭與龍山寺深感不滿，三邑人見狀在取得仕紳黃龍安同意後，以龍山寺作為其作戰指揮中心，先行主動攻擊同安人，兩方人馬於是展開械鬥，不久此地縣丞遭兩方人馬焚毀。請問依題幹所述，此械鬥的發生最能歸因為何？
  options:
  - label: A
    content: 為閩粵械鬥的延伸
  - label: B
    content: 艋舺河港權的爭奪
  - label: C
    content: 地方仕紳搧風點火
  - label: D
    content: 地方官署無心平亂
