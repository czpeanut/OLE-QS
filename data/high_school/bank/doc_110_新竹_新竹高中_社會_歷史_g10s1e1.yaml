  options:
  - label: A
    content: 有利無弊，不只增加工作機會，還可以增進作物多樣化
  - label: B
    content: 有弊無利，民眾被強迫參與工程與遷居，損害種植自由
  - label: C
    content: 有利有弊，增加工作機會與作物產量，但喪失住所與耕作自主
  - label: D
    content: 有利有弊，獲得更優的住所與耕作環境，但接受官方指定作物
  group_stem: ◎資料一：「此圳的興建…使嘉義街新增648戶、4069人，市街上到處可見新建房屋，可望連帶新闢道路、開通郵政電信等服務。至於嘉南平原另一中心的臺南，到了大圳完工之際人口達到9萬，比前一年增加2600人;此外…1928年，臺南州虎尾郡崙背庄的農田收入，從大圳給水前一甲平均37圓37錢，給水後每甲平均增加至139圓20錢」
    資料二：「1927年，為了推進烏山頭水庫的建設工程，必須遷離150戶農民，移往崙背、北港等海岸方向。但是居民不願放棄先祖所留下的土地，就算大圳組合想買下來，也不知道合理地價到底是多少…。」
    資料三：「八田與一等人為了說服農民接受三年輪作制，積極在多處進行輔導，但三年輪作制度以地域區分種蔗、稻米、雜作而分別給水的方式，畢竟違背了農民原有耕作習慣以及選擇耕種高經濟價值作物的自由，加上一年只種一樣作物的單一耕作計畫又帶有歉收風險，令農民無法完全掌握收益，當然會產生反感。即使如此，官方依然以獎勵輪灌、強制配水的措施…並以會社和警察介入，強迫農民配合三年輪作耕作。」
