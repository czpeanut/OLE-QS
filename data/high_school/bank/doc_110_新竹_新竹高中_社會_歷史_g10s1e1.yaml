  group_stem: ◎資料一：下表是〈1994至1999年2月內政部核發國人東南亞各國配偶證數量統計表〉。 資料二：1980年代末期，由於東南亞女子以觀光簽證來臺卻頻遭賣身，以至於臺灣政府下令不給予東南亞單身女子簽證，因此臺籍男子只好前去東南亞娶妻，這又與臺灣資本外移的趨勢相當一致。臺灣在1985-1991年間對東南亞投資以泰國、馬來西亞為主，在菲律賓亦有不少的臺資，因此在1980年代中期，在臺灣來自泰、菲的東南亞外籍配偶最為普遍，至於臺灣對印尼的投資是在1991年後才明顯增加，而這與1990年代初期印尼成為臺灣男子娶東南亞外籍配偶的主要目的相符合。為了減緩印尼女性外籍配偶來臺的速度，政府採取壓低審核速度的方式，故臺灣男子也逐漸轉往越南尋找結婚的對象，這同時是臺灣對越南投資大幅提高的時間，之後臺、越還簽訂『投資保障協定』，臺灣赴越南娶妻的人更多了。」
  shared_asset: g2_36_37
