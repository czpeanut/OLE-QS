  stem: 1899年，(甲)銀行正式成立。1904年發行「銀行券」，紙幣的流通對於習慣使用貨幣的臺灣社會是一場貨幣革命。(甲)銀行還在中國的廈門、汕頭、廣州、上海、香港、南洋等地設有分行，協助日本資本能夠順利進出中國與東南亞，此外，(甲)銀行不只擁有貨幣發行權，也發揮商業銀行的功能，促進臺灣資本主義的發展。而貨幣的統一，也促進工商發展以及與日本本國的聯結，上文中的(甲)銀行應是?
  options:
  - label: A
    content: 臺灣銀行
  - label: B
    content: 華南銀行
  - label: C
    content: 彰化銀行
  - label: D
    content: 中央銀行
