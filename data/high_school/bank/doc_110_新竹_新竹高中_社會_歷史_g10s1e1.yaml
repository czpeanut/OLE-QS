  group_stem: ◎資料一：「返日的人們，歸鄉卻成為他們災難的開始…不但身無長物，一切重頭，還要面對歧視與排斥，因國內經濟困頓，能有土地打造村莊已屬幸運，更多人只能透過寄養、寺院收容，甚至淪為娼妓，方能取得棲身之處…這樣生存與尊嚴，堅持在逆風中前進的故事，在日本各地上演，與臺灣的關聯、反對歧視的奮鬥、對日本的不適應，使更多灣生強化了這樣的情節，成為有共同生命經驗的概念…。」
    資料二：「在我們來看，大家當時誰不擠在小小田裡？你們這群人拿了政府傳單，就擅自前往臺灣過自己想要的生活，現在回來也不是我們的責任!」
