- id: doc_110_新竹_新竹高中_社會_歷史_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 1624年中國組織了一支由一百五十艘帆船戰艦與一萬名士兵構成的龐大團隊，並將侵犯國土的外國商隊驅離，面對即將來襲的敵軍，荷蘭人只有幾百人的武力，因此在兵力遠不如對手的情況下，荷蘭指揮官宋克的最後一絲希望即是與中國官員協商提出折衷方案。在此一背景下，臺灣於是成了雙方都能夠接受的選項，根據上述，荷蘭人在折衷方案下來到臺灣統治的原因下列何者最有相關？
  options:
  - label: A
    content: 臺灣與中國、日本地理位置相近，適合經營北亞貿易
  - label: B
    content: 臺灣位於亞洲航線的中間點，適合做轉口貿易的補給
  - label: C
    content: 荷蘭在無法取得澳門澎湖的背景下，只能輾轉到臺灣
  - label: D
    content: 臺灣盛產鹿皮、稻米、蔗糖等物產能增加出口的利潤
- id: doc_110_新竹_新竹高中_社會_歷史_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 阿明跟阿文提到各自爺爺跟奶奶在躲空襲的時代故事。阿明：「我爺爺跟我說，躲空襲的時候會對生活有不小影響，學校常常停課，要做更繁重的工作，不過還好還有肉可以吃，至少不容易肚子餓。」；阿文：「怎麼可能!我奶奶說政府要糧食配給，日本人還領得比臺灣人更多，東西都不夠吃了怎麼還可能會有肉!」上述對話如何解釋最適當?
  options:
  - label: A
    content: 不可能，臺灣遠離戰區，無須限制糧食
  - label: B
    content: 不可能，臺灣廣種蓬萊米，產量應足夠
  - label: C
    content: 有可能，因應戰爭，民眾走私糧食回臺
  - label: D
    content: 有可能，鄉村私下保留食物拿出來食用
