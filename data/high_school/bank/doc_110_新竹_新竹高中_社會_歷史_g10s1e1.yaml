- id: doc_110_新竹_新竹高中_社會_歷史_g10s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 下列資料分別是二位臺灣企業家的事蹟： 資料一：「他20歲即繼承父業，配合當時政府的政策，一躍將土地資本轉為工業資產，成為臺灣水泥公司主要的負責人。由於戰後大量基礎建設的推動與臺灣經濟成長等因素，水泥生產供不應求，臺泥公司的事業遂因而繁榮，後來更逐漸進行多角化經營，發展成臺泥企業集團。」
    資料二：「工業委員會欲將美援計畫中的 PVC 塑膠工業交付民營。因國際 PVC 價格暴跌，原先屬意承辦的企業家不願接手，於是邀請一位米商投資經營，因此成立福懋塑膠公司，同年改名臺灣塑膠公司，於是這位米商展開了臺灣第一大民營製造集團的傳奇。」
    由二位人物企業發跡的契機判斷當時應是臺灣經濟發展的哪一階段？
  options:
  - label: A
    content: 改革重建時期
  - label: B
    content: 進口替代時期
  - label: C
    content: 出口擴張時期
  - label: D
    content: 十大建設時期
- id: doc_110_新竹_新竹高中_社會_歷史_g10s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 3
  stem: 1960年代末期，臺灣的輕工業已有穩固人力、技術、資金、市場基礎，可望進一步推動重化工業，然而，1973年○○戰爭爆發，石油輸出國家組織以石油禁運為手段，導致油價暴漲，臺灣經濟受到波及，出口大幅衰退。為此，政府推動所謂第二次進口替代政策，喊出「今天不做，明天後悔」的口號，發展重化工業，建立自主經濟體系，進行大規模公共投資。上述○○指的是哪一戰爭?
  options:
  - label: A
    content: 韓戰
  - label: B
    content: 越戰
  - label: C
    content: 以阿戰爭
  - label: D
    content: 兩伊戰爭
- id: doc_110_新竹_新竹高中_社會_歷史_g10s1e1_s1_19
  section: 1
  number: 19
