- id: doc_110_新竹_新竹高中_社會_歷史_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 學者分析日本在臺施行日人移民政策考量時，認為「<u>甲地</u>農業尚不發達，但可設立普通行政區，鼓勵本國農民移入，是為『移住型殖民地』；<u>乙地</u>功能完整，適合本國資本家進駐與設立普通行政區，是為『投資型殖民地』；<u>丙地</u>著重在掌握、開發當地資源，設立特別行政區，逐漸將住民同化，是為『封鎖型殖民地』。」請問上述引文中甲、乙、丙三地分別為何？
  options:
  - label: A
    content: 西部、東部、山地
  - label: B
    content: 山地、西部、東部
  - label: C
    content: 東部、山地、西部
  - label: D
    content: 東部、西部、山地
