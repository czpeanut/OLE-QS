- id: doc_110_新竹_新竹高中_社會_歷史_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 以下三項資料皆為對臺灣彭姓祭祖儀式的描述： 資料一：來自全國各地二千多名彭姓宗族，在新竹縣北埔鄉「彭氏大宗祠」舉行秋祭大典。各地彭姓宗族一早湧進宗祠參與祭祖儀式，這項場面浩大的祭典在重陽節舉辦，輪值主辦的苗栗彭姓宗親會說有雙重的意義，一是表達敬老之意，同時也對祖先慎終追遠。
    資料二：北埔祠強調的祖先是具有「開廣始祖」身分的彭延年，在一般概念裡，臺灣地區的客家人大多來自廣東地區。因此彭延年被任命為潮州刺史後，定居於廣東揭陽浦口村，被視為彭姓廣東始祖。
    資料三：南寮祠的福佬身分展現於開基祖彭天祿與彭子安父子的記憶論述上，彭天祿被譽為「泉同始祖」，福佬彭為了強調自身的族群身分，遂選擇曾經生活於福建的彭天祿及彭子安為記憶對象。
    請問綜合上資料，下列何者敘述正確？
  options:
  - label: A
    content: 彭氏大宗祠坐落於北埔代表彭氏祖先最先開墾的地方應為此地
  - label: B
    content: 彭氏大宗祠透過追溯血緣並建立明確的族譜來凝聚宗族的關係
  - label: C
    content: 前來北埔祭祀的彭氏遍布全臺這與臺灣客家人的島內遷徙有關
  - label: D
    content: 北埔與南寮祠不同始祖的追溯展現彭氏內部不同族群仍有界線
