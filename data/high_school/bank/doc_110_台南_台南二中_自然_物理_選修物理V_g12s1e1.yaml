    crop:
      page: 1
      rect:
      - 534.7
      - 791.45
      - 652.3
      - 897.5
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (1)電力線由高電位射向低電位，因此甲、乙為異性電，a正、b負。(2)電力線密度正比於電場強度，所以a周圍之電場強度大於b，因此a的電量大於b。或者同學可以記憶電力線數正比於帶電量，所以a發出的電力線較多，a的電量較大。答案選(B)。
