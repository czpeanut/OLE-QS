  section: 1
  number: 11
  type: single
  page: 1
  stem: '如右圖所示，為點電荷a、b所形成電場的電力線分布圖，若兩者所帶電荷量子化，則下

    列敘述，何者正確？'
  options:
  - label: A
    content: a、b所帶的電荷為同性電、且a所帶的電量大於b
  - label: B
    content: a、b所帶的電荷為異性電、且a所帶的電量大於b
  - label: C
    content: a、b所帶的電荷為同性電、且a所帶的電量小於b
  - label: D
    content: a、b所帶的電荷為異性電、且a所帶的電量小於b
  assets:
  - key: s1_11_f1
