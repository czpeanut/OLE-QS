  stem: 一對平行金屬板帶等量異性電荷相距d，兩板間的均勻電場量值為E。將一個電荷為q的質點，自負極金屬板由靜止釋放，經電場加速抵達正極金屬板，若僅考慮電力的作用時，質點由負極金屬板到正極金屬板之電位能的變化量為何？
