  explanation: 均勻電場的兩板電位差V＝Ed，令負極板電位＝0、正極板的電位V＝Ed。而粒子可由負極板被加速至正極板，表示粒子帶負電。電位能Ｕ＝qV，所以電位能的變化量ΔU＝(－q×Ed)－(－q×0)＝－qEd。答案選(A)。
