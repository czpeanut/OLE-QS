  section: 1
  number: 23
  type: single
  page: 2
  stem: 電蚊拍利用電子電路讓兩電極間的直流電壓可升高達上千伏特，且兩電極間串聯著一個電阻值很大的電阻。它酷似網球拍的網狀拍外型，一般具有三層金屬導線網，其中構成上、下拍面的兩層較疏的金屬網彼此相通，構成同一電極，處於電路的低電位；夾在中間的一層金屬網則是電路中電位較高的另一電極。已知在一大氣壓下，當電場超過30 kV/cm時，空氣通常會被游離而放電。以下僅考慮兩電極的間距為5 mm之金屬網，且兩電極間的電壓不足以使空氣游離的電蚊拍。依據上述，判斷下列敘述，何者正確？
  options:
  - label: A
    content: 該電蚊拍兩電極間的電壓可升高至30 kV
  - label: B
    content: 電蚊拍游離空氣放電的原理是利用靜電感應
  - label: C
    content: 電蚊拍拍面上的電子由較高的原子能階躍遷回低能階時釋放的能量可使空氣游離
  - label: D
    content: 電蚊拍中間夾層的金屬網電位高達上千伏特，若人體碰觸金屬網，會因電擊而產生嚴重傷害
  - label: E
    content: 飛入兩電極間的蚊蟲相當於導電體，即使它只碰到外層電網，也可使兩電極間的空氣間隙減小，以致空氣游離放電
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)錯誤，平行板的電壓V＝Ed＝(30 kV/cm)×(0.5 cm)＝15 kV；(B)(C)皆錯誤，游離空氣是因為強大的電場使空氣的電子獲得足夠的能量而游離，而電蚊拍拍面的電子躍遷的能量不足以使空氣游離；(D)錯誤，人體碰觸電網，可能因間隙減小或形成迴路而造成電流，但因為兩電極間串聯極大的電阻，所以電流微弱不足以使人體受到嚴重的傷害；(E)正確，電壓V固定，當蚊子碰到電網使間隙減小，d減少、E增加，強大的電場使空氣游離放電。答案選(E)。
