- id: doc_110_台南_台南二中_自然_物理_選修物理V_g12s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 若令戊點電位為零，甲、乙、丙、丁四點中，則何處電位最高？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: '1~2題為題組

    右圖中兩個正方形的邊長均為1公尺，圖中P點處有2微庫侖之電荷，在R點處有－2微庫侖之電荷。'
  shared_asset: g1_1_2
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 電力線由高電位射向低電位，距離正電荷較近處的甲電位較高。另法：$V_{甲}$＝$\frac{ kQ }{ 1 }$＋$\frac{ k(－Q) }{ \sqrt{ 5 } }$＝$\frac{ kQ(\sqrt{ 5 }－1) }{ \sqrt{ 5 } }$，乙、丁、戊與兩電荷距離相同，電位為零，$V_{丙}$＝$\frac{ kQ }{ \sqrt{ 5 } }$＋$\frac{ k(－Q) }{ 1 }$＝－$\frac{ kQ(\sqrt{ 5 }－1) }{ \sqrt{ 5 } }$，所以甲＞乙＝丁＝戊＞丙。答案選(A)。
