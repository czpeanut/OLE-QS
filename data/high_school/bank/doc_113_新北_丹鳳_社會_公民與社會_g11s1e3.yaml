  stem: 人們買房屋通常會找房屋仲介（房仲）協助，並向房仲索取不動產說明書，了解房屋狀況，以買到適合的房屋，避免日後後悔。而內政部對於不動產說明書有內容上的規範，除了說明房屋本身的狀況，也須告知方圓
    300 公尺內的厭惡設施（如變電所、殯儀館、加油站、飛機場等等），此外也要讓消費者知道<u>大賣場、學校、醫院</u>等設施的位置。依據上文，以經濟學的角度分析，為什麼不動產說明書必須主動揭露文中畫線處各設施的位置給消費者知道呢？
