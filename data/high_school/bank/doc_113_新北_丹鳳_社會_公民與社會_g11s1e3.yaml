- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: '甲、乙兩國原本沒有貿易，雙方各自生產大麥、牛肉兩種產品，每單位產量如附表。假若兩國洽談自由貿易，在不考慮其他情況下，可能會發生何種情形？

    | 單位：斤∕日 | 甲國 | 乙國 |

    | --- | --- | --- |

    | 大麥 | 100 | 120 |

    | 牛肉 | 80 | 50 |'
  options:
  - label: A
    content: 甲國的牛肉消費者會反對自由貿易
  - label: B
    content: 甲國的牛肉商可能會面臨倒閉危機
  - label: C
    content: 乙國的大麥農會反對自由貿易政策
  - label: D
    content: 兩國大麥、牛肉價格均會因自由貿易而下降
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 單位時間內，甲國具有生產牛肉的優勢，乙國具有生產大麥的優勢；甲國應出口牛肉、進口大麥；乙國應出口大麥，進口牛肉。(A)甲國會出口牛肉，出口將導致國內牛肉價格上升，因此消費者可能會反對自由貿易，為正解。(B)應是乙國牛肉商會有倒閉的危機。(C)乙國為牛肉進口國，應是乙國的牛肉商會反對自由貿易政策。(D)出口的商品會使國內價格上升，而進口品會使國內的價格下降。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: '附表為某國 2020 年到 2024 年的經濟成長率，請根據表中資訊判讀，下列敘述何者正確？

    | 年分 | 2020 | 2021 | 2022 | 2023 | 2024 |

    | --- | --- | --- | --- | --- | --- |

    | 經濟成長率（％） | 3.31 | 2.79 | 3.06 | 3.36 | 6.45 |'
  options:
  - label: A
    content: 2024 年的經濟成長率為近五年最高，反映人民生活水準最好
  - label: B
    content: 2023 年的成長率較 2022 年高，表示 2023 年產值比 2022 年高
  - label: C
    content: 2021 年的經濟成長率最低，表示該年的實質 GDP 較 2020 年低
  - label: D
    content: 從 2020 年到 2024 年，每一年的名目 GDP 都比前一年還高
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)經濟成長率無法反映人民的生活水準。(B)為正確敘述。(C)只要經濟成長率為正值，表示該年度的生產力皆高於前一年的生產力。(D)經濟成長率看的是實質
    GDP，無法推論其名目 GDP 之情形。
