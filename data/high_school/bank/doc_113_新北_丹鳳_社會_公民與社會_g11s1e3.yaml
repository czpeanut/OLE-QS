  page: 1
  stem: 灣灣國近期修訂《身心障礙者權益保障法》第 23 條：「非視覺功能障礙者，不得從事按摩業。」假設國內視障人數固定，請就此法判斷未來該國的按摩市場將如何變化？
  options:
  - label: A
    content: 精簡人力後，經濟福祉提高
  - label: B
    content: 法規施行將使交易價格提高
  - label: C
    content: 立法後，消費者剩餘將提升
  - label: D
    content: 立法後，生產者剩餘將提升
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為政府管制會減損社會福祉。(B)因為供給減少，會推升價格，為正解。(C)立法後，會造成供不應求，消費者剩餘會減少。(D)立法後，生產者剩餘不一定會增加（須看交易數量）。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 國民所得毛額（GNI）是指一國常住居民在國內及國外提供生產要素時所獲得的各種所得。請問下列哪些選項會計入我國當年度的 GNI？(甲)外派駐美代表處已經五年的祕書小美，辛苦工作賺取薪資(乙)經營路邊流動攤販的小瓜，販售自製地瓜球所賺取的利潤(丙)臺灣大學生小奇，暑假到澳洲奇異果園打工兩個月的薪資(丁)從越南嫁來臺灣多年的阿嬌，在新莊某間餐廳工作的薪資(戊)到美國出差多年的小東，把空房出租給輔大學生收取租金
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙戊
  - label: D
    content: 丙丁
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)應計入美國 GNI；(乙)攤販為地下經濟，不列入 GDP 及 GNI；(丙)計入我國的 GNI；(丁)計入我國的 GNI；(戊)應計入美國
    GNI。故選(D)。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 附圖為臺灣開放貿易前的香蕉市場供需圖，假設臺灣在國際市場上具有生產香蕉的比較利益，為香蕉的重要出口國。在不考慮其他因素的前提下，下列何者對於開放貿易後的推論正確？
  options:
  - label: A
    content: 國際貿易發生後，臺灣農民的供給量應會大於 $Q_{1}$
  - label: B
    content: 國際貿易發生後，消費者剩餘將會大於甲的面積
  - label: C
    content: 國際貿易發生後，貿易利得將會大於甲＋乙的面積
  - label: D
    content: 國際市場上均衡時的香蕉貿易價格，將會低於 $P_{1}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)出口後，供給量會大於原本的均衡數量，為正解。(B)貿易後，對出口國的消費者不利，消費者的面積會小於甲的面積。(C)國際貿易的社會福祉會增加，應是社會福祉會大於甲＋乙。(D)當國際價格高於國內價格時，會選擇出口，因此國際價格應高於
    $P_{1}$，臺灣才會出口。
