  section: 2
  number: 40
  type: multiple
  page: 9
  stem: 若颱風來襲，中央氣象局會發布颱風警報，提醒居民做好防颱準備。當暴風圈接近或登陸時，各縣市政府會視當地狀況決定是否停班停課，並成立災害應變中心，撤離居民或提供沙包給居民各自利用。颱風過後，政府會對受災戶給予補助與救濟，並進行災區復原，例如重建堤防。也有民間團體舉辦活動為災區募款。若風災導致蔬果供應量不足，政府也會進口國外蔬果。針對上述各項政府措施、民間活動或風災影響情形，是否計入當年度國內生產毛額（GDP）的計算敘述，哪些正確？
  options:
  - label: A
    content: 政府宣布停班停課不會影響 GDP
  - label: B
    content: 政府對災區的重建支出會增加 GDP
  - label: C
    content: 政府對受災戶的補助不列入 GDP 計算
  - label: D
    content: 風災對蔬果供應量的影響會使 GDP 減少
  - label: E
    content: 民間對受災戶的經費救濟不列入 GDP 計算
  answer:
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)停班停課會減少生產力，使 GDP 減少，會影響 GDP。(B)重建支出為投資支出，會增加 GDP，為正解。(C)補助屬於移轉性支出，不列入
    GDP，為正解。(D)蔬果減產會使 GDP 下降，為正解。(E)救濟屬於移轉性支出，不列入 GDP，為正解。
