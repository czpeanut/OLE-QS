- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '下表為阿仁做報告時所查閱到的資料，請從表中數據判斷下列敘述何者正確？

    | 項目 | 甲國 | 乙國 | 丙國 |

    | --- | --- | --- | --- |

    | GDP（萬美元） | 100,000 | 220,000 | 250,000 |

    | 每人平均 GDP（萬美元） | 2,500 | 2,200 | 5,000 |

    | 經濟成長率（％） | 2.77 | 2.88 | 2.99 |

    | 自然資源折耗與環境品質質損 | 5,000 | 10,000 | 50,000 |'
  options:
  - label: A
    content: 國內總人口數：甲國＞丙國＞乙國
  - label: B
    content: 貧富差距程度：丙國＞乙國＞甲國
  - label: C
    content: 實質 GDP 漲幅：甲國＞乙國＞丙國
  - label: D
    content: 綠色國民所得：乙國＞丙國＞甲國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)人均 GDP＝GDP∕總人口數，可知甲國的人口數為 40 萬人、乙國的人口數為 100 萬人、丙國的人口數為 50 萬人，應是乙國＞丙國＞甲國。(B)從表中數據，無法推斷三國的貧富差距程度。(C)實質
    GDP 的漲幅為經濟成長率，因此丙國＞乙國＞甲國。(D)綠色國民所得＝GDP－自然資源折耗與環境品質質損，得出甲國的綠色 GDP 為 95,000 萬美元、乙國的綠色
    GDP 為 210,000 萬美元、丙國的綠色 GDP 為 200,000 萬美元，因此綠色國民所得：乙國＞丙國＞甲國，為正解。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 我國政府為了因應全球不景氣，曾經於 2021 年發放振興五倍券，振興五倍券設計面額為 1,000 元三張、500 元兩張、200 元五張，共計 5,000
    元。依人口計算，所需預算為新臺幣 1,150 億元以上，與 20 多億的印製與發放費用。下列何者推論最為正確？
  options:
  - label: A
    content: 發給每位國民價值 5,000 元的五倍券，屬於政府投資支出
  - label: B
    content: 若民眾使用消費券購買進口商品，對 GDP 會產生負面效果
  - label: C
    content: 印製發放所需的 20 多億費用，有助於提升國內生產毛額
  - label: D
    content: 發放五倍券為移轉性支出，無助於提升國內的經濟成長率
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)五倍券是屬於移轉性支出。(B)購買外國產品並不會影響本國的 GDP。(C)印製的花費屬於政府的消費支出，會計入該國的 GDP，為正解。(D)民眾使用五倍券可能會帶動其他的消費，而促使經濟成長，故有助於提升經濟成長率。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '洋洋是一名羽球國手，他僱用了從日本來臺灣短期交換半年的餐飲系大學生小愛擔任廚師，而廚師的工作就是替老闆料理三餐。兩人相處半年後便決定閃婚，婚後為了節省家庭開銷，小愛繼續擔任廚師工作而不支薪。上述情形的轉變對臺灣的
    GDP 和 GNI 有何影響？

    | 價格（元∕株） | 需求量（株） | 供給量（株） |

    | --- | --- | --- |

    | 130 | 30 萬 | 70 萬 |

    | 110 | 40 萬 | 60 萬 |

    | 90 | 50 萬 | 50 萬 |

    | 70 | 60 萬 | 40 萬 |

    | 50 | 70 萬 | 30 萬 |'
  options:
  - label: A
    content: GDP 減少、GNI 減少
  - label: B
    content: GDP 減少、GNI 不變
  - label: C
    content: GDP 不變，GNI 不變
  - label: D
    content: GDP 不變，GNI 減少
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 僱用廚師的薪水會列入當年度的 GDP，但因為僅在臺灣半年不算常住居民，而不計入 GNI；結婚後不支出薪水，GDP 因此減少，GNI 同樣不計入，GNI
    不變，故選(B)。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 右圖為丹丹國油價市場的供需圖。若該國財政部發布規定，限定國內汽油價格為 $P_{1}$，請問下列敘述何者正確？
  options:
  - label: A
    content: $P_{1}$ 稱之為價格下限，將可能會引發黑市交易的問題
  - label: B
    content: 此政策將導致供不應求的現象，供給線將往右移動
  - label: C
    content: 政府管制後的消費者剩餘，為圖中 $CABP_{1}$ 梯形面積
    asset:
      key: s1_8_optC
