  group_stem: 澳洲是世界第五大葡萄酒出口國，擁有全球知名的葡萄酒產區，其於 2015 年和中國簽署自由貿易協定（Free Trade Agreement,
    FTA）後，中國取消了對澳洲葡萄酒課徵的 14 ％關稅，但中國並未同時取消其對其他世界貿易組織（WTO）會員國的葡萄酒關稅。兩國簽訂 FTA 之後，中國大量進口澳洲葡萄酒，近年年均交易額高達
