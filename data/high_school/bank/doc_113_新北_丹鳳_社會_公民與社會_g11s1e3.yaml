  group_stem: '臺灣的平溪天燈節，被全球最大旅遊資訊公司 Fodor’s 選為死前必遊的 14 個經典節慶之一。「平溪天燈」逐漸成為新北市的觀光指標活動，也使臺灣能成為國際觀光的焦點，每年都有許多觀光客來此購買天燈並施放，刺激平溪當地的經濟發展（如製造天燈的手工業、原料業等）。但天燈施放後所產生的垃圾殘骸該如何處理也是一個大考驗，降落下來的天燈不只造成大量垃圾，而且未完全燃燒形成的廢棄物會殘留重金屬，可能對當地山谷動物的棲地、水源造成汙染。甚至有當地居民的房子因此發生火災，造成居民的反彈。針對天燈危害問題，新北市政府和天燈店家推出「天燈回收」、「天燈身分證」與「減少燃料」等環保對策，用回收獎金鼓勵居民撿拾天燈垃圾，且被天燈燒毀財物的民眾還可以透過身分證找店家賠償，但仍有高達好幾噸的垃圾留在回收業者難以觸及的深山，成效有限。

    民間團體文化銀行設計團隊推出一款「環保天燈」，是用回收紙漿製造的全紙天燈，連支架都是設計過的紙漿燃料，當環保天燈點燃並升到一定高度時，就可以完全燃燒，不留下垃圾。但是環保天燈的材料採用較貴的回收紙漿，因此製作成本會比一般傳統天燈更高，需要政府或平溪在地商家合作，才有可能普及。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 為了減少放天燈帶來的汙染及垃圾清理等外部成本，市政府和店家推出解決方式即是將其內部化，轉化為成本的一部分，因此天燈售價＝天燈材料費＋殘骸處理費，故選(D)。
