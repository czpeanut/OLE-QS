  group_stem: '18 世紀初期，英國為避免國內農業受到國外廉價穀物的競爭，設立《穀物法》，要求穀物價格未超過指定標準金額者無法進口。當時以地主貴族為首的保守黨支持《穀物法》；而支持自由貿易的實業家則宣稱此法案增加了工業生產成本，主張若能進口更便宜的糧食，便能降低工資，有利於國內的工業發展。

    1846 年因愛爾蘭馬鈴薯災荒，幾百萬愛爾蘭人餓死與流落他鄉，為解救災荒，經過一連串的抗爭後，《穀物法》遂於 1846 年廢除，讓外國糧食自由進入英國。《穀物法》的廢除，象徵英國中產階級在爭取政治權力中的一項重要勝利，但對英國帶來農業大蕭條的直接衝擊。1870
    ～ 1880 年代，受到交通技術革新以及冷凍運輸設備技術改進，英國自海外進口的穀物量提升 90 ％，肉品量提高 300 ％。'
