  group_stem: '2024 年 6 月 12 日，歐盟宣布自 7 月起對中國進口的電動汽車徵收臨時性懲罰性關稅，各品牌將面臨 17 ％至 38 ％的稅率。此舉旨在應對中國過剩產能及不公平補貼，這些補貼使中國電動汽車以低價進入歐洲市場，對當地企業構成威脅。歐盟委員會主席強調，有必要保護本地市場，不再容忍中國的「傾銷戰略」。

