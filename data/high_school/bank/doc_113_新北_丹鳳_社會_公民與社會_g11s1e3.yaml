    content: 中國國內大豆價格應低於國際市場大豆的均衡價格
  - label: B
    content: 貿易前，美國國內大豆市場是屬於超額需求的狀況
  - label: C
    content: 貿易後，美國國內消費者要花較高價格才能買大豆
  - label: D
    content: 兩國進行大豆貿易之後，經濟福祉不一定都能增加
  group_stem: '資料一：為了因應畜牧業所需，中國全球最大的大豆進口國，有九成的大豆都是進口。因此中國從美國進口大量大豆和玉米，是美國農產品最重要的外銷市場。國際市場因烏克蘭危機和全球氣候異常，導致穀物供應不穩定，玉米、大豆等穀物飼料價格高漲。再加上疫情過後各國強勁需求、飼料成本飆升，進而推高肉類價格。

    資料二：豬肉是占中國肉類消費 6 成的重要食材，中國是世界上最大的豬肉生產國，也是全球最大的豬肉進口國，主要從西班牙、巴西、美國進口。由於 2019 年非洲豬瘟流行，中國國內豬肉供給減少，到
    2020 年價格暴漲到兩倍以上，進口豬肉數量因而擴增。中國在非洲豬瘟稍微平息後，開始恢復繁殖生豬，迅速擴大國內生產，隨著養豬數量恢復，近期豬肉價格暫時穩定下來。根據中國財政部的一份聲明，對於貿易最惠國的關稅從
    8 ％恢復到 12 ％，以調節對進口豬肉的需求。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中國為大豆進口國，因此其國內市場價格應高於國際市場價格。(B)美國為出口國，因此貿易前，美國國內大豆市場為超額供給的狀況。(C)出口後，美國國內的價格會提高，消費者可能要花費較高價格來購買大豆，為正解。(D)國際貿易後，進出口國的經濟福祉皆會增加。
