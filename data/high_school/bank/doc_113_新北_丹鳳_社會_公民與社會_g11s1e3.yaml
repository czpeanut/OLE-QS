  answer_source: answer_key
  explanation: (A) $P_{1}$ 應為價格上限，會導致供不應求，引發黑市交易的問題。(B)供不應求現象，會減少供給量。(C)為正解。(D)管制後的社會福祉應是
    AB0C 梯形面積。
- id: doc_113_新北_丹鳳_社會_公民與社會_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 基本工資從 2025 年元旦起調升，月薪部分從新臺幣 27,470 元調漲至 28,590 元；時薪部分則由 183 元調升至 190 元。根據勞動部統計，調升基本工資後約有
    257 萬名勞工受惠。針對政府訂定的基本工資政策，下列敘述何者正確？
  options:
  - label: A
    content: 基本工資要訂定在均衡工資以上才有效果
  - label: B
    content: 基本工資會產生勞動市場供不應求的情況
  - label: C
    content: 政府訂定基本工資後生產者剩餘必定會減少
  - label: D
    content: 政府訂定基本工資的政策會增加經濟福祉
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 政府訂定市場中可合法進行交易的最低價格，此價格往往比市場均衡價格高，用以保護農產品生產者及勞工，例如：《勞動基準法》規定最低工資標準、政府規定農產品最低收購價格。(A)基本工資為價格下限，須定於均衡工資以上才能發揮效果，為正解。(B)應是會造成供過於求的現象。(C)生產者剩餘的變化不一定。(D)此為政府管制的情形，會減損社會福祉。
