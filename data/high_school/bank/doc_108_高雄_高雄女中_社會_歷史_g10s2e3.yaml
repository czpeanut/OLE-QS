  group_stem: 請閱讀資料後回答問題 二戰期間，超過20萬名臺灣人被日軍徵召前往中國、東南亞各地及太平洋地區工作，其中超過3萬人命喪亞洲各地戰場。戰爭結束後，計190名臺灣人被控涉入相關戰爭犯罪行為，遭各盟國軍事法庭審判，被判刑定罪為乙／丙級（Class B/C）戰犯。根據日本官方戰後的統計，臺籍戰犯中有95人是在澳洲舉辦的軍事法庭遭到判刑，共有21名臺籍戰犯被判處死刑，遭處決。 如其中一名遭判刑的臺級戰犯楊樹木。楊樹木早在1930年就跟隨一個臺灣樂團來到檳城，1932年跟在當地出生長大的林月娥結婚，並在檳城市立樂隊找到工作，還參與當地為英國殖民當局服務的義勇隊。1941年太平戰爭爆發，英國將當地的日本人監禁，日軍很快的在12月下旬攻佔檳城，迫使英軍投降。隨後，日軍釋放被拘留在當地監獄的日本人，包括楊樹木；之後，楊樹木因其身分和通曉日文、福建話，被憲兵隊要求擔任通譯。法庭紀錄顯示，是在憲兵隊審訊當地嫌疑犯的過程中擔任翻譯及協助的角色，同時被指控對人虐待和施暴，如有人指控女囚被他帶出，回來時飽受驚嚇；被他用柔道摔過的人，三天後死亡。 經過學者研究，楊樹木也曾經營救多名人質，人質礙於怕捲入案情不敢為楊樹木出面作證。據其妻林月娥的陳情書，有4個小孩的楊樹木厭惡憲兵隊的工作，不願意從事任何傷害華人之事，渴望脫離憲兵隊而自由從商。這份申訴楊樹木是在不得已的情況下從事通譯工作的陳情書，但並沒有改變他的命運。1946年12月與同案被判處死刑的另兩名臺籍通譯遭到處決。
