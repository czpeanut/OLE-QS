  explanation: 當$\vec{c}$⊥$\vec{b}$時，|$\vec{c}$| 有最小值， 即 ($\vec{a}$＋t$\vec{b}$)．$\vec{b}$＝0 ⇒ $\vec{a}$．$\vec{b}$＝－t |$\vec{b}$|$^{2}$ ⇒ t＝$\frac{-\vec{a}\cdot \vec{b}}{|\vec{b}|^{2}}$＝－$\frac{6}{2}$＝－3 ⇒ |$\vec{c}$|＝|$\vec{a}$－3$\vec{b}$|＝| ( 2 , 4 )－( 3 , 3 ) |＝| (－1 , 1 ) |＝$\sqrt{2}$， 故 |$\vec{c}$| 的最小值為$\sqrt{2}$。
