  stem: 設$\vec{a}$＝( 2 , 4 )，$\vec{b}$＝( 1 , 1 )，$\vec{c}$＝$\vec{a}$＋t$\vec{b}$，則 |$\vec{c}$| 的最小值為＿＿＿＿。
