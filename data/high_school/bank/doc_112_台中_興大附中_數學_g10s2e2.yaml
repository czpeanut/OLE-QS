  group_stem: '2.甲、乙、丙、丁、戊、己、庚七人排成一列，甲在乙、丙之右方，但甲、乙或甲、丙不一定相鄰，則排列方式有＿＿＿＿種。

    3.有 8 人參加校內歌唱比賽，依 3 人、3 人、2 人分成三組進行分組初賽。若惠惠、悠悠兩位好友必須同一組，則分組方式有＿＿＿＿種。'
  answer:
  - －160
  answer_status: verified
  answer_source: answer_key
  explanation: '展開後一般項為$C_{k}^{6}$（$ax^{3}$）$^{6－k}\left( -\frac{1}{2x^{2}} \right) ^{k}$＝$C_{k}^{6}a^{6－k}\left( -\frac{1}{2} \right) ^{k}x^{18－5k}$

    若 18－5k＝－2，則 k＝4

    k＝4 代入得$C_{4}^{6}a^{2}\left( -\frac{1}{2} \right) ^{4}$＝15 ⇒ $\frac{15}{16}a^{2}$＝15 ⇒ a＝±4（∵a＞0 ∴負不合）

    若 18－5k＝3，則 k＝3

    k＝3 代入得$C_{3}^{6}4^{3}\left( -\frac{1}{2} \right) ^{3}$＝20×64×$\left( -\frac{1}{8} \right)$＝－160，故 $x^{3}$ 項的係數為－160'
