  stem: 「2020 年過世的文壇大家鍾肇政先生，著有『臺灣人三部曲』。書中記述了臺灣人民抗擊日本侵略的英雄史。第一部記述日治臺灣初期陸家子弟祭祖誓師，在民間抗日領袖旗幟下，殺敵獻身。第二部寫 20 世紀初陸家第六代青年繼承前輩抗日傳統，領導農民反剝奪、反壓榨，抗租請願，英勇鬥爭。最後青年跨越海峽，回歸大陸，與祖國融為一體。第三部描寫陸家第七代青年在東京參加祕密抗日組織，潛回臺灣工作，隱蔽直到抗日戰爭勝利。」根據題幹，下列推論何者正確？
  options:
  - label: A
    content: 臺灣人三部曲最終描寫回歸大陸，應屬於反共文藝
  - label: B
    content: 臺灣人三部曲是 1930 年代的本土語文創作代表
  - label: C
    content: 臺灣人三部曲展現了臺灣土地上發生過的歷史故事
  - label: D
    content: 臺灣人三部曲著重個人情感描寫，為現代主義文學
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「臺灣人三部曲」以陸家子弟為主角，從日治初期描述到抗日戰爭結束，呈現日治時期發生在臺灣土地上的故事，(C)為正解。(A)臺灣人三部曲以抗日為軸心，非反共。(B)應是 1970 年代。(D)應屬於鄉土文學。
