  stem: 4 世紀後，鑲嵌藝術逐漸取代先前的大型立體雕塑成為主流的藝術形式，應代表何種歷史意義？
  options:
  - label: A
    content: 統治者否定教會的權威
  - label: B
    content: 更強調君王的豐功偉績
  - label: C
    content: 描繪立體感的技法純熟
  - label: D
    content: 基督宗教成為文化的中心
  group_stem: '請閱讀下文回答下列問題：

    鑲嵌藝術又稱為馬賽克，是將陶瓷、石頭、玻璃等材料組合拼貼的藝術形式。鑲嵌在古希臘時代正式成為藝術的表現形式，古羅馬時代則是隨著統治者的征伐發揚光大，且流亡各地的基督徒也藉此藝術傳遞理念，自此奠基鑲嵌藝術和基督宗教的緊密關聯。

    4 世紀在君士坦丁承認基督宗教為合法宗教下，鑲嵌藝術得到空前的發展，自此，鑲嵌藝術逐漸取代歌頌勝利的大型立體雕塑，成為主流的藝術形式。拜占庭帝國延續古羅馬帝國，發展更精巧、鮮豔華麗的教堂壁畫，適用於所有室內平面，展現高度成熟的製作技巧，伊斯蘭教的清真寺此時也可見大量使用鑲嵌藝術作為裝飾。8 世紀鑲嵌藝術由於李奧三世的宗教政策曾中斷約 120 年，使得人才及技術傳承開始出現斷層；文藝復興時代則是由於鑲嵌藝術不符合畫家對立體感及細緻呈現的追求，創作逐漸式微，不過近代由於基督宗教的海外傳播，傳統的鑲嵌藝術再度受到關注。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
