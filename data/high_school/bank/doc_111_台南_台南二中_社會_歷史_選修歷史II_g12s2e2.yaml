  stem: 在這個地區耕種是一場和地理對抗的戰役，此區最肥沃的土壤，都位在容易崩塌的位置，因此容易引發侵蝕。氣候的型態使這個問題更為惡化，乾季時雨水太少，風很容易將細微的土壤吹走，雨季時雨水又太多，傾盆大雨沖刷整片山丘，帶走養分，使整座河谷氾濫成災。為了管理用水與控制侵蝕，當地居民開闢梯田，16 世紀西班牙航海家甘博阿記載：「田地就像階梯一樣嵌進山裡，長約兩百步，寬約 20 ～ 30 步，臨山處築以石牆，凹處覆蓋泥土。」從 16 世紀以來當地人就用這樣的方式持續務農為生。請問關於上文正確的理解為何？
