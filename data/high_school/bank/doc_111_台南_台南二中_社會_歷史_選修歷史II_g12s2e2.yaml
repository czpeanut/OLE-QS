  group_stem: '請閱讀下列文章後，回答下列問題：

    糖麵包山是一座位於巴西里約熱內盧市一座海拔 1,299 英呎的山峰，傳說當地先民依它的形狀有如一塊麵包頭，便以原住民語言的諧音取名而成，回顧巴西的發展史會發現自被歐洲列強殖民統治後，為了滿足歐洲對甲作物產量的需求，統治者開始在當地種植大面積的甲作物，不過為加工製造甲作物，工廠必須動用大量勞工，但因當時印第安人已因歐洲人帶來的傳染病和殘忍的勞動剝削大幅減少，歐洲侵略者於是引進大量□□勞工，據悉當時的甲作物被稱為「白貨物」，而□□則稱為「黑貨物」，至 17 世紀，巴西已成為世界最大的甲作物產地，糖麵包山的地名正反映了巴西甲作物業的發展由來。'
  answer:
  - B
