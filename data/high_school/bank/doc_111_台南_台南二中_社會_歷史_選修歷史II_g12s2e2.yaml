  explanation: 從題文敘述可知，森林遭砍伐與人口的繁衍增加有關。14 世紀後期，「森林重返」意味著英格蘭人口大減，最可能的原因是(C)黑死病流行，造成人口大量死亡。(D)英法百年戰爭的戰場在歐陸，加上戰爭前期英軍占上風，英格蘭本土破壞不大，故不選。
