  stem: '資料一：「在某一時期，政府推廣戲劇改良運動，鼓勵傳統戲曲演出大義滅親、投奔光明、女匪幹、望中央等合於基本國策的劇目，對傳統戲曲發展造成影響。但影響更大的因素來自於社會發展，尤其是電視節目的開播，提供民眾更多元的視聽娛樂。雖然布袋戲也曾在電視上紅遍一時，但由於語言政策，政府再次限制閩南語節目的時段，而使戲曲觀眾大量流失。」

