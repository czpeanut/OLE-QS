  group_stem: '請閱讀以下新聞報導，並回答下列問題：

    金獎名導尚賈克阿諾耗資近 10 億新臺幣打造災難鉅獻—《聖母院大火：世紀浩劫》，電影在 2023 年 4 月 14 日於全臺上映，該片改編自 2019 年 4 月 15 日發生的「巴黎聖母院大火」事件，描述法國精神象徵巴黎聖母院遭逢世紀大火，消防員及各路人馬搏命搶救的過程。

    擁有 850 年歷史的巴黎聖母院，過去是觀光客到巴黎的必去之地，每年吸引超過約 1,300 萬遊客，是巴黎市區最受歡迎的景點，也是巴黎最具代表性的古蹟。

    聖母院最早由法國國王路易七世開工興建，經過近 200 年的修建工程，直到 13 世紀時才正式完工。1431 年，英格蘭國王亨利六世在這裡加冕，後來教堂曾一度失修，幾近荒廢，直到拿破崙時期才得以修復，他也在 1804 年於巴黎聖母院中被加冕為皇帝，見證法國歷史重大時刻的聖母院是法國人民重要的精神象徵。

    2019 年聖母院發生火警，讓法國人民感到痛心，《聖母院大火：世紀浩劫》電影導演尚賈克阿諾即與巴黎聖母院的淵源頗深，早在 7 歲那年，他就拿著人生第一臺相機拍下巴黎聖母院的屋頂，也使他想用鏡頭記錄下事件後浴火重生的巴黎聖母院。

    根據 CBC 報導，巴黎遊客中心官方網站表示，由於重建工程進展迅速，經過 6 年的時間，法國聖母院預計將在 2024 年的 12 月重新開放！

    負責監督重建工程的政府單位管理主任，菲利普．約斯特（Philippe Jost）指出，修復後的結果「將忠實於原始的建築」，除了堅持保留已經消失的教堂外部形狀，同時也堅持使用和中世紀相同的材料和建築方法，期盼讓聖母院能重新回到巴黎的天空下！'
