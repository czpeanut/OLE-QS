  stem: 蘇格蘭和英格蘭在一起只有 300 年。有些蘇格蘭人一直想跟語言和文化都不同的英格蘭分家。最近，由於英格蘭不再強大，想獨立的蘇格蘭人更多了。2019 年年底在蘇格蘭再度提出獨立公投，討論獨立後加入歐盟，甚至歐元區。請問以下哪些國家組合為「歐盟國中未使用歐元」的國家？
