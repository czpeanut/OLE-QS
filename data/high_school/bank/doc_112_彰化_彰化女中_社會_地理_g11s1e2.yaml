  stem: 沙烏地阿拉伯王儲沙爾曼王子受各界矚目，他公開表示要帶領沙國重返溫和的宗教文化，並且大力推動「願景 2030」計畫，希望透過「願景 2030」計畫，解決目前高度依賴特定產業的窘境。近年沙烏地阿拉伯之所以積極產業轉型的背景為何？
  options:
  - label: A
    content: 以色列耶路撒冷取代原有沙國麥加觀光收入
  - label: B
    content: 肥沃月彎沙漠化嚴重影響沙國糧食生產
  - label: C
    content: 國際油價低迷，影響沙國經濟穩定
  - label: D
    content: 受國際制裁，使社會經濟出現危機
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)由於國際油價不穩定，對沙國經濟產生影響，因此沙國企圖擺脫對石油的依賴。「願景 2030」主要內容包括擺脫石油依賴，實現經濟多元化，建立溫和包容的伊斯蘭教社會。(A)以色列為猶太教，與麥加朝聖觀光客源並不衝突。(B)沙國並不在肥沃月彎，肥沃月彎的環境變遷對其直接影響不大。(D)沙國為伊斯蘭國家中較為親美的國家，未受到國際制裁。
