  stem: 台積電此次設廠的位置與美國傳統高科技產業重心的加州矽谷有一段距離，加州矽谷在疫情之後發生「甜甜圈效應」，其中就與嚴重的塞車問題及房價有關，根據統計，2017 年舊金山灣區平均每人每年因塞車而耽誤了 103 小時。舊金山塞車嚴重與下列哪兩項因素關係最為密切？(甲)完善的高速公路(乙)發達的網路環境(丙)高昂的房價(丁)便捷的大眾運輸。
