  stem: 由上文哪句話可以看出歐盟在成員國禁止烏克蘭農產品進口的態度？（30 字內）
  group_stem: '歐洲多國包含波蘭、匈牙利、保加利亞等，於 2023 年 4 月先後禁止烏克蘭農產品進口，甚至連過境運輸也被禁止。原因是這些國家沒有糧食轉運的配套措施，導致大量的烏克蘭廉價穀物和農產流入市場，衝擊當地農業。而歐盟面對這些情況，表示貿易政策應該是歐盟的職權，不能接受會員國單方面的行動。而後，歐洲歐盟在 9 月 15 日宣布，結束在東歐 5 個國家禁止進口烏克蘭糧食的禁令。但波蘭、匈牙利和斯洛伐克立即宣布，將違反歐盟的決定，繼續採取限制措施。

    這個事件的遠因為俄烏戰爭爆發後，俄羅斯封鎖部分黑海港口使烏克蘭糧食出口受限，在聯合國、土耳其、烏克蘭及俄羅斯的四方協調下，每 4 個月就會復議一次黑海糧食協議，烏克蘭為了確保糧食得以運往歐洲，陸路糧食出口途徑就成後路。而在 2023 年 7 月俄羅斯宣布不再延長該協議，使依賴俄羅斯與烏克蘭小麥進口的非洲 14 個國家擔憂發生糧食短缺。請問：'
  answer:
  - 貿易政策應該是歐盟的職權，不能接受會員國單方面的行動
  answer_status: verified
