  stem: 受阿拉伯之春影響，西亞部分國家的民眾起而對抗獨裁專制政權，原本國內兩派人馬的內戰，在外國勢力進入並展開角力後，使情勢更加無法控制。請問下列敘述何者正確？
  options:
  - label: A
    content: 這種情況又可稱為代理人戰爭
  - label: B
    content: 敘利亞內戰的什葉派政府軍背後有沙烏地阿拉伯支持
  - label: C
    content: 遜尼派的伊朗政府也常暗中援助他國同派別勢力
  - label: D
    content: 葉門內戰中美國支援什葉派的胡塞反政府組織
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)西亞各國內戰，並非單純的國內問題，當中有許多外國勢力介入，可以稱為代理人戰爭。(B)政府軍阿薩德政權為什葉派，沙烏地阿拉伯為遜尼派。(C)伊朗為什葉派。(D) 2021 年美國退出葉門內戰聯軍，並將胡塞組織視為恐怖組織，並未支持。
