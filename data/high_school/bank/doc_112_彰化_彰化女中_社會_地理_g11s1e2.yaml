  stem: 北美洲北部曾遭受第四紀大陸冰河覆蓋，美國哪一項地理特性和曾遭冰河覆蓋有關？
  options:
  - label: A
    content: 摩和克河是紐約連結五大湖地區水路
  - label: B
    content: 中部大平原南部，湖泊星羅棋布
  - label: C
    content: 冬季極地大陸氣團直驅南下，天氣乾冷
  - label: D
    content: 東部阿帕拉契山脈為古老的結晶岩地塊
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)摩和克河谷地為第四紀大冰河侵蝕阿帕拉契山所形成。(B)中部大平原的北部才是冰蝕湖泊分布，南部多沖積平原。(C)冬季冷氣團南下，主要是地形影響，中部平原的走廊形貌，使冷氣團可以直驅南下。(D)古結晶岩地塊為地質構造，雖然是上層地層被冰河侵蝕而出露，但下層的結晶岩則是在地下深層冷卻結晶形成，非外營力作用。
