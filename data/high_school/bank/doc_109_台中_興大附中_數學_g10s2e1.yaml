- id: doc_109_台中_興大附中_數學_g10s2e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 有 20 筆數據（$x_{i}$，$y_{i}$），i＝1，2，……，20。已知其平均μ$_{x}$＝3，μ$_{y}$＝5，且 x 與 y 的相關係數 r＝0.8，若 y 對 x 的迴歸直線 L 通過點（2，1）。試問下列哪些選項是正確的？
  options:
  - label: A
    content: L 通過點（3，5）
  - label: B
    content: L 的斜率為 0.8
  - label: C
    content: L 方程式為 y＝4x－7
  - label: D
    content: x 的標準差大於 y 的標準差
  - label: E
    content: 若 $P_{i}$＝$2x_{i}$＋5 且 $Q_{i}$＝$3y_{i}$＋1，則 Q 對 P 之迴歸直線的斜率大於 L 的斜率
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '迴歸直線必過（μ$_{x}$，μ$_{y}$）＝（3，5）

    由 L 過（3，5）、（2，1），可知 L：4x－y＝7

    (A) ○

    (B) ╳：L 的斜率應為 4

    (C) ○

    (D) ╳：∵$4=r\times \frac{\sigma _{y}}{\sigma _{x}}=0.8\times \frac{\sigma _{y}}{\sigma _{x}}$

    ∴$\frac{\sigma _{y}}{\sigma _{x}}=5$ ⇒ σ$_{x}$＜σ$_{y}$

    (E) ○：$\begin{cases}P =2x+5 \\ Q =3y+1\end{cases}$ ⇒ $\begin{cases}x =\frac{1}{2} (P-5) \\ y =\frac{1}{3} (Q-1)\end{cases}$ 代入 4x－y＝7 得

    $4\left[ \frac{1}{2} (P-5) \right] -\frac{1}{3} (Q-1)=7$ ⇒ $2 (P-5)-\frac{1}{3} (Q-1)=7$ ⇒ $\frac{1}{3} (Q-1)=2P-17$

    ⇒ Q＝6P－50，斜率為 6，大於 L 的斜率 4

    故選(A)(C)(E)'
