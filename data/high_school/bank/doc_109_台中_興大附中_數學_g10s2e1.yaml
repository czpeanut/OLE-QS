  stem: 假設在小巨蛋球館觀看籃球比賽，已知<u>小延</u>坐在紫色區的席位共有 20 排的座位，此區每一排都比其前一排多 k 個座位。<u>小延</u>坐在第 10 排，他發現第 10 排與第 11 排共有 235 個座位。則此巨蛋球場的紫色區總共有多少個座位？
  options:
  - label: A
    content: 2200 個
  - label: B
    content: 2350 個
  - label: C
    content: 2460 個
  - label: D
    content: 2510 個
  - label: E
    content: 條件不足，無法計算
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '令第 1 排到第 20 排的座位數量分別為 $a_{1}$，$a_{2}$，……，$a_{20}$

    且$a_{n+1}=a_{n}+k$，n＝1，2，……，19

    即〈$a_{n}$〉為等差數列

    ∵$a_{10}$＋$a_{11}$＝235

    ∴紫色區共有 $a_{1}$＋$a_{2}$＋……＋$a_{19}$＋$a_{20}$

    ＝（$a_{1}$＋$a_{20}$）＋（$a_{2}$＋$a_{19}$）＋……＋（$a_{10}$＋$a_{11}$）

    ＝10（$a_{10}$＋$a_{11}$）＝2350 個座位

    故選(B)'
