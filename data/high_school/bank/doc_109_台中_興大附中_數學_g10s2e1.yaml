  stem: 請問級數$\left( 1-\frac{0}{20} \right) \left( 1-\frac{1}{20} \right) +\left( 1-\frac{1}{20} \right) \left( 1-\frac{2}{20} \right) +\ldots \ldots +\left( 1-\frac{n}{20} \right) \left( 1-\frac{n+1}{20} \right) +\ldots \ldots+\left( 1-\frac{19}{20} \right) \left( 1-\frac{20}{20} \right)$的和＝？
  options:
  - label: A
    content: $\frac{133}{20}$
  - label: B
    content: $\frac{135}{20}$
  - label: C
    content: $\frac{137}{20}$
  - label: D
    content: $\frac{139}{20}$
  - label: E
    content: $\frac{141}{20}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\left( 1-\frac{0}{20} \right) \left( 1-\frac{1}{20} \right) +\left( 1-\frac{1}{20} \right) \left( 1-\frac{2}{20} \right) +\ldots \ldots +\left( 1-\frac{19}{20} \right) \left( 1-\frac{20}{20} \right)$

    ＝$\left( 1-\frac{1}{20}-\frac{0}{20}+\frac{0\times 1}{20^{2}} \right) +\left( 1-\frac{2}{20}-\frac{1}{20}+\frac{1\times 2}{20^{2}} \right) +\ldots \ldots +\left( 1-\frac{20}{20}-\frac{19}{20}+\frac{19\times 20}{20^{2}} \right)$

    ＝$(1+1+\ldots \ldots +1) -\frac{1}{20} (1+2+\ldots \ldots +19+20) -\frac{1}{20} (0+1+\ldots \ldots +19) +\frac{1}{20^{2}} (0\times 1+1\times 2+\ldots \ldots +19\times 20)$

    ＝$20-\frac{1}{20}\times \frac{20\times 21}{2}-\frac{1}{20}\times \frac{19\times 20}{2}+\frac{1}{20^{2}} 〔 (0^{2}+0) + (1^{2}+1)+\ldots \ldots +(19^{2}+19) 〕$

    ＝$20-\frac{1}{20}\times \frac{20\times 21}{2}-\frac{1}{20}\times \frac{19\times 20}{2}+\frac{1}{20^{2}} 〔 (0^{2}+1^{2}+\ldots \ldots +19^{2}) + (0+1+\ldots \ldots +19) 〕$

    ＝$20-\frac{1}{20}\times \frac{20\times 21}{2}-\frac{1}{20}\times \frac{19\times 20}{2}+\frac{1}{20^{2}} \left( \frac{19\times 20\times 39}{6}+\frac{19\times 20}{2} \right)$

    ＝$20-\frac{21}{2}-\frac{19}{2}+\frac{133}{20}=\frac{133}{20}$

    故選(A)'
