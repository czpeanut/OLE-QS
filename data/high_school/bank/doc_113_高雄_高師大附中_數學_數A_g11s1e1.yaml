  stem: 設4 sin θ＋3cos θ＝0，且sin θ＜0，請選出正確選項。
  options:
  - label: A
    content: θ是第三象限角
  - label: B
    content: cos θ＝$\frac{4}{5}$
  - label: C
    content: cos$\frac{\theta}{2}$＝－$\frac{3\sqrt{10}}{10}$
  - label: D
    content: cos 2θ＝$\frac{7}{25}$
  - label: E
    content: cos 3θ＝$\frac{44}{125}$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：4 sin θ＋3 cos θ＝0 ⇒ $\frac{\sin \theta}{\cos \theta}$＝－$\frac{3}{4}$＝tan θ 又sin θ＜0，可以 θ在第四象限。 (B) ○：cos θ＝$\frac{4}{5}$。 (C) ×：cos θ＝2 $cos^{2}\frac{\theta}{2}$－1 ⇒ cos$\frac{\theta}{2}$＝±$\sqrt{\frac{1+\cos \theta}{2}}$＝±$\sqrt{\frac{1+\frac{4}{5}}{2}}$＝±$\frac{3\sqrt{10}}{10}$ θ在第四象限角，$\frac{\theta}{2}$可能在二、四象限 ∴ cos$\frac{\theta}{2}$未必為－$\frac{3\sqrt{10}}{10}$ (D) ○：cos 2θ＝2 $cos^{2}$ θ－1＝2 ( $\frac{4}{5}$ )$^{2}$－1＝$\frac{7}{25}$。 (E) ×：cos 3θ＝4 $cos^{2}$ θ－3 cos θ＝4 ( $\frac{4}{5}$ )$^{3}$－3 ( $\frac{3}{5}$ )＝－$\frac{44}{125}$。 故選(B)(D)。
