- id: doc_112_高雄_新莊_自然_地科_g10s1e2_s1_48
  section: 1
  number: 48
  type: single
  page: 5
  stem: 最少含氧區所在的區域，會與下列哪一海水分層重疊程度高？
  options:
  - label: A
    content: 透光帶
  - label: B
    content: 混合層
  - label: C
    content: 斜溫層
  - label: D
    content: 深水層
  - label: E
    content: 潮間帶
  group_stem: 刊載於2018年12月《科學進展》的一篇文章中，提到海水溶氧量的減少將會造成生物巨大危機。文中提到，因為海洋小型生物較能生存於相對極端的環境，因此能逃過海洋中較為上層的消費者的補食。但是，近年來因為氣候變遷之故，使得海水溶氧量減少，導致位於水深200～1,500公尺處的「最少含氧區」（Oxygen Minimum Zone , OMZ）的範圍逐漸擴張。此一現象會使原先棲居於OMZ處的生物，如磷蝦與其他海洋生物的幼體等小型生物，被迫遷徙至較淺水域生活。但這個舉動，勢必提高他們的生存風險，因為捕食牠們的生物－鯨魚、墨魚此類較為大型的消費者，也同樣棲息於相近深度水域。因此，若海水溶氧量持續下降的話，將會影響到食物網的全體，且徹底對海洋生態產生巨大的改變。2017年2月的一篇文章提到，全球海水溶氧量在這半個世紀以來，已因氣候變化與海水分層減少了2％，<u>太平洋</u>為溶氧量跌幅最大的海域，北冰洋則是溶氧量百分之比跌幅最大者。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  tags:
