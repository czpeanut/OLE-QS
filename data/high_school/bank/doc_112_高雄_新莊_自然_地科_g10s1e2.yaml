  group_stem: 從<u>日據時代</u>就發現，西北颱容易造成<u>臺灣</u>北部嚴重災情，當時被稱為「西進颱風」，後來老一輩的氣象人明確將中心通過<u>基隆</u>及<u>彭佳嶼</u>這類型颱風定義為「西北颱」；事實上一般的氣象學並無此定義，但廣義來說，只要颱風移動到<u>臺灣</u>西北部海面上引進旺盛西北風，即可稱為「西北颱」。西北颱恐怖之處在於引進長時間的強勁西北風，易與雪山山脈出現地形交互作用，在北部、東北部山區造成劇烈降雨，西北風也會順著淡水河口灌入<u>臺北</u>盆地，使積水難洩或河岸兩側淹水釀災。
  answer:
  - C
