  stem: 在平滑桌面上有二物體，其質量分別為M與m，二者間壓縮一彈簧且被線縛在一起。若將此線剪斷後，二物體被彈開，當此二物體與彈簧完全分開t秒後，物體M滑過D公尺，m滑過d公尺，則M與m之比值為
  options:
  - label: A
    content: $\frac{d}{ D }$
  - label: B
    content: $\frac{D}{ d }$
  - label: C
    content: $\frac{2d}{ D }$
  - label: D
