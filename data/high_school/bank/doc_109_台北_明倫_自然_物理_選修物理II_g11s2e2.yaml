  stem: 一質量為m之質點附在一質量可略去之長桿一端。該長桿能以其另一端為軸在一垂直面上無摩擦地自由旋轉。若長桿最初靜止於與鉛垂線成60度角之位置，如圖所示，則放下後質點落到最低時長桿之張力為何？
