- id: doc_109_台北_明倫_自然_物理_選修物理II_g11s2e2_s2_12
  section: 2
  number: 12
  type: multiple
  page: 1
  stem: 在水平地面上有一球落地反彈又落地，週而復始。前後兩次反彈又落地的過程之最大高度比為l：0.64。假設空氣阻力可以忽略，則下列有關前後兩次反彈又落地過程的敘述，哪幾項正確？
  options:
  - label: A
    content: 最大動能的比例為1：0.64
  - label: B
    content: 「最大位能-最小位能」的比例為1：0.64
  - label: C
    content: 最大力學能的比例為1：0.8
  - label: D
    content: 最大速度量值的比例偽l：0.64
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_109_台北_明倫_自然_物理_選修物理II_g11s2e2_s2_14
  section: 2
  number: 14
  type: multiple
  page: 2
  stem: 從質量為M的地球發射衛星時，先將質量為m的衛星發射至半徑為r近地面的圓軌道1運行，速度v，如圖所示；再從Q點改變其速度，改沿橢圓軌道2運行；最後從P點將它送入半徑為3r的圓軌道3運行。軌道1、2相切於Q點，軌道2、3相切於P點。以下敘述請選出正確者？
  options:
  - label: A
    content: 衛星在r軌道作圓周運動時，其速度大小$\sqrt{ \frac{GM}{ r } }$，與衛星質量m無關
  - label: B
    content: 衛星在橢圓軌道由Q點運行到P點時，位能增加$\frac{2GMm}{ 3r }$，其動能減少量也是$\frac{2GMm}{ 3r }$
  - label: C
    content: 衛星在橢圓軌道上Q點的動能與P點的動能比值是3：1
  - label: D
    content: 衛星若要由r的圓軌道在Q點進入如圖中的橢圓軌道，其在Q點的速度要等於$\sqrt{ \frac{3GM}{ 2r } }$
  - label: E
    content: 衛星若要在P點由橢圓軌道進人3r圓軌道，必須加速
  assets:
  - key: s2_14_f1
    kind: figure
    file: doc_109_台北_明倫_自然_物理_選修物理II_g11s2e2/s2_14_f1.png
    crop:
      page: 2
      rect:
