  group_stem: 被子植物花粉管中的兩個精細胞通常是由生殖細胞經對等的有絲分裂而產生的，因此它的形態和基因表現應該是相似的。但是，長久以來，科學家的心中存困惑—這兩個精細胞的功能是否相等？也就是說，這兩個精細胞的受精能力是否相等？為了回答這個問題，科學家選用了一個阿拉伯芥的突變株rbr1，此突變株與野生型不同之處為：它的胚珠在雌配子形成的過程中會無止境的增生，而產生較野生株多的中央細胞核（野生型只有兩個細胞核），但是這些細胞核不具有受精能力。此外，rbr1突變株也含有與野生型的卵細胞形態相似的兩個卵細胞（野生型只有一個卵細胞），科學家利用一種只能在成熟的卵細胞表現的特殊蛋白質（Egg cEll 1，EC1）接上綠色螢光劑，在螢光顯微鏡下辨識卵細胞是否成熟，結果發現rbr1突變株的額外卵細胞是完全分化並具有功能。因此，阿拉伯芥rbr1突變株的胚珠提供了一個可以用來挑戰兩個精細胞是否皆有與卵細胞受精的實系統。科學家先將具有綠色螢光EC1的rbr1突變株的膤珠與野生型的花粉交配，此野生型的精細胞已先用接有紅色螢光劑的蛋白質HTR10-mRFP1標識。在螢光顯微鏡下可以觀察到野生型的一對精細胞到達rbr1突變株的胚珠。接觀察到這兩個精細胞的核與卵細胞的核結合，由此表示這兩個精細胞皆有相等能力與卵細胞結合。科學家的結論是：阿拉伯芥的兩個同形的精細胞具有同等與卵細胞受精的功能，但是本實驗尚無法知道兩個精細胞與中央細胞結合的能力是否相似。
