  section: 1
  number: 10
  type: single
  page: 1
  stem: 取20克的金屬X氧化物（XO），在適當條件下與足量的硫酸完全反應，產生60克的$XSO_{4}$和m克的$H_{2}$O，反應式為：XO＋$H_{2}SO_{4}$→$XSO_{4}$＋$H_{2}$O，此反應式的係數已平衡，則X應為下列哪一種金屬？
  options:
  - label: A
    content: Be
  - label: B
    content: Mg
  - label: C
    content: Ca
  - label: D
    content: Zn
  - label: E
    content: Ba
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 假設金屬原子量＝x，由係數比＝1：1，故可列式得：$\frac{20}{x+16}$＝$\frac{60}{x+96}$，得x＝24，應為Mg。故選(B)。
