- id: doc_113_台南_台南二中_自然_化學_選修化學I_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 一氧化氮（NO）在細胞的訊號傳遞中，扮演重要的調控角色。在實驗室裡，可用銅還原稀硝酸來製備NO，係數尚未平衡的反應式為：a Cu + b $H^{＋}$+ c $NO_{3}^{－}$→ d $Cu^{2＋}$+ e NO + f $H_{2}$O 反應式平衡後，係數均為最簡整數比時，則c + e + f 之總和為何？
  options:
  - label: A
    content: '8'
  - label: B
    content: '9'
  - label: C
    content: '10'
  - label: D
    content: '22'
  - label: E
    content: '28'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 方程式：a Cu＋b $H^{＋}$＋c $NO_{3}^{－}$ → d $Cu^{2＋}$＋e NO＋f $H_{2}$O，首先假設a＝1，則由Cu原子不滅可得d＝1；接著由N原子不滅可得c＝e，由電荷不滅可得b－c＝2，得b＝c＋2；再由氫原子不滅可得b＝2f，又b＝c＋2，則f＝$\frac{c+2}{2}$。最後由氧原子不滅可得：3c＝c＋$\frac{c+2}{2}$，可得c＝$\frac{2}{3}$。通分後可得最簡係數依序為：3、8、2、3、2、4。c＋e＋f＝8。故選(A)。
