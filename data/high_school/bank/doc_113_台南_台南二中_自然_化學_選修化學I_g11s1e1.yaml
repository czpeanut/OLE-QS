- id: doc_113_台南_台南二中_自然_化學_選修化學I_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 氯化亞鐵與硝酸鉀在鹽酸水溶液中之平衡反應式為a $FeCl_{2}$ + b $KNO_{3}$ + c HCl → d $FeCl_{3}$ + e KCl+ f X + g $H_{2}$O，其中a、b、c、d、e、f、g均為相對應的係數，若a＝3，e＝1，則產物X的化學式為下列何者？
  options:
  - label: A
    content: $NH_{4}$Cl
  - label: B
    content: $N_{2}$O
  - label: C
    content: 'NO'
  - label: D
    content: $N_{2}O_{3}$
  - label: E
    content: $NO_{2}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '由選項可得知產物應為氮氧化物或氯化銨，因a＝3，故由Fe原子不滅可得d＝a＝3，又e＝1，可由K原子不滅得知b＝e＝1。 首先討論若X為$NH_{4}$Cl，的可能：則由氧原子不滅可得g＝3，由氮原子不滅可得f＝1，此時c的係數會湊不出來（無法同時滿足氫原子、氯原子不滅）。

    故重新考慮X為氮氧化物，則由氯原子不滅可得c＝4，由清原子不滅可得g＝2。此時方程式左方有1個N、3個O，方程式右方有2個O，故X應為NO。選(C)。'
  tags:
    unit:
      code: CH-S1-1-2
