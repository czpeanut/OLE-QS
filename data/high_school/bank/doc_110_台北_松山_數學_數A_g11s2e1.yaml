- id: doc_110_台北_松山_數學_數A_g11s2e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 設$\vec{a}$、$\vec{b}$、$\vec{c}$是空間中三個不共平面的非零向量，已知$\vec{a}$．（$\vec{b}$×$\vec{c}$）＝10，下列敘述何者正確？
  options:
  - label: A
    content: 由$\vec{a}$、$\vec{b}$、$\vec{c}$所決定的平行六面體體積為 10
  - label: B
    content: $| \vec{b}\times \vec{c} |$＝$| \vec{b} || \vec{c} |$sinθ，其中 θ 為$\vec{b}$與$\vec{c}$的夾角
  - label: C
    content: $(\vec{a}+\vec{c}) \cdot (\vec{c}\times \vec{b})$＝10
  - label: D
    content: $\vec{a} \cdot (\vec{b}\times \vec{c})$＝$-\vec{b} \cdot (\vec{a}\times \vec{c})$
  - label: E
    content: 若$| \vec{a} |$＝2，則$| \vec{b}\times \vec{c} |$的最大值為 5
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：所求為$| \vec{a} \cdot (\vec{b}\times \vec{c}) |$＝10

    (B) ○：由定義可知為真

    (C) ╳：（$\vec{a}+\vec{c}$）．（$\vec{c}\times \vec{b}$）＝$\vec{a}$．（$\vec{c}\times \vec{b}$）＋$\vec{c} \cdot (\vec{c}\times \vec{b})$

    ∵$\vec{c}$⊥$\vec{c}\times \vec{b}$且$\vec{c}\times \vec{b}$＝$-\vec{b}\times \vec{c}$

    ∴（$\vec{a}+\vec{c}$）．（$\vec{c}\times \vec{b}$）＝－$\vec{a}$．（$\vec{b}\times \vec{c}$）＝－10

    (D) ○：$\vec{a}$．（$\vec{b}\times \vec{c}$）＝$\vec{b}$．（$\vec{c}\times \vec{a}$）＝－$\vec{b}$．（$\vec{a}\times \vec{c}$）

    (E) ╳：∵$| \vec{a} \cdot (\vec{b}\times \vec{c}) |$＝$| \vec{a} || \vec{b}\times \vec{c} |$．∣cosθ∣＝10

    ∴$| \vec{b}\times \vec{c} |$．∣cosθ∣＝5

    ∵∣cosθ∣≤ 1

    ∴$| \vec{b}\times \vec{c} | \geq 5$

    應改為最小值為 5

    故選(A)(B)(D)'
- id: doc_110_台北_松山_數學_數A_g11s2e1_s2_3
  section: 2
  number: 3
  type: multiple
  page: 1
  stem: 設空間坐標的原點為 O，P 點坐標為（1，3，5），已知 Q 點在 yz 平面上移動，試問當∠POQ 最小時，Q 點的坐標可能為
  options:
  - label: A
    content: （0，－3，－5）
  - label: B
    content: （0，3，0）
  - label: C
    content: （0，3，5）
  - label: D
    content: （0，6，8）
  - label: E
    content: （0，6，10）
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '令$\vec{OQ}$＝（0，t，s）

    cos（∠POQ）＝$\frac{\vec{OP} \cdot \vec{OQ}}{| \vec{OP} | | \vec{OQ} |}=\frac{3t+5s}{\sqrt{35} \cdot \sqrt{t^{2}+s^{2}}}$

    由柯西不等式，

    （$t^{2}$＋$s^{2}$）（$3^{2}$＋$5^{2}$）≥（3t＋5s）$^{2}$

    ⇒$-\sqrt{34}\leq \frac{3t+5s}{\sqrt{t^{2}+s^{2}}}\leq \sqrt{34}$

    ∵cos（∠POQ）越大，∠POQ 越小

    ∴cos（∠POQ）＝$\frac{\sqrt{34}}{\sqrt{35}}$時，∠POQ 最小

    等號發生在$\frac{t}{3}=\frac{s}{5}$，且$\frac{3t+5s}{\sqrt{t^{2}+s^{2}}}=\sqrt{34}$時

    僅有(C)(E)符合

    故選(C)(E)'
- id: doc_110_台北_松山_數學_數A_g11s2e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 在空間中給定向量$\vec{u}=\left( \frac{\sqrt{2}}{2} , 0 , \frac{\sqrt{2}}{2} \right)$，下列選項何者正確？
  options:
  - label: A
    content: 可找到向量$\vec{v}$＝（t，t，t），t≠0，使得$\vec{u}$．$\vec{v}$＝$| \vec{v} |$
  - label: B
    content: 可找到向量$\vec{v}$使得$\vec{u}$×$\vec{v}$＝（1，－1，1）
  - label: C
    content: 若向量$\vec{v}$滿足$\vec{u}$．$\vec{v}$＝0 且$\vec{u}$×$\vec{v}$＝$\vec{0}$，則$\vec{v}$＝$\vec{0}$
  - label: D
    content: 若非零向量$\vec{v}$滿足$| \vec{u} \cdot \vec{v} |$＝$| \vec{v} |$，則$\vec{u}$×$\vec{v}$＝$\vec{0}$
  - label: E
    content: 若非零向量$\vec{v}$滿足$| \vec{u}\times \vec{v} |$＝$| \vec{v} |$，則$\vec{u}$．$\vec{v}$＝0
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：令$\vec{v}$＝（t，t，t），t≠0

    $\vec{u} \cdot \vec{v}$＝$\frac{\sqrt{2}}{2}t+\frac{\sqrt{2}}{2}t=\sqrt{2}t$

    $| \vec{v} |$＝$\sqrt{t^{2}+t^{2}+t^{2}}=\sqrt{3} | t |$

    ∵$\sqrt{2}t$≠$\sqrt{3} | t |$，t ∈ R，t≠0

    ∴找不到$\vec{v}$使得$\vec{u} \cdot \vec{v}$＝$| \vec{v} |$

    (B) ╳：∵$\vec{u}$必須垂直$\vec{u}\times \vec{v}$

    且$\left( \frac{\sqrt{2}}{2} , 0 , \frac{\sqrt{2}}{2} \right)$．（1，－1，1）＝$\sqrt{2}$≠0

    ∴找不到$\vec{v}$使得$\vec{u}\times \vec{v}$＝（1，－1，1）

    (C) ○：令$\vec{u}$，$\vec{v}$夾角為 θ

    $\begin{cases}| \vec{u} \cdot \vec{v} | = | \vec{u} | | \vec{v} | | \cos \theta | =0 \\ | \vec{u} \times \vec{v} | = | \vec{u} | | \vec{v} | \sin \theta =0\end{cases}$

    ∵∣cosθ∣，sinθ不同為 0 且∣$\vec{u}$∣≠0

    ∴$| \vec{v} |$＝0

    ⇒$\vec{v}$＝$\vec{0}$

    (D) ○：$| \vec{u} \cdot \vec{v} |$＝$| \vec{u} || \vec{v} |$∣cosθ∣＝$| \vec{v} |$

    ∵$| \vec{v} |$≠0，$| \vec{u} |$＝1

    ∴∣cosθ∣＝1 ⇒ θ＝0° 或 180°

    則$| \vec{u}\times \vec{v} |$＝$| \vec{u} || \vec{v} |$sinθ＝0

    ⇒$\vec{u}$×$\vec{v}$＝$\vec{0}$

    (E) ○：$| \vec{u}\times \vec{v} |$＝$| \vec{u} || \vec{v} |$sinθ＝$| \vec{v} |$

    ∵$| \vec{v} |$≠0，$| \vec{u} |$＝1

    ∴sinθ＝1 ⇒θ＝90°

    故$\vec{u} \cdot \vec{v}$＝0

    故選(C)(D)(E)'
- id: doc_110_台北_松山_數學_數A_g11s2e1_s2_5
  section: 2
