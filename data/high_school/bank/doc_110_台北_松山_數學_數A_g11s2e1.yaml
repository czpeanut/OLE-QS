- id: doc_110_台北_松山_數學_數A_g11s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: f（x）＝$\left| \begin{matrix}x-1 & -2 & -3 \\ -1 & x-2 & -3 \\ -1 & -2 & x-3\end{matrix} \right|$，下列選項何者<u>錯誤</u>？
  options:
  - label: A
    content: f（x）為三次多項式
  - label: B
    content: f（x）除以 x－1 的餘式為－5
  - label: C
    content: f（x）可被 $x^{2}$ 整除
  - label: D
    content: f(6)＝0
  - label: E
    content: f(0)＝6
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$\left| \begin{matrix}x-1 & -2 & -3 \\ -1 & x-2 & -3 \\ -1 & -2 & x-3\end{matrix} \right|=\left| \begin{matrix}x-6 & -2 & -3 \\ x-6 & x-2 & -3 \\ x-6 & -2 & x-3\end{matrix} \right|$

    ＝（x－6）$\left| \begin{matrix}1 & -2 & -3 \\ 1 & x-2 & -3 \\ 1 & -2 & x-3\end{matrix} \right|$＝（x－6）$\left| \begin{matrix}1 & -2 & -3 \\ 0 & x & 0 \\ 0 & 0 & x\end{matrix} \right|$

    ＝（x－6）．$x^{2}$＝$x^{3}$－$6x^{2}$

    (A) ○：f（x）＝$x^{3}$－$6x^{2}$ 為三次多項式

    (B) ○：f(1)＝$1^{3}$－6．$1^{2}$＝－5 ⇒ f（x）除以 x－1 的餘式為 －5

    (C) ○：f（x）＝（x－6）．$x^{2}$ 可被 $x^{2}$ 整除

    (D) ○：f(6)＝0

    (E) ╳：f(0)＝0≠6

    故選(E)'
