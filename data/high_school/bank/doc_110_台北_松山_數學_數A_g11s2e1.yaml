  type: multiple
  page: 2
  stem: 設 A（1，0，0），B（4，－4，0），C（－6，1，2），下列敘述何者正確？
  options:
  - label: A
    content: $\vec{AB}$與$\vec{AC}$的夾角為銳角
  - label: B
    content: $\vec{AC}$在$\vec{AB}$上的正射影為（3，－4，0）
  - label: C
    content: 點 C 在直線 AB 上的投影點坐標為（－2，4，0）
  - label: D
    content: 點 C 到直線 AB 的距離為$\sqrt{29}$
  - label: E
    content: 若 O 為原點，則三向量$\vec{OA}$，$\vec{OB}$，$\vec{OC}$所決定的平行六面體體積為$|\left| \begin{matrix}1 & 4 & -6 \\ 0 & -4 & 1 \\ 0 & 0 & 2\end{matrix} \right| |$
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{AB}$＝（3，－4，0），$\vec{AC}$＝（－7，1，2）

    $| \vec{AB} |$＝5，$| \vec{AC} |$＝$\sqrt{54}$

    (A) ╳：cos（∠BAC）＝$\frac{\vec{AB} \cdot \vec{AC}}{| \vec{AB} | | \vec{AC} |}$＝$\frac{-25}{5 \cdot \sqrt{54}}$＝$-\frac{5}{\sqrt{54}}$＜0

    ⇒∠BAC＞90° ⇒$\vec{AB}$與$\vec{AC}$的夾角為鈍角

    (B) ╳：$\vec{AC}$在$\vec{AB}$上正射影

    ＝$\left( \frac{\vec{AC} \cdot \vec{AB}}{| \vec{AB} | ^{2}} \right)\vec{AB}$＝$\frac{-25}{25}$（3，－4，0）＝（－3，4，0）

    (C) ○：C 在直線 AB 上投影點

    ＝A＋$\vec{AC}$在$\vec{AB}$上正射影

    ＝（1，0，0）＋（－3，4，0）＝（－2，4，0）

    (D) ○：所求＝d（（－6，1，2），（－2，4，0））

    ＝$\sqrt{16+9+4}$＝$\sqrt{29}$

    (E) ○：平行六面體體積＝$| \vec{OA} \cdot (\vec{OB}\times \vec{OC}) |$

    ＝$| \left| \begin{matrix}1 & 4 & -6 \\ 0 & -4 & 1 \\ 0 & 0 & 2\end{matrix} \right| |$

    故選(C)(D)(E)'
