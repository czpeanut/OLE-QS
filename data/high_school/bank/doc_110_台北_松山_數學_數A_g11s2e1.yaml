  answer:
  - $\left( \frac{1}{2} , \frac{1}{2} , \frac{1}{6} \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\vec{AP}$＝$\frac{1}{3}\vec{AB}+\frac{2}{3}\vec{AG}$

    ＝$\frac{1}{3}\vec{AB}+\frac{2}{3}(\vec{AB}+\vec{AD}+\vec{AE})$

    ＝$\vec{AB}+\frac{2}{3}\vec{AD}+\frac{2}{3}\vec{AE}$

    又$\vec{AP}$＝α$\vec{AC}$＋β$\vec{AF}$＋γ$\vec{AH}$

    ＝α（$\vec{AB}$＋$\vec{AD}$）＋β（$\vec{AB}$＋$\vec{AE}$）＋γ（$\vec{AD}$＋$\vec{AE}$）

    ＝（α＋β）$\vec{AB}$＋（α＋γ）$\vec{AD}$＋（β＋γ）$\vec{AE}$

    ⇒$\begin{cases}\alpha +\beta =1 \\ \alpha +\gamma =\frac{2}{3} \\ \beta +\gamma =\frac{2}{3}\end{cases}$⇒α＋β＋γ＝$\frac{1+\frac{2}{3}+\frac{2}{3}}{2}=\frac{7}{6}$

    ⇒$\begin{cases}\alpha =\frac{1}{2} \\ \beta =\frac{1}{2} \\ \gamma =\frac{1}{6}\end{cases}$

    故序組（α，β，γ）＝$\left( \frac{1}{2} , \frac{1}{2} , \frac{1}{6} \right)$'
