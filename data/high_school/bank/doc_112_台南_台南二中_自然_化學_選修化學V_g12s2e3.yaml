- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s2_22
  section: 2
  number: 22
  type: multiple
  page: 3
  stem: 有關乙烷、乙烯及乙炔三種有機分子化合物的比較，下列哪些正確？
  options:
  - label: A
    content: 三者皆為不飽和烴
  - label: B
    content: 分子形狀：乙烷為立體結構、乙烯為平面結構、乙炔為直線形
  - label: C
    content: 三者皆為該類化合物中最簡單之分子
  - label: D
    content: 碳－碳鍵的鍵能大小：乙烷<乙烯<乙炔
  - label: E
    content: 一分子所含之H原子數為乙烷>乙烯>乙炔
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)乙烷分子中沒有雙鍵、參鍵，為飽和烴；(B)鍵結軌域：乙烷（$sp^{3}$，立體）、乙烯（$sp^{2}$，平面）、乙炔（sp，直線）；(C)烷類的最簡單分子為甲烷；(D)乙烷（單鍵）＜乙烯（雙鍵）＜乙炔(參鍵)；(E)乙烷(6)＞乙烯(4)＞乙炔(2)。故選(B)(D)(E)。
