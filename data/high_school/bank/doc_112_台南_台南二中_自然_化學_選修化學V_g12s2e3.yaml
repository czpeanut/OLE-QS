  answer_status: verified
  answer_source: answer_key
  explanation: CO、$CO_{2}$、$CS_{2}$、碳酸及其鹽類、氰化物皆非有機物。故選(A)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列9類有機化合物：烷、烯、炔、醇、醛、酮、酯、羧酸、醯胺，其最簡單成員之分子式含有2個碳原子者，共有幾類？
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '5'
  - label: E
    content: '6'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 最簡單分子依序為：甲烷、乙烯、乙炔、甲醇、甲醛、丙酮、甲酸甲酯、甲酸、甲醯胺，共乙烯、乙炔、甲酸甲酯三種。故選(B)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列有關烷烴的敘述，何者正確？
  options:
  - label: A
    content: 比重大於1，在水中會分布於下層
  - label: B
    content: 沸點大致隨著碳數的增加而降低
  - label: C
    content: 不溶於乙醚、苯等有機溶劑
  - label: D
    content: 烷烴不受濃硫酸、強氧化劑、強鹼的作用
  - label: E
    content: 戊烷有正戊烷、異戊烷、新戊烷、環戊烷四種異構物
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)小於1，上層；(B)隨碳數增加而增加；(C)易溶於有機溶劑、難溶於水；(E)分子式（$C_{3}H_{12}$、$C_{5}H_{10}$）不同。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某生用0.1莫耳的甲烷進行氯化反應，得二氯甲烷、氯仿、四氯化碳，其莫耳數分別為0.02、0.03、0.05。試問某生最少用了多少莫耳氯氣？
  options:
  - label: A
    content: '0.16'
  - label: B
    content: '0.25'
  - label: C
    content: '0.33'
  - label: D
    content: '0.47'
  - label: E
    content: '0.58'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: $CH_{4}$＋$Cl_{2}$ → $CH_{3}$Cl＋HCl $CH_{3}$Cl＋$Cl_{2}$ → $CH_{2}Cl_{2}$＋HCl $CH_{2}Cl_{2}$＋$Cl_{2}$ → $CHCl_{3}$＋HCl $CHCl_{3}$＋$Cl_{2}$ → $CCl_{4}$＋HCl 產生0.02 mol二氯甲烷需經兩步鹵化，消耗0.04 mol氯氣；產生0.03 mol三氯甲烷需經三步鹵化，消耗0.09 mol氯氣；產生0.05 mol 四氯化碳需經四步鹵 化，消耗0.2 mol氯氣。共消耗0.33 mol氯氣。故選(C)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
