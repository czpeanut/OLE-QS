- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 苯是一種被廣泛使用的化學物質，它可自然生成或由人工製造出來。吸入苯會造成困倦、暈眩，甚至失去意識。長期暴露會影響骨髓而造成貧血與白血病。關於苯的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 屬於芳香烴
  - label: B
    content: 具有特殊氣味
  - label: C
    content: 每個碳碳鍵長皆相等
  - label: D
    content: 屬於立體分子
  - label: E
    content: 1分子在空氣中燃燒，會產生6分子二氧化碳和3分子水
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)因所有的碳都使用$sp^{2}$混成軌域鍵結，故12個原子都在同個平面上。故選(D)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 某鏈狀烯烴的結構當中只含有一個雙鍵，取1.4克此烯烴與適量的反應，共用去溴4.0克，則此烯烴有幾種可能的結構？（Br＝80）
  options:
  - label: A
    content: '2'
  - label: B
    content: '3'
  - label: C
    content: '4'
  - label: D
    content: '5'
  - label: E
    content: '6'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此鏈狀烯烴只有一個雙鍵，代表其分子式可表示成$C_{n}H_{2n}$，分子量＝14n。則1.4 g的烯烴=$\frac{1.4}{14n}$＝$\frac{1}{10n}$mol，共可與4.0 g的溴＝0.025 mol反應。加成反應進行時，每個雙鍵可與一分子的溴反應，故可得知$\frac{1}{10n}$＝0.025，得n＝4。n＝4的烯烴共有1-丁烯、順-2-丁烯、反-2-丁烯、2-甲基丙烯四種。故選(C)。
