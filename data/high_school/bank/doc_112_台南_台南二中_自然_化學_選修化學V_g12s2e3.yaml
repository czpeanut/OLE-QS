  explanation: 加成反應，須遵守馬可尼可夫法則。故兩個氫原子會加成在同一個碳上，產物為1,1-二氯乙烷。故選(B)。
- id: doc_112_台南_台南二中_自然_化學_選修化學V_g12s2e3_s1_8
