    content: 緯度較低日照強烈
  group_stem: 「為有效利用天然能源，並減少對環境的破壞，莫拉克颱風災後重建的過程中，屏東縣政府以林邊鄉無養殖登記的魚塭，或遭受風災流失埋沒的蓮霧園作為施設點，邀請民間廠商投資推動『養水種電』計畫，並於 2012 年開始陸續運作送電。『養水』主要是希望輔導魚塭業者轉型，不要養魚、不再抽取地下水，以減少地層下陷、土地鹽化等問題。『種電』則是將無法使用的魚塭和蓮霧園土地租給電廠，在水池上架設太陽能板發電，並在太陽能板下設滯洪池，使原先已下陷的土地休養生息，有再生的機會。原來是種蓮霧或經營魚塭的農民，改成種『電』，他們擔任發電區的地主或是光電區的專業管理人，同時也使農地利用符合經濟效益，並達到災區土地轉型使用。」請問：
