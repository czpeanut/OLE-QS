  stem: 民國 105 年臺灣訂定的水資源政策綱領中，水資源利用策略中，包括加強已開發水資源運用效率、多元化經營管理、以供給量訂定需求量等。下列何者是永續治理臺灣水資源及海洋資源較可行的方法？
  options:
  - label: A
    content: 以林地的開發利用取代沿海地區的開發
  - label: B
    content: 都市建設不透水鋪面，加速地表逕流進入河川
  - label: C
    content: 針對地下水補注條件差的地區進行地下水井監測
  - label: D
    content: 鼓勵沿海居民放棄傳統海洋文化及沿海漁業活動
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)永續治理海洋的方式，並非以林地開發取代海洋開發。(B)都市建設應以透水鋪面為主。(D)沿海居民不應放棄傳統的海洋文化。
