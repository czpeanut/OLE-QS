  group_stem: '澎湖受限於自然環境，先天水資源就不足，加上全球氣候變遷影響，降雨更不穩定，使得水資源匱乏問題日益嚴重。早期所設置的水庫，深度淺、容量小，且因集水區的聚落、農業或畜牧活動所產生的汙廢水，大多順流而下進入水庫，造成水質不佳的問題。而為了彌補水庫供水不足的情況，抽取地下水成為重要水源之一，但長年超抽地下水所造成的環境問題，也逐漸浮上檯面。

    為了解決澎湖水資源不足的問題，政府積極推動海水淡化廠的興建，至 2018 年底，澎湖海淡廠供水量約占澎湖地區總供水量的 63 ％，水庫則供應約 20 ％水量，至於地下水之抽水量則大幅減少，藉以減緩超抽地下水所造成的環境衝擊。

    近年澎湖利用獨特的地形景觀和海洋資源積極發展觀光，為確保民生及觀光產業用水無虞，且讓居民的用水品質獲得改善，政府也積極推動「離島地區供水改善計畫第二期」，期望澎湖地區的水資源能達到永續利用與發展。請問：'
  answer:
