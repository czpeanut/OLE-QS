  stem: 近年來世界各地河川水權的爭議與衝突日益升高，如湄公河、尼羅河、印度河、約旦河，造成這 4 條河川水權爭議與衝突的原因，與下列何者關係最密切？
  options:
  - label: A
    content: 皆流經溶蝕地形區，河水下滲問題嚴重
  - label: B
    content: 皆流經乾燥氣候區，河水總逕流量有限
  - label: C
    content: 皆流經水稻農業區，河水不敷灌溉利用
  - label: D
    content: 皆流經多個國家內，河水資源分配不均
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 這 4 條河流皆屬跨境河川，會有上下游水資源分配與汙染的問題。湄公河流經中國、緬甸、寮國、泰國、柬埔寨、越南。尼羅河水資源分配衝突，主要在衣索比亞、蘇丹、埃及。印度河為巴基斯坦與印度的衝突。約旦河為黎巴嫩、敘利亞、約旦、以色列、巴勒斯坦。故選(D)。
