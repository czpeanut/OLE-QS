  - label: B
    content: 無人機偵測
  - label: C
    content: 地理資訊系統
  - label: D
    content: 全球定位系統
  group_stem: '根據英國薩塞克斯大學與丹麥奧胡斯大學團隊在《 Energy Policy 》的研究，他們首先調查歐洲各國的風力發電開發狀況以及相關法規，再透過地理技術，排除掉軍事與住宅等房屋、道路與禁區，以及不適合發展風電的地方，估算出歐洲約有 46 ％土地能裝設風機，發展潛力是過去認為的 3 倍以上，其中土耳其、俄羅斯和挪威潛力最大，風能密度最高，而西歐地區也因為地勢平坦、風速強，是不錯的風場。

    另高壓電網架設的經濟成本、推動跨國超級電網的政治考量，以及陸上風電的間歇性特質，都是極大的潛在風險，好比 2018 年 6 月熱浪席捲歐洲，「風旱」使英國風力發電量連 9 天趨近於零，整個夏季的風力發電狀況都不大理想，雖然裝置量提升 10 ％，但發電量從去年的 12.9 ％下降到 10.9 ％。請問：'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此項地技術需要排除軍事及住宅等房屋、道路與禁區，以及不適合發展風電的地方，進而估算歐洲約有 46 ％的土地能裝設風機，故選(C)地理資訊系統，透過其查詢、環域、疊圖等功能，將不適合的地區排除，進而考量可設置的地點。
