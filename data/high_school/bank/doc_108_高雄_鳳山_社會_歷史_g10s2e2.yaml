  stem: 在《中國通史》書中有一段：「東漢末年，某宗教在民間流行，形成大大小小的教團。這些教團是互助性的組織，經常安定流離失所的人，並給予精神上的關懷。從安帝到靈帝的七十餘年間，在暴政與天災兵禍下，國家的整個疆域內無一地沒有盜賊亂事，因此流民人數大量增加。」顯示天災與暴政對社會所造成的破壞。有關此時空下的敘述，下列何者正確？
