  stem: 請問資料二中認為中國移民旅居海外的原因為何？
  options:
  - label: A
    content: 明清政府獎勵
  - label: B
    content: 家鄉工作機會少
  - label: C
    content: 歐洲殖民國家的招募
  - label: D
    content: 戰亂而被迫離開家鄉
  group_stem: '請先閱讀下列資料後回答問題

    資料一：最常見的移民方式是男性勞力離家外出：如果家中的土地太少，不需要所有男性參與耕種，那麼何不讓他們外出或傭工賺錢，或做點小生意？這樣做並不是拆散家庭，而是透過開發更多資源而維繫家庭。 資料二：絕大多數中國『移民』的意願並非在外國長期定居，而是在國外工作一段時間後就回歸故里……外出務工、寄錢回去養家的策略，無不顯示移民及其家鄉之間存在持續聯繫『勞動力分布系統』……與其說是『離開家鄉』，還不如說是他們正在擴展家庭紐帶的空間維度。'
