  group_stem: '請先閱讀下列資料後回答問題

    資料一：中國史上「行」的名稱，最早出現於□代。《兩京新記》雲：「東都豐都市，東西南北居二坊之地，四面各開江門，邸凡三百一十二區，資貨一百行。」故所謂「行」，是指在都市市場中的各種行業及其組織。□代工商業組織大都稱行，源於街巷上的販賣攤商，往往一條街上開設的都是同類的店鋪……行會的負責人稱為「行老」，對內處理會中種種事宜，對外向官府交涉有關本行的種種權利。 資料二：「中古西歐行會，特指歐洲十一到十九世紀商人團體的歷史專有名詞。行會分為商賈組織與傳統手工業組織，歐洲的行會一開始是某個同行業的商人們，為了統一作業建立的壟斷組織，行會內部會規定行業內操作的規範；然而更重要的是，城市的行會是要兼有政治職能的，行會形成後往往是城市管理機構的一部分，內部有較大的自治權，城市可以通過行會組織市民選舉、徵稅，還有建立武裝。」'
