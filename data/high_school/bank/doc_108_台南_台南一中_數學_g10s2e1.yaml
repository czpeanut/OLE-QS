  stem: 某保險公司推行教育儲蓄專戶，約定嬰兒從出生日期開始每年的生日繳費 2 萬元，共繳費 20 年並以年利率 4 ％複利計算，當該嬰兒長大滿 20 歲後，則可一次領回。請問一個出生就投保的嬰兒，20 年後大約可以領回多少教育儲蓄金？（已知 $1.04^{20}$ ≈ 2.2，選最接近值）
  options:
  - label: A
    content: 62 萬元
  - label: B
    content: 65 萬元
  - label: C
    content: 59 萬元
  - label: D
    content: 68 萬元
  - label: E
    content: 57 萬元
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '可領回的教育儲蓄金為

    2（1＋4 ％）$^{20}$＋2（1＋4 ％）$^{19}$＋……＋2（1＋4 ％）

    ＝2（1.04＋$1.04^{2}$＋……＋$1.04^{20}$）

    ＝$2\times \frac{1.04 (1.04^{20}-1)}{1.04-1}$

    ≈ $2\times \frac{1.04 (2.2-1)}{0.04}$

    ＝62.4（萬元）

    故選(A)'
- id: doc_108_台南_台南一中_數學_g10s2e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 下列哪些數列〈 $a_{n}$ 〉為等差數列？
  options:
  - label: A
    content: $a_{n}=(n+1) - \left( \frac{1}{2}n+2 \right) + \left( \frac{1}{3}n+3 \right) - \left( \frac{1}{4}n+4 \right)$
  - label: B
    content: $b_{n}$＝2n＋1，$c_{n}$＝3n－2，$a_{n}$＝$b_{n}$×$c_{n}$
  - label: C
    content: $S_{n}$＝$a_{1}$＋$a_{2}$＋……＋$a_{n}$＝$2n^{2}$－3n
  - label: D
    content: $b_{n}$＝3n＋1，$a_{n}=2^{b_{n}}$
  - label: E
    content: $b_{n}=7\times 4^{n-1}$，$c_{n}=11\times 3^{n-1}$，$a_{n}$＝log（$b_{n}$×$c_{n}$）
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$a_{n}=\frac{7}{12}n-2$，表示公差為$\frac{7}{12}$的等差數列

    (B) ╳：$a_{n}$＝$b_{n}$×$c_{n}$＝（2n＋1）（3n－2）＝$6n^{2}$－n－2

    $a_{n＋1}$－$a_{n}$＝〔6（n＋1）$^{2}$－（n＋1）－2〕－（$6n^{2}$－n－2）

    ＝12n＋5，非定值

    (C) ○：$a_{n}$＝$S_{n}$－$S_{n－1}$＝（$2n^{2}$－3n）－〔2（n－1）$^{2}$－3（n－1）〕＝4n－5

    表示公差為 4 的等差數列

    (D) ╳：$a_{n}$＝$2^{b_{n}}$＝$2^{3n+1}$＝2×$2^{3n}$＝2×$8^{n}$ 為等比數列

    (E) ○：$a_{n}=\log (7\times 4^{n-1}\times 11\times 3^{n-1})=\log (77\times 12^{n-1})$

    ⇒ $10^{a_{n}}=10^{\log (77\times 12^{n-1})}=77\times 12^{n-1}$

    $\frac{10^{a_{n}}}{10^{a_{n-1}}}=\frac{77\times 12^{n-1}}{77\times 12^{n-2}}=12$ ⇒ $10^{a_{n}-a_{n-1}}=12=10^{\log 12}$

    ∴$a_{n}-a_{n-1}=\log 12$，表示公差為 log12 的等差數列

    故選(A)(C)(E)'
