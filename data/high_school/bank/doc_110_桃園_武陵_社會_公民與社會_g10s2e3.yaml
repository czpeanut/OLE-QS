  group_stem: ◎司法院大法官於109年5月以釋字第791號「通姦罪及撤回告訴之效力案」，宣告我國《刑法》第239條規定違憲，故應自本解釋公布之日起失其效力。<u>國家以刑罰制裁之違法行為，原則上應以侵害公益、具有反社會性之行為為限，而不應將損及個人感情且主要係私人間權利義務爭議之行為亦一概納入刑罰制裁範圍。國家以刑罰制裁手段處罰違反婚姻承諾之通姦配偶，雖不無「懲罰」違反婚姻忠誠義務配偶之作用，然因國家權力介入婚姻關係，反而可能會對婚姻關係產生負面影響</u>。是本條之限制所致之損害顯然大於其目的所欲維護之利益，而有失均衡。本條對《憲法》第22條所保障性自主權之限制，與《憲法》比例原則不符，應自本解釋公布之日起失其效力。至於《刑事訴訟法》第239條但書有關對通姦人撤回告訴，其效力不及於相姦人之規定，則違反《憲法》保障平等權之意旨而違憲，兩規定均自即日起失其效力。
