  stem: 日前員警某甲在追緝竊嫌時，因竊嫌將車開上人行道往市集開去，某甲為避免造成民眾傷亡，在持槍喝斥未果後，遂向車輛左輪開槍兩次。不料其中一發子彈擊中竊嫌腹部，導致竊嫌死亡。檢方勘驗後以過失致死罪起訴某甲。法院在審理後，認為某甲使用槍枝<u>(甲)符合《警械使用條例》的用槍時機</u>，且係<u>(乙)為了避免造成更大的民眾傷亡。此外，車輛行進間使用槍枝，乃一瞬間之事</u>，<u>(丙)彈道的偏向亦是因車輛材質所導致</u>，<u>(丁)客觀上並無違反注意義務，主觀上也已盡其注意之能事</u>，故宣判無罪。根據上文劃線處，下列分析何者最正確？
  options:
  - label: A
    content: (甲)：員警開槍符合行使業務上正當行為的阻卻違法事由，不具違法性
  - label: B
    content: (乙)：員警開槍與避免傷亡間雖具因果關係，但開槍行為仍涉及刑事責任，須處以刑罰
  - label: C
    content: (丙)：員警開槍後彈道偏向致竊嫌死亡，難歸責於員警，因其行為不具責任能力
  - label: D
    content: (丁)：員警開槍並無致竊嫌死亡之故意，亦非過失，不符犯罪構成要件
