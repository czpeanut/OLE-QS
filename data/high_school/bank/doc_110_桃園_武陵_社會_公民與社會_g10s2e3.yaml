- id: doc_110_桃園_武陵_社會_公民與社會_g10s2e3_s1_33
  section: 1
  number: 33
  type: single
  page: 5
  stem: 依據上文資料，請判斷下列敘述何者正確？
  options:
  - label: A
    content: 《勞動事件法》主要在補充《工會法》之相關規定
  - label: B
    content: 《勞動事件法》規範了關於管轄法院及工資工時之規範
  - label: C
    content: 通過該法之後，發生勞資爭議時較能確保勞動人權之保障
  - label: D
    content: 設置勞動專業法庭後，同時配合取消勞工罷工的相關權利
  group_stem: '◎為提供更加公平的訴訟環境，我國立法院於2018年11月9日三讀通過《勞動事件法》。未來若碰到勞資糾紛，可以用更加專業、平等的方式進行司法訴訟。新法將於一年之後施行上路。

    新法明定，各級法院均應設置勞動專業法庭，而在法院管轄權部分，勞工有充分選擇權，可選擇勞務提供地，或公司所在地，乃至於任何分公司所在地都可以。若勞工是原告，其裁判費可申請減免，大幅降低勞工負擔。另也規定，調解組成除由勞資雙方組成之外，在舉證責任中，資方就相關文書資料負舉證責任。

    台灣的勞動參與率相較歐美及東亞國家相比，女性二度就業比例較低，除需負擔家務勞動之因素，勞動法規之建置亦尚未完善。以往弱勢勞工在處理勞資爭議時，除依《勞資爭議處理法》向地方勞工主管機關申請調解外，往往因曠日廢時及訴訟障礙而望司法大門興嘆。如今《勞動事件法》通過是勞動司法人權的突破，對於勞工未來在處理勞資爭議時，更有機會接近司法正義。'
  tags:
    unit:
      code: CI-2-6-2
      book: 公民與社會2 正義與法治
      chapter: 生活中的勞動參與
      title: 勞動法規
      std: true
