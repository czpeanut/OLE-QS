  stem: 葡萄牙曾是「歐洲毒蟲之都」，在2001年通過毒品「除罪化」，將過去處罰的費用，轉移至醫療照護。政府鼓勵吸毒者尋求治療，並提供吸毒者就業機會，且任何雇用吸毒者的企業，都可享稅務優惠。毒癮從犯罪行為變成公共衛生議題，不僅大幅減輕政府財政負擔，且根據歐盟監測中心，葡萄牙毒癮比例明顯下降。請問以下敘述何者最貼近上文的要旨？
