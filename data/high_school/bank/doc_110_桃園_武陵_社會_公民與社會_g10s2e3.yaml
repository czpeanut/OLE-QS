  section: 1
  number: 13
  type: single
  page: 2
  stem: 某命案被告日前即將羈押期滿，地方法院開庭審理是否續押。被告在庭上表示「不想要被羈押」，律師也強調，他沒有逃亡串證之虞，合議庭將擇日再做出裁定。請問關於上述羈押程序之敘述，何者正確？
  options:
  - label: A
    content: 若被告有逃亡串證之虞，檢察官可逕行羈押
  - label: B
