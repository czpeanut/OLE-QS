  stem: 在我國刑事法規中，若以告訴權人提起告訴為追訴條件的罪名，稱為「告訴乃論」之罪。反之，不以告訴為追訴條件的罪名，則為「非告訴乃論」之罪。下列有關國家追訴犯罪的流程，那些有誤？
  options:
  - label: A
    content: 殺人罪為公訴罪，檢警得知必須立刻展開偵查程序
  - label: B
    content: 第三人向檢警提出告訴時，檢察官即可依據證據起訴
  - label: C
    content: 凡在《刑法》規定中屬告訴乃論之罪者，檢察官即不可提起公訴
  - label: D
    content: 因情節輕微認不起訴為適當者，檢察官得為不起訴
  - label: E
    content: 判決確定後，依據刑法規定由檢察官指揮執行判決
