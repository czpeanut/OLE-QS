  section: 1
  number: 31
  type: single
  page: 4
  stem: 關於《少年事件處理法》修法刪除第85-1條之目的，下列理解何者正確？ (甲)此次修法目的乃因相對於青少年之特殊性，7歲以上未滿12歲犯罪之人不再移送少年法庭； (乙)考量7歲以上未滿12歲之人與12歲以上未滿18歲之少年截然不同，須另以行政方式處理； (丙)7歲以上未滿12歲之人犯罪交付少年法庭處理，採從輕處分； (丁)依特別法優於普通法，7歲以上未滿12歲之人的犯罪，應先適用《少年事件處理法》。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 甲丁
  group_stem: '◎《少年事件處理法》為《刑法》及《刑事訴訟法》之特別法，立法院三讀通過《少年事件處理法》修正案，此重大變革除部分條文外，皆在2020年6月19日正式施行。本次修法刪除第85-1條，針對12歲以下兒童觸犯《刑法》全面除罪化，不再進入司法程序，改由教育、社政、警政等行政機關，依《兒童及少年福利與權益保障法》、《學生輔導法》接手處理，而兒童的前科紀錄也都會一併塗銷。

    《少年事件處理法》修正後對少年有更多的保護，且警察機關一旦獲報兒童出現偏差行為，必須先通知校方及家長處理，校方認為情節過重，可以轉報社政單位協助。如果兒童的原生家庭失去功能，或監護人被認定無法負起教育責任，也可通報所屬縣市政府，由社政單位進行緊急安置，超過96小時則報請家事法庭裁定安置。'
