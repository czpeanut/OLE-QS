  stem: 過去我國《毒品危害條例》以及相關刑事判例認定：「販賣毒品既遂罪，只要以營利為目的，而有購人之行為，即足該當。」對此，大法官釋字第792號「販賣毒品既遂罪」宣告其違憲。大法官在理由書中提及：「販賣毒品既遂罪」構成要件中所稱之「販賣」一詞，根據各辭典所載，或解釋為出售物品，或解釋為購入物品再轉售，無論何者，所謂販賣的核心意義均在出售，均非單指購入物品的行為，大法官認為，「販賣毒品既遂」應指銷售賣出行為已完成者而言，不應包含單纯「購入」毒品的情形。請問上述規定被宣告違憲的主要理由，應為下列何者？
