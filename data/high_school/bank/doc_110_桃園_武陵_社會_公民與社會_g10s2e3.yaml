  stem: 小葉與小李是碩士班的同學，兩人畢業時正值全國景氣低迷。在將近半年的求職生活後，小葉決定先暫時於速食店打零工，待景氣回升後再另覓出路;小李則對求職心灰意冷，決定回老家蝸居一陣子調養身心，暫時不再為尋找工作而操勞。在其他條件不變的情況下，關於兩人的決定將如何影響我國的勞參率與失業率？
