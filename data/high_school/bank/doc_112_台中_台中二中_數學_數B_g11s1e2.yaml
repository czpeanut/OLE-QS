    content: 26 ％
  - label: B
    content: 30 ％
  - label: C
    content: 38 ％
  - label: D
    content: 48 ％
  - label: E
    content: 60 ％
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '$\log \left( 1+\frac{1}{2} \right)$＋$\log \left( 1+\frac{1}{3} \right)$＋$\log \left( 1+\frac{1}{4} \right)$＋$\log \left( 1+\frac{1}{5} \right)$

    ＝$\log \frac{3}{2}$＋$\log \frac{4}{3}$＋$\log \frac{5}{4}$＋$\log \frac{6}{5}$

    ＝$\log \left( \frac{3}{2}\times \frac{4}{3}\times \frac{5}{4}\times \frac{6}{5} \right)$＝$\log \frac{6}{2}$＝log3

    $\approx$0.4771＝47.71 ％$\approx$48 ％

