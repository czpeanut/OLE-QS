  stem: 班佛法則：銀行存款首位數字為 a 的比例約有$\log \left( 1+\frac{1}{a} \right)$，例如存款金額為 43210 元的首位數字為 4，所有首位數字為 4 的存款所占比例約$\log \left( 1+\frac{1}{4} \right)$，請根據班佛法則，估計銀行存款的首位數字為 2 或 3 或 4 或 5 的人約占比例的多少？（log2$\approx$0.3010，log3$\approx$0.4771）
  options:
