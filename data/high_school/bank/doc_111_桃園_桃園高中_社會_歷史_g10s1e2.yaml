  stem: 資料一：「唐景崧將重兵集中在臺北附近（基隆、淡水一帶）及澎湖。有鑑於牡丹社事件時日本由南部的瑯嶠登陸，因此命劉永福分兵駐防恆春、東港一帶。另為了防範日軍自南崁登陸，由背面進攻臺北，又以丘逢甲的義軍及林朝棟的棟軍駐守南崁、新竹一帶。整個臺灣呈現劃地分防的狀態，很容易造成各使意氣、不相支援的後果。」 資料二：「民主國的兵力雖有約十萬人，但組成分子參差不齊，來自湖南、安徽、福建、廣東各地，各個自稱統領，前線指揮系統難以確立。此外，兵員多是臨時招募，缺乏訓練，很難服從軍令，其中還有不少是海盜、土匪。而士兵入伍的目的也不是要抵抗日軍，他們只關心能否拿到報酬。這些各省兵勇彼此衝突，也與臺灣當地土勇不合。」 請問上述兩則資料認為臺灣民主國失敗的主因為何？
