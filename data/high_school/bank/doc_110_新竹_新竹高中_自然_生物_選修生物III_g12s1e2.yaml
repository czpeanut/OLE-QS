  stem: 電腦圍棋曾以三連勝擊敗世界圍棋排名第一的棋手，在人工智慧的演算法上是一項重要的里程碑。電腦圍棋以摹仿生物體神經系統的人工神經網路（Arificial Neural Network, ANN）為主要結構，ANN常常應用於機器學習和認知科學領域。ANN設定其基本元件等同於生物神經元，以摹仿生物神經系統的結構和功能。此元件之示意圖如附圖，其中$X_{1}$〜$X_{n}$為輸入向量之分量：$W_{1}$～$W_{n}$為輸入Y之權值，M為人工神經元之輸出，Z為動作。下列有關此基本元件與生物神經元之類比敘述，哪些正確？（應選2項）
  options:
  - label: A
    content: $X_{1}$～$X_{n}$相當於Y的軸突輸入量
  - label: B
    content: $W_{1}$〜$W_{n}$訊息傳至Y相當於生物神經元間的突觸傳遞
  - label: C
    content: Y相當於生物神經元之細胞本體
  - label: D
    content: M如同樹之主幹，相當於神經細胞之樹突
  - label: E
    content: Z相當於神經系統的受器
