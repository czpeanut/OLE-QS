  stem: □□曾是社會黨員，因積極鼓吹自己國家參戰而被社會黨開除黨籍。之後他創辦報紙，鼓吹法西斯主義。1919 年成立「法西斯戰鬥團」，以激烈的手段對付社會主義運動。1921 年成立國家法西斯黨，曾迫使政府停止了社會黨的罷工行動。請問□□是指誰？
  options:
  - label: A
    content: 希特勒
  - label: B
    content: 史達林
  - label: C
    content: 墨索里尼
  - label: D
    content: 羅斯福
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為義大利(C)墨索里尼取得政權前的生活經歷。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 1870 年以來，歐洲列強在非洲的殖民競爭趨於激烈，常逕自宣告「勢力範圍」，造成列強間的緊張。1884 ～ 1885 年，德國首相俾斯麥召開「柏林會議」，以解決非洲殖民亂象，十四國與會。這個會議確立「有效占領」的原則，規定：「任何國家必須與土著統治者締有條約，在當地插上國旗，並建立行政管理機制，始可聲稱擁有該地的主權。」這個原則為非洲帶來什麼結果？
  options:
  - label: A
    content: 列強之行動受到約束，延緩非洲的瓜分
  - label: B
    content: 列強積極占領之行動，加速非洲的瓜分
  - label: C
    content: 列強形成均勢局面，非洲免除瓜分危機
  - label: D
    content: 列強顧慮占領成本，大都放棄瓜分企圖
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 柏林西非會議的召開，目的在調解各國在非洲的競爭衝突，因此在會議中議決列強在非洲的「有效占領」行為準則，促使會後加快各國侵略非洲的速度，答案為(B)。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 當時各國面對這場世界性危機，紛紛以不同方式因應，有的國家以馬車代替汽車作為交通工具，有的國家則鼓勵共乘，在街道旁立了不少「POOLIT」的標誌。請問這應是哪一時期的景象？
  options:
  - label: A
    content: 1940 年代
  - label: B
    content: 1950 年代
  - label: C
    content: 1960 年代
  - label: D
    content: 1970 年代
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「以馬車代替汽車作為交通工具」一句，推測此次世界性危機應與燃油有關，而非一般的經濟危機，因此最可能為(D) 1970 年代的石油危機期間。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 「五百年殖民主義」說明了拉丁美洲曾經受到歐洲國家的殖民，關於以上的敘述何者正確？
  options:
  - label: A
    content: 殖民者逃避宗教戰爭迫害而來，尊重原住民的傳統信仰
  - label: B
    content: 基督教殖民者讚嘆馬雅文明，保護馬雅文物
  - label: C
    content: 殖民者帶進疾病，造成原住民大量死亡
  - label: D
    content: 殖民者引進歐洲的新技術造福原住民
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)為正解。(A)(B)摧毀原住民的宗教信仰與文化，強行傳入基督宗教信仰。(D)雖然引進歐洲的新技術，但只是加深對原住民的剝削，並非造福。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 有一份近代運動領袖的宣言：「我們的行動綱領是：一、揚棄《凡爾賽和約》。二、團結全國人民。三、開發國土，發展農業。」下列哪一個敘述與這位領袖有關？
  options:
  - label: A
    content: 他策動共產革命，建立世界上第一個共產國家
  - label: B
    content: 實施「五年計畫」將國家建設成工業強國
  - label: C
    content: 將國家的體制由君主立憲轉變為一黨專制
  - label: D
    content: 以選舉方式獲得政權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「揚棄《凡爾賽和約》」一句，可推知這位領袖為德國的希特勒，(D)為正解。(A)列寧。(B)史達林。(C)墨索里尼。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 許多國家可能基於某些理由查禁流行歌曲。以臺灣為例，1930 年代開始流行以福佬系民謠為創作題材，當時西門町與大稻埕有許多收費不低的音樂廳，傳唱這些歌謠。但部分歌謠後來遭政府以過於寫實、動搖民心為由，予以查禁。1950 年代左右，行政院依據《戒嚴法》訂定《臺灣省戒嚴期間新聞雜誌圖書管理辦法》，開始管制流行文化，主要由警備總司令部執行歌曲查禁。如披頭四樂團演唱之〈革命〉便因「內容欠妥，混淆視聽，危害社會治安」遭禁。至 1970 年代，查禁業務改由新聞局負責，據統計，當時約有六分之一的歌曲因未通過審查而禁唱。到了 1980 年代，絕大多數歌曲都通過審查，禁唱歌曲大幅減少。面對審查制度，音樂人仍勇於透過流行樂曲批判現狀。曾有外國歌手唱道：「這是最好的年代，所以人民不需要自由」而遭到禁播。有樂評指出，該歌詞字面上說政府讓經濟成長率翻升，表示統治萬能，所以人民也就不需要自由，但實際是諷刺該政府，試圖以經濟成果遮掩其威權統治事實。像這類具批判性的樂曲，多非屬主流文化，常被忽視；但也有作品廣受歡迎，甚至在特定時期帶動反叛精神。請問某一時期，出現以流行音樂表達對現狀的不滿，甚至帶動一個充滿反抗、叛逆、迷惘的時代精神，促使社會上形成一股改變的風潮。下列何者最符合此種情形？
  options:
  - label: A
    content: 1910 年代，運用民間歌謠批判通俗文化
  - label: B
    content: 1940 年代，以臺語歌謠抗議太平洋戰爭
  - label: C
    content: 1960 年代，以搖滾樂曲推動反越戰運動
  - label: D
    content: 1990 年代，運用國語歌曲表達反共立場
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 在 20 世紀的西方歷史上，充滿反抗、叛逆、迷惘的時代為 1960 年代，當時的戰後嬰兒潮世代勇於衝撞主流文化，為西方世界社會帶來激情與叛逆的氣質，(C)為正解。(A)與史實不符。(B)皇民化時期，許多臺語歌謠已被改編為日語。(D) 1990 年代已解嚴，兩岸交流下少有反共歌曲。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 資料：「一些西方發達的國家，如英國、法國等，先後爆發了以激進大學生和社會青年為主體的『新左派』運動。例如法國校園裡的學生們紛紛出售或贈送自己的小冊子和報紙，散發傳單，爭相發表自己對改革教育、改革社會的意見、立場、觀點與目的；譴責資本主義社會，討論其代替辦法。校園裡飄揚著紅黑兩色旗幟，牆上掛著毛澤東、切．格瓦拉、胡志明、托洛斯基等人的畫像，貼滿了表明新左派行動綱領的標語。」請問上述內容最可能出現於何時？
  options:
  - label: A
    content: 20 世紀初期
  - label: B
    content: 戰間期
  - label: C
    content: 20 世紀中葉
  - label: D
    content: 冷戰結束後
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料所述為 1960 年代法國巴黎學運的情景，答案為(C)。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 1961 年 8 月 13 日黎明前數小時，一隊坦克穿過某個歐洲城市。日出時，軍隊已經拉起一道帶鉤鐵絲網，將共產主義和資本主義分隔開來。很快的，水泥牆和電網取代鐵絲網。這個城市是
  options:
  - label: A
    content: 柏林
  - label: B
    content: 布達佩斯
  - label: C
    content: 華沙
  - label: D
    content: 布拉格
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為「柏林圍牆」開始形成的情景，從此將(A)柏林區隔成兩個截然不同的世界，該圍牆也成為冷戰時期的重要標誌及鐵幕的具體象徵。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 一位南非黑人主教曾說過：「白人傳教士剛到非洲時，他們手裡有『聖經』，我們手裡有土地。傳教士說：『讓我們祈禱吧』，於是我們閉目祈禱，當我們睜眼時，發現我們手裡有了『聖經』，但他們手裡有了土地。」根據上述的言論，我們可以推論
  options:
  - label: A
    content: 傳教士改變了當地的宗教思維
  - label: B
    content: 傳教活動通常伴隨著殖民掠奪
  - label: C
    content: 非洲人已經喪失傳統文化色彩
  - label: D
    content: 非洲人出現土地所有權的觀念
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文的敘述可得知，傳教士往往成為殖民者的先鋒，最適合的答案為(B)。(A)題文中無法判斷宗教思維是否被改變。(C)題文中並未提到傳統文化。(D)傳教士初來時，非洲人即已有土地所有權觀念。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 冷戰期間，美國與蘇聯雙方在歐洲的對峙是以一種怎樣的形式出現？
  options:
  - label: A
    content: 政治對峙：同盟國 vs. 軸心國
  - label: B
    content: 經濟對峙：歐洲共同市場 vs. 東歐經濟聯盟
  - label: C
    content: 文化對峙：東正教文明 vs. 基督教文明
  - label: D
    content: 軍事對峙：北大西洋公約組織 vs. 華沙公約組織
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)二次大戰中，交戰雙方的陣營。(B)美國並未加入歐洲共同市場。(C)兩者宗教文化正好相反。正確答案為(D)。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 歷史解釋往往會受到時代氛圍的影響。1950 年代，美國歷史家主張：北美殖民地在獨立之前已經是一個具有強烈共識的團結社會，而這個共識就是自由與平等。這種史觀的提出與當時美國哪種社會氣氛有關？
  options:
  - label: A
    content: 東西冷戰方盛，防範共產主義
  - label: B
    content: 民權運動興起，要求族群平權
  - label: C
    content: 恐怖主義威脅，訴求社會團結
  - label: D
    content: 多元文化流行，強調個性自主
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 1950 年代正值冷戰高峰階段，美國盛行麥卡錫主義，以反共意識為思想主流。(B) 1960 年代。(C) 2000 年代。(D) 1960 年代。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 19 世紀時，一位美國總統的施政報告中指出：「今後任何歐洲列強不得把美洲大陸業已獨立自由的國家，當作未來殖民的對象。……我們認為歐洲列強想把他們的政治制度擴展到西半球任何地區的企圖，對我們的和平與安全都是有危害的。……我們從未干涉過任何歐洲列強現有殖民地和保護國，將來也不會干涉。」對於這段報告，我們應有的正確理解是
  options:
  - label: A
    content: 此報告係針對拿破崙的擴張提出警告
  - label: B
    content: 美國希望藉此報告擺脫英國的影響
  - label: C
    content: 此一報告的確有助於當時中南美洲獨立運動的進行
  - label: D
    content: 日後美國的確能遵守不干涉歐洲國家屬地的原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從施政報告中，美國反對歐洲列強將勢力伸進美洲地區，可判斷此為 1820 年代的門羅主義，答案為(C)。(A)針對梅特涅欲出兵中南美洲干預獨立運動。(B)美國與英國同一陣線。(D)兩次世界大戰，美國均有介入干涉。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: '請閱讀以下兩則資料：

    資料一：奧匈帝國斐迪南大公的死，引起了奧匈帝國與塞爾維亞激烈的爭議，奧匈帝國一直尋找向塞爾維亞開戰的藉口，他們藉此指控塞爾維亞謀殺，並積極準備要進行攻擊。

    資料二：1888 年即位的新德皇威廉二世，他讓俾斯麥於 1890 年退休，威廉二世想要以更積極的態度去面對世界。他結束俾斯麥苦心經營的德俄友好關係，積極充實戰備，他的態度導致其他國家開始將德國視為威脅。

    請問如何正確理解上述兩段資料與第一次世界大戰的關係？'
  options:
  - label: A
    content: 資料一是政治因素，資料二是經濟因素
  - label: B
    content: 資料一是宗教因素，資料二是外交因素
  - label: C
    content: 資料一是近因，資料二是遠因
  - label: D
    content: 資料一是遠因，資料二是近因
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)資料一是外交因素，資料二是政治因素。(D)資料一是近因，資料二是遠因，故(C)為正解。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 反殖民運動是指一個地方因外國殖民統治，造成政治與經濟上的不平等關係，轉而進行獨立及自治的過程。1945 ～ 1960 年，反殖民運動蓬勃發展，部分地方的反殖民運動是以和平手段進行，但亦有不少地方是以暴力形式推行。有關反殖民運動的敘述，以下何者正確？
  options:
  - label: A
    content: 中南美洲地區的反殖民運動即在此階段展開自治
  - label: B
    content: 盧安達因石油藏量豐富，經多年對抗才成功擺脫法國獨立
  - label: C
    content: 孟加拉共和國透過和平談判方式向英國爭取獨立
  - label: D
    content: 獨立後的國家多數為第三世界的國家，在冷戰中響應不結盟運動
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 1830 年已獨立。(B)盧安達原為德國殖民地，二次大戰後由聯合國交給比利時託管，1962 年在公投後獨立。(C)孟加拉原為東巴基斯坦，1972 年脫離巴基斯坦而獨立。(D)為正解。
- id: doc_112_基隆_基隆高中_社會_歷史_g11s1e3_s1_15
