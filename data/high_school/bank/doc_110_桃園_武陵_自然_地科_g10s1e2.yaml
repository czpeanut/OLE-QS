  type: single
  page: 5
  stem: 十九世紀中期，<u>荷蘭</u>氣象學家<u>白貝羅</u>發現：在北半球，若背對風的來向，則高壓在其右邊，低壓在左邊，這就是有名的白貝羅定律（Buys Ballot’s law）。但後來發現，這個經驗定律比較適合應用在航空或航海上，而不太適合在陸地上使用。其最主要的原因為何？
  options:
  - label: A
    content: 因為海上或空中的氣象測站較少，使用經驗定律比較方便
  - label: B
    content: 因為海上及空中的摩擦力較小，風向比較不會偏轉
  - label: C
    content: 因為陸地上的氣壓梯度力比較小，風速比較快
  - label: D
    content: 因為陸上氣象資訊更新較快，不必使用經驗定律
  - label: E
    content: 因為航運比陸運更需要氣象資訊
  answer:
  - B
