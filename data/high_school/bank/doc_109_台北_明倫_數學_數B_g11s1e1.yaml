  section: 3
  number: 2
  type: calc
  page: 2
  stem: '一項<u>美國</u> <u>加州柏克萊</u>大學的計畫：SETI 是「Search for Extra Terrestrial Intelligence」的縮寫，也就是搜尋地外文明的計畫。這是利用全世界參加者的電腦來參與處理來自外太空的訊息，來進行資料分析。假設某一天收到非自然產生的電波訊號，經過分析後，可轉譯得到一串數字訊息。其中某段訊息如下：0.67，1，2，2，3.33，1，4，0，4.67，－1，6，－2，7.33，－1，8，0，8.67，1，10，2 ……。

    若<u>賈聰明</u>將前後兩個數字視為一個點坐標，例如：（0.67，1），（2，2），（3.33，1）……將這些點描繪至方格紙中並將這些點連接成右方的圖形（圖形的格線距離是一單位）。

    <u>賈聰明</u>猜測這些點是正弦函數 y＝a sin bx＋k 圖形上的點，且 a＞0，b＞0，k 為常數。

    (1) 試求此正弦函數 y＝a sin bx＋k 的週期＝？振幅＝？b＝？（6 分）

    (2) 若依<u>賈聰明</u>的結果，即這些點是正弦函數 y＝a sin bx＋k 圖形上的點。當接收到一個無線電波轉譯成數字為 81，則下一個無線電波轉譯的數字為何？（3 分）'
