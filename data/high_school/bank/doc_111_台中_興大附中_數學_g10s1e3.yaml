  type: single
  page: 1
  stem: 坐標平面上，拋物線 y＝$20x^{2}$－24x＋7 上一點 P，其 x 坐標為 log 5。下列哪個選項是正確的？
  options:
  - label: A
    content: 點 P 在第一象限
  - label: B
    content: 點 P 在第二象限
  - label: C
    content: 點 P 在第三象限
  - label: D
    content: 點 P 在第四象限
  - label: E
    content: 點 P 在 x 軸上
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$20x^{2}$－24x＋7＝（2x－1）（10x－7）

    ∵5＝$\frac{10}{2}$＝$\frac{10}{10^{\log 2}}$＝$10^{1-\log 2}$≈$10^{1-0.3010}$＝$10^{0.6990}$

    ∴log 5 ≈ log $10^{0.6990}$＝0.6990

    則 2 log 5－1＞0，10 log 5－7＜0

    ⇒（2 log5－1）（10 log5－7）＜0

    得點 P 在第四象限，故選(D)'
- id: doc_111_台中_興大附中_數學_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: Bao 及 Derek 輪流在坐標平面上畫圖，當 Bao 在某些範圍將圖形畫在 x 軸下方時，則 Derek 在這些範圍必不能將圖形畫在 x 軸下方。此時，Bao 畫的圖形為 y＝$x^{2}$－x－6，Derek 畫的圖形為 y＝－$x^{2}$－kx＋10，試問有多少個整數 k 能滿足上述的限制？
  options:
  - label: A
    content: 0 個
  - label: B
    content: 1 個
  - label: C
    content: 2 個
  - label: D
    content: 3 個
  - label: E
    content: 4 個
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'y＝$x^{2}$－x－6＝（x－3）（x＋2）

    可知 Bao 將圖形畫在 x 軸下方的範圍為－2＜x＜3

    ∵y＝－$x^{2}$－kx＋10 開口向下

    又由題意可知在 x＝－2 和 x＝3 之值需為正或 0

    ∴$\begin{cases}-4+2k+10\geq 0 \\ -9-3k+10\geq 0\end{cases}$⇒$\begin{cases}k\geq -3 \\ k\leq \frac{1}{3}\end{cases}$

    ⇒－3 ≤ k ≤$\frac{1}{3}$

    共有－3，－2，－1，0 四個整數

    故選(E)'
- id: doc_111_台中_興大附中_數學_g10s1e3_s2_1
