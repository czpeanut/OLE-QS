  stem: 設二次函數 f（x）＝$ax^{2}$＋bx＋c 的圖形如右圖，則下列哪些選項的值必為正數？
  options:
  - label: A
    content: b
  - label: B
    content: a＋b＋c
  - label: C
    content: 4a＋b
  - label: D
    content: $b^{2}$－4ac
  - label: E
    content: 2a＋b
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_111_台中_興大附中_數學_g10s1e3/s2_1_f1.png
    crop:
      page: 1
      rect:
      - 446.45
      - 492.6
      - 564.3
      - 583.4
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '∵開口向上 ∴a＞0

    又函數 f（x）的圖形過$\left( -\frac{1}{2} , 0 \right)$，$\left( \frac{5}{2} , 0 \right)$兩點

    ⇒ f（x）＝$a\left( x+\frac{1}{2} \right) \left( x-\frac{5}{2} \right)$＝$ax^{2}$－2ax－$\frac{5}{4}a$

    ⇒ b＝－2a，c＝－$\frac{5}{4}a$

    (A) ╳：b＝－2a＜0

    (B) ╳：a＋b＋c＝$-\frac{9}{4}a$＜0

    (C) ○：4a＋b＝2a＞0

    (D) ○：$b^{2}$－4ac＝（－2a）$^{2}$－4a$\left( -\frac{5}{4}a \right)$＝$9a^{2}$＞0

    (E) ╳：2a＋b＝0

    故選(C)(D)'
- id: doc_111_台中_興大附中_數學_g10s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 已知一次函數 f（x）＝mx＋m，二次函數 g（x）＝－$x^{2}$－2x－2、h（x）＝$x^{2}$－2x＋1，若函數圖形 f（x）恆在 g（x）的上方且 f（x）恆在 h（x）的下方，則下列哪些選項中的 m 滿足以上條件？
  options:
  - label: A
    content: m＝1
  - label: B
    content: m＝－2
  - label: C
    content: m＝$-\sqrt{2}$
  - label: D
    content: m＝－π
  - label: E
    content: m＝log$\frac{1}{7}$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意可知

    $\begin{cases}mx+m >-x^{2}-2x-2 \\ mx+m <x^{2}-2x+1\end{cases}$，其中 x 為任意實數

    ⇒$\begin{cases}x^{2}+(m+2)x+(m+2)> 0 \\ x^{2}+(-2-m)x+(1-m)> 0\end{cases}$

    ∵$x^{2}$ 項係數 1＞0 且恆正

    故判別式$\begin{cases}(m+2)^{2}-4 \cdot 1 \cdot (m+2)< 0 \\ (-2-m)^{2}-4 \cdot 1 \cdot (1-m)< 0\end{cases}$⇒$\begin{cases}m^{2}<4 \\ m^{2}+8m<0\end{cases}$⇒$\begin{cases}-2<m<2 \\ -8<m<0\end{cases}$

    所求範圍為－2＜m＜0

    又$\frac{1}{7}=7^{-1}=(10^{\log 7})^{-1}\approx (10^{0.8451})^{-1}=10^{-0.8451}$

    ∴$\log \frac{1}{7}\approx \log 10^{-0.8451}=-0.8451$，僅選項(C)、(E)滿足

    故選(C)(E)'
- id: doc_111_台中_興大附中_數學_g10s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 已知 y＝f（x）為二次實係數多項式函數且 f（x）＝0 沒有實數解，則下列哪些選項的敘述正確？
  options:
  - label: A
    content: f(0)＞0
  - label: B
    content: f(1)f（－1）＞0
  - label: C
    content: 不等式 f（x）＞0 的解為任意實數
  - label: D
    content: 不等式 f（x）．（x＋2）（x－3）＜0 的解為－2＜x＜3
  - label: E
    content: 不等式〔f（x）〕$^{2}$．（x＋2）（x－3）＜0 的解為－2＜x＜3
  answer:
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意可知，y＝f（x）為恆正或恆負

    (A) ╳：不一定，y＝f（x）可能恆負

    (B) ○：恆正或恆負皆滿足

    (C) ╳：不一定，若恆負，則 f（x）＞0 無解

    (D) ╳：不一定，若恆負，則

    f（x）．（x＋2）（x－3）＜0

    ⇒（x＋2）（x－3）＞0

    ⇒ x＜－2 或 x＞3

    (E) ○：∵［f（x）］$^{2}$ 必為恆正

    ∴［f（x）］$^{2}$．（x＋2）（x－3）＜0

    ⇒（x＋2）（x－3）＜0

    ⇒－2＜x＜3

    故選(B)(E)'
- id: doc_111_台中_興大附中_數學_g10s1e3_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 設 f（x）是領導（首項）係數為正的三次多項式，f（x）除以（x－1）$^{3}$ 的餘式為 2x＋3，則下列哪些選項的敘述正確？
  options:
  - label: A
    content: y＝f（x）的廣域（大域）特徵為函數 y＝g（x），此函數為一個遞增函數
  - label: B
    content: y＝f（x）圖形的對稱中心為（1，3）
  - label: C
    content: f（5－$\sqrt{3}$）＋f（－3＋$\sqrt{3}$）＝5
  - label: D
    content: 方程式 f（x）＝0 可能有三個相異實數解
  - label: E
    content: y＝f（x）與直線 3x－y＋2＝0 恰有三個相異交點
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由題意可設 f（x）＝a（x－1）$^{3}$＋2x＋3＝a（x－1）$^{3}$＋2（x－1）＋5，其中 a＞0

    (A) ○：y＝f（x）的廣域（大域）特徵即為 y＝$ax^{3}$

    ∵a＞0 ∴y＝g（x）為遞增函數

    (B) ╳：對稱中心應為（1，5）

    (C) ╳：∵$\frac{(5-\sqrt{3})+(-3+\sqrt{3})}{2}$＝1 恰為對稱中心之 x 坐標

    ∴$\frac{f(5-\sqrt{3})+f(-3+\sqrt{3})}{2}$即為對稱中心之 y 坐標 5

    ⇒$f(5-\sqrt{3})+f(-3+\sqrt{3})$＝10

    (D) ╳：∵f（x）＝a（x－1）$^{3}$＋2（x－1）＋5，其中 a＞0 且 2＞0

    ∴f（x）＝0 僅有一個實數解

    (E) ○：3x－y＋2＝0$\Leftrightarrow$y＝L（x）＝3x＋2

    當 f（x）＝L（x）時，即

    a（x－1）$^{3}$＋2x＋3＝3x＋2

    ⇒ a（x－1）$^{3}$－x＋1＝0

    ⇒ a（x－1）$^{3}$－（x－1）＝0

    ⇒（x－1）〔a（x－1）$^{2}$－1〕＝0

    ⇒（x－1）$\left[ (x-1)^{2}-\frac{1}{a} \right]$＝0

    ⇒（x－1）$\left[ (x-1)^{2}-\left( \frac{1}{\sqrt{a}} \right) ^{2} \right]$＝0

    ⇒（x－1）$\left( x-1-\frac{1}{\sqrt{a}} \right) \left( x-1+\frac{1}{\sqrt{a}} \right)$＝0

    可知有三個相異實數解

    即 y＝f（x）與直線 3x－y＋2＝0 恰有三個相異交點

    故選(A)(E)'
