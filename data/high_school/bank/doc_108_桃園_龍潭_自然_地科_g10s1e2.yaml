- id: doc_108_桃園_龍潭_自然_地科_g10s1e2_s2_38
  section: 2
  number: 38
  type: multiple
  page: 3
  stem: 地球具有分層結構。這些不同分層結構中例如花岡岩、玄武岩、橄欖岩……等。此外地表上也常發現鐵隕石，其主要成份為鐵鎳合金。下列有關這三種岩石與鐵隕石的密度比較，哪些正確？（應選2項）
  options:
  - label: A
    content: 花岡岩＞鐵隕石＞橄欖岩
  - label: B
    content: 玄武岩＞花岡岩＞橄欖岩
  - label: C
    content: 橄欖岩＞玄武岩＞花岡岩
  - label: D
    content: 玄武岩＞橄欖岩＞鐵隕石
  - label: E
    content: 鐵隕石＞橄欖岩＞花岡岩
- id: doc_108_桃園_龍潭_自然_地科_g10s1e2_s2_39
  section: 2
  number: 39
  type: multiple
  page: 4
  stem: 地球的最外部的地殼可區分為大陸地殼與海洋地殼。下列有關的敘述，哪些正確？（應選2項）
  options:
  - label: A
    content: 一般而言，大陸地殼的厚度較海洋地殼為厚
  - label: B
    content: 大陸地殼的密度較海洋地殼小
  - label: C
    content: 大陸地殼主要為矽鎂質岩石，而海洋地殼則以矽鋁質為主
  - label: D
    content: 目前發現最老的海洋地殼為40億年
  - label: E
    content: 海洋地殼則以矽鋁質為主
- id: doc_108_桃園_龍潭_自然_地科_g10s1e2_s2_40
  section: 2
  number: 40
  type: multiple
  page: 4
  stem: 地殼均衡理論認為地殼是浮在地函之上。下列有關地殼均衡理論的描述，哪些正確？（應選3項）
  options:
  - label: A
    content: 喜馬拉雅山的山根比臺灣中央山脈的山根淺
  - label: B
    content: 冰川退卻後當地的地坄會逐漸抬升
  - label: C
    content: 若質量相同，岩石密度較小的山比較高
  - label: D
    content: 一般而言，大陸地殼比海洋地殼厚
  - label: E
    content: 侵蝕作用不會使地殼抬升
