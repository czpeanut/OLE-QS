  - label: B
    content: 三葉蟲的出現
  - label: C
    content: 大氣層的形成
  - label: D
    content: 大氣層中大量氧氣的形成
  - label: E
    content: 地球內部地、地函及地殼的分層
- id: doc_108_桃園_龍潭_自然_地科_g10s1e2_s2_36
  section: 2
  number: 36
  type: multiple
  page: 3
  stem: 太陽表面在2017年9月接連發生二起被稱作「太陽閃焰」的大型爆發，規模為10年來最大。科學家預計爆發所噴出的帶電粒子團兩天後抵達地球，撞擊大氣層後產生電磁波，以致影響通訊品質。已知太陽與地球距離約為1.5 × $10^{11}$公尺，光速約為3.0 × $10^{8}$公尺／秒。下列哪些正確？（應選2項）
  options:
  - label: A
    content: 帶電粒子團以光的速度大小前進
  - label: B
    content: 電磁波在空間傳播須以帶電粒子為介質
  - label: C
    content: 電磁波以光的速度大小前進
  - label: D
    content: 帶電粒子團脫離太陽時的速率小於光速
  - label: E
    content: 帶電粒子團撞擊地球大氣層之後約500秒，地球上能觀測到太陽閃焰影像
