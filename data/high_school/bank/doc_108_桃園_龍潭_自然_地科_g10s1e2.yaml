- id: doc_108_桃園_龍潭_自然_地科_g10s1e2_s2_35
  section: 2
  number: 35
  type: multiple
  page: 3
  stem: 地球形成的過程中曾經有一段時期處於熔融的狀態，之後逐漸泠卻下來演變成初始地球。下列哪些選項的事件是在約四十億年前，地球由形成初始時期的熔融狀態逐漸冷卻而生的結果？（應選3項）
  options:
