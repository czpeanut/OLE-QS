  stem: 日本學者若林正丈指出：「觀察臺灣政治，大致要了解兩條路線：一是民眾透過各種街頭運動，以較為激進的方式爭取；二是透過現有法律規範核可的抗爭模式，爭取政治上的改革。」根據以上觀察，以下敘述何者正確？
  options:
  - label: A
    content: 內地延長主義時期，臺灣所有的抗爭都是「體制內」抗爭
  - label: B
    content: 228 事件後，國民政府的「清鄉運動」僅針對「街頭運動」的民眾
  - label: C
    content: 中壢事件群眾開始自「體制內的抗爭」走向「街頭運動」
  - label: D
    content: 《美麗島》事件是針對政府打壓「體制內的抗爭」的「街頭運動」
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)較激進的農工街頭運動不屬於「體制內」的抗爭。(B)「清鄉運動」係清查戶口、搜捕相關的嫌犯，並非針對街頭運動的民眾。(D)《美麗島》事件由演講活動爆發警民衝突，而後遭政府鎮壓逮捕黨外人士，並非「街頭運動」。
