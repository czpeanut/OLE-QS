  answer_status: verified
  answer_source: answer_key
  explanation: 題文的談話內容強調中華民國的國際人格「不因任何國家承認中共偽政權而有所變更」，並點名「美國」應繼續承認並尊重中華民國，可見當時的美國已「不再」承認中華民國，因此答案應為(D)中、美建交後。
