  stem: 「人家攻擊我在臺灣不該實行政治建制和經濟建制的特殊化，其實這是主席交代我的兩項根本政策，非如此，不足以安定這塊新回祖國的領土，不能防守它免於國內時局動盪和經濟波動的影響，假使不是斷然這樣做，恐怕臺灣早已成為東北第二，不止是今天這一點小亂子了！」下列敘述何者正確？
  options:
  - label: A
    content: 政治建制指的是延續日本的「特殊統治主義時期」
