  type: single
  page: 2
  stem: 以下是某位總統的談話：「中華民國自 1912 年建國以來，一直是一個獨立主權國家，中華民國是中國文化與中國歷史唯一真正的代表。中華民國政府是依據《中華民國憲法》所產生的合法政府。中華民國的存在一向是一個國際的事實。中華民國的國際地位及國際人格，不因任何國家承認中共偽政權而有所變更。美國應當繼續承認並尊重中華民國的法律地位和國際人格。」請問這位總統是在什麼樣的時代背景下談話？
  options:
  - label: A
    content: 中華民國政府播遷來臺
  - label: B
    content: 韓戰爆發時
  - label: C
    content: 八二三炮戰時
  - label: D
    content: 中、美建交後
