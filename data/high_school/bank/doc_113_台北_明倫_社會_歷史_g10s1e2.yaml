    content: 經濟建制的特殊化指的是臺灣實施「十大基礎建設」
  - label: C
    content: 此文主述者的接收過程受到臺灣民眾大力支持
  - label: D
    content: 文中的「今天這一點小亂子」指的是 228 事件
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從此人在臺灣實行「政治建制和經濟建制的特殊化」、臺灣是「新回祖國的領土」，可判斷此人為陳儀，因此正確答案為(D)。(A)政治建制指未在臺灣實施一般省制，而是另設行政長官公署。(B)經濟建制的特殊化是沿用日治時期的專賣制度和貿易統制。(C)從題目第一句的「人家攻擊我」即可知道並未受到臺灣民眾大力支持。
