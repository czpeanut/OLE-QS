  stem: 1810 年（嘉慶 15 年）時有一道關於臺灣的奏摺寫道：「至向例派撥班兵，原以漳、泉之兵較勝他處，用資防禦。但漳人護漳、泉人護泉，每遇械鬥之案，不免心存瞻顧，積習相沿，各分氣類。嗣後換防班兵，或可於別府各營內揀派東渡，以備操防。」根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 臺灣的兵力以本地招募為主
  - label: B
    content: 奏摺建議直接從臺灣徵兵來駐防臺灣
  - label: C
    content: 來臺的士兵因與移民同鄉常助長械鬥
  - label: D
    content: 來臺的士兵最後可申請獲准定居臺灣
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由於「漳人護漳、泉人護泉」而助長械鬥，因此奏摺建議之後防班兵時，「可於別府各營內揀派東渡」，正確答案為(C)。(A)(B)建議自漳、泉以外其他地區揀選班兵。(D)班兵三年必須輪調，並未建議申請定居臺灣。
