  - label: C
    content: 若甲、乙、丙三人各自蒐集 5 種徽章，則至少有 2 種徽章是三人都擁有
  - label: D
    content: 若甲、乙、丙三人各自蒐集 6 種徽章，則至少有 2 種徽章是三人都擁有
  - label: E
