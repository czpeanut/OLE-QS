  stem: 對於所有正整數 n，n×（n＋1）×（2n＋1）之值必為 6 的倍數。
  answer:
  - ○
  answer_status: verified
  answer_source: answer_key
  explanation: '○：∵n，n＋1 必為一奇一偶

    ∴n（n＋1）（2n＋1）必為 2 的倍數

    若 n＝3k，k＝1，2，……

    ⇒ n（n＋1）（2n＋1）＝3k（3k＋1）（6k＋1）為 3 的倍數

    若 n＝3k＋1，k＝1，2，……

    ⇒ （3k＋1）（3k＋2）（6k＋3）＝3（3k＋1）（3k＋2）（2k＋1）為 3 的倍數

    若 n＝3k＋2，k＝1，2，……

    ⇒ （3k＋2）（3k＋3）（6k＋5）＝3（3k＋2）（k＋1）（6k＋5）為 3 的倍數

    故 n（n＋1）（2n＋1）必為 6 的倍數'
