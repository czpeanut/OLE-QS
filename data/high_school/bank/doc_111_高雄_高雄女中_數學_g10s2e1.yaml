    ⇒ S＝$2-\frac{1}{2^{9}}-\frac{5}{2^{9}}=\frac{1024-1-5}{2^{9}}=\frac{509}{256}$

    故 $c_{1}$＋$c_{2}$＋……＋$c_{10}$＝$\frac{509}{256}$'
