  explanation: 由附圖的族群擴張路線圖中，可推測此應為古日耳曼人的遷徙路線。日耳曼人早期發源於斯堪地那維亞半島南部，與今日德國的北部一帶，而後向西南、東南方向發展，並約於西元前一百年出現第一波移民潮，逐漸擴張至羅馬帝國的邊境地區。(A)由附圖中可得知，其勢力尚未完全進入羅馬帝國的疆域。(C)此為 14 世紀蒙古帝國擴張時期，黑死病所造成的影響。(D)北海商貿發展與維京人的擴張有關，此圖並非維京人的擴張路線。由此可推斷最可能造成的影響為(B)封建制度的盛行。
