  explanation: 晚清臺灣出口的三大項商品為茶、糖、樟腦。從附圖中的三項商品出口總值的變化趨勢判斷：樟腦因為三項商品產量最低者，因此出口總值始終為最低的「點狀虛線」即為樟腦；臺灣茶在開港通商後獲得快速發展，並於後期超越原本為出口大宗的糖，因此可判斷「實線」為茶、「細虛線」為糖。而題目敘述所提供的線索為：甲品項獲利最低、土地稅最重，且在劉銘傳的改革中被加課釐金；乙品項因產地位於山區而土地稅較輕，改革前已課釐金；丙品項不須課土地稅，改革前已課釐金。由此線索可判斷，甲為生產成本較高且需要大量土地栽培原料的糖；乙為成本較低且獲利較高的茶；丙則屬於開發自然資源而不需課土地稅的樟腦。從題目敘述中可得知，甲品項的糖，原本的獲利已較低且生產成本較高，且在此次改革中又被加課釐金，因此為三項中打擊最大者。
