  explanation: 附圖為伊斯蘭合作組織（Organisation of Islamic Cooperation）的會員國分布圖，該組織成立於 1970 年，祕書處設於沙烏地阿拉伯。觀察附圖中的成員國分布，可發現其成員國多分布於西亞、北非與東南亞，為伊斯蘭教盛行的區域，因此可推測當地常見的文化景觀為相同文字的宗教經典（《古蘭經》）。
