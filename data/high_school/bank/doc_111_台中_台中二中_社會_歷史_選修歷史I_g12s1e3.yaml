  stem: '資料一：當時士人盛行風習，為後世所推美。然而，若仔細分析，士人常見的美德高行，不外乎是像讓爵（父有高爵，兄讓弟襲）、推財（兄弟分財，推多取少）、借交報仇（友有仇怨，許身代報）、清節（一介不取，推財與人）等。

