- id: doc_111_台中_台中二中_社會_歷史_選修歷史I_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 阿亮和爺爺走在一熱鬧街上，看到街道上有銀行家行會、毛織品行會、藥劑師行會、石匠行會、鐵匠行會、屠戶行會等各式各樣的行會，爺爺跟他說，他看到的是一個正開始發展的新商業組織。請問他們應該在下列何地？
  options:
  - label: A
    content: 六世紀的君士坦丁堡
  - label: B
    content: 八世紀的長安
  - label: C
    content: 十二世紀的佛羅倫斯
  - label: D
    content: 十八世紀的倫敦
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '由題目中以各式手工業者所組成的行會，可判斷此這種商業組織，應為歐洲中古晚期所逐漸發展而成的「基爾特（Guild）」制度。當時的工匠、商人為了達到互助、互保及壟斷技術等目的，會根據其職業組成同業組織，而這樣的組織也逐漸成為該職業的獨占團體，故選(C)。

    4.17 世紀初期，正逢荷蘭海上勢力向亞洲快速發展，並與西、葡兩大舊海上帝國競爭的期間。而法國於當時主要著重在美洲方面的發展，至 17 世紀中後期，才開始向非洲、印度方面發展。因此這艘沉沒船最不可能與法國有關，故答案選(C)。

    5.從題文中強調「社會契約的實踐」，可判斷這場革命發生於啟蒙時代；另外，從「人民掙脫舊政府、重新建立政府」，可推斷這場革命應為法國大革命，而造成法國大革命的主因之一，即為未經同意便強行徵稅，故答案選(B)。

    6.附表中的數據，反映當時世界上的強國大力發展海軍實力，透過戰列艦的建造進行軍備競賽的現象；且其中由英國、德國的擴張最為快速。此現象的出現，與 19 世紀中期至 20 世紀初期，列強在機械製造、蒸汽動力與煉鋼技術方面的快速發展相關，並在一次大戰前夕達到高峰。(A)七年戰爭發生於 18 世紀，當時的海軍仍使用傳統木造帆船。(B)克里米亞戰爭為現代化陸戰的指標，當時尚未有海上軍備競賽的現象。(D)一次大戰結束後，奧匈帝國解體，因此二次大戰前不可能出現關於奧匈帝國的統計資料。

    7.從附表中可得知，發生人口急遽下降現象的「甲」時段，約是在 17 世紀初期。而選項中，與「甲」時段最相符者，為 1618 ～ 1648 年發生的三十年戰爭。

    8.荷蘭在三十年戰爭後，獲得真正獨立，因此可得知本題的答案為低地國的分裂而促成荷蘭、比利時二個政權，故答案選(B)。(A)馬丁路德推動宗教改革的背景，主要和文藝復興時期人文主義的出現、印刷術與古籍翻譯運動等因素有關。(C)物價革命的出現，與 15 世紀海外探險風潮後，大量美洲白銀輸入歐洲相關。(D)此與英法百年戰爭相關。

    9.從題文中的時間點推算，「當年那場戰爭」應為發生於 1904 ～ 1905 年間的日俄戰爭。由於採取君主立憲制的日本，在日俄戰爭取得巨大的成功，因而加速了清末立憲運動的發展，正確選項為(C)。(A)日俄戰爭的結果雖導致俄羅斯勢力退出朝鮮半島，但日本勢力早於 19 世紀晚期即逐步進入朝鮮半島，因此不選。

    10.從題目中「古文明發源地」、「宗教和語言多元」、「農業為主要產業」、「貧窮問題」等訊息，可推斷該國應為印度。(A)此選項為以色列，該國的人類發展程度指標（HDI）相當高，根據 2019 年的數據顯示，以色列的 HDI 排名為世界第 19 名。(C)此選項應為巴西，巴西的官方語言僅為葡萄牙語，且 HDI 發展程度高。(D)此選項可能為墨西哥或秘魯，二國的宗教和語言雖然皆相當多元，但其 HDI 發展程度皆為高，因此並不相符。

    11.(B)英法百年戰爭為兩國在百年間所發生的一系列間歇性衝突、戰役。(C)防毒面罩為一次大戰期間，為因應新型態的生化武器，而開始被使用。(D)壕溝戰為 19 世紀中期後，隨著槍械、火炮的發展才開始盛行的現代化陸軍戰術。

    12.本題由「位處溫帶海洋性氣候區，是由數個政治實體組成的君主立憲政體，但其中一個政治實體有獨立建國的分離主義運動」的敘述，可推測此國應為英國，而其中欲獨立建國的政治實體則為蘇格蘭。(A)《西發里亞和約》主要確立近代主權國家的平等原則，並形成歐陸「列國制度」的國際秩序，因此並不會形成如英國的「聯合王國」體制。(B)英國已於 2020 年 1 月 31 日正式脫離歐盟。(C)英國在兩次大戰皆為戰勝國。

    13.由題目敘述中可判斷，該國的疆域橫跨西亞、埃及與印度等地，選項中與其相符者，僅有締造一個地跨歐亞非三洲的波斯帝國，故答案選(B)。而(C)古希臘與(D)貴霜王朝的疆域皆未相符。至於「洪水神話」則存在於許多古文明之中，因此無法判別(A)選項為何國。

    14.從該份文獻的敘述中，可得知當時存在政教衝突的現象，而教宗正試圖重新鞏固教會的權力。選項中與此現象相符者，為(B)改革教會的教宗格列哥里七世。當時格列哥里七世透過取回主教任命權、確立教宗選舉法，重新鞏固教宗的至高地位，並進而打擊神聖羅馬帝國皇帝亨利四世，此事件又被稱為「俗人授職衝突」。

    15.由資料一、二中，可得知當時查理曼透過介入處理教會的糾紛，而取得教宗李奧三世的信任，進而達成政教合作的關係。(A)破壞聖像運動為 8 ～ 9 世紀之間，拜占庭帝國內的政教衝突。(B)資料二反映教權與政權的合作關係。(C)東、西教會的分裂為 11 世紀的教會內部衝突，與資料內容無關。

    16.本題敘述主要突顯二個現象，其一為古代士人通過科舉的困難，其二為對「從商」觀念的轉變。(A)(B)的年代尚未出現科舉制度。唐代雖已為科舉制度的發展期，但明代由於商業興盛，士人亦開始較可接受「從商」的價值觀，士人科舉未果轉而從商的現象更為顯著，因此正確選項為(D)。

    17.從該位學者的論述中，可觀察到當時中國知識分子較嚮往西方文明的進步與發展，並批判中國傳統士人專注於典籍研究而不思進步，因而導致中國的發展落後於西方。這樣的思想為 20 世紀初期中國「新文化運動」的重要特徵，選項中(A)魯迅所提出「吃人的禮教」的批判，正反映當時的思潮特色。

    18.「甲」的口號，呈現 1950 年代初期，中共徹底推行「土地改革」政策下，對地主進行鬥爭的現象；「乙」則是 1959 年毛澤東主導的「三面紅旗」運動中，廣設「人民公社」所提出的口號；「丙」則是 1980 年代中共開始進行改革開放時，所實施農村改革政策。因此正確排序為(C)甲乙丙。

    19.由題目敘述中，可得知當時政府的財政問題，來自於港口城市稅收的減少。選項中，(B)對日抗戰期間，由於沿海地帶多被日軍所占領，因而最可能出現港口城市稅收減少導致財政問題的現象。

    20.1950 年代在冷戰升溫、兩岸對峙的狀態下，臺灣農產品的生產與外銷，具有延續日治時期的現象。當時以出口稻米、香蕉、茶葉、鳳梨罐頭及糖等農業產品至日本（甲國）為主。1970 年代由於臺灣以進行工業轉型，而當時如美國（乙國）等先進工業國家，開始因環保、勞權問題而導致生產成本增加，許多勞力密集的產業開始向外轉移。而當時臺灣即以承接美國低階加工品的訂單為大宗，故答案選(B)。

    21.附圖為 19 世紀初期，平埔族群因漢人勢力的擴張與競爭，而展開「四次大遷徙」的路線圖。當時如道卡斯、巴則海、巴布拉與貓霧捒等族，開始陸續向蘭陽平原、埔里盆地與花東等地遷移，並進而影響布農、泰雅等族生活領域的改變。因此正確選項為(C)。

    22.本題資料三所提及的「孔子見老子」畫像及其反映的思想，目前學界研究尚無定論，且其橫跨的時間段相當長、與資料二時間重疊，皆為漢代時期，因此並無法確切的照時間先後排序。而資料一所指為東漢士大夫風習，為後世所推美。故答案選(B)。

    23.由題目敘述中「計口授田」、「恢復生產」等關鍵資訊，可判斷此法應為北魏孝文帝時期的官員李安世所提出的「均田法」。而與「均田制」配合實施稅法，則為(A)租庸調法。

    24.資料一為 1928 年日本外交官對張學良的遊說內容；資料二的背景為 1931 年九一八事變。甲國為中國、乙國為日本。本題的選項(A)(B)(C)皆符合資料內容，因此答案選(D)。

    25.唐宋時期，印度洋至南海的海上貿易航路，主要由阿拉伯商人所掌握，並進而帶動中國東南沿海港市的發展，故答案選(D)。(A)當時受到穆斯林商人的影響，東南亞盛行伊斯蘭教。(B)當時較多來自阿拉伯地區的穆斯林商人移入東南亞。(C)掌握進步航海技術者為阿拉伯穆斯林。

    26.附表中呈現臺灣稻米產量與輸出之關係，並著重於輸出百分比的變化。由表中可發現，1920 ～ 1934 年間，臺灣稻米的輸出百分比，自 20 ％上升至 53 ％。這樣的變化，與 1921 年磯永吉、末永仁所推動的臺灣稻米改良最為相關。蓬萊米的出現，促使日本市場較能接受臺產稻米，並進而提升臺米的輸出，故答案選(D)。

    27.「寺廟整理運動」又稱「神佛升天運動」，為皇民化時期的相關政策之一。當時為因應戰爭的擴大，總督府開始於各方面加強同化的力度，以期待殖民地人民對母國的效忠與奉獻。1938 年臺灣總督府開始全面推行「寺廟整理運動」，內容包括傳統宮廟的整併、裁撤，強制佛寺歸附日本佛教宗派、搗毀漢人神像以及推行國家神道教等。正確選項為(C)。

    28.由題文中「以王公大人稱者甚夥」、「設王醮、送瘟」等關鍵資訊，可判斷該方志所記載的對象，為清代臺灣社會中的王爺信仰。「造木為船，糊紙像三儀仗……告牒畢，乃奉各紙像置船中……推船入水順流揚帆而去則已」，則是傳統「送瘟王船」的儀式。故答案選(D)。

    29.甲為美國政府於 1979 年 1 月 1 日所頒布的《臺灣關係法》；乙為 1979 年 1 月 1 日發布的中美《建交公報》；丙為 1954 年美國與中華民國政府簽訂之《中美共同防禦條約》。1979 年，美國政府宣布與中華人民共和國政府建交，並同時與中華民國政府斷交。斷交後，美國國務院通知中華民國，《中美共同防禦條約》將於臺灣時間 1980 年 1 月 1 日終止，而美國國會則通過《臺灣關係法》取代之。因此正確的時間順序為(D)丙乙甲。

    30.近代「總體戰」的出現，除了改變傳統專業軍隊的交戰模式外，亦促使全民投入戰爭期間的防禦、後勤與生產工作。第一次世界大戰期間，歐美各國女性大量投入後勤支援工作，這樣的現象促使女性地位提升、獲得參政權，並進一步促進性別平等、女性權利運動與思想的相關發展，故答案選(D)。

    31.(B)日本政府一直到 1945 年，才向臺灣人實施全面徵兵。(C)英國並未在戰爭期間出現族群迫害的情形。(D)第二次世界大戰期間出現的傀儡政權，包含中國南京國民政府、滿洲國、法國維琪政府等，倫敦、臺北等地應較無共同經歷。因此正確選項為(A)敵軍轟炸。

    32.由德國作家雷馬克創作的小說《西線無戰事》，其故事背景為第一次世界大戰期間，德國士兵的參戰經歷。由於這本小說帶有強烈的反戰意識，因而在 1930 年代納粹執政時期，被列為禁書並加以查禁，故答案選(C)。

    33.圖表中統計數據，呈現 1930 年代、1940 年代中後期急速上升後再下降的變化趨勢，選項中較符合此趨勢者為(B)選項的「戰後嬰兒潮」。(A)核武研發經費的變化，應會在 1940 年代達到高峰。(C)文盲的人數統計，應會隨著教育的普及而呈現直線下降的趨勢。(D)穆斯林在美國的人數變化，應會自 20 世紀初期呈現逐年上升的趨勢。

    34.作為啟蒙時代的先驅之一，洛克在論駁霍布斯關於自然狀態的學說中，逐漸發展出如「人民擁有生命、自由和財產的自然權利」、「社會契約的成立是基於人民的同意」、「人民有權推翻政府」等論述。而這樣的思想亦影響盧梭後續關於「社會契約論」的建構，盧梭在洛克的基礎上，延伸出「公共意志」的概念，並界定人民、公共意志、法律與政府之間的權利關係。因此正確選項為(D)。

    35.本題附圖為美國畫家薩金特（John Singer Sargent）於 1919 年創作的作品，現藏於英國帝國戰爭博物館，內容描繪第一次世界大戰時期所出現的新型態武器—「芥子毒氣」對於人體的侵害，並會使人失明的可怕景象。故答案選(A)。

    36.(B)第一次世界大戰期間，各國即廣泛使用海報、文宣等方式進行戰爭宣傳。(C)第一次世界大戰期間廣播技術尚未普及，直到二戰期間，廣播技術才被廣泛運用於戰爭宣傳中。(D)西方國家開始投入社會福利制度的建設大多出現於第二次世界大戰之後。

    37.霍布斯在其著作《利維坦》（巨靈論）中，強調社會的和平建立於社會契約之中，人民必須將其自然權利交付予主權，讓主權來維持內部和平與進行外部防禦；而「利維坦」則是指一種「絕對的主權」，不論社會中採取君主制、貴族制或民主制，皆不會影響其執行權力行使。由此可判斷，題目敘述與霍布斯的理論相符，正確選項為(C)。

    38.第一次世界大戰前夕，歐洲隨著工業技術、物質文明的發展，及列強持續的擴張膨脹，社會上呈現出一種進步、樂觀與好戰的氛圍。而當時「社會達爾文主義」亦在新帝國主義與歐洲文明觀的發展下，成為一種主流的思想。因此科南的小論文中，最不適合引用的資料為(A)各國相互宣戰，各城市人群，充滿愁雲慘霧的氣氛。

    39.第一次世界大戰期間，英、法為協約國陣線，共同對抗以德國為首的同盟國。當時法軍主要在歐陸戰場的西線和德軍對峙，而英國皇家海軍則派遣大批艦隊駐防北海，將德國艦隊封鎖於港口中，以斷絕德國自海上的援助補給。而第二次世界大戰初期，德軍的攻勢更加強大，法國的快速敗退，導致英國必須退防本國，而無力封鎖德軍，故答案選(B)。'
