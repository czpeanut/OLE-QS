  stem: 在我國積極規劃社會安全制度的同時，西方各國的「福利國家」理想正遭受挑戰，多項社福政策都可能因為財源窘迫而無以為繼。會出現這種情形，除了社會、經濟狀況的變動之外，也與民選政治人物的某些行為傾向有關，請問下列何者屬於這類傾向？
  options:
  - label: A
    content: 為有更多預算可運用，偏好推動加稅
  - label: B
    content: 過於注重財政紀律，使政府難以舉債應急
  - label: C
    content: 傾向擴大社會福利支出，以換取選民支持
  - label: D
    content: 漠視民意，不關心社福政策的制定與推動
  group_stem: ◎隨著我國少子女化的現象日趨嚴重，推估至 2026 年我國老年人口將達 20.6 ％，邁入超高齡社會，亦即每 5 人就有 1 人為 65 歲以上的老人，使得長期照顧需求人數也同步增加，但同時家庭的照顧功能卻逐漸式微，進而衍生社會與經濟問題。為滿足未來龐大的長照需求並減輕沉重的家庭照顧負擔，立法院於 2015 年通過《長期照顧服務法》，行政院則於 2016 年 9 月 29 日通過「長期照顧十年計畫 2.0」（簡稱長照 2.0），並於 2017 年 1 月 1 日開始實施，所有有需要的對象皆可向長照機構申請長期照顧服務，有助於改善家庭長期倚賴家屬或看護移工的影響。照顧對象除 65 歲以上失能老人，還包括 55 歲以上失能原住民、50 歲以上失智症者及任何年齡的失能身心障礙者。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 民主國家，政治人物為了獲取選票，在選舉時傾向擴大社會福利支出的政見，以換取選民支持，造成財政問題，故選(C)。(A)加稅會得罪選民，故政治人物不會貿然推動加稅。(B)政治人物為討好選民，不太注重財政紀律。(D)重視民意，關心社福政策的制定與推動，但會造成財政支出過多。
