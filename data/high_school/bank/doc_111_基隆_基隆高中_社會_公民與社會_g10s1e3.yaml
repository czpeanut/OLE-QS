  stem: 關於長榮航空空服員決定進行罷工所依據的法規及相關權利保障，何者為正確？
  options:
  - label: A
    content: 甲法應該為《團體協約法》
  - label: B
    content: 罷工的權利屬於勞動三權中的團結權
  - label: C
    content: 決定進行罷工與組織工會的權利是空服員們的個別勞動權
  - label: D
    content: 根據《勞資爭議處理法》，空服員們可以依法進行罷工
  group_stem: '◎ 2019 年 6 月 20 日桃園市空服員職業工會與長榮航空協商破局，會中當場宣布，對長榮航空發起罷工。針對此一罷工事件，行政院勞動部提醒：「依【甲】規定，若涉及提高工資、工時縮短、增加休假等調整事項，經調解不成立、且經全體會員投票過半後，就可發動罷工。依法規定，罷工期間雇主可不給薪，但雇主也不能對罷工產生的損害，對工會和會員求償」。

    以下為長榮航空罷工的大事記：

    | 6 月 7 日 | 桃園市空服員職業工會揭曉罷工投票結果：長榮分會同意比率達 9 成，全體會員同意比率達 68 ％，工會因此取得合法罷工權 |

    | --- | --- |

    | 6 月 20 日 | 桃園市空服員職業工會與長榮航空協商破局，會中當場宣布，對長榮航空發起罷工，並提出「日支費應調高到每小時新臺幣 150 元，非會員不得比照適用」、「東京、北京、金邊、胡志明、哈爾濱、瀋陽、呼和浩特等 9 條航線改為過夜班」、「國定假日出勤應給付 2 倍工資」等六個訴求 |

    | 6 月 29 日 | 桃園市空服員職業工會長榮分會舉辦投票決定是否繼續罷工，投票結果為多數同意結束罷工，宣布依據投票結果與長榮航空進行團體協商 |

    | 7 月 6 日 | 勞資雙方簽訂團體協約，歷時 17 天的罷工落幕，只要資方不秋後算帳，工會承諾 3 年不罷工 |'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)甲法應該為《勞資爭議處理法》。(B)罷工的權利屬於勞動三權中的爭議權。(C)決定進行罷工與組織工會的權利是空服員們的集體勞動權。
