  stem: 1938 年，臺灣總督府發起「寺廟整理運動」，拆毀媽祖廟等不同廟宇，還禁止媽祖遶境活動，但臺灣民間對媽祖信仰並未動搖。二次大戰結束後，眾人重建被毀的媽祖廟，也開始恢復遶境活動，其中以大甲媽祖遶境最負盛名。近年來，政府積極投入資源，結合在地力量，讓更多人了解媽祖遶境文化全貌，並與觀光活動結合，吸引遊客前來體驗。有學者從分析信仰與統治間關係的角度主張：題文中媽祖遶境文化的變遷，反映出文化權能否受保障，與實現多元文化密切相關。上述說法最可能意指為何？
