  stem: 隨著我國 2019 年 5 月立法院三讀通過《司法院釋字第七四八號解釋施行法》，立法保障同性別二人成立具有親密性及排他性之永久結合關係，這些年同性婚姻已在我國社會中經常可見，然而社會大眾對同性婚姻仍有許多僵化的看法，許多同志表示，自己婚後經常會受到一些特別的關心。像是「你們誰叫誰老公？誰叫誰老婆？」、「過年回娘家是要回誰的家？」等，令已婚同志哭笑不得的問題。請問上述內容較適合用以下哪一概念來說明？
  options:
  - label: A
    content: 日常生活的微歧視，多非刻意而是無意識地出現
  - label: B
    content: 認為自身文化高於其他群體，是尊重文化權的展現
  - label: C
    content: 不同文化有不同規範，文化本來就有高低優劣之分
  - label: D
    content: 法律與政策應需關注到性別平等，並在當中落實
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述符合異性戀者對同志的微歧視。微歧視指的是日常生活中針對某些特定族群的身分之短暫互動，可能是口語、非口語、甚至是環境；在這些有意或者無意的互動之中，傳達出敵視、輕視、負面評價或者羞辱，答案選(A)。(B)認為自身文化高於其他群體，不是尊重的展現。(C)文化沒有高低優劣之分。(D)法律只能要求最低的道德，性別平等實際的落實仍有待觀念的改變。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_28
