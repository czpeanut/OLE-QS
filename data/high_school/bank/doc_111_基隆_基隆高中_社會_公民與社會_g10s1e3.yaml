- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 為了平衡勞工與雇主之間的權力不平等，國家透過法規的修正來節制雇主的權力，並保障勞工權益，請問關於保障個別勞動權的法規與說明，下列何者正確？
  options:
  - label: A
    content: 《勞動基準法》：規定資遣、退休等勞動條件的基本保障
  - label: B
    content: 《就業保險法》：規定政府對於雇主的投保責任
  - label: C
    content: 《社會團體法》：保障勞工組織工會並爭取勞動條件的權益
  - label: D
    content: 《性別工作平等法》：要求雇主須給予勞工安全的勞動環境
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 我國保障個別勞動權的法規為《勞動基準法》，故選(A)。(B)《就業保險法》是保障勞工失業時的保險，但不屬個別勞動權。(C)沒有《社會團體法》。(D)《性別工作平等法》禁止雇主有性別歧視。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 勞工可透過工會，以集體形式向雇主進行勞動條件之協商。以我國為例，勞資雙方一旦達成共識簽訂協約，之後雇主若要變更內容，必須再與工會進行協商。上述內容屬於勞工的哪項集體勞動權？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 團結權
  - label: C
    content: 爭議權
  - label: D
    content: 協商權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 勞工有權利可以透過工會這個團體，來與公司針對勞動條件等議題進行協商，故選(D)。(A)自由權非屬勞工的集體權。(B)團結權指的是保障勞工自由組織工會、運作工會的權利。(C)爭議權就是常聽到的罷工權，當有勞資爭議事件發生時，勞工可以在符合一定要件下以罷工的手段，組織集體行動抗議的權利。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 大學新鮮人的小志，透過人力銀行尋找適合的工作機會。其中一份工作是在公司的安排下到客戶家中當家教，雖然工作辛苦，但他仍然志願從事這樣的勞動，選擇與該公司簽訂無固定上班時間的勞動契約。請問小志的工作屬於何種勞動類型？
  options:
  - label: A
    content: 志願勞動：因小志是志願從事這份工作的
  - label: B
    content: 無償勞動：因為勞動契約並無固定上班時間
  - label: C
    content: 市場性勞動：凡勞心勞力換取工資者皆屬之
  - label: D
    content: 家務勞動：因為小志必須協助客戶打理家務
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 小志到客戶家中當家教，是有酬的市場勞動，故選(C)。(A)(B)(D)都是無酬的。故非市場勞動。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 東京醫大爆發「重男輕女」的黑箱作業操作考試結果，目的是為了抑制女性考生入學；部分女醫師也表示在工作升遷上常常無法公平與男醫師競爭，請問上述呈現出女醫師在職場上面臨何種現象？
  options:
  - label: A
    content: 搭便車行為
  - label: B
    content: 再生產性勞動
  - label: C
    content: 性別主流化
  - label: D
    content: 玻璃天花板
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 東京醫大抑制女性考生入學，女醫師工作升遷常常無法公平與男醫師競爭，屬於玻璃天花板現象，答案選(D)。(A)搭便車行為是指不承擔任何成本而消費或使用公共物品的行為。(B)再生產性勞動是指家務勞動。(C)性別主流化是聯合國目前正在全世界推行的一個概念，強調各國政府在訂定法律、擬定政策、方案與計畫時，於設計、執行、監督、評估的每個階段裡，都應該要具有性別意識，同時關注到男性與女性的利益，並且加入兩性的經驗。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 新北市實施「幸福保衛站」政策，由於轄內四大超商的配合，每年僅花費兩百餘萬元經費，順利幫助數萬名弱勢學童填飽肚子，並從中找到將近兩千個高風險家庭。關於此項政策的性質屬於何者？
  options:
  - label: A
    content: 社會保險
  - label: B
    content: 社會福利服務
  - label: C
    content: 災難救助
  - label: D
    content: 社會津貼
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 「幸福保衛站」政策是以政府的稅收幫助數萬名弱勢學童填飽肚子，屬於(B)社會福利。(A)社會保險須繳交保費。(C)災難救助須有遇到災難。(D)社會津貼是國家透過立法的程序，從租稅或是公共基金編列出各項預算，每個月或定時發給的補助金，這些補助金是給予特殊身分的民眾，來縮短貧富差距，常具有補償性質或是用來滿足額外的經濟需求。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 近代世界各國皆把社會安全制度視為不可或缺的政策之一，相關支出也有逐年增加的趨勢，有關社會安全制度的說明，何者正確？
  options:
  - label: A
    content: 社會保險是由國家強制推動，經費主要來自政府的稅收
  - label: B
    content: 社會安全制度能保障國家的國防安全，避免受到他人的侵犯
  - label: C
    content: 相較於社會救助，社會津貼的提供多不考慮請領者的所得
  - label: D
    content: 若勞工的薪資低於基本工資，應申請社會救助補足差額
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 社會津貼不會有排富條款，相較於社會救助，社會津貼的提供多不考慮請領者的所得，故選(C)。(A)社會保險是由國家強制推動的保險制度，經費主要來自人民繳納的保費。(B)社會安全制度能保障人民的社會權，獲得基本生活保障。(D)若勞工的薪資低於基本工資，應向勞動局申訴。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 工業革命後的歐洲一開始將救濟視為私人慈善，多由宗教團體負責，國家則較少介入，但隨著人口遷移、年齡提高、職業災害等社會問題出現，開始有國家以政府的力量負擔起救助人民、維持基本生活水準的責任。請問此種做法在於保障何種公民權利？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 社會權
  - label: C
    content: 文化權
  - label: D
    content: 政治權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 國家以政府的力量負擔起救助人民、維持基本生活水準的責任，可以保障人民的生存、工作、教育、醫療等社會權，故選(B)。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 繼國語與英語配音後，霹靂布袋戲近年與日本動漫腳本大師合作，傳為佳話，讓更多文化地區的人認識布袋戲。下列何種概念與敘述最能傳達這段佳話？
  options:
  - label: A
    content: 在地傳統文化積極與他國公民合作，是一種「全球公民」實踐行動的展現
  - label: B
    content: 在地傳統文化因全球化帶來跨國交流合作，是文化面向的「全球化」表現
  - label: C
    content: 在地傳統文化將日本文化融入的跨國合作，是一種「另類全球化」的展現
  - label: D
    content: 在地文化反對全球化浪潮壓迫並與新文化合作，故是「反全球化」的表現
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 霹靂布袋戲近年與日本動漫腳本大師合作，這是在地傳統文化因全球化帶來跨國交流合作，是文化面向的「全球化」表現，故選(B)。(A)「全球公民」行動是跨國 NGO 對全球的重要議題採取行動。(C)「另類全球化」是反全球化。(D)「反全球化」是指來自西方和其他國家和地區的那些多少質疑、反對正統全球化的思想、政策、做法和行為。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 全民健保總額突破 7 千億大關，達 7,140 億元，健保收入成長不及支出，2017 年健保首度出現短絀 98 億元，2018 年更短絀 257 億元，再次傳出健保面臨「破產」問題。健保署長指出，當支出大於收入時，健保安全準備基金會彌補其間的差距，目前安全準備基金還有結餘 2,145 億元，但未來有討論費率調整的可能。請問下列關於全民健保的運作討論，何者符合「實質公平」？
  options:
  - label: A
    content: 全民健保目的為增進國民健康，政府對弱勢族群應補助保費
  - label: B
    content: 依使用者付費機制，全民健保應拒絕外國籍人士在臺灣就醫
  - label: C
    content: 全民健保有使用醫療資源者須給付保費，未使用者無須付費
  - label: D
    content: 全民健保強制全國國民投保，保費應該每個國民相等才公平
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 實質平等是依照事物本質作合理的差別待遇，即「對實質上相同的事物作相同處理；實質上不相同的事物，須依其特性做不相同的處理」，故(A)正確。(B)依使用者付費機制，全民健保不應拒絕外國籍人士在臺灣就醫。(C)全民健保有使用醫療資源者須給付保費，未使用者亦須付費。(D)全民健保強制全國國民投保，但保費依所得高低而不同。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 與臺灣桌球王子江宏傑結婚、成為「臺灣媳婦」的日本桌球天后福原愛，生完寶寶後入境隨俗體驗臺灣的「坐月子」文化，而他在網路上的分享引起日本媒體爭相報導。日本人並不像臺灣有坐月子的習俗，而是在產後一周內在家調養休息、吃傳統的清淡和食稱之為「產後休養」。臺日婦女生產完後調養習慣不同，屬於何種概念？
  options:
  - label: A
    content: 文化差異
  - label: B
    content: 反全球化
  - label: C
    content: 多元文化
  - label: D
    content: 文化衝突
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為臺灣和日本的生產完後調養習慣不同，屬於(A)文化差異。(B)反全球化是指來自西方和其他國家和地區的那些多少質疑、反對正統全球化的思想、政策、做法和行為。(C)多元文化是指在人類社會愈來愈複雜化，信息流通愈來發達的情況下，文化的更新轉型也日益加快，各種文化的發展均面臨著不同的機遇和挑戰，新的文化也將層出不窮。(D)文化衝突為文化價值觀、文化信仰與信念之間的分歧所導致的一種衝突。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 海綿寶寶和章魚哥受僱於蟹老闆的蟹堡王餐廳，請問蟹老闆的何種行為，在我國是違反勞動法令的？
  options:
  - label: A
    content: 只提供工作獎金給表現較佳的海綿寶寶
  - label: B
    content: 應海綿寶寶要求僱用派大星當他的助手
  - label: C
    content: 規定兩位員工每天工作 8 小時全年無休
  - label: D
    content: 購買廉價的食材以將生產成本降至最低
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 依現行《勞動基準法》規定，勞工一例一休，不可全年無休，故(C)違法。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: Netflix 為全球著名的串流媒體企業，為擴展全世界各地的用戶，結合了世界各地影視產業，融入各地的題材，製作出具有各地特色的電影或戲劇，成為其串流媒體的內容。如以臺灣茶葉貿易歷史為背景的戲劇《茶金》即是由 Netflix 所投資，紅遍全球的泰國戲劇《禁忌女孩》則是以泰國民間傳說為題材，亦有重新詮釋法國經典小說的法國影集《亞森羅蘋》。請問 Netflix 此種增加用戶的「策略」，較符合下列哪一個文化觀點？
  options:
  - label: A
    content: 思考全球化，行動在地化的全球化觀點與做法
  - label: B
    content: 社會每個人都有能擁有使用、接近文化的機會
  - label: C
    content: 利用政經優勢，將自身其文化傳遞至世界各地
  - label: D
    content: 各種文化有各自的特色與標準，不該一概而論
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: Netflix 結合了世界各地影視產業，融入各地的題材，製作出具有各地特色的電影或戲劇，成為其串流媒體的內容，是以全球的思維，融合在地的元素，將各地的文化推到世界舞臺，故選(A)。(B)近用權與題意無關。(C) Netflix 未行銷其自身文化。(D)文化多元主義與題意無關。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 內政部為協助單身青年以及婚育家庭減輕租屋負擔，自 2019 年 9 月 2 日起推動租屋補貼，總共 24,000 戶名額，依照各縣市補助金額有所不同，每月補貼 2,600 至 5,000 元。2020 年，政府提出租屋補貼新制，放寬申請資格，只要收入是各縣市最低生活費的 2.5 倍者都可以申請補助，預計到 2020 年下半年會有 12 萬戶受惠。請問租屋補貼屬於下列何種制度措施？
  options:
  - label: A
    content: 勞動權益，因為減輕租屋負擔會提升勞動條件
  - label: B
    content: 社會救助，因為租金補貼對經濟弱勢民眾發放
  - label: C
    content: 社會津貼，因為租金補貼的財源來自政府稅收
  - label: D
    content: 社會保險，因為申請補貼的民眾仍須繳納租金
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 內政部以稅收的方式，給予租屋補貼的對象，是協助單身青年以及婚育家庭，因此屬於針對特定對象給付的社會津貼，故選(C)。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 我國國民年金於 2008 年 10 月 1 日開辦，主要納保對象是年滿 25 歲、未滿 65 歲，國內設有戶籍且沒有參加勞保、農保、公教保、軍保的國民。有關於國民年金及社會保險的概念，下列敘述何者正確？
