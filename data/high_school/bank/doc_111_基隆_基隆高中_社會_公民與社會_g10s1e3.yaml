  explanation: 「日支費應調高到每小時新臺幣 150 元，非會員不得比照適用」此為工會所提出的「禁止搭便車」條款，故選(B)。(A)文中舉行罷工投票的工會屬於職業工會。(C)空服員與長榮航空是根據《團體協約法》進行協商。(D)從工會與資方的談判可以看出集體勞動權的保障有助於保障勞動權。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s2_35
  section: 2
  number: 35
  type: single
  page: 7
  stem: 根據上文，下列長期照顧的相關敘述何者正確？
  options:
  - label: A
    content: 長期照顧的對象並非以年齡區分，而是能否自理生活
  - label: B
    content: 家庭照顧屬勞動，須符合《勞動基準法》的工時規定
  - label: C
    content: 不論是家屬或是移工的家庭看護，皆屬無償勞動
  - label: D
    content: 長期照顧也是屬於社會津貼類別
  group_stem: ◎隨著我國少子女化的現象日趨嚴重，推估至 2026 年我國老年人口將達 20.6 ％，邁入超高齡社會，亦即每 5 人就有 1 人為 65 歲以上的老人，使得長期照顧需求人數也同步增加，但同時家庭的照顧功能卻逐漸式微，進而衍生社會與經濟問題。為滿足未來龐大的長照需求並減輕沉重的家庭照顧負擔，立法院於 2015 年通過《長期照顧服務法》，行政院則於 2016 年 9 月 29 日通過「長期照顧十年計畫 2.0」（簡稱長照 2.0），並於 2017 年 1 月 1 日開始實施，所有有需要的對象皆可向長照機構申請長期照顧服務，有助於改善家庭長期倚賴家屬或看護移工的影響。照顧對象除 65 歲以上失能老人，還包括 55 歲以上失能原住民、50 歲以上失智症者及任何年齡的失能身心障礙者。
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 只要符合資格者皆可向長照機構申請長期照顧服務，故長期照顧的對象並非以年齡區分，(A)正確。(B)家事移工和看護移工不適用《勞動基準法》的工時規定。(C)家屬屬無償勞動，移工為有償勞動。(D)長期照顧屬於福利服務。
- id: doc_111_基隆_基隆高中_社會_公民與社會_g10s1e3_s2_36
