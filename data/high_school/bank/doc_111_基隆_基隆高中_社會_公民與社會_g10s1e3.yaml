    content: 家務勞動是一種無償的勞動，沒有收入也沒有產值，對社會自然無貢獻
  group_stem: '◎日本電視劇《月薪嬌妻》中，女主角是一名心理學碩士，畢業後一直求職失敗，連派遣工作都不保，無奈之下和呆萌男主角簽訂「契約婚姻」，以僱傭方式成為男主角的全職主婦，照料他的生活起居，男主角支付月薪給女主角。比起公司臨時僱用的派遣員工，這樣的工作同樣擁有基本的勞動條件，但不會有不受重視的感覺，因此成為月薪嬌妻不僅滿足了女主角求職的願望，也讓萬年單身的男主角首次感受到被用心照顧與相伴的感覺。看似皆大歡喜的情節其實傳達了兩個日本社會當下嚴重的問題：一個是現在的年輕人都不願意結婚生子，社會人口老齡化、少子化嚴重；另一個是父權社會普遍認為家庭主婦對社會沒有貢獻，不把家庭主婦付出的勞動力當一回事。

    劇中在計算薪資酬勞時，清楚列出了一名家庭主婦每年創造的經濟收益為 304.1 萬日元，此金額比很多普通受薪階層的年薪都要高。如果從主婦的一天來看，這樣的金額並不令人意外，早早起床做早餐，為老公燙襯衫，送孩子上學，打掃、洗衣、晾衣，買菜準備晚飯，吃完飯後負責洗碗，然後幫孩子洗澡，哄孩子睡覺。每逢節日，要給一家大小買禮物，侍奉公婆親戚。一整天的時間，從來都不是屬於自己的。這樣的工作在現實社會中，長期被忽略，甚至被貶低為「什麼也不需要做的寄生蟲」，但是，家庭主婦真的沒有貢獻嗎？'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 家務勞動是市場性勞動的基礎，可以讓家庭成員蓄積能量再出發，為「再生產勞動」，故選(C)。(A)主婦提供的勞動是家務勞動。(B)家務勞動是一種私領域中的無償勞動。(D)家務勞動雖是無償，但對社會仍有貢獻。
