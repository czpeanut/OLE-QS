  stem: 擁有百年歷史的臺北市老松國小，就學人數過去高達數千人，如今僅剩數百人，可見我國的少子化問題日益嚴重。由於學生人數大幅減少，老松國小空出不少校舍，因此營建署有意將閒置校舍改建為青年住宅，以緩解臺北市的居住問題。文中所提及之「青年住宅」，此項政策屬於哪一種社會安全制度的範疇？
  options:
  - label: A
    content: 社會保險
  - label: B
    content: 社會救助
  - label: C
    content: 社會福利服務
  - label: D
    content: 社會津貼
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 營建署將閒置校舍改建為青年住宅，以緩解臺北市的居住問題，屬於(C)社會福利服務。(A)社會保險是一個現代的社會保障制度，由國家強制人民參與各種保險，預先為各種疾病、身心傷害、失能、失業、職業災害、老年與死亡等社會風險做準備。(B)社會救助是指國家對於遭受自然災害、失去勞動能力或者其他低收入公民給予救助，以維持其基本生活需求。(D)社會津貼是國家透過立法的程序從租稅或是公共基金編列出各項預算，每個月或定時發給的補助金，這些補助金是給予特殊身分的民眾，來縮短貧富差距，常具有補償性質或是用來滿足額外的經濟需求。
