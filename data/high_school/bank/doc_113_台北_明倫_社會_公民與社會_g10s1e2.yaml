- id: doc_113_台北_明倫_社會_公民與社會_g10s1e2_s1_47
  section: 1
  number: 47
  type: single
  page: 12
  stem: 「立法委員陳玉珍擔任《財政收支劃分法》主席用 3 分鐘在忽略不同異議提出下完成審查，通過 4,000 多億各地方財政劃分的條文。」若依照大法官在 113 年憲判字 9 號中所採的見解，當立法程序受質疑有瑕疵時，應該由人民進行民主問責優先。請問從參考資料中節錄的憲判字 9 號內容，大法官所肯定的民主課責，並沒有提到選項中的哪一個？
  options:
  - label: A
    content: 民意監督
  - label: B
    content: 輿論監督
  - label: C
    content: 議會監督
  - label: D
    content: 選舉監督
  group_stem: '請閱讀資料後，依資料內容進行作答：

    1.113 年憲判字第 9 號【立法院職權行使法等案】

    (1)聲請案相關事實（節錄）

    聲請人─立法委員柯建銘等 51 人，認立法院職權行使法增修條文計 43 條，及相關刑法條文，其立法程序有重大明顯瑕疵，應屬違憲，不生其立法效力

    (2)受理部分形成主文之法律上意見

    2.關於立法程序部分

    (一)審查原則

    立法院由人民直接選舉產生之立法委員組織之，為國家最高立法機關，代表人民行使立法權，其權限範圍包括議決法律案等（《憲法》第 62 條及第 63 條規定參照）。立法院作為由人民直接選舉產生之立法委員組成之國會，其本身固已具備機關組織與成員身分之民主正當性，惟其<u>立法權之行使及所制定之法律，亦須充分反映民意、彰顯人民意志，始具完足之民主正當性基礎，並成為彰顯國民主權原則之民主正當性體系之樞紐。</u>由於立法院為逾百名立法委員組織之合議體，其職權之行使，最終均須以多數決方式作成終局決定，而多數決方式僅屬民主制度運作之中性技術性、形式性法則，不具實質評價性，表決行為本身並無法反映民意內容，因此，立法權行使之民主正當性，僅能表現於從議案之形成，至以多數決方式作成終局決定之立法程序中。從而，立法院作為民主國會，其<u>立法程序須得以彰顯人民意志，並使人民對民意代表有最低限度問責之機會，始符合憲法國民主權原則與民主原則之意旨；其具體表現方式，主要即為立法程序之公開透明原則與討論原則。</u>

    (甲)公開透明原則要求立法程序之過程、方式、標的與表決情形等，應盡可能對人民公開，使人民得以獲取相關資訊，據以向民意代表問責，並得透過媒體與公共論壇，參與立法權行使階段之立法政策與內容之討論，即時將公民意見反映於國會。就此而言，公開透明原則乃民主問責與落實憲法國民主權原則之必要前提，自屬憲法民主原則之程序性要求之一環（釋字第 499 號解釋意旨參照）。

    基於討論原則，立法委員作為全民之代表，而非特定選民之委任代表，其於議案之主張與意見分歧時，即應於立法程序中，就議案內容之不同意見與立場盡可能為溝通、討論，並共同尋求折衷、妥協方案之可能。民主程序正是妥協之程序，而妥協須立基於充分之溝通與討論。<u>透過立法程序中議案之討論過程，不同立場與主張所代表之各種民意方得以顯現，進而以表決方式得出代表多數民意之主張。於此前提下，最終表決得出之多數決定，始符合少數獲得充分尊重下服從多數，多數代表全體之民主原則之精神</u>，並具備得以代表民意之民主正當性，實現國民主權原則之要求。因此，立法程序之討論原則，乃落實憲法國民主權原則之必要前提，亦屬民主原則之程序性要求之一。

    公開透明與討論原則作為立法程序所應遵循之憲法要求，立法者立法時，應盡最大可能謀求其實現，以對民意負責。惟基於民主原則民意政治與責任政治之原理，國會立法程序是否已適當遵循公開透明與討論原則，首先仍應由人民對國會議員於民主問責程序，包括選舉、罷免等政治程序，或媒體等公共論壇之民意形成平臺，予以評價並追究其政治責任，此亦屬民主政治之核心精神，尚非本庭於法規範憲法審查程序應逕行介入者。本庭作為憲法秩序之守護者，亦須尊重與維護以人民為樞紐之民主問責空間，不宜成為民主程序之糾察者。基此，法律案經立法院移送總統公布為法律，其立法程序遭質疑有違反公開透明與討論原則之違憲瑕疵者，原則上仍應由人民循各種民主程序問責於相關立法委員與所屬政黨。唯有該法律之立法程序客觀上已嚴重悖離公開透明與討論原則之要求，致使形式存在之法律根本欠缺其成立之正當性者，本庭始得宣告該法律因立法程序之嚴重違憲瑕疵而無效，自始不生法律應有之效力。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 憲判字第 9 號中提及由人民對國會議員問責，包含選舉、罷免等程序，此包含(A)民意監督、(B)輿論監督、(D)選舉監督，未提及(C)議會監督。
