  group_stem: '請閱讀資料後，依資料內容進行作答：

    1.參考資料一：

    (1)《憲法》第 63 條：立法院有議決法律案、預算案、戒嚴案、大赦案、宣戰案、媾和案、條約案及國家其他重要事項之權。

    (2)《憲法》第 70 條：立法院對於行政院所提預臬案，不得為增加支出之提議。

    2.參考資料二：

    《釋字第 585 號》主文節錄：立法院為有效行使憲法所賦予之立法職權，本其固有之權能自得享有一定之調查權，主動獲取<u>行使職權</u>所需之相關資訊，俾能充分思辯，審慎決定，以善盡民意機關之職責，發揮權力分立與制衡之機能。立法院調查權乃立法院行使其憲法職權所必要之<u>輔助性權力</u>，基於權力分立與制衡原則，立法院調查權所得調查之對象或事項，並非毫無限制。除所欲調查之事項必須與其行使憲法所賦予之職權有重大關聯者外，凡國家機關獨立行使職權受憲法之保障者，即非立法院所得調查之事物範圍。又如行政首長依其行政權固有之權能，對於可能影響或干預行政部門有效運作之資訊。均有決定不予公開之權力，乃屬行政權本質所具有之行政特權。立法院行使調查權如涉及此類事項，即應予以適當之尊重。如於具體案件，就所調查事項是否屬於國家機關獨立行使職權或行政特權之範疇，或就屬於行政特權之資訊應否接受調查或公開而有爭執時，立法院與其他國家機關宜循合理之途徑協商解決，或以法律明定相關要件與程序，由司法機關審理解決之。

    3.參考資料三：

    《釋字第 585 號》解釋理由書節錄：立法院所得行使之調查權，僅係為<u>輔助立法院行使其憲法所賦予之立法權限</u>，自與追訴犯罪之偵查權及司法審判權有間。基於權力分立與制衡原則，立法院亦不得立法授與自身或所屬之委員會行使偵查權或審判權。'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
