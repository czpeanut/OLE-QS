  stem: 人民的政治參與是現代民主政治運作的核心，藉由各種形式的政治參與，一方面賦予政府統治權力的合法性與正當性，另一方面也讓政府的各項決策與施政有所依據，以回應民意需求。以「選舉」而言，具有何種意義？
