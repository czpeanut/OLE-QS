  stem: 老師請同學評論關於民主國家的政府體制。哥布林：「內閣制的元首不具實權，因此國家容易出現政局動盪。」史萊姆說：「總統制的元首權力大，但因為分權分立設計並不能解散國會。」半獸人說：「臺灣為半總統制，其總統可以主動解散立法院。」精靈說：「內閣制與總統制，均是依靠學術理論規劃設計形成的典型政府體制，後進的民主國家，可排除歷史因素完全採用其設計規劃。」請問哪位同學的說法較為正確？
