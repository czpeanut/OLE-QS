- id: doc_113_台北_明倫_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 日月人侖國國會進行改選，選出新一屆的 190 席國 會議員。若選舉採「比例代表制」計算分配席次， 且規定只有得票率高於 5 ％門檻的政黨能參與席次 分配，選舉結果如右圖所示。下列哪一個政黨的席 次計算正確？
  options:
  - label: A
    content: A 黨：76 席
  - label: B
    content: B 黨：70席
  - label: C
    content: C 黨：38 席
  - label: D
    content: D 黨：6 席
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_113_台北_明倫_社會_公民與社會_g10s1e2/s1_7_f1.png
    crop:
      page: 1
      rect:
      - 390.9
      - 704.4
      - 564.3
      - 818.8
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '依現行法規不分區立委依照以下規則分配：

    (1)各政黨所推薦候選人得票數之和，為各政黨之得票數。以各政黨得票數相加之和，除某政黨得票數，得出某政黨立法委員的得票比率。

    (2)以應選名額乘前述的得票比率所得積之整數，為各政黨分配之當選名額，按政黨名單順位依次當選。

    (3)依前述規定分配當選名額，如有剩餘名額，按各政黨分配當選名額後之剩餘數大小，依次分配剩餘名額。剩餘數相同時，以抽籤決定之。

    (4)政黨得票比率未達 5 ％以上者，不予分配當選名額，而其得票數不列入第一項規定計算。

    (5)無黨籍及未經政黨推薦之候選人之得票數，不列入計算。

    本題未通過門檻的政黨席次，為 D 黨、E 黨，其席次會依照上述規則分給其他政黨，因此，A 黨的席次為 190×40／95＝80；B 黨的席次為 190×35／95＝70；C 黨的席次為 190×20／95＝40。答案為(B)。'
