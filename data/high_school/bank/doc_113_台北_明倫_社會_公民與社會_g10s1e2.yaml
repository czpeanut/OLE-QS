  stem: 高雄市長罷免案為我國史上第一位地方首長遭罷免成功的案例，罷免同意票達 93 萬 9,090 票，多於不同意的 2 萬 5,051 票，同意票更超越 2018 年當選市長票數的 89 萬餘票。有關上述罷免案的推論，下列哪些正確？
