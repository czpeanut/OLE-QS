    基於討論原則，立法委員作為全民之代表，而非特定選民之委任代表，其於議案之主張與意見分歧時，即應於立法程序中，就議案內容之不同意見與立場盡可能為溝通、討論，並共同尋求折衷、妥協方案之可能。民主程序正是妥協之程序，而妥協須立基於充分之溝通與討論。<u>透過立法程序中議案之討論過程，不同立場與主張所代表之各種民意方得以顯現，進而以表決方式得出代表多數民意之主張。於此前提下，最終表決得出之多數決定，始符合少數獲得充分尊重下服從多數，多數代表全體之民主原則之精神</u>，並具備得以代表民意之民主正當性，實現國民主權原則之要求。因此，立法程序之討論原則，乃落實憲法國民主權原則之必要前提，亦屬民主原則之程序性要求之一。

    公開透明與討論原則作為立法程序所應遵循之憲法要求，立法者立法時，應盡最大可能謀求其實現，以對民意負責。惟基於民主原則民意政治與責任政治之原理，國會立法程序是否已適當遵循公開透明與討論原則，首先仍應由人民對國會議員於民主問責程序，包括選舉、罷免等政治程序，或媒體等公共論壇之民意形成平臺，予以評價並追究其政治責任，此亦屬民主政治之核心精神，尚非本庭於法規範憲法審查程序應逕行介入者。本庭作為憲法秩序之守護者，亦須尊重與維護以人民為樞紐之民主問責空間，不宜成為民主程序之糾察者。基此，法律案經立法院移送總統公布為法律，其立法程序遭質疑有違反公開透明與討論原則之違憲瑕疵者，原則上仍應由人民循各種民主程序問責於相關立法委員與所屬政黨。唯有該法律之立法程序客觀上已嚴重悖離公開透明與討論原則之要求，致使形式存在之法律根本欠缺其成立之正當性者，本庭始得宣告該法律因立法程序之嚴重違憲瑕疵而無效，自始不生法律應有之效力。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
