- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e2_s2_19
  section: 2
  number: 19
  type: multiple
  page: 5
  stem: '小楊老師在黑板上畫了一個橢圓軌道，其描述行星在橢圓軌道上繞著位於橢圓焦點的太陽 S 運行：

    (1)假設此行星公轉週期為 T。

    (2)此行星運行的方向為由右圖中 A → B → C → D → A。

    請問聰明的同學，下列敘述哪些<u>錯誤</u>？'
  options:
  - label: A
    content: 行星在 D 點之速率與 B 點相同
  - label: B
    content: 行星在 D 點之速率較 A 點大
  - label: C
    content: 行星由 A 點運行到 B 點的平均速率與行星由 B 點運行到 C 點的平均速率相等
  - label: D
    content: 行星由 A 點運行到 B 點的時間比$\frac{T}{4}$長
  - label: E
    content: 行星由 B 點經由 C 點運行到 D 點的時間比$\frac{T}{2}$長
  assets:
  - key: s2_19_f1
    kind: figure
    file: doc_112_台中_東山_自然_物理_選修物理I_g11s1e2/s2_19_f1.png
    crop:
      page: 5
      rect:
      - 428.35
      - 454.9
      - 565.1
      - 543.45
  answer:
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) D 點與 B 點和 S 距離相等，由等面積定律：$\frac{\Delta A}{\Delta t}$＝$\frac{1}{2}$rv sinθ＝定值，D、B 點的 r sinθ相同，可得行星在 D 點與 B 點的速率相同。

    (B)由(A)解析可知，因 D 點與 S 的距離大於 A 點與 S 的距離，故 D 點的速率較 A 點小。

    (C)(D)(E)由等面積定律推知運行時間與連線掃掠面積成正比，因此可知 A → B 的時間比 B → C 的時間小，故 A → B 之平均速率較大，且 A → B 之時間比$\frac{T}{4}$短，B → C → D 之時間比$\frac{T}{2}$長。'
