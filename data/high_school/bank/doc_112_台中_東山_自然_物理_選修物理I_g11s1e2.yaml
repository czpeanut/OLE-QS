- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '物體的位置與時間的關係為 x＝8 cos（$\frac{\pi t}{5}$）m。

    則小楊老師想請問各位聰明的同學，此物體在平衡點的速率（m∕s）為下列何者呢？'
  options:
  - label: A
    content: 2.4π
  - label: B
    content: 2.0π
  - label: C
    content: 1.6π
  - label: D
    content: 1.2π
  - label: E
    content: 0.8π
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '設物體到月球中心的距離為 x，到地球中心的距離為 60R－x；地球質量為 M，物體質量為 m。

    因物體所受合力為零，故物體與地球間的萬有引力量值及物體與月球間的萬有引力量值相等，由萬有引力公式

    $\frac{GMm}{(60R-x)^{2}}$＝$\frac{G(\frac{M}{81})m}{x^{2}}$ ⇒ （60R－x）$^{2}$＝$81x^{2}$ ⇒ x＝6R'
  tags:
    unit:
      code: PH-S1-5-2
      book: 選修物理I 力學一
      chapter: 週期運動
      title: 簡諧運動
      std: true
    textbook: 選修物理I 力學一 簡諧運動
    pattern:
      key: PH-S1-5-2:T02
      name: 位置函數讀振幅角頻率與極值
    labeled_by: agent
    label_confidence: high
  difficulty: 2
- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: '東山電影院最近剛上線一部科幻電影，在講述地球內部結構因為地層變動的關係，開始不斷膨脹，導致地球半徑加倍，造成生態的浩劫，看完此部電影小楊老師開始思考：

    (1)假設地球質量不變，地球半徑變為 2 倍。

    (2)假設地球上物體質量皆不變。

    想請問此時地球表面上的物體重量，會變為原來的多少倍呢？'
  options:
  - label: A
    content: '2'
  - label: B
    content: $\frac{1}{2}$
  - label: C
    content: $\frac{1}{4}$
  - label: D
    content: '4'
  - label: E
    content: '8'
  group_stem: '（ ）2.東山天文臺近期活動在觀賞月亮的天文美景，此時東山大強想到了上課時，小楊老師所講過的物理題目：

    (1)假設地球之半徑為 R，地球的質量為月球的 81 倍。

    (2)地球中心與月球中心相距大約 60R。

    想請問各位同學，假設有一個物體在距離月球中心多遠處，其所受到的萬有引力恰為零？

    (A) 43R

    (B) 54R

    (C) 34R

    (D) 6R

    (E) 53R'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '重力加速度 g＝$\frac{GM}{r^{2}}$，地球質量不變，半徑變為 2 倍，則

    新重力加速度 g''＝$\frac{GM}{(2r)^{2}}$＝$\frac{GM}{4r^{2}}$＝$\frac{g}{4}$

    ∴物體的重量變成原來的$\frac{1}{4}$倍'
  tags:
    unit:
      code: PH-S1-6-2
      book: 選修物理I 力學一
      chapter: 萬有引力
      title: 地球表面的重力
      std: true
    textbook: 選修物理I 力學一 地球表面的重力
    pattern:
      key: PH-S1-6-2:T01
      name: 星球表面g值與密度半徑比例
    labeled_by: agent
    label_confidence: high
  difficulty: 1
- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 2
  stem: 假設在東山物理旗艦實驗教室當中有兩個物體，其質量皆為 m，彼此相距 1 公尺時，萬有引力量值為 F；今日小楊老師有另外兩個物體，其質量均為 4m，彼此相距 3 公尺時，則請問此兩物體彼此的萬有引力量值為何？
  options:
  - label: A
    content: 9F
  - label: B
    content: 3F
  - label: C
    content: $\frac{16}{9}$F
  - label: D
    content: $\frac{9}{4}$F
  - label: E
    content: F
  group_stem: '（ ）2.東山天文臺近期活動在觀賞月亮的天文美景，此時東山大強想到了上課時，小楊老師所講過的物理題目：

    (1)假設地球之半徑為 R，地球的質量為月球的 81 倍。

    (2)地球中心與月球中心相距大約 60R。

    想請問各位同學，假設有一個物體在距離月球中心多遠處，其所受到的萬有引力恰為零？

    (A) 43R

    (B) 54R

    (C) 34R

    (D) 6R

    (E) 53R'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '兩質量為 m 的物體相距 1 公尺，萬有引力 F＝$\frac{Gmm}{1^{2}}$＝$Gm^{2}$

    兩質量為 4m 的物體相距 3 公尺，萬有引力 F''＝$\frac{G\cdot 4m\cdot 4m}{3^{2}}$＝$\frac{16}{9}Gm^{2}$＝$\frac{16}{9}$F'
  tags:
    unit:
      code: PH-S1-6-1
