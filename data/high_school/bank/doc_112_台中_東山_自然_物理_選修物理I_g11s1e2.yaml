    想請問各位同學，假設有一個物體在距離月球中心多遠處，其所受到的萬有引力恰為零？

    (A) 43R

    (B) 54R

    (C) 34R

    (D) 6R

    (E) 53R'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '將星球分裂為 125 個密度不變、質量相等的小星球，質量變為原來的$\frac{1}{125}$，半徑會變成原來的$(\frac{1}{125})^{\frac{1}{3}}$＝$\frac{1}{5}$

