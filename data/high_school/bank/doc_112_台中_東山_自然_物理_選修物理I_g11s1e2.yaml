  stem: 小楊老師上課在講述關於人造衛星相關知識，假設人造衛星繞地球作等速率圓周運動，則針對不同軌道的人造衛星，下列哪幾位同學的敘述是<u>錯誤</u>的？
  options:
  - label: A
    content: 小明同學：人造衛星離地面愈高，其速率愈大
  - label: B
    content: 小德同學：人造衛星離地面愈高，其繞地球的轉動週期愈大
  - label: C
    content: 小美同學：人造衛星離地面愈高，其受力愈大
  - label: D
    content: 大東同學：人造衛星離地面愈高，其繞地球之角速度愈大
  - label: E
    content: 大強同學：人造衛星離地面愈高，其單位時間與地球連線所掃過的面積愈大
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)由重力提供向心力：$\frac{GMm}{r^{2}}$＝m$\frac{v^{2}}{r}$ ⇒ v＝$\sqrt{\frac{GM}{r}}$，故離地面愈高，其速率愈小。

    (B)週期 T＝2π$\sqrt{\frac{r^{3}}{GM}}$，故離地面愈高，其繞地球的轉動週期愈大。

    (C)因重力 F＝$\frac{GMm}{r^{2}}$，故離地面愈高，其受力愈小。

    (D)角速度 ω＝$\frac{v}{r}$，故離地面愈高，其繞地球之角速度愈小。

    (E)面積 S＝$\frac{1}{2}$rv＝$\frac{1}{2}\sqrt{rGM}$，故離地面愈高，其單位時間與地球連線所掃過的面積愈大。'
