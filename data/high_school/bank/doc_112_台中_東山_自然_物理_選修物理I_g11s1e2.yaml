- id: doc_112_台中_東山_自然_物理_選修物理I_g11s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 東山火箭研究中心正在半徑為 R 的地球上試發射火箭，當火箭飛到地球上空的位置，該位置的重力場強度為火箭在海平面上重力場強度的一半時，想請問各位同學，此時火箭距離地球表面的距離 x 為多少呢？
  options:
  - label: A
    content: 2R
  - label: B
    content: R
  - label: C
    content: $\sqrt{2}$R
  - label: D
    content: （$\sqrt{2}$－1）R
  - label: E
    content: 4R
  group_stem: '（ ）2.東山天文臺近期活動在觀賞月亮的天文美景，此時東山大強想到了上課時，小楊老師所講過的物理題目：

    (1)假設地球之半徑為 R，地球的質量為月球的 81 倍。

    (2)地球中心與月球中心相距大約 60R。

    想請問各位同學，假設有一個物體在距離月球中心多遠處，其所受到的萬有引力恰為零？

    (A) 43R

    (B) 54R

    (C) 34R

    (D) 6R

    (E) 53R'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '地球表面重力場量值為 g＝$\frac{GM}{R^{2}}$，離地表距離 x 處的重力場量值為 g''＝$\frac{GM}{(R+x)^{2}}$＝$\frac{g}{2}$

    ⇒ $\frac{R^{2}}{(R+x)^{2}}$＝$\frac{1}{2}$

    ⇒ $\frac{R}{R+x}$＝$\frac{1}{\sqrt{2}}$

    ⇒ R＋x＝$\sqrt{2}$R

    ⇒ x＝（$\sqrt{2}$－1）R'
  tags:
    unit:
      code: PH-S1-6-2
      book: 選修物理I 力學一
      chapter: 萬有引力
      title: 地球表面的重力
      std: true
    textbook: 選修物理I 力學一 地球表面的重力
    pattern:
      key: PH-S1-6-2:T03
      name: 高度與深度對重力加速度的影響
    labeled_by: agent
    label_confidence: high
  difficulty: 2
