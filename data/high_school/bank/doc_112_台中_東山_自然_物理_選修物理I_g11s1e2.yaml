  stem: 東山天文社目前正在上課，老師在上課當中與學生討論到，如果同學將一個宇宙中未知的星球（此星球密度均勻），把它分裂為 125 個密度不變且質量相等的小星球。老師想詢問一下各位同學，此時在每個小星球表面的重力加速度量值應變為原來的多少倍呢？（球的體積公式 $\frac{4}{3}$π$R^{3}$）
  options:
