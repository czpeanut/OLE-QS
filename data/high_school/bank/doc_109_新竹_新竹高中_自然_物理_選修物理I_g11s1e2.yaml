  stem: 一射手瞄準一距槍口高度h的靶。已知靶與槍口之間的水平距離為d，且槍口與水平面間在射擊前的夾角為θ。若子彈以初速度$v_{0}$射擊瞬間，靶也同時自靜止自由落下，忽略一切阻力的影響，且已知子彈能準確在落地前擊中靶，請問下列敘述何者正確？
  options:
