  stem: 如圖所示，在一跨過定滑輪的輕繩兩端分別繫上質量為$m_{A}$與$m_{B}$的兩木塊，已知兩木塊皆維持靜止狀態，且重力加速度量值為g，請問下列敘述何者正確？
