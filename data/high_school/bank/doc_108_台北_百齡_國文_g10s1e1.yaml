  stem: 古人的「名」或「字」，有其講究與內在聯繫，下列敘述正確的是：
  options:
  - label: A
    content: 一般在稱呼他人之名時，常會加「請」字以表示尊敬
  - label: B
    content: 「名」和「字」有時意義相符，如：韓愈，字子美；歸有光，字熙甫
  - label: C
    content: 「名」和「字」有時意義相反，如：杜甫，字退之；諸葛亮，字孔明
  - label: D
    content: 先秦時常在「字」前加上伯仲叔季表兄弟排行，如「仲尼」、「季札」
  - label: E
    content: 尊對卑稱其「名」，卑對尊自稱也稱「名」。如孔子稱子路為「由」，而子路對孔子自稱「由」
