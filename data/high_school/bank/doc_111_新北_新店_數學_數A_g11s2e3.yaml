  stem: 下列關於矩陣運算的敘述，何者正確?
  options:
  - label: A
    content: 若矩陣A , B滿足AB＝BA，則A與B必為方陣
  - label: B
    content: 若方陣A , B , C 滿足AB＝AC且A≠O，則B＝C
  - label: C
    content: 設I為單位方陣，若方陣A滿足$A^{2}$＝I，則$A^{－1}$＝A
  - label: D
    content: 若A≠O且B≠O且AB有意義，則AB≠O
  - label: E
    content: 若(A－B)$^{2}$＝$A^{2}$－2AB＋$B^{2}$，則AB＝BA
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：AB與BA皆有意義，故A , B分別為m×n與n×m矩陣， 又AB＝BA，故m＝n，所以A , B都是方陣。 (B) ×：舉反例，設A＝$\left[ \begin{matrix}2 & 2 \\ 1 & 1\end{matrix} \right]$，B＝$\left[ \begin{matrix}2 & 2 \\ 1 & 0\end{matrix} \right]$，C＝$\left[ \begin{matrix}0 & 1 \\ 3 & 1\end{matrix} \right]$， 則AB＝$\left[ \begin{matrix}2 & 2 \\ 1 & 1\end{matrix} \right]\left[ \begin{matrix}2 & 2 \\ 1 & 0\end{matrix} \right]$＝$\left[ \begin{matrix}6 & 4 \\ 3 & 2\end{matrix} \right]$，AC＝$\left[ \begin{matrix}2 & 2 \\ 1 & 1\end{matrix} \right]\left[ \begin{matrix}0 & 1 \\ 3 & 1\end{matrix} \right]$＝$\left[ \begin{matrix}6 & 4 \\ 3 & 2\end{matrix} \right]$， 故AB＝AC且A≠O，但B≠C。 (C) ○：$A^{2}$＝I$\Rightarrow$AA＝I，故A為A的反方陣，即$A^{－1}$＝A。 (D) ×：舉反例，設A＝$\left[ \begin{matrix}0 & 1 \\ 0 & 0\end{matrix} \right]$，B＝$\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$，則A≠O，但B≠O， 但AB＝$\left[ \begin{matrix}0 & 1 \\ 0 & 0\end{matrix} \right]\left[ \begin{matrix}1 & 0 \\ 0 & 0\end{matrix} \right]$＝$\left[ \begin{matrix}0 & 0 \\ 0 & 0\end{matrix} \right]$＝O。 (E) ○：(A－B)$^{2}$＝(A－B)(A－B)＝$A^{2}$－AB－BA＋$B^{2}$， 若(A－B)$^{2}$＝$A^{2}$－2AB＋$B^{2}$， 則$A^{2}$－AB－BA＋$B^{2}$＝$A^{2}$－2AB＋$B^{2}\Rightarrow$BA＝AB。 故選(A)(C)(E)。
