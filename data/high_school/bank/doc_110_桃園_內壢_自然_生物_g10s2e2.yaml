- id: doc_110_桃園_內壢_自然_生物_g10s2e2_s2_48
  section: 2
  number: 48
  type: multiple
  page: 5
  stem: 在動物的世界車里，以下哪些生物體中沒有性染色體的存在？（複選）
  options:
  - label: A
    content: 小丑魚
  - label: B
    content: 紋白蝶
  - label: C
    content: 短吻鱷
  - label: D
    content: 白鷺鷥
  - label: E
    content: 虎頭峰
  group_stem: '【閱讀題】我們習慣由自己的角度來觀看世界，總以為生物也都有分雄、雌，但這可不一定。有些動物是雌雄同體，如蚯蚓身上同時具有精巢與卵巢，因此蚯蚓寶寶在鑽出卵繭峙，就不需要去問牠是男生或女生。不過多數的動物還是有雌雄之別，究竟是什麼因素影響性別呢？根據下列文章，試回答48.～50.題：

    許多生物的性別是由染色體的形式決定。以人為例，女性的性染色是重組合為XX，經由減數分裂產生的卵會帶有一個X染色體；男性的性染色體為XY，產生的精子便會有兩種不向的形式，帶有X或是帶有Y染色體，所以人類胎兒的性別其實是由父親決定的。受精時，若是帶有X的精子拔得頭籌，寶貝女兒就出現了；但若是帶有Y的精子勝出，那便是弄璋之喜。哺乳動物大多與人類相同，是以此方式決定性別。然而對於蝶、蛾或是鳥類而言，雖然也是由一對特殊的性染色體來決定性別，但他們的雄性卻是兩條相同的染色繼（稱為ZZ），雌性則為兩條不同的染色體（稱為ZW），換句話說，他們子代的性別是由雌性的卵來決定。

    至於高度分工的社會性昆蟲，又有一套完全不同的性別決定方式：染色體的套數。以螞蟻為例，一個巢中只有一隻蟻后具有生殖能力，他所產下的卵若沒有受粉（染色體為單套），會發育為雄性，若曾受精（染色體為雙套），則發育為雌性。平時觀察到的工蟻或兵蟻，都是受精過具有雙套染色體的雌性，他們幫忙覓食育幼、保護家園，是蟻群中的生力軍。通常只在交配季節，蟻后才會另外產下一些未受精的卵，這些卵發育為雄蟻後，可與年輕的蟻后交配以建立新族群。

    除了基因的影響之外，有些生物的性別是由環境因素來決定。例如：某些鱷魚的卵在發育過程中，其關鍵時刻的溫度會影響胚胎發育為雄性或雌性，如短吻鱷只在攝氏32度左右時孵出雄鱷魚，涼爽些或是更酷熱都會孵出雌鱷魚。更稀奇的是，某些熱帶魚的性別竟然是可以轉變的，如在小丑魚的族群中，只有最強大的那隻雌魚具有生殖力，他會與最強的雄魚交配產生子代，但若該雌魚死掉，則最強雄魚就會轉變為雌魚，取而代之！

    有些魚類的性別是由年齡決定的，如石斑魚，是臺灣有名的養殖魚，小的時候全部是雌魚，養到8、9歲後，大部分會變性為雄魚，屬於「老夫少妻」配。而鯛魚類則相反，如黑鯛、嘉蠟魚等，在1歲左右都是雄魚，約2歲以後就變性為雌魚，成為「老妻少夫」配。'
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)環境因素決定；(C)溫度影響；(E)染色體套數。故選(A)(C)(E)。
