- id: doc_110_桃園_內壢_自然_生物_g10s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列何種條件致使某植物不易進行白熱雜交？
  options:
  - label: A
    content: 雄蕊與雌蕊非同時成熟
  - label: B
    content: 雌雄異株
  - label: C
    content: 雄法和柱頭長在不同的花朵上
  - label: D
    content: 自花授粉
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 自花授粉就不容易雜交；(B)(C)可藉由動物傳播。故選(D)。
- id: doc_110_桃園_內壢_自然_生物_g10s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 要確定高莖豌豆是純品系或非純品系，孟德爾用何種交配方式判定？
  options:
  - label: A
    content: 高莖碗豆自花授粉，若子代全為高莖，則為純品系
  - label: B
    content: 高莖豌豆自交，若子代有為矮莖，則為純品系
  - label: C
    content: 高莖和矮莖豌豆雜交（試交），若子代全為高莖，則為純品系
  - label: D
    content: 高莖和矮莖就豆雜交（試交），若子代有高莖，則為純品系
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 純品系就不能有矮莖後代或與矮莖雜交。故選(A)。
- id: doc_110_桃園_內壢_自然_生物_g10s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列關於孟德爾遺傳的豌豆實驗及相關敘述，何者正確？
  options:
  - label: A
    content: 孟德鵑將等位基因定義為位於同源染色體上相同位置上的基因
  - label: B
    content: 單性狀雜交可推知分離律及獨立分配律
  - label: C
    content: 每個性狀由一對等位基因控制，減數分裂形成配子時，兩個等位基因會互相分離到不同配子中，稱為獨立分配律
  - label: D
    content: Fl出現的表徵皆為顯性，隱性的表徵在F2會出現
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)當時未有基因概念；(B)只能推知分離律；(D)雙性雜交才能推知獨立分配律。故選(D)。
- id: doc_110_桃園_內壢_自然_生物_g10s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 則第二次實驗雜交親代的基因型應為何？
  options:
  - label: A
    content: SS×Ss
  - label: B
    content: SS×ss
  - label: C
    content: Ss×Ss
  - label: D
    content: Ss×ss
  group_stem: 題組一、豌豆種皮有圓滑與皺縮兩種形態，由對偶基因S與s所控制。阿智令純品系的圓滑種皮豌豆與純品系皺縮種皮豌豆雜交，產生的第一子代全為圓滑種皮碗豆。若使未知基因型的圓滑種皮碗豆與一皺縮種皮豌豆雜交，獲得55株圓滑種皮豌豆及60株皺縮種皮豌豆的子代。試根據此敘述，回答第4.～5.題：
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 後代比例接近1：1。故選(D)。
