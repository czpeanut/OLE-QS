    除了基因的影響之外，有些生物的性別是由環境因素來決定。例如：某些鱷魚的卵在發育過程中，其關鍵時刻的溫度會影響胚胎發育為雄性或雌性，如短吻鱷只在攝氏32度左右時孵出雄鱷魚，涼爽些或是更酷熱都會孵出雌鱷魚。更稀奇的是，某些熱帶魚的性別竟然是可以轉變的，如在小丑魚的族群中，只有最強大的那隻雌魚具有生殖力，他會與最強的雄魚交配產生子代，但若該雌魚死掉，則最強雄魚就會轉變為雌魚，取而代之！

    有些魚類的性別是由年齡決定的，如石斑魚，是臺灣有名的養殖魚，小的時候全部是雌魚，養到8、9歲後，大部分會變性為雄魚，屬於「老夫少妻」配。而鯛魚類則相反，如黑鯛、嘉蠟魚等，在1歲左右都是雄魚，約2歲以後就變性為雌魚，成為「老妻少夫」配。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 溫度影響性別。故選(A)。
