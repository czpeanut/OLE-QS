      book: 選修公民與社會I 現代社會與經濟
      chapter: 利率、固定投資與貨幣政策
      title: 中央銀行與貨幣政策
      std: true
    textbook: 選修公民與社會I 現代社會與經濟 中央銀行與貨幣政策
