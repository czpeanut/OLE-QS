  section: 1
  number: 10
  type: single
  page: 1
  stem: 銀行體系有個特點：只要有銀行傳出可能倒閉的消息，就會引起存戶恐慌，因而發生擠兌，危及銀行體系穩定。下列何者「不是」我國為了避免發生擠兌而採取的相關措施？
  options:
  - label: A
    content: 規定銀行須保有法定存款準備
  - label: B
    content: 由中央銀行替政府辦理公債發行
  - label: C
    content: 銀行一律強制加入存款保險
  - label: D
    content: 中央銀行扮演最終貸放者
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(C)(D)皆是我國為了避免擠兌而採取的措施。(B)發行公債的目的是籌集資金，彌補財政赤字，擴大政府投資支出和解決暫時性資金短缺。
