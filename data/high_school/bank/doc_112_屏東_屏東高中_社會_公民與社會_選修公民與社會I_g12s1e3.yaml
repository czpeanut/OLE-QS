  stem: 貨幣存在的目的是為了方便人們的交易，因為貨幣存在某些商品無法達到的功能，例如：若沒有電冰箱的出現，很多商品就無法保存到另一個時間或階段，而貨幣就沒有此種困擾，試問上述的例子中，主要闡述貨幣存在的哪一項功能？
  options:
