- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 報導指出全球經濟成長趨緩，影響國內經濟復甦步調也停滯不前，中央銀行決議降息半碼，中央銀行總裁指出，救經濟需要貨幣政策搭配擴張性財政政策及結構性改革三管齊下才行。針對上述分析敘述，下列何者正確？
  options:
  - label: A
    content: 降息半碼目的在減少市場貨幣數量
  - label: B
    content: 可以用加稅來實施擴張性財政政策
  - label: C
    content: 商業銀行對公司票據貼現率將提高
  - label: D
    content: 中央銀行降息是採行寬鬆貨幣政策
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)降息的目的在於增加貨幣數量。(B)加稅是緊縮的財政政策。(C)要刺激經濟應該要降低重貼現率，進而使銀行對公司票據降低貼現率。
  tags:
