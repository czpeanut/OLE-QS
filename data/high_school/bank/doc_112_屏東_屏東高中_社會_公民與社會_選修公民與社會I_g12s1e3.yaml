  section: 1
  number: 9
  type: single
  page: 1
  stem: 根據我國的《中央銀行法》，下列哪項「不是」我國央行的經營目標？
  options:
  - label: A
    content: 促進金融穩定
  - label: B
    content: 健全銀行業務
  - label: C
    content: 增加國庫獲利
  - label: D
    content: 維護對內及對外幣值的穩定
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 根據《中央銀行法》之規定，中央銀行之經營目標為促進金融穩定、健全銀行業務、維護對內及對外幣值之穩定，以及在上述目標範圍內，協助經濟發展。所謂對內幣值穩定是指維持物價之穩定，而對外幣值穩定是指新臺幣匯率之動態穩定。依據上述，以(C)增加國庫獲利不為央行的功能。
