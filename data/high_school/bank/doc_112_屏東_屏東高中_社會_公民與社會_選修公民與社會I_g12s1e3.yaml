  section: 1
  number: 8
  type: single
  page: 1
  stem: 各國為維持物價的穩定，避免通貨膨脹的情形發生，所以必須將貨幣發行的數量控制在適當的範圍內。下列何者是我國負責發行新臺幣的政府機關？
