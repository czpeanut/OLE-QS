  section: 1
  number: 11
  type: single
  page: 1
  stem: 當一國經濟呈現不景氣，市面上所流通的貨幣數量減少時，政府應該採取使銀根寬鬆，增加貨幣流通數量，所以可以採取什麼方法來達到目的？
  options:
  - label: A
    content: 降低存款準備率
  - label: B
    content: 提高重貼現率
  - label: C
    content: 賣出市場上合格票據
  - label: D
    content: 提高銀行存款利率
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)降低存款準備率，會使銀行可以放貸出更多資金，而增加貨幣流通數量，為正解。(B)(C)(D)的做法皆是提高銀行或民眾借款成本，會減少貨幣流通數量。
