  answer_status: verified
  answer_source: answer_key
  explanation: 景氣循環是指經濟的跌宕起伏，一般而言，景氣循環可以分為四個階段：擴張、趨緩至頂峰、衰退至谷底、然後復甦，依此波動，應選(D)。
