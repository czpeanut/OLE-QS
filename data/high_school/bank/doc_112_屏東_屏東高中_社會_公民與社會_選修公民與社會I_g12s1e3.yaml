- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 一旦金融機構發生倒閉以致無法償還所收存款時，在我國是由(甲)在一定額度與範圍內，賠付給存款大眾，請問(甲)應該是以下哪一個機構？
  options:
  - label: A
    content: 中央銀行
  - label: B
    content: 中央再保險公司
  - label: C
    content: 中央存款保險公司
  - label: D
    content: 金融監督管理委員會
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 為避免金融機構之存款人利益受損，政府須設立專責組織以保障之，故中央存款保險公司依據《存款保險條例》之規定設立，而該條例制定之目的是為保障金融機構存款人利益，鼓勵儲蓄，維護信用秩序，促進金融業務健全發展。換言之，政府設計存款保險機制，是為保證當存款銀行發生危機不能支付時，存款大眾之權益，仍可獲得及時的保障，故選(C)。
  tags:
