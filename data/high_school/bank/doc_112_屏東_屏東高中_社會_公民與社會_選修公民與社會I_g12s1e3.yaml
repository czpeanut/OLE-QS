  explanation: 發行貨幣的主要目的在提供社會大眾一種安全可靠、價值穩定及廣被接受的支付工具，其制度的良窳影響國計民生甚鉅，因此世界各國大都由中央銀行獨占發行通貨特權，故選(A)。
