  section: 1
  number: 7
  type: single
  page: 1
  stem: 關於經濟學上定義的貨幣功能當中，最重要的為下列何者？
  options:
  - label: A
    content: 價值的儲存
  - label: B
    content: 計價的單位
  - label: C
    content: 交易的媒介
  - label: D
    content: 遞延支付的工具
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 貨幣最重要且最原始功能，便是交易的媒介。在任一經濟體系中，若無貨幣做為交易媒介，則民眾只能維持以物易物的交易型態。然而，在買賣交易的過程中，買賣雙方所能夠或是願意提供交換的物品，必須恰好也是對方所需要的，故選(C)。
