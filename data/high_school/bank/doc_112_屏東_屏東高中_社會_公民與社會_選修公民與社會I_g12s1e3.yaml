- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會I_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 日常生活中常看到有人拿信用卡消費，有人將其稱為「塑膠貨幣」。下列針對信用卡是否為貨幣的相關敘述，何者正確？
  options:
  - label: A
    content: 它是貨幣，因為可以讓消費者先享受後付款，具有延遲支付的功能
  - label: B
    content: 它不是貨幣，持卡人只能透過它讓發卡機構先行支付款項，繳費日到期時仍要用貨幣清償
  - label: C
    content: 它是貨幣，雖然是塑膠材質，但因接受度高，具有交易媒介的功能
  - label: D
    content: 它不是貨幣，一般信用卡以個人信用為擔保，保障不足，要國營機構發行的才能算是貨幣
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 信用卡與簽帳卡不是貨幣，因為貨幣除了交易媒介的功能以外，還有價值儲存與延期支付的功能；銀行發行的信用卡、簽帳卡短期間內可替代現金，但最終在繳費日到來時，仍需以貨幣支付，因此信用卡、簽帳卡僅發揮了延期支付的功能，故選(B)。
  tags:
    unit:
      code: CI-S1-6-3
      book: 選修公民與社會I 現代社會與經濟
      chapter: 利率、固定投資與貨幣政策
      title: 中央銀行與貨幣政策
      std: true
