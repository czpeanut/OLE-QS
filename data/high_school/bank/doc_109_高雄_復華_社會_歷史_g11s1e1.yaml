questions:
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 神話往往可以反映出某些文明的重要特色，如某文明的神話故事常透露出「宿命論」、「命運的不確定性、「明知不可為而為之」等態度，請問這最可能是哪一個古文明的特色？
  options:
  - label: A
    content: 中國
  - label: B
    content: 印度
  - label: C
    content: 埃及
  - label: D
    content: 希臘
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 揚．落．艾克的《根特祭壇畫》是15世紀初期的傑作，植物學家能在畫中清楚辨認許多花朵和樹木；波提切利的《春》則繪於15世紀後期，其中的花草樹木也栩栩如生。根據上述，兩幅畫呈現了當時哪一種繪畫特色？
  options:
  - label: A
    content: 具有寫實性
  - label: B
    content: 強調世俗性
  - label: C
    content: 古典的仿照
  - label: D
    content: 與科學結合
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 文藝復興時代有助於知識保存，並使書籍流傳變得較為普及的原因是下列何者？
  options:
  - label: A
    content: 修道院的傳抄
  - label: B
    content: 教育的普及
  - label: C
    content: 造紙術的西傳
  - label: D
    content: 印刷術的流行
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 基督教早期的活動範圍是在帝國的東半部，當時除羅馬教區以外，其他主要教區皆集中在東部。自4世紀末以後，以羅馬為首的西方教會和東方教會，因各自不同的教會、政治、社會、文化等原因，在神學以及教會的組織、紀律等各方面的分歧逐漸擴大，彼此爭論不休。根據上述内容可知，東、西教會分裂的主要原因為何？
  options:
  - label: A
    content: 民族不同
  - label: B
    content: 距離太遠
  - label: C
    content: 教義分歧
  - label: D
    content: 語言不通
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 「波隆納大學和巴黎大學非常古老，前者約設立於1088年，後者在12世紀末期建立，其次，古老的學校有牛津、劍橋、蒙特倍拉等著名大學……至中古時代末期，西歐已有80餘所大學了」。上文中的大學原為何種組織蛻變而成？
  options:
  - label: A
    content: 行會
  - label: B
    content: 公民大會
  - label: C
    content: 法院
  - label: D
    content: 圖書館
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 19世紀的浪漫主義作家夏多布里昂(Chateaubriand)認為君士坦丁「造就了中世紀」，應是指君士坦丁大帝的何項政策？
  options:
  - label: A
    content: 讓基督教合法化
  - label: B
    content: 營建東都
  - label: C
    content: 結束羅馬的分裂
  - label: D
    content: 宣布基督教為國教
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 他是歐洲北方基督教人文主義的領袖。其著作中以「愚人」的口吻評論當時的局勢，對教會和上層貴族的貪婪腐化極盡諷刺，並主張教士應回復到使徒時代的簡樸生活。請問此人應為下列何者？
  options:
  - label: A
    content: 薄伽丘
  - label: B
    content: 佩脫拉克
  - label: C
    content: 摩爾
  - label: D
    content: 伊拉斯莫斯
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 「早期羅馬人相信很多神，認為這些神直接干預人世間的事務。羅馬人的家庭生活都是由敬神開始，也因此宗教儀式非常完整而繁複。随著羅馬向外擴張，兼併了許多國家，羅馬城充斥著許多來自不同地區的人民、奴隸，當羅馬與其他民族的宗教和文化接觸後，便經常拿其他民族的神為自己所用，像是希臘神話與埃及神話的内容，便曾被吸收到羅馬神話之中，成為羅馬信仰的一部分。」從上述文句，可知羅馬宗教具有何種特點？
  options:
  - label: A
    content: 不具有原創性的神明
  - label: B
    content: 足以給予人精神慰藉
  - label: C
    content: 神明與人一樣擁有七情六慾
  - label: D
    content: 兼容其他民族的信仰神話
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 西元前3世紀，某座城市是東西文化交流和學術研究中心，聚集大批著名的學者，如阿基米德、歐幾里德等，他們利用城内的圖書館、博物館及政府的贊助，獲得卓越的學術成就。請問這是哪一座城市？
  options:
  - label: A
    content: 雅典
  - label: B
    content: 亞歷山大
  - label: C
    content: 巴比倫
  - label: D
    content: 波斯城
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 伯羅奔尼撒戰爭後，雅典逐漸走向民粹政治，他卻宣揚異於傳統宗教之學說，終於在西元前399年，以腐化青年思想之罪名被宣告死刑，他不服判決，從容飲毒酒身亡。上述是何人之事蹟？
  options:
  - label: A
    content: 蘇格拉底
  - label: B
    content: 柏拉圖
  - label: C
    content: 亞里斯多德
  - label: D
    content: 畢達哥拉斯
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 「他透過戰爭，為商業掃平了道路，開闢了新的通道，準備了港口、工地、倉庫和集市。透過許多殖民地，將希臘文明傳到帝國各個角落並扎下根，將所有的民族、觀念、宗教，交融於一個偉大的統一體中，由此開始產生一種新的文明。根據上述，此人最重要的影響為下列何者？
  options:
  - label: A
    content: 奠定希臘的民主政治
  - label: B
    content: 開創希臘化時代
  - label: C
    content: 積極發展商業經濟
  - label: D
    content: 建立強大的帝國領土
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 「他與士兵看到發光的十字架懸在空中，上面寫著『勝利在這個標記中』。他以這個標記作為旗械，戰勝競爭者成為羅馬皇帝。次年。他頒布《米蘭韶令》，這是基督教第一次在歷史上取得政府的公認。」請問這位羅馬皇帝為何人？
  options:
  - label: A
    content: 戴克里先
  - label: B
    content: 君士坦丁
  - label: C
    content: 狄奥多西
  - label: D
    content: 查士丁尼
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 有位學者指出，培育出文藝復興運動的，既不是達文西的<蒙娜麗莎〉，也不是但丁的《神曲》，而是住在威尼斯及佛羅倫斯的那些擁有紡紗作坊的主人。請問我們如何理解這個觀點？
  options:
  - label: A
    content: 這位學者指出了文藝復興的發生時間
  - label: B
    content: 這位學者強調的是文藝復興的出現背景
  - label: C
    content: 這位學者指出了文藝復興的侷限性
  - label: D
    content: 這位學者點出了文藝復興傳播的方向
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 此時的典型農村，主要建築多是封建領主與其附庸的宅邸，以及教區教堂。教堂通常位於村子中央，神父在農村生活扮演首要角色：替新生兒施洗、主持婚禮和葬禮，還有定期的彌撒。請問上述情景最可能出現於何處？
  options:
  - label: A
    content: 1世紀的敘利亞
  - label: B
    content: 4世紀的義大利
  - label: C
    content: 8世紀的法蘭西
  - label: D
    content: 11世紀的埃及
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 「1384年佛羅倫斯鼠疫流行，三男七女在郊外一所別墅避難，為排解寂寞，每人每天講一個故事、10天共講了100個故事，這些故事的題材廣泛，分別取材於歴史故事。宮廷傳聞、街談巷議、寓言佚事、東方民間故事。」上述說明為某部名著之介紹，請問下列何者是這部名著的特色？
  options:
  - label: A
    content: 以神為中心立論
  - label: B
    content: 歌頌教士的偉業
  - label: C
    content: 以方言或母語書寫
  - label: D
    content: 主張嚴格禁慾苦修
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 羅馬共和的政府其實是一種「混合體制」，集合了民主(公民大會)、貴族(元老院)與君主(執政官)三種政治。請問這種政治體制有何優點？
  options:
  - label: A
    content: 可以充分實現全民政治
  - label: B
    content: 可兼顧權力分享與制衡
  - label: C
    content: 能落實主權在民的精神
  - label: D
    content: 能完全杜絕野心家坐大
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 當羅馬人被迦太基將軍漢尼拔打得無力招架時，人民呐喊著：「我們要祈求什麼神來拯救羅馬呢？」元老院為了平息騷動，先用人做犧牲，接著又以希臘的宗教儀式向羅馬與希臘諸神祈禱。由上述可知羅馬人的宗教信仰有何特色？
  options:
  - label: A
    content: 特别崇拜守護軍隊的戰神
  - label: B
    content: 常以人殉表示對神的敬意
  - label: C
    content: 元老院貴族時常身兼祭司
  - label: D
    content: 充滿功利主義的務實色彩
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 東方的神祇大多是無所不能但遙不可及，祂們喚起的常是恐懼感而非安全感。而希臘人要的卻是在平等條件下可與之討價還價的神，因此神被赋予與人類相似的體魄、弱點與需求。根據上述，下列何者最貼近希臘神祇的形象？
  options:
  - label: A
    content: 至高無上的造物者
  - label: B
    content: 道德法則的維護者
  - label: C
    content: 神祕難測的自然神
  - label: D
    content: 與人同形同性的神
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 某位歴史人物曾言：「我們的制度之所以被稱為民主政治，是因政權在所有公民手中，而不是在少數人手中。」請問此人最有可能是下列何者？
  options:
  - label: A
    content: 梭倫
  - label: B
    content: 克里斯提尼
  - label: C
    content: 伯里克里斯
  - label: D
    content: 亞歷山大
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 「我們應揚棄現代世界史的進程為單一直線變遷的觀念，因世上不同地區同時發生某些普遍情勢，可能助長(或抑制)貿易擴大、帝國擴張、觀念交流或人民移動，並改變不同地區間的勢力對比。例如：戰爭的爆發和戦爭的過程不可預測，可能打破既有均勢，加諸另一種均勢，因此19世紀末的貿易大擴張和其促成的各種全球化，隨著一戰的爆發而停擺。」根據上述内容，我們應該如何理解現代世界史的發展？【資料來源：约翰．達爾文著《帖木兒之後：1405～2000年全球帝國史》(新北市：野人文化，2010年)，頁46～47。】
  options:
  - label: A
    content: 為各地不期然事件的互動下產生的结果
  - label: B
    content: 為統治者正確決策導致的發展
  - label: C
    content: 為貿易擴張與經濟全球化造成的影響
  - label: D
    content: 為歐洲自大航海時代後穩定前進的過程
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 中古時代的教會與修道院制度，對歐洲發展有重要影響，請問下列何者為是？
  options:
  - label: A
    content: 修道院與教會附設的主教座堂學校，積極推廣教育，有助於人民基礎知識的發展
  - label: B
    content: 教會完全取代世俗政權行政與司法的權力，成為實質的行政機構
  - label: C
    content: 教士抄寫古書，保存古代典籍，成為文化傳承的重要基礎
  - label: D
    content: 教士與修士致力於宗教傳播，宣揚苦行苦修，導致經濟衰退
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 西元2世紀時，迦太基主教曾說：「殉道者的血，變成了教會的種子。」西元1世紀到西元4世紀初，是教會史上的教難時期。根據迦太基主教的話，我們可以看出基督教教難時期的哪一現象？
  options:
  - label: A
    content: 基督教會分裂為二，各自發展
  - label: B
    content: 門徒不畏鞎辛地向外邦人傳播福音
  - label: C
    content: 教會與修道院感化蠻族，使福音遠播
  - label: D
    content: 羅馬帝國的迫害激發信徒的信心，人數不減反增
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 從希臘的哲學家蘇格拉底關注政治腐敗、社會失序與道德重建等問題，演變到希臘化時代斯多葛學派的重視克己修身，請問這樣的發展與哪一歷史變化有關？
  options:
  - label: A
    content: 經濟上由農業生產到商業貿易
  - label: B
    content: 思想上由關心自然轉變為重視人文
  - label: C
    content: 政治上由城邦政治轉型為帝國政治
  - label: D
    content: 宗教上由多神信仰變為一神信仰
- id: doc_109_高雄_復華_社會_歷史_g11s1e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 他主張地球是一個漂浮在大海上的圓盤，地震則是水震盪所造成。他是第一個以自然界本身的運作原理，來解釋宇宙萬物，而非訴諸超自然力量的人，因此有人認為他是「科學之父」，他是何人？
  options:
  - label: A
    content: 泰利斯
  - label: B
    content: 蘇格拉底
  - label: C
    content: 柏拉圖
  - label: D
