  stem: '直到中世紀後期，隨著經濟的發展，糧食出現大量剩餘，人們開始追求更高層次的消費。「貿易再次開始，貨幣流通加快，城鎮又一次形成。」商業再次復興，國王們從商業發展中看到了好處，因為可以從商人身上收到大量的稅收。各國紛紛制定鼓勵商業的政策，商業在歐洲各地蓬勃發展起來。如果從人口和數量來看，中世紀再度出現的歐洲城市都不大，有20000人口的城市就算很大的了。不但沒法跟中國比，也沒法和同時期的印度和中東的城市比。但是歐洲城市有著世界上其他地方城市沒有的特點，那就是「自治」，根據上述文字，請回答下列問題：

