  stem: 西元313年羅馬皇帝君士坦丁簽署了著名的「米蘭詔令」，它是一條關於宗教寬容的詔令。詔令承認基督教徒與其他異教徒一樣具有同等的信仰自由權，從此基督教成為羅馬帝國的合法宗教，成了國家政權的精神支柱。在承認基督教的地位後，324年，君士坦丁恢復了羅馬帝國的統一，並成為羅馬帝國的獨裁统治者。325年，君士坦丁在尼西亞主持召開了「全世界大會」的宗教會議，制定了所有基督徒都必須遵奉的信作：聖子基督是永恆的，與聖父、聖靈是同體的。請問根據以上文字，下列敘述何者正確？
