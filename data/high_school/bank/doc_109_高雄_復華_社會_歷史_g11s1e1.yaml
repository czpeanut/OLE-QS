  stem: 漢撒同盟最初主要以皮草、蜂蜜、鹹肉、木材等森林地帶的特產做為貿易商品，之後逐漸將鯡魚、鱈魚、穀物和銅鐵等礦產也納入貿易的範圍。西元1350年以後，呂北克和漢堡因為鹽醃鯡魚大量輸出歐洲各地而賺取了巨大的財富，這兩個都市成為漢撒同盟的要角，也加深了漢撒同盟的團結。在鼎盛時期，參加漢撒同盟的都市多達兩百個以上，漢撒同盟擁有自己的陸海軍可與國王和諸侯對戰，支配了北海和波羅的海的商業圈。紡織品的主要產地法蘭德斯地區，也因為位處北海、波羅的海貿易圈和地中海貿易圈的中心而有繁榮的發展，以上敘述，可以說明下列哪一件事實？
