- id: doc_111_台北_松山_數學_數B_g11s1e2_s3_4
  section: 3
  number: 4
  type: fill
  page: 2
  stem: 對數不等式 log（x＋1）＋log（2x－1）＞1－log2，x 的範圍為＿＿＿＿。
  answer:
  - x＞$\frac{3}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: 'log（x＋1）＋log（2x－1）＞1－log2

    ⇒ log〔（x＋1）（2x－1）〕＞log5 ⇒ （x＋1）（2x－1）＞5

    ⇒ $2x^{2}$＋x－6＞0 ⇒ （2x－3）（x＋2）＞0 ⇒ x＞$\frac{3}{2}$或 x＜－2

    又 x＋1＞0 且 2x－1＞0 ⇒ x＞－1 且 x＞$\frac{1}{2}$

    故 x 的範圍為 x＞$\frac{3}{2}$

    $5.9^{x－1}$＝$\left( \frac{1}{3} \right) ^{-x-1}$ ⇒ $3^{2（x－1）}$＝（$3^{－1}$）$^{－x－1}$ ⇒ 2（x－1）＝－（－x－1）

    ⇒ 2x－2＝x＋1 ⇒ x＝3

    故交點坐標為（3，$9^{2}$），即為（3，81）

    6.$\log _{\frac{1}{7}}35$＝$\frac{\log 35}{\log \frac{1}{7}}$＝$\frac{\log (5\times 7)}{\log 7^{-1}}$＝$\frac{\log 5+\log 7}{-\log 7}$＝$\frac{1-\log 2+\log 7}{-\log 7}$＝$\frac{1-a+b}{-b}$＝$\frac{a-b-1}{b}$

    7.$\frac{1}{2}$ logy＝1 ⇒ logy＝2 ⇒ y＝$10^{2}$

    代入 $x^{－3}y^{\frac{3}{2}}$＝1 得 $x^{－3}$×$10^{3}$＝1 ⇒ $x^{－3}$＝$10^{－3}$ ⇒ x＝10

    故$\frac{x-y}{10}$＝$\frac{10-100}{10}$＝－9

    8.設半衰期為 T 年

    3＝192×$\left( \frac{1}{2} \right) ^{\frac{180}{T}}$ ⇒ $\frac{1}{64}$＝$\left( \frac{1}{2} \right) ^{\frac{180}{T}}$ ⇒ 6＝$\frac{180}{T}$ ⇒ T＝30

    故半衰期為 30 年

    9.設可樂與酸雨的氫離子濃度分別為 x、y 莫耳／公升

    ⇒ $\begin{cases}4.5 =-\log y\ldots \ldots \ldots \ldots \ldots ① \\ 2.5 =-\log x\ldots \ldots \ldots \ldots \ldots ②\end{cases}$，②－①得 logy－logx＝－2

    ⇒ $\log \frac{y}{x}$＝－2 ⇒ $\frac{y}{x}$＝$10^{－2}$＝$\frac{1}{100}$

    故為$\frac{1}{100}$倍

    10.m＝7 代入得 logE＝4.8＋1.5×7＝15.3 ⇒ E＝$10^{15.3}$＝$10^{0.3}$×$10^{15}$

    ∵E＝b×$10^{n}$ ∴b＝$10^{0.3}$，n＝15

    又 b＝$10^{0.3}\approx10^{0.3010}\approx10^{log2}$＝2

    故數對（b，n）＝（2，15）'
