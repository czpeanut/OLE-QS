  explanation: '$\left( \frac{1}{4} \right) ^{2x-1}$＝$16\sqrt{2}$ ⇒ （$2^{－2}$）$^{2x－1}$＝$2^{4}$×$2^{\frac{1}{2}}$ ⇒ －2（2x－1）＝4＋$\frac{1}{2}$

