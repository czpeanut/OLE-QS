  stem: 右圖表示函數 y＝k×$a^{x}$＋b 的圖形，其中 k，a，b 為常數， 試選出正確的選項。
  options:
  - label: A
    content: a＞1
  - label: B
    content: 0＜a＜1
  - label: C
    content: b＜0
  - label: D
