  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_111_台北_松山_數學_數B_g11s1e2/s2_1_f1.png
    crop:
      page: 1
      rect:
      - 450.4
      - 613.2
      - 564.3
      - 713.1
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：圖形隨 x 變大而增加，故 a＞1

    (B) ╳：同(A)

    (C) ○：因漸近線由 x 軸（y＝0）下移至 y＝－1

    所以 b＝－1

    (D) ╳：x＝0 代入得 y＝k＋b ⇒ －1＜k－1＜0 ⇒ 0＜k＜1

    (E) ○：同(D)

