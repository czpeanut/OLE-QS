- id: doc_111_台北_松山_數學_數B_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 試選出 a＝$3\sqrt{3}$、b＝$\left( \frac{1}{9} \right) ^{-0.5}$、c＝0、d＝$\sqrt[4]{3}$四數的大小關係。
  options:
  - label: A
    content: a＞b＞d＞c
  - label: B
    content: a＞c＞d＞b
  - label: C
    content: a＞d＞c＞b
  - label: D
    content: a＝d＞c＞b
  - label: E
    content: d＞a＞b＞c
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 'a＝$3\sqrt{3}$＝3×$3^{\frac{1}{2}}$＝$3^{\frac{3}{2}}$＞0

    b＝$\left( \frac{1}{9} \right) ^{-0.5}$＝（$3^{－2}$）$^{－0.5}$＝$3^{1}$＞0

    d＝$\sqrt[4]{3}$＝$3^{\frac{1}{4}}$＞0

    又$\frac{3}{2}$＞1＞$\frac{1}{4}$且底數 3＞1 ⇒ a＞b＞d＞c

    故選(A)'
- id: doc_111_台北_松山_數學_數B_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 一份試卷共有 20 題單選題，每題有 4 個選項，其中只有一個選項是正確答案。假設甲生以隨機猜答的方式回答此試卷，且各題猜答方式互不影響。試估計甲生全部答對的機率最接近下列哪一個選項？（已知 log2$\approx$0.3010）
  options:
  - label: A
    content: $10^{－12}$
  - label: B
    content: $10^{－14}$
  - label: C
    content: $10^{－16}$
  - label: D
    content: $10^{－18}$
  - label: E
    content: $10^{－20}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '全部答對的機率為$\left( \frac{1}{4} \right) ^{20}$＝$2^{－40}$

    $log2^{－40}$＝－40 log2$\approx$－40×0.3010＝－12.04

    ⇒ $2^{－40}\approx10^{－12.04}$

    故選(A)'
- id: doc_111_台北_松山_數學_數B_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 班佛定律表示：財務報表中的數據首位數字為 a 的比例約為$\log \left( 1+\frac{1}{a} \right)$。試問財務報表中首位數字為 4 或 5 或 6 或 7 的比例總共約為多少？（已知 log2$\approx$0.3010）
  options:
  - label: A
    content: 20 ％
  - label: B
    content: 30 ％
  - label: C
    content: 40 ％
  - label: D
    content: 50 ％
  - label: E
    content: 60 ％
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '所求為$\log \left( 1+\frac{1}{4} \right)$＋$\log \left( 1+\frac{1}{5} \right)$＋$\log \left( 1+\frac{1}{6} \right)$＋$\log \left( 1+\frac{1}{7} \right)$

    ＝$\log \left( \frac{5}{4}\times \frac{6}{5}\times \frac{7}{6}\times \frac{8}{7} \right)$＝log2$\approx$0.3010＝30.1 ％

    故選(B)'
- id: doc_111_台北_松山_數學_數B_g11s1e2_s2_1
