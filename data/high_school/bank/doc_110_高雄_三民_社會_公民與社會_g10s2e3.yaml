  group_stem: '2020年3月，司法院的憲法法庭討論通姦罪及相關條文是否違憲。憲法法庭上，正反兩方主要的爭點聚焦在： 一、通姦罪究竟在處罰及保護什麼？是否有用刑罰懲處的必要？ 二、通姦罪的告訴人可以撤回對配偶的告訴而不必同時撤回對相姦人（即外遇對象）的告訴，這會有怎樣的問題？

    關於這兩大爭議，憲法法庭上幾個人的發言如下： 甲：國家也難用公權力保障家庭的美滿，因此很難認為有此條規範就可避免家庭的不和諧，嚇阻大家不要外遇。 乙：除非社會變化極大，不應該更動通姦罪，多數民意也反對廢除通姦罪。 丙：婚姻和性自主都是個人自由，不應再以刑法手段將社會集體道德價值強加於個人自由之上，藉由民事賠償即可能彌 補當事人損失。 丁：刑訴第239條允許告訴人可僅撤回對配偶的告訴，是為了維護家庭和諧，而單獨對相姦人提告，能達到僅處罰相姦 人的效果。 戊：女性配偶撤回對男性配偶的告訴仍通常是基於經濟壓力而選擇原諒。因此該規定是基於早期夫權社會中的刻板印 象，並針對性別而為的差別待遇。'
