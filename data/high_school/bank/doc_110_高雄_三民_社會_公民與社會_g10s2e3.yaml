  stem: 民國100年臺灣社會爆發食物違法添加「塑化劑」的重大事件，引發各界重視。業者小華於民國100年5月因在食物中添加有害人體的「塑化劑」遭檢察官起訴。後因立法院認為原法律之處罰過輕，遂進行修法，對於違法者之處罰刑度由原來的三年以下有期徒刑，提高為七年以下有期徒刑，並自100年6月起生效。假設法院於同年8月就小華的行為判處其有期徒刑四年之刑罰，此判決之適法性為何？
  options:
  - label: A
    content: 合法，判決時新法已經生效，法官必須依據新修訂的法律審判
  - label: B
    content: 合法，法律本允許法官對於情節重大之犯罪酌量加重法定刑度
  - label: C
    content: 違法，因為在本案例法官應該依據行為人行為當時之法律審判
  - label: D
    content: 違法，此一判決未考慮社會觀感，不符合新法加重刑度的精神
