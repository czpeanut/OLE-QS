  explanation: 依《刑法》第1條罪刑法定原則（禁止溯及既往）及第2條從舊從輕原則，犯罪之處罰以行為時之法律為準，行為後修法加重刑度者不得溯及既往適用。小華於100年5月行為時法定最重刑度為3年以下有期徒刑，法院不得適用6月生效之新法判處4年有期徒刑，該判決違法。答案選(C)。
