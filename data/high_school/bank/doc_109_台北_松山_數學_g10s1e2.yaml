- id: doc_109_台北_松山_數學_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 坐標平面上，已知圓 C：（x－8）$^{2}$＋（y－6）$^{2}$＝9，請選出圓 C 上有幾個點與原點 （0，0）的距離為整數值。
  options:
  - label: A
    content: 7 個
  - label: B
    content: 10 個
  - label: C
    content: 12 個
  - label: D
    content: 14 個
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '圓 C 的圓心 M（8，6），半徑 r＝3

    圓 C 上的點與 O（0，0）的距離最小值＝$\overline{OM} -r$＝10－3＝7

    最大值＝$\overline{OM} +r$＝10＋3＝13

    $\Rightarrow$圓 C 上的點與 O 的距離是整數值可能為 7、8、9、10、11、12、13，

    且分別有 1、2、2、2、2、2、1 個點

    共有 12 個點

    故選(C)'
- id: doc_109_台北_松山_數學_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 坐標平面上，已知圓 C 的圓心為（0，0）且半徑為 2，若直線 L 與圓 C 相交，則下列哪個圖形必定與直線 L 相交。
  options:
  - label: A
    content: x＝0
  - label: B
    content: y＝0
  - label: C
    content: （x－2）$^{2}$＋$y^{2}$＝16
  - label: D
    content: $x^{2}$＋$y^{2}$＝3
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '因為（x－2）$^{2}$＋$y^{2}$＝16 的圖形區域涵蓋了圓 C（圓心（0，0），半徑 2）整個圖形，

    故直線 L 與圓 C 相交，必也與（x－2）$^{2}$＋$y^{2}$＝16 相交

    故選(C)'
- id: doc_109_台北_松山_數學_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 坐標平面上，下列哪個不等式組的解為右圖中陰影部分（包含邊界）。
  options:
  - label: A
    content: $\begin{cases}3x\geq y \\ 4x -3y\geq 12 \\ 2x +3y\leq 6\end{cases}$
  - label: B
    content: $\begin{cases}3x\geq y \\ 4x -3y\leq 12 \\ 2x +3y\leq 6\end{cases}$
  - label: C
    content: $\begin{cases}3x\leq y \\ 4x -3y\geq 12 \\ 2x +3y\geq 6\end{cases}$
  - label: D
    content: $\begin{cases}3x\leq y \\ 4x -3y\geq 12 \\ 2x +3y\leq 6\end{cases}$
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_109_台北_松山_數學_g10s1e2/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 448.2
      - 511.8
      - 563.05
      - 652.45
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '令圖中陰影部分為區域 R

    (1) R 在 3x＝y 的右側$\Rightarrow$R 在 3x$\geq$y 半平面內

    (2) R 在 4x－3y＝12 的左側$\Rightarrow$R 在 4x－3y$\leq$12 半平面內

    (3) R 在 2x＋3y＝6 的左側$\Rightarrow$R 在 2x＋3y$\leq$6 半平面內

    由(1)、(2)、(3)得所求不等式組為$\begin{cases}3x\geq y \\ 4x -3y\leq 12 \\ 2x +3y\leq 6\end{cases}$

    故選(B)'
- id: doc_109_台北_松山_數學_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 坐標平面上，已知圓 C：（x＋2）$^{2}$＋（y－1）$^{2}$＝10，直線 $L_{1}$：x－3y－5＝0，直線 $L_{2}$：x－3y＝0，請選出正確的選項。
  options:
  - label: A
    content: 圓 C 與直線 $L_{1}$ 相切，圓 C 與直線 $L_{2}$ 相割
  - label: B
    content: 圓 C 與直線 $L_{1}$ 相割，圓 C 與直線 $L_{2}$ 相切
  - label: C
    content: 圓 C 與直線 $L_{1}$ 相切，圓 C 與直線 $L_{2}$ 相切
  - label: D
    content: 圓 C 與直線 $L_{1}$ 相割，圓 C 與直線 $L_{2}$ 相割
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '圓 C：（x＋2）$^{2}$＋（y－1）$^{2}$＝10 的圓心 M（－2，1），半徑 r＝$\sqrt{10}$

    (1) M 與 $L_{1}$ 的距離 d（M，$L_{1}$）＝$\frac{| -2-3-5 |}{\sqrt{1^{2}+(-3)^{2}}}=\sqrt{10}$＝r

    $\Rightarrow$圓 C 與直線 $L_{1}$ 相切

    (2) M 與 $L_{2}$ 的距離 d（M，$L_{2}$）＝$\frac{| -2-3 |}{\sqrt{1^{2}+(-3)^{2}}}=\frac{\sqrt{10}}{2}$＜r

    $\Rightarrow$圓 C 與直線 $L_{2}$ 相割

    故選(A)'
