  stem: 坐標平面上，設圓 C 的圓心在直線 L：6x－5y－17＝0 上，若圓 C 與直線 $L_{1}$：3x－4y＋6＝0 及 $L_{2}$：3x－4y－8＝0 皆相切，則圓 C 的方程式為＿＿＿＿。【答案請用「圓的標準式（x－h）$^{2}$＋（y－k）$^{2}$＝t」的形式表示】
