  stem: 坐標平面上，若方程式 a（$2x^{2}$＋xy－x）＋b（$x^{2}$－xy＋x）－3xy＋$6y^{2}$－9x＋12y－24＝0 的圖形為一圓，則此圓的半徑為＿＿＿＿。
  answer:
  - $\sqrt{6}$
  answer_status: verified
  answer_source: answer_key
  explanation: 'a（$2x^{2}$＋xy－x）＋b（$x^{2}$－xy＋x）－3xy＋$6y^{2}$－9x＋12y－24＝0

    $\Rightarrow$（2a＋b）$x^{2}$＋（a－b－3）xy＋$6y^{2}$＋（－a＋b－9）x＋12y－24＝0

    因方程式的圖形為一圓$\Rightarrow\begin{cases}2a +b =6 \\ a -b -3 =0\end{cases}\Rightarrow\begin{cases}a =3 \\ b =0\end{cases}$

    $\Rightarrow$方程式：$6x^{2}$＋$6y^{2}$－12x＋12y－24＝0

    $\Rightarrowx^{2}$＋$y^{2}$－2x＋2y－4＝0$\Rightarrow$（x－1）$^{2}$＋（y＋1）$^{2}$＝6

    $\Rightarrow$圓的半徑為$\sqrt{6}$'
