- id: doc_109_台北_松山_數學_g10s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 坐標平面上，若三直線 $L_{1}$：ax＋y－10＝0，$L_{2}$：2x－y＝0，$L_{3}$：x＋3y＋7＝0 無法圍成一個三角形，則實數 a 值可能為何？
  options:
  - label: A
    content: '12'
  - label: B
    content: $\frac{1}{3}$
  - label: C
    content: $-\frac{2}{3}$
  - label: D
    content: －2
  - label: E
    content: －12
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$L_{1}$、$L_{2}$、$L_{3}$ 無法圍成三角形

    (1) $L_{1}$//$L_{2}\Rightarrow\frac{a}{2}=\frac{1}{-1}\Rightarrow$a＝－2

    (2) $L_{1}$//$L_{3}\Rightarrow\frac{a}{1}=\frac{1}{3}\Rightarrow$a＝$\frac{1}{3}$

    (3) $L_{1}$ 過 $L_{2}$ 與 $L_{3}$ 的交點（－1，－2）

    $\Rightarrow$－a－2－10＝0$\Rightarrow$a＝－12

    故選(B)(D)(E)'
