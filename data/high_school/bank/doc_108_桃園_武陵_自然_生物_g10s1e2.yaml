  - label: D
    content: 亞孟買血型個體的ABO血型，基因型與表現型並不相符
  group_stem: '<u>佳霏</u>的血型是A型，先生<u>健雄</u>的血型是B型。兩人生出來的孩子血型是O型，與兩人都不同。血型這種遺傳特性，是如何決定的呢？DNA上有很多的基因，控制ABO血型的等位基因有三種類型，其中$I^{A}$與$I^{B}$的基因產物是具有活性的酵素，可分別產生抗原A與抗原B，而等位基因i的基因產物則不具有酵素活性，因此不合成抗原。

    ABO血型系統有一種亞型，稱為亞孟買血型（約每一萬人中至少有一人），是一種容易被誤判為O型的ABO亞血型。一般的常規檢驗中紅血球與抗A血清反應為A型；與抗B血清反應為B型；兩者皆有反應為AB型；反之為O型，亞孟買血型的紅血球檢驗類似O型，必須做進一步的檢驗，方可知正確的血型為何。血型檢驗還應做「血清反應試驗」做為輔助的判定。

    當血球反應為O型，但血清反應的anti-A或anti-B反應較弱時，則必須懷疑是否為亞孟買血型或其它ABO亞型，此時可加做紅血球上的H抗原檢測，H抗原為A、B抗原的前驅物，正常血型的紅血球均含H抗原，亞孟買血型因為缺乏H抗原，故即使有$I^{A}$或$I^{B}$，仍無法順利產生抗原A及抗原B；因此若H抗原檢測無反應，則可以強烈懷疑是亞孟買血型。若是亞孟買血型的人需要緊急用血時，由醫師視情節輕重決定是否緊急輸用檢驗結果符合的血液；或必須輸用亞孟買血型的紅血球濃厚液。'
