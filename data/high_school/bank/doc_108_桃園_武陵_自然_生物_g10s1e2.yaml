- id: doc_108_桃園_武陵_自然_生物_g10s1e2_s4_51
  section: 4
  number: 51
  type: single
  page: 6
  stem: 關於<u>山中伸彌</u>的iPS細胞，下列敘述何者正確？
  options:
  - label: A
    content: iPS細胞是利用骨髓幹細胞植入轉錄因子後製成
  - label: B
    content: iPS細胞可受精後發育成小鼠
  - label: C
    content: iPS細胞具有多功能分化能力
  - label: D
    content: iPS細胞與胚胎幹細胞一樣會有道德爭議問題
  group_stem: '身體內大部分都是已經分化完全的細胞，例如皮膚、肌肉、神經細胞等，這些體細胞不會再轉變為其他細胞。什麼是幹細胞？幹細胞和已分化完全的體細胞有顯著的差異性，具有分裂及分化能力，在體內受刺激後，分化成特定的細胞。幹細胞可依發育的時期分為兩類：胚胎幹細胞和成體幹細胞。

    人類的受精卵，在受精後24至30小時，一邊分裂一邊由輸卵管往子宮移動。過程中，受精卵進行有絲分裂而使細胞數目增加，但受精卵的體積並未增加，因此細胞愈分愈小。細胞間逐漸出現一個充滿液體的空腔，這些細胞團會被分成兩個區塊，分別是外面的滋養層及中央的內細胞團。滋養層將來會形成部分的胎盤，內細胞團則會形成胚胎。內細胞團的細胞即一般所謂的胚胎幹細胞，為全能幹細胞，有潛能發展為新個體的能力。

    成體幹細胞存在於胎兒和成人的組織器官中，這些多功能性幹細胞，無法形成新個體，但可被誘導分化成身體各種組織細胞。另外還有造血幹細胞、神經幹細胞，則為多潛能性幹細胞，只能分成特定種類的細胞。由於這些幹細胞具備分化與細胞複製的能力，也成為再生醫學領域最被期待的細胞來源。

    2006年<u>日本</u> <u>山中伸彌</u>教授將四種轉錄因子植入皮膚細胞，使皮膚細胞成為幹細胞，有多功能分化能力，並可持續增生分裂。利用成人的體細胞，逆轉細胞分化程序，變回幹細胞型態後，再誘導使其分化為肌肉、神經與骨骼細胞等。<u>山中伸彌</u>教授將成體的體細胞成為誘導性多功能幹細胞（Induced Pluripotent Stem Cell，簡稱iPS細胞）的新技術在2012年獲得諾貝爾生理醫學獎。

    iPS不是源自胚胎，所以在細胞來源取得的道德爭議較小，<u>日本</u> <u>京都大學</u>也在2018年7月底宣布將使用iPS治療帕金氏症，成為全球首例。或許iPS細胞能成為未來細胞療法、器官移植、再生醫學、新藥開發等現代醫學治療的新契機，但是目前仍有安全疑慮，因為幹細胞有可能形成腫瘤並引發免疫反應。'
  tags:
    unit:
      code: BI-1-1-3
