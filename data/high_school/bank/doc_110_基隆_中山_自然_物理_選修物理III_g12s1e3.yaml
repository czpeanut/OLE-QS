  stem: 聲納裝置向水中出的超聲波，遇到障礙物（如魚群，潛艇，礁石等）後被反射，測出從發出超聲波到接收到反射波的時間及方向，即可算出障礙物的方位；雷達則向空中發出電磁波，遇到障礙物後被反射，同樣根據發射電磁波到接收到反射波的時間及方位，即可算出障礙物的方位。超聲波與電磁波相比較，下列敘述哪些正確？（應選2項）
