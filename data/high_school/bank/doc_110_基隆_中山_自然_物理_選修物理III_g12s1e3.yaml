  - label: A
    content: 能階的概念，由馬克士威首先提出
  - label: B
    content: 能階間的能量是連續的
  - label: C
    content: 每一能階的能量是固定的，所以能量不能交換
  - label: D
    content: 每一能階的能量是固定的，但能量是可以交換，只是能量變化是不連續的
  - label: E
    content: 能階的觀念僅適用於熱輻射，不適用於光
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
