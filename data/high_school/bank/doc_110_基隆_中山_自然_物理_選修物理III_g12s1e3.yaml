  section: 1
  number: 2
  type: single
  page: 1
  stem: 如圖所示，一單頻聲波於長管中傳播，空氣分子產生了疏部與密部，下列敘述何者正確？
  options:
  - label: A
    content: 疏部中點空氣的壓力為零
  - label: B
    content: 不論疏部或是密部，空氣的壓力都相同
  - label: C
    content: 疏部中點空氣分子對其平衡位置之位移為最大
  - label: D
    content: 不論疏部或是密部，聲波前進的速率都相同
  - label: E
    content: 密部中點與疏部中點的空氣分子振動速率皆為零
