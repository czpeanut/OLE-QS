- id: doc_110_基隆_中山_自然_物理_選修物理III_g12s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 聲波在空氣柱内重疊時，可以形駐波。考慮聲波在一端開口、一端閉口的空氣柱內所形的駐波，並將聲波視為傳遞空氣分子位移變動的縱波時，下列關於駐波特性的敘述，何者正確？
  options:
  - label: A
    content: 相鄰兩波節的間距為一個波長
  - label: B
    content: 相鄰波節與波腹的間距為$\frac{1}{ 4 }$波長
  - label: C
    content: 在閉口處發生建設性疊加
  - label: D
    content: 該駐波是由沿相同方向前進的兩波互相重疊而成
  - label: E
    content: 開口處為波節
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
- id: doc_110_基隆_中山_自然_物理_選修物理III_g12s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列關於自然頻率與共振的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 大部分的樂器都有共鳴箱，其目的在藉箱內空氣的共鳴，增強聲音的強度
  - label: B
    content: 將振動的甲音叉接近原來沒振動的乙音叉，結果乙音叉亦隨之振動，這是因為兩音叉的頻率相同
  - label: C
    content: 在沒有外來的擾動之下，一個物理系統能以一定的頻率持續振動，則此頻率稱為自然頻率
  - label: D
    content: 如果可以依物理系統振動的自然頻率加入能量，可以增加該物理系統的振幅
  - label: E
    content: 兩發音體要發生共鳴現象必須兩者振動幅度相同
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
