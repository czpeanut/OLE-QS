  section: 1
  number: 11
  type: single
  page: 2
  stem: 將光投射在金屬表面其產生光電子，再利用磁場引導並選出具有相同速度之電子，使其通過單狹縫後，投射於能夠探測電子的屏幕上，經過一段時間的紀錄，發現在屏幕上各點累積的電子數目，其分布呈現射條紋。欲解釋上述的實驗現象，下列敘述何者最適當？
