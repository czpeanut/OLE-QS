  number: 9
  type: single
  page: 2
  stem: 普朗克的假設可由能階的概念來理解。根據量子力學，只有在某些特定能量，系統方能穩定存在，這一系列像階梯狀的能量，稱為該系統的能階。下列關於能階的敘述，何者正確？
