- id: doc_110_基隆_中山_自然_物理_選修物理III_g12s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 高處工地不慎掉落物件，施工人員以擴音器大聲通知下方人員閃躲。若不考慮空氣阻力，則下列敘述哪一項正確？（地表重力加速度g＝9.8 m／$s^{2}$)
  options:
  - label: A
    content: 音調愈高，聲音傳播速率愈大
  - label: B
    content: 音量愈大，聲音傳播速率愈大
  - label: C
    content: 聲音傳播速率與音調及音量均無關
  - label: D
    content: 物體自100層（每層高3.3 m)樓處，由靜止自由落下，到達地面時的速率，已快過聲速
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
