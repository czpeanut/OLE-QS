    content: 這兩種波都既可以在介質中傳播，也可以在真空中傳播
  - label: B
    content: 超聲波與電磁波傳播時都向外傳遞了能量
  - label: C
    content: 空氣中的聲波屬於縱波，電磁波為橫波，在傳播時，每一個週期內均向前傳播了一個長波
  - label: D
    content: 利用超聲波與電磁波反射測量距離時，反射回來的波動能量與頻率皆與原波相同
  - label: E
