  - label: C
    content: 能量守恆只有在實驗室中才成立，所以生活中的能量總有被用完的一天，因此能源危機是真的
  - label: D
    content: 既然能量是守恆的，所以能量是用不完的，能源危機危言聳聽而已
  - label: E
    content: 不同形式的能量在轉換過程中，其總值會減少，故有能源危機
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
