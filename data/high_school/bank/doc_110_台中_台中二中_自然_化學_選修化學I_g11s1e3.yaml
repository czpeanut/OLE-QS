  type: single
  page: 1
  stem: 有A、B、C三種純物質，其蒸氣壓與溫度的關係圖如附圖，則下列各項判斷何者正確？
  options:
  - label: A
    content: 正常沸點：A＞B＞C
  - label: B
    content: 同溫時蒸氣壓大小：A＜B＜C
  - label: C
    content: 莫耳汽化熱大小：A＞B＞C
  - label: D
    content: 分子間引力大小：A＞B＞C
  - label: E
    content: 正常沸點時，蒸氣壓大小：A＝B＝C
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) A（$34^{ }$℃）＜B（$78^{ }$℃）＜C（$100^{ }$℃）； (B) $34^{ }$℃時圖中畫一垂直線，故知A＞B＞C；
    (C)沸點高汽化熱大，故由(A)知C＞B＞A； (D)沸點高分子間引力大，故由(A)知C＞B＞A； (E)正常沸點時，A，B，C蒸氣壓均等於760 mmHg。故選(E)。
