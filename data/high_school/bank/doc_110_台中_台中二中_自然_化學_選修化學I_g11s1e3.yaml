  stem: 定溫下，在密閉容器中含液態水與水蒸氣，呈平衡狀態時，下列敘述何者正確？
  options:
  - label: A
    content: 容器體積愈小，水蒸氣壓愈大
  - label: B
    content: 平衡溫度愈低，水蒸氣壓愈大
  - label: C
    content: 加入液態水，則水蒸氣壓增大
  - label: D
    content: 加入一些木炭粉可使蒸氣壓降低
  - label: E
    content: 水之蒸發速率與水蒸氣的凝結速率相等
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A)水蒸氣壓不變；(B)水蒸氣壓愈低；(C)水蒸氣壓不變；(D)水蒸氣壓不變；(E)平衡時之條件之一。故選(E)。
