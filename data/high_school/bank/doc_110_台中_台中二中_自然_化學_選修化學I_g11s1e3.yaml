- id: doc_110_台中_台中二中_自然_化學_選修化學I_g11s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 將 8.70 克硫酸鉀（式量＝174）溶於 100 克水中，溶液的凝固點為－2.325 ℃，水的$K_{f}$＝1.86 ℃／m，此時硫酸鉀的解離百分率為多少
    ％？
  options:
  - label: A
    content: '65'
  - label: B
    content: '75'
  - label: C
    content: '85'
  - label: D
    content: '90'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: Δ$T_{f}$＝$iK_{f}C_{m}$＝ [ 1＋( x＋y－1 )α]$K_{f}C_{m}$ 2.325＝1.86 × $\frac{
    8.7 }{ 174 }$ × $\frac{ 1000 }{ 100 }$ × [ 1＋( 2＋1－1 )α] ∴ 1＋2α＝$\frac{ 2.325
    }{ 1.86 }$ × $\frac{ 174 }{ 87 }$＝2.5 ∴α＝0.75＝75％，故選(B)。
- id: doc_110_台中_台中二中_自然_化學_選修化學I_g11s1e3_s1_8
  section: 1
