- id: doc_110_台中_台中二中_自然_化學_選修化學I_g11s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 血液的平均滲透壓為7.7大氣壓。下列相關的敘述何者<u>錯誤</u>？（人的體溫為$37^{ }$℃）
  options:
  - label: A
    content: 為病患靜脈注射純葡萄糖水溶液時，葡萄糖濃度最好約為0.3 M
  - label: B
    content: 若靜脈點滴水溶液中，只含等莫耳數的葡萄糖及食鹽，食鹽濃度最好約為0.1 M
  - label: C
    content: 將人的紅血球置入0.2 M NaCl水溶液中（$37^{ }$℃），紅血球會皺縮
  - label: D
    content: 剛吃飽時，血液的平均滲透壓會略升高，隨後會再降低
  - label: E
    content: 靜脈注射時，注射溶液之滲透壓若大於血球的滲透壓，血球會吸收水分
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) TV＝$C_{M}$RTi ⇒ 7.7＝$C_{M}$ × 0.082 × ( 37＋273 ) × 1 ⇒ $C_{M}$≒0.3（M）；
    (B)等莫耳數$C_{6}H_{12}O_{6}$與NaCl，故二者濃度相同 ⇒ 設x（M） $^{ }$π＝(Σ$C_{M}$i) RT ⇒ 7.7＝(
    x＋1＋x × 2 ) × 0.082 × ( 37＋273 ) ∴ x≒0.1 M； (C) $C_{M}$i＝0.2 × 2＝0.4 M＞0.3 M ⇒
    故水由細胞往血液滲透 ⇒ 紅血球萎縮； (D)吃飽血液濃度高，隨之逐漸降低 ⇒ 故π亦相同； (E)水由血球往血液滲透，∴血球水份會降低。故選(E)。
