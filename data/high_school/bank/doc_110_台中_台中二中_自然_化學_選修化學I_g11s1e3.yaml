  stem: 露點又稱為露點溫度，是指大氣中所含水蒸氣在氣溫下降時，開始冷凝為水之溫度。凝結的水飄浮在空中稱為霧，而沾在固體表面則稱為露。甲、乙兩城市氣溫分別為$35^{
    }$℃、$25^{ }$℃，兩地水蒸氣壓與水的飽和蒸氣壓曲線如附圖。下列敘述，哪些正確？
  options:
