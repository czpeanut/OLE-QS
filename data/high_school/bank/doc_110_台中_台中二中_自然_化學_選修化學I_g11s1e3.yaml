- id: doc_110_台中_台中二中_自然_化學_選修化學I_g11s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 葡萄糖90.0克，溶於200克水中，則1 atm下此糖水的凝固點為若干℃？（水的$K_{f}$＝$1.86^{ }$℃／m）
  options:
  - label: A
    content: －4.65
  - label: B
    content: －3.72
  - label: C
    content: －2.79
  - label: D
    content: －1.86
  - label: E
    content: －0.93
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: Δ$T_{f}$＝$iK_{f }C_{m}$＝1.86 × $\frac{ 90 }{ 180 }$ × $\frac{ 1000
    }{ 200 }$ × 1＝4.65 ∴$T_{f}$＝0－4.65＝－4.65（℃）。故選(A)。
