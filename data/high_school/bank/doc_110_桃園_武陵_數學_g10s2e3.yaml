- id: doc_110_桃園_武陵_數學_g10s2e3_s3_2
  section: 3
  number: 2
  type: single
  page: 2
  stem: '現實生活中，三角測量所應用的領域廣泛，以「航海」為例，三角測量可用來計算海上目標物在航行期間難以實際測量的數據。如下圖，有一筆直東西向海岸線（以上方為正北方），北方為大海，岸邊有兩座觀測站 A、B，兩觀測站相距 9 公里。（此為示意圖，不一定代表真實的長度或比例）

    今有一艘漁船於海上航行，全程固定朝某一方位前進，航行期間，觀測站對漁船方位進行兩次測量。

    第一次觀測時，A、B 觀測站測得漁船方位分別為東 30° 北、正北方。

    第二次觀測時，A、B 觀測站測得漁船方位分別為東 75° 北、北 45° 西。

    若想根據以上資料求得漁船的前進方向及距離，試回答以下問題：

    (1) 第一次觀測時，漁船與 A 觀測站間的距離為多少公里？（單選，2 分）

    (2) 若第二次觀測時，「A 觀測站與漁船連線」及「漁船前進路線」所夾的角為θ （0°＜θ＜180°），試求θ＝？（3 分）'
  options:
