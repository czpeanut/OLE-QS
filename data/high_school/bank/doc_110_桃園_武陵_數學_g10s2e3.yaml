- id: doc_110_桃園_武陵_數學_g10s2e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 試問下列敘述哪些正確？
  options:
  - label: A
    content: 若 cos100°＝k，則 tan（－260°）＝$\frac{\sqrt{1-k^{2}}}{-k}$
  - label: B
    content: 若θ為第四象限角，則$\frac{\theta}{2}$為第二象限角
  - label: C
    content: 若 sinθ＝sin$\varphi$，則θ、$\varphi$ 是同界角
  - label: D
    content: 若θ$_{n}$＝n×45°，n 為正整數，且 1 ≤ n ≤ 100，則有 13 個可能的 n 值可使θ$_{n}$ 為第一象限角
  - label: E
    content: 若標準位置角θ的始邊為 x 軸正向，終邊上一點 P 的坐標為 P（x，y），且 sinθ＝$\frac{3}{5}$，則 y＝3
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：由 cos100°＝k 可知 tan100°＝$\frac{\sqrt{1-k^{2}}}{k}$

    則 tan（－260°）＝tan100°＝$\frac{\sqrt{1-k^{2}}}{k}$

    (B)╳：不一定，反例：θ＝660° 為第四象限角

    但$\frac{\theta}{2}$＝330° 為第四象限角

    (C)╳：不一定，反例：θ＝30°，$\varphi$＝150°

    sin30°＝sin150°＝$\frac{1}{2}$，但 30°，150° 不是同界角

    (D)○：若為第一象限角，則 n＝8k＋1，k 為 0 或正整數

    又 1 ≤ n ≤ 100，得 k＝0，1，2，……，12

    即 n＝1，9，17，……，97，共 13 個 n 值

    (E)╳：不一定，反例：$P\left( \frac{4}{5} , \frac{3}{5} \right)$，則 sinθ＝$\frac{3}{5}$，但 y＝$\frac{3}{5}$

    故選(D)'
