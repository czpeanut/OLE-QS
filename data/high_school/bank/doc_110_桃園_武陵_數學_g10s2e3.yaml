- id: doc_110_桃園_武陵_數學_g10s2e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 下列哪些選項的條件有可能成立？
  options:
  - label: A
    content: △ABC 中，sinA、sinB、sinC 均小於$\frac{1}{2}$
  - label: B
    content: △ABC 中，若$\overline{AC}$＝4，$\overline{AB}$＝6，∠B＝30°，則△ABC 為鈍角三角形
  - label: C
    content: △ABC 中，若$\overline{AC}$＝4，sinA＝$\frac{1}{3}$，sinB＝$\frac{1}{2}$，恰可決定唯一的△ABC
  - label: D
    content: △ABC 中，若$\overline{AC}$＝4，$\overline{BC}$＝2，sinA＝$\frac{1}{3}$，恰可決定唯一的△ABC
  - label: E
    content: 可找到△ABC 滿足$\overline{AC}$＝4，$\overline{BC}$＝2，cosA＝$\frac{1}{3}$
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：當∠A＝160°，∠B＝∠C＝10°

    則 sinA、sinB、sinC 均小於$\frac{1}{2}$，滿足條件

    (B)○：由正弦定理得$\frac{4}{\sin B}$＝$\frac{6}{\sin C}$⇒ sinC＝$\frac{3}{4}$，可取銳角 C 使得 sinC＝$\frac{3}{4}$

    ∵sinC＝$\frac{3}{4}$＜$\frac{\sqrt{3}}{2}$＝sin60°

    ∴∠C＜60°，∠A＞90°

    故△ABC 為鈍角三角形

    (C)╳：不一定，∠B 可能為 30° 或 150° 皆有可能

    (D)╳：由正弦定理得$\frac{2}{\sin A}$＝$\frac{4}{\sin B}$⇒ sinB＝$\frac{2}{3}$

    若∠B 為銳角，必有△ABC

    若∠B 為鈍角，cosB＝$-\frac{\sqrt{5}}{3}$＞$-\frac{\sqrt{3}}{2}$＝cos150° ⇒ 90°＜∠B＜150°

    又 cosA＝$\frac{2\sqrt{2}}{3}$＞$\frac{\sqrt{3}}{2}$＝cos30° ⇒ 0°＜∠A＜30°

    ⇒∠C 為銳角，亦有△ABC

    故不唯一

    (E)╳：sinA＝$\frac{2\sqrt{2}}{3}$，由正弦定理得$\frac{2}{\sin A}$＝$\frac{4}{\sin B}$

    ⇒ sinB＝$\frac{4\sqrt{2}}{3}$＞1（不合）

    故選(A)(B)'
