    content: $3\sqrt{3}$公里
  - label: B
    content: $6\sqrt{3}$公里
  - label: C
    content: $\frac{9}{2}$公里
  - label: D
    content: 3 公里
  - label: E
    content: $\frac{9\sqrt{2}}{2}$公里
