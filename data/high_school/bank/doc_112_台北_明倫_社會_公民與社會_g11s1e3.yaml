  section: 2
  number: 46
  type: multiple
  page: 11
  stem: 由於經濟全球化的發展，各國政府常因經貿、環保、人權、貧窮等問題而摩擦，「反全球化」論述與社會運動也隨之興起。下列敘述哪些屬於「反全球化」的主張？
  options:
  - label: A
    content: 跨國公司為追求更大利潤，常利用所擁有的政治及經濟影響力逃避其對環境與生態應盡的維護責任
  - label: B
    content: 跨國公司在低度開發國家所進行的投資雖帶來就業機會，但也出現剝削當地勞工基本權益的問題
  - label: C
    content: 如果擴大世界銀行、國際貨幣基金（IMF）等組織的影響力，能緩和窮國與富國間的財富分配不公問題
  - label: D
    content: 為加速經濟成長並提高國民所得，低度開發國家應對外資開放並減少行政干預，落實自由經濟政策
  - label: E
    content: 為保護本土產業、防止外國商品的傾銷，低度開發國家應加強執行維護智慧財產權的相關法令
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (C)應當會加劇窮國與富國之間的貧富差距。(D)此為支持全球化者的主張。(E)應當不是智慧財產權的相關法令，而是公平交易的相關法規，與反全球化較無關聯。故本題選(A)(B)。
