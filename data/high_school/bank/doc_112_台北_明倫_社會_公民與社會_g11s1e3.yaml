  stem: 世界貿易組織（WTO）允許會員國之間簽訂自由貿易協定（FTA），在不提高對外貿易壁壘的前提之下，FTA 締約會員國之間可以進一步降低關稅與消除貿易壁壘。請問 FTA 之簽訂排除了 WTO 哪項原則之適用性？
  options:
  - label: A
    content: 多邊談判原則
  - label: B
    content: 關稅原則
  - label: C
    content: 國民待遇原則
  - label: D
    content: 最惠國待遇原則
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，在不提高貿易壁壘的 WTO 原則下，成員國可以互相簽訂 FTA，此屬於(D)為最惠國待遇原則。(A)彼此簽訂 FTA 不提高貿易障礙，與多邊談判原則無直接關係。(B)彼此簽訂 FTA 不提高貿易障礙，與貿易障礙以「關稅」為主的關稅原則無直接關係。(C)彼此簽訂 FTA 不提高貿易障礙，與進口品與國產品在國內的待遇無直接關係。
