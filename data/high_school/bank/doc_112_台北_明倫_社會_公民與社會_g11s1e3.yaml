  stem: 肉類是提供蛋白質的來源之一，並為食品加工業提供原物料，是馬來西亞非常重要的產業。多年來，牛肉和羊肉等肉品消費呈增長趨勢，但馬來西亞國內生產卻停滯不前甚至萎縮。為了克服這個問題，馬來西亞政府開始實行包括肉類和肉類產品等農產品的進口配額，當中主要被影響的是中國的肉類出口市場。在其他條件不變的情況下，關於上述政策可能產生的影響，以下說明有哪幾項正確？
