  stem: '甲國為一鑽石與寶石生產國，考量國內的天然資源有其限制，故與另一個國家乙國進行國際分工。一個月後，乙國因國內政治情勢不穩停止生產，由丙國接替乙國與甲國一起分工。各國在單位時間內的產量如附表，請問以下敘述何者最為正確？

    | 單位（萬顆） | 甲國 | 乙國 | 丙國 |

    | --- | --- | --- | --- |

    | 鑽石 | 12 | 12 | 10 |

    | 寶石 | 6 | 4 | 10 |'
  options:
  - label: A
    content: 若僅甲、乙兩國分工，是由甲國負責生產寶石
  - label: B
    content: 分工方式是依機會成本，甲國生產鑽石與寶石的成本皆較低
  - label: C
    content: 甲國與丙國分工時，丙國生產鑽石具比較利益
  - label: D
    content: 乙國因國內政治情勢不穩，不具任何比較利益
  answer:
  - A
