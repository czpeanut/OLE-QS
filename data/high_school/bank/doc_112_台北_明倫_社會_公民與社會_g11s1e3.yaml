  stem: '某國經濟部長進行施政報告，強調國內生產毛額 GDP 連續成長，國民平均所得上升，勞動參與率持續提升，失業率創新低等數據，藉以顯示施政成效卓著。同一時間，該國某民間倡議組織也公布兩項統計數據加以批評：

    第一、該國生育率持續下降，而女性在婚後退出勞動市場，以承擔家庭照顧工作的比例正逐年攀升。

    第二、雙薪家庭夫妻分攤家務勞動時間的比例，有男性下降而女性上升的情形。據此，該組織批評政府的施政報告有很大的盲點，缺乏性別主流化觀點，並認為該國政府應該效法經濟合作暨發展組織（OECD）國家將「托育公共化」列為施政方針，由國家和社會共同承擔生育及教養責任，而非傳統僅由個人或家庭承擔，如此一來不但可以提升女性勞動參與率，出生率也會上升。

    該組織第一項數據顯示女性對 GDP 之貢獻程度並未妥當呈現出來，其理由是 GDP 在計算時，並未包含下列何者？'
  options:
