  explanation: (C)取消進口配額，提升競爭的結果，可能會對居於劣勢的馬來西亞生產者有十分不利的影響。(E)中國的肉品減少出口至馬來西亞，會使中國肉品價格下跌，增加中國國內消費者剩餘，但會減少生產者剩餘。故本題選(A)(B)(D)。
