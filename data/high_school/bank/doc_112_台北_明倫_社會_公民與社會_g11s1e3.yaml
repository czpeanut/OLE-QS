  stem: 碳排放造成全球暖化，使全球地理政治學的權力分布改變。由於環北極國家的氣溫提高，變得適宜居住與耕作；當極地和冰川「解凍」後，將出現大量的天然氣、石油與水等重要資源；北極冰原融化後，將出現一條歐亞之間的重要航道，這些都推升了環北極國家的國際勢力與地位。關於上文所述，下列解讀何者正確？
  options:
  - label: A
    content: 環北極國家讓熱帶國家承受外部成本，應賠償熱帶國家
  - label: B
    content: 環北極國家享受熱帶國家提供的外部效益，應補貼熱帶國家
  - label: C
    content: 環北極國家應補貼碳排放國，碳排放國應賠償熱帶國家
  - label: D
    content: 環北極國家應賠償熱帶國家，碳排放國應補貼熱帶國家
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從題文無法看出有造成哪些外部成本。(B)不考量其他因素，單純從外部效益來看，應當是補貼碳排放國。但實際上碳排放使北極融冰，雖然產生一些效益，但所造成的全球暖化屬於外部成本，不應當補貼此行為。(C)(D)單純從經濟學角度看，環北極國家因為碳排放國的碳排放，得到外部效益，應當需要補貼碳排放國，但碳排放國使熱帶國家受到溫室效益的損失，應當賠償熱帶國家。故本題選(C)。
