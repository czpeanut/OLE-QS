  stem: '附表為 2023 年甲國、乙國與丙國之各項統計指標，下列何者正確？

    |  | 甲國 | 乙國 | 丙國 |

    | --- | --- | --- | --- |

    | 國內生產毛額 | 500 萬美元 | 600 萬美元 | 400 萬美元 |

    | 國民所得毛額 | 600 萬美元 | 400 萬美元 | 500 萬美元 |

    | 固定資本消耗 | 200 萬美元 | 50 萬美元 | 100 萬美元 |

    | 總人口數 | 500 人 | 300 人 | 400 人 |'
  options:
  - label: A
    content: 甲國的國民所得與丙國相同
  - label: B
    content: 丙國的國民所得低於乙國
  - label: C
    content: 乙國的平均每人國民所得最低
  - label: D
    content: 甲國的平均每人國民所得最高
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 依據題文資訊，(A)國民所得為國民所得毛額，再扣除固定資本消耗，因此甲國的國民所得為 600－200＝400，丙國為 500－100＝400。(B)乙國的國民所得為 400－50＝350，因此丙國的國民所得高於乙。(C)(D)甲國平均每人國民所得為 400÷500＝0.8 萬美元、乙國：350÷300＝1.17 萬美元、丙國：400÷400＝1 萬美元。因此乙國最高、甲國最低。故本題選(A)。
