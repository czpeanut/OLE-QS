  stem: 約翰是居住在臺灣的美籍人士，去年 6 月他在臺北市訂購一部由日本進口到臺灣的日本製嶄新汽車，且於當年 10 月完成交易。關於約翰此一交易行為對各國去年度統計數值所帶來的影響，下列何項描述正確？
  options:
  - label: A
    content: 美國的進口不變，臺灣的 GNP 增加
  - label: B
    content: 日本的出口增加，臺灣的 GDP 減少
  - label: C
    content: 臺灣的出口減少，日本的 GNP 增加
  - label: D
    content: 日本的出口增加，美國的 GDP 不變
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)美籍人士雖為我國的常住居民，但在我國訂購日本進口車，雖增加了民間消費，但也增加了進口，因此對我國 GNP 無影響。(B)日本的出口會增加無誤，但此交易行為雖增加了民間消費，但也增加了進口，因此對我國 GDP 無影響。(C)此舉對我國的出口沒有影響。故本題選(D)。
