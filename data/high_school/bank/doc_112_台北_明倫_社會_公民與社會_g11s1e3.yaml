    content: 地下經濟
  - label: B
    content: 外部成本與效益
  - label: C
    content: 生活品質之變動
  - label: D
    content: 非市場交易之產出
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題文可知，該文主要是在談許多女性婚後轉為家務勞動，導致勞參率下降的情況，可知女性對 GDP 的貢獻沒有被呈現出來，主要是因為家務勞動屬於非市場交易。故本題選(D)。與(A)(B)(C)無關。
