  stem: 世界貿易組織（WTO）是多邊貿易體系，旨在創造一個自由、公平的國際貿易環境，期能透過貿易提升開發中與低度開發國家的經濟發展，為了使 WTO 能運作順利，成立之初即制定了規範準則。下列敘述與 WTO 基本原則的對應關係，何者最為正確？
  options:
  - label: A
    content: 中國毛巾傾銷後，損及我國毛巾產業，被我國課徵進口 204 ％關稅：不歧視原則
  - label: B
    content: 日本課徵俄羅斯伏特加之稅率超過國產清酒相同濃度之稅率：公平競爭原則
  - label: C
    content: 中國電信產業與周邊會員國相互支援電信業務：開放市場原則
  - label: D
    content: 已開發國家可課徵關稅稅率不可高於 5.48 ％：公平競爭原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)屬於公平競爭原則。(B)違反不歧視原則。(D)關稅減讓原則。故本題選(C)。
