  page: 1
  stem: '2022 年 1 至 10 月臺英雙邊貿易總額為 55.15 億美元，英國自臺灣進口 38.39 億美元，出口至臺灣 16.76 億美元。相關資訊如下：

    | 我國出口至英國的主要產品 | 無線電航行輔助器具、固態非揮發性儲存裝置、機器零件、二輪腳踏車、蜂巢式網路／其他無線網路電話、鋼鐵製螺釘及螺栓、攜帶式自動資料處理機、一般體能運動、體操或競技比賽用物品及設備以及其他手工具 |

    | --- | --- |

    | 英國出口至我國的主要產品 | 威士忌酒、太空船、小客車、製造半導體裝置或積體電路之機器零件 |

    關於臺、英國際貿易之相關敘述，下列何者正確？'
  options:
  - label: A
    content: 臺灣生產無線網路電話機會成本應該優於英國
  - label: B
    content: 英國在生產威士忌上皆具絕對利益與比較利益
  - label: C
    content: 臺灣對英國雙邊貿易處於順差，因此臺灣的消費者與生產者皆得利
  - label: D
    content: 英國對臺灣雙邊貿易處於逆差，因此與臺的貿易不利於其經濟福祉
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)臺灣出口無線網路電話，機會成本較低也是較優。(B)英國出口威士忌酒至臺灣，可知應當具有比較利益，但不一定具有絕對利益。(C)(D)我國對英國貿易屬於貿易順差，而英國對我國的貿易屬於逆差。但彼此都有出口與進口的部分，對彼此部分的生產者與消費者均有利，也有不利之處。故本題選(A)。
