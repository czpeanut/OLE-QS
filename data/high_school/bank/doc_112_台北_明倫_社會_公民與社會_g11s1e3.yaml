  stem: 日本與歐盟於 2018 年 7 月中簽署《日本與歐盟經濟夥伴關係協定》（EPA）日本幾乎廢除對歐盟所有商品的進口關稅，尤其對乳酪等乳製品；歐盟則將對日本商品廢除約 99 ％品項的進口關稅，包括協議生效後第 8 年起，將廢除對日本汽車課稅，以及協議一生效就立刻廢除對汽車零件的關稅。對上述雙方經貿發展的概況，下列描述哪一項正確？
  options:
  - label: A
    content: 非歐盟國家亦能比照 EPA 會員國而直接受益
  - label: B
    content: 雙方撤銷關稅的做法符合 WTO 中的「不歧視原則」
  - label: C
    content: 雙方撤銷關稅後的貿易利得在自由貿易下必定相同
  - label: D
    content: 此協定將使雙方的生產者剩餘皆能增加
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此為歐盟與日本之間的協議，不適用其他國家。(B)自由貿易原則。(C)需視日本與歐盟之間的貿易情形，不一定完全相同。(D)雙方出口產業的生產者，均可因為關稅的減低，增加生產者剩餘。故本題選(D)。
