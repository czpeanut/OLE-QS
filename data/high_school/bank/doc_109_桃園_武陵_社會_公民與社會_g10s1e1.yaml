questions:
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 福利國家是指政府透過各項社會福利措施，積極保障人民享有各項基本生活條件。下列何種政策作為最符合其概念？
  options:
  - label: A
    content: 修法將參與公民投票的年齡資格下調至18歲
  - label: B
    content: 通過各項減稅法案以減輕民眾的租稅負擔
  - label: C
    content: 讓勞動市場自由運作不加干預以提升經濟效率
  - label: D
    content: 擴大施打公費疫苗以促進國民的健康
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 根據英國廣播公司（BBC）報導，世界有少數幾個國際郵務系統裡找不到的特殊國家，主要因戰爭衝突而造成的結果，例如：三個歐洲獨立小國：阿布哈茲（Abkhazia）、聶斯特河東岸（Transdniestrian）和北賽普勒斯土耳其共和國（Turkish Republic of Northern Cyprus）。它們在地圖上占有一席之地、擁有自己的政府管理事務且政局穩定、人民也有正常的生活，如依法納稅及受教育等，唯獨不被國際承認。根據上文敘述，三個歐洲獨立小國身為一個「國家」卻地位特殊，與下列哪一因素有關？
  options:
  - label: A
    content: 未被納入國際郵務的系統中
  - label: B
    content: 國土面積及其人口數量過少
  - label: C
    content: 欠缺對外獨立且平等的特性
  - label: D
    content: 沒有創造出屬於自己的文字
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 近年來，為了積極保障各族群的文化權發展，除了將本土語吉（閩南語、客家語、原住民族語）列入中小學的正式課程外，2018年立法院通過《國家語言發展法》強調尊重我國語言的多元性，並且追求各語言之平等。這些政策制定與質施的目的為何？
  options:
  - label: A
    content: 有效強化特定族群的優勢地位
  - label: B
    content: 提升國家認同度以降低歧異性
  - label: C
    content: 保有並發展各族群文化的權利
  - label: D
    content: 保障各族群文化的媒體傳播權
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 我國某航空公司空服員為要求合理的勞動條件而發動罷工，最終成功迫使資方讓步，也帶動後續的機師罷工及其他航空公司的勞權抗爭。上述所涉及的公民權利類型，與下列敘述何者最類似？
  options:
  - label: A
    content: 因應人口高齡化現象故要求政府健全長期照護機制
  - label: B
    content: 爭取讓18歲青年擁有投票資格以促進其公共參與
  - label: C
    content: 為維護民族固有的狩獵傳統因此鬆綁保育法規限制
  - label: D
    content: 重症病患呼籲政府讓安樂死合法化以減少病痛折磨
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 英國在2016年6月23日公投選擇脫離歐盟，隨後英國政府與歐盟陸續開啟多場談判，內容包含未來貿易關條、公民權等重要議題。其中就公民權議題，雙方協議讓兩地公民權利獲得保障。因為根據《歐洲聯盟條約》規定，歐盟公民得以在其所居住的其他歐盟國家行使與該國公民相同的選舉權與被選舉權，以及向歐洲議會請願的權利。以上案例凸顯在國際往來頻繁的現代，對傳統主權國家產生什麼影響？
  options:
  - label: A
    content: 人民以直接民主的形式影響政府政策將成常態
  - label: B
    content: 「人民」不再是主權國家組成必須具備的要素
  - label: C
    content: 各國人民間在政治權利上的衝突將較以往頻繁
  - label: D
    content: 對內最高且對外不容干涉的特性逐漸受到挑戰
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 首度改編國產電玩的電影《返校》於2019年9月上映，劇情描述翠華中學美術老師兼任輔導教師張明暉在校內儲藏室創辦了讀書會閱讀「禁書」，成員包括音樂老師殷翠涵、學生魏仲廷等人。不過，當持國民黨政府以防止共產主義滲透等理由頒布《戒嚴令》，路上隨處可見「保密防諜，人人有責」、「嚴禁組黨結社」等標語及廣播，組織地下讀書會甚至可能構成「叛亂罪」。依據上述訊息判斷，《戒嚴令》限制了張明暉等人的何種公民權利？
  options:
  - label: A
    content: 自由權
  - label: B
    content: 文化權
  - label: C
    content: 政治權
  - label: D
    content: 社會權
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 某福利國家有7%的獨居人口長期受孤獨之苦，該國政府因而決定設立新部門，專責處理獨居者因缺乏社會互動而產生的身心健康需求，也獲得不少民眾在網路留言支持。從國家存在的目的而言，以下四項支持的意見，何者最能彰顯該國設立獨居者專責部門的理由？
  options:
  - label: A
    content: 國家應解決獨居者身心失衡問題以維護社會秩序
  - label: B
    content: 國家應保障人民基本權利並提升人民的生活品質
  - label: C
    content: 國家應盡力滿足人民的需求才能提高統治正當性
  - label: D
    content: 國家應盡力確保孤獨者不會遭受他人漠視與排擠
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 小閔的公民課程上到英國學者馬歇爾（Thomas H. Marshall）對公民權利的研究，卻不慎打瞌睡，發現筆記只抄了一半如附表。若繼續完成該表格，下列權利性質與權利內涵的配對，何者正確？
  options:
  - label: A
    content: 民權：指公民的基本權利，如選舉權、被選舉權等
  - label: B
    content: 政治權：指參與政治生活的權利，如言論自由、集會結社自由等
  - label: C
    content: 社會權；指享有權利保障，如訴訟權、財產權等
  - label: D
    content: 民權：指個人的自由權利，如人身自由、結社自由等
