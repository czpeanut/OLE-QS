  stem: 根據上文，遠洋外籍漁工的勞動環境顯示其基本權利未受保障。在上文中<u>並未提及</u>哪個權利？
  options:
  - label: A
    content: 政治權
  - label: B
    content: 生存權
  - label: C
    content: 社會權
  - label: D
    content: 財產權
  group_stem: ◎ 自前約有2萬多名非本國籍漁工在臺從事遠洋漁業，由於捕撈須長時間工作、漁船安全設備不足，加上未受充足職前訓練，聯合國曾將遠洋漁工評為工殤風險第二高之職業。 漁業署當前以《境外僱用非我國籍船員許可及管理辦法》管理遠洋漁工，主張遠洋漁業工作地屬於境外，不適用「各國」或「本國」《勞基法》基本工資規定，因此即使漁業署規定境外漁工每月薪資不得低於450元美金（約新臺幣13,320元），但實際上缺乏完善查核機制。 宜蘭縣漁工職業工會（漁工工會）認為，靠港日遙遙無期的討海生活，妥善的醫療照護在生病時幾近奢求；且在面對證件遭扣押、償還仲介費之壓力，漁工往往受制於權力不對等，即便被剝削卻也無力自救。遠洋漁船是國土的延伸，漁工的勞動條件及保障應比照國內的勞動法規管理，而漁業署應加強執行業務及公權力，因為漁工即使非我國國民，也是個活生生的人。
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_17
  section: 1
  number: 17
  type: single
  page: 3
  stem: 根據上文判斷漁業署及漁工工會立場，下列敘述何者較符合？
  options:
  - label: A
    content: 漁業署認為遠洋漁船雖為我國領土之延伸，但距離遙遠公權力執行不易
  - label: B
    content: 漁業署認為境外工作的漁工，非屬我國權利主體故不適用我國法律
  - label: C
    content: 漁工工會認為非法漁工導致政府控管困難，強調應循合法管道就業
  - label: D
    content: 無論遠洋漁船是否為我國領土之延伸，漁工工會主張合理的工作環境應該是普遍的人權
