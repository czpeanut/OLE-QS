  stem: 兩年一度的移工大遊行登場，2018年的遊行訴求是「政策共同決定權」，同時公布2017年9月首度發起的移工公投結果，均有破萬人同意家庭看護工有勞動法令保障、自由轉換雇主等訴求。臺灣移工聯盟指出，這次移工公投是非公民第一次透過投票的方式告訴政府，移工也要對於跟自身相關的政策有表達意見的權利，這些票數可以代表非公民的聲音，要求政府應該正視並面對這些訴求。 五位同學對此發表意見，哪些人的說法較正確？
  options:
  - label: A
    content: 小玉：移工雖非我國國民，其基本人權仍應受保障
  - label: B
