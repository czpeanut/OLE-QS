  stem: 上文提及哪些因素使得民主體制慢慢崩壞？
  options:
  - label: A
    content: 人民錯誤地民主政治化約成選舉活動
  - label: B
    content: 政治菁英推動由上而下的威權統治
  - label: C
    content: 強調代表人民、排除反對意見的民粹主義興起
  - label: D
    content: 政府官員沒有動力拉近專業與民意間的鴻溝
  - label: E
    content: 人民對改變政治現狀感到無力卻也不信任政治菁英
  group_stem: ◎ 某篇文章整理著名政治學者漢娜．鄂蘭（Hannah Arendt）對於當代民主政治的觀察： 這種陌生感展現在一般公民的錯信之中，使公民誤以為，只要選出代議士，讓他們更專業且有效率地替我們凝聚意見、形成判斷與決策，由他們將「權力」具體實現於各制度、政策層面即可。漸漸地，本來就對政治權力缺乏經驗的公民，對政治的程序不再有興趣，撒手不管，甚至也不再形成自己的政治意見與判斷了。不僅如此，原本是被授權、代為執行任務的「專業人士」也被神聖化，多數的公民開始出現「自己的聲音不可能會被聽見、也不會被在乎」「政治菁英才是擁有權力、可以決定政治及政府發展之人」的想法，上下從屬關係悄然而生。 對立法權失落的公民則將希望轉向行政權。但是，政府在理性化、科層化，以及節約與效率要求的壓力下，也無力再對決策過程與發展原委進行解釋，不得不從上向下、以命令式的方式來面對人民。 長期缺席於公共場域的「市井小民」悲觀地相信，沒錢沒勢的自己，對政治無計可施，也無力改變。與其攪和在政治這團污泥車裡，還不如三餐溫飽。很想置身於公眾事務之外，卻又無法信任政治菁英、支持他們做出的決策與判斷。 鄂蘭認為，極右派團體及其領導人擅長塑造「我們才與人民站在一起」、「我們是一體」的誘人想像，不問政策而只訴諸道德正確性，宣揚「找回屬於所有人的榮光」等激情的口號，利用公民對代議制的失望，激起他們再次參與政治的渴望。對內，他們採取為了彼此的行動，形成看似和諧，實則模糊不清又空洞的團結感。對外，則以對抗彼此來行動，盡可能地排除與之相抵觸的意見，將其他利益邊緣化。一旦這股勢力不斷膨脹，直到銳不可擋時，便是民主岌岌可危之際了。 ——改寫自江伯瑩〈公民們，你患了政治躁鬱症嗎？〉
