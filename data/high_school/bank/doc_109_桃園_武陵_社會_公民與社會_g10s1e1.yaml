  stem: 紐西蘭為世界公認的「多元文化模範國」。羅馬不是一天造成，毛利母語政策之所以舉世矚目必須歸功於四點： 第一，<u>〔乙〕</u>是大多數移民社會各族群之間和解共生的第一步，透過對歷史真相的挖掘、承認過去的錯誤、避免重蹈覆轍的制度設計和真誠的和解。有了諒解才能發展真正的族群平等觀念、彼此尊重欣賞，而不只是政治口號。 第二，紐西蘭母語政策最成功、最重要的關鍵，在於「扭轉毛利語在母語人士自己心中的地位」，甚至改變其他大多數非毛利母語公民對毛利語的態度、肯定毛利語背後所代表的價值。1982年的「語言巢制度」（Te Kohanga Reo）更是舉世聞名，這個制度專門針對出生到6歲的學齡前兒童設計，結合母語教學與公共托嬰功能。年輕父母上班前於早上9點至下午3點將幼兒送到部落的「集會所」，由該地區會說族語的耆老們進行全毛利語教育。 第一所雙語學校（毛利／英語）於1977年成立，1990年更增設到17所之多。1987年也出現「全毛利語小學」（Kura Kaupapa Mãori），主流小學中的雙語課與浸潤班（immersion program），亦陸續開課，讓毛利語具備和英語相等的教育功能，能夠用來傳授各種科目的知識，並透過新生代身上的「同儕效應」創造出一整個肯定母語價值、雙語並重的世代，來避免舊時代在他們父母輩中烙下的「語言階級感」繼續複製、以擺脫母語自我矮化的窠臼心態。 第三，紐西蘭最了不起的成就，恐怕就是賦予原民語言與殖民者語言「實質上」同等的法律地位了，放眼世界，目前沒多少國家能夠說到做到。1987年的「毛利語言法」（Mãori Language Act），正式承認毛利語成為紐西蘭的官方語言。基於國人對毛利文化的認同與尊重，在國際體育競賽裡，觀眾一定會發現紐西蘭國歌會唱兩次：英語、毛利語版各一次，且對紐西蘭國民來說，毛利語版國歌無論如何聽起來比英語版更讓人動容，無論懂不懂毛利語都能哼上幾句，可見毛利語代表的不但是紐西蘭的文化高度與國際魅力，更是凝聚紐西蘭國家認同的象徵。此外，毛利戰舞（Haka）本來是毛利人出草前的儀式，後變成各項國際賽事中紐西蘭隊伍賽前跳毛利戰舞以提高士氣的傳統，經紐西蘭政府主動爭取後，國際大賽事協會也修改規定，同意給予這項紐西蘭傳統尊重（不只是毛利人傳統），大大提升紐西蘭國際能見度。 第四，紐西蘭不斷拉高原住民事務曆級、設立專賣政府機構以利各項原住民政策有系統地執行，當中也包括專為母語政策設立的次級機構。1906年設立的「本土部」（Native
    Department），經過歷年的擴充之後，管轄範圍括及族群和解、原民土地政策、原民勞工權益、同屬南島語系的太平洋島移民在紐事務等，並於1992年由「毛利發展部」（Te Puni Kõkiri, the Ministry of Mãori Development）取而代之，行使其職權。 「毛利語言委員會」（Mãori Language Commission）負責指導毛利語言的議題、認證翻譯者、創造新單字、透過語言營隊活動（language camps）推廣母語教學。媒體方面，第一個毛利語部落電臺也於1986年成立；到了1995年，紐西蘭全國已有23個電臺以毛利語或雙語放送，很多毛利兒童尤其喜歡觀看他們最喜愛的毛利電視節目「Pukana」。每年七月慶祝的「毛利語週」（Mãori Language Week），可以說是紐西蘭落實民主多元價值的體現，最主要反應在學校教育的課綱裡；每年到了這個時候，不分英語、毛利語或雙語學校，都會擬定為期一週的毛利文化及主題性的毛利語教學，長期下來也讓毛利語從少數族群的家庭語言，搖身一變，變成每個紐西蘭公民的共同文化財，成為紐西蘭在國際化時代最有特色的活招牌。 ——改寫自蔡崇峰〈島國，母語，國際化：淺談紐西蘭的母語政策〉
