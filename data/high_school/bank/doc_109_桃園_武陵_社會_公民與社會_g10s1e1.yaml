    content: 無論哪個時期，支持統一的民眾都超過20%
  - label: C
    content: 國臺辦認為臺灣民眾僅極少數追求臺獨，與政大調查結果相符
  - label: D
    content: 民眾統獨立場分歧，幾十年來統獨立場比例沒有變化
  group_stem: 資料一： 2020年蔡總統就職演講中關於兩岸關係內容摘錄：「面對複雜多變的兩岸情勢，過去四年，我們盡力為兩岸和平穩定，做出最大的努力，也獲得國際社會的肯定；我們會持續努力，也願意跟對岸展開對話，為區域安全，做出更具體的貢獻。我要再次重申『和平、對等、民主、對話』這八個字。我們不會接受北京當局，以『一國兩制』矮化臺灣，破壞臺海的現狀，這是我們堅定不移的原則。我們也會持續遵循中華民國憲法，與兩岸人民關係條例，來處理兩岸事務。這是我們維持臺海和平穩定現狀的一貫立場。」 對此，中國國務院臺灣辦公室（國臺辦）則回應：「臺灣一些政客製造兩岸對立，阻撓兩岸交流合作，企圖從地理和法理上切割臺灣與大陸的關係，他們加緊勾連外部勢力破壞臺海和平。（佔臺灣人口）極少數的臺獨分裂分子鼓噪所謂『修法』、『公投』，圖謀『法理臺獨』。這些都嚴重損害臺灣同胞福祉，嚴重損害中華民族根本利益，嚴重威脅臺海和平穩定。 中國統一是中華民族偉大復興的歷史必然，是任何人任何勢力都無法阻擋的。大陸堅持『和平統一、一國兩制』基本方針，願意為和平統一創造廣闊空間，但絕不為各種形式的臺獨分裂活動留下任何空間。」
