- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 被視為「非典型政治人物」的川普最後贏得大選，依上文推測其獲得選民支持的重要原因最可能為何？
  options:
  - label: A
    content: 美國經濟發展停滯，富豪出身的川普帶給百姓發財的希望
  - label: B
    content: 美國選民否定全球暖化現象，反對環保主張也不支持綠能產業的推廣
  - label: C
    content: 美國族群多元對立，川普當選象徵美國白人優越意識並未消失
  - label: D
    content: 藍領勞工認為華盛頓菁英所制定的政策與百姓需求脫節，自己的處境不被理解
  group_stem: '◎ 以下為針對美國2016年的總統大選所蒐集的相關資料，請根據資料，以回答問題。

    資料一： 麥克道爾郡（McDowell County）郡民：「（這裡）曾經有很多工作機會。有伐木業、煤礦場…修車廠等等。（現在）煤礦場沒了，伐木業完了。」一位目前以拾荒為生的郡民說。希拉蕊的計畫是協助美國煤礦業轉型為綠能產業，這讓煤曠工人高度不安。「很多煤礦工人被資遣。政府提供他們上學，學習新技能的機會…可是這些人有的已經老了，他們沒辦法上學，有的甚至是文盲。」另一位郡民告訴記者。

    ——摘自英國《衛報》紀錄片《為什麼西維吉尼亞州最窮的郡將希望寄託在川普上》

    （“Why the poorest county in West Virginia has faith in Trump”）片段

    資料二： 他（川普）令許多人作噁的言論如嚴審移民、否定全球暖化、減稅等政策，其實完全針對沉默藍領（指體力勞動階層）白人選民的恐懼而來，…，為了固穩左派基本盤，希拉蕊曾說出：「川普支持者皆是未開化，無可救藥的選民（basket of deplorable）」… 「政治正確」是歐巴馬的王牌。但以此之名，將所有不同於都會區、高教育白領主流價值標籤化，忽視這些想法背後的結構性問題，而一律視為『反智』、『無腦』、『歧視』、『偏激』，其實正與上述形容詞一樣，同樣造成了美國社會上日漸嚴重的對立。 ——摘自侯智元〈我不是川普鐵粉，我只是反對傲慢地解讀民主〉'
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_15
