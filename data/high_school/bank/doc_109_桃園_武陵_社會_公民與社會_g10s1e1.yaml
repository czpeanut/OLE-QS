  stem: 貝都因人是一群在沙漠中以畜養駱駝、逐水草而居等游牧生活為主的阿拉伯人，居住在可移動式的帳篷中，並以氏族部落為單位。目前大約有10萬人居住在科威特境內，這群人在並未取得公民身分的情況下，無法在科威特境內接受國民教育、無法順利取得合法工作、無法參與選舉投票、無法接受完善的醫療照護資源，或是享有因石油資源開採而帶來的各項福利。 在貝都因人為自己與後代權益的持續奮鬥下，1999年科威特前任國家元首薩巴赫頒布了一項法令，提供貝都因人取得公民身分的法源，但限制1年僅有2,000人可申請，使得受益的人仍是少數，目前仍有眾多貝都因人仍無法取得公民身分。據上文，目前仍無法獲得公民身分的貝都因人，無法獲得何種公民權利保障？請寫出兩項並分別舉例說明。
