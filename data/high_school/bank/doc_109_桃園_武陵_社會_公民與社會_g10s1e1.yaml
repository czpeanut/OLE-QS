  group_stem: ◎ 以色列境內猶太裔占人口總數75%，是全球唯一以猶太人為主的國家，阿拉伯裔為第二大群體，約占兩成。然而，2018年7月以色列執政黨以國會多數優勢通過了極具爭議的《民族國家法》，將以色列定義為猶太人民族國家，唯有猶太人具備資格行使民族自決的權利。此外，也將阿拉伯語自官方語言降格為特殊語言，使希伯來語（猶太宗教語言）成為以色列國唯一官方語言。對此以色列阿拉伯裔議員歐德（Ayman Odeh）痛批此乃種族主義，與種族隔離僅一步之遙，以國「民主已死」。
