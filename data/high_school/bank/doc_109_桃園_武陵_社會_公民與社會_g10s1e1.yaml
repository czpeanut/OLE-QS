  - label: C
    content: 花輪：公投屬於政治權，我國政府應正式賦予移工投票的權利
  - label: D
    content: 濱岐：政府的政策決策過程中，應讓相關當事人有參與的機會
  - label: E
    content: 美環：移工可遊行、可向政府表達其意見，這是自由權的實現
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s2_31
