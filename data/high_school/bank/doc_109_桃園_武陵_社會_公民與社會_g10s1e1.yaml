- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 美國一直扮演兩岸關係發展的關鍵角色，且奉行「一個中國政策」。關於此項政策的主要內容與作為，下列敘述何者正確？
  options:
  - label: A
    content: 「一個中國、各自表述」是美國制定臺海政策的基本原則
  - label: B
    content: 反對軍售臺灣，主張和平解決兩岸問題
  - label: C
    content: 與中國大陸的「一個中國原則」相同
  - label: D
    content: 制定《臺灣關係法》維持臺美非官方關係
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 民主精神若能滲透到治理網路之中，則人民可以參與公共事務，透過分析、論證與說理，以說服其他人接受自己的正義訴求，同時也傾聽別人的意見，在比較各方不同的需求後，才有辦法用肯認的態度理解不同於己的差異，並做出判斷。以下哪個作法最符合上述精神？
  options:
  - label: A
    content: 班上要舉辦的期末同樂會，由導師決定買什麼以及規劃什麼活動
  - label: B
    content: 訂便當的時候，以多數決決議一律訂葷食便當以求效率
  - label: C
    content: 學生調查統計學生、家長及老師對於輔導課存廢之意見，提交校務會議討論
  - label: D
    content: 導師在班會課時發起投票，以決定對特定學生的獎懲措施
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某國政局長期紛擾不斷，1990年該國一位政治人物在演說中呼籲：「我國的未來未來只能是一個在不分膚色的基礎上，通過民主選舉而產生的機構來決定，也就是建立一個民主、不分膚色和統一的國家，白人壟斷政權的狀況必須結束。」請問該政治人物演說的內容，與下列哪一項權利保障的主張最吻合？
  options:
  - label: A
    content: 民主國家應該保障多元族群的文化差異
  - label: B
    content: 保障少數族群權益能提升國家國際地位
  - label: C
    content: 保障多元族群的政治平等才能促進國家整合
  - label: D
    content: 民主國家應該保障少數族群的自決權利
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 上文劃線處凸顯了國家對於公民權利保障發揮何項功能？
  options:
  - label: A
    content: 證明人民身分，在國外也能尋求駐外使館幫助
  - label: B
    content: 制定法律，維護社會秩序及解決紛爭
  - label: C
    content: 在國外享有治外法權，無須遵守當地法律
  - label: D
    content: 審發旅客簽證，增加觀光收入以促進經濟
  group_stem: ◎ 華航在COVID-19疫情全球爆發期間，協助政府運送口罩援助各國，卻因英文名稱“CHINA AIRLINES”被誤以為是來自中國的航空，掀起正名爭議。同時，我國護照封面的英文國號也因為包含了“CHINA”字樣，<u>不瞭解兩岸情勢的外國人容易將我國民眾誤當成中國國人，進而使我國民眾在國外遭受刁難，且無法透過當地政府聯繫我國駐外單位提供即時協助</u>，因此也出現了護照「提升臺灣TAIWAN辨識度」之訴求。立法院在2020年7月22日通過華航、護照正名案，外交部於9月初公布新版護照封面樣式如附圖，將“Republic of China”字樣縮小並環繞國徽，將“Taiwan”字樣放大，以凸顯臺灣並增加國際辨識度。 對此，(甲)認為此改變「雖不滿意但尚可接受」，應該有更能代表臺灣意象的設計或徽章；(乙)則不滿地認為政府過於強調意識形態，要凸顯臺灣不一定要縮小中華民國；而(丙)表示不滿意，認為應完全去除“Republic of China”。
  shared_asset: g1_12_13
- id: doc_109_桃園_武陵_社會_公民與社會_g10s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 若甲、乙和丙三人針對中華民國的主權發表看法，下列發言何者與其對新版護照的立場最相符？
  options:
  - label: A
    content: 甲：中華民國於中國內戰時戰敗，中華人民共和國是代表中國唯一合法政府
  - label: B
    content: 乙：中華民國僅為二戰後臺灣的臨時代管政府，臺灣住民有權利公投制憲建國
  - label: C
    content: 丙：目前憲法在大陸地區制定的，應藉由修憲或制定新憲法重新定義主權範圍僅及於臺澎金馬等地
  - label: D
    content: 丙：兩岸互不承認主權、互不否認治權，擱置主權爭議發展雙邊關係
  group_stem: ◎ 華航在COVID-19疫情全球爆發期間，協助政府運送口罩援助各國，卻因英文名稱“CHINA AIRLINES”被誤以為是來自中國的航空，掀起正名爭議。同時，我國護照封面的英文國號也因為包含了“CHINA”字樣，<u>不瞭解兩岸情勢的外國人容易將我國民眾誤當成中國國人，進而使我國民眾在國外遭受刁難，且無法透過當地政府聯繫我國駐外單位提供即時協助</u>，因此也出現了護照「提升臺灣TAIWAN辨識度」之訴求。立法院在2020年7月22日通過華航、護照正名案，外交部於9月初公布新版護照封面樣式如附圖，將“Republic of China”字樣縮小並環繞國徽，將“Taiwan”字樣放大，以凸顯臺灣並增加國際辨識度。 對此，(甲)認為此改變「雖不滿意但尚可接受」，應該有更能代表臺灣意象的設計或徽章；(乙)則不滿地認為政府過於強調意識形態，要凸顯臺灣不一定要縮小中華民國；而(丙)表示不滿意，認為應完全去除“Republic of China”。
