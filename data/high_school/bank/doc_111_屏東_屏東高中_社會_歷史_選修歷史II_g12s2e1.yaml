  stem: 中古後期的義大利，曾規定從外地前來的船隻靠岸之後，船上的人員不能夠直接登陸。請問此規定的背景或因素為何？
  options:
  - label: A
    content: 受到黑死病影響，義大利發展出檢疫的觀念
  - label: B
    content: 兩地間彼此是軍事對抗狀態，欲避免間諜滲入
  - label: C
    content: 這些受管制的人員，應該專指由非洲運來的黑人
  - label: D
    content: 受到當地的宗教影響，對於外來者均視為是巫師
  answer:
  - A
  answer_status: verified
