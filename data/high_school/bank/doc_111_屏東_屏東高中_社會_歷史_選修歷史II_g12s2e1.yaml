  stem: 關於資料當中對於蔗糖的描述，下列何者正確？
  options:
  - label: A
    content: 蔗糖一直是一般人的消費物品
  - label: B
    content: 蔗糖是源自於歐洲本土的商品
  - label: C
    content: 蔗糖最早在歐洲大西洋端種植
  - label: D
    content: 蔗糖在 18 世紀後成為大眾商品
  group_stem: '資料一：歐洲人最早透過十字軍運動（約 11～13 世紀），從穆斯林之處知道如何種植甘蔗、食用蔗糖，並試圖在地中海的克里特島、賽普勒斯等地建立製糖產業。由於產量不多，至 14、15 世紀，糖仍舊是珍稀物資，因而成為歐洲貴族炫富的象徵，他們以能在宴會中擺設用糖、杏仁與杏仁油調製後所做成的「糖雕」來彰顯自己的權力與財富。例如在樞機主教沃爾西就職宴會上就擺出了精美的糖雕作品：「按比例而製的教堂與階梯，猶如巧奪天工的畫作，還有栩栩如生的奇珍異獸與各類人物，放眼望去目不暇給。」這些都顯示在當時蔗糖成為社會階級的表徵，並不是一般人的生活必需品。

    資料二：17 世紀英國征服的殖民地最多，輸入的奴隸也最多；英國人在位處熱帶地區的巴貝多、牙買加等加勒比海上的殖民地，以及更多的蔗糖島上，建立起自己的蔗糖產業。除了銷往其他歐洲國家外，最重要的是英國本土的市場：1660 年，英國國內消費了 1 千大桶；1700 年提升到 5 萬大桶。至 1753 年，進口量已高達 11 萬大桶，蔗糖單位價格的下跌讓英國的蔗糖需求不斷上升。

    資料三：英國經濟歷史學家認為在 1650 年到 1750 年間，英國人均蔗糖消費量的成長幅度很高，遠超過麵包、肉、乳製品。

    【資料出處】資料一、二：改寫自西敏司著，李祐寧譯，《甜與權力：糖—改變世界體系運轉的關鍵樞紐》（臺北：大牌出版，2020），頁 111、314；資料三：改寫自伊莉莎白女王的黑牙齒，CASE 報科學，https://case.ntu.edu.tw/blog/?p＝19235'
  answer:
