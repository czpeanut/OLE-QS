  section: 1
  number: 18
  type: single
  page: 3
  stem: 「防火長城」是中國政府的網路審查制度，2000 年起便實施。多年發展下來，受控管的敏感「詞彙」與「圖像」清單不斷增加。請問上述文字最有可能出現在下列哪篇文章中？
  options:
  - label: A
    content: 統治者對網際網路資訊的審查控管
  - label: B
    content: 媒體出於目的，片面報導部分新聞
  - label: C
    content: 青少年應培養媒體素養與辨識能力
  - label: D
    content: 網際網路對青少年身心發展的影響
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '中國政府的網路審查制度是將受控管的敏感詞彙與圖像全部「清除」，屬於思想與言論的全面嚴格管控，非單針對青少年而已，因此(A)選項較為適宜。

    19.19 世紀的交通革命主要指(C)鐵路與(D)輪船兩項，兩者皆能克服運輸量、季節、移動速度等的限制，但輪船的效用主要在跨洲的移動，且過去為使用風力的帆船來移動，與「畜力」無關，因此可推知史家所指的運輸設施為(C)，非(D)。

    20.16 至 19 世紀間，中南美洲大型農業莊園的勞動主力一直是非洲黑奴，故答案為(A)。

    21.越戰期間，美國陷入叢林戰的泥淖之中，於是空軍為消滅叢林中的越共軍隊而投放大量的落葉劑，造成環境汙染也留下後遺症，(B)為正解。

    22.阿茲提克人相信天花是西班牙人所展示的「超能力」，因此溫順的接受了基督教。由此可知(A)致命病毒對美洲古文明造成衝擊，也助長了西班牙人對中南美洲的控制力。

    23.泰雅族使用在地資源製成肥料的作法，較為可能是傳承祖先的生活經驗與智慧，尊重自然並與之共榮共存，(D)為正確。(A)(B)(C)三者皆無法從題文中看出。

    24.沿海地區最不缺乏的即風與潮汐，因此答案為(B)。核能與天然氣非再生能源，地熱雖屬再生能源，但在沿海地區卻難以開發。

    25.14 世紀後期對歐洲人口造成最大影響的事件為黑死病，(C)為正解。(A) 11 世紀。(B) 11 至 13 世紀。(D)百年戰爭爆發於 14 世紀前期，主要戰場在法國境內，對英格蘭的影響不大。

    26.附圖為 17 世紀時瘟疫醫師的標準防護裝備，其設計概念乃源自黑死病時奠定的檢疫制度基礎，尖嘴面具與手杖皆在避免與患者距離過近而染疫，故答案為(D)。

    27.1848 年英國通過《公共衛生法案》，為第一部以國家力量介入公衛事務的法案，其改革內容包括興建下水道、都市排水、廢棄物排放系統等，(A)為正解。(B) 1860 年代才出現細菌學說。(C)此法案係由國家力量介入公衛事務。(D)應為英國。

    28.(C)為解決日本缺糧問題，要求臺灣能擴大稻米出口，因此總督府針對臺灣原有稻米進行育種與改良，成功培育出的蓬萊米以外銷日本為主，臺人反而以蕃薯籤為主食。

    29.蘇美、馬雅、復活節島等古文明，皆曾有過高度的文化成就，卻都因為人口不斷增加，過度開發導致資源不足而耗竭，終使文明消失，答案為(C)。

    30.「儺」為古代以驅鬼逐疫、酬神納吉的祭祀活動，由官方來主導祭祀活動，自然能有撫慰民心的作用，(D)為正解。'
