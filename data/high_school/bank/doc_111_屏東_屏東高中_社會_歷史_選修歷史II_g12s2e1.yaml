  stem: 1913 年，福特汽車公司發展出創新的組裝方式：改用機械傳送帶運輸零件，工人在傳送帶旁進行組裝的生產線。此方式使組裝底盤所需時間大幅減少了 10 小時，增加生產效率；由於汽車生產的速度加快，連帶導致汽車售價快速下跌。根據上文所述，哪種革新導致福特汽車的生產效率提升以及售價降低？
  options:
  - label: A
    content: 提高專業技工的職業訓練
  - label: B
    content: 標準化流程的生產方式革新
  - label: C
    content: 新能源的取得不易受環境干擾
  - label: D
    content: 動力替代人力及獸力
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為標準化流程的生產方式革新，藉由將整個生產流程細分成數個環節，使工人只需學會某種操作與使用統一規格的零件，以此節省人力與技術的培訓成本，並加快生產速度，使資本的獲利大為提高，故答案為(B)。(A)(C)(D)三者皆無法從題文敘述中看出。
