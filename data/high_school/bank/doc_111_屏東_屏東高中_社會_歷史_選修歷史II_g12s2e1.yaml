  stem: 有關人類以符咒防止鬼魅為亂的現象，下列何者符合東、西方歷史的實際狀況？
  options:
  - label: A
    content: 此現象一般只存於西方中古時期
  - label: B
    content: 屬於東方世界特有的歷史現象
  - label: C
    content: 古代東、西方往往視鬼魅為造成疾病的原因
  - label: D
    content: 符咒在東方可以用來治療疾病，而西方則無這樣的傳統
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 人類以符咒防止鬼魅為亂或治療疾病的現象，在東方與西方皆曾經存在，甚至今日仍有少數地區的人仍保留此傳統，(C)為正解。
