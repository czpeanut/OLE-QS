  - D
  answer_status: verified
  answer_source: answer_key
  explanation: $\begin{cases}x+2y+3z=2 \cdots ① \\ x-z=5\cdots \cdots \cdots \cdots ② \\ 3x+2y+z=a \cdots ③\end{cases}$ ③－①，2x－2z＝a－2 ⇒ x－z＝$\frac{a-2}{2}$ 方程組有解 ⇒ 由②得$\frac{a-2}{2}$＝5 ∴ a＝12 令z＝t，由②得x＝t＋5代入① 得y＝－2t－$\frac{3}{2}$ ∴方程組有無裉多組解 故選(A)(D)。
