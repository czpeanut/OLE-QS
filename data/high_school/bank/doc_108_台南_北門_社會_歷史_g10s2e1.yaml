- id: doc_108_台南_北門_社會_歷史_g10s2e1_s4_4
  section: 4
  number: 4
  type: calc
  page: 3
  stem: '閱讀資料並回答： 資料一：武德（唐高祖年號）七年，始定律令。以度田之制……丁男、中男給一頃，篤疾、廢疾給四十畝，寡妻妾三十畝。若為戶者加二十畝。所授之田，十分之二為世業，八為口分。世業之田，身死則承戶者便授之；口分，則收入官，更以給人。賦役之法；每丁歲入租粟二石。調則隨鄉土所產，綾絹絁（粗綢）各二丈，布加五分之一……凡丁，歲役二旬。若不役，則收其庸，每日三尺。——《舊唐書．食貨志》 資料二：（建中元年）（楊）炎建議新稅法，先計州縣每歲所應費用及上供之數而賦於人，量出以制入。戶無土客，以見居為簿；人無丁中，以貧富為差；為行商者，在所州縣稅三十之一，使與居者均無僥利。居人之稅，秋夏兩徵之。——《資治通鑒》 請問：

    (1)資料一和資料二分別是什麼賦稅制度？(4%)

    (2)唐代的賦稅制度會出現上述的變化主要是因為哪件亂事而造成？(2%)'
