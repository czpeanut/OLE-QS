questions:
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 中國封建時期，家庭依附於家族，家族附屬於宗族，處於嚴格的宗法制度控制下，直到某個時期，宗法制度逐步鬆解，家庭與家族才逐漸從宗族中獨立出來。請問某個時期應為下列何者？
  options:
  - label: A
    content: 夏商時代
  - label: B
    content: 春秋戰國
  - label: C
    content: 漢末三國
  - label: D
    content: 魏晉時期
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某一制度有下列特徵：國家以法令規範人民；政府編列戶籍，有效掌握稅收；官員由中央派任；中央與地方藉文書傳遞訊息。這些特徵與下列何者有關 ？
  options:
  - label: A
    content: 周公制禮作樂
  - label: B
    content: 秦漢推行郡縣
  - label: C
    content: 歐洲實施封建
  - label: D
    content: 印度種姓制度
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 「中國」一詞在取得文化意涵的過程中，華夏民族曾面臨何種挑戰？
  options:
  - label: A
    content: 夷狄也以華夏正統自居
  - label: B
    content: 受到周邊民族的不平等對待
  - label: C
    content: 文化優越感消失殆盡
  - label: D
    content: 夷夏之防逐漸消失
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 武王伐紂。以「小邦周」取代「天邑商」，帶給周人什麼樣的啟示？
  options:
  - label: A
    content: 商王權力有限，周天子加強王權
  - label: B
    content: 商因天命而亡，周人認為天命不可信
  - label: C
    content: 周人不再敬鬼神
  - label: D
    content: 天命靡常，惟德居之
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 越南脫離中國獨立後，歷代政權在中國典章制度的基礎上，結合當地文化，發展出獨特的統治技術。而為使國家更深入基層社會，曾採取何項政策？
  options:
  - label: A
    content: 將地方村社納入行政體系
  - label: B
    content: 以募兵制充實國家軍備
  - label: C
    content: 嚴格執行土地國有化
  - label: D
    content: 實施科田法，掃除地方勢力
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 兩漢期間山東的鄒、魯兩地流行一句俗諺：「遺子黃金滿籯，不如一經。」這裡的「經」指的是哪一類圖書文獻？
  options:
  - label: A
    content: 醫卜曆算
  - label: B
    content: 讖緯圖籙
  - label: C
    content: 諸子百家
  - label: D
    content: 詩書易禮
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 歷史上有位皇帝首先採用五德終始說與商周以來的天命觀，彰顯君臨天下的神聖性，再藉由郡縣制度，將所有官僚置於帝制之下。請問這位皇帝是指何人？
  options:
  - label: A
    content: 秦始皇
  - label: B
    content: 漢高祖
  - label: C
    content: 漢武帝
  - label: D
    content: 唐太宗
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 在中國某個朝代中，皇帝頒下詔書，一個官員反對這個命令，並在詔書上寫下他的看法。其他官員趕忙勸阻，認為這對皇帝不敬，但這位官員表示這是法律賦予他的職責。皇帝知道此事後，非但沒有責備，反而嘉許他能防範詔敕可能發生的錯誤。這個故事最可能發生在何時？
  options:
  - label: A
    content: 兩漢
  - label: B
    content: 隋唐
  - label: C
    content: 兩宋
  - label: D
    content: 明清
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 這個時期，中國漸漸出現由豪族或僧侶發起的「邑義」團體，以村落或鄉里為範圍，號召居民共同參與建寺、造佛像、誦經或辦齋會。請問這個時期應指何者？
  options:
  - label: A
    content: 西周
  - label: B
    content: 先秦
  - label: C
    content: 兩漢
  - label: D
    content: 南北朝
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 某州長官希望任用張三為其僚屬，但人事官員卻以「資籍不當」為由，不同意這項任命。當州長官表示一定要任用此人，人事官員嚴肅地說：「州僚屬的任命必須經過本地人的評議，我是本地人，既然不同意，長官就不應違反這個制度。」這樣的場景最可能發生在：
  options:
  - label: A
    content: 兩漢
  - label: B
    content: 南北朝
  - label: C
    content: 中晚唐
  - label: D
    content: 宋明
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 宋代實施重文輕武的國策，大量開科取士，社會結構也開始產生變化，出現了新的宗族型態。若士人要凝聚宗族勢力，應會透過什麼方式來進行？
  options:
  - label: A
    content: 祭祀先祖
  - label: B
    content: 制定行規
  - label: C
    content: 組織商幫
  - label: D
    content: 祕密結社
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 資料一：他們協助政府推動政令、參與公共建設、推動地方教化。 資料二：他們在地方上有一定的影響力，享有司法與經濟特權。例如見官員不必下跪，免除勞役，並適用一些減刑、免刑的特別條例。 請問資料所述為下列何者？
  options:
  - label: A
    content: 士紳
  - label: B
    content: 保甲
  - label: C
    content: 團練
  - label: D
    content: 商幫
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 春秋戰國時期，隨著封建解體，各國戰爭頻繁，「編戶齊民」成為新政治社會結構下的統治基礎。請問此現象應如何解讀？
  options:
  - label: A
    content: 戰爭需要軍事人才，國君開始將軍人「編戶」管理
  - label: B
    content: 國家將人民編入戶籍，以利徵調其服役與繳稅
  - label: C
    content: 齊桓公稱霸後，要求其餘諸國百姓一律編為齊國人民
  - label: D
    content: 「齊民」指登入戶籍者，法律上一致平等，屬於貴族特權
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 唐中葉後，賦役制度從租庸調法改為兩稅法，關於其背景或影響的敘述，下列何者正確？
  options:
  - label: A
    content: 土地開墾飽和；政府無荒地可授，只好直接課徵錢幣
  - label: B
    content: 戶籍散亂使政府改行兩稅法，以現有男丁徵加力役，卻造成沉重負擔
  - label: C
    content: 兩稅法將實物交稅改以錢幣繳納，有利貨幣經濟的發展
  - label: D
    content: 兩稅法可避免政府濫增名目收稅，也可杜絕土地兼併問題
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 關於朝鮮歷史的發展過程，下列何者正確？
  options:
  - label: A
    content: 三國時期→高麗統一→新羅王朝→李氏朝鮮
  - label: B
    content: 新羅王朝→三國時期→李氏朝鮮→高麗王朝
  - label: C
    content: 三國時期→斯羅統一→高麗王朝→李氏朝鮮
  - label: D
    content: 李氏朝鮮→新羅王朝→三國時期→高麗統一
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 1
  stem: 白蓮教最初是在南宋時融合佛教成立，因教義通俗而傳播迅速。元朝末年因相信彌勒佛會下凡普渡眾生，形成「紅巾軍」，最後推翻了元朝。1796年（嘉慶元年）發生的白蓮教亂，暴露了清朝軍事上的衰弱。請問關於白蓮教的歷史發展，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: 白蓮教因融合佛教，得到南宋政府的支持
  - label: B
    content: 白蓮教持續變換形式尋求發展
  - label: C
    content: 為對抗白蓮教亂，各地陸續出現團練
  - label: D
    content: 團練曾在19世紀內憂外患下發揮重要功用
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 下列有關「黨錮之禍」的敘述，何者正確？
  options:
  - label: A
    content: 是西漢亡國的因素之一
  - label: B
    content: 起因為太學生與士人集團互相聯合，批評時政
  - label: C
    content: 「黨錮」係禁止外戚出任官職
  - label: D
    content: 造成宦官勢力受到嚴重打擊
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 山西土壤貧瘠，農業不盛。而煤、鐵、鹽等豐富自然資源，則為商業活動提供有利條件，山西人也因此組織商幫，與各省商人競爭。請問此現象最早發生在何時？
  options:
  - label: A
    content: 魏晉時期
  - label: B
    content: 隋唐時期
  - label: C
    content: 明清時期
  - label: D
    content: 清末民初
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有一時期士大夫對於重建宗族的血緣凝聚力，提出了一些構想。如提倡「明譜系」以加強族人的團結，主張立有官職的族人為族長，作為號召族人的宗族領袖，以保障宗族的昌盛；並透過家廟與家祭制度，以聯繫宗人。請問文中所述，是哪一時期士大夫的共識？
  options:
  - label: A
    content: 東漢時期
  - label: B
    content: 南朝時期
  - label: C
    content: 隋唐時期
  - label: D
    content: 兩宋時期
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 日本由天皇體制轉變為幕府政治的原因與下列何者有關？
  options:
  - label: A
    content: 律令制瓦解，天皇無力保護人民
  - label: B
    content: 中國擊敗日本，天皇被迫交出政權
  - label: C
    content: 日本進入戰國時代，地方領主趁機壯大勢力
  - label: D
    content: 為抵禦蒙古入侵，耗盡日本國力
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 資料一：木楊城內真威風，萬丈旗桿透身洪，清朝人復歸明主。扯起大旗皆當徒。 資料二：此夕會盟天下合，四海招徠盡姓洪，金針取血同立誓，兄弟齊心要合同。 以上為清初流傳於民間的歌謠，請問歌詞所述應與下列何者有關？
  options:
  - label: A
    content: 天地會
  - label: B
    content: 白蓮教
  - label: C
    content: 強學會
  - label: D
    content: 太平道
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 12世紀起，日本進入「幕府時代」，有關幕府的演變，下列何者正確？
  options:
  - label: A
    content: 足利尊氏廢除天皇制度，建立鐮倉幕府，開啟幕府政治
  - label: B
    content: 室町幕府末期群雄並起，進入戰國時代
  - label: C
    content: 德川家康為末代幕府將軍，1867年還政於天皇
  - label: D
    content: 織田信長建立幕藩體制穩定政治秩序
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_23
  section: 1
  number: 23
  type: single
  page: 2
  stem: 一位學者在談到歷史上某項社會事業時說：「人情莫不私其所私，莫不思置美田宅以利其子孫，不數傳蕩然無存，而甲之設往往可久，即其子孫亦往往能自豎樹立。」其中的甲應該是指：
  options:
  - label: A
    content: 義莊
  - label: B
    content: 宗譜
  - label: C
    content: 祠堂
  - label: D
    content: 社倉
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_24
  section: 1
  number: 24
  type: single
  page: 2
  stem: 甲時期：「出身低微但深受皇帝重用的大將軍，提出與江南望族聯姻請求時，連皇帝也不敢答應。」 乙時期：「皇帝即位後，宰相職務分立，不得過問軍事，還必須受諫官的監督。」 丙時期：「皇帝統轄所有官員，另外再設置特務組織監視臣民。」 丁時期：「官員直接對皇帝上奏密摺，大小政事都須皇帝硃批才能執行。」 請問上述四個時期，應各自分屬哪一朝代現象？
  options:
  - label: A
    content: 南朝、宋、明、清
  - label: B
    content: 唐、五代、明、清
  - label: C
    content: 東晉、唐、宋、明
  - label: D
    content: 漢、隋、唐、元
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_25
  section: 1
  number: 25
  type: single
  page: 2
  stem: 宋代農業生產的進步，帶動了商品經濟的發展，工商業者設立同業組織—「行會」。請問當時的行會主要有何種功能？
  options:
  - label: A
    content: 維護地方秩序，控制基層社會
  - label: B
    content: 經營錢莊與票號
  - label: C
    content: 對內賑濟成員，對外從事社會福利事業
  - label: D
    content: 爭取權益、協助商品流通與調節價格
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s1_26
  section: 1
  number: 26
  type: single
  page: 2
  stem: 自何時開始。中國的政府為符合民情，准許士人和平民祭祀始祖，並可建祠立廟？
  options:
  - label: A
    content: 魏晉時期
  - label: B
    content: 北宋時期
  - label: C
    content: 明代中葉
  - label: D
    content: 清代末年
- id: doc_108_台南_北門_社會_歷史_g10s2e1_s2_27
  section: 2
  number: 27
  type: single
  page: 2
  stem: 追溯歷史，資料中兩人在鄉里的事業最早源於何時？
  options:
  - label: A
    content: 周代
  - label: B
    content: 唐代
  - label: C
    content: 宋代
