  stem: '以下兩則資料為日本仿效中國典章制度與文化而推動的改革： 資料一：推古天皇在位期間，(甲)擔任攝政，開始仿效中國制度，推動政治改革，確立中央集權式的官僚體系。當時日本開始吸收由中國傳入的佛教文化，且形成以此為重心的□文化，在藝術與建築等方面均有獨特的表現。 資料二：(乙)即位之後，首次訂立國家的年號，以唐朝的典章制度為基礎推動改革，重要內容包括將原屬豪族的人口與土地收歸中央政府管轄，確立中央與地方行政制度，並實行新的土地制度與稅制。 根據上述資料，請回答問題：

