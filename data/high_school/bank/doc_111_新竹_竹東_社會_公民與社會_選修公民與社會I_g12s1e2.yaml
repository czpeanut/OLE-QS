  stem: 「中國為世界最大的稀土出口國，其在2012年將稀土出口配額定為3萬噸，此舉造成美歐日聯合向世貿組織提出訴訟，指責中國限制稀土出口違反世貿規則。中國商務部表示，中方政策是為保護資源環境，實現永續發展，無意透過扭曲貿易的方式保護國內產業。歐洲聯盟貿易事務執行委員戴胡克表示，中國對稀土及其他產品施加限制，違反國際貿易法規，必須去除這些限制，並要求WTO解決爭端，這是提出全面貿易訴訟的第一步。」(資料來源：BBC中文網)美日歐宣布就稀土出口問題向世界貿易組織投訴中國，請問此一舉動是基於下列何項理由？
