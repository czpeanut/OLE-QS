  stem: 臺灣雖地處小島，但對外貿易的表現一直深受各國肯定，對外出口的貨物也以「物美價廉」著稱，但是在出口屢創佳績的同時，卻頻遭進口國的廠商指控傾銷。據統計在1995年至2006年6月期間，臺灣共遭受163起的反傾銷調查，其中被課反傾銷稅的有103件請問有權調查反傾銷事實的國際組織為下列哪一個？
  options:
