  section: 1
  number: 38
  type: single
  page: 5
  stem: 面對東協與中國之間大部分商品關稅的減免，學者推估「東協加一」將使臺灣產業的生產總額減少24.6億美元（約新臺幣780億元），對臺灣整體產業將有嚴重衝擊。請問下列何者最能說明學者所稱臺灣產業的困境？
  options:
  - label: A
    content: 因為關稅差異，臺灣產品進入東協或中國時，需負擔較高的成本，將使產品較不具競爭力
  - label: B
    content: 因為關稅差異，臺灣產品進入東協或中國時，將促使臺灣產品之間的削價競爭，導致進口國得利的情況
  - label: C
    content: 因為關稅差異，臺灣產品進入東協或中國時，促使進口國對臺灣產品課反傾銷稅，將使產品較不具競爭力
  - label: D
    content: 因為關稅差異，東協或中國產品進入臺灣市場時，臺灣政府會採行貿易保護政策，此舉將使雙方產品均須負擔較高的成本
