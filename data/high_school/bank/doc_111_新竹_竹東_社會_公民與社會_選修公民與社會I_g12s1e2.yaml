  section: 1
  number: 34
  type: single
  page: 4
  stem: 由於全球新手機、筆電、電子零組件等需求過熱，航空運輸需求不斷湧入，導致航空、貨運業者的貨機空運已被預訂一空，業者預期空運價格將再創新天價。航空貨運市場熱絡的景象也反映在商品的售價上，假設市場上只有甲、乙、丙三家廠商，當運費增加的成本轉嫁到消費者身上時，何者最可能是消費者的反應？
