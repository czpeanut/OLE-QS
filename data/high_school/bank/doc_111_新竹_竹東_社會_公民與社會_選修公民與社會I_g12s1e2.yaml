  section: 1
  number: 15
  type: single
  page: 2
  stem: '思嘉上公民課時發問：「失業就是失業，為什麼還要分成幾類，讓人學得那麼辛苦？」老師告訴他：「因為失業有不同的原因，適當分類，才能找出解決之道。」下列失業類型與因應對策的配對，何者正確？

    |  | 失業類型 | 因應對策 |

    | --- | --- | --- |

    | (甲) | 摩擦性失業 | 提供就業資訊與展覽 |

    | (乙) | 循環性失業 | 加強教育與職業訓練 |

    | (丙) | 結構性失業 | 採行貨幣政策或財政政策 |

    | (丁) | 自然失業 | 政府以補助幫忙失業者维持生活開支 |'
  options:
  - label: A
    content: (甲)
  - label: B
    content: (乙)
  - label: C
    content: (丙)
  - label: D
    content: (丁)
