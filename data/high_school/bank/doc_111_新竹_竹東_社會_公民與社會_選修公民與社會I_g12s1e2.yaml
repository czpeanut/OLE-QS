- id: doc_111_新竹_竹東_社會_公民與社會_選修公民與社會I_g12s1e2_s1_31
  section: 1
  number: 31
  type: single
  page: 4
  stem: 《動物方城市》(Zootopia)旋風2016年席捲全臺，當時民眾對片中主角兔子茱蒂、狐狸尼克的玩偶需求大增，不過廠商無法立刻提高產能，即使以原有價格的兩倍購買，也無法解決玩偶供不應求的問題。請問以下有關茱蒂、尼克玩偶價格措施以及對經濟效率（社會福祉）影響的敘述何者正確？
  options:
  - label: A
    content: 提高玩具價格可降低需求數量、提升整體經濟效率
  - label: B
    content: 提高玩具價格可提高供給數量，但會損害生產者剩餘
  - label: C
    content: 管制玩具價格在原價兩倍之下可保障民眾權益，避免降低經濟效率
  - label: D
    content: 限制玩具維持原有價格，可讓經濟效率的損失達到最低
- id: doc_111_新竹_竹東_社會_公民與社會_選修公民與社會I_g12s1e2_s1_32
  section: 1
  number: 32
  type: single
  page: 4
  stem: 某國勞動部為基本工資是否應調漲而邀請勞方、資方共同協商。勞方認為，現行基本工資已無法支應日常生活之開銷，應調漲；資方則認為，調高基本工資會增加生產成本，<u>且可能因此而產生失業問題</u>。勞動部最後依三方協商結果，調高基本工資。以經濟學的觀點，上文畫底線處應如何解釋？
  options:
  - label: A
    content: 基本工資即為價格下限，對勞動力市場而言，會有勞動力超額供給的現象
  - label: B
    content: 對勞動力市場而言，勞動部設定價格上限，會使勞動力有供過於求的情況
  - label: C
    content: 雇主希望壓低基本工資，藉此引進外籍勞工，造成本國勞工找不到工作
  - label: D
    content: 調高基本工資可使勞工願意投入職場，使勞動力市場增加對勞動力的需求
