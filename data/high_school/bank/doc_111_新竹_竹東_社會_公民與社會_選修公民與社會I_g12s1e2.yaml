  stem: 《民法》主要規定私人相互間權利義務的關係，因此強調私法自治與契約自由的原則。請問下列何者違反契約自由的原則？
  options:
  - label: A
    content: 原則上，雙方意見表示一致，並訂立契约書，契約才能成立
  - label: B
    content: 個人有權決定是否購買商業保險，並可自由與保險公司締結保險契約
  - label: C
    content: 個人償還借款的方式可以自由約定，但其方式不得違反公序良俗及强制禁止規定
  - label: D
    content: 對於購屋契約的內容有意見，可以在締約後，與對方協商更改内容
