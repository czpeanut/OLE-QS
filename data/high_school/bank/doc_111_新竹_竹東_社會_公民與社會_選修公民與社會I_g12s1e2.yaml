  type: single
  page: 4
  stem: 假設甲國與乙國在生產過程中只使用勞動生產要素，且兩國支付勞動的工資相同。如果甲國生產一雙皮鞋需要6單位的勞動，生產一套衣服需要12單位的勞動；乙國生產一雙皮鞋需要9單位的勞動，生產一套衣服需要12單位的勞動。下列敘述何者正確？
