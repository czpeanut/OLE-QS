  stem: 資料一：到了文藝復興時期，寡婦繼承丈夫事業的權力日益受到限制。除非改嫁，否則她會失去所有權利。……考慮到寡婦權利的侷限性，以及行會師傅的遺孀使其丈夫學徒或幫工成為行會會員的機會，再婚現象極為常見。……在這種環境下，再婚被認為是很自然的事。資料二：在一些情況，寡婦對配偶財產享有權利和進行投資的機會，臣大經濟優勢會阻礙再婚。……例如十四世紀的蒙比利哀，寡婦是從事商業的婦女中最積極的一群。由於認識到寡居的好處，再婚的婦女寥寥無幾。請問根據資料，判斷下列論述何者正確？
