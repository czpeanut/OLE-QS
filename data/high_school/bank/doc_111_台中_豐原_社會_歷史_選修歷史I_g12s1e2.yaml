  stem: 卡特西是一名美國原住民莫霍克族的助產士，她自1981年開始監測和記錄生活在紐約聖羅倫斯河附近的莫霍克族母親的母乳中含有的有毒物質以及其他工業汙染物的水平。她觀察到這些毒素透過水資源，在人類體內累積並通過母乳排出的事實。她於1985年執行阿克威薩斯尼母乳計畫的項目，其主皆為了解有毒物質如何通過食物鏈轉移(包含母乳)，她藉由成立該計畫，繼續監測該河毒素之外，更希望人們了解有毒物質侵害的危險性。請問根據上述資料，判斷下列何者正確?
