  answer_source: answer_key
  explanation: $\frac{1.50g}{xg/mol}$×$\frac{取30mL}{50mL}$×$\frac{2H^{+}}{1H_{2}A}$＝0.5 mol/L×$\frac{40mL}{1000mL/L}$×$\frac{1OH^{-}}{1NaOH}\Rightarrow$x＝90
