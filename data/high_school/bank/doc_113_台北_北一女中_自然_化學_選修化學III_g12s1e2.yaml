- id: doc_113_台北_北一女中_自然_化學_選修化學III_g12s1e2_s3_2
  section: 3
  number: 2
  type: calc
  page: 5
  stem: '某生欲利用氧化還原滴定，以過錳酸鉀溶液測得未知試樣中亞鐵離子含量，其實驗步驟如下：

    ①稱取 0.268 g 草酸鈉（式量＝134），加水溶解並置入容量瓶中，配成 100 mL 溶液後，以分度吸量管取出 20 mL 並加入 2 M 的硫酸溶液 15 mL 成為酸性溶液。

    ②加熱上述溶液至 70 ℃。

    ③以過錳酸鉀溶液滴定上述溶液進行標定，達滴定終點時共耗去過錳酸鉀溶液 8 mL。

    ④取 2 g 不純的 $FeSO_{4}$．$7H_{2}$O(s) 試樣（原子量：Fe＝56），置入錐形瓶中，加入 70 mL 蒸餾水將試樣完全溶解後，再加入 2 M 的硫酸溶液 15 mL 成為酸性溶液。

    ⑤以③之標準過錳酸鉀溶液滴定④之溶液，達滴定終點時共耗去過錳酸鉀溶液 10 mL。

    回答下列問題：

    (1)本實驗中達滴定終點時，溶液的顏色為何？

    (2)步驟②中為何需加熱？

    (3)過錳酸鉀溶液的濃度為多少 M？

    (4)不純的 $FeSO_{4}$．$7H_{2}$O(s) 試樣中，含 $Fe^{2＋}$ 之重量百分率為多少？'
  answer:
  - (1)紫色或粉紅色 (2)見解析 (3) 0.02 (4) 2.8％
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) $KMnO_{4}$ 過量為紫色或粉紅色。

    (2) $C_{2}O_{4}^{2－}$→ $CO_{2}$ 需斷共價鍵，加熱可加快反應速率。

    (3) $\frac{0.268g}{134g/mol}$×$\frac{取20mL}{100mL}$×$\frac{失2e^{-}}{1Na_{2}C_{2}O_{4}}$＝$C_{KMnO}$4×$\frac{8mL}{1000mL}$×$\frac{得5e^{-}}{1KMnO_{4}}\RightarrowC_{KMnO}$4＝0.02（M）。

    (4) 0.02$\frac{mol}{L}$×$\frac{10mL}{1000mL/L}$×$\frac{得5e^{-}}{1KMnO_{4}}$＝$n_{Fe2＋}$×$\frac{失1e^{-}}{1Fe^{2+}}\Rightarrown_{Fe2＋}$＝0.001（mol），$Fe^{2＋}$ 之 W％＝$\frac{0.001\times 56}{2}$×100％＝2.8％。'
