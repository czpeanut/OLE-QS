  type: calc
  page: 6
  stem: '於實驗室中進行電解電鍍實驗，欲在一塊表面充滿油汙、鏽斑的銅片，鍍上一層平滑光亮的鋅層（以 0.1 M $ZnSO_{4}$ 水溶液為電鍍液）。回答下列各題：（1 法拉第＝1 莫耳 $e^{－}$ 之電量＝96500 庫侖）

    (1)請說明鋅片與銅片應分別與電源供應器的什麼電極相連接？（請回答正、負極）

    (2)若調整電壓至 5 伏特，測得通入電流為 0.20 安培（安培＝庫侖∕秒），歷時 16 分 5 秒（1 分鐘＝60 秒），通入電量為多少法拉第？

    (3)根據(2)所通入電量，已知每 1 莫耳鋅有 65 克，則鍍在銅片中之鋅層的重量為多少克？'
  answer:
  - (1)鋅為正極，銅為負極 (2) 0.002 (3) 0.065
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)鋅為正極：Zn → $Zn^{2＋}$＋$2e^{－}$，銅為負極：$Zn^{2＋}$＋$2e^{－}$ → Zn。

    (2) 0.2 安培×（16 分×$\frac{60秒}{1分}$＋5 秒）×$\frac{1莫耳e^{-}}{96500庫侖}$＝0.002 莫耳 $e^{－}$＝0.002 法拉第。

    (3) $Zn^{2＋}$＋$2e^{－}$ → Zn，0.002 莫耳 $e^{－}$×$\frac{\frac{1}{2}莫耳鋅}{1莫耳e^{-}}$×$\frac{65克}{1莫耳鋅}$＝0.065 克。'
