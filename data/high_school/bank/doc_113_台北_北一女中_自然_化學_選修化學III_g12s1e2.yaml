  stem: 某二質子酸（$H_{2}$A）固體 1.50 g 溶成 50 mL 水溶液，取出 30 mL，以 0.5 M NaOH 溶液滴定，加入 40 mL 之 NaOH 溶液，恰達當量點，該二質子酸（$H_{2}$A）之分子量為若干？
  options:
  - label: A
    content: '60'
  - label: B
    content: '90'
  - label: C
    content: '120'
  - label: D
    content: '150'
  - label: E
