- id: doc_113_台北_北一女中_自然_化學_選修化學III_g12s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: pH 值均為 3.0 之 HCl(aq) 與 $CH_{3}$COOH(aq) 各 1.0 升，下列敘述何者正確？
  options:
  - label: A
    content: 0.010 M NaOH(aq) 分別滴定此兩溶液，達滴定終點時，用去 NaOH(aq) 的體積均相同
  - label: B
    content: 兩溶液分別與鋅片反應生成氣體的初速率均相同
  - label: C
    content: 若將此兩溶液分別用水稀釋至 2.0 升，溶液所含 $H^{＋}$ 的濃度均為 5.0×$10^{－4}$ M
  - label: D
    content: 今有 5.0×$10^{－4}$ M 硫酸 1.0 升，其 pH 值與 pH＝3 之 HCl(aq) 相同（硫酸的 $K_{a}$1≒∞，$K_{a}$2≒$10^{－2}$）
  - label: E
    content: 以 0.010 M NaOH(aq) 分別滴定此兩溶液，達當量點時，溶液均呈中性
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '因 $CH_{3}$COOH 為弱酸，欲產生 pH＝3 的非緩衝溶液，其 $CH_{3}$COOH 初濃度大於 HCl。

    (A) $CH_{3}$COOH 需較多 NaOH。

    (B) Zn＋$H^{＋}$ → $Zn^{2＋}$＋$H_{2}$，初速率與 [$H^{＋}$] 有關。

    (C) $CH_{3}$COOH 稀釋後平衡右移，[$H^{＋}$] 略大於 5×$10^{－4}$。

    (D) $H_{2}SO_{4}$ 第 2 個 $H^{＋}$ 不完全解離，無法生成 [$H^{＋}$]＝5×$10^{－4}$×2＝$10^{－3}$（M）。

    (E) $CH_{3}$COOH 生成鹼性鹽類（$CH_{3}$COONa）。'
