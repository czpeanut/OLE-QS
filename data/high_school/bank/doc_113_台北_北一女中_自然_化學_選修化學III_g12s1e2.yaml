  stem: 已知 $Zn^{2＋}$(aq)＋$2e^{－}$ → Zn(s) E°＝－0.76 V；$Ag^{＋}$(aq)＋$e^{－}$ → Ag(s) E°＝0.80 V。若將鋅半電池與銀半電池組合成電池，則下列敘述何者正確？
