- id: doc_113_台北_北一女中_自然_化學_選修化學III_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列常見氧化劑與其進行氧化還原反應時對應之還原半反應，何者氧化力<u>不受</u>到 pH 值影響？
  options:
  - label: A
    content: $MnO_{4}^{－}$（$MnO_{4}^{－}$＋$8H^{＋}$＋$5e^{－}$ → $Mn^{2＋}$＋$4H_{2}$O）
  - label: B
    content: $Cr_{2}O_{7}^{2－}$（$Cr_{2}O_{7}^{2－}$＋$14H^{＋}$＋$6e^{－}$ → $2Cr^{3＋}$＋$7H_{2}$O）
  - label: C
    content: $NO_{3}^{－}$（$NO_{3}^{－}$＋$4H^{＋}$＋$3e^{－}$ → NO＋$2H_{2}$O）
  - label: D
    content: $I_{2}$（$I_{2}$＋$2e^{－}$ → $2I^{－}$）
  - label: E
    content: $H_{2}O_{2}$（$H_{2}O_{2}$＋$2H^{＋}$＋$2e^{－}$ → $2H_{2}$O）
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)反應式中無 $H^{＋}$、$OH^{－}$，氧化力不受 pH 值影響。
- id: doc_113_台北_北一女中_自然_化學_選修化學III_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列反應中所加入的酸何者<u>不是</u>反應物？（選最適合之選項）
  options:
  - label: A
    content: 秒錶反應在溶液中加入硫酸（$IO_{3}^{－}$＋$3HSO_{3}^{－}$ → $I^{－}$＋$3SO_{4}^{2－}$＋$3H^{＋}$）
  - label: B
    content: 銅片滴入濃硝酸生成二氧化氮
  - label: C
    content: 在氯化鈉溶液中加入硫酸製備氯化氫氣體
  - label: D
    content: 將鹽酸滴入二氧化錳固體生成氯氣
  - label: E
    content: 過氯酸與醋酸鈉混合反應生成醋酸與過氯酸鈉
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '由以下反應式可知，

    (A)選項中硫酸不是反應物，$IO_{3}^{－}$＋$3HSO_{3}^{－}$ → $I^{－}$＋$3SO_{4}^{2－}$＋$3H^{＋}$

    (B) Cu＋$4HNO_{3}$ → Cu($NO_{3}$)$_{2}$＋2NO＋$2H_{2}$O

    (C) 2NaCl＋$H_{2}SO_{4}$ → 2HCl＋$Na_{2}SO_{4}$

    (D) 4HCl＋$MnO_{2}$ → $Cl_{2}$＋$MnCl_{2}$＋$2H_{2}$O

    (E) $HClO_{4}$＋$CH_{3}$COONa → $CH_{3}$COOH＋$NaClO_{4}$'
- id: doc_113_台北_北一女中_自然_化學_選修化學III_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 下列何者鹽類的水溶液呈酸性？
  options:
  - label: A
    content: 氯化鉀（KCl）
  - label: B
    content: 氯化銨（$NH_{4}$Cl）
  - label: C
    content: 碳酸氫鈉（$NaHCO_{3}$）
  - label: D
    content: 磷酸氫二鈉（$Na_{2}HPO_{4}$）
  - label: E
    content: 硫化鈉（$Na_{2}$S）
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)中性。

    (B) $NH_{4}^{＋}$ 水解呈酸性。

    (C) $HCO_{3}^{－}$ 水解呈鹼性。

    (D) $HPO_{4}^{2－}$ 水解呈鹼性。

    (E) $S^{2－}$ 水解呈鹼性。'
- id: doc_113_台北_北一女中_自然_化學_選修化學III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列哪組共軛酸鹼對會使水溶液的 pH 值穩定，並保持在 5 附近？
  options:
  - label: A
    content: $CH_{3}$COOH、$CH_{3}$COONa（$CH_{3}$COOH 的 $K_{a}$＝1.8×$10^{－5}$）
  - label: B
    content: $NH_{4}$Cl、$NH_{3}$（$NH_{3}$ 的 $K_{b}$＝1.6×$10^{－5}$）
  - label: C
    content: $H_{2}CO_{3}$、$NaHCO_{3}$（$H_{2}CO_{3}$ 的 $K_{a}$1＝4.4×$10^{－7}$、$K_{a}$2＝4.7×$10^{－11}$）
  - label: D
    content: $NaH_{2}PO_{4}$、$Na_{2}HPO_{4}$（$H_{3}PO_{4}$ 的 $K_{a}$1＝7.1×$10^{－3}$、$K_{a}$2＝6.3×$10^{－8}$、$K_{a}$3＝4.4×$10^{－13}$）
  - label: E
    content: $H_{2}C_{2}O_{4}$、$NaHC_{2}O_{4}$（$H_{2}C_{2}O_{4}$ 的 $K_{a}$1＝6.4×$10^{－2}$、$K_{a}$2＝6.0×$10^{－5}$）
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) $K_{a}$＝$\frac{[H^{+}][CH_{3}COO^{-}]}{[CH_{3}COOH]}$，[$H^{＋}$] 接近 1.8×$10^{－5}$。

    (B) $K_{b}$＝$\frac{[NH_{4}^{+}][OH^{-}]}{[NH_{3}]}$，[$OH^{－}$] 接近 1.6×$10^{－5}$。

    (C) $K_{a}$1＝$\frac{[H^{+}][HCO_{3}^{-}]}{[H_{2}CO_{3}]}$，[$H^{＋}$] 接近 4.4×$10^{－7}$。

    (D) $K_{a}$2＝$\frac{[H^{+}][HPO_{4}^{2-}]}{[H_{2}PO_{4}^{-}]}$，[$H^{＋}$] 接近 6.3×$10^{－8}$。

    (E) $K_{a}$1＝$\frac{[H^{+}][HC_{2}O_{4}^{2-}]}{[H_{2}C_{2}O_{4}]}$，[$H^{＋}$] 接近 6.4×$10^{－2}$。'
- id: doc_113_台北_北一女中_自然_化學_選修化學III_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列緩衝溶液之敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 血液是緩衝溶液
  - label: B
    content: 將醋酸鈉（$CH_{3}$COONa）與氫氧化鈉（NaOH）混合可製備緩衝溶液
  - label: C
    content: 緩衝溶液中加入少量水，溶液 pH 值幾乎不變
  - label: D
    content: 在 0.1 M $CH_{3}$COOH 和 0.1 M $CH_{3}$COONa 共存的 10 mL 水溶液中，加入 1.25 mmol NaOH(s) 將使溶液失去緩衝作用
  - label: E
    content: 其 pH 值不易因少量強酸或強鹼的加入而有大幅度的改變，其原理為同離子效應
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) $CH_{3}$COONa 與 NaOH 非共軛酸鹼對。

    (D) $CH_{3}$COOH 1 mmol 將被耗盡。'
