  group_stem: '一、〈尋找我的莎士比亞〉與〈文學門縫〉二文都使用了「門」的意象，請以約50字簡要說明兩文在此意象使用的異同。

    <u>◎第二題組</u> 閱讀下文，回答下列問題： 街道上成排的楓樹枝梢上有殘餘的紅葉顫抖著，而吹向兩旁溝渠低窪處的銀杏落葉，間歇地在水泥地上刮起黃色的枯索的聲音。日本人稱這種秋冬之際把樹木吹枯的冷風為「木枯」（音kogarashi），確乎有道理，而且饒富詩意。…… 枯葉落地，碰觸石板路的聲音，其實在更久之前的記憶裡已有印象。大約只有七、八歲的年紀吧，那時每天上下學必經的上海虹口公園北四川路一帶，人行道外側壯觀的巨大法國梧桐樹，在秋冬交替的時節，也總有風吹葉凋。大片成堆的梧桐枯葉，隨風刮過地面，沙沙作響。「沙沙」，這樣的狀聲詞，其實是後來讀了許多中國文學作品後才習得的；未必與童年時期聽見落葉的感覺完全吻合。當時稚幼的心靈究竟是怎麼接受那種音聲的呢？已不復記得；但時隔多年，沙沙作響的枯葉拂地之聲，在我懵懂的年紀裡初次留下迹近悵惘的感覺，倒是始終不能忘懷。（節錄自林文月〈深秋再訪京都〉）'
