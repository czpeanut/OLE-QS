- id: doc_108_花蓮_花蓮高中_國文_g10s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 4
  stem: 依據二文，下列敘述正確的選項是：
  options:
  - label: A
    content: 在甲文中，作者反省並檢討幼年同時閱讀兩書的貪婪心態
  - label: B
    content: 在乙文中，作者對未能記住與書店相關的細節而感到懊惱
  - label: C
    content: 甲文第二段的「他」即為作者，藉著閱讀翱翔於文學世界
  - label: D
    content: 乙文的「書店」是作者生命中熱烈且難以磨滅的歡愁回憶
  group_stem: '閱讀下列甲、乙二文，回答 19-20 題

    甲

    這些小孩大都直接在租書店裡看書，可能這種讀物拿回家也不容易受到父母的贊同；但租物店似乎並不介意租書者的旁邊多兩位「分讀」的小讀者。這就是我們這些嗜讀者的機會，我們可以坐在熟識朋友的旁邊，看著他一頁一頁翻過去的圖畫，不花一分錢，我們也讀完了這些書。正是因為貪心的緣故，我對坐在一個朋友旁邊分讀一本漫畫書也感到不滿足，後來我發展出一種技能，我坐在兩位租書朋友的中間，可以同時閱讀左右兩本書。只是我必須自行剪接兩本書的閱讀順序，像是蒙太奇一樣，也許就是這種技能的建立，讓我後來走在靠文字維生的編輯生涯。

    回想起來，我對這一切仍然感到神奇。僅僅憑著閱讀，一個人竟可以穿越他所屬處境的局限；而他在不懂處苦苦思索，思索的果實竟可以就帶他離開現實，造就他無限的機會。一本今天已經沒有太多人讚美的雜誌，也竟然可以讓一個鄉下小孩得以飛翔。並且就推開狹窄的門縫，進入他的階級不易居住的廣殿。

    乙

    那爿書店叫做什麼名字呢？我完全不記得了。那好心的店主人母子姓什麼呢？我也一直不曉得；說實在的，我連他們的模樣兒也早已經忘掉了。然而有時不免想：我從小喜歡讀書。而在這平凡的生活裡，從過去到現在，一直都與書本有密切的關係，我讀書又教書，看書也寫書。是什麼原因使我變成這樣子呢？我不明白。只有一個可能：在我幼小好奇的那段日子裡，如果那書店裡的母子不允許我白看他們的書，甚至把我攆出店外，我可能會對書的興趣大減，甚至不喜歡書和書店也未可知。

    人海茫茫，許多人和事都像過眼雲煙似地消逝了，但是有些甜蜜而微不足道的往事，卻能這樣子教人懷念。我不知道這個事實是不是對我曾發生過什麼啟示或影響，只覺得那種溫暖竟比一些熱烈的歡愁經驗，更令我回味無窮。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  tags:
