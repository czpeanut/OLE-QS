  - label: D
    content: 師不必「賢」於弟子
  group_stem: 閱讀下列甲、乙二文，回答10-12題 甲 饒州自元豐末朱天賜以神童得官．俚俗爭慕之。小兒不問如何，粗能念書，自五、六歲，即以次教之五經，以竹籃坐之木杪，絕其視聽。教者預為價，終一經，償錢若干，晝夜苦之。中間此科久廢，政和後稍復，於是亦有偶中者。流俗因言饒州出神童。然兒非其質，苦之以至死者，蓋多以中也。（葉夢得《避暑錄話》卷上） 乙 金谿民方仲永，世隸耕，仲永生五年，未嘗識書具，忽啼求之。父異焉，借旁近與之；即書詩四句，並自為其名。其詩以養父母、收族為意，傳一鄉秀才觀之。自是指物作詩立就，其文理皆有可觀者。邑人奇之，稍稍賓客其父，或以錢幣乞之。父利其然也，日扳仲永環謁於邑人，不使學。 余聞之也久。明道中，從先人還家，於舅家見之，十二、三矣。令作詩，不能稱前時之聞。又七年，還自揚州，復到舅家，問焉。曰：「泯然眾人矣！」 王子曰：仲永之通悟，受之天也；其受之天也，賢於材人遠矣：卒之為眾人，則其受於人者不至也。彼其受之天也，如此其賢也，不受之人，且為眾人；今夫不受之天，固眾人，又不受之人，得為眾人而已耶？（王安石〈傷仲永〉）
  answer:
  - D
  answer_status: verified
