  group_stem: '◎第三題組 閱讀下文，回答下列問題：

    孟子稱：「人之患，在好為人師。」由魏、晉氏以下，人益不事師。今之世，不聞有師；有，輒譁笑之，以為狂人。獨韓愈奮不顧流俗，犯笑侮，收召後學，作〈師說〉，因抗顏①而為師。世果群怪聚罵，指目牽引，而增與為言辭。愈以是得狂名，居長安，炊不暇熟，又挈挈②而東，如是者數矣。……

    吾子③行厚而辭深，凡所作，皆恢恢然④有古人形貌；雖僕敢為師，亦何所增加也！假而以僕年先吾子，聞道著書之日不後，誠欲往來言所聞，則僕固願悉陳⑤中所得者。吾子苟自擇之，取某事，去某事，則可矣。若定是非以教吾子，僕材不足，而又畏前所陳者，其為不敢也決矣。（節錄自柳宗元〈答韋中立論師道書〉）

