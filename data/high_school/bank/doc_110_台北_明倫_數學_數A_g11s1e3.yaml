  stem: 設實數 x，y 滿足 $x^{2}$＋$4y^{2}$＝$\frac{1}{2}$，則 3x＋2y 的最小值為＿＿＿＿，而此時數對（x，y）＝ ＿＿＿＿。
  explanation: '［$x^{2}$＋（2y）$^{2}$］（$3^{2}$＋$1^{2}$）$\geq$（3x＋2y）$^{2}$

    $\Rightarrow\frac{1}{2} \times (9 + 1)\geq$（3x＋2y）$^{2}$

    $\Rightarrow- \sqrt{5}\leq$3x＋2y$\leq\sqrt{5}$

    $\Rightarrow$3x＋2y 的最小值為$- \sqrt{5}$

    當“＝”成立時$\Rightarrow\frac{x}{3}$＝$\frac{2y}{1}\Rightarrow$x＝6y 代入 3x＋2y＝$- \sqrt{5}$

    $\Rightarrow$18y＋2y＝$- \sqrt{5}\Rightarrow$y＝$- \frac{\sqrt{5}}{20}\Rightarrow$x＝6y＝$- \frac{3\sqrt{5}}{10}$

    故數對（x，y）＝$\left( -\frac{3\sqrt{5}}{10} , -\frac{\sqrt{5}}{20} \right)$'
