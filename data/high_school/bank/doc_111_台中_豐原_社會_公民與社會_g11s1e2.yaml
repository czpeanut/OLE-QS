  stem: 某報導指出，無期徒刑收容人發監前的羈押日數若不滿1年，刑法規定不得折抵刑期。許姓受刑人不滿被押985天，卻只能折抵620天，其餘365天等於白押，他要到2022年3月才能提報假釋，因而聲請釋憲。而我國有權聲請釋憲者分為機關聲請與人民聲請兩種，聲請釋憲除了須具備聲請要件之外，請問：下列四位法律人士給予許姓受刑人有關敘述建議何者正確？
