  type: single
  page: 4
  stem: 請根據上文的判斷下列有關遠東航空進行救濟程序的說明何者正確？
  options:
  - label: A
    content: 本案係屬於行政訴訟中的通常訴訟程序事件
  - label: B
    content: 判決敗訴後遠東航空仍可向最高法院提上訴
  - label: C
    content: 本案的救濟程序必須先經訴願前的先行程序
  - label: D
    content: 本案的審理不經訴願程序即可提出行政訴訟
  group_stem: 遠東航空於2019年提出暫停所有航線營運，民航局認為遠航違反《民航法》第48條第3項規定，依《民航法》第112條第4項規定，裁處300萬元罰鍰，並廢止原告民用航空運輸業許可、註銷許可證及獲配航權。遠航不服，提起訴願。關於罰鍰部分，訴願駁回；關於廢止民用航空運輸許可、註銷許可證及獲配航權部分，訴願決定「原處分○○」。遠航對罰鍰部分仍有不服，提起行政訴訟。臺北高等法院認為無預警停飛，侵害旅客權益，影響飛航安全，裁處罰鍰並未違反比例原則，且符合誠實信用原則及正當法律程序，也無裁量怠惰的情事，遠航提告無理由，判決駁回。
