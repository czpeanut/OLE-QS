  type: single
  page: 1
  stem: 憲法是國家基本大法，我國為了維護憲法，設置違憲審查制度，以防止國家行為破壞憲法。關於我國違憲審查制度，下列敘述何者正確？
  options:
  - label: A
    content: 為了維護憲法，除大法官外，普通法院之法官也有宣告法律違憲之權限
  - label: B
    content: 為防止法律違憲，我國採用抽象法規審查制度，大法官可宣告法律違憲
  - label: C
    content: 為防止司法干預地方自治，大法官無法接受直轄市政府聲請之釋憲案件
  - label: D
    content: 為維護人權，人民可針對上訴案件同時提起釋憲，大法官不可拒絕審理
