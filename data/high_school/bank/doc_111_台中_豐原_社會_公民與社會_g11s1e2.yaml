  stem: 我國甲市政府為滿足市民與企業對移工的勞力彈性需求，制定《管理外籍移工轉換雇主自治條例》，某移工乙雖依該條例轉職，然移民署則認為乙已違反中央法令逾期居留，故予以收容，限制乙之人身自由。乙委請律師提起訴訟。依上述題文，關於本案之爭議，下列哪一種情況發生時，可以聲請釋憲？
