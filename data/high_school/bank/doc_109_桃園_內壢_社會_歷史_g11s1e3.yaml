  stem: '本段資料的主旨為何？

    申論題'
  options:
  - label: A
    content: 比利時對剛果的殖民統治政策及成就
  - label: B
    content: 剛果獨立後與比利時政府的親密關係
  - label: C
    content: 剛果獨立後反殖民政府的憤怒與報復
  - label: D
    content: 比利時與剛果對殖民政權不同的理解
  group_stem: ◎請閱讀下列資料後回答問題： 比利時打著提供剛果政治人物權力並同時贏取善意的如意算盤，同意將政權轉移給剛果，期待比利時人能用和以前差不多的方式治理這個國家：剛果人接管政府，比利時則繼續掌握行政系統、軍隊、經濟的國家核心。但比利時支持的派系在選舉中大敗。1960年剛果獨立日當天，比利時國王以傲慢的口吻發表談話：「如今，該由你們好好表現，證明你們值得我們的信任。剛果的獨立代表李奧波德二世國王以某天縱英明構思、以其堅忍勇氣推行的大業，終於大功告成。倉促改革會傷害未來，別換掉比利時交給你們的結構，在你們能做得更好之前。」 剛果總理盧蒙巴起身，譴責比利時帶來的悲慘遭遇與剝削：「因為我們是『黑鬼』，我們早晚被打，嘗遍嘲笑和羞辱……我們看到自己的土地被根據所謂本地的法律予以掠奪，但那法律只保障最強者的權利。我們看到法律遷就白人、殘酷而不人道的對待黑人，我們看到異議者因政治觀點或宗教信仰被放逐到偏遠地區的悲慘遭遇；在自己的國內遭到放逐，境遇比死還慘……最後，誰能忘記打倒我們那麼多同胞的槍砲，誰能忘記當局關押反抗者的監獄，只因為他們不乖乖接受統治，不願接受代表壓迫、剝削的「正義」！ 資料出處：改寫自馬丁‧梅雷蒂斯著、黃中憲譯，《非洲：六十年的獨立史》（新北：衛城，2017），頁131～140
