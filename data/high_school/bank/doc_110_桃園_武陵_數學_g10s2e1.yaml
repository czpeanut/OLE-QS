- id: doc_110_桃園_武陵_數學_g10s2e1_s1_1
  section: 1
  number: 1
  type: calc
  page: 1
  stem: 若〈$a_{n}$〉為等比數列，設$S_{n}$＝$a_{1}$＋$a_{2}$＋…＋$a_{n}$為前n項的和，其中$a_{1}$為首項、r為公比，則下列敘述哪些是正確的？ (1) 數列〈$a_{n}$〉有可能為1, 0, 0, 0, 0,… (2) 設t為正整數，且$a_{1}$＝t＋1、$a_{3}$＝$t^{3}$＋1，則公比r＝$\pm \sqrt{t^{2}-t+2}$ (3) 設k為正整數，且$S_{n}$＝k、$S_{2n}$＝$k^{2}$，則$S_{3n}$＝$k^{3}$ (4) 設k為正整數，且$S_{n}$＝k、$S_{2n}$＝2k，則$S_{3n}$＝3k (5) 承(4)，此時$S_{n}$＝$\frac{a_{1}\times (1-r^{n})}{1-r}$
  answer:
  - (2)(4)
  answer_status: verified
  answer_source: answer_key
  explanation: (1) ×：因為〈$a_{n}$〉為等比數列，所以任一項皆不可能為0。 (2) ○：$a_{3}$＝$a_{1}r^{2}$ ⇒ r＝$\pm \sqrt{\frac{a_{3}}{a_{1}}}$＝$\pm \sqrt{t^{2}-t+1}$。 (3) ×：可知$S_{n}$, $S_{2n}$－$S_{n}$, $S_{3n}$－$S_{2n}$亦為等比數列，所以 ($k^{2}$－k)$^{2}$＝k ($S_{3n}$－$k^{2}$) ⇒ $S_{3n}$＝k (k－1)$^{2}$＋$k^{2}$＝$k^{3}$－$k^{2}$＋k。 (4) ○：承(3)可得 (2k－k)$^{2}$＝k ($S_{3n}$－2k) ⇒ $S_{3n}$＝k＋2k＝3k。 (5) ×：當$S_{n}$＝$S_{2n}$－$S_{n}$時，r＝1 ⇒ $S_{n}$＝$na_{1}$。 故選(2)(4)。
- id: doc_110_桃園_武陵_數學_g10s2e1_s1_2
  section: 1
