  answer:
  - (1) 12；(2) 低度相關；(3) 自然
  answer_status: verified
  answer_source: answer_key
  explanation: '(1) 設丙同學的自然成績為a，μ$_{x}$＝$\frac{12+10+8+11+9}{5}$＝10，μ$_{y}$＝$\frac{15+13+a+9+11}{5}$＝$\frac{48+a}{5}$， 因為迴歸直線必過點 (μ$_{x}$,μ$_{y}$)，所以μ$_{y}$＝0.4μ$_{x}$＋8＝0.4×10＋8＝12⇒$\frac{48+a}{5}$＝12 ⇒ a＝12。

    (2) $S_{xx}$＝$2^{2}$＋$0^{2}$＋(－2)$^{2}$＋$1^{2}$＋(－1)$^{2}$＝10，$S_{yy}$＝$3^{2}$＋$1^{2}$＋$0^{2}$＋(－3)$^{2}$＋(－1)$^{2}$＝20， $S_{xy}$＝2×3＋0×1＋(－2)×0＋1×(－3)＋(－1)×(－1)＝4 所以r＝$\frac{S_{xy}}{\sqrt{S_{xx}}\times \sqrt{S_{yy}}}$＝$\frac{4}{\sqrt{10}\times \sqrt{20}}$＝$\frac{\sqrt{2}}{5}\approx 0.28$，故兩者為低度相關。

    (3) <u>小明</u>數學的標準化成績：$\frac{11-10}{3}$＝$\frac{1}{3}$，而自然的標準化成績：$\frac{13-12}{2}$＝$\frac{1}{2}$ 因為$\frac{1}{3}$＜$\frac{1}{2}$，所以<u>小明</u>的自然學測成績較好。'
