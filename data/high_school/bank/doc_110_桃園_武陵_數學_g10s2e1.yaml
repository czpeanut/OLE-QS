  stem: '數學科的<u>姜尼</u>老師很好奇今年<u>五零</u>高中學生的學測數學成積與自然成績是否呈線性相關，於是找了五位學測生調查他們今年的成績如下表所示。<u>姜尼</u>老師根據這5筆資料算出自然成績(y)對數學成績(x)的迴歸直線方程式為y＝0.4x＋B，但丙同學的自然成績不小心被墨水弄髒了。試根據上述條件回答下列問題：(已知$\sqrt{2}\approx 1.4$)

    $^{ }$(1) 丙同學的自然成績為多少級分？

    $^{ }$(2) 已知兩筆數據相關程度的高低與相關係數r的數值有關，若r＝1表完全正相關，r＝－1表完全負相關，0.7 ≤ | r |＜1表高度相關、0.3 ≤ | r |＜0.7表中度相關、0＜| r |＜0.3表低度相關、r＝0表零相關。試根據上述資料判斷<u>姜尼</u>老師調查的學測數學與自然成績的線性相關程度高底為何？

    $^{ }$(3) 若<u>姜尼</u>老師發現只調查五筆資料不太夠，於是擴大調查了全校700位學測生，發現全校數學與自然成績的算術平均數分別為10級分與12級分、標準差分別為3級分與2級分。若<u>小明</u>也是今年<u>五零</u>高中的學測生，且他的數學與自然成績分別為11級分與13級分，試問<u>小明</u>相對於全校的學測生而言，數學與自然哪科的學測成績較好？'
  assets:
  - key: s3_1_f1
    kind: figure
    file: doc_110_桃園_武陵_數學_g10s2e1/s3_1_f1.png
    crop:
