  stem: '請選出下列敘述正確的選項。 (1) 將一組資料中的每筆資料都加上一個相同的常數後，標準差不變 (2) 線性相關的兩個變數x, y的迴歸直線方程式為 y＝3－5x，則x, y呈現負相關 (3) 兩個變數x, y的相關係數r愈大，相關性愈強 (4) 兩組變量X: $x_{1}$, $x_{2}$,…, $x_{n}$與Y: $y_{1}$, $y_{2}$,…, $y_{n}$，若$y_{i}$＝0.$8x_{i}$＋27 ( i＝1, 2,…, n)，則X與Y的相關係數為1 (5) 兩個變數x, y的相關係數r＜0，表示兩個變數x, y無相關'
  answer:
  - (1)(2)(4)
  answer_status: verified
  answer_source: answer_key
  explanation: (1) ○：數據平移不改變標準差。 (2) ○：因為斜率為－5＜0，所以x與y為負相關。 (3) ×：應為 | r | 愈大，則相關性愈強。 (4) ○：因為斜率為0.8＞0，所以X與Y的相關係數為1。 (5) ×：應為負相關。 故選(1)(2)(4)。
