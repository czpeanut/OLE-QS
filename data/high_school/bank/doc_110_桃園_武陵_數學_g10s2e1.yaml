  explanation: '可知右側與左側設置路燈的位置分別為等差數列〈$a_{n}$〉與等差數列〈$b_{n}$〉，其中$\begin{cases}〈a_{n}〉: 9,20,31,42,53,64,75,86,\cdots \\ 〈b_{n}〉: 6,14,22,30,38,46,54,70,78,86,\cdots\end{cases}$， 而兩數列的共同項亦形成一等差數列〈$c_{n}$〉，其首項為86，公差為88，所以$c_{n}$＝86＋(n－1)×88＝－2＋88n ≤ 1500 ⇒ n ≤$\frac{1502}{88}$⇒ n ≤ 17，故共有17盞路燈相對。'
