  stem: 關於古典萬有引力的特性，下列敘述何者正確？
  options:
  - label: A
    content: 1687年萬有引力定律提出時，牛頓便給出了重力常數G = 6.67×$10^{-11}Nm^{2}$／kg²
  - label: B
    content: 根據萬有引力定律，沒有質量的物體（例如光），是不會受到重力的作用的
  - label: C
    content: 根據萬有引力定律，若兩質點的距離變成原來的兩倍，則彼此間的引力會變為一半
  - label: D
    content: 根據萬有引力定律，若兩質點的質量皆變成原來的兩倍，彼此間的引力也會變為兩倍
  - label: E
    content: 萬有引力只有在星體等大質量物體之間才會有，質量太小的物體之間不會有引力的作用
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)<u>卡文迪</u>之扭秤實驗才得給重力常數之數值；(C)萬有引力與距離成平方反比，故引力變為原$\frac{ 1 }{ 4 }$倍；(D)萬有引力與彼此質量乘積成正比，故引力變為原4倍；(E)質量小的物體間仍會有萬有引力作用。
  tags:
