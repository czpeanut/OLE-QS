  section: 1
  number: 5
  type: single
  page: 1
  stem: 科學的演進從最早各種學科混雜，到後來各領域逐漸獨立出來，而現代又產生了許多跨學科的融合領域，例如在金融數學中，研究期權價格的布萊克-休斯定價模型可用布朗運動過程來模擬股市的隨機波動。另外2021年9月頒發的搞笑諾貝爾物理獎得獎研究中發現，行人在路上走動並閃避其他人的運動模式也可以用布朗運動來預測。請問關於布朗運動的敘述下列何者正確？
  options:
  - label: A
    content: 布朗運動此一現象最早由<u>愛因斯坦</u>發現
  - label: B
    content: 後來<u>布朗</u>因解釋了布朗運動的成因而獲得諾貝爾物理獎
  - label: C
    content: 至今仍無實驗能證實布朗運動的理論是正確的
  - label: D
    content: 布朗運動的解釋使科學家們開始相信原子的存在
  - label: E
    content: 根據布朗運動的解釋，水的溫度越低，花粉微粒的布朗運動會越劇烈
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)最早由生物學家<u>布朗</u>所發現；(B)<u>愛因斯坦</u>因解釋布朗運動的數學模型而獲諾貝爾物理獎；(E)水溫愈低，水分子熱運動趨緩，故花粉微粒較不明顯。
