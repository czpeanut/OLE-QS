- id: doc_112_台北_明倫_數學_數乙_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 設函數 f（x）定義如下：f（x）＝$\begin{cases}ax-b , 若 x\geq 1 \\ x^{2}-x , 若 x<1\end{cases}$，已知 f（x）在 x＝1 可微分，則 a－b 之值為何？
  options:
  - label: A
    content: －1
  - label: B
    content: '0'
  - label: C
    content: －2
  - label: D
    content: '2'
  - label: E
    content: '3'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '$\lim_{x\rightarrow 1^{+}} \frac{f(x)-f(1)}{x-1}$＝$\lim_{x\rightarrow 1^{-}} \frac{f(x)-f(1)}{x-1}$＝f''(1)

    ⇒$\lim_{x\rightarrow 1^{+}} \frac{(ax-b)-(a-b)}{x-1}$＝$\lim_{x\rightarrow 1^{-}} \frac{(x^{2}-x)-(1-1)}{x-1}$

    ⇒$\lim_{x\rightarrow 1^{+}} \frac{a(x-1)}{x-1}$＝$\lim_{x\rightarrow 1^{-}} \frac{x(x-1)}{x-1}$

    ⇒ a＝1

    ∵f（x）在 x＝1 可微分

    ∴f（x）在 x＝1 處連續

    即$\lim_{x\rightarrow 1^{+}} f(x)$＝$\lim_{x\rightarrow 1^{-}} f(x)$＝$\lim_{x\rightarrow 1} f(x)$＝f(1)

    ⇒ 1－b＝$1^{2}$－1＝0 ⇒ b＝1

    故 a－b＝0，選(B)'
