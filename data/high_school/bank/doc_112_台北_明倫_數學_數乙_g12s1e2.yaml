- id: doc_112_台北_明倫_數學_數乙_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 假設 a、b 皆為非零實數，且坐標平面上二次函數 y＝$ax^{2}$＋bx 與一次函數 y＝ax＋b 的圖形相切。則切點所在位置為何？
  options:
  - label: A
    content: 在 x 軸上
  - label: B
    content: 在 y 軸上
  - label: C
    content: 在第一象限
  - label: D
    content: 在第四象限
  - label: E
    content: 當 a＞0，在第一象限；當 a＜0 時，在第四象限
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\begin{cases}y=ax^{2}+bx \\ y=ax+b\end{cases}$

    令 $ax^{2}$＋bx＝ax＋b ⇒ $ax^{2}$＋（b－a）x－b＝0

    ∵圖形相切 ∴判別式 D＝（b－a）$^{2}$－4a．（－b）＝0

    ⇒ $b^{2}$＋2ab＋$a^{2}$＝0 ⇒（b＋a）$^{2}$＝0 ⇒ b＋a＝0

    令 b＝－a 代回原式，

    得 $ax^{2}$－2ax＋a＝0 ⇒ a（x－1）$^{2}$＝0 ⇒ x＝1

    即切點（1，a＋b），

    故切點為（1，0）在 x 軸上

    故選(A)'
