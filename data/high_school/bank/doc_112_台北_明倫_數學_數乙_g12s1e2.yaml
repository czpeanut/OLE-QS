  answer_source: answer_key
  explanation: 'f''（x）＝$6x^{2}$－3

    $\lim_{h\rightarrow 0} \frac{f(2+2h)-f(2)}{3h}$＝$\frac{2}{3}\lim_{2h\rightarrow 0} \frac{f(2+2h)-f(2)}{2h}$

    ＝$\frac{2}{3}$×f''(2)＝$\frac{2}{3}$×21＝14

    故選(B)'
