    即函數 y＝f（x）過 x＝2，x＝0 之切線斜率為 0

    ②∵函數 y＝f''（x）之圖形開口向下

    即 y＝f''（x）之最高項係數為負

    ∴y＝f（x）之最高項係數亦為負

    故選(A)'
