- id: doc_110_台北_松山_數學_數A_g11s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: '下列哪些選項與$L : \frac{x-1}{1}=\frac{y-1}{2}=\frac{z-4}{-3}$為同一條直線？'
  options:
  - label: A
    content: $\frac{x+1}{1}=\frac{y+3}{2}=\frac{z+2}{3}$
  - label: B
    content: $\frac{x-2}{2}=\frac{y-4}{4}=\frac{1-z}{6}$
  - label: C
    content: $\begin{cases}x=1+t \\ y=1+2t \\ z=4-3t\end{cases}$，t 為實數
  - label: D
    content: $\begin{cases}2x-y=0 \\ 3x+z-7=0\end{cases}$
  - label: E
    content: $\begin{cases}5x-y+z=8 \\ 3x+z-7=0\end{cases}$
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 'L 過 P（1，1，4），方向向量$\vec{v}$＝（1，2，－3）

    (A) ╳：$\vec{v_{1}}$＝（1，2，3）⇒$\vec{v_{1}}//＼\vec{v}$

    (B) ╳：$\vec{v_{2}}$＝（2，4，6）⇒$\vec{v_{2}}//＼\vec{v}$

    (C) ○：$\vec{v_{3}}$＝（1，2，－3），過（1，1，4）

    (D) ╳：（1＋t，1＋2t，4－3t）代入$\begin{cases}2x-y=0 \\ 3x+z-7=0\end{cases}$不滿足

    (E) ○：（1＋t，1＋2t，4－3t）代入$\begin{cases}5x-y+z=8 \\ 3x+z-7=0\end{cases}$滿足

    故選(C)(E)'
