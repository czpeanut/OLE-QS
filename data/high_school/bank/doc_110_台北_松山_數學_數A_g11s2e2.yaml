  answer:
  - ╳
  answer_status: verified
  answer_source: answer_key
  explanation: '╳：$\sqrt{(x-1)^{2}+(y+3)^{2}+z^{2}}$的最小值

    即點（1，－3，0）到平面 2x－y＋z－1＝0 的距離

    ∴最小值為$\frac{| 2 \cdot 1-(-3)+0-1 |}{\sqrt{2^{2}+(-1)^{2}+1^{2}}}=\frac{4}{\sqrt{6}}=\frac{2\sqrt{6}}{3}$'
