- id: doc_110_台北_松山_數學_數A_g11s2e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 空間坐標中，$L_{1}$：$\begin{cases}\frac{x-1}{2}=\frac{y-3}{3} \\ z=6\end{cases}$，$L_{2}$：$\frac{x-1}{-3}=\frac{y-3}{-1}=\frac{z-6}{6}$，E：3x－2y＝－3，則下列敘述何者正確？
  options:
  - label: A
    content: $L_{1}$ 和 $L_{2}$ 恰交於一點
  - label: B
    content: $L_{1}$ 和 E 恰交於一點
  - label: C
    content: $L_{2}$ 和 E 恰交於一點
  - label: D
    content: $L_{1}$ 和 xz 平面恰交於一點
  - label: E
    content: $L_{2}$ 和 yz 平面恰交於一點
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：設 $L_{2}$ 上一點 P（1－3t，3－t，6＋6t）

    代入 $L_{1}$：$\begin{cases}\frac{(1-3t)-1}{2}=\frac{(3-t)-3}{3} \\ 6+6t=6\end{cases}$ ⇒ t＝0

    ∴交於一點（1，3，6）

    (B) ╳：$L_{1}$ 與 E 求交點 ⇒$\begin{cases}\frac{x-1}{2}=\frac{y-3}{3} \\ z=6 \\ 3x-2y=-3\end{cases}$

    ⇒$\begin{cases}3x-2y=-3 \\ z=6 \\ 3x-2y=-3\end{cases}$表無限多解（$L_{1}\subseteq$E）

    (C) ○：設 $L_{2}$ 上一點 Q（1－3t，3－t，6＋6t）

    代入 E：3（1－3t）－2（3－t）＝－3

    ⇒ －7t＝0 ⇒ t＝0

    ∴交於一點（1，3，6）

    (D) ○：$L_{1}$ 與 xz 平面（y＝0）求交點 ⇒$\begin{cases}\frac{x-1}{2}=\frac{y-3}{3} \\ z=6 \\ y=0\end{cases}$

    ⇒ x＝－1，y＝0，z＝6

    即交於一點（－1，0，6）

    (E) ○：設 $L_{2}$ 上一點 R（1－3t，3－t，6＋6t）

    代入 yz 平面（x＝0）：1－3t＝0 ⇒ t＝$\frac{1}{3}$

    ∴交於一點$\left( 0 , \frac{8}{3} , 8 \right)$

    故選(A)(C)(D)(E)'
  tags:
    unit:
      code: MA-A4-2-2
      book: 數學4A
