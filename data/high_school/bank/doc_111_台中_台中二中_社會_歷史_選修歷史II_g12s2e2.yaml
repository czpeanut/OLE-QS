  explanation: '「某物品」曾被印第安人作為人神溝通的媒介，雖能製成藥品，但因為有致癮性而被貼上負面標籤，可推知為(A)菸草。(B)(C)(D)未被作為人神溝通的媒介。

    18.1930 年代「經濟大恐慌」時期，電視事業尚未開展，傳播速度最快的大眾傳媒為(B)無線電（廣播）與電影，因此經常為各國領袖運用在宣傳政策與思想上。

    19.「農業出現」約在距今(B)一萬年前。

    20.從「詳記各種藥物的特性與用途」一句，說明這本書應是專門記載藥物的本草書籍，(A)(B)(D)皆屬醫書，藥物的記載不多，因此答案為(C)《本草綱目》，於明末清初傳至海外，被翻譯成多國語言出版。

    21.(A)雜劇以一般庶民大眾為主要收視群。(B)昏官最後受到制裁。(C)竇娥的形象描述甚為生動鮮明，成為元雜劇的經典。

    22.孟山都公司以發展生物科技為主，推出基因改造作物種子與農藥、殺蟲劑等產品，影響世界農業發展甚鉅，傷害也相對大，但不包括(C)種族迫害。

    23.(D)克里米亞戰爭發生於 1853 ～ 1856 年，當時電影技術尚未出現。

    24.根據學者研究與推測，復活節島上大部分的石像都矗立在海邊，很可能為(B)守護沿海的地下水源。

    25.題文所述為 20 世紀意識流小說，代表作家為(D)吳爾芙。(A)(C) 19 世紀前期浪漫主義代表。(B) 19 世紀後期寫實主義代表。

    26.日治時期，臺灣(D)香蕉曾大量外銷日本，號稱為「香蕉王國」。

    27.題文主要說明早期鐵路運輸有嚴重的空氣汙染問題，因此不得不將鐵路移往地下，直到使用電取代煤後，才解決空氣汙染問題，因此(C)為正解。

    28.咖啡原產於衣索比亞，後在伊斯蘭世界大為盛行，約 17 世紀後傳入歐洲，因此答案為(C)資料一→資料二→資料三。

    29.(A)希臘文化重視人文思想，除了永生，神的世界幾乎與人的世界無異。(C)拜占庭帝國的宗教藝術著重彰顯神聖性，神像的形象呈現有一定的規範。(D)中世紀後期的教堂盛行哥德式建築，以尖拱、尖塔、彩繪玻璃窗與飛扶壁為特色。

    30.由「講佛經」一句，可知此為佛、道人士的開講傳道，稱為(C)俗講。

    31.(A) 1930 年代、(B) 1860 年代、(D) 1804 年，三者時間皆與題文不符。

    32.17 世紀的英國在國內政局穩定後，也開始積極加入海外探險的行列，(A)為正解。(B) 18 世紀中葉。(C) 19 世紀初。(D) 16 世紀。

    33.(A)希臘化藝術。(B)拜占庭帝國藝術。(C)中古後期哥德式建築。答案為(D)。

    34.宋代後印刷術發達，使科考競爭激烈，不少士人在科考不順下轉而習醫，因此形成「儒醫」，答案為(C)。

    35.題文主張統治者應「穀不可勝食」、「魚鱉不可勝食」、「材木不可勝用」，即掌控資源的運用，不過度耗費，(C)為正解。

    36.廣播的聽眾傾向支持尼克森，電視的觀眾則支持甘迺迪，可見不同的傳媒對政治人物觀感會造成落差，(C)為正解。

    37.(A)「鐵道能教化人民」為歐洲強權的宣傳，非真有此功效。(B)應是新帝國主義。(C)社會達爾文主義的理論將人分為高低不同等級，非人人平等。

    38.(A)為正解。(B)(C)(D)三者與事實不符。

    39.「醫療傳道」是指 19 世紀傳教士來臺，以醫療服務方式來傳教，以長老教會表現最為積極，以加拿大的馬偕、英國的馬雅各最有名，(B)為正解。

    40.(A)當時中醫仍是臺人比較接受的醫療體系。(B)宗教醫療、民俗醫療依然存在。(D)西方醫療體系起初遭臺人排擠。'
