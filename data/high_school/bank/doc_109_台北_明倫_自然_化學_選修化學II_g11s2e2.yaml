  stem: 下列有關化學鍵敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 化學鍵是原子和原子之間的作用力，可分為四種，分別是離子鍵、共價鍵、金屬鍵以及氫鍵
  - label: B
    content: 離子鍵主要是由陰離子與陽離子間的靜電引力所造成
  - label: C
    content: 共價鍵的偶極矩主要是因鍵結電子對在兩鍵結原子間分布不均所致
  - label: D
    content: 金屬鍵是金屬陽離子和自由電子間的吸引力
  - label: E
    content: 非極性的分子可能具有極性的共價鍵
  answer:
  - A
