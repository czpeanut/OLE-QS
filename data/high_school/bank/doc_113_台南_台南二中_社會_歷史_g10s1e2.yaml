  - label: D
    content: 施九緞事件
  group_stem: 清治臺灣社會衝突嚴重的原因很多，清朝政府輕率、無能的辦事態度，以及縱容地方衙役、綠營士兵間互鬥，也要負相當責任。臺灣的地方政府從不把在地居民視為一體，沒有「臺灣人」這種族群，臺灣居民仍然是泉州人、漳州人和客家人。對於彌補群族間的裂隙，有關當局也都沒有採取任何有效措施。一旦民間爆發械鬥，地方官員基於擔心轉成民變事件，常常做出匪夷所思的判斷。有時不敢、不願介入械鬥，錯失尋求妥善解決之機，有時則是相反，積極介入械鬥後，反而擴大、惡化整個衝突局面。部分不肖的官員、衙役或綠營士兵，假藉「會拿」的名義，實際上對地方人士勒索錢財，擒拿肇事者只是他們的附屬任務，更惡劣的狀況是，如果勒索不成，甚至會放火把村莊給燒了。另外，這批從福建、廣東渡海而來的綠營班兵，因三年一調而長期離鄉背井，臺灣複雜的社會環境、朝廷鞭長莫及的管理，讓他們也經常興風作浪，成為社會案件的主角，包娼、開當鋪和賭場、搶劫樣樣都來。從福建廈門同安來臺南府城駐紮的班兵，就曾建立區域信仰的祖廟公廳，聚集一起彼此隨時支持，搞不清楚是為了保安平亂，還是自成黨派為非做歹。1789 年（乾隆 54 年），在彰化縣發生班兵向當地居民借錢，因欠債反而被殺的例子。其他班兵因故內鬥的案例更是層出不窮。
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
