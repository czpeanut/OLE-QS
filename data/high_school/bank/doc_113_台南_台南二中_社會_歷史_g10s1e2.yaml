  group_stem: '資料一：殖產局以建設此處為臺灣的丹麥為目標，政府對移民的農業指導，以及灌溉水路規劃設施都不錯。……主要農作物是水稻、甘蔗、煙草、落花生等，收益順序是煙草、水稻、甘蔗。煙草及甘蔗自耕，收成不錯，水田則給本島人贌耕，或者提供種子及肥料給本島人合作耕種，收穫以成數比例分帳。

    資料二：抵達時已有移民指導所、小學校、警察派出所、寺院等設備，使我信心大增。但當時流行瘧疾、黑水熱等疾病，我非常害怕染上風土病。移住不久，我就患上了瘧疾，非常痛苦，家人也患了黑水熱，我十分擔心難以醫治，所幸都治癒了。……移住之初，這裡到處都長著管芒，費了很多心血開墾，而且好不容易開墾的耕地上，栽種的作物隨時都會被很多野豬破壞，無論種什麼都被野豬吃掉，真是苦不堪言。

    資料三：我家位於空軍子弟小學旁，由空軍後勤司令部列管輔導。其他空軍村莊大多服役雷虎小組、警衛旅、防砲團等單位官兵眷屬。……回想小時候一見空軍到廣場放映電影，怕占不到好位子，就急忙回家拿張小板凳，端著晚餐，邊看電影邊吃飯，煞是有趣。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
