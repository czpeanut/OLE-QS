- id: doc_113_台南_台南二中_社會_歷史_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 日治時期，臺灣的高等教育機構少，臺灣人錄取名額有限，競爭十分激烈，故很多臺灣人選擇前往國外留學。當時若想要接受高等教育，有三個選擇：一是到日本留學，優點是較少被差別待遇，但學費高；二是到中國留學，優點是學費較低、學校多、選擇性多，也能享有「華僑」的待遇，但若遇到排日、抗日事件，往往遭受波及；三是到日本人在中國、朝鮮經營的學校。根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 臺人若想接受高等教育，一定要選擇至日本留學
  - label: B
    content: 臺灣的高等教育機構少，是因日本差別待遇所致
  - label: C
    content: 日本在中國經營的學校位於四川，深受臺人歡迎
  - label: D
    content: 留學海外的新知識分子，社會聲望不及傳統士紳
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)除了日本外，也能到日本人在中國、朝鮮經營的學校。(C)題文並未說明日本在中國經營的學校位於何地，且根據歷史，學校應在中國東北地區的可能性更高。(D)當時留學海外的新知識分子，社會聲望較傳統士紳高。
- id: doc_113_台南_台南二中_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '資料一： 這場動亂的主謀者號召支持者：「設香案三層，謂花上供五祖」，「入會者為舊香，跣足散髮，首纏紅布，分執其事」，凡入會者「授以八卦隱語，會眾相逢，皆稱兄弟」。

    資料二：這一年，朝廷命令出身中部士紳、臺灣兵備道率大陸軍隊渡臺鎮壓，並得竹塹（新竹）士紳的鄉勇配合會師，收回彰化縣城。

    根據以上兩則資料所述，下列敘述何者正確？'
  options:
  - label: A
    content: 此次動亂後，清帝國為了增強地方控制力，另立彰化縣
  - label: B
    content: 此次動亂波及全臺，致使清帝國開始使用磚石建彰化城
  - label: C
    content: 閩客於此次動亂中內鬨，清帝國因此順利收回彰化縣城
  - label: D
    content: 霧峰林家帶領鄉勇，建立軍功，一躍成為中部的大家族
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從資料一「授以八卦隱語」、資料二以中部士紳、新竹士紳的鄉勇配合會師「收回彰化縣城」等線索，推知此動亂為戴潮春事件，因此正確答案為(D)。(A)戴潮春始於同治元年，彰化縣早於雍正元年已建立。(B)林爽文之役後，已可使用磚石建築城牆。(C)此次動亂並無客籍人士參與。
- id: doc_113_台南_台南二中_社會_歷史_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 官員臺灣道徐宗幹曾言：「各省吏治之壞，至閩南而極；閩中吏治之壞，至臺灣而極。」可知臺灣吏治敗壞之嚴重，而臺灣之所以出現此狀，其因在於清帝國為防臺而治臺的消極心態。有關清帝國消極治臺政策及其所引發的問題與影響，下列敘述何者正確？
  options:
  - label: A
    content: 為避免耗費過多人力，最初並未設置行政區劃
  - label: B
    content: 避免臺灣形成武裝勢力，執行臺人當兵輪調制
  - label: C
    content: 因臺灣孤懸海外，清廷監督考察地方官員不力
  - label: D
    content: 朱一貴事件後，清廷改以土石築城，加強防衛
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)康熙將臺灣納入版圖時即設置行政區劃。(B)實施班兵制，兵員全自福建召募，三年輪調。(D)林爽文事件後，清廷才改以土石築城。
- id: doc_113_台南_台南二中_社會_歷史_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 乾隆 16 年（1751 年），姜勝本墾號得到當時官府核發之墾照，因而得以開墾今日部分桃園地區。請問當時核發墾照的官府，應為何地的官府？
  options:
  - label: A
    content: 臺灣府淡水廳
  - label: B
    content: 臺灣府諸羅縣
  - label: C
    content: 臺北府淡水縣
  - label: D
    content: 臺北府新竹縣
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 雍正 5 年在諸羅縣以北增設彰化縣、淡水廳，桃園地區屬於(A)臺灣府淡水廳。(B)為今日嘉義一帶。(C)(D)光緒元年的行政區劃。
- id: doc_113_台南_台南二中_社會_歷史_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 英國外相艾登曾言：「〈開羅宣言〉是一個將臺灣在戰後移交還給中國的意向聲明。事實上，此一交還從未發生，因為有兩個政治實體要求代表中國的困難存在，還有各強權對這些實體的地位有歧見所致。……1945 年 9 月，中國軍隊依據盟軍總司令的命令從日軍手中接收臺灣，但這不是轉讓，它也不涉及任何主權的改變。蔣中正在該島實施軍事占領，此一安排仍未進行最後確定，此一軍事占領並不構成臺灣成為中國的領土。」下列哪一文件與英國外相的說法較為接近？
  options:
  - label: A
    content: 《中美共同防禦條約》
  - label: B
    content: 《臺灣關係法》
  - label: C
    content: 《建交公報》
  - label: D
    content: 《舊金山和約》
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 英國外相認為中國軍隊自日軍手中接收臺灣，並不涉及任何主權的改變，並強調蔣中正的軍事占領並不構成臺灣成為中國的領土，此即「臺灣地位未定」的說法，較接近(D)《舊金山和約》，日本僅宣稱放棄臺、澎，並未明確提出臺、澎主權之歸屬。(A)主張臺灣政權為中華民國。(B)(C)在「一個中國」原則下，認為臺灣主權該歸屬於中華人民共和國。
- id: doc_113_台南_台南二中_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 1914 年，某一組織其書面演說如下：「宜待之以友邦而期成長發達，其中者，因其不能武裝而獨立，故使之為保護國，或為屬較適當。至其又小者，則臨之以同化主義，採取渾然融合之方策固屬當然。倘所聞不誤則臺灣總督府亦係採取同化主義者。……」根據上文，下列敘述何者正確？
  options:
  - label: A
    content: 當時的統治方針為內地延長主義
  - label: B
    content: 該組織主張臺日應享有同樣待遇
  - label: C
    content: 文中提到的組織為臺灣文化協會
  - label: D
    content: 當時所施行的法律依據為《六三法》
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '從題文可知，此組織主張日本應以友邦之禮對待臺灣，或者將臺灣做為保護國，或者至少可以同化主義對待臺灣，因此可推知為「臺灣同化會」，主張臺灣與日本應享有同樣的地位與待遇，故(B)為正解。(A) 1914 年時，日本對臺採取特殊統治方式，或者稱「無方針主義」。(C)臺灣同化會，臺灣文化協會於 1921 年才成立。(D) 1907 年後已改實施《三一法》。

    7.1949 年隨政府搬遷來臺的外省移民甚多，為增加生產，政府在各地山區、花蓮、臺東等地推行兵工墾殖，許多來臺眷屬被分派至各地協助開墾，並參與經濟建設的興建，因此答案為(D)軍人。從地名「臺中縣和平鄉」、作者對高山耕作生活「始料未及」兩點，可判斷主角並非日治時期來臺的農業移民，故不選(A)。

    8.從資料(2)(3)的敘述，臺灣為日本人、中國人、西班牙人、荷蘭人的海外通商根據地，但是後來荷蘭人獨占臺灣的管轄權，因此在臺日本人不服，自然不願向荷蘭人繳稅，(C)為正解。

    9.從資料(6)(7)的敘述，可見伊能嘉矩認為臺灣在清朝的不當統治下，內憂外患不斷，但(B)三藩之亂發生於鄭氏治臺時期，亂事地點也並非在臺灣，因此不可能是伊能嘉矩持負面評價的原因。

    10.這起司法案件的結果，是高等法院的部長職位與法官身分都被剝奪，「侵犯了憲法賦予其法官的身分保障」，可見臺灣此時處於不受憲法保障的時期，應為 1896 ～ 1906 年《六三法》的時期，因此正確答案為(D)。《三一法》時期，總督的律令不得牴觸日本國內法。《法三號》時期，日本本土法律適用於臺灣，兩個時期不會發生如題文資料的司法爭議。

    11.(A)兒玉源太郎總督以《匪徒刑罰》令鎮壓、招降等方式，才使抗日三猛陸續歸順。(B)後期武裝抗日受到中華民國建國影響，帶有民族主義性質。(C)日本對臺控制更進一步，確立警察權並以保甲協助維持秩序，許多抗日行動早在密謀階段即已被破獲。

    12.臺灣總督府解散的這一結社為「採行階級鬥爭的政治結社」，可推斷為已經激進化的(B)臺灣民眾黨。(A)屬於文化結社。(C)為爭取農民權益的結社，並非以民族運動為中心的政治結社。(D)非激進的政治結社，並未被臺灣總督府強行解散。

    13.1930 年代受到經濟大恐慌影響，日本右派勢力崛起，軍國主義氣氛瀰漫，因此政府當局對人民集會、結社與言論管控更趨嚴格。1931 年臺灣總督府開始嚴加取締人民的政治活動，許多左派團體逐漸面臨打擊而結束，故(C)為正解。

    14.這份歷史文件所述內容為 1971 年臺灣退出聯合國，符合當時的國際局勢敘述為(A)。(B)採取彈性外交，務實外交為李登輝時期。(C) 1949 年國共內戰末期發布。(D) 1950 年韓戰爆發後。

    15.題文中提到臺灣「奉詔改為行省」，可推知這位建議就地籌劃臺灣賦稅的官員應是省長劉銘傳，因此正確答案為(A)。(B)由林朝棟所率領的清朝地方兵團所平定，並非鄉勇。(C)此為沈葆楨的事蹟。(D)大嵙崁設置「全臺撫墾總局」，負責管理和照顧原住民族的事務。「招墾局」係招募大陸民眾來臺開墾的機構，為丁日昌所設。

    16.從「廢止巡檢司」一句，推斷這個被明朝拋棄的島為澎湖，在官方力量撤離後，反成為倭寇、海盜、流民的聚集地，因此正確答案為(C)。(A)明朝後期在澎湖增設遊兵加強管理。(B)此為清治前期的臺灣現象，並非澎湖。(D)應為「墟澎」政策。

    17.資料中的人物認為要統治新占領地區，應要先調查當地的習俗才能配合施政，因此可推知為主張生物學統治原理的(D)後藤新平。

    18.資料一限制臺灣總督的命令不得違反已施行於臺灣之法律及特別法律，為 1907 年起的《三一法》。資料二限制總督的立法範圍，但並無「特別法律」一項，故為 1922 年起的《法三號》。資料三總督的命令需經由評議會議決，再經拓務大臣奏請敕裁，此為《六三法》的規定。正確答案為(C)，林獻堂等人發起撤廢《六三法》的時間為 1918 年，當時為《三一法》時期。(A)五年理蕃計畫始於 1910 年，應是資料一時期。(B)資料二應是文官總督時期。(D)三則資料時間順序為三→一→二。

    19.題文顯示，此時的臺灣文化協會要成為階級鬥爭的戰鬥團體，可推斷為 1927 年後的「新文協」，因此正確答案為(B)。(A)主持人可能為連溫卿。(C)從題文判斷，其目的應是推行激烈的農工運動。(D)應是臺灣共產黨，臺灣文化協會並非受共產際策動而組成的團體。

    20.新北市中和華新街聚集了許多滯留泰、緬撤退來臺的雲南軍隊後裔，與因經濟考量移民來臺的緬甸華僑，俗稱「緬甸街」，因此在飲食上便傳承了雲南與緬甸的文化，(A)為正解。

    21.題文所述為日治時期的新聞報導，從內容來判斷，正確答案為(A)。(B)日治時期。(C)警察不僅從事戶口調查，要負責通報、發放防疫物資等工作，職責並非有限。(D)日治時期採取西醫防疫模式，並非延續清代策略。

    22.從施政目標來看，這一時期應是 1919 年起的內地延長主義時期，日本改派文官總督來臺治理，正確答案為(D)。(A)法律依據為《法三號》。(B)此時為一戰結束後，國際盛行民族自決風潮。(C)並未全面廢除差別待遇。

    23.從鐵路已開至新竹縣、後續經費不足而難以為繼等線索，可推知這位官員應是邵友濂，由於經費有限而使臺灣的自強新政建設開始緊縮，答案為(C)。

    24.作家的意思是臺灣眷村發展出來的「川味牛肉麵」、「蒙古烤肉」已融入臺灣在地特色，與原鄉料理明顯不同，答案為(B)。(A)眷村居民為大陸搬遷來臺移民，自是將家鄉特色料理帶入臺灣，並非單純思鄉而已。(C)加入臺灣食材與料理加以變化，其特色並非消逝殆盡。(D)題文僅談料理特色，無關勝負。

    25.從蒐集的資料為族譜、旅券（護照）、名簿與戶口調查等，可知此「歷史考察」的主題與「人」相關，加上旅券（護照）為移動需要的文件，因此答案為(A)。

    26.從「言我等一經歸順……」之句，可見鄭經主張「歸順全在一點真心」，請康熙同意不必剃髮，願照朝鮮例入貢，因此答案選(C)不選(A)。(B)文中無法判斷康熙是否同意鄭經之語。(D)題文僅討論臺灣，未提及中國大陸東南沿岸經濟據點。

    27.從以「國語使用程度」作為選擇就讀不同初等學校的標準來看，可推知此時為同化主義時期，對臺統治採取內地延長主義策略，因此答案為(D)。(A)臺地於 1915 年後已無武裝抗日，題文的教育制度改革與此無關。(B)皇民化時期的教育政策。(C)日治之初無方針主義時期。

    28.題文所述為始於 1936 年底的皇民化運動時期，(A)(C)(D)皆符合當時的社會生活狀況，僅(B)西部縱貫鐵路於 1908 年通車，首次試乘應於日治初期武官總督統治時期。

    29.從「將帝國議會所制定的法律施行於臺灣，這種忽視殖民地特性的做法，並不是最好的殖民統治政策」，可知林呈祿反對日本的同化政策，(C)為正解。(A)此時日本已考慮對臺灣實施同化政策。(B)林呈祿反對臺灣被日本同化。(D)日本忽視臺灣特性乃為因應國際民族自決風潮，便於統治殖民地的策略，並非為阻止臺灣獨立。

    30.兩岸對峙之初，共軍對臺灣政權的武力威脅從未停止，卻在 1950 年後取消攻擊金門計畫，此時最大的變數應該是韓戰爆發，美國派第七艦隊協防臺灣海峽，(A)為正解。(B)(C)從題文來看，此時共軍較國軍更占優勢。(D)臺灣於 1949 年 5 月 20 日即已實施戒嚴。

    31.(B)東南亞較明顯的排華運動發生於 1960 年代後，當時受到影響而遷來臺灣的華僑並不多，且大部分遷移來臺華僑多為經濟考量。

    32.(A)鄭成功的行政中心設置於福建的思明州，管轄廈門、金門等島嶼。(B)鄭成功的安撫司設於澎湖。(C)澎湖安撫司於鄭成功時期已設置，鄭經於臺灣增設南北兩路安撫司。

    33.(A)東南亞移工於 1989 年起合法引進。(B)通稱「外省人」，非「新住民」。(D)是「各省移民」，非「滇緬移民」。

    34.「美臺團」隸屬於臺灣文化協會，因此答案為(D)。(A) 1927 年連溫卿主持後，轉為左派路線。(B)此為臺灣共產黨的目標。(C)該組織為臺灣文化協會。

    35.題文節錄自 1923 年《臺灣民報》的發刊詞，文中批判學習漢文毫無用處，因此「自二十年來已經廢棄不慣了」，顯示此時日本統治臺灣已有一段較長的時間，臺灣人多已使用日語而不再積極學習漢文，顯見此時並非日本統治之初，也非強迫廢止漢文的皇民化運動時期，因此答案為(B)。(A)(D)為日治初期。(C)為皇民化運動時期。

    36.資料一中政府能對移民提供不錯的農業指導與各種規劃，應是在吉野村移民成功之後，汲取經驗所致；資料二的移民環境仍十分惡劣，應為早期移民（吉野村）初墾時期；資料三應為戰後臺灣眷村生活情景，因此依時間先後順序為(B)資料二→資料一→資料三。

    37.(A)為紓解國內過剩人口及日資在臺開發的需求，因此日本政府招募大量農業移民來臺，首先在花蓮、臺東一帶廣設移民村。

    38.眷村多分布於營區附近或市郊，答案為(B)。(A)帶來大陸各省的飲食文化。(C)眷村名稱有按軍種或按經費來源命名，反映其組成身分與背景。(D)眷村成員為大陸來臺的外省移民，因戰亂而遷移。

    39.資料一強調兩國共同維護和平與建立集體防禦，故為 1954 年《中美共同防禦條約》；資料二願提供防禦性武器給臺灣人民，故為 1979 年的《臺灣關係法》；資料三說明美國承認中華人民共和國政府，並將與臺灣人民保持非官方關係，故為 1978 年底的《建交公報》，因此三則資料的時間先後順序為(A)資料一→資料三→資料二。

    40.資料二美國表示願提供防禦性武器給臺灣人民，以維護臺灣人民安全及社會經濟制度，故為(C)《臺灣關係法》。

    41.韓戰之後，美國擔憂共產勢力蔓延，除了派遣第七艦隊協防臺灣海峽外，並於 1954 年與臺灣簽訂《中美共同防禦條約》，使中華民國加入太平洋反共陣線，(C)為正解。(A) 1941 年。(B) 1969 年後。(D) 1950 年後。

    42.班兵原為清治初期自福建調來戍守臺灣的兵員，但從題文來看，這些班兵常興風作浪、勒索百姓，反而造成社會更加動盪，因此答案為(D)。(A)班兵並未積極介入械鬥處理，反倒會假藉「會拿」名義向地方勒索錢財。(B)並未掌控械鬥肇事者的錢財。(C)臺南的班兵建立區域信仰的祖廟公廳，分不清是保安平亂，還是自成黨派為非做歹，可見作者不認為他們有效遏止宗教類械鬥。

    43.根據題文的敘述，不肖官員、衙役或綠營士兵，會假藉會拿名義向地方人士勒索錢財，如果勒索不成，甚至會放火將村莊燒掉，因此答案為(B)。(A)(C)(D)三者與題文敘述不同。

    44.(B)林爽文為漳州人，清廷除派遣綠營兵來臺平亂後，並借助臺灣「泉州義民軍」、「客家義民軍」、原住民民兵平亂，可謂是利用族群間的裂痕以有效平定動亂。事件平定後，乾隆並賜匾予各籍人民，其中以客家人的「褒忠義民廟」知名度最高。

    45.選項中與林爽文事件相關者為(D)，在此之前，地方防禦工事僅能以竹籬、木柵做成，事件後則可以磚石建築城牆。(A)至嘉慶 17 年才再度調整行政區劃。(B)事變原因與官兵查緝會黨有關。(C)此時地方少有士紳，且在防臺的情況下並不允許組織團練。

    46.(B)羅妹號事件後並未調整行政區劃，是在日軍侵臺、清法戰爭後。(C)因海盜侵擾而增設的行政區劃為噶瑪蘭廳。(E)應是林爽文事件後，朝廷將諸羅更名為嘉義。

    47.(A)元代才於澎湖設置巡檢司。(E)《馬關條約》的割地範圍並不包括金、馬。

    48.從「敬皇尊神」、「防空防諜防犯」、「軍事援護」等實踐要綱，可推知此時為戰時皇民化運動時期，因此正確答案為(B)(E)。(A)此時的出席者應是被強制參加，其人數不代表集會結社十分自由。(C)應是神道教，非道教。(D)此時的「國語」指日語。

    49.(A)總督府於 1943 年才推行義務教育。(C)臺中中學校為臺灣子弟就讀的中學校。

    50.(C)這些入選者皆為觀光景點，為當時交通可抵達之處，並非偏僻的高山。'
