  group_stem: 液態化石燃料─石油，首先在 19 世紀下半葉開始使用，起初用途為替代鯨魚油用於照明上，1860 年代開始研發出的第一批內燃機展現了如何從石油中產生的機械力。和熱能來自於外部的蒸汽機不同，石油熱能能在內燃機裡直接推動活塞、轉子或渦輪。內燃機在 20 世紀上半葉迅速擴散，多半是因為它們在戰時運送士兵及裝備，推動坦克車和機動部隊。它們也被安裝在最早的軍用飛機上，使其成為從空中投擲炸彈的先鋒。一旦戰爭結束，汽車和飛機的製造商就轉向民用市場，創造出一個個人能擁有並駕駛的車輛，或乘坐飛機移動的世界。全球運輸也因油輪、貨櫃船和大型飛機而轉變了。請問：
