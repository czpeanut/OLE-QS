  group_stem: '資料一：2015 年聯合國文件〈改變我們的世界〉提到：「所有國家和所有利益攸關方將攜手合作，讓人類擺脫貧困和匱乏，讓地球治癒創傷並得到保護。我們須採取迫切的變革步驟，讓世界走上可持續且有恢復力的道路。人類：我們決心消除一切形式和表現的貧困與飢餓，讓所有人平等和有尊嚴的在一個健康的環境中充分發揮自己的潛能；地球：我們決心阻止地球的退化，包括以可持續的方式進行消費和生產，管理地球的自然資源，在氣候變化問題上採取行動，使地球能滿足於後代的需求；繁榮：我們決心讓所有人過上繁榮充實的生活，在與自然和諧相處的同時，實現經濟、社會和技術的進步。」

    資料二：2015 年聯合國氣候峰會通過《巴黎協定》，協定目標如下：「把全球平均氣溫升幅控制在工業化前水平以上低於 2 ℃之內，並努力將氣溫升幅限制在工業化前水平以上 1.5 ℃之內，同時認識到這將大大減少氣候變化的風險和影響；提高適應氣候變化不利影響的能力，並以不威脅糧食生產的方式增強氣候抗禦力和溫室氣體低排放發展；使資金流動符合溫室氣體低排放和氣候適應型發展的路徑。」'
