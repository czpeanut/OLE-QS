  - label: D
    content: 從此以後臺北居民只祭拜媽祖
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)媽祖原本是管航海平安之神，但深受臺灣人的信仰與愛戴，以其靈驗有求必應，其功能也因此擴大為助戰、平亂、除瘟疫、病蟲害、降雨、治病、救災等，甚至兼具婚姻、生育、護幼等母性職務，反映出臺灣民間信仰與時俱進的變化。
