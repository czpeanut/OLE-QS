    22.19 世紀後期，西方藝術派別從寫實主義漸漸發展出印象派畫風，雷諾瓦即為印象派的代表畫家，因此畫面重視呈現光線明暗的變化，從其以嚴謹的筆觸及清晰的輪廓呈現法國街頭上的人群來看，可知其亦沿襲寫實主義的技術與風格，(B)為正解。(A)(C)從畫面街頭散步的男女衣著來看，並非勞工階級，也與女性工作權無關。(D)與畫面所呈現風格明顯不符。

    23.(A)各部落依然努力在保存與復振傳統語言文化。(B)基督宗教引進新的文化與信仰，改變部落的生活方式。(C)主要是政治因素。

    24.從戲曲創作「以女性主義的觀點」或「注重本土化角度」的轉變來看，可知應是(B)政府宣布解嚴後，讓戲曲文化能夠多元發展。

    25.從「一年一度的藝術展在羅浮宮大畫廊閉幕」的註解，推測此應為 19 世紀歐洲的官方藝術展覽會，當時能在沙龍展出的審核標準由學院派藝術家所壟斷，因此展出的畫作會呈現特定的主題與統一的美學風格，(B)為正解。(A)現代主義的印象派風格不為學院派所接受。(C)(D)沙龍的藝術展係由官方所籌辦，呈現當時主流的審美觀念。

    26.「晉尚韻，唐尚法」是指晉代以神韻瀟灑的行書為主流，唐代則以端正整齊的楷書為主流，因此(D)為正解。(A)行書較能發揮書法家的個人性格。(B)唐代將楷書列入科舉項目，但並未規範民間須一致使用。(C)行書為晉代文人日常使用的字體，並非官場風行。

    27.從王船、代天府、和瘟押煞等關鍵詞，即可推知此宗教節慶活動與王爺信仰有關，最早為古人驅瘟逐疫的儀式，(C)為正解。

    28.文章前面說明中國正經歷了從舊文學發展到新文學的階段，但作者最後卻遺憾「這陣暴風雨卻打不到海外孤懸的小島」一句，表示惋惜臺灣並未受到這股風潮的影響，顯見其支持臺灣亦應走向新文學發展，答案為(D)。

    29.(A)石化產業雖然高風險，但並非落後工業。(C)報導一中並未說明引發爆炸的原因。(D)預計 2026 年才會全數拆除，代表目前尚未達成。

    30.從「山川與我心神相通，才能化為筆墨」一句，顯示中國山水畫已不是簡單的寫實描繪，而是強調將人的感受與自然變化相結合，故答案為(A)。(B)(C)(D)無法從題文看出。

    31.題文前面說明希臘文明重視人文精神，後段則說明「希臘的藝術也由此萌芽」，顯見人文精神與希臘藝術的關聯性，因此(B)為正解。

    32.從「富商麥第奇家族」可推知此畫作與義大利的文藝復興有關，當時的藝術作品已經跳脫傳統基督宗教畫的框架與作用，重視俗世的審美，同時受到人文精神的影響，也會以人的形象去描繪神明，(A)為正解。

    33.(A)從表格可看出受到西方國際影響，清廷自 19 世紀已嘗試在臺灣開採石油。(C)第一個應是沈葆楨。(D)日本在臺的所有設施均被國民政府接收。

    34.(A)石油危機會帶來世界經濟的大蕭條。(B)煤仍然被應用於能源設施發電上。(C)尚有生質柴油、頁岩油、天然氣、太陽能、核能、風力發電等各種新能源。

    35.(A)中元節為漢人民間信仰的傳統祭典儀式。(B)從流程來看，最後為跳鍾馗科儀。(D)基隆整個城市會全體總動員，可見熱鬧非凡。

    36.這個藝術展覽的建築物皆為古羅馬帝國的代表建築，從「角鬥士搏鬥」、「對外征戰勝利事蹟」的說明，皆在彰顯帝國的強盛與榮耀，答案為(C)。

    37.(A)工業革命後，人們已開始大規模汙染環境。(B)人類仍持續在大規模破壞環境中，永續發展仍是未竟的目標。(C)工業革命後，人們對地球資源需求量更高，破壞也更深層。

    38.(A)(B)從兩則資料中無法判讀。(C)無論歌仔戲或布袋戲，因應電視傳播而運用現代科技呈現更好的聲光效果。(D)為正解。

    39.題文說明此時期的藝術繪畫以宗教題材為主，但作品風格更貼近「人」，可推知此時期為文藝復興時期，當時的藝術風格已從中古過渡到近代人文主義，故答案為(C)。

    40.(A)歷史研究係根據蒐集的資料來判讀分析，與史家生存年代早晚無關。(B)連橫主張王爺信仰為民間對鄭成功的奉祀，康豹認為王爺是瘟疫之神，兩者看法不同。(C)對兩則資料的理解恰好相反。

    41.題文所述朝代應為院體畫盛行的宋代，從成立畫院、招攬名畫家授予官職和俸祿等作法，可知當時藝術的發展主要是受到統治者的大力支持與推動，甚至皇帝也精通書畫。「在外族入侵後曾沉寂一段時間」指進入元朝後，院體畫在壓抑漢人文化的政策下而停滯，因此答案為(C)。

    42.從無意識、夢境等詞，即可推知此藝術派別應是(A)超現實主義，深受佛洛依德精神分析學理論的影響。

    43.題文中的藝術家反省人類對大自然生態的破壞，因此在海邊排列石頭，或是用種樹來表達自身理念，屬於一種「大地藝術」的創作，(B)為正解。

    44.從創新透視技巧、油畫的發明、跳脫以往宗教的新主題、關注藝術家的地位、思考如何成就現世等線索，可推知此為(A)文藝復興時期。

    45.(A)移民會依其祖籍祭祀各自的鄉土神。(B)三山國王為粵籍人士的信仰。(D)職業性質的信仰出現，僅能反映宗教的功能性，與內地化無關。

    46.題文所述應是 1930 年代「臺灣話文論戰」的論點之一。這位作家想要寫能激發廣大群眾心理的文藝，因此不會是使用文言文或日文來創作；從「要給我們最親近的人看的，不是要特別給遠方的人看的」一段，可看出他主張以(D)臺灣話文來創作，而不是北京的白話文。

    47.(A)不同油田的石油在成分和外貌上有很大的區別。(B)兩者皆屬於一次能源，無法重複使用。(D)石油在上古時期已被發現。

    48.(A)資料一反對陳舊的八股文章，實則是反對舊文學。(C)資料二的林維朝批評部分人士崇洋媚外，毀棄傳統禮義。(D)兩則資料立場對立。

    49.(A) 1977 年已非日治時期。(B)應是與 1970 年代臺灣的外交困頓有關，非民族自決風潮。(D)從「以『臺灣為中心』寫出來的作品」可知其主張鄉土文學的創作，非反共文學。

    50.這種「新媒體」常在臺灣各地廟前播放，被臺灣文化協會視為啟迪民智的重要工具，係指(D) 19 世紀末誕生、20 世紀初引入臺灣的電影。(A)當時技術與設備掌握在日人手中，電影拍攝需依附日本一地的生產供應。(B)內容多為教化與宣傳之用，非以娛樂觀眾為主。(C)電影先從默片開始，後再發展出有聲電影。

    51.(A)游牧民族的生活明顯受制於降雨量多寡。(B)題文指為契丹，非匈奴。(D)題文中僅提到乾旱時會入侵南方，不代表從此便長期定居於南方。

    52.(A)(B)南北朝的游牧民族之所以向中原南侵，係因生存壓力。(D)題文中僅提到西晉滅亡與氣候有關聯，不代表所有外族所建立的朝代，皆與氣候有關。

    53.這個地區位於中美洲的猶加敦半島南端，可知這個古文明為馬雅文明，答案為(D)。

    54.從兩則資料內容，可推知此區域為西亞的兩河流域地區，(A)為正解。(B)兩河流域美索不達米亞平原。(C)兩河常不定期氾濫，造成當地居民悲觀的文化。(D)資料二指出當地農業豐產，並非糧食短缺。'
