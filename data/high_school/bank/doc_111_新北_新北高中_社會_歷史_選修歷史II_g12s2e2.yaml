  stem: 閱讀資料一與圖一後，請問最能表現拜占庭帝國什麼樣的特色？
  options:
  - label: A
    content: 政教分離
  - label: B
    content: 政教合一
  - label: C
    content: 政治高於宗教
  - label: D
    content: 宗教高於政治
  group_stem: '資料一：（搭配圖一）

    圖一：聖索菲亞大教堂馬賽克鑲嵌畫，聖母瑪利亞將嬰兒耶穌抱在膝蓋上；圖左查土丁尼大帝獻上教堂的模型；圖右君士坦丁大帝獻上城市的模型

    查士丁尼時代，東羅馬帝國（編按：拜占庭帝國） 已經非常希臘化了。他削弱羅馬國民主權，讓自己成 為專制王權的國家代表。他推廣基督教文化，藉此凝 聚人心；他一心想恢復昔日羅馬帝國版圖，為恢復古 羅馬的輝煌而奮鬥。拜占庭藝術的主題主要是宗教和 帝國：這兩個主題經常結合在一起，例如 6 世紀聖索 菲亞大教堂內拜占庭皇帝的肖像。

    無論是教堂內部裝飾，或是私人住宅，基督、聖 母或聖人形象在此時屢屢可見。聖像本質上更屬於宗 教性而非美學性：拜占廷深深影響在俄羅斯和巴爾幹 半島的斯拉夫民族，並在帝國滅亡後，由後者將東正教文化保存起來。簡單來說，拜占庭藝術特點是承續基督教風格，內容受到宗教限制，大都描述《聖經》故事或基督神蹟，富於裝飾與象徵性。【參考資料：楊培中，古文明藝術手冊：拜占庭藝術】

    資料二：（搭配圖二）

    圖二：拿破崙加冕皇后約瑟芬

    一般儀式是教宗加冕皇帝，但拿破崙是搶過皇冠，替自己加冕，於是畫家巧妙地移轉成加冕皇后的場景。

    新古典主義藝術承襲啟蒙運動而生，作為王室貴 族所支持洛可可風格的對立面，新古典藝術題材喜愛 英雄故事，有說教及鑑往知來的意圖。19 世紀中葉， 一批中產階級因應工業革命而崛起，他們主張「為藝 術而藝術」，希望藝術家從贊助人手中解放，並重新 提振希臘、羅馬藝術復古風格。他們以宣揚理性，延 續創作既有規範與秩序，要求構圖均衡嚴謹、精密細 膩，並與法國大革命宣傳自由、平等之精神結合。綜 合地說，新古典主義藝術少了浪漫激情，多了藝術理 想性的提升，在宗教、神話、肖像畫與歷史場景的畫 中呈現。【參考資料：王靖雁，論「新古典」繪畫流派的當代創作思惟與表現技法】'
  shared_asset: g2_66_68
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 拜占庭帝國的藝術是宗教和帝國，在聖索菲亞教堂裡的馬賽克鑲嵌畫中，查士丁尼亦隨侍在聖母身邊，因此可知拜占庭帝國的特色為(B)政教合一。
