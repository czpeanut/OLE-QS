    content: 逐漸轉變為日耳曼民族動物風格為主的藝術題材
  - label: D
    content: 高聳尖塔與玻璃窗表達出就地取材的藝術風格
  group_stem: 歐洲的藝術史發展過程中，羅馬帝國分裂扮演了重要的分歧作用，西元 476 年羅馬帝國西部遭到異族入侵，此後進入了中世紀，受到北方的日耳曼民族入侵後的羅馬帝國西部，由於日耳曼人接受了基督教而得以維持原有的風格，並且在羅馬文明的基礎上加入屬於北方民族文化特點，發展出蠻族藝術、古老原始的動物風格、更加寫實且具有宗教性的羅馬式藝術以及展現出西歐中世紀最高成就，注重比例、光影色彩、低調奢華的哥德式藝術。以建築為例，高聳尖塔讓人覺得與上帝更加接近，而彩繪玻璃窗則讓人隨著射入的每一道光線，感受來自天堂的神聖性。相較於西歐中世紀的藝術，位在東西文化交界的拜占庭帝國受到來自東方文化的影響並加以融合，不但保有了古希臘羅馬的古典元素，也因此有更明確的藝術發展方向。拜占庭帝國以基督宗教為中心，歷任許多統治者皆以舉國之力廣設教堂傳教，這種政教合一的特質讓藝術成為彰顯帝國與宗教、政治與經濟實力最好的宣傳利器。
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)後發展出哥德式藝術，並非停滯。(C)與史實不符。(D)哥德式藝術係多種文化融合的成果，高聳尖塔與彩繪玻璃窗係為表達宗教的神聖性。
