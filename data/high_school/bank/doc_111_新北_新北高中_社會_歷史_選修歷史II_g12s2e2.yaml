    content: 李國修加入話劇社時可能接觸到受美國文化影響的現代戲劇
  - label: C
    content: 「屏風表演班」成立於戒嚴時期，因此表演內容頗受限制
  - label: D
    content: 「屏風表演班」演出類型包括京劇，應歸類為傳統戲劇劇團
  group_stem: '1955 年出生的李國修，由於父親的職業為製作戲鞋，他從小就可以進入京劇的後臺，這也成為他對戲劇好奇的源頭。在小學時，李國修時常跑到西門町的戲院看電影，更厲害的是，他會在回家後將電影演給鄰居看，精湛的表現讓鄰居們彷彿也在現場看了同一齣電影。

    18 歲時李國修加入話劇社，開啟了他對戲劇的熱愛，因為窮，所以他只能自己摸索，沒想到這卻成為他原創戲劇的動力。之後於 1986 年成立「屏風表演班」，以實驗小劇場的方式進行演出，在戲劇類型方面十分多元，從喜劇、悲劇到融合京劇或者歌舞劇的形式皆有；而在劇本上則著重「本土關懷」，探討發生在臺灣這塊土地上的故事，成為臺灣代表性的劇團之一。'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)李國修出生前，臺灣在日治時期已引入電影。(B) 1973 年李國修加入話劇社，當時應已是受到美式文化影響的現代戲劇，為正解。(C)從題文來看，屏風表演班的戲劇類型十分多元，並未受到明顯的限制。(D)屏風表演班融合各種表演方式，屬於現代戲劇劇團。
