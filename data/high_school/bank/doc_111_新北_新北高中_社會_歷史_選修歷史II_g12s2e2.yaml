  stem: 希臘羅馬時代，西方主要的畫作題材是神話以及帝王的偉業。而基督宗教興盛之後，聖經故事則成為之後一千多年間西洋藝術的重要題材。許多立體浮雕或者人物雕塑漸漸被具有宗教象徵的壁畫、鑲嵌藝術以及各式宗教用品所取代。比起美感，如何讓人們對宗教感到崇敬以及保持虔誠的心才是這個時期藝術作品所關注的課題，發展後來風格也往精緻華麗邁進。請問關於這段敘述下列何者正確？
  options:
