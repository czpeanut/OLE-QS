    content: 西方藝術發展過程中，比起華麗性更加重視實用性
  - label: B
    content: 基督宗教的興起使西方藝術題材大幅度的轉變
  - label: C
    content: 基督宗教的題材當中，藝術是為了呈現帝國的奢華
  - label: D
    content: 西方主要藝術題材的轉變表示當時政治由宗教主導
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中古後期的藝術風格係往精緻華麗邁進。(C)基督宗教的題材主要是為彰顯教義。(D)從上古到中古的藝術發生改變，但政治一直未由宗教主導。
