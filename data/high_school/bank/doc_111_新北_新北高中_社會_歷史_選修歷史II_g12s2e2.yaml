  group_stem: '過去二手衣物回收整理分類提供不少弱勢族群穩定收入，但近幾年在東南亞、非洲等主要二手衣物進口國，為保護本國紡織業，陸續提高關稅來限制二手衣物進口。有些進口國轉為出口國，如中國。在進口需求減少，出口競爭對手卻增加的情況下，為了維持競爭力只能更嚴格的篩選，加上近年來大量生產的快時尚衣物品質不如以往，僅有三成可以轉賣。而原本還能轉運印度，重新抽紗製作地毯等產品，在疫情爆發海運運費飆漲後，已不符成本，最後只能送焚化爐。

    其實這些被送進焚化爐的舊衣，在科技發展下，仍有再利用的潛力，如臺灣近幾年研發出將聚酯纖維再造，以及將舊衣製作成固體再生燃料的辦法。其實每個人在日常生活中，仍有許多方式可以做到「穿得永續」，例如購買二手衣物、拍賣二手衣物、交換二手衣物以及推廣減量衣物教育等。'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)題文未提及此。(C)(D)雖在題文中有提及，但並非本文的主旨。
