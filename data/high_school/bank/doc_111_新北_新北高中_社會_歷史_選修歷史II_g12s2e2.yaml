  stem: 「稻之枋寮街，當疫病猖狂之際，居民日擊心驚，恆烏祈天構件之謀，而病魔竟悠悠然如是。是時，有倡迎關渡媽祖，以時當顯嚇，欲藉以鎮撫也。乃媽祖至，道逢疫症稍疏，迷以果然靈目之。而隆記街一帶，迷有布其後塵者。高結神壇，迎神像於此。一時演戲數十檯。何信本之益深？」上文描述大稻埕當時鼠疫肆虐，雖祭拜當地的神祇無效，所以迎關渡媽祖來遶境。由此可知臺灣民間信仰的趨向為何？
