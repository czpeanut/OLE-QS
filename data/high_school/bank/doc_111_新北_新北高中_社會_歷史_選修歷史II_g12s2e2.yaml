- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 此項民間信仰相傳起源於 19 世紀末清朝年間，當地流行瘟疫，又因醫藥不發達下，死者日益增加，當地居民祈求神明解災救難。經由神明指示須於元宵夜由信眾隨神轎一路燃放鞭炮，遶境大街小巷至天明，將瘟疫一掃而除。自此當地居民每年均沿襲往例，迎請神明於元宵夜出巡。請問關於此項宗教節慶活動的敘述何者正確？
  options:
  - label: A
    content: 這場活動會出現焚燒王船的儀式
  - label: B
    content: 這場宗教慶典活動應該是媽祖遶境
  - label: C
    content: 這場宗教慶典為中元普渡
  - label: D
    content: 這場宗教活動慶典為鹽水蜂炮
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述的宗教活動係因過去流行瘟疫而產生，但信眾係於元宵夜隨神轎燃放鞭炮，遶境到天明，因此答案為(D)。(A)題文並未提到與王船相關的文字敘述。(B)媽祖遶境通常在 3 月，同時媽祖信仰與瘟疫較非相關。(C)題文說明為元宵節，非中元節。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 「該地處於封建制度的統治下，不過這時經商致富或逐漸累積財富的新興階級逐漸脫離原本的勞動階層，改變了經濟模式，首都呈現熱鬧繁華的氛圍，而且由於人民主要信奉喀爾文教，該地的藝術作品於是衍生出兼具宗教色彩與民間傳統的風格。」請問以上應是何地藝術特色的描述？
  options:
  - label: A
    content: 前 3 世紀的克里特島
  - label: B
    content: 9 世紀的君士坦丁堡
  - label: C
    content: 14 世紀的威尼斯
  - label: D
    content: 15 世紀的尼德蘭
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由於該地人民主要信奉喀爾文教，可見此時應已在 15 世紀宗教改革之後，(A)(B)(C)三者的時間皆不符合，故答案為(D) 15 世紀的尼德蘭。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 某報導指出：「在過去五十年內，全球的塑膠產量便增加了 20 多倍，塑膠產量呈現不斷上升的趨勢，意味著製造這些塑膠的碳排放與塑膠產品本身的碳足跡，在這五十年來已增加 20 倍之多。碳排量的顯著增加，也完全貢獻在全球暖化與氣候變遷上。……現今製造塑膠所產生的碳足跡（溫室氣體效應）已經等同於全球航空業所製造的碳足跡。由於製造塑膠對石化企業來說可以賺得更多，可以想見在不久的將來，塑膠的大量生產將是造成氣候變遷的主要原因。」關於石化產品過度使用所造成的問題，下列敘述何者正確？
  options:
  - label: A
    content: 石化產品能迅量生產，且價格低廉，因此不須理會它對環境造成的汙染問題
  - label: B
    content: 生產石化產品不僅影響地球暖化，過度生產及消費更會造成大量塑膠垃圾
  - label: C
    content: 目前造成地球氣候變遷的最主要原因，是因為塑膠大量生產及使用所造成
  - label: D
    content: 石化產品造成太多環境問題，要避免問題繼續擴大，應該全面禁止生產使用
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)環境汙染問題最後仍由人類共同來承受，不可不理會。(C)造成地球氣候變遷的主要原因是碳排放量的增加，非塑膠產品。(D)就當前的資源與技術而言，尚無法全面禁止生產使用石化產品。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 第二次世界大戰之後，西方藝術發展的重心由歐洲移往美國。請問下列何者能說明造成這個情況的原因？
  options:
  - label: A
    content: 二戰結束後，以喬治亞．歐姬芙等藝術家為首的普普藝術在美國發跡，取代歐洲的高雅藝術
  - label: B
    content: 美國在兩次世界大戰中均未遭戰火波及，經濟與政局都相對穩定，許多歐洲藝術家為了躲避戰火而逃往美國
  - label: C
    content: 歐洲藝術自一戰後進入停滯期，直到二戰期間都沒有重要藝術流派出現，因而讓美國一舉超越成為藝術發展重鎮
  - label: D
    content: 美國雖然是個自由且充滿活力的國家，但並不接納異文化及移民，因此藝術方面的表現仍然有所受限
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)普普藝術以安迪．沃荷為開創者之一。(C)歐洲藝術在一戰後亦出現新的藝術流派，如達達主義、超現實主義等。(D)美國係由多民族移民組成的國家，二戰後更加尊重多元文化發展。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '根據下列兩項資料，我們應該如何理解？

    資料一：他們向瓦里人學習如何在陡峭地帶進行灌溉及開墾梯田，使他們得以耕種原先利用率相當低的土地。他們居住在山頂，後來變得相當有組織，進而發動征服戰爭。

    資料二：他們的村莊，包括馬丘比丘，都位於山頂。村民定時下山，到山區鄉間照顧玉米、可可、棉花和其他日常作物的田地。他們還在外圍建立衛星社區，形成經濟列島，如此一來的優點是能在中間的荒地投下最少的水與人力，取得所需資源。'
  options:
  - label: A
    content: 資料一所述及的耕墾技術是為防禦敵對族群而生
  - label: B
    content: 資料一與資料二中的「他們」指的是馬雅人
  - label: C
    content: 資料一與資料二敘述的生活方式與技巧皆是因應特殊的地理環境條件而生
  - label: D
    content: 資料一的文明所在地為非洲高原地帶
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)資料一所述及的耕墾技術是為因應山區的地理環境，非以防禦為主。(B)應為南美洲的印加人。(D)兩則資料皆指南美洲的印加帝國，位於安地斯山區地帶。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 在歐洲藝術界每隔一段時間就會掀起一股「復古風」，緬懷過去時代的美好與價值。14 世紀的文藝復興時期與 17 世紀古典主義有一個共同的訴求，要復興過往消逝的美，將其重新呈現在世人眼前。請問他們所要效法的「消逝的美」是指哪個時期的藝術？
  options:
  - label: A
    content: 兩河流域
  - label: B
    content: 埃及
  - label: C
    content: 希臘
  - label: D
    content: 拜占庭
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 文藝復興時期與古典主義所追求的美學，主要是上古(C)希臘時期的藝術。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: '資料一：臺灣文化協會曾對歌仔戲有以下批評：「綜論來說，歌仔戲的演員人格卑劣，雖然材料取材自傳統的忠孝節義，但是演員的人格沒有修養，不能夠發表真的意義，倒反利用戲劇而傷壞風俗；此外歌調很淫蕩、演員表情很猥褻，這樣的戲劇問題真的很多。……希望對藝術方面有志趣的人士獻身出來改革指導，由臺灣取材，劇本科白全部要以臺灣為本位，能夠創造像在西洋和日本那樣的文明歌劇，來改除向來的舊戲，那麼就更得一番進步了。」

    資料二：「20 世紀初，臺灣受到中、日『新劇』的影響，試圖以寫實的方式展現當代生活，或是歷史典故。大體而言，『新劇』的走向可以分成兩種：一是追求藝術表演，抨擊封建落後的傳統戲曲；二是宣傳改革理念，刺激民族意識、革除社會既有的弊病。」

    關於以上兩則資料的討論，請問下列何者正確？'
  options:
  - label: A
    content: 資料一肯定歌仔戲傳達忠孝節義等傳統道德
  - label: B
    content: 資料二提及「新劇」的推廣者，可能是皇民奉公會
  - label: C
    content: 資料一提及的「文明歌劇」，即是資料二提到的「傳統戲曲」
  - label: D
    content: 從兩則資料內容可以判斷，當時「新劇」的提倡者希望戲劇表演可以更加關注現實
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)資料一對歌仔戲的演員有諸多批評。(B)資料二推廣新劇，很可能是臺灣文化協會。(C)資料一的「文明歌劇」是為改革、取代資料二的「傳統戲曲」，(D)為正解。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 曾經盛行的等身人像雕像藝術不再盛行，取而代之的是一種半立體的浮雕藝術，題材多是象徵十字架形狀的錨、鋤，象徵基督的魚，葡萄或棕櫚這些植物，以及羊、鳩、鹿這些鳥獸，同時人物的形象也很少出現在藝術品當中。請問發生如此藝術轉變的主因為何？
  options:
  - label: A
    content: 《聖經》的故事成為題材
  - label: B
    content: 基督宗教禁止崇拜偶像
  - label: C
    content: 吸收了塞爾特族、薩克遜族文化
  - label: D
    content: 統治者以國家之力傳教
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從象徵十字架形狀的錨、鋤與象徵基督的魚等，可知藝術轉變的原因與基督教信仰出現有關，人物的形象很少出現在藝術品當中，很可能係因為(B)基督宗教的教義裡禁止偶像崇拜。(A)(C)(D)從題文敘述中無法看出。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: '資料一：工業革命之後，人類對於地球資源的使用愈來愈多，使能源耗竭的情況愈來愈嚴重，然而人類持續的壓榨大自然，也會受到自然的反撲。

    資料二：1980 年以來，人類所消耗的資源已經超過地球能夠再生或復原的限度，這個趨勢若是持續下去，人類文明總有一天會滅亡。

    資料三：對於人類文明的發展我們必須保持樂觀的態度，即便資源逐漸枯竭，但人類歷史發展的長河之中，保存無數智慧的結晶，只要善加應用，加上現在不斷提倡的再生能源，相信總有一天可以解決資源不足的問題。

    對於上述資料我們可以有何種看法？'
  options:
  - label: A
    content: 資料一認為人類運用資源尚處合理
  - label: B
    content: 資料二認為人類之所以會滅亡可能是地球本身的壽命到達期限
  - label: C
    content: 資料三認為人類的科技發展也許能夠解決地球資源枯竭的問題
  - label: D
    content: 資料一跟資料二認為人類應該停止科技發展
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)資料一憂心能源耗竭愈來愈嚴重。(B)資料二認為人類過度消耗資源，係自取滅亡。(D)資料一與資料二皆係憂心人類過度耗損資源，並非主張停止科技發展。
