  explanation: (A)從這位女子的發現來看，她應是位科學家而非女巫。(B)(C)泰晤士河確實是倫敦的母親之河，但河中的細菌與雜質髒亂程度與生物多樣性無關，應是工業革命後所造成的汙染，因此(D)為正解。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: '資料一：「辜振甫曾對父親辜顯榮支持、推動興建臺北孔廟和臺北新舞臺（京劇演出場所）的心境試作分析，他覺得父親不忘中華傳統，日本統治下的臺灣雖有諸多限制和禁忌，但是日本也尊崇儒學，對京劇也沒有戒心，蓋孔廟、演京劇，公然發揚中華傳統文化，並不觸犯日本政府的忌諱。」

    資料二：「20 世紀初，大陸京劇團多次應臺北邀請前來演出，地點或是選擇在辜顯榮的新舞臺，或是選擇在大稻埕的永樂座，兩者分庭抗禮。但到了 1930 年代以後，京劇團來臺數量開始減少，部分留臺演員轉型成為歌仔戲團的指導，最後因日本文化政策的轉變，京劇團體在臺走向消失。」

    請問對於以上兩則資料的分析，何者正確？'
  options:
  - label: A
    content: 資料一認為日本殖民政府大力鼓勵京劇的演出
  - label: B
    content: 資料二提及的日本文化政策，是指皇民化政策
  - label: C
    content: 在日本統治下，京劇的發展並未受到阻礙
  - label: D
    content: 臺灣歌仔戲的起源，是從京劇演化而來
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)日本政府有諸多限制和禁忌。(C)京劇觸犯日本政府的忌諱，後走向消失。(D)歌仔戲為源自臺灣本土的傳統戲曲。
- id: doc_111_新北_新北高中_社會_歷史_選修歷史II_g12s2e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 西元 79 年，維蘇威火山在歷經一系列的地震以及火山活動徵兆後的一星期之後，無情的火山噴發掩埋了無數的龐貝城居民，整個龐貝的時間就停留在那一刻。直到 18 世紀考古挖掘，我們才得以發現當時美麗的壁畫、彩繪柱子，藉由對出土人物雕塑的觀察更可以發現羅馬的藝術是如何受到希臘的影響。請根據題幹選出下列適合的分析
