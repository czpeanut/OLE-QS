  - label: E
    content: 甲烷菌從能代謝醋酸的植物細胞取得一小段DNA，藉此獲得分解醋酸的能力
  group_stem: '地球剛誕生時的環境條件和現今不同，因此當科學家在極端環境如溫泉或鹽湖中發現一些原核細胞時，推論這些生活在極端環境的生物也應該是早期演化出來的生物，故命名為古細菌。和已知的真細菌不同的是，古細菌能生存於多樣的環境中，如死海的極端嗜鹽菌、熱硫磺噴泉的極端高溫菌，也可以是在一般環境，如沼澤、廢水和土壤中。相較於此，真細菌較無法在高溫或高鹽度等極端中存活。

    在這些古細菌中，甲烷菌的存活範圍相當廣泛，可存活在沼澤地，亦可存在於在生物體消化道內。甲烷菌產生能量的方式有二；第一為利用氫氣將二氧化碳還原為甲烷，過程中不須氧氣的參與。第二則是以醋酸為原料，經無氧呼吸產生產生能量的過程中會有甲烷形成。因產生能量過程中都甲烷的產生，故以此為命名依據。利用代謝醋酸產生能量的甲烷菌又可以成兩大類群，為Methanosaetaceae科的甲烷菌，以及Mothanosarcina科的甲烷菌。而根據分子生物學技術分析DNA與蛋白質組成的結果，科學家發現牠們用來參與分解醋酸的酵素，其基因是從可分解植物纖維素的細菌那裡取得的。科學家認為，地球上第四次大滅絕或許與甲烷菌有關。二疊紀末期，西伯利亞火山噴發大量鎳進入海洋中，而甲烷菌用以代謝醋酸的酵素又需要鎳作為輔因子。是故，一群甲烷菌得以利用醋酸快速生長並產生大量甲烷。而在釋放至大氣的過程中，甲烷會和氧氣進行化學反應並形成其他物質，造成地表大多生物因氧氣減少而死亡。

    雖然古細菌被認為可能是最早出現的生物，然而科學家分析古細菌的、真細菌及真核生物細胞RNA序列時，發現古細菌和真核生物的相似度較高。同時亦發現到部分古細菌和真細菌養在一起時，古細菌出現類似觸手狀的構造將真細菌包圍，這個現象支持著內共生的可能性。因此科學家再次將「相較於真細菌，古細菌可能更靠近真核細胞」的論點，進一步修正為「真核生物由古細菌的某分支演化而來」。如果這個論點被更多科學研究所支持，科學家可能會將古細菌域和真核生物域合併為一個類群。

    ＜改寫自 泛科學：甲烷，差一點毀滅地球 https：//pansci.asia/archives/58365＞'
