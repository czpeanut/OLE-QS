- id: doc_109_新竹_新竹女中_自然_生物_選修生物II_g11s1e2_s3_37
  section: 3
  number: 37
  type: single
  page: 4
  stem: 尼丹在實驗中密封及加熱的目的分別為何？
  options:
  - label: A
    content: 使瓶外微生物無法進入；僅殺死肉汁中的微生物
  - label: B
    content: 使瓶外微生物無法進入；殺死瓶中所有的微生物
  - label: C
    content: 使瓶內微生物因沒有空氣而死亡；破壞瓶內微生物的生命力
  - label: D
    content: 使瓶內微生物因沒有空氣而法生存及繁殖；促進瓶內微生物的生命力
  - label: E
    content: 使瓶內微生物因沒有空氣而無法繁殖；殺死附著在瓶壁的微生物
  group_stem: '18世紀時，英國學者尼丹將肉汁放入燒瓶並加熱後再以軟木塞封住，將此裝置靜置一段時間後，燒瓶內的肉汁變得混濁。對此，他認為「生物體內存在一種特別的生命力，當個體死亡時，生命力會被解放，並且促使生物的再生」。義大利學者斯巴蘭贊尼對於尼丹的想法感到存疑，於是重新進行了類似的實驗。他將肉汁放入燒瓶後以蠟密封住瓶口，再將其加熱至沸騰。結果為一：如沸騰時間同為30分，靜置一段時間後肉汁會變得混濁；二：如沸騰時間為45分，靜置一段時間後肉汁仍保持清澈。然而若封蠟處被開啟靜置一段時間後，肉汁仍會變得混濁。因此，斯巴蘭贊尼認為微生物不會從環境中自然產生。對此，尼丹認為這是因為長時間加熱導致生命力被破壞，而且形成生命所需的空氣也因加熱而變質。

    19世紀中，法國學者浦歇將乾草浸液置於燒瓶內，通入多種氣體後加熱。在靜置數日後，燒瓶內的乾草浸液變混濁，因此，他認為生物會自然發生。同時期的法國學者巴斯德設計以下實驗，用以瞭解「生命是如何產生的？」。實驗一：將酵母菌液和糖液放入數個燒瓶內加熱後再密封，帶到不同場所開封數分鐘後再將其密封並靜置數日。實驗二、將酵母菌液和糖液放入數個燒瓶內，將燒瓶加熱並拉長為鵝頸狀，隨即把前端切除一部分。將燒瓶加熱至沸騰且冒煙後，再將其靜置數日。結果為一：在一般房間內打開過的燒瓶內，多數會有微生物的存在；在地下室或者是高山上打開過的燒瓶內，僅極少數會有微生物的存在甲。分析每個燒瓶內的氣體組成，發現各瓶內的氧氣約佔各瓶內21％。二：僅將燒瓶口加熱並拉長為鵝頸狀，瓶內即微生物的存在。（以下略）

    ＜改寫自日本大考試題＞'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
