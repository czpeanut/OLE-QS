- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e1_s1_16
  section: 1
  number: 16
  type: single
  page: 3
  stem: 同一個人身上的神經細胞和皮膚細胞，其細胞內部的何種物質相同？
  options:
  - label: A
    content: DNA 序列
  - label: B
    content: RNA 序列
  - label: C
    content: 蛋白質序列
  - label: D
    content: 蛋白質含量
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '同一個人的體內，細胞內的 DNA 序列相同；不同細胞內的 RNA 序列及蛋白質序列、含量不同。

    17.1 為五碳醣，2 為連接含氮鹼基的氫鍵，3 為磷酸基，4 為含氮鹼基。

    (A) DNA 是去氧核糖，RNA 是核糖。

    (B) 3 為磷酸基，無法作為區分 DNA 或 RNA 的依據。

    18.DNA 分子是由核苷酸組成，每個核苷酸都含有 1 個五碳醣、1 個含氮鹼基和一個磷酸基。3000 個五碳醣則有 3000 個核苷酸，3000 個含氮鹼基，形成 1500 個含氮鹼基對。

    19.(A) 維生素 B 群是一組水溶性維生素，作為輔酶參與多種酵素反應，支持細胞的正常功能和代謝過程。

    20.P 為寡醣，Q 為膽固醇，R、S 為蛋白質，T 為雙層磷脂（脂雙層），圓形部分為親水端。

    21.(B) 新形成的膜向外移可形成溶體及細胞膜。

    (C) 粗糙內質網向內移可形成核膜。

    (D) 內膜系統主要由蛋白質和磷脂所組成。

    22.(A) 細胞膜單層脂質總表面積是細胞總面積的兩倍，代表膜為脂雙層。

    (B) 代表支持三明治模型。

    (D) 並非所有蛋白質都跨越脂雙層。

    23.肝細胞中，平滑內質網負責解除酒精、藥物及毒物的毒性，並參與醣類的新陳代謝。

    24.部分內質網有核糖體附著，故題圖中的胞器為內質網。

    (B) 運往高基氏體進行修飾。

    (C) 由單層膜組成。

    (D) 唾腺細胞具有發達的內質網。

    25.不飽和脂肪酸含有雙鍵，因此在低溫下不易凝固；若細胞膜含有較高比例的不飽和脂肪酸，則在低溫下仍能保持流體性質。

    26.甲（高基氏體）、乙（葉綠體）、丙（粒線體）、丁（細胞核）、戊（核仁）、己（核糖體）。

    (D) 己（核糖體）為蛋白質（澱粉酶）合成場所。

    27.(D) 基因的成分為核酸（去氧核糖核酸），位於丁（細胞核）內。

    28.核糖體（合成蛋白質）→粗糙內質網（蛋白質修飾及運輸）→高基氏體（運輸、修飾及暫存，與細胞分泌有關）→囊泡→溶體或液泡存於細胞內。

    29.(A)(C)(D) 多數成熟植物細胞具有中央液泡，可儲存水分、花青素、養分、廢物等，產生膨壓有助於維持細胞形狀。

    (B) 液泡與光合作用無關。

    30.草履蟲的伸縮泡是一種特化的液泡，其功能為排除體內多餘的水分，此過程為主動運輸。0.7％ NaCl 溶液的滲透壓高於淡水，但仍低於草履蟲細胞內的滲透壓，水分仍會進入草履蟲細胞；0.9％ NaCl 溶液的滲透壓接近細胞內的滲透壓，導致水分進入細胞的速率降低，伸縮泡需要排出的水分更少，因此其收縮次數會進一步減少。

    31.溶體具有消化、防禦、代謝及更新的功能；若溶體出現異常則可能會導致併指畸形。

    32.$H_{2}$O 和 $CO_{2}$、$O_{2}$ 等氣體分子可經簡單擴散作用通過細胞膜。

    33.鈉離子藉運輸蛋白，順著濃度梯度進入細胞內，故為促進性擴散。

    34.A 為簡單擴散，B、C 為促進性擴散，D 為吞噬作用，E 為胞飲作用，F 為胞吐作用。

    (A)細胞消耗能量並利用胞吐作用，將蛋白質分泌至細胞外，不需要載體蛋白。

    (B)還有透過促進性擴散和主動運輸。

    (C)還包括胞吞作用。

    (D)濃度低於細胞外液才會發生質離現象。

    35.葡萄糖進入小腸絨毛上皮細胞是通過運輸蛋白進行的主動運輸或促進性擴散，並未涉及膜融合。

    36.因為水會透過滲透作用從低濃度 3％ 葡萄糖液（乙側）移動到高濃度 5％ 葡萄糖液（甲側），故甲處葡萄糖濃度下降。待穩定後，甲、乙液面等高。

    37.(B) 膽固醇進入細胞是屬於受體媒介胞吞作用。

    38.(C) 膽固醇為大分子，無法利用主動運輸穿過細胞膜進入細胞內，是利用受體媒介胞吞作用。

    39.本氏液檢驗還原醣；雙醣中的麥芽糖、乳糖及所有的單醣（葡萄糖、果糖、半乳糖）都是還原醣，只有蔗糖不是。故乳糖可和本氏液反應產生磚紅色沉澱。

    40.(A) 本氏液檢驗還原醣，肝糖非還原醣。

    (B) 縮二脲試劑檢驗蛋白質（蛋清）。

    (C) 油性辣椒紅試劑檢驗脂質（三酸甘油酯）。'
