  stem: 科學家在某深水湖中採集到一種細菌，將它放到含砷的溶液中培養，發現細菌體內原有的磷原子會漸漸被砷取代。針對這種現象，試判斷此細菌體內的何種物質，其平均分子量會大於一般細菌？
