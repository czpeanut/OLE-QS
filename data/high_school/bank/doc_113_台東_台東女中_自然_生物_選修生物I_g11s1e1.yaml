- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 水分子具有許多不同的物理和化學特性，使其成為生物體存在的重要必須條件，請選出下列的特性和功能的配對正確者：
  options:
  - label: A
    content: 比熱小：水中生物可於冰層下度過寒冬
  - label: B
    content: 極性分子：使水成為良好的溶劑
  - label: C
    content: 4 ℃ 時密度最大：影響酸鹼值及酵素的功能
  - label: D
    content: 解離後可提供生物體能量
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 水的比熱較大，可以協助穩定生物體的體溫。

    (C) 水密度在 4 ℃ 時最大，使得冰能夠浮在水面上，有助於水體中的生物在冬季生存。

    (D) 水能輕微解離，因此水溶液中的 $H^{＋}$ 和 $OH^{－}$ 便具有酸鹼緩衝作用，影響 pH 值的穩定，但無法提供能量。'
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 水是生物體內含量最多的化合物。蛋白質是生物體內含量最多的有機物。根據上述現象，生物體內重量百分比含量最多的元素是什麼？
  options:
  - label: A
    content: O
  - label: B
    content: C
  - label: C
    content: H
  - label: D
    content: N
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 水由氫、氧組成，蛋白質主要由碳、氫、氧、氮組成（有些含有硫），醣類由碳、氫、氧組成，脂質主要由碳、氫、氧組成，核酸由碳、氫、氧、氮、磷組成，所以生物體內含量最多的元素應為：氧＞碳＞氫＞氮。
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 請問生物體內的醣類，<u>不具有</u>下列何種功能？
  options:
  - label: A
    content: 提供能量
  - label: B
    content: 保護內臟
  - label: C
    content: 組成核苷酸的一部分
  - label: D
    content: 提供細胞辨識
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (B) 保護內臟的功能，主要由脂肪（尤其是內臟周圍的脂肪組織）和骨骼結構提供，而非醣類。
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 將澱粉、蔗糖與乳糖完全分解為單醣分子後，可測得幾種不同的分子量？
  options:
  - label: A
    content: 1 種
  - label: B
    content: 2 種
  - label: C
    content: 3 種
  - label: D
    content: 4 種
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 澱粉為葡萄糖聚合物，蔗糖→葡萄糖＋果糖，乳糖→葡萄糖＋半乳糖，因此將澱粉、蔗糖與乳糖完全分解會得到葡萄糖、果糖和半乳糖。葡萄糖、果糖和半乳糖為同分異構物，化學式和分子量相同，故僅可測得 1 種分子量。
- id: doc_113_台東_台東女中_自然_生物_選修生物I_g11s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某學生將纖維素、蔗糖及澱粉完全水解後的醣類產物進行分析，下列何者正確？
  options:
  - label: A
    content: 這三種材料主要取自植物的細胞質
  - label: B
    content: 其組成小單元都是葡萄糖
  - label: C
    content: 分子量由大到小為纖維素→蔗糖→澱粉
  - label: D
    content: 所產生的醣類產物互為同分異構物
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 纖維素主要取自植物的細胞壁。

    (B) 組成蔗糖的小單元是葡萄糖和果糖。

    (C) 纖維素分子量通常大於澱粉，分子量由大到小為纖維素→澱粉→蔗糖。'
