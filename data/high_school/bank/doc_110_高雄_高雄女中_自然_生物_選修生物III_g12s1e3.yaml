- id: doc_110_高雄_高雄女中_自然_生物_選修生物III_g12s1e3_s2_37
  section: 2
  number: 37
  type: multiple
  page: 4
  stem: 根據短文所述，下列哪些正確？
  options:
  - label: A
    content: 透明帶主要是在卵巢周期中的濾泡期分泌形成
  - label: B
    content: 若將透明帶進行成分分析，可得到C、H、O、N、S這幾種元素
  - label: C
    content: 精子可釋放酵素改變透明帶的質地
  - label: D
    content: 目前醫療上尚無法解決透明帶異常的問題
  - label: E
    content: 若缺乏透明帶的卵子與2個精子結合，則會得到同卵雙胞胎
  group_stem: '請閱讀短文，並回答下列問題：

    女性於排卵期排出卵子，卵子表面有一層透明帶，外圍有數百個以上的濾泡細胞包圍。透明帶是初級卵母細胞及濾泡細胞分泌的醣蛋白，可防止其他物種的精子進入。當精子繞過濾泡細胞的層層阻礙碰觸到透明帶，同物種的精子會與透明帶中的醣蛋白受體結合。穿過透明帶後，精子的細胞膜與卵子細胞膜融合，促使卵子釋放酵素，造成透明帶質地變硬而阻斷其他精子通過，如附圖所示。透明帶相當於卵子或胚胎的外衣，在胚胎到達子宮後，透明帶裂解，脫去透明帶的胚胎隨即進行床。

    透明帶缺失或異常，例如過厚、過薄、質地變異混濁等等，都會導致不孕。缺乏透明帶的卵子將可能造成多精子受精，醫生通常以試管內受精（In vitro fertilization，IVF，即試管嬰兒）、單精子顯微注射的方式來解決這個問題，待成功受精的受精卵發育為胚胎，再植入子宮著床。'
