  group_stem: '請先閱讀以下短文，並回答下列問題：

    血球的數量要維持一動態平衡。紅血球數目過少導致貧血，而白血球數目過少時會有什麼結果？正常成人的血液中7300個白血球／$mm^{3}$，但各種白血球所占的比例並不同。正常情況下，各種白血球在血液中所占的百分比如附表。 紅骨髓只要兩天未生產白血球，在口腔、消化道、呼吸道就會出現潰瘍，若情況不加以改善，一週內會導致死亡。許多藥品和放射性物質會抑制骨髓造血功能，如常用的磺胺類藥物、氯黴素及許多中樞神經抑制劑，但若使用不當，則會引起顆粒性白血球缺乏症（agranulocytosis）。而造血作用如果失控產生大量白血球，則會引發白血病（leukemias），又稱為血癌。患者每立方毫米血液中的白血球可能增加到數十萬個，但這些白血球不具有免疫功能。沒有功能的白血球過度增殖，不但會影響骨髓的造血功能，也會使所分泌的細胞介素濃度遽增，造成組織的破壞。'
