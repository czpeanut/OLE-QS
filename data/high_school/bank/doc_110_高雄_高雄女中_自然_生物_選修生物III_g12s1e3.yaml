  stem: 下列有關非洲豬瘟病毒敘述哪些正確？
  options:
  - label: A
    content: 病毒內部含有粒線體，可提供病毒感染細胞時所需能量
  - label: B
    content: 非洲豬瘟病毒也可以把人類當作寄主
  - label: C
    content: 病毒會利用自身的RNA聚合酶進行基因轉錄作用
  - label: D
    content: 病毒的外鞘蛋白質是在寄主細胞中產生
  - label: E
    content: 罹病豬所製成的肉製品仍可能具有傳染的風險
  group_stem: '請閱讀短文後，回答下列問題：

    非洲豬瘟病毒屬於DNA病毒，嚴重危害全世界養豬產業，因此防疫人人有責。非洲豬瘟病毒寄主具專一性，壁蝨和罹病豬是本病毒主要傳播源。非洲豬瘟病毒的DNA進入寄主細胞內後，即利用寄主細胞內的RNA聚合酶、核糖體進行轉錄、轉譯作用。由於非洲瘟病毒顆粒外鞘蛋白質的序列與構造特性，不但能保護病毒，亦可使其耐受低溫環境'
