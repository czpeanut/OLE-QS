  group_stem: 商人在取得龐大財富，甚至勝過歐洲的君王、教宗們，並且透過豐厚的資產取得一定的社會影響力時，如何適切的向社會大眾展現他們的富有，對他們而言也成為一個重要的議題。然而對傳統基督教來說，擁有龐大的財富通常並不受到正面的支持，不少教會仍然抱持著「貧窮為理想」的看法。商人透過放高利貸等行為累積財富的作法，在當時的社會觀感並不佳。而利用不道德手段取得的財富，更是受到嚴厲的譴責。也因此，財富的呈現，便成為一門專業的學問。有些消費行為被認為是符合道德價值的，而受到中產階級們的歡迎，贊助藝術的行為即為一例。聖奧古斯丁教會的莫泰奧．馬菲曾提及：「建設修道院與寺院此種『偉大事蹟』使人們可以直接看到神的卓越，進而思考並虔誠的感謝神，是值得讚許的行為。」除了建設教會建築的「偉大事蹟」外，所有贊助藝術建設的行為，只要看起來不是為了追求自我榮耀，而是替公共群體、城市帶來名譽與福祉，便是符合邏輯與道德的消費行為，也是商人展現豐厚財產的重要方式之一。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文資料說明在基督教世界裡，擁有龐大財富並未受到正面肯定，因此商人通常只能透過贊助藝術建設行為來呈現豐厚的財產，因此答案為(C)。
