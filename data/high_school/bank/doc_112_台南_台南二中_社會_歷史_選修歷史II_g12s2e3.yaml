- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_29
  section: 1
  number: 29
  type: single
  page: 6
  stem: '以下是 2 則關於藝術表現的資料：

    資料一：此時期的藝術歌頌了人體的美，主張人體比例是世界上最和諧的比例，雖然繪畫和雕塑仍是以宗教故事為主題，但表現的都是普通人的生活場景，並將神拉到了地上。

    資料二：此時期的藝術風格著重在強烈的感情表現，常會用繁複誇張、宏偉華麗以及戲劇性的方式表達，並採用一些富含動態感的造型要素，如曲線、斜線等。

    依據上述 2 則資料，下列何者說明正確？'
