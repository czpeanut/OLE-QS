questions:
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 某個時期開始，中國一些省分人口開始大量增加，移民大量湧入陝西與四川之間的陡峭山地，他們砍伐樹木，在空地種植番薯、玉米、花生等，隨著可栽種的作物增加，糧食供應相對穩定，人口自然隨之持續攀升。請問這個現象最早從何時開始？
  options:
  - label: A
    content: 15 世紀初
  - label: B
    content: 16 世紀中
  - label: C
    content: 17 世紀末
  - label: D
    content: 18 世紀中
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 從番薯、玉米、花生等來自美洲大陸的植物，可推知為地理大發現後，故最早應是(B) 16 世紀中。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 某書提到：「此物」自 16 世紀引入歐洲後，廣為流傳。1604 年，英王指出：此物「惡臭難聞，有礙觀瞻，更傷害腦部」，為避免其進口，特別提高關稅。明中葉以後，中國也自呂宋引進，開始於閩粵地區種植。1637 年，明朝政府針對此物下令，如有私種私售者，擬斬首示眾。兵部尚書卻上奏說「遼東士卒，嗜此若命」，建議暫緩施行。「此物」是？
  options:
  - label: A
    content: 菸草
  - label: B
    content: 鴉片
  - label: C
    content: 咖啡
  - label: D
    content: 胡椒
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文描述可知「此物」極易讓人成癮且有明顯的臭氣，故而在歐洲與中國都曾被下禁令，因此可推知為來自美洲的(A)菸草。(B)於 18 世紀後才走私進入中國。(C)(D)沒有明顯的臭味，不致讓歐亞政府下令禁種。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 歷史家考察某一經濟作物的傳播史，認為富有全球史意義。它最初可能是從印度、波斯傳到埃及；中世紀時，穆斯林將其引入地中海地區和伊比利半島；16 世紀起，西班牙與葡萄牙在中、南美洲殖民地，利用非洲奴工大量種植，再將產品運回歐洲。這種作物應是？
  options:
  - label: A
    content: 胡椒
  - label: B
    content: 菸草
  - label: C
    content: 棉花
  - label: D
    content: 甘蔗
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 16 世紀中南美洲最重要的經濟作物為(D)甘蔗。(A)(B)原產地即在美洲、(C) 18 世紀才傳入歐洲，3 者的發展與題文敘述不符。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 藝術史家討論近代工業化過程與藝術的關係，談到一個畫派：這是一種都市風格的繪畫，畫家透過城市人的眼睛看世界，捕捉城市事物須臾即逝的瞬時性、改變性和機會性。他們喜愛鮮明的顏色，但常把一片均勻的色彩分解成小點，有如一群無固定形狀的點集合。他們常以日常生活素材入畫，如：星期天的人群或熙攘的街景。這個畫派應是？
  options:
  - label: A
    content: 19 世紀初期新古典主義
  - label: B
    content: 19 世紀中期的寫實主義
  - label: C
    content: 19 世紀後期的印象主義
  - label: D
    content: 20 世紀前期超現實主義
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所述為印象派的繪畫風格，盛行於 19 世紀後期，因此答案為(C)。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 1492 年哥倫布抵達美洲後，帶來的物種大交換使原生物種與外來物種開始競爭，在殖民者的考量之下，改變了許多地區的地貌與植被，也讓許多地區的原生物種消失轉而種植更有效益的作物。關於物種交換後帶來的競爭以及其影響，下列何者正確？
  options:
  - label: A
    content: 在殖民國家的經濟考量下，一旦發現某項經濟物種得以於殖民地成功種植，往往會形成單一經濟作物的型態
  - label: B
    content: 從殖民國的經濟角度思考，維持殖民地原有作物分布可以帶來更多利益
  - label: C
    content: 物種大交換後，殖民地的作物逐漸被外來種所替代而絕種
  - label: D
    content: 物種單一作物，有助於保持殖民地的的原生環境
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)為獲取更多利潤，殖民國通常破壞殖民地原有的植被，改種經濟作物。(C)殖民地的作物亦被交換到別的地方，並未因此絕種。(D)為配合單一作物的種植，殖民地的原生環境多遭到破壞。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 某書中提及哥倫布登上美洲，描寫到「最重要的是一趟航行裡，對世界帶來的巨大變化反映在生物、政治、社會等各種面向。例如美洲作物傳播至世界其他地區後養育了大量人口，或是西方世界的疾病對美洲人口造成的衝擊，跟以往只著眼於歐洲為主的歷史有相當不一樣的觀點。」從這些文字可理解這段文字所要強調的重點為何？
  options:
  - label: A
    content: 文化多樣性觀點
  - label: B
    content: 以美洲原住民族為主體的歷史觀
  - label: C
    content: 結合文獻與考古資料的歷史解釋
  - label: D
    content: 以西方開拓角度書寫的歷史觀點
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 過去的歷史著眼於歐洲為主的描述，題文則稱某書從生物、政治、社會等各種面向去描述哥倫布的航行對世界帶來的巨大變化，因此答案為(A)文化多樣性觀點。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: '資料一：中國曾經稱呼此種作物為苞穀（或稱包穀），其特色在於作物種子密集排列其中，而外層有綠葉包裹，因而得名。

    資料二：為阿茲特克文化中極為重要的主食，可製成薄餅或稀粥，同時也是現今墨西哥美食文化中重要的特色食材之一。

    資料三：16 世紀之後，由美洲輸往歐洲、亞洲，它的營養價值高、種植容易，且具有甜味特性，實用範圍極廣，為高經濟價值作物。

    請根據 3 則資料，判斷下列選項何者敘述正確？'
  options:
  - label: A
    content: 資料三敘述的作物為可可
  - label: B
    content: 資料二的作物可用於燃油原料用途
  - label: C
    content: 資料一提及的作物為稻米
  - label: D
    content: 資料二的帝國在 16 世紀被荷蘭人入侵而衰亡
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 3 則資料所敘述的作物皆為玉米，因此正確答案為(B)。(D)阿茲特克帝國為西班牙人所滅。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 人類自古以來對環境存在著依賴、破壞，但從來沒過今日如此劇烈。這一切來自於我們養育的「巨獸」，牠吐出黑煙、廢水破壞我們的環境，而我們覬覦牠腳底下的寶藏，掠奪世界每一個角落的資源餵養牠，直到牠將我們啃食殆盡。請問「巨獸」是暗喻什麼歷史事件？
  options:
  - label: A
    content: 哥白尼革命
  - label: B
    content: 大航海時代
  - label: C
    content: 工業革命
  - label: D
    content: 第一次世界大戰
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 這隻「巨獸」會吐出黑煙、廢水破壞環境，即可推知為(C)工業革命。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 2011 年，衣索比亞斥資 40 億美元，於尼羅河上游動土興建衣索比亞復興大壩，以供應衣索比亞水力發電與民生用水之需求；衣索比亞執政者認為，待工程完工後，這個水壩帶來的經濟效應，將使衣索比亞脫離窮國之列。但這個工程引起埃及強烈不滿，不斷向衣索比亞提出抗議。埃及之如此重視此項議題，是因為衣索比亞復興大壩會對埃及遭成哪項嚴重的衝擊？
  options:
  - label: A
    content: 尼羅河不再氾濫，也不再帶來肥沃土壤
  - label: B
    content: 尼羅河水位高漲，危及河畔重要古蹟
  - label: C
    content: 水資源供應減少，且控制權掌握在他國手中
  - label: D
    content: 威脅到埃及對尼羅河的歷史自然權利，恐無法再以「尼羅河的贈禮」自居
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 衣索比亞的大壩位於尼羅河上游，勢必會影響到下游居民的用水，埃及不願受到牽制而提出抗議，因此答案為(C)。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 學者指出，某一時期臺灣的文學作品，大多由官宦人士撰寫，內容多富異國情調，卻未能深刻描寫臺灣庶民的真實生活狀況。請問這一時期應指？
  options:
  - label: A
    content: 清治時期
  - label: B
    content: 日治時期
  - label: C
    content: 戰後初期
  - label: D
    content: 解嚴之後
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)清治時期之初，臺灣的文學作品大多由中國來臺的官宦人士撰寫的「宦遊文學」，多是記載臺灣當時的風土民情，如郁永河的《裨海紀遊》。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 1970 年代鄉土文學論戰主要關切 3 個方向的問題：(一)反帝國主義；(二)反資本主義；(三)推動本土文化。關於鄉土文學論戰描述，下列哪些正確？
  options:
  - label: A
    content: 反帝國主義指的是反對中國共產勢力
  - label: B
    content: 懷念以前日本時期的體制，強調反帝國主義
  - label: C
    content: 面對外交受挫以及對西方文化的反省，促使本土文化抬頭
  - label: D
    content: 戰後臺灣因為經濟持續走下坡而興起反資本主義
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(D) 1970 年代為臺灣外交重挫的時期，反帝國主義、反資本主義指的應是對西方文化的反省。(B)此時關懷臺灣本土文化，並未懷念日本時期的體制。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 麥第奇家族曾積極贊助藝術家，在某次的贊助之中，該家族要求藝術家創作一尊手押寶箱、身著軍裝的雕像，暗示其家族當時在政治跟經濟的地位。有關上述內容，下列何者正確？
  options:
  - label: A
    content: 此種炫耀財富與權力的方式，在當時普遍遭到批評與不屑
  - label: B
    content: 此時藝術題材已擴展至非宗教領域，展現世俗價值
  - label: C
    content: 當時藝術創作深受啟蒙運動影響，完全脫離宗教題材
  - label: D
    content: 人像的雕刻創作屬於新興的創作手法，為當時的創舉
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此種炫富方式為文藝復興時期的常態，不致於遭非議。(C)文藝復興早於啟蒙運動，不會受到後者影響，且此時藝術創作仍多宗教題材。(D)古希臘羅馬時期已有人像的雕刻創作，並非文藝復興時期的創舉。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 「作大戲」是指信徒向神明祈福以及感謝神明保佑所舉行的活動，往往會邀請戲團在廟口表演給神明看。在早期傳統生活當中，作大戲是不可多得的有趣活動，鄉里居民也往往攜家帶眷一同觀賞。透過這段文字，我們可以如何解讀？
  options:
  - label: A
    content: 作大戲代表的是透過酬謝神明的名義延續傳統戲劇文化
  - label: B
    content: 呈現出傳統社會當中廟宇與劇團的利益關係
  - label: C
    content: 可以看出娛樂背後所帶有的文化以及與社會緊密結合的情形
  - label: D
    content: 可以看出當時社會的迷信程度
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)題文並未提到「作大戲」與戲劇文化或劇團利益相關訊息。(D)題文顯示的是鄉里居民的生活娛樂，與社會迷信無關。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 1930 年某位作家強調說：「你是要寫會感動、激發廣大群眾的文藝嗎？你是要廣大群眾心理發生和你同樣的感覺嗎？……不管你是支配階級的代辯者，還是勞苦群眾的領導者，你總須以勞苦群眾為對象去作文藝，便應該起來提倡□□文學。……因為我們所寫的是要給我們最親近的人看的，不是要特別給遠方的人看的，所以要用我們最親近的語言事物。」這位作家最有可能提倡以何種語文來寫作？
  options:
  - label: A
    content: 文言文
  - label: B
    content: 白話文
  - label: C
    content: 日文
  - label: D
    content: 臺灣話文
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從作家主張「用我們最親近的語言事物」來看，可見得他主張用臺灣本土的(D)臺灣話文來寫作，提倡臺灣話文文學。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_15
  section: 1
  number: 15
  type: single
  page: 3
  stem: 戰後移民將地方戲曲（如：京劇、豫劇）帶來臺灣。起初劇目大多著重在傳遞忠孝節義，或者民間傳統故事；然而到了某一時期，新編劇目開始有了重大變化，諸如引進中國新編戲劇《徐九經升官記》、以女性主義的觀點新編《潘金蓮》一劇，或者注重本土化角度，編製《媽祖》、《鄭成功》等戲曲。請問上述這些戲曲發展，最可能跟下列哪一歷史變化有關聯？
  options:
  - label: A
    content: 中華文化復興運動
  - label: B
    content: 政府宣布臺灣解嚴
  - label: C
    content: 鄉土文學論戰
  - label: D
    content: 兩岸文化交流
  answer:
  - B
