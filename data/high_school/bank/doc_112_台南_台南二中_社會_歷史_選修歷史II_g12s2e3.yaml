    content: 寫實主義
  - label: B
    content: 抽象主義
  - label: C
    content: 浪漫主義
  - label: D
    content: 古典主義
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 3 則資料分別給予的資訊是重視自己才能的發揮、強調自身情感、哥德式建築再興，綜合 3 者可得知此藝術風格為 19 世紀前期大盛的(C)浪漫主義。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_31
  section: 1
  number: 31
  type: single
  page: 6
  stem: 鑲嵌藝術又稱為馬賽克，是將陶瓷、石頭、玻璃等材料組合拼貼的藝術形式。鑲嵌在古希臘時代正式成為藝術的表現形式，古羅馬時代則是隨著統治者的征伐發揚光大，且流亡各地的基督徒也藉此藝術傳遞理念，自此奠基鑲嵌藝術和基督宗教的緊密關聯。4 世紀鑲嵌藝術得到空前的發展，自此，鑲嵌藝術逐漸取代歌頌勝利的大型立體雕塑，成為主流的藝術形式。拜占庭帝國延續古羅馬帝國，發展更精巧、鮮豔華麗的教堂壁畫，適用於所有室內平面，展現高度成熟的製作技巧。請問 4 世紀後，鑲嵌藝術逐漸取代先前的大型立體雕塑成為主流的藝術形式，應代表何種歷史意義？
  options:
  - label: A
    content: 統治者否定教會的權威
  - label: B
    content: 基督宗教成為文化的中心
  - label: C
    content: 對平面設計的技法純熟
  - label: D
    content: 更強調君王的豐功偉績
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題文說明鑲嵌藝術的發展與基督宗教關聯緊密，因此 4 世紀後鑲嵌藝術成為主流藝術，即代表基督宗教文化大盛，答案為(B)。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_32
  section: 1
  number: 32
  type: single
  page: 7
  stem: 根據上述資料，分析 1840 年代的愛爾蘭大饑荒肇因，下列敘述何者正確？
  options:
  - label: A
    content: 愛爾蘭大饑荒屬於天災，因愛爾蘭耕地面積不足而導致
  - label: B
    content: 愛爾蘭大饑荒屬於天災，因落後農業無法應付氣候變遷
  - label: C
    content: 愛爾蘭大饑荒屬於人禍，因英國失敗的經濟政策而導致
  - label: D
    content: 愛爾蘭大饑荒屬於人禍，因糧食作物嚴重的缺乏而導致
  group_stem: '1840 年代中期，因馬鈴薯染上晚疫病歉收，愛爾蘭爆發了一場大饑荒。從 1845 年到 1852 年，愛爾蘭 800 多萬人口中，因飢餓死去的人口超過 100 萬，占當時人口 1／8。而造成這次慘劇的原因，分析如下：

    資料一：沒地又窮的佃農，面對高昂的租金，也租不起更大更好的土地，只能在小塊土地上耕種，靠著落後的農業，勉強續命。英國還規定，愛爾蘭人種植的穀物，只能出口到英國，不能與其他國家進行自由貿易。這樣一來，英國的糧食價格被人為控制了，愛爾蘭人就算有能力在小塊土地上種植其他價格更高的作物，也沒法通過自由買賣來換更多的錢，從而改善生活。佃農與土地的關係，被束縛得非常緊。直到馬鈴薯的傳入，馬鈴薯單位產量要比穀物高得多，使得適齡青年只需要不到 1 英畝（約 4,000 $m^{2}$）的土地來種植馬鈴薯，便可以養家糊口。

    資料二：1815 年英國通過《穀物法》（Corn Laws）以前，英國不允許愛爾蘭人出口穀物到其他地方，只能賣給本土商人；另一方面，《穀物法》通過後，更加明確限制廉價的穀物進口到英國本土後，美其名為保護本土農民和地主的利益。很長一段時間以來，英國都在推行限制進口，積極擴大出口已累積財富的經濟政策，因為有貿易保護，北美便宜的糧食進不來。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 1840 年代愛爾蘭大饑荒雖然與馬鈴薯染上晚疫病有關，但英國對愛爾蘭佃農的種種限制，包括其生產的穀物只能出口英國、價格限制使北美便宜的榖物無法進口等，皆使愛爾蘭人難以維生，因此正確答案為(C)。
