  stem: 明代之前，虎患只出現在浙江蕭山、安徽祁門、福建福州等少數幾個縣市，而到明清時期幾乎遍及東南各省，在清代的東南地區共有 349 個州縣，有虎災發生的州縣占州縣總數一半以上，而平原較多的淮揚地區虎災相對較少，浙江、江西、福建等丘陵地區虎災較多，上述現象的發生應如何解釋？
