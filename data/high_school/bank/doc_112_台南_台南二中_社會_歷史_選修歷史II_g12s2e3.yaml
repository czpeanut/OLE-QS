  group_stem: '資料一：對西方世界來講，「咖啡」一詞是個外來語，英語世界稱 coffee，法文稱 café，德文稱 kaffee，義大利文稱 caffe，讀音都十分接近。據考證，西方國家在面對某群體的挑戰時，發現該群體是因為喝了「神祕的黑水」而勇氣百倍，在戰場上無往不利，西方人也發現這種黑水最初是修行者或前往聖地的人飲用，具有提神的功用，顯然具有宗教意義。咖啡傳到歐洲後，羅馬教會原本視為魔鬼的飲料，但後來教宗嘗試後，驚詫其美味，於是同意基督徒可以飲用，從此歐洲各地的咖啡館如雨後春筍般崛起。

    資料二：一位荷蘭船長在葉門得到幾棵咖啡苗後，帶往荷屬東印度地區種植成功。幾 10 年後，荷屬圭亞那一位外交官的妻子，將幾粒咖啡種子送給派駐巴西的西班牙人，他在當地試種後發現效果奇佳，加上當地的氣候非常適宜咖啡生長，從此咖啡在南美洲迅速蔓延。

    資料三：歐洲殖民者開始認知到咖啡的營利非常驚人，且歐洲及殖民地對於咖啡的需求量也很高，殖民者在殖民地實行剝削式的生產，其結果就是不斷的出現革命和叛亂，而政府往往以暴行和壓制來回應，南美洲的農場主與勞動者之間的種族對立也經常發生。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 鄂圖曼土耳其帝國於 1453 年滅掉東羅馬帝國，之後逐步擴張為橫跨三洲的帝國，時間約在(C) 16 至 17 世紀時。
