  group_stem: '資料一：皇帝指出當時狀況：「民生所以位近殷阜者，良由承平既久，戶口日繁，地不加增，產不加益，食用不給，理有必然。」

    資料二：玉米適合高山與砂礫地，經濟效益高且產量大，因此得官方的推廣。但其根鬚容易鬆土，有人說：「種苞蘆（玉米）者，先用長饞（挖土器具）除草木使盡，殆根荄茁壯，拔鬆土脈，一經驟雨，砂石隨水下注，壅塞溪流，漸至沒田地。」

    資料三：湖北某地「城外上多深林大箐，虎狼猛肉窟宅其中」，「樹密如織」，惟居民倍增以後，「巨阜危峰，一望皆包穀（玉米）」，到處出現「深林剪伐殆盡」之景象，以至「人逼禽獸，凡錦雞、百雕、虎、豹、狐狸、豺狼，皆失所藏。」'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一提到人口增加會造成耕地不足與糧食不足問題；資料二說明官方在山坡地推廣種植玉米，卻在大雨後造成土石鬆軟，泥流溪水淹沒田地；資料三提到湖北某地在居民倍增後，砍伐林木改種玉米，結果使原林地內的動物皆無法生存。綜合 3 者，最適宜的答案為(B)，資料二、資料三恰可作為資料一的補充說明。
