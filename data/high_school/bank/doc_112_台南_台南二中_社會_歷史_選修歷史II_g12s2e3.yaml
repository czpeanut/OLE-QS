  - label: B
    content: 17 世紀的法國王宮中能見到資料一的藝術型態
  - label: C
    content: 資料一較著重宗教藝術，資料二較著重世俗藝術
  - label: D
    content: 2 則資料分別呈現古希臘時代藝術與洛可可藝術
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一為文藝復興時期的藝術特徵；資料二描述的是 17 世紀的巴洛克藝術，因此答案選(A)，不選(D)。(B)應是資料二的藝術型態。(C) 2 者皆著重世俗藝術。
- id: doc_112_台南_台南二中_社會_歷史_選修歷史II_g12s2e3_s1_30
  section: 1
  number: 30
  type: single
  page: 6
  stem: '資料一：這時候，藝術發展出現重大變化，其服務對象由宮廷轉向社會，由貴族轉向大眾，藝術家更重視自己才能的發揮。

    資料二：思想家指出這時期的創作要更加朝向自己的內心王國，「身外之物沒什麼重要的」，自身情感才是唯一的關鍵。

    資料三：英國又開始盛行哥德式建築，那種喚起想像力與神祕感的情懷，賦予了新的時代氣息。

    以上現象反映何種藝術風格的興起？'
