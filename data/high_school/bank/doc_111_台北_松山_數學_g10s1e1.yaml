    (B)○：loga＝－4.8＝－5＋0.2 ⇒ a＝$10^{0.2}$×$10^{－5}$ 的小數點後第 5 位開始不為 0

    (C)○：log（loga）＝2 ⇒ loga＝$10^{2}$＝100 ⇒ a＝$10^{100}$ 的整數部分為 101 位數

    (D)○

    (E)○：a＝$10^{4.8}$，b＝$10^{2.8}$ ∴$\frac{a}{b}$＝$10^{2}$＝100

