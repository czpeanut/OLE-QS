  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 下列選項何者為真？
  options:
  - label: A
    content: $\sqrt{6}$和$\sqrt{7}$之間有無限多個有理數
  - label: B
    content: 若 x－y 為有理數且 xy 為無理數，則 x＋y 為無理數
  - label: C
    content: 若 x 為非 0 實數，且 $x^{3}$、$x^{7}$ 亦為有理數，則 x 是有理數
  - label: D
    content: $34. \overline{109}$是有理數
  - label: E
    content: $\sqrt{10}$可化成分數$\frac{q}{p}$，其中 p、q 為整數，且 p≠0
  answer:
  - A
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：有理數有稠密性

    (B)○：若 x＋y 為有理數，且 x－y 為有理數

    ⇒$\frac{1}{2}$（（x＋y）＋（x－y））＝x 為有理數

    $\frac{1}{2}$（（x＋y）－（x－y））＝y 為有理數

    ∴xy 亦為有理數，與已知矛盾

    故 x＋y 為無理數

    (C)○：$x^{3}$，$x^{7}$ 為有理數⇒$\frac{x^{7}}{(x^{3})^{2}}$＝x 為有理數

    (D)○：$34. \overline{109}$＝$34\frac{109}{999}$

    (E)╳：$\sqrt{10}$為無理數，無法化成分數

    故選(A)(B)(C)(D)'
