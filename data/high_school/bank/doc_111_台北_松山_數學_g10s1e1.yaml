  stem: '為了準備某校 11 月 12 日的校慶園遊會活動，某班自信推出黃金比例的特調飲料，其中一款是 pH 值為 2 的梅子汁和 pH 值為 3 的可樂以 1：8 的比例調製而成，請問這款「梅子可樂」的 pH 值為＿＿＿＿。（答案需四捨五入至小數點後第 1 位）

    （液體的氫離子濃度為 x 莫耳／公升，pH 值定為－logx，log2$\approx$0.3010）'
  explanation: '設梅子汁的氫離子濃度為 a 莫耳／公升

    可樂的氫離子濃度為 b 莫耳／公升

    ⇒$\begin{cases}-\log a = 2 \\ -\log b = 3\end{cases}$⇒$\begin{cases}a = 10^{-2} \\ b = 10^{-3}\end{cases}$

    ∴所求 pH 值為$-\log \frac{10^{-2}+ 8\times 10^{-3}}{9}$＝$-\log \frac{10\times 10^{-3}+ 8\times 10^{-3}}{9}$＝$-\log \frac{18\times 10^{-3}}{9}$

    ＝－log（2×$10^{－3}$）

    $\approx$－log（$10^{0.3010}$×$10^{－3}$） ＝－$log10^{－2.699}$＝2.699$\approx$2.7'
