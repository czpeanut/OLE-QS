- id: doc_110_屏東_東港_自然_生物_選修生物III_g11s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 附圖中左側大管子若代表小動脈，則右側的小管子，相當何種血管？
  options:
  - label: A
    content: 主動脈
  - label: B
    content: 靜脈
  - label: C
    content: 微血管
  - label: D
    content: 冠狀動脈
  group_stem: ◎ 附圖簡單地描述一連串直徑為1 cm的小球通過管子的情况。在此圖中，小球原來是裝在較粗管子内，經過推擠後，被擠到較小的管子內。雖然每個小管子的直徑比不上大管子的直徑，但是它們的總横切面積卻比大管子的横切面大得多。假設大管子小球移動的速度是每分鐘3 cm，而且小球之間緊密排在一起，每分鐘可以從小管排出6個小球。排出的速度是一分鐘1cm。 這個原理可以應用在心臟血管系統。主動脈的血液流速很快，到了動脈以及小動脈就慢了下來，再流到微血管之後，血液流動更是大幅下降。接著血液進入小靜脈、靜脈之後，由於總横切面變小之故，所以流速又會逐漸變快。（本文改寫自人體生理學，Vander 1994），請根據上文回答8.、9.題：
  shared_asset: g1_8_26
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
