  stem: 關於函數 f（x）＝$4\sin \left( 2x - \frac{\pi}{6} \right) - 3$，請選出正確的選項。
  options:
  - label: A
    content: f（x）的週期為 4π
  - label: B
    content: f（x）的振幅為 4
  - label: C
    content: y＝f（x）的圖形與 y 軸的交點坐標為（0，1）
  - label: D
    content: 若 0$\leq$x$\leq$2π，則 y＝f（x）的圖形與 x 軸有 4 個交點
  - label: E
    content: 函數 y＝4 sin2x 向右平移$\frac{\pi}{6}$單位，再向下平移 3 單位可得 y＝f（x）的圖形
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)╳：f（x）＝$4\sin \left( 2x - \frac{\pi}{6} \right) - 3\Rightarrow$週期為$\frac{2\pi}{│ 2 │}$＝π

    (B)○：振幅為 4

    (C)╳：令 x＝0 代入

    $\Rightarrow$y＝f(0)＝$4\sin \left( 2 \times 0 - \frac{\pi}{6} \right) - 3$＝$4\sin \left( - \frac{\pi}{6} \right) - 3$＝$4 \times \left( -\frac{1}{2} \right) - 3$＝－5

    ∴交 y 軸於（0，－5）

    (D)○：令 y＝0$\Rightarrow4\sin \left( 2x - \frac{\pi}{6} \right) - 3$＝0

    $\Rightarrow\sin \left( 2x - \frac{\pi}{6} \right)$＝$\frac{3}{4}$＝sinθ

    又 0＜θ＜$\frac{\pi}{2}$且 0$\leq$x$\leq$2π

    $\Rightarrow$0$\leq$2x$\leq$4π$\Rightarrow-\frac{\pi}{6}\leq2x - \frac{\pi}{6}\leq\frac{23\pi}{6}$

    故$2x - \frac{\pi}{6}$＝θ，π－θ，2π＋θ，3π－θ

    $\Rightarrow$2x＝$\theta + \frac{\pi}{6}$，$\frac{7\pi}{6} - \theta$，$\frac{13\pi}{6} + \theta$，$\frac{19\pi}{6} - \theta$

    $\Rightarrow$x＝$\frac{\theta}{2} + \frac{\pi}{12}$，$\frac{7\pi}{12} - \frac{\theta}{2}$，$\frac{13\pi}{12} + \frac{\theta}{2}$，$\frac{19\pi}{12} - \frac{\theta}{2}$共有 4 個解

    (E)╳：y＝4 sin2x $\xrightarrow{向右平移 \frac{\pi}{6} 單位}$ y＝$4\sin \left[ 2\left( x - \frac{\pi}{6} \right) \right]$

    $\xrightarrow{向下平移 3 單位}$ y＝$4\sin \left( 2x - \frac{\pi}{3} \right) - 3$

    故選(B)(D)'
