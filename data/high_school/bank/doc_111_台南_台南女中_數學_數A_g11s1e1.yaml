    ＝$2\sqrt{2}\sin \left( x + \frac{\pi}{4} \right)$

    $\Rightarrow$振幅為$2\sqrt{2}$，週期為 2π

    ∴f（x）＝2 sin2x－cos2x，g（x）＝2 sinx＋2 cosx，h（x）＝2 sinx＋cosx

