  explanation: '(A)○：f（x）＝4 sinx－3 cosx＝$5\left( \sin x \cdot \frac{4}{5} - \cos x \cdot \frac{3}{5} \right)$

    ＝5（sinxcosθ－cosxsinθ）＝5 sin（x－θ）

