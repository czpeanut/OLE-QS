  explanation: 'y＝2 sinx＋cosx＝$\sqrt{5}\left( \sin x \cdot \frac{2}{\sqrt{5}} + \cos x \cdot \frac{1}{\sqrt{5}} \right)$

    ＝$\sqrt{5} (\sin x\cos \theta + \cos x\sin \theta )$＝$\sqrt{5}\sin (x + \theta )$

    其中 cosθ＝$\frac{2}{\sqrt{5}}$，sinθ＝$\frac{1}{\sqrt{5}}$

    $\Rightarrow$振幅為$\sqrt{5}$，週期為 2π

    y＝2 sin2x－cos2x＝$\sqrt{5}\left( \sin 2x \cdot \frac{2}{\sqrt{5}} - \cos 2x \cdot \frac{1}{\sqrt{5}} \right)$

    ＝$\sqrt{5} (\sin 2x\cos \theta - \cos 2x\sin \theta )$＝$\sqrt{5}\sin (2x - \theta )$

    其中 cosθ＝$\frac{2}{\sqrt{5}}$，sinθ＝$\frac{1}{\sqrt{5}}$

    $\Rightarrow$振幅為$\sqrt{5}$，週期為$\frac{2\pi}{│ 2 │}$＝π

    y＝2 sinx＋2 cosx＝$\sqrt{8}\left( \sin x \cdot \frac{2}{\sqrt{8}} + \cos x \cdot \frac{2}{\sqrt{8}} \right)$

