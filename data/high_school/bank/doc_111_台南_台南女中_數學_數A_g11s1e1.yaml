  section: 2
  number: 1
  type: single
  page: 1
  stem: 在△ABC 中，若 tanA＝$\frac{1}{3}$，tanB＝$\frac{1}{2}$，則∠C 的大小為下列何者？
  options:
  - label: A
    content: 45°
  - label: B
    content: 60°
  - label: C
    content: 120°
  - label: D
    content: 135°
  - label: E
    content: 150°
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'tanA＝$\frac{1}{3}$，tanB＝$\frac{1}{2}$，又∠A＋∠B＋∠C＝180°

    $\Rightarrow$∠A＋∠B＝180°－∠C

    ∴tan（A＋B）＝tan（180°－C）

    $\Rightarrow\frac{\tan A + \tan B}{1 - \tan A \cdot \tan B}$＝－tanC

    $\Rightarrow$tanC＝$- \frac{\frac{1}{3} + \frac{1}{2}}{1 - \frac{1}{3} \times \frac{1}{2}}$＝$- \frac{\frac{5}{6}}{\frac{5}{6}}$＝－1

    $\Rightarrow$∠C＝180°－45°＝135°

    故選(D)'
