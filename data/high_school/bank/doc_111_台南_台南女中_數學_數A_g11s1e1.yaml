  stem: 設 π＜θ＜$\frac{3\pi}{2}$，若 sinθ＝$\frac{3}{2}\cos \frac{\theta}{2}$，則 cosθ的值為＿＿＿＿。
  answer:
  - $- \frac{1}{8}$ 2.17
  answer_status: verified
  answer_source: answer_key
  explanation: 'sinθ＝$\frac{3}{2}\cos \frac{\theta}{2}\Rightarrow2\sin \frac{\theta}{2}\cos \frac{\theta}{2}$＝$\frac{3}{2}\cos \frac{\theta}{2}$

    $\Rightarrow2\sin \frac{\theta}{2}\cos \frac{\theta}{2} - \frac{3}{2}\cos \frac{\theta}{2}$＝0

    $\Rightarrow\cos \frac{\theta}{2}\left( 2\sin \frac{\theta}{2} - \frac{3}{2} \right)$＝0

    $\Rightarrow\cos \frac{\theta}{2}$＝0 或$\sin \frac{\theta}{2}$＝$\frac{3}{4}$

    (1) 若$\cos \frac{\theta}{2}$＝0

    則 cosθ＝$\cos \left( 2 \times \frac{\theta}{2} \right)$＝$2\cos ^{2}\frac{\theta}{2} - 1$＝2×$0^{2}$－1＝－1

    (2) 若$\sin \frac{\theta}{2}$＝$\frac{3}{4}$

    則 cosθ＝$\cos \left( 2 \times \frac{\theta}{2} \right)$＝$1 - 2\sin ^{2}\frac{\theta}{2}$＝$1 - 2 \times \left( \frac{3}{4} \right) ^{2}$＝$1 - \frac{9}{8}$＝$- \frac{1}{8}$

    又 π＜θ＜$\frac{3\pi}{2}$

    可知 cosθ＝$- \frac{1}{8}$'
