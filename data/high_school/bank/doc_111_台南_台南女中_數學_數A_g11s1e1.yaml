  - label: E
    content: 6π公分
  group_stem: '一

    臺南女中校徽的主結構是由三個圓所構成，中間所圍成的圖形稱為「勒洛三角形」（Reuleaux triangle）。繪製勒洛三角形的方法為：

    ①取適當長為半徑畫一圓弧；

    ②以相同的半徑，在第一個圓弧上的一點畫第二個圓弧；

    ③以相同的半徑，並以兩個圓的一個交點為圓心，畫第三個圓弧。

    則三個圓弧所構成的圖形即為勒洛三角形。右圖 ABC 即為一勒洛三角形。

    勒洛三角形是一個「定寬曲線（Curve of constant width）」。所謂的「定寬曲線」是指將一個曲線圖放在兩條平行線之間，使之與這兩平行線相切，則無論此曲線圖如何轉動，其始終與這兩條平行線相切。

    依據上述定義，當一定寬曲線在兩平行線之間，不論如何轉動，其寬度皆為兩平行線之距離，此為「定寬」名稱的由來。由此可知，圓也是一個定寬曲線。

    定寬曲線有一個重要的性質：「任何寬度一樣的定寬曲線的周長都相同」，亦即兩平行直線之間的定寬曲線都有相同的周長。

    如下示意圖，$L_{1}$ 與 $L_{2}$ 為兩平行直線，Γ$_{1}$ 為勒洛三角形，Γ$_{2}$ 為圓。請回答下列問題：'
