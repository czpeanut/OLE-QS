    content: '4'
  - label: B
    content: '2'
  - label: C
    content: $\frac{\sqrt{3}}{2}$
  - label: D
    content: －1
  - label: E
    content: －4
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '$\frac{1}{\sin 50^{^{\circ}}} + \frac{\sqrt{3}}{\cos 50^{^{\circ}}}$＝$\frac{\cos 50^{^{\circ}} + \sqrt{3}\sin 50^{^{\circ}}}{\sin 50^{^{\circ}}\cos 50^{^{\circ}}}$

    ＝$\frac{2\left( \sin 50^{^{\circ}} \cdot \frac{\sqrt{3}}{2} + \cos 50^{^{\circ}} \cdot \frac{1}{2} \right)}{\frac{1}{2}\sin (2 \cdot 50^{^{\circ}})}$

    ＝$4 \cdot \frac{\sin 50^{^{\circ}}\cos 30^{^{\circ}} + \cos 50^{^{\circ}}\sin 30^{^{\circ}}}{\sin 100^{^{\circ}}}$

    ＝$4 \cdot \frac{\sin (50^{^{\circ}} + 30^{^{\circ}})}{\sin (180^{^{\circ}} - 80^{^{\circ}})}$

    ＝$4 \cdot \frac{\sin 80^{^{\circ}}}{\sin 80^{^{\circ}}}$＝4

    故選(A)'
