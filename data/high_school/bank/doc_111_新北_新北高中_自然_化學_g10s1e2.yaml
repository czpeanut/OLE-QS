    三、1897年<u>德國</u>拜耳藥廠的研究人員<u>菲利克斯．霍夫曼</u>（Felix Hoffman），為了治療因長年受風溼性關節炎痼疾所苦的父親，<u>霍夫曼</u>將柳酸（$C_{6}H_{4}$(OH)(COOH)，分子量138）加入乙酐（$C_{4}H_{6}O_{3}$，分子量102），合成出副作用較小的乙醯柳酸也就是「阿司匹靈」。 <u>霍夫曼</u>取5.52克的柳酸與5.1克的乙酐，在濃硫酸的催化下反應，所得產物經純化、再結晶及烘乾後，得到4.32克的阿司匹靈。柳酸與乙酐反應生成阿司匹靈的反應式如下

    $C_{6}H_{4}$(OH)(COOH)＋$C_{4}H_{6}O_{3}$ →$C_{9}H_{8}O_{4}$＋$CH_{3}$COOH

