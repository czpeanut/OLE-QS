  - label: B
    content: 實驗式$C_{2}H_{4}N_{4}O_{2}$
  - label: C
    content: 氮的重量百分比為48.3%
  - label: D
    content: 加熱分解後產生的氣體是橙黃色
  - label: E
    content: 圖為示性式
