  stem: 國外媒體報導美國知名潛艇堡連鎖店決定停用麵粉改良劑<u>偶氮二甲醯胺</u>（Azodicarbonamide）。 偶氮二甲醯胺是一種人工合成的化學物質，難溶於水，在室溫下為橙黃色結晶狀固體。此物在食品添加劑外的主要用途，是在製作發泡塑料時做發泡齊。它在受熱分解時產生氮氣、一氧化碳、二氧化碳和氨氣，故可在塑膠中產氣泡，其化學式如右圖，下列有關此物質的化學式，何者正確？
