- id: doc_111_台南_台南二中_數學_數B_g11s2e2_s2_1
  section: 2
  number: 1
  type: multiple
  page: 2
  stem: 設 8 支籤中有 3 支籤是有獎的，今有甲、乙、丙三人，按甲、乙、丙的順序各抽出一支籤，抽出後不再放回。選出正確的選項。
  options:
  - label: A
    content: 甲、乙、丙均抽中有獎籤的機率為$\frac{1}{56}$
  - label: B
    content: 甲、乙均抽中有獎籤的機率為$\frac{3}{55}$
  - label: C
    content: 若已知恰有一人抽中的條件下，則是丙抽中的機率最小
  - label: D
    content: 甲抽中的機率最大
  - label: E
    content: 若已知甲抽中的條件下，則乙沒抽中的機率為$\frac{5}{7}$
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$\frac{3}{8} \cdot \frac{2}{7} \cdot \frac{1}{6}$＝$\frac{1}{56}$

    (B)╳：$\frac{3}{8} \cdot \frac{2}{7}$＝$\frac{3}{28}$

    (C)╳：均相等

    (D)╳：均相等

    (E)○：P（乙沒抽中∣甲抽中）＝$\frac{P (甲抽中且乙沒抽中)}{P (甲抽中)}$＝$\frac{\frac{3}{8} \cdot \frac{5}{7}}{\frac{3}{8}}$＝$\frac{5}{7}$

    故選(A)(E)'
  tags:
