  stem: 以下有關我國參與經濟學人專文所指之組織的敘述，請問何者正確？
  options:
  - label: A
    content: 該組織的英文縮寫為CHO
  - label: B
    content: 我國至今持續以觀察員身分參與該組織
  - label: C
    content: 世界衛生大會是該組織的最高權力機構
  - label: D
    content: 我以中華民國的名義利用觀察員身分出席會議
  group_stem: 2019年12月中國式漢爆發新型冠狀肺炎（COVID-19）疫情，短短幾個月內已造成全球170多國染疫，病例數及死亡人數不斷攀升，至2020年3月底全球累計71萬多例確診外，其中3萬3千多例死亡。該病毒傳染的速度較過去許多疫情來得快速和嚴重，公衛專家指出失控的疫情與世界衛生組織有很大的關係，其主因在定調全球大流行的速度過慢、未能確切掌握疫情造成各國疫情嚴重；另有智庫學者提出不同見解，認為流行推手與無遠弗屆、成本趨廉的國際海空運輸衍生的國際貿易與投資產生更密切的人流與物流的商務互動，以及愈來愈少的邊境管制等有關。 而鄰近中國的臺灣，面對疫情第一時間祭出防疫物資一律禁止出口、加開口罩生產線、研究疫苖投入，以及入境旅客篩檢、積極檢驗並實施口罩配給等制度，努力降低感染情況及病情嚴重程度。低感染率引起各國媒體的報導，我國善盡國際成員的責任，不僅為駐台使節與代表進行簡報，近日也在國際理協會舉辦的網路會議中，與43國分享台灣防疫經驗。多國直言將參採台灣防疫模式，我國成功地進行防疫外交；經濟學人雜誌更專文寫道不應該把防疫冠軍拒於組織之外。 綜論多國分析臺灣防疫經驗，可歸納幾個優勢：一、健保制度使人民看診意願高，連動出入境資料後也容易找到確診之感染源。二、經SARS的疫情後，國家的防疫已有系統性的準備。三、人民對於戴口罩的高接受度，成了第一道防疫的共同推手。四、政府透過快速的實名制領取口罩、生活用品產能提高等政策降低國民的恐慌感和社會成本。近日，美國與我國更共同推動聯合防疫聲明，包括發展疫苖、防疫物資交換、快篩試劑的研發等，為我國外交空間提昇能見度。 參考資料：<u>https://www.thenewslens.com/channel/2019-nCoV</u>
