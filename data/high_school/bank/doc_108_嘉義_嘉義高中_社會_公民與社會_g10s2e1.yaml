  stem: 國民年金制度中，已婚者若繳不起保費，而配偶有工作，則配偶必須幫忙繳費，否則可能遭罰3,000元到15,000元，這個設計有助於保障家務勞動者。請問下列關於國民年金制度特別考量家務勞動者的原因說明，何者最正確？
  options:
  - label: A
    content: 家務勞動者屬於依賴人口，是對經濟沒有幫助的弱勢者，需要特別照顧
  - label: B
    content: 家務勞動者能讓市場性勞動獲得支持，卻容易因為沒有收入而遭到忽略
  - label: C
    content: 特別考量家務勞動者，能照顧天生適合家務勞動的女性，促進性別平等
  - label: D
    content: 要求配偶為家務勞動者繳費，可以讓責任回歸家庭，取代社會安全制度
  group_stem: 我國的國民年金於2008年開辦，目的在於讓未納入勞保、農保、農保、公教保的無收入者，遭遇老年、傷病、死亡時可以獲得基本經濟保障。雖然整體經費由政府負擔4成，低收、中低收入戶及身心障礙者還能獲得更多補助，而且家務勞動者的配偶如果有工作，也必須依法為另一繳交保費，以免受罰，但在加入國民年金的300多萬人之中，仍有103萬人沒有繳納首期保費，其中「無力負擔」和「不想繳」的人約各占4成，一旦欠費超過10年，日後請領的給付將縮水，甚至無錢可領。問題不只如此，根據勞保局2018年底的精算報告，國民年金預計在2048年破產，就算每2年依法調高收費，也只能多撐5年。
