- id: doc_108_嘉義_嘉義高中_社會_公民與社會_g10s2e1_s1_37
  section: 1
  number: 37
  type: single
  page: 4
  stem: 試分析《新疆維吾爾自治區去極端化條例》，請問下列何者為正確的解讀？
  options:
  - label: A
    content: 中國積極壓抑新疆地區的「在地化」特色，使其走向全球化
  - label: B
    content: 中國為維護國家安全及秩序，因此針對伊斯蘭教徒進行管控
  - label: C
    content: 中國秉持種族主義設置再教育營以進行對維吾爾族人的同化
  - label: D
    content: 中國藉再教育營對維吾爾族人進行職業訓練是在減少文化位階
  group_stem: 長久以來，中國政府和新疆一直處在衝突、緊張的政治拉扯中。在中國14億人口中，約有2千5百萬人居住在新疆維吾爾自治區，其中有1千多萬名維吾爾族人、哈薩克族、回族等少數民族居民，文化以伊斯蘭教和維吾爾語為主，但他們的文化自由長期受到打壓。2018年中國公布《新疆維吾爾自治區去極端化條例》，宣誓要「打擊泛清真概念」，阻止伊斯蘭文化「滲透」世俗社會，同時抑止「極端主義蔓延」。在這樣的法案下，任何展現出極端言行的人都可能被送進「職業技能教育培訓中心」（世界稱為再教育營），透過思想教育、心理輔導、行為矯正、學習國家語言與法律等方式來達到「教育轉化」的目的。在再教育營裡，維吾爾人只能講中文，還必須參加譴責伊斯蘭文化的講座，喊出讚美中國共產黨的口號，撰寫反省文、宣誓效忠中國領導人習近平等。 聯合國消除種族歧視委員會的觀察報告指出，中國政府已經把維吾爾自治區轉化成大型集中營，有將近1百萬名維吾爾人或穆斯林少數族群，在中國政府「打擊恐怖主義或宗教極端分子」的定義下遭到拘禁，並呼籲中國政府以平等、合理的方式對待少數民族。
  tags:
    unit:
      code: CI-1-7-1
      book: 公民與社會1 民主與人權
      chapter: 文化與社會規範
      title: 族群文化
      std: true
