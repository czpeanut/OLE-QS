  stem: 根據上文，下列對於國民年金制度的敘述，何者正確？
  options:
  - label: A
    content: 國民年金是為了保障人民的基本生活，因此屬於社會救助
  - label: B
    content: 國民年金具有財富重分配的效果，可以減緩貧富差距擴大
  - label: C
    content: 國民年金能兼顧公平正義、資金運用效率、財務永續經營
  - label: D
    content: 無力負擔保費的人，日後請領給付也受影響，恐難獲保障
  group_stem: 我國的國民年金於2008年開辦，目的在於讓未納入勞保、農保、農保、公教保的無收入者，遭遇老年、傷病、死亡時可以獲得基本經濟保障。雖然整體經費由政府負擔4成，低收、中低收入戶及身心障礙者還能獲得更多補助，而且家務勞動者的配偶如果有工作，也必須依法為另一繳交保費，以免受罰，但在加入國民年金的300多萬人之中，仍有103萬人沒有繳納首期保費，其中「無力負擔」和「不想繳」的人約各占4成，一旦欠費超過10年，日後請領的給付將縮水，甚至無錢可領。問題不只如此，根據勞保局2018年底的精算報告，國民年金預計在2048年破產，就算每2年依法調高收費，也只能多撐5年。
