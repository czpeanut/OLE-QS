  stem: 資料一：1998年，加州州政府財政局長鄺傑靈（Matt Fong）競選該州參議員，記者在進行採訪時紛紛問他：「如果美中開戰，他會支持哪一國？」但事實上鄺傑靈是第四代美國華人。 資料二：吳振偉（David Wu）出生於臺灣新竹，6歲時全家移民美國，1998年成為美國史上第一位華裔眾議員。但他曾在2001年5月要進入華府能源部時遭人擋了下來。他曾對外表示：「最讓我感到震驚的是，他們兩度質問我是不是美國公民。」 從以上兩段例子可以看出1990年代的美國社會，對於華人有著怎樣的觀點？
  options:
  - label: A
    content: 華人並不擁有美國公民身分
  - label: B
    content: 華人出任美國公職的情形非常普遍
  - label: C
    content: 此時美國仍有種族隔離政策
  - label: D
    content: 華人常被懷疑對美國的忠誠度
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 美國某一時期曾有份傳單寫著：「我們……請求每位黑人在週一不要乘坐公車，來抗議逮捕和審判。……如果您要工作，可以搭乘計程車或走路。但是拜託，孩子與大人們，週一不要坐公車。請不要在週一搭乘公車。」請問該份傳單發行的時代背景應是：
  options:
  - label: A
    content: 1860年代，美國正值南北内戰，奴隸主常在公車上捕捉逃亡的奴隸
  - label: B
    content: 1950年代，美國的種族隔離政策引發非裔人士的怒火
  - label: C
