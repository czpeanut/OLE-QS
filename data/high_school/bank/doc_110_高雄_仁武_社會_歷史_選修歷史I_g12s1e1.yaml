- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 遠離自己的故鄉到異鄉會面臨各種未知的挑戰，所以往往需要強烈的動機才會成行。如：明代移至東南亞發展的華人；清治時期移至臺灣開墾的閩粵移民；清末移民至美國開採金礦的華工；20世紀初朝鮮人民移至日本東北發展；20世紀許多東南亞移民到臺灣投入勞動市場等等。請問對於上述移居的例子何種解釋較為正確？
  options:
  - label: A
    content: 這些移民在原居地都曾遭到宗教迫害
  - label: B
    content: 這些移民的移動都是出於政府強迫
  - label: C
    content: 這些移民都能快速融入移居的文化
  - label: D
    content: 這些移民都屬自發性的經濟移民
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 2008年一則新聞報導提到：尊崇夏威夷最後一位自稱國王後代瑪希拉尼‧卡昊女王的「夏威夷王國政府」，4月30日眾多支持者占據檀香山伊歐拉尼宮的大門廣場，並搭起帳篷，宣稱○是非法占領的外國政權，應將夏威夷還給原住民。「夏威夷王國政府」表示他們共有千餘位追隨者並建立網站，主張去除「占領政權」相關的法律、政策和規範，解散夏威夷州，把土地和資產歸還原住民。請問：「夏威夷王國政府」抗議的對象是：
  options:
  - label: A
    content: 美國
  - label: B
    content: 西班牙
  - label: C
    content: 英國
  - label: D
    content: 日本
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「你和其餘兩百個人從愛爾蘭坐船前往美國。 船已經開了五週，但美國仍舊看似遙遠。 你和你的家人只能棲身於角落這小小的空間，每天耳聞孩子及病人的哭鬧聲。 每晚伴隨著風浪及汗味尿味入睡，而你兩歲的女兒病得很重。 她問說：『媽媽，為什麽我們要離開美好的家？』而你卻找不出字句回答她。」 上文反映了19世紀許多愛爾蘭家庭普遍的處境。請問，當時多數的愛爾蘭人離鄉背井的原因為何？
  options:
  - label: A
    content: 愛爾蘭當時爆發嚴重的傳染病
  - label: B
    content: 愛爾蘭當時正與英國進行反殖民戰爭
  - label: C
    content: 愛爾蘭當时發生嚴重飢荒
  - label: D
    content: 愛爾蘭快速地邁向工業化，以手工業維生的小家庭頓失生計
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 2018年紐西蘭北部的毛利族人來到臺灣展開文化交流，他們對於臺灣各個原住民族的傳統文化很感興趣，有些人認為自己部落的編織與建築與阿美族相似，有些人覺得他們的語言與臺灣原住民族有許多相同之處，請問兩地如此相似的原因為何？
  options:
  - label: A
    content: 因為兩者都屬於南島語族體系
  - label: B
    content: 因為臺灣、紐西蘭兩地都深受荷蘭文化影響
  - label: C
    content: 因為毛利族是臺灣原住民族的祖先
  - label: D
    content: 全球各地的原住民族文化本就大同小異
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 「美國在十九世紀末而通過排華法案，限制華人移民美國；然而，當時的中國政權對此歧視的法案竟也不表示反對，反而不希望人民離開國家，這項不平等的法案持續了好幾十年，直到二次世界大戰之時，排華法案才被廢止。」下列有關此段論述何者正確？
  options:
  - label: A
    content: 排華法案通過時，當時的中國政權是袁世凱為首的北京政府，為拉攏列強所以不表反對
  - label: B
    content: 排華法案產生的原因是因為黃種人給美國帶來天花、麻疹等傳染病
  - label: C
    content: 排華法案的廢止是因為中國跟美國在二戰期間位於同一陣線
  - label: D
    content: 排華法案導致將近幾十年沒有亞洲人移入美國
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 「這是一個非常時期，很多男人都出去打仗了，大城市在招募人力投入生產線，我趁著這個機會也想去城市體驗一下不同的生活，在這段期間，我認識了很多白人，原來他們不是像我們一直以來所想的那樣惡劣，我發覺我們之間還是能夠好好交流的，只不過他們怎麼有辦法負擔得起那樣豪華的家？每當發薪水的時候，他們的薪水袋也總是比部落的我們還厚，我們是不是受到不一樣的待遇？」請問上述内容可能是選項中哪一種狀况？
  options:
  - label: A
    content: 南北戰爭時，美國非裔人士組成的軍隊認知到遭受美國白人不平等的薪資對待
  - label: B
    content: 二戰時的滿洲國内，臺灣人面對日本同事時心中所產生的疑問
  - label: C
    content: 二戰時，毛利人湧入城市投入生產，意識到自身權益長久以受到漠視與壓迫
  - label: D
    content: 國共內戰時，中國少數民族開始投入勞動，發現漢人的薪資較為優渥
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 在某場戰爭期間，由於美國人對日本此國家的氣憤與恐懼，並將這些負面情緒完全發洩到日裔美國人身上，因此當時對日裔美國人進行辱罵和施暴之情事時有發生，而政府方面，聯邦調查局則以美國安全的潛在危險為藉口，搜捕了約15,000名日裔美國人。這樣的情形最可能發生在哪一個時間點？
  options:
  - label: A
    content: 第一次世界大戰時
  - label: B
    content: 珍珠港事件後
  - label: C
    content: 韓戰期間
  - label: D
    content: 越戰期間
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 1865～1869年間，美國招募了許多來自某地的移工參與北美太平洋鐵路的興建，這些工人在不僅要冒著生命危險與血汗薪資興建鐵路，在工程完成後也未能受到美國社會肯定，國會反而在1882年通過法案禁止其入境美國。直到2014年，美國勞工部才將這些工人登上大廳的「勞工名人堂」，以表彰貢獻。請問根據題幹描述，這些工人應是來自哪裡？
  options:
  - label: A
    content: 中國
  - label: B
    content: 愛爾蘭
  - label: C
    content: 日本
  - label: D
    content: 衣索比亞
