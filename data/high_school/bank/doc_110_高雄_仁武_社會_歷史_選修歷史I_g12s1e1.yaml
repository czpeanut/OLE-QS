- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在北美的移民，經常將一些地方以英國地名來命名，例如紐約（NewYork）、紐澤西（New Jersey)，臺灣也有不少來自中國地區的地名，如潮州、安溪等等。請問之所以會出現這樣的現象，主要是受到怎樣的影響？
  options:
  - label: A
    content: 反映出移民對原鄉的認同
  - label: B
    content: 這些名稱是後來的史學家為紀念該地移民的歷史而命名的
  - label: C
    content: 移民者的母國強力要求所致
  - label: D
    content: 統治移民者為方便管理，規定以原居地命名
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 在十七世紀之後，有大量的非洲裔人口湧人美洲大陸，其主要的原因為何？
  options:
  - label: A
    content: 非裔移民主動前往美洲大陸追求較好的經濟發展
  - label: B
    content: 美、非地區的殖民母國，刻意對兩地區進行移民政策
  - label: C
    content: 因為美洲農事需要大量的勞動力，所以自非洲大量引入黑人
  - label: D
    content: 非洲部落的戰爭日趨嚴重，非洲人為躲避戰禍前往美洲
