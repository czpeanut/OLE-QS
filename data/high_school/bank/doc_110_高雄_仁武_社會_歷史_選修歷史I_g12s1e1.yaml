  stem: 資料一：1867年，英國殖民政府通過原住民法土地法修正案，建立「十首制」，毛利人出讓一塊土地只要有十個毛利族人簽名同意，就可以確定所有權的轉讓。 資料二：1993年，紐西蘭政府通過毛利土地法，採土地信託的模式管理毛利人的土地開發與不動產權利，這裡的土地信託包含個人持有的土地，也包括以親族群、部落、族群為單位的大區域土地信託。 請問這些法案的制定，反映了甚麼樣的意涵？
  options:
  - label: A
    content: 隨著時代愈後，紐西蘭政府對於毛利人土地私有化的態度愈趨積極
  - label: B
    content: 傳統上毛利人的土地為集體持有，土地是公共財
  - label: C
    content: 1867年的法案，證實當時的政府致力於保護毛利人的傳統領域與習俗
  - label: D
    content: 1993年的法案，讓紐西蘭的政府可以合法地將毛利人的土地收歸國有
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_24
  section: 1
