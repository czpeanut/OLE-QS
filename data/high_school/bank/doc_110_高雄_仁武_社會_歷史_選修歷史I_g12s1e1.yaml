  type: single
  page: 3
  stem: 20世紀末時迪士尼電影「風中奇緣」播出時引起了一股研究美國早期歷史的風潮，故事裡的主角寶嘉康蒂與約翰史密斯皆是真實的歷史人物。根據約翰史密斯的紀錄，他在1607年遇到印第安人時，印第安人「把他拖了過去、把他的頭擺在石頭上，準備用棍棒打得他腦漿进裂」，最後是「酋長最疼愛的女兒寶嘉康蒂」及時救了他。後來兩人產生了情愫，但日後兩人因際遇不同而越行越遠。寶嘉康蒂後來嫁給一位經營菸草園的英國男士，也改信了基督教，1616年隨著夫婿來到英國旅行，獲得上層社會的禮遇。可惜卻在隔年返回維吉利亞時得到天花而病逝，享年僅22歲。約翰史密斯寫下了他與寶嘉康蒂的故事，受到英美人士普遍的歡迎，並隨著時間的推移增添更多的傳奇性；在美國有許多地名、地標、產品都以寶嘉康蒂來命名。但現代史學家對約翰史密斯的說法有諸多質疑，指出他的說法有諸多不符合史實之處。關於這段描述，下列哪些解讀較為適宜？
  options:
  - label: A
    content: 約翰史密斯對於寶嘉康蒂的紀錄是為一手史料。可信度相當高
  - label: B
    content: 寶嘉康蒂改信基督教，並與英國上層階級的移民結婚，是當時北美洲移民與原住民共同生活下的常態
  - label: C
    content: 殖民者以故事美化對原住居民壓迫與衝突是常見的手段，臺灣日治時代的吳鳳故事亦是一例
  - label: D
    content: 寶嘉康蒂的故事受到歐美人士歡迎，顯示他們對於印第安文化的高度推崇
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_25
  section: 1
  number: 25
  type: single
  page: 3
  stem: 美國國内有許多不同族裔的移民，雖然帶來強大的經濟動力外，但也讓民族問題變得複雜而敏感。美國近年來從過去「熔爐論」的主張，逐漸轉變為「多元文化主義」的觀點，其中轉換的時間點與時代背景為何？
  options:
  - label: A
    content: 1920年代，一次世界大戰結束，和平的追求使美國社會轉向「多元文化主義」
  - label: B
    content: 1940年代，希特勒的種族優越論引起反感，美國社會因而轉向「多元文化主義」
  - label: C
    content: 1960年代，民權運動勃興，美國社會轉向「多元文化主義」
  - label: D
    content: 1980年代，美國經濟再度起飛，美國社會轉向「多元文化主義」
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s1_26
  section: 1
  number: 26
  type: single
  page: 4
  stem: 根據資料一的内容，下列何者最能描述初至美國華人的心情？
  options:
  - label: A
    content: 在美國雖尊嚴有損，但實質獲利
  - label: B
    content: 避走他鄉，轉認同美國即是故鄉
  - label: C
    content: 孤魂野鬼，無法回國遂浪逐他鄉
  - label: D
    content: 選擇在美國，既獲實利又享美名
  group_stem: ◎資料一：美國國會通過《排華法案》後的幾十年間，在美華人在文化認同上有如孤魂野鬼一般；他們面臨兩難的困境，一來是自己不被美國社會接受的壓力，二來是考量經濟上美元在匯兌上的優勢，唯有留在美國工作，才有機會讓遠在中國老家的親人過著相對奢侈的生活，因此他們最終沒辦法（或者不願意）返回中國。此外，由於當時中國的政治環境遠比美國更為動盪與危險，因此僅管留在美國必須面對許多不友善的法律，且他們僅為社會的邊緣人，但在這裡他們可享有因天高皇帝遠而獨有的政治權利與自由，他們可以在此組織反清團體、不用擔心遭到逮捕與報復，也可提供中國的激進分子急需的經濟援助。 資料二：一位在美國出生的華人回憶童年生活：「小時候，每次學校只要教到中國內容，班上其他同學都會轉身瞪著我，仿彿我就是活生生的教具。我記得其中有一課講到中國史，課文中描述中國佬的形象為：古怪矮小、留著辮子、眼睛歪斜，描述得簡直已經不像人類了，當下我覺得心情特別糟糕。」而這些華裔美國孩童常常必須面對在外白人歧視與在家爸媽管教的雙重壓力。回家後，某些父母會要求小孩不准在家裡講英語，要求他們放學後還要上中文學校，學習基礎的中文、書法、哲學與古典文學。這些華人家長深信，這些課程可讓孩子牢記自己的華人身分，建立家庭與祖國之間的維繋。然而事實是：不論是中文學校或是家長嚴厲的管教，都無法避免美國文化排山倒海般對華裔美國孩童造成影響。這些在美國出生、長大的華人已習慣講英語，而且動不動就是滿嘴美式俚語。在認同上他們都熱愛美國且企圖心強烈，渴望在此取得第一流大學的學位，將來在社會上謀得好工作。 資料出處：改寫自張純如《美國華人史：十九世紀至二十一世紀初，一百五十年華人史詩》（臺北：遠足文化，2018年)，頁231〜232、258〜259、260～261
