  stem: 1975年紐西蘭政府設立「懷唐伊法庭」，接受毛利人對政府提出的抗議與申訴，並加以調查、調解與判決，至今「懷唐伊法庭」已經受理了許多毛利族群向政府提出的權利訴訟案件。請問懷唐伊法庭主要是受理哪一方面的申訴案件？
  options:
  - label: A
    content: 文物保存
  - label: B
    content: 原住民族自治
  - label: C
    content: 母語保障
  - label: D
    content: 土地權利
