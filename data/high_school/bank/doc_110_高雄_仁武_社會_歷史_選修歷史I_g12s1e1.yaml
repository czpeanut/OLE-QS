  stem: '資料一：北美河狸毛皮貿易對北美原住民的生活產生了一定程度的影響，它改變了當地原有的社會關係和文化習慣。這種改變起因於商人以歐洲製造的工藝品向原住民蒐購毛皮。歐洲人對毛皮的需求強化了原住民族群之間的競爭，他們不但競爭新的獵場以滿足歐洲人日益增加的需求，也競相取得歐洲的貨物 ─ 因為歐洲貨物已經成為原住民工藝技術的必要成分，以及身分地位的表徵。 資料二：（在歐洲）買得起河狸帽的人比派頭、比身分，製作河狸帽的商人爭奪市場占有率。加拿大供應的河狸毛皮刺激帽子的需求，進而推高帽子價格和利潤。對當時正欲在聖羅倫斯河谷建立第一批小殖民地的法國人而言，價格、利潤飆升是一大利多，因為這給他們帶來意想不到的收入來源，以支應勘察、殖民的開銷。在巴黎值一里弗赫（法國舊貨幣）的商品，運到北美洲換河狸毛皮，再運回巴黎，價值升為兩百里弗赫。這一買賣也使原住民和歐洲人關係更為緊密。早年，原住民認為他們在占貿易夥伴的便宜，「英格蘭人沒腦筋，拿二十把像這樣的小刀跟我們換一張海狸毛皮」，法國人付的價碼稍低於英格蘭人。在原住民經濟裡，河狸皮的價值遠沒有歐洲人所付的那麼高。雙方都認為對方吃了虧，而在某個方面來看，雙方的看法也都沒錯，這樁買賣因此得以如此興旺。 資料出處：改寫自艾利克‧沃爾夫著，賈士蘅譯，《歐洲與沒有歷史的人》(臺北：麥田，2013)，頁217～218：卜正民著，黃中憲譯，《維梅爾的帽子》(臺北：遠流，2010)，頁64～65

    (1)( )透過河狸毛皮貿易，北美原住民與歐洲人接觸後，帶動的影響為何？'
  options:
  - label: A
    content: 短期而言，雙方皆蒙受其利
  - label: B
    content: 長期而言，雙方皆蒙受其利
  - label: C
    content: 短期而言，原住民蒙受其害：長期而言，歐洲人蒙受其害
  - label: D
    content: 短期而言，歐洲人蒙受其害；長期而言，原住民蒙受其害(2分)
