  stem: 1937年起，10月14日成為紀念哥倫布的聯邦假日，但在1992年，加州柏克萊市率先宣布將「原住民日」取代哥倫布日，其他州或城市陸續響應。直到今日，全美已經有超過10州和逾百座城市將哥倫布日改為原住民日。請問：關於以上資料，我們應如何解讀？
  options:
  - label: A
    content: 柏克萊為了彰顯哥倫布的貢獻，於是在傳統的節日活動之外另舉行原住民的活動
  - label: B
    content: 哥倫布為歐洲人殖民美洲的象徵，因此柏克萊創立原住民日，取代哥倫布日
  - label: C
    content: 在柏克萊宣布舉行原住民日之後，美國政府宣布全國廢除哥倫布日
  - label: D
    content: 柏克萊宣布以「原住民日」取代哥倫布日的該年，是哥倫布「發現新大陸」600周年
  - label: E
    content: 當站在不同族群的立場時，對過去所發生的歷史會有不同的解讀
- id: doc_110_高雄_仁武_社會_歷史_選修歷史I_g12s1e1_s2_30
  section: 2
  number: 30
  type: multiple
  page: 4
  stem: 1892年夏天，美國麻塞諸塞州（右圖深色區域）的秋河市波頓家發生了可怕的命案。安德魯‧波頓出身於富有的家庭，又是英裔移民的後代，但因受到成長歷程與宗教因素的影響，個性非常檢吝。他的第一任妻子生下兩個女兒艾瑪與麗茲後就過世了，安德魯再娶艾比為妻，但兩姊妹與繼母關不睦。艾瑪與麗茲年後，並沒有外出工作，僅依賴安德魯提供的少許零用金生活。1892年8月4日，麗茲和波頓家女僕布莉姬發現安德魯被類似斧頭的兇器毆打頭部倒臥在客廳沙發上，而艾比則是在二樓的客房中被同樣的手法遭到殺害，死因相同。由於死狀太過慘烈，加上被害者具有一定的社會地位，執法當局也迅速展開調查，當時在命案附近活動的愛爾蘭裔、義裔移民都遭到懷疑，布莉姬是愛爾蘭裔，亦遭到訊問和調查。但由於缺乏證據，最後檢警認為麗茲‧波頓嫌疑最為重大。但僅管麗茲沒有不在場證明，供詞也反覆不定，但報紙輿論顯然傾向麗茲‧波頓，認為一位未婚且出身高貴、教養良好的女性，不可能能以手斧殘酷地劈人致死，最後陪審團全數通過麗茲無罪的判決。但中下層民眾對這樣的判決十分不滿，他們將此案件編創成童謠，諷刺麗茲的殘忍。這個案子成為美國史上重大懸案之一，迄今未破。若以歷史的角度來加以解讀，下列哪些敘述何者為是？
  options:
  - label: A
    content: 麻塞諸塞州是18世紀時英國在美洲的13洲殖民地之一
  - label: B
    content: 即使是同樣來自歐洲，移民間的地位也會因母國不同而有所差異
  - label: C
    content: 以安德魯的出身背景來看，他應該是信奉天主教
  - label: D
