  group_stem: 美國總統拜登簽署了一項與人工智慧（AI）有關的行政命令，這也是歷任美國總統中所簽署的第一個 AI 行政命令。由美國總統所發布的行政命令是一種行政法令，主要是用來指示聯邦政府機構該如何執行法律、政策或行政事務，在符合美國憲法與既有的聯邦法令下，行政命令具備重要的執行權力，特別是可於國會通過立法之前制定新政策。規定人工智慧研發商須將測試結果等最新資訊通知政府，並以法規確保 AI 工具在公開發行之前，先確定「安全無虞」。但由於國會立法與國際協約尚未完成，故此項行政命令僅有 90 天到 365 天不等的有效期限。
