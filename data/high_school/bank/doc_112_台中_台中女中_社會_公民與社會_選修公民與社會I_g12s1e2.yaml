  stem: 19 世紀中葉大批華人到美國當「苦力」，他們用血汗建成跨大陸鐵路後，經濟一衰退便引起白人勞工的排擠。聯邦《排華法案》於 1882 年實施，這是美國第一次針對一個特定種族立法限制。華人勞工禁止入境，已在美的華人不能當公民，離美後不准再入境，且禁止華人與其他種族女子通婚，所以基本上華人移民沒有延續血脈的機會。《排華法案》直到 1943 年才廢除，然而名為放寬，其實每年只許 105 個華人入境。1949 年後，進入極端反共的麥卡錫時代，更以抓共諜為藉口迫害華人。直至 1965 年美國移民法大改革，華人才得到與其他種族平等的對待。根據上述，請問下列何者為是？
