  group_stem: '資料一：美國聯合汽車工會（UAW）和通用汽車、福特汽車和克萊斯勒母公司 Stellantis 旗下的各一家工廠，同步舉行罷工，可能因工資和就業保障引發出一場代價高昂又曠日持久的對決。六週後終於達成了史無前例的協議，結束了與底特律汽車製造商漫長的勞資談判和罷工。據已知消息，工會成員將在 4 年半的協議期內獲得 25 ％的薪資增幅，其中包括在協議生效後的 11 ％加薪，還將恢復生活成本調整、增加 401(k)公司繳款以及提高的利潤分享獎金。

    資料二：自從 9 月 15 日有針對性的罷工開始以來，福特的股價下跌了 23 ％，通用汽車下跌了約 19 ％，而 Stellantis 則下跌了約 4 ％。目前尚不清楚這些協議將給這些公司帶來多少勞動力成本上漲，但這些公司曾經主張，滿足工會的所有要求會影響它們的競爭力甚至長期生存能力。德意志銀行最近估計，福特的協議將使成本總增加 62 億美元，通用汽車為 72 億美元，Stellantis 為 64 億美元。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)罷工屬於爭議權的範疇。(B)非任何人，應屬於與汽車產業相關的從業人員才行。(C)加薪會使得名目 GDP 增加，為正確敘述。(D)股價的漲跌並不計入 GDP。
