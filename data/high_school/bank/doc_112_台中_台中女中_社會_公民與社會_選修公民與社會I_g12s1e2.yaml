  stem: 下圖為 2012 至 2021 年我國員工報酬、營業盈餘占 GDP 比率之分配趨勢，從圖形中得到之結論，何者為是？
  options:
  - label: A
    content: 隨著營業盈餘持續上升，受僱員工共享報酬成果
  - label: B
    content: 顯見政府採取的重分配政策已發揮成效
  - label: C
    content: 從基層受僱員工報酬比例可推測我國貧富差距愈來愈小
  - label: D
    content: 總體經濟營運成果分享員工分額呈現遞降趨勢
  assets:
  - key: s1_9_f1
    kind: figure
    file: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2/s1_9_f1.png
    crop:
      page: 2
      rect:
      - 174.35
      - 619.0
      - 443.75
      - 769.1
  explanation: (A)由 2021 年的數據得知，營業盈餘與受僱員工的報酬不一定成正比，此敘述有誤。(B)盈餘並無反映至員工的報酬，可知政府的重分配政策無發揮效果。(C)從該圖表無法推估貧富差距的情形。(D)從數據中可見，2013 ～ 2017 年營運成果與員工報酬之比例呈穩定，2017 ～ 2019 年呈現遞增，之後則逐年降低，並無統一趨勢。綜合上述，此題無答案。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 3
  stem: 承上題，針對以上我國經濟發展趨勢之變化，學者們紛紛指出政府應重視此趨勢變化帶來之社會問題，要求提出有效政策。若要從整體經濟面解決此現象，政府應採何種政策比較有效呢？
  options:
  - label: A
    content: 中央銀行調降存款準備率
  - label: B
    content: 提高上市櫃高階主管所得稅率與降低基層人員稅率
  - label: C
    content: 對中低收入戶提高就學、就業、醫療之補助
  - label: D
    content: 針對身心障礙者福利加碼
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 從圖表可知，廠商所得之盈餘並未分配至受僱員工的報酬，因此政府應該由福利政策進行所得重分配，或使弱勢者的處境得到改善，避免貧富差距擴大。(A)與貨幣政策無關。(B)高階主管仍為受僱員工，但從統計數據無法得知報酬分配在不同職業位階者的比例。(C)救助弱勢，有助於減緩貧富差距擴大，為正解。(D)此與身心障礙者的福利政策無關。
