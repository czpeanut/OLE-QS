  group_stem: '2021 年原本是聯合國訂定的「國際終結童工年」，然而受到疫情衝擊，以菲律賓為例，2020 年度至 2021 年度，菲律賓約 273 萬名學生沒有註冊上學─其中不包含輟學、及因遠距離而沒有繼續上學的孩子─而這些不在學校學習的孩子，大多都已放下書本、在全國各地工作。

    菲律賓 81 個省分中，有超過 30 個省分擁有豐富的地下礦產資源，目前有近 30 萬人在這些地區從事非法採礦工作，更有成千上萬名兒童被迫加入危險度極高的壓縮機採礦，因為這種工作報酬遠比種植農作物來得高。壓縮機採礦必須咬著軟管、耳朵塞著布條，並進入深及 20 至 30 公尺的地下水道，以鏟子採集可能含有黃金的泥漿，將泥漿放進沙袋後再浮回地面。採礦過程需要在地下停留數個小時，且全程只能透過連接到空氣壓縮機的一根長軟管來呼吸。礦工採集泥漿後對地面上的人發出信號，再被緩緩拉出地道。

    採集泥漿只是工作一部分，回到地面後要再進行掏洗與分離，接著混入汞加熱、成型。工作一整天得到的黃金體積只有 0.5 立方公分，可換取約 2,200 披索（新臺幣 1,245 元），並分給每個參與工作的人。人權觀察組織曾試著了解童工情況，受訪者當中最年幼的童工才 9 歲。他們發現，這些孩子大多患上皮膚炎、痙攣、身體疼痛、汞中毒等健康問題，成為永久的傷害。'
