- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 由英國所號召的第一屆 AI 安全高峰會在英國布萊切利園（Bletchley Park）展開，有 28 個國家共同簽署了《布萊切利宣言》，就前沿人工智慧（frontier AI）所帶來的機會與風險達成了共識。宣言中指出，在人類積極探究 AI 所能帶來的貢獻之餘，其餘人類對於 AI 可能帶來的風險或傷害也還在摸索中，而 AI 所帶來的許多風險基本上是國際性的，因此各國有必要推動相對應的監管架構，以最大化 AI 的好處並管理風險。請問此項宣言可能涉及到哪些公民權利之保障？(甲)政治權(乙)自由權(丙)社會權(丁)訴訟權(戊)隱私權
  options:
  - label: A
    content: (甲)(乙)
  - label: B
    content: (乙)(丁)
  - label: C
    content: (丙)(戊)
  - label: D
    content: (乙)(戊)
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從該宣言可看出為防範 AI 所帶來的風險和傷害，即會限制民眾的資訊使用自由，也會牽涉其隱私權的規範，故應選(D)乙戊。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 勞動力可分為就業者與失業者 2 大類，而失業率是指失業人數占勞動力之比率。請問下列何者將會造成失業率上升？
  options:
  - label: A
    content: 原本在海軍服兵役的賈不妙，因涉嫌縱火案遭法院判刑退伍後立即坐牢 2 年
  - label: B
    content: 陸露米原本是一名建築板模工人，因發生工安事件，導致左腿殘缺無法工作
  - label: C
    content: 大丙於今年 6 月大學畢業後，一直不想找工作，每天都待在家中當啃老族
  - label: D
    content: 福山先生原本擔任天龍大樓保全的工作，離職後每天都到朋友開的小吃店幫忙
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)原本為軍人，後為監管人口，兩者皆不計入民間人口，不在失業率的討論範疇。(B)原本為勞動人口，後為身心障礙者為非勞動力，會使失業率上升。(C)沒有找工作的意願與行動，無論畢業前後皆為非勞動力，不計算於失業人口。(D)仍持續有工作，不計入失業人口。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 右圖為我國 2022 年 8 月至 2023 年 8 月物價上漲率的變化。根據資料，可以得出何種結論？
  options:
  - label: A
    content: 若是要購買一籃子相同的商品，2023 年 1 月需花費最多的金錢
  - label: B
    content: 2023 年 1 月至 7 月期間，我國的消費者物價指數（CPI）呈現持續上漲的趨勢
  - label: C
    content: 2023 年 7 月至 8 月期間，因為消費者物價指數（CPI）上漲，我國的實質所得一定跟著提高
  - label: D
    content: 每個家庭購買的內容及頻率可能差異懸殊，讓 CPI 的變動與個人對物價漲跌的感受常有落差
  assets:
  - key: s1_3_f1
    kind: figure
    file: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2/s1_3_f1.png
    crop:
      page: 1
      rect:
      - 337.25
      - 408.2
      - 564.3
      - 556.5
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)圖中 2023 年 1 月的 CPI 上漲率最高，因此要買相同的商品，該月分會花費最多的錢，為正確敘述。(B) 2023 年 1 月到 7 月雖然物價上漲率皆為正值，但仍有高低，非呈現持續上漲的趨勢。(C) CPI 上升，反倒可能使實質薪資減少。(D)每個家庭購買的內容及頻率雖各有差異，但不致懸殊，一般會對生活用品及食品漲幅較有感。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 南海周遭始終存在主權爭議，2013 年菲律賓向荷蘭海牙國際法庭提出仲裁，仲裁法院 2016 年之仲裁判決結果對菲律賓較有利，於是中國就常在附近海域引發衝突。2023 年 8 月更發射高壓水柱阻撓菲方赴所屬島礁進行補給，緊張情勢升高，並對外發布《 2023 年版標準地圖》，將臺灣、南海諸島及中印爭議領土納入中國疆域，引發臺灣、印度和菲律賓等多國抗議。根據現代主權國家的概念，下列何者為是？
  options:
  - label: A
    content: 南海諸島中 200 海浬經濟海域衍生出的多種資源導致各國不願接受仲裁法院之裁決
  - label: B
    content: 主權對國內國外擁有至高性，因此國際法院的仲裁結果不具有任何效力
  - label: C
    content: 各國對該事件之爭議僅止於經濟海域，與主權不相關
  - label: D
    content: 國際法庭做出的仲裁結果，就算各國不同意也只能接受
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)主權應是對內具有最高性，對外具有獨立性。(C)經濟海域也屬於國家主權討論的範疇。(D)文中的海牙國際仲裁法庭非聯合國轄下之國際法院，一般較不具拘束力；若是聯合國轄下之國際法院做成判決後，當事國必須遵守判決；若一方不願遵守判決，他方可以請求聯合國安理會做成決議，命他方遵守並執行判決。因此，才會出現如本題中之情況，故並非只能接受。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 據法媒 Le Moci 報導，法國海關數據顯示，該國 2022 年貨品出口額較 2021 年增長 17 ％，達 5,009 億歐元，僅低於疫前水準之 2 ％，主要係因約有近三分之二之出口產品價格上漲，帶動該年度下半年出口額大幅成長。法國以美酒、時尚服飾與精品名牌包等商品為出口大宗。儘管法國有嚴苛的勞動條件保護，但勞工生產力仍非常高，只不過高勞動成本並未拖垮經濟。由上推測，法國主要的出口產品暢旺卻違反供給法則之主要原因為何？
  options:
  - label: A
    content: 法國的政治制度屬於中央集權，能由政府確保出口產品保障獲益
  - label: B
    content: 在經濟面，法國採計畫經濟制度，控制只有順超的品項能夠出口
  - label: C
    content: 犧牲法國勞工之薪資以換得出口產品價格上漲
  - label: D
    content: 法國主要出口產品多屬炫耀財，因而售價愈高愈得消費者青睞
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此與中央集權的政治制度無關，應是貿易政策所影響。(B)法國偏向自由貿易的市場經濟，而非計畫經濟。(C)由敘述「高勞動成本並未拖垮經濟」，可知並非犧牲勞工之薪資以換得出口品的價格。(D)法國出口產品多屬精品名牌，為炫耀財，因此會違反需求法則，為正解。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 有關法國政治制度之敘述，何者為「非」？
  options:
  - label: A
    content: 選民可能採取「策略性投票」，投給並非最支持，但比較可能出線的候選人，以避免第二輪競爭者都是自己討厭的
  - label: B
    content: 法國政黨政治屬於多黨制，不同政黨在第二輪選舉容易相互結盟
  - label: C
    content: 第二輪選舉為獲得選民支持，最好採取偏激路線增加獲勝機率
  - label: D
    content: 總統候選人經過兩輪選舉過程，正當性較一般民主國家強
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)因為法國總統採用單一選區絕對多數決制，會造成策略性投票無誤。(B)法國的選舉制度易形成國會多黨聯盟的型態無誤。(C)第二輪需獲得過半票數，採用偏激路線不易爭取最多選票，此為錯誤敘述。(D)因為當選者需獲得過半數支持，因此正當性會較其他採用相對多數選舉制的國家來得高。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 跨國公司除了外包傳統的製造業外，對其他生產經營環節如研發、設計等，也開始陸續向其他地區外包。這種新產業外包趨勢是伴隨企業規模加大而不斷擴張。以下有關企業業務委外並跨國經營的敘述，何者正確？
  options:
  - label: A
    content: 幫蘋果公司代工的東南亞國家勞工，形同直接受僱於美國企業，無法減少該國的失業率
  - label: B
    content: 先進國家的勞工可因此大量移動到開發中國家就業，降低先進國家失業問題
  - label: C
    content: 會選擇委外並跨國經營者多基於企業機會成本的考量，著眼於提高獲利
  - label: D
    content: 跨國企業通常會藉由委外經營藉此援助開發中國家，改善貧富差距
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)失業率仍是以國籍及工作地計算，並非計算於受僱國。(B)通常是因開發中國家人力低廉，因此會促使先進國家至他國設廠，同時創造開發中國家民眾之就業機會，反而造成其本國失業率上升。(C)委外及跨國考量的是低廉的勞動成本與環境成本，有助於減少成本並提高獲利，為正確敘述。(D)跨國企業委外經營是基於利潤考量，而非援助其經濟。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 在有色金屬中，具有極佳導電性的銅，是廣泛應用於電子零件及建築中的重要金屬，當全球政府積極推廣電動車（電動車平均銅用量為傳統汽車四倍）與再生能源（再生能源系統銅用量是傳統電力系統五倍以上），銅的需求量將大幅成長。但從供給端看，根據國際銅業研究組織提供的資料顯示，近年來全球銅市卻處於供給嚴重短缺的情況。據此，若依照市場供需法則來推測 2021 ～ 2022 年全球銅市之變化，何者最為正確？
  options:
  - label: A
    content: 均衡價格上漲，均衡數量不變
  - label: B
    content: 均衡價格上漲，均衡數量減少
  - label: C
    content: 均衡價格上漲，均衡數量增加
  - label: D
    content: 以上情況皆有可能發生
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從題幹可知，全球銅的需求增加，供給減少，因此均衡價格必定上升，均衡數量變化不一定，有可能上升、減少或不變，故應選(D)。
- id: doc_112_台中_台中女中_社會_公民與社會_選修公民與社會I_g12s1e2_s1_9
