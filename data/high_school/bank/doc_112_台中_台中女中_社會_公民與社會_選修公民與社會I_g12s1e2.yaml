  stem: 某加工廠僅生產蛋糕與蛋豆腐兩種產品。過去尚未遇到蛋荒時期，該食品加工廠的 PPC 線為圖形黑色實線（右圖）。試問當面臨到蛋荒之後，若不改變蛋糕與蛋豆腐的生產比例，PPC 線會改變成哪一條虛線？
  options:
  - label: A
    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  group_stem: '臺灣鬧蛋荒，主要是受到氣候因素影響，由於蛋雞適合產蛋溫度為 13 至 24 度，若遇到氣溫較低的時節，產蛋率便會下降；日夜溫差大，也導致產蛋率差。至於成本部分，隨著國際原物料價格上揚，也導致飼料成本不斷上漲，近 2 年內雞飼料漲幅逾 5 成，而飼料成本又占蛋雞 7 成左右，蛋農生產成本提高，也不願增加產能。此外 2022 年冬天起禽流感肆虐全世界，導致全球皆鬧蛋荒。再加上臺灣有 8 成雞場是傳統養雞戶，空間狹小、易傳染，2022 年至今撲殺超過 100 萬隻，也導致產蛋率下降、供不應求。

    前述的種種原因，到了年節時刻更將購買需求推至頂峰，以致年前蛋價爆升，由原本 1 臺斤 28 元，上揚至 1 臺斤 42 元，漲幅達 5 成，農委會趕緊祭出農曆年前「凍漲」指示。雖然對消費者來說購買成本不會增加，但卻壓縮蛋農和蛋商的利潤，不少蛋農決定先換羽減產，進一步擴大缺蛋情況。

    農委會要求年前凍漲，影響成本的雞飼料價格卻管不住，蛋農利潤被飼料漲價吃掉，凍漲後只能自行吸收；而蛋商四處搶蛋，甚至加價收購，卻受限於凍漲政策無法用合理的價格賣出。產銷都苦不堪言。於是農委會想出補助進口蛋的方法來平穩蛋價，卻爆出平均補助進口蛋的金額高出蛋本身之售價而引發非議。'
  shared_asset: g1_25_27
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹說明該加工廠僅生產這兩種產品，遭遇蛋荒會使生產可能線向內移動，因為原物料減少，無法維持原有的產量，且又說明不改變生產比例，因此答案應為(D)丁。
