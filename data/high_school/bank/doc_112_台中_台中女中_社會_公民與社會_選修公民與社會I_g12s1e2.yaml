  stem: 有一對夫妻沒有生小孩、公婆也不在人世，而房子登記在丈夫名下。因丈夫罹癌恐時日不多，打算提早遺產分配，卻發現夫妻因沒有小孩，須和丈夫的唯一弟弟共分遺產，但小叔在成年離開原生家庭後，就與丈夫有嫌隙，丈夫不願死後小叔可以依法分配財產，希望能將所有遺產都留給妻子。請問依照《民法》之規定，丈夫可以怎麼做？
  options:
  - label: A
    content: 由妻子收養小孩
  - label: B
    content: 自書遺囑寫明遺產不給兄弟姊妹，由配偶繼承全部遺產
  - label: C
    content: 蒐集小叔有構成對丈夫的重大侮辱或虐待事證寫在遺囑裡
  - label: D
    content: 完全不讓小叔知道丈夫離開人世的消息
