  stem: 來自土耳其的臺灣女婿吳鳳邀請同樣住在臺灣定居 14 年的美國籍藝人柯龍上節目談臺灣。柯龍表示，臺灣真是太好了，相比美國不僅健保制度非常好、治安更好。此外，柯龍也提到，<u>臺灣物價低，很便宜，美國雖然收入多，但稅收很重，差不多「30 ～ 45 ％」</u>。兩人都很稱讚臺灣的健保制度，吳鳳表示在土耳其補牙約 1 萬多臺幣，柯龍卻對吳鳳說這「很便宜」。柯龍透露，美國如果自己沒有投保，拔智齒大約 600 美元（約 1 萬 9 千元臺幣）。請問畫底線部分提及的收入與物價的關聯性可以用哪一種指標呈現兩人之觀點？
