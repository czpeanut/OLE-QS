    | 勞動參與率 |  | 2012 年 | 38.9 ％ | 2022 年 | 47.3 ％ |

    | 就業人數 |  | 2012 年 | 382.1 萬人 | 2022 年 | 491.3 萬人 |

    | 職業結構 | 民代及主管人員 | 2012 年 | 1.23 ％ | 2022 年 | 2.33 ％ |

    |  | 專業人員 | 2012 年 | 6.95 ％ | 2022 年 | 15.3 ％ |

