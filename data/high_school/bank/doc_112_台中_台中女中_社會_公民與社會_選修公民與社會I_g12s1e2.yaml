  explanation: (A)由妻子收養小孩仍無法解決丈夫的弟弟享有特留分的權利，但除非兩人共同收養小孩。(B)依據《民法》相關規定，遺囑不能違反弟弟享有繼承特留分的權利。(C)此方法符合《民法》現行規定。(D)不讓小叔知道丈夫離開人世，可能會影響繼承時效，無法剝奪其繼承權。
