  section: 1
  number: 22
  type: single
  page: 3
  stem: 若你是伊拉克總理，何種「神奇解方」較能回應人民之訴求？
  options:
  - label: A
    content: 承諾改善對人民自由權的保障
  - label: B
    content: 承諾改善對人民政治權的保障
  - label: C
    content: 承諾改善對人民社會權的保障
  - label: D
    content: 承諾改善對人民文化權的保障
  group_stem: ◎ 題組：伊拉克街頭首都巴格達和南部多座城市2019年10月開始湧現大批民眾示威，要求府改善就業和公共服務。示威者也說：「我們沒有人帶頭，看看有多少人在這裡。我們都是失業的青年。」抗議群眾最主要不滿包括青年失業率高漲。他們高舉的海報和喊出的口號，紛紛訴求工作「權利」。 伊拉克是石油輸出國家組織成員國。根據國際貨幣基金，它的石油蘊藏量居全球第4，握有經濟發展的資源。但2014年統計該國4000萬人口中，竟有900萬人每天收入不到新臺幣60元，六分之一的家戶三餐不繼。根據世界銀行與國際勞工組織的資料，伊拉克青年2017年失業率高達25%，是全體失業率的2倍。此外，示威群眾還不滿經常面臨斷電和缺水政府貪腐。伊拉克被「國際透明組織」（Transparency International）列為腐敗程度居全球第12名的國家。 《法新社》報導，抗議已造成1600多人受傷，且人數可能還會繼續增加。上任一年的總理阿卜杜－馬赫迪11月4日首度透過全國轉播回應抗爭訴求，呼籲抗議者冷靜，沒有能夠立即處理伊拉克問題的「神奇解方」，希望民眾給予時間，讓新政府實踐改革計畫。總理也表示全力支持鎮暴軍警執法，表示迄今所有執法行動都符合「國際準則」。
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_23
  section: 1
