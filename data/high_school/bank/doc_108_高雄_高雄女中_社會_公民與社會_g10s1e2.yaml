  page: 1
  stem: 歐洲足球國家盃寳格賽，因看臺上保加利亞球迷對亞裔球員做岀帶有種族歧視的行為，並且做岀象徵納粹精神的敬禮手勢，使裁判於上半場暫停比賽兩次。請問何者為裁判暫停比賽的原因？
  options:
  - label: A
    content: 球迷場邊的行為會影響場上運動員的注意力
  - label: B
    content: 保加利亞球迷的行為屬於否認弱者的歧視行為
  - label: C
    content: 納粹精神的敬禮手勢屬過度簡化的刻板印象
  - label: D
    content: 球迷的行徑屬於政治譏題，與足球賽事不相關
