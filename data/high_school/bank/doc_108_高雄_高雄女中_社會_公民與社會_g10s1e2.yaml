  stem: 勞工團體爭取多年的《最低工資法》，目前相關草案，已經送進行政院審查，等院會通過後，才會送進立院。前行政院院長陳沖指出，草案是將基本工資審議辦法，提高到法律位階，如果沒做好基本功，不如制定最低便當法。前行政院院長以諷刺的方式來彰顯本次修法的重要性，請問：勞工團體爭取的最低工資法，屬於何種人權？
  options:
  - label: A
    content: 政治權，屬於消極的人權
  - label: B
    content: 自由權，屬於積極的人權
  - label: C
    content: 社會權，屬於積極的人權
  - label: D
    content: 文化權，屬於集體的人權
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 想讀法律系的貝拉看到某份資料顯示，1992年之前，刑法100條規定：意圖破壞國體、竊據國土或以非法之方法變更國憲、顛覆政府，而著手實行者，處七年以上有期徒刑。但資料中沒有提到1992年修法的原因，請幫貝拉判斷以下何者為刑法100條修法的理由？
  options:
  - label: A
    content: 竊據國土非一般人民能力所及，寫進刑法中多此一舉
  - label: B
    content: 顛覆政府的形式多元，寫進刑法法條的內容應更具明確性
  - label: C
    content: 意圖兩字難以認定，可能成為政府打壓特定思想與言論的工具
  - label: D
    content: 國體為全體國民可共同決定之事項，破壞國體就被處罰不合理
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 警方執行非法外籍移工查察勤務時，發現一名印尼籍女子身邊有一個10個月大的男嬰，細查之下才知道她原本有個交往一年的印尼男友、男友是合法來臺的同鄉，但女子一懷孕就被拋棄。請問：這名10個月大的男嬰目前在我國是否享有我國國籍？
  options:
  - label: A
    content: 是，在我國領土誕生則享有我國國籍
  - label: B
    content: 是，其父為合法來臺外勞應享有我國國籍
  - label: C
    content: 否，印籍女子與這名男友並無婚姻關係
  - label: D
    content: 否，我國國籍取得以屬人主義為原則
