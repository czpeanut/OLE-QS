  stem: 索馬利亞面臨近期最嚴重的連續大豪雨，使當地洪水成災、土石流頻傳，有100萬人因此受影響，聯合國難民署第一時間撤離逾2萬人，糧食組織也運送大量物資，總計260噸的食物。世界衛生組織則對此次災情可能帶來大量霍亂疾病提出警示。請問聯合國難民署的行為，是基於何種理由？
  options:
  - label: A
    content: 由於索馬利亞人權受損嚴重，聯合國難民署會優先處理
  - label: B
    content: 聯合國是世界政府，任何人權危機都應該被關注與處理
  - label: C
    content: 難民署是基於人道救援，目的是拯救生命、減少不幸遭遇
  - label: D
    content: 難民署是基於人道干預，在戰爭中為了保存性命所作的干預政策
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 承上題，世界衛生組織對此發布警告，指出索馬利亞的洪水災害區可能會成為大規模霍亂疾病的發生熱點，當地無足夠的醫療資源可供人民使用，組織發言人表示：「人們恐因汙水囤積而生病或溺斃，我們認為還會有更多的災情，尤其是當地沒有充足的醫療設施。」請問：從世界衛生組織發言人所說的內容，可判斷索馬利亞人民何種公民權利保障不足？
  options:
  - label: A
    content: 政治權
  - label: B
    content: 自由權
  - label: C
    content: 社會權
  - label: D
    content: 文化權
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 「Holland」原為荷蘭西部2個省份「北荷蘭（North Holland）」與「南荷蘭（South Holland）」的名稱，在17世紀時，兩地構成了荷蘭共和國的主要國土，但仍有北荷蘭與南荷蘭以外的其他領土，直到19世紀，「the Netherlands」成為荷蘭的正式國名，但荷蘭與外界仍會使用「Holland」。荷蘭政府近日宣布，今後不再使用「Holland」稱謂，一律使用官方的正式名稱「the Netherlands」。同學們課堂上討論此正名運動，請判斷以下何者敘述正確？
  options:
  - label: A
    content: 此正名運動影響國家構成要素中領土的範圍
  - label: B
    content: 此正名運動展現出今日荷蘭人民國家認同的力量
  - label: C
    content: 過去以少數地區名稱來代表荷蘭國名，屬於一種對弱勢的肯認
  - label: D
    content: 從「Holland」變成「the Netherlands」是形式改變，與國家認同無關
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 1992年納入烏克蘭管轄的克里米亞自治共和國，在2014年3月16日透過「脫烏入俄」公投成為俄羅斯的一部分，至今已滿五年。當年公投初通過時，克里米亞以超過97%的票數支持，宣布從烏克蘭獨立，並加入俄羅斯共和國。歐盟曾發聲明強調，堅定支持烏克蘭(甲)完整，更強調俄羅斯對克里米亞的(乙)主張並不合法，若俄羅斯持續干預他國，歐盟不排除祭出經濟制裁。根據上述新聞，請判斷下列敘述何者正確？
  options:
  - label: A
    content: 依照國家組成要素，(甲)跟(乙)分別是人民、領土
  - label: B
    content: 依照國家組成要素，(甲)跟(乙)分別是領土、主權
  - label: C
    content: 上文中歐盟祭出的經濟制裁是一種國際間的人道干預
  - label: D
    content: 克里米亞2014年脫烏入俄，是當地民眾自由權的展現
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 德國政治經濟學與社會學家韋伯曾對正當性的類型提出分類，並強調「當國家具有統治的正當性後，有助國內政治局勢穩定及政權的延續」。有關正當性的描述，下列何者正確？
  options:
  - label: A
    content: 具備正當性就一定具有合法性
  - label: B
    content: 只要政府推出公共政策就一定具有正當性
  - label: C
    content: 具有正當性的政權通常民意支持度較高
  - label: D
    content: 具備合法性就一定具有正當性
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 發生在2013年的八里媽媽嘴咖啡店雙屍案，這起刑事案件備受討論的其實是偵查初期，媒體為搶獨家輕率的將媽媽嘴負責人呂○○等人視為兇手，用僅限的資訊當成直接的確定訊息，甚至不斷揣測案情，更將整個命案過程如：藏屍、棄屍、犯案動機等細節報導出來，其實已經嚴重侵害無辜者的人權。請問此一行為已違反哪個概念？
  options:
  - label: A
    content: 被告緘默
  - label: B
    content: 言論自由
  - label: C
    content: 人身自由
  - label: D
    content: 無罪推定
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 南非2015年有大規模的學生示威抗議，主因為南非多所大學預計於2016年調漲10.5%的學費，學生代表與校方談判無果後發動示威抗議、罷課，更聚集在首都開普敦的國會外面示威；同時在網路上串聯，以標籤「#Feemustfall」（學費必須降）為主題，將照片和影片貼在網路上，讓多所也大幅調漲學費的大學學生響應。針對此次學生示威抗議行動，警方出動大批警力及催淚瓦斯企圖驅離群眾，社群媒體上處處可見警民衝突、瓦斯煙霧瀰漫的照片，引起網路上一片眾怒。根據上述文字，請判斷下列敘述何者正確？
  options:
  - label: A
    content: 南非大學生聚集在首都開普敦的國會外示威，是大學生的結社自由
  - label: B
    content: 根據南非大學生的抗爭狀態，可以判斷大學調漲學費的作法正當但不合法
  - label: C
    content: 若後續南非政府明定，明年各大學學費調漲幅度將不得超過6%，是具有合法性的規定
  - label: D
    content: 針對抗議行動，警方出動大批警力及催淚瓦斯企圖驅離群眾，將嚴重影響人民的人身自由
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 南太平洋島國萬那杜（Vanuatu）2016年時推出新的移民計畫，允許外國人透過投資移民獲得國籍並取得護照。萬那杜一本護照要價僅15萬美元（約460萬臺幣）、申辦迅速，因此受到中國大陸等海外人士的歡迎，販賣護照已變成萬那杜政府最大收入來源。請以主權的概念，判斷以下敘述何者正確？
  options:
  - label: A
    content: 護照屬於主權對國內的展，對人民來說十分重要
  - label: B
    content: 批評人士認為，濫發護照可能導致種族主義的發生
  - label: C
    content: 透過投資擁有萬那杜的護照，代表已歸化成為該國國民
  - label: D
    content: 在國外發生急難時，須以護照搭配身分證才可至大使館求助
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 關於八週禁墮胎的公投案，行政院性別平等處參議楊筱雲表示，雖然行政院尊重各證人鑑定人與權責機關見解，但有關本案是否屬於人權事項一節，已國內法的<u> (甲) </u>便規定締約各國應採取男女平等生育的保健服務，婦女有權自行決定子女人數、生育間隔、教育方法，明文保障婦女健康權、生育權、自主權，而本次公投提案「心跳法案」正落在影響婦女之健康權、生育權、自主權的範疇。請問：依照敘述，(甲)應為何者？
  options:
  - label: A
    content: 兒童權利公約
  - label: B
    content: 公民與政治權利國際公約
  - label: C
    content: 經濟社會文化權利國際公約
  - label: D
    content: 消除對婦女一切形式歧視公約
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 阮神父在臺中火車站搭計程車時，司機主動話家常：「我兒子剛花1萬美元買了一個越南女孩」阮神父一聽，很驚訝，「你說什麼？」司機回說，「就花錢買新娘啊！」阮神父遺憾地說，現在民眾還很自然的用「買」這個字，難免對外配有偏見，認為「我花錢買你，所以妳照顧公婆、做家事 都是應該的。」加上臺灣八成六的外配都來自東南亞，民眾很難從外表分辨，到底是移工還是新住民，很習慣用「外勞」來統稱他們。多年下來，即便說者無意，但這個名稱，已被影射成不對等的階級印象。雄女有某組同學想以此現象作為小論文的題材，請判斷以下敘述何者正確？
  options:
  - label: A
    content: 阿花：以「買新娘」來形容與配偶結婚的行為，屬於性別的不對等
  - label: B
    content: 小草：嫁來臺灣的新住民被稱作「外勞」，對他們的身分認同不會有影響
  - label: C
    content: 阿樹：肯認與保障新住民是專屬於政府的責任，政府應盡快推動相關政策
  - label: D
    content: 大根：現在已將「外勞」正名為「移工」，專指東南亞前來臺灣工作的勞工
- id: doc_108_高雄_高雄女中_社會_公民與社會_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 《想像的共同體》中提到，「……民族於是夢想著成為自由的，並且，如果是在上帝管轄下，直接的自由。衡量這個自由的尺度與象徵的就是主權國家。」此段話為作者在描述從啟蒙運動開始，對人民的約束力逐漸從宗教轉移到主權的手上，可推論作者認為一個共同體共享的信念，在主權上可以展現為：
  options:
  - label: A
    content: 對外有自主性
  - label: B
    content: 對外有最高性
  - label: C
