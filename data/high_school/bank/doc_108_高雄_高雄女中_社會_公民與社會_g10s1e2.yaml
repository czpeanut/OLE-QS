  stem: 圖嘉是一位來臺的西藏人，被問到：都已經到了尼泊爾，為什麼還要再次漂流來到臺灣？圖嘉說，因為到了尼泊爾，當地政府沒有給他們任何身份，因此也不能工作，過著「什麼都沒有」的艱困生活。他進一步說，「有些來到臺灣的『哥哥』有拿到身分證，他們說臺灣人很好、會幫助西藏人，有機會的話要過來」。他父親丹旺這時補充，「拿到身分證，才有工作機會可以賺錢」。不擅長說中文的圖嘉聽了父親的說明後，帶著微笑說著「For better life」。請問：取得身分證對難民具有重要性的原因為何？
  options:
  - label: A
    content: 只有擁有國籍者才能受到國家法律的保護
  - label: B
    content: 取得身分證，才可受國家社會福利制度的保障
  - label: C
    content: 擁有國籍者，在人權受侵害時才能獲得保障
  - label: D
    content: 擁有身分證才算取得公民地位，才可參與投票
  group_stem: ◎ 題組：資料一：中國國家宗教事務局2007年7月頒布「藏傳佛教活佛轉世管理辦法」，規法「一般的活佛由省、自治區人民政府宗教事務部門審批，有較大影響的活佛，報國家宗教事務局審批；特別重大影響的活佛，報國務院審批」。就北京的立場，<u>達賴喇嘛轉世議題與其繼任者必須由中國政府決定</u>。 資料二：「活佛轉世」是藏傳佛教特有的繼承制度。<u>一般是掌教者過世後，經過宗教儀式尋找、認證轉世者，經過宗教訓練後，繼承原有的銜，與一切宗教及政治上的權利義務</u>。達賴喇嘛在接受日本《產經新聞》採訪時表示：「如果西藏人民希望維持達賴喇這一傳統儀式和規定，我現在考慮一個方式是在我還在世的時候選出下一世達賴喇嘛。」達賴喇嘛說，其他方式包括用民主方式在高僧中選出或者他指定繼承人。他說：「如果中國在我死後選出十五世紀達賴喇嘛，西藏人民不會喜歡支持他，因為他不會有向著西藏的心。」
