  stem: .從臺灣到曰本就讀大學的留學生愛理某天在課堂上和各國學生介紹臺灣：「臺灣位在日本的西南方，我們的首都是臺北。」同班的中國學生以諷刺的口吻回應：「原來臺灣首都在臺北呀，我還以為在南京呢！」請問：若依主權爭來分析，中國的學生會這樣回應，可能原因為何者？
  options:
  - label: A
    content: 我國的法理主權與事實主權不一致
  - label: B
    content: 中國的法理主權與事實主權不一致
  - label: C
    content: 中國承認我國是具有主權的政治實體
  - label: D
    content: 我國的延伸領土也屬於領土範圍的一部分
