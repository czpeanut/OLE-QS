  group_stem: ◎ 題組：聯合國人權理事會在瑞士日內瓦召開會議，何韻詩接受非政府人權組織邀請，以香港反送中事件為例，痛陳「一國兩制」接近死亡。以下擷取何韻詩發言的內容及中方提出的臨時動議： 何韻詩：「我是何韻詩，來自香港的歌手及民主運動人士，『維也納宣言』保障民主和人權，然而如今這些在香港卻遭到嚴重打擊，上個月有200萬人參加反對修訂逃犯條例的和平抗議活動，這法案的修訂將瓦解保護香港免受中國政府干預的屏障，警察向手無寸鐵的抗議群眾，發射橡皮子彈和152枚催淚彈…」 中國代表戴德茂：「副主席先生，中方行使程序性動議，香港特別行政區是中華人民共和國的組成部分，剛才這位所謂的非政府組織代表發言者，發言將香港與中國並列，挑戰了一個中國原則，違反了聯合國憲章，請主席敦其使用符合聯合國規範的正確表述。」
