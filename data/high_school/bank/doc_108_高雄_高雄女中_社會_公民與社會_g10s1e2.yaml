  stem: 美國建國元勳丶也是避雷針發眀人富蘭克林曾說:「今天有個人養了頭公驢，價值五十元，他有投票權；但驢子在下次選舉前死了，他就無權投票了！」他以簡單的故式來凸顯當時美國選舉制度的荒謬，但儘管如此，直到他辭世近七十年，美國的窮人才獲得選舉權。請問富蘭克林當年說這段話，想表達的概念可能為以下何何者？
  options:
  - label: A
    content: 當時美國的公民身分為一種普遍的人權
  - label: B
    content: 當時美國的公民權利屬於一種特權的標誌
  - label: C
    content: 以財產作為取得投票權的標準，可提升美國民主水平
  - label: D
    content: 動物的生命可貴，以此作為取得投票權的標準可保障動物權
