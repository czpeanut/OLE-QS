- id: doc_112_台南_台南二中_數學_數B_g11s1e1_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 關於廣義角θ＝－10，則下列哪些選項是正確的？
  options:
  - label: A
    content: θ的最小正同界角為 4π－10
  - label: B
    content: sinθ＜0
  - label: C
    content: tan（－θ）＞0
  - label: D
    content: sin（π－θ）＜0
  - label: E
    content: cos（π＋θ）＞0
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：∵－4π＜－10＜－2π

    ∴0＜－10＋4π＜2π

    故－10 的最小正同界角為 4π－10

    (B) ╳：4π－10$\approx$4×3.14－10＝2.56

    ⇒ $\frac{\pi}{2}$＜2.56＜π

    ∴4π－10 為第二象限角

    故 sinθ＝sin（－10）＝sin（4π－10）＞0

    (C) ○：由選項(B)得，－θ為第三象限角 ⇒ tan（－θ）＞0

    (D) ╳：由選項(B)得，π－θ為第一象限角 ⇒ sin（π－θ）＞0

    (E) ○：由選項(B)得，π＋θ為第四象限角 ⇒ cos（π＋θ）＞0

    故選(A)(C)(E)'
