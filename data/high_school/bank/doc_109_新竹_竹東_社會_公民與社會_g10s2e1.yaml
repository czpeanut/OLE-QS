- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 5
  stem: 政府在從事任何行政行為時，應該要權責相符，因此所有的施政行為都需要透過一套相當嚴謹的監督機制，確保施政品質與內容符合人民所需。請問根據上述題文可以發現使《著作權法》修法暫緩的原由是下列何者？
  options:
  - label: A
    content: 透過定期選舉檢驗政府施政
  - label: B
    content: 立法院監督與質詢行政官員
  - label: C
    content: 輿論反應促使政策重新考量
  - label: D
    content: 行政過程納入民意見的要求
  group_stem: 【題組六】立法院民進黨團在立院臨時會提出「著作權法部分文修正草案」，引發音樂人不滿，質疑修法為幫非法重制的侵權業者護航，公然讓「非法重製的侵權盗版人伴唱機」就地合法；就此，行政院長蘇貞昌今日在臉書發文強調，經政院與黨團再三溝通後，決定中止修改《著作權法》。修法的原因在於許多長輩愛與好友齊聚里民中心觀唱，卻因為伴唱機夯涉侵權，收到存證信函，使得人心惶惶，因此民進黨立院黨團決議提案修法。經濟部官員表示，《著作權法》是保護權利人的利益，音樂人的主張很好理解，但里民歡唱行為不涉及營利，且有公益性，兩邊權益要如何保障，是現在要思考權衡的地方，因此為了兼顧雙方權益，行政院正在跟民進黨團積極溝通中，建議傾向先暫緩修法，並強化溝通、廣納音樂界的意見；政院官員表示，希望兼顧歌曲版權不會特定業者持續買斷、音樂著作權人獲得合理報酬，並讓基層民眾在合理付費的情況下，也能唱到想唱的歌曲。
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s2_36
  section: 2
  number: 36
  type: single
  page: 5
  stem: 行政院發掘到人民對於《著作權法》的條法有相當分歧的聲音，因此打算先暫緩修法，先將名種意見整合之後再進下一步動作。請問關於政府施政過程中，下列何者敘述最符合民主國家對行政的要求？
  options:
  - label: A
    content: 政府具施政的行政權，只要對人民有益的法案都可直接制定
  - label: B
    content: 民主政治採多數政治為原則，因此只要多數民意支持即可執行
  - label: C
    content: 《政府資訊公開法》規定所有的政府資訊應對民眾主動公開與了解
  - label: D
    content: 政府施政應顧及多元性與代表性，適當時應舉辦公聽會以參考
  group_stem: 【題組六】立法院民進黨團在立院臨時會提出「著作權法部分文修正草案」，引發音樂人不滿，質疑修法為幫非法重制的侵權業者護航，公然讓「非法重製的侵權盗版人伴唱機」就地合法；就此，行政院長蘇貞昌今日在臉書發文強調，經政院與黨團再三溝通後，決定中止修改《著作權法》。修法的原因在於許多長輩愛與好友齊聚里民中心觀唱，卻因為伴唱機夯涉侵權，收到存證信函，使得人心惶惶，因此民進黨立院黨團決議提案修法。經濟部官員表示，《著作權法》是保護權利人的利益，音樂人的主張很好理解，但里民歡唱行為不涉及營利，且有公益性，兩邊權益要如何保障，是現在要思考權衡的地方，因此為了兼顧雙方權益，行政院正在跟民進黨團積極溝通中，建議傾向先暫緩修法，並強化溝通、廣納音樂界的意見；政院官員表示，希望兼顧歌曲版權不會特定業者持續買斷、音樂著作權人獲得合理報酬，並讓基層民眾在合理付費的情況下，也能唱到想唱的歌曲。
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s3_37
  section: 3
  number: 37
  type: multiple
  page: 5
  stem: 有關內閣制與總統制的差異，下列敘述哪些正確？
  options:
  - label: A
    content: 內閣制因權力融合的關係，通常要求閣員、政務官須由國會議員兼任，總統制因為權力公立的關係，總統、政務官均不能兼任國會議員
  - label: B
    content: 內閣制的國會可以用質詢、立法、預算、調查等權來監督內閣、總統制下的總統不能任命各部會的官員，各部會的官員直接對國會負責
  - label: C
    content: 總統制由總統直接組閣，內閣制是由國會多數黨組閣
  - label: D
    content: 內閣制是虛位元首，總統制是實權元首
  - label: E
    content: 內閣制的元首及總理皆有固定任期，總統制則可以解散國會或對閣員提不信任案
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s3_38
  section: 3
  number: 38
  type: multiple
  page: 5
  stem: 課堂上老師說明，課責（accountability）經常與責任（responsibility）混用，是民主治理最重要的基礎。請同學上網google查詢這個有點陌生名詞的意義，下列哪些同學的說明是正確？
  options:
  - label: A
    content: 大明：課責是指行政機關所掌握的權力，和所要負擔的責任需要名實相符的
  - label: B
    content: 小悅：課責專指立法機關必需有效監督行政機關，確實政府達成施政目標，所建立的一種機制
  - label: C
    content: 大今：現代課責概念重視政府的主動負責與制度化的監督規範
  - label: D
    content: 小織：課責是確保施政品質與內容符合人民需求，政府與人民像是訂立契約，並雙方都產生拘束力
  - label: E
    content: 中川：民主治理的課責當代意涵，主要是透過議會和媒體進行監督
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s4_39
  section: 4
  number: 39
  type: single
  page: 5
  stem: 關於臺北市政府共享運具的推動，下列敘述何者正確？
  options:
  - label: A
    content: 自治條例草案為臺北市議會議決通過，並監督臺北市政府執行
  - label: B
    content: 此共享運具推動事項，專行政院交付給臺北市政府的委辦事項
  - label: C
    content: 此事務性質為自治事項，故行政院無權監督臺北市政府的執行
  - label: D
    content: 此事務屬於全國一致性，應劃歸中央，臺北市無權制定此條例
  group_stem: 【混合題一】睽違一年多，臺北市《共享運具經營業管理自治條例》草案通過，預計將於年底上路。臺北市政府交通局指出，目前臺北市的民間共享運具業共有兩家，自行車有oBike、電動機車有WeMo Scooter。從去年五月進軍臺灣以來，陸續出垷許多亂象，處理過2,187件oBike移置通報案，也拖吊達1,210輛違停oBike。未來將推動專用服務區、收取使用權利金及限制投放車輛數，制定出違規營運、違反許可事項的罰則。
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s4_40
  section: 4
