  stem: 西班牙國會大選投票的結果一如預測，沒有任何政黨獲得足以獨力組閣的席次；得票最多的執政黨人民黨（PP）必須找他黨組成聯合政府，西班牙總理也已設下第一輪政黨協商期限。若無法組成聯合政府，西班牙國王必須下令重新選舉。請問：根據上述西班牙的政府體制之運作屬於下列何者？
  options:
  - label: A
    content: 內閣制
  - label: B
    content: 總統制
  - label: C
    content: 混合制
  - label: D
    content: 委員制
  group_stem: 【題組三】國會過半數議席，人民黨雖擁有優先組閣的資格，但相關的政黨協商不是太樂觀，人民黨原本能的合作對象是公民黨，但兩黨的國會議席合計只有163席，距離過半數還差13席。 西班牙總理拉荷義已設定2016年1月13日為第一輪政黨協裕期限，並為相關協商劃下紅線。他表示，希望維持西班牙的團結統一。這顯示，「我們可以黨」已遭到排除，因為這個新興政黨支持加泰隆尼亞自治區（Catalonia）舉行。獨立公投。 至於最大的兩個左派政黨一社會勞工黨與「我們可以黨」則已經釋出訊息，表明不支持由人民黨主導的政府。英國牛津經濟研究院分析員塔拉維拉認為，這次大選後，西班牙在籌組新政府上有多種可能的選項，但不論是哪一種都需要三個、甚至四個政黨的攜手合作。 西班牙若無法在大選後2個月內就籌組聯合政府一事達成共識，西班牙國王必須下令重新舉行選舉。果真如此，這將延長西班牙政治的不確定性，而受害最大的將是西班牙的經濟。
