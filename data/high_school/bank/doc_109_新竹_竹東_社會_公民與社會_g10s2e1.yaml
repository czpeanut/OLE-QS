  group_stem: '【題組一】被認為是決定英國國家未來前途的關鍵決戰——英國國會選舉——已於臺灣時間12月13日清晨完成投票，最終結果顯示首相強生不僅輕鬆過半，更帶領英國保守黨，贏下「自柴契爾之後的最大勝利」，拿下365席席次；至於選前主攻年輕人票的工黨，則遭遇了1935年以來最慘的崩盤，僅拿下202席。 由於保守黨的大勝過於明顯，大權在握的強生被評為「無論其風格多麼爭議，他還是讓英國進入了自2016年脫歐公投以來最穩定的狀態。」確認慘敗之後，工黨黨魁柯賓也出面承擔敗選，並宣布不會再於下一次選舉領導工黨。至於力主留歐、主張蘇格蘭獨立的蘇格蘭民族黨，本次則拿下48席，推測可能是其吸收了來自工黨與保守黨的傳統選票。 根據英國的選舉制度，正常情況下，下次選舉原本要到2022年才會舉行，但強生希望提前舉行選舉，以恢復保守黨在國會的多數席位。後來在爭取到自由民主黨與蘇格蘭民族黨支持提前大選後，改採「修政《定期國會法》

    」的方式，將門檻降至只需過半數，才有這次大選的機會。'
