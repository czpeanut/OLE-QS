- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 目前民主國家的政府體制分為內閣制、總統制及混合制，下列對於各體制的行政與立法部門之敘述，何者正確？
  options:
  - label: A
    content: 內閣制內閣任期有彈性，政治衝突可經倒閣或解散國會後重新訴諸民意
  - label: B
    content: 美國政府官員得在國會列席接受議員對仧政策的質詢
  - label: C
    content: 國會多數與法國總統為不同政黨時，易形成總統有權無責
  - label: D
    content: 我國總統詢問過行政與立法兩院院長後即可主動解散立法院
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 阿花想認識英國內閣制，卻不知從何了解起，因此公民老師建議從「權責相符」與「行政更有效率」來分析英國內閣制的優點，下列4位同學的敘述何者正確？
  options:
  - label: A
    content: 小南：英國國王因為虛位元首無政治實權，故有俗語「國王永遠不會犯錯」
  - label: B
    content: 阿翰：英國內閣制的立法權與行政權呈現分立的狀態，可以相互制衡
  - label: C
    content: 大龍：權責相符是指，當行政團隊政策執行不當，可提請國家元首下臺
  - label: D
    content: 阿民：英國內閣制的效率端視政黨體系的情況，多黨制較兩黨制有效率
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 共和黨出身的美國前總統小布希執政後期，在野的民主黨奪下了國會過半數的席次，因而導致嚴重的行政立法僵局，連續幾個月美國竞沒有任何一條國會通過的法令能正式生效。因為民主黨推動的法案多次受到小布希和共和黨議員的杯葛，使得共和黨議員被民主黨議員諷為聽命於小布希總統的「橡皮圖章」。從美國憲政體制來看，請問：造成法案難以通過的原因為何？
  options:
  - label: A
    content: 總統以解散國會權做為制民主黨的手段
  - label: B
    content: 共和黨議員聯合其他小黨議員以控制國會
  - label: C
    content: 總統行使覆議權來否決國會已通過的法案
  - label: D
    content: 美國國會根本無法制衡由民意產生的總統
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 「民主治理」是由「民主」與「治理」所結合的新觀念，主張透過「公私協力」的方式，讓公共事務的理有效率，更能回應人民需求。關於民主治理的敘述，下列何者正確？
  options:
  - label: A
    content: 為因應工業革命的快速變遷而興起
  - label: B
    content: 提倡以民主統治取代現有民主治理
  - label: C
    content: 決策過程應由上而下回應人民需求
  - label: D
    content: 主張政府及民間共同解決社會問題
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 小寶在公民課被分派到的期末作業報告主題「民主治理，為此他搜尋了許多相關資料，請問下列何者最適合作為報告素材？
  options:
  - label: A
    content: 市長指示市警局尊重民眾合法陳情請願的權益，但對脫序行為也要依法行政
  - label: B
    content: 縣政府花大筆經費推動城鄉風華再造，把所有的鄉鎮市街景打造成復古風格
  - label: C
    content: 水利署為營造共好的河川環境，邀集在地的社區部落與研究單位來參與管理
  - label: D
    content: 行政院院長宣布政府將加碼提高育兒津貼，希望提升國人低迷不振的生育率
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 依照《地方制度法》，地方自治團體的職權，可分為自治事項、委辦事項及中央與地方共同辦理事項。請問：下列敘述何者正確？(甲)臺南市興建市立國小是屬於委辦項目；(乙)臺中市舉行立法委員選舉之事務是屬於中央與地方共同辦理事項；(丙)全民健保是中央與地方共同辦理事項；(丁)臺北市公所發放國民身分證是屬於委辦項目；(戊)高雄市辦理「中小學一班25人」小班制公投是屬旅自辦項目。
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丙丁戊
  - label: D
    content: 乙丙戊
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_21
