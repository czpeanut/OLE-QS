questions:
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 依《憲法增修條文》之規定，總統解散立法院為「被動解散」。請問：此解散國會之先決條件為下列何者？
  options:
  - label: A
    content: 立法院議事效率低，延宕提出修憲案
  - label: B
    content: 立法院對行政長提出不信案
  - label: C
    content: 立法院提出統彈劾案
  - label: D
    content: 立法院不同意總統所提名之行政院院長人選
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列哪一項特徵屬於總統制所有？
  options:
  - label: A
    content: 總統是國家元首，也是行政首長
  - label: B
    content: 總統雖然由人民直接選舉產生，但國會有權罷免總統
  - label: C
    content: 行政權屬總統，立法權屬國會，行政權向立法權負責
  - label: D
    content: 國會開會時，總統必須列席為其政策提出辯護
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 內閣制是近代立憲國家採行的一種政府體制，請問：以下何者屬於內閣制的特徵？
  options:
  - label: A
    content: 元首代表國家，並且負責實際政務的推動與承擔成敗的責任
  - label: B
    content: 元首公布法律或命令時，不需閣揆或閣員的副署
  - label: C
    content: 閣揆由國會中多數當的領袖出任，行政權與立法權實為一體
  - label: D
    content: 行政權與立法權分別向人民負責
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 在均權制度中，主張權之分配，若有全國一致性者，劃歸中央；有因地制宜之性質者，劃歸地方。下列五個統治權，哪些是中央才能行使，並未劃歸地方可以利用的？(甲)行政權；(乙)立法權：(丙)司法權；(丁)考試權；(戊)監察權
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丙丁戊
  - label: D
    content: 甲丙戊
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 政府與政府之間的關係，包括中央政府與地方政府，和地方政府與地方政府之間的關係。府際關係又可以分為「垂直互動」與「水平互動」兩類，前者是指一個國家內部各級政府之垂直互動關係，尤其著重在中央與地方政府之間的互動；後者則是指同級地方政府之間的互動關係。請問：下列哪一組選項的關係是「垂直互動」？
  options:
  - label: A
    content: 高雄市政府與臺北市政府
  - label: B
    content: 客家委員會與交通部
  - label: C
    content: 行政院與臺中市政府
  - label: D
    content: 信義鄉公所與南投市市民代表會
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 美國最高法院於2013年6月26日裁定加州禁止同性婚姻的「8號提案」失效，恢復加州同志伴侶結婚的權利。目前美國已有13個州讓同志婚姻合法化，但仍有約莫30個州在其《州憲法》中嚴禁同志結婚。由此分析，美國中央與地方權限劃分方為何？
  options:
  - label: A
    content: 中央集權
  - label: B
    content: 地方分權
  - label: C
    content: 均權制度
  - label: D
    content: 三權分立
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 我國「均權」，係指依事務性質區分中央與方權限，請問：「下列那些事項屬於「地方自治」的權限範圍？(甲)彰化縣政府依法令派令方檢察署檢察官；(乙)高雄市政府依法令徵收牌照稅；(丙)新北市議會議員連署，建議將中央政府搬遷至新店區；(丁)花蓮縣政府依「選罷法」辦理縣議員補選；(戊)東港鎮公所為促進 觀光產業舉辦「鮪魚文化祭」。
  options:
  - label: A
    content: 乙丁戊
  - label: B
    content: 甲乙丁
  - label: C
    content: 乙丙戊
  - label: D
    content: 乙丙丁
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 課堂上，老師說明當代民主治理和傳統民主政治之不同，前者強調“治理”（governance）與後者強調“統治＂（government）從詞面上看似乎差別並不大，事實上有很大的不同，同學紛紛討論民主治理與傳統民主政治的不同，下列何者正確呢？(甲)小柯：傳統民主政治強調為政府是領航員，而非操槳者(乙)阿北：傳統民主政治下統治的主體一定是社會的公共機構，而民主治理的主體既可以是公共機構，也可以是私人機構，還可以是公共機構和私人機構的合作。(丙)新一：治理強調由下而上，其理論的興起，是彌補市場的失效和國家機關的不足。
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 丙丁
  - label: D
    content: 乙丁
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 小英在上公民課時，對於聯邦與邦聯的概念難以理解，於是課堂上舉手發問並與同學討論，下列4位同學的說明，何者正確？
  options:
  - label: A
    content: 大中：聯邦是指由若干國家基於共同利益依據條約所組成的聯盟，例如：美國
  - label: B
    content: 華華：聯邦裡的國家，各自可以制定自己的《憲法》，並具有其獨立性
  - label: C
    content: 曉民：邦聯則是由若干政治社群共同參與至組成的主權國家，例如：大英國協
  - label: D
    content: 阿國：聯邦與邦聯最大的差異，在於前者的聯邦權力具有最高性；後者則各國的主權獨立性較強，邦聯權力不能拘束各國及人民
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 2016年，川普與希拉蕊的世紀之爭，對美國人來說仍記憶猶新，當時由選舉人團的538位選舉人根據各州開票結果來投票，若獲得某一州普選最高票的候選人，該州所有選舉人的票全數歸於該候選人，最後川普以290票當選美國總統，山普上任後的第一步就是開除前任國務卿。根據上文，下列何者正確？
  options:
  - label: A
    content: 此選舉為直接選舉，採相對多數決制
  - label: B
    content: 此選舉根據「贏者全拿」方式進行計票
  - label: C
    content: 美國總統任免國務卿，無需經國會同意
  - label: D
    content: 美國總統公布法案前，須經部會首長副署
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 承上題，美國各州與中央政府之間最可能處在下列何項關係？
  options:
  - label: A
    content: 聯邦政府擁有《憲法》規定之概括權力，各州享有列舉權力
  - label: B
    content: 各州得擁有屬於自己的《憲法》，故容易出現區域發展落差
  - label: C
    content: 各州無行政與立法自主權，美國權力偏向單一制
  - label: D
    content: 美國若發生各州與中央政府權限爭議將由立法權出面解決
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 民主治理即地方政府、中央政府、民間和第三部門彼此協商、分工來管理或處理公共事務的一套新模式。下列針對「民主治理」的敘述何者正確？
  options:
  - label: A
    content: 強調中央政府的指度
  - label: B
    content: 由上而下的決策過程
  - label: C
    content: 重視目標的達成，不強調討論與溝通的過程
  - label: D
    content: 強調民眾可自主思考並營造出有自己特色的社區
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 2014年4月時，日本政府將消費稅自5％調升至8％，致消費者與企業支出轉趨保守，日本經濟再陷衰退，使得「安倍經濟學」遭受各方質疑。安倍晉三遂於11月要求解散國會、重新改選，並宣布延後一年半增加消費稅到10％。12月國會改選結果，安倍領導的執政聯盟贏得三分之二席次，獲得壓倒性勝利。預料安倍將繼續推動「安倍經濟學」的各項政策。請問：安倍於任期結束前先行解散國會，進行國會改選的最主要目的為何？
  options:
  - label: A
    content: 掃除在野勢力對政治的影響力
  - label: B
    content: 獲得選民對政策的支持付託
  - label: C
    content: 擔負政策失利的相關責任
  - label: D
    content: 改善國會一黨獨大的弊端
- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 哆啦A萝上課筆記只抄寫了一半，表格中仍有許多空白之處，同學們熱烈的提供意見，請問：哪位同學的說法是正確的？
  options:
  - label: A
    content: 靜香：甲、乙分別為內閣制、總統制
  - label: B
    content: 大雄：不信任案由左到右依序要填寫「有」、「有」
  - label: C
    content: 小杉：內閣兼國會議員部分由左到右依序要填寫「不可」、「可」
  - label: D
    content: 胖虎：覆議權部分由左到右依序要填寫「無、「有」
