- id: doc_109_新竹_竹東_社會_公民與社會_g10s2e1_s2_33
  section: 2
  number: 33
  type: single
  page: 5
  stem: 根據本文，地方政府所聲請的教職員退休事務，其屬性與何者最為相近？
  options:
  - label: A
    content: 高雄捷運延伸到臺南與屏東的發展計畫
  - label: B
    content: 各級學校協助教育部辦理國中教育會考
  - label: C
    content: 台中市政府興建台中捷運
  - label: D
    content: 我國推行的全民健康保險政策相關事務
  group_stem: 【題組五】我國執政黨政府推動公教年金改革後，新北市及其他五縣均以《公立學校教職員退休資遣撫卹條例》的相關條文有違憲疑義為由，向大法官聲請解釋，不過大法官在2018年8月10日全部作出不受理決議。 聲請釋憲的地方政府一致認為，《公立學校教職員退休資遣無卹條例》已經明定教職員退休事務，在地方的主管機關是地方政府；而且《地方制度法》有規定「學前教育、各級學校教育及社會教育之興辦及管理」屬於地方政府的自治事項，代表這應該就是地方自治事項，各個地方政府可以跳過教育部，自己向司法院聲請大法官解釋。 大法官則指出《憲法》第108條第4款明定「教育事項」是「由中央立法並執行或交由地方執行之事項」，並非專屬於地方自治的事項。就算《公立學校教職員退休資遣撫卹條例》規定地方政府是主管機關，但該條例是由中央制定的法律，所以地方政府如果在處理教育事項相關的問題而碰到違憲爭議，還是必須透過中央政府機關聲請大法官解釋。
