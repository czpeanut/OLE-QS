  options:
  - label: A
    content: $\lim_{x\rightarrow 0} f(x)$＝f(0)
  - label: B
    content: $\lim_{x\rightarrow 1^{-}} f(x)$＝2
  - label: C
    content: $\lim_{x\rightarrow 2} f(x)$＝f(2)
  - label: D
    content: f(2)＝1
  - label: E
    content: $\lim_{x\rightarrow 2} f(x)$不存在
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_113_台北_明倫_數學_數乙_g12s1e1/s1_4_f1.png
    crop:
      page: 2
      rect:
      - 457.95
      - 72.15
