- id: doc_113_台北_明倫_數學_數乙_g12s1e1_s1_6
  section: 1
  number: 6
  type: multiple
  page: 2
  stem: 試問以下哪些函數是偶函數？
  options:
  - label: A
    content: 2（x＋4）
  - label: B
    content: cos（x－1）
  - label: C
    content: cosx－1
  - label: D
    content: sin$\left( \frac{3\pi}{2}-x \right)$
  - label: E
    content: （sinx－1）$^{2}$
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ╳：令 f（x）＝2（x＋4）＝2x＋8

    f（－x）＝2（－x＋4）＝－2x＋8≠f（x）

    ∴f（x）＝2（x＋4）非偶函數

    (B) ╳：令 f（x）＝cos（x－1）

    f（－x）＝cos（－x－1）＝cos〔－（x＋1）〕＝cos（x＋1）≠f（x）

    ∴f（x）＝cos（x－1）非偶函數

    (C) ○：令 f（x）＝cosx－1

    f（－x）＝cos（－x）－1＝cosx－1＝f（x）

    ∴f（x）為偶函數

    (D) ○：令 f（x）＝sin$\left( \frac{3}{2}\pi -x \right)$＝－cosx

    f（－x）＝sin$\left( \frac{3}{2}\pi +x \right)$＝－cosx＝f（x）

    ∴f（x）為偶函數

    (E) ╳：令 f（x）＝（sinx－1）$^{2}$

    f（－x）＝（sin（－x）－1）$^{2}$＝（－sinx－1）$^{2}$＝（sinx＋1）$^{2}$≠f（x）

    ∴f（x）非偶函數

    故選(C)(D)'
- id: doc_113_台北_明倫_數學_數乙_g12s1e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 2
  stem: '下列數列共有幾個極限值存在？

    $\left\langle \frac{9n^{2}+7n-8}{4n^{3}-8} \right\rangle$、$\left\langle \frac{n^{4}+5n-1}{n^{3}-n} \right\rangle$、$\left\langle \frac{(n+3)^{4}-(n-1)^{4}}{n^{3}} \right\rangle$、〈（$\sqrt{3+\sqrt{8}}$－$\sqrt{2}$）$^{n}$〉、$\left\langle \frac{2n^{2}+1}{n}-\frac{3n+1}{n} \right\rangle$、$\left\langle \frac{1 \cdot 2}{n^{2}}+\frac{2 \cdot 3}{n^{2}}+\cdots \cdots +\frac{n \cdot (n+1)}{n^{2}} \right\rangle$

    答：＿＿＿＿個。'
  answer:
  - '3'
  answer_status: verified
  answer_source: answer_key
  explanation: '① $\lim_{n\rightarrow \infty} \frac{9n^{2}+7n-8}{4n^{3}-8}$＝$\lim_{n\rightarrow \infty} \frac{\frac{9}{n}+\frac{7}{n^{2}}-\frac{8}{n^{3}}}{4-\frac{8}{n^{3}}}$＝0

    ② $\lim_{n\rightarrow \infty} \frac{n^{4}+5n-1}{n^{3}-n}$＝$\lim_{n\rightarrow \infty} \frac{1+\frac{5}{n^{3}}-\frac{1}{n^{4}}}{\frac{1}{n}-\frac{1}{n^{3}}}$

    ∵$\lim_{n\rightarrow \infty} \left( 1+\frac{5}{n^{3}}-\frac{1}{n^{4}} \right)$＝1，$\lim_{n\rightarrow \infty} \left( \frac{1}{n}-\frac{1}{n^{3}} \right)$＝0

    ∴此數列極限值不存在

    ③ $\lim_{n\rightarrow \infty} \frac{(n+3)^{4}-(n-1)^{4}}{n^{3}}$＝$\lim_{n\rightarrow \infty} \frac{16n^{3}+48n^{2}+112n+80}{n^{3}}$

    ＝$\lim_{n\rightarrow \infty} \frac{16+\frac{48}{n}+\frac{112}{n^{2}}+\frac{80}{n^{3}}}{1}$＝16

    ④ $\sqrt{3+\sqrt{8}}-\sqrt{2}$＝$\sqrt{3+2\sqrt{2}}$－$\sqrt{2}$＝$\sqrt{2}$＋1－$\sqrt{2}$＝1

    $\lim_{n\rightarrow \infty} (\sqrt{3+\sqrt{8}}-\sqrt{2})^{n}$＝$\lim_{n\rightarrow \infty} 1^{n}$＝1

    ⑤ $\lim_{n\rightarrow \infty} \left( \frac{2n^{2}+1}{n}-\frac{3n+1}{n} \right)$＝$\lim_{n\rightarrow \infty} \frac{2n^{2}-3n}{n}$＝$\lim_{n\rightarrow \infty} \frac{2-\frac{3}{n}}{\frac{1}{n}}$

    ∵$\lim_{n\rightarrow \infty} \left( 2-\frac{3}{n} \right)$＝2，$\lim_{n\rightarrow \infty} \frac{1}{n}$＝0

    ∴此數列極限值不存在

    ⑥ $\frac{1 \cdot 2}{n^{2}}$＋$\frac{2 \cdot 3}{n^{2}}$＋……＋$\frac{n(n+1)}{n^{2}}$

    ＝$\frac{1 \cdot 2+2 \cdot 3+\cdots \cdots +n(n+1)}{n^{2}}$＝$\frac{1}{n^{2}}$．$\sum_{k=1}^{n} k(k+1)$

    ＝$\frac{1}{n^{2}}\left( \sum_{k=1}^{n} k^{2}+\sum_{k=1}^{n} k \right)$＝$\frac{1}{n^{2}}$．$\left[ \frac{n(n+1)(2n+1)}{6}+\frac{n(n+1)}{2} \right]$

    ＝$\frac{1}{n^{2}}$．$\left[ \frac{2n^{3}+6n^{2}+4n}{6} \right]$＝$\frac{2n^{3}+6n^{2}+4n}{6n^{2}}$

    ∴$\lim_{n\rightarrow \infty} \left( \frac{1 \cdot 2}{n^{2}}+\frac{2 \cdot 3}{n^{2}}+\cdots \cdots +\frac{n(n+1)}{n^{2}} \right)$

    ＝$\lim_{n\rightarrow \infty} \left( \frac{2n^{3}+6n^{2}+4n}{6n^{2}} \right)$＝$\lim_{n\rightarrow \infty} \left( \frac{2+\frac{6}{n}+\frac{4}{n^{2}}}{\frac{6}{n}} \right)$

    ∵$\lim_{n\rightarrow \infty} \left( 2+\frac{6}{n}+\frac{4}{n^{2}} \right)$＝2，$\lim_{n\rightarrow \infty} \frac{6}{n}$＝0

    ∴此數列極限值不存在

    故共有 3 個數列的極限值存在'
