- id: doc_113_台北_明倫_數學_數乙_g12s1e1_s2_7
  section: 2
  number: 7
  type: fill
  page: 3
  stem: '函數 f（x）＝$\sqrt{12-4x-x^{2}}$，則

    (1) f（x）的定義域為＿＿＿＿。（請用集合表示）

    (2) 值域為＿＿＿＿。（請用集合表示）'
  answer:
  - (1)｛x｜x ∈ R，－6 ≤ x ≤ 2｝；(2)｛y｜y ∈ R，0 ≤ y ≤ 4｝
  answer_status: verified
  answer_source: answer_key
  explanation: '(1)∵12－4x－$x^{2}$ ≥ 0

    ⇒ $x^{2}$＋4x－12 ≤ 0

    ⇒（x＋6）（x－2）≤ 0

