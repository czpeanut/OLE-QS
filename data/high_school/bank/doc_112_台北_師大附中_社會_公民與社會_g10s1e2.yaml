  stem: 某學者研究指出：「1777 年廣東梅縣客家人羅芳伯在東南亞西婆羅洲，為抵抗盜匪與西方殖民者的入侵，遂帶領華人與當地原住民，採民族平等、融合共處的方式，成立『蘭芳大總制共和國』，進而建軍、頒布法令及徵收稅賦。其元首稱『大唐總長』，以選賢禪讓的形式傳承，而國之大事皆眾議而行。由於主其事者多為粵籍華人，基於民族情感的脈絡，仍向清朝納貢稱臣，……直到 19 世紀末，才被荷蘭人所滅……。」根據上述內容，下列對此一「國家」的敘述，何者較為正確？
