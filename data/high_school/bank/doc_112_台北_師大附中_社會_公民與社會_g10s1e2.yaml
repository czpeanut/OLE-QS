  stem: 1776 年美國的〈獨立宣言〉是西方民主理論演進歷史上的重要文獻。在其〈前言〉中有以下一段文字：「……我們認為下面這些真理是不言而喻的：造物者創造了平等的個人，並賦予他們若干不可剝奪的權利，其中包括生命權、自由權和追求幸福的權利。為了保障這些權利，人們才在他們之間建立政府，而政府之正當權力，則來自被統治者的同意。任何形式的政府，只要破壞上述目的，人民就有權利改變或廢除它，並建立新政府；新政府賴以奠基的原則，得以組織權力的方式，都要最大可能地增進民眾的安全和幸福……」有關上文中涉及的民主政治思想，以下何者正確？
  options:
  - label: A
    content: 這是西方天賦人權觀念的起始
  - label: B
    content: 民主政體須經由革命才能產生
  - label: C
    content: 如果政府任意沒收人民財產，人民可以抗爭或要求改革
  - label: D
    content: 政府權力若來自被統治者的同意，就可以保障人民幸福
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 當中提及「無論任何形式的政府破壞這些目標，人民都有權改變它或廢除它，並在該些原則上建立新的政府，並以該形式組織新政府的權力。」故選(C)。(A)美國〈獨立宣言〉在肯定社會契約論，而非天賦人權。(B)當中並無提及民主需透過革命來爭取。(D)政府的統治權力來自被統治者的同意，但人民的幸福與權利需要靠政府正當使用權力。
