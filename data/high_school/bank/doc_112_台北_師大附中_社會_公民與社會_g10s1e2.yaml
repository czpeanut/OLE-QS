  stem: 1948 年聯合國大會表決通過《世界人權宣言》，可謂人權理念發展的一個里程碑。關於這項宣言，下列敘述何者正確？
  options:
  - label: A
    content: 該宣言乃是由聯合國大會所通過，因此是一個強制性的國際公約
  - label: B
    content: 該宣言明文禁止死刑，規定人人有權享有生命、自由與人身安全
  - label: C
    content: 該宣言僅包括公民的政治權利，尚未納入經濟、社會和文化權利
  - label: D
    content: 該宣言期望國家與國際採行漸進措施，使其獲得普遍承認與遵行
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《世界人權宣言》並無強制性，僅具宣示、宣導性質。(B)《世界人權宣言》中明文對於生命、自由與人身安全的保障，但並無明文禁止死刑。(C)因《世界人權宣言》中並無完整保障政治權利、以及經濟、社會等議題，故《世界人權宣言》與《經濟、社會及文化權利國際公約》、《公民權利和政治權利國際公約》（兩公約）一起包含在國際人權法案中。
