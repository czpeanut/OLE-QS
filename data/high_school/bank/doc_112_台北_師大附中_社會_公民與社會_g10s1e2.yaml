  stem: '某國政黨輪替後，與前執政黨相比，新任政府在社會安全相關預算支出上有顯著轉變。下表為相關支出數據之各年平均值。依據表中的資訊，下列對於該國社會安全制度轉變之敘述、何者最為正確？

