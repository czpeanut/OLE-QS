  stem: 1948 年聯合國公布《世界人權宣言》，主張人生而自由，在尊嚴和權利上一律平等，但後來又強調如原住民族等特定群體應享有特殊權利。下列敘述何者最能說明上述人權主張的改變？
  options:
  - label: A
    content: 國際政治常處於無政府狀態，因此出現前後矛盾之人權主張
  - label: B
    content: 人權實現須關切不同生活處境群體之所需，以擴大人權內涵
  - label: C
    content: 人權內涵雖具普世性，特定群體的權利主張不適用於多數國家
  - label: D
    content: 《人權宣言》偏重於捍衛生命權，特殊群體的權利則較重視政治權
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 人權的保障不能只有單一標準，平等權的保障除了人人相同的形式平等作為外，尚需根據不同群體給予合理的差別待遇來補足實質平等作為。因此，雖然人人具有普世人權內涵之保障，特定群體的權利內涵尚須視其需要來制定，以擴大對人權的周全保障。
