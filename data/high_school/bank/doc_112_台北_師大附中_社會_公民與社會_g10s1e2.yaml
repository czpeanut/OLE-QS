- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 3
  stem: 我國的《司法院釋字第七四八號解釋施行法》保障同性婚姻，使同性戀者與異性戀者皆擁有結婚的權利。該法實施至今，許多民眾透過各種管道發聲表達認同及支持，但也持續有反對的聲音。另外，在現行制度下，我國國民的同性伴侶若為外國人，且其所屬國家的法律不承認同性婚姻，則伴侶雙方在我國便無法結婚。因此有公民團體倡議，應進一步修法保障跨國同性伴侶，但這項倡議，也引發不同立場團體的質疑。請問依據題文，該法最能落實以下哪項與人權有關的理念？
  options:
  - label: A
    content: 保障社會處境不利群體的積極平權
  - label: B
    content: 凝聚社會處境不利群體的國家認同
  - label: C
    content: 肯認社會不同群體的多元身分認同
  - label: D
    content: 促進社會不同群體的意見表達自由
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 同性伴侶長期在社會中處於不利地位，例如受到歧視對待，且並非社會主流，因此法律的制定無法保障其權利。透過大法官釋憲與施行法的通過，人民的努力與政府的作為使同性伴侶爭取到平權對待，故選(A)。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 3
  stem: 我國於 2008 年開辦「國民年金」保險制度，進入全民保險的時代。關於此一制度，下列敘述何者正確？
  options:
  - label: A
    content: 國民年金具強制性，人人都必須參加
  - label: B
    content: 納保人年滿 65 歲且為低收入者即可請領老年年金
  - label: C
    content: 國民年金重視老年經濟安全保障，但也包含生育給付
  - label: D
    content: 國民可於國民年金保險與全民健康保險二者擇一納保
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)國民年金為未受職業保險的 25～65 歲的民眾，並非人人都須參加。(B)低收入者應向政府申請急難救助的補助。(D)全民健康保險目的在於全民強制納保，用於分攤醫療上的風險與負擔，並非二擇一的做法。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: '「女性占所有管理及經理職位比率」及「女性占國會議員席次比率」二者可做為觀察女性政經參與及其對決策影響程度的重要指標。下表為三個國家在這二項指標的數據。依據下表，將這三個國家的性別不平等程度由高到低加以排列，下列何者正確？

    | 國 別 | 甲 |  | 乙 |  | 丙 |  |

    | --- | --- | --- | --- | --- | --- | --- |

    | 年 度 | 1989 | 2009 | 1989 | 2009 | 1989 | 2009 |

