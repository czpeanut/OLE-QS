    file: doc_112_台北_師大附中_社會_公民與社會_g10s1e2/s1_9_f1.png
    crop:
      page: 2
      rect:
      - 349.9
      - 319.6
      - 565.0
      - 504.7
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)雖然有禁核武條約，但中國並未簽署，兩岸關係仍存有變數。(B)我國即使將禁核武條約國內法化，但無法約束中國的行為。(C)根據聯合國第 2758 號決議，中國為唯一代表權，中國不需擁核武，我國返回聯合國仍然希望渺茫。
