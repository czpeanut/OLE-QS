- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_38
  section: 1
  number: 38
  type: single
  page: 8
  stem: 原預計於 2020 年由日本主辦的第 32 屆東京奧運，因 COVID-19 疫情全球蔓延，將延至 2021 年 7 月 23 至 8 月 8 日舉辦。不料當年 6 月間疫情卻有逐漸反彈的跡象，時任日本首相菅義偉於 7 月 1 日表示，(甲)若疫情無法控制下來，東京奧運會不排除有空場的可能。（<u>乙）奧運最早的歷史可以追溯自古希臘，為當時各城邦之間的競技活動。</u>但後續由於信奉基督教的羅馬皇帝狄奧多西一世禁止奧運競技，停辦持續了近 1,500 年，直到 1896 年才又開始這項傳統。回顧近年奧運的舉辦困難重重，像是 2016 年里約奧運舉辦期間，(丙)因巴西政府試圖通過各種途徑掩蓋或清除貧民窟受到質疑，而(丁)國際奧會在歐陸難民營發掘具奧運等級身手的難民，並宣布將有一支由難民組成的「無國籍代表隊」出賽，其所獲得待遇會和其他隊伍一樣，期盼透過此舉向全世界的難民散播希望，也使國際關注無國籍者的困境。根據選文(甲)至(丁)內容，與下列敘述之配對，下列何者正確？
  options:
  - label: A
    content: 甲：該行為保障人民之權利，屬《公民與政治權利國際公約》內涵
  - label: B
    content: 乙：在該時空背景下，公民身分已經受到重視，逐漸成為普世權利
  - label: C
    content: 丙：人民生命權未受保障，屬《經濟社會文化權利國際公約》內涵
  - label: D
    content: 丁：若不違反法律，國際上無國籍者所享有的權利與一般國民無異
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 各城邦之間須派出國民參與競技活動，可推測建立了公民身分的概念。(A)疫情若無法控制，民眾集體觀賽將使疫情傳播，為保障人民的健康將以空場方式因應，此為《世界人權宣言》之內涵。(C)生命權應是《公民與政治權利國際公約》中的內涵。(D)無國籍者也享有普世人權的保障，但一般國民受政府保障之參政權應無法享有。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_39
  section: 1
  number: 39
  type: single
  page: 8
  stem: 保障基本人權、維護世界和平為聯合國重要的職能，下列關於聯合國的相關敘述何者正確？
  options:
  - label: A
    content: 是一個由所有主權國家所組成的國際組織，並有常備維和部隊，以維護世界和平
  - label: B
    content: 聯合國安全理事會是負責維護國際和平與安全的主要機構，且理事國擁有否決權
  - label: C
    content: 為減緩環境的惡化、推動全球永續發展，協調制定與推動相關環境與生態保育策略
  - label: D
    content: 基於國際法上的不干涉原則，對國內發生嚴重違反人權的國家，只能進行道德勸說
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 聯合國發布 17 項永續發展目標 SDGs，包含永續的消費與生產模式、氣候行動、保育海洋與海洋資源等，故選(C)。(A)指由大會或安全理事會至少需九票贊成（必須包括五個常任理事國）核准部署並決定其任務授權的部隊，並非常備。(B)安理會中僅有五大常任理事國具有非程序事項的否決權。(D)安全理事會在聯合國規章是唯一有權採取強制行動的機構，其權力包括進行維和行動、實施國際制裁和授權採取軍事行動等。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_40
  section: 1
  number: 40
  type: single
  page: 9
  stem: 史丹佛大學教授福山（Fukuyama）在《身分認同》一書中表示，公民擁有平等地位有助社會整合，但身為自由民主社會的公民，並不意味著在國內就會受到平等的尊重。外界常以膚色、性別、背景、外貌、種族，或性傾向來評斷他們，每個人或群體都經歷過不同的歧視。政客則刻意操弄此議題，藉由分化社會激起群體間的仇恨，獲取政治利益。下列何項敘述，最能呼應福山教授的觀點？
  options:
  - label: A
    content: 資源分配不均，是民主社會的公民出現身分認同差異的關鍵原因
  - label: B
    content: 保障公民的多元身分都能享有平等地位，有助於促進社會的整合
  - label: C
    content: 身分認同成為政客的權力工具，民主社會應避談此議題防範分化
  - label: D
    content: 個人的身分認同固定不變，主要根據當事人或群體的出身來決定
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 福山教授的觀點提到，即使是民主自由的社會，也會因為群體間的差異造成彼此歧視，若政客操弄上述議題，藉此得到分化後的特定群體支持，不利社會整合；反之推論，若能將多元公民身分得到政府肯認，在公民身分平等的前提下，有助於社會整合，故選(C)。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_41
  section: 1
  number: 41
  type: single
