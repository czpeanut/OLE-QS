  answer_status: verified
  answer_source: answer_key
  explanation: (A)根據《憲法》第 1 條中華民國基於三民主義，為民有民治民享之民主共和國。第 2 條則是明文規定國家主權屬於全體國民。(B)因國民政府遷臺後，《憲法》內容與現實狀況有所落差，因此進行修憲。(C)《憲法》中將治權不及的領土範圍以增修條文的方式將《憲法》中部分條文停止適用，並未刪除。
