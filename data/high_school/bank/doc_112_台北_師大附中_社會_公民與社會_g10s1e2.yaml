- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 臺籍藝人周子瑜為揮舞中華民國國旗道歉事件引起巨大風波，韓國公民團體認為「其所屬經紀公司 JYP 娛樂及老闆朴軫永因屈服於中國大陸網友的抵制與施壓，強制她錄製道歉的聲明，已嚴重侵犯了人權」；聲明將以「歧視」與「侵害人權」為由，向韓國國家人權委員會提出申訴。關於「國家人權委員會」的敘述何者正確？
  options:
  - label: A
    content: 我國已於 2009 年通過兩公約施行法的同時，建立國家人權委員會
  - label: B
    content: 國家人權委員會強調獨立性，包括組織、預算、人事及運作的獨立
  - label: C
    content: 聯合國依據《巴黎原則》，鼓勵各國政府設置國家人權機構並加以管理
  - label: D
    content: 國家人權委員會為準司法機關，因此與法院皆有審理、判決等權力
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 1991 年聯合國通過《巴黎原則》奠定國家人權機構成立的準則，並在 1993 年成立「國家促進及保障人權機構國際協調委員會（ICC），在 ICC 的積極推動下，有多個國家成立人權機構，最終臺灣在 2020 年成立國家人權委員會。(B)(D)國家人權委員會設置在監察院，並非獨立機關，且不具如法院的審判權。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 根據《中華民國憲法》及《中華民國憲法增修條文》有關我國領土及主權的界定，下列何項敘述正確？
  options:
  - label: A
    content: 《憲法增修條文》明確規定固有疆域範圍
  - label: B
    content: 目前我國主權所不及的範圍稱「中國地區」
  - label: C
    content: 當前中華民國主權是「一個中華民國、兩個地區」
  - label: D
    content: 《憲法增修條文》更動《憲法》中我國領土範圍為臺澎金馬
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)《憲法》條文中的「固有疆域」，並未詳盡列舉。(B)《憲法增修條文》第 11 條中將我國實際統治的領土區分為「自由地區」與「大陸地區」，所謂自由地區是我國實質管轄的範圍，包含：臺灣、澎湖、金門與馬祖等地。(C)此較為接近中國的主張，一個中國原則描述。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 急難救助與社會保險為社會安全體系重要支柱，分別提供給人民不同資源與協助，下述對於二者之比較何者正確？
  options:
  - label: A
    content: 社會保險適用於弱勢族群，其給付對象較急難救助更特定
  - label: B
    content: 急難救助適用於特殊境遇，協助內容限最低生活水準保障
  - label: C
    content: 兩者皆強調使用者付費，但收入較高者須繳納更高之費用
  - label: D
    content: 兩者皆由國家提供全額補助，以確保人民的基本生活安全
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)應改為，急難救助適用於弱勢族群，其給付對象較社會保險更特定。(C)(D)社會保險強調使用者付費，依其收入繳納的保費不同，但不會由國家全額補助。而急難救助主要針對低收入、發生急難等情況，民眾不需繳納費用。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 某國有「童婚」傳統，許多未滿 15 歲少女成為父母財產，被迫結婚而失去受教育機會。近年來國際人權團體批評此傳統剝奪女孩受教權，違反國際人權公約，因此屢向該國施壓，要求立法禁止，卻遭到該國政府反彈，呼籲外界應尊重其傳統文化。從人權保障觀點檢視前述國際人權團體的作為，下列何項看法最適當？
  options:
  - label: A
    content: 應該，人權公約尊重各國傳統，但童婚現象違反基本人權，超越文化尊重原則
  - label: B
    content: 不應該，人權團體雖然追求基本人權保障，但仍應尊重各國主權不可干涉內政
  - label: C
    content: 應該，舊式文化與進步的人權精神有違，不符世界的價值潮流，必須加以破除
  - label: D
    content: 不應該，人權團體雖秉持普世價值，仍須尊重各國國情，接受社會的文化差異
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 各國的文化傳統無分優劣，皆應受到尊重。但題文中的童婚現象已經違反人權，年紀輕輕的少女無話語權，只能如物品、財產一般受到父母支配結婚，此舉已經侵害女童的受教權、自由權等權益，違反人權保障的傳統應破除之，故選(A)。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 依照目前臺海兩岸的現況，對我國而言，出現領土及統治權之落差。按我國現行憲法，以下敘述何者正確？
  options:
  - label: A
    content: 我國目前統治權所及地區，憲法上稱為「中華臺北」
  - label: B
    content: 我國目前統治權所及地區，憲法上稱為「中華民國臺灣省」
  - label: C
    content: 我國領土除臺、澎、金、馬以外之地區，憲法上稱為「內地」
  - label: D
    content: 我國領土除臺、澎、金、馬以外之地區，憲法上稱為「大陸地區」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)中華臺北、中華民國臺灣省等名稱，皆為中國對臺灣的稱法。(C)內地為我國民眾的口語用法，並未出現在《憲法》條文中。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 1995 年，我國推動全民健康保險制度以落實《憲法增修條文》中的相關規定，下列關於我國全民健保實施情形的敘述，何者最為正確？
  options:
  - label: A
    content: 全民健保屬於社會福利政策，民眾繳費愈多，領回也愈多
  - label: B
    content: 健康權屬於基本人權，全民健保不應該限制投保者的資格
  - label: C
    content: 全民健保保費的繳納採取量能負擔原則，可有助於財富重分配
  - label: D
    content: 為達到風險分擔的目的，使用醫療資源愈多者其保費負擔愈高
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 全民健保採強制納保，不因經濟弱勢、身體孱弱而被排除在外，無力繳納保費者，由政府協助之。(A)全民健保為社會保險，主旨在分散醫療上風險，保費不具有報酬性，無法領回。(C)量能負擔與財產重分配，主要在於所得稅的徵收效果。(D)風險分散的目的在於由全民共同分攤醫療費用的負擔，達到互助精神，目前保費採取收入高低來收取。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 人權是普世價值，許多國家都在相關法律中明文保障。以下關於人權的敘述何者正確？
  options:
  - label: A
    content: 人權的實踐要考慮文化差異，有些國家的女性沒有投票權，這是文化差異，和人權無關
  - label: B
    content: 學校規定不可以體罰，但家庭教育有體罰，且通常是為小孩好，故沒有侵犯人權的疑慮
  - label: C
    content: 人權和公民權的範圍不同，來臺的外籍觀光客沒有公民權，但我國法律仍然保障其人權
  - label: D
    content: 罪犯因為違反法律，而且往往對他人的人權造成侵害，因此國家不需要保障罪犯的人權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)人權的保障範圍廣泛，不應因為性別、種族等因素給予無原因的歧視待遇，參政權的部分，男、女性不應因性別差異而有落差，這並非文化所致。(B)對人身的保護不受年齡限制，若父母以教養名義進行體罰，在難以有衡量標準的情況下，可能會有過當情事，造成小孩身心靈創傷。(D)雖然罪犯違反法律，但加害人依然受人權保障，有平等受司法審判的機會。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 媒體報導：一位長住法國戴高樂機場（Aéroport Paris-Charles-de-Gaulle）17 年的難民邁爾漢（AIfred Mehran）自述，1977 年他因為參與示威被逐出伊朗喪失伊朗籍，雖獲得比利時核發的難民簽證，卻在一次旅程中弄丟了所有身分證件，出不了機場、也無法被遣送至任何國家，靠著旅客資助在機場生存著。從國籍與人權的觀點來看此篇報導，請問以下敘述何者正確？
  options:
  - label: A
    content: 是否核發國籍身分給邁爾漢，是法國主權的展現
  - label: B
    content: 長住法國所屬機場，依據屬地主義其子女為法國籍
  - label: C
    content: 因邁爾漢屬於非法居留者，既非國民當然不受基本人權的保障
  - label: D
    content: 邁爾漢的權利與其他法國公民的差異，僅存在公民權利的有無
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (C)不論是否具備公民身分，對人權的保障不分國界。(D)邁爾漢的權利除了公民權的差異外，包含工作權、受教權等，與法國人民也會有差別。
- id: doc_112_台北_師大附中_社會_公民與社會_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 某高中提供公民與社會科線上學習教材，引導學生分組延伸探究。右圖是某項主題的學習頁面，某學習小組針對【學與思 1 】提出臺海關係的推論，依右圖資料最足以支持哪項推論？
  options:
  - label: A
    content: 禁核武條約的正式生效，有助於提升臺海關係穩定
  - label: B
    content: 我國將禁核武條約國內法化，臺海關係即受其約束
  - label: C
    content: 為堅持「一個中國」政策，中國擁核武以阻止我國重返聯合國
  - label: D
    content: 中國擁核武自重，增添臺海關係發展變數且影響國際對臺政策
  assets:
  - key: s1_9_f1
