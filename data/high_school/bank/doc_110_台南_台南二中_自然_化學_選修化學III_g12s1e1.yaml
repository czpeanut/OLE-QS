  stem: '附表為配製甲、乙、丙、丁、戊等五種水溶液，過程中依序加入適量的各種成分，試問五種水溶液在配製過程中，何者<u>不會</u>發生沉澱或明顯的顏色變化？

    | 溶液代號 | 依序加入的成分 |

    | --- | --- |

    | 甲 | $Na^{＋}$、$K^{＋}$、$Cl_{2}$、$I^{－}$ |

    | 乙 | $Fe^{2＋}$、$H^{＋}$、$S^{2－}$、$NO_{3}^{－}$ |

    | 丙 | $Ag^{＋}$、$K^{＋}$、$H^{＋}$、$Br^{－}$ |

    | 丁 | $K^{＋}$、$Ba^{2＋}$、$OH^{－}$、$Cl^{－}$ |

    | 戊 | $Na^{＋}$、$Ca^{2＋}$、$CO_{3}^{2－}$、$H^{＋}$ |'
