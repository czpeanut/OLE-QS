  stem: 下列有關解離說與電解質的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 電解質解離後陽離子的莫耳總數與陰離子的莫耳總數不一定相等
  - label: B
    content: 電解質在溶液中陽離子的總電量與陰離子的總電量必相等
  - label: C
    content: 電解質的導電方式是藉由陰、陽離子的移動
  - label: D
    content: 凡化合物的水溶液能導電者，該化合物即稱為電解質
  - label: E
    content: 電解質必為離子化合物
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (E)也有可能是分子化合物如HCl、$NH_{3}$等。故選(E)。
