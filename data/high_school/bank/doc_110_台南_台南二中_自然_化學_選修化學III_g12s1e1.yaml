  stem: 定溫下，A(g)＋B(g) $\rightleftharpoons$ 2C(g)＋2D(g) 的反應達到平衡時，有關此時平衡狀態的敘述，下列何者<u>錯誤</u>？
  options:
  - label: A
    content: A的消耗速率等於A的生成速率
  - label: B
    content: B的消耗速率：C的消耗速率＝1：2
  - label: C
    content: '[A]：[B]：[C]：[D]＝1：1：2：2'
  - label: D
    content: '[A]、[B]、[C]、[D]都不隨時間改變'
  - label: E
    content: 定溫下，$\frac{ \sqrt{ [A] [B] } }{ [C] [D] }$＝常數
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 平衡時各物種濃度維持定值（D正確），正逆反應速率相等（A、B正確），且平衡常數 $K_{c} = \frac{[C]^{2}[D]^{2}}{[A][B]}$ 為定值，開根號亦為常數（E正確）；但各物種平衡濃度比不一定等於反應係數比 1：1：2：2（C錯誤）。故選(C)。
