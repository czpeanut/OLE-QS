    content: 甲
  - label: B
    content: 乙
  - label: C
    content: 丙
  - label: D
    content: 丁
  - label: E
    content: 戊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $Cl_{2}$會與$I^{-}$進行氧化還原反應（$Cl_{2}$活性較大）；(B)產生FeS沉澱；(C)產生AgBr沉澱；(D)無反應；(E)產生$CaCO_{3}$沉澱。故選(D)。
