  stem: '工業上利用哈柏法將氮氣與氫氣轉化為氨氣，用於製作肥料。據估計，目前人類食物中有一半的氮元素源於此法，因此哈柏法對於維持世界人口免於飢餓至為重要。根據哈柏法的反應，可以定義反應後氨氣莫耳產率如下： 氨氣莫耳產率＝$\frac{ 反應後氨氣莫耳數 }{ 反應後氣體總莫耳數 }$×100％ 附圖是在相同容器中，莫耳數比為氮氣：氫氣＝1：3的合氣體在不同溫度下反應後，氨氣莫耳產率與壓力的關係曲線。根據上述內容，回答下列問題。

    (1) 關於哈柏法和附圖的資料，下列敘述何項正確？（3分）

    (2) 定義反應後氨氣重量產率為：氨氣重量產率＝$\frac{ 反應後氨氣莫耳數 }{ 反應後氣體總莫耳數 }$×100％， 根據附圖，在400℃，200 atm下，反應後氨氣重量產率為若干％？（3分）（H＝1，N＝14）'
  options:
  - label: A
    content: 氨的生成反應是吸熱反應
  - label: B
    content: 高溫下，平衡往生成氨氣的方向移動
  - label: C
    content: 降低總壓力，可增加氨的莫耳產率
  - label: D
    content: 氨生成反應的平衡常數隨著溫度之上升而減少
  - label: E
    content: 將1莫耳氮氣和3莫耳氫氣混合，在200℃和1000大氣壓時 通過鐵觸媒，可達到完全反應，生成2莫耳的氨
