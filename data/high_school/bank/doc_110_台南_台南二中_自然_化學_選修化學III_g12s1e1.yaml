- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 在某溫度時，$PbI_{2}$(s)的$K_{sp}$為2.5×$10^{－9}$，在此溫度下，取2×$10^{－3}$ M的NaI溶液，與同體積未知濃度的Pb($NO_{3}$)$_{2}$溶液充分混合，若欲使之生成$PbI_{2}$(s)沉澱，則此Pb($NO_{3}$)$_{2}$溶液的濃度至少應高於多少M？
  options:
  - label: A
    content: 6.25×$10^{－6}$
  - label: B
    content: 5.0×$10^{－3}$
  - label: C
    content: 2.0×$10^{－2}$
  - label: D
    content: 8.0×$10^{－2}$
  - label: E
    content: 1.0×$10^{－1}$
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: CH-S3-2-3
      book: 選修化學III 化學平衡
      chapter: 沉澱反應
      title: 溶解平衡
      std: true
    textbook: 選修化學III 化學平衡 溶解平衡
    pattern:
      key: CH-S3-2-3:T03
      name: 離子積Q與Ksp比較判斷沉澱
    labeled_by: agent
    label_confidence: high
    label_note: 題幹「$K_{甲}$」疑為「$K_{sp}$」之誤植
    fixed_by: agent
    fix_note: （人工修正：修正題幹Ksp誤植並補齊解析）
  difficulty: 3
  explanation: 等體積混合後 $[I^{-}] = 1.0\times 10^{-3}\text{ M}$。欲產生沉澱需 $[Pb^{2+}][I^{-}]^{2} > K_{sp}$，即 $[Pb^{2+}] > \frac{2.5\times 10^{-9}}{(10^{-3})^{2}} = 2.5\times 10^{-3}\text{ M}$。因混合前體積為一半，原 $Pb(NO_{3})_{2}$ 濃度至少應高於 $5.0\times 10^{-3}\text{ M}$。故選(B)。
