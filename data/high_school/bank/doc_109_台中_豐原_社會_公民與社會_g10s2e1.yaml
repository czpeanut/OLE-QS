    ◎我國《刑法》與《貪汙治罪條例》針對貪汙行為皆有相關處罰規定。請閱讀下列所檢附的相關法律條文，並進行判斷： ●《刑法》第121條：「公務員或仲裁人對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以下有其徒刑，得併科七卉萬元以下罰金。」 ●《貪汙治罪條例》第五條：「有下列行為之一者，處七年以上有期徒刑」得併科新臺幣六千萬元以下罰金： 一、意圖得利，擅提或截留公款或違背法令收募稅捐或公債者。 二、利用職務上之機會，以詐術使人將本人之物或第三人之物交付者。'
