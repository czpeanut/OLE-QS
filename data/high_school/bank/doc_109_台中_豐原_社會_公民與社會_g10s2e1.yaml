questions:
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 殺人是不道德的，所以法律也制定殺人罪懲罰之；所以道德與法律有特殊之關聯性，請問：下列關於「法律與道德的關係」之敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 法律乃道德之最低限度
  - label: B
    content: 道德不充許的，法律一定會懲罰
  - label: C
    content: 違反法律一定違反德
  - label: D
    content: 法律與道德密切相關
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 根據報載，某男子與已婚女子偷情，雙方經過調解委員會調解，達成該男子在市場上下跪並送檳榔香菸，依傳統社會的習俗為女子夫家洗門風，女子的先生就不告該男子通姦。傳統社會中常以「洗門風」的習俗來處理通姦事件，是因為「習俗」具有哪種特性？
  options:
  - label: A
    content: 是正式的社會控制
  - label: B
    content: 違反者會受國家公權力制裁
  - label: C
    content: 違反者會受宗教組織制裁
  - label: D
    content: 被社會大眾所認可，因而產生拘束力，以社會輿論來制裁
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 2017年正逢閏六月，坊間相傳出嫁女兒需要閏六月期間帶著豬腳麵線回家孝敬父母，才能使父母親能夠平安度過閏月。對於上述的說法儘管只是口耳相傳無根據，但仍有許多人會照做，希望父母均安，主要是受到何種社會規範之影響？
  options:
  - label: A
    content: 習俗
  - label: B
    content: 宗教
  - label: C
    content: 道德
  - label: D
    content: 法律
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 臺灣透過法律保障同性婚姻，主要是要落實性別平等。而1995年聯合國在第4屆世界婦女會議中要求各國政府檢討勞動、教育、環保、警政、醫療等各項政策，並於制定法令政時要具有性別平等的意識，並改善性別不平等的現象，請問以下敘述何者<u>不是</u>與性別主流化追求的實質平等精神息息相關？
  options:
  - label: A
    content: 立法保障同性婚姻合法化
  - label: B
    content: 航空公司招收男性空服員
  - label: C
    content: 公共場所設立性別友善廁所
  - label: D
    content: 基本工資從22K提升至23.1K
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 博愛座設置不是只有老弱婦孺才能使用，忽略其實有些人是「隱形需求」，無法長久站立長有身體病痛或病弱者。請間：即使沒有人坐博愛座也不敢坐下的主要原因為何？
  options:
  - label: A
    content: 博愛座只有老人才能使用
  - label: B
    content: 博愛只有肢體障礙者才能使用
  - label: C
    content: 擔心受到社會輿論譴責與異樣眼光
  - label: D
    content: 法律有強制性規定要讓座給需要的人
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 法律具有強制的約束力，而其不同於其他規範的地方在於拘束的對象是所有人。下述何者是屬於法律所規範的內涵？
  options:
  - label: A
    content: 農曆三月，媽祖繞境，沿途信眾虔誠膜拜
  - label: B
    content: 小利搭捷運時，裝睡而不讓座位給身心障礙者
  - label: C
    content: 阿杰與小凌舉行婚宴宴請親朋好友
  - label: D
    content: 阿文開設影印店，專門幫學生影印原文書
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 小民和朋友去圖書館打算溫習功課，原本一路上開心談話至圖書館的兩人，一進去圖書館門口，卻不約而同地開始用氣音小聲說話，進入到閱覽室後甚至開始比手畫腳，一直到離開圖書館才恢復交談聲量。請問：關於小民和朋友溝通方式在進入圖書館後改變的原因，下列敘述何者正確？
  options:
  - label: A
    content: 是社會規範所形成的社會化現象，在小民和朋友的社會化過程中形成的社會控制
  - label: B
    content: 社會中的所有人在進入圖書館時，都會展現和小民一樣的行為模式
  - label: C
    content: 小民和朋友的行為模式受到了外動機的影響
  - label: D
    content: 小民和朋友官所以會展現此行動，是因為政府有明文法律規定
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 皮克斯動畫《可可夜總會》敘述一名熱愛音樂的墨西哥男孩，被家人要求放棄成為音樂人的夢想，並繼承家族傳統而投入製鞋業，但最後他仍然一連串的冒險後，突破了家族規範，往音樂路邁進。請問：關於這名男孩的際遇，下列敘述何者正確？
  options:
  - label: A
    content: 家庭雖為社會的單位，家庭規範一定無法影響個人的行動
  - label: B
    content: 穩定的產業收入對於男孩的家人而言，是投入製鞋業的內在動機
  - label: C
    content: 男孩的最終選擇與背後動機，展現了霍桑實驗中的概念與主軸
  - label: D
    content: 金錢誘因一定無法改變人們的行為
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 在尼泊爾有一特有的文化現象「活女神制度」，由3到7歲的經過嚴苛的篩選過程脫穎而出，便可以成為被眾人景仰的女神。一但被選為童女神必須放棄童年生活，不能輕易流露感情，不能進行教育與同儕相處。人權組織提出此制度可能使兒童與婦女人權遭受侵害，儘管如此在尼泊爾還在。請從人權角度詮釋活女神制度是否應該廢除？
  options:
  - label: A
    content: 不應該，各國文化應受到絕對的保障，儘管是人權組織也不應干涉
  - label: B
    content: 不應該，人權組織的介入已違反多元文化主義的精神
  - label: C
    content: 應該，活女神制度太過於傳統不能與時俱進，因此應該廢除
  - label: D
    content: 應該，各國文化雖受到尊重，但活女神制度恐違人權，已非尊重文化的界線
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 《民法》規定子女應敬父母，但隨著孝道觀念改變，子女扶養雙親從「絕對義務」轉變為「相對義務」；子女姓氏也修法從「子女應從父姓」改成「可由父母書面約定子女姓氏」，這些修法大大轉變長久以來社會傳統的社會規範，但多數人民依然認為「天下無不是父母」或大多數家庭子女仍以父姓為主。請問：下列哪個論點最能說明此現象？
  options:
  - label: A
    content: 傳統家庭之道德觀仍維擊家庭倫理
  - label: B
    content: 法律不具強制力難以要求人民遵守
  - label: C
    content: 風俗習慣較法律更能影響人民行為
  - label: D
    content: 透過法律懲蛀有效改善人民價值觀
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: LGBTQ說明除了異性戀和同性戀之外，還存在其他不同的性傾向認同，每個字母代表一個性少數群體。從1970年開始，性少數群體開始展開性平權運動，積極爭取被認同。下列相關敘述何者正確？
  options:
  - label: A
    content: 隨著時間不同，每個人的性傾向依舊堅持原本的認知
  - label: B
    content: 性少數群體在現代社會中，仍會遭性別文化的壓迫與歧視
  - label: C
    content: LHBTQ字母背後的涵義，是將不一樣的人貼上排除和拒絕的標籤
  - label: D
    content: 透過年年的同志大遊行，全球已經全面性接納，包容和理解LGBTQ
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 科技倫理涵蓋的範圍廣泛，因科技發明而產生的倫理問題皆屬之。下列何者最不會產生科技倫的問題？
  options:
  - label: A
    content: 基因改造
  - label: B
    content: 代理孕母
  - label: C
    content: 動物實驗
  - label: D
    content: 健康檢查
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 現代法治社會強調「權利主體」的概念，請問：下列選項中，何者「 」不屬於權利主體？
  options:
  - label: A
    content: 「航空公司」指工會非法罷工，因而對工會提起訴訟
  - label: B
    content: 商家因給付商品有瑕疵造成「消費」蒙受損失，逼法院判決敗訴，須對「消費者」進行賠償
  - label: C
    content: 「臺南市政府」在日本大阪設立臺南農產品廣告看板並播放旅遊推廣影片，期望能保進臺南觀光與經濟發展
  - label: D
    content: 「原位民部落」對於其擁有的土地周邊所進行的學術研究計畫予以同意
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 《聯合國原住民族權利宣言》提到：「深信原住民族掌管了與他們自己及他們的土地、領土和資源相關發展進程，將能夠保持和加強他們的機構、文化和傳統，並根據自己的願望和需要促進自身發展。」下列有關原住民族所具有的集體權桘何者較為正確？
  options:
  - label: A
    content: 基於環境權的發展，原住民族的傳統文化、傳統領域應該給予保障
  - label: B
    content: 原住民族多以部落作為公共事務決策，故集體權利有助於文化傳承
  - label: C
    content: 基於文化的認同，原住民傳統領域的劃分與分割，將有助於文化保障
  - label: D
    content: 聯合國原住民宣言賦予住民族群享有豐沛資源，無須保障其文化
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 原住民族在歷史上遭受過許多外來族群的迫害，被剝奪了語言、土地、姓名等文化與財產。請問：若以「轉型正義」的概念來制定原住民族相關法規，下列敘述何者正確？
  options:
  - label: A
    content: 應以國會立法確保其自治地位，並且賦予原住民族集體的權利能力
  - label: B
    content: 應將原住民族轉型成為臺灣的新主人，一切法令規章皆依原住民族的文化與規範而行
  - label: C
    content: 由原住民族以公法人地位進行法律提案，要求國會訂定保障其語言及文化的法規
  - label: D
    content: 由政府以位階僅低於《憲法》的行政命令劃定原住民族傳統領域，其周邊開居皆須與原住民族諮商以獲得同意
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 載，知名迪士尼動畫《冰雪奇緣》的角色設定與題材，採樣自北歐原住民薩米文化遭不當挪用。請問：廸士尼此舉最能彰顯出我國法規中何項概念？
  options:
  - label: A
    content: 原住民族自治權利
  - label: B
    content: 原住民族的公法人地位
  - label: C
    content: 原住民族轉型正義
  - label: D
    content: 原住民族傳統智慧創作專用權
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 在現行民主憲政體制下，國家主權屬於全體國民，在民主社會中，人們逐漸建立起「法律是由全體國民推派代表，並依一定程序所制定」的法治觀念。法律必須經過一定的程序，獲得多數民意支持並預先公布，才能具備法律的形式。下列有關「我國立法院制定泿律之程序」的敘述，何者正確？
  options:
  - label: A
    content: 提案→討論→審查→覆議→公布
  - label: B
    content: 提案→審查→討論→副署→公布
  - label: C
    content: 提案→審查→討論→議決→公布
  - label: D
    content: 提案→討→審昩 →議決→公布
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 在臺灣，法律是交由立法院來制定或修正，其立法的過程採三讀序，關於三讀程序中，口讀會之內容敘述何者正確？
  options:
  - label: A
    content: 一讀會：法律案排入議程後，在大會逐條討論
  - label: B
    content: 二讀會：主席朗讀標題後，即交由相關委員會審昩
  - label: C
    content: 三讀會，在大會逐條或依次討論
  - label: D
    content: 三讀會：除非有重大瑕疵，否則僅能作文字上之修正
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 有關人治與法治的比較，何者選項內容是正確？
  options:
  - label: A
    content: 法治國家的規範內容與效力，出自於統治者的好惡
  - label: B
    content: 人治國家是以權力分立形式，來劃分權力歸屬
  - label: C
    content: 人治國家的決策者，仍受到法律制約
  - label: D
    content: 法治國家的決策程序，須經過一定的程序制定、公布才生效力
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 法律的制定與修正過程中，下列何者得向立法院提出法律案或修正案？
  options:
  - label: A
    content: 一般人民
  - label: B
    content: 婦幼等弱勢族群
  - label: C
    content: 立法委員經15人以上連署
  - label: D
    content: 法院的法官或地檢署的檢察官
- id: doc_109_台中_豐原_社會_公民與社會_g10s2e1_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 歷史新聞節錄：「行政院院會昨天通過《臺灣地區與大陸地區人民關係條例》第十七條修正草案，未來將放寬非法入境的大陸地區人民得適用現行基於政治考量，申請在臺灣專案長期居留規定。」請問：這項修正草案尚須經過下列何種程序，才能完成立法程序？
  options:
  - label: A
    content: 大陸委員會認可
  - label: B
