  stem: 附圖為y＝cos ( x＋2 )，y＝cos 2x，y＝cos ( 2x＋3 )，y＝2 cos 2x四個函數的部分圖形，選出正確的組合
  options:
  - label: A
    content: g (x)＝cos ( x＋2 )
  - label: B
    content: h (x)＝cos 2x
  - label: C
    content: h (x)＝cos ( 2x＋3 )
  - label: D
    content: k (x)＝cos 2x
  - label: E
    content: f (x)＝2 cos ( 2x )
  assets:
  - key: s1_1_f1
    kind: figure
    file: doc_109_桃園_武陵_數學_數A_g11s1e1/s1_1_f1.png
