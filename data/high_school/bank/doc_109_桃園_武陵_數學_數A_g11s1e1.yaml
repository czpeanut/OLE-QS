      page: 1
      rect:
      - 54.9
      - 111.65
      - 203.6
      - 224.35
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: y＝cos ( x＋2 ) 的週期為2π， y＝cos 2x，y＝cos ( 2x＋3 )，y＝2 cos 2x的週期均為π， y＝2 cos 2x的振幅為2， 所以可得f (x)＝2 cos 2x，k (x)＝cos 2x，g (x)＝cos ( x＋2 )，h (x)＝cos ( 2x＋3 )， 故選(A)(C)(D)(E)。
