- id: doc_109_桃園_武陵_數學_數A_g11s1e1_s2_1
  section: 2
  number: 1
  type: fill
  page: 1
  stem: 若－π ≤ θ ≤ 0，且y＝3 sin θ－4 cos θ，則 (1) y的最小值＝＿＿＿＿。 (2) 當y有最小值時，sin θ＝＿＿＿＿。
  answer:
  - (1)－5；(2)$\frac{-3}{5}$
  answer_status: verified
  answer_source: answer_key
  explanation: (1) y＝3 sinθ－4 cosθ＝5 ( sinθ．$\frac{3}{5}$－cosθ．$\frac{4}{5}$)＝5 sin (θ－ψ)， 其中cosψ＝$\frac{3}{5}$，sinψ＝$\frac{4}{5}$，0＜ψ＜$\frac{\pi}{2}$， 因為－π ≤ θ ≤ 0 ⇒ －$\frac{3\pi}{2}$＜θ－ψ＜0， 所以y的最小值為－5。 (2) θ－ψ＝－$\frac{\pi}{2}$ ⇒ θ＝ψ－$\frac{\pi}{2}$， ⇒ sinθ＝sin (ψ－$\frac{\pi}{2}$)＝cos (π－ψ)＝－cosψ＝$\frac{-3}{5}$。
- id: doc_109_桃園_武陵_數學_數A_g11s1e1_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: $\frac{1}{2}$－( sin 42.5° cos 20°－sin 20° cos 42.5° )$^{2}$＝＿＿＿＿。
  answer:
  - $\frac{\sqrt{2}}{4}$
  answer_status: verified
  answer_source: answer_key
  explanation: $\frac{1}{2}$－( sin 42.5° cos 20°－sin 20° cos 42.5° )$^{2}$ ＝$\frac{1}{2}$－$sin^{2}$ ( 42.5°－20° )＝$\frac{1}{2}$－$sin^{2}$ 22.5° ＝$\frac{1}{2}$－$\frac{1-\cos 45^{\circ}}{2}$＝$\frac{1}{2}$－$\frac{1-\frac{\sqrt{2}}{2}}{2}$＝$\frac{\sqrt{2}}{4}$。
- id: doc_109_桃園_武陵_數學_數A_g11s1e1_s2_3
  section: 2
  number: 3
  type: fill
  page: 1
  stem: 若$\frac{-\pi}{2}$ ≤ x ≤ $\frac{\pi}{2}$，2 tan x＝－tan ( 2x ) 的解共有＿＿＿＿個。
  answer:
  - '3'
  answer_status: verified
  answer_source: answer_key
  explanation: 因為tan 2x＝－$\frac{2\tan x}{1-\tan ^{2}x}$，所以原式可化為2 tan x＝－$\frac{2\tan x}{1-\tan ^{2}x}$， ⇒ $tan^{3}$ x－2 tan x＝0 ⇒ tan x ( tan x－$\sqrt{2}$) ( tan x＋$\sqrt{2}$)＝0， ⇒ tan x＝－$\sqrt{2}$，0，$\sqrt{2}$，又－$\frac{\pi}{2}$ ≤ x ≤ $\frac{\pi}{2}$， 故所求為3個。
- id: doc_109_桃園_武陵_數學_數A_g11s1e1_s2_4
  section: 2
  number: 4
  type: fill
  page: 1
  stem: 比較a＝cos 1，b＝sin 1，c＝tan 1，d＝cos$\frac{1}{2}$之大小順序＿＿＿＿。
  answer:
  - c＞d＞b＞a
  answer_status: verified
  answer_source: answer_key
  explanation: a＝cos 1 ≈ cos 57°，b＝sin 1 ≈ sin 57°＝cos 33°， c＝tan 1 ≈ tan 57°＞tan 45°＝1，d＝cos$\frac{1}{2}$ ≈ cos 28.5°， 因為cos 57°＜cos 33°＜cos 28.5°＜1， 所以a＜b＜d＜c。
- id: doc_109_桃園_武陵_數學_數A_g11s1e1_s2_5
  section: 2
  number: 5
  type: fill
  page: 1
  stem: 在0 ≤ x ≤ 2π範圍內，滿足不等式－$\frac{\sqrt{3}}{2}$≤ cos ( x－$\frac{\pi}{6}$) ≤$\frac{\sqrt{3}}{2}$的x的解為＿＿＿＿。
  answer:
  - $\frac{\pi}{3}$≤ x ≤π或$\frac{4\pi}{3}$≤ x ≤ 2π或x＝0
  answer_status: verified
  answer_source: answer_key
  explanation: 可知－$\frac{\pi}{6}$ ≤ x－$\frac{\pi}{6}$ ≤ $\frac{11\pi}{6}$， 因為－$\frac{\sqrt{3}}{2}$ ≤ cos ( x－$\frac{\pi}{6}$) ≤ $\frac{\sqrt{3}}{2}$， 所以x－$\frac{\pi}{6}$＝－$\frac{\pi}{6}$或$\frac{\pi}{6}$ ≤ x－$\frac{\pi}{6}$ ≤ $\frac{5\pi}{6}$或$\frac{7\pi}{6}$ ≤ x－$\frac{\pi}{6}$ ≤ $\frac{11\pi}{6}$， ⇒ x＝0或$\frac{\pi}{3}$≤ x ≤π或$\frac{4\pi}{3}$≤ x ≤ 2π。
- id: doc_109_桃園_武陵_數學_數A_g11s1e1_s2_6
  section: 2
  number: 6
  type: fill
  page: 1
  stem: 設f (x)＝4 ($\sqrt{7}cos^{3}$ x＋$\sqrt{2}sin^{3}$ x )－3 ($\sqrt{7}$cos x＋$\sqrt{2}$sin x )，且0 ≤ x ≤$\frac{\pi}{4}$，求f (x) 之最小值m＝＿＿＿＿。
  answer:
  - $\frac{-2-\sqrt{14}}{2}$
  answer_status: verified
  answer_source: answer_key
  explanation: f (x)＝$\sqrt{7}$( 4 $cos^{3}$ x－3 cos x )－$\sqrt{2}$(－4 $cos^{3}$ x＋3 cos x )＝$\sqrt{7}$cos 3x－$\sqrt{2}$cos 3x ＝3 ( cos 3x．$\frac{\sqrt{7}}{3}$－sin 3x．$\frac{\sqrt{2}}{3}$)＝3 cos ( 3x＋ψ)， 其中cosψ＝$\frac{\sqrt{7}}{3}$，sinψ＝$\frac{\sqrt{2}}{3}$，0＜ψ＜$\frac{\pi}{4}$， 因為0 ≤ x ≤ $\frac{\pi}{4}$ ⇒ 0 ≤ 3x ≤ $\frac{3\pi}{4}$ ⇒ 0＜3x＋ψ＜π， 所以3 cos ( 3x＋ψ) ≥ 3 cos ($\frac{3\pi}{4}$＋ψ)＝3 ( cos$\frac{3\pi}{4}$cosψ－sin$\frac{3\pi}{4}$cosψ) ＝3 (－$\frac{\sqrt{2}}{2}$×$\frac{\sqrt{7}}{3}$－$\frac{\sqrt{2}}{2}$×$\frac{\sqrt{2}}{3}$)＝$\frac{-2-\sqrt{14}}{2}$， 故最小值m為$\frac{-2-\sqrt{14}}{2}$。
