  stem: 0 ≤ θ ≤ 2π，cos θ≠0。 (1) 證明：$\frac{\sin 2\theta +\cos 2\theta + 1}{\cos \theta}$＝2 sin θ＋2 cos θ。 (2) 證明：$\frac{\sqrt{2}\sin ( 2\theta +\frac{\pi}{4} ) + 1}{\sqrt{2}\sin ( 2\theta -\frac{\pi}{4} ) - 1}=\frac{\sin ( \theta +\frac{\pi}{4} )}{\sin ( \theta -\frac{\pi}{4} )}$。
