  stem: 2009年8月，莫拉克颱風造成我國50年來傷亡最慘重的水患，農業損失嚴重，工業基礎設施亦遭破壞，經濟損失甚鉅。風災發生之後，國內某些知名的非營利組織，於第一時間即投入救災行列，積極募集賑災物資並迅速發放，其執行效率受到高度肯定。至於政府的救災表現則頗受社會議論，部分媒體出現內閣改組的聲音。民眾在8月時已出現對政府救災效能之議論，而總統在9月初決定更換行政院院長。請問：在現行《憲法》相關條文之精神下，下列何者是此舉之正確解釋？
  options:
  - label: A
    content: 總統任期尚未過半時，不宜貿然更換行政院院長
  - label: B
    content: 總統可在通盤考量後，再決定是否更換行政院院長
  - label: C
    content: 總統在立法院總質詢結束前，不宜更換行政院院長
  - label: D
    content: 總統需要時間爭取立法院對新院長人選之投票通過
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 行政院院長由總統直接任命，不須要立法院同意，無固定任期。
