  stem: 《巴黎協議》是由聯合國195個成員國於2015年聯合國氣候峰會中通過的氣候協議，用以取代京都議定書，期望能共同遏阻全球暖化趨勢。《巴黎協議》希望能將全球升溫控制在1.5至2度間、並加強已開發國家與開發中國家在減碳上的合作，並予以訂定不同的減碳目標。透過這樣的國際性協議的簽署，也喚起民眾對氣候變遷議題的關注，進而更有機會帶動行為的改變。請問：關於上文所述對於氣候議題的處理與影響，最適合用以下哪一概念詮釋？
