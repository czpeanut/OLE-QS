  answer_status: verified
  answer_source: answer_key
  explanation: (A)地方立法機關工作為議決自治法規、審核預算與決算、處分自治財產、接受人民請願等；(B)區非屬地方自治團體，只有民選的原住民區才是地方自治團體；(C)原住民區為民意機關，屬地方自治團體；(D)地方行政機關除交辦中央行政機關賦予的委辦事項，還有自治事項。故選(A)。
