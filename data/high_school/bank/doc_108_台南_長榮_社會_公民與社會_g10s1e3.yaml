  stem: 國家如何在追求「經濟成長」的同時，也能兼顧「永續發展」已成為世界各國共同關注的議題，有關「經濟成長」與「永續發展」的相關敘述下列何者正確？
  options:
  - label: A
    content: 永續發展不考慮經濟活動對社會產生的效益問題
