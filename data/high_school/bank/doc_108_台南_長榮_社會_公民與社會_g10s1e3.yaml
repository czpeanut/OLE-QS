- id: doc_108_台南_長榮_社會_公民與社會_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 受到經濟全球化的發展，各國政府間常因經貿、環保、人權、貧窮等議題產生衝突。又或者因全球化的好處並未雨露均霑的分配給各階層的人民，導致民眾與政府間的抗爭頻傳。因此，「反全球化」論述與社會運動也隨之興起。請問：下列哪一敘述最有可能屬於「反全球化」的主張？
  options:
  - label: A
    content: 政府應考慮簽定自由貿易協定後，對國內就業市場造成的影響
  - label: B
    content: 跨國公司在各國進行投資將會帶來可觀的就業機會，促進經濟成長
  - label: C
    content: 應加強WTO的實際影響力，以確保貿易的利益能在各國之間平均分配
  - label: D
    content: 為促進與國際的接軌，低度開發國家應加強執行推護智慧財產權的法令
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)認為自由貿易協定的簽定（經濟全球化）可能會衝擊國內就業市場，希望政府慎思，合乎反全球化的論點；(B)跨國企業屬於經濟全球化的展現，本選項對其表示贊同應是贊成全球化的論點；(C) WTO亦屬於經濟全球化的展現，因此本選項主張要加強WTO的職權應是贊成全球化的觀點；(D)在全球化的貿易架構之下已開發國家透過國際組織與法令的限制要求低度開發國家配合執行維護智慧財產權的法令，若不配合將予以經濟制裁，這樣屬於經濟全球化的展現。本選項若贊同此觀點，便不會是反全球化者的主張。
  tags:
