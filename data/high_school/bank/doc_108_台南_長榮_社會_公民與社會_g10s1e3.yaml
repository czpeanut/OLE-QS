  type: single
  page: 1
  stem: 臺北市立圖書館與新北市立圖書館、基隆市圖書館共同合作，推動「北北基一證通用服務」，三市市民可用一張借書證借遍北北基一七六個圖書館，對於居住或工作在北北基的民眾享有更便利的閱讀服務。請問：上述三市的合作是屬於何種性質？
  options:
  - label: A
    content: 委辦事項
  - label: B
    content: 地方治理
  - label: C
    content: 跨國域事項
  - label: D
    content: 經營合辦事業
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此北北基一證通用服務，屬不同自治團體為增進區域居民之福祉，得與其他直轄市、縣（市）、鄉（鎮、市）訂定協議、行政契約或以其他方式合作，此為跨區域事項。(A)委辦事項：原本屬上級政府權限，但基於由地方自治團體辦理較便利、也更節省經費，便委由地方自治團體在上級政府指揮監督下，代為辦理之事項；(B)地方治理：結石中央政府、地方政府、私部門、非營利組織等，共同擔負解決地方事務責任，建立政府與民間的夥伴關係，此無涉及私部門或非營利組織；(C)跨區域事項：直轄市、縣（市）、鄉（鎮、市）為處理跨區域自治事務、促進區域資源之利用或增進區域居民之福址，得與其他直轄市、縣（市）、鄉（鎮、市）成立區域合作組織、訂定協議、行政契約或以其他方式合作，並報共同上級業務主管機關備查；(D)經營合辦事業：不同自治團體合作經營之事業。例如：臺北大眾捷運股份有限公司就是由臺北市政府、新北市政府、交通部等共同合辦經營。故選(C)。
