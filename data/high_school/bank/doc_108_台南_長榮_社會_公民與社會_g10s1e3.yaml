  stem: 臺灣地狹人稠，上、下班時段在臺灣主要的街道上最常見到機車群聚在一起的景象。雖然機車體積輕巧、移動便利，卻也是加速全球暖化的元兇之一。請問：為了延緩全球暖化的速度，我們可以努力的方向是下列何者？
