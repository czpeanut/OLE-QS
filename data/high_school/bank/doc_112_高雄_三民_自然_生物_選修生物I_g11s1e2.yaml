  stem: 2005年，<u>高雄</u>的<u>張</u>氏三兄弟先後被診斷出罹患腎上腺腦白質失養症（Adrenoleukodystrophy , ALD），這是一種會導致神經退化的隱性遺傳疾病，主因是位於X染色體上的基因（X-ALD或ABCD1）發生突變，造成患者細胞內過氧化體異常，無法代謝非常長鏈飽和性脂肪酸（very long-chain fatty acids , VLCFA），特別是24個碳及26個碳的脂肪酸，導致體內VLCFA大量堆積於大腦白質和腎上腺皮質，進而侵蝕包覆神經纖維的髓鞘，造成神經發育遲緩、神經傳遞發生障礙。目前這種疾病除了高風險的骨髓移植外仍無法治癒，大多依靠藥物補償神經的功能損失，或使用羅倫佐的油（Lorenzo's oil）減少VLCFA產生，以延緩症狀。請根據上述短文，判斷下列敘述哪些正確？
