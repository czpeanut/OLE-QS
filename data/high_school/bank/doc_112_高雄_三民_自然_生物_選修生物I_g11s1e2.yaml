  type: single
  page: 1
  stem: 運動蛋白（Kinesin）是一種細胞內可在微管上搬運物質的蛋白質，搬運過程如附圖，未參與運動的運動蛋白兩端頭部都有附著ADP，當運動蛋白的一端頭部接觸微管蛋白時，該側的ADP會自頭部分離，且與ATP結合，導致整體運動蛋白構型改變，讓另一端頭部與微管接觸，此時與ATP結合的頭部會發揮ATP分解酶的活性將ATP分解釋出磷酸根，造成運動蛋白構型改變，促使另一側頭部的ADP與之分離，依此進入下一個循環。根據附圖判斷，下列敘述何者正確？
  options:
  - label: A
    content: 當運動蛋白的一側頭部與ATP結合時，會使另一側帶有ADP的頭部與微管接觸
  - label: B
    content: 運動蛋白是一種可被磷酸化改變構型的蛋白質
  - label: C
    content: 這是一種細胞的主動運輸
  - label: D
    content: ADP是運動蛋白頭部的受質
