- id: doc_112_台北_明倫_數學_數B_g11s1e1_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 如右圖為函數 y＝f（x）＝a sin（bx－c）＋d 一個週期的圖形，其中 a、b、c、d 皆為實數且 a＞0、b＞0、0＜c＜2π，試問：下列哪些選項是正確的？
  options:
  - label: A
    content: a＝3
  - label: B
    content: b＝2
  - label: C
    content: c＝π
  - label: D
    content: c＝$\frac{\pi}{2}$
  - label: E
    content: d＝－3
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_112_台北_明倫_數學_數B_g11s1e1/s2_2_f1.png
    crop:
      page: 2
      rect:
      - 446.65
      - 200.25
      - 564.3
      - 278.15
  answer:
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '由題圖知最大值為 3，最小值為－9，則$\begin{cases}a+d=3 \\ -a+d=-9\end{cases}\Rightarrow \begin{cases}a =6 \\ d=-3\end{cases}$

    又週期為 5π－π＝$\frac{2\pi}{b}$ ⇒ b＝$\frac{1}{2}$

    且 f（2π）＝3 ⇒ $6 \sin \left( \frac{1}{2}\times 2\pi -c \right) -3$＝3

    ⇒ sin（π－c）＝1

    又 0＜c＜2π ⇒ c＝$\frac{\pi}{2}$

    故選(D)(E)'
- id: doc_112_台北_明倫_數學_數B_g11s1e1_s3_1
  section: 3
  number: 1
  type: fill
  page: 2
  stem: 若$\frac{11\pi}{6}$弳為 A 度，且 110°為 B 弳，求數對（A，B）＝＿＿＿＿。
  answer:
  - $\left( 330 , \frac{11}{18}\pi \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: 'A＝$\frac{11\pi}{6}\times \frac{180}{\pi}$＝330

    B＝110×$\frac{\pi}{180}$＝$\frac{11}{18}\pi$

    故數對（A，B）＝$\left( 330 , \frac{11}{18}\pi \right)$'
- id: doc_112_台北_明倫_數學_數B_g11s1e1_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: 求$\sin \frac{\pi}{6}+\cos \frac{2\pi}{3}+\tan \frac{5\pi}{3}$＝＿＿＿＿。
  answer:
  - $-\sqrt{3}$
  answer_status: verified
  answer_source: answer_key
  explanation: '$\sin \frac{\pi}{6}+\cos \frac{2\pi}{3}+\tan \frac{5\pi}{3}$

    ＝sin30°＋cos120°＋tan300°

    ＝sin30°－cos60°－tan60°

    ＝$\frac{1}{2}-\frac{1}{2}-\sqrt{3} =-\sqrt{3}$'
- id: doc_112_台北_明倫_數學_數B_g11s1e1_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: f（x）＝sin（1＋2πx），則 f（x）的週期為＿＿＿＿。
  answer:
  - '1'
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（x）＝sin（1＋2πx）的週期與 f（x）＝sin2πx 的週期相同

    且 f（x）＝sin2πx 的週期為 f（x）＝sinx 週期的$\frac{1}{2\pi}$倍

    ∴f（x）＝sin（1＋2πx）的週期為 f（x）＝sinx 週期的$\frac{1}{2\pi}$倍

    故 f（x）＝sin（1＋2πx）的週期為$\frac{2\pi}{2\pi}$＝1'
