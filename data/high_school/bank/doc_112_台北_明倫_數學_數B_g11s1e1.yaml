- id: doc_112_台北_明倫_數學_數B_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 已知扇形的周長等於它所在圓的周長的$\frac{2}{3}$，那麼這個扇形的圓心角為
  options:
  - label: A
    content: $\frac{2}{3}\pi -\frac{1}{2}$
  - label: B
    content: $\frac{4}{3}\pi -2$
  - label: C
    content: $\frac{2}{3}\pi$
  - label: D
    content: $\frac{2}{3}\pi$
  - label: E
    content: 3π－2
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '令扇形的圓心角為θ弳，半徑為 r

    2r＋rθ＝2πr ×$\frac{2}{3}$

    ⇒ 2＋θ＝$\frac{4}{3}\pi$ ⇒ θ＝$\frac{4}{3}\pi$－2

    故選(B)'
