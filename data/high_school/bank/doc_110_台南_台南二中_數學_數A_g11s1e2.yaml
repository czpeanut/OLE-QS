  explanation: '(A)╳：$log_{3}$（$log_{3}$x）＝3$\Rightarrowlog_{3}$x＝$3^{3}\Rightarrow$x＝$3^{(3^{3})}$＝$3^{27}$

    (B)╳：∵x＝$3^{27}\Rightarrow$logx＝$log3^{27}$＝27×log3$\approx$27×0.4771＝12.8817

    ∴m＝13

    (C)○：∵log7$\approx$0.8451，log8$\approx$0.9030

    ∴α＝7

    (D)○：$3^{1}$＝3

    $3^{2}$＝9

    $3^{3}$＝27

    $3^{4}$＝81

    $3^{5}$＝243

    $⋮$

    由觀察規律可知個位數四個一循環

    ∴27÷4＝6 … 3

    ∴β＝7

    (E)╳：α＝β

    故選(C)(D)'
