  stem: 已知坐標平面上 A，B，C 相異三點，設 O 為原點，且$\vec{OA}$＝（k，k＋3）， $\vec{OB}$＝（k－1，2k），$\vec{OC}$＝（3k，k＋3），若$\vec{AB}$//$\vec{BC}$，求實數 k＝＿＿＿＿。
  explanation: '∵$\vec{AB}$＝$\vec{OB}$－$\vec{OA}$＝（k－1，2k）－（k，k＋3）＝（－1，k－3）

    又$\vec{BC}$＝$\vec{OC}$－$\vec{OB}$＝（3k，k＋3）－（k－1，2k）＝（2k＋1，－k＋3）

    ∵$\vec{AB}$//$\vec{BC}$ ∴$\frac{- 1}{2k + 1}$＝$\frac{k - 3}{- k + 3}$

    $\Rightarrow$k－3＝（2k＋1）（k－3）$\Rightarrow$k－3＝$2k^{2}$－5k－3

    $\Rightarrow2k^{2}$－6k＝0$\Rightarrow$2k（k－3）＝0

    ∴k＝0 或 k＝3

    當 k＝0 時，A（0，3），B（－1，0），C（0，3），則點 A 與點 C 重合

    故 k＝3'
