    (C)╳：$\log \frac{1}{\sqrt{10}}$＝$\log 10^{- \frac{1}{2}}$＝$- \frac{1}{2}$＜0

    (D)○：log5$\approx$0.6990 ∴0＜log5＜2

    (E)╳：$log_{3}$10＞$log_{3}$9＝2

    故選(A)(D)'
