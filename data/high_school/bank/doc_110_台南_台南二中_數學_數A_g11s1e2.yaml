- id: doc_110_台南_台南二中_數學_數A_g11s1e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 請選出與方程式 logx＋log（x－3）＝1 具有完全相同的實數解的方程式選項。
  options:
  - label: A
    content: log［x（x－3）］＝1
  - label: B
    content: x（x－3）＝10
  - label: C
    content: （$10^{x}$）$^{x－3}$＝$10^{10}$
  - label: D
    content: $10^{x}$．$10^{x－3}$＝$10^{10}$
  - label: E
    content: $log_{2}$（x－3）＝$\log _{2}\left( \frac{10}{x} \right)$
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '① logx＋log（x－3）＝1$\Rightarrow$x＞0 且 x－3＞0$\Rightarrow$x＞3

    ② log［x（x－3）］＝1$\Rightarrowx^{2}$－3x＝10$\Rightarrowx^{2}$－3x－10＝0$\Rightarrow$（x－5）（x＋2）＝0

    $\Rightarrow$x＝5 或 x＝－2

    由①、②得 x＝5

    (A)╳：① log［x（x－3）］＝1$\Rightarrow$x（x－3）＞0$\Rightarrow$x＞3 或 x＜0

    ② log［x（x－3）］＝1$\Rightarrowx^{2}$－3x－10＝0$\Rightarrow$（x－5）（x＋2）＝0

    $\Rightarrow$x＝5 或 x＝－2

    由①、②得 x＝5 或 x＝－2

    (B)╳：∵x（x－3）＝10$\Rightarrowx^{2}$－3x－10＝0$\Rightarrow$（x－5）（x＋2）＝0

    $\Rightarrow$x＝5 或 x＝－2

    (C)╳：（$10^{x}$）$^{x－3}$＝$10^{10}\Rightarrow10^{x（x－3）}$＝$10^{10}\Rightarrow$x（x－3）＝10

    $\Rightarrow$x＝5 或 x＝－2

    (D)╳：$10^{x}$．$10^{x－3}$＝$10^{10}\Rightarrow10^{x＋（x－3）}$＝$10^{10}\Rightarrow$2x－3＝10

    $\Rightarrow$x＝$\frac{13}{2}$

    (E)○：① $log_{2}$（x－3）＝$\log _{2}\left( \frac{10}{x} \right)\Rightarrow$x－3＞0 且$\frac{10}{x}$＞0$\Rightarrow$x＞3

    ② x－3＝$\frac{10}{x}\Rightarrow$x（x－3）＝10

    $\Rightarrowx^{2}$－3x－10＝0

    $\Rightarrow$（x－5）（x＋2）＝0

    $\Rightarrow$x＝5 或 x＝－2

    由①、②得 x＝5

    故選(E)'
