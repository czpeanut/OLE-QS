- id: doc_110_台南_台南二中_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 下列各敘述當中，請選出正確的選項。
  options:
  - label: A
    content: $\pi ^{\sqrt{3}} > \pi ^{\sqrt{2}}$
  - label: B
    content: $2^{\frac{1}{3}} > 3^{\frac{1}{2}}$
  - label: C
    content: $\log _{0.3}\frac{1}{2} > \log _{0.3}\frac{1}{3}$
  - label: D
    content: $log_{2}$（$3^{2}$）＞（$log_{2}$3）$^{2}$
  - label: E
    content: 若正數 a，b 滿足 $log_{a}$2＜$log_{b}$2，則 a＞b
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵π＞1 且$\sqrt{3}$＞$\sqrt{2}$ ∴$\pi ^{\sqrt{3}} > \pi ^{\sqrt{2}}$

    (B)╳：$2^{\frac{1}{3}}$＝$2^{\frac{2}{6}}$＝$(2^{2})^{\frac{1}{6}}$＜$(3^{3})^{\frac{1}{6}}$＝$3^{\frac{1}{2}}$

    (C)╳：∵0＜0.3＜1 且$\frac{1}{2}$＞$\frac{1}{3}$

    ∴$\log _{0.3}\frac{1}{2}$＜$\log _{0.3}\frac{1}{3}$

    (D)○：∵$log_{2}$（$3^{2}$）－（$log_{2}$3）$^{2}$＝2 $log_{2}$3－（$log_{2}$3）$^{2}$

    ＝（$log_{2}$3）（2－$log_{2}$3）

    ＝$log_{2}$3×（$log_{2}$4－$log_{2}$3）＞0

    ∴$log_{2}$（$3^{2}$）＞（$log_{2}$3）$^{2}$

    (E)╳：反例：若 a＝$\frac{1}{4}$，b＝2

    ∴$log_{a}$2＝$\log _{\frac{1}{4}}2$＝$\log _{2^{- 2}}2$＝$- \frac{1}{2}\log _{2}2$＝$- \frac{1}{2}$

    $log_{b}$2＝$log_{2}$2＝1

    ∴$log_{a}$2＜$log_{b}$2，但是 a＜b

    故選(A)(D)'
