- id: doc_108_高雄_高師大附中_數學_g10s2e3_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 四人同時玩「棒子、老虎、雞、蟲」的動物拳遊戲一次，規定為：棒子贏老虎，老虎贏雞，雞贏蟲，蟲贏棒子。假設恰有一人、兩人、三人獲勝的機率分別為 P(1)、P(2)、P(3)。則下列哪些正確？
  options:
  - label: A
    content: P(1)＞P(2)
  - label: B
    content: P(2)＞P(3)
  - label: C
    content: P(2)＞P(1)＞P(3)
  - label: D
    content: P(2)＞P(1)＝P(3)
  - label: E
    content: 四人不分勝負的機率為$\frac{25}{32}$
  answer:
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '$P ( 1 )=\frac{C_{1}^{4}\times C_{1}^{4}}{4^{4}}=\frac{1}{16}$

    $P ( 2 )=\frac{C_{2}^{4}\times C_{1}^{4}}{4^{4}}=\frac{3}{32}$

    $P ( 3 )=\frac{C_{3}^{4}\times C_{1}^{4}}{4^{4}}=\frac{1}{16}$

    (A) ╳ (B) ○ (C) ╳ (D) ○：P(2)＞P(1)＝P(3)

    (E) ○：P（不分勝負）＝1－P(1)－P(2)－P(3)＝$\frac{25}{32}$

    故選(B)(D)(E)'
