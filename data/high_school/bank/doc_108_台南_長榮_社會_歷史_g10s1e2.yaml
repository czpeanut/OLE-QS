  stem: 請閱讀下列資料後回答問題： 殖民體制對臺灣社會造成最大的衝擊，莫過於日本統治者所引介進來的資本主義與現代化。資本主義瓦解了原有的農村經濟，大幅改變了臺灣人的生活方式。現代化則是帶來知識與文化的啟蒙，使舊有的思維模式起了巨大的轉變。資本主義與現代化運動，是二十世紀人類歷史發展中無可抵擋的趨勢。由於資本主義的出現，全球各地才有工業化與城市化的普遍現象。也由於有現代化的運動，全世界才開始朝向科學、理性的生活去追求。然而，資本主義與現代化之引進，並非出自臺灣人民的意願，而是在殖民制度下被迫接受的。因此，臺灣資本主義與現代化的發展是依附於日本殖民統治的擴張而進行的。沒有殖民體制的建立，就沒有現代生活的改造。因此，對於臺灣的知識分子而言，這就構成兩難式的選擇。如果是接受現代化，幾乎就等於一併要接受殖民化；但是，如果是要抗拒殖民化，也似乎同時要抗拒現代化。這種價值選擇上的困境，一直苦惱著整個日治時期的知識分子，在臺灣新文學的整個歷史發展過程，都可以發現作家不斷透過文學形式來探討殖民化與現代化之間的矛盾，這種矛盾的根源就是起自於殖民體制的建立。 資料出處：陳芳明著，《臺灣新文學史》（新北：聯經，2011），頁44～45 (1)根據資料所言，造成臺灣知識分子苦惱的原因，應該在於
