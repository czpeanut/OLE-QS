  stem: 設 a、b 為相異正數，若 a，x，y，b 成等差數列，a，u，v，b 成等比數列（u、v 為實數），則下列敘述哪些正確？
  options:
  - label: A
    content: x＋y＝a＋b
  - label: B
    content: uv＝ab
  - label: C
    content: a＞x＞y＞b
  - label: D
    content: a＜x＜y＜b
  - label: E
    content: a＞u＞v＞b
  explanation: '(A) ○：x－a＝b－y ⇒ x＋y＝a＋b

    (B) ○：$\frac{u}{a}$＝$\frac{b}{v}$ ⇒ uv＝ab

    (C) ╳：反例：取 a＝1，x＝$\frac{10}{3}$，y＝$\frac{17}{3}$，b＝8，u＝2，v＝4

    (D) ╳：反例：取 a＝8，x＝$\frac{17}{3}$，y＝$\frac{10}{3}$，b＝1，u＝4，v＝2

    (E) ╳：反例同(C)

    故選(A)(B)'
