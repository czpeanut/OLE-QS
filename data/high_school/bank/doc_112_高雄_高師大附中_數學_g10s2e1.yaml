- id: doc_112_高雄_高師大附中_數學_g10s2e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '巧巧看到報導說：「人的心情會與氣溫呈正相關」。因此巧巧找了 2000 人做調查，她想知道，臺灣人是否也有這種傾向。巧巧將心情量化後的數字命名為心情指數，利用 0 分至 100 分評分，數值越高，表示越開心。調查後，巧巧將氣溫（攝氏）與心情指數的數據分別以 X、Y 表示。得到的相關係數為 0.0314，Y 對 X 的最適直線為 y＝4x－20；另外，若氣溫改為華氏溫標，則以 F 變量表示之。請問下列的推論哪些正確？

    $\left( 註 : 攝氏和華氏溫標的單位換算公式 : 華氏溫標=\frac{9}{5}\times 攝氏溫標+32 \right)$'
  options:
  - label: A
    content: 若將 X、Y 數據標準化後分別得到 X'、Y'，則 Y' 對 X' 的最適直線斜率有可能大於 1
  - label: B
    content: 利用最適直線我們可以預測當氣溫達到攝氏 35 度時，心情指數會達到 120 分
  - label: C
    content: F 與 Y 的相關係數為 0.0314
  - label: D
    content: 設 X 中的第 40 個百分位數為 $P_{40}$，則$\left( \frac{9}{5}\times P_{40}+32 \right)$必為 F 中的第 40 個百分位數
  - label: E
    content: 若 X、Y 的相關係數為 0，表示人的心情與氣溫沒有相關
  explanation: '(A) ╳：標準化資料的最適直線斜率為 r＝0.0314

    (B) ╳：y＝4×35－20＝120，不在 0 至 100 之間

    (C) ○：F＝$\frac{9}{5}$×X＋32 ∴$r_{F，Y}$＝$r_{X，Y}$＝0.0314

    (D) ○

    (E) ╳：$r_{X，Y}$＝0，表示零相關（無線性關係），不是沒有相關

    故選(C)(D)'
