- id: doc_112_彰化_員林_自然_物理_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 根據題幹中的文字，判斷 A 效應與 B 效應分別是什麼？
  options:
  - label: A
    content: 電流的磁效應與電磁感應
  - label: B
    content: 電磁感應與電流的磁效應
  - label: C
    content: 電流的熱效應與電磁感應
  - label: D
    content: 電流的磁效應與電流的熱效應
  - label: E
    content: 電磁感應與電流的熱效應
  group_stem: '無線充電 Qi（中文唸法同氣）逐漸在日常生活中被廣泛的應用，只是充電效率沒有那麼高，所以出現了磁吸充電 MagSafe 的產品，且現今許多手機都搭載著此功能，其原理如下：

    藉由 A 效應所產生的磁場，再透過 B 效應所感應生成的電流來為電子產品充電，這是目前市面上所使用的方式。但這樣的充電方式有優點也有缺點，說明如下：

    缺點：

    ①因為磁吸的關係，所以取下來需要出一點力，所以可能會用到雙手。

    ②儘管充電比 Qi 無線充電快，但整體仍然沒有比使用有線充電快速。

    ③ 15 W 功率無法維持全程輸出，會隨電量、機種有所差異。

    ④可能會干擾「一次性」使用的磁卡消磁，如房卡或停車票卡等。【修改自網路資料】'
  shared_asset: g1_1_3
  answer:
  - A
  answer_status: disputed
  answer_source: agent_fix
  explanation: 充電座線圈通入電流產生磁場，屬於「電流的磁效應」（A 效應）；手機內部線圈因磁場變化而感應生成電流，屬於「電磁感應」（B 效應）。故選(A)。
  tags:
