  answer_status: verified
  answer_source: answer_key
  explanation: '(A)用 MagSafe 充電時，可以解放雙手充電。

    (B)使用無線充電時，不需要用到線材與充電孔，所以不會損耗。

    (C) MagSafe 磁吸充電無法比有線充電快。

    (E)無線充電因為使用磁性相關物質，所以可能會使「一次性」磁卡消磁。'
