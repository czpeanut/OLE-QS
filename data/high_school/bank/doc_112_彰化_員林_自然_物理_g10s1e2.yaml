  group_stem: '無線充電 Qi（中文唸法同氣）逐漸在日常生活中被廣泛的應用，只是充電效率沒有那麼高，所以出現了磁吸充電 MagSafe 的產品，且現今許多手機都搭載著此功能，其原理如下：

    藉由 A 效應所產生的磁場，再透過 B 效應所感應生成的電流來為電子產品充電，這是目前市面上所使用的方式。但這樣的充電方式有優點也有缺點，說明如下：

    缺點：

    ①因為磁吸的關係，所以取下來需要出一點力，所以可能會用到雙手。

    ②儘管充電比 Qi 無線充電快，但整體仍然沒有比使用有線充電快速。

    ③ 15 W 功率無法維持全程輸出，會隨電量、機種有所差異。

    ④可能會干擾「一次性」使用的磁卡消磁，如房卡或停車票卡等。【修改自網路資料】'
  answer:
