- id: doc_112_彰化_員林_自然_物理_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 有一束光通過界面的時候，在界面上發生反射與折射的現象， 如右圖所示，則下列敘述何者正確？
  options:
  - label: A
    content: 界面應為水平的虛線
  - label: B
    content: 界面應為鉛直的虛線
  - label: C
    content: 由圖中可以看出入射角應為 60°
  - label: D
    content: 由圖中可以看出折射角應為 20°
  - label: E
    content: 根據圖形，可以判斷光是從快的介質進入慢的介質
  assets:
  - key: s1_7_f1
    kind: figure
    file: doc_112_彰化_員林_自然_物理_g10s1e2/s1_7_f1.png
    crop:
      page: 2
      rect:
      - 448.4
      - 653.7
      - 564.55
      - 735.75
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '反射角＝入射角，所以 A、B 關係為反射；而折射現象的夾角不超過 90°，所以 B、C 不會是對方的折射線，A 經過界面會折射成 C（或相反）。依上述條件可知，A 為入射線、B 為反射線、C 為折射線。

    (A)(B)垂直的虛線才是界面。

    (C)入射角是入射線與法線的夾角，為 90°－60°＝30°。

    (D)折射角為折射線與法線的夾角，為 90°－20°＝70°。

    (E)當光由慢的介質到快的介質會使折射線遠離法線，所以應為慢的介質到快的介質。'
