- id: doc_111_桃園_武陵_數學_數甲_g12s1e2_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設f (x) 是實係數多項式函數，若a＜c＜d＜b，則下列哪些選項是正確的？
  options:
  - label: A
    content: 若f (x) 在區間［a , b］上嚴格遞增，則f ' (c)＞0
  - label: B
    content: 若f ' (c)＝0，則f (x) 在x＝c處有極值
  - label: C
    content: 若f (x) 在x＝c處有極大值，則f ' (c)＝0
  - label: D
    content: 若f '' (c)＝0，則 ( c , f (c)) 是f (x) 圖形的反曲點
  - label: E
    content: 若f (x) 在x＝c處有極大值，在x＝d處有極小值，則f (c) ≥ f (d)
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：例f (x)＝$x^{3}\Rightarrow$ f ' (x)＝$3x^{2}$，但 f ' (0)＝0。 (B) ×：例f (x)＝$x^{3}\Rightarrow$ f ' (x)＝$3x^{2}$，f '' (x)＝6x $\Rightarrow$ f ' (0)＝0，( 0 , 0 ) 為反曲點 f (x)在x＝0處沒有極值。 (C) ○： (D) ×：例f (x)＝$x^{4}\Rightarrow$ f ' (x)＝$4x^{3}$，但 f ' (x)＝$12x^{2}$ $\Rightarrow$ f '' (0)＝0，( 0 , 0 ) 不是反曲點。 (E) ×：不能確定。 故選(C)。
  tags:
