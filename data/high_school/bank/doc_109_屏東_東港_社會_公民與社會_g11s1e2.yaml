- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 2014年年底，麥當勞宣布為了因應原物料、食材及人力等各項營運成本，決定調漲部分產品價格，例如超值全餐漲價10元；另有部分餐點則酌予降價。假設秀雯在漲價後買了一套超值全餐，且買賣雙方在漲價前後的願售價格與願付價格都一樣，請問相較於漲價前購買，將出現何種變化？
  options:
  - label: A
    content: 經濟福祉減少
  - label: B
    content: 無謂損失增加
  - label: C
    content: 生產者剩餘增加
  - label: D
    content: 消費者剩餘提高
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 假設表格是米血糕市場的需求與供給，請問兩者供需均衡時會出現什麼情形？
  options:
  - label: A
    content: 消費者共花384元買米血糕
  - label: B
    content: 廠商總共賣出30份米血糕
  - label: C
    content: 米血糕的生產者剩餘是40元
  - label: D
    content: 米血糕的消費者剩餘是160元
