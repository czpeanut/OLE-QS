- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 甲、乙覺得G牌電動機車外型夠潮又環保，很想買，但一臺要7萬元，實在「高攀不起」；再告訴他們，政府最近每臺補助3萬，等同只要花4萬就行了。甲聽了高興地說他要去買，乙則仍感嘆買不了。請問下列相關敘述，何者正確？
  options:
  - label: A
    content: 甲對此電動機車的願付價格介於4萬元到7萬元之間
  - label: B
    content: 乙的願付價格因為政府補助而提高，但仍沒有達到4萬元
  - label: C
    content: 政府補助後，甲購買此電動機車能獲得3萬元的消費者剩餘
  - label: D
    content: 補助後，甲花4萬元就能買此電動機車，代表他的願付價格降低
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 枸杞是一種藥食兩用的原料，被視為具有強身健體的功效。然而，2015年臺北市衛生局抽驗超市、量販店、中藥行等處的枸杞，發現其中部分品項的農藥殘留不合格，強制下架銷毀，使枸杞供給下滑；另一方面，消費者人心惶惶，枸杞需求隨之減少。請問在上述事件的影響下，臺北市枸杞市場的均衡價量會有何改變？
  options:
  - label: A
    content: 價格變動不確定，數量減少
  - label: B
    content: 價格變動不確定，數量增加
  - label: C
    content: 價格下跌，數量變動不確定
  - label: D
    content: 價格上漲，數量變動不確定
