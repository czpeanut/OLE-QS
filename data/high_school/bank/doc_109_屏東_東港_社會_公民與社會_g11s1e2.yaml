- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 某新聞臺的特別報導邀請中醫師們談論枇杷對人體的好處，包括有潤肺、咳、止渴等功效。與此同時，臺灣進入暖冬乾旱導致枇杷早熟，生產期全打亂，只開花不授粉，結果率下降至少5成。請問近期枇杷的市場？
  options:
  - label: A
    content: 均衡價格不定，均衡數量增加
  - label: B
    content: 均衡價格上升，均衡數量不定
  - label: C
    content: 均衡價格下降，均衡數量不定
  - label: D
    content: 均衡價格不定，均衡數量減少
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 臺灣牛肉布場的供給大部分來自國外。如果國外爆發狂牛症疫情，我國政府會建議消費者少吃牛肉，同時禁止牛肉進口，則未來臺灣牛肉市場的供需及牛肉價格會有什麼變化？
  options:
  - label: A
    content: 供給線右移，需求線左移，價格上升
  - label: B
    content: 供給線左移，需求線左移，價格上升
  - label: C
    content: 供給線左移，需求線右移，價格下跌
  - label: D
    content: 供給線左移，需求線左移，價格的變化則不確定
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 阿婷是佛心商店的常客，某天她來到商店購買一把定價159元的高級剪刀，老闆看在熟客，直接去零頭，算她150元。若在折價前後需求與供給並未變動，請問：相較折價前購買，將出現何種變化？
  options:
  - label: A
    content: 生產者剩餘增加
  - label: B
    content: 經濟福祉增加
  - label: C
    content: 消費者剩餘增加
  - label: D
    content: 無謂損失增加
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 旅遊網站公布臺灣機票「2018最佳訂票時機」大數據報告，資料顯示11月因為是一年中整體相對．較少旅遊活動的時段，為臺灣全年平均機票價格最低的月份，均可節省16.5％；7月時則因為正值暑假旺季，故成為全年機票價格最高的月份，比平均票價高出20.4％。根據上述資料，假設機票供給不變，以下對機票市場的分析何者正確？
  options:
  - label: A
    content: 7月時市場均衡數量減少
  - label: B
    content: 7月時市場均衡數量增加
  - label: C
    content: 11月時市場均衡數量不變
  - label: D
    content: 11月時市場均衡數量增加
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 國內蒜頭價格近期不斷飆出「天價」，政府要求業者必須將價格調回漲價前的價格，且不得上漲。請問，下列關於此凍漲措施對市場帶來的影響下列何者敘述最為正確？
  options:
  - label: A
    content: 會提高生產者剩餘，同時維持經濟效率水準
  - label: B
    content: 會降低消費者剩餘，且也會降低生產者剩餘
  - label: C
    content: 會提高消費者剩餘，也將帶動提高經濟效率
  - label: D
    content: 會降低生產者剩餘，且未必能達到經濟效率
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 2015年，美國司法單位對多家航空公司展開調查。官員表示，這些航空公司近期一同限制航線與機位數量，並使票價維持高檔，獲利創下歷史新高，可能涉及違法的聯合行為。若從經濟學的角度來看待政府介入航空公司的「合作行為」，下列何種說法最為合理？
  options:
  - label: A
    content: 航空公司相互合作，政府無須干預，因為市場機能會使經濟福祉最大化
  - label: B
    content: 政府應遵循私法自治原則，維護航空公司的契約自由，不干涉合作行為
  - label: C
    content: 市場機能有賴自由競爭，若航空公司合作會妨礙競爭，則政府有必要介入
  - label: D
    content: 航空公司獲利增加有害消費者，因此政府應該介入規定機票的價格與數量
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 當政府欲以公權力對市場機制作出限制時，往往會使用制定價格上下限的方式運作。有關此種制定價格限制的力式與後續影響，下列何者正確？
  options:
  - label: A
    content: 會想要制定價格上限，是因為認為均衡價格過高
  - label: B
    content: 會想要制定價格下限，是因為認為均衡價格過高
  - label: C
    content: 只有制定價格上限後，會對社會產生無謂損失，價格下限剛不會
  - label: D
    content: 制定價格下限後，市場成交量會少於原先均衡，價格上限則不會
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 為抑制物價上漲，阿根廷政府宣布凍結物價2個月。政策推出後，首都布宜諾斯艾利斯的超市已經買不到麵包、麵粉和糖，附近的城市也開始面臨油和茶葉短缺的問題，請問下列何者是抑制物價的可能結果？
  options:
  - label: A
    content: 廠商預期物價暫時受限，會促銷產品
  - label: B
    content: 壓低物價可造成搶購，進而刺激生產
  - label: C
    content: 市場存在超額需求，結束凍漲才可能改善
  - label: D
    content: 市場機能會自動調節，最終達到供需相等
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 在民間關注海洋塑膠汙染與禁塑民意的推動下，我國環保署訂定「限用一次性塑膠吸管」的政策，自2019年7月起，公部門、公私立學校、百貨公司及連鎖速食店等共8千家業者不得提供內用者一次性塑膠吸管。請問根據上述內容，政府主要是想透過何種方式處理何種問題？
  options:
  - label: A
    content: 透過直接管制的方式解決外部成本
  - label: B
    content: 透過價格上限的方式解決供不應求
  - label: C
    content: 透過資訊公開的方式解決無謂損失
  - label: D
    content: 以課徵皮古稅的方式提升經濟福祉
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 價格管制的歷史其實非常悠久，從4千多年前的巴比倫、埃及及古希臘，都有文獻記載當時統治者進行價格管制的相關措施。如古希臘就曾對糧食進行價格管制，甚至有「檢查隊」檢查是否賣得太貴，如果高於法律規定的價格，就須處以死刑。有關上文敘述，下列選項何者正確？
  options:
  - label: A
    content: 古希臘當時制定的為價格下限
  - label: B
    content: 人們可能冒險私下交易形成黑市
  - label: C
    content: 統治者的管制可最大化經濟福祉
  - label: D
    content: 此制度可能會導致糧食過度生產
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 英國運輸部科學諮詢委員會於2020年6月提交報告指出，免費送貨或退貨服務，導致消費者網購量大增，以2018年12月「黑色星期五」及感恩節長假活動為例，退貨總額高達24億英鎊，因此，建議向所有網購消費者強制徵收費用，以緩解網購送貨激增導致的汙染，該建議是希望透過下列何項方式，解決環境問題？
  options:
  - label: A
    content: 直接管制
  - label: B
    content: 公開資訊
  - label: C
    content: 界定權利
  - label: D
    content: 課徵皮古稅
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 部分餐飲業私下將廢水排入水溝，又隨著河川流入大海，業者絲毫不需要負擔任何成本，引發市場失靈。請問相較於經濟福祉最大化時，上述情形對供需市場會造成何種影響？
  options:
  - label: A
    content: 產品產量過多，價格過高
  - label: B
    content: 產品產量過少，價格過高
  - label: C
    content: 產品產量過多，價格過低
  - label: D
    content: 產品產量過少，價格過低
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 基本工資的訂定與修改是一門很大的學問，該國勞動部長所謂的「往調升方向努力」，應該是指？
  options:
  - label: A
    content: 降低價格下限
  - label: B
    content: 提高價格上限
  - label: C
    content: 降低價格上限
  - label: D
    content: 提高價格下限
  group_stem: 圖為某國勞動市場的供給需求圖，該國勞動部長表示，雖然2019年全球景氣趨於疲緩，但基本工資依然必須往調升方向努力。經過該國基本工資審議委員會討論，決議基本工資月薪由目前23,800元調升至24,000元，時薪由158元調升至160元，預訂自2021年1月1日生效。
  shared_asset: g1_18_19
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: 自從2021年1月1日開始，下列有關該國勞動市場的敘述何者<u>錯誤</u>？
  options:
  - label: A
    content: 消費者剩餘面積為A
  - label: B
    content: 生產者剩餘面積為B＋C＋D
  - label: C
    content: 此市場因政府的價格管制，而產生無謂損失
  - label: D
    content: 使消費者剩餘減少，其減少面積稱作「無謂損失」
  group_stem: 圖為某國勞動市場的供給需求圖，該國勞動部長表示，雖然2019年全球景氣趨於疲緩，但基本工資依然必須往調升方向努力。經過該國基本工資審議委員會討論，決議基本工資月薪由目前23,800元調升至24,000元，時薪由158元調升至160元，預訂自2021年1月1日生效。
  shared_asset: g1_18_19
- id: doc_109_屏東_東港_社會_公民與社會_g11s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 3
  stem: 金門保價收購牛隻。與下列哪一項政府介入市場的方式最為類似？
  options:
  - label: A
    content: 美國政府曾實施機票管制，以確保航空公司獲利
  - label: B
    content: 法國政府曾實施房租管制，以增進租屋族的福祉
  - label: C
    content: 臺灣疫情解封，臺鐵採限量管制，恢復販售站票
