- id: doc_111_新北_新店_自然_物理_g10s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 科學家積極研發能源有效利用的技術，例如抽蓄水力發電，就是利用離峰時間的多餘電力，將水抽蓄至較高處的方式，以儲存能量，再供尖峰時間使用。我國明潭抽蓄水力發電廠以日月潭為上池，以水里溪河谷為下池，利用兩池之間約400公尺的水面落差，進行抽蓄水力發電，供應臺灣尖峰電力需求，由於下池蓄水量極為豐沛，上下池水面落差可視為定值。水力發電機組的總容量為200萬瓩（2×$10^{9}$瓦），是世界上巨型抽蓄水力發電廠之一，那麼抽蓄水力發電，其能量轉換主要的過程為下列何者？
  options:
  - label: A
    content: 電能→水的位能→水的動能→電能
  - label: B
    content: 電能→水的動能→水的位能→電能
  - label: C
    content: 水的動能→化學能→水的位能→電能
  - label: D
    content: 電能→化學能→水的動能→電能
  - label: E
    content: 化學能→水的位能→水的動能→電能
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: PH-1-5-1
      book: 物理（全）
      chapter: 能量
      title: 能量的形式
      std: true
    textbook: 物理（全） 能量的形式
    pattern:
      key: PH-1-5-1:T06
      name: 各種能量形式與轉換過程辨識
    labeled_by: agent
    label_confidence: high
    label_note: 選項A箭號「→」誤植為「－」
    fixed_by: agent
    fix_note: （人工修正：修正選項A箭號錯字並補全解析）
  difficulty: 1
  explanation: 抽蓄發電於離峰時利用多餘電能將水抽至上池儲存為水的位能，尖峰時放水使水的位能轉為水的動能推動渦輪機，再轉換為電能。故選(A)。
- id: doc_111_新北_新店_自然_物理_g10s1e3_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 物理學上有「能量守恆」的原理，我們也常聽到「能源危機」的議題，下列敘述何者正確？
  options:
  - label: A
    content: 「能量守恆」只有在特殊情況下才成立，一般來說，能量愈用愈少，總有用完之時，故有「能源危機」
  - label: B
    content: 「能量守恆」表示總能量不會減少，故能量是用不完的，所以「能源危機」只是勸人節省的口號而已
  - label: C
    content: 能量在使用中相互轉換，其總值會減少，故有「能源危機」
  - label: D
    content: 「能量守恆」總是成立的，但是被用來發電、行車的汽油與煤，用過之後變成廢氣和熱能，不易再使用，故有「能源危機」
  - label: E
    content: 「能源守恆」總是成立的，當能源轉成能量時，用過變成廢氣和熱能，不過還是可以再使用，故不會有「能源危機」
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
