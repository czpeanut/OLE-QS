  type: single
  page: 1
  stem: '資料一：四社番的風俗習慣原本與生番沒有不同，他們沒有時間觀念，也沒有姓氏。清朝乾隆年間，四社番經招撫歸順清朝政府，當時地方政府派姓潘、金、劉的官員入山招撫，受潘官招撫的原住民從此姓潘，同理，受金官招撫者一律姓金；受劉官招撫者則姓劉。

    資料二：當有人過世時，必須請尪姨到家裡，在過世者面前祝禱，請靈魂附在自己身上以告訴親人自己的死亡原因……如果自己家裡就有尪姨，也必須請其他尪姨來擔任這項任務。除此之外，四社番的葬禮風俗均與閩人相同。

    以上兩則資料是關於四社番的敘述，請問下列選項何者正確？'
  options:
  - label: A
    content: 四社番應屬於西拉雅族
  - label: B
    content: 獲得姓氏象徵四社番成為生番
  - label: C
    content: 四社番中姓劉的住民們彼此具有血緣關係
  - label: D
    content: 四社番已經全然喪失自己的風俗
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 四社番已經歸順清廷，應為熟番，(A)為正解。(B)已獲得姓氏，代表其為熟番。(C)姓劉的住民代表為受劉官招撫者，彼此間不一定具有血緣關係。(D)資料二指出尪姨在過世者面前祝禱的葬禮習俗即為四社番自己的風俗。
