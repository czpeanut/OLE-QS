- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 19 世紀初，有一位中國文人來到臺灣，記錄其所見所聞如下：「臺灣多山，山地區域多是一片未開發的混沌，生番常常出沒於山地。移民來臺開墾之初，常常遇到生番獵取人頭，淡水廳同知潘凱就是被生番殺害。為了防範生番，移民們合力建築隘寮，取名叫大隘。閩粵二籍的移民合力開墾，番禍才稍稍停息。為了取賺錢的好兆頭，會計本上多以『金』字開頭，然後取廣東的『廣』、福建的『福』，名為『金廣福大隘』。」關於這段資料，下列何者敘述正確？
  options:
  - label: A
    content: 臺灣山區的未開發是因政府為保護山林資源而禁獵
  - label: B
    content: 資料中的「生番」為歸順清朝政府的原住民
  - label: C
    content: 因為金廣福墾號的成功，使漢人得以立足蘭陽平原
  - label: D
    content: 移民們透過跨越省籍的合作，成功防禦生番
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)早期山區未開發是因為清廷避免漢人與番人勾結，使用土牛界線隔絕番漢。(B)「生番」指未歸順清廷的原住民。(C)金廣福墾號開發的地點為新竹東南山區，非蘭陽平原。
