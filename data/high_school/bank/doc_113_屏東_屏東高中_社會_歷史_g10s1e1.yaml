- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e1_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 某博物館展出馬紹爾的舷外浮桿舟（外有浮桿的一種獨木舟），也展出斐濟、菲律賓、紐西蘭等地類似形狀的船，達悟族的拼板舟也在其中。關於此展覽的敘述與推斷，下列何者正確？
  options:
  - label: A
    content: 船隻形狀類似是因為都在同一個地方製造
  - label: B
    content: 這些船隻只能用於湖泊航行
  - label: C
    content: 該博物館的主題應該是歐亞大陸之間的人類遷徙
  - label: D
    content: 臺灣位於此文化圈的最北邊
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '題文所述地點皆為南島語族分布區域，因此答案為(D)。(A)船隻形狀類似是因為同屬南島語族，有近似的文化。(B)南島語族向海外的遷移擴散，即是使用船隻。(C)南島語族主要分布在大洋洲、東南亞一帶，並非在歐亞大陸之間遷徙。

    6.1946 ～ 1952 年間，經歷國共內戰失利後，1949 年前後約百萬軍民隨著國民政府遷移來臺，是造成此時期臺灣人口大量激增的主要原因，(D)為正解。

    7.康熙年間，臺灣兩性人數差距甚大的主因，與政府的《渡臺禁令》規定移民單身來臺有關，造成男多女少比例嚴重失衡現象，答案為(C)。

    8.總督府整理了臺灣歷代統治者的理蕃政策與措施，顯然是藉由前人的經驗成果作為未來施政的參考，因此答案為(C)。

    9.(A)資料一指責莫那．魯道忘記內地文化的行為，顯見為當時總督府的立場。(C)資料三主張應從速將相關高級官吏撤職，顯示並不認同當時的理蕃政策。(D)資料一並未同情賽德克族。

    10.從「南洋」、「姐妹會」等關鍵詞，可推知此新移民應與來自東南亞的(C)外籍配偶有關。

    11.題文資料敘述為西班牙人針對北臺灣原住民族的記載，文中的金包里人應為(B)馬賽族人。(A)居於南臺灣。(C)居於外島蘭嶼。(D)居於東臺灣。

    12.從許多人為規避出國前的種種程序，選擇先前往日本再轉往中國，可見(B)旅券無法完全掌握臺灣人往日本流動的情況。(A) 1908 年後，臺灣人到日本不必申請許可。(C)日治初期，滿洲國尚未成立。(D)臺灣人最常造訪的海外地區為廈門等中國沿海地區。

    13.(A)從「以公司為領主」一句，可知應為荷蘭統治時期的東印度公司。(B)荷蘭實施「地方會議」制度，要求各社長老參加集會，再授予長老藤杖以示歸順荷蘭。(D)「文明化歷程」指原住民放棄原有的宗教與生活習俗，逐漸接受基督教信仰的教化。

    14.(A)撒奇萊雅族文化並未完全被同化或消失，故能於 2007 年獲得正名。(B)撒奇萊雅族有其獨特的族語，與阿美族語不同。(C)日治時代的分類將撒奇萊雅族歸類於阿美族，顯見並不合乎原住民自身認同。

    15.(A)〈職貢圖〉、〈番社采風圖〉皆為官方繪製，非民間私繪。(B)這些圖像頗能反映當時原住民的生活情形，因此成為今人理解當時臺灣原住民的重要資料。(C)圖像中的熟番已穿著漢人的服飾。

    16.(A)澎湖為明帝國版圖，並未長期落入荷蘭聯合東印度公司的控制。(B)明帝國的海禁政策並非針對鄭成功，也與其占領臺灣無關。(D)雖然明帝國實施海禁，西方國家仍能經由走私管道或與海商集團貿易，取得中國商品。

    17.(A)西拉雅族屬於母系社會。(C)祭祖時焚燒香與金紙為漢人的習俗。(D)由女性的尪姨負責祭祀活動。

    18.題文所述為(D)劃界封山政策，目的在將漢人與番民隔離，除欲減少漢番衝突外，更可避免漢番勾結作亂。

    19.從死者的籍貫來看，可知應為榮民身分，答案為(A)。(B)興建公路的目的在改善臺灣東西橫貫的交通，非延續日治時期的理蕃政策。(C) 1989 年才開放外籍移工，與此事件無關。(D)此案為工安意外，與省籍情結無關。

    20.《異域》一書描述滯緬國軍的故事，答案為(C)中緬邊境。

    21.(A)傳說吳鳳原為番地通事，為消弭鄒族原住民的獵首習俗，不惜犧牲自己的性命去感化當地原住民。此傳說後經日治時期與戰後國民政府以教育宣傳後，獵首成為對原住民族的刻板印象。

    22.日治時期，總督府欲開發臺灣後山地區，除建立日人移民村外，也鼓勵西部漢人東移，部分桃竹苗的客家人即於此時移往花蓮地區，答案為(D)。(A)官營移民地為日本人設置，非客家人。(B)清領前期的閩客械鬥導致客家人移往桃竹苗，非臺灣東部。(C)臺灣為日本的殖民地，不可能有大量本土企業。

    23.從「因戰事關係，來臺軍隊眾多」一句，可推知應為國共內戰後，大量軍隊隨國民政府遷臺，故需要「請政府全盤計畫」，因此答案為(D)。(A)二二八事件後，政府並未派遣大量軍隊來臺，且當時也做不到「省民應盡歡迎慰勞之誼」。(B)接收初期主要為陳儀所部，並無大量軍隊來臺。(C)臺灣宣布戒嚴時，陳誠的軍隊乃為政府即將遷臺做各項準備，並非來臺剿共。

    24.題文所述，日軍在瑯嶠登陸時，詢問當地人的問題皆在強調臺灣府是否實質統治該地，即可主張「番地無主」以與清廷談判，因此答案為(C)。

    25.(A)藍線取代紅線，代表漢人侵墾原住民的土地，使其生存空間更為限縮。(B)封山政策完全無法阻隔漢人的侵耕越墾。(C)土牛紅線以隔離「生番」為主。

    26.總督府的做法為「將日本移民與農村拓殖作結合」，意即鼓勵農業移民，因此答案為(C)。(A)首要移入地區為臺灣東部。(B)以農業移民為主。(D)西部早已開發，應是以東部為主。

    27.從題文敘述可推知小君的奶奶為本省人，家人反對她與外省人結婚，應與(B) 228 事件後的省籍情結對立有關。(A)漳州人與泉州人皆來自福建，非外省人。(C)從題文敘述中，可知家人反對的原因並非自由戀愛。(D)小君的爺爺為外省人，並非東南亞移工。

    28.(D) 1983 年創刊的《高山青》強調原住民族自救，拉開臺灣原權運動的序幕。

    29.(A)臺灣首座孔廟於鄭氏時期建立。(C)豐臣秀吉遣使要求臺灣原住民族朝貢。(D)將荷蘭聯合東印度公司驅離臺灣的是鄭成功。

    30.新港文字為荷蘭人以羅馬拼音拼寫西拉雅族的語言，目的在便於傳教，並且一直沿用至清朝初期，因此正確答案為(B)。

    31.1853 年艋舺地區發生(A)頂下郊拚，械鬥落敗的「下郊」族群則帶著鄉土神遷往大稻埕地區落腳，建立「霞海城隍廟」。

    32.(A)後期的官營移民村仍以農業為主要產業。(B)初前的官營移民村經營十分辛苦，因此政策曾停滯一段時期。(C)初期的官營移民村主要在花蓮、臺東一帶。

    33.(甲)為日治時期；(乙)為清領時期；(丙)為荷治時期，因此時間先後順序為(D)丙乙甲。

    34.表格僅(D)丁領導階層敘述正確，其餘三者皆順序顛倒。

    35.清初將可能危害臺灣治安的危險人士遷回大陸，使得臺灣一度出現「人去業荒」情形。至道光年間，臺灣人口已高達 25 倍之多，除了清廷開放已渡臺者可將大陸眷口遷移來臺外，最主要是(D)民間偷渡之風盛行，使臺灣人口高速成長。

    36.17 世紀初統治滬尾（淡水）與雞籠（基隆）的政權為(D)西班牙。

    37.由於漢人或以武力圍剿，或以金錢取得，皆造成原住民族被迫放棄居住地，使平埔族群退至近山地帶，西拉雅族即於 19 世紀末南遷，再移居臺東、花蓮，因此答案為(C)。

    38.「莎韻之鐘」的故事發生於 1938 年，一名泰雅族少女替日本籍教師挑運行李時，失足溺水，經刻意報導後，成為總督府宣揚原住民理蕃政策成功的宣傳，並成為皇民化政策的宣傳樣本，因此答案為(C)。

    39.從官隘人數愈來愈多，民隘人數則減至為 0，可知隘防政策已由民間轉為官方主導，因此答案為(B)。(A)(C)(D)三者皆無法從隘勇人數看出。

    40.題文所述為荷蘭時期的地方會議，因此正確答案為(A)。(B)此時為荷治時期，並非清領時期。(C)地方會議係針對原住民的管理方式。(D)會議中授予藤杖給村社首長，象徵部落歸順荷蘭。

    41.巴達維亞、熱蘭遮城皆為荷蘭統治的地名，因此答案為(B)荷蘭聯合東印度公司東亞貿易紀實。

    42.題文所述為沈葆楨與日本針對牡丹社事件所簽訂的條約，正確答案為(A)。(B)由於日本以臺灣番地無主為由生事，中國已於條約中表明會約束生番，不再是「番地無主」。(C)應是琉球漁民。(D)大甲西社事件發生於清初雍正年間，與此事無涉。

    43.此修業證書提及「高砂特別義勇隊」，可知應與太平洋戰爭爆發後，日本在臺徵集原住民組織的「高砂義勇隊」有關，答案為(C)。

    44.資料二提到 1930 年的某事件導致總督府高層總辭，可推知為霧社事件，選項中與霧社事件相關的正確敘述為(C)。(A)大規模的集團移住實施於事件之後。(B)「味方蕃」指親日蕃，即衝突事件中協助政府、軍方或警察的原住民，顯然賽德克族並不是味方蕃。(D)在大嵙崁設立撫墾總局者是清朝的劉銘傳。

    45.從 1930 ～ 1942 年的山地原住民部落分布圖與資料一的文字說明，可以得知許多山區的原住民被移到山腳地帶，因此(D)為正確答案。(A)強制移住的結果，各部落的生活樣貌出現明顯變化。(B)從資料二的敘述中，可得知優先移住的對象條件並非對統治者友善與否，而是該村社的地形陡峭、農耕粗放程度。(C)移住時並未顧及社會網絡的完整性，甚至將敵對的原社合併於一處，加上經濟生活樣貌改變，難以維持各族的文化獨特性。'
