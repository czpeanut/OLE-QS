- id: doc_113_屏東_屏東高中_社會_歷史_g10s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 政府成立「大陳地區反共義胞來臺輔導委員會」，以統合所有的安置過程。大陳義胞來到臺灣後，首先接送到基隆市所設置的臨時招待所居住，做為初步安置，並開始選定大陳新村的位置，處理相關土地與房舍事宜。後來政府決定將移民安置在宜蘭縣、花蓮縣、臺東縣、高雄縣、屏東縣、臺北縣、基隆市、桃園縣、新竹市、南投縣、臺南市、高雄市等十二個縣市，建立三十五個大陳新村供其居住。大陳新村應大量建立於何時？
  options:
  - label: A
    content: 1920 年代
  - label: B
    content: 1930 年代
  - label: C
    content: 1950 年代
  - label: D
    content: 1970 年代
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C) 1955 年，中共對浙江一江山島與大陳島展開攻勢，在一江山島被中共占領後，國民政府決定撤離大陳島軍民，將移民安置在各地的「大陳新村」。
