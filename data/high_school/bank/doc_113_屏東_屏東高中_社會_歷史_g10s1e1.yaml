  stem: 小米是許多原住民族的主食，栽種小米時多半有所禁忌。例如阿美族就認為小米具有靈性，播種前必須舉行祭典通知小米精靈；播種前一天禁止碰觸魚類；在搬運小米時也不能嫌重，否則小米精靈會不高興地跑走。根據上述內容何者敘述正確？
