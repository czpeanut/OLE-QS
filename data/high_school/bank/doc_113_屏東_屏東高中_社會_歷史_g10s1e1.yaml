  stem: 關於某項制度的描述：「承包商為了壟斷交易，會盡全力把其他漢人趕出村社，這點讓公司輕易達成管制漢人的目標，每年的標金也可創造高額利潤。另一方面，因承包商壟斷交易，便可漫天要價出售商品，而原住民被迫以低價出售鹿製品，因此抱怨物價暴漲。」關於上述制度，以下哪一解釋最為合適？
  options:
  - label: A
    content: 開始此制度的為西班牙人
  - label: B
    content: 與承包商交易的原住民族應該以馬賽族為主
  - label: C
    content: 承包商的權利是透過公開標售而來
  - label: D
    content: 此制度有利於漢人和原住民的和諧
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題文所描述的制度為贌社制度，答案為(C)。(A)荷蘭人所創始。(B)原住民族為南臺灣的西拉雅族。(D)此制度造成原住民被漢人承包商剝削，原漢關係趨於緊張。
