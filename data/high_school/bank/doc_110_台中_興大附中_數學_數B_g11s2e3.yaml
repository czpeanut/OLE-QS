  stem: 設 $A$ 和 $B$ 為獨立事件且 $P(A)=\frac{1}{3}$，$P(A'\cap B')=\frac{2}{5}$，則下列何者正確？
  options:
  - label: A
    content: $P(B) = \frac{2}{5}$
  - label: B
    content: $P(A\mid B) = \frac{1}{3}$
  - label: C
    content: $P(B'\mid A) = \frac{3}{5}$
  - label: D
    content: $P(B'\mid A') = \frac{3}{5}$
  - label: E
    content: $P(A'\mid B) = \frac{1}{3}$
  answer:
  - A
  - B
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵A，B 獨立

    ∴A''，B'' 獨立

    故 P（A''∩ B''）＝P（A''）×P（B''）

    ⇒$\frac{2}{5}$＝$\left( 1-\frac{1}{3} \right) \times ( 1 -P (B ) )$

    ⇒ P(B)＝$\frac{2}{5}$

    (B)○：P（A｜B）＝P(A)＝$\frac{1}{3}$

    (C)○：P（B''｜A）＝P（B''）＝$\frac{3}{5}$

    (D)○：P（B''｜A''）＝P（B''）＝$\frac{3}{5}$

    (E)╳：P（A''｜B）＝P（A''）＝$\frac{2}{3}$

    故選(A)(B)(C)(D)'
