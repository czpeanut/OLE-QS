- id: doc_110_台中_興大附中_數學_數B_g11s2e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 設 $A, B$ 為樣本空間 $S$ 中的兩事件，若 $P(A)=\frac{1}{2}$，$P(A\cup B)=\frac{3}{4}$，$P(B')=\frac{5}{8}$，則 $P(A\mid B) =$？
  options:
  - label: A
    content: $\frac{1}{3}$
  - label: B
    content: $\frac{1}{4}$
  - label: C
    content: $\frac{1}{5}$
  - label: D
    content: $\frac{2}{3}$
  - label: E
    content: $\frac{3}{4}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 'P(B)＝1－P（B''）＝$\frac{3}{8}$

    又 P（A∪B）＝P(A)＋P(B)－P（A∩B）

    ⇒$\frac{3}{4}$＝$\frac{1}{2}$＋$\frac{3}{8}$－P（A∩B）

    ⇒ P（A∩B）＝$\frac{1}{8}$

    故 P（A｜B）＝$\frac{P (A\cap B)}{P (B)}$＝$\frac{\frac{1}{8}}{\frac{3}{8}}$＝$\frac{1}{3}$

    故選(A)'
