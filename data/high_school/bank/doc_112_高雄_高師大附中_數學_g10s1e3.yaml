- id: doc_112_高雄_高師大附中_數學_g10s1e3_s1_1
  section: 1
  number: 1
  type: multiple
  page: 1
  stem: 設 f（x）除以 ax－b（a，b≠0）之商式為 Q（x），餘式為 r，則下列何者正確？
  options:
  - label: A
    content: $f\left( \frac{x}{a} \right)$除以 x－b 之商式為$Q\left( \frac{x}{a} \right)$，餘式為 r
  - label: B
    content: f（bx）除以 ax－1 之商式為 bQ（bx），餘式為 r
  - label: C
    content: f（x）除以 2x－$\frac{2b}{a}$之商式為 2Q（x），餘式為 r
  - label: D
    content: xf（x）除以 ax－b 之商式為 xQ（x），餘式為 rx
  - label: E
    content: $b^{2}$f（ax）除以 ax－$\frac{b}{a}$之商式為 $ab^{2}$Q（ax），餘式為 $ab^{2}$r
  answer:
  - A
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '由題目可知 f（x）＝（ax－b）Q（x）＋r

    (A) ○：將 x 改為$\frac{x}{a}$，得

    $f\left( \frac{x}{a} \right)$＝$\left( a \cdot \frac{x}{a}-b \right) Q\left( \frac{x}{a} \right)$＋r

    ＝（x－b）$Q\left( \frac{x}{a} \right)$＋r

    可得$f\left( \frac{x}{a} \right)$除以 x－b 之商式為$Q\left( \frac{x}{a} \right)$，餘式為 r

    (B) ○：將 x 改為 bx，得

    f（bx）＝（a．bx－b）Q（bx）＋r

    ＝（ax－1）〔bQ（bx）〕＋r

    可得 f（bx）除以 ax－1 之商式為 bQ（bx），餘式為 r

    (C) ╳：原式可改為 f（x）＝$\left( 2x-\frac{2b}{a} \right)\left[ \frac{a}{2}Q(x) \right]$＋r

    可得 f（x）除以$2x-\frac{2b}{a}$之商式為$\frac{a}{2}$Q（x），餘式為 r

    (D) ╳：原式兩側同乘以 x 可得

    xf（x）＝（ax－b）（xQ（x））＋rx

    又 rx＝（ax－b）．$\frac{r}{a}+\frac{br}{a}$，

    故 xf（x）＝（ax－b）（xQ（x））＋（ax－b）．$\frac{r}{a}+\frac{br}{a}$

    ＝（ax－b）$\left[ xQ (x)+\frac{r}{a} \right]$＋$\frac{br}{a}$

    可得 xf（x）除以 ax－b 之商式為 xQ（x）＋$\frac{r}{a}$，餘式為$\frac{br}{a}$

    (E) ╳：將 x 改為 ax，再將兩側同乘以 $b^{2}$ 可得

    $b^{2}$f（ax）＝〔（a．ax－b）Q（ax）＋r〕$b^{2}$

    ＝$\left( ax-\frac{b}{a} \right)$〔$ab^{2}$Q（ax）〕＋$b^{2}$r

    可得 $b^{2}$f（ax）除以$ax-\frac{b}{a}$之商式為 $ab^{2}$Q（ax），餘式為 $b^{2}$r

    故選(A)(B)'
