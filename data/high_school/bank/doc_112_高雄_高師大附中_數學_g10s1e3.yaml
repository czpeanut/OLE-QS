  stem: 甲、乙兩生練習計算三次多項式 f（x）除以一次多項式 g（x）的餘式。已知 f（x）的三次項係數是－3，一次項係數是－27，甲生在計算時把 f（x）的三次項係數錯看成 3（其他係數沒看錯），乙生在計算時把 f（x）的一次項係數錯看成 27（其他係數沒看錯）。而甲生和乙生算出來的餘式剛好一樣，試問 g（x）可能等於哪些一次式？
  options:
  - label: A
    content: x
  - label: B
    content: x－2
  - label: C
    content: x＋2
  - label: D
    content: x－3
  - label: E
    content: x＋3
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
- id: doc_112_高雄_高師大附中_數學_g10s1e3_s1_4
  section: 1
  number: 4
  type: multiple
  page: 1
  stem: 設 $ax^{2}$＋bx＋c＞0 解為－2＜x＜1，則下列何者正確？
  options:
  - label: A
    content: c＝－2
  - label: B
    content: b＝1
  - label: C
    content: $ax^{2}$＋bx＋c＝0 之兩根為－2，1
  - label: D
    content: a（x＋2）$^{2}$＋b（x＋2）＋c＞0 之解為 0＜x＜3
  - label: E
    content: （2a－b）$x^{2}$＋（2b－c）x＋（c－3a）＞0 之解為 x＜－5 或 x＞1
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '∵－2＜x＜1$\Leftrightarrow$（x＋2）（x－1）＜0

    $\Leftrightarrow$a（x＋2）（x－1）＞0，此時 a＜0

    ∴$ax^{2}$＋bx＋c＝a（x＋2）（x－1）

    (A) ╳：不一定

    (B) ╳：不一定

    (C) ○：由 $ax^{2}$＋bx＋c＝a（x＋2）（x－1）可知兩根為－2，1

    (D) ╳：由 $ax^{2}$＋bx＋c＞0 之解為－2＜x＜1

    可知 a（x＋2）$^{2}$＋b（x＋2）＋c＞0 之解為－2＜x＋2＜1 ⇒－4＜x＜－1

    (E) ╳：由 $ax^{2}$＋bx＋c＝a（x＋2）（x－1）＝$ax^{2}$＋ax－2a

    可知 b＝a，c＝－2a，且 a＜0

    故所求為

    $ax^{2}$＋4ax－5a＞0

    ⇒ $x^{2}$＋4x－5＜0

    ⇒（x＋5）（x－1）＜0 ⇒－5＜x＜1

    故選(C)'
- id: doc_112_高雄_高師大附中_數學_g10s1e3_s1_5
  section: 1
  number: 5
  type: multiple
  page: 2
  stem: 設 f（x）為二次多項函數，且知 f（－1）＝－16，f（－6）＝f(2)＝14，若三次多項式 g（x）＝（x＋2）f（x），試選出正確選項。
  options:
  - label: A
    content: f（x）的最大值為－18
  - label: B
    content: f（x）＝0 有兩個負實根
  - label: C
    content: f（－3）＜f(2)
  - label: D
    content: y＝g（x）在 x＝－2 附近的一次近似為 y＝－18x－36
  - label: E
    content: 當 x＝0.001 時，g（0.001）的近似值為－36.018（四捨五入取至小數點後第三位）
  answer:
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '由 f（－6）＝f(2)＝14，可設 f（x）＝a（x＋6）（x－2）＋14

    又 f（－1）＝－16，故－16＝a．5．（－3）＋14 ⇒ a＝2

    ⇒ f（x）＝2（x＋6）（x－2）＋14＝$2x^{2}$＋8x－10

    (A) ╳：f（x）＝$2x^{2}$＋8x－10＝2（$x^{2}$＋4x＋4）－18＝2（x＋2）$^{2}$－18

    ∴f（x）有最小值為－18

    (B) ╳：f（x）＝$2x^{2}$＋8x－10＝2（x＋5）（x－1），

    由 f（x）＝0 可得 x＝－5 或 1，有一正根一負根

    (C) ○：f（－3）＝2．（－3）$^{2}$＋8．（－3）－10＝－16，f(2)＝2．$2^{2}$＋8．2－10＝14

    故 f（－3）＜f(2)

    (D) ○：g（x）＝（x＋2）f（x）＝（x＋2）〔2（x＋2）$^{2}$－18〕

    ＝2（x＋2）$^{3}$－18（x＋2）

    ∴在 x＝－2 附近的一次近似為 y＝－18（x＋2）＝－18x－36

    (E) ╳：g（x）＝2（x＋2）$^{3}$－18（x＋2）＝$2x^{3}$＋$12x^{2}$＋6x－20

    故 g（0.001）≈ 6（0.001）－20＝－19.994

    故選(C)(D)'
