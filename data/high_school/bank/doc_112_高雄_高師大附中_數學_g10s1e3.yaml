  stem: 二次函數 f（x）滿足 f（3＋t）＝f（3－t），其中 t 為任意實數，且 f(1)＝－3，f(2)＝3，若 0 ≤ x ≤ 4 的範圍中 f（x）的最大值為 M，最小值為 m，求 M－m＝＿＿＿＿。
  answer:
  - '18'
  answer_status: verified
  answer_source: answer_key
  explanation: '∵f（3＋t）＝f（3－t）

    ∴x＝3 為 y＝f（x）之對稱軸

    可設 f（x）＝a（x－3）$^{2}$＋b

    ∵$\begin{cases}-3 =f(1)= 4a+b \\ 3 =f(2)=a+b\end{cases}$⇒$\begin{cases}a =-2 \\ b = 5\end{cases}$

    ∴f（x）＝－2（x－3）$^{2}$＋5

    在 0 ≤ x ≤ 4 中，

    當 x＝3 時，有最大值為 5

    x＝0 時，有最小值為－13

    故 M－m＝18'
