  stem: 設 f（x）＝$ax^{4}$＋$bx^{3}$＋$cx^{2}$＋dx＋e 為整係數多項式，且 3∣a∣＋4∣b－2∣＋3∣c－3∣＋5∣d－2∣＋∣e＋2∣＝2，試求 f（x）＝＿＿＿＿。
  answer:
  - $2x^{3}$＋$3x^{2}$＋2x 或 $2x^{3}$＋$3x^{2}$＋2x－4
  answer_status: verified
  answer_source: answer_key
  explanation: '∵a，b，c，d，e 為整數且

    3∣a∣＋4∣b－2∣＋3∣c－3∣＋5∣d－2∣＋∣e＋2∣＝2

    可知$\begin{cases}a = 0 \\ b -2 = 0 \\ c -3 = 0 \\ d -2 = 0 \\ e +2 =\pm 2\end{cases}$⇒$\begin{cases}a = 0 \\ b = 2 \\ c = 3 \\ d = 2 \\ e = 0 或-4\end{cases}$

    故 f（x）＝$2x^{3}$＋$3x^{2}$＋2x 或 $2x^{3}$＋$3x^{2}$＋2x－4'
