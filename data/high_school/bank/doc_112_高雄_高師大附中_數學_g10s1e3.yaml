  answer_status: verified
  answer_source: answer_key
  explanation: '由題目可知 f(2)＝7，f（－3）＝－8

    設 f（x）＝（x－2）（x＋3）Q（x）＋ax＋b

    則$\begin{cases}f(-3)=-3a+b =-8 \\ f(2)= 2a+b=7\end{cases}$⇒$\begin{cases}a = 3 \\ b = 1\end{cases}$，故所求為 3x＋1'
