  answer_status: verified
  answer_source: answer_key
  explanation: '由題目可知

    $kx^{2}$＋5x＋3＜2x＋5，對於所有的實數 x

    ⇒ $kx^{2}$＋3x－2＜0，對於所有的實數 x

    ⇒$\begin{cases}k < 0 \\ 3^{2}-4 \cdot k \cdot (-2)< 0\end{cases}$⇒$\begin{cases}k<0 \\ k<-\frac{9}{8}\end{cases}$

    ⇒ k＜$-\frac{9}{8}$'
