  group_stem: 在祁家威等人向立法、行政、司法機關爭取同性婚姻權利超過30年後，民國106年5月人法官做出第748號釋憲解釋，宣告《民法》親屬編相關條文未使相同性別二人得為經營共同生活之目的，成立具有親密性及排他性之永久結合關係之規定違憲。大法官認為：「『是否結婚』暨『與何人結婚』之自由攸關人格健全發展與人性尊嚴之維護，為重要之基權桘，應受《憲法》第22條之保障。按相同性別二人為經營共同生活之目的，盛立具有親密性及排他性之永久結合關係既不影響不同性別二人適用婚姻章等規定，亦未改變既有異性婚姻所建構社會之磐石。……<u>以性傾向作為分類標準、以不能繁衍後代與維護基本倫理秩序為由，而未使相同性別二人得以結婚，顯非合理之差別待遇。」</u>有關機關應於解釋公布之日起2年內，依解釋意旨完成相關法律之修正或制定。在兩年後，民國108年5月17日，立法院三讀通過由民進黨團修正動議的《司法院釋字第七四八號解釋施行法》同婚專法，在世界各國關注之下，成為亞洲第一個正式讓同性婚姻合法的國家。
