  stem: 2019年熱門國產遊戲《返校》電版正式上映，電影內容描述戒嚴時期老師與學生私下組成讀書會，讀著當時政府所認為的「禁書」，而在當時凡是倡導自由思想及顛覆政府的言論或書籍，一律嚴懲，如今的民主社會可說是得來不易。請問戒嚴時期政府限制人民的言論，侵害了哪一項《憲法》保障的基本人權？
  options:
  - label: A
    content: 參政權
  - label: B
    content: 自由權
  - label: C
    content: 平等權
  - label: D
    content: 救濟權
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_5
  section: 1
  number: 5
  type: multiple
  page: 1
  stem: 某國中央民意代表貪汙收賄遭到檢方起訴，引發人民的怒火，該地區的人民發動免，並在數月後罷免成功，讓這位不適任的中央民意代表下。請問中央民意代表貪汙收賄遭起訴，人民發發動罷免成功使其下，依序應分別為負起下列何種責任？
  options:
  - label: A
    content: 道德責任、行政責任
  - label: B
    content: 行政責任、政治責任
  - label: C
    content: 法律責任、道德責任
  - label: D
    content: 法律責任、政治責任
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_6
  section: 1
  number: 6
  type: multiple
  page: 1
  stem: 在公民課時，老師說行政法介入人民生活的方式常見的有兩種，一種為課予人民義務與負擔的干涉行政，另一種則為提供福利服務或給予人民利益的給付行政，並請同學舉例。請問若以「干涉行政」及「給付行政」等兩種分類方式，下列哪一位同學說的類型與其他三者<u>不同</u>？
  options:
  - label: A
    content: 小黃：針對低收入戶提供生活協助或失業救濟金
  - label: B
    content: 小鴻：高雄市政府鼓勵生育發給新生兒生育津貼
  - label: C
    content: 小升：大學畢業後收到來自政府機關的徵兵通知
  - label: D
    content: 小帥：政府機關補貼節能家電促使民眾汰舊換新
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_7
  section: 1
  number: 7
  type: multiple
  page: 1
  stem: 阿志因學生證遺失而向學校申請補發，若阿志已備齊相關文件亦符合申請的規定，但學校在沒有正當理由的情況下，因阿志的態度不夠禮貌等理由而拒絕補發學生證給阿志，請問上述學校的行政行為，明顯違反了哪一項行政法的原理原則？
  options:
  - label: A
    content: 信賴保護原則
  - label: B
    content: 誠實信用原則
  - label: C
    content: 明確性原則
  - label: D
    content: 禁止恣意原則
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_8
  section: 1
  number: 8
  type: multiple
  page: 1
  stem: 依據我國《憲法》的規定，法律是由立法院制定或修正，大致可分為提案、審查、公布及施行等四個階段，請問下列關於「提案」階段之描述何者<u>有誤</u>？
  options:
  - label: A
    content: 總統可以提出「政府案」以實踐施政理想
  - label: B
    content: 考試及監察兩院均可提出法律案或修正案
  - label: C
    content: 人民可透過公民投票進行立法原則之創制
  - label: D
    content: 立法委員15人以上連署可提出「委員案」
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_9
  section: 1
  number: 9
  type: multiple
  page: 1
  stem: 2020年2月19日，歡樂無法黨在臉書上公布通過內政部核准，成為中華民國第365個合法政黨，該政黨為中華民國第一個由網路創者成立之政黨。該黨屬柔性政黨，由邱威傑、張志褀、陳子見三位YouTuber共同創立。邱威傑表示，創立的目的是想傳達、實現大型公民教育課的理念。並希望帶動全國民眾的歡笑、找回政治上的歡樂。根據上文所述，若以《憲法》保障基本權之角度而言，下列敘述何者較為正確？
  options:
  - label: A
    content: 國家對於網路創作者組成該政黨並無任何條件之限制
  - label: B
    content: 網路創作者得以組成該政黨是基於《憲法》保障人身自由
  - label: C
    content: 部分公職人員任間可加入該政黨但需嚴守政治中立
  - label: D
    content: 該政黨成立後無法中華民國各級選舉中推派參選人
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_10
  section: 1
  number: 10
  type: multiple
  page: 1
  stem: 亞太技術學院因經營不善，於民國105年由怡盛集團接手，但新學期開始，老師的薪水沒還、學生的課沒開，諸多學生被強迫轉學或休學。高教工會批評，教育部當初於2015年承諾「學生安置方面，原則採逐年停招以符合【甲】原則，學生應於原校就讀至畢業為止，課責學校維持教學品質及辦學責任」。如今亞太學生明顯「被轉學」、「被休學」，對琧太開罰、砍補助款、核准停招已無法保障師生權益。根據上文所述，【甲】應為哪一項行政法之原理原則？
  options:
  - label: A
    content: 誠實信用原則
  - label: B
    content: 平等原則
  - label: C
    content: 明確性原則
  - label: D
    content: 信賴保護原則
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_11
  section: 1
  number: 11
  type: multiple
  page: 1
  stem: 《憲法》保障人民有救濟權，又可分為請願、訴願及訴訟等基本權利。下列有關人民依法提起權桘救濟的方式，何者正確？
  options:
  - label: A
    content: 訴訟權是指人民權利遭受不法侵害時，得以請求法院審判
  - label: B
    content: 請願權是指人民針對政府違法或不當的行政處分提起救濟
  - label: C
    content: 訴願權是指對於特定事件向政府主管機關表達心願的行為
  - label: D
    content: 請願權是向行政機關提出，訴願權則是向司法機關提出
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_12
  section: 1
  number: 12
  type: multiple
  page: 2
  stem: 阿青在瑞豐夜市的攤商購物，趁店主忙碌不注意時，帶著未結帳的商品快閃離去；店家事後調閱監視器，確認阿青的樣貌，並於阿青再次來店購物想要人相同手法偷竊時，店家在有所留意的情況下，將匆忙逃跑的阿青抓回。依我國相關法律規定，有關店家可採取之行動，何者最為合適？
  options:
  - label: A
    content: 阿青一再進行偷竊，可將其綑綁鎖在廁所以示處罰並審問犯行
  - label: B
    content: 店家雖有財務上的損失，但當下也只能報警，不得有任何行動
  - label: C
    content: 調閱監視器的行為，已經侵犯阿青的隱私權，不得再要求還錢
  - label: D
    content: 避免阿青逃跑後抓不到人，可暫時限制人身自由，並報警處理
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_13
  section: 1
  number: 13
  type: multiple
  page: 2
  stem: 根據司法院公布釋字第791號解釋之新聞稿指出「……而國家以刑罰制裁手段處罰違反婚姻承諾之通姦配偶，雖有「懲罰」違反婚姻忠誠義務配偶的作用，但是國家權力因此介入人民的婚姻關係，反而可能會對婚姻關係產生負面影響。因此《刑法》第239條通姦罪以刑罰干預人民之性自主權，其限制所致之損害顯然大於其目的所欲維護之利益，而有失均衡……」根據上文所述，主要說明通姦罪<u>違反</u>哪一項法律原則而宣告違憲？
  options:
  - label: A
    content: 比例原則
  - label: B
    content: 法律保留原則
  - label: C
    content: 法律優越原則
  - label: D
    content: 信賴保護則
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_14
  section: 1
  number: 14
  type: multiple
  page: 2
  stem: 小宇在學校廁所吸菸，因屢勸不聽被校方記過懲處，小宇日後收到的處分書上僅寫到：「給予嚴厲的懲處，反思悔過。」請問若是小宇，可人如何自學校主張？
  options:
  - label: A
    content: 該處分書違反明確性原則，所以無效
  - label: B
    content: 該處分書違反禁止恣意原則，所以無效
  - label: C
    content: 該處分書違反誠實信用原則，所以無效
  - label: D
    content: 該處分書違反信賴保護原則，所以無效
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_15
  section: 1
  number: 15
  type: multiple
  page: 2
  stem: 《社會秩序維護法》中有關「罰娼不罰嫖」的規定，經大法官釋字第666號宣告違憲後，已於2011年完成修法，授權地方政制定設立「性六易專區」之自治條例，在專區內免罰：在專區外性交易者，則娼嫖都處三萬元以下罰鍰，唯迄今尚無縣市願意設立。根據上文所述，下列敘述何者正確？
  options:
  - label: A
    content: 宣告違憲的第666號釋憲文等同法律位階
  - label: B
    content: 大法官釋字第666號屬於立法機關的解釋
  - label: C
    content: 各級法官透過違憲審查維護《憲法》的最高性
  - label: D
    content: 透過司法機關解釋彰顯權力制衡的重要性
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_16
  section: 1
  number: 16
  type: multiple
  page: 2
  stem: 原住民族保留地制度旨在保障原住民族生計，主管機關於變更其土地使用前，自應依相關規定嚴格把關，以確保原住民族應有權益假設在某一「山地保留地土使用協調會」中，政府代表僅強調將保留地租與民間公司開採，目的在於可保進地方經濟發展，增加當地工作機會，卻未告知原住民族在塗銷耕作權後，將喪失繼續耕作及未來取得土地所有權之權利，請問該政府代表的作為與下列哪一項原則<u>相違背</u>？
  options:
  - label: A
    content: 誠實信用原則
  - label: B
    content: 信賴保護原則
  - label: C
    content: 比例原則
  - label: D
    content: 平等原則
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_17
  section: 1
  number: 17
  type: multiple
  page: 2
  stem: 根據某報導指出：「現代人手不離身，一名陳姓騎士騎機車停等紅燈時，忍不住從口袋中掏出手機開始滑，滑到非常入神，沒想到連身旁站了一位警察也渾然不知，陳姓騎士抗議其他騎士仍被警察開罰單。」據上文所述，請問警察最後仍開單之行為，是否合理？
  options:
  - label: A
    content: 不合埋，因為陳姓騎士得主張「違法的平等」
  - label: B
    content: 不合理，因為警方取締違反「誠實信用原則
  - label: C
    content: 合理，因為陳姓騎士不得主張「違法的平等」
  - label: D
    content: 合理，因為警方取締未違反「誠實信用原則」
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_18
  section: 1
  number: 18
  type: multiple
  page: 2
  stem: 據報載：「立法院求教育文化委員會今召開《學校衛生法》相關修法，其中在野黨擬將禁止乙型受體素（即瘦肉精、萊克多巴胺）列入條文中，民進黨則怕掛一漏萬而不支持，歷經整日爭論後，傍晚5點半最後整理國民黨、民眾黨及時代力量等3個版本送出委員會，交由黨團協商。2020/11/02自由新聞」，依據我國立法程序，該修正案正處於哪一階段？
  options:
  - label: A
    content: 提案至一讀之間
  - label: B
    content: 一讀至二讀間
  - label: C
    content: 二讀至三讀之間
  - label: D
    content: 三讀至公布之間
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_19
  section: 1
  number: 19
  type: multiple
  page: 2
  stem: 根據《全民健康保險法》的規定，全民健康保險是國家為增進國民健康，提供醫療服務所制定強制性的社會保險，每一位國民皆制繳納保費。但曾有人認為其制納保的措施會侵害到人民的基本權利，有違憲之虞，故大法官遂於釋字第472號中指出，政府強制納保符合《憲法》第23條所規定之正當理由，因此並無違憲。請問此正當理由是基於何種公益目的？
  options:
  - label: A
    content: 防止妨礙他人自由
  - label: B
    content: 避免緊急危難
  - label: C
    content: 維持社會秩序
  - label: D
    content: 增進公共利益
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_20
  section: 1
  number: 20
  type: multiple
