  group_stem: 新北市板橋高中（下稱板中）學生會於2019年5月在校慶週發起「板中男裙—裙聚效應」活動，希望打破性別刻板印象、尊重氣質差異，引起社會關注日前，板中學生於臉書發布貼文，內容為學期末校務會議提案討論已通過之決案，當中可看到修正後的服儀規定，拿掉了性別用語，新學年9月開學起，不再限定男生只能穿褲子上學。 貼文指出，按板中現行規定，男生得穿深藍色長褲，女生得著深藍色下裙（長褲），且長度不得短於膝蓋上10公分；修正後刪除男生、女生的字句，該規定改為「穿著素面制服褲（裙）子，以藍色、黑色為主」，學生會並附註，即便是男生也可著制服裙上、放 板中學務主任林三維表示，有女學生反映穿裙子不方便，希望開放女生穿長褲，加上學生會5月校慶曾發起「男裙週」活動，讓男生體會到穿裙子不便，因此服儀委員會提案修改服儀規範，並提交校務會議討論通過，這是尊重學生選擇制服的自主權，並鼓勵尊重性別平權，不代表鼓勵男學生穿裙子上課，但若有學生如此，校方也不會限制。
