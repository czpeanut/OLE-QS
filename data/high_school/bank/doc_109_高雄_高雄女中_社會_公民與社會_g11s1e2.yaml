- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s2_35
  section: 2
  number: 35
  type: calc
  page: 4
  stem: '根據上文，大法官認為其牴觸哪一項《憲法》所保障的法律原則而宣告其部分違憲？

    請先勾選一項，並簡要摘述題文作為佐證。（請在答案卷上作答；未勾選法律原則或勾選錯誤者，此題不予計分）（非選擇題，4分，限50字以內）

    ◎36.~38.題為混合題

    資料一：2019年底，武漢爆發新型冠狀病毒引發的急性呼吸道傳染疾病，臺灣境外移入病例不斷增加，為有效抑止疫情擴散，我國政府於2020年2月通過《嚴重特殊傳染性肺炎防治及紓困振興特別條例》（下稱《特別條例》），依法對感染高危險群採行居家隔離、居家檢疫、集中檢疫或其他必要措施；但卻有民眾違反居家隔離或檢疫的管制規定，逕自離家外出，因而逼處罰鍰。由於國內防疫資不足，政府除積極擴增口罩產能外，也依《傳染病防治法》之規定，徵用廠商生產的口罩並給予補償。 資料二：中央流行疫情指揮中指揮官陳時中宣布，依據《特別條例》第7條的規定禁止高中以下師生出國，外界質疑此措施內缺法源，且針對《特別條例》第7條所謂「必要之應變處置或措施」是否足以限制《憲法》保障的居住遷徙自由，引起違憲爭議，<u>針對此事，屢見朝野進行攻防，而是否頒布緊急命令，也成為爭執的焦點之一。贊成方認為，緊急命令可以補齊法源，避免爭議，將來也可以避免有心的執政者以此為例，趁難擴張權力，侵害人民自由。反對方則認為，《特別條例》是立法院三讀通過的法律，已足夠為法源依據，即便不夠明確，修改《特別條例》便可也可避免造成眾不必要的恐慌。</u> 資料三：行政院政務委員羅秉成說：「我們用《特別條例》方式急速、很快地因應疫情變化。在立法院授權下，它就是法律，它就是符合《憲法》第23條所指，有必要時可人用法律限制。」 註1：《嚴重特殊傳染性肺炎防治及紓困振興特別條例》第7條：「中央流行疫情指揮中心指揮官為防治控制疫情需要，得實施必要之應變處置或措施。」'
  group_stem: '每一子題配分標於題末，限在標示題號作答區內作答。「選擇題部分」使用2B鉛筆作答，更正時，應以橡皮擦擦拭，切勿使用修正液（帶）；「非選擇題書寫部分」用筆尖較粗之黑色墨水的筆作答，更正時，可以使用修正液（帶）。若因字跡潦草等原因，致評閱人員無法清楚辨識，其後果由考生自行承擔。

    ◎35題為非選題

    大法官於民國109年22月6日做出釋字第796號解釋，《刑法》規定「假釋出獄再犯罪者，被判有期徒刑以上，應撤銷假釋服完殘刑」，宣告此法部分違憲，即日起失效。

    《刑法》第78條第一項「假釋中因故意更犯罪，不論被判緩刑或6月以下有期徒刑，一律撤銷其假釋；聲請釋憲共有6名當事人，假釋期間時，犯下酒駕、兒少條例、強制性交、傷害、肇事逃逸等，遭判有期徒刑；因當事人曾被判無期徒刑，若依照《刑法》第78條第一項還須回籠服完殘刑，因此聲請釋憲。

    大法官認為，受假釋者因再犯罪被判緩刑或6個月以下有期徒刑，導致其需再入獄執行殘刑，就目的上並非必要，大法官強調，即日起，假釋審查委員會應依解釋意旨，斟酌是否撤銷假釋；檢察官如果已收案，也要依本解釋意旨斟酌是否要執行假釋撤銷。

    大法官表示，《刑法》第78條第一項規定修正前，法務部早已提出修正案，改為受假釋人出獄後，若再度犯罪，被判6月以下徒刑，「得」撤銷其假釋，意義與796號解釋相同。但還是應依照本解釋意旨，個案審酌是否撤銷其假釋。'
