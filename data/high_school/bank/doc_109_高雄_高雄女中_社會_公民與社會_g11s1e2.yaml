  page: 1
  stem: 行政法是由法律所組成的法律領域，國家為成行政目的而從事各種行政行為，藉由公權力介入人們生活領域相當廣泛。請問下列哪一部法律不屬於各種行政行為？
  options:
  - label: A
    content: 《行政程序法》
  - label: B
    content: 《刑法》
  - label: C
    content: 《集會遊行法》
  - label: D
    content: 《行政罰法》
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 依據《高雄市政府違規車輛拖吊及保管作業規定》：「汽車車主或駕駛人於違規車未能吊移入行駛車道前到場，執勤員警應請其出示駕駛執照、行車執照，經查核無誤後，場舉發停止移置並交付舉發違反道路交通管理事件通知單。」此條文說明因疏通交通目的已達成，便無須採重之拖吊手段。若執勤員警仍採行較重之拖吊手段，可能違反比例原哪一項子原則？
  options:
  - label: A
    content: 適當性原則
  - label: B
    content: 必要性原則
  - label: C
    content: 衡量性原則
  - label: D
    content: 平衡性原則
- id: doc_109_高雄_高雄女中_社會_公民與社會_g11s1e2_s1_3
  section: 1
  number: 3
  type: multiple
  page: 1
  stem: 《嚴重特殊性肺炎防治及紓困振興特別條例》修正案於2020年4月21日立法院院會完成三讀。除原600億，再追加1500億元外，朝野表決攻防聚焦第11條，民進黨團修正動議，讓行政院版可視疫情以不超原額度再編預算，等同合計最高有4200億的空間。請問對於文中所是及之立法程序，下列敘述何者正確？
  options:
  - label: A
    content: 程序委員會逕送相關委員會審查後，即送第三讀會審查
  - label: B
    content: 法案在第三讀會中全文交付表決通過後，法案即告生效
  - label: C
    content: 在第三讀會中，原則上僅做文字之修正，內容不再討論
  - label: D
    content: 第三讀會表決後，若認內容有錯誤或不當，得提起覆議
