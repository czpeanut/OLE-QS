  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)依據《高級中等教育法》第 54 條第 2 項：「學生或學生自治組織對學校之懲處、其他措施或決議，認為違法或不當致損害其權益者，得向學校提出申訴；不服學校申訴決定，得向各該主管機關提出再申訴；其提起訴願者，受理訴願機關應於十日內，將該事件移送應受理之學生申訴評議委員會或學生再申訴評議委員會，並通知學生或學生自治組織。」簡而言之，學生之權益救濟程序為校內申訴、再申訴（等同訴願）後，可提起行政訴訟。(C)依據釋字第 784 號，侵害學生受教權或相關權利，即可提出行政救濟。(D)此侵害學生權利，屬於公法之糾紛，應提起行政訴訟。
