- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 暢銷小說《哈利波特》的作者 J.K 羅琳在書店發現她的名字被某家出版社盜用，那本書根本不是 J.K 羅琳寫的。請問 J.K 羅琳可以向法院提起該出版社侵犯她的哪一種權利？
  options:
  - label: A
    content: 商標權
  - label: B
    content: 專利權
  - label: C
    content: 著作財產權
  - label: D
    content: 著作人格權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 「名字被某家出版社盜用」所侵害的是(D)著作人格權的姓名表示權。「姓名表示權」是指著作人在完成著作以後，對於他的著作有權決定要以何種方式，表示著作人的姓名。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 電子商務興起，傳統透過實體店面販售商品的交易模式也日益轉移到網路平臺。但網路商店為了吸引消費者瀏覽，常需要精美的商品照片，有些貪小便宜的網路商店經營者為了節省照片的拍攝成本，會採取「網路盜圖」的方式，例如：在網路上搜尋販售相同商品之店家所使用的照片，以複製、貼上方式，張貼在自己的商品網頁上。根據上文，下列關於著作權的相關規定何者較為正確？
  options:
  - label: A
    content: 「網路盜圖」的行為可能會侵害著作權人的著作財產權
  - label: B
    content: 照片拍攝者若未向智慧財產局申請，即無法享有著作權
  - label: C
    content: 「複製」、「貼上」的行為即《著作權法》中所謂的「改作」
  - label: D
    content: 盜用的圖片非直接用來出售謀利，應屬合理使用的範圍
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)著作權是創作完成即享有，無需註冊或申請。(C)為《著作權法》中的「重製」。(D)盜圖侵害著作權人之權利，不屬於合理使用的範疇。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 公民選修課的期末報告，小真計畫走訪在地社區用影像說故事，拍攝一段結合歷史、建築、飲食、藝術及人文的採訪影片，並上傳網路以帶動故鄉觀光，請問其相關作為何者較符合資訊倫理？
  options:
  - label: A
    content: 為求情境真實，影片中呈現拍攝主角的居住地址及身分證字號表示確有其人
  - label: B
    content: 為求如期繳交，影片雖使用他人的素材製作但播出前並未取得著作權人同意
  - label: C
    content: 為求戲劇效果，影片中提供誇大不實的減肥祕方，希望能增加網友的點閱率
  - label: D
    content: 為資訊正確，影片相關資料都經過專業的蒐集考證，並仔細校對所有內容
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此侵害當事人的個人資訊及隱私權。(B)須取得著作權人之授權或同意。(C)誇大不實的影片違反資訊倫理的正確性。(D)符合資訊倫理，為正解。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_5
  section: 1
  number: 5
  type: single
  page: 2
  stem: 國家批准藥物上市，卻無力排除藥物對人體的不良反應，導致用藥人死亡、障礙或重大疾病時，用藥人可依據《藥害救濟法》申請藥害救濟。但因為批准藥物上市是依循療效大於風險的準則，難謂公務員的行為違法或有責；另方面用藥人又不是因追求特定公益目的而遭受特別犧牲。因此學理認為，行政法上的藥害救濟是基於平衡原則、社會共同體連帶的思維。由此可知，藥害救濟制度的國家責任類型應歸屬於下列何者？
  options:
  - label: A
    content: 國家賠償責任
  - label: B
    content: 損失補償責任
  - label: C
    content: 社會補償責任
  - label: D
    content: 公務員過失責任
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 「行政法上的藥害救濟是基於衡平原則、社會共同體連帶的思維」，表示國家並未違法失職，不屬於國家賠償範疇，此屬於(C)社會補償責任。社會補償是行政法上彙整出來的一種國家責任類型，功能在補傳統國家賠償與犧牲補償責任之不足，因國家賠償責任嚴格限於公務員行為之違法、有責，犧牲補償又限於為公益的特別犧牲，導致某些情形，人民的受害，即使與國家的作為或不作為存有一定因果關係，也未必能獲得賠償或補償。病人又不是因追求特定公益目的而遭受的特別犧牲，也無從根據平等原則請求特別犧牲補償。立法者為彌補漏洞而主動創設出此一藥害救濟制度，其理論基礎一般認為就是衡平原則、社會國社會連帶思維。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_6
  section: 1
  number: 6
  type: single
  page: 2
  stem: 安安買到當前熱銷的手機，開心的拿給同學欣賞，同學疑似太過興奮不慎讓手機墜落到地上，螢幕當場碎裂。試問安安可如何主張自己的權利？
  options:
  - label: A
    content: 同學須負責修復安安的手機，另外還要賠償安安精神慰撫金
  - label: B
    content: 同學須負責修復安安的手機，若無法修復則按市價賠償金錢
  - label: C
    content: 同學因故意或過失不法侵害安安對手機的身分權，故須賠償
  - label: D
    content: 同學故意背於善良風俗侵害安安用手機的人格權，故須賠償
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)財產權的損害無法主張精神慰撫金。(B)回復原狀為原則，金錢賠償為例外，為正解。(C)(D)侵害的是財產權，須負起損害賠償之責。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 剛進學校熱舞社的高一新生小萱，因為長相甜美可愛，到哪裡都是眾人注目的焦點。下列何者對小萱的作為較無觸法疑慮？
  options:
  - label: A
    content: 路人甲偷拍小萱的照片放在自己的「校花大集合」粉絲專頁，並請網友指認
  - label: B
    content: 小萱的同學看到甲的粉絲專頁，直接留言提供小萱的姓名、電話及 IG 連結
  - label: C
    content: 熱舞社社長經小萱同意，在網路分享社團成果發表會上小萱個人演出的影片
  - label: D
    content: 駭客乙無故侵入小萱的電腦，複製小萱多張私密照後在網路上散布無償分享
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)未經當事人同意，影像被放在網路，為侵害其肖像權（人格權）。(B)侵害小萱之隱私權。(C)獲得當事人同意，較無觸法疑慮，為正解。(D)此行為侵害其人格權及隱私權。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 每年的動漫展上，常見廠商大手筆邀來日本知名動漫配音員，以真面目現身舉辦座談會，但現場常限制觀眾拍照攝影，請問這是因為廠商想保護配音員的何種權利？
  options:
  - label: A
    content: 著作權
  - label: B
    content: 專利權
  - label: C
    content: 人格權
  - label: D
    content: 財產權
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 限制觀眾攝影涉及肖像權，肖像權是指自然人對於自己人像加以使用之控制權利，屬於《民法》第 18 條人格權的一種，始於出生，終於死亡，答案為(C)。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 國家因公共利益之需要，依法徵收人民之土地；對土地所有權人而言是為了社會大眾的利益而受的特別犧牲。此時，國家應給予
  options:
  - label: A
    content: 國家賠償
  - label: B
    content: 損失補償
  - label: C
    content: 損害填補
  - label: D
    content: 社會補償
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 土地或土地改良物原供合法營業之用，因徵收而致營業停止或營業規模縮小之損失，應給予補償，屬於(B)損失補償，此為國家因公權力的「合法」行使，造成人民權益特別嚴重的損害（理論上稱為「特別犧牲」）時，國家負有補償的責任，人民可以就其損失向國家請求「補償」。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 著作權是指法律所賦予著作人對於其所創作的著作所有權利之保護。下列有關「著作權」的敘述，何者「錯誤」？
  options:
  - label: A
    content: 若未經作者同意隨便公開別人的情書，是一種侵害別人姓名表示權的行為
  - label: B
    content: 老師的上課內容受到《著作權法》保護，要錄音須經過老師的同意才可以
  - label: C
    content: 撰寫碩博士論文時，可以在合理範圍內引用他人的著作，並註明出處
  - label: D
    content: 用筆名在網路部落格上發表一篇文章，同樣享有著作權
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)未經他人同意公開情書，會侵害寫情書之人的公開發表權，如果公開朗誦，會侵害公開口述權，如進而影印傳播，會侵害重製權，所以不可隨意利用他人文件。(B)(C)(D)為正確的敘述。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 甲女原本在乙男公司工作，離職自己出來創業後，便與乙男交往，卻遭乙男配偶丙控告侵害＿＿＿。但甲女卻大喊冤枉，表示乙男自稱早就離婚，更在教堂前向神發誓與配偶丙「沒有夫妻關係」，才會因此被騙，而且她曾經想當面詢問丙，卻被乙男阻止；反倒是乙男多次向甲女借錢不還，引發甲女懷疑，經甲女多方查證後才意外讓整件事情曝光。依據情境，下列敘述何者正確？
  options:
  - label: A
    content: ＿＿＿部分應為人格權，得要求甲女登報道歉
  - label: B
    content: ＿＿＿部分應為身分權，因其配偶權遭受侵害
  - label: C
    content: 由甲女的說法可知，甲是故意侵害丙的權利
  - label: D
    content: 乙男對甲女債務部分，應以回復原狀為原則
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)乙男配偶丙控告甲女侵害其「配偶權」，此屬於「身分權」，(B)為正解。(C)甲女受乙男欺騙，非故意侵害丙之權利。(D)對於債務應以金錢賠償為原則。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 王董決定蓋一棟摩天大樓，主管機關也核發了建造執照給他，但於施工中，才發現該建地居然埋有商朝時的遺跡，主管機關為保存古蹟，就廢止了王董的建造執照，並且要求廠商停工。蓋房子蓋到一半的廠商只好申請損失補償。請問廠商所申請的是哪一種損失補償？
  options:
  - label: A
    content: 徵收補償
  - label: B
    content: 因特別犧牲的損失補償
  - label: C
    content: 基於信賴保護的損失補償
  - label: D
    content: 社會補償
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 保存古蹟而廢止建造執照，屬於(C)基於信賴保護的損失補償，意指當事人對合法行政處分之存在，具有值得保護之信賴，並因廢止受有損失，自應給予補償。而補償之範圍，限定於該損失係因信賴授益處分之存在而發生，即損失與信賴須有相當因果關係存在。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 資策會向法院提起自訴，指出某地方政府首長的博士論文引用資策會的兩篇期刊論文，包含文字、圖片、表格，公式等研究內容逾 8 成，且未明示出處，違反學術倫理。請問資策會應認為該地方政府首長侵害其何種權利？
  options:
  - label: A
    content: 物權
  - label: B
    content: 身分權
  - label: C
    content: 資訊隱私權
  - label: D
    content: 智慧財產權
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 期刊論文的相關內容，屬於著作權的範疇，為(D)智慧財產權。智慧財產權是指個人智慧的結晶具有財產價值。大致上可分成：著作權、專利權及商標權。著作人完成著作的當下，就享有著作權。
- id: doc_112_屏東_屏東高中_社會_公民與社會_選修公民與社會II_g12s2e3_s1_14
  section: 1
  number: 14
  type: single
  page: 3
  stem: 政府委託民間業者維修管線，施工工人在未將人孔蓋蓋上的情況下，就直接離開去用餐，導致一名機車騎士因閃避不及而跌入深洞中，生命垂危送醫急救。針對此一事件的法律責任，下列敘述何者正確？
  options:
  - label: A
    content: 受害人或家屬應直接對政府提出行政訴訟
  - label: B
    content: 受害人可向僱用人政府提出損害賠償請求
  - label: C
