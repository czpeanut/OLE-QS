  stem: 依紅單左下角紅色方框內提供的資訊，若對臺北市警察舉發交通違規的行政行為不服，其救濟流程何者最為正確？
  options:
  - label: A
    content: 向監理站陳述→高等行政法院→最高行政法院
  - label: B
