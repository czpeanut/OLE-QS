  stem: '阿杰擅長詞曲創作，常自己寫歌譜曲放在網路上讓網友自由下載彈奏或演唱。但有網友下載阿杰的歌曲後修改了歌詞，甚至使用違反公序良俗的字眼大幅竄改，嚴重扭曲歌曲原有的意境，讓阿杰十分氣憤。朋友告訴他，依我國《著作權法》之規定，著作權可分成【甲權】和【乙權】兩大類，即使網友無不當修改歌詞，仍可能侵犯阿杰的【甲權】，至於使用違反公序良俗的字眼篡改，扭曲歌曲原本的意境則可能侵犯了【乙權】。下表對於【甲權】與【乙權】的比較，何者較為正確？

