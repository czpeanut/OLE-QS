- id: doc_112_新北_新北高中_自然_物理_選修物理I_g11s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 在空氣中運動的物體會受到空氣阻力的作用，阻力和物體速度的關係極為複雜。某些狀況 下，阻力與速度的一次方成正比（例如在水中行進的船隻），某些狀況下，阻力與速度的平 方成正比（例如從高空落下的雨滴）。不管阻力與速度的一次方或平方成正比，都有速度愈 快，阻力愈大的關係，當物體所受到的阻力與原本所受的重力相抵消時，物體便不再作加 速度運動，而以等速度運動，此時的速度稱為終端速度；跳傘者之所以能安全降落地面， 也是拜終端速度所賜。 <u>小智</u>為了研究終端速度，將質量2 kg的塑膠圓球在距地面上方一特定高度處，使之由靜止 狀態自由落下，測得其速度－時間關係圖（v－t圖）如右圖所示。假設圓球僅受重力及空 氣阻力作用，根據上述資料，試問圓球的終端速度量值約為多少m/s？
  options:
  - label: A
    content: '5'
  - label: B
    content: '10'
  - label: C
    content: '15'
  - label: D
    content: '20'
  - label: E
    content: '25'
