  stem: 日常生活中常見的運動與牛頓運動定律息息相關，下列有關牛頓三大運動定律的敘述，何者正確？
  options:
  - label: A
    content: 依據第二定律，運動物體的位移方向必定與其所受合力的方向相同
  - label: B
    content: 依據第二定律，運動物體的速度方向必定與其所受合力的方向相同
  - label: C
    content: 用槳划水使船前進及加速的過程，可分別利用第三與第二定律解釋
  - label: D
    content: 用噴氣使火箭前進及加速的過程，可分別利用第三與第一定律解釋
  - label: E
    content: 溜冰選手站立於光滑水平地面以手猛推一下牆壁，反彈及其後以等速度離開，可分別利用第一與第二定律解釋
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)(B)物體的加速度方向與其所受合力方向相同 (D)噴氣使火箭前進及加速的過程，可分別利用第三與第二定律解釋 (E)溜冰選手推牆，反彈及以等速離開，可分別利用第三與第一定律解釋 故選(C)。
