  group_stem: 小琪與同學一起選修了多元選修「媒體社會心理學」的課程，在課程中了解到在媒體的推波助瀾下社會上對女性有些想法，包括「馬路三寶」多為女性駕駛，或是「女生的數學天生不好」。小琪以關鍵字「女駕駛」上網搜尋新聞，發現多筆搜尋結果皆為女駕駛造成的車禍，例如標題為：〈行人過馬路突被撞飛！肇事女駕駛：A 柱擋視線〉，而「男駕駛」的搜尋結果卻少很多，且多為車禍受害者，例如標題為：〈高雄港 2 曳引車高速撞擊 男駕駛拋飛慘遭夾擊〉。同學小千進一步蒐尋駕駛性別的相關資料，發現領有駕照的男、女性人數約為 5.6 比 4.4；而在有通報警方的交通事故中，約有 7 成肇事者是男性駕駛，在最嚴重的 A1 交通事故（造成人員於 24 小時內死亡）中，男性肇事者人數是女性的 4.5 倍；他們又找到一份研究針對高中生性別與選組及數學成績的關聯性，得知男女生的數學天賦差異並不大，但數學成績好的女生選擇自然組的比例比男生低非常多，也就是女生不選自然組並不因為數學成績不好。其中討論到選擇組別有相當程度取決於兩性對於將來勞動市場的預期或認知，其中對勞動市場的預期包含對其所計畫從事職業未來可獲得的金錢和非金錢上之報酬，加上對於相關工作不確定感的信念。
