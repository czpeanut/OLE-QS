  stem: 社會安全制度為我國憲法的基本國策之一，為實現憲法「促進社會安全」的精神。請問下列關於我國社會安全制度的情況何者正確？
  options:
  - label: A
    content: 早期依職業別建構社會保險，並輔以急難救助，屬於制度式的社會安全體系
  - label: B
