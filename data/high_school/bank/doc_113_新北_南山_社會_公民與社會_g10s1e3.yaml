  stem: 1918 年春天在二次大戰的西線戰場開始出現流行性感冒，當時許多國家正值戰事，進行媒體審查，隱匿本國及軍隊的疫情，但西班牙因未參戰也沒有媒體審查限制當地疫情報導，在其他國家大量轉載西班牙的新聞下，導致世人誤以為該次流感是從西班牙開始。而這場造成全球近 15 億人感染，超過 2,000 萬人死亡的歷史性大災難後來也被錯稱為「西班牙流感」，認為起源就在西班牙。如果我們想要了解這種以訛傳訛的認知錯誤問題，最適合使用下列哪個概念主題進行相關的探究？
  options:
  - label: A
    content: 媒體近用
  - label: B
    content: 媒體壟斷
  - label: C
    content: 媒體再現
  - label: D
    content: 媒體守門
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 西班牙流感是因為媒體錯誤報導而產生的結果，此屬於(C)媒體再現導致的結果。媒體再現涉及媒體組織的操作，在政治議題上尤為明顯，媒體選擇讓誰發言，讓哪些訊息被呈現，並且透過記者與主播對事件進行詮釋，這樣的再現方式決定了能被我們接觸到的「真實」。
