  stem: 為了積極改善特定群體在社會上的不利處境，政府在制定政策時，通常會採取非常嚴格的判斷標準，以避免出現不當的決策。例如，在教育領域，政府可能會實施針對弱勢群體的獎學金計劃，確保來自低收入家庭的學生能夠獲得高等教育的機會。請問下列何者是制定積極平權措施時的重要準則？
