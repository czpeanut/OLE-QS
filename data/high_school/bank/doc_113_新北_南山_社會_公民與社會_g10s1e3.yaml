- id: doc_113_新北_南山_社會_公民與社會_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 媒體的公共性角色在於為公眾提供客觀、全面的資訊，促進社會的透明和公正。例如，在 2024 年，某國政府推出了一項新的環保政策，旨在減少工業排放。媒體 A 對政策進行了深入採訪，不僅報導了政策的積極影響，還揭露了可能對某些行業造成的短期衝擊，並提供了專家和受影響企業的不同觀點。請問以下何種行為體現了媒體的公共性角色？
  options:
  - label: A
    content: 媒體盡量利用聳動的標題並採訪民眾特殊的意見以進行平衡報導
  - label: B
    content: 電視臺製作播放高收視率的娛樂節目，提高廣告收入，進而增加媒體的經濟收益
  - label: C
    content: 媒體配合廠商的要求，提供適合的客戶名單讓廠商推播的廣告可以有良好效果
  - label: D
    content: 電視臺到街頭採訪民眾對政府打擊詐騙政策的看法，並邀請專家學者對政策進行深入分析
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)使用聳動標題無法彰顯媒體的公共性角色。(B)製作娛樂節目無法彰顯媒體的公共性角色。(C)此為商業盈利的考量，無法彰顯媒體的公共性角色。(D)的做法最能彰顯媒體基於社會公益而從事的報導角色，為正解。
