  stem: '媒體報導，某國的原住民族罹患心理疾病比率、自殺率、平均壽命及犯罪率與全國之比較，如右表。報導推論該國原住民的犯罪率與心理疾病比例都位居全國高位，顯現民族的特性難以融入國家，需要更多的教育資源進行教導。請問這樣的報導很有可能引導社會大眾對原住民個人或民族形成何種社會印象？

    |  | 原住民族 | 全國 |

    | --- | --- | --- |

    | 罹患心理疾病比率（％） | 14.2 | 9.0 |

    | 自殺率（人／每 10 萬人） | 15.7 | 8.8 |

    | 犯罪率（人／犯罪案件） | 24.4 | 7.8 |

    | 平均壽命（歲） | 69.3 | 76.1 |'
  options:
  - label: A
