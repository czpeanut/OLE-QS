  stem: 如要探討卡達在舉辦世界盃足球賽的過程中哪部分違反分配正義，下列何者應為最正確者？
  options:
  - label: A
    content: 當局沒有針對賄賂 FIFA 的疑雲調查與課責
  - label: B
    content: 警方任意拘留、虐待移工的行為應受到處分
  - label: C
    content: 移工對卡達的貢獻是否有得到相應的報酬
  - label: D
    content: 為比賽大興土木，決策過程沒有公開透明
  group_stem: '阿拉伯世界首辦世足 卡達人權剝削、移工爭議不斷

    2022 年在卡達舉辦世界盃足球賽（FIFA）。卡達投入約 2,290 億美元（約合新臺幣 7.15 兆元）建設相關場館，此金額為過去 7 屆加總的 5 倍。建設包含 8 座新的體育場館、鐵路和高速公路系統、機場、酒店與住宅等。然而，根據彭博報導，賽事估計僅貢獻約 170 億美元的經濟效益。

    而在賽事籌備期間，卡達也遭控剝削參與興建工程的移工。據國際特赦組織表示，許多來自孟加拉、印度和尼泊爾的移工，在母國遭受「不道德的招聘仲介」所騙，更甚者被迫從事無償勞動。另外，違反安全法規的工作環境，也導致逾 6,000 名移工死亡。

    此外，「人權觀察」（Human Rights Watch）在世足開幕前 1 個月公布報告，指出在 2019 年至 2022 年間，卡達警方屢次出現任意拘留、或是虐待非異性戀人士（LGBT）的情形。

    而馬來西亞籍的歌手黃明志也同時到卡達拍攝音樂影片，卻在當地與海關及警衛都發生糾紛。他覺得當地人們生活可能因宗教的關係有點戰戰兢兢，拍攝限制也比較多，即便在遊客地點拍照也會被趕走，沒有拍照及錄影的自由。他甚至還因為對方種族歧視而跟當地警衛發生口角差點大打出手，在工作團隊前往交涉並提供一些證件及與觀光局人員的合照之後，警衛的態度才 180 度轉變。'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)此涉及匡正正義範疇。(B)此為匡正正義範疇。(C)此為分配正義的範疇，分配正義是指資源分配領域中涉及的社會正義，即政策制定者根據文化、經濟條件、歷史等因素制定偏向於弱勢群體的法律和政策，以保證一個相對公平的結果，為正解。(D)此為程序正義範疇。
