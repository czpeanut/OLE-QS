  section: 2
  number: 25
  type: single
  page: 7
  stem: 依據資料所述，下列何者最有可能是最高法院願意讓德州繼續執行《 SB4 》的理由？
  options:
  - label: A
    content: 相關案件審理過程皆有依照法定程式進行
  - label: B
    content: 聯邦政府的權力應該大於州政府的權力
  - label: C
    content: 法案的實質內容對正常移民者並沒有不公平
  - label: D
    content: 該法案並沒有侵害人權或是迫害的問題
  group_stem: '資料一：美國德州州長於 2023 年 12 月通過《 SB4 》（Senate Bill 4）法案，允許州員警逕自逮捕並起訴涉嫌非法跨越邊境的移民。遭逮捕的嫌犯經證實有罪後，最高會遭處以 6 個月監禁；若該移民遭驅逐出境後，又再度非法跨越邊境遭逮，則最高可被判處 20 年有期徒刑。原本逮捕並起訴非法移民的職權為中央聯邦政府所有，地方政府並無權限，這個法案也將成為美國近年最嚴格的移民法律之一。

    資料二：美國總統拜登政府認為州政府的權力不該淩駕於聯邦政府之上，拜登因此以「違憲」為由，要求最高法院擋下《 SB4 》；然而，最高法院以「程式正義」為由，同意德州應維持執行《 SB4 》，但沒有解釋《 SB4 》本身是否違憲。另外，由於德州抓到的非法移民通常會被遣返回墨西哥，這也導致墨西哥政府不滿，表示：「《 SB4 》是一個會導致家庭破碎、鼓勵種族歧視，並侵犯移民人權的法律。」某位移民律師也質疑：「這項法律給予員警玩『猜猜誰是非法移民遊戲』的權力，可能會因為我是棕色人種、能說流利的西班牙語，而且看起來像是非法移民就被拘留。」'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從題文「最高法院以『程式正義』為由，同意德州應維持執行《 SB4 》」，可知最高法院認為《 SB4 》符合案件審理的法定程序，因此不違反程序正義而支持此法案，最適切的答案為(A)。
