  answer_status: verified
  answer_source: answer_key
  explanation: (A)急難救助應是較早出現在制度中，社會保險的時間點較為晚近。(B)為保障勞工勞年的經濟生活，應從一次性給付調整為年金制。(C)全民健康保險是落了保障人民的健康權，與經濟安全無關。(D)為正確的社會安全制度演進過程。
