    content: 對社會與經濟發展產生一定貢獻
  - label: D
    content: 申請釋憲機關判斷政策是否合憲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 積極平權措施指的是透過立法或行政創造積極政策或措施，保障並提升弱勢族群在各領域內的機會與權益，尤其是在傳統上對弱勢族群不利的領域。因此需關注採用的手段是否能達成協助弱勢學生處境的目的及手段方法間的必要性，答案為(A)。
