  section: 1
  number: 4
  type: single
  page: 1
  stem: 電視臺記者小蘭特別帶著團隊到臺灣的友邦國家製作了一系列的影片，介紹友邦裡某些族群的特殊文化。然而影片卻引起了記者專業自律團體的強烈批評。他們指出，影片內容存在多處錯誤，甚至傳遞了對該族群的偏見，因而反對影片的播出。小蘭則堅持認為，這是團隊辛苦採訪的成果而且記者有權發表意見進行評論，也有媒體近用權。從媒體近用權觀點來詮釋上述事件，下列何者最恰當？
  options:
  - label: A
    content: 媒體接近權保障人人有機會接近媒體，小蘭完全能以記者身分實現言論自由
  - label: B
    content: 媒體使用權保障人民有權製作媒體訊息，但內容須接受媒體專業倫理規範的審查
  - label: C
    content: 記者的自製影片內容若有不妥，相關當事人仍可要求更正
  - label: D
    content: 媒體近用權是為了確保人民基本言論自由，所以記者的報導不得加以限制
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)媒體接近權指民眾以被動、有限的方式，在傳播媒體上表達言論、改變媒介內容，並非記者的角色。(B)民眾並非媒體從業人員，無需受媒體專業倫理規範的審查。(C)此屬於媒體接近權中更正權的範疇，為正解。(D)媒體近用權是為了確保人民基本言論自由，但記者的報導仍需受到專業倫理的規範，兩者並無關聯。
