- id: doc_112_台北_明倫_社會_歷史_選修歷史II_g12s2e1_s2_35
  section: 2
  number: 35
  type: single
  page: 8
  stem: 請問關於上述資料的敘述，何者正確？
  options:
  - label: A
    content: 「埃及領航員」接管蘇伊士運河後才開始發生船隻擱淺事件
  - label: B
    content: 英媒報導支持蘇伊士運河管理局
  - label: C
    content: 英媒批評與公司國有化有關係
  - label: D
    content: 埃及總統透過英法介入運河經營
  group_stem: 過去有關蘇伊士運河船隻擱淺的報導中，幾乎不見人為疏失的討論。不過，1956 年的一則報導，卻以一種隱晦的方式，將船隻擱淺與人為疏失相連。該年 10 月，一艘貨輪擱淺，導致運河南向航道堵塞一個半小時；隔日，一艘摩托船也在蘇伊士運河擱淺。相較於其他成為蘇伊士「塞子」的船隻，這兩艘船不大，也沒造成嚴重危害，但英國《衛報》記者卻在未說明擱淺原因的情況下，就表示這是「埃及領航員」接管蘇伊士運河領航工作兩週後，發生的第一起事故。並接著說，未來埃及還會有更多領航員來管理運河。記者隨後詢問局長，與埃及政府關係不佳的以色列，能否和其他國家一樣使用蘇伊士運河？報導隱含對蘇伊士運河管理局的質疑，也暗指埃及領航員能力不足，造成事故。這則報導之所以特別強調領航員的角色，與 1956 年埃及總統納瑟突然宣布將原屬英、法企業所有的蘇伊士運河公司收歸埃及國有，不無關係。這決定不僅改變運河的所有權及經營權，還攪亂了聯繫著運河的國際關係。在納瑟總統眼中，英法兩國藉由掌控蘇伊士運河，來維繫埃及的殖民力量，因此收回運河主權，是埃及「擺脫殖民控制」、「重新掌握主權」的展現。雖然納瑟承諾會提供賠償，但此舉仍引來英、法兩國政府的不滿，這名《衛報》記者彷彿與自己的祖國同仇敵愾，懷疑埃及政府是否能如英、法兩國，有能力「管好」自己的運河。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)過去應也曾發生船隻擱淺事件，但幾乎不見人為疏失的討論。(B)英媒報導質疑蘇伊士運河管理局的能力。(D)埃及總統欲擺脫英、法對運河經營的介入。
