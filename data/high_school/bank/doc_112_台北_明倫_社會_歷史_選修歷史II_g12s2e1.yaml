  stem: 某個時期的臺灣由於政局不穩，讓原先有秩序的公共衛生制度一度倒退，使得鼠疫、霍亂以及天花再度出現，這讓當時政府不得不實施某項措施以重新了解臺灣人染病的情況。後來在國外基金會的贊助之下，採用新藥物與撲滅病媒的方法，其中，用來撲滅病媒的藥劑受到當時學者指控會引起生態浩劫而停止使用。臺灣的防疫發展至今，比起對症下藥，更強調預防重於治療，而這種觀念也讓更多傳染病在臺灣完全根除。根據題幹，請問下列何者正確？
  options:
  - label: A
    content: 當時為國民政府來臺初期，公共衛生疏於管制
  - label: B
    content: 國外基金會最可能是來自法國
  - label: C
    content: 引起生態浩劫的藥劑為塑化劑
  - label: D
    content: 該項措施為實施人口調查
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)應是來自美國。(C)題文中的藥劑應是 DDT。(D)這項措施為撲瘧計畫。
