  stem: 古希臘盛行巫醫，人一旦生病往往尋求巫醫而非醫生，治療方式不是念咒施法就是祭祀祈禱，當時人相信「神賜疾病」的說法，因此選擇將疾病與宗教活動連結。請問臺灣現存的何種醫療體系和古代盛行的巫醫療法有所關連？
