  - label: D
    content: 戰爭的爆發排擠了科學研究的經費，使各國的科學研究陷入困境
  group_stem: '第二次世界大戰改變了科學的面貌，戰爭帶來的迫切感、政府的介入、大筆公帑的挹注，都加速了科學研究的進展。以航空工程為例，在二戰爆發初期，世界各國的空軍仍以雙翼機為主力，但到了 1945 年噴射機已經成為許多國家空軍的主力；火箭技術在二戰初期時還很簡單，但到了 1945 年時人類已經有能力將飛彈射向太空的邊緣。

    而在醫學與疾病防治領域也同樣進展神速，由於軍醫累積了龐大的實務經驗，燒傷及心理創傷的治療完全轉變，有些進展則來自於戰時措施激發的研究動力，例如青黴素。青黴素在 1929 年才被發現，在二戰開始時仍是罕見藥物，根據統計，1941 年時美國青黴素的商業生產量是零，但在終戰時美國製造商每月能製造出 6,460 億單位的青黴素，這項產業的成功靠的是英美 2 國科學家、政府和私營企業彼此之間達成前所未有的合作才得以實現。

    DDT 殺蟲劑的發展和青黴素類似，它在戰前已被發明，但直到成千上萬的盟軍在太平洋戰區感染瘧染後，美國政府才推動大規模的補助生產和使用，到了 1945 年，盟軍在太平洋戰區的每一處駐地皆可看見低空飛行的飛機噴灑 DDT 殺蟲劑。戰爭結束後，許多城市、戰俘營和集中營的解放也會利用 DDT 殺死帶有傷寒桿茵的跳蚤，避免許多傳染疾病的爆發，即使到了 1970 年代時 DDT 對環境造成的災難性影響終於被揭露，但它成功阻止許多流行病爆發的功勞仍舊不能忽視。請問：'
