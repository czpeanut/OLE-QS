  stem: '明小倫為了撰寫小論文，蒐集到以下 2 則資料。

    資料一：1947 年，史達林下令建造一條位於俄羅斯北方的鐵路。這條鐵路連結薩列哈爾德與伊加爾卡這 2 座長年天寒地凍的城市，以及位於通往北極海的港口。在史達林眼中，這條鐵路能在軍事上保護北方領土，也能帶來豐富的天然氣資源。然而，這項嚴峻的工程導致大量古拉格勞改營中的人們死亡。

    資料二：1934 年，為了降低德國的高失業率，希特勒一反納粹黨過去反對修築公路的論調，招募大量勞工興建公路。然而事實上，公路興修工程提供的職缺從未高達最初宣稱的 60 萬，實際上是嚴重的勞動剝削。

    請問這 2 則資料可以用來證明以下何者論點？'
  options:
  - label: A
    content: 一國的交通建設往往源自國家治理的需求
  - label: B
    content: 一國的交通建設具備國防、軍事考量
  - label: C
    content: 一國的交通建設會在興建時造成傷亡
  - label: D
    content: 一國開始交通建設往往是為了解決失業問題
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)為正解。(B)資料二公路的修築是為降低高失業率，與國防、軍事無關。(C)僅資料一符合。(D)僅資料二符合。
  tags:
