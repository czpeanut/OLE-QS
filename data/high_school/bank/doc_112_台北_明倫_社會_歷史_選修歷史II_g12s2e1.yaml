  stem: 以下內容節錄自馬偕的回憶錄：「醫療對於傳教的重要性無庸置疑，這是所有了解近代傳教工作歷史的人都承認的。從我們在福爾摩沙工作之始，便謹遵主的教誨，以其為典範，並藉由治病來收穫立即的成效……醫治病痛的能力，為我們的使命贏得眾多心懷感恩的朋友與支持者。……在福爾摩沙，一個村落有半數村民感染瘧疾的情形十分常見，我曾見過一戶人家有 20 至 30 人無法做任何工作。在這種情況下，生活在患者之中、熟悉他們情況的本地傳教士，能夠依照他們所學，採用外國的醫療方法服務受苦的人，同時傳播基督的福音─他本人亦曾『治癒了許多不同的病患』。」請問根據上文所述，下列推論何者較適當？
