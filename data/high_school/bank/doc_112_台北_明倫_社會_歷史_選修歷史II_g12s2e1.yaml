  stem: 清代來自浙江，曾在臺灣任官的丁紹儀指出：「臺民皆徙自閩之漳州、泉州、粵之潮州、嘉應州。其起居、服食、祀祭、婚喪，悉本土風，與內地無甚殊異。……南人尚鬼，臺灣尤甚。病不信醫，而信巫。」丁紹儀認為，清代臺灣民眾生病時的醫療選擇，主要受到下列何者的影響？
