- id: doc_112_台北_明倫_社會_歷史_選修歷史II_g12s2e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 說起臺灣人對訊息的傳遞與吸收新知，無論是報紙或是雜誌都是很好的管道，但相較起來廣播「快速又明確」的威力更是強大，尤其在□□時期，「識字」對許多臺灣人來說依舊是很高的門檻，但利用廣播接收資訊非常方便，不論是對文盲或是眼睛沒空看的勞工來說，廣播就好像是最經典的「無障礙設施」一般的存在。請問題幹中的□□時期指的是？
  options:
