  group_stem: 自古以來，人口稠密且汙穢不堪的都市一直都是疾病的溫床。19 世紀中期，自南亞傳入的霍亂在人口眾多的倫敦都會區造成大流行。罹患霍亂的病人無不深受腹瀉和嘔吐所苦，嚴重者會因此脫水、休克死亡。面對不熟悉的霍亂，英國醫學界對該疾病致病和傳播原因有不同的解釋。主流觀點認為該傳染病和環境有關，街坊間堆積的穢物形成難聞的臭氣，其中帶有霍亂病原的空氣更隨風吹拂，散布到倫敦的各個角落。然而，一位名為史諾的醫生，利用統計分析發現霍亂是以蘇活區布勞德大街的公用抽水機為中心向外擴散。他認為當地飲用水存在某種有害物質，因此積極要求相關單位關閉抽水機。史諾的論點並未被人們接受，但該社區在停用抽水機後疫情即被控制，而因循主流觀點所做的防疫措施，雖能暫時減少霍亂的傳播，卻不能完全阻絕其在大都會區各個角落擴散，這讓倫敦政府開始思索水質乾淨與否和霍亂大流行的關聯性。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 文章內容主要提及 19 世紀倫敦都會區霍亂流行情形，除了固有的瘴氣論之外，另有醫生指出霍亂是透過遭汙染的水所傳播，影響到日後倫敦政府的防疫想法。(C)傳統瘴氣論主張疾病源自泥土與腐爛物質產生的惡臭氣體再傳播導致，都市的貧民窟被指為禍源，為正解。(A)資料中可看出當時英國尚未有公共衛生觀念。(B)瘴氣論學說自古已有。(D)文章中並沒有提到細菌。
