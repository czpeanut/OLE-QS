  stem: 人口和流行病不斷在變化，根據研究機構報告，1900 年時肺結核是美國人最常見的死亡原因，其次是肺炎、痢疾和腸胃炎等，然而到了 1940 年代初期，癌症一路衝上第 2 名，排名緊接在心臟病之後，到了 21 世紀，在許多國家裡癌症都高居死亡率的榜首。癌症是和年齡相關的疾病，罹癌的機率基本上隨年紀而增加，人類史中 99 ％以上的時間平均壽命落在 30 ～ 40 歲之間，直到 19 世紀才出現大幅增長，200 年內人類平均壽命從 40 歲倍增到 80 歲，長壽是社會文明進步的結果，但也為人類與疾病的對抗帶來挑戰。人類歷史上的大部分時間人都不夠長壽到罹癌，早就因肺結核、霍亂、天花、瘟疫或肺炎等疾病而死亡。請問本文主旨在說明？
  options:
  - label: A
    content: 在現代醫學成熟前人類很容易因感染各式疾病而死亡
  - label: B
    content: 20 世紀後人類已戰勝各種的傳染疾病
  - label: C
    content: 人活得愈長壽，就愈能抵抗傳染疾病的威脅
  - label: D
    content: 先進國家感染傳染病的風險低於開發中國家
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 題文資料最後的結論，說明過去的人類容易因為各種傳染病而死亡，因此「來不及」長壽罹癌，可推知正確答案應為(A)。(B)人類目前仍有許多待奮戰的新疾病。(C)長壽與抵抗傳染疾病無關，倒是更容易罹癌。(D)從題文中無法判斷。
