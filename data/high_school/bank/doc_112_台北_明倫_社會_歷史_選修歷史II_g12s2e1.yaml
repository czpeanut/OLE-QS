  stem: '南港嘉禮蹲大學 1 年級學生蔡冠強為了做報告，蒐集到下列 2 則資料。

    資料一：「瘟疫的爆發，常歸咎於外來的染病者或乞丐。不同的族群與宗教團體常被烙印為疾病的帶原者，例如文藝復興時期將瘟疫的傳播歸咎於猶太人，20 世紀則指控非洲人傳播愛滋病。」

    資料二：「18 與 19 世紀，糖尿病被歸咎於缺乏運動的生活和太過自溺，癲癇則被歸類為耽溺手淫與酗酒。手淫之類的特定行為，常被貼上疾病標籤，特定社會群體或種族也是如此，而被視為是偏差團體或社會威脅。」

    請問蔡冠強的報告最可能以下列何者為主題？'
  options:
  - label: A
    content: 各項疾病高風險族群考察
  - label: B
    content: 猶太人與歐亞瘟疫之傳播
  - label: C
    content: 手淫與酗酒過度風險分析
  - label: D
    content: 疾病與對特定族群之汙名
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一與資料二皆指出在不同的時期，疾病的發生皆被歸咎於特定的族群或對象，答案為(D)。
