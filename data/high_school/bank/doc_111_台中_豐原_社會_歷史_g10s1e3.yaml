  stem: '資料一： 1949 年他與胡適在臺北籌備《自由中國》雜誌，教育部部長資助，以雷震為實際負責人，1950 年雷震被蔣介石聘為國策顧問。

    資料二：1956 年蔣介石七十歲大壽，《自由中國》出版「祝壽專號」，知識分子紛紛建言，希望蔣介石無能、無治、無為，不要個人獨裁，引發黨政軍媒體圍剿。1957 年《自由中國》以「今日的問題」系列，連續發表十五篇社論，指出蔣政府一黨獨大，1959 年主張「反對黨是解決一切問題關鍵之所在」。1960 年，《自由中國》表示總統不可以違憲連任，後來蔣介石以修改《臨時條款》達到其三連任總統的目的。

    關於上述兩段資料，下列哪些敘述正確？'
  options:
