questions:
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 小華在《臺灣歷史地圖彙編》看到一幅舊地圖，其中在東部的區域有標示許多聚落的名稱，包括鹿野村、林田村、瑞穗村、旭村等。請問這些聚落的由來，與下列何者相關？
  options:
  - label: A
    content: 清代後期實行開山撫番政策後，到後山開墾的漢人形成的聚落
  - label: B
    content: 日治時代由政府及私人企業招募來臺的日人形成的日本移民村
  - label: C
    content: 日治時代後期配合戰爭需求、開發東部資源而形成的漢人村落
  - label: D
    content: 戰後遷臺的國軍及其眷屬，因政府安排到東部開發形成的眷村
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 為紓解國內過剩人口及日資在臺開發的需求，日本政府招募各類產業人員來臺，首先在東部建立不少移民村，(B)為正解。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: '資料一： 許多公共工程的完成，例如中部橫貫公路的開闢、曾文水庫與石門水庫的興建，都曾有他們的參與。

    資料二： 武陵、清境與福壽山農場曾被稱為「臺灣三大農場」，他們也在這裡種高冷蔬果，成為重要的經濟作物。

    請問資料中提到的「他們」最可能是指下列何者？'
  options:
  - label: A
    content: 日治後期的日本移民
  - label: B
    content: 戰後初期的客家族群
  - label: C
    content: 20 世紀後半期的榮民
  - label: D
    content: 當代東南亞國際移工
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹的「他們」應為(C) 20 世紀後半期的榮民，早年曾至各地協助開墾，也參與經濟建設的興築。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 晚清，加拿大人馬偕到淡水傳教，蘇格蘭人巴克禮在府城創辦神學校與中學，來自西班牙的郭德剛則在打狗建立「玫瑰聖母堂」。請問他們選擇其活動地點的主要原因是
  options:
  - label: A
    content: 當地官府開明，放任傳教活動
  - label: B
    content: 當地開放通商，傳教有所保障
  - label: C
    content: 當地原住民比例高，易於宣教
  - label: D
    content: 當地現代資源豐沛，民智大開
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 馬偕、巴克禮、郭德剛等西洋傳教士來臺，源自於 1860 年代臺灣開港通商，大批傳教士隨著商船到臺灣宣教，(B)為正解。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: '以下資料分別為四位中華民國總統發表的看法。請根據下列資料回答問題：

    資料甲： 「不會宣布獨立、不會更改國號、不會推動兩國論入憲、不會推動改變現狀的統獨公投、沒有廢除〈國統綱領〉與國統會的問題。」

    資料乙：「不統、不獨、不武、一個中國各自表述。」

    資料丙： 「在……年的修憲後，兩岸關係定位在特殊的國與國關係，所以並沒有再宣布臺灣獨立的必要。」

    資料丁：「不接觸、不談判、不妥協。」

    請依內容發表的先後排序'
  options:
  - label: A
    content: 丁丙甲乙
  - label: B
    content: 丁乙丙甲
  - label: C
    content: 丙乙甲丁
  - label: D
    content: 丙丁乙甲
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料甲為陳水扁於 2000 年發表，資料乙為馬英九於 2008 年發表，資料丙為李登輝於 1999 年發表，資料丁為蔣經國於 1979 年發表，故先後順序為(A)丁丙甲乙。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: '以下為同學們在歷史課上報告日本初領臺時，臺灣人的去留問題：

    甲同學：「甲午戰爭清廷戰敗後，將臺灣割讓予日本。」

    乙同學：「日本規定臺灣人民在 1987 年以前，有自行選擇國籍的權利。」

    丙同學：「在臺灣住民就決定日之後仍留在臺灣者，則一律入日本國籍。」

    丁同學：「事實上，願意留在臺灣並且被日本統治者的是少數。」

    請問哪些同學的報告是正確的？'
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 乙丙
  - label: C
    content: 甲丙
  - label: D
    content: 乙丁
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 甲丙的報告正確。乙：應為 1897 年；丁：留在臺灣者為多數，僅極少數人離開臺灣。答案選(C)。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 有份美國法案，內容如下：「任何企圖以非和平方式來決定臺灣前途之舉，包括使用經濟抵制及禁運手段在內，將被視為對西太平洋地區和平及安定的威脅，而為美國所嚴重關切……美國將使臺灣能夠獲得數量足以維持自衛能力的防衛物資及技術服務。……」請問這個國會法案通過的時代背景為何？
  options:
  - label: A
    content: 金門八二三砲戰
  - label: B
    content: 臺灣退出聯合國
  - label: C
    content: 中、美斷交
  - label: D
    content: 臺灣發表兩國論
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 由「美國將使臺灣能夠獲得數量足以維持自衛能力的防衛物資及技術服務」一句，即可推知此為美國國會通過的《臺灣關係法》，當時美國與中華民國斷交，因此制定此法以繼續與臺灣維持實質往來關係，(C)為正解。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 一位臺灣士紳為慶祝戰爭結束，寫了一副對聯：「四百餘里鯤鯓已去復返，五十一年婢僕垂死重生。」這位士紳要慶祝的是哪一事件？
  options:
  - label: A
    content: 臺灣民主國成立之際，慶祝臺灣脫離清朝統治
  - label: B
    content: 日俄戰爭中，日本戰勝了俄國，成為亞洲強權
  - label: C
    content: 一次世界大戰，日本戰勝，一躍成為世界強權
  - label: D
    content: 二次世界大戰，日本戰敗，臺灣回歸中華民國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從「五十一年婢僕垂死重生」一句，即可推知為日本戰敗，臺灣即將脫離日本的統治，答案為(D)。(A)臺灣民主國的年號為「永清」，可知其並非真心脫離清朝統治。(B)日俄戰爭使日本躋身世界強國之林。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 某人回憶道：他出生後，受到甲國統治。到了二十歲時，加入甲國航空隊，卻受到同儕的歧視，後來去攻打曾經是他祖國的乙國。不久，甲國戰敗，他又成為乙國國民。這個人的出生地最可能是在哪裡？
  options:
  - label: A
    content: 科西嘉
  - label: B
    content: 嘉義
  - label: C
    content: 特拉維夫
  - label: D
    content: 加爾各答
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 此人的國籍在甲乙兩國之間反覆變動，最可能為臺灣人，曾受到中國與日本政權的統治，並捲入中日兩國的戰爭中，戰後國籍又從日本變成中國，(B)為正解。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_9
  section: 1
  number: 9
  type: single
  page: 2
  stem: 1988 年，客家風雲雜誌社舉辦「還我母語遊行」，號召大批客家鄉親走上街頭爭取客家話的發言權。在遊行的文宣中寫道：「如果國父孫中山還活著的話，他上電視也不能說自己的客家話。」除了寫下客家運動的先頁，也促成客籍作家的覺醒與母語創作意識。請問此遊行的目的為何？
  options:
  - label: A
    content: 重建多元的語言政策
  - label: B
    content: 廢除使用已久的國語
  - label: C
    content: 恢復對孫中山的尊崇
  - label: D
    content: 使客家人進一步團結
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 早期國民政府在臺推行國語運動，使得各族群母語方言皆受到壓抑，甚至有消失的危機，因此客家族群於 1988 年發起「還我母語遊行」，訴求推動客語教育、開放客語廣播電視，展開客家語言、文學的復振運動，故(A)為正解。(B)國語不可能廢除。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 林清玄說，記憶中的童年，很少有穿新衣的經驗，我們的衣服都是撿哥哥的穿。有時候，聽說某一個操場有發放衣服，就會全家動員去排隊。由於規定每人只能領一件，並且不能挑選，所以帶回家的衣服通常過於巨大，好像蚊帳一樣。兄弟們就會議論紛紛：「阿凸仔，實在有夠大叢！」哥哥的舊衣和美國人的衣服，還是不夠穿。因此我們穿肥料袋和麵粉袋做的衣服。肥料袋印著「硫銨」等字樣，媽媽會把這兩字正好裁在胸前，我們兄弟多，組成一支棒球隊，自取為「硫銨棒球隊」。麵粉袋則前面印著「淨重 20 公斤」，後面印著「禁止用鐵鉤」，有時候，還有一隻美國手握著中國手，是中美合作的。請問這與哪一事件有關？
  options:
  - label: A
    content: 中日戰爭
  - label: B
    content: 韓戰
  - label: C
    content: 越戰
  - label: D
    content: 太平洋戰爭
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 題幹所指的「中美合作」即為美國對臺灣的援助，美國決定恢復對華關係與援助，與(B)韓戰爆發有關。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_11
  section: 1
  number: 11
  type: single
  page: 2
  stem: 某天小誠整理爺爺的舊倉庫時，無意中從書中翻飛出一張紅通通的紙幣，細看是臺灣銀行發行的萬元大鈔。爺爺笑著說了一個諺語：「厝內（家裡）柴、米、油、鹽、醬、醋、茶，啥米攏欠（什麼都缺），就是不欠（缺）錢。」請問這張鈔票訴說了臺灣哪個時期的故事，又為什麼不缺錢呢？
  options:
  - label: A
    content: 民國 37 年，因為國共內戰造成惡性通貨膨脹
  - label: B
    content: 民國 55 年，因為美援停止造成經濟緊縮，貨幣價值下降
  - label: C
    content: 民國 60 年，因退出聯合國造成經濟衰退
  - label: D
    content: 民國 40 年，因為陳誠發行新臺幣反促成通貨膨脹的惡化
  assets:
  - key: s1_11_f1
    kind: figure
    file: doc_111_台中_豐原_社會_歷史_g10s1e3/s1_11_f1.png
    crop:
      page: 2
      rect:
      - 379.9
      - 507.35
      - 564.3
      - 593.75
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從這張臺灣銀行發行的萬元鈔票可推知此時為通貨膨脹嚴重的時代，鈔票中的人物為孫文，因此可確定為國民政府統治時期，最可能為戰後初期，由於受到大陸國共內戰的牽累，臺灣輸出大量米糧物資支援，造成本地的惡性通貨膨脹，(A)為正解。(B)(C)並未造成惡性通貨膨脹。(D)發行新臺幣使物價趨於穩定。
- id: doc_111_台中_豐原_社會_歷史_g10s1e3_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 右圖為臺灣 1961 ～ 1980 年間出口總值減進口總值的折線圖。請問圖中顯示兩次驟降的原因為何？
  options:
  - label: A
    content: 八二三砲戰
  - label: B
    content: 中共對臺文攻武嚇
  - label: C
    content: 石油危機
  - label: D
    content: 波斯灣戰爭爆發
  assets:
  - key: s1_12_f1
    kind: figure
    file: doc_111_台中_豐原_社會_歷史_g10s1e3/s1_12_f1.png
    crop:
      page: 2
      rect:
      - 274.4
      - 672.6
      - 564.3
      - 807.5
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '圖中可以看到出口總值第一次驟降約在 1970 年代中期，是受到 1973 年石油危機的影響，至 1970 年代末期再度發生石油危機，故又有第二次驟降，故選(C)。

    13.1950 年代因為缺乏購買國外商品的外匯，因此決定開始發展本國的民生產業，是為(B)第一次進口替代時期。

    14.1953 年實施耕者有其田，政府以 70 ％實物土地債券及 30 ％四大公營事業股票補償地主，也因此使得少數地主轉而投資工業，答案選(A)。

    15.題幹所指為(A)日本在臺灣推行皇民化運動時期，欲以神道教取代民間宗教信仰，因此實施正廳改善與寺廟整理運動，積極抑制中國文化本質的傳統信仰，「眾神升天」活動即為當時的措施。

    16.表格中的對照組，僅(B)乙正確。(A)《國家統一綱領》改為「反攻大陸、光復國土」、「漢賊不兩立」。(C)「三民主義統一中國」改為「活路外交，承認『九二共識』」。(D)「反攻大陸光復國土」改為「終止《國家統一綱領》」。

    17.(A) 1960 年代出口擴張時期，臺灣發展勞力密集產業，吸引許多男女前往都市工廠工作，與婦女運動無關。(C)此時政府經濟政策由「進口替代」轉為「出口擴張」。(D)歌詞中的主角為工廠女工，非中小企業主。

    18.從臺北帝國大學的研究對象主要為熱帶、亞熱帶的人文與資源，即可推知其目標在為日本的南進政策從事基礎調查工作，為南進而準備，答案選(C)。

    19.1950 年代，臺灣相當依賴美援，當時主要出口國為日本；1960 年代後，美援逐漸減少，臺灣轉而從日本進口原料、零件，加工後出口到美國，因此甲、乙分別為(A)日本、美國。

    20.從題幹描述可知當時臺灣的宗教信仰受到某種程度的管控。(A)日治皇民化運動時期推動寺廟整理，此時推行神道教，本土宗教遭到打壓，與題目所述不符。(C)《憲法》保障人民有宗教信仰的自由，對宗教信仰少有干涉。(D)開山撫番與宗教信仰無關。

    21.1950 ～ 1960 年代，臺灣從進口替代走向出口擴張，出口商品以農產品加工、輕工業產品為主，因此(C)為正解。

    22.臺灣並不產麥，政府卻鼓勵人民「多吃麵，少吃米」，這是因為(A)美援中有許多麵粉，至於米則可以拿來外銷增加外匯，故才有此宣傳。

    23.陳誠認為佃農與地主的生活落差太大，會造成階級對立嚴重，因此必須實施土地改革以避免亂事發生，過去因階級對立而發生的亂事應為(C)，國民黨為避免重蹈覆轍，因此在臺灣推動土地改革以爭取農民的支持。(A)(B)(D)三者並非階級對立造成的事件。

    24.題幹提到「美援會」，美援的時間為 1951 ～ 1965 年，因此這位民意代表最可能為(B) 1960 年代的臺灣省議會議員。

    25.解嚴後，許多臺商要求政府全面開放赴大陸投資貿易，當時李登輝總統即以「戒急用忍」四字回應，認為兩岸的經貿交流不可過熱，亦不可驟然開放，必須再觀察一段時間，答案選(D)。

    26.從楹聯中可以找到「三山」與「國王」，此為潮州客家族群的原鄉神明，(A)為正解。

    27.萬應公、大眾爺之類的信仰，源自清治前期移墾社會因械鬥、原漢衝突或經濟因素等，客死異鄉的無主孤魂，(D)為正解。

    28.臺灣「自境外輸入原料、設備」，加工後再將「成品外銷」，此為 1960 年代(C)出口擴張時期的產業特色。

    29.1915 年噍吧哖事件假借宗教起事，因此在事件平息後，總督府對臺灣民間信仰展開宗教調查，目的在(B)防止類似噍吧哖事件再度發生。

    30.1920 年代大正民主時期，日本在臺推行內地延長主義，許多新文化、新思想在此時傳入臺灣，臺人的生活習慣與大眾娛樂出現明顯的變化，(A)為正解。(B) 1941 年。(C)荷西治臺時期已經引進西洋式建築。(D) 1951 年。

    31.公學校學生必須到神社參拜，最可能為二戰期間日本在臺推行皇民化運動時期，故(D)為正解。

    32.題幹所述為臺灣 1980 年代的新浪潮電影，結合鄉土文學，反映社會寫實面貌，使臺灣電影站上國際舞臺，(A)為正解。

    33.馬偕來自加拿大的(B)長老教會，此教派的傳教範圍在大甲溪以北。

    34.媽祖的歷史並非最悠久，祭祀活動也非最盛大，更非某地的原鄉神明，而是跨越族群與區域的共同信仰，因此(D)為正解。

    35.開澎進士蔡廷蘭曾因遭遇颱風漂至(A)越南，後來回國後寫成《海南雜著》。此外，從題幹所描述的王城建築特色，也可看出該國受中國文化影響頗深，因此判斷為越南。

    36.《精武門》與《八百壯士》皆是在抵抗日本人的欺凌，此為 1970 年代臺灣軍教片常見的題材，主要目的是在當時臺灣外交困頓的情況下，(C)提振民心與士氣。

    37.戰後臺灣文學發展依序為：反共文學→現代主義文學→鄉土文學→多元文學，因此四則文學的順序為(C)(乙)(丁)(甲)(丙)。

    38.題目所述為 1990 年的三月學運，(D)為正解。(A)此時已解除戒嚴，學生是訴求廢除《臨時條款》。(B)此次學運標誌為野百合。(C)當時的總統是李登輝。

    39.(C) 1970 年代，臺灣知識青年疾呼「唱自己的歌」，發起校園民歌運動。

    40.從某人的回憶內容，可看出因為環境的變遷使他出現國籍上的認同問題，(B)《亞細亞的孤兒》所描述的正是部分臺灣人的國籍與身分認同錯亂問題。

    41.陳進被稱為「閨秀畫家」，繪畫題材多為仕女生活，因此(D)為其創作。(C)為日本藝妓，非臺灣仕女。

    42.日治時期推動市區改正計畫，許多政府機關單位與公共設施皆改用西式建築風格，(B)即是日治時期所建，為今之臺灣博物館。(A)為霧峰林家萊園一景，屬中國園林建築。(C)為清朝時建設之臺北府城北門。(D)是臺南市立美術二館，為現代藝術建築。

    43.從剪辮子（代表清朝）痛哭、沒說「國語」（日語）要被毆打等線索，可推知此作家應生活在日治時期的臺灣，(D)為正解。

    44.查緝私菸為 1947 年(A)二二八事件的導火線，後來各地民怨沸騰，最終以政府大規模鎮壓清鄉收場。

    45.1937 年中日正式開戰，日本在臺推行皇民化運動，廢除公學校的漢文教育，因此理解日語的比率自然大增，(D)為正解。

    46.(A)《臺灣政論》為以臺灣本土知識分子為中心的政論雜誌，雷震未曾擔任其主編。(B)當時為戒嚴時期，雷震的政黨未能組成。(D)雷震是以「為匪宣傳」、「知匪不報」的罪名入獄。

    47.(C)四四南村建於 1948 年，當時政府尚未遷臺；且是提供給兵工廠的員工及其家屬居住，而非提供給軍人居住。

    48.(A)(C)臺灣目前各地仍保有眷村建築與文化，許多建物被指定為古蹟或歷史建築保存，並非罕見。(D)眷村建築有部分為日治時代的房舍，大部分則是國府遷臺後補助建設或是軍民自行搭建。

    49.(A)為東南亞美食。(C)為臺灣本地美食。(D)為原住民美食。僅(B)為眷村美食，為正解。

    50.(A)《美麗島》雜誌於 1979 年創刊，成為黨外人士重要的發聲宣傳，卻在年底時發生高雄美麗島事件，重要幹部皆遭逮捕、判刑，雜誌社也因此遭查封。(B)(C)(D)皆不符合雜誌創刊同年即被查封的條件。

    51.題幹指出臺灣在各方面的情形「都比內地好」，因此可推知此「內地」並非日本，而是中國，故而這應是在二戰結束之後的情景，(C)為正解。'
