  stem: 下列有關「化石」的敘述，何者正確？
  options:
  - label: A
    content: 化石群專指位於相同地區、分布於不同年代的化石
  - label: B
    content: 古生物演化遇程緩慢且連續，因此可透過化石辨別古生物出現的順序
  - label: C
    content: 古生物死亡後，留下的腳印、骨骼、穀體等，稱為「生痕化石」
  - label: D
    content: 地質年代表中，同時包含相對地質年代與絕對地質年代，其中絕對地質年代為利用化石定年的結果
