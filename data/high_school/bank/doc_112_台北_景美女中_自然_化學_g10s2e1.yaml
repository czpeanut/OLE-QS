  section: 1
  number: 1
  type: single
  page: 1
  stem: '下列各項的敘述，有幾項情境為相同的分離原理？

    情境一：東漢蔡倫以大麻與少量苧麻纖維為原料，再用細簾子撈取紙漿

    情境二：洗米過程，透過傾斜容器將洗米水捨棄

    情境三：自來水處理利用細砂池將雜質去除

    情境四：製作豆干用棉網初步分離豆漿和豆渣的過程

    情境五：將葉片在酒精中加熱浸煮，溶出葉綠素'
  options:
  - label: A
    content: 兩項
  - label: B
    content: 三項
  - label: C
    content: 四項
  - label: D
    content: 五項
  - label: E
    content: 以上情境的分離方法皆不同
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 情境一：過濾；情境二：傾析；情境三：過濾；情境四：過濾；情境五：萃取。
