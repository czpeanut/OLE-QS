  stem: 下列有關物質的分類與變化，何者正確？
  options:
  - label: A
    content: 透明的礦泉水是純物質
  - label: B
    content: 化合物與混合物的組成比例均固定不變
  - label: C
    content: 均勻系皆是純物質，不均勻系皆是混合物
  - label: D
    content: 物質產生化學變化時，其組成、結構及性質會改變
  - label: E
    content: 混合物中各組成之物質仍然保有原來的特性，且熔、沸點為定值
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)礦泉水是混合物。

    (B)混合物的組成比例會有變動。

    (C)混合物有均勻與不均勻混合兩類。

    (D)物質產生化學變化時，其組成、結構及性質會改變。

    (E)混合物中的熔點、沸點不固定。'
