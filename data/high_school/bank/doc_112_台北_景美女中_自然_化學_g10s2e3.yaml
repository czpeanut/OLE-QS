- id: doc_112_台北_景美女中_自然_化學_g10s2e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 阿西同學在不同的溫度分別進行化合物甲■與化合物乙●在水中的溶解度實驗，得到的結果如右圖。已知該圖的溶解度的單位為每 100 克的水所溶解的化合物質量（克），則下列敘述，哪一項正確？
  options:
  - label: A
    content: 在 70 ℃時，乙的溶解度大於甲的溶解度
  - label: B
    content: 在 70 ℃時，甲的溶解度約為乙的兩倍
  - label: C
    content: 於 80 ℃時，將 10 克甲溶於 25 克水中，將此溶液溫度緩慢降低至 50 ℃，溶液中會出現化合物甲結晶
  - label: D
    content: 當溶液溫度上升，乙的溶解度愈來愈大
  - label: E
    content: 於 50 ℃時，乙的飽和溶液其重量百分濃度約為 33.3％
  assets:
  - key: s1_4_f1
    kind: figure
    file: doc_112_台北_景美女中_自然_化學_g10s2e3/s1_4_f1.png
    crop:
      page: 1
      rect:
      - 431.65
      - 494.15
      - 564.6
      - 599.4
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)由題圖可知，在 70 ℃ 時，甲的溶解度大於乙。

    (B)在 90 ℃ 時，甲的溶解度才約為乙的兩倍。

    (C)在 50 ℃ 時，甲的溶解度為 50 克∕100 克水，即在 25 克水中可溶解 12.5 克甲，故溶液中仍不會出現化合物甲結晶。

    (D)溫度上升，乙的溶解度是先增後減。

    (E)乙在 50 ℃ 時的溶解度為 50 克∕100 克水，其重量百分率濃度 ％＝$\frac{50}{100+50}$×100％，約為 33.3％。'
