  stem: '廣用指示劑一般用來指示溶液的酸鹼性，其試劑的配方是由酚酞、溴瑞香草酚藍、甲基紅、百里酚藍指示劑混合而成。已知各種指示劑的 pH 值變色範圍與酸鹼型顏色如下表：

    | 指示劑 | 酸型顏色 | pH 值變色範圍 | 鹼型顏色 |

    | --- | --- | --- | --- |

    | 酚 酞 | 無 | 8.2～10.0 | 紅 |

    | 溴瑞香草酚藍 | 黃 | 6.0～7.6 | 藍 |

    | 甲基紅 | 紅 | 4.2～6.3 | 黃 |

    | 百里酚藍（第 1 變色） | 紅 | 1.2～2.8 | 黃 |

    | 百里酚藍（第 2 變色） | 黃 | 8.0～9.6 | 藍 |

    請問廣用指示劑在 pH 值為 3、7 及 12 的溶液中，依序呈色各為何？'
  options:
  - label: A
    content: （紅，綠，藍）
  - label: B
