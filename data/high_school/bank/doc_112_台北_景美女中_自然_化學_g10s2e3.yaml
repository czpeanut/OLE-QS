  type: single
  page: 1
  stem: 下列有關電解質的敘述，何者正確？
  options:
  - label: A
    content: 電解質水溶液呈電中性
  - label: B
    content: 弱電解質在水中不解離
  - label: C
    content: 電解質藉自由電子導電
  - label: D
    content: 電解質水溶液在通電時陽離子流向陽極
  - label: E
    content: 電解質水溶液中，陰、陽離子的數目必相等
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)電解質溶液中，陰、陽離子所帶總電量相等，故溶液呈電中性。

    (B)弱電解質是解離度小，而非不解離。

    (C)電解質的導電是藉由陰、陽離子的移動。

    (D)電解質水溶液在通電時陽離子流向陰極。

    (E)電解質溶液中，陰、陽離子數目不一定相等，例如：$MgCl_{2}$(aq) 之陰離子數目為陽離子數目的 2 倍。'
