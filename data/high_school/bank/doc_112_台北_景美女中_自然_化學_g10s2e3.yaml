    content: （橙，綠，紫）
  - label: E
    content: （橙，藍，紫）
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 由題表中指示劑變色範圍可判斷 pH 值為 3 的溶液呈色為黃與紅的中間色，即為橙色，pH 值為 7 的溶液呈色為黃與藍的中間色，即為綠色，pH 值為 12 的溶液呈色為紅與藍的中間色，即為紫色。
