  section: 1
  number: 19
  type: single
  page: 3
  stem: '亞硝酸根可當氧化劑也可當還原劑，有一反應式如下，試問關於此反應的敘述何者正確？

    $NO_{2}^{－}$(aq)＋Cu(s)＋$H^{＋}$(aq) → NO(g)＋$Cu^{2＋}$(aq)＋$H_{2}$O(l)（未平衡）

    （原子量：H＝1，O＝16，N＝14，Cu＝64）'
  options:
  - label: A
    content: 此反應式的係數和為 10
  - label: B
    content: 銅在此反應中是氧化劑，亞硝酸根是還原劑
  - label: C
    content: 還原劑若消耗 1 莫耳，氫離子會用去 2 莫耳
  - label: D
    content: 若此反應還原劑轉移 1 莫耳電子，則會生成水 18 克
  - label: E
    content: 在反應一段時間後，此溶液的 pH 值會下降
  group_stem: 亞硝酸鹽為合法可使用之食品添加物，常被添加於香腸、臘肉、火腿、培根等肉類加工品，主要是作為保色劑，使肉類色澤紅潤以維持良好外觀及增加醃漬風味，亦可抑制肉毒桿菌生長。但由於吃多對人體有不良影響，故可多吃含有「清除自由基」的高抗氧化力之水果，如：芭樂，因其富含維生素 C、E 等，可消除亞硝酸鹽。
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)此反應式平衡係數後為 $2NO_{2}^{－}$(aq)＋1Cu(s)＋$4H^{＋}$(aq) → 2NO(g)＋$1Cu^{2＋}$(aq)＋$2H_{2}$O(l)，係數總和為 12。

    (B)銅在此反應中是還原劑，亞硝酸根是氧化劑。

    (C)還原劑（Cu）若消耗 1 莫耳，氫離子會用去 4 莫耳。

    (D) Cu → $Cu^{2＋}$＋$2e^{－}$，每轉移 2 莫耳電子，生成 2 莫耳水，因此轉移 1 莫耳電子，則會生成水 18 克。

    (E)在反應一段時間後，此溶液的 pH 值會因氫離子變少而上升。'
