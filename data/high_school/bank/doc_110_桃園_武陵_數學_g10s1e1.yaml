  stem: 有一道數學題目如下： 「已知不等式 | ax－2 | ≤ b的解為－4 ≤ x ≤ 10，試問數對 ( a , b ) 為何？」 而學生小明的解法如下： 步驟一：將 | ax－2 | ≤ b拆絕對值，得到－b ≤ ax－2 ≤ b。 步驟二：將不等式一同＋2，得到2－b ≤ ax ≤ 2＋b。 步驟三：將不等式一同÷a，得到$\frac{2-b}{a}$ ≤ x ≤ $\frac{2+b}{a}$。 步驟四：將步驟三求出的解對照題目的條件－4 ≤ x ≤ 10，得到聯立方程式：$\begin{cases}\frac{2-b}{a}=-4 \\ \frac{2+b}{a}=10\end{cases}$。 步驟五：將聯立方程式移項並整理，解出a＝$\frac{2}{3}$，b＝$\frac{14}{3}$。 學生小明的答案雖然是正確的，但這種解法在某些題目會出現問題，試問： 在沒有計算錯誤的前提下，此種解法在哪一步驟會出問題？為什麼？
  answer:
  - 步驟三會出現問題，因為無法確定a的正負， 若a＜0，會變成$\frac{2-b}{a}$ ≥ x ≥ $\frac{2+b}{a}$。
