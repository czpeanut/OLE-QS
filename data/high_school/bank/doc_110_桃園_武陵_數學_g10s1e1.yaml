  stem: 請選出下列敘述正確的選項。
  options:
  - label: A
    content: 3.1415926為有理數
  - label: B
    content: $\sqrt{3+2\sqrt{2}}$－$\frac{1}{\sqrt{2}+1}$為無理數
  - label: C
    content: 若$a^{100}$、$a^{97}$、$a^{95}$均為有理數，則a必為有理數
  - label: D
    content: 設a，b為有理數，且a＋b$\sqrt{2}$＝0，則a＝b＝0
  - label: E
    content: 若$\frac{a}{b}$為有理數，且b為無理數，則a必為0
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 3.1415926為有限小數，故為有理數 ( 正確 )。 (B) $\sqrt{3 +2\sqrt{2}}$－$\frac{1}{\sqrt{2}+1}$＝$\sqrt{2}$＋1－($\sqrt{2}$－1 )＝2 ∈ Q ( 錯誤 )。 (C) $a^{100}$，$a^{97}$，$a^{95}$ ∈ Q， $\frac{a^{100}}{a^{97}}$＝$a^{3}$ ∈ Q……①，$\frac{a^{97}}{a^{95}}$＝$a^{2}$ ∈ Q……② ⇒ $\frac{①}{②}$ ⇒ $\frac{a^{3}}{a^{2}}$＝a ∈ Q ( 正確 )。 (D) a，b ∈ Q， a＋b$\sqrt{2}$＝0 ⇒ a＝0且b＝0 ( 正確 )。 (E) 舉反例， 設a＝2$\sqrt{2}$，b＝$\sqrt{2}$， $\frac{a}{b}$ ∈ Q，b為無理數 ( 錯誤 )。 故選(A)(C)(D)。
