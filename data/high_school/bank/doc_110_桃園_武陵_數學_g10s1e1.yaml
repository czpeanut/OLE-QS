- id: doc_110_桃園_武陵_數學_g10s1e1_s1_2
  section: 1
  number: 2
  type: multiple
  page: 1
  stem: 假設x為實數，請選出下列敘述正確的選項。
  options:
  - label: A
    content: 若x＞0，則$\sqrt{x^{2}+x^{-2}+2}$＝x＋$x^{－1}$
  - label: B
    content: 若x＞0，則$\sqrt{x^{2}+x^{-2}-2}$＝x－$x^{－1}$
  - label: C
    content: 若x＜0，則$2^{x}$＞0
  - label: D
    content: 若0＜x＜1，則1＜$2^{x}$＜2
  - label: E
    content: 若x＞0，則$2^{x}$＋$2^{－x}$有最小值＝2
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) x＞0， $\sqrt{x^{2}+x^{-2}+2}$＝| x＋$x^{－1}$ |＝x＋$x^{－1}$ ( 正確 )。 (B) 舉反例， 設x＝$\frac{1}{2}$， $\sqrt{x^{2}+x^{-2}-2}$＝| x－$\frac{1}{x}$|＝$\frac{1}{x}$－x＝2－$\frac{1}{2}$＝$\frac{3}{2}$ ( 錯誤 )。 (C) y＝$2^{x}$恆在x軸上方 ( 正確 )。 (D) 0＜x＜1 ⇒ $2^{0}$＜$2^{x}$＜$2^{1}$ ⇒ 1＜$2^{x}$＜$2^{1}$ ( 正確 )。 (E) $\frac{2^{x}+2^{-x}}{2}$ ≥ $\sqrt{2^{x}\cdot 2^{-x}}$ ⇒ $2^{x}$＋$2^{－x}$ ≥ 2， “＝”成立時，x＝0， 但實數具稠密性， $\lim_{x\rightarrow 0^{+}}$( $2^{x}$＋$2^{－x}$ )＝2 ( 正確 )。 故選(A)(C)(D)(E)。
