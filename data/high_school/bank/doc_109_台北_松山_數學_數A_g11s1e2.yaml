- id: doc_109_台北_松山_數學_數A_g11s1e2_s4_1
  section: 4
  number: 1
  type: single
  page: 1
  stem: 已知下列選項中有一個是「班佛定律」以x為首位數字的數出現機率約為y的關係式，請根據上述數據判斷出是哪一個選項？(單選)
  options:
  - label: A
    content: y＝log ( x＋1 )
  - label: B
    content: y＝0.3－log x
  - label: C
    content: y＝log ($\frac{x+1}{x}$)
  - label: D
    content: y＝log ($\frac{5}{2}$－$\frac{x}{2}$)
  group_stem: 「班佛定律」是在說明一堆從實際生活得出的數據中，以1為首位數字的數出現機率約為30.1%，以2為首位數字的數出現機率約為17.6%，並非直覺認為的皆是$\frac{1}{9}$。「班佛定律」可用於檢查各種數據是否造假，使用條件有2點，第一是數據至少要有3000筆以上，第二是不能有人為操控。當一組數據是自然產生，排序會接近班佛定律的「理想曲線」，該定律經常用於檢查會計、金融以及選舉有無造假。根據上述，回答下列問題。
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ×：y＝log ( 1＋1 )＝log 2 ≈ 0.301，y＝log ( 2＋1 )＝log 3 ≈ 0.4771 ( 不合 )。 (B) ×：y＝0.3－log 1＝0.3，y＝0.3－log 2 ≈ 0.3－0.301＝－0.001 ( 不合 )。 (C) ○：y＝log ($\frac{1+1}{1}$)＝log 2 ≈0.301，y＝log ($\frac{2+1}{2}$)＝log 3－log 2 ≈ 0.4771－0.301＝0.1761。 (D) ×：因為$\frac{5}{2}$－$\frac{x}{2}$＞0，所以x＜5 ( 不合 )。 故選(C)。
- id: doc_109_台北_松山_數學_數A_g11s1e2_s4_2
  section: 4
  number: 2
  type: calc
  page: 1
  stem: 在2020年某國總統大選造假爭議不斷，有人分析某位候選人在某地區的所有開票所的得票數，發現得票數是以4為首位數字的開票所大約有970個，根據「班佛定律」推測，得票數是以6為首位數字的開票所大約有幾個？
  group_stem: 「班佛定律」是在說明一堆從實際生活得出的數據中，以1為首位數字的數出現機率約為30.1%，以2為首位數字的數出現機率約為17.6%，並非直覺認為的皆是$\frac{1}{9}$。「班佛定律」可用於檢查各種數據是否造假，使用條件有2點，第一是數據至少要有3000筆以上，第二是不能有人為操控。當一組數據是自然產生，排序會接近班佛定律的「理想曲線」，該定律經常用於檢查會計、金融以及選舉有無造假。根據上述，回答下列問題。
  answer:
  - 670個
  answer_status: verified
  answer_source: answer_key
  explanation: 設以6為首位數字的開票所大約有k個， 可知$\frac{\log (\frac{4+1}{4})}{\log (\frac{6+1}{6})}$＝$\frac{970}{k}$， ⇒ k＝$\frac{970\log \frac{7}{6}}{\log \frac{5}{4}}$＝$\frac{970 (\log 7-\log 2-\log 3)}{\log 5-2\log 2}$ ≈ $\frac{970 (0.8451-0.301-0.4771)}{0.699-2\times 0.301}$＝670， 故大約有670個。
