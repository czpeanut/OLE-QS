- id: doc_109_台北_松山_數學_數A_g11s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 若$log_{ 3}$ a＝2，$log_{ 4}$ b＝2，試問$log_{ 5}$ ( a＋b ) 最接近的整數為何？
  options:
  - label: A
    content: '1'
  - label: B
    content: '2'
  - label: C
    content: '3'
  - label: D
    content: '4'
  - label: E
    content: '5'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: $\begin{cases}\log _{3}a=2 \\ \log _{4}b=2\end{cases}$ ⇒ $\begin{cases}a=3^{2}=9 \\ b=4^{2}=16\end{cases}$ ⇒ $log_{ 5}$ ( a＋b )＝$log_{ 5}$ ( 9＋16 )＝$log_{ 5}$ 25＝2， 故選(B)。
- id: doc_109_台北_松山_數學_數A_g11s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 有一詐騙集團宣稱投資某商品，固定每年的年報酬率為100%，並以每日複利計算。若投資此商品1萬元，經過10年後可得到的本利和最接近下列哪個選項？
  options:
  - label: A
    content: 1千萬
  - label: B
    content: 5千萬
  - label: C
    content: 1億
  - label: D
    content: 2億
  - label: E
    content: 3億
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 10年後的本利和為 $10^{4}$ ( 1＋$\frac{1}{365}$)$^{3650}$＝$10^{4}$ ( ( 1＋$\frac{1}{365}$)$^{365}$ )$^{10}$ ≈ $10^{4}$．$e^{10}$ ≈ $10^{4}$．( 2.7 )$^{10}$， ＝$10^{4}$．( $3^{3}$．$10^{－1}$ )$^{10}$＝$3^{30}$．$10^{－6}$ ≈ ( $10^{04771}$ )$^{30}$．$10^{－6}$＝$10^{8.313}$， ＝$10^{0.313}$．$10^{8}$ ≈ 2．$10^{8}$， 故選(D)。
