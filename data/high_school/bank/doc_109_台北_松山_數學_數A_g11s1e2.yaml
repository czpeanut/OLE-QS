- id: doc_109_台北_松山_數學_數A_g11s1e2_s2_2
  section: 2
  number: 2
  type: multiple
  page: 1
  stem: 一種注射藥劑在病人血液中的量須維持在600mg以上，否則病人就會有生命危險。現給某病人注射這種藥劑2400mg，如果藥在血液中以每2小時20%的比例衰減，試問下列選項何者正確？
  options:
  - label: A
    content: 注射後4小時，此病人血液中的藥量約為1536mg。
  - label: B
    content: 注射後4小時，此病人血液中的藥量約為1920mg。
  - label: C
    content: 注射後大約經過6小時，病人需補打下一劑。
  - label: D
    content: 注射後大約經過9小時，病人需補打下一劑。
  - label: E
    content: 注射後大約經過12小時，病人需補打下一劑。
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) ○：4小時後的藥量約為2400×$(0.8)^{\frac{4}{2}}$＝2400×0.64＝1536 ( mg )。 (B) ×：承(A)可知，錯誤。 (C) ×：2400×$(0.8)^{\frac{t}{2}}$≥ 600 ⇒ $(0.8)^{\frac{t}{2}}$≥$\frac{1}{4}$⇒ log$(0.8)^{\frac{t}{2}}$≥ log$\frac{1}{4}$⇒ $\frac{t}{2}$( 3log 2－1 ) ≥ －2 log 2 $\frac{t}{2}$×( 3×3.301－1 ) ≥ －2×0.301 ⇒ t ≤ 12.4， 所以約經過12小時，病人需補打下一劑。 (D) ×：承(C)可知，錯誤。 (E) ○：承(C)可知，正確。 故選(A)(E)。
