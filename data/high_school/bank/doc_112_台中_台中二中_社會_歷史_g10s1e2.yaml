- id: doc_112_台中_台中二中_社會_歷史_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 大正 13 年（1924 年），辜顯榮、林熊徵等人召開全島有力者大會，並發表〈全島有力者大會決議書〉：「本島一部少數者，不滿足於臺灣文化現狀，妄為空想所驅，每於帝國議會開會時，作臺灣議會設置請願。其中一部，藉口於請願，面議臺灣之制度文物，以惑人心。甚至有破禁而觸法者，彼等敢行如是之不純行為，不但為本島前途憂慮，實為吾人所最憾之處。茲開全島有力者大會，以明如是之盲動，非本島民大多數之意思，同時鑑於時局之重大，期益自重，不背於正道也。」請問對於這份決議書及相關背景，我們應該如何理解？
  options:
  - label: A
    content: 辜顯榮、林熊徵應都贊成設置臺灣議會
  - label: B
    content: 當時的臺灣社會氛圍正處於白色恐怖
  - label: C
    content: 資料中的「破禁而觸法」是指治警事件
  - label: D
    content: 《動員戡亂時期臨時條款》使他們被判刑
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)從題文可知辜顯榮、林熊徵等「有力者」反對設置臺灣議會。(B)大正 13 年為日治內地延長主義時期。(C)為正解。(D)此時期實施「法三號」，「破禁而觸法」者被以違反《治安警察法》判刑。
- id: doc_112_台中_台中二中_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 蔣中正稱某次戰役之勝利「不但保住了金門，更保住了臺灣」，而陳誠代理蔣赴前線慰問將士時，亦評論該戰役「造成東南軍事勝利的開端，給國人一個失敗心理的改變」，且「預兆著今後國家前途的光明」。這個戰役應是
  options:
  - label: A
    content: 韓戰
  - label: B
    content: 古寧頭戰役
  - label: C
    content: 一江山戰役
  - label: D
    content: 八二三戰役
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 此戰役「保住了金門」，也「給國人一個失敗心理的改變」，可推知此戰役與金門有關，且之前國軍一直都處於戰敗狀態，因此判斷這個戰役應為 1949 年(B)古寧頭戰役，阻止中共「拿下金門，解放臺灣」的企圖。
- id: doc_112_台中_台中二中_社會_歷史_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 得知《馬關條約》割臺消息無可挽回之後，臺灣官紳曾向清政府拍發電文如下：「伏查臺灣為朝廷棄地，百姓無依，惟有死守，據為島國，遙戴皇靈，為南洋屏蔽。」此言代表當時部分臺灣官紳的主張，而以下敘述何者較能恰當反映其心態？
  options:
  - label: A
    content: 仍期待回歸清廷
  - label: B
    content: 無心抗拒日本接收
  - label: C
    content: 欲成立自由民主的獨立國家
  - label: D
    content: 諷刺清朝之軍力不如日本
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 從「惟有死守，據為島國，遙戴皇靈，為南洋屏蔽」等句，可見其堅決抗日，(A)仍期待回歸清廷。(B)堅決抗拒日本接收。(C)臺灣民主國非自由民主的國家。(D)並無此意。
- id: doc_112_台中_台中二中_社會_歷史_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 3 則資料依先後順序為何？
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙甲
  - label: C
    content: 乙甲丙
  - label: D
    content: 丙乙甲
  group_stem: '資料甲：「在合理範圍以內，美國所做任何事，都沒有改變中國局勢的可能；美國若做其所未做的事，對局勢也不會產生影響，這是中國內部勢力造成的結果，結局是中國內部所決定的，是一方怠忽職責所形成的。」

    資料乙：美國參議院正式通過某一條約。當時臺灣方面有人不滿這個條約，認為這個條約造成大陸沿海島嶼的喪失，使得「反攻大陸」最終只能淪落為口號。但是相對的，臺灣的安全發展，也因這條約而獲得一定程度的保障。

    資料丙：此法所規範中華民國與美國關係的美國法律，並非國際條約，而是美國的國內法。依此法，中、美二國並未「承諾」保障臺灣安全，但卻表明「西太洋地區」的和平及穩定，關乎美國利益，任何破壞和平的手段，美國將會嚴重「關切」。而此法也確實為兩岸之間提供了和平穩定的結構。

    以上是有關中美外交的幾段資料，根據資料，請問：'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 資料甲中，美國撇清與中國大陸的關係，認為局勢演變乃中國大陸自身的責任，故為 1949 年的《中美關係白皮書》；資料乙為 1954 年《中美共同防禦條約》，美國防禦臺灣及澎湖諸島及其周圍，因此有人認為會造成中國大陸沿海島嶼喪失；資料丙為美國的國內法，應為 1979 年《臺灣關係法》。3 則資料出現的時間依序為(A)甲乙丙。
