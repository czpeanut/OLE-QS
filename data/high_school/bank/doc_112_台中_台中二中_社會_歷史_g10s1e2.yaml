- id: doc_112_台中_台中二中_社會_歷史_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 臺南市古蹟安平古堡磚臺前立有石碑，上書「安平古堡」，此石碑原為日據末期日人所立之「贈從五位濱田彌兵衛武勇之趾」石碑。戰後，中華民國政府將原濱田彌兵衛事件碑改為如今所看到的安平古堡 4 字。這應是日本政府要紀念 300 年前濱田彌兵衛等人對抗何國人之事蹟？
  options:
  - label: A
    content: 荷蘭人
  - label: B
    content: 美國人
  - label: C
    content: 西班牙人
  - label: D
    content: 中國人
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '「安平古堡」曾是 17 世紀濱田彌兵衛對抗(A)荷蘭人的地點，因此日本總督府才會在當地立碑紀念。

    9.1990 年公布的大法官釋憲，第一屆中央民意代表應於民國 80 年 12 月 31 日前停止行使職權，代表「萬年國會」即將結束，此為野百合學運的重大成果，答案為(D)。(A)(B)《動員戡亂時期臨時條款》的改訂。(C)「當前情勢」指野百合學運。

    10.從附圖可看出臺灣貿易在 1869 年前後轉為出超，(A) 1875 年廢除，(C)丁日昌於 1876 年來臺，(D)臺灣於 1885 年建省，3 者時間皆不符，因此答案為(B)。1860 年簽訂《北京條約》，1861 年淡水及安平陸續開港，1863 年雞籠正式開港，1864 年打狗正式開港，對外貿易量愈來愈大。

    11.蔣渭川、王添灯為臺北市二二八事變處理委員會成員，可判斷題文所述的歷史事件為二二八事件，因此(B)為正確答案。(A)當時臺灣的主管機關是行政長官公署。(C)事變指國民政府接收臺灣後，措施失當造成的混亂。(D)當中央派兵來臺後，事變處理委員會成員皆被指為煽動叛亂而處死。

    12.臺灣距離中國大陸沿岸最近的港口為(B)鹿港，因此開港後快速發展成中部的大都市。

    13.從不許臺灣人供奉神主牌與傳統神像的禁令，可推知為(D)皇民化運動時期，總督府在臺推行神道教信仰。

    14.甲鼓勵民眾連署，應是臺灣議會設置請願運動，乙的作為可推知其為臺灣文化協會，因此(B)為正確答案。(A)甲：走的是政治請願路線；乙：走的是文化啟蒙路線。(C)乙：由林獻堂、蔣渭水、蔡培火領導。(D)甲：未獲日本國會支持；乙：遭總督府監控。

    15.鄉試是到省城應試，從到福州應考變成到臺北應考，表示臺灣已經建省，可見他經歷過(C)清法戰爭。

    16.從題文可知此法律條文係針對抗日者、暴徒，皆以死刑重懲，可推知為威嚇臺灣人民的(A)匪徒刑罰令，使法院可以依法速審速決。(B)規定保甲制度的任務與罰責。(C)(D)為日本在殖民地所實施的統治法源。

    17.1996 年選出的總統為李登輝，之後他提出兩岸為「特殊的國與國關係」，引發中共強烈抗議，答案為(B)。

    18.在「減四留六」政策下，大租戶將減少 4 成地租收入，並不必向政府繳納正供，失去土地所有權，答案為(D)。(A)此非清政府作法。(B)小租戶成為實際的地主。(C)大租收入減少 40 ％。

    19.使總統可以連選連任、第一屆國會議會改成終身職的法源為(B)《動員戡亂時期臨時條款》。

    20.日治時期成立保甲制度與壯丁團，協助警察執行業務，答案為(A)。

    21.18 世紀初期已是清治前期，因此(B)為正解。(A)「天興縣」為鄭氏時期的行政區劃，清初應為「諸羅縣」或「彰化縣」。(C)政府承認原住民族的土地所有權，並且禁止漢人侵墾。(D)此時尚未開港通商，茶葉還未引入臺灣。

    22.題文所述為 1990 年野百合學運，當時的 4 大訴求中包括廢除《動員戡亂時期臨時條款》，在社會壓力下，立法院火速廢止《懲治叛亂條例》、《戡亂時期檢肅匪諜條例》，並於 1992 年(D)修正《刑法》一百條內容，正式結束白色恐怖。(A)首次政黨輪替在 2000 年。(B)當時的李登輝總統並非民選。(C)促成第一屆中央民意代表下臺，改選出第二屆中央民意代表。

    23.馬祖司法業務多交由軍事機構審理，與臺灣制度不同，顯見其地位的特殊性，故答案為(C)。(A)紀錄無誤，馬祖地區因位於反共前線而有特殊制度。(B)此僅呈現馬祖的行政區域，並非實施特殊制度的真正原因。(D)竊盜罪屬於刑事案件，會由連江縣政府軍法室偵審。

    24.菲律賓為西班牙的殖民地，因此可推知□□應為(B)西班牙人。

    25.資料一敘述一樁英國與日本的海上糾紛事件，未多加評論，屬於歷史事實；資料二說明「阿婆浪港」歇後語的由來，但學者也說明相關故事有多種版本，故屬於歷史解釋，也有其一定程度的參考價值，(C)為正解。

    26.題文所述外語能力強的「他們」應是指買辦，正確答案為(D)。(A) 1860 年臺灣開港後。(B)買辦主要從事國際貿易，非兩岸對渡貿易。(C)應是雞籠、淡水、安平、打狗等通商口岸。

    27.從「撤銷專賣局與貿易局」一項，即可知此訴求與二二八事件有關，(A)為正解。

    28.二次大戰後，中華民國與日本簽訂(D)《中日和約》，正式結束雙方的戰爭關係。(A)並非條約。(B)內容與日本無關。(C)中華民國未派代表簽約。

    29.此民變的起因與清丈土地有關，故為(A)施九緞事件。(B)因吏治敗壞。(C)(D)與查緝會黨有關。

    30.題文所述為臺灣歷任總統針對(B)臺人對中國大陸的投資一事，提出不同的政策。

    31.(A)(B)(D)皆為陳水扁總統時期的作為。

    32.(C)《三一法》於 1907 ～ 1921 年實施，橫跨第一、二兩個階段；1921 年後皆實施《法三號》。

    33.這段兩岸婚姻當事者定居臺灣，因此該向(C)海基會諮詢相關問題。(A)中國大陸的民間機構。(B)臺灣的官方機構。(D)中國大陸的官方機構。

    34.從不可認為臺灣的住民為日本人、應視為外國人的說法，可知福澤諭吉不贊同對臺灣人民實施同化政策，因此他所針對的官員與政策應為(D)田健治郎：內地延長主義。

    35.兩岸分工貿易期間，臺灣輸往中國大陸的商品以(A)稻米、蔗糖等農產品為主。

    36.(D)《六三法》撤廢運動使林獻堂等知識分子陷入是否保持臺灣的特殊性的兩難困境，最後決定拒絕日本的同化，改推行臺灣議會設置請願運動，追求臺灣自治。

    37.(A) 1800 年前已有漢人開發濁水溪流域。(B)水災也可能是人禍。(C)清廷於 1870 年代才積極治臺。因此(D)為正解，由於漢人向上游山區的開發，破壞濁水溪的水土保持與生態環境。

    38.(B)在蛤仔難「開墾有年」的是越界私墾的民人（漢人）與熟番。

    39.戒嚴時期，臺灣人無法自由出入國境，題文所述的現象持續到 1987 年解嚴後為止，答案為(C)。

    40.從年代與人數來看，最可能是推行國語家庭，而提升(A)臺灣人能理解日語的人口數統計。(B)(C)(D) 3 者的人口數不可能成長得如此多。

    41.題文所述為為日治時期 1935 年的地方選舉，因此答案為(B)。

    42.漢文課從每週 12 小時逐漸演變成完全廢止，可推知此時總督府正推行皇民化運動，答案為(C)。(A)荷治時期的教會學校針對原住民，不會教授漢文課。(B)(D)政權不會廢止漢文課。

    43.附表為(A)民眾與警察人數的比率，日本治安最好，因此警察密度最低，臺灣為日本統治區域中警察密度最高的地方。(B)日本不可能文盲比率最高。(C) 1920 年代臺灣尚未工業化，不可能工業用電比率如此高。(D)日本鐵路密度不可能比臺灣、朝鮮低。

    44.「靠右邊走」為美系的交通規則，臺灣於日治時期使用英系的交通規則而「靠左邊走」，因此於(B)光復之後，國民政府來臺時行「去日本化」而有此宣傳。'
