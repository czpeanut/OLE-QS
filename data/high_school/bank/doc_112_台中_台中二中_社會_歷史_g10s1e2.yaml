  stem: 「我們聽說要查考國家的文明與野蠻，只好看各地方都市的娛樂設備，……要依照市街大小、人口分布的狀況，廣設各式大小公園和娛樂場，更要設庭球或野球、蹴球的地方，其他游泳池及各種的娛樂器具……」以上描述呈現出日治時期哪一觀念的出現與總督府的何種作為有關？
  options:
  - label: A
    content: 重視公共衛生，建立現代醫療體系
  - label: B
    content: 改良傳統陋習，倡導成立風俗改良會
  - label: C
