  stem: 學者指出：「來臺的移民艱苦創業，除因疾病、天災死亡者外，也有參加械鬥、起事而身亡者，或是抵抗外族侵略而陣亡者，若未接受奉祀，終將成為「孤魂」。民間認為，若任由無祀孤魂遊蕩，其將化為厲鬼對陽間人類作祟。因此，除7月「普渡」廣祀孤魂野鬼外，民間還為那些渡臺打拚絕嗣無祀的移民立了許多廟宇，以安撫祖先同鄉好兄弟之靈魂，也使自身的心靈得到慰藉，反映先民開拓臺灣所付出的代價，以及臺灣歷史發展的某些特性。成為由民間創造的，充滿了人情味的神靈。」請問：上述題幹所指是那種廟宇？
