questions:
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 西班牙人原本希望以北臺灣做為對日貿易跳板，然而除了1626-1642年間有短暫榮景外，後來幾乎難以施展。請問：主要原因為何？
  options:
  - label: A
    content: 日本採「鎖國政策」
  - label: B
    content: 在臺灣本島與荷蘭產生嚴重的貿易衝突
  - label: C
    content: 鄭成功擬派兵攻占菲律賓，馬尼拉總督調回駐臺兵員防守
  - label: D
    content: 西班牙在馬尼拉屠殺華人，導致華民反抗，需調回臺灣兵力鎮壓
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 清治前期，臺灣對外貿易發展的主要推進力量為「行郊」，從行郊的多寡及規模，即可反映一地對外貿易的發達情形。請問：關於郊商，以下說明何者正確？
  options:
  - label: A
    content: 當時郊商從事的是國際貿易
  - label: B
    content: 郊商除了貿易外，亦從事社會公益
  - label: C
    content: 在郊商主導下，兩岸貿易呈現自由競爭關係
  - label: D
    content: 郊全以貿易地為名
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 清代臺灣各市鎮的興起原因各有不同，但大多與經濟發展有關。請問：下列配對何者正確？
  options:
  - label: A
    content: 大稻埕──製茶
  - label: B
    content: 竹山──金礦
  - label: C
    content: 新竹──竹類工藝製品
  - label: D
    content: 大溪──製糖
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 臺灣某一史前文化出土發現；已知使用金、銀、銅和鐵等金屬器，且能製造鐵器；陶器數量多，質地堅硬，遺物中出現瑪瑙珠、玻璃製品、漢人銅碗、漢人銅錢（五銖錢、開元通寶）、鎏金青銅碗和瓷片等。根據以上發現，下列何者正確？
  options:
  - label: A
    content: 此文化應是大坑文化
  - label: B
    content: 可看出當時已與華南、南洋發展海外貿易
  - label: C
    content: 漢人在臺灣已建立政權
  - label: D
    content: 臺灣當時已有製造玻璃的技術
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 學者提到十六、十七世紀的臺灣地位，認為：政治易主，東亞貿易的架構也重回十六世紀中期的傳統秩序。中國北方貿易，從寧波、南京前往日本；南方貿易，從廈門、廣州前往東南亞，臺灣再次被置於東亞貿易的主要路線之外。從以上的論述可以推出怎麼樣的論斷？
  options:
  - label: A
    content: 臺灣仍保有東亞航線及貿易的優勢
  - label: B
    content: 臺灣和中國共同建立朝貢貿易體系
  - label: C
    content: 臺灣地位自此變成大清帝國的邊陲
  - label: D
    content: 臺灣取代琉球成為朝貢貿易的關鍵
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 1905年6月，臺灣總督府頒布《製糖廠取締規則》，內容如下：「為了制止各製糖工廠間的原料爭奪，避免擾亂漲價，各蔗作區劃分為一定範圍的區域，各個區域內的甘蔗原料如果未經許可，不得運出該區域之外，或者供作砂糖以外成品的製作原料。」下列關於這項規則的說明，何者為是？
  options:
  - label: A
    content: 目的在建立一個公平的交易機制
  - label: B
    content: 目的在保障蔗農，減少蔗農運輸甘蔗的成本
  - label: C
    content: 目的在保障糖廠，以確保原料來源
  - label: D
    content: 結果使蔗農蒙受利益，因而帶動製糖業發展，使其成為日治時期最具代表性的產業
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 日治時期，臺灣的對外貿易型態開始出現重大的轉變。請問：下列說明何者正確？
  options:
  - label: A
    content: 總督府加強臺灣產品銷售中國市場，並吸引歐美商人來臺投資
  - label: B
    content: 對外貿易以日本為主要貿易對象，但大部分的時期呈現逆差
  - label: C
    content: 此時期臺灣成為日本的農產供應地和工業產品的銷售市場
  - label: D
    content: 進口以農產加工品為主，出口則多為日常用品與紡織品
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 淡水某中學校園內有一座馬偕牧師銅像，曾因不堪民眾與社會輿論動輒以「鬼畜英美」的話語咒罵，校長承受不住壓力，只好把銅像拆下，藏入倉庫。這一情形最可能與下列哪一事件有關？
  options:
  - label: A
    content: 1894年，甲午戰爭
  - label: B
    content: 1905年，日俄戰爭
  - label: C
    content: 1941年，太平洋戰爭
  - label: D
    content: 1979年，臺美斷交
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 某個日本官員說道：「社會習俗或制度，必有其長久以來存在之理由，如不明究裡，一味地將文明國家之制度施行於未開化之地，此謂文明之虐政，……若未詳加了解，即將日本內地之法制施行於臺灣，無異是將比目魚的眼睛變為鯛的眼睛一般，是不解政治真義之行為。」請問：在這樣的說法之下，衍伸出哪一項治理臺灣的政策？
  options:
  - label: A
    content: 市街改正
  - label: B
    content: 神佛升天
  - label: C
    content: 舊慣調查
  - label: D
    content: 林野調查
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 英法聯軍之役後，臺灣開港通商；自強運動期間，興建基隆到新竹段鐵路；日治時期，完成基隆到高雄縱貫鐵路。從臺灣的歷史發展來看，以上事件有何共同意義？
  options:
  - label: A
    content: 完成環臺交通建設
  - label: B
    content: 促進現代化的發展
  - label: C
    content: 加強原住民的管理
  - label: D
    content: 開啟臺海兩岸貿易
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 臺灣從必須仰賴日本國庫補助，到財政可以獨立自主的過程，其實比日本政府的預期來得迅速。臺灣財政得以獨立自主的原因，除了地方稅制度可以自行運用，不受帝國議會監督以外，另一關鍵為何？
  options:
  - label: A
    content: 平定抗日事件，節省軍警支出
  - label: B
    content: 實施專賣制度，有了固定收入
  - label: C
    content: 內地延長主義，籠絡民心的成果
  - label: D
    content: 以皇民化運動，配給制度奏效
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 1
  stem: 1936年臺灣總督府成立哪一機構，負責執行經濟南進任務，藉由資金、技術、人才等，將觸角伸及東南亞、海南島等地？
  options:
  - label: A
    content: 臺灣銀行
  - label: B
    content: 三菱株式會社
  - label: C
    content: 臺灣拓殖株式會社
  - label: D
    content: 臨時舊慣調查會
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 總督府於1938年設立經濟保安股，1939年設立統制警察課，創立經濟警察制度，1940年還設立物價課，以「掌握重要物資的物價」。到了1941年，更擴大總督府企劃部。請問：以上作為說明了總督府的何種用意？
  options:
  - label: A
    content: 擴大資源生產力
  - label: B
    content: 統制經濟
  - label: C
    content: 使軍事發展以服務經濟為目的
  - label: D
    content: 以民間糧食生產為優先
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 1970年代政府開始調整之前的出口擴張政策，並改採「第二次進口替代」政策，其中原因<u>不包括</u>下列何者？
  options:
  - label: A
    content: 基礎建設仍屬不足，成為經濟成長的瓶頸
  - label: B
    content: 外交受挫，影響民間投資意願
  - label: C
    content: 石油危機爆發，造成全球經濟衰退
  - label: D
    content: 國內物資缺乏，通貨膨脹問題嚴重
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 附表是臺灣出口市場中，美國在出口總值所占的比率。請問：在1985年達於高峰後，自此之後比率下降的主要原因為何？
  options:
  - label: A
    content: 美國對臺灣進口的限制數量
  - label: B
    content: 美國對臺灣進口提高關稅
  - label: C
    content: 新臺幣對美元大幅升值
  - label: D
    content: 政府主導輸出日本政策的成功
