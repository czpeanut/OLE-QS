- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 2
  stem: 1980年代臺灣的經濟發展快速成長，卻也面臨到自由化與國際化的重大挑戰。請問：下列何者是造成此一挑戰的主要因素？
  options:
  - label: A
    content: 政治環境不佳，致使外國經貿勢力一再叩關
  - label: B
    content: 教育水準有限，迫使國外投資廠商必須引進人力
  - label: C
    content: 外匯存底累積快速，引起美國等國要求開放市場
  - label: D
    content: 國內貨幣價值大貶，造成通貨緊縮的狀況
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 某一年份的報紙頭版寫著「多吃麵，少吃米」，原因是當時稻米外銷收入可觀，相對地臺灣麵粉成本卻十分低廉。請問此現象應發生於臺灣哪一個年代？
  options:
  - label: A
    content: 1930年代
  - label: B
    content: 1950年代
  - label: C
    content: 1970年代
  - label: D
    content: 1990年代
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 一位日本人寫一封信給在臺灣的友人，信封上標示的地址是「臺灣恆春郡海角七番地」。臺灣普遍擁有戶籍地址，和日治時期政府哪項建設事業有關？
  options:
  - label: A
    content: 土地調查事業
  - label: B
    content: 蕃地調查事業
  - label: C
    content: 森林計畫事業
  - label: D
    content: 都市計畫事業
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 2
  stem: 透過土地稅收、強制收購，以及肥料換穀這三種方法，國民政府每年約吸收臺灣米穀生產利潤的30％。據1955-1959年的統計，這些糧食的分配方式如附圖。根據圖表，以下何者是政府在1950年代制定農業政策時的重要考量？
  options:
  - label: A
    content: 透過加強米糧收購的方式來穩定臺灣社會秩序
  - label: B
    content: 削弱臺灣地主的經濟實力，以利於鞏固政府的威權統治
  - label: C
    content: 以糧食生產作為平衡中日貿易逆差的重要籌碼
  - label: D
    content: 供應軍公教人員及其眷屬的糧食所需和支援工業發展
