  stem: 「臺灣的文學乃中國文學的一支流。本流發生了什麼影響、變遷，則支流也自然而然的隨之而影響、變遷，這是必然的道理。然而臺灣自歸併日本以來，因中國書籍的流通不便，遂隔成兩個天地，而且日深其鴻溝。回顧十年前，中國文學界起了一番大革命。新舊的論戰雖激烈一時，然而垂死的舊文學，到底是只有招架之功，沒有還手之力。不，連招架之功也沒有了。一班頑固的老學究敗得垂頭喪氣。那一座的破舊殿堂──舊文學的殿堂──經了這陣暴風雨後，已破碎無遺了。」請問：以上短文，出於何人之筆？
