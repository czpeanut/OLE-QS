  type: multiple
  page: 4
  stem: 民國六十八年起，政府鑑於出口競爭力的銳減，在經濟政策上做了哪些調整？
  options:
  - label: A
    content: 調整產業政策，以勞力密集、低汙染、高價值的產業為主
  - label: B
    content: 提出自由化、國際化的經貿政策
  - label: C
    content: 公布「促進產業升級條例」，鼓勵廠商投資高科技產業
  - label: D
    content: 成立加工出口區
  - label: E
    content: 管制外匯穩定幣值，以增加出口競爭能力
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s2_44
  section: 2
  number: 44
  type: multiple
  page: 4
  stem: 臺灣光復後，辜振甫被捲入「臺灣自治委員會」風波，無端受到牢獄之災，後暫避於香港。國府退守臺灣後，對原來臺灣的大家族相當禮遇，他回到臺灣開始新事業。辜振甫積極響應國府實行土地改革，受聘為經濟部顧問。當時政府把水泥、造紙、農林和工礦等所謂四大公司的股票換取土改的土地後，身為大地主的他進入工商界。後他被派到臺灣水泥負責轉為民營，當時臺泥是最大的民營企業，也是唯一能與當時的國營事業匹敵者，後藉此創立和信集團，發展為臺灣十大集團企業之一。由辜振甫的崛起可瞭解當時哪些現象？
  options:
  - label: A
    content: 土地改革後，改善了農民的耕作條件，增加農業收入
  - label: B
    content: 地主得到股票後，轉而成為工業的投資者
  - label: C
    content: 此種政策有助日後臺灣經濟起飛
  - label: D
    content: 但也有不少地主因抛售股票未蒙其利
  - label: E
    content: 因二二八事件的寒蟬效應，許多地主被迫接受政府徵收土地
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s2_45
