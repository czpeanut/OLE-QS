  stem: 清領時期臺灣的土地拓墾隨著移民的多寡逐漸展開，其中以「一田二主」最特別。請問：下列哪些是「一田二主」的正確描述？
  options:
  - label: A
    content: 是華北地區的土地制度
  - label: B
    content: 由具有能力的「墾戶」向官府申請開墾執照
  - label: C
    content: 小租戶又稱為現耕農
  - label: D
    content: 大租戶必須向官府繳納「正供」
  - label: E
    content: 墾戶擁有「永佃權」
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s2_46
  section: 2
  number: 46
  type: multiple
  page: 4
  stem: 清朝來到臺灣的唐山客當中，有許多是無「妻」無「厝」的流民，他們晚上露宿於廟裡十八羅漢神像的腳下，因此被當時的社會謔稱為「羅漢腳」。羅漢腳們「有路無厝」、「病無藥，死無蓆」、「死無人哭」。生前既舉目無親、流離失所，死後更無人照料，遺骨暴露，聽任風吹雨打，於是民間善士，為之收殮，立廟祭祀。解讀上述資料，下列敘述哪些正確？
  options:
  - label: A
    content: 「羅漢腳」是清領時期臺灣社會的一種特殊角色，「有應公」則是臺灣民間信仰中的一種特殊神明
  - label: B
    content: 這些廟祭祀因水土不服、分類械鬥、漢番衝突死於非命的孤魂野鬼
  - label: C
    content: 被善心人士立廟祭祀對象又稱為百姓公、萬善爺
  - label: D
    content: 「有應公」若是因幫助朝廷平亂者亦可稱為「義民爺」
  - label: E
    content: 臺灣俗諺「少年若無一次戇，路邊哪有有應公」即是反映當時的社會現象
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s2_47
  section: 2
  number: 47
  type: multiple
  page: 5
  stem: 清嘉慶年間，舊臺南縣熱鬧的「舊社街」發生械鬥，失敗的一方後來被迫退出「舊社街」，在今「山西宮」一帶另建「關帝廟街」，是一次典型的漳泉械鬥。關於此次械鬥的可能發生之場景，下列敘述哪些<u>錯誤</u>？
  options:
  - label: A
    content: 漳州居民主祀開漳聖王，以祈求鬥爭獲勝
  - label: B
    content: 泉州居民靠山居住，信奉三山國王能保平安
  - label: C
    content: 「關帝廟」興建後，廟宇內可能主祀三國時代之關羽
  - label: D
    content: 洋人可能參與此次械鬥，官府為難無法判案是非
  - label: E
    content: 漳泉來臺居民無法融入臺灣社會，械鬥至今
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s2_48
  section: 2
  number: 48
  type: multiple
  page: 5
  stem: 1926年，陳澄波以「嘉義街外」入選第七回帝展，第二年以「夏日街景」再度入選帝展；1928年廖繼春入選帝展的「有香蕉樹的院子」等同樣是以南臺灣溫熱的氣息、風土景象為表現的焦點，反映南方特有的炎方色彩與人情文化。」關於以上文字敘述，可以得到什麼理解？
  options:
  - label: A
    content: 應指清代時期的美術創作
  - label: B
    content: 應指日治時期的美術創作
  - label: C
    content: 文中說明題材取於臺灣民俗風情發揮臺灣鄉土特色的作品
  - label: D
    content: 文中說明題材取於日本正流行的主題
  - label: E
    content: 當時的美術作品意味著向陳舊因襲傳統的美術告別，朝向臺灣新美術發展邁進
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s2_49
  section: 2
  number: 49
  type: multiple
  page: 5
  stem: 日治中期以來，臺灣的戲劇與傳播媒體有何新的發展？
  options:
  - label: A
    content: 富本土特色的歌仔戲團紛紛成立，深受一般民眾喜愛
  - label: B
    content: 標榜「打破舊俗，以演劇教化社會」文化劇興起，因內容通俗，觀眾以中下階層百姓居多
  - label: C
    content: 臺灣文化協會的「美臺團」以電影作為啟迪民智的工具
  - label: D
    content: 布袋戲、皮影戲自1920年代開始興起，深受民眾歡迎
  - label: E
    content: 廣播在1930年代後成為民眾獲取資訊與休閒的重要管道
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s2_50
  section: 2
  number: 50
  type: multiple
  page: 5
  stem: 小光同學近期參加一個名為「臺展時期的臺灣美術發展變遷」的展覽，在簡介的內容寫到如下訊息：「1935年，陳進的〈手風琴〉，畫中以大姐為模特兒，女性穿著旗袍和高跟鞋，透露出受西化影響的自主意識，入選第九回『臺展』。1930年，郭雪湖的〈南街殷賑〉，描述臺北大稻埕中元普渡時熱鬧的場景，獲得第四回『臺展』的臺展賞；1930年，林玉山的〈蓮池〉描繪清晨沐浴於金光下的蓮池，是林玉山寫生技法展現的經典之作，曾獲第四回『臺展』特選第一名殊榮。」由上述幾位臺人畫家所屬環境分析，下述敘述哪些正確？
  options:
  - label: A
    content: 「臺展」應是指日治時期的美術創作展覽會
  - label: B
    content: 畫家的繪畫題材取於臺灣民俗風情、市井小民，發揮臺灣鄉土特色
  - label: C
    content: 〈手風琴〉、〈蓮池〉、〈南街殷賑〉等題材取自日本正流行的主題內容
  - label: D
    content: 當時的美術作品意味著告別傳統，運用西方技法表達對土地情懷，朝向臺灣新美術邁進
  - label: E
    content: 林玉山、陳進、郭雪湖被稱為「臺展三少年」
