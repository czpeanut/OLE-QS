  stem: 先民來臺的開發與移民：可說是一部辛酸血淚史。清乾隆年間，原居於臺灣南部的福建泉州移民戴伯歧、陳憲同、陳逢春、賴永和、陳天章等五人合股組成了開墾組織，以「陳賴章」墾號名義向官府申請開墾臺灣北部大佳臘等平埔族群聚落地。這些地方包含了當今臺北市中心及新北市的部分地區，拓墾面積廣達百平方公里。由於開發過程險阻未明，可能遭逢天災傳染疾病的蔓延，以及人禍等各族群的械鬥危機，若他們祈求開墾順利，奉原鄉神祇當守護神，他們最可能供奉何者？
