- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_16
  section: 1
  number: 16
  type: single
  page: 2
  stem: 附表為二十世紀後半期臺灣各項產業生產總值消長變遷的統計數據，請問下列的說明何者符合經濟發展實況？
  options:
  - label: A
    content: 1950年代起，政府改採以工業培養農業的策略，促成工業產值的快速提升
  - label: B
    content: 由甲至丙的產業名稱按順序為農業、服務業與工業
  - label: C
    content: 工業產值固有大幅成長，但農業與服務業人口比例仍高，都市化程度較為有限
  - label: D
    content: 這些統計資料顯示戰後臺灣由農業社會加速轉型為工業社會
  assets:
