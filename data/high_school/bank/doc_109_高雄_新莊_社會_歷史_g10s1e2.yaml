- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 三七五減租是國民政府遷臺後，於臺灣進行的第一個土地改革。其主要的內容為「耕地租額不得超過土地主要作物正產品全年收穫量37.5％」。在三七五減租的推動過程中，臺灣省主席陳誠曾表示：「刁皮搗蛋不要臉的人也許有，但是，我相信，不要命的人總不會有。」極其生動地表現出當時臺灣本土地主的感受。請問：為什麼當時的臺灣地主會有這樣的感受？
  options:
  - label: A
    content: 臺灣人民經過50年日本殖民統治，日本人對於臺灣人生命與經濟的剝削，使地主支持國民政府土地改革
  - label: B
    content: 在1947年二二八事件，國民政府對於臺灣本土政治菁英與地主的屠殺，使其噤聲，不敢對政府施政有所反抗
  - label: C
    content: 臺灣人民在二戰時期感受美國的強大，決心要成為經濟強國，因而配合政府的土地改革
  - label: D
    content: 臺灣人民有感於國民撤退來臺的國民政府財政窮困，決定協助國民政府改善經濟
- id: doc_109_高雄_新莊_社會_歷史_g10s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 有史學家對於日治時期在臺灣的某項措施提出研究報告說：「就日人之統治而言，經過……的實施，強化了對人口的控制，並將原住民族逐步納入現代國家的控制管理機制當中。在此過程中，阿美族傳統社會面臨衝擊，……部落頭目的角色被官方取代。傳統上原來以年長女性為家長，重視家庭共居的社會習俗，也開始轉變。家庭共居的現象因共業地的分割而分家，家庭的組織與規模因而產生變化，戶長也開始出現男性，造成了繼承上的問題。」請問：上述內容應該是指日治時期的哪項措施對臺灣社會所造成的衝擊？
