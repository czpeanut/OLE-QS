  stem: 知名的漫威英雄「美國隊長」創設於 1941 年，在當時的社會氛圍下大受歡迎。他原是一位滿腔熱忱、一心為國家效力的青年，希望藉由從軍幫助國家。在接受政府的改造計畫之後，他身穿紅、白、藍三色星條服裝，以高大挺拔、英勇正直的形象出現，代表美國與邪惡勢力戰鬥，儼然成為美國精神的象徵，也成為陪伴許多美國人長大的英雄角色。有關「美國隊長」的創立歷史，下列分析何者正確？
  options:
  - label: A
    content: 呈現二戰時期英美國家捍衛民主、對抗納粹的價值觀
  - label: B
    content: 藉此角色側面描寫戰火的殘酷，喚起人民的反戰心理
  - label: C
    content: 為美國戰爭宣傳的一環，藉此獲得英國的同情與支援
  - label: D
    content: 顯示戰爭時期美國政府對文化產業的控制力大幅增強
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (B)從題目敘述中可得知，「美國隊長」角色創作的背景乃為鼓勵美國人從軍以捍衛正義，並非喚起反戰心理。(C)當時歐洲國家急需美國的參戰以對同盟國進行援助。(D)題目敘述中並未提及漫威公司「是因受到政府影響」而進行創作，因此並無法由此發現戰爭時期美國政府增強對文化產業的控制。
