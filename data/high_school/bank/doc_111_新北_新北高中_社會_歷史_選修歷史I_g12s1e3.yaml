- id: doc_111_新北_新北高中_社會_歷史_選修歷史I_g12s1e3_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 戰間期一文學作品記錄了一名老兵的自身經歷：「當年我，每次在醫護院時總會遇到那種醫官，看著名冊，不看人，點到名字就那麼一句話：『甲種一等體位，前線需要軍人』。有一次那醫官再次看著名冊喊出：『甲種一等體位，前線需要軍人』時，一名拖著木腿的走遍了整個前線傢伙走到醫官面前，問道：『你確定？』醫官同樣回了他一句：『甲種一等體位，前線需要軍人。』於是我頓時明白原來必須要腦殘才能躲在後方叫別人上戰場。」請問此笑話反映了當時文化思想的何種特點？
  options:
  - label: A
    content: 以反諷、自嘲方式表達對戰爭時期的哀怨與不滿
  - label: B
    content: 作家紛紛前往前線體驗戰爭作為創作的靈感泉源
  - label: C
    content: 政府管控文藝活動使作品走向為戰爭服務的現象
  - label: D
    content: 醫療資源的匱乏導致社會情緒轉向支持社會主義
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '此作品乃透過荒謬手法，諷刺戰爭期間政府的徵兵政策，故選(A)。(B)題目敘述中，並未提及作家透過前往前線已獲得創作靈感。(C)題目敘述並未指涉政府管控藝文活動。(D)從題文中無法判別醫療資源匱乏導致社會主義獲得社會支持。

    14.1975 年，在西班牙長期執政的獨裁者佛朗哥（Francisco Franco）去世，西班牙新政府開始實施民主轉型的工作。由於過去經歷內戰與長期的高壓統治，西班牙社會內部的對立情形相當嚴重，當時的政府為謀求新憲法下的秩序得以獲得穩定，選擇與各方勢力進行協商、謀求最大共識。而對於過去內戰與獨裁時期，西班牙所發生的政治迫害事件，新政府在政治協商的共識下，於 1977 年頒布《大赦法》，僅釋放政治犯而未對政治受害者進行賠償，並限制民眾對過去內戰、獨裁時期所發生政治迫害事件進行真相調查，因而出現「選擇性遺忘」的現象，故答案選(B)。

    15.資料一說明當時社會上的民生商品交易量降低，資料二則提到糧食受到「配給」管制，資料三另說明布料需要透過「息票」（換取債券利息的票券）來換取布料，以上三則資料乃是反映戰爭期間，民生商品受到配給制度管制下出現的現象。(A)資料中並未提及其與一戰期間英國缺糧的情形相關。(C)題目資料主要反映「配給制度」造成的現象，與計畫經濟有所差異。(D)配給制度的出現乃是因二戰期間大量資源投入戰爭與軍隊之中，政府為了避免出現惡性通膨、維持最低限度的社會運作，而對民生經濟採取的管制政策。

    16.為了因應戰事的爆發，英國政府糧食部於 1940 年 1 月開始進行配給制度，進行管制的民生商品由一開始的牛油、燻肉、火腿與糖等，隨著戰爭的進行開始擴及至肉類、茶葉、起司、巧克力與織品衣物等。配給制度一直延續至戰後，直到 1953 年才重新回歸自由市場機制。從題目敘述中對於紅茶、糖的管制，以及自紐西蘭、加拿大進口牛油、乳酪等訊息，可判斷此應為二戰期間的英國所出現的景象，故答案選(A)。

    17.(A)(C)目前臺灣的轉型正義工程，尚未有對曾參與白色恐怖的官員進行司法訴訟的相關制度與規範，因此無法對相關人士提出告訴，或以警察身分進行逮捕。(D)轉型正義工作中，對於檔案資料中加害者責任的釐清，是需要透過專業的研究加以考證、討論。若僅憑藉檔案紀錄就私自要求當事者進行道歉，或是相關報復行為，不論在法律或是道德層面皆有所疑慮，亦不符合轉型正義所秉持的「和解共生」精神。

    18.資料中紙幣馬克約於 1920 年代初期開始貶值，從數據的時間點可判斷，此資料應反映一戰後德國在《凡爾賽和約》的要求下，須償還鉅額賠款而導致的惡性通膨現象，故答案選(D)。

    19.此篇宣言中強調的重點為：自然權利的神聖性、人民的意志形成法令、行政權（政府）的工作為執行法令、憲法的維護與人類的幸福。此論述即與盧梭所提出之政府由人民公共意志形成並為其服務的論點相符，故答案選(D)。(A)佛朗哥的民族主義論述會強調西班牙在文化、語言與認同上的統一，且人民應忠誠於民族，並不會強調自然權利的神聖性。(B)納粹青年團的宣傳會強調德意志民族的榮耀、為希特勒與國家的服務精神，並且排斥猶太人等。(C)霍布斯認為若國家或君主得以保障人民的安全，人民則應該展現完全的忠誠。

    20.附圖中子女對父親在戰爭中表現的提問，其言外之意可解讀為：若不從軍，將會影響父親在家庭中的威信，並導致子女對父親感到失望，由此可知當時英國政府希望藉由父親於家庭中的權威與英雄角色，刺激英國男性挺身投軍，故答案選(C)。

    21.(A)資料一呈現面對戰爭時一般人對於命運的無奈與服從，資料二則是強調日本發動戰爭背後所背負的責任與使命感。(B)從資料一中可判斷大石老師應為反戰立場，因此並不會贊同資料二合理化日本發動戰爭的論述。(C)資料一站在人民的立場顯現戰爭所造成的無奈與苦難，資料二則是站在國家（或是決策者）的角度去理解發動戰爭的可能原因，二則資料對戰爭苦難的理解與立場並不相同。

    22.該宣傳看板，強調德國、日本與義大利共同對抗英、美等國的同盟關係。二次大戰期間，德國、日本與義大利正式形成同盟關係的時間點為 1940 年 9 月，三國代表於柏林簽訂《德義日三國同盟條約》之後，自此德、日、義軸心國正式形成。因此該遊行活動最可能發生於(B) 1941 年的臺北。

    23.一次大戰前，國際貿易與產業分工在自由主義的興盛下達到高峰，各國的經濟生產出現相互依存的現象。然而大戰期間對工業生產與貿易帶來的破壞，以及航路中斷導致原料供應不足的問題，促使一次大戰後，各國對國際貿易的態度轉趨消極，並開始出現自給自足與關稅保護的風潮，故答案選(B)。

    24.題文中所提及中國政府特別針對新疆維吾爾族實施強迫勞動、關押、暴力與絕育等不當政策，已與種族滅絕罪的定義：「意圖消滅某一民族、族裔、種族或宗教團體的全部或局部，而實施殺害、精神與身體傷害、防止生育……」相符，故答案選(A)。

    25.1998 年頒布的《國際刑事法院羅馬規約》中，將危害人類罪定義為：「在明知的情形下，廣泛或系統性針對任何平民群眾，進行謀殺、滅絕、酷刑……等行為」。而題目中緬甸軍政府對示威民眾的鎮壓行為，即相當接近《羅馬規約》中的危害人類罪定義，故答案選(B)。

    26.由題目引文中可得知，該名作家所諷刺者，為威權政府統治下，人民的思想與言論受到政府管控而不自由的現象。選項中(A)蔣中正雖然曾在臺灣實施威權統治並管制言論與思想自由，但其於 1949 年前，尚無法在中國徹底實施這樣的統治。因此最符合的選項為(D)史達林統治下的蘇聯。

    27.本題之判斷關鍵為「它突破性的進步沒想到是在二十世紀的戰爭時」，(A)(C)熱氣球和降落傘的技術，皆於 18 世紀即已發展成熟；而(B)飛彈的技術發展，則是在二次大戰雷達技術成熟後，才具發展基礎，並於冷戰期間逐漸成熟。飛機技術則是在 20 世紀初期發展出來後，在兩次大戰的需求下，獲得充足的發展空間，故答案選(D)。

    28.資料一提及阿方辛政府主政後，在執行轉型正義工作時所遭遇最大的阻礙，乃是受到軍方權力的威脅；資料二則說明南非新政府的轉型正義工作中，為了避免政權轉移的不穩定，因而作出讓步。由此可判斷兩國在執行轉型正義工作時，所遭遇的困難為為了和平轉移政權而在推動轉型正義時妥協，故答案選(D)。

    29.日本靖國神社為 1869 年由明治天皇主導興建，該神社成立的目的，乃為供奉自明治維新以來為國家所犧牲的軍人與軍屬。然而 1978 年後，14 位在東京大審判中被判為「甲級戰犯」者入祀靖國神社，因而使得該神社蒙上過去軍國主義的色彩而為東亞各國所質疑，並進而出現參拜的爭議。

    30.為了配合戰爭的發展，日本於 1937 年起開始推行皇民化運動，在鼓勵說「國語」的背景下，許多漢文報紙遭到廢止、整併，藉以控制社會輿論、並灌輸人民「效忠皇國」的思想，故答案選(D)。

    31.由資料一中「改組南京政府、容納各黨派」、「停止一切內戰」與「召開救國會議」等主張，可判斷此為西安事變中，由張學良等人的政治主張；資料二的歌詞來自《反滿抗日義勇軍進行曲》，為 1930 年代中期所創作，從資料二的內容可得知，當時的抗爭目標與西安事變相同，皆為停止內戰、共同抗日。正確選項為(B)。

    32.題目提到希特勒獲得政權的背景為「德國面臨嚴重的經濟不景氣、失業、通貨膨脹、共產勢力蔓延等問題」，因此希特勒以「恢復經濟、社會秩序與國家光榮」為政見主軸，率領納粹黨贏得大選並成為總理。(A)納粹黨的立場為反對共產黨，並藉此吸引右派選民支持。(B)納粹黨是透過大選來贏得政權。(D)納粹黨的目標是建立一黨專政的獨裁政府。

    33.海報中以希特勒張大耳朵的滑稽意象，搭配英文標語「希特勒先生想要知道！」可判斷此海報應為二次大戰期間，英國政府用來提醒國民需要注意日常生活的保密與防諜的宣傳海報，故答案選(C)。

    34.從題目中「認定佛朗哥時期的政治法庭與判決違法」、「拆除雕像、紀念碑、更改路名」等敘述，可得知西班牙所頒布之《歷史記憶法》，具有檢討過去極權統治與極權象徵崇拜行為的意涵。(A)該法對佛朗哥政權的迫害與崇拜進行全面的檢討與轉型。(C)佛朗哥政府為反共立場，並大肆搜捕左派人士。(D)「選擇性遺忘」為西班牙政府於 1977 年頒布《大赦法》的特徵，《歷史記憶法》乃為彌補前法的對轉型正義工作的不足之處。

    35.題目文章認為現代戰爭對物資價格產生影響的原因，來自於政府不當的經濟管制、資源的消耗，及對生產與市場運作的破壞行為；對特定區域實施價格統制，卻無法徹底管制人與商品的流動，進而造成統制政策的失靈，故答案選(D)。

    36.由題目中被改編的歌詞內容，強調奉獻給國家、勇氣與戰爭相關內容，可判斷此現象應出自日治末期，在戰爭體制下日本政府為凝聚臺灣人民對日本帝國的認同，而執行的宣傳與洗腦作業，故答案選(B)。

    37.由引文中的時間點與描述，可判斷此場戰役為二戰期間德、蘇對抗中，相當重要的「史達林格勒戰役」。史達林格勒戰役發生於 1942 年 7 月至 1943 年 2 月之間，雙方皆投入大量軍力並造成大規模的傷亡。蘇聯最終於該場戰役中取得勝利，成功削弱德軍的氣勢與力量，並開始轉守反攻。與此戰役最相關的選項為(D)。

    38.(B)(C)英、美於戰時的宣傳主軸，多以為保衛家園、正邪對抗等意象設計宣傳品，以鼓舞國民士氣以及從軍意願。(D)根據希特勒在《我的奮鬥》中的敘述，納粹黨會致力於宣傳工作的研究與實驗，乃是因為發現一次大戰期間英國在宣傳戰中獲得相當不錯的成效，以及德國的不重視以至於失敗的經驗。

    39.(A)從海報中出現的邱吉爾、羅斯福、希特勒和日本軍人等意象，可判斷兩張海報皆為二戰期間所出現。(B)兩張海報的預設讀者應為本國人民，藉由敵人的邪惡意象，刺激民眾保衛家園的決心。(D)兩張海報的設計理念皆為「正義對抗邪惡」，並非民族主義。

    40.從題目中的定義，可得知轉型正義的主要目標為「對於過去專制政權中侵犯人權行為的補償」。(C)國與國之間因戰爭而戰死的士兵，並不符合轉型正義的目標定義。

    41.第二次世界大戰期間，日本軍方宣稱「為了解決戰爭中的性侵害問題」、「提高軍人的戰鬥力與士氣」，而實施「慰安婦」制度，自日本帝國本地、殖民地與占領區等地，透過召募、委託民間業者聘僱等方式，將女性送入軍中並提供性服務。根據研究，當時許多女性是受到不當的拐騙（例如以女工、護士、清潔隊員為名）而被送入軍中，並被迫成為慰安婦；而經濟剝削與性暴力的問題亦層出不窮。戰爭結束後，倖存者亦因過去的經歷而在回歸社會的過程中遭受不公平與歧視對待。

    42.從題目中「眾人屏氣凝神聆聽希特勒演說納粹黨的重要性」、「群眾向希特勒行納粹禮」、「合唱納粹黨歌、黨旗飛揚」等敘述，可得知這部電影主要想塑造希特勒做為納粹黨領袖，其與黨吸引民眾效忠的崇高形象，故答案選(B)。

    43.(A)國歌少年的故事乃是為了塑造同化教育的成功，並鼓勵臺灣人民效仿其就算遇難仍要對皇國效忠的精神。(B)兩者皆著重於宣傳殖民地人民的同化成果與忠誠精神。(D)「莎韻之鐘」被做為皇民化運動的典範教材，其宣傳對象為全臺灣人民。

    44.「東京玫瑰」為第二次世界大戰期間，日軍透過東京廣播電臺（NHK）所執行的心戰策略。當時日軍企圖透過女播音員的英語廣播節目，引起在太平洋作戰的美軍的思鄉與怠戰情緒，藉此打擊美軍士氣，故答案選(C)。

    45.(B)美國政府並未在第二次世界大戰後推動計畫經濟，且受益於戰爭紅利，美國於戰後的經濟發展狀況良好。(C)第二次世界大戰期間納粹主義的盛行，事實上促成美國社會對於種族主義的反思，並逐步放寬移民限制。(D)美國於第二次世界大戰對法西斯政權所取得的勝利，間接促進美國人民對於平等、和平的追求，並認同美國的正義形象。

    46.霍布斯在其著作《利維坦》（巨靈論）中，強調社會的和平建立於社會契約之中，人民必須將其自然權利交付予主權，讓主權來維持內部和平與進行外部防禦；而「利維坦」（Leviathan，源於希伯來神話中具大海怪形象的巨靈）則是指一種「絕對的主權」，不論社會中採取君主制、貴族制或民主制，皆不會影響其執行權力行使。(B)霍布斯認為秩序的維持來自於主權的絕對性，而非依賴人民的理性。(C)霍布斯的理論中，人權與政權是處於結合的關係。(D)其支持國家、政府或領導人具有絕對的權威。

    47.(A)由題目可知，納粹德國所進行的政治迫害行為，乃是具有組織性的行動。(B)蓋世太保為執行納粹黨理念與意志的組織。(D)蓋世太保主要針對國家內部的異議分子，與納粹黨欲排擠、迫害的特定對象。

    48.(A)(B)由題目敘述可判斷，當代世界仍有許多國家與政權，並未將自由、人權與民主等概念，視為施政的行為準則，就算是標榜民主的現代國家，亦仍常出現侵害人權的情形。(C)「茉莉花革命」的案例中，可觀察到社群媒體作為當代人民規避政府控制言論的性質。

    49.無償徵收人民財產的政策，對於資本家與中產階級的人民影響最大，因此若欲爭取中產階級的支持，此條黨綱最可能為修改對象，故答案選(C)。(A)(D)納粹黨綱中對於強化德意志民族主義、排猶主義的具體展現，與爭取中產階級支持無關。(B)為納粹黨為爭取中、下階層的支持，而對資本家提出的針對性政策。

    50.該篇報導的內容，主要呈現俄羅斯挑起戰爭、侵犯烏克蘭主權，並在戰爭中進行屠殺守軍的不義行為；另外，強調烏克蘭守軍在遭受俄羅斯的進犯下，堅毅的防守行動。由此可判斷該篇報導的目的為戰爭宣傳，且其立場較傾向烏克蘭，故答案選(A)。'
