  stem: 保羅聽到以下演說：「儘管歐洲的大片土地和許多古老聞名的國家，已陷入或可能陷入祕密警察和納粹統治的種種罪惡機關的魔掌……我們將戰鬥到底……我們將在法國作戰……我們將不惜任何代價防衛本土……我們在海外的帝國臣民……也將繼續戰鬥……。」請問對上述演說的理解何者正確？
  options:
  - label: A
    content: 演說出自德國宣傳部
  - label: B
    content: 演說的目的是為了爭取法國支援
  - label: C
    content: 演說的目的是報導戰爭的真相
  - label: D
    content: 演說的目的是刺激人民從軍馳援盟國
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)由演說內容中批評納粹統治，提及「海外的帝國臣民」亦將支援戰鬥，可判斷這段演說應為英國政府的宣傳。(B)當時法國大部分領土已遭到德國控制，英國才是支援的角色。(C)演說中透過修飾語氣，將對英國與同盟國不利的戰情，轉化為鼓勵民眾支援、參與戰鬥，由此可判斷該演說的目的並非報導戰爭的真相。
