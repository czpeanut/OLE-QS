  page: 1
  stem: '資料一：「聯合國任何會員國受武力攻擊時，在安全理事會採取必要辦法，以維持國際和平及安全以前，本憲章不得認為禁止行使單獨或集體自衛之自然權利。」

    資料二：「未實際參加戰事之人員，包括放下武器之武裝部隊人員及因病、傷、拘留，或其他原因而失去戰鬥力之人員在內，在一切情況下應予以人道待遇，不得基於種族、膚色、宗教或信仰、性別、出身或財力或其他類似標準而有所歧視。」

    以上分別出自《聯合國憲章》與《日內瓦公約》，請問這兩則資料有何共通之處？'
  options:
  - label: A
    content: 均有提及國際刑案的審判原則
  - label: B
    content: 均對國際貿易關係做出相關規範
  - label: C
    content: 均對違反人權之舉做出相關規範
  - label: D
    content: 均有提及轉型正義的實施原則
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 資料一提及《聯合國憲章》規範各國人民的「自然權利」；資料二則保障非戰鬥人員的生命權，並且不得因種族、宗教等差異而有所區別，因此兩則資料的共通點是均對違反人權之舉做出相關規範，故答案選(C)。
