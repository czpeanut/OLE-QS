  stem: 一名老人回憶 1930 年代：「……有一天爸爸回家，拿出筆記興奮地告訴媽媽只要我加入了某個青年團體，我就能夠獲得升學保障跟優惠，而且聽說幾乎所有青年都參加了，對我來說是個好機會，我覺得自己幸運極了！等我加入這個團體之後，發現我們必須歌頌我們的國家總理，還要學會丟手榴彈、爬鐵絲網跟穿越障礙，這跟我原本想好好讀書的想法完全不同，除此之外，爸爸還叫我再也不能跟某些人做朋友了，因為他們跟我們是不同種人，我當時真的不明白……。」從題幹描述來看，下列敘述何者正確？
