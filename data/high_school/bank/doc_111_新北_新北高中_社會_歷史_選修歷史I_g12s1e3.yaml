  stem: 二戰後，戰勝國在亞洲展開針對日本的東京大審，根據國際法在人證、物證的基礎上，給予戰犯自我辯護的權利，而後才作出法律判決，並且公開審判過程與結果，因此許多學者認為，東京大審和紐倫堡審判相同，開啟了現代轉型正義的先聲。從現代轉型正義的觀點來看，上述東京大審的審理過程具有何項特色？
  options:
  - label: A
    content: 強調對暴力行為的追訴與處罰權
  - label: B
    content: 以國際公約或人道精神處置戰犯
  - label: C
    content: 重視以牙還牙的積極性法律原則
  - label: D
    content: 著重個人行為對於受害者的傷害
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)「東京大審」並非僅針對暴力行為進行追訴與懲罰，而是對戰爭中的不義行為、決策進行釐清與究責。(C)該場審判以現代法學為核心，並非以「以牙還牙」為重點。(D)審判著重於政府與決策者的戰罪責任。
