  stem: 1976 年至 1983 年是阿根廷軍政府統治時期，當時政府以「國家安全」為由，嚴禁所有的政治活動，且軍隊沿街抓捕、打壓知識分子。1977 年開始有一群女性在五月廣場集結，她們是「被失蹤者」的母親或祖母尋找軍政府時期失蹤的兒女下落，至今許多人仍不明白這些失蹤者何時、為何被消失。請問根據題幹，下列敘述何者正確？
  options:
  - label: A
    content: 顯示現代民主國家侵害人權的事件也時有所聞
  - label: B
    content: 這些失蹤兒女應是「史塔西」組織下的受害者
  - label: C
    content: 可知阿根廷軍政府行政治迫害、違反人權之事
  - label: D
    content: 政府頒布《大赦法》使得這些母親的訴求未得回應
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)題目敘述說明當時的阿根廷為「軍政府」體制，並非是民主體制。(B)「史塔西」為冷戰時期，東德「國家安全部」的別稱，為東德政府的情報及祕密警察組織，該組織存在於 1950 ～ 1990 年，負責壓制國內的政治異議分子、監視國民並穩固統一社會黨政權的工作。(D)《大赦法》為西班牙政府於 1977 年所頒布，當時的新政府在謀求新憲法秩序的穩定下，僅選擇釋放政治犯而未對政治受害者進行賠償，並限制民眾對過去內戰、獨裁時期所發生政治迫害事件進行真相調查，以達成政體的穩定轉型。
