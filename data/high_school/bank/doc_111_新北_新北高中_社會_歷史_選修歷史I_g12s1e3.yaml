  stem: 十八世紀法國國王被國民公會處死後，吉倫特派的要角羅蘭夫人也被羅伯斯比爾掌權的雅各賓黨以叛國的名義送上斷頭臺，刑前她輕語：「喔自由，多少罪惡假汝之名行之！」上述羅蘭夫人受刑前最後說的那段話，我們應如何理解？
  options:
  - label: A
    content: 像是國民公會那樣的民選政府才能真正實踐自由的真諦
  - label: B
    content: 保王勢力的羅蘭夫人和吉倫特黨人反對一切形式的自由
  - label: C
    content: 自由若無限上綱沒有規範極有可能成為變相的國家暴力
  - label: D
    content: 感嘆只有政治爭鬥的勝利者才能以自由為名行獨裁之實
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 羅蘭夫人的悲劇，事實上反映法國大革命時期，雅各賓黨內的派系鬥爭。而題目中羅蘭夫人臨刑前的感嘆，事實上亦在反諷以羅伯斯比爾為首的「山嶽派」，以自由主義為名行鬥爭與恐怖統治之實，並反映當時國民公會執政下國家暴力產生的背景。故答案選(C)。
