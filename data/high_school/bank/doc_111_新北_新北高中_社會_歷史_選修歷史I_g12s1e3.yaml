  stem: 附圖為 1917 年美國的募兵海報，圖中戴星條旗高禮帽、著馬甲禮服的白人「山姆大叔」搭配「我需要你」的標語，成為代表標誌。請問有關附圖當時欲傳達的訊息，下列解釋何者正確？
  options:
  - label: A
    content: 藉模範的男性形象，鼓勵女性投入前線作戰
  - label: B
    content: 藉美國人的理想形象，激發人民的愛國意識
  - label: C
    content: 為自由與民主，呼籲不分種族團結對抗殖民
  - label: D
    content: 藉醜化敵人的形象，合理化參與戰爭的動機
