  explanation: 「希特勒青年團」（Hitler-Jugend）源於納粹黨早期成立的「阿道夫．希特勒少年衝鋒隊」，1933 年重建後大量吸收青少年階層，並訓練其成為對希特勒與第三帝國效忠的戰士。「希特勒青年團」著重訓練青少年的身體和軍事技能，包括投擲手榴彈、穿越鐵絲網等，以及納粹思想的灌輸；其較不注重對於學術與科學的培養，由此可判斷題目中的老人當時所參加的青年團體即為「希特勒青年團」。而該名老人最可能在此背景下被教育要排斥猶太人，因此正確選項為(D)。
