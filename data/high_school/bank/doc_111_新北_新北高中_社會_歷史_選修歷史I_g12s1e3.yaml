  stem: 1956 年毛澤東鼓勵民眾向共產黨提出意見，然而一年後無數對共產黨忠心耿耿、敢於提出批評意見的人民面臨各種精神虐待、人格凌辱、超負荷勞役等打擊，不同理論學派的主張者對此一事件的看法配對正確的有哪些？(甲)伏爾泰派：我們應該以自由、寬容的精神和理性的光芒，捍衛人性尊嚴，並破除傳統威權社會的無知與殘忍，因此我們支持人民要勇於發聲；(乙)盧梭派：政府的組成，是奠基於人民與政府之間簽的契約，因此政府是因循「公意」而行，具有至高無上的權力，所以毛澤東的做法不算有錯；(丙)霍布斯派：政府的權力是人民奉獻個人權益所造就，所以政府有權要求人民全面服從，以促進集體福利的發展，這是不可觸犯的原則；(丁)洛克派：人類生而擁有生命、財產、自由等權利，這些權利不可因政府的成立而被剝奪，我們認同中國人民可以發動革命，反抗破壞這些權利的政府
  options:
  - label: A
    content: (甲)、(丙)、(丁)
  - label: B
    content: (甲)、(乙)、(丙)
  - label: C
    content: (甲)、(乙)、(丁)
  - label: D
    content: (乙)、(丙)、(丁)
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 本題為測驗學生對於啟蒙哲士思想特色的認知，其中(乙)對於盧梭「社會契約論」的說明有誤。盧梭認為人民的集體意志會形成「公意」，而「公意」乃透過制定法律來約束、保障權利，政府則是受到「公意」與人民的委託，做為法律的執行者，其權力受到法律的約束。由此可反證盧梭並不認為政府具有至高無上的權力。正確選項為(A)(甲)、(丙)、(丁)。
