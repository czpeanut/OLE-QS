  stem: '公益彩券大樂透的玩家購買每張彩券時，都可以從 01～49 中選擇 6 個號碼進行投注，開獎時也會隨機開出 6 個中獎號碼，若玩家投注的 6 個號碼與開獎的 6 個中獎號碼相同，就可中頭獎。今<u>阿傑</u>共投注 4 張彩券：

    第 1 張彩券投注 01～06 號；

    第 2 張彩券從 01～07 當中隨意選 6 個號碼投注；

    第 3 張彩券從 01～08 當中隨意選 6 個號碼投注；

    第 4 張彩券從 01～09 當中隨意選 6 個號碼投注。

    試問下列哪些選項是正確的？'
  options:
  - label: A
    content: 第 1 張彩券和第 2 張彩券號碼相同的機率為$\frac{1}{7}$
  - label: B
    content: 第 4 張彩券中頭獎的機率大於第 1 張彩券中頭獎的機率
  - label: C
    content: 第 3 張彩券和第 4 張彩券號碼相同的機率為$\frac{1}{C_{6}^{9}}$
  - label: D
    content: 第 1 張彩券中頭獎的機率為$\frac{1}{C_{6}^{49}}$
  - label: E
    content: 第 3 張彩券中頭獎的機率大於第 1 張彩券中頭獎的機率
  answer:
  - A
  - C
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：$\frac{1}{C_{6}^{7}}=\frac{1}{7}$

    (B) ╳：皆為$\frac{1}{C_{6}^{49}}$

    (C) ○

    (D) ○

    (E) ╳：同(B)

    故選(A)(C)(D)'
