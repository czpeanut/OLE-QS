- id: doc_111_新北_新北高中_數學_數乙_g12s1e2_s3_5
  section: 3
  number: 5
  type: fill
  page: 2
  stem: 設 f（x）＝$ax^{3}$＋3（a＋2）$x^{2}$－3x＋2 為三次且恆為遞減函數時，則實數 a 的範圍為＿＿＿＿。
  answer:
  - －4 ≤ a ≤ 1
  answer_status: verified
  answer_source: answer_key
  explanation: 'f''（x）＝$3ax^{2}$＋6（a＋2）x－3

    ① a＜0

    ②判別式＝〔6（a＋2）〕$^{2}$－4×3a×（－3）≤ 0

    ⇒ $a^{2}$＋5a＋4 ≤ 0 ⇒（a＋1）（a＋4）≤ 0 ⇒－4 ≤ a ≤－1

    由①、②可得－4 ≤ a ≤－1'
- id: doc_111_新北_新北高中_數學_數乙_g12s1e2_s3_6
  section: 3
  number: 6
  type: fill
  page: 2
  stem: 已知三次函數 f（x）在 x＝0 處有極小值 1，且此函數圖形在點（－1，3）與直線 y＝－3x 相切，則 f（x）＝＿＿＿＿。
  answer:
  - $x^{3}$＋$3x^{2}$＋1
  answer_status: verified
  answer_source: answer_key
  explanation: '設 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d

    f''（x）＝$3ax^{2}$＋2bx＋c

    ∵f（x）在 x＝0 處有極小值為 1

    ∴f(0)＝d＝1，f''(0)＝c＝0

    又（－1，3）為切點

    ⇒ f（－1）＝－a＋b＋1＝3

    ⇒ a－b＝－2 …………………①

    f''（－1）＝3a－2b＝－3………②

    由①、②得 a＝1，b＝3

    故 f（x）＝$x^{3}$＋$3x^{2}$＋1'
