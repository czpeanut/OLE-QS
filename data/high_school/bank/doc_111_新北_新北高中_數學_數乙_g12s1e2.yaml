- id: doc_111_新北_新北高中_數學_數乙_g12s1e2_s3_2
  section: 3
  number: 2
  type: fill
  page: 2
  stem: f（x）＝$x^{3}$＋$ax^{2}$＋bx＋1 在 x＝－1 時有極大值，在 x＝3 時有極小值，則數對（a，b）＝ ＿＿＿＿。
  answer:
  - （－3，－9）
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$x^{3}$＋$ax^{2}$＋bx＋1

    f''（x）＝$3x^{2}$＋2ax＋b

    f''（－1）＝3－2a＋b＝0 ⇒ 2a－b＝3…………①

    f''(3)＝27＋6a＋b＝0 ⇒ 6a＋b＝－27………②

    由①、②得 a＝－3，b＝－9

    故數對（a，b）＝（－3，－9）'
- id: doc_111_新北_新北高中_數學_數乙_g12s1e2_s3_3
  section: 3
  number: 3
  type: fill
  page: 2
  stem: 在函數 f（x）＝$x^{3}$－$3x^{2}$＋5x－1 的圖形上，已知以 P 點為切點的切線斜率為 2，則切點 P 的坐標為＿＿＿＿。
  answer:
  - （1，2）
  answer_status: verified
  answer_source: answer_key
  explanation: '設 P 點坐標為（a，f（a））

    f''（x）＝$3x^{2}$－6x＋5 ∵以 P 為切點之切線斜率為 2

    ∴f''（a）＝$3a^{2}$－6a＋5＝2 ⇒ $3a^{2}$－6a＋3＝0 ⇒（a－1）$^{2}$＝0 ⇒ a＝1

    又 f(1)＝1－3＋5－1＝2

    故 P 點坐標為（1，2）'
