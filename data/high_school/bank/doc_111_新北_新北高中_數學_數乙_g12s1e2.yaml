- id: doc_111_新北_新北高中_數學_數乙_g12s1e2_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 如右圖為三次函數 f（x）＝$ax^{3}$＋$bx^{2}$＋cx＋d 的圖形，其中點 （0，－2）為圖形的反曲點，虛線為過反曲點的切線。選出正確的選項。
  options:
  - label: A
    content: a＜0
  - label: B
    content: b＜0
  - label: C
    content: c＜0
  - label: D
    content: d＜0
  - label: E
    content: $b^{2}$－3ac＜0
  assets:
  - key: s2_4_f1
    kind: figure
    file: doc_111_新北_新北高中_數學_數乙_g12s1e2/s2_4_f1.png
    crop:
      page: 2
      rect:
      - 466.55
      - 307.25
      - 563.2
      - 407.55
  answer:
  - A
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：由題圖可知 a＜0

    (B) ╳：$\frac{-b}{3a}$＝0 ⇒ b＝0

    (C) ○：f''（x）＝$3ax^{2}$＋2bx＋c

    ∴f''(0)＝c＜0

    (D) ○：f(0)＝d＝－2＜0

    (E) ○：∵f''（x）＝$3ax^{2}$＋2bx＋c 恆小於 0

    ∴（2b）$^{2}$－4×3a×c＜0

    ⇒ $4b^{2}$－12ac＜0 ⇒ $b^{2}$－3ac＜0

    故選(A)(C)(D)(E)'
