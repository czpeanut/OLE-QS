- id: doc_111_新北_新北高中_數學_數乙_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 若函數 f（x）＝$x^{3}$＋$ax^{2}$－bx－2 圖形的反曲點為（1，2），下列何者為數對 （a，b）？
  options:
  - label: A
    content: （－5，3）
  - label: B
    content: （－3，－6）
  - label: C
    content: （－1，2）
  - label: D
    content: （1，－3）
  - label: E
    content: （3，5）
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 'f（x）＝$x^{3}$＋$ax^{2}$－bx－2

    f''（x）＝$3x^{2}$＋2ax－b

    f"（x）＝6x＋2a

    ∵（1，2）為反曲點

    ∴f"(1)＝6＋2a＝0 ⇒ a＝－3

    f(1)＝1＋a－b－2＝2 ⇒ b＝－6

    故數對（a，b）＝（－3，－6），故選(B)'
