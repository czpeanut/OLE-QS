  stem: （科學素養題）每個原子都是僅一億分之一公尺大小的複合物，介於我們所感知的真實世界與量子世界之間，處於宇宙劇烈落差的邊際。電子佔據了原子中大部份空間；質子與中子則由夸克和膠子這類驚人的微小粒子構成，聚集在比原子還小10萬倍的原子核裡。電子的尺寸或許不是很有意義的物理性質，但可設想它們的大小還不及原子核的千萬分之一。 若把宇宙中所有可辨識的物質全加起來，包含質子、中子、電子和其他次原子粒子，總共大約有$10^{80}$個粒子。那雖然是非常大的數字，若與呼嘯穿梭宇宙間的光子數目相比，則僅是其10億分之一，顯得微不足道。事實上，已知物質只佔空間中所包含總質能的5％。天文觀測證據指出，絕大部份的宇宙由神秘未知的次原子粒子與基本作用力構成，這股由尚未偵測到的暗物質和暗能量所構成的「幽暗勢力」，基本上宰制了宇宙的整體命運。 此外，無論是可見或不可見的所有物質，包括我們與遠在數十億光年外的結構，在138億年前全壓縮到一個極微小的區域裡，成為時間與空間超高能量的起源。就此而論，即使到了今日，所有東西並非毫無關聯。 （節錄自科學人雜誌）下列敘述何者<u>錯誤</u>？
