  stem: 設多項式 f（x）不低於 2 次，f（x）除以 x－1 餘 2，除以 x＋2 餘－1，求 f（x）除以 （x－1）（x＋2）的餘式為 ax＋b，試求數對（a，b）＝＿＿＿＿。
  answer:
  - （1，1）
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝（x－1）（x＋2）q（x）＋ax＋b

    依題意 f(1)＝2，f（－2）＝－1

    得$\begin{cases}a + b = 2 \\ -2a + b=-1\end{cases}$⇒$\begin{cases}a = 1 \\ b = 1\end{cases}$

    故數對（a，b）＝（1，1）'
