- id: doc_110_台中_興大附中_數學_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 函數 y＝f（x）定義域為全體實數，已知不等式 f（x）≥ 0 的解為 1 ≤ x ≤ 2，則不等式 f（2x－1）＜0 的解為
  options:
  - label: A
    content: x ≤ 1 或 x ≥ 2
  - label: B
    content: x＜1 或 x＞2
  - label: C
    content: x＜1 或 x＞$\frac{3}{2}$
  - label: D
    content: x ≤ 1 或 x ≥$\frac{3}{2}$
  - label: E
    content: 1＜x＜$\frac{3}{2}$
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '令 t＝2x－1

    ∵f（x）≥ 0 的解為 1 ≤ x ≤ 2

    ∴f（t）＜0 的解為 t＜1 或 t＞2

    t＝2x－1 代入得 f（2x－1）＜0 的解為 2x－1＜1 或 2x－1＞2

    即 x＜1 或 x＞$\frac{3}{2}$

    故選(C)'
- id: doc_110_台中_興大附中_數學_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 已知實係數多項式 f（x）除以 $x^{2}$－14x＋13 的餘式為 ax＋b，且 f（x）除以 x－1 的餘式為 4，則 a＋b 的值為何？
  options:
  - label: A
    content: －1
  - label: B
    content: '0'
  - label: C
    content: '1'
  - label: D
    content: '4'
  - label: E
    content: '13'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝（$x^{2}$－14x＋13）q（x）＋ax＋b

    ＝（x－1）（x－13）q（x）＋ax＋b

    又 f（x）除以 x－1 的餘式為 4 ⇒ f(1)＝4

    ∴ f(1)＝0×q(1)＋a＋b＝4 ⇒ a＋b＝4

    故選(D)'
- id: doc_110_台中_興大附中_數學_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 多項式 4（$x^{2}$＋1）＋（x＋1）$^{2}$（x－3）＋（x－1）$^{3}$ 等於下列哪一個選項？
  options:
  - label: A
    content: x（x＋1）$^{2}$
  - label: B
    content: 2x（x－1）$^{2}$
  - label: C
    content: x（x－1）（x＋1）
  - label: D
    content: 2（x－1）$^{2}$（x＋1）
  - label: E
    content: 2x（x－1）（x＋1）
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝4（$x^{2}$＋1）＋（x＋1）$^{2}$（x－3）＋（x－1）$^{3}$

    則 deg f（x）＝3，且首項係數為 1＋1＝2

    又 f(0)＝4＋1×（－3）＋（－1）＝0

    f(1)＝4×2＋4×（－2）＋0＝0

    f（－1）＝4×2＋0＋（－2）$^{3}$＝0

    得 f（x）有因式 x，x－1，x＋1 ⇒ f（x）＝2x（x－1）（x＋1）

    故選(E)'
- id: doc_110_台中_興大附中_數學_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 設 f（x）為實係數三次多項式函數，滿足（x＋1）f（x）除以 $x^{3}$＋2 的餘式為 x＋2。若 f(0)＝4，則 f(2)的值為下列哪一個選項？
  options:
  - label: A
    content: '8'
  - label: B
    content: '10'
  - label: C
    content: '15'
  - label: D
    content: '18'
  - label: E
    content: '20'
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令（x＋1）f（x）＝（$x^{3}$＋2）（ax＋b）＋x＋2

    f(0)＝4 ⇒ 1×f(0)＝2×b＋2 ⇒ 2b＋2＝4 ⇒ b＝1

    又 x＝－1 代入得 0＝1×（－a＋b）－1＋2 ⇒ a－b＝1 ⇒ a＝2

    ∴（x＋1）f（x）＝（$x^{3}$＋2）（2x＋1）＋x＋2

    x＝2 代入得 3f(2)＝10×5＋4 ⇒ f(2)＝18

    故選(D)'
- id: doc_110_台中_興大附中_數學_g10s1e3_s2_1
  section: 2
  number: 1
  type: multiple
  page: 1
  stem: 設 f（x）＝（$2x^{5}$＋$3x^{3}$＋$7x^{2}$＋11）．（$4x^{6}$＋$x^{2}$－5x－1），則下列何者正確？
  options:
  - label: A
    content: $x^{7}$ 係數為 2
  - label: B
    content: $x^{9}$ 係數為 12
  - label: C
    content: 各項係數和為－23
  - label: D
    content: 各偶次項係數和為 12
  - label: E
    content: 領導係數為 8
  answer:
  - A
  - B
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：$x^{7}$ 係數為 2×1＝2

    (B)○：$x^{9}$ 係數為 3×4＝12

    (C)○：各項係數和為 f(1)＝（2＋3＋7＋11）×（4＋1－5－1）＝－23

    (D)╳：各偶次項係數和為$\frac{f(1) + f(-1)}{2}$＝$\frac{-23 + 117}{2}$＝47

    (E)○：領導係數為 $x^{11}$ 係數＝2×4＝8

    故選(A)(B)(C)(E)'
- id: doc_110_台中_興大附中_數學_g10s1e3_s2_2
  section: 2
  number: 2
  type: multiple
  page: 2
  stem: 已知二次函數 y＝$ax^{2}$＋bx＋c 的圖形，如右圖，試判別下列各式，哪些選項是正確的？
  options:
  - label: A
    content: a＞0
  - label: B
    content: b＞0
  - label: C
    content: c＞0
  - label: D
    content: $b^{2}$－4ac＞0
  - label: E
    content: 4a＋2b＋c＞0
  assets:
  - key: s2_2_f1
    kind: figure
    file: doc_110_台中_興大附中_數學_g10s1e3/s2_2_f1.png
    crop:
      page: 2
      rect:
      - 459.35
      - 67.0
      - 563.75
      - 170.4
  answer:
  - A
  - B
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵開口向上 ∴a＞0

    (B)○：∵頂點 x 坐標為$\frac{-b}{2a}$＜0，又 a＞0

    ∴b＞0

    (C)╳：x＝0 代入得和 y 軸交於（0，c），故 c＜0

    (D)○：∵和 x 軸有 2 相異交點 ∴判別式 $b^{2}$－4ac＞0

    (E)○：∵f(2)＞f(1)＞0

    ∴4a＋2b＋c＞0

    故選(A)(B)(D)(E)'
- id: doc_110_台中_興大附中_數學_g10s1e3_s2_3
  section: 2
  number: 3
  type: multiple
  page: 2
  stem: 設 f（x）為一實係數多項式，且 f（x）除以（x－1）（x－2）$^{2}$ 的餘式為 （x－2）$^{2}$＋g（x），其中 g（x）為一次多項式。請選出正確的選項
  options:
  - label: A
    content: 若知道 f(1)及 f(2)，則可求出 g（x）
  - label: B
    content: f（x）除以（x－2）的餘式是 g(2)
  - label: C
    content: f（x）除以（x－1）的餘式是 g(1)
  - label: D
    content: f（x）除以（x－2）$^{2}$ 的餘式是 g（x）
  - label: E
    content: f（x）除以（x－1）（x－2）的餘式是 x－2＋g（x）
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '令 f（x）＝（x－1）（x－2）$^{2}$q（x）＋（x－2）$^{2}$＋g（x）

    (A)○：∵g（x）為一次多項式⇒令 g（x）＝ax＋b

    又知道 f(1)，f(2)之值

    ∴可解出 a，b

    (B)○：f（x）除以（x－2）的餘式為 f(2)

    又 f(2)＝0＋0＋g(2)，所以 f（x）除以（x－2）的餘式為 g(2)

    (C)╳：f（x）除以（x－1）的餘式為 f(1)

    又 f(1)＝0＋1＋g(1)≠g(1)

    (D)○：∵deg g（x）＝1＜deg（x－2）$^{2}$＝2

    又 f（x）＝（x－2）$^{2}$〔（x－1）q（x）＋1〕＋g（x）

    ∴f（x）除以（x－2）$^{2}$ 的餘式為 g（x）

    (E)╳：f（x）＝（x－1）（x－2）$^{2}$ q（x）＋（x－2）$^{2}$＋g（x）

    ＝（x－1）（x－2）$^{2}$ q（x）＋（x－1）（x－2）－x＋2＋g（x）

    ＝（x－1）（x－2）〔（x－2）q（x）＋1〕＋（－x＋2）＋g（x）

    故餘式為（－x＋2）＋g（x）

    故選(A)(B)(D)'
- id: doc_110_台中_興大附中_數學_g10s1e3_s2_4
  section: 2
  number: 4
  type: multiple
  page: 2
  stem: 三次函數 g（x）與一次函數 h（x）的部分圖形，如右圖所示，已知 g（x）的圖形與 h（x）的圖形交於 A（－1，－6）、B（1，－2)、C（2，0）三點，令 f（x）＝g（x）－h（x），下列關於 f（x）的性質哪些敘述是正確的？
  options:
  - label: A
    content: f（x）是一個三次函數
  - label: B
    content: f（x）有 x－2 的因式
  - label: C
    content: $x^{2}$＋1 是 f（x）的因式
  - label: D
    content: f（x）的首項係數是正數
  - label: E
    content: h（x）的圖形是一條斜率為－1 的直線
  assets:
  - key: s2_4_f1
    kind: figure
    file: doc_110_台中_興大附中_數學_g10s1e3/s2_4_f1.png
    crop:
      page: 2
      rect:
      - 438.2
      - 328.0
      - 564.0
      - 449.8
  answer:
  - A
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：∵deg f（x）＝deg g（x）＝3 ∴ f（x）是一個三次函數

    (B)○：f(2)＝g(2)－h(2)＝0－0＝0 ∴ f（x）有 x－2 的因式

    (C)╳：∵ f(2)＝f(1)＝f（－1）＝0，又 deg f（x）＝3

    ∴令 f（x）＝a（x＋1）（x－1）（x－2）

    故 $x^{2}$＋1 非 f（x）的因式

    (D)○：∵ g（x）的首項係數是正數，又 f（x）和 g（x）的首項係數相等

    ∴ f（x）的首項係數是正數

    (E)╳：∵ h(2)＝0，h(1)＝－2

    ∴ h（x）的圖形斜率為 $\frac{0 - (-2 )}{2 - 1}$＝2

    故選(A)(B)(D)'
