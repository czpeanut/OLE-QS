- id: doc_108_台北_大同_數學_g10s2e1_s2_2
  section: 2
  number: 2
  type: single
  page: 1
  stem: '若某年度的指考，全體考生的英文平均 81 分，標準差 4 分；數學平均 64 分，標準差 10 分。假設某大學的指考分發入學是採計當年度指考英文與數學「標準化」後分數的加總，再以擇優錄取方式，錄取 1 人。右表是<u>大陳</u>、<u>小時</u>、<u>阿中</u>、<u>阿豪</u>、<u>讚讚</u>等五位同學今年度指考的英文與數學成績，試問該校系應錄取哪一位同學？

    | 科目 | 英文成績 | 數學成績 |

    | --- | --- | --- |

    | <u>大陳</u> | 89 | 60 |

    | <u>小時</u> | 77 | 84 |

    | <u>阿中</u> | 80 | 62 |

    | <u>阿豪</u> | 85 | 69 |

    | <u>讚讚</u> | 79 | 74 |'
  options:
  - label: A
    content: <u>大陳</u>
  - label: B
    content: <u>小時</u>
  - label: C
    content: <u>阿中</u>
  - label: D
    content: <u>阿豪</u>
  - label: E
    content: <u>讚讚</u>
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '標準化成績＝$\frac{原成績-平均}{標準差}$

    將原成績標準化後如右表

    <u>大陳</u>總和最高，故選(A)'
- id: doc_108_台北_大同_數學_g10s2e1_s3_1
  section: 3
  number: 1
  type: multiple
  page: 1
  stem: 下列哪些選項是正確的？
  options:
  - label: A
    content: 已知有一等差數列的第 3 項和第 8 項分別為 9 和 44，則此數列的首項為－5
  - label: B
    content: 一等比數列前 4 項的和是 5，前 12 項的和是 285，則前 8 項的和是 40
  - label: C
    content: 此級數 1×2＋2×3＋3×4＋……＋9×10 之和為 320
  - label: D
    content: 設〈 $a_{n}$ 〉是等差數列，則$\langle 3^{a_{n}}\rangle$為等比數列
  - label: E
    content: 設〈 $a_{n}$ 〉是等差數列，則$\langle a_{n}+a_{n+1}\rangle$亦為等差數列
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) ○：公差$d=\frac{44-9}{8-3}=7$，故首項為 9－7×2＝－5

    (B) ╳：依題意得$\begin{cases}\frac{a_{1} (1-r^{4})}{1-r}=5 \\ \frac{a_{1} (1-r^{12})}{1-r}=285\end{cases}$

    兩式相除得$\frac{1-r^{12}}{1-r^{4}}=57=\frac{5}{1-r^{4}}$

    ⇒ $r^{8}$＋$r^{4}$＋1＝57 ⇒ $r^{8}$＋$r^{4}$－56＝0 ⇒ $r^{4}$＝7 或－8

    $r^{4}$＝7

    ⇒ $\frac{a_{1}}{1-r}=\frac{5}{1-r^{4}}=\frac{5}{1-7}=-\frac{5}{6}$，前 8 項的和為$\frac{a_{1} (1-r^{8})}{1-r}$＝$-\frac{5}{6}\times (1-7^{2})$＝40

    $r^{4}$＝－8

    ⇒ $\frac{a_{1}}{1-r}=\frac{5}{1-r^{4}}=\frac{5}{1+8}=\frac{5}{9}$，前 8 項的和為$\frac{a_{1} (1-r^{8})}{1-r}$＝$\frac{5}{9}\times 〔1-(-8)^{2}〕$＝－35

    故前 8 項的和是 40 或－35

    〈另解〉

    $S_{4}$，$S_{8}$－$S_{4}$，$S_{12}$－$S_{8}$ 成等比

    ⇒ （$S_{8}$－5）$^{2}$＝5×（285－$S_{8}$）

    ⇒ $S_{8}^{2}$－$5S_{8}$－1400＝0 ⇒ （S－40）（S＋35）＝0 ⇒ $S_{8}$＝40 或－35

    (C) ╳：1×2＋2×3＋……＋9×10

    ＝（$1^{2}$＋1）＋（$2^{2}$＋2）＋……＋（$9^{2}$＋9）

    ＝（$1^{2}$＋$2^{2}$＋……＋$9^{2}$）＋（1＋2＋……＋9）

    ＝$\frac{9\times 10\times 19}{6}+\frac{9\times 10}{2}$＝285＋45＝330

    (D) ○：$\frac{3^{a_{n+1}}}{3^{a_{n}}}=3^{a_{n+1}-a_{n}}=3^{d}$，其中 d 為$\langle a_{n}\rangle$的公差，$3^{d}$ 為定值

    故$\langle 3^{a_{n}}\rangle$為等比數列

    (E) ○：（$a_{n＋1}$＋$a_{n＋2}$）－（$a_{n}$＋$a_{n＋1}$）＝（$a_{n＋1}$－$a_{n}$）＋（$a_{n＋2}$－$a_{n＋1}$）

    ＝d＋d＝2d

    故〈 $a_{n}$＋$a_{n＋1}$ 〉為等差數列

    故選(A)(D)(E)'
