- id: doc_108_台北_大同_數學_g10s2e1_s4_1
  section: 4
  number: 1
  type: fill
  page: 2
  stem: '數學小知識：康托爾集（Cantor set）是由<u>德國</u>數學家<u>康托爾</u>提出，並且奠定了現代點集拓樸學的基礎。所謂的康托爾三分點集的建構法如下 （如右圖）：

    第一步，將一條長度為 1 單位的線段去掉中間三分之一。

    第二步，把剩下的所有線段再去掉中間三分之一。

    第三步之後，重複上一步驟的動作。

    如此的不斷去掉線段的中間三分之一後，所剩下的部分就稱為康托爾三分點集。

    若此建構法進行到第九步時，剩下的線段共有 m 條，線段的總長度為 n 單位，試求數對（m，n）＝＿＿＿＿。（以指數形式表示之）'
  assets:
  - key: s4_1_f1
    kind: figure
    file: doc_108_台北_大同_數學_g10s2e1/s4_1_f1.png
    crop:
      page: 2
      rect:
      - 332.75
      - 548.05
      - 564.3
      - 648.5
  answer:
  - $\left( 2^{9} , \frac{2^{9}}{3^{9}} \right)$
  answer_status: verified
  answer_source: answer_key
  explanation: '令 $a_{k}$，$b_{k}$ 分別表示第 k 步時，剩下的線段數與總長度，則

    $a_{1}$＝2，$a_{2}$＝4，$a_{3}$＝8，……

    $b_{1}$＝$\frac{1}{3}\times 2$，$b_{2}$＝$\left( \frac{1}{3} \right) ^{2}\times 2^{2}$，$b_{3}$＝$\left( \frac{1}{3} \right) ^{3}\times 2^{3}$，……

    故 $a_{9}$＝$2^{9}$，$b_{9}$＝$\left( \frac{1}{3} \right) ^{9}\times 2^{9}$＝$\frac{2^{9}}{3^{9}}$

    ⇒ 數對（m，n）＝$\left( 2^{9} , \frac{2^{9}}{3^{9}} \right)$'
