  answer_source: answer_key
  explanation: '∵$\frac{1^{3}+2^{3}+\ldots \ldots +k^{3}}{1+2+\ldots \ldots +k}$＝$\frac{\left[ \frac{k (k+1)}{2} \right] ^{2}}{\frac{k (k+1)}{2}}$＝$\frac{k (k+1)}{2}$＝$\frac{1}{2} (k^{2}+k)$

