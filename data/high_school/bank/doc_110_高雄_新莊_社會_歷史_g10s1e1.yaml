  stem: 資料一：清段玉裁《說文解字注》：「獸足謂之番。从采、田象其掌。」 資料二：「臺灣原住民的族群名，很多都代表『人』的含意，例如在布農族的『Bunun』的原意即是人。」 資料三：清黃逢昶等著《臺灣生熟番記事》：「臺灣枕夷夏之交，四面濱海，層巒聳翠相連。後山為生番巢穴，名曰高山番；山外皆熟番所居，名曰平埔番。」 關於以上三段資料，下列敘述何者較為恰當？
  options:
  - label: A
    content: 臺灣原住民被稱為番，是始於清治時期
  - label: B
    content: 臺灣原住民自稱為番，故清治時期將其分為高山番與平埔番
  - label: C
    content: 從資料一和資料二可看出，漢人稱呼原住民為「番」，與原住民各族以「人」來命族名的用意相同
  - label: D
    content: 對照資料一與資料三可看出，漢人稱呼原住民為「番」，是將其貶低如野獸，有文化歧視的意味
