- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e1_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 下列對於「國家認同」的敘述，請選出錯誤的
  options:
  - label: A
    content: 國家認同是指個人對國家的歸屬感，主動認為自己屬於國家，願意為國家效忠，甚至在國家有危難時願意犧牲自我的一種心理狀態
  - label: B
    content: 當 U18 國際棒球比賽在國內舉行時，國人揮舞國旗為中華隊加油，就是一種國家認同的表現
  - label: C
    content: 當國家遭遇外來侵略時，國家認同能夠凝聚全民的力量，共同協助國家度過難關
  - label: D
    content: 人民對自己國家的國家認同，可以驅使個人願意為國家努力，終其一生不會改變
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 國家認同是種對國家的歸屬感、認同感，認為自己是國家的一份子，願意為國家貢獻。但國家認同可能會因個人經歷、社會環境、政治因素等情況而產生改變。
