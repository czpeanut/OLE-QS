  stem: 烏克蘭混血名模瑞莎（中文名李瑞莎）放棄原國籍後，在 2019 年 1 月 24 日正式取得臺灣身分證，成為首位從烏克蘭人變成臺灣人的例子。她在烏克蘭是高材生，模特兒事業也做得有聲有色，完全沒想過會離開烏克蘭生活。她曾經是烏克蘭韻律體操國手，現在不但在臺灣落地生根，更義務到中小學協助訓練體操選手。請問當瑞莎成為我國的公民之後，與之前相比將有何種改變？
  options:
  - label: A
    content: 可受到基本醫療保障
  - label: B
    content: 可在臺灣上學念書
  - label: C
    content: 可以在選舉時投票
  - label: D
    content: 可以在網路上當 YouTuber
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 瑞莎歸化成為我國公民後與之前最大的差異便是參政權，故選(C)。(A)(B)(C)上述幾項生活模式不需具備公民身分，可以外國人居留身分達成。
