    | --- | --- | --- | --- | --- |

    | 儘快統一 | 4 ％ | 3 ％ | 4 ％ | 4 ％ |

    | 先維持現狀再統一 | 9 ％ | 7 ％ | 6 ％ | 6 ％ |

    | 永遠維持現狀 | 53 ％ | 51 ％ | 51 ％ | 53 ％ |

    | 先維持現狀再獨立 | 12 ％ | 14 ％ | 16 ％ | 13 ％ |

    | 儘快獨立 | 16 ％ | 21 ％ | 18 ％ | 18 ％ |'
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 「儘快獨立」的調查數據中，2019 年到 2022 年間，在 2020 年達到 21 ％的最高峰。(B)比例最低的時候，應是 2019
    年的 12 ％。(C)「儘快統一」的比例皆在個位數，皆低於「儘快獨立」的比例。(D)「永遠維持現狀」的比例呈現消長，先降後升，並非逐年上升。
