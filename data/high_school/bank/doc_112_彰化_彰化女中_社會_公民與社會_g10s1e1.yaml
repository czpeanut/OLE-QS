  stem: 1989 年 4 月 7 日，鄭南榕因在「自由時代」雜誌刊登旅日學者所擬的《臺灣新憲法草案》，遭當時執政的國民黨拘捕。為抗議國民黨的非法拘捕，他在雜誌社的辦公室引火自焚。2016
    年，政府訂定 4 月 7 日為「言論自由日」，以紀念為爭取言論自由而犧牲的鄭南榕。請問下列選項中所侵害的人民權利，何者與鄭南榕所爭取的權利相同？
  options:
  - label: A
    content: 描述南韓民主化運動的電影「我只是個計程車司機」被中國政府禁止上映
  - label: B
    content: 亞洲水泥公司未做環境影響評估就開山挖礦，破壞太魯閣國家公園的生態
  - label: C
    content: 阿志被懷疑攜帶違禁物品，導師趁她上體育課時偷偷檢查他的書包
  - label: D
    content: 中國北京市政府以整治安全為由，強制驅逐數十萬由外地移入的低社會階層人口
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 鄭南榕刊登《臺灣新憲法草案》、發表民主自由的言論，皆屬表達意見自由權的範疇，與(A)政府箝制民主作品上映，限制與民主相關的意見表達相符。(B)應為環境權。(C)應是違反隱私權。(D)強制驅離侵犯居住遷徙自由。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e1_s1_12
  section: 1
