  section: 1
  number: 1
  type: single
  page: 1
  stem: 《哈利波特》作者羅琳（J. K. Rowling）年輕時曾在某國際組織英國倫敦總部工作，她每天讀到從獨裁國家匆匆寫下、偷寄出來的陳情信，看到絕望家屬寄來無故失蹤人口的照片，以及整理受虐人犯的自白及照片。她的同事多半都是之前被關過、失去家園的政治犯，只因他們是政府口中的異議份子。請問上文所提及的某國際組織是指下列何者？
  options:
  - label: A
    content: 世界展望會
  - label: B
    content: 自由之家
  - label: C
    content: 國際特赦組織
  - label: D
    content: 歐洲人權法院
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 國際特赦組織總部位於英國倫敦，屬國際非政府組織，該組織致力於推動全球人權事業的發展，對人權狀況進行調研，採取相應行動，尋求終結各種侵犯人權的行為，並且為那些遭受迫害的人們伸張正義，故選(C)。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 美國民權運動領袖金恩（Martin Luther King, Jr.）在蒙哥馬利市領導「公共汽車罷乘」運動，他也曾發表知名演說「我有一個夢」（I have
    a dream），在演說中反覆強調他多麼希望美國有一天能夠落實「完全的黑白平等」。而這場演說也間接促成國會通過《民權法案》，宣布所有的種族隔離及歧視政策違法。下列有關金恩博士爭取權利的相關敘述，何者正確？
  options:
  - label: A
    content: 因為演說強調君權神授，所以值得後人紀念
  - label: B
    content: 通過《民權法案》後，非裔已不再遭受到歧視
  - label: C
    content: 美國獨立後強調天賦人權，現已達人人平等
  - label: D
    content: 《民權法案》的通過代表公民權保障的法制化
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 透過《民權法案》的通過，可知美國社會以法制化來保障公民權利。(A) 17 世紀以前，歐洲各國君主強調「君權神授」，認為君主的統治正當性來自上帝的賦予，因此人民必須絕對服從君王的統治，沒有反抗的權利。(B)即使通過法案，難保社會民眾不再歧視非裔族群，因理念層面的變動最為困難。(C)
    17 世紀以後「天賦人權」的學說興起，即人具有天生的生存、自由、追求幸福和財產的權利。即使天賦人權的觀點受到重視，但社會現況難以落實人人平等的理念。
