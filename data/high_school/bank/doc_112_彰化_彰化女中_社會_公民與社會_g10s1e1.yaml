  stem: 我國的《司法院釋字第 748 號解釋施行法》保障同性婚姻，使同性戀者與異性戀者皆擁有結婚的權利。該法實施至今，許多民眾透過各種管道發聲表達認同及支持，但也有反對的聲音持續不輟。請問依據題文，該法最能落實以下哪項與人權有關的理念？
  options:
  - label: A
    content: 保障社會處境不利群體的積極平權
  - label: B
    content: 凝聚社會處境不利群體的國家認同
  - label: C
    content: 肯認社會不同群體的多元身分認同
  - label: D
    content: 促進社會不同群體的意見表達自由
  answer:
