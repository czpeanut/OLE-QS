  stem: 「美國在臺協會」（AIT）已將臺灣納入「先簽證計畫」（Visa Waiver Program，VWP），此後國人赴美不必再花費時間及金錢申請簽證，但臺灣在國際上依舊無法具有一個完整的國際人格。請問上文凸顯我國在國際社會遭遇到下列何種問題？
  options:
  - label: A
    content: 臺灣的經濟表現雖受到國際肯定，但是始終無法與他國在政治上有所接觸
  - label: B
    content: 臺灣的存在雖獲得部分國家事實上的承認，但是卻無法獲得多國在法理上的承認
  - label: C
    content: 其他國家是基於發展自己的觀光事業才給予臺灣免簽證待遇，與國際承認無關
  - label: D
    content: 臺灣在國際上早已獲得法理上的承認，各國之所以無法公開支持乃因中共打壓所致
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 臺灣在國際社會上的活躍表現受到許多國家肯定，但就算是關係良好的日本也無法在外交上給予法理上的承認，建立邦交關係。(A)我國在國際組織的參與上常有與他國在政治上、經濟上接觸的機會。(C)給予臺灣免簽證待遇證實，該國也認可臺灣的國家主體性。(D)臺灣在國際上獲得事實上的承認而非法理。
- id: doc_112_彰化_彰化女中_社會_公民與社會_g10s1e1_s1_13
