- id: doc_111_桃園_武陵_社會_公民與社會_g10s1e1_s2_9
  section: 2
  number: 9
  type: single
  page: 2
  stem: 上文所述之爭議內容，凸顯了國家主權與人民生活的何項關係？
  options:
  - label: A
    content: 認定身分，保障應有的各項權利
  - label: B
    content: 發行貨幣，並透過法律賦予支付交易的效力
  - label: C
    content: 維護秩序、解決糾紛與提供社會福利
  - label: D
    content: 發給護照，保護與協助境外國民
  group_stem: '(一)根據2022年10月28日公布的憲判字第17號主文，憲法增修條文第10條第11項及第12項前段規定保障原住民族，應該包含既存於臺灣之所有臺灣南島語系民族，其所屬成員得依法取得原住民身分，《原住民身分法》第2條中，僅有「平地原住民」與「山地原住民」的規定違憲，意即在現有的原住民概念之外，「其民族語言、習俗、傳統等文化特徵至今仍然存續，其成員仍維持族群認同，且有客觀歷史紀錄可稽之其他臺灣南島語系民族，亦均得依其民族意願，申請核定其為原住民族。」 位在台南的西拉雅族是平埔族中人口最多，還保有傳統部落文化的族群，1993年起，展開文化復興與正名運動，並與當時展開的原住民正名運動結合，只是在1994年8月1日國民大會修憲將貶義的「山胞」改為「原住民」，卻沒有處理「平埔族」要不要成為原住民的問題，埋下西拉雅族不斷提起行政訴訟的起點。 會有如今平埔族與原住民的身分區分，最大的關鍵在於這座島嶼不同外來政權下，各自的歷史遭遇，前者指稱原住民族中，居住在平原地帶且遭到荷蘭、鄭氏、清朝統治的族群；後者則指稱沒有前述歷史經驗，居住於高山或平原且較晚近才遭日本、國民黨政權相繼統治的族群。 政治大學民族學系名譽教授林修澈指出，清朝時期，在統治範圍內的原住民稱為「熟番」、統治之外則稱「生番」;日治時期「熟蕃」與「人」無差別，只專注處理「生蕃」─被日本政權稱為「蕃人」或「高砂族」，被認為是「未開化」進行「化蕃」，積極進入山地管理、鎮壓，試圖讓生蕃歸化成為本島人。國民政府來台後，延續這樣的概念，起初以「山地同胞」（山胞)稱呼高山族原住民族，更進一步在1956年區分為「平地山胞」、「山地山胞」以便於管理，且隔年允許日治時期被稱「熟蕃」(即現今的平埔族)者得以申請登記為平地山胞，總共四度限期補辦登記，但在當時原住民族已遭汙名化情況下，實際登記者甚少。 2016年8月1日，總統蔡英文在原住民日對於歷來統治者消除平埔族群個人及民族身分，向包括平埔族的原住民族道歉；2017年行政院提出的《原住民身分法》修正草案中增列「平埔原住民」，並明定其民族權利另以法律定之，但後續此案卻無疾而終。林修澈認為，六席山地與平地原住民立委不管有表態或不表態，皆認為平埔族納入平地原住民會稀釋平地原住民權益，因此草案送進立法院之後並未排審，在屆期不續審下退回行政院，而行政機關也未再提出新版本。

    ──摘自報導者〈大法官宣告《原住民身分法》違憲後，西拉雅族人「甘願做蕃」的未竟之路〉'
