  stem: '依據上下文意判斷，<u> 甲 </u>可填入下列哪些詞語？

    (九)Matsusaka (2005)整理了一些直接民主的好處：理想上，直接民主可以讓政治人物更「傾聽民意」，因為代議政治下代議士可以利用「資訊不對稱」來逃避民意監督、謀求私利，而若運用直接民主，一旦他們的決策讓人不滿意，便可以用公投推翻之。 但是就像美國的國父們想的一樣，政治問題複雜，選政策的時候並不是簡單的是非題就可以解決。公投把多面向的議題簡化為單一面向，例如英國是否退出歐盟，既是經濟問題、國安問題也是人權問題，但最後只有兩個選擇：「留下」或「離開」。更甚者，由於政府也有其支持的選項，最後公投就變成對政府支持與否的大型民調，於是運用公投決策反而不利於政策辯論或透過理性對話分享資訊、尋求針對社會問題最有利的解決方案。 再者，選民能力有限、時間有限，無法處理大量資訊也是個問題，即使是政治學家或專業的政治工作者，他們所了解的資訊都已經非常少了(Lupia，2015)，一般民眾更不可能也沒有意願了解大量的政治資訊來選擇政策(Downs，1957)。民眾在不了解所需資訊的情況下便要做決策，是各種民主程序下皆有的問題，並非只發生於直接民主，Lupia and McCubbins (1998)便提出選民會用各種捷徑(shortcuts)來做決策，例如跟著自己信賴的意見領袖或政治人物的意見投票。但是將這個邏輯套用在公投的情況下，就表示公投雖然是要選政策，人民最後還是在選擇要追隨哪個意見領袖，變成是對政治人物的公投。 直接民主最令人擔心的問題還是在於是否存在「多數暴力」？...Hainmueller and Hangartner (2012)透過分析瑞士「歸化制度」的變化，指出如果移民歸化的決定(亦即決定是否同意一位申請人歸化成為瑞士公民)是由地區議會的議員來做而非經由公投，成功歸化的數量多了約百分之五十，對於來自土耳其或前南斯拉夫地區的申請者，差別尤其明顯。他們認為公投是不利於在瑞士長期居留、申請歸化的少數族群的，因為議員們拒絕歸化申請需要公開提出理由，而公投的時候民眾卻可以自在地投反對票。 所以，公投並沒有想像中的那麼民主，但也不能就說公投完全是沒有用的，公投與否有利有弊。Maskin and Tirole (2004)認為對國家最重要的決策應由直接民主決定，而專業性的、一般民眾難以取得或分析資訊的問題，或者是政策效果要長時間才能顯現的問題，則應該由獨立專業人士做決策。有些決策不需依賴專家見解，公投或許是有意義的，例如國家獨立公投。但就像Müller(2016)在定義什麼是「民粹主義」時提到的，民粹政治人物們喜歡大量提出公投、事事皆公投，其目的只在希望民意為自己早有定見的政策背書，而非廣納民意，這就絕非使用公投的時機。

    ──摘自沈智新《公投利大於弊？》'
