  stem: '小皮公民課上到中央政府與地方政府的權限劃分，他的筆記内容如下，正確的選項有哪些？

    |  | 聯邦國 | 單一國 |

    | --- | --- | --- |

    | (A) | 權力集中於中央政府 | 地方政府有相當大的自主權 |

    | (B) | 地方上沒有自治團體或憲法 | 各州（邦）有自己的憲法 |

    | (C) | 中央與地方政府較為平等 | 中央與地方為上下階層關係 |

    | (D) | 中央集權 | 地方分權 |

    | (E) | 代表國：日本、法國 | 代表國：美國、德國 |

    (八)冰島受2008年金融危機影響而掉入破產深，人民於是發起許多社會運動，重新檢視既、金融規範乃至於制定新憲法。以下是與當時一系列改革活動有關年11月7日，從五百二十三位公民(政黨員和政府部會首長禁止代表)候選人五人大會。…於是，團隊便開始工作了。這是史上首見的創舉，由公民參與研擬他們書和推特上提出修正案、作出評論，要求釋說明等，還可以列席會議或是在YouTue觀看實況轉播。每一週都會公布一個計畫的暫時版本，歡迎大家評論。… 「我們收到了來自全國各地、甚至是世界各地的評論和提議，其中有不少被我們應用在憲法草案裡，」奥德斯朵提回憶道：「而我們以非常獨創的方式來工作。在一場討論中，我們習於認為兩者當中有一方是對的，非彼即此。然而，我們決定不這麼工作，而採行取得共識的方法。如此帶給我們絕佳的結果。我們給予彼此機會去尋求一個明智的解決辦法，一個比任何一方所提出之方案都更佳的解答。政客們也應該試試看這種方式。他們必須停止認為只要自己是多數的一方，就可以隨心所欲地做事。他們必須聆聽別的聲音。 在我們所制定的憲法中，有三個特別偏好的主題：權力的分配、透明與責任。我們尋求的是如何重新分配權力，以減少貪污的情況。…我們也想要發展<u>[ 甲 ]</u>，以擺脫現今這個愚蠢的體系——讓我們每四年選出一個政黨，卻沒有一點跡象顯示出未來的四年會發生什麼事，也不知道他們會將國家領導到什麼方向。這有點像是在玩樂透彩。在我們書寫的憲法中包含了諸如10%的人口便可以要求舉辦公投，或是一般平民百姓可以向國會提出立法草案等。這是激進的做法，但這也是未來必須發生的事。」

    ——改寫自《找尋明天的答案》〈冰島的革命：與金融對抗的公民，以及歷史上首次由人民制定的憲法〉'
  options:
