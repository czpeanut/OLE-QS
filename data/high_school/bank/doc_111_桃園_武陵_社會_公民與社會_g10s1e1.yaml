  type: single
  page: 1
  stem: 「人類對抗權力的鬥争，就是記憶與遺忘的鬥爭。」捷克裔法國籍作家米蘭·昆德拉（Milan Kundera）在其名著《笑忘書》中如此寫道。該書講述蘇聯佔領下捷克人的生活，透過書中主角吻說道:「要消滅一個民族…首先要剝奪他們的記憶。毀掉他們的書籍、他們的歷史。然後會有人來幫他們重新寫書，給他們新的文化，為他們編造新的歷史。然後，這個民族會開始慢慢忘記自己現在的様子，開始遺忘自己的過去。」若以轉型正義的角度，應如何解讀這段話？
  options:
  - label: A
    content: 歷史的正義是當代掌權者所定義的，成者為王敗者為寇
  - label: B
    content: 民主化後要求對威權時期政府不義行為的調查和檢討，是對權力當局進行鬥爭
  - label: C
    content: 重視對歷史的保存與檢討威權加害者，才能避免未來政府對人權的侵犯
  - label: D
    content: 放下過去威權時期的記憶與文化，一個民族國家才能締造新的歷史
  tags:
    unit:
      code: CI-2-2-1
      book: 公民與社會2 正義與法治
      chapter: 公平正義的追求
      title: 社會正義
      std: true
