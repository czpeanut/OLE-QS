  options:
  - label: A
    content: 國家對於工作權之保障，不可因國民之身心狀況而有差別待遇
  - label: B
    content: 保障身心障礙者的教育、行動與工作權，並非憲法上重要公共利益
  - label: C
    content: 按摩業的工作性質與視覺能力無關，此優惠差別待遇並不公平
  - label: D
    content: 為彌補身障者的弱勢處境，國家只要給予優惠就能促進平等
  group_stem: (四)司法院於2008年公布第649號解釋，認定《身心障礙者保護法》第37條第1項前段「非本法所視覺障礙者，不得從事按摩業」之規定，與《憲法》多項原則意旨不符，宣告違憲。 解釋文中指出，由於視障者在成長、行動、學習、受教育等方面之諸多障礙，在工作的選擇上比一般人少，使其弱勢的地位不易改變。根據我國《憲法》第155條及《憲法增修條文》第10條第7項規定也明白揭示，國家有扶助弱勢之義務。因此，立法者基於保障視障者工作權之目的，加上衡量視障者長久以來多以按摩業為生，制定保障視障者的優惠性差別待遇，具備憲法上重要的公共利益。 《憲法》第15條亦規定人民之工作權應予保障，人民有從事工作及選擇職業之權利，立法者若要對此加以限制，除了須具備重要公共利益外，限制的手段也不得對人民造成過度的限制，且與目的之間具備實質的關聯，才符合憲法對平等權的保障。然而，立法者僅允許視障者從事按摩業，按摩業之工作技能亦非視障者方能從事，此規定使得非視障者(非視障之身心障礙者也在禁止之列)必須轉行或失業，也無法促進社會整體發展，顯然與視障者的就業利益不相當。
