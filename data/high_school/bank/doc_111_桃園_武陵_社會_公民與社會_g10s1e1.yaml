    (" Why the poorest county in West Virginia has faith in Trump") 片段

    資料二 他(川普)令許多人作噁的言論如嚴審移民、否定全球暖化、減稅等政策，其實完全針對沈默藍領(指體力勞動階層)白人選民的恐懼而來，…，為了固穩左派基本盤，希拉蕊曾說出：「川普支持者皆是未開化，無可救藥的選民(basket of delorable)」… 「政治正確」是歐巴馬的王牌。但以此之名，將所有不同於都會區、高教育白領主流價值標籤化，忽視這些想法背後的結構性問題，而一律視為『反智』、『無腦』、『歧視』、『偏激』，其實正與上述形容司一樣，同樣造成了美國社會上日漸嚴重的對立。

    ──摘自侯智元〈我不是川普鐵粉，我只是反對傲慢地解讀民主)

    資料三 政府對COVID-19疫情大流行的反應加劇了全球民主的衰落，在36個國家和地區中的42國得分下降與健康危機有關。專制政權和民粹主義領導人致力於降低透明度，助長虛假或誤導性訊息，並打擊不利數據或批評觀點。許多對政府處理疫情大流行表示反對的人面臨騷擾或刑事指控。封鎖有時會被安全機構過度的、政治化的、或粗暴的實施。而世界各地的反民主領導人則以一流行病為掩護，削弱政治反對派，鞏固權力。實際上，例如匈牙利和斯里蘭卡等國今年的許多負面發展可能產生持久影響，這意味著疫情大流行的最終終結並不一定會導致立刻的民主復興。

    ──摘自Freedom House自由家2021年〈新報告：全球民主的衰落加速〉'
