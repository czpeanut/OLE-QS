  stem: 英國在2016年6月23日公投選擇脫離歐盟，随後英國政府與歐盟陸續開啟多場談判，内容包含未來貿易關係、公民權等重要議題。其中就公民權議題，雙方協議讓兩地公民權利獲得保障。因為根據《歐洲聯盟條約》規定，歐盟公民得以在其所居住的其他歐盟國家行使與該國公民相同的選舉權與被選舉權，及向歐洲議會請願的權利。以上案例凸顯在國際往來頻繁的現代，對傳統主權國家產生什麼影響？
