  stem: 2022年法國總統大選第二輪投票於4月24日落幕，由馬克宏（Emmanuel Macron）贏得連任。法國總統選舉制度與臺灣不同，採「絕對多數制」，候選人須得到超過50%的選票方能勝選，故經常須舉行「兩輪投票」。此特性雖然耗費資源，但也避免了「相對多數制」的何項缺點？
