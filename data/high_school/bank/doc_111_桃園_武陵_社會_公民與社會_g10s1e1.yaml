  group_stem: (二)2022年國慶日標語為「守土衛國 你我同行」，英文標語為“TAIWAN NATIONAL DAY 2022”。對此引發各界不同看法，(甲)認為應以"R.O.C.NATIONAL DAY日作為國慶日英文名稱，且總統應釐清我國與大陸是「互不承認主權，互不否認治權」的關係；而(乙)則認為應把中華民國的治權與現狀結合在一起，許多人對於「臺灣=中華民國」的認同並不互斥：但是(丙)卻認為中國是中國，壹灣是臺灣，不應偷換概念，臺灣要創立屬於自己的國慶日。 總統蔡英文也在國慶日發表演說：「…中國在南海、東海，以及臺灣海峽的軍事行動，衝擊印太地區的和平穩定。我們絕對不能忽視，軍事的擴張正在挑戰自由民主的世界秩序。這些變局，都跟臺灣息息相關。臺灣正處在變局之中。我們不能抱著僥倖的心態。我們必須堅定民主立場，審慎的做出準備，隨時因應瞬息萬變的情勢。」 國台辦發言人馬曉光則回應，這篇「講話」繼續堅持「兩國論」立場，歪曲兩岸關係性質，渲染大陸「威脅」，重申只有回到體現「一個中國原則」的「九二共識」的基礎上來，兩岸雙方才能對話溝通。
