  section: 2
  number: 14
  type: single
  page: 3
  stem: 根據上文判斷，有關《原住民族基本法》第21條之規定，下列敘述何者最適當？
  options:
  - label: A
    content: 原住民族並未擁有該土地，但此規定保障其參與及共同管理的權利
  - label: B
    content: 性質上如同主權，原住民族對於該土地具有統治與管理之權力
  - label: C
    content: 原住民族經部落討論形成共識後，可以自由轉賣或出租該土地
  - label: D
    content: 該土地如同「國中之國」，原住民族在該領域內不受中華民國法律限制
  group_stem: '(三)亞泥花蓮新城山礦權在2017年11月通過展延，亞泥可以再採20年，嚴重影響地太魯閣族人權益，不少人抗議政府通過展延時沒有按照《原住民基本法》第21條：「政府或私人於原住民族土地或部落及其周邊一定範圍內之公有土地從事土地開發、資源利用、生態保育及學術研究，應諮商並取得原住民族或部落同意或參與，原住民得分享相關利益。」立法院審查《礦業法》時，經濟部常務次長對於原住民的「諮商同意權」表示：「國際上沒有一個國家採礦，要經過原住民同意的。」 但事實上，紐西蘭和美國阿拉斯原住民都擁有「諮商同意權」、不只如此，紐西蘭的大型開發案還需要經過「文化環評」，紐西蘭毛利人甚至擁有「專屬礦權」。紐西蘭《資源管理法》及《懷唐伊條約》承認毛利人對於自然資源有「守護」的責任，等於給了毛利人「諮商同意權」，「既然它有守護的責任，你就要經過諮詢，經過它的同意」政大民族系副教授官大偉說。 《資源管理法》也賦予地方政府，與毛利人部落「共同管理」自然資源的權利。此外，如果採礦的地點對毛利人來說，有重大文化意義，比方是原住民重要的神聖、禁忌地點，「不管你採礦計畫進行到什麼階段，毛利人都有權拒絕、要求中止採礦活動」。故開發計畫不只必須進行環評，還需要進行「文化環評」(全名「以文化基礎之環境影響評估」)。從文化角度看環境變化造成什么影響，官大偉舉例，「比如開發造成動物減少，(需評估)動物減少後對原住民狩獵文化有沒有影響。」」 反觀臺灣的原住民族權利，其實我們的《原住民族基本法》並沒有比較落後，《原基法》第22條也規定了類似紐西蘭的「共同管理」機制，第21條也寫明，在原住民部落開發，必須與原住民「諮商」，並取得「同意」，或讓原住民「参與」。東華大學原住民族學院院長浦忠成，也是當年《原基法》的籌劃者說，「《原住民族基本法》在12年前（頒布時)，其實是國際相當進步的原住民族法律。」但國民黨原住民族立法委員鄭天財表示，過去各部會都以傳統領域還沒有正式公告為由，拒絕落實《原基法》21條的「諮商同意權」。長期關注臺灣礦區環境的地球公民基金會執行長李根政也說：「全臺灣246個礦場，八成（約196個）位在原住民的傳統領域。其中，沒有半個餞行《原基法》21條。」

    ──摘錄自關鍵評論〈挖礦還要先問過原住民？紐西蘭毛利人不僅有「專屬礦權」，還有「文化環評」〉'
