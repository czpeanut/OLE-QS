  stem: 英國前首相特拉斯（Liz Truss）上任僅45天即因為減稅政策受質疑、通膨情況未緩解而黯然辭職。前財政大臣蘇納克（Rishi Sunak）獲英國國王查爾斯三世任命為新任首相，為英國200多年以來最年輕的首相，也是第一位印度裔首相。據上文，關於英國的政府制度，下列敘述何者正確？
  options:
  - label: A
    content: 首相辭職後需宣布解散國會，透過國會改選以產生新的首相
  - label: B
    content: 英國首相不受固定任期保障，若失去民意支持即須辭職以完成政黨輪替
  - label: C
    content: 首相須透過國王任命才能就職，代表國王掌握實質的政治權力
  - label: D
    content: 蘇納克需具備國會議員身分，並贏得國會大黨黨魁選舉才可成為首相
