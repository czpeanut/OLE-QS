  stem: 關於上文中的第一種對於平等的論述，下列敘述何者正確？
  options:
  - label: A
    content: 強調相同事物、相同對待的實質平等
  - label: B
    content: 提供不同性別者相同機會，是立足點平等
  - label: C
    content: 認為平等就是無差別對待，主張形式平等
  - label: D
    content: 可因事物本質差異而有不同對策，是齊頭式平等
  group_stem: '(五)2006年6月1日台鐵為防治性騷擾，於通勤的電聯車試辦「女性專用車廂」，後由於婦女團體意見不一致，男性團體投訴反對，以及實際執行困難等情型，於11月底試辦期滿後喊停。在這段試辦期間，各界對於設置女性專用車廂究竟是邁向性別平等的階段性策略，還是阻礙性別平等的機制，有許多辯論，不同的論點背後反映的正是對於「性別平等」的不同想像。 在蒐集整理了贊成與反對女性車廂的相關論述之後，我們發現三種「性別平等」模式一相同、差異、轉化－確實為不同立場者所援用，並且進一步可分為三種代表性論述(參見下表)。以下藉由分析這些論述的性別意涵，嘗試說明對於性別政策創制應有的檢視。

    | 論述主張 | 平等模式／觀點 | 政策立場 |

    | --- | --- | --- |

    | 一、平等即相同 | 相同 | 反對女性車廂 |

    | 二、女士優先／保護弱者 | 差異 | 贊成女性車廂 |

    | 三、多元差異 | 轉化 | 反對女性車廂 |

    在對女性車廂的討論中，有一種反對聲浪主張「平等就是相同」，例如網路虛擬組織「男性聯盟的」聲明稿中提及：「明明付相同的票價，憑什麼台鐵有權力依據乘客的性別給予差別待遇？」他們同時也提出男性車廂的訴求。不過，「平等即相同」模式經常遭致的批評，就是往往忽略結構層次基本條件的差別，或是父權支配的現實，僅在形式上提供男女同樣的機會，不代表兩者可以實質享受到同樣的權利。 「女士優先／保護弱者」這類保守派論述，雖是看見性別「差異」，但卻把性別二分的差異視為必然，僅思考如何滿足既有性別角色下的實務需求，而非改變性別規範。2006年臺灣鐵路局將女性車廂政策試辦失敗歸因於「臺灣社會沒有意識到女性優先的觀念」，不過正是因為這個「女性優先」，使得女性車廂遭到女性主義者的反彈。認為若將女性建立於女生天生弱勢的論點上，雖然暫時可達到保護效果，長期而言卻如親善型歧視將女性固著於弱者位置上。 在某些調查中，某些女性確實會因為女性專用車廂而感到較為自在。不過出了車廂，總不可能所有空間都用性別劃分，「『沒有性騷擾的環境』不是專屬於女人的問題或利益，它是所有人都應享有的權益，因此所有車廂都應當是安全車廂。」（彭渰雯，2006）性騷擾並非是一個「女性問題」，而是每個人不分年齡、族群、性別都應當擁有的基本人身安全與人格尊嚴權，但也不能忽略現實脈絡中女性較易擔心性騷擾、也較易遭遇鹹豬手的真實。「多元差異」論述主張一個能夠培力(empower)女性的反性騷擾策略，除了性別與防暴教育，更重要的是建構一個支持反性騷的環境。單一女性的勇敢反擊固然重要，但是如果女性出面指證性騷擾的結果是承受周遭的冷漠甚至狐疑的目光、端詳受害者的穿著，那麼只會讓受害者承受更大壓力。終究女性車廂非性騷擾的最終解決辦法，在多元性别共處的空間内，應該要找出相處的規範，是以因應性騷擾的個人及公共處理機制。

    ──摘錄自畢恆達、彭渰雯《保護？矯正？排除？女性專用車廂的性別意涵》'
