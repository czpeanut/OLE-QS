  stem: 德國政府就此項請願案的作法，若以民主治理的角度，下列敘述何者正確？
  options:
  - label: A
    content: 政府向民眾解釋若修改一個中國政策，德國可能面臨的挑戰：回應性
  - label: B
    content: 涉及重大外交方向的政策討論，廣邀各黨派與民眾參與公聽會：透明性
  - label: C
    content: 民眾對於現行外交政策存有質疑時，政府須予以回應：透明性
  - label: D
    content: 政府與民眾溝通外交政策改變後的利弊，並確保民眾理解其所接收的資訊：代表性
  group_stem: (六)德國民眾克羅茲堡（Michael Kreuzberg）於2019年10月向國會提出請願，要求政府與中華民國(臺灣)建立正式外交關係。該案連署人數通過立案門檻後，德國國會12月正式舉行請願案公聽會，會議上德國外交部亞太司長西格蒙（Petra Sigmund）表示肯定臺灣活潑的民主和對人權和言論自由的保障，她認為臺灣與德國共享民主和自由等價值，可說是德國的「價值夥伴」，雙方在經貿、文化、學術等領域互動頻繁，德國非常珍惜、而且計畫擴展與臺灣的關係。 然而西格蒙指出，德國在1972年與中國建交，承認中華人民共和國為代表中國唯一的主權國家。這樣的「一個中國」政策排除與臺灣維持邦交的可能性，不僅德國，包括所有歐盟國家在內的世界多數國家都遵守，德國無意改變。自民黨議員托滕豪森（Manfred Todtenhausen）以及社民黨議員莫勒（Siemtje Möller）追問，「如果德國官方正式承認臺灣，最糟糕的情況是什麼？」西蒙格答覆說，外交轉向將嚴重傷害德中關係。這不符合德國利益，特別在面對全球挑戰，例如氣候變遷議題，德國不能沒有中國的合作，中國同時是夥伴，也是競爭對手。
