- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 下列何種溶質的水溶液<u>不是</u>電解質溶液？
  options:
  - label: A
    content: 甲酸
  - label: B
    content: 食鹽
  - label: C
    content: 氨
  - label: D
    content: 溴化氫
  - label: E
    content: 葡萄糖
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 電解質的種類有酸、鹼、鹽，溶於水可以解離出正、負離子。(E)糖溶於水不會解離。故選(E)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 空氣中含有氮、氧、氬、二氧化碳、水蒸氣等多種氣體。若將空氣視為氣態溶液，則可以何者為溶劑？
  options:
  - label: A
    content: 氮
  - label: B
    content: 氧
  - label: C
    content: 氬
  - label: D
    content: 二氧化碳
  - label: E
    content: 水蒸氣
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 溶液的組成，溶液中量多者稱為溶劑，其餘稱為溶質，空氣中氮氣含量最多∴為溶劑。故選(A)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
  stem: 下列關於溶液的敘述，何者正確？
  options:
  - label: A
    content: 真溶液中的不同溶質粒子可用濾紙分離
  - label: B
    content: 直徑在$10^{－6}$～$10^{－4}$ 公尺的粒子所構成的溶液，稱為膠體溶液
  - label: C
    content: 膠體粒子可用濾紙分離
  - label: D
    content: 廷得耳效應是因膠體粒子散射光線造成
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (A)真溶液不可用濾紙分離；(B)膠體溶液粒徑大小，直徑為$10^{－9}$～$10^{－7}$公尺；(C)膠體溶液不可用濾紙分離；(D)正確。故選(D)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_9
  section: 1
