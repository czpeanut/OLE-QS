- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_17
  section: 1
  number: 17
  type: single
  page: 1
  stem: 氣體（如氮氣、氧氣）在水中的溶解度與溫度之關係為何？
  options:
  - label: A
    content: 溫度與溶解度的關係不一定
  - label: B
    content: 溫度上升，溶解度變小
  - label: C
    content: 溫度上升，溶解度不變
  - label: D
    content: 溫度上升，溶解度變大
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 氣體溶於水時為放熱反應，故氣體溶解度隨溫度上升而下降。故選(B)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 1
  stem: 下列各條件，何者可以增加氣體在液體中的溶解度？
  options:
  - label: A
    content: 高溫、高壓
  - label: B
    content: 低溫、高壓
  - label: C
    content: 高溫、低壓
  - label: D
    content: 低溫、低壓
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 氣體溶於水為放熱反應，故低溫時可增加溶解度；氣體分壓愈大，溶解度愈大，要增加氣體溶於液體中的溶解度必須高壓、低溫。故選(B)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 1
  stem: 配製食鹽水溶液時，將100克食鹽水置入250克、20°C的水中，充分攪拌後，發現溶液底部尚有「未溶」之食鹽晶體。此溶液是下列何者？
  options:
  - label: A
    content: 過飽和溶液
  - label: B
    content: 飽和溶液
  - label: C
    content: 未飽和溶液
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 達溶解平衡，故為飽和溶液，故選(B)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_20
  section: 1
  number: 20
  type: single
  page: 1
  stem: 在25°C時，氯化鈉溶解度為36克／100克水，則同溫下，配製氯化鈉飽和溶液，欲溶解54克氯化鈉，至少需水多少克？
  options:
  - label: A
    content: '90'
  - label: B
    content: '120'
  - label: C
    content: '150'
  - label: D
    content: '24.5'
  - label: E
    content: '100'
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 100 g水溶36 g氯化鈉，1 g水溶0.36 g氯化鈉，54 g氯化鈉需要$\frac{ 54 }{ 0.36 }$=150 g的水。故選(C)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_21
  section: 1
  number: 21
  type: single
  page: 2
  stem: 下列有關溶液性質的敘述，何者<u>不正確</u>？
  options:
  - label: A
    content: 各氣體混合形成氣態溶液時，沒有溶解度的限制
  - label: B
    content: 可將18K金其成分中的銅視為溶質，金視為溶劑
  - label: C
    content: 糖水是以水為溶劑，糖為溶質，所形成的水溶液
  - label: D
    content: 氯化鈉對水的溶解度屬於微溶的範圍
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)氯化鈉對水的溶解度是屬於可溶。故選(D)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_22
  section: 1
  number: 22
  type: single
  page: 2
  stem: 將定量的食鹽溶於水，下列何種操作可增加其溶解速率也會影響溶解度？
  options:
  - label: A
    content: 增高溫度
  - label: B
    content: 先將食鹽磨成細粉
  - label: C
    content: 選取大顆粒的食鹽增加與水接觸的面積
  - label: D
    content: 不斷攪拌
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)溫度改變會改變溶解度，也會加快物質的溶解 (B) 只有加快物質的溶解(C)大顆粒接觸面積沒增加(D) 只有加快物質的溶解。故選(B)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_23
