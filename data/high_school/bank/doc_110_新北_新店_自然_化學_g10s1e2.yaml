  stem: 煤焦和水蒸氣的反應式為C(s)＋$H_{2}$O(g) → CO(g)＋$H_{2}$(g)，是工業上製備氫氣的方法之一。一氧化碳與氫氣的混合氣體稱為水煤氣，燃燒1莫耳CO和1莫耳$H_{2}$之反應式如下： CO(g)＋$\frac{1}{ 2 }$ $O_{2}$(g) → $CO_{2}$(g) ΔH=－284千焦 $H_{2}$(g)＋$\frac{1}{ 2 }$ $O_{2}$(g) → $H_{2}$O(g) ΔH=－243千焦 若有30克水煤氣（CO：H莫耳数比為1：1）完全燃燒，放出的熱量為多少千焦？
