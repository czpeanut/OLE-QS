- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 1
  stem: 有10 L水試樣，其中含有0.32 g氧，試問該水約含氧多少ppm？
  options:
  - label: A
    content: '60'
  - label: B
    content: '210'
  - label: C
    content: '100'
  - label: D
    content: '160'
  - label: E
    content: '32'
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 稀薄水溶液（d＝1 g／mL），1 ppm可視為1升溶液中含有1毫克的溶質。0.32 g=320 mg，含氧有320 mg／10 L=32 ppm。故選(E)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 1
  stem: 在30°C時，把1 g食鹽溶於1 L水中，然後將此溶液冷卻至4°C，則冷卻前、後下列哪一種濃度會改變？
  options:
  - label: A
    content: 體積莫耳濃度
  - label: B
    content: 百萬分點（mg/kg）
  - label: C
    content: 重量百分濃度
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 30℃時水的體積大於4℃時，體積莫耳濃度和體積有關，體積改變濃度會改變。故選(A)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_15
  section: 1
  number: 15
  type: single
  page: 1
  stem: 將4.0 g HF溶於水，配成2000 mL溶液，所得溶液的體積莫耳濃度為若干M？（原子量：F=19）？
  options:
  - label: A
    content: '20'
  - label: B
    content: '0.1'
  - label: C
    content: 2.5×$10^{－3}$
  - label: D
    content: 1.0×$10^{－4}$
  - label: E
    content: '12'
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 4 g HF =$\frac{ 4 }{ 20 }$=0.2 mol，2000 mL=2 L，體積莫耳濃度=$\frac{ 0.2 }{ 2 }$=0.1 M。故選(B)。
