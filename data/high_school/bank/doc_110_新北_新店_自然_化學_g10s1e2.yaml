- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 下列關於化學式的敘述，何者正確？
  options:
  - label: A
    content: 金屬通常以分子式表示
  - label: B
    content: 實驗式可表明化合物的官能基
  - label: C
    content: 分子式相同的化合物，其實驗式必定相同
  - label: D
    content: 實驗式相同的化合物，其分子式必相同
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)只能以實驗式表示的物質有，金屬元素、共價網狀固體、離子化合物；(B)示性式：可用來表示分子所含官能基；(C)分子式相同，實驗式一定相同；(D)分子式＝(實驗式)$_{n}$實驗式相同分子式不一定相同。故選(C)。
- id: doc_110_新北_新店_自然_化學_g10s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列有關化學式的叙述，何者正確？
  options:
  - label: A
    content: 兩物質的分子式相同，則其化學性質亦相同
  - label: B
    content: 由實驗式可得知物質的性質
  - label: C
    content: 甲醚和乙醇兩者的分子式相同，但結構式不同，稱為同分異構物
  - label: D
    content: 分子式上頭的原子總数一定多於實驗式的原子總數
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (A)分子式相同而結構式不同的化合物，為同分異構物，物理、化學性質不相同；(B)實驗式僅能表明物質內原子種類與原子間的最簡整數比；(C)分子式相同而結構式不同的化合物稱為同分異構物，正確；(D)不一定多大於，可能會相同。故選(C)。
