- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 阿龍在網路上與賣家約定好以2,000元價格買下一臺二手腳踏車，並約定交貨時間。不久後阿民也在網路上看到該腳踏車，阿民親臨現場並出價3,000元，賣家考量收益便將腳踏車交付給阿民。請問：依上述狀況，阿龍應如何主張自己的權利呢？
  options:
  - label: A
    content: 阿龍契約簽訂的時間較早，可直接向阿民要求交付腳踏車
  - label: B
    content: 阿民已經取得腳踏車的所有權，阿龍沒有任何辦法
  - label: C
    content: 阿龍可以向阿民提出所有物返還
  - label: D
    content: 阿龍可向賣家要求負起債務不履行的責任
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 兩人結婚勢必面對共同的經濟生活，其中亦包含夫妻財產的問題。依據我國現行法律規定，夫妻之間的財產制度的確立，下列何者敘述正確？
  options:
  - label: A
    content: 在結婚時僅以口頭約定，採用法定財產制，就是有效的
  - label: B
    content: 如雙方沒有書面約定，就採共同財產制
  - label: C
    content: 在結婚時就應決定，婚姻中不能更改
  - label: D
    content: 在離婚時才要決定，如沒有離婚就不用選擇
