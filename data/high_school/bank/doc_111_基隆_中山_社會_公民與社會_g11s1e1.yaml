questions:
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 畫家小丁畫了一幅「蘭嶼映象」送給朋友瑜瑜，瑜瑜收到後很開心，於是自己把「蘭嶼映像」大量複印，分送給其他朋友，並將原作放在自己經營的餐廳。小丁知道後要求瑜瑜停止此項行為。關於兩人的敘述，下列何種可能在法律上最為合理？
  options:
  - label: A
    content: 小丁已經將該畫作送給瑜瑜，因此無權干涉瑜瑜將該畫作複印及送人
  - label: B
    content: 瑜瑜認為複印時有標註這幅畫是小丁所畫，沒有侵權
  - label: C
    content: 小丁認為這幅畫的作者是他，只有他能決定畫要放在哪裡
  - label: D
    content: 瑜瑜雖擁有這張「蘭嶼映象」的所有權但卻沒有著作權，因此不能任意複印及分送他人
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 我國某部法律明文規定「工資由勞雇雙方議定之。但不得低於基本工資。」，並須設立基本工資審議委員來擬定基本工資。請問：此規定最有可能規定於下列哪部法律中？
  options:
  - label: A
    content: 《勞資爭議處理法》
  - label: B
    content: 《民法》
  - label: C
    content: 《勞動基準法》
  - label: D
    content: 《就業保險法》
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小豪在電視購物頻道上看到一臺期待已久的電腦降價了，於是拿起電話訂購，翌日電腦即送到家中，小豪將電腦拆封後開始試用電腦。小豪的妹妹看到後便向他借用2天，妹妹將電腦交還小豪後又正常使用了3天，但小豪發現電腦沒有想像中的好用，這時小豪的行為依據《消費者保護法》應有下列何項解釋？
  options:
  - label: A
    content: 小豪藉由電視購物之方式購買商品屬於「訪問交易」
  - label: B
    content: 小豪未超過《消費者保護法》規定之猶豫期，可將商品退還
  - label: C
    content: 小豪觀看電視購物頻道時已有充分的思考時間，故購買後不得退還
  - label: D
    content: 小豪須說明理由並負擔退貨費用，才可解除契約
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 阿騰向甲電信的乙營業處預購一支手機，並支付訂金，阿騰期盼能夠盡快拿到手機來使用。依照所有權的特性，下列敘述何者正確？
  options:
  - label: A
    content: 阿騰取得手機後，可以對任何人說手機是他的，不得隨意使用
  - label: B
    content: 阿騰可向甲電信的任一分店要求領貨
  - label: C
    content: 因銀貨兩訖，就算阿騰發現手機有瑕疵，也無法請求乙營業處退換貨
  - label: D
    content: 因所有權絕對，阿騰無法轉售該手機給他人
