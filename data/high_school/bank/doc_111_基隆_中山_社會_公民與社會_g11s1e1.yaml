- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 曉鈴在網路上向店家訂製一個客製化手機殼，並準備將手機殼送給阿凱當作生日禮物。下列時間與手機殼所有權歸屬說明，何者正確？
  options:
  - label: A
    content: 曉鈴在網路下訂單後，即取得手機殼的所有權
  - label: B
    content: 阿凱得知曉鈴要送他手機殼作為禮物，當他知道這件事就擁有手機殼的所有權
  - label: C
    content: 曉鈴必須付款完畢，才能真正取得手機的所有權
  - label: D
    content: 當商家寄出手機，曉鈴在收到商品時，才擁有手機殼的所有權
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 繼承是人們留給家人最後的禮物，法律規定的繼承順序除了配偶外，分為四個順位。請問：四個順位排序的依據，可能下列何者？
  options:
  - label: A
    content: 依人數多寡，人數少的順位在前
  - label: B
    content: 依親疏遠近，情感緊密的順位在前
  - label: C
    content: 依親等關係，親等近的順位在前
  - label: D
    content: 依年齡階層，年紀輕的順位在前
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_11
  section: 1
  number: 11
  type: single
  page: 1
  stem: 臺灣魔術方塊多項盲解紀錄保持人洪啟倫，2018年在遮眼的情况下，以24.80秒鐘完成魔術方塊盲解刷新記錄，他將獨特的魔術方塊盲解公式等影片上傳YouTube，但2020年一位黃姓男子採用該拆解公式並錄製影片上傳，讓洪男認為著作權侵犯，多次向黃男要求回應，但黃男沒有理會，最後直到提告後，雙方才和解。關於題文所牽涉到的著作權概念，下列敘述何者正確？
  options:
  - label: A
    content: 洪男非魔術方塊的發明者，因此無權對黃男提告
  - label: B
    content: 影片是透過YouTube公開，因此無著作權之保障
  - label: C
    content: 黃男可主張自己的影片為「合理使用」避免侵權
  - label: D
    content: 洪男的影片被擅自重製，可主張智慧財產權受損
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 利用臉書等網路平臺上直播拍賣商品，現在愈來愈盛行，其中許多拍賣業者在直播頁面上明白標示「薄利多銷，，小瑕疵概不可退貨」、「出清特賣無退換貨」等規定。若消費者購買上述拍賣商品後仍欲退貨時，下列說明何者正確？
  options:
  - label: A
    content: 當消費者購買商品時即表示同意業者規定，所以無法退貨
  - label: B
    content: 此屬通訊交易，消費者收受商品後7天内仍可無條件退貨
  - label: C
    content: 只有當拍賣商品有瑕疵時，消費者才可要求業者提供退貨
  - label: D
    content: 若消費者是以面交方式取貨，則拍賣業者可拒絕提供退貨
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_13
  section: 1
  number: 13
  type: single
  page: 2
  stem: 《民法》近年來對於私法自治的原則做了修正，除了契約自由外，更重要的是社會本位的價值觀，透過法律保障不同資源的人，都能立於平等的地位，因此對於契約自由加以限制，達成契約正義，以下何者符合對於契約正義的說明？
  options:
  - label: A
    content: 以公益為由限制私人權利，是符合契約公平正義的具體表現
  - label: B
    content: 《勞動基準法》的最低勞動條件，應該一體適用所有行業別
  - label: C
    content: 現今社會以契約正義為主，私法契約自由只具有補充的地位
  - label: D
    content: 政府為保障消費者，網路的交易行為都有七天猶豫期的限制
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 小華與妻子結褵數十載，後因病去世，身後除妻子外，尚有養子小明。若小華在病榻中完成遺囑撰寫，將全部財產留給妻子。依我國《民法》規定，下列有關小華遺產分配的論述，何者正確？
  options:
  - label: A
    content: 有意思表示即視為有效，故妻子獲得全部遺產
  - label: B
    content: 遺囑已完成，應該依照内容的做分配
  - label: C
    content: 應按照法定的應繼分分配遺產，養子亦得繼承
  - label: D
    content: 小明雖為養子但仍有繼承權，雖有遺囑但仍可主張其特留分
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_15
  section: 1
  number: 15
  type: single
  page: 2
  stem: 民法與個人的一生關係密切。下列關於《民法》中「繼承制度」的規範，哪些是正確的？
  options:
  - label: A
    content: 繼承，以繼承人「知悉」得繼承之時開始
  - label: B
    content: 現行《民法》以「拋棄繼承」為法定繼承方式
  - label: C
    content: 採取「限定繼承」時，繼承人應向法院陳報遺產清冊
  - label: D
    content: 繼承人可以選擇拋棄債務只繼承財產
