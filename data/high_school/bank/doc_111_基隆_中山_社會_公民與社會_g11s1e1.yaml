  stem: 如果小林跟小陳想採約定財產制必須要去哪裡登記？附表是小林和小陳這對夫妻婚後的財產狀況，若兩人此時因故離異，經由剩餘財產分配，小陳除自身的婚後資產外，還可以額外獲得多少財產？
  group_stem: 2002年，立法院修正《民法‧親屬編》關於夫妻財產制的規範，舊制下夫妻間如未特別約定財產製，會採用預設的「聯合財產制」，2002年修法後，夫妻間未特別約定財產制者，則採用「法定財產制」，為了讓民眾了解，法務部將兩制度的異同比較，如附表。請參考表中資訊，回答下列問題：
