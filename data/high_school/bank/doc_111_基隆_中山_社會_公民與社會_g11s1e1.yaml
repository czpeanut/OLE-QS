- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 高雄某保全公司龐姓員工，與公司簽訂責任制勞動契約，但契約書未報請當地主管機關核備；公司按責任制給付的加班費，遠低於其平均時薪，龐姓員工提起訴訟，三審法院都以契約書未經核備並非無效，判龐姓員工敗訴。龐姓員工聲釋憲，《司法院釋字第726號解釋》宣告雇主申請責任制，若未經地方主管機關同意，則勞動契約無效。試問以下何者符合大法官此號解釋的用意？
  options:
  - label: A
    content: 彰顯民法的私法自治與契約自由原則
  - label: B
    content: 地方政府應介人勞動契約以實現契約正義
  - label: C
    content: 雇主向地方主管機關報備即可實施責任制
  - label: D
    content: 契約未經主管機關核備但法院仍可認定責任制的效力
- id: doc_111_基隆_中山_社會_公民與社會_g11s1e1_s1_19
  section: 1
  number: 19
