- id: doc_111_台中_台中二中_數學_數乙_g12s2e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 箱子裡有 20 顆紅球，10 顆藍球。從箱子中隨機抽出 1 顆球，假設每顆球被取出的機會均相同，記錄球的顏色後放回。重複此動作 4 次。試問觀察紅球藍球出現的次數，請選出發生的機率最大的選項。
  options:
  - label: A
    content: 4 紅
  - label: B
    content: 3 紅 1 藍
  - label: C
    content: 2 紅 2 藍
  - label: D
    content: 1 紅 3 藍
  - label: E
    content: 4 藍
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: '依題意敘述可知，從箱中取出紅球之機率為$\frac{2}{3}$，從箱中取出藍球之機率為$\frac{1}{3}$

    (A) P（4 紅）＝$C_{4}^{4} \left( \frac{2}{3} \right) ^{4} \left( \frac{1}{3} \right) ^{0}$＝$\frac{16}{81}$

    (B) P（3 紅 1 藍）＝$C_{3}^{4} \left( \frac{2}{3} \right) ^{3} \left( \frac{1}{3} \right) ^{1}$＝$\frac{32}{81}$

    (C) P（2 紅 2 藍）＝$C_{2}^{4} \left( \frac{2}{3} \right) ^{2} \left( \frac{1}{3} \right) ^{2}$＝$\frac{24}{81}$

    (D) P（1 紅 3 藍）＝$C_{1}^{4} \left( \frac{2}{3} \right) ^{1} \left( \frac{1}{3} \right) ^{3}$＝$\frac{8}{81}$

    (E) P（4 藍）＝$C_{0}^{4} \left( \frac{2}{3} \right) ^{0} \left( \frac{1}{3} \right) ^{4}$＝$\frac{1}{81}$

    故選(B)'
  tags:
