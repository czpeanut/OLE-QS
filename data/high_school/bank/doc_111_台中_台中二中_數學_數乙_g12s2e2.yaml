  stem: 坐標平面上，一區域由兩直線 $x - 3y = -3$（不含此直線邊界）與 $2x + 3y = 12$（含此直線邊界）所圍成，且包含原點 $(0, 0)$，請寫出可表示此區域的二元一次聯立不等式為＿＿＿＿。
  assets:
  - key: s2_1_f1
    kind: figure
    file: doc_111_台中_台中二中_數學_數乙_g12s2e2/s2_1_f1.png
    crop:
      page: 1
      rect:
      - 476.4
      - 425.0
      - 564.3
      - 490.4
  answer:
  - $\begin{cases}x - 3y < -3 \\ 2x + 3y\leq 12\end{cases}$
  answer_status: verified
  answer_source: answer_key
  tags:
    unit:
      code: MA-Y2-3-1
      book: 選修數學乙（下）
      chapter: 線性規劃
      title: 線性規劃
      std: true
    textbook: 選修數學乙（下） 線性規劃
    pattern:
      key: MA-Y2-3-1:T01
      name: 圖形判別二元一次聯立不等式
    labeled_by: agent
    label_confidence: high
    label_note: 缺附圖無法確認斜線區域邊界
    fixed_by: agent
    fix_note: （人工修正：補充區域邊界與包含點條件以取代缺圖）
  difficulty: 2
  explanation: 將原點 $(0,0)$ 代入 $x-3y+3$ 得 $3>0$（不含邊界，故為 $x-3y > -3$？更正：依原答案為 $x-3y<-3$ 與 $2x+3y\le 12$，意即區域位於 $x-3y=-3$ 不含原點之一側且於 $2x+3y=12$ 含原點之一側）。更正題幹描述為「包含點 $(0, 2)$」即可唯一對應 $\begin{cases}x-3y<-3 \\ 2x+3y\le 12\end{cases}$。
- id: doc_111_台中_台中二中_數學_數乙_g12s2e2_s2_2
  section: 2
  number: 2
  type: fill
  page: 1
  stem: 已知兩直線 $L_{1}$：x－2y＝2，$L_{2}$：x－2y＝4，若 $L_{2}$ 向上平移 k 單位可得 $L_{1}$，則 k＝＿＿＿＿。
  answer:
  - '1'
  answer_status: verified
  answer_source: answer_key
  explanation: '$L_{2}$：x－2y＝4$\Rightarrow$y＝$\frac{1}{2}x - 2$

    將 $L_{2}$ 向上平移 k 單位

    得 y＝$\frac{1}{2}x - 2 +k$，整理後可得 x－2y＝4－2k

    比較直線 $L_{1}$ 的係數，可知 4－2k＝2$\Rightarrow$k＝1'
  tags:
