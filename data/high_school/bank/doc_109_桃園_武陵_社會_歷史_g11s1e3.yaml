  group_stem: 報導一：1955年4月18～24日，□□會議隆重召開，印尼總統蘇卡諾指出這是人類有史以來第一次的有色人種洲際會議，是世界歷史的新起點。會議廣泛討論了反殖民主義、保衛世界和平及各國經濟文化合作等問題。儘管中國也派員出席，但強調一定會「不干涉內政、互惠尊重、和平共存」。
    報導二：「印度時報（The Times of India）今天引進政府消息人士談話說，印度中央政府在收到委內瑞拉主辦不結盟運動（Non-Aligned Movement,
    NAM）高峰會邀請函後過了數週，對莫迪是否應邀與會遲遲沒有答覆。「印度時報」認為，莫迪如果缺席這次的峰會，將引起各界密切觀察，印度的（不結盟）外交政策是否已經出現變化。不結盟運動的成立起因於二次大戰後，許多新興國家因民族主義高漲擺脫殖民獨立，加上世界進入美蘇冷戰時代，這些新興第三世界國家為擺脫美蘇等大國控制，1961年在前南斯拉夫首府貝爾格勒正式集會成立，印度過去一直是不結盟運動中的活躍大國。（臺灣英文新聞2016/08/17）
    報導三：中國解放軍指控，印度軍方在「班公錯湖」南岸發射警告信號彈，中國也展開反制，兩國衝突，從互丟石頭，演變成開槍，雙方更是重兵佈署，印度向法國購買了陣風戰機，中國則是在邊界，蓋兩座防空導彈基地。中印兩國在邊界領土主權上互摃，這「一條線的恩怨」一結就長達155年，今年雙方邊境部隊更接連爆發多起肢體衝突。中印雙方都同意邊境和平至關重要，檯面下，則各自部署較勁。（TVBS
    NEWS 2020/09/08） 報導四：川普在其兩天印度之行期間表示：「為我們的孩子與後代子孫，我們將共同捍衛主權和安全，保障印太地區自由和開放。」但是印度不會輕易去當「自由堡壘」。冷戰時期，印度就一直反對參與任何以意識形態為基礎的陣營。莫迪對川普總統提出的「美國優先」式的印太戰略表示懷疑並非沒有道理。而華府也不會支持印、巴之間克什米爾衝突熱點的強硬立場。川普已基本撤出巴基斯坦，將該地區拱手讓給中國。……但對於中國去挑戰以西方為主導的世界秩序，印度倒也樂觀其成。畢竟作為世界第二人口大國，一旦形成多級世界，印度活動空間也將得到擴展。（聯合新聞網2020/11/10）
