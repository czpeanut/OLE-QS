- id: doc_109_桃園_武陵_社會_歷史_g11s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 英國首相邱吉爾曾經在50年前提出「歐洲合眾國」概念，但未能成行。目前歐盟所以成為歐洲統合的代表力量，得力於它前身哪一項重要貢獻奠定穩固合作基礎？
  options:
  - label: A
    content: 政治結盟
  - label: B
    content: 文化傳承
  - label: C
    content: 軍事協防
  - label: D
    content: 經濟結盟
  group_stem: ◎參考下列報導，回答1.～5.題： 報導一：歐洲領導人首先面臨的爭論是歐盟申根國家內自由移動的問題。歐洲的民族主義者指責由於申根協議，導致進入歐盟的難民尋求心中理想的國家落腳。匈牙利等國的領導人還對以「基督徒」為主的歐盟接受主要是來自穆斯林國家（例如敘利亞、伊拉克、阿富汗、巴基斯坦等）難民政策提出質疑。英國沒有加入難民配額系統，被認為是對移民採取比較強硬態度。英國說，它已經是敘利亞邊境的難民營最大的援助國。歐盟目前面臨壓力，擬定一份能夠遣返難民回國的「安全國家」的名單。因為來自這些國家的移民不屬於戰亂或受到人權迫害的難民之類。問題是目前的難民危機一時半刻都不會消失。（BBC
    News中文網2015/09/04） 報導二：自2016年全民公投開始，經歷兩次大選、考驗過3位首相，經過各種「截止期限」，一年前確定脫歐，在過渡期結束前一周，2020聖誕夜（12月24日），雙方達成協議，30日歐盟委員會主席馮德萊恩和歐洲理事會主席米歇爾爾簽字，同一天經英國議會批准寫入《歐盟（未來關係）法》，再獲女王伊麗莎白二世御准，協議自31日23點生效。英國首相鮑里斯約翰遜（Boris
    Johnson）宣稱「這個偉大國家的命運從此牢牢掌握在我們手裏」，支持者歡呼迎來「新時代新曙光」。《經濟學人》網說，「英國失去了歐盟，今後在國際間能找到怎樣的位置，而留歐派堅持認為脫歐不如留歐。即使達成了友好分手協議，分家畢竟是分家，還是會帶來諸多重大變化。英國警察將無法分享歐盟內部的罪案、指紋和通緝犯數據庫資料，但歐盟法庭對英國和歐盟國家的糾紛不再具有裁決權。（BBC
    News中文網2021/01/01） 報導三：英國首相大讚這是「了不起的一刻」，誓言脫歐後的英國將成為一個「開放、慷慨、向外展望、國際主義和貿易自由的國家」。不過英國的歐盟談判代表巴尼耶悲觀地表示：「沒人能向我展示英國脫歐的附加價值。這是分手……你無法慶祝分手。」法國總統馬克洪表示，英國仍將是「我們的朋友和盟邦」，不過惋惜英國脫歐是「許多謊言和不實承諾」的結果。數十年未見的海關邊境檢查也首度恢復實施。英國南部多佛港及法國加萊港口去年底一度出現貨車長龍。法國海關官指出，加萊與多佛港之間的交通流量下周會回復正常水平。當地已增聘700名海關人員因應英國脫歐後的貨物通關。資料顯示，英國與歐盟之間，約70％貿易經加萊跨海進行，每天約有1.2萬輛貨車過境。（中國時報2021/01/02）
