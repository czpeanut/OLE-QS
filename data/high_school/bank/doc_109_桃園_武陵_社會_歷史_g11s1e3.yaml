  stem: 以上三段資料對於婦女爭取權利的態度為何？
  options:
  - label: A
    content: 都反對，認為女性在身心上是屬於「不能者」
  - label: B
    content: 都支援婦女應獲得基本權利
  - label: C
    content: 只有資料一反對，認為婦女的法律地位完全是依據她丈夫或兒子地位而定
  - label: D
    content: 資料一和資料二支援婦女和男性在法律上應同樣平等
  group_stem: ◎資料一：1765年，英國法理學家萊克斯頓爵士在《英國法律評論》說到：「婦女結婚後，在法律上的地位便不再存在；至少我們可以說，她已和丈夫混成一體的了。」
    資料二：1792年瑪莉．沃斯頓克拉夫特發表一篇名為〈女權辯白〉的論文，為婦女在教育上和職業上的權利滔滔爭辯，要求婦女不再仰賴男性維生。 資料三：1869年，穆勒發表《婦女屈從論》：「女性優於男性這句話畢竟是空洞的讚美，徒使有志氣的女性發出苦笑。因為在現實生活中，從來沒有能者屈從不能者的成例。」又說：「法律上以一個性別支配另一個性別，就本身來說已經是錯誤的了。」
