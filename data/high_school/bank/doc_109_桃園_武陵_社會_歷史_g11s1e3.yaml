  group_stem: 經過努力，杜魯門總統獲得了具有很大影響力的參議院外交委員會主席范登堡的支援。1948年5月19日，美國參議院外交委員會以全票（13票對0票）通過了由行政部門和國會共同起草的《范登堡決議案》。6月11日，美國參議院以壓倒性的多數（64票對4票）也通過了該決議案。該決議案以《聯合國憲章．第51條》規定的單獨或集體自衛的自然權利為依據，一改美國孤立主義對外政策傳統，支援美國與西歐國家結成安全聯盟，向這些國家做出安全承諾。因此，《范登堡決議案》的通過為美國在軍事上全面介入西歐事務和通過建立大西洋聯盟遏制蘇聯掃清了障礙，為美國在國外進行廣泛軍事介入提供了法律基礎，「標誌著美國同不與歐洲國家結成永久同盟的傳統外交徹底決裂，第一次由國會授權在和平時期走上與美洲以外的國家軍事結盟的道路。」
