  section: 1
  number: 48
  type: single
  page: 6
  stem: 「此一軍事行動帶給東方和西歐各國生靈塗炭，並造成了巨大的物質損失，但它同時也對歐洲文明造成長遠的影響，這種影響不僅僅限於它為歐洲基督教各王國的內戰找到了一個出口，更使歐洲大陸走上了一條世界主義的道路，打開了對東方貿易的大門，使歐洲的商業、銀行和貨幣經濟發生了革命，並促進了城市的發展，造成了有利於產生資本主義萌芽的條件，阿拉伯數字、代數都是在此一時期傳到西歐，歐洲人因而有機會認識到更為廣闊的外部世界」請問：上文內容提及此軍事行動促進城市的發展，其中尤以下列何者最具代表性？
  options:
  - label: A
    content: 開羅、哥多華
  - label: B
    content: 威尼斯、佛羅倫斯
  - label: C
    content: 巴格達、大馬士革
  - label: D
    content: 麥加、麥地那
- id: doc_109_桃園_武陵_社會_歷史_g11s1e3_s1_49
  section: 1
  number: 49
  type: single
  page: 6
  stem: 「1469年，亞拉崗國王費迪南德和卡斯提爾女王伊莎貝拉宣布結婚，被稱為『天主教雙王』。這樁婚禮把西班牙最大的兩個王國的王冠永遠連到了一起，奠定了今天西班牙王國的基礎。基督教勢力的聯合，為西班牙奈斯蘭王朝的蘇丹們敲響了喪鐘，他們再也無法在戰鬥中取得勝利。1487年8月18日，奈斯爾王朝第二大城市馬拉加被西班牙軍隊攻破，城內的所有倖存者被賣做奴隸，城市也被徹底毀滅，蘇丹的領土愈來愈小，處境越來越困難，……1492年1月2日，西班牙國王費迪南手持銀製十字架，帶領軍隊進入了奈斯爾王朝在西班牙的最後一座堡壘──格拉納達，所有尖塔上的『新月被十字架取代』。」根據上述資料內容，當時在伊比利半島建立伊斯蘭統治政權的應該是：
  options:
  - label: A
    content: 阿拔斯王朝
  - label: B
    content: 後奧瑪亞王朝
  - label: C
    content: 法提馬王朝
  - label: D
    content: 塞爾柱土耳其帝國
- id: doc_109_桃園_武陵_社會_歷史_g11s1e3_s1_50
  section: 1
  number: 50
  type: single
  page: 6
  stem: 1884-1885年「某國」出面召開的這項確立非洲佔領原則的會議，「某國」指的是哪一國？
  options:
  - label: A
    content: 法國
  - label: B
    content: 比利時
  - label: C
    content: 英國
  - label: D
    content: 德國
  group_stem: ◎資料一：1884-1885年，某國出面召開會議，歷時年餘的會議確立歐洲列強在非洲大陸劃分勢力範圍的原則：「土地不能切割，河流必須開放，各國不必實施武裝占領，只要取得國際承認，便可擁有勢力範圍或殖民區域。」
    資料二：「這個會議是歐洲列強的領袖試圖對已在進行的非洲瓜分運動，添加一些歐洲國際協議。該會議並未決定任何殖民地的疆界，但是設定兩個重要原則：首先是承認□□國王利奧波德二世的『國際剛果協會』為剛果盆地的合法擁有者，而利奧波德二世也允許歐洲商人與傳教士自由進入這個地區。第二個原則是：一個歐洲強權要求非洲的某部分領土，唯有它能有效占領該地區，才能獲得其他歐洲國家的承認。」
