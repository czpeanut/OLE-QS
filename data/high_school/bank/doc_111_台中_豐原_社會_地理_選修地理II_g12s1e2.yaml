  group_stem: 在太平洋東側，美國西部外海與夏威夷之間，有一個巨大的垃圾島，面積約為臺灣的 44 倍大。海洋廢棄物問題日益嚴重，其中以塑膠垃圾為大宗，除造成許多鯨豚、海鳥、海龜等海洋生物誤食而死亡之外，這些塑膠垃圾最終分解成塑膠微粒，也會透過食物鏈回到人類的餐桌。2017 年 9 月，美國前副總統高爾為了突顯這個問題的嚴重性，正式成立了「垃圾島共和國」，制訂自己的國旗、護照及發行貨幣，並向聯合國提出申請成為全世界第 196 個獨立國家，高爾則成為垃圾島共和國的第一位公民。
