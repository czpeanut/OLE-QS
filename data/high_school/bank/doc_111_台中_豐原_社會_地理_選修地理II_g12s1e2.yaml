- id: doc_111_台中_豐原_社會_地理_選修地理II_g12s1e2_s2_47
  section: 2
  number: 47
  type: single
  page: 7
  stem: 下列關於「伏流水」的敘述正確的有？(甲)大量抽取伏流水有可能會造成地層下陷的問題(乙)伏流水經砂石及土壤過濾，水質較地面水乾淨(丙)伏流水不會被工廠排放的廢水所汙染(丁)颱風時使用伏流水可減少原水濁度過高的問題(戊)伏流水水量穩定，不會受河川水量豐枯的影響
  options:
  - label: A
    content: 甲乙丙
  - label: B
    content: 乙丙丁
  - label: C
    content: 丙丁戊
  - label: D
    content: 甲乙丁。（2 分）
  group_stem: '下圖為簡易地下水井剖面示意圖。請閱讀以下資料回答問題：

    資料(一)：二峰圳有別於地面型水庫，它採用集水廊道截取地下伏流水，再透過地形重力輸水，僅需取用河道截面伏流水，「伏流水為較淺層的地下水，為河水入滲到底下土層中而形成，故其流量與河川流量相關。因為經過砂礫石層的天然過濾，所以水質較為潔淨。此外，伏流水只要取用與補足的量相等，就不會有地層下陷的問題，因此水利署將伏流水定位為豐水期的備援供水主力。」；借鏡這百年智慧，屏縣府以國土復育與水資源保育為發想，催生國內第 1 座以「補充地下水」為概念的大潮州人工湖，將林邊溪洪水期豐沛地面水，導引至人工湖儲存，經沉澱後補注地下含水層，藉由抬升地下水位達到減緩地層下陷速率，及抑制因地下水超抽所造成海水入侵情形。

    資料(二)：2021 年，臺灣遭逢 56 年來最嚴重乾旱，位於屏東潮州的人工補注湖發揮作用，憑藉著蓄水量逾 5,000 萬噸，屏東免於缺水危機，大潮州人工湖的原理是利用豐水期將上游林邊溪流往海邊的水攔截，經過調節池調節沉砂，調節池於汛期時引洪水補注地下水，平時則大多呈現乾涸狀再滲透至地下水層儲存，必要時可抽取使用，也就是地下水庫的概念。而報告指出屏東地區明顯的儲水成效，即是屏東平原鄰近鄉鎮經過多年許多湧泉與自流井也恢復了。'
  shared_asset: g2_47_50
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 伏流水為較淺層的地下水入滲到地底下所形成，故流量跟河川的流量有關係，會受到河川水量豐枯的影響，且伏流水也會被工廠排放的廢水所汙染，故選(D)甲乙丁。
