    資料(二)：2021 年，臺灣遭逢 56 年來最嚴重乾旱，位於屏東潮州的人工補注湖發揮作用，憑藉著蓄水量逾 5,000 萬噸，屏東免於缺水危機，大潮州人工湖的原理是利用豐水期將上游林邊溪流往海邊的水攔截，經過調節池調節沉砂，調節池於汛期時引洪水補注地下水，平時則大多呈現乾涸狀再滲透至地下水層儲存，必要時可抽取使用，也就是地下水庫的概念。而報告指出屏東地區明顯的儲水成效，即是屏東平原鄰近鄉鎮經過多年許多湧泉與自流井也恢復了。'
