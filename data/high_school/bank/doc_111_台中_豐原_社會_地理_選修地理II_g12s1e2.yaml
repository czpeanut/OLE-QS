  stem: '全球的海洋塑膠垃圾多透過河流進入海洋，每年經由 53 條河流攜帶約 275 萬噸垃圾流入；其中又有 10 條攜帶約 93 ％的海洋塑膠垃圾，對海洋造成的汙染極為嚴重。試著從下圖中河流位置及流經環境判斷，推論此 10 條河川中，何者的汙染可能最為嚴重、攜帶的海洋塑膠垃圾最多，並說明判別的理由。（寫出一項，40 字以內，本題需合理推論方能全對給分）（4 分）

