  answer_status: verified
  answer_source: answer_key
  explanation: 中國為主要海洋塑膠垃圾製造國，長江是半世紀以來情況惡化最為嚴重的河川之一。中國的工業及建設快速發展，大量引取灌溉用水，導致史無前例的汙染情況，汙染物質在過去 50 年間增加了 73 ％，因為有近半的工業廢棄物及民生汙水都直接排進河裡。長江三峽大壩完工後，大量垃圾、船隻浮油、禽畜糞便、工廠、醫院、礦場的廢棄物堆積在大壩底部，當中甚至可能包括有害輻射物質，將導致嚴重危害。
