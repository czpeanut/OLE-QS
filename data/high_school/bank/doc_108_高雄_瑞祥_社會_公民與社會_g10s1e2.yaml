  stem: 從文中可看出凝聚我國主流國家認同，以及區別臺灣與中國的關鍵因素應該是：
  options:
  - label: A
    content: 政治體制
  - label: B
    content: 民族血緣
  - label: C
    content: 經濟發展
  - label: D
    content: 歷史文化
  group_stem: ◎ 題組：政治大學選舉研究中心研究員以2000年到2016年的訪談資料，探討民眾的「臺灣人／中國人」認同意涵，研究顯示臺灣認同已進入「國家認同」階段，民眾雖對「中國人」具有原生文化認同，但政治認同上，已視中華人民共和國為不同國家。 研究員指出，民眾在論述臺灣人與中國人時，認為「臺灣人」是一群「出生或生活在臺灣、具有中華民國國籍、認同臺灣、願意為臺灣貢獻的人」，而且和中國不僅有文化差異，也是不同國家；對「中國人」的界定雖然有中華文化傳承、血緣、華人或漢民族這4個項目的原生文化認同，但在政治認同方面則將中國人視為不同國家（中華人民共和國）的人民。 研究員認為，這些趨勢顯示，縱使民眾承認臺灣與中國的文化連繫，但在政治認同上仍認同臺灣才是自己的國家。雖然不可否認在臺灣內部仍存在懷抱大中國意識的民眾，但從過去10多年民眾對於認同的論述，以臺灣（中華民國）作為和中國（中華人民共和國）對立的國家認同，已成為社會主流。
