  group_stem: ◎ 題組：隨著英國脫歐時間愈來愈近，特別是英格蘭、蘇格蘭、威爾斯與北愛爾蘭之間的恩怨情仇衝突再度浮上檯面。脫歐公投的結果雖然是以51.9%：48.1%勝出，但是在北愛爾蘭的公投卻是贊成留歐的55.78%大勝脫歐的44.22%。 由於愛爾蘭是歐盟會員國，北愛爾蘭的多數居民也希望留在歐盟，兩個地區的民眾希望統一成完整的國家呼聲再起。然而，當多數人同情北愛爾蘭的處境時，欲遺忘1921年北愛爾蘭議會以民主方式，選擇退出愛爾蘭自由邦，留在聯合王國。大多數北愛爾蘭（新教徒）希望留在英國，少數北愛爾（天主教徒）希望加入愛爾蘭共和國。 軍事衝突從1960年代到1990年代，雙方死傷慘重。而今原已平息的衝突，隨著英國的脫歐，又讓北愛爾蘭的民眾看到愛爾蘭統一的希望。
