  stem: 頓內茨和盧甘斯克位於烏克蘭東部，緊鄰俄羅斯，俄語人口偏多。2014年，頓肉茨與盧甘斯克自行辦理公投，要求脫離烏克蘭獨立，公投結果兩地都以80%以上的高票通過獨立，成立頓內茨共和國與盧甘斯克共和國，由俄國支持的分離主義分子治理，但未獲西方國家及聯合國承認。不過俄羅斯總統普丁在2019年簽署行政命令，讓上述兩地的居民能在提出申請的3個月內輕易獲得俄國護照，請問：此舉對俄烏兩國的意義，該如何評析最為恰當？
  options:
  - label: A
    content: 俄羅斯的主權地位高於烏國故干其內政尚屬合理
  - label: B
