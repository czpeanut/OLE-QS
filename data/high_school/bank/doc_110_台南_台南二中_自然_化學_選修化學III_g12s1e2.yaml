  options:
  - label: A
    content: 1.5％
  - label: B
    content: 3.0％
  - label: C
    content: 4.5％
  - label: D
    content: 6.0％
  - label: E
    content: 15％
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_9
  section: 1
  number: 9
  type: single
  page: 1
  stem: 同溫下，下列何種陰離子與$H^{＋}$結合的趨勢最大？（$K_{a}$值$HNO_{2}$＝5.1×$10^{－4}$、$H_{2}$S＝1.0×$10^{－7}$、$CH_{3}$COOH＝2.0×$10^{－5}$及 $HCO_{3}^{－}$＝4.8×$10^{－11}$）
  options:
  - label: A
    content: $SO_{4}^{2－}$
  - label: B
    content: $HS^{－}$
  - label: C
    content: $CH_{3}COO^{－}$
  - label: D
    content: $CO_{3}^{2－}$
  - label: E
    content: $NO_{2}^{－}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 越強的共軛酸，其共軛鹼越弱，故與氫離子結合的能力越弱；反之，越弱的共軛酸，其共軛鹼就越強，與氫離子結合的能力就越強。因此可選最弱酸（$K_{a}$最小）的共軛鹼：$CO_{3}^{2-}$。故選(D)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_10
  section: 1
  number: 10
  type: single
  page: 1
  stem: 濃度均為0.1 M的下列五種物質的水溶液：(甲) $NH_{3}$；(乙) $NH_{4}$Cl；(丙) $CH_{3}$COOH；(丁) $CH_{3}$COONa；(戊) $CH_{3}COONH_{4}$，則此五種水溶液的pH值由低至高的排列順序，何者正確？（$NH_{4}^{+}$的$K_{a}$＝5.7×$10^{－9}$；$CH_{3}COO^{－}$的$K_{b}$＝5.7×$10^{－9}$）
  options:
  - label: A
    content: (乙)(丙)(戊)(甲)(丁)
  - label: B
    content: (丙)(乙)(戊)(丁)(甲)
  - label: C
    content: (乙)(丙)(丁)(甲)(戊)
  - label: D
    content: (丙)(乙)(丁)(戊)(甲)
  - label: E
    content: (戊)(丙)(乙)(甲)(丁)
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 先分類：(甲)為鹼(丁)為鹼性正鹽；(戊)為中性正鹽；(丙)為酸(乙)為酸性正鹽。 比較(甲)(丁)：(甲)的解離常數為$\frac{ 10^{-14} }{ 5.7×10^{-9} }$＝1.8×$10^{-5}$。(丁)則為5.7×$10^{-9}$。故(甲)較鹼 比較(乙)(丙)：(丙)的解離常數為$\frac{ 10^{-14} }{ 5.7×10^{-9} }$＝1.8×$10^{-5}$。(乙)則為5.7×$10^{-9}$。故(丙)較酸 故pH值由低至高為：(丙)(乙)(戊)(丁)(甲)。故選(B)。
