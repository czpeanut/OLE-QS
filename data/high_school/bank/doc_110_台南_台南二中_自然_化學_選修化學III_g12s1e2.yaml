- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_14
  section: 1
  number: 14
  type: single
  page: 2
  stem: 在25℃、1 atm下，盬酸水溶液之pH值為5.0。取溶液1.0毫升稀釋到1.0升，求pH值應接近多少？
  options:
  - label: A
    content: '8.0'
  - label: B
    content: '7.0'
  - label: C
    content: '6.0'
  - label: D
    content: '5.0'
  - label: E
