  stem: 室溫下，將34.0 g的$NH_{3}$(g)通入1.0 L的水中形成氨水溶液，當達平衡時，試問下列選項，哪一個選項是正確？（分子量$NH_{3}$＝17，$NH_{3}$的$K_{b}$＝1.8×$10^{－5}$，log 2＝0.30，log 3＝0.47）
  options:
  - label: A
