- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_12
  section: 1
  number: 12
  type: single
  page: 2
  stem: 下列關於鹽之種類的敘述，何者正確？
  options:
  - label: A
    content: $KH_{2}PO_{2}$與$KH_{2}PO_{4}$均為酸式盬
  - label: B
    content: KAl($SO_{4}$)$_{2}$．12 $H_{2}$O與Cu($NH_{3}$)$_{4}$($SO_{4}$)均為複鹽
  - label: C
    content: $CH_{3}$COONa與KF均為鹼式盬
  - label: D
    content: Ca(OCl)Cl與$K_{3}$[Fe(CN)$_{6}$]均為正盬
  - label: E
    content: Mg(OH)Cl與Bi(OH)$_{2}NO_{3}$為鹼式盬
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $KH_{2}PO_{2}$為正鹽；(B) KAl($SO_{4}$)$_{2}$‧$12H_{2}$O為複鹽；(C)均為正鹽；(D) Ca(OCl)Cl為複鹽、$K_{3}$[Fe(CN)$_{6}$]為複鹽。故選(E)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_13
  section: 1
  number: 13
