- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 水在下列哪一個反應中作為布－洛酸？
  options:
  - label: A
    content: $H_{2}$S(aq)＋$H_{2}$O(l) → $HS^{－}$(aq)＋$H_{3}O^{＋}$(aq)
  - label: B
    content: HCOOH(aq)＋$H_{2}$O(l) → $HCOO^{－}$(aq)＋$H_{3}O^{＋}$(aq)
  - label: C
    content: $NH_{4}^{＋}$(aq)＋$H_{2}$O(l) → $NH_{3}$(aq)＋$H_{3}O^{＋}$(aq)
  - label: D
    content: $HCO_{3}^{－}$(aq)＋$H_{3}O^{＋}$(aq) → $H_{2}CO_{3}$(aq)＋$H_{2}$O(l)
  - label: E
    content: $HS^{－}$(aq)＋$H_{2}$O(l) → $H_{2}$S(aq)＋$OH^{－}$(aq)
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 布洛酸，代表在溶液中會丟出氫離子。以水而言，丟出氫離子的產物為$OH^{-}$，故選(E)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 下列哪一個組合為共軛酸鹼對？
  options:
  - label: A
    content: HCN、$H^{＋}$
  - label: B
    content: $H_{2}PO_{4}^{－}$、$HPO_{3}^{2－}$
  - label: C
    content: $H_{2}MNO_{4}$、$HMNO_{4}$
  - label: D
    content: $H_{2}SO_{3}$、$H_{2}SO_{4}$
  - label: E
    content: $HS^{－}$、$H_{2}$S
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 共軛酸鹼對為「相差一個$H^{+}$的組合」，故選(E)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 小齊想比較亞硝酸、碳酸以及醋酸三種酸的強弱順序，於是開始進行探究與實作的實驗。 實驗一：在醋酸溶液中加入碳酸鉀晶體，可產生某種氣體，將此氣體通入澄清石灰水溶液後生成混濁沉澱物。 實驗二：將亞硝酸加入於醋酸鈉溶液中，小齊可聞到醋酸的特殊酸味。 根據上述實驗結果，小齊推論出下列三種酸的強弱順序應為何？
  options:
  - label: A
    content: $HNO_{2}$＞$CH_{3}$COOH＞$H_{2}CO_{3}$
  - label: B
    content: $CH_{3}$COOH＞$HNO_{2}$＞$H_{2}CO_{3}$
  - label: C
    content: $HNO_{2}$＞$H_{2}CO_{3}$＞$CH_{3}$COOH
  - label: D
    content: $H_{2}CO_{3}$＞$CH_{3}$COOH＞$HNO_{2}$
  - label: E
    content: $CH_{3}$COOH＞$H_{2}CO_{3}$＞$HNO_{2}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: 由實驗一，可得知$CH_{3}$COOH可將氫離子給予$CO_{3}^{2-}$、$HCO_{3}^{-}$，故可知醋酸的酸性大於$H_{2}CO_{3}$、$HCO_{3}^{-}$；由實驗二，可得知$HNO_{2}$可將氫離子給予$CH_{3}COO^{-}$，故可知$HNO_{2}$的酸性大於$CH_{3}$COOH，故選(A)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 下列氧化物中，哪一個溶於水即成為酸性溶液？
  options:
  - label: A
    content: CaO
  - label: B
    content: MgO
  - label: C
    content: CO
  - label: D
    content: $P_{4}O_{6}$
  - label: E
    content: ZnO
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D)非金屬氧化物溶於水呈酸性，(C)難溶於水，其餘(A)(B)(E)為金屬氧化物。故選(D)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 下列的酸，何者為二質子酸且命名正確？
  options:
  - label: A
    content: 過錳酸：$H_{2}MNO_{4}$
  - label: B
    content: 亞磷酸：$H_{3}PO_{3}$
  - label: C
    content: HCN：氫氰酸
  - label: D
    content: $H_{2}SO_{3}$：硫酸
  - label: E
    content: $H_{2}C_{2}O_{4}$：乙酸
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (A)錳酸；(C)為單質子酸；(D)亞硫酸；(E)乙二酸or草酸。故選(B)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_7
  section: 1
  number: 7
  type: single
  page: 1
  stem: 為了表示溶液的酸鹼性，科學家提出了酸度（AG）的概念，酸度是一種新的表示法： AG＝log（$\frac{ [H^{＋}] }{ [OH^{－}] }$）。下列有關AG的敘述哪些正確？
  options:
  - label: A
    content: 不管在任何溫度下，中性的溶液AG永遠是0
  - label: B
    content: 酸度的數值愈大表示溶液酸性愈弱
  - label: C
    content: 在25℃時，0.01 M的氫氧化鈉溶液其AG＝10.0
  - label: D
    content: 常溫下，0.01 M的鹽酸其AG＝12.0
  - label: E
    content: 加水稀釋0.01 M盬酸的過程中，AG值逐漸變小，最後會接近1
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)中性溶液的[$H^{+}$]＝[$OH^{-}$]，因此log$\frac{[H^{+}]}{[OH^{-}]}$＝0，此選項正確；(B)數值越大代表[$H^{+}$]＞[$OH^{-}$]，酸性越強；(C) 0.01 M的氫氧化鈉中，[$OH^{-}$]＝$10^{-2}$ M、[$H^{+}$]＝$10^{-12 }$M，故AG＝log($\frac{10^{-12}}{10^{-2}}$)＝-10；(D) 0.01 M的鹽酸中，[$H^{+}$]＝$10^{-2}$ M、[$OH^{-}$]＝$10^{-12}$ M，AG＝log($\frac{10^{-2}}{10^{-12}}$)＝10；(E)加水稀釋後，溶液pH值逐漸接近7，由(A)選項答案可知AG接近0。故選(A)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_8
  section: 1
  number: 8
  type: single
  page: 1
