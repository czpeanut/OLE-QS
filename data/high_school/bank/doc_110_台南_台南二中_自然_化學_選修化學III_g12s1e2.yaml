- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_18
  section: 1
  number: 18
  type: single
  page: 2
  stem: 依據布－洛酸鹼學說的觀念，下列哪一個屬於兩性物質？
  options:
  - label: A
    content: $H_{2}SO_{4}$
  - label: B
    content: $H_{3}O^{＋}$
  - label: C
    content: $HPO_{3}^{2－}$
  - label: D
    content: $HCO_{3}^{－}$
  - label: E
    content: $NH_{4}^{＋}$
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 可得、失$H^{+}$者為兩性物質。(A)只能失去、不能得到；(B)只能失去、不能得到；(C)只能得到，不能失去（亞磷酸為二質子酸）；(D)可失去$H^{+}$成$CO_{3}^{2-}$亦可得到$H^{+}$成$H_{2}CO_{3}$；(E)只能失去、不能得到。故選(D)。
- id: doc_110_台南_台南二中_自然_化學_選修化學III_g12s1e2_s1_19
  section: 1
  number: 19
  type: single
  page: 2
  stem: 關於阿瑞尼斯酸鹼的定義以及對電解質性質的敘述，下列哪一個選項是正確的？
  options:
  - label: A
    content: 酸性物質溶解在水中解離出氫離子
  - label: B
    content: 鹼性物質必定為離子化合物，如氫氧化鈉
  - label: C
    content: 鹽類物質必定為可溶於水
  - label: D
    content: 溶液中的陽離子數目與陰離子數目必相等
  - label: E
    content: 一般來說，水溶液皆為中性
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A)正確；(B)也可能為分子化合物，例如氨（$NH_{3}$）；(C)不一定，也有難溶鹽類例如AgCl；(D)不一定，例如$CaCl_{2}$中$Cl^{-}$的數量即為$Ca^{2+}$數量的兩倍；(E)不一定，也有可能為酸性或鹼性。故選(A)。
