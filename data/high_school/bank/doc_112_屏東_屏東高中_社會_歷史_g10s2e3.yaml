  stem: 1929 年 10 月 24 日紐約華爾街股票交易所，突然有大批股票拋出，股價驟跌。是年冬季，世界經濟普遍呈現蕭條景象，物價指數開始下跌；日本也受到影響。請問日本的因應措施，下列何者為是？
