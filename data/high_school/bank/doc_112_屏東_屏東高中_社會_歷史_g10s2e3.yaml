  answer_status: verified
  answer_source: answer_key
  explanation: '受到全球經濟大恐慌影響，日本軍方決定以(D)對外侵略方式解決國內經濟問題，於是 1931 年發動九一八事變，占領中國東北。

    19.1894 年朝鮮爆發(A)東學黨事變，清、日兩國皆派兵協助鎮壓，卻造成兩國對峙，最後演變成甲午戰爭。

    20.越南原是中國的藩屬，但在 1884 ～ 1885 年的(C)清法戰爭後，基於「棄越南，保朝鮮」的想法下，決定承認法國對越南的宗主權。

    21.(C)經濟大恐慌時，日本亦受到波及，為解決國內日益困頓的經濟問題，軍方於 1931 年發動九一八事變，占領中國東北。

    22.(B)首任內閣總理為唐紹儀，宋教仁在國民黨於國會大選獲勝後，曾有機會成為內閣總理，但最後遇刺身亡。

    23.(B)《馬關條約》規定朝鮮獨立，從此不再是中國的藩屬。

    24.由於知識分子改革方案中有「爭取日本的援助」一項，可知該國的殖民母國並非日本，因此(A)可刪除，(B)(D)並未被殖民，亦可刪除，故答案為(C)越南。在法國殖民期間，以潘周楨為代表的改革派主張透過殖民當局的協助，發展現代化改革；潘佩珠等革命派人士則盼日本能協助越南抗法，爭取獨立機會。

    25.(A)越南在法國殖民統治時期，推廣羅馬拼音的越南語，逐步削弱中國文化在越南的影響力。(B)(C)(D)三者並未被西方國家殖民，其中朝鮮在日本殖民統治期間被推行日文，並非羅馬拼音文字。

    26.朝鮮於 1910 年成為日本的殖民地，選項當中僅(D) 1919 年三一運動發生於殖民時期。(A)(B)(C)三者皆發生於李氏朝鮮統治時期，且非獨立運動。

    27.興宣大院君在攝政時期，主要採取「鎖國排外」政策，拒絕列強開港通商的要求，並強力鎮壓天主教，因此答案為(D)。

    28.獨立協會為(C)徐載弼於 1896 年成立的社會團體，當時朝鮮才脫離中國的藩屬地位，卻面臨日本與俄國勢力虎視眈眈，因此該社團發行《獨立新聞》宣揚西方民主思想及民族獨立，追求朝鮮真正獨立自主之路。

    29.中國「全力發展經濟」係於 1978 年底鄧小平掌權之後，因此答案為(D) 1980 年代。

    30.1986 年安徽爆發民主學潮，最終雖為中共當局鎮壓，但作風相對開明的總書記(B)胡耀邦遭批判為縱容知識分子，因此被迫下臺。

    31.將日僑拘留的國家，必定是戰爭期間與日本敵對的陣營，(B)泰國為日本控制的政權，(C)西藏、(D)中國並無能力將這麼多日僑拘留，三者皆可刪除，因此答案為(A)美國。

    32.中日戰爭爆發的導火為 1937 年的盧溝橋事變，與此同年的大事尚有 1937 年 12 月的南京大屠殺，(D)為正解。(A) 1931 年九一八事變。(B) 1932 年一二八事變。(C) 1928 年的五三慘案。

    33.漫畫中的人物可從其臂章得知為日本軍方，被牽繩拉著的狗身上有「汪」字，暗指汪精衛，圖中顯示日本以撤兵為由利誘汪精衛，應是指扶持汪精衛成立南京的國民政府一事，於 1940 年對日抗戰期間成立，選項中僅(C)為對日抗戰時期。

    34.(B)審判者由各同盟國政府提名，包括中國、美國、英國、蘇聯、法國等共 11 個對日相關之同盟國或領地政府，共同任命 11 名法官審理。

    35.(D)甲午戰爭後，日本成為亞洲強國；日俄戰爭後，日本則躋身為世界強國之林。

    36.這份文告強調正式對日宣戰，過去的中、日相關條約與協定全部廢止，可知為中國對日本的正式宣戰文告，時間為 1941 年(A)珍珠港事變發生，繼美國對日宣戰之後，中國亦在翌日對日宣戰。(D)七七事變後，中國對日全面抗戰，但雙方皆處於「戰而不宣」的情況。

    37.「七三一部隊」的正式編號為關東軍滿洲第 691 部隊下之滿洲第 731 部隊，因此可知其駐守地為中國(D)東北的滿洲。

    38.挹江門為中國南京城牆上的一座門，題文所述為 1937 年 12 月日軍進入南京後所展開的大屠殺行動，因此答案為(D)。

    39.「改革開放」屬於經濟上的改革措施，但「四個堅持」則為政治上的主張，可見鄧小平的作法實則是「經右政左」的路線，因此答案為(D)。

    40.三大會戰依序為(A)遼瀋會戰（1948 年 9 月 12 日起）、徐蚌會戰（1948 年 11 月 6 日起）、平津會戰（1948 年 11 月 29 日起）。

    41.從中國共產黨「再一次於國民黨的庇蔭下茁壯」，可知指的是第二次的國共合作，此是在(A)西安事變後，蔣中正承諾停止剿共，同意聯共抗日。

    42.從青年學生破壞古蹟、搗毀文物與書畫等行為，即可推知為高喊「破四舊」的文化大革命，(C)為正解。

    43.海報上出現「鎮壓反革命」，為 1950 年代中共的社會主義改造，掃蕩國民黨員與異議分子以消弭反抗力量，因此答案為(C)。

    44.從 1953 年在板門店簽訂《停戰協議》，即可推知這場戰爭為(A)韓戰。

    45.二戰結束後，由(B)胡志明領導的越南獨立同盟會接管越南北部地區，於河內宣布成立越南民主共和國，與法國扶持的南越阮朝保大帝政權對峙。

    46.(A)(B)(C)(D)皆為正解。(E)新文化運動期間正值俄國十月革命，不少知識分子認為俄國的革命經驗可供學習，因此共產主義思想開始在中國流傳。

    47.(C)明治維新模仿西方建立新式軍隊，並採行徵兵制。

    48.(A)此時仍有蘇聯對中國提供少數援助。(B)淞滬會戰後，上海仍失守淪陷。(C)國府遷都重慶後，日本在占領區設置傀儡政權相抗，如汪精衛的南京國民政府則親日，並非全國一致抗日。(E)廢除不平等條約為 1943 年，並非抗戰前四年。

    49.中共建國初期，外交上對蘇聯採取「一邊倒」策略，並與蘇聯建立軍事同盟。1953 年史達林過世後，由於新領導人赫魯雪夫批判史達林的暴行，引發毛澤東的不滿，中、蘇兩國的關係也日漸惡化，甚至在邊境引發軍事衝突，因此正確答案為(A)(B)(C)(E)。(D)「修正主義」是針對赫魯雪夫的說法。'
