  answer_status: verified
  answer_source: answer_key
  explanation: 從「與外國締結通商條約等事項」，可知此時的日本已歷經黑船事件，被迫開港通商。面對西力衝擊所產生的影響，因此日本國內針對開國與否分裂成兩派，答案為(B) 1850 年代日本開港通商之初。從「主張武力推翻幕府的尊王攘夷派」一句，可知此時幕府尚在，因此(C)(D)不選。
