  stem: '依據事件二題文框起來的訊息，請先勾選指揮中心為防疫而對自主健康管理者所採取的措施涉及對人民何項公民權利的限制並說明理由。

    ㈡主權為國家組成的要素之一，以下有兩件事件與國家主權有關，請閱讀完後回答下列問題： （事件一）「中華民國空軍廣播，位於臺灣西部空域、高度1,800公尺的中共軍機注意！你已接近我空域，影響我飛行安全，立即迴轉脫離！」。 Air Defense Identification Zone（簡稱ADIZ），亦稱作防空識別區，乃是為了國家安全和空防需要而劃定的空域，目的是讓國家擁有充裕的時間應對空中威脅，因此ADIZ可能會大於領空範圍。隨著我國國慶日將至，近期共軍擾台頻繁，空軍發布共機動態共19架軍機侵擾我西南防空識別區（ADIZ），空軍派遣空中巡邏兵力應對、廣播驅離及以防空飛彈追監。（引用自：聯合新聞網） （事件二）南美洲國家委內瑞拉為擺脫長年的惡性通膨，貨幣玻利瓦面額將從10月1日起砍掉6個零，這是委國政府13年來第3次刪零，總計2008年以來已砍掉14個零。法新社報導，拿掉6個零之後，百萬面額的玻利瓦（olivar）一夜間就變成1玻利瓦，兑換美元仍相當於25美分（約新台幣7元）。（引用自：ETtoday新聞雲）'
