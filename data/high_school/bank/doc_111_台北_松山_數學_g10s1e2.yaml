- id: doc_111_台北_松山_數學_g10s1e2_s3_1
  section: 3
  number: 1
  type: multiple
  page: 2
  stem: 坐標平面上，關於方程式（x－1）$^{2}$＋（y＋3）$^{2}$＝5。試選出正確的選項。
  options:
  - label: A
    content: 圖形為一圓
  - label: B
    content: 圖形通過原點（0，0）
  - label: C
    content: 圖形對稱於直線 y＝3
  - label: D
    content: 圖形對稱於直線 7x＋2y－1＝0
  - label: E
    content: 圖形所圍成的面積為 25π
  answer:
  - A
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)○：圖形為圓心（1，－3），半徑為$\sqrt{5}$的圓

    (B)╳：（0，0）代入⇒（0－1）$^{2}$＋（0＋3）$^{2}$≠5

    ∴未通過（0，0）

    (C)╳：y＝3 未過圓心（1，－3）

    ∴未對稱直線 y＝3

    (D)○：7x＋2y－1＝0 過圓心（1，－3）

    ∴對稱直線 7x＋2y－1＝0

    (E)╳：半徑為$\sqrt{5}$ ∴面積為π（$\sqrt{5}$）$^{2}$＝5π

    故選(A)(D)'
