  stem: 坐標平面上，直線 L 通過點 A（2，－6）及點 B（－4，3）。試選出直線 L 的 x 截距之選項。
  options:
  - label: A
    content: '3'
  - label: B
    content: '2'
  - label: C
    content: '0'
  - label: D
    content: －2
  - label: E
    content: －3
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 'm＝$\frac{3- (-6 )}{(-4 ) -2}$＝$\frac{9}{-6}$＝$-\frac{3}{2}$⇒ L：y－3＝$-\frac{3}{2}$（x＋4）

    ⇒ 3x＋2y＝－6

    與 x 軸交於（－2，0） ∴x 截距為－2

    故選(D)'
