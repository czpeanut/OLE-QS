  section: 1
  number: 9
  type: single
  page: 2
  stem: 長久以來，人們對於地球上眾多形形色色的生物感到好奇，例如：長頸鹿為什麼有長脖子？孔雀為何有美麗的尾羽？在演化理論的發展史上，下列哪一位學者率先提出有系統的生物演化理論？
