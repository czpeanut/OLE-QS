  page: 2
  stem: 有關生物演化的機制，下列敘述何者正確？
  options:
  - label: A
    content: 達爾文認為生物的遺傳變異乃由於突變的關係
  - label: B
    content: 天擇可以決定生物演化的方向
  - label: C
