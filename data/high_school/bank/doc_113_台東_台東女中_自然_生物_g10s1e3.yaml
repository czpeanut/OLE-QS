- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_1
  section: 1
  number: 1
  type: single
  page: 1
  stem: 甲、以相同限制酶切割取得胰島素基因片段；乙、以 DNA 聚合酶連接質體 DNA 與胰島素基因片段；丙、以 DNA 水解酶切開細菌質體 DNA；丁、以相同限制酶切開細菌質體 DNA；戊、混合胰島素基因片段與細菌質體 DNA；己、以 DNA 連接酶連接質體 DNA 與胰島素基因片段。若欲製作含有人類胰島素基因的重組 DNA，請問正確的步驟為何？
  options:
  - label: A
    content: 甲丙戊乙
  - label: B
    content: 甲丁戊己
  - label: C
    content: 丙甲戊己
  - label: D
    content: 丁甲戊乙
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: (甲)以特定限制酶切割取得目標基因→(丙)以相同限制酶切割載體 DNA→(戊)混合兩者→(己)以 DNA 連接酶黏合兩段基因為重組 DNA。
- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_2
  section: 1
  number: 2
  type: single
  page: 1
  stem: 若將甲、乙、丙、丁，依化學性質相同者分為同組，則下列分組何者正確？
  options:
  - label: A
    content: 甲乙
  - label: B
    content: 甲丁
  - label: C
    content: 乙丙
  - label: D
    content: 乙丁
  group_stem: 下圖為重組 DNA 過程示意圖，甲～丁代表四種參與反應的不同分子，請根據圖示回答下列問題：
  shared_asset: g1_2_3
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 甲：載體、乙：限制酶、丙：目標基因、丁：DNA 連接酶。其中甲、丙皆為 DNA，乙、丁則為蛋白質。
- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_3
  section: 1
  number: 3
  type: single
  page: 1
  stem: 根據上圖，下列敘述何者正確？
  options:
  - label: A
    content: 甲與丙來自同一個細胞
  - label: B
    content: 乙須在細胞內作用，丁則可在試管內完成反應
  - label: C
    content: 乙與甲的切割位有專一性
  - label: D
    content: 最後的產物須在真核細胞中才能表現
  group_stem: 下圖為重組 DNA 過程示意圖，甲～丁代表四種參與反應的不同分子，請根據圖示回答下列問題：
  shared_asset: g1_2_3
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 載體與目標基因可來自兩種不一樣的生物。

    (B) 皆可在試管內進行。

    (D) 原核生物也可以。'
- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_4
  section: 1
  number: 4
  type: single
  page: 1
  stem: 基因轉殖是指下列何者？
  options:
  - label: A
    content: 將重組 DNA 移入接受細胞的過程
  - label: B
    content: 將目標 DNA 在體外切割、選擇的過程
  - label: C
    content: 將目標 DNA 與載體結合的過程
  - label: D
    content: 篩選基因轉殖生物並大量繁殖的過程
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) 選取目標基因。

    (C) 基因重組。

    (D) 選殖。'
- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_5
  section: 1
  number: 5
  type: single
  page: 1
  stem: 現今的基改作物可分為兩大方向：抗除草劑與抗蟲。例如：美國孟山都公司生產的耐嘉磷塞基改黃豆及玉米，將能抵抗除草劑「嘉磷塞」的基因轉殖入作物，使其可耐受除草劑；或是將蘇力菌的 Cry 毒蛋白基因轉殖入玉米中，使玉米產生 Cry 毒蛋白造成害蟲消化道穿孔，有抗蟲的效果。下列關於這些基改作物的敘述，何者<u>錯誤</u>？
  options:
  - label: A
    content: 目前的基改作物都種植在溫室中，以避免基因汙染
  - label: B
    content: 抗蟲基改作物可以減少殺蟲劑的使用，降低對生態系的危害
  - label: C
    content: 抗蟲基改作物可能使有耐受性的昆蟲逐漸增加而失去效果
  - label: D
    content: 抗除草劑的作物可能因傳粉而使周圍也出現對除草劑有抗性的超級雜草
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 目前的基改作物已有田野種植。
- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_6
  section: 1
  number: 6
  type: single
  page: 1
  stem: 在遺傳工程的技術中基因能被用來轉殖，使其能在細菌中表現，下列何者可提供基因來源？
  options:
  - label: A
    content: 僅有細菌
  - label: B
    content: 僅有病毒
  - label: C
    content: 僅有真核生物細胞
  - label: D
    content: 所有生物或人工合成的 DNA 均可
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: (D) 所有生物或人工合成的 DNA 均可作為目標 DNA，提供基因來源。
- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_7
  section: 1
  number: 7
  type: single
  page: 2
  stem: 我們可利用基因轉殖技術，將水母的螢光蛋白基因轉殖到魚體內產生螢光魚，下列關於螢光魚的敘述何者正確？
  options:
  - label: A
    content: 螢光魚為一新物種
  - label: B
    content: 螢光魚必無法產生下一代
  - label: C
    content: 螢光魚的下一代必為螢光魚
  - label: D
    content: 螢光魚可合成螢光蛋白
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) 仍能和同種魚生下有繁殖力的子代，故非「新物種」。

    (B) 若正常活著，生殖能力也可能正常。

    (C) 有性生殖產下的不一定有螢光蛋白基因。'
- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_8
  section: 1
  number: 8
  type: single
  page: 2
  stem: 下列有關基因轉殖技術在畜牧業上的應用，何者正確？
  options:
  - label: A
    content: 可以利用顯微注射方式，將人類生長激素基因注入小鼠受精卵中
  - label: B
    content: 將人類蛋白質基因導入羊的染色體中，即可以大量生產複製羊
  - label: C
    content: 將生長因子的基因轉殖至鮭魚體內，目的在萃取鮭魚體中的生長因子，用來治療侏儒症患者
  - label: D
    content: 在基因轉殖羊的體細胞內無法找到外源基因
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '(B) 複製羊生物技術並未運用到人類蛋白質基因。

    (C) 要將生長因子的基因轉殖至鮭魚受精卵內，才能在鮭魚體內萃取生長因子。

    (D) 基因轉殖羊是利用人類凝血因子基因經顯微注射方式注入山羊受精卵，使成長後的山羊乳汁中含有凝血因子。'
