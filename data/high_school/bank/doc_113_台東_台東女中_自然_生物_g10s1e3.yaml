- id: doc_113_台東_台東女中_自然_生物_g10s1e3_s1_19
  section: 1
  number: 19
  type: single
  page: 3
  stem: '有甲、乙、丙、丁四種蜥蜴，其某功能基因之部分 DNA 序列如下表；根據下述資料，如果這段 DNA 序列的相似度可以反映這些蜥蜴間的親緣關係，則和蜥蜴丁親緣關係最接近者為何？

    | 蜥蜴 | 某功能基因之部分 DNA 序列 |

