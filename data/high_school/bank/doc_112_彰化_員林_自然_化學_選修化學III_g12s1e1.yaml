  section: 1
  number: 9
  type: single
  page: 2
  stem: '下表是硝酸銀、硝酸鉛、硝酸鋇、硝酸鎳等四種溶液分別與氯化鈉、硫酸鈉、硫化鈉等三種溶液作用的結果。（所有溶液的濃度都是 0.01 M；－表示無沉澱。）

    |  | $AgNO_{3}$ | Pb($NO_{3}$)$_{2}$ | Ba($NO_{3}$)$_{2}$ | Ni($NO_{3}$)$_{2}$ |

    | --- | --- | --- | --- | --- |

    | NaCl | 白色沉澱 | 白色沉澱 | － | － |

    | $Na_{2}SO_{4}$ | － | 白色沉澱 | 白色沉澱 | － |

    | $Na_{2}$S | 黑色沉澱 | 黑色沉澱 | － | 黑色沉澱 |

    有一溶液含 $Ag^{＋}$、$Pb^{2＋}$、$Ni^{2＋}$ 三種離子各 0.01 M，若使用均為 0.01 M 的 NaCl、$Na_{2}SO_{4}$、$Na_{2}$S 溶液作為試劑，使 $Ag^{＋}$、$Pb^{2＋}$、$Ni^{2＋}$ 分離，則滴加試劑的順序應為下列何者？'
  options:
  - label: A
    content: NaCl、$Na_{2}SO_{4}$、$Na_{2}$S
  - label: B
    content: NaCl、$Na_{2}$S、$Na_{2}SO_{4}$
  - label: C
    content: $Na_{2}$S、NaCl、$Na_{2}SO_{4}$
  - label: D
    content: $Na_{2}SO_{4}$、$Na_{2}$S、NaCl
  - label: E
    content: $Na_{2}SO_{4}$、NaCl、$Na_{2}$S
  answer:
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '一種試劑造成一種沉澱，達到分離的目的：

    $Na_{2}SO_{4}$(aq)（$PbSO_{4}$(s)↓） → NaCl(aq)（AgCl(s)↓） → $Na_{2}$S(aq)（NiS(s)↓）'
