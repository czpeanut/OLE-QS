- id: doc_112_彰化_員林_自然_化學_選修化學III_g12s1e1_s2_17
  section: 2
  number: 17
  type: multiple
  page: 3
  stem: 常溫下，已知硫酸鈣與硫酸鋇的溶度積常數 $K_{sp}$ 分別為 2.5×$10^{－5}$ 和 1.7×$10^{－10}$。則下列有關溶液的敘述，哪些是正確的？
  options:
  - label: A
    content: 硫酸鈣在純水中的溶解度為 5.0×$10^{－3}$ M
  - label: B
    content: 硫酸鈣在 0.10 M 氯化鈣溶液的溶解度為 2.5×$10^{－4}$ M
  - label: C
    content: 硫酸鋇在 0.01 M 氯化鋇溶液的溶解度為硫酸鋇在純水中溶解度的一半
  - label: D
    content: 將 50 mL、0.01 M 氯化鋇溶液，加入 50 mL、0.01 M 硫酸鉀溶液，沒有沉澱產生
  - label: E
    content: 若將 0.05 M 硫酸鉀溶液，逐滴加入一 100 mL 含 0.01 M 氯化鋇及 0.01 M 氯化鈣的混合水溶液中，則會先產生硫酸鋇沉澱
  answer:
  - A
  - B
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A)正確；硫酸鈣在純水中的溶解度為$\sqrt{2.5\times 10^{-5}}$＝5×$10^{－3}$（M）

    (B)正確；硫酸鈣在 0.10 M 氯化鈣溶液中，同離子 [$Ca^{2＋}$]＝0.1 M

    故 0.1×s≒2.5×$10^{－5}$，所求溶解度 s≒2.5×$10^{－4}$（M）

    (C)錯誤；硫酸鋇在純水中溶解度 $s_{1}$＝$\sqrt{1.7\times 10^{-10}}$≒1.3×$10^{－5}$（M）

    硫酸鋇在 0.01 M 氯化鋇溶液中，同離子 [$Ba^{2＋}$]＝0.01 M

    故：0.01×$s_{2}$≒1.7×$10^{－10}$，溶解度 $s_{2}$≒1.7×$10^{－8}$

    所求：$\frac{s_{2}}{s_{1}}$＝$\frac{1.7\times 10^{-8}}{1.3\times 10^{-5}}$≒1.3×$10^{－3}$

    (D)錯誤；等體積混合，濃度減半；

    $Q_{sp}$＝[$Ba^{2＋}$][$SO_{4}^{2－}$]＝$\frac{0.01}{2}$×$\frac{0.01}{2}$＝2.5×$10^{－5}$＞$K_{sp（BaSO}4_{）}$＝1.7×$10^{－10}\Rightarrow$所以有沉澱。

    (E)正確；硫酸鈣 $CaSO_{4}$ 與硫酸鋇 $BaSO_{4}$ 均為同類型的難溶性鹽類（陰、陽離子個數比 1：1），所以定量硫酸鉀溶液，逐滴加入等濃度的氯化鋇、氯化鈣的混合水溶液中，$K_{sp}$ 愈小的難溶性鹽類 $BaSO_{4}$，愈先沉澱。'
