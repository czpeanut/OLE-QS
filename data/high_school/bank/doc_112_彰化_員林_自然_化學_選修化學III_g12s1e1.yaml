- id: doc_112_彰化_員林_自然_化學_選修化學III_g12s1e1_s2_16
  section: 2
  number: 16
  type: multiple
  page: 3
  stem: 設下列各種鹽類在水中溶解度為 s（mol/L），則下列哪些鹽類之溶度積可表示為 $K_{sp}$＝$4s^{3}$？
  options:
  - label: A
    content: $BaSO_{4}$
  - label: B
    content: $CaF_{2}$
  - label: C
    content: $CaCO_{3}$
  - label: D
    content: $HgCl_{2}$
  - label: E
    content: $MgNH_{4}PO_{4}$
  answer:
  - B
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: '當難溶性鹽類的溶解度為 s（mol/L)，且解離出陰、陽離子的個數比為 1：2 或 2：1 時，溶度積可表示為 $K_{sp}$＝$4s^{3}$，符合題意的有(B) $CaF_{2}$、(D) $HgCl_{2}$。

    另解：

    (A) $K_{sp}$＝s×s＝$s^{2}$

    (B) $K_{sp}$＝s×（2s）$^{2}$＝$4s^{3}$

    (C) $K_{sp}$＝s×s＝$s^{2}$

    (D) $K_{sp}$＝s×（2s）$^{2}$＝$4s^{3}$

    (E) $K_{sp}$＝s×s×s＝$s^{3}$'
