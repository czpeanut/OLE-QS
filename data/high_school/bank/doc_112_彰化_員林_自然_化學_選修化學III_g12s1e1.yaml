  stem: '比色法

    下列是在特定溫度下利用目視比色法，求平衡常數的實驗。實驗步驟如下：

    ①取 5 支規格相同的比色用試管，分別加入 5 毫升的 0.002 M 的 KSCN 溶液，並標記為 1 至 5 號試管。

    ②取 20 毫升的 0.25 M 硝酸鐵水溶液，置於錐形瓶中，標為甲溶液。

    ③以吸量管吸取 10 毫升甲溶液，置於另一錐形瓶中並加水稀釋成 25 毫升，標為乙溶液。

    ④重複③的稀釋程序，以乙溶液配製丙溶液，以丙溶液配製丁溶液，以丁溶液配製戊溶液。

    ⑤以吸量管取甲溶液 5 毫升加至 1 號試管，並在試管中加入一滴硝酸，混合均勻。

    ⑥重複步驟 5 的方法，將 5 毫升乙、丙、丁、戊溶液分別加至 2 至 5 號試管。

    ⑦將 2 至 5 號試管分別與 1 號試管比色，由試管的正上方俯視，用滴管從 1 號試管吸出適量溶液，當各試管與 1 號試管顏色深淺相同時，記錄各試管與 1 號試管的液面高度比。

    (1)寫出此一平衡反應的淨離子反應式？（2 分）

    (2)丁溶液中 [$Fe^{3＋}$]＝？M（2 分）

    (3)若將 1 號試管血紅色的濃度視為完全反應的結果，當 4 號試管與 1 號試管的顏色深淺相同時，其液面高度比為 4：1。試問 4 號試管中血紅色物質的濃度為何？（2 分）

    (4)承第(3)題，維持相同狀況，平衡時，4 號試管的平衡常數為若干？（四捨五入至小數點第 2 位；2 分）'
