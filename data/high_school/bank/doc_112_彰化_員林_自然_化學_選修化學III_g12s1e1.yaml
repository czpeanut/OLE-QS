- id: doc_112_彰化_員林_自然_化學_選修化學III_g12s1e1_s1_10
  section: 1
  number: 10
  type: single
  page: 2
  stem: 在某溫度時，$PbI_{2}$ 的 $K_{sp}$＝2.5×$10^{－9}$。在此溫度下，取 1.0×$10^{－3}$ M 的 NaI 溶液，與同體積未知濃度的 Pb($NO_{3}$)$_{2}$ 溶液充分混合，若欲使之生成 $PbI_{2}$ 沉澱，則此 Pb($NO_{3}$)$_{2}$ 溶液的濃度至少應高於多少 M？
  options:
  - label: A
    content: 2.0×$10^{－2}$
  - label: B
    content: 2.5×$10^{－3}$
  - label: C
    content: 1.0×$10^{－2}$
  - label: D
    content: 8.0×$10^{－2}$
  - label: E
    content: 1.0×$10^{－1}$
  answer:
  - A
  answer_status: verified
  answer_source: answer_key
  explanation: '假設 [Pb($NO_{3}$)$_{2}$]$_{0}$＝C，與 NaI 溶液等體積混合時，各濃度減半：

    $K_{sp}$＝$\frac{C}{2}$×$(\frac{1.0\times 10^{-3}}{2})^{2}$＝2.5×$10^{－9}\Rightarrow$C＝$\frac{8\times 2.5\times 10^{-9}}{1.0\times 10^{-6}}$＝2.0×$10^{－2}$（M）'
  tags:
