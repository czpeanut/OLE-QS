  stem: 用試管取 0.1 M 碘化鉀溶液 3 mL 後，滴入 0.1 M 硝酸鉛溶液 2 mL，立即產生沉澱。下列有關該實驗的敘述，哪些正確？
  options:
  - label: A
    content: 產生的沉澱是白色
  - label: B
    content: 硝酸鉛是限量試劑
  - label: C
    content: 加完 2 mL 的硝酸鉛溶液後，再加入碘化鉀溶液，沉澱的量會隨之增加
  - label: D
