- id: doc_112_彰化_員林_自然_化學_選修化學III_g12s1e1_s2_15
  section: 2
  number: 15
  type: multiple
  page: 3
  stem: '在 8 支編號①～⑧號的塑膠滴管中裝有下列鹽溶液：

    硝酸銀、氯化鋇、碳酸銨、氯化鈉、碘化鉀、氯化鋅、硝酸鉛、鉻酸鉀但試管編號與上述鹽類之順序並不相同。實驗結果如下，下表為各試劑互相反應的結果：（×：沒有反應）

    |  | ① | ② | ③ | ④ | ⑤ | ⑥ | ⑦ | ⑧ |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | ① |  | 白↓ | 黃↓ | 白↓ | 黃↓ | 白↓ | × | 白↓ |

    | ② |  |  | × | × | × | × | 白↓ | × |

    | ③ |  |  |  | × | × | × | 黃↓ | × |

    | ④ |  |  |  |  | 黃↓ | 白↓ | 白↓ | × |

    | ⑤ |  |  |  |  |  | × | 磚紅↓ | × |

    | ⑥ |  |  |  |  |  |  | 白↓ | 白↓ |

    | ⑦ |  |  |  |  |  |  |  | 白↓ |

    | ⑧ |  |  |  |  |  |  |  |  |

    請參考上述反應結果，請問④、⑥、⑧各是何種物質？'
  options:
  - label: A
    content: Pb($NO_{3}$)$_{2}$
  - label: B
    content: NaCl
  - label: C
    content: $BaCl_{2}$
  - label: D
    content: ($NH_{4}$)$_{2}CO_{3}$
  - label: E
    content: $ZnCl_{2}$
  answer:
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: 磚紅色沉澱應為鉻酸銀，可知⑤、⑦為鉻酸鉀、硝酸銀；①～⑧與鉻酸鉀有反應的沉澱物不會有白色的，所以⑤為鉻酸鉀，⑦硝酸銀；⑦硝酸銀與③有黃色的沉澱，所以③應為碘化 鉀，沉澱物為碘化銀；③碘化鉀與①有黃色的沉澱，所以①應為硝酸鉛，沉澱物為碘化鉛；⑤鉻酸鉀與④有黃色的沉澱，所以④應為氯化鋇，沉澱物為鉻酸鋇；剩下②、⑥、⑧為碳酸銨、氯化鈉、氯化鋅；④氯化鋇與⑥有白色的沉澱，所以⑥應為碳酸銨，沉澱物為碳酸鋇；⑥碳酸銨與⑧有白色的沉澱，所以⑧應為氯化鋅，沉澱物為碳酸鋅；最後②為氯化鈉。
