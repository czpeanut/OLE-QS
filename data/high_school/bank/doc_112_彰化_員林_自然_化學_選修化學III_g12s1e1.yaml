- id: doc_112_彰化_員林_自然_化學_選修化學III_g12s1e1_s2_20
  section: 2
  number: 20
  type: multiple
  page: 4
  stem: 已知下列難溶性鹽類的溶度積常數，$NiCO_{3}$ 之 $K_{sp}$＝1.0×$10^{－7}$、$MgF_{2}$ 之 $K_{sp}$＝7.0×$10^{－9}$、$Ag_{3}AsO_{4}$ 之 $K_{sp}$＝1.0×$10^{－22}$、$Pb_{3}$($PO_{4}$)$_{2}$ 之 $K_{sp}$＝8.0×$10^{－43}$，若四種難溶性鹽類在水中的溶解度分別為 $s_{1}$、$s_{2}$、$s_{3}$、$s_{4}$，則下列何者正確？
  options:
  - label: A
    content: $s_{2}$＞$s_{1}$
  - label: B
    content: $s_{3}$＞$s_{1}$
  - label: C
    content: $s_{1}$＞$s_{4}$
  - label: D
    content: $s_{4}$＞$s_{2}$
  - label: E
    content: $s_{3}$＞$s_{4}$
  answer:
  - A
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: '(A) $K_{sp}$＝1.0×$10^{－7}$＝$s_{1}^{2}$，$s_{1}$＝$10^{－3.5}$（M）

    (B) $K_{sp}$＝7.0×$10^{－9}$＝$s_{2}$×（$2s_{2}$）$^{2}$，$s_{2}$≒$10^{－3}$（M）

    (C) $K_{sp}$＝1.0×$10^{－22}$＝（$3s_{3}$）$^{3}$×$s_{3}$，$s_{3}$＝$\sqrt[4]{\frac{100\times 10^{-24}}{27}}$≒$10^{－6}$（M）

    (D) $K_{sp}$＝8.0×$10^{－43}$＝（$3s_{4}$）$^{3}$×（$2s_{4}$）$^{2}$，$s_{4}$＝$\sqrt[5]{\frac{800\times 10^{-45}}{108}}$≒$10^{－9}$（M）

    所以 $s_{2}$＞$s_{1}$＞$s_{3}$＞$s_{4}$。'
