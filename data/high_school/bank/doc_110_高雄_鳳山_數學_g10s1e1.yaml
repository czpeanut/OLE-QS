  stem: '生物學家<u>克萊伯</u>（M.Kleiber）提出許多哺乳動物的基礎代謝率B ( 千卡／天 ) 與其體重M ( 公斤 ) 的關係為B＝KM$^{\frac{3}{4}}$，其中k為大於0的常數，試回答下列問題：

    (1) 一隻貓的體重約為一隻老鼠的100倍，試問貓的基礎代謝率約為老鼠的幾倍？'
  options:
  - label: A
    content: 10倍
  - label: B
    content: 20倍
  - label: C
    content: 30倍
  - label: D
    content: 40倍
  - label: E
    content: 50倍
  explanation: (1) $\begin{cases}B_{cat}=k\cdot M_{cat}^{\frac{3}{4}} \cdots \cdots \cdots ① \\ B_{mouse}=k\cdot M_{mouse}^{\frac{3}{4}}\cdots \cdots ②\end{cases}$， 已知$\frac{M_{cat}}{M_{mouse}}$ ＝100……③， 將$\frac{①}{②}$ ⇒ $\frac{B_{cat}}{B_{mouse}}$＝$\frac{k\cdot M_{cat}^{\frac{3}{4}}}{k\cdot M_{mouse}^{\frac{3}{4}}}$＝$(100)^{\frac{3}{4}}$＝$10^{\frac{3}{2}}$， ⇒ $\frac{B_{cat}}{B_{mouse}}$＝$10^{\frac{3}{2}}$＝10$\sqrt{10}$≒31.6， 故選(C)。 (2) 同理， 由題意知，$\frac{B_{牛}}{B_{鼠}}$＝$\frac{k\cdot M_{牛}^{\frac{3}{4}}}{k\cdot M_{鼠}^{\frac{3}{4}}}$＝1000， ⇒ $(\frac{M_{牛}}{M_{鼠}})^{\frac{3}{4}}$＝$10^{3}$ ⇒ ($\frac{M_{牛}}{M_{鼠}}$)＝$(10^{3})^{\frac{3}{4}}$＝$10^{4}$， 故選(E)。
