- id: doc_110_高雄_鳳山_數學_g10s1e1_s2_4
  section: 2
  number: 4
  type: multiple
  page: 1
  stem: 聲音的強度是用每平方公尺多少瓦特（W／$m^{2}$）來衡量，一般人能感覺出聲音的最小強度為$I_{0}$＝$10^{－12}$（W／$m^{2}$）；當測得的聲音強度為I（W／$m^{2}$）時，所產生的噪音分貝數為d，其函數關係為d (I)＝10．$\log \frac{I}{I_{0}}$，試問下列選項何者正確？
  options:
  - label: A
    content: 一隻蚊子振動翅膀所產生的噪音分貝數為0，則其聲音強度為0（W／$m^{2}$）
  - label: B
    content: 汽車製造廠測試發現，某款新車以每小時60公里速度行駛時，測得的聲音強度為$10^{－4}$（W／$m^{2}$），則此聲音強度產生 的噪音為40分貝
  - label: C
    content: <u>鳳山高中</u>運動會化妝進場中，高三學長攜帶的瓦斯汽笛，若一支瓦斯汽笛獨鳴測得的噪音為70分貝，則其聲音強度 為$10^{－5}$（W／$m^{2}$）
  - label: D
    content: 承(C)，10支這種瓦斯汽笛同時同地合鳴，則被測得的噪音大約為700分貝
  - label: E
    content: 承(C)，<u>鳳山高中</u>運動會開幕典禮中，若司儀報告的聲音為60分貝，則10支這種瓦斯汽笛同時同地合鳴的聲音強度 為司儀報告聲音強度的100倍
  answer:
  - C
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) d ( I )＝10．log ($\frac{I}{I_{0}}$)＝0， ⇒ log ($\frac{I}{I_{0}}$)＝0 ⇒ $\frac{I}{I_{0}}$＝1， ⇒ I＝$I_{0}$＝$10^{－12}$≠0，故錯誤。 (B) d ( $10^{－4}$ )＝10．log ($\frac{10^{-4}}{10^{-12}}$)＝10．log $10^{8}$＝80 ( 分貝 )， 故錯誤。 (C) 70＝10．log ($\frac{I}{10^{-12}}$)， ⇒ log ($\frac{I}{10^{-12}}$)＝7 ⇒ $\frac{I}{10^{-12}}$＝$10^{7}$ ⇒ I＝$10^{－5}$ ( W／$m^{2}$ )，故正確。 (D) 承(C)， 10．$10^{－5}$＝$10^{－4}$代入公式， d ( I )＝10．log ($\frac{10^{-4}}{10^{-12}}$)＝10．log $10^{8}$＝80 ( 分貝 )，故錯誤。 (E) 60＝10．log ($\frac{I}{10^{-12}}$)， ⇒ log ($\frac{I}{10^{-12}}$)＝6 ⇒ I＝$10^{6}$×$10^{－12}$＝$10^{－6}$ ( W／$m^{2}$ ) ( 司儀聲音 )， 由(C)知，10．$10^{－5}$＝$10^{－4}$ ( W／$m^{2}$ ) ( 10支瓦斯氣笛聲音 )， 故$\frac{10^{-4}}{10^{-6}}$＝$10^{2}$＝100，故正確。 故選(C)(E)。
