- id: doc_110_高雄_鳳山_數學_g10s1e1_s2_5
  section: 2
  number: 5
  type: multiple
  page: 1
  stem: <u>鳳山</u>設計公司2020年初開發A和B兩款長方形信封，其中A信封的長與寬分別為$a_{1}$與$a_{2}$，B信封的長與寬分別為$b_{1}$與$b_{2}$，而且$a_{1}$＜$b_{1}$及$a_{2}$＜$b_{2}$。 2020年底又規劃M與G、H三款長方形信封，其中 M信封的長與寬分別為$\frac{a_{1}+b_{1}}{2}$與$\frac{a_{2}+b_{2}}{2}$， G信封的長與寬分別為$\sqrt{a_{1}b_{1}}$與$\sqrt{a_{2}b_{2}}$， H信封的長與寬分別為$\frac{2}{\frac{1}{a_{1}}+\frac{1}{b_{1}}}$與$\frac{2}{\frac{1}{a_{2}}+\frac{1}{b_{2}}}$， 這五款信封都以一邊作為完整的開口，則下列選項哪些是正確的？
  options:
  - label: A
    content: G信封的面積小於M信封的面積
  - label: B
    content: H信封的面積小於或等於G信封的面積
  - label: C
    content: 在不拆疊的情形下，H信封可以完整的放進G信封內
  - label: D
    content: 五個信封中，以A信封的面積最小
  - label: E
    content: 在不拆疊的情形下，A、M、G、H這四個信封都可以完整的放進B信封內
  assets:
  - key: s2_5_f1
    kind: figure
    file: doc_110_高雄_鳳山_數學_g10s1e1/s2_5_f1.png
    crop:
      page: 1
      rect:
      - 472.1
      - 778.5
      - 627.6
      - 898.6
  answer:
  - A
  - B
  - C
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) 算幾不等式，$a_{1}$≠$b_{1}$，$a_{2}$≠$b_{2}$， 故$\frac{a_{1}+b_{1}}{2}$＞$\sqrt{a_{1}b_{1}}$且$\frac{a_{2}+b_{2}}{2}$ ≥ $\sqrt{a_{2}b_{2}}$， 得 ($\frac{a_{1}+b_{1}}{2}$)．($\frac{a_{2}+b_{2}}{2}$)＞$\sqrt{a_{1}b_{1}}$．$\sqrt{a_{2}b_{2}}$，故正確。 (B) $\begin{cases}\frac{\frac{1}{a_{1}}+\frac{1}{b_{1}}}{2}>\sqrt{\frac{1}{a_{1}}\cdot \frac{1}{b_{1}}} \\ \frac{\frac{1}{a_{2}}+\frac{1}{b_{2}}}{2}>\sqrt{\frac{1}{a_{2}}\cdot \frac{1}{b_{2}}}\end{cases}$ ⇒ $\begin{cases}\frac{2}{\frac{1}{a_{1}}+\frac{1}{b_{1}}}<\frac{1}{\sqrt{\frac{1}{a_{1}b_{1}}}}=\sqrt{a_{1}b_{1}}\cdots \cdots \cdots ① \\ \frac{2}{\frac{1}{a_{2}}+\frac{1}{b_{2}}}<\frac{1}{\sqrt{\frac{1}{a_{2}b_{2}}}}=\sqrt{a_{2}b_{2}} \cdots \cdots ②\end{cases}$， ①×②得$\frac{2}{\frac{1}{a_{1}}+\frac{1}{b_{1}}}$×$\frac{2}{\frac{1}{a_{2}}+\frac{1}{b_{2}}}$＜$\sqrt{a_{1}b_{1}}$×$\sqrt{a_{2}b_{2}}$，故正確。 (C) 由(B)知，故正確。 (D) 考慮A信封的寬與B，M，G，H的信封寬比較， B：$b_{1}$＞$a_{1}$， G：$\sqrt{a_{1}b_{1}}$＞$\sqrt{a_{1}\cdot a_{1}}$＝$a_{1}$， M：$\frac{a_{1}+b_{1}}{2}$＞$\frac{a_{1}+a_{1}}{2}$＝$a_{1}$， H：$\frac{2}{\frac{1}{a_{1}}+\frac{1}{b_{1}}}$＞$\frac{2}{\frac{1}{a_{1}}+\frac{1}{a_{1}}}$＝$a_{1}$， 同理，信封長也與寬相同，故正確。 (E) 承(D)， A：$b_{1}$＞$a_{1}$， M：$b_{1}$＞$\frac{a_{1}+b_{1}}{2}$， G：$b_{1}$＞$\sqrt{a_{1}b_{1}}$， H：$\frac{2}{\frac{1}{b_{1}}+\frac{1}{b_{1}}}$＞$\frac{2}{\frac{1}{a_{1}}+\frac{1}{b_{1}}}$，即$b_{1}$＞$\frac{2}{\frac{1}{a_{1}}+\frac{1}{b_{1}}}$， 同理，信封長與信封寬相同，故正確。 故選(A)(B)(C)(D)(E)。
