  stem: 臺灣證券交易市場規定股票成交價格只能在前一個交易日的收盤價（即最後一筆的成交價）的漲、跌7％範圍內變動。例如：某支股票前一個交易日的收盤價是每股100元，則今天該支股票每股的買賣價格必須在93元至107元之間。今<u>有行情賺錢公司</u>股票的價格起伏很大，在110年9月1日的收盤價是每股110元，次日起連續十個交易日以跌停板收盤（也就是每天跌7％），緊接著卻連續十個交易日以漲停板收盤（也就是每天漲7％）。請問經過這二十個交易日後，該支股票每股的收盤價最接近下列哪一個選項中的價格？
  options:
  - label: A
    content: 100元
  - label: B
    content: 105元
  - label: C
    content: 110元
  - label: D
    content: 115元
  - label: E
    content: 120元
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 由題意知， P＝110×( 1－7％ )$^{10}$ ( 1＋7％ )$^{10}$， ⇒ P＝110×( 0.9951 )$^{10}$， ⇒ P≒104.727 ( 元 )， 故選(B)。
