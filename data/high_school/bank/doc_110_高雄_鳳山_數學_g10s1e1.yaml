    content: '| x－1 | ≤ 5'
  - label: B
    content: 0 ≤ | x | ≤ 10
  - label: C
    content: 10 ≤ | x＋3 | ≤ 20
  - label: D
    content: '| 2x＋1 | ≤ 10'
  - label: E
    content: '| x |＋| x－10 |＝10'
  answer:
  - A
  - D
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) | x－1 | ≤ 5 ⇒ －5 ≤ x－1 ≤ 5 ⇒ －4 ≤ x ≤ 6， 6－(－4 )＝10，故正確。 (B) 0 ≤ x ≤ 10 ⇒ 0 ≤ x ≤ 10或－10 ≤ x ≤ 0， 10－(－10 )＝20，故錯誤。 (C) 10 ≤ | x＋3 | ≤ 20， ⇒ 10 ≤ x＋3 ≤ 20或－20 ≤ x＋3 ≤ －10， ⇒ 7 ≤ x ≤ 17或－23 ≤ x ≤ －13， 故錯誤。 (D) | 2x＋1 | ≤ 10 ⇒ －10 ≤ 2x＋1 ≤ 10 ⇒ －$\frac{11}{2}$ ≤ x ≤ $\frac{9}{2}$， $\frac{9}{2}$－(－$\frac{11}{2}$)＝10，故正確。 (E) | x |＋| x－10 |＝10， ① 若x＜0，－x－x＋10＝10 ⇒ x＝0 ( 不合 )。 ② 若0 ≤ x ≤ 10，x＋(－x＋10 )＝10 ⇒ 0＝0 ( 合 )。 ③ 若x＞10，x＋x－10＝0 ⇒ x＝10 ( 不合 )。 由①②③知0 ≤ x ≤ 10，10－0＝10，故正確。 故選(A)(D)(E)。
