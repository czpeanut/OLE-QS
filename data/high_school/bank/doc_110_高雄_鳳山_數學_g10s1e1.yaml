    content: $10^{ log 2}$為有理數
  - label: B
    content: 當x≠0時，$\frac{|x|}{x}$＝1恆成立
  - label: C
    content: 方程式 | x－1 |＝3x－2的解不只一個，即根有兩個以上
  - label: D
    content: 方程式 | x－3 |－| x＋5 |＝7無解
  - label: E
    content: '| x－3 |＋| x＋5 |＞7恆成立'
  answer:
  - A
  - E
  answer_status: verified
  answer_source: answer_key
  explanation: (A) $10^{log 2}$＝2為有理數，故正確。 (B) 舉反例， 設x＝－1，$\frac{|-1|}{-1}$＝－1≠1，故錯誤。 (C) | x－1 |＝3x－2， ① 若x ≥ 1， ⇒ x－1＝3x－2 ⇒ 2x＝1 ⇒ x＝$\frac{1}{2}$ ( 不合 )。 ② 若x＜1， ⇒ －x＋1＝3x－2 ⇒ 4x＝3 ⇒ x＝$\frac{3}{4}$ ( 合 )。 由①②知解只有一個，故錯誤。 (D) | x－3 |－| x＋5 |＝7， 若－5 ≤ x ≤ 3， ⇒ 3－x－( x＋5 )＝7 ⇒ 2x＝－9 ⇒ x＝－$\frac{9}{2}$ ( 合 )，故錯誤。 (E) | x－3 |＋| x＋5 | ＝|－x＋3 |＋| x＋5 | ≥ | (－x＋3 )＋( x＋5 ) |＝8， 即 | x－3 |＋| x＋5 | 之min＝8，故正確。 故選(A)(E)。
