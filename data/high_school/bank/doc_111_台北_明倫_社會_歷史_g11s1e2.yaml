  stem: 資料一中，富蘭克林前往法國爭取支持，是因為美國正在進行哪一場戰爭？這場戰爭的起因為何？
  group_stem: '請閱讀以下二則資料，並回答問題：

    資料一：1777 年，班傑明．富蘭克林作為美國大使，前往巴黎爭取法國對戰爭的支持。引起法國人興趣的，除了他在科學研究上的貢獻之外，就是他頭上所戴的毛帽。富蘭克林刻意在巴黎留下戴河狸毛皮帽子的肖像畫，以符合法國人對於美洲的刻板印象，激發他們對於美國的好感。

    資料二：光是在 1775 年，英國就出口了超過十萬頂的河狸毛帽，從歐洲各國，到美洲、亞洲、非洲，全球各地的男人紛紛將來自北美洲森林的河狸戴上腦袋。

    46.1775 年，販售河狸毛帽的英國商人，最有可能前往下列哪個地方進行貿易？ (A)南非 (B)剛果 (C)鹿港 (D)長崎。'
  answer:
  - 美國獨立戰爭；殖民地與英國政府之間的賦稅問題
