  page: 1
  stem: 某電影有一段旁白：「假定一塊大陸永遠要由一個島嶼來支配，那是件荒謬的事。大自然在任何情況下都不會使衛星大於其主要的行星；由於英國和美洲就彼此間的關係而言，顛倒了大自然的通常秩序，所以它們屬於不同的體系，是很明顯的。英國屬於歐洲；美洲屬於她本身。……讓我們每一個人向鄰人伸出熱情的友誼之手……讓惠格黨和托利黨的名字滅絕；讓我們不是聽別人，而是聽誠實公民的話；他們是坦率、堅定的朋友，是人類權利和美洲自由、獨立的國家勇敢的擁護者。」請問這部電影的時空應是
  options:
  - label: A
    content: 1517 年宗教改革期間
  - label: B
    content: 1776 年鼓吹殖民地拋棄舊勢力
  - label: C
    content: 1810 年拿破崙戰爭期間
  - label: D
    content: 1815 年維也納會議
  answer:
  - B
  answer_status: verified
  answer_source: answer_key
  explanation: 這段電影旁白強調英國和美洲的關係是各自獨立，並說明「一塊大陸永遠要由一個島嶼來支配，那是件荒謬的事」，可推知此時美洲大陸的人們想要擺脫英國的控制，應為 18 世紀中葉的美國獨立運動，(B)為正解。
