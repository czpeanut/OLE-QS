  stem: 「穿上摺邊裙來打架！」是玻利維亞女子摔角「Cholita」的特色，是在十多年前由多位原住民女性推出主打「首次有女性上擂臺」為賣點的商業活動。「Cholita」是指穿著玻利維亞傳統摺邊裙和圓頂帽，綁著辮子上臺較勁，別具趣味，但是在過去「Cholita」具有貶抑意涵，人們以此來表達對玻利維亞原住民女性的輕蔑。選手們以「Cholita」裝扮上擂臺，除了強調以自己身分為傲外，可以表示他們感覺克服了社會加諸於自身的限制！玻利維亞的社會結構，深受其過往被殖民的歷史經驗所影響。請問上文中的「Cholita」文化最可能源自哪一層社會階級？
  options:
  - label: A
    content: 來自歐洲殖民地統治者：半島人
  - label: B
    content: 在當地出生的歐洲白人：克里奧爾人
  - label: C
    content: 歐洲與印第安人混血後裔：麥士蒂索人
  - label: D
    content: 被統治者：印第安人、黑人及其他混血者
  answer:
  - D
  answer_status: verified
  answer_source: answer_key
  explanation: 從 Cholita 一詞原是表達對玻利維亞原住民女性的輕蔑，今日當地選手卻以此身分為傲，可見此一名詞應源自玻利維亞當地社會底層的原住民階級，即(D)。
