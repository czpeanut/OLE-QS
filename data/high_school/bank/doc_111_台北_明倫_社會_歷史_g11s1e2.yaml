  stem: 猴痘的傳布反映非洲與世界各國的緊密交流，為因疾病而阻滯。不過綜觀歷史發展，在葡萄牙海外探險後，非洲內陸曾因疾病的流行，導致歐美與其交流範圍受限於沿岸，難以深入內陸，直到 19 世紀才改變。請問得以出現這種改變，與下列何者最有關聯？
  options:
  - label: A
    content: 克里米亞戰爭使列強結盟對抗，刺激各國競爭非洲殖民版圖
