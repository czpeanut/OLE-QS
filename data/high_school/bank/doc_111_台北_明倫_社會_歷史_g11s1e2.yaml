  stem: 某學者指出：鄂圖曼人希望在印度洋周邊建立伊斯蘭教保護國，因此在 16 世紀初期征服埃及作為紅海的門戶。此時葡萄牙的勢力已逐漸進入印度洋，雙方展開一系列的競爭。但情勢對鄂圖曼人而言較為不利，因為鄂圖曼海軍主要航行於地中海等較封閉的水域，不熟悉開闊水域。在一次進攻波斯灣入口荷莫茲海峽的戰役當中，鄂圖曼人遭到慘敗。雙方的競爭持續了約一個世紀，直到葡萄牙面對新的競爭對手為止。根據上述學者的觀點，下列敘述何者正確？
  options:
  - label: A
    content: 印度洋周邊發生的衝突是因宗教所引起的
