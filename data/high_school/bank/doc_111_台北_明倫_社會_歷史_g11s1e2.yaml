- id: doc_111_台北_明倫_社會_歷史_g11s1e2_s1_13
  section: 1
  number: 13
  type: single
  page: 3
  stem: 歐洲的著名藝術形式──佛朗明哥，其源於阿拉伯語，為「逃亡的農民」，意指當時的穆斯林農民為了避難，選擇混入吉普賽人中，才得以延續自身的舞蹈、歌唱等傳統藝術。請問當地穆斯林需要避難，最可能是面臨下列哪一個事件？
  options:
  - label: A
    content: 第一次十字軍運動
  - label: B
    content: 穆罕默德逃往麥地那
  - label: C
    content: 收復失地運動
  - label: D
    content: 蒙兀兒帝國的瓦解
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: '從題文的敘述，歐洲的穆斯林應是遭逢重大戰亂，才會選擇混入吉普賽人中，(A)(B)並未重創穆斯林，(D)非發生在歐洲，因此答案為(C)。

    14.14 世紀時，鄂圖曼帝國趁著歐洲處於戰事與黑死病交加之際，勢力迅速擴張，國勢已衰的拜占庭帝國首當其衝，因此失去了東方的領土，(C)為正解。

    15.(B)第四次十字軍東征時受威尼斯商人煽動，為了利益而掠奪君士坦丁堡，重創拜占庭帝國，更加深東西方教會的分裂。(D)東西方教會雖然分裂，但西方並未犯下「罪惡事件」。

    16.(A)帝國初期信奉伊斯蘭教。(B)蒙兀兒帝國統治者來自草原，屬於素尼派，並非激進的穆斯林。(C)未有此事。

    17.資料一為《羅蘭之歌》，描述羅蘭伯爵為拯救領主查理曼，自願斷後而犧牲生命的故事；資料二推崇騎士的戰功，從「拯救聖城」、「擊碎異教徒的骨」、「一切只為榮耀主」等線索，可知與十字軍東征有關。(A)資料一中，西班牙當地的異教徒為穆斯林，與資料二中的異教徒同一種宗教，是為正解。(B)資料一為 8 世紀，資料二為 11 世紀後。(C)(D)僅資料二。

    18.題文所述為 1884 年確立瓜分非洲「有效占領」原則的柏林會議，主導者為(A)德國的俾斯麥。

    19.一次大戰前，甲國工業排名第三，但殖民地面積最大，應為英國；乙國工業排名第四，殖民地僅次於甲國，故為法國；丙國工業排名超過甲國，殖民地面積卻遠不如甲乙，應為較晚發展帝國主義的德國；丁國工業排名第一，殖民地面積卻最小，故為美國，(C)為正解。

    20.從商品內容可推斷甲為歐洲、乙為美洲、丙為非洲，因此按「歐洲輸出、交換或生產、再輸入歐洲」的先後順序應是(A)甲、丙、乙。

    21.資料一中，所有參戰國家都認為這是場短暫的戰爭，資料二中，戰壕裡的英國士兵卻唱著想要回家的歌曲，足見戰事的發展遠超出預期，且讓人有看不到終點的哀傷與絕望，(A)為正解。(B)資料二寫英國士兵，屬於西線戰場。(C)(D)兩則資料皆看不出此一訊息。

    22.克里米亞戰爭發生於 1853 ～ 1856 年，為工業革命後第一場現代化戰爭，當時所擁有的最先進技術為(D)電報。(A)(B)(C)皆為 20 世紀後的科技。

    23.(A)奧瑪亞王朝於 750 年即被阿拔斯等人推翻。(C)鄂圖曼帝國於 1453 年攻陷君士坦丁堡。(D)阿克巴在位時推行宗教寬容政策，緩和宗教紛爭以促進民族和諧。

    24.自從 1884 年柏林會議確立瓜分非洲的「有效占領」原則後，(B)列強更加積極占領行動，廣大的非洲在十年間即遭列強瓜分殆盡。

    25.(甲)依然堅持圍堵德國，應為視德國為世仇的法國；(乙)採行孤立主義策略，故為美國；(丙)為振興經濟而打算修改對德和約，最可能為英國，(A)為正解。俄國退出一次大戰，並未簽署《凡爾賽和約》，不屬於題文的協約國家。

    26.英國最早有工人運動，起初工人們尚未有團體意識，抗爭活動也是零星且小規模，無明顯的政治特色。1820 年代已凝聚團體意識，成立工會向資方爭取權益。1838 年發表《人民憲章》，提出成年男性普選權、祕密投票等訴求，開啟「憲章運動」，並透過群眾連署與請願活動向國會議員施壓，(A)為正解。英國並不接受馬克思的思想，也未如馬克思所預言的爆發無產階級革命，不曾有過(丁)現象。

    27.此時期的法國雖有「共和」名號，卻有許多人因內戰或其他原因而罹難，因此最可能為實施恐怖統治的(C)國民公會時期。(A)(B)為實施君主立憲。(D)雖也實施共和，但已無恐怖統治，無太多人死於非命。

    28.題文說明前往非洲沿岸的商業路線日益熱絡，鑽石與黃金更促擁著資本家前進，尤其在 1884 年柏林會議確立瓜分非洲的「有效占領」原則後，使列強更積極擴大在非洲的勢力，此即為(B)非洲大獵。

    29.資料一提及奧匈帝國王儲被暗殺事件，此為一次大戰的導火線；資料二說明德國國內政局的變化，新德皇的外交政策使德國變得更具威脅性而開始樹敵，此也是日後德國被視為引發大戰的禍首之因，(C)為正解。

    30.從「年輕人不斷流失」、「向種植園開去」等線索，可推知「黑金」應指(A)黑奴。

    31.地理大發現後，非洲的黑奴主要賣至(A)美洲。

    32.1683 年鄂圖曼土耳其帝國進逼(B)奧地利的維也納，後被奧地利與波蘭聯軍擊退。

    33.鄂圖曼土耳其帝國在 16 世紀中葉後，國力達到最巔峰，經此一役戰敗後，結束帝國在歐洲的擴張，從此國力逐漸衰敗，(D)為正解。塞爾柱土耳其帝國的年代為 11 ～ 12 世紀末。

    34.圖中英國男子挽著三色旗裝的女子，代表英法結盟之意，轉身背對德國代表英國與德國對立之意，選項中僅(B)一次大戰前歐洲的結盟衝突符合此一情況。(A)德國（普魯士）未參與此戰爭。(C)法國國內的革命，無其他國家結盟或衝突。(D)英法皆為戰勝國，聯合對德國提出嚴苛的條約要求，不符合「走開」之意。

    35.《法俄協約》聯合突破德國的封鎖，此為(B)第一次世界大戰前「三國同盟」與「三國協約」陣營互相對峙的背景。

    36.(A)德義兩國在統一之路上曾經互助，如俾斯麥曾邀請義大利參與普奧戰爭。(C)學習其他人的經驗，不能解讀為無外交天分。(D)聯盟教訓使德國更重視壯大自身軍事實力。

    37.(B)由於美洲開採的白銀大量運往歐洲，更加速歐洲商業資本主義的發展。(D)全球性的航海冒險發生於科學革命之前。

    38.(D)伊斯蘭教的真理亦來自「上帝」，即真主阿拉。(E)《古蘭經》為穆罕默德傳達阿拉的教誨集結成冊，被穆斯林視為阿拉的訓示。

    39.甲主張孤立法國、與俄交好、不得罪英國，故為俾斯麥的外交政策；乙推行大海軍計畫，積極擴張殖民地，應為德皇威廉二世的主張，(B)(D)(E)為正解。(A)應是第一次大戰前德國的對外策略。(C)甲是俾斯麥，乙是威廉二世。

    40.(C)衰廢市鎮的代表權取消，為 1832 年的改革。(D) 1884 年的改革，讓大部分成年男子皆獲得選舉權，非只有農民。(E) 19 世紀的改革僅限男子，婦女直到 20 世紀後才獲得選舉權。

    41.根據資料一整理歷次召開三級會議的原因中，並沒有(D)國王欲立定國家王儲這項。

    42.原先三級會議的計票方式是一階級一票，平民階級面對教士階級與貴族階級的聯合陣線，可說是毫無勝算可言，因此才會要求召開國民會議，讓每一代表皆擁有獨立完整的一票。

    43.資料一中□□傳入歐洲在 8 ～ 11 世紀，因此與(B)阿拉伯人的移動最有關聯。(A) 13 世紀。(C) 11 世紀。(D) 15 世紀。

    44.□□能點醒我們甜的味蕾，故為糖；「瓊漿玉液」能令人微醺，故為酒（酒精）。

    45.資料一提到「當時信奉伊斯蘭教的柏柏人（西北非地區族群）才開始將□□引入西歐，並逐漸進入英倫島嶼」；資料二則有「隨著穆斯林的擴張與傳遞」一句，兩者提到的東西都與穆斯林有關，因此勾選「穆斯林與物種的傳播」。

    46.1775 年時，英國已占有(A)南非為殖民地，因此極可能成為英國商人的貿易市場。(B)此時歐人對非洲內陸仍處未知狀態。(C)清治前期的臺灣只能與中國大陸貿易。(D)此時日本正值鎖國期間，歐洲僅荷蘭人可至長崎貿易。

    47.1777 年正值美國獨立戰爭期間，起因於殖民地人民不滿英國政府強徵新稅而發動抗爭，最後演變成獨立戰爭。'
