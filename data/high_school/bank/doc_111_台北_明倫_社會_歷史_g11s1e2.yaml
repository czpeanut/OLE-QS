  stem: 「一開始征服者並未強迫被降服的部落改宗，反而相當靈活、充分地利用這些被征服之地的富裕與文明。甚至如果有人想要改信伊斯蘭教，是要受鞭刑的。因為，只有非穆斯林要納稅，穆斯林不用納稅，怎麼可能會有統治者想要減少稅收呢？」法國東方學家維特評論道：「被占領的各國人民能保有他們的生活方式，不受干擾。不過，他們像是被當作高等牲畜對待、受到良好的照顧，因為他們是稅收的主要來源。」請問上述資料中的統治者之統治策略應為下列何者？
  options:
  - label: A
    content: 初期實施寬容政策，後期才為了方便統治而強制改宗
  - label: B
    content: 以經濟手段強迫統治區域所有人民皆須改信伊斯蘭教
  - label: C
    content: 為了經濟利益而選擇宗教寬容政策，甚至不鼓勵改宗
  - label: D
    content: 對所有人民一視同仁，未在宗教方面加以限制或管理
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: 此國家統治者規定穆斯林不用納稅，但又尊重境內各民族原有的生活方式與宗教信仰，僅以收稅作為統治的目的，因此可推知為鄂圖曼帝國，(C)為正解。(A)後期也未強制人民改宗。(B)未有此事。(D)穆斯林不用納稅，非穆斯林要納稅，因此並非一視同仁。
