  stem: 「某社會主義者提出一套相對溫和的社會進化原則，他們認為社會的發展和進化，是要順應著常態，在既有的基礎上演進，整個社會才能圓滿的緩步向前。如果用突然的、過於激烈的方式進行改革，必定會因衝突、損害而大傷元氣……。社會主義不僅不限制成員的活動，甚至樂見成員們進入政府部門任職，或者在社會上其他領域任事：工業家、大學校長、主教等。也可以直接加入同意接受他們的團體，以便透過這些途徑，把社會主義思想灌輸給那些能影響政局發展的關鍵人物，滲透進能直接採取行動的社會團體，然後爭取選票，取得議會多數席次，……用和平的立憲辦法來實現社會主義。」請問上文中所揭示的是 19 世紀何種社會主義的見解？
  options:
  - label: A
    content: 烏托邦社會主義
  - label: B
    content: 馬克思社會主義
  - label: C
    content: 費邊社會主義
  - label: D
    content: 民主社會主義
  answer:
  - C
  answer_status: verified
  answer_source: answer_key
  explanation: (C)費邊社會主義主張以漸進溫和的方式改善勞工的不合理待遇，透過國會立法改革、組織政黨與選舉投票等方式改造社會。(A)肯定人性本善，以經濟互助方式。(B)鼓動無產階級發動階級革命。(D)將民主憲政與社會主義結合的意識型態，屬於中間偏左的路線。
