<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLE 題庫登入</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e1e4e9;--ink:#1b1f24;--muted:#687280;--accent:#2563c9;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#13161a;--panel:#1b1f25;--line:#2b3139;--ink:#e5e8ec;--muted:#99a2ae;--accent:#6aa2f2;--bad:#f07a70}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,sans-serif}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:20px}input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:inherit}
button{padding:9px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.err{color:var(--bad);font-size:13px}
</style></head>
<body><form method="post" action="/api/login">
<h1>OLE 題庫組卷</h1><div style="color:var(--muted);font-size:13px">請輸入通行碼</div>
<input type="password" name="code" autofocus required autocomplete="current-password">
<div class="err" id="err" hidden>通行碼不正確</div>
<button>進入</button>
</form>
<script>if (location.search.includes("err")) document.getElementById("err").hidden = false</script>
</body></html>
