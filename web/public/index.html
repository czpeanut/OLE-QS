<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLE 題庫組卷</title>
<meta name="theme-color" content="#2547a8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* 版面概念：方格紙桌面上攤著一張張「考卷」──鋼筆藍為主色、紅筆為重點色；
   左側範圍與章節、右側工具列與分段題目，底部常駐題籃列 */
:root{
  --desk:#eef1f6; --grid:rgba(37,71,168,.055); --paper:#fff; --sunk:#f5f7fb; --line:#dde2ec; --line-strong:#c6cddb;
  --ink:#131a2c; --ink-2:#384160; --muted:#69728a;
  --accent:#2547a8; --accent-2:#3a5fd0; --accent-ink:#fff; --accent-soft:#e8edfb; --accent-line:#b7c5ef;
  --pen:#d03b28; --pen-soft:#fdebe7;
  --ok:#17784a; --ok-soft:#e3f3ea; --warn:#a85410; --warn-soft:#fcefe1; --bad:#c0321f; --bad-soft:#fcebe8;
  --shadow:0 1px 1px rgba(19,26,44,.04),0 2px 6px rgba(19,26,44,.05);
  --shadow-lift:0 6px 18px rgba(19,26,44,.10),0 2px 4px rgba(19,26,44,.06);
  --radius:14px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  /* 介面版色（題籃列、提示）：深色紙上白字 */
  --chrome:#141b30; --chrome-ink:#f3f5fb;
}
@media (prefers-color-scheme:dark){:root{
  --desk:#0f131c; --grid:rgba(140,165,235,.05); --paper:#171c28; --sunk:#131823; --line:#283044; --line-strong:#38415a;
  --ink:#e8ebf3; --ink-2:#c3c9da; --muted:#949db4;
  --accent:#8aa6f5; --accent-2:#a8bdf8; --accent-ink:#0d1426; --accent-soft:#1c2642; --accent-line:#34487f;
  --pen:#ff7a66; --pen-soft:#3a1d19;
  --ok:#5cc08b; --ok-soft:#15291f; --warn:#e8a565; --warn-soft:#2d2216; --bad:#f2806f; --bad-soft:#331c19;
  --shadow:none; --shadow-lift:0 6px 20px rgba(0,0,0,.35);
  --chrome:#e8ebf3; --chrome-ink:#121829;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:76px}
body{margin:0;font:15px/1.65 var(--sans);color:var(--ink);background-color:var(--desk);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}

/* ── 動畫 ── */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(104%)}to{transform:none}}
@keyframes slideUp{from{transform:translateY(120%)}to{transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,30)}to{stroke-dashoffset:0}}
@keyframes inkLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes deal{from{opacity:0;transform:translateY(-14px) rotate(-2.5deg) scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sk{to{background-position:-200% 0}}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-14deg)}60%{opacity:1;transform:scale(.94) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg)}}
.anim-rise{animation:rise .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── 頂列 ── */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;padding:0 22px;height:60px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);animation:fade .4s both}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.06em;white-space:nowrap;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.brand small{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:12.5px;letter-spacing:.02em}
nav.tabs{position:relative;display:flex;gap:2px;height:100%}
nav.tabs button,nav.tabs a{position:relative;border:0;background:none;padding:0 15px;color:var(--muted);font-weight:700;font-size:14.5px;
  display:flex;align-items:center;text-decoration:none;white-space:nowrap;transition:color .2s}
nav.tabs button:hover,nav.tabs a:hover{color:var(--ink)}
nav.tabs button.on{color:var(--accent)}
.tab-ink{position:absolute;bottom:-1px;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);
  transition:transform .35s var(--ease),width .35s var(--ease);pointer-events:none}
.badge-n{margin-left:6px;min-width:21px;padding:0 6px;border-radius:99px;background:var(--pen);color:#fff;font-size:12px;line-height:21px;text-align:center;font-variant-numeric:tabular-nums;display:inline-block}
.bump{animation:bump .45s var(--ease)}
#stat{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  header{gap:6px;padding:0 10px;height:54px}
  .brand{font-size:16.5px;gap:7px}.brand svg{width:26px;height:26px}
  .brand small,#stat,.lg{display:none}
  nav.tabs{flex:1;justify-content:flex-end}
  nav.tabs button,nav.tabs a{padding:0 9px;font-size:14px}
}

main{max-width:1340px;margin:0 auto;padding:20px 22px 104px}
@media (max-width:760px){main{padding:12px 12px 100px}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}

/* 開場橫幅（桌面） */
.hero{display:flex;align-items:center;gap:20px;padding:16px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 160px at 85% 0%,var(--accent-soft),transparent 70%);pointer-events:none}
.hero h1{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.04em;position:relative}
.hero h1 em{font-style:normal;color:var(--pen);position:relative}
.hero h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:1px;height:7px;background:var(--pen-soft);z-index:-1;transform-origin:left;animation:inkLine .7s .5s var(--ease) both}
.hero p{margin:2px 0 0;color:var(--muted);font-size:13.5px;position:relative}
.hero .stats{margin-left:auto;display:flex;gap:26px;position:relative}
.hero .stat b{display:block;font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.hero .stat span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hero .art{width:74px;height:62px;flex:none;position:relative;animation:floaty 6s ease-in-out infinite}
@media (max-width:960px){.hero{display:none}}

/* 按鈕 */
.btn{border:1px solid var(--line-strong);background:var(--paper);border-radius:10px;padding:6px 13px;font-size:14px;line-height:1.4;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.06);background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px;box-shadow:none}
.btn.link:hover{text-decoration:underline;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
select,input[type=text],input[type=number],input[type=search]{padding:7px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);font-size:14px;width:100%;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* 分段按鈕（科目、冊別、版本、作答形式、難度） */
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:5px 12px;font-size:14px;color:var(--ink-2);white-space:nowrap;
  transition:background .2s,border-color .2s,color .2s,transform .1s}
.seg button:hover{border-color:var(--accent-line);color:var(--ink)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 28%,transparent)}
.seg.fill button{flex:1;padding-inline:4px}
.seg.books{display:grid;grid-template-columns:repeat(3,1fr)}

/* ── 選題：兩欄 ── */
.layout{display:grid;grid-template-columns:304px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:80px;max-height:calc(100vh - 98px);overflow:auto;padding:18px;animation:rise .5s .05s var(--ease) both;scrollbar-width:thin}
@media (max-width:960px){.side{position:static;max-height:none}}
.side h3{margin:0 0 7px;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.side .grp-s{display:grid;gap:7px;margin-bottom:16px}
.side hr{border:0;border-top:1px dashed var(--line-strong);margin:4px 0 14px}
.side-toggle{display:none}
.side-done{display:none}
@media (max-width:960px){
  .side{padding:12px 14px}
  .side-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:0;font-weight:700;font-size:15px;text-align:left}
  .side-toggle .chg{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
  .side.closed .side-body{display:none}
  /* 手機：範圍與章節開成全螢幕面板，底部「完成」直接回到題目 */
  .side:not(.closed){position:fixed;inset:0;z-index:60;border-radius:0;max-height:none;overflow:auto;padding:0 16px 92px;border:0;animation:slideUp .32s var(--ease)}
  .side:not(.closed) .side-toggle{position:sticky;top:0;z-index:2;background:var(--paper);width:calc(100% + 32px);margin:0 -16px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .side:not(.closed) .side-done{display:block;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
  .side-done .btn{width:100%;padding:12px;font-size:15px}
  .unit,.pats label{padding-block:7px}
  .seg button{padding-block:8px}
}
.units-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.units-head h3{margin:0}
.units-head .sp{flex:1}
.units-head label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.unit-ch{font-family:var(--serif);font-size:12.5px;color:var(--ink-2);margin:14px 0 3px;font-weight:700;padding-left:2px}
.unit{position:relative;display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.45;overflow-wrap:anywhere;transition:background .15s}
.unit:hover{background:var(--sunk)}
.unit:has(input:checked){background:var(--accent-soft)}
.unit:has(input:checked)::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent);animation:inkLine .3s var(--ease);transform-origin:top}
.unit input{margin-top:2px;flex:none}
.unit .code{flex:none;color:var(--muted);font-size:12px;min-width:3.2em;white-space:nowrap;padding-top:1px;font-variant-numeric:tabular-nums}
.unit .c,.pats .c{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.unit.zero{opacity:.45}
.pats{margin:3px 0 10px 22px;padding-left:9px;border-left:2px dotted var(--accent-line);display:grid;gap:1px;animation:rise .3s var(--ease) both}
.pats label{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.45;cursor:pointer;padding:3px 5px;border-radius:7px;transition:background .15s}
.pats label:hover{background:var(--sunk)}
.pats label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.pats input{margin-top:2px;flex:none;width:14px;height:14px}
.pats .hint{font-size:11.5px;color:var(--muted);padding:2px 5px;letter-spacing:.06em}

/* ── 工具列 ── */
.tools{padding:16px 18px;display:grid;gap:13px;animation:rise .5s .12s var(--ease) both}
.search{position:relative}
.search input{padding-left:40px;height:44px;font-size:15px;border-radius:12px;background:var(--sunk);border-color:var(--line)}
.search input:focus{background:var(--paper)}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--muted);transition:color .15s}
.search:focus-within svg{color:var(--accent)}
.trow{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.tgrp{display:flex;align-items:center;gap:9px}
.tgrp > span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;letter-spacing:.08em}
.more{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;padding-top:11px;border-top:1px dashed var(--line)}
.more label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.more select{width:auto;padding:4px 8px;font-size:13px}
.more-toggle{display:none}
@media (max-width:760px){
  .tools{padding:11px 12px;gap:9px}
  .search input{height:40px}
  .search svg{top:11px}
  /* 作答形式、難度各一列，按鈕縮小 */
  .trow{gap:8px}
  .tgrp{width:100%}
  .tgrp > span{font-size:12px;width:4.6em;flex:none}
  .tgrp .seg{flex-wrap:nowrap;flex:1}
  .tgrp .seg button{flex:1;padding:6px 0;font-size:13.5px}
  .more-toggle{margin-left:auto;font-size:13px;padding:4px 10px}
  .actives{order:5;width:100%}
  .more-toggle{display:inline-flex}
  .more{display:none}
  .tools.open .more{display:flex;animation:rise .25s var(--ease)}
  .rbar{margin:12px 2px 6px}
  .rbar .btn{padding:4px 9px;font-size:13px}
  .rbar #total{font-size:18px}
  .cbar .btn.link{font-size:13px;padding:4px 4px}
  .cbar h3{font-size:14px}
  #sortnote{display:none}
  .q{padding:13px 13px 11px}
  .stem{font-size:16px}
  .qtop .tag:not(.ok):not(.ai):not(.bad){display:none}
}

/* ── 結果列 ── */
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:18px 2px 10px}
.rbar #total{font-family:var(--serif);font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rbar .sp{flex:1}
.actives{display:flex;flex-wrap:wrap;gap:6px}
.actives button{border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 11px;font-size:12.5px;font-weight:600;animation:rise .25s var(--ease) both;transition:background .15s}
.actives button::after{content:" ×";opacity:.65}
.actives button:hover{background:var(--paper)}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.btn.rand{display:inline-flex;align-items:center;gap:6px;border-color:var(--pen);color:var(--pen);font-weight:700;background:var(--paper)}
.btn.rand:hover{background:var(--pen-soft);border-color:var(--pen)}
.btn.rand svg{width:16px;height:16px;transition:transform .5s var(--ease)}
.btn.rand:hover svg{transform:rotate(180deg)}
.spin svg{animation:spin .8s linear infinite}

/* ── 題目清單 ── */
.sec-h{position:relative;display:flex;align-items:baseline;gap:10px;margin:26px 2px 10px;font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.06em}
.sec-h:first-child{margin-top:6px}
.sec-h::after{content:"";position:absolute;left:0;bottom:-4px;width:46px;height:3px;border-radius:2px;background:var(--pen);transform-origin:left;animation:inkLine .6s var(--ease) both}
.sec-h small{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:12.5px;letter-spacing:0}
.sub-h{margin:16px 2px 8px;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.sub-h::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.q{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px 12px 22px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;
  transition:border-color .2s,box-shadow .25s,transform .25s var(--ease);animation:rise .45s var(--ease) backwards;animation-delay:calc(var(--i,0) * 40ms)}
/* 考卷左側的裝訂線 */
.q::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:0;border-left:2px dotted var(--line);transition:border-color .2s}
.q:hover{border-color:var(--line-strong);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.q.sel{border-color:color-mix(in srgb,var(--pen) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--pen) 45%,transparent) inset,var(--shadow)}
.q.sel::before{border-left:3px solid var(--pen)}
/* 紅筆打勾 */
.q .mark{position:absolute;right:16px;bottom:10px;width:46px;height:40px;pointer-events:none;opacity:0}
.q.sel .mark{opacity:1}
.q.sel .mark path{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw .45s var(--ease) both}
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.qno{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:1.8em}
.qno::after{content:"."}
.qtop .sp{flex:1}
.add{position:relative;border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:99px;padding:3px 14px;font-size:13px;font-weight:700;white-space:nowrap;
  transition:background .2s,color .2s,border-color .2s,transform .1s}
.add:hover{background:var(--accent-soft)}
.add:active{transform:scale(.94)}
.q.sel .add{background:var(--pen);border-color:var(--pen);color:#fff}
.stem{font-family:var(--serif);font-size:16px;line-height:1.85;overflow-wrap:anywhere;font-weight:500}
.passage{position:relative;font-family:var(--serif);font-size:14.5px;line-height:1.8;color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:10px 14px;margin-bottom:9px;max-height:7.6em;overflow:hidden;border:1px solid var(--line);transition:max-height .35s var(--ease)}
.passage.open{max-height:4000px}
.passage .more-btn{position:absolute;right:0;bottom:0;left:0;text-align:right;padding:20px 12px 5px;background:linear-gradient(to bottom,transparent,var(--sunk) 55%);border:0;color:var(--accent);font-family:var(--sans);font-size:12.5px;font-weight:700}
.passage.open .more-btn{position:static;background:none;padding:4px 0 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;margin-top:7px;font-family:var(--serif);font-size:15px}
.opts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.opts.c1{grid-template-columns:1fr}
@media (max-width:640px){.opts.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opts img,.q figure img{max-width:100%;max-height:220px;background:#fff;border-radius:6px}
.opts img{display:block;object-fit:contain}
.q figure{margin:8px 0}
.ans{display:inline-block;margin-top:9px;color:var(--pen);background:var(--pen-soft);border-radius:8px;padding:2px 10px;font-weight:700;font-size:13.5px;animation:rise .3s var(--ease) both}
.qfoot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);padding-right:52px}
.tag{border:1px solid var(--line);border-radius:99px;padding:0 9px;color:var(--muted);white-space:nowrap;line-height:1.75}
.tag.u{color:var(--accent);border-color:var(--accent-line);background:var(--paper)}
.tag.p{color:var(--ink-2);background:var(--sunk);border-color:transparent}
.tag.ok{color:var(--ok);border-color:transparent;background:var(--ok-soft)}
.tag.ai{color:var(--warn);border-color:transparent;background:var(--warn-soft)}
.tag.bad{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
/* 難度：答案卡的劃記格 */
.diff{display:inline-flex;align-items:center;gap:3px;font-weight:700;white-space:nowrap}
.diff i{width:10px;height:6px;border-radius:50%;border:1px solid var(--line-strong);background:transparent}
.diff.d1{color:var(--ok)}.diff.d2{color:var(--warn)}.diff.d3,.diff.d4,.diff.d5{color:var(--bad)}
.diff i.f{background:currentColor;border-color:currentColor}
.diff b{margin-left:4px;font-weight:700}
.pager{display:flex;justify-content:center;align-items:center;gap:5px;margin:22px 0;flex-wrap:wrap}
.pager button{min-width:38px}
.pager button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.empty{text-align:center;padding:56px 20px;color:var(--muted);animation:rise .4s var(--ease) both}
.empty svg{width:120px;height:96px;display:block;margin:0 auto 12px;animation:floaty 5s ease-in-out infinite}
.empty b{display:block;color:var(--ink-2);font-family:var(--serif);font-size:17px;margin-bottom:4px}
.skel{height:132px;border-radius:var(--radius);background:linear-gradient(90deg,var(--paper),var(--sunk),var(--paper));background-size:200% 100%;animation:sk 1.2s infinite linear;margin-bottom:12px;border:1px solid var(--line)}

/* 數式 */
.math sup,.math sub{font-size:.72em}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 .15em}
.frac .num{border-bottom:1px solid currentColor;padding:0 .3em}.frac .den{padding:0 .3em}
.ovl,.sqrt{border-top:1px solid currentColor}
.ovarr{display:inline-flex;flex-direction:column;align-items:center;line-height:1}.ovarr .arr{font-size:.7em}

/* ── 底部題籃列 ── */
.basket{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:14px;
  background:var(--chrome);color:var(--chrome-ink);border-radius:16px;padding:9px 10px 9px 16px;box-shadow:0 12px 32px rgba(10,16,34,.28);max-width:calc(100vw - 24px);
  animation:slideUpC .4s var(--ease) both}
@keyframes slideUpC{from{transform:translate(-50%,140%)}to{transform:translate(-50%,0)}}
.basket .n{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap;cursor:pointer}
.basket .n svg{width:22px;height:22px;flex:none}
.basket .n #b-n{display:inline-block;color:var(--pen);font-family:var(--serif);font-size:19px;font-weight:900;min-width:1ch;text-align:center}
.basket .mix{font-size:12.5px;opacity:.75;white-space:nowrap}
.basket .btn{border-radius:11px}
.basket .btn.view{background:transparent;color:var(--chrome-ink);border-color:color-mix(in srgb,var(--chrome-ink) 30%,transparent)}
.basket .btn.view:hover{background:color-mix(in srgb,var(--chrome-ink) 12%,transparent)}
@media (max-width:430px){.basket .mix{display:none}.basket{gap:8px}}
@media (max-width:760px){
  .basket{left:8px;right:8px;transform:none;bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-between;padding:8px 8px 8px 12px;animation:slideUp .4s var(--ease) both}
  .basket .mix{font-size:12px}
}
/* 加入題籃時飛向題籃的小紙片 */
.fly{position:fixed;z-index:80;width:26px;height:32px;border-radius:4px;background:var(--paper);border:1.5px solid var(--pen);box-shadow:0 4px 12px rgba(0,0,0,.18);pointer-events:none;
  display:grid;place-items:center;color:var(--pen);font-weight:900;font-size:14px}

/* ── 側邊面板（已選題目、隨機選題）：桌面從右側滑出，手機全螢幕 ── */
.drawer-bg{position:fixed;inset:0;z-index:70;background:rgba(10,14,28,.38);backdrop-filter:blur(2px);animation:fade .25s both}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:71;width:min(460px,100vw);background:var(--paper);border-left:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:-12px 0 36px rgba(10,16,34,.2);animation:slideIn .38s var(--ease) both}
.drawer header{position:static;height:auto;padding:16px 18px;gap:10px;border-bottom:1px solid var(--line);background:none;backdrop-filter:none;animation:none}
.drawer header h2{margin:0;font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.04em}
.drawer header .mixtext{margin:2px 0 0;font-size:12.5px}
.drawer header .x{margin-left:auto;border:0;background:var(--sunk);border-radius:10px;width:36px;height:36px;font-size:19px;line-height:1;color:var(--muted);transition:background .15s,transform .2s}
.drawer header .x:hover{background:var(--line);transform:rotate(90deg)}
.drawer .dlist{flex:1;overflow:auto;padding:6px 10px}
.drawer .di{display:grid;grid-template-columns:28px minmax(0,1fr) 34px;gap:8px;align-items:start;padding:11px 8px;border-bottom:1px dashed var(--line);animation:rise .35s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms)}
.drawer .di.deal{animation:deal .45s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
.drawer .di .no{font-family:var(--serif);color:var(--ink-2);font-weight:900;font-variant-numeric:tabular-nums;padding-top:1px}
.drawer .di .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.drawer .di .txt{font-family:var(--serif);font-size:14.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.drawer .di .rm{border:0;background:none;color:var(--muted);font-size:16px;width:34px;height:34px;border-radius:9px;transition:background .15s,color .15s}
.drawer .di .rm:hover{background:var(--bad-soft);color:var(--bad)}
.drawer .dfoot{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--sunk)}
.drawer .dfoot .primary{flex:1;padding:10px}
.drawer .dempty{padding:56px 20px;text-align:center;color:var(--muted)}
@media (max-width:760px){.drawer{width:100vw;border-left:0;animation:slideUp .38s var(--ease) both}}
.rform{padding:16px 18px;display:grid;gap:16px;border-bottom:1px solid var(--line)}
.rform h3{margin:0 0 7px;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.rscope{font-size:14px;line-height:1.6;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.rscope small{display:block;color:var(--muted);font-size:12px}
.rcount{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rcount input{width:80px;text-align:center;font-family:var(--serif);font-weight:900;font-size:18px;padding:5px}
.rform .seg button{font-size:13px}
.rform label.ck{display:flex;gap:7px;align-items:center;font-size:14px}
#r-go{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;font-size:15px}
#r-go svg{width:18px;height:18px}
.rnote{padding:9px 18px;font-size:13px;color:var(--warn);background:var(--warn-soft)}
.rpool{padding:10px 18px 0;font-size:12.5px;color:var(--muted)}

/* ── 組卷匯出 ── */
.compose{display:grid;grid-template-columns:430px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.compose{grid-template-columns:minmax(0,1fr)}}
.cside{display:flex;flex-direction:column;gap:14px}
.cside > *{animation:rise .45s var(--ease) both}
.cside > *:nth-child(2){animation-delay:.06s}.cside > *:nth-child(3){animation-delay:.12s}
.cside .card{padding:18px}
.cside h3{margin:0 0 10px;font-family:var(--serif);font-weight:900;font-size:16px}
details.settings > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:var(--serif);font-weight:900;font-size:17px;margin-bottom:12px}
details.settings > summary::-webkit-details-marker{display:none}
details.settings > summary::after{content:"收合";font-family:var(--sans);font-size:12.5px;color:var(--accent);font-weight:700}
details.settings:not([open]) > summary{margin-bottom:0}
details.settings:not([open]) > summary::after{content:"展開"}
details.settings[open] .form{animation:rise .3s var(--ease)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.form .full{grid-column:1/-1}
.form .check{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-weight:500;font-size:14px;letter-spacing:0}
.form .seg button{flex:1;font-size:13px;padding:6px 4px}
.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cbar .sp{flex:1}
.items{max-height:52vh;overflow:auto;border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:28px 1fr 58px 70px;gap:6px;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px;animation:rise .3s var(--ease) both}
.it > .muted{font-family:var(--serif);font-weight:900}
.it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ty{color:var(--muted);font-size:11.5px}
.it input{padding:3px 5px;font-size:13px;text-align:center}
.it .ops{display:flex}
.it .ops button{border:0;background:none;color:var(--muted);padding:3px 5px;border-radius:6px;transition:background .15s,color .15s}
.it .ops button:hover{color:var(--ink);background:var(--sunk)}
.mixbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--sunk);margin:4px 0 10px}
.mixbar i{display:block;transform-origin:left;animation:inkLine .6s var(--ease) both}
.mixbar .e{background:var(--ok)}.mixbar .m{background:var(--warn);animation-delay:.1s}.mixbar .h{background:var(--bad);animation-delay:.2s}
.mixtext{font-size:12.5px;color:var(--muted);margin-top:-4px;margin-bottom:8px}
.actions{display:flex;gap:8px}
.actions .btn{padding:9px 16px}
@media (max-width:1000px){
  /* 手機與平板：已選題目在最上面，設定可收合，輸出按鈕固定在底部 */
  .cside .card.picked{order:-1}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));animation:slideUp .4s var(--ease) both}
  .actions .btn{flex:1;padding:11px}
  .preview{position:static}
  .preview iframe{height:75vh}
  .it{grid-template-columns:22px 1fr 52px 66px}
}
.preview{position:sticky;top:80px;animation:rise .5s .1s var(--ease) both}
.preview .cbar strong{font-family:var(--serif);font-weight:900;font-size:16px}
.preview iframe{width:100%;height:calc(100vh - 146px);border:1px solid var(--line);border-radius:var(--radius);background:#e9ebee;box-shadow:var(--shadow-lift)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:var(--chrome);color:var(--chrome-ink);padding:9px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:90;opacity:0;
  transition:opacity .25s,transform .35s var(--ease);pointer-events:none;box-shadow:0 8px 24px rgba(10,16,34,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list td,table.list th{padding:12px 14px;border-bottom:1px dashed var(--line);text-align:left}
table.list th{font-size:11.5px;color:var(--muted);letter-spacing:.08em;border-bottom-style:solid}
table.list tr{animation:rise .35s var(--ease) both}
table.list td:first-child{font-family:var(--serif);font-weight:700}
.tblwrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="3" width="19" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" transform="rotate(9 17 15)"/><rect x="5" y="5" width="19" height="24" rx="3" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.8"/><path d="M9 11.5h11M9 15.8h11M9 20.1h6" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" opacity=".5"/><path d="M15.5 21.8l3.3 3.3 8.2-9.4" fill="none" stroke="var(--pen)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>OLE 題庫</span><small>選題組卷</small></a>
  <nav class="tabs">
    <button data-tab="pick" class="on"><span class="lg">題庫</span>選題</button>
    <button data-tab="compose">組卷<span class="lg">匯出</span><span class="badge-n" id="cnt">0</span></button>
    <button data-tab="papers"><span class="lg">我的</span>試卷</button>
    <a href="/review">審題<span class="lg">台</span></a>
    <span class="tab-ink" id="tab-ink"></span>
  </nav>
  <span id="stat"></span>
</header>

<main>
<!-- ───── 題庫選題 ───── -->
<section id="tab-pick">
  <div class="layout">
    <aside class="card side closed" id="side">
      <button class="side-toggle" id="side-toggle" aria-expanded="false"><span id="side-sum">範圍與章節</span><span class="chg">更改範圍</span></button>
      <div class="side-body">
        <div class="grp-s"><h3>科目</h3><div class="seg fill" id="f-subject"></div></div>
        <div class="grp-s" id="w-sub"><h3>分科</h3><div class="seg" id="f-sub"></div></div>
        <div class="grp-s"><h3>冊別</h3><div class="seg books" id="f-book"></div></div>
        <div class="grp-s" id="w-pub"><h3>版本</h3><div class="seg fill" id="f-pub"></div></div>
        <hr>
        <div class="units-head"><h3 id="units-title">章節</h3><span class="sp"></span>
          <button class="btn link" id="u-all" style="font-size:12.5px">全部</button>
          <label><input type="checkbox" id="u-hide0" checked>隱藏 0 題</label></div>
        <div class="muted" style="font-size:12px;margin-bottom:2px" id="u-note"></div>
        <div id="units"></div>
      </div>
      <div class="side-done"><button class="btn primary" id="side-done">完成，看題目</button></div>
    </aside>

    <div>
      <div class="card hero" id="hero"><svg class="art" viewBox="0 0 74 62" aria-hidden="true"><rect x="20" y="4" width="40" height="50" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" transform="rotate(10 40 29)"/><rect x="12" y="7" width="40" height="50" rx="4" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.8"/><path d="M19 17h26M19 24h26M19 31h26M19 38h15" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" opacity=".45"/><path d="M33 41l5 5 13-15" fill="none" stroke="var(--pen)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(38 60 30)"><rect x="56" y="6" width="7" height="40" rx="2" fill="#f2b632"/><path d="M56 46l3.5 8 3.5-8z" fill="#f5dcb0"/><path d="M58.6 51.9l.9 2.1.9-2.1z" fill="var(--ink)"/><rect x="56" y="6" width="7" height="5" fill="var(--pen)"/></g></svg>
        <div><h1>今天，出一份<em>好卷子</em>。</h1><p>從段考題庫挑題，依題型與難度排好，一鍵排版成試卷</p></div>
        <div class="stats"><div class="stat"><b data-count="hs-total">0</b><span>收錄題目</span></div><div class="stat"><b data-count="hs-subj">0</b><span>科目</span></div><div class="stat"><b data-count="hs-year">0</b><span>學年度</span></div></div>
      </div>
      <div class="card tools">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="f-q" placeholder="搜尋題幹或選項文字" aria-label="關鍵字">
        </div>
        <div class="trow" id="trow">
          <div class="tgrp"><span>作答形式</span><div class="seg" id="f-format"></div></div>
          <div class="tgrp" id="w-diff"><span>難度</span><div class="seg" id="f-diff"></div></div>
          <button type="button" class="btn more-toggle" id="more-toggle">更多篩選</button>
        </div>
        <div class="more">
          <label>答案<select id="f-answer">
            <option value="">不限</option>
            <option value="verified,ai">有答案</option>
            <option value="verified">答案卷</option>
            <option value="ai">AI 作答</option>
            <option value="disputed">待判定</option>
            <option value="missing">無答案</option>
          </select></label>
          <label>附圖<select id="f-fig"><option value="">不限</option><option value="1">有圖</option><option value="0">無圖</option></select></label>
          <label>學年度<select id="f-year"><option value="">不限</option></select></label>
          <label class="switch" style="margin-left:auto"><input type="checkbox" id="show-ans">顯示答案</label>
        </div>
      </div>

      <div class="rbar">
        <span id="total">—</span>
        <div class="actives" id="actives"></div>
        <span class="sp"></span>
        <button class="btn rand" id="r-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="8.3" cy="8.3" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.7" cy="15.7" r="1.4" fill="currentColor" stroke="none"/></svg>隨機選題</button>
        <button class="btn" id="sel-page"><span class="lg">本頁</span>全加入</button>
        <button class="btn" id="unsel-page"><span class="lg">本頁</span>全移除</button>
      </div>
      <div class="sortnote muted" style="font-size:12.5px;margin:-4px 2px 6px" id="sortnote">依作答形式（選擇 → 填充 → 應用 → 其他）排列，同一題型由易到難</div>
      <div id="list"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</section>

<!-- ───── 組卷匯出 ───── -->
<section id="tab-compose" hidden>
  <div class="compose">
    <div class="cside">
      <details class="card settings" id="settings" open>
        <summary>試卷設定</summary>
        <div class="form">
          <label class="full">標題<input type="text" id="s-title" value="段考複習卷"></label>
          <label class="full">副標題<input type="text" id="s-subtitle" placeholder="例如：七年級數學 第一次段考範圍"></label>
          <label class="full">輸出<div class="seg" id="s-mode">
            <button data-v="exam" class="on">試題卷</button><button data-v="answer">答案卷</button><button data-v="key">教師解答卷</button></div></label>
          <label>版面<div class="seg" id="s-cols"><button data-v="1" class="on">單欄</button><button data-v="2">雙欄</button></div></label>
          <label>字級<select id="s-fs"><option value="10.5">小</option><option value="11.5" selected>中</option><option value="12.5">大</option></select></label>
          <label>計算／問答作答行數<input type="number" id="s-lines" min="0" max="20" value="4"></label>
          <label>&nbsp;<span class="check"><input type="checkbox" id="s-auto" checked>依題型分大題</span></label>
          <label class="check"><input type="checkbox" id="s-fields" checked>班級座號姓名欄</label>
          <label class="check"><input type="checkbox" id="s-score" checked>顯示配分</label>
          <label class="check full"><input type="checkbox" id="s-appendix">試題卷卷末附參考答案</label>
          <label class="check full"><input type="checkbox" id="s-uniform" checked>選項圖統一大小（題目談倍率、比例、大小時自動維持原卷比例）</label>
        </div>
      </details>
      <div class="card picked">
        <div class="cbar">
          <h3 style="margin:0">已選 <span id="c-n">0</span> 題・總分 <span id="c-total">0</span></h3>
          <span class="sp"></span>

<script>
const $ = s => document.querySelector(s);
const TYPE = {single:"單選", multiple:"多選", tf:"是非", fill:"填充", matching:"配合", calc:"計算", essay:"問答", group:"題組"};
// 作答形式：選擇 → 填充 → 應用 → 其他（與 scripts/build_sort_keys.py 相同）
const FORMATS = [["choice", "選擇", ["single","multiple"]], ["fill", "填充", ["fill"]], ["apply", "應用", ["calc","essay"]], ["other", "其他", ["tf","matching"]]];
const FORMAT_NAME = {0:"選擇題", 1:"填充題", 2:"應用題", 3:"其他題型", 9:"字音字義"};
const FORMAT_NOTE = {3:"題組、是非、配合等", 9:"國字注音、注釋、字音字形字義比較"};
const DEFAULT_SCORE = {single:2, multiple:3, tf:1, fill:2, matching:2, calc:5, essay:5, group:2};
// 難度 1～5 是 AI 依評分規準評的；段考題多半落在 1～3，所以 3 以上就算難
const DIFF = {1:"易", 2:"中", 3:"難", 4:"難", 5:"難"};
const DIFF_OPTS = [["", "全部"], ["1", "易"], ["2", "中"], ["3,4,5", "難"], ["4,5", "挑戰"]];
const DIFF_TIP = "AI 評估的難度：1 直接套公式／記憶、2 標準題、3 需轉換題意或應用、4 多步推理、5 壓軸";
const PAGE = 30;
let TAX = null, page = 0, lastItems = [];
const F = {subject:"數學", sub:"", book:"7-1", pub:"翰林", units:new Set(), formats:new Set(), patterns:new Set(), diff:""};

// ── 題籃（存在瀏覽器）：順序、配分與列表顯示用的摘要 ──
const basket = load("oleqs.basket", {ids:[], score:{}, info:{}});
function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d }catch{ return d } }
function persist(){ try{ localStorage.setItem("oleqs.basket", JSON.stringify(basket)) }catch{} ; refreshCount() }
function inBasket(id){ return basket.ids.includes(id) }
function add(q){
  if (inBasket(q.id)) return;
  basket.ids.push(q.id);
  basket.score[q.id] = basket.score[q.id] ?? DEFAULT_SCORE[q.type] ?? 2;
  basket.info[q.id] = {type:q.type, text:plain(q.stem_html).slice(0,80), unit:q.unit?.title || "", book:q.book, d:q.difficulty || null, k:q.sort_key ?? null};
}
function remove(id){ basket.ids = basket.ids.filter(x => x !== id); delete basket.score[id]; delete basket.info[id] }
function plain(h){ const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.replace(/\s+/g," ").trim() }
function mix(){ const n = {易:0, 中:0, 難:0}; basket.ids.forEach(id => { const d = basket.info[id]?.d; if (d) n[DIFF[d]]++ }); return n }
let lastN = null;
function bump(el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump") }
function refreshCount(){
  const n = basket.ids.length, m = mix();
  $("#cnt").textContent = n; $("#b-n").textContent = n;
  if (lastN !== null && n !== lastN) { bump($("#cnt")); bump($("#b-n")) }
  lastN = n;
  $("#b-mix").textContent = m.易 + m.中 + m.難 ? `易 ${m.易}・中 ${m.中}・難 ${m.難}` : "";
  $("#basket").hidden = !n || $("#tab-pick").hidden || !$("#drawer").hidden || !$("#rand").hidden;
}
// ── 隨機選題 ──
const SPREAD_OPTS = () => [...(F.subject === "數學" ? [["pattern", "平均分配到各題型"]] : []), ["unit", "平均分配到各單元"], ["none", "不限"]];
const MIX_OPTS = [["none", "不指定"], ["even", "均衡 3:4:3"], ["easy", "偏易 5:4:1"], ["hard", "偏難 2:4:4"]];
const R = {spread:"pattern", mix:"none", items:[]};
function openRand(){
  const book = TAX.books.find(b => `${b.grade}-${b.semester}` === F.book)?.name || "";
  const chips = [...$("#actives").querySelectorAll("button")].map(b => b.textContent);
  $("#r-scope").innerHTML = `${esc(F.subject)}${F.sub ? "・" + esc(F.sub) : ""}・${esc(book)}${F.subject === "英語" ? "" : "・" + esc(F.pub)}<small>${chips.length ? esc(chips.join("、")) : "整冊、不限作答形式"}</small>`;
  if (!SPREAD_OPTS().some(o => o[0] === R.spread)) R.spread = SPREAD_OPTS()[0][0];
  seg($("#r-spread"), SPREAD_OPTS(), R.spread, v => R.spread = v);
  $("#w-rmix").hidden = F.subject !== "數學";          // 目前只有數學有難度
  if (F.subject !== "數學") R.mix = "none";
  seg($("#r-mix"), MIX_OPTS, R.mix, v => R.mix = v);
  $("#rand").hidden = $("#drawer-bg").hidden = false; $("#basket").hidden = true; document.body.style.overflow = "hidden";
}
function closeRand(){ $("#rand").hidden = $("#drawer-bg").hidden = true; document.body.style.overflow = ""; refreshCount() }
$("#r-quick").onclick = e => { const b = e.target.closest("button"); if (b) $("#r-n").value = b.dataset.v };
async function doRand(){
  const n = Math.max(1, Math.min(100, +$("#r-n").value || 10)); $("#r-n").value = n;
  $("#r-go").disabled = true; $("#r-go").classList.add("spin"); $("#r-go span").textContent = "抽題中…"; $("#r-list").innerHTML = ""; $("#r-note").hidden = true;
  try {
    const out = await (await api("/api/random", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({...filters(), n, spread:R.spread, mix:R.mix, exclude:$("#r-excl").checked ? basket.ids : []})})).json();
    R.items = out.items;
    $("#r-pool").textContent = `從 ${out.pool.toLocaleString()} 題中抽出 ${out.items.length} 題（題組整組計算）`;
    $("#r-note").textContent = out.note || ""; $("#r-note").hidden = !out.note;
    const m = {易:0, 中:0, 難:0}; out.items.forEach(q => { if (q.difficulty) m[DIFF[q.difficulty]]++ });
    $("#r-list").innerHTML = out.items.map((q, i) => `<div class="di deal" style="--i:${Math.min(i, 20)}"><span class="no">${i + 1}</span>
      <div><div class="meta"><span>${TYPE[q.type] || ""}</span>${q.difficulty ? `<span class="diff d${q.difficulty}">${[1,2,3,4,5].map(k => `<i class="${k <= q.difficulty ? "f" : ""}"></i>`).join("")}<b>${DIFF[q.difficulty]}</b></span>` : ""}<span>${esc(unitLabel(q))}</span>${q.pattern ? `<span>${esc(q.pattern.name)}</span>` : ""}</div>
        <div class="txt">${q.stem_html}</div></div><span></span></div>`).join("")
      + (m.易 + m.中 + m.難 ? `<div class="mixtext" style="padding:8px">難度　易 ${m.易}・中 ${m.中}・難 ${m.難}</div>` : "");
    $("#r-foot").hidden = !out.items.length;
    $("#r-list").scrollIntoView({block:"start", behavior:"smooth"});
  } catch (e) { $("#r-note").textContent = "抽題失敗：" + e.message; $("#r-note").hidden = false }
  $("#r-go").disabled = false; $("#r-go").classList.remove("spin"); $("#r-go span").textContent = "抽題";
}
function addRand(go){
  R.items.forEach(add); persist(); renderList();
  toast(`已加入 ${R.items.length} 題`); closeRand();
  if (go) show("compose");
}
$("#r-open").onclick = openRand;
$("#r-close").onclick = closeRand;
$("#r-go").onclick = doRand;
$("#r-again").onclick = doRand;
$("#r-add").onclick = () => addRand(false);
$("#r-add-go").onclick = () => addRand(true);

// ── 已選題目面板 ──
function openDrawer(){ renderDrawer(); $("#drawer").hidden = $("#drawer-bg").hidden = false; $("#basket").hidden = true; document.body.style.overflow = "hidden"; $("#d-close").focus() }
function closeDrawer(){ $("#drawer").hidden = $("#drawer-bg").hidden = true; document.body.style.overflow = ""; refreshCount() }
function renderDrawer(){
  const n = basket.ids.length, m = mix();
  $("#d-n").textContent = n;
  const total = basket.ids.reduce((a, id) => a + (+basket.score[id] || 0), 0);
  $("#d-mix").textContent = `總分 ${total}` + (m.易 + m.中 + m.難 ? `・易 ${m.易}・中 ${m.中}・難 ${m.難}` : "");
  $("#d-list").innerHTML = n ? basket.ids.map((id, i) => { const f = basket.info[id] || {};
    return `<div class="di" data-id="${esc(id)}" style="--i:${Math.min(i, 15)}"><span class="no">${i + 1}</span>
      <div><div class="meta"><span>${TYPE[f.type] || ""}</span>${f.d ? `<span class="diff d${f.d}">${[1,2,3,4,5].map(k => `<i class="${k <= f.d ? "f" : ""}"></i>`).join("")}<b>${DIFF[f.d]}</b></span>` : ""}<span>${esc(f.book || "")} ${esc(f.unit || "")}</span></div>
        <div class="txt">${esc(f.text)}</div></div>
      <button class="rm" title="移除" aria-label="移除第 ${i + 1} 題">✕</button></div>` }).join("")
    : '<div class="dempty">還沒有選題</div>';
}
$("#b-view").onclick = openDrawer;
$("#basket .n").onclick = openDrawer;
$("#d-close").onclick = closeDrawer;
$("#drawer-bg").onclick = () => { if (!$("#rand").hidden) closeRand(); else closeDrawer() };
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#rand").hidden) closeRand(); else if (!$("#drawer").hidden) closeDrawer() });
$("#d-go").onclick = () => { closeDrawer(); show("compose") };
$("#d-list").onclick = e => { const b = e.target.closest(".rm"); if (!b) return;
  const id = b.closest(".di").dataset.id; remove(id); persist(); renderDrawer();
  // 選題清單上的卡片同步取消
  const card = document.querySelector(`.q[data-id="${CSS.escape(id)}"]`);
  if (card) { card.classList.remove("sel"); const a = card.querySelector(".add"); a.textContent = "＋ 加入"; a.setAttribute("aria-pressed", false) } };
let dClearArmed = 0;
$("#d-clear").onclick = () => {
  if (Date.now() - dClearArmed > 3000) { dClearArmed = Date.now(); $("#d-clear").textContent = "再點一次清空"; setTimeout(() => $("#d-clear").textContent = "清空", 3000); return }
  basket.ids = []; basket.score = {}; basket.info = {}; persist(); renderDrawer(); renderList(); $("#d-clear").textContent = "清空" };
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800) }
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }

// ── 分頁籤：底線滑到目前的分頁 ──
function moveInk(){
  const on = document.querySelector("nav.tabs button.on"), ink = $("#tab-ink"); if (!on) return;
  ink.style.width = on.offsetWidth - 20 + "px"; ink.style.transform = `translateX(${on.offsetLeft + 10}px)`;
}
addEventListener("resize", moveInk);
document.fonts?.ready.then(moveInk);
// 數字從 0 跑到目標值
function countUp(el, to){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) { el.textContent = to.toLocaleString(); return }
  const t0 = performance.now(), dur = 1100;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(to * e).toLocaleString(); if (k < 1) requestAnimationFrame(step) };
  requestAnimationFrame(step);
}
// 加入題籃：一張小紙片從按鈕飛進底部題籃
function fly(from){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches || !from) return;
  const target = $("#basket").hidden ? $("#cnt") : $("#basket .n svg");
  const a = from.getBoundingClientRect(), b = target.getBoundingClientRect();
  const el = document.createElement("div"); el.className = "fly"; el.textContent = "✓";
  el.style.left = a.left + a.width / 2 - 13 + "px"; el.style.top = a.top + a.height / 2 - 16 + "px";
  document.body.appendChild(el);
  const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
  el.animate([
    {transform:"translate(0,0) scale(.6) rotate(0)", opacity:0},
    {transform:`translate(${dx * .35}px,${dy * .35 - 70}px) scale(1.1) rotate(-12deg)`, opacity:1, offset:.35},
    {transform:`translate(${dx}px,${dy}px) scale(.35) rotate(-28deg)`, opacity:.3}
  ], {duration:720, easing:"cubic-bezier(.3,.7,.3,1)"}).onfinish = () => el.remove();
}

// ── 分頁籤 ──
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => show(b.dataset.tab));
$("#go-compose").onclick = () => show("compose");
function show(tab){
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  for (const t of ["pick","compose","papers"]) $("#tab-"+t).hidden = t !== tab;
  moveInk();
  refreshCount();
  if (tab === "compose") { renderItems(); preview() }
  if (tab === "papers") loadPapers();
  scrollTo(0, 0);
}

// ── 篩選 ──
async function api(path, opt){ const r = await fetch(path, opt); if (!r.ok) throw new Error((await r.text()).slice(0,200)); return r }
function seg(el, list, val, onPick){
  el.innerHTML = list.map(([v, t]) => `<button type="button" data-v="${esc(v)}" class="${v === val ? "on" : ""}" aria-pressed="${v === val}">${esc(t)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b) });
    onPick(b.dataset.v) };
}
async function init(){
  TAX = await (await api("/api/taxonomy")).json();
  $("#stat").textContent = `收錄 ${TAX.total.toLocaleString()} 題`;
  countUp($('[data-count="hs-total"]'), TAX.total);
  countUp($('[data-count="hs-subj"]'), TAX.subjects.length);
  countUp($('[data-count="hs-year"]'), TAX.years.length);
  moveInk();
  seg($("#f-subject"), TAX.subjects.map(s => [s.name, s.name]), F.subject, v => { F.subject = v; F.sub = ""; subjectChanged() });
  seg($("#f-book"), TAX.books.map(b => [`${b.grade}-${b.semester}`, b.name]), F.book, v => { F.book = v; loadUnits() });
  seg($("#f-pub"), TAX.publishers.map(p => [p, p]), F.pub, v => { F.pub = v; loadUnits() });
  seg($("#f-diff"), DIFF_OPTS, F.diff, v => { F.diff = v; search(0) });
  // 作答形式可複選：再點一次取消
  $("#f-format").innerHTML = FORMATS.map(([k, t]) => `<button type="button" data-v="${k}" aria-pressed="false">${t}</button>`).join("");
  $("#f-format").onclick = e => { const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.v; F.formats.has(k) ? F.formats.delete(k) : F.formats.add(k);
    b.classList.toggle("on", F.formats.has(k)); b.setAttribute("aria-pressed", F.formats.has(k)); search(0) };
  $("#f-year").innerHTML = [["","不限"], ...TAX.years.map(y => [y, y])].map(([v,t]) => `<option value="${v}">${t}</option>`).join("");
  for (const id of ["#f-answer","#f-fig","#f-year"]) $(id).onchange = () => search(0);
  let tq; $("#f-q").oninput = () => { clearTimeout(tq); tq = setTimeout(() => search(0), 350) };
  $("#u-all").onclick = () => { F.units.clear(); F.patterns.clear(); renderUnits(); search(0) };
  $("#u-hide0").onchange = () => renderUnits();
  $("#show-ans").onchange = () => renderList();
  $("#sel-page").onclick = () => { lastItems.forEach(add); persist(); renderList() };
  $("#unsel-page").onclick = () => { lastItems.forEach(q => remove(q.id)); persist(); renderList() };
  $("#side-toggle").onclick = () => setSide($("#side").classList.contains("closed"));
  $("#side-done").onclick = () => { setSide(false); $("#tab-pick").scrollIntoView() };
  $("#more-toggle").onclick = () => { const o = $(".tools").classList.toggle("open"); $("#more-toggle").textContent = o ? "收合篩選" : "更多篩選" };
  // 手機：試卷設定預設收合，讓已選題目與預覽在前面
  if (matchMedia("(max-width:1000px)").matches) $("#settings").open = false;
  refreshCount();
  subjectChanged();
}
function subjectChanged(){
  const s = TAX.subjects.find(x => x.name === F.subject);
  $("#w-sub").hidden = !s.subs.length;
  seg($("#f-sub"), [["", "全部"], ...s.subs.map(x => [x, x])], F.sub, v => { F.sub = v; loadUnits() });
  // 英語用跨版本主題；數學與自然各版本節次一致，版本只影響章節名稱
  $("#w-pub").hidden = F.subject === "英語";
  $("#w-diff").hidden = F.subject !== "數學";          // 目前只有數學評過難度
  if (F.subject !== "數學" && F.diff) { F.diff = ""; seg($("#f-diff"), DIFF_OPTS, "", v => { F.diff = v; search(0) }) }
  loadUnits();
}

let UNITS = [];
async function loadUnits(){
  const [g, s] = F.book.split("-");
  const qs = new URLSearchParams({subject:F.subject, grade:g, semester:s, publisher:F.pub});
  if (F.sub) qs.set("sub", F.sub);

function renderUnits(){

    else { F.units.delete(c); const u = UNITS.find(x => x.key === c); (u?.patterns || []).forEach(x => F.patterns.delete(x.key)) }

// 已套用的篩選（可點掉）
function renderActives(){
  const chips = [];

  F.units.forEach(k => chips.push(["unit", k, name(k)]));

  F.formats.forEach(k => chips.push(["fmt", k, FORMATS.find(f => f[0] === k)[1] + "題"]));
  if (F.diff) chips.push(["diff", F.diff, "難度：" + DIFF_OPTS.find(d => d[0] === F.diff)[1]]);

// 目前的篩選條件（選題清單與隨機選題共用）
function filters(){
  const [g, s] = F.book.split("-");
  const f = {subject:F.subject, grade:+g, semester:+s};
  if (F.sub) f.sub = F.sub;
  if (F.units.size) { f.units = [...F.units]; f.publisher = F.pub }
  if (F.formats.size) f.types = FORMATS.filter(x => F.formats.has(x[0])).flatMap(x => x[2]);
  if (F.patterns.size) f.patterns = [...F.patterns];
  if (F.diff) f.difficulty = F.diff.split(",").map(Number);
  if ($("#f-answer").value) f.answer = $("#f-answer").value.split(",");
  if ($("#f-fig").value) f.has_figure = $("#f-fig").value === "1";
  if ($("#f-year").value) f.year = +$("#f-year").value;
  if ($("#f-q").value.trim()) f.q = $("#f-q").value.trim();
  return f;
}
let searchSeq = 0;
async function search(p){
  page = p;
  const f = filters();
  const qs = new URLSearchParams({limit:PAGE, offset:p*PAGE});
  for (const [k, v] of Object.entries(f)) qs.set(k === "types" ? "type" : k, Array.isArray(v) ? v.join(",") : v);
  renderActives(); summarizeSide();
  $("#list").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const seq = ++searchSeq;                 // 連續改篩選時，只採用最後一次查詢的結果
  let data;
  try { data = await (await api("/api/questions?" + qs)).json() }
  catch (e) { if (seq === searchSeq) $("#list").innerHTML = `<div class="empty"><b>載入失敗</b>${esc(e.message)}</div>`; return }
  if (seq !== searchSeq) return;
  lastItems = data.items;
  $("#total").textContent = `${data.total.toLocaleString()} 題`;
  $("#side-done").textContent = `完成，看 ${data.total.toLocaleString()} 題`;
  renderList(); renderPager(data.total);
}

function optCols(opts){ if (opts.some(o => o.asset_file)) return "c2"; const m = Math.max(...opts.map(o => (o.content||"").length)); return m <= 7 ? "c4" : m <= 20 ? "" : "c1" }
// 同一題的選項圖排成一致的大小（與排版 lib/render.ts 同規則；螢幕上以圖檔像素為基準）
const KEEP_SCALE = /倍|放大|縮小|比例|大小|面積|長度|尺寸/;
function sizeOpts(box){
  if (KEEP_SCALE.test(box.closest(".q")?.querySelector(".stem")?.textContent || "")) return uniformScale(box);
  const imgs = [...box.querySelectorAll("img")]; if (!imgs.length) return;
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.addEventListener("load", r); i.addEventListener("error", r) }))).then(() => {
    const ds = imgs.map(i => [i.naturalWidth, i.naturalHeight]); if (ds.some(([w, h]) => !w || !h)) return;
    if (Math.min(...ds.map(d => d[1])) >= 100) {        // 圖片選項：同一高度
      const hs = ds.map(d => d[1]).sort((a, b) => a - b);
      const H = Math.min(180, Math.max(80, hs[Math.floor(hs.length / 2)]));
      imgs.forEach(i => { i.style.height = H + "px"; i.style.width = "auto" });
    } else uniformScale(box);                             // 文字式小圖：維持比例
  });
}
// 維持原卷比例；格子放不下時整題一起等比縮小，而不是只縮最寬的那張
function uniformScale(box){
  const imgs = [...box.querySelectorAll("img")];
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.addEventListener("load", r); i.addEventListener("error", r) }))).then(() => {
    const maxW = Math.max(...imgs.map(i => i.naturalWidth)); if (!maxW) return;
    imgs.forEach(i => { if (i.naturalWidth) i.style.width = `calc(min(100%, ${maxW}px) * ${i.naturalWidth / maxW})` });
  });
}

function renderPager(total){
  const n = Math.ceil(total / PAGE); if (n <= 1) { $("#pager").innerHTML = ""; return }
  const pages = new Set([0, n - 1, page - 2, page - 1, page, page + 1, page + 2].filter(p => p >= 0 && p < n));
  let html = `<button class="btn" data-p="${page - 1}" ${page === 0 ? "disabled" : ""}>‹ 上一頁</button>`, prev = -1;
  [...pages].sort((a, b) => a - b).forEach(p => {
    if (p - prev > 1) html += '<span class="muted">…</span>';
    html += `<button class="btn ${p === page ? "on" : ""}" data-p="${p}">${p + 1}</button>`; prev = p;
  });
  html += `<button class="btn" data-p="${page + 1}" ${page >= n - 1 ? "disabled" : ""}>下一頁 ›</button>`;
  $("#pager").innerHTML = html;
  $("#pager").onclick = e => { const b = e.target.closest("button"); if (b && !b.disabled && +b.dataset.p !== page) { search(+b.dataset.p); scrollTo(0, 0) } };

async function loadPapers(){
  const list = await (await api("/api/papers")).json();
  $("#papers").innerHTML = list.length ? "<tr><th>標題</th><th>科目</th><th>題數</th><th>總分</th><th>更新時間</th><th></th></tr>" + list.map(p =>
    `<tr data-id="${esc(p.id)}"><td>${esc(p.title)}</td><td>${esc(p.subject || "")}</td><td>${p.count}</td><td>${p.total_score}</td>
     <td class="muted">${new Date(p.updated_at).toLocaleString()}</td>
     <td style="white-space:nowrap"><button class="btn" data-a="open">載入編輯</button> <button class="btn link" data-a="del" style="color:var(--bad)">刪除</button></td></tr>`).join("")
    : '<tr><td class="empty"><b>還沒有存過試卷</b>在「組卷匯出」按「存成我的試卷」</td></tr>';
}
$("#papers").onclick = async e => { const b = e.target.closest("button"); if (!b) return;
  const id = b.closest("tr").dataset.id;
  if (b.dataset.a === "del") {
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "確定刪除？"; setTimeout(() => { b.dataset.armed = ""; b.textContent = "刪除" }, 3000); return }
    await api("/api/papers/" + id, {method:"DELETE"}); loadPapers(); return }
  const p = await (await api("/api/papers/" + id)).json();
  basket.ids = []; basket.score = {}; basket.info = {};
  for (const it of p.items) { add(it.question); basket.score[it.question.id] = it.score }
  persist(); $("#s-title").value = p.title; const st = p.settings || {};
  $("#s-subtitle").value = st.subtitle || ""; $("#s-uniform").checked = st.uniform_option_images !== false; show("compose");
};

init().catch(e => { $("#list").innerHTML = `<div class="empty"><b>連不上伺服器</b>${esc(e.message)}</div>` });
</script>
</body>
</html>
